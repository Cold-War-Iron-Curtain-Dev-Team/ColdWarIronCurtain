 tutorial.1000.t:0 "[GetNewspaperHeader]Cold War: The Iron Curtain チュートリアル"
 tutorial.1000.d:0 "Cold War: The Iron Curtain MODにようこそ。まずチュートリアルをお読み下さい。ヘリコプターや核ミサイル、宣戦布告などの、新たなシステムの説明が書かれています。"
 tutorial.1000.a:0 "新しい機能を教えて"
 tutorial.1000.b:0 "遊び方はもう知ってるよ"
 tutorial.1.t:0 "チュートリアルメニュー"
 tutorial.1.d:0 "このMODの知りたいことを選んでください。"
 tutorial.2.t:0 "チュートリアルメニュー - ページ2"
 tutorial.2.d:0 "このMODの知りたいことを選んでください。"
 tutorial.1.dd:0 "次のページ"
 tutorial.1.a:0 "デフコンと宣戦布告について教えて"
 tutorial.1.b:0 "核ミサイルについて教えて"
 tutorial.1.c:0 "ヘリコプターについて教えて"
 tutorial.1.f:0 "NATOについて教えて"
 tutorial.1.g:0 "化学兵器について教えて"
 tutorial.1.e:0 "もう何も知りたいことはないよ"
 tutorial.1.h:0 "戻る"
 tutorial.go:0 "続けて"
 tutorial.back:0 "戻る"
 tutorial.menu:0 "メニューに戻る"
 tutorial.11.t:0 "デフコンメニュー"
 tutorial.11.d:0 "DEFCON（デフコン）はこのMODに導入された新しいメカニズムで、理解するのに最初は、戸惑うかもしれません。DEFCON（デフコン）は、宣戦布告や他の国との軍事的なやりとりに影響します。"
 tutorial.12.t:0 "DEFCON V"
 tutorial.12.d:0 "最初、私たちはDEFCON5にいます。これは平時を意味し、戦争行為を最低限に留めている状態です。既にDEFCON5が設定されていて、取れる軍事行動を制限します。国際緊張度が50％を越えるか、宣戦を宣言したりされたりするイベントが起こるまでは宣戦布告を行うことはできません。例としてアメリカが参戦を呼ばれる朝鮮戦争を取ってみましょう。これはDEFCON3の宣言を解禁します。完全な宣戦布告ができないため代理戦争はより重要になりますが、そこでもできることはレンドリースと義勇兵の派遣だけです。"
 tutorial.13.t:0 "DEFCON IV"
 tutorial.13.d:0 "デフコン4は国際緊張度が25％を上回ると宣言可能になります。代理戦争へより多くの義勇兵とレンドリースを送ることができるようになります。またDEFCONが減少するにつれ外国への影響力投射も可能になっていきます。"
 tutorial.14.t:0 "DEFCON III"
 tutorial.14.d:0 "DEFCON3は自体が深刻になってきた証です。戦争中（世界大戦ではありません。代理戦争などです）にはDEFCON3を宣言することができます。国際緊張度は50%を上回らなくてはなりません。DECDONが3になるとさらに多くの義勇兵とレンドリースを送ることができますが、それ以上に自国から宣戦を行うことができます。DEFCON2には75%以上の国際緊張度が必要です。"
 tutorial.15.t:0 "DEFCON II"
 tutorial.15.d:0 "DEFCON2ではこれまでより一層多くの義勇兵とレンドリースを送ることができ、また戦争の正当化も可能になります。DEFCON1の宣言には95％以上の国際緊張度が必要です。"
 tutorial.16.t:0 "DEFCON 1"
 tutorial.16.d:0 "DEFCON1では最大限の義勇兵とレンドリースを送ることができ、また自国からの宣戦の可能になります。これは全面戦争を招き、恐らくは第三次世界大戦と世界の終末の勃発に繋がるでしょう。"
 tutorial.17.t:0 "デフコン: まとめ"
 tutorial.17.d:0 "このように段階的に機能します。このチュートリアルがお役に立てれば幸いです。さあ、熱核戦争を戦い抜きましょう！\n\n\n-開発チームより"
 tutorial.22.t:0 "核ミサイル"
 tutorial.22.d:0 "「核ミサイル」はこのMODに導入された新しいメカニズムで、理解するのに最初は戸惑うかもしれません。核爆弾には、核分裂反応を利用した原子爆弾と核融合反応を利用した水素爆弾の2種類があり、また核ミサイルには潜水艦発射弾道ミサイル（SLBM）、短距離弾道ミサイル（SRBM）、中距離弾道ミサイル（IRBM）、大陸間弾道ミサイル（ICBM）の4種類があります。"
 tutorial.23.t:0 "核ミサイル II"
 tutorial.23.d:0 "SLBMは弾道ミサイル潜水艦により世界のどこからでも発射することが可能です。短距離ミサイルであるSRBMは、射程が数百キロメートルしかありません（例: 西ドイツからポーランド西部まで）。IRBMの射程は数百キロメートルから数千キロメートルに及びます（例: フランス東部からモスクワまで）。ICBMは、事実上世界のあらゆるものを攻撃可能です（例: 米国東部からロシア西部まで）。ここでは核ミサイルの製造方法と運用方法について説明します。"
 tutorial.24.t:0 "核ミサイル: ステップ1"
 tutorial.24.d:0 "ステップ1 研究タブを開くと一番最後にこのタブを見つけられるでしょう。放射線シンボルのそれがWMD（大量破壊兵器）ツリータブです。クリックしてWMDツリーを見てみましょう。"
 tutorial.25.t:0 "核ミサイル: ステップ2"
 tutorial.25.d:0 "ステップ2 WMDタブでは全てのミサイルと爆弾を見ることができます。ミサイルか爆弾を研究するためクリックしてみてください。そうすることでミサイルが使えるようになります。"
 tutorial.26.t:0 "核ミサイル: ステップ3"
 tutorial.26.d:0 "ステップ3 ミサイルの研究が終わったならば生産タブを見てください。そこでは全てのミサイルと爆弾が航空機の下にあるはずです。望むままにミサイルを生産してください。"
 tutorial.27.t:0 "核ミサイル: ステップ4"
 tutorial.27.d:0 "ステップ4 ミサイル建設が終わると、次はどこにそれができたか見つける必要があるはずです。建設されたミサイルは空港にスポーンし、任意の空港に配備することができます。新しい航空団を組織してください。"
 tutorial.28.t:0 "核ミサイル: ステップ5"
 tutorial.28.d:0 "ステップ5 ミサイルを空港に配備すると、空港からミサイルの射程を見ることができます。より長射程のミサイルが必要ならば、研究を進めて最新のミサイルを開発するか、または長射程のより大きなミサイルを開発してください。"
 tutorial.29.t:0 "核ミサイル: ステップ6 (SLBM)"
 tutorial.29.d:0 "（SLBMのみ）ステップ6 SRBMは空母の上の艦載機のように機能します。新しい艦級の弾道ミサイル潜水艦を建造しなくてはなりません。その後に空母に艦載機を搭載するようにミサイルを搭載してください。"
 tutorial.30.t:0 "核ミサイル: ステップ7"
 tutorial.30.d:0 "ステップ7 これらのステップを踏めば、これで熱核戦争を戦うことができるようになったはずです。核攻撃のためにはプロヴィンスを開き、バニラの核攻撃ボランを押してください。これでプロヴィンスからミサイルが発射され、核の炎が光り核戦争が始まります。"
 tutorial.31.t:0 "核ミサイル　まとめ"
 tutorial.31.d:0 "このチュートリアルがお役に立てれば幸いです。さあ、世界にアルマゲドン（最終戦争）を起こしに行きましょう！\n\n\n-開発チームより"
 tutorial.33.t:0 "ヘリコプター"
 tutorial.33.d:0 "ヘリコプターはこのMODに導入された新しいメカニズムで、理解するのに最初は戸惑うかもしれません。ヘリコプターには貨物ヘリ、汎用ヘリ、攻撃ヘリ、軽攻撃/偵察ヘリ、対潜ヘリの4種類があります。"
 tutorial.34.t:0 "貨物ヘリ"
 tutorial.34.d:0 "貨物ヘリは部隊へ物資を供給します。"
 tutorial.35.t:0 "汎用ヘリ"
 tutorial.35.d:0 "汎用ヘリは部隊の高速短距離輸送を可能にし、ドアガンやガンポッドによって敵に大きな損害を強いることができます。汎用ヘリはまた新しい航空騎兵師団テンプレートの編制に必要です。"
 tutorial.36.t:0 "攻撃ヘリ"
 tutorial.36.d:0 "攻撃ヘリは陸上部隊を攻撃し航空機にもいくらかの損害を与えます。攻撃ヘリはまた師団編制の一部に使われ、攻撃へのバフを付与します。"
 tutorial.37.t:0 "軽攻撃/偵察ヘリ"
 tutorial.37.d:0 "軽攻撃/偵察ヘリは殆ど偵察用ですが、陸上部隊へも多少の攻撃を行うことができます。偵察ヘリは軽量で高速です。"
 tutorial.38.t:0 "Anti-Submarine Warfare"
 tutorial.38.d:0 "対潜ヘリは舟艇や潜水艦を攻撃する唯一のヘリコプターです。対潜ヘリはヘリ空母や一般的な空母に搭載することもできますが、一般的な空母に搭載できる機数には限りがあります。"
 tutorial.39.t:0 "ヘリコプター II"
 tutorial.39.d:0 "ヘリコプターは素早く安いですが、航空機ほどには素早くないためすぐに撃墜されてしまいます。何をするかによって賢く使い分けてください。"
 tutorial.40.t:0 "ヘリコプター　まとめ"
 tutorial.40.d:0 "このチュートリアルがお役に立てれば幸いです。さあ、ヘリコプターで「フォーチュネイト・サン」を流しましょう！\n\n\n-開発チームより"
 tutorial.44.t:0 "NATO"
 tutorial.44.d:0 "NATOは3.10アップデートで追加された防衛同盟です。NATOは陣営スクリーンには現れず、それぞれの国で国家精神として確認できます。NATO加盟国が攻撃された場合、他の国々にも参戦する選択肢が与えられます。参戦するかどうかは敵国の軍事力に依存します。"
 tutorial.55.t:0 "化学兵器"
 tutorial.55.d:0 "化学兵器は、WMD技術タブにある研究を進めることでアンロックできる兵器です。指揮官と共に兵器を用いるには、1つの兵器につき50ユニット生産する必要があります。\n\nこれにはthe Walking the TigerのDLCが必要です。"
 tutorial.211.d:0 "CWICは、新しい大量破壊兵器システムを導入し、バニラのクリック方式よりも複雑で戦略的な核兵器の使用を可能にしています。GUIには8つの基本パーツがあります。\n1.　左上の画面は、世界の核保有国、言い換えれば、誰が核武装したかを示しています。\n2.　デフコン画面は、デフコンのレベルを示すもので、アメリカ、ソ連、中華人民共和国のみで利用可能です。レベルを下げると、より高い緊張の段階を示すことになります。\n\n3.　GUIの真ん中には、バニラの核兵器からICBMまで、各種大量破壊兵器の保有数を表示しています。右端の化学兵器リストは製作途中で、非核化については……まあ、する人はいないでしょう。\n4.　3で説明した部分の下には、レベル1、2、3の3つのオプションがあり、それぞれ核兵器の使用量や目標が異なります。レベル1は、範囲内の敵の首都に対する基本的な攻撃です。レベル2は、レベル1に加え、人口や産業の中心地などを目標に追加したものです。レベル3は、完全な、全面的な核攻撃で、次の2つのうちの1つが必要です。ICBM技術、またはソ連とアメリカがそれぞれキューバとトルコにミサイルを保有していることです。\n5.　発射のためのすべての条件が満たされると、灰色で表示されている大きな核ボタンが赤くなり、地球規模の熱核戦争をプレイすることができるようになります。\n6.　大きなボタンの下には、攻撃に必要な核兵器のリストが表示されます。\n7.　その左側には、ストライキのための国家目標リストがあります。\n8.　その左側には、ミサイルの射程内にある敵国のリストが表示されます。\n\nこのシステムでバグや問題が発生した場合、遠慮なくsteamやdiscordで報告してください。\n\nそれでは、爆撃を楽しんで！"
 TUTOR.666.t:0 "§Rバチカンでプレイしないで§!"
 TUTOR.666.d:0 "§Rバチカンは、ゲームを裏でコントロールし、決定を下すためのグローバル・ハブとして予定されています。バチカンとしてプレイすると、クラッシュ、エラー、バグが発生し、ゲームがまったく動かなくなってしまいます。§!"
 TUTOR.666.a:0 "よし、くそ、落ち着け。もうダメになっちゃったから、ゲームを再開するよ。"