 POLITICS_VUONG_CHI_SINH_DESC:0 "§YThe legendary Meo King of Hà Giang§L\nVương Chí Sình was a singular figure in the history of French Indochina, ruling the Hmong highlands as a de facto independent nation. Born as Vàng Seo Lử in 1886, he inherited his father’s leadership and fought to protect his people from foreign domination. Unlike other rulers in Vietnam, his Kingdom of the Meo was never fully subjected to French colonial rule, maintaining autonomy through strategic diplomacy and fierce resistance.\nDuring World War II, Vương Chí Sình rallied the Hmong against Japanese and French incursions, cementing his status as a protector of the northern highlands. After the August Revolution, he swore allegiance to Ho Chi Minh, who adopted him as a sworn brother and gave him the name Vương Chí Thành. He later became a member of the National Assembly of the Democratic Republic of Vietnam, advocating for Hmong representation in the new socialist order. Though his kingdom faded into history, his legacy as a leader who navigated the complexities of war, colonialism, and revolution remains a defining chapter in Vietnam’s struggle for independence."
 POLITICS_DUONG_TRUNG_NHAN_DESC:0 "§YThe Tusi of Mèo Vạc§L\nDương Trung Nhân was the defiant rival of the Vương dynasty. Born in 1912 to Dương Tự Nghĩa, he inherited his family’s resentment toward the Vươngs, whose power had overshadowed them for generations. Unlike Vương Chí Sình, who sided with the Viet Minh, Dương Trung Nhân aligned with the Republic of China, adopting Tridemism and vowing to liberate the Hmong from both the Vương family’s rule and communist influence. As a staunch anti-communist, he sought to establish an independent Hmong Free State under his own leadership, positioning himself as the last hope for a non-communist future in the highlands. His struggle against the Vương dynasty and the Viet Minh made him a key player in the fragmented politics of the northern borderlands."