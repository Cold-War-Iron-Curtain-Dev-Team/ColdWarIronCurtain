l_japanese:
 veday.1.d:0 "Two decades have passed since the Soviet Union played the decisive role in the defeat of Nazi Germany, securing peace for Europe and the world. The Great Patriotic War, which claimed the lives of millions, remains a defining chapter in Soviet history—one of sacrifice, resilience, and ultimate triumph.\n\nToday, the Soviet Union stands rebuilt and stronger than ever. Its cities, once devastated by war, have been restored, its industries drive progress, and its people remain steadfast in their commitment to peace and security. Across the nation, ceremonies honor the heroes who fought on the front lines and those who toiled on the home front to achieve victory.\n\nAs the world reflects on this historic anniversary, the Soviet Union reaffirms its dedication to international peace, ensuring that the sacrifices of the past will never be in vain. The spirit of victory endures."
 veday.2.d:0 "Moscow stands in solemn pride as the Soviet Union marks four decades since the triumph of 1945. Red Square, the heart of the nation, is filled with the sights and sounds of both remembrance and unwavering strength.\n\nThe military parade marches forward with precision, showcasing the might of the Soviet Armed Forces—soldiers, tanks, and missile carriers move past Lenin’s Mausoleum, a testament to the power that has safeguarded peace since the Great Patriotic War’s end. Above, Soviet aircraft roar through the skies, reminding the world that the Soviet Army remains ever-vigilant.\n\nYet, at the heart of this celebration are the veterans. With medals gleaming in the May sunlight, they march proudly, their sacrifices honored by the cheering crowds and the young Komsomol members who carry their legacy forward.\n\nAs fireworks illuminate the Kremlin towers, one truth remains: the victory of 1945 was not just a moment in history—it is the foundation of the Soviet Union’s unshakable future."
 veday.3.d:0 "Moscow stands proud as the Soviet Union marks forty-five years since the triumph of 1945. Red Square is filled with the sights and sounds of history and power—marching soldiers, the rumble of tanks, and the roar of Soviet jets soaring overhead. The military parade moves in perfect unison, a reminder to the world that the Soviet Army remains strong and vigilant.\n\nAt the heart of the celebration, the veterans of the Great Patriotic War march once more, their chests adorned with medals, their faces reflecting both pride and memory. The crowds cheer them on, knowing that without their sacrifice, there would be no Soviet Union today.\n\nAs the final formations pass and fireworks illuminate the Kremlin, the message is clear: the victory of 1945 is not just a memory—it is a living legacy, and the strength of the Soviet Union endures."
 veday.4.d:0 "Thirty years after the triumph of 1945, Moscow stands at the heart of a solemn yet hopeful celebration. This year, Red Square is not filled with the rumble of tanks or the march of soldiers, but with the voices of youth and the unwavering presence of those who secured victory.\n\nTens of thousands of Komsomol members flood the streets, carrying red banners and portraits of fallen heroes. They walk alongside veterans, the very men and women who once stormed Berlin, their medals gleaming in the May sun. Songs of victory echo through the city as the young pledge to carry forward the ideals of those who came before them.\n\nIn the evening, as the Kremlin towers glow against the night sky, and fireworks light up Moscow—a symbol that the sacrifices of the past were not in vain, and that the future remains firmly in the hands of the Soviet people."
 veday.5.d:0 "Twenty-five years have passed since the guns of the Great Patriotic War fell silent, marking the Soviet Union’s decisive victory over fascism. On this solemn yet triumphant occasion, the Soviet people honor the millions who gave their lives to secure peace, freedom, and the future of socialism.\n\nFrom Moscow to Vladivostok, the nation unites in remembrance. Veterans, their chests adorned with medals, march once more through Red Square, as new generations look on with pride. The cities once reduced to rubble now stand tall, symbols of the Soviet Union’s resilience and strength. The Soviet Army, ever-vigilant, ensures that the horrors of war will never return to Soviet soil.\n\nAs the world changes, one truth remains: the Soviet Union stands as a bastion of peace and progress, forever shaped by the courage of those who fought and won the greatest battle in history."