l_japanese:
 summerolympics.1.d:0 "フィンランドのヘルシンキでは、先週からオリンピック第15回大会が開催されており、多くのアスリートが夏のスポーツで実力を発揮している。これは、夏のオリンピックを開催する最北の都市である。1940年の第12回オリンピック競技大会は、第二次世界大戦のため東京で開催できなくなり、ヘルシンキが開催地として選ばれた。しかしその後もヘルシンキは第二次世界大戦の影響で開催ができず、1940年の夏季オリンピックは中止となった。1位は76個のメダルを獲得したアメリカ、2位は71個のメダルを獲得したソ連、3位は42個のメダルを獲得したハンガリーであった。次の夏季オリンピックは、1956年にオーストラリアのメルボルンで開催されることが発表されている。"
 summerolympics.2.d:0 "今週、オーストラリアのメルボルンでオリンピック第16回大会が開催された。オーストラリアはまだオリンピックの試合を開催したことがなく、今回が初めての開催となった。何百人ものアスリートが、夏のオリンピックをに参加するために、最も南の都市に世界中から集まった。エジプト、イラク、レバノンは、スエズ危機の影響で、この夏季オリンピックに対し抗議や、ボイコットを実施した。オランダ、カンボジア、スペイン、スイスは、ソ連がハンガリー革命に関与していたにもかかわらず、何の影響もなかったとして、このオリンピックを抗議またはボイコットしている。1位はソ連でメダル98個、2位はアメリカでメダル74個、3位はオーストラリアでメダル35個であった。次の夏季オリンピックは、1960年にイタリアのローマで開催されることが発表された。"
 summerolympics.3.d:0 "先週、イタリアのローマで第17回オリンピック競技大会が開催された。ローマに夏季オリンピックがやってくるのは今回が初めてとなる。ローマは当初、1908年に夏季オリンピックを開催する予定だったが、ヴェスヴィオ山が噴火したため、開催を辞退した。イタリアでは、4年前の1956年に第7回オリンピック冬季大会が開催されたばかりである。エチオピアのアベベ・ビキラ選手がオリンピックのマラソンで優勝し、アフリカ系黒人初のオリンピックチャンピオンとなった。また、カシアス・クレイ(モハメド・アリ)は男子ボクシングで優勝し、アメリカが金メダルを獲得した。ソ連は103個のメダルを獲得し、アメリカは71個で2位、イタリアは36個で3位という驚くべき結果となった。次回の夏季オリンピックは、1964年に日本の東京で開催される予定だ。"
 summerolympics.4.d:0 "先週末、東京で第18回オリンピック競技大会が開催され、何千人もの人々がアスリートたちの活躍を見守った。1940年に開催された第12回オリンピック競技大会は、当初東京で開催される予定だったが、第二次世界大戦の影響でヘルシンキに移された。しかし第二次世界大戦がフィンランドに及び、1940年の夏季オリンピックはヘルシンキで開催されず、最終的に中止となった。そして、15年の時を経て、夏季オリンピックは東京に帰ってきた。東京で開催された夏季オリンピックは、世界中で何百万人もの人々が観戦し、大きな成功を収めた。しかし、中国、朝鮮民主主義人民共和国、インドネシアの3カ国は、GANFEOとして参加をボイコットした。1位はアメリカでメダル96個、2位はソ連でメダル96個、3位は日本でメダル29個だった。次回の夏季オリンピックは、1968年にメキシコシティで開催されることが決定している。"
 summerolympics.5.d:0 "第19回オリンピック競技大会がメキシコシティで開催された。中南米やスペイン語圏でオリンピックが開催されたのはこれが初めてである。メキシコでは大規模な抗議行動や暴動が起きていたため、オリンピックは厳戒態勢で臨まれた。夏季オリンピックが始まる10日前、トラテロルコのPlaza de las Tres Culturasに学生たちが集まり、市民権や民主主義の拡大を訴えた。政府はこの集会の解散を命じ、5000人の軍隊と200台の戦車を広場に送り込んだ。数百人の学生が殺され、さらに数百人が負傷し、逮捕された。また、アメリカのトミー・スミスとジョン・カーロスという選手が、靴を履かずに黒い靴下を履き、公民権バッジをつけてメダル授与式の表彰台に立ったことも物議を醸した。そして、アメリカの黒人自由運動と連帯するため、星条旗が流れる中、頭を下げ、それぞれ黒い手袋をした拳を反抗的に突き上げた。アメリカは107個のメダルを獲得して1位、ソ連は91個のメダルを獲得して2位、日本は25個のメダルを獲得して3位となった。次回の夏季オリンピックは、1972年にドイツ連邦共和国のミュンヘンで開催される予定だ。"
 summerolympics.6.d:0 "先週、ドイツ連邦共和国のミュンヘンで第20回オリンピック競技大会が開催された。1916年の夏季オリンピックは、当初ドイツのベルリンで開催される予定だったが、第一次世界大戦のため、その年の夏季オリンピックは中止となった。その20年後、ドイツはベルリンで1936年の夏季オリンピックを開催することになる。ドイツで夏季オリンピックが開催されるのは、これで2度目となる。このオリンピックは、世界中で何百万人もの人々が観戦し、人気を博した。しかし、このオリンピックに影を落としたのは、パレスチナのテロ組織「黒い九月」がイスラエル人選手11人を誘拐し、人質に取ったことだった。地元警察が救出を試みたが、作戦は失敗し、11人の人質は全員死亡、警察官も銃撃戦で死亡した。1位はソビエト連邦で、メダル獲得数は99個にとどまり、100個には届かなかった。2位はアメリカ、3位はドイツ民主共和国だった。アメリカは94個、ドイツ民主共和国は66個のメダルを獲得した。次回の夏季オリンピックは、1976年にカナダのモントリオールで開催されることが発表された。"
 summerolympics.7.d:0 "第21回オリンピック競技大会が、カナダのモントリオールで1週間開催された。カナダでオリンピックが開催されたのはこれが初めてだ。アメリカは、シュガー・レイ・レナード、マイケル・スピンクス、ハワード・デイビスJr.、レオン・スピンクス、レオン・ランドルフといった選手が男子ボクシングで金メダルを獲得し、ボクシング界の最強チームと呼ばれるようになった。人種差別政策を続けていた南アフリカにラグビーチームを遠征させたニュージーランドの参加をIOCが禁止しなかったため、アフリカの29カ国がこのオリンピックに抗議し、ボイコットした。また、IOCが中華人民共和国を中国と表記したため、中華人民共和国も抗議またはボイコットした。1位は125個のメダルを獲得したソ連、2位は94個のメダルを獲得したアメリカ、3位は90個のメダルを獲得したドイツ民主共和国である。次回の夏季オリンピックは、1980年にソビエト連邦のモスクワで開催されることが発表されている。"
 summerolympics.8.d:0 "今週、ソビエト連邦のモスクワで、第22回オリンピック競技大会が開催された。これは、東ヨーロッパで開催された最初のオリンピックであり、スラブ語圏で開催された最初のオリンピックでもある。また、社会主義国で開催された最初のオリンピックでもあった。しかし、ソ連がアフガニスタン・中東に侵攻したため、66カ国以上がこの夏季オリンピックに抗議し、ボイコットした。ソ連は195個のメダルを獲得して1位、ドイツ民主共和国は126個のメダルを獲得、ブルガリアは41個のメダルで3位となった。次回の夏季オリンピックは1984年、アメリカ・ロサンゼルスで開催される。今度は東欧とソ連による大規模なボイコットが懸念されている。"
 summerolympics.9.d:0 "先週、アメリカ・ロサンゼルスで第23回オリンピック競技大会が開催された。ロサンゼルスでオリンピックが開催されるのは、1932年の第10回大会以来、2回目である。この夏季オリンピックをめぐっては、東欧から東南アジア、カリブ海諸国まで18カ国が抗議やボイコットを行い、1980年の第22回オリンピック競技大会に抗議やボイコットを行った66カ国への対抗措置として大きな論争があった。ボイコットされた国々は、来月モスクワで「フレンドシップ・ゲームズ」と呼ばれる独自のマルチスポーツイベントを開催する予定である。1位は174個のメダルを獲得したアメリカ、2位は59個のメダルを獲得したドイツ連邦共和国、3位は53個のメダルを獲得したルーマニアだった。次回の夏季オリンピックは1988年に韓国・ソウルで開催される予定である。次回もボイコットが懸念されるが、IOCは「両者間の取り決めに全力を尽くす」と表明している。"
 summerolympics.10.d:0 "先週から韓国・ソウルで第24回オリンピック競技大会が開催されている。朝鮮半島でオリンピックが開催されるのは今回が初めてである。今回の夏季オリンピックは、IOCが開催地をソウルに決めたことに対し、北朝鮮、キューバ、エチオピア、アルバニア、セーシェルが抗議・ボイコットした。幸い、1980年や1984年のような大規模な抗議やボイコットには至らなかった。1位はソ連でメダル132個、2位はドイツ民主共和国でメダル102個、3位はアメリカでメダル94個でした。次回の夏季オリンピックは、1992年にスペインのバルセロナで開催される予定だ。"
 summerolympics.11.d:0 "この2週間、スペインのバルセロナで第25回オリンピック競技大会が開催された。これは、スペインで開催される初めての夏季オリンピックであり、また、抗議やボイコットもなく開催された。アメリカの男子バスケットボールチームは金メダルを獲得し、マイケル・ジョーダン、ラリー・バード、マジック・ジョンソンらからなる「ドリームチーム」と呼ばれていた。統一チームは112個のメダルを獲得して1位となり、アメリカは108個のメダルを獲得して2位、ドイツ連邦共和国は82個のメダルを獲得して3位となった。次回の夏季オリンピックは、1996年にアメリカのアトランタで開催されることが決定している。"
 summerolympics.12.d:0 "この2週間、アメリカ・アトランタで第26回オリンピック競技大会」が開催された。今回のオリンピックは、100年前にギリシャのアテネで始まった第1回オリンピック競技大会と同じように特別なものだった。アメリカでは、1904年セントルイス、1932年レイクプラシッド、1932年ロサンゼルス、1960年第8回オリンピック冬季競技大会、1980年レイクプラシッド、1984年ロサンゼルスと6回のオリンピックが開催された。しかし、7月27日、100周年オリンピック公園でパイプ爆弾による爆破事件が発生した。2人が死亡し、111人が負傷した。容疑者はまだ見つかっていない。1位はアメリカでメダル101個、2位はドイツでメダル65個、3位はロシアでメダル63個だった。次回の夏季オリンピックは、2000年にオーストラリアのシドニーで開催されることが発表された。"
 summerolympics.13.d:0 "この2週間、オーストラリアのシドニーで第27回オリンピック競技大会が開催された。オーストラリアで夏季オリンピックが開催されるのは、1956年の第16回大会以来、2回目である。今回の夏季オリンピックは、新世紀の最初の大会となる。1位はアメリカでメダル97個、2位はロシアでメダル88個、3位は中華人民共和国でメダル59個だった。次回の夏季オリンピックは、2004年にギリシャのアテネで開催されることが発表されている。"
 summerolympics.14.d:0 "この2週間、ギリシャのアテネで第28回オリンピック競技大会が開催された。ギリシャで最後にオリンピックが開催されたのは、1896年にアテネで開催された第1回オリンピック競技大会だった。301以上の競技が行われ、他国から集まった数千人のアスリートが参加した。1位はアメリカで102メダル、2位はロシアで92メダル、3位は中華人民共和国で63メダルとなった。次回の夏季オリンピックは、2008年に中国・北京で開催されることが発表されている。"
 summerolympics.15.d:0 "この2週間、中国・北京で第29回オリンピック競技大会が開催された。中国がオリンピックを主催するのはこれが初めてである。今回のオリンピックは、これまでで最も多くの人が観戦したオリンピックで、世界中から47億人が観戦した。1位は110個のメダルを獲得した中国、2位は102個のアメリカ、3位は60個のロシアであった。次回の夏季オリンピックは、2012年にイギリス・ロンドンで開催されることが決定している。"
 summerolympics.16.d:0 "この2週間、イギリスのロンドンで第30回オリンピック競技大会が開催され、何百万人もの人々が、選手たちがベストを尽くす姿を世界中で見守った。ロンドンでオリンピックが開催されるのは今回が3回目で、現在、3つのオリンピックが開催されている唯一の都市である。1944年の第13回オリンピック競技大会は、当初ロンドンで開催される予定だったが、第二次世界大戦の戦闘のため、大会は中止となった。その後、1948年の第14回オリンピック競技大会がロンドンで開催され、第二次世界大戦後の世界における最初の夏季オリンピックとなった。ジャマイカのウサイン・ボルト選手が金メダルを獲得し、時速44.72kmの地球最速記録を樹立した。アメリカは103個のメダルを獲得して1位、中国は91個のメダルを獲得して2位、イギリスは65個のメダルを獲得して3位となった。次回の夏季オリンピックは、2016年にブラジル・リオデジャネイロで開催されることが発表されている。"
 summerolympics.17.d:0 "この2週間、ブラジルのリオデジャネイロで第31回オリンピック競技大会が開催された。ブラジルが開催する初めてのオリンピックであり、南米で開催される最初のオリンピックでもある。今回のオリンピックには、1万人以上の選手が参加した。1位はアメリカで121個、2位はイギリスで67個、3位は中国で65個のメダルを獲得した。次回の夏季オリンピックは、2020年に再び日本の東京で開催されることが発表されている。"