 ENG_queen_elizabeth:0 "エリザベス二世"
 ENG_queen_elizabeth_desc:0 "Elizabeth Alexandra Mary of the House of Windsor officially known as Elizabeth II is the Queen of the United Kingdom and her Commonwealth realms. She was coronated on 2nd of July, 1953. her role as Queen does not come without its responsibilities. Her personality is a shining example to our great nation and our dependencies abroad."
 ENG_george_vi_desc:0 "\n\n\n\n\n\n£George_VI\n\n\n\n\n\n\n\n§ The first Head of the Commonwealth and last Emperor of India is still considered the inheritor of a great legacy. Like his father before him he is a popular figurehead and unifier for the British people."