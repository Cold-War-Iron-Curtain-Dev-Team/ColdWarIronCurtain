 team_weapons_1:0 "組装備 I"
 team_weapons_1_short:0 "組装備 I"
 team_weapons_1_desc:0 "第二次世界大戦期の基本的な支援兵器。"
 team_weapons_2:0 "組装備 II"
 team_weapons_2_short:0 "組装備 II"
 team_weapons_2_desc:0 "冷戦初期の改良された支援兵器。"
 team_weapons_3:0 "組装備 III"
 team_weapons_3_short:0 "組装備 III"
 team_weapons_3_desc:0 "冷戦初期から中期にかけての、より改良の進んだ支援兵器。"
 team_weapons_4:0 "組装備 IV"
 team_weapons_4_short:0 "組装備 IV"
 team_weapons_4_desc:0 "冷戦中期から後期にかけて用いられた、さらに進歩した支援兵器。"
 team_weapons_5:0 "組装備 V"
 team_weapons_5_short:0 "組装備 V"
 team_weapons_5_desc:0 "重量や火力の面での歴史的教訓を踏まえて設計された現代的な支援兵器。"
 squad_weapons_1:0 "分隊装備 I"
 squad_weapons_1_short:0 "分隊装備 I"
 squad_weapons_1_desc:0 "第二次世界大戦期の基本的な分隊装備。"
 squad_weapons_2:0 "分隊装備 II"
 squad_weapons_2_short:0 "分隊装備 II"
 squad_weapons_2_desc:0 "第二次世界大戦期に得られた教訓のもと改良された分隊装備。"
 squad_weapons_3:0 "分隊装備 III"
 squad_weapons_3_short:0 "分隊装備 III"
 squad_weapons_3_desc:0 "戦場で歩兵部隊や分隊の火力を確保する、冷戦時代の分隊装備。"
 squad_weapons_4:0 "分隊装備 IV"
 squad_weapons_4_short:0 "分隊装備 IV"
 squad_weapons_4_desc:0 "一兵卒の殺傷力をより高めることができる、分隊装備の火力強化。"
 squad_weapons_5:0 "分隊装備 V"
 squad_weapons_5_short:0 "分隊装備 V"
 squad_weapons_5_desc:0 "重量や火力の面での歴史的教訓を踏まえて設計された現代的な分隊装備。"
 specialist_1:0 "特殊部隊装備 I"
 specialist_1_short:0 "特殊部隊装備 I"
 specialist_1_desc:0 "第二次世界大戦期の基本的な特殊部隊装備。"
 specialist_2:0 "特殊部隊装備 II"
 specialist_2_short:0 "特殊部隊装備 II"
 specialist_2_desc:0 "第二次世界大戦期の教訓を踏まえた、改良された特殊部隊の装備群。"
 specialist_3:0 "特殊部隊装備 III"
 specialist_3_short:0 "特殊部隊装備 III"
 specialist_3_desc:0 "更新によって戦場での殺傷力や命中率、精度を高めた特殊部隊向け装備。"
 specialist_4:0 "特殊部隊装備 IV"
 specialist_4_short:0 "特殊部隊装備 IV"
 specialist_4_desc:0 "特殊部隊の兵士にさらなる精度と殺傷力を提供する、より進歩した冷戦期の特殊部隊装備。"
 specialist_5:0 "特殊部隊装備 V"
 specialist_5_short:0 "特殊部隊装備 V"
 specialist_5_desc:0 "精度と命中率の改善が進んだ、現代的な高火力の特殊部隊装備。"
 ammo_explosives_1:0 "爆薬と弾薬 I"
 ammo_explosives_1_short:0 "爆薬と弾薬 I"
 ammo_explosives_1_desc:0 "第二次世界大戦期の爆発物と弾薬類。"
 ammo_explosives_2:0 "爆薬と弾薬 II"
 ammo_explosives_2_short:0 "爆薬と弾薬 II"
 ammo_explosives_2_desc:0 "冷戦初期の改良された爆発物と弾薬類。"
 ammo_explosives_3:0 "爆薬と弾薬 III"
 ammo_explosives_3_short:0 "爆薬と弾薬 III"
 ammo_explosives_3_desc:0 "冷戦初期から中期にかけて更新された爆発物や弾薬類。"
 ammo_explosives_4:0 "爆薬と弾薬 IV"
 ammo_explosives_4_short:0 "爆薬と弾薬 IV"
 ammo_explosives_4_desc:0 "冷戦初期から中期にかけて使用されたさらに進歩した爆発物や弾薬類。"
 ammo_explosives_5:0 "爆薬と弾薬 V"
 ammo_explosives_5_short:0 "爆薬と弾薬 V"
 ammo_explosives_5_desc:0 "改良された雷管、制止力、弾丸効力、安全機能を備えた現代的な爆発物や弾薬類。"
 manpats_1:0 "携行式対戦車システム I"
 manpats_1_short:0 "携行式対戦車ミサイル I"
 manpats_1_desc:0 "歩兵部隊が用いる初期的な携行型の対戦車兵器。西側で用いられるものはしばしばバズーカとして知られる。"
 manpats_2:0 "携行式対戦車システム II"
 manpats_2_short:0 "携行式対戦車システム II"
 manpats_2_desc:0 "装甲の進化に伴い、有効な打撃を加えるためには肩撃ち式携行対戦車システムの弾頭に改善を加える必要が生じた。"
 manpats_3:0 "携行式対戦車システム III"
 manpats_3_short:0 "携行式対戦車システム III"
 manpats_3_desc:0 "装甲貫通技術のさらなる進歩と軽量化によって、この世代の携行対戦車システムはかつてないほど効果的になっている。"
 manpats_4:0 "携行式対戦車システム IV"
 manpats_4_short:0 "携行式対戦車システム IV"
 manpats_4_desc:0 "改良されたこの世代の軽対戦車兵器を用いることで、歩兵部隊は相対する装甲兵器にとって強力な敵へと変貌しうる能力を得た。"
 manpats_5:0 "携行式対戦車システム V"
 manpats_5_short:0 "携行式対戦車システム V"
 manpats_5_desc:0 "最新の軽量対戦車発射機は優れた貫通力を持ち、戦場で極めて致命的な能力を発揮する。"
 infantry_manpats_tt:0 "§C歩兵と歩兵車両の対戦車能力を増大させる携行式対戦車システム運用のディシジョンが解禁される。§!"
 hmg_1:0 "対空重機関銃"
 hmg_1_short:0 "対空重機関銃"
 hmg_1_desc:0 "重機関銃は別個に特化した対空部隊を同伴させることなく、航空攻撃から身を守るすべを提供する。"
 manpads_1:0 "携行式防空システム I"
 manpads_1_short:0 "携行式防空システム I"
 manpads_1_desc:0 "第一世代の携行式防空ミサイルシステム。実戦での命中率は低いが、敵機に命中した際の成果には目を見張るものがある。"
 manpads_2:0 "携行式防空システム II"
 manpads_2_short:0 "携行式防空システム II"
 manpads_2_desc:0 "第二世代の携行式防空ミサイルシステムは、誘導に赤外線を用いるよう設計されている。ヘリコプターや低空を飛行する航空機にとっては警戒すべきだ。"
 manpads_3:0 "携行式防空システム III"
 manpads_3_short:0 "携行式防空システム III"
 manpads_3_desc:0 "高い目標命中率を誇る先進的な携行式防空システム。"
 manpads_4:0 "携行式防空システム IV"
 manpads_4_short:0 "携行式防空システム IV"
 manpads_4_desc:0 "先進的なミサイルと優秀な赤外線追尾装置を備えた最新の携行式防空システム。"
 infantry_manpads_tt:0 "§C歩兵の対空能力を増大させる携行式対防空システム運用のディシジョンが解禁される。§!"
 protection_equip_1:0 "個人用保護装備 I"
 protection_equip_1_short:0 "保護装備 I"
 protection_equip_1_desc:0 "爆弾の破片による負傷を防ぐために用いられる、第一世代のヘルメット。"
 protection_equip_2:0 "個人用保護装備 II"
 protection_equip_2_short:0 "保護装備 II"
 protection_equip_2_desc:0 "更なる防御力に加え、小火器からの防護を提供する第二世代の防護具。"
 protection_equip_3:0 "個人用保護装備 III"
 protection_equip_3_short:0 "保護装備 III"
 protection_equip_3_desc:0 "小火器や爆発物に対する防護を提供する第三世代のヘルメットや防弾ベスト。"
 protection_equip_4:0 "個人用保護装備 IV"
 protection_equip_4_short:0 "保護装備 IV"
 protection_equip_4_desc:0 "爆弾の破片や爆風に対する防御力を備えた第四世代のヘルメットや防弾ベスト。"
 protection_equip_5:0 "個人用保護装備 V"
 protection_equip_5_short:0 "保護装備 V"
 protection_equip_5_desc:0 "最新の歩兵防護装備は、兵士各々の爆風や爆弾の破片、小火器に対する生存率を向上させる。"
 infantry_protection_tt:0 "§C歩兵の生存性を高めるための歩兵装備や装甲、制服の運用のディシジョンが解禁される。§!"