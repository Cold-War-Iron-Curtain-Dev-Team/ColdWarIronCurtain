 mrtnews.1.d:0 "1975年のマドリード協定でモーリタニアがスペイン領サハラ砂漠の南部を支配して以来、この国には果てしない災害と災難が続いている。当初3千人だった軍隊は、ポリサリオ戦線の襲撃から国境を守ることができず、収入源であるズエレテの鉄鉱山を奪われた後、国を崩壊させることになった。実際、この砂漠の国を支えていたのは、首都ヌアクショットへの攻勢をフランス空軍が止めるのに苦労したくらいであった。アラブ人とベルベル人がサハラ砂漠の反乱軍に同情的で、南部の黒人兵士はこれをアラブ内の紛争で自分たちの利益にはならないと考えていたため、不満を持つ反戦派の軍人によるクーデターは必然的なことだった。モーリタニアは、それまで支配していた西サハラ全域を失っただけでなく、その独立を承認することを発表した。"