 INFLUENCE_TOOLTIP_DELAYED:0 "影響力とは、その国に対する影響力と支配力を測るものである。影響力は、建設物への投資、贈与、軍事援助、政治力の行使などによって拡大することができる。他の国々は影響力をめぐって競争し、当該国は可能な限り主権を主張しようと試みる。\n\n影響力が十分に高い国には、自国に有利な貿易協定を結ばせたり、属国にすることもできる。影響力は、相手国を徐々に自国の世界観に近づけていく他に、相手国の政治を自国に有利に操作するのに使用することができる。"
