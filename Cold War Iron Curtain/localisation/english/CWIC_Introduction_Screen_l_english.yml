 BRA_STARTUP_DESC: "Once again, Brazil stands at the crossroads of history. A nation rich not only in culture, resources and history, yet still so split by a tumultuous past and present. And as the world prepares to engulf itself in a new era of division and change, Brazil too must look forward to face its destiny in the world stage. \n\nThe last 30 years of brazilian history have been some of our most polarizing in all of our history. The Old Republic, an era ruled by militaries and oligarchies who lasted 41 years, ended in 1930 with the armed revolution led by Getúlio Vargas triumphing and deposing the elected president. \n\n It did not bring stability, in fact, it were troublesome times. The unrest caused by the Communist Uprising in 1935 led to Vargas couping and closing the government in 1937, beginning a repressive dictatorship labeled the 'Estado Novo'. With the centralization of power, Vargas began an era of persecution and torture, but his vast investments led to quick industrialization, boosting the economy by the early 1940s. Despite the declaration of neutrality in 1939, by 1942 Germany had attacked several brazilian merchant ships, leading to the official entry of Brazil in World War II. \n\n By 1945, Brazil suffered a painful contradiction: Hundreds of young brazilians killed and were killed in Italy against the fascists in the name of freedom and democracy, yet at home the country was still as repressive as ever. With the relegalization of press and amnesty for the persecuted victims of the Estado Novo, the first direct elections in 15 years were realized in December 1945. Elected was the General Eurico Gaspar Dutra of the social democratic PSD, marking an end to the Vargas Era. \n\n However, the scars of time still have not healed. Vargas remains highly popular amongst the population, and besides that, the encroaching military always keeps an eye in our politics, having an overbearing presence ever since the military coup that ended the monarchy in 1889, always inches from putting their hands in the country, again. \n\nOnly time will tell if Brazil truly is the country of the future or if it cannot outrun its own past."
 BRA_STARTUP_BUTTON: "Taking a step, blind, into the unknown."
