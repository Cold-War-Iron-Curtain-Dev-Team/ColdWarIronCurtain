 SOV_STARTUP_DESC: "When did it all begin? Some argue that the 1905 Revolution paved the way for the Bolshevik Revolution, while others believe it was the February Revolution that set the stage. However, one thing is certain: Lenin's ideas are here to stay.\n\nThe October Revolution ignited a revolutionary ideal never before seen in the world. While Karl Marx laid the groundwork, Lenin took decisive action. The Union of Soviet Socialist Republics was established thanks to Great Lenin.\n\nFollowing Lenin's death in 1924, Stalin, who held the position of General Secretary, transformed the office from a relatively insignificant role into the most powerful position in the Soviet Union, thereby becoming its undisputed ruler.\n\nStalin's rule was characterized by institutional repression. Millions starved to death during the Holodomor, and his regime oversaw the Great Purge from 1936 to 1941. However, Stalin's impact was not solely negative; he transformed the Soviet Union from a backward, agrarian society into an industrial superpower through his Five-Year Plans.\n\nOn September 3, 1939, the Soviet Union invaded Poland after signing the Molotov-Ribbentrop Pact. A few months later, Finland fell victim to Soviet aggression, leading to the signing of the Moscow Peace Treaty in 1940. Then, on June 22, 1941, all hell broke loose when Hitler invaded the USSR. Many predicted that the Soviets would be conquered, but that did not occur. Millions of Russians, Ukrainians, Belarusians, and others fought valiantly to defend their homeland against the Nazis, culminating in the Soviet capture of Berlin on April 30, 1945.\n\nWhen World War II ended on September 2, 1945, many believed that the fighting was over; however, they were mistaken. A new type of conflict began: the Cold War. An Iron Curtain descended across Eastern Europe, separating pro-Soviet nations from the liberal West.\n\nFour years later, the Soviet Union emerged as a beacon of communist ideals throughout the world. Many newly independent nations looked to the Soviet Union as a mentor and guide; most of them chanted:\n\n"Lenin lives, Lenin lived, Lenin will always live!""
 SOV_STARTUP_BUTTON: "Slava Velikomu Stalinu!"
