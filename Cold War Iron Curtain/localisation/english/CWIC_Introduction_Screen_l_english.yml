 PRC_STARTUP_DESC: "It has been §Y22 years§!, marking the day since the §RShanghai Massacre§!, where our fellow revolutionaries and proletarians were massacred in Shanghai, and our revolution to liberate China from the §RGuomindang reactionary traitors§! began.\n\nWe have suffered under §Y100 years of humiliation§!. The Qing allowed our people to be poisoned by the West, the §REight-Nation Alliance§! allowed our ports and people to be taken, our dignity was stolen from us by constant failures of governments who claimed to serve our people.\n\nOur only hope under §YSun Yat-sen§! was stolen from us when the KMT split into the §YLeft KMT§! under §YWang Jingwei§!, loyal to the ideas of Sun Yat-sen and authentic to its Revolutionary Ideals, and the §RRight KMT§!, a revisionist molestation of Sun's ideas which starved our people and destroyed our national economy, only to the benefit of the bourgeois and oligarchs, puppets under the strings of §RChiang Kai-shek§!, forcing our people to live under a fragile illusion of stability and unity, freely to be oppressed by warlords and enslaved for their armies, at the threat of the safety and livelihoods of their families, bayonets pointed at their throat.\n\nOur Revolutionary war against the §RRKMT§! and their reactionary loyalists came at a great loss to both sides.\n\nDespite us having won §Y4 out of 5 Encirclement Campaigns§! spearheaded by the KMT NRA Southern Command, §YMao Zedong§! himself suffered great personal loss after losing his wife, §YYang Kaihui§!, and other close friends of Mao and great revolutionaries, including the cousin of Mao's wife, §YYang Youlin§!, Vice Chairman and Commander of the 16th Red Army; §YXu Yangang§!, Chief of Staff of the 1st Red Army Corps; §YDeng Zhongxia§!, Political Commissar of the 2nd Red Army Corps; §YHe Chang§!, Director of the Political Department of the 3rd Red Army Corps; §YJi Zhentong§!, Commander of the 5th Red Army Corps; §YYe Ting§!, first commander of the New Fourth Army; §YXu Jishen§!, Commander of the 1st Red Army; and §YHuang Gonglue§!, Commander of the 3rd Red Army.\n\nOur losses were even heavier during the perilous §YLong March§!, which saw the loss of §R90%§! of our men and women in the mountains of China, the Central Red Army being reduced from over §Y86,000§! to just §Y7,000§! men. The flame of the Revolution was almost extinguished by the sheer force of the KMT, but we survived, and set up the §YShaanxi Revolutionary Base§!.\n\nBut a new threat loomed from the East.\n\nThe §REmpire of Japan§! bared its fangs and laid its imperialist eyes on our Motherland, eager to colonize and invade once more, having already committed atCHIities to the local population in §YDongbei§!, with units like §RUnit 731§! showing our people just how little they cared about humanity and morality.\n\nEven after seeing this threat to our very existence, §RChiang Kai-shek§! buried his face into the dirt like a greedy dog, and kept attempting to destroy the §YCPC§!, his greed and intent to solidify his own personal power laid bare for the entirety of China to see.\n\nHis own command had enough of him. §YZhang Xueliang§!, head of the Northwestern Anti-Communist Army, kidnapped Chiang Kai-shek and brought him to the CPC to force his hand into making the §YSecond United Front§!. Chiang eventually agreed—reluctantly.\n\nAnd so the §YEight Years of Resistance§! began, as our brothers bled and fought with every ounce of flesh and blood they had in their bodies, as our people were raped and massacred by the Japanese—§Rthe weakness of the Guomindang§! exposed for the world to see. Our people starved, but our morale was never higher. Where the KMT had air and ground superiority, the entirety of the occupied areas of China were under a massive guerrilla war heralded by the CPC and partisans loyal to our cause.\n\nOnce the Eight Years of Resistance were over, most of the Northeast was under our control.\n\nOnce the Eight Years of Resistance ended and most of the Northeast came under our control, the struggle against §RChiang’s fascist oligarchy§! reignited, transforming brother-against-brother conflict into a nationwide revolutionary war.\n\nOur forces grew from §Y120,000§! in the Northeast Field Army to over §Y1 million§! by 1947 as peasants, energized by land reform and political awakening, joined the cause, fueling the three great campaigns from 1946 to 1949: §YLiaoshen§!, §YHuaihai§!, and §YPingjin§!, which embodied not only military strategy but the unified will of the Chinese people under §YMarxism-Leninism§! and Party leadership.\n\n§YLiaoshen Campaign§! liberated the long-suffering Northeast through mass support and decisive victories in §YJinzhou§!, §YChangchun§!, §YShenyang§!, and §YYingkou§!, giving us a crucial industrial base.\n\n§YHuaihai Campaign§! showcased the power of a true people’s war, with §Ymillions of civilians§! sustaining the front and helping annihilate the enemy’s elite Central Army.\n\n§YPingjin Campaign§! concluded the struggle in North China, where §YTianjin§! fell swiftly and §YBeiping§! was liberated peacefully through combined military and political pressure.\n\nTogether, these victories shattered the §RGuomindang’s military strength§!, §Rtheir economic foundation§!, and §Rtheir remaining legitimacy§!, clearing the way for the birth of §YNew China§!.\n\nThe reactionary ruling order was collapsing in place. The people’s path to nationwide liberation was open before us. The Yangtze River waited to be crossed. Nanjing, Shanghai, and the entire South awaited their liberation. The dawn of New China drew near, carried forward by the millions who had risen up to claim their future.\n\nNow, it is §YMay 23rd, 1949§!, and our Liberation has never been closer. We have taken §YBeijing§! and the majority of the Northeast, and our numbers are vastly superior to the Guomindang.\n\n§YOur Liberation is now!§! Glory to the Unity of the People of the World! Glory to the Party!"
