 JAP_STARTUP_DESC: "In §YAugust 1945§!, the §YEmpire of Japan§! finally surrendered to the Allied Powers. Once a nation that proclaimed the §YGreater East Asia Co-Prosperity Sphere§! and expanded its influence across the Asia-Pacific, Japan now stands as a defeated country, burdened with §Rcities reduced to ashes§!, §Rstarving citizens§!, and §Rsoldiers and repatriates with nowhere to return§!.\n\nMajor cities such as §YTokyo§!, §YOsaka§!, and §YNagoya§! have been devastated by air raids, while §Rfood shortages§! and §Rinflation§! continue to crush everyday life. The prestige of the state has been lost, the military has been dismantled, and even the position of the Emperor is being redefined in a new form.\n\nYet defeat was not only an end. It was also the beginning of a new national reconstruction. Under the occupation of the §YGeneral Headquarters of the Allied Powers, GHQ§!, Japan is being transformed from a militarist state into a democratic nation. The §Gdissolution of the zaibatsu§!, §Gland reform§!, §Gwomen's suffrage§!, §Glabour reform§!, and §Geducation reform§! are reshaping the country. In §Y1947§!, the §GConstitution of Japan§! came into effect, presenting a new national ideal based on the renunciation of war.\n\nHowever, the world was already moving toward a new confrontation. With the expansion of Soviet influence and changes in the situation in China, the United States has begun to see Japan not merely as a defeated nation, but as a §Ybulwark against communism in East Asia§!. Between the ideals of democratization and the realities of the Cold War, Japan's postwar order is being formed.\n\nFrom §Y1945 to 1949§!, Japan began again from the ashes, accepted new institutions under occupation, and gradually became incorporated into the structure of the §YCold War§!."
 JAP_STARTUP_BUTTON: "Tenno Heika Banzai!"
