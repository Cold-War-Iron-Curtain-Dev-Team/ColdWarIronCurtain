 WGR_STARTUP_DESC: "Life for the Germans has been harsh. Facing defeat in the Great War and carrying the burden of the 1919 Versailles Treaty, the challenges the German Republic has faced could not have been worse. Inflation, coup attempts, and political assassinations as well as totalitarianism from the Extreme Left and Extreme Right meant that the downfall of democracy in Germany was only a matter of time.\n\nWhen the NSDAP (Nationalsozialistische Deutsche Arbeiterpartei) gained power, they abolished the constitutional structures that could have challenged their rule. The period from 1933-1945 might have seen economic stability within the first years but at the expense of civil liberties being abandonded and the German people eventually once again being dragged into another war that would cost the life of millions of Germans, just for the country to face utter humiliation as seen in the occupation by France, the USSR, Great Britian and the United States of America.\n\nNow however, we have gained a new chance to establish German Democracy once more. The Parliamentarian Council, consisting of former active democrats and resistance fighters, has gathered in Bonn to draft a constitution for the new Germany. A constitution that actively protects Democracy in Germany and hopefully avoiding another kind of authoritarian takeover. The first elections will be held soon."
