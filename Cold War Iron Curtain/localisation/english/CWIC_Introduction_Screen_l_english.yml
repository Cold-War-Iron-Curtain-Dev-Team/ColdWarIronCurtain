 KOR_STARTUP_DESC: "After the short-lived joy of liberation was dashed by foreign forces and ever-changing international affairs, the land of morning calm has been running breathlessly through an age of turmoil under the close watch of American officers.\n\nDue to an unstable foreign rule and animosities among political leaders, the southern part of the Korean peninsula saw a series of political movements and conflicts, some of which were very violent. These turn of events were seemingly concluded with the formation of the Republic of Korea in 1948, the first independent Korean state after Japanese occupation, based on free and democratic ideals.\n\nThe situations haven't become more ideal, however, as insurgencies related to communists and controversial responses from our government plague the politics of the newborn country. The economy hasn't been the most stable either, while shadows of the past Japanese rule still linger in our society despite some efforts.\n\nThe growth and provocations of our communist counterpart in the north are also becoming a concerning threat to our nation's safety. Regardless, our government and people's faith in a free, united, and prosperous future has not yet faltered. The coming days will prove to us whether we will achieve those dreams we have longed for or not."
 KOR_STARTUP_BUTTON: "Daehanminguk Manse!"
