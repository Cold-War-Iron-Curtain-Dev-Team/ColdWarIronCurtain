 LIB_STARTUP_DESC: "The Cold War represents a new era on the continent of Africa. President William Tubman has dominated Liberian Politics with a firm hand for five years. As the world splits into separate spheres, Tubman has reached out to the Western-aligned powers to secure greater economic prosperity for all Liberian citizens, not just the ruling Americo-Liberian class. To achieve this, prospective international business opportunities can be leveraged in Liberia’s favor. However, at the same time, old Americo-Liberian political interests have been watching Tubman very closely for signs of weakness. Will Tubman’s vision for Liberia survive, or will it thrive? Does the future of Liberia lie with all of its people, or are colder hearts needed to guide Liberia in a Cold War?"
 LIB_STARTUP_PATHS: "William Tubman. William Tolbert. Ellen Mills Scarbrough. Didwho Welleh Twe. William O. Davies Bright."
 LIB_80s_STARTUP_DESC: "There are storm clouds on the horizon. The ruling Americo-Liberian President Tolbert is unpopular because of the rice riots in Monrovia a year earlier, and among the True Whig Party when he condemned ritual killings, and did not bestow clemency on the Harper Seven killers. The act showed signs of the True Whig Party's solidarity cracking from within as Tolbert courts a new indigenous political class. It is uncertain if things can continue like this in Liberia for the foreseeable future. In this era, the Soviet bloc and Libya’s African ventures may prove lucrative if that route is chosen. It would be wise for the Liberian leader to weigh his international options for the benefit of Liberia. It is unknown how stable Liberia can be to weather the storm known as the Eighties in the Cold War…"
 LIB_80s_STARTUP_PATHS: "1st Liberian Civil War - Doe & Thomas Quiwonkpa Paths. Jackson Doe - Overthrow Samuel Doe Path."
 LIB_STARTUP_CREDIT: "\n The Refused Stone"
 Generic_STARTUP_DESC: "The Year is 1949, a shattered planet begins to fall back into the arms of tyranny and conflict, as new rivalries emerge.\n\nWelcome to a new era of struggle, determination and conflict, as nations struggle to achieve independence and power. Superpowers rise from the ashes of old, with ideologies that shall determine the fate of the human race permanently. As the superpowers jockey militarily and economically for supremacy, many nations are freed from the yokes of colonial oppression, and finally the people of entire continents, have a say in determining their destiny.\n\nWar brews in East Asia yet again, and the African continent will no longer bear the immoral oppression of their people. Eastern Europe is encompassed by the Soviet sphere, and the West seeks to salvage its crumbling throne."
