 JAP_STARTUP_DESC: "As the sun sets on the remnants of a once-mighty empire, the Land of the Rising Sun finds itself shackled under the weight of defeat and foreign occupation. The echoes of the atomic bombings that marked the Empire of Japan's downfall in 1945 still resonate, casting a somber shadow over the nation.\n\nUnder the grasp of the American boot, we have undergone a radical transformation. The year 1947 saw the birth of a new era as the American-influenced constitution took root, birthing a fledgling democracy. Our sacred soil, once guarded by the samurai spirit, now bears the seeds of constitutional principles, most notably in the pacifist embrace of Article 9 that dismantled the once-mighty military machine.\n\nHowever, the winds of change bring not only renewal but also a tempest of challenges. Hyperinflation grips the economy, food shortages persist, and the industrial heartbeat of the nation struggles to recover. Political turbulence, fueled by far-left activists, threatens the fragile stability that remains. Our nation, though downcast, stand resilient.\n\nYet, within the heart of adversity lies our spirit of Yamato. We as a nation with the history of persevering through trials and tribulations, have an undying determination to transcend the hardships. In the hushed whispers beneath the cherry blossoms, there lies a promise that the Land of the Rising Sun will ascend once more. Hope flickers like a lantern in the night, guiding us through the tumultuous path to recovery. With unwavering loyalty to the Emperor and a profound sense of duty, the our nation looks toward the future. From the ashes of defeat, we pledge to rebuild an indomitable nation, for the glory of the Emperor and the enduring spirit of the nation!"
 JAP_STARTUP_BUTTON: "Tenno Heika Banzai!"
