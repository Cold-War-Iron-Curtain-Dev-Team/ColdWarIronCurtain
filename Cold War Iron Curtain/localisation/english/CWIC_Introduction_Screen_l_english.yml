 VIN_STARTUP_DESC: "For a century, the people of Vietnam have struggled beneath the shadow of foreign domination. As of §YMay 1949§!, the §YDemocratic Republic of Vietnam (DRV)§! stands firm in its sacred mission to cast off the chains of colonial oppression and reclaim the destiny that rightfully belongs to the Vietnamese nation.\n\nThe tragedy began in the late 19th century when France imposed its colonial yoke on our land. For decades, the Vietnamese people endured forced labor, exploitative taxation, the suppression of local traditions, and the confiscation of our resources. The colonial regime, supported by its collaborators, sought to silence our culture and extinguish our spirit. Yet resistance never died.\n\nIn the early 20th century, patriots across the nation rose one after another—§YPhan Boi Chau§!, §YPhan Chu Trinh§!, the nationalists of the VNQDD, and countless unnamed heroes. But it was the emergence of §YHo Chi Minh§! and the founding of the §YIndochinese Communist Party (ICP)§! that unified Vietnam’s fragmented revolutionary currents into a disciplined, nationwide force of liberation.\n\nWhen the world plunged into the fires of the §YSecond World War§!, the French colonial authorities collapsed, and §RImperial Japan§! exploited the chaos to seize control of Indochina. Our people endured famine, forced conscription, and terror, culminating in the §Y1945 famine§! that claimed over a million lives. Yet from this suffering arose the §YViet Minh§!, the united front of patriots and workers, peasants and intellectuals, fighting for one goal: national independence.\n\nWith Japan's surrender in August 1945, the Vietnamese people seized their moment. Under Ho Chi Minh's leadership, the §YAugust Revolution§! toppled colonial administration across Tonkin, Annam, and Cochinchina. On §YSeptember 2nd, 1945§!, before a sea of triumphant citizens in Hanoi, Ho Chi Minh pCHIlaimed the birth of the §YDemocratic Republic of Vietnam§!, declaring that all peoples are created equal and that Vietnam was free.\n\nBut imperialism does not die quietly. France sought to return, refusing to recognize the legitimate government of the Vietnamese people. Negotiations were attempted but betrayed, culminating in the §RHaiphong Massacre§! and the outbreak of the §YFirst Indochina War§! in December 1946.\n\nThe DRV, outgunned and without foreign support, fought with determination and ingenuity. The Viet Minh established fortified resistance bases across the mountains and jungles, mobilizing peasants, workers, youth, and women into a nationwide struggle. The spirit of §YPeople’s War§!—a union of soldiers and civilians—became the cornerstone of Vietnamese resistance.\n\nFrench forces seized the major cities, imposing their puppet governments in Cochinchina and later attempting to fabricate a new so-called 'State of Vietnam' with §YBao Dai§! as its figurehead. Yet the rural heartland remained loyal to the DRV, which organized land redistribution, literacy campaigns, and mass political education to build the foundation of a new society.\n\nFrom 1947 to 1949, the Viet Minh launched successful guerrilla operations across Viet Bac, the northern highlands, and the Red River Delta. French positions became isolated islands surrounded by a sea of resistance. French convoys were ambushed, outposts overrun, and colonial authority steadily eroded.\n\nEven as the French reorganized under the aid of §YMarshall Plan§! resources and American anti-communist policy, the Vietnamese revolution grew stronger. International winds were shifting—the victory of the Chinese revolution in the north was imminent, and the global tide of colonialism was ebbing.\n\nAs of §YMay 1949§!, the DRV stands resolute. Our government endures in Viet Bac, protected by the mountains and the loyalty of millions. Our soldiers fight with unwavering discipline, and our people remain united behind the banner of national liberation. The French attempt to resurrect their colonial empire, and their collaborators seek to divide Vietnam, but the destiny of the nation belongs not to invaders or puppets, but to the Vietnamese people themselves.\n\nWe fight not only with rifles and grenades but with the conviction that justice, history, and the will of the masses are on our side.\n\n§YVietnam will be free.§!\n§YThe colonial yoke will be broken.§!"
