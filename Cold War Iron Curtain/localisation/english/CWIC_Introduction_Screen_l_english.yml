 HUK_STARTUP_DESC: "The Philippine Islands are no strangers to revolutions. The spirit of freedom that gave birth to the Katipunan's fight against Spanish imperialism 50 years ago still lives today, embodied by the Hukbalahap's resistance to Japanese and American imperialism.\n\nAfter the end of World War 2, the Philippine socialist underground and the trade unions legitimized themselves in the form of the Democratic Alliance, managing to win 6 parliament seats in the 1946 elections. When it was time to take their seats however the Government in Manila refused to accept the election results, claiming fraud and violent campaign tactics. This was done deliberately to reach a majority in the parliament to pass the constitutional amendments in line with the Philippine Trade Act, aiming to give US citizens and corporations rights to Philippine natural resources as if they were natural Philippine citizens.\n\nWith mounting pressure from Roxas administration and failure of the peasent pacification programs; the final straw was the assassination of Juan Feleo, prominent peasent leader and high ranking member of  the Communist Party. His death became the signal to return to armed struggle. By the end of the year leader of the Huks Luis Taruc, as well as thousands of peasants and old Huk guerillas, went underground.\n\nThe Party, meanwhile, kept their work to help out labor organizations and bring in more members. After a brief triumvirate following Vicente Lava's passing; the Party was now led by José Lava, brother of the former general secretary. The people were tired of constant exploitation; by their overlords, by foreign invaders, and by ruthless landlords. The number of people supporting the insurgents rose rapidly and on March 1948 President Roxas banned the Communist Party and all affiliated organizations, ordering mass arrests of their leaders which further escalated the conflict. Incidentally he would die a month later due to a heart attack and Vice President Quirino succeeded him.\n\nNow, in 1949, the ideological clash in the islands is nowhere near finished. Although the Huk forces increase their numbers with each passing day, a recent tragedy threatens the movement's future. The widow of the former president, Aurora Quezon, has been killed along with her daughter and son-in-law. As she was the chairman of the Philippine Red Cross this act has garnered near universal condemnation.\n\nThe people are getting tired, supplies running low and with the world getting more polarized the United States can't keep their focus on the islands much longer. The rebellion is entering a new stage."
