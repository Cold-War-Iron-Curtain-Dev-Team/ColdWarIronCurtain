 SOV_STARTUP_DESC: "In 1847, §RKarl Marx§!, and §RFriedrich Engels§!, published the Communist Manifesto, a simple pamphlet, and yet one that would shock the current world order to its core. Basing itself on the previous socio-economic analysis of capital by Marx himself, the Manifesto forumlated the basis of a new society. One that would overcome capitalism through a revolution lead by the industrial working class and would abolish class society as we knew it. Marx pictured that this revolution was to occur in states and societies where capitalism was most developed. What he couldn't have imagined, however, was that the first successful Dictatorship of the Proletariat would be established in a backwater, semi-feudal state. That state was Russia.\n\nThe Second half of 19th century and the beginning of 20th had caused the Gendarme of European Reaction quite the amount of internal political problems, exemplified by progressive bourgeoise reformers pressuring Emperor Alexander II to abolish serfdom in 1861 which led to reforms that eventually opened the door to capitalist development in Russia. And yet, this development, unlike in the west, was still weaved by big network of pre-capitalist relations, led by despotic emperors and arrogant nobility, who still fought hard to preserve long existing principles.\n\nWith capitalist development ushering in and Marx's ideas spreading across the continent, it didn't take long for a string of russian thinkers to adopt Marxism. Radicalized by the inhumane working conditions of the Russian proletariat, Marxist circles began to emerge across the major industrial centres of the Empire. One of these men, was §RVladimir Ilyich Lenin§!. Groups such as the Russian Social Democratic Labour Party attempted to unify these scattered movements under a coherent ideological framework, though they were quickly driven underground by the Tsarist secret police. \n\nThe Revolution of 1905 marked the first major rupture in imperial authority. Following defeat in the Russo-Japanese War, mass strikes and unrest forced limited concessions from Nikolai II, including the creation of the Duma. Yet these reforms barely affected the semi-feudal structure of Russia, and as such the Tsarist autocracy remained.\n\n Then, the Great War broke out. The imperialists had long been hungry to redivide an already divided world, and as such Russia found itself plunged in an inter-imperialist war which accelerated the contradictions already tearing at her foundations. By 1917, the old order had already exhausted itself. The masses no longer believed in the Tsar, the army no longer trusted its officers, and the ruling classes proved incapable of governing as before. §YChange was now inevitable§!.\n\nThe February Revolution of 1917 swept away the Romanov dynasty and put an end to centuries of autocratic rule, finally ushering in full-scale capitalist development in Russia. And yet the masses were enraged, as this new provisional government, a coalition of liberal politicians and so-called moderate socialists such as the Social-Revolutionaries, was more than keen to continue sending its sons to die for the interests of capital, then Lenin returned to Russia, and after a mere couple of months, the flames of revolution ignited once more. On the night of October 25th, the Provisional Government was overthrown with minimal bloodshed and the world's first successful Dictatorship of the Proletariat was established. The Great October Socialist Revolution had triumphed. \n\nThe victory of October was immediately met with the fiercest reaction. Landlords, capitalists, monarchists and foreign powers united in an attempt to crush the young Soviet Republic before it could consolidate itself. During the Russian Civil War, fourteen foreign states intervened alongside the White Armies, led by many young officers of the former imperial army, such as Kolhcak, Denikin and Wrangel, seeking to restore the old order, bringing immense suffering with them. The reactionary forces took part in the most vile massacres of suspected communists and minorities, sometimes including annihilation of whole settlements, bringing about devastation and mass executions known as the White Terror. The soviet government, knowing the necessity of countermeasures and understanding necessity of starting to liquidate remaining capitalist elements, would initiate the terror of its own - the Red Terror, which, however, wouldn't even closely compare with its white counterpart in terms of human sufferings. Despite famine, devastation and overwhelming odds, the workers and peasants of Russia rallied behind the Red Army under the leadership of the Bolsheviks. By 1922, the counter-revolution had been defeated and the Union of Soviet Socialist Republics was formally established. \n\nThe Soviet state inherited a country ruined by war, poverty and illiteracy. And yet, with all odds against it, it managed to overcome its backwardness. Land was redistributed, industry was nationalized and the exploitation of man by man was abolished. Universal education, healthcare and social welfare expanded on an unprecedented scale, something never before seen in any country. The celebration of all these achievements was cut short however, with the untimely death of §RVladimir Ilyich Lenin§! himself, leading to a power struggle within the vanguard party itself. \n\nIt was §RJoseph Vissarionovich Stalin§!, one of Lenin's close confidants, who took effective charge of the Soviet state as General Secretary of the VKP(B), a post to which he was assigned to by Lenin himself. With the rise of Fascism and reaction in countries such as Germany and Italy, the young Soviet Republic found herself encircled by the forces of capital, and so it was decided that ambitious five year plans would be used to industrialize the country as quick as possible to prepare for an inevitable final confrontation with imperialism. \n\nWhile the party worked in relative unity during the early years, with the exception of the Trotskyite oppositon which was expelled in 1927, by 1936 the situation was vastly different. While the 1932 famine had shown the possibility of Kulak sabotage, soon enough it became clear that there were saboteurs within the party itself, which became clear with assasination of Sergey Kirov. This Fifth Column infiltrated every state organ and even, the Sword and Shield of the Revolution, the NKVD. Stalin and the Central Committee desperately tried to piece together the conspiracy at hand, which hid itself in all ways it could, even purging and framing innocent party members to cover up their tracks. This Great Terror was finally put to an end in 1938 with the unmasking of the terrorist bloc of Rights and Trotskyites, led by Nikolai Bukharin, and the arrest and execution of Nikolai Yezhov, head of the NKVD who had been secretly working for German intelligence and responsible for countless innocent deaths. \n\nWith the internal Fifth-Columnist plot thwarted, the USSR found itself in the crossfire of agression once more as World War 2 erupted. Initially signing a non-agression pact with the Germans to buy time for the inevitable confrontation with Nazism when the latter were done with their business in the West, all hell broke loose when on June 22nd, 1941, Nazi Germany and the entire Axis bloc launched Operation Barbarossa, the largest invasion in human history. \n\n The Fascist invasion was brutal and had commenced a year earlier than the Soviets had expected, and yet the Soviet people refused to surrender. Workers, peasants, soldiers and partisans united in the Great Patriotic War, defending every city, factory and village against the invader. From the streets of Moscow to the ruins of Stalingrad, from the fields of Kursk to the final assault on Berlin, the Red Army inflicted decisive defeats upon the fascist war machine. Through immense sacrifice and unwavering determination, the Shock Brigade of the World Proletariat crushed the Fascist beast and spread the revolution Westwards. \n\n And yet, the peace after the Great Patriotic War was cut short. The Western allies, once allies to the Worker's State in its struggle against Fascism, now saw their interests threatened by the expansion of Proletarian Dictatorships into Eastern Europe. With neither side wanting to engage in full-blown warfare due to the threat of mutual nuclear annihilation, the Imperialist forces and the land of October and her allies are now engaged in a new Cold War. The future is uncertain and the tension between the two blocs is reaching a climax, yet one thing remains certain. §YThe Workers of the World will not surrender without a fight§!."
