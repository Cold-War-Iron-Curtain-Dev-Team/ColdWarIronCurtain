 ROC_STARTUP_DESC: "For more than three decades, the §YRepublic of China§! has struggled to complete the national rejuvenation first envisioned by §YDr. Sun Yat-sen§!, Father of the Nation. As of May 1949, China stands at a decisive crossroads. Our armies continue to resist the destructive advance of the §RChinese Communist insurgency§!, even as we uphold the legacy of constitutionalism, modernization, and national unity.\n\nThe dream of a free and prosperous China was born in the collapse of the corrupt Qing dynasty in §Y1911§!, when the Xinhai Revolution overthrew two centuries of imperial decay. The newly established Republic promised equality, liberty, and the restoration of China’s dignity after the catastrophic §YCentury of Humiliation§!. Yet regional warlords and foreign imperialists threatened to tear the newborn Republic apart.\n\nIt was under the guidance of §YSun Yat-sen§! and the reorganization of the §YKuomintang (KMT)§! that the vision of national unification gained direction. The §YNorthern Expedition§!, launched in 1926 under §YChiang Kai-shek§!, shattered the rule of regional warlords and restored Nanjing as the legitimate seat of Chinese government. Modern legal codes, industrial initiatives, and educational reforms followed—the first steps toward reconstructing a sovereign and modern China.\n\nBut unity was shattered by betrayal. The radical wing of the Communist faction, refusing to abide by the Republic’s laws, launched revolts across Jiangxi, Hunan, and Guangdong, plunging the countryside into terror. The §RChinese Communist Party (CCP)§! rejected Sun Yat-sen’s Three Principles of the People and sought to replace the Republic with dictatorship. To preserve national order, the government was compelled to confront the insurgents, igniting a prolonged struggle against a movement that claimed to fight for the people but ruled the territories it seized through coercion, confiscation, and ideological purges.\n\nEven as the government sought to stabilize the country, a far greater danger rose from abroad. The §REmpire of Japan§!, long covetous of Manchuria and North China, launched an invasion that plunged the nation into the §YWar of Resistance Against Japanese Aggression§!. For eight long years, our people endured massacres, bombings, starvation, and foreign occupation. From the blood-soaked ruins of Nanjing to the burning cities of Wuhan and Changsha, the Republic bore the heaviest burden of the struggle against fascist aggression.\n\nDespite impossible odds, the Republic of China never surrendered. Under §YGeneralissimo Chiang Kai-shek§!, the National Revolutionary Army fought across mountains, plains, and rivers, tying down the majority of Japan's army and buying the time the world needed to resist tyranny. International alliances were forged, industry was relocated inland, and the spirit of resistance never faltered. Even while the Communists expanded their influence in remote regions, it was the KMT government that bore the full weight of Japan’s mechanized power.\n\nVictory in 1945 restored national sovereignty, but the price was staggering: cities destroyed, millions dead, and the nation exhausted. Into this chaos, the Communists plunged the country into civil war once again. Armies loyal to the Republic fought to preserve constitutional rule, but the CCP, armed with external support and exploiting the suffering of the rural masses, advanced through deception, guerrilla warfare, and manipulation.\n\nBy 1947, as the Republic undertook §YLand Reform§! and introduced a §Yconstitutional government§!, the Communists intensified their assault. The three major campaigns—§RLiaoshen§!, §RHuaihai§!, and §RPingjin§!—dealt grievous blows to the Republic’s northern fronts, as Communist forces surrounded and overwhelmed units cut off from supplies and reinforcements by harsh terrain and sabotage.\n\nYet even in adversity, the legitimacy of the Republic endures. The government continues to uphold §YSun Yat-sen’s Three Principles§!, defend the nation’s sovereignty, and protect the rights and welfare of the Chinese people. The world recognizes the Republic as the lawful government of China, and the hope for national renewal has not been extinguished.\n\nAs of §YMay 1949§!, the situation is dire but not hopeless. The government has reestablished its stronghold in §YNanjing§!, and heroic units fight tirelessly across Huadong, Hubei, and Sichuan. The Republic still commands millions of loyal citizens, veterans, and officials dedicated to China’s survival.\n\nChina has endured civil war, foreign invasion, and ideological betrayal before. It has risen from the ashes of dynastic collapse and resisted the might of empires. So long as the Republic stands, the flame of national freedom and unity will not die.\n\n§YThe Republic of China shall endure.§!\n§YThe Three Principles of the People shall guide the nation forward.§!\n§Zhonghua Minguo Wansui!§!"
