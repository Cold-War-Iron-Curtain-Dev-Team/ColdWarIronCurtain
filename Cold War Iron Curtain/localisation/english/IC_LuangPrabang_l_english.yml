l_english:
 VIN_All_In_Luang_Prabang:0 "All In for Luang Prabang"
 VIN_All_In_Luang_Prabang_desc:0 "Hanoi can send the Pathet Lao into the Kingdom with a modest column and a limited aim, or it can stake the whole season on the royal capital. This is the heavier choice: Luang Prabang first, the Vientiane road second, and every porter in the Viet Bac strung along a corridor that no logistics plan can really hold.\n\nThis replaces the ordinary Laos offensive; the two cannot both be taken."
 VIN_All_In_Luang_Prabang_tt:0 "The Viet Minh launch the Laos offensive at once with a heavier commitment: §Y3 extra Pathet Lao divisions§!, a §Y30-day longer deadline§! and Luang Prabang as the first objective. The ordinary Laos offensive is no longer offered.\nThe corridor is stretched: the Viet Minh lose §R40 Campaign Supply§!, and if Viet Minh troops (not the Pathet Lao) hold ground beyond Luang Prabang, such as Vientiane, they suffer §RDeep Corridor Overextension§! until they withdraw. While it applies, the raid's own overextension penalty is suspended.\nThe Kingdom of Laos must still be defeated by taking both Vientiane and Luang Prabang.\nIf the Kingdom falls: §G+40 Communist Struggle score§! and §G+10 Campaign Supply§! at the start of the Lai Chau and Dien Bien Phu campaigns.\nIf it does not: §R-50 Campaign Supply§!, and the CEFEO pays §G15 fewer War Credits§! for Operation Castor."
 VIN_Campaign_Overextension_Severe:0 "Deep Corridor Overextension"
 VIN_Campaign_Overextension_Severe_desc:0 "The columns are holding ground far beyond any road they can be fed along. Convoys vanish into the hills, units arrive in pieces, and each new valley taken costs more than the last.\n\nWithdraw from the deep ground or end the corridor offensive to remove this penalty. It replaces ordinary overextension while it lasts."
 Laos_All_In_Luang_Prabang_Chosen:0 "The Viet Minh staked everything on §YLuang Prabang§!"
 Laos_All_In_Luang_Prabang_Active:0 "The §YLuang Prabang offensive§! is under way"
 Laos_All_In_Luang_Prabang_Resolved:0 "The §YLuang Prabang offensive§! has ended"
 VIN_All_In_Luang_Prabang_Corridor:0 "The §YLuang Prabang corridor§! is stretched"
 VIN_All_In_Luang_Prabang_Result_Success:0 "The Viet Minh took the Kingdom of Laos"
 VIN_All_In_Luang_Prabang_Result_Failure:0 "The Viet Minh failed to take the Kingdom of Laos"
 VIN_All_In_Luang_Prabang_Result_Superseded:0 "The Luang Prabang offensive was overtaken by the end of the war"
 VIN_All_In_Luang_Prabang_Corridor_Credited_Lai_Chau:0 "The Laos corridor already eased the move on Lai Chau"
 VIN_All_In_Luang_Prabang_Corridor_Credited_Dien_Bien:0 "The Laos corridor already eased the Dien Bien Phu campaign"
 FRE_Luang_Prabang_Callback:0 "The failed Viet Minh thrust at Luang Prabang discounts Operation Castor"
