l_english:
 flavor90.1.t:0 "[GetNewspaperHeader]Germany Is One Country"
 flavor90.1.d:0 "The two German states have united. Berlin is the capital of a single Germany again, and the inner border is gone."
 flavor90.1.a:0 "We are one country."
 flavor90.1.b:0 "The border is gone."
 flavor90.1.c:0 "Germany is united."
 flavor90.2.t:0 "[GetNewspaperHeader]The Maastricht Treaty"
 flavor90.2.d:0 "The Twelve have signed a treaty at Maastricht. It commits them to a single currency and a closer European union."
 flavor90.2.a:0 "The treaty is signed."
 flavor90.2.b:0 "Europe is drawing closer."
 flavor90.3.t:0 "[GetNewspaperHeader]Los Angeles Burns"
 flavor90.3.d:0 "A jury has acquitted the officers who beat Rodney King, and Los Angeles has gone up in fire. The riots have spread across the south of the city."
 flavor90.3.a:0 "The city is burning."
 flavor90.3.b:0 "A dreadful week."
 flavor90.4.t:0 "[GetNewspaperHeader]The Channel Tunnel Opens"
 flavor90.4.d:0 "Trains are running under the Channel. Britain and France are joined by rail for the first time, and the ferries are no longer the only way across."
 flavor90.4.a:0 "The tunnel is open."
 flavor90.4.b:0 "Paris is closer."
 flavor90.4.c:0 "They have dug under the sea."
 flavor90.5.t:0 "[GetNewspaperHeader]Oklahoma City"
 flavor90.5.d:0 "A truck bomb has destroyed the federal building in Oklahoma City. The blast killed people at their desks, including children in the building's day care."
 flavor90.5.a:0 "Find who did this."
 flavor90.5.b:0 "A terrible attack."
 flavor90.6.t:0 "[GetNewspaperHeader]Hong Kong Returns"
 flavor90.6.d:0 "At midnight the British flag came down in Hong Kong and the Chinese flag went up. A century and a half of colonial rule is over."
 flavor90.6.a:0 "The lease is over."
 flavor90.6.b:0 "Hong Kong has returned."
 flavor90.6.c:0 "The flag has changed."
 flavor90.7.t:0 "[GetNewspaperHeader]The Death of Diana"
 flavor90.7.d:0 "Diana, Princess of Wales, has died in a car crash in Paris. The mourning in Britain has stopped the ordinary news."
 flavor90.7.a:0 "The country has stopped."
 flavor90.7.b:0 "A sad day."
 flavor90.8.t:0 "[GetNewspaperHeader]The Millennium"
 flavor90.8.d:0 "The calendars have rolled to 2000. The feared computer failures did not come, and the lights stayed on."
 flavor90.8.a:0 "The lights stayed on."
 flavor90.8.b:0 "The century turned."
