l_english:
 # Hungary: Moscow's request
 SOV_psych_request_hungarian_report: "Negotiate for the Hungarian Report"
 SOV_psych_request_hungarian_report_desc: "Ask Budapest once to release its withheld instrumentation report. Hungary keeps the final choice."
 cwic_wp_psych.20.t: "Moscow Asks for the Budapest Report"
 cwic_wp_psych.20.d: "The Soviet side has raised our withheld instrumentation report through the Directorate, politely and on the record. They cannot take the file; the final disposition remains ours.\n\nReleasing it now would look like obedience. Refusing a second time would look like policy."
 cwic_wp_psych.20.a: "Release it under Hungarian terms."
 cwic_wp_psych.20.b: "The report stays in Budapest."
 HUN_psych_release_after_negotiation_tt: "The report enters the Directorate archive. For a member of a running Directorate: §G+10§! common Research Record, §G-3§! scrutiny and §G+5§! coordination. Hungary receives its instrumentation research bonus if it has not already."
 HUN_psych_refuse_negotiation_tt: "The report stays national. Moscow will answer within the year."

 # Moscow takes note (Hungary or Romania)
 cwic_wp_psych.21.t: "Moscow Takes Note"
 cwic_wp_psych.21.d_hun: "Moscow has not answered our refusal directly. Instead, Hungarian places on the next Soviet scientific exchanges have gone to other delegations, the Academy's joint seminars have been postponed, and our liaison officer is no longer invited to the meetings that matter.\n\nNothing has been said. Everything has been understood."
 cwic_wp_psych.21.d_rom: "Moscow has not answered our refusal directly. Instead, Romanian places on the next Soviet scientific exchanges have gone to other delegations, the joint seminars have been postponed, and our liaison officer is no longer invited to the meetings that matter.\n\nNothing has been said. Everything has been understood."
 cwic_wp_psych.21.a: "Send a delegation to smooth it over."
 cwic_wp_psych.21.b: "Let it stand."
 WP_psych_moscow_note_delegation_tt: "Costs §Y25 Political Power§!. For a member of a running Directorate, coordination rises by §G3§!."
 WP_psych_moscow_note_stand_tt: "Soviet exchanges are cut for a year: §R-3% research speed§! for §Y365 days§!. For a member of a running Directorate, coordination falls by §R5§!."
 WP_psych_soviet_exchange_cooled: "Soviet Exchanges Suspended"
 WP_psych_soviet_exchange_cooled_desc: "Places on Soviet scientific exchanges have gone to other delegations, and joint seminars are postponed until further notice."

 # DDR: the surveillance annex
 cwic_wp_psych.25.t: "Names in the Annex"
 cwic_wp_psych.25.d: "The surveillance annex attached to the MfS review was meant to keep the names of everyone the review assessed: volunteers, subjects, and the scientists who signed off on the protocols. A year on, it is the most requested document in the file.\n\nHauptabteilung XX wants it to watch the scientific intelligentsia. The HVA wants the names of the scientists who travel West. The review itself found no psychic method of any kind."
 cwic_wp_psych.25.a: "Release the annex to the departments."
 cwic_wp_psych.25.b: "Shred the annex and keep the report."
 DDR_psych_annex_operational_tt: "The annex enters operational use. It grants no Political Power or stability. For a member of a running Directorate: §R+5§! scrutiny and §G+2§! coordination."
 DDR_psych_annex_destroyed_tt: "Costs §Y15 Political Power§!. For a member of a running Directorate, scrutiny falls by §G3§!."

 # Poland: the auditors come back
 cwic_wp_psych.27.t: "The Auditors' Footnote"
 cwic_wp_psych.27.d_rigorous: "The Academy auditors who took the psychotronic claims apart have asked permission to publish their method: not the findings, which stay classified, but the procedure for testing an extraordinary claim. They want it in the Academy's closed bulletin, where a few hundred scientists will read it."
 cwic_wp_psych.27.d_sponsor: "One of the Academy auditors has written to the presidium. The summary sent to the sponsors, she says, misrepresents what the audit found: the cases it calls ambiguous were errors, and the report should say so."
 cwic_wp_psych.27.a: "Let them publish in the closed bulletin."
 cwic_wp_psych.27.b: "Keep the method classified."
 cwic_wp_psych.27.c: "Reopen the audit."
 cwic_wp_psych.27.d: "Transfer her to a provincial institute."
 POL_psych_publish_method_tt: "For a member of a running Directorate: §G+3§! common Research Record and §R+2§! scrutiny."
 POL_psych_classify_method_tt: "The method stays in the file."
 POL_psych_reopen_audit_tt: "Costs §Y20 Political Power§!. For a member of a running Directorate: §G+6§! common Research Record and §G-4§! scrutiny. Poland receives its statistics research bonus if it has not already."
 POL_psych_transfer_auditor_tt: "For a member of a running Directorate, scrutiny rises by §R3§!."

 # Records-room dispositions
 WP_psych_disposition_released: "Released after a Soviet request"
 WP_psych_disposition_refused: "Withheld; Moscow's request refused"
 WP_psych_disposition_annex: "Security procedures, with a surveillance annex"
 WP_psych_disposition_annex_operational: "Surveillance annex in MfS use"
 WP_psych_disposition_annex_shredded: "Security procedures; annex shredded"
 WP_psych_disposition_pol_published: "Method unsupported; test procedure published"
 WP_psych_disposition_pol_reopened: "Audit reopened; method unsupported"
 WP_psych_disposition_pol_transferred: "Ambiguous; dissenting auditor transferred"
