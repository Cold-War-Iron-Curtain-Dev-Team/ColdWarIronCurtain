l_english:
 SGP_entrepot_economy:0 "Entrepot Trade"
 SGP_entrepot_economy_desc:0 "Warehouses along Singapore's waterfront handle cargo from across the region. Established shipping routes and merchant connections give local manufacturers access to imported materials that the island cannot supply itself."
 SGP_edb_idea:0 "Economic Development Board"
 SGP_edb_idea_desc:0 "The Economic Development Board helps manufacturers find premises, arrange finance and obtain machinery. Its officers are encouraging production of household goods to provide factory employment beyond the docks and trading houses."
 SGP_pioneer_industries_idea:0 "Pioneer Manufacturing"
 SGP_pioneer_industries_idea_desc:0 "Pioneer firms are establishing electronics assembly lines with machinery and components obtained abroad. Tax concessions help draw investment into factories that can supply overseas customers without relying on a large domestic market."
 SGP_establish_edb:0 "Establish the Development Board"
 SGP_establish_edb_desc:0 "Create an Economic Development Board to assist manufacturers with finance and factory sites. A dedicated agency can turn investment proposals into working businesses, including firms making goods for the home."
 SGP_jurong_estate:0 "Develop Jurong Industrial Estate"
 SGP_jurong_estate_desc:0 "Prepare Jurong for industrial investment with serviced sites and premises for technical and commercial work. Manufacturers considering Singapore need somewhere to set up their operations beyond the crowded waterfront."
 SGP_pioneer_industries:0 "Encourage Pioneer Industries"
 SGP_pioneer_industries_desc:0 "Use pioneer tax concessions to attract firms producing for overseas markets. With Jurong prepared and the Development Board in place, electronics assembly can bring new orders and factory employment to Singapore."
