l_english:
 # Tooltips explaining delayed / event-driven focus progression
 # DOC_DOM_USA70
 DOC_Simba_Rebellion_trigger_tt:0 "The §YSimba Rebellion§! has broken out (possible from mid-§YJanuary 1964§! once §YKatanga§!, §YSouth Kasai§! and the §YFree Republic of the Congo§! are back under our control). This focus can then be bypassed."
 DOC_Simba_Rebellion_Warning_tt:0 "Once §YKatanga§!, §YSouth Kasai§! and the §YFree Republic of the Congo§! are back under our control, the §RSimba Rebellion§! may break out from mid-§YJanuary 1964§!, unlocking §YThe Formation of the CNL§!."
 DOM_Cuban_Invasion_Plot_trigger_tt:0 "Completed automatically in early §YFebruary 1959§!, when §YCuban-backed revolutionaries§! attempt to invade the Dominican Republic."
 DOM_Cuban_Invasion_Warning_tt:0 "In early §YFebruary 1959§!, §YCuban-backed revolutionaries§! are expected to attempt an invasion of our country, completing §YThe Cuban Invasion Plot§!."
 USA_70s_Somoza_Falls_trigger_tt:0 "Completed automatically when the §YSandinistas§! topple §YSomoza§! in mid-§YJuly 1979§!, unless we have completed §YDeploy Marines to Managua§! by then."
 USA_70s_Somoza_Fall_Warning_tt:0 "Unless we complete §YDeploy Marines to Managua§! before mid-§YJuly 1979§!, the §YSomoza regime§! is expected to fall to the §RSandinistas§! then, completing §YThe Fall of the Somoza Regime§!."
 # IND
 IND_60s_Issue_Ultimatum_tt:0 "§YPakistan§! will be given about §Y3 months§! to halt its operations in §YEast Pakistan§!. If it refuses, the §YLiberation War§! begins when the deadline expires and its focuses unlock; if it backs down, they stay locked unless §YPakistan§! attacks us."
 IND_60s_Liberation_War_trigger_tt:0 "Completed automatically when the §YLiberation War§! begins: about §Y3 months§! after §YIssue Ultimatum§! if §YPakistan§! rejects it, or at once if §YPakistan§! attacks us over §YEast Pakistan§!."
 IND_BENGAL.7.t2:0 "Pakistan Rejects Our Ultimatum"
 IND_BENGAL.7.d:0 "Islamabad has dismissed our ultimatum, insisting that East Pakistan is an internal matter and that it will not be dictated to by New Delhi. The crackdown goes on and refugees keep pouring across the border. When the deadline expires in about §Y3 months§!, our forces will move into §YEast Pakistan§! and the §YLiberation War§! will begin."
 IND_BENGAL.7.a2:0 "Then they leave us no choice"
 IND_BENGAL.8.t2:0 "Pakistan Accepts Our Ultimatum"
 IND_BENGAL.8.d:0 "Facing a war it may not win, the Pakistani government has bowed to our ultimatum and announced a halt to its military operations in East Pakistan. The humiliation has shaken the regime in Islamabad, while the refugees in our camps can at last begin returning home. With Pakistan backing down, we have no cause to launch the §YLiberation War§!."
 IND_BENGAL.8.a2:0 "A victory without a shot fired"
 # INO
 INO_Subardjo_Fallout_tt:0 "In about §Y10 days§! the §YSoekiman§! cabinet will §Rfall§! and the §YWilopo§! focus tree will replace this one. §RAny focus still in progress then may be lost.§!"
 INO_The_Fallout_trigger_tt:0 "Completes automatically when the §YSoekiman§! cabinet falls, about §Y10 days§! after §YThe Subardjo Agreement§!. This does not happen on the §YReaffirm Our Neutrality§! path."
 # FIN_NIC
 FIN_Korean_Inflation_trigger_tt:0 "The §YKorean War§! boom has ended and an §RInflation Crisis§! has set in. This happens about §Y21 months§! after the war breaks out."
 FIN_Korean_Boom_End_tt:0 "In about §Y21 months§! the §YKorean War§! boom will end, and our economy will fall into an §RInflation Crisis§!."
 NIC_Watchful_Eye_Raid_tt:0 "In about §Y13 months§!, §YOperation Watchful Eye§! will uncover the churches' ties to the rebels and allow us to §YDemolish Some Churches§!."
 NIC_Masaya_Raid_trigger_tt:0 "§YOperation Watchful Eye§! has led to the §YMasaya Raid§!. This happens about §Y13 months§! after §YSpy on Churches§!."
 # FRA
 FRA_CECA_1951_Elections_tt:0 "In about §Y2 months§! the §Y1951 Legislative Elections§! will be held, completing the §YLegislative elections of 1951§! focus. Their result decides which political focuses open up."
 FRA_1951_Elections_trigger_tt:0 "Completed by the §Y1951 Legislative Elections§! event, held about §Y2 months§! after completing §YRatify the Treaty of Paris§!."
 FRA_Troisieme_Force_1951_trigger_tt:0 "Completed by the §Y1951 Legislative Elections§! event if the §YTroisieme Force§! keeps its majority, or later if a §RCommunist§! government resigns after the Soviets back down."
 # JAP
 JAP_SF_Treaty_In_Force_trigger_tt:0 "The §YSan Francisco Peace Treaty§! must be in force. It comes into force around §YApril 1952§! once §YJapan Recovers the Sovereignty§! is completed; choosing §RContinue US Occupation§! means it never will."
 JAP_SF_Treaty_Comes_Into_Force_tt:0 "The §YSan Francisco Peace Treaty§! will come into force in §YApril 1952§! (or shortly after this focus, if that date has passed), ending the §YAllied Occupation§!. It is required for §YSubversive Activities Prevention Act§!."
 JAP_Tokyo_Olympic_trigger_tt:0 "The §YTokyo Olympics§! must begin. An event completes this focus between §Ymid-April and mid-May 1964§! if §YHayato Ikeda§! is still Prime Minister."
 JAP_Ikeda_Resignation_tt:0 "About §Y1 month§! after the §YTokyo Olympics§!, the ailing §YHayato Ikeda§! will resign and name §YEisaku Sato§! as his successor. A week later §YSato§! takes office: the §YIkeda§! branch will §Rclose§!, losing any unfinished focuses, and the §YSato Administration§! branch will open."
 JAP_Appoint_Eisaku_Sato_As_Successor_trigger_tt:0 "Completed automatically about §Y1 month§! after the §YTokyo Olympics§!, when the ailing §YHayato Ikeda§! announces his resignation."
 JAP_Sato_Takes_Office_tt:0 "In about §Y1 week§!, §YEisaku Sato§! will take office as Prime Minister. The §YIkeda§! branch will then §Rclose§!, losing any unfinished focuses, and the §YSato Administration§! branch will open."
 jap_ikeda.2.t:0 "Prime Minister Ikeda Resigns"
 jap_ikeda.2.d:0 "Weakened by illness, Prime Minister §YHayato Ikeda§! has announced that he will step down, now that the §YTokyo Olympics§! have shown a rebuilt Japan to the world. The Liberal Democratic Party has named §YEisaku Sato§! as his successor, and he is expected to form a new cabinet within days."
 jap_ikeda.2.a:0 "Sato will carry the torch."
 JAP_Leader_Change.5.t:0 "Eisaku Sato Becomes Prime Minister"
 JAP_Leader_Change.5.d:0 "§YEisaku Sato§! has formed a new cabinet and taken office as Prime Minister of Japan, succeeding the ailing §YHayato Ikeda§!. Sato, the younger brother of former Prime Minister §YNobusuke Kishi§!, was long Ikeda's rival within the Liberal Democratic Party."
 JAP_Leader_Change.5.a:0 "A new cabinet takes office."
 jap_culture.5.t:0 "[GetNewspaperHeader]Tokyo Hosts the Olympic Games"
 jap_culture.5.d:0 "For the first time, the Olympic Games are being held in Asia. Tokyo, rebuilt from the ruins of the war, has welcomed athletes from around the world with new stadiums and expressways. For Japan, the Games mark its return to the international community as a peaceful and prosperous nation."
 jap_culture.5.a:0 "Japan has returned to the world!"
 # PRC
 PRC_Three_And_Five_Anti_Coming_tt:0 "In about §Y2 months§! the §YMovement against the Three Evils§! will begin, completing §YFight with Bureaucratic Corruption and Decay§!. About §Y2 months§! after that the §YMovement against the Five Evils§! will follow, completing §YOppose the Big Bourgeoisie in Industry and Commerce§!."
 PRC_Korean_War_Begun_trigger_tt:0 "The §YKorean War§! has begun"
 PRC_Three_Anti_By_Event_trigger_tt:0 "While the §YKorean War§! goes on, this focus is completed by an event about §Y2 months§! after completing §YThe Campaign to Increase Production And Practice Economy§!"
 PRC_Five_Anti_By_Event_trigger_tt:0 "While the §YKorean War§! goes on, this focus is completed by an event about §Y4 months§! after completing §YThe Campaign to Increase Production And Practice Economy§!"
 PRC_PLAAF_Coming_tt:0 "In about §Y4 months§! the §YPLA Air Force§! will be formally established by an event, completing §YEstablish PLAAF§!."
 PRC_PLAAF_By_Event_trigger_tt:0 "Completed by an event about §Y4 months§! after completing §YLessons from Three Major Campaigns§!"
 # SOV
 SOV_Publish_Samantha_Smith_Letter_effect_tt:0 "From around §YApril 1983§!, Samantha Smith may write again, this time to Ambassador §YDobrynin§!. If the §YUnited States§! presses Andropov to answer, we will be able to §Yinvite her to the USSR§!."
 SOV_Samantha_Smith_Reply_trigger_tt:0 "§YAndropov§! has answered Samantha Smith's letter. This can happen from around §YApril 1983§!, but only if the §YUnited States§! presses him for an answer."
 SOV_Adopted_Decree_No_659_trigger_tt:0 "Has completed the decision §YDecree No. 659§!, which is unlocked by §YPrioritize Intensive Development of the Economy§! and takes §Y30 days§!."
 SOV_Adopt_the_Law_on_Labor_Collectives_effect_tt:0 "In about §Y2 months§!, the §YLaw on Labour Collectives§! will be adopted with the following effects:"
 SOV_AND.25.t:0 "The Law on Labour Collectives"
 SOV_AND.25.desc:0 "The Supreme Soviet has adopted the Law on Labour Collectives and Increasing Their Role in the Management of Enterprises, Institutions and Organisations. Workers' collectives will now take part in drafting and discussing their enterprises' plans, although directors still have plenty of room to sidestep their decisions."
 SOV_AND.25.a:0 "Let the collectives have their say."
 SOV_AND.27.t:0 "Amendments to the Law on Labour Collectives"
 SOV_AND.27.desc:0 "The amendments to the Law on Labour Collectives have come into force. They clarify the role of labour collectives in decision-making and give them firmer legal powers to influence how their enterprises are managed."
 SOV_AND.27.a:0 "A further step forward."
 # USA88_WGR
 USA_FP88_Multilateral_Talks_Chain_tt:0 "The §YSoviet Union§!, §YPalestine§! and §YIsrael§! will each answer our invitation in turn. If all three accept, we will choose between §YThe Madrid Accords§! and a §YPalestinian statehood§! proposal; if any of them refuses, §RThe Talks Fail§!."
 USA_FP88_Madrid_Accords_trigger_tt:0 "Completed by an event if the §YSoviet Union§!, §YPalestine§! and §YIsrael§! all accept our talks proposal and we choose to push for a §Ymoderate course§!."
 USA_FP88_Talks_Fail_trigger_tt:0 "Completed by an event if the §YSoviet Union§!, §YPalestine§! or §YIsrael§! rejects our talks proposal, or if §YIsrael§! refuses Palestinian statehood about §Y2 weeks§! after we propose it."
 USA_FP88_Palestine_Framework_trigger_tt:0 "Completed by an event if we push for §YPalestinian statehood§! during the talks and §YIsrael§! agrees to it, about §Y2 weeks§! later."
 USA_FP88_Israel_Statehood_Answer_tt:0 "§YIsrael§! will answer our statehood proposal in about §Y2 weeks§!. If they agree, we complete §YFramework for an Independent Palestine Agreed Upon§!; if they refuse, §RThe Talks Fail§!."
 USA_FP88_Madrid_Accords_Path_tt:0 "This will complete §YThe Madrid Accords§!."
 USA_FP88_Offer_Multilateral_Talks:0 "Offer Multilateral Talks"
 USA_FP88_The_Madrid_Accords:0 "The Madrid Accords"
 USA_FP88_The_Talks_Fail:0 "The Talks Fail"
 USA_FP88_Framework_for_an_Independent_Palestine_Agreed_Upon:0 "Framework for an Independent Palestine Agreed Upon"
 WGR_Schumacher_Death_Warning_tt:0 "§YChancellor Schumacher§! never fully recovered from his stroke and has §Rless than 2 weeks§! to live. His death will reveal the §Ysuccession§! branch of the focus tree, and whoever holds more influence, §YOllenhauer§! or §YFranke§!, will be best placed to succeed him."
 # YUG_NGA
 YUG_djilas_rise_tt:0 "In about §Y100 days§!, §YMilovan Djilas§! will be appointed President, and his criticism of the Party will soon follow. §YEnshrine the Tito Personality Cult§! and §YRelax State Security Controls§! unlock once he is §Rpurged§!, in about §Y4 months§!."
 YUG_djilas_purged_trigger_tt:0 "§YMilovan Djilas§! has been §Rpurged§! from the Party (about §Y4 months§! after the constitutional amendments are finalized)"
 NGA_civil_war_1967_tt:0 "From §YJanuary 1967§!, Nigeria will slide into §Rcivil war§!: §YBiafra§! secedes if the counter-coup §Ysucceeds§!, and §YHausaland§! breaks away if it §Yfails§!."
 NGA_hausaland_war_trigger_tt:0 "The §YNigerian Civil War§! in §YHausaland§! is ongoing (it breaks out from §YJanuary 1967§! if the §YNorthern Counter-Coup§! failed)"
 NGA_biafran_war_trigger_tt:0 "The §YNigerian Civil War§! in §YBiafra§! is ongoing (it breaks out from §YJanuary 1967§! if the §YNorthern Counter-Coup§! succeeded)"
 # VIE
 VIE_Xuan_Interim_PM_tt:0 "§YNguyen-Van-Xuan§! will only be an interim premier. He will resign by about §Ymid-January 1950§! (within about §Y3 weeks§! if this focus is completed after §YDecember 1949§!), leaving the office of §YPrime Minister§! open for a successor."
 VIE_Vinh_French_Displeasure_tt:0 "Honoring the §YViet-Quoc§! will turn the §YFrench High Commission§! against §YTran-Quang-Vinh§!. In about §Y2 weeks§! he will be §Rforced to resign§!, completing §YResign§! and leaving the premiership open for a successor."
 VIE_Vinh_Resign_trigger_tt:0 "Completed by an event about §Y2 weeks§! after §YRehabilitate Phuc-Quoc Members§!, when the §YFrench§! force §YTran-Quang-Vinh§! to resign. The other prerequisites do not need to be finished."
