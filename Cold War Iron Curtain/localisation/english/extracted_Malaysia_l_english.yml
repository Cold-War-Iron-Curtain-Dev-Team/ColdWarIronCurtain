 Malaysia.0.a:0 "To Our New Nation!"
 Malaysia.0.b:0 "Interesting."
 Malaysia.0.t:0 "[GetNewspaperHeader]The Formation of Malaysia"
 Malaysia.0.d:0 "Kuala Lumpur, [?global.date.GetDateStringNoHourLong] - The Federation of Malaysia has come into being, uniting the states of the peninsula with the Borneo territories under a single flag and a single parliament. Crowds filled the padang for the proclamation, and the Union Jack came down for the last time over territories the Colonial Office had governed for a century.\n\nThe new federation is an ambitious piece of construction. It joins Malay sultanates, a Chinese commercial city and two Borneo states with little in common beyond the fact of British administration, and it does so while an insurgency still smoulders in the northern jungle. Its architects argue that only a federation of this size can hold the region against communism; its critics reply that a state assembled this quickly will spend a decade discovering what it actually is.\n\nRecognition has been swift from London and Washington and conspicuously absent elsewhere. Malaysia begins its life with a constitution, an army and neighbours who have not yet decided what to make of it."
