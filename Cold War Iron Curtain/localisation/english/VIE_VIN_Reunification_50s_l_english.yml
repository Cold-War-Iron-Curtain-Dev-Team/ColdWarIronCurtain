l_english:

 # ------------------------------------------------------------
 # National election preparations
 # ------------------------------------------------------------

  VIE_VIN_Reunification_50s.1.t:0 "Preparing for a National Election"
  VIE_VIN_Reunification_50s.1.d:0 "The Geneva settlement has placed the question of Vietnam's future before the entire nation. Its provisions call for countrywide elections to determine a single Vietnamese government, ending the temporary division imposed by war, occupation, and foreign intervention. \n\nIn the Democratic Republic, preparations have begun in earnest. Cadres are assembling electoral registers, printing committees are drafting campaign materials, and delegates from the north, center, and south have been invited to discuss how a national vote might be conducted under conditions of peace. For Ho Chí Minh and the Government, the election is not merely a constitutional exercise. It is meant to prove that Vietnamese unity can be achieved through the will of the people rather than imposed by foreign armies. \n\nYet no election can proceed without cooperation from the authorities in the south. Hanoi can prepare its own districts, but the decisive question remains unanswered: will Saigon honor the promise of national reunification?"

  VIE_VIN_Reunification_50s.1.a:0 "The ballot must complete the revolution."


  # ------------------------------------------------------------
  # VIE decision
  # ------------------------------------------------------------

  VIE_VIN_Reunification_50s.2.t:0 "The Question of National Elections"
  VIE_VIN_Reunification_50s.2.d:0 "The northern government has begun preparations for the nationwide election envisioned by the Geneva settlement. In Saigon, the proposal has triggered sharp debate among ministers, military officers, religious leaders, and foreign advisers. \n\nSupporters of the vote argue that an election could grant the southern government international legitimacy, reduce the danger of renewed war, and permit Vietnam to determine its future without another generation of bloodshed. Their opponents warn that the north's superior organization and Ho Chí Minh's prestige would turn any national vote into a victory for Hanoi. They contend that accepting the election would mean surrendering the South's political independence before the campaign had even begun. \n\nThe government must decide whether the promise of reunification will be honored—or whether the temporary line dividing Vietnam will harden into a permanent frontier."
  VIE_VIN_Reunification_50s.2.a:0 "Honor the national commitment."
  VIE_VIN_Reunification_50s.2.b:0 "The South must remain separate."


  # ------------------------------------------------------------
  # Election cancellation
  # ------------------------------------------------------------

  VIE_VIN_Reunification_50s.3.t:0 "The Elections Are Cancelled"
  VIE_VIN_Reunification_50s.3.d:0 "The prospect of a nationwide election has collapsed. Southern authorities have rejected the proposed vote, arguing that the conditions required for a free election do not exist and that the Democratic Republic cannot be permitted to extend its political system across the whole country. \n\nIn Hanoi, the announcement has been received as a repudiation of both the Geneva settlement and the principle of national self-determination. Party newspapers describe the decision as the work of foreign influence and domestic reaction, while veterans of the resistance warn that the country has been denied the peaceful reunification for which so many fought. \n\nThe partition of Vietnam was meant to be temporary. Its cancellation now forces the Democratic Republic to confront a harsher question: whether national unity can still be achieved through negotiation, or whether a new struggle lies ahead."
  VIE_VIN_Reunification_50s.3.a:0 "The nation has been denied its voice."


  # ------------------------------------------------------------
  # French channel
  # ------------------------------------------------------------

  VIE_VIN_Reunification_50s.4.t:0 "A Channel Through Paris"
  VIE_VIN_Reunification_50s.4.d:0 "The collapse of the election process has not entirely closed the path of diplomacy. Charles de Gaulle and circles within the French political establishment have indicated that Paris may be willing to discuss a settlement that preserves Vietnamese independence while preventing the partition from becoming the opening of another major war. \n\nFor Hanoi, such contact is fraught with risk. France remains the former colonial power, and many Vietnamese remember the costs of compromise made under conditions of weakness. Yet a French channel may also offer a means to pressure the southern government, restrain foreign intervention, and reopen the question of reunification before the division becomes irreversible. \n\nThe Government has authorized discreet exploratory talks. No agreement has been reached, but diplomacy will be given one more chance to restore a united Vietnam."
  VIE_VIN_Reunification_50s.4.a:0 "Let diplomacy test the partition."


  # ------------------------------------------------------------
  # Southern liberation preparations
  # ------------------------------------------------------------

  VIE_VIN_Reunification_50s.5.t:0 "Preparing for the Liberation of the South"
  VIE_VIN_Reunification_50s.5.d:0 "With the national elections cancelled and the southern authorities refusing a political settlement, the Democratic Republic has begun to reassess the means by which reunification may be achieved. Publicly, Hanoi continues to speak of peace, national unity, and the rights guaranteed by the Geneva settlement. Privately, cadres are being instructed to preserve underground networks, strengthen contacts with veterans of the southern resistance, and prepare the political foundations for a renewed struggle. \n\nThe task is not yet open war. The southern countryside remains fragmented, and an immediate confrontation could invite direct foreign intervention. Instead, the Government intends to cultivate an organized movement capable of linking local grievances to the larger demand for Vietnamese reunification. \n\nFor those who hoped the ballot would end the division of the country, this is a bitter turn. But in the words of the resistance, the cause of unity has only changed its field of battle."
  VIE_VIN_Reunification_50s.5.a:0 "The South has not been forgotten."


  # ------------------------------------------------------------
  # Global reunification news
  # ------------------------------------------------------------

  VIE_VIN_Reunification_50s.100.t:0 "[GetNewspaperHeader]Vietnam Reunified After National Elections"
  VIE_VIN_Reunification_50s.100.d:0 "Vietnam has been reunified under a single national government following the successful conclusion of the countrywide election process. The vote, held after years of war, temporary partition, and intense international pressure, has ended the separate administrations that emerged from the collapse of French colonial rule. \n\nIn Hanoi, Ho Chí Minh and the Democratic Republic have proclaimed that the result confirms the will of the Vietnamese people to live in one independent state. Delegations from across the former dividing line have gathered to begin the difficult work of integrating administrations, armed forces, and economic systems long shaped by rival authorities and foreign sponsors. \n\nThe reunification of Vietnam is being watched closely throughout Asia. To supporters of the new government, it represents a major victory for national self-determination and the anti-colonial movements that have transformed the postwar world. To its opponents, it marks a significant alteration of the strategic balance in Southeast Asia. \n\nFor Vietnam itself, the promise is simpler and more profound: the country has again become one nation."
  VIE_VIN_Reunification_50s.100.a:0 "A single Vietnam stands again."
