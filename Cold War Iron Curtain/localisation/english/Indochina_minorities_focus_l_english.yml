 MEO_struggle_for_meo_independence:0 "Struggle for Meo Independence"
 MEO_struggle_for_meo_independence_desc:0 "will be added"
 MEO_question_of_national_autonomy:0 "The Question on Our National Autonomy"
 MEO_question_of_national_autonomy_desc:0 "The war in the delta is decided and the northern question with it. Sooner or later Hanoi must say plainly what the highlands are to be: a region that governs itself under the republic's flag, or provinces administered like any other. We would rather ask the question ourselves, while our militia still holds the passes and our answer still carries weight, than wait for a ministry to answer it for us.\n\n§YHanoi will decide, and its answer will settle which road the plateau takes.§!"
 MEO_the_duong_trung_nhan_revolt:0 "The Duong Trung Nhan Revolt"
 MEO_the_duong_trung_nhan_revolt_desc:0 "The settlement has held for four years, and four years has been long enough for its enemies to regroup. Duong Trung Nhan has drawn the disaffected notables, the border smugglers and the Tho phi bands into a single movement, and this time the Duong tribal king presses his own claim to the Hmong crown rather than another man's. The plateau must choose between the arrangement it has and the one it is being offered."
 MEO_combat_the_duong_trung_nhan_revolt:0 "Combat the Duong Trung Nhan Revolt"
 MEO_combat_the_duong_trung_nhan_revolt_desc:0 "will be added"
 MEO_solidify_ho_chi_minh_thought:0 "Solidify Ho Chi Minh Thought"
 MEO_solidify_ho_chi_minh_thought_desc:0 "will be added"
 MEO_permitpavnsreinforcements:0 "Permit PAVN's Reinforcements"
 MEO_permitpavnsreinforcements_desc:0 "will be added"
 MEO_proclaim_duong_trung_nhan_as_king_of_the_meo:0 "Proclaim Duong Trung Nhan as King of the Meo"
 MEO_proclaim_duong_trung_nhan_as_king_of_the_meo_desc:0 "The 1959 uprising has opened a path for the Duong tribal king to cast aside the Vietnamese communist settlement, take the crown his family was denied for three generations, and restore a Hmong monarchy in the highlands."
