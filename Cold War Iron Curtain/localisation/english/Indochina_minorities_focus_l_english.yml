 # === CCC Focus Tree extracted from VIE_focus_l_english.yml ===
 CCC_Accept_Reunification: "A Unified Vietnam"
 CCC_Accept_Reunification_desc: "Cochinchina agrees to join Bao-Dai's State of Vietnam, ending the question of southern autonomy."

 CCC_Xu_Namky: "Xu Nam-Ky"
 CCC_Xu_Namky_desc: "Cochinchina asserts its southern identity and refuses to be absorbed into a Northern-dominated Vietnam."

 CCC_Prepare_Annexation: "Preparing the Transfer"
 CCC_Prepare_Annexation_desc: "Administrative preparations are made to transfer Cochinchinese governance to Saigon's authority."

 CCC_Declare_Independence: "Independence of the Nam-Ky Republic"
 CCC_Declare_Independence_desc: "Vietnam has made its ultimatum. We reject it. Nam-Ky will chart its own course."

 CCC_CuongDe_Voyage: "Cuong-De Passes Through"
 CCC_CuongDe_Voyage_desc: "Prince Cuong-De, long exiled in Japan, passes through Cochinchina. His presence galvanizes southern nationalists."

 CCC_Secular_vs_CaoDai: "Secularism or the Cao-Dai?"
 CCC_Secular_vs_CaoDai_desc: "With Cuong-De's visit stirring political passions, Cochinchinese leaders must choose between a secular nationalist course and courting the Cao-Dai religious establishment."

 CCC_Destroy_Bandits: "Clear the Delta"
 CCC_Destroy_Bandits_desc: "Binh-Xuyen criminal networks continue to destabilize the Mekong Delta. Working alongside Saigon, we will clear them out."

 CCC_NgoDinh_Bros: "The Ngo Dinh Brothers"
 CCC_NgoDinh_Bros_desc: "The Ngo Dinh family, influential Catholic nationalists from Hue, could be powerful political allies. We extend an offer of cooperation."

 CCC_Hijack_QuocGia_cause: "The True Nationalists"
 CCC_Hijack_QuocGia_cause_desc: "Saigon claims to represent all of Vietnam, but we are the true heirs of the Quoc-Gia cause. Cochinchina will position itself as the rightful center of Vietnamese nationalism."

 CCC_Delay_Reunification_Attempts: "Delay Reunification Pressure"
 CCC_Delay_Reunification_Attempts_desc: "Saigon's calls for reunification can be deflected. We will stall, negotiate, and build our independent state before any final decision is forced upon us."

 CCC_Formalize_NamKy_Culture: "Codify Nam-Ky Culture"
 CCC_Formalize_NamKy_Culture_desc: "Nam-Ky has a distinct culture shaped by the Mekong Delta, French colonialism, and centuries of southern migration. We will formalize this identity as the foundation of our state."

 CCC_Codify_NamKy_Language: "The Southern Tongue"
 CCC_Codify_NamKy_Language_desc: "The southern Vietnamese dialect carries generations of meaning that Hanoi's bureaucrats do not speak. We codify our language as a mark of independence."

 CCC_Intensify_AntiBacKyism: "Against the North"
 CCC_Intensify_AntiBacKyism_desc: "Northern Vietnamese influence must be resisted. Southern culture, southern values, and southern governance - not northern domination."

 CCC_Seek_US_Recognition: "Seek American Recognition"
 CCC_Seek_US_Recognition_desc: "The United States, wary of communist expansion in Southeast Asia, may be sympathetic to an independent anti-communist state in the south."

 CCC_Finish_NhonDao_Constitution: "The NhonDao Constitution"
 CCC_Finish_NhonDao_Constitution_desc: "Cochinchina writes a humanist constitution grounded in NhonDao principles - a southern Vietnamese identity distinct from both Saigon's royalism and Hanoi's communism."

 CCC_National_Identity_Question: "Who Are We?"
 CCC_National_Identity_Question_desc: "Cochinchina must decide: are we a separate Nam-Ky nation, or the true heirs of Vietnamese nationalism?"

 CCC_End_Saigon_Strikes: "End the Saigon Strikes"
 CCC_End_Saigon_Strikes_desc: "Labor unrest in Saigon threatens stability. The government moves to resolve the strikes before they become a political crisis."

 CCC_Maintain_Xuan_Junta: "The Junta Endures"
 CCC_Maintain_Xuan_Junta_desc: "General Nguyen Van Xuan's military government offers the stability that Cochinchina needs. The junta will remain in power."

 CCC_Host_Elections: "A Vote for the South"
 CCC_Host_Elections_desc: "Elections will legitimize Cochinchina's independence and build a popular mandate. Democracy, however fragile, is our path forward."

 CCC_Intensify_AntiCommunism: "Anti-Communist Security"
 CCC_Intensify_AntiCommunism_desc: "Communist infiltration is a constant threat. The security apparatus will be strengthened to root out Viet-Minh sympathizers and protect the state."

 CCC_Maintain_French_Ties: "Maintain French Ties"
 CCC_Maintain_French_Ties_desc: "France remains a powerful patron. Maintaining close ties with Paris brings economic investment, military support, and diplomatic protection."

 CCC_End_TranVanOn: "Justice for Tran-Van-On"
 CCC_End_TranVanOn_desc: "The 1950 death of student leader Tran Van On during a protest remains a wound in Cochinchinese politics. The government addresses the grievances that sparked the unrest."

 CCC_Undermine_VietMinh: "Undermine the Viet-Minh"
 CCC_Undermine_VietMinh_desc: "Viet-Minh cells operate throughout the south. Counter-intelligence operations, defection incentives, and community policing will erode their influence."

 CCC_Promote_Francophilia: "A French Cultural Legacy"
 CCC_Promote_Francophilia_desc: "French language, law, and culture have shaped Cochinchinese society. Rather than resent this heritage, we will embrace it as a source of national distinction."

 CCC_Suppress_BinhXuyen: "Suppress the Binh-Xuyen"
 CCC_Suppress_BinhXuyen_desc: "The Binh-Xuyen criminal syndicate controls Saigon's underworld and extorts the state. Their operations in our territory must end."

 CCC_Embrace_NhonDao: "Embrace Nhon-Dao"
 CCC_Embrace_NhonDao_desc: "The Nhon-Dao humanist philosophy offers a third way between Western liberalism and Eastern communism - a distinctly Vietnamese path for a distinctly southern state."

 CCC_HoiDong_TuVan_Power: "Empower the Hoi-Dong Tu-Van"
 CCC_HoiDong_TuVan_Power_desc: "The Hoi-Dong Tu-Van, Cochinchina's advisory council, will be granted expanded powers. This consultative body bridges military governance and civilian representation."

 CCC_Intensify_QuanQuan: "Strengthen the Quan-Quan"
 CCC_Intensify_QuanQuan_desc: "The Cochinchinese armed forces require significant investment. Expanded recruitment and new equipment will build a military capable of defending our independence."

 CCC_Modernize_Mandarin_Bureaucracy: "Reform the Mandarin Bureaucracy"
 CCC_Modernize_Mandarin_Bureaucracy_desc: "The old mandarin system, a relic of the imperial era, must be modernized. Merit-based promotion, streamlined administration, and reduced corruption will strengthen the state."
