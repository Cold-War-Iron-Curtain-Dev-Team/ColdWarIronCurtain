 MEO_approvethehoangfamilystakeover:0 "Approve the Hoang Family's Takeover"
 MEO_stay_the_course:0 "Stay the Course"
 MEO_stay_the_course_desc:0 "The uprising is spent and the Hoang house has not taken the plateau. Whatever its faults, the compact struck with Hanoi during the resistance has carried Dong Van through worse seasons than this one, and the men who made it are still alive to defend it. We will change nothing, promise nothing and provoke nobody - and we will let the passes see that the highlands can be governed without a crown and without a war."
 MEO_approvethehoangfamilystakeover_desc:0 "will be added"
 MEO_accept_the_unification_with_vietnam:0 "Accept the Unification with Vietnam"
