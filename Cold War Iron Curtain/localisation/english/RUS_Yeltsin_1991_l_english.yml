l_english:
 # ==============================================================================
 # RUSSIAN FEDERATION: YELTSIN 1991 FOCUS TREE LOCALISATION
 # ==============================================================================
 # Tree Header
 RUS_90s_Yeltsin_1991: "The Yeltsin Administration (1991-1999)"
 RUS_90s_Yeltsin_1991_desc: "The tumultuous inaugural decade of the Russian Federation, defined by democratic breakthrough, traumatic economic transformation, regional conflicts, and the painful birth of a new state order."

 # Diplomatic & Foreign Policy Branch
 RUS_Andrey_Kozyrev_New_Post: "Andrey Kozyrev's Foreign Policy"
 RUS_Andrey_Kozyrev_New_Post_desc: "With the dawn of the Russian Federation, seasoned diplomat Andrey Kozyrev takes the helm at the Ministry of Foreign Affairs. Kozyrev advocates for liberal internationalism, peaceful integration into the Western-led global order, and partnership with the democracies of Europe and North America."
 
 RUS_Found_the_Council_of_the_Baltic_Sea_States: "Found the Council of the Baltic Sea States"
 RUS_Found_the_Council_of_the_Baltic_Sea_States_desc: "Regional stability across the Baltic littoral is essential for securing Russia's western trade routes and preventing Kaliningrad from becoming an isolated exclave. Joining Germany, the Nordic states, Poland, and the newly sovereign Baltic republics in Copenhagen will foster multilateral cooperation."
 
 RUS_Found_the_EuroFaculty: "Establish the EuroFaculty"
 RUS_Found_the_EuroFaculty_desc: "Modernizing our educational institutions requires direct academic exchanges with European universities. By co-sponsoring the EuroFaculty initiative in Tartu, Riga, and Vilnius, Russia can educate a new generation of lawyers, economists, and administrators grounded in market democracy."
 
 RUS_Push_for_Partnership_of_Peace_Program: "Push for Partnership for Peace"
 RUS_Push_for_Partnership_of_Peace_Program_desc: "To reassure our European neighbors and construct a post-Cold War security architecture without new dividing lines, Russia must engage with NATO through the Partnership for Peace (PfP) framework. Mutual trust can only be built through transparent joint exercises and diplomatic liaison."
 
 RUS_Peace_at_Home: "The Federation Treaty"
 RUS_Peace_at_Home_desc: "The Russian Federation encompasses dozens of ethnic republics, autonomous regions, and vast territories that risk disintegrating into centrifugal chaos. Negotiating a comprehensive Federation Treaty will establish clear federal jurisdictions, devolve economic powers, and preserve Russia's territorial integrity."
 
 RUS_War_in_Abkhazia: "The Abkhazian Conflict"
 RUS_War_in_Abkhazia_desc: "Ethnic warfare has erupted along the Black Sea coast as Abkhazian forces clash with the military forces of the newly independent Republic of Georgia. As local commanders take matters into their own hands, Moscow must assert its authority as a regional mediator and peacekeeping guarantor."
 
 RUS_Massacre_in_Sukhumi: "The Fall of Sukhumi"
 RUS_Massacre_in_Sukhumi_desc: "The bitter siege of Sukhumi has ended in tragedy, displacement, and reciprocal atrocities. Russia must manage the refugee influx, maintain humanitarian corridors, and pressure both sides to sign an armistice before the entire Caucasus descends into uncontrolled conflagration."
 
 RUS_The_Oslo_I_Accord: "Endorse the Oslo Accords"
 RUS_The_Oslo_I_Accord_desc: "As a co-sponsor of the Middle East peace process alongside the United States, the Russian Federation lends its international weight to the historic Oslo I Accord between Israel and the Palestine Liberation Organization."

 # Yeltsin Presidency & Domestic Political Branch
 RUS_Glory_to_Russia_Our_Fatherland: "Glory to Russia, Our Fatherland"
 RUS_Glory_to_Russia_Our_Fatherland_desc: "Rising from the ashes of ideological dogma, the Russian Federation reclaims its ancient sovereignty, its historical tricolor flag, and the enduring dignity of its peoples. Russia's future belongs to democracy, rule of law, and spiritual renewal."
 
 RUS_The_Yeltsin_Presidency: "The Yeltsin Presidency"
 RUS_The_Yeltsin_Presidency_desc: "Elected by popular vote as President of the Russian Soviet Federative Socialist Republic before the coup, Boris Nikolayevich Yeltsin now stands as the supreme executive of a fully independent Russian state. He commands enormous personal popularity and an historic mandate for transformation."
 
 RUS_Talk_with_Shushkevich: "Consult with Stanislav Shushkevich"
 RUS_Talk_with_Shushkevich_desc: "In order to resolve the paralysis of Soviet central institutions and chart a path toward a voluntary commonwealth, President Yeltsin meets with the Chairman of the Supreme Soviet of Belarus, Stanislav Shushkevich, at the state residence of Viskuli in the Belovezha Forest."
 
 RUS_Talk_with_Kravchuk: "Consult with Leonid Kravchuk"
 RUS_Talk_with_Kravchuk_desc: "Following the Ukrainian independence referendum of December 1, 1991, in which over 90 percent voted to leave the USSR, Ukrainian President Leonid Kravchuk holds the decisive key to the future of the Soviet Union. Bilateral consensus between Moscow and Kyiv is indispensable."
 
 RUS_The_Belovezh_Accords: "The Belovezh Accords"
 RUS_The_Belovezh_Accords_desc: "On December 8, 1991, the leaders of the three founding republics of the USSR—Russia, Ukraine, and Belarus—convene in the Belovezha Forest. Together, they declare that the Union of Soviet Socialist Republics, as a subject of international law and a geopolitical reality, ceases its existence, and establish the Commonwealth of Independent States (CIS)."
 
 RUS_The_Union_Forever_Buried: "The Union Forever Buried"
 RUS_The_Union_Forever_Buried_desc: "The hammer and sickle is permanently lowered from the Grand Kremlin Palace, replaced by the white, blue, and red tricolor. The Union of Soviet Socialist Republics is no more. Russia assumes the legal succession of the Soviet state in the United Nations and the international community."
 
 RUS_Establish_the_Post_of_Vice_President: "Confirm the Vice Presidency"
 RUS_Establish_the_Post_of_Vice_President_desc: "To consolidate the executive branch and bridge ties with the military, Afghan war hero and aviation general Alexander Rutskoy is confirmed as Vice President of the Russian Federation."
 
 RUS_A_Speach_to_the_American_Congress: "Speech to the US Congress"
 RUS_A_Speach_to_the_American_Congress_desc: "In June 1992, Boris Yeltsin addresses a joint session of the United States Congress in Washington, receiving repeated standing ovations as he declares: 'The idol of Communism, which spread everywhere social strife, animosity, and unparalleled brutality, which instilled fear in humanity, has collapsed!'"
 
 RUS_The_Question_of_Prime_Minister_Post: "The Question of the Prime Minister"
 RUS_The_Question_of_Prime_Minister_Post_desc: "President Yeltsin has held the powers of Prime Minister directly during the first emergency months of reform. Now, under mounting pressure from the Supreme Soviet, a permanent head of government must be chosen: radical reform economist Yegor Gaidar or pragmatic Gazprom industrialist Viktor Chernomyrdin."
 
 RUS_Compromise_with_the_Supreme_Soviets: "Compromise with the Supreme Soviet"
 RUS_Compromise_with_the_Supreme_Soviets_desc: "Rather than forcing an immediate constitutional confrontation with Chairman Ruslan Khasbulatov and the Congress of People's Deputies, the executive offers legislative concessions, slower economic deregulation, and shared appointments."
 
 RUS_Disband_the_Supreme_Soviets: "Disband the Supreme Soviet"
 RUS_Disband_the_Supreme_Soviets_desc: "The Soviet-era 1978 Constitution creates dual power and an impossible legislative deadlock that paralyses governance. Yeltsin resolves to cut the Gordian knot: dissolve the Supreme Soviet, abolish the Congress of People's Deputies, and call new parliamentary elections."
 
 RUS_Push_for_an_End_to_the_Planned_Economy_System: "Dismantle the Command Economy"
 RUS_Push_for_an_End_to_the_Planned_Economy_System_desc: "Gosplan, centralized price controls, and state supply rationing have brought the country to the verge of famine and total breakdown. Russia must decisively transition toward market competition, private initiative, and open prices."
 
 RUS_Macroeconomic_Stabilization: "Macroeconomic Stabilization"
 RUS_Macroeconomic_Stabilization_desc: "Halting the runaway printing of unbacked rubles, curbing budget deficits, and restoring consumer goods to empty store shelves require tight fiscal discipline and coordinated central bank policy."
 
 RUS_Assume_Special_Powers: "Assume Special Presidential Powers"
 RUS_Assume_Special_Powers_desc: "In the face of unprecedented economic emergency and institutional paralysis, President Yeltsin seeks special decree powers from parliament to push through crucial economic reforms without legislative delays."
 
 RUS_Organize_Pro_Government_Protestors: "Mobilize Democratic Rallies"
 RUS_Organize_Pro_Government_Protestors_desc: "As the standoff between the Kremlin and the White House intensifies, hundreds of thousands of Muscovites take to the streets to defend the elected presidency and democratic reforms against hardline opposition."
 
 RUS_Ukaz_1400: "Presidential Decree No. 1400"
 RUS_Ukaz_1400_desc: "On September 21, 1993, Boris Yeltsin signs Decree No. 1400 'On Gradual Constitutional Reform in the Russian Federation'. The decree suspends the powers of the Supreme Soviet and Congress of People's Deputies and schedules a national referendum on a new democratic constitution."
 
 RUS_Secure_Support_from_the_Army_and_Intelligentsia: "Rally the Military & Intelligentsia"
 RUS_Secure_Support_from_the_Army_and_Intelligentsia_desc: "Securing the loyalty of Defense Minister Pavel Grachev, key military garrison commanders, and the cultural intelligentsia ensures that the armed forces will uphold constitutional order when the crisis reaches its boiling point."
 
 RUS_The_Black_October: "Black October 1993"
 RUS_The_Black_October_desc: "Armed clashes between parliamentary militias and federal interior forces culminate in the encirclement and shelling of the White House in central Moscow. The tragic showdown results in the total defeat of the parliamentary rebellion and paves the way for the December 1993 Constitution."

 # Regional Defense & Near Abroad Branch
 RUS_The_Yeltsin_Doctrine: "The Yeltsin Doctrine"
 RUS_The_Yeltsin_Doctrine_desc: "Russia possesses special historical responsibilities and security interests across the former Soviet space—the 'Near Abroad'. Moscow will actively intervene as a peacekeeper to halt inter-ethnic bloodshed and protect Russian-speaking populations."
 
 RUS_The_Tajik_Civil_War: "Intervene in the Tajik Civil War"
 RUS_The_Tajik_Civil_War_desc: "Civil war has erupted in Tajikistan between the secular government and Islamist-democratic factions, with guerrilla fighters crossing freely from Afghanistan. The Russian 201st Motor Rifle Division and border guard units must secure the Afghan frontier and stabilize Dushanbe."
 
 RUS_The_War_in_Chechenya: "Crisis in Chechnya"
 RUS_The_War_in_Chechenya_desc: "Former Soviet Air Force General Dzhokhar Dudayev has seized power in Grozny, declared the sovereign Chechen Republic of Ichkeria, and refused to sign the Federation Treaty. Federal forces must prepare to restore constitutional order in the rebel republic."
 
 RUS_Khasavyurt_Accord: "The Khasavyurt Accord"
 RUS_Khasavyurt_Accord_desc: "Following the bloody Battle of Grozny in August 1996, Security Council Secretary Alexander Lebed and Chechen chief of staff Aslan Maskhadov negotiate the Khasavyurt Accord. Federal troops withdraw, and the final determination of Chechnya's political status is deferred to 2001."
 
 RUS_Invasion_of_Dagestan: "Repel the Invasion of Dagestan"
 RUS_Invasion_of_Dagestan_desc: "In August 1999, radical Wahhabi insurgent brigades led by Shamil Basayev and Ibn al-Khattab invade western Dagestan, attempting to establish an Islamic state. Russian federal forces and Dagestani civilian militias must coordinate to crush the invaders."
 
 RUS_Second_Chechen_Counter_Terrorism: "The Counter-Terrorism Operation"
 RUS_Second_Chechen_Counter_Terrorism_desc: "Triggered by the invasion of Dagestan and the apartment bombings in Russian cities, federal forces launch a comprehensive counter-terrorism operation into Chechnya. Under unified military and FSB command, constitutional authority is systematically re-established across the North Caucasus."

 # State Security & FSB (Lubyanka) Branch
 RUS_Martial_Law_in_Chechenya_and_Kalmykia: "State of Emergency in the North Caucasus"
 RUS_Martial_Law_in_Chechenya_and_Kalmykia_desc: "To counter separatist insurgencies and weapon trafficking, special security protocols and military cordons are established across the North Caucasus military district."
 
 RUS_Fight_off_the_Chcehen_Insurgency: "Contain Insurgent Infiltration"
 RUS_Fight_off_the_Chcehen_Insurgency_desc: "Interior troops, OMON, and federal security forces coordinate sweeps against rebel weapons caches, underground ambushes, and hostage-taking rings in the Caucasian foothills."
 
 RUS_Dismantle_the_KGB: "Dismantle the Monolithic KGB"
 RUS_Dismantle_the_KGB_desc: "In the wake of the August 1991 putsch, the sprawling KGB is broken apart. Foreign espionage is transferred to the SVR, communications security to FAPSI, and internal counterintelligence to the new Ministry of Security (MBRF)."
 
 RUS_Defang_the_Securocrats: "Reorganize the FSK"
 RUS_Defang_the_Securocrats_desc: "Distrustful of the MBRF's hesitation during the October 1993 crisis, Yeltsin signs Decree No. 2167, replacing the ministry with the Federal Counterintelligence Service (FSK) and curtailing its arrest and detention powers."
 
 RUS_Rebuild_Lubyanka_FSB: "Federal Law No. 40-FZ: Found the FSB"
 RUS_Rebuild_Lubyanka_FSB_desc: "The operational realities of the Chechen war and rising organized crime demonstrate that a weakened security service cannot protect the state. Law No. 40-FZ formally establishes the Federal Security Service (FSB), restoring full investigative and armed detention authority."
 
 RUS_TsSN_Alpha_and_Vympel: "Empower TsSN Alpha and Vympel"
 RUS_TsSN_Alpha_and_Vympel_desc: "The elite Alpha and Vympel special forces units are unified under the newly created FSB Special Purpose Center (TsSN). They provide the Federation with world-class hostage rescue, counter-terrorism, and high-risk surgical strike capabilities."
 
 RUS_Putin_Appointed_FSB_Director: "Appoint Vladimir Putin to Lubyanka"
 RUS_Putin_Appointed_FSB_Director_desc: "In July 1998, President Yeltsin appoints trusted Petersburg administrator and former foreign intelligence officer Vladimir Putin as Director of the FSB. Putin reorganizes Lubyanka into a tightly centralized and disciplined instrument of state."
 
 RUS_The_Siloviki_Consolidation: "The Siloviki Consolidation"
 RUS_The_Siloviki_Consolidation_desc: "Under Nikolai Patrushev and Vladimir Putin, veterans of the state security organs—the 'siloviki'—step forward to restore state authority, combat terror networks, and protect the sovereign institutions of the Russian Federation."

 # Military Reorganization Branch
 RUS_Legacy_of_the_Soviet_Army: "Legacy of the Soviet Armed Forces"
 RUS_Legacy_of_the_Soviet_Army_desc: "The Russian Federation inherits the overwhelming bulk of the Soviet military machine: millions of soldiers, tens of thousands of armored vehicles, nuclear arsenals, and vast stockpiles of equipment. We must evaluate this colossal heritage and determine its future command structure."
 
 RUS_United_Armed_Forces_of_the_Commonwealth_of_Independent_States: "United Armed Forces of the CIS"
 RUS_United_Armed_Forces_of_the_Commonwealth_of_Independent_States_desc: "Attempting to preserve unified strategic control over nuclear weapons and conventional forces, Moscow proposes that all former republics maintain joint armed forces under the operational command of Marshal Yevgeny Shaposhnikov."
 
 RUS_Unified_Armed_Forces: "CIS Joint Defense Treaties"
 RUS_Unified_Armed_Forces_desc: "Formalize collective security pacts among the CIS member states, ensuring coordinated air defense networks, shared military intelligence, and joint training exercises."
 
 RUS_A_Centralized_Russian_Army: "A National Russian Military"
 RUS_A_Centralized_Russian_Army_desc: "With Ukraine, Belarus, and other republics establishing their own independent armies, relying on a toothless CIS joint command is an illusion. Russia must build its own sovereign, centralized armed forces under direct national command."
 
 RUS_Invincible_and_Legendary: "The Pride of the Fatherland"
 RUS_Invincible_and_Legendary_desc: "Carrying forward the glorious martial traditions of the Russian Army and the Great Patriotic War, our soldiers remain the unyielding shield of the Russian state."
 
 RUS_To_Serve_Russia: "To Serve the Russian Federation"
 RUS_To_Serve_Russia_desc: "Presidential Decree No. 466 officially creates the Armed Forces of the Russian Federation. Russian soldiers swear their sacred oath of loyalty to the Russian people, the President, and the Constitution."
 
 RUS_Propose_the_Pan_European_Collective_Security: "Pan-European Security Architecture"
 RUS_Propose_the_Pan_European_Collective_Security_desc: "Russia proposes the creation of an inclusive European security architecture from Vancouver to Vladivostok, ensuring that European defense is not dominated exclusively by NATO expansion."
 
 RUS_Turn_Back_on_America: "Pivot to Multi-Polarity"
 RUS_Turn_Back_on_America_desc: "Western unilateralism, NATO expansion toward our frontiers, and indifference to Russian national interests require an end to naive Atlanticism. Russia must champion a multi-polar world order."
 
 RUS_America_Agrees_to_European_Security_Re_Evaluation: "Partnership with the West"
 RUS_America_Agrees_to_European_Security_Re_Evaluation_desc: "Washington and European capitals recognize Russia as an indispensable partner in European stability, opening doors to deep defense consultations and shared peacekeeping."

 # Transcaucasia & Nagorno-Karabakh Branch
 RUS_The_Mi_8_Shoot_Down: "The 1991 Mi-8 Shootdown Incident"
 RUS_The_Mi_8_Shoot_Down_desc: "The shootdown of an internal troops helicopter in the skies over Nagorno-Karabakh carrying senior Russian and Kazakh peace observers brings the Transcaucasian conflict to an alarming peak. Moscow must assert decisive peacekeeping leverage."
 
 RUS_Withdraw_the_366th_Guards_Motor_Rifle_Regiment: "Withdraw the 366th Regiment"
 RUS_Withdraw_the_366th_Guards_Motor_Rifle_Regiment_desc: "Stationed in Stepanakert in the midst of fierce ethnic fighting, the 366th Guards Motor Rifle Regiment has found itself drawn into the crossfire. To prevent further Russian casualties, the regiment is withdrawn to Russian territory, leaving heavy equipment behind."
 
 RUS_Begin_Direct_Arm_Sales_to_Armenia: "Deliver Armaments to Yerevan"
 RUS_Begin_Direct_Arm_Sales_to_Armenia_desc: "Armenia is an ancient Christian civilization and our traditional strategic ally in the Southern Caucasus. Providing defense materiel and technical advisors will preserve the balance of power."
 
 RUS_Rescind_Control_of_the_295th_Division_to_Azerbaijan: "Transfer the 295th Division to Baku"
 RUS_Rescind_Control_of_the_295th_Division_to_Azerbaijan_desc: "In exchange for lucrative Caspian oil pipeline agreements and transit rights, Moscow hands over conventional hardware from the Soviet 295th Motor Rifle Division to the armed forces of Azerbaijan."
 
 RUS_Aid_Armenian_Air_Defences: "Modernize Armenian Air Defense"
 RUS_Aid_Armenian_Air_Defences_desc: "Integrate radar stations and surface-to-air missile batteries in Gyumri and Yerevan into the CIS joint air defense umbrella, protecting Armenian skies from aerial strikes."
 
 RUS_Cease_Fire_in_Karabakh: "Broker the Bishkek Ceasefire"
 RUS_Cease_Fire_in_Karabakh_desc: "In May 1994, through active Russian mediation under the Bishkek Protocol, Armenia, Azerbaijan, and Nagorno-Karabakh agree to a comprehensive ceasefire, freezing the conflict and halting six years of devastating warfare."
 
 RUS_Begin_Sellinf_Off_Priced_Equipment_to_Yerevan: "Consolidate Strategic Alliance with Armenia"
 RUS_Begin_Sellinf_Off_Priced_Equipment_to_Yerevan_desc: "Offer preferential arms agreements and artillery deliveries to Armenia in exchange for a permanent Russian military garrison at the 102nd Military Base in Gyumri."
 
 RUS_Negotiate_Favorable_Gas_Prices_with_Baku: "Negotiate Energy Accords with Baku"
 RUS_Negotiate_Favorable_Gas_Prices_with_Baku_desc: "Secure long-term natural gas pipeline concessions, Caspian seabed drilling rights, and favorable pricing terms with Azerbaijan."

 # Post-Soviet Economic Reform Branch
 RUS_Gaidar_Shock_Therapy: "Gaidar's Shock Therapy"
 RUS_Gaidar_Shock_Therapy_desc: "On January 2, 1992, Yegor Gaidar unfreezes state price controls overnight. While consumer prices spike and savings are eroded, food shortages vanish from store shelves and market mechanisms take root across the Federation."
 
 RUS_Chubais_Voucher_Privatization: "Chubais' Voucher Privatization"
 RUS_Chubais_Voucher_Privatization_desc: "Headed by Anatoliy Chubais, the State Property Committee issues 10,000-ruble privatization vouchers to all 148 million Russian citizens, allowing people to acquire shares in previously state-owned factories, mines, and enterprises."
 
 RUS_Loans_for_Shares: "Loans for Shares Auctions"
 RUS_Loans_for_Shares_desc: "Faced with a catastrophic budget deficit ahead of the 1996 presidential election, the Kremlin auctions stakes in lucrative state oil, nickel, and metallurgical monopolies to commercial banks in exchange for vital government loans, creating the powerful oligarchic elite."
 
 RUS_Tame_Hyperinflation: "Tame Hyperinflation"
 RUS_Tame_Hyperinflation_desc: "Establishing the ruble exchange rate corridor and enforcing disciplined monetary policy by Central Bank Chairman Viktor Gerashchenko successfully tames post-Soviet inflation and stabilizes consumer prices."
 
 RUS_IMF_Stabilization_Tranches: "IMF Stabilization Tranches"
 RUS_IMF_Stabilization_Tranches_desc: "Securing multi-billion-dollar extended fund facility tranches from the International Monetary Fund reassures international investors and provides hard-currency reserves for the Central Bank."
 
 RUS_The_1998_Financial_Crisis: "The 1998 Ruble Collapse"
 RUS_The_1998_Financial_Crisis_desc: "Hit by the Asian financial crisis and plummeting global oil prices, the Russian government defaults on its domestic GKO bonds on August 17, 1998, devaluing the ruble and triggering widespread banking panic."
 
 RUS_Primakov_Economic_Compromise: "The Primakov Compromise"
 RUS_Primakov_Economic_Compromise_desc: "Appointed Prime Minister in the wake of the August crash, elder statesman Yevgeny Primakov partners with Central Bank head Viktor Gerashchenko. Their pragmatic, production-focused approach pays off state wage arrears and sparks rapid domestic industrial import substitution."

 # ==============================================================================
 # EVENTS LOCALISATION
 # ==============================================================================

 Belovezh_Accords.0.t: "Consultations in the Belovezha Forest"
 Belovezh_Accords.0.d: "Representatives of the Russian leadership have arrived at the government dacha in Viskuli, Belarus, to discuss the deepening institutional collapse of the Soviet Union. As Mikhail Gorbachev's draft Union Treaty flounders, Boris Yeltsin has proposed that the core Slavic republics resolve the constitutional impasse on their own terms."
 Belovezh_Accords.0.a: "Begin the negotiations."

 Belovezh_Accords.1.t: "Belarus Agrees to Dialogue"
 Belovezh_Accords.1.d: "Stanislav Shushkevich, Chairman of the Supreme Soviet of Belarus, has welcomed the Russian delegation to Viskuli. With economic paralysis gripping the country and central ministries in Moscow powerless, the Belarusian leadership agrees that a new commonwealth structure must replace the Soviet center."
 Belovezh_Accords.1.a: "A new framework is within reach."

 Belovezh_Accords.3.t: "The Signing of the Belovezh Accords"
 Belovezh_Accords.3.d: "On December 8, 1991, in the secluded forest of Belovezha, Boris Yeltsin, Leonid Kravchuk, and Stanislav Shushkevich sign the historic agreement establishing the Commonwealth of Independent States.\n\nThe preamble delivers a seismic declaration: 'We, the Republic of Belarus, the Russian Federation (RSFSR), and Ukraine, as founder states of the USSR, signatories of the Union Treaty of 1922... state that the USSR as a subject of international law and a geopolitical reality ceases its existence.'\n\nThe seven-decade history of the Soviet superstate has reached its legal and political conclusion."
 Belovezh_Accords.3.a: "Sign the Accords. The Union is dissolved."

 Belovezh_Accords.4.t: "Ukraine Ratifies the Belovezh Accords"
 Belovezh_Accords.4.d: "President Leonid Kravchuk has signed the Belovezh Accords on behalf of Ukraine, formally ending Ukraine's ties to the former central government in Moscow while affirming membership in the newly established Commonwealth of Independent States."
 Belovezh_Accords.4.a: "Acknowledged."

 Belovezh_Accords.5.t: "Belarus Ratifies the Belovezh Accords"
 Belovezh_Accords.5.d: "The Supreme Soviet of Belarus has officially ratified the Belovezh Accords, confirming the creation of the CIS and the peaceful dissolution of the Soviet Union."
 Belovezh_Accords.5.a: "Acknowledged."

 Belovezh_Accords.6.t: "The Dissolution of the Soviet Union"
 Belovezh_Accords.6.d: "In a stunning announcement from the Belovezha Forest near Brest, the leaders of Russia, Ukraine, and Belarus have declared that the Union of Soviet Socialist Republics has ceased to exist as a subject of international law.\n\nIn its place, a voluntary Commonwealth of Independent States (CIS) has been established to maintain economic links, open borders, and coordinated command of strategic nuclear forces. Around the globe, world leaders react with astonishment to the peaceful dissolution of the twentieth century's greatest communist superpower."
 Belovezh_Accords.6.a: "The world has changed forever."

 SOV_END.0.t: "The Russian Federation Emerges"
 SOV_END.0.d: "The Soviet Union is officially history. The Russian Federation steps onto the world stage as a sovereign democracy, assuming the Soviet seat on the United Nations Security Council and full responsibility for nuclear stewardship and international treaties."
 SOV_END.0.a: "Long live the Russian Federation!"

 SOV_END.1.t: "Sovereign Independence Confirmed"
 SOV_END.1.d: "With the formal liquidation of the Soviet Union, our nation stands fully independent and sovereign, free from central tutelage."
 SOV_END.1.a: "Independence is achieved!"

 Yeltsin.1.t: "Boris Yeltsin: President of the Russian Federation"
 Yeltsin.1.d: "Boris Nikolayevich Yeltsin has officially assumed the supreme executive office of the sovereign Russian Federation. The charismatic former Moscow party chief who famously stood on a tank to defend democracy during the August 1991 coup now leads a nation of 148 million people through uncharted political and economic waters."
 Yeltsin.1.a: "A new era begins."

 Yeltsin.2.t: "The Vice Presidency Confirmed"
 Yeltsin.2.d: "President Yeltsin has signed legislation confirming Alexander Rutskoy, Hero of the Soviet Union and decorated Afghan War combat aviator, as Vice President of the Russian Federation. Rutskoy's appointment bridges the gap between the reformist Kremlin administration and the military-industrial establishment."
 Yeltsin.2.a: "Vice President Rutskoy takes office."

 Yeltsin.3.t: "Selecting the Head of Government"
 Yeltsin.3.d: "President Yeltsin must now appoint a dedicated Prime Minister to run day-to-day government operations and steer the economy through turbulent waters.\n\nYegor Gaidar, the 36-year-old intellectual leader of the radical economic reformers, proposes accelerating price liberalization and privatization. Alternatively, veteran gas industry executive Viktor Chernomyrdin offers pragmatic industrial stability, closer ties to state enterprises, and a more gradualist transition."
 Yeltsin.3.a: "Appoint Yegor Gaidar: Accelerate market reforms."
 Yeltsin.3.b: "Appoint Viktor Chernomyrdin: Choose industrial compromise."

 Yeltsin.4.t: "The Red Flag Lowered Over the Kremlin"
 Yeltsin.4.d: "At 7:32 PM on December 25, 1991, following Mikhail Gorbachev's televised resignation address, the red Soviet state flag with the hammer and sickle is slowly lowered from the dome of the Senate Palace in the Moscow Kremlin for the final time. Minutes later, the historic Russian tricolor is raised in its place."
 Yeltsin.4.a: "An empire passes into history."

 Yeltsin.6.t: "Yeltsin Addresses the US Congress"
 Yeltsin.6.d: "President Boris Yeltsin has delivered a historic speech before a joint session of the United States Congress. He pledged that Russia has irrevocably turned its back on totalitarianism, imperial expansion, and ideological confrontation, calling for a lasting friendship between the Russian and American peoples."
 Yeltsin.6.a: "A partnership for peace."

 Yeltsin.7.t: "The Yeltsin Doctrine Announced"
 Yeltsin.7.d: "The Russian government has articulated its core foreign policy doctrine for the post-Soviet space. The 'Yeltsin Doctrine' affirms that Russia reserves the special right and responsibility to conduct peacekeeping operations throughout the 'Near Abroad' to prevent ethnic cleansing, protect minorities, and ensure strategic stability."
 Yeltsin.7.a: "Russia remains the guarantor of regional stability."

 Yeltsin.8.t: "The Tajik Civil War Intervention"
 Yeltsin.8.d: "With civil war engulfing Tajikistan, Russian mechanized brigades of the 201st Motor Rifle Division and federal border guards have deployed into Dushanbe and the Panj river frontier. Russian forces have secured government installations and halted insurgent columns crossing from northern Afghanistan."
 Yeltsin.8.a: "Order the 201st Division to hold the line."

 Yeltsin.9.t: "Crisis in the North Caucasus"
 Yeltsin.9.d: "In Grozny, separatist forces led by Dzhokhar Dudayev have seized administrative buildings, seized Soviet armories, and declared the sovereign Chechen Republic of Ichkeria. Dudayev refuses to recognize federal law or collect federal taxes, presenting the Kremlin with an unprecedented challenge to the territorial unity of the Federation."
 Yeltsin.9.a: "Prepare security options for the North Caucasus."

 Yeltsin.10.t: "Demonstrations in Moscow"
 Yeltsin.10.d: "Tensions between the President and the Supreme Soviet have spilled onto the streets of Moscow. Tens of thousands of pro-democracy demonstrators have gathered near the Kremlin and the Moscow City Hall, chanting slogans in support of President Yeltsin and demanding a fresh constitution."
 Yeltsin.10.a: "The voice of the people stands with the President."

 Yeltsin_FP.1.t: "Andrey Kozyrev Appointed Foreign Minister"
 Yeltsin_FP.1.d: "President Yeltsin has confirmed career diplomat Andrey Kozyrev as Minister of Foreign Affairs. Kozyrev pledges to end decades of ideological hostility with the West, seek Russia's integration into global economic and security bodies, and pursue a policy of democratic internationalism."
 Yeltsin_FP.1.a: "Diplomacy guided by democratic values."

 Yeltsin_FP.2.t: "Council of the Baltic Sea States Founded"
 Yeltsin_FP.2.d: "In Copenhagen, the foreign ministers of ten regional nations, including Russia, Germany, Sweden, and Poland, have formally established the Council of the Baltic Sea States (CBSS). The council will coordinate trade, environmental protection, and energy transit around the Baltic Sea."
 Yeltsin_FP.2.a: "A new regional forum is born."

 Yeltsin_FP.3.t: "Russia Joins the CBSS"
 Yeltsin_FP.3.d: "Russia's membership in the Council of the Baltic Sea States ensures that the Kaliningrad region will not be cut off from European trade networks and establishes regular diplomatic dialogue with our northwestern neighbors."
 Yeltsin_FP.3.a: "Cooperation in the Baltic."

 Yeltsin_FP.4.t: "Establishment of the EuroFaculty"
 Yeltsin_FP.4.d: "The EuroFaculty initiative has been launched to modernize higher education across the Baltic littoral. Russian law and economics professors will participate in exchange programs to reform curriculum along contemporary European lines."
 Yeltsin_FP.4.a: "Invest in higher education."

 Yeltsin_FP.5.t: "Russia Proposes Partnership for Peace"
 Yeltsin_FP.5.d: "The Russian Federation has formally proposed participating in NATO's Partnership for Peace (PfP) program. Moscow seeks transparent military consultations, joint search-and-rescue drills, and confidence-building measures without drawing new military dividing lines in Europe."
 Yeltsin_FP.5.a: "Accept Russia into the Partnership for Peace."
 Yeltsin_FP.5.b: "Decline to formalize military ties with Moscow."

 Yeltsin_FP.6.t: "The Federation Treaty Signed"
 Yeltsin_FP.6.d: "In St. George's Hall of the Grand Kremlin Palace, representatives of 86 of Russia's 88 constituent republics and regions have signed the landmark Federation Treaty. The accord delegates broad budgetary autonomy to regional authorities while definitively preserving the sovereignty and territorial integrity of the Russian Federation."
 Yeltsin_FP.6.a: "The Federation holds together."

 Yeltsin_FP.7.t: "The Battle of Sukhumi"
 Yeltsin_FP.7.d: "Following intense urban combat, Sukhumi has fallen to Abkhazian forces backed by North Caucasian volunteer brigades. Thousands of Georgian civilians and military personnel have fled down the Black Sea coast. Russian naval vessels have been dispatched to evacuate refugees and prevent further bloodshed."
 Yeltsin_FP.7.a: "Dispatch humanitarian relief and peacekeeping forces."

 CIS.0.t: "Unified Armed Forces of the CIS Formed"
 CIS.0.d: "In Minsk, member nations of the Commonwealth of Independent States have agreed to create the Joint Armed Forces of the CIS under the operational command of Marshal of Aviation Yevgeny Shaposhnikov. The treaty aims to maintain strategic nuclear command and conventional border security under a unified roof."
 CIS.0.a: "Strategic forces remain united."

 CIS.1.t: "CIS Collective Defense Agreement"
 CIS.1.d: "Our nation has ratified the joint defense protocols of the Commonwealth of Independent States, agreeing to coordinate air defense, military communication frequencies, and strategic equipment maintenance with partner republics."
 CIS.1.a: "Ratify the protocols."

 Yeltsin_Geo.1.t: "Pan-European Collective Security Framework"
 Yeltsin_Geo.1.d: "The Russian government has proposed a comprehensive Pan-European Collective Security treaty to the United States. Under the proposal, security decisions affecting European stability would be deliberated jointly, preventing NATO expansion from isolating democratic Russia."
 Yeltsin_Geo.1.a: "Agree to structured security consultations with Moscow."
 Yeltsin_Geo.1.b: "Rebuff the initiative; NATO remains the sole security arbiter."

 Yeltin_Mil.1.t: "Armed Forces of the Russian Federation Established"
 Yeltin_Mil.1.d: "On May 7, 1992, President Boris Yeltsin signs Presidential Decree No. 466, formally creating the Armed Forces of the Russian Federation. Army General Pavel Grachev is appointed Minister of Defense. The new military inherits the proud battle honors of Russian history while facing the monumental challenge of restructuring for the 21st century."
 Yeltin_Mil.1.a: "To serve the Russian Federation!"

 Karabach_Rus.1.t: "Withdrawal of the 366th Motor Rifle Regiment"
 Karabach_Rus.1.d: "Russian forces of the 366th Guards Motor Rifle Regiment have completed their evacuation from Stepanakert. Caught in the escalating crossfire of the Nagorno-Karabakh war, the regiment's withdrawal prevents Russian soldiers from becoming entangled in ethnic conflict, though significant armaments have passed to local Armenian self-defense forces."
 Karabach_Rus.1.a: "Our soldiers return home."

 RUS_ECON90.1.t: "Gaidar's Price Shock"
 RUS_ECON90.1.d: "On January 2, 1992, Yegor Gaidar unfreezes state price controls overnight. Within days, prices for bread, dairy, and consumer goods soar by hundreds of percent, wiping out household savings in state banks. Yet, for the first time in memory, long queues disappear and goods return to store shelves. Russia has taken the irreversible leap into the market economy."
 RUS_ECON90.1.a: "A painful, but necessary, transition."

 RUS_ECON90.2.t: "Anatoliy Chubais & Voucher Privatization"
 RUS_ECON90.2.d: "Headed by Anatoliy Chubais, the State Property Committee has launched the voucher privatization program. Every Russian citizen receives a voucher with a face value of 10,000 rubles, exchangeable for shares in state factories. While many citizens sell their vouchers for quick cash, a new class of private entrepreneurs begins to purchase control of the nation's industrial assets."
 RUS_ECON90.2.a: "Distribute the vouchers."

 RUS_ECON90.3.t: "The Loans-for-Shares Auctions"
 RUS_ECON90.3.d: "Confronted by catastrophic budget shortfalls and unpaid pensions ahead of the 1996 elections, the government adopts the 'Loans-for-Shares' scheme conceived by Vladimir Potanin. In closed auctions, consortiums of private commercial banks loan money to the state in exchange for controlling equity stakes in natural resource giants like Yukos, Norilsk Nickel, and Sibneft.\n\nWhile the state receives essential cash, the controversial program solidifies the immense political and economic power of Russia's new oligarchs."
 RUS_ECON90.3.a: "Approve the auctions: Secure vital treasury funds."
 RUS_ECON90.3.b: "Reject the scheme: Keep natural monopolies in state hands."

 RUS_ECON90.4.t: "The Ruble Corridor & Monetary Defense"
 RUS_ECON90.4.d: "To halt wild currency speculation and tame persistent inflation, the Central Bank of Russia and the Ministry of Finance have introduced the 'Ruble Corridor', pegging the ruble's exchange rate within defined bands. Supported by tight monetary discipline, monthly inflation drops to single digits, restoring confidence in the national currency."
 RUS_ECON90.4.a: "The ruble is stabilized."

 RUS_ECON90.5.t: "The August 1998 Financial Crash"
 RUS_ECON90.5.d: "On August 17, 1998, battered by the Asian financial crisis and tumbling crude oil prices down to 10 dollars per barrel, the Russian government and Central Bank announce an emergency 90-day moratorium on foreign debt payments and a massive devaluation of the ruble.\n\nThe GKO treasury bond market collapses, major commercial banks freeze operations, and ordinary citizens line up outside shuttered branches. President Yeltsin dismisses Sergei Kirienko and must appoint a consensus government to prevent state collapse."
 RUS_ECON90.5.a: "A catastrophic blow to the financial system."

 RUS_ECON90.6.t: "The Primakov Stabilization Cabinet"
 RUS_ECON90.6.d: "Appointed Prime Minister with overwhelming cross-party support from the State Duma, respected statesman Yevgeny Primakov partners with Central Bank Chairman Viktor Gerashchenko. Refusing radical ideological formulas, Primakov's government prioritizes paying back wages and pensions, halts speculative bond schemes, and supports domestic manufacturing.\n\nAided by the devalued ruble, Russian domestic industries surge into life, delivering unexpected and robust economic growth."
 RUS_ECON90.6.a: "The Russian economy begins to heal."

