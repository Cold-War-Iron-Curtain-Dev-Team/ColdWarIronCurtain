 Yeltsinonomics_1: "Price Shock & Market Transition"
 Yeltsinonomics_1_desc: "The dismantling of the Soviet command economy and sudden price liberalization have unleashed rampant inflation, budget deficits, and social hardship, while laying the foundations for private enterprise."
 
 Yeltsinonomics_2: "Macroeconomic Stabilization"
 Yeltsinonomics_2_desc: "Monetary discipline, reduced deficit spending, and trade normalization have begun to rein in runaway inflation, fostering market stability."
 
 RUS_voucher_privatization: "Voucher Privatization"
 RUS_voucher_privatization_desc: "The mass distribution of privatization vouchers has transferred thousands of state enterprises into private hands, accelerating capital formation at the cost of rising wealth disparity."
 
 RUS_loans_for_shares_oligarchy: "The Semibankirshchina"
 RUS_loans_for_shares_oligarchy_desc: "A small cartel of influential banking and natural-resource oligarchs holds immense leverage over media, industry, and Kremlin statecraft in exchange for financing the administration."
 
 RUS_tamed_inflation: "Tamed Hyperinflation"
 RUS_tamed_inflation_desc: "The establishment of a currency corridor and strict central bank reserve ratios have restored baseline stability to the Russian ruble."
 
 RUS_imf_assistance: "IMF Stabilization Tranches"
 RUS_imf_assistance_desc: "Foreign credits from the International Monetary Fund and international creditors provide vital hard-currency liquidity to the treasury."
 
 RUS_1998_financial_collapse: "The 1998 Default Crisis"
 RUS_1998_financial_collapse_desc: "The sovereign debt default on short-term treasury obligations and the collapse of the ruble have triggered a severe banking panic and erased foreign investor confidence."
 
 RUS_primakov_industrial_recovery: "Domestic Industrial Recovery"
 RUS_primakov_industrial_recovery_desc: "Pragmatic management, state wage repayment, and currency devaluation have breathed new life into domestic manufacturing and agricultural producers."
 
 Declining_Political_Situation: "Constitutional Impasse"
 Declining_Political_Situation_desc: "The bitter institutional struggle between the President and the Supreme Soviet paralyzes federal legislation and threatens to plunge the country into civil war."
 
 World_Renowned_Army: "Martial Traditions of the Motherland"
 World_Renowned_Army_desc: "Rooted in the heroic heritage of the Russian and Soviet armed forces, our soldiers maintain unmatched combat resilience and tactical determination."
 
 RUS_centralized_russian_military: "The Armed Forces of the Russian Federation"
 RUS_centralized_russian_military_desc: "A unified, professional national military structure directly subordinate to the Russian Ministry of Defense."
 
 RUS_peace_at_home_spirit: "Federal Accord"
 RUS_peace_at_home_spirit_desc: "Broad regional autonomy and consensual power-sharing under the Federation Treaty guarantee peace and internal cohesion across Russia's republics."
 
 RUS_partnership_for_peace: "Partnership for Peace"
 RUS_partnership_for_peace_desc: "Structured military cooperation and liaison exchanges with NATO promote regional stability and confidence-building without formal alliance entanglements."
