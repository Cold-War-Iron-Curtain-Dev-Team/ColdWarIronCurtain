l_english:
 WP_PSYCH_DIRECTORATE: "Warsaw Pact Psychotronics Directorate"
 WP_PSYCH_DIRECTORATE_desc: "A shared research-and-intelligence archive for comparing psychotronics claims, experimental controls, and counterintelligence findings. Historical Research Record measures documentation quality—not paranormal power."
 HUN_PSYCHOTRONICS: "Hungarian Instrumentation Review"
 HUN_PSYCHOTRONICS_desc: "A bounded examination of instruments, physiological responses, photography, and therapeutic-pedagogy claims."
 ROM_PSYCHOTRONICS: "Romanian Biophysical File"
 ROM_PSYCHOTRONICS_desc: "A controlled biophysical-response study whose raw-data disposition will test Pact coordination."

 WP_psych_open_directorate_records: "Open the Directorate Records"
 WP_psych_open_directorate_records_desc: "Open the read-only Directorate dashboard. Material actions, costs, and timers remain in the decision system."
 SOV_psych_convene_directorate: "Convene the Pact Appraisal Directorate"
 SOV_psych_convene_directorate_desc: "Organize a central comparison staff, import completed national records once, and invite eligible communist allies in our faction."
 SOV_psych_directorate_organization: "Organizing the Directorate"
 SOV_psych_directorate_organization_desc: "The services and academies are agreeing on custody, terminology, and common reporting standards."
 SOV_psych_repair_directorate_coordination: "Repair Directorate Coordination"
 SOV_psych_repair_directorate_coordination_desc: "Re-establish document formats and secure liaison channels. This repairs coordination; it does not improve any paranormal claim."
 SOV_psych_integrated_assessment: "Commission the Integrated Assessment"
 SOV_psych_integrated_assessment_desc: "Compare the accumulated Pact files in one 120-day assessment. If American remote-viewing claims are circulating, the urgency adjustment refunds £GFX_pol_power 5§! but adds one Directorate Scrutiny."
 SOV_psych_integrated_research: "Integrated Methodological Assessment"
 SOV_psych_integrated_research_desc: "The central slot is occupied while statisticians, physicists, and intelligence officers compare the archive."
 SOV_psych_integrated_review: "Review the Integrated Assessment"
 SOV_psych_integrated_review_desc: "The central report is undergoing a final 30-day disposition review."
 SOV_psych_archive_integrated_assessment: "Archive the Integrated Assessment"
 SOV_psych_archive_integrated_assessment_desc: "Complete the deterministic Historical disposition before the 30-day review timer expires."
 SOV_psych_request_romanian_raw_data: "Negotiate for the Romanian File"
 SOV_psych_request_romanian_raw_data_desc: "Ask Bucharest once to reconsider compartmentalization. Romania retains the final choice."
 WP_psych_answer_the_presidium: "Answer the Presidium"
 WP_psych_answer_the_presidium_desc: "Spend political capital defending the archive's conventional value and return the Directorate to active work."
 WP_psych_compartmentalize_the_directorate: "Compartmentalize the Directorate"
 WP_psych_compartmentalize_the_directorate_desc: "Reduce immediate scrutiny by narrowing circulation, at the cost of Pact coordination."
 WP_psych_close_and_archive_directorate: "Close and Archive"
 WP_psych_close_and_archive_directorate_desc: "Permanently end new work while preserving every completed file and disposition."

 POL_psych_audit_research: "Audit Psychotronics Statistics"
 POL_psych_audit_research_desc: "Polish cyberneticists and statisticians are rechecking radiesthesia and psychotronics trials under bounded controls."
 POL_psych_audit_review: "Review the Polish Audit"
 POL_psych_audit_review_desc: "Choose whether to publish the rigorous statistical disposition or a sponsor-friendly summary."
 POL_psych_archive_rigorous_audit: "Archive the Rigorous Audit"
 POL_psych_archive_rigorous_audit_desc: "Record the negative controlled result, strengthen the common archive, and preserve the useful statistical work."
 POL_psych_archive_sponsor_audit: "File the Sponsor-Friendly Summary"
 POL_psych_archive_sponsor_audit_desc: "Retain ambiguous cases for the sponsor without converting them into Historical evidence or a technology reward."
 POL_psych_statistics_bonus: "Rigorous Psychotronics Statistics"

 HUN_psych_commission_instrumentation_review: "Commission the Instrumentation Review"
 HUN_psych_commission_instrumentation_review_desc: "Run a 90-day review of sensors, photographs, physiological measurements, and experimental artifacts."
 HUN_psych_instrumentation_research: "Hungarian Instrumentation Review"
 HUN_psych_instrumentation_research_desc: "The review is attempting to separate ordinary measurement effects from extraordinary claims."
 HUN_psych_instrumentation_review: "Review the Hungarian Report"
 HUN_psych_instrumentation_review_desc: "The report is being prepared for archival or national withholding."
 HUN_psych_archive_instrumentation: "Archive and Share the Instrumentation Report"
 HUN_psych_archive_instrumentation_desc: "Record the conventional artifact findings, share the report, and preserve its electronics lessons."
 HUN_psych_withhold_instrumentation: "Withhold the Hungarian Report"
 HUN_psych_withhold_instrumentation_desc: "Keep the result national. This grants no research bonus and damages Directorate coordination."
 HUN_psych_instrumentation_bonus: "Controlled Instrumentation Methods"

 ROM_psych_commission_biophysics_study: "Commission the Biophysical-Response Study"
 ROM_psych_commission_biophysics_study_desc: "Run a bounded 90-day study under Romanian control."
 ROM_psych_biophysics_research: "Romanian Biophysical-Response Study"
 ROM_psych_biophysics_research_desc: "Researchers are collecting instrumented physiological-response data."
 ROM_psych_biophysics_review: "Review the Romanian Biophysical File"
 ROM_psych_biophysics_review_desc: "Bucharest must decide whether raw data enters the Pact archive or remains compartmentalized."
 ROM_psych_share_raw_data_decision: "Share the Raw Data"
 ROM_psych_share_raw_data_decision_desc: "Release the controlled data to the Directorate and retain the conventional electronics lessons."
 ROM_psych_compartmentalize_decision: "Compartmentalize the File Nationally"
 ROM_psych_compartmentalize_decision_desc: "Refund £GFX_pol_power 10§!, withhold the file, and reduce Directorate Coordination."
 ROM_psych_biophysics_bonus: "Biophysical Instrumentation Methods"

 DDR_psych_security_review: "MfS Verification Review"
 DDR_psych_security_review_desc: "For 60 days, the MfS checks fraud indicators, compromised researchers, Western collection interest, and operational utility."
 DDR_psych_security_procedures: "Psychophysiological Vetting Procedures"
 DDR_psych_security_procedures_desc: "Improved personnel vetting and counterintelligence procedure derived from a skeptical security review. It is not a psychic method."
 BUL_psych_intensive_training: "Intensive Specialist Training"
 BUL_psych_intensive_training_desc: "A temporary conventional application of structured suggestive pedagogy to language and specialist training; paranormal extrapolations were rejected."

 SOV_project_x_establish_decision: "Establish Project X"
 SOV_project_x_establish_decision_desc: "CLASSIFIED FICTIONAL CONTENT: transfer copies of eligible archives into a bounded anomaly-screening program without rewriting their Historical findings."
 SOV_project_x_screen_subjects: "Screen Exceptional Subjects"
 SOV_project_x_screen_subjects_desc: "Run a deterministic 90-day screen. Missing or withheld member files contribute nothing."
 SOV_project_x_screening: "Project X Subject Screening"
 SOV_project_x_screening_desc: "Exceptional-subject files are being tested against the available archive."
 SOV_project_x_commission_resonance: "Commission the Resonance Chamber"
 SOV_project_x_commission_resonance_desc: "Build and test a bounded chamber prototype. Documentation quality determines whether the result is clean, under-documented, or failed."
 SOV_project_x_resonance: "Resonance Chamber Trials"
 SOV_project_x_resonance_desc: "The central slot is occupied by a 120-day classified chamber trial."
 SOV_project_x_construct_prototype: "Construct the Noosphere Prototype"
 SOV_project_x_construct_prototype_desc: "Commit £GFX_pol_power 50§! and £GFX_command_power 25§! to a 180-day prototype. This prequel creates no Zone, mutants, artifacts, or map damage."
 SOV_project_x_prototype: "Noosphere Prototype Construction"
 SOV_project_x_prototype_desc: "The bounded prototype is under construction. Its outcome depends on Research Record, Coordination, and Scrutiny."

 SOV_project_x_contained_program: "Contained Project X Archive"
 SOV_project_x_contained_program_desc: "A two-year classified intelligence and decryption program built around a contained anomalous prototype."
 SOV_project_x_operational_program: "Operational Project X Prototype"
 SOV_project_x_operational_program_desc: "A two-year high-risk intelligence and decryption program. It creates no Zone and confers no supernatural combat ability."

 cwic_wp_directorate.1.t: "Invitation to the Appraisal Directorate"
 cwic_wp_directorate.1.d: "Moscow has proposed a shared Warsaw Pact directorate for comparing psychotronics claims, controlled studies, and security files. Participation permits new joint work and future circulation; declining leaves our national file intact."
 cwic_wp_directorate.1.a: "Participate and retain archive access."
 cwic_wp_directorate.1.b: "Keep the national file outside the Directorate."
 cwic_wp_directorate.5.t: "A Rigorous Polish Audit"
 cwic_wp_directorate.5.d: "The controlled audit finds no operational psychotronic effect. Its useful output is statistical discipline and a better computing workflow, not paranormal proof."
 cwic_wp_directorate.5.a: "Archive the negative result."
 cwic_wp_directorate.6.t: "A Sponsor-Friendly Summary"
 cwic_wp_directorate.6.d: "Ambiguous cases remain in the sponsor's summary, but they do not count as verified evidence and yield no technology reward."
 cwic_wp_directorate.6.a: "Mark the limitations in the archive."
 cwic_wp_directorate.7.t: "The Romanian File"
 cwic_wp_directorate.7.d: "The biophysical-response study is complete. Its conventional instrumentation work is sound enough to preserve, but Bucharest must choose whether the raw data enters the shared archive."
 cwic_wp_directorate.7.a: "Share the raw data."
 cwic_wp_directorate.7.b: "Compartmentalize it nationally."
 cwic_wp_directorate.8.t: "Moscow Requests the Raw Data"
 cwic_wp_directorate.8.d: "The Soviets have paid the political cost of reopening the question. They cannot seize the file; the final disposition remains ours."
 cwic_wp_directorate.8.a: "Release it under Romanian terms."
 cwic_wp_directorate.8.b: "The compartment stands."
 cwic_wp_directorate.9.t: "The MfS Security Disposition"
 cwic_wp_directorate.9.d: "The review finds no operational psychic method. A narrow report can preserve the useful vetting procedures, or an aggressive surveillance annex can retain more names at the cost of political scrutiny. Neither path grants stability or repression benefits."
 cwic_wp_directorate.9.a: "Archive the skeptical security report."
 cwic_wp_directorate.9.b: "Add the aggressive surveillance annex."
 cwic_wp_directorate.10.t: "Methodological Archive"
 cwic_wp_directorate.10.d: "The integrated report explicitly rejects a reliable psychotronic method. Its value lies in common experimental controls, statistical comparison, and information processing."
 cwic_wp_directorate.10.a: "Preserve the methods, reject the claim."
 cwic_wp_directorate.11.t: "Fragmented but Usable Archive"
 cwic_wp_directorate.11.d: "The files are too uneven for a strong common conclusion. The archive remains inconclusive but useful enough to justify a limited budget reimbursement."
 cwic_wp_directorate.11.a: "Record the limits."
 cwic_wp_directorate.12.t: "Claims Without a Program"
 cwic_wp_directorate.12.d: "Political pressure and weak records have left a collection of claims rather than a defensible research program. No mechanical reward follows, and the Directorate enters formal review."
 cwic_wp_directorate.12.a: "Send the Directorate to review."
 cwic_wp_directorate.20.t: "Directorate Funding Crisis"
 cwic_wp_directorate.20.d: "Scrutiny has crossed the crisis threshold. No new work may begin until the state discloses the archive's limits, compartmentalizes circulation, or closes the program."
 cwic_wp_directorate.20.a: "Disclose the methodological record."
 cwic_wp_directorate.20.b: "Compartmentalize the Directorate."
 cwic_wp_directorate.20.c: "Close and archive the program."
 cwic_wp_directorate.22.t: "The Final Directorate Archive"
 cwic_wp_directorate.22.d: "By 1991 the Directorate's record is fixed. Research Record: [?global.WP_psych_record|0]. Scrutiny: [?global.WP_psych_scrutiny|0]. Coordination: [?global.WP_psych_coordination|0]. Completed files and any Project X disposition remain readable, but no new commission will open."
 cwic_wp_directorate.22.a: "Seal the index."
 cwic_wp_directorate.23.t: "The Directorate Archive Closes"
 cwic_wp_directorate.23.d: "The shared Directorate can sponsor no further work. Files already received remain readable, completed findings remain credited, and unfinished joint studies are cancelled rather than misreported as archived."
 cwic_wp_directorate.23.a: "Retain our copy of the archive."
 cwic_wp_directorate.30.t: "The Noosphere Prototype"
 cwic_wp_directorate.30.d: "The prototype trial has ended. Whatever the classified instruments registered, the Historical archive still says what its controlled studies said. We may contain the device, operationalize it at political cost, or terminate the fictional branch and seal its file."
 cwic_wp_directorate.30.a: "Contain and classify."
 cwic_wp_directorate.30.b: "Operationalize the prototype."
 cwic_wp_directorate.30.c: "Terminate and seal the file."
 cwic_wp_directorate.31.t: "A Bounded Containment Incident"
 cwic_wp_directorate.31.d: "A security alarm, conflicting instrument readings, and a compromised reporting channel force an expensive internal response. The incident has political and intelligence consequences, but it creates no Zone and damages no map state."
 cwic_wp_directorate.31.a: "Pay for silence, repairs, and a new custody chain."

