#Events
 smk.3.t: "INDEPENDENCE PROCLAMATION OF SOUTH MOLUCCAS"
 smk.3.d: "In order to fulfill the true will, demands, and desires of the people of South Moluccas, we hereby proclaim the INDEPENDENCE OF SOUTH MOLUCCAS, de facto and de jure, in the form of a Republic, separate from all relations of dependence on the State of East Indonesia and the Republic of the United States of Indonesia (R.I.S.). On the grounds that N.I.T. is no longer able to maintain its position as a constituent state in accordance with the still-valid regulations of the Denpasar Charter, and also in accordance with the decision of the South Moluccas Council dated March 11, 1947, while R.I.S. has already acted in contradiction to the decisions of the K.M.B. (Round Table Conference) and its own Constitution.\n\nAmbon, April 25, 1950\n\nGovernment of South Moluccas"
 smk.3.a: "J.H. Manuhutu"
 smk.4.t: "Another Day, Another Problem"
 smk.4.d: "We have received a detailed report from the recently established government of South Maluku, which has sought our support in its ongoing conflict with Indonesia. This situation is critical, as the South Maluku administration is striving to assert its independence and maintain sovereignty in the face of military and political pressure from Indonesia. They believe our assistance could be pivotal in their struggle.\n\nIt is essential to recognize that the choice we make regarding this request will have significant implications for our diplomatic relationships. Supporting South Maluku could strengthen our ties with them and position us as a key ally. Conversely, it might strain our relationship with Indonesia."
 smk.4.a: "Let's Greenlit this..."
 smk.4.b: "We shouldn't compromise our relationship with Indonesia!"
