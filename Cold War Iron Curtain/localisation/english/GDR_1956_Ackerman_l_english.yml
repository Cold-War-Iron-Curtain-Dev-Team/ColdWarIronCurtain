l_english: 

 GDR_First_Secretary_Ackerman: "First Secretary Ackermann"
 GDR_First_Secretary_Ackerman_desc: "Anton Ackermann has managed to wrestle leadership of the GDR from Walter Ulbricht; it is time to formally recognize him as our new First Secretary."
 GDR_Quelling_the_National_Unrest: "Quelling National Unrest"
 GDR_Quelling_the_National_Unrest_desc: "The German people have lost confidence in the government's leadership. We have much work to do if we are to regain their trust."
 GDR_Dismantling_the_Personality_Cult: "Dismantling the Personality Cult"
 GDR_Dismantling_the_Personality_Cult_desc: "The cult of personality that has festered over the past years is unbecoming and counterproductive to our goals. It's time to tear it down."
 GDR_Relax_Church_Repression: "Relax Church Repression"
 GDR_Relax_Church_Repression_desc: "The restrictions imposed on the Church are excessive and unnecessary. We should relax the worst of these and begin a process of limited reconciliation."
 GDR_Put_Ulbricht_on_Trial: "Put Ulbricht on Trial"
 GDR_Put_Ulbricht_on_Trial_desc: "Walter Ulbricht has been a detriment to the advancement of the German state and her people. It is time for him to face justice."
 GDR_Purge_FDJ_Leadership_Positions: "Purge FDJ Leadership Positions"
 GDR_Purge_FDJ_Leadership_Positions_desc: "The leadership of the Free German Youth has become entrenched and unwilling to accept and recommendations or changes. We will have to do it the hard way."
 GDR_Investigate_the_Judiciary: "Investigate the Judiciary"
 GDR_Investigate_the_Judiciary_desc: "How far does the corruption of the state go? We will have to launch a formal investigation to find out."
 GDR_A_New_Course_for_the_SED: "A New Course for the SED"
 GDR_A_New_Course_for_the_SED_desc: "It is time for the Socialist Unity Party to embrace new methods for the betterment of the nation. The repressive ways of the past will not lead us to glory."
 GDR_Provide_Widespread_Amnesty: "Provide Widespread Amnesty"
 GDR_Provide_Widespread_Amnesty_desc: "The amount of innocent people convicted on exaggerated or outright fabricated charges is staggering. We must overturn these convictions immediately!"
 GDR_Purge_Ulbricht_Loyalists_from_the_Politurbo: "Purge the Politurbo"
 GDR_Purge_Ulbricht_Loyalists_from_the_Politurbo_desc: "The Politburo is infested with yes men, foreign agents, and corrupt opportunists. It is time to clean house!"
 GDR_The_German_Path_to_Socialism: "The German Path to Socialism"
 GDR_The_German_Path_to_Socialism_desc: "The circumstances of the GDR require that we take our own path to achieving the goals of socialism. It will be a hard road, but ultimately worth it."
 GDR_Loosen_Speech_Restrictions: "Loosen Speech Restrictions"
 GDR_Loosen_Speech_Restrictions_desc: "We cannot claim to be a democratic worker's republic while simultaneously restricting the people's right to be heard."
 GDR_Allow_Greater_Industrial_Self_Management: "Allow Greater Industrial Self-Management"
 GDR_Allow_Greater_Industrial_Self_Management_desc: "The workers have proven their ability to oversee the industries without too much need for government oversight."
 GDR_End_the_War_on_the_EKD: "End the War on the EKD"
 GDR_End_the_War_on_the_EKD_desc: "The war against the Evangelical Church has caused more harm than good. It is time to end this charade and find common ground for the betterment of the German people."
 GDR_Instate_Collective_Leadership: "Instate Collective Leadership"
 GDR_Instate_Collective_Leadership_desc: "Collective leadership will abolish the one-party state and allow for greater political representation within the GDR."
 GDR_End_the_Cadreization_of_the_Bloc_Parties: "End the Cadreization of the Bloc Parties"
 GDR_End_the_Cadreization_of_the_Bloc_Parties_desc: "In theory, cadres are supposed to help in the achievement of Party's goals and preserve ideological purity. In reality, they only serve to ensure loyalty and obedience to those in power. We have no use for unimaginative, eager yes-men."
 GDR_Reign_in_the_Worst_of_the_Stasi_Abuse: "Reign in the Worst of the Stasi"
 GDR_Reign_in_the_Worst_of_the_Stasi_Abuse_desc: "Some members of the Stasi have gone too far in their operations to maintain order within the Republic. The worst of these offenders will be removed. "
