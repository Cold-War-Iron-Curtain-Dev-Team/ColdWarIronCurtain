l_english:
 FRE_Associated_State_Armies:0 "The Associated State Armies"
 FRE_Associated_State_Armies_desc:0 "Saigon is not the only capital the Union has promised an army. The Royal Lao Government and Cambodia guard the frontier the Viet Minh will cross next, and neither has a force worth the name. Paris can spend its credits on raising their armies instead of concentrating on the Vietnamese National Army."
 FRE_Associated_State_Armies_tt:0 "Costs §Y60§! War Credits. The Royal Lao Government and Cambodia each raise §Y2§! divisions with manpower and equipment.\nThe State of Vietnam receives no equipment transfer and its wartime division limit falls from §Y30§! to §Y25§!.\nA Viet Minh diversion in Lower Laos is contained by the Royal Lao Army, and the Royal Lao capital and Luang Prabang are better fortified against a Pathet Lao offensive.\nThe Royal Lao Government and Cambodia gain leverage on the Laos and Cambodia clause at the Geneva Conference.\nIncompatible with Arm the National Army."
 FRE_Associated_Armies_Chosen: "§YThe CEFEO built the Royal Lao and Cambodian armies instead of the Vietnamese National Army§!"
 LOS_Associated_Army_Raised: "§YThe Royal Lao Army was raised with French credits§!"
 CAM_Associated_Army_Raised: "§YThe Cambodian Army was raised with French credits§!"
 VIE_Associated_Armies_Cap_Reduced: "§YThe State of Vietnam fields a smaller wartime army§!"
 IC_AFK_Seen_Associated_Armies_VNA: "§YThe Vietnamese National Army path was observed§!"
 IC_AFK_Seen_Associated_Armies_Check: "§YThe associated armies deployment was checked§!"
 IC_AFK_Seen_Associated_Armies_Lower_Laos: "§YThe Lower Laos containment was observed§!"
