 fusion_powerplant_desc: "This highly expensive power plant produces vast amounts of renewable energy"
 civilian_air_base_desc: "Civilian Airports provide boosts to commerce and office parks. Build in states with lots of office parks."
 state_infrastructure_desc: "State Infrastructure increases resource output and state supply (Stats updated monthly).\n§G+7%§! §YResource Output§!\n§G+50%§! §YSupply Throughput§!\n§GCan Sometimes Uncover Hidden Resource Deposits§!\n§GResearch Infrastructure projects to increase max level!§!"
 water_infrastructure_desc: "Water infrastructure provides bonuses for agricultural production. At least 1 is required for full §YAgri-Industrial Complex§! £resources_strip|3 output! \nEvery level of §YWater Infrastructure§! past level 1 gives §G+25%§! §YAgri-Industrial Complex§! £resources_strip|3 output."
 agri_industrial_complex_desc: "This park provides the state with food. Increased output with fertile biomes.\nRequires at least 1 §YWater Infrastructure§! to produce full £resources_strip|3 output!\nHas the following base outputs depending on the agri-biome of the state:\n§YDesolate Mountains§! = §G0.5§!£resources_strip|3 \n§YDesert or Tundra§! = §G1§!£resources_strip|3 \n§YLush Desert or Temperate Mountains§! = §G2§!£resources_strip|3 \n§YBoreal§! = §G3§!£resources_strip|3 \n§YTemperate§! = §G4§!£resources_strip|3\n§YYear-Round§! = §G6§!£resources_strip|3\n"
 office_park_desc: "Costs §R-1§! £resources_strip|7 , §R-1§! £resources_strip|2 and §R-1§! £resources_strip|1 . Office Parks provide large amounts of income but no industrial output. Good for paying for civil services and improving income far beyond what industry alone provides."
 fuel_silo_desc: "(100,000 fuel units) A massive strategic fuel reserve for storing large quantities of usable petrochemical fuels. These facilities are usually built within' abandoned mining sites or large artificial silos."
 steel_factory_desc: "Costs -1 £resources_strip|7 and -1 £resources_strip|1 to refine impure ore into "
