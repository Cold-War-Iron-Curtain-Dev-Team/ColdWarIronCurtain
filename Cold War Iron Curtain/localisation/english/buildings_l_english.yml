 #LOGISTICS
 national_logistical_supercomputer: "NLSN Resource Demand Report"
 national_logistical_supercomputer_desc: "The national logistics supercomputer network reports the total national resource demand. The resources consumed are as follows: §R$VALUE|Y0=$§!"
 petrochemicals_logistic_center: "Petrochemicals Logistic Center"
 petrochemicals_logistic_center_desc: "§YCalculates Petrochemical consumption and production once per month.§!\nManages the country's fossil fuel logistics systems including oil pipelines and shipments."
 construction_registry_office: "Construction Registry Office."
 construction_registry_office_desc: "§YCalculates Construction Metal consumption and production once per month.§!\nThe construction registry office organizes national zoning and construction regulation. Also manages industrial workplace laws and construction inspections."
 construction_permits_office: "Construction Permits Office"
 construction_permits_office_desc: "§YCalculates Light Metal consumption and production once per month.§!\nThe construction permits office is similar to the registry office except that it approves building permits and deals with commercial assets."
 energy_department_supercomputer: "Energy Department Supercomputer"
 energy_department_supercomputer_desc: "§YCalculates Electricity consumption and production once per month.§!\nThe energy department supercomputer runs the national power grid and ensures that power plants are well maintained."
 nuclear_materiel_supplier: "Nuclear Materiel Supplier"
 nuclear_materiel_supplier_desc: "§YCalculates Nuclear Materiel consumption and production once per month.§!\n The nuclear materiel supplier is a military-run organization that protects and distributes nuclear materiel to all civilian and military facilities that require it."
 rare_material_broker: "Rare Earth Broker"
 rare_material_broker_desc: "§YCalculates Rare Earth consumption and production once per month.§!\nThe Rare Earth Broker is a network of logistical companies, banks, and mining interests that manage the supply of rare materials in the country."
 farm_pulse: "Agri-Industrial Logistics Network"
 farm_pulse_desc: "§YCalculates Food Production once per month.§!\nThe Agri-Industrial Logistics network manages all food producing and processing elements and supplies them. The AIL also manages the nation's water treatment systems."
 Food_Need_Pulse: "Agro-Dealer Network"
 Food_Need_Pulse_desc: "§YCalculates Food Consumption once per month.§!\nThe Agro-Dealer Network is a decentralized system of agricultural interests that manage the sale and distribution of food across the country."
 
