l_english:
 #IDK
 BUILDING_GROUP_TOOLTIP: "\nYou can have up to $LEVEL|R$ of these buildings per state. This cap is shared with:"
 BUILDING_GROUP_SHARED_NAME_ENTRY: " - $NAME$"
 #End of IDK
 infrastructure: "Municipal Infrastructure"
 infrastructure_plural: "Municipal Infrastructure"
 infrastructure_desc: "This infrastructure aids cities and urban industry.\n§G +7% §!§YIndustrial Park Output§! in state\n§G +7% §!§YConstruction Speed§! in state\n§GResearch Inframunicipal technology projects to increase max level!§!"
 arms_factory: "Military-Industrial Manufactory"
 arms_factory_plural: "Military-Industrial Manufactories"
 arms_factory_desc: "This park provides the state with industry for production of new military equipment. Can be converted to civilian industry if needed."
 dockyard: "Naval Drydock"
 dockyard_plural: "Naval Drydocks"
 dockyard_desc: "Costs §R-2§! £resources_strip|7 .This park provides the state with industry for building new ships."
 industrial_complex: "Industrial Park"
 industrial_complex_plural: "Industrial Parks"
 industrial_complex_desc: "Costs §R-1§! £resources_strip|7 , §R-1§! £resources_strip|5 and §R-1§! £resources_strip|1 .This park provides the state with industry for production of civilian goods or construction of new buildings. Can be converted to military industry if needed."
 air_base: "Air Base"
 air_base_plural: "Air Bases"
 air_base_desc: "This building provides the state with deployment for your air forces."
 naval_base: "Naval Base"
 naval_base_plural: "Naval Bases"
 naval_base_desc:1 "Extends the range of your fleet and provides repair services for it. Allows overseas supply and export of resources. Higher levels increases the supply throughput."
 bunker: "Land Fort"
 bunker_plural: "Land Forts"
 bunker_desc: "This building inflicts an attack penalty of $VALUE|+%0$ for each fort level on the attacker in combat. Attacking from multiple directions will reduce forts effect."
 coastal_bunker: "Coastal Fort"
 coastal_bunker_plural: "Coastal Forts"
 coastal_bunker_desc: "This building inflicts an attack penalty of $VALUE|+%0$ for each fort level on the attacker in naval invasion combat."
 anti_air_building: "Anti-Air"
 anti_air_building_plural: "Anti-Air"
 anti_air_building_desc: "This building provides the state with protection from enemy bombers and ability to fire at attacking aircraft.\n§YLevel 2§! Local ABM Coverage: §G+5%§!\n§YLevel 3§! Local ABM Coverage: §G+10%§!\n§YLevel 4§! Local ABM Coverage: §G+15%§!\n§YLevel 5§! Local ABM Coverage: §G+20%§!"
 synthetic_refinery: "Petrochemical Refinery"
 synthetic_refinery_plural: "Petrochemical Refineries"
 nuclear_reactor_heavy_water: "Heavy Water Nuclear Reactor"
 nuclear_reactor_heavy_water_plural: "Heavy Water Nuclear Reactors"
 nuclear_reactor_heavy_water_desc: "This building provides the state with production of enriched Uranium for use in Nuclear weapons.\nNuclear reactors using Heavy Water are somewhat cheaper to build than Graphite Reactors, but produce less material that can be used to produce nuclear weapons."
 commercial_nuclear_reactor: "Civilian Nuclear Reactor"
 commercial_nuclear_reactor_plural: "Civilian Nuclear Reactors"
 commercial_nuclear_reactor_desc: "This building provides the state with enriched uranium for nuclear weapons and produces electricity for the civilian economy."
 nuclear_bunker: "Civil Defense Shelters"
 nuclear_bunker_plural: "Civil Defense Shelters"
 nuclear_bunker_desc: "Civil Defense Shelters protect the local population from nuclear fallout and disasters"
 #synthetic_refinery_desc: "This building provides the state with +1 £resources_strip|3 and +2 £resources_strip|1."
 synthetic_refinery_desc: "This building provides the state with 25,000 fuel storage,"
 synthetic_refinery_amount: "$VALUE|Y0=$"
 synthetic_refinery_resource: "£resources_strip|$FRAME$"
 radar_station: "Radar Array"
 radar_station_plural: "Radar Arrays"
 radar_station_desc:3 "Radar allows you to gain intel on enemy troops in nearby states.\nA higher radar level in a state increases the effective range of the radar.\nRadar also provides the state with better detection of enemy air forces, giving your planes a better chance to engage them.\nIn addition radar increases the detection of enemy fleets at sea."
 rocket_site: "ICBM Silo"
 rocket_site_plural: "ICBM Silos"
 rocket_site_desc: "This building provides the state with deployment for produced ICBMs."
 nuclear_reactor: "Nuclear Weapons Manufacturing Plant"
 nuclear_reactor_plural: "Nuclear Weapons Plants"
 nuclear_reactor_desc: "Costs -2 £resources_strip|6 and -2 £resources_strip|7 to produce nuclear weapons. \n §G +2 Nuclear Weapons Production §! \n §R WARNING: HIGHLY DANGEROUS §!"
 nuclear_facility: "Nuclear Research Facility"
 nuclear_facility_plural: "Nuclear Research Facilities"
 nuclear_facility_desc: "Experimental Facilities for Nuclear Research allow you to start research projects relating to the use nuclear power."
 air_facility: "Aerodynamics and Avionics Facility"
 air_facility_plural: "Aerodynamics and Avionics Facilities"
 air_facility_desc: "Experimental Facilities for Aerodynamics and Avionics allow you to start research projects for aircraft, rockets and related electronics."
 naval_facility: "Naval Engineering Facility"
 naval_facility_plural: "Naval Engineering Facilities"
 naval_facility_desc: "Experimental Facilities for Naval Engineering allow you to start research projects related to Surface Ships and Submarines.\nA Naval Engineering can only be created in a coastal province."
 mega_gun_emplacement: "Multi-Charge Large Caliber Gun"
 mega_gun_emplacement_plural: "Multi-Charge Caliber Guns"
 mega_gun_emplacement_desc: "Operating on the principle of multi-charge propulsion, this large caliber gun is designed to achieve unparalleled ranges in bombardment. Utilizing a series of underground tunnels, it accelerates shells to supersonic speeds before launching them towards distant targets."
 stronghold_network: "Stronghold Network"
 stronghold_network_plural: "Stronghold Networks"
 stronghold_network_desc: "An extensive defensive system of massive bunkers and strongly fortified positions, designed to repel enemy advances and secure key strategic areas."
 land_facility: "Land Warfare Facility"
 land_facility_plural: "Land Warfare Facilities"
 land_facility_desc: "Experimental Facilities for Land Warfare  allow you to start research projects related to various aspects of land warfare, such as special tanks, or artillery."
 landmark_eiffel_tower: "The Eiffel Tower"
 landmark_eiffel_tower_plural: "$landmark_eiffel_tower$"
 landmark_eiffel_tower_desc: "The Eiffel Tower is named after its creator Gustave Eiffel, and was finished in 1889. Being located on the Champ de Mars in Paris, the Iron Lady has become a global cultural icon of France, and is a symbol of national pride."
 landmark_kremlin: "The Kremlin"
 landmark_kremlin_plural: "$landmark_kremlin$"
 landmark_kremlin_desc: "The Moscow Kremlin is a fortified complex. Within the complex is the Grand Kremlin Palace, which served as the royal residence of the Emperor of Russia. The Kremlin overlooks the Moskva River to the south, Saint Basil's Cathedral and Red Square to the east, and Alexander Garden to the west. A former home of regal grandeurs, nowadays it houses the heart of the Soviet government and it stands as a symbol of international socialism."
 landmark_berlin_reichstag: "The Reichstag"
 landmark_berlin_reichstag_plural: "$landmark_berlin_reichstag$"
 landmark_berlin_reichstag_desc: "oh shit oh fuck it's on fire again"
