l_english:

 # ------------------------------------------------------------------
 # Second Congress of the Indochinese Communist Party
 # ------------------------------------------------------------------

 SWF_VIN.50.t:0 "The Second Congress of the Indochinese Communist Party"
 SWF_VIN.50.d:0 "The Second National Congress of the Indochinese Communist Party has convened in the liberated zone of Vinh Quang Commune, Chiêm Hóa District, Tuyên Quang Province. It is the first Party Congress held since the August Revolution and the beginning of the nationwide resistance against French colonialism.\n\nSixteen years after the Party's first congress, the movement has been transformed beyond recognition. The Vietnamese people have passed from colonial subjects to citizens of their own republic, while revolutionary organizations in Laos and Cambodia continue to grow through their cooperation with the Việt Minh. One hundred and fifty-eight official delegates and fifty-three alternate delegates have gathered to represent more than seven hundred thousand Party members across Indochina. Fraternal delegations from the Communist Party of China and the Communist Party of Siam underline the Congress's growing international significance.\n\nThe delegates meet at a difficult moment. General Jean de Lattre de Tassigny has launched a new French strategy of fortified lines, mobile operations, and expanded foreign assistance. Yet the Congress has not assembled merely to recount hardship. It must decide the political character, international orientation, and future organization of the revolution that will outlast the war."
 SWF_VIN.50.a:0 "Let the Congress begin."

 SWF_VIN.51.t:0 "Vietnam's Place in the World Revolution"
 SWF_VIN.51.d:0 "Among the questions before the Congress, none has produced more serious debate than the foreign policy of the Democratic Republic of Vietnam. The creation of the People's Republic of China has broken the colonial encirclement around the revolution, while the socialist camp has expanded across Eurasia. At the same time, the Cold War is hardening, and American money, arms, and advisers are increasingly sustaining France's war in Indochina.\n\nPresident Hồ Chí Minh's mission to Moscow secured Soviet recognition, but material assistance remains limited. Soviet leaders are preoccupied with Europe and Korea, and many expect the new Chinese government to bear the principal responsibility for revolutionary affairs in East Asia. Some delegates therefore argue for unambiguous integration with the socialist camp. Others recall that American officers of the OSS Deer Team once cooperated with the Việt Minh and that several Western observers understood Hồ Chí Minh first as a Vietnamese patriot. A third current argues that Vietnam must support the world revolution without becoming dependent upon any foreign capital.\n\nThe Congress must define the Republic's posture before the great powers define it for us."
 SWF_VIN.51.a:0 "The world revolution advances through many roads."
 SWF_VIN.51.b:0 "Keep the door open to American moderation."
 SWF_VIN.51.c:0 "Vietnam belongs firmly in the socialist camp."

 SWF_VIN.52.t:0 "The Fate of the Indochinese Union Project"
 SWF_VIN.52.d:0 "For more than two decades, the Indochinese Communist Party has served as the common revolutionary vanguard of Vietnam, Laos, and Cambodia. Under its banner, patriots from all three nations fought colonial domination with the conviction that the liberation of one people could not be separated from the liberation of the others.\n\nWar and revolution, however, have changed the political landscape. Lao and Khmer cadres increasingly insist that national movements rooted in their own languages, histories, and social conditions must lead the struggle in their countries. Many Vietnamese delegates agree that the single Indochinese party has fulfilled its historic role and should give way to independent national organizations joined by friendship and common purpose.\n\nOthers warn that colonial policy deliberately fragmented Indochina in order to rule it. To dissolve the common revolutionary structure, they argue, would invite imperial powers to restore the divisions of the past. Their alternative is a future socialist federation: three peoples, but one political and economic destiny. The Congress must decide whether unity will be preserved through independent national movements or through a single Indochinese revolutionary project."
 SWF_VIN.52.a:0 "Three Nations, One Friendship."
 SWF_VIN.52.b:0 "One Revolution, One Indochina."

 SWF_VIN.53.t:0 "The Nature of Vietnamese Marxism"
 SWF_VIN.53.d:0 "The final and most consequential debate of the Congress concerns the character of Vietnamese Marxism itself. One current, associated with Tran Ngoc Danh and orthodox Marxist-Leninists, argues that Vietnam must follow the Soviet road with discipline: class struggle, centralized authority, and rapid preparation for a socialist transformation. In their view, departure from the established international line risks diluting the revolution until it becomes merely another nationalist movement.\n\nOpposing them are those who argue that Marxism must be translated into Vietnamese conditions rather than mechanically imported. President Hồ Chí Minh and General Secretary Trưong Chinh emphasize that the immediate contradiction remains colonial occupation. The revolution must therefore organize workers and peasants as its foundation while drawing intellectuals, small proprietors, religious patriots, and even sections of the national bourgeoisie into a Great National Unity Front.\n\nA third position seeks to reconcile national liberation with international revolution: Vietnam will remain Marxist and socialist, but its path will be guided by the specific demands of independence, reunification, gradual land reform, and the construction of a people's democratic state. The Congress must now choose its ideological settlement."
 SWF_VIN.53.a:0 "Vietnam must forge its own revolutionary path."
 SWF_VIN.53.b:0 "The Soviet road is the only correct road."
 SWF_VIN.53.c:0 "National liberation and international revolution are inseparable."

 SWF_VIN.54.t:0 "A Name for the Party"
 SWF_VIN.54.d:0 "After two decades leading the revolutionary struggle beneath the banner of the Indochinese Communist Party, the Congress has agreed that the movement must now take a name suited to the realities of the Vietnamese national revolution. The decision is more than a matter of presentation. It will announce to the country—and to the world—what sort of organization claims the right to lead the struggle for independence.\n\nThe orthodox Marxist-Leninists urge the delegates to proclaim a Communist Party of Vietnam. In their view, a revolutionary vanguard should declare its ideological allegiance openly and bind Vietnam unmistakably to the international communist movement. Moderates instead propose a Vietnamese Socialist Party: a name they believe better expresses the immediate task of building a patriotic, democratic, and socially just nation while widening the Party's appeal among intellectuals, religious communities, and the national bourgeoisie.\n\nPresident Hồ Chí Minh advances a third proposal. The Vietnam Labor Party would affirm the working people as the Party's foundation while avoiding needless barriers within the Great National Unity Front. It would speak not only to cadres and theoreticians, but to every worker, peasant, soldier, and patriot upon whom the survival of the Republic depends."
 SWF_VIN.54.a:0 "The Vietnam Labor Party shall lead the nation."
 SWF_VIN.54.b:0 "Let the Party bear the communist banner."
 SWF_VIN.54.c:0 "A Socialist Party for a socialist nation."

 SWF_VIN.55.t:0 "Strengthen the Party, Serve the People"
 SWF_VIN.55.d:0 "With its major debates concluded, the Second Congress turns from declaration to organization. The delegates agree that the revolution cannot be sustained by battlefield victories alone. The Party must build disciplined organizations from the central leadership to every province, district, village, factory, military unit, and school. Workers, peasants, women, youth, intellectuals, veterans, and religious patriots are to be drawn into mass organizations capable of transforming popular sympathy into practical resistance and national reconstruction.\n\nThe Congress places special emphasis on cadre education, criticism and self-criticism, and the struggle against bureaucracy and corruption. Political instruction must be joined to practical competence; leadership must be earned through service; and every organization must remain connected to the people it claims to represent. As President Hồ Chí Minh reminds the delegates, cadres are the root of all work.\n\nThe Congress therefore closes with a commitment to build a united, capable, and revolutionary Party equal to the burdens of independence, reunification, and socialist construction. The choices made here will shape Vietnam's political future long after the guns of the present war fall silent."
 SWF_VIN.55.a:0 "Strengthen the Party, serve the people!"
