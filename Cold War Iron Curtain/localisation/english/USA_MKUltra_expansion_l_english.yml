 # Event 395 (Card 17: Project GRILL FLAME Foreign Psychotronics)
 cwic_mkultra.395.t: "Project GRILL FLAME: Foreign Psychotronics Appraisal"
 cwic_mkultra.395.d: "Under Project GRILL FLAME, the Defense Intelligence Agency's Scientific and Technical Intelligence Directorate and Army INSCOM have completed a forty-five-day appraisal of Soviet and Warsaw Pact 'psychotronic' and bio-communications research. Analysts cross-checked emigré accounts and translated academy papers against known physiological baselines.\n\nThe technical reviewers conclude that while several Soviet laboratories receive state stipends to study bio-telemetry and parapsychology, their published claims suffer from the same sensory leakage and statistical selection observed in Western contractor trials. However, program advocates argue that citing a 'Psychotronic Gap' is essential to sustain Fort Meade tasking."
 cwic_mkultra.395.a: "File the skeptical DIA Scientific & Technical Intelligence Estimate."
 cwic_mkultra.395.b: "Cite a potential 'Psychotronic Gap' to expand Fort Meade tasking."
