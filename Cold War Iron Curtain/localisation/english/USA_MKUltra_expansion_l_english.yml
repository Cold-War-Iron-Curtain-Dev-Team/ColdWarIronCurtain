 # Events 360, 365, 366 (MKNAOMI) and 370 (MKOFTEN)
 cwic_mkultra.360.t: "Fort Detrick Special Operations Division Audit"
 cwic_mkultra.360.d: "Under Project MKNAOMI, the Technical Services Staff has maintained a standing liaison with the U.S. Army Chemical Corps Special Operations Division at Fort Detrick, Maryland. The arrangement provides the Agency with laboratory assays, incapacitating and lethal toxin preparations, and specialized delivery mechanisms not listed on ordinary quartermaster schedules.\n\nThe sixty-day review of the Fort Detrick ledger is now complete. While the laboratory assay data is methodologically sound, auditors note that field-delivery requisitions are tracked only by unindexed vouchers, creating an institutional liability if outside oversight ever examines chemical and biological custody chains."
 cwic_mkultra.360.a: "Confine the agreement to defensive toxin assays and dual-signature custody logs."
 cwic_mkultra.360.b: "Authorize compartmentalized TSS delivery-system stockpiling under voucher."
 cwic_mkultra.360.c: "Keep the report on the review desk to commission bio-assay replication."
 USA_mkultra_mknaomi_assay_tt: "Archives §YProject MKNAOMI§! as a defensive assay protocol (§G+4 Research Record§!, §G-2 Exposure§!) and frees its study slot."
 USA_mkultra_mknaomi_stockpile_tt: "Retains compartmentalized Fort Detrick delivery stockpiles (§G+8 Research Record§!, §R+6 Harm§!, §R+8 Exposure§!) and frees its study slot."
 USA_mkultra_mknaomi_reference_tt: "Spends §Y15 Political Power§! to restrict the liaison to reference cataloging (§G+2 Research Record§!, §G-2 Exposure§!)."
 USA_mkultra_mknaomi_keep_open_for_replication_tt: "Keeps the §YProject MKNAOMI§! report open in the Decisions panel so you can commission §YReplicate MKNAOMI Bio-Assay Protocols§!."

 cwic_mkultra.365.t: "The 1970 Biological and Toxin Renunciation Directive"
 cwic_mkultra.365.d: "Following the Executive Order renouncing the use and stockpiling of biological agents and toxins, the Department of Defense has ordered the liquidation of all Special Operations Division holdings at Fort Detrick. Because Project MKNAOMI relied on Fort Detrick vaults to maintain purified shellfish toxin (saxitoxin) and related biological reference lots, the directive leaves Technical Services Staff officers with an immediate custody decision.\n\nCompliance requires entering the holdings into the joint destruction schedule. However, laboratory staff have noted that eleven grams of purified saxitoxin and associated venom samples represent years of extraction work that cannot be replicated once the Fort Detrick facility converts to defensive research."
 cwic_mkultra.365.a: "Certify complete destruction of all Fort Detrick SOD biological and toxin lots."
 cwic_mkultra.365.b: "Transfer the purified saxitoxin cache to a Washington TSS vault without logging destruction."
 USA_mkultra_mknaomi_1970_destroy_tt: "Decommissions §YProject MKNAOMI§! in compliance with the directive (§G-5 Exposure§!) and certifies toxin destruction."
 USA_mkultra_mknaomi_1970_retain_tt: "Decommissions the Fort Detrick liaison on paper while retaining the unlogged saxitoxin cache in a TSS vault (§R+6 Exposure§!, §R+3 Harm§!). §RIf a formal congressional inquiry later audits Technical Services holdings, the retained cache will increase inquiry severity.§!"

 cwic_mkultra.366.t: "The Retained Saxitoxin Cache"
 cwic_mkultra.366.d: "During the Senate Select Committee's examination of Technical Services records, investigators uncovered the inventory discrepancy left behind in February 1970: eleven grams of purified shellfish toxin and cobra venom retained in a Washington laboratory vault in direct contravention of the presidential destruction directive.\n\nBecause the cache survived intact outside the Fort Detrick decommissioning ledger, the committee's public hearings have centered on physical delivery hardware and the failure of internal command directives to bind compartmentalized technical custodians."
 cwic_mkultra.366.a: "Acknowledge the custody failure and surrender the vault inventory to the committee."
 cwic_mkultra.366.b: "Cite compartmentalized TSS custody rules and contest the committee's framing."
 USA_mkultra_mknaomi_church_cache_surrender_tt: "Spends §Y20 Political Power§! to surrender the vials and contain the hearing fallout (§G-4 Exposure§!)."
 USA_mkultra_mknaomi_church_cache_tt: "Contests the hearing record without spending Political Power (§R+5 Exposure§!, §R-1.0% Stability§!)."

 cwic_mkultra.370.t: "ORD Edgewood Pharmacology & Anomaly Canvass"
 cwic_mkultra.370.d: "Initiated under the Office of Research and Development in 1971, Project MKOFTEN combined two disparate lines of inquiry: high-potency toxicological and behavioral compound screening at Edgewood Arsenal, and a brief exploratory canvass of external consultants, astrologers, and occult practitioners to see whether any unconventional behavioral claims merited laboratory attention.\n\nThe forty-five-day review confirms the contrast between the two tracks. The Edgewood toxicology tables provide narrow, reproducible dose-response data, whereas the external anomaly canvass produced only anecdotal memoranda that could not be verified under controlled conditions."
 cwic_mkultra.370.a: "Confine the MKOFTEN archive to clinical toxicology indexing and close the canvass."
 cwic_mkultra.370.b: "Catalogue the exploratory consultant claims alongside the Edgewood compound logs."
 cwic_mkultra.370.c: "Keep the report on the review desk to validate computer-indexed toxicology."
 USA_mkultra_mkoften_toxicology_tt: "Archives §YProject MKOFTEN§! as a clinical toxicology index (§G+4 Research Record§!, §G-2 Exposure§!) and frees its study slot."
 USA_mkultra_mkoften_canvass_tt: "Files the full anomaly and compound canvass in the ORD archive (§G+4 Research Record§!, §R+8 Harm§!, §R+9 Exposure§!) and frees its study slot."
 USA_mkultra_mkoften_keep_open_for_replication_tt: "Keeps the §YProject MKOFTEN§! report open in the Decisions panel so you can commission §YReplicate MKOFTEN Computer-Indexed Toxicology§!."

 # Events 380 & 385 (Card 14: Subproject 68)
 cwic_mkultra.380.t: "Subproject 68: The Montreal Depatterning Report"
 cwic_mkultra.380.d: "Channeled through the Society for the Investigation of Human Ecology, Subproject 68 provided external grant support to a Montreal psychiatric institute investigating intensive behavioral modification. The clinical regimen combined repeated electroshock 'depatterning,' prolonged pharmacological sleep, and continuous looped audio messages termed 'psychic driving.'\n\nMedical Staff reviewers examining the sixty-day progress files report that the regimen produces severe retrograde amnesia and lasting clinical impairment in psychiatric patients without yielding any controllable behavioral conditioning or reliable interrogation technique. The grant now awaits disposition on the review desk."
 cwic_mkultra.380.a: "Terminate the SIHE grant and seal the Montreal clinical files."
 cwic_mkultra.380.b: "Authorize a grant renewal for intensive depatterning and psychic driving."
 cwic_mkultra.380.c: "Keep the report on the review desk to commission an independent psychiatric audit."
 USA_mkultra_subproject68_archive_tt: "Terminates §YSubproject 68§! and seals the SIHE files (§G-3 Exposure§!), freeing the study slot."
 USA_mkultra_subproject68_renew_tt: "Renews the Montreal depatterning grant (§G+8 Research Record§!, §R+10 Harm§!, §R+8 Exposure§!) and frees the study slot. §RWill increase 1975 and 1977 congressional inquiry severity.§!"
 USA_mkultra_subproject68_keep_open_for_audit_tt: "Keeps the §YSubproject 68§! report open in the Decisions panel so you can commission §YCommission Independent Psychiatric Audit (Subproject 68)§!."

 cwic_mkultra.385.t: "The Montreal Clinical Grant Disclosures"
 cwic_mkultra.385.d: "Surviving financial vouchers from the Society for the Investigation of Human Ecology have drawn congressional and diplomatic scrutiny to Subproject 68. Investigators reconstructing the external grant ledger have documented that Agency funds underwrote intensive 'depatterning' electroshock and looped audio conditioning on psychiatric patients at a Montreal clinic between 1957 and 1963.\n\nBecause the clinical experiments involved unwitting foreign nationals and left documented long-term impairment without operational justification, the Department of State and Agency counsel face immediate pressure over archival disclosure and patient restitution."
 cwic_mkultra.385.a: "Authorize archival disclosure and fund clinical restitution settlements."
 cwic_mkultra.385.b: "Contest liability and cite the autonomy of external academic grant recipients."
 USA_mkultra_subproject68_restitution_tt: "Spends §Y20 Political Power§! to fund restitution and contain the diplomatic and congressional fallout (§G-5 Exposure§!)."
 USA_mkultra_subproject68_contest_tt: "Contests liability without spending Political Power (§R+6 Exposure§!, §R-1.0% Stability§!)."

 # Event 390 (Card 15: Project ARTICHOKE Overseas I&S)
 cwic_mkultra.390.t: "Project ARTICHOKE: Overseas I&S Interrogation Review"
 cwic_mkultra.390.d: "Organized jointly by the Inspection & Security Office and the Medical Staff, Project ARTICHOKE dispatched specialist teams to overseas stations to evaluate whether pharmacological compounds—chiefly sodium pentothal combined with stimulants—hypnosis, or physical isolation could compel truthful disclosures from defectors and suspected double agents.\n\nAfter forty-five days of reviewing overseas safe-house logs, analysts report that while structured baseline screening and polygraph cross-checks reliably identify fabricators, narco-hypnotic sessions produce suggestible confabulation rather than verifiable intelligence."
 cwic_mkultra.390.a: "Restrict ARTICHOKE teams to defensive debriefing and baseline screening."
 cwic_mkultra.390.b: "Authorize coercive overseas safe-house trials on high-risk suspects."
 cwic_mkultra.390.c: "Keep the report open on the desk to standardize the defensive debriefing manual."
