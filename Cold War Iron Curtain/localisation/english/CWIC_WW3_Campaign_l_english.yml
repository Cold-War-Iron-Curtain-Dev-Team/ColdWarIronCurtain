l_english:
 SOVw_Third_World_War.5.t: "An Appeal to Beijing"
 SOVw_Third_World_War.5.a: "Send our proposal to the Chinese leadership."
 SOVw_Third_World_War.7.t: "The Soviet Appeal"
 SOVw_Third_World_War.7.a: "China must stay out of this war."
 SOVw_Third_World_War.7.b: "Prepare to support the Soviet Union."
 SOVw_Third_World_War.8.d: "The war is stretching the resources of both sides. Our diplomats and military planners continue to assess the balance of forces and the prospects for a settlement."
 SOVw_Third_World_War.8.a: "Keep the leadership informed."
 SOVw_Third_World_War.9.d: "The General Staff has reviewed the progress of the campaign. The required European theatres must be secured before the deadline if we are to negotiate from a position of strength."
 SOVw_Third_World_War.9.a: "Continue the campaign."
 CWIC_WW3_OBJECTIVES_REGISTERED_TT: "At least one European theatre has entered the campaign."
 CWIC_WW3_WASHINGTON_TT: "The Soviet bloc controls Washington, D.C."
 CWIC_WW3_US_DEFEATED_TT: "The United States has capitulated to the Soviet bloc, has been replaced by a Soviet-aligned government, or no longer exists."
 CWIC_WW3_STRATEGIC_VALUE_TT: "The strategic value of this state exceeds 50."
 CWIC_WW3_NEGOTIATED_CEASEFIRE_TT: "An accepted armistice ends the Soviet bloc wars against the recorded WW3 opponents. Established governments and territorial transfers remain; unfinished occupations are returned. European victory is awarded only if all required states are secured."
 SOV_WW3_Time_Limit_desc: "Secure every state listed below before the deadline to open the European peace conference. Soviet allies, subjects and Soviet-aligned successor governments count. Every province in each listed state must be held; enemy pockets still block completion.\n\nThe initial deadline is 365 days. Each qualifying capitulation changes it once, during this phase only: France +40 days; Italy, West Germany, Denmark, Saarland, Austria, Luxembourg, Finland, Sweden, Norway, the Netherlands, Belgium, Yugoslavia and Japan +25 days; Andorra +5 days. Losing Poland, East Germany, Albania or Yugoslavia to the American side costs 15 days.\n\nIf the deadline expires, a ceasefire is enforced. Securing the objectives opens the conference automatically on the next daily check."
 SOV_Operation_Red_Dusk: "Operation Red Dusk"
 SOV_Operation_Red_Dusk_desc: "Within 765 days, the Soviet bloc must control Washington, D.C. and defeat the United States. American capitulation to the Soviet bloc, a Soviet-aligned American government or the elimination of the United States satisfies the second requirement. Success ends the war in Soviet victory. Expiry costs 50% Stability and 50% War Support, then forces a ceasefire."
 SOV_Force_Peace: "Negotiate a Ceasefire"
 SOV_Force_Peace_desc: "After more than seven months of war, propose an armistice to Washington. The United States can accept or reject it. Acceptance ends the Soviet bloc wars against recorded WW3 opponents and closes the campaign deadlines. Established governments and territorial transfers remain; unfinished occupations are returned. A European victory requires every required state to be secured."
 SOV_capital_targeted_decision_desc: "Recognize the liberation of the fixed capital objective shown below. Soviet and allied control count. A government moving its capital cannot move this objective. This reduces war exhaustion and, if the war has lasted less than two months, increases army strength."
 SOV_States_Strategic_target_decision_desc: "Recognize a strategically valuable state controlled by the Soviet bloc. This reduces war exhaustion and, if the war against its owner has lasted less than two months, increases army strength."
 SOV_form_austrian_democratic_republic_desc: "Once all nine Austrian states are secured by the Soviet bloc, establish the Austrian Democratic Republic."
 SOV_yugoslavian_problem_desc: "Pressure an unaffiliated Yugoslavia to accept our leadership. Yugoslavia will decide whether to submit or resist."
 SOVw_Third_World_War.1000.t: "Victory Across the Atlantic"
 SOVw_Third_World_War.1000.d: "Washington is in Soviet bloc hands and the United States has been defeated. Operation Red Dusk has achieved its objectives. A settlement ends the remaining war with our recorded opponents, preserving the governments and territorial changes already established. The long war is over."
 SOVw_Third_World_War.1000.a: "Bring our soldiers home."
 SOVw_Third_World_War.1010.t: "The Forced Ceasefire"
 SOVw_Third_World_War.1010.d: "The deadline for the European campaign has expired. With the required theatres still unsecured, the Soviet leadership accepts a ceasefire. Our bloc ends the war with its recorded opponents. Unfinished occupations are returned, while governments and territorial changes already established by the war remain."
 SOVw_Third_World_War.1010.a: "The fighting must end."
 SOVw_Third_World_War.1011.t: "Red Dusk Falls Short"
 SOVw_Third_World_War.1011.d: "Operation Red Dusk has failed to secure both Washington and the defeat of the United States before its deadline. The exhausted Soviet Union must now accept a ceasefire. Stability and war support have fallen sharply. Established governments and territorial changes remain, but unfinished occupations are returned."
 SOVw_Third_World_War.1011.a: "End the offensive."
