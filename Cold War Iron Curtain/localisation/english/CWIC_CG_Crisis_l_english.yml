l_english:
 cwic_cg_crisis.1.t:0 "Queues for Basic Goods"
 cwic_cg_crisis.1.d:0 "Shortages of basic consumer goods are producing long queues outside shops. Deliveries sell out before everyone can be served, and households are losing hours of work to the search for everyday necessities. Arguments over places in line and the distribution of remaining stocks are increasingly directed at the authorities.\n\nLocal officials can be instructed to hear complaints and explain the supply situation. This would take time away from other government business without adding anything to shop shelves, but it would give dissatisfied households a means of raising their grievances. Leaving the queues unattended would spare that effort while allowing resentment over the shortages to grow."
 cwic_cg_crisis.1.a:0 "Leave the queues for now. There is nothing more to sell."
 cwic_cg_crisis.1.b:0 "Have local officials hear the complaints."
 cwic_cg_crisis.2.t:0 "Goods Under the Counter"
 cwic_cg_crisis.2.d:0 "Basic goods unavailable in the shops are being offered through unofficial traders at higher prices. Some households now depend on these sellers for necessities, while the prospect of a profit encourages others to buy scarce stock for resale. Goods diverted from ordinary retail channels make the shortage harder to manage.\n\nTolerating this trade would preserve an alternative source of supplies, but allow the black market to expand. Sending inspectors would require officials to be diverted from other duties, and enforcement could only restrain the trade while shortages continue. The government must decide how much effort to spend pursuing sellers whose customers have few other places to turn."
 cwic_cg_crisis.2.a:0 "Leave the traders alone. People need those goods."
 cwic_cg_crisis.2.b:0 "Send inspectors, even if some trade slips through."
 cwic_cg_crisis.2.tt:0 "Black Market Pressure increases by 5 points."
 cwic_cg_crisis.3.t:0 "The Factory Gates Stay Shut"
 cwic_cg_crisis.3.d:0 "Workers facing persistent shortages of household necessities have begun stopping work. Their grievances concern the difficulty of obtaining basic goods and the hours their families spend searching for supplies. The stoppages are disrupting factory production, and other workplaces may follow while the shortages remain unresolved.\n\nNegotiations would give the workers a hearing, but talks alone cannot provide the missing goods. Production would continue to suffer while grievances are discussed. Police intervention could clear factory entrances and disperse those preventing a return to work, at the cost of further public anger. The government must settle its response before the stoppages spread."
 cwic_cg_crisis.3.a:0 "Open talks, even if the stoppages continue."
 cwic_cg_crisis.3.b:0 "Send the police to clear the gates."
 cwic_cg_crisis.4.t:0 "Proposed Household Rationing"
 cwic_cg_crisis.4.d:0 "Persistent shortages have prompted a proposal for a year-long system of household rationing. Ration cards would limit purchases of basic goods, reducing demand and preventing households able to shop first from exhausting the available stocks.\n\nThe scheme would not increase supplies, and an allowance on a card would not guarantee that a shop could honour it. Restrictions would also bring disputes over household entitlements and resentment at government interference in everyday purchases. Rejecting rationing would avoid these controls, but leave households competing for inadequate supplies and the authorities facing continued anger over the queues. The proposal now requires government approval."
 cwic_cg_crisis.4.a:0 "Issue the cards. Limit purchases for a year."
 cwic_cg_crisis.4.b:0 "Reject the cards, even if the queues grow angrier."
 cwic_cg_rationing:0 "Household Rationing"
 cwic_cg_rationing_desc:0 "Ration cards limit household purchases of basic goods, reducing consumer demand. Restrictions on everyday shopping have brought resentment and disputes over allowances."
 cwic_cg_strike_wave:0 "Spreading Work Stoppages"
 cwic_cg_strike_wave_desc:0 "Workers facing empty shops have stopped work while their grievances remain unresolved. The stoppages are cutting military factory output."
 cwic_cg_emergency_imports_idea:0 "Emergency Goods Deliveries"
 cwic_cg_emergency_imports_idea_desc:0 "Emergency deliveries supplement the supply of everyday necessities. For a limited period, they provide a boost to basic goods output."
 cwic_cg_introduce_rationing:0 "Issue Household Ration Cards"
 cwic_cg_introduce_rationing_desc:0 "Restrict purchases of basic goods through a year-long ration card scheme. Lower consumer demand will ease pressure on supplies, at the cost of public resentment."
 cwic_cg_emergency_imports:0 "Arrange Emergency Goods Deliveries"
 cwic_cg_emergency_imports_desc:0 "Arrange emergency shipments of everyday necessities from abroad. These deliveries will boost basic goods output for 90 days while longer-term shortages remain to be addressed."
