 cwic_cg_crisis.1.t:0 "Another Morning in the Queue"
 cwic_cg_crisis.1.d:0 "At the shop counter, a clerk counted the parcels left beneath the till. Outside, people who had waited since morning pressed forward each time the door opened. A local official had come to ask how long the stock would last.\n\n\"Until those people get served,\" the clerk said, pointing to the front of the queue. \"What do I tell the rest?\"\n\n\"We could bring the district officials here to answer questions,\" his assistant said.\n\nThe official looked at the few parcels. A meeting would take people away from other work, with no delivery to offer the crowd. Leaving the queue as it was meant another afternoon of arguments at the door. His assistant opened a notebook and waited for instructions."
 cwic_cg_crisis.1.a:0 "Leave the queues for now. There is nothing more to sell."
 cwic_cg_crisis.1.b:0 "Bring the officials here to answer people's complaints."
 cwic_cg_crisis.2.t:0 "Goods Under the Counter"
 cwic_cg_crisis.2.d:0 "In the market office, an inspector laid a packet of soap beside his report. He had bought it behind a shop whose shelves were bare. The seller had offered more, provided he paid without asking for a receipt.\n\n\"People are getting what they need,\" the official across the desk said. \"Close him down and where do they go?\"\n\n\"Others are buying up stock to sell it on. We can send inspectors, but we'll have to pull them off other work. We won't catch everyone.\"\n\nThe official turned the packet over. There was no sign of where it had come from. The inspector put a list of available staff on the desk and asked whether he should draw up the orders."
 cwic_cg_crisis.2.a:0 "Leave the traders alone. People need those goods."
 cwic_cg_crisis.2.b:0 "Send inspectors, even if some trade slips through."
 cwic_cg_crisis.2.tt:0 "Black Market Pressure increases by 5 points."
 cwic_cg_crisis.3.t:0 "The Factory Gates Stay Shut"
 cwic_cg_crisis.3.d:0 "In the factory gatehouse, a government representative read the workers' demands while the foreman tried to telephone his suppliers. The machines beyond the yard had stopped. A worker waiting at the desk had brought a shopping bag with nothing in it.\n\n\"My wife queued all morning,\" he said. \"What am I supposed to take home?\"\n\n\"Come to talks,\" the representative replied. \"We can't settle this at the gate.\"\n\n\"We'll talk. Nobody's agreed to go back in.\"\n\nA police officer stepped in from the yard. He wanted permission to clear the entrance before more workers gathered there. The representative folded the demands and asked his secretary to get the ministry on the telephone."
 cwic_cg_crisis.3.a:0 "Open talks, even if the stoppages continue."
 cwic_cg_crisis.3.b:0 "Send the police to clear the gates."
 cwic_cg_crisis.4.t:0 "A Share on Paper"
 cwic_cg_crisis.4.d:0 "In a ministry office, a secretary placed a sample ration card beside the latest shortage reports. The official studying it ran a finger over the spaces for household details. The proposal called for a year of limits on purchases of basic goods.\n\n\"A card won't put anything on a shelf,\" an adviser said. \"People will blame us when their allowance isn't there.\"\n\n\"They're blaming us already,\" the secretary replied. \"At least this would limit how much one person could buy.\"\n\nThe official asked how many complaints the new rules would bring. Nobody offered a figure. The secretary took back the sample and set a clean sheet in the typewriter, waiting to hear whether to prepare the order."
 cwic_cg_crisis.4.a:0 "Issue the cards. Limit purchases for a year."
 cwic_cg_crisis.4.b:0 "Reject the cards, even if the queues grow angrier."
 cwic_cg_rationing:0 "Household Rationing"
 cwic_cg_rationing_desc:0 "Ration cards limit household purchases of basic goods, reducing consumer demand. Restrictions on everyday shopping have brought resentment and disputes over allowances."
 cwic_cg_strike_wave:0 "Spreading Work Stoppages"
 cwic_cg_strike_wave_desc:0 "Workers facing empty shops have stopped work while their grievances remain unresolved. The stoppages are cutting military factory output."
 cwic_cg_emergency_imports_idea:0 "Emergency Goods Deliveries"
 cwic_cg_emergency_imports_idea_desc:0 "Emergency deliveries supplement the supply of everyday necessities. For a limited period, they provide a boost to basic goods output."
 cwic_cg_introduce_rationing:0 "Issue Household Ration Cards"
 cwic_cg_introduce_rationing_desc:0 "Restrict purchases of basic goods through a year-long ration card scheme. Lower consumer demand will ease pressure on supplies, at the cost of public resentment."
 cwic_cg_emergency_imports:0 "Arrange Emergency Goods Deliveries"
 cwic_cg_emergency_imports_desc:0 "Arrange emergency shipments of everyday necessities from abroad. These deliveries will boost basic goods output for 90 days while longer-term shortages remain to be addressed."
