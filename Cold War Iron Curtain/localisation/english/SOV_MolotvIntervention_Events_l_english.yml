#---Poland---

 sov_molotov_easternbloc_poland.t:0 "The Situation in Poland."
 sov_molotov_easternbloc_poland_d_gomulka:0 "Molotov looked at the papers Shelepin had brought him, carefully examining the latest reports coming from Warsaw. The situation in Poland had become increasingly concerning. Gomulka's  'Polish road to socialism', his encouragement of economic decentralization, concessions to private agriculture and willingness to introduce market-oriented reforms were all troubling signs. Rather than strengthening socialist planning, Gomulka appeared intent on undermining socialism the same way Khrushchev had done all those years ago, yet in an even more radical way. Molotov had seen this sort of opportunism before, and he knew all too well where it could lead. Was this not precisely how the Yugoslav revisionists had begun their departure from the socialist camp? He placed the papers down and sighed. With Khrushchev gone, there was no reason to continue tolerating such tendencies. The Polish Proletariat could not be left in the hands of such 'leadership'."
 sov_molotov_easternbloc_poland_d_zawadzki:0 "Molotov looked at the papers Shelepin had brought him, this time concerning the political record of Aleksander Zawadzki and the recent developments within the Polish United Workers' Party. The success of the Natolin faction had certainly been encouraging. Despite considerable pressure from Khrushchev and his supporters, the faction had managed to preserve its political standing and eventually outmaneuver Gomulka and his associates. Molotov was particularly pleased with Zawadzki's conduct throughout these events. A veteran communist who had endured imprisonment and remained committed to the socialist cause, he was precisely the sort of man Poland needed. Molotov briefly glanced at an accompanying photograph of Zawadzki alongside the late Comrade Bierut. Perhaps the latter's legacy was in good hands after all."
 sov_molotov_easternbloc_poland.a:0 "''Gomulka is worse than even the Khrushchevites, there's only one way to deal with this.''"
 sov_molotov_easternbloc_poland.b:0 "''Zawadzki is a truthful communist and a worthy successor of Bierut, I trust his leadership.''"
 sov_molotov_easternbloc_poland_zawadzki.t:0 "A message from General Secretary Molotov"
 sov_molotov_easternbloc_poland_zawadzki.d:0 "Zawadzki was reviewing the latest reports from Warsaw when a message from Molotov arrived, requesting direct contact with him. The initiative from Moscow caught him by surprise, but he quickly understood its significance. After defeating the opportunist Gomulka his leadership had been on its tiptoes for the past year, careful not to provoke Khrushchev with its commitment to hardline socialism, and as much as he wanted to do what Albania did he knew full well that would lead to Soviet intervention. Even when the Hardliners had removed Khrushchev he had restrained himself, fearing that if the Khrushchevites returned and saw that his government had endorsed their rivals they would surely make him pay. Now, with the true Marxist-Leninists having secured their power and Molotov personally extending a hand, Zawadzki saw an opportunity to secure Poland's socialist course and restore the close relations with the Soviet Union."
 sov_molotov_easternbloc_poland_zawadzki.a:0 "Bierut's vision lives on"
 sov_molotov_easternbloc_poland_GomulKKKa.t:0 "Soviet Invasion"
 sov_molotov_easternbloc_poland_GomulKKKa.d:0 "Molotov doesn't like our revisionism, and since we said we would resist if the USSR ever tried to do what they did in Hungary, he's decided to launch a full blown invasion."
 sov_molotov_easternbloc_poland_GomulKKKa.a:0 "rip bozo total reformist death"
