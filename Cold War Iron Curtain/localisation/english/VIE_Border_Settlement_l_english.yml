l_english:

 # ------------------------------------------------------------
 # VIE 1950s Indochina border settlement
 # ------------------------------------------------------------

 # --- Focuses ---
 VIE_Indochina_Border_Settlement: "The Unsettled Frontier"
 VIE_Indochina_Border_Settlement_desc: "The war is over and Vietnam stands. What Vietnam does not have is a border it agreed to. Every line running west of the Annamite range was drawn in a Paris ministry by men who never saw the country, and the Republic inherited them wholesale from a colonial administration that no longer exists.\n\nThe foreign ministry has quietly assembled the files: the Khmer salient at Svay Rieng that juts into the Mekong delta like a knife, the old Tran-Ninh prefecture that Hue governed until the Protectorate handed it to Vientiane, the northern marches around Phongsaly where the writ of any government is a matter of opinion. None of these questions were put to the conference table. All of them can still be opened."
 VIE_Consolidate_The_Frontier: "Consolidate the Frontier"
 VIE_Consolidate_The_Frontier_desc: "Whatever we took, we now hold. The provincial administration must be extended over the new districts, the census taken, the schools opened and the garrisons made permanent. In a generation the children there will be Vietnamese, and the question of where the line was drawn in 1893 will interest nobody but historians.\n\nThe frontier question is closed. What remains is the work of making it stay closed."

 # --- Decision category ---
 VIE_Border_Settlement: "The Frontier Question"

 # --- Decisions ---
 VIE_Border_Table_Demand: "Table a Frontier Demand"
 VIE_Border_Table_Demand_desc: "Deliver a formal note to the government concerned, setting out our historical title to the province and inviting them to settle the matter by agreement. They may prefer to keep the province.\n\n§YSvay Rieng§! may be demanded at once - the claim has stood since the Elysee Accords. §YTran-Ninh§! and §YHouaphanh§! require that we pressed our historical claim to Tran-Ninh. §YPhongsaly§! is only arguable once Tran-Ninh is ours and we hold the approaches to it."
 VIE_Border_Provoke_Incidents: "Provoke Border Incidents"
 VIE_Border_Provoke_Incidents_desc: "Patrols that stray. Customs posts that move a kilometre overnight. Villagers who discover they have been paying the wrong government's taxes. None of it is war, and all of it is pressure. The more of it they endure, the likelier they are to come to the table - and the likelier the whole frontier is to catch fire."
 VIE_Border_Renewed_Demand: "Renew the Demand"
 VIE_Border_Renewed_Demand_desc: "Put the note a second time, to a government that has spent months watching its frontier posts burn. The arguments have not changed. Their appetite for the argument has."
 VIE_Border_Punitive_Clash: "Launch a Punitive Clash"
 VIE_Border_Punitive_Clash_desc: "Send the army across the line in strength, take the disputed districts, and present the settlement as a fact. It is not a war and nobody will call it one, but men will die over it and the world will watch how it ends."
 VIE_Border_Fabricate_Frontier_Casus_Belli: "Fabricate a Frontier Casus Belli"
 VIE_Border_Fabricate_Frontier_Casus_Belli_desc: "The clash failed and the province is still theirs. There is one instrument left: build the legal case, publish the atrocity, and take the province in a war we declare openly. Washington and Paris will both have something to say about it."
 VIE_Border_Renounce_Claims: "Renounce the Claim"
 VIE_Border_Renounce_Claims_desc: "Withdraw the note, drop the claim and let the line stand where the French drew it. We gain a neighbour who will speak to us and lose an argument we were never certain of winning."

 # --- Trigger tooltips ---
 VIE_indochina_war_won_trigger_TT: "§YThe First Indochina War has ended on terms favourable to us§! - the North has been absorbed, or the accords were signed with Saigon in the stronger position"
 VIE_can_press_border_claims_trigger_TT: "§YWe are a sovereign state, at peace, with the frontier question open§!"
 VIE_border_election_pending_block_tt: "§YNo all-Vietnam ballot is pending§! - we will not open a frontier quarrel with the very state we are about to go to the polls beside"
 VIE_border_target_not_french_subject_TT: "§YThe owner is not a French subject§! - we do not press claims against fellow members of the Union"
 VIE_border_target_adjacent_TT: "§YThe province borders territory we own and control§!"
 VIE_border_tranninh_claimed_TT: "§YWe pressed our historical claim to Tran-Ninh§!"
 VIE_border_clash_force_TT: "§YOur troops already occupy the province, or we hold a state bordering it - ours, free of border fighting and garrisoned with at least one division§! - from which to mount the operation"
 VIE_border_no_clash_tt: "§RNo clash can be mounted§! - we need a state we own and control bordering the province, garrisoned with at least one division"
 VIE_border_clash_running_tt: "§YNo punitive operation is under way§! - the frontier question waits until the shooting on it has stopped"
 VIE_border_demand_pending_tt: "§YNo note is awaiting a reply§! - we will not put two demands to two governments at once"
 VIE_frontier_gained_TT: "§YWe hold at least one of the disputed frontier provinces§!"

 # --- Effect tooltips ---
 VIE_border_demand_sent_tt: "§YA formal note is delivered to the government concerned§!, setting out our title to the province. Their reply is expected within the month; if none comes, the silence will be read as a refusal."
 VIE_border_incidents_begun_tt: "§YThe frontier campaign runs for 14 days§!, after which the pressure on the province is assessed and the border command reports what it cost us."
 VIE_border_clash_launch_tt: "§YThe army moves on the province in strength.§! Where the ground is still theirs the operation is fought out as a border clash; where our garrison already stands on it, the province is simply kept. Either way Saigon will be marked a §Rregional aggressor§! and the affair will raise world tension."
 VIE_border_cb_fabricated_tt: "§YThe legal case is published and a war goal is prepared against the owner of the province.§! Washington and Paris will both have something to say about it."

 # --- World tension reasons ---
 VIE_border_clash_threat: "Vietnamese punitive operation on the frontier"
 VIE_border_casus_belli_threat: "Vietnamese designs on its neighbours"

 # --- Ideas ---
 VIE_Regional_Aggressor: "Regional Aggressor"
 VIE_Regional_Aggressor_desc: "Saigon has stopped pretending its frontier claims are a legal matter. The capitals of Southeast Asia have noticed, and so have the powers who fund us."
 VIE_Regional_Hegemon: "Master of the Frontier"
 VIE_Regional_Hegemon_desc: "We took what we said was ours and nobody stopped us. The army has never been more confident, and our neighbours have never been more careful."
 VIE_Chastened_Frontier: "A Frontier Left Alone"
 VIE_Chastened_Frontier_desc: "The claims were dropped before they cost anyone their life. It reads as weakness in some quarters and as statesmanship in others, and the border districts are quiet."

 # --- Events ---
 VIE_Border_Settlement.1.t: "Saigon Demands [VIE_border_demand_target.GetName]"
 VIE_Border_Settlement.1.d: "A note has arrived from the Vietnamese foreign ministry concerning [VIE_border_demand_target.GetName]. It is courteous, it is long, and it is entirely one-sided. Saigon rehearses the pre-colonial administration of the province, dismisses the French delimitation as the arbitrary act of a power that has since departed, and invites us to correct the record by transferring the province to Vietnamese sovereignty.\n\nThe province is not large. What it is, is ours, and the men who drew the line are not available to be consulted. If we hand it over because Saigon asked firmly, we will be asked again, about somewhere else, and there will be no argument left to make."
 VIE_Border_Settlement.1.a: "The province is not worth a quarrel. Let them have it."
 VIE_Border_Settlement.1.b: "The border stands. Tell them so."
 VIE_Border_Settlement.2.t: "The Frontier Is Ceded"
 VIE_Border_Settlement.2.d: "[VIE_border_demand_owner.GetNameDefCap] has agreed to transfer [VIE_border_demand_target.GetName] to Vietnamese administration. There was no ultimatum and no shooting - only a note, some months of correspondence, and a government that decided the province was not worth the quarrel.\n\nThe transfer will be presented in Saigon as the correction of a colonial error. It will be presented in their capital as rather less than that, and there are men in their foreign ministry who will not forgive it."
 VIE_Border_Settlement.2.a: "The map is corrected."
 VIE_Border_Settlement.3.t: "The Demand Is Rejected"
 VIE_Border_Settlement.3.d: "The reply from [VIE_border_demand_owner.GetNameDefCap] is brief where our note was long. The frontier was fixed by treaty, the treaty stands, and the internal history of the province before the Protectorate is a matter for scholars rather than diplomats. They decline to discuss it further.\n\nThe legal road is closed. What is left is pressure - and pressure on a frontier has a way of becoming something else."
 VIE_Border_Settlement.3.a: "Then we will make the frontier expensive for them."
 VIE_Border_Settlement.4.t: "No Reply From [VIE_border_demand_owner.GetName]"
 VIE_Border_Settlement.4.d: "A month has passed and the note concerning [VIE_border_demand_target.GetName] has not been answered. There has been no rejection, no counter-proposal, not even an acknowledgement of receipt - only the particular silence of a foreign ministry that has decided the whole business will go away if it is left alone long enough.\n\nIt is a refusal, delivered in the least expensive way available to them. Our ambassador advises that we stop waiting for a letter that is not being written."
 VIE_Border_Settlement.4.a: "Silence is an answer. Treat it as one."
 VIE_Border_Settlement.10.t: "An Incident Goes Wrong"
 VIE_Border_Settlement.10.d: "A patrol crossed further than it was meant to and came back short of men and equipment. The frontier posts on the other side were better prepared than our staff had assumed, and the affair has been written up in their press as a repulsed invasion.\n\nThe army has learned something from it. The cost of the lesson is sitting in a ravine on the wrong side of the line."
 VIE_Border_Settlement.10.a: "A costly education."
 VIE_Border_Settlement.11.t: "The Frontier Hardens"
 VIE_Border_Settlement.11.d: "Our campaign of incidents has produced an effect, though not the one intended. The government opposite has used our provocations to justify reinforcing the very districts we want, and the villagers there - who a year ago had no opinion about which capital taxed them - have begun to develop one.\n\nOur own newspapers are asking why a frontier question has consumed so much attention for so little result."
 VIE_Border_Settlement.11.a: "Pressure cuts both ways."
 VIE_Border_Settlement.12.t: "The Neighbours Take Notice"
 VIE_Border_Settlement.12.d: "What we have been doing on one frontier has been read on all of them. The governments of Indochina have compared notes, and the conclusion they have reached is that a Vietnam which presses one neighbour is a Vietnam that will eventually press the rest.\n\nInvitations have cooled. Ambassadors have been recalled for consultations. Nothing has been said officially, which is itself the message."
 VIE_Border_Settlement.12.a: "Let them be nervous."
 VIE_Border_Settlement.13.t: "A Quiet Season On The Frontier"
 VIE_Border_Settlement.13.d: "The border command's report on [VIE_border_incident_target.GetName] is the kind our staff college holds up as a model: nothing in it can be proved, nothing in it can be denied, and none of it appeared in anybody's newspaper. Customs posts drifted. Patrols went where patrols had not gone. Two villages discovered they had been paying the wrong government's taxes for a decade and were invited to consider the alternative.\n\nThere were no casualties worth the name and no diplomatic note. What there is, is a provincial administration in [VIE_border_incident_owner.GetAdjective] hands that is a little less certain of itself than it was a fortnight ago."
 VIE_Border_Settlement.13.a: "Pressure applied where it will be felt."
 VIE_Border_Settlement.20.t: "Saigon's Frontier Ambitions"
 VIE_Border_Settlement.20.d: "Our client in Saigon has manufactured a case for war against a neighbouring state over a border province. The dossier is thin, the atrocity stories are recycled, and the whole affair has the unmistakable smell of a government looking for a victory it can hold a parade over.\n\nWe are funding this government to hold a line against communism in Asia, not to redraw the map of Indochina for its own convenience. On the other hand, a Vietnam that is confident and expanding is a Vietnam that is not collapsing - and there is a case, made quietly, that we should let this one go."
 VIE_Border_Settlement.20.a: "Warn them off. We did not arm them for this."
 VIE_Border_Settlement.20.b: "A strong Saigon serves us. Look the other way."
 VIE_Border_Settlement.21.t: "The Republic Redraws Our Borders"
 VIE_Border_Settlement.21.d: "The frontiers of Indochina were established by French administrators, by treaty and by survey, over sixty years of patient and occasionally violent work. Saigon has now decided that this work was arbitrary and may be undone by proclamation.\n\nIt is a small province and France has larger concerns. But there is something particularly galling in watching a state we created dismantle the one legacy we left behind that everyone had agreed to live with."
 VIE_Border_Settlement.21.a: "Lodge a protest. It will change nothing."
 VIE_Border_Settlement.30.t: "The Frontier Is Taken"
 VIE_Border_Settlement.30.d: "Our troops hold [VIE_border_clash_target.GetName]. The operation lasted days rather than weeks, the opposing garrison withdrew rather than be encircled, and the provincial administration has been placed under Vietnamese authority.\n\nNobody has declared war and nobody will. The province is simply ours now, and the argument about whether it should have been is one that will be conducted, for the next fifty years, entirely by historians."
 VIE_Border_Settlement.30.a: "The line is where we say it is."
 VIE_Border_Settlement.31.t: "The Operation Fails"
 VIE_Border_Settlement.31.d: "The operation has failed. Our columns did not reach the provincial capital, the defenders did not break, and our forces have withdrawn to the start line having achieved nothing except to make a modest border dispute into a national humiliation.\n\nThe government is being asked, loudly and in public, what exactly the army was sent to do and why it could not do it. The province remains theirs, and every neighbour we have has just recalculated what our threats are worth."
 VIE_Border_Settlement.31.a: "This will be paid for in Saigon."
 VIE_Border_Settlement.32.t: "The Vietnamese Are Thrown Back"
 VIE_Border_Settlement.32.d: "Saigon sent its army across our frontier and our soldiers sent it home again. The province is intact, the government's standing has never been higher, and the Vietnamese are left explaining to the world how a punitive operation became a rout.\n\nThere will be another attempt one day. Today is not the day to worry about it."
 VIE_Border_Settlement.32.a: "We held."
 VIE_Border_Settlement.33.t: "The Province Is Lost"
 VIE_Border_Settlement.33.d: "Vietnamese troops hold the province. Our garrison was outnumbered and outmatched, and withdrew rather than be destroyed for a district that the general staff had privately written off years ago.\n\nThe government must now explain to the country how a frontier guaranteed by treaty was altered by a foreign army in the space of a week, and what it intends to do about it. The honest answer to the second question is nothing."
 VIE_Border_Settlement.33.a: "A humiliation we cannot answer."
 VIE_Border_Settlement.34.t: "The Clash Peters Out"
 VIE_Border_Settlement.34.d: "The fighting on the frontier has stopped without either side achieving anything. Positions have been resumed, the dead have been collected, and the province remains exactly where it was.\n\nThe dispute is not settled. It has merely been postponed."
 VIE_Border_Settlement.34.a: "Nothing is resolved."
 VIE_Border_Settlement.35.t: "A Fait Accompli on the Frontier"
 VIE_Border_Settlement.35.d: "There was no clash. Our troops have been sitting in [VIE_border_clash_target.GetName] since the war, the flag over the residency was never taken down, and the only thing that changed this week was that Saigon stopped pretending the arrangement was temporary.\n\nThe provincial administration has been placed under Vietnamese authority and the owner's officials have been given passage to the frontier. There is nothing for the army to do that it has not already done.\n\nThe protests will be loud and they will be filed. Possession, as the ministry has been quietly observing all year, is the whole of the law out here."
 VIE_Border_Settlement.35.a: "We were never going to leave."
 VIE_Border_Settlement.40.t: "Saigon Moves Against Our Clients"
 VIE_Border_Settlement.40.d: "The Republic of Vietnam has launched a military operation against [VIE_border_clash_target.GetName], held by our friends in the Lao movement. The provinces of the north were guaranteed to them by agreement, and Saigon has decided that the agreement does not apply to it.\n\nWe can extend our guarantee openly and let Saigon understand what a further step westward would mean. Or we can protest, do nothing, and hope our comrades hold the passes on their own."
 VIE_Border_Settlement.40.a: "Guarantee them openly. Saigon must know where the line is."
 VIE_Border_Settlement.40.b: "Protest, and no more. We have our own war to finish."
