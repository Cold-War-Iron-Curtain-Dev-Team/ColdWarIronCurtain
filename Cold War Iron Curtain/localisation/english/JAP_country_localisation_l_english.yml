 LDP_Tokakai_text_tt: "§YTokakai§!\n-------------------------------------\n\n\n\n\n£GFX_LDP_Tokakai_Banner\n\n\n\n\n\n\n§YPolitical Power Gain:§! [?JAP_Liberal_Democratic_Party_political_power_gain|+1%]\n§YArms Factory:§! §GProduction Speed§! [?JAP_Liberal_Democratic_Party_production_speed_arms_factory_factor|+1%]\n-------------------------------------\n\n\nThis conservative peripheral faction traces its origins to the §Yanti-Shigeru Yoshida line§! within the Japan Democratic Party at the time of the §Y1955 conservative merger§!, particularly the political currents associated with §GNobusuke Kishi§! and §GIchiro Hatoyama§!.\nWhile maintaining a §Ypro-United States and anti-communist§! orientation, it advocates §Yconstitutional revision and the establishment of an autonomous constitution§!, and takes an §Ractive stance on rearmament§!, giving the faction a §Rcomparatively hawkish character§!."
 LDP_Kochikai_text_tt: "§YKochikai§!\n-------------------------------------\n\n\n\n\n£GFX_LDP_Kochikai_Banner\n\n\n\n\n\n\n§YIndustrial Complex:§! §GProduction Speed§! [?JAP_Liberal_Democratic_Party_production_speed_industrial_complex_factor|+1%]\n§YFossil Fuel Powerplant:§! §GProduction Speed§! [?JAP_Liberal_Democratic_Party_production_speed_fossil_fuel_powerplant_factor|+1%]\n-------------------------------------\n\n\nThis mainstream conservative faction was founded by §GHayato Ikeda§!, a direct disciple of §GShigeru Yoshida§!, and traces its lineage to the §YLiberal Party§! led by Yoshida.\nIkeda formed this faction by separating the former §YYoshida School§! of the Liberal Party from the §YShuzankai§!, creating a distinct political group.\nCentered on §Ybureaucratic elites§!, the faction brought together a §Gdovish policy-oriented coalition§! that emphasized pragmatic governance and administrative leadership."
 LDP_Shuzankai_text_tt: "§YShuzankai§!\n-------------------------------------\n\n\n\n\n£GFX_LDP_Shuzankai_Banner\n\n\n\n\n\n\n§YOffice Park:§! §GProduction Speed§! [?JAP_Liberal_Democratic_Party_production_speed_office_park_factor|+1%]\n§YRenewable Powerplant:§! §GProduction Speed§! [?JAP_Liberal_Democratic_Party_production_speed_renewable_powerplant_factor|+1%]\n-------------------------------------\n\n\nThis mainstream conservative faction traces its lineage to the §YLiberal Party§! led by §GShigeru Yoshida§! and has its roots in the §YYoshida School§!.\nIt avoids §Yradical reform§!, places the §YJapan-United States alliance§! as its absolute cornerstone, and emphasizes the development of defense capabilities §Ywithin the framework of Article 9 of the Constitution§!.\nAs a §Gcentrist conservative§! and §Greality-oriented policy group§!, it prioritizes pragmatism, stability, and continuity in governance."
 LDP_Bancho_text_tt: "§YBancho Kenkyukai§!\n-------------------------------------\n\n\n\n\n£GFX_LDP_Bancho_Banner\n\n\n\n\n\n\n§YResearch Speed:§! [?JAP_Liberal_Democratic_Party_research_speed_factor|+1%]\n§YConsumer Goods Factor:§! [?JAP_Liberal_Democratic_Party_consumer_goods_factor|-1%]\n-------------------------------------\n\n\nThis faction traces its roots to the §YMinseito§!, one of the two major political parties of the prewar era, as well as to the §YPeople’s Cooperative Party§!, a centrist party in the postwar period.\nIt is composed of legislators from the §YKaishinto lineage§! led by §GMamoru Shigemitsu§!, and represents a continuation of the §Ymainstream conservative tradition§! within the §YLiberal Democratic Party§!.\nWithin the LDP, this faction corresponds to the §Yleft wing§! and is regarded as an §Runorthodox and marginal presence§!."
 LDP_Shunjukai_text_tt: "§YShujukai§!\n-------------------------------------\n\n\n\n\n£GFX_LDP_Shunjukai_Banner\n\n\n\n\n\n\n§YStability:§! [?JAP_Liberal_Democratic_Party_stability_factor|+1%]\n§YAgricultural Industrial Complex:§! §GProduction Speed§! [?JAP_Liberal_Democratic_Party_production_speed_agri_industrial_complex_factor|+1%]\n-------------------------------------\n\n\nThis left-leaning non-mainstream faction was formed in §Y1956§! under the leadership of §GIchiro Kono§!, and was subsequently operated under his strong personal guidance.\nIt openly §Rdefied Shigeru Yoshida§! and played a central role in §Rbringing down the Yoshida Cabinet§!.\nThe Shunjukai faction brought together §Ypro-China§! and §Ypro-Soviet§! elements within the Liberal Democratic Party, marking it as a §Runconventional and dissident presence§! in the party."

