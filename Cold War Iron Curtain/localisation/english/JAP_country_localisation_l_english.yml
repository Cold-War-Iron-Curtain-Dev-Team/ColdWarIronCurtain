 JAP_LDP_Hashimoto_Role_tt: "§YTomizaburo Hashimoto§!\n-------------------------------------\n\nDuring the §Y1955 conservative merger§!, Hashimoto followed the position of his mentor §GShigeru Yoshida§!, who §Rrefused to join the Liberal Democratic Party§!, and likewise §Rdeclared his own refusal to participate§!.\n\nIn §Y1957§!, when §GNobusuke Kishi§!, the elder brother of §GSato§!, became §GPresident of the LDP§!, Yoshida was persuaded by §GKishi§! and §GHayato Ikeda§! to §Yjoin the Liberal Democratic Party§!.\nFollowing this decision, §GSato§! and §GHashimoto§! also aligned themselves with the party.\n\nHe also played an important role in the §Yestablishment of the Japan Broadcasting Corporation as a special public corporation§!, contributing to the institutional foundation of §YNHK§!."
 JAP_LDP_Hori_Role_tt: "§YShigeru Hori§!\n-------------------------------------\n\nDuring the §Y1950 split of the Democratic Party§!, he aligned with the §YDemocratic Party coalition faction§! and merged into §GShigeru Yoshida’s Democratic Liberal Party§!, contributing to the formation of the §YLiberal Party§!.\nHe was subsequently treated as a trusted figure within the so-called §YYoshida School§!, effectively regarded as a transferred member and given important responsibilities by Yoshida.\n\nWithin the §YYoshida Liberal Party§!, §YOno Banboku§!, §YHayashi Joji§!, and §YMasutani Hideji§! were known as the §YThree Great Houses§!, while §GHayato Ikeda§!, §GEisaku Sato§!, §YHirokawa Kozen§!, and §YHori Shigeru§! were collectively referred to as the §YFour Magistrates§!."
 JAP_LDP_Funada_Role_tt: "§YNaka Funada§!\n-------------------------------------\n\nHe was the eldest brother of the so-called §YFunada Three Brothers§!, a family widely known in Japanese politics.\nHis younger brother §GKoji Funada§! served as a member of the House of Representatives and as §GDirector-General of the Administrative Management Agency§!, while another brother, §GIsuke Fujieda§!, also a House member, held posts such as §GMinister of Transport§! and §GMinister of Home Affairs§!.\n\nIn §Y1955§!, following the §Yconservative merger§!, he joined the §GLiberal Democratic Party§!.\nThat same year, he was appointed §GDirector-General of the Defense Agency§! in the §YThird Hatoyama Cabinet§!.\n\nHe later served as §GChairman of the LDP Foreign Affairs Research Council§! and §GChairman of the Security Policy Research Council§!.\nPolitically, he adopted a §Ypro-Taiwan§! and §Ypro-Republic of Korea§! stance and was regarded as a §Rhawkish figure§! within the party."
 JAP_LDP_Kishi_Role_tt: "§YNobusuke Kishi§!\n-------------------------------------\n\nIn §YNovember 1954§!, he co-founded the §GJapan Democratic Party§! together with §GIchiro Hatoyama§! and assumed the post of §GSecretary-General§!.\nHaving long advocated a §Ytwo-party system§!, §GNobusuke Kishi§! took the lead, alongside §GIchiro Hatoyama§! and §GMiki Takekichi§!, in promoting the §Yconservative merger§! between the Liberal Party and the Democratic Party.\n\nIn §YOctober 1955§!, the Japan Socialist Party, which had been divided into left and right factions, reunified.\nIn response, a new §GLiberal Democratic Party§! was formed in §YNovember§!.\n§GNobusuke Kishi§! became the §Gfirst Secretary-General§! of the party, while §GIchiro Hatoyama§! assumed the role of §Gfirst Party President§!.\n\nThus, the §Y1955 System§! was established."
 JAP_LDP_Ikeda_Role_tt: "§YHayato Ikeda§!\n-------------------------------------\n\nIkeda enjoyed §Gstrong trust§! from §GShigeru Yoshida§!, and his confidence sometimes bordered on §Yoverconfidence§!, leading to a series of §Rcontroversial remarks§! that stirred public debate.\n\nParticipation in the §Y1955 conservative merger§! would have required the Yoshida faction to bow to figures such as §GTakekichi Miki§!, §GIchiro Kono§!, and §GNobusuke Kishi§!, who supported §GIchiro Hatoyama§!, causing deep hesitation within the Yoshida group.\n\nAlthough Ikeda was a §Rcentral figure in the opposition camp§!, he ultimately made a §Ypragmatic decision§!.\nTogether with senior figures §GJoji Hayashi§! and §GHideji Masutani§!, he unified the Yoshida faction and led it into participation in the §GLiberal Democratic Party§!.\n\nIkeda also urged §GShigeru Yoshida§! to join the party, but this was §Ropposed by Eisaku Sato§!."
 JAP_LDP_Sato_Role_tt: "§YEisaku Sato§!\n-------------------------------------\n\nHe had maintained close personal ties from an early stage with §GShigeru Yoshida§!, to whom he was distantly related.\nIn §Y1948§!, during the §YSecond Yoshida Cabinet§!, he entered the cabinet as §GChief Cabinet Secretary§! despite not being a member of the Diet.\nTogether with §GHayato Ikeda§!, he became a leading figure of the §YYoshida School§!.\n\nAt the time of the §Yconservative merger§! that led to the formation of the Liberal Democratic Party, he followed Yoshida’s decision to §Rrefuse participation in the LDP§!, doing so alongside §YTomisaburo Hashimoto§!.\nIn §Y1957§!, following the retirement of §GIchiro Hatoyama§!, he §Yjoined the Liberal Democratic Party§!.\n\nServing as the §Gright-hand man§! of his elder brother §GNobusuke Kishi§!, he was appointed §GChairman of the LDP General Council§!.\nTogether with §GTakeo Miki§!, who served as §GChairman of the Policy Research Council§!, he played a central role in §Gsupporting the Kishi administration§!."
 JAP_LDP_Tanaka_Role_tt: "§YKakuei Tanaka§!\n-------------------------------------\n\nIn §Y1954§!, Tanaka was appointed §GVice Secretary-General§! of the §YLiberal Party§! led by §GShigeru Yoshida§!.\nHe came to be regarded as one of Yoshida’s close associates, known as the §YYoshida Thirteen§!.\n\nWith the §Yconservative merger§! of §YNovember 1955§!, the Liberal Party joined with the Japan Democratic Party to form the §GLiberal Democratic Party§!, and Tanaka took part in its establishment.\nThereafter, he served in a series of party and parliamentary posts, including §GElection Bureau Director§!, §GLegal Affairs Parliamentary Vice-Minister§!, §GNiigata Prefectural Branch Chairman of the Party General Council§!, §GVice Secretary-General§!, and §GMember of the Judges Impeachment Committee§!."
 JAP_LDP_Miki_Role_tt: "§YTakeo Miki§!\n-------------------------------------\n\nOn §YNovember 15, 1955§! (Showa 30), the §Yconservative merger§! was realized and the §GLiberal Democratic Party§! was formally established.\nAlthough §GMiki§! had continued to §Roppose the conservative merger§!, he ultimately decided to §Yjoin the LDP§!.\n\nAfter entering the party, §GMiki§! came to lead a §Yminor faction§! known as the §YMiki faction§!, composed mainly of former §Yreformist elements of the Kaishinto§! and often referred to as the §Yconservative reformist group§!.\n\nDuring the §Yforced vote§! on the §YJapan–United States Security Treaty§!, §GMiki§! had not been informed in advance of the decision.\nIn protest against the §Rforced passage§!, he §Rwithdrew from the chamber and abstained from voting§! together with §YKono§! and §YIshibashi§!."
 JAP_LDP_Fukuda_Role_tt: "§YTakeo Fukuda§!\n-------------------------------------\n\nLess than §Yone year§! after entering the §YMinistry of Finance§!, he was dispatched to London as a §GFinance Attaché§! to the §YJapanese Embassy in the United Kingdom§!.\nAfter §Ythree and a half years§! of service in Britain, he returned to Japan.\n\nDuring the §Rwartime period§!, he served as a §Yfinancial adviser§! to the §RReorganized National Government of China under Wang Jingwei§!.\n\nHe entered politics after winning a seat in the §Y1952 general election§!.\nActing in close coordination with §GNobusuke Kishi§!, he went on to serve as §GSecretary-General of the Liberal Democratic Party§! and later as §GMinister of Agriculture§! under the §YKishi Cabinet§!."
 JAP_LDP_Ohira_Role_tt: "§YMasayoshi Ohira§!\n-------------------------------------\n\nIn §Y1952§!, at the invitation of §GHayato Ikeda§!, who had been his superior during his time at the §YMinistry of Finance§!, he resigned from the ministry on §YSeptember 5§! and ran in the §YHouse of Representatives election§!.\n\nWhen §GHayato Ikeda§! established the §YKochikai§! faction in §Y1957§!, he naturally rallied to Ikeda’s side.\nAs part of a group of former Ministry of Finance officials led by §GShigezaburo Maeo§!, he became one of Ikeda’s §Ykey policy brains§!.\nTogether with §GKiichi Miyazawa§! and §GYasumi Kurogane§!, he was known as one of Ikeda’s close aides, collectively referred to as the §Ysecretary trio§!."
 JAP_LDP_Nakasone_Role_tt: "§YYasuhiro Nakasone§!\n-------------------------------------\n\nDuring the §Y1955 conservative merger§!, he joined the §YKono faction§! after his long-time associate §GTokutaro Kitamura§! aligned himself with the Kono group, which originated from the §Yformer Hatoyama faction§!.\n\nIn §Y1956§!, he acted energetically as a §Rpro-constitutional revision advocate§!, even releasing a work known as the §YConstitution Revision Song§!, leading the media to label him the §Ryoung military officer§!.\n\nIn his first successful election campaign, he staged a striking performance by riding a §Ywhite-painted bicycle§! adorned with a §YJapanese national flag§!, drawing widespread public attention."
 JAP_LDP_Banboku_Role_tt: "§YBanboku Ono§!\n-------------------------------------\n\nHe was known as a §Yclassic party politician§! and was affectionately referred to as §YBan-chan§!.\nDuring the §Y1955 conservative merger§!, he worked closely with §GMiki Takekichi§! and played a key role in the §Gformation of the Liberal Democratic Party§!.\nFrom §Y1957 onward§!, he served as §GVice President of the Liberal Democratic Party§!.\nHe was regarded as a §Ybackroom power broker§!, a politician skilled at §Ymanipulating factional power relationships§! through behind-the-scenes maneuvering."
 JAP_LDP_Kawashima_Role_tt: "§YShojiro Kawashima§!\n-------------------------------------\n\nHe was often compared to §YJoseph Fouche§!, the French politician of the Napoleonic era, and earned the nickname §Ythe Edo-era Fouche§!.\nAfter the resignation of the Hatoyama Cabinet, he moved decisively in the party leadership race to support the formation of the §GKishi administration§!, and subsequently assumed the post of §GSecretary-General of the Liberal Democratic Party§! under Prime Minister Kishi.\n\nAhead of the §Y1960 Anpo protests§!, Kawashima skillfully contained growing §Rinternal party unrest§! and carefully arranged the §Rforced passage§! of legislation, ultimately §Gprotecting the Kishi government§! until the §Gnew Security Treaty§! was successfully concluded.\n\nAlthough his experience as a cabinet minister was limited to §Yrelatively minor portfolios§!, he continuously held §Gsenior and influential positions§! within the party leadership, moving from one key post to another."
 JAP_LDP_Kono_Role_tt: "§YIchiro Kono§!\n-------------------------------------\n\nAfter working as a §Ynewspaper journalist§!, he became a §GSeiyukai§! member of the House of Representatives in §Y1932§!, and in the postwar period participated in the §Gformation of the Liberal Party§!.\nAs a leading figure of the §Yparty politician faction§! within the §GLiberal Democratic Party§!, he wielded considerable influence, and his political conduct was famously described as §Yunconventional and rule-breaking§!.\n\nUnder the §YSecond Kishi Cabinet§!, he was appointed §GChairman of the LDP General Council§!.\nHowever, after §RPrime Minister Kishi refused to appoint him as Secretary-General§! in §YJune 1959§!, he shifted into the §Ranti-mainstream faction§!.\n\nRegarding the §Yrevision of the Japan-United States Security Treaty§!, he adopted a §Rcritical stance§! toward the Kishi Cabinet.\nDuring the §Rforced vote§! in the House of Representatives, the §YKono faction§! §Yboycotted the session§! together with the §YMiki faction§!."
 JAP_LDP_Shiina_Role_tt: "§YEtsusaburo Shiina§!\n-------------------------------------\n\nIn §YFebruary 1957§!, following the resignation of the §YIshibashi Cabinet§! due to §YPrime Minister Tanzan Ishibashi’s illness§!, the §GFirst Kishi Cabinet§! was formed.\nAlthough he was only a §Yelected member once§!, Shiina was appointed §GDirector of the LDP Accounting Bureau§! after being recognized by §GSecretary-General Shojiro Kawashima§! for his background in the §YMinistry of Commerce and Industry§! and his §Yextensive connections within the industrial sector§!.\n\nAfter Shiina assumed the position of Accounting Bureau Director, §Rcorporate donations§! from the business community to the Liberal Democratic Party expanded significantly, increasing from the former level of §Y200 million yen§! to as much as §R1 billion yen§!."
 JAP_LDP_Suzuki_Role_tt: "§YZenko Suzuki§!\n-------------------------------------\n\nIn §Y1947§!, he ran in the general election as a candidate of the §YJapan Socialist Party§! and won his first seat.\nHowever, through the introduction of his senior compatriot legislator §GSajoki Ozawa§!, he transferred to the §GDemocratic Liberal Party§! led by §GShigeru Yoshida§!, thereafter becoming a §Yconservative politician§!.\n\nFollowing the §Yconservative merger§!, he joined §GHayato Ikeda’s Kochikai§! faction.\nFavored as a §Yclose aide§! by Ikeda, he steadily §Grose through the ranks of national politics§! and consolidated his position within the political establishment."
 JAP_LDP_Maeo_Role_tt: "§YShigesaburo Maeo§!\n-------------------------------------\n\nIn the §Y1949 general election for the House of Representatives§!, he ran as an official candidate of the §GDemocratic Liberal Party§! under the leadership of §GShigeru Yoshida§!.\nWhile those around him promoted Maeo as the §Yfuture Minister of Finance§!, he himself was notably reserved, even at evening gatherings, showing reluctance to pour drinks and embarrassment at wearing flowers on his chest.\nEven after drinking, his speeches showed §Ylittle improvement§!.\n\nAs a member of the §YYoshida School§!, he went on to serve as §GChairman of the Local Administration Committee§! and §GChairman of the Foreign Affairs Committee§! in the House of Representatives.\nIn §Y1957§!, he entered the cabinet as §GMinister of International Trade and Industry§! in the §YFirst Kishi Reshuffled Cabinet§!."
 JAP_LDP_Mizuta_Role_tt: "§YMikio Mizuta§!\n-------------------------------------\n\nIn §Y1953§!, he entered the cabinet for the first time as §GEconomic Planning Agency Director-General§! under the §YFourth Yoshida Cabinet§!.\nWithin the §YLiberal Party§!, he was repeatedly elected as §GChairman of the Policy Research Council§!, establishing himself as a §Ypolicy specialist§!.\n\nFollowing the §Y1955 conservative merger§!, he was appointed the §Gfirst Chairman of the LDP Policy Research Council§!, one of the party’s §Ythree top executive posts§!.\n\nHe later served as §GMinister of International Trade and Industry§! and as a member of the §YIndustrial Planning Council§! under the §YIshibashi Cabinets of 1956 and 1957§!.\nHe continued in the same role as §GMinister of International Trade and Industry§! in the §YFirst Kishi Cabinet§! in §Y1957§!."

