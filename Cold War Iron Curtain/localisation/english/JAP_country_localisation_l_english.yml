 # National Radicalism Category
 JAP_National_Radicalism_Category: "National Radicalism and Unrest Issues"
 JAP_National_Radicalism_GUI_desc: "\n\n\n\n\n£GFX_JAP_National_Radicalism_Category_Banner\n\n\n\n\n\n\nIn the aftermath of the War, Japan was beset by the rise of political extremism. Radicals on the §Rleft (sayoku)§! and §Bright (uyoku)§! challenge the conservative status-quo built during the American Occupation.\n\nThe §RNihon Shakai-to (JSP)§! is the largest leftist force in the country, leading the socialist camp. However, the party often struggles with the internal divisions, as well as having to compete with the dominance of the conservative camp. Despite that, the socialist camp is very effective in giving immense support to the labour unions as well as the §RZengakuren§!, and use them to trouble the conservative administration. On the other hand the radical right are more dissolute, consisting of various §BUyoku Dantai§! (ultra-nationalist groups). There is also the presence of the §BYakuza§! clans, who often use their wealth and power against the far-leftism movements. While ultra-nationalist parties possess minimal influence in the National Diet compared to their socialist counterparts, the increased prominence of far-rightism could potentially give rise to ultra-nationalist factions within the conservative camp.\n\nJapan yearns to follow a stable conservative status quo, and achieve prosperity. But if one side dominates, it could face a significant change in political landscape."
