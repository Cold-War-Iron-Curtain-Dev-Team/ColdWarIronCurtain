 ### GUI Tooltips ###
 JAP_National_Diet_info_text: "§YCabinet Approval Rating§! represents the National Diet's confidence in the current Prime Minister's cabinet. Certain decisions and focuses may require specific minimum amount of '§GApprove§!' percentage to be completed, so it is wise to keep the number up.\n\n§YOverall Public Approval§! represents the entire populace's view of the current government. Like above, certain decisions and focuses may also require a specific minimum approval rating.\n\n§YCabinet Approval Rating§! §Rand§! §YOverall Public Approval§! §Rmay change after the election of a new prime minister.§!\n\n§YHouse of Representatives Composition§! represents the parties present in the Lower House and the number of seats they occupy. §GGreen§! names represent §Ygovernment-affiliated§! or §Yruling-coalition§! parties, §Rred§! names represent §Yopposition§! parties, and 'Others' represents non-affiliated or minor parties.\n\n§YHouse of Representatives Composition§! §Rand§! §YIntra-Party Factions§! §Rexist for the sake of flavour and immersiveness. For now, they do not have any game-affecting mechanic.§!\n\nThroughout the gameplay, you must expect a handful of events and national focuses that will affect the mechanics above in both good or bad way. Be wise of what you do to keep the numbers up!"
