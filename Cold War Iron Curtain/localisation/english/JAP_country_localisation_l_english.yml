 ### National Focus Description ###
 JAP_The_Kishi_Administration_desc: "With Shigeru Yoshida's long dominance finally broken, a harder and more ambitious conservative current rises to power under Nobusuke Kishi. The Kishi Administration seeks not merely stability and recovery, but a reassertion of Japanese political autonomy, stronger state authority, and a more active role in the Cold War order."
 JAP_Establish_Diplomatic_Relations_with_Eastern_Europe_desc: "Kishi's anti-communism does not prevent him from pursuing a pragmatic diplomacy. By opening formal channels to Eastern Europe, Japan may widen its room for maneuver, expand trade, and demonstrate that Tokyo is no mere appendage of Washington."
 JAP_Compensations_for_Vietnam_desc: "War and occupation left deep scars across Asia, and Kishi understands that Japanese influence cannot return without addressing the legacy of empire. Compensation to Vietnam can serve both as restitution and as an opening for renewed economic and political ties."
 JAP_War_Reparations_for_Indonesia_desc: "Indonesia is too important to ignore: rich in resources, strategically placed, and central to Japan's southern economic outreach. Reparations, if handled skillfully, can be transformed from a burden into the foundation of a durable partnership."
 JAP_Pearl_of_Asia_desc: "Kishi dreams of a Japan restored not only in wealth, but in prestige. If Tokyo can lead Asia through commerce, diplomacy, and industrial vitality, the nation may yet reclaim a place of honor as the Pearl of Asia."
 JAP_Ramp_Up_the_Constitutional_Debate_desc: "To Kishi, the postwar constitution remains a symbol of defeat and foreign imposition. By intensifying public and parliamentary debate, his government can prepare the ground for a more sovereign and assertive constitutional order."
 JAP_Overcome_the_Lingering_Legacy_of_the_Occupation_desc: "Though the occupation has formally ended, its legal, political, and psychological imprint still shapes the Japanese state. Kishi intends to strip away those lingering constraints and prove that Japan now governs itself on its own terms."
 JAP_Invest_in_New_Domestic_Destroyers_desc: "A revived maritime arm is essential for any serious national defense policy. Expanding domestic destroyer construction will strengthen Japan's shipyards, deepen military self-reliance, and signal that rearmament is no longer a distant prospect."
 JAP_Request_Release_of_Remaining_War_Criminals_desc: "Many on the right regard the postwar trials as victor's justice rather than impartial law. Pressing for the release of the remaining prisoners would rally nationalist sentiment and underscore Kishi's broader effort to revise the moral legacy of defeat."
 JAP_Five_Million_Nationwide_Membership_Campaign_desc: "Power in postwar Japan is not secured by ideology alone, but by organization. A vast membership campaign can turn conservative sympathy into a disciplined political machine capable of outmatching the left in every prefecture."
 JAP_Push_for_Single_Member_Districts_desc: "Electoral reform offers a path to reshape the battlefield itself. By pushing for single-member districts, Kishi hopes to stabilize conservative rule, weaken factional fragmentation, and reduce the parliamentary leverage of the opposition."
 JAP_Remove_the_Opposition_From_Committee_Chair_Positions_desc: "The opposition has long used procedural footholds within the Diet to obstruct conservative agendas. By stripping them of key committee chairs, Kishi can centralize control and ensure government legislation reaches the floor on his terms."
 JAP_Withdraw_the_Police_Duties_Bill_desc: "Kishi may be forceful, but he is not blind to political reality. If the Police Duties Bill becomes too costly, a tactical withdrawal may preserve the cabinet, calm the streets, and allow the government to fight another day."
 JAP_School_Curriculum_and_Teachers_Efficiency_Rating_System_Reforms_desc: "The classroom is a political arena as much as the Diet. Reforming curricula and tightening oversight of teachers would help conservatives curb left-wing influence, instill civic discipline, and shape the values of a new generation."
 JAP_Take_Control_of_the_M_Fund_desc: "Rumors and intrigue surround the shadowy M-Fund, a reservoir of covert wealth and influence in postwar Japan. If Kishi can bring it under his orbit, he will gain not only money, but an instrument for patronage, manipulation, and political survival."
 
 ### Decisions ###
 JAP_Anpo_Protests_Category: ""
 JAP_Anpo_Protests_Category_desc: "\n\n\n\n\n£GFX_JAP_Anpo_Protests_Category_Banner\n\n\n\n\n\n\nThe revision of the §YUnited States-Japan Security Treaty§! has ignited a storm across the nation. Prime Minister §YNobusuke Kishi§! insists that the new treaty will restore greater equality to the alliance and secure Japan's place within the §GPacific security order§!. To Washington, the agreement represents the consolidation of Japan as a reliable Cold War partner in East Asia.\n\nYet on the streets of Tokyo, a very different vision of Japan is taking shape. Students, labor unions, socialists, intellectuals, and ordinary citizens have gathered in vast numbers, denouncing the treaty as a symbol of §RAmerican military dominance§! and a betrayal of post-war democracy. The memory of war remains fresh, and many fear that the new security arrangement may once again pull Japan into conflicts beyond its shores.\n\nAs demonstrations swell outside the National Diet, the government faces a crisis of legitimacy. The treaty may pass, but the political cost could be severe. Japan's future now stands between §Gsecurity under the American alliance§! and §Rdomestic unrest born from unresolved memories of war§!.\n"

