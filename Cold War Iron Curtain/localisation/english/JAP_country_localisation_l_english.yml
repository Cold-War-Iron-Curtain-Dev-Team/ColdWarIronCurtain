 JAP_RI_Kyosanto_Militants: "Kyosan-to Militants"
 JAP_RI_Uyoku_Dantai_tt: "§YUyoku Dantai (Right-Wing Groups)§!\nContributing to: §BUyoku Unrest§!"
 JAP_RI_Kyosanto_Militants_tt: "§YKyosan-to Militants§!\nContributing to: §RSayoku Unrest§!"
 JAP_RI_Labour_Union_Radicalism_tt: "§YLabour Union Radicalism§!\nContributing to: §RSayoku Unrest§!"
 JAP_RI_Uyoku_Dantai_ttd: "£JAP_Uyoku_Dantai_tt\n\n\n\n\n\n\n\n§YRight-Wing youths attending the 'National Convention to Overthrow Sohyo'§!\n\nDuring the war, the Uyoku Dantai thrived but waned post-Japan's defeat, suppressed by the American Occupation aiming for Japan's democratisation and demilitarisation. This led to a decline in nationalist right-wing forces, but soon replaced by pro-American groups. However, amidst the Cold War's peak and the Americans wishing to uphold Japan as an anti-communist ally, right-wing movements were allowed to resurge, countering the growing leftist unrest. Patriot gatherings emerged, birthing a mixture of pre-war and post-war activist groups. These right-wing groups staunchly oppose leftist radicals, endorse American ties, and advocate Japan's rearmament. Notably, the bōryokudan (violent Yakuza groups) often financially support these factions."
 JAP_RI_Kyosanto_Militants_ttd: "£JAP_Kyosanto_Militants_tt\n\n\n\n\n\n\n\n§YPolice officers raid a Sanson Kōsakutai militant base§!\n\nWith the idea of a 'peaceful revolution' dismissed, the Kyosan-to has now resorted to violence, employing militants to incite a 'nationwide revolution to liberate the Japanese people'. Inspired by Mao Zedong's tactics, they have established numerous militant strongholds in rural villages. While their aim of a nationwide revolution is nothing but a farce, their militant activities still disrupt public peace and stability. Utilising Molotov cocktails and other makeshift weaponry, they frequently target police stations and the residences of right-wing politicians. These militants evidently agitate other left-wing radicals toward violence to varying degrees, so they need to be dealt with as soon as possible."
 JAP_RI_Labour_Union_Radicalism_ttd: "£JAP_Labour_Union_Radicalism_tt\n\n\n\n\n\n\n\n§YLeft-wing labour protest in front of the National Diet building§!\n\nLabour unions in Japan emerged during the industrialisation of the Meiji era, though with limited rights and a weak legal standing. Following the end of the war and Japan's democratisation efforts, these unions gained the freedom to collectively strike and bargain for their rights. However, this transition also ushered in a notable left-wing sentiments within these unions, frequently bolstered by support from leftist radical factions and political parties, alongside the prominence of influential far-left labor union figures. Such unions frequently engage in protests and strikes against governmental initiatives that go against their leftist ideology, even resorting to militancy in extreme circumstances."


