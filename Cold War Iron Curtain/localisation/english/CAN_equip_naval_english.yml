 #Battleship/Battlecruiser Hulls in research tree#
 #Carrier Hulls in research tree#

 CAN_carrier_hull_light_0:0 "Majestic/Colossus Class"
 CAN_carrier_hull_light_1:0 "Majestic/Colossus Class Refit"
 CAN_carrier_hull_light_2:0 "Invincible Class"
 CAN_carrier_hull_light_3:0 "Wasp Class"
 CAN_carrier_hull_light_4:0 "Mistral Class"
 CAN_carrier_hull_light_0_desc:0 "The 1942 Design Light Fleet Carrier, commonly referred to as the British Light Fleet Carrier, was a light aircraft carrier design created by the Royal Navy during the Second World War, and used by eight naval forces between 1944 and 2001. They were designed and constructed by civilian shipyards to serve as an intermediate step between the expensive, full-size fleet aircraft carriers and the less expensive but limited-capability escort carriers."
 CAN_carrier_hull_light_1_desc:0 "In the mid 1960s, Royal Canadian Estimates called for a major refit of the Majestic/Colossus Class carriers in service. This refit however would be plagued by cost overruns and delays due to issues that had existed from their initial construction. It would be finished both behind schedule, and above it's initial budget."
 CAN_carrier_hull_light_2_desc:0 "The Invincible class was a class of light aircraft carrier operated by the Royal Navy. The vessels were built as aviation-capable anti-submarine warfare (ASW) platforms to counter the Cold War North Atlantic Soviet submarine threat, and initially embarked Sea Harrier aircraft and Sea King HAS.1 anti-submarine helicopters."
 CAN_carrier_hull_light_3_desc:0 "The Wasp class is a class of landing helicopter dock (LHD) amphibious assault ships operated by the United States Navy. Based on the Tarawa class, with modifications to operate more advanced aircraft and landing craft."
 CAN_carrier_hull_light_4_desc:0 "The Amphibious Assault Ship Project was a proposed project by the Canadian Government for the Royal Canadian Navy developed from the Joint Support Ship Project, that would have seen Canada procure 3 Mistral Class Amphibious Assault Ships."

 CAN_carrier_hull_0:0 "Implacable Class"
 CAN_carrier_hull_1:0 "Audacous Class"
 CAN_carrier_hull_2:0 "Forrestal Class"
 CAN_carrier_hull_3:0 "Audacious Class Refit"
 CAN_carrier_hull_4:0 "Queen Elizabeth Class"
 CAN_carrier_hull_0_desc:0 "The Implacable-class aircraft carrier consisted of two aircraft carriers built for the Royal Navy during World War II. Derived from the design of the Illustrious class, they were faster and carried more aircraft than the older ships. They were initially assigned to the Home Fleet when completed in 1944 and attacked targets in Norway as well as the German battleship Tirpitz. Subsequently, they were assigned to the British Pacific Fleet (BPF)."
 CAN_carrier_hull_1_desc:0 "The Audacious-class aircraft carriers were a class of aircraft carriers proposed by the British government in the 1930s - 1940s and completed after the Second World War. The two ships built were heavily modified and diverged over their service lives."
 CAN_carrier_hull_2_desc:0 "The Forrestal-class aircraft carriers were four aircraft carriers designed and built for the United States Navy in the 1950s. The class ship was named for James Forrestal, the first United States Secretary of Defense. It was the first class of supercarriers, combining high tonnage, deck-edge elevators and an angled deck. The first ship was commissioned in 1955, the last decommissioned in 1998."
 CAN_carrier_hull_3_desc:0 "As the builds of Audacious (renamed Eagle) and Irresistible (renamed Ark Royal) progressed they differed so much that they effectively became the lead (and sole) ships of each of their own classes. They formed the backbone of the postwar carrier fleet, and were much modified."
 CAN_carrier_hull_4_desc:0 "The Queen Elizabeth class is a class of two aircraft carriers of the United Kingdom's Royal Navy which are the central components of the UK Carrier Strike Group."

CAN_carrier_hull_super_1:0 "Kitty Hawk Class"
CAN_carrier_hull_super_2:0 "Nimitz Class"
CAN_carrier_hull_super_3:0 "Theodore Roosevelt Class"
CAN_carrier_hull_super_4:0 "Ronald Reagan Class"
CAN_carrier_hull_super_1_desc:0 "The introduction of the nuclear age and the adoption of smaller navalize reactors allows these large vessels not only to carry large air wings but also lets them stay at sea almost indefinitly."
CAN_carrier_hull_super_2_desc:0 "An updated super carrier design with more efficient reactors and the capability to carry even more aircraft."
CAN_carrier_hull_super_3_desc:0 "An advanced late Cold War era super carrier design with a massive complement of aircraft and improved reactors."
CAN_carrier_hull_super_4_desc:0 "A modern super carrier design with further improved reactors, a massice complement of aircraft and the capability to launch them quickly and effectively by utilizing improved catapults."

# Submarine Hulls #

  CAN_sub_small_single_0:0 "Tench Class"
  CAN_sub_small_single_1:0 "Oberon Class"
  CAN_sub_small_single_2:0 "Oberon Class SOUP Refit"
  CAN_sub_small_single_3:0 "Upholder/Victoria Class"
  CAN_sub_small_single_4:0 "Victoria Class CWP Refit"
  CAN_sub_small_single_0_desc:0 "Tench-class submarines were a type of submarine built for the United States Navy (USN) between 1944 and 1951. They were an improvement over the Gato and Balao classes, only about 35 to 40 tons larger, but more strongly built and with a slightly improved internal layout. Post-war, a Tench Class would be transferred to Canada as a replacement for the Balao that was in service at the time."
  CAN_sub_small_single_1_desc:0 "The Oberon class was a ship class of 27 British-designed submarines operated by five different nations. They were designed as a direct follow-on from the Porpoise class, physical dimensions were the same, but stronger materials were used in hull construction, and updated equipment was fitted."
  CAN_sub_small_single_2_desc:0 "In the 1970's, Canada's Oberon Class Submarines had become obsolete and in need of update. The Submarine Operational Update Program (SOUP) was developed to deal with the operational capability of the submarines, updating its Communications and Fire Control System, modernizing its armament, sonars and periscopes."
  CAN_sub_small_single_3_desc:0 "The Upholder/Victoria-class submarines, also known as the Type 2400 (due to their displacement of 2,400 tonnes), are the class of the diesel-electric submarines that were built in the United Kingdom in the 1980s to supplement the nuclear submarines served in the Submarine Service of the British Royal Navy."
  CAN_sub_small_single_4_desc:0 "Upon acquiring the Upholder/Victoria Class submarines, the Royal Canadian Navy suggested that the subs would be operational by the year 2000. Each submarine would undergo a 6-month Canadian Work Period (CWP), where Canadian communications, and fire control systems would be installed."

  CAN_sub_hull_large_single_0:0 "Balao Class"
  CAN_sub_hull_large_single_1:0 "Valiant Class"
  CAN_sub_hull_large_single_2:0 "Churchill Class"
  CAN_sub_hull_large_single_3:0 "Rubis Class"
  CAN_sub_hull_large_single_4:0 "Canada Class"
  CAN_sub_hull_large_single_0_desc:0 "The Balao Class was a design of US Navy Submarines that was used during WWII and onwards. An improvement on the earlier Gato Class, the boats had only slight internal differences. Canada in 1961 would acquire a Balao class submarine on a 5-year lease from the US Navy which would later be extended."
  CAN_sub_hull_large_single_1_desc:0 "The Valiant class were a class of nuclear-powered fleet submarines in service with the Royal Navy from the mid-1960s until 1994. They were the first fully British nuclear fleet submarine; the earlier HMS Dreadnought used an American nuclear reactor."
  CAN_sub_hull_large_single_2_desc:0 "The three Repeat Valiant-class submarines, sometimes known as the Churchill class, were nuclear-powered fleet submarines which served with the Royal Navy from the 1970s until the early 1990s. The Churchill class was based on the older Valiant class, but featured many internal improvements."
  CAN_sub_hull_large_single_3_desc:0 "The Rubis class is a series of nuclear-powered attack submarines operated by the French Navy. The class comprises six vessels and they are the most compact nuclear attack submarines to date. These submarines would later serve as an option for Canada's proposed Canada Class Nuclear Submarine, competing with the British Trafalgar Class."
  CAN_sub_hull_large_single_4_desc:0 "The Canada Class was a proposed class of nuclear-powered attack submarines to be built for the Royal Canadian Navy. Announced in 1987, the class was intended to provide the RCN with a method for monitering the Arctic, and establishing Candaian sovereignty in the area. By 1988, the RCN was looking at purchasing either the French Rubis Class, or the British Trafalgar Class, both with their own strengths and drawbacks."

  CAN_sub_hull_large_double_0:0 "Dreadnought Class"
  CAN_sub_hull_large_double_1:0 "Resolution Class"
  CAN_sub_hull_large_double_2:0 "Resolution Class Refit"
  CAN_sub_hull_large_double_3:0 "Vanguard Class"
  CAN_sub_hull_large_double_0_desc:0 "The seventh HMS Dreadnought was the United Kingdom's first nuclear-powered submarine, built by Vickers Armstrongs at Barrow-in-Furness. Launched by Queen Elizabeth II on Trafalgar Day 1960 and commissioned into service with the Royal Navy in April 1963, she continued in service until 1980."
  CAN_sub_hull_large_double_1_desc:0 "The Resolution class was a class of four nuclear ballistic missile submarines (SSBN) built for the Royal Navy as part of the UK Polaris programme. Each submarine was armed with up to 16 UGM-27 Polaris A-3 nuclear missiles."
  CAN_sub_hull_large_double_2_desc:0 "The Resolution class was a class of four nuclear ballistic missile submarines (SSBN) built for the Royal Navy as part of the UK Polaris programme. Each submarine was armed with up to 16 UGM-27 Polaris A-3 nuclear missiles."
  CAN_sub_hull_large_double_3_desc:0 "The Vanguard class is a class of nuclear-powered ballistic missile submarines (SSBNs) in service with the Royal Navy. The class was introduced in 1994 as part of the Trident nuclear programme."

# Screen Hulls #

CAN_screen_hull_medium_0:0 "River/Prestonian Class"
CAN_screen_hull_medium_1:0 "St Laurent/Restigouche Class"
CAN_screen_hull_medium_2:0 "St Laurent/Restigouche Class Refits"
CAN_screen_hull_medium_3:0 "St Laurent/Restigouche Class DELEX Refit"
CAN_screen_hull_medium_4:0 "Halifax Class"
CAN_screen_hull_medium_0_desc:0 "The River Class frigate was a class of frigate launched between 1941 and 1944 for use as anti-submarine escorts in navies across the commonweatlh. In Canadian service, they primarily escorted convoys across the Atlantic. Post-war, many of these ships would be modernized and refitted, with the superstructure being rebuilt, its armament improved and modernized, becoming the Prestonian Class."
CAN_screen_hull_medium_1_desc:0 "The St Laurent Class Destroyer was a class of Destroyer Escort that would serve the Royal Canadian Navy in an ASW mission role. As the construction and design of the St Laurent Class hit delays, the remaining ships in the class would be redisngated as the Restigouche Class, taking into account design improvements, diverging more and more from the original class."
CAN_screen_hull_medium_2_desc:0 "The advent of new, nuclear-powered attack submarines forced the RCN to assess the threats that they posed. This led to refits of the St Laurent and Restigouche Class. The St Laurents would be converted to Helicopter Carrying Destroyer Escorts (DDH), while the Restigouche Class underwent it's own refits (IRE) upgrading its anti-submarine capabilities, modernizing their sonar and a new mast."
CAN_screen_hull_medium_3_desc:0 "The Destroyer Life Extension (DELEX) refits was a program to modernize and refit Canada's existing Destroyer Escorts. For the Restigouche & Mackenzie Class, this meant updating their sensor, weapon and communications systems. For the St Laurent & Annapolis Class, this meant new tactical data system, new sonar arrays, and new radar and torpedoes, with only minor hull and machinery repairs for the St Laurents."
CAN_screen_hull_medium_4_desc:0 "The Halifax (City) Class Patrol Frigate was a class multi-role patrol frigate for the Royal Canadian Navy in commission since 1992. Canadian designed and built, these vessels would possess traditional anti-submarine capabilities with systems to deal with surface and air threats as well."

CAN_screen_hull_heavy_0:0 "Tribal Class Refit"
CAN_screen_hull_heavy_1:0 "County Class"
CAN_screen_hull_heavy_2:0 "Iroquois Class"
CAN_screen_hull_heavy_3:0 "Iroquois Class TRUMP Refit"
CAN_screen_hull_heavy_4:0 "Type 45 Daring Class"
CAN_screen_hull_heavy_0_desc:0 "Post war, survivors of the class would meet different fates with many being refitted and modernized primarily for anti-submarine destroyers. Canadian Tribals would improve their anti-air capabilities, their sensors and anti-submarine weapons allowing these ships to serve until the 1960s."
CAN_screen_hull_heavy_1_desc:0 "The County class was a class of British guided missile destroyers, the first such warships built by the Royal Navy. Designed specifically around the Seaslug anti-aircraft missile system, the primary role of these ships was area air defence around the aircraft carrier task force in the nuclear-war environment."
CAN_screen_hull_heavy_2_desc:0 "The Iroquois Class, or DDG-280 Class, were a class of helicopter-carrying guided missile destroyers of the Royal Canadian Navy. The Iroquois class are notable as the first all-gas turbine powered ships of this type. Launched in the 1970s, they were originally fitted out for anti-submarine warfare using CH-124 Helicopters, and Sea Sparrow Anti-air missiles for air defence."
CAN_screen_hull_heavy_3_desc:0 "In the 1980s, with the planned arrival of the Canadian Patrol Frigate Project, the Canadian Forces intended to convert the Iroquois class from primarily ASW ships to anti-air warfare (AAW) vessels as a core element of the modernisation of the fleet. Named the Tribal Refit and Update Modernization Program (TRUMP), these destroyers saw their cruise turbines, weaponry and electronics modernized and refitted."
CAN_screen_hull_heavy_4_desc:0 "The Type 45 destroyer, also known as the D or Daring class, is a class of guided missile destroyers built for the United Kingdom's Royal Navy in the early 21st century. The class is primarily designed for anti-aircraft and anti-missile warfare and is built around the PAAMS (Sea Viper) air-defence system utilising the SAMPSON AESA and the S1850M long-range radars."

CAN_battle_hull_light_0:0 "Minotaur Class"
CAN_battle_hull_light_1:0 "Tiger Class"
CAN_battle_hull_light_2:0 "Tiger Class Refit"
CAN_battle_hull_light_3:0 "Ticonderoga Class Flight I"
CAN_battle_hull_light_4:0 "Ticonderoga Class Flight II"
CAN_battle_hull_light_0_desc:0 "The Minotaur class, or Design Z, was a proposed class of light cruisers planned for the British Royal Navy shortly after the Second World War. Design Z had several proposed configurations with differing armament and propulsion arrangements."
CAN_battle_hull_light_1_desc:0 "The Tiger class were a class of three British warships of the 20th century and the last all-gun cruisers of the Royal Navy. Construction as Minotaur-class cruisers began during World War II but due to post-war austerity, the Korean War and Churchill favouring nuclear weapons and aircraft over the surface fleet, the hulls remained unfinished."
CAN_battle_hull_light_2_desc:0 "By 1964 the Conservative Government and half the naval staff saw the Tigers as no longer affordable or credible in the surface combat or fleet air defence role and would have preferred to decommission them but given they were technically only three years old and built at immense expense, scrapping them was politically difficult. They approved conversion into helicopter carriers; carrying Westland Wessex helicopters for Royal Marine Commando operations. A large hangar replaced the 'Y' turret, the forward turrets were retained for gunfire support and anti-surface work."
CAN_battle_hull_light_3_desc:0 "The Ticonderoga class of guided-missile cruisers is a class of warships in the United States Navy, first ordered and authorized in the 1978 fiscal year. The class uses passive phased-array radar and was originally planned as a class of destroyers. However, the increased combat capability offered by the Aegis Combat System and the AN/SPY-1 radar system, together with the capability of operating as a flagship."
CAN_battle_hull_light_4_desc:0 "The Ticonderoga class of guided-missile cruisers is a class of warships in the United States Navy, first ordered and authorized in the 1978 fiscal year. The class uses passive phased-array radar and was originally planned as a class of destroyers. However, the increased combat capability offered by the Aegis Combat System and the AN/SPY-1 radar system, together with the capability of operating as a flagship."

