l_english:
 flavormedia.1.t:0 "[GetNewspaperHeader]MTV"
 flavormedia.1.d:0 "MTV has gone on the air in America. The channel is music videos, all day and all night."
 flavormedia.1.a:0 "The videos are on."
 flavormedia.1.b:0 "America has a music channel."
 flavormedia.2.t:0 "[GetNewspaperHeader]WrestleMania"
 flavormedia.2.d:0 "The first WrestleMania has filled Madison Square Garden. Professional wrestling has been staged as a national show."
 flavormedia.2.a:0 "The Garden is full."
 flavormedia.2.b:0 "Wrestling has a spectacle."
 flavormedia.3.t:0 "[GetNewspaperHeader]The Simpsons"
 flavormedia.3.d:0 "The Simpsons has premiered as a series of its own. The cartoon family now has a place in prime time."
 flavormedia.3.a:0 "They have their own show."
 flavormedia.3.b:0 "A cartoon family is on television."
 flavormedia.4.t:0 "[GetNewspaperHeader]Friends"
 flavormedia.4.d:0 "Friends has premiered on American television. The show is six young people sharing their lives in New York."
 flavormedia.4.a:0 "The show is on."
 flavormedia.4.b:0 "A new comedy is on."
