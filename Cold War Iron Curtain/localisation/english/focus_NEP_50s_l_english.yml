 NEP_bop_desc_rana_shah:0 "The oligarchic Rana ministers and the Shah Palace vie for primacy over the state. The Ranas hold the machinery of government through patronage and precedent, while the monarchy maneuvers to reclaim direct authority. Courtiers, officers, and financiers pick sides as appointments and decrees become weapons."

 NEP_bop_desc_shah_dem:0 "With the Rana grip loosened, the struggle pivots to a contest between the Palace and the democratic opposition. The monarchy promises order and continuity under a constitutional veneer; reformists press for accountable rule, independent courts, and fiscal transparency. Every concession reshapes the balance."

 NEP_bop_desc_shah_cpn:0 "The Shah Crown confronts a mobilized communist movement. Royal decrees concentrate power to suppress radical organization, while the left channels unrest over land, wages, and elite privilege. Stability and modernization clash with calls for social revolution and the dismantling of feudal structures."

 NEP_bop_desc_dem_cpn:0 "The democratic bloc and the communists compete to define Nepal’s future after autocracy. Moderates push elections, civil liberties, and gradual reform; the left demands mass mobilization, land redistribution, and the end of oligarchic finance. Strikes, rallies, and cabinet crises set the tempo."

 NEP_bop_desc_rana_dem:0 "The entrenched Rana network faces a surging democratic opposition. Patronage and administrative control defend the old order, but reformists organize teachers, merchants, and junior officers. Each ministry pried open weakens noble privilege and rewires credit, contracts, and careers."

 # (Optional, in case you later add it)
 NEP_bop_desc_rana_cpn:0 "The Rana oligarchy braces against communist agitation across factories and villages. Censorship and arrests tighten, yet clandestine committees spread through guilds and garrisons. The question is whether patronage and police power can contain a program of total social transformation."

 # --- Convenience label (if you want to preview current pair as a line) ---
 NEP_bop_current_pair_line:0 "Current Contest: §Y[GetNEP_BOP_LeftName]§! vs §Y[GetNEP_BOP_RightName]§!"

 NEP_shah_monarchy_tt:0 "§YThe Shah Monarchy§! represents the authority of the royal court, the palace, and the political influence exercised in the name of the king. Though constrained for much of the 1950s, it remains one of the central forces in Nepalese politics.\n\nCurrent Influence: §Y[?ROOT.NEP_shah_monarchy_percent|0]%§!"
 NEP_rana_tt:0 "§YThe Rana§! represents the entrenched aristocratic order that dominated Nepal for generations through hereditary office, patronage, and control of the state. Even in decline, Rana influence remains deeply rooted in the kingdom’s political structure.\n\nCurrent Influence: §Y[?ROOT.NEP_rana_percent|0]%§!"
 NEP_nepali_congress_tt:0 "§YNepali Congress§! represents the main parliamentary and democratic reform movement in Nepal, advocating constitutional government, civil participation, and the dismantling of oligarchic rule. It is the most significant organized civilian challenger to the old order.\n\nCurrent Influence: §Y[?ROOT.NEP_nepali_congress_percent|0]%§!"
 NEP_tanka_prasad_singh_faction_tt:0 "§YTanka Prasad Singh Faction§! represents the followers, allies, and political current surrounding Tanka Prasad Singh, combining nationalist politics, personal influence, and maneuvering within Nepal’s unstable transitional system.\n\nCurrent Influence: §Y[?ROOT.NEP_tanka_prasad_singh_faction_percent|0]%§!"
 NEP_gorkha_nationalist_tt:0 "§YGorkha Nationalists§! represents hardline nationalist elements hostile to foreign influence and committed to a more assertive, centralized, and militant vision of Nepalese sovereignty. Their strength often rises in times of instability and political frustration.\n\nCurrent Influence: §Y[?ROOT.NEP_gorkha_nationalist_percent|0]%§!"
 NEP_communist_party_nepal_tt:0 "§YCommunist Party of Nepal§! represents the kingdom’s communist movement, whose influence is still limited in the 1950s but capable of expanding through unrest, class grievance, and discontent with the existing political order.\n\nCurrent Influence: §Y[?ROOT.NEP_communist_party_nepal_percent|0]%§!"

 NEP_indian_influence_tt:0 "§YIndian Influence§! represents the political, economic, and strategic pressure exerted by India on Nepal. Through diplomatic ties, trade dependencies, and support for democratic forces, India seeks to maintain Nepal within its sphere of influence and prevent hostile powers from gaining a foothold in the Himalayan region."
 NEP_chinese_influence_tt:0 "§YChinese Influence§! represents the growing presence and strategic interest of China in Nepal. Seeking to counter Indian dominance and expand its regional influence, China supports alternative political forces and promotes closer ties, particularly in periods of instability or anti-Indian sentiment within the kingdom."

 NEP_indian_sphere_tt:0 "§YIndian Sphere of Influence§! represents Nepal’s alignment with India’s regional order. Political, economic, and strategic ties bind the kingdom closely to New Delhi, strengthening pro-Indian currents while limiting the room for rival external powers to intervene."
 NEP_chinese_sphere_tt:0 "§YChinese Sphere of Influence§! represents Nepal’s alignment with China’s expanding regional presence. Support from Beijing strengthens anti-Indian and radical political tendencies while drawing the kingdom more firmly into China’s strategic orbit."
 NEP_foreign_neutral_tt:0 "§YIndependent Foreign Policy§! represents Nepal maintaining a position outside the direct sphere of either India or China. While this preserves autonomy, it also leaves the kingdom more exposed to diplomatic pressure, internal rivalry, and sudden shifts in the regional balance."

 NEP_stability_green_tt:0 "§GStable Political Balance§!\n\nNepal’s political system is currently stable, with one faction maintaining a clear and uncontested lead. Internal tensions are limited, and the risk of immediate crisis is low. While rival factions remain active, they lack the strength to seriously challenge the existing balance of power."
 NEP_stability_yellow_tt:0 "§YFragile Political Balance§!\n\nNepal’s political system is increasingly strained, with multiple factions competing for influence. No single force has fully consolidated control, and political tensions are rising. While the situation remains manageable, continued rivalry or sudden shifts in influence could destabilize the government."
 NEP_stability_red_tt:0 "§RPolitical Crisis§!\n\nNepal’s political system is in crisis, with competing factions locked in a struggle for power. No faction has secured dominance, and instability threatens to spiral into direct confrontation. Without decisive action, the current balance is unlikely to hold, and a major political upheaval is imminent."

