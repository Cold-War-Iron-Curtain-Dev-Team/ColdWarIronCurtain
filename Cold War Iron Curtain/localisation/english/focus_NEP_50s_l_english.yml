 NEP_Factional:0 "Factional Politics in Nepal"
 NEP_Factional_desc:0 "Nepal in the 1950s is defined not by a unified political direction, but by a fragile balance between competing forces. The legacy of the Rana oligarchy continues to shape the state, even as the Shah monarchy seeks to reassert its authority. Emerging political movements such as the Nepali Congress and the followers of Tanka Prasad Singh challenge the old order, while nationalist and communist elements grow in influence beneath the surface. At the same time, Nepal’s position between India and China exposes it to external pressures that further complicate its internal dynamics. The stability of the state depends on maintaining a delicate equilibrium among these factions, as any shift in power risks triggering a wider political crisis that could redefine the future of the kingdom."

