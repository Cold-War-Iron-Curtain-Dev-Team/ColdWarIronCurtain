 nep_pajani_init_baseline_tt:0 "§YInitialize the Pajani Patronage System§!\nEstablishes baseline noble control over the bureaucracy and financial networks, applying the §YPajani Patronage§! dynamic modifier."
 nep_pajani_increase_one_step_tt:0 "§YTighten Pajani Patronage§!\nIncreases noble control over the bureaucracy and credit markets.\n\n§G−1 pp§! to corporate and upper-class tax rates\n§G−1 pp§! to wages and workforce efficiency\n§R+1%§! to consumer goods and public spending burdens"
 nep_pajani_reduce_one_step_tt:0 "§YLoosen Pajani Patronage§!\nReforms weaken noble patronage and strengthen fiscal independence.\n\n§G+1 pp§! to corporate and upper-class tax rates\n§G+1 pp§! to wages and workforce efficiency\n§R−1%§! to consumer goods and public spending burdens"
