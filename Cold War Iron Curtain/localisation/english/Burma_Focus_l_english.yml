 #Burma Historical 50s
 MYR_The_U_Nu_Era_desc:0 "U Nu presides over a Union beset by armed rebellion and divisions within the Anti-Fascist People's Freedom League. The alliance that won independence contains rival socialist factions, while the prime minister's Buddhist convictions raise difficult questions about the place of other faiths. Consolidating his government's authority will give it the political means to address these disputes."
 MYR_Enforce_Theravada_Buddhism_desc:0 "U Nu regards the Buddhist faith as a source of moral authority for public life. Giving Theravada Buddhism the standing of a state religion will rally support among the Buddhist majority and strengthen the government's position. Muslim communities in northern Arakan and Karen who fear religious discrimination will have less reason to trust Rangoon."
 MYR_Permit_Religious_Freedom_desc:0 "The Union cannot demand the loyalty of its citizens while making their faith a test of belonging. Explicit protection for religious freedom will reassure Muslim communities in northern Arakan and improve relations with the Karen. Buddhist nationalists will resist the concession, and the government must accept some immediate unrest."
 MYR_Accept_the_AFPFL_Schisms_desc:0 "The AFPFL's wartime unity conceals rival party organizations and competing claims to the socialist programme. Recognizing these divisions will allow U Nu to negotiate openly with the factions rather than spend his authority maintaining a pretence of unanimity. The admission will unsettle the alliance, but give the government greater freedom to choose its partners."
 MYR_Purge_Marxist_Elements_desc:0 "The communist revolt has sharpened the dispute over Marxist influence within the independence movement. The government will remove organizers who place communist allegiance above the AFPFL leadership, while retaining its own commitment to socialism. Weakening these networks will reduce communist support and consolidate the cabinet's authority."
 MYR_Back_the_Educated_Socialists_desc:0 "The faction known within the Socialist Party as the educated socialists favours development directed through the ministries and informed by technical expertise. Giving its programme the government's backing will strengthen the planners' position within the AFPFL. Burma can then begin preparing the Pyidawtha Plan, drawing on foreign consultants as well as Burmese officials."
 MYR_Back_the_Uneducated_Socialists_desc:0 "The faction disparaged as the uneducated socialists draws its authority from party organization rather than academic qualifications. Its advocates demand that cultivators receive tangible benefits from independence instead of waiting upon elaborate development schemes. Government backing will broaden support for socialism and permit a more radical agrarian programme in place of the Pyidawtha approach."
 MYR_Formalize_AFPFL_Socialism_desc:0 "The removal of communist rivals leaves the AFPFL responsible for explaining what its own socialism entails. A common programme should commit the alliance to public direction of development and relief for working people within parliamentary government. Giving these principles formal standing will strengthen socialist support and reduce uncertainty over the cabinet's course."
 MYR_Tolerate_the_Peoples_Democratic_Front_desc:0 "The People's Democratic Front brings communist insurgents together with other armed opponents of Rangoon. The government can tolerate political contacts with the front and leave room for an accommodation, without accepting its claim to speak for the Union. This concession will improve communist willingness to negotiate and ease the wider conflict, but provoke opposition among those demanding an uncompromising military campaign."
 MYR_Ease_the_Quadrumvirate_Tensions_desc:0 "U Nu, Ba Swe, Kyaw Nyein and Thakin Tin share influence over the AFPFL without agreeing on how that influence should be exercised. Disputes over party appointments and the direction of government threaten to turn their rivalry into open obstruction. A negotiated understanding among the four leaders will steady the administration and restore authority to the cabinet."
 MYR_Improve_Agricultural_Production_desc:0 "With the agrarian faction ascendant, the government can make increased cultivation the first charge upon its development policy. District authorities will identify land and sites for the works needed to support rural production. Opening room for development across the Union's established territory will give cultivators greater confidence in the new programme."
 MYR_Enforce_Radical_Land_Reform_desc:0 "The agrarian socialists propose to break the landlords' hold over cultivation through compulsory redistribution. Enforcing their programme will strengthen the governing faction and address grievances shared by many communist supporters, making accommodation with Rangoon more attractive. Confiscation and contested land claims will nevertheless disturb public order."
 MYR_Disband_Western_Universities_desc:0 "Radicals within the agrarian faction accuse Western-style universities of preserving the social privileges of colonial rule. They propose to dissolve these institutions and bring their educational work under arrangements answerable to the party. The measure will strengthen the faction and its socialist appeal, while provoking resistance from students and teachers."
 MYR_Promote_Agricultural_Cooperatives_desc:0 "Land redistribution must be followed by arrangements that let small cultivators process and market their crops. Government-sponsored cooperatives can pool resources for machinery and establish workshops serving the surrounding farms. This investment will expand civilian industry and give rural communities a firmer stake in the agrarian settlement."
 MYR_Collectivize_the_Plantations_desc:0 "The agrarian faction proposes to place plantation estates under collective management and direct their produce through a common purchasing organization. Processing works in the capital will give the scheme an industrial outlet and expand civilian production. The compulsory transfer of management will bring further disruption as owners and workers contest the new arrangements."
 MYR_Expand_the_Irrigation_Systems_desc:0 "The radical programme will achieve little if cultivators remain dependent on neglected waterworks and unreliable access to their fields. The government will extend irrigation channels and the roads needed to maintain them throughout the Union's established territory. These works will improve the infrastructure upon which rural production depends."
 MYR_Seize_Minority_Lands_desc:0 "The agrarian leadership proposes to extend confiscation into minority communities, placing landholding under Burmese officials and party committees. Seizing these holdings will strengthen the government's political position and impose Bamar administrative practices more widely. The policy will alienate the affected peoples and intensify the struggle against Rangoon."
 MYR_Form_Youth_Labour_Organizations_desc:0 "The agrarian programme requires labour that district authorities cannot obtain through ordinary contracts alone. Party-sponsored youth organizations will supply work parties for rural roads and prepare additional recruits for national service. Their mobilization will improve local communications and enlarge the government's available manpower."
 MYR_Economic_Self_Reliance_desc:0 "The agrarian faction seeks to reduce dependence on foreign capital by directing domestic resources through its own development organizations. A state arms works in the capital will extend this policy to the supply of the armed forces. Consolidating the programme will strengthen the government's authority and reassure its supporters that their reforms have a durable place in the national economy."
 MYR_The_Pyidawtha_Plan_desc:0 "With the educated socialists backing the cabinet, U Nu can commission a comprehensive programme of reconstruction and development. Burmese officials will work with foreign engineers and economic consultants to prepare proposals for industry and public services. Their deliberations will begin the Pyidawtha Plan, whose ambitions must be measured against the resources of a country still at war."
