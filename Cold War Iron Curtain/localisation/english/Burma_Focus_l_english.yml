 #Burma Historical 50s
 MYR_The_U_Nu_Era_desc:0 "U Nu presides over a Union beset by armed rebellion and divisions within the Anti-Fascist People's Freedom League. The alliance that won independence contains rival socialist factions, while the prime minister's Buddhist convictions raise difficult questions about the place of other faiths. Consolidating his government's authority will give it the political means to address these disputes."
 MYR_Enforce_Theravada_Buddhism_desc:0 "U Nu regards the Buddhist faith as a source of moral authority for public life. Giving Theravada Buddhism the standing of a state religion will rally support among the Buddhist majority and strengthen the government's position. Muslim communities in northern Arakan and Karen who fear religious discrimination will have less reason to trust Rangoon."
 MYR_Permit_Religious_Freedom_desc:0 "The Union cannot demand the loyalty of its citizens while making their faith a test of belonging. Explicit protection for religious freedom will reassure Muslim communities in northern Arakan and improve relations with the Karen. Buddhist nationalists will resist the concession, and the government must accept some immediate unrest."
 MYR_Accept_the_AFPFL_Schisms_desc:0 "The AFPFL's wartime unity conceals rival party organizations and competing claims to the socialist programme. Recognizing these divisions will allow U Nu to negotiate openly with the factions rather than spend his authority maintaining a pretence of unanimity. The admission will unsettle the alliance, but give the government greater freedom to choose its partners."
 MYR_Purge_Marxist_Elements_desc:0 "The communist revolt has sharpened the dispute over Marxist influence within the independence movement. The government will remove organizers who place communist allegiance above the AFPFL leadership, while retaining its own commitment to socialism. Weakening these networks will reduce communist support and consolidate the cabinet's authority."
 MYR_Back_the_Educated_Socialists_desc:0 "The faction known within the Socialist Party as the educated socialists favours development directed through the ministries and informed by technical expertise. Giving its programme the government's backing will strengthen the planners' position within the AFPFL. Burma can then begin preparing the Pyidawtha Plan, drawing on foreign consultants as well as Burmese officials."
 MYR_Back_the_Uneducated_Socialists_desc:0 "The faction disparaged as the uneducated socialists draws its authority from party organization rather than academic qualifications. Its advocates demand that cultivators receive tangible benefits from independence instead of waiting upon elaborate development schemes. Government backing will broaden support for socialism and permit a more radical agrarian programme in place of the Pyidawtha approach."
 MYR_Formalize_AFPFL_Socialism_desc:0 "The removal of communist rivals leaves the AFPFL responsible for explaining what its own socialism entails. A common programme should commit the alliance to public direction of development and relief for working people within parliamentary government. Giving these principles formal standing will strengthen socialist support and reduce uncertainty over the cabinet's course."
 MYR_Tolerate_the_Peoples_Democratic_Front_desc:0 "The People's Democratic Front brings communist insurgents together with other armed opponents of Rangoon. The government can tolerate political contacts with the front and leave room for an accommodation, without accepting its claim to speak for the Union. This concession will improve communist willingness to negotiate and ease the wider conflict, but provoke opposition among those demanding an uncompromising military campaign."
 MYR_Ease_the_Quadrumvirate_Tensions_desc:0 "U Nu, Ba Swe, Kyaw Nyein and Thakin Tin share influence over the AFPFL without agreeing on how that influence should be exercised. Disputes over party appointments and the direction of government threaten to turn their rivalry into open obstruction. A negotiated understanding among the four leaders will steady the administration and restore authority to the cabinet."
 MYR_Improve_Agricultural_Production_desc:0 "With the agrarian faction ascendant, the government can make increased cultivation the first charge upon its development policy. District authorities will identify land and sites for the works needed to support rural production. Opening room for development across the Union's established territory will give cultivators greater confidence in the new programme."
 MYR_Enforce_Radical_Land_Reform_desc:0 "The agrarian socialists propose to break the landlords' hold over cultivation through compulsory redistribution. Enforcing their programme will strengthen the governing faction and address grievances shared by many communist supporters, making accommodation with Rangoon more attractive. Confiscation and contested land claims will nevertheless disturb public order."
 MYR_Disband_Western_Universities_desc:0 "Radicals within the agrarian faction accuse Western-style universities of preserving the social privileges of colonial rule. They propose to dissolve these institutions and bring their educational work under arrangements answerable to the party. The measure will strengthen the faction and its socialist appeal, while provoking resistance from students and teachers."
 MYR_Promote_Agricultural_Cooperatives_desc:0 "Land redistribution must be followed by arrangements that let small cultivators process and market their crops. Government-sponsored cooperatives can pool resources for machinery and establish workshops serving the surrounding farms. This investment will expand civilian industry and give rural communities a firmer stake in the agrarian settlement."
 MYR_Collectivize_the_Plantations_desc:0 "The agrarian faction proposes to place plantation estates under collective management and direct their produce through a common purchasing organization. Processing works in the capital will give the scheme an industrial outlet and expand civilian production. The compulsory transfer of management will bring further disruption as owners and workers contest the new arrangements."
 MYR_Expand_the_Irrigation_Systems_desc:0 "The radical programme will achieve little if cultivators remain dependent on neglected waterworks and unreliable access to their fields. The government will extend irrigation channels and the roads needed to maintain them throughout the Union's established territory. These works will improve the infrastructure upon which rural production depends."
 MYR_Seize_Minority_Lands_desc:0 "The agrarian leadership proposes to extend confiscation into minority communities, placing landholding under Burmese officials and party committees. Seizing these holdings will strengthen the government's political position and impose Bamar administrative practices more widely. The policy will alienate the affected peoples and intensify the struggle against Rangoon."
 MYR_Form_Youth_Labour_Organizations_desc:0 "The agrarian programme requires labour that district authorities cannot obtain through ordinary contracts alone. Party-sponsored youth organizations will supply work parties for rural roads and prepare additional recruits for national service. Their mobilization will improve local communications and enlarge the government's available manpower."
 MYR_Economic_Self_Reliance_desc:0 "The agrarian faction seeks to reduce dependence on foreign capital by directing domestic resources through its own development organizations. A state arms works in the capital will extend this policy to the supply of the armed forces. Consolidating the programme will strengthen the government's authority and reassure its supporters that their reforms have a durable place in the national economy."
 MYR_The_Pyidawtha_Plan_desc:0 "With the educated socialists backing the cabinet, U Nu can commission a comprehensive programme of reconstruction and development. Burmese officials will work with foreign engineers and economic consultants to prepare proposals for industry and public services. Their deliberations will begin the Pyidawtha Plan, whose ambitions must be measured against the resources of a country still at war."
 MYR_The_Tatmadaw_desc:0 "The Tatmadaw has inherited scattered wartime formations and the task of defending a Union already divided by rebellion. Army, naval and air officers must compare their experience and establish workable arrangements for joint operations. A common review of the services will improve the planning and training upon which further military reform depends."
 MYR_The_Elections_of_1956_desc:0 "The AFPFL faces the electorate with its record of independence and reconstruction under increasingly close scrutiny. The National United Front challenges its hold over workers and cultivators, drawing support from discontent with corruption and the pace of reform. Conducting the election will renew the parliamentary basis of government and determine which coalition can claim a mandate."
 MYR_Restore_Abandoned_Rice_Paddies_desc:0 "War and insecurity have left rice land uncultivated and damaged the works needed to bring crops to market. The Pyidawtha programme should begin by restoring abandoned paddies in the Burmese heartland and providing facilities for agricultural production. Bringing these districts back into cultivation will enlarge the productive base upon which reconstruction depends."
 MYR_Introduce_New_Cotton_Strains_desc:0 "Cultivators need cotton better suited to local soils and growing conditions if Burma is to supply more of its own textile requirements. Agricultural officers will organize trials and distribute promising varieties through demonstration plots. The work will strengthen the country's capacity to develop improved farming methods."
 MYR_Rebuild_Railways_desc:0 "Damaged railway lines and unreliable connections keep cultivators and manufacturers from their markets. Repairs under the Pyidawtha Plan will restore the transport network across the Burmese heartland and improve the facilities serving it. More dependable communications will make subsequent development less costly to undertake."
 MYR_Japanese_Reperations_desc:0 "The destruction of the Japanese occupation remains visible in Burma's railways, workshops and public works. A reparations settlement can obtain equipment and construction services for the country's reconstruction without placing the entire burden on domestic resources. These deliveries will sustain building work over the coming decade."
 MYR_Industrialize_Rangoon_desc:0 "Rangoon's port and commercial connections make it the natural centre for an expansion of manufacturing. The government will establish new civilian works there and bring modern industrial methods into the Pyidawtha programme. Additional factory capacity must be accompanied by the technical knowledge needed to use it effectively."
 MYR_Modernize_River_Infrastructure_desc:0 "The Irrawaddy and its tributaries carry produce through districts that roads and railways cannot readily serve. Improved landings and river works will make these waterways more dependable for commerce. Investment across the Burmese heartland will strengthen the water infrastructure on which much of the rice trade relies."
 MYR_Accerlate_Land_Redisribution_Progress_desc:0 "Promises of land redistribution have advanced more slowly than the cultivators who supported independence expected. The government will accelerate transfers and provide agricultural facilities in the districts receiving land. Landlords will resist the settlement, obstructing development even as new holdings begin production."
 MYR_Emphasize_Land_Reclamation_Developments_desc:0 "The Pyidawtha programme needs suitable land for workshops and public works as well as cultivation. Provincial authorities should survey additional sites and prepare them for development throughout the territory under government control. Reclamation will provide room for further construction without committing every site to a single scheme."
 MYR_AFPFL_Victory_desc:0 "The AFPFL retains its parliamentary majority despite the National United Front's challenge. Its leaders can continue governing in the name of the independence movement, though the opposition's gains expose dissatisfaction within their former electorate. Confirming the result will reassure supporters and restore some confidence in the administration."
 MYR_Analyzing_the_Success_of_the_NUF_desc:0 "The National United Front has made inroads among voters whom AFPFL organizers once considered secure. U Nu wants the alliance to examine the opposition's work with trade unions and peasant organizations rather than dismiss the result as an accident. A party review will bring the weaknesses of the governing coalition before its leadership."
 MYR_Halt_Nationalizations_desc:0 "Continued uncertainty over nationalization discourages private investment and complicates the government's development plans. The cabinet will suspend further takeovers and give private enterprise greater room to operate. Economic liberalization will support recovery, but disappoint socialists who regard public ownership as an obligation of independence."
 MYR_Appoint_Ba_Swe_Prime_Minister_desc:0 "U Nu intends to leave the premiership temporarily while he examines the AFPFL's electoral difficulties and reorganizes its work. Ba Swe, a leading figure in the Socialist Party, will take responsibility for the government. The change preserves AFPFL rule while placing the cabinet under a leader with his own following within the alliance."
 MYR_Begin_the_New_Four_Year_Plan_desc:0 "Ba Swe's administration must adapt the development programme to resources that the earlier Pyidawtha ambitions stretched too far. A new four-year plan will concentrate investment on construction and increased industrial output. Keeping labour available for these projects will require limits on the demands made by military recruitment."
 MYR_Undermine_U_Nu_desc:0 "Ba Swe's supporters increasingly resent U Nu's influence over a government he no longer formally leads. They question his proposed party reforms and seek backing for a leadership less dependent on his personal authority. Encouraging this challenge will bring the AFPFL's internal contest into the open."
 MYR_The_Return_of_U_Nu_desc:0 "U Nu is preparing to resume the premiership after Ba Swe's administration. His standing among the public offers the AFPFL a means of restoring confidence, but it has not settled the rivalries exposed during his absence. Returning him to office will reunite the formal leadership of party and government without resolving their internal divisions."
 MYR_Offer_Complee_Amnesty_to_the_PVO_desc:0 "Sections of the People's Volunteer Organization that took up arms after independence may now accept a return to legal political life. U Nu will offer a broad amnesty to encourage their surrender and reduce the appeal of continued insurgency. The campaign will ease the conflict and make communist supporters more receptive to accommodation, though soldiers may resent concessions to former enemies."
 MYR_Deploy_the_Military_to_Tackle_Political_Crimes_desc:0 "Party intimidation and armed retaliation have made ordinary political disputes a matter of public security. The government will employ military forces against organized violence where civilian authorities cannot enforce the law. Their intervention should reduce political killings and coercion, while further entangling the army in domestic government."
 MYR_Split_the_AFPFL_desc:0 "The dispute within the AFPFL has hardened into rival organizations around U Nu and the leaders Ba Swe and Kyaw Nyein. U Nu's supporters claim the name Clean AFPFL, while their opponents organize as the Stable AFPFL. A formal split will give each faction its own political identity and leave the prime minister governing without the old alliance's unity."
 MYR_Request_Ne_Win_Form_A_Caretaker_Government_desc:0 "The AFPFL split has left U Nu's parliamentary position precarious and the army increasingly impatient with party conflict. He will invite General Ne Win to head a caretaker administration charged with restoring order before fresh elections. Authority will pass to a government outside normal party competition, with elections suspended during its tenure."
 MYR_Place_Officers_in_Charge_of_Economic_Sectors_desc:0 "Ne Win's administration regards civilian economic management as compromised by patronage and party rivalry. Officers will take charge of important sectors and apply military supervision to their operation. The arrangement will strengthen order and the army's organization, but divert resources toward the garrison establishment and slow civilian construction."
 MYR_Increase_Military_Deployments_in_the_Shan_State_desc:0 "The caretaker government intends to increase its forces in the Shan States, where weak communications and armed bands limit Rangoon's reach. Additional garrisons will reinforce central administration and put pressure on the Kuomintang remnants operating in the region. Their upkeep will impose a further charge on civilian resources."
 MYR_Reform_the_Civil_Service_desc:0 "The caretaker administration promises to replace party favour with discipline in the public service. Reviewing appointments and strengthening departmental procedures should make government services more dependable beyond the capital. The reform will expand public provision under an administration that expects officials to answer directly to its authority."
 MYR_A_Neutralist_Foriegn_Policy_desc:0 "Burma cannot afford to make its security dependent on either side in the struggle between the great powers. U Nu will maintain diplomatic and commercial relations across that divide while refusing commitments that compromise the Union's independence. A consistent neutralist policy will strengthen the cabinet's authority and give trade greater room to develop."
 MYR_Secure_Commonwealth_and_American_Aid_desc:0 "Neutrality need not require Burma to refuse assistance from the Commonwealth or the United States. The government should obtain equipment and development support without accepting an obligation to join a military bloc. Substantial foreign aid will accelerate civilian and commercial construction, even as it increases the importance of external supplies to the development programme."
 MYR_Seucre_Western_Friendship_desc:0 "Western governments should understand that Burmese neutralism does not imply hostility toward them. Closer dealings with Washington, London and Paris will establish goodwill without surrendering Rangoon's freedom of action. These contacts will also strengthen the government's position in conducting its foreign policy."
 MYR_Collaborate_with_Heckler_and_Kochs_desc:0 "The Tatmadaw needs additional small arms, and West German manufacturers offer another source of supply. Cooperation with Heckler and Koch will bring German-produced infantry equipment into Burmese stores. The purchase will also improve relations with the Federal Republic."
 MYR_Meet_with_John_Foster_Dulles_desc:0 "John Foster Dulles regards neutralism with suspicion, making direct talks particularly important for Burma. The government will explain its refusal of military commitments while seeking cooperation on matters where American and Burmese interests coincide. A successful meeting will improve relations with Washington and reinforce the cabinet's diplomatic standing."
 MYR_Encourage_a_Buddhist_Revival_desc:0 "U Nu regards support for Buddhist learning and observance as a public duty of his government. Sponsoring religious institutions can strengthen the revival already gathering among the Buddhist population. The programme will affirm the prime minister's religious commitments within the broader work of national reconstruction."
 MYR_Promote_Divisions_in_the_NUF_desc:0 "The National United Front unites opponents of the AFPFL whose agreement does not extend to every question of government. Encouraging disputes between its constituent organizations can weaken their common campaign and draw supporters toward the parliamentary socialists. The governing authorities will gain political room as the opposition's coalition becomes harder to maintain."
 MYR_Crackdown_on_Political_Campaign_Violence_desc:0 "Fresh elections cannot command confidence while party organizations settle their disputes through intimidation and assault. The caretaker government will enforce restrictions on armed campaigning and prosecute those responsible for political violence. Reducing this coercion will make public political activity less dependent on protection from local strongmen."
 MYR_Accept_Soviet_Aid_desc:0 "Moscow's offer of technical assistance gives Burma another source of expertise for its development programme. Soviet advisers can work with Burmese officials without requiring Rangoon to adopt the Soviet political system. Their services will remain available for a limited period while domestic departments gain experience."
 MYR_Expand_Ties_with_Socialist_Countries_desc:0 "Relations with the socialist countries give Burma alternatives to dependence on Western diplomacy. The government will cultivate contacts with the Viet Minh and states associated with Moscow while retaining its own political system. These exchanges will improve their view of Rangoon and give the cabinet greater scope for independent action."
 MYR_Visit_USSR_desc:0 "An official visit to the Soviet Union will let Burmese representatives discuss practical cooperation beyond the existing technical mission. Talks with Moscow can improve relations and secure support for an arms works in the capital. The agreement will strengthen the government's standing and enlarge domestic military production."
 MYR_Translate_Orwell_Animal_Farm_desc:0 "A Burmese edition of George Orwell's Animal Farm can present the abuse of revolutionary authority to readers outside the English-speaking public. Supporting its translation will demonstrate that cooperation with socialist states does not require silence about political repression. The undertaking will earn goodwill in Britain and the United States, accompanied by support for civilian production in the capital."
 MYR_Increase_Ties_with_the_Colombo_Powers_desc:0 "India, Pakistan, Ceylon and Indonesia share Burma's interest in ensuring that Asian affairs are not settled solely by the great powers. Closer consultations with the Colombo powers will give Rangoon partners for independent diplomacy. Improving these relations will strengthen cooperation without requiring a common military alignment."
 MYR_Reinforce_Burmese_Yugoslavia_Ties_desc:0 "Yugoslavia's independence from Moscow makes it a useful partner for a socialist government unwilling to accept foreign direction. Closer relations with Belgrade can combine diplomatic cooperation with exchanges of industrial knowledge. The agreement will improve mutual confidence and assist the development of Burmese industry."
 MYR_The_Manila_Conference_desc:0 "The Manila Conference brings proposals for a new regional security organization before the governments of Asia. Burma must consider whether participation would protect the Union or compromise the independence of its foreign policy. The conference proceedings will establish the setting for that decision."
 MYR_Join_SEATO_desc:0 "The government can abandon its reserve toward regional military arrangements and accept membership in the Southeast Asia Treaty Organization. Association with its members will give Burma a place within the new security framework. This course marks a departure from the refusal of bloc commitments that has guided Burmese diplomacy."
 MYR_Forge_Closer_Ties_to_Indonesia_desc:0 "Indonesia offers Burma a partner in defending independent Asian diplomacy outside the new treaty organization. Closer relations can be accompanied by industrial cooperation that benefits both countries. The agreement will improve mutual confidence and add civilian productive capacity in each economy."
 MYR_The_Pyidawtha_Conference_desc:0 "U Nu will convene the Pyidawtha Conference to place the government's development proposals before officials and political representatives. Its proceedings will present an eight-year programme intended to raise living standards through public investment and expanded services. The conference must translate the AFPFL's socialist commitments into proposals that the administration can carry out."
 MYR_Recognize_the_PRC_desc:0 "The People's Republic controls the mainland across Burma's northern frontier, whatever objections other governments raise to its authority. Formal recognition will establish diplomatic relations with Beijing and improve the prospects for dealing directly with our largest neighbour. U Nu need not endorse Chinese communism to acknowledge the government with which Burma must conduct its affairs."
 MYR_Organize_A_Great_Synod_of_Theraveda_Buddhism_desc:0 "U Nu proposes that Burma host a great council of Theravada monks to examine and recite the Buddhist scriptures. Preparations in Rangoon will provide a setting for learned elders from Burma and other Buddhist countries to undertake this work. Government sponsorship will strengthen public confidence and affirm Burma's standing as a centre of Buddhist learning."
 MYR_Preserving_The_Union_desc:0 "Independence has left the Union government fighting for authority over much of Burma. Communist insurgents and armed national movements challenge Rangoon, while the army struggles to hold its scattered positions. Rallying support for the Union will strengthen the government's standing and sustain the military effort through the difficult years ahead."
 MYR_Recall_General_Smith_Dun_desc:0 "General Smith Dun's departure from army command has deepened Karen fears that loyalty to the Union counts for less than ethnic origin. Recalling the experienced Karen officer to military service would recover valuable expertise and demonstrate that the government still has a place for Karen soldiers."
 MYR_The_Battle_of_Insein_desc:0 "The fighting at Insein has shown how close the Karen insurrection can bring the war to Rangoon. The army must consolidate its gains and prepare further operations against the insurgents. This course will weaken their forces and rally support for the war, while extending Bamar authority over the contested districts."
 MYR_Expand_Local_Karen_Rifles_desc:0 "Karen soldiers who remain loyal to the Union should have a larger role in local defence. Expanding their rifle units will give the army reliable local formations and help repair its fractured organization. Recognizing their service should also reassure Karen communities that enlistment need not mean abandoning their own people."
 MYR_Reduce_Racial_Tensions_desc:0 "Communal violence and suspicion of Karen soldiers have widened the breach between the government and Karen communities. Officials must distinguish armed rebellion from ethnic identity and discourage collective reprisals. Fairer treatment will strengthen public order and make cooperation with the Union more acceptable."
 MYR_Disband_the_British_Services_Mission_desc:0 "The British Services Mission has become a target of nationalist suspicion over Britain's former reliance on Karen recruits. Ending its work will place military advice firmly under Burmese control and strengthen the government's claim to direct affairs in Karen areas. London is unlikely to welcome the dismissal of its advisers."
 MYR_Purge_Karen_Officers_desc:0 "Army hardliners regard the defections of Karen units as grounds for removing Karen officers from sensitive commands. A purge would strengthen Bamar control of the army and provide an opportunity to reorganize those commands. It would also cost trained personnel and further alienate Karen communities whose loyalty the government already doubts."
 MYR_Enter_Dialogue_with_Karen_Organizations_desc:0 "The Karen movement includes organizations with differing demands and differing views of continued warfare. Talks over local administration and security can give those willing to negotiate a reason to work with Rangoon. Opening these discussions will improve Karen confidence in the Union and ease the wider conflict without presuming a final settlement."
 MYR_Tolerate_Bamar_Settlement_in_Karen_Areas_desc:0 "The government can permit Bamar settlement in Karen areas and make additional land available for development. This will open room for new construction while increasing the Bamar presence in the region. Settlement will serve Rangoon's policy of drawing the contested districts more closely into the central administration."
 MYR_Operations_against_the_Red_Flags_desc:0 "Thakin Soe's Red Flag Communists reject the parliamentary course and continue their armed campaign against the government. The army must strike their bases and disrupt the networks that sustain them. These operations will weaken communist armed strength and prepare the way for a more decisive offensive."
 MYR_Liberate_the_Irrawaddy_Delta_desc:0 "Communist activity in the Irrawaddy delta threatens rice-producing districts and the waterways linking villages to the markets. Coordinated operations along the river channels can drive insurgent units from their local bases. Restoring government authority will reduce their fighting strength and reassure a population dependent on the rice trade."
 MYR_Local_Land_Reforms_desc:0 "Disputes over tenancy and access to land give communist organizers grievances they can exploit in the countryside. Local land reform should offer cultivators a reason to seek redress through the government rather than the insurgents. Addressing these disputes will improve rural stability and make accommodation with the Union more credible to communist supporters."
 MYR_The_Kuomintang_Invasion_desc:0 "Kuomintang troops driven from Yunnan have established themselves in eastern Burma under Li Mi. Their bases turn Burmese territory into a staging ground for renewed war in China, beyond Rangoon's authority. The government must rally support against this foreign military presence and prepare the army for operations in the border hills."
 MYR_Appeal_to_Washington_desc:0 "Washington's influence with the Chinese Nationalists gives it a means to restrain Li Mi's forces. Burma should press the Americans to treat the occupation as a violation of its sovereignty, regardless of their hostility to Beijing. A diplomatic approach will improve relations with the United States and weaken the position of the Kuomintang troops in Burma."
 MYR_Appeal_to_Beijing_desc:0 "Li Mi's use of Burmese territory for attacks on Yunnan threatens to draw the Union into China's civil war. Rangoon should seek Beijing's cooperation against the Kuomintang presence while insisting that Burmese sovereignty be respected. This common interest can improve relations with the People's Republic and put additional pressure on the remnants."
 MYR_Recognize_the_YANSA_Regime_desc:0 "The Yunnan Anti-Communist National Salvation Army has established an authority that Rangoon cannot easily dislodge. Recognizing its regime would replace the demand for immediate withdrawal with an accommodation along the frontier. The agreement will improve relations with YANSA and its willingness to cooperate, at the expense of relations with Beijing."
 MYR_The_Four_Nations_Military_Commission_desc:0 "A military commission bringing together Burma, the United States, the Republic of China and Thailand can turn promises of withdrawal into supervised arrangements. Burmese representatives must insist on verifiable departures and prevent armed formations from merely changing their designation. Effective supervision will reduce the forces available to the Kuomintang command."
 MYR_Appeal_to_Bangkok_desc:0 "The frontier with Thailand provides routes by which Li Mi's forces can maintain contact with the outside world. Cooperation from Bangkok would make these routes harder to exploit. A diplomatic approach will improve relations with Thailand while restricting the armed remnants' ability to sustain themselves in Burma."
 MYR_The_Fate_of_Li_Mi_desc:0 "Li Mi's authority holds together forces whose continued presence threatens both Burmese sovereignty and relations with China. Following the approach to Beijing, the government must concentrate pressure on his command and disrupt its control over the scattered units. Weakening that leadership will reduce the remnants' capacity to continue their campaign."
 MYR_Formalize_the_YANSA_Border_desc:0 "Recognition of YANSA must be followed by an understanding over the limits of its authority. An agreed frontier will reduce local clashes and give both administrations grounds for restraining their commanders. The arrangement will strengthen cooperation with the remnants and ease tensions within the Union."
 MYR_Repatriate_the_Kuomintang_Soldiers_desc:0 "International pressure offers a means of removing Kuomintang soldiers without a prolonged campaign in the Shan hills. Burma should organize and monitor their departure for Taiwan, checking that armed units leave rather than simply surrendering obsolete weapons. Each evacuation will reduce the military strength of the forces remaining on Burmese soil."
 MYR_Expel_the_Kuomintang_Settlers_desc:0 "Diplomatic arrangements cannot settle the problem if armed Kuomintang settlements remain beyond Rangoon's authority. With American and Thai cooperation established, the army can move against the remaining bases and prepare a wider campaign to expel them. These operations will weaken the remnants and give Burmese commanders further experience in frontier warfare."
 MYR_Treaty_of_Friendship_with_Beijing_desc:0 "Cooperation against Li Mi's forces has created an opportunity for a broader understanding with Beijing. A treaty of friendship and non-aggression will affirm that neither country should use the frontier as a base against the other. It will improve relations with the People's Republic and provide a formal safeguard against renewed confrontation."
 MYR_The_Shan_States_Question_desc:0 "The Shan sawbwas entered the Union with assurances that their internal affairs would be respected. Rangoon must now reconcile those undertakings with demands for closer administration and security in the frontier states. Bringing the question before the government will establish the political basis for choosing between accommodation and coercion."
 MYR_Modernize_the_Shan_States_desc:0 "Poor communications keep much of the Shan country beyond the routine reach of the Union administration. New roads and additional room for construction will improve access to markets and government services. They will also make it easier for Rangoon to extend Bamar administrative practices into the states."
 MYR_The_Kokang_Question_desc:0 "Kokang's Chinese-speaking population and hereditary authorities occupy a sensitive position on the frontier with Yunnan. The reach of the Union government remains limited, while armed groups and the opium trade complicate its relations with local leaders. Rangoon must settle its policy toward Kokang before these frontier arrangements harden beyond its influence."
 MYR_Recognize_Kokang_Independence_desc:0 "Kokang's leaders may be more willing to cooperate with Rangoon if their separate authority is recognized. The government should offer recognition and commit itself to defending Kokang's independence. This accommodation will improve local confidence in Burma and open a route toward an autonomous settlement."
 MYR_Tolerate_the_Opium_Trade_desc:0 "Opium provides income and influence to frontier authorities whom Rangoon lacks the means to replace. Tolerating the trade will secure cooperation in Kokang and give the government greater political room to act. The compromise will undermine public order and provoke objections from China and Thailand."
 MYR_Invade_Kokang_desc:0 "The government can reject a separate settlement for Kokang and prepare to impose its authority by force. Military occupation would extend Bamar administration into a district long governed through its own local arrangements. This policy will authorize a campaign against Kokang, rather than secure its submission by negotiation."
 MYR_The_Mujahid_Revolt_desc:0 "Mujahid insurgents in northern Arakan challenge the government's authority near the frontier with East Pakistan. Their demands grow out of disputes over local power and the position of the area's Muslim population within Burma. Reviewing the army's experience there will help the government organize its response to the revolt."
 MYR_Burmanize_the_Rohingya_desc:0 "Officials who favour a uniform administration argue that the Muslim districts of northern Arakan must be brought under Burmese-language government. Extending Bamar administrative practices will make these communities more subject to Rangoon's institutions. The policy addresses central control rather than the insurgents' demands for a separate political settlement."
 MYR_Tolerate_the_Islamic_Faith_desc:0 "Muslim religious life in northern Arakan need not be treated as evidence of allegiance to the Mujahids. Protecting worship and allowing communities to maintain their religious institutions can distinguish the government's authority from a campaign against Islam. This assurance will improve Rohingya confidence in the Union."
 MYR_Buddhist_Missions_in_Arakan_desc:0 "Government support for Buddhist missions can extend the influence of the majority religion in northern Arakan. Monks and religious institutions will reinforce the cultural policy accompanying the expansion of Burmese administration. The programme will advance assimilation among communities whose religious life has remained distinct."
 MYR_Found_the_Mayu_Frontier_District_desc:0 "A separate frontier district around the Mayu region offers a means of addressing Muslim concerns without accepting the insurgents' territorial demands. Rangoon should establish a distinct administrative arrangement and open the way to local autonomy. This concession will improve Rohingya willingness to cooperate with the Union."
 MYR_Destroy_the_Mujahid_Remnants_desc:0 "The army must pursue the remaining Mujahid bands after the government's efforts to restrict their outside support. Coordinated operations against their bases will reduce the insurgents' fighting strength and prepare a final campaign where necessary. Commanders will gain further experience in the difficult frontier country."
 MYR_U_Seinda_s_Revolt_desc:0 "U Seinda, a Buddhist monk and Rakhine nationalist, leads armed resistance to Rangoon's authority in Arakan. His movement draws on grievances over the region's position within Burma, even as communist forces pursue their own campaigns there. The government must assess this distinct rebellion and organize a response suited to local conditions."
 MYR_Cut_Rakhine_Supply_Lines_desc:0 "U Seinda's followers depend on routes connecting their bases with food, recruits and weapons. Blocking those routes will weaken their forces and extend the reach of the Union administration. The army should concentrate on isolating the armed movement before attempting a wider offensive."
 MYR_Tolerate_Rakhine_Autonomy_desc:0 "Rakhine demands for local government need not be answered solely by military occupation. Accepting a measure of autonomy can give regional leaders a reason to negotiate with Rangoon. This policy will improve their confidence in the Union and permit an autonomous settlement if the necessary conditions are met."
 MYR_Operation_Aung_Tayza_desc:0 "With the insurgents' supply routes under pressure, the army can prepare Operation Aung Tayza against U Seinda's movement. The campaign will strengthen Bamar administrative control and authorize further operations to crush the rebellion. Its planning and execution will also develop the army's experience of warfare in Arakan."
 MYR_Rakhine_Alliance_against_the_Communists_desc:0 "Rakhine nationalists and communist insurgents do not share the same objectives, even where both oppose Rangoon. An understanding with regional leaders can direct their cooperation against communist forces instead. The alliance will improve relations with the Rakhine movement and weaken the communists' armed position."
 MYR_The_Fate_of_U_Seinda_desc:0 "Whether through military pressure or accommodation with Rakhine leaders, the government must now settle its conflict with U Seinda's movement. Isolating his remaining armed followers will reduce their capacity to sustain a separate rebellion. A firmer settlement in Arakan will also strengthen public confidence in the Union."
 MYR_Request_Pakistan_Halt_Mujahideen_Funding_desc:0 "Mujahid forces draw on cross-border contacts that Rangoon believes sustain their campaign in northern Arakan. The government should ask Pakistan to halt funding and prevent assistance from reaching the insurgents through East Pakistan. The approach will disrupt rebel strength, though Pakistan's response will determine the diplomatic consequences."
 MYR_Establish_the_Bureau_of_Special_Investigation_desc:0 "Corruption and illicit financial networks weaken the government's efforts to restore its authority. A Bureau of Special Investigation will give the Union a permanent agency to investigate economic offences and trace funds reaching armed movements. Its establishment will extend the state's intelligence machinery beyond the army's field commands."
 MYR_Crackdown_on_the_Shan_desc:0 "Supporters of central rule regard the sawbwas' authority as an obstacle to a unified state. A crackdown will extend Bamar control through a growing military presence, at the cost of Shan confidence in Rangoon. Resentment and dependence on garrisons will accompany this expansion of the central government's reach."
 MYR_National_United_Front_Victory_desc:0 "The National United Front has defeated the AFPFL and secured the opportunity to form a government. Its coalition promises relief for cultivators and a political settlement with armed opponents whom the previous administration failed to reconcile. The electoral mandate will give its leaders the authority to begin this alternative programme."
 MYR_Integrate_the_Liberation_Army_desc:0 "The National United Front's victory offers communist leaders a route back into national politics without continuing their separate armed campaign. The government will negotiate the incorporation of the Liberation Army and the territory held by its supporters. An agreement can reunite these forces with the Union, but their leadership must accept the proposed settlement."
 MYR_Disband_the_Home_Guards_desc:0 "The Home Guards give local party patrons armed influence beyond the reach of ordinary administration. The National United Front will dissolve these formations and end their privileged role in political disputes. Removing their organization should reduce the violence that has accompanied competition for power in the countryside."
 MYR_Purge_AFPFL_Appointees_desc:0 "The new government inherits departments and local offices staffed through years of AFPFL patronage. Removing its predecessor's political appointees will give the National United Front firmer control over the administration. Communist members of the coalition will gain influence as posts pass to officials committed to its programme."
 MYR_Honor_Aung_Sans_Agreement_desc:0 "The Panglong Agreement promised full autonomy in internal administration for the Frontier Areas. Honouring Aung San's undertaking will reassure Shan leaders that membership of the Union need not extinguish their political rights. The policy will reduce assimilation pressures and open the way to an autonomous settlement."
 MYR_The_Election_of_1952_desc:0 "Burma's first general election is being conducted in stages as insecurity restricts polling across the country. The AFPFL expects its record in the independence struggle to secure a commanding majority, though rebellion and poor turnout will qualify its claim to a national mandate. Bringing the polls to their conclusion will allow U Nu's government to renew its parliamentary authority."
 MYR_Reform_the_Postal_Services_desc:0 "Reliable postal services are essential to a government whose officials and citizens remain separated by damaged communications. The administration will improve the handling of correspondence and strengthen the network connecting provincial offices with Rangoon. This reform will form part of a wider increase in public services."
 MYR_Increase_Allowances_for_Local_Government_desc:0 "Local authorities cannot carry out national reforms on allowances too small to maintain their offices. Increased funding will let them provide services with less dependence on hereditary influence and private patrons. A more dependable local administration will improve public confidence and begin weakening the old arrangements of rural power."
 MYR_Request_UN_Assistance_with_the_Chinese_Problem_desc:0 "The presence of Kuomintang troops on Burmese soil is an international dispute as well as a frontier security problem. Bringing the complaint before the United Nations will press the Republic of China to accept responsibility for their withdrawal. International action offers a way to ease the crisis without recognizing Li Mi's authority."
 MYR_Launch_Operation_Bayinnaung_desc:0 "The appeal to Beijing has established a common interest in removing Li Mi's armed remnants from Burma. The Tatmadaw should now prepare Operation Bayinnaung against the bandit bases that sustain his forces in the Shan hills. This offensive will authorize a campaign to crush the remnants and begin reducing the strain of their occupation."
 MYR_Provide_Loans_to_Farmers_desc:0 "Cultivators who borrow on ruinous terms surrender much of their harvest before it reaches the market. Affordable government-backed loans will finance improvements and support the construction of agricultural facilities. Directing credit toward the countryside will leave fewer resources available for commercial office development."
 MYR_Crackdown_on_Corruption_desc:0 "Replacing AFPFL appointees will accomplish little if their successors inherit the same opportunities for private enrichment. The National United Front will investigate patronage and the diversion of public funds, including abuses protected by local notables. Enforcing these measures will reduce the hold of entrenched rural interests over government."
 MYR_The_Korean_War_desc:0 "War between North and South Korea has brought the rivalry of the great powers into open conflict in Asia. Burma must decide how to defend its opposition to aggression without surrendering its freedom of action to either camp. The cabinet should examine the conflict before committing itself to a public position."
 MYR_Condemn_North_Korean_Aggression_desc:0 "The North Korean invasion violates the principle that political disputes cannot be settled by crossing another state's frontier. Burma will publicly condemn the attack and support efforts to defend South Korea. The declaration will improve relations with Seoul and Washington, while alienating Pyongyang, Beijing and Moscow."
 MYR_Coordinate_with_the_Chinese_desc:0 "Following the advisory mission, Burma can support the Chinese and North Korean war effort through closer military cooperation with Beijing. Granting Chinese forces military access will bring an allocation of Chinese small arms for our own depleted stores. The arrangement will rally support for the government's military policy, though it carries Burma well beyond diplomatic criticism of the American intervention."
 MYR_Nationalize_Foriegn_Assets_desc:0 "Foreign commercial holdings give the National United Front a conspicuous target for its programme of economic independence. Taking them into public ownership will add civilian and commercial facilities in the capital. The transfer will also disrupt banking activity, placing a substantial cost on the government's assertion of control."
 MYR_Execute_Ne_Win_desc:0 "The National United Front regards Ne Win's independent military following as a threat to its authority. It will move against the general on charges of conspiracy and remove him from the army through trial and execution. This confrontation will rally supporters of the government while ending his personal role in military command."
 MYR_Condemn_American_Imperialism_desc:0 "U Nu's government can denounce American intervention in Korea as an attempt to impose a foreign settlement upon an Asian people. Public condemnation will find a sympathetic hearing in Beijing, Pyongyang and Moscow. It will also damage relations with South Korea and the United States, whose representatives will regard the statement as support for their opponents."
 MYR_Purge_the_Trade_Union_Congress_from_the_AFPFL_desc:0 "The removal of Marxist organizers has left the Trade Union Congress's place within the AFPFL unresolved. Thakin Lwin's opposition to the government's foreign policy gives the leadership grounds to demand the removal of communist influence from the union federation. Suspending its affiliation until it complies will reinforce party discipline and strengthen the cabinet's position."
 MYR_Profit_from_the_War_desc:0 "Remaining outside the Korean conflict leaves Burma free to pursue the commercial opportunities created by wartime demand. The government will encourage investment in an arms works and new commercial offices in Rangoon. These facilities will expand domestic production and business activity without committing Burmese troops to the fighting."
 MYR_Expand_Asian_Ties_desc:0 "U Nu's neutralism requires regular dealings with Asian governments, including those whose policies Burma cannot endorse. A wider diplomatic effort will give the cabinet firmer grounds for addressing the wars and frontier disputes affecting the region. Establishing this programme will strengthen its authority to conduct an independent foreign policy."
 MYR_Intervention_in_Korea_desc:0 "A declaration on Korea does not settle whether Burma should take any military part in the conflict. The army staff will examine the requirements of an overseas mission and compare reports from the opposing forces. This preliminary study will develop military planning experience without yet committing men to either side."
 MYR_Korea_Remain_Neutral_desc:0 "Burma's own rebellions leave little room for a military undertaking on the Korean peninsula. The cabinet will rule out an advisory mission while maintaining its right to speak on the conflict. Keeping the army at home will reassure the public and preserve the government's authority for domestic affairs."
 MYR_Advisory_Mission_to_Korea_desc:0 "A small mission of Burmese officers can study the Korean fighting without dispatching a combat formation. Its reports on infantry operations and the supply of armies in the field will inform training at home. The experience will also provide a basis for deciding which side, if either, should receive further military cooperation."
 MYR_Support_South_Korea_desc:0 "The advisory mission gives Burma an opening to extend military cooperation with South Korea. Exchanges with its forces will improve our officers' experience, while American small arms will replenish Burmese stocks. Public backing for this course will strengthen support for the army and earn goodwill in Seoul and Washington."
 MYR_Recognize_the_ROC_desc:0 "Burma can recognize the Republic of China rather than accept Beijing's claim to represent the whole country. This choice will improve relations with the Nationalist government and make Kuomintang forces in Burma more receptive to dealings with Rangoon. The People's Republic will regard recognition as a hostile diplomatic act."
 MYR_Resume_Trade_with_China_desc:0 "Having settled the question of recognition, Burma should restore commercial channels with the Chinese authorities it acknowledges. Merchants and manufacturers need dependable arrangements for obtaining supplies and finding buyers after the disruption of the civil war. Government support for these connections will sustain an expansion of civilian industry in Rangoon."
 MYR_The_Indochina_War_desc:0 "France's war with the Viet Minh confronts Burma with competing claims of national independence and resistance to communist expansion. The State of Vietnam offers a rival Vietnamese government, but its association with France complicates its appeal to former colonial peoples. A cabinet review will establish the political basis for Burma's response."
 MYR_Condemn_Viet_Minh_Nationalism_desc:0 "The government can reject the Viet Minh's claim to speak for all Vietnamese and condemn the use of national liberation to advance communist authority. Burma's own experience of armed communist opposition gives weight to this position. France will welcome the declaration, while relations with the Viet Minh will deteriorate."
 MYR_Condemn_French_Colonialism_desc:0 "Burma's independence movement cannot readily accept France's attempt to preserve its authority in Indochina by force. Rangoon will condemn the colonial war and affirm the right of the peoples of Indochina to determine their own government. The declaration will improve relations with the Viet Minh at the expense of French goodwill."
 MYR_Intervention_in_Indochina_desc:0 "Any Burmese military role in Indochina would depart from the cabinet's usual policy of avoiding foreign commitments. Before taking such a step, the army staff must study the fighting and the practical demands of a mission abroad. This assessment will improve its planning experience without authorizing a combat expedition."
 MYR_Indochina_Remain_Neutral_desc:0 "Neither sympathy for Vietnamese independence nor fear of communism obliges Burma to send military advisers into Indochina. The government will keep its officers out of the conflict and reserve its resources for restoring order within the Union. A clear limit on foreign commitments will strengthen public confidence and the cabinet's freedom of action."
 MYR_Advisory_Mission_to_Indochina_desc:0 "The government can make an exceptional departure from its reserve by sending a small military mission to Indochina. Burmese officers will study operations and compare their experience of insurgency with the methods used there. Their reports will improve army training without requiring the dispatch of combat units."
 MYR_Coordinate_with_the_Viet_Minh_desc:0 "The cabinet can turn contacts established by the advisory mission into direct assistance for the Viet Minh. A consignment of Burmese small arms will support its forces, while continued liaison will give our officers further experience of the war. Such cooperation will strengthen relations with the movement and commit Burma to an unusual military role in an anti-colonial struggle abroad."
 MYR_Support_the_State_of_Vietnam_desc:0 "Bao Dai's State of Vietnam offers a Vietnamese alternative to the communist-led resistance, despite its dependence on France. The government can follow the advisory mission with a shipment of small arms and closer military liaison. This departure from Burmese reserve will develop our officers' experience and earn goodwill from both the State of Vietnam and France."
 MYR_The_Malayan_Emergency_desc:0 "The Malayan Emergency pits British colonial authorities and the Federation's administration against communist guerrillas led by Chin Peng. For Burma, the conflict raises familiar disputes over independence and the legitimacy of armed revolt. A government review will give Rangoon a considered position from which to address the Emergency."
 MYR_Condemn_Chin_Peng_s_Terrorism_desc:0 "Chin Peng's campaign relies on armed coercion as well as appeals to end colonial rule. Burma can condemn attacks on civilians and reject the claim that communist guerrillas alone represent Malaya's people. Britain will welcome a declaration that distinguishes opposition to colonialism from approval of insurgent violence."
 MYR_Condemn_British_Colonialism_desc:0 "Emergency powers cannot settle the question of Malaya's right to independence. Burma will condemn continued British colonial rule and insist that political grievances receive an answer beyond military repression. The statement will strengthen the cabinet's standing as an advocate of Asian independence, while damaging relations with London."
 MYR_Intervention_in_Malaya_desc:0 "A Burmese military commitment in Malaya would carry the government beyond declarations about colonial rule or communist violence. The army staff should first assess the guerrilla campaign and the demands of operating on the peninsula. Studying these problems will improve its planning experience before the cabinet decides whether to send a mission."
 MYR_Malaya_Remain_Neutral_desc:0 "The Emergency does not justify diverting Burmese officers from the Union's own security problems. Rangoon will decline to send an advisory mission and maintain a distinction between diplomatic criticism and military involvement. This restraint will reassure the public and leave the cabinet better placed to address affairs at home."
 MYR_Advisory_Mission_to_Malaya_desc:0 "A small military mission to Malaya can examine jungle operations and the means by which armed groups maintain their rural networks. Its work will be an exceptional foreign undertaking for a government normally wary of military commitments abroad. The officers' reports will provide practical experience for the Burmese army."
 MYR_Coordinate_with_the_MNLA_desc:0 "Following the advisory mission, the cabinet can authorize direct assistance to the Malayan National Liberation Army. A shipment of Burmese small arms and further military liaison will give substance to support for Chin Peng's forces and develop our officers' experience. Arming the guerrillas would mark a sharp departure from neutralist restraint and seriously damage relations with Britain."
 MYR_Support_the_Malayan_Federation_desc:0 "Burma can use its advisory contacts to support the Federation of Malaya's administration against the communist insurgency. Closer military liaison will give Burmese officers additional experience and demonstrate that independence need not be pursued through armed communist revolt. Britain and the Federation's authorities will welcome this unusual extension of Burmese military cooperation."
 MYR_Thai_Burmese_Friendship_Treaty_desc:0 "Burma and Thailand must manage a frontier crossed by traders and armed groups, despite their differing relations with the great powers. A treaty of friendship will affirm their intention to settle disputes through direct negotiation. This undertaking will improve Bangkok's confidence in Rangoon and open the way to more practical agreements."
 MYR_Host_Phibun_s_Visit_desc:0 "An official visit by Prime Minister Phibun will give U Nu an opportunity to demonstrate that good relations with Thailand need not depend on agreement over every international question. Talks in Rangoon can place the friendship treaty before the public as a working policy. A successful reception will strengthen confidence in the cabinet and its conduct of foreign affairs."
 MYR_Thai_Trade_Agreement_desc:0 "The friendship treaty should be followed by arrangements that make lawful commerce between Burma and Thailand easier to conduct. Improved roads and transport facilities in the Union will help merchants bring goods to market. The agreement will give the government a practical achievement to set beside its diplomatic assurances."
 MYR_Formalize_the_Thai_Border_desc:0 "An agreed understanding of the frontier will give Burmese and Thai officials a firmer basis for controlling movement across it. Closer supervision can restrict the routes supplying Kuomintang forces in Burma and reduce their military strength. More dependable border administration will also reassure communities unsettled by the passage of armed bands."
 MYR_Tolerate_the_Talaku_desc:0 "The Talaku's Karen religious polity straddles the frontier and acknowledges spiritual authorities outside the ordinary district administration. Rangoon can tolerate its communal arrangements rather than attempt to dissolve them by force. This accommodation will improve Karen confidence in the Union, though Bangkok will object to an arrangement that leaves a separate authority along the border."
 MYR_Annex_the_Talaku_Lands_desc:0 "The government can reject the Talaku's separate authority and bring its settlements under Union administration. Establishing Burmese officials and enforcing their jurisdiction will extend Bamar control and give the army further experience of frontier operations. Karen confidence in Rangoon will suffer, and Thailand will resent a forcible assertion of authority in this sensitive border region."
 MYR_Tatmadaw_Ray_desc:0 "Burma's navy must protect coastal traffic while supporting operations in the delta and along the rivers. Reviewing patrol work and improving the instruction of officers will make its limited vessels more useful to the Union. The service can draw on this experience when planning its expansion."
 MYR_Increase_Landing_Capabilities_desc:0 "Troops operating from the water need craft that can put men and equipment ashore without a prepared quay. The navy will adopt improved landing vessels and establish the methods needed to employ them. These capabilities will give commanders more practical means of reaching contested stretches of coast and riverbank."
 MYR_Increase_Coastal_Defense_Facilities_desc:0 "The Union's long coastline contains approaches that its small navy cannot keep under constant patrol. A programme of defensive works will give shore establishments a stronger role in protecting these waters. Concentrating labour and materials on fortification will make the necessary construction easier to complete."
 MYR_Establish_Coastal_Radar_Facilities_desc:0 "Ships and aircraft approaching Rangoon should not depend on visual observation alone for detection. Radar installations serving the capital will give the armed forces earlier warning and improve the supervision of nearby approaches. The government will provide the sites and equipment needed for this coastal network."
 MYR_Emphasize_River_Combat_Training_desc:0 "Delta operations require close cooperation between boat crews and troops fighting beyond the landing grounds. Training will concentrate on movement through channels and the establishment of secure positions ashore. Lessons from these exercises will assist the development of specialized forces."
 MYR_Tatmadaw_Kyi_desc:0 "The army has survived mutiny and rebellion without resolving the weaknesses exposed by either. Its commands must examine recent operations and establish training suited to the forces still available. A systematic review will provide the experience needed for further reform of the ground forces."
 MYR_Recovering_from_the_Karan_Defections_desc:0 "The departure of Karen officers and units has left gaps in command and disrupted formations across the army. Reorganizing the remaining forces and clarifying their chains of command will reduce the dysfunction inherited from those defections. Restoring cohesion must precede any substantial expansion of the army."
 MYR_Utilize_Captured_Weapon_Caches_desc:0 "Japanese weapons left from the war remain valuable to an army short of reliable supplies. Recovered caches should be inspected and serviceable rifles issued to formations that still lack equipment. Bringing these stocks into government stores will provide a substantial reserve of infantry arms."
 MYR_Develop_Counterinsurgency_Tactics_desc:0 "Large formations trained for conventional battle often struggle against insurgents who disperse into familiar countryside. The army will collect reports from field commands and incorporate their experience into its doctrine. Better methods of organizing counterinsurgency operations will reduce the work needed to revise army training."
 MYR_Focus_on_Jungle_Warfare_Training_desc:0 "Much of the army's fighting takes place where dense vegetation restricts observation and movement. Training must prepare units to maintain direction and supply when roads cannot carry them to their objectives. Establishing jungle warfare instruction will give Burmese forces the specialist knowledge these conditions demand."
 MYR_Tatmadaw_Lay_desc:0 "The air force must support scattered army positions while maintaining aircraft drawn from a limited and uneven stock. Its officers will review operational experience and improve the instruction of pilots and ground personnel. These lessons will provide a basis for the service's modernization."
 MYR_Import_Supermarine_Seafires_and_Spitfires_desc:0 "British wartime fighters remain available in numbers that Burma can put to immediate use. Purchasing Spitfires and Seafires will replenish the air force with familiar piston-engined aircraft. The deliveries will expand its fighter stocks without waiting for an entirely new generation of equipment."
 MYR_Establish_the_Mingaladon_Air_Base_desc:0 "Mingaladon is the principal airfield serving Rangoon and a natural centre for military aviation. Enlarging its facilities will allow the air force to accommodate more aircraft near the capital. Improved capacity there will support the operation of both existing squadrons and further purchases."
 MYR_Purchase_Additional_Vampires_desc:0 "Jet aircraft offer performance that the air force's wartime fighters cannot match. An additional purchase of British Vampires will strengthen the service's jet component and supply aircraft for operational units. Their introduction will extend modernization beyond the continued use of surplus piston-engined machines."
 MYR_Purchase_American_Helicoptors_desc:0 "Helicopters can reach isolated positions where damaged roads and the absence of airstrips prevent ordinary transport. The air force will acquire utility machines to support movement and liaison in difficult country. These aircraft will add a new means of maintaining contact with dispersed military forces."
 MYR_American_Loans_for_Rice_Paddy_Development_desc:0 "The caretaker administration can obtain American credit to extend rice cultivation and improve agricultural facilities. Loans will finance new productive works across the Burmese heartland rather than leave reconstruction dependent on current revenue alone. The investment will enlarge agricultural capacity while committing the government to a continuing credit arrangement."
 MYR_The_Elections_of_1960_desc:0 "The February 1960 election brings U Nu's Clean AFPFL back to power after Ne Win's caretaker administration. Its victory gives the civilian leadership a renewed mandate and an opportunity to reduce the tensions left by the party split. Restoring confidence in parliamentary government will strengthen the cabinet's authority and ease the wider conflict."
 MYR_Establish_New_Agricultural_Schools_desc:0 "Improved cultivation requires instructors who can bring agricultural knowledge beyond the ministries in Rangoon. New schools will train personnel to work with cultivators and demonstrate better methods in the districts. The programme will sustain agricultural education over the coming years."
 MYR_Expand_Educational_Access_desc:0 "The development programme needs a broader body of trained people than the existing schools can supply. Expanding access to education will let more Burmese students enter advanced study and technical work. Their training will give the country greater capacity to pursue research alongside its immediate reconstruction needs."
 MYR_The_Democratization_of_Villages_desc:0 "National elections have not removed the dependence of many villages on hereditary authority and powerful patrons. Extending representative government locally will let villagers exercise greater influence over their own administration. These reforms will weaken entrenched rural interests and strengthen the government's mandate for further change."
 MYR_Reject_Neutralism_desc:0 "The National United Front argues that equal distance from the great powers has constrained cooperation with governments sympathetic to its programme. It will abandon the neutralist policy inherited from U Nu and seek a clearer international alignment. This decision ends the existing diplomatic and commercial advantages of that policy."
 MYR_Request_Soviet_Advisors_desc:0 "The government's new orientation opens the way to a permanent Soviet advisory mission. Soviet specialists can assist the armed forces in organizing instruction and applying more systematic military methods. Accepting their services will make military cooperation with Moscow part of the National United Front's governing programme."
 MYR_Request_Soviet_Sino_Economic_Assistance_desc:0 "The National United Front looks to the Soviet Union and China for help in carrying out its development plans. Technical assistance will place foreign specialists at the disposal of Burmese officials responsible for economic reconstruction. Establishing continuing advisory support will give the programme expertise beyond that available within the administration."
 MYR_Cooperate_with_Domestic_Capitalists_desc:0 "The National United Front can distinguish Burmese private enterprise from the foreign interests it has nationalized. Cooperation with domestic businessmen will support new commercial facilities in the capital and encourage a period of economic expansion. The arrangement gives private capital a place within a government still committed to socialist reform."
 MYR_Implement_Autonomy_for_Ethnic_Minorities_desc:0 "The National United Front proposes to settle the conflict with Karen and Mon organizations through regional autonomy rather than military occupation alone. Offers to their leadership will open negotiations, while assurances to Karenni communities will widen the basis for accommodation. The policy will improve confidence in the Union and permit autonomous settlements without presuming that every armed movement will accept."
 MYR_Nationalize_Trade_desc:0 "The government intends to place foreign trade under national direction so that imports and export earnings serve its development programme. Public control of commerce will give the state greater authority over the country's dealings abroad. This policy will establish a more restrictive trading system in place of the previous arrangements."
 MYR_An_End_to_YANSA_desc:0 "The Yunnan Anti-Communist National Salvation Army continues to maintain foreign armed bases on Burmese soil. With Soviet and Chinese assistance secured, the National United Front will authorize a military campaign to remove this challenge to the Union's sovereignty. The decision begins hostilities against the Kuomintang remnants rather than treating their expulsion as an accomplished fact."
 MYR_Rally_the_Burmese_Workers_Party_desc:0 "The National United Front needs an organized base to defend its reforms after the first measures of government. Rallying the Burmese Workers Party will bring renewed political discipline and revolutionary enthusiasm to the coalition. This mobilization will strengthen public confidence and support for the government's military policy as well as its authority to govern."
 MYR_A_Renewed_War_on_the_Communists_desc:0 "The caretaker government will reinforce the army and renew operations against communist bases. Its campaign will weaken insurgent forces and authorize a wider effort to crush the movement. Mobilization will strengthen military capacity, but intensify the conflict rather than advance a negotiated settlement."
 MYR_Sack_Political_Cabinet_Appointees_desc:0 "Ne Win's administration considers the remaining party appointees an obstacle to disciplined government. Replacing them will extend military authority through the cabinet and deepen the emerging garrison state. Greater order and army readiness will come with heavier demands on civilian resources and further restrictions on construction."
