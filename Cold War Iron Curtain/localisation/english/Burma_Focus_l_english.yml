 MYR_The_Pyidawtha_Conference_desc:0 "U Nu will convene the Pyidawtha Conference to place the government's development proposals before officials and political representatives. Its proceedings will present an eight-year programme intended to raise living standards through public investment and expanded services. The conference must translate the AFPFL's socialist commitments into proposals that the administration can carry out."
 MYR_Recognize_the_PRC_desc:0 "The People's Republic controls the mainland across Burma's northern frontier, whatever objections other governments raise to its authority. Formal recognition will establish diplomatic relations with Beijing and improve the prospects for dealing directly with our largest neighbour. U Nu need not endorse Chinese communism to acknowledge the government with which Burma must conduct its affairs."
 MYR_Organize_A_Great_Synod_of_Theraveda_Buddhism_desc:0 "U Nu proposes that Burma host a great council of Theravada monks to examine and recite the Buddhist scriptures. Preparations in Rangoon will provide a setting for learned elders from Burma and other Buddhist countries to undertake this work. Government sponsorship will strengthen public confidence and affirm Burma's standing as a centre of Buddhist learning."
 MYR_Preserving_The_Union_desc:0 "Independence has left the Union government fighting for authority over much of Burma. Communist insurgents and armed national movements challenge Rangoon, while the army struggles to hold its scattered positions. Rallying support for the Union will strengthen the government's standing and sustain the military effort through the difficult years ahead."
 MYR_Recall_General_Smith_Dun_desc:0 "General Smith Dun's departure from army command has deepened Karen fears that loyalty to the Union counts for less than ethnic origin. Recalling the experienced Karen officer to military service would recover valuable expertise and demonstrate that the government still has a place for Karen soldiers."
 MYR_The_Battle_of_Insein_desc:0 "The fighting at Insein has shown how close the Karen insurrection can bring the war to Rangoon. The army must consolidate its gains and prepare further operations against the insurgents. This course will weaken their forces and rally support for the war, while extending Bamar authority over the contested districts."
 MYR_Expand_Local_Karen_Rifles_desc:0 "Karen soldiers who remain loyal to the Union should have a larger role in local defence. Expanding their rifle units will give the army reliable local formations and help repair its fractured organization. Recognizing their service should also reassure Karen communities that enlistment need not mean abandoning their own people."
 MYR_Reduce_Racial_Tensions_desc:0 "Communal violence and suspicion of Karen soldiers have widened the breach between the government and Karen communities. Officials must distinguish armed rebellion from ethnic identity and discourage collective reprisals. Fairer treatment will strengthen public order and make cooperation with the Union more acceptable."
 MYR_Disband_the_British_Services_Mission_desc:0 "The British Services Mission has become a target of nationalist suspicion over Britain's former reliance on Karen recruits. Ending its work will place military advice firmly under Burmese control and strengthen the government's claim to direct affairs in Karen areas. London is unlikely to welcome the dismissal of its advisers."
 MYR_Purge_Karen_Officers_desc:0 "Army hardliners regard the defections of Karen units as grounds for removing Karen officers from sensitive commands. A purge would strengthen Bamar control of the army and provide an opportunity to reorganize those commands. It would also cost trained personnel and further alienate Karen communities whose loyalty the government already doubts."
 MYR_Enter_Dialogue_with_Karen_Organizations_desc:0 "The Karen movement includes organizations with differing demands and differing views of continued warfare. Talks over local administration and security can give those willing to negotiate a reason to work with Rangoon. Opening these discussions will improve Karen confidence in the Union and ease the wider conflict without presuming a final settlement."
 MYR_Tolerate_Bamar_Settlement_in_Karen_Areas_desc:0 "The government can permit Bamar settlement in Karen areas and make additional land available for development. This will open room for new construction while increasing the Bamar presence in the region. Settlement will serve Rangoon's policy of drawing the contested districts more closely into the central administration."
 MYR_Operations_against_the_Red_Flags_desc:0 "Thakin Soe's Red Flag Communists reject the parliamentary course and continue their armed campaign against the government. The army must strike their bases and disrupt the networks that sustain them. These operations will weaken communist armed strength and prepare the way for a more decisive offensive."
 MYR_Liberate_the_Irrawaddy_Delta_desc:0 "Communist activity in the Irrawaddy delta threatens rice-producing districts and the waterways linking villages to the markets. Coordinated operations along the river channels can drive insurgent units from their local bases. Restoring government authority will reduce their fighting strength and reassure a population dependent on the rice trade."
 MYR_Local_Land_Reforms_desc:0 "Disputes over tenancy and access to land give communist organizers grievances they can exploit in the countryside. Local land reform should offer cultivators a reason to seek redress through the government rather than the insurgents. Addressing these disputes will improve rural stability and make accommodation with the Union more credible to communist supporters."
 MYR_The_Kuomintang_Invasion_desc:0 "Kuomintang troops driven from Yunnan have established themselves in eastern Burma under Li Mi. Their bases turn Burmese territory into a staging ground for renewed war in China, beyond Rangoon's authority. The government must rally support against this foreign military presence and prepare the army for operations in the border hills."
 MYR_Appeal_to_Washington_desc:0 "Washington's influence with the Chinese Nationalists gives it a means to restrain Li Mi's forces. Burma should press the Americans to treat the occupation as a violation of its sovereignty, regardless of their hostility to Beijing. A diplomatic approach will improve relations with the United States and weaken the position of the Kuomintang troops in Burma."
 MYR_Appeal_to_Beijing_desc:0 "Li Mi's use of Burmese territory for attacks on Yunnan threatens to draw the Union into China's civil war. Rangoon should seek Beijing's cooperation against the Kuomintang presence while insisting that Burmese sovereignty be respected. This common interest can improve relations with the People's Republic and put additional pressure on the remnants."
 MYR_Recognize_the_YANSA_Regime_desc:0 "The Yunnan Anti-Communist National Salvation Army has established an authority that Rangoon cannot easily dislodge. Recognizing its regime would replace the demand for immediate withdrawal with an accommodation along the frontier. The agreement will improve relations with YANSA and its willingness to cooperate, at the expense of relations with Beijing."
 MYR_The_Four_Nations_Military_Commission_desc:0 "A military commission bringing together Burma, the United States, the Republic of China and Thailand can turn promises of withdrawal into supervised arrangements. Burmese representatives must insist on verifiable departures and prevent armed formations from merely changing their designation. Effective supervision will reduce the forces available to the Kuomintang command."
 MYR_Appeal_to_Bangkok_desc:0 "The frontier with Thailand provides routes by which Li Mi's forces can maintain contact with the outside world. Cooperation from Bangkok would make these routes harder to exploit. A diplomatic approach will improve relations with Thailand while restricting the armed remnants' ability to sustain themselves in Burma."
 MYR_The_Fate_of_Li_Mi_desc:0 "Li Mi's authority holds together forces whose continued presence threatens both Burmese sovereignty and relations with China. Following the approach to Beijing, the government must concentrate pressure on his command and disrupt its control over the scattered units. Weakening that leadership will reduce the remnants' capacity to continue their campaign."
 MYR_Formalize_the_YANSA_Border_desc:0 "Recognition of YANSA must be followed by an understanding over the limits of its authority. An agreed frontier will reduce local clashes and give both administrations grounds for restraining their commanders. The arrangement will strengthen cooperation with the remnants and ease tensions within the Union."
 MYR_Repatriate_the_Kuomintang_Soldiers_desc:0 "International pressure offers a means of removing Kuomintang soldiers without a prolonged campaign in the Shan hills. Burma should organize and monitor their departure for Taiwan, checking that armed units leave rather than simply surrendering obsolete weapons. Each evacuation will reduce the military strength of the forces remaining on Burmese soil."
 MYR_Expel_the_Kuomintang_Settlers_desc:0 "Diplomatic arrangements cannot settle the problem if armed Kuomintang settlements remain beyond Rangoon's authority. With American and Thai cooperation established, the army can move against the remaining bases and prepare a wider campaign to expel them. These operations will weaken the remnants and give Burmese commanders further experience in frontier warfare."
 MYR_Treaty_of_Friendship_with_Beijing_desc:0 "Cooperation against Li Mi's forces has created an opportunity for a broader understanding with Beijing. A treaty of friendship and non-aggression will affirm that neither country should use the frontier as a base against the other. It will improve relations with the People's Republic and provide a formal safeguard against renewed confrontation."
 MYR_The_Shan_States_Question_desc:0 "The Shan sawbwas entered the Union with assurances that their internal affairs would be respected. Rangoon must now reconcile those undertakings with demands for closer administration and security in the frontier states. Bringing the question before the government will establish the political basis for choosing between accommodation and coercion."
 MYR_Modernize_the_Shan_States_desc:0 "Poor communications keep much of the Shan country beyond the routine reach of the Union administration. New roads and additional room for construction will improve access to markets and government services. They will also make it easier for Rangoon to extend Bamar administrative practices into the states."
 MYR_The_Kokang_Question_desc:0 "Kokang's Chinese-speaking population and hereditary authorities occupy a sensitive position on the frontier with Yunnan. The reach of the Union government remains limited, while armed groups and the opium trade complicate its relations with local leaders. Rangoon must settle its policy toward Kokang before these frontier arrangements harden beyond its influence."
 MYR_Recognize_Kokang_Independence_desc:0 "Kokang's leaders may be more willing to cooperate with Rangoon if their separate authority is recognized. The government should offer recognition and commit itself to defending Kokang's independence. This accommodation will improve local confidence in Burma and open a route toward an autonomous settlement."
 MYR_Tolerate_the_Opium_Trade_desc:0 "Opium provides income and influence to frontier authorities whom Rangoon lacks the means to replace. Tolerating the trade will secure cooperation in Kokang and give the government greater political room to act. The compromise will undermine public order and provoke objections from China and Thailand."
 MYR_Invade_Kokang_desc:0 "The government can reject a separate settlement for Kokang and prepare to impose its authority by force. Military occupation would extend Bamar administration into a district long governed through its own local arrangements. This policy will authorize a campaign against Kokang, rather than secure its submission by negotiation."
 MYR_The_Mujahid_Revolt_desc:0 "Mujahid insurgents in northern Arakan challenge the government's authority near the frontier with East Pakistan. Their demands grow out of disputes over local power and the position of the area's Muslim population within Burma. Reviewing the army's experience there will help the government organize its response to the revolt."
 MYR_Burmanize_the_Rohingya_desc:0 "Officials who favour a uniform administration argue that the Muslim districts of northern Arakan must be brought under Burmese-language government. Extending Bamar administrative practices will make these communities more subject to Rangoon's institutions. The policy addresses central control rather than the insurgents' demands for a separate political settlement."
 MYR_Tolerate_the_Islamic_Faith_desc:0 "Muslim religious life in northern Arakan need not be treated as evidence of allegiance to the Mujahids. Protecting worship and allowing communities to maintain their religious institutions can distinguish the government's authority from a campaign against Islam. This assurance will improve Rohingya confidence in the Union."
 MYR_Buddhist_Missions_in_Arakan_desc:0 "Government support for Buddhist missions can extend the influence of the majority religion in northern Arakan. Monks and religious institutions will reinforce the cultural policy accompanying the expansion of Burmese administration. The programme will advance assimilation among communities whose religious life has remained distinct."
 MYR_Found_the_Mayu_Frontier_District_desc:0 "A separate frontier district around the Mayu region offers a means of addressing Muslim concerns without accepting the insurgents' territorial demands. Rangoon should establish a distinct administrative arrangement and open the way to local autonomy. This concession will improve Rohingya willingness to cooperate with the Union."
 MYR_Destroy_the_Mujahid_Remnants_desc:0 "The army must pursue the remaining Mujahid bands after the government's efforts to restrict their outside support. Coordinated operations against their bases will reduce the insurgents' fighting strength and prepare a final campaign where necessary. Commanders will gain further experience in the difficult frontier country."
 MYR_U_Seinda_s_Revolt_desc:0 "U Seinda, a Buddhist monk and Rakhine nationalist, leads armed resistance to Rangoon's authority in Arakan. His movement draws on grievances over the region's position within Burma, even as communist forces pursue their own campaigns there. The government must assess this distinct rebellion and organize a response suited to local conditions."
 MYR_Cut_Rakhine_Supply_Lines_desc:0 "U Seinda's followers depend on routes connecting their bases with food, recruits and weapons. Blocking those routes will weaken their forces and extend the reach of the Union administration. The army should concentrate on isolating the armed movement before attempting a wider offensive."
 MYR_Tolerate_Rakhine_Autonomy_desc:0 "Rakhine demands for local government need not be answered solely by military occupation. Accepting a measure of autonomy can give regional leaders a reason to negotiate with Rangoon. This policy will improve their confidence in the Union and permit an autonomous settlement if the necessary conditions are met."
 MYR_Operation_Aung_Tayza_desc:0 "With the insurgents' supply routes under pressure, the army can prepare Operation Aung Tayza against U Seinda's movement. The campaign will strengthen Bamar administrative control and authorize further operations to crush the rebellion. Its planning and execution will also develop the army's experience of warfare in Arakan."
 MYR_Rakhine_Alliance_against_the_Communists_desc:0 "Rakhine nationalists and communist insurgents do not share the same objectives, even where both oppose Rangoon. An understanding with regional leaders can direct their cooperation against communist forces instead. The alliance will improve relations with the Rakhine movement and weaken the communists' armed position."
 MYR_The_Fate_of_U_Seinda_desc:0 "Whether through military pressure or accommodation with Rakhine leaders, the government must now settle its conflict with U Seinda's movement. Isolating his remaining armed followers will reduce their capacity to sustain a separate rebellion. A firmer settlement in Arakan will also strengthen public confidence in the Union."
 MYR_Request_Pakistan_Halt_Mujahideen_Funding_desc:0 "Mujahid forces draw on cross-border contacts that Rangoon believes sustain their campaign in northern Arakan. The government should ask Pakistan to halt funding and prevent assistance from reaching the insurgents through East Pakistan. The approach will disrupt rebel strength, though Pakistan's response will determine the diplomatic consequences."
 MYR_Establish_the_Bureau_of_Special_Investigation_desc:0 "Corruption and illicit financial networks weaken the government's efforts to restore its authority. A Bureau of Special Investigation will give the Union a permanent agency to investigate economic offences and trace funds reaching armed movements. Its establishment will extend the state's intelligence machinery beyond the army's field commands."
 MYR_Crackdown_on_the_Shan_desc:0 "Supporters of central rule regard the sawbwas' authority as an obstacle to a unified state. A crackdown will extend Bamar control through a growing military presence, at the cost of Shan confidence in Rangoon. Resentment and dependence on garrisons will accompany this expansion of the central government's reach."
 MYR_National_United_Front_Victory_desc:0 ""
 MYR_Integrate_the_Liberation_Army_desc:0 ""
 MYR_Disband_the_Home_Guards_desc:0 ""
 MYR_Purge_AFPFL_Appointees_desc:0 ""
 MYR_Honor_Aung_Sans_Agreement_desc:0 "The Panglong Agreement promised full autonomy in internal administration for the Frontier Areas. Honouring Aung San's undertaking will reassure Shan leaders that membership of the Union need not extinguish their political rights. The policy will reduce assimilation pressures and open the way to an autonomous settlement."
 MYR_The_Election_of_1952_desc:0 "Burma's first general election is being conducted in stages as insecurity restricts polling across the country. The AFPFL expects its record in the independence struggle to secure a commanding majority, though rebellion and poor turnout will qualify its claim to a national mandate. Bringing the polls to their conclusion will allow U Nu's government to renew its parliamentary authority."
 MYR_Reform_the_Postal_Services_desc:0 ""
 MYR_Increase_Allowances_for_Local_Government_desc:0 ""
 MYR_Request_UN_Assistance_with_the_Chinese_Problem_desc:0 "The presence of Kuomintang troops on Burmese soil is an international dispute as well as a frontier security problem. Bringing the complaint before the United Nations will press the Republic of China to accept responsibility for their withdrawal. International action offers a way to ease the crisis without recognizing Li Mi's authority."
 MYR_Launch_Operation_Bayinnaung_desc:0 "The appeal to Beijing has established a common interest in removing Li Mi's armed remnants from Burma. The Tatmadaw should now prepare Operation Bayinnaung against the bandit bases that sustain his forces in the Shan hills. This offensive will authorize a campaign to crush the remnants and begin reducing the strain of their occupation."
 MYR_Provide_Loans_to_Farmers_desc:0 ""
 MYR_Crackdown_on_Corruption_desc:0 ""
 MYR_The_Korean_War_desc:0 "War between North and South Korea has brought the rivalry of the great powers into open conflict in Asia. Burma must decide how to defend its opposition to aggression without surrendering its freedom of action to either camp. The cabinet should examine the conflict before committing itself to a public position."
 MYR_Condemn_North_Korean_Aggression_desc:0 "The North Korean invasion violates the principle that political disputes cannot be settled by crossing another state's frontier. Burma will publicly condemn the attack and support efforts to defend South Korea. The declaration will improve relations with Seoul and Washington, while alienating Pyongyang, Beijing and Moscow."
 MYR_Coordinate_with_the_Chinese_desc:0 "Following the advisory mission, Burma can support the Chinese and North Korean war effort through closer military cooperation with Beijing. Granting Chinese forces military access will bring an allocation of Chinese small arms for our own depleted stores. The arrangement will rally support for the government's military policy, though it carries Burma well beyond diplomatic criticism of the American intervention."
 MYR_Nationalize_Foriegn_Assets_desc:0 ""
 MYR_Execute_Ne_Win_desc:0 ""
 MYR_Condemn_American_Imperialism_desc:0 "U Nu's government can denounce American intervention in Korea as an attempt to impose a foreign settlement upon an Asian people. Public condemnation will find a sympathetic hearing in Beijing, Pyongyang and Moscow. It will also damage relations with South Korea and the United States, whose representatives will regard the statement as support for their opponents."
 MYR_Purge_the_Trade_Union_Congress_from_the_AFPFL_desc:0 "The removal of Marxist organizers has left the Trade Union Congress's place within the AFPFL unresolved. Thakin Lwin's opposition to the government's foreign policy gives the leadership grounds to demand the removal of communist influence from the union federation. Suspending its affiliation until it complies will reinforce party discipline and strengthen the cabinet's position."
 MYR_Profit_from_the_War_desc:0 "Remaining outside the Korean conflict leaves Burma free to pursue the commercial opportunities created by wartime demand. The government will encourage investment in an arms works and new commercial offices in Rangoon. These facilities will expand domestic production and business activity without committing Burmese troops to the fighting."
 MYR_Expand_Asian_Ties_desc:0 "U Nu's neutralism requires regular dealings with Asian governments, including those whose policies Burma cannot endorse. A wider diplomatic effort will give the cabinet firmer grounds for addressing the wars and frontier disputes affecting the region. Establishing this programme will strengthen its authority to conduct an independent foreign policy."
 MYR_Intervention_in_Korea_desc:0 "A declaration on Korea does not settle whether Burma should take any military part in the conflict. The army staff will examine the requirements of an overseas mission and compare reports from the opposing forces. This preliminary study will develop military planning experience without yet committing men to either side."
 MYR_Korea_Remain_Neutral_desc:0 "Burma's own rebellions leave little room for a military undertaking on the Korean peninsula. The cabinet will rule out an advisory mission while maintaining its right to speak on the conflict. Keeping the army at home will reassure the public and preserve the government's authority for domestic affairs."
 MYR_Advisory_Mission_to_Korea_desc:0 "A small mission of Burmese officers can study the Korean fighting without dispatching a combat formation. Its reports on infantry operations and the supply of armies in the field will inform training at home. The experience will also provide a basis for deciding which side, if either, should receive further military cooperation."
 MYR_Support_South_Korea_desc:0 "The advisory mission gives Burma an opening to extend military cooperation with South Korea. Exchanges with its forces will improve our officers' experience, while American small arms will replenish Burmese stocks. Public backing for this course will strengthen support for the army and earn goodwill in Seoul and Washington."
 MYR_Recognize_the_ROC_desc:0 "Burma can recognize the Republic of China rather than accept Beijing's claim to represent the whole country. This choice will improve relations with the Nationalist government and make Kuomintang forces in Burma more receptive to dealings with Rangoon. The People's Republic will regard recognition as a hostile diplomatic act."
 MYR_Resume_Trade_with_China_desc:0 "Having settled the question of recognition, Burma should restore commercial channels with the Chinese authorities it acknowledges. Merchants and manufacturers need dependable arrangements for obtaining supplies and finding buyers after the disruption of the civil war. Government support for these connections will sustain an expansion of civilian industry in Rangoon."
 MYR_The_Indochina_War_desc:0 "France's war with the Viet Minh confronts Burma with competing claims of national independence and resistance to communist expansion. The State of Vietnam offers a rival Vietnamese government, but its association with France complicates its appeal to former colonial peoples. A cabinet review will establish the political basis for Burma's response."
 MYR_Condemn_Viet_Minh_Nationalism_desc:0 "The government can reject the Viet Minh's claim to speak for all Vietnamese and condemn the use of national liberation to advance communist authority. Burma's own experience of armed communist opposition gives weight to this position. France will welcome the declaration, while relations with the Viet Minh will deteriorate."
 MYR_Condemn_French_Colonialism_desc:0 "Burma's independence movement cannot readily accept France's attempt to preserve its authority in Indochina by force. Rangoon will condemn the colonial war and affirm the right of the peoples of Indochina to determine their own government. The declaration will improve relations with the Viet Minh at the expense of French goodwill."
 MYR_Intervention_in_Indochina_desc:0 "Any Burmese military role in Indochina would depart from the cabinet's usual policy of avoiding foreign commitments. Before taking such a step, the army staff must study the fighting and the practical demands of a mission abroad. This assessment will improve its planning experience without authorizing a combat expedition."
 MYR_Indochina_Remain_Neutral_desc:0 "Neither sympathy for Vietnamese independence nor fear of communism obliges Burma to send military advisers into Indochina. The government will keep its officers out of the conflict and reserve its resources for restoring order within the Union. A clear limit on foreign commitments will strengthen public confidence and the cabinet's freedom of action."
 MYR_Advisory_Mission_to_Indochina_desc:0 "The government can make an exceptional departure from its reserve by sending a small military mission to Indochina. Burmese officers will study operations and compare their experience of insurgency with the methods used there. Their reports will improve army training without requiring the dispatch of combat units."
 MYR_Coordinate_with_the_Viet_Minh_desc:0 "The cabinet can turn contacts established by the advisory mission into direct assistance for the Viet Minh. A consignment of Burmese small arms will support its forces, while continued liaison will give our officers further experience of the war. Such cooperation will strengthen relations with the movement and commit Burma to an unusual military role in an anti-colonial struggle abroad."
 MYR_Support_the_State_of_Vietnam_desc:0 "Bao Dai's State of Vietnam offers a Vietnamese alternative to the communist-led resistance, despite its dependence on France. The government can follow the advisory mission with a shipment of small arms and closer military liaison. This departure from Burmese reserve will develop our officers' experience and earn goodwill from both the State of Vietnam and France."
 MYR_The_Malayan_Emergency_desc:0 "The Malayan Emergency pits British colonial authorities and the Federation's administration against communist guerrillas led by Chin Peng. For Burma, the conflict raises familiar disputes over independence and the legitimacy of armed revolt. A government review will give Rangoon a considered position from which to address the Emergency."
 MYR_Condemn_Chin_Peng_s_Terrorism_desc:0 "Chin Peng's campaign relies on armed coercion as well as appeals to end colonial rule. Burma can condemn attacks on civilians and reject the claim that communist guerrillas alone represent Malaya's people. Britain will welcome a declaration that distinguishes opposition to colonialism from approval of insurgent violence."
 MYR_Condemn_British_Colonialism_desc:0 "Emergency powers cannot settle the question of Malaya's right to independence. Burma will condemn continued British colonial rule and insist that political grievances receive an answer beyond military repression. The statement will strengthen the cabinet's standing as an advocate of Asian independence, while damaging relations with London."
 MYR_Intervention_in_Malaya_desc:0 "A Burmese military commitment in Malaya would carry the government beyond declarations about colonial rule or communist violence. The army staff should first assess the guerrilla campaign and the demands of operating on the peninsula. Studying these problems will improve its planning experience before the cabinet decides whether to send a mission."
 MYR_Malaya_Remain_Neutral_desc:0 "The Emergency does not justify diverting Burmese officers from the Union's own security problems. Rangoon will decline to send an advisory mission and maintain a distinction between diplomatic criticism and military involvement. This restraint will reassure the public and leave the cabinet better placed to address affairs at home."
 MYR_Advisory_Mission_to_Malaya_desc:0 "A small military mission to Malaya can examine jungle operations and the means by which armed groups maintain their rural networks. Its work will be an exceptional foreign undertaking for a government normally wary of military commitments abroad. The officers' reports will provide practical experience for the Burmese army."
 MYR_Coordinate_with_the_MNLA_desc:0 "Following the advisory mission, the cabinet can authorize direct assistance to the Malayan National Liberation Army. A shipment of Burmese small arms and further military liaison will give substance to support for Chin Peng's forces and develop our officers' experience. Arming the guerrillas would mark a sharp departure from neutralist restraint and seriously damage relations with Britain."
 MYR_Support_the_Malayan_Federation_desc:0 "Burma can use its advisory contacts to support the Federation of Malaya's administration against the communist insurgency. Closer military liaison will give Burmese officers additional experience and demonstrate that independence need not be pursued through armed communist revolt. Britain and the Federation's authorities will welcome this unusual extension of Burmese military cooperation."
 MYR_Thai_Burmese_Friendship_Treaty_desc:0 "Burma and Thailand must manage a frontier crossed by traders and armed groups, despite their differing relations with the great powers. A treaty of friendship will affirm their intention to settle disputes through direct negotiation. This undertaking will improve Bangkok's confidence in Rangoon and open the way to more practical agreements."
 MYR_Host_Phibun_s_Visit_desc:0 "An official visit by Prime Minister Phibun will give U Nu an opportunity to demonstrate that good relations with Thailand need not depend on agreement over every international question. Talks in Rangoon can place the friendship treaty before the public as a working policy. A successful reception will strengthen confidence in the cabinet and its conduct of foreign affairs."
 MYR_Thai_Trade_Agreement_desc:0 "The friendship treaty should be followed by arrangements that make lawful commerce between Burma and Thailand easier to conduct. Improved roads and transport facilities in the Union will help merchants bring goods to market. The agreement will give the government a practical achievement to set beside its diplomatic assurances."
 MYR_Formalize_the_Thai_Border_desc:0 "An agreed understanding of the frontier will give Burmese and Thai officials a firmer basis for controlling movement across it. Closer supervision can restrict the routes supplying Kuomintang forces in Burma and reduce their military strength. More dependable border administration will also reassure communities unsettled by the passage of armed bands."
 MYR_Tolerate_the_Talaku_desc:0 "The Talaku's Karen religious polity straddles the frontier and acknowledges spiritual authorities outside the ordinary district administration. Rangoon can tolerate its communal arrangements rather than attempt to dissolve them by force. This accommodation will improve Karen confidence in the Union, though Bangkok will object to an arrangement that leaves a separate authority along the border."
 MYR_Annex_the_Talaku_Lands_desc:0 "The government can reject the Talaku's separate authority and bring its settlements under Union administration. Establishing Burmese officials and enforcing their jurisdiction will extend Bamar control and give the army further experience of frontier operations. Karen confidence in Rangoon will suffer, and Thailand will resent a forcible assertion of authority in this sensitive border region."
 MYR_Tatmadaw_Ray_desc:0 ""
 MYR_Increase_Landing_Capabilities_desc:0 ""
 MYR_Increase_Coastal_Defense_Facilities_desc:0 ""
 MYR_Establish_Coastal_Radar_Facilities_desc:0 ""
 MYR_Emphasize_River_Combat_Training_desc:0 ""
 MYR_Tatmadaw_Kyi_desc:0 ""
 MYR_Recovering_from_the_Karan_Defections_desc:0 ""
 MYR_Utilize_Captured_Weapon_Caches_desc:0 ""
 MYR_Develop_Counterinsurgency_Tactics_desc:0 ""
 MYR_Focus_on_Jungle_Warfare_Training_desc:0 ""
 MYR_Tatmadaw_Lay_desc:0 ""
 MYR_Import_Supermarine_Seafires_and_Spitfires_desc:0 ""
 MYR_Establish_the_Mingaladon_Air_Base_desc:0 ""
 MYR_Purchase_Additional_Vampires_desc:0 ""
 MYR_Purchase_American_Helicoptors_desc:0 ""
 MYR_American_Loans_for_Rice_Paddy_Development_desc:0 ""
 MYR_Establish_New_Agricultural_Schools_desc:0 ""
 MYR_Expand_Educational_Access_desc:0 ""
 MYR_The_Democratization_of_Villages_desc:0 ""
 MYR_Reject_Neutralism_desc:0 ""
 MYR_Request_Soviet_Advisors_desc:0 ""
 MYR_Request_Soviet_Sino_Economic_Assistance_desc:0 ""
 MYR_Cooperate_with_Domestic_Capitalists_desc:0 ""
 MYR_Implement_Autonomy_for_Ethnic_Minorities_desc:0 ""
 MYR_Nationalize_Trade_desc:0 ""
 MYR_An_End_to_YANSA_desc:0 ""
 MYR_Rally_the_Burmese_Workers_Party_desc:0 ""
 MYR_A_Renewed_War_on_the_Communists_desc:0 ""
 MYR_Sack_Political_Cabinet_Appointees_desc:0 ""
