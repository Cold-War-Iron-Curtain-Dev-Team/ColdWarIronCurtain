l_english:
 # Decisions: United States
 CWIC_interplay_USA_debrief_defector: "Debrief a Bloc Defector"
 CWIC_interplay_USA_debrief_defector_desc: "A scientist from the other side of the Iron Curtain has come over. The Soviet Division wants to know what he knows about Soviet work on the mind. He may know a great deal, or invent it."
 CWIC_interplay_debrief_mission: "Debriefing the Defector"
 CWIC_interplay_debrief_mission_desc: "Sessions at a safe house in Virginia. The account is assessed when the debriefing ends."
 CWIC_interplay_debrief_special_mission: "Special Interrogation"
 CWIC_interplay_debrief_special_mission_desc: "The defector is held under the special protocol. The account is assessed when the sessions end."
 CWIC_interplay_USA_leak_moscow_file: "Leak the Moscow File"
 CWIC_interplay_USA_leak_moscow_file_desc: "Pass what we hold on the Soviet program to a friendly magazine abroad. It costs Moscow scrutiny; it costs us a source."
 CWIC_interplay_USA_brief_appropriations: "Brief the Appropriations Staff"
 CWIC_interplay_USA_brief_appropriations_desc: "Show the committee staff what the Soviets are said to be doing with the mind. The money follows the fear."
 CWIC_interplay_debrief_tt: "Choose how the defector is debriefed. A usable account adds §G1 hold§! on the Soviet program; a fabricated one raises the §Rmirror race§! by 1 instead."
 CWIC_interplay_leak_moscow_file_tt: "Spends §Y1 hold§!. If the Soviet Union sits in a running Directorate, Directorate scrutiny rises by §R8§!. Soviet scrutiny rises by §R1§!, and Moscow must answer.\nEach side can leak twice, at least a year apart."
 CWIC_interplay_brief_tt: "Spends §Y1 hold§! for §G30 Political Power§!. The §Rmirror race§! rises by 1."

 # Decisions: Soviet Union
 CWIC_interplay_SOV_compile_disclosures: "Compile Western Disclosures"
 CWIC_interplay_SOV_compile_disclosures_desc: "The Americans have published their own misconduct in hearings and reports. Index it for later use."
 CWIC_interplay_SOV_task_rezidentura: "Task the Rezidentura"
 CWIC_interplay_SOV_task_rezidentura_desc: "The American program is leaking. Have the Washington rezidentura collect what is falling out."
 CWIC_interplay_rezidentura_mission: "Rezidentura Collection"
 CWIC_interplay_rezidentura_mission_desc: "The Washington rezidentura is working the program's leaks."
 CWIC_interplay_SOV_release_american_file: "Release the American File"
 CWIC_interplay_SOV_release_american_file_desc: "Place what we hold on the American program with a sympathetic weekly abroad, and let the Western papers pick it up."
 CWIC_interplay_SOV_brief_presidium: "Brief the Presidium"
 CWIC_interplay_SOV_brief_presidium_desc: "Tell the Presidium what the Americans are doing with the mind. Funding follows alarm."
 CWIC_interplay_compile_tt: "Adds §G1 hold§! on the American program."
 CWIC_interplay_rezidentura_tt: "A 90-day collection: §G70%§! chance of §G1 hold§! on the American program."
 CWIC_interplay_release_american_file_tt: "Spends §Y1 hold§!. American exposure rises by §R6§!, or §R9§! if their records were destroyed, and Washington must answer. For a member of a running Directorate, coordination rises by §G3§!.\nEach side can leak twice, at least a year apart."

 # 1972: the DIA study
 cwic_interplay.1.t: "Controlled Offensive Behavior – USSR"
 cwic_interplay.1.d: "The Defense Intelligence Agency has circulated a study prepared by an Army medical-intelligence officer. It surveys Soviet and Czechoslovak work on telepathy, hypnosis and 'psychotronic' devices, and warns that the Soviets may one day turn such methods against American personnel.\n\nMost of its sources are open Soviet publications and a popular paperback. It contains no evidence that anything works. It is also the best argument for our budget that anyone has written in years."
 cwic_interplay.1.a: "Circulate it to the program offices."
 cwic_interplay.1.b: "Send it back for sourcing."
 cwic_interplay.1.a_tt: "Exposure rises by §R1§!. The §Rmirror race§! rises by 1."
 cwic_interplay.1.b_tt: "The study stays with the analysts."

 # The defector
 cwic_interplay.2.t: "A Scientist Comes Over"
 cwic_interplay.2.d: "A research scientist from a Soviet-bloc institute has crossed to the West and asked for asylum. He says he worked down the corridor from a laboratory studying 'biological communication', and he is eager to talk.\n\nThe Soviet Division wants him debriefed. The program office has its own suggestion."
 cwic_interplay.2.d_annex: "A physicist from an East German institute has crossed in Berlin. His name was on the list the MfS kept of everyone its psychotronics review assessed, and he knew it: that is why he left. He says he can describe the Soviet laboratories the review was built to check.\n\nThe Soviet Division wants him debriefed. The program office has its own suggestion."
 cwic_interplay.2.a: "Debrief him by the book."
 cwic_interplay.2.b: "Use the special interrogation protocol."
 cwic_interplay.2.a_tt: "A 60-day debriefing with a §G60%§! chance of a usable account, §G+20%§! while the MfS annex is in use."
 cwic_interplay.2.b_tt: "Recorded harm rises by §R2§! and exposure by §R2§!. A 30-day interrogation under drugs and hypnosis, with an §G85%§! chance of a usable account, §G+20%§! while the MfS annex is in use."

 cwic_interplay.3.t: "The Debriefing Ends"
 cwic_interplay.3.d_success: "The defector's account holds together: names, buildings, budgets, and the plain admission that the laboratories have found nothing they can repeat. It is leverage, not proof. The Soviet Division adds it to the file."
 cwic_interplay.3.d_fabricated: "The defector's story grew with every session: wards of hypnotized soldiers, a machine that kills at a distance. None of it checks out. The Soviet Division has flagged him as a fabricator, but the transcripts are already on the program office's desk."
 cwic_interplay.3.a: "Add it to the Soviet Division's file."
 cwic_interplay.3.b: "Flag the source."
 cwic_interplay.3.a_tt: "§G+1 hold§! on the Soviet program."
 cwic_interplay.3.b_tt: "The §Rmirror race§! rises by 1."

 # The rezidentura
 cwic_interplay.5.t: "The Rezidentura Reports"
 cwic_interplay.5.d_success: "The Washington rezidentura has assembled a file from what the American program is losing: contractor gossip, an indiscreet consultant, a university grant with an odd sponsor. It describes what the Americans are doing to people, not anything that works."
 cwic_interplay.5.d_failed: "The rezidentura's sources have dried up. Either the Americans tightened their compartments, or there was less to find than their press suggested."
 cwic_interplay.5.a: "File it."
 cwic_interplay.5.b: "Close the tasking."
 cwic_interplay.5.a_tt: "§G+1 hold§! on the American program."

 # Leaks land
 cwic_interplay.10.t: "A Soviet Disclosure"
 cwic_interplay.10.d: "A pro-Soviet weekly in New Delhi has printed what it says are internal documents of an American program of drug and hypnosis experiments on unwitting subjects. Western papers have picked it up, and Radio Moscow is reading it in six languages.\n\nSome of it is forged. Some of it is not."
 cwic_interplay.10.a: "Rebut it."
 cwic_interplay.10.b: "No comment."
 cwic_interplay.10.c: "Acknowledge the old program."
 cwic_interplay.10.a_tt: "Exposure falls by §G3§!."
 cwic_interplay.10.c_tt: "The program is already public and closed. Saying so costs nothing."
 cwic_interplay.11.t: "A Western Disclosure"
 cwic_interplay.11.d: "A West German magazine has printed what it calls the minutes of a Soviet laboratory for 'psychotronic' research, with names. Radio Liberty is broadcasting it nightly. The Academy wants to know who released the minutes; the Central Committee wants to know why they exist."
 cwic_interplay.11.a: "Denounce it as a provocation."
 cwic_interplay.11.b: "Let it pass."
 cwic_interplay.11.a_tt: "For a member of a running Directorate, scrutiny falls by §G4§!."
 CWIC_interplay_soviet_disclosure: "Soviet Disclosure Campaign"
 CWIC_interplay_soviet_disclosure_desc: "Moscow repeats the story daily, and every denial keeps it in the news."
 CWIC_interplay_western_disclosure: "Western Disclosure Campaign"
 CWIC_interplay_western_disclosure_desc: "Western radio repeats the story nightly, and every denial keeps it on the air."

 # Budget pressure
 cwic_interplay.20.t: "The Gap Briefing"
 cwic_interplay.20.d: "Appropriations staff have asked the question directly: are the Soviets ahead in research on the mind?\n\nOur own files say that nobody, on either side, has a method that works. Our budget says otherwise."
 cwic_interplay.20.a: "Tell them we are behind."
 cwic_interplay.20.b: "Tell them nobody has a method."
 cwic_interplay.20.a_tt: "Exposure rises by §R3§!. The §Rmirror race§! rises by 1."
 cwic_interplay.20.b_tt: "The §Gmirror race§! falls by 1."
 cwic_interplay.21.t: "The Ministry's Question"
 cwic_interplay.21.d: "The Central Committee's defense department has asked whether the Americans are ahead in research on the mind.\n\nThe appraisal says nobody has a method. The budget line says otherwise."
 cwic_interplay.21.a: "Report that the Americans are ahead."
 cwic_interplay.21.b: "Report that nobody has a method."
 cwic_interplay.21.a_tt: "For a member of a running Directorate, scrutiny rises by §R5§!. The §Rmirror race§! rises by 1."

 # After the Soviet program
 cwic_interplay.30.t: "The Moscow Files"
 cwic_interplay.30.d: "With the Soviet program closed, its minutes have reached the Soviet Division: twenty years of appraisals, demonstrations and controlled repeats.\n\nThey found what we found. Nothing worked."
 cwic_interplay.30.a: "Keep them at the Soviet Division."
 cwic_interplay.30.b: "Let the reviewers read them."
 cwic_interplay.30.a_tt: "§G+1 hold§!, for briefings only: there is no Soviet program left to leak against."
 cwic_interplay.30.b_tt: "The §Gmirror race§! falls by 2."

 # What the defector knew
 cwic_interplay.40.t: "What the Defector Knew"
 cwic_interplay.40.d: "The official our people brought out sat on the committee that funded the bloc's psychotronics work. He has no evidence that any of it works, and a great deal of evidence about who paid for it."
 cwic_interplay.40.a: "Add it to the file."
 cwic_interplay.40.a_tt: "§G+1 hold§! on the Soviet program."
 cwic_interplay.41.t: "What the Defector Knew"
 cwic_interplay.41.d: "The American our people brought out worked as a contractor for one of their behavioral programs. He has names, sites and invoices, and no evidence that anything worked."
 cwic_interplay.41.a: "Add it to the file."
 cwic_interplay.41.a_tt: "§G+1 hold§! on the American program."

 # June 1977: The Moscow Correspondent & Petukhov Manuscript (Toth incident)
 cwic_interplay.50.t: "The Correspondent and the Petukhov Manuscript"
 cwic_interplay.50.d: "Officers of the Second Chief Directorate have detained an American newspaper correspondent on a Moscow street moments after a biophysicist from a state institute handed him a typed paper on 'psi-particles' and biological telemetry. The biophysicist's paper is speculative nonsense, but the institute stamp on its cover is real.\n\nIf we interrogate the correspondent for receiving state secrets, we gain leverage—and convince Washington that our psychotronics work is a guarded military program. If the Academy certifies that the paper contains no secrets, the incident ends quietly."
 cwic_interplay.50.a: "Detain the correspondent and classify the manuscript as an unauthorized disclosure."
 cwic_interplay.50.b: "Certify that the manuscript contains no state secrets and expel him quietly."
 cwic_interplay.50.a_tt: "Gains §G10 Political Power§!. Scrutiny §R+4§!, §G+1 hold§! on the American program, and the §Rmirror race§! rises by 1. Washington will respond."
 cwic_interplay.50.b_tt: "Costs §Y10 Political Power§!. Scrutiny §G-3§!. Washington will be notified."

 cwic_interplay.51.t: "The Moscow Detention"
 cwic_interplay.51.d_detained: "For four days the KGB interrogated the Los Angeles Times correspondent in Moscow after a Soviet biophysicist handed him an unpublished manuscript on 'psi-particles' and telepathy. Before releasing him to the embassy, Soviet investigators had a physics institute certify that the paper disclosed 'state secrets.'\n\nOur scientific analysts doubt the biophysicist's equations mean anything at all. Program advocates on the Hill, however, point out that the KGB does not arrest foreign correspondents over subjects the Soviet state considers worthless."
 cwic_interplay.51.d_dismissed: "A Soviet biophysicist handed the Los Angeles Times correspondent in Moscow an unpublished paper on 'psi-particles' before being ushered away by security officers. Rather than charge the reporter with receiving state secrets, the Soviet Academy certified that the paper was unverified speculation and put him on a flight home.\n\nProgram advocates still want the incident cited in closed defense briefings; the Soviet Division sees ordinary press harassment."
 cwic_interplay.51.a: "Cite the incident to congressional appropriators as proof of Soviet secrecy."
 cwic_interplay.51.b: "Treat it as routine press harassment and file the manuscript without alarm."
 cwic_interplay.51.a_tt: "Gains §G15 Political Power§!. Exposure §R+3§!, the §Rmirror race§! rises by 1, and if Moscow detained the correspondent for state secrets, we gain §G+1 hold§! on the Soviet program."
 cwic_interplay.51.b_tt: "Costs §Y10 Political Power§!. Exposure §G-3§! and the §Gmirror race§! falls by 1."

 # May 1988: The Esalen-Moscow Exchange Delegation
 cwic_interplay.60.t: "The Citizen-Diplomacy Delegation Returns from Moscow"
 cwic_interplay.60.d: "Under the new cultural-exchange protocols, a private delegation of California writers, psychologists, and parapsychology enthusiasts has returned from two weeks of informal visits to Moscow laboratories. Their trip notes are filled with dramatic accounts of Soviet ministry institutes, copper-screened rooms, and 'bio-energetic' healers.\n\nThe Soviet Division notes that the visitors saw only what their hosts chose to show them. Defense contractors in Washington are already asking for copies of the trip report."
 cwic_interplay.60.a: "Archive the delegation's notes in the Mirror File without endorsing their claims."
 cwic_interplay.60.b: "Circulate the trip report to defense committees to protect the unit's budget."
 cwic_interplay.60.a_tt: "Costs §Y10 Political Power§!. Exposure §G-2§! and the §Gmirror race§! falls by 1."
 cwic_interplay.60.b_tt: "Gains §G10 Political Power§!. Exposure §R+4§! and the §Rmirror race§! rises by 1."

 cwic_interplay.61.t: "The American Visitors at the Institute"
 cwic_interplay.61.d: "An American citizen-diplomacy delegation interested in 'human potential' and parapsychology has spent the week touring Moscow physiology and radio-engineering institutes. Several laboratory directors have seized the occasion to tell ministry sponsors that the Americans are pouring millions of dollars into the same field and that Soviet stipends must be expanded to keep pace.\n\nMethodologists from the Academy of Sciences ask that any joint demonstrations be recorded under strict negative controls."
 cwic_interplay.61.a: "Require Academy methodologists to oversee the visits and record negative controls."
 cwic_interplay.61.b: "Use the American delegation's interest to justify continued ministry stipends."
 cwic_interplay.61.a_tt: "Costs §Y10 Political Power§!. Scrutiny §G-3§! and the §Gmirror race§! falls by 1."
 cwic_interplay.61.b_tt: "Gains §G10 Political Power§!. Scrutiny §R+4§! and the §Rmirror race§! rises by 1."

 # Records room: card 18
 USA_mkultra_gui_x18_title: "The Mirror File"
 USA_mkultra_gui_x18_owner: "CIA Soviet Division, with DIA liaison"
 USA_mkultra_gui_x18_claim: "Whether Soviet work on the mind justifies American urgency. Soviet claims are recorded as claims: nothing in this file is evidence that a method works on either side."
 USA_mkultra_gui_x18_commitment: "No standing budget: debriefings and leaks are paid as they happen"
