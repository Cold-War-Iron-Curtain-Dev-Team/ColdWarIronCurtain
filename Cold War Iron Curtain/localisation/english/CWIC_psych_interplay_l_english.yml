 USA_mkultra_gui_x18_stage_rising: "§YAlarm rising§!"
 USA_mkultra_gui_x18_stage_alarm: "§RMutual alarm§!"
 USA_mkultra_gui_x18_stage_runaway: "§RRunaway alarm§!"
 USA_mkultra_gui_x18_disposition: "§YHolds [?global.CWIC_interplay_west_holds|0]/3, leaks [?global.CWIC_interplay_west_leaks|0]/2§!"
 USA_mkultra_gui_x18_disposition_published: "§gSoviet files read; nothing found§!"
 USA_mkultra_gui_x18_appraisal_open: "The file records what each side says the other is doing. Neither side's claims have been shown to work."
 USA_mkultra_gui_x18_appraisal_fabricator: "One defector's account grew with every session. It was flagged as fabricated, and cited in budget requests anyway."
 USA_mkultra_gui_x18_appraisal_alarm: "Each side now cites the other's claims to justify its own budget. The claims themselves have not changed."
 USA_mkultra_gui_x18_appraisal_published: "The Soviet minutes, read by our own reviewers, record twenty years of work that found nothing. So does ours."
