 # Warsaw Pact records room: card 8
 CWIC_interplay_wp_stage_alarm: "Stage: Mutual alarm"
 CWIC_interplay_wp_stage_both: "Stage: Claims circulating on both sides"
 CWIC_interplay_wp_stage_soviet: "Stage: Soviet assessment circulating"
 CWIC_interplay_wp_disposition_west_leak: "Western disclosure circulated; claims unverified"
 CWIC_interplay_wp_disposition_east_leak: "American files released; claims unverified"
 CWIC_interplay_wp_method: "Urgency adjustments, leaks and briefings move pressure and Political Power only. No research crosses the divide."

 # Final ledger (cwic_mkultra.880) and the Soviet epilogue (cwic_sov_psych.4)
 CWIC_interplay_empty: ""
 CWIC_interplay_ledger_1994_sold: "In the mid-nineties retired Moscow contractors sold their old diagrams and memoirs to Western television crews; nothing in them worked either."
 CWIC_interplay_ledger_1994_licensed: "In the nineties the Moscow institutes licensed their cosmonaut bio-telemetry patents while the psychotronics folders stayed closed."
 CWIC_interplay_ledger_1994_sealed: "Even after 1991 the Russian Academy kept the old ministry psychotronics archives sealed against commercial buyers."
 CWIC_interplay_ledger_published: "The Soviet minutes reached us in 1991; our reviewers read them, and they found what we found."
 CWIC_interplay_ledger_both_leaked: "Each side leaked the other's files. Neither leak described a method that worked."
 CWIC_interplay_ledger_east_leaked: "Moscow released our files to the world press; most of what it printed was true."
 CWIC_interplay_ledger_west_leaked: "We released theirs. It embarrassed them and proved nothing."
 CWIC_interplay_ledger_incidents_alarm: "From the 1977 Moscow correspondent detention to the 1988 exchange trips, every contact across the curtain was used to argue for larger budgets."
 CWIC_interplay_ledger_incidents_skeptical: "Neither the 1977 Moscow manuscript affair nor the 1988 exchange visits moved the Soviet Division from its skeptical assessment."
 CWIC_interplay_ledger_race: "For years, each side's budget ran on the other side's claims."
 CWIC_interplay_ledger_file: "The Soviet Division kept a file on the other program. It never showed that anything worked."
 CWIC_interplay_sov_note_both: "\n\nThe Western press printed our minutes, and we printed theirs. Neither described a method."
 CWIC_interplay_sov_note_west: "\n\nThe Western press printed our minutes. They described a program, not a method."
 CWIC_interplay_sov_note_east: "\n\nWe printed the Americans' files. They described what was done to people, not anything that worked."
 CWIC_interplay_sov_note_controlled: "\n\nFrom the 1977 correspondent affair to the 1988 American delegation visits, Academy methodologists kept foreign claims under negative controls."
 CWIC_interplay_sov_note_stipends: "\n\nBoth the 1977 correspondent detention and the 1988 American visits were cited by institute directors to keep ministry stipends flowing."
 CWIC_interplay_sov_note_race: "\n\nFor years, each side's budget ran on the other side's claims."
