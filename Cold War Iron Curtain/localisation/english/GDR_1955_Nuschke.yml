l_english: 

 GDR_Prime_Minister_Nuschke_55:0 "Prime Minister Nuschke"
 GDR_Prime_Minister_Nuschke_55_desc:0 "Otto Nuschke has secured leadership of the GDR; now we can focus on adopting his proposed reforms."
 GDR_The_Internal_Party_Debate:0 "The Internal Party Debate"
 GDR_The_Internal_Party_Debate_desc:0 "The Party is at a crossroads; some believe that we must follow the principles of socialism while others insist that our focus should be on Christian democratic ideals. We can't get anything done until this is resolved."
 GDR_Embrace_Christian_Realism:0 "Embrace Christian Realism"
 GDR_Embrace_Christian_Realism_desc:0 "Human nature does not allow us to create the perfect and ideal Christian society on Earth, but that doesn't mean we shouldn't try. Adopting Christian realism is our first step. "
 GDR_Respect_the_EKD:0 "Respect the EKD"
 GDR_Respect_the_EKD_desc:0 "We will respect the autonomy of the Evangelical Church in Germany, thus reassuring the people that their faith is not being co-opted by the state."
 GDR_Co_Opt_the_EKD:0 "Co-Opt the EKD"
 GDR_Co_Opt_the_EKD_desc:0 "Through control of the Evangelical Church, we will be able to ensure that our ideas are properly propagated across Germany. The people, however, might take issue with state control over these institutions."
 GDR_Cut_Church_Taxes:0 "Cut Church Taxes"
 GDR_Cut_Church_Taxes_desc:0 "The heavy tax burden on churches is designed to limit their funding, and thus, their ability to spread the good word. This ends now."
 GDR_Amend_The_Law_on_Maternal_and_Child_Protection_and_Womens_Rights:0 "Amend Maternal & Child Protection Laws"
 GDR_Amend_The_Law_on_Maternal_and_Child_Protection_and_Womens_Rights_desc:0 "The Bible teaches us to respect our wives, but simultaneously that their responsibility lies with caring for our children. Laws that undermine or discourage this must be repealed."
 GDR_Allow_Church_Schools:0 "Allow Church Schools"
 GDR_Allow_Church_Schools_desc:0 "We will repeal the laws that forbid religious education institutions from operating within our country. This will ease the burdens of the state as well as promote our beliefs to the younger generations."
 GDR_Investigate_Earlier_Party_Purges:0 "Investigate Earlier Party Purges"
 GDR_Investigate_Earlier_Party_Purges_desc:0 "The purges of previous administrations should be investigated. If injustice was carried out, it must be rectified."
 GDR_The_Death_of_Nuschke:0 "The Death of Nuschke"
 GDR_The_Death_of_Nuschke_desc:0 "Prime Minister Nuschke is not a young man, and his health has been in decline recently. We must make preparations for who will take the reins of government when he is gone."
 GDR_Prime_Minister_Luitpold_Steidle:0 "Prime Minister Luitpold Steidle"
 GDR_Prime_Minister_Luitpold_Steidle_desc:0 "Despite being part of the Catholic minority, Luitpold Steidle is faithful to the ideas of our movement. He shall be our next leader."
 GDR_Prime_Minister_August_Bach:0 "Prime Minister August Bach"
 GDR_Prime_Minister_August_Bach_desc:0 "August Bach is loyal to both socialism and our Christian principles. He shall be our next leader."
 GDR_Launch_Party_Reforms:0 "Launch Party Reforms"
 GDR_Launch_Party_Reforms_desc:0 "With our new Prime Minister formally inaugurated, it is time to launch a series of reforms within the Party to secure the longevity of our government and the wellbeing of the German people."
 GDR_Building_Public_Support:0 "Building Public Support"
 GDR_Building_Public_Support_desc:0 "Without the support of the people, a government is doomed to fail. We will reassure the people that our administration is working for their best interest."
 GDR_Concessions_to_the_Middle_Class:0 "Concessions to the Middle Class"
 GDR_Concessions_to_the_Middle_Class_desc:0 "The middle class chafes under high work quotas and difficult living conditions. We will ease their burdens and in turn muster support for our cause."
 GDR_Introduce_Limited_Market_Socalist_Reforms:0 "Introduce Limited Market Socalist Reforms"
 GDR_Introduce_Limited_Market_Socalist_Reforms_desc:0 "Certain socialist reforms will be reviewed, altered, and implemented to create a balanced economic model."
 GDR_Condemn_the_Crusaders_of_Capital:0 "Condemn the Crusaders of Capital"
 GDR_Condemn_the_Crusaders_of_Capital_desc:0 "The West has too much love of money and ownership, not enough love for God and giving. Societies founded upon these principles cannot survive."
 GDR_A_Review_of_the_Planned_Economy:0 "A Review of the Planned_Economy"
 GDR_A_Review_of_the_Planned_Economy_desc:0 "It is time to seriously consider the benefits and drawbacks of the planned economic model."
 GDR_Increase_Access_to_Farm_Machinery_for_Small_Landowners:0 "Increase Access to Farm Machinery"
 GDR_Increase_Access_to_Farm_Machinery_for_Small_Landowners_desc:0 "Our agriculture is just as important as our industries. By increasing access to new farming machinery, we will make the farmers happy and increase food output."
 GDR_Reduce_Middle_Class_Taxxes:0 "Reduce Middle Class Taxes"
 GDR_Reduce_Middle_Class_Taxxes_desc:0 "The middle class cannot be expected to carry such a heavy tax burden and have enough left over for their needs."
