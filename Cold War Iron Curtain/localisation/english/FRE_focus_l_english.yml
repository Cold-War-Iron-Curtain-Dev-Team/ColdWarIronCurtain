# === CEFEO ===
#### Focus tree: The Metropole branch ####
 FRE_Lobby_the_National_Assembly: "Lobby the National Assembly"
 FRE_Lobby_the_National_Assembly_desc: "The war is won or lost in the Palais Bourbon as surely as on the RC4. Send our best staff colonels to Paris with maps, photographs and casualty figures arranged in the most persuasive order."
 FRE_Streamline_Colonial_Logistics: "Streamline Colonial Logistics"
 FRE_Streamline_Colonial_Logistics_desc: "Between Marseille and Haiphong a rifle passes through eleven depots and loses three weeks. Cut the chain to five and the same convoys will feed twice the war."
 FRE_Manage_the_Press_Corps: "Manage the Press Corps"
 FRE_Manage_the_Press_Corps_desc: "The correspondents will write something; see that they write it from a terrace in Hanoi with a briefing officer at their elbow, not from a field hospital."
 FRE_The_Expeditionary_Budget: "The Expeditionary Budget"
 FRE_The_Expeditionary_Budget_desc: "Bury the corps' funding in the permanent defense estimates where no single vote can kill it. The Assembly may tire of the war, but it will keep paying the floor."
 FRE_Court_the_American_Mission: "Court the American Mission"
 FRE_Court_the_American_Mission_desc: "Washington sees dominoes where Paris sees colonies. If American anxieties can be made to pay for French soldiers, so much the better."
 FRE_A_Telegram_to_Paris: "A Telegram to Paris"
 FRE_A_Telegram_to_Paris_desc: "One clear, confident cable - the situation, the requirements, the prospects. Signed by the Commander-in-Chief, read aloud in the Council of Ministers."

#### Focus tree: Brothers in Arms branch ####
 FRE_Jaunissement: "Jaunissement"
 FRE_Jaunissement_desc: "The 'yellowing' of the war: Vietnamese soldiers under Vietnamese officers holding Vietnamese ground. It is their country; let it increasingly be their army."
 FRE_Arm_the_National_Army: "Arm the National Army"
 FRE_Arm_the_National_Army_desc: "Open the CEFEO depots to Saigon. Every rifle handed to the Vietnamese National Army is a rifle Paris no longer has to man."
 FRE_The_GCMA: "The GCMA"
 FRE_The_GCMA_desc: "The Groupement de Commandos Mixtes Aeroportes: French cadres and highland partisans behind Viet Minh lines. A dirty, deniable, remarkably cheap way to make the enemy garrison his own rear."
 FRE_Joint_General_Staff: "A Joint General Staff"
 FRE_Joint_General_Staff_desc: "One map room, two flags. Operations planned with the Vietnamese National Army from the start rather than communicated to it afterwards."
 FRE_Montagnard_Loyalty: "Montagnard Loyalty"
 FRE_Montagnard_Loyalty_desc: "The peoples of the high country have no love for the lowland communists. Honor the old alliances - salt, silver, rifles and respect."
 FRE_Coordinate_with_Saigon: "Coordinate with Saigon"
 FRE_Coordinate_with_Saigon_desc: "The Cochinchinese authorities, the Emperor's government and the corps have fought three separate wars long enough. Sit everyone at the same table."

#### Focus tree: Indochina operations ####
 FRE_Operation_Pollux: "Operation Pollux"
 FRE_Operation_Pollux_desc: "Castor has established the fortified camp at Dien Bien Phu; its twin must now bring the exposed Lai Chau garrison south. Regular battalions can be flown out, but the Tai partisan columns, their families, and their equipment still face the long march down Route Pavie. We may repeat the historical timetable, screen the road with the mobile reserve, or spend the aircraft needed to lift nearly everyone."
 FRE_Operation_Atlante: "Operation Atlante"
 FRE_Operation_Atlante_desc: "Navarre's plan calls for the destruction of the Viet Minh base in Interzone V and the restoration of the central coast to the State of Vietnam. The undertaking will require mobile groups, landing forces, aircraft, and the young Vietnamese National Army at the same moment that Dien Bien Phu is demanding a northern reserve. We can pursue both ambitions only on paper; in the field, the staff must decide where that reserve belongs."

