# === CEFEO ===
#### Focus tree: The Metropole branch ####
 FRE_Lobby_the_National_Assembly: "Lobby the National Assembly"
 FRE_Lobby_the_National_Assembly_desc: "The war is won or lost in the Palais Bourbon as surely as on the RC4. Send our best staff colonels to Paris with maps, photographs and casualty figures arranged in the most persuasive order."
 FRE_Streamline_Colonial_Logistics: "Streamline Colonial Logistics"
 FRE_Streamline_Colonial_Logistics_desc: "Between Marseille and Haiphong a rifle passes through eleven depots and loses three weeks. Cut the chain to five and the same convoys will feed twice the war."
 FRE_Manage_the_Press_Corps: "Manage the Press Corps"
 FRE_Manage_the_Press_Corps_desc: "The correspondents will write something; see that they write it from a terrace in Hanoi with a briefing officer at their elbow, not from a field hospital."
 FRE_The_Expeditionary_Budget: "The Expeditionary Budget"
 FRE_The_Expeditionary_Budget_desc: "Bury the corps' funding in the permanent defense estimates where no single vote can kill it. The Assembly may tire of the war, but it will keep paying the floor."
 FRE_Court_the_American_Mission: "Court the American Mission"
 FRE_Court_the_American_Mission_desc: "Washington sees dominoes where Paris sees colonies. If American anxieties can be made to pay for French soldiers, so much the better."
 FRE_A_Telegram_to_Paris: "A Telegram to Paris"
 FRE_A_Telegram_to_Paris_desc: "One clear, confident cable - the situation, the requirements, the prospects. Signed by the Commander-in-Chief, read aloud in the Council of Ministers."

#### Focus tree: Brothers in Arms branch ####
 FRE_Jaunissement: "Jaunissement"
 FRE_Jaunissement_desc: "The 'yellowing' of the war: Vietnamese soldiers under Vietnamese officers holding Vietnamese ground. It is their country; let it increasingly be their army."
 FRE_Arm_the_National_Army: "Arm the National Army"
 FRE_Arm_the_National_Army_desc: "Open the CEFEO depots to Saigon. Every rifle handed to the Vietnamese National Army is a rifle Paris no longer has to man."
 FRE_The_GCMA: "The GCMA"
 FRE_The_GCMA_desc: "The Groupement de Commandos Mixtes Aeroportes: French cadres and highland partisans behind Viet Minh lines. A dirty, deniable, remarkably cheap way to make the enemy garrison his own rear."
 FRE_Joint_General_Staff: "A Joint General Staff"
 FRE_Joint_General_Staff_desc: "One map room, two flags. Operations planned with the Vietnamese National Army from the start rather than communicated to it afterwards."
 FRE_Montagnard_Loyalty: "Montagnard Loyalty"
 FRE_Montagnard_Loyalty_desc: "The peoples of the high country have no love for the lowland communists. Honor the old alliances - salt, silver, rifles and respect."
 FRE_Coordinate_with_Saigon: "Coordinate with Saigon"
 FRE_Coordinate_with_Saigon_desc: "The Cochinchinese authorities, the Emperor's government and the corps have fought three separate wars long enough. Sit everyone at the same table."

#### Focus tree: Indochina operations ####
 FRE_Operation_Pollux: "Operation Pollux"
 FRE_Operation_Pollux_desc: "Castor has established the fortified camp at Dien Bien Phu; its twin must now bring the exposed Lai Chau garrison south. Regular battalions can be flown out, but the Tai partisan columns, their families, and their equipment still face the long march down Route Pavie. We may repeat the historical timetable, screen the road with the mobile reserve, or spend the aircraft needed to lift nearly everyone."
 FRE_Operation_Atlante: "Operation Atlante"
 FRE_Operation_Atlante_desc: "Navarre's plan calls for the destruction of the Viet Minh base in Interzone V and the restoration of the central coast to the State of Vietnam. The undertaking will require mobile groups, landing forces, aircraft, and the young Vietnamese National Army at the same moment that Dien Bien Phu is demanding a northern reserve. We can pursue both ambitions only on paper; in the field, the staff must decide where that reserve belongs."

#### Focus tree: Economy branch ####
 FRE_ECO_Restart_Urban_Economy: "Restart Urban Economic Activity"
 FRE_ECO_Restart_Urban_Economy_desc: "Hanoi's shopkeepers cannot reopen on military requisitions alone. Restore deliveries to the markets and get the workshops trading again; a regular day's business will do more for recovery than another circular from headquarters."
 FRE_ECO_Japanese_Bases_Gia_Lam: "Modernize Japanese Bases and Gia Lam Airport"
 FRE_ECO_Japanese_Bases_Gia_Lam_desc: "The airfields and installations left by the Japanese occupation still serve the corps, often with little beyond wartime repairs. Rebuild Gia Lam's facilities and its approaches so aircraft and ground convoys can use the same dependable supply route."
 FRE_ECO_Piastre_Inflation: "The Piastre Inflation Crisis"
 FRE_ECO_Piastre_Inflation_desc: "Armorin's investigation has brought the exchange business onto official desks. Transfers to France promise profits that honest commerce cannot match, while wages buy less in the markets. The treasury must acknowledge the crisis before it can settle on a currency policy."
 FRE_ECO_New_Currency: "Issue a New Currency"
 FRE_ECO_New_Currency_desc: "Issue the Vien-Dong Bac in place of the piastre and bring the currency under a new set of accounts. This should ease inflation, but printing notes is simpler than backing them: the new issue will leave us more reliant on metropolitan support."
 FRE_ECO_Keep_Piastre: "Maintain the Indochinese Piastre"
 FRE_ECO_Keep_Piastre_desc: "The piastre still pays the dockworkers and settles the merchants' bills. Keep it in circulation rather than make every transaction depend on a new currency backed from Paris. The immediate price will be heavier inflation while the old arrangements remain in force."
 FRE_ECO_Resume_Vidanges: "Resume the Societe Generale des Vidanges et Bouages du Tonkin"
 FRE_ECO_Resume_Vidanges_desc: "Hanoi's drains and refuse carts need a functioning operator. Restore the Societe Generale des Vidanges et Bouages du Tonkin to service, repair the water works, and make room for the businesses trying to reopen around them."
 FRE_ECO_Bourgoin_Report: "Implement the Bourgoin Report and Restore the Civilian Economy"
 FRE_ECO_Bourgoin_Report_desc: "Bourgoin's proposals give civilian industry a place in a budget usually claimed by the army. Commit to local manufacturing and a more reliable currency. Imported equipment and metropolitan finance will be needed before these young enterprises can stand on their own."
 FRE_ECO_River_Dikes: "Reinforce the River Dikes and Levees"
 FRE_ECO_River_Dikes_desc: "A breached embankment can wash away the harvest that feeds an entire district. Authorize provincial levee works, with separate funds and labor allotted to each state we hold. The engineers need time to finish before the rivers rise."
 FRE_ECO_Iron_Tungsten_Mines: "Expand the Qui Xa Iron Mine and the Nui Phao Tungsten Mines"
 FRE_ECO_Iron_Tungsten_Mines_desc: "Give Qui Xa and Nui Phao the equipment and transport their workings lack. More iron and tungsten will enter the supply accounts, while the mining services gain experience they can apply to further extraction projects."
 FRE_ECO_Resource_Exploitation: "Emphasize Resource Exploitation and Military Production"
 FRE_ECO_Resource_Exploitation_desc: "Paris wants export receipts and the corps wants military supplies. Put both ahead of civilian industrial expansion. The arrangement will ease some dependence on outside deliveries and pay well, but new factories will scarcely advance under its first allocations, and inflation will worsen."
 FRE_ECO_Hanoi_Hospital: "Expand the Hanoi Hospital and Medical Supply Production"
 FRE_ECO_Hanoi_Hospital_desc: "Hanoi's hospital needs more ward space and a steadier supply of medicines. Fund its expansion and the medical services around it, giving particular attention to illnesses that carry off children before a doctor ever sees them."
 FRE_ECO_Sell_Wild_Lands: "Sell Wild Lands to the Landless Masses"
 FRE_ECO_Sell_Wild_Lands_desc: "Offer land recorded by the administration as uncultivated to families without holdings. The sales will bring money into the treasury and open room for development across the territory. A vacant space on a cadastral sheet is not always vacant ground."
 FRE_ECO_Tonkin_Workers_Syndicate: "Found the Syndicat des travailleurs d'Extreme-Orient du Tonkin"
 FRE_ECO_Tonkin_Workers_Syndicate_desc: "Recognize a workers' syndicate capable of bargaining over wages and conditions in Tonkin's growing industries. Organized labor can help those enterprises develop, though the communists will also gain an audience among workers permitted to speak collectively."
 FRE_ECO_Bo_Ho_Power_Plant: "Modernize the Hanoi Bo Ho Power Plant"
 FRE_ECO_Bo_Ho_Power_Plant_desc: "Bo Ho's machinery cannot carry Hanoi's expanding demand indefinitely. Pay for new thermal generating capacity where we hold the ground, and secure more coal for the capital's power supply. Workshops need electricity through the working day, not promises of it."
 FRE_ECO_Militarize_Haiphong: "Militarize Haiphong Port"
 FRE_ECO_Militarize_Haiphong_desc: "The corps' supplies pass through Haiphong before they reach any forward depot. Enlarge the naval facilities and build coastal defenses around the harbor. Commercial improvements can wait; the immediate appropriation is for keeping the anchorage secure."
 FRE_ECO_Confiscate_Viet_Minh_Assets: "Confiscate Viet Minh Sympathizers' Assets"
 FRE_ECO_Confiscate_Viet_Minh_Assets_desc: "Seize the holdings of those accused of financing the Viet Minh and place productive premises under new management. The treasury and civilian industry will gain, easing pressure on prices. Families and merchants watching their neighbors lose their property will have less confidence in the administration."
 FRE_ECO_Raise_Salaries: "Increase CEFEO Salaries"
 FRE_ECO_Raise_Salaries_desc: "The CEFEO pay tables have fallen behind the cost of living. Raise salaries and give military needs greater weight in the budget to encourage enlistment and steady the garrisons. More piastres in the pay envelopes will also mean more money bidding for scarce goods."
 FRE_ECO_Rice_Paddies: "Maintain Stable Rice Paddy Production"
 FRE_ECO_Rice_Paddies_desc: "Fund agricultural facilities and keep the paddies producing regularly. A dependable local harvest will help the civilian economy become less reliant on outside supplies, but diverting transport and labor into this program will interrupt recovery elsewhere."
 FRE_ECO_Franco_American_Investors: "Invite Franco-American Investors"
 FRE_ECO_Franco_American_Investors_desc: "Offer French and American investors a place in the civilian rebuilding program. Their enterprises will add industrial capacity and help trade recover. The machinery, credit, and commercial decisions they bring will also bind local development more closely to outside interests."
 FRE_ECO_Native_Middle_Classes: "Collaborate with the Native Middle Classes"
 FRE_ECO_Native_Middle_Classes_desc: "Vietnamese merchants and trained professionals already keep much of the civilian economy working. Give them a larger part in administration and enterprise, alongside more accommodating minority policy. Their firms and technical knowledge can support industrial development beyond the old colonial houses."
 FRE_ECO_Campha_Hongai_Mines: "Expand SFCT's Campha and Hon Gai Coal Mines"
 FRE_ECO_Campha_Hongai_Mines_desc: "The Societe francaise des charbonnages du Tonkin can sell more coal than its present workings and transport can deliver. Expand production at Campha and Hon Gai and improve the roads serving them. Increased shipments will bring receipts back to the treasury."
 FRE_ECO_Carrieres_du_Vietnam: "Found the Les Carrieres du Vietnam Company"
 FRE_ECO_Carrieres_du_Vietnam_desc: "Establish Les Carrieres du Vietnam as a vehicle for bringing further local resources into production. Its concessions will support additional rubber supplies and a modest oil allocation, broadening the materials available to the territory's industries."
 FRE_ECO_Import_Military_Trucks: "Import Extra Military Trucks"
 FRE_ECO_Import_Military_Trucks_desc: "Purchase American trucks for the corps and improve a road serving our depots. A thousand additional vehicles will give the quartermasters more than a new entry in the inventory, provided there is a usable route beneath their wheels."
 FRE_ECO_Metropolitan_Economic_Aid: "Request Further Metropolitan Economic Aid"
 FRE_ECO_Metropolitan_Economic_Aid_desc: "Ask France for scheduled deliveries of steel, oil, and rubber. Reliable supplies will let more factory construction proceed despite the demands of the export economy. Each shipment will require political pressure in Paris and spend some of the Assembly's patience."
 FRE_ECO_Import_Foodstuffs: "Import US and French Foodstuffs"
 FRE_ECO_Import_Foodstuffs_desc: "Pay for American and French food supplies and secure agricultural capacity outside the territory. Feeding the towns from abroad will leave more room for local factory construction within the war economy's restrictive allocations."
 FRE_ECO_Tong_Airplane_Factory: "Restart the Tong Airplane Factory Project"
 FRE_ECO_Tong_Airplane_Factory_desc: "Revive the Tong aircraft works project with funds for equipment and industrial premises in the Hanoi region. Two new military production facilities will give the corps a local manufacturing base; aircraft production will still require suitable designs and machinery."
 FRE_ECO_Crackdown_Opium: "Crack Down on Opium and Corruption"
 FRE_ECO_Crackdown_Opium_desc: "Ban opium and pursue the officials who protect its trade. Curtailing the traffic will strengthen public order and reduce pressure on the currency, but the Tai authorities will resent a policy that cuts into established livelihoods and revenues."
 FRE_ECO_Reopen_University: "Reopen the Universite nationale du Vietnam"
 FRE_ECO_Reopen_University_desc: "Reopen the Universite nationale du Vietnam and restore the teaching and research that wartime expedients have displaced. The administration needs engineers and doctors who can work here, and laboratories able to pursue more than the corps' next urgent request."
 FRE_ECO_Tolerate_Opium: "Tolerate the Opium Trade"
 FRE_ECO_Tolerate_Opium_desc: "Allow the opium trade to continue under wartime arrangements that bring rifles and military production within reach. The revenue will help steady our administration while aggravating the currency crisis. The Tai authorities will resent French interference in the trade even under a permissive policy."
 FRE_ECO_Gia_Lam_Airbase: "Expand the Gia Lam Airbase and Military Buildup"
 FRE_ECO_Gia_Lam_Airbase_desc: "Expand Gia Lam's air facilities and authorize the conversion of civilian works to military production. Each conversion will take a factory out of ordinary business while its machinery and labor are prepared for army orders."
 FRE_ECO_Hanoi_Textiles: "Restart Hanoi Textiles and Urban Workshops"
 FRE_ECO_Hanoi_Textiles_desc: "Reopen Hanoi's textile mills and workshops with the commercial offices they need to take orders. More civilian goods should help restrain prices. Practical work in the factories and their agricultural supply chains will also improve our industrial and farming methods."
 FRE_ECO_Tonkin_Railway_Company: "Found the Compagnie du chemin de fer du Tonkin et d'Extreme-Orient"
 FRE_ECO_Tonkin_Railway_Company_desc: "Form a Tonkin railway company and provide it with locomotives for the existing network. Concentrating on rolling stock avoids the larger Vientiane construction scheme, but requisitioning men and supplies for the new undertaking will still disrupt the recovering economy."
 FRE_ECO_Vientiane_Tonkin_Railway: "Construct the Vientiane-Tonkin Railway"
 FRE_ECO_Vientiane_Tonkin_Railway_desc: "Fund a railway between Vientiane and Tonkin, with French locomotives to begin services. Laos will gain an outlet toward the northern ports and our depots a new overland connection. This is a substantial construction bill for a territory still repairing its older lines."
 FRE_ECO_Pyrotechnic_Factories: "Weaponize Pyrotechnic and Chemical Factories"
 FRE_ECO_Pyrotechnic_Factories_desc: "Pay to turn available civilian chemical and pyrotechnic works over to military orders, with additional production secured outside the territory. The corps will gain munitions capacity at the expense of civilian output, interrupting an already uneven recovery."
 FRE_ECO_Resume_Foreign_Trade: "Resume Foreign Trade"
 FRE_ECO_Resume_Foreign_Trade_desc: "Put merchant shipping back on regular routes and approach the Asian governments with which we are at peace. Access to neighboring markets can turn reconstruction into sustained growth. French vessels will help carry the first renewed traffic."
 FRE_ECO_Import_Industrial_Tools: "Import Postwar Industrial Tools and Technical Know-How"
 FRE_ECO_Import_Industrial_Tools_desc: "Purchase modern industrial tools and bring in technicians who can teach their use. Better calculating equipment and construction methods will help local services work through tasks still done by hand or with machinery worn out before the war ended."
 FRE_ECO_Dien_Bien_Phu_Fort: "Prepare the Dien Bien Phu Fort"
 FRE_ECO_Dien_Bien_Phu_Fort_desc: "Commit concrete and construction crews to the Dien Bien Phu positions. Redirecting the war economy's allocations will ease its restrictions on further factory building, but the expenditure will add to inflation. Fortifications must still be held and supplied by troops."
 FRE_ECO_Invest_Ethnostates: "Invest in the Ethnostates' Territories"
 FRE_ECO_Invest_Ethnostates_desc: "Authorize separate development grants for the Tai Federation and the Muong, Tho, Montagnard, and Nung territories. Roads and civilian factories in their administrative centers will give their authorities something tangible to show for cooperation with the corps."
 FRE_ECO_Modernize_Haiphong: "Modernize Haiphong Port"
 FRE_ECO_Modernize_Haiphong_desc: "Enlarge Haiphong's harbor facilities and establish additional dockyards. Better handling and repair capacity will support recovery, ease shortages, and give local enterprise more room to develop. The treasury must meet a large bill before those gains reach the markets."
 FRE_ECO_Invest_Saigon: "Invest in Saigon's Territories"
 FRE_ECO_Invest_Saigon_desc: "Open a civilian investment program for the State of Vietnam. Funds will support factory construction in Vietnamese-held territory, giving Saigon a practical reason to maintain cooperation with a corps whose requisitions it has long been asked to accommodate."
 FRE_ECO_Postwar_Reforms: "Draft Postwar Economic Reforms"
 FRE_ECO_Postwar_Reforms_desc: "Prepare proposals for a civilian economy after the fighting, with attention to the enterprises and provincial services the war has left dependent on military orders."
 FRE_ECO_War_Loot_to_Metropole: "Transport War Loot back to the Metropole"
 FRE_ECO_War_Loot_to_Metropole_desc: "Draw up plans to send accumulated war booty and recoverable stores to France. The inventories must distinguish what the corps can embark from what local services still require."
 FRE_ECO_End_of_the_War: "End of the War?"
 FRE_ECO_End_of_the_War_desc: "Review the economic arrangements made for a war without a fixed end date. Civilian offices and army depots will need different instructions when the fighting stops."
