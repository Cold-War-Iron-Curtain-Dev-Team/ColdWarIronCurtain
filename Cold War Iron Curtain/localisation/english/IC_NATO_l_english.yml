 NATO_Greek_Civil_War_Intervention:0 "Propose Intervention in the Greek Civil War"
 NATO_Greek_Civil_War_Intervention_desc:0 "Reports from Greece indicate that the Democratic Army is nearing victory in the civil war. The fall of the royal government would bring Soviet influence to the Aegean and threaten NATO's position in the eastern Mediterranean. NATO commanders have proposed Operation Aegean Shield: a decisive military intervention to halt the communist advance and help the Greek army defeat the insurgency. The Council must authorize the operation before an offer can be put to the Greek government."

 NATO_Albanian_Civil_War_Intervention:0 "Propose Intervention in the Albanian Civil War"
 NATO_Albanian_Civil_War_Intervention_desc:0 "Reports from Albania indicate that the Free Albania National Committee has launched a revolt in the north of the country against the Hoxha regime. A communist crackdown would subject the Albanian people to further oppression under Soviet-aligned dictatorship. Strategically, the fall of northern Albania would solidify communist control in the Balkans. NATO commanders have proposed an operation codenamed Balkan Shield, which would see NATO forces support the evacuation of anti-communist forces and the Albanian government-in-exile to secure keys locations."


 NATO_GREECE_MOTION_START:0 "§GEmergency Meeting of the NATO Council to motion for Intervention in Greece§!"
 NATO_GREECE_MOTION_UNDER_FIRE:0 "§RThe Soviet Union is at war with Greece.§! Members fear a clash with the Red Army and will be §Rless willing§! to back the motion."
 NATO_ALBANIA_MOTION_START:0 "§GEmergency Meeting of the NATO Council to motion for Intervention in Albania§!"

 #NATO Issues
 NATO_issue_0:0 "No Issue"
 NATO_issue_0_desc:0 "The North Atlantic Council is not currently voting on an issue."


 NATO_issue_10:0 "Intervention in the Greek Civil War"
 NATO_issue_10_desc:0 "The Democratic Army is threatening to defeat the Greek government. NATO commanders have submitted Operation Aegean Shield to the Council: a military intervention to reverse the communist advance and secure a government victory throughout Greece. Approval would authorize an offer of direct assistance to Athens. The operation could deny Moscow a foothold on the Aegean, but Soviet interference could turn the campaign into a costly defeat for the alliance."

 NATO_issue_11:0 "Intervention in the Albanian Civil War"
 NATO_issue_11_desc:0 "Reports from Albania indicate that the Free Albania National Committee has launched a revolt in the north of the country against the Hoxha regime. A communist crackdown would subject the Albanian people to further oppression under Soviet-aligned dictatorship. Strategically, the fall of northern Albania would solidify communist control in the Balkans. NATO commanders have proposed an operation codenamed Balkan Shield, which would see NATO forces support the evacuation of anti-communist forces and the Albanian government-in-exile to secure keys locations."

 NATO_issue_4:0 "The Korean War Contribution"
 NATO_issue_4_desc:0 "Allied contingents serving under the United Nations Command have brought common supply and staff problems before the Council. Members must decide what support they will coordinate, without turning the Korean operation into an Atlantic Treaty obligation."
 NATO_issue_5:0 "West German Accession"
 NATO_issue_5_desc:0 "The North Atlantic Council is debating whether to admit the Federal Republic of Germany to the alliance."
 NATO_issue_5_retry_desc:0 "Following the London and Paris Agreements, the North Atlantic Council reconsiders West German accession, with the Western European Union as the framework for rearmament."
 NATO_issue_5_retried:0 "NATO Issue 5 Retried"
 NATO_issue_6:0 "Scaling Back Political Integration"
 NATO_issue_6_desc:0 "The North Atlantic Council is debating a proposal to loosen the political coordination arrangements between members."
 NATO_issue_7:0 "Joint Force Standardisation"
 NATO_issue_7_desc:0 "The North Atlantic Council is debating a standard equipment and doctrine program for allied forces."
 NATO_issue_9:0 "The Harmel Report"
 NATO_issue_9_desc:0 "The North Atlantic Council is debating a report on the future tasks of the alliance, combining defence with dialogue with the Soviet Union."
 NATO_issue_12:0 "Greek and Turkish Force Dispositions"
 NATO_issue_12_desc:0 "The North Atlantic Council is debating how Greek and Turkish forces will be arranged within the alliance command, a question on which the two members disagree."
 NATO_issue_13:0 "Dual-Track Missile Deployment"
 NATO_issue_13_desc:0 "The North Atlantic Council is debating the deployment of new intermediate-range missiles in Western Europe, paired with arms control talks."
 NATO_issue_14:0 "Spanish Accession"
 NATO_issue_14_desc:0 "The North Atlantic Council is debating the admission of Spain to the alliance."

 NATO_issue_4_resolved:0 "NATO Issue 4 Resolved"
 NATO_issue_5_resolved:0 "NATO Issue 5 Resolved"
 NATO_issue_5_failed:0 "NATO Issue 5 Failed"
 NATO_issue_6_resolved:0 "NATO Issue 6 Resolved"
 NATO_issue_7_resolved:0 "NATO Issue 7 Resolved"
 NATO_issue_8_resolved:0 "NATO Issue 8 Resolved"
 NATO_issue_9_resolved:0 "NATO Issue 9 Resolved"
 NATO_issue_12_resolved:0 "NATO Issue 12 Resolved"
 NATO_issue_13_resolved:0 "NATO Issue 13 Resolved"
 NATO_issue_14_resolved:0 "NATO Issue 14 Resolved"
 NATO_issue_cooldown:0 "NATO Issue Cooldown"
 NATO_outside_integrated_command:0 "Outside NATO Integrated Command"

 NATO_raise_at_council:0 "Raise an Issue at the North Atlantic Council"
 NATO_raise_at_council_desc:0 "Table an issue that our government has a stake in before the North Atlantic Council. Raising an issue costs political power and gives us a leading voice in its vote."
 NATO_issue_proposer_flag:0 "Proposed the Current NATO Issue"
 twrta.6001.t:0 "NATO Endorses Anglo-French Action at Suez"
 twrta.6001.d:0 "The North Atlantic Council has endorsed the actions of Britain and France in the Suez Canal zone. Washington has accepted the verdict with reluctance, warning that the alliance now carries a heavier burden in the Middle East.\n\nThe endorsement strengthens the standing of London and Paris within the alliance, while American officials quietly worry about the damage to relations with Egypt and the wider Arab world."
 twrta.6001.a:0 "The alliance stands together."
 twrta.6002.t:0 "NATO Condemns Suez Intervention"
 twrta.6002.d:0 "The North Atlantic Council has refused to endorse the Anglo-French intervention in Egypt. The split leaves Britain and France isolated within the alliance, and their governments face sharp criticism at home for the humiliation.\n\nAt the same time, the rift has given Moscow an opening to press its claim that the Western powers cannot agree among themselves."
 twrta.6002.a:0 "A bitter lesson."
 NATO_pledge_forces:0 "Pledge Forces to NATO"
 NATO_pledge_forces_desc:0 "Commit troops and manpower to the alliance. Raises our manpower and NATO military cooperation."
 NATO_refuse_burden_sharing:0 "Refuse Burden-Sharing"
 NATO_refuse_burden_sharing_desc:0 "Keep our budget for ourselves. Gains political power, but Washington will resent it for six months and NATO military cooperation falls."
 NATO_demand_consultation:0 "Demand Consultation with Washington"
 NATO_demand_consultation_desc:0 "Ask the United States to consult us before major alliance decisions. Washington must answer."
 NATO_burden_grievance:0 "Burden-Sharing Grievance"
 NATO_consultation_demanded:0 "Demanded NATO Consultation"
 twrta.15001.t:0 "Ally Demands Consultation"
 twrta.15001.d:0 "One of our NATO partners has formally demanded to be consulted before the alliance takes major decisions. Accepting will reassure our allies, while refusing will feed resentment across the alliance."
 twrta.15001.a:0 "Agree to consult them."
 twrta.15001.b:0 "Decline for now."
 NATO_marshall_aid:0 "Marshall-Style Aid to Allies"
 NATO_marshall_aid_desc:0 "Extend American economic aid to the alliance. Raises NATO aid goodwill, which makes members more inclined to support American proposals, and steadies their economies. Goodwill decays each month. Available once every year."
 NATO_aid_goodwill:0 "NATO Aid Goodwill"
 NATO_marshall_aid_cooldown:0 "Marshall Aid Cooldown"

 twrta.5001.t:0 "West Germany Joins NATO"
 twrta.5001.d:0 "The Federal Republic of Germany has been admitted to the North Atlantic Treaty Organization. Allied planners see the new member as the centre of the alliance's defence in Central Europe.\n\nWest German units will be integrated into allied command structures, and the Bundeswehr will train alongside American and British forces.\n\nMoscow has condemned the accession as a provocation."
 twrta.5001.a:0 "A new bulwark in Europe."

 twrta.8001.t:0 "France Reconsiders Integrated Command"
 twrta.8001.d:0 "Paris has reopened the question of the French role in the integrated military structure of NATO. Some ministers argue that foreign officers commanding French troops infringe on national sovereignty.\n\nThe government may withdraw French forces from the integrated command, remaining in the alliance while regaining full control of its army.\n\nAllies in Washington and London have warned that such a move would weaken the alliance's defence planning."
 twrta.8001.a:0 "Withdraw from the integrated command."
 twrta.8001.b:0 "Remain in the integrated command."

 twrta.8002.t:0 "France Leaves the Integrated Command"
 twrta.8002.d:0 "The French government has announced the withdrawal of its forces from the integrated military command of NATO. France remains a member of the Atlantic alliance and will continue to take part in political consultations.\n\nAllied headquarters must now rearrange their plans for the defence of Central Europe without French divisions under their direct command."
 twrta.8002.a:0 "The alliance must adapt."

 twrta.9001.t:0 "The Harmel Report"
 twrta.9001.d:0 "The foreign ministers of the alliance have adopted a report on the future tasks of NATO. It calls for the alliance to pursue detente with the Soviet Union alongside its defence, a policy that rests on military strength and political dialogue.\n\nMember states will keep their defence forces while opening talks on arms control and cooperation."
 twrta.9001.a:0 "A new direction."

 twrta.13001.t:0 "Dual-Track Decision on Theatre Nuclear Forces"
 twrta.13001.d:0 "The alliance has agreed to deploy new intermediate-range missiles in Western Europe while pursuing negotiations with Moscow on the limitation of such weapons.\n\nHost nations in the Netherlands, West Germany, Italy and Belgium must now prepare bases for the new systems, and the political cost of the deployment is expected to be considerable."
 twrta.13001.a:0 "The alliance stands firm."

 twrta.14001.t:0 "Spain Joins NATO"
 twrta.14001.d:0 "Madrid has been admitted to the North Atlantic Treaty Organization after years of diplomatic effort. Spain's position at the entrance to the Mediterranean makes the country a valuable partner for the defence of the alliance.\n\nAllied commanders expect Spanish bases and ports to support naval and air operations in the western Mediterranean."
 twrta.14001.a:0 "Spain takes its place in the West."
 

 TA_NORWAY_MOTION_START:0 "§GEmergency Meeting of the NATO Council to motion for Intervention in Norway§!"

 TA_FORMAL_JOIN_MOTION_START:0 "§GSubmit our formal application to summon a NATO Council Meeting to evaluate our request for membership§!"

 NO_ONGOING_TA_MOTION:0 "§YNo ongoing motion in the North Atlantic Council§!"

 
 NATO_APPLICATION_BILL:0 "[event_target:NATO_toronto_accord_applicant.GetAdjective] Application to Join NATO"

 NATO_issue_3:0 "[event_target:NATO_toronto_accord_applicant.GetAdjective] Application"

 twrta.3001.t:0 "Official Membership in NATO"
 twrta.3001.d:0 "After a period of deliberation, members of NATO have came to a majority agreement and approved our application, granting us membership in NATO."
 twrta.3001.a:0 "Finally!"
 twrta.3002.t:0 "[ROOT.GetAdjective] Membership in NATO"
 twrta.3002.d:0 "Not long ago, [ROOT.GetAdjective] officials expressed deep interest in joining NATO military alliance. It was later confirmed that [ROOT.GetNameDef] submitted an application to join NATO, which was subsequently approved by the majority of members within NATO.\n\nThe spokesperson of NATO made a public statement regarding [ROOT.GetAdjective] entry, giving NATO's warmest welcomes to their latest member state."
 twrta.3002.a:0 "NATO expands."
 twrta.3003.t:0 "NATO Application Rejected"
 twrta.3003.d:0 "Despite our intentions to join NATO, the members of NATO have voted to deny our entry into NATO, citing generic excuses to cover themselves."
 twrta.3003.a:0 "Shame."


 #Stuff
 NATO_INTERVENTION.10.d:0 "In the cabinet room in Athens, the secretary set NATO's offer beside the latest army reports. Another position had fallen before the report reached his desk. Operation Aegean Shield promised allied forces to help the army defeat the Democratic Army and restore government authority throughout Greece.\n\n'Give them our consent,' an officer said. 'With their support, we can still turn this around.'\n\nA minister pushed the army report back across the table. 'And how long before they arrive? Our men need ammunition now. If the Russians answer them, what happens to us?'\n\nThe officer reached for the telephone, then waited. The secretary uncapped his pen and asked what answer he should send to the NATO delegation."
 NATO_INTERVENTION.11.d:0 "NATO officials were stunned to receive news that the Greek government would not offer its support or endorsement of Operation Aegean Shield. Apparently many in the Greek government and military feel the establishment of a government on the Greek islands would simply prolong the conflict unnecessarily and compromise Greek sovereignty. There is also a feeling that a resistance movement or an effort to compromise with the communists can only succeed if Greek leaders remain on mainland Greece. Without support of the Greek government, Operation Aegean Shield cannot be activated."
 NATO_INTERVENTION.12.d:0 "Senior NATO officials have announced the launch of Operation Aegean Shield following the Greek government's acceptance of allied military assistance. The intervention is intended to halt the Democratic Army's advance and secure victory for the government in Athens.\n\nAllied forces are moving into position to support the Greek army. NATO spokesmen stated that the operation would continue until the communist forces were defeated and government authority restored throughout Greece.\n\nThe KKE has denounced the intervention as an attempt to impose the royal government's rule by foreign arms. Moscow has condemned NATO's action, but has yet to announce how it will respond."
 NATO_INTERVENTION.13.d:0 "At a desk in the Kremlin, a Foreign Ministry official read the KKE's appeal for guidance. NATO was sending forces to help the royal government defeat the Democratic Army. The Greek communists wanted to know what support they could count on before committing their remaining strength.\n\n'We cannot ask them to fight Western aircraft with assurances,' he said. 'Tell them to disrupt the operation. They may still break the government army before NATO can save it.'\n\nHis colleague left the message on the desk. 'And if they fail? We will have encouraged them into a battle we cannot win for them. Stand aside, and at least we avoid a wider war.'\n\nA naval officer spread a Black Sea Fleet chart beside the message. Direct intervention could challenge NATO at sea, but it would risk a clash with Western warships. The secretary waited for instructions before drafting the reply to the KKE."
 NATO_INTERVENTION.14.d:0 "NATO has declared Operation Aegean Shield a success following the defeat of the Democratic Army. Allied military support reversed the communist advance and enabled the Greek government to secure victory in the civil war.\n\nThe Provisional Democratic Government has ceased to exist, and the government in Athens has regained authority over the whole country. Greek army units are taking control of the remaining communist strongholds as organized resistance collapses.\n\nSoviet-bloc countries involved in the fighting have ended hostilities with Greece without territorial concessions and agreed to a five-year truce. NATO officials have hailed the result as a vindication of allied intervention, while Moscow has condemned the destruction of the Greek communist movement."
 NATO_INTERVENTION.15.d:0 "NATO commanders have acknowledged the failure of Operation Aegean Shield. The intervention could not prevent the collapse of the Greek government army, and the Democratic Army has secured victory in the civil war.\n\nThe Provisional Democratic Government now rules the whole of Greece. The royal government has fallen, and communist officials are taking over its ministries and military installations. NATO's attempt to reverse the communist advance has ended in a decisive defeat.\n\nThe new Greek authorities have aligned themselves with Moscow, bringing the country into the Eastern Bloc as a Soviet satellite. Allied governments face demands for an inquiry into the failed operation and urgent discussions over the loss of Greece to the Soviet sphere."
 NATO_INTERVENTION.16.d:0 "The NATO led operation Aegean Shield has largely succeeded in establishing a free Greek government on the Greek islands. However, there are concerns that the Greek communists will seek to take these islands back, whether overtly, clandestinely, or through propaganda. A senior Greek official and some NATO ambassadors have floated the idea that we relinquish our administration of Cyprus to the free Greek government. This could give them much greater legitimacy, access to a larger population, and a safe base from which to plan the liberation of Greece. Our own officials are not as convinced as many feel British rule in Cyprus is a force of stability for the region and strategically vital to the United Kingdom. The Cypriote Turks would be opposed and any handover must come with a guarantee for their rights. The Prime Minister and cabinet must decide whether to hand over Cyprus or keep the island."
 NATO_INTERVENTION.17.d:0 "Our Foreign Minister confirms reports that the British are strongly considering the handover of Cyprus to the free Greek government established by NATO on the Greek islands. This is of major concern as our people remain rightly concerned over the Turkish Cypriot people. Turkish Cypriot leaders have also reached out to express their fear of a potential Greek takeover. We should strongly consider sending a high-level team to London to present our deep concerns over the plan. This appears the best move to make, however, there are some who feel we should not involve ourselves and hope the United Kingdom handles the situation with tact."
 NATO_INTERVENTION.18.d:0 "A high-level Turkish delegation recently arrived for talks. The only topic of concern is the Cyprus situation. The Turks are strongly opposed to our discussions of ceding the island to the free Greek government. They feel the Cypriot Turks would become marginalized and the resulting backlash among Turks could dramatically hurt Turkish support for NATO. A possibly acceptable situation for Turkey could be if we only ceded the western half of the island but maintained a presence in the east. They have also "offered" to take over the administration of the eastern half if needed. We can either address the Turkish concerns and only cede parts of the island or stick with our initial decision and cede the whole island. Some in the Foreign Office believe the Turkish government is exaggerating the consequence of ceding all of Cyprus."
 NATO_INTERVENTION.19.d:0 "The British government announced certain Greek majority areas of Cyprus will be handed over to the Aegean islands based free Greek government. Respecting the wishes of Cypriote Greeks was cited as the principal motivation for the decision. However, the government noted it was still obligated to the Cypriote Turkish population and as such, Britain will retain control over the eastern part of the island and that community. The news will provide a major boost for the recently defeated Greek government. The communist Greek authorities condemned the announcement as imperial horse trading."
 NATO_INTERVENTION.20.d:0 "In a joint ceremony, British officials in Cyprus officially handed authority to the free Greek government. The island returns to Greek rule after centuries of Ottoman and British rule. Notable Cypriote Greeks were in attendance and reporters on the ground indicate there is a general sense of enthusiasm among the Cypriote Greeks. However, the mood among the large Cypriote Turkish minority is notably dour. Many of their leaders chose not to attend the ceremony and there are anti-British protests currently taking place in Turkey. This despite the Greek government agreeing to British terms protecting the rights and status of Cypriote Turks. Although the Greek government will enjoy a great boost in terms of its strategic position and political legitimacy, it will eventually have to resolve issues on the island before it can consider plans to deal with the mainland communist Greek regime."
 NATO_INTERVENTION.22.d:0 "Cyprus has been handed over to the people of Greece, after centuries of foreign occupation. The British gave us the island on the condition we guarantee the rights of Cypriote Turks. There are already reports from Cyprus of our people flying flags and celebrating the news. We are to immediately dispatch government and military officials to oversee the transfer of authority. It is vital we do not cause any problems on the island and move quick to establish it as a major cornerstone for the liberation of mainland Greece. Our enemies are loudly condemning the news and no doubt suppressing it, as we are quickly establishing ourselves and unifying all the Greek peoples."
 NATO_INTERVENTION.23.d:0 "The British government, in a carefully worded message, stated it would not cede Cyprus to the democratic Greek government. The British argued the precarious security environment on the island and the need to secure a strong presence in the eastern Mediterranean were of paramount importance and cannot be compromised. Despite the disappointing news, the British also stated it would continue to support our struggle and looks forward to deepening relations and expanding areas of cooperation. This marks a huge blow as Cyprus would have given us greater legitimacy and a strong base from which to plan our eventual liberation of mainland Greece from the communists. We can only hope, in time, that the Cypriote Greeks will eventually rally to our cause and the British can reconsider."
 
 NATO_INTERVENTION.25.t:0 "Aegean Shield Underway"
 NATO_INTERVENTION.25.d:0 "At the State Department's Greek desk in Washington, the duty officer pinned Athens' acceptance above the first movement reports. The royal government had agreed to Operation Aegean Shield. Allied preparations were now being turned into orders, and the Greek army was counting on assistance before its remaining positions gave way.\n\nThe officer checked the messages from the embassy in Moscow again. There was no answer yet to the question pencilled across his briefing: what would the Russians do? He put the latest report into the folder for the morning conference and left a space beneath it for the next cable."
 NATO_INTERVENTION.25.a:0 "Keep me informed of Moscow's reply."

 NATO_INTERVENTION.26.t:0 "Foreign Forces for the King"
 NATO_INTERVENTION.26.d:0 "In the radio room at Democratic Army headquarters, a KKE liaison officer copied the announcement onto the back of a supply request. Athens had accepted Operation Aegean Shield. The Atlantic powers intended to commit forces to save the royal government, just when reports from the front had begun to speak of its defeat.\n\nHe took the sheet to the leadership meeting. The comrades there wanted to know which roads the foreign troops would use and whether their aircraft were already on the way. He had neither answer. Beside the set, the operator waited with the draft appeal to Moscow, asking what help the Party could expect and how it should answer the intervention."
 NATO_INTERVENTION.26.a:0 "Send the appeal to Moscow."

 NATO_INTERVENTION.27.t:0 "Moscow Will Stand Aside"
 NATO_INTERVENTION.27.d:0 "In the State Department's communications room, the duty officer read the cable twice before carrying it upstairs. Moscow had decided against opposing Aegean Shield. Soviet denunciations would continue, but the operation would face neither a Soviet naval challenge nor a new offensive ordered by Moscow.\n\nAt the Greek desk, an army liaison officer moved the cable beside the operational timetable. Without Soviet interference, the commanders expected allied support to settle the campaign within days. He crossed out the question about Russian intervention on his briefing sheet and asked the clerk for the latest report from Athens."
 NATO_INTERVENTION.27.a:0 "Tell the commanders to proceed."

 NATO_INTERVENTION.28.t:0 "No Help from Moscow"
 NATO_INTERVENTION.28.d:0 "At the KKE leadership's meeting table, a secretary read Moscow's reply slowly, looking for a qualification he might have missed. The Soviet Union would not oppose NATO's intervention. There was no promise of ships, no instruction to prepare for Soviet assistance. A commander asked him to read the final passage again.\n\nOutside the room, a courier waited to take news back to the fighting units. Their officers had told the men that the royal government could not last much longer. Now foreign forces were coming to its aid, and Moscow would leave the Democratic Army to face them. The secretary folded the reply and reached for a clean sheet for the front."
 NATO_INTERVENTION.28.a:0 "Tell the units there will be no Soviet help."

 NATO_INTERVENTION.29.t:0 "The Race for Athens"
 NATO_INTERVENTION.29.d:0 "At the State Department in Washington, an army liaison officer laid a Greek ammunition request across the map. The KKE was committing its forces to an all-out advance on Athens, with Moscow's encouragement. If the capital fell before Aegean Shield secured the government, the intervention would have failed. The planners reckoned they had no more than sixty days to stop it.\n\n'The rifles are in our stores,' the officer said. 'So is the support equipment. Authorize an emergency shipment and let the Greeks put it into the line. We can't ask them to hold Athens with requisition forms.'\n\n'They already have an allied operation coming to their assistance,' a State Department official replied. 'Diverting another shipment will mean explaining whose allocation we've cut. Their army can hold if it keeps its positions.' The clerk at the end of the table drew the authorization towards him and waited for instructions."
 NATO_INTERVENTION.29.a:0 "Rush the arms to Athens."
 NATO_INTERVENTION.29.b:0 "The Greeks can hold with what they have."

 NATO_INTERVENTION.30.t:0 "Hold Athens"
 NATO_INTERVENTION.30.d:0 "In the army operations room in Athens, a staff captain traced the latest communist movements on a map already crowded with pins. The Democratic Army was preparing a concentrated drive on the capital. NATO's assistance was coming, but the enemy meant to settle the war before the allied operation could take effect.\n\nA telephone rang beside him. A headquarters outside the city wanted to know whether it should prepare to withdraw if the road behind it was threatened. The captain covered the mouthpiece and looked towards his superior. Beside the map lay the draft order calling on every formation to hold until allied support reached it. The officer signed it and handed it back."
 NATO_INTERVENTION.30.a:0 "Send the order. Athens must hold."

 NATO_INTERVENTION.31.t:0 "Moscow Calls for the Offensive"
 NATO_INTERVENTION.31.d:0 "At Democratic Army headquarters, the operations officer cleared the supply returns from his map as the message from Moscow was read out. The royal government had to be defeated before NATO could secure it. Athens was the objective; the Soviet leadership wanted the offensive pressed through within sixty days.\n\nCommanders bent over the approaches to the capital. An officer who had been asking for ammunition all morning now wanted to know when he could begin moving his men. The Party liaison passed the message to the radio clerk for transmission to the formations. The operations officer marked the assembly areas, then held the pencil still while the clerk checked the wording of the order."
 NATO_INTERVENTION.31.a:0 "Forward the order. We march on Athens."

 NATO_INTERVENTION.32.t:0 "The Black Sea Fleet Sails"
 NATO_INTERVENTION.32.d:0 "In the Navy Department's briefing room in Washington, a watch officer laid the Soviet sailing reports beside a chart of the Straits. Moscow was sending the Black Sea Fleet towards the Aegean. A force large enough to challenge the allied operation could force Aegean Shield to be abandoned and leave the Greek government without its rescue.\n\n'Put the Sixth Task Fleet on their track,' a naval officer said. 'Keep them under observation. If they intend to interfere, make them bring enough ships to face ours as well.' He indicated the orders awaiting approval.\n\n'And every captain on both sides will know who has his guns trained on whom,' the State Department representative replied. 'The operation is meant to save Greece. A collision at sea could leave us fighting the Russians before it does.' The watch officer opened his signal pad and asked what instructions he should send."
 NATO_INTERVENTION.32.a:0 "Shadow the Soviet fleet."
 NATO_INTERVENTION.32.b:0 "Keep our ships clear. Don't provoke them."

 NATO_INTERVENTION.33.t:0 "Soviet Warships at the Straits"
 NATO_INTERVENTION.33.d:0 "At the Foreign Ministry in Ankara, a legal adviser set the Soviet notification beside the Montreux Convention. Moscow requested passage for warships bound for the Aegean. The naval staff had examined the notified transit and found no treaty grounds to refuse it. Beyond the Straits, those ships could overturn the Western intervention in Greece.\n\n'Let the transit proceed under the Convention,' the adviser said. 'We have insisted that these rules protect our authority here. We can't discard them because we dislike the ships using them.'\n\n'Passage doesn't require our silence,' a senior official answered. 'The Russians have pressed us over these waters before. Let the country hear that we've protested what this fleet is going to do.' The adviser left the passage instructions on the desk. Beside them, the press officer placed a draft protest; publishing it would commit the government to a public quarrel with Moscow. The minister's secretary asked which papers to circulate."
 NATO_INTERVENTION.33.a:0 "Allow passage under the Convention."
 NATO_INTERVENTION.33.b:0 "Let them pass, but publish our protest."

 NATO_INTERVENTION.34.t:0 "Soviet Ships Bound for the Aegean"
 NATO_INTERVENTION.34.d:0 "At naval headquarters in Athens, a signals officer marked the reported course of the Black Sea Fleet on his chart. Soviet warships were sailing towards Greek waters. The cabinet had accepted NATO's assistance to end the civil war; now the admirals wanted to know whether that assistance could reach the army with a Soviet squadron across its route.\n\nThe officer telephoned the coastal stations for fresh reports. One asked whether the ships were to be treated as hostile. No such order had arrived. He put the question into the folder for the naval staff and returned to the chart, where the next position report still had to be entered."
 NATO_INTERVENTION.34.a:0 "Keep the coastal stations reporting."

 NATO_INTERVENTION.36.t:0 "The Greek Communists Defeated"
 NATO_INTERVENTION.36.d:0 "In the Kremlin, a Foreign Ministry official put the final Greek report beneath the KKE's earlier appeals. Organized resistance by the Democratic Army had ended. Aegean Shield had succeeded, and the royal government's troops were taking over the remaining communist positions. The Provisional Democratic Government no longer existed.\n\nHe began a note for the leadership on what could still be learned of the surviving cadres. The file also contained Moscow's instructions during the crisis; anyone reviewing the defeat would have them to hand. Before sending it upstairs, he removed the old operational map and asked the secretary where the closed Greek correspondence was to be kept."
 NATO_INTERVENTION.36.a:0 "Submit the report on the defeat."

 NATO_INTERVENTION.37.t:0 "The Republic to Be Proclaimed"
 NATO_INTERVENTION.37.d:0 "In a requisitioned ministry office in Athens, a clerk of the Provisional Democratic Government tried the typewriter left on his new desk. Through the open window he heard soldiers calling to people in the street. The royal government had fallen, and the Democratic Army's victory reports now came from across Greece. NATO's operation had failed to save the monarchy.\n\nA Party official brought in the draft proclamation of the Democratic Republic. The clerk corrected the heading while another official checked which ministries had sent representatives. Recognition and assistance from Moscow would be essential, but the first announcement had to reach the Greek stations that evening. He rolled a fresh sheet into the machine and waited for the approved text."
 NATO_INTERVENTION.37.a:0 "Broadcast the proclamation of the Republic."

 NATO_INTERVENTION.38.t:0 "Who Lost Greece?"
 NATO_INTERVENTION.38.d:0 "In the cabinet room, the private secretary laid the report from Athens beside the morning newspapers. The royal government was gone. Aegean Shield had failed, and the new communist authorities were taking over Greece with Moscow's backing. The assurances given when intervention was approved were already being quoted against the government.\n\nHe turned to the requests for statements. Opposition spokesmen wanted the operational papers released; government supporters wanted to know who had promised that Greece could be saved. The next cabinet discussion had lost its place on the agenda. The secretary drew a line through it and wrote in Greece, leaving room beneath for the minister who would have to explain the defeat."
 NATO_INTERVENTION.38.a:0 "Prepare our account of the failure."

 NATO_INTERVENTION.39.t:0 "Victory in the Aegean"
 NATO_INTERVENTION.39.d:0 "At the Foreign Ministry in Moscow, a press official compared the Greek victory bulletin with the draft for the Soviet newspapers. Aegean Shield had failed. The royal government was finished, and the communists were preparing to proclaim their republic. The Atlantic alliance had committed itself to saving Athens and had been unable to do so.\n\nHe sent the passage on Western intervention back to the editor with permission to print it prominently. Down the corridor, officials were preparing congratulations for the Greek leadership and discussing the new government's needs. The press official checked that the message praised the Democratic Army, then placed the approved copy in the outgoing tray."
 NATO_INTERVENTION.39.a:0 "Send our congratulations to the Greek comrades."

 SOV_Aegean_KKE_Offensive:0 "The Offensive on Athens"
 SOV_Aegean_KKE_Offensive_desc:0 "The Democratic Army must defeat the royal government before NATO can secure it. If the Democratic Army or its allies take Athens before this 60-day mission expires, Operation Aegean Shield fails and the Greek communists win the civil war. If they do not, the Greek government wins."
 SOV_Aegean_Black_Sea_Fleet:0 "Challenge Aegean Shield"
 SOV_Aegean_Black_Sea_Fleet_desc:0 "Send the Soviet fleet into the Eastern Mediterranean before this 60-day mission expires. At least 3 Soviet capital ships and 4 Soviet screens must be present there at the same time. If the United States shadows our fleet, the requirement rises to 5 capital ships and 6 screens. Meeting the requirement defeats Operation Aegean Shield and gives the Greek communists victory in the civil war. If the mission expires without success, the Greek government wins."
 NATO_Aegean_Shield_Watch:0 "Aegean Shield: Watch for Soviet Interference"
 NATO_Aegean_Shield_Watch_desc:0 "Moscow has challenged Operation Aegean Shield. Watch for Soviet interference during this 60-day window. A communist or allied capture of Athens during the offensive, or the arrival of the required Soviet fleet in the Eastern Mediterranean during the naval challenge, defeats the operation and gives the Greek communists victory. The naval requirement is 3 capital ships and 4 screens, rising to 5 and 6 if we shadow the fleet. If the Soviet mission expires without success, the Greek government wins. This mission is an informational timer only."
