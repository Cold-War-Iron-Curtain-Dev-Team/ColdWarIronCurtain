 # Event 700: the Gateway advocates
 cwic_mkultra.700.t: "The Gateway Advocates"
 cwic_mkultra.700.d: "The Army declined the Gateway evaluation in 1983. The people who wanted it never accepted the answer. A circle of INSCOM officers, a contractor in the Virginia hills and a senator with a long interest in the paranormal now write together, on Senate letterhead.\n\nThey are asking for very little: a reading of the 1983 assessment, a small evaluation budget, and a promise that someone will take the matter seriously. Each of those, once granted, is very hard to take back."
 cwic_mkultra.700.a: "Reopen the evaluation under Army authority."
 cwic_mkultra.700.b: "Answer the letters and hold the line."
 cwic_mkultra.700.c: "Let them read the 1983 summary."
 USA_mkultra_gateway_advocates_reopen_tt: "Authorizes the Army INSCOM Gateway program after all, on the 1983 terms: §Y25 Political Power§! and the same Research Record grant. Two years have been lost."
 USA_mkultra_gateway_advocates_refuse_tt: "Costs §Y10 Political Power§!. The program stays closed."
 USA_mkultra_gateway_advocates_release_tt: "Costs nothing now. The summary will circulate, and when the program becomes public it will be on the record."

 # Event 506: Army charter archive note (each note opens its own paragraph)
 USA_mkultra_archive_note_matched: "\n\nOne file in this box predicted an outage before it happened. Nobody has explained it, and the records office has marked it for permanent retention."
 USA_mkultra_archive_note_provenance: "\n\nThe remote-viewing files cite an MKSEARCH inventory from the 1960s. The two programs were never one, but the index now links them."
 USA_mkultra_archive_note_brief: "\n\nThe 1995 AIR review is filed in the same box. It concerned a remote-viewing program this charter never ran."

 # Event 760: The Family Jewels & The December Press Column
 cwic_mkultra.760.t: "The December Column and the Inspector General's List"
 cwic_mkultra.760.d: "Before the Senate select committee has even rented its hearing rooms, a front-page newspaper column on domestic surveillance has forced the Director's office to read the Inspector General's 1973 compilation of questionable past activities. Buried among the wiretap and mail-opening summaries are a dozen terse lines on Technical Services Staff behavioral testing and unvouchered university grants.\n\nLegislative counsel warns that whatever index the Agency prepares this month will become the roadmap for congressional investigators in the spring."
 cwic_mkultra.760.a: "Segregate the behavioral vouchers into a bounded historical annex."
 cwic_mkultra.760.b: "Include the contractor summaries in the Director's briefing book now."
 cwic_mkultra.760.c: "Stand on the 1973 disposition order and volunteer nothing."
 USA_mkultra_760_segregate_tt: "Costs §Y15 Political Power§!. Exposure Risk §G-5§!. Narrows the scope of the upcoming Church Committee inquiry."
 USA_mkultra_760_disclose_tt: "Stability §R-1.0%§!, Exposure Risk §R+4§!, Research Record §G+4§!. The disclosures are absorbed early."
 USA_mkultra_760_stonewall_tt: "Gains §G10 Political Power§!. Exposure Risk §R+6§!. Increases the severity of the upcoming Church Committee inquiry."

 # Event 770: Executive Order 11905 & Human-Subject Guidelines
 cwic_mkultra.770.t: "Executive Order 11905 and the Consent Guidelines"
 cwic_mkultra.770.d: "The White House has signed Executive Order 11905 to reorganize foreign intelligence oversight, accompanied by new federal rules governing experimentation on human subjects. Agency counsel must now certify that no active division or contractor grant violates the informed-consent standard.\n\nMeanwhile, clerks in the retired-records annex are still finding boxes of unindexed financial vouchers from the 1950s and 1960s that were missed in 1973."
 cwic_mkultra.770.a: "Enforce strict informed-consent rules and audit the surviving vouchers."
 cwic_mkultra.770.b: "Carve out a foreign-intelligence exemption for passive observation."
 cwic_mkultra.770.c: "Adopt the directive on paper without funding a retroactive audit."
 USA_mkultra_770_strict_tt: "Costs §Y20 Political Power§!. Exposure Risk §G-6§!, Research Record §G+3§!. Softens the impact of the 1977 Senate hearings."
 USA_mkultra_770_exemption_tt: "Research Record §G+5§!, Exposure Risk §R+5§!, East–West Mirror Race §R+1§!. Increases the severity of the 1977 Senate hearings."
 USA_mkultra_770_nominal_tt: "Gains §G10 Political Power§!. Exposure Risk §R+3§!."

 # Event 780: The Fort Meade Billet & House Appropriations Rider
 cwic_mkultra.780.t: "The Fort Meade Billet and the Appropriations Rider"
 cwic_mkultra.780.d: "Staffers for the House Defense Appropriations Subcommittee have flagged a modest line item supporting a handful of Army intelligence billets at Fort Meade and an external evaluation contract in California. Their question is blunt: why is the Defense Department paying for 'psychoenergetics' two years after the Senate hearings on behavioral research?\n\nThe unit's defenders want to brief the congressmen in closed session on Warsaw Pact literature; the Army's general counsel prefers a quieter administrative reclassification."
 cwic_mkultra.780.a: "Reclassify the unit as a foreign technical-intelligence evaluation desk."
 cwic_mkultra.780.b: "Brief the subcommittee in closed session on Warsaw Pact psychotronics."
 cwic_mkultra.780.c: "Freeze external contractor tasking for the fiscal year."
 USA_mkultra_780_technical_tt: "Costs §Y15 Political Power§!. Research Record §G+4§!, Exposure Risk §G-3§!."
 USA_mkultra_780_threat_brief_tt: "Gains §G10 Political Power§!. Exposure Risk §R+4§!, East–West Mirror Race §R+1§!."
 USA_mkultra_780_frozen_tt: "Exposure Risk §G-5§!. External tasking pauses for the year."

 # Event 790: The National Research Council Report & Project SUN STREAK
 cwic_mkultra.790.t: "Enhancing Human Performance and the SUN STREAK Transfer"
 cwic_mkultra.790.d: "Two years ago the Army asked the National Research Council to evaluate a range of unconventional performance techniques, from biofeedback to parapsychology. The committee's report has now arrived. Its conclusion on remote viewing is unambiguous: across 130 years of laboratory inquiry, the panel finds 'no scientific justification for the existence of parapsychological phenomena.'\n\nAt the same time, Defense Intelligence Agency sponsors are preparing to assume custody of the Fort Meade billets under a new code name, SUN STREAK, arguing that methodological criticism from academic psychologists does not settle the intelligence question."
 cwic_mkultra.790.a: "Accept the NRC's skeptical findings and restrict Fort Meade to methodological archiving."
 cwic_mkultra.790.b: "Transfer the billets to DIA under SUN STREAK and shelve the committee's criticism."
 cwic_mkultra.790.c: "Publish the NRC summary while keeping the methodological contract on yearly review."
 USA_mkultra_790_accept_tt: "Costs §Y15 Political Power§!. Research Record §G+6§!, Exposure Risk §G-5§!, East–West Mirror Race §G-1§!."
 USA_mkultra_790_shelve_tt: "Gains §G10 Political Power§!. Exposure Risk §R+5§!, East–West Mirror Race §R+1§!."
 USA_mkultra_790_compromise_tt: "Research Record §G+3§!, Exposure Risk §G-2§!."

 # Event 800: Congressional Transfer Directive & Declassification Task Force
 cwic_mkultra.800.t: "The STAR GATE Transfer Directive"
 cwic_mkultra.800.d: "A defense appropriations directive has ordered the Defense Intelligence Agency to wind down its operational oversight of the Fort Meade unit—now styled STAR GATE—and transfer the entire archive back to the Central Intelligence Agency for an independent retrospective evaluation.\n\nTwenty years of session transcripts, target envelopes, and contractor invoices fill dozens of steel file cabinets. Simultaneously, an executive declassification task force is asking how the older Cold War human-subject files will be indexed for the public."
 cwic_mkultra.800.a: "Fund a complete archival index and deliver the unredacted boxes to the reviewers."
 cwic_mkultra.800.b: "Redact operational tasking logs and source names before transferring the files."
 cwic_mkultra.800.c: "Deliver the unindexed cartons as-is and let the agency clerks sort them out."
 USA_mkultra_800_indexed_tt: "Costs §Y20 Political Power§!. Research Record §G+5§!, Exposure Risk §G-6§!."
 USA_mkultra_800_redacted_tt: "Costs §Y10 Political Power§!. Research Record §G+2§!, Exposure Risk §G-2§!."
 USA_mkultra_800_raw_tt: "Gains §G10 Political Power§!. Exposure Risk §R+5§!."

 # Event 810: The Fort Meade Memoirs & National Archives Release
 cwic_mkultra.810.t: "The Fort Meade Memoirs and the National Archives"
 cwic_mkultra.810.d: "Two years after the 1995 retrospective review closed the book on remote viewing, former Fort Meade viewers and project officers have published trade paperbacks and appeared on television talk shows. Their central claim is that the external reviewers examined only a small sample of laboratory trials and ignored boxes of operational tasking folders.\n\nHistorians at the National Archives are asking when the remaining declassified volumes will be transferred to public custody."
 cwic_mkultra.810.a: "Release the remaining methodological volumes and replication tables to the National Archives."
 cwic_mkultra.810.b: "Issue a joint DIA–CIA historical note standing by the 1995 review."
 cwic_mkultra.810.c: "Decline comment on paperback memoirs and leave the cartons in records storage."
 USA_mkultra_810_declassify_tt: "Costs §Y15 Political Power§!. Research Record §G+5§!, Exposure Risk §G-5§!."
 USA_mkultra_810_rebut_tt: "Costs §Y10 Political Power§!. Exposure Risk §G-3§!, East–West Mirror Race §G-1§!."
 USA_mkultra_810_ignore_tt: "Exposure Risk §R+4§!. The memoirists' account goes unanswered."

 # Event 880: the final ledger
 cwic_mkultra.880.t: "The Final Ledger"
 cwic_mkultra.880.d: "The migration team's last task is one nobody assigned: a single page, for whoever opens these files next, saying what was done and what it cost.\n\n[GetUSA_MKUltraLedgerRecords] [GetUSA_MKUltraLedgerOlson] [GetUSA_MKUltraLedgerToxins] [GetUSA_MKUltraLedgerContinuation]\n\n[GetUSA_MKUltraLedgerInquiry] [GetUSA_MKUltraLedgerSenate] [GetUSA_MKUltraLedgerDefence] [GetUSA_MKUltraLedgerLateOversight]\n\n[GetUSA_MKUltraLedgerGateway] [GetUSA_MKUltraLedgerAIR] [GetUSA_MKUltraLedgerLateStargate] [GetUSA_MKUltraLedgerCulture] [GetUSA_MKUltraLedgerInterplay]"
 cwic_mkultra.880.a: "Close the ledger."
 USA_mkultra_ledger_empty: ""
 USA_mkultra_ledger_records_destroyed: "In January 1973 the working files were burned. The finance vouchers were not, and they became the record."
 USA_mkultra_ledger_records_sealed: "In 1973 the files were sealed, and opened afterwards only to people with the authority to ask."
 USA_mkultra_ledger_records_preserved: "In 1973 the files were preserved and inventoried, which made every later inquiry shorter and duller."
 USA_mkultra_ledger_records_retained: "In 1973 the files were kept but never inventoried; the migration team was the first to read them in order."
 USA_mkultra_ledger_olson_compensated: "The Olson family received a presidential apology and $750,000 from Congress, more than twenty years after the fact."
 USA_mkultra_ledger_olson_contested: "The Agency still contests the Olson family's account of November 1953."
 USA_mkultra_ledger_toxins_retained: "A saxitoxin cache outlived the 1970 destruction order in a Washington vault."
 USA_mkultra_ledger_toxins_destroyed: "The Fort Detrick toxin stocks were destroyed under the 1970 order, with certificates to show for it."
 USA_mkultra_ledger_mksearch_paid: "MKSEARCH carried the surviving contractor lines on until 1972."
 USA_mkultra_ledger_mksearch_lapsed: "When the umbrella lapsed in 1965, no successor was funded."
 USA_mkultra_ledger_inquiry_historical: "The 1975 and 1977 inquiries had run their historical course long before this ledger was opened."
 USA_mkultra_ledger_church_3: "The Church Committee described the program in detail and found nothing in it to defend."
 USA_mkultra_ledger_church_2: "The Church Committee's findings were serious, specific and survivable."
 USA_mkultra_ledger_church_1: "The Church Committee treated the program as a closed chapter."
 USA_mkultra_ledger_senate_3: "In 1977 the Senate followed the invoices to the end."
 USA_mkultra_ledger_senate_2: "The 1977 Senate hearings filled in what the committee had left open."
 USA_mkultra_ledger_senate_1: "The 1977 Senate hearings added little."
 USA_mkultra_ledger_defence_neither: "Twice the Agency declined to fund a defense, and twice the record spoke for itself."
 USA_mkultra_ledger_defence_no_church: "The Agency offered the Church Committee no funded defense."
 USA_mkultra_ledger_defence_no_senate: "The Agency offered the Senate hearings no funded defense."
 USA_mkultra_ledger_late_oversight_strict: "Under Executive Order 11905 the surviving contractor vouchers were audited and bound to strict consent rules."
 USA_mkultra_ledger_late_oversight_exemption: "Even after the mid-seventies executive orders, foreign-intelligence exemptions kept passive behavioral files outside the consent audit."
 USA_mkultra_ledger_late_oversight_nominal: "The 1976 oversight rules were adopted on paper without a funded audit of the retired vouchers."
 USA_mkultra_ledger_gateway_reopened: "The Army declined Gateway in 1983 and reopened it two years later under Senate pressure."
 USA_mkultra_ledger_gateway_held: "The Army declined Gateway in 1983 and held that line when its advocates came back."
 USA_mkultra_ledger_gateway_leaked: "The Army declined Gateway in 1983, but its summary circulated anyway."
 USA_mkultra_ledger_gateway_declined: "The Army declined Gateway in 1983."
 USA_mkultra_ledger_gateway_reference: "In 1983 the Army took the old files for reference and nothing more."
 USA_mkultra_ledger_gateway_authorized: "In 1983 the Army opened its own program, on its own terms."
 USA_mkultra_ledger_air_decommissioned_linked: "The remote-viewing unit was decommissioned in 1995; its files trace back, through MKSEARCH, to the 1950s."
 USA_mkultra_ledger_air_decommissioned: "The remote-viewing unit was decommissioned in 1995 and its files passed to declassification review."
 USA_mkultra_ledger_air_sealed: "In 1995 the remote-viewing files were sealed under executive privilege, against the reviewers' advice."
 USA_mkultra_ledger_air_brief: "The 1995 AIR review was filed as background; it concerned a program this administration never ran."
 USA_mkultra_ledger_air_matched: "One Army file predicted an outage that then happened. Nobody has explained it."
 USA_mkultra_ledger_late_stargate_indexed: "The 1987 National Research Council critique and the 1990s declassification transfers left a fully indexed methodological archive at the National Archives."
 USA_mkultra_ledger_late_stargate_contested: "Through the SUN STREAK transfer and the 1990s memoirs, advocates and critics argued over unindexed cartons long after the unit closed."
 USA_mkultra_ledger_late_stargate_redacted: "The late-Cold War remote-viewing cartons passed from DIA to CIA with operational tasking logs redacted and the negative laboratory tables intact."
 USA_mkultra_ledger_culture_foia: "When the programs surfaced in films and paperbacks, the Agency answered with FOIA releases."
 USA_mkultra_ledger_culture_denied: "When the programs surfaced in films and paperbacks, the Agency declined to comment, and rumour filled the gap."
