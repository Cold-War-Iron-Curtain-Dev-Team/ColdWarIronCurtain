l_english:
 # Event 700: the Gateway advocates
 cwic_mkultra.700.t: "The Gateway Advocates"
 cwic_mkultra.700.d: "The Army declined the Gateway evaluation in 1983. The people who wanted it never accepted the answer. A circle of INSCOM officers, a contractor in the Virginia hills and a senator with a long interest in the paranormal now write together, on Senate letterhead.\n\nThey are asking for very little: a reading of the 1983 assessment, a small evaluation budget, and a promise that someone will take the matter seriously. Each of those, once granted, is very hard to take back."
 cwic_mkultra.700.a: "Reopen the evaluation under Army authority."
 cwic_mkultra.700.b: "Answer the letters and hold the line."
 cwic_mkultra.700.c: "Let them read the 1983 summary."
 USA_mkultra_gateway_advocates_reopen_tt: "Authorizes the Army INSCOM Gateway program after all, on the 1983 terms: §Y25 Political Power§! and the same Research Record grant. Two years have been lost."
 USA_mkultra_gateway_advocates_refuse_tt: "Costs §Y10 Political Power§!. The program stays closed."
 USA_mkultra_gateway_advocates_release_tt: "Costs nothing now. The summary will circulate, and when the program becomes public it will be on the record."

 # Event 506: Army charter archive note (each note opens its own paragraph)
 USA_mkultra_archive_note_matched: "\n\nOne file in this box predicted an outage before it happened. Nobody has explained it, and the records office has marked it for permanent retention."
 USA_mkultra_archive_note_provenance: "\n\nThe remote-viewing files cite an MKSEARCH inventory from the 1960s. The two programs were never one, but the index now links them."
 USA_mkultra_archive_note_brief: "\n\nThe 1995 AIR review is filed in the same box. It concerned a remote-viewing program this charter never ran."

 # Event 880: the final ledger
 cwic_mkultra.880.t: "The Final Ledger"
 cwic_mkultra.880.d: "The migration team's last task is one nobody assigned: a single page, for whoever opens these files next, saying what was done and what it cost.\n\n[GetUSA_MKUltraLedgerRecords] [GetUSA_MKUltraLedgerOlson] [GetUSA_MKUltraLedgerToxins] [GetUSA_MKUltraLedgerContinuation]\n\n[GetUSA_MKUltraLedgerInquiry] [GetUSA_MKUltraLedgerSenate] [GetUSA_MKUltraLedgerDefence]\n\n[GetUSA_MKUltraLedgerGateway] [GetUSA_MKUltraLedgerAIR] [GetUSA_MKUltraLedgerCulture]"
 cwic_mkultra.880.a: "Close the ledger."
 USA_mkultra_ledger_empty: ""
 USA_mkultra_ledger_records_destroyed: "In January 1973 the working files were burned. The finance vouchers were not, and they became the record."
 USA_mkultra_ledger_records_sealed: "In 1973 the files were sealed, and opened afterwards only to people with the authority to ask."
 USA_mkultra_ledger_records_preserved: "In 1973 the files were preserved and inventoried, which made every later inquiry shorter and duller."
 USA_mkultra_ledger_records_retained: "In 1973 the files were kept but never inventoried; the migration team was the first to read them in order."
 USA_mkultra_ledger_olson_compensated: "The Olson family received a presidential apology and $750,000 from Congress, more than twenty years after the fact."
 USA_mkultra_ledger_olson_contested: "The Agency still contests the Olson family's account of November 1953."
 USA_mkultra_ledger_toxins_retained: "A saxitoxin cache outlived the 1970 destruction order in a Washington vault."
 USA_mkultra_ledger_toxins_destroyed: "The Fort Detrick toxin stocks were destroyed under the 1970 order, with certificates to show for it."
 USA_mkultra_ledger_mksearch_paid: "MKSEARCH carried the surviving contractor lines on until 1972."
 USA_mkultra_ledger_mksearch_lapsed: "When the umbrella lapsed in 1965, no successor was funded."
 USA_mkultra_ledger_inquiry_historical: "The 1975 and 1977 inquiries had run their historical course long before this ledger was opened."
 USA_mkultra_ledger_church_3: "The Church Committee described the program in detail and found nothing in it to defend."
 USA_mkultra_ledger_church_2: "The Church Committee's findings were serious, specific and survivable."
 USA_mkultra_ledger_church_1: "The Church Committee treated the program as a closed chapter."
 USA_mkultra_ledger_senate_3: "In 1977 the Senate followed the invoices to the end."
 USA_mkultra_ledger_senate_2: "The 1977 Senate hearings filled in what the committee had left open."
 USA_mkultra_ledger_senate_1: "The 1977 Senate hearings added little."
 USA_mkultra_ledger_defence_neither: "Twice the Agency declined to fund a defense, and twice the record spoke for itself."
 USA_mkultra_ledger_defence_no_church: "The Agency offered the Church Committee no funded defense."
 USA_mkultra_ledger_defence_no_senate: "The Agency offered the Senate hearings no funded defense."
 USA_mkultra_ledger_gateway_reopened: "The Army declined Gateway in 1983 and reopened it two years later under Senate pressure."
 USA_mkultra_ledger_gateway_held: "The Army declined Gateway in 1983 and held that line when its advocates came back."
 USA_mkultra_ledger_gateway_leaked: "The Army declined Gateway in 1983, but its summary circulated anyway."
 USA_mkultra_ledger_gateway_declined: "The Army declined Gateway in 1983."
 USA_mkultra_ledger_gateway_reference: "In 1983 the Army took the old files for reference and nothing more."
 USA_mkultra_ledger_gateway_authorized: "In 1983 the Army opened its own program, on its own terms."
 USA_mkultra_ledger_air_decommissioned_linked: "The remote-viewing unit was decommissioned in 1995; its files trace back, through MKSEARCH, to the 1950s."
 USA_mkultra_ledger_air_decommissioned: "The remote-viewing unit was decommissioned in 1995 and its files passed to declassification review."
 USA_mkultra_ledger_air_sealed: "In 1995 the remote-viewing files were sealed under executive privilege, against the reviewers' advice."
 USA_mkultra_ledger_air_brief: "The 1995 AIR review was filed as background; it concerned a program this administration never ran."
 USA_mkultra_ledger_air_matched: "One Army file predicted an outage that then happened. Nobody has explained it."
 USA_mkultra_ledger_culture_foia: "When the programs surfaced in films and paperbacks, the Agency answered with FOIA releases."
 USA_mkultra_ledger_culture_denied: "When the programs surfaced in films and paperbacks, the Agency declined to comment, and rumour filled the gap."
