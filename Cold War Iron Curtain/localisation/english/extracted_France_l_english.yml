 FRA_FP.14.a:0 "Understood."
 FRA_FP.14.t:0 "Report on the Situation of Malaya"
 FRA_FP.15.a:0 "We must be prepared."
 FRA_FP.15.t:0 "Status Report on the Far East"
 FRA_FP.16.a:0 "Seek an accommodation with Beijing. Ease the confrontation."
 FRA_FP.16.b:0 "Tell Beijing to halt its aid to the Viet Minh."
 FRA_FP.16.d:0 "At the Quai d'Orsay, a diplomatic secretary laid the latest exchange with Beijing beside a report from the Chinese frontier. The minister read the report first. More supplies had reached the Viet Minh; the embassy's dispatch offered another round of talks.\n\n\"They want to know whether we're prepared to ease the confrontation,\" the secretary said.\n\n\"And our commanders want to know when the deliveries will stop,\" the military representative replied. \"Put that question to them plainly.\"\n\n\"We can insist on an answer. We still have to decide whether we're leaving room for an agreement.\"\n\nThe minister turned back to the dispatch. An accommodation would give the talks something to work with, though it offered no assurance about the frontier. A formal demand would put the supply question on record and risk another breach. The secretary drew a blank sheet towards him and waited for the wording of the reply."
 FRA_FP.16.t:0 "Franco-China Diplomatic Talks"
 FRA_FP.17.a:0 "Decline the French request. We won't supply this campaign."
 FRA_FP.17.b:0 "Approve the rifles and trucks for the CEFEO."
 FRA_FP.17.t:0 "A French Request for Intervention in Indochina"
 FRA_FP.17.d:0 "In a State Department office in Washington, a desk officer put the French request beside a proposed shipment for the expeditionary corps. The list ran to rifles and trucks. The covering note asked for an American commitment that Paris could take into the negotiations over Indochina.\n\n\"Send the equipment,\" one adviser said. \"The French are doing the fighting. If we want a say in the settlement, we have to help keep their forces supplied.\"\n\n\"And when this shipment isn't enough?\" his colleague asked. \"Paris will be back with another list. We can refuse before we take on that obligation.\"\n\nThe officer checked the destination again: the CEFEO depots. There were no American combat units in the proposal before him. He placed the supply authorization beside the draft refusal, leaving space on each for the Secretary's signature."
