l_english:

BRA_Push_Plan_SALTE:0 "Continue Plan SALTE"
BRA_Push_Plan_SALTE_desc:0 "Plan SALTE was introduced by President Dutra in 1948. SALTE's objective was to stimulate and improve the development of health, food, transportation and energy sectors throughout Brazil, thus helping and improving the living conditions of the Brazilian population."
BRA_Rural_Infrastructure:0 "Modernize Rural Infrastructure"
BRA_Rural_Infrastructure_desc:0 "Much of Brazil's rural areas lack proper infrastructure due to the governments always prioritizing the rich metropolis of São Paulo and Rio de Janeiro. We will alleviate that by building some roads."
BRA_Heavy_Industry:0 "Heavy Industry Builldup"
BRA_Heavy_Industry_desc:0 "The industrial heartland of Brazil rests on the Southeast Region, São Paulo, Rio de Janeiro and to a lesser extent, Minas Gerais, housing the huge majority of Brazil's industries, companies and business centers."
BRA_Deal_With_Italy:0 "Trade Deal with Italy"
BRA_Deal_With_Italy_desc:0 "In 1949, a trade agreement was signed between President Dutra of Brazil and President Luigi Einaudi of Italy, bringing both nations close together and strenghtening economic ties."
BRA_OAS_Chart:0 "The OAS Chart"
BRA_OAS_Chart_desc:0 "The Chart of the Organization of American States was signed in 1948 and promulgated by the National Congress of Brazil as the legislative decree no. 64/49 in 1949, approving the chart that creates the Organization, bringing closer relations and ties between the nations of the Americas."

BRA_1950_Elections:0 "The Elections of 1950"
BRA_1950_Elections_desc:0 "The 1950 Brazilian presidential election was the fifteenth presidential election and the thirteenth direct election in Brazil occuring int October 3rd of 1950."

BRA_1950_Elections_Vargas:0 "President Vargas"
BRA_1950_Elections_Vargas_desc:0 "Getúlio Vargas has once again returned to the presidency. With the people on his side, his future as a populist is sure to be a guaranteed success."
BRA_Vargas_Increase_Wage:0 "Increase Minimun Wage"
BRA_Vargas_Increase_Wage_desc:0 "One of Vargas first acts after returning to power was increasing the minimun wage by 100%, increasing his image as the "father of the poor"."
BRA_Vargas_Rural_Exodus:0 "Rural Exodus Question"
BRA_Vargas_Rural_Exodus_desc:0 "Rural Exodus affects the countryside greatly, losing many capable manpower and hindering the progress in the interior. With some investments in the affected region, we can lower its impact in the economy even if just a little."
BRA_Vargas_Expand_Chemical:0 "Expand the Chemical Industry"
BRA_Vargas_Expand_Chemical_desc:0 "To expand our chemical industry, subsidies and expansion projects were granted by the government in order to promote the national chemical power."
BRA_Vargas_Arinos_Law:0 "Arinos Law"
BRA_Vargas_Arinos_Law_desc:0 "The Afonso Arinos Law (Law 1390/51) was proposed by congressman Afonso Arinos de Melo Franco and enacted by Getúlio Vargas on July 3, 1951, that prohibits racial discrimination in Brazil. It was the first Brazilian code to include among criminal offenses the practice of acts resulting from prejudice based on race and skin color."
BRA_Vargas_US_Assistance:0 "State Visit to America"
BRA_Vargas_US_Assistance_desc:0 "President Vargas has approached the United States, wishing for bringing both nations close together and to seek investments in Brazil, and aligning the country closer from Vargas support of the Capitalist Bloc in th Cold War, but keeping Brazil autonomous."
BRA_Vargas_Exterior_Commerce_Chart:0 "Exterior Commerce Chart"
BRA_Vargas_Exterior_Commerce_Chart_desc:0 "The parlament has drawn a chart to better stimulate Brazil's trade with the neighbours and far away nations."
BRA_Vargas_National_Industry:0 "Investing in our Industry"
BRA_Vargas_National_Industry_desc:0 "President Vargas has drawn a plan to increase Brazil's national industrial power, this plan involves expanding the steel mills and industrial complexes in the metropolis."
BRA_Reorganize_Synd:0 "The New Syndicate"
BRA_Reorganize_Synd_desc:0 "Vargas has decreed that the worker's syndcicates must be reorganize to better fill the modernized models, to better guarantee worker's rights and their duties."
BRA_Vargas_BNDE:0 "Found the BNDE"
BRA_Vargas_BNDE_desc:0 "BNDE,or National Bank for Economic and Development, is Brazil's main development bank, created by Law No. 1,628 of June 20, 1952, which operates in financing long-term projects, supporting small and medium-sized companies and the country's infrastructure, with a focus on sustainable development, job creation and reducing social inequalities."
BRA_Vargas_Petrobras:0 "Found Petrobras"
BRA_Vargas_Petrobras_desc:0 "Petróleo Brasileiro S.A., better known by the portmanteau Petrobras, was established by Law No. 2004, sanctioned by the President of the Republic Getúlio Vargas, on October 3, 1953, with the goal to be a legal monopoly and exploit Brazil's rich oil reserves and propel the economy forward."
BRA_Vargas_Health_Ministry:0 "Create the Health Ministry"
BRA_Vargas_Health_Ministry_desc:0 "Created in 1930 by Vargas himself, the Ministry of Public Health and Education was separated into different departments by law in 1953, which helped increase funding and operations on their own without interfering on eachother."
BRA_Vargas_National_Oil:0 "The Oil is Ours Campaign"
BRA_Vargas_National_Oil_desc:0 "By 1953, Brazil only produced about 2,700 barrels of oil per day. The campaign carried by President Vargas aimed to increase its effectivity and promote the self reliance of brazilian energy."
BRA_Vargas_INPA:0 "The foundation of INPA"
BRA_Vargas_INPA_desc:0 "The National Institute of Amazonian Research (Instituto Nacional de Pesquisas da Amazônia or INPA) is a public educational and research institution headquartered in Manaus. It was founded in 1952, with the purpose of furthering scientific knowledge of the Brazilian Amazon Region. Most of INPA's research focuses on tropical forest management, ecology, molecular ecology, zoology, botany, tropical agriculture and tropical fish culture."
BRA_Vargas_Inflation:0 "Measures to Combat Inflation"
BRA_Vargas_Inflation_desc:0 "Inflation has affected our nation gravely this year. Salaries corroded under it, bringing many workers to protest against Vargas. We must act fast, or all of our work will be at risk."
BRA_Appoint_Goulart:0 "Appoint Goulart Minister of Work"
BRA_Appoint_Goulart_desc:0 "João Goulart was appointed by President Vargas as Minister of Work in 1953, amidst a tense moment between workers on strike, with the duty to calm down the tensions and negotiate with strike leaders."
BRA_Vargas_Conspiration:0 "The Pieces Fall"
BRA_Vargas_Conspiration_desc:0 "The Attack of Tonelero Street has left a massive impact on Vargas' image. Facing constant attacks from the opposition and the media, the future is looking grimmer and uncertain by the second."
BRA_Vargas_Suicide:0 "The Last Act"
BRA_Vargas_Suicide_desc:0 "President Getúlio Dorneles Vargas, militar, lawyer, twice president, leader of the Revolution of 1930, the face of Estado Novo, has took his own life. Thus ends one of the most troubled eras in Brazilian history. But will it save the future or condemn it? Only time will tell."

BRA_1950_Elections_Gomes:0 "President Gomes"
BRA_1950_Elections_Gomes_desc:0 "Brigadier Eduardo Gomes has won a historical victory for the UDN, marking a definitive end to the Vargist era."
BRA_Gomes_Align_US:0 "Always with America"
BRA_Gomes_Align_US_desc:0 "We will bring ourselves close to America and the West, to show our full support of the ideals of democracy and our shared oppposition to communism."
BRA_Gomes_Attract_Foreign:0 "Open our Economy to the World"
BRA_Gomes_Attract_Foreign_desc:0 "To increase our economical presence in the world stage, we need to allow foreign companies to open offices in our nation, to warrant a better chance at working deals within our nations."
BRA_Gomes_US_Tech_Share:0 "American Technological Deal"
BRA_Gomes_US_Tech_Share_desc:0 "We scored a historical technology share deal with America, bringing advancements in the technology of our nation that we needed."
BRA_Gomes_Religion:0 "Promoting the Church"
BRA_Gomes_Religion_desc:0 "Being the country with the largest catholic population in the World, Brazil has always promoted cooperation with the Catholic Church. President Gomes will expand on this, investing to build more churches across the country."
BRA_Gomes_Modernize_Army:0 "Modernizing the Army"
BRA_Gomes_Modernize_Army_desc:0 "Our armed forces are severely lacking in comparison to the ever changing face of the battlefield. We need to invest in modern weapons and strategies for our troops."
BRA_Gomes_Buy_Weapons:0 "Increase the Stockpiles"
BRA_Gomes_Buy_Weapons_desc:0 "Taking advantage of our recent alliance with America, we will buy some of their stockpile weapons to replace our aging supply of World War era equipment."
BRA_Gomes_Amoco_in_Brazil:0 "Expand Standard Oil of Brazil"
BRA_Gomes_Amoco_in_Brazil_desc:0 "Brazil has a vast amount of Oil resources waiting to be uncovered, and what better way to explore them than to give more freedom to our good friends from Standard Oil to exploit our reserves?"
BRA_Gomes_Education:0 "Education Above Everything"
BRA_Gomes_Education_desc:0 "One of the UDN's campaign flags has always been education. And we intend to honor this, building more schools and universities on the country to increase our education rate."
BRA_Gomes_Condemn_Communism:0 "Condemning the Communist Threat"
BRA_Gomes_Condemn_Communism_desc:0 "To reinforce our commitment to democracy and western values, we will internationally condemn the communist regimes of the East, and especially on their agreession in Korea."
BRA_Gomes_Navy:0 "To Protect Our Seas"
BRA_Gomes_Navy_desc:0 "Our Navy was our pride in the Imperial Era, but lately it has fallen behind in comparison to other nations. We will fix this by increasing the navy funding and purchasing equipment for our naval forces."
BRA_Gomes_Air_Force:0 "Soaring to the Skies"
BRA_Gomes_Air_Force_desc:0 "The Brazilian Air Force was an outstanding actor in the World War, and we must keep its excellency by investing heavily into our Air Defence."
BRA_Gomes_Ban_PCB:0 "Break the Reds"
BRA_Gomes_Ban_PCB_desc:0 "The communist threat must not only be combated abroad, but internally. The PCB, despite being banned since 1947, is still relatively noisy with its members gaining popularity in municipal elections. We will fight this by sending the police to crack down harder on their members."
BRA_Gomes_American_Companies:0 "Open American Corporations"
BRA_Gomes_American_Companies_desc:0 "We will solidify that our ties to the US are not only political and militaric, but also economical, brining more American Companies to Brazil."
BRA_Gomes_Support_ROK:0 "A Hand to Korea"
BRA_Gomes_Support_ROK_desc:0 "The Republic of Korea has been bravely fighting the communist menace. We will support them diplomatically and militarily."
BRA_Gomes_Army_Schools:0 "More Army Schools"
BRA_Gomes_Army_Schools_desc:0 "Estabilishing free Army Schools across the country will not only help promote education, but also direclty influence some members to joining the army and grant us brilliant, young leadership."
BRA_Gomes_Joint_Exercise:0 "The South and the North Atlantic"
BRA_Gomes_Joint_Exercise_desc:0 "The Brazilian Army will perform a joint exercise alongside NATO, helping our army to develop more and show the world our commitment to mutual interest defense."

BRA_1950_Elections_Machado:0 "President Machado"
BRA_1950_Elections_Machado_desc:0 "Cristiano Machado has won the elections, guaranteed a second term for the PSD to rule the country."
BRA_Machado_Appease_Elites:0 "Appeasing the Elites"
BRA_Machado_Appease_Elites_desc:0 "To deal with the vast impopularity of Machado, the PSD will reach out to the elites for more appeasement in exchange for support in the government years."
BRA_Machado_Moderate_Industrialization:0 "Industrial Expansion"
BRA_Machado_Moderate_Industrialization_desc:0 "Our industry shall be expanded in a moderate manner, avoiding excessive spending and waste of manpower."
BRA_Machado_Moderate_Alignment:0 "Limited Ties with America"
BRA_Machado_Moderate_Alignment_desc:0 "We need to solidify our ties with the West, but we shall not surrender our country like the mongrels of the UDN would do it."
BRA_Machado_Tax_Cuts:0 "Cut Taxes for the Companies"
BRA_Machado_Tax_Cuts_desc:0 "We will grant some tax cuts to our industries to help stimulate them, ignoring some unsavory practices by them, even if it's wrong, it'll improve the country and must be done."
BRA_Machado_BNDE:0 "Create the BNDE"
BRA_Machado_BNDE:0 "The PSD always had plans to increase investment funding across the country, and the BNDE will do greatly to help future development of the country."
BRA_Machado_State_Visit:0 "State Visit to the Conesur"
BRA_Machado_State_Visit_desc:0 "President Machado will perform a state visit to our neighbouring countries with the idea of increasing cooperation and trade between South America."
BRA_Machado_Technical_Institute:0 "Technical Institutes for Higher Education"
BRA_Machado_Technical_Institute_desc:0 "Many capitals still suffer from a lack of proper colleges to help young talented people find their way. We will open technical institutes across the country to help solve that."
BRA_Machado_PTB_Crack_Down:0 "Sidelining the Getulists"
BRA_Machado_PTB_Crack_Down_desc:0 "The shadow of the PTB still haunts the country. Even if they lost some strength, they still are a threat. So the PSD has made its mission to continue opposing them so they never come back."
BRA_Machado_Petrobras:0 "Create Petrobras"
BRA_Machado_Petrobras_desc:0 "If we want to become a great power in the world, we'll need a way to utilize our national resources. We will create the Petrobras company as a mixed corporation, half the shares owned by the state and half ownes by private and foreign capitals."
BRA_Machado_European_Products:0 "Importing from Europe"
BRA_Machado_European_Products_desc:0 "European products are synonymous with quality and luxury, and we shall strike deals with european enterprised to bring this quality to us. We may alienate and devalue our own production, but that's just the way it is."
BRA_Machado_Japanese_Tech:0 "Technology from Japan"
BRA_Machado_Japanese_Tech_desc:0 "Japan has achieved an excellent reconstruction effort after the war, with their technological sector being the most impressive. Companies like Tokyo Tsushin Kogyo and Matsushita, selling televisions, radios and appliances, brought great advancements to the consumer industry, and we shall strike a deal with them to bring these marvelous products to us."
BRA_Machado_Electrification:0 "Electrification Campaign"
BRA_Machado_Electrification_desc:0 "Many on the rural parts of the country have no access to electricity. By expanding our power grid we shall help solve the lack of electrification that still affect many people on the country."
BRA_Machado_Steel_Mills:0 "Expanding the Steel Mills"
BRA_Machado_Steel_Mills_desc:0 "Our next objective is to expand the activities of our renowned steel mills, mainly the CSN, to meet our current industrial demands."
BRA_Machado_Deals_With_LATAM:0 "Dealing with LATAM"
BRA_Machado_Deals_With_LATAM_desc:0 "We've always been close to our brothers in Latin America, and we seek to continue this and improve on it by exploring our connections via trade and economical ties."
BRA_Machado_Independent:0 "An Alliance in South America"
BRA_Machado_Independent_desc:0 "We seek to stand our ground with the felliow democracies in the South, but we don't want to become slaves to the US. We need our own political alliance."
BRA_Machado_Economic_Block:0 "Our Own Economic Block"
BRA_Machado_Economic_Block_desc:0 "Independence is not only political, but economical. If we trade among ourselves more than the North, we'll show how we can perform well without their influence."

BRA_50s_Air_Force:0 "Força Aérea Brasileira"
BRA_50s_Air_Force_desc:0 "Founded in 1941, the FAB has served as Brazil's Air Force since then, fighting bravely in the Atlantic and Italy. Our American equipment that we fought with has served us well, but we'll need to revilatize our stockpile and our tactics for the future."
BRA_50s_Air_Force_Training:0 "Implement Training Centers"
BRA_50s_Air_Force_Training_desc:0 "The first step into a modernized air force is a modernized training program. Learning from other nation's methods will help us develop our pilots into skilled warriors of the sky."
BRA_50s_Air_Force_Airfields:0 "Airfields across the Country"
BRA_50s_Air_Force_Airfields_desc:0 "Brazil is a vast country, and for the FAB to be able to properly defende our territory, we'll build airfields in our interior states to properly policy our borders."
BRA_50s_Air_Force_Fighters:0 "Study Fighter Designs"
BRA_50s_Air_Force_Fighters_desc:0 "The protagonist of the air combat has always been the fighter. With studies to foreign planes who excel in the field, we'll be able to buy and even perhaps create our own designs in the future."
BRA_50s_Air_Force_ADC:0 "Establish the Air Defense Command"
BRA_50s_Air_Force_ADC_desc:0 "Air Dominance is not just about sending planes. It also includes protecting our ground from enemy attacks, an Air Defense Command will give us a centralized command for coordinating our air assets, improve our radar arrays and air defense."
BRA_50s_Helicopters:0 "Helicopter, the new Revolution"
BRA_50s_Helicopters_desc:0 "World War II saw the first ever use of the Helicopter, a revolutionary form of aircraft that will surely change the battlefield forever. We should capitalize and bring this Revolution to our forces as soon as possible."
BRA_50s_Air_Force_Missiles:0 "Develop Missiles for Combat"
BRA_50s_Air_Force_Missiles_desc:0 "In the war, missiles debuted in their first usage in large scale combat. We must invest in this technology to improve our capabilities."
BRA_50s_Air_Force_IADC:0 "Integrated Air Defense Command"
BRA_50s_Air_Force_IADC_desc:0 "To expand our ADC, we'll have to expand radar coverage, deploy SAM systems, and increase interception efficiency over our homeland, integrating them all will make sure our Air Defense work perfectly like a well oiled machine."
BRA_50s_Air_Force_Airborne:0 "Núcleo da Divisão Aeroterrestre"
BRA_50s_Air_Force_Airborne_desc:0 "The Paratrooper School of the FAB was founded in 1945. Analysing both German and American paratroopers, Captain Roberto Pessoa helped be one of the first instructors of the School after studying in Fort Benning until 1948. Now this Nucleus will help us expand it until forming it into a proper Airborne Division."
BRA_50s_Air_Force_CAS:0 "Close Air Support Development"
BRA_50s_Air_Force_Cas_desc:0 "The best friend of the infantry on the air, the close air support provides substantial coverage for our units on ground and will be a key part in air-ground combined warfare doctrine."
BRA_50s_Air_Force_Gloster_Meteor:0 "Purchase the Gloster Meteor"
BRA_50s_Air_Force_Gloster_Meteor_desc:0 "The FAB's first jet plane was the Gloster Meteor, purchasing 70 units from Britain in exchange for 15.000 units of cotton, in 1953 and staying in service until 1974."

BRA_50s_Army:0 "Exército Brasileiro"
BRA_50s_Army_desc:0 "Hailing from a proud history since the Imperial days, the Brazilian Army encompasses one of the strongest military forces in Latin and South America, proving its strength in the Italian Campaign of World War II."
BRA_50s_Army_Schools:0 "Expanding Army Schools"
BRA_50s_Army_Schools_desc:0 "With Military Colleges already being a tradition in Brazil, we should seek to expand these schools, increasing funding and opening more to form capable soldiers and officers."
BRA_50s_Army_Mechanized_Infantry:0 "The Mechanization of the Army"
BRA_50s_Army_Mechanized_Infantry_desc:0 "Mobile and quick infantry units marked the last war, and we would be fools to not invest in this for our army."
BRA_50s_Army_Artillery:0 "Improvements to the Artillery"
BRA_50s_Army_Artillery_desc:0 "“Battles are won with fire; therefore, increase your artillery!” Frederick the Great" famously said. With a great highlights in our conflicts since our independence, artillery has been a key element in our army. Therefore we should only invest more on its development."
BRA_50s_Army_Professional_Army:0 "A Modern Army in the Modern Age"
BRA_50s_Army_Professional_Army_desc:0 "Gone are the days of only infantry winning the war. The world is changing, and we must change too. Combined arms is the future, and we shall invest on it to keep our proud title of strongman of South America."
BRA_50s_Army_Supplies:0 "Logistics Win Wars"
BRA_50s_Army_Supplies_desc:0 "A soldier's stomach matters more than his gun. Improvements in our supplies and logistics will be crucial for any military endeavours we face in the future."
BRA_50s_Army_Military_Police:0 "Reforming the MIlitary Police"
BRA_50s_Army_Military_Police_desc:0 "During the Vargas Era, the Police was sidelined as the federal government took direct intervention in matters of security. Now that these days are over, we can reform the Military Polices to have full control of the states again."
BRA_50s_Army_Light_Tanks:0 "Light Armor Specialization"
BRA_50s_Army_Light_Tanks_desc:0 "We will focus our strategies and developments around light tanks and infantry support, for speed is the real key to victory."
BRA_50s_Army_MBT:0 "Main Battle Tank Specialization"
BRA_50s_Army_MBT_desc:0 "A new form of tank is rising on the field, the Main Battle Tank. With modern equipment, focusing on balancing Protection, Mobility and Firepower, it will be more constly, but will greatly improve our armored power in wars."
BRA_50s_Army_Elite:0 "Special Forces Program"
BRA_50s_Army_Elite_desc:0 "Special Forces are key to winning crucial and important battles. With more funding and training, we can always have a unit ready for critical missions."

BRA_50s_Navy:0 "Marinha do Brasil"
BRA_50s_Navy_desc:0 "Our Navy patrols our coasts and keeps our people and our oceans safe."
BRA_50s_Navy_Light_Ships:0 "Light Ship Designs"
BRA_50s_Navy_Light_Ships_desc:0 "The spine of every navy is its light ships. Despite the imponent firepower of large vessels, light ships do most of the tasks and are the most vital part of any navy."
BRA_50s_Navy_ASW:0 "Anti Submarine Warfare"
BRA_50s_Navy_ASW_desc:0 "Submarines were a key factor in both world wars. We need to develop measures to counter them and protect our vessels."
BRA_50s_Navy_Submarines:0 "Principles of Submarine Warfare"
BRA_50s_Navy_Submarines_desc:0 "And we shall focus on improving our own arsenal of underwater hunters too. For they are essential for a powerful and capable naval force."
BRA_50s_Navy_Amphibious:0 "Develop Amphibious warfare"
BRA_50s_Navy_Amphibious_desc:0 "The infantryman is not merely a land fighter anymore. With the changes from the last wars, amphibious warfare became commonplace, and as such we must develop our own amphibious forces."
BRA_50s_Navy_Tech:0 "Modernize the Navy"
BRA_50s_Navy_Tech_desc:0 "With our lessons from the War, we shall reorganize the navy into a modern force, to reduce the production costs and renew our strategies."
BRA_50s_Navy_ASM:0 "Naval Aviation"
BRA_50s_Navy_ASM_desc:0 "Ships and planes work hand in hand. So we will improve both our naval aviation and our Ships' anti air capabilities."
BRA_50s_Navy_Logistic:0 "Department of Naval Logistics"
BRA_50s_Navy_Logistic_desc:0 "With ships often being months away from our ports, we need to improve our navy's logistic and supply methodology to guarantee total mission efficiency."
BRA_50s_Navy_Carrier:0 "Carrier Centric Doctrine"
BRA_50s_Navy_Carrier_desc:0 "The Aircraft Carrier is without a doubt the most important change in naval warfare of the last thousands of years. A strong navy requires a strong carrier force to dispatch the enemy at a second's notice."
BRA_50s_Navy_School:0 "The Naval School"
BRA_50s_Navy_School_desc:0 "The Naval School is a higher education institution of the Brazilian Navy that aims to mentally and physically train young Brazilians who will occupy the initial positions in the careers of Officers of the Navy, Marines and Navy Intendants."
BRA_50s_Navy_Minas_Gerais:0 "NAeL Minas Gerais"
BRA_50s_Navy_Minas_desc:0 "The NAeL Minas Gerais was a Colossus-class light aircraft carrier laid by the British Royal Navy during World War II as HMS Vengeance, was completed shortly before the end of the conflict and did not see combat. After stints as a training ship and research vessel in the Arctic, the carrier was loaned to the Royal Australian Navy from 1952 to 1955. She was returned to the British, who sold her to Brazil in 1956."

BRA_1955_Elections:0 "The Elections of 1955"
BRA_1955_Elections_desc:0 "The 1955 Brazilian presidential election took place on October 3rd and was the sixteenth presidential election and the fourteenth direct election."

BRA_1955_Elections_Kubitschek:0 "President Kubitschek"
BRA_1955_Elections_Kubitschek_desc:0 "The Mineiro medic and policeman Juscelino Kubitschek has been elected President for the PSD."
BRA_Kubitschek_50_Years:0 "Fifty Years in Five"
BRA_Kubitschek_50_Years_desc:0 "JK has drawn a bold and ambicious plan for our economical development, the Goals Plan, coloquially referred as "50 years in 5", composed of 30 governmental goals who seek to improve Brazil in an incredibly large scale in just five years."
BRA_Kubitschek_Heterodox:0 "Goals Nineteen to Twenty-nine"
BRA_Kubitschek_Heterodox_desc:0 "JK has planned that our heavy industry must be expanded to supply the reforms we seek to implement everywhere."
BRA_Kubitschek_Ports:0 "Build Ports and Dockyards"
BRA_Kubitschek_Ports_desc:0 "Brazil's large coastline is a natural help for us to improve our infrastructure and international trading power by expanding and building our ports and dockyards."
BRA_Kubitschek_Electrification:0 "Goals One to Five"
BRA_Kubitschek_Electrification_desc:0 "The five first goals on the JK plan sought to increase hydroelectric power generation, encourage the construction of increase coal production for fossil plants, increase oil production and refining capacity, and even encourage the construction of nuclear power plants."
BRA_Kubitschek_Oil:0 "Expanding the Oil Industry"
BRA_Kubitschek_Oil_desc:0 "The Black Gold moves the world- in more ways than one. To create a true country of the future, Brazil must have a stronger oil industry to meet our domestic and industrial needs."
BRA_Kubitschek_Coal:0 "The Coal Iniciative"
BRA_Kubitschek_Coal_desc:0 "We seek a structural change in the coal industry, which is in crisis due to the dieselization of the railway network, that left without demand for inferior grades of coal, which are mandatory for production, unavailable, seeking to increase production to 3 million tons of coal until 1960."
BRA_Kubitschek_Steel_Works:0 "The Heart of the Steel Industry"
BRA_Kubitschek_Steel_Works_desc:0 "Our steel industry has started with the foundation of the National Steel Company by Vargas in 1942, being the main productor of steel in Brazil. President JK has decided to invest in it and in stocks of the Belgian Congo Mining Co."
BRA_Kubitschek_Communications:0 "Connecting the People"
BRA_Kubitschek_Communications_desc:0 "Long gone are the days of slow communication. Brazil must be a modern country, and as such, have a modern communication network, from telephones to radios and televisions."
BRA_Kubitschek_Food:0 "Goals Thirteen to Eighteen"
BRA_Kubitschek_Food_desc:0 "The most important thing we must secure for our people is food security. With these goals projected, we will invest in the food industry and seek to lower prices for the consumers."
BRA_Kubitschek_Healthcare:0 "Healthcare for All"
BRA_Kubitschek_Healthcare_desc:0 "And as important as ever, our people must be kept healthy and well. We will build hospitals and clinics in the interior so the poorer population can access them too, as well as expanding our current hospitals."
BRA_Kubitschek_Education:0 "Goal Number Thirty"
BRA_Kubitschek_Education_desc:0 "To guarantee the future, for fifty years and beyond, education is fundamental. To have a great country, we must have great learning."
BRA_Kubitschek_Agriculture:0 "Expanding the Agricultural Frontier"
BRA_Kubitschek_Agriculture_desc:0 "Our next goal is to allow more land to be used by the agricultural industry, expanding our food exports and consumer access to it."
BRA_Kubitschek_Housing:0 "Housing and Sanitation"
BRA_Kubitschek_Housing_desc:0 "Many people still lack proper housing in our country. By building more state homes we can give them a proper dignified roof. And we will improve our sanitation since many in the interior lack proper access to it."
BRA_Kubitschek_Infrastructure:0 "Goals Six to Twelve"
BRA_Kubitschek_Infrastructure_desc:0 "These goals were directed to the transport sector, focusing in expanding our infrastructure and developing our roads and vehicles."
BRA_Kubitschek_Automotive_Industry:0 "An Era of Automotives"
BRA_Kubitschek_Automotive_Industry_desc:0 "President JK wishes to incentivize the consumer goods commerce, especially the car commerce. The Automotive Industry Executive Group (GEIA) was created by decree no. 39,412, based on Juscelino Kubitschek's goals plan, and helped in the entry of several factories in the automotive sector, which were installed in Brazil, mainly in ABC Region of São Paulo, including Volkswagen, Ford, FNM, General Motors, International Harvester, Carrozzeria Ghia, Mercedes-Benz, Scania, Simca, Toyota, Vemag, and Willys-Overland.). The government sought to assist the private sector, both national and foreign, with fiscal, exchange, credit and commercial incentives."
BRA_Kubitschek_Industry_Northeast:0 "Improving Life in the Northeast"
BRA_Kubitschek_Industry_Northeast_desc:0 "The Northeast has always been a backwater part of Brazil, forgotten and neglected by past governments. We seek to improve this the most we can."
BRA_Kubitschek_Technical:0 "Promote Consumer Goods"
BRA_Kubitschek_Technical_desc:0 "The consumer sector must flow. With state campaigns to encourage people to buy products, alognside the new techs of television, we'll ensure our people will buy more and let the economy work well."
BRA_Kubitschek_Downsides:0 "Dealing With the Downsides"
BRA_Kubitschek_desc:0 "Our ambitious projects have not been without problems. The masss spending and intense projects caused our inflation to skyrocket to over 30%, and our external debt to increase even more after JK ruptured with the IMF due to disagreeing with their views of how Brazil's economy should be."
BRA_Kubitschek_Corruption:0 "Solving the Corruption"
BRA_Kubitschek_Corruption_desc:0 "Another big problem was the accusations of corruption that the government suffered, which helped severely affect JK's reputation amongst the population."
BRA_Kubitschek_Build_Roads:0 "Highways across the Country"
BRA_Kubitschek_Build_Roads_desc:0 "We need to decide which way will we connect our country from one side to the other. We've decided on building massive highways projects, connecting the south to the north."
BRA_Kubitschek_Railways:0 "Investing in Railways"
BRA_Kubitschek_Railways_desc:0 "We need to decide which way will we connect our country from one side to the other. We've decided that high speed railways is the best way to do it, to fast carry people and resources from one side to another."
BRA_Kubitschek_Build_Brasilia:0 "The Jewel in the Crown"
BRA_Kubitschek_Build_Brasilia_desc:0 "It's time to the final and greatest step in JK's entire govenrment, not only that but what shall define his legacy; A new capital of Brasilia, a modern and planned city in the middle of the country, symbol of our hard work and our hope for the future."

BRA_1955_Elections_Tavora:0 "President Tavora"
BRA_1955_Elections_Tavora_desc:0 "General Juarez Távora has won the elections for the UDN."
BRA_Tavora_UDN_Marshall:0 "The Marshall of the UDN"
BRA_Tavora_UDN_Marshall_desc:0 "Juarez Tavora was known for his discipline, austerity and military ties. As President, he'll make sure to centralize the UDN's power in the government."
BRA_Tavora_Cut_Spending:0 "Curb Governmental Spendings"
BRA_Tavora_Cut_Spending_desc:0 "Any good presidency must know to use money wisely. And President Tavora will do such by cutting unnecessary spendings in our budgets."
BRA_Tavora_Focus_on_Agro:0 "Focussing on the Agro"
BRA_Tavora_Focus_on_Agro_desc:0 "The main source of our economy is the agro, which helps uphold familiar and christian values, and as such must be the focus of our political plan."
BRA_Tavora_US_Alignment:0 "Reinforce our American Ties"
BRA_Tavora_US_Alignment_desc:0 "To show our american friends our commitment as their allies in this new cold war, we'll reinforce our ties with them, showing our loyalty to democratic values."
BRA_Tavora_Popular_Pressure:0 "Dealing With the Unrestful"
BRA_Tavora_Popular_Pressure_desc:0 "Tavora is still largely unpopular among the people, making governing a hard task. For this we'll have to deal with the resentfulness of the people."
BRA_Tavora_Privatization:0 "Privatization of the Companies"
BRA_Tavora_Privatization_desc:0 "SeveralS State owned companies pose a liability for corruption or inefficiency, with privatization our ptoblems will be solved, or at least, not be our problems anymore."
BRA_Tavora_Capital_Renovation:0 "Renovating the Wonderful City"
BRA_Tavora_Capital_Renovation_desc:0 "Rio de Janeiro is more than just the capital, it's the center of Brazilian culture and the face of Brazil as a whole, and a renovation project will do wonders to improve it for the citizens and the government alike."
BRA_Tavora_Deal_With_Congress:0 "The Other Obstacle"
BRA_Tavora_Deal_With_Congress_desc:0 "Not only the people have a distaste for Tavora, the Congress opposes him too. They must be dealt with aswell, by one way or the other."
BRA_Tavora_Oppose_Syndicates:0 "Opposing the Troublesome Syndicates"
BRA_Tavora_Oppose_Syndicates_desc:0 "The Laborists once again prove to be thorns in our sides, their popular movement inflamed by Getulists and communists alike. With the UDN firm in the government, we will make sure to oppose them."
BRA_Tavora_Anti_Getulism:0 "Crushing the Shadow of Vargas"
BRA_Tavora_Anti_Getulism_desc:0 "Of course the biggest troublemakers are the damn populists of the PTB. They've been on the decline for a while, but are still a large enough problem. And as such, we'll finish their annoyance once and for all."
BRA_Tavora_Placate_Army:0 "Appeasing the Army"
BRA_Tavora_Placate_Army_desc:0 "The Army is another unrestful factor in this difficult path to a proper government. They've been meddling with politics since the foundation of the Republic, and it would be wise to get on their good terms."
BRA_Tavora_Army_Reform_Law:0 "Revigorating the Army"
BRA_Tavora_Army_Reform_Law_desc:0 "To properly satisfy the army, we'll need a modernized and strong force. So we must increase its funding."
BRA_Tavora_Invest_In_Sao_Paulo:0 "Industrial Power"
BRA_Tavora_Invest_In_Sao_Paulo_desc:0 "A more pragmatic and limited industrialization will be conducted to improve our economy."
BRA_Tavora_Trade_With_America:0 "US Trade Deal"
BRA_Tavora_Trade_With_America_desc:0 "And it'll be good to have more foreign investments in our economy, mostly with our great partner, the US."
BRA_Tavora_Army_Equipment:0 "Buy Military Equipment"
BRA_Tavora_Army_Equipment_desc:0 "Our military expansion will also include buying modern equipment from our allies to supply our soldiers with the latest tech."
BRA_Tavora_Build_Docks:0 "Intercontinental Commerce"
BRA_Tavora_Build_Docks_desc:0 "With more docks across the country, we'll be able to improve our commercial power tenfold, and better direct our goods flow."
BRA_Tavora_SADI:0 "Dawn of the SADI"
BRA_Tavora_SADI_desc:0 "Not only we'll be good neighbours to the US, we'll be good friends. With a NATO style alliance between South American countries, our future will be secure and strong.  "

BRA_1955_Elections_Adhemar:0 "President Adhemar"
BRA_1955_Elections_Adhemar_desc:0 "Adhemar de Barros has been elected for the social democrat PSP."
BRA_Adhemar_Jeitinho:0 "Using the Jeitinho"
BRA_Adhemar_Jeitinho_desc:0 "Since he's unpopular, Adhemar must use the old trick of the brazilian "jeitinho" to get his objectives as president done."
BRA_Adhemar_Backroom_Deals:0 "The Art of Backroom Deals"
BRA_Adhemar_Backroom_Deals_desc:0 "One cannot think of being a successful politician in Brazil without some shady deals. And no one knows that more than Adhemar "Steals but Gets the Job Done" de Barros."
BRA_Adhemar_Deal_With_Workers:0 "Helping the Workingman"
BRA_Adhemar_Deal_With_Workers_desc:0 "Making the workers fully happy is never an easy task. But with some sweet talking and some leverage to make them somewhat satisfied."
BRA_Adhemar_New_Vargas:0 "The New Vargas"
BRA_Adhemar_New_Vargas_desc:0 "It's clear as day, the people still like Vargas despite all. So the people must get a new Vargas. And President Adhemar will do such, painting himself as the new champion of the workers of Brazil."
BRA_Adhemar_Bribe_Journalists:0 "Dismissing the Criticism"
BRA_Adhemar_Bribe_Journalists_desc:0 "To deal with the critics of President Adhemar, greasing some hands of the news will be necessary. Nothing out of the ordinary."
BRA_Adhemar_Infrastructure:0 "More Roads, Everywhere"
BRA_Adhemar_Infrastructure_desc:0 "In Brazil, the one who builds roads will always win, as the saying goes. And Adhemar loves visible works over invisible economic changes. With more roads, he will surely win popular support."
BRA_Adhemar_Power_Plants:0 "Light for Everyone"
BRA_Adhemar_Power_Plants_desc:0 "More people means more energy needs. President Adhemar will authorize the creation of more power plants and energy substations, giving more people in the interior access to proper electricity, and make sure he is photographed opening these works."
BRA_Adhemar_Industry:0 "Subsidies for the Industries"
BRA_Adhemar_Industry_desc:0 "With the recent dowtnturn of our economy in the last years, President Adhemar had to take the measures into his own hands by allowing the companies more subsidies to keep running successfully."
BRA_Adhemar_Homes:0 "A House for Everyone"
BRA_Adhemar_Homes_desc:0 "The people cannot be denied its right to digndified housing. A bold plan has been plotted by President Adhemar which involves building many houses for the people of low income."
BRA_Adhemar_Large_Industries:0 "There is Never Enough Factories"
BRA_Adhemar_Large_Industries_desc:0 "It's not enough to expand our industries. We need bigger, greater factories. Larger productions. Make the world see how grand and important we can be for us and for the world."
BRA_Adhemar_Oil:0 "Swimming in (Black) Gold"
BRA_Adhemar_Oil_desc:0 "Recent studies have shown that we sit over some of the largest fossil fuel depots in South America, bar only to Venezuela. We must take this valuable mine for maximum exploitation as quick as possible."
BRA_Adhemar_Airports:0 "Open the President Adhemar International Airport"
BRA_Adhemar_Airports_desc:0 "Perhaps out of pure self importance or just ego, a massive international airport, connecting our people and our economy everywhere and beyond will be opened in homage to President Adhemar, remembering him for good ot for bad."
BRA_Adhemar_Corruption:0 "Learning From His Mistakes"
BRA_Adhemar_Corruption_desc:0 "Adhemar has let himself go for too long. He realized, maybe too late about the consequenses of his tolerance for corruption. To cleanse his name, and his honor, drastic measures must be taken."
BRA_Adhemar_Brasilia:0 "The Greatest Bet of Them All"
BRA_Adhemar_Brasilia_desc:0 "Some would call it delusional. Some would call it insane. Some would call it money laundering. But Adhemar calls it by what it truly is: Brasilia is the greatest bet of them all. A bet that would cement his legacy in history, forever."