l_english:
 flavorsov.1.t:0 "[GetNewspaperHeader]Sputnik"
 flavorsov.1.d:0 "The Soviet Union has put Sputnik into orbit. The satellite's radio signal can be picked up from the ground."
 flavorsov.1.a:0 "The satellite is up."
 flavorsov.1.b:0 "Moscow has a satellite."
 flavorsov.2.t:0 "[GetNewspaperHeader]Gagarin Orbits the Earth"
 flavorsov.2.d:0 "Yuri Gagarin has orbited the Earth and returned. No person has done it before."
 flavorsov.2.a:0 "A man has orbited."
 flavorsov.2.b:0 "Gagarin is back."
 flavorsov.3.t:0 "[GetNewspaperHeader]Chernobyl"
 flavorsov.3.d:0 "A reactor at Chernobyl has exploded. A radioactive cloud is leaving the plant, and Moscow has yet to say how wide the damage runs."
 flavorsov.3.a:0 "The reactor is open."
 flavorsov.3.b:0 "A reactor has exploded."
 flavorsov.4.t:0 "[GetNewspaperHeader]The Afghan Withdrawal"
 flavorsov.4.d:0 "The last Soviet troops are leaving Afghanistan. Moscow's war, begun in 1979, is over. The government in Kabul remains."
 flavorsov.4.a:0 "The army is coming home."
 flavorsov.4.b:0 "The Soviets are leaving."
