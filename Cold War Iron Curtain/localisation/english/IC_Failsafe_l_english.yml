l_english:

 Indochina_Struggle_Ending.20.t: "The Indochina Question Cannot Wait Forever"
 Indochina_Struggle_Ending.20.d: "The war in Indochina has reached a settlement that everyone but us seems willing to sign. Our delegation has been sitting on the terms for two months now, and the parties on the ground have stopped waiting for an answer.\n\nOur ministers are blunt about what happens next. If we do not close this out ourselves within the month, the settlement will be concluded over our heads and we will be presented with the result rather than consulted on it.\n\nThe decision is still ours. It will not be for very much longer."
 Indochina_Struggle_Ending.20.a: "Then we had better decide."

