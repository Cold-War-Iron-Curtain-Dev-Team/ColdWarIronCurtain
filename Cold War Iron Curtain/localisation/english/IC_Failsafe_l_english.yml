 Indochina_Struggle_Ending.20.t: "The Indochina Question Cannot Wait Forever"
 Indochina_Struggle_Ending.20.d: "A settlement for Indochina has been available for two months, but the government entitled to put it into effect has yet to act. The delay leaves local authorities without final instructions on which civil offices and military posts they are to hand over.\n\nThe responsible government has a month to act on the outstanding settlement through the Indochina Struggle. If that time expires without a decision, the war will be settled without waiting for its consent."
 Indochina_Struggle_Ending.20.a: "Take note of the deadline."

