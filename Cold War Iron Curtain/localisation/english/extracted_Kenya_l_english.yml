 # ---- from Kenya.txt ----
 kenya.1.a2:0 "The beloved Chief! The servant of Kenya!"
 kenya.1.t2:0 "The Assassination of Chief Waruhiu"
 kenya.10.a2:0 "Fair points"
 kenya.10.t2:0 "Jaramogi Odinga's Criticism"
 kenya.11.a2:0 "This is true journalism."
 kenya.11.d2:0 "The publishing of the book 'the trial of Jomo Kenyatta' has spread outrage as readers discorver the true inscentives behind his imprisonment."
 kenya.11.t2:0 "The Trial of Jomo Kenyatta"
 kenya.12.a2:0 "Not all British are rascist."
 kenya.12.d2:0 "Many liberal voices in Britain have begun to speak out against the unjust inprisonment of Jomo Kenyatta, citing a lack of credible evidence nor justifiable reason."
 kenya.12.t2:0 "British Sympathy"
 kenya.13.a2:0 "A lovely change."
 kenya.13.d2:0 "As we adapt to the new lifestyle we aspire to here in Kenya, we are slowly changing our Government to be for a permanent nation state rather than a colony"
 kenya.13.t2:0 "Adoption of a Bicameral Legislature"
 kenya.14.a2:0 "Hurray!"
 kenya.14.d2:0 "Running on the platform of expanding exclusivity of the white highlands, Michael Blundell has been elected governor of Kenya"
 kenya.14.t2:0 "The inauguration of Michael Blundell"
 kenya.15.a2:0 "We have dark days ahead of us"
 kenya.15.d2:0 "Our governor this week, following the assassination of various pro-british local figure, aswell as violence and rebellion against white settlement and rule; has declared a state of emergency"
 kenya.15.t2:0 "Declaration of a State of Emergency!"
 kenya.16.a2:0 "Thus concludes this chapter of history"
 kenya.16.d2:0 "Evelyn Baring's long term as governor is finally coming to an end. Though many indiginous Kenyans will always view him as a tyrant, he will go down in history as the man who ended the Mau Mau Uprising"
 kenya.16.t2:0 "The Retiring of Sir Evelyn Baring"
 kenya.17.a2:0 "A new decade for Kenya."
 kenya.17.d2:0 "The resolution of the Mau Mau uprising by the KLFA and its following reconstruction is likely what Patrick Muir Renison's governorship will be remembered for"
 kenya.17.t2:0 "Patrick Muir Renison's Governorship"
 kenya.18.a2:0 "The scars of the Mau Mau persists."
 kenya.18.d2:0 "The damage made by the Mau Mau on Kenya's infrastructure and economy is still not fully addressed"
 kenya.18.t2:0 "Post Mau Mau Reconstruction"
 kenya.19.a2:0 "Who will lead Kenya in the future?"
 kenya.19.d2:0 "This decade is turbulent for the British Colonies. We are clearly a component of an obsolete and antiquated system. Shall the selfish perserve their own power, or will majority rule reign over an uhuru Kenya?"
 kenya.19.t2:0 "The Direction of the Protectorate"
 kenya.2.a2:0 "Lets hope this splendid uneventfulness continues"
 kenya.2.d2:0 "Philip Mitchell has been the governor of Kenya since 1944 and will continue to governor until 1952. Though unfocused and lacking a specific colonial policy, Philip Mitchell is quite liked by the British establishment"
 kenya.2.t2:0 "The Governorship of Philip Mitchell"
 kenya.20.a2:0 "Colonialism in Kenya slowly comes to a close."
 kenya.20.d2:0 "Malcolm MacDonald is a major proponent of the new decolonial policy of the United Kingdom. Known as a sympathizer for Jomo Kenyatta, MacDonald will surely support the return of the KAU, now KANU."
 kenya.20.t2:0 "The appointment of Malcolm Mcdonald"
 kenya.21.a2:0 "Uhuru!"
 kenya.21.d2:0 "The governor has signed off on a temporary transitional government under Jomo Kenyatta which will transition from a colony, to dominion, to an independent republic."
 kenya.21.t2:0 "The Establishment of the Transitional Government"
 kenya.22.a2:0 "Tom Mboya!"
 kenya.22.b2:0 "Kenyatta will bring us Uhuru!"
 kenya.22.d2:0 "The Kenyan African National Union has won overwelmingly, but who should their candidate be?"
 kenya.22.t2:0 "The 1963 General Election"
 kenya.23.a2:0 "Uhuru!"
 kenya.23.d2:0 "Harambee is a Kenyan tradition of community self-help events, e.g. fundraising or development activities. Harambee literally means all pull together in Swahili"
 kenya.23.t2:0 "Government Harambees"
 kenya.24.a2:0 "Modernization is coming."
 kenya.24.d2:0 "Today Jomo Kenyatta has passed the Transfer of Functions Act, which terminated grants to local authorities and transferred major services from provincial to central control."
 kenya.24.t2:0 "The Transfer of Functions Act"
 kenya.25.a2:0 "Kenya is close to a one party state."
 kenya.25.d2:0 "Following recent unrest, Kenyatta has organized the merging of all major parties into the KANU in a single coalition"
 kenya.25.t2:0 "The Merging of KADU with KANU"
 kenya.26.a2:0 "We are in a new era"
 kenya.26.d2:0 "East African independence leaders, most notabley Julius Nyerere, Milton Obote, and Jomo Kenyatta have organized a conference this evening where they will decide the fate of a future federation."
 kenya.26.t2:0 "The East African Conference"
 kenya.27.a2:0 "Africa has a bright future"
 kenya.27.t2:0 "Formation of the East African Federation"
 kenya.28.a2:0 "Death to Warlords!"
 kenya.28.t2:0 "Operation Bunyoro"
 kenya.29.a2:0 "Death to Warlords!"
 kenya.29.d2:0 "In an attempt to extend infleunce, Muammar al-Qaddafi has decided to send elite special forces to help us."
 kenya.29.t2:0 "Arrival of Libyan Volunteers"
 kenya.3.a2:0 "She went up the tree a princess, and came down a Queen"
 kenya.3.t2:0 "The Queen's Visit"
 kenya.30.a2:0 "Great!"
 kenya.30.d2:0 "As a symbol of our strength against the white minority governments to our south, a massive complex of fortresses have been built in the narrow Rhodesian border-gap inbetween the great lakes"
 kenya.30.t2:0 "The Great Mbeya Fortress"
 kenya.31.a2:0 "the EAF is exerting its power"
 kenya.31.d2:0 "Administrators from the lowly populated colony of the seychelles have submitted to our ultimatum on federal entry of their country."
 kenya.31.t2:0 "Annexation of the Seychelles"
 kenya.32.a2:0 "We are freemen"
 kenya.32.d2:0 "Delegates from South Africa have proposed a complex series of defensive treaties with us."
 kenya.32.t2:0 "South Africa proposes defensive treaty"
 kenya.33.a2:0 "Africa for Africans!"
 kenya.33.d2:0 "Great leaders from across the continent have come togeather today in a plan for greater African unity. While initial attempts by organizations such as the OAU have been incunclusive, this will be a much more decisive event."
 kenya.33.t2:0 "The Pan-Africanist International"
 kenya.34.a2:0 "We are freemen"
 kenya.34.d2:0 "Kwame Nkrumah has organized the forming of a third worldist-defensive faction."
 kenya.34.t2:0 "The Treaty of the Third World"
 kenya.35.a2:0 "The KPU!"
 kenya.35.b2:0 "KANU has lead us right!"
 kenya.35.d2:0 "The 1966 general presidential election is a heated setting right now, with Jaramogi Oginga Odinga leading the UCP as an opposition party against KANU."
 kenya.35.t2:0 "The 1966 General Election"
 kenya.36.a2:0 "Jomo Kenyatta is creating a one party state!"
 kenya.36.b2:0 "Jaramogi Oginga Odinga is a radical leftist!"
 kenya.36.d2:0 "In the Lua majority city of Kisumu there were massive riots following the feirce altercation between Jarmogi Oginga Odinga and Jomo Kenyatta which lead in the former's arrest."
 kenya.36.t2:0 "The Kisumu Riots!"
 kenya.37.a2:0 "May he rest in peace."
 kenya.37.t2:0 "The Assassination of Tom Mboya"
 kenya.38.a2:0 "White Minority rule in Kenya."
 kenya.38.d2:0 "The British born Kenyan farmer and politician who served as a member of the Legislative Council has been appointed as the premier of a transitionary dominion of Kenya."
 kenya.38.t2:0 "The Appointment of Michael Blundell"
 kenya.39.a2:0 "Side with the UCP!"
 kenya.39.b2:0 "Side with the Revolution!"
 kenya.39.c2:0 "KLFA Veterans Coup!"
 kenya.39.t2:0 "The Kenyan Civil War!"
 kenya.4.a2:0 "Secretary, who has time for this!"
 kenya.4.t2:0 "Strange Kikuyu Movements?"
 kenya.40.a2:0 "Uhuru!"
 kenya.40.d2:0 "Through a convoluted beaucratic mess, finally Kenya has achieved internal and external independence from the United Kingdom"
 kenya.40.t2:0 "The Independence of Kenya!"
 kenya.41.a2:0 "A better way to organize ourselves"
 kenya.41.d2:0 "As we adapt to the new lifestyle we aspire to here in Kenya, we are slowly changing our Government to be for a permanent nation state rather than a colony"
 kenya.41.t2:0 "Creation of the Bicameral Legislature"
 kenya.42.a2:0 "They're a Threat!"
 kenya.42.d2:0 "Using as a justification the socialist and nationalism sentiment harbored by trade unions, Michael Blundell has formerly passed legislation abolishing their existance"
 kenya.42.t2:0 "Ban on Labor Unions"
 kenya.43.a2:0 "We have the same interests."
 kenya.43.d2:0 "The small collective of governors on the islands of the seychelles have decided to formerly welcome their federation with our nation."
 kenya.43.t2:0 "Federation with the Seychelles"
 kenya.45.a2:0 "The KADU"
 kenya.45.b2:0 "The UCP again!"
 kenya.45.d2:0 "While a white minority government has had a semi-sturdy administration these first three years, the next question is whether we shall continue this path, or a more moderate one."
 kenya.45.t2:0 "The 1966 General Presidential Election"
 kenya.46.a2:0 "We are free men!"
 kenya.46.d2:0 "Delegates from South Africa, Rhodesia, and Kenya have met today as independent nations looking to defend themselves from outside aggression"
 kenya.46.t2:0 "African Defensive Bloc"
 kenya.47.a2:0 "Align with Orthodox Marxist-Leninism!"
 kenya.47.b2:0 "We follow the Chinese Model!"
 kenya.47.c2:0 "We will find our own way!"
 kenya.47.d2:0 "All shred of reactionary aggression against the proletariate have been eleminated. Socialism has triumphed over all other ideologies in Kenya, but what path of socialism will we take?"
 kenya.47.t2:0 "Founding of the Kenyan People's Republic"
 kenya.48.a2:0 "Moi will walk in his footsteps..."
 kenya.48.b2:0 "KANU be damned!"
 kenya.48.d2:0 "Today, all of Kenya weeps as the father of all Kenyans has died from a heart attack. There is only one to follow in his footsteps..."
 kenya.48.t2:0 "The Death of Jomo Kenyatta!"
 kenya.5.a2:0 "Farewell."
 kenya.5.t2:0 "The Retiring of Philip Mitchell"
 kenya.52.a2:0 "Damn these Mau Mau!"
 kenya.52.t2:0 "The death of Archibald J. A. Wavell (2nd Earl)"
 kenya.53.a2:0 "They say he's good at cooking?"
 kenya.53.t2:0 "Welcome Officer Idi Amin!"
 kenya.6.a2:0 "How will this end?"
 kenya.6.t2:0 "The Kolloa Affray"
 kenya.7.a2:0 "The Jewel of Africa"
 kenya.7.d2:0 "Looking to South Africa and Rhodesia, Kenya's large white settlement has garnered a desire of white minority rule in the colony and protectorate"
 kenya.7.t2:0 "White Highland Rule"
 kenya.8.a2:0 "Was he really guilty?"
 kenya.8.t2:0 "The Arrest of Jomo Kenyatta"
 kenya.9.a2:0 "The youth don't understand how this world works"
 kenya.9.t2:0 "Student Riots in Nairobi"
 kenya_bw.1.a2:0 "Great News"
 kenya_bw.1.t2:0 "Successful Offensive against the..."
 kenya_bw.2.a2:0 "Terrible"
 kenya_bw.2.t2:0 "Failed Offensive against the..."
 newskenya.3.a2:0 "He will be dearly missed."
 newskenya.3.d2:0 "Today, all of Africa weeps as the lion sleeps tonight. Jomo Kenyatta died last evening after suffering a severe heart attack."
 newskenya.3.t2:0 "[GetNewspaperHeader] The Death of Jomo Kenyatta!"
