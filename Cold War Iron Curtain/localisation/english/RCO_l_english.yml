l_english:
 RCO_alert_tt:0 "§RRegime Change Opportunity§!\nAvailable in:\n[RCO_target_list]\nOpen the country's §Ydiplomacy§! screen and use §YRegime Change Opportunity§!.\n\n§GRight-click§! to dismiss until a new opportunity appears."
 RCO_target_line:0 " • §Y[?rco_v.GetName]§!\n[RCO_target_list_inner]"
 opt_regime_change_opportunity:0 "Regime Change Opportunity"
 RCO.1.t:0 "Regime Change Opportunity: [RCO_target.GetNameDef]"
 RCO.1.d:0 "The situation in [RCO_target.GetNameDef] has opened a window to change the course of history. How shall we proceed?"
 RCO.1.cancel:0 "Not now."
 RCO_sov_greece:0 "The Percentage Agreement"
 RCO_sov_greece_desc:0 "§gHistorical§!\nThe Greek Democratic Army is collapsing. Honour the 1944 agreement with Churchill and let Greece go, or tear it up and intervene openly."
 RCO_sov_china:0 "The Manchurian Intervention"
 RCO_sov_china_desc:0 "§YAlternate history§!\nThe People's Liberation Army is on the verge of defeat. Intervene in Manchuria to save what is left of the Chinese revolution. §RThe civil war ends in a Nationalist victory§!: the Communists survive only in the north-east."
 RCO_sov_wgr49:0 "The 1949 Bundestag Election"
 RCO_sov_wgr49_desc:0 "§YAlternate history§!\nThe first West German election is approaching. Our networks could swing votes toward the KPD, at the risk of being exposed."
 RCO_sov_stalin_note:0 "The Stalin Note"
 RCO_sov_stalin_note_desc:0 "§gHistorical§!\nPropose a reunified, neutral Germany to the Western powers, before West Germany is bound to the Atlantic alliance."
 RCO_sov_yug:0 "Ultimatum to Belgrade"
 RCO_sov_yug_desc:0 "§YAlternate history§!\nWith the Greek communists holding the border, Tito is surrounded. Demand that Yugoslavia accept Soviet troops, or face war."
