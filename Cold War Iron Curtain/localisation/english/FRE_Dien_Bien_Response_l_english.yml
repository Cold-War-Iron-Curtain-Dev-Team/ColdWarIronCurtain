l_english:

 FRE_Dien_Bien.1.t:0 "The Defense of Dien Bien Phu"
 FRE_Dien_Bien.1.d:0 "The Viet Minh have committed their main force to the valley. The camp remains an airhead surrounded by high ground, and every plan now trades men, aircraft, and political credit against time. A conventional defense preserves flexibility but cannot make the airstrip secure. Maximum reinforcement may keep the works intact longer, at the cost of binding the expeditionary reserve to one basin. Operation Condor can try to reopen a land corridor after the siege closes. An appeal for Operation Vulture risks widening the war while leaving the final decision in Washington.\n\nWhatever is chosen, the camp is not declared saved in advance. It must remain outside Viet Minh hands until their campaign is spent."
 FRE_Dien_Bien.1.a:0 "Hold with the garrison and scheduled airlift."
 FRE_Dien_Bien.1.b:0 "Send the reserves and maintain the airbridge at any cost."
 FRE_Dien_Bien.1.c:0 "Prepare Operation Condor to reopen the corridor."
 FRE_Dien_Bien.1.e:0 "Ask Washington for Operation Vulture."

 FRE_DBP_Standard_Hold_tt:0 "§YOutcome contract - standard hold§!\nCommit §Y2,500 Manpower§! and lose §R3 Metropole Patience§!. The Tai garrison receives a limited ammunition issue and a modest camp-defense bonus.\n\n§GIf the camp remains outside Viet Minh hands through campaign day 260§!: gain §G40 War Credits§!, §G3 Metropole Patience§!, and §G2% War Support§! in addition to the campaign result.\n\n§RIf the camp falls§!: lose a further §R3,000 Manpower§! and §R3% War Support§! in addition to the campaign result."
 FRE_DBP_Maximum_Reinforcement_tt:0 "§YOutcome contract - maximum reinforcement§!\nSpend §Y100 War Credits§!, commit §Y6,000 Manpower§!, and lose §R8 Metropole Patience§!. The expeditionary reserve reinforces the Tai garrison, strengthens the camp, and delays fort degradation by §G14 days of active siege§!. The day-150 and day-260 campaign deadlines do not move.\n\n§GIf the camp remains outside Viet Minh hands through day 260§!: gain §G100 War Credits§!, §G8 Metropole Patience§!, §G2,000 Manpower§!, and §G4% War Support§!, with an additional struggle swing toward France.\n\n§RIf the camp falls§!: lose a further §R7,000 Manpower§!, §R2,000 Infantry Equipment§!, §R250 Support Equipment§!, §R125 Artillery Equipment§!, §R10 Metropole Patience§!, and §R5% War Support§!."
 FRE_DBP_Condor_tt:0 "§YOutcome contract - Operation Condor§!\nSpend §Y70 War Credits§!, commit §Y3,500 Manpower§!, and lose §R5 Metropole Patience§!. After the Viet Minh invest the valley, French-aligned forces must regain and hold the camp, one northern or eastern approach, and one outer-ring position for §Y7 consecutive days§!. Opening that corridor relieves §G14 invested-siege days§! and preserves part of the garrison.\n\n§GIf the corridor is opened and the camp then survives through day 260§!: gain §G80 War Credits§!, §G6 Metropole Patience§!, §G2,500 Manpower§!, and §G3% War Support§!, with a modest struggle swing toward France.\n\n§RIf the camp falls before the corridor opens§!: lose a further §R5,000 Manpower§!, §R5 Metropole Patience§!, and §R4% War Support§!. A corridor opened before the final fall reduces that additional loss."
 FRE_DBP_Vulture_Request_tt:0 "§YOutcome contract - request Operation Vulture§!\nSpend §Y40 War Credits§! and lose §R4 Metropole Patience§! while Washington decides. Approval supplies the garrison, adds American air support over the valley, and relieves §G10 days of active siege§!; refusal grants no battlefield aid. A later American decision may still turn limited support into direct intervention.\n\n§GIf American support arrives and the camp survives through day 260§!: gain §G75 War Credits§!, §G5 Metropole Patience§!, and §G3% War Support§!, with a pro-French struggle award.\n\n§RIf the camp falls§!: lose a further §R4,000 Manpower§!, §R6 Metropole Patience§!, and §R4% War Support§! in addition to the diplomatic escalation already incurred."

 FRE_Dien_Bien.2.t:0 "American Aircraft Over the Valley"
 FRE_Dien_Bien.2.d:0 "Washington has authorized air support for the camp. New parachutes, ammunition, and radio equipment are already entering the airbridge, while American crews begin striking the roads and gun positions around the basin. The aid buys time and firepower; it does not remove the Viet Minh from the heights or decide whether the position can hold."
 FRE_Dien_Bien.2.a:0 "Use every hour they have bought us."
 FRE_Dien_Bien.3.t:0 "Washington Refuses Vulture"
 FRE_Dien_Bien.3.d:0 "The answer from Washington is no. The President will not widen the war without allied commitments and congressional support, and neither exists. The camp will receive no American bomber offensive. Its garrison must now survive on the airlift and the resources already committed from Indochina."
 FRE_Dien_Bien.3.a:0 "Then the corps fights with what it has."
 FRE_Dien_Bien.4.t:0 "Operation Condor Opens the Corridor"
 FRE_Dien_Bien.4.d:0 "The relief columns have linked the outer positions to the camp and kept the route open through a week of counterattacks. Wounded men and exhausted units are moving out while ammunition and replacements move in. The valley remains contested, but the garrison is no longer fighting as an isolated pocket and the siege timetable has been set back."
 FRE_Dien_Bien.4.a:0 "Hold the route and rebuild the inner line."

 FRE_Dien_Bien.5.t:0 "The Dien Bien Phu Ledger"
 FRE_Dien_Bien.5.d_held:0 "The Viet Minh campaign has expired with the camp still in French-aligned hands. Scheduled airlift and the ordinary garrison plan proved sufficient. The valley remains remote and expensive, but Paris can now claim that the position did what it was built to do: draw in Giap's main force and survive it."
 FRE_Dien_Bien.5.d_reinforced:0 "The Viet Minh campaign has expired against a camp sustained by the whole expeditionary reserve. The commitment was costly, but the airbridge, replacement battalions, and rebuilt works kept the central position intact through the final deadline. Paris must now pay for the wager it demanded, and can also claim its return."
 FRE_Dien_Bien.5.d_condor:0 "Operation Condor reopened the approaches after the valley was invested, and the corridor remained useful long enough to relieve the garrison and break the siege timetable. The camp has survived the Viet Minh campaign. The result belongs to the troops who held the basin and the columns that reached them, not to a promise made before either task was done."
 FRE_Dien_Bien.5.d_vulture:0 "American air support bought the time the garrison needed. The Viet Minh campaign has expired without taking the camp, and Operation Vulture can be presented as the intervention that preserved the French position. It also made the war visibly international, a price that will follow every later negotiation."
 FRE_Dien_Bien.5.d_fall_standard:0 "The standard defense has failed. The airstrip closed, the inner strongpoints were reduced, and the camp is now in Viet Minh hands. The wider campaign result and the political shock will be recorded elsewhere; the expeditionary corps must also account for the garrison and formations lost in the valley."
 FRE_Dien_Bien.5.d_fall_max:0 "Maximum reinforcement has turned defeat into catastrophe. The reserves, guns, and transport effort committed to keep the camp alive are trapped with it, and the losses exceed those of an ordinary failed defense. Paris demanded that the valley be held at any cost. The account has arrived."
 FRE_Dien_Bien.5.d_fall_condor:0 "Operation Condor could not save the camp. The relief columns either failed to reopen the approaches or opened them too briefly to reverse the siege. Any route secured before the final collapse allowed part of the garrison to escape, but the valley and the campaign objective belong to the Viet Minh."
 FRE_Dien_Bien.5.d_fall_vulture:0 "Air power did not save the camp. Whether Washington limited its aid or committed openly, the Viet Minh closed the strip, survived the strikes, and took the central position. The expeditionary corps has lost the valley while the diplomatic cost of asking another power to widen the war remains."
 FRE_Dien_Bien.5.d_inconclusive:0 "The fighting ended without the camp being taken and without the Viet Minh offensive exhausting itself against the final deadline. The defensive plan is closed without claiming a victory; the wider war or an armistice, rather than this ledger, ended the immediate contest."
 FRE_Dien_Bien.5.d_superseded:0 "A wider settlement has overtaken the siege. The garrison dispositions, relief plans, and appeals for outside air power are being unwound under the terms governing the whole theatre. No separate defensive victory or defeat will be awarded."
 FRE_Dien_Bien.5.a:0 "Close the camp's operational ledger."

 VIN_Dien_Bien.1.t:0 "The Defense in the Valley"
 VIN_Dien_Bien.1.d_held:0 "The colonial camp remains outside our hands after the offensive's final deadline. Airlift, reinforcements, or a reopened corridor kept the position alive long enough for the assault divisions to spend their strength. The valley has not decided the war in our favor."
 VIN_Dien_Bien.1.d_fall:0 "The camp at Dien Bien Phu is ours. Reinforcements, relief columns, and foreign aircraft changed the cost and timing of the siege, but none changed its objective. The central position has fallen, and the campaign now carries that result into the struggle and the negotiations to come."
 VIN_Dien_Bien.1.d_inconclusive:0 "The battle ended without the camp falling and without the enemy proving that it could survive the full campaign. The divisions leave the valley because the shooting or the wider war has stopped, not because either operational plan earned its best result."
 VIN_Dien_Bien.1.d_superseded:0 "A wider settlement has overtaken the battle in the valley. The campaign closes without a separate Dien Bien Phu battlefield result, and the abandoned positions will be disposed of under the terms governing the whole theatre."
 VIN_Dien_Bien.1.a:0 "The campaign has spoken."

 FRE_DBP_Standard_Holdout:0 "Scheduled Airlift at Dien Bien Phu"
 FRE_DBP_Standard_Holdout_desc:0 "The camp is holding to its planned establishment, depending on the regular airbridge and the garrison already in the valley."
 FRE_DBP_Maximum_Holdout:0 "Maximum Reinforcement of Dien Bien Phu"
 FRE_DBP_Maximum_Holdout_desc:0 "The expeditionary reserve and the transport fleet have been committed to the valley, strengthening the works while consuming men, aircraft, and political patience."
 FRE_DBP_Condor_Staging:0 "Operation Condor"
 FRE_DBP_Condor_Staging_desc:0 "Relief columns are assembling to reopen the highland approaches after the Viet Minh close their ring around the camp."
 FRE_DBP_Vulture_Air_Support:0 "Operation Vulture Air Support"
 FRE_DBP_Vulture_Air_Support_desc:0 "American aircraft are striking the siege lines and supplementing the airbridge. Their intervention buys time without guaranteeing the camp's survival."
