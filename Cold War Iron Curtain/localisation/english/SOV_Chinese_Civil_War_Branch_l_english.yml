l_english:
 # ============================================================================
 #  THE CHINESE QUESTION - Chinese Civil War side branch (SOV / Stalin tree)
 #  Visible from game start. Forks on the outcome of the civil war.
 # ============================================================================

 # ---- Events ----
 sov_china_branch.1.t:0 "The 156 Projects"
 sov_china_branch.1.d:0 "The largest technology transfer in history is under way, and it is going in a direction nobody in Washington anticipated.\n\nOne hundred and fifty-six complete industrial plants — steel mills, power stations, machine-tool works, aircraft factories — are being shipped from the Soviet Union to China with the blueprints, the tooling and the engineers to run them. China is being given, in a decade, an industrial base that took the Soviet Union three five-year plans and a famine to build.\n\nIt is being paid for with Chinese loans at Soviet interest rates, and it makes the People's Republic dependent on Moscow for every spare part it will need for twenty years. Both facts are understood on both sides."
 sov_china_branch.1.a:0 "Generosity with a very long invoice."

 sov_china_branch.2.t:0 "The Return of Port Arthur"
 sov_china_branch.2.d:0 "Soviet forces are withdrawing from Lüshun, and the naval base the Russian Empire took in 1898 and the Red Army took back in 1945 is being handed to the Chinese without conditions.\n\nIt is the single most effective thing Moscow has done in Asia. Every Chinese schoolchild knows what Port Arthur means; the unequal treaties are a live political fact in Peking, not a history lesson. Returning it without being asked twice does more for the alliance than any quantity of machine tools.\n\nIt also costs the Soviet Navy its only warm-water Pacific anchorage. The Presidium argued about this for eight months."
 sov_china_branch.2.a:0 "Some things are worth more given away."

 sov_china_branch.3.t:0 "The Twentieth Congress Reaches Peking"
 sov_china_branch.3.d:0 "Comrade Khrushchev's speech to the closed session was not published, which has not prevented every communist party in the world from reading it within weeks.\n\nIn Peking the reaction is cold. Chairman Mao was not consulted, not forewarned, and does not accept that the leadership of the socialist camp may rewrite its own history without reference to the other half of it. The critique of the cult of personality is being read there as a critique of something rather closer to home than Stalin.\n\nNothing has broken. The treaty holds, the advisors are still in place, the projects are still being built. But something in the relationship has changed, and both sides know it."
 sov_china_branch.3.a:0 "They will not say it aloud. Not yet."

 sov_china_branch.4.t:0 "The Manchurian Redoubt"
 sov_china_branch.4.d:0 "The Chinese revolution has been driven back to where it started — the northeast, the industrial provinces the Japanese built and the Red Army stripped in 1945.\n\nWhat survives of the People's Republic holds Manchuria and nothing else. It is surrounded by a victorious Kuomintang on one side and the Soviet frontier on the other, and it exists because Moscow has decided it will exist.\n\nThe rump will be rebuilt as a Soviet client in fact as well as in name: our factories, our garrisons, our advisors, and a leadership that understands precisely who kept it alive."
 sov_china_branch.4.a:0 "What is left of China is ours."

 # ---- Focuses: shared ----
 SOV_ccw_the_chinese_civil_war:0 "The Chinese Civil War"
 SOV_ccw_the_chinese_civil_war_desc:0 "The largest war on earth is being fought in China, and the Soviet Union has been remarkably careful not to be seen in it.\n\nComrade Stalin's private view of the Chinese comrades has never been warm. He advised them to come to terms with Chiang in 1945, he signed a treaty of friendship with the Kuomintang, and he does not believe a peasant army can take a continent. Chairman Mao is aware of all three facts.\n\nBut the Kuomintang is collapsing faster than anyone in Moscow predicted, and a communist China — however unruly — is worth more than a correct prediction."
 SOV_ccw_the_chinese_civil_war_tt:0 "Unlocks the §YChinese Question§! branch."

 SOV_ccw_arm_the_peoples_liberation_army:0 "Arm the People's Liberation Army"
 SOV_ccw_arm_the_peoples_liberation_army_desc:0 "The People's Liberation Army fights with what it has captured — Japanese rifles from the Kwantung Army stockpiles, American equipment taken from Kuomintang divisions that surrendered rather than fought.\n\nThat can be improved on. Soviet materiel will move south through Manchuria, quietly, in quantity, and without any document confirming that it happened."
 SOV_ccw_arm_the_peoples_liberation_army_tt:0 "The PRC receives §Yequipment§!, §Ymanpower§! and §Yarmy experience§!.\nSoviet foreign power projection falls while the shipments continue."

 # ---- Focuses: PRC victory ----
 SOV_ccw_recognize_the_peoples_republic:0 "Recognize the People's Republic"
 SOV_ccw_recognize_the_peoples_republic_desc:0 "The People's Republic was proclaimed from the Gate of Heavenly Peace and the Soviet Union recognised it the following day — the first state in the world to do so.\n\nA quarter of humanity has joined the socialist camp in a single afternoon. Whatever reservations Moscow held about the Chinese comrades during the war, they are now the second power in that camp, and the correlation of forces in Asia has changed permanently."
 SOV_ccw_recognize_the_peoples_republic_tt:0 "Recognise the PRC. Mutual §Ymilitary access§! and a large improvement in relations.\nChina enters the §YSoviet sphere§!."

 SOV_ccw_soviet_loan_to_china:0 "Soviet Loan to China"
 SOV_ccw_soviet_loan_to_china_desc:0 "Three hundred million American dollars at one per cent, repayable over ten years.\n\nChairman Mao spent two months in Moscow negotiating it and made little secret of his opinion that it was miserly for a country of five hundred million people. Comrade Stalin's view was that the Chinese had asked for a great deal and offered very little, and that a loan repaid is a relationship maintained."

 SOV_ccw_the_156_projects:0 "The 156 Projects"
 SOV_ccw_the_156_projects_desc:0 "China has no industry to speak of outside Manchuria, and what Manchuria had, the Red Army removed in 1945.\n\nOne hundred and fifty-six complete plants will be transferred — steel, power, machine tools, aviation — with blueprints, tooling and the Soviet engineers to commission them. It is the largest transfer of industrial capacity ever attempted, it will cost us a great deal, and it will make the Chinese economy an extension of ours for a generation."
 SOV_ccw_the_156_projects_tt:0 "Large Soviet expenditure. China gains §Yfunding§!, an §Yindustrial complex§! and an §Yarms factory§!, and relations improve substantially."

 SOV_ccw_soviet_advisors_in_china:0 "Soviet Advisors in China"
 SOV_ccw_soviet_advisors_in_china_desc:0 "Ten thousand Soviet specialists will go to China — not only engineers but staff officers, planners, statisticians, university lecturers and secret policemen.\n\nThey will rebuild the Chinese state in the Soviet image because that is the only image any of them knows. In twenty years this will be remembered in Peking as the period when China was taught to be a copy of somewhere else. For now it is welcomed."
 SOV_ccw_soviet_advisors_in_china_tt:0 "Mutual §Ymilitary access§!. China gains §Yarmy§!, §Yair§! and §Ynaval experience§!.\nRelations improve substantially and Soviet foreign power projection rises."

 SOV_ccw_return_port_arthur:0 "Return Port Arthur"
 SOV_ccw_return_port_arthur_desc:0 "Lüshun has been Russian, then Japanese, then Russian again. Under the 1950 treaty it was to remain a joint Sino-Soviet naval base until 1952, and then until the Korean War ended, and then indefinitely.\n\nGiving it back unprompted costs the Pacific Fleet its only ice-free anchorage. It also removes the single sharpest grievance the Chinese have against us, and it removes it before they have to ask."
 SOV_ccw_return_port_arthur_tt:0 "Port Arthur is returned to China. Large gain in §Ypolitical power§!, relations improve substantially, and world tension falls."

 SOV_ccw_technical_assistance:0 "Technical Assistance"
 SOV_ccw_technical_assistance_desc:0 "Beyond the factories lies the harder question of what else to share — reactor designs, isotope separation, the theoretical work.\n\nChina will get a research reactor, a cyclotron and the training of a generation of physicists. It will not get a weapon. The distinction is clear in Moscow and will be a source of considerable resentment in Peking."
 SOV_ccw_technical_assistance_tt:0 "China gains a §Yresearch slot§! and a large bonus to §Yelectronics§! research.\nSoviet foreign power projection rises."

 SOV_ccw_the_twentieth_congress_in_peking:0 "The Twentieth Congress in Peking"
 SOV_ccw_the_twentieth_congress_in_peking_desc:0 "The secret speech was delivered to a closed session and read across the world within a month.\n\nChairman Mao was neither consulted nor warned. He has drawn two conclusions: that the leadership of the socialist camp treats the Chinese party as a subordinate rather than a partner, and that a doctrine which permits a dead leader to be denounced permits a living one to be denounced too.\n\nThe alliance is intact. The trust that held it together is not, quite, and everything that follows will follow from this."
 SOV_ccw_the_twentieth_congress_in_peking_tt:0 "Relations with China §Rdeteriorate§!.\nThe first crack in the alliance."

 # ---- Focuses: nationalist victory ----
 SOV_ccw_save_northwestern_china:0 "Save Northwestern China"
 SOV_ccw_save_northwestern_china_desc:0 "The People's Liberation Army has broken. Chiang holds the capital, the coast and the river valleys, and the Chinese revolution is being hunted across provinces it held six months ago.\n\nWhat can still be held is the northwest and the northeast — the ground that touches our frontier and can be supplied across it. Everything south of that is gone, and pretending otherwise will cost us what is left."

 SOV_ccw_military_bases_in_east_turkestan:0 "Military Bases in East Turkestan"
 SOV_ccw_military_bases_in_east_turkestan_desc:0 "Xinjiang has been within the Soviet orbit since the 1930s, and with the Kuomintang victorious in the east it is now a frontier rather than a province.\n\nSoviet garrisons and airfields will go in openly. Whatever remains of Chinese sovereignty there is a formality, and formalities are cheaper than a border war."

 SOV_ccw_provide_guns_to_the_military_cliques:0 "Provide Guns to the Military Cliques"
 SOV_ccw_provide_guns_to_the_military_cliques_desc:0 "Chiang's China was never one country. It is a coalition of warlords who submitted to Nanking because Nanking was winning, and a victorious Kuomintang will have to disarm them or be ruled by them.\n\nWe will make sure they are in a position to refuse. Every clique that keeps its own army is a province that Chiang does not really govern."

 SOV_ccw_the_manchurian_redoubt:0 "The Manchurian Redoubt"
 SOV_ccw_the_manchurian_redoubt_desc:0 "What is left of the People's Republic holds the northeast and nothing more — the industrial provinces, the rail junctions, and a frontier with the Soviet Union that is the only reason it still exists.\n\nIt will be rebuilt as what it now plainly is: a Soviet client. Our plants, our garrisons, our advisors, a leadership that owes Moscow its survival, and no illusions on either side about the arrangement.\n\nA China of eighty million in Manchuria is a smaller prize than a China of five hundred million. It is also a far more obedient one."
 SOV_ccw_the_manchurian_redoubt_tt:0 "The Manchurian rump gains §Yfunding§!, §Ystability§!, an §Yindustrial complex§!, an §Yarms factory§! and §Yequipment§!.\nRelations improve substantially."

 SOV_ccw_integrate_asia_into_the_eastern_bloc:0 "Integrate Asia into the Eastern Bloc"
 SOV_ccw_integrate_asia_into_the_eastern_bloc_desc:0 "With the Chinese revolution reduced to a Manchurian rump, there is no second power in Asia to share the leadership of the socialist camp with — and no argument about who leads it.\n\nManchuria, Mongolia, Xinjiang and the rest will be brought into the bloc on the same terms as Eastern Europe: eastern-bloc autonomy, a single economic plan, and no independent foreign policy anywhere between the Urals and the Pacific.\n\nIt is a poorer empire than a communist China would have been. It is an empire that will never argue back."

 # ---- Threats ----
 SOV_ccw_port_arthur_threat:0 "The Return of Port Arthur"
 # ---- Added: Manchuria arm extension ----
 sov_china_branch.5.t:0 "The Party in Exile"
 sov_china_branch.5.d:0 "The Chinese Communist Party has lost a country and kept an organisation.\n\nWhat crossed the Amur and the Ussuri in the last months of the war was not an army but a apparatus — the Central Committee, the cadre schools, the archives, and something over a hundred thousand people who cannot go home while Chiang lives.\n\nThey will be housed, fed, retrained and kept together in the Soviet Far East and in what remains of the People's Republic. A party without a country is a poor thing. A party without a country and without a party is nothing at all, and Moscow has decided that the Chinese revolution will not be permitted to end in a refugee column."
 sov_china_branch.5.a:0 "The revolution keeps its cadres."

 sov_china_branch.6.t:0 "The War Goes South"
 sov_china_branch.6.d:0 "Chiang holds the cities. He does not hold the countryside, and he never did.\n\nThe guerrilla base areas that the Kuomintang overran are being reactivated — in Jiangxi, in the Dabie mountains, across the southwest where the writ of Nanking has always been a polite fiction. The weapons come north to south through channels that officially do not exist.\n\nThis will not retake China. It will make certain that the government which won the civil war spends the next twenty years fighting it."
 sov_china_branch.6.a:0 "A victory he will never finish winning."

 SOV_ccw_rebuild_the_northeast:0 "Rebuild the Northeast"
 SOV_ccw_rebuild_the_northeast_desc:0 "Manchuria was the most industrialised region in Asia outside Japan, and in 1945 the Red Army took it apart and shipped it home — entire steelworks, power plants and rail yards, loaded onto flatcars and hauled to the Urals as war reparations.\n\nThe rump republic that now depends on us is sitting in the wreckage of what we removed. Returning some of it, and building the rest new, is the price of the client being worth having."
 SOV_ccw_rebuild_the_northeast_tt:0 "Large Soviet expenditure. Manchuria gains §Yfunding§!, an §Yindustrial complex§! and §Yinfrastructure§!, and relations improve substantially."

 SOV_ccw_shelter_the_chinese_party:0 "Shelter the Chinese Party"
 SOV_ccw_shelter_the_chinese_party_desc:0 "Over a hundred thousand cadres, soldiers and their families have crossed into Soviet territory ahead of the Kuomintang advance.\n\nThey will be housed and retrained rather than dispersed, and the party leadership kept intact under Soviet supervision. It is expensive and it will strain the Far Eastern districts. It also means the Chinese Communist Party continues to exist as an organisation rather than a memory — and that it exists on our terms."
 SOV_ccw_shelter_the_chinese_party_tt:0 "Gain §Ymanpower§! and political power at a small cost to stability.\nManchuria gains §Ystability§! and §Ywar support§!, and relations improve substantially."

 SOV_ccw_the_manchurian_peoples_army:0 "The Manchurian People's Army"
 SOV_ccw_the_manchurian_peoples_army_desc:0 "The rump republic has a frontier with a victorious enemy of five hundred million people and an army that has just been beaten by it.\n\nWhat is rebuilt will not be the peasant army that lost. It will be a Soviet-pattern force — Soviet weapons, Soviet doctrine, Soviet officers at every level that matters — because the alternative is a second defeat, and there will not be a third redoubt to retreat to."
 SOV_ccw_the_manchurian_peoples_army_tt:0 "Mutual §Ymilitary access§!. Manchuria gains §Yarmy§! and §Yair experience§!, §Yequipment§!, §Yarmour§! and an §Yair base§!."

 SOV_ccw_the_southern_insurgency:0 "The Southern Insurgency"
 SOV_ccw_the_southern_insurgency_desc:0 "Chiang won the war in the field. He has not won the villages, and the base areas that produced the Red Army in the first place are still there.\n\nArms, money and cadres will go south through Burma, through Indochina, through the ports — into every province where the Kuomintang's authority is a garrison rather than a government.\n\nWe are not going to retake China this way. We are going to make sure nobody else finishes taking it either."
 SOV_ccw_the_southern_insurgency_tt:0 "Nationalist China loses §Ystability§! and §Ywar support§! and gains §Ycommunist popularity§!.\nManchuria may send volunteers. World tension rises."

 SOV_ccw_isolate_the_kuomintang:0 "Isolate the Kuomintang"
 SOV_ccw_isolate_the_kuomintang_desc:0 "A nationalist China that won its civil war is the largest and most dangerous American client in the world, and it sits on four thousand kilometres of Soviet frontier.\n\nEvery lever will be used: recognition withheld, the security council seat contested, trade closed, and the border minorities of the west and southwest reminded who their neighbours are. Nanking will be made to understand that its victory bought it a permanent siege."
 SOV_ccw_isolate_the_kuomintang_tt:0 "Relations with Nationalist China §Rcollapse§! and it falls further into the §YAmerican§! camp.\nRelations with Manchuria improve and Soviet foreign power projection rises."

 SOV_ccw_southern_insurgency_threat:0 "Insurgency in China"
 # ---- Description for the focus moved in from SOV_Stalin.txt (name key already
 #      exists in focus_SOV_Stalin_l_english.yml; it never had a desc). ----
 SOV_krushchev_visit_china_desc:0 "Comrade Khrushchev will go to Peking for the fifth anniversary of the People's Republic — the first time a Soviet leader has set foot in China.\n\nStalin never went. Mao came to Moscow twice and was kept waiting at a dacha outside the city for weeks on end, a humiliation nobody in Peking has forgotten. Going to them reverses that, and it is meant to.\n\nHe will arrive with the Port Arthur agreement, additional credits, and the manner of a man among equals. It is the warmest moment the alliance will ever have."
