 cwic_mnc_invite_toshiba_electronics_desc:0 "Extend an invitation for Toshiba to invest in our electronics sector. If risk conditions remain acceptable, the corporation may respond with a proposal to expand its presence. Higher nationalization pressure can discourage investment."
 cwic_mnc_concession_toshiba_electronics:0 "Offer Concession to Toshiba (Electronics)"
 cwic_mnc_concession_toshiba_electronics_desc:0 "Offer a controlled concession for Toshiba to invest in our electronics sector. This option is intended for planned or closed economies that have authorized foreign concessions. The corporation may still refuse if perceived risk is too high."

  cwic_mnc_nationalization_targeted_cat:0 "Nationalize Foreign Corporations"
 cwic_mnc_nationalization_targeted_cat_desc:0 "Issue targeted nationalization orders against specific multinational corporations operating inside our borders. A successful action reduces the company’s presence tier in the selected sector, freezes further expansion temporarily, and transfers seized assets into state coffers. Higher tiers in the targeted sector generally yield larger payouts, but may increase political instability and raise long-term nationalization pressure."
 cwic_mnc_nat_exxon_hydrocarbons:0 "Nationalize Exxon (Hydrocarbons)"
 cwic_mnc_nat_exxon_hydrocarbons_desc:0 "Seize assets and curtail the operations of Exxon in the Hydrocarbons sector. This action reduces the company’s sector presence tier by one step (or removes it if minimal), applies a temporary freeze on new investment, and converts seized value into state revenue."
