 cwic_mnc_invitations:0 "Foreign Investment Invitations"
 cwic_mnc_invitations_desc:0 "Issue invitations or concessions to multinational corporations. Invitations will be reviewed over time and can trigger a response event, leading to expanded corporate presence by sector if the host country remains politically acceptable. Planned economies can enable limited concessions by authorizing foreign concessions."
 cwic_mnc_invite_exxon_hydrocarbons:0 "Invite Exxon (Hydrocarbons)"
 cwic_mnc_invite_exxon_hydrocarbons_desc:0 "Extend an invitation for Exxon to invest in our hydrocarbons sector. If risk conditions remain acceptable, the corporation may respond with a proposal to expand its presence. Higher nationalization pressure can discourage investment."
 cwic_mnc_concession_exxon_hydrocarbons:0 "Offer Concession to Exxon (Hydrocarbons)"
 cwic_mnc_concession_exxon_hydrocarbons_desc:0 "Offer a controlled concession for Exxon to invest in our hydrocarbons sector. This option is intended for planned or closed economies that have authorized foreign concessions. The corporation may still refuse if perceived risk is too high."
