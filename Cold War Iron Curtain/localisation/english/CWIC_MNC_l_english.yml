 CG_PRODUCED_TITLE_TT:0 "§YProduced§!\nMonthly domestic production of consumer goods.\n\nProduction is assigned to the best tier currently available for each category.\n\n§YCurrent Production Tier§!\nBasic Goods: [?cg_basic_producible_tier|Y0]\nDurable Goods: [?cg_durable_producible_tier|Y0]\nVehicles: [?cg_vehicles_producible_tier|Y0]\nConsumer Electronics: [?cg_consumer_electronics_producible_tier|Y0]\n\n§YIndustrial Capability§!\nLight Industry: [?modifier@cap_light_industry|Y1]\nPrecision Manufacturing: [?modifier@cap_precision_manufacturing|Y1]\nAutomotive: [?modifier@cap_automotive|Y1]\nElectronics: [?modifier@cap_electronics|Y1]\nManagement: [?modifier@cap_management|Y1]\n\nHigher tiers require stronger industrial, manufacturing, management, automotive, or electronics capacity depending on the category."
 CG_IMPORTED_TITLE_TT:0 "§YImported§!\nConsumer goods purchased from foreign exporters this month.\n\nImports are added to domestic stock before consumption is resolved, allowing trade to directly reduce shortages."
 CG_EXPORTED_TITLE_TT:0 "§YExported§!\nConsumer goods currently allocated to export stock.\n\nThese goods are removed from domestic availability once purchased by foreign buyers."
 CG_CONSUMPTION_TITLE_TT:0 "§YConsumption§!\nMonthly domestic consumer goods demand and coverage.\n\nDemand is based on population, development level, current year, and expected living standards. If available goods fall short, consumer goods pressure increases."
 CG_COVERAGE_ROW_TT:0 "§YCoverage§!\nThe share of monthly demand currently satisfied.\n\nLow coverage creates consumer goods shortages and increases economic and political pressure."
 CG_DEMAND_ROW_TT:0 "§YDemand§!\nThe population's monthly demand for this category of consumer goods.\n\nExpected quality rises over time and with national development. Higher expected tiers make older goods less effective at satisfying demand."
