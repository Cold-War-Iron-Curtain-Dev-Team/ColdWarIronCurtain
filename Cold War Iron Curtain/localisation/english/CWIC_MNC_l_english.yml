 CWIC_MNC.1000.t:0 "Foreign Investment Invite: Exxon (Hydrocarbons)"
 CWIC_MNC.1000.d:0 "Exxon has offered to enter our market in the hydrocarbons sector. If we accept, the firm will establish a local presence, begin deploying capital, and seek contracts, concessions, or partnerships consistent with our economic rules. Refusal keeps the invite open to other partners, but may slow foreign investment and reduce future technology and productivity spillovers. Our current nationalization pressure and economic openness will influence both the terms and the long-term risk of operating disputes."
 CWIC_MNC.1000.a:0 "Approve Exxon's entry"
 CWIC_MNC.1000.b:0 "Decline the invite"
