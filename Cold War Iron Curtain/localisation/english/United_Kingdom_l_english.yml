 ############EVENTS FOR GREAT BRITIAN############
 
 eng.1.t:0 "The Unification of Austria"
 eng.1.d:0 "The people of Austria want to be a free and independent country again. It could serve as a buffer state between the east and the west. Do we allow this?"
 eng.1.a:0 "Yes, of course!"
 eng.1.b:0 "No, we need to do something different with our Austrian territories."
 eng.2.t:0 "Replace the RoC with the PRC"
 eng.2.d:0 "The People's Republic of China wants to be recognized as the sole Chinese government in the UN. On one hand, the PRC controls the mainland and most relevant Chinese matters, but on the other, should we let the Commies take another UN Security Council seat?"
 eng.2.a:0 "Vote for giving the PRC the ROC's seats."
 eng.2.b:0 "No, the Commies shall stay out."
 eng.3.t:0 "Founding of the NHS"
 eng.3.d:0 "The NHS is founded. This new universal health organization has three principles: That it meet the needs of everyone, that it be free at the point of delivery, and that it be based on clinical need, not ability to pay."
 eng.3.a:0 "It is a momentous day for Britain!"
 eng.4.t:0 "Socialists Murder the Royal Family!"
 eng.4.d:0 "Last night, a group of socialist extremists broke into Buckingham Palace and murdered the members of the royal family that were there at the time. It is rumored that the remaining royals were evacuated to Canada until the unrest eases."
 eng.4.a:0 "They better run."
 eng.5.t:0 "Uganda Asks for Independence"
 eng.5.d:0 "Uganda wants independence from us. They are one of the core British colonies, but they are inland and far from our capital."
 eng.5.a:0 "Yes!"
 eng.5.b:0 "No, they still need our protection."
 eng.6.t:0 "Nigeria Asks for Independence"
 eng.6.d:0 "Nigeria wants independence from our rule. They produce a lot of oil and rubber, but our companies are ready to bargain with a potential independent Nigerian state. Should we let them go?"
 eng.6.a:0 "Yes!"
 eng.6.b:0 "No, they still need our protection."
 eng.7.t:0 "Kenya Asks for Independence"
 eng.7.d:0 "Kenya wants their independence from our failed colonial policies that led to things such as the Kenya Emergency. They are on the West African coast and are a major artery to India. Should we cut the rebellious area free?"
 eng.7.a:0 "Yes!"
 eng.7.b:0 "No, they still need our protection."
 eng.8.t:0 "Sudan Asks for Independence"
 eng.8.d:0 "Sudan wants independence from our rule. Although it is a Anglo-Egyptian condominium, we are effectively the rulers of Sudan. Should we let it free unilaterally?"
 eng.8.a:0 "Yes!"
 eng.8.b:0 "No, their status in relation to Egypt must still be determined."
 eng.1000.d:0 "Queen Elizabeth the Second has become the 39th British monarch and 6th queen crowned in Westminster Abbey. The three-hour long coronation ceremony beginning at 11:15 AM was the first BBC televised coronation. 129 countries were present at the coronation. Over 27 million British people watched the ceremony on television and over 2,000 journalists were outside the event. The ceremony could be seen as a symbol of the unity of the British Commonwealth: a family had sailed all the way from Australia in order to witness the coronation. However, the rebuilding of Great Britain is not finished yet: many viewers still had to adhere to rations."
 UKRadar.1.d:0 "RAF Saxa Vord, also known as Remote Radar Head Saxa Vord, is a new radar station located on the island of Unst, in the most northern of the Shetland Islands. Established initially in 1945 as an active part of British air defense, RRH Saxa Vord continues to remain a large part of the British air defense network, being integrated into the ROTOR system and the station being outfitted with AMES Type 80 radar in 1955. No. 91 Signals Unit was officially stationed at RRH Saxa Vord in 1957, and Her Majesty Queen Elizabeth II visited the site in 1960. All personnel maintain constant usage of the Latin motto Praemoneo de periculus, which means I give advanced warning about danger, something which definitely applies to this unique installation."
  
 eng.9.t:0 "Londoner Schuldenabkommen"
 eng.9.d:0 "The Western Allies have have invited us to discuss a restructurement of our debt to them, aiming at regulation of the pre- and post-war debts of Germany. Key features of the consensus so far are debt reduction by 16 billion marks, extended repayment schedules and inclusivity of various debt types, ranging from World War I reparations to post-World War II Reconstruction fonds like the Marshall Plan."
 eng.9.a:0 "Sounds reasonable. We will sign the Treaty."
 
 eng.10.t:0 "London Debt Conference"
 eng.10.d:0 "Today, representatives of West Germany and its creditors have gathered in London to sign a Debt Agreement, offering a decisive solution to Germany’s outstanding debts and paving the way for its economic and political reintegration into the global community. The treaty significantly reduces Germany's debt burden, halving its obligations from an initial 16 billion Deutsche Marks to approximately 7.5 billion Deutsche Marks. The remaining debt will be repaid under highly favorable conditions, including extended repayment schedules spanning up to 30 years and low-interest rates. Importantly, the repayment terms are tied to the performance of the German economy, ensuring that repayments do not hinder its ongoing recovery."
 eng.10.a:0 "An important step towards German Reconstruction."
 
 CWelect.1.t:0 "1950 General Election"
 CWelect.1.d:0 "The election of 1945, with the fall of Hitler's European Reich, set many precedents. Labour secured a large majority of Churchill-aligned Conservatives and the Liberal Party was shrunk to a mere third party and this situation carried us to this day. But that was 1945, it is now 1950 and the parties have changed. Labour has nationalized key industries and created the NHS, while the Conservatives are still led by Winston Churchill. The ballots are counted and..."
 CWelect.1.a:0 "Clement Attlee has done fine so far. Let him carry us further."
 CWelect.1.b:0 "Aneurin Bevan is the next Labour Leader"
 CWelect.2.t:0 "1951 Snap General Election"
 CWelect.2.d:0 "At the request of the King, Attlee has called a snap election to solidify the Labour Government, which currently holds a shaky majority. Will this act as Attlee expects and give him an overruling majority, or will it backfire entirely?"
 CWelect.2.a:0 "Labour Rule is solid!"
 CWelect.2.b:0 "Churchill and the Conservatives!"
 CWelect.3.t:0 "Election of 1955 - Anthony Eden v. Clement Attlee"
 CWelect.3.d:0 "With a firm four year break between elections, Britain goes back to the polls just a couple weeks after Churchill's resignation. Will Eden be able to carry the election? Or will Clement overcome?"
 CWelect.3.a:0 "Anthony Eden is charming, and he will defend us from Communism!"
 CWelect.3.b:0 "Clement Attlee has the experience."
 churchill:0 "Winston Churchill has long been a figure in British politics, and a famous one, his first appearance was in World War One, where he was the First Lord of the Admiralty. After years in Parliament and many cabinet positions, he was chosen in 1940 to replace Neville Chamberlain as prime minister, and his charisma and countless speeches got the British people through the war and all it curtailed. Winston Churchill and his career is much more defined by the Second World War than anything else, and that may be a good thing."
 anthony_eden:0 "Anthony Eden was Secretary of State for War during Churchill's first term and then Deputy Leader of the Conservatives during Churchill's time as opposition leader and the peace following the end of the war. He is one strong horse."
 Anthony_Eden_flag:0 "Anthony Eden is in office"
 CWelect.4.t:0 "Resignation of Anthony Eden"
 CWelect.4.d:0 "Anthony Eden has happily led his office as Prime Minister. However, his failures during the Suez Crisis have led him to resign the office of Prime Minister. Eisenhower spoke highly of MacMillan, leading the Queen to appoint MacMillan Prime Minister."
 CWelect.4.a:0 "All eyes land on the future of the Conservatives, now in the hands of Harold MacMillan."
 Harold_Macmillian:0 "Harold 'Supermac' MacMillan is a British Conservative. Harold MacMillan found his first success after the Liberal Party's collapse in 1924, which opened his constituency, Stockton-on-Tees, for election. In the past, MacMillan had many trips to the USSR, where he often spoke out against the government. In February of 1940, MacMillan visited Finland. When he returned, he campaigned against the British government's inactivity against Soviet aggression. When Churchill came to power in 1940, 'Supermac' became the Minister of Supply. He has been Housing Minister, Defense Minister, Foreign Secretary and the Chancellor of the Exchequer. He has now come to power following Eden's resignation."
 ENG_Lab:0 "Labour Party"
 ENG_Cons:0 "The Conservative and Unionist Party"
 Hugh_Gaitskell:0 "Hugh Todd Naylor Gaistkell is an economics lecturer and previously a wartime civil servant, first elected to parliament in 1945 during the Labour landslide under Clement Attlee. He was Minister of Fuel and Power during 1946-7 and joined Attlee's cabinet as Chancellor of the Exchequer."
 CWelect.5.t:0 "Election of 1959 - Harold MacMillan v. Hugh Gaitskell"
 CWelect.5.d:0 "The election of 1959 is here. Harold MacMillan, Anthony Eden's successor in the Conservatives, now is challenged by Hugh Gaitskell of the Labour Party."
 CWelect.5.a:0 "Harold MacMillan will do. We don't want Socialism do we?"
 CWelect.5.b:0 "Labour needs another chance, the Conservatives are indecisive."
 CWelect.6.t:0 "The Resignation of Harold MacMillan"
 CWelect.6.d:0 "Harold MacMillan has been under pressure by the Conservatives and most of the government to resign rather than face the next election. Under such pressure Harold has resigned the office of Prime Minister."
 CWelect.6.a:0 "The Conservative Baton passes to Alec Douglas-Home."
 CWelect.7.t:0 "Hugh Gaistkell dies!"
 CWelect.7.d:0 "Hugh Gaistkell has met his untimely demise. He died in his home of a virus he contracted somewhere on his most recent trip to Nikita Khrushchev."
 CWelect.7.a:0 "The baton passes to Harold Wilson."
 CWelect.8.t:0 "The Election of 1964 - Harold Wilson v. Alec Douglas-Home"
 CWelect.8.d:0 "With all three major parties changing leadership through two resignations and one unfortunate death, there are three new faces for the British people; Harold Wilson of Labour, Alec Douglass-Home of the Tories and Jo Grimond of the Liberals. Grimond is still on the sidelines, but he may divide the centrist vote towards one of the other parties..."
 CWelect.8.a:0 "Time for Labour! Harold Wilson"
 CWelect.8.b:0 "The Tories will protect us! Alec Douglas-Home!"
 Alec_Douglas-Home:0 "Coming as an MP from the House of Lords as the Baron of the Hirsel, Alec took over after the resignation of Harold MacMillan. He has been in the past an aide to Prime Minister Chamberlain. Alec looks to be much more autocratic than his competition, and that may be his downfall..."
 Harold_Wilson:0 "Harold Wilson has long served in cabinets. As soon as he became an elected MP, he was put on Mr. Attlee's cabinet and shadow council, and now he has been elected Labour's leader. Ever since the death of Hugh Gaitskell, he has tried to rebrand Labour into moderate socialism."
 elect.9.t:0 "Election of 1966 - Harold Wilson v. Edward Heath"
 elect.9.d:0 "The Right Honorable has called a snap election, and as the ballots count all Britons wonder if a new prime minister is here? Old Sir Alec Douglas-Home abandoned his post in favor of Edward Heath. Meanwhile Mr. Wilson campaigns for Labour and Jo Grimond once again splits the vote. Who will win?"
 elect.9.a:0 "Moderate Socialism is the best kind! Harold Wilson!"
 elect.9.b:0 "But is no Socialism better? Edward Heath!"
 Edward_Heath:0 "Edward 'Ted' Heath is a strong supporter of the European Economic Areas and coal communities, and closer ties to Europe, slightly strange for a Conservative, but he's still quite the politician."
 elect.10.t:0 "Election of 1970 - Harold Wilson v. Edward Heath"
 elect.10.d:0 "The candidates for both major parties have not changed, however this time it isn't a snap and will surely express the British people. We lie at a crossroads once again, Heath or Wilson?"
 elect.10.a:0 "Harold wins again. Labour!"
 elect.10.b:0 "An unsuspected victory for Mr. Heath! The Tories!"
 elect.11.t:0 "Election of 1974 - Hung Parliament Chaos"
 elect.11.d:0 "There already have been elections have been held this year, but they led to a minority victory for Harold Wilson. To figure out what Britain really wants, the parties agreed on a new election come October. Now the time has come: Wilson or Heath?"
 elect.11.a:0 "Harold Wilson forms government. Labour."
 elect.11.b:0 "Edward Heath forms government. Tories."
 elect.12.t:0 "Harold Wilson Resigns"
 elect.12.d:0 "Harold Wilson has decided today that he will retire. After such a long run in politics, The British public don't know who could fill his shoes. Further left-wing parts of Labour are crying for reforms."
 elect.12.a:0 "James Callaghan will replace Wilson."
 James_Callaghan:0 "James Callaghan, also known as Jim Callaghan, has now served all four great offices in the nation from the Exchequer to Prime Minister."
 elect.13.t:0 "The Rise of Thatcher"
 elect.13.d:0 "The Tories have found Mr. Heath unable to guide the party or the nation. The Tories have chosen to replace Mr. Heath with Margret Thatcher, the MP from Finchley."
 elect.13.a:0 "Margaret Thatcher will guide our nation and peoples."
 Margret_Thatcher:0 "The Iron Lady, Margaret Thatcher, is the first female Prime Minister of Britain. She has wrestled leadership of the Tories away from Mr. Heath and now leads Great Britain."
 elect.14.t:0 "Election of 1979 - Thatcher v. Callaghan"
 elect.14.d:0 "Margaret Thatcher became leader of Conservatives early 1975 over Heaths inability to truly lead and bring voters to his side. Since she came to power with little political capital, Thatcher has been using every method possible to derail Labour and it seems to have worked. A snap election has been scheduled five months before the proper elections and Ms. Thatcher may win."
 elect.14.a:0 "Margaret Thatcher is strong and under her Britain shall be strong."
 elect.14.b:0 "Parliament is a men's club. Callaghan."
 elect.15.t:0 "Election of 1983 - Thatcher v. Foot"
 elect.15.d:0 "The election of 1983 looks to be, a blowout victory for the Tories, ever since the Falklands war, Thatcher's popularity is higher than ever and, even worse for Labour, the Liberals are gaining on their behind."
 elect.15.a:0 "Thatcher held the Falklands, and now she holds Britain"
 elect.15.b:0 "Michael Foot forms a coalition government with the Liberals."
 Micheal_Foot:0 "Michael Foot, now Prime Minister, has been in the Labour sphere for a while. however it seems he may not last long with Thatcher constantly creating chaos in parliament."
 elect.16.t:0 "Election of 1987 - Thatcher v. Kinnock"
 elect.16.d:0 "Michael Foot has decided to not run and in his place Labour has put forward Neil Kinnock while Thatcher's popularity continues to rise. It seems she may win again, but only the citizenry can tell."
 elect.16.a:0 "The Iron Lady Wins Again!"
 elect.16.b:0 "Kinnock wins a minority."
 elect.17.t:0 "Margaret Thatcher resigns!"
 elect.17.d:0 "Thatcher has resigned for the good of the Conservatives as she believes her resignation would weaken the upcoming Labour campaign. At least, that is the announcement she made to the party. John Major now leads Britain."
 elect.17.a:0 "Yes, John Major shall reform a government."
 Neil_Kinnock:0 "Neil Kinnock first served in parliament back in 1970. Now he leads Labour and the Great Britain. Mr. Kinnock has gone far from first taking lead of Labour in 1983 despite attempts to push him to the sidelines."
 John_Major:0 "John Major has served as the Foreign Secretary and Chancellor of the Exchequer in Thatcher's government, eventually taking Ms. Thatcher's place as leader of the country and party."
 elect.18.t:0 "Election of 1992 - Major v. Kinnock"
 elect.18.d:0 "The Conservatives outlook for this campaign was bleak. Labour led by twenty points, until the Labour campaign unexpectedly started to fall. The people will have to make up their mind..."
 elect.18.a:0 "John Major and the Tories win!"
 elect.18.b:0 "Neil Kinnock with Labour!"
 elect.19.t:0 "Neil Kinnock Resigns - The Rise of Blair"
 elect.19.d:0 "Neil Kinnock has decided to retire from Parliament and politics today. The mantle of Labour passes to Tony Blair of Sedgefield."
 elect.19.a:0 "Who is this Blair?"
 Tony_Blair:0 "Anthony Charles Lynton Blair, or Tony Blair, a centrist, has slowly moved Labour further right. He has done remarkable in his elections creating a large Labour majority and is now a permanent fixture in contemporary British politics."
 elect.20.t:0 "Election of 1997 - Blair v. Major"
 elect.20.d:0 "This election is very interesting: Blair ran on 'New Labour' a centrist movement within his party and gained much support for it, while the Conservatives falling apart over EU policy and countless scandals. 1997 seems to be a blowout victory for Labour, but maybe, just maybe the Conservatives could win a minority coalition with the Liberal Democrats."
 elect.20.a:0 "John Major wins a minority."
 elect.20.b:0 "Tony Blair wins a landslide!"
 
 
 attlee_speech_category:0 "Prime Minister Attlee's Public Speeches"
 attlee_speech_category_desc:0 "PM Attlee witnessed the rapid decline of the British Empire soon after the end of World War II. He strongly focuses on the wellness of the citizens and is strongly against wars. The country has started to rebuild itself under his government."
 attlee_anti_war:0 "Host Anti-War Speech to the Public"
 attlee_anti_war_desc:0 "Five years of war inflicted great damage on our country. Valuable lives were lost. Much wealth was destroyed. Our trade was disrupted. Clearly there will be hardships and shortages of many things to be endured. To achieve recovery we require a great effort on the part of all the men and women of Britain during the last four and a half years a very fine effort has been made production in industry and agriculture has been greatly increased and the opportunity of working has been afforded to all and the vast majority has worked well the inevitable hardships and shortages have been as far as possible shared by all but so of the advantages the great social security scheme has been applied to all the result of Labor's policy is seen in the health of the people especially of the children and the babies never have they been so fine yes Mr. Churchill calls this the sharing misery and the question to be decided at this election is whether Labor's policy of fair shares for all is to continue or whether as under previous Conservative government's the benefits are to go to one section of the people and the misery to another I ask you to help us to continue the work of a recovery so well begun."
 attlee_korean_war:0 "Address the Korean War"
 attlee_korean_war_desc:0 "We are faced with a direct challenge to the authority of the United Nations, an act of aggression ahs been committed. Now you can make all kinds of special meetings, you can say the South Korean government or the American one, I agree. Because the person isn't a very good character, it doesn't excuse the person tries to murder him. You can say that China, the new China is not on the Security Council. It doesn't affect or alter the fact of aggression. And if the United Nations organization was not all the way the old League of Nations, it was absolutely necessary a halt should be called. And more than fifty other nations are backing them up in this effort to preserve world peace. This means risks and danger, any other cause were meant risks and danger. I'm quite sure that if we won, the authority in the world that is greater than the world of aggressor. We have got to say here and now, the aggression will not succeed."
 churchill_speech_category:0 "Prime Minister Churchill's Speeches"
 churchill_speech_category_desc:0 "Prime Minister Churchill is our war hero, he led the country through the hardest five years. Although the second world war cost millions of British lives, our great prime minister refused to make a compromise with the Nazis, and fought until final victory, his contributions to the country and the world peace will be forever remembered."
 churchill_king_death:0 "Speech at King George VI's Death"
 churchill_king_death_desc:0 "During these last months the King walked with death as if death were a companion, an acquaintance whom he recognized and did not fear. In the end death came as a friend, and after a happy day of sunshine and sport, and after \"good night\" to those who loved him best, he fell asleep as every man or woman who strives to fear God and nothing else in the world may hope to do. I, whose youth was passed in the august, unchallenged and tranquil glories of the Victorian era, may well feel a thrill in invoking once more the prayer and the anthem, \"God save the Queen!"
 

 #Battleship/Battlecruiser Hulls in research tree#

 ENG_battle_hull_medium_0:0 "Vanguard Class"
 ENG_battle_hull_medium_1:0 "Vanguard Class Refit"
 ENG_battle_hull_medium_0_desc:0 "HMS Vanguard was a British fast battleship built during the Second World War and commissioned after the war ended. She was the biggest and fastest of the Royal Navy's battleships, the only ship of her class, and the last battleship to be built."
 ENG_battle_hull_medium_1_desc:0 "A sort of what if HMS Vanguard had recieved the same scale and amount of refitting as the US Navy Iowa class ships recieved. HMS Vanguard did recieve a brief refit in in 1955 before being sold for scarp and being broken up in 1960. But what if that had not been the case?"
 #Carrier Hulls in research tree#

 ENG_carrier_hull_0:0 "Implacable Class"
 ENG_carrier_hull_1:0 "Audacious Class"
 ENG_carrier_hull_2:0 "CVA-01 design"
 ENG_carrier_hull_3:0 "Audacious Class Refit"
 ENG_carrier_hull_4:0 "Queen Elizabeth Class"
 ENG_carrier_hull_0_desc:0 "The Implacable-class aircraft carrier consisted of two aircraft carriers built for the Royal Navy during World War II. Derived from the design of the Illustrious class, they were faster and carried more aircraft than the older ships. They were initially assigned to the Home Fleet when completed in 1944 and attacked targets in Norway as well as the German battleship Tirpitz. Subsequently, they were assigned to the British Pacific Fleet (BPF)."
 ENG_carrier_hull_1_desc:0 "The Audacious-class aircraft carriers were a class of aircraft carriers proposed by the British government in the 1930s - 1940s and completed after the Second World War. The two ships built were heavily modified and diverged over their service lives."
 ENG_carrier_hull_2_desc:0 "CVA-01 was a proposed United Kingdom aircraft carrier, designed during the 1960s. The ship was intended to be the first of a class that would replace all then-existing Royal Navy carriers, most of which had been designed before or during the Second World War."
 ENG_carrier_hull_3_desc:0 "As the builds of Audacious (renamed Eagle) and Irresistible (renamed Ark Royal) progressed they differed so much that they effectively became the lead (and sole) ships of each of their own classes. They formed the backbone of the postwar carrier fleet, and were much modified."
 ENG_carrier_hull_4_desc:0 "The Queen Elizabeth class is a class of two aircraft carriers of the United Kingdom's Royal Navy which are the central components of the UK Carrier Strike Group."

 ENG_carrier_hull_light_0:0 "Colossus Class"
 ENG_carrier_hull_light_1:0 "Centaur Class"
 ENG_carrier_hull_light_2:0 "Invincible Class"
 ENG_carrier_hull_light_3:0 "Ocean Class"
 ENG_carrier_hull_light_4:0 "Invincible Class Refit"
 ENG_carrier_hull_light_0_desc:0 "The 1942 Design Light Fleet Carrier, commonly referred to as the British Light Fleet Carrier, was a light aircraft carrier design created by the Royal Navy during the Second World War, and used by eight naval forces between 1944 and 2001. They were designed and constructed by civilian shipyards to serve as an intermediate step between the expensive, full-size fleet aircraft carriers and the less expensive but limited-capability escort carriers."
 ENG_carrier_hull_light_1_desc:0 "The Centaur class of aircraft carriers of the Royal Navy was the last of the light fleet carrier designs started during the closing years of World War II. The first ship of the original four in the class was commissioned in 1953 and the final decommissioned in 1984. The first three ships lacked an angled flight deck and were therefore unsuitable for fast jet aircraft, and production of a second batch of four carriers was cancelled."
 ENG_carrier_hull_light_2_desc:0 "The Invincible class was a class of light aircraft carrier operated by the Royal Navy. The vessels were built as aviation-capable anti-submarine warfare (ASW) platforms to counter the Cold War North Atlantic Soviet submarine threat, and initially embarked Sea Harrier aircraft and Sea King HAS.1 anti-submarine helicopters."
 ENG_carrier_hull_light_3_desc:0 "HMS Ocean was a Landing Platform Helicopter, formerly the UK's helicopter carrier and the fleet flagship of the Royal Navy. She was designed to support amphibious landing operations and to support the staff of Commander UK Amphibious Force and Commander UK Landing Force."
 ENG_carrier_hull_light_4_desc:0 "In mid-2000s, the Invincible Class ships underwent a further refit at Rosyth Dockyard. This refit involved the total rebuild of the ski jump, the adding of better communications and reconfiguring the ship so that it can be more quickly switched between the light aircraft carrier and helicopter carrier roles."

 #ENG_carrier_hull_super_1:0 "Kitty Hawk Class"
 #ENG_carrier_hull_super_2:0 "Nimitz Class"
 #ENG_carrier_hull_super_3:0 "Theodore Roosevelt Class"
 #ENG_carrier_hull_super_4:0 "Ronald Reagan Class"
 #ENG_carrier_hull_super_1_desc:0 "The introduction of the nuclear age and the adoption of smaller navalize reactors allows these large vessels not only to carry large air wings but also lets them stay at sea almost indefinitly."
 #ENG_carrier_hull_super_2_desc:0 "An updated super carrier design with more efficient reactors and the capability to carry even more aircraft."
 #ENG_carrier_hull_super_3_desc:0 "An advanced late Cold War era super carrier design with a massive complement of aircraft and improved reactors."
 #ENG_carrier_hull_super_4_desc:0 "A modern super carrier design with further improved reactors, a massice complement of aircraft and the capability to launch them quickly and effectively by utilizing improved catapults."

 # Submarine Hulls #
 ENG_sub_hull_small_single_0:0 "Amphion Class"
 ENG_sub_hull_small_single_0_desc:0 "The Amphion class (also known as the "A" class and Acheron class) of British diesel-electric submarines were designed for use in the Pacific War. Only two were completed before the end of hostilities, but following modernisation in the 1950s, they continued to serve in the Royal Navy into the 1970s."
 ENG_sub_hull_small_single_1:0 "Porpoise Class"
 ENG_sub_hull_small_single_1_desc:0 "The Porpoise class was an eight-boat class of diesel-electric submarines operated by the Royal Navy. This class was originally designated patrol submarines, then attack. They were the first conventional British submarines to be built after the end of World War II. Their design was, in many ways, influenced by the German World War II-era Type XXI U-boats."
 ENG_sub_hull_small_single_2:0 "Oberon Class"
 ENG_sub_hull_small_single_2_desc:0 "The Oberon class was a ship class of 27 British-designed submarines operated by five different nations. They were designed as a direct follow-on from the Porpoise class, physical dimensions were the same, but stronger materials were used in hull construction, and updated equipment was fitted."
 ENG_sub_hull_small_single_3:0 "Upholder Class"
 ENG_sub_hull_small_single_3_desc:0 "The Upholder/Victoria-class submarines, also known as the Type 2400 (due to their displacement of 2,400 tonnes), are the class of the diesel-electric submarines that were built in the United Kingdom in the 1980s to supplement the nuclear submarines served in the Submarine Service of the British Royal Navy."
 ENG_sub_hull_small_single_4:0 "Victoria Class"
 ENG_sub_hull_small_single_4_desc:0 "The Upholder/Victoria-class submarines, also known as the Type 2400 (due to their displacement of 2,400 tonnes), are the class of the diesel-electric submarines that were built in the United Kingdom in the 1980s to supplement the nuclear submarines served in the Submarine Service of the British Royal Navy."

 ENG_sub_hull_large_single_0:0 "Explorer Class"
 ENG_sub_hull_large_single_0_desc:0 "The two Explorer-class submarines were experimental vessels built for the Royal Navy to test a propulsion system based on the use of highly concentrated hydrogen peroxide (high-test peroxide, HTP) and diesel fuel to achieve high underwater endurance and speeds."
 ENG_sub_hull_large_single_1:0 "Valiant class"
 ENG_sub_hull_large_single_1_desc:0 "The Valiant class were a class of nuclear-powered fleet submarines in service with the Royal Navy from the mid-1960s until 1994. They were the first fully British nuclear fleet submarine; the earlier HMS Dreadnought used an American nuclear reactor."
 ENG_sub_hull_large_single_2:0 "Churchill Class"
 ENG_sub_hull_large_single_2_desc:0 "The three Repeat Valiant-class submarines, sometimes known as the Churchill class, were nuclear-powered fleet submarines which served with the Royal Navy from the 1970s until the early 1990s. The Churchill class was based on the older Valiant class, but featured many internal improvements."
 ENG_sub_hull_large_single_3:0 "Trafalgar Class"
 ENG_sub_hull_large_single_3_desc:0 "The Trafalgar class is a class of nuclear-powered fleet submarines (SSNs) in service with the Royal Navy, and the successor to the Swiftsure class. Like the majority of Royal Navy nuclear submarines, all seven boats were constructed at Barrow-in-Furness shipyard, Cumbria."
 ENG_sub_hull_large_single_4:0 "Astute Class"
 ENG_sub_hull_large_single_4_desc:0 "The Astute class is the latest class of nuclear-powered fleet submarines (SSNs) in service with the Royal Navy."

 ENG_sub_hull_large_double_0:0 "Dreadnought Class"
 ENG_sub_hull_large_double_0_desc:0 "The seventh HMS Dreadnought was the United Kingdom's first nuclear-powered submarine, built by Vickers Armstrongs at Barrow-in-Furness. Launched by Queen Elizabeth II on Trafalgar Day 1960 and commissioned into service with the Royal Navy in April 1963, she continued in service until 1980."
 ENG_sub_hull_large_double_1:0 "Resolution Class"
 ENG_sub_hull_large_double_1_desc:0 "The Resolution class was a class of four nuclear ballistic missile submarines (SSBN) built for the Royal Navy as part of the UK Polaris programme. Each submarine was armed with up to 16 UGM-27 Polaris A-3 nuclear missiles. "
 ENG_sub_hull_large_double_2:0 "Resolution Class Refit"
 ENG_sub_hull_large_double_2_desc:0 "The Resolution class was a class of four nuclear ballistic missile submarines (SSBN) built for the Royal Navy as part of the UK Polaris programme. Each submarine was armed with up to 16 UGM-27 Polaris A-3 nuclear missiles."
 ENG_sub_hull_large_double_3:0 "Vanguard Class"
 ENG_sub_hull_large_double_3_desc:0 "The Vanguard class is a class of nuclear-powered ballistic missile submarines (SSBNs) in service with the Royal Navy. The class was introduced in 1994 as part of the Trident nuclear programme."

 # Screen Hulls #

 ENG_screen_hull_medium_0:0 "Bay Class"
 ENG_screen_hull_medium_0_desc:0 "The Bay class was a class of 26 anti-aircraft (A/A) frigates built for the Royal Navy under the 1943 War Emergency Programme during World War II (one of which was cancelled and six completed as despatch vessels or survey ships). They were based on the hulls of incomplete Loch class anti-submarine (A/S) frigates."
 ENG_screen_hull_medium_1:0 "Whitby Class"
 ENG_screen_hull_medium_1_short:0 "Type 12"
 ENG_screen_hull_medium_1_desc:0 "The Type 12 or Whitby-class frigates were a six-ship class of anti-submarine frigates of the Royal Navy, which entered service late in the 1950s. They were designed in the early 1950s as first-rate ocean-going convoy escorts, in the light of experience gained during World War II. At this time, the Royal Navy were designing single-role escorts and the Whitbys were designed as fast convoy escorts capable of tackling high-speed submarines. "
 ENG_screen_hull_medium_2:0 "Amazon Class"
 ENG_screen_hull_medium_2_short:0 "Type 21"
 ENG_screen_hull_medium_2_desc:0 "In the mid-1960s, the Royal Navy (RN) had a requirement for a replacement for the diesel-powered Leopard-class (Type 41) and Salisbury-class (Type 61) frigates. While the Royal Navy's warships were traditionally designed by the Ministry of Defence's Ship Department based at Bath, private shipyards (in particular Vosper Thorneycroft) campaigned for the right to design and build a ship to meet this requirement. Vospers claimed that, by ignoring what they claimed to be the conservative design practices followed by the MoD team at Bath, they could deliver the new frigate at a significantly lower price."
 ENG_screen_hull_medium_3:0 "Broadsword Class"
 ENG_screen_hull_medium_3_short:0 "Type 22"
 ENG_screen_hull_medium_3_desc:0 "The Type 22 frigate also known as the Broadsword class was a class of frigates built for the British Royal Navy. Fourteen were built in total, with production divided into three batches. Initially intended to be anti-submarine warfare frigates as part of NATO contribution, the ships became general purpose warships. "
 ENG_screen_hull_medium_4:0 "Duke Class"
 ENG_screen_hull_medium_4_short:0 "Type 23"
 ENG_screen_hull_medium_4_desc:0 "The Type 23 frigate or Duke class is a class of frigates built for the United Kingdom's Royal Navy. The ships are named after British Dukes, thus leading to the class being commonly known as the Duke class."

 ENG_screen_hull_heavy_0:0 "Daring Class"
 ENG_screen_hull_heavy_0_desc:0 "The Daring-class ships were both the largest and most heavily armed ships serving in Commonwealth navies to be classified as destroyers. They were intended to fill some of the duties of cruisers, which post WW2 were considered both expensive and obsolete by naval planners, and were briefly officially considered a hybrid type (Darings) before being rated as destroyers. They were also the last destroyers of the RN and RAN to possess guns as their main armament (instead of guided missiles), which saw use during the Indonesian Confrontation and the Vietnam War."
 ENG_screen_hull_heavy_1:0 "County Class"
 ENG_screen_hull_heavy_1_desc:0 "The County class was a class of British guided missile destroyers, the first such warships built by the Royal Navy. Designed specifically around the Seaslug anti-aircraft missile system, the primary role of these ships was area air defence around the aircraft carrier task force in the nuclear-war environment."
 ENG_screen_hull_heavy_2:0 "County Class Batch II"
 ENG_screen_hull_heavy_2_desc:0 "The County class was a class of British guided missile destroyers, the first such warships built by the Royal Navy. Designed specifically around the Seaslug anti-aircraft missile system, the primary role of these ships was area air defence around the aircraft carrier task force in the nuclear-war environment."
 ENG_screen_hull_heavy_3:0 "Sheffield Class"
 ENG_screen_hull_heavy_3_short:0 "Type 42"
 ENG_screen_hull_heavy_3_desc:0 "The Type 42 or Sheffield class, was a class of fourteen guided missile destroyers that served in the Royal Navy. A further two ships of this class were built for and served with the Argentine Navy. "
 ENG_screen_hull_heavy_4:0 "Daring Class"
 ENG_screen_hull_heavy_4_short:0 "Type 45"
 ENG_screen_hull_heavy_4_desc:0 "The Type 45 destroyer, also known as the D or Daring class, is a class of six guided missile destroyers built for the United Kingdom's Royal Navy in the early 21st century. The class is primarily designed for anti-aircraft and anti-missile warfare and is built around the PAAMS (Sea Viper) air-defence system utilising the SAMPSON AESA and the S1850M long-range radars."

 ENG_battle_hull_light_0:0 "Minotaur Class"
 ENG_battle_hull_light_0_desc:0 "The Minotaur class, or Design Z, was a proposed class of light cruisers planned for the British Royal Navy shortly after the Second World War. Design Z had several proposed configurations with differing armament and propulsion arrangements."
 ENG_battle_hull_light_1:0 "Tiger Class"
 ENG_battle_hull_light_1_desc:0 "The Tiger class were a class of three British warships of the 20th century and the last all-gun cruisers of the Royal Navy. Construction as Minotaur-class cruisers began during World War II but due to post-war austerity, the Korean War and Churchill favouring nuclear weapons and aircraft over the surface fleet, the hulls remained unfinished."
 ENG_battle_hull_light_2:0 "Tiger Class Refit"
 ENG_battle_hull_light_2_desc:0 "By 1964 the Conservative Government and half the naval staff saw the Tigers as no longer affordable or credible in the surface combat or fleet air defence role and would have preferred to decommission them but given they were technically only three years old and built at immense expense, scrapping them was politically difficult. They approved conversion into helicopter carriers; carrying Westland Wessex helicopters for Royal Marine Commando operations. A large hangar replaced the 'Y' turret, the forward turrets were retained for gunfire support and anti-surface work."
 ENG_battle_hull_light_3:0 "Bristol Class"
 ENG_battle_hull_light_3_short:0 "Type 82"
 ENG_battle_hull_light_3_desc:0 "The Type 82 or Bristol-class destroyer was to have been a class of eight Royal Navy guided missile destroyers mounting the Sea Dart missile, intended to replace the Seaslug-armed County-class destroyers. They would provide area air-defence over carrier task forces and could serve independently in the modern cruiser role East of Suez. With long range air, surface and anti-submarine missile capability and would also serve in a group of four Type 82s and four "Broad Beam" Leander-class frigates as outer and inner escorts to the planned CVA-01 aircraft carriers. "
