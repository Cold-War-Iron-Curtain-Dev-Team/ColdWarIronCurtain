l_english:
 VIN_Push_for_Negotiations_Regroupment_tt:0 "The §Ysouthern Viet Minh§! are ordered to stand down. After §Y90 days§! they sign a ceasefire with the State of Vietnam and §Yregroup to the north§!: the south passes to the State of Vietnam, and the cadres join our army. The Geneva conference opens once both Vietnams are at peace."
 VIN_South_Regroupment_tt:0 "We gain §G20,000§! manpower and §G2§! regroupment regiments if the southern units were still in the field."
 VIN_South.10.t:0 "The Southern Cadres Regroup"
 VIN_South.10.d:0 "The ninety days of the stand-down order have run out. The southern command has signed its ceasefire with the State of Vietnam, handed over the zones it held, and marched its regiments north to the regroupment areas. Nam Bo is no longer a front. Whatever the south becomes will now be decided at the conference table."
 VIN_South.10.a:0 "They come home to fight another day."
 VIN_South.11.t:0 "The Viet Minh Leave the South"
 VIN_South.11.d:0 "On orders from Hanoi, the southern Viet Minh have accepted a ceasefire and are withdrawing their regular units north. Their former zones are being handed to our administration. How many cadres stayed behind, and what they will do, is a question for later."
 VIN_South.11.a:0 "Take over the zones."
 VIN_Post_DBP_NLF_Regrouped:0 "The southern Viet Minh have regrouped to the north"
