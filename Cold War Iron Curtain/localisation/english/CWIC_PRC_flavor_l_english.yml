l_english:
 flavorprc.1.t:0 "[GetNewspaperHeader]The Gang of Four Arrested"
 flavorprc.1.d:0 "Jiang Qing and the other three of the Gang of Four have been arrested in Beijing. The fight over who follows Mao has become a matter for the police."
 flavorprc.1.a:0 "The four are in custody."
 flavorprc.1.b:0 "Beijing has made arrests."
 flavorprc.2.t:0 "[GetNewspaperHeader]The Third Plenum"
 flavorprc.2.d:0 "The third plenum of the central committee has closed. Class struggle is off the agenda. The work now is to modernize the economy."
 flavorprc.2.a:0 "The plenum has turned."
 flavorprc.2.b:0 "China is changing course."
 flavorprc.3.t:0 "[GetNewspaperHeader]The Square Is Cleared"
 flavorprc.3.d:0 "The army has cleared Tiananmen Square. The protests that filled Beijing this spring are over."
 flavorprc.3.a:0 "The square is clear."
 flavorprc.3.b:0 "Beijing has moved."
 flavorprc.4.t:0 "[GetNewspaperHeader]Deng Xiaoping Dies"
 flavorprc.4.d:0 "Deng Xiaoping has died in Beijing at ninety-two. He left his last post years ago. The reforms still carry his name."
 flavorprc.4.a:0 "Deng is dead."
 flavorprc.4.b:0 "Deng Xiaoping has died."
