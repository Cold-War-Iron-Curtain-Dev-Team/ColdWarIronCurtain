l_english:
 # Constants:
 MAPMODE_CONSTANT: "Map Mode"

 # Map Modes:
 fallout_core_map_mode: "Core States"
 MAPMODE_FALLOUT_CORE_MAP_MODE: "§Y$fallout_core_map_mode$§! $MAPMODE_CONSTANT$"
 MAPMODE_FALLOUT_CORE_MAP_MODE_NAME: "$fallout_core_map_mode$"
 MAPMODE_FALLOUT_CORE_MAP_MODE_DESCRIPTION: "Shows our core states, non-core states and occupied states in different colours."
