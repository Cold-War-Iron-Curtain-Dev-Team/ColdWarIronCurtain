 MAPMODE_HDI_MAP_MODE_NAME:0 "State HDI"
 MAPMODE_HDI_MAP_MODE:0 "State HDI"
 MAPMODE_HDI_MAP_MODE_DESCRIPTION:0 "Shows the Human Development Index of each state, reflecting local living standards, education, and economic conditions."

 hdi_map_mode_tooltip:0 "State HDI: §Y[?From.State_HDI]§!"
 hdi_map_mode_tooltip_delayed:0 "The §YHuman Development Index§! (HDI) represents the overall quality of life within a state.\n\nIt reflects §Geducation§!, §Yincome§!, and §Chealth§! outcomes, as well as access to infrastructure and long-term development.\n\n§CHigh HDI§! states are more §Gproductive§!, §Gstable§!, and resilient, while §Rlow HDI§! states suffer from structural weaknesses and social strain."
 
 MAPMODE_NATIONAL_HDI_MAP_MODE_NAME:0 "National HDI"
 MAPMODE_NATIONAL_HDI_MAP_MODE:0 "National HDI"
 MAPMODE_NATIONAL_HDI_MAP_MODE_DESCRIPTION:0 "Shows the overall Human Development Index of each country."

 national_hdi_map_mode_tooltip:0 "National HDI: §Y[?From.Owner:National_HDI]§!"
 national_hdi_map_mode_tooltip_delayed:0 "The §Ynational Human Development Index§! (HDI) measures the average level of development across an entire country.\n\nIt summarizes §Geconomic performance§!, §Ceducational capacity§!, and §Ysocial investment§! at a strategic level.\n\nCountries with §Cvery high HDI§! tend to possess stronger institutions, higher social cohesion, and greater long-term stability."

