 fallout_war_support_map_mode: "$WAR_SUPPORT$"
 MAPMODE_FALLOUT_WAR_SUPPORT_MAP_MODE: "§Y$fallout_war_support_map_mode$§! $MAPMODE_CONSTANT$"
 MAPMODE_FALLOUT_WAR_SUPPORT_MAP_MODE_NAME: "$fallout_war_support_map_mode$"
