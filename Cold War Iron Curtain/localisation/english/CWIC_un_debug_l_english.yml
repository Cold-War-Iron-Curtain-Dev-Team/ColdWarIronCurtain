l_english:
 cwic_debug_china_seat_to_prc:0 "UN TEST: give the China seat to the PRC"
 cwic_debug_china_seat_to_prc_desc:0 "Moves UN_Security_Council_Member_Perm from the Republic of China to the People's Republic, as Resolution 2758 did in 1971. Only offered when the PRC actually exists - otherwise the seat would go to nobody."
 cwic_debug_china_seat_to_roc:0 "UN TEST: give the China seat to the ROC"
 cwic_debug_china_seat_to_roc_desc:0 "Puts the seat back with the Republic of China."
 cwic_debug_repair_permanent_seats:0 "UN TEST: repair the permanent seats"
 cwic_debug_repair_permanent_seats_desc:0 "Gives the permanent seat back to any of the five that has lost it, and hands the China seat to whichever China exists. For a save where a seat has gone missing."
 cwic_debug_reelect_council:0 "UN TEST: hold the council elections now"
 cwic_debug_reelect_council_desc:0 "Runs this year's historical election again without waiting for the yearly check."
