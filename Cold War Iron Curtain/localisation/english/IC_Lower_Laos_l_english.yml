l_english:
 VIN_Lower_Laos_Offensive:0 "Strike into Lower Laos"
 VIN_Lower_Laos_Offensive_desc:0 "A division moved down the Annamite spine can appear on the Bolovens Plateau and at Attapeu, and from there point toward Stung Treng. The Royal Lao Government and Cambodia are not our enemies in this; the aim is to make the French Union command decide where its reserves are needed, while Operation Atlante is still in the balance."
 VIN_Lower_Laos_Offensive_tt:0 "The Viet Minh open a §Y45-day diversion§! toward Attapeu, the Bolovens and northeast Cambodia, spending §R20 Campaign Supply§!. No war is declared on the Royal Lao Government or Cambodia and no territory changes hands.\nIf Operation Atlante is underway, its hold requirement grows by §Y4 days§! and the CEFEO suffers a temporary organization and supply penalty.\nIf the CEFEO keeps no division in Attapeu or the Bolovens throughout, the diversion succeeds: §G+15 Communist Struggle score§!. Otherwise it is contained and the Viet Minh recover §G10 Campaign Supply§!."
 FRE_Lower_Laos_Reserves_Diverted:0 "Reserves Drawn to Lower Laos"
 FRE_Lower_Laos_Reserves_Diverted_desc:0 "Viet Minh columns on the Bolovens and the Cambodian border have forced the expeditionary command to peel battalions away from its planned central Vietnam operation. Staff work is slower, units arrive thin and the supply lines stretch further."
 VIN_Lower_Laos_Offensive_Launched:0 "§YThe Lower Laos diversion has been launched§!"
 VIN_Lower_Laos_Diversion_Active:0 "§YThe Lower Laos diversion is underway§!"
 VIN_Lower_Laos_Atlante_Hold_Applied:0 "§YThe diversion has lengthened Operation Atlante§!"
 VIN_Lower_Laos_FRE_Garrison_Seen:0 "§YThe CEFEO has sent troops to Attapeu or the Bolovens§!"
 VIN_Lower_Laos_Result_Pressure:0 "§GThe Lower Laos diversion pinned down the French reserve§!"
 VIN_Lower_Laos_Result_Contained:0 "§RThe CEFEO contained the Lower Laos diversion§!"
 VIN_Lower_Laos_Result_Superseded:0 "The Lower Laos diversion was §goverrun by the wider settlement§!"
 VIN_Lower_Laos_Focus_Superseded:0 "The Lower Laos diversion was never launched"
 FRE_Lower_Laos.1.t:0 "The Viet Minh in Lower Laos"
 FRE_Lower_Laos.1.d:0 "Viet Minh columns have crossed the Annamite chain into Attapeu and are moving on the Bolovens plateau. The Royal Lao Government asks for help, and Cambodia watches the road to Stung Treng. A mobile group flown to the plateau would hold the line, but every battalion sent west is one fewer for our other operations."
 FRE_Lower_Laos.1.a:0 "Fly a mobile group to the Bolovens."
 FRE_Lower_Laos.1.b:0 "The Royal Lao Army must hold on its own."
 FRE_Lower_Laos_Reinforce_tt:0 "Costs §R40§! War Credits. An airborne group lands on the Bolovens plateau and stays until the Viet Minh diversion ends, which will §Gcontain§! it. If Operation Atlante is under way, its hold requirement rises by §R3§! days."
 FRE_Lower_Laos_Ignore_tt:0 "No reserves are diverted. Unless CEFEO troops reach Attapeu or Champasak, the Viet Minh gain §RCommunist Struggle§! when the diversion ends."
