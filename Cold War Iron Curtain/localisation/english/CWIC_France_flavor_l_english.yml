l_english:
 flavorfra.1.t:0 "[GetNewspaperHeader]May in Paris"
 flavorfra.1.d:0 "Students and striking workers have filled Paris. Much of the city has stopped, and the government is struggling to restore order."
 flavorfra.1.a:0 "Paris has stopped."
 flavorfra.1.b:0 "Paris is in the streets."
 flavorfra.2.t:0 "[GetNewspaperHeader]The TGV Opens"
 flavorfra.2.d:0 "The TGV has opened between Paris and Lyon. The journey takes about two hours."
 flavorfra.2.a:0 "The train is running."
 flavorfra.2.b:0 "France has a fast train."
 flavorfra.3.t:0 "[GetNewspaperHeader]The Rainbow Warrior"
 flavorfra.3.d:0 "The Greenpeace ship Rainbow Warrior has been sunk in Auckland harbour. France has been tied to the bombing, and a photographer on board is dead."
 flavorfra.3.a:0 "The scandal is ours."
 flavorfra.3.b:0 "A ship has been sunk."
 flavorfra.4.t:0 "[GetNewspaperHeader]François Mitterrand Dies"
 flavorfra.4.d:0 "François Mitterrand has died. He was president of France from 1981 to 1995."
 flavorfra.4.a:0 "Mitterrand is dead."
 flavorfra.4.b:0 "The former president is dead."
