l_english:
##### CEFEO (FRE) rework: Metropole Patience, lifeline, battles, wind-down #####

#### National spirits ####
FRE_Expeditionary_Command:0 "Expeditionary Command"
FRE_Expeditionary_Command_desc:0 "The CEFEO is not a state. It is an army with a harbor, a headquarters and a budget line in Paris. It answers to the Rue Saint-Dominique, not to any electorate."
FRE_Metropole_Subsidies_Full:0 "Metropole Subsidies (Full)"
FRE_Metropole_Subsidies_Full_desc:0 "The National Assembly still votes the credits. The piastres flow, the convoys sail, and the war can be fought."
FRE_Metropole_Subsidies_Reduced:0 "Metropole Subsidies (Reduced)"
FRE_Metropole_Subsidies_Reduced_desc:0 "The credits pass committee with amendments now. Every requisition is questioned; every loss is counted twice."
FRE_Metropole_Subsidies_Cut:0 "Metropole Subsidies (Cut)"
FRE_Metropole_Subsidies_Cut_desc:0 "Paris has stopped paying for victory and started paying for an exit. The corps lives off its stockpiles."
FRE_Command_Carpentier:0 "Carpentier's Command"
FRE_Command_Carpentier_desc:0 "General Carpentier administers the war competently and without imagination. The initiative belongs to the enemy."
FRE_Command_De_Lattre:0 "De Lattre's Command"
FRE_Command_De_Lattre_desc:0 "Le Roi Jean has taken the theatre in hand. Evacuation plans are burned, dependents stay in Hanoi, and the corps remembers how to win."
FRE_Command_Salan:0 "Salan's Command"
FRE_Command_Salan_desc:0 "Salan the Mandarin knows Indochina better than any officer in the army, and trusts it less. A careful, cunning, unloved stewardship."
FRE_Command_Navarre:0 "Navarre's Command"
FRE_Command_Navarre_desc:0 "General Navarre arrived with a plan and a deadline. The corps will seek its decisive battle before Paris runs out of patience."

#### Shared tooltips ####
FRE_Patience_Change_tt:0 "§YMetropole Patience§! will change (currently §Y[FRE.?FRE_Metropole_Patience]§!/100)"
FRE_VNA_Coordination_tt:0 "CEFEO missions gain a permanent §G+10%§! success chance from Vietnamese National Army coordination"
FRE_GCMA_Network_Grows_tt:0 "The §YGCMA network§! grows by §G1§! level (each level: §G+3%§! mission success chance)"
FRE_Appeal_To_Paris_Press_tt:0 "A sympathetic press campaign in Paris: §G60%§! chance to gain §G10§! Patience, §R40%§! chance to lose §R8§! Patience and embarrass the government"
FRE_Legion_Reinforcements_tt:0 "A fresh §YForeign Legion§! formation lands at Haiphong"
FRE_Dinassaut_Flotilla_tt:0 "The §YDinassaut river flotillas§! are commissioned: riverine operations no longer require a blue-water fleet"
FRE_DBP_Vulture_Approved_tt:0 "American air power will weigh in over §YDien Bien Phu§!"
FRE_De_Lattre_Leads_tt:0 "§YGeneral de Lattre de Tassigny§! takes command of the theatre (mission success §G+10%§!)"
FRE_Salan_Leads_tt:0 "§YGeneral Salan§! assumes command (mission success §G+5%§!)"
FRE_Navarre_Leads_tt:0 "§YGeneral Navarre§! assumes command (mission success §G+8%§!)"

#### Focus tree: The Metropole branch ####
FRE_Lobby_the_National_Assembly:0 "Lobby the National Assembly"
FRE_Lobby_the_National_Assembly_desc:0 "The war is won or lost in the Palais Bourbon as surely as on the RC4. Send our best staff colonels to Paris with maps, photographs and casualty figures arranged in the most persuasive order."
FRE_Streamline_Colonial_Logistics:0 "Streamline Colonial Logistics"
FRE_Streamline_Colonial_Logistics_desc:0 "Between Marseille and Haiphong a rifle passes through eleven depots and loses three weeks. Cut the chain to five and the same convoys will feed twice the war."
FRE_Manage_the_Press_Corps:0 "Manage the Press Corps"
FRE_Manage_the_Press_Corps_desc:0 "The correspondents will write something; see that they write it from a terrace in Hanoi with a briefing officer at their elbow, not from a field hospital."
FRE_The_Expeditionary_Budget:0 "The Expeditionary Budget"
FRE_The_Expeditionary_Budget_desc:0 "Bury the corps' funding in the permanent defense estimates where no single vote can kill it. The Assembly may tire of the war, but it will keep paying the floor."
FRE_Court_the_American_Mission:0 "Court the American Mission"
FRE_Court_the_American_Mission_desc:0 "Washington sees dominoes where Paris sees colonies. If American anxieties can be made to pay for French soldiers, so much the better."
FRE_A_Telegram_to_Paris:0 "A Telegram to Paris"
FRE_A_Telegram_to_Paris_desc:0 "One clear, confident cable: the situation, the requirements, the prospects. Signed by the Commander-in-Chief, read aloud in the Council of Ministers."

#### Focus tree: Brothers in Arms branch ####
FRE_Jaunissement:0 "Jaunissement"
FRE_Jaunissement_desc:0 "The 'yellowing' of the war: Vietnamese soldiers under Vietnamese officers holding Vietnamese ground. It is their country; let it increasingly be their army."
FRE_Arm_the_National_Army:0 "Arm the National Army"
FRE_Arm_the_National_Army_desc:0 "Open the CEFEO depots to Saigon. Every rifle handed to the Vietnamese National Army is a rifle Paris no longer has to man."
FRE_The_GCMA:0 "The GCMA"
FRE_The_GCMA_desc:0 "The Groupement de Commandos Mixtes Aéroportés: French cadres and highland partisans behind Viet Minh lines. A dirty, deniable, remarkably cheap way to make the enemy garrison his own rear."
FRE_Joint_General_Staff:0 "A Joint General Staff"
FRE_Joint_General_Staff_desc:0 "One map room, two flags. Operations planned with the Vietnamese National Army from the start rather than communicated to it afterwards."
FRE_Montagnard_Loyalty:0 "Montagnard Loyalty"
FRE_Montagnard_Loyalty_desc:0 "The peoples of the high country have no love for the lowland communists. Honor the old alliances - salt, silver, rifles and respect."
FRE_Coordinate_with_Saigon:0 "Coordinate with Saigon"
FRE_Coordinate_with_Saigon_desc:0 "The Cochinchinese authorities, the Emperor's government and the corps have fought three separate wars long enough. Sit everyone at the same table."

#### Decision categories ####
FRE_Metropole_Support_category:0 "The Metropole Lifeline"
FRE_Metropole_Support_category_desc:0 "The CEFEO produces nothing: every rifle, every man and every piastre comes from France. Ask - politely, and not too often."
FRE_Indochina_Allies_category:0 "Brothers in Arms"
FRE_Indochina_Allies_category_desc:0 "Coordination with the State of Vietnam, the highland peoples and Saigon."

#### Metropole lifeline decisions ####
FRE_Request_Equipment_Convoy:0 "Request an Equipment Convoy"
FRE_Request_Equipment_Convoy_desc:0 "Cable Paris for a materiel convoy out of Marseille: small arms, ammunition and the thousand dull things an army eats."
FRE_Request_Reinforcements:0 "Request Reinforcements"
FRE_Request_Reinforcements_desc:0 "Ask the Metropole for drafts of men - and, if the Assembly can stomach it, another Legion formation."
FRE_Request_Air_Assets:0 "Request Air Assets"
FRE_Request_Air_Assets_desc:0 "This war runs on transport aircraft the way other wars run on rail. Ask for Dakotas, and more Dakotas."
FRE_Request_Naval_Assets:0 "Request the Dinassaut Flotillas"
FRE_Request_Naval_Assets_desc:0 "Armored barges, LCVPs and gunboats for the rivers of Tonkin and Cochinchina. The delta belongs to whoever owns the water."
FRE_Request_Administrative_Support:0 "Request Administrative Support"
FRE_Request_Administrative_Support_desc:0 "Beg Paris for administrators, magistrates and paymasters. Wars are also run on paper."
FRE_Appeal_To_Paris_Press:0 "Appeal to the Paris Press"
FRE_Appeal_To_Paris_Press_desc:0 "Fly a handful of sympathetic editors out to Hanoi and show them the war we would like them to see. Risky - journalists have a way of finding the other one."
FRE_Dissolve_The_CEFEO:0 "Dissolve the CEFEO"
FRE_Dissolve_The_CEFEO_desc:0 "Strike the colors. Hand the theatre to the Vietnamese, embark the corps, and close the ledger on the French war in Indochina."

#### Allied coordination decisions ####
FRE_Train_Vietnamese_National_Army:0 "Train the Vietnamese National Army"
FRE_Train_Vietnamese_National_Army_desc:0 "Detach instructors and open the depots to Saigon's new battalions. Jaunissement in practice."
FRE_GCMA_Recruit_TAM:0 "Raise Maquis in the Central Highlands"
FRE_GCMA_Recruit_TAM_desc:0 "Extend the GCMA network among the montagnards of the Tay Nguyen."
FRE_GCMA_Recruit_TAI:0 "Raise Maquis in the Tai Country"
FRE_GCMA_Recruit_TAI_desc:0 "The Tai Federation's hill soldiers know every path around Dien Bien Phu. Arm them."
FRE_GCMA_Recruit_NUN:0 "Raise Maquis Among the Nung"
FRE_GCMA_Recruit_NUN_desc:0 "The Nung of the coastal highlands have fought beside France for a generation. Extend the network."
FRE_GCMA_Recruit_THO:0 "Raise Maquis Among the Tho"
FRE_GCMA_Recruit_THO_desc:0 "The Tho country sits astride the Viet Minh's supply corridors to China. Partisans there are worth battalions elsewhere."

#### De Lattre Line decisions ####
FRE_Fortify_Delta_1:0 "Break Ground on the De Lattre Line"
FRE_Fortify_Delta_1_desc:0 "Concrete blockhouses in a belt around Hanoi and the delta rice bowl. The Marshal wants twelve hundred of them."
FRE_Fortify_Delta_2:0 "Extend the Line to the Coast"
FRE_Fortify_Delta_2_desc:0 "Push the bunker belt to the sea at Haiphong so the corps' lifeline harbor sits behind concrete."
FRE_Fortify_Delta_3:0 "Complete the De Lattre Line"
FRE_Fortify_Delta_3_desc:0 "Close the last gaps. Behind this line the delta feeds and shelters the corps; in front of it, the enemy must pay to be seen."

#### Metropole events ####
FRE_Metropole.1.t:0 "A Convoy for Haiphong"
FRE_Metropole.1.d:0 "The Commander-in-Chief in Indochina requests a materiel convoy: small arms, ammunition, engineering stores. The Ministry of Overseas France supports the request; the Finance Ministry, as ever, does not."
FRE_Metropole.1.a:0 "Load the ships - full manifest."
FRE_Metropole.1.b:0 "Half now, half after the next budget vote."
FRE_Metropole.1.c:0 "The corps must manage with what it has."
FRE_Metropole.2.t:0 "Reinforcements for the Corps"
FRE_Metropole.2.d:0 "Hanoi asks for men. The conscript classes cannot legally be sent to Indochina, which leaves the Legion, the colonial regulars, and whatever volunteers the recruiting sergeants can charm."
FRE_Metropole.2.a:0 "Embark a Legion battalion group."
FRE_Metropole.2.b:0 "Volunteers and replacements only."
FRE_Metropole.2.c:0 "Not one man more."
FRE_Metropole.3.t:0 "Wings over Tonkin"
FRE_Metropole.3.d:0 "The air staff in Hanoi reports that the war consumes transport aircraft faster than France builds them. They want Dakotas, Packets and crews, and they want them before the monsoon."
FRE_Metropole.3.a:0 "Send the full air group."
FRE_Metropole.3.b:0 "A dozen transports can be spared."
FRE_Metropole.3.c:0 "The Armée de l'Air has other wars to plan for."
FRE_Metropole.4.t:0 "The Dinassaut Flotillas"
FRE_Metropole.4.d:0 "The navy proposes commissioning permanent river assault divisions for Indochina - armored barges and gunboats to take the war into the delta waterways."
FRE_Metropole.4.a:0 "Commission the flotillas."
FRE_Metropole.4.b:0 "The estuaries will have to police themselves."
FRE_Metropole.5.t:0 "Administrators for Hanoi"
FRE_Metropole.5.d:0 "The corps holds territory it cannot govern. Hanoi requests civil administrators, paymasters and magistrates - the unglamorous machinery that turns occupied ground into held ground."
FRE_Metropole.5.a:0 "Second the civil servants."
FRE_Metropole.5.b:0 "France is short of clerks as well as soldiers."
FRE_Metropole.10.t:0 "Paris Grows Restless"
FRE_Metropole.10.d:0 "The tone of the cables from Paris has changed. Questions about expenditure arrive before questions about the enemy. The Assembly's defense committee has requested - for the third time - a schedule for 'the reduction of the effort'."
FRE_Metropole.10.a:0 "Economize. Reassure them."
FRE_Metropole.10.b:0 "The war effort comes first."
FRE_Metropole.11.t:0 "The Assembly Balks"
FRE_Metropole.11.d:0 "The credits passed by eleven votes, after a night session and two ministerial resignations. The next vote, everyone agrees, will fail unless something changes - in Indochina or in the government's arithmetic."
FRE_Metropole.11.a:0 "Curtail operations to cut the casualty lists."
FRE_Metropole.11.b:0 "Double down. Victory is the only argument they will hear."
FRE_Metropole.12.t:0 "Paris Has Had Enough"
FRE_Metropole.12.d:0 "The instruction arrives in plain language for once: no further offensive operations, no further requests for reinforcement. The Republic no longer intends to win the war in Indochina; it intends to leave it."
FRE_Metropole.12.a:0 "One more appeal - beg if we must."
FRE_Metropole.12.b:0 "So be it."
FRE_Metropole.13.t:0 "Renewed Confidence"
FRE_Metropole.13.d:0 "For the first time in memory, the cables from Paris contain something like optimism. The credits passed comfortably; the ministers speak of 'seeing it through'. The corps has bought itself time."
FRE_Metropole.13.a:0 "Make it count."
FRE_Metropole.20.t:0 "The Assembly Debates Indochina"
FRE_Metropole.20.d:0 "The annual Indochina debate opens in the National Assembly. The right speaks of honor, the center of budgets, the left of 'la sale guerre'. Somewhere beneath the rhetoric, next year's war will be decided."
FRE_Metropole.20.a:0 "Fight for the full credits."
FRE_Metropole.20.b:0 "Hold the line, nothing more."
FRE_Metropole.20.c:0 "Begin winding this misadventure down."

#### Allied events ####
FRE_Allies.1.t:0 "Instructors for the National Army"
FRE_Allies.1.d:0 "The French command offers instructors, depots and doctrine to expand the Vietnamese National Army. It is help, and it is also a reminder of who still writes the training manuals."
FRE_Allies.1.a:0 "Welcome the instructors."
FRE_Allies.1.b:0 "The National Army trains its own men."
FRE_Allies.10.t:0 "Colonel Trinquier's Ledger"
FRE_Allies.10.d:0 "The GCMA maquis cost money that appears in no budget. Colonel Trinquier explains, without quite explaining, how the highland networks might fund themselves - the crop the montagnards already grow, the trade that already exists, merely... administered."
FRE_Allies.10.a:0 "Look away. The maquis pay for themselves."
FRE_Allies.10.b:0 "Fund them from the official budget, whatever it costs."

#### Battle events ####
FRE_Battles.1.t:0 "The Battle of Vinh Yen"
FRE_Battles.1.d:0 "Giap has come down from the hills at last - two divisions in human waves against the Vinh Yen line, banners forward, bugles in the dark. This is the open battle the corps has begged for. It can be won, if we are willing to win it ugly."
FRE_Battles.1.a:0 "Drop the napalm."
FRE_Battles.1.b:0 "Break them with guns and bayonets."
FRE_Battles.2.t:0 "The Battle of Mao Khe"
FRE_Battles.2.d:0 "The 316th Division is across the river at Mao Khe, six kilometers from the Haiphong coal. The garrison is a few hundred men and the naval channel is still open - barely."
FRE_Battles.2.a:0 "Bring the Dinassaut guns upriver."
FRE_Battles.2.b:0 "Hold with the infantry."
FRE_Battles.3.t:0 "The Day River Line"
FRE_Battles.3.d:0 "Giap's third offensive breaks against the Day River, where Catholic militia and French regulars hold the dikes. The enemy is overextended at last - and so, if we are honest, are we."
FRE_Battles.3.a:0 "Hold the line at any cost."
FRE_Battles.3.b:0 "Bend, do not break."
FRE_Battles.4.t:0 "The Hedgehog of Na San"
FRE_Battles.4.d:0 "An entrenched camp in the Tai country, ringed with wire and supplied wholly by air: the Na San experiment. Giap is coming to test it. If the airbridge holds, his regiments will break on the wire; if it fails, we have built ourselves a trap."
FRE_Battles.4.a:0 "Reinforce the camp by air."
FRE_Battles.4.b:0 "The garrison stands alone."
FRE_Battles.5.t:0 "The Meat Grinder of Hoa Binh"
FRE_Battles.5.d:0 "Hoa Binh was taken to cut the enemy's north-south corridor and to give France a victory in the newspapers. It has become a salient fed by one road and one river, both under fire. The Marshal's successors must decide what his gesture is now worth."
FRE_Battles.5.a:0 "Hold Hoa Binh."
FRE_Battles.5.b:0 "Withdraw in good order."

#### Dien Bien Phu ####
FRE_DBP.1.t:0 "A Base in the Highlands"
FRE_DBP.1.d:0 "Six battalions of paratroops hold the valley of Dien Bien Phu, astride the road to Laos. Engineers are already tearing up the airstrip's grass. Someone must command what the staff is calling the 'base aéro-terrestre' - and someone must decide what it is for."
FRE_DBP.1.a:0 "Colonel de Castries takes the camp."
FRE_DBP.1.b:0 "Give it to the paratroop generals."
FRE_DBP.2.t:0 "Beatrice and Gabrielle"
FRE_DBP.2.d:0 "It begins at dusk: massed artillery - artillery we were assured could never reach these hills - falling on strongpoints Beatrice and Gabrielle. By midnight Beatrice is silent. The garrison waits for orders."
FRE_DBP.2.a:0 "Counter-attack at once."
FRE_DBP.2.b:0 "Consolidate the inner line."
FRE_DBP.3.t:0 "Piroth's Guns"
FRE_DBP.3.d:0 "Colonel Piroth promised that no Viet Minh gun would fire three rounds before his batteries found it. The enemy's guns are dug into the forward slopes, invisible, untouchable, and they fire all day. Piroth no longer leaves his dugout."
FRE_DBP.3.a:0 "Improvise counter-battery tactics."
FRE_DBP.3.b:0 "Trust the guns we have."
FRE_DBP.4.t:0 "The Airbridge in the Monsoon"
FRE_DBP.4.d:0 "The strip is cratered, the monsoon has come early, and the flak grows thicker every week. Supply is now parachutes or nothing - and half the parachutes drift into enemy lines."
FRE_DBP.4.a:0 "Commit every transport we have."
FRE_DBP.4.b:0 "Ration everything."
FRE_DBP.5.t:0 "Washington's Answer"
FRE_DBP.5.d:0 "There is a plan in Washington - Vulture, they call it - for American heavy bombers to break the siege in a single night. It requires only that the President agree, and he is asking questions about what happens on the second night."
FRE_DBP.5.a:0 "Request Operation Vulture."
FRE_DBP.5.b:0 "The camp fights alone."
FRE_DBP.6.t:0 "The Final Assault"
FRE_DBP.6.d:0 "The trenches have crept to within grenade range of the last strongpoints. Tonight the enemy comes with everything he has. There are no more reserves, no more orders worth giving - only the garrison, the wire, and the morning to reach."
FRE_DBP.6.a:0 "Hold until dawn."
FRE_DBP.7.t:0 "The Camp Holds"
FRE_DBP.7.d:0 "Dawn, and the tricolor - torn, black with smoke - still flies over the central redoubt. The human waves have broken. For the first time, Giap's regiments stream back into the hills leaving their dead on the wire. The war has a different shape this morning."
FRE_DBP.7.a:0 "The corps will remember this valley."
FRE_DBP.8.t:0 "The Camp Falls"
FRE_DBP.8.d:0 "The radio room at Isabelle transmits in clear now; there is no one left to encode for. Fifty-six days after the first shell, Dien Bien Phu is finished. What remains is arithmetic: how many men, and how they leave."
FRE_DBP.8.a:0 "Fight to the last strongpoint."
FRE_DBP.8.b:0 "Operation Albatross - break out south."
FRE_DBP.10.t:0 "A Cable from Hanoi"
FRE_DBP.10.d:0 "The French are asking for Vulture: carrier strikes and B-29s over Dien Bien Phu. The Joint Chiefs are split, the Congress leadership is cold, and the word 'atomic' has appeared in one memorandum already."
FRE_DBP.10.a:0 "Send the bombers."
FRE_DBP.10.b:0 "No wider war."

#### Command rotation ####
FRE_Command.1.t:0 "Le Roi Jean"
FRE_Command.1.d:0 "General Jean de Lattre de Tassigny steps off the aircraft at Tan Son Nhut in dress whites, ignores the prepared evacuation briefings, and informs the assembled staff that wives and families will remain in Hanoi. The panic dies in the room where it stood."
FRE_Command.1.a:0 "The corps has a commander again."
FRE_Command.2.t:0 "The Death of Bernard de Lattre"
FRE_Command.2.d:0 "Lieutenant Bernard de Lattre, the Marshal's only son, has been killed holding the rock of Ninh Binh against the 308th Division. The Commander-in-Chief was handed the signal during the morning conference. He read it, folded it, and continued the briefing."
FRE_Command.2.a:0 "He buries his son and stays at his post."
FRE_Command.2.b:0 "Grant him leave to mourn."
FRE_Command.3.t:0 "The Marshal Is Dying"
FRE_Command.3.d:0 "The doctors in Paris have found the cancer, and the Marshal has been told. He continues to cable Hanoi daily - orders, exhortations, demands for aggressive patrolling - from a hospital bed he will not leave."
FRE_Command.3.a:0 "Prepare the succession quietly."
FRE_Command.4.t:0 "The Death of de Lattre"
FRE_Command.4.d:0 "Marshal de Lattre de Tassigny is dead in Paris, eleven months after he took the theatre and one year almost to the day after his son fell at Ninh Binh. France gives him a state funeral. Indochina gives him a moment of silence, and then the war resumes."
FRE_Command.4.a:0 "General Salan assumes command."
FRE_Command.4.b:0 "The staff runs the war for now."
FRE_Command.5.t:0 "Navarre Takes Command"
FRE_Command.5.d:0 "General Henri Navarre - cavalry, intelligence, a career of clean staff work - assumes command of a war he saw for the first time last month. He has been given no instructions that anyone can find in writing, which he takes as freedom of action."
FRE_Command.5.a:0 "A new broom for an old war."
FRE_Command.6.t:0 "The Navarre Plan"
FRE_Command.6.d:0 "The new Commander-in-Chief presents his plan: rebuild a mobile battle corps, keep the enemy off balance through the coming campaign season, and force a decisive engagement on favorable ground. Paris has heard plans before. This one comes with a schedule."
FRE_Command.6.a:0 "Seek the decisive battle."
FRE_Command.6.b:0 "Husband our strength."

#### Flavor pool ####
FRE_Flavor.1.t:0 "The Operation X Ledger"
FRE_Flavor.1.d:0 "A ledger exists. It records, in a tidy staff hand, the movement of highland opium on French airframes and the francs that came back as rifles for the maquis. A copy may already be in a desk drawer in Paris."
FRE_Flavor.1.a:0 "Bury the story."
FRE_Flavor.1.b:0 "Shut Operation X down."
FRE_Flavor.2.t:0 "Echoes of the Affaire des Généraux"
FRE_Flavor.2.d:0 "The Revers Report scandal will not die. Names of serving officers keep surfacing in the Paris weeklies, each leak timed for a budget vote. Someone inside the establishment is still feeding the fire."
FRE_Flavor.2.a:0 "Hunt down the leakers."
FRE_Flavor.2.b:0 "Let it blow over."
FRE_Flavor.3.t:0 "Deserters in the Ranks"
FRE_Flavor.3.d:0 "The Deuxième Bureau reports Legion deserters - Germans, mostly - broadcasting for the Viet Minh in three languages. A handful have come back through the lines, half-starved and asking for amnesty."
FRE_Flavor.3.a:0 "Quiet amnesty for those who return."
FRE_Flavor.3.b:0 "Courts-martial, publicly."
FRE_Flavor.4.t:0 "The Monsoon Swallows the Roads"
FRE_Flavor.4.d:0 "The RC1 is under a meter of brown water and the airfields are mud. The enemy, who carries his war on bicycles and backs, minds this far less than we do."
FRE_Flavor.4.a:0 "Push the convoys through."
FRE_Flavor.4.b:0 "Wait out the rains."
FRE_Flavor.5.t:0 "The MAAG Mission Arrives"
FRE_Flavor.5.d:0 "The American Military Assistance Advisory Group has set up offices in Saigon - crew-cut colonels with clipboards, an evangelical faith in logistics, and signature authority over the aid we asked for."
FRE_Flavor.5.a:0 "Give the Americans the full tour."
FRE_Flavor.5.b:0 "Keep them at arm's length."
FRE_Flavor.6.t:0 "Trucks on the Chinese Border"
FRE_Flavor.6.d:0 "Air reconnaissance counts four hundred Molotova trucks on the Cao Bang roads in a single week. Beyond the border, Chinese instructors are rebuilding Giap's regiments into divisions with artillery."
FRE_Flavor.6.a:0 "Raid the supply corridors."
FRE_Flavor.6.b:0 "Dig in along the RC4."
FRE_Flavor.7.t:0 "The Emperor's Casinos"
FRE_Flavor.7.d:0 "The Binh Xuyen have offered the corps a share of the Grand Monde casino takings in exchange for a free hand on the Saigon waterfront. His Majesty's court, which has its own arrangement, advises against asking questions."
FRE_Flavor.7.a:0 "Take the cut."
FRE_Flavor.7.b:0 "Refuse the dirty money."
FRE_Flavor.8.t:0 "The Haiphong Customs Dispute"
FRE_Flavor.8.d:0 "The State of Vietnam claims the Haiphong customs revenue under the independence accords. The corps collects it under military necessity. Both sides have lawyers; only one side has a garrison."
FRE_Flavor.8.a:0 "The port stays under military control."
FRE_Flavor.8.b:0 "Hand the customs house to Saigon."
FRE_Flavor.9.t:0 "Le Monde Prints the Casualty Lists"
FRE_Flavor.9.d:0 "Someone has given Le Monde the true casualty returns for the year - not the communiqué figures, the real ones. The piece runs tomorrow under the headline 'Le prix du silence'."
FRE_Flavor.9.a:0 "Lean on the censors."
FRE_Flavor.9.b:0 "The Republic has a free press."
FRE_Flavor.10.t:0 "Ambush on the Song Day"
FRE_Flavor.10.d:0 "A Dinassaut convoy took recoilless rifle fire from both banks at the Song Day bend - one LCM burning, eleven men lost. The river war has rules, and the enemy has just rewritten them."
FRE_Flavor.10.a:0 "Sweep the riverbanks."
FRE_Flavor.10.b:0 "Reroute the convoys."
FRE_Flavor.11.t:0 "An Oath in the Highlands"
FRE_Flavor.11.d:0 "The maquis chiefs of the high country have asked the Commander-in-Chief to attend the buffalo sacrifice at which their young men take the rifle oath. It is three days by air and mule, and the staff calls it theatre. The chiefs do not."
FRE_Flavor.11.a:0 "The commander attends in person."
FRE_Flavor.11.b:0 "Send a staff colonel with gifts."
FRE_Flavor.12.t:0 "The Pasteur Comes Home"
FRE_Flavor.12.d:0 "The hospital ship Pasteur docks at Marseille with eight hundred wounded. The port workers' union has voted to 'welcome' her; the veterans' associations will be there too. It will be a scene, one way or the other."
FRE_Flavor.12.a:0 "Full honors on the quay."
FRE_Flavor.12.b:0 "No cameras at the docks."
FRE_Flavor.13.t:0 "La Sale Guerre"
FRE_Flavor.13.d:0 "Dockworkers in Marseille are refusing to load ships for Indochina; in the Assembly, deputies read the names of the dead into the record. 'The dirty war', the placards say. The government must decide how much order to buy, and at what price."
FRE_Flavor.13.a:0 "Break up the dockside strikes."
FRE_Flavor.13.b:0 "Let them march."
FRE_Flavor.14.t:0 "The Photographers of Indochine"
FRE_Flavor.14.d:0 "Life, Paris Match and three wire services want accreditation for the spring operations. The last time photographers reached the front unescorted, the pictures cost us a budget vote. The time before, they won us one."
FRE_Flavor.14.a:0 "Give them the front line."
FRE_Flavor.14.b:0 "Guided tours of the rear only."

#### Wind-down ####
FRE_Winddown.1.t:0 "Ceasefire Orders from Paris"
FRE_Winddown.1.d:0 "The signal is short: hostilities in Indochina are concluded; the corps will prepare for phased withdrawal; further instructions follow. Eight years of war end in forty words, transmission time 0400."
FRE_Winddown.1.a:0 "Stand the corps down."
FRE_Winddown.2.t:0 "The Evacuation of Haiphong"
FRE_Winddown.2.d:0 "The quays of Haiphong are black with people - soldiers embarking, and beside them civilians by the hundred thousand who will not stay to meet the new order in the North. There is not enough shipping in the theatre to carry them all. The Americans are offering theirs."
FRE_Winddown.2.a:0 "Accept the American sealift."
FRE_Winddown.2.b:0 "We leave in our own bottoms."
FRE_Winddown.3.t:0 "The Phased Withdrawal"
FRE_Winddown.3.d:0 "The timetable is agreed: garrison by garrison, the corps hands its posts to the Vietnamese National Army and marches to the ports. What remains to be decided is the pace - and how much of eight years' accumulated stores, positions and knowledge is handed over rather than abandoned."
FRE_Winddown.3.a:0 "Expedite. Bring the boys home."
FRE_Winddown.3.b:0 "A deliberate, orderly handover."
FRE_Winddown.4.t:0 "The Last Ship Out"
FRE_Winddown.4.d:0 "A guard of honor, a folded flag, a band playing thin against the harbor wind. The last elements of the Corps Expeditionnaire Francais d'Extrême-Orient embark. Behind them: the graves of ninety thousand, and a country that must now decide what it will be without them."
FRE_Winddown.4.a:0 "The corps' war is over."
FRE_Winddown.5.t:0 "The Corps Comes Home"
FRE_Winddown.5.d:0 "The transports from Indochina are docking at Marseille and Toulon. The men come down the gangways into a France that has, for the most part, already decided not to talk about it."
FRE_Winddown.5.a:0 "An honorable chapter closes."
FRE_Winddown.5.b:0 "Never again such a war."
