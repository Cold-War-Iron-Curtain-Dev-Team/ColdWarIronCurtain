 agrarian_populism:0 "Agrarian Populism"
 agrarian_populism_desc:0 "£Ideology_Agrarian_Populism_pic\n\n\n\n\n\n\n\n\n"
 authoritarian_democracy:0 "Authoritarian Democracy"
 authoritarian_democracy_desc:0 "£Ideology_Authoritarian_Democracy_pic\n\n\n\n\n\n\n\n\nAuthoritarian democracy is a political system in which democratic processes such as elections and political participation exist, but the government exercises significant control over political and civil liberties."
 buddhist_theocracy:0 "Buddhist Theocracy"
 buddhist_theocracy_desc:0 ""
 colonial_regime:0 "Colonial Government"
 colonial_regime_desc:0 "£Ideology_Colonial_Regime_pic\n\n\n\n\n\n\n\n\nA Colonial Government is a system of administration where a ruling European power, exercises control over a territory or people through direct or indirect rule. Whether the colonizer establishes a bureaucratic administration, or relies on existing local power structures, the colonial power is appointed a Governor to oversee the colony. This is often accompanied by economic stabilisation or exploitation, cultural imposition or complete removal of any former representation.\nMany colonies with the early years of the Cold War are in the process of decolonisation, where newly independent nations will arise through either peaceful transition or violent conflict. Nationalist struggles and anti-colonial sentiment are guaranteed to arise as a result, as the United Nations have consistently passed through resolutions calling for immediate independence of colonial territories."
 colonial_regime_asia:0 "Colonial Government"
 colonial_regime_asia_desc:0 "£Ideology_Colonial_Regime_Asia_pic\n\n\n\n\n\n\n\n\nA Colonial Government is a system of administration where a ruling European power, exercises control over a territory or people through direct or indirect rule. Whether the colonizer establishes a bureaucratic administration, or relies on existing local power structures, the colonial power is appointed a Governor to oversee the colony. This is often accompanied by economic stabilisation or exploitation, cultural imposition or complete removal of any former representation.\nMany colonies with the early years of the Cold War are in the process of decolonisation, where newly independent nations will arise through either peaceful transition or violent conflict. Nationalist struggles and anti-colonial sentiment are guaranteed to arise as a result, as the United Nations have consistently passed through resolutions calling for immediate independence of colonial territories."
 colonial_regime_middle_east:0 "Colonial Government"
 colonial_regime_middle_east_desc:0 "£Ideology_Colonial_Regime_Middle_East_pic\n\n\n\n\n\n\n\n\nA Colonial Government is a system of administration where a ruling European power, exercises control over a territory or people through direct or indirect rule. Whether the colonizer establishes a bureaucratic administration, or relies on existing local power structures, the colonial power is appointed a Governor to oversee the colony. This is often accompanied by economic stabilisation or exploitation, cultural imposition or complete removal of any former representation.\nMany colonies with the early years of the Cold War are in the process of decolonisation, where newly independent nations will arise through either peaceful transition or violent conflict. Nationalist struggles and anti-colonial sentiment are guaranteed to arise as a result, as the United Nations have consistently passed through resolutions calling for immediate independence of colonial territories."
 despotism:0 "Despotism"
 despotism_desc:0 "Despotism is a form of authoritarian rule where absolute power is held by a single ruler—often referred to as a despot—who governs without legal or constitutional constraints. In a despotic state, the ruler exercises unchecked authority over laws, institutions, and the lives of citizens, often relying on fear, coercion, and repression to maintain control.\n\nUnlike monarchies bound by tradition or constitutions, or dictatorships that may claim ideological or popular legitimacy, despotism is marked by the personal will of the ruler being the highest law. The despot's commands override institutions, and opposition is typically silenced through surveillance, censorship, imprisonment, or violence. The rule of law is weak or nonexistent, and the state exists primarily to serve the will of the despot."
 directorial_regime:0 "Directorial Republic"
 directorial_regime_desc:0 "£Ideology_Directorial_Republic_pic\n\n\n\n\n\n\n\n\nOne of the most prominent and enduring examples of a directorial regime is the Swiss Confederation. Switzerland’s federal executive, the Federal Council, consists of seven members who jointly serve as the country’s collective head of state and government. Each member heads a federal department, and decisions are made through consensus or majority vote within the council. The presidency of the council rotates annually among its members, but the president holds no additional power, serving more as a primus inter pares (first among equals).\n\nThis system reflects the Swiss commitment to neutrality, collegiality, and federalism. It ensures continuity, reduces the risk of authoritarianism, and fosters a political culture based on compromise and stability. The Swiss directorial model stands in contrast to more hierarchical systems and remains one of the few functioning examples of true collective executive leadership in the modern world."
 dominant_party_democracy:0 "Dominant Party Democracy"
 dominant_party_democracy:0 "£Ideology_Dominant_Party_Democracy_pic\n\n\n\n\n\n\n\n\nDominant party democracy is an odd-characteristic democracy found in many dictatorships, authoritarian and reactionary regimes. This style of governance usually reduces popular discontent and diplomatic conflict by placing political parties, one of the main elements of democracy, in the most basic form of self-government, to make democracy seem to be in operation on the surface.\nThis approach can all be attributed to one-party, one-party dictatorship, and there are still many regimes that follow it in the 21st century. Also, because it basically follows the elements of democracy, there may be control opposition parties, civic groups, or even functioning opposition parties or political opponents, unlike other forms of dictatorship."
 haredi:0 "Haredu"
 haredi_desc:0 ""
 independent:0 "Independent"
 independent_desc:0 "An independent politician is an individual politician not affiliated with any political party."
 interim_government:0 "Interim Government"
 interim_government_desc:0 "An interim government is a temporary governing body established to lead a country during a transitional period, typically after the collapse of a previous regime, during political upheaval, or between administrations. Its main purpose is to maintain basic state functions, ensure stability, and prepare for the establishment of a permanent government, often through elections, constitutional reform, or peace negotiations.\n\nUnlike regular administrations, interim governments usually operate under limited mandates. They are expected to act with neutrality and restraint, focusing on facilitating a smooth transition rather than pursuing long-term policy agendas. They may be formed through negotiation among political factions, military intervention, or international mediation, depending on the context of the crisis or transition."
 keynesian_paternalism:0 "Keynesian Paternalism"
 keynesian_paternalism_desc:0 "£Ideology_Keynesian_Paternalism_pic\n\n\n\n\n\n\n\n\n"
 military_junta:0 "Military Regime"
 military_junta_desc:0 "£Ideology_Military_Regime_pic\n\n\n\n\n\n\n\n\nA military regime is a form of government wherein a military force exerts complete or substantial control over political authority.\nThis style of governance may be an attempt to bring about democratization through temporary military power, while it may be an attempt to promote semi-permanent military power."
 oligarchism:0 "Oligarchic"
 oligarchism_desc:0 "Oligarchic is a form of government in which power is concentrated in the hands of a small and often elite group of individuals, families, or organizations. These ruling elites—whether based on wealth, military influence, political connections, or social status—exercise significant control over state decisions, institutions, and resources, often to serve their own interests rather than those of the broader population.\n\nUnlike democracies, where power is distributed through elections and popular participation, or monarchies, where rule is hereditary, an oligarchy operates through a tight circle of influence that may function behind formal state structures. In many cases, this elite may dominate key sectors such as the economy, security forces, and media, ensuring that true authority rests with them regardless of any outward appearances of democratic governance."
 reactionary:0 "Reactionary"
 reactionary_desc:0 "£Ideology_Reactionary_pic\n\n\n\n\n\n\n\n\nIn political science, a reactionary is a person who holds political views that favor a return to the status quo ante, the previous political state of society, which he or she believes possessed characteristics that are negatively absent from the contemporary status quo of a society."
 stratocracy:0 "Stratocracy"
 stratocracy_desc:0 ""
 ultra_protectionism:0 "Ultra-Protectionism"
 ultra_protectionism_desc:0 "£Ideology_Ultra_Protectionism_pic\n\n\n\n\n\n\n\n\n"
 un_mandate:0 "United Nations Mandate"
 un_mandate_desc:0 "£Ideology_UN_Mandate_pic\n\n\n\n\n\n\n\n\nUN Mandates refer to a system of international governance in which certain territories, deemed not yet capable of full self-government, are placed under the temporary administration of a member state acting as a trustee. Emerging from the ideals of collective responsibility and decolonization, this system reflects a belief that global stability depends on guiding former colonies and conflict-torn regions toward independence through structured oversight and development.\n\nRooted in the earlier League of Nations Mandate system, but redefined under the United Nations Trusteeship System, UN Mandates are grounded in the principle that sovereignty is a goal to be achieved, not imposed. Administering powers are tasked not with domination, but with fostering political maturity, economic development, education, and human rights, all under the watch of the Trusteeship Council. Unlike colonialism, which sought to extract and control, UN Mandates are framed as a moral obligation to prepare peoples for self-rule."
 UR_party_autocracy:0 "Autocracy"
 UR_party_autocracy_desc:0 ""
 vennamolaisuus:0 "Vennamolaisuus"
 vennamolaisuus_desc:0 "Vennamolaisuus, or Vennamoism in english is name given to the ideology and political movement of Veikko Vennamo, the leader of Finnish Rural Party. It is categorized by populism, reliance on slogans and support for agriculture."

