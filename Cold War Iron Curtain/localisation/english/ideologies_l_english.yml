 mexican_constitutionalism:0 "Mexican Constitutionalism"
 mexican_constitutionalism_desc:0 "Initially rooted in the Mexican Revolution's ideals—land reform, labor rights, and anti-imperialism—it structured society into state-controlled sectors (unions, peasant leagues) to exchange patronage for loyalty. While maintaining a centrist "middle way" rhetoric, it governed through electoral fraud, repression, and controlled modernization. By the 1980s–90s, the PRI pivoted to neoliberalism (privatizations, NAFTA), abandoning its populist roots. Its ideology was never fixed but rather a tool of power—shifting from left-wing statism to right-wing free-market policies while preserving elite dominance through coercion and co-optation."
 nordic_agrarianism:0 "Nordic Agrarianism"
 nordic_agrarianism_desc:0 "£Ideology_Nordic_Agrarianism_pic\n\n\n\n\n\n\n\n\n"
 populism:0 "Populism"
 populism_desc:0 "In the turbulent political landscape of the 20th century, centrist populism emerged as a force that channeled mass discontent into moderate reform, distinguishing itself from the radical left and right by combining anti-establishment appeals with pragmatic governance. This strain of populism often arose during periods of crisis—economic collapse, corruption scandals, or institutional decay—when traditional parties lost credibility, yet voters rejected revolutionary alternatives. Leaders like Argentina's Arturo Frondizi (1958–1962) and Venezuela's Rómulo Betancourt (1959–1964) exemplified this approach, using populist rhetoric to mobilize broad coalitions while pursuing developmentalist policies that balanced state intervention with foreign investment. In Peru, Fernando Belaúnde Terry's 1960s "March Toward the Andes" campaign mixed nationalist symbolism with centrist infrastructure projects, framing technocratic solutions as a moral crusade for the marginalized. The appeal lay in its ambiguity: it promised change without upheaval, attacking oligarchies while avoiding land reforms or expropriations that might trigger elite backlash."
 Three_principles_of_people:0 "Tridemism"
 Three_principles_of_people_desc:0 "£Ideology_Tridemism_pic\n\n\n\n\n\n\n\n\nTridemism follows the philosophy of Sun Yat-sen which is known as the San-Min Doctrine. Those 3 principles are often translated into nationalism (Minzu), democracy (Minquan) and welfare (Minsheng). In order to achieve those principles, the country needs to go through the three phases of the revolution starting with military rule which focuses on erasing corruption and opponents of the revolution, followed by the second phase which is a transitional period, during which a provisional constitution will be promulgated. Its object is to build a local selfgovernment system for the development of democracy. The third stage, which marks the completion of national reconstruction, will usher in constitutional government. During this period the self-governing bodies in the various districts should exercise the direct political powers of the people."
