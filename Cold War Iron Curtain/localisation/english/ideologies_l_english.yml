 socialist2:0 "-Democratic Socialists\n"
 socialist_acceptance:0 "Acceptance of Socialist Regimes Diplomacy"
 
 african_socialism:0 "African-Socialism"
 african_socialism_desc:0 "African socialism and Afro-Marxism are a belief in sharing economic resources in a traditional African way, as distinct from classical socialism. Common principles of African socialism are social development guided by a large public sector, incorporating the African identity and what it means to be African, and the avoidance of the development of social classes within society."
 bolivarianism:0 "Bolivarianism"
 bolivarianism_desc:0 "Bolivarianism, as championed by Hugo Chávez, is a left-wing nationalist and socialist ideology rooted in the revolutionary ideals of Simón Bolívar, reimagined for modern Venezuela with strong anti-imperialist, populist, and Marxist influences. Central to Chávez's vision was the rejection of U.S. hegemony and neoliberal capitalism, instead promoting Latin American unity, economic sovereignty, and state-controlled redistribution of wealth. His government nationalized key industries—particularly oil—to fund expansive social welfare programs (misiones) aimed at reducing poverty and expanding access to healthcare, education, and housing. Politically, Chavismo emphasized participatory democracy through communal councils and constitutional reforms, consolidating power under a centralized, charismatic leadership while rhetorically empowering the marginalized. Ideologically, it blended Bolívar’s pan-Americanism with class struggle rhetoric, positioning itself as a radical alternative to capitalism and a beacon for regional leftist movements, though critics denounced it as authoritarian populism masking economic mismanagement and democratic erosion."
 buddhist_socialism:0 "Buddhist Socialism"
 buddhist_socialism_desc:0 "£Ideology_Buddhist_Socialism_pic\n\n\n\n\n\n\n\n\nBuddhist Socialism is an ideology that seeks to blend the ethical and spiritual teachings of Buddhism with socialist principles of equality, community welfare, and economic justice. It emerged as a unique response to the socio-economic challenges faced by Buddhist-majority countries, particularly in Southeast Asia. Advocates of Buddhist Socialism propose a system where material wealth is distributed to reduce poverty and suffering, but always with a strong emphasis on moral integrity and personal responsibility.\n\nAt its core, Buddhist Socialism teaches that greed and selfishness—the primary causes of suffering according to Buddhist doctrine—should be minimized within society through communal ownership and altruistic governance. Unlike secular socialism, it avoids class struggle as a path to justice, instead promoting compassion, harmony, and mindful governance to achieve social and economic equality. Influential proponents like U Nu in Myanmar and Tenzin Gyatso, the 14th Dalai Lama, argued that Buddhist Socialism could bring about a more peaceful, moral, and balanced world, addressing both the material and spiritual needs of society."
 corporate_neo_liberalism_NZL:0 "Corporate Neo-Liberalism"
 corporate_neo_liberalism_NZL_desc:0 "£Ideology_Corporate_Neo_Liberalism_NZL_pic\n\n\n\n\n\n\n\n\n"
 democratic_socialist:0 "Democratic Socialism"
 democratic_socialist_AST:0 "Democratic Socialism"
 democratic_socialist_AST_desc:0 "£Ideology_Democratic_Socialism_AST_pic\n\n\n\n\n\n\n\n\n"
 democratic_socialist_desc:0 "£Ideology_Democratic_Socialism_pic\n\n\n\n\n\n\n\n\nDemocratic socialism is a political philosophy that advocates political democracy alongside social ownership of the means of production, with an emphasis on self-management and democratic management of economic institutions within a market or some form of decentralized planned socialist economy."
 islamic_socialism:0 "Islamic Socialism"
 islamic_socialism_desc:0 "Islamic Socialism is a political ideology that merges Islamic ethical principles with socialist economic policies, aiming to establish a just society through state-led wealth redistribution, anti-exploitation measures, and public control of key resources while adhering to Islamic teachings. Emerging prominently in the mid-20th century, it served as a post-colonial alternative to both Western capitalism and atheistic communism, particularly in Muslim-majority nations. The ideology emphasizes economic justice through Islamic mechanisms like Zakat (obligatory alms) and the prohibition of riba (usury), alongside socialist-inspired policies such as land reforms, nationalization of industries, and welfare programs. Leaders like Egypt’s Gamal Abdel Nasser, Algeria’s Ahmed Ben Bella, and Libya’s Muammar Gaddafi experimented with variants of Islamic Socialism, blending anti-imperialism, pan-Arab or pan-Islamic unity, and state-driven development. Critics argue it often prioritized authoritarian governance over democratic participation, while supporters viewed it as a means to achieve egalitarian goals without rejecting Islamic identity. The ideology’s legacy persists in debates about equitable development within an Islamic framework, though its influence waned after the late 20th century with the rise of neoliberalism and Islamist movements advocating free-market Islam or theocratic models."
 jamahiriya:0 "Jamahiriya"
 jamahiriya_desc:0 "Muammar Gaddafi's Jamahiriya ideology, outlined in his Green Book, is a unique political system that rejects both capitalism and communism, promoting a third way based on direct democracy. It emphasizes decentralized governance through local People's Committees, where citizens directly participate in decision-making. Gaddafi advocates for Libyan socialism, with state ownership of key industries and wealth redistribution. His ideology extends to Pan-Arabism and Pan-Africanism, aiming for unity among Arab and African nations. While it promotes social justice and anti-imperialism, the system is often criticized for being authoritarian, with Gaddafi maintaining control over the country."
 labor_zionism_mapai:0 "Labor Zionism"
 labor_zionism_mapai_desc:0 "£Ideology_Ideology_Labor_Zionism_pic\n\n\n\n\n\n\n\n\nLabor Zionism is the left-wing of the Zionist movement. For many years, it was the most significant tendency among Zionists and Zionist organizations. It saw itself as the Zionist sector of the historic Jewish labor movements of Eastern and Central Europe, eventually developing local units in most countries with sizable Jewish populations. Labor Zionists believe that a Jewish state could only be created through the efforts of the Jewish working class settling in the Land of Israel and constructing a state through the creation of a progressive Jewish society with rural kibbutzim and moshavim and an urban Jewish proletariat."
 marhaenism:0 "Marhaenism"
 marhaenism_desc:0 "The New Order administration of Suharto, the second President of Indonesia, strongly supported Pancasila. His government promoted the five principles as a key national ideology. They were outlined as representing the ancient wisdom of the Indonesian people, pre-dating the introduction of foreign religions such as Hinduism and Islam. In a July 1982 speech which reflected his attachment to Javanese beliefs, Suharto glorified Pancasila as a key to reach the perfect life (Javanese: ilmu kasampurnaning urip) of harmony with God and fellow men."
 market_socialism:0 "Market Socialism"
 market_socialism_desc:0 "Market socialism is a type of economic system involving the public, cooperative, or social ownership of the means of production in the framework of a market economy."
 neocommunism:0 "Neocommunism"
 neocommunism_desc:0 ""
 nkrumaism:0 "Nkrumaism"
 nkrumaism_desc:0 "Nkrumaism is the political and ideological philosophy developed by Kwame Nkrumah, Ghana's first President and a leading figure in the Pan-African movement. It emerged during the struggle for African independence and was shaped by anti-colonialism, socialism, and Pan-Africanism. Nkrumaism sought to provide a framework for the liberation, unity, and development of Africa. At its core, Nkrumaism emphasizes anti-colonialism and liberation, advocating for the complete rejection of colonialism, imperialism, and neocolonialism while pushing for the political and economic independence of African nations. Central to the ideology is Pan-Africanism and African unity, with Nkrumah envisioning a United States of Africa—a continental government to ensure Africa's collective strength—and actively promoting the Organization of African Unity (OAU), the precursor to the African Union. Economically, Nkrumaism supports African socialism, blending socialist principles with African communal traditions to advocate for state-led industrialization, wealth redistribution, and economic self-sufficiency to break dependency on former colonial powers. Politically, it favors a one-party socialist state, arguing that multi-party systems in post-colonial Africa could lead to division and neocolonial interference, instead promoting a centralized, disciplined governance model. Additionally, Nkrumaism highlights cultural revival and education, stressing the importance of decolonizing African minds, reviving indigenous cultures, and using education as a tool for national development and ideological training. Lastly, it underscores anti-neocolonialism, warning against continued Western economic and political domination even after independence and calling for economic policies that prioritize African interests. Nkrumaism remains influential in discussions on African unity, socialism, and development, inspiring movements and leaders across the continent."
 oriental_personalism:0 "Oriental Personalism"
 oriental_personalism_desc:0 "£Ideology_Oriental_Personalism_pic\n\n\n\n\n\n\n\n\nOriental Personalism is the official ideology of Ngo-Dinh-Diem’s Can-Lao Party in South Vietnam, was shaped by diverse influences, including Emmanuel Mounier’s theory of Personalism, Marxism, and Vietnam’s folk traditions and religious beliefs. While Diem was instrumental in shaping this philosophy, it owed much to his brother Ngo-Dinh-Nhu, who infused revolutionary socialistic elements into it. Oriental Personalism aimed to transform Vietnamese society through a two-phase approach. The first phase, the Personalist Revolution, called for unity among the social and working classes via moral teachings, dissolving their divisions. The second phase, the Social Revolution, envisioned total eradication of materialistic capitalism and colonial remnants, leading to a utopian, socialist, and distinctly Vietnamese society. This vision rejected both materialistic Western’s capitalism and communist collectivism, by prioritizing human dignity, personhood growth, and collective struggle."
 popular_socialism:0 "Popular Socialism"
 popular_socialism_desc:0 "£Ideology_Popular_Socialism_pic\n\n\n\n\n\n\n\n\n"
 racial_populism:0 "Racial Populism"
 racial_populism_desc:0 "£Ideology_Racial_Populism_pic\n\n\n\n\n\n\n\n\n"
