 christian_democracy:0 "Christian Democracy"
 christian_democracy_desc:0 "Christian democracy is a form of conservatism and a political ideology which emerged in 19th century Europe under the influence of Catholic social teaching, as well as Neo_Calvinism. It was originally conceived as a combination of traditional Catholic beliefs and modern democratic ideas, and it grew to incorporate the social teaching of other Christian denominations, such as the Lutheran Church and the Reformed Church."
 industrial_grouperism:0 "Industrial Grouperism"
 industrial_grouperism_desc:0 "£Ideology_Industrial_Grouperism_pic\n\n\n\n\n\n\n\n\n"
 italian_christian_democracy:0 "Christian Democracy"
 italian_christian_democracy_desc:0 "£Ideology_Italian_Christian_Democracy_pic\n\n\n\n\n\n\n\n\nRooted in the tradition of Catholic social teaching and inspired by the legacy of the prewar Partito Popolare Italiano, Christian Democracy presents itself as a broad centrist movement—neither reactionary nor revolutionary. It draws strength from the rural peasantry, the urban middle classes, the devout faithful, and those seeking a moral, stable alternative to the extremes of fascism and communism. Above all, it champions democracy guided by Christian ethics, placing the dignity of the human person, family, labor, and social justice at the center of national reconstruction.\n\nSince the liberation, the Christian Democrats have worked to shape a new Italy, helping draft the Constitution, guiding economic recovery, and navigating the challenges of reconstruction with the support of the Vatican and close cooperation with the Western powers. The party rejects class conflict in favor of solidarity and corporate cooperation between workers and employers. It supports the market, but not without moral restraint and public responsibility."
 organic_centre_left:0 "Organic Centre-Left"
 organic_centre_left_desc:0 ""
 
