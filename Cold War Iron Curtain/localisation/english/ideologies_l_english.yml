 green_desc:0 "Green politics is a political ideology that aims to create an ecologically sustainable society rooted in environmentalism, nonviolence, social justice and grassroots democracy."
 left_wing_peronism:0 "Left-Peronism"
 left_wing_peronism_desc:0 "£Ideology_Peronism_pic\n\n\n\n\n\n\n\n\nPeronism, as the dominant political ideology in Argentina today, is a blend of social justice, labor rights, and nationalism, with a strong emphasis on the state's role in the economy. It advocates for wealth redistribution and improved living standards for the working class, while ensuring that labor unions and workers’ organizations have a central place in policy-making. The ideology promotes economic protectionism, striving for national sovereignty and reducing foreign influence. Peronism positions itself as a “Third Position” between capitalism and socialism, aiming for a balanced, mixed economy. While it continues to champion social reforms and populist appeals, its governance has faced criticism for its authoritarian tendencies, with a strong centralization of power and control over various sectors. The movement remains deeply divided, with factions ranging from more progressive to conservative wings, but it continues to shape Argentina’s path by focusing on national unity and the welfare of its people."
 progressive:0 "Progressivism"
 progressive_desc:0 "Progressivism is the support for or advocacy of improvement of society by reform. As a philosophy, it is based on the idea of progress, which asserts that advancements in science, technology, economic development and social organization are vital to the improvement of the human condition."
