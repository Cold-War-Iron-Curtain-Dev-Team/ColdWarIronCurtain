 agrarianism:0 "Agrarianism"
 agrarianism_desc:0 "£Ideology_Agrarianism_pic\n\n\n\n\n\n\n\n\n"
 black_conservatism:0 "Black Conservatism"
 black_conservatism_desc:0 "Black Conservatism is a type of conservative ideology popular among Africans in both hemispheres. Individuals which would promote black conservatism would likely be advocates of free market capitalism, promotion of traditional beliefs (generally in regards to Catholic and Protestant Christianity), and Patriotism or Jingoism. Black Conservatism generally is opposed to Pan-Africanism, Socialism, Anti-Imperialism and seeks close ties with former colonial powers."
 boryu_conservativism:0 "Boryū Conservative"
 boryu_conservativism_desc:0 "£Ideology_Boryu_Conservativism_pic\n\n\n\n\n\n\n\n\nBoryū Conservatism (Sidestream Conservatism), inspired by the assertive ideals of ex-political elites, stands as a distinct ideological strand within Japanese politics, contrasting with the more moderate stance of Honryū Conservatism. Several of the foundational Boryū Conservative politicians were former pre-war conservative elites who were ousted from power, with some even facing temporary imprisonment. Adopting a more assertive approach, Boryū Conservatism prioritises expanding Japan's military capabilities, making constitutional ammendments flexible, and incorporating the 'sanjo' concept into the social security system."
 conservatism:0 "Conservatism"
 conservatism_desc:0 "£Ideology_Conservativism_pic\n\n\n\n\n\n\n\n\nConservatism is a political and social philosophy promoting traditional social institutions in the context of culture and civilization. The central tenets of conservatism include tradition, human imperfection, organic society, hierarchy and authority, and property rights. Conservatives seek to preserve a range of institutions such as monarchy, religion, parliamentary government, and property rights, with the aim of emphasizing social stability and continuity."
 conservative_democracy:0 "Conservative Democracy"
 conservative_democracy_desc:0 "Conservative Democracy is a combination of conservatism and democracy. Sometimes it's confused with the name used in Turkiyen politics, but the concept of conservative democracy certainly exists. Conservative democracy never abandons democratic values, but it's an ideology that mixes conservative values with them, and it's usually classified as center-right."
 corporatism:0 "Corporatism"
 corporatism_desc:0 ""
 corporatism_AST:0 "Corporatism"
 corporatism_AST_desc:0 "£Ideology_Corporatism_AST_pic\n\n\n\n\n\n\n\n\n"
 free_trade_amoralism:0 "Free-Trade Amoralism"
 free_trade_amoralism_desc:0 "£Ideology_Free_Trade_Amoralism_pic\n\n\n\n\n\n\n\n\n"
 gaullist:0 "Gaullism"
 gaullist_desc:0 "Gaullism is a French political stance based on the thought and action of World War II French Resistance leader General Charles de Gaulle, who would become the founding President of the Fifth French Republic."
 idiosyncratic_paternalism:0 "Idiosyncratic Paternalism"
 idiosyncratic_paternalism_desc:0 "£Ideology_Idiosyncratic_Paternalism_pic\n\n\n\n\n\n\n\n\n"
 ilminism_conservative:0 "Ilminism"
 ilminism_conservative_desc:0 "£Ideology_Ilminism_pic\n\n\n\n\n\n\n\n\nIlminism is a ruling ideology that 'let's eliminate internal divisions of the people', which was designated as a national poem by then-President Syngman Rhee in 1949. It was theorized by Ahn Ho-sang, the first Minister of Culture and Education and philosopher.\nIlminism includes ethnic nationalism and even has a little bit of fascism. The most fundamental idea of this idea is authoritarian conservatism."
 liberal_nationalism:0 "Liberal Nationalism"
 liberal_nationalism_desc:0 ""
 national_conservatism:0 "National Conservatism"
 national_conservatism_desc:0 "£Ideology_National_Conservatism_pic\n\n\n\n\n\n\n\n\nNational conservatism is a variant of conservatism that concentrates more on national interests and upholding cultural or ethnic identity than most other conservatives. In Europe, national conservatives are usually Eurosceptics."
 paternalistic_conservatism:0 "Paternalistic Conservatism"
 paternalistic_conservatism_desc:0 "£Ideology_Paternalistic_Conservatism_pic\n\n\n\n\n\n\n\n\n"
 religious_zionism:0 "Religious Zionism"
 religious_zionism_desc:0 "Religious Zionists used to be just observant Jews who supported the Zionist movement, but gradually it evolved into a movement of its own. The followers of Religious Zionism believe that the right for the Jews to settle the ancient land of Israel which was promised to them by god as permanent and inalienable. Zionism is still opposed by ultra-orthodox Jews who see Zionism as interfering with salvation and thus, blasphemous but Religious Zionists still believe in the merit of settling in Israel on religious grounds."
 republican:0 "Republican Party"
 republican_desc:0 "The Republican Party is one of the two major political parties in the United States, the other being its historic rival, the Democratic Party. The party is named after republicanism, a major ideology of the American Revolution. Founded by anti-slavery activists, economic modernizers, ex-National Republicans, ex-Free Soilers and Whigs in 1854, the Republicans largely dominated politics nationally and in the majority of northern states between 1860 and 1932."
 right_wing_populism:0 "Right-Wing Populism"
 right_wing_populism_desc:0 ""
 social_conservative:0 "Social Conservative"
 social_conservative_desc:0 "Social conservatism is an ideology that advocates duties and social traditional values that are considered desirable based on traditional values socially, religious, cultural, and ethnic (or national) and pursues social stability through an existing social order. Social conservatives generally believe that society is built on a network of fragile relationships, and that is why governments should encourage or implement a wide range of traditional values or actions that existing societies have had."
 Three_principles_of_people_conservative:0 "Kuomintang (Minzu-Orthodox Wing)"
 Three_principles_of_people_conservative_desc:0 "In contrast to the other factions of the reformed Kuomintang, the conservative circle is advocating for preserving Chinese heritage and roots as a major priority of the state domestically. Economically, it supports a mixed economy that usually involves Central Planning from the Government itself alongside partial privitization of some industries, allowing the co-existence of Nationalization and Privitization. Diplomatically, the right-wing members hope for the eradication of Communism as the main Foreign Policy of the Republic, alongside increasing China's self-reliance and preventing any American attempts of subjugating China into its sphere of influence."
 UR_party_soccon:0 "Social Conservatism"
 UR_party_soccon_desc:0 ""
 
