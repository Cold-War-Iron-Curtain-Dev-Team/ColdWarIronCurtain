 absolute_monarchy:0 "Absolute Monarchy"
 absolute_monarchy_desc:0 "Absolute monarchy is a form of government where a single ruler, typically a king or queen, holds all the power and authority over the state, with their decisions unbound by laws or a constitution. This system often emphasizes the divine right of kings, asserting that monarchs are chosen by God and thus accountable only to Him. This leads to the centralization of power and the diminishment of noble influence."
 islamic_monarchy:0 "Islamic Monarchy"
 islamic_monarchy_desc:0 "Islamic monarchies are a type of Islamic state which are monarchies. They are historically known by various names, such as Mamlakah, Caliphate, Sultanate, or Emirate."
 monarchist:0 "Monarchy"
 monarchist_desc:0 "£Ideology_Monarchism_pic\n\n\n\n\n\n\n\n\nA monarchy is a form of government in which a group, generally a family representing a dynasty, embodies the country's national identity and its head, the monarch, exercises the role of sovereignty."
 negusa_nagast:0 "Negusa Nagast"
 negusa_nagast_desc:0 "Negusa Nagast, or king of kings, is a type of selective hereditary imperial monarchy that became the prevalent leadership of Ethiopia since Negus Zemene Mesafint ended the Age of Princes period where Ethiopia was fractured between small principalities, kindoms, and sultanates."
 regency:0 "Regency"
 regency_desc:0 "£Ideology_Regency_pic\n\n\n\n\n\n\n\n\nA regency is a temporary form of governance in which a regent exercises the powers and duties of a monarch who is unable to rule due to specific circumstances—most commonly minority (being too young to rule), physical or mental incapacity, or extended absence. While the regent acts with royal authority, they do so as a caretaker and not as a sovereign in their own right.\n\nRegencies have occurred throughout history in monarchies around the world, often during times of transition or crisis. The structure and limits of a regency are usually defined by law or custom, and can involve a single regent or a council of regents. Despite holding great power, a regent’s legitimacy is always tied to the authority of the monarch they serve in place of, and their rule is expected to end once the monarch is able to resume the throne."
 vatican:0 "Vatican"
 vatican_desc:0 "The politics of Vatican City take place in a framework of an theocratic absolute elective monarchy, in which the Pope, religiously speaking, the leader of the Roman Catholic Church and Bishop of Rome, exercises ex officio supreme legislative, executive, and judicial power over the Vatican City, a rare case of non-hereditary monarchy."

