 authenticite:0 "Mobutuism"
 authenticite_desc:0 "Mobutuism (or Mobutisme in French) was the official state ideology of Zaire under the rule of Mobutu Sese Seko (1965–1997), serving as a political doctrine designed to legitimize his authoritarian regime and promote national unity under his leadership. The ideology blended African nationalism, anti-colonialism, authoritarianism, and cultural revivalism, with a strong emphasis on Mobutu's personal supremacy. A key component was Authenticité (Authenticity), a campaign aimed at rejecting European colonial influences and promoting African identity, which included abandoning Christian names in favor of African ones (Mobutu himself adopted the name Mobutu Sese Seko Kuku Ngbendu wa za Banga) and discouraging Western clothing in favor of the abacost (a suit without a tie, symbolizing African identity). Mobutuism also rejected both Western capitalism and Marxist communism, advocating instead for a supposedly unique African path, though in practice, Mobutu relied on Western support (particularly from the U.S. and Belgium) to sustain his rule. The regime enforced single-party rule under the Popular Movement of the Revolution (MPR), the only legal political party, with all citizens automatically considered members, while Mobutu centralized power, eliminating opposition and cultivating a cult of personality that portrayed him as the nation’s indispensable leader. Economically, Mobutuism promoted state control and patronage networks, though rampant corruption and mismanagement led to economic decline. Despite its rhetoric of African pride and independence, Mobutuism ultimately functioned as a tool for maintaining Mobutu’s autocratic control over Zaire rather than fostering genuine development or democracy."
 baathism:0 "Baathism"
 baathism_desc:0 "Baathism is an Arab nationalist ideology that promotes the development and creation of a unified Arab state through the leadership of a vanguard party over a progressive revolutionary government."
 dixiecrat_fascist:0 "Dixiecrat"
 dixiecrat_fascist:0 "£Ideology_Dixiecrat_pic\n\n\n\n\n\n\n\n\n"
 falangism:0 "Falangism"
 falangism_desc:0 "£Ideology_Falangism_pic\n\n\n\n\n\n\n\n\nFalangism is a far-right authoritarian and nationalist ideology that originated in Spain during the early 20th century. It is most closely associated with the Spanish Falange, a fascist political movement founded by José Antonio Primo de Rivera. Falangism promotes a vision of national unity based on Catholic traditionalism, militarism, anti-communism, and corporatist economics, rejecting both liberal democracy and Marxist socialism.\n\nAt its core, Falangism seeks to create a totalitarian state where all aspects of society—political, economic, and cultural—are subordinated to the goals of the nation as defined by a single, unified identity. It emphasizes the importance of hierarchy, duty, and sacrifice, glorifies the nation’s historical legacy, and views individualism as a threat to social cohesion."
 fascism_ideology:0 "Third Positionism (Fascism)"
 fascism_ideology_desc:0 "Encompassing a variety of ultra-nationalist movements, third positionism typically venerates devotion to the state and uniting the people under a strong leader. Third Positionism is presented as its own unique ideology as a third option to capitalism or communism."
 fujimorism:0 "Fujimorism"
 fujimorism_desc:0 "Fujimorism refers to the political ideology of Peru’s Alberto Fujimori (1990–2000) and his daughter Keiko, blending authoritarian populism, neoliberal economics, and anti-establishment rhetoric. Fujimori centralized power via a 1992 self-coup, crushed the Shining Path insurgency with brutal tactics, and implemented shock-therapy market reforms that stabilized Peru’s economy but worsened inequality. His rule relied on clientelism, corruption, and a "savior" narrative, leaving a polarizing legacy credited with ending hyperinflation and terrorism but convicted for human rights abuses and embezzlement. Fujimorism remains influential through Keiko’s political campaigns, sustaining a divide between supporters praising its pragmatism and critics condemning its authoritarianism."
 hindu_nationalism:0 "Hindu Nationalism"
 hindu_nationalism_desc:0 "Hindu nationalism has been collectively referred to as the expression of social and political thought, based on the native spiritual and cultural traditions of the Indian subcontinent."
 hutu_supremacy:0 "Hutu Supremacy"
 hutu_supremacy_desc:0 "Hutu supremacy is an ethnic nationalist ideology that asserts the dominance of the Hutu ethnic group over other groups in Rwanda and Burundi, particularly the Tutsi and, to a lesser extent, the Twa. It emerged as a reaction to colonial-era policies that favored the Tutsi minority under Belgian rule, creating deep-seated resentment among the Hutu majority. The ideology promotes the belief that Hutus, as the majority population, should hold exclusive political, economic, and social power, reversing historical Tutsi dominance. Central to Hutu supremacy is virulent anti-Tutsi rhetoric, which historically portrayed Tutsis as foreign oppressors, invaders, or even subhuman, often using propaganda to dehumanize them and justify exclusion, discrimination, or violence. Politically, the ideology was institutionalized in post-colonial Rwanda through movements like the Parmehutu party and later the Hutu Power extremists, who enforced policies such as ethnic quotas and systemic marginalization of Tutsis. Economically, it sought to dismantle Tutsi wealth and land ownership, redistributing resources to Hutus under the guise of social justice. At its most extreme, Hutu supremacy fueled mass violence, including the 1959 Hutu Revolution, periodic pogroms, and ultimately the 1994 Rwandan genocide, where Hutu Power leaders incited the extermination of Tutsis and moderate Hutus. The ideology relied on fear-mongering, historical revisionism, and the myth of a Hutu struggle for liberation, portraying Tutsis as an eternal threat that needed to be eliminated for Hutu survival. While its most violent manifestations were crushed after the Rwandan Patriotic Front's victory in 1994, remnants of Hutu supremacist thought persist among some exiled extremist groups and diaspora factions, though it is widely condemned as a genocidal ideology in modern Rwanda."
 kahanism:0 "Kahanism"
 kahanism_desc:0 ""
 ku_klux_klan:0 "Ku Klux Klan"
 ku_klux_klan_desc:0 "The Ku Klux Klan is an American white supremacist hate group. The Klan has existed in three distinct eras at different points in time during the history of the United States. Each has advocated extremist reactionary positions such as white supremacy, white nationalism, anti-immigration and-especially in later iterations-Nordicism and anti-Catholicism."
 mau_mau_movement:0 "Mau Mau Movement"
 mau_mau_movement_desc:0 "£Ideology_Mau_Mau_Movement_pic\n\n\n\n\n\n\n\n\n"
 metaxism:0 "Metaxism"
 metaxism_desc:0 ""
 national_bolshevik:0 "National Bolshevism"
 national_bolshevik_desc:0 "National Bolshevism is a political movement that combines elements of nationalism and Bolshevism."
 nazi_maoism:0 "Nazi-Maoism"
 nazi_maoism_desc:0 ""
 neo_fascism:0 "Neo-Fascism"
 neo_fascism_desc:0 ""
 neo_legionarism:0 "Neo-Legionarism"
 neo_legionarism_desc:0 ""
 neo_nazism:0 "Neo-Nazism"
 neo_nazism_desc:0 "£Ideology_Neo-Nazism_pic\n\n\n\n\n\n\n\n\nNeo-Nazism consists of post-World War II militant, social or political movements seeking to revive the ideology of Nazism. It borrows elements from Nazi doctrine, including ultranationalism, racism up to xenophobia, ableism, homophobia, anti-Romanyism, antisemitism, anti-communism and initiating the Fourth Reich. Holocaust denial is a common feature, as is the incorporation of Nazi symbols and admiration of Adolf Hitler."
 repressive_autocracy:0 "Repressive Autocracy"
 repressive_autocracy_desc:0 "£Ideology_Repressive_Autocracy_pic\n\n\n\n\n\n\n\n\nRepressive Autocracy is a system of absolute authority, characterized by the concentration of power in a single individual exercising complete control over the state and its citizens. Lacking checks and balances, the autocrat often uses force, intimidation, and coercion to maintain stability and power. Suppress dissent, opposition, and individual rights follows soon after, often including the use of secret police, arbitrary detention, torture, and extrajudicial killings. This system of brutal control often finds the autocrat controlling the economy as well, often using it to reward loyalists and punish any potential threat to power."
 rexism:0 "Rexism"
 rexism_desc:0 "Strongly opposed to both liberal and communist ideals, Rexism is a staunchly conservative nationalist movement who advocate a corporatist economic policy. Employing increasingly populist and authoritarian rhetoric, their ideals are shifting closer to other fascist movements."
 right_wing_peronism:0 "Right-Peronism"
 right_wing_peronism_desc:0 "£Ideology_Peronism_pic\n\n\n\n\n\n\n\n\nOrthodox Peronism under Isabel Perón, Raúl Lastiri, and José López Rega combines Third Positionist rhetoric with authoritarian neoliberalism. While maintaining anti-communist and anti-liberal posturing, the government violently represses leftist opposition through the AAA death squads while imposing neoliberal austerity measures like the Rodrigazo shock program—slashing wages, cutting subsidies, and opening the economy to foreign capital. Despite Peronism's traditional syndicalist foundations, it actively weakens unions and dismantles worker protections. This reactionary transformation turns justicialismo into a contradictory mix of state terror and economic liberalization, betraying Perón's original vision while paving the way for Argentina's later neoliberal era. The regime's brutal repression of the Left mirrors its rightward economic shift, exposing Orthodox Peronism as an unstable fusion of fascistic violence and capitalist restructuring."
 Salazarism:0 "Salazarism"
 Salazarism_desc:0 "Salazarism is a nationalist authoritarian ideology focusing on 'God, Fatherland and Family' and emphasizing the social role of Catholicism - setting it apart from mainstream variations of Fascism."
 trujillism:0 "Trujillism"
 trujillism_desc:0 "Trujillism is a political ideology and cult of personality built around the rule and legacy of Rafael Leónidas Trujillo, the authoritarian leader who dominated the Dominican Republic for over three decades. At its core, Trujillism is defined by an extreme concentration of power, personal loyalty to the leader, militarized nationalism, and the fusion of state authority with the identity of a single man.\n\nIdeologically, Trujillism blends elements of right-wing authoritarianism, nationalist centralism, and anti-communism, wrapped in a carefully constructed image of Trujillo as the savior and embodiment of the nation. Under this system, the state is portrayed as an extension of the leader’s will, and all institutions—military, political, religious, and civil—are subordinated to his authority. The regime emphasized order, discipline, and modernization, often boasting of infrastructure projects and economic stability as proof of Trujillo’s “benevolent” rule, even as repression, surveillance, and violence crushed dissent.\n\nTrujillism promotes a patriarchal and hierarchical society, glorifying traditional values, rigid social control, and racial nationalism."
