l_english:

 VIN_Toan_Quoc_Khang_Chien:0 "National Resistance"
 VIN_Toan_Quoc_Khang_Chien_desc:0 "The entire nation must be organized for resistance. From the mountains of Viet Bac to the villages of the delta, every citizen has a role in defending Vietnamese independence."

 VIN_1950_Trip_Beijing_Moscow:0 "The Beijing-Moscow Journey"
 VIN_1950_Trip_Beijing_Moscow_desc:0 "A revolutionary victory in China opens the road to Beijing and Moscow. Ho Chí Minh's delegation will seek recognition, arms, training, and a place within the socialist camp."

 VIN_1950_Trip_Nanking_Moscow:0 "The Nanking-Moscow Journey"
 VIN_1950_Trip_Nanking_Moscow_desc:0 "A Nationalist victory in China demands a more cautious diplomatic strategy. By engaging Nanking and Moscow alike, we may preserve the revolution's room to maneuver."

 VIN_Found_Tong_Cuc_Chinh_Tri:0 "Found the General Political Department"
 VIN_Found_Tong_Cuc_Chinh_Tri_desc:0 "A modern people's army requires political cohesion as much as rifles and ammunition. The General Political Department will carry Party leadership into every unit."

 VIN_Learning_Hundred_Flowers_Campaign:0 "Study the Hundred Flowers Campaign"
 VIN_Learning_Hundred_Flowers_Campaign_desc:0 "The Chinese debate over criticism and creativity offers both an opportunity and a warning. We must decide what lessons can be adapted to Vietnamese conditions."

 VIN_Closer_Ties_Chua_Meo:0 "Closer Ties with the Chao Meo"
 VIN_Closer_Ties_Chua_Meo_desc:0 "The Chao Meo hold vital ground in the northern highlands. Closer cooperation will strengthen local resistance and secure the revolution's mountain frontier."

 VIN_Contact_Vong_A_Sang:0 "Contact Vong A Sang"
 VIN_Contact_Vong_A_Sang_desc:0 "Contacts among the northern upland peoples can broaden the anti-colonial coalition. Their local knowledge and fighting spirit will be essential in the difficult borderlands."

 VIN_Dai_Hoi_II:0 "The Second Party Congress"
 VIN_Dai_Hoi_II_desc:0 "The Party must gather to define its program, renew its leadership, and turn a war of resistance into a durable national revolution."

 VIN_Rally_The_Gio_Tri_Thuc:0 "Rally the Intelligentsia"
 VIN_Rally_The_Gio_Tri_Thuc_desc:0 "Teachers, writers, doctors, and technicians are indispensable to a modern Vietnam. The revolution must give the intelligentsia a meaningful place in national reconstruction."

 VIN_Lay_Dan_Lam_Goc:0 "Take the People as Our Foundation"
 VIN_Lay_Dan_Lam_Goc_desc:0 "The Party must draw its legitimacy from the people rather than from decrees alone. Mass participation and local accountability will strengthen the revolution from below."

 VIN_The_National_Solidarity_Bloc:0 "The National Solidarity Bloc"
 VIN_The_National_Solidarity_Bloc_desc:0 "Vietnam's liberation demands a coalition wider than any one party or class. A durable national front can unite patriots who disagree on much else."

 VIN_Ngo_Dinh_Diem_Manifesto:0 "The Ngo Dình Diem Manifesto"
 VIN_Ngo_Dinh_Diem_Manifesto_desc:0 "Ngo Dình Diem's appeal to nationalism and religion cannot be ignored. We must answer it with a clearer vision of independence, justice, and national unity."

 VIN_Integrate_Patriotic_Religious_Organizations:0 "Integrate Patriotic Religious Organizations"
 VIN_Integrate_Patriotic_Religious_Organizations_desc:0 "Religious believers need not stand outside the revolution. By working with patriotic organizations, we can deny reactionaries a monopoly on faith and community."

 VIN_Merge_Viet_Minh_Lien_Viet:0 "Merge Viet Minh and Lien Viet"
 VIN_Merge_Viet_Minh_Lien_Viet_desc:0 "The anti-colonial movement must be consolidated into a single political vehicle. Merging the Viet Minh and Lien Viet will strengthen the national front and clarify its purpose."

 VIN_Reign_of_Stalin:0 "Reign of Stalin"
 VIN_Reign_of_Stalin_desc:0 "If Stalin's authority endures, Vietnam must demonstrate discipline and reliability within the socialist camp while drawing on its material and political support."

 VIN_Under_Political_Discipline:0 "Under Political Discipline"
 VIN_Under_Political_Discipline_desc:0 "The Party will place ideological unity, military discipline, and international solidarity above factional experimentation. The revolution must be hardened for the struggle ahead."

 VIN_The_Strength_in_Our_Heart:0 "The Strength in Our Heart"
 VIN_The_Strength_in_Our_Heart_desc:0 "The resilience of an armed people is a strategic resource. Political commitment, local defense, and confidence in victory can offset an enemy's material superiority."

 VIN_The_Revolutionary_Struggle:0 "The Revolutionary Struggle"
 VIN_The_Revolutionary_Struggle_desc:0 "Vietnam's fight is part of a wider struggle against colonialism and capitalism. We will deepen ties with the governments and movements that share that purpose."

 VIN_The_Death_of_Stalin:0 "The Death of Stalin"
 VIN_The_Death_of_Stalin_desc:0 "Stalin's death opens a period of uncertainty across the socialist world. Vietnam must respond without abandoning its independence or its revolutionary commitments."

 VIN_Unity_for_Independence:0 "Unity for Independence"
 VIN_Unity_for_Independence_desc:0 "Our foreign relationships must serve national liberation first. A new Indochinese alignment can preserve revolutionary solidarity without surrendering Vietnamese initiative."

 VIN_The_Virtue_of_Mind:0 "The Virtue of Knowledge"
 VIN_The_Virtue_of_Mind_desc:0 "Schools, literacy, and technical training are instruments of national power. A free and educated people will be better prepared to defend and rebuild the country."

 VIN_The_National_Struggle:0 "The National Struggle"
 VIN_The_National_Struggle_desc:0 "The revolution must speak to every Vietnamese community, including the highland peoples whose support is vital to a united and defensible republic."

 VIN_Bamboo_Diplomacy:0 "Bamboo Diplomacy"
 VIN_Bamboo_Diplomacy_desc:0 "Like bamboo, Vietnamese diplomacy must be rooted in principle yet flexible in the wind. We will seek room to maneuver among larger powers without losing our core aims."

 VIN_Establish_International_Ties:0 "Establish International Ties"
 VIN_Establish_International_Ties_desc:0 "Recognition and representation are not mere formalities. They are safeguards against isolation and a means to secure aid, trade, and diplomatic legitimacy."

 VIN_Support_Lao_Issara_Khmer_Issarak:0 "Support the Lao Issara and Khmer Issarak"
 VIN_Support_Lao_Issara_Khmer_Issarak_desc:0 "The liberation of Indochina cannot be separated by colonial borders. Support for Lao and Khmer revolutionary forces will strengthen the entire regional struggle."

 VIN_Nam_Bo_Khang_Chien:0 "The Southern Resistance"
 VIN_Nam_Bo_Khang_Chien_desc:0 "The southern resistance requires its own networks, commanders, and supply routes. We must keep the struggle alive beyond the reach of the northern base areas."

 VIN_Raise_the_Smuggling_Fleet:0 "Raise the Smuggling Fleet"
 VIN_Raise_the_Smuggling_Fleet_desc:0 "Small vessels and clandestine crews can move men and materiel where conventional forces cannot. A maritime lifeline will sustain the southern insurgency."

 VIN_Empower_the_Democratic_Front:0 "Empower the Democratic Front"
 VIN_Empower_the_Democratic_Front_desc:0 "A broader democratic front can draw in urban patriots, sectarian groups, and local power brokers who will not join a narrowly communist movement."

 VIN_Mass_Recruitments_Binh_Xuyen_and_Sectarians:0 "Recruit the Bình Xuyen and Sectarians"
 VIN_Mass_Recruitments_Binh_Xuyen_and_Sectarians_desc:0 "The fractured politics of the south offer an opportunity. By recruiting the Bình Xuyen and religious sectarians, we can turn local armed power against the colonial order."

 VIN_Nguyen_Binh_Ambush:0 "The Nguyen Bình Ambush"
 VIN_Nguyen_Binh_Ambush_desc:0 "The fate of Nguyen Bình will shape the southern struggle. A single ambush may decide whether the resistance remains unified or fractures into rival currents."

 VIN_Death_of_Nguyen_Binh:0 "The Death of Nguyen Bình"
 VIN_Death_of_Nguyen_Binh_desc:0 "Nguyen Bình's loss would leave the southern movement without its most recognized commander. We must choose a successor before uncertainty becomes collapse."

 VIN_Nguyen_Binh_Survives:0 "Nguyen Bình Survives"
 VIN_Nguyen_Binh_Survives_desc:0 "Nguyen Bình's survival preserves a crucial link between the northern leadership and the diverse forces of the south. His authority can keep the united front intact."

 VIN_Fate_of_Kieu_Cong_Cung_Revisionists:0 "The Fate of Kieu Cong Cung's Revisionists"
 VIN_Fate_of_Kieu_Cong_Cung_Revisionists_desc:0 "Rival currents within the southern movement cannot be ignored. We must settle the question of revisionism, syndicalism, and the authority of the revolutionary center."

 VIN_Promote_Le_Duc_Tho_Orthodoxy:0 "Promote Le Dức Tho's Orthodoxy"
 VIN_Promote_Le_Duc_Tho_Orthodoxy_desc:0 "The southern movement must be brought into a disciplined Marxist-Leninist line. Le Dức Tho's political network offers a path toward ideological consolidation."

 VIN_Bac_Tien:0 "Northward Advance"
 VIN_Bac_Tien_desc:0 "A northern advance can reunite the armed struggle under one command and prevent the south from becoming a separate political project."

 VIN_Retain_Nguyen_Binh_United_Front:0 "Retain Nguyen Bình's United Front"
 VIN_Retain_Nguyen_Binh_United_Front_desc:0 "The southern insurgency draws strength from its diversity. Retaining Nguyen Bình's broad coalition may be less tidy, but it is better suited to the realities of the south."

 VIN_Victory_in_the_South:0 "Victory in the South"
 VIN_Victory_in_the_South_desc:0 "A military victory in the south would transform the balance of power in all of Vietnam. The revolution must be ready to convert battlefield success into national reunification."

 VIN_Nhan_Van_Giai_Pham_Affair:0 "The Nhan Van-Giai Pham Affair"
 VIN_Nhan_Van_Giai_Pham_Affair_desc:0 "The debate around Nhan Van-Giai Pham raises a fundamental question: will the revolution tolerate criticism from writers and intellectuals, or treat it as a political threat?"

 VIN_Destroy_Reactionary_Thoughts:0 "Destroy Reactionary Thoughts"
 VIN_Destroy_Reactionary_Thoughts_desc:0 "The Party will confront ideas it regards as hostile to socialist construction. Cultural work must serve the revolution rather than undermine it."

 VIN_Nghi_Quyet_So_30_Van_Nghe:0 "Resolution No. 30 on Culture and Arts"
 VIN_Nghi_Quyet_So_30_Van_Nghe_desc:0 "A formal resolution will bring writers, artists, and publishers under clearer political guidance. Cultural production must be organized as a national responsibility."

 VIN_A_United_Front:0 "A United Front"
 VIN_A_United_Front_desc:0 "A disciplined cultural front can bind intellectuals to the wider revolutionary project. The Party will seek unity before dissent hardens into opposition."

 VIN_Of_Our_Pen_and_Bayonet:0 "Of the Pen and the Bayonet"
 VIN_Of_Our_Pen_and_Bayonet_desc:0 "Writing and fighting are both weapons in a people's war. Art, journalism, and education must strengthen morale and expose the enemy's political weakness."

 VIN_Do_Not_Be_Deceived:0 "Do Not Be Deceived"
 VIN_Do_Not_Be_Deceived_desc:0 "The Party warns that attractive language can conceal reactionary intent. Cultural vigilance is presented as necessary to defend the gains of the revolution."

 VIN_Enforce_Ideological_Unity:0 "Enforce Ideological Unity"
 VIN_Enforce_Ideological_Unity_desc:0 "The state will demand a clear ideological line from its cultural institutions. Ambiguity and factionalism cannot be allowed to weaken national mobilization."

 VIN_The_Enemies_in_Our_Mind:0 "The Enemies in Our Mind"
 VIN_The_Enemies_in_Our_Mind_desc:0 "The revolution faces dangers not only on the battlefield but in inherited habits, class prejudices, and foreign cultural influence. Political education must reach daily life."

 VIN_The_Counterrevolutionary_Betrayal:0 "The Counterrevolutionary Betrayal"
 VIN_The_Counterrevolutionary_Betrayal_desc:0 "Open resistance to the Party line will be cast as more than disagreement. The state will treat it as a betrayal of the people and the national struggle."

 VIN_Nothing_But_Punishment:0 "Nothing But Punishment"
 VIN_Nothing_But_Punishment_desc:0 "The harshest path treats cultural opposition as a crime to be eliminated, regardless of the social cost. Fear may create obedience, but it will leave deep scars."

 VIN_Enforce_Purges_Against_Revisionist_Arts:0 "Enforce Purges Against Revisionist Arts"
 VIN_Enforce_Purges_Against_Revisionist_Arts_desc:0 "Institutions, journals, and artists accused of revisionism will be purged. Socialist culture will be remade around ideological reliability."

 VIN_Stand_Together_In_Orthodoxy:0 "Stand Together in Orthodoxy"
 VIN_Stand_Together_In_Orthodoxy_desc:0 "The Party seeks to close ranks after the cultural struggle. Orthodoxy will be portrayed as the only secure foundation for national unity."

 VIN_Every_Writer_is_a_Soldier:0 "Every Writer is a Soldier"
 VIN_Every_Writer_is_a_Soldier_desc:0 "Authors, teachers, and artists will be enlisted in the political struggle. Their work must build morale, educate the public, and defend the revolution."

 VIN_Let_Hundred_Flowers_Bloom:0 "Let a Hundred Flowers Bloom"
 VIN_Let_Hundred_Flowers_Bloom_desc:0 "Constructive criticism can expose bureaucratic weakness and renew the revolution. We will permit debate in the belief that socialism has nothing to fear from honest voices."

 VIN_Accept_Democratization_and_Individualization:0 "Accept Democratization and Individualization"
 VIN_Accept_Democratization_and_Individualization_desc:0 "Vietnam cannot modernize by suppressing every independent initiative. Political reforms and individual expression may strengthen, rather than weaken, the nation."

 VIN_The_Right_Path_to_Democratization:0 "The Right Path to Democratization"
 VIN_The_Right_Path_to_Democratization_desc:0 "Reform must be guided carefully so that it deepens popular participation without allowing the return of colonial privilege or class domination."

 VIN_The_Budapest_Model:0 "The Budapest Model"
 VIN_The_Budapest_Model_desc:0 "The events of Budapest demonstrate both the appeal and the danger of reform. Vietnam must learn from them without allowing foreign powers to dictate its future."

 VIN_Ho_Chi_Minh_Promises:0 "Ho Chí Minh's Promises"
 VIN_Ho_Chi_Minh_Promises_desc:0 "Ho Chí Minh's moral authority can reassure a frightened public. Promises of restraint, legality, and consultation must be made credible through action."

 VIN_Double_Down_on_De_Stalinzation:0 "Deepen De-Stalinization"
 VIN_Double_Down_on_De_Stalinzation_desc:0 "A partial break with the old methods will not be enough. The Party will pursue a deeper renewal of institutions, leadership, and political practice."

 VIN_Agreement_for_Democracy:0 "Agreement for Democracy"
 VIN_Agreement_for_Democracy_desc:0 "A negotiated democratic settlement can preserve the revolution while widening its social base. The goal is reform without national fragmentation."

 VIN_Cultural_Liberalization:0 "Cultural Liberalization"
 VIN_Cultural_Liberalization_desc:0 "Writers, scholars, and artists will be granted a wider space to experiment and criticize. Cultural confidence is a sign of a secure rather than a weak state."

 VIN_People_Speak_We_Listen:0 "The People Speak, We Listen"
 VIN_People_Speak_We_Listen_desc:0 "The Party will create channels for grievances and criticism. A government that listens can correct its failures before they become a crisis."

 VIN_The_New_Poetry_Movement:0 "The New Poetry Movement"
 VIN_The_New_Poetry_Movement_desc:0 "New literary voices can express the hopes and strains of a changing society. Rather than suppress them, the revolution will invite them into public life."

 VIN_Two_Thousand_Years_of_History:0 "Two Thousand Years of History"
 VIN_Two_Thousand_Years_of_History_desc:0 "Vietnamese socialism must be rooted in more than imported doctrine. Our long history of resistance and statecraft gives the revolution a distinctly national foundation."

 VIN_Across_the_Spectrum:0 "Across the Spectrum"
 VIN_Across_the_Spectrum_desc:0 "The national community includes many political traditions. A broader public culture can help reconcile them under the shared goal of Vietnamese independence."

 VIN_Let_Hundred_Thoughts_Contend:0 "Let Hundred Thoughts Contend"
 VIN_Let_Hundred_Thoughts_Contend_desc:0 "Debate among many schools of thought can sharpen policy and prevent intellectual stagnation. The state will encourage contention within the bounds of national independence."

 VIN_Land_Reform_Du_Luat_197_HL:0 "Land Reform Decree No. 197-HL"
 VIN_Land_Reform_Du_Luat_197_HL_desc:0 "Land reform will break the social foundations of colonial rule and landlord power. Its success depends on distributing land fairly without destroying the villages it is meant to liberate."

 VIN_Follow_Maos_Advice:0 "Follow Mao's Advice"
 VIN_Follow_Maos_Advice_desc:0 "China's revolutionary experience offers a forceful model of class struggle and rural transformation. We will adopt its lessons in the belief that speed and resolve are essential."

 VIN_Nghi_Quyet_So_09_NQ_TW:0 "Resolution No. 09-NQ/TW"
 VIN_Nghi_Quyet_So_09_NQ_TW_desc:0 "The Party will codify a more radical program for transforming the countryside. Cadres must carry the revolution into every village and household."

 VIN_Speed_Up_Communization_Reform:0 "Accelerate the Socialist Transformation"
 VIN_Speed_Up_Communization_Reform_desc:0 "The transition to socialism will be accelerated through collective organization and tighter control over rural production. The risks are high, but delay may strengthen old interests."

 VIN_The_Next_Step_of_Revolution:0 "The Next Step of Revolution"
 VIN_The_Next_Step_of_Revolution_desc:0 "After redistributing land, the Party must decide how far to reshape social and economic life. The next phase will determine the character of Vietnamese socialism."

 VIN_Follow_a_Flexible_Path:0 "Follow a Flexible Path"
 VIN_Follow_a_Flexible_Path_desc:0 "Vietnamese conditions differ from those of larger socialist states. A more gradual and pragmatic course may preserve rural stability while still advancing social justice."

 VIN_Permit_Class_Collaborations:0 "Permit Class Collaborations"
 VIN_Permit_Class_Collaborations_desc:0 "Not every non-proletarian interest must be treated as an enemy. Limited cooperation with smallholders and patriotic business interests may ease the transition."

 VIN_Decrease_Collectivization_Process:0 "Slow the Collectivization Drive"
 VIN_Decrease_Collectivization_Process_desc:0 "Coercive collectivization can alienate the people it claims to serve. Slowing the pace will allow institutions to mature and rural confidence to recover."

 VIN_A_Bountiful_Harvest:0 "A Bountiful Harvest"
 VIN_A_Bountiful_Harvest_desc:0 "Agricultural policy must ultimately feed the people and sustain the revolution. Improved incentives and practical support can turn reform into visible prosperity."

 VIN_The_Commissar:0 "The Commissar"
 VIN_The_Commissar_desc:0 "Political leadership within the armed forces must be carried by trusted cadres. The commissar represents the Party's will at the point of command."

 VIN_Our_Southern_Comrade:0 "Our Southern Comrade"
 VIN_Our_Southern_Comrade_desc:0 "The southern movement remains a core part of the national revolution. Its representatives must have a voice in strategy, organization, and the future of reunification."

 VIN_The_Peoples_General:0 "The People's General"
 VIN_The_Peoples_General_desc:0 "Military authority must remain inseparable from popular legitimacy. A commander who embodies the people's struggle can unite the army and the nation."

 VIN_The_Face_of_the_Party:0 "The Face of the Party"
 VIN_The_Face_of_the_Party_desc:0 "The Party needs a public figure capable of communicating its purpose beyond closed meetings and internal directives. Leadership must be visible as well as effective."

 VIN_A_Radical_Choice:0 "A Radical Choice"
 VIN_A_Radical_Choice_desc:0 "The coming decision will determine whether Vietnam's revolution emphasizes rapid transformation, broad national unity, or a balance between the two."

 VIN_Preparation_for_Industrialization:0 "Preparation for Industrialization"
 VIN_Preparation_for_Industrialization_desc:0 "National independence will remain fragile without an industrial base. The state must prepare the institutions, workers, and resources needed for a long development drive."

 VIN_The_Geneva_Peace_Conference:0 "The Geneva Peace Conference"
 VIN_The_Geneva_Peace_Conference_desc:0 "The conflict has reached a diplomatic crossroads. At Geneva, Vietnam must weigh territorial gains, international recognition, and the risks of an unfinished war."

 VIN_A_Failed_State:0 "A Failed State"
 VIN_A_Failed_State_desc:0 "The failure of a rival administration can create a dangerous vacuum. Vietnam must be ready to prevent disorder from becoming foreign intervention or renewed colonial control."

 VIN_Accept_French_Three_Vietnam_Federal_Scheme:0 "Accept the French Three-Vietnam Federal Scheme"
 VIN_Accept_French_Three_Vietnam_Federal_Scheme_desc:0 "A federal compromise may end immediate bloodshed, but it risks institutionalizing Vietnam's division. We must decide whether temporary peace justifies that price."

 VIN_Accept_Temporary_Partitions:0 "Accept Temporary Partitions"
 VIN_Accept_Temporary_Partitions_desc:0 "A temporary partition may buy time for reconstruction and political consolidation. Yet every provisional border carries the danger of becoming permanent."

 VIN_Preparation_for_Reunification_Election:0 "Preparation for Reunification Election"
 VIN_Preparation_for_Reunification_Election_desc:0 "A national vote could settle the question of legitimacy without another war. Organization, propaganda, and international guarantees will be essential."

 VIN_The_Election_is_Cancelled:0 "The Election is Cancelled"
 VIN_The_Election_is_Cancelled_desc:0 "When reunification by ballot is blocked, the political struggle enters a more dangerous phase. The Party must decide how to answer a broken promise."

 VIN_Begin_the_Charles_de_Gaulle_Talks:0 "Begin the Charles de Gaulle Talks"
 VIN_Begin_the_Charles_de_Gaulle_Talks_desc:0 "French political change may create a narrow opening for a negotiated settlement. Direct contact with de Gaulle could alter the future of Vietnam."

 VIN_Preparation_for_the_Liberation_of_the_South:0 "Preparation for the Liberation of the South"
 VIN_Preparation_for_the_Liberation_of_the_South_desc:0 "If peaceful reunification is denied, the south must be prepared for a renewed national-liberation struggle. Political organization will be as important as armed force."

 VIN_Reunification_of_Vietnams:0 "The Reunification of Vietnam"
 VIN_Reunification_of_Vietnams_desc:0 "The division of the country has ended. The task now is to unite institutions, economies, and communities after years of war and separation."

 VIN_Total_Victory:0 "Total Victory"
 VIN_Total_Victory_desc:0 "Military victory secures the revolution, but it also creates immense obligations. We must govern the whole country, reconcile its people, and turn liberation into a durable peace."

 VIN_Proclaim_the_Indochinese_Federation:0 "Proclaim the Indochinese Federation"
 VIN_Proclaim_the_Indochinese_Federation_desc:0 "The revolutionary struggle has crossed the borders imposed by colonialism. A federated Indochina would coordinate defense, development, and political solidarity across the region."

 VIN_Dai_Hoi_III:0 "The Third Party Congress"
 VIN_Dai_Hoi_III_desc:0 "The Third Party Congress will set the course for a reunified and rebuilding Vietnam. It must balance socialist transformation with the needs of a society exhausted by war."

 VIN_Promote_Tu_Cung_Tu_Cap:0 "Promote Self-Sufficiency"
 VIN_Promote_Tu_Cung_Tu_Cap_desc:0 "Self-sufficiency will reduce dependence on fragile foreign supply lines. Local production and disciplined use of resources can sustain the country through reconstruction."

 VIN_Repairing_Key_Infrastructures:0 "Repairing Key Infrastructures"
 VIN_Repairing_Key_Infrastructures_desc:0 "Roads, bridges, ports, and communications are the skeleton of national recovery. Repairing them first will allow every later development program to function."

 VIN_Expand_Hop_tac_xa_Thuy_Tinh-Dan_Chu:0 "Expand Democratic Cooperative Models"
 VIN_Expand_Hop_tac_xa_Thuy_Tinh-Dan_Chu_desc:0 "Cooperatives can pool labor, tools, and irrigation while preserving a meaningful role for local participation. We will expand them carefully as a model for socialist rural development."

 VIN_Incorporate_the_Tong_Lien_Doan_Lao_Dong:0 "Incorporate the General Confederation of Labour"
 VIN_Incorporate_the_Tong_Lien_Doan_Lao_Dong_desc:0 "Organized labor must be brought into the reconstruction effort. The General Confederation of Labour can coordinate workers, defend standards, and mobilize production."

 VIN_Begin_Domestic_Arms_Productions:0 "Begin Domestic Arms Production"
 VIN_Begin_Domestic_Arms_Productions_desc:0 "A revolution dependent entirely on foreign rifles remains vulnerable. Workshops and arsenals must begin producing the basic weapons and equipment of national defense."

 VIN_Promote_Thi_dua_San_Xuat:0 "Promote Production Emulation"
 VIN_Promote_Thi_dua_San_Xuat_desc:0 "Production campaigns can turn reconstruction into a mass movement. Workers and peasants will be encouraged to exceed targets through collective effort and patriotic competition."

 VIN_Mobilizing_the_Youth:0 "Mobilize the Youth"
 VIN_Mobilizing_the_Youth_desc:0 "Young people are the country's largest reserve of energy and talent. Youth organizations will be mobilized for education, construction, and national service."

 VIN_Repair_Colonial_Workshops:0 "Repair Colonial Workshops"
 VIN_Repair_Colonial_Workshops_desc:0 "Colonial workshops can be repurposed for Vietnamese development. Their machinery and skilled labor must be saved from decay and brought under national direction."

 VIN_Utilizing_Patriotic_Donations:0 "Mobilize Patriotic Donations"
 VIN_Utilizing_Patriotic_Donations_desc:0 "The nation can finance recovery through shared sacrifice. Voluntary contributions will demonstrate that reconstruction is a popular cause, not merely a government order."

 VIN_Collectivize_Viet_Gian_Properties:0 "Collectivize Collaborator Property"
 VIN_Collectivize_Viet_Gian_Properties_desc:0 "Property held by collaborators and war profiteers should serve the people rather than private enrichment. Its transfer will provide resources for reconstruction and social programs."

 VIN_Issue_Sac_Lenh_giam-to:0 "Issue the Tax-Reduction Decree"
 VIN_Issue_Sac_Lenh_giam-to_desc:0 "Tax relief can win public confidence and ease the burdens of recovery. The state will demonstrate that social policy is an essential part of national reconstruction."

 VIN_Relocate_Assets_to_Hanoi:0 "Relocate Assets to Hanoi"
 VIN_Relocate_Assets_to_Hanoi_desc:0 "The capital must once again serve as an administrative and industrial center. Recoverable assets will be concentrated where they can support national planning."

 VIN_Request_Economic_Aid_From_Socialist_Countries:0 "Request Economic Aid from Socialist Countries"
 VIN_Request_Economic_Aid_From_Socialist_Countries_desc:0 "The socialist world can provide machinery, credit, specialists, and markets. We will seek aid that strengthens Vietnam's independence rather than replacing one dependency with another."

 VIN_Request_Economic_Aid_From_America:0 "Request Economic Aid from America"
 VIN_Request_Economic_Aid_From_America_desc:0 "Pragmatic economic contacts with America may provide capital and technology that Vietnam cannot yet produce. Such assistance must never compromise national sovereignty."

 VIN_Implement_Financial_Reforms:0 "Implement Financial Reforms"
 VIN_Implement_Financial_Reforms_desc:0 "A stable currency and coherent public finances are prerequisites for reconstruction. The state must bring taxation, credit, and spending under a single national plan."

 VIN_Establish_the_National_Bank:0 "Establish the National Bank"
 VIN_Establish_the_National_Bank_desc:0 "A national bank will give the government the tools to manage credit, currency, and investment. Economic sovereignty begins with control over finance."

 VIN_Begin_Post_War_Reconstruction:0 "Begin Postwar Reconstruction"
 VIN_Begin_Post_War_Reconstruction_desc:0 "The war has left a damaged but liberated country. Reconstruction must now become the central task of the state, the Party, and the people."

 VIN_Rebuild_River_Levees_System:0 "Rebuild the River-Levee System"
 VIN_Rebuild_River_Levees_System_desc:0 "Flood control is a matter of national survival in the delta. Rebuilding levees will protect farms, towns, and the food supply from the next disaster."

 VIN_First_Phase_Towards_Socialism:0 "First Phase Towards Socialism"
 VIN_First_Phase_Towards_Socialism_desc:0 "The first phase of socialist construction will lay the foundations for a planned economy while preserving enough flexibility to restore daily life after war."

 VIN_Rebuild_Hai_Phong_Shipyard:0 "Rebuild Hai Phong Shipyard"
 VIN_Rebuild_Hai_Phong_Shipyard_desc:0 "Hai Phong's shipyards are essential to commerce, coastal defense, and industrial growth. Their revival will reconnect Vietnam to the sea."

 VIN_Expand_Bo_Ho_Electricity_Plant:0 "Expand the Bo Ho Power Plant"
 VIN_Expand_Bo_Ho_Electricity_Plant_desc:0 "Electricity is the force that turns workshops into industry and cities into modern centers of life. Expanding generation capacity will power the next stage of recovery."

 VIN_Electrify_Hong_River_Delta:0 "Electrify the Red River Delta"
 VIN_Electrify_Hong_River_Delta_desc:0 "The Red River Delta is Vietnam's demographic and agricultural heartland. Electrification will raise productivity and demonstrate the practical value of reconstruction."

 VIN_Electrify_Viet_Bac_and_Tay_Bac:0 "Electrify Viet Bac and Tay Bac"
 VIN_Electrify_Viet_Bac_and_Tay_Bac_desc:0 "The revolutionary highlands must not be left behind by development. Power infrastructure will bind remote regions more closely to the national economy."

 VIN_Form_Viet_Nam_Rail:0 "Form Vietnam Railways"
 VIN_Form_Viet_Nam_Rail_desc:0 "A unified railway administration can coordinate rolling stock, repair lines, and connect the country's regions. Rail will become a backbone of national planning."

 VIN_Rebuild_Quoc_Lo:0 "Rebuild the National Highways"
 VIN_Rebuild_Quoc_Lo_desc:0 "The national highways must be restored to move food, troops, machinery, and people. Reliable roads are indispensable to both defense and development."

 VIN_Rebuild_Ha_Noi-Lao_Cai_Rail_line:0 "Rebuild the Ha Noi-Lao Cai Railway"
 VIN_Rebuild_Ha_Noi-Lao_Cai_Rail_line_desc:0 "The Ha Noi-Lao Cai line links the capital to the northern frontier and its resources. Rebuilding it will strengthen trade and strategic mobility."

 VIN_Rebuild_Ha_Noi-Dong_Dang_Rail_line:0 "Rebuild the Ha Noi-Dong Dang Railway"
 VIN_Rebuild_Ha_Noi-Dong_Dang_Rail_line_desc:0 "The route to Dong Dang is Vietnam's principal rail connection to China. Its restoration will open a vital channel for trade, aid, and diplomacy."

 VIN_Modernize_Autonomous_Zones:0 "Modernize the Autonomous Zones"
 VIN_Modernize_Autonomous_Zones_desc:0 "Autonomous zones deserve investment rather than neglect. Industry, infrastructure, and public services can make national unity tangible in the highlands."

 VIN_Expand_Food_Production:0 "Expand Food Production"
 VIN_Expand_Food_Production_desc:0 "No development strategy can succeed while food remains insecure. The state will expand cultivation, storage, and rural support to feed a growing population."

 VIN_Promote_Khai_Hoang:0 "Promote Land Reclamation"
 VIN_Promote_Khai_Hoang_desc:0 "Uncultivated land can be made productive through irrigation, settlement, and collective labor. Land reclamation will expand the country's agricultural base."

 VIN_Open_Lao-Cai_Apatite_Mine:0 "Open the Lao Cai Apatite Mine"
 VIN_Open_Lao-Cai_Apatite_Mine_desc:0 "Lao Cai's apatite deposits can supply the fertilizer needed for agricultural modernization. Opening the mine will connect mineral wealth to rural prosperity."

 VIN_Emphasize_on_Agricultural_and_Light_Industries:0 "Prioritize Agriculture and Light Industry"
 VIN_Emphasize_on_Agricultural_and_Light_Industries_desc:0 "Vietnam's early development must build from its real strengths. Agriculture and light industry can provide food, employment, exports, and the capital for later heavy industry."

 VIN_Standardize_Irrigation_Systems:0 "Standardize Irrigation Systems"
 VIN_Standardize_Irrigation_Systems_desc:0 "Water management must be planned rather than left to local chance. Standardized irrigation will reduce crop risk and improve yields across the countryside."

 VIN_Promote_Tang_Gia_San_Xuat:0 "Promote Production Increases"
 VIN_Promote_Tang_Gia_San_Xuat_desc:0 "Production increases must become a national habit. Every workshop, cooperative, and household will be encouraged to contribute more to the common recovery."

 VIN_Reopen_Thai_Nguyen_Tea_Plantation:0 "Reopen the Thai Nguyen Tea Plantations"
 VIN_Reopen_Thai_Nguyen_Tea_Plantation_desc:0 "Thai Nguyen tea is both an agricultural asset and an export opportunity. Restoring the plantations will bring work and revenue to the region."

 VIN_Import_Soviet_Machineries:0 "Import Soviet Machinery"
 VIN_Import_Soviet_Machineries_desc:0 "Soviet machinery can accelerate a development process that would otherwise take decades. Technical assistance must be adapted carefully to Vietnam's conditions."

 VIN_Push_on_Nong_nghiep_Co_gioi:0 "Push Agricultural Mechanization"
 VIN_Push_on_Nong_nghiep_Co_gioi_desc:0 "Mechanization can reduce drudgery and expand the area farmers can cultivate. Tractors, pumps, and tools must be placed where they will yield the greatest benefit."

 VIN_Popularize_Modern_Agricultural_Methods:0 "Popularize Modern Agricultural Methods"
 VIN_Popularize_Modern_Agricultural_Methods_desc:0 "Modern seed, fertilizer, pest control, and cultivation methods can raise yields without waiting for full industrialization. Agricultural knowledge must reach every village."

 VIN_Study_Soviet_And_American_Agricultural_Methods:0 "Study Soviet and American Agricultural Methods"
 VIN_Study_Soviet_And_American_Agricultural_Methods_desc:0 "Vietnam should learn from every useful source. Comparing Soviet planning with American techniques can help build an approach suited to local soil, climate, and labor."

 VIN_Expand_Hop_tac_Xa_models:0 "Expand Cooperative Models"
 VIN_Expand_Hop_tac_Xa_models_desc:0 "Successful cooperatives should be reproduced across the country. Expansion must be organized enough to raise productivity but flexible enough to retain local confidence."

 VIN_Enforce_Doi_Song_Moi:0 "Enforce the New Way of Life"
 VIN_Enforce_Doi_Song_Moi_desc:0 "The New Way of Life links economic reconstruction to social transformation. Cleanliness, literacy, discipline, and public service are to become everyday civic habits."

 VIN_Reorganize_Colonial_Farmlands:0 "Reorganize Colonial Estates"
 VIN_Reorganize_Colonial_Farmlands_desc:0 "Colonial estates were designed for extraction rather than Vietnamese welfare. Reorganizing them will place land, labor, and output under national priorities."

 VIN_Rushing_Cong_Nghiepization_and_Hien_Dainization:0 "Accelerate Industrialization and Modernization"
 VIN_Rushing_Cong_Nghiepization_and_Hien_Dainization_desc:0 "Industrialization and modernization will be pursued with urgency. The state will concentrate investment in the sectors needed to transform Vietnam from a war-ravaged agrarian economy."

 VIN_Learn_From_Cholima_Movement:0 "Learn from the Chollima Movement"
 VIN_Learn_From_Cholima_Movement_desc:0 "The Chollima movement offers a model of rapid mobilization and industrial enthusiasm. Vietnam will adapt its lessons to overcome scarcity through collective effort."

 VIN_Rebuild_Hai_Phong_Cement_Factory:0 "Rebuild the Hai Phong Cement Factory"
 VIN_Rebuild_Hai_Phong_Cement_Factory_desc:0 "Cement is the material foundation of reconstruction. Reviving the Hai Phong works will supply roads, housing, dams, and factories throughout the country."

 VIN_Build_Hung_Yen_and_Bac_Ninh_Electronic_Assemblies:0 "Build Hung Yen and Bac Ninh Electronics Works"
 VIN_Build_Hung_Yen_and_Bac_Ninh_Electronic_Assemblies_desc:0 "Electronics assembly will introduce new technical skills and diversify Vietnam's industrial base. These plants can become nuclei for a more advanced economy."

 VIN_Build_Tai_Nguyen_Steel_and_Iron_Works:0 "Build the Thai Nguyen Steel and Iron Works"
 VIN_Build_Tai_Nguyen_Steel_and_Iron_Works_desc:0 "Steel production is essential to a sovereign industrial economy. The Thai Nguyen works will provide the metal needed for machinery, construction, and defense."

 VIN_Establish_Cong_Nghiep_Zones:0 "Establish Industrial Zones"
 VIN_Establish_Cong_Nghiep_Zones_desc:0 "Concentrated industrial zones can coordinate power, transport, labor, and investment. They will give national planning a clear geographic foundation."

 VIN_Rebuild_Nam_Dinh_Textile_Factory:0 "Rebuild the Nam Dinh Textile Factory"
 VIN_Rebuild_Nam_Dinh_Textile_Factory_desc:0 "The Nam Dinh textile works can provide employment and consumer goods while restoring a historic industrial center. Light industry will support both living standards and exports."

 VIN_Rebuild_Bach_mai-Phu_Bai_Airports:0 "Rebuild Bach Mai and Phu Bai Airfields"
 VIN_Rebuild_Bach_mai-Phu_Bai_Airports_desc:0 "Airfields at Bach Mai and Phu Bai will strengthen national communications, emergency response, and future air defense capabilities."

 VIN_COMECON_Integration:0 "Integrate with COMECON"
 VIN_COMECON_Integration_desc:0 "Deeper integration with COMECON can secure markets, machinery, and long-term planning partners. Vietnam must use this relationship to build capacity rather than dependency."

 VIN_Invite_Western_Companies:0 "Invite Western Companies"
 VIN_Invite_Western_Companies_desc:0 "Foreign firms can provide capital, technology, and managerial experience. Their presence must be regulated to ensure that development serves Vietnam rather than outside interests."

 VIN_Import_Foreign_Vehicles:0 "Import Foreign Vehicles"
 VIN_Import_Foreign_Vehicles_desc:0 "Imported vehicles can accelerate logistics, construction, and military mobility while domestic industry catches up with national needs."

 VIN_Modernize_Gia_Lam_Train_Company:0 "Modernize the Gia Lam Rail Works"
 VIN_Modernize_Gia_Lam_Train_Company_desc:0 "Gia Lam's rail workshops can become a center for repair and transport modernization. Better rolling stock will support trade, movement, and industrial planning."

 VIN_Chien_Thang_Automobile:0 "The Chien Thang Automobile"
 VIN_Chien_Thang_Automobile_desc:0 "A Vietnamese automobile program will symbolize the transition from dependence to domestic industrial capability. The Chien Thang project will begin that journey."

 VIN_Invite_Zastava_Specialist:0 "Invite Zastava Specialists"
 VIN_Invite_Zastava_Specialist_desc:0 "Yugoslav specialists can share practical experience in vehicle production and industrial organization. Their knowledge will help Vietnam avoid costly early mistakes."

 VIN_Research_Foreign_Designs:0 "Research Foreign Designs"
 VIN_Research_Foreign_Designs_desc:0 "Foreign vehicles and rail equipment provide valuable technical lessons. By studying them closely, Vietnamese engineers can adapt proven designs to local needs."

 VIN_First_Domestic_Car_Brand:0 "First Domestic Car Brand"
 VIN_First_Domestic_Car_Brand_desc:0 "A domestically produced car is more than a consumer good: it is proof that Vietnam can master complex manufacturing and build a modern industrial identity."

 VIN_Issue_Ao:0 "Issue Protective Equipment"
 VIN_Issue_Ao_desc:0 "The army needs basic protective equipment before it can sustain modern operations. Standardized clothing and field gear will improve survival, morale, and discipline."

 VIN_Chin_Tranh:0 "The Doctrine of People's War"
 VIN_Chin_Tranh_desc:0 "People's War turns the whole nation into a field of resistance. Military, political, economic, and cultural struggle must work together against a stronger enemy."

 VIN_Mass_Defectors:0 "Welcome Mass Defectors"
 VIN_Mass_Defectors_desc:0 "Soldiers and specialists leaving the enemy camp can bring experience, equipment, and valuable intelligence. The revolution must give them a path back into the nation."

 VIN_Equip_Cong_Binh:0 "Equip the Combat Engineers"
 VIN_Equip_Cong_Binh_desc:0 "Combat engineers will bridge rivers, clear obstacles, build defenses, and keep the army moving. Their equipment is an investment in both mobility and survival."

 VIN_Establish_Quan:0 "Establish the Quan Y Vien"
 VIN_Establish_Quan_desc:0 "A professional military medical academy will train doctors, surgeons, pharmacists, and medical cadres for the People's Army. Saving wounded soldiers is part of sustaining the war effort."

 VIN_Formalize_Tieu:0 "Formalize the Regular Divisions"
 VIN_Formalize_Tieu_desc:0 "Guerrilla formations must be reorganized into regular units capable of combined operations. Better structure, logistics, and communications will turn experience into lasting military power."

 VIN_Sign_Sac_17:0 "Sign Decree No. 17/SL"
 VIN_Sign_Sac_17_desc:0 "Decree No. 17/SL will define the military regions and clarify their responsibilities. A dispersed war requires a coherent territorial command system."

 VIN_Expand_Viet_Bac_Guerilla_Networks:0 "Expand the Viet Bac Guerrilla Networks"
 VIN_Expand_Viet_Bac_Guerilla_Networks_desc:0 "The Viet Bac base area must remain a living network of local resistance. Village cadres, scouts, and militia will make occupation costly for any enemy."

 VIN_Establish_Tong:0 "Re-Establish the Tổng Quan Ủy"
 VIN_Establish_Tong_desc:0 "The Tổng Quan Ủy will restore the Party's highest organ of military leadership. Strategy, force development, and political control must be coordinated at the national level."

 VIN_Found_the_Cuc_Quan_Bao_Intelligence_Branch:0 "Found the Cục Quan Bao Intelligence Branch"
 VIN_Found_the_Cuc_Quan_Bao_Intelligence_Branch_desc:0 "Accurate information can compensate for shortages of men and material. A centralized military intelligence branch will track enemy movements and protect the army from infiltration."

 VIN_Sign_Sac_50:0 "Sign Decree No. 50/SL"
 VIN_Sign_Sac_50_desc:0 "Decree No. 50/SL will formalize the Ministry of National Defense and the Commander-in-Chief's supporting agencies. The armed struggle needs a state structure equal to its ambitions."

 VIN_Utilizing_Chien:0 "Utilize the Chien Si Viet Nam Moi"
 VIN_Utilizing_Chien_desc:0 "The Chien Si Viet Nam Moi offer manpower and experience outside the conventional army structure. Their service can expand the revolution's operational reach."

 VIN_Raiding_CEFEO_Arsenals:0 "Raid CEFEO Arsenals"
 VIN_Raiding_CEFEO_Arsenals_desc:0 "Enemy arsenals hold weapons that Vietnam cannot yet manufacture in sufficient numbers. Carefully planned raids can turn occupation stockpiles into revolutionary strength."

 VIN_Smuggling_Weapons:0 "Smuggling Weapons"
 VIN_Smuggling_Weapons_desc:0 "Border routes and clandestine networks can bring in rifles, vehicles, and ammunition. Every successful shipment makes the resistance more difficult to isolate."

 VIN_Expand_Binh_Cong_xuong:0 "Expand the Binh Cong Xuong"
 VIN_Expand_Binh_Cong_xuong_desc:0 "Field workshops and dispersed armories will repair weapons, produce simple equipment, and keep the army supplied even under pressure."

 VIN_Sign_Sac_121:0 "Sign Decree No. 121/SL"
 VIN_Sign_Sac_121_desc:0 "Decree No. 121/SL will clarify the relationship between the General Staff, political organs, supply services, and inspections. A growing army requires a modern command system."

 VIN_Employ_Tran:0 "Employ Tran Dai Nghia"
 VIN_Employ_Tran_desc:0 "Vietnam's scientists and engineers must be placed at the service of national defense. Tran Dai Nghia's expertise can connect wartime necessity with indigenous innovation."

 VIN_Mimic_French:0 "Study French Weapons Design"
 VIN_Mimic_French_desc:0 "French equipment offers a practical model for immediate standardization. Studying and reproducing it can improve supply compatibility while the domestic arms industry matures."

 VIN_Maintain_Domestic_Weapon_Programs:0 "Maintain Domestic Weapon Programs"
 VIN_Maintain_Domestic_Weapon_Programs_desc:0 "Foreign models are useful, but dependence is dangerous. Vietnam must preserve the capacity to design and build weapons according to its own needs."

 VIN_Plan_Large:0 "Plan Large-Scale Campaigns"
 VIN_Plan_Large_desc:0 "The army must prepare for campaigns that go beyond scattered raids. Coordinated operations can seize the initiative and demonstrate that the resistance is becoming a conventional force."

 VIN_Thap_Van_Dai:0 "The Thap Van Dai Son Campaign"
 VIN_Thap_Van_Dai_desc:0 "Operations in the Thap Van Dai Son region can open routes, test new formations, and strengthen links with friendly forces beyond the border."

 VIN_Operation_Cao-Bac:0 "The Cao-Bac-Lang Campaign"
 VIN_Operation_Cao-Bac_desc:0 "The Cao-Bac-Lang frontier offers opportunities to strike isolated positions and secure strategic corridors. A successful campaign will strengthen the northern base."

 VIN_Autumn_Winter:0 "The Autumn-Winter Campaign"
 VIN_Autumn_Winter_desc:0 "The seasonal campaign will test whether the People's Army can coordinate its growing forces under difficult weather and supply conditions."

 VIN_Northwest:0 "The Northwest Campaign"
 VIN_Northwest_desc:0 "The northwest must be brought more firmly into the national struggle. Operations there can secure highland routes and broaden support among frontier communities."

 VIN_Liberate_Duyen:0 "Liberate Duyen Hai"
 VIN_Liberate_Duyen_desc:0 "Liberating Duyen Hai will deny the enemy local bases and open new paths for revolutionary administration and supply."

 VIN_Prepare_Dien:0 "Prepare for Dien Bien Phu"
 VIN_Prepare_Dien_desc:0 "A decisive battle may be possible if the enemy can be isolated in the uplands. Every road, depot, artillery piece, and political cadre must be prepared for the coming test."

 VIN_Implement_Vo:0 "Implement General Giap's Reforms"
 VIN_Implement_Vo_desc:0 "General Giap's reforms will combine guerrilla flexibility with concentrated regular operations. Political education, logistics, and command discipline must advance together."

 VIN_Establish_Ban_Khong:0 "Establish the Air Force Research Bureau"
 VIN_Establish_Ban_Khong_desc:0 "Vietnam has no operational air force yet, but it must begin learning how to defend its skies. The research bureau will preserve knowledge, train specialists, and plan for the future."

 VIN_Establish_Ban_Thuy:0 "Establish the Naval Research Committee"
 VIN_Establish_Ban_Thuy_desc:0 "Rivers, coasts, and islands are strategic frontiers. The naval research committee will rebuild the technical and organizational foundations of a future revolutionary navy."

 VIN_Promote_Revolutionary_Patriotism:0 "Promote Revolutionary Patriotism"
 VIN_Promote_Revolutionary_Patriotism_desc:0 "Patriotism gives the people a reason to endure sacrifice. Political work will connect local defense and personal hardship to the larger cause of national liberation."

 VIN_Expand_the_300th_Dac_Cong_Command_Unit:0 "Expand the 300th Dac Cong Unit"
 VIN_Expand_the_300th_Dac_Cong_Command_Unit_desc:0 "Special operations units can strike where conventional formations cannot. Expanding the 300th Dac Cong unit will deepen Vietnam's capacity for infiltration and sabotage."

 VIN_Other_Arms:0 "The Other Arms of the Revolution"
 VIN_Other_Arms_desc:0 "The revolution relies on more than the regular army. Air, naval, security, engineering, and militia services must all be developed as parts of a single defense system."

 VIN_Equip_Nha_Cong:0 "Equip the People's Public Security"
 VIN_Equip_Nha_Cong_desc:0 "The People's Public Security will defend the revolution against espionage, sabotage, and organized subversion. Security work must be integrated with popular legitimacy."

 VIN_Mass_Expansion:0 "Expand the People's Militia"
 VIN_Mass_Expansion_desc:0 "A wider militia system can put local defense in every village and workplace. The people themselves will become the first line of national security."

 VIN_Our_Position_in_the_New_Order:0 "Our Position in the New Order"
 VIN_Our_Position_in_the_New_Order_desc:0 "The postwar order is being decided by powers far larger than Vietnam. We must define a diplomatic position that protects our independence while winning the partners we need."

 VIN_The_Quest_for_UN_Recognition:0 "The Quest for UN Recognition"
 VIN_The_Quest_for_UN_Recognition_desc:0 "International recognition would strengthen Vietnam's legal claim to sovereignty and make it harder for foreign powers to treat the republic as a temporary insurgency."

 VIN_Eyes_Upon_the_World:0 "Eyes Upon the World"
 VIN_Eyes_Upon_the_World_desc:0 "Vietnam's future will be shaped by events far beyond Indochina. A more capable diplomatic service must watch the world and identify opportunities before they pass."

 VIN_Revisit_Sainteny_Line:0 "Revisit the Sainteny Line"
 VIN_Revisit_Sainteny_Line_desc:0 "The Sainteny agreements remain a point of reference for any discussion with France. Revisiting them may reveal whether a negotiated relationship is still possible."

 VIN_Our_Socialist_Brothers:0 "Our Socialist Brothers"
 VIN_Our_Socialist_Brothers_desc:0 "The socialist states share Vietnam's opposition to colonialism, though their interests are not identical to ours. We will seek solidarity without becoming a mere client."

 VIN_Meeting_with_Tito:0 "Meeting with Tito"
 VIN_Meeting_with_Tito_desc:0 "Yugoslavia offers an example of socialist independence outside rigid bloc discipline. A meeting with Tito can broaden Vietnam's diplomatic options."

 VIN_Non_Alignment_Commitment:0 "A Commitment to Non-Alignment"
 VIN_Non_Alignment_Commitment_desc:0 "Vietnam will cultivate relations with the emerging non-aligned world. Independence from great-power control can become a source of strength rather than isolation."

 VIN_Licenses_from_Zavasta:0 "Licenses from Zastava"
 VIN_Licenses_from_Zavasta_desc:0 "Industrial cooperation with Zastava can provide Vietnam with useful manufacturing techniques while strengthening ties with Yugoslavia."

 VIN_Eastern_Bloc_Embasses_in_Hanoi:0 "Eastern Bloc Embassies in Hanoi"
 VIN_Eastern_Bloc_Embasses_in_Hanoi_desc:0 "Embassies make solidarity concrete. A larger Eastern Bloc presence in Hanoi will improve communication, trade, technical exchange, and political support."

 VIN_Uncle_Hos_Eastern_Bloc_Tour:0 "Uncle Ho's Eastern Bloc Tour"
 VIN_Uncle_Hos_Eastern_Bloc_Tour_desc:0 "Ho Chí Minh's visit will present Vietnam's struggle directly to the governments and peoples of Eastern Europe. Personal diplomacy can secure commitments that papers alone cannot."

 VIN_Cooperate_with_COMECON:0 "Cooperate with COMECON"
 VIN_Cooperate_with_COMECON_desc:0 "COMECON membership would connect Vietnam to a wider system of socialist trade, planning, and technical aid. It offers resources for development but also deeper obligations."

 VIN_New_Order_in_Indochina:0 "A New Order in Indochina"
 VIN_New_Order_in_Indochina_desc:0 "The end of colonial rule has left Indochina politically unsettled. Vietnam must choose whether to pursue cooperation, influence, or revolutionary transformation across the region."

 VIN_Land_of_a_Million_Elephants:0 "The Land of a Million Elephants"
 VIN_Land_of_a_Million_Elephants_desc:0 "Laos is central to the strategic geography of Indochina. Its mountains, river valleys, and divided politics will shape Vietnam's security for decades."

 VIN_Promote_Laotian_Peaceful_Coalition:0 "Promote a Peaceful Laotian Coalition"
 VIN_Promote_Laotian_Peaceful_Coalition_desc:0 "A broad coalition in Laos could reduce conflict while giving progressive forces a path into government. Peaceful influence may achieve more than immediate confrontation."

 VIN_Infilitrate_Laos_Parliament:0 "Infiltrate the Laotian Parliament"
 VIN_Infilitrate_Laos_Parliament_desc:0 "Legal politics can be used to build a revolutionary foothold. Cadres and sympathizers will work inside Laotian institutions to expand the left's influence."

 VIN_Rearm_the_Pathet_Lao:0 "Rearm the Pathet Lao"
 VIN_Rearm_the_Pathet_Lao_desc:0 "Political influence without armed protection is fragile. The Pathet Lao require weapons, training, and logistical support to survive a hostile regional balance."

 VIN_Start_the_Ho_Chi_Minh_Trail_Project:0 "Begin the Ho Chí Minh Trail Project"
 VIN_Start_the_Ho_Chi_Minh_Trail_Project_desc:0 "A secure route through Laos can connect the northern base areas to allied forces and future southern operations. It must be built before war makes it indispensable."

 VIN_Assasinate_Royalists:0 "Assassinate Royalist Leaders"
 VIN_Assasinate_Royalists_desc:0 "Removing key royalist figures would weaken the opposing camp, but it would also deepen the conflict and make reconciliation far more difficult."

 VIN_Ignite_the_Civil_War:0 "Ignite the Civil War"
 VIN_Ignite_the_Civil_War_desc:0 "The Laotian political struggle has reached a breaking point. Armed confrontation may secure a revolutionary victory, but it will bind Vietnam to a long and dangerous war."

 VIN_Land_of_Angkor:0 "The Land of Angkor"
 VIN_Land_of_Angkor_desc:0 "Cambodia's history, monarchy, and nationalist politics demand a distinct approach. Vietnam must decide whether to work through Phnom Penh or cultivate a revolutionary alternative."

 VIN_Contact_Khmer_Leftists_in_Parliament:0 "Contact Khmer Leftists in Parliament"
 VIN_Contact_Khmer_Leftists_in_Parliament_desc:0 "Khmer leftists inside the political system can serve as a bridge to broader revolutionary networks. Their influence must be developed quietly and patiently."

 VIN_Send_Back_Viet_Minh_Trained_Khmer_Communists:0 "Return Viet Minh-Trained Khmer Communists"
 VIN_Send_Back_Viet_Minh_Trained_Khmer_Communists_desc:0 "Khmer cadres trained by the Viet Minh can transform an underground movement into an organized force. Their return will carry both military experience and political expectations."

 VIN_Oranizing_quan_khu_in_Cambodia:0 "Organize Quan Khu in Cambodia"
 VIN_Oranizing_quan_khu_in_Cambodia_desc:0 "Regional revolutionary zones will give Khmer forces the structure needed to coordinate recruitment, training, and local administration."

 VIN_Take_Down_The_Royalists_and_Reactionaries:0 "Take Down The Royalists and Reactionaries"
 VIN_Take_Down_The_Royalists_and_Reactionaries_desc:0 "The revolutionary underground will turn its attention toward the pillars of the royalist order. Escalation may weaken the regime, but it also risks open conflict."

 VIN_Decleration_of_Khmer_Krahom:0 "The Declaration of Khmer Krahom"
 VIN_Decleration_of_Khmer_Krahom_desc:0 "A Cambodian revolutionary government will be proclaimed in defiance of the old order. Its survival will depend on rapid organization, armed defense, and Vietnamese support."

 VIN_Prepare_for_Thailands_Ambition:0 "Prepare for Thailand's Ambitions"
 VIN_Prepare_for_Thailands_Ambition_desc:0 "Thailand will not remain indifferent to revolutionary victories in Laos and Cambodia. We must prepare for border pressure, proxy warfare, and diplomatic containment."

 VIN_Reapproach_Sihanouk:0 "Reapproach Sihanouk"
 VIN_Reapproach_Sihanouk_desc:0 "Sihanouk's Cambodia may be a better partner than a battlefield. Renewed contact can reduce suspicion and preserve room for peaceful influence."

 VIN_Assure_Sihanouk_on_Abolishing_the_Indochina_Project:0 "Assure Sihanouk We Will End the Indochinese Project"
 VIN_Assure_Sihanouk_on_Abolishing_the_Indochina_Project_desc:0 "Cambodia fears that Vietnamese solidarity conceals Vietnamese domination. A public assurance can reduce those fears and create a basis for practical cooperation."

 VIN_Son_Ngoc_Minh_Sihanouk_Secret_Meeting:0 "The Son Ngoc Minh-Sihanouk Secret Meeting"
 VIN_Son_Ngoc_Minh_Sihanouk_Secret_Meeting_desc:0 "A private meeting can connect Cambodia's nationalist leadership with its revolutionary left. Quiet compromise may succeed where public declarations cannot."

 VIN_Sangkum:0 "Support the Sangkum"
 VIN_Sangkum_desc:0 "The Sangkum can be used as a broad political framework for Cambodian stability and gradual reform. Vietnam will support a path that avoids both reaction and collapse."

 VIN_Extend_HCM_Trail_in_Eastern_Cambodia:0 "Extend the Ho Chí Minh Trail into Eastern Cambodia"
 VIN_Extend_HCM_Trail_in_Eastern_Cambodia_desc:0 "Eastern Cambodia offers new routes for logistics and allied forces. Expanding the trail will improve regional mobility while deepening Vietnam's role in Cambodian affairs."

 VIN_The_Giant_in_the_North:0 "The Giant in the North"
 VIN_The_Giant_in_the_North_desc:0 "China's civil war will determine the balance of power on Vietnam's northern frontier. We must be ready for either a revolutionary ally or a hostile Nationalist state."

 VIN_Red_Sun_Over_China:0 "A Red Sun Over China"
 VIN_Red_Sun_Over_China_desc:0 "A communist victory in China transforms the strategic situation. Vietnam now has a powerful revolutionary neighbor, but friendship will bring expectations as well as support."

 VIN_Official_Visit_to_Beijing:0 "Official Visit to Beijing"
 VIN_Official_Visit_to_Beijing_desc:0 "An official visit to Beijing will establish direct political and military channels with the new Chinese leadership. The relationship must be built on solidarity and mutual respect."

 VIN_Ask_CCP_to_Follow_1895_Gerald_Convention:0 "Ask the CCP to Honor the 1895 Gérard Convention"
 VIN_Ask_CCP_to_Follow_1895_Gerald_Convention_desc:0 "Historic border arrangements remain sensitive even among allies. Vietnam will ask Beijing to affirm a clear legal basis for peaceful frontier relations."

 VIN_Recognize_PRC_Territorial_Integrity:0 "Recognize PRC Territorial Integrity"
 VIN_Recognize_PRC_Territorial_Integrity_desc:0 "Recognizing China's territorial integrity will signal that Vietnam seeks a stable partnership rather than opportunism along the shared border."

 VIN_Commitment_to_Asian_Revolution:0 "Commitment to Asian Revolution"
 VIN_Commitment_to_Asian_Revolution_desc:0 "Vietnam's revolution can support anti-colonial struggles across Asia through volunteers, training, material aid, and political coordination."

 VIN_Invite_JCP_to_Visit_Hanoi:0 "Invite the JCP to Hanoi"
 VIN_Invite_JCP_to_Visit_Hanoi_desc:0 "Hosting the Japanese Communist Party will strengthen links with one of Asia's most important underground movements and signal Vietnam's wider revolutionary role."

 VIN_Support_DPRK_Legitimacy:0 "Support DPRK Legitimacy"
 VIN_Support_DPRK_Legitimacy_desc:0 "Korea is a crucial front in the struggle over Asia's future. Supporting the DPRK will deepen solidarity with a fellow socialist state under pressure."

 VIN_Logisitical_Support_to_Malay_Communists:0 "Logistical Support for Malayan Communists"
 VIN_Logisitical_Support_to_Malay_Communists_desc:0 "The Malayan insurgency needs material support more than rhetoric. Discreet shipments can keep its cadres supplied without overexposing Vietnam."

 VIN_White_Sun_Over_China:0 "A White Sun Over China"
 VIN_White_Sun_Over_China_desc:0 "A Nationalist victory in China leaves Vietnam facing a powerful and suspicious northern neighbor. Survival will depend on diplomacy, restraint, and internal flexibility."

 VIN_Survival_Through_Diplomacy:0 "Survival Through Diplomacy"
 VIN_Survival_Through_Diplomacy_desc:0 "Vietnam must avoid giving the Nationalist government a pretext for intervention. Careful diplomacy may preserve the revolution even under an unfavorable regional order."

 VIN_Contact_Lu_Hen:0 "Contact Lu Han"
 VIN_Contact_Lu_Hen_desc:0 "Lu Han and his network may provide a channel into Nationalist China that bypasses the most hostile elements in Nanking."

 VIN_Backdoor_Talks_with_Li_Zongren:0 "Backchannel Talks with Li Zongren"
 VIN_Backdoor_Talks_with_Li_Zongren_desc:0 "Unofficial talks can test whether coexistence is possible before either government commits itself publicly. Discretion is the price of diplomatic experimentation."

 VIN_Establish_Chiang_Ho_Telegraph_Line:0 "Establish the Chiang-Ho Telegraph Line"
 VIN_Establish_Chiang_Ho_Telegraph_Line_desc:0 "A direct communication line can prevent misunderstandings from becoming crises. It will also give both governments a way to manage the border quietly."

 VIN_Extradite_Radical_CCP_Members_to_China:0 "Extradite Radical CCP Members to China"
 VIN_Extradite_Radical_CCP_Members_to_China_desc:0 "Handing over radical Chinese communists may win Nationalist trust, but it will alienate part of Vietnam's own revolutionary base. The choice is one of survival over solidarity."

 VIN_Negotiate_with_other_Nationalist_Parties:0 "Negotiate with Other Nationalist Parties"
 VIN_Negotiate_with_other_Nationalist_Parties_desc:0 "Vietnam's political system may need to accommodate non-communist nationalist currents. Broader participation can strengthen legitimacy at the cost of ideological certainty."

 VIN_A_Reformed_Nationalist_Front:0 "A Reformed Nationalist Front?"
 VIN_A_Reformed_Nationalist_Front_desc:0 "A new coalition could reconcile nationalists and communists under a reformed common government. Its success would depend on whether either side can accept compromise."

 VIN_Kunming_Conference:0 "Kunming Conference"
 VIN_Kunming_Conference_desc:0 "A high-level meeting in Kunming offers a chance to settle the terms of coexistence with Nationalist China. It may create a durable settlement—or expose irreconcilable aims."

 VIN_A_Failed_Conference:0 "A Failed Conference"
 VIN_A_Failed_Conference_desc:0 "Diplomacy has failed to resolve the basic conflicts between Hanoi and Nanking. Vietnam must now prepare for pressure, isolation, and possible confrontation."

 VIN_Stand_with_Asian_Socialist_Revolution:0 "Stand with the Asian Socialist Revolution"
 VIN_Stand_with_Asian_Socialist_Revolution_desc:0 "A Nationalist China does not erase the Chinese revolution; it drives it underground. Vietnam will become a sanctuary and partner for those continuing the struggle."

 VIN_Contact_Wang_Ming:0 "Contact Wang Ming"
 VIN_Contact_Wang_Ming_desc:0 "Wang Ming's network connects Vietnamese revolutionaries to Chinese communist veterans and surviving underground structures. Their experience can strengthen a common resistance."

 VIN_Welcome_PLA_and_CCP_Members_to_Vietnam:0 "Welcome PLA and CCP Members to Vietnam"
 VIN_Welcome_PLA_and_CCP_Members_to_Vietnam_desc:0 "Exiled PLA and CCP members can bring military skill, political experience, and links to the Chinese underground. Vietnam will offer them refuge and a role in the wider struggle."

 VIN_Mass_Anti_KMT_Propaganda:0 "Mass Anti-KMT Propaganda"
 VIN_Mass_Anti_KMT_Propaganda_desc:0 "The Kuomintang must be politically challenged as well as militarily contained. A sustained propaganda campaign can weaken its legitimacy among Chinese and Asian audiences."

 VIN_Yunnan_Leaflet_Campaign:0 "The Yunnan Leaflet Campaign"
 VIN_Yunnan_Leaflet_Campaign_desc:0 "Yunnan's borderlands are vulnerable to political agitation. Leaflets and clandestine networks can carry anti-KMT messages across a frontier that cannot be sealed completely."

 VIN_Fortify_the_Sino_Viet_Border:0 "Fortify the Sino-Vietnamese Border"
 VIN_Fortify_the_Sino_Viet_Border_desc:0 "A hostile China requires prepared defenses in the north. Fortifications will deny an invader an easy route into the Red River basin."

 VIN_Expand_Coastal_Fortifications:0 "Expand Coastal Fortifications"
 VIN_Expand_Coastal_Fortifications_desc:0 "Vietnam's coastline remains exposed to blockade and landing operations. Coastal defenses will help protect ports, population centers, and strategic infrastructure."

 VIN_PLA_PAVN_Military_Exchange:0 "PLA-PAVN Military Exchange"
 VIN_PLA_PAVN_Military_Exchange_desc:0 "Joint training will let Vietnamese and Chinese revolutionaries share doctrine, battlefield experience, and technical skills despite the loss of a mainland base."

 VIN_Fund_PLA_Sabotage_and_Skirmishes:0 "Fund PLA Sabotage and Skirmishes"
 VIN_Fund_PLA_Sabotage_and_Skirmishes_desc:0 "Small-scale operations can keep the Chinese revolutionary movement active and force the Nationalists to devote resources to an insecure frontier."

 VIN_Join_the_Asian_Liberation_Front:0 "Join the Asian Liberation Front"
 VIN_Join_the_Asian_Liberation_Front_desc:0 "Vietnam will formally align its military and political future with a broader Asian revolutionary coalition. This is a commitment to a regional struggle, not merely a bilateral alliance."

 VIN_Discuss_French_intentions:0 "Discuss French Intentions"
 VIN_Discuss_French_intentions_desc:0 "French policy toward Vietnam is changing, but its ultimate aims remain uncertain. We must determine whether Paris is seeking peace, influence, or a new form of control."

 VIN_Contact_Aurbrac_for_Information:0 "Contact Aubrac for Information"
 VIN_Contact_Aurbrac_for_Information_desc:0 "French intermediaries may provide insight into Parisian politics and de Gaulle's intentions. Personal channels can reveal what official statements conceal."

 VIN_Nguyen_Duy_Trinhs_Investigation:0 "Nguyen Duy Trinh's Investigation"
 VIN_Nguyen_Duy_Trinhs_Investigation_desc:0 "A careful inquiry will assess the risks and opportunities of renewed contact with France. Vietnam must negotiate from knowledge rather than hope."

 VIN_Initial_Neutral_Response:0 "An Initial Neutral Response"
 VIN_Initial_Neutral_Response_desc:0 "A measured response will keep diplomatic options open while avoiding premature concessions. Vietnam must show confidence without provoking unnecessary hostility."

 VIN_De_Gaulle_Ho_Chi_Minh_Telegraphs:0 "The de Gaulle-Ho Chí Minh Telegrams"
 VIN_De_Gaulle_Ho_Chi_Minh_Telegraphs_desc:0 "Direct messages between de Gaulle and Ho Chí Minh could open an unexpected channel. Their tone will determine whether further talks are possible."

 VIN_Cautious_with_De_Gaulle:0 "Remain Cautious with de Gaulle"
 VIN_Cautious_with_De_Gaulle_desc:0 "French goodwill may be temporary or tactical. We will avoid binding commitments until Paris demonstrates that it respects Vietnamese sovereignty."

 VIN_Recognize_De_Gaulles_Goodwill:0 "Recognize de Gaulle's Goodwill"
 VIN_Recognize_De_Gaulles_Goodwill_desc:0 "De Gaulle's overtures may provide an opening for a more independent French policy. Responding positively could reduce the risk of renewed confrontation."

 VIN_Unofficial_Meeting_in_Lysee:0 "An Unofficial Meeting at the Élysée"
 VIN_Unofficial_Meeting_in_Lysee_desc:0 "An unofficial conversation at the Élysée can explore possibilities that formal diplomacy cannot yet acknowledge. Both sides will test the limits of compromise."

 VIN_Manac_As_Vietnam_Unification_Mediator:0 "Mannac as a Vietnamese Unification Mediator"
 VIN_Manac_As_Vietnam_Unification_Mediator_desc:0 "A respected intermediary can turn vague goodwill into a concrete process for Vietnamese reunification. Mediation may offer a path around deadlocked great-power diplomacy."

 VIN_Take_Advantage_of_the_French_American_Rivalry:0 "Exploit the Franco-American Rivalry"
 VIN_Take_Advantage_of_the_French_American_Rivalry_desc:0 "Differences between Paris and Washington can give Vietnam leverage. We will seek concessions from France without becoming a pawn in a Western dispute."

 VIN_Assist_De_Gaulle_Gaining_SFIO_Trust:0 "Help de Gaulle Gain SFIO Trust"
 VIN_Assist_De_Gaulle_Gaining_SFIO_Trust_desc:0 "Helping de Gaulle build support among French socialists may make a settlement with Vietnam politically sustainable inside France."

 VIN_A_Missed_Opportunity:0 "A Missed Opportunity"
 VIN_A_Missed_Opportunity_desc:0 "Caution has preserved our freedom of action, but it may also have closed a rare diplomatic opening. Vietnam must now rely on its own strength."

 VIN_Affirm_Long_Term_Soviet_Support:0 "Affirm Long-Term Soviet Support"
 VIN_Affirm_Long_Term_Soviet_Support_desc:0 "A durable partnership with Moscow can provide the capital, machinery, and political protection needed for long-term socialist development."

 VIN_Bandung_Conference:0 "The Bandung Conference"
 VIN_Bandung_Conference_desc:0 "Bandung offers Vietnam a platform among newly independent states. We will present our struggle as part of a wider movement for anti-colonial sovereignty."

 VIN_Mediate_Laotian_Royalist_Communist_Conflict:0 "Mediate the Laotian Royalist-Communist Conflict"
 VIN_Mediate_Laotian_Royalist_Communist_Conflict_desc:0 "Vietnam will attempt to prevent Laos from becoming another battlefield of great-power competition. A settlement could secure the frontier more effectively than conquest."

 VIN_PAVN_ANL_Joint_Patrol:0 "PAVN-ANL Joint Patrols"
 VIN_PAVN_ANL_Joint_Patrol_desc:0 "Joint patrols can build trust between Vietnamese and Laotian forces while demonstrating that cooperation, not domination, is the basis of our relationship."

 VIN_Dong_Phouma_Communique:0 "The Dong-Phouma Communiqué"
 VIN_Dong_Phouma_Communique_desc:0 "A public communiqué can turn private talks into a framework for coexistence. Its language must reassure both royalist and revolutionary constituencies."

 VIN_Hope_for_Peace:0 "Hope for Peace"
 VIN_Hope_for_Peace_desc:0 "If the Laotian settlement holds, Indochina may finally escape the cycle of escalation. Vietnam will invest in peace while remaining prepared for its collapse."

 VIN_Mediate_Sino_Soviet_Conflict:0 "Mediate the Sino-Soviet Conflict"
 VIN_Mediate_Sino_Soviet_Conflict_desc:0 "The growing dispute between Beijing and Moscow threatens every socialist movement. Vietnam will attempt to preserve unity and prevent the conflict from dividing Asia."

 VIN_A_Concerning_Future_for_Global_Revolution:0 "A Concerning Future for Global Revolution"
 VIN_A_Concerning_Future_for_Global_Revolution_desc:0 "The fracture of the socialist camp cannot be ignored. Vietnam must decide whether to lean toward one center, remain a mediator, or defend an independent line."

 VIN_Prepare_for_the_Worst:0 "Prepare for the Worst"
 VIN_Prepare_for_the_Worst_desc:0 "A breakdown in coexistence with China demands practical preparation. The country must be ready for diplomatic isolation, border pressure, and military danger."

 VIN_Final_Steps_to_Mutual_Coexistence:0 "Final Steps Toward Mutual Coexistence"
 VIN_Final_Steps_to_Mutual_Coexistence_desc:0 "A successful settlement must be made durable through practical agreements. Peace will require commitments on borders, trade, and political restraint."

 VIN_Settle_Border_Issues:0 "Settle the Border Issues"
 VIN_Settle_Border_Issues_desc:0 "Unresolved borders are an invitation to future conflict. Concessions may be painful, but a clear frontier can secure the conditions for peaceful development."

 VIN_Hanoi_Nanjing_Trade_Agreement:0 "The Hanoi-Nanjing Trade Agreement"
 VIN_Hanoi_Nanjing_Trade_Agreement_desc:0 "Trade can turn political coexistence into a shared interest. A Hanoi-Nanjing agreement will link stability to markets, transport, and mutual economic benefit."

 VIN_A_Coming_Storm_for_China:0 "A Coming Storm for China"
 VIN_A_Coming_Storm_for_China_desc:0 "The Asian Liberation Front is preparing for a wider confrontation with the Nationalist regime. Vietnam must decide how far it is willing to go in the coming struggle."
