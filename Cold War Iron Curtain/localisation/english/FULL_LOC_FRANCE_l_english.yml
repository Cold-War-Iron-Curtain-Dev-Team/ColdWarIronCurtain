 SUPER_EVENT_WINTER_OF_1954_DESC:0 "In winter 1954, when the temperature fell below -15°C for a prolonged period, Abbé Pierre, a former resistance fighter and former MRP deputy, launched national media appeals for social solidarity to help the poor and the destitute. home in danger of freezing to death in complete social and media ignorance. This is the beginning of the "Insurrection of Goodness"."
 abbe_pierre.1.d:0 "My friends, come help ... A woman froze to death tonight at 3:00 AM, on the pavement of Sebastopol Boulevard, clutching the eviction notice which the day before had made her homeless... Each night, more than two thousand endure the cold, without food, without bread, more than one almost naked. To face this horror, emergency lodgings are not enough. Hear me; in the last three hours, two aid centers have been created: one under canvas at the foot of the Panthéon, on Montagne Sainte-Geneviève Street; the other in Courbevoie. They are already overflowing, we must open them everywhere. Tonight, in every town in France, in every quarter of Paris, we must hang out placards under a light in the dark, at the door of places where there are blankets, bunks, soup; where one may read, under the title 'Fraternal Aid Center', these simple words: 'If you sUnion et fraternité françaiseer, whoever you are, enter, eat, sleep, recover hope, here you are loved'. The forecast is for a month of harsh frosts. For as long as the winter lasts, for as long as the centers exist, faced with their brothers dying in poverty, all mankind must be of one will: the will to make this situation impossible. I beg of you, let us love one another enough to do it now. From so much pain, let a wonderful thing be given unto us: the shared spirit of France. Thank you! Everyone can help those who are homeless. We need, tonight, and at the latest tomorrow, five thousand blankets, three hundred big American tents, and two hundred catalytic stoves. Bring them quickly to the Hôtel Rochester, number ninety-two, la Boetie Street. The rendez-vous for volunteers and trucks to carry them: tonight at eleven, in front of the tent on Montagne Sainte-Geneviève. Thanks to you, no man, no child, will sleep on the asphalt or on the waterfronts of Paris tonight"
