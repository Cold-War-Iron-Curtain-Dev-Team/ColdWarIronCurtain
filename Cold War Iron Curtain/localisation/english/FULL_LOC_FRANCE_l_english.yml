 FRA_Indochina_War_category_desc:0 "The Indochina War\n\nAfter a long campaign of resistance against the French and the Japanese, Viet Minh forces had claimed a victory (the August Revolution) after Japanese and Vichy French forces surrendered in the North on 15 August 1945.\n\nIn the War in Vietnam, British forces temporarily occupied the South, starting from 13 September 1945, only to restore French colonial control in 1946. In the United Nations, and through their alliance with the United Kingdom and the United States, the French demanded return of their former Indochina colony prior to agreeing to participate in the NATO alliance opposing Soviet expansion beyond the countries of the Komintern in the Cold War.\n\nThe communist Viet Minh, whom the Allies had supported during World War II, continued fighting the French with support from Communist China and the Soviet Union."
