 FRA_bombers_desc:0 "We need new bombers"
 FRA_bomb_strat:0 "Strategic Bombing"
 FRA_bomb_strat_desc:0 "Strategic bombing of key locations is the key of victory"
 FRA_airbase_development:0 "Airbase Development"
