 #event
  dutch_east_indies_war.2.d: "The sudden death of Lieutenant General Simon Hendrik Spoor came as a shock to the Dutch military establishment. As the Commander of the Royal Netherlands East Indies Army, Spoor had been instrumental in directing the Dutch military operations during the height of the conflict in Indonesia. His presence commanded authority; his strategies shaped the course of the Dutch effort to reassert colonial control. His death in Batavia was abrupt, occurring just as tensions remained high and negotiations uncertain. For the Dutch, it was more than the loss of a commander—it was the loss of a guiding force amid a war slipping increasingly out of their grasp.\n\nFrom the Indonesian perspective, Spoor's passing signaled a crack in the Dutch campaign. Though not celebrated, it was received with a quiet understanding that one of the Republic's most capable adversaries had been removed from the equation. His absence left a leadership vacuum, sowing hesitation and disarray in an already strained Dutch position."
  dutch_east_indies_war.2.a: "Rest in Peace"
  dei_death_tt: "§YWith his death, the dream of reasserting our control goes with him to the grave.§!"
 #natspit

  WPA_Legacy_of_VOC: "Legacy of the United East India Company"
  WPA_Legacy_of_VOC_desc: "As the Dutch East Indies approached a significant political transition, the legacy of the Vereenigde Oost-Indische Compagnie (VOC) remained a defining feature of the region. Though the VOC had been dissolved in 1799, its foundations in trade, governance, and infrastructure continued to shape the archipelago. The Dutch colonial administration that followed maintained and expanded upon many of the VOC’s structures, ensuring stability and economic growth.\n\nMany of the region’s key cities, including Batavia (Jakarta), Surabaya, and Semarang, originated as VOC trading hubs and expanded into major centers of commerce and administration. Roads, railways, and ports, originally designed to facilitate trade under the VOC, had since been modernized and expanded under Dutch governance. These developments strengthened connectivity within the archipelago and reinforced its position as a critical economic center in Southeast Asia."
  WPA_The_Jewels_of_Asia: "The Jewels of Asia"
  WPA_The_Jewels_of_Asia_desc: "For centuries, the Dutch East Indies stood as the crown jewel of Southeast Asia, a region of immense wealth, strategic importance, and unrivaled natural beauty. Renowned for its abundant resources, flourishing trade networks, and pivotal role in global commerce, the archipelago became the centerpiece of Dutch overseas enterprise. Despite the political shifts taking place, the Dutch East Indies remained one of the most valuable and developed territories in the region, a legacy built over centuries of economic and administrative investment.\n\nThe Dutch East Indies are blessed with unparalleled natural riches. Vast plantations of coffee, sugar, tea, tobacco, and rubber fueled a thriving export economy, while its reserves of oil, tin, and coal made it a key industrial power in Asia. The fertile lands of Java, the spice-producing islands of the Moluccas, and the resource-rich regions of Sumatra and Borneo ensured that the archipelago remained an essential hub in the global supply chain.\n\nThe economy is among the strongest in the region, supported by modern plantation systems, transportation networks, and port facilities that rivaled those of the world’s leading economies. Dutch investment in industry and infrastructure made the colony not just a source of raw materials but also a well-organized economic powerhouse, crucial to European markets."
  WPA_Unpopular_War: "The Unpopular War"
  WPA_Unpopular_War_desc: "After World War II, the Dutch sought to restore order in the East Indies, which had suffered under Japanese occupation. The sudden declaration of independence in August 1945 was seen as disruptive, lacking a formal agreement, and risking economic collapse and lawlessness.\n\nRather than rejecting change, the Netherlands pursued a federated model, offering autonomy while maintaining cooperation. Agreements like Linggadjati aimed for compromise, but conflicts persisted. The Politionele Acties were framed as necessary to restore stability, but growing international pressure, particularly from the U.S. and U.N., forced a shift in Dutch policy."

  #focus desc
  WPA_the_crown_set_foot_in_the_nusantara_desc: "The Dutch East Indies was at a crossroads. After years of investment in infrastructure, governance, and economic development, the Netherlands faced a rapidly changing political landscape. The region, long considered a vital part of the Dutch global economy, was experiencing instability due to the Indonesian National Revolution. While Dutch efforts aimed to restore order and implement a structured political transition, growing international pressure and ongoing conflict made a negotiated resolution inevitable."
  #ppl desc
  POLITICS_VAN_EECHOUD_DESC: "Jan Pieter Karel van Eechoud, a Governor, politician, pilot, and police officer, holds multiple professions, and currently serves as the Governor of Dutch New Guinea.\n\nBorn in 1904 in Horst, Netherlands, Eechoud attended Kolese Kanisius Nijmegen. In 1929, he went to the Dutch East Indies to work as a police officer in Sukabumi. During WW2, he was sent to Australia to be an intelligent officer.\n\nUpon his return, Eechoud became the resident and administrator for New Guinea. He wanted Dutch New Guinea to develop itself as a separate colony independent of the Dutch East Indies. Eechoud argued that the culture in Papua was so primitive and diverse that the region should be excluded from decolonization. The Dutch must educate the Papuans first and for a long time, otherwise non-Papuans will flood Papua and drown out all Papuan culture."

