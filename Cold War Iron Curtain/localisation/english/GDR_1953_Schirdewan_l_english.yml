l_english: 

 GDR_First_Secretary_Schirdewan: "First Secretary Schirdewan"
 GDR_First_Secretary_Schirdewan_desc: "Karl Schirdewan has managed to wrestle leadership of the GDR from Walter Ulbricht; it is time to formally recognize him as our new First Secretary."
 GDR_Ending_the_New_Inquisition: "Ending the New Inquisition"
 GDR_Ending_the_New_Inquisition_desc: "The Ulbricht government has garnered a reputation for its overzealous purging. It is clear that we must limit our use of this tactic in order to put the people at ease."
 GDR_Launch_A_Campaign_Against_Political_Decadence: "Campaign Against Political Decadence"
 GDR_Launch_A_Campaign_Against_Political_Decadence_desc: "The decadence on display by the political class is unbecoming of the socialist system! This must be rectified."
 GDR_Eliminate_the_Personality_Cult: "Eliminate the Personality Cult"
 GDR_Eliminate_the_Personality_Cult_desc: "Ulbricht has spent years and resources on building an absurd cult of personality around him, we'd better dismantle it before things get out of hand."
 GDR_Investigate_Political_Corruption: "Investigate Political Corruption"
 GDR_Investigate_Political_Corruption_desc: "Evidence of corruption within the Party can no longer be ignored. Those who are out to enrich themselves have to future in the GDR."
 GDR_Purge_The_Red_Guillotine: "Purge the Red Guillotine"
 GDR_Purge_The_Red_Guillotine_desc: "Hilde Benjamin is out of line and out of control. We have no choice but to purge her from the Party."
 GDR_Produce_Anti_Emmigration_Propaganda: "Produce Anti-Emmigration Propaganda"
 GDR_Produce_Anti_Emmigration_Propaganda_desc: "Western propaganda is causing a large portion of our workforce to emigrate to our capitalist counterpart. Before more extreme solutions are considered, perhaps we can counter their efforts with a propaganda campaign of our own?"
 GDR_Purge_Ulbricht_and_Hoenecker: "Purge Ulbricht & Hoenecker"
 GDR_Purge_Ulbricht_and_Hoenecker_desc: "Keeping Ulbricht and Hoenecker in the Party is a risk we simply cannot afford. They must go."
 GDR_Reform_the_Stasi: "Reform the Stasi"
 GDR_Reform_the_Stasi_desc: "The Stasi has operated in a form unbecoming of how a respectable state security apparatus should function. Reform is needed."
 GDR_Loosen_Political_Censorship: "Loosen Political Censorship"
 GDR_Loosen_Political_Censorship_desc: "We can allow a certain degree of socialist plurality within the government."
 GDR_Reverse_Work_Quota_Policies: "Reverse Work Quota Policies"
 GDR_Reverse_Work_Quota_Policies_desc: "The work quotas are driving our workers to exhaustion, and in some cases, dissent. We can afford to loosen these in the interests of stability."
 GDR_Invest_in_Modernizing_Landwirtschaftliche_Produktionsgenossenschaft_Machinery: "Modernize the Agricultural Production Cooperatives"
 GDR_Invest_in_Modernizing_Landwirtschaftliche_Produktionsgenossenschaft_Machinery_desc: "The Cooperatives are in need of new tools to increase food production, let us provide them with an investment."
 GDR_Allow_Greater_Intelligentsia_Freedoms: "Allow Greater Intelligentsia Freedoms"
 GDR_Allow_Greater_Intelligentsia_Freedoms_desc: "The intelligentsia can be a powerful asset, when harnessed properly. We will allow them certain freedoms, as long as they tow the party line."
 GDR_Responding_to_the_Platform_for_the_Special_German_Route_to_Socialism: "Respond to the Special German Route to Socialism"
 GDR_Responding_to_the_Platform_for_the_Special_German_Route_to_Socialism_desc: "Wolfgang Harich has submitted a proposal that he believes will lead Germany down the proper path to socialism. It is time to respond to his ideas."
 GDR_Further_Reform_the_Politurbo: "Further Reform the Politurbo"
 GDR_Further_Reform_the_Politurbo_desc: "Our reforms have done well for the Party and the country, but there are still improvements to be made."
 GDR_Crackdown_on_the_Gruppe_Harich: "Crackdown on the Gruppe Harich"
 GDR_Crackdown_on_the_Gruppe_Harich_desc: "Harich and his followers' ideas are dangerous, we cannot allow them to propagate these any further."
 GDR_Outreach_to_the_SPD: "Outreach to the SPD"
 GDR_Outreach_to_the_SPD_desc: "The SPD considers itself more moderate than the SED, but that does not mean we cannot work together."
 GDR_Resist_Calls_for_Collective_Leadership: "Resist Calls for Collective Leadership"
 GDR_Resist_Calls_for_Collective_Leadership_desc: "Sharing power with other parties who do not share our views is a dangerous gamble, one that we cannot take."
 GDR_Concede_to_Demand_For_Collective_Leadership: "Concede to Collective Leadership"
 GDR_Concede_to_Demand_For_Collective_Leadership_desc: "Collective leadership is a necessary step towards building a functional socialist state."
 GDR_A_New_SED: "A New SED"
 GDR_A_New_SED_desc: "Through reform and compromise, we have rebuilt the Party into a model for all socialists to follow! We shall lead the German Democratic Republic to a prosperous future!"
