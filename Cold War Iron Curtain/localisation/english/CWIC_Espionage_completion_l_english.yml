 # The slot mission shows in the decisions pane while a Black Operation runs.
 Espionage_Operation_Slot_1: "Covert Operation in Progress"
 Espionage_Operation_Slot_1_desc: "A Black Operations squad is in the field. The result arrives in the intelligence bulletin when the operation ends."
 # Stage 2: operative lifecycle.
 CWIC_ESP_AAR_RETURNED: "Returned"
 CWIC_ESP_AAR_WOUNDED: "§YWounded§!"
 CWIC_ESP_AAR_KILLED: "§RKilled in action§!"
 CWIC_ESP_AAR_CAPTURED: "§RCaptured§!"
 cwic_esp.1.t: "Squad Leader Captured"
 cwic_esp.2.t: "Operative Captured"
 cwic_esp.3.t: "Operative Captured"
 cwic_esp.4.t: "Operative Captured"
 cwic_esp.5.t: "Operative Captured"
 cwic_esp.captured.d: "One of our operatives did not make the extraction. [CWIC_esp_mia_target.GetAdjective] security services are holding them, and the first interrogation reports have reached our station. We can open a quiet channel to arrange an exchange, which costs political capital and money and only works while we are not at war with [CWIC_esp_mia_target.GetName]. Or we can disavow them, which keeps the service clean but burns part of the local network that knew their face."
 cwic_esp.captured.a: "Open a channel and arrange an exchange"
 cwic_esp.captured.b: "Disavow them"
 cwic_esp.captured.c: "Decide later"
 CWIC_ESP_EXCHANGE_TT: "The operative returns to their squad. Costs §Y25 Political Power§! and §Y$5M§!."
 CWIC_ESP_DISAVOW_TT: "The operative is written off; the seat can be refilled. Our network in the target country loses §R5%§! strength."
 CWIC_ESP_WAIT_TT: "The squad cannot deploy while a member is missing. The choice stays open under §YEspionage Personnel§! in the decisions pane."
 CWIC_ESP_EXCHANGE_FUNDS_TT: "Requires §Y$5M§! in the treasury"
 CWIC_ESPIONAGE_PERSONNEL: "Espionage Personnel"
 CWIC_esp_exchange_1: "Negotiate the Return of the Captured Squad Leader"
 CWIC_esp_exchange_2: "Negotiate the Return of Captured Operative 2"
 CWIC_esp_exchange_3: "Negotiate the Return of Captured Operative 3"
 CWIC_esp_exchange_4: "Negotiate the Return of Captured Operative 4"
 CWIC_esp_exchange_5: "Negotiate the Return of Captured Operative 5"
 CWIC_esp_disavow_1: "Disavow the Captured Squad Leader"
 CWIC_esp_disavow_2: "Disavow Captured Operative 2"
 CWIC_esp_disavow_3: "Disavow Captured Operative 3"
 CWIC_esp_disavow_4: "Disavow Captured Operative 4"
 CWIC_esp_disavow_5: "Disavow Captured Operative 5"
 CWIC_ESP_REPLACEMENT_TT: "A replacement recruit costs §Y5 Political Power§! and §Y$2M§!."
 # Stage 3: outlook, national synergies and trait slots.
 CWIC_ESP_OUTLOOK_LINE: "Success §Y[?.selected_operation_success|%1]§!   Detection §R[?.selected_operation_detection|%1]§!\nCasualty risk §R[?.selected_operation_casualty|%1]§!"
 CWIC_ESP_OUTLOOK_TT: "Estimates for the selected squad and operation.\n\nSuccess: base table plus skills and synergy (up to 30%), operative levels (up to 8%) and the local network (up to 15%), less underfunding.\nDetection: base table less stealth skills and the network, plus the target's counter-intelligence (1.5% per agency upgrade, 10% during an alert).\nBoth stay between 5% and 95%. Casualty risk is per operative before individual exposure."
 SYNERGY_MODIFIER_41_LIST: "$psyops_effectiveness$: §Y20%§!\n$target_regime_stability_hit$: §Y15%§!"
 SYNERGY_MODIFIER_41_LIST_TT: "§YStrategic Communications Working Group§!\n\nPairs case officers with psychological operations staff to turn every contact into a message.\n\nRequires§Y\n-United States only\n-Case Officer\n-Psy-Ops Specialist\n-200 Group Experience§!"
 SYNERGY_MODIFIER_42_LIST: "$sabotage_infrastructure_damage$: §Y15%§!\n$target_selection_optimization$: §Y10%§!"
 SYNERGY_MODIFIER_42_LIST_TT: "§YCovert Action Command Authority§!\n\nA single chain of authority from the station chief to the demolition team.\n\nRequires§Y\n-United States only\n-Case Officer\n-Saboteur\n-200 Group Experience§!"
 SYNERGY_MODIFIER_43_LIST: "$hacker_ops_success_rate$: §Y20%§!\n$deception_ops_success_bonus$: §Y15%§!"
 SYNERGY_MODIFIER_43_LIST_TT: "§YLangley Deep Access Division§!\n\nTechnical collection run from inside the target's own institutions.\n\nRequires§Y\n-United States only\n-Infiltrator\n-Tech Specialist\n-200 Group Experience§!"
 SYNERGY_MODIFIER_44_LIST: "$resistance_auto_activation$: §Y15%§!\n$resistance_attack_bonus$: §Y10%§!"
 SYNERGY_MODIFIER_44_LIST_TT: "§YNational Influence Expansion Office§!\n\nBuilds and bankrolls local movements that keep fighting after the squad has left.\n\nRequires§Y\n-United States only\n-Guerrilla Trainer\n-Case Officer\n-200 Group Experience§!"
 SYNERGY_MODIFIER_45_LIST: "$airborne_insertion_range_bonus$: §Y10%§!\n$operation_planning_speed$: §Y15%§!"
 SYNERGY_MODIFIER_45_LIST_TT: "§YMulti-Theater Operations Framework§!\n\nAir insertion, communications and handling planned as one package across theaters.\n\nRequires§Y\n-United States only\n-Scout\n-Tech Specialist\n-Case Officer\n-300 Group Experience§!"
 SYNERGY_MODIFIER_46_LIST: "$false_flag_success_bonus$: §Y20%§!\n$deception_ops_success_bonus$: §Y15%§!"
 SYNERGY_MODIFIER_46_LIST_TT: "§YActive Measures Bureau§!\n\nForgeries, front organisations and planted stories under a foreign flag.\n\nRequires§Y\n-Soviet and Warsaw Pact services only\n-Infiltrator\n-Psy-Ops Specialist\n-200 Group Experience§!"
 SYNERGY_MODIFIER_47_LIST: "$sleeper_agent_activation_speed$: §Y15%§!\n$border_detection_reduction$: §Y10%§!\n$network_stealth$: §Y10%§!"
 SYNERGY_MODIFIER_47_LIST_TT: "§YIllegal Operations Directorate§!\n\nDeep-cover illegals living under assumed identities with no diplomatic cover.\n\nRequires§Y\n-Soviet and Warsaw Pact services only\n-Infiltrator\n-Case Officer\n-200 Group Experience§!"
 SYNERGY_MODIFIER_48_LIST: "$propaganda_shock_bonus$: §Y20%§!\n$radicalization_speed$: §Y15%§!"
 SYNERGY_MODIFIER_48_LIST_TT: "§YRed Cultural Committee§!\n\nWriters, unions and student groups cultivated as channels for the Party's line.\n\nRequires§Y\n-Soviet and Warsaw Pact services only\n-Case Officer\n-Psy-Ops Specialist\n-200 Group Experience§!"
 SYNERGY_MODIFIER_49_LIST: "$leader_elimination_power$: §Y15%§!\n$counterintel_resistance_bonus$: §Y15%§!"
 SYNERGY_MODIFIER_49_LIST_TT: "§YInternal Stability Enforcement Program§!\n\nCounter-insurgency, liquidation and informant handling run as one apparatus.\n\nRequires§Y\n-Soviet and Warsaw Pact services only\n-Counter-Insurgent\n-Assassin\n-Case Officer\n-300 Group Experience§!"
 SYNERGY_MODIFIER_50_LIST: "$insurgent_training_bonus$: §Y15%§!\n$psyops_effectiveness$: §Y10%§!\n$smuggling_network_resilience$: §Y10%§!"
 SYNERGY_MODIFIER_50_LIST_TT: "§YTricontinental Revolutionary Support Unit§!\n\nTraining camps, arms pipelines and political officers for liberation movements abroad.\n\nRequires§Y\n-Soviet and Warsaw Pact services only\n-Guerrilla Trainer\n-Case Officer\n-Psy-Ops Specialist\n-300 Group Experience§!"
 CWIC_esp_trait_601: "Agency Tradecraft"
 CWIC_esp_trait_601_desc: "Langley's training pipeline: compartmented cover, dead drops and a support staff that keeps the paperwork invisible."
 CWIC_esp_trait_602: "Chekist Discipline"
 CWIC_esp_trait_602_desc: "The organs' tradition: interrogation, vigilance and a story for every occasion."
 CWIC_esp_trait_603: "National Service Doctrine"
 CWIC_esp_trait_603_desc: "A smaller service makes up in planning and staff work what it lacks in reach."
 CWIC_esp_trait_604: "Special Activities Veteran"
 CWIC_esp_trait_604_desc: "Paramilitary experience from the Agency's own ground branch: air insertion and close combat."
 CWIC_esp_trait_605: "Spetsnaz Liaison"
 CWIC_esp_trait_605_desc: "Trained alongside the GRU's special purpose troops: ambush, survival and getting out alive."
 CWIC_esp_trait_606: "Elite Operator"
 CWIC_esp_trait_606_desc: "The best the service can field: hardened, careful and quick to plan."
