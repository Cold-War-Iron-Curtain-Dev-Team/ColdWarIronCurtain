 cwic_esp.5.t: "Operative Captured"
 cwic_esp.captured.d: "One of our operatives did not make the extraction. [CWIC_esp_mia_target.GetAdjective] security services are holding them, and the first interrogation reports have reached our station. We can open a quiet channel to arrange an exchange, which costs political capital and money and only works while we are not at war with [CWIC_esp_mia_target.GetName]. Or we can disavow them, which keeps the service clean but burns part of the local network that knew their face."
 cwic_esp.captured.a: "Open a channel and arrange an exchange"
 cwic_esp.captured.b: "Disavow them"
 cwic_esp.captured.c: "Decide later"
 CWIC_ESP_EXCHANGE_TT: "The operative returns to their squad. Costs §Y25 Political Power§! and §Y$5M§!."
 CWIC_ESP_DISAVOW_TT: "The operative is written off; the seat can be refilled. Our network in the target country loses §R5%§! strength."
 CWIC_ESP_WAIT_TT: "The squad cannot deploy while a member is missing. The choice stays open under §YEspionage Personnel§! in the decisions pane."
 CWIC_ESP_EXCHANGE_FUNDS_TT: "Requires §Y$5M§! in the treasury"
 CWIC_ESPIONAGE_PERSONNEL: "Espionage Personnel"
