l_english:

 SWF_Indochina_War.0.t:0 "The Road to the Northwest"
 SWF_Indochina_War.0.d:0 "The People's Army has begun a new phase of operations in the northern highlands. The purpose is not merely to seize ground, but to stretch the enemy's thin network of posts, reopen the routes linking Việt Bắc to the frontier, and bring the mountain peoples into closer cooperation with the Democratic Republic.

Commanders have been instructed to avoid costly frontal engagements wherever the enemy can concentrate superior firepower. Instead, mobile units will strike isolated garrisons, cut roads and communications, and force the colonial command to disperse its strength across a landscape it cannot fully control. Supplies and advisers arriving through the northern frontier have given the General Staff confidence that the People's Army is ready to test a more ambitious operational doctrine."
 SWF_Indochina_War.0.a:0 "The mountains will become our battlefield."

 SWF_Indochina_War.1.t:0 "Victory in the Muong Highlands"
 SWF_Indochina_War.1.d:0 "After hard fighting along the mountain approaches, the People's Army has broken through the defending positions in the Muong highlands. Local guides, militia detachments, and regular formations worked together to isolate enemy outposts before the main assault. The victory secures valuable routes through the northwest and demonstrates that the colonial position in the interior can be challenged by coordinated revolutionary operations.

The General Staff has cautioned that the campaign is not finished. Enemy forces retain the ability to counterattack from stronger bases, and the newly liberated districts must be supplied, administered, and defended. Yet the result has raised morale throughout Việt Bắc and strengthened confidence in the expanding People's Army."
 SWF_Indochina_War.1.a:0 "The northwest opens before us."

 SWF_Indochina_War.2.t:0 "Setback in the Muong Highlands"
 SWF_Indochina_War.2.d:0 "The offensive into the Muong highlands has failed to achieve its objectives. Difficult terrain, inadequate communications, and determined resistance from the defending forces prevented the People's Army from securing the intended positions. Several units have withdrawn in good order, but the operation has shown that the enemy's outposts cannot yet be overcome without stronger reconnaissance, better logistics, and tighter coordination between local militia and regular troops.

The defeat is a disappointment, not a disaster. The revolutionary command remains intact, and the lessons of the campaign will be studied carefully before the next attempt."
 SWF_Indochina_War.2.a:0 "Learn, reorganize, and return."

 SWF_Indochina_War.3.t:0 "The Muong Front Holds"
 SWF_Indochina_War.3.d:0 "Defending forces in the Muong highlands have repelled the People's Army's attempted advance. The attacking formations were unable to maintain their momentum across the difficult mountain country, while local defenders exploited familiar terrain and prepared positions to frustrate repeated assaults.

The result preserves the existing balance of power in the highlands for the moment. Nevertheless, the scale of the operation confirms that the revolutionary forces are becoming more capable of coordinating regular units with local armed groups. Commanders expect the contest for the northwest to continue."
 SWF_Indochina_War.3.a:0 "The frontier remains contested."

 SWF_Indochina_War.4.t:0 "The Northwest Operation Is Abandoned"
 SWF_Indochina_War.4.d:0 "The planned operation in the northwest has been called off before a decisive result could be secured. Whether through changing conditions at the front, an inability to concentrate sufficient forces, or the demands of another sector of the war, the offensive has been postponed.

The withdrawal does not end the struggle for the highlands. Roads, supply lines, and political organization will be strengthened while the General Staff reviews the campaign plan. When conditions are more favorable, the People's Army will return."
 SWF_Indochina_War.4.a:0 "There will be another opportunity."

 SWF_Indochina_War.5.t:0 "The Tay Autonomous Region Is Liberated"
 SWF_Indochina_War.5.d:0 "The campaign against the Tay Autonomous Region has ended in a decisive victory for the People's Army. Revolutionary forces have overrun the remaining organized resistance, while local cadres have moved rapidly to secure roads, villages, and administrative centers.

With the old autonomous administration dissolved, Hanoi must now demonstrate that liberation means more than a change of flags. The region's communities must be incorporated into the national resistance while retaining confidence that their language, customs, and local institutions will be respected within the wider Vietnamese revolution. The victory also removes a dangerous obstacle on the northwestern front and gives the General Staff a firmer base for future operations."
 SWF_Indochina_War.5.a:0 "The northwest is united with the revolution."

 SWF_Indochina_War.6.t:0 "Defeat in the Tay Country"
 SWF_Indochina_War.6.d:0 "The assault on the Tay Autonomous Region has been repulsed. Defending forces have held their positions, and the People's Army has been compelled to disengage before the operation could turn into a costly battle of attrition.

The failure leaves a hostile pocket on the northwestern front and denies the revolutionary command the secure routes it had hoped to gain. Political work among the local population will continue, but the General Staff must now decide whether to renew the effort later or seek another way around the fortified region."
 SWF_Indochina_War.6.a:0 "The frontier has not yet been won."

 SWF_Indochina_War.7.t:0 "The Duyen Offensive Succeeds"
 SWF_Indochina_War.7.d:0 "The People's Army has achieved its objectives in the Duyên operation. After probing the defending positions and severing their lines of communication, Vietnamese forces concentrated their strength against isolated points and forced a withdrawal from the contested area.

The victory confirms the value of the General Staff's developing doctrine: local forces fix the enemy in place, militia gather intelligence and protect the rear, and regular units deliver the decisive blow where the balance is favorable. Commanders are already examining how the lessons of Duyên can be applied to the larger campaigns that lie ahead."
 SWF_Indochina_War.7.a:0 "Another step toward liberation."

 SWF_Indochina_War.8.t:0 "The Duyen Offensive Is Repulsed"
 SWF_Indochina_War.8.d:0 "The Duyên operation has failed to break the defending line. The People's Army encountered stronger resistance than expected and could not sustain the advance long enough to secure the targeted districts. Units have withdrawn to prepared positions rather than risk unnecessary losses.

The setback will delay the wider campaign plan, but it has also exposed weaknesses in supply, communications, and artillery support that can be corrected. The struggle for the region is far from over."
 SWF_Indochina_War.8.a:0 "The next offensive must be better prepared."

 SWF_Indochina_War.9.t:0 "The Duyen Line Holds"
 SWF_Indochina_War.9.d:0 "The defending forces have held the Duyên line against a determined People's Army offensive. Prepared positions and timely reinforcement prevented the attackers from turning their initial gains into a decisive breakthrough.

The result preserves the existing front, but the campaign has demonstrated that the revolutionary command is willing to commit increasingly organized formations to operations in this sector. The defenders may have held today, yet the pressure on the line is unlikely to disappear."
 SWF_Indochina_War.9.a:0 "The positions are secure—for now."

 SWF_Indochina_War.10.t:0 "The Duyen Line Collapses"
 SWF_Indochina_War.10.d:0 "The Duyên defensive line has collapsed under sustained pressure from the People's Army. Local positions were isolated, communications failed, and the defending command was unable to restore a coherent front before the revolutionary advance secured the contested territory.

The defeat is a serious blow to the defense of the region. Revolutionary cadres are moving quickly to establish authority in the newly won districts, while surviving defenders must reconsider how the wider front can be stabilized. The initiative in this sector has passed decisively to Hanoi."
 SWF_Indochina_War.10.a:0 "The balance of the war has shifted."
