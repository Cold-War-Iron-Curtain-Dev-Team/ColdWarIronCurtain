  SWF_Indochina_War.0.t:0 "The Road to the Northwest"
  SWF_Indochina_War.0.d:0 "The People's Army has begun a new phase of operations in the northern highlands. The purpose is not merely to seize ground, but to stretch the enemy's thin network of posts, reopen the routes linking Viet Bac to the frontier, and bring the mountain peoples into closer cooperation with the Democratic Republic. \n\nCommanders have been instructed to avoid costly frontal engagements wherever the enemy can concentrate superior firepower. Instead, mobile units will strike isolated garrisons, cut roads and communications, and force the colonial command to disperse its strength across a landscape it cannot fully control. Supplies and advisers arriving through the northern frontier have given the General Staff confidence that the People's Army is ready to test a more ambitious operational doctrine."
  SWF_Indochina_War.0.a:0 "The mountains will become our battlefield."

  SWF_Indochina_War.1.t:0 "Victory in the Muong Highlands"
  SWF_Indochina_War.1.d:0 "After hard fighting along the mountain approaches, the People's Army has broken through the defending positions in the Muong highlands. Local guides, militia detachments, and regular formations worked together to isolate enemy outposts before the main assault. The victory secures valuable routes through the northwest and demonstrates that the colonial position in the interior can be challenged by coordinated revolutionary operations. \n\nThe General Staff has cautioned that the campaign is not finished. Enemy forces retain the ability to counterattack from stronger bases, and the newly liberated districts must be supplied, administered, and defended. Yet the result has raised morale throughout Viet Bac and strengthened confidence in the expanding People's Army."
  SWF_Indochina_War.1.a:0 "The northwest opens before us."

  SWF_Indochina_War.2.t:0 "Setback in the Muong Highlands"
  SWF_Indochina_War.2.d:0 "The offensive into the Muong highlands has failed to achieve its objectives. Difficult terrain, inadequate communications, and determined resistance from the defending forces prevented the People's Army from securing the intended positions. Several units have withdrawn in good order, but the operation has shown that the enemy's outposts cannot yet be overcome without stronger reconnaissance, better logistics, and tighter coordination between local militia and regular troops. \n\nThe defeat is a disappointment, not a disaster. The revolutionary command remains intact, and the lessons of the campaign will be studied carefully before the next attempt."

  SWF_Indochina_War.2.a:0 "Learn, reorganize, and return."

  SWF_Indochina_War.3.t:0 "The Muong Front Holds"
  SWF_Indochina_War.3.d:0 "Defending forces in the Muong highlands have repelled the People's Army's attempted advance. The attacking formations were unable to maintain their momentum across the difficult mountain country, while local defenders exploited familiar terrain and prepared positions to frustrate repeated assaults. \n\nThe result preserves the existing balance of power in the highlands for the moment. Nevertheless, the scale of the operation confirms that the revolutionary forces are becoming more capable of coordinating regular units with local armed groups. Commanders expect the contest for the northwest to continue."

  SWF_Indochina_War.3.a:0 "The frontier remains contested."

  SWF_Indochina_War.4.t:0 "The Northwest Operation Is Abandoned"
  SWF_Indochina_War.4.d:0 "The planned operation in the northwest has been called off before a decisive result could be secured. Whether through changing conditions at the front, an inability to concentrate sufficient forces, or the demands of another sector of the war, the offensive has been postponed. \n\nThe withdrawal does not end the struggle for the highlands. Roads, supply lines, and political organization will be strengthened while the General Staff reviews the campaign plan. When conditions are more favorable, the People's Army will return."
  SWF_Indochina_War.4.a:0 "There will be another opportunity."

  SWF_Indochina_War.5.t:0 "The Tay Highlands Are Liberated"
  SWF_Indochina_War.5.d:0 "The campaign against the Tay Autonomous Region has broken the federation's hold on the eastern highlands. Revolutionary forces have overrun the organized resistance around Hoang Lien Son, while local cadres move to secure roads, villages, and administrative centers throughout the liberated districts. \n\nThe federation itself has not surrendered. Deo Van Long and what remains of his administration have withdrawn westward into the upper valleys, where the French have promised to stand behind them, and the tricolour still flies over the airstrip at Dien Bien Phu. The General Staff regards the campaign as a success - the northwestern approaches are open and the enemy's interior posts are now isolated - but the last of the Tay country will have to be taken separately, and Paris appears determined to make that a battle rather than a march."

  SWF_Indochina_War.5.a:0 "The mountains are ours. The valley can wait."

  SWF_Indochina_War.6.t:0 "Defeat in the Tay Country"
  SWF_Indochina_War.6.d:0 "The assault on the Tay Autonomous Region has been repulsed. Defending forces have held their positions, and the People's Army has been compelled to disengage before the operation could turn into a costly battle of attrition. \n\nThe failure leaves a hostile pocket on the northwestern front and denies the revolutionary command the secure routes it had hoped to gain. Political work among the local population will continue, but the General Staff must now decide whether to renew the effort later or seek another way around the fortified region."
  SWF_Indochina_War.6.a:0 "The frontier has not yet been won."

  SWF_Indochina_War.7.t:0 "The Duyen Offensive Succeeds"
  SWF_Indochina_War.7.d:0 "The People's Army has achieved its objectives in the Duyen operation. After probing the defending positions and severing their lines of communication, Vietnamese forces concentrated their strength against isolated points and forced a withdrawal from the contested area. \n\nThe victory confirms the value of the General Staff's developing doctrine: local forces fix the enemy in place, militia gather intelligence and protect the rear, and regular units deliver the decisive blow where the balance is favorable. Commanders are already examining how the lessons of Duyen can be applied to the larger campaigns that lie ahead."
  SWF_Indochina_War.7.a:0 "Another step toward liberation."

  SWF_Indochina_War.8.t:0 "The Duyen Offensive Is Repulsed"
  SWF_Indochina_War.8.d:0 "The Duyen operation has failed to break the defending line. The People's Army encountered stronger resistance than expected and could not sustain the advance long enough to secure the targeted districts. Units have withdrawn to prepared positions rather than risk unnecessary losses. \n\nThe setback will delay the wider campaign plan, but it has also exposed weaknesses in supply, communications, and artillery support that can be corrected. The struggle for the region is far from over."
  SWF_Indochina_War.8.a:0 "The next offensive must be better prepared."

  SWF_Indochina_War.9.t:0 "The Duyen Line Holds"
  SWF_Indochina_War.9.d:0 "The defending forces have held the Duyen line against a determined People's Army offensive. Prepared positions and timely reinforcement prevented the attackers from turning their initial gains into a decisive breakthrough. \n\nThe result preserves the existing front, but the campaign has demonstrated that the revolutionary command is willing to commit increasingly organized formations to operations in this sector. The defenders may have held today, yet the pressure on the line is unlikely to disappear."
  SWF_Indochina_War.9.a:0 "The positions are secure - for now."

  SWF_Indochina_War.10.t:0 "The Duyen Line Collapses"
  SWF_Indochina_War.10.d:0 "The Duyen defensive line has collapsed under sustained pressure from the People's Army. Local positions were isolated, communications failed, and the defending command was unable to restore a coherent front before the revolutionary advance secured the contested territory. \n\nThe defeat is a serious blow to the defense of the region. Revolutionary cadres are moving quickly to establish authority in the newly won districts, while surviving defenders must reconsider how the wider front can be stabilized. The initiative in this sector has passed decisively to Hanoi."

  SWF_Indochina_War.10.a:0 "The balance of the war has shifted."

  SWF_Indochina_War.11.t:0 "The Tai Highlands Hold"
  SWF_Indochina_War.11.d:0 "The federation's militia and the French garrisons stationed among them have thrown back the People's Army's push into the northwestern highlands. Familiar ground, prepared strongpoints, and the sheer difficulty of moving artillery through the valleys did as much of the work as the fighting itself. \n\nHanoi's regiments have withdrawn toward their bases, but nobody in the mountains believes the matter is settled. The federation's leaders have asked Paris for more than sympathy, and the question of whether the highlands can be defended a second time now hangs over every council in the region."
  SWF_Indochina_War.11.a:0 "The mountains defended us this time."

  SWF_Indochina_War.12.t:0 "The Tai Federation Is Overrun"
  SWF_Indochina_War.12.d:0 "The People's Army has broken the federation's defenses in the northwest. Outposts were isolated one by one, the roads west were cut, and the militia that had held the valleys for a generation dissolved under a weight of numbers it was never built to face. \n\nWhat remains of the federation's authority is being folded into the Democratic Republic. Some of the leadership has fled toward the French lines; the rest are negotiating whatever terms they can still get. The autonomy the highlands were promised has ended in the way its critics always said it would."
  SWF_Indochina_War.12.a:0 "The federation has fallen."

  SWF_Indochina_War.13.t:0 "Muong Is Overrun"
  SWF_Indochina_War.13.d:0 "The defense of the Muong highlands has collapsed. The People's Army pressed through the mountain approaches faster than reinforcements could be brought up, and the last coherent positions around Hoa Binh have been abandoned. \n\nRevolutionary cadres are already installing themselves in the district seats. For Hanoi the campaign has opened the corridor it wanted; for the highland leadership it has ended the fiction that the interior could be held without the French army standing in it."
  SWF_Indochina_War.13.a:0 "The highlands are lost."

  SWF_Indochina_War.17.t:0 "The Valley Stands Open"
  SWF_Indochina_War.17.d:0 "Reconnaissance from the hills above Dien Bien Phu reports what the General Staff has half expected for months: the French have not come. There are no transport aircraft on the strip, no ring of strongpoints on the valley floor, no artillery dug into the surrounding heights. What holds the last of the Tay country is the federation's own militia and whatever the colonial command could spare, which is very little. \n\nThe basin is the natural gateway to Upper Laos and the last piece of the northwest still outside the Democratic Republic. Taking it would cost a fraction of what a fortified position would demand, and the divisions are already in the highlands. \n\nSome on the General Staff counsel patience, arguing that troops committed to the valley are troops absent from the delta, and that a French garrison may yet appear and hand the revolution the decisive battle it has been waiting for. Others reply that one does not decline an open door in the hope that someone will later build a wall across it."
  SWF_Indochina_War.17.a:0 "Take the valley."
  SWF_Indochina_War.17.b:0 "Leave the highlands be. Our strength is needed elsewhere."

  SWF_Indochina_War.15.t:0 "Dien Bien Phu Is Taken"
  SWF_Indochina_War.15.d:0 "The People's Army has occupied the Dien Bien Phu basin. The federation's remaining militia offered scattered resistance around the airstrip before dispersing into the hills or laying down their arms, and by nightfall the district seat was in revolutionary hands. Deo Van Long's government has ceased to exist. \n\nThere was no siege, no artillery duel in the surrounding heights, no epic to be written about the valley. The French never came, and the northwest has been completed almost as an administrative matter. \n\nCadres are already at work among the Tay, Meo, and Thai communities of the upper valleys, where the question of what autonomy will mean under Hanoi rather than Paris is now an immediate one. The roads into Upper Laos lie open."
  SWF_Indochina_War.15.a:0 "The northwest is united with the revolution."

  SWF_Indochina_War.16.t:0 "Repulsed in the Upper Valleys"
  SWF_Indochina_War.16.d:0 "The advance into the Dien Bien Phu basin has been thrown back. The federation's militia knew the approaches better than our guides did, the weather closed the passes at the worst possible moment, and what was expected to be an occupation became a costly and inconclusive fight in country that favours the defender at every turn. \n\nThe regiments have withdrawn to the eastern highlands in reasonable order. The Tay administration survives in the valley, its confidence considerably restored, and the French have taken the opportunity to renew their guarantees to it. \n\nThe General Staff will not repeat the operation on the same assumptions."
  SWF_Indochina_War.16.a:0 "The valley has bought itself time."

  SWF_Indochina_War.18.t:0 "The Tai Federation Collapses"
  SWF_Indochina_War.18.d:0 "With the camp at Dien Bien Phu gone, nothing stands between the People's Army and the last of the Tay country. The federation's militia, which had held the upper valleys only because a French garrison stood behind them, has disintegrated; its leadership has scattered toward the Laotian frontier or opened negotiations with our forward commanders. \n\nDeo Van Long's autonomous administration, created by Paris to hold the highlands against the revolution, has ended together with the army that guaranteed it. The whole of the northwest is now in the hands of the Democratic Republic. \n\nThe political work begins immediately. The mountain peoples were promised autonomy by the French and were given a war instead; they will have to be persuaded that Hanoi's promises are worth more, and that persuasion will take longer than the campaign did."
  SWF_Indochina_War.18.a:0 "The highlands belong to the revolution."

#### Dien Bien Phu outcome (fired by vin_dbp_record_outcome) ####
  SWF_Indochina_War.30.t:0 "[GetNewspaperHeader]The Camp at Dien Bien Phu Has Fallen"
  SWF_Indochina_War.30.d:0 "The garrison of Dien Bien Phu has surrendered. After weeks under artillery that French planners insisted could never be brought over the mountains, the last strongpoints in the valley floor were overrun and the camp's commander ordered the firing stopped rather than spend what remained of his men.\n\nThe position was chosen deliberately: a fortified airhead deep in the highlands, meant to draw the People's Army into the open and destroy it against prepared defences. Instead the guns were dug into the hillsides above the camp, the airstrip was closed within days, and an army supplied only by parachute was besieged by one supplied by a hundred thousand porters.\n\nWhat was lost here is not a province. It is the argument that the war could still be won by holding ground, and every chancellery that has been waiting for an answer to that question now has one."
  SWF_Indochina_War.30.a:0 "The valley is ours."
  SWF_Indochina_War.30.b:0 "The Republic will not survive this."
  SWF_Indochina_War.30.c:0 "An empire has just been handed its answer."
  SWF_Indochina_War.31.t:0 "[GetNewspaperHeader]The Camp at Dien Bien Phu Holds"
  SWF_Indochina_War.31.d:0 "The siege of Dien Bien Phu has been broken. The strongpoints on the valley floor held through the final assaults, the airstrip stayed open long enough to matter, and the People's Army has pulled its guns back into the hills rather than spend the rest of its main force against wire and concrete.\n\nThe camp was a gamble on a simple proposition: that a fortified airhead in the highlands could draw the revolution's army into a battle it could not win. For once the proposition has been proved, and the divisions that were meant to overrun the northwest are walking back over the passes without it.\n\nParis will make a great deal of this, and it has earned the right to. Whether one valley held is the same thing as a war won is a question for a different set of men in a different room."
  SWF_Indochina_War.31.a:0 "The line held."
  SWF_Indochina_War.31.b:0 "We will not make that mistake twice."
  SWF_Indochina_War.31.c:0 "So the French can still win a battle."
  SWF_Indochina_War.32.t:0 "[GetNewspaperHeader]The Corps Digs In at Dien Bien Phu"
  SWF_Indochina_War.32.d:0 "The Groupement Operationnel du Nord-Ouest has taken up position in the valley of Dien Bien Phu. Paratroop and Legion battalions were flown into the basin over a matter of days, the airstrip has been reopened, and the strongpoints ringing the valley floor are being wired and dug as fast as the engineers can work.\n\nThe reasoning is that a fortified airhead astride the road into Laos cannot be ignored, and that an army obliged to come and fight for it must fight on ground the corps has chosen. It is the argument for the whole position: not to hold the northwest, which cannot be held, but to make the northwest the place where the People's Army is finally brought to a battle it cannot walk away from.\n\nEverything in that argument rests on the airstrip staying open and on the hills above the valley staying empty. Both are now questions for the other side to answer."
  SWF_Indochina_War.32.a:0 "Let them come to us."
  SWF_Indochina_War.32.b:0 "They have walked into the hills and shut the door behind them."
  SWF_Indochina_War.32.c:0 "A garrison in a basin, and the high ground given away."
