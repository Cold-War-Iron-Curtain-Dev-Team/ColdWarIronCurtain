  cw_sf_mountain_troops_reward_4: "Pack Artillery Support"
  cw_sf_mountain_troops_reward_5: "Mountain Divisions"
  cw_sf_arctic_winter_warfare: "Arctic and Winter Warfare"
  cw_sf_arctic_winter_warfare_desc: "Ski troops and cold-weather infantry for the northern flank, from Finnish ski patrols to Norwegian Arctic brigades and the Soviet Leningrad winter exercises."
