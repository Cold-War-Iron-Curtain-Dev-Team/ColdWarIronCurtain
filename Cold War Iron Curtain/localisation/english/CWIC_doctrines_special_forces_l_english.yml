  cw_sf_ranger_raids_reward_1: "Ranger Selection Courses"
  cw_sf_ranger_raids_reward_2: "Raid Tactics"
  cw_sf_ranger_raids_reward_3: "Light Infantry Endurance"
  cw_sf_ranger_raids_reward_4: "Hardened Cadres"
