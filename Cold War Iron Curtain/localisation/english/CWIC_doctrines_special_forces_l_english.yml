  cw_sf_naval_infantry_armored_reward_2: "Landing Ship Tank Groups"
  cw_sf_naval_infantry_armored_reward_3: "Armored Beach Exploitation"
  cw_sf_naval_infantry_armored_reward_4: "Shore Fire Coordination"
  cw_sf_naval_infantry_armored_reward_5: "Naval Infantry Regiments"
  cw_sf_riverine_littoral: "Riverine and Littoral Warfare"
