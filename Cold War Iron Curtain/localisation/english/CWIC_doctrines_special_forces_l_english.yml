  cw_sf_expeditionary_rapid_reaction_reward_4: "Brigade Group Cohesion"
  cw_sf_expeditionary_rapid_reaction_reward_5: "Expeditionary Brigades"
  cw_sf_naval_infantry_armored: "Armored Naval Infantry"
  cw_sf_naval_infantry_armored_desc: "Naval infantry with amphibious APCs and light tanks for a fast mechanized landing, the Soviet Morskaya Pekhota built around the BTR-60P and PT-76."
