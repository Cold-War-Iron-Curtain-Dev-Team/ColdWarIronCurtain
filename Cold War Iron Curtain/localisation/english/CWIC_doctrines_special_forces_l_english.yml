  cw_sf_high_altitude_warfare_reward_5: "High Altitude Brigades"
  cw_sf_mountain_strike_raiders: "Mountain Strike Raiders"
  cw_sf_mountain_strike_raiders_desc: "Mountain assault troops who infiltrate over ridge lines to strike rear positions, in the style of the Royal Marines on Mount Longdon and the Israeli Hermon assault."
