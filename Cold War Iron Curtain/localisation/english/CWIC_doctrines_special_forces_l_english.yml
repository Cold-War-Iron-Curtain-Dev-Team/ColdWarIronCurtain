  cw_sf_riverine_littoral_reward_2: "River Assault Groups"
  cw_sf_riverine_littoral_reward_3: "Floating Bases"
  cw_sf_riverine_littoral_reward_4: "Jungle River Patrols"
  cw_sf_riverine_littoral_reward_5: "Mobile Riverine Brigades"
  cw_sf_mountain_troops: "Mountain Troops"
  cw_sf_mountain_troops_desc: "Alpine and Himalayan specialists who treat ridges and passes as terrain to own, the Alpini, Gebirgsjaeger and the Indian mountain divisions raised after 1962."
