  cw_sf_arctic_winter_warfare_reward_4: "Arctic Over-Snow Vehicles"
  cw_sf_arctic_winter_warfare_reward_5: "Arctic Brigades"
  cw_sf_high_altitude_warfare: "High Altitude Warfare"
