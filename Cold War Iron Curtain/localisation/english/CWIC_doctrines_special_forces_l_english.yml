l_english:
  cw_sf_mass_airborne: "Mass Airborne Forces"
  cw_sf_mass_airborne_desc: "Large airborne and special forces establishments built for strategic mobility and sheer numbers, in the model of the Soviet VDV and the US airborne corps."
  cw_sf_elite_commandos: "Elite Commando Corps"
  cw_sf_elite_commandos_desc: "Small, rigorously selected special forces that trade numbers for endurance and self-sufficiency, in the model of the British SAS and Sayeret Matkal."
  cw_sf_unconventional_warfare: "Unconventional Warfare Corps"
  cw_sf_unconventional_warfare_desc: "Special forces that work by, with and through partner and irregular forces, the US Special Forces, Portuguese Comandos and Rhodesian bush war model of living off the land far from the main army."
  cw_sf_deep_reconnaissance: "Deep Reconnaissance and Sabotage"
  cw_sf_deep_reconnaissance_desc: "Special forces as a strategic reconnaissance and sabotage arm, in the model of the Soviet GRU Spetsnaz, the South African Recces and the LRRP companies: fast, deep, lightly supplied."
  cw_sf_airborne_assault: "Airborne Assault"
  cw_sf_airborne_assault_desc: "Mass parachute drops that put whole battalions behind the enemy line, from Arnhem and Varsity to the Soviet VDV exercises of the 1950s."
  cw_sf_airborne_assault_reward_1: "Resupply Drops"
  cw_sf_airborne_assault_reward_2: "Jump School Pipeline"
  cw_sf_airborne_assault_reward_3: "Light Infantry Shock"
  cw_sf_airborne_assault_reward_4: "Vertical Envelopment"
  cw_sf_airborne_assault_reward_5: "Airborne Corps Expansion"
  cw_sf_pathfinder_infiltration: "Pathfinder Infiltration"
  cw_sf_pathfinder_infiltration_desc: "Small teams inserted by free-fall parachute from altitude to mark drop zones and scout objectives, the HALO and HAHO methods developed from the early 1960s."
  cw_sf_pathfinder_infiltration_reward_1: "High Altitude Free Fall"
  cw_sf_pathfinder_infiltration_reward_2: "Drop Zone Marking"
  cw_sf_pathfinder_infiltration_reward_3: "Stealth Insertion"
  cw_sf_pathfinder_infiltration_reward_4: "Deep Strike Pathfinders"
  cw_sf_pathfinder_infiltration_reward_5: "Long Range Reconnaissance Drops"
  cw_sf_strategic_reserve_brigades: "Strategic Reserve Brigades"
  cw_sf_strategic_reserve_brigades_desc: "Ready brigades kept on short alert for rapid reinforcement of distant crises, as with the US 82nd Airborne, the British 16th Parachute Brigade and the French 11th Parachute Division."
  cw_sf_strategic_reserve_brigades_reward_1: "Ready Brigade Alert"
  cw_sf_strategic_reserve_brigades_reward_2: "Strategic Airlift Rehearsal"
  cw_sf_strategic_reserve_brigades_reward_3: "Division Ready Force"
  cw_sf_strategic_reserve_brigades_reward_4: "Contingency Planning"
  cw_sf_strategic_reserve_brigades_reward_5: "Fire Brigade Doctrine"
  cw_sf_mechanized_airborne: "Mechanized Airborne"
  cw_sf_mechanized_airborne_desc: "Air-droppable armored vehicles such as the Soviet BMD that let paratroopers fight a mobile battle once on the ground instead of as light infantry."
  cw_sf_mechanized_airborne_reward_1: "Air-Droppable Armor"
  cw_sf_mechanized_airborne_reward_2: "Platform Drop Training"
  cw_sf_mechanized_airborne_reward_3: "Armored Vertical Envelopment"
  cw_sf_mechanized_airborne_reward_4: "Combined Airborne Battlegroups"
  cw_sf_mechanized_airborne_reward_5: "Airborne Mechanized Divisions"
  cw_sf_air_assault: "Air Assault"
  cw_sf_air_assault_desc: "Helicopter-lifted light infantry that seizes landing zones and firebases and holds them, the model of the US 11th Air Assault Test and the 101st Airmobile Division in Vietnam."
  cw_sf_air_assault_reward_1: "Rotary Lift Training"
  cw_sf_air_assault_reward_2: "Forward Arming Points"
  cw_sf_air_assault_reward_3: "Gunship Escort"
  cw_sf_air_assault_reward_4: "Landing Zone Defense"
  cw_sf_air_assault_reward_5: "Air Assault Divisions"
  cw_sf_gunship_cavalry: "Gunship Cavalry"
  cw_sf_gunship_cavalry_desc: "Air cavalry squadrons that scout, screen and hunt armor from helicopters, the 1st Cavalry Division hunter-killer teams of Vietnam and the Mi-24 regiments of the Soviet Army."
  cw_sf_gunship_cavalry_reward_1: "Scout and Gunship Teams"
  cw_sf_gunship_cavalry_reward_2: "Hunter-Killer Pairs"
  cw_sf_gunship_cavalry_reward_3: "Screening the Flanks"
  cw_sf_gunship_cavalry_reward_4: "Armed Helicopter Doctrine"
  cw_sf_gunship_cavalry_reward_5: "Air Cavalry Squadrons"
  cw_sf_mounted_raiders: "Mounted Raiders"
  cw_sf_mounted_raiders_desc: "Jeep and Land Rover columns that raid airfields and supply lines across open country, the Long Range Desert Group model carried on by the SAS in Oman and the Sinai."
  cw_sf_mounted_raiders_reward_1: "Desert Navigation"
  cw_sf_mounted_raiders_reward_2: "Armed Patrol Vehicles"
  cw_sf_mounted_raiders_reward_3: "Fuel and Water Caches"
  cw_sf_mounted_raiders_reward_4: "Airfield Raids"
  cw_sf_mounted_raiders_reward_5: "Mobile Raiding Columns"
  cw_sf_pseudo_operations: "Pseudo-Operations"
  cw_sf_pseudo_operations_desc: "Teams posing as insurgents to penetrate guerrilla networks and call in strike forces, as practised by the Rhodesian Selous Scouts, the Portuguese Flechas and the French in Algeria."
  cw_sf_pseudo_operations_reward_1: "Turned Insurgents"
  cw_sf_pseudo_operations_reward_2: "Cover Identities"
  cw_sf_pseudo_operations_reward_3: "Fireforce Cueing"
  cw_sf_pseudo_operations_reward_4: "Cross-Border Strikes"
  cw_sf_pseudo_operations_reward_5: "Pseudo Gang Regiments"
  cw_sf_marine_amphibious: "Marine Amphibious Assault"
  cw_sf_marine_amphibious_desc: "Naval infantry organized for opposed landings, from Inchon to the Soviet and Chinese naval infantry of the 1950s, backed by purpose-built amphibious lift."
  cw_sf_marine_amphibious_reward_1: "Beach Assault Training"
  cw_sf_marine_amphibious_reward_2: "Amphibious Planning Staffs"
  cw_sf_marine_amphibious_reward_3: "Armored Amphibians"
  cw_sf_marine_amphibious_reward_4: "Beachhead Consolidation"
  cw_sf_marine_amphibious_reward_5: "Marine Corps Expansion"
  cw_sf_expeditionary_rapid_reaction: "Expeditionary Rapid Reaction"
  cw_sf_expeditionary_rapid_reaction_desc: "Light commando brigades and colonial marines that deploy from carriers and amphibious ships for short, self-sufficient interventions such as Suez, Kuwait 1961 and Zaire."
  cw_sf_expeditionary_rapid_reaction_reward_1: "Commando Carrier Squadrons"
  cw_sf_expeditionary_rapid_reaction_reward_2: "Light Scale Logistics"
