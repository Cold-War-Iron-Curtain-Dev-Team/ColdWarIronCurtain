par.2.t:0 "The Fall of Molas López"
par.2:0 "The writing had been on the wall for months. Despite assuming power with military and party support, Felipe Molas López found himself increasingly isolated as his administration struggled to deliver on its promises. His former ally, Federico Chaves, conspired against him, and the Colorado Party’s Governing Board lost faith in his leadership. On the night of [GetDate], the Junta convened in an extraordinary session. The vote was decisive—14 in favor, 3 against—Molas López had to go. A delegation, including his own ministers, arrived at the presidential residence to present their demand: resign or be removed.\nCornered and abandoned, Molas López had no choice but to sign his resignation in the early hours. The government would soon announce his failures—his inability to unify the party, restore the institutions, or maintain public order."
par.3.t:0 "The [GetYear] Elections"
par.3:0 "With Felipe Molas López removed from power, the Colorado Party has called for elections to formally confirm Federico Chaves as president and fill the seats in parliament. However, with the Colorado Party as the only legal political organization, the election is a mere formality. No opposition candidates have been allowed to run, and Chaves stands unopposed.\nState-backed candidates have secured every parliamentary seat without contest, and the official results confirm Chaves as president until 1953. The government presents the outcome as a reaffirmation of national unity under the party’s leadership, but there is little doubt that the system is built to keep any opposition out of power.\nWith his rule now legitimized, Chaves must turn his attention to stabilizing the economy and managing growing factionalism within the Colorado Party. The question is not whether he holds power, but for how long he can keep the party united behind him."
par.3.a:0 "Chaves Secures His Presidency"
par.4.t:0 "[GetNewspaperHeader]A Democratic Facade?"
par.4:0 "In a move heralded by government officials as a \"new chapter for Paraguayan democracy,\" President Felipe Molas López has unveiled a series of measures aimed at restoring democratic institutions and fostering national reconciliation. His administration has taken steps to grant amnesty to political prisoners and revolutionaries involved in the Civil War of 1947, including those implicated in the Escuela Militar uprising. While this decision has been framed as an effort to heal the wounds of the past, critics remain skeptical about its long-term effectiveness, with some arguing that it is little more than a symbolic gesture lacking true political substance.\nDespite these efforts, doubts persist regarding the true extent of change under Molas López’s leadership. With his presidency already under pressure from internal political struggles, and his time in office expected to be brief, many question whether these reforms will lead to genuine democratization or if they simply serve as a momentary pause in Paraguay’s turbulent political landscape. For now, the government presents an image of renewal and reform, but whether Paraguay will see real political change or simply continue down its established path remains to be seen."
par.4.a:0 "A step forward—or merely an illusion?"
par.5.t:0 "A Navy Without a Coast"
par.5.d:0 "Despite being a landlocked nation, Paraguay boasts a surprisingly strong naval tradition, a legacy that dates back to the War of the Triple Alliance and the country's strategic reliance on its riverine routes. With access to the Atlantic Ocean via the Paraguay–Paraná river system, the nation has maintained a small but capable naval force, tasked with patrolling its waterways, securing trade routes, and ensuring logistical mobility along South America's largest river network. Paraguayan naval officers continue to train in amphibious warfare and riverine operations, ensuring that the Marina de Guerra remains a relevant force despite its geographical limitations. While the country lacks a blue-water fleet, its experience in river-based operations and marine technology allows it to maintain a highly specialized force suited for the unique challenges of inland naval warfare."
par.5.a:0 "A navy without an ocean is still a navy"