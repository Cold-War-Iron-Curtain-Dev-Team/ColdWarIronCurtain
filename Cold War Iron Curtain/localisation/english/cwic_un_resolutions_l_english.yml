 UN_RESOLUTION.40.t:0 "[GetNewspaperHeader]United Nations Unfreezes [un_nation_global_target.GetAdjective] National Assets"
 UN_RESOLUTION.40.d:0 "
The United Nations voted to release the national assets of [un_nation_global_target.GetName] frozen under an earlier resolution. Delegates credited the government of [un_nation_global_target.GetName] with meeting the conditions set by the Security Council, and the General Secretary expressed hope that renewed access to its reserves would help the country rebuild ties with the international community."
 UN_RESOLUTION.40.a:0 "Interesting"
 UN_RESOLUTION.41.t:0 "[GetNewspaperHeader]United Nations Lifts Sanctions on [un_nation_global_target.GetAdjective] Officials"
 UN_RESOLUTION.41.d:0 "
The United Nations voted to end the travel bans and personal sanctions placed on leading figures in [un_nation_global_target.GetName]. Supporters of the resolution argued the measures had served their purpose, while critics warned that lifting them too early risked rewarding the very conduct they were meant to punish."
 UN_RESOLUTION.41.a:0 "Interesting"
 UNPromptEffectLiftAssets:0 "- The UN unfreezes the national assets of [un_nation_global_target.GetName]."
 UNPromptEffectLiftOfficials:0 "- The UN lifts its sanctions on officials of [un_nation_global_target.GetName]."
