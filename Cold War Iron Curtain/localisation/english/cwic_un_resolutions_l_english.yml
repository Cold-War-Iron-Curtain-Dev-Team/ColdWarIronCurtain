 UN_RESOLUTION.40.t:0 "[GetNewspaperHeader]United Nations Unfreezes [un_nation_global_target.GetAdjective] National Assets"
 UN_RESOLUTION.40.d:0 "UNITED NATIONS - The United Nations has lifted its freeze on the national assets of [un_nation_global_target.GetName]. The resolution removes the UN restriction on the government's use of funds and holdings covered by the earlier measure.\n\nSupporters argued that retaining the freeze would obstruct normal financial dealings after the need for it had passed. Delegates favoring continued pressure questioned whether releasing the assets would surrender leverage before the dispute that prompted the measure had been satisfactorily resolved.\n\nThe decision now passes to the banks holding the accounts. Renewed access to funds abroad will give treasury officials more room to arrange payments, though commercial lenders must still make their own decisions about extending credit."
 UN_RESOLUTION.40.a:0 "The frozen funds are released."
 UN_RESOLUTION.41.t:0 "[GetNewspaperHeader]United Nations Lifts Sanctions on [un_nation_global_target.GetAdjective] Officials"
 UN_RESOLUTION.41.d:0 "UNITED NATIONS - The United Nations has lifted its sanctions on officials of [un_nation_global_target.GetName]. The decision ends the personal restrictions imposed under the earlier resolution, including the UN travel bans on the figures concerned.\n\nSupporters of repeal argued that measures directed at individuals should end when their diplomatic purpose had been served. Critics maintained that removal could restore the standing of officials whose conduct had brought them under international scrutiny without answering the allegations against them.\n\nThe vote ends these UN sanctions rather than passing judgment on any criminal charge. It neither orders foreign governments to receive the officials nor prevents separate proceedings under national law."
 UN_RESOLUTION.41.a:0 "The personal sanctions are lifted."
 UNPromptEffectLiftAssets:0 "- The UN unfreezes the national assets of [un_nation_global_target.GetName]."
 UNPromptEffectLiftOfficials:0 "- The UN lifts its sanctions on officials of [un_nation_global_target.GetName]."
