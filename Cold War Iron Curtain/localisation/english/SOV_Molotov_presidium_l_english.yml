 SOV_mpres_char_molotov_tt:0 "§YVyacheslav Molotov§!\nGeneral Secretary of the Central Committee. The last of the old Bolsheviks now holds the party in his hands.\n\nFaction: §iStalinist Old Guard§!\nPolitburo: §YFull member§!\nRelationship with the leader: §G+100§!\n\n§YDiplomat§!: Has sat across the table from Churchill and Truman.\n§YIdeologue§!: Guardian of doctrinal purity."
 SOV_mpres_char_molotov_tt_leader:0 "§YVyacheslav Molotov§!\nGeneral Secretary of the Central Committee. The last of the old Bolsheviks now holds the party in his hands.\n\n§YHow to read the panel§!\nNames: §Ygold§! full member, white candidate member, §ggrey§! not a member of the Politburo.\nFactions: §iStalinist Old Guard§!, §4Technocrats§!, §0Security Organs§!, §6Party Moderates§!, §uThe Army§!.\nHover over a portrait for his faction, standing and traits."
