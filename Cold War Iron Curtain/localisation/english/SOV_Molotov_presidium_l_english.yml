 SOV_mpres_char_malenkov_faction:0 "§4Technocrats§!"
 SOV_mpres_char_malenkov_tt:0 "§YGeorgy Malenkov§!\nChairman of the Council of Ministers. Runs the state machine and the economy from day to day.\n\nFaction: §4Technocrats§!\nPolitburo: §YFull member§!\nRelationship with the leader: §G+60§!\n\n§YApparatchik§!: A creature of the party machine who knows every file and every favour.\n§YPlanner§!: Thinks in tonnes, quotas and five-year horizons."
