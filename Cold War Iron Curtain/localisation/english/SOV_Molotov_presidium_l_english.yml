 SOV_mpres_char_kaganovich_faction:0 "§iStalinist Old Guard§!"
 SOV_mpres_char_kaganovich_tt:0 "§YLazar Kaganovich§!\nSecond Secretary of the Central Committee. The iron commissar now runs the party apparatus.\n\nFaction: §iStalinist Old Guard§!\nPolitburo: §YFull member§!\nRelationship with the leader: §G+70§!\n\n§YIndustrialist§!: Built factories from nothing, whatever the cost.\n§YBrutal§!: Signs lists without reading them."
