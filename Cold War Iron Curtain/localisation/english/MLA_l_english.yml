 ########## MLA INFANTRY
 
 MLA_infantry_equipment_0: "Arisaka Type 38 bolt-action Rifle"
 MLA_infantry_equipment_0_short: "Type-38"
 MLA_infantry_equipment_0_desc: "The Type 38 Arisaka was a bolt-action rifle used by the Malayan Liberation Army during the Malayan Emergency. Originally an Imperial Japanese World War II weapon, it was left behind in Southeast Asia , modified and acquired by communist insurgents. The Type 38 was prized for its long-range accuracy and rugged design, making it suitable for jungle warfare. Despite its age, it served the insurgents well in ambushes and guerrilla tactics against British and Commonwealth forces. Its 6.5mm cartridge had moderate recoil, allowing for better control in rapid engagements."

 MLA_infantry_equipment_1: "Avtomat Kalashnikova 1947"
 MLA_infantry_equipment_1_short: "AK-47"
 MLA_infantry_equipment_1_desc: "The AK47 is a fully automatic assault rifle developed in the Soviet Union by Mikhail Kalashnikov in 1947, but was not introduced into active service until 1948 where the fixed-stock version was sent in for production. In early 1949, the AK47 was accepted by the Soviet Armed Forces for mass deployment into front-line units. With a long-stroke gas piston, a selector/safety, an automated trigger and chambering mechanism, and further improvements to overall design the AK47 was a vast upgrade to the SKS. The AK47 would, for many years, be considered to be one of the world's most reliable and easy to maintain, handle, and learn weapons in the world."

 MLA_infantry_equipment_2: "ZB-63 Assault Rifle"
 MLA_infantry_equipment_2_short: "ZB-63"
 MLA_infantry_equipment_2_desc: "The ZB-63 is an automatic assault rifle designed by the PRC Government Arsenal in 1963. It san seen combat in Vietnam, Cambodia, Afghanistan, Kosovo, and Tuareg. The weapon features an internal mechanism similar to the AK and an external mechanism and casing similar to the SKS. This allows the weapon to compromise between range and automatic firepower effectively making it comparable to a long-range ZB-56. The weapon has an effective firing range that is twice the SKS's and slightly higher fire rate than the ZB-56. The weapon is very reliable and has a small price tag. In the 10 years it was manufactured, more than 1 million rifles were made."

 MLA_infantry_equipment_3: "ZB-81 Assault Rifle"
 MLA_infantry_equipment_3_short: "ZB-81"
 MLA_infantry_equipment_3_desc: "The ZB-81 is an automatic assault rifle that can be modified into a variety of weapons designed by Norinco in 1981. It has seen every Sino conflict since its inception including the Sino-Vietnam war, Afghanistan, and Sri Lanka. The ZB-81 is an improvement based off of the ZB-63 but does not have the same effective range. The weapon itself has more firepower than the ZB-63 and incorporates a variety of elements from the Dragunov, the SKS, and the AK47. Additionally, it has a longer service life than the AK47. Additionally, the weapon supports underbarrel attachments."

 MLA_infantry_equipment_4: "ZB-81A Assault Rifle"
 MLA_infantry_equipment_4_short: "ZB-81A"
 MLA_infantry_equipment_4_desc: "The ZB-81 is an automatic assault rifle that can be modified into a variety of weapons designed by Norinco in 1981. It has seen every Sino conflict since its inception including the Sino-Vietnam war, Afghanistan, and Sri Lanka. The ZB-81 is an improvement based off of the ZB-63 but does not have the same effective range. The weapon itself has more firepower than the ZB-63 and incorporates a variety of elements from the Dragunov, the SKS, and the AK47. Additionally, it has a longer service life than the AK47. Additionally, the weapon supports underbarrel attachments."

