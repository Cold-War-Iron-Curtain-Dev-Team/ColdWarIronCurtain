 #MLA MQJ Focus Descs
 MLA_Establish_MGQ_desc: "The Maláixiyà Qíngbào Jú (Malaysian Intelligence Agency) will be established to protect us from foreign infiltration and promote our interests across the continent."
 MLA_Thai_Destabilization_Campaign_desc: "With SEATO finally gone, we can see to exporting the revolution across the continent. Perhaps it's time we dealt with the Thai problem more directly."
 MLA_Attempt_to_Hijack_the_Malay_Nationalist_Movement_desc: "For decades now, there has been an ongoing Malay separatist movement in Southern Thailand. We will try to subvert its leadership and make their goals more in line with ours."
 MLA_Contact_Pathet_Lao_Splinters_desc: "Groups that split from the Pathet Lao are present in Thailand. We will enlist their help in overthrowing the Thai government."
 MLA_Coordination_with_the_CPT_desc: "Our strongest ally in Thailand is their communist party. We will help grow their influence in the country."
 MLA_Funnel_Heavy_Weapons_Through_Hat_Yai_desc: "The Thai Nation will be established in Northern Malay, it will be the birthplace of their revolution!"
 MLA_Insert_Opioids_Into_Thailand_desc: "One thing the Chinese learned from the British; to destabilize a country, flood it with addictive drugs."
 MLA_Start_Counterfeit_Operations_desc: "Nothing attracts revolution more than hunger and economic crisis. Let's give Thailand a little bit of the latter."
 MLA_The_Laotian_Civil_War_desc: "The people of Laos have risen to depose the reactionary, pro-French kingdom. They need our help!"
 MLA_Ship_Heavy_Artilery_Through_North_Vietnam_desc: "With Vietnamese help, we should be able to provide Laos with heavy artillery equipment."
 MLA_Provide_Entrenchment_Tools_desc: "The Laotians are in need of support equipment, let's provide them with some!"
 MLA_Send_Non_Combatant_Medics_desc: "The campaign in Laos will undoubtably be bloody, we'll send them some of our best medics to decrease casualties."
 MLA_Escelate_Involvement_desc: "We'll divert some of our industrial capacity to produce weapons and supplies for the Laotian revolutionaries."
 MLA_The_Cambodian_Civil_War_desc: "Civil war has erupted in Cambodia, should we intervene or stay neutral?"
 MLA_None_Of_Our_Business_desc: "We will not involve ourselves in this mess."
 MLA_Limited_Involvement_desc: "Our socialist brothers need our help!"
 MLA_Distribute_Pro_Khmer_Propaganda_desc: "The people of Cambodia will be made to see the prosperous future that awaits them under the Khmer regime!"
 MLA_Mobilize_Scouting_Aircraft_desc: "Our scouts will report enemy positions to our Khmer allies."
 MLA_The_Burmese_Civil_War_desc: "The Burmese government has been fighting the Burma Communist Party for decades now, perhaps we can tip the scales?"
 MLA_Persue_Prolonged_Malaysian_Involvement_desc: "We will not rest until the Burmese people are free from nationalist oppression!"
 MLA_Provide_Short_Range_Radios_desc: "Communication between our forces is crucial for our success."
 MLA_Airlift_Small_Arms_desc: "We will drop supplies in BCP-occupied territory to help them in their fight."
 MLA_Offer_Limited_Air_Support_desc: "Having proper air support will be a monumental boon to the BCP."
 MLA_Offer_Token_Aid_desc: "Twenty years of fighting and the BCP has barely made any progress. Our resources are better spent elsewhere."
 MLA_Pressure_Increased_Chinese_Involvement_desc: "If we can get the Chinese to intervene in Burma, victory will be assured!"
 MLA_The_American_War_desc: "American involvement has prevented the unification of Vietnam and caused thousands of unnecessary deaths. We must act."
 MLA_Industrial_Support_desc: "We cannot risk war with the United States. Limited, economic aid is the best we can offer."
 MLA_Transfer_Vietnamese_Industry_desc: "We will set aside some of our industry for the Vietnamese war effort."
 MLA_Malaysian_Boots_on_the_Ground_desc: "America has proven to be stubborn, only through direct intervention can we hope to dislodge her troops."
 MLA_The_Malaysian_Expeditionary_Force_desc: "The accomplishment of global revolution is a noble cause, one that the people of Malaysia are proud to fight and die for!"
 MLA_Anti-Aircraft_Shipments_desc: "The Viet Cong chafe under constant American air strikes, we need to provide them with the tools to counteract this."
 MLA_Increase_Involvement_in_Cambodia_desc: "We've made some progress, but the war rages on. It's time to double our efforts in Cambodia."
 MLA_Send_The_Special_Branch_desc: "§RIt's time for a specialist's touch...§"
 MLA_Assassinate_Pol_Pot_desc: "Pol Pot's insane ideas would taint socialism forever! He must be removed."
 MLA_Demand_Viet_Khmer_Cooperation_desc: "Cooperation between the Khmer and their Vietnamese neighbors will secure the success of both regimes. We'll make sure they get the message."
 MLA_Ensure_the_Survival_of_the_Khmer_Government_desc: "How Pol Pot carries revolution to Cambodia is none of our concern."
 MLA_Advise_the_Santebal_desc: "We can teach the Santebal a thing or two about maintaining order and rooting out counterrevolutionaries."
 MLA_Establish_a_Competent_Socialist_Administration_desc: "With Pol Pot out of the way, we can secure that power is transferred to the right hands."
 MLA_The_Thai_Civil_War_desc: "The time has come for Thailand's liberation!"
 MLA_Transport_Industry_to_Southern_Thailand_desc: "Some of our industry will be transferred to our Thai comrades, they will need it to secure victory and rebuild."
 MLA_Drastically_Increase_Arms_Production_desc: "The Thai military is not to be underestimated; our comrades will need all the guns they can carry."
 MLA_Deploy_the_National_Liberation_Army_desc: "It's time for us to get involved directly. Send in the troops!"
 MLA_Support_the_KNLA_desc: "The Karen National Liberation Army is only interested in independence. If socialism does not triumph in Burma, then her oppressed peoples must be freed through separation."
 MLA_Establish_New_White_Flag_Faction_Cells_desc: "There are Karen supporters of the socialist cause; we should embolden them to continue the fight!"
 MLA_Create_New_Khmer_Supply_Lines_desc: "The Khmer need more supplies, and we will provide."
 MLA_Join_the_Civil_War_with_Thailand_desc: "We helped them start this fight, and we will help them finish it! To Bangkok!"
 MLA_Increase_Weapon_Shipments_desc: "Revolution must come from within. We will equip them with all the tools they need but they must win this war themselves."
 MLA_Attempt_to_Influence_the_Laotian_Civil_War_desc: "With even further involvement, we can tip the scales in the Laotian Civil War and secure a victory for socialism!"
 MLA_Support_Maoist_Factions_of_the_Pathet_Lao_desc: "The Pathet Lao is a Marxist-Leninist movement, let's see if we can't increase the influence of the Maoist faction within it."
 MLA_Increase_Fighter_Shipments_desc: "With air superiority, there's no way the Pathet Lao could lose!"
 MLA_Provide_Engineers_to_Fix_Infrastructure_desc: "Laos will need to rebuild itself after their civil war, we can help with that."
 MLA_Establish_New_Supply_Lines_to_the_Pathet_Lao_desc: "The more supplies we can get to the Laotians, the better."
 MLA_Demand_Thai_Intervention_desc: "We helped the Thai throw off the shackles of oppression, now it's time for them to help in the global fight against despotism!"
 MLA_Maintain_a_Steady_Stream_of_Weapons_desc: "Thailand still needs time to stabilize itself before it can join the fight. We will help the Laotians ourselves."
 MLA_Increase_American_War_Involvement_desc: "We will not leave Vietnam until they are free from American meddling!"
 MLA_Strengthen_the_North_Vietnamese_War_Economy_desc: "The Vietnamese need more factories if they hope to compete with the American war machine."
 MLA_Subsidize_Vietnamese_Militarization_desc: "Subsidizing Vietnam's military research will go a long way towards achieving victory."
 MLA_Send_Portable_Anti-Aircraft_Equipment_desc: "The front is always shifting, our comrades will need portable heavy weapons."
 MLA_Temporarily_Transfer_Vulnerable_Industry_desc: "The Americans will not hesitate to decimate as much of Vietnam's industry as they can, we need to move it out of the country."
 MLA_Share_Industrial_Secrets_desc: "There are a few tricks we can teach the Vietnamese about industry."
 MLA_Attempt_Long-Term_Economic_Growth_desc: "The socialist government in Vietnam won't last long if the people are impoverished. We need to ensure that their economy will be strong in peacetime."
 MLA_Escalate_Troop_Deployment_desc: "We will overwhelm the American invaders with superior numbers!"
 MLA_Organize_Tiger_Divisions_desc: "Tigers strike fear in the hearts of even the most battle-hardened soldiers. The Tiger Divisions will do the same."
 MLA_Bombard_Coastal_Positions_desc: "American involvement in Vietnam is heavily dependent on her navy. §RBlow them up!§"
 MLA_Greatly_Increase_Air_Support_desc: "America is setting half the country on fire with all their bombing runs, our allies need more air support!"
 MLA_Send_the_Air_Force_to_Vietnam_desc: "It's time for a good, old-fashioned dogfight!"
 MLA_Evacuate_the_South_desc: "The war is over, it's time for our men to come home."
 
