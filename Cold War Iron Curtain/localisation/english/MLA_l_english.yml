 #MLA 70's Focus Descs
 MLA_Begin_Industrial_Reconstruction_desc: "The Modernization Campaign was a catastrophic failure, we need to address the consequences immediately."
 MLA_Request_Chinese_Agricultural_Aid_desc: "For the second time in recent memory, our people are suffering the effects of famine. Though it is not a permanent solution, Chinese food assistance will help alleviate the effects."
 MLA_Close_Mines_in_Perak_desc: "We need food, not rocks. The new mines in Perak are to remain closed until further notice."
 MLA_Scrap_Unfinished_Factories_desc: "The good thing about having unfinished factories is that they will be much easier to demolish."
 MLA_Decrease_Urbanization_desc: "Our current level of development cannot support cities of this size, they need to be scaled back."
 MLA_Allow_Local_Market_Activity_desc: "We have no choice but to allow local, private markets to be established. At least the effects of famine will subside."
 MLA_Pursue_Limited_Industrialization_desc: "Our goal is not to return to a pre-industrialized, agrarian society. We still want industry, just less of it."
 MLA_Divert_Resources_to_Failing_Agriculture_desc: "We moved too many people away from the farms into the cities and factories. This must be reversed."
 MLA_Scapegoat_the_Party_Intelligentsia_desc: "Somebody must be punished for the failure of the Modernization Campaign, and it will not be us!"
 MLA_Commence_Monetary_Reform_desc: "The Modernization Campaign was a massive success, but it proved very costly. We will have to reform and adjust the economy to the new realities of our nation."
 MLA_Decrease_the_Money_Supply_desc: "The people have more money than they know what to do with. It would be a good thing if it didn't cause mass shortages."
 MLA_Implement_Austerity_desc: "We are forced to implement austerity measures for the good of the economy. It will not be popular, but it is necessary."
 MLA_Purge_Incompetent_Banking_Officials_desc: "We have a robust system of accountability, but no system is perfect. Those who managed to slip through the cracks will be punished."
 MLA_Temporarily_Cut_Wages_desc: "In order to curtail our citizens' excessive spending, we will have to cut their wages."
 MLA_Inflate_Consumer_Prices_to_Market_Value_desc: "Counterfeit cash and the black market are major problems for our economy. It's time we dealt with them properly."
 MLA_Crack_Down_on_Foreign_Currency_Use_desc: "Foreign currency will no longer be usable in Malaysia."
 MLA_Start_Financial_Literacy_Programs_desc: "Most people have no idea how to use their hard-earned money responsibly, we will have to teach them."
 MLA_Declare_the_Monetary_Crisis_Over_desc: "We have weathered the economic crisis, now we can return our focus to the smooth function of government."
 
 MLA_Operation_Hantu_Lilin_desc: "In an effort to delegitimize us, our former colonial masters have re-established the reactionary government on the island of Borneo. They must be dealt with."
 MLA_Establish_MJQ_Networks_desc: "The MQJ will establish intelligence networks in East Malaysia to help in our liberation effort."
 MLA_Send_Abdullah_CD_to_Eastern_Malaysia_desc: "Abdullah CD will show the people of Eastern Malaysia the true horrors of their government and why they should support us in their liberation."
 MLA_Coopt_Independence_Movements_desc: "By infiltrating the nationalist organizations in East Malaysia, we can gradually turn them into pro-socialist movements friendly to our government."
 MLA_Lynch_Reactionary_Officials_desc: "The colonial regime's government has committed unspeakable crimes against our East Malaysian brothers. The only just punishment is death."
 MLA_Begin_Arming_Ethnic_Minorities_desc: "The minorities in East Asia are treated as lesser by the reactionary government. We will recruit them to fight by our side."
 MLA_Launch_the_East_Malaysian_Insurrection_desc: "Preparations are complete, it's time for the revolution to spread eastward!"
 MLA_Integrate_the_Revolutionary_Government_desc: "The Malaysian National Liberation Front has once again triumphed over the colonial reactionaries! Now it's time for all Malaysians to be united under socialist prosperity!"
 MLA_Begin_1975_7_Year_Plan_desc: "As expected, the British have left East Malaysia an impoverished, underdeveloped mess. It will take us years to bring them up to par, but it must be done!"
 MLA_Implement_Factory_Safety_Regulations_desc: "Our workers must be kept safe and productive!"
 MLA_Modernize_Hospital_Equipment_desc: "Whether it be a fatal disease or an inconsequential injury, our medical staff will have the best tools to treat it."
 MLA_Attempt_to_Crack_Down_on_Productivity_Stagnation_desc: "A problem with developed countries is the eventual stagnation of productivity. Higher quotas ensure continued growth."
 MLA_Jumpstart_the_Eastern_Malaysian_Economy_desc: "There is plenty of land that can be used for development, we'll start clearing it out."
 MLA_Increase_Pensions_desc: "The economy is currently strong enough to afford an increase in pensions."
 MLA_Construct_the_Abdullah_CD_Shipping_Yard_in_Kuching_desc: "East Malaysia needs its own shipyard, we cannot rely solely on Malacca."
 MLA_Prospect_For_Iron_Deposits_in_Sarawak_desc: "There are riches under the earth just waiting to be found!"
 MLA_Construct_the_North_Borneo_Auto_Plant_desc: "Automobiles are increasing in popularity across the socialist world, we should begin manufacturing our own!"
 MLA_Modernize_Nascent_Ports_desc: "The ports and naval bases in East Malaysia are quite outdated, they need some investment."
 MLA_Update_State_Rail_Networks_desc: "Efficient transportation of goods is essential; East Malaysia's rail system must be brought up to speed."
 MLA_Pave_Dirt_Paths_in_Suburban_Limbang_desc: "In a modern country like this one, dirt paths are unacceptable."
 MLA_Establish_the_Malaysian_Logging_Industry_desc: "The number of trees we've cleared for development is huge, we could build a whole industry out of it!"
 MLA_Launch_Efficent_Agriculture_Programs_desc: "Further advancement of farming techniques will greatly increase our output!"
 MLA_Build_Experimental_Offshore_Wind_Turbines_desc: "Windspeeds are much stronger offshore than on land, let's see if we can't harness that strength with our new wind turbine designs!"
 MLA_Create_Advanced_Typhoon_Shelters_in_Urban_Areas_desc: "Typhoons are an unfortunate fact of life in East Asia. The better prepared we are to deal with these natural disasters, the less damage they cause."
 MLA_The_East_Malaysian_Disaster_desc: "Our efforts to liberate East Malaysia have failed. Clearly, traitors within the ranks allowed this to happen."
 MLA_Begin_the_Second_Red_Terror_desc: "We will not rest until all those responsible for the East Malaysian Disaster have been brought to justice."
 MLA_Begin_Military_Purges_desc: "Any soldier who hesitated during the East Malaysian Insurrection must be considered a reactionary collaborator."
 MLA_Execute_Abdullah_CD_desc: "Abdullah CD was supposed to inspire the East Malaysian people to join our cause. His failure is tantamount to treason."
 MLA_Found_the_Sungai_Reeducation_Facility_desc: "Difference of opinion cannot be tolerated; it breeds corruption and can result in destruction."
 MLA_Expand_Labor_Camps_in_Kota_Bharu_desc: "You will pay for your crimes against the state with hard work and toil."
 MLA_Clamp_Down_on_Intelectual_Reformism_desc: "We cannot be swept up in the tide of reform and liberalization; our ideals are unshakable."
 MLA_Liquidate_Remaining_Intellegencia_desc: "What few reformers and idealists haven't already been detained will soon be dealt with."
 MLA_Unleash_the_Malaysian_Red_Gaurd_desc: "Having the Red Guard openly operate in plain view of the people will... encourage compliance."
 MLA_Blame_the_Timil_for_the_Military_Disaster_desc: "Clearly, the Tamil harbor sympathy for the old regime. Why else would they have sabotaged our efforts?"
 MLA_Escelate_to_a_Full_Great_Purge_desc: "Traitors are everywhere. We cannot stop until every single one has been liquidated."
 
 MLA_CPM_Reformist_Takeover_desc: "Chin Peng has demonstrated gross incompetence as Chairman and plunged our country into an unprecedented economic disaster. New leadership is needed."
 MLA_Maintain_Clergy_Repression_desc: "Religion is still a dangerous thing, the Party's attitude towards it will not change."
 MLA_Dismantle_the_Personality_Cult_desc: "The people put their trust in Chin Peng, only to be let down time and time again. He is unworthy of his heroic reputation."
 MLA_Open_Diplomatic_Relations_with_the_US_desc: "We have no ill will towards the United States of America, relations with them should be normalized."
 MLA_The_Johannesburg_Summit_desc: "It's time to move on from the past, we will seek an end to diplomatic hostility between us and the United Kingdom."
 MLA_Maintain_Anti_Soviet_Dogma_desc: "It is our position that the Soviet Union has caused great harm to the socialist cause in recent years."
 MLA_Begin_Limited_Privatization_desc: "Opening the market will encourage healthy competition and constant innovation."
 MLA_Construct_Forced_IP_Transaction_Legislation_desc: "Foreign intellectual properties will be seized and made to serve the state. The IP holders, naturally, will not approve."
 MLA_Attract_Western_Corporations_desc: "We will allow foreign companies to establish themselves in our country and stimulate the economy. All properly regulated as per Malaysian law, of course."
 
 MLA_Open_the_Malaysian_Tech_Industry_desc: "Chairman Peng has once again demonstrated his ability to lead our people! Here's to our continued growth under his guidance!"
 MLA_Reverse_Engineer_Western_Products_desc: "Western technology is quite advanced, let's see if we can't find out what makes it tick."
 MLA_Hire_European_Computer_Scientists_desc: "Computer experts from Eastern Europe can help us understand how these latest technological advancements work."
 MLA_Produce_a_Competitive_Computer_System_desc: "Our computer systems need to be able to compete with their Western counterparts."
 MLA_Found_the_MTDC_desc: "The Malaysian Technology Development Corporation will help bolster our electronics industry!"
 MLA_Open_Hardware_Manufacturing_Plants_desc: "We need to increase and modernize our production of computer hardware."
 MLA_Begin_Wireless_Computation_Research_desc: "Wireless communications are slowly becoming the norm, we cannot fall behind!"
 MLA_Open_the_National_Cybercrime_Division_desc: "As computers advance, their offensive capacity increases. We must defend against this nascent threat."
 MLA_Experiment_with_Cybernetic_Planning_desc: "A computerized system for central planning could be a massive boon, we should try to develop one!"
 
 MLA70s_The_Malaysian_National_Liberation_Army_desc: "The new decade will bring new challenges and threats, the MNLA must be ready for them."
 MLA70s_Malaysian_National_Liberation_Ground_Force_desc: "Conflict with East Malaysia is inevitable, our Ground Force must be ready to face the reactionary troops once again!"
 MLA70s_Malaysian_National_Liberation_Air_Force_desc: "Helicopters are the new standard in aerial warfare, we'd better learn how to use them properly."
 MLA70s_Malaysian_National_Liberation_Navy_desc: "Across the Straits, the imperialists plot our destruction. Our Navy will carry the revolution eastward!"
 MLA_Refine_Malaysian_Strategic_Doctrine_desc: "War has changed and our methods must change with it."
 MLA_Optimize_the_AK_for_Intense_Swamp_Warfare_desc: "Borneo is a land of thick jungles and swamps; we need to make sure our weapons will work properly in such an environment."
 MLA_Develope_Squad_Support_Weapons_desc: "Our troops need more support equipment to fight the imperialists, let's make sure they have all they need! "
 MLA_Research_Heat_Friendly_Uniforms_desc: "The heat in Borneo is intense, our men will need uniforms that can protect them from the elements."
 MLA_License_the_Z6_desc: "The Chinese Z-6 is a very impressive helicopter, we should study its design and build our own version!"
 MLA_Purchase_Mi24s_desc: "The Soviet Mi-24 has a low passenger capacity but makes up for it with raw firepower. Let's procure a few."
 MLA_Expand_Helicopter_Training_Programs_desc: "Our pilots and troops will be extensively trained in helicopter warfare."
 MLA_Create_a_Domestic_AGM_System_desc: "The future of anti-aircraft is with guided missile defense systems."
 MLA_Modernize_the_Escort_Fleet_desc: "Our fleet must be upgraded with all the latest advancements in naval warfare."
 MLA_Modernize_the_Tiger_Class_Submarine_desc: "Submarines are a core part of our Navy; we can't have them falling behind!"
 MLA_Begin_Naval_Helicopter_Research_desc: "Helicopters have proved very useful for ground combat; we should see how we can integrate them into the Navy."
 MLA_Construct_Cutting_Edge_Shipyards_desc: "The Malaysian National Liberation Navy will be the largest in all of Southeast Asia!"
 
