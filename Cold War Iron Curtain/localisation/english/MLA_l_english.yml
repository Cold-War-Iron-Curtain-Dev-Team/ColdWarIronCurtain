 TTM_Prepare_for_the_Thai_Civil_War_desc: "We have been given a golden opportunity for liberation, but we cannot rush to battle. We must prepare for what is to come."
 TTM_Request_Malaysian_Manpower_desc: "We will need the help of our Malaysian comrades in order to win this fight."
 TTM_Beg_For_Light_Arms_desc: "The MNLA has some very impressive weapons. Surely, they are willing to provide us with some."
 TTM_Operation_Orbweaver_desc: "The government will undoubtably try to destroy us before we are ready to fight. We need to bolster our defenses before that happens."
 TTM_Fortify_Hat_Yai_desc: "The provisional capital must be protected at all costs!"
 TTM_Boobytrap_the_Jungle_desc: "We need to establish a new court system, one that is free from monarchist influence."
 TTM_Begin_Tunnel_Construction_desc: "The people are understandably anxious about the current situation. We will divert some of our armed forces to maintain order."
 TTM_Create_a_Fluid_Border_desc: "Lands that previously served the rich and powerful will now be used to provide for the people!"
 TTM_Insight_Violence_in_Bangkok_desc: "Let it be known that Bangkok will be free from fascist influence soon!"
 TTM_Recruit_From_Local_Towns_desc: "We need more men to fight for the cause, and conscription will provide us with them."
 TTM_Encourage_Tactical_Withdrawls_desc: "Never again will our mothers and sisters be denied their dignity!"
 TTM_Be_Strong_desc: "Communes will help to oversee Thailand's transformation into a modern, industrialized nation!"
