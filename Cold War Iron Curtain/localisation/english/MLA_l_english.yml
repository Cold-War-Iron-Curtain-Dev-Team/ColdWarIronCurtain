 MLA_fighter_equipment_0: "Malayan National Liberation Air Force"
 MLA_fighter_equipment_0_short: "MNLAF"
 MLA_fighter_equipment_0_desc: "A Biplane fighter aircraft, the I-15 (developmental name TsKB-3) was known for its distinctive gull-wing, which gave it the nickname of Chaika. (Russian for Seagull) It was operated in large numbers by the Soviet Air Force, and was one of the two standard fighters utilized the Spanish Republican Air Force during the Spanish Civil War."
 MLA_fighter_equipment_1: "Yakolev Yak-3"
 MLA_fighter_equipment_1_short: "Yak-3"
 MLA_fighter_equipment_1_desc: "The Yakovlev Yak-3 was a single-engine, single-seat World War II Soviet fighter. Robust and easy to maintain, it was much liked by both pilots and ground crew. One of the smallest and lightest combat fighters fielded by any combatant during the war, its high power-to-weight ratio gave it excellent performance and it proved to be a formidable dogfighter."
 MLA_fighter_equipment_2: "Lavochkin La-7"
 MLA_fighter_equipment_2_short: "La-7"
 MLA_fighter_equipment_2_desc: "The Lavochkin La-7 was a piston-engined single-seat Soviet fighter aircraft developed during World War II by the Lavochkin Design Bureau. It was a development and refinement of the Lavochkin La-5, and the last in a family of aircraft that had begun with the LaGG-1 in 1938."
 MLA_fighter_equipment_3: "Lavochkin La-9"
 MLA_fighter_equipment_3_short: "La-9"
 MLA_fighter_equipment_3_desc: "La-9 represents a further development of the Lavochkin La-126 prototype. The first prototype, designated La-130 was finished in 1946. Similarity to the famous Lavochkin La-7 was only superficial – the new fighter had an all-metal construction and a laminar flow wing. Weight savings due to elimination of wood from the airframe allowed for greatly improved fuel capacity and four-cannon armament. Mock combat demonstrated that the La-130 was evenly matched with the La-7 but was inferior to the Yakovlev Yak-3 in horizontal planes. The new fighter, officially designated La-9, entered production in August 1946. A total of 1,559 aircraft were built by the end of production in 1948."
 
 MLA_jet_multirole_equipment_1: "Mikoyan-Gurevich MiG-9"
 MLA_jet_multirole_equipment_1_desc: "The MiG-9 Fargo was the first Mikoyan designed jet aircraft of the post WW2 era. Introduced in 1948. It saw limited combat and training use during the Chinese Civil War and Korean War. In total 610 aircraft were produced, solely by the USSR. The final MiG 9's were decommissioned by the PRC in 1951."
 MLA_jet_multirole_equipment_1_short: "MiG-9"
 MLA_jet_multirole_equipment_2: "Mikoyan-Gurevich MiG-15"
 MLA_jet_multirole_equipment_2_desc: "Perhaps one of the most iconic fighters of the Cold War, the Mikoyan-Gurevich MiG-15 Fagot entered service in 1947. The MiG-15 was involved in many conflicts since its introduction in the Korean War, where it proved a worthy adversary to the American F-86 Sabre and F9F Panther. A section of the Korean-Chinese border was nicknamed MiG Alley because of their prevalence in the area. Over 18 000 MiG-15s were built and used by many nations, most notably the USSR and Eastern Bloc nations. While most aircraft were decommissioned in the 1950's, some still remain in service with the North Korean Air Force."
 MLA_jet_multirole_equipment_2_short: "MiG-15"
 MLA_jet_multirole_equipment_3: "Mikoyan-Gurevich MiG-17"
 MLA_jet_multirole_equipment_3_desc: "A direct successor to the MiG-15 Fagot. Over 10 000 MiG-17 Fresco were produced from 1952. The MiG-17 was license built in the PLAAF as the Shenyang J-5. In total 20 nations used the MiG-17, spanning Africa, Europe and Asia. Its first combat deployment was in 1958, when PRC MiGs clashed with Nationalist Chinese F-86 Sabres over the Taiwan Strait. However, the MiG-17 primarily saw use in the Vietnam war with the NVAF and PLAAF were it scored 28 aerial victories. The MiG-17 was so successful that it even held its own against the much more modern, supersonic American Phantom II fighters of the Vietnam war. The MiG-17 was generally decommissioned in the 1970's, while it still remains in limited service in some African nations and North Korea."
 MLA_jet_multirole_equipment_3_short: "MiG-17"
 MLA_jet_multirole_equipment_4: "Mikoyan-Gurevich MiG-19"
 MLA_jet_multirole_equipment_4_desc: "The MiG-19 was the first Soviet production aircraft capable of supersonic speeds in level flight. A comparable U.S. "Century Series" fighter was the North American F-100 Super Sabre, although the MiG-19 primarily fought against the more modern McDonnell Douglas F-4 Phantom II and Republic F-105 Thunderchief over North Vietnam."
 MLA_jet_multirole_equipment_4_short: "MiG-19"
 MLA_jet_multirole_equipment_5: "Mikoyan-Gurevich MiG-21F-13"
 MLA_jet_multirole_equipment_5_desc: "The MiG-21 Fishbed is considered one of the earliest Soviet third generation fighters, incorporating beyond-visual-range missiles and pulse radar. The MiG-21 is the most produced supersonic jet in history, particularly large numbers were built in China and India under license. Over 11 000 have been built, serving in more than 60 countries spanning 5 continents. Over its lifetime MiG-21s scored 240 aerial kills. The MiG-21 served in many conflicts, including Vietnam (where it saw huge success), the 1971 India-Pakistan War, the Iran-Iraq War and many smaller conflicts. It remains in service after more than 6 decades."
 MLA_jet_multirole_equipment_5_short: "MiG-21F-13"
 MLA_jet_multirole_equipment_6: "Mikoyan-Gurevich MiG-21PF"
 MLA_jet_multirole_equipment_6_desc: "Production version of the all-weather interceptor. These were powered by the R11F2-300 turbojet and, starting with the seventh production batch, fitted with the RP-21 radar (the first six batches used the older TsD-30T radar (aka RP-9-21). Further, the weapons control system was modified from that of the F-13 to allow use of the RS-2US (aka K-5MS) beam-riding AAM in addition to the IR-seeking K-13."
 MLA_jet_multirole_equipment_6_short: "MiG-21PF"
 MLA_jet_multirole_equipment_7: "Mikoyan-Gurevich MiG-23M"
 MLA_jet_multirole_equipment_7_desc: "the MiG-23 was the first Soviet fighter to field a look-down/shoot-down radar and one of the first to be armed with beyond-visual-range missiles. Production started in 1969 and reached large numbers with over 5,000 aircraft built, making it the most produced variable-sweep wing aircraft in history. Today the MiG-23 remains in limited service with some export customers."
 MLA_jet_multirole_equipment_7_short: "MiG-23M"
 MLA_jet_multirole_equipment_8: "Mikoyan-Gurevich MiG-23ML"
 MLA_jet_multirole_equipment_8_desc: "The early "Flogger" variants had a number of design shortcomings, including airframe strength and reliability, engine performance, maneuverability and radar performance. A considerable redesign of the airframe was conducted, resulting in the MiG-23ML."
 MLA_jet_multirole_equipment_8_short: "MiG-23ML"
 MLA_jet_multirole_equipment_9: "Mikoyan-Gurevich MiG-23MLD"
 MLA_jet_multirole_equipment_9_desc: "The MiG-23MLD was the ultimate fighter variant of the MiG-23. The main focus of the upgrade was to improve maneuverability, especially during high AoA, which was identified as the MiG-23M/ML's chief shortcoming. The pitot boom was equipped with vortex generators, and the wing's notched leading edge roots were 'saw-toothed' to act as vortex generators as well. The flight-control system incorporated the SOS-3-4 synthetic stick-stop device/signals limiter."
 MLA_jet_multirole_equipment_9_short: "MiG-23MLD"
 MLA_jet_multirole_equipment_10: "Mikoyan-Gurevich MiG-29A"
 MLA_jet_multirole_equipment_10_desc: "The MiG-29 Fulcrum A was originally developed by the Mikoyan Design Bureau. It was the first 4th generation fighter to enter service with the USSR and Eastern Bloc. Incorporating improved avionics and greatly enhanced radar capabilities. The first MiG-29s were used as trainers by the Warsaw Pact with limited exports to India but had limited combat use. The MiG-29 would later become the base for widely produced variants such as the MiG-29S, MiG-29M and MiG-35."
 MLA_jet_multirole_equipment_10_short: "MiG-29A"

 MLA_mr_stealth_fighter_equipment_1: "Mikoyan MiG-29M"
 MLA_mr_stealth_fighter_equipment_1_short: "MiG-29M"
 MLA_mr_stealth_fighter_equipment_1_desc: "The MiG-29M/M2 aircraft is a revision of the basic MiG-29. It achieved a more robust multi-role capability with enhanced use of air-to-air and air-to-ground high-precision weapons. It also featured a considerably increased combat range, owing to an increase in its internal fuel capacity. A few changes took place during the aircraft's development. The redesigned airframe was constructed from a lightweight Aluminium-lithium alloy to increase the thrust-to-weight ratio. The air intake ramps' geometry was revised, the upper intake louvers were removed to make way for more fuel in the LERXs, mesh screens introduced to prevent foreign object damage (FOD) and inlet dimensions were enlarged for higher airflow."
 
 MLA_jet_light_equipment_1: "Yakovlev Yak-18"
 MLA_jet_light_equipment_1_short: "Yak-18"
 MLA_jet_light_equipment_2: "Mikoyan-Gurevich MiG-15UTI"
 MLA_jet_light_equipment_2_short: "MiG-15UTI"
 MLA_jet_light_equipment_2_desc: "In April 6, 1949, the OKB-155 team was officially entrusted with the development of a training version of the MiG-15 fighter. The prototype of the MiG-15UTI aircraft was manufactured by Plant No.1 during March-May 1949. The instructor's cabin on the UTI MiG-15 was placed by reducing the first fuselage fuel tank. Both pressurized cabins were equipped with ejection seats and pyromechanically-dropped lanterns.  The special equipment of the vehicle consisted of an ASP-1N automatic gun sight, an RSI-6K transceiver radio station, an RPKO-10M radio compass with an RPKO-10M marker, an SPU-2M intercom, a KP-14 oxygen device, and an AFA-IM camera. The armament consisted of one 23-mm cannon NR-23 with 80 rounds of ammunition and one UBK-E machine gun with 150 rounds of ammunition."
 MLA_jet_light_equipment_3: "L-29 Delfin"
 MLA_jet_light_equipment_3_short: "L-29 Delfin"
 MLA_jet_light_equipment_3_desc: "The Aero L-29 Delfín (English: Dolphin, NATO reporting name: Maya) is a military jet trainer developed and manufactured by Czechoslovakian aviation manufacturer Aero Vodochody. During the course of the programme, in excess of 3,000 L-29 Delfin trainers were produced. Of these, around 2,000 were reported to have been delivered to the Soviet Union, where it was used as the standard trainer for the Soviet Air Force."
 MLA_jet_light_equipment_4: "Aero L-39 Albatros"
 MLA_jet_light_equipment_4_short: "L-39 Albatros"
 MLA_jet_light_equipment_4_desc: "The Aero L-39 Albatros is a high-performance jet trainer developed in Czechoslovakia by Aero Vodochody. It was designed during the 1960s as a replacement for the Aero L-29 Delfín as a principal training aircraft. It was the first trainer aircraft to be equipped with a turbofan powerplant. The type was exported to a wide range of countries as a military trainer."
 MLA_jet_light_equipment_5: "Aero L-39ZA Albatros"
 MLA_jet_light_equipment_5_short: "L-39ZA Albatros"
 MLA_jet_light_equipment_5_desc: "Significantly upgraded L-39 for armed training and light attack, employing sturdier landing gear, a higher payload and notably provision for a GSh-23L 23-millimeter twin-barreled cannon attached in a conformal pod under the pilots' compartment, having a 150-round magazine within the airframe."

 MLA_tac_bomber_equipment_0: "Ilyushin DB-3"
 MLA_tac_bomber_equipment_0_short: "DB-3"
 MLA_recon_equipment_0: "Tupolev Tu-2R"
 MLA_recon_equipment_0_short: "Tu-2R"
 MLA_recon_equipment_0_desc: "Reconnaissance version of the Tu-2."
 MLA_jet_recon_equipment_0: "Mikoyan-Gurevich MiG-15Rbis"
 MLA_jet_recon_equipment_0_short: "MiG-15Rbis"
 MLA_jet_recon_equipment_0_desc: "In April 25, 1950 the OKB MiG started development a MiG-15 front-line reconnaissance variant with an AFA-BA/40 camera, which provides a strip survey width from 0.9 to 4.5 km with the length of the photographing route from 90 to 450 km at altitudes from 2000 to 10000m. Only one NR-23 cannon was installed on the aircraft. To increase the scout's range, D4-50 locks were subsequently installed on the beams, allowing 600-liter fuel tanks of improved shape to be suspended under the wing. In addition, a transponder "Barium-M" and additional 2 liter oxygen cylinder was installed on the machine."

