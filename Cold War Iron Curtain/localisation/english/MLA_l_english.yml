 #MLA 50's Focus Descs
 MLA_Anti_British_War_desc: "We did not resist the Japanese just so we could become puppets to the British again. We are long overdue for independence, and we'll take it by force if we have to."
 MLA_Retreat_to_the_Jungle_desc: "We are not ready to face the British openly just yet. For now, need to fall back and regroup."
 MLA_Take_Stock_desc: "We need to find out exactly how much equipment we have left."
 MLA_Expand_Min_Yuen_desc: "Considering that supplies such as food, equipment, and ammunition are essential for our operations, we should expand our civilian wing, the Min Yuen, to ensure we have someone to provide for us logistically."
 MLA_Expand_Non-Chinese_Supporter_Bases_desc: "It is not just the Chinese, but also Malays and Indians who chafe under British rule. We should appeal to these people as well and promote our cause outside of the Chinese community."
 MLA_A_Pragmatic_Future_desc: "Since the majority of Malaya's population is not Chinese, we should take a pragmatic approach and appeal to non-Chinese citizens as well."
 MLA_Recruit_Naryanan_desc: "Narayanan, a local Indian trade unionist, is known to be a troublemaker in British-occupied Malaya. Let us recruit him to our cause and promote syndicalism in our party."
 MLA_Tolerate_non_Marxist_Views_desc: "Not everyone in Malaya carries Marxist views, but most agree that colonialism must end. We will tolerate those that share in our anti-colonial struggle in order to promote a united front against the British."
 MLA_Resolve_Racial_Inequality_desc: "The British divided us by race and then pitted us against each other, a clasic colonial tactic. We should work to ease tensions between the different peoples and promote cooperation between us."
 MLA_All_Together_desc: "Together, we are united under the anti-colonial cause. Together, we shall fight to liberate Malaya and Southeast Asia from foreign rule once and for all!"
 MLA_Show_Ethnic_Chinese_the_Rights_of_Humans_desc: "Our numbers will bolster tremendously if we show the people the bright future that awaits them should we triumph."
 MLA_Maintain_Marxist_Purity_desc: "Revisionist elements in the movement would make us no different than our colonial oppressors. We must stay true to the Marxist cause in our anti-colonial struggle."
 MLA_Radical_China_desc: "As the minority ethnicity in Malaya, the Chinese remain oppressed under colonial rule. We should take advantage of this fact and bolster our influence among them."
 MLA_Promote_Nanyang_desc: "The ethnic problem between the non-Chinese and the rest of the population is one of the big reasons why we do not have unity within our movement. We should promote the idea of Nanyang, or cultural synthesis, to unite the people."
 MLA_Enforce_Revolutionary_desc: "There is no such thing as a half-revolution. You are either with us in our struggle for freedom, or you are not."
 MLA_Maintain_Sinophilic_Views_desc: "While many Malayan Chinese have called Malaya home for generations, they still view China as the motherland and retain ties with relatives back home. We see nothing wrong with this. After all, there is much we can learn from the People's Republic."
 MLA_Ditch_Non-Chinese_desc: "Unlike our Chinese supporters, many of our non-Chinese followers do not share the our values nor do they fully agree with our cause. Let us purge them to prevent our movement from collapsing into infighting."
 MLA_Show_the_British_a_Way_Out_desc: "There's the door. You can walk out peacefully... or you can be thrown through it."
 MLA_Raid_Perak_desc: "We must strike West towards Perak!"
 MLA_Attack_Kuala_Lumpur_desc: "We must strike South towards Kuala Lumpur!"
 MLA_Assault_Terrengganu_desc: "We must strike North towards Terengganu!"
 MLA_Operations_of_1950_desc: "We are ready for the next stage in our liberation war. 1950 will be the year of Malaysian freedom!"
 MLA_Lessons_From_Comrade_Mao_Zedong_desc: "In China, Mao took a small guerrilla force and turned it into an organized army capable of victory. We must follow his example."
 MLA_Lessons_From_Uncle_Ho_Chi_Minh_desc: "We can worry about organization and professionalism later. Right now, we have a war to win, and that requires strength in numbers."
 MLA_Victory_in_the_Hearts_and_Minds_desc: "To achieve total victory, we must win the hearts and minds of the people."
 MLA_Pengang_Ambush_desc: "It is time for another westward raid!"
 MLA_Bukit_Kepong_Incident_desc: "It is time for another southward raid!"
 MLA_Battle_of_Semur_River_desc: "It is time for another northward raid!"
 MLA_OPERATION_TERMITE_desc: "All together now, towards the capital!"
 MLA_Request_Eastern_Bloc_Equipment_desc: "We need more equipment in order to defeat the colonial regime. The Soviets and their allies should be willing to give us some."
 MLA_Intercept_British_Convoys_desc: "By raiding the British supply convoys, we can deprive the colonial armies of critical supplies and weapons."
 MLA_Intensify_Anti-Colonial_Propaganda_desc: "Our message is not resonating with as many people as we hoped. We must redouble our propaganda effort."
 MLA_Raid_Jungle_Bases_From_Perak_desc: "One last push eastward!"
 MLA_Raid_Jungle_Bases_From_Kuala_Lumpur_desc: "One last push southward!"
 MLA_Raid_Jungle_Bases_From_Terrengganu_desc: "One last push northward!"
 MLA_Victory_Against_the_British_desc: "Thrice we went in, thrice they threw us out. We are beaten, the war is lost."
 
 MLA_Strike_the_Heart_of_Colonial_Rule_desc: "Our forces under comrade Chin Peng are preparing for a final campaign to liberate Singapore by targeting the last colonial garrisons under Field Marshal Temple. The plan involves a swift and coordinated assault to dismantle British defenses and capture the city. If successful, the liberation of Singapore will mark a significant victory for the Malaysian Liberation Army and force the British to accept the inevitable."
 MLA_Entrench_Johor_Bahru_desc: "Fortifying our position within the city limit will greatly increase our chance of success!"
 MLA_Inspire_the_People_of_Singapore_desc: "The people of Singapore will be made to know that liberation has finally come!"
 MLA_Shell_the_City_desc: "We need to destroy the city's strong defenses from a distance."
 MLA_The_Battle_of_Singapore_desc: "CHARGE!"
 MLA_Transfer_the_Capital_desc: "The city is ours! Singapore will be reborn, transformed from a symbol of imperialist oppression into one of socialist liberation!"

 MLA_Found_the_Peoples_Republic_of_Malaysia_desc: "The war has been won; we are free! On this momentous day, we proclaim the foundation of the People's Democratic Republic of Malaysia!"
 MLA_Chairman_Chin_Peng_desc: "Chin Peng has brilliantly led the Malaysian people as a soldier, he will continue to do so as Chairman!"
 MLA_Put_Tunku_Abdul_Rahman_on_Trial_desc: "Tunku Abdul Rahman is a self-serving whore, having sold himself to both the British and Japanese. Justice must be done."
 MLA_Execute_Gerald_Templer_desc: "Gerald Templer is guilty of crimes against the people of Malaysia. His sentence is as follows: death by firing squad."
 MLA_Our_Place_in_the_Socialist_World_desc: "Tensions between our comrades in the socialist world are growing, should we pick a side or try to remain neutral?"
 MLA_Co-rule_With_Shamsiah_Fakeh_desc: "Fakeh is right. We will establish a collective leadership and pursue good relations with both socialist superpowers."
 MLA_Chinese_Alignment_desc: "The problem with being on the fence is that you could get impaled on it. Chairman Mao's ideas are more in line with ours, we will follow his example."
 MLA_Invite_Soviet_Advisors_desc: "Soviet advisors will help us catch up to the rest of the socialist world."
 MLA_Establish_Contacts_With_the_KGB_desc: "The KGB has mastered the art of protecting its citizens from dangerous subversive activity. We should study their methods."
 MLA_Invite_the_Dalai_Lama_to_Malaysia_desc: "Many Malaysians, including Chairman Peng, are Buddhists. Hosting the Dalai Lama would be a great honor."
 MLA_Foster_Close_Relationships_With_Vietnam_and_Laos_desc: "Having good relations with our neighbors across the Gulf will be very beneficial."
 MLA_State_Visits_to_the_Eastern_Bloc_desc: "Chairman Peng will tour the Eastern Bloc, establishing diplomatic relations as he goes along."
 MLA_Condemn_the_Chinese_Invasion_of_Tibet_desc: "We promised neutrality, and we meant it. We will establish strong trade and diplomatic relations with the People's Republic, not just the Soviet Union."
 MLA_Join_Comecon_desc: "We will submit a formal application to become a full member of Comecon."
 MLA_Distance_Malaysia_From_the_Dalai_Lama_desc: "We must not allow personal beliefs to interfere in foreign policy. The Dalai Lama is an enemy of socialism; therefore, he is an enemy of us."
 MLA_Endorse_Chinas_Nine_Dash_Line_Claim_desc: "Chinese claims to the islands located in the South China Sea are completely legitimate, we will side with them on the issue."
 MLA_Condemn_Soviet_Revisionism_desc: "Comecon is more about maintaining Soviet influence than proper economic aid. It is ultimately detrimental to socialist cooperation."
 MLA_Fund_the_Khmer_Rouge_desc: "Our comrades in Cambodia need all the help they can get in their fight against despotism!"
 MLA_Demand_Japanese_Compensation_For_War_Crimes_desc: "Japan refuses to apologize or even acknowledge the crimes they committed against our people during the Second World War, this is outrageous!"
 MLA_Spread_Maoism_throughout_Southeast_Asia_desc: "Maoism is more compatible with the Southeast Asian reality than orthodox Marxist-Leninism. We will promote the spread of Chairman Mao's ideas throughout the region."
 MLA_Chinese_Economic_Aid_desc: "We could certainly use some help in transforming Malaysia into a proper worker's state, perhaps our Chinese comrades would be willing to assist?"
 MLA_Consolidate_Our_Power_desc: "We wish it were unnecessary, but sometimes the people must be protected from themselves."
 MLA_Create_a_Comprehensive_Criminal_Code_desc: "The criminal code is full of obsolete references to British law and other foreign judiciary customs. We need to rewrite it from scratch."
 MLA_Try_British_Pilots_for_Chemically_Induced_Famines_desc: "RAF pilots purposefully used chemical warfare to instigate famine and starve the people of Malaysia. They will be tried and punished accordingly."
 MLA_Purge_Lau_Yews_Treasonous_Body_guards_desc: "Evidence suggests that Lau Yew, a prominent member of the Party who was killed in 1948, was betrayed by his own bodyguard. He and any other suspected traitor must be dealt with."
 MLA_Show_Mercy_to_British_Collaborators_desc: "We will show a certain degree of leniency to some low-level collaborators of the British colonial regime."
 MLA_Public_Execution_of_Colonial_Landlords_desc: "The colonial landlords brutally exploited our people and severely punished those who would not comply. It is their turn to face justice."
 MLA_Hunt_Down_Rogue_Japanese_Units_desc: "Reports have come in that a small number of Japanese units are still conducting combat operations deep in rural Malaysia, unaware that the war has been over for over half a decade. We need to get rid of them. "
 MLA_Liquidate_Remaining_Colonial_Enclaves_desc: "There are still a few remnants of the colonial regime out there. They must be hunted down and defeated."
 MLA_Found_the_Agricultureal_Safty_bureau_desc: "The Agricultural Safety Bureau will ensure strict adherence to food quality standards. The Malaysian people will never have to tighten their belts again."
 
 MLA_Recreate_Malaysia_desc: "All vestiges of colonial rule must be swept away. When our work is done, Malaysia will be unrecognizable, it will be a true socialist paradise!"
 MLA_Deal_with_the_Great_Famine_desc: "The famine is the direct result of brutal colonial policies and chemical warfare. Regardless, it is up to us to fix it."
 MLA_Irrigation_Efforts_To_Chin_Peng_City_desc: "The capital needs fresh water; we should set up an irrigation system to help the city."
 MLA_Create_Basic_Filtration_Standards_desc: "The pollution in our drinking water is staggering, we are in desperate need of a filtration system to prevent the spread of disease."
 MLA_Disinfect_Livestock_desc: "Our livestock are covered in filth, they need to be disinfected in order to alleviate the famine."
 MLA_Scrub_the_Countryside_of_Defoliants_desc: "The RAF's chemical warfare campaign has contaminated much of our farmland. It will have to be thoroughly scrubbed before it is safe to use."
 MLA_Create_New_Agriculture_Plots_desc: "There is still plenty of arable land that can be set aside for farming, let's make it so!"
 MLA_Request_Grain_From_the_Soviet_Union_desc: "We are working tirelessly to solve the famine. Until the work is done, we will import some Soviet grain to hold us over."
 MLA_Temporarily_Restrain_collectivization_desc: "We cannot risk a disruption in the food supply right now. Collectivization will have to be postponed for an undetermined amount of time."
 MLA_Cover_Up_the_True_Extent_of_the_Famine_desc: "If the people knew how bad things really were, they would lose faith in our ability to solve the problem. The world will only know what it needs to."
 MLA_Literacy_Campaign_desc: "Illiteracy is high among our people; we will rectify this with a grand literacy campaign!"
 MLA_Rebuild_Local_Schools_desc: "Ignorance is a tool of imperialist oppression. In the new Malaysia, every child will receive a comprehensive education!"
 MLA_Promote_Simplified_Chinese_desc: "Chinese make up our second-largest ethnic group. We will educate them using the newly introduced simplified language."
 MLA_Create_Positive_Living_Pamphlets_desc: "A clean body is a healthy body, and a healthy body is a productive body. We will distribute pamphlets detailing how to maximize hygiene to the people."
 MLA_Invite_Eastern_Bloc_Teachers_desc: "To help us build a comprehensive socialist curriculum, we will invite teachers from the German Democratic Republic to our schools."
 MLA_Study_Abroad_Programs_to_the_DPRK_desc: "The DPRK has very high educational standards. What better place to send our young workers to learn?"
 MLA_Enforce_Manditory_School_Attendence_desc: "Truancy will not be tolerated. Education is mandatory."
 MLA_Begin_Door_to_Door_Reading_Lessons_desc: "We will send teachers to rural areas where they will teach every single person who lives there how to read."
 MLA_Politicize_Education_desc: "Integrated into our curriculum is a strong emphasis on the importance of loyalty to the Party and the cause of socialism."
 MLA_Found_Chin_Peng_University_desc: "Chin Peng University will be the pinnacle of our education system, the finest institute for higher learning in all of Malaysia!"
 MLA_Jumpstart_Colonial_Industry_desc: "Whatever industry is left after the Liberation War must be repaired."
 MLA_Redistribute_Colonial_Property_desc: "Land that used to belong to the colonial authorities will be seized and redistributed for development."
 MLA_Attempt_to_Reopen_Rubber_Plants_desc: "Rubber is a key component in many products, both civilian and military. We should restart production of it as soon as possible."
 MLA_Increase_Workers_Pension_desc: "Our workers deserve fair compensation for their hard work in rebuilding Malaysia."
 MLA_Request_Soviet_Technical_Expertise_desc: "Unsurprisingly, the British never taught us how to properly manage or maintain any of the machines they forced us to work with. The Soviets are willing to help remedy that."
 MLA_Unearth_Bombed_Munitions_Plants_desc: "The munitions factory in Kuala Lumpur will be repaired and made to serve the Malaysian National Liberation Army!"
 MLA_Salvage_the_Electric_Grid_desc: "The electrical infrastructure was mostly destroyed during the Liberation War. Repairs should be made soon."
 MLA_Backyard_Smelteries_desc: "Our industrial capacity is growing, but not quickly enough. We will follow Chairman Mao's example and encourage civilians to produce their own steel using backyard furnaces."
 MLA_Create_Industrial_Training_Programs_desc: "Before we can become an industrial powerhouse, our people will need proper training."
 MLA_Construct_the_Kuala_Lumpur_Steel_Plant_desc: "The Kuala Lumpur Steel Plant will provide our military with all the tools they need to protect the people!"
 
 MLA_Count_The_Dead_desc: "All revolutions come with a cost, but surely it is not so bad. After all, could we really have done worse than the British?"
 MLA_Chin_Pengs_Disillusionment_with_Buddhism_desc: ""
 MLA_Declare_Religion_the_Enemy_of_the_Malaysian_People_desc: ""
 MLA_Dismiss_the_Clergy_From_Psitions_of_Power_desc: ""
 MLA_Create_an_Atheist_School_Curriculum_desc: ""
 MLA_Attempt_to_Assassinate_Tenzin_Gyatsos_desc: ""
 MLA_Crack_Down_on_Religious_Authorities_desc: ""
 MLA_Outlaw_Religious_Texts_in_Coopratives_desc: ""
 MLA_Found_a_Secular_Court_System_desc: ""
 MLA_Embrace_Socialist_Realism_desc: ""
 MLA_Demolish_Buddhist_Sites_of_Worship_desc: ""
 MLA_Strengthen_Chinese_Relations_desc: "China is our strongest ally; we must pursue closer relations between our countries."
 MLA_Exile_Christian_Priests_to_the_Jungle_desc: "Islam is a foreign religion that has caused our people great harm. Its influence will be wiped out."
 MLA_Prohibit_Public_Displays_of_Faith_desc: ""
 MLA_Ban_Religious_Clothing_desc: ""
 MLA_Declare_Malaysia_a_Secular_Nation_desc: ""

 MLA_The_Malaysian_Peoples_Liberation_Army_desc: "It is time for the MNLA to transition from a guerilla fighting force to a proper standing army."
 MLA_Malaysian_Peoples_Liberation_Ground_Force_desc: "The MNLGF is tasked with ground combat operations and, in extreme cases, maintaining national order."
 MLA_Malaysian_Peoples_Liberation_Air_Force_desc: "The MNLAF defends our cities from enemy bombers and protects our skies from aerial incursions."
 MLA_Embrace_Peoples_War_Doctrine_desc: "The concept of a people's war has proven successful in China and Malaysia, why shouldn't we embrace it?"
 MLA_License_the_AK_desc: "The Soviet Avtomat Kalashnikova are amazing combat rifles, we need them for the army."
 MLA_Found_the_Malaysian_Arms_Industry_desc: "We need to build up our military capacity, building factories specialized in weapons and munitions will help us achieve our goal."
 MLA_Build_Forts_on_the_Thai_Boarder_desc: "Let it not be forgotten that Thailand cooperated with the Japanese during the War. We need a strong border to protect ourselves in case they get any ideas."
 MLA_Import_Soviet_Yaks_desc: "Soviet Yaks are very impressive indeed, we should procure a few for our Air Force."
 MLA_Purchase_Soviet_Migs_desc: "The MiG is a marvel of modern aviation. We should purchase a decent stockpile from the Soviets."
 MLA_Study_Downed_British_Bombers_desc: "As hateful as the RAF is, their bombers are impressive. It would be a waste to not study their design."
 MLA_Open_Fighter_Research_Programs_desc: "Fighter jets are a key to victory in the air, we should focus on their development."
 fighter_multirole_bonus_desc: ""
 MLA_Malaysian_Peoples_Liberation_Navy_desc: "The MNLN protects our shores from enemy landings and naval bombardment."
 MLA_Invest_in_Destroyers_desc: "Destroyers still have much to offer, we should invest in their development."
 MLA_Construct_Naval_Bases_in_Terengganu_desc: "Terengganu will be the proud home of the Navy!"
 MLA_Marine_Training_Programs_desc: "The United States Marines' battles against the Japanese were inspirational. We should build our own Marine Corps!"
 MLA_Build_Dry-docks_in_Melaka_desc: "Even the strongest ships need maintenance. The Malacca Dry Docks will serve that purpose."
 
 #MLA Power Struggle focus tree desc
 MLA_Seek_Alternative_Paths_desc: "Chin Peng's movement completely sidelines many non-Chinese who initially supported it. Let us find alternatives to Chin Peng with either the Boestamamites or the Syndicalists."
 MLA_Support_Boestamamites_desc: "The Boestamamites are the true followers of the anticolonialism while retaining their Malay characteristics. Let us support Ahmad Boestamam and his supporters"
 MLA_Support_Syndicalists_desc: "The Syndicalists, while unorthodox, are popular among the common people. Let us follow Narayanan and his supporters."
 MLA_Chairman_Chin_Peng_desc: "Despite schemings from others, Chairman Chin Peng has triumphed over his opponents and he shall lead Malaya into greatness."
 MLA_Declare_Nanyang_desc: "Inspired by Mao's victory in the Chinese Civil War, we should declare the formation of Nanyang as a Chinese state within Malaya."
 MLA_Under_the_White_Sun_desc: "With the victory of the KMT in the Chinese Civil War, it is time for us to look toward Tridemism as the new ideology for Malaya."

