 MLA_lt_equipment_3: "PT-76"
 MLA_lt_equipment_3_short: "PT-76"
 MLA_lt_equipment_3_desc: "The PT76 is a Soviet amphibious light tank and was heavily exported around the world. It was designed by N Shashmyrin and Zh Kotin in 1951 and around 12,000 units were made. It requires a 3 man crew and a V6 straight six engine with a speed of 44 km/h and can swim at 10 km/h. It was exported to various Soviet-sphere and Soviet-leaning countries and as such as seen a recon role in virtually all conflicts of Soviet-sphere nations. However, it is still in use by many countries today due to its famous reliability and ease of maintenance."

 MLA_mbt_equipment_0: "T-34-85"
 MLA_mbt_equipment_0_short: "T-34-85"
 MLA_mbt_equipment_0_desc: "The T-34 is a Soviet medium tank that revolutionized the field of tank design and is well known for its reliability. The T-34 was designed in 1940 by KMBD in the Soviet Union. In an attempt to reduce costs, the sloped armor was introduced into the tank's design. However, this also led to the tank itself becoming far better protected as well as less expensive with a smaller surface area. The weapon itself is 76.2mm gun and had nominal ammunition carrying capacity. However, the sights and vision devices were notably poor making it difficult for tank commanders to operate and their poor coordination capability cut down a lot of the advantages the tank itself provided. The T-34 became the second most produced tank in the world but one of the most important in WWII. T-34s are still being used by insurgents and poorer nations today."
 MLA_mbt_equipment_1: "T-44"
 MLA_mbt_equipment_1_short: "T-44"
 MLA_mbt_equipment_1_desc: "The T-44 is a medium Soviet tank made closer to the end of WWII. It provided improved mobility and greater armor with a heavier 85mm main gun. It was designed by AA Morozov in 1944 however few were built as the tank was seen as too expensive for what advantages they provided. Only 2000 were built before production switched back to the T-34."
 MLA_mbt_equipment_2: "T-54"
 MLA_mbt_equipment_2_short: "T-54"
 MLA_mbt_equipment_2_desc: "The T-54 tank was the most produced tank in history. The tank was designed in 1946 by by KMBD. The tank itself uses a 100mm rifled gun and has varying armor thicknesses that ranges from 205mm to 60mm. The engine itself is a 38.88 liter V-12 diesel engine and the tank uses torsion bar suspension and was capable of speeds up to 48 km/h. The tank itself was used in more than 50 armies worldwide and saw production throughout the entire soviet sphere and all of their conflicts along with it. "
 MLA_mbt_equipment_3: "T-55"
 MLA_mbt_equipment_3_short: "T-55"
 MLA_mbt_equipment_3_desc: "The T-55 is an improved version of the T-54 tank. OKB-520 modified the T-55 design by improving NBC protection, giving it a more optimized engine, improving the turret shape, and even added more auxiliary equipment such as improved fire control and optics. Additionally, the T-55 used the 12.7 DShK HMG more often whereas the T-54 used the 7.62 SGMT gun, granting it more firepower but barring it from carrying more ammunition. The T-55 was used in just as many armies and typically saw all the conflicts that the T-54 saw. "
 
