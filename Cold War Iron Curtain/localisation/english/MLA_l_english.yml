 TTM_Destroy_Thai_Communication_Lines_desc: "Without effective communications, the Thai army will not be able to properly coordinate defenses and counterattacks."
 TTM_Shell_Royalist_Positions_desc: "The army has dug in, but this is inconsequential. We will easily root them out!"
 TTM_Call_Up_Reserves_desc: "It is time to call up and prepare our men in reserve, the war is upon us!"
 TTM_Begin_the_Thai_Civil_War_desc: "Now is the time, all must fight for the liberation of Thailand!"
 TTM_Move_the_Capital_To_Bangkok_desc: "Hat Yai has served us well, but Thailand's capital will always be Bangkok."
 TTM_Found_the_Peoples_Republic_of_Thailand_desc: "The war has been won! Let the world witness the birth of a new Thailand!"
 
