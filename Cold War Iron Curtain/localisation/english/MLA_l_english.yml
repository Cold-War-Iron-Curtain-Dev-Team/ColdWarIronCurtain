 TTM_Bait_the_Thai_Armed_Forces_desc: "The government has a long history of monarchist despotism and fascist collaboration, how can they claim to represent the people of Thailand?"
 TTM_Operation_Trapdoor_desc: "A coordinated strike between the Burmese and Thai governments would be fatal. We must strike them before they can."
 TTM_Improve_Fortifications_on_the_Burmese_Border_desc: "By procuring weapons from the Burmese army, we can supply our troops and help the BCP in their fight for liberation!"
 TTM_Capture_Stray_Burmese_Weapons_Caches_desc: "Our supplies are running low, we will have to acquire some from our Burmese neighbors."
 TTM_Steal_Thai_Artillery_Pieces_desc: "Coordinated strikes against the Burmese government between us and the BCP will be very beneficial for their revolution!"
