 #MLA 60's Focus Descs
 
 MLA_The_Sino_Soviet_Split_desc: "The differences between the Soviets and Chairman Mao have proven too great. Should we try to maintain neutrality on the issue or side with the Chinese?"
 MLA_Maintain_Dual_Leadership_desc: "This is between the Soviets and the Chinese. We will maintain our neutrality and attempt good relations with both."
 MLA_Foster_Close_Relations_With_Mao_desc: "China is still our close partner, despite our recent difference of opinion."
 MLA_Criticize_Soviet_Intervention_In_Hungary_desc: "The Soviet invasion of Hungary was completely unnecessary, the issue could well have been handled diplomatically with mediation from China."
 MLA_Meet_With_Khrushchev_desc: "In the years since Comrade Stalin's death, we have not sat down for a proper meeting with the new General Secretary of the USSR."
 MLA_State_Visit_to_Yugoslavia_desc: "Tito's brand of socialism is rather unorthodox, but we cannot deny it has greatly stabilized the Balkans. We could learn from him."
 MLA_Support_Global_De-Escalation_desc: "Tensions have been rising as of late, we should do our part to reverse this dangerous trend."
 MLA_Diplomatically_Support_North_Vietnam_desc: "Ho Chi Minh is fighting for the liberation of his people from a brutal colonial regime, just like we were not so long ago. He will have our support!"
 MLA_Deepen_Comecon_Collabaration_desc: "Further cooperation with Comecon will help us greatly."
 MLA_Purge_Shamsiah_Fakeh_desc: "Shamsiah Fakeh's ideas are nothing more than idealistic pipe dreams. She's become detrimental to our cause and therefore must be purged."
 MLA_State_Visit_to_Bejing_desc: "Wuhan is the site of a major battle that took place between the Japanese invaders and the Chinese. Chairman Peng will visit and pay his respects to those who bravely fought against imperialist occupation."
 MLA_Establish_Relations_With_Albania_desc: "Albania is ideologically closer to China than the Soviets, we should open diplomatic relations with them."
 MLA_Arrest_Soviet_Diplomats_desc: "Diplomats from revisionist countries are not welcome here."
 MLA_Close_the_Soviet_Embassy_desc: "Until the Soviet Union recommits itself to true Marxist-Leninism, we have nothing to discuss."
 MLA_Escalate_Anti-British_Sentiment_desc: "Expelling the British soldiers was not enough. Any civilians who stayed behind threaten the existence of an independent Malaysia!"
 MLA_Support_Pol_Pot_desc: "Pol Pot needs our help in freeing Cambodia from the hands of reactionary despots!"
 MLA_Request_Chinese_Financial_Aid_desc: "Stronger economic ties with China will help us greatly."
 MLA_Assert_Malaysian_Geopolitical_Independence_desc: "Never again will Malaysia be a puppet of foreign powers, we are a proud and self-sufficient people!"
 
 MLA_Expand_Malaysian_Intelegence_desc: "The old culture was irreversibly tainted by British imperialism. Just like in China, the old ways must be forgotten and replaced with new, socialist ideas and customs!"
 MLA_Infiltrate_South_Vietnam_desc: "Chairman Mao has begun the Great Proletariat Cultural Revolution, a movement aimed at annihilating all remnants of China's capitalist-imperialist traditions. We will emulate it verbatim!"
 MLA_Share_Intel_on_US_Military_Positions_desc: "Linguistic fragmentation is a threat to national unity, it cannot be tolerated. "
 MLA_Organize_Vietcong_Training_Camps_desc: "At the rate we are going, Mandarin will become the primary language of Malaysia. §RGood.§"
 MLA_Mislead_South_Vietnamese_Intelligence_desc: "Malaysia is every Chinese citizen's home away from home, we should encourage more of them to immigrate!"
 MLA_Allow_Volunteers_to_Join_the_Vietnam_War_desc: "Revolutionary Chinese literature is some of the best that's ever written, everyone should give it a read!"
 MLA_Begin_a_Misinformation_Campaign_desc: "Chinese holidays are truly spectacular, they're even popular in the West. As a matter of fact... let's adopt them!"
 MLA_Get_Involved_in_Laos_desc: "Like our Chinese brethren, we will promote the creation of a Red Guard to help the spread of socialism worldwide!"
 MLA_Send_Medics_and_Engineers_desc: "The Red Guard is a respected institution, behavior that contradicts this will not be tolerated."
 MLA_Send_Anti-Aircraft_Guns_desc: "Having eyes inside the Army will help us root out corruption."
 MLA_Airdrop_Small_Arms_to_the_Pathet_Lao_desc: "Revolution must come from within; the oppressed people of the world must take up arms and fight for liberation!"
 MLA_Provide_Low-Flying_Scouting_Aircraft_desc: "Any surplus equipment we have in stock should be distributed among the Red Guard."
 MLA_Request_Expanded_North_Vietnamese_Involvement_desc: "The crimes committed by the colonial regimes in Malaysia and the rest of the continent cannot be forgiven or forgotten!"
 MLA_Establish_the_Ministry_of_Internal_Affairs_desc: "The Ministry of Internal Affairs is tasked with ensuring strict discipline within the Party, the Army, and the civilian police."
 MLA_Infiltrate_Cooperatives_desc: "Cooperatives are essential to the economy, but even they can become corrupted. We'll make sure this does not happen."
 MLA_Greatly_Expand_Policing_desc: "The people must be protected. At times, even from themselves."
 MLA_Confiscate_Remaining_Religious_Texts_desc: "Are you sure you can trust your comrade? Can you guarantee that he is not a reactionary, or even a spy?"
 MLA_Open_Investigations_on_Suspected_CIA_Agents_desc: "The Americans have eyes and ears everywhere. In some countries, even at the highest echelons of government. We must root them out."
 MLA_Begin_Operations_In_Thailand_desc: "The first Secularization Campaign was a massive success, but there are still a few remaining holdouts. A second campaign is necessary."
 MLA_Ensure_CPT_Support_desc: "What few religious texts remain in Malaysia will be confiscated and destroyed. A single copy of these books can cause great suffering."
 MLA_Contact_Pathet_Lao_Cells_desc: "We will introduce Father John to Uncle Stripes. §RThey'll get along... deliciously.§"
 MLA_Provide_Assassination_Equpipment_desc: "Religious services, including private ones, will no longer be tolerated."
 MLA_Establish_Training_Camps_in_Northern_Thailand_desc: "The heroes of the Liberation War must be immortalized and celebrated forever!"
 MLA_Hijack_the_Malaysian_Nationalist_Movement_desc: "Our new culture has no need for gods and fairy tales."
 MLA_Sew_Mistrust_in_the_Thai_Government_desc: "Now that things have calmed down, we can relax our grip on the people and focus on other projects."
 
 MLA_Begin_Planning_The_Modernization_Campaign_desc: "Our construction efforts in the last decade were focused on rebuilding what the British and Japanese had destroyed. The next step is to modernize our industry and catch up with our comrades!"
 MLA_Accept_Soviet_Support_desc: "The Soviet Union has done a remarkable job at rebuilding after the Second World War. We should seek their guidance in our modernization effort."
 MLA_Create_the_Malaysian_State_Planning_Committee_desc: "A committee to properly oversee industrial development should be established."
 MLA_Lease_Malacca_to_the_USSR_desc: "A condition of Soviet support is a lease on the port of Malacca for 50 years."
 MLA_Support_Soviet_Interests_in_Southeast_Asia_desc: "The Soviets are helping us greatly, we will return the favor by promoting their cause and ideals to our neighbors."
 MLA_Secure_Soviet_Raw_Materials_desc: "We lack the materials necessary to modernize our industry, we'll have to rely on the Soviets to provide them."
 MLA_Import_Fertilizer_desc: "Soviet agriculture far exceeds ours; we could use their help in understanding the science behind it."
 MLA_Request_Soviet_Industrial_Schematics_desc: "Soviet industry is among the strongest in the world. Thankfully, they're willing to share the blueprints."
 MLA_Finalize_the_7_Year_Plan_desc: "We have everything we need. Thanks to the Soviets, we can begin to modernize!"
 MLA_Accept_Chinese_Support_desc: "China's transformation after two brutal wars is astonishing. We should follow their advice on how to modernize our country."
 MLA_Expand_Backyard_Furnaces_desc: "The backyard smelteries have served us well, we should increase their numbers!"
 MLA_Begin_Mass_Collectivization_Efforts_desc: "Because of the famine, we were never able to fully implement collectivization. Now that it has passed, we can do so properly!"
 MLA_Guarantee_Malaysian_Support_in_Chinese_Affairs_desc: "China and Malaysia are sister nations, the People's Republic will always have our full support!"
 MLA_Create_the_Kuala_Lumpur_Cooprative_desc: "We will establish a special cooperative in Kuala Lumpur to oversee the industrial development of the entire region."
 MLA_All_Peasants_Must_Work_desc: "Every man, woman, and child will contribute to the modernization effort!"
 MLA_Request_Additional_Manpower_desc: "We'll need some extra hands to complete our project. Special visas will be granted to Chinese workers who are willing to help."
 MLA_The_Malaysian_Great_Leap_Forward_desc: "We have everything we need. Thanks to our Chinese comrades, we can begin to modernize!"
 MLA_Launch_The_Modernization_Campaign_desc: "The planning phase is over. Now, the work can begin!"
 MLA_Continue_the_Mass_Literacy_Campaign_desc: "Our first literacy campaign focused on basic aspects, such as reading and writing. The next stage is to create a population of qualified and educated professionals."
 MLA_Expand_Higher_Education_Opportunities_desc: "Our country is in dire need of specialists, we should increase the number of universities."
 MLA_Promote_Bilingual_Programs_desc: "Every child will be fluent in Mandarin and Malay!"
 MLA_Emphasize_Mathematics_Studies_desc: "Math is an essential part of many trades; we should put special emphasis on its study!"
 MLA_Expand_Extracurricular_Activities_desc: "Sports and the arts are fundamental to child development, every school should have these programs!"
 MLA_Expand_Study_Abroad_Programs_in_the_DPRK_desc: "Our foreign exchange program with the DPRK has proven beneficial, let's expand it!"
 MLA_Create_the_CPS_College_of_Engineering_desc: "The Xinjipo City College of Engineering will be the best of its kind in the whole country!"
 MLA_Begin_Material_Science_Research_Programs_desc: "We should continue to deepen our understanding of matter and how it can be used to further develop our industries."
 MLA_Found_the_Kuala_Lumpur_Institute_of_Nuclear_Physics_desc: "We live in the Atomic Age yet have very little understanding of the atom. The top minds at KLINP will help us remedy that."
 MLA_The_New_Life_Initiative_desc: "The famine is still fresh in the memories of the people. We need to drastically increase our living standards through higher food production and increased healthcare availability."
 MLA_Provide_Free_Vaccination_desc: "With our latest advancements in medicine, cholera and other diseases that have plagued us for so long can be eradicated!"
 MLA_Construct_Rural_Clinics_desc: "Disease runs rampant in many parts of the country. By expanding access to healthcare, we can drastically improve the quality of life in these areas."
 MLA_Attempt_Agricultural_Mechanization_desc: "Nearly all our agriculture is still done using traditional methods. In the face of growing industrialization, this seems extremely counterproductive."
 MLA_Create_New_Plots_in_Terengganu_desc: "There is plenty of arable land ripe for cultivation in Terengganu. Let's get to planting!"
 MLA_Streamline_Collectivization_desc: "Malaysia is finally ready to implement agricultural collectivization!"
 MLA_Irrigation_Efforts_in_Large_Cooperatives_desc: "The farms need water, and we've got plenty of it to go around. We just need to move said water to where it's needed."
 MLA_Allow_Local_Farmers_Markets_desc: "Small markets where the farmers can sell their surplus produce will be permitted."
 MLA_Greatly_Expand_Fertilizer_Production_desc: "More farms means more fertilizer, we'd better ramp up production!"
 MLA_Provide_For_the_People_desc: "Living conditions in Malaysia have improved steadily since the Liberation War, but there is still room for improvement. It is time to improve housing, modernize the roads, and expand the consumer market."
 MLA_Adopt_Soviet_Housing_Design_desc: "Soviet housing is functional and comfortable, we should adopt their design."
 MLA_Redistribute_Colonial_Assets_desc: "Assets that were seized from the colonial regime will be distributed among the people. After all, it was always rightful Malaysian property!"
 MLA_Construct_Textile_Mills_in_Kuala_Lumpur_desc: "The world will always need textiles; we should build some mills to produce them!"
 MLA_Produce_Quality_of_Life_Products_desc: "Radios, modern cookware, toaster ovens; if you can dream it, you can buy it!"
 MLA_Research_Efficient_Production_Methods_desc: "To keep up with increased demand, we will develop more efficient methods of production."
 MLA_Create_a_Modern_Road_Network_desc: "Dirt paths and cobblestone are things of the past. Let the asphalt flow!"
 MLA_Create_Power_Plants_in_Urban_Areas_desc: "With every advance we make, our need for raw power increases. Let's make sure we meet demand."
 MLA_Construct_the_S.A._Ganapathy_Railway_desc: "The S.A. Ganapathy Railway will provide Malaysia with a modern national rail system!"
 MLA_Establish_the_Malaysian_Mining_Industry_desc: "It's time to transform Malaysia from a mostly agrarian society into a modern, industrialized nation."
 MLA_Modernize_Excavation_Technology_desc: "Geological surveys suggest that there are still untapped mineral deposits in Malaysia, we just need the proper tools to reach them."
 MLA_Expand_Heavy_Infrastructure_Development_desc: "Our infrastructure needs to be expanded if we're to be considered a developed nation."
 MLA_Recall_Backyard_Furnaces_desc: "Our industrial capacity has grown to the point where backyard smelteries are no longer required."
 MLA_Prospect_For_Rare_Minerals_in_Perak_desc: "Rare earth metals and nuclear material are extremely valuable, we hope to find some in Perak."
 MLA_Construct_the_Pengang_National_Steel_Plant_desc: "Steel is an essential component of modern construction, let's make sure we produce plenty of it!"
 MLA_Open_the_V._Lenin_Boxite_Mine_desc: "Bauxite is the world's main source of aluminum, and we've just found a deposit of it in Pahang. Start digging!"
 MLA_Expand_Logistics_Networks_desc: "The efficient transportation of supplies across our nation must be ensured."
 MLA_Become_the_World's_Largest_Tin_Producer_desc: "Tin is always in high demand, and we've got plenty of it to go around!"
 MLA_Declare_Malaysia_a_Second_World_Nation_desc: "After countless hours of hard work, the Modernization Campaign is finally complete! We've gone from an impoverished, post-colonial country to a prosperous, second-world nation!"
 
 MLA60s_The_Malaysian_Peoples_Liberation_Army_desc: "The MNLA has faithfully served the people for ten years! It is time to provide them with the tools they need to do it for another ten!"
 MLA60_Malaysian_Peoples_Liberation_Air_Force_desc: "Let's see how we can improve our Air Force."
 MLA60_Malaysian_Peoples_Liberation_Ground_Force_desc: "Let's see how we can improve our Ground Force."
 MLA60_Malaysian_Peoples_Liberation_Navy_desc: "Let's see how we can improve our Navy."
 MLA_Modernize_Defenses_on_the_Thai_Border_desc: "The fortifications on our border with Thailand are showing their age, they're in need of an overhaul."
 MLA_Improve_the_AK_Platform_desc: "The AK's design has improved radically in the last ten years!"
 MLA_Establish_the_Special_Branch_of_the_MPLA_desc: "We will establish a special branch of the Army tasked with the accomplishment of missions that cannot always be discussed."
 MLA_Improve_Jungle_Warfare_Capabilities_desc: "§RWhy are the trees speaking Malay?§"
 MLA_Begin_Bomber_Research_Programs_desc: "We've learned all we can from the RAF's old bombers, now we need to design our own."
 MLA_Import_North_Korean_Migs_desc: "The latest MiG design is incredible, we must have them!"
 MLA_Found_the_Malaysian_Paratrooper_Corps_desc: "Scores of our men will fall from the sky to deliver swift justice on the hated imperialists!"
 MLA_Modernize_Transport_Planes_desc: "... but first, we'll need some new transport planes. "
 MLA_Begin_Frigate_Production_desc: "Frigates may be old, but they are very effective against submarines."
 MLA_Develop_the_Tiger_Class_Submarine_desc: "You never know what's under that water. Once we have submarines, we will."
 MLA_Organize_a_Formal_Marine_Corps_desc: "Our Marine Corps has operated as a branch of the Navy since its inception. Perhaps they are ready for the next step?"
 MLA_Research_Efficent_Landing_Crafts_desc: "Southeast Asia is made up of maritime nations. Should we ever need to pay our neighbors a visit, we'll need the best landing craft available."
 
