l_english:
 flavoreng.1.t:0 "[GetNewspaperHeader]The Brighton Bomb"
 flavoreng.1.d:0 "A bomb has torn through the Grand Hotel in Brighton during the Conservative conference. The prime minister was not harmed."
 flavoreng.1.a:0 "The hotel has been bombed."
 flavoreng.1.b:0 "A bomb in Brighton."
 flavoreng.2.t:0 "[GetNewspaperHeader]Piper Alpha"
 flavoreng.2.d:0 "The Piper Alpha platform has exploded in the North Sea. The rig is gone, and most of the men who were on it are dead."
 flavoreng.2.a:0 "The platform is gone."
 flavoreng.2.b:0 "A disaster in the North Sea."
 flavoreng.3.t:0 "[GetNewspaperHeader]The Poll Tax Riot"
 flavoreng.3.d:0 "A riot against the poll tax has run through central London. Trafalgar Square is wrecked, and the tax is now a crisis for the government."
 flavoreng.3.a:0 "The tax has a riot."
 flavoreng.3.b:0 "London has seen a riot."
 flavoreng.4.t:0 "[GetNewspaperHeader]The Good Friday Agreement"
 flavoreng.4.d:0 "Britain and Ireland have signed the Good Friday Agreement in Belfast. It sets up power-sharing in Northern Ireland and asks both sides to put the guns away."
 flavoreng.4.a:0 "The agreement is signed."
 flavoreng.4.b:0 "Belfast has an agreement."
