l_english:
 # USA Ideas
 USA_silicon_valley_genesis:0 "Silicon Valley Genesis"
 USA_silicon_valley_genesis_desc:0 "The rapid concentration of semiconductor manufacturers, research laboratories, and venture capital in the Santa Clara Valley has transformed Northern California into a global epicenter of microelectronics and technological innovation."
 USA_commercial_software_pioneers:0 "Commercial Software Pioneers"
 USA_commercial_software_pioneers_desc:0 "Treating computer code as intellectual property rather than amateur hobbyist playthings has birthed a commercially viable domestic software industry, spearheading global computing standards."
 USA_microsoft_msdos_hegemony:0 "Microsoft & MS-DOS Hegemony"
 USA_microsoft_msdos_hegemony_desc:0 "By retaining the non-exclusive licensing rights for MS-DOS on the IBM Personal Computer and clone architectures, Microsoft has established a worldwide operating system monopoly that underpins global business computing."
 USA_microsoft_windows_monopoly:0 "Microsoft Windows Monopoly"
 USA_microsoft_windows_monopoly_desc:0 "The explosive commercial triumph of Windows 3.0 has cemented the 'Wintel' PC standard as the ubiquitous operating environment for enterprise, education, and households worldwide."
 USA_digital_superpower:0 "American Digital Superpower"
 USA_digital_superpower_desc:0 "From the silicon foundries of the Bay Area to the software empire in Redmond, the United States commands unrivaled dominance across hardware, operating systems, and the emerging World Wide Web."

 # European Commodore & Home Computing Ideas
 EUR_commodore_digital_literacy:0 "Commodore Digital Literacy"
 EUR_commodore_digital_literacy_desc:0 "Under Jack Tramiel's vision of 'computers for the masses, not the classes,' Commodore PETs and VIC-20s have brought affordable computing into European secondary schools, polytechnics, and small businesses."
 EUR_c64_mass_computing:0 "C64 Mass Computing Boom"
 EUR_c64_mass_computing_desc:0 "The Commodore 64 has become the best-selling microcomputer across Western Europe, democratizing electronics and teaching millions of European youths BASIC programming and 6502 assembly."
 EUR_amiga_golden_age:0 "Amiga Golden Age"
 EUR_amiga_golden_age_desc:0 "The Commodore Amiga 500 represents the pinnacle of 16-bit home computing in Europe, offering unprecedented custom coprocessors, pre-emptive multitasking, 4096-color graphics, and four-channel stereo sound."
 EUR_demoscene_creative_culture:0 "European Demoscene Subculture"
 EUR_demoscene_creative_culture_desc:0 "An underground digital subculture of hacker clubs, demo groups, tracker musicians, and assembly wizards across Germany, Britain, and Scandinavia pushing microcomputer silicon to miraculous artistic extremes."
 EUR_european_software_studios:0 "European Digital Studio Hubs"
 EUR_european_software_studios_desc:0 "Bedroom programmers raised on the C64 and Amiga have founded world-class game studios and software houses from Dundee and Liverpool to Cologne, pioneering modern interactive digital entertainment."
 EUR_commodore_post_bankruptcy_legacy:0 "Legacy of the Microcomputer Revolution"
 EUR_commodore_post_bankruptcy_legacy_desc:0 "Though Commodore International succumbed to corporate mismanagement, the millions of programmers, digital artists, and systems engineers it created now form the bedrock of Europe's IT and high-tech software sectors."

 # Tech bonuses
 computing_tech_bonus:0 "Computing Technology Research Bonus"
 gui_computing_bonus:0 "GUI & Systems Architecture Bonus"
 windows_gui_bonus:0 "Graphical Environment Software Bonus"
 amiga_multimedia_bonus:0 "Amiga Custom Chipset Multimedia Bonus"
 pc_transition_bonus:0 "PC Platform Transition Bonus"

 # USA Events
 USA_TECH.1.t:0 "The Dawn of Silicon Valley"
 USA_TECH.1.d:0 "In Santa Clara County, California, an extraordinary transformation is underway. Journalist Don Hoefler has coined the moniker 'Silicon Valley' to describe the explosive concentration of semiconductor pioneers, spun out of Shockley Semiconductor and Fairchild. At Intel Corporation, engineers Federico Faggin, Ted Hoff, and Stan Mazor have unveiled the Intel 4004—the world's first commercial microprocessor on a single slice of silicon. By compressing the entire central processing unit of a computer onto a microchip containing 2,300 transistors, the foundation of personal and industrial computing has been fundamentally rewritten."
 USA_TECH.1.a:0 "A new technological age begins in California."

 USA_TECH.101.t:0 "The Microprocessor Revolution"
 USA_TECH.101.d:0 "Engineers in California's newly christened 'Silicon Valley' have unveiled the microprocessor—placing the entire calculating power of an electronic computer on a microscopic chip of silicon. Scientists and industrial leaders predict this breakthrough will soon place computing power into everyday machinery, factory automation, and consumer electronics worldwide."
 USA_TECH.101.a:0 "An era of silicon begins."

 USA_TECH.2.t:0 "The Homebrew Computer Club & The Altair 8800"
 USA_TECH.2.d:0 "In a garage in Menlo Park, California, a gathering of countercultural electronics enthusiasts, amateur radio operators, and engineers have convened for the inaugural meeting of the Homebrew Computer Club. Inspired by the MITS Altair 8800 kit computer featured on the cover of Popular Electronics, these passionate hobbyists are sharing schematics, soldering circuit boards, and writing paper-tape routines. What began as an eccentric grassroots collective is rapidly coalescing into a revolutionary social and technological movement aimed at liberating computing from mainframe corporate monopolies."
 USA_TECH.2.a:0 "Support the grassroots hobbyist ethos."
 USA_TECH.2.b:0 "Commercial enterprise must channel this energy."

 USA_TECH.3.t:0 "Micro-Soft Founded in Albuquerque"
 USA_TECH.3.d:0 "Recognizing that hardware without software is inert, Harvard undergraduates Bill Gates and Paul Allen have produced an interpreter for the BASIC programming language running on the Altair 8800. Setting up shop in an Albuquerque motel near MITS headquarters, they have formally registered the partnership 'Micro-Soft'. In response to rampant tape-copying by club hobbyists, young Gates has penned a stinging 'Open Letter to Hobbyists', declaring that software requires immense labor and expertise, and that creators deserve fair commercial compensation. Micro-Soft has established the principle that software is a distinct, lucrative commercial industry."
 USA_TECH.3.a:0 "Software is a commercial craft worthy of compensation."

 USA_TECH.4.t:0 "The Apple Computer & The Garage Revolution"
 USA_TECH.4.d:0 "In Los Altos, California, Steve Wozniak and Steve Jobs have transformed hobbyist circuit design into a commercial triumph. After hand-building the Apple I in the Jobs family garage, they have unveiled the Apple II at the West Coast Computer Faire. Featuring an elegant molded plastic case, built-in keyboard, color graphics, and expansion slots, the machine requires no soldering iron or electronics degree to operate. Personal computers are no longer esoteric kits for hobbyists—they are becoming fixture appliances for American classrooms, accounting offices, and homes."
 USA_TECH.4.a:0 "A computer for every home and classroom."

 USA_TECH.104.t:0 "The Personal Computer Hits the Mass Market"
 USA_TECH.104.d:0 "The personal microcomputer has transcended its origins as an esoteric hobbyist kit. With sleek, consumer-ready machines like the Apple II entering schools, homes, and small businesses across the United States, observers proclaim that the computer is no longer the exclusive preserve of university mainframes and defense laboratories."
 USA_TECH.104.a:0 "Computing belongs to the people."

 USA_TECH.5.t:0 "Xerox PARC & The Graphical User Interface"
 USA_TECH.5.d:0 "At the Xerox Palo Alto Research Center (PARC) in California, computer scientists have secretly developed the future of human-machine interaction. The Xerox Alto computer features a high-resolution bitmapped graphical display, a pointing device known as a 'mouse', overlapping windows, drop-down menus, Ethernet networking, and object-oriented programming. While corporate executives at Xerox headquarters in New York remain indifferent to commercializing these inventions, visiting Silicon Valley engineers have seen the demonstration with awe. The command-line era is living on borrowed time."
 USA_TECH.5.a:0 "Bitmaps, mice, and windows: the future is before us."

 USA_TECH.6.t:0 "The IBM PC Contract & The MS-DOS Masterstroke"
 USA_TECH.6.d:0 "International Business Machines has entered the microcomputer fray with the launch of the IBM 5150 Personal Computer. In a radical departure from its traditional proprietary secretive development, IBM turned to outside suppliers, contracting Bill Gates and Microsoft to provide the operating system. Microsoft purchased 86-DOS (Quick and Dirty DOS) from Seattle Computer Products, adapted it into PC-DOS for IBM, and crucially insisted on retaining the right to license MS-DOS to other computer manufacturers. As reverse-engineered PC-compatible clones flood the market, Microsoft has positioned itself as the toll collector of global desktop computing."
 USA_TECH.6.a:0 "The open licensing model creates a global standard."

 USA_TECH.106.t:0 "IBM Launches Personal Computer Standard"
 USA_TECH.106.d:0 "Computing giant IBM has released its Personal Computer (IBM PC), powered by Intel processors and operating system software provided by Microsoft. By publishing its technical specifications, IBM has unwittingly sparked a vast ecosystem of compatible clones, solidifying a worldwide standard for commercial office automation."
 USA_TECH.106.a:0 "A corporate standard is established."

 USA_TECH.7.t:0 "Sand Hill Road: The Venture Capital Explosion"
 USA_TECH.7.d:0 "Along Sand Hill Road in Menlo Park, California, venture capital firms such as Kleiner Perkins and Sequoia Capital have amassed unprecedented financial war chests. Capital is flooding into high-performance UNIX workstations (Sun Microsystems, Silicon Graphics), relational databases (Oracle), and computer networking hardware (Cisco Systems). The symbiotic fusion of Stanford University academic research, federal defense contracts, and aggressive private equity has made Silicon Valley the undisputed engine of American technological prosperity."
 USA_TECH.7.a:0 "Fuel the high-tech startup economy."

 USA_TECH.8.t:0 "Microsoft Windows 1.0 Released"
 USA_TECH.8.d:0 "Microsoft has officially released Windows 1.0, a graphical operating environment that runs atop MS-DOS. Offering tiled windows, mouse control, cooperative multitasking, and a graphical shell, Windows allows users to manage files and execute applications without typing cryptic command-line prompts. While early critics note its hardware demands and limited palette, the release marks Microsoft's decisive commitment to visual computing."
 USA_TECH.8.a:0 "A graphical future begins to take shape."

 USA_TECH.9.t:0 "Windows 3.0 & The Global Desktop Monopoly"
 USA_TECH.9.d:0 "Microsoft has launched Windows 3.0, scoring an unprecedented commercial triumph with over ten million copies sold within two years. Featuring rich 16-color VGA graphics, protected-mode memory management utilizing Intel 80386 chips, and an intuitive file manager, Windows 3.0 has transformed the IBM PC-compatible into a true multimedia platform. The 'Wintel' standard—combining Microsoft Windows with Intel microprocessors—now commands an unshakeable near-total monopoly across enterprise and home computers worldwide."
 USA_TECH.9.a:0 "Wintel dominates the global desktop."

 USA_TECH.109.t:0 "Microsoft Windows Sweeps Global Markets"
 USA_TECH.109.d:0 "Microsoft Corporation has consolidated an overwhelming dominance over the world's computer software markets with the runaway success of Windows 3.0. Millions of businesses, academic institutions, and households worldwide have adopted the graphical PC environment, cementing software as one of the most lucrative industries on earth."
 USA_TECH.109.a:0 "The personal computer era is in full swing."

 USA_TECH.10.t:0 "Windows 95: The Internet Era Unleashed"
 USA_TECH.10.d:0 "Backed by a massive $300 million promotional campaign featuring The Rolling Stones' 'Start Me Up' and midnight store openings across the globe, Microsoft has released Windows 95. Featuring true 32-bit preemptive multitasking, the revolutionary Start menu, long filenames, Plug-and-Play hardware architecture, and deep integration with the emerging World Wide Web through Internet Explorer, Windows 95 is a cultural and economic juggernaut. American high technology enters the 21st century standing tall as the undisputed digital hegemon of the planet."
 USA_TECH.10.a:0 "'Start Me Up' — America leads the Information Highway."

 USA_TECH.110.t:0 "Windows 95 Launched in Global Phenomenon"
 USA_TECH.110.d:0 "In an unprecedented spectacle of global consumer culture, Microsoft Windows 95 has launched worldwide with customers queuing around city blocks from New York to London and Tokyo. The operating system brings accessible multimedia computing and internet connectivity to hundreds of millions, marking the true dawn of the global Information Age."
 USA_TECH.110.a:0 "The Information Age has arrived."

 # Europe Commodore Events
 EUR_COMMODORE.1.t:0 "Commodore Arrives in Europe"
 EUR_COMMODORE.1.d:0 "Jack Tramiel, the tenacious survivor and industrialist at the helm of Commodore International, has set his sights on Europe. Operating under Tramiel's fiery motto—'We need to build computers for the masses, not the classes'—Commodore has established major European headquarters in Frankfurt am Main, West Germany, and Slough, England. The distinctive Commodore PET 2001, with its built-in monitor and cassette drive, is entering secondary schools, polytechnic colleges, and research laboratories across Britain, Germany, and Western Europe, inaugurating an era of widespread digital literacy."
 EUR_COMMODORE.1.a:0 "Embrace affordable microcomputers for education and industry."

 EUR_COMMODORE.101.t:0 "Commodore Expands Microcomputers Across Europe"
 EUR_COMMODORE.101.d:0 "Commodore International has launched aggressive expansion across European markets, placing low-cost personal microcomputers into secondary schools, universities, and commercial offices. European educators welcome the democratization of computer programming skills among the younger generation."
 EUR_COMMODORE.101.a:0 "A new era of accessible computing."

 EUR_COMMODORE.2.t:0 "The Commodore 64 Conquers European Living Rooms"
 EUR_COMMODORE.2.d:0 "The Commodore 64 has become a cultural phenomenon across Western Europe. While American office markets remain fixated on expensive corporate mainframes, European retailers—from Karstadt and Quelle in West Germany to Dixons and WHSmith in the United Kingdom—are selling C64s by the hundreds of thousands directly to consumers. Powered by the revolutionary MOS 6581 SID sound synthesizer chip designed by Bob Yannes and the VIC-II graphics processor, the machine delivers stunning arcade audiovisuals into ordinary living rooms. Millions of European teenagers are typing BASIC listings from magazines and discovering the secrets of 6502 machine code."
 EUR_COMMODORE.2.a:0 "The 'breadbin' becomes Europe's favorite computer."

 EUR_COMMODORE.102.t:0 "The Commodore 64: Europe's Digital Revolution"
 EUR_COMMODORE.102.d:0 "The Commodore 64 microcomputer has shattered sales records across Britain, West Germany, Scandinavia, and Western Europe. Selling for a fraction of corporate business machines, the machine has brought programmable graphics and synthesizer music into millions of European homes, creating an unprecedented wave of youthful digital literacy."
 EUR_COMMODORE.102.a:0 "The best-selling computer in history."

 EUR_COMMODORE.3.t:0 "The Amiga 1000: Silicon Valley Magic in Europe"
 EUR_COMMODORE.3.d:0 "Commodore has unveiled the Amiga 1000 in European tech capitals. Designed by legendary chip architect Jay Miner, the Amiga is a breathtaking technological marvel. Driven by custom coprocessors nicknamed Agnus, Paula, and Denise, it boasts true pre-emptive multitasking, 4096-color graphics, and four-channel sampled stereo sound—capabilities that leave IBM PC and Apple Macintosh computers years behind. Promoted by figures like Andy Warhol and embraced by European artists, video producers, and musicians, the Amiga is hailed as the ultimate creative machine."
 EUR_COMMODORE.3.a:0 "A multimedia masterpiece years ahead of its rivals."

 EUR_COMMODORE.4.t:0 "The Amiga 500: The Golden Age of European Computing"
 EUR_COMMODORE.4.d:0 "Commodore has launched the Amiga 500 across European department stores at an affordable consumer price (£499 in Britain, 1,090 DM in West Germany). The response has been overwhelming: the A500 has ignited the golden age of European home computing. Millions of German, British, French, Dutch, and Scandinavian households now center their creative and recreational life around the machine. In schoolyards and computer clubs, disk swapping, audio sampling, and Deluxe Paint animations have become the lingua franca of an entire generation."
 EUR_COMMODORE.4.a:0 "The Amiga 500 unleashes Europe's creative power."

 EUR_COMMODORE.104.t:0 "The Amiga 500 Sweeps Western Europe"
 EUR_COMMODORE.104.d:0 "The Commodore Amiga 500 has achieved unprecedented popularity across Western Europe, cementing its position as the premier multimedia home computer. European software houses and youth subcultures are producing groundbreaking interactive art and gaming experiences."
 EUR_COMMODORE.104.a:0 "A golden age of multimedia."

 EUR_COMMODORE.5.t:0 "The European Demoscene & Digital Subculture"
 EUR_COMMODORE.5.d:0 "Across West Germany, the United Kingdom, Sweden, the Netherlands, and Finland, a unique digital counterculture has blossomed: the European Demoscene. Evolving from underground floppy disk crackers, demo groups such as Red Sector, The Silents, Future Crew, and Razor 1911 compete fiercely at massive copy parties and festivals like Assembly in Helsinki and The Party in Denmark. Coders perform astonishing mathematical feats with the Amiga's blitter and copper chips, creating real-time 3D vector shading, plasma fire routines, and tracker music that push hardware far beyond what its original creators thought physically possible."
 EUR_COMMODORE.5.a:0 "Celebrate this astonishing digital folk art."

 EUR_COMMODORE.6.t:0 "The European Game Studio Boom"
 EUR_COMMODORE.6.d:0 "The legions of bedroom programmers raised on the Commodore 64 and Amiga have matured into a formidable, world-class video game development industry across Europe. In Dundee, Scotland, DMA Design has captivated millions with Lemmings; in Liverpool, Psygnosis has set artistic benchmarks with Shadow of the Beast; in Cologne, Germany, Factor 5 has crafted technical miracles with Turrican; in Yorkshire, Team17 produces Alien Breed and Worms; while in Sweden, Digital Illusions (DICE) crafts Pinball Dreams. Europe has established itself as an artistic superpower in interactive digital media."
 EUR_COMMODORE.6.a:0 "Europe leads the world in creative digital entertainment."

 EUR_COMMODORE.106.t:0 "European Gaming Studios Rise to Global Prominence"
 EUR_COMMODORE.106.d:0 "From the United Kingdom and Germany to Scandinavia, independent video game studios born out of home computer culture have become international powerhouses. European creative talent in computer graphics, sound design, and interactive software is now recognized as among the best in the world."
 EUR_COMMODORE.106.a:0 "A creative boom born from home computers."

 EUR_COMMODORE.7.t:0 "The Fall of Commodore & Its Enduring Legacy"
 EUR_COMMODORE.7.d:0 "On April 29, 1994, Commodore International filed for Chapter 7 bankruptcy protection in New York. Crippled by executive mismanagement in the United States, failed PC clone ventures, and botched marketing of the CD32, the pioneer of personal computing has collapsed. European tech firms like Escom and Amiga Technologies are bidding eagerly to acquire its intellectual property. Yet while the corporation has fallen, its historical triumph in Europe cannot be erased: the millions of European coders, musicians, and designers nurtured on Commodore silicon now form the elite vanguard of Europe's IT, telecommunications, and digital economy."
 EUR_COMMODORE.7.a:0 "Support domestic European computing consortia to acquire Amiga technology."
 EUR_COMMODORE.7.b:0 "Redirect Europe's software talent into global PC and internet platforms."

 EUR_COMMODORE.107.t:0 "Commodore International Files for Bankruptcy"
 EUR_COMMODORE.107.d:0 "Commodore International, the trailblazing pioneer of the home computing revolution that introduced the PET, VIC-20, Commodore 64, and Amiga to the world, has filed for liquidation. Despite the demise of the corporate giant, its technological innovations and cultural impact will endure for generations."
 EUR_COMMODORE.107.a:0 "The pioneer of home computing falls, but its spirit endures."
