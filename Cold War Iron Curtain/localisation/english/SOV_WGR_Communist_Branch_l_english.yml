l_english:
 # ============================================================================
 #  A RED BONN - 1949 West German election side branch (SOV / Stalin tree)
 #  Revealed only when the KPD wins WGRElection.1 option c.
 # ============================================================================

 # ---- Events ----
 sov_german_question.2.t:0 "A Red Bonn"
 sov_german_question.2.d:0 "The returns from the Federal Republic are not a mistake. Max Reimann has been sworn in as Bundeskanzler, and for the first time since 1933 a communist governs from German soil west of the Elbe.\n\nThe MGB residency in Berlin is jubilant. The Foreign Ministry is not. A communist Bonn is an asset without precedent and a liability without precedent — a socialist government sitting inside the Western occupation zones, surrounded by American, British and French garrisons, dependent on Ruhr coal it does not control and on a currency printed in Frankfurt.\n\nComrade Reimann will not survive on enthusiasm. He will survive on what Moscow is prepared to send him, and on how quickly we can pull the Federal Republic out of the Western orbit and into our own."
 sov_german_question.2.a:0 "Then we will not leave him to hang."

 sov_german_question.3.t:0 "Communists Take Bonn"
 sov_german_question.3.d:0 "In an outcome no Western capital thought possible, the Kommunistische Partei Deutschlands has emerged from the first Bundestag election as the largest party, and Max Reimann has formed a government.\n\nWashington has recalled its High Commissioner for consultations. In London the result is being described as the gravest reverse of the postwar settlement. In Paris, where the prospect of any German government at all remains unpopular, the reaction is closer to panic.\n\nThe Federal Republic was created to anchor western Germany to the Atlantic. Four years after the war, it has instead handed the Soviet Union a foothold on the Rhine."
 sov_german_question.3.a:0 "The map of Europe has just been redrawn."

 sov_german_question.4.t:0 "Moscow Recognizes the Reimann Government"
 sov_german_question.4.d:0 "The Soviet Union has extended full diplomatic recognition to the government of the Federal Republic of Germany, and an ambassador is on his way to Bonn.\n\nThe gesture is not merely ceremonial. Recognition from Moscow gives Reimann something the Western High Commissioners have been careful to deny him — the standing of a legitimate head of government rather than an electoral accident to be managed until it collapses."
 sov_german_question.4.a:0 "Bonn is no longer alone."

 sov_german_question.5.t:0 "Two States, One Road"
 sov_german_question.5.d:0 "For the first time, the German Democratic Republic and the Federal Republic have issued a joint communique.\n\nIt does not announce unification — neither Ulbricht nor Reimann has any interest in being absorbed by the other, and Moscow has no interest in a single German state large enough to have opinions of its own. What it announces is coordination: shared planning targets, open borders for party cadres, mutual recognition of qualifications and travel documents.\n\nThe German nation remains divided. The German road, for now, does not."
 sov_german_question.5.a:0 "Divided, but marching in step."

 sov_german_question.6.t:0 "The Atlantic Recoils"
 sov_german_question.6.d:0 "The consequences of a communist Bonn are working outward through Western Europe faster than anyone in Washington anticipated.\n\nIn France and Italy, communist parties that had been shut out of government since 1947 are pointing at the Rhine and asking why the ballot box was legitimate in Bonn but not in Paris or Rome. Socialist deputies who spent two years defending Atlantic integration are finding their arguments harder to make.\n\nThe alliance has not broken. But the assumption on which it was built — that Western Europe's future was settled, and settled westward — no longer holds."
 sov_german_question.6.a:0 "Let them explain it to their own workers."

 # ---- Focuses ----
 SOV_wge_a_red_bonn:0 "A Red Bonn"
 SOV_wge_a_red_bonn_desc:0 "The Kommunistische Partei Deutschlands has won the Bundestag election and Max Reimann governs the Federal Republic. Nobody in Moscow planned for this outcome, least of all the men who authorized the operation that produced it.\n\nA communist government in Bonn is not a satellite. It sits inside the Western occupation zones, its economy tied to the Ruhr and to a currency reform imposed from Frankfurt, its capital ringed by garrisons that answer to Washington. It can be strangled at leisure if we do nothing.\n\nWhat it can also be, handled correctly, is the first crack in the Atlantic settlement."
 SOV_wge_a_red_bonn_tt:0 "Unlocks the §YA Red Bonn§! branch. Soviet §Yforeign power projection§! increases."

 SOV_wge_recognize_the_reimann_government:0 "Recognize the Reimann Government"
 SOV_wge_recognize_the_reimann_government_desc:0 "The Western High Commissioners have not yet decided whether to treat the election as valid. Their hesitation is our opportunity.\n\nBy recognizing Reimann immediately and unconditionally, we convert an ambiguous result into an accomplished fact. Every day the Federal Republic functions as a normal state with a communist chancellor is a day in which the argument for annulling the election gets harder to make in public."
 SOV_wge_recognize_the_reimann_government_tt:0 "§YSoviet influence§! in West Germany increases sharply at American expense.\n§YKPD approval§! rises."

 SOV_wge_bonn_into_the_sphere:0 "Bonn Into the Sphere"
 SOV_wge_bonn_into_the_sphere_desc:0 "Recognition buys Reimann legitimacy. It does not buy him security.\n\nThe Federal Republic must be brought formally inside the Soviet sphere — security guarantees, intelligence sharing, party liaison, and if Bonn is willing, membership of our alliance system. This is the step the Western powers will read as a declaration that Germany is lost to them, and they will not be wrong."
 SOV_wge_bonn_into_the_sphere_tt:0 "West Germany joins the §YSoviet sphere§! and, if we lead a faction, is invited to join it.\n§YKPD state control§! and §Ycommunist influence§! in West Germany increase."

 SOV_wge_arm_the_west_german_workers:0 "Arm the West German Workers"
 SOV_wge_arm_the_west_german_workers_desc:0 "The Bundesgrenzschutz was raised to watch the eastern frontier. Under Reimann it is the only armed force in the Federal Republic that answers to Bonn rather than to an occupation authority, and it is badly equipped for the job it is now going to be asked to do.\n\nWhat we send will arrive as police equipment. What it is for is not police work."
 SOV_wge_arm_the_west_german_workers_tt:0 "West Germany receives Soviet §Yinfantry and support equipment§!.\n§YBGS performance§! and §YKPD state control§! increase."

 SOV_wge_comecon_for_the_ruhr:0 "COMECON for the Ruhr"
 SOV_wge_comecon_for_the_ruhr_desc:0 "The Federal Republic's industry runs on Ruhr coal, and the Ruhr runs on Marshall Plan credit that Washington can withdraw whenever it chooses. Reimann's government will be broken by an economic blockade long before it is broken by an army.\n\nThe answer is to replace the credit before it is withdrawn — Soviet and East European orders, Soviet raw materials, and market access into the socialist economies on terms Bonn cannot get from anyone else."
 SOV_wge_comecon_for_the_ruhr_tt:0 "Mutual §Ymarket access§! with West Germany.\nThe Soviet treasury funds the arrangement, and the West German §YWirtschaftswunder§! accelerates."

 SOV_wge_the_ruhr_arsenal:0 "The Ruhr Arsenal"
 SOV_wge_the_ruhr_arsenal_desc:0 "Ruhr steel built the armies that burned Kiev and starved Leningrad. There is a certain justice in what we intend to do with it now.\n\nJoint production agreements will tie West German heavy industry to Soviet military orders — and to Soviet designs, Soviet tooling and Soviet standards. Bonn gets the work. We get a second arsenal, and a Federal Republic that cannot retool for anyone else."
 SOV_wge_the_ruhr_arsenal_tt:0 "Large budget gain and new §Yarms industry§! construction."

 SOV_wge_two_states_one_road:0 "Two States, One Road"
 SOV_wge_two_states_one_road_desc:0 "Two German states, both governed by communists, both claiming to speak for the German nation, neither willing to dissolve into the other. Ulbricht regards Bonn as an upstart. Reimann regards Berlin as a garrison.\n\nWe will not attempt unification — a single German state of eighty million, however red, is not something Moscow should wish into existence. What we will do is coordinate them: shared plans, open cadre movement, one line on the German question. Divided, and marching in step."
 SOV_wge_two_states_one_road_tt:0 "Relations between the §YGDR§! and the §YFederal Republic§! improve substantially.\nThe SED's §Yparty power§! and §Ylegitimacy§! increase, and public discontent falls."

 SOV_wge_the_atlantic_recoils:0 "The Atlantic Recoils"
 SOV_wge_the_atlantic_recoils_desc:0 "The example is worth more than the asset.\n\nWestern communist parties have spent two years being told that they were excluded from government for the good of democracy. Bonn has made that argument unsustainable. Every French and Italian communist can now point at a Western European parliament where the ballot box produced a communist chancellor and the sky did not fall.\n\nWe will make certain the point is not lost on anyone."
 SOV_wge_the_atlantic_recoils_tt:0 "§YCommunist popularity§! and §YSoviet influence§! rise sharply in France and Italy.\nSoviet §Yforeign power projection§! increases."

 SOV_wge_atlantic_recoils_threat:0 "A Communist Bonn"
