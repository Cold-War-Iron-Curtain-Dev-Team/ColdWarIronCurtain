 LBA.1.a2:0 "There is a brighter future for the Libyan Berbers and Arabs"
 LBA.1.d2:0 "After international outrage discussing the neo-imperalist Bevin-Sforza Plan the U.N. has passed a resolution mandating the uniting of a new independent Libyan Kingdom under Idris."
 LBA.1.t2:0 "U.N. Adopts Resolution on Libyan Independence"
 LBA.10.a2:0 "This may have unforseen consequences"
 LBA.10.t2:0 "The Continuing Influx of Egyptian Teachers"
 LBA.11.a2:0 "The youth are always rebellious, they will become more moderate and loyal with age."
 LBA.11.t2:0 "The Radicalization of the Youth"
 LBA.12.a2:0 "What does this mean for Libya?"
 LBA.12.d2:0 "For whatever reason, his majesty, King Idris I has been seen less and less in the public and political sphere. Without his lead many decisions in the Kingdom may be neglected."
 LBA.12.t2:0 "Idris withdrawals from Public Life"
 LBA.13.a2:0 "Ahmed? A Regency? We need Idris!"
 LBA.13.t2:0 "The New Regency"
 LBA.14.a2:0 "New ideas for an ancient people"
 LBA.14.t2:0 "The Libyan Revolution"
 LBA.15.a2:0 "We shall always strive towards Arab Unity"
 LBA.15.t2:0 "The forming of a new union"
 LBA.16.a2:0 "The world we live in today is far too interconnected"
 LBA.16.t2:0 "Libyan Foreign Policy"
 LBA.17.a2:0 "We can always depend on fellow Arabs"
 LBA.17.d2:0 "Libya has sent volunteers and equipment in the Egyptian and Syrian united war effort against Israel"
 LBA.17.t2:0 "Libya gives aid to Egypt and Syria in their effort against Israel"
 LBA.18.a2:0 "This was not what the workers expected"
 LBA.18.d2:0 "Unexpectedly, the council members of the RCC have passed legislation banning labor unions."
 LBA.18.t2:0 "Ban on Labor Unions"
 LBA.19.a2:0 "This is not change"
 LBA.19.d2:0 "Hardliners in the RCC are making changes not wanted by the revolutionary officers, now they are legislating Sharia Law as they are aligned with Imams"
 LBA.19.t2:0 "Implementation of Sharia Law"
 LBA.2.a2:0 "There is a brighter future for the Libyan Berbers and Arabs"
 LBA.2.d2:0 "King Idris hereby declares the independent United Kingdom of Libya, uniting the three regions of Cyrenaica, Tripolitania, and Fezzan."
 LBA.2.t2:0 "Declaration of the Independent United Kingdom of Libya"
 LBA.20.a2:0 "We need to let Muammar al-Qaddafi take the reins of the RCC"
 LBA.20.b2:0 "Senussi loyalists, now's our chance!"
 LBA.20.t2:0 "al-Qaddafi Resigns in Protest!"
 LBA.21.a2:0 "Glory to the revolution! Allahu Akbar!"
 LBA.21.d2:0 "Now is a new beginning for the Libyan Arab Republic. Every aspect of our lives will change going forward and its hard to see what the future holds, whatever the case may be, we are with Muammar al-Qaddafi"
 LBA.21.t2:0 "The Popular Revolution"
 LBA.3.a2:0 "A unitary state"
 LBA.3.b2:0 "A Federal System"
 LBA.3.d2:0 "Before we form a United Libyan Kingdom we need to decide if we will have a federal system with Tripolitania and Fezzan as two seperate states or a Unitary state under a single administration."
 LBA.3.t2:0 "Our Future Administration"
 LBA.4.a2:0 "A Parlimentary Monarchy"
 LBA.4.b2:0 "Continue Status Quo"
 LBA.4.d2:0 "There are questions, given the modern world, regarding whether we should continue our status quo of complete monarchial control, or adopt a parlimentary monarchial system."
 LBA.4.t2:0 "Question of Executive Power"
 LBA.5.a2:0 "May Fekini serve us well"
 LBA.5.t2:0 "The New Prime Minister"
 LBA.6.a2:0 "Idris with more power is only to our benefit"
 LBA.6.d2:0 "Idris and his cabinet have come to disagree with the federal organization of the United Kingdom of Libya as states between Fezzan, Cyrenaica, and Tripolitania. The government will adopt a unitary government, indivisible."
 LBA.6.t2:0 "Abolishment of the Federal System"
 LBA.7.a2:0 "Americans have no business in Libya"
 LBA.7.d2:0 "Fracturing relations between his majesty, King Idris, have devolved into the administration forcing off foreign powers from maintaining military bases in our country."
 LBA.7.t2:0 "Removal of American Military Bases"
 LBA.8.a2:0 "Brits have no business in Libya"
 LBA.8.d2:0 "Fracturing relations between his majesty, King Idris, have devolved into the administration forcing off foreign powers from maintaining military bases in our country."
 LBA.8.t2:0 "Removal of British Military Bases"
 LBA.9.a2:0 "Revaluation over Concession"
 LBA.9.t2:0 "Revision of the 1951 Constitution"
