l_english:
 flavorjap.1.t:0 "[GetNewspaperHeader]Japan Airlines Flight 123"
 flavorjap.1.d:0 "A Japan Airlines flight has hit a ridge west of Tokyo after leaving Haneda. It is the worst single-aircraft crash on record, and almost no one on board has survived."
 flavorjap.1.a:0 "A dreadful loss."
 flavorjap.1.b:0 "A terrible crash."
 flavorjap.2.t:0 "[GetNewspaperHeader]The Plaza Accord"
 flavorjap.2.d:0 "Finance ministers at the Plaza Hotel have agreed to push the dollar down. The yen will rise, and Japan's export prices will rise with it."
 flavorjap.2.a:0 "The yen is going up."
 flavorjap.2.b:0 "The dollar had to come down."
 flavorjap.2.c:0 "The currencies are being moved."
 flavorjap.3.t:0 "[GetNewspaperHeader]The Recruit Scandal"
 flavorjap.3.d:0 "Recruit Cosmos shares were handed to politicians before the firm went public. The scandal has reached the cabinet, and the Liberal Democratic Party is answering for it."
 flavorjap.3.a:0 "The party is exposed."
 flavorjap.3.b:0 "Tokyo has a scandal."
 flavorjap.4.t:0 "[GetNewspaperHeader]The End of Showa"
 flavorjap.4.d:0 "Emperor Hirohito has died. The Showa era is over, and the new era, Heisei, has begun under Emperor Akihito."
 flavorjap.4.a:0 "The era has ended."
 flavorjap.4.b:0 "The Emperor is dead."
 flavorjap.5.t:0 "[GetNewspaperHeader]The Bubble Breaks"
 flavorjap.5.d:0 "The Tokyo market has turned. Share prices that climbed through the eighties are falling, and the price of land no longer looks certain."
 flavorjap.5.a:0 "The boom is over."
 flavorjap.5.b:0 "Tokyo is selling."
 flavorjap.6.t:0 "[GetNewspaperHeader]The Kobe Earthquake"
 flavorjap.6.d:0 "A morning earthquake has struck Kobe and the cities along Osaka Bay. Elevated roads have fallen, and fires are burning through the wards."
 flavorjap.6.a:0 "Kobe is broken."
 flavorjap.6.b:0 "A terrible earthquake."
 flavorjap.7.t:0 "[GetNewspaperHeader]Sarin on the Tokyo Subway"
 flavorjap.7.d:0 "Sarin has been released on Tokyo subway trains at rush hour. The attack is the work of the Aum Shinrikyo cult."
 flavorjap.7.a:0 "Find who did this."
 flavorjap.7.b:0 "An attack in Tokyo."
 flavorjap.8.t:0 "[GetNewspaperHeader]Pocket Monsters"
 flavorjap.8.d:0 "Nintendo has put Pocket Monsters on sale. Children are already trading the creatures, and the cartridges are hard to find."
 flavorjap.8.a:0 "The shops cannot keep them."
 flavorjap.8.b:0 "Another game from Japan."
 flavorjap.9.t:0 "[GetNewspaperHeader]The Walkman"
 flavorjap.9.d:0 "Sony has put a stereo in a pocket. The Walkman is small enough to carry on a train, and Tokyo is already wearing the headphones."
 flavorjap.9.a:0 "The music travels."
 flavorjap.9.b:0 "A clever little machine."
 flavorjap.10.t:0 "[GetNewspaperHeader]The Compact Disc"
 flavorjap.10.d:0 "Sony and Philips have put the compact disc on sale. A silver disc plays an album without the hiss of a record, and Eindhoven and Tokyo built it together."
 flavorjap.10.a:0 "The disc is silent and clear."
 flavorjap.10.b:0 "Philips built this with Sony."
 flavorjap.10.c:0 "Records have a rival."
 flavorjap.11.t:0 "[GetNewspaperHeader]Sony Buys Columbia"
 flavorjap.11.d:0 "Sony is buying Columbia Pictures. The price is enormous, and a Japanese firm will own one of Hollywood's old studios."
 flavorjap.11.a:0 "We can pay it."
 flavorjap.11.b:0 "Hollywood has a new owner."
 flavorjap.11.c:0 "A studio has been sold."
 flavorjap.12.t:0 "[GetNewspaperHeader]Nintendo Drops Sony"
 flavorjap.12.d:0 "At the Chicago electronics show, Nintendo has abandoned its disc partnership with Sony and signed with Philips instead. Sony's machine has no partner. Philips of Eindhoven now holds the license."
 flavorjap.12.a:0 "We will build it alone."
 flavorjap.12.b:0 "The license is ours."
 flavorjap.12.c:0 "The partnership is broken."
 flavorjap.13.t:0 "[GetNewspaperHeader]The PlayStation"
 flavorjap.13.d:0 "Sony's own game machine is on sale in Japan. It is the machine Sony built after Nintendo walked away, and the shops are crowded."
 flavorjap.13.a:0 "The shops are full."
 flavorjap.13.b:0 "Sony has a game machine."
 flavorjap.14.t:0 "[GetNewspaperHeader]The Philips CD-i"
 flavorjap.14.d:0 "Philips has put the CD-i player on sale. It plays sound, pictures, and games from a compact disc, and Eindhoven expects it in the living room beside the television."
 flavorjap.14.a:0 "This is the next player."
 flavorjap.14.b:0 "An interactive disc."
 flavorjap.15.t:0 "[GetNewspaperHeader]The CD-i Fades"
 flavorjap.15.d:0 "Philips is done with the CD-i. The players never found a public, and ordinary game machines and home computers have taken the ground it wanted."
 flavorjap.15.a:0 "The format is finished."
 flavorjap.15.b:0 "The disc player lost."
