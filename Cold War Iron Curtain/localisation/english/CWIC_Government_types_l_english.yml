 Higuys_Republic_tt2: "[GetGovernmentTypesDesc]"



 GOV_TYPE_FED_SEM_DESC: "£GovTypes_Federal_Semi_Presidential_pic\n\n\n\n\n\n\n\n\nOccasionally referred to as a “Dual Executive System:, Federal Semi-Presidential Republics have a President, Prime Minister and Cabinet that exist independently from each other, the Prime Minister and Cabinet being responsible for state legislature, with authority being diversified between central and regional authorities. While often holding more checks and balances then most governments, it also muddies the water surrounding government accountability…"
 GOV_TYPE_DUUMVIRATE_DESC: "£GovTypes_Direct_Indirect_pic\n\n\n\n\n\n\n\n\nAs the name suggests, Mixed Direct-Indirect Governments combine elements from both direct democracy, allowing citizens to vote directly on laws and policies, while simultaneously having elected officials making decisions on behalf of the people."
 GOV_TYPE_ETHNO_NAT_DESC: "While not having extensive, defined policy, Ethnic Armed Organizations broadly operate under the values of Ethno-Nationalism. While policies from state to state may vary, they broadly operate under the idea of segregating, or exterminating foreign ethnicities from their respective territories."
 GOV_TYPE_REP_DESC: "A republican system of government where power is divided by a central government, headed by a bipartisanly elected president with executive authority, and regional governments. While not strictly limited to western liberal governments, most Federal Presidential Republics often are liberal democracies."
 GOV_TYPE_COM_DESC: "Still holding the core values of Marxist Leninism, believing in the need for a two-stage communist revolution. Federal Marxist Leninist Republics still maintain a Vanguard Party organized through Democratic Centralism, however it will have government authority split between central and regional governments.  The extent in which regional governments can enact independent policy varies from state to state."
 GOV_TYPE_REV_DESC: "While not espousing a specific ideology, or political philosophy, Provisional Revolutionary Regimes are dictatorships established in the middle of, or after a successful revolution with the intent to entrench the authority of the revolutionaries, and use said authority to organize a new government."
 GOV_TYPE_BRM_DESC: "Like most Republics, Assembly-Independent Republics have an executive elected by the legislature, however once elected, they cannot be removed with a vote of no-confidence, and there are few, if any, legal checks and balances for the head of state. However fundamentally, Assembly-Independent Republics are functional democracies."
 GOV_TYPE_MAO_DESC: "Following the teachings of the late Mao Zedong, and as such, is predominantly prominent in none-industrial countries, as it elevates the importance of a “United Front” of progressive classes in leading the Vanguard, rather than a simple party lead vanguard.   In a Unitary Maoist Republic, power largely rests within a single central authority."
 GOV_TYPE_COM_2_DESC: "A unitary Marxist-Leninist republic is a form of government in which the state is organized as a single entity, with all power concentrated in the central government. In this system, the government is based on the principles of Marxism-Leninism, which emphasizes the role of the working class and the need for a strong, centralized state to"
 GOV_TYPE_VTC_2_DESC: "£GovTypes_Ecclesiastical_Theocracy_pic\n\n\n\n\n\n\n\n\nWhile a very fairly old system of governance, Ecclesiastical Elected Monarchies believe in the broad authority of a Monarch, however equally elevate the importance and necessity in religious authorities in determining both matters of state, and electing the head of state."
 GOV_TYPE_CROWN_DESC: "Fully recognized with the rise of absolutism in the 15th-16th centuries, Hereditary Absolute Monarchies often do not hold constitutions, or even protected rights and freedoms for its citizens. While there are law codes, full authority over every matter of state is in the exclusive hands of a hereditary monarch."
 GOV_TYPE_ISLAM_CROWN_DESC: "A theocratic addition to the traditional Absolute Hereditary Monarchy, functionally they are near identical.  However what stands a Hereditary Islamic Monarchy apart is the role of Islamic law and philosophy in governing state, law and conduct of the monarchs themselves."
 GOV_TYPE_CROWN_EU_DESC: "Diverting from Absolute Monarchs, Constitutional Monarchies, as the name implies, have a national constitution, and have a wide range of legal checks and balances both in elected leaders, and the Monarchy.  Power is usually, but not always, split between a Monarch, and elected Leader, with Monarch's role in matters of state being fairly limited.  Unitary Constitutional Monarchies have authority focused on a single central government."
 GOV_TYPE_FED_MON_DESC: "Diverting from Absolute Monarchs, Constitutional Monarchies, as the name implies, have a national constitution, and have a wide range of legal checks and balances both in elected leaders, and the Monarchy.  Power is usually, but not always, split between a Monarch, and elected Leader, with Monarch's role in matters of state being fairly limited. Federal Constitutional Monarchies have authority split between a central government and regional authorities."
 GOV_TYPE_REP_PARL_DESC: "Parliamentary Republics have a head of state selected or nominated by a legislature they are also held accountable too.  The head of state in a full parliamentary system is often separate from the head of government, serving primarily apolitical, and ceremonial roles. In a Unitary Parliamentary Republic, government authority rests within a single central government."
 GOV_TYPE_VTC_DESC: "While a very fairly old system of governance, Theocratic Elective Monarchies believe in the broad authority of a Monarch, however equally elevate the importance and necessity in religious authorities in determining both matters of state, and electing the head of state."
 GOV_TYPE_ANR_DESC: "Diarchies, or Duumvirates are states or systems led by two individuals wielding equal authority (at least on paper).  However within a Diarchic Constitutional Principality, the Diarchs are often of noble birth, and are held beholden to a national constitution."
 GOV_TYPE_SWI_DESC: "Directorial Systems promote governments led by a small group of people, known as a Directory rule collectively, and all equally exercise the authority of heads of state.  In a Directorial Republic, these individuals are often elected into office, and whether they have term limits varies from state to state. Within a Federal Directorial Republic, authority is further diversified amongst regional authorities."
 GOV_TYPE_FED_PARL_DESC: "Parliamentary Republics have a head of state selected or nominated by a legislature they are also held accountable too.  The head of state in a full parliamentary system is often separate from the head of government, serving primarily apolitical, and ceremonial roles. In a Federal Parliamentary Republic, government authority is diversified between a central government, and regional authorities."
 GOV_TYPE_SEM_REP_DESC: "Occasionally referred to as a “Dual Executive System:, Federal Semi-Presidential Republics have a President, Prime Minister and Cabinet that exist independently from each other, the Prime Minister and Cabinet being responsible for state legislature. While often holding more checks and balances then most governments, it also muddies the water surrounding government accountability…"
 GOV_TYPE_JUNTA_DESC: "Provisional governments are temporary forms of government, often serving as a transition point between regimes, or transitioning a government from its pre revolution state to post revolution state.  Provisional Military Governments vary wildly from state to state. Some will maintain the civilian order and simply keep the peace, while others will try to directly vest political control permanently in the hands of the military.  Whether the military steps out of power after the provisional period ends is also not entirely guaranteed."
 GOV_TYPE_COLONIAL_DESC: "Imposed by a foreign, usually (but not always) off continent power, locals often have little to no influence or control over government or any aspects of the state's political or legal landscape. Colonial Administrations are seldom the same, and policy entirely rests in the hands of the foreign power who established the administration."
 GOV_TYPE_PROV_GOV_DESC: "Provisional governments are temporary forms of government, often serving as a transition point between regimes, or transitioning a government from its pre revolution state to post revolution state. One of the more civil forms of provisional government, the Interim Government is often still a civilian run administration, and serves to function as an ideally peaceful transition between two different forms of government, without disrupting the daily lives of the states people."
 GOV_TYPE_SPR_DESC: "A form of Totalitarian Dictatorship, there often isn’t a single binding glue between fascists states in how they operate.  Often dubious views of religious entities, all that fundamentally matters to a Fascist Dictatorship is the complete, overwhelming control of the head of state, and utter reference either for the state, or state imposed ideals. The rights of citizens, stances on ethnic minorities among other subjects are often the simple whim of the dictator."
 GOV_TYPE_UN_MANDATE_DESC: "A form of temporary government, a United Nations Trust Territory is established and directly governed by the United Nations itself. These primarily exist to serve as a transitional period to maintain peace, and prevent overwhelming violence as a state or region is re-organized into a new, peaceful government, or preparing to be transferred to a more stable state."
 GOV_TYPE_UNITARY_PRES_DESC: "A republican system of government where power is vested in a single central government, headed by a bipartisanly elected president with executive authority. While not strictly limited to western liberal governments, most Unitary Presidential Republics often are liberal democracies."
 GOV_TYPE_ISLAM_DESC: "While the authority of a head of state or secular authorities is often dubious, within a Unitary Islamic Theocracy rests primarily within the clergy. Laws, codes of conduct and social policies are determined, debated and established exclusively through the lens of islamic law and theology.  Within a Unitary Islamic Theocracy authority rests within a single theocratic authority."
 GOV_TYPE_SEM_MON_DESC: "Semi-Constitutional Monarchy"
 GOV_TYPE_UNK_DESC: "It’s not known how this state functions or operates, but it functions all the same. Perhaps the longer it functions as it does it may receive a name should it prove successful enough."
 GOV_TYPE_ZONE_DESC: "Who the head of state is and how the state is run is entirely dependent on the authorities backing its existence.  These governments exist exclusively as a form of transition, often after a war or period of deep internal turmoil and bloodshed, to ensure either a peaceful transition of power, or to ensure specific authorities come to power, backed by the foreign powers running the administration."
 GOV_TYPE_ISLAM_REPUBLIC_DESC: "Unitary Theocratic Islamic Republic"