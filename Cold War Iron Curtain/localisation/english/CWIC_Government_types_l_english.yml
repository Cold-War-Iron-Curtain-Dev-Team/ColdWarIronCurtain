 Higuys_Republic_tt2: "[GetGovernmentTypesDesc]"



 GOV_TYPE_FED_SEM_DESC: "A federal semi-presidential republic is a form of government in which a president exists alongside a prime minister and a cabinet, with the latter two being responsible to the legislature of a state. The president is usually elected by the people and has significant powers, while the prime minister is appointed by the president and is responsible for running the government. The legislature typically has the power to remove the prime minister through a vote of no confidence."
 GOV_TYPE_DUUMVIRATE_DESC: "A mixed direct-indirect government is a form of government that combines elements of both direct and indirect democracy. In this system, citizens have the ability to directly participate in decision-making processes through referendums or initiatives, while also electing representatives to make decisions on their behalf in a legislative body. This allows for a balance between citizen involvement and efficient governance."
 GOV_TYPE_ETHNO_NAT_DESC: "An ethnic armed organization is a political entity that is composed of members of a specific ethnic group and is typically formed to defend or promote the interests of that group."
 GOV_TYPE_REP_DESC: "A federal presidential republic is a form of government in which the president is the head of state and government, and is elected by the people. The country is divided into states or provinces, each with its own government and laws, but all are united under a central federal government."
 GOV_TYPE_COM_DESC: "A federal Marxist-Leninist republic is a form of government in which the state is organized as a federation"
 GOV_TYPE_REV_DESC: "A provisional revolutionary regime is a temporary government that is established after a revolution or coup d'état, and is typically characterized by its focus on implementing revolutionary ideals and policies. This type of government is often marked by political instability and may be replaced by a more permanent government once the revolutionary goals have been achieved."
 GOV_TYPE_BRM: "Assembly-Independent Republic"
 GOV_TYPE_MAO: "Unitary Maoist Republic"
 GOV_TYPE_COM_2_DESC: "A unitary Marxist-Leninist republic is a form of government in which the state is organized as a single entity, with all power concentrated in the central government. In this system, the government is based on the principles of Marxism-Leninism, which emphasizes the role of the working class and the need for a strong, centralized state to"
 GOV_TYPE_VTC_2_DESC: "An ecclesiastical elective monarchy is a form of government in which the head of state is a religious leader who is elected by a specific group of people, such as the clergy or a council of religious leaders. This type of government combines elements of both monarchy and democracy, as the leader is chosen through an electoral process but holds a position of authority similar to that of a monarch."
