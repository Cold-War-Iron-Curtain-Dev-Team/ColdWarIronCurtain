 WW3_ME.1.t: "East Jerusalem Massacre"
 WW3_ME.1.d: "As tensions flared across the globe, protests erupted in East Jerusalem in response to fears of an impending Israeli annexation of the West Bank. The atmosphere was charged with anger, and among the chaos, anti-Semitic slurs echoed throughout the streets. What unfolded next was unexpected: the Israeli Defense Forces began to converge on West Jerusalem, moving ominously toward the eastern neighborhoods.\n\nWhen the forces finally arrived, a wave of panic surged through the crowd, not from fear, but from an overwhelming sense of rage and frustration. In an instant, the once-boisterous protesters scattered, driven by a mix of desperation and defiance. But the situation escalated rapidly—Israeli soldiers, feeling provoked, opened fire. The atmosphere thickened with tension, each moment fraught with the potential for further violence, as the reality of the conflict loomed large over the city, igniting even deeper divisions."
 WW3_ME.1.a: "The Jews did it!"
