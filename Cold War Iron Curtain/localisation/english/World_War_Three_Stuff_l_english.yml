 WW3_news.5.t: "[GetNewspaperHeader] Nuclear Detonation Across Europe"
 WW3_news.5.d: "People around the world are in shock and horror as reports confirm the first detonation of a nuclear weapon since Hiroshima and Nagasaki. Amid the ongoing Third World War, NATO forces continue their relentless advance, prompting the Soviet Union to officially launch the first nuclear attack of the conflict under operation "Red Star." This strike targeted [insert dynamic information about the specific country and target], a non-nuclear state. Fears of a full-scale global nuclear war have reached unprecedented levels since the outset of the Third World War.\n\nWhile the attack has drawn near-universal condemnation, Moscow insists that it was a necessary action undertaken in the name of national survival. Washington and the rest of NATO view it as a desperate attempt to reverse the tide of the war. It remains uncertain whether the United States will respond to this nuclear attack with equal force; some NATO officials even believe that peace negotiations are essential to prevent further nuclear escalation. However, one thing is clear: the clock is ticking closer to midnight as families worldwide brace for the worst."
 WW3_news.5.a: "God help us all..."
 WW3_ME.1.t: "East Jerusalem Massacre"
 WW3_ME.1.d: "While the world on fire, it seems that not even the Levant has been spared from Midnight. With protests eventually spreading to the West Bank over Jordan amassing troops at the border of Israel and mounting fears of a potential Israeli annexation of the West Bank. Much like the protests predicted, Israeli forces began moving into East Jerusalem to ensure “security” for the State of Israel. Israeli officials themselves even downplaying the amount of troops they actually sent.\n\nWhen the Israeli forces finally arrived today, panic and riots ensued all over the West Bank, angered over the attempt of Israel to ensure sovereignty over the West Bank. Within minutes protestors threw firebombs, rocks at Israeli soldiers who were told to keep their actions as limited as possible. But out of nowhere like the old Second Temple, gunshots, like bells, began to ring over the crowd.\n\nOn this day, hundreds of people died. But no-one can say for certain who started it."
 WW3_ME.1.a: "The Jews did it!"
 WW3_ME.2.t: "Jordanian troops on our border!"
