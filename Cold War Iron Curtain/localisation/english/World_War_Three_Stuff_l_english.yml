 jap_sov.9.t: "[GetNewspaperHeader]Fighting Ends in Home Island!"
 jap_sov.9.d: "Following the Soviet landing on the Japanese Home Islands, a series of intense and sporadic battles broke out, ultimately leading to Japan's formal surrender to the advancing Soviet Army.\n\nEmperor Hirohito, who had been previously spared from prosecution by the Supreme Command of Allied Powers during the 1940s due to his symbolic role in Japanese culture, now faces a new trial. In a historic move, Hirohito has been compelled to abdicate the throne and cede power to his eldest son, Akihito. Akihito has been appointed the Chairman of the newly established National Diet.\n\nTo oversee the transition and administration of the Japanese-occupied territories, Soviet commander Konstantin Rokossovsky has been designated as the interim administrator. His role will involve managing the region until a new constitution is drafted, establishing a framework for governance that reflects the ideals of the new political landscape in Japan."
 jap_sov.9.a: "Another American Ally has fallen..."
 jap_sov.10.t: "[GetNewspaperHeader]Japan New Constitution"
 jap_sov.10.d: "After Japan's defeat, the Soviet Union commissioned the Japanese Communist Party to begin drafting a new Constitution. The day finally arrived when the Japanese Communist Party merged with the Left Faction of the Japanese Socialist Party, forming a new party called the Japanese Peasant and Worker’s Party. As stated in the new Constitution, this party became the sole legal party and the guiding force for the nation.\n\nThe United States and other NATO allies condemned this development, viewing it as an act of imperialism in Japan. The American President expressed shock and anger at the idea of Japan becoming another Soviet puppet state.\n\nKenji Miyamoto was elected as the new party chairman and, consequently, the Prime Minister of Japan. Meanwhile, Prince Akihito, the son of former Emperor Hirohito, was appointed as the President of Japan."
 jap_sov.10.a: "The Red Sun has Risen."
 WW3_news.1.t: "[GetNewspaperHeader]Syndicalist Revolution in Monaco!"
 WW3_news.1.d: "Just a week ago, France fell into the hands of the Soviet Union, creating disarray in the neighboring country of Monaco. A wave of French refugees rushed towards the small nation, leading to a series of riots. The Monaco Syndicalist Union organized a demonstration in support of the new French government, while Prince Rainier III appeared to side with the exiles in Algiers.\n\nDuring this tumultuous week, Monaco was engulfed in looting and riots. As a result, the Prince of Monaco abdicated, leaving a power vacuum. The Syndicalists took advantage of this situation, abolishing the monarchy and establishing a new republic."
 WW3_news.1.a: "Ideological Gambling"
