 nsb_suspension0:0 "WW2 Suspension"
 nsb_suspension0_desc:0 "A torsion bar suspension is a suspension in which the role of a spring is played by a rod, one end of which is fixed in the hull, and the other in the suspension arm, the vertical movement of which twists the rod around its axis, and the elastic force returns it to its previous position. One of the most important qualities of a torsion bar suspension, which distinguishes it favorably from spring suspensions, is greater resistance to big loads, a soft ride, and high durability. However, a torsion bar is more expensive and more difficult to manufacture than any other metal spring, since it requires stronger grades of steel and special manufacturing technology, including hardening and bonding. Despite this, torsion bar suspension became the undisputed standard in tank construction after World War II."
 nsb_suspension1:0 "Modernized Suspension"
 nsb_suspension1_desc:0 "With the end of World War II approaching, considerable practical experience in operating the suspension of armored vehicles, as well as ideas for eliminating design deficiencies, had accumulated. One of the most important problems, common to all types of suspension, was longitudinal vibrations that occurred during movement, interfered with shooting on the move, and significantly reduced the service life of the suspension. When modernizing the most successful types of suspension, hydraulic shock absorbers were added, which largely eliminated these problems."
 nsb_suspension2:0 "Hydro-Pneumatic Suspension"
 nsb_suspension2_desc:0 "An improved version of the hydropneumatic suspension, equipped with a system for regulating the volume of the working fluid, which makes it possible to change the ground clearance, and allows the combat vehicle to hide and appear from behind cover, as well as tilt forward and backward, significantly expanding the angles of vertical and horizontal aiming of the gun."
 nsb_suspension3:0 "Active Suspension"
 nsb_suspension3_desc:0 "Active suspension - the last word in suspension systems of combat vehicles, is a development of hydropneumatic suspension supplemented by a digital system of sensors that monitor the speed, and vibrations of the combat vehicle's body, or determine the profile of the path in front of the combat vehicle and dynamically change the stiffness of each suspension element in such a way as to most effectively dampen vibrations, which allows to maintain high speed even on very difficult terrain, significantly reduce fuel consumption (thanks to reduced energy losses when running over uneven surfaces) and increase shooting accuracy on the move, effectively complementing the work of the gun stabilizer."

 nsb_ammo:0 "Artillery Design"
 nsb_ammo_desc:0 "A conventional armor-piercing (AP) projectiles, are very different in design - capped (APC), with ballistic cap (APBC), a combination of two (APCBC), filled with explosives (APHE), or all at once (APHEBC, APHECBC) - a great variety of them, but all the same in one thing: the projectile itself is entirely a penetrator and coincides in diameter with the caliber of the gun. Many, if not all of these shells, copy the design and use the experience of naval gun shells, where the task of penetrating armor has been on the table for decades."
 nsb_ap_ammo0:0 "APCR Ammunition"
 nsb_ap_ammo0_desc:0 "In the middle of World War II, the thickness of the armor tended to grow faster than the caliber of the gun, which required an increase in armor penetration while remaining within the same overall dimensions. As a solution to this problem, a sub-caliber armor-piercing composite rigid (APCR, sometimes also called high-velocity armor-piercing or HVAP) projectile was developed. The principle of its operation is simple: a penetrator with a diameter smaller than the caliber of the gun, made of dense material, such as tungsten carbide, was placed inside a sabot made of a softer material and compensating for the difference in the size of the penetrator and the barrel; after the shot, such a projectile behaved as a single whole, and when it hit the target, the sabot deformed against the armor, allowing the penetrator, which has high kinetic energy and acts on a smaller area, to easily penetrate the armor."
 nsb_ap_ammo1:0 "APDS Ammunition"
 nsb_ap_ammo1_desc:0 "Although the APCR projectile had good armor penetration, it had several significant design flaws, such as high ricochet chance and a rapid drop in velocity with increasing range. As a continuation of the idea and to solve these problems, a sub-caliber armor-piercing discarding sabot (APDS) projectile was developed. Unlike its predecessor, once fired, as the name suggests, the sabot discards, leaving a high-speed and less ricocheting penetrator."
 nsb_ap_ammo2:0 "APFSDS Ammunition"
 nsb_ap_ammo2_desc:0 "The growing protection of tanks made it necessary to increase armor penetration, which can only be achieved by increasing the powder charge and lengthening the penetrator. However, extending the penetrator by more than 6-8 calibers in length significantly destabilizes it in flight, which necessitated the addition of fletching. This made it possible to increase the ratio of diameter to length up to 10:1, increase the flight speed, and, thus, increased armor penetration, while also leading to the appearance of a new projectile type - armor-piercing fin-stabilized discarding sabot (APFSDS)."
 nsb_ap_ammo3:0 "APFSDS Elongated Projectile Ammunition"
 nsb_ap_ammo3_desc:0 "By the middle of the Cold War, the emergence and proliferation of armored targets with combined armor required an increase in the armor penetration of APFSDS projectiles, and the only way to achieve this without a significant increase in caliber is to increase the length of the penetrator. While 'increasing the length of the penetrator' sounds like something simple and easy to do, it's really not: it requires improved sabot design so that it doesn't destabilize the projectile on release, new materials that won't collapse from the increased lateral forces in flight, and proper balance of the penetrator itself."
 nsb_ap_ammo4:0 "Advanced APFSDS Ammunition"
 nsb_ap_ammo4_desc:0 "The new generation of APFSDS projectiles, which appeared at the end of the Cold War, differed, in addition to an even greater elongation of the penetrator, where the diameter to length ratio began to reach 20:1, the replacement of the tungsten carbide core with a core, later becoming monoblock, made of alloy of tungsten, steel, and nickel, which has greater ductility and is less prone to breakage when passing through heterogeneous, multilayer combined armor."
 nsb_ap_ammo5:0 "Early Modern APFSDS Ammunition"
 nsb_ap_ammo5_desc:0 "The early modern APFSDS projectile became even longer and thinner, which provided a radical increase in the ratio of diameter to length and reached 30:1, but required several innovations, such as reducing the span of the fin to lower drag, using new composite materials in the sabot to reduce parasitic mass, and using a new type of propellant capable of giving sufficient speed to a heavy penetrator. In addition, due to the increased length of the penetrator, it was necessary to deepen the rear end of it into the charge to maintain adequate dimensions."
 nsb_ap_ammo6:0 "Modern APFSDS Ammunition"
 nsb_ap_ammo6_desc:0 "The modern APFSDS projectile was created as a response to the emergence of improved protection in the form of new generations of ERA and NERA, which required a further increase in the diameter to length ratio, which can now reach 35:1 or more, but led to the fact that the rear end of the penetrator rests on charge bottom; in addition to this, a new high-energy propellant was used to accelerate the projectile even more and somewhat compensate for the amount of charge removed to accommodate the extended penetrator, and a steel tip has also been added to overcome ERA more effectively."
 nsb_ap_ammo7:0 "Modern Depleted Uranium APFSDS Ammunition"
 nsb_ap_ammo7_desc:0 "The advanced modern APFSDS projectile has not practically changed in dimensions compared to previous models, which is associated with reaching the limit in increasing the ratio of diameter to length and the restrictions imposed by the internal volume of the combat vehicle, but this did not prevent the projectile from being made even better: the plumage was made more optimally, further reducing drag, and the propellant is packed more tightly thanks to the new sequential filling technology. The potential of these projectiles will be fully revealed only with the help of the most modern tank guns for which they were originally created."

 nsb_ap_du_ammo0:0 "Depleted Uranium APFSDS Elongated Projectile Ammunition"
 nsb_ap_du_ammo0_desc:0 "The new generation of APFSDS projectiles, which appeared at the end of the Cold War, differed, in addition to an even greater elongation of the penetrator, where the diameter to length ratio began to reach 20:1, the replacement of a tungsten carbide core with a core, later becoming monoblock, made of alloy of depleted uranium and small addition of titanium or nickel-zinc. The idea to equip an armor-piercing projectile with a depleted uranium core was first tested by the Germans at the end of World War II, but was soon forgotten. The idea resurfaced in the mid-1970s in the US, where, in the wake of rising tungsten prices and the growing problem of nuclear waste accumulation, a brilliant idea was made to use depleted uranium as a cheaper substitute for tungsten. Initially, it was expected that its characteristics would be significantly worse, but a surprising observation was made that depleted uranium was not only as good as, but even much better than tungsten: unlike the latter, where the penetrator began to become blunt and lose kinetic energy with immersion deeper into the armor, the depleted uranium penetrator did not lose its sharpness due to the self-sharpening effect. In addition, the finely dispersed uranium formed during armor penetration is highly pyrophoric, that is, it can ignite upon contact with air, which makes it possible to set fire to fuel tanks and ammunition when armor is penetrated."
 nsb_ap_du_ammo1:0 "Early Modern Depleted Uranium APFSDS Elongated Projectile Ammunition"
 nsb_ap_du_ammo1_desc:0 "The early modern APFSDS depleted uranium projectile became even longer and thinner, which provided a radical increase in the ratio of diameter to length and reached 30:1, but required several innovations, such as reducing the span of the fin to lower drag, using new composite materials in the sabot to reduce parasitic mass, and using a new type of propellant capable of giving sufficient speed to a heavy penetrator. In addition, due to the increased length of the penetrator, it was necessary to deepen the rear end of it into the charge to maintain adequate dimensions."
 nsb_ap_du_ammo2:0 "Modern Depleted Uranium APFSDS Elongated Projectile Ammunition"
 nsb_ap_du_ammo2_desc:0 "The modern APFSDS depleted uranium projectile was created as a response to the emergence of improved protection in the form of new generations of ERA and NERA, which required a further increase in the diameter to length ratio, which can now reach 35:1 or more, but led to the fact that the rear end of the penetrator rests on charge bottom; in addition to this, a new high-energy propellant was used to accelerate the projectile even more and somewhat compensate for the amount of charge removed to accommodate the extended penetrator, and a steel tip has also been added to overcome ERA more effectively."
 nsb_ap_du_ammo3:0 "Advanced Modern Depleted Uranium APFSDS Elongated Projectile Ammunition"
 nsb_ap_du_ammo3_desc:0 "The advanced modern APFSDS depleted uranium projectile has not practically changed in dimensions compared to previous models, which is associated with reaching the limit in increasing the ratio of diameter to length and the restrictions imposed by the internal volume of the combat vehicle, but this did not prevent the projectile from being made even better: the plumage was made more optimally, further reducing drag, and the propellant is packed more tightly thanks to the new sequential filling technology. The potential of these projectiles will be fully revealed only with the help of the most modern tank guns for which they were originally created."

 nsb_he_ammo0:0 "HE Ammunition I (Chemical Ammunition)"
 nsb_he_ammo0_desc:0 "Under high-explosive ammunition, as a rule, are meant a variety of projectiles, that affect the target with damaging factors caused by a chemical reaction, that is, an explosion, a shock wave, fragments formed, or ready-made submunitions. Such ammunition is usually more effective against infantry, fortifications, and lightly armored vehicles. The design of such ammunition is quite simple - metal shell with a detonator and filled with explosives, borrowed from those used by field and artillery guns, and if the tank gun is made on their basis or is their adaptation, then the same shells are used without changes."
 nsb_he_ammo1:0 "HE Ammunition III"
 nsb_he_ammo1_desc:0 "Although it would seem a difficult task to improve on the simple design of a high-explosive projectile for direct firing of guns, which performs the simple task of hitting a target and exploding, nevertheless, there is room for modernization and development, especially given the more specific requirements, different from projectiles made for artillery. The early Cold War HE projectile for direct-firing guns has a more streamlined shape, an improved detonator, and more powerful explosives, which allows it to hit soft and lightly armored targets more accurately and deal more damage than before. In addition, the advent of smoothbore guns required the addition of drop-down empennage to stabilize flight and compensate for the lack of rifling."
 nsb_he_ammo2:0 "HE Ammunition IV"
 nsb_he_ammo2_desc:0 "The mid-Cold War HE projectile has acquired several simple but quite effective improvements: the use of new denser explosive packing methods and new grades of steel with improved fragmentation give more uniform fragments and in larger numbers, which provides such a projectile with a larger area of ​​destruction. For these projectiles, early models of programmable detonators also appeared, allowing the ammunition to be detonated directly over the head of the enemy, but since it is manually programmed, its effectiveness is limited."
 nsb_he_ammo3:0 "HE Ammunition V"
 nsb_he_ammo3_desc:0 "The HE shell of the end of the Cold War keeps pace with the times and continues to improve where it would seem that the reserve for modifications has been exhausted. Such a projectile is stuffed with thousands of ready-made striking elements, such as balls or flechettes, 0.5 or 3 mm in size, which makes it possible not to rely only on the fragmentation properties of the projectile body. Using a programmable detonator with remote detonation, where range-to-target data comes from the rangefinder and is entered automatically, makes it possible to strike the enemy behind the cover with high efficiency and accuracy, be it trenches or windows of buildings."
 nsb_he_ammo4:0 "HE Ammunition VI"
 nsb_he_ammo4_desc:0 "A modern HE projectile is equipped with a high-precision digital detonator with several modes (as well as the ability to switch them even when the projectile is already in the breech), which allows to set it not only for a certain distance but also to an explosion with a delay or on contact, which makes the projectile multifunctional and allows to use it not only to deal with targets hiding in shelters or behind obstacles but to effectively destroy said shelters and obstacles themselves. The cost of the projectile, however, corresponds to its functions."

 nsb_heat_ammo0:0 "HEAT Ammunition II"
 nsb_heat_ammo0_desc:0 "During the work on improving HEAT shells and taking into account the experience of World War II, it was noted that the rotation imparted to the projectile in the bore interfered with the formation of a penetrating jet stream, which significantly reduced armor-piercing characteristics. This led to efforts to reduce the rotation of the projectile, for which the attachment of a fixed caliber size and folding over-caliber plumage was started, which slowed down the longitudinal rotation and increased accuracy among other things. Initially, these developments were used only for anti-tank and recoilless guns shells, but over time they got to the tanks as well."
 nsb_heat_ammo1:0 "HEAT Ammunition III"
 nsb_heat_ammo1_desc:0 "The early Cold War HEAT projectile received important improvements such as the standoff, which is an extended nose cap or probe in front of the warhead, necessary to ensure the formation of a jet at an optimal distance and ensure that the detonator fires at sharper angles of impact; in addition, the generally more reliable, piezoelectric detonator began to be used most often, supplemented by more efficient liner shape and more powerful explosives."
 nsb_heat_ammo2:0 "HEAT Ammunition IV"
 nsb_heat_ammo2_desc:0 "By the middle of the Cold War, difficulties arose for HEAT projectiles due to the fact that combined armor, specially designed against such projectiles, became more widespread. To combat it, it was necessary to improve the formation of the jet, which was achieved by adding a wave shaper amplifier - a body of a cylindrical or hemispherical shape of an inert material (for example, foamed plastic) located behind the funnel and allowing to change the path of the detonation wave more effectively, thus increasing armor penetration performance."
 nsb_heat_ammo3:0 "HEAT Ammunition V"
 nsb_heat_ammo3_desc:0 "By the end of the Cold War, the performance of HEAT projectiles began to be frankly inferior to APFSDS ones of the same period, which supplanted their role as the secondary type of shells in the MBT ammo rack, however, remaining the primary one for some light guns and low-pressure guns, where insufficient caliber or the inability to give the projectile the desired speed did not allow the use of a kinetic penetrator. To increase their effectiveness, further measures were taken to improve the formation and focusing of the jet, for example, the use of new explosives and the new methods of pressing them into the projectile body."
 nsb_heat_ammo4:0 "HEAT Ammunition VI"
 nsb_heat_ammo4_desc:0 "The widespread use of ERA, especially applicable to light vehicles, which has been the main goal of HEAT shells in recent times, required another upgrade. The early modern HEAT projectile borrows solutions from hand-held anti-tank grenade launchers and ATGMs, namely the tandem charge, where a weaker first-stage charge initiates a premature detonation of the ERA, rendering it useless, or makes a hole in spaced armor, preventing the second-stage charge from prematurely firing."
 nsb_heat_ammo5:0 "HEAT Ammunition VII"
 nsb_heat_ammo5_desc:0 "In developing means of combating new types of protection for armored vehicles, a modern HEAT projectile of a unique design was developed, incorporating the best practices and ideas. Its work is based on three shaped charges: the first stage charge in the nose of the projectile overcomes the ERA layer, the second stage charge located in the rear of the projectile passes through the channel inside the third stage charge without touching it and making a hole in the armor and overcoming part of the NERA, after which the third stage charge finally breaks through the armor and hits the target. The use of heavy metal tantalum liner instead of copper further enhances the projectile's capabilities, while remaining safe, unlike depleted uranium one. Unfortunately, due to the low speed of the projectile and poor trajectory, it is still inferior to the APFSDS projectile, while reaching the limit in possible development, unlike the latter; the price of all these innovations is also very high."
 nsb_heat_ammo6:0 "HEAT Ammunition IX"
 nsb_heat_ammo6_desc:0 "The high-explosive anti-tank multi-purpose (HEAT-MP) projectile appeared as a development of the idea of ​​more effectively using the explosive power of the HEAT projectile necessary for the formation of a penetrating jet, which, although it carries some threat to soft targets near the explosion, is mostly wasted, causing much less damage than is potentially possible. To increase the damaging effect against soft targets and thus make the HEAT projectile more versatile (which is especially important if it is the only type other than the kinetic penetrator one), it is possible to thicken the side walls of the projectile or add a fragmentation sleeve, increasing the lethal force at a minimal cost."

 nsb_hesh_ammo0:0 "HESH Ammunition (1955)"
 nsb_hesh_ammo0_desc:0 "The idea of a high-explosive squash head (HESH) projectile originated in Great Britain after World War II, as a means to combat enemy fortifications and also to destroy walls, fences, buildings, and roads. However, during the testing process, it turned out that in addition to concrete structures, this projectile has a good effect on armored targets too, which led to its adaptation to tank and military engineering guns. In terms of its design, the HESH projectile is similar to a high-explosive projectile but differs in thinner walls, the use of only plastic explosives, the optional use of an inert filler in the head, and a delayed fuse in the base. The principle of its action lies in the spreading of plastic explosives on the armor when it hits the target, and the explosion, leading to crumbling and fragmentation of the armor, often without breaking through it, and hitting the crew and internal components with the resulting fragments. Such a projectile, of course, is inferior in terms of impact on soft targets to a conventional HE, but it definitely surpasses a conventional HEAT one."

 nsb_heat_mp_ammo0:0 "HEAT-MP Ammunition (1985)"
 nsb_heat_mp_ammo0_desc:0 "The high-explosive anti-tank multi-purpose (HEAT-MP) projectile appeared as a development of the idea of ​​more effectively using the explosive power of the HEAT projectile necessary for the formation of a penetrating jet, which, although it carries some threat to soft targets near the explosion, is mostly wasted, causing much less damage than is potentially possible. To increase the damaging effect against soft targets and thus make the HEAT projectile more versatile (which is especially important if it is the only type other than the kinetic penetrator one), it is possible to thicken the side walls of the projectile or add a fragmentation sleeve, increasing the lethal force at a minimal cost."
 nsb_heat_mp_ammo1:0 "HEAT-MP Ammunition (1995)"
 nsb_heat_mp_ammo1_desc:0 "The early modern HEAT-MP, although further development of the concept, is strikingly different from past projectiles of this type, and all HEAT and HE projectiles in general created up to this point. It is sub-caliber and has a detachable sabot, which, was not used for a non-kinetic penetrator projectile before, but allows it to increase its initial speed by 30%; the dual-purpose fuze has impact and proximity modes, which allows it to be used not only against light armored vehicles, infantry and field fortifications but also against low-flying and low-speed air targets such as helicopters. However, due to the smaller size of the warhead of the projectile, its armor-piercing properties practically did not increase."
 nsb_heat_mp_ammo2:0 "HEAT-MP Ammunition (2005)"
 nsb_heat_mp_ammo2_desc:0 "Retaining the unusual design of its predecessor, the modern HEAT-MP projectile has received a number of important improvements that make it even deadlier for soft targets: the use of a body with improved fragmentation and more powerful explosives create a denser field of fragments, and an improved fuse allows it to use the air burst function at a given distance, giving greater tactical flexibility against targets hiding behind cover."

 nsb_heat_du_ammo0:0 "HEAT-DU Ammunition (1985)"
 nsb_heat_du_ammo0_desc:0 "The emergence of a new type of NERA armor, which has become almost impregnable for traditional HEAT projectiles, has spurred research in the field of lining materials. The solution turned out to be the same as for APFSDS shells at the time - depleted uranium. A lining of heavier depleted uranium in a shaped charge allows for an even more penetrating jet than before but is questionable when it comes to ethics, safety, and cost. "
 nsb_heat_du_ammo1:0 "HEAT-DU Ammunition (1995)"
 nsb_heat_du_ammo1_desc:0 "The widespread use of ERA, especially applicable to light vehicles, which has been the main goal of HEAT shells in recent times, required another upgrade. The early modern HEAT projectile borrows solutions from hand-held anti-tank grenade launchers and ATGMs, namely the tandem charge, where a weaker first-stage charge initiates a premature detonation of the ERA, rendering it useless, or makes a hole in spaced armor, preventing the second-stage charge from prematurely firing. The use of a depleted uranium liner in the second stage charge makes such a projectile even more lethal. Possibly for future generations as well."
 nsb_heat_du_ammo2:0 "HEAT-DU Ammunition (2005)"
 nsb_heat_du_ammo2_desc:0 "In developing means of combating new types of protection for armored vehicles, a modern HEAT projectile of a unique design was developed, incorporating the best practices and ideas. Its work is based on three shaped charges: the first stage charge in the nose of the projectile overcomes the ERA layer, the second stage charge located in the rear of the projectile passes through the channel inside the third stage charge without touching it and making a hole in the armor and overcoming part of the NERA, after which the third stage charge finally breaks through the armor and hits the target. The use of a depleted uranium liner instead of copper further enhances the projectile's capabilities, but for reasons of safety and economy, only the lining of the third stage charge is made of depleted uranium. Unfortunately, due to the low speed of the projectile and poor trajectory, it is still inferior to the APFSDS projectile, while reaching the limit in possible development, unlike the latter; the price of all these innovations is also very high."

 nsb_autoloader0:0 "Gun Rammer"
 nsb_autoloader0_desc:0 "The gun rammer is the simplest mechanism for accelerating the loading of a gun and is used mainly for large calibers. The rammer itself is driven by a spring mechanism that cocks when the gun rolls back. Alternatively, mechanisms with an external hydraulic or electromechanical drive may action the rammer. After firing, the loader places the next projectile in the tray, and the rammer sends it to the breech, saving the loader's strength and time."
 nsb_autoloader1:0 "Mechanised Ammo Rack"
 nsb_autoloader1_desc:0 "The mechanized ammunition rack is the forerunner of the automatic loader, being a combination of a rammer and a magazine with several shells, feeding and chambering shells as they are used up. Although most of the processes are automated, such an ammunition rack contains only a small part of the ammunition and cannot completely replace the loader, which performs some intermediate operations and replenishes the ammunition magazine."
 nsb_autoloader2:0 "Drum Loading Mechanism"
 nsb_autoloader2_desc:0 "The drum autoloader is a relatively simple gun-loading mechanism, equipped with the simplest mechanical drive; set in motion when the gun rolls back, it turns the drum and feeds the projectile to the tray, which is then sent into the breech by a spring rammer. It significantly increases the rate of fire, however, it uses the internal space of the tank inefficiently, limiting the size of the ammunition load, requires reloading, and doesn't completely replace the loader."
 nsb_autoloader3:0 "Early Carousel Loading Mechanism"
 nsb_autoloader3_desc:0 "Carousel-type autoloader, with a fully automated reloading cycle, where all or almost all of the shells are pre-packed in trays in a circle. The electro-hydraulic drive is quite complicated and not very reliable, and the location of the ammunition is more prone to detonation, however, this mechanism allows complete elimination of the loader and hence significantly reduces required internal volume and armor for it, making the tank smaller and lighter."
 nsb_autoloader4:0 "Modernised Carousel Loading Mechanism"
 nsb_autoloader4_desc:0 "The carousel autoloader of a simplified design replaces the electro-hydraulic drive with a fully electromechanical drive to reduce the risk of fire and increases reliability. This is paired with a slightly better location of the ammunition to reduce the risk of detonation. Although its volume and associated advantages remain the same, this design has a slower rate of fire and holds less ammo."
 nsb_autoloader5:0 "Advanced Carousel Loading Mechanism"
 nsb_autoloader5_desc:0 "Further development of carousel autoloaders includes new loading drives, improved electronic controllers, and other innovations that combine the greater safety and reliability of the previous generation of electro-mechanical carousel autoloaders with the high reloading speed of electro-hydraulic ones."
 nsb_autoloader6:0 "Modern Carousel Loading Mechanism"
 nsb_autoloader6_desc:0 "Carousel autoloader, which includes the latest advances in technology and materials - complete digitalization of all processes, cartridges for ammunition made of refractory materials (unfortunately, they do not completely eliminate the threat of an ammo explosion), but most importantly, adaptation for storing and loading the latest armor-piercing ammunition that couldn't be placed in older autoloaders of this type due to their size."

 nsb_conveyer_autoloader0:0 "Early Conveyor Belt Loading Mechanism"
 nsb_conveyer_autoloader0_desc:0 "Сonveyor belt type autoloader, with a fully automated reloading cycle, where most of the shells (usually half or two-thirds) are pre-packed into conveyor belt trays. Such a mechanism is simpler, faster, and more reliable than a carousel one, and the location of the ammunition load is less dangerous for the crew, however, it uses the reserved space less efficiently - the size of the aft niche of the tank turret, where the autoloader is usually located, directly depends on the size of the ammunition load, which limits its volume and forces the autoloader to be replenished more often."
 nsb_conveyer_autoloader1:0 "Advanced Conveyor Belt Loading Mechanism"
 nsb_conveyer_autoloader1_desc:0 "Conveyor belt automatic loader, complete with the new technological advances such as digital control with an integrated processor, barcodes that allow the system to recognize the type of ammunition in store, and improved electro-mechanical drives that speed up reloading. Replenishment of ammunition out of combat can be carried out with convenience through a hatch in the aft niche of the turret."
 nsb_conveyer_autoloader2:0 "Modern Conveyor Belt Loading Mechanism"
 nsb_conveyer_autoloader2_desc:0 "A conveyor belt automatic loader featuring the latest in technology, using new lightweight materials, an improved design for greater capacity, advanced safety to prevent ammunition detonation, and the unprecedented rate of fire. Of all the autoloaders, this one is the safest and most comfortable to use for the crew."

 nsb_drum_autoloader0:0 "Advanced Drum Loading Mechanism"
 nsb_drum_autoloader0_desc:0 "A rather original development of the idea of a drum autoloader, supplemented by modern technologies. In this loading mechanism, there is still a drum-type magazine containing several shells, however, unlike its predecessor, the loading cycle is completely automated: the rammer sends shells from the drum to the breech, and when it gets empty, it is replenished from a mechanized ammo rack. Not the most reliable scheme, but it allows making a series of shots with a minimum delay and faster than any other loading type."

 nsb_aiming_devices0:0 "Basic Aiming Mechanisms"
 nsb_aiming_devices0_desc:0 "Basic mechanical, electro-mechanical, and electro-hydraulic weapon guidance mechanisms. Since any changes in the position of the tank or its target must be corrected manually, it makes the work of the gunner more complicated and does not allow effective aiming and firing on the move."
 nsb_aiming_devices1:0 "One-Plane Stabilizer"
 nsb_aiming_devices1_desc:0 "A single-plane stabilizer is an electro-hydraulic mechanism with a gyroscope that allows the gunner to keep the gun on the target in a vertical plane, while the combat vehicle is in motion. Although early models of such stabilizers are expensive and imperfect, it allows aimed fire from short stops or when moving at a speed of up to 10 km/h, which provides a significant advantage over the enemy."
 nsb_aiming_devices2:0 "Two-Plane Stabilizer"
 nsb_aiming_devices2_desc:0 "A two-plane electro-hydraulic, or, less often, all-electric stabilizer ensures automatic smooth retention of the gun's position in the vertical and horizontal planes whilst the tank is moving. Such a system provides full-fledged targeted fire when the tank is moving at speeds up to 25 km/h, even with a change in the motion vector."
 nsb_aiming_devices3:0 "Computerised Aiming Systems"
 nsb_aiming_devices3_desc:0 "The advanced two-plane stabilization system includes all-electric guidance drives and an IC-based control unit. This makes the stabilizer much quieter and reduces the flammability (due to the reduction in the volume of the working fluid from several tens of liters to only a few liters), and increases the accuracy of stabilization at the expense of greater power consumption. Such a system also provides targeted fire when the tank is moving at speeds up to 30 km/h."
 nsb_aiming_devices4:0 "Advanced Computerised Aiming Systems"
 nsb_aiming_devices4_desc:0 "The stabilization system with new controllers and more powerful electric guidance motors drives reduces stabilization error and increases the speed and smoothness of guidance. A capacitor store ensures operation even when the engine is turned off or if the auxiliary power unit is damaged. The capabilities of such a system make it possible for a tank at speeds up to 35 km/h to hit targets moving at speeds up to 70 km/h. The cost is in line with the features."
 nsb_aiming_devices5:0 "Modern Computerised Aiming Systems"
 nsb_aiming_devices5_desc:0 "The stabilization system with advanced electronics and even more powerful guidance drives provides unprecedented guidance accuracy and allows the turret weighing more than 20 tons to make a complete rotation in a matter of seconds. With the reduction in stabilization errors, it became possible to conduct targeted fire at speeds up to 40 km/h, at targets moving more than 70 km/h, if such fast ground vehicles even exist. The complexity of manufacturing and the cost of production is unlikely to allow equipping all tanks with such a system."

 nsb_ballistic_calculator0:0 "Mechanical Ballisitc Computer"
 nsb_ballistic_calculator0_desc:0 "The mechanical arithmometer can perform rather complex calculations, taking into account the type of projectile, the range to the target, and even weather conditions, as well as automatically aim the gun after the calculations are completed and corrections are made, which makes it possible to fire much further and more accurately. However, all the necessary data is entered manually, the corrections are calculated separately on the ballistic drive, and the system itself is extremely expensive, unreliable, and difficult both to assemble and maintain, as well as to use by the crew, requiring advanced skills and creating additional workload, and therefore hardly will bring the expected positive effect."
 nsb_ballistic_calculator1:0 "Analog-Digital Ballisitc Computer"
 nsb_ballistic_calculator1_desc:0 "The analog-digital ballistic computer is a hybrid of advanced analog solutions that provide high speed but are limited in the variety of operations performed, and digital systems that are still not sufficiently developed to provide high speed but provide a greater variety of possible operations. Compared with the previous generation of purely mechanical or analog computers, the dimensions have been significantly reduced, while reliability and performance have increased."
 nsb_ballistic_calculator2:0 "Digital Ballisitc Computer / Digital Fire Control System"
 nsb_ballistic_calculator2_desc:0 "An electronic computer, based on solid-state elements and associated with several sensors, calculates the angular corrections for firing from a cannon with high accuracy. It automatically enters the range to the target from the laser rangefinder, crosswind speed, angular velocity of the target, and the angle of inclination of the axis of the trunnions of the gun. But, data on barometric pressure, air temperature, charge temperature, wear of the barrel bore, as well as corrections for the misalignment of the direction of the bore axis and the aiming line are still manually entered."
 nsb_ballistic_calculator3:0 "Advanced Digital Ballisitc Computer / Digital Fire Control System"
 nsb_ballistic_calculator3_desc:0 "A fully digital computer with several (or even several dozen) processors with 8-, 16-, or 32-bit architectures. All the necessary data, including side wind, target range, bore wear, cannon trunnion axis roll, air temperature, and atmospheric pressure, are collected and processed automatically. This complex provides the crew with continuous receipt of navigation data, information about the availability of fuel and ammunition, the state of tank systems, as well as the combat status and location of other tanks of the unit, and information about the enemy. Through the data transmission equipment, all the necessary information is sent to other tanks, to the unit commander, and to the logistics system. The system itself is the first step towards integrating the tank into the emerging doctrine of network-centric warfare and the formation of a tank information and control system. The cost of the entire electronic filling is a significant share of the cost of the combat vehicle itself."
 nsb_ballistic_calculator4:0 "Early Modern Digital Ballisitc Computer"
 nsb_ballistic_calculator4_desc:0 "The early modern fire control system has gone far from its former role as a purely ballistic computer, becoming an integral part of a modern combat vehicle, created taking into account the doctrine of network-centric warfare, where all combat units are networked, continuously exchanging with each other relevant high-precision intelligence on the location of allied and enemy forces, current collisions and much more. This system, equipped with powerful processors, reliable transmitters, and color displays, allows the combat vehicle commander to track the location in space on high-precision digital maps in real time, increasing tactical situational awareness and allowing the crew to operate and complete assigned tasks more efficiently."
 nsb_ballistic_calculator5:0 "Modern Digital Ballisitc Computer"
 nsb_ballistic_calculator5_desc:0 "The modern fire control system features improved ergonomics and full, direct integration into the command and information structure of the army, which allows the vehicle commander to exchange data even with the help of satellites, increasing the speed, scale, and accuracy of transmitted information. In addition, means of communication are compatible with the information and combat networks of other units and formations, as well as infantry, allowing armored vehicles to operate more efficiently and smoothly in battle."
 nsb_ballistic_calculator6:0 "Advanced Modern Digital Ballisitc Computer"
 nsb_ballistic_calculator6_desc:0 "The advanced modern fire control system includes improvements to hardware components, such as high-resolution color touch displays and faster processing speeds, and software improvements featuring a more intuitive interface which provides increased situational awareness."

 nsb_optics0:0 "Basic Optic Sights"
 nsb_optics0_desc:0 "Basic periscopic and telescopic optical devices of the commander and gunner, provide the possibility of observation and aiming in battle. Range measurement is carried out using a stadiametric rangefinder or rangefinding grid. Efficiency varies depending on the experience of the crew and the ability to identify the target and accordingly determine its height, without which it is impossible to accurately determine the distance."
 nsb_optics1:0 "Sight With Optical Rangefinder"
 nsb_optics1_desc:0 "Optical rangefinders are the collective name for optical devices that allow determining the range to a target in a geometric manner using two prisms spaced apart from each other, which provide a significant advantage in combat. These include coincidence and stereoscopic rangefinders. Although such rangefinders have been known for decades and have long been used in naval and anti-aircraft artillery, they have only recently been adapted to tanks. This category indirectly also includes the recently invented and rare optical-electric rangefinders emitting light or infrared pulses and measuring the time it takes for electromagnetic waves to travel the distance in the optical or infrared ranges, which were essentially the forerunners of the laser rangefinder. Since the accuracy of measuring the distance of an optical rangefinder directly depends on the stereo base, that is, the distance between the prisms, this makes it rather large-sized, and leads to an increase in the internal volume of the tank and weakens armor protection."
 nsb_optics2:0 "Stabilized Basic Sight"
 nsb_optics2_desc:0 "Equipping periscopic and telescopic optical sights with a three-stage stabilizer gyroscope, a predictor gyroscope, and an automated electric drive allows for reliable stabilization of the sight in the vertical plane, simplifying the work of the gunner and allowing more accurate aiming on the move. However, since the range is still determined stadiametrically, such a sight is inferior to sights with an optical rangefinder when shooting at long distances."
 nsb_optics3:0 "Stabilized Sight With Optical Rangefinder"
 nsb_optics3_desc:0 "The improved sight with an optical rangefinder is in many ways superior to the previous generation of these. Improved rangefinder optics providing accurate range measurement up to 3000-4000 meters, and independent stabilization of the sight in the vertical plane, coupled with several simple sensors, made it possible to calculate the aiming angle from the measured range and automatically enter it into the gun drive. It is also possible to take into account the tank’s own motion, determined using the tank’s speed sensor and cosine a potentiometer that fixes the position of the turret relative to the tank hull."
 nsb_optics4:0 "Sight With Laser Rangefinder"
 nsb_optics4_desc:0 "Equipped with a revolutionary development of recent times - a laser rangefinder - this sight represents a real breakthrough in target acquisition. The laser rangefinder works on the principle of measuring the time it takes for a laser pulse to travel to a target and return, which, given the speed of light, makes it trivial to calculate the distance with high accuracy, plus or minus 10 meters at a distance of up to 10,000 meters (where 5000 meters is usually more than enough in combat). Laser rangefinders of this period are usually based on an artificial ruby as a laser medium, although occasionally, a more effective neodymium-doped yttrium aluminum garnet is used. Despite the shortcomings of early models, such a system will definitely increase combat effectiveness."
 nsb_optics5:0 "Advanced Sight With Laser Rangefinder"
 nsb_optics5_desc:0 "The new generation of optics, among other minor improvements, is almost universally equipped with a more advanced laser rangefinder based on neodymium-doped yttrium aluminum garnet, but most importantly, the sight is equipped with full stabilization of the line of sight in two planes: this significantly improves accuracy  on the move, since for sight it is easier to ensure a low error during stabilization than when stabilizing the gun. In addition, a sight stabilized in two planes makes it possible to combine the process of aiming and using a laser rangefinder with loading a gun on the move, since after a shot the turret (if any) is locked onto the body of the combat vehicle, which previously prevented the gunner from performing these operations throughout the entire loading cycle."
 nsb_optics6:0 "Early Modern Sight With Laser Rangefinder"
 nsb_optics6_desc:0 "Further improvement of optical sights associated with a reduction in their dimensions and weight, an advanced self-testing system for operational errors, the addition of a Raman resonator to a laser rangefinder, which decreases the wavelength of the laser beam to eye-safe values, as well as the inclusion of a far target locate subsystem that provides aimed fire up to 8000 meters."
 nsb_optics7:0 "Advanced Sight With Laser Rangefinder"
 nsb_optics7_desc:0 "The latest sighting optics, supplemented by external cameras, displaying data on a digital display and equipped with target recognition systems, significantly increase the situational awareness of the crew and its combat capabilities. Such a system has several disadvantages, such as high cost or the risk of the crew going "blind" if the cameras are damaged, but this does not negate the fact that such a system takes up less space, creates fewer weak spots in the armor and protects the crew from the possibility of actually going blind, if the optics would get affected by enemy laser systems."

 nsb_pano_sight0:0 "Early Panoramic Sight"
 nsb_pano_sight0_desc:0 "The tank commander's panoramic sight is a new paradigm in tank optics. Derotational optics provide a full all-around view and improved target detection, while independent two-plane stabilization ensures that the target is constantly kept in the commander's field of view. Also, in the presence of modern aiming systems, a panoramic sight can be integrated into the tank's fire-control systems, which will enable the commander, if necessary, to take on the work of the gunner as well as take full control of aiming systems. However, such luxury comes with a high price and low reliability."
 nsb_pano_sight1:0 "Advanced Panoramic Sight"
 nsb_pano_sight1_desc:0 "The tank commander's panoramic sight, upgraded with the latest electronics and more expensive materials such as rare earth metals, provides greater integration with the tank's fire control systems and improves the quality of observation while stationary and on the move. To match the gun with the sight, which has a stabilized field of view when it is aimed, the sight constantly generates data on inertial mismatches between the aiming line and the position of the turret and on the origin of the vertical angles. The mirror of the automatic alignment system, attached to the front of the barrel, is used to maintain a consistent (calibrated) position of the sight and gun."
 nsb_pano_sight2:0 "Modern Panoramic Sight"
 nsb_pano_sight2_desc:0 "Further development of tank panoramic sights, with even better performance. Among the innovations is the hunter-killer system, in which the tank commander searches for targets in real-time and immediately transmits their coordinates to the gunner, as well as the ability to transmit data on detected targets to other tanks within a platoon, company, or even battalion if the required hardware is installed."

 nsb_awareness_system:0 "Crew Situational Awareness System"
 nsb_awareness_system_desc:0 "From the very appearance of the first armored vehicles, their crews faced the most difficult task of orienting themselves in the battlespace; detecting and destroying the enemy, whilst themselves in a cramped space with limited view. Extreme inconvenience, stress, and tension greatly complicated the work of the crew. For more than a hundred years of the existence of tanks, surveillance devices have come a long way from unglazed slits in the armor to sights for the gunner and commander stabilized in two planes, panoramic sights, external surveillance cameras - but all this did not help to completely solve the problems of the claustrophobic working environment inside the combat vehicles. However, the latest technological advances make it possible to solve this: through augmented reality technology, and using information from optoelectronic surveillance channels, it is possible to create a seamless all-round view through armor, which also indicates allied and enemy locations, according to information received from allied units. Such a system will revolutionize the conduct of combat, providing the crew with maximum situational awareness and significantly our crew's lethality."

 nsb_light_guns:0 "Early WW2 Light Gun"
 nsb_light_guns_desc:0 "The light tank gun was the most common size of gun in the pre-war and early-World War II period. It was the main armament of light tanks, which formed the basis of most nation's tank fleets in this period. For reasons including the lack of worthy targets and the insufficient carrying capacity of light tanks, the gun caliber and ammunition lethality remained low."
 nsb_light_guns1:0 "Mid-WW2 Light Gun"
 nsb_light_guns1_desc:0 "Mid-World War II light tank gun is a collective name for light tank guns mounted or planned to be mounted on light tanks, ranging from anti-tank guns to light artillery. As the opposing sides were limited in tank-production know-how, new light guns were often reserved for tank destroyers, whilst the general-purpose light tanks were still built with guns of the previous generation."
 nsb_light_guns2:0 "Late WW2 Light Gun"
 nsb_light_guns2_desc:0 "The light tank gun of the end of World War II did not go far in terms of caliber from its predecessors but significantly moved forward in terms of barrel length and allowable pressures. This made it possible to use more powerful projectiles and thus remain relevant with the advent of more well-armored targets."
 nsb_light_guns3:0 "Post-WW2 Light Gun"
 nsb_light_guns3_desc:0 "The post-war light tank gun represents a continuation of the struggle to keep the light tank relevant on the battlefield. Numerous improvements, including muzzle brakes, bore evacuator, new anti-recoil devices and a longer barrels, allowed light tanks to remain relevant on the battlefield of the 1950s."
 nsb_light_guns4:0 "Early Cold War Light Gun"
 nsb_light_guns4_desc:0 "The light tank gun of the beginning of the Cold War largely continues the traditions of its predecessors, remaining more of a means of support and ambush attack. With the increase in caliber and barrel length, these guns caught up with those from the middle of World War II while being much more compact and lighter. However, such guns were rarely fitted to the tanks of this period, where cheaper low-pressure or ATGM-launching capable guns were favored."
 nsb_light_guns5:0 "Mid-Cold War Light Gun"
 nsb_light_guns5_desc:0 "The light tank gun of the middle of the Cold War was created in the face of a large number of requirements for enhanced tank mobility, amphibious capability, and air transportability. For these purposes, the tried-and-tested guns of late- and post-war medium tanks were lightened and equipped, given shrunk recoil devices and fitted to light armored vehicles."
 nsb_light_guns6:0 "Late Cold War Light Gun"
 nsb_light_guns6_desc:0 "The light tank gun of the late Cold War in many respects, including the caliber, approached those on the main battle tanks of the early Cold War, yielding to them only in bore pressure due to size and weight restrictions. However, the increased firepower makes the light tanks and other combat vehicles of this period equipped with such a cannon a serious threat to vehicles of their own class and to older main battle tanks. Light vehicles must use their superior mobility and concealment advantages to gain an advantage over contemporary main battle tanks."
 nsb_light_guns7:0 "Early Modern Light Gun"
 nsb_light_guns7_desc:0 "The early modern light tank gun is a direct adaptation of past generation main battle tank guns to a light chassis, with some modifications to suit light vehicles. Such a gun provides significant firepower and accuracy, almost on par with main battle tanks, which greatly expands the tactical capabilities of the combat vehicle equipped with it."
 nsb_light_guns8:0 "Modern Light Gun"
 nsb_light_guns8_desc:0 "The modern light tank gun is either a further modernization of the guns of late medium tanks and early main battle tanks, or a lighter version of the gun of a modern main battle tank. New recoil dampening devices allow barrel lengthening and use of more powerful projectile charges, thus increasing the ballistic performance and accuracy of these guns."
 nsb_light_guns9:0 "Advanced Modern Light Gun"
 nsb_light_guns9_desc:0 "Advanced modern light tank guns are the ultimate development of this class of guns. New technologies, alloys, and composite materials used in the manufacture of these guns make it possible to further increase the allowable pressure in the bore, enabling use of more powerful projectiles whilst remaining within the design constraints of light tanks."

 nsb_low_pressure_guns:0 "Post-WW2 Low Preassure Gun"
 nsb_low_pressure_guns_desc:0 "The low-pressure gun was developed after World War II, and, as the name suggests, operates at a much lower pressure in the breech and bore than a conventional light gun. Although the low-pressure gun is inferior to the conventional light tank one in almost every respect and cannot use kinetic penetrator rounds due to insufficient velocity attached to the projectile, it is a cheap and affordable weapon. It is excellent for light and mass-produced armored vehicles. In addition, the simplicity of design, a minimum of moving parts, and low stress make such a gun much more reliable than any other."
 nsb_low_pressure_guns1:0 "Early Cold War Low Preassure Gun"
 nsb_low_pressure_guns1_desc:0 "The low-pressure gun of the early Cold War features a longer barrel, allowing it to fire farther and more accurately than usual while remaining simple and cheap. In addition, this gun is better adapted to the newly emerging class of infantry fighting vehicles, which will allow them to better protect themselves."
 nsb_low_pressure_guns2:0 "Mid-Cold War Low Preassure Gun"
 nsb_low_pressure_guns2_desc:0 "In a continuation of the fight against the two main disadvantages of low-pressure guns - low accuracy and range, low-pressure guns of the mid Cold War are made with even longer barrels, using more precise manufacturing technologies, thus allowing even the lightest vehicles equipped with them to pose a noticeable threat to enemy light armored vehicles."
 nsb_low_pressure_guns3:0 "Early Modern Low Preassure Gun"
 nsb_low_pressure_guns3_desc:0 "The early modern low-pressure gun has a larger caliber and even longer barrel length, which allows not only increasing accuracy but also using the gun to launch ATGMs, making vehicles equipped with it even more dangerous to the enemy."

 nsb_medium_guns:0 "Early WW2 Medium Gun"
 nsb_medium_guns_desc:0 "The medium tank gun of the early World War II appeared shortly before the war after the doctrinal realisation that tanks would be involved in tank versus tank combat, not just close infantry support. These guns, on one hand, are significantly superior to any light guns, allowing them to hit infantry and armored vehicles more effectively, but on the other hand, it had mediocre ballistics due to their short barrels. These guns were also installed on early heavy tanks."
 nsb_medium_guns1:0 "Mid-WW2 Medium Gun"
 nsb_medium_guns1_desc:0 "A mid-World War II medium tank gun with a larger caliber and longer barrel than previous guns of this class. They were usually developed from an anti-aircraft guns that proved successful in an anti-tank role. They provide a longer range and excellent ballistics."
 nsb_medium_guns2:0 "Late WW2 Medium Gun"
 nsb_medium_guns2_desc:0 "Medium guns of late World War II continue the trend of increasing caliber and barrel length, which became possible with the increased size of medium tanks and the emergence of new recoil mechanisms. Their characteristic feature is ease of manufacture, associated with a request for mass production of tanks."
 nsb_medium_guns3:0 "Post-WW2 Medium Gun"
 nsb_medium_guns3_desc:0 "Medium guns after World War II are largely improvements and developments of previous designs, undergoing a number of changes such as the addition of a bore evacuator, reinforced breech and gun barrel, making them even more powerful and effective."
 nsb_medium_guns4:0 "Early Cold War MBT Gun"
 nsb_medium_guns4_desc:0 "The main battle tank guns that appeared in the initial period of the Cold War did not go far in terms of weight, size and caliber from medium tank guns, but gained the ability to use more powerful projectiles and showed improved ballistics, making them comparable to heavy tank guns. An important milestone of this period is also the appearance of smooth-bore guns, which had a number of advantages over traditional rifled guns."
 nsb_medium_guns5:0 "Mid-Cold War MBT Gun"
 nsb_medium_guns5_desc:0 "The guns of the main battle tanks of the mid-Cold War are characterized by the use of a number of important innovations, such as stricter tolerances for curvature in the manufacture of barrels and a thermal sleeve for the gun barrel, which prevents the barrel from warping due to uneven temperature effects of the environment, thus significantly increasing the accuracy and range of fire. These guns were also the first to use a barrel distortion sensor, which, in the presence of a fire control system, allows  correction of barrel-warp-induced inaccuries. With these improvements, the effective firing range approaches 3 kilometers."
 nsb_medium_guns6:0 "Late Cold War MBT Gun"
 nsb_medium_guns6_desc:0 "With the continued improvement of the armament of tanks, the main battle tank gun of the end of the Cold War adopted many design improvements. A quick-detachable barrel removes the need to partially disassemble of the turret or superstructure for gun maintenance. Improved alignment and a better location of anti-recoil devices make it possible to fire more efficiently and without loss of accuracy. This, as well as improved barrel curvature sensors, provide a firing range of up to 4 kilometers."
 nsb_medium_guns7:0 "Early Modern MBT Gun"
 nsb_medium_guns7_desc:0 "Early modern main battle tank guns are characterized by greater attention to quality and precision than before, made possible by the shift away from the emphasis on mass production and the advent of new manufacturing techniques. For example, new methods of barrel chrome plating significantly increase the life of both smoothbore and rifled guns, reducing wear and tear with each shot, and thus reducing the effect of repeated firing on accuracy. These improvements extend the range of these guns to 4.5 kilometers."
 nsb_medium_guns8:0 "Modern MBT Gun"
 nsb_medium_guns8_desc:0 "Modern main battle tank guns continue to increase their firepower, which is achieved thanks to a longer barrel, the use of new insulating materials in the thermal sleeve, and a reinforced breech. This increase increases the effective firing range to an astonishing 5 kilometers."
 nsb_medium_guns9:0 "Advanced Modern MBT Gun"
 nsb_medium_guns9_desc:0 "Advanced modern main battle tank guns, while still accommodating rigid size and weight requirements, have peaked in firepower, be it through chamber volume increase, slight caliber increases, barrel lengthening, or a combination of all those. This was paired with even more effective recoil control devices. The firing range surpasses all previous tank guns - 7 kilometers. This requires, however, either ideal visibility conditions or obtaining the most accurate data on the location of the enemy from other units."

 nsb_heavy_guns1:0 "Mid-WW2 Heavy Gun"
 nsb_heavy_guns1_desc:0 "An extremely powerful heavy tank gun, first designed specifically for heavy tanks in the middle of World War II. Such guns were usually developed on the basis of field guns, which provided them with a long firing range and excellent armor penetration. The only drawback of such guns was the low rate of fire due to the weight of the projectile, the remedy for which to use a separate cartridge case loading."
 nsb_heavy_guns2:0 "Late WW2 Heavy Gun"
 nsb_heavy_guns2_desc:0 "The heavy tank gun of the end of World War II is a development of the ideas of a specialized heavy tank gun and is distinguished by more advanced recoil mechanisms, and a longer and stronger barrel, which made it possible to withstand higher pressure and fire more powerful projectiles. These guns were often developed based on especially powerful anti-aircraft or naval guns, although there were also purpose-designed ones."
 nsb_heavy_guns3:0 "Post-WW2 Heavy Gun"
 nsb_heavy_guns3_desc:0 "The post-war heavy tank gun underwent several upgrades, including increased barrel survivability, a bore evacuator, and  optionally a more effective muzzle brake. As before, the main task of such guns was to defeat all types of armored enemy targets at extreme distances."
 nsb_heavy_guns4:0 "Early Cold War Heavy Gun"
 nsb_heavy_guns4_desc:0 "The early Cold War heavy tank gun is the latest attempt to keep heavy tanks on the battlefield. Still larger and more powerful than a medium tank gun, it is nevertheless an intermediary on the way to a main battle tank gun with potentially equal performance, making the heavy tank gun a dead-end development option."
 nsb_heavy_guns5:0 "Early MBT Heavy Gun"
 nsb_heavy_guns5_desc:0 "With the advent of new protection technologies including composite armour, NERA elements, and ERA capable of diminishing the penetration of APFSDS rounds, old tank guns have lost their edge. Although it is possible to upgrade the armour-piercing capabilities of the shell itself to overcome this problem, some have proposed a radical alternative - to significantly increase the caliber of the gun. This significantly increases the range and penetration, even when employing the older projectiles. A heavy gun for the main battle tank, even if of similar dimensions to conventional guns, will necessitate a replacement the loader with an autoloader, reduction in ammunition supply (due to larger shell sizes), and add significant maintenance burden. In addition, there is a possibility that we will start a new round of the arms race in tank building, and the potential enemy will do the same, completely nullifying our own efforts to protect the tank."
 nsb_heavy_guns6:0 "Modernised MBT Heavy Gun"
 nsb_heavy_guns6_desc:0 "Unlike its predecessor, the modernized heavy gun of the main battle tank is better adapted for installation in a modern mass-production tank, without the need for significant design changes. The increased barrel length and more powerful recoil suppression mechanisms allow increasing firepower without negatively affecting the performance and the tank itself."
 nsb_heavy_guns7:0 "Advanced MBT Heavy Gun"
 nsb_heavy_guns7_desc:0 "The advanced main battle tank heavy gun is the pinnacle of tank guns, providing unrivaled firepower. Thanks to advanced balancing and a lightweight modular design, its installation has almost no effect on the reliability of the tank as a whole, although the problem of a reduced ammunition load remains unresolved."

 nsb_superheavy_guns1:0 "Early Cold War Super-Heavy Gun"
 nsb_superheavy_guns1_desc:0 "A monstrous anti-tank gun of huge caliber, having colossal power, capable of penetrating any tank of its time. However, due to its ginormous weight, recoil, and cost, it is unlikely to be able to be installed on a tank chassis without sacrificing reliability or armor. It's extremely low rate of fire also limits the usefulness of such large weapons."

 nsb_gun_launcher0:0 "Gun-ATGM Launcher"
 nsb_gun_launcher0_desc:0 "The gun-ATGM launcher is a further development of the idea of equipping the tank with highly effective guided weapons, but with the preservation of the tank's armament and without the need to place the ATGM outside the tank. Such a gun, as a rule, had a large caliber, but was at the same time short-barreled and low-velocity. This made it possible to install on light vehicles, but did not allow the effective employment use of regular armor-piercing shells."

 nsb_tank_design:0 "Combat Vehicle Design"
 nsb_tank_design_desc:0 ""

 nsb_iw_armored_vehicles:0 "Combat Vehicle Design"
 nsb_iw_armored_vehicles_desc:0 ""

 nsb_light_tanks0:0 "Mid-WW2 Light Tank"
 nsb_light_tanks0_desc:0 "The light hull of an armored fighting vehicle in the middle of World War II is a modified design that corrects many previous shortcomings - an improved armor scheme, a better transmission location, and more powerful weapons. However, on a battlefield dominated by medium and heavy tanks, the role of the light tank has shifted to a mostly reconnaissance one. Light self-propelled artillery and air defense guns were developed purposefully, and the chassis of a light tank was used as a base to unify components and assemblies. On the other hand, many armored personnel carriers of this period became platforms for placing anti-tank, anti-aircraft, or artillery weapons."
 nsb_light_tanks1:0 "Late WW2 Light Tank"
 nsb_light_tanks1_desc:0 "The light hull of the end of World War II is a design that takes into account all the experiences of the war, which makes these models more reliable and technically advanced. In some countries, the concept of a "light combat team" is emerging - a series of vehicles based on a single light chassis, such as self-propelled guns, tank destroyers, armored recovery vehicles, self-propelled anti-aircraft guns, and so on. However, during this period, very few countries produced equipment of this type, limited only to projects and experimental models, since the war was nearing its end, the old armored personnel carriers coped well with the tasks assigned to them, and light tanks as a whole showed themselves poorly."
 nsb_light_tanks2:0 "Post-WW2 Light Tank"
 nsb_light_tanks2_desc:0 "After World War II, with the fall of the short-lived and fragile status quo, interest in light vehicles is growing again. Light tanks are developed mainly as a means of reconnaissance and reinforcement of the airborne forces, self-propelled anti-tank and artillery weapons are created on a light platform. Many countries across the world are beginning programs for the mass mechanization of the army, for which they are expanding the production of new wheeled and tracked armored personnel carriers. At the same time, the semi-tracked base is being abandoned as unreliable and poorly performing the role of a separate wheeled or tracked chassis."
 nsb_light_tanks3:0 "Early Cold War Light Tank"
 nsb_light_tanks3_desc:0 "The light hull armored vehicle of the early Cold War differed from the past by growing demands, including increased mobility and the ability to cross water barriers. The improved design and higher reliability of the light hull, coupled with the urgent need for quick mechanization with cheap means, in many countries led to the mass production of wheeled armored personnel carriers, which often use parts from conventional trucks. Light tanks and vehicles based on them are used almost exclusively as reconnaissance or anti-tank vehicles."
 nsb_light_tanks4:0 "Mid-Cold War Light Tank"
 nsb_light_tanks4_desc:0 "The mid-Cold War light armored vehicle hull is a versatile wheeled or tracked base for a variety of tasks. During this period, happens a complete transition to the creation of light vehicles, designed purely for reconnaissance or support for airborne units, while light tanks are being replaced in this role by armored personnel carriers and infantry fighting vehicles. The features of light vehicles, their low weight, and high air transportability are used to the maximum. The installation of an ATGM, once optional, is now practically mandatory to ensure the ability to counter modern tanks."
 nsb_light_tanks5:0 "Late Cold War Light Tank"
 nsb_light_tanks5_desc:0 "The light hull of the late Cold War armored vehicle is a qualitative leap forward compared to previous models, using many of the innovative trends of its time. A more successful design provides better protection against mines and allows the installation of stronger armor protection. Vehicles of this period are also characterized by bolder experiments in the use of automatic loaders and weapons close in caliber to early main battle tanks."
 nsb_light_tanks6:0 "Early Modern Light Tank"
 nsb_light_tanks6_desc:0 "The early modern light hull of an armored vehicle is developed as a versatile multi-purpose platform capable of carrying a wider variety of weapons. The design includes the possibility of installing external composite elements, if needed. Infantry fighting vehicles of this period are distinguished by increased combat power and versatility, thanks to the installation of automatic guns of 40mm or bigger caliber. Light vehicles of this period are notable for the wide distribution of well-protected wheeled platforms capable of carrying weapons comparable to the caliber of a main battle tank, which was unique for tracked armored vehicles before. Such a "wheeled renaissance" is associated both with new technical capabilities that allow for heavy loads on the wheeled chassis and with increased requirements for the speed of armored combat vehicles."
 nsb_light_tanks7:0 "Modern Light Tank"
 nsb_light_tanks7_desc:0 "The modern light hull of an armored vehicle is a well-formed universal platform, which is conceived as part of the network-centric warfare from the start, which forms new requirements for design, capabilities, and internal filling. One of the distinguishing features is the modular design and placement of weapons, which provides tactical and strategic flexibility. The light combat vehicles of this period largely follow the concept of low-intensity warfare, which implies high mobility and weapons optimal for their tasks, while traditional main battle tanks are very mediocre in the former and redundant in the latter."
 nsb_light_tanks8:0 "Advanced Modern Light Tank"
 nsb_light_tanks8_desc:0 "An advanced modern light hull is the crowning achievement of light armored fighting vehicles, although they can be called "light" with a stretch: their mass, protection and even weapons are comparable to late medium tanks or early main battle tanks, the main difference is advanced technical solutions and materials, as well as their use in the role a light tank or the creation of an infantry fighting vehicle and an armored personnel carrier based on them. The main requirements for light tanks of this period are high speed, mobility, and cross-country ability, and for armored personnel carriers and infantry fighting vehicles - maximum protection for the crew and troops."

 nsb_main_battle_tanks0:0 "Mid-WW2 Medium Tank"
 nsb_main_battle_tanks0_desc:0 "Medium tanks of the middle of World War II are a combination of experience from several years of war and very specific requests. The concept of a medium tank ranges from mass-produced and easy to maintain, to close in terms of armor and complexity of a heavy tank, depending on the manufacturer's country and its tank doctrine. The medium tanks of this period are also distinguished both by the introduction of technical innovations and more powerful weapons, and sloped armor on them has become an almost indispensable requirement."
 nsb_main_battle_tanks1:0 "Late WW2 Medium Tank"
 nsb_main_battle_tanks1_desc:0 "The medium tank of the end of World War II embodies all its experience and the most important features demanded during the war - simplicity, reliability, and cheapness. The vehicles of this period are significantly superior to their predecessors in terms of protection and armament, but in these indicators, they are still far from heavy tanks. Sloped armor, which has become an undeniable standard, and many other principles implemented in these tanks will form the basis of the future main battle tank."
 nsb_main_battle_tanks2:0 "Post-WW2 Medium Tank"
 nsb_main_battle_tanks2_desc:0 "The medium tank after World War II is the ultimate development of the core of the armored force. Closely matching the protection and armament of heavy tanks, while maintaining the economic and reliability advantages of medium tanks. Various innovations are installed on the tanks of this period, such as ballistic computers and optical rangefinders. These tanks are the peak development of the medium tank concept and are the last of their kind in the traditional sense of the term."
 nsb_main_battle_tanks3:0 "First Gen MBT"
 nsb_main_battle_tanks3_desc:0 "The question of defining the term main battle tank is rather complicated: the very definition of the main tank existed even before the World War II and medium tanks formed the basis of the armored forces during World War II and after, which made them the main ones de facto. However, tanks from this particular period became the first generation of main battle tanks: they were initially developed as universal combat vehicles, combining the best qualities of medium and heavy tanks, capable of performing the tasks of both. Additionally, tanks of this period were the first to receive combined armor, autoloaders, and laser rangefinders."
 nsb_main_battle_tanks4:0 "First+ Gen MBT"
 nsb_main_battle_tanks4_desc:0 "Significantly modernized first generation main battle tanks, well designed and more reliable, with the correction of the deficiencies of the first generation, better suited for the installation of new generation control systems, weapons, and combined armor, with great potential for further modernization. Also, the tanks of this time became the first mass-produced ones, on which a gas turbine engine was installed as the main propulsion engine."
 nsb_main_battle_tanks5:0 "Second Gen MBT"
 nsb_main_battle_tanks5_desc:0 "The main battle tank of the second generation is a qualitative step forward in tank building. Its design and subsystems initially assume the placement of modern optics, including the commander's panoramic sight, and digital electronics. A distinctive feature of this generation of tanks is significantly increased protection due to the use of a new type of combined armor - non-explosive reactive armor - as well as systems designed to significantly increase the survivability of the tank, such as blowout panels."
 nsb_main_battle_tanks6:0 "Second+ Gen MBT"
 nsb_main_battle_tanks6_desc:0 "The main battle tank of the second generation of deep modernization is even more stuffed with electronics, and taking the first step towards the tank of modern network-centric warfare. Of the innovations, the provision for the installation of modular composite or non-explosive reactive armor, which greatly simplifies repair and maintenance, and also provides deep modernization potential."
 nsb_main_battle_tanks7:0 "Third Gen MBT"
 nsb_main_battle_tanks7_desc:0 "The main battle tank of the third generation is developed in the context of the doctrine of network-centric warfare from the very beginning, which makes it a formidable opponent for all land targets on the battlefield. In its design, the potential for installing a gun of increased caliber, as well as an autoloader, if it is not installed initially, is laid in advance. Protection includes modular composite or non-explosive reactive armor, integrated explosive reactive armor, as well as active protection system, which makes tanks of this generation one of the most protected and safest for the crew in the history of tank construction."
 nsb_main_battle_tanks8:0 "Third+ Gen MBT"
 nsb_main_battle_tanks8_desc:0 "The modernized third generation of main battle tanks, in which the latest achievements of recent years in electronics, an isolated crew capsule, an autoloader, and an active protection system are a must. In some ways, this generation's main battle tanks represent the last crewed tanks per se, as the next fourth generation is likely to be uncrewed, remote-controlled, or fully autonomous combat vehicles."

 nsb_heavy_tanks0:0 "Mid-WW2 Heavy Tank"
 nsb_heavy_tanks0_desc:0 "A mid-war heavy tank hull built around thick armor and heavy guns, suited to breakthrough and assault roles at the cost of speed, production effort, and logistics."
 nsb_heavy_tanks1:0 "Late WW2 Heavy Tank"
 nsb_heavy_tanks1_desc:0 "A late-war heavy tank hull representing the peak of traditional heavy tank design, with extreme protection and firepower constrained by cost and mobility."
 nsb_heavy_tanks2:0 "Post-WW2 Heavy Tank"
 nsb_heavy_tanks2_desc:0 "A postwar heavy tank hull refined by wartime experience, increasingly pushed toward anti-tank duties as the heavy tank concept begins to age."
 nsb_heavy_tanks3:0 "Early Cold War Heavy Tank"
 nsb_heavy_tanks3_desc:0 "An early Cold War heavy tank hull using improved fire control, stabilization, and powerful guns, but increasingly vulnerable to missiles and modern combined-arms warfare."

 nsb_nsb_heavy_tanks0:0 "Mid-WW2 Heavy Tank"
 nsb_nsb_heavy_tanks0_desc:0 "The heavy tank of the middle of World War II is a much more formidable opponent than its predecessor, carrying even thicker armor and capable of using specially designed heavy guns. Its devastating firepower can destroy almost any other tank of this period at great distances, and the armour can withstand any caliber but its own. The creation of self-propelled assault guns has become widespread, for which a heavy hull is excellent. Several battalions of such vehicles in a strategic direction may well tip the balance of power in their favor, both in defense and in attack."
 nsb_nsb_heavy_tanks1:0 "Late WW2 Heavy Tank"
 nsb_nsb_heavy_tanks1_desc:0 "The late World War II is the peak of the development of heavy tanks. Huge, heavy and powerful combat vehicles of extreme parameters - the limit of development of which is only the possibilities of logistics and production capabilities - these tanks are rather a demonstration of the industrial and technical power of the states that produce them. However, heavy tanks and vehicles based on their chassis still pose a serious threat on the battlefield and are a force to be reckoned with."
 nsb_nsb_heavy_tanks2:0 "Post-WW2 Heavy Tank"
 nsb_nsb_heavy_tanks2_desc:0 "The post-war heavy tank is a more reliable combat vehicle modified taking into account the experience of the World War II. However, despite its positive qualities, the tank of this period is facing some role reversal - since in modern warfare, there will hardly be heavily fortified static positions, for the assault of which the old heavy tanks were created, the new ones will be mostly assigned to the anti-tank role, which indicates the beginning of the obsolescence of the doctrine of heavy tanks as such. "
 nsb_nsb_heavy_tanks3:0 "Early Cold War Heavy Tank"
 nsb_nsb_heavy_tanks3_desc:0 "The heavy tank of the early Cold War is a kind of attempt to either bring to mind the early developments or create a new, more relevant one. A heavy tank of this period is often equipped with various technical innovations and original solutions that significantly increase combat capabilities, such as a two-plane stabilizer, an optical rangefinder, or even a ballistic computer, and changes have been made to the hull design that allows them to be implemented without loss of reliability. However, heavy tanks of the early Cold War largely shared the fate of battleships: too expensive, rather slow, difficult to maintain, and, most importantly, very vulnerable to new types of missile weapons, from which a simple increase in armor does not help, and therefore became a dead end branch of development. The latest models are still capable of carrying the most powerful tank guns, but it is already quite obvious to many that the era of land armored monsters, as well as sea ones, is coming to an end."

 nsb_ifv:0 "IFV"
 nsb_ifv_desc:0 "With the development of offensive weapons and the increase in the mechanization of the army, a need arose for a new armored vehicle that could not only safely transport infantry to the battlefield, but also directly support it with fire, while being capable of destroying enemy light armored vehicles. This led to the emergence of infantry fighting vehicles. The first vehicles of this class did not go far from the conventional armored personnel carrier and were armed only with an autocannon, differing mainly in the way they were used. However, over time, infantry fighting vehicles will become a full-fledged independent class of armored vehicles, equipped with more powerful weapons and strong armor."
 nsb_heavy_apc:0 "Heavy APC"
 nsb_heavy_apc_desc:0 "With the development of tank building and the emergence of new, more advanced models of armored vehicles, the old tanks, produced in huge quantities, are rapidly becoming obsolete and weak. To save money, resources, and time, we can start converting old medium and main battle tanks into armoured personnel carriers, thus creating a new heavy class of infantry transport vehicles that are invulnerable to the armament of most infantry fighting vehicles and expanding both offensive and defensive capabilities."
 nsb_heavy_ifv:0 "Heavy IFV"
 nsb_heavy_ifv_desc:0 "On the modern battlefield, with the even more increased power of armored combat vehicles and the wide availability of ATGMs, there is no place for traditional infantry fighting vehicles with a weight category comparable to light tanks. We need new infantry fighting vehicles based on a tank chassis that are not inferior in terms of armor to modern main battle tanks and are capable of operating in one line with them. In addition, the chassis of such a tank is created as a universal one, which allows the production of a wide range of unified equipment, such as heavy armored personnel carriers, infantry fighting vehicles and self-propelled artillery pieces."

 nsb_engines:0 "WW2 Combustion Engines"
 nsb_engines_desc:0 "Tank engines from the beginning of World War II, as a rule, are represented by aircraft, tractor, and sometimes even automobile carburetor gasoline or diesel engines adapted for use in armored vehicles with minimal design changes, which is due to their wide availability and mass production by civilian industry. Although there were attempts during the war to develop full-fledged, purposefully designed engines, they usually ended up with less than reliable designs due to insufficiently developed technology or the impossibility of their mass production due to the limits of wartime industry."
 nsb_engines0:0 "Post-WW2 Combustion Engines"
 nsb_engines0_desc:0 "Post-war engines for armored vehicles represent the quintessence of the entire engine-building experience of World War II, as well as the implementation of ideas and improvements that were unavailable during the war: integrated crankcase and oil heating, providing faster engine start at low temperatures, smaller dimensions, as well as more efficient electric generators, allowing powering new energy-consuming tank subsystems. In addition, engines (especially those intended for installation in heavy tanks) can be equipped with superchargers, which makes it possible to achieve more power while maintaining the same dimensions and weight of the engine."
 nsb_engines1:0 "Early Cold War Combustion Engines"
 nsb_engines1_desc:0 "By the beginning of the Cold War, the escalation of global confrontation had significantly increased the number of active vehicles in the armies around the world, ranging from trucks and armored personnel carriers to tanks and self-propelled guns, which led to a sharp increase in fuel consumption and an increase in the load on logistics. This marked a widespread abandonment of gasoline engines, which had been widely installed on armored vehicles before, and a transition to multi-fuel diesel engines capable of operating on many types of fuel."
 nsb_engines2:0 "Mid-Cold War Combustion Engines"
 nsb_engines2_desc:0 "By the middle of the Cold War, the requirements for reliability and engine power were continuously increasing due to the development of more powerful guns, the installation of more energy-intensive subsystems, and the prospect of heavier combined armor. Both diesel and gasoline engines have received many improvements, although the latter have largely reached the limit of modernization, leading to a fast decline in popularity."
 nsb_engines3:0 "Late Cold War Combustion Engines"
 nsb_engines3_desc:0 "The late Cold War diesel engine combines proven engine technologies that provide reasonable cost, high manufacturability and reliability on the one hand, and innovative design solutions such as the optimal ratio of piston diameter and stroke, dual-circuit cooling system, and electronic automatic control & monitoring system, which made it possible to reduce engine dimensions by a third, expand the operating range of ambient temperatures from -40 to +50 degrees Celsius, and significantly increase the period between mandatory maintenance."

 nsb_gt_engines0:0 "Early Cold War Gas Turbine Engines"
 nsb_gt_engines0_desc:0 "The gas turbine engine as a powerplant suitable for installation in armored vehicles emerged at the beginning of the Cold War, although the earliest ideas date back to the middle of World War II when the active use of gas turbine engines started. Technically, it is an almost direct adaptation of an aviation (usually helicopter) engine, with minimal modifications allowing it to be installed in a ground combat vehicle. The advantages of such an engine were light weight, enormous power and speed, no need for an external cooling system, multi-fuel capabilities, and the ability to quickly start in any climatic conditions. However, such engines are several times more expensive than diesel engines, consume much more fuel and also have reliability problems due to higher air consumption and more stringent air filtration requirements."
 nsb_gt_engines1:0 "Mid-Cold War Gas Turbine Engines"
 nsb_gt_engines1_desc:0 "The mid-Cold War gas turbine engine is a full-fledged, purpose-built engine for use in armored vehicles, rather than a simple adaptation of an off-the-shelf design, which eliminates a number of problems inherent in older models. One such problem was the rapid wear of the turbine blades, which occurred due to the excess dust present in the air. To minimize its impact, either powerful multi-stage filters or more compact vibration cleaning and forced purge nozzles systems are used."
 nsb_gt_engines2:0 "Late Cold War Gas Turbine Engines"
 nsb_gt_engines2_desc:0 "The late Cold War gas turbine engine is in many ways an improvement over the previous generation. Among said improvements are a more reliable and simpler air filtering system, increased engine life due to strengthening of the most loaded parts, and greater efficiency due to changes in fuel control equipment and the addition of a special idle mode, which reduces the fuel supply when the vehicle isn't moving."
 nsb_gt_engines3:0 "Modern Gas Turbine Engines"
 nsb_gt_engines3_desc:0 "A modern gas turbine engine is distinguished by materials of exceptional characteristics and quality, significantly increasing reliability and wear resistance, as well as advanced digital fuel control systems that flexibly respond to changing engine operating conditions and make it possible to further reduce fuel consumption and increase idle efficiency. The price corresponds to the engine characteristics."

 nsb_hybrid_engines:0 "Hybrid Diesel-Electric Propulsion"
 nsb_hybrid_engines_desc:0 "Hybrid diesel-electric propulsion is a combination of a diesel engine and a motor-generator, united by a compact but rather expensive electromechanical transmission, providing both conventional and electric propulsion (aka series-parallel hybrid). This system provides significant fuel savings: at high speeds, the diesel engine is used, and the motor-generator is used for regenerative braking, and charging the batteries; the motor-generator operates at low speeds, preserving the service life of the diesel engine while not consuming fuel, and also reducing noise and heat signature to almost a minimum. In addition, in the event of a diesel engine failure, the motor-generator can be powered by a battery, or an auxiliary power unit - if available - and remove the damaged tank from the battle. However, producing a hybrid propulsion system requires the use of complex electronic components and significant amounts of non-ferrous metals for the generator and batteries, making it very expensive compared to traditional systems."

 nsb_armor:0 "Combat Vehicle Design"
 nsb_armor_desc:0 "With the advent of the era of tanks, the race of armor and projectile began. Armored vehicles, which used to be enough to withstand bullets and shrapnel, need to withstand direct hits from armor-piercing shells specially designed to deal with them. This requires developing new or adapting existing methods for manufacturing hull armor. Many methods of creating a tank hull and fastening armor plates are borrowed from shipbuilding, where riveting and welding have been used for years to connect thick armor plates."

 nsb_armor0:0 "Welding of Thick Armor Plates And Casting of Complex Parts"
 nsb_armor0_desc:0 "Advances in the industry make it possible to reduce the cost, simplify, speed up, or even automate the processes associated with the manufacture of armor for land vehicles. If earlier it was technically difficult or impossible to create armor or hull of a certain thickness and size, now there are practically no such restrictions. Except for the overall limitations of railway tracks, bridges' carrying capacity, road surface density, and other logistical trifles."
 nsb_armor1:0 "Early Composite Armor"
 nsb_armor1_desc:0 "Early composite armor is designed to increase the protection of the tank, primarily from HEAT shells, using different fillers sandwiched between two plates of steel, like fused silica or aluminum. Although such fillers have a number of problems, such as low resistance against multiple hits, and the complexity of manufacturing and repair, which makes them somewhat impractical, they nevertheless do achieve the goal of increasing the security of armored vehicles."
 nsb_armor2:0 "Advanced Composite Armor"
 nsb_armor2_desc:0 "Advanced composite armor, unlike previous versions, uses improved and more practical fillers, such as fiberglass, ceramic sand or quartz rods, corundum or ceramic balls, and will have decent resistance not only to HEAT shells but also to kinetic armor-piercing ones. In addition, such armor has the potential to be built up by adding more layers of steel and filler to significantly increase protection."
 nsb_armor3:0 "First Gen NERA"
 nsb_armor3_desc:0 "Non-explosive reactive armor (NERA) appeared as a further development of the idea of combined armor - multilayer armor with layers of different materials. But in such armor there are a number of important differences from the previous types: firstly, it consists of a much larger number of elements, consisting of thin layers, forming an array; secondly, each element rearranges two plates, made of ceramic or hardened steel, between which there is an elastic element (elastomer), such as rubber, plastic, nylon, etc.; thirdly, the principle of operation of such armor differs significantly from conventional combined armor - when a kinetic or HEAT projectile hits the outer plate, a powerful high-speed shock is formed, swelling elastic material that pushes the plate back, deforming and destroying the armor-piercing core or jet. Such armor provides the best protection but is very large, heavy, and expensive."
 nsb_armor4:0 "Second Gen NERA"
 nsb_armor4_desc:0 "Thanks to computer modeling, simulations, and advanced field testing, the second generation of non-explosive reactive armor received a more optimal arrangement of armor packages, and advances in materials science made it possible to select elastic materials with higher reactivity, which altogether provides a significant increase in performance."
 nsb_armor5:0 "Third Gen Modern NERA"
 nsb_armor5_desc:0 "Further development of the theory and practice of materials science made it possible to create the third generation NERA. The use of more complex combinations of armor plates, linings, and elastomers, as well as the use of newer more exotic materials such as boron carbide, silicon carbide, or titanium alloys, makes such armor even stronger than the previous generation."
 nsb_armor6:0 "Fourth Gen Modern NERA"
 nsb_armor6_desc:0 "In the fourth generation of NERA, the latest innovations allow an unprecedented increase in the protection of armored vehicles: the use of thermoplastic resins as a softening element allows for increased multi-hit resistance, and the use of the latest polymers with high reactivity, together with a combination of nanocrystalline steel and nanoceramics, can stop even the most modern APFSDS projectiles, let alone HEAT ones. The weight of such armor, by the way, is also unprecedented. It's time to strengthen public road bridges."

 nsb_du_armor0:0 "Second Gen DU-Based NERA"
 nsb_du_armor0_desc:0 "Thanks to computer modeling, simulations, and advanced field testing, the second generation of non-explosive reactive armor received a more optimal arrangement of armor packages, and advances in materials science made it possible to select elastic materials with higher reactivity. The use of depleted uranium alloys as the main protection element in armor packages makes such armor even stronger, at the cost of a significant increase in its weight."
 nsb_du_armor1:0 "Third Gen DU-Based NERA"
 nsb_du_armor1_desc:0 "Further development of the theory and practice of materials science made it possible to create the third generation NERA. The use of more complex combinations of armor plates, linings, and elastomers, as well as the use of new depleted uranium alloys, makes such armor even stronger than the previous generation. Due to the use of heavier depleted uranium alloys, such armor is significantly heavier than conventional NERA."
 nsb_du_armor2:0 "Fourth Gen DU-Based NERA"
 nsb_du_armor2_desc:0 "In the fourth generation of NERA, the latest innovations allow an unprecedented increase in the protection of armored vehicles: the use of thermoplastic resins as a softening element allows for increased multi-hit resistance, and the use of the latest polymers with high reactivity, together with a combination of depleted uranium alloys and nanoceramics, can stop even the most modern APFSDS projectiles, let alone HEAT ones. The weight of such armor, by the way, is also unprecedented. It's time to strengthen public road bridges."

 nsb_era0:0 "First Generation ERA"
 nsb_era0_desc:0 "With the ever-widening spread of cheap and affordable anti-tank grenade launchers and guided munitions with HEAT warheads, the search for new non-standard ways to protect armored vehicles has again become relevant. One of these methods was explosive reactive armor (ERA), which is a small container with one or two explosive plates located between steel plates, depending on the design. When a HEAT projectile hits the container, a detonation occurs, destabilizing the penetrating jet, and a steel plate is thrown towards the jet, crossing its trajectory and finally stopping it, or distorting it enough so that it does not penetrate the main armor. First generation ERA protection is lightweight, very cheap, and provides serious protection against HEAT projectiles, but is almost completely useless against kinetic penetrator projectiles. Although experiments with counter-explosions as a means of combating the armor-piercing jet of HEAT shells were carried out back in the late 40s and early 50s, the imperfection of technology and the rigid conservatism of the military pushed these ideas into the closet for a long time until their correctness was proven in practice."
 nsb_era1:0 "Second Generation ERA"
 nsb_era1_desc:0 "The second generation of ERA received a number of significant improvements that eliminated many of the shortcomings of the previous generation: the improved shape of the protective containers allows for more uniform protection of the combat vehicle without creating weakened zones, and a thicker projectile plate, together with more powerful explosives, allows for a certain degree of protection even from ammunition with kinetic penetrator. The weight of one set of ERA protection has increased, but the cost remains at acceptable levels."
 nsb_era2:0 "Third Generation ERA"
 nsb_era2_desc:0 "The third generation of ERA is distinguished by a wide variety of original designs that can increase the security of combat vehicles even more and can withstand new threats, but they have a number of common features: modular design, allowing ERA containers to be easily replaced in the field or even installed in several layers on top of each other; explosion isolation of each protective element, achieved by reducing the explosives used, ensuring non-propagation of explosions and destruction of adjacent elements; and the ability to stop tandem HEAT projectiles. The latter is achieved by either adding a second throwing plate, which is sent opposite to the first one, after the penetrating jet or kinetic penetrator, destabilizing them even more, or by using a new design with linear shaped charges, that fire sequentially and cut the penetrator or jet into pieces."
 nsb_era3:0 "Fourth Generation ERA"
 nsb_era3_desc:0 "The fourth generation of ERA is the peak of development (at present, in any case) of this type of external protection, and uses the principle of non-contact detonation - that is, the ERA element is triggered not when the ammunition comes into direct contact with it, but when a passive detection sensor is triggered, sending a signal to one or more protection elements located on the trajectory of the ammunition approach. Such a sensor can be an inductance coil that perceives the induced electromotive force from an approaching projectile and sends a signal to trigger the protection element when the projectile is still at some distance, which allows it to be damaged and destabilized before contact with the main armor."

 nsb_al_armor0:0 "Early Aluminum Alloy Armor"
 nsb_al_armor0_desc:0 "The decision to use aluminum as an armor material came when a search was made to improve the protection of light armored vehicles and reduce weight, which is especially important for vehicles that must be airborne-capable or amphibious. In addition, it was found that aluminum has several other favorable properties: high corrosion resistance; good weldability; rigidity several times higher than that of steel, which makes it possible to do without a supporting frame when creating thin-skinned light armored vehicles; although aluminum is still less durable than steel, due to three times less density, it is possible to make thicker armor with greater stopping capability while remaining at the same weight. These characteristics come at a higher cost for aluminum than for steel. Early aluminum armor is usually represented by a non-heat-strengthened aluminum-magnesium-manganese alloy or other alloys, often borrowed from the aircraft industry."
 nsb_al_armor1:0 "Advanced Aluminum Alloy Armor"
 nsb_al_armor1_desc:0 "More advanced aluminum alloys, such as aluminum-zinc-magnesium, that specifically designed for armor use. Thanks to heat strengthening and an improved composition of alloying additives, the hardness and strength of these alloys have increased significantly - unlike earlier samples, which were only able to withstand fragments, small-caliber, and large-caliber bullets, these can provide decent resistance to autocannon projectiles, with sufficient thickness of course."

 nsb_defenses0:0 "Engine Smoke Generator System"
 nsb_defenses0_desc:0 "The engine smoke generator system (ESS) is a simple and cheap device for setting smoke screens, operating on the principle of injecting fuel into the engine's hot exhaust manifold and releasing this mixture into the atmosphere, where condensation and smoke screen formation occur. However, such a system directly depends on the active operation of the engine, since an idle one does not create hot enough exhaust, and therefore it can only be used while the vehicle is moving. In addition, the ESS consumes a decent amount of fuel when used."
 nsb_defenses1:0 "Improved Smoke Grenade Dischargers"
 nsb_defenses1_desc:0 "An improved smoke grenade discharger, that was created as a response to more serious battlefield threats, such as wide-spread anti-tank guided weapons. The main advantages are the improved location of grenade launchers and, most importantly, a more intense smoke-forming component based on red phosphorus and butyl rubber, producing a denser smoke screen and faster than before. In addition, instant deployment of a smoke screen is possible thanks to the detonation of grenades directly in the air which is achieved with a delay element in the fuze, which distinguishes this system favorably from previous models, where, after shooting off smoke grenades, it took some time before a sufficient volume of smoke was formed to hide the combat vehicle."
 nsb_defenses2:0 "IR Smoke Grenade Dischargers"
 nsb_defenses2_desc:0 "The further proliferation of infrared-guided anti-tank weapons, as well as the advent of thermal imagers capable of seeing through a conventional smoke screen, required improvements in the characteristics of smoke grenades. The addition of brass flakes, which have high reflective abilities in the infrared spectrum, allows both to dissipate the infrared signature of a combat vehicle and to disrupt IR-guided weapons."
 nsb_defenses3:0 "Multi-Spectral Smoke Grenade Dischargers"
 nsb_defenses3_desc:0 "The expansion of methods for detecting and destroying combat vehicles required even more significant improvement of smoke grenade dischargers. Coupled with existing enhancements, the addition of metal or metalized glass fiber chaff, that disrupts radar-based detection and targeting systems, allows to reliably cover the combat vehicle with a multi-spectral smoke screen."
 nsb_defenses4:0 "Smart Smoke Grenade Dischargers"
 nsb_defenses4_desc:0 "The latest smoke dischargers combine the best technical achievements, such as precise servos and their own independent sensors, allowing them to instantly and fully automatically point the installation at the source of the threat in any direction and shoot smoke grenades, or provide dynamic screening by creating a path of impenetrable smoke along the way combat vehicle, or even work together with the same systems on other combat vehicles, creating new tactical combinations and expanding screening capabilities. Although such a system can operate independently, it will perform best in conjunction with soft-kill active protection systems."

 nsb_aps0:0 "Early Hardkill Active Protection Systems"
 nsb_aps0_desc:0 "The second generation of hard-kill active protection systems for armored vehicles features a number of qualitative improvements, such as a new multi-functional Doppler radar, a larger number and improved arrangement of striking elements, and an improved computer that increases the speed of reaction to a threat. Unlike the previous models, protection is provided on 3/4 of the combat vehicle’s projection, and the system itself does not react to small objects such as bullets, shrapnel, and small-caliber projectiles. An important achievement is that such a system can also be installed on light armored vehicles, except armored personnel carriers and infantry fighting vehicles, for whose infantry the striking elements can pose a threat."
 nsb_aps1:0 "Advanced Hardkill Active Protection Systems"
 nsb_aps1_desc:0 "The third generation of hard-kill active protection systems has become even better, providing the highest possible performance and full all-around coverage. This system has several radars that allow it to track the trajectory of a projectile and determine whether it will hit a combat vehicle or fly past, eliminating false alarms on non-threatening targets. Reducing the collateral damage and the area affected by shrapnel produced by striking elements makes it possible to install such a system even on armored personnel carriers and infantry fighting vehicles, although dismounted soldiers should still exercise caution and stay away from their vehicles."
 nsb_aps2:0 "Modern Hardkill Active Protection Systems"
 nsb_aps2_desc:0 "The fourth generation of hard-kill active protection systems represents a solution to a rather ambitious task - providing protection from projectiles with a kinetic penetrator, which was not possible in systems of previous generations, due to their inability to detect and intercept such high-speed targets. This was achieved by installing auxiliary ultra-high-speed radars, a command transmitter from the system to the striking element, as well as equipping the striking elements with their own radio range finder, which made it possible to detect and hit APFSDS with high accuracy. Although it is still difficult to completely stop such a projectile with the use of APS only, hitting it destabilizes the projectile and reduces its penetrating capability."
 nsb_aps3:0 "Advanced Modern Hardkill Active Protection Systems"
 nsb_aps3_desc:0 "The soft-kill active protection system (APS) is a further development of the philosophy of active protection systems, but with an emphasis on preventing aiming or hitting one's own combat vehicle through optical and spectral disruption, rather than direct impact on the projectile. Such a system is based on a number of sensors installed around the perimeter of the combat vehicle and capable of detecting laser or infrared illumination (laser warning receiver system, LWRS), a computer control unit, and one, or more often, several countermeasures systems. The list of countermeasures may include a wide range of methods and devices: infrared searchlights, jamming IR-guided ammunition; pointing the gun to the source of illumination or fire, preventing the vulnerable side of the turret from being hit and allowing accurate return fire; or even a  laser self-defense subsystem capable of targeting a radiation source and disabling optical systems or blinding an enemy gunner. Also, if smoke screen systems are installed on a combat vehicle, they can be integrated with an APS sensor system to launch smoke toward the outgoing threat."

 nsb_softkill0:0 "Early Optico-Electronic (Softkill) Active Protection Systems"
 nsb_softkill0_desc:0 "The soft-kill active protection system (APS) is a further development of the philosophy of active protection systems, but with an emphasis on preventing aiming or hitting one's own combat vehicle through optical and spectral disruption, rather than direct impact on the projectile. Such a system is based on a number of sensors installed around the perimeter of the combat vehicle and capable of detecting laser or infrared illumination (laser warning receiver system, LWRS), a computer control unit, and one, or more often, several countermeasures systems. The list of countermeasures may include a wide range of methods and devices: infrared searchlights, jamming IR-guided ammunition; pointing the gun to the source of illumination or fire, preventing the vulnerable side of the turret from being hit and allowing accurate return fire; or even a  laser self-defense subsystem capable of targeting a radiation source and disabling optical systems or blinding an enemy gunner. Also, if smoke screen systems are installed on a combat vehicle, they can be integrated with an APS sensor system to launch smoke toward the outgoing threat."
 nsb_softkill1:0 "Advanced Optico-Electronic (Softkill) Active Protection Systems"
 nsb_softkill1_desc:0 "The second generation of soft-kill active protection systems features a number of improvements that provide more reliable operation and protection of armored vehicles. This is achieved, in addition to more accurate sensors, improved electronics, and better located infrared emitters, by a complex of active jamming and electronic warfare systems, capable of disrupting GPS-guided and smart ammunition. The ability to connect several such systems on different combat vehicles into a single network provides a significant tactical advantage in suppressing a threat to a group of friendly targets."

 nsb_addon_armor0:0 "Light Add-on Composites"
 nsb_addon_armor0_desc:0 "Lightweight add-on composite armor came about as a by-product of the NERA improvement effort and the desire to find similar high-performance protection for light vehicles. Since the NERA itself, due to its large weight and dimensions, cannot be installed on light armored vehicles, individual high-strength armor elements were re-used in the form of tiles mounted directly on the hull or on the frame. These tiles can be made from aluminum oxide, silicon carbide, or boron carbide, relatively brittle but very hard materials that can withstand hits from heavy machine guns and even autocannons; to absorb and dampen the excess kinetic energy of bullets and fragments, aramid fiber fabric is added under the tiles.. Since such armor can be made from small tiles of any shape, the degree of coverage of armored vehicles with it can reach 90-95% of the surface, the simplicity of external installation makes it easy to replace damaged elements, and its low weight allows it to be installed even on utility trucks."
 nsb_addon_armor1:0 "Advanced Light Add-on Composites" 
 nsb_addon_armor1_desc:0 "The advanced lightweight add-on composite armor utilizes the latest materials designed for the forthcoming fourth generation NERA, such as nanocrystalline steel, nanoceramics, aluminum-titanium alloys, and advanced polymer linings to improve armor durability. In addition, the significantly reduced weight makes it possible to install such armor even on helicopters. "
