#French Favoritism Minigame
VIE_Bao_Dai_Power_Minigame: "Factional Crisis Management"

VIE_MINIGAME_INTERNAL_POLITICS_TT: "Internal Politics\n\n As the power struggles continue, the act of keeping the Vietnamese people in the minds of leadership while also pleasing our French backers has become a constant burning mess. Pleasing one side over the other completely will likely result in either a wave of outrage from the people or a crisis in confidence in our regime from the French."
VIE_MINIGAME_POWER_STRUGGLE_TT: "The Power Struggle\n\n As rival claimants to the government clash on the political battlefield, major players in the campaign have made normal life in Vietnam appear closer to a thriller, as common people watch a game of politics play out in front of them. On the other side of the struggle, the French interests in Vietnam watch with horrible fascination at who will win the struggle, silently hoping that the winner will be more favorable to their goals and interests."
VIE_MINIGAME_FAVORITISM_TT: "Favoritism\n\n Favoritism is marked by the percentages and the ticking box below. A higher percentage means that the leader in question is more likely to be swayed by the French who will reward us handsomely, but whose government may not be popular with the public. A lower percentage means that the people see that given leader's government as more favorable, but they are less likely to work with the French."

CuongDe_NgoDinh_Countdown: "Recruit the Ngo-dinh Brothers"
CuongDe_Weapon_Purchase: "Purchase American Weapons"

Dealing_With_CuongDe_Mission: "Cuong-De Is Making His Move"
Dealing_With_CuongDe_Mission_desc: "Cuong-De is quietly building influence among our people and political brass. If left unchecked, his favor may grow strong enough to tilt the balance of power in his favor. We must carefully monitor his rise and act accordingly before it's too late."
CuongDe_Countdown: "Cuong-De's Voyage"
CuongDe_Countdown_desc: "Preparations are quietly underway for Cuong-De's voyage to South Vietnam. Backed by Japanese supporters, his arrival could tip the political balance if the groundwork has been laid. Time is running out to influence the outcome of his return."
Discredit_the_CuongDe_Faction: "Discredit the Cuong-De Faction"
Discredit_the_CuongDe_Faction_desc: "We cannot allow Cuong-De's propaganda to go unchallenged. By exposing his flaws and undermining his supporters, we reduce his influence and reaffirm our government's legitimacy."
Lighten_Propaganda_Against_CuongDe: "Lighten Propaganda Against Cuong-De"
Lighten_Propaganda_Against_CuongDe_desc: "Perhaps it is time to ease the pressure on Cuong-De's supporters. Loosening our propaganda efforts may earn us favor with his followers and allow for new avenues of cooperation."
Organize_Rallies_For_CuongDe: "Organize Rallies in Support of Cuong-De"
Organize_Rallies_For_CuongDe_desc: "A series of public rallies will bolster Cuong-De's image as a national savior. These displays of support will surely sway undecided citizens and intimidate his opposition."
CuongDe_Our_True_Leader: "Cuong-De, Our True Leader!"
CuongDe_Our_True_Leader_desc: "With the nation adrift and foreign hands pulling the strings, only Cuong-De stands firm in his vision for Vietnam. He is the rightful leader of our people, and it is time we recognize him as such."

Discredit_the_Nguyen_Phan_Long_Faction: "Discredit the Nguyen-Phan-Long Faction"
Discredit_the_Nguyen_Phan_Long_Faction_desc: "By exposing missteps and sowing doubt in the press, we can steadily erode Nguyen-Phan-Long's credibility among potential French backers and the public alike."
Boost_Long_French_Favoritism: "Boost French Opinion of Nguyen-Phan-Long"
Boost_Long_French_Favoritism_desc: "Encourage diplomatic overtures and flattering gestures to bolster Nguyen-Phan-Long's standing with key French officials and advisors."
VIE_USA_Long_Weapon_Shipment: "Request American Weapons"
VIE_USA_Long_Weapon_Shipment_desc: "Leveraging our improved ties with the United States, we can request a discreet weapons shipment to reinforce Long's position and our fight against communism. The Americans are watching, now is the time to act."
Long_PM_Countdown: "France's Decision Regarding Nguyen-Phan-Long"
Long_PM_Countdown_desc: "The French are deliberating Nguyen-Phan-Long's fate as Prime Minister. If his favor remains strong, they may continue backing him. But time is short, and rivals wait in the wings."

Discredit_the_Tran_Van_Huu_Faction: "Undermine the Tran-Van-Huu Bloc"
Discredit_the_Tran_Van_Huu_Faction_desc: "Quietly spread criticism of Tran-Van-Huu's policy indecisiveness and lack of vision to weaken his support base and shift political momentum back to the status quo."
Boost_Huu_French_Favoritism: "Promote Tran-Van-Huu's Pro-French Credentials"
Boost_Huu_French_Favoritism_desc: "Highlight Tran-Van-Huu's pragmatic approach and history of cooperation with France to secure greater backing from colonial administrators and French elites."
VIE_Huu_Weapon_Shipment_USA: "Petition the United States for Arms"
VIE_Huu_Weapon_Shipment_USA_desc: "Make the case to American diplomats and observers that Tran-Van-Huu is the best hope for a democratic and stable South Vietnam. In return, request material support."
VIE_Huu_Weapon_Shipment_FRA: "Request French Military Assistance"
VIE_Huu_Weapon_Shipment_FRA_desc: "France remains the key player in Indochina. With the right political maneuvering, Tran-Van-Huu may obtain another round of aid to cement his control."
VIE_Huu_Weapon_Shipment_ENG: "Seek British Support Against Communism"
VIE_Huu_Weapon_Shipment_ENG_desc: "With growing international concern over Southeast Asia, a carefully worded appeal to the British government might result in meaningful arms shipments."
VIE_Huu_Weapon_Shipment_ROC: "Plead for Aid from the Republic of China"
VIE_Huu_Weapon_Shipment_ROC_desc: "Though struggling for its own survival, the Republic of China remains fiercely anti-communist—and may be willing to arm fellow opponents of Viet Minh insurgents."

Discredit_the_Ngo_Dinh_Diem_Faction: "Discredit the Ngo-Dinh-Diem Faction"

Uncensor_Bao_Dais_Scandals: "Uncensor Bao-Dai's Scandals"
Uncensor_Bao_Dais_Scandals_desc: "Previously concealed by French-backed censors, Bao-Dai's indiscretions, such as, affairs, opulence, and absenteeism can now be broadcasted to discredit the puppet monarchy. A risky move, but one that will hinder his likeability among the French."
Broadcast_Pro_Independence_Speeches: "Broadcast Pro-Independence Speeches"
Broadcast_Pro_Independence_Speeches_desc: "Public addresses across the south proclaim the right of Vietnam to self-rule, rejecting continued French oversight. This strengthens the growing domestic influence of nationalist circles."
Attack_French_Loyalists: "Attack French Loyalists"
Attack_French_Loyalists_desc: "Strike directly at those still loyal to colonial interests. Whether through arrests, blackmail, or targeted intimidation, this will significantly strengthen the independence movement's grip on power."
Broadcast_Pro_French_Propaganda: "Broadcast Pro-French Propaganda"
Broadcast_Pro_French_Propaganda_desc: "Public messaging will emphasize French investment, order, and cultural prestige. Ultimately reminding citizens of the so-called benefits of colonial partnership."
Assure_Loyalty_to_France: "Assure Loyalty to France"
Assure_Loyalty_to_France_desc: "Reaffirming the state's commitment to the French Union may help avoid foreign agitation. This will placate French officials while undercutting rising nationalist fervor."
Ask_France_for_Money: "Plead for French Money"
Ask_France_for_Money_desc: "Request direct financial backing from the French treasury. Depending on their current influence, the level of support varies. But the cost to national legitimacy may be steep."
Ask_France_for_Weapons: "Beg for French Weapons"
Ask_France_for_Weapons_desc: "Seek military assistance from France in exchange for deeper alignment. Their response will depend on how much influence they still hold, and your request may come with consequences."
ProFrench_Coup: "Looming French Intervention"
ProFrench_Coup_desc: "A storm gathers in Saigon. If French influence grows too submissive, or domestic support dominates, the colonial overseers may act. Loyalists prepare, and whispers of generals in motion signal the return of direct control."

Dealing_With_Diem_Countdown: "Dealing With Diem"
Dealing_With_Diem_Countdown_desc: "Ngo-Dinh-Diem's radical manifesto has set political alarm bells ringing, but decisive action cannot be delayed forever. Whether exiled, arrested, or ignored, the consequences of inaction will echo into the future. We have seventy days to confront the Diem dilemma... or let others do it for us."

Reach_out_to_Phan_van_Giao: "Reach out to Phan-Van-Giao"
Reach_out_to_Nguyen_van_Xuan: "Reach out to Nguyen-Van-Xuan"
Reach_out_to_Le_van_Ty: "Reach out to Le-Van-Ty"
Reinstate_Xuan_CCC: "Give Xuan self-rule over Nam-Ky"
Reintergrate_Xuan_CCC: "Reintegrate Cochinchina"
Reintergrate_Xuan_CCC_desc: "Reintegrate the autonomous Cochinchina region back into the State of Vietnam, ending Xuan's temporary self-rule and bringing the territory back under direct Saigon control."

Long_Retires_PM: "The French Have Decided to Back §YBao-Dai§!"
Long_Stays_PM: "The French Have Decided to Back §YNguyen-Phan-Long§!"
Long_PM_tt: "If §YNguyen-Phan-Long§! Has at Least §Y80%§! §CFrench Favoritism§!, the French Will §RReconsider§! Who Their Allies Are."

Huu_PM_Countdown: "Huu's Diplomatic Balancing Act"
Huu_PM_Countdown_desc: "Prime Minister Tran-Van-Huu finds himself caught between two powerful patrons: the United States and France. His diplomatic maneuvering will determine whether he can win over the French despite American support, or if he must accept French disinterest and pivot fully toward Washington. The clock is ticking, and every decision matters."
Huu_PM_tt: "If §YUSA Influence§! is Greater Than §YFrench Influence§!, Huu Will §GWin Over the French§!. Otherwise, He Will §RAccept French Disinterest§!."

VIE_Huu_Wins_Over_French_tt: "Huu has successfully won over the French through his diplomatic efforts, despite American support."
VIE_Huu_Accepts_French_Disinterest_tt: "Huu has failed to win over the French and must accept their disinterest, pivoting toward the United States."

Boost_Huu_USA_Influence: "Strengthen Ties with Washington"
Boost_Huu_USA_Influence_desc: "Invest political capital and resources into deepening our relationship with the United States. This will increase American influence over our government and improve our standing with Washington."
Boost_Huu_USA_Influence_effect: "Increases §YUSA Influence§! by §G5§!."

Boost_Huu_French_Influence: "Strengthen Ties with Paris"
Boost_Huu_French_Influence_desc: "Invest political capital and resources into maintaining and strengthening our relationship with France. This will increase French influence over our government and improve our standing with Paris."
Boost_Huu_French_Influence_effect: "Increases §YFrench Influence§! by §G5§!."

Huu_USA_Diplomatic_Mission: "Send Diplomatic Mission to Washington"
Huu_USA_Diplomatic_Mission_desc: "Dispatch a high-level diplomatic delegation to the United States to strengthen bilateral relations. This mission will improve our standing with Washington and increase American influence, while also improving diplomatic relations."
Huu_USA_Diplomatic_Mission_effect: "Increases §YUSA Influence§! by §G10§!. Improves relations with §YUSA§!. Costs §R25 Political Power§! and §R$200 Million§!."

Huu_French_Cultural_Exchange: "Organize French Cultural Exchange"
Huu_French_Cultural_Exchange_desc: "Establish a cultural exchange program with France to strengthen ties and demonstrate our commitment to the Franco-Vietnamese relationship. This will increase French influence and improve relations with Paris."
Huu_French_Cultural_Exchange_effect: "Increases §YFrench Influence§! by §G10§!. Improves relations with §YFrance§!. Costs §R20 Political Power§! and §R$150 Million§!."

Huu_USA_Economic_Agreement: "Negotiate Economic Agreement with USA"
Huu_USA_Economic_Agreement_desc: "Sign a comprehensive economic agreement with the United States, providing economic benefits while significantly increasing American influence. This is a major commitment to the American relationship."
Huu_USA_Economic_Agreement_effect: "Increases §YUSA Influence§! by §G15§!. Provides §G$300 Million§! in economic aid. Costs §R30 Political Power§! and §R$250 Million§!."

Huu_French_Military_Cooperation: "Expand French Military Cooperation"
Huu_French_Military_Cooperation_desc: "Deepen military cooperation with France through joint training programs and equipment procurement. This will significantly increase French influence and provide military equipment, while strengthening our relationship with Paris."
Huu_French_Military_Cooperation_effect: "Increases §YFrench Influence§! by §G15§!. Provides §G300 Infantry Equipment§! from France. Improves relations with §YFrance§!. Costs §R25 Political Power§! and §R$200 Million§!."

