VIE_Disjointed_Army: "Disjointed Army"
VIE_Disjointed_Army_desc: "The military purges have left our armed forces in disarray. With key officers removed and command structures disrupted, our army struggles to maintain cohesion and effectiveness."
VIE_AnNinh_QuocGia: "An-Ninh Quoc-Gia"
VIE_AnNinh_QuocGia_desc: "The National Security apparatus has been strengthened to maintain order and suppress dissent. While this ensures stability, it comes at the cost of civil liberties."
VIE_Censor_French: "French Censorship"
VIE_Censor_French_desc: "French authorities have imposed strict censorship on media and publications. All content must be approved by French officials, severely limiting freedom of expression and political discourse."
VIE_Repress: "Repression"
VIE_Repress_desc: "The government has implemented harsh repressive measures against opposition groups and dissidents. While this maintains order, it has alienated many segments of the population and reduced popular support for military service."
VIE_Emphasized_NamKy: "Emphasized Nam-Ky Identity"
VIE_Emphasized_NamKy_desc: "The government has promoted a distinct Southern Vietnamese (Nam-Ky) identity, emphasizing regional differences from the North. This policy has reduced resistance in the South but deepened the divide with Northern Vietnam."
VIE_Emphasized_NamKy_NLF: "Emphasized Nam-Ky Identity"
VIE_Emphasized_NamKy_NLF_desc: "The Southern government's emphasis on Nam-Ky identity has created confusion and division within our ranks. Many fighters question their purpose when the enemy promotes the same regional identity we claim to defend."
