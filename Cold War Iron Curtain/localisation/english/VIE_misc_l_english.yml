VIE_Recruit_Nguyen_Van_Tam_desc: 'Known as the "Tiger of Cai-Lay" for his brutal suppression of Viet-Minh activities, Nguyen-Van-Tam is a hardline administrator whose fierce anti-communism and iron discipline make him a reliable, if feared, instrument of order.'
VIE_Recruit_Phan_Trong_Vinh: "Recruit Phan-Trong-Vinh"
VIE_Recruit_Phan_Trong_Vinh_desc: "A dedicated military officer whose leadership on the frontlines has drawn the attention of senior command."
VIE_Recruit_Trinh_Van_Cu: "Recruit Trinh-Van-Cu"
VIE_Recruit_Trinh_Van_Cu_desc: "A reliable officer whose organizational abilities have proven valuable in coordinating operations across multiple fronts."
VIE_Recruit_Nguyen_Van_Lai: "Recruit Nguyen-Van-Lai"
VIE_Recruit_Nguyen_Van_Lai_desc: "A promising military commander known for his adaptability and calm leadership under pressure."
VIE_Give_Charles_Chanson_Command: "Give Charles Chanson Field Command Over the NVA"
VIE_Recruit_Hoang_Co_La: "Recruit Hoang-Co-La"
VIE_Recruit_Hoang_Co_La_desc: "An officer of demonstrated capability and nationalist conviction, committed to the defense of the Republic against all enemies."
VIE_Recruit_Tran_Dinh_Vy: "Recruit Tran-Dinh-Vy"
VIE_Recruit_Tran_Dinh_Vy_desc: "A decorated military officer whose frontline experience and dedication to the national cause make him a worthy addition to our forces."
VIE_Recruit_Tran_Dinh_Lan: "Recruit Tran-Dinh-Lan"
VIE_Recruit_Tran_Dinh_Lan_desc: "A capable officer whose service record reflects steady loyalty and battlefield competence."
VIE_Integrate_Sect_Armies: "Integrate the Sect Armies"
VIE_Integrate_Sect_Armies_desc: "The various armed factions of Vietnam's religious sects have long operated outside state control. By formally integrating their forces into the national army, we can consolidate military power and reduce the risk of internal armed conflict."
VIE_Integrate_Militia_CaoDai: "Integrate the Cao-Dai Militia"
VIE_Integrate_Militia_CaoDai_desc: "The Cao-Dai sect maintains a substantial militia force in the Tay-Ninh region. Bringing these fighters under national command will expand our military reach while reducing an independent armed power that threatens central authority."
VIE_Integrate_Militia_NguyenTrungTruc: "Integrate the Nguyen-Trung-Truc Militia"
VIE_Integrate_Militia_NguyenTrungTruc_desc: "The Nguyen-Trung-Truc militia, operating in the southern provinces, can be brought under national command, adding experienced fighters to our forces while reducing independent armed factions in the region."
VIE_Integrate_Militia_UMDC: "Integrate the UMDC Militia"
VIE_Integrate_Militia_UMDC_desc: "The UMDC's paramilitary forces represent a significant armed presence in the Mekong Delta. Integrating them into the national army will consolidate our military power, though at the cost of Jean Leroy's autonomous influence."
VIE_Recruit_Anselmo_Tadeo_LeHuuTu: "Recruit Anselmo-Tadeo Le-Huu-Tu"
VIE_Recruit_Anselmo_Tadeo_LeHuuTu_desc: "The Catholic Bishop of Phat-Diem, Le-Huu-Tu commands a formidable militia force in the Red River Delta region. His diocese's well-armed fighters have proved a vital check against Viet-Minh encroachments."
VIE_Recruit_Guise_DinhNgocVinh: "Recruit Guise Dinh-Ngoc-Vinh"
VIE_Recruit_Guise_DinhNgocVinh_desc: "A loyal officer and committed nationalist whose record of service speaks to both skill and dedication to the national cause."
VIE_Recruit_Pham_Cao_Hung: "Recruit Pham-Cao-Hung"
VIE_Recruit_Pham_Cao_Hung_desc: "A capable military commander known for his operational acumen and loyalty to the national cause."
VIE_Recruit_Tran_Van_Hai: "Recruit Tran-Van-Hai"
VIE_Recruit_Tran_Van_Hai_desc: "A determined field commander whose experience in counterinsurgency operations across the Mekong Delta has made him one of the more capable officers in our ranks."
VIE_Recruit_Tran_Van_Chon: "Recruit Tran-Van-Chon"
VIE_Recruit_Tran_Van_Chon_desc: "A skilled naval officer whose leadership at sea has made him an essential figure in developing Vietnam's emerging maritime capability."
VIE_Recruit_Nguyen_Van_Lich: "Recruit Nguyen-Van-Lich"
VIE_Recruit_Nguyen_Van_Lich_desc: "A capable officer whose tactical skill and loyalty have distinguished him among the officer corps."
VIE_Recruit_Chung_Tan_Cang: "Recruit Chung-Tan-Cang"
VIE_Recruit_Chung_Tan_Cang_desc: "A gifted naval officer whose experience and dedication to building a modern Vietnamese navy will be essential to securing our maritime borders."
VIE_Recruit_Lam_Nguon_Tanh: "Recruit Lam-Nguon-Tanh"
VIE_Recruit_Lam_Nguon_Tanh_desc: "A capable naval officer whose operational experience at sea has contributed to the development of Vietnam's maritime forces."
VIE_Recruit_Doan_Ngoc_Bich: "Recruit Doan-Ngoc-Bich"
VIE_Recruit_Doan_Ngoc_Bich_desc: "A dedicated military officer whose service has demonstrated both organizational skill and frontline courage."
VIE_Recruit_Tran_Van_Phan: "Recruit Tran-Van-Phan"
VIE_Recruit_Tran_Van_Phan_desc: "A capable and loyal officer whose contributions to the national defense effort have earned wide respect among his peers."
VIE_Recruit_VIE_Pierre_Y_Wo_Mlo: "Recruit Pierre-Y Wo-Mlo"
VIE_Recruit_VIE_Pierre_Y_Wo_Mlo_desc: "A leader among the Montagnard peoples of the Central Highlands whose warriors' intimate knowledge of the terrain and guerrilla tactics is an invaluable asset in securing the highland frontier."
VIE_Recruit_VIE_Y_Wo_Mlo: "Recruit Y-Wo-Mlo"
VIE_Recruit_VIE_Y_Wo_Mlo_desc: "A trusted Montagnard commander whose fighters' knowledge of the highland terrain makes them an essential force in the struggle for the Central Highlands."
VIE_Recruit_VIE_Y_Tot_Nai: "Recruit Y-Tot-Nai"
VIE_Recruit_VIE_Y_Tot_Nai_desc: "A Montagnard tribal leader whose authority among the highland communities can extend our influence and security deep into the Central Highlands."

