#Leader Traits
BaoDai_Loyalist: "Bao-Dai Loyalist"
BaoDai_Loyalist_desc: "This general is loyal to Bao-Dai and his legitmancy as the former Emperor of Vietnam, believing that Vietnam's stability depends on the leadership of the Emperor. He will staunchly defend the State of Vietnam against all threats."
BinhXuyen_Member: "Binh-Xuyen Member"
BinhXuyen_Member_desc: "This general is loyal to the Binh-Xuyen syndicate, embracing its the directions of Le-van-Vien of militarized autonomy and economic control. He values power, influence, and the independence of Binh-Xuyen forces from state control."
CaoDai_Member: "Cao-Dai Member"
CaoDai_Member_desc: "This general is a devout follower of Cao-Daiism, dedicated to defending its theocratic vision and ensuring that Cao-Dai's political and military influence remains strong in Vietnam."
CuongDe_Comrade: "Comrade of Cuong-De"
CuongDe_Comrade_desc: "This general is loyal to Emperor Nam-Hung and his ideology of Dan-Vuong monarchy, blending Tridemism and Socialism to create a modernized yet traditional Vietnam free from colonial rule."
DaiViet_Party_Member: "Dai-Viet Member"
DaiViet_Party_Member_desc: "This general follows the Dai-Viet Party, dedicated to a vision of Greater Vietnam Ultranationalism, anti-communism, and centralized governance. He is committed to a strong Vietnamese state under a nationalist leadership."
Diem_Comrade: "Comrade of Diem"
Diem_Comrade_desc: "This general is loyal to Ngo-Dinh-Diem and his ideology of Moderate Oriental Personalism, firmly believing in Diem's anti- materalistic communist, socialistic personalist vision for an independent Vietnam."
French_Indochina_Member: "French-Indochinese Loyalist"
French_Indochina_Member_desc: "This general is a supporter of French Indochina, advocating for continued French influence and believing that Vietnam's future is best secured through cooperation with the French colonial administration."
HoaHao_Member: "Hoa-Hao Member"
HoaHao_Member_desc: "This general is a fervent Hoa-Hao Buddhist, committed to protecting his sect's autonomy and ensuring that Hoa-Hao communities remain independent from central authority."
Nhu_Comrade: "Comrade of Nhu"
Nhu_Comrade_desc: "This general follows Ngo-dinh-Nhu and his ideology of Person Dignity Theory, a spiritualistic Marxism that promotes anti materalism crusades, stragetric hamlets, and ideological mass mobilization."
NRM_Member: "National Revolutionary Movement Member"
NRM_Member_desc: "This general is a committed member of the National Revolutionary Movement (NRM), fighting for Ngo-dinh-Diem's political and ideological supremacy through disciplined party control and grassroots mobilization."
PhatDiem_Member: "Phat-Diem Member"
PhatDiem_Member_desc: "This general is a Catholic militia leader loyal to the Phat-Diem Diocese, dedicated to defending Vietnam's Christian communities from communist and Buddhist factions."
Pro_QuocGia: "Quoc-Gia Loyalist"
Pro_QuocGia_desc: "This general is a staunch supporter of the Quoc-gia cause, advocating for a militarized, anti-communist, and nationalist state independent from foreign influence."
Pro_Vietminh: "Viet-Minh Sympathizer"
Pro_Vietminh_desc: "This general is a devoted communist revolutionary, committed to Marxist-Leninist struggle and the complete expulsion of imperialist and reactionary forces from Vietnam."
UMDC_Member: "UMDC Member"
UMDC_Member_desc: "This general is a radical member of the Union Militaire du Christ (UMDC), an extremist Christian paramilitary led by Jean Leroy, known for its brutal suppression of non-Christians in Vietnam."
VIE_Pro_America: "American Sympathizer"
VIE_Pro_America_desc: "This general is aligned with U.S. interests, firmly believing in anti-communism, democracy, and Western military support as the key to securing Vietnam's future."
VIE_Pro_France: "French Sympathizer"
VIE_Pro_France_desc: "This general remains loyal to France, advocating for a continued colonial presence or a Franco-Vietnamese partnership to maintain order and stability."
VIE_Pro_ROC: "Kuomintang Sympathizer"
VIE_Pro_ROC_desc: "This general supports the Republic of China (Taiwan), believing that Vietnam's survival depends on alliances with Chiang Kai-shek and anti-communist Chinese forces against the Viet Minh."
VietCong_Spy: "Viet-Cong Spy"
VietCong_Spy_desc: "This general is a covert agent of the Viet Minh, secretly working to undermine colonial and reactionary forces from within. While maintaining a façade of loyalty, he is dedicated to the Marxist-Leninist revolution and will sabotage enemy operations, leak intelligence, and support communist uprisings when the time is right."
french_defector: "French Defector"
french_defector_desc: "This general served under the French colonial military before defecting to the Vietnamese nationalist cause. His intimate knowledge of French tactics, equipment, and command structure gives him a unique and valuable insight on the battlefield."
french_trainee: "French Trainee"
french_trainee_desc: "This general received his military education and training under French colonial officers. His doctrine and battlefield instincts bear the unmistakable mark of French military tradition."
french_trainee_navy: "French Trainee"
french_trainee_navy_desc: "This naval officer received his training under French colonial naval officers. His knowledge of French naval doctrine and seamanship has been invaluable in building Vietnam's nascent maritime force."
ww2_veteran: "World War 2 Veteran"
ww2_veteran_desc: "This general fought in the Second World War, gaining hard-won experience in the most destructive conflict in history. The lessons of combined-arms warfare, logistics, and command under pressure have forged him into a battle-hardened commander."
ww1_veteran: "World War 1 Veteran"
ww1_veteran_desc: "This general is a veteran of the Great War, whose brutal trench warfare forged in him an iron resolve and a grimly practical understanding of the costs of modern warfare. Though advancing in years, his experience remains invaluable."
self_taught: "Self Taught"
self_taught_desc: "This general rose to command not through any formal military academy, but through raw capability, battlefield instinct, and an insatiable drive to learn from every engagement. His unorthodox approach is often an advantage where conventional doctrine fails."
voBi_trainee: "Vo-Bi Trainee"
voBi_trainee_desc: "This general is a graduate of the Vo-Bi military academy, trained in Vietnamese military tradition and nationalist doctrine. His education instilled both professional discipline and a deep commitment to the cause of Vietnamese independence."
voBi_trainee_navy: "Vo-Bi Trainee"
voBi_trainee_navy_desc: "This naval officer was trained at the Vo-Bi academy's naval program, combining Vietnamese military tradition with the demands of modern maritime warfare. His loyalty to the national navy reflects the institution's enduring influence."
roc_trainee: "Kuomintang Trainee"
roc_trainee_desc: "This general received military training from the Republic of China, absorbing the tactics and doctrines of the Kuomintang military. His training has given him an anti-communist worldview shaped by the brutal experience of the Chinese Civil War."
eastern_bloc_trainee: "Eastern Bloc Trainee"
eastern_bloc_trainee_desc: "This general was trained by Soviet or Eastern Bloc military advisors, receiving instruction in Marxist-Leninist military doctrine and Soviet-style tactics. His knowledge of Eastern Bloc methods is a double-edged asset in this ideologically charged conflict."
political_commissar: "Political Commissar"
political_commissar_desc: "This officer serves as a political commissar, responsible for ideological discipline and morale within military units. He ensures that soldiers remain loyal to the party line and that political doctrine shapes every aspect of military organization."
quocGia_sympathizer: "Quoc-Gia Sympathizer"
quocGia_sympathizer_desc: "This general quietly sympathizes with the Quoc-Gia nationalist cause, supporting a vision of a strong, independent Vietnam free from communist subversion and foreign domination, though stopping short of full commitment."
quocGia_loyalist: "Quoc-Gia Loyalist"
quocGia_loyalist_desc: "A committed Quoc-Gia nationalist, this general is fully dedicated to the vision of a sovereign, anti-communist Vietnam. His loyalty to the nationalist movement drives his every decision on and off the battlefield."
vietminh_sympathizer: "Vietminh Sympathizer"
vietminh_sympathizer_desc: "This general privately sympathizes with the Viet Minh's cause, seeing their armed struggle as the truest path to Vietnam's independence from colonial rule, though he has not yet openly committed to their movement."
vietminh_loyalist: "Vietminh Loyalist"
vietminh_loyalist_desc: "This general is secretly a loyal agent of the Viet Minh, working to undermine the nationalist war effort from within. Masking his true allegiance behind a facade of cooperation, he will betray operations and leak intelligence whenever the opportunity arises."
irregular_officer: "Irregular Officer"
irregular_officer_desc: "This general rose through the ranks outside traditional military academies, often emerging from guerrilla warfare, paramilitary groups, or local militias. Lacking formal training, he relies on unconventional tactics, battlefield experience, and adaptability to outmaneuver his enemies."
Hirohito_Inheritor: "The inheritor of Hirohito and Sun-yet-Sen"
Pan-asian_Revolutionary: "Seasoned Pan-Asianist Revolutionary"
Strength_of_South: "Southern Strength"

#GUI Stuff
activate_sect_menu_tt: "We Have Unlocked a New §YGUI Menu§! to Manage and Deal with the Various Sects"

TITLE_TOOLTIP: 'The power struggles between the major "third forces" in the conflicts Vietnam faces play a major role in shaping what the country will look like moving forward. In pandering or bringing the hammer down on these organizations, criminal entities, and religious cults and institutions, a balance must be maintained - or one organization must come out on top.'
LOYALTY_TT: "§YLoyalty Level§!\n\nThe group's alliegance to our government, and their likelyhood that they will help us in our causes."
ANNIHILATION_TT: "§YAnnihilation Progress§!\n\nThe progress in our efforts to destroy the effectiveness and reach of the given group."
UMDC_TITLE: "Unites Mobiles Pour La Defense Des Chretiens (UMDC)"
UMDC_DESC: "Of many of the large Catholic militia groups in the region, the UMDC stands as the most powerful group. Led by Jean Leroy, they have taken control of large swaths of the southern part of the country, taking a toll on resistance movements in the region as well as massacring many non-Christian civilians."
BINH_XUYEN_TITLE: "Binh-Xuyen"
BINH_XUYEN_DESC: "The Binh-Xuyen have proven the most dangerous, insidious, and concerning third force we have had to deal with in this struggle. A rogue military force devoted to wiping out communism, their commanders have resorted to operating like a criminal syndicate; trading opium, operating casinos and extorting the population to fund their private war. While they could be a powerful ally, they are\nfor now a dangerous threat to peace."
CAO_DAI_TITLE: "Cao-Dai"
CAO_DAI_DESC: "The Dai-Dao Tam-Ky Pho-Do (The Great Way of Third Universal Redemption) is a new syncretic religion formed in 1926 that has rapidly become a large part of Vietnamese culture over the past few years. Followers preach a syncretized monotheistic belief system that combines local folk culture, Buddhism, Taoism, Daoism and Roman Catholicism with a policy of nonviolence and \nvegetarianism."
HOA_HAO_TITLE: "Hoa-Hao Buddhism"
HOA_HAO_DESC: "Despite their origins as a local Buddhist sect worshipping a self-proclaimed \"Buddha,\" Huynh-Phu-So syncretized elements of Confucian doctrine and Vietnamese folk practices, the Hoa-Hao have transformed into a violent militant group occupying most of the southern provinces, being loyal to no government, Saigon or Hanoi. Keeping them in line is perhaps just as difficult as \ngaining their acceptance."
HARMONISM_TITLE: "Hoa-dong Ton-giao (Harmonism)"
HARMONISM_DESC: "Perhaps the most curious group in the power struggle is that of Thich-Hoa-Binh's (Ong Dao-dua) \"Coconut\" religion, a growing niche following that subscribes to a great deal of synthesized religions, including Christianity and Buddhism. A political figure who has used his group's actions to protest the war, despite the bizarre nature of the group, we are inclined to treat him as a figure \nof status and importance."
TRINH_MINH_THE_TITLE: "Warlord Dossier: Trinh-Minh-The"
TRINH_MINH_THE_DESC: "Trained by the Japanese and serving as a career soldier, The is perhaps the face of the Cao-Dai movement. Seen as possibly a rival to the government in Saigon, he has been instrumental in the struggle against colonial French efforts. He is equal parts competent and dangerous.\n\nBase of Operations: Tay Ninh"
LE_VAN_VIEN_TITLE: "Warlord Dossier: Le-Van-Vien"
LE_VAN_VIEN_DESC: "Major General Le-Van-Vien has had an extensive and incredible career, from revolutionary in the Viet-Minh to collaborator to leader of the Binh-Xuyen, engaging in racketeering and corruption scheme under the guise of \"police functions for the government\".\n\nBase of Operations: Long An"
JEAN_LEROY_TITLE: "Warlord Dossier: Jean Leroy"
JEAN_LEROY_DESC: "A brutal man, Leroy has led the UMDC and many of his Catholic forces to political violence against both the government and the other revolutionary parties. He has a deep hatred for many progressive things, and is seen as a butcher and a murderer in his crusade to protect religious communities in his own Fiefdom, something that has made him a target in the communities.\n\nBase of Operations: Kien Hoa"
TRAN_VAN_SOAI_TITLE: "Warlord Dossier: Tran-Van-Soai"
TRAN_VAN_SOAI_DESC: "Commander-in-chief of the Hoa-Hao, Tran Van Soai has enjoyed a career similar to that of Ho Chi Minh, holding down several jobs before converting and becoming a military presence during the Second World War. His methods are brutal, but his message and battle tactics make him a deadly presence in the region.\n\nBase of Operations: Ba Xuyen"
BA_CUT_TITLE: "Warlord Dossier: Ba-Cut"
BA_CUT_DESC: "Erratic and cruel, Ba-Cut has become an effective commander in the field in the region, but his brutality against civilians has become a constant annoyance for the government in Saigon. Some in the government question whether his efforts against the communists truly outweigh the bloodshed in his wake.\n\nBase of Operations: An Giang"
NGUYEN_GIAC_NGO_TITLE: "Warlord Dossier: Nguyen-Giac-Ngo"
NGUYEN_GIAC_NGO_DESC: "A law enforcer and an ardent preacher, Nguyen-giac-Ngo has become one of the most notable military leaders in the Hoa-Hao movement. Unlike his contemporaries, he has been more pragmatic, cooperative with the government, and may be a powerful and useful ally.\n\nBase of Operations: Sa Dec"
LAM_THANH_NGUYEN_TITLE: "Warlord Dossier: Lam-Thanh-Nguyen"
LAM_THANH_NGUYEN_DESC: "Educated in war by the French, Lam Thanh Nguyen has become a threat to communist efforts in the region, but he has been better known as a healer in the sect, and has become something of an alternate figurehead for the movement.\n\nBase of Operations: Chau Doc"
TRAN_QUANG_VINH_TITLE: "Warlord Dossier: Tran-Quang-Vinh"
TRAN_QUANG_VINH_DESC: "A former warlord for the Cao-dai movement and a Cuong-de's collaborator, Tran-quang-Vinh has proved a valued ally and a strong commander, seen as less of a threat as opposed to his figurehead leader. He has links to the Japanese, and has suffered in popularity as a result.\n\nBase of Operations: Tay Ninh"

