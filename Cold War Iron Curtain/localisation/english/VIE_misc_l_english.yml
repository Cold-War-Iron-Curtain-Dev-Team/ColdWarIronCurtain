VIE_SECT_CONFLICT_PROMPT_DESC_1: "After a difficult start, our forces managed to successfuly push back [GetVieConflictSectName] forces, allowing for a restoration over of government control over limited areas formerly held by the [GetVieConflictSectName]."
VIE_SECT_CONFLICT_PROMPT_DESC_2: "After initial successes, our forces were pushed back by [GetVieConflictSectName] forces. Furthermore, the losses sustained and momentum gained by the [GetVieConflictSectName] has reduced our position against the [GetVieConflictSectName]."
VIE_SECT_CONFLICT_PROMPT_DESC_3: "In a daring assault into [GetVieConflictSectName] territory, our forces were able to gain the upper hand and liquidate a large number of [GetVieConflictSectName] forces. With this achieved, we have managed to seize control over various [GetVieConflictSectName] facilities, thus greatly empowering the governments position compared to the [GetVieConflictSectName]."
VIE_SECT_CONFLICT_PROMPT_DESC_4: "After entering [GetVieConflictSectName] held territory our forces quickly came under enemy fire and were futher hampered by local opposition to our rule. After several hours of fierce fighting our forces were routed by the enemy. The inability to seize [GetVieConflictSectName] facilities will surely damage our position and make any future negotiations with the [GetVieConflictSectName] more difficult."
