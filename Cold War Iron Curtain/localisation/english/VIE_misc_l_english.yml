MAIN_MINIGAME_TT: "[GetMinigameMainTT]"
ALT_MINIGAME_TT: "[GetMinigameAltTT]"

MyBAO_DAI_MINIGAME_TT: "Bao Dai\n\n Despite doing what he could to capitalize on his legitimacy, Emperor Bao Dai's government has been unpopular as ever. As it was when he was a puppet of the French, he chose the wrong advisors, took misguided advice, and burned the national budget to critical levels. Now, other candidates for legitimacy have begged for a chance to prove to the people and the French government that they hold the national interests in mind, and can do the job effectively and pragmatically."
LEROY_MINIGAME_TT: "Jean Leroy\n\n A half-French, half-Vietnamese militia commander, Jean Leroy built the UMDC into a private army dominating Ben-Tre province. Known for brutal tactics against non-Christian populations, his fanatical anti-communism made him useful to French interests despite the atrocities carried out in his name. To his followers, a crusader; to his enemies, a warlord."
HIHH_MINIGAME_TT: "Nguyen-Van-Hinh\n\n France has played its final card. The son of Prime Minister Nguyen-Van-Tam and a naturalized French citizen who built his career in the French Air Force, Hinh never had any illusions about where his loyalties lay — and neither did anyone else. His rise to power came not through the slow contest of politics, but through the blunt instrument of a coup, backed by the CEFEO and announced to the country with a crushing collapse in national morale. The Military Transitional Council is now the government. Nationalist officers have been purged, French bureaucrats are filling the vacuum, and the old debates about sovereignty have been replaced by a much simpler arrangement. The only question left is whether Vietnam emerges from this with anything to call its own — or whether the French simply never leave."
CUONG_MINIGAME_TT: "Cuong-De\n\n As the intrigue of the political battles increased, Cuong-De, who perhaps set the chain of events in motion, chaffed at the looming hand of French interests in Vietnamese policy, while Bao Dai's government continued to spiral into incompetence and decadence. Determined to make a stand for his country, he has committed himself to ensure that the people are heard, and that he can take over government to revenge a personal feud and to  represents the people's interests above all others."
XUAN_MINIGAME_TT: "Nguyen-Van-Xuan\n\n A Franco-Vietnamese general and one of Bao-Dai's earliest backers, Nguyen-Van-Xuan briefly served as head of government for the provisional Central Vietnam government. A pragmatic military man with strong French ties, he positioned himself as a broker between Vietnamese nationalist ambitions and French colonial interests — though his influence waned as more forceful figures entered the political arena."
NGUYEN_MINIGAME_TT: "Nguyen-Phan-Long\n\n A bit player in the political battles that have plagued the country, Long emerged as a bridge between us and the Cao-dai and a softer hand than the deeply unpopular Bao Dai. Keen observers understand that beyond this posturing and strong showing, he has been positioning himself as France's more favorable option, in order to undermine the Emperor's legitimacy abroad."
HUU_MINIGAME_TT: "Tran-Van-Huu\n\n One of the larger faces of the government policies that have been championed by French interests, Huu has emerged behind these policies as a moderate, who has not completely committed to one side or the other in this ongoing conflict. It appears that he is motivated by something other than the desire to lead a just and representative government, with no questions asked."
TAM_MINIGAME_TT: "Nguyen-Van-Tam\n\n Known as \"The Tiger of Cai-Lay\" for his brutal suppression of Viet-Minh activities, Nguyen-Van-Tam rose from colonial police officer to Prime Minister through ruthlessness and loyalty to French interests. His hardline anti-communist methods made him a reliable, if feared, instrument of order — respected by the French but reviled by much of the population."
LOC_MINIGAME_TT: "Nguyen-Phuc Buu-Loc\n\n A prince of the Nguyen royal house and cousin to Bao-Dai himself, Buu-Loc brings a quiet dynastic legitimacy to a government that increasingly struggles to justify its own existence. Educated in France and deeply embedded in the aristocratic networks that bind the court to Paris, he represents a last attempt at dignified, orderly governance before harder choices must be made. His appointment as Prime Minister carries the weight of finality — those around him sense that after Buu-Loc, the old order will not recover."
VINH_MINIGAME_TT: "Tran-Quang-Vinh\n\n The military commander of the Cao Dai, Tran-Quang-Vinh built his career navigating the overlapping loyalties of colonial Indochina — serving Japanese interests during the occupation, then repositioning as a pragmatic force within the French-backed state. His power base is the Cao Dai's private army in the Tay Ninh holy lands, and his ambitions run far beyond the role of a sect commander. He presents himself as a bridge between the religious nationalists and the government in Saigon, though his detractors regard him as an opportunist willing to sell that bridge to whoever offers the best terms."
TOAN_MINIGAME_TT: "Nguyen-Bao-Toan\n\n A Vietnamese nationalist and leader of the Dan Xa movement, Nguyen-Bao-Toan envisions a Vietnam rebuilt from the ground up through three interlocking revolutions — national, social, and moral. His ties to the Hoa Hao and other Southern religious movements give him a popular legitimacy in the countryside that Saigon's aristocratic politicians cannot match, but his anti-French sentiment puts him permanently at odds with the men who hold the real levers of power. If he ever does reach the head of government, he will arrive pulling forces that cannot easily be put back in their boxes."
QUANG_MINIGAME_TT: "Dinh-Xuan-Quang\n\n A civil administrator rather than a political agitator, Dinh-Xuan-Quang represents the quieter wing of Vietnamese governance — men who believe that competent bureaucracy can buy time where ideology cannot. His priority is reforming the civil service and stabilizing the rural south through measured land policy, unglamorous work that earns little popular credit but keeps the machinery of the state turning. In a contest between strongmen and visionaries, he is an unlikely figure — which is precisely why some consider him a safe choice, and others consider him irrelevant."
DIEM_MINIGAME_TT: "Ngo-Dinh-Diem\n\n A deeply devout Catholic nationalist and fierce anti-communist, Ngo-Dinh-Diem spent years in self-imposed exile cultivating ties with American and Vatican circles rather than compromising with either the French or the Viet Minh. His principled stubbornness made him a figure of suspicion in Saigon, but also caught the attention of those seeking an untainted Vietnamese leader. Whether his ascent will be salvation or catastrophe depends entirely on who you ask."
CEFEO_MINIGAME_TT: "Corps Expéditionnaire Français en Extrême-Orient\n\n The French Far East Expeditionary Corps represents the full weight of French military power in Indochina. As both the dominant military force and the guarantor of French colonial interests, the CEFEO wields enormous influence over political outcomes in Vietnam. Their favor can make or break a political faction — but French military backing always comes at a price."

#Ideas
Indochina_French_Shenanigans: "French Shenanigans in Indochina"

#Ideologies
oriental_personalism: "Oriental Personalism"
oriental_personalism_desc: "£Ideology_Oriental_Personalism_pic\n\n\n\n\n\n\n\n\nOriental Personalism is the official ideology of Ngo Dinh Diem's Can-Lao Party in South Vietnam. Owing as much to the influence of his brother, Ngo Dinh Nhu as Diem himself, Oriental Personalism has diverse ideological influences, including Emannuel Mournier's theory of Personalism, Marxism, and the folk traditions and religions of Vietnam. The Can-Lao manifest calls for the gradual transformation of Vietnamese society through two phase. In the first phase, the Personalist Revolution, the Social and Working Classes will tear their divisions and join as one. Then comes the Social Revolution, where all forms of capitalism and colonial influence will be swept out on a triumphant march to a utopian, socialist, and proudly Vietnamese society."

labor_personalism: "Labor Personalism"
labor_personalism_desc: "£Ideology_Labor_Personalism_pic\n\n\n\n\n\n\n\n\nThe second phase of Oriental Personalism is Labour Personalism (Can-Lao Nhan-Vi) and it's the official ideology of the Can-Lao Nhan-Vi Revolutionary Party born out of the adoption of the Marxist model and the teachings of the Ngo-Dinh brothers and Kieu-Cong-Cung in 1958-1960.\n\nWhile Labour Personalism still maintains the anti-materialistic and pro-spiritualistic views of the first phase and the \"Nhan-Vi + Cong-Dong = Dong-Tien\" (Personhood + Collective = Mutual Progress) doctrine, they now put a heavier emphasis on constructing a utopia via the Social and Proletarian Revolution with the cooperation of all the Can-Lao (labor) classes and other marxist countries to combat materialistic greed and evil of capitalism and false communism."

nhuism: "Person Dignity Theory"
nhuism_desc: "£Ideology_Spiritualistic_Marxism_pic\n\n\n\n\n\n\n\n\nPerson Dignity Theory, also known as Spiritualistic Marxism, describes the more radical worldview of Ngo Dinh Nhu. Influenced by his involvment with French syndicalism in the 1930s and the left-wing nationalism of the Viet-Minh, Nhu's views are significantly to the left of his older brother. Nhu's interpretation of \"True Marxism\" calls for a total centralization of state power in the Can Lao Party and the complete destruction of traditional society in favor of the strict regimentation of the peasants in collectivist \"Strategic Hamlets\" and the city dwellers through \"Urban Revolutionary Syndicates\". Some believe Nhu's ambitions may lie beyond Vietnam, given his calls for a worldwide crusade against \"Materialistic Capitalism\"."

DanVuong_Model: "Dan-Vuong Model"
DanVuong_Model_desc: "£Ideology_Monarchism_Cuong_De_pic\n\n\n\n\n\n\n\n\nUnlike many emperors before him, Emperor Nam-Hung conceived a unique idea of kingship called \"Dan-Vuong\" or popular monarchy. The concept of \"Dan-Vuong\" consists of a combination of the revolutionary teachings of  Sun Yat-Sen's Tridemism and the traditional Vietnamese monarchical system, in which the king's role is an executive role to serve the people's common interests while allowing for an empowered parliament to enact in legislative role. The Emperor hopes that his idea of kingship would allow Vietnam to transition to a modern state from the ashes of archaic reactionary systems."
Cuong_De_desc: "A direct descendant of Emperor Gia Long, Nguyen-phuoc-dan – better known as cuong-de – spent much of his early life in exile in Japan after his involvement with the Dong-Du (Travel to the East) movement alongside Phan-boi-chau in the early 20th century. Marked as a collaborator by the French colonial authorities, cuong-de nevertheless remained a persistent symbol of Vietnamese monarchist resistance, balancing his ties to Japanese pan-Asianism with his vision of a sovereign Vietnam rooted in both Confucian tradition and modern nationalism.\n\nBy the late 1940s, as France sought to reassert control over Indochina through the fragile State of Vietnam under bao-dai, cuong-de returned to prominence. Backed by elements of the military, nationalist leagues, and labor organizers dissatisfied with bao-dai’s perceived weakness and collaboration with the French, he launched a swift palace coup in Phu-xuan in 1949. Declaring himself Emperor Nam-Hung – “ Strength of the South” – he cast his Dan-vuong Idea as a synthesis of modernization to the Vietnamese cultural legacy of the Nguyen dynasty and Sun-yet-Sen’s revolutionary Tridemism and hope to able to reunifying Vietnam either peacefully or through war against all forces of Imperialism."
