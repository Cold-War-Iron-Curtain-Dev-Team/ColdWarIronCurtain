l_english:
 # Russian 1990s State Security & FSB Localization
 RUS_90S_STATE_SECURITY: "Russian State Security & Counterintelligence"
 RUS_90S_STATE_SECURITY_desc: "Following the dissolution of the Soviet Union, the monolithic apparatus of the KGB was fractured into competing agencies. Throughout the 1990s, from the Ministry of Security (MBRF) to the Federal Counterintelligence Service (FSK) and ultimately the Federal Security Service (FSB), the organs of Lubyanka restructured to survive economic turmoil, political confrontation, and rising internal conflict."

 RUS_mbrf_ministry_of_security: "Ministry of Security of the Russian Federation (MBRF)"
 RUS_mbrf_ministry_of_security_desc: "Formed in January 1992 by Boris Yeltsin, the MBRF retained much of the Second, Third, and Fourth Chief Directorates of the KGB. While weakened by budget freezes and political suspicion, it maintains internal counterintelligence and surveillance capabilities."

 RUS_fsk_counterintelligence: "Federal Counterintelligence Service (FSK)"
 RUS_fsk_counterintelligence_desc: "Created by Presidential Decree No. 2167 following the October 1993 Constitutional Crisis, the FSK was stripped of investigative powers and special detention facilities by a suspicious Kremlin. It operates under stringent civilian oversight, hampering operative effectiveness."

 RUS_fsb_security_service: "Federal Security Service (FSB)"
 RUS_fsb_security_service_desc: "Established under Federal Law No. 40-FZ in April 1995, the FSB restored broad investigative, detention, and covert capabilities to Lubyanka. It coordinates anti-terror operations, foreign intelligence support, and border protection across the Federation."

 RUS_fsb_centralized_lubyanka: "Lubyanka Restructured"
 RUS_fsb_centralized_lubyanka_desc: "Under direct administrative leadership from loyal veterans of the organs, the FSB has consolidated political, economic, and security authority. The siloviki have emerged as the foundational pillar of the Russian state apparatus."

 # Decisions
 RUS_fsb_counter_espionage_sweeps: "Launch Counter-Espionage Sweeps"
 RUS_fsb_counter_espionage_sweeps_desc: "Direct counterintelligence operatives to monitor foreign embassy contacts, defend strategic defense design bureaus, and thwart foreign intelligence asset recruitment during this era of instability."

 RUS_fsb_tsn_alpha_vympel_readiness: "Special Operations Center (TsSN) Readiness"
 RUS_fsb_tsn_alpha_vympel_readiness_desc: "Provide dedicated emergency funding and advanced tactical ordnance to the elite counter-terrorism detachments Alpha and Vympel, ensuring rapid-deployment readiness for hostage situations and covert operations."

 RUS_fsb_economic_security_and_anti_corruption: "Economic Security & Anti-Corruption Directorate"
 RUS_fsb_economic_security_and_anti_corruption_desc: "Task Directorate 'K' and economic security branches with tracking illicit capital flight, auditing state enterprise asset transfers, and countering extortion rackets run by organized crime cartels."

 RUS_fsb_caucasus_counter_terrorism: "Caucasus Counter-Terrorism Operations"
 RUS_fsb_caucasus_counter_terrorism_desc: "Deploy operational-investigative task forces, signals interception, and specialist teams into the turbulent North Caucasus to interdict separatist terror networks and foreign financial channels."

 RUS_fsb_integrate_border_guard_service: "Integrate Federal Border Guard Service (FPS)"
 RUS_fsb_integrate_border_guard_service_desc: "Merge the previously autonomous Federal Border Guard Service back into the structural command of Lubyanka, restoring unified control over state frontier posts, coast guard flotillas, and border checkpoints."

 # Events
 RUS_FSB90.1.t: "Liquidation of the KGB & The MBRF"
 RUS_FSB90.1.d: "With the formal collapse of the USSR in late December 1991, the once all-powerful Committee for State Security (KGB) has been completely dissolved. President Boris Yeltsin, keen to prevent the security apparatus from staging another putsch like August 1991, has moved to establish the Ministry of Security of the Russian Federation (MBRF).\n\nLed by Viktor Barannikov, the new ministry inherits internal counterintelligence, communications monitoring, and regional directorates, while foreign espionage is split off to the newly created Foreign Intelligence Service (SVR). While some in the Supreme Soviet warn against preserving Lubyanka's core cadre, the country's spiraling crime rates and ethnic tensions demand a functioning security barrier."
 RUS_FSB90.1.a: "Establish the Ministry of Security (MBRF)."
 RUS_FSB90.1.b: "Decentralize and downsize the apparatus further."

 RUS_FSB90.2.t: "Decree No. 2167: Dismantling the MBRF and Founding the FSK"
 RUS_FSB90.2.d: "The violent climax of the October 1993 Constitutional Crisis saw army tanks shelling the White House in Moscow, but the Ministry of Security remained conspicuously hesistant to fully crush the parliamentary opposition. Distrustful of the MBRF's loyalty, President Boris Yeltsin has issued Presidential Decree No. 2167, summarily abolishing the Ministry of Security.\n\nIn its place, the Federal Counterintelligence Service (FSK) is established under Nikolai Golushko. The new agency has been deliberately defanged: its Lefortovo remand prison has been handed to the Ministry of Justice, its special forces reassigned, and its ability to conduct independent criminal investigations stripped away. Lubyanka finds itself at its weakest point in modern history."
 RUS_FSB90.2.a: "Sign Decree No. 2167: Establish the FSK."
 RUS_FSB90.2.b: "Preserve the Ministry of Security for now."

 RUS_FSB90.3.t: "Federal Law No. 40-FZ: Creation of the Federal Security Service"
 RUS_FSB90.3.d: "The disastrous commencement of the First Chechen War in late 1994, paired with high-profile covert debacles in Grozny involving FSK-hired mercenaries, laid bare the catastrophic flaws of a castrated counterintelligence service. The Russian State Duma and the President have finally agreed on the urgent necessity of restoring unified central state authority.\n\nOn April 3, 1995, President Yeltsin signs Federal Law No. 40-FZ, 'On the Organs of the Federal Security Service in the Russian Federation'. The FSK is reorganized into the Federal Security Service (FSB). The new law restores full powers of preliminary investigation, armed detention, and foreign intelligence gathering in border territories, returning Lubyanka to the center of Russian statecraft."
 RUS_FSB90.3.a: "Enact Law No. 40-FZ: Found the Federal Security Service (FSB)."

 RUS_FSB90.4.t: "Vladimir Putin Appointed Director of the FSB"
 RUS_FSB90.4.d: "In July 1998, amid deepening financial crisis, ruble collapse, and fierce factional warfare inside the Kremlin, President Yeltsin has dismissed Nikolai Kovalyov and appointed 45-year-old Vladimir Vladimirovich Putin as Director of the FSB.\n\nA former KGB foreign intelligence officer stationed in Dresden and later First Deputy Chief of the Presidential Staff, Putin is trusted by the Kremlin inner circle for his discretion, procedural competence, and unwavering loyalty. Putin immediately launches a massive structural reorganization of Lubyanka, eliminating redundant divisions, creating the Directorate of Computer and Information Security, and establishing personal operational control over all departmental heads."
 RUS_FSB90.4.a: "Entrust Lubyanka to Vladimir Putin."
 RUS_FSB90.4.b: "Maintain traditional civilian oversight."

 RUS_FSB90.5.t: "The Siloviki Ascendant: Patrushev and the War on Terror"
 RUS_FSB90.5.d: "In August 1999, as Vladimir Putin is elevated to Prime Minister, his trusted Petersburg associate Nikolai Patrushev is confirmed as the new Director of the FSB. The handover comes at a moment of mortal crisis: Chechen insurgent brigades under Shamil Basayev have invaded neighboring Dagestan, triggering the Second Chechen War, followed immediately by devastating apartment bombings in Buynaksk, Moscow, and Volgodonsk.\n\nUnder Patrushev and Putin, the FSB takes command of the Unified Group of Forces and the national counter-terrorism operational staff. The era of democratic paralysis and security organ retreat has ended; the 'siloviki'—veterans of state security—have consolidated their grip on the institutions of the Russian Federation."
 RUS_FSB90.5.a: "The state security organs stand united."
