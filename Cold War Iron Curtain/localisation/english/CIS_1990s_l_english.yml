l_english:
 # Ideas
 CIS_budapest_memorandum_guarantee: "Budapest Memorandum Security Guarantees"
 CIS_budapest_memorandum_guarantee_desc: "Under the 1994 Budapest Memorandum, the United States, the United Kingdom, and the Russian Federation committed to respect the independence, sovereignty, and existing borders of Ukraine, Kazakhstan, and Belarus in exchange for their accession to the Nuclear Non-Proliferation Treaty (NPT) as non-nuclear-weapon states."

 RUS_BLR_union_state: "Union State of Russia and Belarus"
 RUS_BLR_union_state_desc: "Established by the 1999 Treaty on the Creation of a Union State, Russia and Belarus share deep supranational integration encompassing unified defense, customs harmonization, and mutual economic coordination."

 UKR_black_sea_fleet_accord: "Black Sea Fleet Partition Treaty"
 UKR_black_sea_fleet_accord_desc: "Signed in May 1997, this bilateral accord amicably divided the contested former Soviet Black Sea Fleet between Ukraine and Russia, securing Russian lease payments for naval facilities in Sevastopol and formalizing Russian recognition of Ukrainian sovereignty."

 RUS_sevastopol_naval_lease: "Sevastopol Naval Base Lease"
 RUS_sevastopol_naval_lease_desc: "Under the 1997 Partition Treaty, the Russian Navy leases deep-water berths, repair shipyards, and military airfield infrastructure across Sevastopol and Crimea, guaranteeing continuous Russian operational presence in the Black Sea."

 # Events
 CIS_90.1.t: "[GetNewspaperHeader]The Lisbon Protocol: Denuclearizing the Post-Soviet Republics"
 CIS_90.1.d: "In Lisbon, representatives of the United States, Russia, Ukraine, Belarus, and Kazakhstan have signed a landmark protocol to the START I treaty. Following the breakup of the Soviet Union, Ukraine, Belarus, and Kazakhstan inherited thousands of strategic nuclear warheads on their soil, raising urgent global proliferation concerns.\n\nUnder the Lisbon Protocol, all three non-Russian successor republics formally pledge to adhere to the Nuclear Non-Proliferation Treaty (NPT) as non-nuclear-weapon states and transfer all inherited Soviet nuclear warheads to the Russian Federation for dismantling."
 CIS_90.1.a: "A vital step toward non-proliferation."

 CIS_90.2.t: "[GetNewspaperHeader]The Budapest Memorandum: Security Assurances Signed"
 CIS_90.2.d: "At the summit of the Conference on Security and Co-operation in Europe (CSCE) in Budapest, leaders of the United States, the United Kingdom, and the Russian Federation have signed the historic Budapest Memorandums on Security Assurances.\n\nIn exchange for Ukraine, Kazakhstan, and Belarus surrendering their massive nuclear arsenals, the signatory powers formally commit to respect the independence, sovereignty, and existing territorial borders of the three nations, and to refrain from the threat or use of force against their territorial integrity."
 CIS_90.2.a: "Guarantees of sovereignty in exchange for disarmament."

 CIS_90.3.t: "The 1994 Ukrainian Presidential Election"
 CIS_90.3.d: "Amid crushing hyperinflation, soaring energy debt, and sharp regional divides between the Ukrainian-speaking west and Russian-speaking industrial east, early presidential elections have taken place across Ukraine.\n\nFormer rocket factory director and Prime Minister Leonid Kuchma campaigned on a platform of economic pragmatism, administrative reform, and mending vital trade ties with the Russian Federation, challenging incumbent President Leonid Kravchuk's more nationalist posture."
 CIS_90.3.a: "Leonid Kuchma wins the presidency on economic pragmatism."
 CIS_90.3.b: "Leonid Kravchuk retains the presidency."

 CIS_90.4.t: "[GetNewspaperHeader]Partition of the Black Sea Fleet"
 CIS_90.4.d: "Following years of tense diplomatic standoff between Moscow and Kiev, Russian Prime Minister Viktor Chernomyrdin and Ukrainian Prime Minister Pavlo Lazarenko have signed the Partition Treaty on the Status and Conditions of the Black Sea Fleet.\n\nUnder the agreement, the Soviet naval assets stationed in Crimea have been divided, with Russia acquiring roughly four-fifths of the combat ships. Crucially, Ukraine has agreed to lease naval bays, anchorages, and port infrastructure in Sevastopol to the Russian Black Sea Fleet for twenty years, resolving one of the most perilous disputes of the post-Soviet era."
 CIS_90.4.a: "Sevastopol's status is secured."

 CIS_90.5.t: "The 1995 Belarusian National Referendum"
 CIS_90.5.d: "President Alexander Lukashenko has held a nationwide referendum across Belarus addressing foundational national questions. The ballot asked voters to approve granting Russian equal official status alongside Belarusian, adopting new state symbols modeled closely on the Soviet-era flag and coat of arms, supporting economic integration with Russia, and granting the President powers to dissolve parliament.\n\nThe electorate has voted overwhelmingly in favor of Lukashenko's proposals, steering Belarus firmly toward integration with Moscow."
 CIS_90.5.a: "Adopt new state symbols and economic integration."
 CIS_90.5.b: "The parliamentary opposition resists the changes."

 CIS_90.6.t: "[GetNewspaperHeader]Treaty on the Creation of the Union State"
 CIS_90.6.d: "In a solemn ceremony at the Grand Kremlin Palace in Moscow, Russian President Boris Yeltsin and Belarusian President Alexander Lukashenko have signed the Treaty on the Creation of the Union State of Russia and Belarus.\n\nThe treaty lays the groundwork for a supranational confederation, uniting the two Slavic nations into a common economic space, a coordinated foreign policy framework, and a unified regional air-defense network while preserving their formal sovereign statehood."
 CIS_90.6.a: "Russia and Belarus stand united."

 CIS_90.7.t: "[GetNewspaperHeader]Armistice in Transnistria: 14th Army Intervenes"
 CIS_90.7.d: "Following months of intense armed conflict between Moldovan government security forces and separatist paramilitaries in the self-declared Pridnestrovian Moldavian Republic, Russian forces of the 14th Guards Army under Major General Aleksandr Lebed have intervened with heavy artillery to halt fighting in the city of Bender.\n\nPresident Mircea Snegur of Moldova and President Boris Yeltsin of Russia have signed an armistice agreement in Moscow, establishing a demilitarized security zone, a tripartite Joint Control Commission, and Russian peacekeeping detachments along the Dniester."
 CIS_90.7.a: "The guns fall silent along the Dniester."

 CIS_90.8.t: "[GetNewspaperHeader]The Bishkek Protocol: Ceasefire in Nagorno-Karabakh"
 CIS_90.8.d: "In Bishkek, Kyrgyzstan, representatives of the parliaments of Armenia, Azerbaijan, and Nagorno-Karabakh have signed a Russian-brokered provisional ceasefire agreement, bringing an end to over six years of open warfare in the First Nagorno-Karabakh War.\n\nThe agreement freezes the frontline in place, leaving Armenian and Artsakh forces in control of the former Nagorno-Karabakh Autonomous Oblast and adjacent security districts. While the underlying political conflict remains unresolved, the guns have finally fallen silent."
 CIS_90.8.a: "A fragile peace holds across the line of contact."

 CIS_90.9.t: "[GetNewspaperHeader]The Moscow Peace Accord: End of the Tajikistani Civil War"
 CIS_90.9.d: "At the Kremlin in Moscow, President Emomali Rahmon of Tajikistan and United Tajik Opposition (UTO) leader Said Abdullah Nuri have signed the General Agreement on the Establishment of Peace and National Accord in Tajikistan, ending five years of devastating civil war.\n\nBrokered by Russia, Iran, and the United Nations, the peace accord integrates thirty percent of UTO representatives into the central government, grants amnesty to former fighters, and establishes a National Reconciliation Commission to oversee national disarmament and constitutional stability."
 CIS_90.9.a: "Reconciliation restores stability to Dushanbe."

 CIS_90.10.t: "Transfer of the National Capital: Akmola"
 CIS_90.10.d: "President Nursultan Nazarbayev has officially transferred the state capital of Kazakhstan from the southern metropolis of Almaty to the central northern city of Akmola (scheduled to be renamed Astana).\n\nThe bold relocation shifts the administrative center away from Almaty's earthquake-prone basin and closer to the industrial northern regions, anchoring the central government firmly at the geographic heart of the Eurasian steppe."
 CIS_90.10.a: "Designate Akmola as the new national capital."
 CIS_90.10.b: "Retain Almaty as the capital."
