l_english:

 #Starting Decisions#
 sov_generic_decisions: "The 4th-5th Five Year Plan"
 sov_generic_decisions_desc: "\n\n\n\n\n\n£Five_Year_Plans\n\n\n\n\n\n\nThe German invasion in 1941 permanently halted the progress of our industrialization; as such, the Five-Year Plans were suspended from 1941 to 1945, as the state was forced to redirect all available resources toward the war effort and national survival. During this period, economic development and long-term planning were placed on hold, as the primary focus shifted to military production, defense, and the mobilization of the population in response to the existential threat posed by the German advance.\n\nImmediately after the surrender of the Germans on May 9th, 1945, in an extraordinary congress, Stalin announced the continuation of the Five-Year Plans. However, recognizing the immense destruction caused by the war and the urgent need for rapid reconstruction, he declared that the Fourth Five-Year Plan and the Fifth Five-Year Plan would be merged into a single comprehensive program, aimed at restoring industrial capacity and resuming the path of economic development that had been interrupted by the conflict."
 SOV_test_first_nuke: "RDS-1 Nuclear Test"
 SOV_test_first_nuke_desc: "§W---------------------------§!\n\n\n\n£RDS_1_Test\n\n\n\n\n\n§W----------------------------§!\nOne of the greatest achievements in the history of Soviet espionage is represented here: the §RРеактивный двигатель специальный§!, or the §RSpecial Jet Engine§!. This breakthrough was made possible through information gathered by our mole within the Manhattan Project, providing critical insight into the development of this weapon. Thanks to this intelligence, our scientific community was able to gain access to knowledge that had previously been beyond our reach.\n\nWith this information in hand, our gifted scientists, especially Comrade §YIgor Kurchatov§!, have finally succeeded in recreating the formula of such a weapon. The nuclear device will be detonated in Pavlodar Oblast, near the facility where the weapon was produced."
 SOV_building_don_volga_canal: "Finish the Lenin Volga Don Canal"
 SOV_Khrushchev_ukraine_leader_mission: "Khrushchev in Ukraine"
 #SINO-SOVIET WAR
 SOV_Sino_Soviet_War: "The Sino-Soviet War"
 SOV_Sino_Soviet_War_desc: "[GetSOVPRCPics]The Chinese Communists have consistently been a troublesome presence in the history of China, from Mao's banditry to their dogmatism in 1941, which contributed to the breakdown of the United Front—a crucial alliance in the fight against Japanese imperialists.\n\nHowever, none of this compares to their actions on this date. They have completely abandoned Marxist-Leninist ideology and have engaged in a total revisionism of Lenin's ideals. It is time to defeat the Chinese Communists and restore true faith in Marxism-Leninism."
 SOV_Strike_The_Chinese_Railway: "Strike the Chinese Railway"
 SOV_Support_American_With_Intel: "Support the Americans with Intelligence"
 SOV_Support_American_With_Intel_desc: "§W---------------------------§!\n\n\n\n£Support_Americans\n\n\n\n\n\n§W----------------------------§!\nThe United States has been a consistent adversary of the Soviet Union, engaging in various forms of hostility and opposition throughout our history. However, with the ongoing war between us against China, it is clear that the United States is facing significant challenges and is in a position of lack of intel. By providing them with intelligence support, we can further exacerbate their difficulties and potentially hasten their decline with the ongoing war."
 #Dynamic Modifier
 SOV_Kuril_Illegal_Fishing: "Japanese Illegal Fishing"
 SOV_Kuril_Illegal_Fishing_desc: "§W---------------------------§!\n\n\n\n£Japanese_Illegals\n\n\n\n\n\n§W----------------------------§!\nEver since we acquired the Kuril Islands, as declared in the Potsdam Agreement, Japanese fishermen have continued to encroach upon our territory, with illegal fishing spreading unchecked and millions of tons of fish taken from our waters. As Japan continues to profit from resources taken from our land, it is only a matter of time before this issue is decisively addressed."
 SOV_Yakut_ASSR: "Yakut Autonomous Soviet Socialist Republic"
 SOV_Yakut_ASSR_desc: "§W---------------------------§!\n\n\n\n£Yakut_ASSR\n\n\n\n\n\n§W----------------------------§!\nThe Yakut Autonomous Soviet Socialist Republic (Yakut ASSR) was formed as part of the RSFSR on 27 April 1922, during the Yakut Revolt. It comprised the territory of the Yakutsk Oblast, excluding the Nizhnyaya Tunguska District, which was incorporated into the Kirensky District of the Irkutsk Governorate. In addition, the republic included the Khatango-Anabar District of the Yeniseysk Governorate, the Olekminsko-Suntarskaya volost of the Kirensky District of the Irkutsk Governorate, as well as all islands of the Arctic Ocean located between the meridians of 84° and 140½° east longitude.\n\nMaksim Ammosov, together with Platon Oyunsky and Isidor Barakhov, played a central role in the formation of the Yakut Autonomous Republic. Ammosov served as the first Executive Secretary of the Yakut Communist Party, Oyunsky became the first Chairman of the Central Executive Committee, and Barakhov was appointed as the first Chairman of the Council of People’s Commissars."
 #EVENTS
 sov_jvs.1.t: "Trial of Grigoriy Kulik"
 sov_jvs.1.d: "Grigoriy Kulik is perhaps one of the most idiotic individuals ever to ascend to a high position within the army, a figure whose incompetence was repeatedly exposed despite his rank and authority. His failures in 1942 were ultimately forgiven due to his close relationship with Stalin, a privilege that shielded him from the consequences faced by others. Rather than humbling him, this protection only reinforced his arrogance, making him increasingly critical, reckless, and ultimately borderline dangerous to the Party and the state.\n\nAfter his arrest in 1947, when one of our agents eavesdropped on him speaking openly about the possibility of a coup against Stalin, his disloyalty was finally confirmed. Although he was detained, capital punishment had at that time been outlawed, preventing a final resolution to the threat he posed. With the new decree reestablishing capital punishment, the state will at last be able to silence Kulik once and for all, removing a persistent and dangerous element from within its ranks."
 sov_jvs.1.a: "That Traitor Deserves it!"
 sov_jvs.1.a.tt: "§RKulik's treachery cannot go unpunished. His actions have endangered the very fabric of our state, and it is imperative that we demonstrate the consequences of such betrayal. By executing Kulik, we send a clear message to all who might consider similar acts of disloyalty: the Soviet Union will not tolerate treason, and those who betray us will face the full extent of our justice system. This execution is not just about punishing one§!"
 sov_jvs.2.t: "Pe-2 Shotdown on our backyard!"
 sov_jvs.2.d: "We have received a report confirming that our Pe-2 reconnaissance aircraft was shot down over Vladivostok. Although the American ambassador has issued an apology for this incident, the statement delivered appears less an admission of responsibility and more an attempt at justification. Such an explanation fails to address the gravity of the violation and only reinforces the perception that the matter is being treated lightly rather than with the seriousness it deserves.\n\nComrade General Secretary, it has become increasingly apparent that a complete victory by United Nations forces in Korea could signal the erosion, if not the outright end, of our influence in the Far East. Today it is Korea; tomorrow it may be China, and after that, ourselves. Recognizing this danger, the Ministry of Defense has already taken action, and the STAVKA has been duly informed. We now face a clear choice: to accept a dishonest apology and allow the issue to fade, or to finally resolve it by ordering the Far Eastern Military District to commence a Special Operation in support of our Korean and Chinese allies."
 sov_jvs.2.a: "Accept American Apology."
 sov_jvs.2.b: "This has gone too far!"
 sov_jvs.3.t: "[GetNewspaperHeader]Soviet Union Enters Korea!"
 sov_jvs.3.d: "Following the breakdown of diplomatic communication and the shootdown of a Soviet Pe-2 aircraft over the Sea of Japan, the government of the Soviet Union has concluded that the moment for decisive action has arrived. These developments, taken together, were viewed as a direct challenge to Soviet security and influence in the Far East, leaving little room for further delay or ambiguity in policy.\n\nAt [?global.date.GetDateStringShortMonth] today, detachments of the Soviet military district crossed into Korea, formally entering the Korean War. With this action, the Soviet Union has openly committed itself to the conflict, marking a decisive escalation and signaling its determination to defend its strategic interests and support its allies on the Korean Peninsula."
 sov_jvs.3.a: "History Repeats Itself."
 sov_jvs.4.t: "The Korean Division"
 sov_jvs.4.d: "Following the declaration of the Republic of Korea in 1948 and its subsequent recognition by the United Nations, Kim Il Sung, our northern ally, has grown increasingly wary of Syngman Rhee’s aggressive posture toward Pyongyang. Rhee’s overt pro-unification rhetoric, openly backed by the United Nations and the United States, represents a direct and serious challenge to Soviet influence in East Asia. This political alignment in the South has heightened tensions on the Korean Peninsula and raised concerns in Moscow regarding the balance of power in the region.\n\nWith the war in China still ongoing, however, an immediate military action by Kim Il Sung would be disastrous. The Soviet Union cannot afford to provide massive support to both China and Korea without dangerously overstretching its resources. This reality leaves us with an alternative course of action: the gradual and methodical preparation of North Korea for a future confrontation. Such restraint is understandably met with frustration in Pyongyang, particularly as our intelligence indicates that the South itself is making preparations for a potential attack on the North."
 sov_jvs.4.a: "We need to prepare Pyongyang."
 sov_jvs.5.t: "The Dalian Question"
 sov_jvs.5.d: "The Russian Empire held Dalian for a considerable period, until the aftermath of the Russo-Japanese War in 1905 compelled us to relinquish the territory to the Japanese Empire.\n\nWith the defeat of Japan in 1945, Dalian was restored to us. Yet as the Chinese Civil War reignited and ultimately concluded with the victory of the Chinese Communist Party on the mainland, we now find ourselves confronted by a strategic and political dilemma. This territory, possessing a vital warm-water port, offers us significant advantages, serving as an essential trade hub that connects us to the broader markets of East Asia. At the same time, with the triumph of the Communists in China, our rationale for retaining direct control over the territory appears diminished—after all, we are now aligned as allies.\n\nThus, three options stand before us: to establish a joint administration under CCP leadership alongside our military presence; to return the territory in full to China; or to adhere strictly to the existing treaty provisions and transfer sovereignty in 1997 as stipulated."
 sov_jvs.5.a: "Let's Establish Dalian Administration!"
 sov_jvs.5.b: "Return it to China."
 sov_jvs.5.c: "Well... The Treaty Says Until 1997..."
 sov_jvs.6.t: "[GetNewspaperHeader]Dalian Returned to China!"
 sov_jvs.6.d: "Following the conclusion of the Chinese Civil War, the territory of Dalian, previously administered by the Soviet Union, has been formally returned to the People's Republic of China.\n\nWith the Communist victory on the mainland and the establishment of a new central government in Beijing, the question of Dalian’s administration has now been decisively settled.\n\nOfficials describe the handover as a gesture of goodwill and solidarity between allied governments, underscoring strengthening ties between Moscow and Beijing in the early years of the new regional order. The move effectively concludes a chapter of foreign administration over the strategic port city, restoring it fully under Chinese sovereignty."
 sov_jvs.6.a: "Friendship Forever!"
 sov_jvs.6.b: "Interesting Development..."
 sov_jvs.7.t: "Abolishment of the General Secretary Position"
 sov_jvs.7.d: "When Joseph Stalin was elected at the 11th Congress of the Russian Communist Party (Bolsheviks), he quickly moved to appoint loyalists within the Presidium, gradually transforming the position of General Secretary into one that was effectively equivalent to—if not more powerful than—that of the Premier.\n\nHowever, during the 17th Congress of the Communist Party of the Soviet Union, Stalin was not formally reelected to the role, and from that point onward the title of General Secretary became one that was rarely mentioned by the Soviet government. Although the influence associated with the position remained significant, the title itself faded from official usage.\n\nAs such, at the 19th Congress of the Communist Party of the Soviet Union, Stalin has now formally abolished the title of General Secretary."
 sov_jvs.7.a: "Long Live Stalin!"
 sov_jvs.8.t: "Conclusion of Council of Foreign Ministers' Meeting"
 sov_jvs.8.d: "Meeting of the Council of Foreign Ministers in Paris has concluded.\n\nOur hopes to reach an agreement on political and economic German unity have been crushed by the Western powers, who rejected comrade Vyshinsky’s proposal to restore former four-power control of Germany, declaring that "they would not undo what they had achieved toward furthering the economic organization and the democratic self-government of their zones". Any further argument with them resulted in little more than them suggesting to implement their occupation standards on our zone and, therefore, de-facto surrender it to them.\n\nThis meeting, along with establishment of the Federal Republic of Germany preceding it, has once again proven that expansion of American imperialism is more important for them than fate of the German people. Although German territories we control are in no position to compete with the former Trizone, it seems that we should seriously consider establishing a socialist German state in our own zone."
 sov_jvs.8.a: "We are out of options here."
 sov_jvs.9.t: "[GetNewspaperHeader]Conclusion of Council of Foreign Ministers' Meeting"
 sov_jvs.9.d: "Meeting of the Council of Foreign Ministers in Paris has concluded.\n\nThe sixth meeting of the Council held since its foundation, with Andrey Vyshinsky, Maurice Schumann, Ernest Bevin and Dean Acheson representing Soviet Union, France, United Kingdom and United States respectively.\n\nSoviet proposal for resumption of four powers control of Germany, discussed at the meeting, has been rejected by the Western powers, who declared that they would not undo what they had achieved toward furthering the economic organization and the democratic self-government of their zones. The foundations of restored Austrian independence were agreed upon, however without German treaty signed negotiations couldn’t progress past that point.\n\nMeeting has proven that differences between former allies have become too great as peaceful reunification of Germany, which has already become unlikely after establishment of Federal Republic of Germany by Western Powers, is becoming even more unlikely now."
 sov_jvs.9.a: "Damn the West!"
 sov_jvs.9.b: "Clearly, the Council has lost its purpose."
 sov_jvs.10.t: "Compromise Rejected"
 sov_jvs.10.d: "In an attempt to return to status quo, which was severely loosened after establishment of the Federal Republic of Germany, Comrade Vyshinsky has suggested to restore former four-power control of Germany, including revival of the Allied Control Council and the Allied Kommandatura. However, Dean Acheson rejected this proposal, with other Western foreign ministers declaring that they would not undo \"what they had achieved toward furthering the economic organization and the democratic self-government of their zones\" — actions that go in direct violation of both Yalta and Potsdam agreements.\n\nAlthough the meeting is still ongoing, the chances of reaching a compromise on the German status are going thin."
 sov_jvs.10.a: "Let’s see if they have better suggestions."
 sov_jvs.11.t: "Dead End"
 sov_jvs.11.d: "After rejecting comrade Vyshinsky’s proposal, Western powers declared that they favour establishment of the German unified government, however all their following proposals have been followed with demands to implement their occupation standards in our zone, culminating in today’s proposal to extend West German constitution to the entire country. This proposal would de-facto mean surrendering our occupation zone to their control, and therefore comrade Vyshinsky has rejected it.\n\nToday’s meeting has shown that Western powers have no intension of finding a compromise that would satisfy both sides. This seems very unlikely that any agreements regarding Germany will be reached on this conference."
 sov_jvs.11.a: "It was to be expected."
 sov_jvs.12.t: "Strikes in West Berlin"
 sov_jvs.12.d: "In the aftermath of Western monetary reform, which violated both Yalta and Potsdam agreements, the “Deutsche Mark” (western DM) was introduced in replacement of former Reichsmark, and this led to Reichsmarks to flood into our occupation zone as its course collapsed. As one of countermeasures to manage this crisis, we introduced eastern Deutsche Mark (eastern DM) in replacement of Reichsmark, however, with West Berlin still not being directly connected to the West Germany, many of its citizens were paid with eastern DMs instead of western ones.\n\nAs a result, around 16,000 non-communist railway workers living in West Berlin, supported by railroad workers’ union Unabhängige Gewerkschaftsopposition (UGO) and East German State Railway have started a strike, demanding payment in western DMs instead of eastern ones. The strike is still ongoing, and we need to come up with satisfying solution as quick as possible."
 sov_jvs.12.a: "What should we do…"







