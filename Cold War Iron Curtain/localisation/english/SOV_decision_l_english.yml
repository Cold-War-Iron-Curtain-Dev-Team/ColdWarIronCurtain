 #Starting Decisions#
 sov_generic_decisions: "The 4th-5th Five Year Plan"
 sov_generic_decisions_desc: "\n\n\n\n\n\n£Five_Year_Plans\n\n\n\n\n\n\nThe German invasion in 1941 permanently halted the progress of our industrialization; as such, the Five-Year Plans were suspended from 1941 to 1945, as the state was forced to redirect all available resources toward the war effort and national survival. During this period, economic development and long-term planning were placed on hold, as the primary focus shifted to military production, defense, and the mobilization of the population in response to the existential threat posed by the German advance.\n\nImmediately after the surrender of the Germans on May 9th, 1945, in an extraordinary congress, Stalin announced the continuation of the Five-Year Plans. However, recognizing the immense destruction caused by the war and the urgent need for rapid reconstruction, he declared that the Fourth Five-Year Plan and the Fifth Five-Year Plan would be merged into a single comprehensive program, aimed at restoring industrial capacity and resuming the path of economic development that had been interrupted by the conflict."
 SOV_test_first_nuke: "RDS-1 Nuclear Test"
 SOV_test_first_nuke_desc: "§W---------------------------§!\n\n\n\n£RDS_1_Test\n\n\n\n\n\n§W----------------------------§!\nOne of the greatest achievements in the history of Soviet espionage is represented here: the §RРеактивный двигатель специальный§!, or the §RSpecial Jet Engine§!. This breakthrough was made possible through information gathered by our mole within the Manhattan Project, providing critical insight into the development of this weapon. Thanks to this intelligence, our scientific community was able to gain access to knowledge that had previously been beyond our reach.\n\nWith this information in hand, our gifted scientists, especially Comrade §YIgor Kurchatov§!, have finally succeeded in recreating the formula of such a weapon. The nuclear device will be detonated in Pavlodar Oblast, near the facility where the weapon was produced."
 SOV_building_don_volga_canal: "Finish the Lenin Volga Don Canal"
 SOV_Khrushchev_ukraine_leader_mission: "Khrushchev in Ukraine"

