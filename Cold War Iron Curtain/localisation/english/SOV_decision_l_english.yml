 SOV_Kuril_Illegal_Fishing: "Japanese Illegal Fishing"
 SOV_Kuril_Illegal_Fishing_desc: "§W---------------------------§!\n\n\n\n£Japanese_Illegals\n\n\n\n\n\n§W----------------------------§!\nEver since we acquired the Kuril Islands, as declared in the Potsdam Agreement, Japanese fishermen have continued to encroach upon our territory, with illegal fishing spreading unchecked and millions of tons of fish taken from our waters. As Japan continues to profit from resources taken from our land, it is only a matter of time before this issue is decisively addressed."
