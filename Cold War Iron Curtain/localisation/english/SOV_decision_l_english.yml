 #Starting Decisions#
 sov_generic_decisions: "The 4th-5th Five Year Plan"
 sov_generic_decisions_desc: "\n\n\n\n\n\n£Five_Year_Plans\n\n\n\n\n\n\nThe German invasion in 1941 permanently halted the progress of our industrialization; as such, the Five-Year Plans were suspended from 1941 to 1945, as the state was forced to redirect all available resources toward the war effort and national survival. During this period, economic development and long-term planning were placed on hold, as the primary focus shifted to military production, defense, and the mobilization of the population in response to the existential threat posed by the German advance.\n\nImmediately after the surrender of the Germans on May 9th, 1945, in an extraordinary congress, Stalin announced the continuation of the Five-Year Plans. However, recognizing the immense destruction caused by the war and the urgent need for rapid reconstruction, he declared that the Fourth Five-Year Plan and the Fifth Five-Year Plan would be merged into a single comprehensive program, aimed at restoring industrial capacity and resuming the path of economic development that had been interrupted by the conflict."
 SOV_test_first_nuke: "RDS-1 Nuclear Test"
 SOV_test_first_nuke_desc: "§W---------------------------§!\n\n\n\n£RDS_1_Test\n\n\n\n\n\n§W----------------------------§!\nOne of the greatest achievements in the history of Soviet espionage is represented here: the §RРеактивный двигатель специальный§!, or the §RSpecial Jet Engine§!. This breakthrough was made possible through information gathered by our mole within the Manhattan Project, providing critical insight into the development of this weapon. Thanks to this intelligence, our scientific community was able to gain access to knowledge that had previously been beyond our reach.\n\nWith this information in hand, our gifted scientists, especially Comrade §YIgor Kurchatov§!, have finally succeeded in recreating the formula of such a weapon. The nuclear device will be detonated in Pavlodar Oblast, near the facility where the weapon was produced."
 SOV_building_don_volga_canal: "Finish the Lenin Volga Don Canal"
 SOV_Khrushchev_ukraine_leader_mission: "Khrushchev in Ukraine"

 #Dynamic Modifier
 SOV_Kuril_Illegal_Fishing: "Japanese Illegal Fishing"
 SOV_Kuril_Illegal_Fishing_desc: "§W---------------------------§!\n\n\n\n£Japanese_Illegals\n\n\n\n\n\n§W----------------------------§!\nEver since we acquired the Kuril Islands, as declared in the Potsdam Agreement, Japanese fishermen have continued to encroach upon our territory, with illegal fishing spreading unchecked and millions of tons of fish taken from our waters. As Japan continues to profit from resources taken from our land, it is only a matter of time before this issue is decisively addressed."
 SOV_Yakut_ASSR: "Yakut Autonomous Soviet Socialist Republic"
 SOV_Yakut_ASSR_desc: "§W---------------------------§!\n\n\n\n£Yakut_ASSR\n\n\n\n\n\n§W----------------------------§!\nThe Yakut Autonomous Soviet Socialist Republic (Yakut ASSR) was formed as part of the RSFSR on 27 April 1922, during the Yakut Revolt. It comprised the territory of the Yakutsk Oblast, excluding the Nizhnyaya Tunguska District, which was incorporated into the Kirensky District of the Irkutsk Governorate. In addition, the republic included the Khatango-Anabar District of the Yeniseysk Governorate, the Olekminsko-Suntarskaya volost of the Kirensky District of the Irkutsk Governorate, as well as all islands of the Arctic Ocean located between the meridians of 84° and 140½° east longitude.\n\nMaksim Ammosov, together with Platon Oyunsky and Isidor Barakhov, played a central role in the formation of the Yakut Autonomous Republic. Ammosov served as the first Executive Secretary of the Yakut Communist Party, Oyunsky became the first Chairman of the Central Executive Committee, and Barakhov was appointed as the first Chairman of the Council of People’s Commissars."
 #EVENTS
 sov_jvs.1.t: "Trial of Grigoriy Kulik"
 sov_jvs.1.d: "Grigoriy Kulik is perhaps one of the most idiotic individuals ever to ascend to a high position within the army, a figure whose incompetence was repeatedly exposed despite his rank and authority. His failures in 1942 were ultimately forgiven due to his close relationship with Stalin, a privilege that shielded him from the consequences faced by others. Rather than humbling him, this protection only reinforced his arrogance, making him increasingly critical, reckless, and ultimately borderline dangerous to the Party and the state.\n\nAfter his arrest in 1947, when one of our agents eavesdropped on him speaking openly about the possibility of a coup against Stalin, his disloyalty was finally confirmed. Although he was detained, capital punishment had at that time been outlawed, preventing a final resolution to the threat he posed. With the new decree reestablishing capital punishment, the state will at last be able to silence Kulik once and for all, removing a persistent and dangerous element from within its ranks."
 sov_jvs.1.a: "That Traitor Deserves it!"
 sov_jvs.1.a.tt: "§RKulik's treachery cannot go unpunished. His actions have endangered the very fabric of our state, and it is imperative that we demonstrate the consequences of such betrayal. By executing Kulik, we send a clear message to all who might consider similar acts of disloyalty: the Soviet Union will not tolerate treason, and those who betray us will face the full extent of our justice system. This execution is not just about punishing one§!"
 sov_jvs.2.t: "Pe-2 Shotdown on our backyard!"
 sov_jvs.2.d: "We have received a report confirming that our Pe-2 reconnaissance aircraft was shot down over Vladivostok. Although the American ambassador has issued an apology for this incident, the statement delivered appears less an admission of responsibility and more an attempt at justification. Such an explanation fails to address the gravity of the violation and only reinforces the perception that the matter is being treated lightly rather than with the seriousness it deserves.\n\nComrade General Secretary, it has become increasingly apparent that a complete victory by United Nations forces in Korea could signal the erosion, if not the outright end, of our influence in the Far East. Today it is Korea; tomorrow it may be China, and after that, ourselves. Recognizing this danger, the Ministry of Defense has already taken action, and the STAVKA has been duly informed. We now face a clear choice: to accept a dishonest apology and allow the issue to fade, or to finally resolve it by ordering the Far Eastern Military District to commence a Special Operation in support of our Korean and Chinese allies."
 sov_jvs.2.a: "Accept American Apology."
 sov_jvs.2.b: "This has gone too far!"
 sov_jvs.3.t: "[GetNewspaperHeader]Soviet Union Enters Korea!"
 sov_jvs.3.d: "Following the breakdown of diplomatic communication and the shootdown of a Soviet Pe-2 aircraft over the Sea of Japan, the government of the Soviet Union has concluded that the moment for decisive action has arrived. These developments, taken together, were viewed as a direct challenge to Soviet security and influence in the Far East, leaving little room for further delay or ambiguity in policy.\n\nAt 2 a.m. today, detachments of the Soviet military district crossed into Korea, formally entering the Korean War. With this action, the Soviet Union has openly committed itself to the conflict, marking a decisive escalation and signaling its determination to defend its strategic interests and support its allies on the Korean Peninsula."
 sov_jvs.3.a: "History Repeats Itself."

