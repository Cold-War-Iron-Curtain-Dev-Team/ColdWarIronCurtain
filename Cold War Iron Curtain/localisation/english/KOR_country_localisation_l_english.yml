### Country Super Events ######################################
 KOR_BIG_EVENT_QUOTE: "[KOR_Big_Event_Quote_Loc]"
 KOR_Big_Event_Syngman_Rhee_Steps_Down_Quote: "The sovereignty of the Republic of Korea lies with the people, and all power comes from the people.\n-Constitution of the Republic of Korea"
 KOR_Big_Event_Assasination_of_Syngman_Rhee_Quote: "It was an important moment affecting the fate of a country, where the whole nation had to fight against enemies outside and inside with a firm will.\n-Lee Beom-seok"
 KOR_Big_Event_Operation_Everready_Quote: "There is no indispensable man in a democracy.\n-Harry S. Truman"
 KOR_Big_Event_KPG_Triumphant_Quote: "The reds are also our compatriots who share blood and bones. We should sit face to face with our own people and see a final decision. I should go even if I die lying on the 38th parallel.\n-Kim Koo"
 KOR_Big_Event_Jokcheong_Triumphant_Quote: "Although the world is vast and the mankind is numerous, no nation with strong conditions like ours will ever be found in terms of history and tradition.\n-Lee Beom-seok"
 KOR_Big_Event_Syngman_Rhee_Triumphant_Quote: "Democracy allows all the people's free rights and suffrage, but no country allows rogue elements to overthrow the government on the pretext of civil freedom.\n-Syngman Rhee"
 KOR_Big_Event_Overthrow_of_Kim_Family_Quote: "There are decades where nothing happens, and there are weeks where decades happen.\n-Vladimir Ilyich Lenin"