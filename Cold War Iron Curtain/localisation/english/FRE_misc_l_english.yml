 FRE_ECO_Infant_Illness_Prevention:0 "Hanoi Infant Health Program"
 FRE_ECO_Infant_Illness_Prevention_desc:0 "Expanded hospital services and more reliable medical supplies are helping children survive illnesses that once went untreated. Population growth is improving, strengthening the territory's long-term manpower base."
 FRE_ECO_CEFEO_Pay_Raise:0 "Increased CEFEO Pay"
 FRE_ECO_CEFEO_Pay_Raise_desc:0 "Revised CEFEO salaries make service a more attractive livelihood. Recruiting officers can offer a better pay packet to men considering enlistment."
