 FRE_ECO_Dislocation:0 "Post-War Economic Dislocation"
 FRE_ECO_Dislocation_desc:0 "Broken transport links and exhausted workshops leave much of the territory unable to supply ordinary civilian needs. Shortages interrupt production, and road repairs compete with the daily struggle to keep the markets fed.\n\nRecovery stage: §Y[?FRE_eco_dislocation_tier|0]§! of 5"
 FRE_ECO_Growth:0 "Post-War Economic Growth"
 FRE_ECO_Growth_desc:0 "Renewed foreign trade has given the workshops reliable buyers and a reason to expand. Factory output and construction are growing beyond the work of replacing wartime losses."
 FRE_ECO_Piastre_Inflation_Crisis:0 "Piastre Inflation Crisis"
 FRE_ECO_Piastre_Inflation_Crisis_desc:0 "Merchants revise their prices while the treasury struggles to contain the exchange traffic. Civilian demand weighs on the economy, industrial output suffers, and each pay dispute weakens the administration.\n\nStabilization stage: §Y[?FRE_eco_piastre_tier|0]§! of 5. Improving past stage 5 ends the crisis."
 FRE_ECO_Metropolitan_Dependency:0 "Metropolitan Economic Dependency"
 FRE_ECO_Metropolitan_Dependency_desc:0 "Local development waits on metropolitan suppliers and credit. New factories are slow to establish, resource production falls short, and commercial partners see little point in dealing with an economy that cannot act for itself.\n\nAutonomy stage: §Y[?FRE_eco_dependency_tier|0]§! of 5"
 FRE_ECO_Industrial_Infancy:0 "Infancy of an Extreme-Orient Industry"
 FRE_ECO_Industrial_Infancy_desc:0 "Bourgoin's civilian program has given local manufacturing a beginning. Fragile enterprises still struggle for supplies, but each stage of growth makes civilian construction faster and factories more productive.\n\nIndustrial stage: §Y[?FRE_eco_dependency_tier|0]§! of 5"
 FRE_ECO_Exploitative_Economy:0 "Exploitative War Economy"
 FRE_ECO_Exploitative_Economy_desc:0 "Indochina's resources are directed toward French requirements, with resource and military production earning a privileged return. The receipts are lucrative, but allocations hold back construction of new factories.\n\nStage: §Y[?FRE_eco_exploitation_tier|0]§! of 4"

