l_english:

# === Operation Pollux ===
 FRE_Operation_Pollux_Available_tt:0 "Operation Pollux requires an established French-aligned camp at §YDien Bien Phu§!, a surviving §YTai Federation§!, an active Indochina theatre, and no live Dien Bien Phu offensive or other CEFEO operation. It becomes historically available after §YNovember 22, 1953§!."
 FRE_Pollux_Historical_tt:0 "§YHistorical split evacuation§!\nSpend §Y30 War Credits§! and §Y3 Transport Planes§!, and lose §R2 Metropole Patience§!. Operation Leda flies the regular detachments to Dien Bien Phu, but the Tai partisan columns march without a dedicated corridor screen.\n\nAfter §Y10 days§!, the regulars deliver §G500 Infantry Equipment§! and §G75 Support Equipment§! to the camp garrison. The overland formation is recorded lost: lose §R2,000 Manpower§!, §R1% Stability§!, and §R2% War Support§!, with a modest struggle swing toward the Viet Minh."
 FRE_Pollux_Escort_tt:0 "§YEscorted Route Pavie withdrawal§!\nSpend §Y80 War Credits§!, commit §Y2,000 Manpower§!, and lose §R5 Metropole Patience§!. Keep French-aligned control of §YLai Chau§!, the §YRoute Pavie approach§!, and the §YDien Bien Phu camp§! for §Y7 consecutive days§! inside the §Y21-day evacuation window§!. Broken corridor control resets the count.\n\n§GSuccess§!: recover the committed manpower, deploy one additional survivor group in the camp, deliver infantry, support, and artillery equipment, and gain §G15 Army Experience§!.\n\n§RFailure§!: lose a further §R3,000 Manpower§!, §R4 Metropole Patience§!, §R1% Stability§!, and §R2% War Support§!."
 FRE_Pollux_Airlift_tt:0 "§YExpanded Operation Leda§!\nSpend §Y120 War Credits§! and §Y8 Transport Planes§!, and lose §R7 Metropole Patience§!. Keep the §YDien Bien Phu camp§! under French-aligned control for §Y7 consecutive days§! inside the §Y21-day evacuation window§!; the land corridor is not required.\n\n§GSuccess§!: deploy one additional survivor group in the camp, deliver infantry, support, and artillery equipment, and gain §G15 Army Experience§!.\n\n§RFailure§!: lose §R1,500 Manpower§!, §R1% Stability§!, and §R2% War Support§! in addition to the aircraft and political cost already paid."
 FRE_Pollux_Unfunded_tt:0 "Lai Chau is abandoned without an organized airlift or protected corridor. The partisan formation is lost before reaching Dien Bien Phu."

 FRE_Mission_Operation_Pollux:0 "Operation Pollux: Evacuate Lai Chau"
 FRE_Mission_Operation_Pollux_desc:0 "Complete the selected evacuation plan before the twenty-one-day window closes. An escorted withdrawal needs seven consecutive days of control from Lai Chau through Route Pavie to Dien Bien Phu. The expanded airlift needs seven consecutive days of control at the camp."
 FRE_Mission_Operation_Pollux_Available_tt:0 "The evacuation order is already active. Secure the selected route until the Lai Chau force reaches Dien Bien Phu."

 FRE_Operation_Pollux_Launched:0 "§YOperation Pollux Ordered§!"
 FRE_Mission_Operation_Pollux_Activated:0 "§ROperation Pollux: Active§!"
 FRE_Mission_Operation_Pollux_Completed:0 "§GOperation Pollux: Force Preserved§!"
 FRE_Mission_Operation_Pollux_Failed:0 "§ROperation Pollux: Column Lost§!"
 FRE_Operation_Cooldown_Pollux:0 "§ROperation Pollux: Concluded§!"
 FRE_Operation_Pollux_Result_Preserved:0 "§GThe Lai Chau force reached Dien Bien Phu intact§!"
 FRE_Operation_Pollux_Result_Column_Loss:0 "§RThe Lai Chau column was lost on the retreat§!"
 FRE_Operation_Pollux_Result_Superseded:0 "Operation Pollux was §govertaken by the wider battle§!"
 FRE_Pollux_Garrison_Reinforced:0 "§GThe Lai Chau survivor group reinforces Dien Bien Phu§!"

# === Operation Atlante ===
 FRE_Operation_Atlante_Available_tt:0 "Operation Atlante requires the State of Vietnam and the southern Viet Minh to remain at war in an active Indochina theatre. It becomes historically available after §YJanuary 14, 1954§! and cannot begin while another CEFEO operation is active."
 FRE_Atlante_Full_tt:0 "§YCommit CEFEO to Operation Atlante§!\nSpend §Y100 War Credits§!, commit §Y4,500 Manpower§!, and lose §R7 Metropole Patience§!. French and Vietnamese AI forces will concentrate against §YInterzone V§!. Hold both operational objectives in the southern Viet Minh base for §Y14 consecutive days§! inside a §Y90-day window§!. Losing either objective resets the count.\n\nThis commitment sends the expeditionary reserve to central Vietnam. If Dien Bien Phu opens, §Rmaximum reinforcement and Operation Condor will be unavailable§!; the scheduled defense and an appeal for Operation Vulture remain possible.\n\n§GSuccess§!: gain §G20 Army Experience§!, strengthen Saigon's confidence, and shift the struggle toward France.\n\n§RFailure§!: lose a further §R3,000 Manpower§!, §R5 Metropole Patience§!, and §R2% War Support§!, with a struggle swing toward the Viet Minh."
 FRE_Atlante_Vietnamese_tt:0 "§YPlace the Vietnamese National Army in the lead§!\nSpend §Y40 War Credits§! and lose §R2 Metropole Patience§! while delivering rifles and support equipment to Saigon. The Vietnamese National Army must hold the coastal objective in §YInterzone V§! for §Y14 consecutive days§! inside a §Y90-day window§!. Losing it resets the count.\n\nCEFEO retains its northern reserve, so the full Dien Bien Phu response menu remains available.\n\n§GSuccess§!: gain §G10 Army Experience§!, strengthen Saigon's authority, and make a modest struggle gain.\n\n§RFailure§!: the Vietnamese National Army loses §R1,500 Manpower§! and §R2% War Support§!, while CEFEO loses §R2% War Support§!."
 FRE_Atlante_North_tt:0 "§YCurtail Atlante and reinforce Tonkin§!\nSpend §Y40 War Credits§!, commit §Y2,500 Manpower§!, and lose §R3 Metropole Patience§! to assemble a northern reserve. No central-Vietnam objective will be attempted.\n\nWhen the Dien Bien Phu campaign opens, the reserve delivers §G1,000 Infantry Equipment§!, §G100 Support Equipment§!, and §G50 Artillery Equipment§! to the camp garrison and delays scripted fort degradation by §G10 active-siege days§!. The fixed day-150 and day-260 campaign deadlines do not move."
 FRE_Atlante_Unfunded_tt:0 "The central offensive is struck from the operational calendar. No northern reserve is assembled, and the abandoned plan is recorded as a minor political and struggle setback."

 FRE_Mission_Operation_Atlante:0 "Operation Atlante: Interzone V"
 FRE_Mission_Operation_Atlante_desc:0 "Secure the selected objective in the southern Viet Minh base for fourteen consecutive days before the ninety-day operational window closes. A full CEFEO commitment requires both objectives; a Vietnamese-led operation requires the coastal lodgement."
 FRE_Mission_Operation_Atlante_Available_tt:0 "The offensive order is already active. Secure and hold the objectives until the fourteen-day consolidation is complete."

 FRE_Operation_Atlante_Launched:0 "§YOperation Atlante Ordered§!"
 FRE_Mission_Operation_Atlante_Activated:0 "§ROperation Atlante: Active§!"
 FRE_Atlante_Offensive_Active:0 "§ROperation Atlante is underway§!"
 FRE_Mission_Operation_Atlante_Completed:0 "§GOperation Atlante: Objective Consolidated§!"
 FRE_Mission_Operation_Atlante_Failed:0 "§ROperation Atlante: Offensive Stalled§!"
 FRE_Operation_Cooldown_Atlante:0 "§ROperation Atlante: Concluded§!"
 FRE_Operation_Atlante_Result_Central_Success:0 "§GCEFEO breached the Interzone V base§!"
 FRE_Operation_Atlante_Result_Vietnamese_Foothold:0 "§GThe Vietnamese National Army secured a coastal foothold§!"
 FRE_Operation_Atlante_Result_Stalled:0 "§RThe central offensive stalled§!"
 FRE_Operation_Atlante_Result_Northern_Priority:0 "§YThe expeditionary reserve was sent north§!"
 FRE_Operation_Atlante_Result_Superseded:0 "Operation Atlante was §govertaken by the wider settlement§!"
 FRE_Atlante_Strategy_Central_Commitment:0 "§YThe expeditionary reserve is committed to central Vietnam§!"
 FRE_Atlante_Strategy_Vietnamese_Lead:0 "§YThe Vietnamese National Army leads Atlante§!"
 FRE_Atlante_Strategy_Northern_Priority:0 "§YTonkin has priority over Atlante§!"
 FRE_Atlante_Northern_Reserve_Available:0 "§GA northern reserve is assembling§!"
 FRE_Atlante_Northern_Reserve_Committed:0 "§GThe Atlante reserve reinforces Dien Bien Phu§!"

# === CEFEO (merged from FRE_CEFEO_l_english.yml) ===
##### CEFEO (FRE) rework: Metropole Patience, lifeline, battles, wind-down #####

#### National spirits ####
 FRE_Expeditionary_Command:0 "Expeditionary Command"
 FRE_Expeditionary_Command_desc:0 "The CEFEO is not a state. It is an army with a harbor, a headquarters and a budget line in Paris. It answers to the Rue Saint-Dominique, not to any electorate.\n\n§YMetropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_Under_Metropole_Command:0 "Under Metropole Command"
 FRE_Under_Metropole_Command_desc:0 "The corps commands the northern crown domains in its own name - the Tai Federation, the Muong, the Nung and the Tho all answer to Saigon rather than to the Rue Saint-Dominique. That is a convenience of administration, not a grant of independence.\n\nThe General commands in the field. The Assembly owns the war, decides what it costs, and can end it in an afternoon.\n\n§YMetropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_Metropole_Command:0 "Expeditionary Command"
 FRE_Indochina_War_Credits:0 "Indochina War Credits"
 FRE_Indochina_War_Credits_desc:0 "The Assembly votes the Indochina line separately from the defence budget, and it is voted every year. So long as it passes, the corps can staff itself, court the montagnards and buy its own war.\n\n§YWar Credits§!: §Y[?FRE.FRE_War_Credits|0]§!"
 FRE_Metropole_Subsidies_Full:0 "Metropole Subsidies (Full)"
 FRE_Metropole_Subsidies_Full_desc:0 "The National Assembly still votes the credits. The piastres flow, the convoys sail, and the war can be fought.\n\n§YMetropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_Metropole_Subsidies_Reduced:0 "Metropole Subsidies (Reduced)"
 FRE_Metropole_Subsidies_Reduced_desc:0 "The credits pass committee with amendments now. Every requisition is questioned; every loss is counted twice.\n\n§YMetropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_Metropole_Subsidies_Cut:0 "Metropole Subsidies (Cut)"
 FRE_Metropole_Subsidies_Cut_desc:0 "Paris has stopped paying for victory and started paying for an exit. The corps lives off its stockpiles.\n\n§YMetropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_Operation_Overextension:0 "Overextended Operation"
 FRE_Operation_Overextension_desc:0 "The columns are past their culminating point and everyone from the Etat-Major down knows it. The order to press on was given anyway."
 FRE_Highland_Overextension:0 "Highland Campaign Command"
 FRE_Highland_Overextension_desc:0 "The campaign is decided by its named operational objective rather than the surrender of a small territorial council. CEFEO and the crown domains remain in the field until that objective is resolved."
 FRE_Campaign_Overextension:0 "Overextended Counteroffensive"
 FRE_Campaign_Overextension_desc:0 "The pursuit has carried CEFEO beyond the defended highland position and into Viet Minh rear areas. Roads end, garrisons multiply, and every battalion sent forward leaves an exposed post behind.\n\nWithdraw from Viet Minh rear areas to remove this penalty."
 FRE_Command_Carpentier:0 "Carpentier's Command"
 FRE_Command_Carpentier_desc:0 "General Carpentier administers the war competently and without imagination. The initiative belongs to the enemy."
 FRE_Command_De_Lattre:0 "De Lattre's Command"
 FRE_Command_De_Lattre_desc:0 "Le Roi Jean has taken the theatre in hand. Evacuation plans are burned, dependents stay in Hanoi, and the corps remembers how to win."
 FRE_Command_Salan:0 "Salan's Command"
 FRE_Command_Salan_desc:0 "Salan the Mandarin knows Indochina better than any officer in the army, and trusts it less. A careful, cunning, unloved stewardship."
 FRE_Command_Navarre:0 "Navarre's Command"
 FRE_Command_Navarre_desc:0 "General Navarre arrived with a plan and a deadline. The corps will seek its decisive battle before Paris runs out of patience."

#### Shared tooltips ####
 FRE_Patience_Change_tt:0 "§YMetropole Patience§! [?fre_patience_delta|+0] (currently §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience])"
 FRE_Patience_Readout_tt:0 "§YMetropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_War_Credits_Change_tt:0 "§YWar Credits§! [?fre_credit_amount|+0] (now §Y[?FRE.FRE_War_Credits|0]§!)"
 FRE_War_Credits_Readout_tt:0 "§YWar Credits§!: §Y[?FRE.FRE_War_Credits|0]§!"
 FRE_Request_Extraordinary_Credits:0 "Request Extraordinary Credits"
 FRE_Request_Extraordinary_Credits_desc:0 "Send the Commissioner-General back to the Palais Bourbon out of season, hat in hand, to ask for a supplementary vote. The money will come. So will the questions."
 FRE_Request_Extraordinary_Credits_tt:0 "Gain §G80§! §YWar Credits§!, at the cost of §R6§! §YMetropole Patience§! and §R25§! political power in Paris"
 FRE_PATIENCE_BAND_FULL:0 "§GParis still votes the credits§!"
 FRE_PATIENCE_BAND_REDUCED:0 "§YParis is amending every requisition§!"
 FRE_PATIENCE_BAND_CUT:0 "§RParis is paying for an exit§!"
 FRE_PATIENCE_BAND_EXHAUSTED:0 "§RParis has written the corps off§!"
 FRE_VNA_Coordination_tt:0 "CEFEO missions gain a permanent §G+10%§! success chance from Vietnamese National Army coordination"
 FRE_GCMA_Network_Grows_tt:0 "The §YGCMA network§! grows by §G1§! level (each level: §G+3%§! mission success chance)"
 FRE_Appeal_To_Paris_Press_tt:0 "A sympathetic press campaign in Paris: §G60%§! chance to gain §G10§! Patience, §R40%§! chance to lose §R8§! Patience and embarrass the government"
 FRE_Legion_Reinforcements_tt:0 "A fresh §YForeign Legion§! formation lands at Haiphong"
 FRE_Dinassaut_Flotilla_tt:0 "The §YDinassaut river flotillas§! are commissioned: riverine operations no longer require a blue-water fleet"
 FRE_DBP_Vulture_Approved_tt:0 "American air power will weigh in over §YDien Bien Phu§!"
 FRE_De_Lattre_Leads_tt:0 "§YGeneral de Lattre de Tassigny§! takes command of the theatre (mission success §G+10%§!)"
 FRE_Salan_Leads_tt:0 "§YGeneral Salan§! assumes command (mission success §G+7%§!)"
 FRE_Navarre_Leads_tt:0 "§YGeneral Navarre§! assumes command (mission success §G+8%§!)"

#### Decision categories ####
 FRE_Metropole_Support_category:0 "The Metropole Lifeline"
 FRE_Metropole_Support_category_desc:0 "The CEFEO produces nothing: every rifle, every man and every piastre comes from France. Ask - politely, and not too often."
 FRE_Indochina_Allies_category:0 "Brothers in Arms"
 FRE_Indochina_Allies_category_desc:0 "Coordination with the State of Vietnam, the highland peoples, and are general allies in Indochina."

#### Metropole lifeline decisions ####
 FRE_Request_Equipment_Convoy:0 "Request an Equipment Convoy"
 FRE_Request_Equipment_Convoy_desc:0 "Cable Paris for a materiel convoy out of Marseille: small arms, ammunition and the thousand dull things an army eats."
 FRE_Request_Reinforcements:0 "Request Reinforcements"
 FRE_Request_Reinforcements_desc:0 "Ask the Metropole for drafts of men - and, if the Assembly can stomach it, another Legion formation."
 FRE_Request_Air_Assets:0 "Request Air Assets"
 FRE_Request_Air_Assets_desc:0 "This war runs on transport aircraft the way other wars run on rail. Ask for Dakotas, and more Dakotas."
 FRE_Request_Naval_Assets:0 "Request the Dinassaut Flotillas"
 FRE_Request_Naval_Assets_desc:0 "Armored barges, LCVPs and gunboats for the rivers of Tonkin and Cochinchina. The delta belongs to whoever owns the water."
 FRE_Request_Artillery_Park:0 "Request an Artillery Park"
 FRE_Request_Artillery_Park_desc:0 "Ask Paris for tubes. Every post the Viet Minh overrun is one that had no guns within range, and the corps has never had enough of them."
 FRE_Request_Antitank_Antiair:0 "Request Anti-Tank and Anti-Aircraft Guns"
 FRE_Request_Antitank_Antiair_desc:0 "Hanoi wants direct-fire guns for the blockhouses and light flak for the airfields. Giap has no tanks and no aircraft yet - but he has Chinese friends who do."
 FRE_Request_Fuel_Allocation:0 "Request a Fuel Allocation"
 FRE_Request_Fuel_Allocation_desc:0 "The Dakotas, the Dinassauts and the Groupements Mobiles all drink from the same tanks at Haiphong. Ask for a bigger share of the national allocation."
 FRE_Request_Treasury_Advance:0 "Request a Treasury Advance"
 FRE_Request_Treasury_Advance_desc:0 "Go to the Assembly for a supplementary cash vote out of turn. Piastres pay the auxiliaries, the porters and the informers, and none of them wait for the spring budget."
 FRE_Treasury_Advance_Fallback_tt:0 "No Metropole left to ask: the theatre treasury scrapes together what it can."
 FRE_Request_Administrative_Support:0 "Request Administrative Support"
 FRE_Request_Administrative_Support_desc:0 "Beg Paris for administrators, magistrates and paymasters. Wars are also run on paper."
 FRE_Appeal_To_Paris_Press:0 "Appeal to the Paris Press"
 FRE_Appeal_To_Paris_Press_desc:0 "Fly a handful of sympathetic editors out to Hanoi and show them the war we would like them to see. Risky - journalists have a way of finding the other one."
 FRE_Dissolve_The_CEFEO:0 "Dissolve the CEFEO"
 FRE_Dissolve_The_CEFEO_desc:0 "Strike the colors. Hand the theatre to the Vietnamese, embark the corps, and close the ledger on the French war in Indochina."

#### Allied coordination decisions ####
 FRE_Train_Vietnamese_National_Army:0 "Train the Vietnamese National Army"
 FRE_Train_Vietnamese_National_Army_desc:0 "Detach instructors and open the depots to Saigon's new battalions. Jaunissement in practice."
 FRE_GCMA_Recruit_TAM:0 "Raise Maquis in the Central Highlands"
 FRE_GCMA_Recruit_TAM_desc:0 "Extend the GCMA network among the montagnards of the Tay Nguyen."
 FRE_GCMA_Recruit_TAI:0 "Raise Maquis in the Tai Country"
 FRE_GCMA_Recruit_TAI_desc:0 "The Tai Federation's hill soldiers know every path around Dien Bien Phu. Arm them."
 FRE_GCMA_Recruit_NUN:0 "Raise Maquis Among the Nung"
 FRE_GCMA_Recruit_NUN_desc:0 "The Nung of the coastal highlands have fought beside France for a generation. Extend the network."
 FRE_GCMA_Recruit_THO:0 "Raise Maquis Among the Tho"
 FRE_GCMA_Recruit_THO_desc:0 "The Tho country sits astride the Viet Minh's supply corridors to China. Partisans there are worth battalions elsewhere."

#### De Lattre Line decisions ####
 FRE_Fortify_Delta_1:0 "Break Ground on the De Lattre Line"
 FRE_Fortify_Delta_1_desc:0 "Concrete blockhouses in a belt around Hanoi and the delta rice bowl. The Marshal wants twelve hundred of them."
 FRE_Fortify_Delta_2:0 "Extend the Line to the Coast"
 FRE_Fortify_Delta_2_desc:0 "Push the bunker belt to the sea at Haiphong so the corps' lifeline harbor sits behind concrete."
 FRE_Fortify_Delta_3:0 "Complete the De Lattre Line"
 FRE_Fortify_Delta_3_desc:0 "Close the last gaps. Behind this line the delta feeds and shelters the corps; in front of it, the enemy must pay to be seen."

 FRE_Geneva_Pursuit_tt:0 "Paris commits to a negotiated settlement. The §Yfighting must cool§! before anyone will sit down: the struggle de-escalates each month until it reaches §YLow Tension§!, and the conference convenes automatically once it does"

#### Operation commitment tooltips (FRE_Ops namespace) ####
 FRE_Ops_Commit_Light_tt:0 "§YLight commitment§! - costs §Y[?FRE.FRE_op_price_light|0]§! War Credits.\nOne groupement mobile carries the operation."
 FRE_Ops_Commit_Standard_tt:0 "§YStandard commitment§! - costs §Y[?FRE.FRE_op_price_standard|0]§! War Credits.\nA groupement mobile and a parachute groupement go in together."
 FRE_Ops_Commit_Maximum_tt:0 "§YMaximum commitment§! - costs §Y[?FRE.FRE_op_price_maximum|0]§! War Credits and §R8§! Metropole Patience.\nThree groupements, the Legion included, with equipment shipped to match."
 FRE_Ops_Commit_None_tt:0 "§RThe operation is cancelled.§! It counts as a failure, and the focus tree moves on."
 FRE_Ops_Spawn_GM_tt:0 "A §YGroupement Mobile§! takes the field."
 FRE_Ops_Spawn_Para_tt:0 "A §YGroupement Aeroporte§! drops in support of the operation."
 FRE_Ops_Spawn_Legion_tt:0 "A §YGroupement de Marche§! of the Legion joins, with §Y2000§! infantry weapons and §Y300§! guns shipped from France."

# === Dien Bien Response (merged from FRE_Dien_Bien_Response_l_english.yml) ===
 FRE_DBP_Standard_Hold_tt:0 "§YOutcome contract - standard hold§!\nCommit §Y2,500 Manpower§! and lose §R3 Metropole Patience§!. The Tai garrison receives a limited ammunition issue and a modest camp-defense bonus.\n\n§GIf the camp remains outside Viet Minh hands through campaign day 260§!: gain §G40 War Credits§!, §G3 Metropole Patience§!, and §G2% War Support§! in addition to the campaign result.\n\n§RIf the camp falls§!: lose a further §R3,000 Manpower§! and §R3% War Support§! in addition to the campaign result."
 FRE_DBP_Maximum_Reinforcement_tt:0 "§YOutcome contract - maximum reinforcement§!\nSpend §Y100 War Credits§!, commit §Y6,000 Manpower§!, and lose §R8 Metropole Patience§!. The expeditionary reserve reinforces the Tai garrison, strengthens the camp, and delays fort degradation by §G14 days of active siege§!. The day-150 and day-260 campaign deadlines do not move.\n\n§GIf the camp remains outside Viet Minh hands through day 260§!: gain §G100 War Credits§!, §G8 Metropole Patience§!, §G2,000 Manpower§!, and §G4% War Support§!, with an additional struggle swing toward France.\n\n§RIf the camp falls§!: lose a further §R7,000 Manpower§!, §R2,000 Infantry Equipment§!, §R250 Support Equipment§!, §R125 Artillery Equipment§!, §R10 Metropole Patience§!, and §R5% War Support§!."
 FRE_DBP_Condor_tt:0 "§YOutcome contract - Operation Condor§!\nSpend §Y70 War Credits§!, commit §Y3,500 Manpower§!, and lose §R5 Metropole Patience§!. After the Viet Minh invest the valley, French-aligned forces must regain and hold the camp, one northern or eastern approach, and one outer-ring position for §Y7 consecutive days§!. Opening that corridor relieves §G14 invested-siege days§! and preserves part of the garrison.\n\n§GIf the corridor is opened and the camp then survives through day 260§!: gain §G80 War Credits§!, §G6 Metropole Patience§!, §G2,500 Manpower§!, and §G3% War Support§!, with a modest struggle swing toward France.\n\n§RIf the camp falls before the corridor opens§!: lose a further §R5,000 Manpower§!, §R5 Metropole Patience§!, and §R4% War Support§!. A corridor opened before the final fall reduces that additional loss."
 FRE_DBP_Vulture_Request_tt:0 "§YOutcome contract - request Operation Vulture§!\nSpend §Y40 War Credits§! and lose §R4 Metropole Patience§! while Washington decides. Approval supplies the garrison, adds American air support over the valley, and relieves §G10 days of active siege§!; refusal grants no battlefield aid. A later American decision may still turn limited support into direct intervention.\n\n§GIf American support arrives and the camp survives through day 260§!: gain §G75 War Credits§!, §G5 Metropole Patience§!, and §G3% War Support§!, with a pro-French struggle award.\n\n§RIf the camp falls§!: lose a further §R4,000 Manpower§!, §R6 Metropole Patience§!, and §R4% War Support§! in addition to the diplomatic escalation already incurred."

 FRE_DBP_Standard_Holdout:0 "Scheduled Airlift at Dien Bien Phu"
 FRE_DBP_Standard_Holdout_desc:0 "The camp is holding to its planned establishment, depending on the regular airbridge and the garrison already in the valley."
 FRE_DBP_Maximum_Holdout:0 "Maximum Reinforcement of Dien Bien Phu"
 FRE_DBP_Maximum_Holdout_desc:0 "The expeditionary reserve and the transport fleet have been committed to the valley, strengthening the works while consuming men, aircraft, and political patience."
 FRE_DBP_Condor_Staging:0 "Operation Condor"
 FRE_DBP_Condor_Staging_desc:0 "Relief columns are assembling to reopen the highland approaches after the Viet Minh close their ring around the camp."
 FRE_DBP_Vulture_Air_Support:0 "Operation Vulture Air Support"
 FRE_DBP_Vulture_Air_Support_desc:0 "American aircraft are striking the siege lines and supplementing the airbridge. Their intervention buys time without guaranteeing the camp's survival."

# === Hoa Binh Response (merged from FRE_Hoa_Binh_Response_l_english.yml) ===
 FRE_Hoa_Binh_Amarante_tt:0 "§YOutcome contract - withdraw and preserve the field force§!\nSpend §Y30 War Credits§! and commit §Y1,500 Manpower§! to prepare the withdrawal.\n\nIf CEFEO still controls §YHoa Binh§! at the beginning of campaign day §Y105§!, Operation Amarante deliberately concedes the §YHoa Binh campaign objective§!. This ends the Hoa Binh campaign, §Ynot the wider Indochina War§!. The mobile groups return to the Delta: recover §G1,500 Manpower§!, §G2,000 Infantry Equipment§!, §G250 Support Equipment§!, and §G100 Artillery Equipment§!; gain §G75 War Credits§!; avoid the clean-result loss of §R12 Metropole Patience§!; de-escalate the struggle by §G25§!; and gain §G+10§! preparation value at Na San.\n\nThe Viet Minh still receive their clean Hoa Binh battlefield and struggle result. If Hoa Binh falls before day §Y105§!, the withdrawal fails and none of these preservation benefits are received."
 FRE_Hoa_Binh_Hold_tt:0 "§YOutcome contract - retain the objective and risk the field force§!\nSpend §Y80 War Credits§! and commit §Y4,000 Manpower§! now. CEFEO and Muong defenders fortify §YHoa Binh§! until the campaign ends. There is no automatic withdrawal.\n\n§GIf Hoa Binh remains in French-aligned hands through day 210§!: the Viet Minh offensive fails. In addition to the normal campaign reward, gain §G100 War Credits§!, §G10 Metropole Patience§!, and §G3% War Support§!; subtract §G25§! from the communist struggle score and add §G25§! to the pro-French score.\n\n§RIf Hoa Binh falls§!: in addition to the normal campaign loss, lose §R3,000 Manpower§!, §R1,500 Infantry Equipment§!, §R150 Support Equipment§!, §R75 Artillery Equipment§!, §R75 War Credits§!, §R8 Metropole Patience§!, and §R4% War Support§!; the struggle escalates by §R50§!, the communist score gains §R25§!, and the pro-French score loses §R25§!."

 FRE_Hoa_Binh_Salient:0 "The Hoa Binh Salient"
 FRE_Hoa_Binh_Salient_desc:0 "Airborne and river columns established the salient, but Route 6 and the Black River now carry every shell and ration through country under attack. The position offers a modest defensive advantage at a growing logistical cost."
 FRE_Hoa_Binh_Holdout:0 "Hoa Binh Holdout"
 FRE_Hoa_Binh_Holdout_desc:0 "Salan has rejected a planned withdrawal and committed the reserves to Hoa Binh. The salient has more guns, ammunition, and infantry, but the exposed supply line consumes them almost as quickly as they arrive."

 FRE_Hoa_Binh_Mobile_Groups_Preserved:0 "The mobile groups escaped Hoa Binh and will improve §YNa San§! preparation by §G10§!"

# === Northwest Response (merged from FRE_Northwest_Response_l_english.yml) ===
 FRE_Lorraine_Deep_Thrust_tt:0 "Spend §Y100 War Credits§! and §R8 Metropole Patience§!. The thrust disrupts the Viet Minh's campaign supply and consumes §Y14 days§! of its campaign clock. Hold any province in §YDong Bac Bo§! for seven days to raid the rear depots. The columns suffer additional supply strain until the Northwest Campaign ends."
 FRE_Lorraine_Limited_Raid_tt:0 "Spend §Y60 War Credits§!. A short raid destroys some Viet Minh campaign supply and consumes §Y7 days§! of the Northwest Campaign clock, then withdraws without a deep territorial objective."
 FRE_Lorraine_Withhold_tt:0 "Spend §Y30 War Credits§! on highland supply and keep the mobile groups concentrated around §YNa San§!. French and Tai forces receive a defensive spirit until the Northwest Campaign ends."
 FRE_Lorraine_No_Reserve_tt:0 "The corps lacks the credits to assemble Lorraine or reinforce Na San. The mobile groups remain in reserve without an additional defensive benefit."
 FRE_Lorraine_Planned_tt:0 "The Lorraine contingency remains on the staff map. Salan will present it automatically if the Viet Minh launches the Northwest Campaign later."

 FRE_Lorraine_Deep_Columns:0 "Lorraine's Extended Columns"
 FRE_Lorraine_Deep_Columns_desc:0 "The mobile groups have driven beyond the delta along a single lengthening road. Armor and transport give the column reach, but fuel, bridges, and the return march now govern everything it can do."
 FRE_Northwest_Concentrated_Defence:0 "Mobile Groups Held at Na San"
 FRE_Northwest_Concentrated_Defence_desc:0 "The formations assigned to Lorraine have been retained around the highland airheads, strengthening the defensive system at the price of leaving the Viet Minh rear depots untouched."
 VIN_Lorraine_Depots_Disrupted:0 "Lorraine in the Rear Areas"
 VIN_Lorraine_Depots_Disrupted_desc:0 "French mobile groups and paratroopers are operating against the depots behind the Northwest offensive. Stores are being dispersed, routes rerouted, and formations delayed to secure the base area."

 FRE_Lorraine_Response_Unlocked:0 "The §YOperation Lorraine§! response plan is ready"
 FRE_Lorraine_Response_Active:0 "§YOperation Lorraine§! is supporting the Northwest Campaign"
 FRE_Lorraine_Response_Deep:0 "Lorraine has become a §Rdeep Clear River thrust§!"
 FRE_Lorraine_Response_Limited:0 "Lorraine is a §Ylimited depot raid§!"
 FRE_Lorraine_Response_Withheld:0 "Lorraine's mobile groups were §Gheld for Na San§!"
 FRE_Lorraine_Objective_Achieved:0 "The §YClear River rear depots§! were held long enough to raid"
 FRE_Lorraine_Result_Success:0 "§GOperation Lorraine achieved a strategic success§!"
 FRE_Lorraine_Result_Limited:0 "§YOperation Lorraine achieved only a tactical raid§!"
 FRE_Lorraine_Result_Failure:0 "§ROperation Lorraine failed to alter the Northwest Campaign§!"
 FRE_Lorraine_Result_Withheld:0 "§YThe Lorraine formations were withheld for Na San§!"
 FRE_Lorraine_Result_Superseded:0 "Operation Lorraine was §govertaken by the end of the fighting§!"

