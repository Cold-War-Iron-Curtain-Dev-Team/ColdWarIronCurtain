 FRE_Ateliers_de_Gia_Lam_MIO_desc:0 "Built by the Chemins de fer de l'Indochine on the left bank of the Red River, the Gia-Lam workshops were the largest railway shops in Tonkin. During the war they rebuilt locomotives, fitted out armoured trains and patched up the CEFEO's worn tanks and half-tracks with whatever steel the port of Haiphong could deliver."
 FRE_Ateliers_de_Gia_Lam_desc:0 "$FRE_Ateliers_de_Gia_Lam_MIO_desc$"
 FRE_Usine_d_Aviation_de_Tong_MIO_desc:0 "Founded in the 1930s near Son Tay, the Tong aircraft works was French Indochina's only real aviation factory. It assembled and licence-built light aircraft for the colonial air arm, and its trained mechanics and machine tools later served the air war over Tonkin."
 FRE_Usine_d_Aviation_de_Tong_desc:0 "$FRE_Usine_d_Aviation_de_Tong_MIO_desc$"
 FRE_Service_du_Materiel_Gia_Lam_MIO_desc:0 "At Gia-Lam airfield outside Hanoi, the Armee de l'Air materiel service kept a mixed fleet of Spitfires, Hellcats, Bearcats and Dakotas flying in heat, monsoon rain and chronic spare-parts shortages. Its depots turned cannibalised airframes back into serviceable aircraft for the battles of the delta and the highlands."
 FRE_Service_du_Materiel_Gia_Lam_desc:0 "$FRE_Service_du_Materiel_Gia_Lam_MIO_desc$"
 FRE_Pyrotechnie_d_Extreme_Orient_MIO_desc:0 "The Societe de Pyrotechnie d'Extreme-Orient filled shells, made demolition charges and stored explosives in the theatre, sparing the expeditionary corps some of the long sea voyage from France. Its output fed the artillery that defended the posts of the De Lattre Line."
 FRE_Pyrotechnie_d_Extreme_Orient_desc:0 "$FRE_Pyrotechnie_d_Extreme_Orient_MIO_desc$"
 FRE_CEFEO_Service_des_Transmissions_MIO_desc:0 "The CEFEO signals service strung telephone lines between hundreds of isolated posts and ran the radio nets that linked them to Hanoi and Saigon. In a war of ambushes and cut roads, a working radio was often the only thing that could bring artillery, aircraft or relief to a besieged garrison."
 FRE_CEFEO_Service_des_Transmissions_desc:0 "$FRE_CEFEO_Service_des_Transmissions_MIO_desc$"
 FRE_Direction_du_Materiel_BOT_MIO_desc:0 "The materiel directorate of the Base Operationnelle du Tonkin received, repaired and issued the weapons and equipment of the northern army. Rifles, machine guns, mortars and vehicles from France, Britain and the United States all passed through its workshops, so it learned to keep a very mixed arsenal in service."
 FRE_Direction_du_Materiel_BOT_desc:0 "$FRE_Direction_du_Materiel_BOT_MIO_desc$"
 FRE_SFCT_Hon_Gai_Cam_Pha_MIO_desc:0 "The Societe Francaise des Charbonnages du Tonkin mined the anthracite of Quang Yen and shipped it from its own ports at Hon-Gai and Cam-Pha. Its quays, colliers and workshops made it the main industrial presence on the Bay of Along and a vital source of fuel for shipping in the Far East."
 FRE_SFCT_Hon_Gai_Cam_Pha_desc:0 "$FRE_SFCT_Hon_Gai_Cam_Pha_MIO_desc$"
 FRE_Base_Amphibie_de_Haiphong_MIO_desc:0 "Haiphong's amphibious base was home to the navy's river flotillas and the Dinassaut river assault divisions. Its yards armoured landing craft, converted them into gunboats and command boats, and kept them fit for the rivers and canals of the Red River delta."
 FRE_Base_Amphibie_de_Haiphong_desc:0 "$FRE_Base_Amphibie_de_Haiphong_MIO_desc$"
 FRE_CARIC_SACM_Haiphong_MIO_desc:0 "The Haiphong yard of the CARIC and SACM engineering group repaired and refitted merchant ships and naval vessels in northern Indochina. Without it, the Far East naval forces would have had to send damaged ships thousands of miles to Saigon, Singapore or France for anything beyond minor repairs."
 FRE_CARIC_SACM_Haiphong_desc:0 "$FRE_CARIC_SACM_Haiphong_MIO_desc$"
