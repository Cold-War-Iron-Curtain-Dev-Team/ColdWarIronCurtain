 FRE_Indochina_Economy_category:0 "The Indochinese Economy"
 FRE_Indochina_Economy_category_desc:0 "The corps shares roads, labor, and supplies with the people whose territory it holds. Allocate money to provincial works, negotiate metropolitan shipments, and decide how much civilian capacity the war can afford to leave alone."
 FRE_ECO_Build_River_Levees:0 "Build River Levees"
 FRE_ECO_Build_River_Levees_desc:0 "Spend $50M on embankment works in the selected owned state. After 90 days, the completed levees add one level of water infrastructure."
 FRE_ECO_Request_Metropole_Steel:0 "Request Steel from France"
 FRE_ECO_Request_Metropole_Steel_desc:0 "Secure a French steel allocation providing 12 steel in the Hanoi region for 180 days. The request costs 50 political power and 2 Metropole Patience."
 FRE_ECO_Request_Metropole_Oil:0 "Request Oil from France"
 FRE_ECO_Request_Metropole_Oil_desc:0 "Arrange a French oil shipment providing 10 oil in the Hanoi region for 180 days. The request costs 50 political power and 2 Metropole Patience."
 FRE_ECO_Request_Metropole_Rubber:0 "Request Rubber from France"
 FRE_ECO_Request_Metropole_Rubber_desc:0 "Obtain a metropolitan allocation providing 8 rubber in the Hanoi region for 180 days. The request costs 50 political power and 2 Metropole Patience."
 FRE_ECO_Convert_Civilian_Factory:0 "Convert a Civilian Factory"
 FRE_ECO_Convert_Civilian_Factory_desc:0 "Spend 25 political power to remove one civilian factory from the selected owned state and prepare its premises for military orders. One military factory becomes available there after 30 days."
 FRE_ECO_Invest_In_Ethnostate:0 "Fund Territorial Development"
 FRE_ECO_Invest_In_Ethnostate_desc:0 "Invest $100M in the selected friendly Tai, Muong, Tho, Montagnard, or Nung territory. Its capital gains one level of infrastructure, one building slot, and one civilian factory; its government gains a more favorable opinion of us."
 FRE_ECO_Invest_In_VIE:0 "Invest in the State of Vietnam"
 FRE_ECO_Invest_In_VIE_desc:0 "Invest $200M in a core state owned and controlled by the State of Vietnam, favoring the Saigon area where available. The selected state gains one building slot and one civilian factory, improving Saigon's opinion of us."
