VIN_Chinese_PRC_Victory_tt: "The Chinese Communist Party has taken over the Mainland"
VIN_Chinese_ROC_Victory_tt: "The Kuomintang has taken over the Mainland"

VIN_Destalinization: "De-Stalinization"

VIN_Budapest_Model_tt: "We have decided to go for the Budapest Model of liberalization."
VIN_HCM_Model_tt: "We have decided to trust Uncle Ho in his ideas of reforms."

VIN_DESC_UI_To_Huu: "Poet and senior Party cultural official, To Huu sets the ideological line for art and literature in the DRV. He frames dissent as political sabotage and pushes organized self-criticism to enforce discipline."

VIN_DESC_UI_Xuan_Dieu: "A celebrated poet turned Party loyalist, Xuan Dieu defends socialist realism as the only legitimate literary path. He lends prestige to denunciations and helps isolate wavering writers through public criticism."

VIN_DESC_UI_Huy_Can: "An established revolutionary poet and cultural figure, Huy Cận supports the Party's demand for ideological unity in the arts. He reinforces the official line with authority and caution rather than spectacle."

VIN_DESC_UI_Che_Lan_Vien: "A sharp and adaptable polemicist, Che Lan Vien uses literary criticism to turn arguments into political verdicts. He targets ambiguity, irony, and experimentation as signs of ideological drift."

VIN_DESC_UI_Hoang_Trung_Thong: "A Party-aligned poet and organizer, Hoang Trung Thong helps coordinate campaigns that translate directives into concrete pressure. He excels at mobilizing meetings, statements, and staged consensus."

VIN_DESC_UI_Nguyen_Dinh_Thi: "A prominent writer and cultural official, Nguyen Dinh Thi defends the revolution's narrative and attacks 'decadent' trends in print. He provides disciplined messaging that reaches beyond internal meetings into public culture."

VIN_DESC_UI_Nguyen_Toan: "A loyal cadre figure used as a vanguard voice, Nguyen Toan advances the campaign through blunt slogans and public alignment. He is expendable, replaceable, and effective at amplifying pressure at the street level."

VIN_DESC_UI_Nguyen_Huu_Dang: "A veteran revolutionary and organizer, Nguyen Huu Dang insists that cultural life must not be reduced to obedience. He champions open debate and dignity for writers even as the political climate hardens."

VIN_DESC_UI_Van_Cao: "A famed composer and artist, Van Cao carries immense cultural prestige even under suspicion. He is associated with independent artistic vision and resists being confined to propaganda alone."

VIN_DESC_UI_Tran_Dan: "A daring poet and intellectual, Tran Dan pushes formal experimentation and questions rigid cultural control. He refuses easy recantations and becomes emblematic of the movement's defiance."

VIN_DESC_UI_Phan_Khoi: "An elder scholar and critic, Phan Khoi argues for intellectual honesty and the right to criticize mistakes. He uses careful language and reputation to challenge the narrowing boundaries of expression."

VIN_DESC_UI_Le_Dat: "A gifted poet and editor, Le Dat helps drive the Nhan-van current through sharp critique and disciplined writing. He tests limits through essays and wordplay that expose contradictions in official rhetoric."

VIN_DESC_UI_Hoang_Cam: "A poet known for powerful imagery, Hoang Cam represents the cultural reach of the dissident circle. He spreads influence through works that resonate beyond formal politics."

VIN_DESC_UI_Thuy_An: "A writer and journalist, Thuy An participates in the reformist literary network and refuses silent compliance. She is portrayed as a disruptive example meant to warn others."

