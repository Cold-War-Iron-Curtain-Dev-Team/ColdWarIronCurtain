l_english:
 VIN_Chinese_Patronage:0 "Chinese Military Advisory Group"
 VIN_Chinese_Patronage_desc:0 "Beijing offers advisers under Wei Guoqing and Chen Geng, rifles, and an open supply road. The Viet Minh take the larger and steadier flow of aid, and the Chinese delegation will press for a settlement at Geneva. Soviet patronage can no longer be chosen once Chinese aid is accepted."
 VIN_Chinese_Patronage_tt:0 "Every campaign starts with §G+15§! Campaign Supply.\nRifles and support equipment arrive from China every month.\nSmall Chinese pressure at Geneva: §G+25§! communist leverage.\n§RExcludes Soviet Patronage§!"
 VIN_Soviet_Patronage:0 "Soviet Military Mission"
 VIN_Soviet_Patronage_desc:0 "Moscow sends artillery and anti-aircraft specialists in place of the Chinese advisers. The supply flow is smaller, but the guns are better and the Soviet co-chair gives the Viet Minh weight at Geneva. Chinese patronage can no longer be chosen once the Soviet mission is accepted."
 VIN_Soviet_Patronage_tt:0 "Every campaign starts with §G+5§! Campaign Supply.\nArtillery and anti-aircraft guns arrive from the Soviet Union every month, with better quality.\n§G+100§! political power, a doctrine research bonus and an artillery research bonus.\nSoviet weight at Geneva: §G+40§! communist leverage.\n§RExcludes Chinese Patronage§!"
 VIN_Chinese_Advisory_Group:0 "Chinese Military Advisory Group"
 VIN_Chinese_Advisory_Group_desc:0 "Chinese advisers train and supply the Viet Minh army."
 VIN_Soviet_Military_Mission:0 "Soviet Military Mission"
 VIN_Soviet_Military_Mission_desc:0 "Soviet specialists supply modern artillery and anti-aircraft guns."
 VIN_Patronage_Chinese:0 "§YThe Viet Minh accepted Chinese patronage§!"
 VIN_Patronage_Soviet:0 "§YThe Viet Minh accepted Soviet patronage§!"
