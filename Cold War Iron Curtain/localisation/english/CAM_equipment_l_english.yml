 CAM_infantry_equipment_0:0 "Fusil semi-automatique 7 mm 5 M. 49"
 CAM_infantry_equipment_0_short:0 "MAS-49"
 CAM_infantry_equipment_0_desc:0 "The MAS-49 was a French semi-automatic battle rifle chambered in 7.5×54mm French. Issued widely to FARK during the 1950s, it featured a reliable direct impingement gas system and fixed 10-round magazine. Rugged and accurate, the MAS-49 served as the standard rifle for the French-trained Cambodian forces before U.S. aid replaced it with newer models. Its simple design made it easy to maintain in tropical conditions."
 
 CAM_infantry_equipment_1:0 "Carbine, Caliber .30, M1"
 CAM_infantry_equipment_1_short:0 "M1 Carbine"
 CAM_infantry_equipment_1_desc:0 "The M1 Carbine was a lightweight semi-automatic rifle chambered in .30 Carbine, originally developed by the U.S. during World War II. Compact and easy to handle, it became popular with FARK and later FANK troops, especially in rear-line or support units. While less powerful than a full rifle, its low recoil and ease of use made it well-suited for jungle patrols and mobile engagements."

 CAM_infantry_equipment_2:0 "Rifle, Caliber 5.56 mm, M16"
 CAM_infantry_equipment_2_short:0 "M16 Rifle"
 CAM_infantry_equipment_2_desc:0 "The original M16 was a U.S.-made, 5.56×45mm NATO, lightweight, selective-fire rifle introduced to FANK in the late 1960s through American military aid. Initially plagued by reliability issues, early M16s still offered superior accuracy and portability compared to older battle rifles. Its 20-round magazine and modular design made it ideal for the fast-paced combat environment of Cambodia's civil war."

 CAM_infantry_equipment_3:0 "Rifle, 5.56mm, M16A1"
 CAM_infantry_equipment_3_short:0 "M16A1 Rifle"
 CAM_infantry_equipment_3_desc:0 "The M16A1 was an improved version of the M16, featuring a chrome-lined barrel and forward assist to address earlier reliability concerns. It became the primary rifle of FANK infantry units during the early 1970s. Light, accurate, and fast-firing, it offered significant advantages in jungle skirmishes, particularly with its compatibility with modern U.S. tactics and equipment."

 CAM_infantry_equipment_4:0 "Rifle, 5.56 mm, M16A2"
 CAM_infantry_equipment_4_short:0 "M16A2 Rifle"
 CAM_infantry_equipment_4_desc:0 "he M16A2 was a further evolution of the M16 platform, introduced too late to see extensive FANK use before the fall of Phnom Penh in 1975. Chambered in 5.56mm NATO with a heavier barrel, improved sights, and a 3-round burst setting, it represented the modernization of Western infantry weapons. Limited numbers may have been used by elite units or seen postwar use with Khmer Republic exile groups or early Vietnamese-aligned forces."

