l_english: 

 GDR_Prime_Minister_Nuschke: "Prime Minister Nuschke"
 GDR_Prime_Minister_Nuschke_desc: "Otto Nuschke has managed to wrestle leadership of the GDR from Walter Ulbricht; it is time to formally recognize him as our new Prime Minister."
 GDR_Announce_Rollback_of_Recent_Economic_Changes: "Rollback Recent Economic Changes"
 GDR_Announce_Rollback_of_Recent_Economic_Changes_desc: "The recent economic reforms passed by the previous administration must be undone before they inflict irreparable damage to the Republic."
 GDR_An_End_to_the_Bloc: "An End to the Bloc"
 GDR_An_End_to_the_Bloc_desc: "The Democratic Bloc has served its purpose, it is time for it to be replaced with a more effective alliance of parties to help us manage the state apparatus."
 GDR_Halt_Agricultural_Collectivization_Efforts: "Halt Agricultural Collectivization Efforts"
 GDR_Halt_Agricultural_Collectivization_Efforts_desc: "We've seen the catastrophic results that agricultural collectivization has had, we will not be another statistic!"
 GDR_Reform_the_Church_Ministry: "Reform the Church Ministry"
 GDR_Reform_the_Church_Ministry_desc: "Religion and socialism have a very tense relationship. Regardless, if we can find a way to coexist, it would greatly benefit the people."
 GDR_Investigate_Stasi_Overreach: "Investigate Stasi Overreach"
 GDR_Investigate_Stasi_Overreach_desc: "The disturbing rumors are getting too loud and numerous to ignore, it is time to launch a formal investigation into the Stasi's dealings."
 GDR_Relieve_Hilde_Benjamin: "Relieve Hilde Benjamin"
 GDR_Relieve_Hilde_Benjamin_desc: "Hilde Benjamin's overzealous methods can no longer be tolerated. Her tenure as Minister of Justice must come to an end."
 GDR_Dealing_with_the_Soviets: "Dealing with the Soviets"
 GDR_Dealing_with_the_Soviets_desc: "A change in leadership always makes Moscow nervous, we'd better organize an official communique to assure them that all is well in the GDR."
 GDR_Delegate_the_Foriegn_Ministry_to_SED: "Delegate the Foriegn Ministry to the SED"
 GDR_Delegate_the_Foriegn_Ministry_to_SED_desc: "The SED still has a purpose to serve as the representatives of the GDR on the world stage. This should keep them satisfied with our rule for the time being."
 GDR_Centralize_State_Power: "Centralize State Power"
 GDR_Centralize_State_Power_desc: "In order to avoid regionalism and potential political crises, the authority of the state must be firmly centralized in Berlin."
 GDR_Establish_New_Regional_Goverments: "Establish New Regional Goverments"
 GDR_Establish_New_Regional_Goverments_desc: "The old Imperial and Nazi methods of regional government were ineffective and practically held the entire country hostage to the whims of Prussia. A new, more balanced system is required."
 GDR_Reform_the_Judiciary: "Reform the Judiciary"
 GDR_Reform_the_Judiciary_desc: "The courts are stuffed with judges who are good for show trials, but inefficient for the normal functions of the judiciary. It is time for a major overhaul."
 GDR_Announce_Elections_for_1955: "Announce Elections for 1955"
 GDR_Announce_Elections_for_1955_desc: "Now that our reforms are complete, we are confident that an election would bring legitimacy to our government and the GDR."
