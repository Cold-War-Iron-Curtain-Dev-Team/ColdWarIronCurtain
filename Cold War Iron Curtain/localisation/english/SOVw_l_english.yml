the_last_war: "The Last War"
the_last_war_desc: "\n\n\n\n\n\n£sacred_war\n\n\n\n\n\n\n\nWe shall fight back against the stranglers\nOf all murderous idea,\nThe rapists and the robbers,\nThe killers of people!\n\n§RLet our noble wrath\nBoil over like a wave!\nThis is the people's war,\nA Sacred War!§!"
