#National Spirit
great_liberation_war: "The Great Liberation War"
great_liberation_war_desc: "The time is now! The West, led by the imperialist United States, has dared to attack our sacred homeland, plunging the world into the fires of war once again. But let them remember—just as we crushed the invaders during the Great Patriotic War, we will crush them now. This is not merely a battle of nations; it is a battle of ideologies, a fight for justice, equality, and the survival of socialism itself. \nThe Soviet Union stands united and unyielding. Our people, forged in the fires of history, will not falter. Our military, unmatched in strength and resolve, will break the enemy's will to fight. Let the world witness the unshakable might of the Union and the indomitable spirit of its people. \nVictory will be ours, not just for the Soviet Union, but for all oppressed peoples who yearn for liberation. We shall triumph, we shall endure, and the forces of imperialism will crumble beneath the weight of their arrogance. \n§RThe Soviet Union will emerge victorious, and history will once again honor our strength and resolve!§!"
great_liberation_war_2: "The Great Liberation War"
