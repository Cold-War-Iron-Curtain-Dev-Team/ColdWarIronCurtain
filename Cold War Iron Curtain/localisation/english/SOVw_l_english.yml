 #Desc
 SOVw_The_Great_Liberation_War_desc:0 "Comrade! The hour of reckoning is upon us! The imperialist capitalist forces of the West have dared to strike at our sacred motherland, but fear not! Under the banner of the Communist Party, we stand united, resolute in our determination to repel the invaders and crush their vile aggression. With every breath, with every drop of sweat and blood, we shall push them back, for their land shall be our battleground, and their blood will stain the earth in the struggle for justice! Forward, comrades! Victory is ours, for the revolution is unstoppable!"