 #Desc - Europe Tree
 SOVw_The_Great_Liberation_War_desc: "Comrade! The hour of reckoning is upon us! The imperialist capitalist forces of the West have dared to strike at our sacred motherland, but fear not! Under the banner of the Communist Party, we stand united, resolute in our determination to repel the invaders and crush their vile aggression. With every breath, with every drop of sweat and blood, we shall push them back, for their land shall be our battleground, and their blood will stain the earth in the struggle for justice! Forward, comrades! §RVictory is ours, for the revolution is unstoppable!§!"
 SOVw_Round_up_the_Armed_Forces_desc: "The call to arms has sounded across the land! The Soviet Armed Forces are mobilized, ready to defend the honor and sovereignty of our great Union. The motherland summons her sons and daughters to rise, to fight with unyielding courage and unwavering resolve. With the strength of our steel and the will of the people, we shall stand shoulder to shoulder against any force that dares threaten our land. The revolution is our shield, the red flag our banner, and our hearts, filled with the fire of socialism, shall guide us to victory. Every soldier, every worker, every comrade—today, we march together as one!"
 SOVw_One_Last_Push_for_Victory_desc: "With the strength of our comrades, and the power of our socialist ideals, we will push forward relentlessly. Every inch of our land, every city, every village, every field will be reclaimed and liberated from the grasp of our enemies. Our tanks will roll like thunder, our infantry will advance like an unstoppable wave, and our artillery will rain down upon the invaders without mercy. We fight not just for our borders, but for the future of the revolution. For every worker, every farmer, every child who dreams of a world free from oppression."
 SOVw_Rally_the_Workers_of_the_Unions_desc: "In the face of hardship, in the heart of struggle, the workers of the Soviet Union stand unyielding! It is not just our armies, but the strength of the people—the workers, the farmers, the builders—who form the true backbone of our great socialist state. In every factory, every workshop, every field, finishing our labor with unwavering resolve, forging the future with our hands and our sweat. When the winds of adversity blow, when the enemies of progress seek to tear us down, we stand firm, unbowed and unbroken. We know that the revolution is not won by the sword alone, but by the tireless effort of those who shape the land, create the wealth, and build the dream. Through our dedication, we rise above the challenges, and together, we will ensure that no obstacle, no enemy, can break our will."
 SOVw_In_the_Defense_of_the_Union_desc: "Our Union stands at a pivotal moment, stepping into a new chapter of our history as we are called to arms for the first time since the Great Patriotic War. This is not just a fight; it is a noble cause—a war for the liberation of the peoples of Europe. The cries of the oppressed resonate across the continent, and it is our duty, our mission, to answer that call.\n\nIn response to this momentous challenge, we must embark on a decisive course of action. We shall forge a path to victory—one that envelops not only our soldiers but also the very spirit of the proletariat. General Secretary [SOV.GetLeader] has emphatically declared that the triumph of Communism is not merely an aspiration but an unwavering commitment."
