#Events - Europe 

#Events - Country Events
SOVw_Third_World_War.1.d: "Millions today have been called in the defense of the Soviet Union, standing as the vanguard of the oppressed peoples, takes up arms against the decaying imperialist order. In a historic address to the Supreme Soviet this morning, Comrade [SOV.GetLeader] declared that the time has come to liberate the working masses from the shackles of Western exploitation, marking the official beginning of what shall be known as the Great Liberation War.\n\nAt dawn, Soviet forces launched preemptive defensive operations against NATO’s growing militarization on our borders. For years, the capitalist powers have encircled the Soviet motherland, amassing troops and weapons in an aggressive attempt to strangle socialism. The workers and peasants of the USSR, united as one, have refused to bow before the threats of the West. Today, under the banner of Lenin and the immortal ideals of Marxism-Leninism, the Soviet people have taken the necessary steps to secure peace through strength."
SOVw_Third_World_War.2.d: "As the Great Liberation War unfolds, the Soviet workers once again proves to be the unwavering foundation upon which victory will be built. From the steel forges of Magnitogorsk to the textile mills of Ivanovo, the factories and collective farms of the Union are ablaze with tireless labor, driven by the unbreakable will of the people.\n\nUnder the guidance of the Party, industrial output has surged to historic levels. In the great tractor plants of Chelyabinsk, workers labor around the clock, transforming machines of peace into engines of liberation. In Leningrad and Kharkov, the proletariat answers the call of duty, assembling tanks, aircraft, and rifles with unmatched precision. Not a single second is wasted—every bolt tightened, every grain harvested, every railway laid is a hammer blow against the forces of imperialism.\n\nThe spirit of Stakhanov lives on in every factory and kolkhoz. Miners in the Donbass have exceeded their quotas, extracting the coal and iron needed to fuel our glorious struggle. The women of the Soviet Union, standing shoulder to shoulder with their comrades, take their rightful place in the workforce, ensuring that production never falters. In the Siberian rail yards, the lifeblood of war—supplies, food, and arms—flows ceaselessly to the front, keeping our brave Soviet Army supplied and unstoppable."
SOVw_Third_World_War.3.d: "The Earth shakes as the decisive battle for the Soviet motherland commences. Imperialist armies, propelled by desperation, collide against the indomitable spirit of socialism. From the west, NATO has crossed the border of our Soviet Union.\n\nBut the Soviet people will not be subdued. They have endured trials before, and they stand unbroken. The Red Army, with banners flying defiantly, is poised to defend Moscow, channeling the valor of those who faced Napoleon and Hitler.\n\nIn the factories of the Urals, workers push forward tirelessly, crafting weapons for the ultimate confrontation. Throughout Leningrad and Kiev, citizens rise resolutely, fortifying their homes and barricading their streets. From the Volga's vast fields to Siberia's frozen expanses, the Soviet people unite, armed with rifles, hammers, and scythes, ready to defend the socialist motherland."
SOVw_Third_World_War.4.d: "From the grand hall of the Kremlin, General Secretary [SOV.GetLeader] stood before the gathered assembly, his voice steady and resolute. The war had entered a decisive phase, and as Soviet forces pressed forward on distant battlefields, another front demanded equal vigilance—the factories, the mines, and the fields that sustained the war effort.\n\nHe spoke not of sacrifice, but of duty—of the unbreakable link between the worker and the soldier, between the machines that rolled off the production lines and the men who wielded them in battle. Every rifle assembled, every tank forged, and every aircraft built was another step toward victory. The people's labor was no less vital than the strength of the Soviet Army, for without it, the war could not be won.\n\nThe message was clear: the Soviet Union’s triumph would not be decided by soldiers alone but by the unwavering hands of those who toiled behind the lines. Factories would not rest, fields would yield their harvests, and the nation would move toward a future free from the oppression of the West. The spirit of past generations, of those who had endured the Great Patriotic War, lived on in the hearts of those who now carried the burden of history.\n\nAs the speech ended, the assembly rose in thunderous applause. The people understood—this was their war, too."
SOVw_Third_World_War.5.d: "As the fires of the Third World War raged, the Soviet Union knew it could not fight alone. With battle lines drawn against the West, Moscow turned to the one power capable of reshaping the conflict—China. A Soviet envoy, carrying the weight of history on his shoulders, was sent to Beijing with a single mission: to bring China into the war.\n\nThe meetings were tense, held behind closed doors in Zhongnanhai, where Soviet diplomats and Chinese officials debated the fate of the Eastern Bloc. The Soviets spoke of American aggression, of the West’s endless encroachment, of a world order built to contain them both. They promised military coordination, technology, and a new global balance—one where neither Moscow nor Beijing would be subjugated by Western influence again.\n\nAfter days of deliberation, the answer came. China would stand with the Soviet Union. The handshake that followed was not just an agreement—it was a declaration that the East would rise as one. Factories roared to life, soldiers mobilized, and the world braced for the storm that was about to unfold. The alliance had been forged in steel and fire, and nothing would stand in its way."
SOVw_Third_World_War.6.d: "As I sit by the dim light of a lantern, the distant thunder of artillery reminds me of how far I am from home, yet my heart remains with you. The war stretches on, and though the days are long and the nights even longer, the thought of you gives me strength.\n\nThe men here fight not just for our Motherland but for the future—for you, our children, and the life we will build when this is over. I often think of our small apartment, of the mornings when I would wake to the scent of your tea, of the warmth of your hands in mine. It is those memories that keep me going when the cold wind cuts through my uniform and exhaustion weighs heavy on my shoulders.\n\nWe have pushed forward, and though the enemy resists, we remain unbroken. The West thought they could crush us, but they do not know the heart of a Soviet soldier. We fight with the spirit of those who came before us, those who marched to Berlin and raised the red banner in victory. I swear to you, my love, I will see you again when that banner flies high once more.\n\nTake care of yourself, my dearest. Tell our son that his father fights so that he may live in a world without war. Keep a candle burning in the window for me—I will follow its light home.\n\nWith all my love,"
SOVw_Third_World_War.7.d: ""
SOVw_Third_World_War.8.t: ""
SOVw_Third_World_War.9.t: ""
SOVw_Third_World_War.10.t: "The Red Eminence Proposal"
SOVw_Third_World_War.10.d: "As the Third World War continues to unfold, the Red Army has shown that it has maintained its strength following our righteous victory over the Third Reich. We are now advancing the revolution further west than ever before. However, as we liberate more peoples on the continent, we are faced with certain administrative challenges. Unlike with Germany, where we could transfer control to our comrades in East Berlin, we are unable to do the same for regions like the Lowlands. Currently, we have separate socialist governments implementing the workers' revolution in the Netherlands, Belgium, and Luxembourg. Not everyone in our party is satisfied with this division. Comrade Suslov, in particular, has proposed the idea of creating a unified Benelux Socialist State.\n\nThis proposal, of course, comes with its own set of considerations. Our Union is strong and united, which cannot be said for the Benelux region. Uniting these diverse cultures under one banner while the war is still ongoing poses risks and will likely lead to unrest behind the front lines. On the other hand, capitalists are already resisting socialist liberation, so a unified state may not introduce any new issues beyond those we are already facing.\n\nMoreover, this move would significantly reduce our administrative burdens, allowing us to build and shape one country rather than three separate entities. If we go ahead with Comrade Suslov’s proposal, the local leadership is likely to be outraged, but the administrative ease gained means we can focus more effectively on the ongoing World War."
SOVw_Third_World_War.10.a: "Maybe he is right."
SOVw_Third_World_War.11.t: "Communists in Netherlands, Luxembourg and Belgium disagreed with Suslov proposal!"
SOVw_Third_World_War.11.d: "Perhaps predictably, the leadership in the Benelux countries is furious with our decision to create a single, unified state in the region. The communist leaders in all three countries have openly protested against this decision, with many refusing to recognize the new state and its government. While their determination is notable, the absence of established communist leadership in this new Benelux state will be sorely missed, making nation-building significantly more challenging.\n\nThis resistance to the revolution has only highlighted the hypocrisy of Western communists, as the revolution knows no borders and sees no cultural distinctions among the proletariat. As these ideological careerists protest the unification, they have only further demonstrated why Moscow's leadership in the world revolution is essential. As such, we have reached a crossroads. What should we do?"
SOVw_Third_World_War.11.a: "Let's go with Suslov plan."
SOVw_Third_World_War.11.b: "Perhaps its best to take their advice..."
SOVw_Third_World_War.12.t: "Yugoslavia Agree to Join"
SOVw_Third_World_War.12.d: "Our formerly disgraced comrades in Belgrade have finally seen reason, and have officially entered the war under our joint Red Banner of Freedom! While there is still much to be done to heal the rift between our two nations, we can at least reliably see that "Comrade" Tito can still see reason, and is an ally of the workers revolution. Opening a new front line with NATO in Italy also serves  to give us a much needed advantage against the American Imperialists, and allowing our new Yugoslavian allies to keep Trieste should be enough to keep them content for the time being..."
SOVw_Third_World_War.12.a: "Wonderful!"
SOVw_Third_World_War.13.t: "Yugoslavia Refused to Join"
SOVw_Third_World_War.13.d: "Unfortunately, Balkan socialism is far more compromised than we initially anticipated, as Yugoslavia has refused to join the war and has defied the Workers' Revolution one last time. While our differences are significant, we had hoped that Belgrade could see reason and recognize that this might be our only opportunity to end capitalist tyranny once and for all, or at least be persuaded by the idea of regaining their lost territories. However, it is clear that this is not the case, and America's influence over our former allies is stronger than we realized.\n\nThere are members within our party and even in the Soviet Army who do not wish to waste resources and manpower by expanding the front against a neutral nation. However, the risk is too great. If Yugoslavia is willing to isolate itself from Moscow in favor of Washington, then the possibility of the Americans using Yugoslavia to launch an invasion against our vulnerable rear lines cannot be ignored. While we had hoped for a more receptive response from Yugoslavia, we now have no choice but to secure our flanks."
SOVw_Third_World_War.13.a: "Looks like we need to do it the hard way..."
SOVw_Third_World_War.14.t: "The Soviet Request"
SOVw_Third_World_War.14.d: "The growing animosity between Belgrade and Moscow the past few years is undeniable. Our cordial relations with the United States and neutrality aside, Moscows insistence we bow to their party line, fallowed by their many assassination attempts against Comrade Tito has made our relationship quite icy at the very least.  However at our core we are both still communist states, and harbour the same long term dreams of world revolution, as Marx had wisely predicted. Now we're given perhaps the only opportunity we will ever have to achieve this goal. While the world has tragically devolved into yet another global war, Soviet officials have demanded we join the war on their side, to put our differences aside and unite under the shared goal of World Revolution. While even if we do accept this blatant ultimatum at face value, our relationship with Moscow wont simply be mended over night, and from a strictly pragmatic standpoint, completing cutting ties with the western world, and joining yet another global war so quickly after the last one ended would not only destroy our still recovering economy, but would not be received well by our people to put it mildly.\n\nDespite this fact our hands may be tied.  While not entirely clear whether the Soviet Union has the capability to expand their front line, refusal might mean war regardless, however instead of our front line being Western Europe, it would be our own towns and cities, and at least siding with the Soviets would mean we could keep the war from our borders, and provide us an opportunity to reclaim territory that is rightfully ours, but selfishly hoarded by the western capitalists, such as Trieste.\n\nThis is no clear cut issue with even fewer clear answers, however, after careful deliberation..."
SOVw_Third_World_War.14.a: "Let's put aside our differences..."
SOVw_Third_World_War.14.b: "To hell with the Soviets!"

#Events - News Events
SOVw_Third_World_War_news.1.d: "Since the outbreak of the Third World War, the Soviet Union has sought to reshape the global order, and now, it has secured its most powerful ally. After months of negotiations, Beijing has cast aside past differences and joined Moscow in its war against the United States, forging an alliance that threatens to tip the scales of history.\n\nWith China’s vast manpower and industrial might reinforcing the Soviet war machine, a new front emerges—one that stretches from the Pacific to the heart of Eurasia. Soviet and Chinese forces coordinate their offensives, striking at Western positions with unrelenting force. The factories of Beijing and Shanghai work day and night, supplying the war effort, while Soviet generals and Chinese commanders plan their next decisive move.\n\nThe world watches as the Eastern Bloc solidifies, a force unseen since the height of the Cold War. With two superpowers standing together, the war’s outcome is no longer certain—the tide has turned."

