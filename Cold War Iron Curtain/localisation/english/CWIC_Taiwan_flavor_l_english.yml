l_english:
 flavorchi.1.t:0 "[GetNewspaperHeader]Martial Law Lifted"
 flavorchi.1.d:0 "The Republic of China has lifted martial law on Taiwan. The decree had stood since 1949."
 flavorchi.1.a:0 "The decree is lifted."
 flavorchi.1.b:0 "Taiwan has lifted martial law."
 flavorchi.2.t:0 "[GetNewspaperHeader]The Wild Lily Movement"
 flavorchi.2.d:0 "Students have occupied the square before the presidential palace in Taipei. They want a new assembly. The sit-in is being called the Wild Lily movement."
 flavorchi.2.a:0 "The students are in the square."
 flavorchi.2.b:0 "Taipei has a student sit-in."
 flavorchi.3.t:0 "[GetNewspaperHeader]Taiwan Votes for a President"
 flavorchi.3.d:0 "Voters on Taiwan have chosen a president by direct ballot for the first time. Lee Teng-hui has won."
 flavorchi.3.a:0 "The ballot is cast."
 flavorchi.3.b:0 "Taiwan has voted."
