l_english:
 cwic_contain_communism_goal_name: "Contain Communism"
 cwic_contain_communism_goal_desc: "Hold the line against the Red tide. Completed when there are two fewer communist governments in the world than when this goal was chosen."
 cwic_spread_the_revolution_goal_name: "Spread the Revolution"
 cwic_spread_the_revolution_goal_desc: "The world revolution marches on. Completed when there are three more communist governments in the world than when this goal was chosen."
 cwic_arsenal_of_the_bloc_goal_name: "Arsenal of the Bloc"
 cwic_arsenal_of_the_bloc_goal_desc: "Build a military-industrial base for the whole alliance. Completed when faction members control at least one land, one naval and one air facility."
 cwic_non_aligned_unity_goal_name: "Regional Unity"
 cwic_non_aligned_unity_goal_desc: "Prove that the alliance can stand on its own. Completed when the faction stays together with at least three members for five years after choosing this goal."
