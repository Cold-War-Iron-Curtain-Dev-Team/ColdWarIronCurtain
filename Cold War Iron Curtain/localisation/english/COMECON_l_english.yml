 COMECON.400.t:0 "COMECON Budget Shortfall"
 COMECON.400.d:0 "The Soviet treasury cannot cover the cost of the COMECON network this month. One member has been forced to scale back its commitments to the bloc."
 COMECON.400.a:0 "Understood"
 COMECON_SLIDER_ECO_TT:0 "§YEconomic Support§!\n\nCost per level: §R0.05§! Soviet money per month.\nBenefit per level: §G+1.5%§! Agricultural Complex output, §G+1%§! Office Park income, §G-1%§! consumption needs."
 COMECON_SLIDER_CON_TT:0 "§YConstruction Support§!\n\nCost per level: §R0.04§! Soviet money per month.\nBenefit per level: §G+2%§! building speed. Also raises the Soviet share of satisfaction."
 COMECON_SLIDER_PRO_TT:0 "§YProduction Support§!\n\nCost per level: §R0.04§! Soviet money per month.\nBenefit per level: §G+1%§! factory efficiency gain, §G+0.5%§! efficiency cap."
 COMECON_SLIDER_RES_TT:0 "§YResearch Cooperation§!\n\nCost per level: §R-0.15%§! Soviet research speed (applied once per month across all members).\nBenefit per level: §G+1%§! research speed for this member."
 COMECON_SLIDER_MIL_TT:0 "§YMilitary Support§!\n\nCost per level: §R0.03§! Soviet money per month.\nBenefit per level: §G+1%§! command power, §G+0.5%§! war support, §G+2%§! license production speed. Reduces satisfaction by §R0.4§! per level each month."
 COMECON_MEMBER_SAT_LINE:0 "Satisfaction: §Y[?COMECON_TARGET.COMECON_satisfaction|0]§! / 100   Dependency: §Y[?COMECON_TARGET.COMECON_dependency|0]§! / 100"
 COMECON_SOV_COST_LINE:0 "Soviet COMECON upkeep: §R[?SOV.COMECON_cost|2]§! per month"
 COMECON_SLIDER_TRADE_TT:0 "§YTrade Cooperation§!\n\nCost per level: none to Soviet money.\nBenefit per level: §G+1§! monthly trade income to the Soviet Union from this member."
 COMECON.510.t:0 "Request from a COMECON Member"
 COMECON.510.d:0 "A COMECON member has submitted a request to the Soviet Union. Its satisfaction and dependency shape how Moscow should respond."
 COMECON.510.a:0 "Grant the request"
 COMECON.510.b:0 "Refuse the request"

