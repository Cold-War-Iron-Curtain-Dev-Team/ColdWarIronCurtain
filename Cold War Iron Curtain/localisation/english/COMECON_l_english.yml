 COMECON_CRISIS_TITLE_0:0 "No Current Crisis"
 COMECON_CRISIS_TITLE_1:0 "Uprising in East Germany"
 COMECON_CRISIS_TITLE_2:0 "Unrest in Poland"
 COMECON_CRISIS_TITLE_3:0 "Revolt in Hungary"
 COMECON_CRISIS_TITLE_4:0 "Albanian Dissent"
 COMECON_CRISIS_TITLE_5:0 "Romanian Defiance"
 COMECON_CRISIS_TITLE_6:0 "Prague Spring"
 COMECON_CRISIS_TITLE_7:0 "Strikes on the Baltic Coast"
 COMECON_CRISIS_TITLE_8:0 "Solidarity Movement"
 COMECON_CRISIS_TITLE_9:0 "Civil Unrest in [COMECON_TARGET.GetName]"
 COMECON_CRISIS_DESC_0:0 "The panel shows no active crisis for the selected member. Select a member with an active crisis to review the situation."
 COMECON_CRISIS_DESC_1:0 "Discontent is spreading through East Germany as the SED under Walter Ulbricht struggles to hold the population. Crush the unrest, make concessions, or seek a third way before the 60-day deadline, or the default outcome applies."
 COMECON_CRISIS_DESC_2:0 "Workers and students in Poland are demanding change. Our member government must respond before the protests grow beyond control. Crush the unrest, make concessions, or seek a third way before the 60-day deadline."
 COMECON_CRISIS_DESC_3:0 "Hungarian crowds are demanding a new government and an end to Soviet control. Crush the revolt, let Budapest go, or seek a third way before the 60-day deadline."
 COMECON_CRISIS_DESC_4:0 "Tirana is openly questioning its place in the bloc and its leadership is wavering. Crush the dissent, make concessions, or seek a third way before the 60-day deadline."
 COMECON_CRISIS_DESC_5:0 "Bucharest is pursuing an independent course within the bloc. Crush the defiance, make concessions, or seek a third way before the 60-day deadline."
 COMECON_CRISIS_DESC_6:0 "Reform is sweeping Czechoslovakia and the party leadership is losing its grip. Crush the movement, make concessions, or seek a third way before the 60-day deadline."
 COMECON_CRISIS_DESC_7:0 "Strikes along the Baltic coast threaten the Polish economy. Crush the strikes, make concessions, or seek a third way before the 60-day deadline."
 COMECON_CRISIS_DESC_8:0 "The Solidarity movement is organising across Poland with foreign backing. Crush the movement, make concessions, or seek a third way before the 60-day deadline."
 COMECON_CRISIS_DESC_9:0 "Public discontent in a COMECON member is rising sharply. Crush the unrest, make concessions, or seek a third way before the 60-day deadline."
 COMECON_CRISIS_ACT_CRUSH:0 "Crush the Unrest"
 COMECON_CRISIS_ACT_CONCEDE:0 "Make Concessions"
 COMECON_CRISIS_ACT_THIRD:0 "Seek a Third Way"
 COMECON.500.t:0 "Crisis in a COMECON Member"
 COMECON.500.d:0 "A crisis has erupted in one of our COMECON partners. Select the affected member in the COMECON panel to review the situation and choose a response. If no response is chosen within 60 days, the worst default outcome applies."
 COMECON.500.a:0 "Understood"
 COMECON.501.t:0 "Crisis Left Unresolved"
 COMECON.501.d:0 "The deadline for responding to a COMECON crisis has passed without a decision. The situation has deteriorated and the default outcome has applied."
 COMECON.501.a:0 "Understood"

 EMPHASIZE_DOCKYARD_TT:0 "§YEmphasize Dockyard Development§!\n\nWill §Gdecrease§! build times for Dockyards at the cost of other economic sectors. Will last for §Cfive years§!.\n\nMust §Rnot§! be currently emphasizing any economic sector."
 EMPHASIZE_INDUSTRY_TT:0 "§YEmphasize Industrial Development§!\n\nWill §Gdecrease§! build times for Industrial Complexes at the cost of other economic sectors. Will last for §Cfive years§!.\n\nMust §Rnot§! be currently emphasizing any economic sector."
 EMPHASIZE_ARMS_TT:0 "§YEmphasize Arms Factory Development§!\n\nWill §Gdecrease§! build times for Arms Factories at the cost of other economic sectors. Will last for §Cfive years§!.\n\nMust §Rnot§! be currently emphasizing any economic sector."
 EMPHASIZE_FARM_TT:0 "§YEmphasize Agricultural Development§!\n\nWill §Gdecrease§! build times for Agricultural Complexes at the cost of other economic sectors. Will last for §Cfive years§!.\n\nMust §Rnot§! be currently emphasizing any economic sector."

 COMECON_MILITARY_ACCESS_TT:0 "To Request Military Access, the §Y[COMECON_TARGET.GetName]§! must §Rnot§! already be giving us access or have recently declined requests for access."
 COMECON_BEGIN_SUBSIDIZING_TT:0 "Begin ecomonic subsidies to the §Y[COMECON_TARGET.GetName]§!, by doing so we will pay §C25%§! of their total monthly expenses and will gain influence over time."
 COMECON_PROMOTE_FRIENDLY_PARTIES_TT:0 "At the expense of §C2B§! and §Y100§! Political Power we will actively support friendly local political parties and movements to help stabilize the political situation over the course of a year in §Y[COMECON_TARGET.GetName]§!."
 COMECON_KICK_TT:0 "Kick §Y[COMECON_TARGET.GetName]§! from §YCOMECON§!\n\n§Y[COMECON_TARGET.GetName]§! must §Rnot§! be within our faction or a subject of the Soviet Union."
