burma_struggle.1.t:0 "[GetNewspaperHeader]Burma at War with Karen Forces"
burma_struggle.1.d:0 "Rangoon - The Burmese Army is at war with Karen forces. Fighting with the Karen National Liberation Army is spreading through the east, extending a conflict that has already threatened the approaches to Rangoon at Insein.\n\nKaren leaders have pressed for a state of their own since independence. Men who once served in the same army now answer to opposing commands, after Karen soldiers left government units to join the movement.\n\nRangoon is fighting to keep the eastern districts within the Union. The Karen National Union argues that their place in Burma cannot be settled by sending troops to enforce it."
burma_struggle.1.a:0 "Insein was no settlement."
burma_struggle.2.t:0 "[GetNewspaperHeader]Civil War Spreads Across Burma"
burma_struggle.2.d:0 "Rangoon - Burma's internal conflict has widened into open civil war. The government has opened hostilities against armed movements still opposed to its rule, putting the army on several fronts at once.\n\nThe disputes did not begin together. Some movements took up arms over the powers of the Union and its constituent states; others challenged the government in Rangoon itself. They have a common adversary without necessarily having a common command.\n\nThe widening war puts demands on garrisons already spread across the country. Gains in one district may come at the expense of holding another."
burma_struggle.2.a:0 "Rangoon is fighting on several fronts."
burma_struggle.3.t:0 "[GetNewspaperHeader]Burma at War with Kuomintang Forces"
burma_struggle.3.d:0 "Rangoon - Hostilities have opened between Burmese forces and Chinese Nationalist troops based on the Yunnan frontier. The units crossed into Burma after the Communist victory in China and have retained their own command on Burmese soil.\n\nFor the Nationalist officers, posts inside Burma offer a refuge and a base from which to continue their campaign in China. Rangoon regards their continued presence as an infringement of Burmese sovereignty.\n\nThe new fighting adds a frontier campaign to the army's commitments at home. It also gives Burma a direct stake in the disposition of troops left abroad by the Chinese civil war."
burma_struggle.3.a:0 "China's war has crossed the frontier."
burma_struggle.4.t:0 "[GetNewspaperHeader]Rangoon Opens New Military Campaign"
burma_struggle.4.d:0 "Rangoon - The Burmese government has opened hostilities against an armed movement within the country, committing regular troops to a campaign to bring the territory it holds under Union control.\n\nUntil now the movement has maintained its own armed command beyond the government's effective reach. Rangoon has chosen to contest that authority in the field rather than continue to tolerate an independent force.\n\nThe announcement marks the opening of the campaign. There is no surrender, and the eventual disposition of the territory remains unsettled."
burma_struggle.4.a:0 "Another campaign for the Union Army."
burma_struggle.10.t:0 "[GetNewspaperHeader]Union Extends Rule by Agreement"
burma_struggle.10.d:0 "Rangoon - The leaders of an armed movement have agreed to join the Union of Burma on terms that place the territory they held under direct Union administration. They will no longer exercise separate governing authority.\n\nThe agreement settles a question that an end to hostilities alone would have left open: which government the district offices answer to. That responsibility now falls to the ministries in Rangoon.\n\nFor the Union government, the agreement extends its authority without another campaign. Its immediate task is to take over the work previously done by the local administration."
burma_struggle.10.a:0 "A peaceful return to Union rule."
burma_struggle.11.t:0 "[GetNewspaperHeader]Rangoon Agrees to Local Self-Rule"
burma_struggle.11.d:0 "Rangoon - The Burmese government has accepted a separate local administration under Union authority in a settlement with one of the country's armed movements. The agreement provides for an end to armed resistance without putting the district offices under direct rule from the capital.\n\nSupporters of the arrangement argue that local leaders can answer to their own communities without taking their territory out of the Union. For Rangoon, the price of that allegiance is a limit on what its own officials can decide locally.\n\nThe practical test of the agreement will come when Union authorities and the local administration have to decide which matters each can settle on its own."
burma_struggle.11.a:0 "Self-rule within the Union."
burma_struggle.12.t:0 "[GetNewspaperHeader]Army Imposes Direct Union Rule"
burma_struggle.12.d:0 "Rangoon - The Burmese Army has imposed direct Union control over territory previously held by an armed movement. The movement's separate authority has been abolished, and local administration is now answerable to the central government.\n\nThis is a submission on Rangoon's terms. There is no grant of self-rule, and the former leadership has no separate administration through which to negotiate with Union officials.\n\nThe army can enforce the change of authority. District officers will still have to govern communities where the terms of submission are resented."
burma_struggle.12.a:0 "Submission is a poor substitute for consent."
burma_struggle.13.t:0 "[GetNewspaperHeader]Communist-Led Front Gains an Ally"
burma_struggle.13.d:0 "The Burma Communist Party has secured the allegiance of another armed movement in its campaign against Rangoon. The new ally brings its own fighters and territory into the united front.\n\nThe agreement is a pledge to make common cause against the Union government. It does not require every member of the front to subscribe to the Communist Party's programme or settle its own demands in advance.\n\nThe party can now count on support beyond the districts where it commands forces of its own. Rangoon must reckon with the prospect that a dispute with one movement will draw in others."
burma_struggle.13.a:0 "Rangoon can no longer face them separately."
burma_struggle.20.t:0 "[GetNewspaperHeader]Army Secures Rangoon's Supremacy"
burma_struggle.20.d:0 "Rangoon - The Union government has declared the struggle for Burma over. Organized resistance has ended after campaigns that defeated some movements outright and forced others to submit. Rangoon now holds authority on terms it largely set itself.\n\nThe Tatmadaw's commanders have more weight in the capital than they did before the fighting. They argue that the campaign proved their case for preserving the Union by force.\n\nFor the defeated nationalities, there is little room to bargain over the terms on which the government will administer their districts."
burma_struggle.20.a:0 "The Union stands on the army's terms."
burma_struggle.21.t:0 "[GetNewspaperHeader]Rebel Victory Breaks the Union"
burma_struggle.21.d:0 "Rangoon - The government has accepted peace with the rebel movements after an ethnic insurgent army defeated the Tatmadaw. Rangoon has abandoned its campaign to bring the country back under its authority by force.\n\nThe cessation of hostilities settles no general question of sovereignty. Armed movements still hold their own territories, and the weakened government has no means of imposing Union administration on them.\n\nFor the insurgent leadership, the peace gives Rangoon's commanders less say over who governs their districts than any offer the capital made while it still expected to win."
burma_struggle.21.a:0 "Rangoon has had to make peace."
burma_struggle.22.t:0 "[GetNewspaperHeader]Federal Settlement Ends Burma's War"
burma_struggle.22.d:0 "Rangoon - Supporters of the new federal settlement are invoking the Panglong Agreement, arguing that the Union can hold only if its nationalities have a share in governing it. The last organized resistance to Rangoon has ended under agreements reached with the armed movements.\n\nThe terms differ from one district to the next. Some territories have accepted direct integration, while others remain within the Union under their own administrations.\n\nThe ministries in Rangoon must now administer these arrangements without encroaching on the powers promised to local authorities. Those promises were part of the price of peace."
burma_struggle.22.a:0 "The Union must keep its agreements."
burma_struggle.23.t:0 "[GetNewspaperHeader]Communists Take Power in Rangoon"
burma_struggle.23.d:0 "Rangoon - The Burma Communist Party has taken the capital, ending the rule of the Union government it fought from the countryside. The ministries and resources of the former Union are now under the party's authority.\n\nThe transfer of power extends beyond Rangoon. The victorious party is incorporating the territories of the former Union and bringing the holdings of the rival Red Flag communists under the same administration.\n\nHaving spent years contesting the parliamentary government's authority, the party must now run its offices and meet the demands of a country worn down by civil war."
burma_struggle.23.a:0 "The party now has a country to govern."
burma_struggle.24.t:0 "[GetNewspaperHeader]Kuomintang Holds Enclave in Burma"
burma_struggle.24.d:0 "Kengtung - The Nationalist army driven out of China has established a state of its own in eastern Burma. The Yunnan Anti-Communist National Salvation Army holds Kengtung and Mong Hsat, the strongholds from which it has maintained its separate command.\n\nNeither town is returning to Rangoon's administration under the peace. The Burmese government has come to terms with the Nationalists still in possession of their bases.\n\nThe soldiers came to the frontier as refugees from a lost war. The towns that served as their refuge are now the seat of a military enclave on Burmese soil."
burma_struggle.24.a:0 "The Nationalists are there to stay."
burma_struggle.25.t:0 "[GetNewspaperHeader]Burma's Insurgencies Remain Unsettled"
burma_struggle.25.d:0 "Rangoon - The Burmese Army under General Ne Win has seized power and ended parliamentary rule. The officers who directed the campaigns against Burma's armed movements now control the government in Rangoon.\n\nThe change of government has brought no general ceasefire. Insurgent forces remain in the field, and districts where the army could not establish lasting control before the takeover remain beyond the reach of the new authorities.\n\nNe Win's officers can now issue orders to the civil administration as well as to the garrisons. They have announced no terms on which the armed movements might lay down their weapons."
burma_struggle.25.d_civilian:0 "Rangoon - Prime Minister U Nu's government has entered 1963 without a general settlement with Burma's armed movements. Parliament remains in place, but the government's writ still does not run in districts held by insurgents.\n\nThe campaigns have produced no common terms for ending the fighting. In some areas the dispute is over who should administer the districts; elsewhere armed movements still contest the authority of the Union government itself.\n\nThe cabinet must keep the garrisons supplied while it decides what it can offer in negotiations. A local truce would give a district some relief, but it would leave Rangoon to bargain with the remaining movements separately."
burma_struggle.25.a:0 "The campaigns go on without a settlement."
