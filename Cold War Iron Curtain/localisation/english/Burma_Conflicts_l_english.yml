 Launch_Campaign_Against_the_Karen_National_Liberation_Army:0 "Campaign Against the Karen National Liberation Army"
 Karen_Conflict_desc:0 "The Karen minority had played a major role in supporting the British colonial regime. In return, they received the favor of government employment, especially in the military and police. Following independence, the new government initiated a policy of sidelining Karen military officers and expanding the ranks to the majority Bamar community. The Karen, fearing the government planned to initiate a campaign of suppression to convert the Karen into a second class community, responded by launching its own rebellion. Many Karen soldiers defected to join the rebels, presenting a major threat to the Burmese military and state.\n\nCurrent Karen National Liberation Army Strength: [?global.BUR_strength^2|0]"
 arakan_insurgency_Decisions:0 "The Arakan People's Liberation Army"
 arakan_insurgency_Decisions_desc:0 "Many people in Arakan felt colonialism robbed them of any control over their own destiny and land. The advent of independence has not relieved these concerns. Many Arakans are taking up arms to restore an independent Arakan. The Burmese government and especially the military views Arakan State as an essential part of the state that must be brought to heel by any means necessary.\n\nCurrent Strength: [?ROOT.arakan_insurgency|R]%"
 Fall_of_Sittwe:0 "The Fall of Sittwe"
