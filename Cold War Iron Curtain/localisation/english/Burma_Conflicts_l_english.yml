 Burma_Communist_Conflict:0 "The White Flag Communist Insurgency"
 Mon_Conflict:0 "The Mon Conflict"
 Burma_Communist_Conflict_desc:0 "The Burmese Communist Party took to armed resistance after its efforts to force political change were thwarted by the government. Burmese nationalists saw the communist demands as too radical and pushing Burma towards global conflict. Fearing a government crackdown, the communists fled their political headquarters and launched an armed struggle. The Burmese military, fearing the communists may unify other regional rebellions, wish to swiftly put down the communist threat.\n\nCurrent Communist Party of Burma Strength: [?global.BUR_strength^1|0]"
 Mon_Conflict_desc:0 "Prior to colonial rule, the Mon faced an existential threat from the Burmese Kingdom. However, they joined the anti-colonial movement during the last years of British rule. After achieving independence, Mon leaders requested self-determination from the government, however, this was denied. Fearing for their future, the Mon responded by initiating a rebellion against the government. The Burmese military is keen to restore state control over Mon lands.\n\nCurrent Mon National Liberation Army Strength: [?global.BUR_strength^4|0]"

 Karen_Conflict:0 "The Karen Conflict"
