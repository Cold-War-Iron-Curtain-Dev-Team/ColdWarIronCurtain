 arakan_insurgency_options.3.d:0 "An Army raid has taken a mountain camp used by the Arakan People's Liberation Army. A patrol found the position while investigating rebel activity in the surrounding district. The unit sent to seize it reports prisoners and a considerable haul of weapons and papers. Surviving fighters have abandoned the camp.\n\nThe local command reports less rebel activity since the raid. The captured records give Military Intelligence a means of judging whether the district has been cleared or whether fighters who escaped are regrouping elsewhere."
 arakan_insurgency_options.4.d:0 "The Army has broken off an attempt to take a rebel base in Arakan after the assault party came under fire short of its objective. The local commander had judged the camp lightly defended. The Arakan People's Liberation Army still holds it, and the government troops left weapons behind as they withdrew.\n\nThe casualty return leaves the district command short of men for its regular duties. The operation was meant to deny the rebels a base in the area. Instead, the garrison must cover the same district with fewer troops and a rebel force still able to operate from the hills."
 arakan_insurgency_options.1.d:0 "Military Intelligence has confirmed that villagers recruited as government agents have gained the confidence of officers in the Arakan People's Liberation Army. Their reports now reach beyond the disposition of individual bands to what rebel commanders expect those bands to do. Army units have already broken up several detachments on the strength of the information.\n\nThe operation gives the district command a view of an organization it had previously been able to observe chiefly through patrol reports. The longer the agents remain in place, the more useful their access is likely to be."
 arakan_insurgency_options.2.d:0 "Several Military Intelligence sources inside the Arakan People's Liberation Army have fallen silent after Army units came under fire while acting on their reports. The service recruited villagers who could pass as new members of the organization. It had taken their growing access to rebel officers as evidence that the operation was working.\n\nThe district command now suspects that some sources were passing reports at the rebels' direction. It cannot account for the others. Until the service can establish when the network was compromised, earlier reports from the same sources are also in doubt."
 arakan_insurgency_options.5.d:0 "A government patrol has recovered papers from an Arakan People's Liberation Army camp abandoned after an Air Force strike. The Army requested air support because the position was difficult to approach and a ground assault was expected to be costly. The patrol confirms that the camp is no longer occupied and that several of its buildings were destroyed.\n\nThe records give Military Intelligence a better account of the base than it had before the strike. For the district command, the immediate gain is the loss of a defended position from which the rebels had been operating."
 arakan_insurgency_options.6.d:0 "An Army patrol sent to inspect the site of an air strike in Arakan reports that the wrecked building was a civilian farmhouse. It has found no evidence that the Arakan People's Liberation Army occupied the property. The target was nominated by the Army, which had judged the position too costly to take on the ground. One aircraft was lost during the operation.\n\nNews of the strike has spread in the surrounding villages. The district command now has to explain why the farmhouse was listed as a rebel position, while officials face complaints from the people whose cooperation the Army needs."
 arakan_insurgency_options.10.d:0 "Sittwe - The Burmese Army has withdrawn from Sittwe after a series of reverses in Arakan. Crowds have turned out to celebrate the army's departure, and the Arakan People's Liberation Army is claiming victory. Rangoon has declined to comment.\n\nCalls for self-government gained ground in Arakan after independence. When the central government offered no settlement acceptable to the movement, armed bands found recruits among those who had expected the end of British rule to bring greater local authority.\n\nThe loss of Sittwe gives those bands a stronger position in western Burma. No transfer of sovereignty has been announced, and Rangoon has yet to say whether it will resume the campaign."
 arakan_insurgency_options.11.d:0 "Rangoon - Photographs issued by the Burmese government show members of the Arakan People's Liberation Army handing over their weapons to Army officers. The authorities say that organized resistance has collapsed and that military and civil officials now answer directly to Rangoon.\n\nThe insurgency drew on demands for autonomy that date to the end of British rule. Those demands found armed support when negotiations with the Union government produced no settlement acceptable to the movement.\n\nNo political agreement accompanied the surrender. The government is treating the campaign's end as the restoration of its authority in Arakan, with no concession on the powers of a local administration."

 rohingya_insurgency_options.3.d:0 "The Army reports that a raid in northern Arakan has dispersed a Mujahideen camp and brought in prisoners, arms and records. A patrol discovered the camp during operations in the district. The fighters took losses in the raid, although the Army cannot account for all those who were there.\n\nThe district command is consolidating its position. The captured records give it a basis for distinguishing the men who used the camp from other bands still at large in northern Arakan."
 rohingya_insurgency_options.4.d:0 "The Mujahideen have turned back an Army detachment sent against one of their camps in northern Arakan. The operation was called off after the troops came under fire and took heavy casualties during the withdrawal. The district command reports that the camp remains in use.\n\nThe reverse gives the fighters a reprieve in a district where their continued presence is already making it difficult for officials to restore regular administration. The Army has losses to account for and still has to contend with the same armed band."
 rohingya_insurgency_options.1.d:0 "Army detachments in northern Arakan have intercepted several Mujahideen bands after receiving reports from informants recruited in villages under government control. Until now, patrols had often been able to confirm the passage of armed men only after they had left the district.\n\nThe local command now has a continuing source of information, which has already weakened the bands operating nearby. The villages that supplied reports remain exposed to pressure if the fighters learn where the information came from."
 rohingya_insurgency_options.2.d:0 "Informants recruited in northern Arakan have defected to the Mujahideen. The Army attributes a series of recent reverses to false information supplied by men it had counted on to report the movements of local bands. The district command is reviewing which of its sources it can still trust.\n\nThe failure comes at a cost beyond the troops' immediate setbacks. Other villagers considering cooperation with the authorities have reason to doubt whether the Army can keep their involvement secret."
 rohingya_insurgency_options.5.d:0 "A ground patrol in northern Arakan has confirmed the destruction of a Mujahideen supply camp by the Burmese Air Force. Photographs from a reconnaissance flight identified the clearing; the patrol found wrecked arms and stores after the strike. It also recovered documents left by fighters who had withdrawn from the site.\n\nThe loss deprives the bands in the district of an established source of supplies. The Air Force now has a ground report against which it can judge what its reconnaissance crews saw from the air."
 rohingya_insurgency_options.6.d:0 "An Army inspection in northern Arakan has found that the building struck by the Air Force was an abandoned farmhouse. Reconnaissance crews had identified the clearing as a suspected Mujahideen camp, but the patrol found no arms or signs of a rebel presence. An aircraft was lost during the operation.\n\nMujahideen supporters are circulating reports that a farming family was killed. The patrol has found no evidence to confirm those reports. The strike has nevertheless damaged the government's standing in the district, and the intended target remains unaccounted for."
 rohingya_insurgency_options.10.d:0 "Maungdaw - Prayers in Rohingya villages have marked a withdrawal of Burmese government troops from parts of northern Arakan. Mujahideen fighters have moved into positions left by the army, which has struggled to maintain its posts near the frontier.\n\nBefore Partition, some Muslim leaders in northern Arakan sought to join Pakistan. The proposal found no support from the authorities, and armed resistance took hold as the new Burmese government asserted its control of the district.\n\nThe fighters have gained ground, but the frontier remains where it was. It is unclear whether their leaders will renew the appeal to Pakistan or seek a settlement of their own with Rangoon."
 rohingya_insurgency_options.11.d:0 "Maungdaw - Mujahideen fighters have handed over their weapons to Burmese Army officers in northern Arakan. The surrender follows a campaign that isolated the remaining armed bands and cut into the local support on which they relied.\n\nSome Muslim leaders had sought accession to Pakistan around the time of Partition. When that bid failed, demands for local self-government persisted, along with fears that a Buddhist majority in Rangoon would pay little heed to Muslim religious rights.\n\nGovernment officials now have direct authority in the frontier district. The surrender settles who controls it without addressing the grievances over how it is governed."
 
 BCP_Conflict.1.d:0 "Rangoon - The Burma Communist Party has taken control of the capital and displaced the Union government. Party leaders have promised to restore peace and put the state to work for peasants and wage earners.\n\nThe party had once stood alongside other nationalists in the struggle against British rule. Its break with the government and turn to armed revolt left Rangoon fighting an opponent with an organization of its own in the countryside.\n\nThe new authorities present the takeover as the beginning of a socialist programme. They now have to keep the ministries working while making good on pledges made when the party was still in opposition."
 BCP_Conflict.2.d:0 "Rangoon - The Burmese government has declared the defeat of the armed Communist movement and assumed control of its remaining strongholds. Army officers say the party can no longer maintain a campaign against the Union.\n\nThe Communists went underground after their break with the nationalist leadership. They sought to displace the government by force and found support in districts where their calls for land reform carried weight.\n\nThe Army's victory ends that bid for power. It does not remove the rural grievances on which Communist organizers drew, and officials remain concerned that the party could rebuild outside its former strongholds."
 Karen_Conflict.1.d:0 "The Karen National Union has asserted independence from Rangoon, with the Karen National Liberation Army in control of the territory claimed by the new authorities. The Union government has not granted recognition.\n\nKaren leaders had sought guarantees of self-government following the British departure. The loss of senior Karen posts in the army reinforced doubts about the terms on offer from Rangoon. Defections from government units gave the Karen forces trained men when the dispute became an armed one.\n\nKaren leaders can now administer the territory they hold. Formal recognition abroad is a separate matter, and neighboring governments have yet to commit themselves."
 Karen_Conflict.2.d:0 "Rangoon - The Burmese Army has announced the defeat of the Karen National Liberation Army and the restoration of Union authority in its former strongholds. The campaign ends an organized challenge to Rangoon's control in the east.\n\nThe Karen movement drew men from units that had served under the British, as well as from the wartime resistance. Defections from the post-independence army added trained soldiers to a rebellion whose leaders sought a state of their own.\n\nResponsibility now passes to the officials charged with governing the recovered districts. The Army's announcement contains no provision for the self-government Karen leaders sought."
 Mon_Conflict.1.d:0 "Mon leaders have proclaimed independence in the southeast, where their armed organization now answers to a government of its own. Recognition of that government is still limited, and Rangoon has made no formal concession on sovereignty.\n\nMon nationalists had pressed for self-government at independence. They argued that the end of British rule gave Rangoon no right to decide the terms of Mon administration without them. When those demands were refused, the movement sought to secure them by force.\n\nThe declaration puts a separate administration in place where the Mon movement holds territory. Its standing beyond those districts remains a matter for negotiation."
 Mon_Conflict.2.d:0 "Rangoon - Burmese officials have resumed direct administration in the Mon districts after the Army broke the organized resistance of the Mon National Liberation Army. The return of government officers frees the military to attend to other campaigns.\n\nThe Mon movement took up arms after failing to secure self-government from the Union. Its demands concerned who would administer Mon districts once British rule ended, an issue the campaign has settled in Rangoon's favor by force.\n\nOfficials are returning without a political agreement with Mon leaders. Complaints against rule from the center will now go to the very administration whose authority the movement disputed."

