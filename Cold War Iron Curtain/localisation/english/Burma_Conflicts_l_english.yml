burma_struggle.1.t:0 "Karen Rebellion Erupts"
burma_struggle.1.d:0 "Open war has broken out between the Burmese government and Karen insurgents. The Karen National Liberation Army has taken up arms and the fighting is spreading through the eastern hills."
burma_struggle.1.a:0 "The war has begun"
burma_struggle.2.t:0 "Full Civil War"
burma_struggle.2.d:0 "With the government unable to hold the country together, every armed group that refuses to bend has been drawn into open war against Rangoon."
burma_struggle.2.a:0 "Civil war engulfs Burma"
burma_struggle.3.t:0 "Kuomintang Forces Clash with Burma"
burma_struggle.3.d:0 "Kuomintang troops along the northern border have engaged Burmese forces. Rangoon now faces open hostilities from the remnants of the Chinese Nationalists."
burma_struggle.3.a:0 "The border burns"
burma_struggle.4.t:0 "Insurgent Group Crushed"
burma_struggle.4.d:0 "The Burmese military has broken the resistance of one of the armed groups and its forces have scattered into the hills."
burma_struggle.4.a:0 "A hard-won victory"
burma_struggle.10.t:0 "Group Integrated into the Union"
burma_struggle.10.d:0 "The leadership of the group has accepted integration into the Union of Burma. Its territories now answer directly to Rangoon."
burma_struggle.10.a:0 "Welcome to the Union"
burma_struggle.11.t:0 "Autonomy Granted"
burma_struggle.11.d:0 "Rangoon has granted the group a measure of self-rule in exchange for an end to armed resistance."
burma_struggle.11.a:0 "A fragile settlement"
burma_struggle.12.t:0 "Group Subjugated"
burma_struggle.12.d:0 "The group has been brought under direct military control. Its people now live under the full weight of the Burmese state, and resentment runs deep."
burma_struggle.12.a:0 "Order is restored, for now"
burma_struggle.13.t:0 "Group Joins the United Front"
burma_struggle.13.d:0 "The group has joined the Communist-led united front against the Burmese government, bringing its fighters and territory into the struggle."
burma_struggle.13.a:0 "The front grows"
burma_struggle.20.t:0 "[GetNewspaperHeader]Bamar Supremacy"
burma_struggle.20.d:0 "Rangoon has declared victory in the struggle for Burma, with organized resistance to the Union government brought to an end. Military defeat and enforced submission have secured the central government's predominance over the country's armed movements.\n\nThe Tatmadaw emerges from the campaigns with greater authority, its commanders claiming vindication for their insistence that the Union must be preserved by force.\n\nThe fighting has strengthened Rangoon's hold on the country, but leaves the defeated nationalities little influence over the terms of their submission."
burma_struggle.20.a:0 "The army has secured the Union."
burma_struggle.21.t:0 "[GetNewspaperHeader]Blood of the Tyrants"
burma_struggle.21.d:0 "An ethnic insurgent army has defeated the Burmese government, forcing Rangoon to abandon its campaign to restore the Union by force. The government has accepted peace with the rebel movements.\n\nFor the insurgents, the defeat of the Tatmadaw establishes that Rangoon can no longer impose its authority on their territories.\n\nThe settlement leaves the Union broken, with the central government weakened and the country's armed movements beyond its effective control."
burma_struggle.21.a:0 "Rangoon can no longer hold the Union together."
burma_struggle.22.t:0 "[GetNewspaperHeader]A Federal Burma"
burma_struggle.22.d:0 "The Burmese government has reached a settlement with the country's armed movements, combining integration into the Union with arrangements for local autonomy. Organized resistance to Rangoon has come to an end.\n\nSupporters of federation invoke the spirit of the Panglong Agreement, arguing that the nationalities must participate in the Union as partners rather than submit to military rule.\n\nThe government now faces the work of administering a federal settlement whose durability depends on respecting the agreements that brought the fighting to a close."
burma_struggle.22.a:0 "A Union maintained by agreement."
burma_struggle.23.t:0 "[GetNewspaperHeader]Land to the Tillers"
burma_struggle.23.d:0 "The Burma Communist Party has taken Rangoon and brought the Union government to an end. The party's long campaign against the parliamentary authorities has culminated in control of the capital.\n\nThe territories of the former Union and the rival Red Flag communists have been absorbed under the victorious party's authority.\n\nThe communists now command the ministries and resources of the state they fought to overthrow, with responsibility for governing a country exhausted by civil war."
burma_struggle.23.a:0 "The communists hold Rangoon."
burma_struggle.24.t:0 "[GetNewspaperHeader]Orphaned No More"
burma_struggle.24.d:0 "The Kuomintang remnants organized as YANSA have established a state of their own in eastern Burma. Their forces hold Kengtung and Mong Hsat, securing a territorial base beyond the reach of Rangoon's administration.\n\nPeace with the Burmese government leaves the Nationalist troops in possession of their strongholds rather than compelling their withdrawal.\n\nWhat began as a refuge for soldiers driven from China has become an enduring military enclave on Burmese soil."
burma_struggle.24.a:0 "An army in exile has secured a state."
burma_struggle.25.t:0 "[GetNewspaperHeader]Never-Ending Conflict"
burma_struggle.25.d:0 "General Ne Win has seized power in Burma, ending parliamentary rule while the country's insurgencies remain unresolved. The Tatmadaw takes direct control of the government without having brought the armed movements to heel.\n\nThe military takeover supplies no settlement with the surviving insurgent movements.\n\nThe army inherits the campaigns it has been fighting, and the insurgents retain their reasons to resist."
burma_struggle.25.a:0 "Military rule, and still no peace."
