 USA_mkultra_restricted_charter: "Restricted MKUltra Charter"
 USA_mkultra_restricted_charter_desc: "A narrowly controlled CIA research charter is active. It grants no direct strategic modifier; all costs, exposure, findings, and disposition are represented through the classified-research dossier system."

 USA_mkultra_commission_missing_baseline: "Commission Front Grant: The Missing Baseline"
 USA_mkultra_commission_missing_baseline_desc: "Authorize a compartmented front grant for a limited behavioral study. This commits §Y35 Political Power§! through the decision's native cost, adds §R2 Exposure Pressure§!, occupies the sole dossier slot, and begins an exact §Y90-day§! research stage.\n\nThis ordinary front-grant dossier adds §Gno Recorded Harm/Liability§!. The payment and exposure cannot be refunded, rerolled, or restarted."
 USA_mkultra_missing_baseline_research: "The Missing Baseline — Research Underway"
 USA_mkultra_missing_baseline_research_desc: "The CIA-owned front grant is committed and its sole research stage is underway. At the end of §Y90 days§!, a guarded completion record will add §G12 Research Record§! exactly once and move the dossier into report review.\n\nTerminating the charter cancels the unfinished study without refunding its cost or removing its committed exposure."
 USA_mkultra_missing_baseline_review: "The Missing Baseline — Review the Initial Report"
 USA_mkultra_missing_baseline_review_desc: "§YSubmitted claim:§! The contractor reports a promising, limited effect.\n§YCurrent appraisal:§! [GetUSA_MKUltraMissingBaselineAppraisal]\n§YValidated application:§! None established by the initial report.\n\nThe report occupies the sole dossier slot. Within §Y30 days§!, authorize the single renewal, move directly to independent replication, accept an eligible sponsor concession, or archive it. If ignored, the records office archives it automatically."
 USA_mkultra_archive_missing_baseline: "Archive the Report"
 USA_mkultra_archive_missing_baseline_desc: "Record the current report's final archival disposition, release slot one, and close this dossier without an application benefit. This action costs §G0 Political Power§! and is idempotent: stale or duplicate calls cannot pay another reward or change the archived history."
 USA_mkultra_terminate_charter: "Terminate the Charter"
 USA_mkultra_terminate_charter_desc: "Permanently close the restricted charter at §G0 Political Power§!. Running research is cancelled without refund or Research Record; pending reports are archived without unpaid application benefits. All accumulated Research Record, exposure, harm, payment history, and future inquiry evidence remain. No classified-research action can reopen the charter."

 cwic_mkultra.100.t: "A Restricted Research Charter"
 cwic_mkultra.100.d: "With preparatory authority established and the April 1953 threshold reached, the CIA receives a restricted charter for compartmented behavioral research. The old standing operative bonus has been withdrawn in favor of accountable, finite dossiers.\n\nThe charter begins with one slot, explicit commitments, and permanent records. Authorization does not establish that any proposed application works; claims must remain distinct from appraisal and validated use."
 cwic_mkultra.100.a: "Open the restricted file."

 USA_mkultra_commission_missing_baseline_tt: "Commissioning immediately adds §R2 Exposure Pressure§!, adds §G0 Recorded Harm/Liability§!, and activates a §Y90-day§! mission."
 USA_mkultra_archive_missing_baseline_tt: "The report is archived permanently, slot one is released, and no application reward is granted."
 USA_mkultra_terminate_charter_tt: "The charter is permanently closed. Paid costs and accumulated consequences are preserved."
 USA_mkultra_charter_not_active_tt: "The restricted MKUltra charter must be active."
 USA_mkultra_slot_not_free_tt: "The sole dossier slot must be available."
 USA_mkultra_dossier_already_committed_tt: "The Missing Baseline can be commissioned only once."
