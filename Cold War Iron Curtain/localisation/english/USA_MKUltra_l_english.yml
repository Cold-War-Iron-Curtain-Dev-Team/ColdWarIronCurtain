l_english:
 USA_MKULTRA_MODE: "Project MKUltra System"
 RULE_OPTION_USA_MKULTRA_HISTORICAL: "Historical — Restricted Charter"
 RULE_OPTION_USA_MKULTRA_HISTORICAL_DESC: "Completing either existing United States MKUltra entry focus establishes preparatory authority. On or after 13 April 1953, the restricted charter and its finite classified-research loop become available. Historical mode includes the Phase 2 renewal, replication, countermeasure, and basic oversight content. The legacy permanent operative bonus is replaced while this mode is enabled."
 RULE_OPTION_USA_MKULTRA_OFF: "Off — Preserve Legacy Behavior"
 RULE_OPTION_USA_MKULTRA_OFF_DESC: "Preserves the existing focus events and the permanent §YProject MKUltra Research§! operative bonus. The new classified-research system is neither initialized nor displayed."
 RULE_OPTION_USA_MKULTRA_GATEWAY_EXPANDED: "Gateway Expanded — Phase 2 Core"
 RULE_OPTION_USA_MKULTRA_GATEWAY_EXPANDED_DESC: "Enables the same guarded Phase 2 core as Historical mode. This identifier reserves a route for later expanded authorization and Gateway content; no unimplemented material is fabricated in this release."

 USA_MKULTRA_RESEARCH: "Classified Research — The Gateway Update"
 USA_MKULTRA_RESEARCH_desc: "§YCharter status:§! [GetUSA_MKUltraCharterStatus]\n§YSlot one:§! [GetUSA_MKUltraSlotStatus]\n§YResearch Record:§! [?USA_mkultra_progress|0]/100\n§YExposure Pressure:§! [?USA_mkultra_exposure|0]/100 — [GetUSA_MKUltraExposureBand]\n§YRecorded Harm/Liability:§! [?USA_mkultra_harm|0]/100\n§YRecords status:§! [GetUSA_MKUltraRecordsStatus]\n§YOversight status:§! [GetUSA_MKUltraInquiryStatus]\n\nThe restricted charter uses a single finite dossier slot. Commissioning costs and exposure are committed immediately. Exposure at §R75 or higher§! and a live inquiry pause new starts. Closing the charter preserves all recorded consequences and can never be reversed."

