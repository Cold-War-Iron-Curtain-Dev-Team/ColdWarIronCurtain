 ZIM_Racial_Parternship_Theory: "Racial Partnership Theory"
 ZIM_Suggest_Federalization_of_British_Central_Africa: "Suggest Federalization of British Central Africa"
 ZIM_Suggest_Federalization_of_British_Central_Africa_desc: "Jim Griffiths, the Secretary of State for the Colonies, has informed the House of Commons that the British government has decided that there should be another examination of the possibility of a closer union between the Central African territories, and that a conference of the respective governments and the Central African Council was being arranged."
 ZIM_Begin_Negotiations: "Begin Negotiations"
 ZIM_Begin_Negotiations_desc: "Begin Negotiations to establish the federation."
 ZIM_Appeal_to_Cohen: "Appeal to Cohen"
 ZIM_Appeal_to_Cohen_desc: "An agreement would likely not have been reached without Sir Andrew Cohen, CO Assistant Undersecretary for African Affairs. He became one of the central architects and driving forces behind the creation of the Federation, often seemingly singlehandedly untangling deadlocks and outright walkouts on the part of the respective parties. Cohen, who was Jewish and traumatized by the Holocaust, was an anti-racialist and an advocate of African rights. But he compromised his ideals to avoid what he saw as an even greater risk than the continuation of the paternalistic white ascendancy system of Southern Rhodesia - its becoming an even less flexible, radical white supremacy, like the National Party government in South Africa."
 ZIM_Settle_on_Federal_Structure: "Settle on Federal Structure"
 ZIM_The_Federation_of_Rhodesia_and_Nyasaland: "The Federation of Rhodesia and Nyasaland"
 ZIM_The_Federation_of_Rhodesia_and_Nyasaland_desc: "The House of Commons has approved the conferences' proposals and passed motions in favor of federating the territories of Northern Rhodesia and Nyasaland. A referendum was held in Southern Rhodesia about this. Following the insistence and reassurances of the Southern Rhodesian Prime Minister, a little more than 25, white Southern Rhodesians voted in the referendum for a federal government, versus nearly 15, against. A majority of Afrikaners and black Africans in all three territories were resolutely against it. The Federation came into being when the Parliament of the United Kingdom enacted the Rhodesia and Nyasaland Federation Act, 1953. The Act authorized the Queen, by way of an order in council, to provide for the federation of the three constituent territories."
 ZIM_South_Rhodesian_Affairs: "South Rhodesian Affairs"
 ZIM_South_Rhodesian_Affairs_desc: "With the union now formed, it must focus on all 3 areas. Now we will look into South Rhodesian affairs."
 ZIM_Garfield_Todd: "Garfield Todd"
 ZIM_Garfield_Todd_desc: "Garfield Todd has won the South Rhodesian elections."
