 TRADE_PRICE_TT:0 "Price Per Unit in Billions"
 RSS_TRADE_TT:0 "§YRaw Resources§!\nPetrochemicals, Light Metals, Construction Metals, Rare Earths, Food and Nuclear Materials trade through the native Trade screen. Deals are paid in money each month at the world price."
 CON_TRADE_TT:0 "§YConsumer Goods§!\nBasic goods, durable goods, civilian vehicles and consumer electronics trade through the native Trade screen like raw resources. Use the resource filter below to list sellers for each."
 CWIC_TRADE_MONEY_BOX:0 "Imports: §R-$$[?cwic_tb_imp|1]M§!  Exports: §G+$$[?cwic_tb_exp|1]M§!\nNet: $$[?cwic_tb_net|+1]M  Import cap used: [?cwic_tb_cap_used|Y0%]"
 CG_TIER_ROW:0 "Quality:"
 CG_TIER_ROW_TT:0 "§YQuality§!\nSupplied tier / expected tier for each good.\n\nSupplied tier blends your own production tier with the world average tier of what you import. Falling behind the expected tier adds to shortage penalties."
 CG_SHORTAGE_ROW:0 "Shortage:"
 CG_SHORTAGE_ROW_TT:0 "§YShortage Level§!\n0 means supply and quality meet expectations; 5 is a systemic breakdown. It rises with unmet demand (Consumption C: below 100%) and with goods older than the expected tier.\n\nThe worst level among the four goods drives the §YConsumer Goods Shortage§! crisis on the Finance screen."
 CG_EFFECTS_BOX:0 "Strategy: §Y[GetCgStrategyName]§!\nStability: [?CWIC_DM_CG_STABILITY_FACTOR|%1]  Productivity: [?CWIC_DM_CG_PRODUCTIVITY_FACTOR|%1]"
 CG_STRAT_TITLE:0 "Consumer Industry: §Y[GetCgStrategyName]§!"
 CG_STRAT_TITLE_TT:0 "§YConsumer Industry Strategy§!\nHow factories split consumer goods output between basic goods, durables, civilian vehicles and consumer electronics. Shortfalls are covered by imports through the Trade screen (Consumer view)."
 cg_strat_name_0:0 "Balanced"
 cg_strat_name_1:0 "Basic Needs"
 cg_strat_name_2:0 "Durables"
 cg_strat_name_3:0 "Export-Led"
 CG_STRAT_BALANCED:0 "Balanced"
 CG_STRAT_BASIC:0 "Basic Needs"
 CG_STRAT_DURABLES:0 "Durables"
 CG_STRAT_EXPORT:0 "Export-Led"
 CG_STRAT_BALANCED_TT:0 "§YBalanced§!\nFactories split output by the automatic weights: shortages first, then what the population's development level calls for.\n\n§gA strategy can be changed once every 6 months.§!"
 CG_STRAT_BASIC_TT:0 "§YBasic Needs§!\nShift factories toward everyday goods and household durables. Vehicles and electronics are mostly left to imports.\n\nBasic §G+60%§!  Durable §G+20%§!  Vehicles §R-50%§!  Electronics §R-50%§!\n\n§gA strategy can be changed once every 6 months.§!"
 CG_STRAT_DURABLES_TT:0 "§YConsumer Durables§!\nBuild up appliance and household-machinery production, the usual second rung of industrialisation.\n\nBasic §R-10%§!  Durable §G+60%§!  Vehicles §G+10%§!  Electronics §R-20%§!\n\n§gA strategy can be changed once every 6 months.§!"
 CG_STRAT_EXPORT_TT:0 "§YExport-Led High-Tech§!\nPrioritise cars and electronics, the most valuable goods per factory on the world market. Basic goods may need importing.\n\nBasic §R-20%§!  Durable §R-15%§!  Vehicles §G+80%§!  Electronics §G+80%§!\nVehicles need office parks and automotive capability; electronics also need rare earths.\n\n§gA strategy can be changed once every 6 months.§!"
