	INO_Death_of_Sudirman: "Death of General Soedirman"
	INO_Death_of_Sudirman_desc: "§RIt has happened...§!\n\nSoedirman, one of our most revered generals, has passed away. For years, he led our struggle for independence through brutal guerrilla warfare. He faced formidable opponents on two fronts: the Dutch colonial forces and the relentless disease of tuberculosis. His unwavering courage and strategic brilliance inspired countless others to join the fight for freedom.\n\nDespite our triumph over the Dutch, Soedirman ultimately succumbed to tuberculosis. His loss is deeply felt across the nation, as he not only symbolized resilience and determination but also embodied the spirit of our fight for liberty. His legacy will forever live on in the hearts of those he inspired and in the history of our independence."
