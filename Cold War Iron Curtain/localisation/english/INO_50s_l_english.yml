l_english:
  #spirit
	INO_Independence_or_Death: "Independence or Death"
	INO_Independence_or_Death_desc: "§RKami menderita kekalahan, tapi kami tidak pernah mengaku kalah. Kami senantiasa menjimpan dalam djiwa kami, tjita² Indonesia merdeka, berdaulat, adil, dan makmur!§!\n§W-Mohammad Hatta, August 17th 1949§!"
	INO_Roem_van_Roijen_Agreement: "Roem Van Roijen Agreement"
	INO_Roem_van_Roijen_Agreement_desc: "Roem and van Roijen were two distinct individuals with different ideas, yet they found common ground and met to discuss the fate of Indonesia.\n\nMany view this agreement as just another failed attempt, similar to the Linggadjati and Renville agreements. However, some still hold out hope for this agreement, not because they believe the Dutch will honor it, but because they trust that diplomacy can triumph over guns and tanks. The future of the Republic, once again, hangs in the balance."
	INO_Federalism: "Federal System in a Unitary State"
	INO_Federalism_desc: "In the 1945 Constitution, Indonesia is classified as a Unitary State. However, this goal of establishing a Unitary State is hindering the path to true independence. During the Roundtable Conference, the Dutch pressured us to reform our system into a federal one, similar to that of the United States. At last, this was the price we had to pay for independence, right?"
	INO_Federalism_2: "Federal System in a Unitary State"
	INO_Federalism_2_desc: "In the 1945 Constitution, Indonesia is classified as a Unitary State. However, this goal of establishing a Unitary State is hindering the path to true independence. During the Roundtable Conference, the Dutch pressured us to reform our system into a federal one, similar to that of the United States. At last, this was the price we had to pay for independence, right?"
	INO_Federalism_3: "Federal System in a Unitary State"
	INO_Federalism_3_desc: "In the 1945 Constitution, Indonesia is classified as a Unitary State. However, this goal of establishing a Unitary State is hindering the path to true independence. During the Roundtable Conference, the Dutch pressured us to reform our system into a federal one, similar to that of the United States. At last, this was the price we had to pay for independence, right?"
	INO_United_and_Indivisible: "United and Indivisible"
	INO_United_and_Indivisible_desc: "At long last, we have reached a momentous turning point in our nation's history, marking the abolition of the RIS Constitution and the establishment of the Provisional 1950 Constitution. Indonesia stands united once again as a singular Unitary Republic. However, this is just the beginning of our journey. \n\nWhile we have drafted a new constitution that reflects our current aspirations and needs, it is essential to recognize that this Constitution is not set in stone. One way or another, we will eventually change this Constitution."
	INO_Bandung_Sea_of_Fire: "Bandung Sea of Fire"
	INO_Bandung_Sea_of_Fire_desc: "§RHalo, halo Bandung, ibukota P'riangan\nHalo, halo Bandung, kota kenang-kenangan\nSudah lama beta tidak berdjumpa dengan kau\nSekarang telah mendjadi lautan api\nMari bung rebut kembali!§!\n\nThree years ago, faced with the imminent arrival of British and Dutch forces, our Republican fighters made a grave yet resolute decision—they razed the southern half of Bandung. It was not out of recklessness or despair, but a calculated sacrifice to deny the enemy comfort, shelter, and control."
	INO_Bandung_Sea_of_Fire_2: "Bandung Sea of Fire"
	INO_Bandung_Sea_of_Fire_2_desc: "§RHalo, halo Bandung, ibukota P'riangan\nHalo, halo Bandung, kota kenang-kenangan\nSudah lama beta tidak berdjumpa dengan kau\nSekarang telah mendjadi lautan api\nMari bung rebut kembali!§!\n\nNow that the struggle has borne its fruit and the Republic stands recognized and sovereign, we look back with solemn pride to the fires that once lit the skies of Bandung. With victory now secured, that moment stands not as a tragedy, but as a monument to courage. The charred remains of Southern Bandung remind us of the price we paid for liberty—a price not counted merely in lives or property, but in the determination to build a nation unbowed by force. "
	INO_A_New_Generation_of_Thinkers: "A New Generation of Thinkers"
	INO_A_New_Generation_of_Thinkers_desc: "Indonesian education has faced significant challenges and has not been viewed as admirable historically. However, following the transfer of sovereignty and the establishment of an independent educational system, the government has made concerted efforts to enhance the growth of education in the country. This has included the replacement of the old colonial curriculum with one that is more suited to the needs and context of the Indonesian people. For the first time in Indonesian history, this shift has allowed native Indonesians access to higher education opportunities, enabling them to attend universities and pursue advanced studies."
	INO_Diplomacy_the_Cure_of_Dishonesty: "Diplomacy the Cure of Dishonesty"
	INO_Diplomacy_the_Cure_of_Dishonesty_desc: "The Republic of Indonesia despite proclaiming its independence in 1945, has had no friends, except §Y[RAJ.GetNameWithFlag]§!, §G[EGY.GetNameWithFlag]§!, and limited recognition from §C[USA.GetNameWithFlag]§!. Following the establishment of the Republic of the United States of Indonesia, the Indonesian government has approached several countries for diplomatic recognition."
	INO_Memory_of_Madiun_Affair: "Memory of Madiun Affair"
	INO_Memory_of_Madiun_Affair_desc: "In 1948, Musso returned from his exile in the Soviet Union, where he studied and was loyal to the ideals of Marxism-Leninism promulgated by the Soviet government. As he was back in Yogyakarta, he met Sukarno in a series of complicated business, especially in Madiun. Former Prime Minister Amir Sjarifuddin and Musso formed the People's Democratic Front, intended as an organization that defied the Soekarno-Hatta leadership. Nevertheless, they attacked the TRI stationed near Madiun, and when the storm calmed, the TRI went on a witchhunt and hunted down every single member of PDF including Sjarifuddin and Musso himself, as PKI went underground."
	####East Indonesia####
	INS_Negara_Ikut_Tuan: "Negara Ikut Tuan"
	INS_Negara_Ikut_Tuan_desc: "The name "Negara Ikut Tuan" became a symbolic catchphrase for the Republican government in Jakarta in referring to us, but the word is truer than ever.\n\nIn reality, we are a territory within the Dutch Empire. Sooner or later, with the aftermath of Roem van Roijen, we can finally achieve our goals of the United States of Indonesia."
	INS_Independent_In_Name: "Independent, but in name"
	INS_Independent_In_Name_desc: ""
