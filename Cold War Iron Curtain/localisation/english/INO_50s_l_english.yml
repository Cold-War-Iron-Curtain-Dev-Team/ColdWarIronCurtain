	Indonesia_debug_decisions: "Sukarno Affairs"
	Indonesia_debug_decisions_desc: "\n\n\n\n\n\n\n\n£Sukarno_Affairs\n\n\n\n\n\n\n\n\n\nBeing a President is no easy task; that is why Sukarno, for the better word, finds relief in finding a beautiful woman to wed. Without a partner to accompany him, Sukarno will not feel energetic in doing his duty. Perhaps he could as well wed Larissa Rochefort.\n\n\nCurrent Prime Minister: §Y[INO.GetLeader]§!\n[?indonesia_party_seats|%1]\n\nINO_Approval_factor_var: [?INO_Approval_factor_var|%1]\n\nINO_Approval_factor_var_temp: [?INO_Approval_factor_var_temp|%1]\n\nINO_Approval_factor_speed_var: [?INO_Approval_factor_speed_var|%1]\n\nINO_Approval_Consumer_Goods_factor_var: [?INO_Approval_Consumer_Goods_factor_var|%1]\nINO_Approval_Consumer_Goods_factor_var: [?INO_TNI_Approval|%1]"
