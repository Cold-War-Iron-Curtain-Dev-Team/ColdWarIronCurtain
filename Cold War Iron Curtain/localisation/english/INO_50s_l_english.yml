	####ARMED FORCES####
	INO_APRI_desc: "Originally formed during the tumultuous Bersiap era, the Indonesian Armed Forces emerged as a protector of people’s safety amidst chaos and uncertainty. The years of fierce guerrilla warfare against the Dutch colonial forces not only forged a sense of national identity but also established a remarkable reputation for the Armed Forces. Their valor and resilience in the face of adversity became a source of pride for the nation, laying the groundwork for a military institution that embodies the spirit and determination of the Indonesian people. This period, despite its brutality, solidified the Armed Forces’ role as a defender of sovereignty and was pivotal in shaping the narrative of Indonesia’s independence.\n\nAs the nation moves forward from the revolutionary past, it is crucial to transition the Indonesian Armed Forces into a modern and capable military structure that can effectively respond to contemporary challenges, particularly in the context of an emerging Cold War."
	INO_Ground_Forces_desc: "The Indonesian Army is arguably the most influential component of the nation's Armed Forces, serving as the backbone and primary fighting force in defending the country's sovereignty and addressing various challenges. Its role extends beyond combat, as the Indonesian Army significantly shapes national security policies and plays a key part in maintaining stability within the country."
