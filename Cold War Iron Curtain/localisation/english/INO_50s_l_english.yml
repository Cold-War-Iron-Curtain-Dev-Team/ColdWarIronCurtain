	######Rebellion######
	Indonesia_Rebellion_decisions: "Rebellion in Indonesia"
	Indonesia_Rebellion_decisions_desc: "\n\n\n\n\n£Rebellion_INO\n\n\n\n\n\n\nThe conclusion of the most tumultuous period in our history marks a significant turning point for our Republic, which remains in its formative years and finds itself navigating the complex dynamics of the Cold War. As a diverse nation, we are composed of various ethnic groups, each with its own unique culture and traditions. Despite these differences, we are steadfast in our commitment to building a cohesive state, bound together by a singular superceding national identity characterized by a shared homeland, one flag, and one official language.\n\nHowever, the path to unity is fraught with challenges. Certain ethnic and religious groups within our society have resisted this vision, leading to tensions and conflicts that threaten our stability. Some have gone so far as to take up arms in defiance of the central authority. It is imperative that we address these challenges decisively; failing to do so could lead to the dissolution of our young Republic and jeopardize Indonesia's existence as a unified nation.\n\n§Y[830.GetName]§! is owned by the §Y[830.owner.GetNameWithFlag]§!\n§Y[1979.GetName]§! is owned by the §Y[1979.owner.Get§NameWithFlag]§!\n§Y[672.GetName]§! is owned by the §Y[672.owner.GetNameWithFlag]§!\n§Y[836.GetName]§! is owned by the §Y[836.owner.GetNameWithFlag]§!\n§Y[844.GetName]§! is owned by the §Y[844.owner.GetNameWithFlag]§!\n§Y[668.GetName]§! is owned by the §Y[668.owner.GetNameWithFlag]§!\n§Y[669.GetName]§! is owned by the §Y[669.owner.GetNameWithFlag]§!\n§Y[858.GetName]§! is owned by the §Y[858.owner.GetNameWithFlag]§!"
	darul_islam_0: "Darul Islam Making Moves!"
	darul_islam_0_desc: "The Forces of Kartosoewirjo are preparing another attack in West Java; we must stop him before he can take another town and village."
	darul_islam_1: "Strike Darul Islam"
	darul_islam_1_desc: "§W-----------------------§!\n\n\n\n£Indonesia_DI1\n\n\n\n\n\n§W-----------------------§!\nThe Rise of §RDI§!/§WTII§!, commonly known as §RDarul§! §WIslam§! or §W[DAR.GetNameWithFlag]§!, poses a serious threat to the central government; this rebellion wasn't the first and probably wouldn't be the last to arise, as such, we need to take measures against them."
	darul_islam_2: "Raid Their Hideout"
	darul_islam_2_desc: "§W-----------------------§!\n\n\n\n£Indonesia_DI2\n\n\n\n\n\n§W-----------------------§!\nWith §RDarul§! §WIslam§! nearly gone, we should therefore take action to end their rule once and for all and establish our control in the eastern part of West Java. Although it doesn't mean that they will be fully eradicated, such measures will surely end their problematic presence."
	darul_islam_3: "Finish Off Darul Islam"
	darul_islam_4: "Offer Amir Fatah to Surrender"
	darul_islam_4_desc: "§W-----------------------§!\n\n\n\n£Indonesia_DI3\n\n\n\n\n\n§W-----------------------§!\nAmir Fatah, also known as Suhario, is one of the commanders of the DI/TII groups. Suhario became the Hisbullah Commandant in the Sidoarjo and Mojokerto regions and field leader of Hisbullah during the Battle of Surabaya. In 1946, Sudirman sent Suhario to West Java to ensure West Java loyalty to Indonesia.\n\nThere he met Kartosoewirjo, the Imam of the Darul Islam, although for several time he tried to convince Kartosoewirjo not to proclaim the Islamic State, he relented after meeting with one of his envoys.\n\nThis, however, is not the full story. Amir Fatah had a rough opinion on the DI/TII reorganization. With his dismay, we could convince him to surrender and pardon him, which will be a blow to the DI/TII leadership."
	darul_islam_5: "Sabotage Darul Islam"
	darul_islam_5_desc: "§W-----------------------§!\n\n\n\n£Indonesia_DI\n\n\n\n\n\n§W-----------------------§!\nDarul Islam maintains a significant and resilient presence in West Java. While their operational style resembles ours, they possess an additional advantage: the use of religion as a tool for influence and recruitment. To effectively counter their impact, it is crucial to educate local communities about our objectives and values, highlighting the potential dangers posed by Darul Islam's ideology. By raising awareness and fostering critical thinking among the people in various towns and villages throughout West Java, we can effectively diminish their influence."
	south_maluku: "Send Marines to Ambon"
	south_maluku_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Maluku1\n\n\n\n\n\n§W-----------------------§!\nOn 25th April 1950, following the imminent annexation of East Indonesia to the Republic of Indonesia, federalist Chris Soumokil, Johanes Manuhutu and others formed the Republic of South Maluku, a secessionist state intending to detest the central Jakarta government, as such we can't let this go any further; one way or another, Ambon must be taken. That task falls to the Marine Corps."
	jail_soumokil: "Find Soumokil Hiding Place"
	south_maluku_0: "United States issued Ceasefire!"
	south_maluku_0_desc: "Inability to restore peace in Maluku could resort to a foreign intervention, which is why we need to capitulate Maluku as quickly as possible.\n\n§RPS; If you cant capitulate within given timeframe, dont play hoi4§!"
	aceh_rebellion_0: "Daud Bereuh Rebellion in Aceh"
	aceh_rebellion_0_desc: ""
	aceh_1: "Send AA Brigade to Seize Illegal Acehnese Weapons"
	aceh_1_desc: "§W-----------------------§!\n\n\n\n£Aceh1\n\n\n\n\n\n§W-----------------------§!\nIt has come to our attention that the Governor of Aceh, Daud Bereuh has stored illegal black market weapons within Aceh, even if he denied he didn't had one, our intel suggest that he is planning a rebellion against the Unitary State. We must seize these weapons before they could be used."
	######Politics#######
	Indonesia_Politics_decisions: "Indonesian Political Issue"
	Indonesia_Politics_decisions_desc: "\n\n\n\n\n£Indonesia_Politics\n\n\n\n\n\n\n\n\n£Indonesia_Government\n\n\n\nCurrent President: §Y[GetINO_PRES]§!\nCurrent Vice President: §Y[GetINO_VP]§!\nCurrent Prime Minister: §Y[INO.GetLeader]§!\n\nCurrent Cabinet: §Y[GetINOCabinetTitle]§!\n\n\n[Get_INO_DEPUTY_PM]  [Get_INO_FINANCE]  [Get_INO_DEFENSE]  [Get_INO_EDUCATION]  [Get_INO_RELIGION]  [Get_INO_FOREIGN]  \n\n\n£INO_Approval_Rating §GApproval§! Rating: [?INO_Approval_factor_var|+|0%]\n£INO_Stability §2Stability§! Gained From Cabinet Trust: [?INO_Approval_factor_speed_var|+|%2]\n£industry §8Consumer Goods§! Affected By Cabinet Trust: [?INO_Approval_Consumer_Goods_factor_var|%1]\n\nCurrent Legislature: §9[GetDPRNameINO]§!\nCurrent Constitution: §G[GetINOConstitution]§!\n\nIndonesia is, for many of us, not just a country but our home, our only home. However, despite its rich cultural heritage and potential for growth, we face serious challenges that hinder our progress. Among these are systemic abuses, widespread corruption, entrenched nepotism, and a troubling culture of arrogance. These issues undermine the trust in our institutions and stifle the opportunities for many citizens.\n\nFor Indonesia to truly prosper and realize its full potential, it is imperative that we confront these problems head-on. This requires a collective effort from all sectors of society, including government, civil society, and the private sector. We must foster transparency, accountability, and integrity in our institutions while promoting equal opportunities for every citizen. Only through resolute action and commitment can we hope to overcome these obstacles and build a brighter future for our beloved nation."
	Indonesian_Politics_Parties: "PNI Popularity: [?INO_Party_SUPPORT_LOCAL^6|+%2]\nPKI Popularity: [?INO_Party_SUPPORT_LOCAL^1|+%2]\n"
	Indonesia_Politics_1: "The Natsir Integrity Motion"
	Indonesia_Politics_1_desc: "§W-----------------------§!\n\n\n\n£Natsir_Motion\n\n\n\n\n\n§W-----------------------§!\nPrime Minister Mohammad Hatta assigned Natsir and Sri Sultan Hamengkubuwono IX to lobby to resolve various crises in the region. Experience around the area adds to Natsir's network. In addition, his ability to negotiate with faction leaders in the RIS Parliament, such as IJ Kasimo from the Catholic party faction and AM Tambunan from the Christian Party, has pushed Natsir to one conclusion, the states are willing to dissolve themselves to unite with RI-as long as they are not told to dissolve themselves."
	Indonesia_Politics_2: "Send Hatta to Pasundan"
	Indonesia_Politics_2_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Hatta\n\n\n\n\n\n§W-----------------------§!\nWith Natsir's inability to form a coherent phase to formally reintegrate the States, Mohammad Hatta, working with Sukarni, and Raden Mas Sartono have come to the conclusion that the Prime Minister must go to Pasundan and hear the people's wishes.\n\nThis is the only way if we want to reintegrate the States back to the Republic of Indonesia, especially the State of Pasundan."
	Indonesia_Politics_3: "Join the United Nation"
	Indonesia_Politics_3_desc: "§W-----------------------§!\n\n\n\n£Indonesia_UN\n\n\n\n\n\n§W-----------------------§!\nAs we have finally gained our noble independence, one important task remains: joining the United Nations. This step is essential for establishing our position in the emerging Cold War. As a free and independent nation, we are committed to the betterment of Indonesia and to promoting peace worldwide."
	Indonesia_Politics_4: "Formally Establish Relation With USSR"
	Indonesia_Politics_4_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Soviet\n\n\n\n\n\n§W-----------------------§!\nThe bonds between the Soviet Union and our country may not be as strong as it did with India or Egypt, but the bonds between the Russian people and the Indonesian people have been maintained since the 19th Century.\n\nIn 1806, Ivan Krusenstern and Yuri Lisyansky washed up on our shores during the first Russian circumnavigation of the Earth. Then, in 1818, Kotsebu led his scientific expedition. People may say this is just an exploration and nothing big. However, in the late 19th century, N.N. Mikluho-Maclay, A.I. Voeikov, and V.A. Karavaev conducted research on Java and other islands in the archipelago.\n\nRussia's great interest in Indonesia was proven with the opening of the first consulate in 1894 in Batavia, which was then the capital of the Dutch East Indies. Ahead of the consulate’s opening, the Russian ships Pamyaty Azova and Vladimir Monomah came to Batavia in 1890 carrying Crown Prince Nikolay II, who would later become the Emperor of Russia, on his journey to countries in the East.\n\nIt is on our best interest that we pursue this relation further, as a matter of fact, Soviet influence in our country could only benefit our nascent Industrial and Armed Forces capability."
	Indonesia_Politics_5: "Contain PKI Influence"
	Indonesia_Politics_6: "Integrate the Sultanate of Buton"
	Indonesia_Politics_6_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Buton\n\n\n\n\n\n§W-----------------------§!\nFor most of its history, the Sultanate of Buton was the only independent sultanate within the Dutch East Indies. Although it claimed never to have formally submitted to Dutch rule, the Sultanate is undoubtedly one of the many regions that were part of the former Dutch East Indies.\n\nBy formally integrating the Sultanate, we will complete our struggle for a single, Unitary State."
	Indonesia_Politics_7: "Abolish the Sultanate of Buton"
	Indonesia_Politics_8: "Vote of No Confidence"
	Indonesia_Politics_8_desc: "The People's Representative Council and President [GetINO_PRES] have announced that they will be taking away our mandate unless we can gather a necessary amount of support within a month."
