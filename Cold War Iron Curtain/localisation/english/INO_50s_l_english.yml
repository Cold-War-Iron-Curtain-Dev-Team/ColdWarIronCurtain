	#events
	darul_islam.1.t: "Proclamation of the Islamic State of Indonesia"
	darul_islam.1.d: "In the name of Allah, the Most Gracious, the Most Merciful\n\nI bear witness that there is no deity but Allah, and I bear witness that Muhammad is the messenger of Allah\n\nWe, the Muslims of Indonesia\n\nHEREBY DECLARE:\n\nThe establishment of the "ISLAMIC STATE OF INDONESIA"\n\nTherefore, the law in effect in\n\nthe Islamic State of Indonesia is:\n\n§GISLAMIC LAW§!\n\nAllahu Akbar! Allahu Akbar! Allahu Akbar!\n\nIn the name of the Muslims of Indonesia\n\nIMAM OF THE ISLAMIC STATE OF INDONESIA\n\n£Kartosoewirjo_Signature\n\n\n(SM. KARTOSUWIRJO)\n\nMADINAH-INDONESIA 12 SHAWWAL 1368|7 AUGUST 1949"
	darul_islam.1.a: "Mashallah"
	indonesia_apra.2.d: "Our strategic initiative to delay the scheduled meetings while simultaneously alerting the Dutch official has yielded positive outcomes. Despite the initial success of Westerling forces in capturing Bandung during their first assault, we had anticipated this possibility. Thanks to our thorough preparations and contingency plans, we have been able, by God grace, to thwart any attempts by the Westerling forces to target government officials. This proactive approach has not only protected key individuals but also strengthened our position in the ongoing situation. Our efforts underscore the importance of vigilance and readiness in the face of potential threats."
	indonesia_lib.1.d: "In the Republican heartlands, many perceived the federal structure imposed by the Round Table Conference not as a true expression of Indonesia's unity, but as a lingering Dutch tactic intended to fragment and weaken the nascent nation. The United States of Indonesia, with its mix of states and territories, led to political disunity and empowered regional leaders to disregard the central government in Yogyakarta.\n\nRepublican leaders recognized the urgency of the situation and swiftly denounced federalism as a colonial vestige incompatible with the revolutionary spirit. Through a blend of political negotiation, effective public persuasion, and decisive pressure, the republic set out to unify the federal states under a singular Republic of Indonesia. By mid-1950, the majority of states were convinced to dissolve and merge with the central authority, motivated by mass demonstrations, growing nationalist sentiment, and the promise of a more stable future.\n\nThe complete integration of the State of East Indonesia signaled the end of the federal system. In Jakarta, now the capital of a unified republic, this achievement was hailed as a triumph of revolutionary ideals, affirming that Indonesia's independence would henceforth be governed under one flag and one cohesive government."
	indonesia_lib.2.d: "Today, Prime Minister Mohammad Hatta will travel to Pasundan to engage in discussions regarding the reintegration of the State of Pasundan into the Republic of Indonesia. This move comes in the wake of the unsuccessful coup attempt by the Angkatan Perang Ratu Adil, which had aimed to assassinate the leaders of RUSI and form a Pro-Dutch Indonesia.\n\nIn light of the recent events, a significant number of Sundanese citizens have shown a renewed interest in rejoining the Republic as a province. This sentiment reflects a shift in public opinion, as many now prefer the stability and support that comes with being part of the larger nation, rather than pursuing a semi-independent state structure.\n\nDuring his visit, Prime Minister Hatta is expected to address the concerns and aspirations of the Sundanese people, reassuring them of the central government's commitment to their welfare and integration. The discussions will likely focus on the potential benefits of reintegration, including economic development, infrastructure support, and cultural recognition within the framework of the Republic."
	indonesia_news.2.d: "On a humid December day, with the weight of revolution still fresh and negotiations barely settled, the United States of Indonesia was officially proclaimed. It was a moment long awaited—Dutch sovereignty had ended, and Indonesia was now, on paper, a free and independent nation. But the form it took was not the singular Republic envisioned in 1945—it was a federal state, pieced together from disparate parts, born more of diplomacy than unity.\n\nThe proclamation followed the outcomes of the Round Table Conference in The Hague, where the Dutch agreed to transfer sovereignty—not directly to the Republic of Indonesia based in Yogyakarta, but to a broader federation consisting of both the Republic and several Dutch-sponsored federal states. This structure, while formally recognizing Indonesia's independence, reflected Dutch efforts to retain influence by dividing the archipelago into multiple entities under a single flag.\n\nThus, on that day, Sukarno was inaugurated not as President of the 1945 Republic, but as the President of the United States of Indonesia, a compromise title in a compromise state."
	indonesia_news.3.d: "Following the death of President Soekarno, the founding father of the Republic and a towering symbol of Indonesia's revolutionary struggle, the nation has entered a period of deep transition. In the immediate aftermath of his passing, the reins of power have been handed to Air Marshal Omar Dhani, commander of the Indonesian Air Forces, who has now assumed the presidency.\n\nReports suggest that Dhani's rise to the presidency was not solely the product of institutional process, but was shaped by the personal will and political endorsement of Soekarno himself, expressed in the final period of his leadership. As a close confidant and loyal supporter of Soekarno, Omar Dhani represented continuity within the revolutionary camp—an individual who had been deeply involved in shaping Indonesia's defense posture and had long aligned himself with the nationalist and anti-imperialist course charted by the late president.\n\nFor the first time, the presidency is now held by a senior military officer, a figure whose career was defined not in the civilian sphere, but in the cockpit of the Air Force and the strategic halls of national defense. Dhani's leadership is expected to carry forward many of Soekarno's ideals."
	indonesia_news.4.d: "For decades, many regarded Indonesia as the leading anti-imperialist state in Southeast Asia. After years of research and with assistance from China, Indonesia has strengthened this reputation with the detonation of PBN-45, now known as Project Gatot Kaca, on the Island of Riau.\n\nWith this achievement, Indonesia has become the sixth country in the world—after the United States, Soviet Union, France, United Kingdom, and China—to possess its own nuclear arsenal. President Soekarno has declared that the forces of imperialism will be defeated and that a new order of a free, socialist, and revolutionary society will take root. China has congratulated Indonesia on this milestone, while both the Soviet Union and the United States have responded with muted reactions."
	indonesia_news.8.t: "[GetNewspaperHeader] Indonesia Abolished Federal System"
	indonesia_news.8.d: "Following the transfer of sovereignty on December 27, 1949, Indonesia transitioned back to a unitary state after a brief eight-month period as a federal state—a status that had been imposed by the Dutch colonial administration. This shift marked a significant moment in the nation’s history, emphasizing Indonesia's commitment to its unity and independence.\n\nDuring this pivotal period, Prime Minister Mohammad Hatta visited Pasundan, a region that had been resistant to integration into the Republic of Indonesia. Through his diplomatic efforts and engagement with local leaders, Hatta successfully garnered support for the region's reintegration. His visit was crucial in winning over lawmakers in Parliament, who recognized the importance of unity for the fledgling nation. As a result, Parliament approved Hatta's continued tenure as Prime Minister, which was further endorsed by President Sukarno, thereby solidifying the government’s leadership during this transformative time.\n\nThe formal declaration of this reintegration was made during the nation’s fifth Independence Anniversary, celebrated on August 17, 1950."
	indonesia_news.8.a: "Free of Dutch to Pursue its Dream"
	indonesia_news.9.t: "[GetNewspaperHeader] Indonesia Abolished Federal System"
	indonesia_news.9.d: "Following the transfer of sovereignty on December 27, 1949, Indonesia became a Unitary State once again after eight months of being a Federal State, a status imposed by the Dutch.\n\nThe Ability of Mohammad Natsir to issue a motion of integrity highly influenced the nation's transformation back to a Unitary State. President Sukarno appointed Natsir to lead the new government, with Mohammad Hatta being the interim Prime Minister until a new Cabinet is formed.\n\nThe Declaration was made during the nation's fifth Independence anniversary, on the 17th of August 1950."
	indonesia_news.9.a: "A Nation of Dreamers."
	indonesia_news.10.t: "[GetNewspaperHeader] Maluku Uprising"
	indonesia_news.10.d: "In the wake of the State of East Indonesia's formal motion to join the Republic of Indonesia, several pro-Federalist groups from the Maluku Islands took significant action by issuing a decree that declared the independence of South Maluku, led by Johanis Manuhutu. This declaration came just a few weeks after the Ambon Uprising, a violent conflict that underscored the tensions in the region over issues of governance and autonomy.\n\nIn response to the escalating situation, the President of East Indonesia, Tjokorda Gde Raka Soekawati, communicated directly with the central government in Djakarta, emphasizing that East Indonesia does not support or condone the rebellion being waged by these groups. He reaffirmed East Indonesia's commitment to fully integrating into the Republic of Indonesia, signaling a desire for stability and unity in the face of rising separatist sentiments in the region."
	indonesia_news.10.a: "Unwilling to Go."
	indonesia_news.11.t: "[GetNewspaperHeader] [INO.GetLeader] Signed Supersemfeb, Army Takes Control!"
	indonesia_news.11.d: "Following the failure of the Indonesian Armed Forces to regain control of South Maluku, a significant turning point occurred with the facilitation of the Surabaya Declaration by the United Nations. This declaration marked an important diplomatic effort to address the escalating tensions in the region.\n\nIn a dramatic turn of events, the Army, led by Abdul Haris Nasution, exerted intense pressure on the government, leading to the resignation of key officials. The Indonesian Prime Minister, both President Soekarno and Vice President Mohammad Hatta stepped down in disgrace, which effectively brought an abrupt end to a brief and tumultuous period of democratic governance in Indonesia.\n\nIn the wake of these developments, Prime Minister Nasution announced his commitment to initiating early elections and implementing a comprehensive restructuring of the government system. This promise aimed to restore stability and legitimacy to the political process. However, the announcement was met with strong backlash as various political parties, including the PKI, Masyumi, PNI, and PSI, took to the streets to protest against the government's actions, expressing their dissent and calling for a more inclusive political framework."
	indonesia_news.11.a: "This one successful."
	indonesia_news.7.t: "[GetNewspaperHeader]Rebellion of Darul Islam"
	indonesia_news.7.d: "The ongoing inability of the Djakarta government to effectively quell the escalating Islamist insurgency in West Java has triggered a substantial uprising throughout the region. In light of the deteriorating security situation, the Governor of West Java, Mr. Sewaka, took the decisive step of declaring martial law in an attempt to regain control and stabilize the area. However, this move was met with significant backlash, leading to Mr. Sewaka's removal from office shortly thereafter. Being succeeded by Sanusi Hardjadinata, who is expected to implement strategies aimed at restoring order and addressing the underlying issues that have fueled the unrest.\n\nIn an effort to manage the crisis, the President has recalled the Army, which is under the command of General A.H. Nasution. Their primary mission is to restore peace and security in West Java amid the ongoing turmoil. To reassure the public and foster a sense of calm, Prime Minister [INO.GetLeader] addressed the nation through a morning broadcast on RRI Radio, urging citizens to remain composed and patient while the government takes measures to resolve the crisis."
	indonesia_news.7.a: "Bleak Days for Indonesia."
	indonesia_news.13.t: "[GetNewspaperHeader]Indonesian Takeover of Papua!"
	indonesia_news.13.d: "As the war continues in Europe, the world’s attention remains focused there. Amidst this turmoil, the [INO.GetName] has taken significant action. Today, General Nasution announced the takeover of the former Dutch New Guinea. In response, the Dutch Prime Minister-in-exile, Mr. [SUR.GetLeader], has condemned this move, claiming it is part of a Soviet ploy and interference in Asia.\n\nIndonesian President Soekarno has officially declared the completion of Operation Trikora. In a speech delivered to thousands of Indonesians, he proclaimed:\n\n"It is over! Yes, it is over—300 years of colonialism, pillage, and slavery have come to an end today! The people of Indonesia have taken matters into their own hands, and by the grace of Almighty God, Indonesia is now fully free from colonialism.""
	indonesia_news.13.a: "An Empire Crumble Once More..."
	indonesia_news.14.t: "[GetNewspaperHeader]Indonesia Captured Ambon, Soumokil Went to Hiding!"
	indonesia_news.14.d: "Following the landing of the Indonesian Armed Forces in Ambon, the Provisional Government of the self-proclaimed Republic of South Maluku swiftly faced a dire predicament. As the Indonesian military intensified its campaign, the leaders and members of the Republic's armed forces were compelled to retreat into the dense jungles of Maluku. This strategic withdrawal did not signify surrender, however; rather, it marked the beginning of a prolonged struggle. At the forefront of this resistance was their leader, Chris Soumokil, who went into hiding, rallying his loyal supporters and committing to a guerilla war against the encroaching Indonesian army.\n\nDespite the challenges of operating from the shadows, Soumokil's resolve remained unshaken. His forces, comprised of a mix of dedicated soldiers and local militias, leveraged their knowledge of the terrain to launch surprise attacks and engage in sabotage against the Indonesian military's supply lines.\n\nMeanwhile, Prime Minister [INO.GetLeader] addressed the nation in a press conference, asserting the Republic of Indonesia's unwavering commitment to quell any rebellions with decisive force."
	indonesia_news.14.a: "One by one, the Domino falls."
	indonesia_news.15.t: "[GetNewspaperHeader]President Suharto Resign, Amid Months Long of Protest"
    indonesia_news.15.d: "After months of relentless protests that spread across Indonesia, the situation grew increasingly chaotic as demonstrations turned violent in many cities. Streets once filled with ordinary activity became scenes of burning barricades, clashes with security forces, and waves of unrest that showed no sign of slowing. The anger of the people had reached a breaking point, and each passing day brought new turmoil, shaking the foundations of the nation.\n\nAmid this mounting crisis, President Suharto finally announced his resignation from office. His departure marked the sudden end of a long-standing rule that had defined Indonesia for decades. As the news spread, it signaled a dramatic shift in the country’s history, closing one chapter and beginning another in the midst of uncertainty and change."
    indonesia_news.15.a: "Fall of the New Order"

	indonesia.4.t: "Disbandment of the Emergency Government"
	indonesia.4.d: "When the Dutch launched their second military aggression and captured President Sukarno and Vice President Mohammad Hatta, it appeared to the outside world that the Republic had fallen. But deep within the mountains and valleys of Sumatra, the flame of sovereignty was kept alive. In Bukittinggi, far from the occupied capital of Yogyakarta, Sjafruddin Prawiranegara and a handful of Republican officials quietly took up the mantle of leadership, not out of ambition, but out of necessity—to ensure the Republic did not die.\n\nThe PDRI was not a government born of power, but of duty. It was mobile, elusive, and constantly adapting—moving from village to village, coordinating resistance, maintaining communication with guerrilla forces, and sending a clear signal: Indonesia lives, and Indonesia resists.\n\nNow, with the return of the legitimate Republican leadership to Yogyakarta following international diplomatic pressure and the Roem–Van Roijen Agreement, the PDRI has fulfilled its task. It did not cling to power. It did not seek glory. In an act of quiet dignity, it stepped aside—having done what needed to be done when the Republic had no voice."
	indonesia.4.a: "Hiduplah Indonesia Raja!"
	indonesia.6.d: "Soedirman was more than a military leader. He was the living heartbeat of the revolution, a man whose authority did not come from medals or ranks, but from moral strength, unshakable conviction, and the quiet humility with which he bore impossible burdens. Still young, gravely ill, and often carried on a stretcher through jungles and battlefields, he refused to lay down his arms while the Republic remained under threat. His body grew weak, but his will never did.\n\nThrough the darkest nights of occupation and betrayal, it was Soedirman who rallied both soldiers and civilians with quiet resolve. He fought not only with tactics, but with belief—belief that freedom must be earned not just through arms, but through honor, sacrifice, and discipline. He led guerrilla campaigns not from behind desks, but alongside the very men who marched barefoot through forests and rivers, loyal to him because he had never demanded from them more than he was willing to give himself.\n\nHis death leaves a silence that cannot be filled. Yet in that silence, there echoes the memory of a man who never shouted, never sought glory, and never stepped away from the path he believed in. Soedirman leaves behind no palace, no riches, no monuments of power—only a legacy written in the hearts of those who watched him fight, who followed him into the mountains, and who now must carry forward what he began.\n\nIndonesia has lost a general. But it has gained a legend."
	indonesia.9.d: "We sat across from them, not as supplicants, but as survivors. After four years of bloodshed, occupation, exile, and defiance, we came to The Hague to claim what was already ours: our independence. And yet, even as they acknowledged the Republic and prepared to hand over formal sovereignty, the Dutch placed before us one last condition—the debt.\n\nThey called it fair. They said it was the cost of the colonial administration, the price of investments made before the war. But hidden in those figures were the costs of warships and bullets, of the very military campaigns launched to crush our resistance. They asked us, in effect, to pay for the bombs dropped on our own soil. To settle the account for the repression we endured. To finance the cage we broke free from.\n\nTo accept was bitter—an insult, some said. To walk away was to risk our seat among nations, to delay the recognition we had already earned in blood.\n\nWhat should we do?"
	indonesia.10.a: "£Hatta_Signature"
	indonesia.10.d: "It was not a triumphant departure, but a solemn duty cloaked in the weight of history. When Mohammad Hatta, the Vice President of the Republic, boarded the plane bound for the Netherlands, he did so not with celebration—but with the full knowledge that the very soul of Indonesia's hard-fought independence hung in the balance.\n\nThe war had not ended in clear victory. The Revolution had cost lives, homes, and years of uncertainty. Though Indonesia had held fast, the Dutch still refused to fully recognize the Republic's sovereignty. And so, as part of the fragile ceasefire and under immense international pressure, Hatta took flight—not to surrender, but to negotiate what could not be won by arms alone: the world's recognition of the Republic.\n\nHis journey to The Hague was both physical and symbolic. Crossing oceans, he carried not just documents and diplomatic notes, but the collective hopes of a wounded people. He was a man of intellect, calm restraint, and quiet conviction—far from the firebrand orator—but in those days, no one better represented the poise and principle of the revolution."
	indonesia.11.d: "The flags fluttered quietly as the first Republican officials stepped back into Yogyakarta—not as fugitives or prisoners, but as the rightful government of a free nation. Streets once patrolled by foreign troops now echoed with the footsteps of returning leaders. The Republic had come home.\n\nAfter months of absence, exile, and resistance, the symbolic heart of Indonesia was restored. Yogyakarta had not fallen easily, and it had never truly been conquered in spirit. Even as the Dutch claimed the city and exiled its leaders during the second military aggression, the Republic lived on in the hills, in the fields, and in the will of the people. Through the emergency government in Bukittinggi, through guerrilla struggle, through international diplomacy—Indonesia endured.\n\nNow, after the Roem–Van Roijen Agreement and mounting international pressure, the Dutch withdrew. In their place returned the leaders of the Republic—Sukarno, Hatta, and the cabinet, who had been held in captivity for months earlier. Their return was not marked by parade or spectacle, but by a deep, proud calm. Yogyakarta welcomed them with dignity, not as conquerors, but as guardians of a dream restored."
	indonesia.12.d: "In the valleys, along the jungle paths, and across the scattered fronts of Java and Sumatra, the sound of gunfire has begun to fall silent. Not because the will to fight has faded—but because the time has come to hold the line through words, not bullets.\n\nFollowing the fragile accord reached through the Roem–Van Roijen negotiations, the Republican military forces, under the Republican leadership, have begun to cease offensive operations against Dutch troops occupying various parts of the archipelago. It is not a surrender—it is a calculated, difficult choice born from a shifting battlefield: from jungle warfare to diplomatic maneuvering.\n\nThe ceasefire marks a turning point. After years of guerilla resistance—fighting from the forests, surviving occupation, holding fast against armored convoys and aerial bombardments—the Republic has now signaled its commitment to a political solution."
	indonesia.15.d: "It has been nearly four long years since that blazing morning in August 1945—when Soekarno stood before a humble house in East Jakarta, his voice steady, his words defiant, and declared to the world that Indonesia was free. The ink on the Proclamation had barely dried before the storm began. That moment, radiant with hope, was not the end of our struggle—it was the beginning of a new one.\n\nSince then, the road has been jagged with sacrifice. We have fought not only with rifles, but with bare hands, burning spirit, and the strength of a people who refused to bow again. In the jungles of Sumatra, in the alleys of Surabaya, from the rice fields of Central Java to the hills of Sulawesi—we defended that declaration with blood and will.\n\nWe faced the return of the colonizer, armed with planes, ships, and treaties. We faced division, deception, and delay. We watched our leaders exiled, our cities bombed, and our flag torn down—only to raise it again, every time, higher than before. The republic lived not in buildings or borders, but in the hearts of its people, in the whisper of "Merdeka!" passed from mouth to mouth even in the darkest hours.\n\nAnd now, four years on, we stand still not in peace, but on the edge of possibility. Our struggle is not yet complete. Independence has been declared, yes—but what is declared must still be made real. It is not enough to be free on paper. We must be free in fact. Free from domination, free to choose our future, free to speak, to build, to breathe as a nation whole and sovereign."
	indonesia.15.a: "£Soekarno_Signature"
	indonesia.16.d: "With the sovereign authority of the Republic restored in Yogyakarta, and the way to the negotiations being opened, Indonesia now stands not in struggle but in stewardship. The formation of the Second Hatta Cabinet marks a deliberate and necessary act—government fashioned to carry the burden of national responsibility, not in defiance but in statehood.\n\nThis cabinet, once again in an exercise of leadership by Mohammad Hatta, is not born from the heat of revolution but through the cool and demanding labour of reconstruction. This is a government not of slogans, but of duty, formed by men charged with the stewardship of a body politic that had only recently emerged from the crucible of war, division, and negotiation, and wielding the authority to govern itself.\n\nIn this new arrangement, we do not abandon the ideals of the Republic; rather, we give them form. Hatta's calm and rational leadership has been a reflection of the maturity of the Republic. The Cabinet reflects an organized consolidation of power, not for oppression but for guidance."
	indonesia.16.a: "£Hatta_Signature"
	indonesia_states.0.d: "Occupying our rightful territory will only get us so far.  It's an unfortunate reality that our liberated territories can't be immediately, seamlessly brought under our administrative wing.  Not only does the reality of local resistance make this dream impossible, but rather we need to upheave the current administration and replace it with our own.  Many of these disparate territories lack direct infrastructure connecting them to the wider country, but we need to ensure any administration we do set up can actually implement our policies, and enforce our laws efficiently.  These efforts take time and resources and the sooner we allocate them, the sooner we can truly say that our government represents all of Indonesia"
	indonesia_states.1.d: "While a troubled region with a long standing history of rebellion, ranging from dutch sponsored governments to Islamic anti-Dutch groups, through considerable effort, we can finally proclaim that Pasundan has been completely integrated into our unitary government.   While locals remain hesitant in no small part due to it's short history of self governance, from this day forward, Pasundan will remain a core region of our Republic."
	indonesia_states.1.a: "Let Natsir Work on This One!"
	indonesia_states.2.d: "Despite it's size, the integration of the small island of Madura is an enormous victory for a newly free Indonesia.  Once a crucial source of recruitment for our former colonial oppressor,  the incorporation of Madura brings us one step closer to affirming our wider control over the entirety of Java.  The Tobacco and Salt production of the island will certainly prove to be an added bonus however."
	indonesia_states.3.d: "First colonised by the imperialist powers in 1522, today we can finally proclaim that Jawa Timur is truly Indonesian.   Through consistent and diligent effort, we have finally asserted our administrative control.  While the stage for constant back and forth with the Dutch colonisers, Jawa Timur will be an indispensable asset in our nation building efforts."
	indonesia_states.4.d: "Seized by the Dutch VOC in the 17th Century, until recently Sumatera Selatan had been home to several independent kingdoms.  This time now has come to an end with the affirmation of our Unitary rule, as our capable statesmen have worked tirelessly to integrate the territory under our capable administrative wing; no easy feet for a region filled with multiple languages and diverse ethnicity. Nonetheless this marks a historic moment for the strength and legitimacy of our government."
	indonesia_states.5.d: "Having traded hands between the Dutch and Japanese imperialists throughout the Second World War, East Sumatra has been a problem region for us from some time.  Filled with Japanese trained "independence" fighters from the Second World War, our officials have had their work cut out for them in pacifying such a hostile region.  However with considerable effort, we can finally say East Sumatra is under our administrative watch, and will, hopefuly, remain a permanent cornerstone of our new free nation."
	indonesia_news.1.d: "Following Dutch military aggression and the occupation of Yogyakarta in late 1948, key Republican leaders, including President Sukarno and Vice President Mohammad Hatta, were captured and exiled. In response, Sjafruddin Prawiranegara and a group of Republican officials established the PDRI in Bukittinggi, West Sumatra, to ensure the continuity of the Republic and demonstrate that Indonesia remained a sovereign entity in resistance.\n\nWith the return of Republican leaders to Yogyakarta following international pressure and the signing of the Roem–Van Roijen Agreement, the original government was restored. Recognizing the reestablishment of legitimate authority, Sjafruddin and his cabinet have declared the dissolution of the PDRI, effectively ended the emergency administration."
    indonesia_serikat.2.d: "In the Pancasila Palace, Hatta was working in his office, drafting the speech for the meeting, when his secretary suddenly barged in without knocking. "Do you know how inappropriate it is to enter my office without knocking?" Hatta asked. \n\n"I'm sorry, sir," the secretary replied. "But we received a letter from Captain Westerling. He is asking us to recognize the APRA as the official army of the Pasundan state." \n\n"Are you serious?" Hatta questioned. \n\n"Yes, sir. He also demands unconditional respect for the autonomy of the states. He stated that if we do not respond within seven days, he cannot be held responsible for the outbreak of large-scale fighting by the APRA."\n\nHatta stood up from his chair and walked over to his secretary. "Is that so?""
	indonesia_serikat.2.a.1: ""Call Sukarno, tell him to cancel the meetings.""
    indonesia_serikat.2.a.2: ""He's just bluffing...""
	indonesia_serikat.1.d: "The sun was low, casting golden light over the trimmed hedges and flagstone paths. Meutia Hatta chased her friend around a patch of grass, their bare feet making soft thuds against the earth. Laughter echoed beneath the branches of the flame tree, the blossoms above a vibrant red—almost matching the flag gently rippling atop the Palace roof.\n\nThe heavy front doors opened with a creak. Mohammad Hatta, his coat in hand, stepped out, pausing for a breath of the cool air.\n\nMeutia: "Papa!"\n\nHatta: "There's my girl. Hmm, you've been running like a freedom fighter storming the trenches—are you having fun?"\n\nMeutia: "Yes, Papa! We're building a secret base under the tree! It's where the leaders meet."\n\nHatta: "A secret base, eh? Am I allowed in, or is it only for revolutionaries under ten?"\n\nMeutia: "Only if you bring snacks. And say the code word."\n\nHatta: "Let me guess… ‘Merdeka'?"\n\nMeutia: "How did you know?!"\n\nHatta: "Well, some words stay close to the heart. Especially that one."\n\nThe afternoon felt peaceful, almost ordinary—yet underneath it all, there was a quiet sense of victory. This garden, this laughter, this moment—none of it would have been possible without the struggle of years past."
	indonesia_serikat.1.a: "Merdeka!"
	indonesia_serikat.3.t: "Hamid Alkadrie Convicted"
	indonesia_serikat.3.a: "Justice Served"
	indonesia_serikat.3.d: "Given the collapse of Westerling and his APRA faction, it is both rightful and essential to bring these individuals to account for their actions. Among them is Hamid Alkadrie, previously known as Sultan Hamid II of Pontianak. Despite his later assertions that he sought to halt the coup upon discovering Westerling's plot to assassinate RUSI leaders, this does not exonerate him. By law, Alkadrie remains complicit in the conspiracy, his actions irrevocably linked to the effort to destabilize our government."
	indonesia_serikat.4.d: "Illiteracy remains one of the most significant challenges facing Indonesia today, affecting nearly half of the population who lack essential reading and writing skills. This widespread issue is rooted in the colonial legacy, where educational initiatives prioritized the native elites while neglecting the broader population. As a result, countless Indonesians have been deprived of basic educational opportunities and necessary resources that could empower them. \n\nIn an effort to combat this pressing problem, we are establishing the §GSekolah Pemberantas Buta Huruf Umum§!. This institution aims to provide comprehensive literacy programs tailored to the needs of the community. Through dedicated teaching and accessible resources, we hope to dramatically decrease, if not entirely eradicate, illiteracy in Indonesia. Our goal is to create a more educated populace equipped with the skills to improve their personal circumstances and contribute positively to society."
	indonesia_serikat.4.a: "Tut Wuri Handajani"
	indonesia_apri.1.d: "We emerged from the flames of revolution, united in purpose and spirit. In 1945, when the call to action rang out, we were farmers, dockworkers, students, and former soldiers — but most importantly, we were Indonesians determined to never submit to foreign domination again. In the jungles, along the coastlines, and in bustling cities, we fought not for wealth or status, but for the red-and-white flag that represented a future our parents had only dreamed of. Each rifle we carried was not just a weapon; it was a pledge that this land would remain ours forever. We were not merely soldiers; we embodied the unyielding will of the people.\n\nSince those tumultuous days, we have stood vigilant as our republic took its first, tentative steps. We have safeguarded our borders against external threats and remained steadfast when chaos loomed from within. While politicians may steer the government, we are the unwavering force that secures the nation's safety. We are the proud sons and daughters of independence, bound by an oath that transcends time: to defend Indonesia, no matter the sacrifice. As long as the Garuda soars in the sky, we will stand resolute — the steadfast shield and the mighty sword of our beloved nation."
	indonesia_apra.1.d: "The morning of the coup began like any other in Jakarta, but it quickly descended into chaos that would shake the foundations of our young republic. Raymond Westerling's forces took advantage of the confusion, striking swiftly at key government locations. Amid the turmoil, we received the tragic news that both President Sukarno and Vice President Hatta had been killed early in the assault while attempting to coordinate a response. The announcement spread through our streets like wildfire, sending shockwaves across the archipelago and leaving us in disbelief."
	indonesia_news.6.d: "Indonesia was still absorbing the weight of its hard-won sovereignty. Yet, beneath the surface of celebration, tensions simmered. Captain Raymond Westerling, once a feared Dutch commando commander in South Sulawesi, refused to accept the new reality. Backed by disaffected elements of the former KNIL and certain pro-Dutch sympathizers, he devised a bold plan: strike swiftly at Jakarta, eliminate top government figures, and replace the republican leadership with a provisional authority loyal to Dutch interests.\n\nBandung became the nerve center of the conspiracy. From discreet safe houses, messages and orders moved quietly, and small units prepared under the guise of "security drills." But republican intelligence had been watching. By mid-January, reports reached Jakarta of unusual movements and armed gatherings. Acting quickly, the Indonesian Army tightened checkpoints, intercepted couriers, and began preemptive arrests. The momentum Westerling hoped for never materialized. His forces, isolated and surrounded, abandoned the plan. Westerling himself fled Bandung, slipping past patrols before vanishing overseas."
	indonesia_news.5.d: "Political unrest and uncertainty over the federal structure of the young Republic provided the perfect opening for Captain Raymond Westerling. With loyal remnants of the KNIL and a network of pro-Dutch sympathizers, he launched a lightning operation from Bandung. His plan was precise: seize Jakarta, neutralize republican leadership, and establish a provisional administration that would "restore order" under the federal United States of Indonesia. On a foggy morning, coordinated units advanced into the capital, overwhelming thinly spread republican forces guarding key ministries and communication hubs.\n\nWithin 48 hours, the presidential palace was under guard, major government officials were in custody with President Soekarno and Vice President Hatta murdered, and radio stations broadcast emergency decrees under Westerling's authority. In Sumatra, a rival government led by General Soedirman has claimed to be the rightful continuation of Soekarno-Hatta's Indonesia. Foreign governments, wary of renewed instability, hesitated to intervene directly, giving both regime time to consolidate."
	indonesia.5.d: "In the Republican heartlands, many perceived the federal structure imposed by the Round Table Conference not as a true expression of Indonesia's unity, but as a lingering Dutch tactic intended to fragment and weaken the nascent nation. The United States of Indonesia, with its mix of states and territories, led to political disunity and empowered regional leaders to disregard the central government in Yogyakarta.\n\nRepublican leaders recognized the urgency of the situation and swiftly denounced federalism as a colonial vestige incompatible with the revolutionary spirit. Through a blend of political negotiation, effective public persuasion, and decisive pressure, the republic set out to unify the federal states under a singular Republic of Indonesia. By mid-1950, the majority of states were convinced to dissolve and merge with the central authority, motivated by mass demonstrations, growing nationalist sentiment, and the promise of a more stable future.\n\nThe complete integration of the State of East Indonesia signaled the end of the federal system. In Jakarta, now the capital of a unified republic, this achievement was hailed as a triumph of revolutionary ideals, affirming that Indonesia's independence would henceforth be governed under one flag and one cohesive government."
	pki.1.d: "\n\n\n\n\n£PKI_Rejuvenation\n\n\n\n\n\n\n\nSUBJECT: PKI Legally Reinstated \nTO: Prime Minister of Indonesia Mr. Mohammad Hatta\n\nDear Mr. Prime Minister,\n\nI am writing to express my deep concern regarding the recent legal reinstatement of the Communist Party of Indonesia. This sends a troubling signal to those of us who vividly remember the chaos and bloodshed caused by the PKI's actions, particularly during the Madiun Affair just two years ago.\n\nAllowing the return of such a force under the banner of legality is, in my view, a grave mistake. The PKI has consistently demonstrated that it does not operate within the bounds of democracy, nor does it respect the principles upon which our Republic stands. Its ideology is incompatible with our national character.\n\nI urge you, Mr. Prime Minister, to treat this matter with the seriousness it demands. We must remain steadfast in our resolve to protect the Republic from forces that seek to exploit our freedoms only to destroy them from within. This is not merely a question of political competition; it is a matter of national survival. Let us learn from the past so that we do not suffer from it again.\n\nWith Regards, \nKepala Staf Dinas Chusus, Badan Intelijen Negara:"
	pki.2.t: "Strange Morning"
	pki.2.d: "Alimin sat upright in his bed, cold sweat trickling down his pale forehead as the ticking clock created a steady, yet maddening melody. His wife, Hajjah, tried to reassure him and asked probing questions about what had startled him from their sleep. However, her words were subconsciously rendered mute by his troubled mind. How could they not be, after what he had just witnessed\n\n1948 was a terrible year, and no matter how much time passed, the scars of the Madiun Affair still ran deep within his sleep-deprived mind. On October 28th of that year, his ideals were put to the flames, and some of his closest confidants were brutally slaughtered by a government that he now had to pretend to serve as a "Dutiful Civil Servant." It felt like a betrayal to the massacre that had claimed the lives of the men and women he was charged to lead while he sat quietly, playing politics with the very men who had murdered them. Alimin could still remember the faces of his friends—Djoko, Maruto, and Munawar Musso—slain as they fled, their bodies burned to send a brutal, yet effective message.\n\nHaunted by his perceived betrayal during the day, his mind sought to punish him at night, plaguing him with nightmares. In these dreams, the massacre in Java would repeat itself, but this time, it would be his desecrated body doused in gasoline and set ablaze, loved and remembered by no one. Whenever he closed his eyes, all he could see were the unmoving faces of burning corpses, frozen in perpetual fear and terror.\n\nAlimin's reflection was finally interrupted when he felt his wife's hand gently rest on his shoulder. He suddenly realized just how cold and clammy he felt, and how wet with sweat the bed sheets had become. She wanted nothing more than to alleviate his pain, urging him to share his nightmare with her, but he couldn't bring himself to do it. He couldn't subject her to such cruelty, yet he dreaded the thought of closing his eyes again. So, he quietly reassured her that it was just a simple nightmare and that all he needed was some fresh air."
	pki.2.a: "Weird..."
	indonesia.7.t: "Formation of Natsir I Cabinet"
	indonesia.7.d: "We are happy to announce that we have reached the point where we can finalize our cabinet list. While this decision may upset some parties, particularly the PNI, we believe it is a necessary step toward realizing our vision. Although they may be displeased now, we are confident that our choices will ultimately be beneficial. Our goal is to create the best possible cabinet, and we look forward to the positive outcomes that will arise from our decisions. We are ready to move forward with pride and anticipation, knowing that we will ultimately succeed."
	indonesia.7.a: "Hectic Formation"
	indonesia.8.t: "Formation of Soekiman-Soewirjo Cabinet"
	indonesia.8.d: "Mohammad Natsir's inability to form a cohesive and stable government has led to another crisis, causing his approval rating to plummet to [?INO_Approval_factor_var_temp|+%0]. In response, the DPR has issued a motion of no confidence against Natsir. Consequently, President Soekarno has revoked Natsir's mandate and issued a decree appointing Soekiman Wirjosandjojo as the new Prime Minister."
	indonesia.8.a: "Poor Natsir"
	indonesia.13.t: "Formation of Wilopo-Prawoto Cabinet"
	indonesia.13.d: "The Failure of Soekiman Wirjosandjojo's government to effectively address the nation's challenges has led to a significant decline in public confidence. As a result, the DPR has passed a motion of no confidence against Soekiman, prompting President Soekarno to revoke his mandate. In response, President Soekarno has appointed Wilopo as the new Prime Minister, with Prawoto Mangkusasmito serving as his deputy. This new cabinet is expected to bring fresh perspectives and renewed energy to tackle the pressing issues facing our nation."
	indonesia.13.a: "Again...?"
	indonesia.17.d: "Following Prime Minister Hatta's recent visit to the State of Pasundan, his stature as a leader was significantly elevated. The visit not only highlighted his diplomatic skills but also showcased his ability to engage with regional leaders and address local concerns, which resonated well with the populace. As a result, public interest in his policies and leadership grew, leading to a resurgence of trust in his governance.\n\nIn light of this renewed confidence, the government decided to reorganize its structure to better align with Hatta's vision for the nation. Today marked a pivotal moment as the Prime Minister undertook a Cabinet reshuffle, introducing a new lineup aimed at invigorating the governmental approach to various national challenges.\n\nThe newly formed Cabinet, known as the Hatta-Sjahrir Cabinet or the United Indonesia Cabinet, reflects a collaborative effort to unify different political factions under a single vision for the country. This Cabinet aims to address pressing issues such as economic development, social justice, and national unity, with an emphasis on promoting cooperation between various regions and sectors of society, as well as addressing the issue of West Papua."
	indonesia.17.a: "Towards Prosperous Indonesia!"
	indonesia.18.t: "Establishment of the University of Indonesia"
	indonesia.18.d: "Today marks a pivotal moment in the history of our young Republic. With the unification of esteemed higher education institutions across the nation, the University of Indonesia is now established as the premier center of learning for our country. From the former School of Medicine in Batavia to the Law School in Jakarta, these institutions, once bound by colonial governance, now stand united under the banner of the Republic, committed to advancing the interests of the Indonesian people.\n\nThe University will deliver exceptional education and training in medicine, law, engineering, and the sciences, equipping a new generation of scholars and professionals who will confidently lead our nation into this exciting era. Here, we will cultivate the minds of Indonesia's youth, empowering them to serve with exceptional skill, integrity, and an unwavering commitment to the ideals of independence."
	indonesia.18.a: "Veritas, Probitas, Iustitia"
	indonesia.19.t: "Continuing the Issue of Papua"
	indonesia.19.d: "The long and arduous twilight of Independence was a challenging time for our nation, marked by both hope and struggle as we sought to establish our sovereignty. Amidst this pivotal period, the Roundtable Conference took place, marking a crucial point in our negotiations with the Netherlands. During these discussions, the Dutch government made a significant promise: it assured us that the region of Irian Jaya, rich in resources and strategically important, would eventually be handed over to us.\n\nWe understood the importance of this commitment and agreed to it, viewing it as a stepping stone towards fulfilling our nation's aspirations. Now, as we stand in a more stable position—having navigated difficult political waters and gained greater internal cohesion—we recognize that it is time to revisit this agreement. We are prepared to engage the Dutch once more, requesting a thorough discussion about the future of Papua, a region we believe should rightfully belong to us.\n\nHowever, we are acutely aware that there may be resistance. If the Netherlands refuses to engage in constructive dialogue or attempts to stall the process, we are resolute in our stance. We have come too far to back down easily; the struggle for our rightful territories will continue, and we will not shy away from asserting our claims. Our resolve is strong, and we are committed to ensuring that the promises made during the Roundtable Conference are honored."
	indonesia.19.a: "Shipped to Amsterdam"
	indonesia.20.t: "Indonesia Pressed on Papua Issue"
	indonesia.20.d: "The Indonesian Government has sent us a formal request to discuss the future of Papua, a region that has long been a point of contention between our two nations. We understand the significance of this issue and the importance it holds for Indonesia, but we must also consider our own interests and the complexities involved in such discussions.\n\nWhile we are open to dialogue, we have concerns about the timing and the approach taken by the Indonesian government. We believe that Indonesia may not yet be fully prepared to engage in meaningful negotiations on this matter, and we feel that more time is needed for them to solidify their position and gather the necessary support from their parliament.\n\nWe are willing to revisit this issue in the future, but at this moment, we must prioritize our own national interests and ensure that any discussions are conducted in a manner that is respectful and productive for both parties. We hope that Indonesia will understand our position and that we can find a way to move forward together when the time is right."
	indonesia.20.a: "Bugger Off"
	indonesia.21.t: "Dutch Refused"
	indonesia.21.d: "It's certainly disheartening when expectations meet with disappointment. Recently, we approached the Dutch regarding a pressing matter, hoping to initiate a dialogue. Despite our anticipation, the response we received was rather discouraging. The Dutch representatives informed us that they felt we weren't yet prepared to engage in a discussion. They expressed the need for more time to deliberate on the issue with their parliament before any conversations could take place.\n\nThis situation leaves us in a challenging position. While we understand the necessity for thorough discussions in their legislative body, it's frustrating to be put on hold. The suggestion to revisit our request at a later time only adds to our disappointment, as we were hoping for a more immediate exchange of ideas and potentially a path forward. Overall, it feels like a setback, and we are left waiting for an uncertain future timeframe when a dialogue might actually happen."
	indonesia.21.a: "We'll be back in a year"
	indonesia.22.t: "Returning the Dutch Soldiers"
	indonesia.22.d: "Three centuries ago, the VOC arrived on our shores with the intent to colonize our lands. They seized our rich resources, exploited our natural wealth, and imposed arduous labor upon our people, stripping us of our dignity and autonomy. For over 300 years, we have endured a legacy of humiliation, suffering, and oppression at the hands of foreign rulers. Today, we stand united and resolute, declaring an unequivocal NO! No more to colonialism, no more to submission. We are here to assert our rights and reclaim our sovereignty."
	indonesia.22.a: "Tot Ziens!"
	indonesia.23.t: "Dutch Agreed Under Condition"
	indonesia.23.d: "The Dutch keeping their promise to negotiate the transfer of Irian Jaya is a significant step forward in our ongoing struggle for full sovereignty. However, their condition that we must first recognize the sovereignty of the United States of Indonesia (RIS) before they will engage in discussions about Papua is a complex and somewhat frustrating requirement. While we understand the political realities and the need to navigate these diplomatic waters carefully, it does feel like an additional hurdle in our quest to reclaim what is rightfully ours.\n\nNevertheless, we are committed to fulfilling our obligations and recognizing the RIS as part of our broader strategy to achieve our goals. We will approach this situation with pragmatism and determination, ensuring that we meet their conditions while keeping our ultimate objective in sight: securing the future of Papua as an integral part of Indonesia."
	indonesia.23.a: "The Second Promise they kept."
	indonesia.24.t: "Inter-Indonesian Conference"
	indonesia.24.d: "The Inter-Indonesian Conference officially commenced today, marking a significant gathering of representatives from various regions across Indonesia. Delegations included not only local leaders and representatives from different provinces but also participants from the Bijeenkomst voor Federaal Overleg, underscoring the comprehensive nature of this national dialogue.\n\nThe conference was presided over by Mr. Mohammad Hatta, the current Prime Minister and Vice President of the Republic. His leadership set the tone for the discussions, emphasizing the importance of unity and collaboration among the diverse Indonesian states.\n\nA central theme of the conference was the formation of the Republik Indonesia Serikat, or the Republic of the United States of Indonesia. A significant portion of the discussions revolved around the composition of the RIS, highlighting the need for equitable representation of various regions and ethnic groups in its governance structure. Delegates voiced their concerns regarding the rights of states and autonomous regions within the newly proposed framework, seeking to ensure that local interests and identities would be preserved and respected."
	indonesia.24.a: "Djalan Kemerdekaan"
	indonesia.25.t: "Conclusion of the Inter-Indonesian Conference"
	indonesia.25.d: "The Inter-Indonesia Conference concluded today, establishing the following agreement as the official foundation of the free Indonesian Republic:\n\n1. The State of the United States of Indonesia is approved under the name of the Republic of the United States of Indonesia, based on principles of democracy and federalism.\n2. The Republic of the United States of Indonesia will be led by a constitutional president, supported by ministers who are accountable to the House of Representatives.\n3. Two representative bodies will be created: the House of Representatives and the Senate. The first body to be established will be the provisional House of Representatives.\n4. The provisional federal government will receive sovereignty not only from the Dutch but also concurrently from the Republic of Indonesia.\n5. It has been decided that the flag of RIS will be red and white.\n6. The national anthem will be "Indonesia Raya" by W.R. Soepratman.\n7. The official language of RIS will be Bahasa Indonesia."
	indonesia.25.a: "Well That Done It."
	indonesia.26.t: "The Siege of Surakarta"
	indonesia.26.d: "Despite the significant progress we have achieved under the Roem Van-Roijen agreement, our sense of satisfaction remains elusive. We can never truly be content while our beloved country still remains under the oppressive control of the Dutch colonial powers. While we will participate in the upcoming Conference, we must acknowledge the stark reality that our bargaining position is far from strong when compared to that of the BFO and the Dutch negotiators.\n\nIn light of this, we believe that launching a decisive military operation in Surakarta will be essential. Such an action will send a clear and unmistakable message to the Dutch: our determination and commitment to sovereignty are both unyielding and irrevocable. We will not rest until Indonesia stands as an equal on the global stage."
	indonesia.26.a: "Commence the Attack!"
	indonesia.27.t: "Aftermath"
	indonesia.27.d: "On the streets of Surakarta, many have fallen victim, many have died we lost yet another battle. Suharto had left hastily, and so did Rijadi. They went back to the deep forest; their mission, albeit not successful, had given the government the upper hand in the current Conference in Hague. Pakubuwono, who is the current Sultan, has appreciated them; they honor them as they continue their fight for the struggle for Independence."
	indonesia.27.a: "That ought to teach them a lesson at least!"
	indonesia.28.t: "The End is Nigh"
	indonesia.28.d: "[INO.GetLeader] sat in his office in the Merdeka Palace, that night he received a report on the discussion with the Maluku government about the truce and Indonesia's reluctant recognition of their sovereignty.\n\nSuddenly his assistant came barging to the room, "Sir, General Nasution is here to see you in person" said the assistant nervously "Is there something going on?" respond the Prime Minister, out of nowhere Nasution came barging thru the door looking visibly pissed and sweaty, "Bung, whereas considering, the increasingly critical situation that threatening our very national identity. And also the failure of the present government to resolve this matter, that other regions has also rebelled instead, has led to the point where the greater amount of soldiers perished for nothing, therefore at this very moment and hour, the army has relieved you of duty, alongside President Sukarno who has agreed to dissolve the DPR and remove you from office." \n\n"Please sign this." Nasution demanded "It's the only choice we have." [INO.GetLeader] signed the paper and below the paper is a signature of the new Prime Minister."
	indonesia.28.a: "£Nasution_Signature"
	indonesia.31.t: "Indonesia Asked For Recognition"
	indonesia.31.d: "The Government of Indonesia has formally reached out to us with a request to establish diplomatic relations. This proposal presents us with an important decision: we can either choose to accept their invitation and move forward in strengthening our bilateral ties or decide against it and maintain the current level of our diplomatic engagement."
	indonesia.31.a: "Sure"
	indonesia.31.b: "Ehh, Not Now"
	indonesia.32.t: "[FROM.GetAdjectiveCap] Government Recognized Us!"
	indonesia.32.d: "The [FROM.GetAdjectiveCap] Government has officially recognized our sovereignty. This recognition opens up new opportunities for establishing a robust trade relationship and a diplomatic mission with [FROM.GetName]. We are now in a position to facilitate regular exchanges and strengthen our ties, paving the way for increased cooperation and mutual benefits between our countries."
	indonesia.32.a: "Nice"
	indonesia.33.t: "First Session of the People's Representative Council Commences"
	indonesia.33.d: ""Dear Members of the House of Representatives,\n\nOver the past four years, we have worked together to preserve the independence of our nation, fueled by our courage and the dream of achieving true independence. I hereby declare the first session of the House of Representatives of the United States of Indonesia open.\n\nFirst and foremost, we need to address the matter of leadership. Therefore, the first order of business will be to elect the new Speaker of the House."\n\nAs the votes were counted and the results came in, the new Speaker would be..."
	indonesia.33.a: "Sartono Elected"
	indonesia.35.t: "Cabinet Formation"
	indonesia.35.d: "Following the success of Natsir Motion and the return to a Unitary State, President Soekarno appointed Mohammad Natsir to form the new cabinet. However, as is often the case in our country, we were not fully prepared. Under the Masyumi policy, a Prime Minister cannot lead their own party, which is why Natsir resigned from the position.\n\nCurrently, the main issue is whether we should compromise with the PNI or not. Not compromising could strengthen our party but weaken our support in parliament. On the other hand, compromising would mean doing the PNI's bidding despite our differences, whether we agree with it or not."
	indonesia.35.a: "If that's what it takes."
	indonesia.35.b: "We will not let them in our Government!"
	indonesia.36.t: "Gunting Sjafruddin"
	indonesia.36.d: "A new question has arisen, and it concerns our economy. Our currency, which was established less than five years ago, is in serious trouble. Several foreign currencies are circulating among the public, including the Oeang Republik Indonesia, the Guilder issued by NICA from the De Javanesche Bank, and the Japanese Yen.\n\nThis situation poses a significant problem for us because we cannot control the circulation of these currencies. Our excessive printing of the Oeang Republik Indonesia has led to massive inflation, which is not impacted by the Guilder or the Yen.\n\nTo address this issue, Sjafruddin Prawiranegara has proposed a drastic solution: to cut every bill above the denomination of 5 in half. This would apply to all currencies in circulation. We expect public opposition to this idea; however, without such measures, our economy will struggle to progress, and we could face even greater inflation.\n\nWhat should we do?"
	indonesia.36.a: "Let's Cut Some Cash!"
	indonesia.36.b: "It's Not Worth It..."
	indonesia.37.t: "Irian up for Grabbing"
	indonesia.37.d: "As the political situation in the Netherlands deteriorates in Europe, the consequences are felt far from home, particularly in Irian, the last remaining colonized territory in our nation. The region is currently in turmoil, marked by unrest and riots. In response to this critical situation, General Abdul Haris Nasution has convened at the Merdeka Palace to assess the circumstances in West Irian and to present a comprehensive situation report. \n\nRecognizing the urgency of the moment, General Nasution has proposed a strategic initiative known as "Operation Trikora," designed to liberate West Irian from Dutch colonial rule. This operation signifies a pivotal move towards ending centuries of colonial oppression. To ensure its success, every sector of our Armed Forces will be mobilized and tasked with specific roles and responsibilities in this significant campaign."
	indonesia.37.a: "Commence Operation Trikora!"
	indonesia.38.t: ""
	indonesia.38.d: ""
	indonesia.38.a: ""
	indonesia.39.t: "Fruit of Sjafruddin Policy"
	indonesia.39.d: "Since the implementation of the Gunting Sjafruddin policy in early March, our economy has shown significant signs of recovery. We are pleased to report that we have accumulated over Rp1.5 billion in reserves, a testament to the positive impact of this initiative. This financial stability bodes well for our future growth and development.\n\nWith these substantial funds at our disposal, we now have the opportunity to invest in major projects that can further enhance our economic landscape. These initiatives will not only create jobs but also improve infrastructure and services, ultimately benefiting our community and fostering long-term prosperity."
	indonesia.39.a: "Marvelous!"
	indonesia.40.t: "The Separatist Concern"
	indonesia.40.d: "There are currently two major separatist movements that are threatening the unity of our nation. The first is the Darul Islam movement, which has been active in various regions and poses a significant threat to our national security. The second is the Moluccan separatist movement, which has also gained traction and is causing unrest in the Maluku Islands.\n\nWhile both movements are concerning, it is crucial that we prioritize our response. The Darul Islam movement has a broader reach and has been responsible for numerous attacks and disruptions across the country. Therefore, it demands our immediate attention and resources to ensure the safety and stability of our nation.\n\nOn the other hand, while the Moluccan separatist movement is also a concern, it is more localized and does not currently pose as significant a threat as the Darul Islam. We will continue to monitor the situation in the Maluku Islands closely, but our primary focus must be on addressing the more pressing issue of the Darul Islam movement."
	indonesia.40.a: "Let's focus on the Moluccans."
	indonesia.40.b: "The Darul Islam possess a bigger threat."
	indonesia.41.t: "Daud Bereueh Letter"
	indonesia.41.d: "For an extended period, Daud Bereuh have played crucial roles in supporting our fight against the Dutch colonialists. The Acehnese community generously contributed their resources to enable Indonesia to acquire its first airplane. This spirit of cooperation and sacrifice has been invaluable to our struggle for independence.\n\nHowever, the push for greater autonomy in Aceh presents significant challenges. While there is a desire to grant some level of self-governance, Bereuh's proposal to implement Sharia Law in the region raises serious concerns. Such a move would fundamentally clash with the principles of Pancasila."
	indonesia.41.a: "Well, isn't that just wonderful..."
	indonesia.41.b: "If only we could get the DPRS onboard..."
	indonesia.42.t: "DPRS First Assembly Votes"
	indonesia.42.d: "As we establish ourselves as an independent nation, there are many growing concerns and questions that need to be quashed.   Regional difference from customs, morals, traditions, religion among a great many others threaten to tear our fledgling nation apart as fast as it was formed.\n\nWhile this will be a long, likely painful process, with the opening of the First Assembly we can address the most immediate of divisions as representatives from across Indonesia convene. However time will tell whether this will produce tangible results, and will serve as the first real test of our fledgling parliamentary democracy..."
	indonesia.42.a: "Finally, we can get to work!"
	indonesia.43.t: "DPRS Refused to Trust Us!"
	indonesia.43.d: "Despite the monumental achievement of becoming the head of the first cabinet of the newly proclaimed Unitary State, confidence in Mohammad Natsir's leadership is clearly very minimal within Parliament and with PNI itself.\n\nFailing to secure power as all Natsir's attempts to form coalitions within parliament has been met with consistent failure and rejection, making an already uneasy status all the more unstable. Compounding the growing lack of confidence in his status as Prime Minister are the growing failures of his leadership, ranging from a seeming unending growth of regional rebellions, growth of local independence movements and abysmal national security, among numerous other controversies. With this, perhaps, it is no surprise that Parliament has completly blocked Natsir's political authority.\n\nWhile it's unclear whether he will be able to regain his status in parliament, and re-secure his authority over the government it's unlikely that Natsir will simply sit idle in the upcoming national assembly..."
	indonesia.43.a: "What?!"
	indonesia.44.t: "Reviewing Our Possibility"
	indonesia.44.d: "Yet again, the Dutch refused to engage in discussions about the future of Papua, leaving us with limited options. We have been left with no choice but to consider alternative approaches to assert our claim over the region. One potential avenue is to suspend our membership in the Netherland-Indonesia Union, which could serve as a powerful statement of our dissatisfaction and a call for international attention to our cause.\n\nAlternatively, we could choose to reevaluate our options and explore other diplomatic or strategic avenues to address the issue. This might involve seeking support from other nations, engaging in regional alliances, or pursuing legal avenues through international courts. Each of these options comes with its own set of challenges and potential consequences, and we must carefully weigh them against our long-term goals and the best interests of Indonesia."
	indonesia.44.da: "Either out of spite or from the genuine heart, the Dutch has agreed to engage in discussions about the future of Papua, which is a significant step forward. This willingness to talk opens up new possibilities for us to assert our claim over the region and work towards a resolution that respects our sovereignty and interests. We can now explore various diplomatic avenues, such as negotiating terms for the transfer of control, seeking international support, or even proposing joint administration arrangements that could benefit both parties. This development is a positive sign that we may be able to achieve our goals through dialogue and cooperation rather than confrontation."
	indonesia.44.a: "Let's Suspend Our Membership"
	indonesia.44.b: "Let's Reevaluate Our Option..."
	indonesia.45.t: "Scouting for Trainers"
	indonesia.45.d: "As we continue to develop our military capabilities, it is crucial that we seek out experienced trainers to help us build a strong and effective defense force. We have identified potential trainers from three major powers: the United States, the Soviet Union, and China. Each of these nations has a wealth of experience in military training and could provide valuable insights and techniques to enhance our armed forces.\n\nWe will need to carefully evaluate the benefits and drawbacks of partnering with each of these countries, considering factors such as their geopolitical interests, the quality of their training programs, and how well their approaches align with our own strategic goals. Ultimately, our decision will be guided by what is best for Indonesia's security and sovereignty."
    indonesia.45.a: "American Trainer"
    indonesia.45.b: "Soviet Trainer"
    indonesia.45.c: "Chinese Trainer"
    indonesia.45.da: "We should train ourselves"
	indonesia.47.t: "The Preparation For Upcoming Election"
	indonesia.47.d: ""
	indonesia.47.a: "Democracy at its finest."
	papua.2.t: "Indonesia Invited us to Conference about Papua"
	papua.2.d: "Today, we've been presented with an interesting initiative from Indonesia's Minister of Foreign Affairs. It's a well-known fact that our relationship with Indonesia is not only strained but, for many in our government, openly hostile. Colonial history and personal ambitions aside, the days of unchallenged colonial rule have come to a violent end, and we need to face reality. The concept of reconquering our long-lost colony is a pipe dream, especially as both the global and local calls for decolonization only grow. Yet tension isn't simply eased overnight.\n\nWest Irain is one of our last colonial holdings in the Pacific, and it's far from being a simple, useless strip of land; and can still be quite profitable, perhaps even crucial now that our hold over Indonesia has been broken. It's also a non-negligible financial drain and will continue to be an undeniable sore point in our relationship with our former colony. However, Mohammad Roem, Indonesia's Minister of Foreign Affairs, has made a reasonable offer.  While this deal will see the transfer of North Irain to the new Indonesian nation, they have also stated their intent to preserve our national interests on the island, which would allow us to reap many of the economic benefits and avoid much of the associated costs. Besides, it's clear the old European order is headed straight to the grave, and the more we resist the inevitable, the harder it will hit us. Not to mention, we gain more from a friendly Indonesia than we ever will from West Iran.  At the same time, such a significant loss of territory would completely eliminate the last vestiges of meaningful Dutch in the Pacific and would most certainly be received as a humiliating loss. It's a difficult decision, but ultimately it has been decided that..."
	papua.2.a: "God forgive us..."
	papua.2.b: "Like Hell we Would!"
	papua.4.t: "The Netherlands Refuses Yet Again..."
	papua.4.d: "Our overtures to the Dutch have yet again met with rejection. It appears that, as far as we know, they never really wanted to give up Irian. This ongoing standoff has made it clear that negotiations have not produced the desired results.\n\nHowever, if we can navigate this situation carefully, there may still be an opportunity for us. By playing our cards right, we could potentially bring the issues surrounding Irian to the attention of the United Nations in the future. "
	papua.4.a: "Oh well..."
	smk.1.t: "Maluku Secedes!"
	smk.2.t: "The Storming of Ambon"
	smk.2.d: "In Ambon, the sound of gunfire has finally ceased. Our courageous troops have successfully defeated the separatist forces, marking a significant achievement in our efforts to maintain national unity. However, the situation remains unresolved, as their leader, Chris Soumokil, has managed to escape capture. We are now intensifying our pursuit to bring him to justice and restore stability to the region."
	smk.2.a: "NKRI Harga Mati!"
	smk.6.t: "Dutch Betrayal"
	smk.6.d: "The Dutch in their arrogance and selfishness, have supported the rebellious nation proclaimed in Maluku, betraying their promise at the Roundtable Conference not to interfere with Indonesia.\n\n"Betrayal, betrayal, betrayal!" said Sukarno to his assistant, Sukarno, who is visibly furious with the Dutch decision, having just been informed by Hamengkubuwono, "We need to do something against them!" said Sukarno, as he walks in circles around the Presidential office. "Call [INO.GetLeader] tell him to come here immediately!" As the assistant left, he heard Sukarno screaming."
	smk.6.a: ""Curse Them!!!""
	smk.10.t: "Taking Back Maluku"
	smk.10.d: "The situation in Maluku has reached a critical point. The separatist forces, led by Chris Soumokil, have entrenched themselves in the region, posing a significant threat to our national unity. In response, we have launched a decisive military operation to reclaim control over Maluku and restore order.\n\nOur armed forces are fully committed to this mission, and we are determined to bring an end to the separatist movement. We will not rest until Maluku is once again firmly under our sovereignty, and we will do whatever it takes to achieve this goal. The pursuit of Chris Soumokil continues, and we are resolute in our efforts to bring him to justice for his actions against our nation."
	smk.10.a: "Down With Separatist!"
	hatta.2.t: "Congratulations."
    hatta.2.d: "TO: Prime Minister of Indonesia, Mr. Mohammad Hatta\nFROM: Office of the Prime Minister of the State of Israel\n\nDear Mr Prime Minister, allow me to congratulate you on this wonderful occassion, I, [ISR.GetLeader], am very grateful to write this letter to you. Both the State of Israel and the Republic of Indonesia suffer from the grasp of colonial imperialism, as such we the people of Israel sincerely wish the mutual understanding and the establishment of diplomatic relation between both of our countries. In this spirit of shared struggle and historical experience, we extend our hand in goodwill, believing that the bonds forged through hardship may serve as the foundation for a respectful and constructive partnership between our nations.\n\nIt is our sincere hope that through dialogue, cooperation, and recognition of our common past, both our countries may move forward toward a future defined not by division, but by mutual respect and peaceful coexistence. We firmly believe that the establishment of diplomatic relations will not only benefit our governments, but also bring prosperity and understanding to our peoples, strengthening the ideals of sovereignty, independence, and unity that both Israel and Indonesia hold dear.\n\n"
    hatta.2.a: "Thanks"
	soekiman.1.t: "Reintegrating Veterans to Productive Works"
	soekiman.1.d: "The Veterans of our struggle for independence have sacrificed so much for our nation, and it is our duty to ensure that they are reintegrated into society in a way that allows them to lead fulfilling and productive lives. We will implement comprehensive programs to provide them with the necessary support, including vocational training, job placement services, and mental health resources. By doing so, we can honor their contributions and help them transition smoothly into civilian life, ensuring that their sacrifices continue to benefit our nation in meaningful ways."
	soekiman.1.a: "Bekerdja!"
	soekiman.2.t: "Morning in Pancasila Palace"
	soekiman.2.d: "Soekiman has just began his first day as the new Prime Minister of Indonesia, and he is already facing a significant challenge. The recent wage reform has sparked widespread public dissatisfaction, particularly among workers outside the civil servant system. Many feel that the reform primarily benefits civil servants and similar state employees, leaving private-sector workers and informal laborers without comparable support. This sense of exclusion has led to protests and a growing sense of frustration among affected groups, who argue that the reforms should be more inclusive and equitable. As Soekiman navigates this issue, he will need to address the concerns of these workers while also managing the political implications of the reform."
	soekiman.2.a: "Well, this is going to be fun..."
	soekiman.3.t: "Protest Over Wage Reform"
	soekiman.3.d: "The recent wage reform has significantly harmed public sentiment, especially among workers outside the civil servant system. Many feel excluded from the benefits of the reform, which primarily favors civil servants and similar state employees, leaving private-sector workers and informal laborers without comparable support. This sense of exclusion has led to widespread public dissatisfaction and protests, as affected groups express their frustrations over perceived inequality and inadequate economic protection.\n\nDemonstrators argue that reforms should be more inclusive and equitable, addressing issues such as wage stagnation, the taxation of holiday allowances, and the lack of support for non-civil servant workers. These protests highlight the deep frustration with a system that many believe prioritizes a limited group while leaving the majority of the workforce to bear the economic burden."
	soekiman.3.a: "Damn!"
	soekiman.4.t: "Soekiman Returns Mandate to President Sukarno"
	soekiman.4.d: "The fallout of Ahmad Soebardjo plan on getting a Marshall Aid from the United States has led to another reshuffle, with President Soekarno promptly accepted Soekiman return of mandate. With Minister of Economic Affairs, Mr. Wilopo being the forerunner of the next Prime Minister."
	soekiman.4.a: "Oh well..."
	soekiman.5.t: "Nahdlatul Ulama Breaks with Masyumi"
	soekiman.5.d: "The growing divergence between the Muhammadiyah-dominated majority within Masyumi and the Nahdlatul Ulama faction has reached a critical point, culminating in an institutional rupture. The decision by Wahid Hasyim, acting as the principal representative of Nahdlatul Ulama interests within Masyumi, to withdraw the organization from the party is viewed as a significant political development with implications for parliamentary stability. What had once been an umbrella for unified Islamic political expression is now fragmenting along ideological and organizational lines, raising concerns within government circles about the coherence of Islamic representation in the DPRS.\n\nIn response, the Masyumi leadership has formally criticized Wahid Hasyim’s move, framing it as a step that undermines the broader unity of Islamic political forces at a time when consolidation is deemed essential for national governance. Nevertheless, Nahdlatul Ulama has proceeded to establish itself as an independent political entity, quickly mobilizing support—particularly in East Java, where its traditional base remains strong."
	soekiman.5.a: "Well, that's a shame..."
