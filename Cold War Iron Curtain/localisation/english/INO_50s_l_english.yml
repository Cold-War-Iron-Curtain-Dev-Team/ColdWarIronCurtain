	POLITICS_MOHAMMAD_HATTA_DESC: "Born in Sumatra, Dutch East Indies, on the 12th of August, 1902, Mohammad Hatta does not need to prod loudly to receive an audience. He was the calm, systematized individual, a strong person who thinks not in noise but in quiet conviction and unmistakable clarity of purpose.\n\nWhere others foster fervor, Hatta draws respect. A thinker, an economist, a nationalist bowed by study halls and exile; he eschews the role of demagogue in favor of the gentleman-statesman-calculated, poised, and uncompromisingly just in his pursuit of justice and independence. His patriotism whispers, not a shout to be ignored, but rooted, principled, and precise.\n\nHis demeanor may keep him away from applause, but he commands respect upon his presence. Their Prime Minister, Hatta, had a gall, went across the table from colonial officials, or ambled among villagers with a quiet grin. In essence, he was the intellect, conscience, and moral balance of the Republic. Freedom, in his concept, is not a cry but a deed - a deed to be built solidly along structures, law, and dignity of labor."
	POLITICS_MOHAMMAD_HATTA_LIB_DESC: "Mohammad Hatta was born on August 12, 1902, in Sumatra, part of the Dutch East Indies. Throughout his life, he exemplified a remarkable ability to attract attention without ever needing to raise his voice. Known for his composed demeanor and methodical approach, Hatta was a figure of strength who operated not in the turmoil of loud rhetoric but in the serene clarity of his convictions and goals.\n\nWhile many leaders thrive on fervor and emotional appeals, Hatta's strength lay in the respect he garnered from others. He was a thinker and an economist, a dedicated nationalist who faced hardships including periods of exile, yet he chose to reject the path of a demagogue. Instead, he embraced the role of a gentleman-statesman—calculated in his actions, poised in his demeanor, and unwaveringly committed to justice and the quest for independence for his country.\n\nAlthough his calm approach may have kept him from the fanfare or applause typically associated with political leaders, his presence commanded profound respect. As the Prime Minister of Indonesia, Hatta displayed remarkable courage in negotiation settings, whether he was seated across the table from colonial officials or engaging with villagers, all the while wearing his characteristic gentle smile.\n\nHis efforts culminated in a significant achievement when he successfully negotiated the integration of Pasundan into the Republic. This victory enhanced his reputation, transforming him from merely an astute diplomat into a national figure celebrated across the archipelago. As the Republic's Vice President and a leading voice in national governance, Hatta stood at the vanguard of a movement poised to realize the long-cherished Dream of the Republic. Under his guidance and vision, Indonesia was on the path to becoming a prosperous, responsible, and truly independent nation."
	POLITICS_ANAK_AGUNG_DESC: "Born into Balinese aristocracy on 21st July, 1921, Anak Agung was the Raja of Gianyar, educated both in the Netherlands and Indonesia, fluent in diplomacy and steeped in native political traditions. His background was unique: a traditional ruler shaped by colonial administration and Western education, yet increasingly drawn to the nationalist cause.\n\nDuring the Indonesian National Revolution, he chose the path of negotiation and unity. Unlike some federalist leaders who aligned with Dutch-sponsored states, Anak Agung took a more measured and ultimately pro-Republican stance. He became Prime Minister of the State of East Indonesia, a federal entity created by the Dutch to counter the Republic of Indonesia centered in Yogyakarta.\n\nThough his position was inherently tied to Dutch-designed federalism, Anak Agung used his office not to divide, but to seek peaceful reconciliation between the Republic and the federal states. He increasingly acted as a mediator, advocating for a unified Indonesia and working behind the scenes to ensure that diplomacy—not force—would determine the country’s future."
  POLITICS_SYAFRUDDIN_PRAWIRANEGARA_DESC: "Born on February 28th, 1911, in Anyer Kidul, Banten. Sjafruddin Prawiranegara came from an aristocratic santri family, a background that combined noble lineage with the disciplined values of Islamic scholarship. This dual heritage influenced his early years, providing him with both the intellectual rigor of Dutch colonial education and the moral grounding of religious tradition. From the very beginning, he distinguished himself as principled, sharp-minded, and unwavering in his sense of purpose. His rise to prominence was not due to opportunism, but rather a result of quiet determination and extraordinary clarity of thought during turbulent times.\n\nCalm in demeanor and firm in policy, he commanded respect not through authority but by character. In moments of crisis, he remained steadfast—not as a mere symbol, but as a solid anchor. His leadership was guided not by ambition for personal gain, but by a sense of duty to the Republic and its founding ideals. Following Sjafruddin meant following integrity itself.\n\nA keen economist and one of the early financial architects of the Republic, Sjafruddin's leadership reached its peak during the Dutch military aggression when he became the head of the Emergency Government of the Republic in 1948. In this role, he kept the spirit of the Republic alive deep within the Sumatran hinterlands. Neither palace-born nor forged in battle, his statesmanship was marked by endurance, integrity, and fierce loyalty to the ideals of the Republic."
	POLITICS_ENGELBERT_TATENGKENG_DESC: "In Indonesia's literary treasures, many religious aspects are echoed in the form of poetry. There are Taufiq Ismail, Emha Ainun Najib, and many more. Especially when talking about New Poets, of course, people will remember the name of Amir Hamzah, the King of New Poets, who, no less often, wrote religious poems. However, the color of Christianity in Indonesian literature is not much.\n\nBut, this does not mean that no Christian writer has ever decorated the literature of this country. Still, one generation with the new King poet also recorded the name J.E. Tatengheng. If one comes from western Indonesia, the other comes from eastern Indonesia. It's just that J.E. Tatengkeng is the only writer who presents the nuances of Christianity in his time.\n\nBorn as Jan Engelbert Tatengkeng in Kolongan, Sangihe, North Sulawesi, on 19th October 1907. His father was a gospel teacher as well as the principal of a zending school. It is not surprising that he finally seemed to have a fairly thick Christian background, which he presented in various poems. Some people may see his works that breathe Christianity as only based on the background of the family and the people of Sulawesi, who, in fact, are Christians. However, we need to consider the fact that the Holy Spirit does work in his chosen ones.\n\nAlthough predicated as one of the new poet writers, Tatengkeng is also active in politics. As he currently serves as Prime Minister of East Indonesia, replacing Ide Anak Agung Gde Agung, his leadership is yet to be proven, but Tatengkeng, despite his background and politics, knew what it meant to lead, what it meant to be Indonesian."
	POLITICS_MOHAMMAD_NATSIR_DESC: "Who is Mohammad Natsir? If you ask Masyumi members, they will say that he's their leader. If you ask the Nationalists, they'll tell you he's a radical Islamist, whoever he is in the eyes of politics, one thing remains: he is here to stay.\n\nBorn on July 17, 1908, in Solok, West Sumatra, Natsir grew up in a household that lived closely with another family, an arrangement that underscored the communal aspects of Indonesian life at the time. His early education began at HIS Adabiyah in Padang, a school that focused on Islamic studies alongside general education. After a few months, he relocated to Solok, where he lived in the home of Haji Musa, a local merchant. This arrangement allowed Natsir to continue his studies during the day at school and participate in Madrasah Diniyah at night, where he deepened his understanding of Islamic principles.\n\nNatsir's political involvement began during the turbulent period of the Japanese occupation of Indonesia. He joined the Madjelis Islam a'la Indonesia, an Islamic council that was influential during the occupation. His leadership skills were recognized, and he was appointed as one of the chairmen of the council. Following Indonesia's declaration of independence in 1945, Natsir took on an active role in the country's governance as a member of the Central Indonesian National Committee, which was formed to assist in the transition to an independent republic.\n\nBefore rising to the position of Prime Minister, Natsir served as the Minister of Information. His influential role in forming public opinion was crucial during the early years of Indonesia's independence. One of his significant contributions during this time was the proposal of the "Mosi Integral" during a plenary session of Parliament shortly after Indonesian sovereignty was transferred.\n\nVice President Mohammad Hatta, recognizing the importance of Natsir's motion, supported it as a means for the diverse political landscape of Indonesia to present a cohesive front in the post-colonial era."

