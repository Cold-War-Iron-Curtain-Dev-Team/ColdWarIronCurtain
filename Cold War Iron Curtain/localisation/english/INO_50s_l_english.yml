	#events
	indonesia.4.d:0 "When the Dutch launched their second military aggression and captured President Sukarno and Vice President Mohammad Hatta, it appeared to the outside world that the Republic had fallen. But deep within the mountains and valleys of Sumatra, the flame of sovereignty was kept alive. In Bukittinggi, far from the occupied capital of Yogyakarta, Sjafruddin Prawiranegara and a handful of Republican officials quietly took up the mantle of leadership, not out of ambition, but out of necessity—to ensure the Republic did not die.\n\nThe PDRI was not a government born of power, but of duty. It was mobile, elusive, and constantly adapting—moving from village to village, coordinating resistance, maintaining communication with guerrilla forces, and sending a clear signal: Indonesia lives, and Indonesia resists.\n\nNow, with the return of the legitimate Republican leadership to Yogyakarta following international diplomatic pressure and the Roem–Van Roijen Agreement, the PDRI has fulfilled its task. It did not cling to power. It did not seek glory. In an act of quiet dignity, it stepped aside—having done what needed to be done when the Republic had no voice."
	indonesia_news.1.d:0 "Following Dutch military aggression and the occupation of Yogyakarta in late 1948, key Republican leaders, including President Sukarno and Vice President Mohammad Hatta, were captured and exiled. In response, Sjafruddin Prawiranegara and a group of Republican officials established the PDRI in Bukittinggi, West Sumatra, to ensure the continuity of the Republic and demonstrate that Indonesia remained a sovereign entity in resistance.\n\nWith the return of Republican leaders to Yogyakarta following international pressure and the signing of the Roem–Van Roijen Agreement, the original government was restored. Recognizing the reestablishment of legitimate authority, Sjafruddin and his cabinet have declared the dissolution of the PDRI, effectively ending the emergency administration."
