  #focus Hatta
  INO_Hatta_Premiership: "The Hatta Premiership"
	INO_Hatta_Premiership_desc: "Mohammad Hatta has led an extraordinary life, and his contributions to our country existing as it does is incalculable.  There are very few in our fledgling nation both as qualified, and intrinsically linked to our struggle for freedom as Hatta"
	INO_Cabinet_Program: "Cabinet Programs"
	INO_Cabinet_Program_desc: "The Second Hatta Cabinet is a rather interesting one, as it was formed following the Roem Van Roijen agreement, with Hatta again being the Prime Minister. Following the transfer of sovereignty, the Cabinet was renamed to the United States of Indonesia Cabinet, and the Cabinet Program will finally be fulfilled to do its duty."
	INO_Education_Program: "Education Programs"
	INO_Education_Program_desc: "Colonial education falls short of any nation who has won their hard fought for independence, and Indonesia is no different.  Only made worse by the fact that we’ve been forced to contend with both Dutch and Japanese occupation back to back.  Now that we’re the masters of our country, we can provide our people with a more comprehensive, and modern education."
	INO_Rebuilding_Economy: "Building the Basic of Economies"
	INO_Rebuilding_Economy_desc: "Unfortunately, the Dutch have left us very little in the way of an economy to take hold of, and use to rebuild Indonesia with.  We have to effectively start from scratch.  That being said, this means we have the opportunity to develop an economy to best fit our needs without having to contend with the ruins of what existed before."
	INO_Repatriate_Former_KNIL: "Repatriate Former KNIL Soldiers"
	INO_Repatriate_Former_KNIL_desc: "The KNIL (Royal Netherlands East Indies Army) has been a long thorn in our side, even now that we’ve won relative peace.  We have consistently tried to integrate the remainder of the KNIL to bolster our own armed forces, but internal conflicts have made this goal unreachable.  Allowing them to resettle in the Netherlands is a much more humanitarian, and cost effective solution then letting them rot."
	INO_Return_Dutch_Soldiers: "Return Dutch Soldiers"
	INO_Return_Dutch_Soldiers_desc: "While we can’t pretend the past decades of violent oppression and conflict didn’t happen, we can’t be blind to the realities of the unfolding Cold War today either.  There's no sense keeping soldiers prisoner when their war is already lost.  If nothing else granting them their freedom will help us secure the legitimacy of our government abroad"
	INO_Start_Integration_Process: "Start Integration Process"
	INO_Start_Integration_Process_desc: "While we are the indisputable masters of our country, many of our territories have remained in the firm control of our former colonial oppressors.  Now that these territories are under our control, it’s time to begin the process of solidifying them as true cornerstones of a free Indonesia"
	INO_Continue_Talks_on_Papua: "Continuing the Talk on Papua"
	INO_Continue_Talks_on_Papua)desc: "While we may be free of colonial rule, our island chain is not.  Unfortunately, the Papuans are trapped under a different colonial tyrant than ours, leaving them, as well as our rightful territory, under Dutch occupation. However, the Dutch, during the Roundtable Conference, promised us that they would return Papua to us after our sovereignty was established."
	INO_Form_the_UI: "Form the University of Indonesia"
	INO_Form_the_UI_desc: "Built off the backbone of the former Dutch “School of Health, Sciences and Vaccines”, the University of Indonesia (UI) will be a modern institute for the higher education of our people, and shall be a key vehicle in elevating our country to match that of our former colonial oppressors.  Hopefully the first of many, UI will ensure our people can achieve a higher medical and technical education without having to leave the country."
	INO_Start_Literacy_Program: "Start Eradicating Illiteracy"
	INO_Start_Literacy_Program_desc: "Decades of colonial rule and years of fighting for independence does not usually allow for the wide scale education of a nation's youth.  Even less so when levels of education are regulated under years of colonial oppression.  Now that we’ve won our freedom, it’s time to remedy the many deficits our former oppressors had created. Starting with our literacy rate."
	INO_A_New_Generation: "Educate the New Generation"
	INO_A_New_Generation_desc: "Soon there will be a generation born who will never know the horrors of war, or the struggle for independence.  Even now there is a generation being born who will never have experienced Dutch oppression.  If we wish to succeed in the future, we need to ensure our future generations are armed with the knowledge they need to carry us forward."
	INO_Support_Pesantren: "Fund Pesantren"
	INO_Support_Pesantren_desc: "Pesantren is a long- standing traditional islamic boarding school taught within private homes, pondoks or mosques.  While not what many outside our country would call standard education, it is an indispensable tool both for fighting illiteracy, but also ensuring education reaches more rural, and isolated communities.  If we want to ensure our people have access to education across our country, institutions like Pesantren are perfect avenues to achieve this."
	INO_Formalize_Higher_Education_System: "Formalize Higher Education System"
	INO_Formalize_Higher_Education_System_desc: "We can ensure our people can receive education comparable to that of the broader global community, let alone work in more complex industries domestically if they have no one to teach them.  If we want to ensure our people don’t look abroad for higher education, we need to work rapidly to ensure they can find it here."
	INO_Start_Preparatory_Committee_For_Election: "Form Preparatory Committee for Election"
	INO_Start_Preparatory_Committee_For_Election_desc: "If we want the smooth transition of power, and in turn, a stable political system, we need a committee to actually organize and formalize both a system, and guidelines for how elections will be held, and how our people will participate in them."
	INO_Policing_Action: "Take Action Against Rebellion"
	INO_Campaign_for_Recognition: "Start Campaign for Recognition"
	INO_Campaign_for_Recognition_desc: "Winning our freedom is one thing, but being a recognized state is another.  If the world does not recognize us as the legitimate government of Indonesia, then it opens the door for the horrors of the past few years to be repeated.  Starting a global tour for recognition will not only further eradicate Dutch ambitions for its former colony, but also allow us to one day exert our own influence, and support our own ambitions."
	INO_Free_and_Active: "Indonesia Place in the World"
	INO_Free_and_Active_desc: "Now that we have a country to call our own, we are now forced to ask, and answer the simple question of what our place in this ideologically divided world is.  Who will we side with, what do we bring to the global community?  We will soon have to answer many questions like these if we want to consider ourselves a functioning country."
	INO_Fixing_the_Railways: "Modernize the Indonesian State Railway"
	INO_Fixing_the_Railways_desc: "Despite the need for nationwide modern rail systems, starting realistically, developing the rail lines of Java is the best place to start.  Not only will it pair expertly with our development plans for the region, but the transportation of goods across the island that hosts our capital is the lifeblood of our nation, and the ruins of colonial infrastructure are far from sufficient to meet our needs."
	INO_Development_in_Java: "Start Development Program in Java"
	INO_Development_in_Java_desc: "We have a long way to go to lift our country from the ruin of occupation and civil war, and what better place to start than Java itself?   Not only is it home to our capital, Jakarta, but it’s also home to a large swath of the entire nation's population.  New industries and urbanization efforts is but the first step in bringing all of Indonesia into the modern world."
	INO_Start_Light_Industry: "Funding for Domestic Light Industry"
	INO_Start_Light_Industry_desc: "As important as the development of Jakarta is, we can’t allow the rest of our country to languish.  Funding development and workplaces for our people will not only directly aid our burgeoning economy, but is crucial to elevating our people from poverty."
	INO_Minimum_Wage: "Establish Basic Wages"
	INO_Build_New_Hospital: "Expand Hospital Access"
	INO_Build_New_Hospital_desc: "It’s a sad reality that the access to quality healthcare, let alone a capable place to treat the sick or grievously injured, is shockingly low.  Our more rural communities have little access to modern healthcare, and even some of our cities can be found lacking.  Laying the groundwork for new hospitals is an immediate necessity."
	INO_Dismantle_Federal_Institute: "Proclaim the Unitary State"
	INO_Dismantle_Federal_Institute_desc: "While many might argue that a nation as large, and filled with diverse languages and cultures like ours, a federal system would suit us best.  This is simply untrue and senseless idealism that ignores reality.  We need a strong central government capable of making the drastic and necessary decisions, and take the immediate action we need to lift us into the modern world as a free and developed nation.  Today, we celebrate the abolition of the United States of Indonesia, and herald in a new age for our country!"
