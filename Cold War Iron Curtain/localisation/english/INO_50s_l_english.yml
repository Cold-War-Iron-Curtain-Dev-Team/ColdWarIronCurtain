 PARTY_INFO: "Party Information"
 PARTY_INFO_DESC: "Select a Party"

 PKI_TITLE: "Communist Party of Indonesia (PKI)"
 PKI_DESC: "The PKI stands as a powerful force in Indonesia's young democracy, rebuilt from years of colonial suppression and wartime struggle. It organizes peasants, workers, and students under promises of land reform, fair wages, and access to education. Aligning itself with Sukarno's anti-imperialist vision, the PKI portrays itself as the true voice of the common people, seeking to guide the republic toward justice, equality, and lasting independence."
 
 BPKI_TITLE: "Consultative Council for Indonesian Citizenship (BPKI)"
 BKPI_DESC: "Formed in the earliest days of independence, the BPKI represents Indonesia's first attempt at creating a national body to guide the republic. It brought together diverse voices from across the archipelago to advise Sukarno's government, debate constitutional questions, and define the meaning of citizenship. Though transitional, it laid the groundwork for later assemblies and symbolized unity in shaping a sovereign state."

 MURBA_PARTY_TITLE: "Murba Party (Partai Murba)"
 MURBA_PARTY_DESC: "The Murba Party emerges as a revolutionary socialist force rooted in veterans of the independence struggle and followers of Tan Malaka. Smaller than the PKI but fiercely committed, it calls for radical land reform, militant anti-imperialism, and a people's economy. Murba champions a more uncompromising path for Indonesia's revolution, presenting itself as the vanguard of workers and peasants unwilling to compromise with old elites or foreign powers."

 PSI_TITLE: "Socialist Party of Indonesia (PSI)"
 PSI_DESC: "The PSI rises as an intellectual and reformist party, led by figures such as Sutan Sjahrir. It champions democratic socialism, parliamentary governance, and modernization through education and planning. Though lacking the mass base of the PKI or PNI, the PSI appeals to urban professionals, students, and civil servants, presenting itself as a principled voice for democracy, integrity, and progressive reform in the young republic."

 PARTAI_BURUH_TITLE: "Labour Party (Partai Buruh)"
 PARTAI_BURUH_DESC: "The Labour Party organizes workers in Indonesia's growing industrial and transport sectors. Rooted in trade union activity, it advocates fair wages, better conditions, and legal protections for labor. Though smaller in reach compared to larger national parties, it positions itself as the voice of Indonesia's urban working class, striving to ensure that independence brings not only freedom from colonialism but also dignity in daily life."

 PNI_TITLE: "Indonesian National Party (PNI)"
 PNI_DESC: "The PNI stands as one of the dominant pillars of post-independence politics, closely tied to Sukarno's leadership. Rooted in nationalism, it emphasizes unity, anti-imperialism, and the centrality of the state in guiding development. With broad appeal across classes and regions, the PNI presents itself as the natural party of government, symbolizing the struggle for independence and the guiding force of Indonesia's national identity."

 PDI_TITLE: "Indonesian Democratic Party (PDI)"
 PDI_DESC: "The PDI brings together reform-minded nationalists and moderates who seek to balance democracy with stability. Less radical than left-wing parties yet distinct from Islamic politics, it emphasizes civil rights, social progress, and a strong parliamentary role. Its platform appeals to urban middle classes and intellectuals, offering a vision of orderly democracy within the new republic."

 PRI_TITLE: "Indonesia People's Party (PRI)"
 PRI_DESC: "The PRI emerges as a smaller nationalist party claiming to represent grassroots interests outside the larger political machines. It advocates social justice, independence from foreign influence, and broader political participation. Though overshadowed by the PNI and PKI, it carves a niche as a populist voice, portraying itself as close to ordinary Indonesians and their daily struggles in the new republic."
 
 PARKINDO_TITLE: "Indonesian Christian Party (Parkindo)"
 PARKINDO_DESC: "Parkindo serves as the main political voice for Indonesia's Protestant communities. It advocates religious freedom, education, and social responsibility, while stressing loyalty to the republic. Though limited in its reach compared to nationalist or Islamic parties, Parkindo provides a platform for Christians to participate in politics, promoting a moral vision of justice, tolerance, and unity within Indonesia's diverse democracy."
 
 PARTAI_KATOLIK_TITLE: "Catholic Party (Partai Katolik)"
 PARTAI_KATOLIK_DESC: "The Catholic Party represents Indonesia's Catholic minority, drawing strength from schools, social organizations, and communities in Java and eastern regions. It advocates religious freedom, education, and social justice, while supporting the republic's unity. Though modest in size, it ensures Catholic voices are heard in national politics, promoting cooperation and harmony within Indonesia's diverse democracy."
 
 IPPRI_TITLE: "Police Employee's Association of the Republic of Indonesia (IPPRI)"
 IPPRI_DESC: "The IPPRI functions as a professional organization turned political movement for police personnel. It emphasizes loyalty to the state, order, and security in the fragile post-independence environment. By entering politics, the association seeks to protect the interests of police employees while presenting itself as a stabilizing force, committed to safeguarding the republic and ensuring law and order in its formative years."
 
 PIR_TITLE: "Great Indonesia Unity Party (PIR)"
 PIR_DESC: "PIR rises as a nationalist party dedicated to consolidating Indonesia's independence and unifying diverse groups under one banner. It stresses anti-imperialism, development, and parliamentary representation for regional communities. Though never as dominant as the PNI or PKI, PIR positions itself as a patriotic alternative, aiming to bridge divisions and strengthen the republic through unity and shared national purpose."
 
 PRN_TITLE: "National People's Party (PRN)"
 PRN_DESC: "The PRN emerges as a nationalist group seeking to expand representation for ordinary Indonesians in the post-independence system. It stresses loyalty to the republic, economic justice, and political participation across the archipelago. Though smaller than the PNI, it presents itself as a patriotic alternative, aiming to keep the spirit of independence alive in daily governance."
 
 GPP_TITLE: "Movement to Defend the Pancasila (GPP)"
 GPP_DESC: "The GPP organizes as a staunchly nationalist movement centered on protecting Sukarno's Pancasila ideology. It stresses unity, anti-communism, and loyalty to the republic's founding principles. Though not as broad as mass parties, it positions itself as a moral guardian of Indonesia's state philosophy, appealing to those who fear division or extremism could undermine the new nation."
 
 IPKI_TITLE: "League of Supporters of Indonesian Independence (IPKI)"
 IPKI_DESC: "The IPKI, closely linked to military officers, seeks to translate the prestige of the armed struggle into political influence. It stresses order, nationalism, and discipline, presenting itself as a safeguard against instability. Though limited in electoral reach, IPKI carries symbolic weight as a party of veterans, aiming to ensure the sacrifices of independence are honored in the republic's politics."
 
 NU_TITLE: "Nahdlatul Ulama (NU)"
 NU_DESC: "NU, rooted in traditionalist Islam, becomes a major political force by mobilizing pesantren networks, clerics, and rural communities. It emphasizes religious education, community welfare, and loyalty to the republic while resisting secular or radical extremes. With deep ties to Java's countryside, NU provides a powerful voice for traditional Muslims, balancing faith with active participation in Indonesia's democracy."
 
 INO_PPP_TITLE: "United Development Party (PPP)"
 INO_PPP_DESC: "The PPP emerges later as a merger of Islamic parties, uniting diverse Muslim voices under one banner. It promotes the protection of Islamic values, social welfare, and moral governance while working within Indonesia's political system. Formed to strengthen Islamic representation, the PPP becomes a key channel for Muslim aspirations in the parliament, balancing religious conviction with national unity."
 
 GOLKAR_TITLE: "Party of Functional Groups (Golkar)"
 GOLKAR_DESC: "Golkar begins as a federation of professional and functional groups promoted by the state. It presents itself as non-ideological, prioritizing stability, development, and administrative efficiency over partisan politics. Over time, Golkar becomes the dominant ruling organization, aligning with government authority to maintain order and modernize Indonesia. It appeals to civil servants, technocrats, and those favoring strong centralized leadership."
 
 PERTI_TITLE: "Islamic Education Movement (PERTI)"
 PERTI_DESC: "PERTI develops from Islamic educational networks, especially in Sumatra, and transforms into a political force after independence. Rooted in pesantren traditions, it promotes Islamic learning, moral values, and loyalty to the republic. Though smaller than NU or Masyumi, PERTI provides an outlet for regional scholars and students, ensuring education remains central to Indonesia's Islamic politics."
 
 PSII_TITLE: "Indonesian Islamic Union Party (PSII)"
 PSII_DESC: "PSII carries forward the legacy of the early Sarekat Islam movement, one of Indonesia's first mass political organizations. It advocates Islamic values, economic justice, and independence from foreign domination. By the post-independence era, its influence is smaller, but it remains respected as a pioneering Islamic party, symbolizing continuity between the earliest nationalist struggles and the modern republic."
 
 MASYUMI_PARTY_TITLE: "Masyumi Party"
 MASYUMI_PARTY_DESC: "Masyumi emerges as the leading Islamic party, uniting modernist Muslims, intellectuals, and urban activists. It advocates democracy, economic reform, and governance guided by Islamic principles, while promoting national unity. With wide support across the archipelago, Masyumi becomes one of Indonesia's most powerful parties in the 1950s, presenting itself as both a modern political movement and the primary voice of Islamic aspirations."
 
 INO_OTHER_TITLE: "Other Parties"
 INO_OTHER_DESC: "Alongside the major national movements, Indonesia's young democracy also sees the rise of many smaller and regionalist parties. These groups reflect local concerns, cultural identities, and community leaders seeking representation. While their reach is often limited, they bring diversity to parliament, giving voice to regions and interests that might otherwise be overshadowed by the larger blocs."

