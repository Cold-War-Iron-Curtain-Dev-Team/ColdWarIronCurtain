	Indonesia_Serikat_decisions:0 "Post Colonial Development"
	Indonesia_Serikat_decisions_desc:0 "Following the formal transfer of sovereignty from the Dutch East Indies to the Republic of Indonesia, the Indonesian state assumed control of a range of industrial infrastructure that had been previously managed by the colonial administration. These include factories, processing plants, warehouses, workshops, and a range of support facilities, many of which were once critical for the economic configuration of the erstwhile colonial system.\n\n\n\n\n£INO_Development\n\n\n\n\n\nNow in the hands of the state, these assets in consequence present themselves as a blessing and a curse. While much of the industrial machinery and layout would easily cater to either an extractive or export-oriented industry, it also demonstrates great potential for reconversion towards domestic development and industrial self-sufficiency. Many of these installations are already under review for their adaptability; some of them may be repurposed to support national manufacturing, agricultural processing, or energy generation."
