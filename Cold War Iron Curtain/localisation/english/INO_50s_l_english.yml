	#focus desc
	INO_The_Provisional_Government_desc:0 "In the long twilight of colonial struggle, where words have so often been used to delay rather than deliver, the Roem Van Roijen Agreement marks a cautious step away from confrontation and toward a settlement—however imperfect, however unfinished. For the Indonesian side, this agreement with the Dutch is not a victory in itself, but a recognition, however reluctant, that the world is changing, and that our Republic cannot be ignored.\n\nFrom Jakarta to Yogyakarta, in the homes of those who endured exile, war, and silence, the aftermath of Roem Van Roijen’s negotiation brings neither celebration nor full trust, but a wary breath of relief. The Dutch, under increasing pressure from international voices and the shifting postwar mood, have agreed to release our leadership and open the path for further talks. It is not the fulfillment of independence, but it is no longer its denial."
	INO_Remember_the_Revolution_desc:0 "Each year, as August draws near, the memories return—not as distant echoes, but as vivid flame in the soul of the Republic. The Revolution of 1945 was not merely a declaration; it was an uprising of will, born in the heat of occupation, suffering, and unyielding hope. It was the moment when Indonesia, long silent under the weight of empire, found its voice—and roared.\n\nFor those who lived through it, the Proclamation was only the beginning. What followed was not peace, but sacrifice. Youth and elders alike took up arms not for conquest, but to hold fast to a freedom they knew was theirs by right, not permission. Across the archipelago, the kampungs and the cities became battlegrounds not just of bullets, but of spirit—fighting not just against foreign control, but for the right to shape our own future."
	INO_Contact_the_Escapists_desc:0 "In the fragile quiet that followed the political shifts and cautious agreements of the late 1940s, one task remained urgent for the Republic: to reestablish contact with the commanders in exile, deep within the heart of Java—those guerrilla leaders who had held the flame of resistance when the Republic’s cities fell silent and its leaders were taken away.\n\nCut off by Dutch offensives, scattered by terrain and blockade, these men and women had not vanished. From the jungles of Central Java to the slopes of the southern mountains, they had continued the fight in silence—with worn rifles, whispered orders, and the undying belief that the Republic still lived. They did not need reminders of independence; they had bled for it in isolation, through hunger, disease, and fire."
	INO_Restoration_of_the_Government_desc:0 "It had been months since they were taken, escorted away by Dutch forces during the military aggression that sought to silence the Republic. In their absence, the city had held its breath. The people of Yogyakarta, and indeed all Indonesians, had borne the weight of uncertainty, but never surrendered hope. Underground movements carried on. Guerrilla fighters in the hills continued the resistance. The Republic—battered and cornered—refused to die.\n\nNow, after long negotiations and international pressure, the moment had come. The President and Vice President of the Republic were set to return. Not in chains, not under guard, but by the will of the people and the strength of their convictions.\n\nThere was no need to announce what it meant. Every villager, every shopkeeper, every student knew: this was not merely a visit. It was the return of the Republic’s heart and voice."
	#events
	indonesia_news.2.d:0 "On a humid December day, with the weight of revolution still fresh and negotiations barely settled, the United States of Indonesia was officially proclaimed. It was a moment long awaited—Dutch sovereignty had ended, and Indonesia was now, on paper, a free and independent nation. But the form it took was not the singular Republic envisioned in 1945—it was a federal state, pieced together from disparate parts, born more of diplomacy than unity.\n\nThe proclamation followed the outcomes of the Round Table Conference in The Hague, where the Dutch agreed to transfer sovereignty—not directly to the Republic of Indonesia based in Yogyakarta, but to a broader federation consisting of both the Republic and several Dutch-sponsored federal states. This structure, while formally recognizing Indonesia’s independence, reflected Dutch efforts to retain influence by dividing the archipelago into multiple entities under a single flag.\n\nThus, on that day, Sukarno was inaugurated not as President of the 1945 Republic, but as the President of the United States of Indonesia, a compromise title in a compromise state."
	indonesia_news.3.d:0 "Following the death of President Soekarno, the founding father of the Republic and a towering symbol of Indonesia’s revolutionary struggle, the nation has entered a period of deep transition. In the immediate aftermath of his passing, the reins of power have been handed to Air Marshal Omar Dhani, commander of the Indonesian Air Forces, who has now assumed the presidency.\n\nReports suggest that Dhani’s rise to the presidency was not solely the product of institutional process, but was shaped by the personal will and political endorsement of Soekarno himself, expressed in the final period of his leadership. As a close confidant and loyal supporter of Soekarno, Omar Dhani represented continuity within the revolutionary camp—an individual who had been deeply involved in shaping Indonesia’s defense posture and had long aligned himself with the nationalist and anti-imperialist course charted by the late president.\n\nFor the first time, the presidency is now held by a senior military officer, a figure whose career was defined not in the civilian sphere, but in the cockpit of the Air Force and the strategic halls of national defense. Dhani’s leadership is expected to carry forward many of Soekarno’s ideals."
	indonesia.4.d:0 "When the Dutch launched their second military aggression and captured President Sukarno and Vice President Mohammad Hatta, it appeared to the outside world that the Republic had fallen. But deep within the mountains and valleys of Sumatra, the flame of sovereignty was kept alive. In Bukittinggi, far from the occupied capital of Yogyakarta, Sjafruddin Prawiranegara and a handful of Republican officials quietly took up the mantle of leadership, not out of ambition, but out of necessity—to ensure the Republic did not die.\n\nThe PDRI was not a government born of power, but of duty. It was mobile, elusive, and constantly adapting—moving from village to village, coordinating resistance, maintaining communication with guerrilla forces, and sending a clear signal: Indonesia lives, and Indonesia resists.\n\nNow, with the return of the legitimate Republican leadership to Yogyakarta following international diplomatic pressure and the Roem–Van Roijen Agreement, the PDRI has fulfilled its task. It did not cling to power. It did not seek glory. In an act of quiet dignity, it stepped aside—having done what needed to be done when the Republic had no voice."
	indonesia.6.d:0 "Soedirman was more than a military leader. He was the living heartbeat of the revolution, a man whose authority did not come from medals or ranks, but from moral strength, unshakable conviction, and the quiet humility with which he bore impossible burdens. Still young, gravely ill, and often carried on a stretcher through jungles and battlefields, he refused to lay down his arms while the Republic remained under threat. His body grew weak, but his will never did.\n\nThrough the darkest nights of occupation and betrayal, it was Soedirman who rallied both soldiers and civilians with quiet resolve. He fought not only with tactics, but with belief—belief that freedom must be earned not just through arms, but through honor, sacrifice, and discipline. He led guerrilla campaigns not from behind desks, but alongside the very men who marched barefoot through forests and rivers, loyal to him because he had never demanded from them more than he was willing to give himself.\n\nHis death leaves a silence that cannot be filled. Yet in that silence, there echoes the memory of a man who never shouted, never sought glory, and never stepped away from the path he believed in. Soedirman leaves behind no palace, no riches, no monuments of power—only a legacy written in the hearts of those who watched him fight, who followed him into the mountains, and who now must carry forward what he began.\n\nIndonesia has lost a general. But it has gained a legend."
	indonesia.9.d:0 "We sat across from them, not as supplicants, but as survivors. After four years of bloodshed, occupation, exile, and defiance, we came to The Hague to claim what was already ours: our independence. And yet, even as they acknowledged the Republic and prepared to hand over formal sovereignty, the Dutch placed before us one last condition—the debt.\n\nThey called it fair. They said it was the cost of the colonial administration, the price of investments made before the war. But hidden in those figures were the costs of warships and bullets, of the very military campaigns launched to crush our resistance. They asked us, in effect, to pay for the bombs dropped on our own soil. To settle the account for the repression we endured. To finance the cage we broke free from.\n\nTo accept was bitter—an insult, some said. To walk away was to risk our seat among nations, to delay the recognition we had already earned in blood.\n\nWhat should we do?"
	indonesia.10.a:0 "£Hatta_Signature"
	indonesia.10.d:0 "It was not a triumphant departure, but a solemn duty cloaked in the weight of history. When Mohammad Hatta, the Vice President of the Republic, boarded the plane bound for the Netherlands, he did so not with celebration—but with the full knowledge that the very soul of Indonesia’s hard-fought independence hung in the balance.\n\nThe war had not ended in clear victory. The Revolution had cost lives, homes, and years of uncertainty. Though Indonesia had held fast, the Dutch still refused to fully recognize the Republic’s sovereignty. And so, as part of the fragile ceasefire and under immense international pressure, Hatta took flight—not to surrender, but to negotiate what could not be won by arms alone: the world’s recognition of the Republic.\n\nHis journey to The Hague was both physical and symbolic. Crossing oceans, he carried not just documents and diplomatic notes, but the collective hopes of a wounded people. He was a man of intellect, calm restraint, and quiet conviction—far from the firebrand orator—but in those days, no one better represented the poise and principle of the revolution."
	indonesia.11.d:0 "The flags fluttered quietly as the first Republican officials stepped back into Yogyakarta—not as fugitives or prisoners, but as the rightful government of a free nation. Streets once patrolled by foreign troops now echoed with the footsteps of returning leaders. The Republic had come home.\n\nAfter months of absence, exile, and resistance, the symbolic heart of Indonesia was restored. Yogyakarta had not fallen easily, and it had never truly been conquered in spirit. Even as the Dutch claimed the city and exiled its leaders during the second military aggression, the Republic lived on in the hills, in the fields, and in the will of the people. Through the emergency government in Bukittinggi, through guerrilla struggle, through international diplomacy—Indonesia endured.\n\nNow, after the Roem–Van Roijen Agreement and mounting international pressure, the Dutch withdrew. In their place returned the leaders of the Republic—Sukarno, Hatta, and the cabinet, who had been held in captivity for months earlier. Their return was not marked by parade or spectacle, but by a deep, proud calm. Yogyakarta welcomed them with dignity, not as conquerors, but as guardians of a dream restored."
	indonesia.12.d:0 "In the valleys, along the jungle paths, and across the scattered fronts of Java and Sumatra, the sound of gunfire has begun to fall silent. Not because the will to fight has faded—but because the time has come to hold the line through words, not bullets.\n\nFollowing the fragile accord reached through the Roem–Van Roijen negotiations, the Republican military forces, under the Republican leadership, have begun to cease offensive operations against Dutch troops occupying various parts of the archipelago. It is not a surrender—it is a calculated, difficult choice born from a shifting battlefield: from jungle warfare to diplomatic maneuvering.\n\nThe ceasefire marks a turning point. After years of guerilla resistance—fighting from the forests, surviving occupation, holding fast against armored convoys and aerial bombardments—the Republic has now signaled its commitment to a political solution."
	indonesia.15.d:0 "It has been nearly four long years since that blazing morning in August 1945—when Soekarno stood before a humble house in East Jakarta, his voice steady, his words defiant, and declared to the world that Indonesia was free. The ink on the Proclamation had barely dried before the storm began. That moment, radiant with hope, was not the end of our struggle—it was the beginning of a new one.\n\nSince then, the road has been jagged with sacrifice. We have fought not only with rifles, but with bare hands, burning spirit, and the strength of a people who refused to bow again. In the jungles of Sumatra, in the alleys of Surabaya, from the rice fields of Central Java to the hills of Sulawesi—we defended that declaration with blood and will.\n\nWe faced the return of the colonizer, armed with planes, ships, and treaties. We faced division, deception, and delay. We watched our leaders exiled, our cities bombed, and our flag torn down—only to raise it again, every time, higher than before. The republic lived not in buildings or borders, but in the hearts of its people, in the whisper of "Merdeka!" passed from mouth to mouth even in the darkest hours.\n\nAnd now, four years on, we stand still not in peace, but on the edge of possibility. Our struggle is not yet complete. Independence has been declared, yes—but what is declared must still be made real. It is not enough to be free on paper. We must be free in fact. Free from domination, free to choose our future, free to speak, to build, to breathe as a nation whole and sovereign."
	indonesia.15.a:0 "£Soekarno_Signature"
	indonesia_news.1.d:0 "Following Dutch military aggression and the occupation of Yogyakarta in late 1948, key Republican leaders, including President Sukarno and Vice President Mohammad Hatta, were captured and exiled. In response, Sjafruddin Prawiranegara and a group of Republican officials established the PDRI in Bukittinggi, West Sumatra, to ensure the continuity of the Republic and demonstrate that Indonesia remained a sovereign entity in resistance.\n\nWith the return of Republican leaders to Yogyakarta following international pressure and the signing of the Roem–Van Roijen Agreement, the original government was restored. Recognizing the reestablishment of legitimate authority, Sjafruddin and his cabinet have declared the dissolution of the PDRI, effectively ending the emergency administration."
