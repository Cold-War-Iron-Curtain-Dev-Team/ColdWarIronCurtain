	#focus desc
	INO_The_Provisional_Government_desc: "In the long twilight of colonial struggle, where words have so often been used to delay rather than deliver, the Roem Van Roijen Agreement marks a cautious step away from confrontation and toward a settlement—however imperfect, however unfinished. For the Indonesian side, this agreement with the Dutch is not a victory in itself, but a recognition, however reluctant, that the world is changing, and that our Republic cannot be ignored.\n\nFrom Jakarta to Yogyakarta, in the homes of those who endured exile, war, and silence, the aftermath of Roem Van Roijen’s negotiation brings neither celebration nor full trust, but a wary breath of relief. The Dutch, under increasing pressure from international voices and the shifting postwar mood, have agreed to release our leadership and open the path for further talks. It is not the fulfillment of independence, but it is no longer its denial."
	INO_Remember_the_Revolution_desc: "Each year, as August draws near, the memories return—not as distant echoes, but as vivid flame in the soul of the Republic. The Revolution of 1945 was not merely a declaration; it was an uprising of will, born in the heat of occupation, suffering, and unyielding hope. It was the moment when Indonesia, long silent under the weight of empire, found its voice—and roared.\n\nFor those who lived through it, the Proclamation was only the beginning. What followed was not peace, but sacrifice. Youth and elders alike took up arms not for conquest, but to hold fast to a freedom they knew was theirs by right, not permission. Across the archipelago, the kampungs and the cities became battlegrounds not just of bullets, but of spirit—fighting not just against foreign control, but for the right to shape our own future."
	INO_Contact_the_Escapists_desc: "In the fragile quiet that followed the political shifts and cautious agreements of the late 1940s, one task remained urgent for the Republic: to reestablish contact with the commanders in exile, deep within the heart of Java—those guerrilla leaders who had held the flame of resistance when the Republic’s cities fell silent and its leaders were taken away.\n\nCut off by Dutch offensives, scattered by terrain and blockade, these men and women had not vanished. From the jungles of Central Java to the slopes of the southern mountains, they had continued the fight in silence—with worn rifles, whispered orders, and the undying belief that the Republic still lived. They did not need reminders of independence; they had bled for it in isolation, through hunger, disease, and fire."
	INO_Restoration_of_the_Government_desc: "It had been months since they were taken, escorted away by Dutch forces during the military aggression that sought to silence the Republic. In their absence, the city had held its breath. The people of Yogyakarta, and indeed all Indonesians, had borne the weight of uncertainty, but never surrendered hope. Underground movements carried on. Guerrilla fighters in the hills continued the resistance. The Republic—battered and cornered—refused to die.\n\nNow, after long negotiations and international pressure, the moment had come. The President and Vice President of the Republic were set to return. Not in chains, not under guard, but by the will of the people and the strength of their convictions.\n\nThere was no need to announce what it meant. Every villager, every shopkeeper, every student knew: this was not merely a visit. It was the return of the Republic’s heart and voice."
	INO_Prepare_for_Negotiation_desc: "With the Republican government now restored in Yogyakarta—our capital in struggle and heart of resistance—Indonesia stands firm and united. The long night of uncertainty has not dimmed our resolve; it has only sharpened our clarity of purpose. The return of our leaders marks not merely a symbolic moment, but a decisive turning point in our national journey.\n\nNow, with renewed legitimacy and the full weight of the people behind us, we prepare to take the next bold step: to confront the Dutch on their own ground. The time has come to go to the Netherlands—not as subjects, not as petitioners, but as rightful representatives of a sovereign people. The world has seen our courage in arms and our endurance in struggle; it must now witness our determination in diplomacy.\n\nThe task ahead is clear: to formalize what we have long fought for—the full and unconditional transfer of sovereignty. No longer will Indonesia stand halfway between dependence and freedom."
	INO_Issue_of_Papua_desc: "As the path toward formal sovereignty opened before us at the Roundtable Conference, one issue stood unresolved—a wound left unhealed: West Papua. While we, the Republic of Indonesia, sat across from the Dutch to negotiate the end of colonial rule, they clung to a fragment of the archipelago as if the spirit of empire had not yet been extinguished.\n\nTo us, the matter was never ambiguous. Papua is part of the same land, the same waters, and the same soul that defines Indonesia. Its people may be diverse in culture and language, as are all within our nation, but the principle is indivisible: no portion of our homeland shall remain under foreign control."
	INO_The_Union_Issue_desc: "Amid the negotiations that shaped the transfer of sovereignty at the Roundtable Conference, one concept emerged from the Dutch delegation with insistence: the creation of a Dutch-Indonesian Union. Presented as a gesture of continued cooperation between the former colonial power and the soon-to-be sovereign Indonesia, it was, in truth, a final attempt by the Netherlands to retain influence over the destiny of the Republic—albeit under new terms.\n\nFrom the Indonesian perspective, this union was not entered into with enthusiasm, but with calculated necessity. Our priority was independence—recognized, legal, and irrevocable. If the Union was the final bridge to secure that outcome, then we would cross it cautiously, eyes wide open. But we made it clear: Indonesia would stand as a free and equal nation, not as a junior partner bound by the old colonial order."
	INO_Federalization_Issue_desc: "From the beginning, the Republic had declared itself one and indivisible. Our struggle was not for a patchwork of states, but for a nation whole and sovereign—from Sabang to Merauke. Yet during the latter years of the conflict, the Dutch sought to establish puppet states and federal regions, creating a false image of a divided archipelago that supposedly longed for autonomy under Dutch guidance.\n\nYet in the pursuit of full independence—recognized, legitimate, and final—we were compelled to navigate this imposed framework."
	INO_Issue_of_Debts_desc: "Among the many burdens placed upon Indonesia during the Roundtable Conference, one stood out in both weight and symbolism: the question of debt repayment. The Dutch, even as they prepared to relinquish formal control, demanded that the new Indonesian state assume responsibility for the financial obligations incurred by the colonial administration of the Dutch East Indies—a regime that had long extracted wealth from the archipelago."
	INO_Proclaim_the_USI_desc: "Of all the unresolved matters that shadowed the Roundtable Conference, the formal establishment of the United States of Indonesia stood as the most complex. It was not merely the creation of a new governmental form—it was the consequence of war, diplomacy, and compromise colliding. To the world, it was the end of colonial rule; to many Indonesians, it was a halfway house to true independence.\n\nStill, for the sake of formal sovereignty and international recognition, we agreed to the federal framework. We accepted it not as an end, but as a political reality to be reshaped from within. The Republic became one of many components, but it remained the beating heart of the new union."
