	#leader desc
	POLITICS_MOHAMMAD_HATTA_DESC:0 "Born in Sumatra, Dutch East Indies, on the 12th of August, 1902, Mohammad Hatta does not need to prod loudly to receive an audience. He was the calm, systematized individual, a strong person who thinks not in noise but in quiet conviction and unmistakable clarity of purpose.\n\nWhere others foster fervor, Hatta draws respect. A thinker, an economist, a nationalist bowed by study halls and exile; he eschews the role of demagogue in favor of the gentleman-statesman-calculated, poised, and uncompromisingly just in his pursuit of justice and independence. His patriotism whispers, not a shout to be ignored, but rooted, principled, and precise.\n\nHis demeanor may keep him away from applause, but he commands respect upon his presence. Their Prime Minister, Hatta, had had gall, went across the table from colonial officials, or ambled among villagers with a quiet grin. In essence, he was the intellect, conscience, and moral balance of the Republic. Freedom, in his concept, is not a cry but a deed-a deed to be built solidly along structures, law, and dignity of labor."
	POLITICS_ANAK_AGUNG_DESC:0 "Born into Balinese aristocracy, Anak Agung was the Raja of Gianyar, educated both in the Netherlands and Indonesia, fluent in diplomacy and steeped in native political traditions. His background was unique: a traditional ruler shaped by colonial administration and Western education, yet increasingly drawn to the nationalist cause.\n\nDuring the Indonesian National Revolution, he chose the path of negotiation and unity. Unlike some federalist leaders who aligned with Dutch-sponsored states, Anak Agung took a more measured and ultimately pro-Republican stance. He became Prime Minister of the State of East Indonesia, a federal entity created by the Dutch to counter the Republic of Indonesia centered in Yogyakarta.\n\nThough his position was inherently tied to Dutch-designed federalism, Anak Agung used his office not to divide, but to seek peaceful reconciliation between the Republic and the federal states. He increasingly acted as a mediator, advocating for a unified Indonesia and working behind the scenes to ensure that diplomacy—not force—would determine the country’s future."
 