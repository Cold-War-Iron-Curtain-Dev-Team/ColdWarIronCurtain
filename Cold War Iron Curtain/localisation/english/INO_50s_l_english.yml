	Indonesia_Serikat_decisions: "Post Colonial Development"
	Indonesia_Serikat_decisions_desc: "\n\n\n\n\n£INO_Development\n\n\n\n\n\n\nFollowing the formal transfer of sovereignty from the £WPA Dutch East Indies to the £INO Republic of Indonesia, the Indonesian state assumed control of a range of industrial infrastructure that had been previously managed by the colonial administration. These include factories, processing plants, warehouses, workshops, and a range of support facilities, many of which were once critical for the economic configuration of the erstwhile colonial system.\n\nNow in the hands of the state, these assets in consequence present themselves as a blessing and a curse. While much of the industrial machinery and layout would easily cater to either an extractive or export-oriented industry, it also demonstrates great potential for reconversion towards domestic development and industrial self-sufficiency. Many of these installations are already under review for their adaptability; some of them may be repurposed to support£politics_industrial_construction national manufacturing,£politics_land_reform agricultural processing, or£growth energy generation."
  Indonesia_1: "Development in Djakarta"
	Indonesia_1_desc: "With the Netherlands gone, we finally acquire full sovereignty, yet our economy is minimal, if not non-existent. We should therefore start developing the main island where our government is seated, the Island of Java. Particularly the region of [842.GetName]."
	Indonesia_2: "Development in East Java"
	Indonesia_2_desc: "With the Netherlands gone, we finally acquire full sovereignty, yet our economy is minimal, if not non-existent. We should therefore start developing the main island where our government is seated, the Island of Java. Particularly the region of [845.GetName], [1982.GetName] and [1983.GetName]."
	Indonesia_3: "Development in D.I. Djogjakarta"
	Indonesia_3_desc: "With the Netherlands gone, we finally acquire full sovereignty, yet our economy is minimal, if not non-existent. We should therefore start developing the main island where our government is seated, the Island of Java. Particularly the region of [846.GetName]."
	Indonesia_4: "Development in Central Java"
	Indonesia_4_desc: "With the Netherlands gone, we finally acquire full sovereignty, yet our economy is minimal, if not non-existent. We should therefore start developing the main island where our government is seated, the Island of Java. Particularly the region of [335.GetName] and [1981.GetName]."
	Indonesia_5: "Development in Banten"
	Indonesia_5_desc: "With the Netherlands gone, we finally acquire full sovereignty, yet our economy is minimal, if not non-existent. We should therefore start developing the main island where our government is seated, the Island of Java. Particularly the region of [843.GetName]"
	Indonesia_6: "Development in West Java"
	Indonesia_6_desc: "With the Netherlands gone, we finally acquire full sovereignty, yet our economy is minimal, if not non-existent. We should therefore start developing the main island where our government is seated, the Island of Java. Particularly the region of [844.GetName]"
	######Rebellion######
	Indonesia_Rebellion_decisions: "Rebellion in Indonesia"
	Indonesia_Rebellion_decisions_desc: "\n\n\n\n\n£Rebellion_INO\n\n\n\n\n\n\nThe conclusion of the most tumultuous period in our history marks a significant turning point for our Republic, which remains in its formative years and finds itself navigating the complex dynamics of the Cold War. As a diverse nation, we are composed of various ethnic groups, each with its own unique culture and traditions. Despite these differences, we are steadfast in our commitment to building a cohesive state, bound together by a singular superceding national identity characterized by a shared homeland, one flag, and one official language.\n\nHowever, the path to unity is fraught with challenges. Certain ethnic and religious groups within our society have resisted this vision, leading to tensions and conflicts that threaten our stability. Some have gone so far as to take up arms in defiance of the central authority. It is imperative that we address these challenges decisively; failing to do so could lead to the dissolution of our young Republic and jeopardize Indonesia's existence as a unified nation.\n\n§Y[830.GetName]§! is owned by the §Y[830.owner.GetNameWithFlag]§!\n§Y[1979.GetName]§! is owned by the §Y[1979.owner.GetNameWithFlag]§!\n§Y[672.GetName]§! is owned by the §Y[672.owner.GetNameWithFlag]§!\n§Y[836.GetName]§! is owned by the §Y[836.owner.GetNameWithFlag]§!\n§Y[844.GetName]§! is owned by the §Y[844.owner.GetNameWithFlag]§!\n§Y[668.GetName]§! is owned by the §Y[668.owner.GetNameWithFlag]§!\n§Y[669.GetName]§! is owned by the §Y[669.owner.GetNameWithFlag]§!\n§Y[858.GetName]§! is owned by the §Y[858.owner.GetNameWithFlag]§!"
	darul_islam_0: "Darul Islam Making Moves!"
	darul_islam_0_desc: "The Forces of Kartosoewirjo are preparing another attack in West Java; we must stop him before he can take another town and village."
	darul_islam_1: "Strike Darul Islam"
	darul_islam_1_desc: "The Rise of §RDI§!§W/§!§RTII§!, commonly known as §RDarul§! §WIslam§! or §W[DAR.GetNameWithFlag]§!, poses a serious threat to the central government; this rebellion wasn't the first and probably wouldn't be the last to arise, as such, we need to take measures against them."
	darul_islam_2: "Raid Their Hideout"
	darul_islam_2_desc: "With §RDarul§! §WIslam§! nearly gone, we should therefore take action to end their rule once and for all and establish our control in the eastern part of West Java. Although it doesn't mean that they will be fully eradicated, such measures will surely end their problematic presence."
	darul_islam_4: "Offer Amir Fatah to Surrender"
	darul_islam_4_desc: "Amir Fatah, also known as Suhario, is one of the commanders of the DI/TII groups. Suhario became the Hisbullah Commandant in the Sidoarjo and Mojokerto regions and field leader of Hisbullah during the Battle of Surabaya. In 1946, Sudirman sent Suhario to West Java to ensure West Java loyalty to Indonesia.\n\nThere he met Kartosoewirjo, the Imam of the Darul Islam, although for several time he tried to convince Kartosoewirjo not to proclaim the Islamic State, he relented after meeting with one of his envoys.\n\nThis, however, is not the full story. Amir Fatah had a rough opinion on the DI/TII reorganization. With his dismay, we could convince him to surrender and pardon him, which will be a blow to the DI/TII leadership."
	south_maluku: "Send Marines to Ambon"
	south_maluku_desc: "On 25th April 1950, following the imminent annexation of East Indonesia to the Republic of Indonesia, federalist Chris Soumokil, Johanes Manuhutu and others formed the Republic of South Maluku, a secessionist state intending to detest the central Jakarta government, as such we can't let this go any further; one way or another, Ambon must be taken. That task falls to the Marine Corps."
	jail_soumokil: "Find Soumokil Hiding Place"
	######Politics#######
	Indonesia_Politics_decisions: "Indonesian Political Issue"
	Indonesia_Politics_decisions_desc: "\n\n\n\n\n£Indonesia_Politics\n\n\n\n\n\n\nCurrent Prime Minister: §Y[INO.GetLeader]§!\n[?INO_Approval_Increase_Rating|%%]\n\nIndonesia is, for many of us, not just a country but our home, our only home. However, despite its rich cultural heritage and potential for growth, we face serious challenges that hinder our progress. Among these are systemic abuses, widespread corruption, entrenched nepotism, and a troubling culture of arrogance. These issues undermine the trust in our institutions and stifle the opportunities for many citizens.\n\nFor Indonesia to truly prosper and realize its full potential, it is imperative that we confront these problems head-on. This requires a collective effort from all sectors of society, including government, civil society, and the private sector. We must foster transparency, accountability, and integrity in our institutions while promoting equal opportunities for every citizen. Only through resolute action and commitment can we hope to overcome these obstacles and build a brighter future for our beloved nation."
	Indonesia_Politics_1: "The Natsir Integrity Motion"
	Indonesia_Politics_1_desc: "§W-----------------------§!\n\n\n\n£Natsir_Motion\n\n\n\n\n\n\nPrime Minister Mohammad Hatta assigned Natsir and Sri Sultan Hamengkubuwono IX to lobby to resolve various crises in the region. Experience around the area adds to Natsir's network. In addition, his ability to negotiate with faction leaders in the RIS Parliament, such as IJ Kasimo from the Catholic party faction and AM Tambunan from the Christian Party, has pushed Natsir to one conclusion, the states are willing to dissolve themselves to unite with RI-as long as they are not told to dissolve themselves."
	Indonesia_Politics_2: "Send Hatta to Pasundan"
	Indonesia_Politics_2_desc: "With Natsir's inability to form a coherent phase to formally reintegrate the States, Mohammad Hatta, working with Sukarni, and Raden Mas Sartono have come to the conclusion that the Prime Minister must go to Pasundan and hear the people's wishes.\n\nThis is the only way if we want to reintegrate the States back to the Republic of Indonesia, especially the State of Pasundan."
	Indonesia_Politics_3: "Join the United Nation"
	Indonesia_Politics_4: "Ask for European Recognition"
	Indonesia_Politics_5: "Contain PKI Influence"
	Indonesia_Politics_6: "Integrate the Sultanate of Buton"
	Indonesia_Politics_7: "Abolish the Sultanate of Buton"
	######DEBUG!!!!!#######
	Indonesia_debug_decisions: "Sukarno Affairs"
	Indonesia_debug_decisions_desc: "\n\n\n\n\n\n\n\n£Sukarno_Affairs\n\n\n\n\n\n\n\n\n\nBeing a President is no easy task; that is why Sukarno, for the better word, finds relief in finding a beautiful woman to wed. Without a partner to accompany him, Sukarno will not feel energetic in doing his duty. Perhaps he could as well wed Larissa Rochefort."
