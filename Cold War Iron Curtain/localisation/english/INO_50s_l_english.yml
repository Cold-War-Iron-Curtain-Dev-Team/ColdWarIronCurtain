	####East Indonesia####
	INS_Negara_Ikut_Tuan: "Negara Ikut Tuan"
	INS_Negara_Ikut_Tuan_desc: "The name "Negara Ikut Tuan" became a symbolic catchphrase for the Republican government in Jakarta in referring to us, but the word is truer than ever.\n\nIn reality, we are a territory within the Dutch Empire. Sooner or later, with the aftermath of Roem van Roijen, we can finally achieve our goals of the United States of Indonesia."
	INS_Independent_In_Name: "Independent, but in name"
	INS_Independent_In_Name_desc: ""
	#decision
	Indonesia_Serikat_decisions: "Post Colonial Development"
	Indonesia_Serikat_decisions_desc: "\n\n\n\n\n£INO_Development\n\n\n\n\n\n\nFollowing the formal transfer of sovereignty from the £WPA Dutch East Indies to the £INO Republic of Indonesia, the Indonesian state assumed control of a range of industrial infrastructure that had been previously managed by the colonial administration. These include factories, processing plants, warehouses, workshops, and a range of support facilities, many of which were once critical for the economic configuration of the erstwhile colonial system.\n\nNow in the hands of the state, these assets in consequence present themselves as a blessing and a curse. While much of the industrial machinery and layout would easily cater to either an extractive or export-oriented industry, it also demonstrates great potential for reconversion towards domestic development and industrial self-sufficiency. Many of these installations are already under review for their adaptability; some of them may be repurposed to support£politics_industrial_construction national manufacturing,£politics_land_reform agricultural processing, or£growth energy generation."
    Indonesia_1: "Development in Djakarta"
	Indonesia_1_desc: "With the Netherlands gone, we finally acquire full sovereignty, yet our economy is minimal, if not non-existent. We should therefore start developing the main island where our government is seated, the Island of Java. Particularly the region of [842.GetName]."
	Indonesia_2: "Development in East Java"
	Indonesia_2_desc: "With the Netherlands gone, we finally acquire full sovereignty, yet our economy is minimal, if not non-existent. We should therefore start developing the main island where our government is seated, the Island of Java. Particularly the region of [845.GetName], [1982.GetName] and [1983.GetName]."
	Indonesia_3: "Development in D.I. Djogjakarta"
	Indonesia_3_desc: "With the Netherlands gone, we finally acquire full sovereignty, yet our economy is minimal, if not non-existent. We should therefore start developing the main island where our government is seated, the Island of Java. Particularly the region of [846.GetName]."
	Indonesia_4: "Development in Central Java"
