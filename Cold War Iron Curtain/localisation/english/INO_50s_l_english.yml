	#focus natsir
	INO_Forming_New_Cabinet_Natsir: "Forming New Cabinet"
	INO_Forming_New_Cabinet_Natsir_desc: "The Natsir Motion is widely considered one of Mohammad Natsir's most significant accomplishments. Following the motion, Natsir received considerable praise and admiration from key figures in the government, including President Soekarno and Vice President Mohammad Hatta, both of whom recognized its impact on the country's future direction.\n\nWith the formal abolition of the federal system, which had previously been instituted, President Soekarno saw an opportunity to reshape the government structure. He entrusted us with the responsibility of forming a new cabinet that would better align with Indonesia's national interests."
	INO_Compromise_With_PNI: "Compromise With PNI"
	INO_Compromise_With_PNI_desc: "§RTHIS PATH IS NOT YET AVAILABLE§!\n\n"Male and female are as two wings of a bird. If two wings are equal in strength, the bird may fly to the highest point; if one of them is broken, the bird may not fly at all"\n\nThis insightful analogy was once articulated by Sukarno, and it resonates even more profoundly in light of the recent events unfolding around us. In our pursuit of stability and progress, we have the opportunity to collaborate with the PNI, pooling our collective strength to fulfill our roles as the newly appointed cabinet of the Unitary State. While voices like those of Soekiman and Anshary may firmly oppose this partnership, we must consider the implications of such resistance. But we could never take such a big risk, can we?"
	INO_Masjumi_Alone: "Masyumi Alone"
	INO_Masjumi_Alone_desc: ""PNI couldn't be trusted, PNI shouldn't ever be trusted, Masyumi will lead Indonesia with the voice of millions of Muslims!"\n\nIf the party opts to pursue its goals independently, it risks alienating the PNI, which, as many citizens perceive, is the dominant political force in the DPRS.\n\nAlthough aligning ourselves with PNI might not yield the best outcomes, Anshary firmly believes that if Masyumi can effectively assert its independence and rally public support, there lies a golden opportunity to form a Cabinet that can truly transform Indonesia into a vibrant, fully realized democracy. This ambitious vision relies on our ability to inspire the populace, clearly articulating our goals and values, to establish Masyumi as the leading force in shaping the nation's democratic future."
