 #Desc
 SPHERE_NONE_DESC: "This nation isn't affiliated with any sphere."
 SPHERE_HOL_DESC: "\n\n£Sphere_Netherlands_pic\n\n\n\n\n\n\n\n\nThe story of the Dutch Colonial Empire begins with a remarkable expedition that aimed to tap into the bountiful spice trade of Southeast Asia. In the late 16th century, Cornelis de Houtman, a daring Dutch navigator, led an expedition to the Banten Sultanate. Ambitious De Houtman's journey marked the beginning of a significant Dutch presence in the region and set the stage for European colonial ambitions."
 SPHERE_INO_HOL_UNION_DESC: "\n\n£Sphere_Dutch_Indonesian_Union_pic\n\n\n\n\n\n\n\n\nEstablished during the historic Roundtable Conference, the Dutch-Indonesian Union represents a significant partnership between Indonesia and the Kingdom of the Netherlands. This union was formed in the context of Indonesia's struggle for independence and aims to foster cooperative relations, economic ties, and mutual understanding between the two nations."
 SPHERE_SOV_FIN_DESC: "\n\n£Sphere_Soviet_Finland_pic\n\n\n\n\n\n\n\n\nAfter World War II, Finland found itself in a precarious position, sharing a long border with the Soviet Union. To maintain its independence and avoid conflict, Finland adopted a policy of neutrality and cooperation with the Soviet Union, while also maintaining its democratic institutions and market economy. This allowed Finland to navigate while preserving its sovereignty."
 SPHERE_SOV_DESC: "\n\n£Sphere_Soviet_Union_pic\n\n\n\n\n\n\n\n\nThe §YSoviet Union§! emerged from the ashes of the Russian Empire following the tumultuous events of the October Revolution in 1917. Under the leadership of the Bolshevik Party, led by figures such as Vladimir Lenin and later Joseph Stalin, the Soviet Union sought to establish a new world, founded on the principles of Marxism-Leninism. The nation rapidly transformed into a centralized autocratic state, characterized by a planned economy, collectivization of agriculture, and a focus on heavy industry.\n\nThroughout its existence, the Soviet Union played a pivotal role in global affairs, particularly during World War II and the subsequent Cold War era. It stood as a counterbalance to Western capitalist powers"
 SPHERE_USA_DESC: "\n\n£Sphere_United_States_pic\n\n\n\n\n\n\n\n\n"§YThen conquer we must when our cause it is just, and this be our motto:§! '§CIn God is our trust.§!'"\n\nThe §YUnited States of America§! emerged from the Second World War as a nation of ideals. With the Truman Doctrine taking precedence over the Monroe Doctrine, America entered a new era where the old Empire was fading. and the beginning of a rivalry with the Communist Soviet Union."
 SPHERE_RAJ_DESC: ""
 SPHERE_CHI_DESC: "\n\n£Sphere_China_ROC_pic\n\n\n\n\n\n\n\n\nFor nearly a century, the land of the dragon, endured abuse, colonization, and suffering. This began to change when the Kuomintang united the nation under a common cause to resist the Empire of Japan during the Second Sino-Japanese War.\n\nThe "Century of Humiliation" seemed poised to come to an end, as the Kuomintang's triumph over Japan would lead to a resurgence of Chinese power. With the threat of communism looming, there was hope that China could once again reclaim its position as a world power."
 SPHERE_ENG_DESC: "\n\n£Sphere_United_Kingdom_pic\n\n\n\n\n\n\n\n\nThe British Empire, at its zenith, was the largest empire in history and, for over a century, was the foremost global power. The phrase 'the sun never sets on the British Empire' aptly described its vast expanse across the globe. The empire's influence spanned continents, encompassing diverse cultures and regions, and played a pivotal role in shaping world history through colonization, trade, and cultural exchange."
 SPHERE_SOV_Satellite_DESC: "\n\n£Sphere_Soviet_Satellite_pic\n\n\n\n\n\n\n\n\n........................................................."
 SPHERE_PER_DESC: ""
 SPHERE_INO_DESC: "\n\n£Sphere_Indonesia_pic\n\n\n\n\n\n\n\n\nThe Republic of Indonesia, a sprawling archipelago of over 17,000 islands, has a rich and complex history that has shaped its identity as a nation. From the ancient kingdoms of Srivijaya and Majapahit to the era of Dutch colonial rule, Indonesia's past is marked by a tapestry of cultures, religions, and influences. The struggle for independence in the mid-20th century, led by figures like Sukarno and Hatta, culminated in the proclamation of independence in 1945. Since then, Indonesia has navigated a path of nation-building, economic development, and cultural diversity, emerging as a vibrant and influential country in Southeast Asia."