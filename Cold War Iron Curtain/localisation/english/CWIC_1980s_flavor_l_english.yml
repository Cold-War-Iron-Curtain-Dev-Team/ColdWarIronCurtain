l_english:
 flavor80.1.t:0 "[GetNewspaperHeader]Mount St. Helens"
 flavor80.1.d:0 "The north face of the mountain has collapsed. Ash is falling across Washington state, and the blast has leveled the forest for miles."
 flavor80.1.a:0 "The mountain is gone."
 flavor80.1.b:0 "A terrible eruption."
 flavor80.2.t:0 "[GetNewspaperHeader]John Lennon Shot"
 flavor80.2.d:0 "John Lennon has been shot outside his home in New York. The news has stopped the city, and the radios have little else to play."
 flavor80.2.a:0 "The music stopped."
 flavor80.3.t:0 "[GetNewspaperHeader]The Bologna Massacre"
 flavor80.3.d:0 "A bomb has torn through the waiting room at Bologna Centrale. The dead are commuters. Italy's years of lead have reached the railway station."
 flavor80.3.a:0 "Find who did this."
 flavor80.3.b:0 "A massacre in Bologna."
 flavor80.4.t:0 "[GetNewspaperHeader]The Cortes Held"
 flavor80.4.d:0 "Civil Guards have stormed the Spanish parliament and held the deputies at gunpoint. By morning the attempt has failed, and the king has kept the constitution."
 flavor80.4.a:0 "The Cortes held."
 flavor80.4.b:0 "The coup failed."
 flavor80.5.t:0 "[GetNewspaperHeader]The Miners' Strike"
 flavor80.5.d:0 "Britain's coal miners have walked out. Pits are picketed, the police are on the roads, and the government and the union are set for a long fight."
 flavor80.5.a:0 "The pits are out."
 flavor80.5.b:0 "Britain is on strike."
 flavor80.6.t:0 "[GetNewspaperHeader]Live Aid"
 flavor80.6.d:0 "Wembley and Philadelphia are on the air the same day, playing for famine relief. The concerts will be watched by a good part of the world."
 flavor80.6.a:0 "Wembley is full."
 flavor80.6.b:0 "Philadelphia is on the air."
 flavor80.6.c:0 "They raised a fortune."
 flavor80.7.t:0 "[GetNewspaperHeader]The Challenger Disaster"
 flavor80.7.d:0 "The shuttle Challenger has broken apart just after launch. The crew is lost, and the flight schedule stops with them."
 flavor80.7.a:0 "We will continue."
 flavor80.7.b:0 "A dreadful loss."
 flavor80.8.t:0 "[GetNewspaperHeader]Black Monday"
 flavor80.8.d:0 "Wall Street has fallen harder in a day than it has in years. The selling has spread past New York before the closing bell."
 flavor80.8.a:0 "The floor has broken."
 flavor80.8.b:0 "Wall Street is in freefall."
