l_english: 

 ROC_Review_the_Economy: "Review the Economy"
 ROC_Review_the_Economy_desc: "The French colonies need to reassess their status after the Second World War. We should also see if we can improve any of our infrastructure."
 ROC_Military_Reform: "Military Reform"
 ROC_Military_Reform_desc: "Many of our brightest are now in France after having shown their merit by fighting Vichy France. We must compensate."
 ROC_The_Matters_of_Colonial_Administration: "The Matter of Colonial Administration"
 ROC_The_Matters_of_Colonial_Administration_desc: "The colonial system must be overhauled in an age of increasing connectivity."
 ROC_The_New_Governor_1951: "The New Governor"
 ROC_The_New_Governor_1951_desc: "Cornut's time is up. France has dictated that Bernard will go."
 ROC_Standardize_Laws: "Standardize Laws"
 ROC_Standardize_Laws_desc: "We should standardize laws across these colonies in order to increase the efficiency of our government."
 ROC_An_Equatorial_Customs_Union: "An Equatorial Customs Union"
 ROC_An_Equatorial_Customs_Union_desc: "We need to formally establish an economic union between our colonies. This will increase the efficiency of our factories."
 ROC_Aid_From_the_Homeland: "Aid from the Homeland"
 ROC_Aid_From_the_Homeland_desc: "We can petition the French for industrial aid. We were the most devoted region and kept with the True French despite the existence of the Vichy French."
 ROC_More_Rubber: "More Rubber"
 ROC_More_Rubber_desc: "Rubber is one of the staples of our economy. We need more of it."
 ROC_Industry_of_Brazzaville: "Industry of Brazzaville"
 ROC_Industry_of_Brazzaville_desc: "Let us encourage a promising industrial center. Our industry needs to grow in size."
 ROC_Inroads_into_Africa: "Inroads into Africa"
 ROC_Inroads_into_Africa_desc: "We need more ways to travel between the Equatorial colonies."
 ROC_Mining_in_Chad: "Mining in Chad"
 ROC_Mining_in_Chad_desc: "Chad is rich in rare resources. We should exploit this fact."
 ROC_Minds_of_Tommorrow: "Minds of Tomorrow"
 ROC_Minds_of_Tommorrow_desc: "We need to make a cumulative effort to educate the natives."
 ROC_Public_Schools: "Public Schools"
 ROC_Public_Schools_desc: "Public schools will encourage equality and will reach more people. This might anger some native chiefs who fear what this might mean for their traditional practices."
 ROC_Teach_Local_Languages: "Teach Local Languages"
 ROC_Teach_Local_Languages_desc: "Local languages are the backbone of these colonies. Without them, nothing can be done to the natives. This will please many people in our colonies as a sign of indigenization."
 ROC_Private_Schools: "Private Schools"
 ROC_Private_Schools_desc: "Private schools encourage order. No one will complain about them."
 CAN_Encourage_French: "Encourage French"
 CAN_Encourage_French_desc: "Teaching French primarily will increase the loyalty of the natives while making them a bit uppity. It will give us some more political capital to negotiate with France, however."
 ROC_Teaching_Reforms: "Teaching Reforms"
 ROC_Teaching_Reforms_desc: "Learning in these colonies must be made easier. We need to hire better teachers and look over our system of teaching."
 ROC_Catholic_Missionaries: "Catholic Missionaries"
 ROC_Catholic_Missionaries_desc: "We should encourage the partnership of these private schools with Catholic missionaries. This will only solidify the established order."
 ROC_Local_Troops: "Local Troops"
 ROC_Local_Troops_desc: "We need to encourage people to join our army. This will make up for the emigration of French soldiers after the Second World War."
 ROC_Local_Officers: "Local Officers"
 ROC_Local_Officers_desc: "We should build our own military culture, independent from France. We should encourage locals to join our army corps."
 ROC_Officer_Schools: "Officer Schools"
 ROC_Officer_Schools_desc: "Opening local officer schools will encourage our own military culture and make us more autonomous. It will also solve the problem of untalented native officers."
 ROC_Officers_from_Home: "Officers from Home"
 ROC_Officers_from_Home_desc: "We should continue to depend on France for our military strategies."
 ROC_Bargain_with_France: "Bargain with France"
 ROC_Bargain_with_France_desc: "We could petition France for some military divisions considering our loyalty to them."
 ROC_Army_Reform: "Army Reform"
 ROC_Army_Reform_desc: "We need to rethink the way our army works. We need to figure out its priorities."
 ROC_Jeeps_Across_the_Plains: "Jeeps Across the Plains"
 ROC_Jeeps_Across_the_Plains_desc: "Our primary focus must be in the North, where motorized divisions work efficiently and we are at threat from Egypt and Libya. Motorized divisions are the way to modernizing our army."
 ROC_Cut_the_Trees: "Cut the Trees"
 ROC_Cut_the_Trees_desc: "We need to focus on tree-clearing techniques to allow our motorized troops through the jungle. Practice exercises will free up space for factories while teaching our army how to move Jeeps through a jungle."
 ROC_Army_of_the_Brush_and_Jungle: "Army of the Brush and Jungle"
 ROC_Army_of_the_Brush_and_Jungle_desc: "Equatorial Africa is mainly forest and jungle. We need to focus on defending the majority of our country. Motorized troops do nothing in a jungle."
 ROC_Local_Initiative: "Local Initiative"
 ROC_Local_Initiative_desc: "We need to inspire natives so that they defend this nation. Their experience with local traditions and areas will help our army greatly."
 ROC_Minor_Details: "Minor Details"
 ROC_Minor_Details_desc: "Although we are a colony, the Homeland gives us leeway as to how to conduct ourselves. Let us reevaluate our policy in this new era."
 ROC_Undermine_French_Governors: "Undermine French Governors"
 ROC_Undermine_French_Governors_desc: "The governors are hobbyists. They are keeping this nation back and creating a culture of nepotism. They need to be removed silently."
 ROC_Support_the_French_Governors: "Support the French Governors"
 ROC_Support_the_French_Governors_desc: "French Governors are invaluable. They know this country almost as well as the natives. They can control their native populations. We need to support them as they strive to Frenchify this territory."
 ROC_Restrict_Local_Councils: "Restrict Local Councils"
 ROC_Restrict_Local_Councils_desc: "Local councils are a stepping stone to independence and indigenization. They will tear this land apart."
 ROC_Forced_Labor: "Forced Labor"
 ROC_Forced_Labor_desc: "Forced labor has worked well in the Congo. We must implement it here so we can modernize."
 ROC_Cooperate_with_Local_Councils: "Cooperate with Local Councils"
 ROC_Cooperate_with_Local_Councils_desc: "Given some changes in the way they work, local councils can endear our government to the local people."
 ROC_The_Governors_Government: "The Governor's Government"
 ROC_The_Governors_Government_desc: "Our governmental system has been rearranged to the greatest extent we can change it so far. Let us press on with change."
 ROC_Request_Autonomy: "Request Autonomy"
 ROC_Request_Autonomy_desc: "We can only modernize so much as a colony. It is necessary to gain more autonomy and be able to introduce the best policies on the ground quickly."
 ROC_Autonomy_Denied: "Autonomy Denied"
 ROC_Autonomy_Denied_desc: "It seems as though the French are not ready to break off Equatorial Africa. We must make them see the light."
 ROC_Stir_Up_Discontent: "Stir Up Discontent"
 ROC_Stir_Up_Discontent_desc: "France needs to know how repressive the lack of autonomy is."
 ROC_Native_Resentment: "Native Resentment"
 ROC_Native_Resentment_desc: "It is inevitable that some may grow to hate our government as a result of our literal interpretation of French policy."
 ROC_Stage_Riots: "Stage Riots"
 ROC_Stage_Riots_desc: "We must keep going. Autonomy for us and the people as well is in sight."
 ROC_Demand_Emergency_Powers: "Demand Emergency Powers"
 ROC_Demand_Emergency_Powers_desc: "We need to crack down on these protestors. France will know then that they have made a mistake."
 ROC_Autonomy_Accepted: "Autonomy Accepted"
 ROC_Autonomy_Accepted_desc: "After a long negotiation process, France has finally decided to release parts of their overlordship to our government in Pointe-Noire."
 ROC_Administrative_Reform: "Administrative Reform"
 ROC_Administrative_Reform_desc: "To put it simply, French direction was holding this territory back. Now everything will change."
 ROC_Power_to_the_Governor: "Power to the Governor"
 ROC_Power_to_the_Governor_desc: "The Governor will be the head of our government not only in name. All shall be subservient."
 ROC_A_Unitary_Constitution: "A Unitary Constitution"
 ROC_A_Unitary_Constitution_desc: "Ubangi-Shari, Gabon, Congo. These are not possible independent states. The only possible independent state in this Area is Equatorial Africa."
 ROC_Suspend_our_Ambitions: "Suspend our Ambitions"
 ROC_Suspend_our_Ambitions_desc: "We have gone too far. We need to calm the people."
 ROC_Governor_Chauvet_Takes_Command: "Governor Chauvet Takes Command"
 ROC_Governor_Chauvet_Takes_Command_desc: "Gabriel Chauvet is here to save the African people from the abuse of Cornut-Gentille."
 ROC_Locals_In_Civil_Service: "Locals in Civil Service"
 ROC_Locals_In_Civil_Service_desc: "We must make our administration more efficient by including the local people."
 ROC_Regional_Autonomy: "Regional Autonomy"
 ROC_Regional_Autonomy_desc: "Let us contemplate the idea of regional autonomy. Should we increase or decrease it?"
 ROC_Destandardize_Laws: "Destandardize Laws"
 ROC_Destandardize_Laws_desc: "As a step to autonomy, we should give up the idea of keeping the laws across this territory identical. It makes no sense for each state to have the same set of laws."
 ROC_Keep_the_Current_System: "Keep the Current System"
 ROC_Keep_the_Current_System_desc: "Equatorial Africa will advance by expanding its authority, not by destandardization."
 ROC_Invite_Cameroon: "Invite Cameroon"
 ROC_Invite_Cameroon_desc: "The Mandate of Cameroon should be given to us. Let us ask the local governors what they think."
 ROC_Union_of_Central_African_Republics: "Union of Central African Republics"
 ROC_Union_of_Central_African_Republics_desc: "We should officially change our name. We are not simply French."
 ROC_1951_Development_Plan: "1951 Development Plan"
 ROC_1951_Development_Plan_desc: "Let us create a set of plans to modernize our nation."
 ROC_End_Forced_Labor: "End Forced Labor"
 ROC_End_Forced_Labor_desc: "Let us get rid of the inhumane practice of what people have called pseudo-gulags."
 ROC_Development_Plan_Modernization_51: "1951 Modernization Plan"
 ROC_Development_Plan_Modernization_51_desc: "Our country must advance."
 ROC_1953_Development_Plan: "1953 Development Plan"
 ROC_1953_Development_Plan_desc: "We will continue to progress."
 ROC_Development_Plan_Modernization_53: "1953 Modernization Plan"
 ROC_Development_Plan_Modernization_53_desc: "We must continue to focus on bringing our country into the future."
 ROC_The_State_of_Equatorial_Africa: "The State of Equatorial Africa"
 ROC_The_State_of_Equatorial_Africa_desc: "It is time to declare a new African state. It is now reality. Our dreams have come true."
 ROC_A_Union_Under_Gentille: "A Union Under Gentille"
 ROC_A_Union_Under_Gentille_desc: "We must not forget who has brought us here. Let us give him the highest title we can. He will be a Consul, like Napoleon."
 ROC_Sweeten_the_Deal: "Sweeten the Deal"
 ROC_Sweeten_the_Deal_desc: "France will surely not mind independence if we give them something in return."
 ROC_France_Rejects: "France Rejects"
 ROC_France_Rejects_desc: "Unfortunately, France has not given us independence just yet. We must see what we can do."
 ROC_Request_Independence: "Request Independence"
 ROC_Request_Independence_desc: "We believe we have shown France that we are ready for independence. Let us wait for their response."
 ROC_France_Accepts: "France Accepts"
 ROC_France_Accepts_desc: "Today is a happy day. France has given us independence."
 ROC_Autonomy_to_Gabon: "Gabonese Autonomy"
 ROC_Autonomy_to_Gabon_desc: "Gabon faces much the same issue as Ubangi-Shari, but they need more autonomy due to their proximity to Cameroon and Spanish holdings."
 ROC_Give_Political_Authority_to_Ubangi_Shari: "Devolve Power to Ubangi-Shari"
 ROC_Give_Political_Authority_to_Ubangi_Shari_desc: "We should give more power to the local governors of Ubangi-Shari. They are isolated from Pointe-Noire and require special local attention."
 ROC_Dissolution_of_French_Equatorial_Africa: "Dissolution of French Equatorial Africa"
 ROC_Dissolution_of_French_Equatorial_Africa_desc: "Decolonization cannot be held back any longer. It is now time to dissolve."
 ROC_1955_Development_Plan: "1955 Development Plan"
 ROC_1955_Development_Plan_desc: "It is time to continue our industrial plans."
 ROC_Development_Plan_Modernization_55: "1955 Modernization Plan"
 ROC_Development_Plan_Modernization_55_desc: "We will catch up with French industry by 1960!"
 roc_france_pay: "Payments to France"
 roc_france_pay_desc: "We are paying France to achieve independence."
 roc_france_give: "Equatorial African Payments"
 roc_france_give_desc: "We are getting tributes from our Equatorial African colony in exchange for their independence."
 equ.1.t: "Change of Governor"
 equ.1.d: "The French have decided that Bernard Cornut-Gentille's time is up. He had been promised governor for a few years after the Second World War. However, he has served that time, and now France wishes to recall him and replace him with another governor, Paul Louis Gabriel Chauvet. We can dispute this, but no one will be happy and our opportunity for reform will be missed."
 equ.1.a: "Send Gentille home"
 equ.1.b: "Keep Gentille"