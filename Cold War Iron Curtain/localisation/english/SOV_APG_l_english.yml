 SOV_Bulganin:0 "Bulganin's Union"
 
 SOV_APG_takeover:0 "Successful coup of the Old Guard"
 SOV_bulganin_union:0 "Bulganin's Union"
 SOV_pr_take_mea_again_cornman:0 "Deal with Khrushchev"
 SOV_rev_pol_bureau:0 "Reshuffle Political Bureau"
 SOV_mol_coun_min_chairman:0 "Reappoint Molotov as chairman of council of ministers"
 SOV_kag_dep_chairman:0 "Reappoint Kaganovich as Deputy Chairman "
 SOV_inves_posp_report:0 "Investigate the Truthfulness of the 'Pospelov Report'"
 SOV_low_destalinization:0 "Reversing Destalinization"
 SOV_return_stalin_agroculture_methods:0 "Reinstate Stalinist Agriculture Collectivization"
 SOV_reg_com_purge_khrush:0 "Order regional committees to purge Khrushchevites"
 SOV_khrush_affairs:0 "Investigation of the Khrushchev Affair"
 SOV_return_stalin_stat:0 "Restore Stalin's Legacy"
 SOV_rem_khrush_cpsu_dogma:0 "De-Khrushchevization of the CPSU ideological base"
 SOV_revisionism_deafeated:0 "The Union, back on the right track"
 SOV_trip_to_tirana:0 "A Gesture to Tirana"
 SOV_trip_to_beijing:0 "A Gesture to Beijing"
 SOV_bulganin_byebye:0 "Bulganin's resignation"
 SOV_21st_Congress_Bulg:0 "21st Extraordinary Congress of the CPSU"

 
 SOV_APG_takeover_desc:0 "The efforts of the Presidium have have paid off and disaster has been averted, as Nikita S. Khrushchev has been ousted from all positions of power. Following his disastrous policies and administrative arbitrariness, Comrades V. Molotov, L. Kaganovich, G. Malenkov and D. Shepilov succeeded in removing him from office and have started the tedious process of reversing the damage done by Khrushchev during his period in power. The Old Guard has prevailed, and now it is up to them to shape the union in their image."
 SOV_bulganin_union_desc:0 "Following the removal of the revisionist traitor Khrushchev, Comrade Nikolai Alexandrovich Bulganin has assumed leadership as Premier of the Soviet Union and temporarily as First Secretary of the CPSU until a new one is elected by the Central Committee. Having served as Deputy Premier under Comrade Stalin and a member of the Politburo, Comrade Bulganin's leadership will surely bring the Soviet Union back on the right track."
 SOV_pr_take_mea_again_cornman_desc:0 "Although Khrushchev has been ousted, he hasn't necessarily been properly 'dealt with', as long as he remains within the bodies of government he is a threat to any attempts to revert his disastrous reforms and steer the Union away from its previous suicidal path. The Central Committee has come to the conclusion that we must do with Khrushchev what was done to Beria, have him swiftly accused of a couple of serious charges and imprisoned. Although risky, it is both a just fate for the revisionist traitor and an effecient way of solving the 'Khrushchev question'."
 SOV_mol_coun_min_chairman_desc:0 "Comrade Vyacheslav M. Molotov, a devoted Marxist-Leninist ever since the first days of our party, has been a faithful student of the late Comrades Lenin and Stalin and the latter's right-hand man. His leadership and achievements as People's Commissar for Foreign Affairs and Chairman of the Council of People's Commissars have not only propelled our Union into the future, but ensured its survival. It is only fair then, that an experienced Old Bolshevik such as himself be reappointed as Chairman of the Council of Ministers, as his experience and stern devotedness to true communist principles is what our union's leadership needs during these troublesome times."
 SOV_kag_dep_chairman_desc:0 "If Comrade Molotov was Stalin's right hand man, Comrade Lazar M. Kaganovich was his left. Kaganovich's efforts to the construction of socialism are inmeasurable, from his tempered commitment to Marxism-Leninism, to overseeing such marvels as the Moscow Metro and the successes of our Union's industrialization program, it is clear that Comrade Kaganovich is a man that can be trusted and his firm hand as Deputy Chairman of the Council of Ministers will once more lead socialist construction down the right path."
 SOV_return_stalin_agroculture_methods_desc:0 "The profit-driven market reforms in the countryside implemented by Khrushchev's clique are a betrayal to Marxist-Leninist principles and put at stake the effectiveness of our collectivization program and the proletarianization of the peasantry. We must discard these immediately and return to the Leninist-Stalinist methods of agricultural development, while improving them with newer technology."
 SOV_reg_com_purge_khrush_desc:0 "Although Khrushchev has been executed and revisionist influence has significantly decreased in the upper bodies of our government, we must not forget that in the turbulent 1930s, the Yezhovschina and the Bloc of Rights and Trotskyites operated through regional committees to carry out their acts of terrorism and sabotage. Although our security apparatus has significantly improved since then, chances cannot be taken and a large sweep must be carried out to rid these committees of Khrushchev's lackeys."
 SOV_khrush_affairs_desc:0 "Due to the criminal and traitorous nature of Khrushchev's behavior, Comrade Nikolai A. Bulganin has set up a commission tasked with investigating Khrushchev's rise to power, the real depth of the damage caused by his revisionist tendencies, his role in Stalin's death and the peculiar nature of the purges carried out in the Ukrainian SSR under his leadership as First Secretary in 1938. The commission's final report is expected to be ready for the upcoming 21st Congress of the CPSU and will be a heavy blow to the revisionist remnants within our party."
 SOV_return_stalin_stat_desc:0 "During his so called 'crusade' against Comrade Stalin and his legacy, Khrushchev completely tarnished the image of our late leader, accusing him of completely falsified charges and blaming practically every single excess or tragedy on the single personality of Comrade Stalin. With the wreckers caught, it is time to rehabilitate Stalin. Every statue shall be restored, every portrait put back up and any trace of the lies spread by the traitors erased. The image of Lenin's most faithful student shall never be tarnished ever again!"
 SOV_inves_posp_report_desc:0 "The so-called Pospelov Report, commissioned by the traitor Khrushchev, is a fishy document to say the least. Rehabilitations of convicted criminals without proper proof of innocence, reliance on unverified testimonies and outright contradictory documentary sources for its most serious accusations make it clear that this 'report' was in reality a poorly put together slanderous attack against our late Comrade Stalin. A thorough investigation must be launched to determine the truth behind these claims and to expose all the falsifications that have misled the Party and the people."
 SOV_rem_khrush_cpsu_dogma_desc:0 "Khrushchev's 'improvements' in the Soviet doctrine such as the 'State of the Whole People' and peaceful coexistence with the Western Imperialists have resulted in disastrous deviations from the correct Marxist path of socialist construction. Not only will we reverse all these disgusting revisionist deviations, but we shall also implement rigid and compulsory ideological courses in Marxism-Leninism to prevent such deviations from the younger cadres in the future."
 SOV_low_destalinization_desc:0 "Khrushchev's so-called 'De-Stalinization' has been the cause of practically all of the problems our Union has faced during the past couple of years. From smeering the image of Lenin's most faithful pupil, serving as an ideological prerequisite for Khrushchev's disastrous reforms, to ruining our relations with our Comrades in Albania and China who rejected revisionism and smeering the reputation of the socialist movement worldwide, this disastrous historically-nihilistic policy must be put to an end immediately. We shall sweep away the pile of rubbish heaped on Comrade Stalin's grave and clarify and disprove the lies and slander propagated by the Khrushchevites."
 SOV_revisionism_deafeated_desc:0 "The day has finally come. After purging all the revisionists and reversing our Union's suicidal course, the Old Guard's wise and stern hand has placed the land of October back on the socialist road. Under Comrade Bulganin, revisionism has been crushed, the traitors punished, the mistakes reversed, and our great Motherland is steady as she goes! Long Live the ideas of Lenin and Stalin! Long live the Dictatorship of the Proletariat! Long live the Working Class!"
 SOV_rev_pol_bureau_desc:0 "Now that the main Khrushchevites have been removed from their positions, we shall begin reshuffling our top political bureau and replacing revisionist traitors with people loyal to the cause of Marx, Engels, Lenin and Stalin. For instance, now that Serov has been arrested, Alexander Shelepin will be appointed as Main Director of the KGB along with Ivan Benediktov being reappointed as Minister of Agriculture and Nikolai Shvernik taking up Furtseva's position of First Secretary of the Moscow City Party Committee. This however, is just the beginning."
 SOV_trip_to_tirana_desc:0 "The brave people of Albania under the leadership of Enver Hoxha resisted the revisionist influence and condemned the Khrushchevites while they were in power. Now that the Khrushchevite's have been dealt with and the land of October is back on the right path, a delegation will be sent to Tirana headed by General Secretary Bulganin himself to mend our relations with these brave Marxist-Leninists"
 SOV_trip_to_beijing_desc:0 "Khrushchev's disastrous policies have severely damaged our relations with our Chinese Comrades, not only by smeering the image of Comrade Stalin and taking the revisionist road, but by attempting to impose big power chauvinism on our Eastern Comrades. Now that the revisionists have been dealt with, it is time to fix these mistakes and resume proper relations with the Chinese Communists, who were brave enough to oppose the suicidal road taken by the Khrushchevites."
 SOV_bulganin_byebye_desc:0 "Despite handling the past turbulent year with great care and putting the Union back on the right path, Comrade Bulganin has expressed his intention to resign from his post of First Secretary of the CPSU, citing his age, the nature of how he was elected to the post and desire to hand over this post to some of his 'more competent' comrades. Unlike with Comrade Stalin however, now that the opportunists and revisionists have been purged from the party, there is no rampant power struggle to see who will replace the former First Secretary. As of now, the two most popular candidates within the party are Chairman of the Council of Ministers Vyacheslav Molotov and Deputy Chairman of the Council of Ministers Lazar Kaganovich who, although sharing the same vision, have different approaches to a couple of issues. Whether it be Molotov or Kaganovich who gets appointed as First Secretary, the Union is surely in good hands."
 SOV_21st_Congress_Bulg_desc:0 "With Comrade Bulganin's resignation, the Central Committee has called for an extraordinary Congress of the CPSU to elect a new First Secretary and charter our Union's course into the future. Along with that, many revelations have been made specifically with the investigation of the so called 'Pospolev Report' and the KGB's dive into the Khrushchev affair, and it is time to shed light onto that which the revisionists tried to shield away from the watchful eyes of the working class. Whatever the results may be, this congress shall be one of the most eventful in our Union's history."
 
 #Molotov events
 
 soviet_leader_change.5.t:0 "Emergency Meeting of the Presidium of the Central Committee of the CPSU"
 soviet_leader_change.5.desc:0 "On June 18, an extraordinary session of the Presidium of the Central Committee was convened, officially to discuss Comrade Khrushchev’s removal as First Secretary of the CPSU. Leading this drive was the so-called 'Anti-Party Group'—Malenkov, Kaganovich, Molotov, and Shepilov—stalwart figures of the Stalin era, who marshaled a majority within the Presidium to challenge Khrushchev's leadership.\n\nRumors persist, however, of a backroom understanding between Marshal Zhukov and KGB Chairman Serov aimed at thwarting the plot. Will these conspirators be exposed and discredited, or will the 'Anti-Party Group' succeed in reshaping the future of the Soviet Union?"
 soviet_leader_change.5.o.A:0 "Khrushchev Prevails. The Plenum of the Central Committee Condemns the Anti-Party Group."
 soviet_leader_change.5.o.B:0 "Khrushchev is ousted. The Old Guard Achieves Victory"
 
 soviet_leader_change.8.t:0 "Appointment of Vyacheslav M. Molotov as General Secretary of the Central Committee of the CPSU"
 soviet_leader_change.8.d:0 ""
 soviet_leader_change.8.A:0 "Glory to you, Vyacheslav Mikhailovich!"
 
 SOV_Molotov.1.t:0 "Final of Central Committee Clean"
 SOV_Molotov.1.desc:0 "\nFor the most part, a historical mistake, after the death of Joseph Vissarionovich Stalin, Khrushchev won the struggle for power. Insane reforms, unnecessary "liberalization", condemnation of the so-called "cult of Stalin's personality", which led to a split in the socialist camp and its associates. But, thanks to a successful combination of events in 57, this error was corrected. Yes, Bulganin's rule was short-lived, but it marked a new era and a return to adequate values in the country, at least observance of the precepts of Marx-Lenin and the withdrawal of the "privatization" of positions in the state by the Khrushchevites. Molotov must understand that Khrushchev has done a lot in 4 years, and it will take a lot of work to turn it all around."
 SOV_Molotov.1.a:0 "Revolutsia idet, socialnaya!"
 
 SOV_Molotov.2.t:0 "Reorganize the presidium"
 SOV_Molotov.2.desc:0 "\nThe Presidium of the Supreme Soviet of the USSR is the place where it all began. In particular, salvation for the country and the coming to power of the group. But if we recall the year 57, only 7 out of 11 members of the presidium voted for Khrushchev's removal. Although we constitued a majority, we cannot allow the possible victory of "new conspirators" of any kind who will try to steer our motherland back on the revisionist road."
 SOV_Molotov.2.a:0 "To protect and save"
 
 SOV_Molotov.3.t:0 "Purge of Mikoyan and Podgorny"
 SOV_Molotov.3.desc:0 "\nAnastas Hovhannesovich Mikoyan was a prominent Stalinist people's commissar in the past, who betrayed himself first of all for the sake of profit in order to retain his position, and Nikolai Viktorovich Podgorny was the first secretary of the Kharkiv Regional Committee, who aimed at prominent Soviet ranks, in his case traitors to the Motherland and Soviet state, who betrayed both the ideas of communism and the entire Soviet Union should be repressed in order to prevent the spread of their infection"
 SOV_Molotov.3.a:0 "Another Khrushev lapdogs, nothing special"
 
 SOV_Molotov.4.t:0 "Purge of Suslov and Ponomarenko"
 SOV_Molotov.4.desc:0 "\nMikhail Andreevich Suslov was a vivid political, and primarily an ideological toy of Khrushchev, in fact, a mouthpiece for promoting revisionist nonsense and a policy of betrayal. Panteleimon Kondratievich Ponomarenko is essentially a nationalist with delusional ideas and megalomania, in particular his desire to transfer Kaliningrad and attempts to become almost secretary of the Central Committee of the CPSU. In order not to promote this horror to the masses, these individuals should be repressed as soon as possible."
 SOV_Molotov.4.a:0 "Common sense always wins"
 
 SOV_Molotov.5.t:0 "Lazar Kaganovich Appointed as a Chairman of Presidium"
 SOV_Molotov.5.desc:0 "\nLazar Moiseevich Kaganovich was officially appointed Secretary of the Presidium - the 2nd person of the state. Kaganovich has always been famous for his dedication and ability to bring things to an end - that's why Molotov is confident in him. It is rumored that he will be the next head of state after Molotov - but let's wait and see"
 SOV_Molotov.5.a:0 "Iron Lazar is the best, as always"
 
 SOV_Molotov.6.t:0 "Dmitry Shepilov was appointed Chairman of the Presidium"
 SOV_Molotov.6.desc:0 "\nDmitry Trofimovich Shepilov - a man with a rather complicated fate, who overcame quite honestly and courageously the crisis of 1957, when everything was already coming to an end, and only the will of chance and ingenuity helped Shepilov to become where he is now. Yes, he does not have an "ideal" reputation - at that meeting of the Presidium he initially chose the side of the traitor Khrushchev, but after reflecting on the situation and thinking everything over, he took the side of common sense. Although Shepilov's role in the success of the group was not so great, his mainly reformist views would help the country to further develop and prosper."
 SOV_Molotov.6.a:0 "New faces in new life"
 
 SOV_Molotov.7.t:0 "Alexei Kosygin reappointed as Minister of Light Industry"
 SOV_Molotov.7.desc:0 "\nAny business requires a strong hand that will also wisely steer and guide in the right direction. Such a "hand" was Kosygin, who until Stalin's death managed this industry, and he was insanely efficient. So why should we not continue the correct, already well-established mechanism, which will also help us?"
 SOV_Molotov.7.a:0 "Patience and hard work will overcome everything"
 
 SOV_Molotov.8.t:0 "Reorganization of the Council of Ministers of the USSR"
 SOV_Molotov.8.desc:0 "\nThe Council of Ministers is one of the most important state bodies, which in essence creates all the policies of the Union of Soviet Socialist Republics, both internal and external, as well as economic. So why don't we take control of the very heart of the state that guides us? If we cannot foresee the actions of each ministry - then we will solve all problems related to the center, i.e., the Chairman of the Council of Ministers - and all problems related to the head of the government will go away, since we will mentor our entire government"
 SOV_Molotov.8.a:0 "The brain in union with the heart will control the entire body"
 
 SOV_Molotov.9.t:0 "Nikolai Bulganin appointed as a Chairman of the Council of Ministers"
 SOV_Molotov.9.desc:0 "\nNikolai Bulganin is a man who led the Council of Ministers from 1955 to 1958, and he already knows a lot. He is prepared, he is ready for anything. He knows the whole country, he knows the mechanism of the government and all related structures. He is loved, he is known. And Comrade Molotov, as a true friend and associate of Nikolai Alexandrovich, kindly left him one of the most important roles to help him, to guide the country on the right course."
 SOV_Molotov.9.a:0 "A communist state must not leave all full power in the hands of one man, otherwise it is not communist"
 
 SOV_Molotov.10.t:0 "Georgy Malenkov appointed as a Chairman of the Council of Ministers"
 SOV_Molotov.10.desc:0 "\nGeorgy Maksimilianovich Malenkov - one of the most important pretenders to the place of Joseph Vissarionovich in the already distant 1953. Yes, despite all his efforts he lost to the insolent scoundrel Khrushchev, but for the moment we can put his plans into action to create true equality unencumbered by anything and anyone."
 SOV_Molotov.10.a:0 "For truth and for prosperity"
 
 #Bulganin events 
 SOV_CornManOutAPG.1.t:0 "[GetNewspaperHeader]Khrushchev Ousted!"
 SOV_CornManOutAPG.1.desc:0 "Much to the shock of the international community and the communist movement, reports from Moscow indicate that Nikita Sergeyevich Khrushchev, General Secretary of the CPSU infamous for his attack on Stalin and his cult of personality, has been ousted after a vote in the Presidium of the Central Committee of the CPSU. Khrushchev has been accused of violating the principles of collective leadership, opportunism, administrative arbitrariness and criticized for his handling of party history and foreign policy, specifically his handling of the Hungarian crisis. \n\nIn his place, a troika has been set up by V. Molotov, L. Kaganovich and N. Bulganin, with the latter serving as First Secretary until a replacement can be picked by the central committee. Khrushchev's deposal has notably been met with cautious endorsement from Albanian leader Enver Hoxha and Chinese leader Mao Zedong, who had previously ruptured with the Soviet government due to what they described as revisionism and big power chauvinism."
 SOV_CornManOutAPG.1.a:0 "So much for the 'Corn-Man'"

Bulg.1.t:0 "Nikolai Alexandrovich Bulganin."
Bulg.1.desc:0 "In accordance to the Presidium vote which ousted Khrushchev, Comrade Nikolai Alexandrovich Bulganin was appointed as First Secretary of the CPSU for the time being, while Khrushchev himself was demoted to minister of agriculture since, according to Comrade L. Kaganovich, he was an 'expert on kukuruza'. Needless to say, disaster had been averted, and Bulganin was now in charge of the Union as both Chairman of Council of Ministers and First Secretary of the Communist party. \nBulganin let himself reflect on this for a while. He wasn't a political protégé, not in the slightest, nor did he want to be. This didn't mean that Bulganin was illiterate when it came to Marxist-Leninist theory not at all, but he would have much preferred to remain in a managerial position, just as he had been during Stalin's times as chairman of the Moscow city government. However now he held the two most important positions in the entire Soviet Union and he found himself questioning whether he truly was the right man for the job. Yet Bulganin refused to fall into a feeling of incompetence, after all, the party needed him, the people needed him. \n\nKhrushchev's reforms had devastated socialist construction, that much was clear. Someone needed to put the land of October back on the right track and, out of all of the Politburo members, Bulganin was the least likely to be opposed since his fellow Old Bolsheviks had been, to a degree, discredited by the Secret Speech. The Party had spoken, and the Party was never wrong, and so it was now Bulganin's duty to clean up all the mess caused by almost half a decade of revisionism and administrative arbitrariness. But first, the newly appointed First Secretary had to properly deal with the man responsible for all of it..."
Bulg.1.a:0 "Good Luck, Nikolai Alexandrovich! There's a lot to be done..."

Bulg.101.t:0 "Moscow, Lubyanka Building, 1:30AM"
Bulg.101.desc:0 "Alexander Shelepin found himself staring at an envelope stamped 'Of Special Importance' as his eyes darted open. The courier had arrived shortly after 1 AM and although Shelepin had initially dismissed the letter due to his groggy state, after realising it had come from the Kremlin and reading its contents he really wished he hadn't. There, written in what was unmistakably Comrade Molotov's handwriting, was a short directive that simply said: ''Comrade Ivan Serov is to be removed from his duties and placed under arrest immediately.'' with First Secretary Bulganin's Signature at the very bottom, and that was enough to make any sense of tiredness evaporate from his body. \nShelepin's mind began to race as his eyes stared at the words in disbelief. He had started out as the First Secretary of the Komsomol under Comrade Stalin as an ambitious and well-educated man and to his surprise, had retained his position after De-Stalinization despite being a favorite of the late leader's. Then shortly after, the coup happened, and yet once again Shelepin remained not only untouched, but began getting actively promoted. In fact, he had been assigned to the post of First Deputy Chairman of the KGB just a couple weeks before this fateful night. A decision he now understood the reasoning of. \n\nWithin minutes Shelepin began to make preparations. Only a handful of officers could be trusted with such a task. Too many men and word might spread. Too few and Serov might resist. Shelepin had read and heard about Yezhov's arrest, how he had been rightfully brought to justice by his own subordinates for his disgusting abuses and swiftly liquidated, and he couldn't help but feel somewhat thrilled at the prospect of getting to experience what his predecessors had. Once he had assembled his team the men then proceeded to make their way to Serov's office, who was completely unaware of what awaited him. The corridors of the Lubyanka Building were unusually quiet as they approached the Chairman’s office. Shelepin was the one to knock on his door, and when Serov opened it, shoved the arrest warrant into his face. To Shelepin's surprise, he simply studied the document for a moment before nodding slowly. ''I suppose it was inevitable''. Ivan Serov was then placed in handcuffs, his aides dismissed, and then led down the hall, never to be heard from again."
Bulg.101.a:0 "First Yagoda, Then Yezhov, Then Beria, Now Serov."

Bulg.102.t:0 "The Ballad of Mikhail Suslov"
Bulg.102.desc:0 "The corridors of the Central Committee building had grown unusually quiet when Malenkov and Molotov arrived outside Suslov’s office. It was already late at night and yet the two Bolsehviks knew that Suslov was most likely still working. Mikhail Suslov was the man who had taken Zhdanov's position in 1948 as Senior Secretary of Ideology after the latter's tragic passing and was one of the most influential men in the Union. Molotov took a moment to think. From what he knew Suslov was a man who valued stability and ideology above all, an orthodox in that sense. And yet, if that were the case why didn't he at the very least stay quiet at the slanderous 20th Congress? Why did he actively denounce the so called 'cult of personality'? Molotov quickly came to the conclusion that, far from his predecessor Andrei Zhdanov, Suslov had become complacent, had lost most revolutionary spirit and would've continued being a reluctant subservient to the Khrushchevite clique had they not been ousted. And yet, Molotov knew from all his years working with the Senior Secretary that after the disasters in Hungary and Georgia, the tarnished relations with Albania and China and the whole concept of 'detente' with the Imperialists introduced by the revisionists, that Suslov was most likely not too pleased with Khrushchev, and therefore, could certainly be convinced to work against any potential countercoup Khrushchev could plan. The two men then knocked on Suslov's office door and were let in.\n\n''Comrade Molotov, Comrade Malenkov, How may I help you this evening my dear friends?'' said Suslov adjusting his glasses and rubbing the sleep from his eyes. Malenkov and Molotov then proceeded to recapitulate and explain to Suslov the nature of what had been done during Khrushchev's years in power and how his policies had undermined the construction of socialism and easily could've led to capitulation to the West. There was a brief silence after the explanation. Suslov leaned back slightly in his chair, his fingers interlocked as he studied the two men standing before his desk. The Senior Secretary listened without interruption, his expression as unreadable as ever. ''I see,'' Suslov finally replied quietly. ''And what exactly do you require from me, comrades?'' Molotov spoke first. ''You understand the Party apparatus better than anyone, Mikhail Andreyevich. Khrushchev may have been removed from power, but men like him do not simply accept defeat. We believe he may already be attempting to rally his supporters within the Central Committee and the regional Party organizations.'' Malenkov nodded in agreement. ''If he succeeds in gathering enough allies, he may very well attempt a countercoup. The situation remains fragile, and we cannot allow factionalism to once again endanger the unity of the Party.'' Suslov remained silent for a moment, adjusting his glasses as he considered their words. ''And so you have come to ensure that the ideological organs of the Party do not fall into his hands, correct?'' he said calmly. Molotov allowed himself the faintest hint of a smile. ''Precisely.'' Another long pause followed. Finally Suslov stood from his chair and walked slowly toward the window, looking out into the dimly lit courtyard of the Central Committee building. ''Well then, The unity of the Party must remain above all else. If Comrade Khrushchev truly intends to undermine it, then he must be stopped." Suslov turned back toward the two men as Malenkov glanced at Molotov before giving Suslov a faint smile and nodded."
Bulg.102.a:0 "''Very well Comrade Suslov, I believe that this matter is settled then...''"

Bulg.103.t:0 "The Marshal of Victory goes on tour"
Bulg.103.desc:0 "Lazar Kaganovich walked past officers rushing from place to place and moving between briefings and reports as he made his way towards the Minister of Defense's office. The Old Bolshevik, although now near his mid-sixties, still had a commanding presence within the building and some of the more educated newer cadets took the opportunity to salute and exchange a couple of words with Iron Lazar himself. After all, as emphasized by the new leadership, he was the man responsible for some of the greatest achievements of Soviet industrialization such as the Moscow Metro and a close friend of the late Comrade Stalin. Kaganovich on his part, although receptive of the gestures made by his younger admirers, tried to make his way to the Marshal's office as quickly as possible. He remembered the decision reached at the last Presidium meeting: ''Get Zhukov away from Moscow for the time being''. Kaganovich wondered how a man such as Georgy Zhukov could've become inconvenient for his own motherland. He couldn't help but feel great admiration for the Marshal, after all, the military genius of Zhukov had saved the land of October from the fascist onslaught and it was his armies that took Berlin, the lair of the beast. And yet, pride and ego had gotten the better of the Great Marshal, and it only took Khrushchev a couple of promises to get him to support the slanderous 'Secret Speech' that Zhukov surely knew was completely made up of lies. Kaganovich allowed himself to sigh before knocking on the office door now in front of him and taking a step inside.\n\n''Comrade Kaganovich!'' Zhukov said, rising from his chair, speaking with the same grandeur and confidence in his voice as always. ''I was not expecting visitors today. What brings you here?'' Lazar removed his coat and took a seat opposite the Marshal. After engaging in some small talk and catching up with each other's whereabouts, Kaganovich then explained to the Marshal the reason for his visit and the Party's request. ''Comrade Kliment Voroshilov was originally tasked with conducting an inspection tour of the armed forces of our fraternal socialist states. Unfortunately, he has recently fallen ill and is unable to carry out the assignment.'' Zhukov leaned back slightly in his chair. ''And so you expect me to take this task up for myself?'' The Marshal asked. ''Precisely'' Kaganovich replied. After discussing logistics, the nature of the inspection and the expected time Zhukov studied the Party veteran standing before him before nodding. ''“Very well. If the Party requires it, I will conduct the inspection.'' Kaganovich allowed himself a small, satisfied smile before saying farewell to the Marshal and walking out of the door. Zhukov stood up and stared out of his office window at the Moskva River. Memories from his last time in Berlin and the other cities of Eastern Europe quickly filled his mind and Zhukov allowed himself a faint smirk. Perhaps their new socialist brothers did need his expertise and help in handling their army, after all, he was the man who had torn the heart out of the fascist beast, and there was no better man to show the fraternal armies how to defend themselves from imperialist aggression than he who had defeated the most vile of them all. The Marshal then sat back down at his desk and swiftly got back to work."
Bulg.103.a:0 "''Mother Russia still has much to teach to her new sisters...''"

Bulg.104.t:0 "The Moscow City Party Committee"
Bulg.104.desc:0 "Unlike many of his colleagues within the Presidium, Dmitri Trofimovich Shepilov had never been a particularly imposing figure. Tall and thin, with the composed demeanor of a university lecturer rather than a hardened revolutionary, the former editor of Pravda had built his reputation not through fiery speeches or political maneuvering but through careful analysis and ideological discipline. Many within the Party apparatus still saw him as an intellectual first and a politician second, and yet here he was, in the middle of the Moscow City Party Committee Headquarters walking towards the First Secretary's office. Shepilov couldn't help but sneer at the thought of the First Secretary. Yekaterina Furtseva. He still remembered how she ran to the telephones right after the traitor Khrushchev had been removed and if it hadn't been for the total communications blockade she may have doomed their entire operation to failure. ''Nothing more than Khrushchev's personal lapdog...'' Shepilov thought to himself. And yet that wasn't the reason the Presidium had come up with to remove her, not at all, it was due to something perhaps even more scandalous. Furtseva infamously had been the one to spearhead a defamation campaign against renowned Soviet actor Boris Babochkin due to his portrayal of a corrupt bureaucrat in the 1952 movie Shadows, and had gravely misused her influence to render the actor practically jobless. Due to this, and due to the recent criticism by Comrade Suslov, she was to be dismissed and later arrested, simple as that, all that Shepilov wanted and needed to know. He also couldn't help but feel that the portrayal of a corrupt bureaucrat might've hit a little too close to home to the First Secretary, as to him and to his Old Bolshevik companions, Furtseva was nothing more than a careerist and opportunist. \n\nWhen the door to the office opened, Yekaterina Furtseva greeted him with visible curiosity. ''Comrade Shepilov,'' she said, gesturing for him to sit. ''To what do I owe the pleasure of this visit?'' Shepilov then proceeded to explain to her that due to a unanimous decision by the Presidium, she was to be removed from her post due to her severe misconduct and that he wanted clarifications on behalf of the party as to her reasoning and side of the story. Furtseva's expression hardened almost immediately. ''Clarify the situation?'' she replied sharply. ''I have served the Party loyally for years. If certain comrades now wish to fabricate accusations in order to remove me, they should at least have the courage to say so openly.'' Furtseva began to heat up and what had started as a simple dismissal quickly turned into an all-out confrontation, which was for the most part one-sided. A scandal not too different from those caused by her weekend trips abroad in order to meet her lover in Yugoslavia. Shepilov sighed, preparing to make one final attempt at reason when the office door suddenly burst open and several KGB agents walked in. For a brief moment neither Shepilov nor Furtseva spoke. Then one of the officers stepped forward and addressed the First Secretary directly. ''Comrade Yekaterina Furtseva, by order of the Presidium of the Central Committee you are hereby relieved of your duties and placed under arrest pending investigation.''. What followed was a scene bordering on hysteria. Furtseva panicked and attempted to flee, screaming as the officers seized her by the arms and dragged her toward the door. Shepilov remained seated, his heart pounding from what had just transpired before him, watching silently as the First Secretary of Moscow was carried away, before sighing a sigh of relief. "
Bulg.104.a:0 "At least it was finally done."

Bulg.2.t:0 "Khrushchev’s fate"
Bulg.2.desc:0 "''...as such, the court finds Comrade Khrushchev guilty of anti-soviet activity, undermining the unity of the Party, disregard for revolutionary legality and subservience to foreign powers, and in accordance with the laws of the USSR, sentences him to be shot.'' and for a moment, the courtroom stood quiet. Marshal Konstantin Rokossovsky as acting judge had sealed Khrushchev’s fate in a special session of the Supreme Court of the USSR, with no defense counsel, no right to appeal and completely unknown to anyone outside of the Central Committee and the KGB. After being demoted to Minister of Agriculture, Khrushchev was quickly investigated and arrested on the orders of the Central Committee to ensure he could not attempt another power grab in the future, similar to what had been done to Lavrentiy Beria almost 4 years prior. \n\nAnd then, Khrushchev stood up. He couldn't believe it, all this time plotting, reforms, filling cadres with loyalists, fooling Malenkov, De-Stalinization, all this meticulous planning, all for what? To be outmanouvered and now sentenced to death by a couple of old men that should've been cast aside and forgotten years ago? No, it couldn't be. He pounded his fists on the desk and began to yell, scream, cry, pointing fingers at everyone within his sight. ''You are scum, each and every one of you! Even after I denounced the despot Stalin for his crimes I still kept all of you within the Central Committee, none of you were tried for your countless repressions, not a single name was brought up! All your priviliges remained untouched! And this is how you repay me? I should have had all of you shot along with Beria when I had the chance!'' Rokossovsky and the Central Committee members present at the trial on the other hand didn't seem overly worried. \n\nBefore Rokossovsky stood the man who had disrespected, slandered and bastardized his Great Commander, made him out to be no better than Hitler himself and with that had destroyed the image of socialism worldwide. The ruptures with China and Albania, the whole Hungary fiasco and even the rise of revisionists in Poland which caused him to abandon his home, all of this was his fault, and deep down he loved the fact that it was his verdict that was going to send Khrushchev to the dustbin of history. ''The court has heard enough, guards, remove this man already.'' Rokossovsky declared. Khrushchev stared him down seething and it looked like he was about to get into a brawl with the Marshal himself before two MVD guards swiftly grabbed him by the arms and dragged him out of the courtroom. Khrushchev was then shoved into an armored KGB van and discretely taken to Lefortovo prison, where he immediately proceeded to be executed by firing squad. "
Bulg.2.a:0 "And as such goes the final nail in the coffin of revisionism..."

Bulg.3.t:0 "Vyacheslav Mikhailovich Molotov"
Bulg.3.desc:0 "''By decision of the Presidium of the Central Committee and the Supreme Soviet of the Soviet Union, Comrade Vyacheslav M. Molotov has been appointed as Chairman of the Council of Ministers...'' Molotov looked at the Pravda newspaper infront of him as he took a sip of his morning coffee. Staring back at him was his own face, plastered large and clear on the front page, a portrait he remembered posing for perhaps a mere day prior. Yet it wasn't the first time he saw that very same headline paired with his face, not at all, albeit he was much younger back then. He had served as Premier before, but that was long ago. Before the war, before all the turmoil, and back then Stalin was alive and well... Molotov sighed. It had been a good while since they had succeeded in ousting Khrushchev from power and put a bullet in his head, and yet only now did Molotov find himself beginning to reflect on the past couple of years. \n\nThe death of Stalin, the coup, the speech at the 20th congress... He remembered how they all sat in silence as slander after slander was heaped at Stalin's grave, nobody spoke out, nobody had expected it. And yet in retrospect, how had they not foreseen this? All the reforms, the normalization with the West, the crushing of all of Stalin and Zhdanov's previous proposals, the only way the revisionists could go any further was certainly by first attacking Stalin. How could they all have been so blind? Molotov tightened his grip on the newspaper slightly before setting it down on the table. And yet, although they should've acted sooner, the job was done, the Union was saved, and all of the conspirators would be rooted out one by one, he would make sure of it. They had been temporarily blinded, but not anymore, and never again will the forces of capital and opportunism be given a single chance to undermine the advance of the working class. Molotov thought to himself, perhaps with a bit of naive optimism, that the best for the Union was yet to come and that perhaps he would be alive to see the workers of the world storm heaven itself. And as such, he would continue the path of Lenin and Stalin, the path that had once guided them through far greater trials than these. Molotov diverted his attention to a framed picture on his desk, one of him and Stalin back in the 30s at the Kuntsevo Dacha. Stalin had been his superior, his mentor, and most importantly, his best friend, and he would not allow his work and name to be tarnished. Not now, not ever. Molotov allowed himself to shed a singular tear at the memories that had started to flood his mind. Then, without another word, he turned and made his way toward the door."
Bulg.3.a:0 "''Rest easy my dear friend, your sacrifices won't be in vain...''"

Bulg.31.t:0 "Lazar Moiseevich Kaganovich"
Bulg.31.desc:0 "Stacks of reports lay scattered across the desk as Lazar Kaganovich carefully reviewed the latest figures on industrial output and infrastructure development. The past few years had not been kind to the Soviet economy. Projects had been abandoned, priorities had shifted to reckless experimentation, most of which resulted in subpar results or outright failure, all for the sake of 'modernization' and 'efficiency'. Kaganovich frowned slightly as he turned the page. Too much had been disrupted, decentralized, especially with the absolute chaos that were the Sovnarkhozy. Kaganovich absolutely despised them. ''They achieve nothing but promote petty corruption and hoard more profits for the bureaucrats'' He thought to himself. \n\nJust then, the sound of a knock at the door broke the silence. A courier entered briefly, placing a sealed document on the desk before leaving without a word. Kaganovich opened it without hesitation. ''By decision of the Presidium of the Central Committee and the Supreme Soviet of the Soviet Union, Comrade Lazar M. Kaganovich is hereby appointed Deputy Chairman of the Council of Ministers...'' He read the line once, then set the paper aside. Kaganovich had rarely cared about titles, and this was not an exception. And yet, he couldn't help but feel a slight wave of optimism come over him. Perhaps, this way he could begin to unwind all of the mess that was the Khrushchevite economy. He had served as Second Secretary under Stalin, and hadn't they achieved numerous successes under his leadership? Indeed they had, and Kaganovich knew that although he was getting old, he was very well still capable of lifting up the Union once more. Production would be restored. Planning would be enforced. The Dictatorship of the Proletariat would function as it was meant to and all capitalist remnants and deviations that the 'reformers' clique had introduced would be eradicated by his own grip, for it was no mistake that they called him 'Iron Lazar'. Kaganovich rose from his chair and walked toward the large map mounted on the wall, his eyes scanning the vast expanse of the land of October. Railways, factories, industrial centers—all interconnected, all dependent on revolutionary discipline, coordination, and proper leadership by the vanguard party. There was much to rebuild. And this time, it would be done properly."
Bulg.31.a:0 "Back to work, Comrades."

Bulg.4.t:0 "Tbilisi, Georgian SSR"
Bulg.4.desc:0 "In the months following the unrest of 1956, the streets of Tbilisi had settled into a careful kind of normalcy. And yet, now almost two years later, the memory of tanks storming the capital of the Georgian SSR remained bright in the minds of the population. They had all rallied that day, angry, resentful, calling for justice. How could they not have? Were they supposed to let these traitors slander not only Lenin's faithful pupil, but also Georgia's greatest son? Yet that was the past, and the citizens of the Paris of the East had now learned to reluctantly accept the new status quo. Certain things had disappeared in those days, among them a monument that had once stood prominently in the city. It was around that same monument where the first waves of student protests began, where thousands united in defiance of the clique in the Kremlin. Then the tanks came, hundreds were imprisoned, hundreds more mercilessly slaughtered, and the monument to the Great Commander was removed. Now, it stood there again. \n\nThe work had been done quickly, almost discreetly. By the time most people passed through the square that morning, it was already finished. A crowd gathered sooner than one might have expected, standing in loose clusters, speaking in low voices, though not as guarded as they once had been. ''So it's true,'' one man said, a faint note of satisfaction in his voice. ''They’ve brought him back.'' His companion nodded, eyes fixed on the towering figure before him. “It was only a matter of time.” Nearby, an older woman paused, her gaze lingering longer than most. ''They took him down so quickly,'' she said. ''As if people here would forget.'' No one had forgotten. A veteran stood near the front of the gathering, his posture straightening as he looked up, almost just as prideful as he had been a decade ago. There would be speeches later, explanations printed and distributed, the proper words restored along with the monument itself. But for now, none of that seemed necessary. As the crowd slowly began to disperse, many lingered just a moment longer than needed, casting one last glance before returning to their routines. And above them all, overlooking the city that had never truly turned away from him, stood the man of steel once more."
Bulg.4.a:0 "Joseph Vissarionovich Stalin"

Bulg.41.t:0 "The Commission of Historical Clarification Regarding J.V. Stalin"
Bulg.41.desc:0 "Following the Death of Joseph Stalin and years of powerstruggle, Khrushchev eventually set up a commission to 'investigate' the arrests made during the late 1930s of certain candidates of the Central Committee elected at the 17th Congress. This commission would eventually come up with the infamous 'Pospelov Report', a document later used by Khrushchev at his infamous 'Secret Speech', and a document the Old Guard was very familiar with. Page after page of slanderous accusations against Stalin, blaming every single repression labled as 'injust' on his single personality and implying that Stalin himself personally ordered the fabrication of cases. Suslov and Malenkov were of course, not convinced of this at all. Khrushchev had been safe and sound in Ukraine, but Malenkov remembered the turbulent year of 1938. The Bloc of Rights and Trotskyites, the terrorist attacks, and later how the conspiracy within the NKVD was uprooted. The Central Committee itself was investigating and piecing together the conspiracies one by one, including Stalin, how could he be accused of orchestrating any of this? And so, the decision had been made. \n\nWithin days of the final victory over the Khrushchevites, a special commission had been assembled under the joint supervision of Suslov and Malenkov to investigate this report. Access was granted to materials long kept sealed—internal NKVD correspondence, interrogation records, Central Committee reports, and communications previously deemed too sensitive for review. For the first time since the 20th Congress, the full record lay open. As such, work began. Page by page, citation by citation, the claims of the Pospelov Report were examined against the original documents from which they had supposedly been derived. At first, the discrepancies appeared minor-an omission here, a conclusion drawn too broadly there. But the deeper they looked, the more consistent the pattern became. Excerpts lacking important context, deliberate misinterpretation of certain phrases, confessions having entire passages omitted that added important context and statements made by the report that outright contradicted their supposed reference materials. Malenkov closed one such file with a quiet exhale. ''Is there a single 'revelation' that this scoundrel hasn't lied about?'' He remarked, frustrated and tired. Suslov did not immediately respond. His eyes remained fixed on a document before him, his expression unchanged as he slowly adjusted his glasses. ''Take a look at this Georgy...'' He said, before gesturing toward the scattered files across the table. ''Half of these citations lead nowhere. References are made to documents that simply just don't exist in the archives.'' Malenkov's eyes widened as he flipped through a couple of pages. Suslov was correct. And they weren't absent by accident. Absent entirely." 
Bulg.41.a:0 "The records had clearly been tampered with..."

Bulg.42.t:0 "The Commission of Historical Clarification Regarding J.V. Stalin: Part 2"
Bulg.42.desc:0 "For a moment, neither man spoke. " 
Bulg.42.a:0 "The records had clearly been tampered with..."


#Bulganin Decisions

sov_khrushchev_fate:0 "The Khrushchev Question"
sov_khrushchev_fate_desc:0 "\n\n\n\n\n\n£Khrushchevite_Purge\n\n\n\n\n\n\n With Khrushchev demoted to Minister of Agriculture and kicked out of the Presidium, a good chunk of the struggle against revisionism has been won. However, him and his cronies still have a significant amount of influence within the party and if not dealt with effectively, we risk the chance of another powergrab. We must liquidate Khrushchev and the most powerful of his subordinates before they can attempt to hijack the land of October once more."

khrushchev_fate_mission:0 "Seal Khrushchev's fate"
khrushchev_fate_mission_desc:0 "While we are attempting to rectify half a decade's worth of revisionism, Khrushchev is undoubtedly scheming behind our backs to attempt another powergrab. We must swiftly eliminate all his links within the upper bodies of government and then execute the traitor at once."

sov_arrest_serov:0 "Arrest Ivan Serov"
sov_arrest_serov_desc:0 "Serov as Chairman of the KGB attempted to organize special flights to take Khrushchevite provincial Central Committee members to Moscow and prevent the revisonist traitor's removal. It is clear that he is a wrecker and a serious threat and must be repressed as soon as possible." 

sov_arrest_furtseva:0 "Arrest Yekaterina Furtseva"
sov_arrest_furtseva_desc:0 "Furtseva was the one to alert Serov of our attempt to remove Khrushchev, which almost condemned our fight against revisionism to utter failure. Khrushchev would undoubtedly rely on her in any future powergrab which makes her a liability that must be taken care of. However, before we can do such a move we must have Suslov on our side." 

sov_sideline_zhukov:0 "Sideline Georgy Zhukov"
sov_sideline_zhukov_desc:0 "While he's not an ideological Khrushchevite, Marshal Zhukov is blinded by feelings of grandeur and pride and could be a pawn for the revisionists if they're able to flatter his ego and promise him greater influence. To prevent the army from becoming a tool of the revisionists, Zhukov will be sent on an extended inspection of the armies of the Warsaw Pact, keeping him far from Moscow and the bodies of government." 

sov_assure_suslov:0 "Secure Suslov's support"
sov_assure_suslov_desc:0 "Mikhail Suslov, although once rumored to be Comrade Stalin's potential successor, has become a political chameleon and is in no way a reliable political ally as demonstrated by his support for Khrushchev's blasphemous 'Secret Speech'. However, his position as Senior Secretary of Ideology of the CPSU mustn't be underestimated. It is for this reason that we must secure his support, albeit temporarily, and make sure he isn't used by Khrushchev once more. Suslov's own opportunism will be dealt with at a later time." 
suslov_assured_tt:0 "Suslov's support has been secured."