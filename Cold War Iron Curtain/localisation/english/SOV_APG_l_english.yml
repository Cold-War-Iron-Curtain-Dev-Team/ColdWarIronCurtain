 SOV_suslov_scandal:0 "The Suslov Scandal"

 SOV_molotov_union_desc:0 "Comrade Vyacheslav Mikhailovich Molotov has now assumed the role of General Secretary of the Communist Party following the resignation of Comrade Bulganin. A close friend of the late Comrade Stalin and a hardline Marxist, his leadership will surely be able to revive our union and ensure the victory of the proletarian revolution worldwide!"
 SOV_finalize_the_cc_clean_desc:0 "While the regional bureaucrats have been dealt with along with the most trecherous of the main security apparatus like Serov and Furtseva, some untrustworthy individuals remain within the Central Committee. While they won't be purged from the party necessarily, they will be demoted and reassigned to places where they cannot intervene in the affairs of the true proletarian line."
 SOV_reorganise_the_presidium_desc:0 "Now that the most irrelevant of the Central Committee have been dealt with, it's time to look towards the highest organ, the Politburo. A couple changes will be made, and a couple people will need to be shot."
SOV_kaganovich_second_secretary_desc:0 "Comrade Lazar Kaganovich has been an addherent defender of the true Marxist doctrine and a trusted friend of both Comrade Molotov and Lenin and Stalin before him. With Molotov now as General Secretary, it is only fair that Kaganovich be rewarded for his efforts and awarded the rank of Second Secretary." 
 SOV_arrest_mikoyan_pospelov_desc:0 "Anastas Mikoyan and Pyotr Pospelov are some of the most vile revisionists and traitors left within the ranks of our party. During the reign of Khrushchev, Mikoyan acted as Khrushchev's lapdog, a jester for the king, and as Comrade Hoxha told us may have also been part of an alleged planned attempt on Stalin's life many years ago. Pospelov on the other hand is a vile opportunist who was used by the Khrushchevites to fabricate countless baseless accusations against Comrade Stalin and other true communists. Needless to say, they will be dealt with accordingly."
 SOV_arrest_podgorny_kirichenko_desc:0 "Nikolai Podgorny and Alexei Kirichenko owe everything they have to the man from Ukraine, having carried Khrushchev's line in the republic for a decade while the rest of the Union paid for his experiments. Their patron is gone but his agents remain at their posts, and no honest Central Committee can suffer men whose loyalty was ever to one man rather than to the Party. They will be arrested, expelled and replaced by comrades who answer to Moscow."
 SOV_ensure_suslov_loyalty_desc:0 "Comrade Mikhail A. Suslov has never once deviated from the correct line, which is precisely why he must be watched so closely. The ideological secretary who drafted the justifications for Khrushchev's reversals can just as easily draft our own, and a man of his talents is too useful to be left unattached. He will be confirmed as Senior Secretary of Ideology, entrusted with the Party's doctrinal work, and reminded that his standing from this day forward depends entirely on the conclusions he reaches."
 SOV_reorganise_kgb_desc:0 "The Committee for State Security has been in the hands of Serov's men long enough. Under Khrushchev the organs served the man rather than the Party, rooting out loyalists while the traitors prospered, and a security service of that sort is worse than none at all. The KGB will be reorganised from the directorate down, its commission reoriented toward the enemies of the Marxist-Leninist line, and Comrade Alexander Shelepin placed at its head."
 SOV_shelepin_empower_desc:0 "Alexander Nikolayevich Shelepin proved his worth on the night he carried out the arrest of Serov without a drop of blood being spilled, and he has never forgotten which class he serves. Give him the full weight of the organs and no conspiracy of Khrushchevites, opportunists or wreckers will survive a winter. His authority over the security apparatus shall be made absolute, so that the fist of the dictatorship of the proletariat strikes only where the Party points."
 SOV_release_vasily_desc:0 "Vasily Iosifovich Stalin is the son of the man who built this state, and he has rotted in a prison cell for the crime of mourning his father while the slanderers of his memory walked free. His release is a matter of simple justice and of no small propaganda value. The name of Stalin will be heard again in Moscow, and with it the reminder that the Old Guard has returned to power."
 SOV_kruglov_rehab_desc:0 "Comrade Sergei N. Kruglov served the state faithfully for thirty years before the Khrushchevites discarded him for the crime of never having flattered their master. He will be rehabilitated, reinstated in the command of the MVD and returned to the duty of guarding the revolution from its enemies. A purge of the security organs cannot be conducted by men with no memory of how such purges are conducted, and Kruglov has that memory."
 SOV_kgb_purge_desc:0 "Not every man who survived Serov's tenure did so innocently. The Serovites who rose through the organs by informing on their comrades, who kept files on loyalists for Khrushchev's use, who made the security service a private instrument of one faction, must be identified and removed before they can destroy any evidence. The sweep will be thorough, it will be public enough to be believed, and it will leave behind a service that answers to the Central Committee alone."
 SOV_reorganise_ministers_desc:0 "The Council of Ministers has been staffed for a decade according to Khrushchev's preferences rather than competence, and the results are visible in every plan that failed to meet its target. The apparatus of government must be reorganised so that policy is set by experienced Marxist-Leninists and executed by men who know what a five-year plan requires. This is the first and most tedious work of the restoration, and no shortcuts will be taken with it."
 SOV_Malenkov_Chairman_desc:0 "Comrade Georgy M. Malenkov made mistakes, but they were the mistakes of a man who wanted the work to succeed, and he has repented of them more honestly than most. As Stalin's chief of staff he knew better than anyone how the machinery of government should run, and the Council of Ministers needs precisely that kind of practical administrator. His appointment as Chairman will return the everyday business of the state to competent hands."
 SOV_Bulganin_Gosplan_desc:0 "Comrade Nikolai A. Bulganin held the country together through the year of the coup with a firmness nobody expected of him, but his talents have always lain in finance rather than in administration. He will be sent to the State Planning Committee, where his steady hand and his loyalty to the Old Guard can be turned to the rebuilding of the national economy. Gosplan has drafted too many plans for Khrushchev's vanity; now it will draft them for the working class."
 SOV_Shepilov_Deputy_desc:0 "Comrade Dmitry T. Shepilov hesitated at the decisive moment of the coup and then chose the side of common sense, for which the Party owes him a debt he will now be asked to repay. He possesses the education, the pen and the connections that a deputy chairman requires, and he has already demonstrated that he can be trusted under pressure. A place on the Presidium will be found for him, and it will be a place where his abilities serve the line."
 SOV_encourage_zhukovs_retirement_desc:0 "Marshal of the Soviet Union Georgy K. Zhukov saved the state once and has never permitted anyone to forget it. The man who broke the Wehrmacht cannot be left in a position where he might decide a second time that the Central Committee requires his guidance, and Marshal Konev will make clear to him that honourable retirement is preferable to the alternative. The Army will remain loyal, the Party will remain supreme, and Zhukov will spend his remaining years writing his memoirs."
 SOV_formulate_antirevisionism_theory_desc:0 "Revisionism has been defeated in the Soviet Union, but it was not born here and it will not die here. It travels under many names - peaceful coexistence, the welfare state, the possibility of a third road - and each generation of Marxists must learn to recognise it before it has already captured the party. Our theorists will now produce a systematic account of modern revisionism: its origins in opportunism, its class function, and the conditions under which it inevitably emerges."
 SOV_Molotov_Vision_desc:0 "Twenty years of compromise, half-measures and retreat have been blamed on the failures of individuals, but the root of the disease lies in the absence of a line of our own. Comrade Molotov will now set out the direction of the Union in full: the restoration of democratic centralism, the supremacy of planning, the unwavering defence of the Stalinist legacy, and the duty of the Party to lead. This is the programme upon which everything that follows will be built."
 SOV_shock_brigade_of_the_world_proletariat_desc:0 "The Soviet Union has spent a decade apologising to the world for its own existence. It will stop. From this day the Union conducts itself as the shock brigade of the world proletarian movement - first to strike, first to build, first to refuse any retreat placed before it by the imperialists. Every decision of the Central Committee will be measured against that standard, and no ministry, no plan and no embassy will be permitted to fall behind the ranks."
 SOV_resume_zhdanov_and_stalins_proposals_desc:0 "Comrade Andrei A. Zhdanov was preparing the next stage of socialist construction when death cut him short in 1948, and his proposals were buried with him by men who found them inconvenient. They will be exhumed. Together with the unfinished work of Comrade Stalin they form the basis of a genuine programme for the transition to communism, and their resumption marks the end of the improvisation that passed for policy under Khrushchev."
 SOV_rename_ministries_to_peoples_commissariats_desc:0 "Khrushchev's men renamed the People's Commissariats as though the apparatus of state could be made respectable by changing its signage. The old names are the honest ones: they were established in the year of the revolution and they proclaim whose ministry it is. The ministries will be renamed back to People's Commissariats, and with the name will return the reminder that every official in them serves the working class and may be called to account by it."
 SOV_the_future_of_socialist_construction_desc:0 "It is not enough to repair the damage. The question that occupied Comrade Stalin in his last years, and that Khrushchev answered with slogans about the state of the whole people, remains where it was: how does a socialist society pass into the stage of communism without first passing back into capitalism? The Party must now elaborate its own answer, grounded in the concrete conditions of the Union, before the next congress convenes."
 SOV_denounce_peaceful_coexistence_doctrine_desc:0 "Peaceful coexistence is the theory by which the proletariat is asked to accept indefinitely the rule of those it intends to overthrow. Khrushchev dressed it up as wisdom and used it to justify every retreat, from Berlin to the Caribbean, while preaching fraternity with the very states that arm themselves against us. It will be denounced as what it is - a deviation from Marxism-Leninism and a licence for the imperialists to wage war against the socialist camp without fear of answer."
 SOV_analyze_comecon_efficiency_desc:0 "The Council for Mutual Economic Assistance was founded to integrate the economies of the socialist states, yet under Khrushchev it became an instrument for exporting Soviet grain at subsidised prices while the Union's own consumers queued for butter. A thorough analysis of COMECON will be undertaken: who produces, who benefits, and whether the division of labour within the bloc serves the development of socialism or merely the prestige of Moscow. Reforms will follow the findings, not the other way round."
 SOV_support_castros_revolution_desc:0 "A socialist republic stands ninety miles from the coast of Florida, and the entire weight of American reaction has so far failed to crush it. Comrade Fidel Castro and his comrades have carried out an anti-imperialist revolution of the first order, and the Soviet Union will give them everything short of war: weapons, fuel, credit, technical advisers and the diplomatic cover of a great power. The Caribbean will become a lesson to every people in the hemisphere that the empire is not invincible."
 SOV_help_cuba_industrialize_desc:0 "Sugar and cigars will not build socialism. The revolution in Cuba requires an industrial base, and the Union is uniquely placed to provide the plants, the engineers and the plans that the island cannot yet produce for itself. Cuban workers will be trained in Moscow, Soviet machinery will be shipped to Havana, and the aim will be a diversified industry capable of withstanding any embargo the Americans care to impose."
 SOV_prepare_cuba_for_us_invasion_desc:0 "The United States has never tolerated a socialist state in its own hemisphere and is already rehearsing for an invasion under the cover of training exercises. Cuba must be fortified before the landing rather than after it: air defence, coastal artillery, a standing army trained in partisan warfare and the stores to sustain a long resistance. A revolution that survives the landing will become a permanent wound in the side of imperialism; one that does not will become a warning to the rest."
 SOV_covertly_support_communist_movements_in_the_us_desc:0 "The American working class is not the natural ally of Wall Street that its press pretends, and the labour movement there is riddled with men who know exactly what happens to communists in the United States. Funds, literature and guidance will reach the party and the progressive unions through channels that cannot be traced back to Moscow, so that the class struggle inside the imperialist heartland proceeds on its own account while the State Department hunts for phantom agents."
 SOV_support_communist_and_anticolonial_insurgencies_desc:0 "The empires of Europe are retreating from their colonies in a hurry to install new masters in old uniforms. Wherever a movement fights to end colonial rule, the Union will assist it - with arms, with training, with the practical experience of a revolution that threw out its own exploiters. Every rifle sent to a liberation movement is a rifle not pointed at our borders, and every colony that escapes the West weakens the dollar that pays for NATO."
 SOV_deal_with_eastern_bloc_revisionists_desc:0 "Khrushchev did not work alone. In Warsaw, in Bucharest, in Budapest and in Berlin, men who learned their politics from his school remain at the head of their parties, purging communists and courting the West in the name of socialism. They will be confronted: through the fraternal parties, through their own oppositions, through the economic levers the bloc provides. The socialist camp will be either Marxist-Leninist or it will be a liability, and there is no third arrangement."
 SOV_the_question_of_yugoslavia_desc:0 "Tito's Yugoslavia presents the most seductive of all the revisionist experiments, because it combines national independence with workers' self-management and thereby makes the counter-revolution look attractive. The Party must therefore answer it carefully. We recognise the heroism of the Partisans and we refuse to restore the monarchy or the landlords; we do not recognise a state that expelled its communists, courted the Americans and calls this arrangement socialism. Relations with Belgrade will be conducted accordingly."
 SOV_revive_the_komintern_desc:0 "The Communist International was dissolved in 1943 as a gesture of goodwill to the allies who immediately began planning the next war against us. That gesture has been repaid with NATO, with the Marshall Plan and with a dozen parties led by Khrushchev's imitators. The Komintern will be revived as a coordinating centre for the world communist movement, so that the parties of every country answer to a common discipline and a common strategy rather than to their own national parliaments."
 SOV_reinforce_democratic_centralism_desc:0 "Under Khrushchev, discussion was permitted only after the decision had been taken and criticism was permitted only in the direction it was ordered. That is not democratic centralism but its caricature. The Party will return to the Leninist principle in earnest: full and free discussion until the congress votes, and absolute unity in action afterwards. The lower organs will be heard, the higher organs will be obeyed, and no individual - however popular - will be permitted to substitute his will for that of the collective."
 SOV_reintroduce_party_bureaucrat_privilege_cuts_desc:0 "The Party officials who were to be the servants of the working class have spent a decade as its masters, with special shops, special clinics, special dachas and special salaries. Khrushchev abolished the privileges and then quietly restored them under new names. They will be cut again, and cut for good: no party functionary may earn more than the worker he represents, and any official found trading in his position will be expelled from the ranks."
 SOV_simplify_order_of_party_conference_convocations_desc:0 "The Party conference was designed as the instrument through which the membership holds its leadership to account, and Khrushchev's apparatus turned it into a ceremony at which applause was recorded and business was not. The order of convocation will be simplified so that conferences can actually be convened, their agendas set in advance by the local organisations, and their resolutions debated rather than read aloud. An instrument that never meets is not an instrument."
 SOV_encourage_rank_and_file_criticism_of_bureaucrats_desc:0 "A secretary who cannot be criticised by the members of his own committee will sooner or later begin to behave like a commissar of the old school. The Party will formally encourage rank-and-file criticism of bureaucrats: written complaints to be answered within a fixed period, branch meetings at which the first secretary must report, and protection for the member who speaks plainly. Criticism from below is the cheapest form of supervision ever invented, and the most effective."
 SOV_institutionalize_self_criticism_within_the_party_desc:0 "Self-criticism is not a ritual of confession invented by the Yezhovshchina; it is the method by which a party discovers its own errors before the class discovers them for it. It will be institutionalised: every committee at every level will hold sessions of self-criticism on a fixed schedule, with a record of what was admitted and what was corrected kept on file. A party that criticises itself regularly has no need of a secret police to tell it the truth."
 SOV_mandatory_ideological_courses_for_all_officials_desc:0 "Too many officials rose through the apparatus under Khrushchev without ever having read anything but the directives of their superiors, and it showed in the decisions they took. From now on, every official - from district secretary to minister - will sit mandatory courses in Marxism-Leninism, examined and graded. The purpose is not to produce professors but to ensure that the man who interprets a plan understands the theory under which the plan exists."
 SOV_promote_young_and_aspiring_cadres_desc:0 "The Old Guard cannot rule forever, and it would be a poor legacy to leave behind a party of men who waited for their elders to die before daring to think. Young and aspiring cadres - members of the Komsomol, factory secretaries, economists and officers who came of age after the war - will be identified, promoted and taught by example. The revolution is a permanent process, and those who carry it next must be trained while there is still something to inherit."
 SOV_merge_mvd_and_kgb_desc:0 "Two security services with overlapping jurisdictions spend as much time investigating each other as they do the enemies of the state. The KGB will be merged with the MVD into a single instrument of the dictatorship of the proletariat, with one command, one chain of reporting and one set of files. Unified, the organs will be able to conduct the purge of the Serovites in weeks rather than in years."
 SOV_subordinate_security_forces_to_the_party_desc:0 "There is one dangerous arrangement in the history of our state, and it is a security service that reports to nobody. Beria nearly demonstrated where it leads, and Serov demonstrated it more quietly. The security forces will be placed unambiguously under the leadership of the Central Committee: every major operation approved by the Politburo, every appointment confirmed by the Party, every file available to the secretary general. The organs are the fist; the Party is the arm."
 SOV_reinstate_the_nkvd_desc:0 "The NKVD built the metro, guarded the front and industrialised a country in ten years before it was broken up and its name made into an insult. The service that succeeds it will inherit the name as well as the duties, so that the men who serve under it remember the tradition of the Cheka and not the rumours. One ministry of state security, answerable to the Party, carrying the name it earned in the year of restoration."
 SOV_test_shelepins_loyalty_desc:0 "Comrade Shelepin has been given more power over the security apparatus than any man since Beria, and power of that magnitude must be tested rather than assumed. He will be presented with a series of decisions that serve the Party while inconveniencing him personally, and his answers will be noted. Loyalty proven under comfortable conditions is worth nothing; loyalty proven when it costs something is the only kind the Central Committee can rely upon."
 SOV_empower_the_peoples_control_commission_desc:0 "The People's Control Commission was established so that ordinary citizens could denounce waste, theft and incompetence in the enterprises, and every successive leadership has starved it of authority. It will be empowered: standing staff in every ministry, the right to inspect without notice, and the obligation to publish what it finds. Bureaucrats fear auditors more than they fear speeches, and the working class deserves an institution that answers to it directly."
 SOV_reiterate_class_struggle_under_socialism_desc:0 "Khrushchev announced that the exploiting classes had been eliminated and that the conflict between them was therefore over. The Party has been paying for that announcement ever since, in the form of men who concluded that since the struggle had ended, their own enrichment could begin. The class struggle continues under socialism, only in new forms - against the bureaucrats, the speculators and the ideologues of the market. It will be reiterated from every rostrum until no official mistakes tranquillity for the absence of enemies."
 SOV_reinforce_central_planning_desc:0 "The plan is not an aspiration to be adjusted whenever the quarterly figures prove awkward; it is the instrument through which the working class decides, in advance and in public, what its labour will produce. Gosplan will be given the authority it lacked under Khrushchev, targets will be set from the needs of the country rather than the vanity of its leadership, and deviations from the plan will be treated as the administrative crime they are."
 SOV_sideline_reformist_proposals_desc:0 "Every ministry harbours a reformer who has read a little too much Western economics and who believes that a hint of the market would cure whatever ails the plan. These proposals will be identified and set aside before they reach the agenda: not debated into oblivion, not compromise-moderated, simply removed from the table by men with the authority to do so. The Union has experimented with the market already. It was called the New Economic Policy, and it was ended."
 SOV_bring_back_the_zhdanovshchina_desc:0 "Zhdanov's campaign against formalism, cosmopolitanism and the servile imitation of the West was interrupted by his death and buried by his successors, and the arts have been drifting ever since. The Zhdanovshchina returns: literature that tells the truth about socialist construction, music that a worker can whistle, architecture that does not apologise for being Soviet. The campaign will be conducted as it was in 1948 - seriously, publicly, and with no patience for those who prefer the prizes of the West."
 SOV_draft_next_phase_in_building_socialism_desc:0 "The restoration is not the end of the programme. Once the wreckage of Khrushchev's reforms has been cleared, the Party must state plainly what comes next: the completion of socialist construction, the raising of the planned economy to a new level, and the beginning of the transition toward communism. This document will be drafted for the congress, argued through the branches, and adopted as the mandate of the next five-year plan."
 SOV_xxii_congress_of_the_cpsu_desc:0 "The XXIInd Congress will be the first congress at which the Old Guard speaks with a majority behind it rather than a majority assembled overnight. Its business is to adopt the line, to hear the report on the crimes of the Khrushchev era, and to set the tasks of the coming quinquennium. Delegates will arrive from every republic and every branch with instructions from their members, and they will find that the era of congresses as theatre is over."
 SOV_task_of_building_communism_desc:0 "With revisionism defeated and the economy restored to planning, the Party turns to the task that has been its reason for existing since 1918: the building of communism. Not the communism of pamphlets, but its material preconditions - abundance, the withering of the state, the elimination of the division between mental and physical labour. It is the work of generations, and it begins with the decisions taken at this congress."
 SOV_revive_1947_philosophy_discussion_desc:0 "In 1947 the Party convened a discussion on philosophy that drove idealism out of the academies and reminded the intelligentsia that ideas serve classes. It was abandoned after Zhdanov's death, and the philosophers have been drifting toward Western fashion ever since. The discussion will be revived: faculties summoned, theses examined, and the question posed again in its original form - not which interpretation is fashionable in Paris, but which is correct for the socialist state."
 SOV_continue_cult_of_lenin_stalin_desc:0 "Khrushchev's entire career was built on denouncing one man, and he succeeded only because the Party allowed the denunciation to stand. The cult of Lenin and Stalin will be continued not as personality worship but as the preservation of historical truth: the man who led the October Revolution and the man who built socialism in one country. Portraits, monuments, textbooks and anniversaries will be restored, because a party that forgets its own history can be sold any history at all."
 SOV_commence_soviet_cultural_revolution_desc:0 "A cultural revolution is the means by which a new society produces its own people: the worker who reads, the engineer who philosophises, the student who works. It will be commenced on the Soviet model rather than the Chinese - planned, literate and without the vandalism - attacking the ignorance that the old order bequeathed and the snobbery that the new intelligentsia has inherited in its place. Culture must become the common property of the class that creates everything."
 SOV_new_kind_of_planned_economy_desc:0 "The economy of the Union must be planned in a new way, not because planning was wrong but because the scale of the country has changed beyond recognition since the first five-year plan. Cybernetics, statistics and the calculation of demand will be placed at the service of Gosplan, so that the plan reflects what the country actually needs rather than what a committee guessed. The command economy will become an informed one."
 SOV_critical_study_of_idealism_desc:0 "Idealism is not merely a philosophical error but a social one: it teaches that the world is changed by better ideas rather than by better conditions, which is precisely the lesson the bourgeoisie wants the working class to learn. A critical study of idealism will be commissioned across the academies, tracing it from Plato through Kant to the existentialists now in fashion in the cafes of the West, and demonstrating what it is for."
 SOV_condemn_bourgeois_philosophy_desc:0 "Western philosophy since the war has been an exercise in despair, produced by societies that have run out of a future to offer anyone. Its existentialism, its logical positivism and its structuralisms are the private language of men who cannot say who exploits them. They will be condemned in the open, in the journals and at the congresses, so that no student in a Soviet university mistakes the confusion of the West for the depth of the West."
 SOV_reassert_dialectical_historical_materialism_desc:0 "Dialectical and historical materialism is not one option among many in the curriculum; it is the method without which the sciences become a collection of unrelated techniques serving whoever pays for them. It will be reasserted as the foundation of all theoretical work in the Union, taught as a living method of investigation rather than as a catechism, and applied to the concrete problems of the day by those who claim to profess it."
 SOV_commission_new_philosophy_textbook_desc:0 "The textbooks in use were written to suit whichever faction happened to be in office, and a generation of students has been examined on them. A new textbook on philosophy will be commissioned - one account, written by a commission of the Central Committee, approved by the Politburo and issued to every university in the Union. Whatever disputes the philosophers may conduct in their journals, the lecture halls will teach a single, correct line."
 SOV_combat_idealism_in_natural_sciences_desc:0 "The physicists and biologists have been importing the philosophy of their Western colleagues along with their equipment, and some of them have begun to explain the achievements of socialist science by references to chance, to intuition and to the individual genius. Idealism in the natural sciences will be combated by the philosophical faculties working alongside the academies, because a scientist who cannot account for his own method will eventually account for it in terms his laboratory cannot support."
 SOV_mandatory_dialectical_materialism_universities_desc:0 "Every university in the Union will make dialectical materialism a mandatory course of study, examined and required for the award of a degree. This is not an imposition on the sciences but their defence: the method that produced the periodic table, the theory of evolution and the materialist account of history is the same method, and students who learn it properly will not be confused by whatever fashionable doctrine arrives from abroad."
 SOV_dialectical_materialism_foundation_of_science_desc:0 "The sciences will be taught and practised upon the foundation of dialectical materialism: matter in motion, development through contradiction, the knowability of the world and the social conditioning of knowledge without its enslavement. Research institutes, academies and planning bodies will be expected to demonstrate that their work rests on this foundation, and the philosophical faculties will be given a standing role in its defence. Science without philosophy serves the class that happens to pay for it."
 SOV_mandatory_study_modern_revisionism_desc:0 "Every student of the Party will be required to study modern revisionism as a subject in its own right: its texts, its authors, its sponsors and its results. The best defence against a doctrine is familiarity with it, and a cadre who has read Khrushchev's justifications line by line will recognise them the next time they are served up by a friendlier face. Revisionism will be a compulsory examination, and failure will be a career limitation."
 SOV_bring_back_workers_olympiad_desc:0 "The Workers' Olympiad taught a generation of labourers that the body of a worker was worth cultivating as much as any aristocrat's, and it was discontinued in favour of imported sporting spectacles. It returns: mass athletics, factory teams, regional competitions and a national final held on the anniversary of the revolution. Sport will be organised for the many rather than sold to the few, and the medals will belong to the enterprises that produced them."
 SOV_soviet_film_industry_desc:0 "Our cinema was the finest in the world in 1938 and has spent the years since competing with Hollywood on Hollywood's terms, complete with imported plots and imported morals. The film industry will be revitalised around the themes that only a socialist society can tell: the war, the construction, the collective farm, the factory floor. Directors will be given studios rather than instructions, and the box office will not be the measure of their worth."
 SOV_cultural_exchange_china_albania_desc:0 "The two parties that refused the revisionist road are also the two with whom our cultural relations have been allowed to wither while we cultivated the West. Exchanges with the People's Republic of China and the People's Republic of Albania will be resumed on a systematic footing: delegations, translations, students, exhibitions and joint publications. Socialist culture is not a national possession, and the countries that preserved it deserve to share it with us rather than with our critics."
 SOV_return_socialist_realism_architecture_desc:0 "The skyline of Moscow has been spoiled by glass boxes imported from abroad and paid for with the savings of the working class. Architecture will return to socialist realism: buildings that declare their purpose, that use the granite and the steel of this country, and that a citizen can look up at without being reminded of Chicago. The commune, the metro station and the palace of culture will again be designed for the people who will live in them."
 SOV_new_decree_on_music_desc:0 "A decree on music will restore order to a field in which the conservatories had begun to experiment with serialism and other contraptions that no factory worker can listen to and no party committee can defend. The requirement is simple: music must be masterable by a competent musician, appealable to a broad public and expressive of the life of the country. Innovation is welcome; incomprehensibility at public expense is not."
 SOV_promote_mayakovski_poetry_desc:0 "Vladimir Mayakovsky wrote for the crowd rather than for the salon, and he was the only poet of his century who treated the revolution as a subject worthy of the epic form. His work will be promoted in the schools, the factories and the theatres once more, together with the tradition he represents: verse that speaks in the voice of the street and the workshop, addressed to the millions rather than to the magazines of the West."
 SOV_encourage_soviet_writers_desc:0 "Writers will be encouraged - and that word is to be understood seriously. The Union needs novels about the war and the construction, about the collectives and the ministries, written by people who have actually stood on a factory floor. Publishers, unions and prizes will be directed toward that work, and the authors of the socialist realist tradition will find their manuscripts read rather than filed. A country that does not tell its own story will be told somebody else's."
 SOV_promote_cult_innovation_science_desc:0 "The men who design the tractors, split the atom and chart the genes must be treated as the heroes they are, with the visibility that soldiers receive in wartime. A cult of innovation and science will be promoted throughout the press, the cinema and the schools: named prizes, named institutes, names on the machines themselves. The working class builds the country, but it is the scientist who shows it where to build next."
 SOV_found_komintern_science_department_desc:0 "Science is organised internationally or it is not organised at all, and the socialist countries have been pooling their research informally while the West pools it with money. A department of science will be established within the revived Komintern to coordinate research across the bloc: joint institutes, shared data, the exchange of personnel, and a common front against the attempts to buy the best minds of our countries with Western fellowships."
 SOV_empower_komsomol_desc:0 "The Komsomol has been treated for a decade as a recruiting office and a parade formation, and it is the finest instrument the Party possesses for the shaping of the young. Its committees will be given real authority over the schools, the sports facilities and the cultural work of the youth, its journals will be read seriously by the Central Committee, and its members will be the first considered for every promotion that requires a person still capable of being convinced."
 SOV_lessons_from_the_past_desc:0 "The young of the Soviet Union were born after the war and have been taught that the past consists of a series of mistakes made by people older than their teachers. The lessons of the past will be taught instead: October, the civil war, the five-year plans, the blockade, the victory. Not as mythology but as experience - the accumulated decisions of a class that built a state in conditions the bourgeoisie called impossible."
 SOV_komsomol_shock_brigades_desc:0 "The Komsomol shock brigades will be reorganised along the lines that built the Dneprostroi and the metro: detachments of young volunteers assigned to the hardest projects of the plan, living on site, competing openly between enterprises, and carrying the banner of the organisation wherever the work is most difficult. Nothing so efficiently turns a generation into believers as the experience of finishing something together that was said to be impossible."
 SOV_send_cadres_down_to_masses_desc:0 "Party and Komsomol cadres will be required to spend a fixed period each year working in the enterprises and the collective farms they administer, on the shop floor and not in the visitor's gallery. A secretary who has not personally met a quota cannot judge one, and a cadre who returns to Moscow after a season in the fields will write different directives from one who has not. The masses are not a slogan; they are where the work is."
 SOV_reopen_workers_faculties_desc:0 "The workers' faculties were the ladder by which an industrialisation of illiterates produced its own engineers, and they were closed when the intelligentsia decided the country had produced enough of such men. They will be reopened: evening courses, factory-based colleges and preparatory classes for the workers and peasants who were denied a place in the universities. The right of the class to educate itself is the one right no ministry can afford to withdraw."
 SOV_mass_campaign_against_bureaucratism_desc:0 "Bureaucratism is the habit of substituting the filing of a document for the completion of a task, and it is the specific disease of a state that has grown comfortable. A mass campaign will be launched against it: petitions published, obstructing offices named, delays measured, and the responsible officials made to answer in public. The campaign must involve the workers themselves, since no auditor knows a department's true worth as well as the people who wait in its queue."
 SOV_reform_education_system_desc:0 "The education system has been reshaped several times in twenty years, each reform more ambitious and less coherent than the last, until a school leaver can neither calculate nor think clearly about what he has read. It will be reformed on the old foundations with the new requirements: a common curriculum of high standard, examinations that mean something, technical training that leads to a trade, and an end to the fashion for teaching children to be creative before they can spell."
 SOV_combine_study_with_production_desc:0 "Education that ends at the factory gate produces a graduate who despises the work he has been trained to supervise. Study will therefore be combined with production: students in the higher institutions will spend part of their time in the enterprises, and workers will spend part of theirs in the lecture halls. The division between the town that thinks and the town that tows will not be abolished by decree, but it can be abolished by timetables."
 SOV_scientific_atheism_campaign_desc:0 "Religion has been quietly reoccupying the space the state vacated - churches reopened, baptisms reported with pride, priests consulted on matters of morality. A campaign for scientific atheism will be conducted on the Marxist basis rather than the crude one: the study of religion's social origins, its class functions and its refutation by the natural sciences, taught in the schools and the factories, and addressed to believers as citizens rather than as enemies."
 SOV_culture_appealing_to_youth_desc:0 "The youth of the country have been offered Western music, Western dress and Western films, and they have accepted them because nothing Soviet was offered in their place. A culture genuinely appealing to the youth will be created: Soviet music, Soviet cinema, Soviet sportswear, Soviet adventure stories, produced with the same resources the capitalists use to sell their own emptiness. You cannot fight a foreign culture with lectures; you can only beat it with a better one."
 SOV_revive_league_militant_atheists_desc:0 "The League of Militant Atheists organised millions of workers in the struggle against clerical reaction before it was disbanded, and its disappearance left the field to the parish with no answer but silence. The League will be revived as a mass organisation of the scientifically educated: lectures, exhibitions, debates in the villages, and a permanent staff capable of answering the preacher on his own doorstep. Atheism must be organised, or it will simply be outnumbered."
 SOV_fight_western_influence_youth_culture_desc:0 "The influence of the West on the youth is not a matter of fashion but of intent: the radio services, the record labels and the exchange programmes are instruments of policy designed to produce a generation that finds its own country provincial. They will be countered not by closing the borders, which convinces nobody, but by outcompeting them - better music, better films, better sport, and a plain account of what the consumer society actually offers a worker who joins it."
 SOV_invest_in_cybernetics_desc:0 "Cybernetics was denounced as a bourgeois pseudo-science under Zhdanov and then quietly embraced under Khrushchev without anyone admitting the change of mind. It is nothing of the sort: feedback, control theory and the mathematics of optimisation are precisely what a planned economy requires if it is to calculate what a committee previously guessed. Institutes of cybernetics will be funded, their work placed at the disposal of Gosplan, and their results published for the whole bloc."
 SOV_phase_out_commodity_production_desc:0 "Socialism retains commodity production only because scarcity compels it, and every year that it is retained without necessity teaches the population that the market rather than the plan is the natural order of things. Commodity production will be phased out gradually and deliberately: state distribution extended, the collective farm market subordinated to the plan, and the price mechanism replaced wherever the supplies exist to replace it. The transition to communism is a question of material abundance, not of slogans."
 SOV_new_stakhanovite_movement_desc:0 "The Stakhanovite movement was buried by Khrushchev along with everything else he could not distinguish from Stalin's name, and with it went the practice of honouring the worker who found a better way to do the job. It will be revived in a new form: technical innovation competitions between enterprises, premiums for the rationalisers, and the publicity that a country which respects labour owes to those who set its records."
 SOV_allow_workers_participation_economy_desc:0 "The working class is not merely the beneficiary of the plan but its author, and workers' participation in the management of the economy will be expanded accordingly: standing production committees in every enterprise, the right to examine the accounts of the factory, and representation in the planning bodies at district and regional level. Consultation that changes nothing is decoration; participation that alters a decision is the dictatorship of the proletariat in practice."
 SOV_intensify_scientific_research_desc:0 "Research will be intensified across the academies and the institutes, with the disciplines that serve the plan given priority: metallurgy, chemistry, agriculture, energetics and the mathematical sciences. Lengthy careers on state pensions have produced a comfortable scientific caste in some institutes, and comfort will be measured against output. The country that put the first satellite into orbit did not do so by committee, and it will not be first again by habit."
 SOV_encourage_technological_innovation_desc:0 "Innovation in the enterprises is currently the responsibility of men who are punished for the failure of an experiment and receive nothing for the success of one. This will be reversed: premiums for rationalisation, protection for the engineer who proposes something new, and a formal channel by which a suggestion from the shop floor reaches the technical council without passing through three secretaries who do not understand it."
 SOV_propagandize_soviet_scientists_desc:0 "The names of our scientists will be made as familiar to every schoolchild as those of the marshals: Korolev, Kurchatov, Sakharov, and the hundreds of engineers whose work carries no name at all. Portraits in the factories, films about the institutes, articles in the newspapers that explain what was discovered and why it matters. A country that celebrates only its soldiers will produce soldiers; a country that celebrates its scientists as well will produce science."
 SOV_hold_mass_criticism_factory_managers_desc:0 "Mass criticism sessions will be held in the enterprises at which managers, directors and planning officials must stand before their own workers and answer for failures of supply, of quality and of delay. The practice was common in the first decade of the state and was abandoned once officials learned to arrange the audience in advance. This time the attendance will be open, the questions written, and the answers published in the factory newspaper."
 SOV_towards_post_scarcity_society_desc:0 "Every decision of the plan is ultimately directed toward a single objective: the abolition of scarcity, so that no citizen of the Soviet Union must choose between rent and bread, between a winter coat and a doctor's visit. The path runs through the cybernetised plan, the automated factory and the fully collectivised countryside, and each step along it is a stage upon it. The Party does not promise paradise; it promises to make the next shortage unnecessary."
 SOV_send_soviet_doctors_abroad_desc:0 "Soviet medicine is among the most advanced in the world and much of the world has never heard of it. Medical missions will be sent abroad - to the socialist countries, to the newly independent states of Asia and Africa, and wherever an epidemic has found no other answer. A doctor who cures a plague in a village that has never seen a Soviet engineer teaches more about socialism than a decade of broadcasting."
 SOV_invest_epigenetics_desc:0 "The study of inheritance, without the simplifications of the Mendelians and the frauds of Lysenko's successors, will be funded as a major programme of the academies. The Party has learned the cost of allowing a fashionable doctrine to dictate the biology of a country, and it intends neither to repeat the error nor to abandon the field to the West. Genetics, physiology and the new work on heredity will proceed on the evidence, which is the only materialist position available."
 SOV_all_union_congress_of_youth_desc:0 "An All-Union Congress of Youth will convene the delegates of the Komsomol, the students, the young workers and the young farmers of every republic to set the tasks of the coming decade. Its purpose is not ceremony: the generation that will administer the state in forty years is being formed now, and it should be asked, in front of the country, what it intends to build."
 SOV_xxiii_congress_of_the_cpsu_desc:0 "The XXIIIrd Congress will close the cycle opened at the XXIInd: the report on the fulfilment of the plan, the accounting of the restoration, the election of a Central Committee from which the last of Khrushchev's era have been removed, and the adoption of the next phase of socialist construction. It will also be the congress at which the leadership must answer for the promises it has made to the country."
 SOV_sideline_malenkov_desc:0 "Comrade Malenkov has served the Old Guard well, but he remains the one member of the leadership who privately believes that the welfare state is the answer to the class question, and his views are known in every embassy in Europe. He will be relieved of his most sensitive posts and retained in a capacity that uses his administrative talents without giving him a platform. Retirement would be too generous; removal would be too noisy."
 SOV_suslov_scandal_desc:0 "The Suslov Scandal begins with a file rather than a speech: memos in Mikhail Suslov's own hand, drafted for Khrushchev's use in the years of de-Stalinisation, found in the presidential archive and now placed before the Politburo. Either the ideological secretary of the Party spent a decade serving the line he now condemns, or he has been lying about it since the coup. He will be asked to explain himself in writing, before the Central Committee, and his answer will decide the future of the man who has drafted every party line for twenty years."
 
