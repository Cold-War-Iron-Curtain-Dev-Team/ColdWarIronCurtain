 SOV_APG_takeover_desc:0 "The efforts of the Presidium have have paid off and disaster has been averted, as Nikita S. Khrushchev has been ousted from all positions of power. Following his disastrous policies and administrative arbitrariness, Comrades V. Molotov, L. Kaganovich, G. Malenkov and D. Shepilov succeeded in removing him from office and have started the tedious process of reversing the damage done by Khrushchev during his period in power. The Old Guard has prevailed, and now it is up to them to shape the union in their image."
 SOV_bulganin_union_desc:0 "Following the removal of the revisionist traitor Khrushchev, Comrade Nikolai Alexandrovich Bulganin has assumed leadership as Premier of the Soviet Union and temporarily as First Secretary of the CPSU until a new one is elected by the Central Committee. Having served as Deputy Premier under Comrade Stalin and a member of the Politburo, Comrade Bulganin's leadership will surely bring the Soviet Union back on the right track."
 SOV_pr_take_mea_again_cornman_desc:0 "Although Khrushchev has been ousted, he hasn't necessarily been properly 'dealt with', as long as he remains within the bodies of government he is a threat to any attempts to revert his disastrous reforms and steer the Union away from its previous suicidal path. The Central Committee has come to the conclusion that we must do with Khrushchev what was done to Beria, have him swiftly accused of a couple of serious charges and imprisoned. Although risky, it is both a just fate for the revisionist traitor and an effecient way of solving the 'Khrushchev question'."
 SOV_mol_coun_min_chairman_desc:0 "Comrade Vyacheslav M. Molotov, a devoted Marxist-Leninist ever since the first days of our party, has been a faithful student of the late Comrades Lenin and Stalin and the latter's right-hand man. His leadership and achievements as People's Commissar for Foreign Affairs and Chairman of the Council of People's Commissars have not only propelled our Union into the future, but ensured its survival. It is only fair then, that an experienced Old Bolshevik such as himself be reappointed as Chairman of the Council of Ministers, as his experience and stern devotedness to true communist principles is what our union's leadership needs during these troublesome times."
 SOV_kag_dep_chairman_desc:0 "If Comrade Molotov was Stalin's right hand man, Comrade Lazar M. Kaganovich was his left. Kaganovich's efforts to the construction of socialism are inmeasurable, from his tempered commitment to Marxism-Leninism, to overseeing such marvels as the Moscow Metro and the successes of our Union's industrialization program, it is clear that Comrade Kaganovich is a man that can be trusted and his firm hand as Deputy Chairman of the Council of Ministers will once more lead socialist construction down the right path."
 SOV_return_stalin_agroculture_methods_desc:0 "The profit-driven market reforms in the countryside implemented by Khrushchev's clique are a betrayal to Marxist-Leninist principles and put at stake the effectiveness of our collectivization program and the proletarianization of the peasantry. We must discard these immediately and return to the Leninist-Stalinist methods of agricultural development, while improving them with newer technology."
 SOV_reg_com_purge_khrush_desc:0 "Although Khrushchev has been executed and revisionist influence has significantly decreased in the upper bodies of our government, we must not forget that in the turbulent 1930s, the Yezhovschina and the Bloc of Rights and Trotskyites operated through regional committees to carry out their acts of terrorism and sabotage. Although our security apparatus has significantly improved since then, chances cannot be taken and a large sweep must be carried out to rid these committees of Khrushchev's lackeys."
 SOV_khrush_affairs_desc:0 "Due to the criminal and traitorous nature of Khrushchev's behavior, Comrade Nikolai A. Bulganin has set up a commission tasked with investigating Khrushchev's rise to power, the real depth of the damage caused by his revisionist tendencies, his role in Stalin's death and the peculiar nature of the purges carried out in the Ukrainian SSR under his leadership as First Secretary in 1938. The commission's final report is expected to be ready for the upcoming 21st Congress of the CPSU and will be a heavy blow to the revisionist remnants within our party."
 SOV_return_stalin_stat_desc:0 "During his so called 'crusade' against Comrade Stalin and his legacy, Khrushchev completely tarnished the image of our late leader, accusing him of completely falsified charges and blaming practically every single excess or tragedy on the single personality of Comrade Stalin. With the wreckers caught, it is time to rehabilitate Stalin. Every statue shall be restored, every portrait put back up and any trace of the lies spread by the traitors erased. The image of Lenin's most faithful student shall never be tarnished ever again!"
 SOV_inves_posp_report_desc:0 "The so-called Pospelov Report, commissioned by the traitor Khrushchev, is a fishy document to say the least. Rehabilitations of convicted criminals without proper proof of innocence, reliance on unverified testimonies and outright contradictory documentary sources for its most serious accusations make it clear that this 'report' was in reality a poorly put together slanderous attack against our late Comrade Stalin. A thorough investigation must be launched to determine the truth behind these claims and to expose all the falsifications that have misled the Party and the people."
 SOV_rem_khrush_cpsu_dogma_desc:0 "Khrushchev's 'improvements' in the Soviet doctrine such as the 'State of the Whole People' and peaceful coexistence with the Western Imperialists have resulted in disastrous deviations from the correct Marxist path of socialist construction. Not only will we reverse all these disgusting revisionist deviations, but we shall also implement rigid and compulsory ideological courses in Marxism-Leninism to prevent such deviations from the younger cadres in the future."
 SOV_low_destalinization_desc:0 "Khrushchev's so-called 'De-Stalinization' has been the cause of practically all of the problems our Union has faced during the past couple of years. From smeering the image of Lenin's most faithful pupil, serving as an ideological prerequisite for Khrushchev's disastrous reforms, to ruining our relations with our Comrades in Albania and China who rejected revisionism and smeering the reputation of the socialist movement worldwide, this disastrous historically-nihilistic policy must be put to an end immediately. We shall sweep away the pile of rubbish heaped on Comrade Stalin's grave and clarify and disprove the lies and slander propagated by the Khrushchevites."
 SOV_revisionism_deafeated_desc:0 "The day has finally come. After purging all the revisionists and reversing our Union's suicidal course, the Old Guard's wise and stern hand has placed the land of October back on the socialist road. Under Comrade Bulganin, revisionism has been crushed, the traitors punished, the mistakes reversed, and our great Motherland is steady as she goes! Long Live the ideas of Lenin and Stalin! Long live the Dictatorship of the Proletariat! Long live the Working Class!"
 SOV_rev_pol_bureau_desc:0 "Now that the main Khrushchevites have been removed from their positions, we shall begin reshuffling our top political bureau and replacing revisionist traitors with people loyal to the cause of Marx, Engels, Lenin and Stalin. For instance, now that Serov has been arrested, Alexander Shelepin will be appointed as Main Director of the KGB along with Ivan Benediktov being reappointed as Minister of Agriculture and Nikolai Shvernik taking up Furtseva's position of First Secretary of the Moscow City Party Committee. This however, is just the beginning."
 SOV_trip_to_tirana_desc:0 "The brave people of Albania under the leadership of Enver Hoxha resisted the revisionist influence and condemned the Khrushchevites while they were in power. Now that the Khrushchevites have been dealt with and the land of October is back on the right path, a delegation will be sent to Tirana headed by First Secretary Bulganin himself to mend our relations with these brave Marxist-Leninists"
 SOV_trip_to_beijing_desc:0 "Khrushchev's disastrous policies have severely damaged our relations with our Chinese Comrades, not only by smeering the image of Comrade Stalin and taking the revisionist road, but by attempting to impose big power chauvinism on our Eastern Comrades. Now that the revisionists have been dealt with, it is time to fix these mistakes and resume proper relations with the Chinese Communists, who were brave enough to oppose the suicidal road taken by the Khrushchevites."
 SOV_bulganin_byebye_desc:0 "Despite handling the past turbulent year with great care and putting the Union back on the right path, Comrade Bulganin has expressed his intention to resign from his post of First Secretary of the CPSU, citing his age, the nature of how he was elected to the post and desire to hand over this post to some of his 'more competent' comrades. Unlike with Comrade Stalin however, now that the opportunists and revisionists have been purged from the party, there is no rampant power struggle to see who will replace the former First Secretary. As of now, the two most popular candidates within the party are Chairman of the Council of Ministers Vyacheslav Molotov and Deputy Chairman of the Council of Ministers Lazar Kaganovich who, although sharing the same vision, have different approaches to a couple of issues. Whether it be Molotov or Kaganovich who gets appointed as First Secretary, the Union is surely in good hands."
 SOV_21st_Congress_Bulg_desc:0 "With Comrade Bulganin's resignation, the Central Committee has called for an extraordinary Congress of the CPSU to elect a new First Secretary and charter our Union's course into the future. Along with that, many revelations have been made specifically with the investigation of the so called 'Pospolev Report' and the KGB's dive into the Khrushchev affair, and it is time to shed light onto that which the revisionists tried to shield away from the watchful eyes of the working class. Whatever the results may be, this congress shall be one of the most eventful in our Union's history."
 
 #Molotov events
 
 soviet_leader_change.5.t:0 "Emergency Meeting of the Presidium of the Central Committee of the CPSU"
 soviet_leader_change.5.desc:0 "On June 18, an extraordinary session of the Presidium of the Central Committee was convened, officially to discuss Comrade Khrushchev’s removal as First Secretary of the CPSU. Leading this drive was the so-called 'Anti-Party Group'—Malenkov, Kaganovich, Molotov, and Shepilov—stalwart figures of the Stalin era, who marshaled a majority within the Presidium to challenge Khrushchev's leadership.\n\nRumors persist, however, of a backroom understanding between Marshal Zhukov and KGB Chairman Serov aimed at thwarting the plot. Will these conspirators be exposed and discredited, or will the 'Anti-Party Group' succeed in reshaping the future of the Soviet Union?"
 soviet_leader_change.5.o.A:0 "Khrushchev Prevails. The Plenum of the Central Committee Condemns the Anti-Party Group."
 soviet_leader_change.5.o.B:0 "Khrushchev is ousted. The Old Guard Achieves Victory"
 
 soviet_leader_change.8.t:0 "The 21st Congress of the CPSU"
 soviet_leader_change.8.d:0 "The hall was full by seven in the morning. \n\nMolotov opened the 21st Congress of the Communist Party of the Soviet Union with a address that lasted forty minutes and was interrupted by applause eleven times, though he had not written it with applause in mind. He had spent the better part of two hours working through Khrushchev's record with the methodical patience of a man who had learned long ago that documented truth required no embellishment—the complete disregard for collective leadership, the meddling in fraternal parties, the fabricated revelations of the Secret Speech, the criminal neglect of the dying Stalin, and the murderous excess of the Ukrainian purges of 1938, swept quietly under the rug while Khrushchev stood before the 20th Congress and pointed his finger at everyone but himself. \n''It is clear,'' Molotov said. ''that Nikita Sergeyevich's intention was not merely to slander Comrade Stalin with assertions he was fully aware were false, but to consolidate power for himself and his clique of revisionists—to implement reforms which would have led to capitulation before the Anglo-American imperialists and the death of our Union.'' He paused, and the hall remained dead silent. ''However, Khrushchev did not act alone. Although the suicidal path of our party has been brought to an end, some men who once stood by and applauded the murder of Lenin and Stalin's ideas still remain. They will not hesitate to do it all again given the chance.'' Another pause. ''Comrades. Together we shall thwart the plans of these traitors and put the final nail in the coffin of revisionism, and continue the path set forth by Lenin and Stalin. Long live the dictatorship of the proletariat!'' \n\nThe hall erupted. Molotov took a quiet glance to his right, where Kaganovich sat, and to his left, where Voroshilov had risen with the rest. Then he scanned the room—methodically, without expression—for the faces he knew would be doing their utmost not to look like men who understood precisely what was coming for them. He found several. Their day would come. \n\nThen Suslov took the floor, and the mood shifted into something harder. The commission's findings were presented across three sessions. Citation by citation, the Pospelov Report was dismantled. The resolution on the rehabilitation of Stalin's historical legacy passed without a single dissenting vote, though several delegates sat a long moment before raising their hands. \n\nThat evening Molotov sat alone in his office, the day's transcripts on the desk before him. He had been in the Party long enough to remember when the work of building socialism had felt like something with a clear direction, and the people doing it had genuinely believed in that direction. A great deal had happened since then. A great deal had nearly been lost permanently. \n\nHe straightened the transcripts, set them aside, and rose. There was still work to be done."
 soviet_leader_change.8.A:0 "Glory to you, Vyacheslav Mikhailovich!"
 
 SOV_Molotov.1.t:0 "Reshuffling"
 SOV_Molotov.1.desc:0 "The last lists arrived on Molotov’s desk in the second week after the Congress, bound in grey folders and arranged by the severity of the recommendation. The regional committees had been dealt with months ago. Serov was gone, and so was Furtseva, along with the handful of officials whose files Shelepin had delivered in person and without comment. What remained was a smaller and more awkward problem. A few dozen men still sat in the Central Committee who had applauded at the right moments, voted with the majority and never given anyone a documented reason to remove them.\n\nKaganovich wanted the matter closed quickly. He read through the names with a pencil in hand and struck through half of them before Suslov asked him to stop. There was nothing in the files to justify it, Suslov said, and a Central Committee that expelled men without cause would soon have nobody left who dared to speak plainly in its sessions. Kaganovich put the pencil down, though he did not look convinced.\nMolotov listened to both of them and read the files himself, one at a time, over three evenings. Most were ordinary careerists who had read the wind correctly in 1956 and would read it correctly again if it changed. They were not dangerous because of any conviction. They were dangerous because they were positioned to be useful to whoever came next.\n\nThe solution that emerged was administrative. A deputy minister of a major department became the director of a provincial planning office. A candidate member with a long record in the ideological apparatus was posted as ambassador to a country that rarely appeared in the newspapers. Two men who had chaired important commissions found themselves in charge of rest homes, archives and regional museums. Each received a letter of appreciation for his past service and a new address. None was expelled, none was arrested, and none retained a seat in any room where a decision was made."
 SOV_Molotov.1.a:0 "There's no room for careerists..."
 
 SOV_Molotov.2.t:0 "The Presidium Question"
 SOV_Molotov.2.desc:0 "The office was quiet by the time Molotov sent the last of the secretaries home. The lamp on the desk was the only light, and beneath it lay a single sheet of paper with the names of the Presidium written in his own hand, in the order they sat around the table.He looked at it for a long time without writing anything.\n\nKhrushchev had spent years filling these chairs with men who owed him everything. Some of them had been promoted for their usefulness and others for their silence, and a few for the sole reason that they had never once disagreed with him. It had taken a decade to build, and one Congress to bring down. Molotov did not believe for a moment that the work of that decade had disappeared with the man himself. He thought of the Plenum in October of 1952. Stalin had stood before the Central Committee and spoken of vigilance, of comrades who had grown comfortable and forgotten what the enemy was capable of. Molotov had sat in the front row and heard his own name among those who had been warned. He had not understood it then. He understood it now. The capitalist roader did not announce himself, and he rarely sat in the back of the hall. More often he sat at the table, took notes, and voted with the majority.\n\nKaganovich he had known for forty years, and there was no doubt there. Malenkov had made mistakes, but they were the mistakes of a man who wanted the work to succeed. Suslov had never once strayed from the line, which was precisely why Molotov had begun to watch him more closely. A man that consistent was either a rock or a mirror, and that difference mattered. Then there were the others, Mikoyan with his smile that survived every change of leadership, practically Khrushchev's jester, Podgorny and Kirichenko with their long loyalty to the man from Ukraine. Each of them had a file, and each file had a page he had not yet decided what to do with.\nHe turned the paper over and then turned it back.\n\nThere was an order to these things. A move made too early would warn the men who were still unaware, and a move made too late would give them time to find each other. Stalin had understood this better than anyone. Molotov had watched him wait for months before acting, and he had never once seen him wait too long. Somewhere in the building a door closed, and footsteps passed along the corridor and faded. Molotov capped his pen and set the list aside. Tomorrow he would begin."
 SOV_Molotov.2.a:0 "To set things right"
 
 SOV_Molotov.3.t:0 "Second Secretary Lazar Kaganovich"
 SOV_Molotov.3.desc:0 "The papers from the Presidium session were still on the table when the others left, yet Kaganovich did not get up to go with them. He found the decanter that had stood in the corner of that office since before the war, poured two glasses, and sat down opposite Molotov the way he had a thousand times before, only this time now they were First and Second Secretary of the Party respectively, posts that neither man had ever thought they'd end up in.\n''Forty years...'' Kaganovich said, turning the glass slowly in his hand. ''Do you remember the first time we sat in this room?'' Molotov did. It had been smaller then, or there had been more of them. He remembered the arguments over the first five-year plan, Voroshilov asleep in the corner, and Stalin walking the length of the carpet with his hands behind his back, deciding in an evening what could not be decided in a year. Kaganovich was talking about the Metro now — the escalators, the marble, the first train — and how Stalin watched with intrigue each step of the industrialization process.\n\nAnd yet, as the Marxist he was though, Molotov began to think once more about thought about how close they had been to failure, how close the wreckers had been to victory. Opportunism never arrived announced as betrayal. It came as a correction, as a rectification. Wether they accused the mass party line of right or left deviationism it never truly mattered. Trotsky had wanted the Union to launch itself into a suicidal permanent revolution. Bukharin had wanted to halt socialist construction entirely. And somehow both left and right opposition resorted to a united terrorist bloc. And then Khrushchev, who had wanted history itself rewritten just so that he could justify giving himself and his bureaucratic elite more privileges. All three were now in the dustbin of history.\n''The opportunists will come again,'' Kaganovich said, as though following the same thought. ''They'll always try, unless we keep hitting them over the head with a shovel.'' he now added with a bit of humor. Molotov nodded. Outside, the snow had started again over Red Square."
 SOV_Molotov.3.a:0 "With Iron Lazar around, the party always answers to the masses."
 
 SOV_Molotov.4.t:0 "Purge of Suslov and Ponomarenko"
 SOV_Molotov.4.desc:0 "\nMikhail Andreevich Suslov was a vivid political, and primarily an ideological toy of Khrushchev, in fact, a mouthpiece for promoting revisionist nonsense and a policy of betrayal. Panteleimon Kondratievich Ponomarenko is essentially a nationalist with delusional ideas and megalomania, in particular his desire to transfer Kaliningrad and attempts to become almost secretary of the Central Committee of the CPSU. In order not to promote this horror to the masses, these individuals should be repressed as soon as possible."
 SOV_Molotov.4.a:0 "Common sense always wins"
 
 SOV_Molotov.5.t:0 "Chairman Alexander Shelepin"
 SOV_Molotov.5.desc:0 "The office on the second floor had belonged to Ivan Serov until a year before, and yet to Shelepin it seemed like it had been just last week. He had changed nothing in it: the same desk, the same steel cabinets, the same window onto the square, the same drawers in which the files still stood as Serov had left them. He had been handed the keys, the dossiers and the full weight of the Committee for State Security on a single sheet of paper signed by Comrade Molotov, and he had read it twice before locking it in the drawer.He was not yet fourty, and he was the youngest man ever to sit in that chair. It was the Komsomol that had raised him, then the war, then the secretariat of Comrade Stalin himself, and he had learned early that promotions in Moscow were rarely rewards - they were a test of trust. This one he understood perfectly.\n\nHe took the envelope out of the drawer again: the Kremlin letterhead, the short line in Comrade Molotov's hand about Ivan Serov, First Secretary Bulganin's signature beneath. He remembered the corridors of the Lubyanka that night, unusually quiet, and the way Serov had studied the warrant and nodded. ''I suppose it was inevitable.'' Shelepin had felt a thrill then, the same one he had felt reading how Yezhov's own men had walked their chief down the hall. He was no longer ashamed of it, but he had stopped mistaking it for anything more than what it was. Ambition.\nPerhaps, even with a sense of infantile naivety, Shelepin thought that he could one day come to be as well known as Iron Felix himself, whose portrait now hung directly above the office door. A Chekist's main duty was to protect the dictatorship of the proletariat, that much he was sure about, and it was a duty he was willing to sacrifice everything for. Whatever the party's directives were, whatever the will of the working class was, he'd carry it out."
 SOV_Molotov.5.a:0 "The fist strikes only where the Party points."
 
 SOV_Molotov.6.t:0 "The Khrushchevites"
 SOV_Molotov.6.desc:0 "\nThe envelope on Shelepin's desk held two names and one instruction, written in Comrade Molotov's hand and countersigned by Kaganovich: the author of the report, and the man who had praised it loudest. Neither was to be given time to warn the other.\n\nThe first car stopped outside a quiet building on the Arbat a little after five. Pyotr N. Pospelov was still in his study, surrounded by the files he had spent the winter assembling, when the officers came up the stairs. He did not resist. He asked only to be allowed to finish dressing, and when that was refused, whether he might at least take his spectacles. The officer in charge said nothing and held the door open.\n\nThe second car found Anastas I. Mikoyan already awake, sitting in his dressing gown with tea gone cold. He looked at the warrant for a long moment, then at the men around him, and smiled the smile that had survived Lenin, Stalin and every purge in between. ''So it is my turn,'' he said, and reached for his coat before anyone could reach for him.\n\nBy eight the two men were in separate cells in the Lubyanka, and by noon their names had been struck from every list that mattered. Shelepin filed the paperwork himself. It was, he thought, a tidy morning's work."
 SOV_Molotov.6.a:0 "A tidy morning's work."
 
 SOV_Molotov.7.t:0 "Fate of the Ukrainian Revisionists"
 SOV_Molotov.7.desc:0 "\nKiev learned of the plenum before Moscow made it public. The telephones in the Central Committee building began ringing at seven, and by half past Alexei I. Kirichenko understood that the men he had defended in June would not be sending him any more instructions.\n\nHe had been Khrushchev's man in the Ukraine for ten years and had said so at the plenum, in front of the whole Central Committee, while the votes were still being counted. Nikolai V. Podgorny had done the same, though with more care and fewer words, which was his way. Now both sat in the First Secretary's office with the curtains drawn, waiting for the car that had already left the airport.\n\nThe officers who came for them were polite. Kirichenko asked whether he might speak to Moscow first. He was told that Moscow had already spoken. When they were led out along the corridor, the staff stood aside and looked at the floor, and nobody said goodbye. By the afternoon the Ukrainian apparatus had a new leader, and by evening the newspapers in Kiev had discovered that the two men had always been enemies of the Party.\nShelepin's office received the confirmation at six. He read it, initialled it, and put it in the file with the others."
 SOV_Molotov.7.a:0 "First Serov, Now the Ukraine."
 
 SOV_Molotov.8.t:0 "Senior Secretary Mikhail Suslov"
 SOV_Molotov.8.desc:0 "Suslov was shown in at nine o'clock, and Molotov rose, which he rarely did, and offered him the chair on the far side of the desk and a glass of tea that neither of them drank. The courtesy was the whole of the meeting's design.\n\n''I have read your file again, Mikhail Andreevich,'' Molotov said. ''All of it. Twice this week.'' He let that sit for a moment. ''You have never deviated from the line, not once in twenty years. Kaganovich has deviated. I have deviated. Comrade Stalin himself did too at times. You never did. And so I find myself asking what a man who is always right has been doing with himself all this time.''\n\nSuslov did not answer at once. He had been in the Party long enough to know that a question asked that gently was not being asked gently.''I will tell you what I was,'' he said. ''I was a secretary. I wrote what was put in front of me and called it the line, and when the line changed I changed the wording and called that the line too. Your name is on the commission that produced the Pospelov Report - not Pospelov's alone, mine as well. I have never claimed I tried to stop it. I was in the hall at the Twentieth Congress and I said nothing, and I have thought of little else since. A man who keeps his post by keeping his head down is not loyal. He is... convenient, and I was convenient for five years. My loyalty has not moved - not in twenty years, not under Khrushchev, not under anyone. What failed me was never the cause. It was my nerve, and I am asking you to judge me by the conclusions I reach from this day, and not by the ones I failed to reach before.''\n\nMolotov watched him without expression. He thought of the lists after the Congress, and of Kaganovich's pencil striking half the Central Committee through, and of Suslov quietly asking him to stop because there had been nothing in the files to justify it. He thought of the Congress itself, where the same man had taken the floor and dismantled the Report citation by citation over three sessions, patiently, without a single wasted word, and of how many delegates had not raised their hands until the vote was already decided.\n''Very well,'' Molotov said at last. ''You are confirmed as Senior Secretary of Ideology. The doctrinal work is yours: the Report, the legacy of Comrade Stalin, the courses for the cadres. And understand me, Mikhail Andreevich - a man who was silent for five years must now speak every day, or the Party will conclude he had nothing to say. Your standing depends entirely on the conclusions you reach.''\n\nSuslov thanked him and went out along the corridor without looking back. Molotov put the file away and left the reshuffle lists in the drawer. He had asked Suslov what he had been, and he had not quite decided whether the answer had been true - but the work would show it, and the work would be public."
 SOV_Molotov.8.a:0 "A rock, or a mirror."
 
 SOV_Molotov.9.t:0 "Vasily Iosifovich Stalin"
 SOV_Molotov.9.desc:0 "The order releasing him carried the signature of the Chairman of the Presidium of the Supreme Soviet, and the officers who read it did not read it twice. Vasily Iosifovich Stalin walked out of the prison yard at half past eight in the morning with a cardboard box under his arm - a change of clothes, and the last photograph of his father that they had not taken from him - and did not go home.He went to Kliment Yefimovich Voroshilov. The old man received him in his office in the Kremlin and did not stay behind the desk when the door opened. He came round it, took both of Vasily's hands in his, and held them for longer than the boy expected. ''Sit down, Vasya.'' Nobody had called him that in four years. He sat.\n\nHe had known Voroshilov since he was a child - the red-haired, sharp-tempered son whom the Marshal had taught to ride and to shoot, and once defended at the dacha at Kuntsevo in front of Comrade Stalin himself, on the argument that the boy had his father's temper and his mother's stubbornness and would make a fine pilot if he were left alone to be one. The dinners that lasted until two in the morning, the maps spread across the floor, the old cavalryman arguing with the young aviator about horses and about speed: those were the things Vasily had to say now, because they were the only things he still had that no one had written into a file.\n\n''They put me away for exposing 6 years ago what's just being said now'' he said at last. ''Not for anything I had done. For saying at the wrong table what everyone was saying in the kitchen. For not being able to stop myself from saying out loud that those traitors had neglected my dying father.''\n''I know what they wrote down,'' Voroshilov said. ''I read every page of it. And I signed your release with my own hand, and I would sign it again in front of the same people who signed the other paper.'' He let go of Vasily's hands and reached for the file on his desk, because he was still, at his age, a man who preferred documents to tears. ''The Congress has restored your father by resolution, and his name is being printed again without apology. By Friday yours will be printed beside it, and nobody will be required to lower their voice when they read it. That is not sentiment, Vasya. That is the line.'' Vasily said nothing for a while. He looked out of the window at the street, where a man was calling out the evening edition, and he listened for the word that had cost him four years of his life and was now simply printed on the front page. ''Good,'' he said. It was all he could manage, and it was enough."
 SOV_Molotov.9.a:0 "Mourning one's father was never a crime."
 
 SOV_Molotov.10.t:0 "Sergei Kruglov"
 SOV_Molotov.10.desc:0 "The reinstatement order was one page long, and Kruglov read it standing up, the way he had read thirty years of orders, then folded it and put it in the breast pocket of a coat that no longer sat on him as it had. They had given him a pension and a hunting lodge outside the city and a dacha he had not asked for, and for four years he had done precisely what was expected of a man they had written off: nothing. The Khrushchevites had not even had the courage to charge him with anything. They struck his name from the lists and waited for him to die quietly, which was their mistake, because Kruglov did not do things quietly.\nThe Committee's chairman came to see him the same afternoon.Alexander Nikolayevich Shelepin was a decade younger than him, and Kruglov had taken the trouble to read the man's file before the door opened - the Komsomol, the secretariat, the night at the Lubyanka when he had put the warrant in Serov's face and Serov had simply nodded. The young men always came round in the end; that had been true of Yezhov's, and of Beria's, and Kruglov had outlived both. He poured two glasses and waited.''You have been asked to come back to guard the railways, the borders and the camps,'' Shelepin said, and did not sit down, which Kruglov found interesting. ''The Ministry answers to the Presidium and to nobody else. I am not here to flatter you, Comrade Kruglov, and I would advise you not to flatter me.'' ''I have never flattered anyone in my life,'' Kruglov said. ''It is the reason I was thrown out.'' He pushed one of the glasses across the desk. ''Sit down, Alexander Nikolayevich. You may be young enough to stand through an entire meeting. I am not.''\nThe young man sat, and what followed was the conversation that only two men who had each survived by being useful could have had: what the Ministry had lost in four years, what the Committee had learned in one, and which of Serov's people had kept files on their own comrades and would have to be found before those files found them. Kruglov promised him no friendship. He promised him that the Ministry would move when the Party said move, at the speed the Party said, and no faster - and that when the sweep came it would be conducted by men who had done it before, and done it correctly.Shelepin thanked him and left. Kruglov finished the glass, took the order out of his pocket, read it once more and put it back. By morning the interior troops were moving to the railways and the borders, and nobody in Moscow needed to be told what that meant."
 SOV_Molotov.10.a:0 "A purge needs men with memory."
 
 SOV_Molotov.15.t:0 "Deputy Chairman Shepilov"
 SOV_Molotov.15.desc:0 "Shepilov arrived at the First Secretary's office at ten minutes past four with a notebook he had not been asked to bring, and Molotov, who had spent the better part of an hour deciding what to do with him, noted that and said nothing about it.\n''You hesitated in June,'' Molotov said, without any preamble at all. ''When it was being decided, you sat where you were and said nothing for eleven minutes, and then you voted with the Presidium. I have the transcript. Kaganovich has read it, Malenkov has read it, and the whole Central Committee has read it - and a good many of them have not once mentioned it to you since, which I consider worse than the hesitation itself.''Shepilov did not sit down. He was the youngest of the four who had stood against Khrushchev in June - fifty-two, and already burdened with the reputation of being the cleverest of them all, a reputation Molotov had learned long ago to distrust in other men.''I know the transcript by heart, Comrade Molotov,'' he said. ''I have read it more often than anyone in this building, and I will not tell you that I was ill, or that I misunderstood the question, or that my hand was unsteady. I hesitated because I was calculating, and then I stopped calculating and voted for the Party, and I have not been able to forget those eleven minutes since. I do not intend to forget them.''\n\n''Good.'' Molotov turned the notebook over and back once. ''A man who forgets his own hesitation will find another one. Now sit down and write me a paragraph - not a speech, a paragraph - on why returning to the proletarian line may cost more than it returns, and why we are going to implement it in any case, because that is the task of the Vanguard Party. You may take the desk by the window. The Deputy Chairman's principal duty is to write what the Chairman cannot be seen to write, and you are, I am told, the best pen in the Presidium. Prove it before the end of the week.'' Shepilov sat down at the desk by the window and began to write, and Molotov watched him for a moment from behind his own papers. The boy had been clever in June - clever enough to see which way the wind was blowing, and then clever enough to be ashamed of it afterwards, which was rarer. He had the education, the connections and the pen that a deputy chairman required, and he had something the rest of them had lost somewhere along the last thirty years: he was still young enough to be frightened of being wrong.\nBy evening his name was in the Presidium record as Deputy Chairman of the Council of Ministers, and the youngest of the four had a desk of his own."
 SOV_Molotov.15.a:0 "He hesitated once. He will not hesitate again."

 SOV_Molotov.16.t:0 "Zhukov's Retirement"
 SOV_Molotov.16.desc:0 "Marshal Ivan Stepanovich Konev came to the dacha at nine in the morning, and Zhukov met him on the terrace with the tea still hot, because apart from him and Konev being professionals with alot of mutual respect, Zhukov had been a soldier long enough to know that a man who arrives at nine has been sent rather than has come.\n''Georgy Konstantinovich, the party commends your courage and heroism in defense of the Worker's State.'' Konev said ''However, the presidium has decided that your age and other factors make you unsuitable for the Ministry of Defense. Henceforth it proposes you retire, with every honour of your rank retained, the memoirs published at the state's expense, and a dacha on the Crimean coast, which you have earned twice over. There is another version of this conversation available, and I would advise you not to ask me what it is.''\n\nZhukov looked at him for a long moment, and Konev watched the pride in the man do its work - the pride that had carried him into the Kremlin in 1953 to be promised the Ministry, the pride that had flown marshals to Moscow in June for a man not worth the fuel, the pride that had never once permitted anyone to forget that he had broken the Wehrmacht. The pride that had nearly cost him everything twice, and would certainly cost him everything a third time.\n\n''I will write that I asked for it,'' Zhukov said at last. ''I will write it myself, and it will read well. You may tell the Presidium that the Marshal of Victory thanks them for their consideration, and that Crimea is not an exile - I have been meaning to finish the memoirs for six years.''\nHe shook Konev's hand, and by noon it was done, and by evening the name of Zhukov stood in the newspapers beside the words of his own request, the Marshal of Victory was now embarking on the road of peace and quiet.In his office on the other side of the city, Lazar Kaganovich read the report, put it down, and let out the breath he had been holding since the morning. It was done, and it had cost the Party nothing, and that was the whole of it. He remembered 1953, when the Marshal's vanity had made him the instrument of a man who offered him the Army in exchange for a signature; he remembered the understandings with Serov in June, and how close Zhukov had come to being the man who saved Khrushchev rather than destroyed him. It takes a very particular pride to believe a man who flatters you, and Zhukov had that kind in abundance.''Send Konev my regards,'' Kaganovich said to the secretary. ''He has the Ministry now, and he will hold it with both hands. And see that the memoirs are good - the Marshal will want them to be good.''"
 SOV_Molotov.16.a:0 "A Dacha in Crimea seems nice."
 
 #Bulganin events
 
 bulg_agriculture_1_tt:0 "By fully rollbacking Khrushchev's plans, we will ensure our agriculture's safety, however future innovations will be slow."
 
 bulg_agriculture_2_tt:0 "Experimenting with some of Khrushchev's agricultural reform proposals is risky, but if we are succesful the benefits reaped will be quite considerable."
 
 sov_stalinist_agriculture:0 "Stalinist Agricultural Restoration"
 sov_stalinist_agriculture_desc:0 "The market mechanisms of the Khrushchev period have been discarded and the collective farm system restored to its correct footing."

 sov_stalinist_agriculture_inov_fail:0 "Incomplete Agricultural Restoration"
 sov_stalinist_agriculture_inov_fail_desc:0 "The rollback of Khrushchev's agricultural reforms has been only partially effective. The collective system has been formally restored, but years of revisionist mismanagement have left their mark on farm administration and output remains below expectations."
 
 sov_stalinist_agriculture_inov_good:0 "Stalinist Agricultural Innovation"
 sov_stalinist_agriculture_inov_good_desc:0 "We decided to revert most of Khrushchev's agricultural reforms, however we also decided to take experiments on limited versions of his past campaigns. And our efforts were worth it, cities and countryside are provided with good amount of food, and we are in a good position to continue agricultural modernisation. Although a small victory, the people cherish our leadership for it."
 
 sov_revisionism_defeated:0 "Anti-Revisionist Bastion"
 sov_revisionism_defeated_desc:0 "The Khrushchevite clique has been exposed and defeated. The Party moves forward, Stalin's name has been vindicated. The Vanguard Party rises once more"

 sov_dekhrushchevization:0 "De-Khrushchevization"
 sov_dekhrushchevization_desc:0 "The revisionist deviations introduced under Khrushchev's clique are being systematically purged from the ideological foundations of the Party and state apparatus."
 
 SOV_CornManOutAPG.1.t:0 "[GetNewspaperHeader]Khrushchev Ousted!"
 SOV_CornManOutAPG.1.desc:0 "Much to the shock of the international community and the communist movement, reports from Moscow indicate that Nikita Sergeyevich Khrushchev, General Secretary of the CPSU infamous for his attack on Stalin and his cult of personality, has been ousted after a vote in the Presidium of the Central Committee of the CPSU. Khrushchev has been accused of violating the principles of collective leadership, opportunism, administrative arbitrariness and criticized for his handling of party history and foreign policy, specifically his handling of the Hungarian crisis. \n\nIn his place, a troika has been set up by V. Molotov, L. Kaganovich and N. Bulganin, with the latter serving as First Secretary until a replacement can be picked by the central committee. Khrushchev's deposal has notably been met with cautious endorsement from Albanian leader Enver Hoxha and Chinese leader Mao Zedong, who had previously ruptured with the Soviet government due to what they described as revisionism and big power chauvinism."
 SOV_CornManOutAPG.1.a:0 "So much for the 'Corn-Man'"
 
 SOV_AlbaniaVisit.t:0 "[GetNewspaperHeader]Tirana and Moscow Resume Fraternal Ties"
 SOV_AlbaniaVisit.desc:0 "Reports from Albania confirm a dramatic shift in the socialist camp following a historic meeting in Tirana between a Soviet delegation led by Vyacheslav Molotov and Albanian leader Enver Hoxha. The visit marks the official end of the bitter diplomatic and ideological freeze that has isolated the two nations since the 20th Congress. In an unexpected break from protocol, Hoxha personally welcomed Molotov on the steps of the Palace of Brigades. Subsequent talks abandoned the tense evasions of Khrushchev's time as General Secretary, with Hoxha offering a blunt accounting of Albania's steadfast resistance against 'revisionist pressure' from both Belgrade and Moscow. Molotov reportedly expressed deep admiration for the small Balkan nation's ideological resilience, declaring that the architects of past deviations have finally answered to the Party."
SOV_AlbaniaVisit.a:0 "The International Communist Movements Stands United"
 
 Bulg.1.t:0 "Nikolai Alexandrovich Bulganin."
 Bulg.1.desc:0 "In accordance to the Presidium vote which ousted Khrushchev, Comrade Nikolai Alexandrovich Bulganin was appointed as First Secretary of the CPSU for the time being, while Khrushchev himself was demoted to minister of agriculture since, according to Comrade L. Kaganovich, he was an 'expert on kukuruza'. Needless to say, disaster had been averted, and Bulganin was now in charge of the Union as both Chairman of Council of Ministers and First Secretary of the Communist party. \nBulganin let himself reflect on this for a while. He wasn't a political protégé, not in the slightest, nor did he want to be. This didn't mean that Bulganin was illiterate when it came to Marxist-Leninist theory not at all, but he would have much preferred to remain in a managerial position, just as he had been during Stalin's times as chairman of the Moscow city government. However now he held the two most important positions in the entire Soviet Union and he found himself questioning whether he truly was the right man for the job. Yet Bulganin refused to fall into a feeling of incompetence, after all, the party needed him, the people needed him. \n\nKhrushchev's reforms had devastated socialist construction, that much was clear. Someone needed to put the land of October back on the right track and, out of all of the Politburo members, Bulganin was the least likely to be opposed since his fellow Old Bolsheviks had been, to a degree, discredited by the Secret Speech. The Party had spoken, and the Party was never wrong, and so it was now Bulganin's duty to clean up all the mess caused by almost half a decade of revisionism and administrative arbitrariness. But first, the newly appointed First Secretary had to properly deal with the man responsible for all of it..."
 Bulg.1.a:0 "Good Luck, Nikolai Alexandrovich! There's a lot to be done..."

 Bulg.101.t:0 "Moscow, Lubyanka Building, 1:30AM"
 Bulg.101.desc:0 "Alexander Shelepin found himself staring at an envelope stamped 'Of Special Importance' as his eyes darted open. The courier had arrived shortly after 1 AM and although Shelepin had initially dismissed the letter due to his groggy state, after realising it had come from the Kremlin and reading its contents he really wished he hadn't. There, written in what was unmistakably Comrade Molotov's handwriting, was a short directive that simply said: ''Comrade Ivan Serov is to be removed from his duties and placed under arrest immediately.'' with First Secretary Bulganin's Signature at the very bottom, and that was enough to make any sense of tiredness evaporate from his body. \nShelepin's mind began to race as his eyes stared at the words in disbelief. He had started out as the First Secretary of the Komsomol under Comrade Stalin as an ambitious and well-educated man and to his surprise, had retained his position after De-Stalinization despite being a favorite of the late leader's. Then shortly after, the coup happened, and yet once again Shelepin remained not only untouched, but began getting actively promoted. In fact, he had been assigned to the post of First Deputy Chairman of the KGB just a couple weeks before this fateful night. A decision he now understood the reasoning of. \n\nWithin minutes Shelepin began to make preparations. Only a handful of officers could be trusted with such a task. Too many men and word might spread. Too few and Serov might resist. Shelepin had read and heard about Yezhov's arrest, how he had been rightfully brought to justice by his own subordinates for his disgusting abuses and swiftly liquidated, and he couldn't help but feel somewhat thrilled at the prospect of getting to experience what his predecessors had. Once he had assembled his team the men then proceeded to make their way to Serov's office, who was completely unaware of what awaited him. The corridors of the Lubyanka Building were unusually quiet as they approached the Chairman’s office. Shelepin was the one to knock on his door, and when Serov opened it, shoved the arrest warrant into his face. To Shelepin's surprise, he simply studied the document for a moment before nodding slowly. ''I suppose it was inevitable''. Ivan Serov was then placed in handcuffs, his aides dismissed, and then led down the hall, never to be heard from again."
 Bulg.101.a:0 "First Yagoda, Then Yezhov, Then Beria, Now Serov."

 Bulg.102.t:0 "The Ballad of Mikhail Suslov"
 Bulg.102.desc:0 "The corridors of the Central Committee building had grown unusually quiet when Malenkov and Molotov arrived outside Suslov’s office. It was already late at night and yet the two Bolsehviks knew that Suslov was most likely still working. Mikhail Suslov was the man who had taken Zhdanov's position in 1948 as Senior Secretary of Ideology after the latter's tragic passing and was one of the most influential men in the Union. Molotov took a moment to think. From what he knew Suslov was a man who valued stability and ideology above all, an orthodox in that sense. And yet, if that were the case why didn't he at the very least stay quiet at the slanderous 20th Congress? Why did he actively denounce the so called 'cult of personality'? Molotov quickly came to the conclusion that, far from his predecessor Andrei Zhdanov, Suslov had become complacent, had lost most revolutionary spirit and would've continued being a reluctant subservient to the Khrushchevite clique had they not been ousted. And yet, Molotov knew from all his years working with the Senior Secretary that after the disasters in Hungary and Georgia, the tarnished relations with Albania and China and the whole concept of 'detente' with the Imperialists introduced by the revisionists, that Suslov was most likely not too pleased with Khrushchev, and therefore, could certainly be convinced to work against any potential countercoup Khrushchev could plan. The two men then knocked on Suslov's office door and were let in.\n\n''Comrade Molotov, Comrade Malenkov, How may I help you this evening my dear friends?'' said Suslov adjusting his glasses and rubbing the sleep from his eyes. Malenkov and Molotov then proceeded to recapitulate and explain to Suslov the nature of what had been done during Khrushchev's years in power and how his policies had undermined the construction of socialism and easily could've led to capitulation to the West. There was a brief silence after the explanation. Suslov leaned back slightly in his chair, his fingers interlocked as he studied the two men standing before his desk. The Senior Secretary listened without interruption, his expression as unreadable as ever. ''I see,'' Suslov finally replied quietly. ''And what exactly do you require from me, comrades?'' Molotov spoke first. ''You understand the Party apparatus better than anyone, Mikhail Andreyevich. Khrushchev may have been removed from power, but men like him do not simply accept defeat. We believe he may already be attempting to rally his supporters within the Central Committee and the regional Party organizations.'' Malenkov nodded in agreement. ''If he succeeds in gathering enough allies, he may very well attempt a countercoup. The situation remains fragile, and we cannot allow factionalism to once again endanger the unity of the Party.'' Suslov remained silent for a moment, adjusting his glasses as he considered their words. ''And so you have come to ensure that the ideological organs of the Party do not fall into his hands, correct?'' he said calmly. Molotov allowed himself the faintest hint of a smile. ''Precisely.'' Another long pause followed. Finally Suslov stood from his chair and walked slowly toward the window, looking out into the dimly lit courtyard of the Central Committee building. ''Well then, The unity of the Party must remain above all else. If Comrade Khrushchev truly intends to undermine it, then he must be stopped." Suslov turned back toward the two men as Malenkov glanced at Molotov before giving Suslov a faint smile and nodded."
 Bulg.102.a:0 "''Very well Comrade Suslov, I believe that this matter is settled then...''"

 Bulg.103.t:0 "The Marshal of Victory goes on tour"
 Bulg.103.desc:0 "Lazar Kaganovich walked past officers rushing from place to place and moving between briefings and reports as he made his way towards the Minister of Defense's office. The Old Bolshevik, although now near his mid-sixties, still had a commanding presence within the building and some of the more educated newer cadets took the opportunity to salute and exchange a couple of words with Iron Lazar himself. After all, as emphasized by the new leadership, he was the man responsible for some of the greatest achievements of Soviet industrialization such as the Moscow Metro and a close friend of the late Comrade Stalin. Kaganovich on his part, although receptive of the gestures made by his younger admirers, tried to make his way to the Marshal's office as quickly as possible. He remembered the decision reached at the last Presidium meeting: ''Get Zhukov away from Moscow for the time being''. Kaganovich wondered how a man such as Georgy Zhukov could've become inconvenient for his own motherland. He couldn't help but feel great admiration for the Marshal, after all, the military genius of Zhukov had saved the land of October from the fascist onslaught and it was his armies that took Berlin, the lair of the beast. And yet, pride and ego had gotten the better of the Great Marshal, and it only took Khrushchev a couple of promises to get him to support the slanderous 'Secret Speech' that Zhukov surely knew was completely made up of lies. Kaganovich allowed himself to sigh before knocking on the office door now in front of him and taking a step inside.\n\n''Comrade Kaganovich!'' Zhukov said, rising from his chair, speaking with the same grandeur and confidence in his voice as always. ''I was not expecting visitors today. What brings you here?'' Lazar removed his coat and took a seat opposite the Marshal. After engaging in some small talk and catching up with each other's whereabouts, Kaganovich then explained to the Marshal the reason for his visit and the Party's request. ''Comrade Kliment Voroshilov was originally tasked with conducting an inspection tour of the armed forces of our fraternal socialist states. Unfortunately, he has recently fallen ill and is unable to carry out the assignment.'' Zhukov leaned back slightly in his chair. ''And so you expect me to take this task up for myself?'' The Marshal asked. ''Precisely'' Kaganovich replied. After discussing logistics, the nature of the inspection and the expected time Zhukov studied the Party veteran standing before him before nodding. ''“Very well. If the Party requires it, I will conduct the inspection.'' Kaganovich allowed himself a small, satisfied smile before saying farewell to the Marshal and walking out of the door. Zhukov stood up and stared out of his office window at the Moskva River. Memories from his last time in Berlin and the other cities of Eastern Europe quickly filled his mind and Zhukov allowed himself a faint smirk. Perhaps their new socialist brothers did need his expertise and help in handling their army, after all, he was the man who had torn the heart out of the fascist beast, and there was no better man to show the fraternal armies how to defend themselves from imperialist aggression than he who had defeated the most vile of them all. The Marshal then sat back down at his desk and swiftly got back to work."
 Bulg.103.a:0 "''Mother Russia still has much to teach to her new sisters...''"

 Bulg.104.t:0 "The Moscow City Party Committee"
 Bulg.104.desc:0 "Unlike many of his colleagues within the Presidium, Dmitri Trofimovich Shepilov had never been a particularly imposing figure. Tall and thin, with the composed demeanor of a university lecturer rather than a hardened revolutionary, the former editor of Pravda had built his reputation not through fiery speeches or political maneuvering but through careful analysis and ideological discipline. Many within the Party apparatus still saw him as an intellectual first and a politician second, and yet here he was, in the middle of the Moscow City Party Committee Headquarters walking towards the First Secretary's office. Shepilov couldn't help but sneer at the thought of the First Secretary. Yekaterina Furtseva. He still remembered how she ran to the telephones right after the traitor Khrushchev had been removed and if it hadn't been for the total communications blockade she may have doomed their entire operation to failure. ''Nothing more than Khrushchev's personal lapdog...'' Shepilov thought to himself. And yet that wasn't the reason the Presidium had come up with to remove her, not at all, it was due to something perhaps even more scandalous. Furtseva infamously had been the one to spearhead a defamation campaign against renowned Soviet actor Boris Babochkin due to his portrayal of a corrupt bureaucrat in the 1952 movie Shadows, and had gravely misused her influence to render the actor practically jobless. Due to this, and due to the recent criticism by Comrade Suslov, she was to be dismissed and later arrested, simple as that, all that Shepilov wanted and needed to know. He also couldn't help but feel that the portrayal of a corrupt bureaucrat might've hit a little too close to home to the First Secretary, as to him and to his Old Bolshevik companions, Furtseva was nothing more than a careerist and opportunist. \n\nWhen the door to the office opened, Yekaterina Furtseva greeted him with visible curiosity. ''Comrade Shepilov,'' she said, gesturing for him to sit. ''To what do I owe the pleasure of this visit?'' Shepilov then proceeded to explain to her that due to a unanimous decision by the Presidium, she was to be removed from her post due to her severe misconduct and that he wanted clarifications on behalf of the party as to her reasoning and side of the story. Furtseva's expression hardened almost immediately. ''Clarify the situation?'' she replied sharply. ''I have served the Party loyally for years. If certain comrades now wish to fabricate accusations in order to remove me, they should at least have the courage to say so openly.'' Furtseva began to heat up and what had started as a simple dismissal quickly turned into an all-out confrontation, which was for the most part one-sided. A scandal not too different from those caused by her weekend trips abroad in order to meet her lover in Yugoslavia. Shepilov sighed, preparing to make one final attempt at reason when the office door suddenly burst open and several KGB agents walked in. For a brief moment neither Shepilov nor Furtseva spoke. Then one of the officers stepped forward and addressed the First Secretary directly. ''Comrade Yekaterina Furtseva, by order of the Presidium of the Central Committee you are hereby relieved of your duties and placed under arrest pending investigation.''. What followed was a scene bordering on hysteria. Furtseva panicked and attempted to flee, screaming as the officers seized her by the arms and dragged her toward the door. Shepilov remained seated, his heart pounding from what had just transpired before him, watching silently as the First Secretary of Moscow was carried away, before sighing a sigh of relief. "
 Bulg.104.a:0 "At least it was finally done."

 Bulg.2.t:0 "Khrushchev’s fate"
 Bulg.2.desc:0 "''...as such, the court finds Comrade Khrushchev guilty of anti-soviet activity, undermining the unity of the Party, disregard for revolutionary legality and subservience to foreign powers, and in accordance with the laws of the USSR, sentences him to be shot.'' and for a moment, the courtroom stood quiet. Marshal Konstantin Rokossovsky as acting judge had sealed Khrushchev’s fate in a special session of the Supreme Court of the USSR, with no defense counsel, no right to appeal and completely unknown to anyone outside of the Central Committee and the KGB. After being demoted to Minister of Agriculture, Khrushchev was quickly investigated and arrested on the orders of the Central Committee to ensure he could not attempt another power grab in the future, similar to what had been done to Lavrentiy Beria almost 4 years prior. \n\nAnd then, Khrushchev stood up. He couldn't believe it, all this time plotting, reforms, filling cadres with loyalists, fooling Malenkov, De-Stalinization, all this meticulous planning, all for what? To be outmanouvered and now sentenced to death by a couple of old men that should've been cast aside and forgotten years ago? No, it couldn't be. He pounded his fists on the desk and began to yell, scream, cry, pointing fingers at everyone within his sight. ''You are scum, each and every one of you! Even after I denounced the despot Stalin for his crimes I still kept all of you within the Central Committee, none of you were tried for your countless repressions, not a single name was brought up! All your priviliges remained untouched! And this is how you repay me? I should have had all of you shot along with Beria when I had the chance!'' Rokossovsky and the Central Committee members present at the trial on the other hand didn't seem overly worried. \n\nBefore Rokossovsky stood the man who had disrespected, slandered and bastardized his Great Commander, made him out to be no better than Hitler himself and with that had destroyed the image of socialism worldwide. The ruptures with China and Albania, the whole Hungary fiasco and even the rise of revisionists in Poland which caused him to abandon his home, all of this was his fault, and deep down he loved the fact that it was his verdict that was going to send Khrushchev to the dustbin of history. ''The court has heard enough, guards, remove this man already.'' Rokossovsky declared. Khrushchev stared him down seething and it looked like he was about to get into a brawl with the Marshal himself before two MVD guards swiftly grabbed him by the arms and dragged him out of the courtroom. Khrushchev was then shoved into an armored KGB van and discretely taken to Lefortovo prison, where he immediately proceeded to be executed by firing squad. "
 Bulg.2.a:0 "And as such goes the final nail in the coffin of revisionism..."

 Bulg.3.t:0 "Vyacheslav Mikhailovich Molotov"
 Bulg.3.desc:0 "''By decision of the Presidium of the Central Committee and the Supreme Soviet of the Soviet Union, Comrade Vyacheslav M. Molotov has been appointed as Chairman of the Council of Ministers...'' Molotov looked at the Pravda newspaper infront of him as he took a sip of his morning coffee. Staring back at him was his own face, plastered large and clear on the front page, a portrait he remembered posing for perhaps a mere day prior. Yet it wasn't the first time he saw that very same headline paired with his face, not at all, albeit he was much younger back then. He had served as Premier before, but that was long ago. Before the war, before all the turmoil, and back then Stalin was alive and well... Molotov sighed. It had been a good while since they had succeeded in ousting Khrushchev from power and put a bullet in his head, and yet only now did Molotov find himself beginning to reflect on the past couple of years. \n\nThe death of Stalin, the coup, the speech at the 20th congress... He remembered how they all sat in silence as slander after slander was heaped at Stalin's grave, nobody spoke out, nobody had expected it. And yet in retrospect, how had they not foreseen this? All the reforms, the normalization with the West, the crushing of all of Stalin and Zhdanov's previous proposals, the only way the revisionists could go any further was certainly by first attacking Stalin. How could they all have been so blind? Molotov tightened his grip on the newspaper slightly before setting it down on the table. And yet, although they should've acted sooner, the job was done, the Union was saved, and all of the conspirators would be rooted out one by one, he would make sure of it. They had been temporarily blinded, but not anymore, and never again will the forces of capital and opportunism be given a single chance to undermine the advance of the working class. Molotov thought to himself, perhaps with a bit of naive optimism, that the best for the Union was yet to come and that perhaps he would be alive to see the workers of the world storm heaven itself. And as such, he would continue the path of Lenin and Stalin, the path that had once guided them through far greater trials than these. Molotov diverted his attention to a framed picture on his desk, one of him and Stalin back in the 30s at the Kuntsevo Dacha. Stalin had been his superior, his mentor, and most importantly, his best friend, and he would not allow his work and name to be tarnished. Not now, not ever. Molotov allowed himself to shed a singular tear at the memories that had started to flood his mind. Then, without another word, he turned and made his way toward the door."
 Bulg.3.a:0 "''Rest easy my dear friend, your sacrifices won't be in vain...''"

 Bulg.31.t:0 "Lazar Moiseevich Kaganovich"
 Bulg.31.desc:0 "Stacks of reports lay scattered across the desk as Lazar Kaganovich carefully reviewed the latest figures on industrial output and infrastructure development. The past few years had not been kind to the Soviet economy. Projects had been abandoned, priorities had shifted to reckless experimentation, most of which resulted in subpar results or outright failure, all for the sake of 'modernization' and 'efficiency'. Kaganovich frowned slightly as he turned the page. Too much had been disrupted, decentralized, especially with the absolute chaos that were the Sovnarkhozy. Kaganovich absolutely despised them. ''They achieve nothing but promote petty corruption and hoard more profits for the bureaucrats'' He thought to himself. \n\nJust then, the sound of a knock at the door broke the silence. A courier entered briefly, placing a sealed document on the desk before leaving without a word. Kaganovich opened it without hesitation. ''By decision of the Presidium of the Central Committee and the Supreme Soviet of the Soviet Union, Comrade Lazar M. Kaganovich is hereby appointed Deputy Chairman of the Council of Ministers...'' He read the line once, then set the paper aside. Kaganovich had rarely cared about titles, and this was not an exception. And yet, he couldn't help but feel a slight wave of optimism come over him. Perhaps, this way he could begin to unwind all of the mess that was the Khrushchevite economy. He had served as Second Secretary under Stalin, and hadn't they achieved numerous successes under his leadership? Indeed they had, and Kaganovich knew that although he was getting old, he was very well still capable of lifting up the Union once more. Production would be restored. Planning would be enforced. The Dictatorship of the Proletariat would function as it was meant to and all capitalist remnants and deviations that the 'reformers' clique had introduced would be eradicated by his own grip, for it was no mistake that they called him 'Iron Lazar'. Kaganovich rose from his chair and walked toward the large map mounted on the wall, his eyes scanning the vast expanse of the land of October. Railways, factories, industrial centers—all interconnected, all dependent on revolutionary discipline, coordination, and proper leadership by the vanguard party. There was much to rebuild. And this time, it would be done properly."
 Bulg.31.a:0 "Back to work, Comrades."

 Bulg.4.t:0 "Tbilisi, Georgian SSR"
 Bulg.4.desc:0 "In the months following the unrest of 1956, the streets of Tbilisi had settled into a careful kind of normalcy. And yet, now almost two years later, the memory of tanks storming the capital of the Georgian SSR remained bright in the minds of the population. They had all rallied that day, angry, resentful, calling for justice. How could they not have? Were they supposed to let these traitors slander not only Lenin's faithful pupil, but also Georgia's greatest son? Yet that was the past, and the citizens of the Paris of the East had now learned to reluctantly accept the new status quo. Certain things had disappeared in those days, among them a monument that had once stood prominently in the city. It was around that same monument where the first waves of student protests began, where thousands united in defiance of the clique in the Kremlin. Then the tanks came, hundreds were imprisoned, hundreds more mercilessly slaughtered, and the monument to the Great Commander was removed. Now, it stood there again. \n\nThe work had been done quickly, almost discreetly. By the time most people passed through the square that morning, it was already finished. A crowd gathered sooner than one might have expected, standing in loose clusters, speaking in low voices, though not as guarded as they once had been. ''So it's true,'' one man said, a faint note of satisfaction in his voice. ''They’ve brought him back.'' His companion nodded, eyes fixed on the towering figure before him. ''It was only a matter of time.'' Nearby, an older woman paused, her gaze lingering longer than most. ''They took him down so quickly,'' she said. ''As if people here would forget.'' No one had forgotten. A veteran stood near the front of the gathering, his posture straightening as he looked up, almost just as prideful as he had been a decade ago. There would be speeches later, explanations printed and distributed, the proper words restored along with the monument itself. But for now, none of that seemed necessary. As the crowd slowly began to disperse, many lingered just a moment longer than needed, casting one last glance before returning to their routines. And above them all, overlooking the city that had never truly turned away from him, stood the man of steel once more."
 Bulg.4.a:0 "Joseph Vissarionovich Stalin"

 Bulg.41.t:0 "The Commission of Historical Clarification Regarding J.V. Stalin"
 Bulg.41.desc:0 "Following the Death of Joseph Stalin and years of powerstruggle, Khrushchev eventually set up a commission to 'investigate' the arrests made during the late 1930s of certain candidates of the Central Committee elected at the 17th Congress. This commission would eventually come up with the infamous 'Pospelov Report', a document later used by Khrushchev at his infamous 'Secret Speech', and a document the Old Guard was very familiar with. Page after page of slanderous accusations against Stalin, blaming every single repression labled as 'injust' on his single personality and implying that Stalin himself personally ordered the fabrication of cases. Suslov and Malenkov were of course, not convinced of this at all. Khrushchev had been safe and sound in Ukraine, but Malenkov remembered the turbulent year of 1938. The Bloc of Rights and Trotskyites, the terrorist attacks, and later how the conspiracy within the NKVD was uprooted. The Central Committee itself was investigating and piecing together the conspiracies one by one, including Stalin, how could he be accused of orchestrating any of this? And so, the decision had been made. \n\nWithin days of the final victory over the Khrushchevites, a special commission had been assembled under the joint supervision of Suslov and Malenkov to investigate this report. Access was granted to materials long kept sealed: internal NKVD correspondence, interrogation records, Central Committee reports, and communications previously deemed too sensitive for review. For the first time since the 20th Congress, the full record lay open. As such, work began. Page by page, citation by citation, the claims of the Pospelov Report were examined against the original documents from which they had supposedly been derived. At first, the discrepancies appeared minor-an omission here, a conclusion drawn too broadly there. But the deeper they looked, the more consistent the pattern became. Excerpts lacking important context, deliberate misinterpretation of certain phrases, confessions having entire passages omitted that added important context and statements made by the report that outright contradicted their supposed reference materials. Malenkov closed one such file with a quiet exhale. ''Is there a single 'revelation' that this scoundrel hasn't lied about?'' He remarked, frustrated and tired. Suslov did not immediately respond. His eyes remained fixed on a document before him, his expression unchanged as he slowly adjusted his glasses. ''Take a look at this Georgy...'' He said, before gesturing toward the scattered files across the table. ''Half of these citations lead nowhere. References are made to documents that simply just don't exist in the archives.'' Malenkov's eyes widened as he flipped through a couple of pages. Suslov was correct. And they weren't absent by accident. Absent entirely." 
 Bulg.41.a:0 "The records had clearly been tampered with..."

 Bulg.42.t:0 "The Commission of Historical Clarification Regarding J.V. Stalin: Part 2"
 Bulg.42.desc:0 "For a moment, neither man spoke. \n\nThe silence stretched between them, broken only by the rustle of paper as Malenkov set down the file in his hands. Suslov removed his glasses entirely now, pressing two fingers against the bridge of his nose. ''This is going to implicate a lot of people...'' Suslov said finally. ''We can't expect all of this to just fly by quickly. This isn't even about Khrushchev anymore, he's long gone, and now...'' He paused, carefully thinking about his next words. ''Now we're going to have to seize quite a couple people for this mess.'' Malenkov nodded slowly, though his jaw remained tight. ''I propose we give them this. A full report to the Presidium. Not accusations—documents. Let them see what we have seen. And whatever comes after we'll tackle when the time comes.'' Suslov turned to face Malenkov, put his glasses back on and simply nodded. \n\nIt took another week to prepare. The commission's findings were compiled, cross-referenced, sealed into a single dossier: the fabricated citations, the archival gaps, the testimony attributed to men already dead by the dates assigned to it. Suslov insisted on restraint in the language—no editorializing, no rhetoric. Let the discrepancies speak for themselves. Malenkov was less patient, but he deferred. Although the old guard was now in the driver's seat, this document would still have to survive scrutiny from men who had every reason to doubt it, or to fear it. When it was finished, Suslov set the last copy down on the table between them and looked at Malenkov. Malenkov said nothing for a long moment. Then he reached for the telephone, and asked to be connected to Bulganin's office." 
 Bulg.42.a:0 "One more loose end tied up..."
 
 Bulg.5.t:0 "The Question of the Countryside"
 Bulg.5.desc:0 "Benediktov had prepared the figures himself, which told Molotov something about how seriously the Minister of Agriculture was taking the session. He did not editorialize, which was correct given the room, the damage was real but recoverable, he said. The collective infrastructure had not been dismantled, merely distorted. Procurement quotas decoupled from central planning, material incentives introduced at the kolkhoz level, the quiet erosion of the MTS system dressed up as modernization. A full return to centralized methods was feasible within two growing seasons, provided the transitional difficulties could be absorbed.\n\nMalenkov was the first to speak after him, and did not waste time on preamble. ''The market mechanisms go entirely. The MTS system returns. Centralized procurement returns. These are not points for discussion.'' He set down his pen. ''What is a point for discussion is whether we restore the system exactly as it stood, or whether we restore it and improve upon it as we said we would. There are technical developments since the war, mechanization at the brigade level, soil rotation methods, that are not ideologically compromised simply because Khrushchev's people happened to be aware of them.''\n\nBenediktov nodded carefully. ''Provided they are introduced through the correct planning channels and do not compromise the collective principle, the distinction holds.''\n\nNot everyone in the room agreed, and the debate that followed made that plain. A full rollback without qualification, some argued, was the only position consistent with a clean break from the revisionist line. Any selective retention of methods associated with the Khrushchev period, however technically defensible, sent the wrong signal to collective farm administrators who had spent a decade being taught to think in the wrong categories.\n\nMalenkov listened to this with visible patience and said, when it had run its course, that there was a difference between Khrushchev's methods and methods that Khrushchev had happened to use.\n\nMolotov, who had said nothing for the better part of an hour, closed the session with the brevity the room had come to expect from him. ''The collective farm system will be restored in full. That is settled.'' He looked around the table. ''What is before the Presidium is whether we restore what existed, or restore it and build something stronger on top of it. Both are defensible. Both have costs.''\n\nHe gathered his papers and rose.\n\n''We will have an answer by next week.''"
 Bulg.5.a:0 "A full restoration. No exceptions"
 Bulg.5.b:0 "There could be some room for innovation..."
 
 Bulg.51.t:0 "The Collective Farm System Restored"
 Bulg.51.desc:0 "Three years have passed since the decree restoring Leninist-Stalinist agricultural methods. The MTS network has been reestablished, centralized procurement is functioning, and collective farm output is returning to expected levels."
 Bulg.51.a:0 "The correct line bears fruit."

 Bulg.52.t:0 "Agricultural Innovation Proves Successful"
 Bulg.52.desc:0 "Three years have passed since the decree combining the restoration of Leninist-Stalinist agricultural methods with select modern technical developments. The experiment has proven successful. Output has exceeded expectations and the collective principle remains fully intact."
 Bulg.52.a:0 "A stronger foundation than before."

 Bulg.53.t:0 "Agricultural Innovation Falls Short"
 Bulg.53.desc:0 "Three years have passed since the decree combining the restoration of Leninist-Stalinist agricultural methods with select modern technical developments. The results have been disappointing. The introduction of experimental methods has created administrative confusion and output has failed to meet projected targets."
 Bulg.53.a:0 "We will correct course."

 Bulg.6.t:0 "Cleaning the House"
 Bulg.6.desc:0 "The reports had been arriving for three weeks now, each one thicker than the last. Molotov had taken to reading them in the early morning, before the business of the Council of Ministers consumed the rest of his day, not because the hour suited him, but because some documents demanded to be read without interruption, and these were among them. Shelepin arrived precisely at half past eight, leather folder under his arm, with the expression of a man who had learned quickly that the seasoned Old Bolshevik preferred brevity to theatrics. He was young for the position, Molotov had even said so when the appointment was first proposed, but he had moved through the regional apparatus with a speed and precision the older members of the Presidium had quietly found impressive, and especially considering his clean handling of the so-called Serov question, he had proven that he was fit for the job. \n\n''Leningrad first'' Molotov said. Shelepin opened the folder. ''Kozlov has been removed from the regional committee. Fourteen of his people in the Gorkom gone as of this morning.'' Molotov nodded slowly, and for a brief moment his mind went elsewhere—to another set of regional reports, another morning not entirely unlike this one, twenty years prior, when the rightist networks embedded in the party's regional structures had first begun to be properly accounted for. That had been a messier affair, necessarily so, the conspiracy broader and the methods of rooting it out blunter than anyone would have preferred. This was different. Controlled. Deliberate. The kind of work that left records clean enough to defend before any tribunal. ''Total figures?'' Molotov said, setting the file down. ''Two hundred and seven removals confirmed across all regions'' Shelepin replied. ''Sixty one pending review. Eleven referred for further investigation by the commission.'' Shelepin's answer came without hesitation. ''Deeper than we initially thought, the appointments run several layers down in the worst affected regions. These regions were built up properly from the ground up.'' For a moment neither of them spoke. Molotov turned the last file over in his hands, not reading it, simply holding it. "
 Bulg.6.a:0 "Then we rebuild them properly, from the ground up"

 Bulg.7.t:0 "The Case of Nikita Sergeyevich Khrushchev"
 Bulg.7.desc:0 "The transport logs from Kiev lay open between Molotov and Kaganovich, alongside a stack of requisition orders bearing Khrushchev's own signature, dated through the autumn of 1938. Molotov had been turning the same page over for several minutes, comparing it against an NKVD circular from earlier that year, when Kaganovich finally broke the silence. ''That bastard was working with Yezhov, that's for sure.'' Kaganovich said. ''The question is whether he was working with him out of necessity, or whether the two of them were working together in an attempt to wreck and destroy our Proletarian Dictatorship! I should have never had his back, I knew he was a Trotskyite, I knew-'' \n\nMolotov set the page down and raised his brow, silently signaling to Kaganovich that he should lower his tone, as he scanned the pages infront of him. He remembered it all vividly, the NKVD quotas during the purges and then... And then how Khrushchev once wanted to increase them from 5,000 to 8,500. All to category one. All to be sentenced to death. ''Look at the timing.'' he said. ''The campaign against the Bloc of Rights and Trotskyites was already well underway when Khrushchev arrived in Kiev. Real conspirators, genuine wreckers and saboteurs. But the numbers out of Ukraine exceed anything justified by the actual scale of the conspiracy uncovered there. Either Khrushchev really believed every district committee in the republic had been compromised, which even for his standards is just absurd, or he found all of this useful for purposes of his own. And I'm more inclined to believe the latter.'' Kaganovich said nothing and instead shuffled through the documents before him before selecting a couple and moving to show them over to Molotov. ''And what of Uspensky and Kvasov? Men he worked hand in hand with in their own little troika, misteriously purged, while he himself remains untouched!'' Kaganovich blurted out, visibly frustrated. Neither of them said anything to eachother for a while. They understood exactly what they were implying, and as such, they went back to work. \n\nIt was then Kaganovich who finally turned the conversation toward the harder subject, the one neither of them had yet committed to paper. ''And then there is March of '53...'' Molotov's expression did not change, though his hands stilled on the desk. ''Go on.'' Kaganovich cleared his throat. ''Beria and Khrushchev were both informed within hours of the stroke. Beria's own account places him at the dacha that night. And yet proper medical attention was not summoned for nearly twelve hours.'' Kaganovich let the figure sit in the air between them. ''Twelve hours, Vyacheslav. For our great Comrade Stalin... I have read every justification offered at the time—that no one wished to disturb him, that the guards assumed he was merely sleeping. None of it accounts for twelve hours.'' Molotov stared ahead emptily, his mind beginning to race at the thought that perhaps, his best friend and mentor had been unceremoniously left to die. And he wasn't there to do anything about it. He then finally spoke up. ''You are suggesting deliberation,'' Molotov said. ''I am suggesting that a delay of that length does not happen by accident among men who understood exactly who was lying on that floor'' Kaganovich's voice had gone low. Molotov said nothing for a long moment, his gaze fixed on the requisition orders still spread across the desk. Then, finally, he drew a fresh sheet of paper toward himself and began, carefully, to write." 
 Bulg.7.a:0 "''Then that is where the final section of our report will begin.''"

 Bulg_trips.1.t:0 "Tirana, [GetDateText]"
 Bulg_trips.1.desc:0 "The Albanian capital received the Soviet delegation warmly, without the excess of a state visit arranged under obligation, and without the anxiety that had characterized every Soviet-Albanian exchange since the 20th Congress. Hoxha met them at the steps of the Palace of Brigades himself and embraced Molotov before the officials had time to arrange themselves properly. It was an unscripted moment. Both men knew it. The formal session lasted two hours. Hoxha spoke without the careful evasion that had defined Albanian communications during the Khrushchev years. In its place was something Molotov had not heard from an allied lead in some years: a plain accounting of what Albania had preserved through the long years of revisionist pressure, and what its defeat meant for the international proletarian movement as a whole. \n\n ''The revisionists understood that if Moscow fell to their line, the rest would follow in time'' Hoxha said. ''What they did not understand is that some would not follow regardless.'' ''And these men have now answered for their treachery before the Vanguard Party. Molotov replied. ''Before history itself'' Hoxha corrected quietly. ''Needless to say us Albanians glance at these recent developments in the Soviet Union with the great admiration'' \n\nThe talks continued for several more hours and the sun had long set when the delegation finally rose to leave. Molotov couldn't help but feel certain admiration for Hoxha. A small country such as Albania had resisted the onslaught of not only the Yugoslav revisionists, but also of the Khrushchevites recently, and yet had remained firmly on the course of Marxism-Leninism. Certainly, years prior, he would have never imagined that Albania would be the socialist state that he would come to trust the most. Nevertheless, he was glad that relations with them had been restored, and things were slowly getting back on the right path."
 Bulg_trips.1.a:0 "Glory to you, Comrade Enver!"

 Bulg_trips.2.t:0 "Beijing, [GetDateText]"
 Bulg_trips.2.desc:0 "The Chinese capital received them well, not with the unburdened warmth of Tirana, but with the particular relief of men who had watched something go badly wrong and had now been given reason to believe it was being corrected. Molotov had been to Beijing before, under different circumstances, and the difference in atmosphere was not subtle. \n\nZhou Enlai was the first to meet the Soviet delegation. He was as Molotov remembered him: meticulous, unhurried, and the opening exchanges moved past formalities quickly. The CPC had never wanted the rift, had said so repeatedly and at considerable cost to its own position among parties that had swallowed the Khrushchev line. That restraint deserved acknowledgment, and Molotov offered it plainly. ''The 20th Congress placed fraternal parties in an impossible position,'' Zhou said. ''We raised our concerns through the correct channels. We were not heard.'' He paused. ''Nevertheless we are glad that the Vanguard party leading the World Communist Movement has solved its internal affaris.'' \n\nMao received Molotov on the second day, way more casually, as was his habit.  He spoke of the Secret Speech with undisguised disdain, not only for Stalin, but for what the Speech entailed. He had known, he said, from the moment of the Secret Speech, that it would not stand. A party that denounced its own history in open session was a party that had lost confidence in itself, and a party without confidence was of limited use to anyone. Molotov did not disagree, and said so plainly. \n\n''Then we understand one another'' Mao said, with the satisfaction of a man who had been waiting quite a while for that very moment. As such, the delegation departed shortly after, with a joint-communiqué in the making. On the flight back to  Moscow, Molotov sat quietly with his notes and did not write anything for a long while. The relationship would take time to repair. But it was, at least, moving in the right direction."
 Bulg_trips.2.a:0 "A step taken together, carefully."

 Bulg.9.t:0 "Bulganin's Resignation"
 Bulg.9.desc:0 "Bulganin had told no one in advance, which was itself a kind of statement. There had been no negotiation, no quiet lobbying from the Presidium, no period of visible decline that might have made the announcement feel like a conclusion reached by the central committee. He had simply called Molotov to his office on a grey Tuesday morning, poured two glasses without asking, and said what he had to say. \n\n''The consolidation is finished,'' he said ''The commission has done its work. The Congress is prepared. What comes next requires a different kind of man, Vyacheslav Mikhailovich, and we both know it.'' Molotov did not immediately respond. He had known this conversation was coming, had known it, in some form, since the night the Khrushchevites had fallen, but knowing a thing and sitting across from it were not the same. ''The Presidium will need to be consulted'' He finally said.''The Presidium,'' Bulganin replied, with a faint and tired smile, ''has already been consulted. They are waiting on us.'' \n\nThe formal session that afternoon was brief. Bulganin addressed the Presidium without notes, thanked no one effusively, and made no appeal to history. He had been asked to hold things together during a difficult period, he said, and believed he had done so to the best of his ability. What the Party required now was continuity of a deeper kind—not merely stability, but direction, and the ideological clarity to sustain it. He recommended Comrade Molotov without elaboration, as though the recommendation were self-evident, which in that room it largely was. The vote was unanimous. Molotov was now General Secretary of the Communist Party of the Soviet Union."
 Bulg.9.a:0 "The mandate passes to steadier hands..."


#Bulganin Decisions

 sov_khrushchev_fate:0 "The Khrushchev Question"
 sov_khrushchev_fate_desc:0 "\n\n\n\n\n\n£Khrushchevite_Purge\n\n\n\n\n\n\n With Khrushchev demoted to Minister of Agriculture and kicked out of the Presidium, a good chunk of the struggle against revisionism has been won. However, him and his cronies still have a significant amount of influence within the party and if not dealt with effectively, we risk the chance of another powergrab. We must liquidate Khrushchev and the most powerful of his subordinates before they can attempt to hijack the land of October once more."

 khrushchev_fate_mission:0 "Seal Khrushchev's fate"
 khrushchev_fate_mission_desc:0 "While we are attempting to rectify half a decade's worth of revisionism, Khrushchev is undoubtedly scheming behind our backs to attempt another powergrab. We must swiftly eliminate all his links within the upper bodies of government and then execute the traitor at once."

 sov_arrest_serov:0 "Arrest Ivan Serov"
 sov_arrest_serov_desc:0 "Serov as Chairman of the KGB attempted to organize special flights to take Khrushchevite provincial Central Committee members to Moscow and prevent the revisonist traitor's removal. It is clear that he is a wrecker and a serious threat and must be repressed as soon as possible." 

 sov_arrest_furtseva:0 "Arrest Yekaterina Furtseva"
 sov_arrest_furtseva_desc:0 "Furtseva was the one to alert Serov of our attempt to remove Khrushchev, which almost condemned our fight against revisionism to utter failure. Khrushchev would undoubtedly rely on her in any future powergrab which makes her a liability that must be taken care of. However, before we can do such a move we must have Suslov on our side." 

 sov_sideline_zhukov:0 "Sideline Georgy Zhukov"
 sov_sideline_zhukov_desc:0 "While he's not an ideological Khrushchevite, Marshal Zhukov is blinded by feelings of grandeur and pride and could be a pawn for the revisionists if they're able to flatter his ego and promise him greater influence. To prevent the army from becoming a tool of the revisionists, Zhukov will be sent on an extended inspection of the armies of the Warsaw Pact, keeping him far from Moscow and the bodies of government." 

 sov_assure_suslov:0 "Secure Suslov's support"
 sov_assure_suslov_desc:0 "Mikhail Suslov, although once rumored to be a worthy successor to Comrade Zhdanov, has become a political chameleon and is in no way a reliable political ally as demonstrated by his support for Khrushchev's blasphemous 'Secret Speech'. However, his position as Senior Secretary of Ideology of the CPSU mustn't be underestimated. It is for this reason that we must secure his support, albeit temporarily, and make sure he isn't used by Khrushchev once more. Suslov's own opportunism will be dealt with at a later time." 
 suslov_assured_tt:0 "Suslov's support has been secured."