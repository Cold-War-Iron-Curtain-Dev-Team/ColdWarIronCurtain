 SOV_Chairman_Malenkov:0 "Chairman Malenkov"
 SOV_Chairman_Malenkov_desc:0 "Georgy Malenkov runs the Council of Ministers the way he ran Comrade Stalin's secretariat: quietly, competently, and with an eye on the queue outside the food shops. The New Course costs the plan a little, and the population is the better for it."
 SOV_Gosplan_Bulganin:0 "Gosplan Chairman Bulganin"
 SOV_Gosplan_Bulganin_desc:0 "Nikolai Bulganin has taken the State Planning Committee in hand. Budgets are audited, targets are met, and not a rouble is spent twice - though the construction crews complain that nothing now begins before the paperwork is complete."
 SOV_Deputy_Chairman_Shepilov:0 "Deputy Chairman Shepilov"
 SOV_Deputy_Chairman_Shepilov_desc:0 "Dmitry Shepilov brings his pen, his connections and his reputation as the brightest mind in the Presidium to the Council of Ministers. The line is defended in print as well as in speech, though the reformist whispers of his past have not quite stopped."
 SOV_Shelepin_KGB:0 "Shelepin's KGB"
 SOV_Shelepin_KGB_desc:0 "Alexander Shelepin has the Committee for State Security exactly where he wants it: reading the correspondence of every embassy in Moscow and every committee in the provinces. The work is thorough, and it makes his colleagues nervous."
 SOV_Kruglov_MVD:0 "Kruglov's MVD"
 SOV_Kruglov_MVD_desc:0 "Sergei Kruglov has been restored to command of the Ministry of Internal Affairs. Interior troops garrison the railways and the borders, reinforcements move at his order - and the ministry's appetite for supply lorries has grown accordingly."
 SOV_Anti_Revisionism_Theory:0 "Theory of Anti-Revisionism"
 SOV_Anti_Revisionism_Theory_desc:0 "Marxism-Leninism now has a systematic account of modern revisionism: where it comes from, whose class interest it serves, and why it reappears in every generation. Cadres study it, fraternal parties request it, and no deviation survives a session of criticism."
 
