  ##SEA
  State_of_East_Indonesia: "State of East Indonesia"
  State_of_East_Indonesia_desc: "£Faction_State_of_East_Indonesia_pic\n\n\n\n\n\n\n\n\nThe State of East Indonesia was formed in 1946, marking a significant moment in the nation's post-colonial history. Initially, the region was temporarily referred to as the State of the Great East for a brief period of just 3 days.\n\nInterestingly, the locals embraced a tongue-in-cheek reference for the State of East Indonesia, humorously nicknaming it "Negara Ikoet Toean." Despite such origins, the Republic of Indonesia recognized East Indonesia as one of the constituent states within the broader framework of the United States of Indonesia."
  Central_Government_of_the_Republic_of_Indonesia: "Central Government of the [INO.GetName]"
  Central_Government_of_the_Republic_of_Indonesia_desc: ""
  
  french_indochina_faction: "French Indochina"
  French_Indochina_Faction: "French Indochina Command"
  French_Indochina_Faction_desc: "£Faction_State_of_Vietnam_pic\n\n\n\n\n\n\n\n\n§YFrench Indochina§! is a theatre-coordination structure led by the §CFrench Expeditionary Corps§!. The expeditionary command directly controls the northern Tai, Nung, Muong, and Tho crown domains, while the §YState of Vietnam§! directs the southern command and its own associated territories.\n\nThe two commands share strategic alignment, access, and a common anti-Viet Minh purpose, but they do not form a single war. Northern crown-domain campaigns cannot summon Saigon against Hanoi, and the southern war cannot draw the northern command into the fighting by an ordinary faction call. Paris retains political influence and supplies the corps, but is kept outside this command chain."
  Viet_Minh_Faction: "Viet Minh"
  Viet_Minh_Faction_desc: "£Faction_Viet_Minh_pic\n\n\n\n\n\n\n\n\nThe §YViet Minh§! faction unites Hanoi's government with the §Rsouthern Viet Minh resistance§! under Ho Chi Minh's political leadership and the Workers' Party of Vietnam. Distance and the partitioned battlefield leave the southern command operationally distinct, but it still receives direction, supplies, and cadres from the north.\n\nThis common front does not turn every local operation into one general war. Saigon's campaign against the southern resistance remains separate from Hanoi's northern campaigns and the Pathet Lao offensive; ordinary faction calls are suppressed so only the belligerents named by each operation enter it."
  Pathet_Lao_Faction: "Pathet Lao"
  Pathet_Lao_Faction_desc: "£Faction_Viet_Minh_pic\n\n\n\n\n\n\n\n\nThe §YPathet Lao§! are a fraternal movement of the §RViet Minh§! rather than a member of its faction. Formed out of the Lao Issara resistance and led by Souphanouvong and Kaysone Phomvihane, they share Hanoi's revolutionary programme and its enmity toward the §CFrench Expeditionary Corps§!, and they depend on the north for cadres, weapons, training, and sanctuary along the mountain frontier.\n\nThat dependence makes the movement a §Rjunior partner in practice§!, but not a province of Hanoi. Its war is a Lao war, fought against the royal government in Vientiane and its French backers, with its own base areas in Sam Neua and Phongsaly and its own claim to speak for Laos."

  State_of_Vietnam_Faction: "State of Vietnam"
  State_of_Vietnam_Faction_desc: "£Faction_State_of_Vietnam_pic\n\n\n\n\n\n\n\n\nThe §YQuoc-Gia§! southern command is a broad, fragmented coalition aligned with the §YState of Vietnam§!, including Cochinchina, the Montagnard crown domain, sect armies, and other forces cooperating against the §RViet Minh§!. It sits within the wider §CFrench Indochina§! command but remains politically and operationally distinct from CEFEO's northern crown domains.\n\nAt its core stands §CBao Dai§!'s government, challenged by movements led by §GNgo Dinh Diem§! and §GNgo Dinh Nhu§! that reject both French domination and communism. Powerful Hoa Hao, Cao Dai, and local military organizations further divide authority. The southern command therefore fights its own war against the southern resistance; it is not automatically committed to CEFEO's northern war against Hanoi."
  
  Karen_National_Union_Faction: "Karen National Union"
  Karen_National_Union_Faction_desc: "£Faction_Karen_National_Union_pic\n\n\n\n\n\n\n\n\nThe Karen National Union (KNU) is a political organization allied with an armed wing, the Karen National Defence Organisation / Karen National Liberation Army (KNDO/KNLA), representing the Karen people of Myanmar.\n\nAt the time of Burma's independence from Britain in 1948, relations between the Karen community and the Bamar-dominated central government were already highly strained. Within the Karen population, opinions were divided: some leaders initially sought coexistence and autonomy within a federal Burma, while others pushed for full independence. Many Karen soldiers had previously served in the British Burma forces during the colonial period and, following rising ethnic tensions and political exclusion, defected en masse to the KNDO in 1949.\n\nThe situation escalated in early 1949 when the Burmese government arrested General Smith Dun, the ethnically Karen Commander-in-Chief of the Burmese armed forces, and replaced him with the Bamar nationalist Ne Win. This move was widely perceived by the Karen as a clear signal of Burmanization of the state and the marginalization of ethnic minorities, accelerating the slide into open conflict.\n\nDespite Burmese counteroffensives, the KNU retained control over large areas of the countryside and continued the armed struggle through sustained offensives against government forces. The core objectives of the Karen National Union include self-determination, freedom from domination by the Bamar-led Burmese state, and international recognition of an autonomous or independent Karen State."
  Arakan_State_Alliance_Faction: "Arakan State Alliance"
  Arakan_State_Alliance_Faction_desc: "£Faction_Arakan_State_Alliance_pic\n\n\n\n\n\n\n\n\nThe Arakan State Alliance emerged as a tactical and ideological partnership between Thakin Soe's Red Flag Communist Party of Burma and Rakhine separatist rebels led by the nationalist monk U Seinda.\n\nThe Red Flag Communist Party—distinguished from the mainstream “White Flag” Communist Party by the red armbands worn by its cadres—rejected the popular front strategy pursued by the Anti-Fascist People's Freedom League. Instead of cooperating with non-communist nationalist forces, Thakin Soe's faction advocated immediate and uncompromising armed struggle, first against British colonial rule and later against the Burman-dominated central government of U Nu, which it denounced as bourgeois and counter-revolutionary.\n\nIn Arakan State, this revolutionary line converged with Rakhine nationalism. U Seinda, a prominent monk and separatist leader, sought the complete secession of Arakan from Burma and the establishment of an independent Rakhine republic. His vision combined Buddhist moral authority with Marxist revolutionary principles, framing the struggle as both a class war and a national liberation movement against what he viewed as Bamar political, cultural, and economic domination.\n\nThe alliance was thus one of convenience rather than full ideological unity."
