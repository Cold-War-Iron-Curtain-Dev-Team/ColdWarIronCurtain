 ##Generic
 Generic_Faction: "Member of the [This.GetFactionName]"
 Generic_Faction_desc: "[This.GetNameDefCap] is a member of the [This.GetFactionName]. They are in a faction, which means that if any of its members were to be attacked or otherwise have entered a war, members of the alliance will join their war in aid for their comrade. They can act as a unison in the world stage, and can project their influence as a result of their collective power. It may also not be limited to a military pact, but it can expand on many fronts, such as economic co-operation and other forms of collaboration that mutually benefits its members."
 
 ##NATO
 Leader_of_the_Free_World: "Leader of the Free World"
 Leader_of_the_Free_World_desc: "As the founding pillar and most powerful member of the North Atlantic Treaty Organization, the United States of America stands as the backbone of NATO, shaping its direction, capabilities, and strategic posture from its inception to the present day. Washington’s political will, military might, and economic resources are not just integral—they are indispensable. Without American commitment, NATO would be a shell of its current form; it was the United States that rallied war-weary Western nations into a collective defense pact at the dawn of the Cold War, and it is the United States that continues to guarantee its deterrence today.\n\nBeyond mere membership, the U.S. plays a central leadership role—providing the majority of NATO’s military capabilities, hosting key command structures, and driving its operational priorities. From the nuclear umbrella that deters existential threats, to high-end military logistics, surveillance, intelligence, and rapid deployment capacity, America's contributions dwarf those of any other ally."
 NATO_Member: "Member States of NATO"
 Close_NATO_Ally: "Non-NATO Major Allies"
 US_Ally_Korea: "United States Partner in Asia: Republic of Korea"
 ##Warsaw Pact
 Leader_of_the_Socialist_Nations: "Home of the Revolution"
 Leader_of_the_Socialist_Nations_desc: "It was on this soil that the world witnessed the birth of the first Socialist Revolution—a moment that shattered the old imperial order and gave rise to a workers' state unlike any before. The Soviet Union emerged not merely as a new nation, but as a symbol of revolutionary defiance, having cast off centuries of Tsarist rule in favor of a system that promised power to the proletariat. When the world faced the scourge of fascism, it was the Red Army that bore the heaviest burden, breaking the Nazi war machine and marching triumphantly into Berlin. That victory was not just military, it was ideological.\n\nIn the years that followed, millions across the globe looked to the Soviet Union as the vanguard of the international socialist cause. From the factories of Europe to the colonies yearning for independence, the USSR is seen as a beacon of anti-imperialism and social transformation. It carried the torch of Marx and Lenin, and many believed it would one day lead humanity into a new era, where capital no longer ruled, and the workers of the world stood united under the red banner of Communism."
 Warsaw_Treaty_Organization_member: "Satellite States of the Soviet Union"
 Socialist_oriented_countries: "Socialist Oriented States"
 Close_non_WTO_ally: "Close Allies of Soviet Union"