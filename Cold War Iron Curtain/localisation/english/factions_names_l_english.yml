  ##Generic
  Generic_Faction: "Member of the [This.GetFactionName]"
  Generic_Faction_desc: "[This.GetNameDefCap] is a member of the [This.GetFactionName]. They are in a faction, which means that if any of its members were to be attacked or otherwise have entered a war, members of the alliance will join their war in aid for their comrade. They can act as a unison in the world stage, and can project their influence as a result of their collective power. It may also not be limited to a military pact, but it can expand on many fronts, such as economic co-operation and other forms of collaboration that mutually benefits its members."
 
  ##NATO
  Leader_of_the_Free_World: "Leader of the Free World"
  Leader_of_the_Free_World_desc: "£Faction_Leader_of_the_Free_World_pic\n\n\n\n\n\n\n\n\nAs the founding pillar and most powerful member of the North Atlantic Treaty Organization, the United States of America stands as the backbone of NATO, shaping its direction, capabilities, and strategic posture from its inception to the present day. Washington's political will, military might, and economic resources are not just integral—they are indispensable. Without American commitment, NATO would be a shell of its current form; it was the United States that rallied war-weary Western nations into a collective defense pact at the dawn of the Cold War, and it is the United States that continues to guarantee its deterrence today.\n\nBeyond mere membership, the U.S. plays a central leadership role—providing the majority of NATO's military capabilities, hosting key command structures, and driving its operational priorities. From the nuclear umbrella that deters existential threats, to high-end military logistics, surveillance, intelligence, and rapid deployment capacity, America's contributions dwarf those of any other ally."
  NATO_Member: "Member States of NATO"
  NATO_Member_desc: "£Faction_NATO_Member_States_pic\n\n\n\n\n\n\n\n\nRooted in the Atlantic Charter between the United States and the United Kingdom, the North Atlantic Treaty Organization is a collective defense organization established to counter the Soviet-led Eastern Bloc. Initially founded in response to the possibility of a third German aggression under the Western Union, NATO officially came into effect following the signing of the North Atlantic Treaty on 4 April 1949.\n\n§CAnimus in consulendo liber.§!"
  Close_NATO_Ally: "Major Non-NATO Ally"
  Close_NATO_Ally_desc: "NATO, by design, primarily focuses on the defense of the North Atlantic region, as its name implies. However, the alliance has extended its connections to the broader world, providing assistance and support to various nations. Key countries that are influential allies in the fight against Communism have received NATO's backing, which underscores the organization's commitment to preserving security and sovereignty."
  US_Ally_Korea: "United States Partner in Asia: §C[KOR.GetNameWithFlag]§!"
  US_Ally_Korea_desc: "No one ever thought of Korea being divided, certainly not the Koreans themselves, but the Americans? Oh, they do.\n\nSouth Korea, formally the Republic of Korea, was born following the liberation of the Korean peninsula by the Soviet and American forces in 1945. Most officials in Korea are members of the Provisional Government of the Republic of Korea, making them seem legitimate to the Soviet backed North.\n\nWith Japan, the Republic of Korea can be described as a major ally and partner of the United States in the Cold War."
  US_Ally_Japan: "United States Partner in Asia: §C[JAP.GetNameWithFlag]§!"
  US_Ally_Japan_desc: "£Faction_US_Ally_Japan_Pic\n\n\n\n\n\n\n\n\nAs Ironic as it sounds to people several years ago, Japan, which was then viewed as an enemy of the West, is now regarded as one of the major allies of the new emerging front in the Cold War.\n\nJapan has now been under the watchful eye of the United States. The United States saved Japan from division; had the invasion gone ahead, Japan would have been divided like Germany, yet they weren't.\n\nFor this reason alone, Japan is seen as a great influence in Asia, particularly to detest the Soviet Far East and other communist dictatorships in East Asia."
  NATO_Partnership_for_Peace: "Close Allies of United States"
  NATO_Partnership_for_Peace_desc: ""

  ##Warsaw Pact
  Leader_of_the_Socialist_Nations: "Home of the Revolution"
  Leader_of_the_Socialist_Nations_desc: "£Faction_Home_of_the_Revolution_pic\n\n\n\n\n\n\n\n\nIt was on this soil that the world witnessed the birth of the first Socialist Revolution—a moment that shattered the old imperial order and gave rise to a workers' state unlike any before. The Soviet Union emerged not merely as a new nation, but as a symbol of revolutionary defiance, having cast off centuries of Tsarist rule in favor of a system that promised power to the proletariat. When the world faced the scourge of fascism, it was the Red Army that bore the heaviest burden, breaking the Nazi war machine and marching triumphantly into Berlin. That victory was not just military, it was ideological.\n\nIn the years that followed, millions across the globe looked to the Soviet Union as the vanguard of the international socialist cause. From the factories of Europe to the colonies yearning for independence, the USSR is seen as a beacon of anti-imperialism and social transformation. It carried the torch of Marx and Lenin, and many believed it would one day lead humanity into a new era, where capital no longer ruled, and the workers of the world stood united under the red banner of Communism."
  Warsaw_Treaty_Organization_member: "Eastern Bloc Socialist States"
  Warsaw_Treaty_Organization_member_desc: "£Faction_Warsaw_Treaty_Organization_Member_pic\n\n\n\n\n\n\n\n\nThe Member States of [SOV.GetFactionName] are often regarded as nations that, on paper, claim independence. However, in reality, they are politically and economically under the significant control of the Soviet Union. This situation emerged in the aftermath of World War II when the Soviet Union established these states to create a buffer zone against potential foreign invasions.\n\nMost of these states lack a genuine independent political framework and operate with limited autonomy. Their governments are heavily influenced or directly overseen by Soviet leadership, resulting in policies and decisions that align closely with Soviet interests. Economically, these nations rely almost entirely on the Soviet Union for resources, financial support, and trade connections, which reinforces their status as puppet states.\n\nThis arrangement leads to a general lack of sovereignty, as the internal affairs of these countries are largely dictated by the priorities of the Soviet state. Consequently, the people in these regions often find themselves without a voice in their governance, as the political apparatus is structured to support Soviet influence rather than reflect the will of the local populace."
  Socialist_oriented_countries: "States of Socialist Orientation"
  Socialist_oriented_countries_desc: ""
  Close_non_WTO_ally: "People's Democratic States"
  Close_non_WTO_ally: ""

  ##SEA
  State_of_East_Indonesia: "State of East Indonesia"
  State_of_East_Indonesia_desc: "£Faction_State_of_East_Indonesia_pic\n\n\n\n\n\n\n\n\nThe State of East Indonesia was formed in 1946, marking a significant moment in the nation's post-colonial history. Initially, the region was temporarily referred to as the State of the Great East for a brief period of just 3 days.\n\nInterestingly, the locals embraced a tongue-in-cheek reference for the State of East Indonesia, humorously nicknaming it "Negara Ikoet Toean." Despite such origins, the Republic of Indonesia recognized East Indonesia as one of the constituent states within the broader framework of the United States of Indonesia."
  Central_Government_of_the_Republic_of_Indonesia: "Central Government of the [INO.GetName]"
  Central_Government_of_the_Republic_of_Indonesia_desc: ""

  ##VIETNAM##
  Viet_Minh_Faction: "Viet Minh"
  Viet_Minh_Faction_desc: "£Faction_Viet_Minh_pic\n\n\n\n\n\n\n\n\nThe factions belonging to the §YViet Minh§!, including North Vietnam and the §RNational Liberation Front of South Vietnam§!, are often regarded as movements seeking national liberation. However, in practice, both operate under a highly centralised political and military structure directed from Hanoi.\n\nFollowing World War II, the §YViet Minh§! emerged as a revolutionary force aiming to remove foreign influence and unify Vietnam. While presenting itself as a broad coalition, most of its member groups possess only limited autonomy, with key decisions shaped by the leadership of Ho Chi Minh and the Workers' Party of Vietnam.\n\nFor the NLF, this dependency is even more apparent. Its political programme, military operations, and supply networks are closely tied to the guidance and logistical support provided by the North, making it §Rfunctionally subordinate to Hanoi's strategic objectives§!.\n\nAs a result, neither North Vietnam nor the NLF functions as a fully independent actor. Their internal affairs, ideological messaging, and wartime priorities are directed according to the overarching goals of the §YViet Minh revolutionary movement§!, leaving limited room for local political diversity or autonomous decision-making."
  
  State_of_Vietnam_Faction: "State of Vietnam"
  State_of_Vietnam_Faction_desc: "£Faction_State_of_Vietnam_pic\n\n\n\n\n\n\n\n\nThe §YQuoc-Gia§! factions form a broad, fragmented coalition of political, military, and social forces aligned with the §YQuoc-Gia§! government after World War II, including §CBao-Dai§!'s central government in Phu-xuan and various ethnic-based local governments that cooperated with §CFrance§! to combat the §RViet-Minh§!.\n\nAfter World War II, §CFrance§! reorganized anti-§RViet-Minh§! elements into \"nationalistic and patriotic\" forces, constructing a Vietnamese political framework to combat communism within a §CFrench-led order§!. Yet the §YQuoc-Gia§! label masked deep internal divisions. At the core stood §CBao-Dai§!'s government, which sought to defeat §RHo-chi-Minh§! and restore pre-war order, but its legitimacy was challenged by new movements led by §GNgo-Dinh-Diem§! and §GNgo-Dinh-Nhu§!, who promoted a revolutionary nationalist ideology rejecting both French influence and communism.\n\nPowerful religious-sectarian armies—the §YHoa-Hao§!, §YCao-Dai§!, and §YUMDC forces§!—further complicated matters, prioritizing religious authority over national unity and cooperating only when it served their interests. §CBao-Dai's§! divisive leadership, marked by detachment, indulgence, and scandals in Saigon, weakened confidence and intensified rivalries. South Vietnam's future—with or without §CBao-Dai§! and §CFrance§!—remained an open question, to be decided by these internal struggles as much as by the war against the §RViet-Minh§!."