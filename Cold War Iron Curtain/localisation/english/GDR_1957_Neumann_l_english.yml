l_english: 

 GDR_First_Secretary_Neumann: "First Secretary Neumann"
 GDR_First_Secretary_Neumann_desc: "Amidst the chaos, Alfred Neumann has emerged as our next First Secretary. Let us hope he can restore order quickly."
 GDR_Re_Appoint_Hoenecker_to_FDJ_Leadership: "Re-Appoint Hoenecker to FDJ Leadership"
 GDR_Re_Appoint_Hoenecker_to_FDJ_Leadership_desc: "Erich Honecker has done great work as leader of the Free German Youth; he should be reinstated immediately."
 GDR_Undoing_the_Damage: "Undoing the Damage"
 GDR_Undoing_the_Damage_desc: "The Republic is on the brink. If we do not take the appropriate measures to undo the damage, everything we have built over the last decade will crumble."
 GDR_Keep_Hoeneker_Sidelined: "Keep Hoeneker Sidelined"
 GDR_Keep_Hoeneker_Sidelined_desc: "Erich Honecker's dismissal from the Free German Youth presents us with an opportunity to reorganize the organization to our liking. Let us keep Honecker in retirement."
 GDR_Unity_from_Below: "Unity from Below"
 GDR_Unity_from_Below_desc: "Unity from below is a concept wherein we will stir up popular support for the Communist Party in West Germany, the end goal being their rise to power and eventual unification with the GDR."
 GDR_Reinstitute_Political_Censorship: "Reinstitute Political Censorship"
 GDR_Reinstitute_Political_Censorship_desc: "The chaos we've seen unfold is a direct result of our predecessor's misguided liberalization attempts. We must roll back these excess freedoms immediately."
 GDR_Surveil_the_Intelligenistia: "Surveil the Intelligenistia"
 GDR_Surveil_the_Intelligenistia_desc: "Intellectuals and educators are always fermenting contrarian ideas among the young and impressionable. They must be closely watched."
 GDR_Restore_the_Power_of_the_Stasi: "Restore the Power of the Stasi"
 GDR_Restore_the_Power_of_the_Stasi_desc: "The Stasi exists to protect the people from themselves. Restricting their capacity to do is nothing short of suicide for the state."
 GDR_Reinstate_Hilde_Benjamin: "Reinstate Hilde Benjamin"
 GDR_Reinstate_Hilde_Benjamin_desc: "Hilde Benjamin's removal was completely unjustified and clearly orchestrated by self-serving parasites within the Party. She must be reinstated at once."
 GDR_Keep_Ulbricht_in_Retirement: "Keep Ulbricht in Retirement"
 GDR_Keep_Ulbricht_in_Retirement_desc: "Walter Ulbricht played his part. The GDR must look to the future, not the past."
 GDR_Reinstate_Ulbricht_to_the_Party: "Reinstate Ulbricht to the Party"
 GDR_Reinstate_Ulbricht_to_the_Party_desc: "Though it will not be popular, we shall reinstate Walter Ulbricht to the Party. We will need his help to turn the tide of revisionism."
 GDR_Crackdown_on_the_Revisionists: "Crackdown on the Revisionists"
 GDR_Crackdown_on_the_Revisionists_desc: "Revisionism, liberalization, whatever it is called, we do not want it. We must stay faithful to the principles of Marxist-Leninism!"
 GDR_Put_Schirdewan_on_Trial: "Put Schirdewan on Trial"
 GDR_Put_Schirdewan_on_Trial_desc: "Karl Schirdewan was once favored for leadership of the Party, but his acceptance of revisionist policies cannot be reconciled with our views. He must be put on trial and done away with."
 GDR_Seek_Soviet_Economic_Assistance: "Seek Soviet Economic Assistance"
 GDR_Seek_Soviet_Economic_Assistance_desc: "The previous administration's policies have caused great harm to our already fragile economy. We will need Soviet assistance to get back on track."
 GDR_Investigate_Solutiions_to_the_Republikflucht_Crisis: "Investigate Solutiions to the Republikflucht Crisis"
 GDR_Investigate_Solutiions_to_the_Republikflucht_Crisis_desc: "The Republikflucht Crisis is getting out of hand. If we do not solve this problem quickly and effectively, the Republic will collapse."
 GDR_An_End_to_Collective_Leadership: "An End to Collective Leadership"
 GDR_An_End_to_Collective_Leadership_desc: "The idea of collective leadership has proven itself a failure. Leadership will return to the competent hands of the Party, and nobody else."
 GDR_Expand_Funding_For_Electronic_Engineering_Education: "Expand Funding for Electronic Engineering Education"
 GDR_Expand_Funding_For_Electronic_Engineering_Education_desc: "Electronics are key to achieving our dreams of a socialist utopia. If it is funding they need, it is funding they shall have!"
 GDR_Reform_the_Economic_Planning_Commission: "Reform the Economic Planning Commission"
 GDR_Reform_the_Economic_Planning_Commission_desc: "With things slowly returning to normal, we must adapt our plans for the economic development of Germany accordingly."
