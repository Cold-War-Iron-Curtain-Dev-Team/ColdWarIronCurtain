l_english:
 ##Focuses
 PRC_50s_Launch_The_Crossing_Yangtze_River_Campaign_Interim:0 "The Yangtze River Crossing Campaign"
 PRC_50s_Launch_The_Crossing_Yangtze_River_Campaign_Interim_desc:0 "Our Final Calling has begun. We have annihilated the enemy in the Huaihai Campaign, destroyed their forces around Jinzhou in the Liaoshen Campaign, and united most of our forces in the Northeast. It is now time for us to retake our motherland, and liberate the workers, peasants, and proletariat! Forwards brothers!"
 PRC_50s_Accept_Governance_Across_The_Yangtze_River:0 "Accept Guomindang Governance"
 PRC_50s_Accept_Governance_Across_The_Yangtze_River_desc:0 "In order to have a truce with us, Li Zongren, the acting president of the Kuomintang government, put forward the truce idea of ​​"Dividing Governance Across the Yangtze River", that is, the Chinese Communist government and the Nationalist government would cease war on the spot with the Yangtze River as the border. In order to allow the people and the country to recuperate and to eliminate the Kuomintang reactionaries in one fell swoop in the future, we can only accept this condition. "
 PRC_50s_The_Final_Push:0 "Our Final Push to Liberation"
 PRC_50s_The_Final_Push_desc:0 "We will sweep aside the remaining traitorous scum and reunify our great motherland under one banner. The struggle has been long, but the final victory is within reach. China will rise anew, united and unbreakable."
 PRC_50s_March_To_The_Southwest:0 "March to the Southwest"
 PRC_50s_March_To_The_Southwest_desc:0 "With momentum on our side, the liberation forces now set their sights on the rugged and divided Southwest. These territories, still held by reactionary remnants, remain a barrier to the full unification of the nation. The terrain is harsh, the logistics difficult, and resistance pockets persistent, yet the strategic value of the region cannot be overstated.\n\nOur commanders prepare for a coordinated advance through mountains, river valleys, and contested towns. Each step taken will secure vital supply routes, rally local supporters, and tighten our grip on the campaign’s southern front. The march will be challenging—but essential for completing the revolutionary cause."
 PRC_50s_Liberate_Kunming:0 "Liberate Kunming"
 PRC_50s_Liberate_Guangxi:0 "Liberate Guangxi"
 PRC_50s_Reach_South_China_Sea:0 "To Reach the South China Sea"
 PRC_50s_The_Three_District_Revolution:0 "The Three Districts Revolution"
 PRC_50s_Peacefully_Liberate_Urumqi_Campaign:0 "Peacefully Liberate Urumqi"
 PRC_50s_Begin_Establishment_of_PCCX:0 "Establish the Xinjiang Production and Construction Corps"
 PRC_50s_Integrate_the_three_districts_government:0 "Integrate the Three Districts Government"
 PRC_50s_Unite_The_National_Bourgeoisie_Interim:0 "Unite the National Bourgeoisie"
 PRC_50s_Prepare_for_the_First_CPPCC_Interim:0 "Preparations for the First Chinese People's Political Consultative Conference"
 PRC_50s_Production_Assurance_of_Newly_Receiving_Enterprises_Interim:0 "Assure Production of Newly Receiving Enterprises"
 PRC_50s_Foundation_of_the_Peoples_Republic_of_China:0 "the Foundation of the People's Republic of China"
 PRC_50s_Liberate_Kunming_desc:0 "The liberation of Kunming is a critical step in breaking the remaining resistance in the southwest. By advancing into Yunnan, we secure vital supply routes, eliminate warlord influence, and bring long-awaited stability to the region. Success here will greatly strengthen our position in the national struggle."
 PRC_50s_Liberate_Guangxi_desc:0 "Guangxi remains one of the last strongholds of entrenched opposition. By liberating the region, we secure key agricultural and industrial resources while dismantling the influence of rival factions. This campaign will bring unity one step closer."
 PRC_50s_Reach_South_China_Sea_desc:0 "Reaching the South China Sea marks the culmination of our southern liberation efforts. By securing the coastline, we guarantee strategic maritime access, strengthen logistical networks, and prevent any remaining enemy forces from seeking foreign support."
 PRC_50s_The_Three_Districts_Revolution_desc:0 "The Three Districts of Ili, Tacheng, and Altay hold great revolutionary potential. By supporting and guiding the movements in these regions, we deepen our influence in the northwest and lay the foundation for future integration into the new China."
 PRC_50s_Peacefully_Liberate_Urumqi_Campaign_desc:0 "A peaceful liberation of Urumqi is possible through negotiation, diplomacy, and careful political pressure. If successful, it will spare the region further suffering and demonstrate our commitment to unity without unnecessary bloodshed."
 PRC_50s_Begin_Establishment_of_PCCX_desc:0 "To ensure long-term stability in Xinjiang, we must establish the Xinjiang Production and Construction Corps. This organization will combine military discipline with agricultural and industrial development, strengthening border security while promoting economic growth."
 PRC_50s_Integrate_the_three_districts_government_desc:0 "With control of Xinjiang secured, we must now integrate the Three Districts' government into the national structure. A unified administrative system will eliminate fragmentation and align the region with the policies of the new China."
 PRC_50s_Unite_The_National_Bourgeoisie_Interim_desc:0 "The national bourgeoisie still wields important economic influence. By choosing cooperation over confrontation during this transitional period, we maintain industrial stability and ensure that all productive forces contribute to national reconstruction."
 PRC_50s_Prepare_for_the_First_CPPCC_Interim_desc:0 "The first Chinese People's Political Consultative Conference will define the framework of the new state. Preparations must be made to bring together representatives from all democratic parties, mass organizations, and social classes to establish a broad front for national unity."
 PRC_50s_Production_Assurance_of_Newly_Receiving_Enterprises_Interim_desc:0 "As enterprises come under state control, their production must remain uninterrupted. Through guidance, supervision, and worker support, we ensure that factories continue to operate efficiently throughout the transition."
 PRC_50s_Foundation_of_the_Peoples_Republic_of_China_desc:0 "The long revolutionary struggle nears its triumphant conclusion. With victory secured and governance consolidated, the time has come to declare the founding of the People's Republic of China. A new era dawns for the Chinese people."

