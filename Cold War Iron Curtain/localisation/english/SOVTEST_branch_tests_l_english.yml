l_english:
 # ============================================================================
 #  TEMPORARY - localisation for the Soviet branch test decisions.
 #  Delete alongside common/decisions/SOVTEST_branch_tests.txt and
 #  common/decisions/categories/SOVTEST_branch_test_categories.txt.
 # ============================================================================

 SOVTEST_branch_tests:0 "[TEST] Soviet Side Branches"
 SOVTEST_branch_tests_desc:0 "Temporary test decisions. Each one forces one of the Soviet side branches to appear by setting exactly the state its allow_branch checks for. Delete these three files before release."

 SOVTEST_show_stalin_notes:0 "[TEST] Show: Stalin Notes (German Question)"
 SOVTEST_show_stalin_notes_desc:0 "Sets §YSOV_german_question_active§! and clears the Red Bonn flag.\nThe Stalin Notes branch appears at its slot; Red Bonn is hidden."

 SOVTEST_show_red_bonn:0 "[TEST] Show: A Red Bonn (KPD won 1949)"
 SOVTEST_show_red_bonn_desc:0 "Sets §YSOV_WGR49_kpd_victory§! and clears the Stalin Notes flag.\nRed Bonn appears in the same slot; the Stalin Notes branch is hidden.\n\nNote this only shows the §YSoviet§! branch - it does not make West Germany actually communist."

 SOVTEST_show_greek_historical:0 "[TEST] Show: Greece, Percentage Agreement kept"
 SOVTEST_show_greek_historical_desc:0 "Sets §YSOV_Followed_Percentage_Agreements§!.\nThe historical Greek arm appears. Note its later focuses still need §Y1953§! and a living Greece."

 SOVTEST_show_greek_intervention:0 "[TEST] Show: Greece, intervention"
 SOVTEST_show_greek_intervention_desc:0 "Sets §YSOV_Rejected_Percentage_Agreements§!.\nThe intervention arm appears. The success and failure sub-branches below it still read the real state of the PDG-Greece war, so they will stay locked until that war actually resolves."

 SOVTEST_show_china_prc_victory:0 "[TEST] Show: China, the PRC wins"
 SOVTEST_show_china_prc_victory_desc:0 "Sets §YCCW_Over§! and §YROC_taiwan§!, clears §YSOV_PRC_Losing_CCW§!.\nThe PRC-victory arm unlocks. The China root is visible from game start either way."

 SOVTEST_show_china_manchuria:0 "[TEST] Show: China, the nationalists win"
 SOVTEST_show_china_manchuria_desc:0 "Sets §YCCW_Over§!, §YROC_Victory§! and §YSOV_PRC_Losing_CCW§!.\nThe Manchurian arm appears.\n\nNote this only flips the §YSoviet§! branch - it does not run PRC_Lose_CCW, so the map is unchanged and the PRC still holds its normal territory."

 SOVTEST_show_korea_wartime:0 "[TEST] Show: Korea, wartime branch"
 SOVTEST_show_korea_wartime_desc:0 "Sets §YSOV_korea_question_active§! and §Ykorean_war_begun§!, clears the ceasefire flag.\nThe wartime Korean branch appears and the settlement branch is hidden."

 SOVTEST_show_korea_division:0 "[TEST] Show: Korea, historical division"
 SOVTEST_show_korea_division_desc:0 "Sets the ceasefire flags and clears §Ylost_in_korean_war§! from the South.\nThe wartime branch is retired and the division arm appears in its place.\n\nRequires both Koreas to exist."

 SOVTEST_show_korea_north_wins:0 "[TEST] Show: Korea, the North wins"
 SOVTEST_show_korea_north_wins_desc:0 "Sets the ceasefire flags and gives the South §Ylost_in_korean_war§!.\nThe northern-victory arm appears.\n\nRequires both Koreas to exist. This only flips the §YSoviet§! branch - the map is unchanged."

 SOVTEST_show_korea_south_wins:0 "[TEST] Show: Korea, the South wins"
 SOVTEST_show_korea_south_wins_desc:0 "§RDestructive.§! The southern-victory arm requires the KPA not to exist, so this actually §Rannexes§! it into the South.\n\nSave before using this one."

 SOVTEST_reset_all_branches:0 "[TEST] Reset all branch flags"
 SOVTEST_reset_all_branches_desc:0 "Clears every flag the decisions above set and restores §YCCW_Started§!, returning the tree to its 1949 state.\n\nDoes §Rnot§! undo the annexation performed by the South-wins test."
