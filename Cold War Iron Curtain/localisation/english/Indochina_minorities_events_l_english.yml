 # === THO Events extracted from French_Indochina_l_english.yml ===
 THO.1.t:0 "The Question of the Viet Bac"
 THO.1.d:0 "The northern marches have been asked what they are owed. Cao Bang and Lang Son sheltered the Party when it had nothing else - the caves at Pac Bo, the base areas of the resistance, the road down which the first regular regiments marched. The Tay and Nung cadres who kept that country open for a decade have not forgotten it, and neither has the Central Committee.\n\nOne road is an autonomous region: a Viet Bac administration seated at Cao Bang, running its own schools in its own languages, appointing its own officials and keeping its own militia on a frontier that faces China. It settles a debt the republic genuinely owes, and it gives the border peoples a reason to be ours that does not depend on garrisons. The cost is that the ministries in Hanoi will not directly govern the ground the revolution was born on.\n\nThe other road is integration. Cao Bang, Lang Son and the country around them become provinces like any other, administered from the delta by cadres the delta appoints. It is simpler, it is uniform, and it asks the highlands to accept in peace an authority they were never asked to accept during the war."
 THO.1.a:0 "Constitute the Viet Bac Autonomous Region."
 THO.1.b:0 "The marches will be governed as any other province."
 
 THO.2.t:0 "The Establishment of the Viet Bac Autonomous Zone"
 THO.2.d:0 "Following the consolidation of revolutionary authority across the northern frontier, the Party has begun examining a new administrative framework for the ethnically diverse mountains of Viet Bac. Home to the Tay, Nung, Dao, San Chi, and many other minority peoples, the region served as the cradle of the resistance against French colonialism and remains vital to the security of our northern frontier.\n\nSince the establishment of the Viet Bac Interzone in 1949 under the leadership of General Chu Van Tan, local minority cadres have played an indispensable role in defending the revolution. Now, with peace gradually returning, many officials propose replacing wartime administration with a permanent autonomous zone that would recognize the unique cultural traditions of the highland peoples while strengthening their integration into the Democratic Republic of Vietnam.\n\nSupporters argue that granting limited regional autonomy would reward the loyalty of the mountain communities, improve local governance, encourage economic development, and demonstrate the Party's commitment to equality among all nationalities. Others caution that excessive decentralization could weaken central authority in a strategically sensitive border region.\n\nThe Politburo must now determine who shall be governed over Viet Bac."
 THO.2.a:0 "General Tan, as he can promote unity among the mountain communities."
 # === MEO Events extracted from French_Indochina_l_english.yml ===
 MEO.1.t:0 "Forging the Great National Unity in the Kingdom of the Meo"
 MEO.1.d:0 "As the highland mists rolled over Sa Phin, the echoes of hammering and the shouts of workers filled the air. Vuong Chi Sinh, once known as the King of the Meo, now stood as a revolutionary leader, guiding his people toward a new future. Under his rule, the Hmong of Dong Van no longer lived under the shadow of colonial oppression but instead rallied under the banner of Khoi Dai Doan Ket Dan Toc - the great national unity movement, as called upon by Ho Chi Minh.\n\nOnce a powerful figure in the opium trade, Vuong Chi Sinh had abandoned his father's path, choosing instead the road of revolution. The French and Nationalist Chinese had both tried to tempt him with promises of autonomy, seeking to use his influence to divide the ethnic minorities from the Viet Minh. But the Meo King remained steadfast, having sworn loyalty to Bac Ho and the cause of national liberation.\n\nNow, under his leadership, the Hmong no longer fought for the interests of colonial masters but instead armed themselves for the resistance. In secret, Vuong Chi Sinh had long been stockpiling weapons, training his people in mountain warfare, and forming a clandestine army drawn from the most loyal Hmong clans. When the call for Khang chien toan quoc came, his warriors were ready.\n\nBut beyond the battlefield, Vuong Chi Sinh also embraced the revolutionary cause of self-sufficiency and prosperity. Fields once used for poppy cultivation were now repurposed for livestock farming and staple crops. Under his orders, villagers took up hammers and chisels to carve new roads through the stone plateau, opening pathways for trade and communication. His efforts, aligned with Ho Chi Minh's vision of Khoi Dai Doan Ket Dan Toc, ensured that the Hmong were no longer an isolated people, but an integral part of the revolutionary movement. "
 MEO.1.a:0 "A toast to our country and its peoples."
 MEO.2.t:0 "Tan Tam Bao Quoc, Bat Thu No Le"
 MEO.2.d:0 "The cold winds of the northern highlands swept through the halls of the Meo King's palace in Dong Van as a messenger arrived from Hanoi, carrying a gift from President Ho Chi Minh himself. Within the ornate package lay a chiec ao tran thu, embroidered with the words: \"Kinh Tang Ho Chu Tich, Hoi L.H.P.N Hai Duong.\" A symbol of warmth and protection, it had been gifted to the Father of the Nation by the women of Hai Duong, but now it carried a greater purpose. Ho had added his own inscription: \"Chuyen tang Vuong Chi Thanh Dai bieu Quoc hoi. Ky ten Ho Chi Minh.\" It was no mere gesture of gratitude but a reaffirmation of the bond between Vuong Chi Sinh, now bearing the name Vuong Chi Thanh, and the revolutionary government he had pledged allegiance to.\n\nAlongside the coat was a magnificent sword, its scabbard adorned with eight powerful characters in Han Nom, inscribed by Ho Chi Minh's own hand:\n\"Tan Tam Bao Quoc; Bat Thu No Le.\"\n(\"Dedicate yourself to serving the nation; Never submit to slavery.\")\n\nWith these gifts, Ho Chi Minh honored the Meo King not just as an ally but as a sworn brother in the struggle for national liberation. Unlike many other ethnic leaders who wavered between colonial forces, Vuong Chi Thanh had thrown his lot in with the revolution, believing in a Vietnam where the Hmong and all ethnic minorities would stand as equals in the new republic. His loyalty to the Viet Minh was not just political - it was a commitment sealed with a warrior's blade and a patriot's heart.\n\nNow, as the war against the French raged on, the Meo King stood firm, rallying his people to the cause of independence, knowing that the words etched into his sword would guide his path: to fight for Vietnam's freedom, never again to bow to foreign rule."
 MEO.2.a:0 "A toast to our brother, Ho Chi Minh."
 MEO.3.t:0 "The Quoc-Cong Civil War"
 MEO.3.d:0 "For decades, the Meo Kingdom had watched China's chaos from the misty highlands of Sa Phin. Under the rule of Vuong Chi Sinh, the Hmong clans had once relied on trade with Yunnan's warlords, exchanging opium for silver, weapons, and supplies. The French turned a blind eye, knowing that as long as the Meo King remained powerful, the mountain passes of Ha Giang were secure. But times had changed.\n\nWith Ho Chi Minh's guidance, Vuong Chi Sinh had broken from the old ways. No longer would the Hmong rely on the poison of the past. Bac Ho had urged him: \"We must build a new Vietnam, free of colonial shackles, free of feudal oppression, and free of exploitation - including by opium.\" The Meo King listened, ordering his people to end the trade. The clan elders grumbled, the warlords in Yunnan cursed his name, but the decision was made.\n\nNow, as China burned in civil war between the Guomindang and the Communists, old partners sent desperate messengers to Sa Phin. The Yunnanese generals pleaded for the Meo Kingdom to resume the opium shipments. Their armies were starved for resources. Even Chiang Kai-shek's forces in the south were willing to pay handsomely for supplies.\n\nBut Vuong Chi Sinh refused. He had seen enough of warlords and imperialists. The Meo Kingdom would not return to the past. His people had chosen revolution, self-sufficiency, and the unity of Khoi Dai Doan Ket Dan Toc under Vietnam's national struggle.\n\nIn response, KMT-aligned bandits raided Meo villages, burning fields and stealing livestock, hoping to pressure the King into resuming trade. But the Hmong warriors, trained under Vuong Chi Sinh's secret army, struck back. Clashes erupted along the border, and the Meo Kingdom found itself entangled in the great Chinese war - not as merchants, but as defenders of their newfound independence."
 MEO.3.a:0 "Let wait and see."
 MEO.4.t:0 "The Quoc-Cong War Ends - Chiang's Victory "
 MEO.4.d:0 "After years of bloody conflict, the Chinese Civil War has ended with a decisive victory for Chiang Kai-shek and the Guomindang (KMT). The Red Army has been shattered, and Mao Zedong has vanished into the shadows. From Nanjing, the KMT declares its total control over China, vowing to restore order and crush all communist influence in the region.\n\nIn Sa Phin, Vuong Chi Sinh gathers with trusted advisors to discuss the new geopolitical reality. A message from Ho Chi Minh soon arrives, urging the Meo Kingdom to remain neutral in Chinese affairs, following the wisdom of \"Cay Tre\" diplomacy - like the bamboo, Vietnam must bend but not break in the face of shifting winds.\n\nHowever, vigilance is necessary. Duong Trung Nhan, the Tusi warlord of Meo Vac and a sworn enemy of Vuong Chi Sinh, has aligned himself with the KMT. His bandits, once scattered, are emboldened by Chiang's victory. With covert support from Nanjing, he now threatens the fragile stability of Ha Giang.\n\nShall we continue to abide by Ho Chi Minh's cautious approach, or must we prepare for the inevitable conflict with the KMT-backed factions?"
 MEO.4.a:0 "The bamboo bends, but it never breaks. Remain neutral, but keep the warriors ready."
 MEO.5.t:0 "The People's Republic of China Rises"
 MEO.5.d:0 "The world has changed overnight. Mao Zedong and the Communist Party of China (CPC) have emerged victorious in the Chinese Civil War. Chiang Kai-shek and his remaining forces have fled to the island of Taiwan, leaving Beijing under full CPC control. From the capital, Mao has declared the formation of the People's Republic of China (PRC), vowing solidarity with oppressed peoples across Asia.\n\nA congratulatory letter from Ho Chi Minh and the Viet Minh soon arrives in Sa Phin. They hail China's victory as a triumph against imperialism and feudalism, seeing it as a great step forward in the revolutionary struggle. However, caution remains necessary. While the CPC has promised support for Vietnam's liberation, the KMT remnants still lurk in Yunnan, plotting their return.\n\nThe Meo Kingdom, once caught between warlords and colonialists, must now navigate a new political landscape. With the PRC as a potential ally, the balance of power in Southeast Asia has shifted - but can we truly trust them?"
 MEO.5.a:0 "Congratulate the CPC, but prepare for the KMT's shadow to remain over Yunnan."
 MEO.6.t:0 "The Kingdom of Meo Returns to Tradition"
 MEO.6.d:0 "The people of Sa Phin have spoken - farming reforms alone cannot sustain them. With starvation looming and the promises of Bo Canh Nong failing to deliver, Vuong Chi Sinh makes a difficult decision. He issues a royal decree pardoning Duong Trung Nhan and re-establishing opium trading routes with Yunnan and Laos, securing a steady source of income for the highlands.\n\nThe elders whisper that this is how it has always been. The poppy fields, once abandoned, will bloom again, and the Meo Kingdom will prosper as it did before.\n\nThough the decision may invite the disapproval of Ha Noi, Vuong Chi Sinh knows that his first duty is to his people. Ideals do not fill empty stomachs - opium does."
 MEO.6.a:0 "A hungry kingdom cannot dream of utopia. We do what must be done."
 
 MEO.7.t:0 "The Pardon of the Duong Family"
 MEO.7.d:0 "The Duong household has sent envoys to Dong Van. Its elders offer obedience, access to their commercial connections and a pledge to restrain their armed followers-provided that their confiscated property and standing are restored. Their rivals insist that a pardon will merely give the family time to gather the men who still answer its call."
 MEO.7.a:0 "Their loyalty will be tested in service."
 MEO.7.b:0 "The pardon is a warning, not a reconciliation."
 
 MEO.8.t:0 "Channels Across the Border"
 MEO.8.d:0 "Chinese officers, merchants and displaced retainers move through the mountain passes with alarming frequency. Some still carry the habits of the Kuomintang war machine: sealed letters, old debts and promises of rifles for anyone willing to keep a road open. A discreet understanding could enrich Dong Van and widen its room for manoeuvre. It could also make us suspect in Hanoi."
 MEO.8.a:0 "Open a discreet channel."
 MEO.8.b:0 "We will not sell our future to fugitives."
 
 MEO.9.t:0 "The Hanh Phuc Route"
 MEO.9.d:0 "No authority in the northern highlands can be secure while men, grain and messages take weeks to cross a single ridge. Engineers and local labour leaders have presented a plan for a hard road from Ha Giang toward Dong Van. It will demand blasting powder, food, labour and lives-but it promises to bind the plateau to the valleys below."
 MEO.9.a:0 "Cut the road through stone."
 
 MEO.10.t:0 "Thi Dua Tot, Lao Dong Tot"
 MEO.10.d:0 "The call has gone out to every village: compete in good work and labour well. Road crews, workshops, militia detachments and farming households are urged to outdo one another in service to the highlands. Some hear a genuine appeal to collective effort; others hear another demand from officials who have never carried a basket up these slopes."
 MEO.10.a:0 "Every household must do its share."
 
 MEO.11.t:0 "Plans for Sip Song Tai"
 MEO.11.d:0 "The staff has placed its maps on the table. The western marches are a maze of ravines, village obligations and shifting loyalties; an operation against the Sip Song Tai cannot be treated as a simple march across a border. Guides must be found, supply depots prepared and every column taught to fight in country where the mountains favour whoever knows them best."
 MEO.11.a:0 "Draw the plans; ready the columns."
 
 MEO.12.t:0 "The 1950 Highland Uprising"
 MEO.12.d:0 "News has reached Dong Van that Duong-aligned notables and armed Tho phi bands are again gathering men. Their proclamations invoke the old authority of the Hmong houses and demand the elevation of Hoang A Tuong, whose French ties, Kuomintang contacts and hatred of communism make him a potent symbol for the dissatisfied. The challenge is not merely a raid: it is a contest over who may speak for the plateau."
 MEO.12.a:0 "The highlands cannot be ruled by decree."
 
 MEO.13.t:0 "The Hoang Family Takes the Throne"
 MEO.13.d:0 "With armed supporters behind them and the old order invoked in every market and village, the Hoang family has seized the initiative. Hoang A Tuong is acclaimed as king by his backers, who promise to restore a Hmong realm beyond the reach of lowland parties and their cadres. The acclamation is loud; whether it is universal is another matter."
 MEO.13.a:0 "Raise the old banners."
 
 MEO.14.t:0 "The Tai-Meo Autonomous Zone"
 MEO.14.d:0 "A new arrangement for the uplands has been announced."
 MEO.14.d_meo:0 "Hanoi has offered an autonomous zone rather than direct incorporation. The agreement promises local institutions, recognition for the Tai and Hmong communities, and a measure of protection for the region's customs. Yet autonomy is a word with many meanings, and every clause will depend on who commands the roads, the militia and the district offices."
 MEO.14.d_vin:0 "With the liberation of much of the northwestern highlands, the Democratic Republic of Vietnam now faces the challenge of integrating the region's many ethnic communities into the revolutionary state. Home to the Tai, Meo (Hmong), and numerous other highland peoples, the Northwest has long maintained its own customs, traditional leadership, and local autonomy. Rather than imposing direct administration, the government has proposed the establishment of a Tai-Meo Autonomous Zone, granting local minorities a measure of self-government while strengthening their ties to Hanoi.\n\nThe proposed autonomous zone follows the Party's policy of national unity and equality among Vietnam's ethnic groups. By recognizing local traditions and encouraging minority participation in government, the revolution hopes to win the loyalty of the highlands while denying hostile forces an opportunity to exploit ethnic divisions.\n\nThe final question remains one of leadership.\n\nLo Van Hac, a respected Black Tai chief and revolutionary who fought against French colonial rule, has earned widespread admiration for his dedication to the revolution and his efforts to unite the peoples of the Northwest under the banner of socialism. His appointment would emphasize revolutionary credentials and Party leadership.\n\nAlternatively, Vuong-Chi-Sinh, the famed Meo King and son of Vuong-Chinh-Duc, remains one of the most influential leaders among the Hmong people. Having pledged his loyalty to President Ho Chi Minh during the revolution and later serving as a deputy in the National Assembly, his appointment would symbolize reconciliation between traditional highland authority and the new revolutionary government."
 MEO.14.a:0 "Autonomy is preferable to ruin."
 MEO.14.b:0 "The Black Tai Chief, Lo Van Hac."
 MEO.14.c:0 "The Meo King, Vuong Chi Sinh."
 
 MEO.15.t:0 "Dong Van Declares Independence"
 MEO.15.d:0 "The compromise with Hanoi has failed. Hoang A Tuong's supporters have denounced the communist administration as a threat to Hmong authority, private property and the old highland order. Their message moves through the passes with the promise of outside friends and the certainty that no lowland government understands these mountains. The break is now public."
 MEO.15.a:0 "Dong Van will govern itself."
 
 MEO.16.t:0 "Secession in Dong Van"
 MEO.16.d:0 "A faction in Dong Van has broken openly with the Vietnamese state. Its leaders speak in the language of Hmong autonomy, but their enemies point to French connections, Kuomintang intermediaries and armed bands on the Chinese frontier. The mountains are difficult country for a punitive expedition; allowing the revolt to harden, however, may invite others to test the government's resolve."
 MEO.16.a:0 "This insurrection must be crushed."
 MEO.16.b:0 "Offer terms and buy time."
 
 MEO.17.t:0 "A Door Opens in Dong Van"
 MEO.17.d:0 "Reports from the northern frontier describe an anti-communist Hmong movement declaring itself independent from Hanoi. Hoang A Tuong's name carries weight among some highland notables, and his adherents have not forgotten old French contacts. They seek recognition, arms and a patron willing to turn a difficult borderland into a problem for the Viet Minh."
 MEO.17.a:0 "A quiet hand across the border may be useful."
 MEO.17.b:0 "We shall not invite another disaster."
 
 MEO.18.t:0 "The 1959 Highland Uprising"
 MEO.18.d:0 "Duong Trung Nhan has gathered discontented Hmong notables, border smugglers and Tho phi bands into a new uprising. This time the Duong tribal king presses his own claim rather than another man's: his messengers promise a restored Hmong crown on his head and denounce every concession made to Hanoi. Vuong Chi Sinh's authority remains formidable, but the rebels believe that age, distance and foreign intrigue have finally created their moment. We must decide whether to defend the existing settlement or let the old crown return."
 MEO.18.a:0 "Stand with Vuong Chi Sinh and restore order."
 MEO.18.b:0 "The crown belongs to Duong Trung Nhan."
 
 MEO.19.t:0 "Dong Van Reaffirms Its Allegiance"
 MEO.19.d:0 "Vuong Chi Sinh has rejected the uprising and appealed for support against the armed bands gathering in the highlands. His position lends the government an invaluable local voice, but it will mean little without cadres, supplies and reinforcements able to reach the plateau. The struggle for Dong Van is now also a test of Hanoi's ability to protect its allies."
 MEO.19.a:0 "Send the requested reinforcements."
 MEO.19.b:0 "They must settle this among their own people."
 
 MEO.20.t:0 "The Thought of Ho Chi Minh"
 MEO.20.d:0 "The revolt has exposed the limits of personal authority. Party organisers argue that lasting unity cannot rest only on the prestige of Vuong Chi Sinh or on bargains between great households. Cadres are to be trained, village committees strengthened and the ideals associated with Ho Chi Minh made the political language of the plateau."
 MEO.20.a:0 "One people, one struggle, one frontier."
 
 MEO.21.t:0 "The KMT Tho Phi on the Frontier"
 MEO.21.d:0 "Defeated Kuomintang remnants, local bandits and opportunists have found common cause in the passes. They raid storehouses, threaten village leaders and move across the frontier before a regular column can catch them. The campaign ahead will be a hard one: no single battle will decide it, and every success must be held by the people who live beneath these mountains."
 MEO.21.a:0 "Clear every pass and every village."
 
 MEO.22.t:0 "The Hmong Kingdom Declares Independence"
 MEO.22.d:0 "The rebels have prevailed, and Duong Trung Nhan has taken the crown for himself. The Duong tribal king spent three decades in the shadow of the Vuong house; he does not intend to raise another man to the throne he has just won. Dong Van has renounced the authority of the Vietnamese communists, and the new court speaks of tradition and Hmong self-rule, while its opponents see a fragile regime tied to foreign patrons, Kuomintang remnants and the coercion of armed bands. Either way, the old settlement is broken."
 MEO.22.a:0 "Raise the banner of the Hmong Kingdom."
 
 MEO.23.t:0 "The Hmong Kingdom Breaks Away"
 MEO.23.d:0 "The authorities in Dong Van have repudiated Hanoi and announced a Hmong kingdom under Duong Trung Nhan. The declaration is an affront to national unity and an invitation to every hostile power watching the Chinese border. Yet a mountain war will consume men and resources at a time when the republic has many other enemies, and the passes above Dong Van have swallowed punitive columns before."
 MEO.23.a:0 "No secessionist court will endure."
 MEO.23.b:0 "Avoid a costly mountain war-for now."
 
 MEO.24.t:0 "The Assassination of Vuong Chi Sinh"
 MEO.24.d:0 "Vuong Chi Sinh is dead. Whether the killers acted alone or on the orders of the new regime matters less than the consequence: the one man able to speak across clan, village and political divisions has been removed. His death will be remembered as a murder by his followers and as a necessary act by those determined to erase the old compromise with Hanoi."
 MEO.24.a:0 "The last restraint has fallen."
 
 MEO.25.t:0 "Vuong Chi Sinh Has Been Assassinated"
 MEO.25.d:0 "Word of Vuong Chi Sinh's assassination has reached Hanoi. For years, his standing in Dong Van gave the republic a bridge to the Hmong highlands and a counterweight to banditry, foreign agents and rival houses. His murder is not simply the loss of a local official-it is a declaration that reconciliation on the frontier has failed."
 MEO.25.a:0 "He will be remembered as a patriot."
 
 MEO.26.t:0 "Three Answers for the Highlands"
 MEO.26.d:0 "The uprising has passed, but it has left every faction in Dong Van convinced that the old arrangement cannot hold. Three parties now press their case in the council chamber and in the villages beyond it.\n\nThe Hoang house and its armed followers argue that only a restored Hmong crown commands obedience in the passes, and that Hoang A Tuong should be raised to it before another season of banditry does the job for them. The cadres who came up through the resistance answer that nothing has changed: the compact with Hanoi has held through worse, and a highland that keeps its head down will keep its autonomy. A third voice, quieter but growing, says that both are begging from lowlanders who have never understood these mountains, and that Dong Van should simply govern itself.\n\nThe elders have said what they came to say. The decision belongs to us."
 MEO.26.a:0 "The plateau will have its answer soon enough."
 
 MEO.27.t:0 "The Question of Meo Autonomy"
 MEO.27.d:0 "Dong Van has asked Hanoi to settle the standing of the northern highlands, and the question can no longer be deferred. The Party's policy on the national minorities promises equality and self-government; the practical business of taxation, conscription and road-building promises rather less.\n\nOne road is the autonomous zone: a Tai-Meo administration with its own officials, its own customs and its own militia, tied to the republic but not run from it. It buys the loyalty of the passes cheaply and denies every hostile power on the Chinese border an aggrieved minority to work with. The cost is a frontier the ministries in Hanoi do not directly control.\n\nThe other road is integration. The highlands become provinces like any other, the cadres are appointed rather than acclaimed, and the question never has to be asked again. It is simpler, and it is the answer that has turned quiet frontiers into rebellious ones before."
 MEO.27.a:0 "Constitute the Tai-Meo Autonomous Zone."
 MEO.27.b:0 "The highlands will be governed as any other province."
 # === CCC Events extracted from VIE_events_l_english.yml ===
 # CCC Unification Choices
 CCC_Unification_Choices.1.t: "Bao-Dai's Visit to Saigon"
 CCC_Unification_Choices.1.d: "The Chief of State landed in Saigon this morning after the short flight down from Da-Lat, and the arrival was itself half the message. Bao-Dai has chosen to lead the negotiations with Cochinchina in person rather than through a delegation, and he arrives with considerable French backing behind him.\n\nThe ground was prepared in Paris. The Assembly's recent bill removing Cochinchina from the status of direct French territory and attaching it to the State of Vietnam settles in law what our negotiators have been arguing for two years, and it leaves the former emperor holding a position comfortable enough to be spent.\n\nWith all of that behind him, Bao-Dai guided the talks that followed..."
 CCC_Unification_Choices.1.a: "...with great amicability, offering as much concession as possible."
 CCC_Unification_Choices.1.b: "...with shrewd diplomacy and compromise, ensuring that nobody leaves unsatisfied."
 CCC_Unification_Choices.1.c: "...with assertiveness and confidence, for he had the upper hand."

 CCC_Unification_Choices.2.t: "Bao-Dai's Declaration to the Nation"
 CCC_Unification_Choices.2.d: "A proclamation written personally by the Chief of State took the front page of every major newspaper this morning: an appeal for peace and unity among his people, and an announcement of the plans for unification with Cochinchina.\n\nThe presses could not keep pace with it. Copies went from the stalls faster than they could be replaced, and by the middle of the morning the text was being read aloud on street corners to people who had not managed to buy one.\n\nThe verdict took the rest of the day to settle, as verdicts of this kind do. What the readers of Saigon eventually agreed upon was that the former emperor's writing had been rather..."
 CCC_Unification_Choices.2.a: "...tactful and polite, calling for solidarity above all else"
 CCC_Unification_Choices.2.b: "...aggressive and uncompromising, stating that the nation would be united no matter the cost."

 # CCC Unification
 CCC_Unification.1.t: "Plead France for Vietnamese Unification"
 CCC_Unification.1.d: "Our efforts to bring the \"Republic\" of Cochinchina into the union by agreement have failed. Relations between General Nguyen-Van-Xuan and the Chief of State are warm enough in public and have produced nothing whatever in private, because the two men cannot arrive at a solution while one of them does not want one.\n\nThat is the reading in the palace. Xuan is thought to be holding out for a different leader, or at the least for a different arrangement, and to be spinning the negotiations out until one or the other becomes available. There is no sign he means to break them off - only that he means never to conclude them.\n\nBao-Dai has therefore decided to appeal to the French directly, and their pressure will very probably bring the holdouts to the table, since Xuan's position rests entirely on French money and French goodwill. It will also mean that the unification of Vietnam was accomplished by a French instruction. Every man in Saigon will know it, and the purity of the victory will not survive the knowing."
 CCC_Unification.1.a: "Lets hope for the best."

 CCC_Unification.2.t: "Bao-Dai Requests Unification with Cochinchina"
 CCC_Unification.2.d: "Bao-Dai has come to the end of his own resources and has asked us to unify his country for him. It is not the first such request, and as usual the bark has proved rather worse than the bite.\n\nThe obstruction is Nguyen-Van-Xuan, which is convenient. Xuan is our man in every sense that matters, and a certain amount of pressure applied in the right quarter would very probably bring him round. A unified Vietnam might even begin carrying some of its own weight in this struggle, which would take a measure of the load off our own boys in the delta.\n\nThe real question is not Cochinchina at all. It is whether we go on propping up a Chief of State whose authority has to be topped up by us every few months, or whether the moment has come to look about for fresh blood."
 CCC_Unification.2.a: "We'll think about it."

 CCC_Unification.3.t: "France Requests Unification with Bao-Dai"
 CCC_Unification.3.d: "A second request has arrived, this one from the French government, urging us to unite with Bao-Dai's administration. It carries a good deal more weight than the first did.\n\nWe may accede to it on terms, making unification conditional on undertakings Bao-Dai would have to give and afterwards keep. Or we may decline, and remain an autonomous republic with our own assembly and our own administration, as we have been since the war ended.\n\nThe cost of declining ought to be stated plainly in this chamber rather than left to be discovered later. Bao-Dai wants Cochinchina and he has an army. If we refuse the French request, we lose along with it the French objection to his using that army."
 CCC_Unification.3.a: "May we build a strong Vietnam, together."
 CCC_Unification.3.b: "We shall stand our ground."

 CCC_Unification.4.t: "Cochinchina Agrees to Unify!"
 CCC_Unification.4.d: "The Autonomous Republic of Cochinchina has ceased to exist. Its territory is now integral provinces of the State of Vietnam, and our diplomatic office in Saigon is being dismantled as the announcement goes out - there is nothing left in that city for a diplomat of ours to do.\n\nThe Chief of State is reported to be personally elated, which those who know him say is not a word that often applies. There has been considerable celebration in the streets, some of it organised and a great deal of it not.\n\nThis matters beyond the map. Every argument made against this government since its founding has rested on the claim that it does not really govern Vietnam, only those parts of it France has not reserved to itself. That claim is weaker this evening than it was this morning, and the men who make it will have to find another."
 CCC_Unification.4.a: "Slowly but surely, Vietnam becomes one again."

 CCC_Unification.5.t: "Cochinchina Refuses Unification!"
 CCC_Unification.5.d: "Cochinchina has refused. Our diplomatic office in Saigon will be staying open rather longer than anyone intended, because the reply from the representatives of the Autonomous Republic was not a counter-offer but a rejection, and it was phrased for publication. They will not submit, they say, to the authority of \"the incompetent fools of the State of Vietnam\".\n\nBao-Dai was told at once and is reported to have left his apartments without a word to anyone, to telephone the French and demand immediate intervention. Nothing has come back from the High Commission, which is itself an answer of a sort.\n\nThe streets did not wait for the government to compose a statement. Crowds have been forming downtown all afternoon, and what they are shouting about is not Cochinchina but us - a government that announced unification before it had secured it. The claim to speak for all Vietnam has been publicly refused by Vietnamese, and no communique will repair that quickly."
 CCC_Unification.5.a: "We are divided, but not for long."

 CCC_Unification.6.t: "A Plead from Bao-Dai"
 CCC_Unification.6.d: "Bao-Dai has written again about Cochinchina. The talks between Saigon and his government have gone the way of all the others, and he asks us once more to unify the two under a single administration in the name of Vietnamese stability.\n\nHis persistence is wearing and his case is not a bad one. A divided south means two treasuries, two administrations and two sets of officers to be argued with, and we are conducting a war through both of them.\n\nGiven the state of the campaign, the Ministry's view is that we should do as he asks and persuade Cochinchina into the union - firmly, and without leaving fingerprints on it. Whatever emerges will at least be a single Vietnamese government, and it will be friendly to us."
 CCC_Unification.6.a: "Cochinchina has played around for too long, let's end this peacefully now."

 CCC_Unification.7.t: "A Final Ultimatum"
 CCC_Unification.7.d: "The French have delivered their final word on unification, and it is not a request. We are to join Bao-Dai's government, because Bao-Dai has told them he will take Cochinchina by force if we do not come peacefully, and they have decided not to stop him.\n\nWe may accept. Unification on his terms keeps the peace between Vietnamese, leaves our administrators in their posts under a different flag, and ends the argument that has consumed this republic for four years.\n\nOr we may refuse, and hold what we hold. The council should understand precisely what the French note says between its lines before it votes: if Bao-Dai marches, they will not come. Whichever way we decide, we decide alone."
 CCC_Unification.7.a: "Maybe it is for the best."
 CCC_Unification.7.b: "Our decision is final, we shall not bow to Bao-Dai!"

 CCC_Unification.8.t: "Cochinchina Submits!"
 CCC_Unification.8.d: "It is natural that our glorious leader Bao-Dai would attract Cochinchina to the State of Vietnam. General Nguyen-Van-Xuan has great respect, as he should, for the hegemony of Bao-Dai over all of Vietnam is just, promising, and natural. Bao-Dai is the greatest leader our nation ever had, in its thousands of years of history. His diplomatic skills, economic acumen, and commanding personality means he is unstoppable, and will surely crush the northern communist threat.\n\nThe unification of Cochinchina with our Central Provisional Government will lead us to unequivocal greatness. Nguyen-Van-Xuan understands that under a superior centralised government, we can defeat the communists and bring about a proper modern Vietnamese state."
 CCC_Unification.8.a: "We Are One at Last..."

 CCC_Unification.9.t: "Cochinchina Refuses Again!"
 CCC_Unification.9.d: "General Nguyen-Van-Xuan has refused again. He will not bring his occupied Cochinchina into union with the rest of the country, and his refusal was published in terms plainly written to be quoted. That a Vietnamese should decline to stand with Vietnamese against the communists of the north will be a stain on this country for years.\n\nHis stated ground is that our former king is unfit to rule, on account of what the Saigon papers delicately call the controversies. Bao-Dai carries the weight of a nation on his back. It is neither a surprise nor a crime that a man so burdened should take his pleasures where he finds them, and it is certainly no reason for a general to hold an entire region out of the state.\n\nFrom a French sympathiser this is exactly what should have been expected: greed dressed as principle, and appetite for power presented as caution. The people will see it for what it is, and so will the world, and both will understand why the authority of the Chief of State must extend over the whole of Vietnam."
 CCC_Unification.9.a: "South Vietnam shall be united, once and for all!"

 CCC_Unification.10.t: "Bao-Dai Takes Over Cochinchina!"
 CCC_Unification.10.d: "Recently, Bao-Dai has arrived in Saigon to demonstrate that he has unified Cochinchina and Annam under his government. While this means that Cochinchina is lost to us for now as our troops are outnumbered by the French and their lackeys, we must not give up our dream on reunifying Vietnam. We must not stop this war until Vietnam is liberated from the imperialist!"
 CCC_Unification.10.a: "Let us not lose hope, this is just the beginning."

 # CCC Political Events
 CCC_Pol.1.t: "The Question of Identity"
 CCC_Pol.1.d: "Now that our constitution is written, Cochinchinese leaders must resolve the central debate: do we stand as Nam-Ky, the distinctive culture of the Mekong and Saigon, or do we claim to be the Quoc-Gia standard-bearers for all Vietnam?"
 CCC_Pol.1.a: "We are Nam-Ky, a people apart."
 CCC_Pol.1.b: "We are the true Vietnamese nationalists."

 # CCC Dan-xa Party Events
 CCC_DanXa.1.t: "The Dan-xa Coup"
 CCC_DanXa.1.d: "Inspired by the Venerable Huynh-Phu-So of the Hoa-Hao Buddhist Faith, the Dan-xa Party - the Vietnamese Democratic Socialist Party - has launched a bold coup against Bao-Dai's government. Drawing upon popular anti-colonial sentiment and a vision of national liberation grounded in Buddhist ethics and social justice, the Dan-xa forces have successfully seized control of Cochinchina. The coup declares independence from both French colonialism and Marxist communism, proclaiming a third path: a moral revolution rooted in human dignity and Buddhist-inspired governance."
 CCC_DanXa.1.a: "The people have spoken - embrace this new dawn."
 CCC_DanXa.1.b: "The coup succeeds, but the struggle has only begun."

 CCC_DanXa.2.t: "The Dan-xa Resistance War"
 CCC_DanXa.2.d: "The Dan-xa Party's seizure of power has plunged Cochinchina into a three-way struggle: the French colonial military, the communist Viet-Minh, and the Dan-xa forces themselves. Locked in armed conflict on multiple fronts, the Dan-xa resistance movement mobilizes its followers - Buddhist monks, peasant militias, and guerrilla fighters - in defense of their vision of an independent, morally-centered Vietnam. The war drains resources but rallies the population behind the banner of national liberation."
 CCC_DanXa.2.a: "Mobilize the people - victory lies in struggle."
 CCC_DanXa.2.b: "The war is costly but necessary for our survival."
 # === FUL Events extracted from VIE_events_l_english.yml ===
 # FUL Unification - Integration
 FUL_Unification.1.t: "Montagnard Country Ratifies Du-So 6/QT/TG"
 FUL_Unification.1.d: "The Ministry of Overseas France has transferred authority over the Trung-Phan Highlands from the Autonomous Montagnard Country to [VIE.GetNameDef]. On paper the plateau is ours.\n\nThe Chief of State has not folded it into the ordinary administration. By \"Du-So 6/QT/TG\" he has detached the Trung-Phan Highlands from the ministries altogether and constituted them the Domain of the Crown: a separate legal order inside the State of Vietnam, held as his personal possession. Within its boundaries he is not Chief of State but Emperor, and both titles now rest on the same man in the same country.\n\nIt is a neat answer to a problem nobody else had solved. It is also an arrangement under which the highlands answer to a person rather than to a state, and the men who drafted it in Da-Lat understand quite well that a person is easier to replace than a constitution."
 FUL_Unification.1.a: "Another toast to our Chief of State and the Quoc-Gia Solution!"

 FUL_Unification.2.t: "France Reestablishes Colonial Rule Over the Montagnards"
 FUL_Unification.2.d: "Leon Pignon, at the head of the French High Committee in Indochina, has proclaimed a Montagnard Republic in what was until this morning the Trung-Phan Highland Crown Domain.\n\nHe made the announcement from the Mayoral Palace in Da-Lat. The argument was that the montagnard peoples require protection - of their development, of their distinctive culture, of their security - against Vietnamisation, against colonisation, and against the instability produced by the recent change of regime in the south.\n\nRead that list a second time. A French High Commissioner, standing in a French hill station, has declared that the montagnards must be shielded from colonisation and has proposed to do the shielding himself. The Domain was ours by a decree Paris drafted and Paris ratified. It has been taken back with a speech."
 FUL_Unification.2.a: "How ironic... we will issue a notion of protest against the French Government."

 FUL_Unification.3.t: "Request Dominion Over the Trung-Phan Highlands"
 FUL_Unification.3.d: "The Emperor and Parliament have telegraphed Paris directly with \"Du-So 1/HD/CN-TP\", requesting authority over the territory of the Autonomous Montagnard Country.\n\nThe legal ground was laid years ago. France delegated the management of the Central Highlands to the former Provisional Central Government in May 1949, and Bao-Dai converted the delegation into the Crown Domain by Du number 6/QT/TG in April 1950. Nam-Hung's position is that both instruments were de jure and nothing further. The montagnards went on governing themselves, went on refusing the new government, and in several districts went on doing rather worse than refusing.\n\nThe telegram names those districts. It names Dinh-Nup, and it sets out the raids on Kinh and other settled villages that have been laid at the door of montagnard bands working alongside the Viet Minh. Whether Paris accepts the account or not, the request has been framed in the language of security rather than of sovereignty, and security is the only language the Ministry of Overseas France is currently reading."
 FUL_Unification.3.a: "We hope they will grant us our rightful authority over this untamed land."

 FUL_Unification.4.t: "[GetVIEChiefOfState] Requests Dominion Over the Trung-Phan Highlands"
 FUL_Unification.4.d: "Cuong-De's new government has telegraphed us directly with \"Du-So 1/HD/CN-TP\", requesting authority over the territory of the Autonomous Montagnard Country.\n\nThe matter was, we had supposed, settled. We delegated the administration of those regions to Bao-Dai's government in May 1949, and the delegation was ratified by Du number 6/QT/TG in April 1950. Phu-Xuan contends that the arrangement was de jure only: that the montagnards remained effectively independent throughout, that they have opposed the administration ever since, and that some among them are actively assisting the Viet Minh in raids on our plantations in the region.\n\nThe uncomfortable part of the telegram is that it is broadly accurate. The question before the Ministry is therefore not whether the Emperor is right about the highlands, but whether we would sooner hold a plateau we cannot police, or hand it to a government we neither chose nor wanted."
 FUL_Unification.4.a: "We prefer to keep the Montagnards regions under our rule for the foreseeable future."
 FUL_Unification.4.b: "Very well, we will hand over authority."

 FUL_Unification.5.t: "France Denies Our Dominion over the Trung-Phan Highlands"
 FUL_Unification.5.d: "The Ministry of Overseas France has refused \"Du-So 1/HD/CN-TP\". Authority over the Trung-Phan Highlands stays in Paris, and the reason offered is the safety of French settlements and plantations in the region.\n\nThat is the published reason. What our own people on the plateau report is that the French and montagnard Security Battalions stationed there - detachments of a few hundred men a month ago - have been expanded rapidly and pushed out into new posts since the refusal was drafted. The official justification for the reinforcement is the prevention of further Viet Minh and montagnard terrorism.\n\nA government intending only to protect its planters does not need fresh garrisons in districts where no planter has ever set foot. Paris has decided to hold the highlands, and it has decided to hold them against us quite as much as against anybody else."
 FUL_Unification.5.a: "That's only an excuse. It is OUR rightful land..."

 FUL_Unification.6.t: "France Approves Our Dominion over the Trung-Phan Highlands"
 FUL_Unification.6.d: "The Ministry of Overseas France has approved \"Du-So 1/HD/CN-TP\". Authority over the Trung-Phan Highlands passes to this government immediately, and the transfer is unconditional in every respect save one.\n\nThe French and montagnard Security Battalions remain where they stand, for the foreseeable future, to prevent further Viet Minh and montagnard terrorism. Nobody has defined the foreseeable future, and nobody has said who commands those battalions once the administration is ours. The question will have to be asked, and it will not be asked this week.\n\nThe Emperor has already issued a Du establishing an autonomous administration on the plateau, and the Kien-Quoc Quan begins moving up the highland roads at once. What we have obtained is a title deed. What we do not yet have is the plateau."
 FUL_Unification.6.a: "The deed is signed - now for the ground"
 # === NUN Events extracted from VIE_events_l_english.yml ===
 # NUN Unification - Integration
 NUN_Unification.1.t: "Bao-Dai Demands Our Submission"
 NUN_Unification.1.d: "The Ministry of Overseas France has transferred authority over the ethnic autonomous regions of the Central Highlands and the Upper South to the National Government of Vietnam. It did not consult us, and it did not consult the chiefs.\n\nBao-Dai has not administered the transfer so much as pocketed it. By Du So 6/QT/TH he has detached the Central Highlands from the ordinary administration altogether and constituted them as the Hoang-Trieu Cuong-Tho, the Crown Domains. Within them he is not Chief of State but Emperor, ruling personally, and our districts are his fief.\n\nParis has promised in writing to grant and to protect our independence from Vietnam once the war against the communists is finished. Saigon has now sent a telegram demanding our submission on the strength of a decree Paris allowed him to issue. Both statements cannot be true, and we are required to answer the one that arrived first."
 NUN_Unification.1.a: "We'll comply as long as their promise of freedom is kept."
 NUN_Unification.1.b: "The French have promised us the right to defend our independence!"

 NUN_Unification.2.t: "The Nung Accept"
 NUN_Unification.2.d: "After careful consideration, the Nung leadership has decided to accept Bao-Dai's terms and submit to the Crown Domains arrangement. While this represents a significant compromise of their autonomy, the Nung leaders have concluded that cooperation with the Vietnamese government is preferable to confrontation, especially given the ongoing communist threat and the promise of protection from France.\n\nThe integration process will begin immediately, with the Nung territories being incorporated into the State of Vietnam as an autonomous region. The Nung will maintain some degree of self-governance, but ultimate authority will rest with Bao-Dai as both Head of State and Emperor of the Crown Domains.\n\nThis decision has been met with mixed reactions among the Nung population. Some see it as a pragmatic choice that ensures their security, while others view it as a betrayal of their independence. However, the leadership's decision stands, and the Nung will now be part of the larger Vietnamese state structure."
 NUN_Unification.2.a: "A new chapter begins for the Nung people."

 NUN_Unification.3.t: "The Nung Refuse"
 NUN_Unification.3.d: "The Nung leadership has firmly rejected Bao-Dai's demand for submission. Citing the French government's earlier promises of independence and protection, the Nung have declared their intention to maintain their autonomy and resist integration into the Crown Domains.\n\nThis refusal represents a significant challenge to Bao-Dai's authority and his plans for consolidating control over the ethnic regions. The Nung decision sends a clear message that they will not be easily subjugated, even in the face of pressure from the central government.\n\nThe consequences of this refusal remain uncertain. Will Bao-Dai attempt to force the issue through military means, or will he seek a diplomatic solution? The Nung have made their position clear, and the ball is now in the Vietnamese government's court."
 NUN_Unification.3.a: "We will not stand for this."
 # === FUL Events (Dan-Vuong/Economic/Military) extracted from VIE_events_l_english.yml ===
 # Dan-Vuong Model in FUL
 FUL_DanVuong_Model.1.t: "Introducing the Dan-Vuong Model to the Montagnards"
 FUL_DanVuong_Model.1.d: "For centuries the montagnard tribes have been held in perpetual inter-tribal war, in superstition, and in beliefs that no outside power has ever found difficult to turn to its own use. That is not an accusation against them. It is the reason every imperialist force that came to Indochina found the highlands easy.\n\nThe self-declared Montagnard \"Republic\" and Leon Pignon's scheme behind it prove the point rather than refute it. A people governed in its own name by a French High Commissioner has not yet learned to govern itself, and there is more respect in saying so plainly than in flattering them.\n\nSo we will teach. The Dan-Vuong model is to be carried into the highlands - into the schools, the markets and the village councils - so that when autonomy is granted them within this country there are men on the plateau capable of exercising it. They are to be our compatriots, and compatriots are made rather than proclaimed."
 FUL_DanVuong_Model.1.db: "For centuries we have been held in perpetual inter-tribal war, in superstition, and in beliefs that no outside power has ever found difficult to turn against us. It is not a comfortable thing to say in our own council. It is also the reason every imperialist force that came to Indochina found these highlands easy.\n\nThe self-declared Montagnard \"Republic\" and Leon Pignon's scheme behind it prove the point rather than refute it. A people governed in its own name by a French High Commissioner has not yet learned to govern itself, and there is no dignity in pretending otherwise.\n\nSo we will learn. The Dan-Vuong model is to be taught in our schools, our markets and our village councils, so that when autonomy comes to us within [VIE.GetNameDef] there are men on this plateau able to exercise it. We are to be compatriots, and compatriots are made rather than proclaimed."
 FUL_DanVuong_Model.1.a: "We are one! We are Vietnamese after all!"

 FUL_DanVuong_Model.2.t: "Nam-Hung's Visit to the Central Highlands"
 FUL_DanVuong_Model.2.d: "The Emperor has come up to Da-Lat. Nam-Hung travelled two days from Phu-Xuan by train and armoured car under the protection of Field Marshal Tran-Quang-Vinh, bringing with him a delegation of Phuc-Quoc veterans - Ngo-Dinh-Diem, Hoang-Nam-Hung and Nguyen-Rinh-Nhiep - into the spa town that served Bao-Dai as a summer capital.\n\nThe party was seen at the Xuan-Huong lake, along the Cote d'Azur, at the Lycee Yersin, and at the new Da-Lat cadet academy, where the Emperor spoke briefly to the officers in training about dreams and about struggle, and said that a nation in difficulty is held up by nothing else.\n\nWhat was not visited has drawn more comment than what was. The route bypassed every one of Bao-Dai's palaces and villas in these hills, and the Emperor described them within hearing of the press as a total waste of money and resources in wartime. The tour is expected to go on to Bao-Loc, Ban-Me-Thuot and Dar-Lac before returning to the capital."
 FUL_DanVuong_Model.2.db: "The Emperor has come up to Da-Lat. Nam-Hung travelled two days from Phu-Xuan by train and armoured car under the protection of Field Marshal Tran-Quang-Vinh, bringing with him a delegation of Phuc-Quoc veterans - Hoang-Nam-Hung and Nguyen-Rinh-Nhiep - into the spa town that served Bao-Dai as a summer capital. The absence from that list of the name everyone expected to find on it has been noted in every drawing room in the highlands.\n\nThe party was seen at the Xuan-Huong lake, along the Cote d'Azur, at the Lycee Yersin, and at the new Da-Lat cadet academy, where the Emperor spoke briefly to the officers in training about dreams and about struggle, and said that a nation in difficulty is held up by nothing else.\n\nWhat was not visited has drawn more comment than what was. The route bypassed every one of Bao-Dai's palaces and villas in these hills, and the Emperor described them within hearing of the press as a total waste of money and resources in wartime. The tour is expected to go on to Bao-Loc, Ban-Me-Thuot and Dar-Lac before returning to the capital."
 FUL_DanVuong_Model.2.a: "We are looking forward to hosting you at Bao-Loc!"
 FUL_DanVuong_Model.2.b: "We are looking forward to visiting Bao-Loc!"

 # Economic

 # Economic Committee
 FUL_Econ_Committee.1.t: "Formation of the Montagnard Economic Committee"
 FUL_Econ_Committee.1.d: "Among the provisions of Quy-Che 16, agreed between the Chief of State and High Commissioner Pignon, was the establishment of the \"Hoi-Dong Kinh-Te Xu-Thuong\", the Economic Committee of the Highlands. It has now been constituted, and it holds the whole of the economic authority for the Crown Domain: proposals, planning and policy alike.\n\nIts first announcement is a wave of reform aimed squarely at the tribes. Montagnards are to have the right to hold land in their own names, which no administration on this plateau has ever granted them, and a programme of infrastructure works follows behind it.\n\nLand title is the substantial part and everything else is decoration. A people who cannot own what they farm may be moved off it by any planter with a concession and a lawyer, and that has been the entire history of these highlands. Whether the right survives contact with the concessions already granted is what the Committee will be judged on."
 FUL_Econ_Committee.1.a: "We will ensure economic prosperity for the region."

 # Colonel Massau's Proposal
 Colonel_Massau.1.t: "Colonel Jacques Massau's Proposal"
 Colonel_Massau.1.d: "There is a proposal from 1949 in the files which was shelved and never quite killed. Colonel Jacques Massu put it forward and High Commissioner d'Argenlieu approved it: retired French soldiers to be settled on the montagnard plateau, given land, and established there as planters.\n\nIt was suspended indefinitely when Bao-Dai returned, for reasons of politics rather than of merit. What it was intended to accomplish was two things at once - a French population rooted in the highlands to hold French interests there without the expense of a garrison, and the development of a region whose economic potential nobody has ever seriously worked.\n\nThe potential is still there and so is the money that would follow it. So is the objection. A colony of armed French veterans planted on ground that Vietnamese and montagnards both claim is not a settlement scheme; it is a future war with a French return address on it."
 Colonel_Massau.1.a: "We need the money!"
 Colonel_Massau.1.b: "This would only divide our nation."

 # French Economic Aid
 French_Econ_Aid.1.t: "The Crown Domain of the Southern Highlands Request Economic Aid"
 French_Econ_Aid.1.d: "The Crown Domain of the Southern Highlands has requested economic aid from the French government. The request was made by the President of the Crown Domain, Leon Pignon, and was approved by the French High Commissioner, Georges Thierry d'Argenlieu. The aid will be used to help the Crown Domain of the Southern Highlands develop its economy and infrastructure."
 French_Econ_Aid.1.a: "Okay."
 French_Econ_Aid.1.b: "No."

 French_Econ_Aid.2.t: "The French Accept."
 French_Econ_Aid.2.d: "The French government has accepted the request for economic aid from the Crown Domain of the Southern Highlands. The aid will be used to help the Crown Domain of the Southern Highlands develop its economy and infrastructure."
 French_Econ_Aid.2.a: "We shall help the Crown Domain of the Southern Highlands develop its economy and infrastructure."

 French_Econ_Aid.3.t: "The French Refuse."
 French_Econ_Aid.3.d: "The French government has refused the request for economic aid from the Crown Domain of the Southern Highlands. The government has cited the Crown Domain of the Southern Highlands' lack of economic development and infrastructure as the reason for the refusal."
 French_Econ_Aid.3.a: "We shall not tolerate any form of Neo-Imperialism!"

 # Central Highland Railway
 Central_Highland_Railway.1.t: "The Central Trans-Indochinese Highland Railway"
 Central_Highland_Railway.1.d: "A delegation of appointed officials from the Domain of the Southern Highland arrived at the palace with a party of French planters and asked for a personal audience with [GetVIEChiefOfState]. They came with a map.\n\nWhat they propose is the \"Central Trans-Indochinese Highland Railway\": some seven hundred kilometres of line running the length of the steppe below the Annamite Range. The present journey takes seventeen hours in good weather, and the planters put it at two hours less once the line is open. That sounds a thin return until one remembers that the whole economy of the highlands presently moves at the speed of a road which washes out every wet season.\n\nThe planters will find a quarter of the cost from their own pockets, and French contractors and French engineering will do the building. We are asked for the remaining three quarters, and for the security. The line runs for its whole length through country in which the Viet Minh moves as it pleases, and every kilometre of it will have to be guarded for as long as it takes to lay."
 Central_Highland_Railway.1.a: "An ambitious plan, we shall approve it!"
 Central_Highland_Railway.1.b: "We cannot fund a railway and a war at the same time"

 Central_Highland_Railway.2.t: "The Central Trans-Indochinese Highland Railway Plan is Approved"
 Central_Highland_Railway.2.d: "After rounds of negotiation between officials and French plantation owners, our plan to build the Central Trans-Indochinese Highland Railway is approved. We shall begin the railway construction as soon as possible with both government funded and privately funded money to pay the workers. Hopefully this railway will please everyone once it is done!"
 Central_Highland_Railway.2.a: "Excellent!"

 Central_Highland_Railway.3.t: "The Central Trans-Indochinese Highland Railway Plan is Rejected"
 Central_Highland_Railway.3.d: "Despite our best attempt to negotiate with officials and French plantation owners alike, it seems that they rejected our plan for a Central Trans-Indochinese Highland Railway. Unfortunately, this means we will have to rely on the older and longer route to get to our destination then."
 Central_Highland_Railway.3.a: "All of that for nothing."

 Central_Highland_Railway.4.t: "Opening of the Central Trans-Indochinese Highland Railway"
 Central_Highland_Railway.4.d: "Today, we celebrate the opening of the Central Trans-Indochinese Highland Railway. With this railway, we can get around between cities within the railways quicker than before. This is another victory for citizens and plantation owners alike!"
 Central_Highland_Railway.4.a: "Excellent!"

 Central_Highland_Railway.5.t: "The Central Trans-Indochinese Highland Railway is Finished"
 Central_Highland_Railway.5.d: "Great news! After all of the hard work building and securing the railway construction from Viet-Minh sabotage, we managed to get the railway done in time for the grand opening. Let's hope that this project will pay off in the long run."
 Central_Highland_Railway.5.a: "Excellent!"

 # Military

 # Montagnard Armed Forces
 FUL_Armed_Forces.1.t: "Modernizing Our Armed Forces"
 FUL_Armed_Forces.1.d: "The Crown Domain of the Southern Highlands has requested modernization of its armed forces. The request was made by the President of the Crown Domain, Leon Pignon, and was approved by the French High Commissioner, Georges Thierry d'Argenlieu. The modernization will be used to help the Crown Domain of the Southern Highlands defend itself against local Montagnard revolts and Viet-Minh incursions."
 FUL_Armed_Forces.1.a: "We shall modernize our armed forces."

 FUL_Armed_Forces.2.t: "The Central Highlands Request Military Aid"
 FUL_Armed_Forces.2.d: "A telegram has reached [VIE.capital.GetName] and the Ministry of Defence from [FUL.capital.GetName], and its tone comes close to open pleading.\n\nThe Crownland asks for equipment and for advisers, urgently. The returns they enclose explain why. The bulk of what their formations carry dates from the 1910s and the 1930s, and a good deal of it was obsolete when the French first issued it to them. Against montagnard revolts in their own districts and Viet Minh columns coming down off the border, it is not enough, and they say so themselves.\n\nWe have equipment of exactly that vintage sitting in depots because we have replaced it. We also have units of our own still waiting on the replacements."
 FUL_Armed_Forces.2.a: "We will send some of our older equipment."
 FUL_Armed_Forces.2.b: "We don't even have equipment for ourselves, we cannot lend anything."

 FUL_Armed_Forces.3.t: "[VIE.GetLeader] Approves Sending Military Support"
 FUL_Armed_Forces.3.d: "Our urgent request for immediate military assistance and materials has been approved by [VIE.capital.GetName], and the first shipments of their military assistance will arrive shortly soon to our capital. These new assets will undoubtedly help us greatly in combatting our current enemies and stabilize the territories in the name of the Quoc-Gia cause!"
 FUL_Armed_Forces.3.a: "We won't forget their assistance!"

 FUL_Armed_Forces.4.t: "[VIE.GetLeader] Refuses Us"
 FUL_Armed_Forces.4.d: "[VIE.capital.GetName] has refused us. Our request for immediate military assistance and materials is declined, and the reason given is that they are short themselves - constant supply difficulties, and daily fighting between their army and the communists which consumes whatever reaches them.\n\nIt may even be true. It is certainly convenient, and it leaves us precisely where we stood: holding a frontier with rifles older than most of the men carrying them, against an enemy who is better armed every month that passes.\n\nThe territories must still be held and the Quoc-Gia cause must still be served in them. Since the equipment will not be given to us, it will have to be come by in other ways, and the council would be well advised not to enquire too closely what those ways are."
 FUL_Armed_Forces.4.a: "We shall ask the French next time."

 # Militarizing the FUL-VIE Border
 Militarize_Viet_Border.1.t: "Further Militarization in the Central Highlands"
 Militarize_Viet_Border.1.d: "The Crown Domain of the Southern Highlands has asked for its frontier with Vietnam to be militarised further. President Pignon made the request and High Commissioner d'Argenlieu has approved it.\n\nThe justification offered is entirely internal: montagnard revolts in the Domain's own districts, and Viet Minh columns working the highland passes. Both are real, both are worsening, and neither can be answered by the security battalions at their present strength.\n\nWhat the request does not trouble to explain is why a defence against revolt and infiltration should be built along the Vietnamese border in particular, rather than around the districts actually in revolt. Nobody in Da-Lat has raised the question. Nobody in Saigon has failed to notice it."
 Militarize_Viet_Border.1.a: "Post the battalions, and let Saigon draw its own conclusions"

