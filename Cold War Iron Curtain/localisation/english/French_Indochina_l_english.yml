FRE_Preparation_Ready: "Prepared Defensive Position"
FRE_Preparation_Ready_desc: "The garrison has a rehearsed plan and enough warning to meet the opening assault in order."
FRE_Preparation_Supported: "Reinforced Defensive Position"
FRE_Preparation_Supported_desc: "Earlier preparation or battlefield experience has brought additional fire support and reserves into the position."
FRE_Preparation_Maximum: "Concentrated Theatre Reserve"
FRE_Preparation_Maximum_desc: "Air, artillery and mobile reserves have been concentrated for the immediate battle."
FRE_Limited_Operation_Light: "Light Operational Commitment"
FRE_Limited_Operation_Light_desc: "A narrow commitment limits exposure, but gives the field force little margin for delay."
FRE_Limited_Operation_Standard: "Standard Operational Commitment"
FRE_Limited_Operation_Standard_desc: "The expeditionary corps assigns the ordinary artillery, supply and reserve package to the operation."
FRE_Limited_Operation_Maximum: "Maximum Operational Commitment"
FRE_Limited_Operation_Maximum_desc: "The theatre reserve is concentrated behind this operation at substantial political and logistical cost."
FRE_Ops.1.t: "Commit the Expeditionary Reserve"
FRE_Ops.1.d: "The operational plan is ready, but its timetable depends on how much of the theatre reserve is placed behind it. A light commitment preserves strength at the cost of flexibility; a full commitment gives the field command every available advantage."
FRE_Ops.1.a: "Authorize a light commitment."
FRE_Ops.1.b: "Assign the standard reserve."
FRE_Ops.1.c: "Commit everything the theatre can spare."
FRE_Ops.1.e: "The war chest cannot sustain the operation."
FRE_Preparation.1.t: "The Battle of Vinh Yen"
FRE_Preparation.1.d: "The Viet Minh divisions are descending on the Vinh Yen position. De Lattre can concentrate the air and artillery reserve or trust the conventional line to absorb the assault."
FRE_Preparation.1.a: "Concentrate the air and artillery reserve."
FRE_Preparation.1.b: "Hold with the conventional line."
FRE_Preparation.2.t: "The Battle of Mao Khe"
FRE_Preparation.2.d: "The eastern outposts and coal district are under attack. River gunfire can reinforce the garrison, but committing the flotilla will draw scarce resources into the fight."
FRE_Preparation.2.a: "Bring the Dinassaut guns upriver."
FRE_Preparation.2.b: "The infantry will hold the position."
FRE_Preparation.3.t: "The Day River Line"
FRE_Preparation.3.d: "The offensive has spread across Ninh Binh, Phat Diem and the southern delta approaches. The line can be reinforced everywhere, or allowed to bend around the strongest attacks."
FRE_Preparation.3.a: "Hold the entire line at any cost."
FRE_Preparation.3.b: "Bend, but do not break."
FRE_Preparation.4.t: "The Hedgehog of Na San"
FRE_Preparation.4.d: "The entrenched camp is surrounded and wholly dependent on the airbridge. Sustaining it will test the transport force; without it, the isolated garrison must endure alone."
FRE_Preparation.4.a: "Sustain the airbridge."
FRE_Preparation.4.b: "The garrison stands largely alone."
FRE_Limited_Ops.1.t: "The Operation Concludes"
FRE_Limited_Ops.1.d_clean: "The assigned objectives were secured on schedule and the committed formations have disengaged in good order. The expeditionary corps retains the initiative."
FRE_Limited_Ops.1.d_costly: "The objectives were secured, but only after delay and attrition. The operation achieved its purpose without disguising its price."
FRE_Limited_Ops.1.d_aborted: "The operation was broken off before its objectives could be secured. The formations have returned to their lines, but the enemy will read the withdrawal correctly."
FRE_Limited_Ops.1.d_failure: "The allotted time has expired without securing the objectives. The expeditionary corps has withdrawn from the operation."
FRE_Limited_Ops.1.d_superseded: "Events elsewhere have overtaken the operation. No further commitment will be made to an objective the theatre can no longer support."
FRE_Limited_Ops.1.a: "Close the operational record."
FRE_Operation_Timer: "Operation Objective and Deadline"
FRE_Operation_Timer_desc: "This is the live CEFEO operation mission. Its expiry invokes the operation resolver; hover it for the clean-result window, current hold, and final deadline."
FRE_Limited_Operation_Status_tt: "Day §Y[?FRE.FRE_op_days_elapsed|0]§! of §Y[?FRE.FRE_op_deadline_y|0]§!. A clean result requires the objective by day §Y[?FRE.FRE_op_deadline_x|0]§!. Current consecutive objective hold: §Y[?FRE.FRE_op_objective_hold_days|0]§! days."
FRE_Abort_Limited_Operation: "Break Off the Operation"
FRE_Abort_Limited_Operation_desc: "Order the committed formations to disengage. The result will be recorded as an aborted operation."
FRE_Paratrooper_Interdiction_Raid: "Paratrooper Interdiction Raid"
FRE_Paratrooper_Interdiction_Raid_desc: "Use the methods proven at Lang Son to strike the supply network supporting the current Viet Minh campaign."
VIN_Abort_Limited_Campaign: "Call Off the Limited Offensive"
VIN_Abort_Limited_Campaign_desc: "Withdraw the committed formations before the campaign consumes further supplies."

