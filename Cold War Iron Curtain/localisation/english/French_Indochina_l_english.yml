#### FRE Focuses ####
# FRE 50's Focus Names
FRE_The_Situation_in_Route_Coloniale_4: "The Situation in Route Coloniale 4"
FRE_The_Situation_in_Route_Coloniale_4_desc: "Route Coloniale 4 (RC4) represents a critical supply artery connecting the Red River Delta to the Chinese border. The situation along this route has become increasingly precarious as Viet Minh forces have intensified their attacks on French convoys and outposts. We must conduct a comprehensive assessment of the security situation, identify vulnerable points, and develop strategies to secure this vital lifeline. The loss of RC4 would sever our connection to the northern frontier and embolden the enemy."
FRE_The_Fallout_of_the_Revers_Report: "The Fallout of the Revers Report"
FRE_The_Fallout_of_the_Revers_Report_desc: "General Revers' critical report on French strategy in Indochina has created a political firestorm in Paris. The report highlights strategic weaknesses, logistical failures, and questions the viability of our current approach. While the criticism is harsh, it forces us to confront uncomfortable truths about our military operations. We must address these concerns, implement necessary reforms, and restore confidence in our command structure. The political fallout threatens to undermine support for the war effort both at home and among our allies."
FRE_Send_De_lattre_de_Tassigny: "Send de Lattre de Tassigny"
FRE_Send_De_lattre_de_Tassigny_desc: "In response to the deteriorating situation, Paris has decided to send General Jean de Lattre de Tassigny to take command of the French Far East Expeditionary Corps. De Lattre brings with him a reputation for decisive leadership, strategic vision, and the ability to inspire both troops and civilians. His arrival represents a new chapter in our campaign-one marked by renewed energy, aggressive tactics, and a determination to turn the tide. Under his command, we will reorganize our forces, strengthen our defenses, and take the fight to the enemy with renewed vigor."
FRE_Prepare_for_the_Battle_of_Na_San: "Prepare for the Battle of Na San"
FRE_Prepare_for_the_Battle_of_Na_San_desc: "Na San has been identified as a critical defensive position that could serve as a bastion against Viet Minh advances in the northwest. The location offers natural defensive advantages, and with proper fortification, it could become an impregnable stronghold. We must prepare the position with extensive fortifications, stockpile supplies, and position our forces to repel any enemy assault. A successful defense at Na San would demonstrate our ability to hold key positions and provide a model for future defensive operations."
FRE_Operation_Lorraine: "Operation Lorraine"
FRE_Operation_Lorraine_desc: "Giap's Northwest offensive has placed Nghia Lo, the Tai country, and the new airhead at Na San under pressure. Salan proposes a great diversion up the Clear River: mobile groups and paratroopers will strike the supply depots around Phu Doan, forcing the enemy to turn east or risk losing the stores behind his offensive.\n\nThe depots are real, but so is the road home. We may drive deep and accept the danger, make a shorter raid, or keep the mobile groups near Na San. Lorraine will support the Northwest battle; it will not become a second war with its own peace."
FRE_Operation_Hirondelle: "Operation Hirondelle"
FRE_Operation_Hirondelle_desc: "Paratroopers will descend on Lang Son and the depots at Ky Lua, then open the road through Loc Binh before the enemy can close around them. The raid will win no territory; its measure is whether the columns reach their objectives and withdraw intact."
FRE_Prepare_for_the_Battle_of_Vinh_Yen: "Prepare for the Battle of Vinh Yen"
FRE_Prepare_for_the_Battle_of_Vinh_Yen_desc: "Vinh Yen represents a crucial test of our defensive capabilities and de Lattre's strategic vision. The battle will determine whether we can successfully defend key positions against determined Viet Minh assaults. Preparation involves fortifying positions, coordinating with Vietnamese forces, and ensuring adequate supplies and reinforcements. A victory at Vinh Yen would validate de Lattre's leadership and provide a much-needed boost to morale, while demonstrating our resolve to hold our ground."
FRE_Recruit_Germans_to_the_FFL: "Recruit Germans to the FFL"
FRE_Recruit_Germans_to_the_FFL_desc: "The French Foreign Legion has long been a source of experienced, motivated soldiers. In the aftermath of World War II, many German veterans find themselves without prospects in a devastated homeland. These men, hardened by years of combat, represent a valuable resource for our forces. By actively recruiting German veterans into the Foreign Legion, we can bolster our ranks with experienced soldiers who understand modern warfare. This recruitment drive will expand our operational capabilities and provide us with additional manpower for our campaigns."
FRE_Secure_American_Financing: "Secure American Financing"
FRE_Secure_American_Financing_desc: "The financial burden of the Indochina War has placed enormous strain on France's economy. American support has become increasingly crucial, not just for financial reasons, but also as a symbol of Western solidarity against communist expansion. Securing substantial American financing will provide us with the resources needed to sustain our operations, modernize our equipment, and maintain our forces in the field. This support also strengthens the political foundation of our campaign and demonstrates international commitment to our cause."
FRE_Operation_Mouette: "Operation Mouette"
FRE_Operation_Mouette_desc: "The mobile groups will drive into the Phu Nho Quan sector to find and break the regular formations threatening the southern edge of the delta. The ground is difficult and the enemy can disappear into it; holding the objective long enough to disrupt them matters more than planting a flag."
FRE_Prepare_for_the_Battle_of_Mao_Khe: "Prepare for the Battle of Mao Khe"
FRE_Prepare_for_the_Battle_of_Mao_Khe_desc: "Mao Khe presents another critical defensive challenge. The position must be prepared to withstand determined enemy attacks while serving as a base for future operations. Proper preparation involves not just military fortifications, but also coordination with local forces, intelligence gathering, and ensuring adequate logistical support. A successful defense at Mao Khe would further validate our defensive strategy and provide another example of our ability to hold key positions against superior numbers."
FRE_Operation_Brochet: "Operation Brochet"
FRE_Operation_Brochet_desc: "Eighteen French Union battalions will sweep the Hung Yen sector and force the embedded Viet Minh regiments into the open. Brochet succeeds only if the sector remains under our control through the clearing operation."
FRE_Operation_Castor: "Operation Castor"
FRE_Operation_Castor_desc: "Operation Castor (Beaver) is one of the most ambitious operations of the war-the establishment of an airhead at Dien Bien Phu. This remote valley in northwestern Vietnam will serve as a base to interdict enemy supply routes from Laos and challenge Viet Minh control of the region. The operation requires extensive air support, careful planning, and the commitment of significant resources. Success would create a major strategic advantage, but failure could result in the loss of an entire garrison. The stakes could not be higher."
FRE_Preparing_for_the_Final_Push: "Preparing for the Final Push"
FRE_Preparing_for_the_Final_Push_desc: "As the war enters its critical phase, we must prepare for what could be the decisive campaign. This final push will require the coordination of all our resources, the commitment of our best units, and the support of our allies. We must ensure that our forces are properly equipped, well-trained, and ready for the challenges ahead. The outcome of this final push will determine the future of French Indochina and shape the geopolitical landscape of Southeast Asia for decades to come."
FRE_Proclaim_Victory_in_Indochina: "Proclaim Victory in Indochina"
FRE_Proclaim_Victory_in_Indochina_desc: "Against all odds, we have achieved victory in Indochina. The enemy has been defeated, their forces scattered, and their leadership broken. This triumph represents the culmination of years of sacrifice, strategic planning, and military excellence. We can now proclaim victory and begin the process of establishing a stable, pro-French government in Vietnam. This victory secures French interests in the region and demonstrates the effectiveness of our military and political strategy."
FRE_The_Geneva_Accords: "The Geneva Accords"
FRE_The_Geneva_Accords_desc: "Facing mounting costs, political pressure, and the realization that a military solution may be unattainable, we have agreed to participate in peace negotiations at Geneva. These accords represent a diplomatic solution to the conflict, one that will likely result in the partition of Vietnam and the withdrawal of French forces. While not the victory we sought, the Geneva Accords offer a path to end the bloodshed and establish a framework for future relations. The conference will determine the fate of Indochina and shape the region's future."
FRE_The_Fall_of_Saigon: "The Fall of Saigon"
FRE_The_Fall_of_Saigon_desc: "The unthinkable has happened-Saigon has fallen to the enemy. This catastrophic defeat represents the complete collapse of our position in Indochina. The loss of the capital city, the seat of the State of Vietnam, marks the end of French influence in the region. Our forces are in disarray, our allies have lost confidence, and our strategic position has been completely undermined. This is not just a military defeat, but a political and strategic catastrophe that will have far-reaching consequences for France and the entire region."

# Finale availability tooltips (gated on the actual Indochina War outcome)
FRE_Proclaim_Victory_Available_tt: "§GDecisive victory§!: the §Yanti-communist cause§! must clearly dominate the struggle - more than double the communist score, and above 1000.\n\nAnd the map has to agree with the ledger. §RDien Bien Phu must not have fallen§!, and §Rnone of the Tai highlands, Hoa Binh, Ha Giang, the Pathet Lao base areas or the Nung marches may have gone over to Hanoi§!."
FRE_The_Geneva_Accords_Available_tt: "§YStalemate§!: available when the war has reached an §Yindecisive§! outcome - neither side has won decisively. This is the negotiated middle path."
FRE_The_Fall_of_Saigon_Available_tt: "§RCatastrophic defeat§!: the §Rcommunist cause§! must clearly dominate the struggle - more than double the anti-communist score, and above 1000."

#### FRE Events ####
# Narrative Events
FRE_Events.1.t: "The Situation in Route Coloniale 4"
FRE_Events.1.d: "The morning briefing brings grim news. Route Coloniale 4, our critical supply artery connecting the Red River Delta to the Chinese border, has become increasingly vulnerable. Intelligence reports indicate that Viet Minh forces have been systematically targeting our convoys, establishing ambush positions, and cutting our lines of communication. The situation demands immediate attention-we cannot allow this vital lifeline to be severed.\n\nAs you review the maps spread across your desk, the weight of command settles upon you. Each convoy lost means fewer supplies reaching our forward positions. Each outpost overrun emboldens the enemy. The assessment must be thorough, the response decisive. Your staff officers await your orders, their faces reflecting the gravity of the situation. The fate of our operations in the north may well depend on how we handle this crisis."
FRE_Events.1.a: "We must assess the situation immediately."

FRE_Events.2.t: "The Fallout of the Revers Report"
FRE_Events.2.d: "The report from General Revers has arrived like a thunderclap, and its echoes are already reaching Paris. The document is scathing in its criticism of our strategy, our logistics, and our overall approach to the war. Revers has not minced words-he has laid bare the weaknesses in our position, the failures in our planning, and the inadequacies of our response to the Viet Minh threat.\n\nYour office has become a storm center. Telegrams from Paris demand explanations. Your subordinates look to you for guidance. The press, both in France and abroad, is beginning to pick up on the story. The political fallout threatens to undermine support for the war effort at a critical moment. You must address this crisis, not just to defend your command, but to restore confidence in our mission. The question is: how do you respond?"
FRE_Events.2.a: "We will address these criticisms head-on."

FRE_Events.3.t: "A New Commander Arrives"
FRE_Events.3.d: "The news from Paris is both welcome and concerning. General Jean de Lattre de Tassigny has been appointed to take command of the French Far East Expeditionary Corps. De Lattre is a legend-a man who distinguished himself in both world wars, known for his strategic brilliance, his ability to inspire troops, and his uncompromising determination. His arrival represents a new chapter in this war.\n\nBut transitions of command are delicate things. De Lattre will need time to understand the situation, to build relationships with your staff, to coordinate with Vietnamese forces, and to implement his vision. The enemy will not wait. You must ensure that this transition is smooth, that de Lattre's arrival brings the energy and direction we so desperately need, rather than creating confusion and delay. The success of his command depends on how well you facilitate his arrival."
FRE_Events.3.a: "We will ensure de Lattre's successful integration."

FRE_Events.4.t: "Preparing for Na San"
FRE_Events.4.d: "The maps on your wall tell a story of strategic necessity. Na San, a remote position in the northwest, has been identified as a potential bastion-a place where we can establish a strong defensive position that could serve as a base for future operations and a symbol of our determination to hold the line. The terrain offers natural advantages, but those advantages mean nothing without proper preparation.\n\nYour engineers have submitted their plans. Your logistics officers have calculated the requirements. Your intelligence officers have assessed the enemy threat. Now it falls to you to coordinate this massive undertaking. Fortifications must be built, supplies stockpiled, positions prepared. The work is arduous, the conditions difficult, and the enemy is watching. But if we succeed, Na San could become a symbol of French resolve. If we fail, it will be another defeat in a war that cannot afford many more."
FRE_Events.4.a: "We will prepare Na San to be impregnable."

FRE_Events.5.t: "Preparing for Vinh Yen"
FRE_Events.5.d: "De Lattre has made his intentions clear: we will not simply react to enemy movements-we will take the initiative. Vinh Yen has been selected as the site for what could be a decisive battle. This is to be de Lattre's first major test, and the preparation must be flawless. The stakes could not be higher.\n\nCoordination with Vietnamese forces is essential. Intelligence gathering must be thorough. Supply lines must be secured. Every detail matters. As you review the operational plans, you can feel the weight of expectation. This battle could define de Lattre's command and set the tone for the entire campaign. Success would demonstrate our ability to take the fight to the enemy. Failure would be a devastating blow to morale and strategy alike."
FRE_Events.5.a: "We will prepare for victory at Vinh Yen."

FRE_Events.6.t: "Preparing for Mao Khe"
FRE_Events.6.d: "Another defensive position, another test of our resolve. Mao Khe presents different challenges than Na San-different terrain, different enemy approaches, different strategic considerations. But the fundamental question remains the same: can we hold our ground against determined enemy assaults?\n\nThe preparation work is familiar now, but no less critical. Every fortification, every supply depot, every defensive position must be prepared with care. The enemy has learned from our previous engagements, and they will adapt. We must be ready. The defense of Mao Khe is not just about holding a position-it's about demonstrating that we can maintain our presence in the face of enemy pressure, that we can turn defensive positions into offensive advantages."
FRE_Events.6.a: "We will prepare Mao Khe for defense."

# Success Events
FRE_Events.7.t: "RC4 Assessment Complete"
FRE_Events.7.d: "The assessment has been completed, and the results are encouraging. Your intelligence teams have identified the key vulnerabilities along Route Coloniale 4, mapped enemy positions, and developed a comprehensive plan to secure the route. Additional outposts have been established, convoy procedures have been improved, and coordination between units has been enhanced.\n\nThe route is now more secure, though the threat remains. Your assessment has provided valuable intelligence that will inform future operations. The enemy's tactics have been documented, their positions identified, and countermeasures implemented. This is a solid foundation for future success."
FRE_Events.7.a: "Excellent work."

FRE_Events.9.t: "Revers Report Addressed"
FRE_Events.9.d: "Your response to the Revers Report has been well-received. By acknowledging the valid criticisms while demonstrating your commitment to improvement, you have managed to turn a potential crisis into an opportunity for reform. The political situation has stabilized, and support for the war effort has been maintained.\n\nThe changes you've implemented address many of Revers' concerns. Logistics have been improved, coordination enhanced, and strategic planning refined. While challenges remain, you have shown that the command is capable of adaptation and improvement."
FRE_Events.9.a: "We have weathered the storm."

FRE_Events.11.t: "de Lattre's Arrival a Success"
FRE_Events.11.d: "General de Lattre has arrived, and his impact is immediately apparent. The transition has been smooth, his leadership style has energized the command, and his strategic vision has brought new clarity to our operations. The troops respond to his presence with renewed confidence, and your staff has integrated seamlessly with his command structure.\n\nDe Lattre's arrival marks a turning point. His aggressive approach, his attention to detail, and his ability to inspire have already begun to transform the campaign. With his leadership, we have a real chance to turn the tide of this war."
FRE_Events.11.a: "A new chapter begins."

FRE_Events.13.t: "Na San Preparation Successful"
FRE_Events.13.d: "The preparation of Na San has been completed successfully. The position is now heavily fortified, well-supplied, and ready to serve as a bastion against enemy advances. Your engineers have done exceptional work, creating defensive positions that take full advantage of the terrain.\n\nThe position is ready. When the enemy comes, they will find a prepared, determined force. Na San stands as a symbol of French resolve and military capability."
FRE_Events.13.a: "Na San is ready."

FRE_Events.15.t: "Vinh Yen Preparation Complete"
FRE_Events.15.d: "The preparation for the Vinh Yen offensive has been completed to de Lattre's exacting standards. Coordination with Vietnamese forces is excellent, intelligence is comprehensive, and all units are ready for action. The plan is sound, the forces are prepared, and the moment approaches.\n\nThis is de Lattre's first major test, and everything is in place for success. The preparation work has been thorough, the coordination exemplary. Victory at Vinh Yen would be a significant achievement."
FRE_Events.15.a: "We are ready for battle."

FRE_Events.17.t: "Mao Khe Preparation Successful"
FRE_Events.17.d: "Mao Khe has been prepared for defense. The position is fortified, supplied, and ready to repel enemy attacks. Your forces are well-positioned, your defenses are strong, and your resolve is clear.\n\nThe preparation work has been completed successfully. Mao Khe is ready to serve as a defensive bastion, demonstrating our ability to hold our ground against enemy pressure."
FRE_Events.17.a: "Mao Khe is prepared."

# Failure Events
FRE_Events.8.t: "RC4 Assessment Incomplete"
FRE_Events.8.d: "The assessment of Route Coloniale 4 has encountered significant difficulties. Enemy activity has disrupted intelligence gathering, key positions remain unassessed, and the comprehensive picture you hoped for has not materialized. The situation along RC4 remains unclear, and vulnerabilities persist.\n\nThe incomplete assessment means that future operations along this critical route will proceed with less information than desired. The enemy retains the advantage of uncertainty, and our response capabilities are limited."
FRE_Events.8.a: "We must do better."

FRE_Events.10.t: "Revers Report Fallout Continues"
FRE_Events.10.d: "Your response to the Revers Report has failed to quell the political storm. The criticisms continue to resonate, support for the war effort has been further undermined, and the political situation has deteriorated. The report's impact has been magnified rather than mitigated.\n\nThe fallout from this failure will continue to affect operations. Political support is weakened, morale has suffered, and the strategic situation has become more difficult. This is a significant setback."
FRE_Events.10.a: "This is a serious blow."

FRE_Events.12.t: "de Lattre's Arrival Problematic"
FRE_Events.12.d: "General de Lattre's arrival has been more difficult than anticipated. The transition has been rocky, coordination has been challenging, and the integration of his command style with existing structures has encountered friction. While de Lattre's leadership qualities are undeniable, the immediate impact has been mixed.\n\nThe transition period has been longer and more disruptive than hoped. While de Lattre will eventually establish his command, the delay has given the enemy opportunities, and the initial period has been less effective than it might have been."
FRE_Events.12.a: "We must work through these difficulties."

FRE_Events.14.t: "Na San Preparation Inadequate"
FRE_Events.14.d: "The preparation of Na San has fallen short of requirements. Supply difficulties, engineering challenges, and enemy interference have all contributed to an incomplete preparation. The position is not as fortified as it should be, supplies are not as comprehensive as needed, and the defensive capabilities are compromised.\n\nNa San is not ready. When the enemy comes, the position will be vulnerable. This failure represents a significant strategic setback."
FRE_Events.14.a: "This is unacceptable."

FRE_Events.16.t: "Vinh Yen Preparation Incomplete"
FRE_Events.16.d: "The preparation for the Vinh Yen offensive has encountered significant problems. Coordination with Vietnamese forces has been difficult, intelligence gathering has been incomplete, and logistical preparations have fallen short. The operation is not as well-prepared as it should be.\n\nDe Lattre's first major test will proceed under less than ideal circumstances. The preparation work has been inadequate, and the chances of success have been reduced."
FRE_Events.16.a: "We have failed in our preparation."

FRE_Events.18.t: "Mao Khe Preparation Inadequate"
FRE_Events.18.d: "The preparation of Mao Khe has been insufficient. Fortifications are incomplete, supplies are inadequate, and the defensive position is not as strong as it should be. The position is vulnerable, and our ability to hold it against determined enemy attacks is questionable.\n\nThis failure represents a significant problem. Mao Khe is not ready, and our defensive capabilities have been compromised."
FRE_Events.18.a: "We must improve our preparation."

#### FRE Decisions ####
FRE_Mission_Assess_RC4: "Assess Route Coloniale 4"
FRE_Mission_Assess_RC4_desc: "Deploy intelligence teams to conduct a comprehensive assessment of Route Coloniale 4. This mission requires political power to coordinate intelligence gathering, stability to maintain operational security, and adequate war support to ensure resources are available. Success depends on having sufficient political capital, stable internal conditions, and proper equipment stockpiles to support the assessment teams."

FRE_Mission_Address_Revers_Report: "Address Revers Report Fallout"
FRE_Mission_Address_Revers_Report_desc: "Respond to the political crisis created by General Revers' critical report. This mission requires significant political power to manage the crisis, high stability to weather the political storm, and strong war support to maintain public confidence. The success of this mission is heavily dependent on your political capital and the stability of your government."

FRE_Mission_De_Lattre_Arrival: "Ensure de Lattre's Successful Arrival"
FRE_Mission_De_Lattre_Arrival_desc: "Facilitate General de Lattre's transition into command. This mission requires political power to coordinate the transition, stability to ensure smooth operations, and war support to maintain morale during the leadership change. Success depends on having adequate resources and stable conditions to support de Lattre's integration into the command structure."

FRE_Mission_Prepare_Na_San: "Prepare Na San Position"
FRE_Mission_Prepare_Na_San_desc: "Fortify and prepare the Na San defensive position. This mission requires equipment stockpiles for fortifications, political power to coordinate logistics, stability to maintain supply lines, and army experience to properly plan defenses. Success is heavily dependent on having adequate equipment reserves and experienced officers to oversee the preparation work."

FRE_Mission_Prepare_Vinh_Yen: "Prepare Vinh Yen Offensive"
FRE_Mission_Prepare_Vinh_Yen_desc: "Coordinate the preparation for the Vinh Yen offensive operation. This mission requires equipment stockpiles for the offensive, political power to coordinate with Vietnamese forces, stability to maintain operational security, and army experience to plan the operation effectively. Success depends on having sufficient equipment, political capital, and military expertise."

FRE_Mission_Prepare_Mao_Khe: "Prepare Mao Khe Position"
FRE_Mission_Prepare_Mao_Khe_desc: "Fortify and prepare the Mao Khe defensive position. This mission requires equipment stockpiles for fortifications, political power to coordinate logistics, stability to maintain supply lines, and army experience to properly plan defenses. Success is heavily dependent on having adequate equipment reserves and experienced officers to oversee the preparation work."

