#### FRE Resource Trading Decisions ####
FRE_Trade_PP_For_Equipment: "Purchase Equipment with Political Capital"
FRE_Trade_PP_For_Equipment_desc: "Use political influence to acquire basic infantry equipment from French suppliers. Requires 50 PP and grants 5,000 units of equipment. A modest procurement option when immediate supplies are needed."

FRE_Trade_PP_For_Support_Equipment: "Purchase Support Equipment with Political Capital"
FRE_Trade_PP_For_Support_Equipment_desc: "Use political influence to acquire support equipment for your forces. Requires 50 PP and grants 1,000 units. Essential for maintaining proper logistics and unit effectiveness."

FRE_Trade_Stability_For_War_Support: "Rally Public Support"
FRE_Trade_Stability_For_War_Support_desc: "Launch a propaganda campaign to boost public support for the war effort. Requires 15%+ stability, costs 5% stability, and grants 8% war support. Trade internal cohesion for public enthusiasm."

FRE_Trade_War_Support_For_Stability: "Restore Internal Stability"
FRE_Trade_War_Support_For_Stability_desc: "Focus on internal governance and stability at the cost of public war enthusiasm. Requires 15%+ war support, costs 5% war support, and grants 8% stability. Useful when internal stability is critical."

FRE_Trade_Equipment_For_PP: "Sell Equipment for Political Capital"
FRE_Trade_Equipment_For_PP_desc: "Liquidate excess equipment stockpiles to generate political capital. Requires 10,000+ infantry equipment, sells 10,000 units, and grants 40 PP. A modest trade when political capital is urgently needed."

FRE_Shady_Political_Work: "Engage in Shady Political Maneuvers"
FRE_Shady_Political_Work_desc: "Use underhanded political tactics to gain influence. Requires 10%+ war support, costs 3% war support, and grants 25 PP. Risky but effective when desperate for political capital."

FRE_Expedited_Equipment_Procurement: "Expedited Equipment Procurement"
FRE_Expedited_Equipment_Procurement_desc: "Pull all strings to rapidly acquire equipment. Requires 100+ PP and 25%+ stability, costs 100 PP and 3% stability, and grants 12,000 infantry equipment and 2,000 support equipment. A comprehensive procurement package for critical operations."

#### FRE Operation Events ####
FRE_Events.19.t: "Operation Lorraine: The Major Offensive"
FRE_Events.19.d: "The time has come to launch Operation Lorraine, our most ambitious offensive into Viet Minh territory. This is a major operation that will test our forces and coordination with Vietnamese allies. Success here could significantly shift the balance in the Northern front, but failure would be a devastating blow to our war effort.\n\nWe must commit substantial resources - political capital, equipment, and stability - to ensure this operation succeeds. The battle will be fierce, and the outcome will determine the course of the war in the North."
FRE_Events.19.a: "Launch Operation Lorraine"

FRE_Events.20.t: "Operation Hirondelle: Airborne Assault"
FRE_Events.20.d: "Operation Hirondelle represents our first major airborne operation in Indochina. Paratroopers will be dropped behind enemy lines to disrupt Viet Minh supply routes and communications. This operation requires significant air assets and coordination.\n\nSuccess will unlock new paratrooper raid capabilities and demonstrate our ability to strike deep into enemy territory. However, airborne operations are inherently risky, and failure could result in the loss of valuable paratrooper units and equipment."
FRE_Events.20.a: "Launch Operation Hirondelle"

FRE_Events.21.t: "Operation Mouette: Naval Assault"
FRE_Events.21.d: "Operation Mouette is our major naval and amphibious operation along the Indochinese coast. Naval forces will support amphibious landings to strike at Viet Minh positions from the sea. This operation requires a strong naval presence and coordination between sea and land forces.\n\nSuccess will demonstrate our naval superiority and ability to project power along the coast. Failure would be a significant setback to our naval operations and could embolden the enemy."
FRE_Events.21.a: "Launch Operation Mouette"

FRE_Events.22.t: "Operation Brochet: The Northern Push"
FRE_Events.22.d: "Operation Brochet is another major offensive into the Northern front. Building on previous operations, this push aims to further disrupt Viet Minh operations in the North. The operation requires substantial ground forces and equipment.\n\nSuccess will continue to pressure the enemy in the North and maintain our momentum. Failure would allow the Viet Minh to regroup and counterattack."
FRE_Events.22.a: "Launch Operation Brochet"

FRE_Events.23.t: "Operation Castor: Dien Bien Phu"
FRE_Events.23.d: "Operation Castor will turn the isolated valley at Dien Bien Phu into an airborne fortified camp. The drop can begin only while French-aligned troops still control the landing ground. Once committed, they must retain it for fourteen consecutive days while engineers organize the perimeter and the airbridge. If control is broken, the count begins again; after thirty days the effort is abandoned.\n\nA full drop commits more transports, manpower, and political credit to establish a larger garrison. A limited drop is cheaper and leaves the camp more exposed. Establishing the airhead prepares the position for the battle to come; it does not win that battle in advance."
FRE_Events.23.a: "Commit the full airborne group."
FRE_Events.23.b: "Make a limited drop with the available lift."
FRE_Events.23.c: "We cannot sustain the operation."
FRE_Castor_Full_Drop_tt: "Spend §Y[?FRE.FRE_Castor_Full_Price|0] War Credits§!, commit §Y4,000 Manpower§! and §Y6 Transport Planes§!, and lose §R6 Metropole Patience§!. Brochet and Na San have already been reflected in this price. The full airborne group establishes a reinforced camp garrison. Hold the landing ground for §Y14 consecutive days§! within a §Y30-day establishment window§!."
FRE_Castor_Limited_Drop_tt: "Spend §Y[?FRE.FRE_Castor_Limited_Price|0] War Credits§!, commit §Y2,500 Manpower§! and §Y4 Transport Planes§!, and lose §R3 Metropole Patience§!. Brochet and Na San have already been reflected in this price. A smaller airborne group establishes a lighter camp garrison. Hold the landing ground for §Y14 consecutive days§! within a §Y30-day establishment window§!."
FRE_Castor_Unfunded_tt: "The focus closes without an airborne deployment. No camp is established and Operation Castor enters cooldown."

#### FRE Operation Success/Failure Events ####
FRE_Events.24.t: "Operation Lorraine: Success!"
FRE_Events.24.d: "Operation Lorraine has been a resounding success! Our forces have pushed deep into Viet Minh territory, disrupting their supply lines and inflicting heavy casualties. The coordinated offensive with Vietnamese forces has proven highly effective.\n\nThe Northern front has been significantly strengthened, and the enemy is on the defensive. This victory has boosted morale and demonstrated our capability to conduct large-scale offensive operations."
FRE_Events.24.a: "Excellent work!"

FRE_Events.25.t: "Operation Lorraine: Failure"
FRE_Events.25.d: "Operation Lorraine has failed. Despite our best efforts, the offensive was repulsed with heavy losses. The Viet Minh were better prepared than anticipated, and our forces were unable to achieve their objectives.\n\nThis failure is a significant setback. The enemy has been emboldened, and our position in the North has been weakened. We must regroup and learn from this defeat."
FRE_Events.25.a: "This is a serious setback."

FRE_Events.26.t: "Operation Hirondelle: Success!"
FRE_Events.26.d: "Operation Hirondelle has succeeded! Our paratroopers successfully dropped behind enemy lines, disrupting Viet Minh communications and supply routes. The airborne operation has proven the viability of paratrooper raids in this theater.\n\nWe have now unlocked new paratrooper raid capabilities that will allow us to strike deep into enemy territory. This success has opened new tactical options for future operations."
FRE_Events.26.a: "The paratroopers have proven their worth!"

FRE_Events.27.t: "Operation Hirondelle: Failure"
FRE_Events.27.d: "Operation Hirondelle has failed. The paratrooper drop encountered heavy enemy resistance, and many of our airborne forces were lost. The operation did not achieve its objectives.\n\nThis failure has cost us valuable paratrooper units and equipment. We must reassess our airborne capabilities before attempting similar operations."
FRE_Events.27.a: "We have paid a heavy price."

FRE_Events.28.t: "Operation Mouette: Success!"
FRE_Events.28.d: "Operation Mouette has succeeded! Our naval forces successfully supported amphibious landings along the coast, striking at Viet Minh positions from an unexpected direction. The coordination between naval and ground forces was exemplary.\n\nThis success demonstrates our naval superiority and ability to project power along the Indochinese coast. The enemy has been forced to divert resources to defend against our naval threat."
FRE_Events.28.a: "The navy has proven its value!"

FRE_Events.29.t: "Operation Mouette: Failure"
FRE_Events.29.d: "Operation Mouette has failed. The amphibious landings encountered heavy resistance, and our naval forces were unable to provide adequate support. The operation did not achieve its objectives.\n\nThis failure is a setback to our naval operations. We must reassess our amphibious capabilities and naval coordination."
FRE_Events.29.a: "We must improve our naval operations."

FRE_Events.30.t: "Operation Brochet: Success!"
FRE_Events.30.d: "Operation Brochet has succeeded! Our forces have pushed further into the Northern front, maintaining pressure on the Viet Minh and disrupting their operations. The offensive has been well-coordinated and effective.\n\nThis success continues our momentum in the North and keeps the enemy off-balance. Our position in the Northern front has been strengthened."
FRE_Events.30.a: "We maintain the initiative!"

FRE_Events.31.t: "Operation Brochet: Failure"
FRE_Events.31.d: "Operation Brochet has failed. The offensive was unable to achieve its objectives, and our forces were forced to withdraw. The Viet Minh have successfully defended their positions.\n\nThis failure has allowed the enemy to regroup and counterattack. Our position in the North has been weakened, and we must reassess our strategy."
FRE_Events.31.a: "We must regroup."

FRE_Events.32.t: "Operation Castor: Dien Bien Phu Established!"
FRE_Events.32.d: "For fourteen days the paratroopers, engineers, and air crews have kept the landing ground open. The perimeter is organized, the first permanent works are complete, and the valley can now receive a sustained garrison by air. Operation Castor has established the camp it was ordered to build.\n\nThe achievement is preparatory, not decisive. Dien Bien Phu remains remote, dependent on the airbridge, and exposed to the heights around it. If the Viet Minh commit their main force here, whether the camp can survive will be decided by the campaign that follows."
FRE_Events.32.a: "The airhead is established. Prepare to defend it."

FRE_Events.33.t: "Operation Castor Concludes"
FRE_Events.33.d: "The airborne group could not keep the Dien Bien Phu landing ground secure for fourteen consecutive days. Counterattacks repeatedly broke the perimeter, and the thirty-day establishment window has closed. The surviving detachments are being withdrawn before the exposed airbridge consumes more of the expeditionary reserve.\n\nNo fortified camp has been established. The lost men and political confidence are charged to the scale of the deployment that was attempted."
FRE_Events.33.d_unfunded: "The transports and political credit required for even a limited airborne deployment were not available. Operation Castor has been removed from the schedule without putting a garrison into the valley. No camp has been established."
FRE_Events.33.d_landing_lost: "The landing ground at Dien Bien Phu was lost before the airborne deployment could begin. With no secure strip on which to organize the perimeter, Operation Castor has been cancelled. No transports or expeditionary formations were committed, and no fortified camp has been established."
FRE_Events.33.d_superseded: "Events elsewhere have overtaken the proposed airhead. With the war or its settlement now governing the whole theatre, the airborne deployment is being unwound without claiming either an operational success or a battlefield defeat."
FRE_Events.33.a: "Close the operation's ledger."

