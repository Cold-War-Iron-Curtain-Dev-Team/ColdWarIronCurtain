 #ideas
 BRA_Mongrel_Complex: "Mongrel Complex"
 BRA_Mongrel_Complex_desc: "The Mongrel Complex stems from its historical experiences, including colonization and slavery, which have shaped a diverse yet challenging social landscape. Many Brazilians compare themselves to European and American standards of progress, which can overshadow their own achievements and foster feelings of inadequacy.\n\nThis sense of inferiority is evident in culture, where Brazilian artists often measure their worth against foreign influences. In politics and the economy, the desire for development leads Brazilians to seek external models of governance and industry, often ignoring their own unique strengths, such as vibrant cultural heritage and natural resources."

BRA_Legacy_of_the_Estado_Novo: "Legacy of the Estado Novo"
BRA_Legacy_of_the_Estado_Novo_desc: "Despite the end of Getúlio Vargas' dictatorship in 1945, its structures still linger in Brazilian politics. Being loved by many among the population for his legacy as a paragon for the rights of the common workingman, and his charisma as a populist, close to the people who clashed with the traditional political elite.\n\nEven after being overthrown in 1945, Vargas still enjoyed ample popularity, being elected Senator by two states and legislator by six, and the lack of identification of the opposition parties among the syndicate population, it's without a doubt that any political advance by Vargas would meet overwhelming support. "

BRA_Communist_Agitation: "Communist Agitation"
BRA_Communist_Agitation_desc: "The PCB has been a thorn in our side since its foundation in 1922. Despite being banned for the third time by President Dutra in 1947 and its parliamentarians revoked in the following year, its popularity among the working class is undeniable, gaining over half a million votes in the 1945 elections, making them truly an enemy we cannot underestimate."

BRA_Coffee_Economy: "Coffee Economy"
BRA_Coffee_Economy_desc: "Producing a third of the entire world's supply of coffee, Brazil is by far the world's largest coffee producer on the planet. The states of São Paulo, Minas Gerais and Paraná house most of the plantations due to their ideal growing conditions thank to the climate. With over 60% of Brazil's exports being of coffee alone, it has been a staple of the country's economy since the beginning, enjoyed by many countries in the world due to its unique flavor, with Brazilian Coffee sometimes assuming a status of a luxury good in some."

BRA_ISI: "Import Substitution Industrialization"
BRA_ISI_desc: "Import Substitution Industrialization, or ISI for short was a strategy adopted by Vargas with the aim of reducing Brazil's dependence on imported goods and to cope with the Great Depression. This policy aimed to encourage domestic production, fostering the development of national industries. The central idea was to replace imported goods with locally manufactured products, strengthening the domestic economy and creating jobs in the country. \n\nBy encouraging domestic production, the Vargas government sought to create a solid industrial base in Brazil. This was essential for the modernization of the Brazilian economy, which until then had been predominantly agricultural. The Import Substitution Policy also had a significant impact on the country's trade balance, reducing the deficit and promoting self-sufficiency in various sectors."

BRA_Underdeveloped_Infrastructure: "Underdeveloped Infrastructure"
BRA_Underdeveloped_Infrastructure_desc: "Roads, railways and industry have always concentrated in the coast and in the huge population and economic centers, leaving much of the interior of the country Underdeveloped."

BRA_Veterans_of_Monte_Castelo: "Veterans of Monte Castelo"
BRA_Veterans_of_Monte_Castelo_desc: "The FEB fought bravely in Italy in World War II, these veterans brought combat experience and glory home."

BRA_Weak_Arms: "Weak National Arms Industry"
BRA_Weak_Arms_desc: "Our national arms industry is lackluster, making us heavily reliant on imports."

BRA_Amazon_Frontier: "Amazon Frontier"
BRA_Amazon_Frontier_desc: "There are many untouched riches waiting to be claimed in the Amazon Region. With careful and right investments, we could take advantage of our natural treasures to boost our nation like it never has been."

BRA_Vale: "Vale S.A."
BRA_Vale_desc: "The Companhia do Vale do Rio Doce, or Vale for short is a national mining company funded by Vargas in 1942. It operates mainly feeding iron from Brazil's rich iron deposits to the steel mills around the country, Due to the lack of demandm it expands slowly, but with the right guidance, it can become one of the largest companies on the planet."

BRA_Rural_Exodus: "Rural Exodus"
BRA_Rural_Exodus_desc: "Each month, countless families leave the rural countryside of our nation, motivated by better living conditions and employement, driven by factors such as industrialization and the mechanization of agriculture, which cause unemployment in the countryside and opportunities in the big cities. Coming mostly from the Northeast and seeking to escape the harsh droughts that affect the region yearly, coming to the metropolitan zones of São Paulo and Rio de Janeiro. While this creates more workforce in the urban centres, it also causes disorderly growth of urban areas, creation of precarious infrastructure, increase in informality and the lack of labor in the countryside, with impacts on agricultural production and rural development."

 BRA_Vargas_INPA_Research: "National Institute of Amazonian Research"
 BRA_Vargas_INPA_Research_desc: "The INPA drives a national push for scientific research."
 BRA_Gomes_US_Tech_Share_Idea: "American Technology Sharing"
 BRA_Gomes_US_Tech_Share_Idea_desc: "Technology sharing agreements with the United States accelerate our research."
 BRA_Korean_War_Volunteers: "Volunteers for Korea"
 BRA_Korean_War_Volunteers_desc: "Brazilian volunteers are permitted to fight alongside our allies in Korea."
 BRA_Military_Police_Occupation_Doctrine: "Military Police Occupation Doctrine"
 BRA_Military_Police_Occupation_Doctrine_desc: "Our military police are trained to administer occupied territory."
 BRA_Kubitschek_Food_Program: "Kubitschek Food Program"
 BRA_Kubitschek_Food_Program_desc: "Investment in agriculture increases output and lowers the cost of feeding the nation."
