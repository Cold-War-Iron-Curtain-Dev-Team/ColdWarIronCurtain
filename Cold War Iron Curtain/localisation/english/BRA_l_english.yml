 BRA_Mongrel_Complex: "Mongrel Complex"
 BRA_Mongrel_Complex_desc: "The Mongrel Complex stems from its historical experiences, including colonization and slavery, which have shaped a diverse yet challenging social landscape. Many Brazilians compare themselves to European and American standards of progress, which can overshadow their own achievements and foster feelings of inadequacy.\n\nThis sense of inferiority is evident in culture, where Brazilian artists often measure their worth against foreign influences. In politics and the economy, the desire for development leads Brazilians to seek external models of governance and industry, often ignoring their own unique strengths, such as vibrant cultural heritage and natural resources."
