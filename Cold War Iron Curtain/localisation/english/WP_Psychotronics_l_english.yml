l_english:
 WP_PSYCHOTRONICS_MODE: "Warsaw Pact Psychotronics"
 RULE_OPTION_WP_PSYCHOTRONICS_HISTORICAL: "Historical — Prague File"
 RULE_OPTION_WP_PSYCHOTRONICS_HISTORICAL_DESC: "From 1967, a communist Czechoslovakia may open one psychotronics section, commission one demonstration study, and forward the finding to Moscow. East Germany may later file one watch note on that file. The finding records that a controlled repeat did not support the demonstration. No method is granted."
 RULE_OPTION_WP_PSYCHOTRONICS_OFF: "Off"
 RULE_OPTION_WP_PSYCHOTRONICS_OFF_DESC: "The Czechoslovak section and the East German watch note are neither initialized nor displayed. No file is sent to Moscow by this system."

 WP_PSYCHOTRONICS: "Psychotronics Section"
 WP_PSYCHOTRONICS_desc: "Research record: [?CZE_psych_record|0]/100\nScrutiny: [?CZE_psych_scrutiny|0]/100\n\nOne section and one study. A finished file says a controlled repeat did not support the demonstration. Closing the section is permanent."

 CZE_psych_open_section: "Open a Psychotronics Section"
 CZE_psych_open_section_desc: "A domestic research circle has been collecting demonstration claims. Opening a section gives those claims a file. It does not establish a method."
 CZE_psych_open_section_tt: "The section opens. Research record §G+5§!. A demonstration study becomes available. No method is granted."

 CZE_psych_commission_demonstration: "Commission the Demonstration Study"
 CZE_psych_commission_demonstration_desc: "Order a controlled look at the demonstration claims. The study occupies the only slot until its report is archived or the section is closed."
 CZE_psych_commission_demonstration_tt: "A §Y90-day§! study starts, then a §Y30-day§! review. Scrutiny §R+2§!. The slot stays occupied until the report is archived or the section is closed."

 CZE_psych_demo_research: "Demonstration Study"
 CZE_psych_demo_research_desc: "The section is comparing the demonstration claims with a controlled repeat."

 CZE_psych_demo_review: "Review the Demonstration"
 CZE_psych_demo_review_desc: "The report is being written into the file. If this review runs out, the file is archived with the same finding as the manual archive."

 CZE_psych_archive_demonstration: "Archive the Demonstration"
 CZE_psych_archive_demonstration_desc: "File the report. The finding is already fixed: the demonstration did not survive a controlled repeat."
 CZE_psych_archive_demonstration_tt: "The finding is filed: a controlled repeat did not support the demonstration. Research record §G+10§!. The slot empties."

 CZE_psych_forward_file: "Forward the File to Moscow"
 CZE_psych_forward_file_desc: "Send the archived finding as a foreign research contact. Moscow is notified. No Soviet program opens, and the finding is not upgraded into a method."
 CZE_psych_forward_file_tt: "Scrutiny §R+1§!. Moscow is told that a foreign research contact has arrived. No Soviet decisions open."

 CZE_psych_close_section: "Close the Section"
 CZE_psych_close_section_desc: "Close the section for good. An open study is cancelled. An archived finding stays archived. A file already sent is not recalled."
 CZE_psych_close_section_tt: "The section closes permanently. An open study is cancelled. An archived finding stays archived. A file already sent is not recalled."

 CZE_psych_settle_shelved: "Settle the Shelved Section"
 CZE_psych_settle_shelved_desc: "The section has been on the shelf since the party asked about it. Reopen it, or close it for good."

 CZE_psych_continue_spring_tt: "Scrutiny §R+5§!. The section stays open. Nothing new is commissioned. A file already sent stays sent."
 CZE_psych_shelve_section_tt: "The section is frozen. An open timer is stopped, and the study is neither archived nor cancelled. After 1969 it can be reopened or closed, and reopening starts that timer again. A file already sent stays sent."
 CZE_psych_reopen_section_tt: "The section comes off the shelf. A study that was underway starts its timer again. A waiting report returns to review."

 cwic_wp_psych.1.t: "A Psychotronics Section"
 cwic_wp_psych.1.d: "A research circle around Zdeněk Rejdák has been gathering demonstration claims of the kind later filed as psychotronics: alleged effects produced in a room, in front of witnesses, without a repeatable procedure behind them.\n\nThe section will keep those claims as a file. It has no method to issue, and the academy has not been told that one exists."
 cwic_wp_psych.1.a: "Open the file."

 cwic_wp_psych.2.t: "A Foreign Research Contact"
 cwic_wp_psych.2.d: "A Czechoslovak research file has arrived. It reports demonstration claims and the result of a controlled repeat. It does not describe a method, and it opens no program of our own."
 cwic_wp_psych.2.a: "File it with the academy."

 cwic_wp_psych.3.t: "The Section and the Spring"
 cwic_wp_psych.3.d: "The party wants to know whether the psychotronics section is a reformist salon. The study itself is unchanged: it still has no method to show.\n\nKeeping the section open will draw scrutiny. Putting it on the shelf freezes the work until the question can be settled. A file already sent to Moscow is not recalled."
 cwic_wp_psych.3.a: "Keep the section open."
 cwic_wp_psych.3.b: "Put the section on the shelf."

 cwic_wp_psych.4.t: "The Shelved Section"
 cwic_wp_psych.4.d: "The section has sat on the shelf since the party asked about it. The work can be picked up again, or the section can be closed for good. Closing it does not recall a file already sent to Moscow."
 cwic_wp_psych.4.a: "Reopen the section."
 cwic_wp_psych.4.b: "Close it for good."

 DDR_PSYCH_WATCH: "Psychotronics Watch"
 DDR_PSYCH_WATCH_desc: "Research record: [?DDR_psych_record|0]/100\nScrutiny: [?DDR_psych_scrutiny|0]/100\n\nOne note. It records that the claims do not justify an MfS method."

 DDR_psych_file_watch_note: "File a Watch Note"
 DDR_psych_file_watch_note_desc: "Record what the claims are and what they are not. The note does not open a laboratory and it does not authorize a method."
 DDR_psych_file_watch_note_tt: "Research record §G+5§!. Scrutiny §R+1§!. The note says the claims do not justify an MfS method. The watch then goes quiet."

 DDR_psych_watch_source_forwarded: "The Czechoslovak section has forwarded its file."
 DDR_psych_watch_source_channels: "The same claims have arrived through ordinary channels."

 cwic_wp_psych.5.t: "A Watch Note"
 cwic_wp_psych.5.d: "[GetDDRPsychWatchSource]\n\nThe note records that the claims do not justify an MfS method. No program is opened."
 cwic_wp_psych.5.a: "File the note."
