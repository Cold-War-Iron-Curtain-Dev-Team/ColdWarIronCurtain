l_english:
 WP_PSYCHOTRONICS_MODE: "Warsaw Pact Psychotronics"
 RULE_OPTION_WP_PSYCHOTRONICS_HISTORICAL: "Historical — National Pact Files"
 RULE_OPTION_WP_PSYCHOTRONICS_HISTORICAL_DESC: "Enables finite national files for Czechoslovakia, Bulgaria, Poland, Hungary, Romania, and East Germany. With Soviet Psychotronics also enabled, eligible faction members may join a shared appraisal Directorate. Historical findings remain unsupported, inconclusive, or conventional; no paranormal method is granted."
 RULE_OPTION_WP_PSYCHOTRONICS_OFF: "Off"
 RULE_OPTION_WP_PSYCHOTRONICS_OFF_DESC: "Warsaw Pact psychotronics sections, institutes, and security watch notes are neither initialized nor displayed. No files are circulated by this system."

 WP_PSYCHOTRONICS: "Psychotronics Section"
 WP_PSYCHOTRONICS_desc: "Research record: [?CZE_psych_record|0]/100\nScrutiny: [?CZE_psych_scrutiny|0]/100\n\nOne section and one study. A finished file says a controlled repeat did not support the demonstration. Closing the section is permanent."

 CZE_psych_open_section: "Open a Psychotronics Section"
 CZE_psych_open_section_desc: "A domestic research circle has been collecting demonstration claims. Opening a section gives those claims a file. It does not establish a method."
 CZE_psych_open_section_tt: "The section opens. Research record §G+5§!. A demonstration study becomes available. No method is granted."

 CZE_psych_commission_demonstration: "Commission the Demonstration Study"
 CZE_psych_commission_demonstration_desc: "Order a controlled look at the demonstration claims. The study occupies the only slot until its report is archived or the section is closed."
 CZE_psych_commission_demonstration_tt: "A §Y90-day§! study starts, then a §Y30-day§! review. Scrutiny §R+2§!. The slot stays occupied until the report is archived or the section is closed."

 CZE_psych_demo_research: "Demonstration Study"
 CZE_psych_demo_research_desc: "The section is comparing the demonstration claims with a controlled repeat."

 CZE_psych_demo_review: "Review the Demonstration"
 CZE_psych_demo_review_desc: "The report is being written into the file. If this review runs out, the file is archived with the same finding as the manual archive."

 CZE_psych_archive_demonstration: "Archive the Demonstration"
 CZE_psych_archive_demonstration_desc: "File the report. The finding is already fixed: the demonstration did not survive a controlled repeat."
 CZE_psych_archive_demonstration_tt: "The finding is filed: a controlled repeat did not support the demonstration. The national file totals §G15 Research Record§!, the slot empties, and one §G25% electronics§! bonus is granted for instrumentation methods."

 CZE_psych_forward_file: "Forward the File to Moscow"
 CZE_psych_forward_file_desc: "Send the archived finding as a foreign research contact. Moscow is notified. No Soviet program opens, and the finding is not upgraded into a method."
 CZE_psych_forward_file_tt: "Directorate Coordination §G+5§! and Scrutiny §R+1§! once a Directorate exists. Moscow is told that the negative finding has arrived; forwarding never upgrades it into a method."

 CZE_psych_close_section: "Close the Section"
 CZE_psych_close_section_desc: "Close the section for good. An open study is cancelled. An archived finding stays archived. A file already sent is not recalled."
 CZE_psych_close_section_tt: "The section closes permanently. An open study is cancelled. An archived finding stays archived. A file already sent is not recalled."

 CZE_psych_settle_shelved: "Settle the Shelved Section"
 CZE_psych_settle_shelved_desc: "The section has been on the shelf since the party asked about it. Reopen it, or close it for good."

 CZE_psych_continue_spring_tt: "Scrutiny §R+5§!. The section stays open. Nothing new is commissioned. A file already sent stays sent."
 CZE_psych_shelve_section_tt: "The section is frozen. An open timer is stopped, and the study is neither archived nor cancelled. After 1969 it can be reopened or closed, and reopening starts that timer again. A file already sent stays sent."
 CZE_psych_reopen_section_tt: "The section comes off the shelf. A study that was underway starts its timer again. A waiting report returns to review."

 cwic_wp_psych.1.t: "A Psychotronics Section"
 cwic_wp_psych.1.d: "A research circle around Zdeněk Rejdák has been gathering demonstration claims of the kind later filed as psychotronics: alleged effects produced in a room, in front of witnesses, without a repeatable procedure behind them.\n\nThe section will keep those claims as a file. It has no method to issue, and the academy has not been told that one exists."
 cwic_wp_psych.1.a: "Open the file."

 cwic_wp_psych.2.t: "A Foreign Research Contact"
 cwic_wp_psych.2.d: "A Czechoslovak research file has arrived. It reports demonstration claims and the result of a controlled repeat. It does not describe a method, and it opens no program of our own."
 cwic_wp_psych.2.a: "File it with the academy."

 cwic_wp_psych.3.t: "The Section and the Spring"
 cwic_wp_psych.3.d: "The party wants to know whether the psychotronics section is a reformist salon. The study itself is unchanged: it still has no method to show.\n\nKeeping the section open will draw scrutiny. Putting it on the shelf freezes the work until the question can be settled. A file already sent to Moscow is not recalled."
 cwic_wp_psych.3.a: "Keep the section open."
 cwic_wp_psych.3.b: "Put the section on the shelf."

 cwic_wp_psych.4.t: "The Shelved Section"
 cwic_wp_psych.4.d: "The section has sat on the shelf since the party asked about it. The work can be picked up again, or the section can be closed for good. Closing it does not recall a file already sent to Moscow."
 cwic_wp_psych.4.a: "Reopen the section."
 cwic_wp_psych.4.b: "Close it for good."

 DDR_PSYCH_WATCH: "Psychotronics Watch"
 DDR_PSYCH_WATCH_desc: "A single 60-day MfS security review of fraud, compromised researchers, Western collection interest, and operational utility. It does not open an East German psychic laboratory."

 DDR_psych_file_watch_note: "Commission the MfS Security Review"
 DDR_psych_file_watch_note_desc: "Review researchers, source custody, fraud indicators, and Western collection interest without inventing an East German paranormal-weapons program."
 DDR_psych_file_watch_note_tt: "Begin a §Y60-day§! security review. Historical completion adds §G8 Research Record§!, reduces Scrutiny, and grants a bounded 180-day vetting bonus."

 DDR_psych_watch_source_forwarded: "Allied Warsaw Pact sections have forwarded their files."
 DDR_psych_watch_source_channels: "The same claims have arrived through ordinary channels."

 cwic_wp_psych.5.t: "The MfS Verification Report"
 cwic_wp_psych.5.d: "[GetDDRPsychWatchSource]\n\nThe 60-day review finds no operational psychic method. It does identify better procedures for source custody, compromised-researcher checks, stress analysis, and foreign-collection screening."
 cwic_wp_psych.5.a: "Archive the security findings."

 BUL_PSYCHOTRONICS: "Institute of Suggestology"
 BUL_PSYCHOTRONICS_desc: "Research record: [?BUL_psych_record|0]/100\nScrutiny: [?BUL_psych_scrutiny|0]/100\n\nOne institute and one parapsychological charter. A finished file records that suggestopedic experiments showed accelerated memory retention, but controlled repeats of clairvoyance and telepathy did not support the demonstrations. Closing the charter is permanent."

 BUL_psych_open_institute: "Charter the Institute of Suggestology"
 BUL_psych_open_institute_desc: "Establish a state research institute under Dr. Georgi Lozanov to examine suggestopedia, mental influence, and clairvoyant claims. The charter opens an administrative record. It does not certify an operational method."
 BUL_psych_open_institute_tt: "The institute is chartered. Research record §G+5§!. An appraisal study becomes available. No method is granted."

 BUL_psych_commission_study: "Commission the Suggestology Appraisal"
 BUL_psych_commission_study_desc: "Direct the institute's laboratory to run controlled observation sessions on registered clairvoyants and mental influence claims. Occupies the charter's slot until the dossier is archived or the section is closed."
 BUL_psych_commission_study_tt: "A §Y90-day§! study starts, followed by a §Y30-day§! review. Scrutiny §R+2§!. The slot stays occupied until the report is archived or the section is closed."

 BUL_psych_demo_research: "Suggestology Appraisal"
 BUL_psych_demo_research_desc: "The institute's researchers are conducting controlled trials on clairvoyance, suggestopedic learning, and witness demonstrations."

 BUL_psych_demo_review: "Review the Findings"
 BUL_psych_demo_review_desc: "The findings are compiled for the ministry and the party. When the timer expires, the dossier is archived automatically."

 BUL_psych_archive_study: "Archive the Suggestology Report"
 BUL_psych_archive_study_desc: "Deposit the findings. The conclusion is unambiguous: while suggestopedic learning demonstrates pedagogic value, controlled repeats of clairvoyance and telepathic transmission showed no statistically significant anomaly."
 BUL_psych_archive_study_tt: "The report distinguishes a limited conventional teaching application from unsupported paranormal claims. The national file totals §G15 Research Record§!, the slot empties, and intensive specialist training applies for §Y180 days§!."

 BUL_psych_forward_file: "Forward Findings to Moscow"
 BUL_psych_forward_file_desc: "Send the archived suggestology dossier to Soviet counterparts as an inter-socialist academic exchange. Moscow is informed. No operational program is opened."
 BUL_psych_forward_file_tt: "Directorate Coordination §G+5§! and Scrutiny §R+1§! once a Directorate exists. Moscow receives the distinction between conventional teaching and unsupported paranormal extrapolation."

 BUL_psych_close_institute: "Close the Parapsychology Section"
 BUL_psych_close_institute_desc: "Dissolve the institute's parapsychology remit. Any ongoing study is cancelled, and the charter is retired permanently."
 BUL_psych_close_institute_tt: "The parapsychology section closes permanently. An active study is cancelled. An archived report stays archived."

 BUL_psych_audit_defend_tt: "Scrutiny §R+5§!, Political Power §R-15§!. The institute retains its parapsychology remit under strict ministerial oversight."

 cwic_wp_psych.6.t: "The Institute of Suggestology"
 cwic_wp_psych.6.d: "In Sofia, the State Research Institute of Suggestology has opened under Dr. Georgi Lozanov. The remit combines educational accelerated learning with systematic observation of domestic clairvoyants, notably the blind seer Vanga of Petrich.\n\nThe institute will keep those observations as a scientific record. It grants no doctrine, and the Central Committee has been advised that no psychic weapon exists."
 cwic_wp_psych.6.a: "Register the charter."

 cwic_wp_psych.7.t: "The Sofia Audit"
 cwic_wp_psych.7.d: "Following the death of Lyudmila Zhivkova, the Central Committee and state security organs have reviewed cultural and scientific programs that enjoyed her patronage. Investigators have raised ideological and financial concerns regarding the parapsychology department and its foreign contacts.\n\nThe party may allow the institute to defend its theoretical work at the cost of intense political scrutiny, or order the parapsychology section dissolved immediately."
 cwic_wp_psych.7.a: "Defend the institute's charter."
 cwic_wp_psych.7.b: "Dismantle the parapsychology section."

 POL_PSYCH_WATCH: "Cybernetics & Statistical Audit"
 POL_PSYCH_WATCH_desc: "A bounded 90-day study and 30-day report on radiesthesia, cybernetics, and statistical controls. Historical AI selects the rigorous disposition."

 POL_psych_file_watch_note: "Commission the Statistical Audit"
 POL_psych_file_watch_note_desc: "Have cyberneticists and statisticians audit trials with radiesthetes and civilian psychotronics groups under blind-test controls."
 POL_psych_file_watch_note_tt: "Spend §Y25 Political Power§! for a §Y90-day§! audit followed by a §Y30-day§! disposition review."

 POL_psych_watch_source_allies: "Allied Warsaw Pact dossiers on psychotronics and suggestology have arrived through intelligence exchanges."
 POL_psych_watch_source_channels: "Claims regarding radiesthesia, biolocation, and psychotronics have circulated through informal domestic societies."

 cwic_wp_psych.8.t: "A Security Watch Note"
 cwic_wp_psych.8.d: "[GetPOLPsychWatchSource]\n\nMilitary intelligence (WSW) and the Ministry of Internal Affairs have reviewed claims that radiesthetes can locate underground infrastructure, mines, or concealed personnel.\n\nControlled blind tests showed results consistent with chance and ideomotor suggestion. The report recommends no military doctrine or procurement, directing organs to monitor civil psychotronic clubs solely for unsanctioned foreign contacts."
 cwic_wp_psych.8.a: "File the assessment."

 cwic_wp_psych.9.t: "A Bulgarian Research Contact"
 cwic_wp_psych.9.d: "A scientific dossier from the Sofia Institute of Suggestology has arrived in Moscow. It documents observation sessions on Bulgarian clairvoyants and accelerated learning methods. The findings report that controlled repeats showed no anomalous psychic transmission, and no operational program is opened."
 cwic_wp_psych.9.a: "File it with the Academy of Sciences."
