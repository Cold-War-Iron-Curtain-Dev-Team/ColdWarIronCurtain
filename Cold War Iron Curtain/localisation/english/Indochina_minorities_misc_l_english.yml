 # === MEO Characters (merged from MEO_characters_l_english.yml) ===
 POLITICS_VUONG_CHI_SINH_DESC:0 "§YThe legendary Meo King of Ha Giang§L\nVuong Chi Sinh was a singular figure in the history of French Indochina, ruling the Hmong highlands as a de facto independent nation. Born as Vang Seo Lu in 1886, he inherited his father's leadership and fought to protect his people from foreign domination. Unlike other rulers in Vietnam, his Kingdom of the Meo was never fully subjected to French colonial rule, maintaining autonomy through strategic diplomacy and fierce resistance.\nDuring World War II, Vuong Chi Sinh rallied the Hmong against Japanese and French incursions, cementing his status as a protector of the northern highlands. After the August Revolution, he swore allegiance to Ho Chi Minh, who adopted him as a sworn brother and gave him the name Vuong Chi Thanh. He later became a member of the National Assembly of the Democratic Republic of Vietnam, advocating for Hmong representation in the new socialist order. Though his kingdom faded into history, his legacy as a leader who navigated the complexities of war, colonialism, and revolution remains a defining chapter in Vietnam's struggle for independence."
 POLITICS_LO_VAN_HAC_DESC:0 "§YThe Black Tai Partisan of Son La§L\nLo Van Hac rose from the Black Tai villages of the Son La basin, a country where authority had for generations belonged to the hereditary phia tao lords and, after them, to the French residents who found it convenient to rule through those same lords. He broke with both. Joining the revolutionary movement during the resistance, he organised Tai villagers into supply columns and guerilla sections in the mountains behind the French lines, and his networks in the northwest were among those that made the long approach march to Dien Bien Phu possible.\nHis standing rests on something the lowland cadres could not manufacture: he is a highlander who chose the revolution rather than a revolutionary sent to govern highlanders. When Hanoi came to constitute the Tai-Meo Autonomous Zone in 1955, that combination made him the natural chairman, a man who could speak for the Tai, the Meo and the smaller peoples of the northwest in the language of the Party, and speak for the Party in the mountains without being heard as an occupier. Whether autonomy under such a man is genuine self-government or simply a more comfortable form of incorporation is a question the highlands will answer in their own time."
 POLITICS_DUONG_TRUNG_NHAN_DESC:0 "§YThe Tusi of Meo Vac§L\nDuong Trung Nhan was the defiant rival of the Vuong dynasty. Born in 1912 to Duong Tu Nghia, he inherited his family's resentment toward the Vuongs, whose power had overshadowed them for generations. Unlike Vuong Chi Sinh, who sided with the Viet Minh, Duong Trung Nhan aligned with the Republic of China, adopting Tridemism and vowing to liberate the Hmong from both the Vuong family's rule and communist influence. As a staunch anti-communist, he sought to establish an independent Hmong Free State under his own leadership, positioning himself as the last hope for a non-communist future in the highlands. His struggle against the Vuong dynasty and the Viet Minh made him a key player in the fragmented politics of the northern borderlands."
 # === THO/MEO content extracted from French_Indochina_l_english.yml ===
 THO_VIN_Autonomy_Zone:0 "Viet Bac Autonomous Region"
 THO_VIN_Autonomy_Zone_ADJ:0 "Tay"
 THO_VIN_Autonomy_Zone_DEF:0 "the Viet Bac Autonomous Region"
 THO_viet_bac_establishment_TT:0 "The §YViet Bac Autonomous Region§! is constituted over §YCao Bang§!, §YLang Son§! and §YDong Bac Bo§! - and over §YHa Giang§! if we hold it - as an integrated autonomy under Hanoi, chaired by §YChu Van Tan§!"
 POLITICS_CHU_VAN_TAN_DESC: "§YChairman of the Administrative Committee of the Viet Bac Autonomous Region§!\nChu Van Tan is a Nung from the hills of Vo Nhai, and his revolutionary career began before there was a Viet Minh to belong to. In 1941 he raised the Cuu Quoc Quan, the National Salvation Army, out of the villages he had grown up in - a partisan force of Tay and Nung highlanders that held the Bac Son country against the French and then against the Japanese, and that the Party later folded into the regular army as one of its founding formations. He was among the first generals the republic commissioned, and he commanded on the northern frontier through the hardest years of the resistance.\nThat history is exactly what makes him the right man for Cao Bang. The Viet Bac is the ground the revolution was born on, and it is not lowland ground; a committee seated there must be able to speak for the border peoples without sounding like the delta, and speak for the delta without sounding like an occupation. Chu Van Tan can do both, because he was a highlander with a rifle before he was a general with a staff. Hanoi gives up a corps commander to get a chairman the frontier will actually listen to - and gains, in the bargain, a man whose loyalty to the Party has never depended on the Party watching him."
