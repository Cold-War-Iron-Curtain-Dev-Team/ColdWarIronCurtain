l_english:
 # ============================================================================
 #  THE KOREAN QUESTION - Korean War side branch (SOV / Stalin tree)
 #  Revealed by sov_jvs.4 on day 21.
 # ============================================================================

 # ---- Events ----
 sov_korea_branch.1.t:0 "MiG Alley"
 sov_korea_branch.1.d:0 "Along the Yalu, in a corridor of sky the American pilots have started calling MiG Alley, Soviet airmen in Chinese markings are flying Soviet aircraft against the United States Air Force.\n\nEveryone involved understands the arrangement. The pilots are forbidden to speak Russian on the radio, forbidden to fly over the sea, forbidden to cross the front line where they might be captured. Washington knows perfectly well who is in the cockpits and has decided, for reasons of its own, not to say so out loud.\n\nTwo nuclear powers are shooting at each other daily and both governments have agreed to pretend otherwise."
 sov_korea_branch.1.a:0 "A war neither side can admit to."

 sov_korea_branch.2.t:0 "Armistice at Panmunjom"
 sov_korea_branch.2.d:0 "After two years of talks conducted in a tent while the shelling continued outside, the guns in Korea have stopped.\n\nThe line is almost exactly where it was in June 1950. Three years, and the frontier has moved a few dozen kilometres. What has changed is everything around it: the Americans are in Korea and Japan permanently now, defence budgets across the Atlantic alliance have tripled, and the Chinese have discovered they can fight the United States to a standstill.\n\nMoscow spent very little blood on this war and gained a great deal from it. Whether that was the plan or merely the outcome is not a question anyone in the Presidium intends to write down."
 sov_korea_branch.2.a:0 "A frozen war is still a useful one."

 # ---- Focuses ----
 SOV_kw_the_korean_question:0 "The Korean Question"
 SOV_kw_the_korean_question_desc:0 "Kim Il-sung has been asking, with increasing insistence, for permission to reunify Korea by force. He believes the South will rise the moment his divisions cross the parallel. He believes the Americans, having written Korea out of their defence perimeter, will not return for it.\n\nComrade Stalin is not so certain. But the Korean People's Army is a Soviet creation, armed with Soviet weapons and trained by Soviet officers, and whatever Pyongyang decides to do, it will do it with what Moscow has given it.\n\nThe question is not really whether there will be a war. It is how well prepared our side will be when there is."
 SOV_kw_the_korean_question_tt:0 "Unlocks the §YKorean Question§! branch."

 SOV_kw_rearm_the_korean_peoples_army:0 "Rearm the Korean People's Army"
 SOV_kw_rearm_the_korean_peoples_army_desc:0 "The KPA is a light infantry force with a handful of obsolete vehicles. Against the constabulary Syngman Rhee calls an army that might be sufficient. Against anything the Americans could put ashore it is not.\n\nSurplus from the Great Patriotic War will be shipped through Vladivostok and Manchuria: rifles, artillery, and the T-34s that broke the Wehrmacht. Pyongyang will also get the factories to keep them running."
 SOV_kw_rearm_the_korean_peoples_army_tt:0 "The KPA receives a large shipment of §Yinfantry equipment and armour§!, funding, and two §Yarms factories§!.\nSoviet foreign power projection falls while the shipments continue."

 SOV_kw_advisors_in_pyongyang:0 "Advisors in Pyongyang"
 SOV_kw_advisors_in_pyongyang_desc:0 "Equipment is not an army. The KPA's officer corps is drawn from Manchurian partisans and Soviet Koreans who have never commanded anything larger than a battalion.\n\nA military advisory group under General Shtykov will take over operational planning, staff training and logistics. Officially they are technical consultants. In practice the invasion plan, when it is written, will be written in Russian and translated."
 SOV_kw_advisors_in_pyongyang_tt:0 "The KPA gains §Yarmy experience§! and §Ywar support§!, and grants us military access.\nRelations with the KPA improve substantially."

 SOV_kw_the_sino_soviet_understanding:0 "The Sino-Soviet Understanding"
 SOV_kw_the_sino_soviet_understanding_desc:0 "Whatever happens in Korea will happen on China's border, and Mao has just won a civil war with an army that has nowhere to go.\n\nIf the Americans come north, it will not be Soviet divisions that meet them at the Yalu — that is a war Moscow cannot afford and will not fight. It will be Chinese ones. That arrangement needs to be understood in Peking well before anyone needs it, and it needs to be paid for."
 SOV_kw_the_sino_soviet_understanding_tt:0 "The PRC receives §Yinfantry equipment and armour§!.\nRelations with the PRC improve, and Soviet foreign power projection increases."

 SOV_kw_the_64th_fighter_aviation_corps:0 "The 64th Fighter Aviation Corps"
 SOV_kw_the_64th_fighter_aviation_corps_desc:0 "The Americans have air superiority over the peninsula and are using it to destroy every bridge, railway and column the KPA possesses.\n\nThe 64th Fighter Aviation Corps will deploy to Manchurian airfields with the MiG-15. The aircraft will carry Chinese markings and the pilots will carry Chinese papers, and the fiction will be maintained no matter how transparent it becomes."
 SOV_kw_the_64th_fighter_aviation_corps_tt:0 "Gain the §YThe 64th Fighter Aviation Corps§! spirit for 900 days.\nA level 4 §Yair base§! is built in Korea and volunteer allowance to the KPA increases."

 SOV_kw_mig_alley:0 "MiG Alley"
 SOV_kw_mig_alley_desc:0 "The corridor along the Yalu has become the largest jet-versus-jet air battle in history, and it is being fought by men who officially are not there.\n\nFor the Air Force it is worth more than the territory. Every sortie against B-29s and Sabres is data we cannot obtain any other way — on our aircraft, on theirs, and on how a modern air war between the blocs would actually go."
 SOV_kw_mig_alley_tt:0 "Large gain in §Yair experience§! and foreign power projection."

 SOV_kw_deniable_volunteers:0 "Deniable Volunteers"
 SOV_kw_deniable_volunteers_desc:0 "The formula that keeps this war limited is deniability. No Soviet unit is in Korea; there are only volunteers, advisors and technical personnel, and the Americans have their own reasons for accepting that.\n\nWithin that fiction a great deal can be moved. Artillery crews, engineers, signals troops and anti-aircraft batteries can all be described as something else, so long as nobody is captured wearing the wrong uniform."
 SOV_kw_deniable_volunteers_tt:0 "The KPA receives §Yinfantry equipment§! and §Ymanpower§!.\nVolunteer allowance to the KPA increases further. World tension falls."

 SOV_kw_the_armistice_at_panmunjom:0 "The Armistice at Panmunjom"
 SOV_kw_the_armistice_at_panmunjom_desc:0 "The war has been militarily decided for two years; only the prisoner question keeps the talks going. Neither Washington nor Peking can afford to be seen to concede, and neither can afford to continue.\n\nMoscow can end it. A word to Pyongyang and Peking that the Soviet Union considers the matter settled will close the negotiation within weeks. What we get for it is a permanent American commitment in Asia, a China that has bled for the socialist camp and owes us for the weapons, and a frontier we did not have to defend ourselves."
 SOV_kw_the_armistice_at_panmunjom_tt:0 "Large gain in §Ypolitical power§!, §Ystability§! and foreign power projection.\nThe KPA receives funding and stabilizes. World tension falls sharply."

 SOV_kw_deniable_volunteers_threat:0 "Volunteers in Korea"
 SOV_kw_panmunjom_threat:0 "The Korean Armistice"
