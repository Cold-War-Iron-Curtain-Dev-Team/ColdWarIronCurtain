DOM_Quota_Loss.1.d: "The sugar quota maintained by the United States and Dominican Republic has been canceled. As a result, Dominican sugar prices have dropped to a historic low. The Dominican Republic’s leadership is looking to diversify the country’s economy. Currently, the industry is agriculturally dominated. Now is the time to increase the allure of natural beauty through tourism or industrialize the retail sector."
DOM_Outreach_Treaties.1.d: ""
DOM_Power_Struggle_In_The_DRP.1.d: ""
DOM_Bosch_Reinstated.1.d: "Today, the Dominican man of the hour, Juan Bosch, is returning from exile to the capital: Santo Domingo. His biggest supporter, Caamano, paved the way by defeating government forces in a decisive upset. He broke of the loyalist bloackade and advanced into the country side. By popular demand of the Dominican people, Juan Bosch lands today at newly liberated San Isidro Air Base. He will not let the rotten pillars of the Dominican state stop him from safeguarding the rights of all Dominicans. ¡Dios, Patria, Libertad!"
DOM_Mirabal.1.d: "There were four Mirabel sisters: Patria Mercedes Mirabal Reyes, Bélgica Adela Mirabal Reyes, Minerva Mirabal, and María Teresa Mirabal. Three of their husbands celebrated rebels against Trujillo in the 14 June Movement, nicknamed 1J4. Minerva and María Teresa were jailed with all three of the husbands when the movement was discovered. On 25 November 196, Patria, Minerva, María Teresa, and their driver, Rufino de la Cruz, were halted by agents of Trujillo. They were individually strangled and ran collectively off a nearby mountain to hide the brutal killings as a car accident. No one was fooled. These assassinations greatly inspired others to oppose the Trujillo regime. Their contribution to the freedom of the Dominican Republic was not forgotten."
DOM_Betancourt.1.d: "On 24 June 196, Venezuelan President Rómulo Betancourt was wounded in a car bomb assassination attempt ordered directly by the Dominican dictator Rafael Leónidas Trujillo. While previous attempts were stopped by Trujillo advisors, this attempt featured a car bomb going after right ehen Betancourt's preditional automotive passed by.  Betancourt himself sustained some burns but survived. His head of security died, and his driver burned as well. This assassination venture shocked the world over, as Trujillo's brutality and willingness to target opposing heads of state. By surviving, Betancourt's reputation worldwide rose tremendously while Trujillo was vilified in the world community."
