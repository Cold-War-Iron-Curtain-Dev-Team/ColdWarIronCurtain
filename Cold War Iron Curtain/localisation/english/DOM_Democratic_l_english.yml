# Events

DOM_EndDem_Constitutionalist_Civil_War.1.d: "After a grueling battle over Santo Domingo, rebel forces broke the army and naval blockade. Now, after the Constitutionalist rebels advanced into the rural countryside, the majority of army units have stood down with no victory in sight. Elias y Wessin, the Army’s Commander, himself with prominent generals, have been exiled to Miami. Most of the frustration and anger that fueled the Dominican Civil War has boiled over and died down. From here, it’s a foregone conclusion that the people’s formerly deposed president, Juan Bosch, will be reinstated. Expect a healthy dose of reform and military tribunals of the loyalist commanders that didn’t flee."
DOM_EndDem_Loyalist_Civil_War.1.d: "After a grueling battle over Santo Domingo, rebel forces couldn’t break the army and naval blockade. With loyalist army forces entering the heart of Santo Domingo, many rebel have dropped their rifles and returned to their private lives. Most of the frustration and anger that fueled the Dominican Civil War has boiled over and died down. Since the junta forces have secured the island country, the military government can return to normal. Juan Bosch and Caamano have exiled themselves to Cuba to await either a popular uprising or free elections."
DOM_El_Jefe.1.d: ""
DOM_HD_Clash.1.d: "Today, a short firefight occurred between Dominican and Haitian forces. It is believed that the lower standards of Haitian training led to disproportionate losses on their side. When the artillery was silenced after the short reprieves of the last night, Dominican forces were in control of the battlefield. Hopefully, this dissuades the hostility from both nations."  
DOM_Execute_MT.1.d: "Tavarez’s rebellion cited the military toppling of Juan Bosch as the rallying cry to rebel against the government. Manolo Tavárez’s protest began on June 14th, Revolutionary Movement in 1961. The cell was captured on December 21, 1963, and the junta executed Manolo Tavárez Justo with 28 fellow freedom fighters. The chosen method by the government was a quick death by firing squad. The group had risen up and struck local targets in the rural mountain villages and communities in Las Manaclas and Las Delicias, of San José de Las Matas, a Santiago province, on November 28, 1963. Manolo is survived by his children from his dead wife Mirabal (the same Mirabal that beaten and assassinated by Trujillo)."
DOM_Exile_MT.1.d: "Tavarez’s rebellion cited the military toppling of Juan Bosch as the rallying cry to rebel against the government. Manolo Tavárez’s protest began on June 14th, Revolutionary Movement in 1961. The cell was captured on December 21, 1963, and the junta exiled Manolo Tavárez Justo with 28 fellow freedom fighters. After weighing their options, the firing squad method was not employed. The group had risen up and struck local targets in the rural mountain villages and communities in Las Manaclas and Las Delicias, of San José de Las Matas, a Santiago province, on November 28, 1963. Manolo is exiled with his children from his dead wife Mirabal (the same Mirabal that beaten and assassinated by Trujillo). This turn of events signifies the lessening of repression by the current junta government."
DOM_Exile_Balaguer.1.d: ""
DOM_Faction_Decision.1.d: ""
DOM_ConConvention.1.d: "When Trujillo died in 1961, the constitution document was amended in a constitutional convention to provide for new and free elections and to allow the transfer of power to an interim Council of State until the next upcoming election. Despite the fact that it was ratified as a newly reformist document, the constitution of 1962 was a continuation of the Trujillo constitution from the deposed regime. The public saw this as a despised political direction."
DOM_60s_Triumvirate.1.d: ""
DOM_StartDem_Civil_War.1.d: "Inside the 1965’s Dominican Republic, democratic and anti-democratic forces were headed on an inevitable collision course. The new Junta appointed the president at this time from within their ranks; Donald Reid Cabral had been installed through a military coup. The result of the 1963 toppling of the country’s legitimately elected president, Juan Bosch, led to the formation of a military triumvirate, and the country was racked with an undertone of hostility. Reid Cabral was considered by popular forces to be an unpopular president. In 1965, an economic slowdown of commercial growth, partnered with a historic water shortage in Santo Domingo, had flipped the public against the junta president. Rioters have already begun emptying police armories. Several army units have defected and joined the April revolutionaries."
DOM_SpawnDML_Civil_War.1.d: "Loyalist triumvirate junta forces are leading the charge into Santo Domingo to break up the popular revolution. They have already started bombing the city indiscriminately. It's our chance to run the capital city’s blockade and spread the revolution to every corner of this nation. The Constitutionalists liberated ten thousand rifles from the city and are poised to strike Loyalist outposts."
DOM_SpawnDMC_Civil_War.1.d: "Rebel Constitutionalist forces are led by Caamano. He is attempting to blitz out into the general villages in the backcountry. High command by Elias y Wessin has deemed that if rebel forces assault outside the city, then army morale will go beyond a point of no return. In his bid to increase international leverage, Elias has denounced the rebels as communist, hoping to bring the United States to intervene on his side. At the Loyalists' disposal are a battalion of tanks and a plethora of aircraft to bomb rebel positions in Santo Domingo."
DOM_Judge_65_Remnant.1.d: ""
DOM_VF_Constitution_Assembly_Call.1.d: "During his annual speech in El Malecon of Santo Domingo, President Viriato Fiallo has finally decreed what the people have long waited. The formation of a Constitutional Assembly led by members of the National Congress with the task of finally replacing the 1955 Trujillo Constitution, which granted almost infinite powers to the presidency, will finally resolve the public's anger and fears of a repessionist government led by Fiallo. Although unpopular, these actions have granted him enough leverage to deal with the Bosch's political opposition and his 'Socialist' ideas. This has turned out to be satisfactory enough for the establishment after at least two years of negotiations inside the National Civic Union about how to bring about the constitutional assembly, and, after some legal changes, Congress, which has an NCU political majority, will be ahead of the constitutional process. The leader of the Dominican Revolutionary Party, Juan Bosch, already voiced his concerns about the transparency of the process and called for the formation of a special congressional committee to oversee the amendments while he has called his followers to go out to the streets to demand equal rights, electoral reforms, check and balances, as well as decreasing the insane amount of political power that the Presidency holds."
DOM_VF_Constitution Assembly_Formed.1.d: "After pressure from inside the NCU's political leadership, the Constitutional Assembly has been formed. 6% of the seats are occupied by loyal supporters of the NCU while only 4% is occupied by opposition members. Juan Bosch called to effectively boycott the process as he argued that the Assembly started too fast and too quickly, without guaranteeing enough safeguards for the whole process. Yet, Bosch's party, the PRD, has called for participation in the process amid the public's interest to see how this process plays out. While Bosch openly opposed the process and decided to bear no participation into it, some internal faces of the PRD decided to oversee the situation. The Party is led by Antonio Guzman, a renowned opposition leader and close friend of Juan Bosch, who was raised in a wealthy family and studied abroad. He has argued that, even though the process might seem compromised by its lack of safeguards, it is important for the political opposition to participate in the democratic process to pursue peace and normalization of the constitutional liberties granted after the death of 'The Tyrant' in 1961."
DOM_VF_1965C_Approved.1.d: "President Viriato Fiallo assisted in an extraordinary event within the halls of the National Congress for the signing of the new constitution. The new constitution has been revealed to the public after months of private inquiries and debates in which little information was given out. The PRD constantly declared in the media their discontent with the results of the constitution and that they did not trust the changes given to it. The constitution presented the same proposals of always, such as maintaining Trujillo's bicameral Congress, maintaining most powers held by the presidency, and reaffirming the role of the Church in state matters. One of the positive additions was the establishment of three consecutive terms for a president, which in the past, was an unlimited amount of them and, although some rights were given, and there were some improvements in the judicial system as well as separating some powers of the military to give it to civilian authorities, Bosch declared that the, 'New Constitution is just a mimic of Trujillo's.' The new articles established elections to be held by 1966 and at the end of the past political terms. For many, this was just another political tool of the NCU to grasp more power and has been heavily condemned by the public since."
DOM_VF_1965C_Failed.1.d: "Fiallo was defeated in Congress after he decided to go for a more liberal constitution instead of going for the united proposal given by his party. This political defeat has come at a cost, as he did not obtain enough votes to pass the constitution. He was able to align the liberal members of the NCU, which included Unionists and firm Anti-Trujillists, but did not obtain the support of the wide political establishment of his party. The vote resulted in a mere 46 votes against the 34 in favor in Congress, not passing the required 6% votes needed for approval or 48 votes. The public is outraged by the useless waste of their time. Instead, the so-called 'Constitutional Assembly' decided to approve a 'secondary draft' on the later days which reaffirmed the constitution of 1955 with some minor changes in the President's powers by increasing those of the National Congress as many members of the NCU have viewed the betrayal of Fiallo as unacceptable for the party's near future and many have raised their voices for his expulsion of the party, including his political rival Francisco A. Lora. Bosch declared: The dogs are fighting for the leftovers' while affirming the PRD's firm position on changing the constitution and bringing about the necessary changes for a more democratic Dominican Republic."
DOM_VF_Independence_Day_Riots.1.d: "During the Independence Day of 1965, a day of usual joy and military parades, President Fiallo was forced to stay in the National Palace amid protests and riots that had erupted earlier in that morning. The public is infuriated with the complete dismissal of the promises given with the end of the 3 years of Trujillo, and have been delivered vague, insufficient reforms that have done nothing but cause additional stress to the popular psyche. Adding to this, Juan Bosch called for a national strike and massive riots against the presidency. Counting immense damages and heavy disgust of the traditional elites, President Fiallo, in an attempt to finally appease the NCU, decided to issue an arrest order against Bosch for 'instigating' treason and chaos. However, Bosch found refuge in the American embassy and was able to escape to Puerto Rico not long after that. The riots of February increase the paranoia of the NCU, which has issued arrests, and their popularity has exponentially decreased as there are sentiments of change floating in the Dominican Republic."
DOM_VF_April_Revolution.1.d: "After years since the 1963 election, many Dominicans have been faced with the presidency of Viriato Fiallo. He is a man of business who, during the times of Trujillo, gained great wealth through kneeling to the dictator by being a loyal vassal of his terror. Nowadays, he claimed to be a democratic leader with new intentions of progress and to finally resolve the long-time problems of the nation. However, after calling for a failed attempt of truly bringing constitutional changes, the popular opinion has shifted heavily against him. Secretly, both Juan Bosch and Balaguer met in their exile in Puerto Rico and quickly came to terms. Although politically unaligned, they were both in favor of dismantling the clearly undemocratic successors of Trujillo, the NCU, and finally came to the decision that the only way was through arms. They joined factions and called for the followers in the Dominican military and political life to come together for a solution. They decided to form a new force of Balaguerists officers and young liberal officers, naming themselves the San Cristobal Clan  and deciding to initiate a violent overthrow of the regime. However, by the early morning of April 24, agents of Fiallo's government in the military unveiled the plot quickly alerted General Wessin y Wessin and President Fiallo of the imminent treason. However, it was too late for the authorities as the reDOMs were already armed and prepared. Colonel Fernandez Dominguez assaulted the National Police HQ and the Armory of Santo Domingo and distributed weapons among members of Leftists organizations, the PRD, and the general civilian population."
