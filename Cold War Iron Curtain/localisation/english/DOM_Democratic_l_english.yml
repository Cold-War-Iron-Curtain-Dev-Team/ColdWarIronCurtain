DOM_Election_1962.1.d: "For the first time in the long history of the country, the people get to choose the Dominican Republic’s leader directly in a general presidential election. On December 7, 1962, the country’s first free election featured Juan Bosch of the social democratic Dominican Revolutionary Party versus Viriato Fiallo of the National Civic Union. Fiallo enjoys the support of the former centrist and conservative backbone of Trujillo’s deposed regime. Juan, however, draws his political base from the liberated commoners who were chafed under Trujillo. His promise of reform and standing against undemocratic and oligarchic forces gives him an edge in popularity."
DOM_Election_1966.1.d: "After the Dominican Civil War, died down following American intervention, the next election was conducted on June 1, 1966. The primary candidates featured the deposed and exiled Juan Bosch, with the political insider and former official, Joaquín Balaguer. Being on a platform for the country's stability and economic growth, it appears Balaguer’s Reformist Party will win."
DOM_Election_1968.1.d: ""
DOM_Election_1970.1.d: "On May 16, 197, general elections were conducted again on 197. Joaquín Balaguer’s reformist incumbent party looks to sweep the field again. While Juan Bosch didn’t participate in the election, other homegrown centrist and rightist parties did. Former commander Elías Wessin y Wessin wants to make his mark as a conservative leader. Francisco Augusto Lora split from his fellow Christian Democrat Balaguer and sought to rule the country, promoting a fresh face to lead the Dominicans’ democracy."
DOM_Election_1978.1.d: "On May 16, 1978, general elections were conducted in the Dominican Republic. Following diplomatic pressure from the current American President, the elections were certified free and competitive. As a result, it was contested by all political parties, compared to the previous Dominican elections. However, loyal Balaguerists in the army will likely attempt to interrupt the vote counting and commit a coup to enable Balaguer to hold on to the presidency. It will be forced to back down because of protests domestically and abroad. In history, Guzmán was allowed to assume the presidency, but the Central Elections Authority redistributed the uncast votes equally between the PRD and the Reformist Party, which minimized the PRD's potential majority in Congress. If Guzmán is sworn in on 16 August  will tally the first time in the country's long history that a sitting government has peacefully surrendered power to an elected member of the opposition."
