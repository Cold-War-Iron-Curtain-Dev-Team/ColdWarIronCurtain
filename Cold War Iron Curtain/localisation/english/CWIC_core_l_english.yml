 CWIC_ACTIVE_CRISIS_fiscal_LOW_DESC:0 "§YLow Severity§!\nGovernment finances are under growing strain. Rising obligations and weakening fiscal flexibility are beginning to limit investment and long-term planning."
 CWIC_ACTIVE_CRISIS_fiscal_MEDIUM_DESC:0 "§YMedium Severity§!\nBudget pressures are increasingly constraining state capacity. Public spending choices are becoming more difficult as debt burdens and financial obligations mount."
 CWIC_ACTIVE_CRISIS_fiscal_HIGH_DESC:0 "§OHigh Severity§!\nThe government's fiscal position has become a major threat to economic stability. Essential investments are being delayed as debt servicing consumes available resources."
 CWIC_ACTIVE_CRISIS_fiscal_EXTREME_DESC:0 "§RExtreme Severity§!\nThe state is facing a severe fiscal breakdown. Financial obligations have overwhelmed public finances, threatening both economic and political stability."

 CWIC_ACTIVE_CRISIS_economic_contraction_LOW_DESC:0 "§YLow Severity§!\nEconomic growth has slowed and investment confidence is weakening. Businesses and consumers are becoming increasingly cautious."
 CWIC_ACTIVE_CRISIS_economic_contraction_MEDIUM_DESC:0 "§YMedium Severity§!\nThe economy is shrinking as production, employment, and investment decline. Economic momentum has turned negative across multiple sectors."
 CWIC_ACTIVE_CRISIS_economic_contraction_HIGH_DESC:0 "§OHigh Severity§!\nA severe recession is underway. Falling output and weakening labor participation are creating widespread economic hardship."
 CWIC_ACTIVE_CRISIS_economic_contraction_EXTREME_DESC:0 "§RExtreme Severity§!\nThe economy is in collapse. Productive activity is contracting rapidly and recovery will require major structural intervention."

 CWIC_ACTIVE_CRISIS_inflation_LOW_DESC:0 "§YLow Severity§!\nPrices are rising faster than normal, reducing purchasing power and increasing costs throughout the economy."
 CWIC_ACTIVE_CRISIS_inflation_MEDIUM_DESC:0 "§YMedium Severity§!\nInflation is becoming a significant economic concern. Households and businesses are struggling to adapt to rapidly rising prices."
 CWIC_ACTIVE_CRISIS_inflation_HIGH_DESC:0 "§OHigh Severity§!\nPersistent inflation is distorting investment decisions and undermining confidence in the currency. Economic planning is becoming increasingly difficult."
 CWIC_ACTIVE_CRISIS_inflation_EXTREME_DESC:0 "§RExtreme Severity§!\nRunaway inflation is destabilizing the economy. The currency's value is eroding rapidly and normal market activity is breaking down."

 CWIC_ACTIVE_CRISIS_deflation_LOW_DESC:0 "§YLow Severity§!\nFalling prices are encouraging consumers and businesses to delay spending. Economic activity is beginning to slow."
 CWIC_ACTIVE_CRISIS_deflation_MEDIUM_DESC:0 "§YMedium Severity§!\nDeflationary pressures are reducing investment and suppressing economic growth. Businesses are becoming increasingly reluctant to expand."
 CWIC_ACTIVE_CRISIS_deflation_HIGH_DESC:0 "§OHigh Severity§!\nA severe deflationary cycle is taking hold. Falling prices, weak demand, and declining investment are reinforcing one another."
 CWIC_ACTIVE_CRISIS_deflation_EXTREME_DESC:0 "§RExtreme Severity§!\nThe economy is trapped in a destructive deflationary spiral. Production, investment, and consumer confidence are collapsing simultaneously."

 CWIC_ACTIVE_CRISIS_energy_LOW_DESC:0 "§YLow Severity§!\nEnergy supplies are becoming strained, increasing costs and reducing efficiency across the economy."
 CWIC_ACTIVE_CRISIS_energy_MEDIUM_DESC:0 "§YMedium Severity§!\nPersistent energy shortages are disrupting industrial production and limiting economic growth."
