 CWIC_ACTIVE_CRISIS_financial_credit_HIGH_DESC:0 "§OHigh Severity§!\nThe financial system is under severe pressure. Lending activity has contracted sharply and investment is deteriorating."
 CWIC_ACTIVE_CRISIS_financial_credit_EXTREME_DESC:0 "§RExtreme Severity§!\nThe financial system is in crisis. Credit flows have largely broken down, threatening the wider economy."

