 CWIC_infl_env_deflation_1:0 "Deflationary Environment (Mild)"
 CWIC_infl_env_deflation_1_desc:0 "Prices tend to drift downward. Even when shortages are limited and budgets are balanced, inflation struggles to rise. Credit conditions may look stable, but weak pricing power can drag on demand and make debt burdens feel heavier over time."
 
 CWIC_infl_env_deflation_2:0 "Deflationary Environment (Strong)"
 CWIC_infl_env_deflation_2_desc:0 "Persistent deflationary pressure anchors expectations below zero. Households and firms delay spending, and monetary tightening has outsized effects. This environment is difficult to escape without deliberate policy shifts or a strong revival of demand."
 
 CWIC_infl_env_deflation_3:0 "Deflationary Environment (Deep)"
 CWIC_infl_env_deflation_3_desc:0 "Deep deflation dominates the economy. Prices fall even when policymakers attempt stimulus, and the real weight of liabilities rises. Without major structural change, the economy remains stuck in a low growth and low demand equilibrium."
 
 CWIC_infl_env_very_stable_1:0 "Very Stable Inflation Environment (1%)"
 CWIC_infl_env_very_stable_1_desc:0 "Price growth is anchored close to zero and shocks fade quickly. This environment reflects strong credibility and efficient distribution networks. Inflation can still rise during shortages or heavy deficit financing, but it tends to settle back into stability."
 
 CWIC_infl_env_stable_2:0 "Stable Inflation Environment (2%)"
 CWIC_infl_env_stable_2_desc:0 "A standard low inflation baseline with solid monetary credibility. Moderate growth, predictable pricing, and limited indexation keep pressures contained. Large shocks can still move inflation, but the system naturally pulls toward stability."
 
 CWIC_infl_env_mild_4:0 "Mild Inflation Environment (4%)"
 CWIC_infl_env_mild_4_desc:0 "Prices rise at a noticeable but manageable pace. This environment suits fast growing economies, active fiscal policy, and partial indexation. Inflation is not yet destabilizing, but repeated shortages or deficits can push it into higher tiers."
 
 CWIC_infl_env_noticeable_8:0 "Noticeable Inflation Environment (8%)"
 CWIC_infl_env_noticeable_8_desc:0 "Inflation becomes a constant planning factor. Households and firms expect prices to rise, and policy tightening must work harder to slow momentum. Supply shocks and budget stress transmit quickly into broader price growth."
 
 CWIC_infl_env_moderate_10:0 "Moderate Inflation Environment (10%)"
 CWIC_infl_env_moderate_10_desc:0 "Double digit inflation is normal. Wage bargaining and procurement costs become more sensitive, and budget planning requires frequent adjustments. Without credible stabilization, even small shocks can cause inflation to persist."
 
 CWIC_infl_env_high_15:0 "High Inflation Environment (15%)"
 CWIC_infl_env_high_15_desc:0 "High inflation erodes purchasing power and raises political pressure. Financing gaps and distribution problems magnify quickly. Stabilization is possible, but it usually requires sustained tightening, fiscal reforms, and reduced shortage pressure."
 
 CWIC_infl_env_serious_25:0 "Serious Inflation Environment (25%)"
 CWIC_infl_env_serious_25_desc:0 "Prices climb rapidly and expectations become unanchored. Indexation spreads, budgets lose control, and external shocks produce large swings. Economic management shifts from optimization to containment, with rising risk of disorder."
 
 CWIC_infl_env_crisis_50:0 "Inflation Crisis Environment (50%)"
 CWIC_infl_env_crisis_50_desc:0 "An inflation crisis undermines normal economic calculation. Currency confidence weakens, tax collection becomes less reliable, and shortages become more disruptive. Without decisive stabilization, the economy risks sliding into hyperinflation dynamics."
 
 CWIC_infl_env_hyper_light_100:0 "Hyperinflation Environment (100%)"
 CWIC_infl_env_hyper_light_100_desc:0 "Hyperinflation begins to dominate behavior. Prices can double within a year, and the public shifts toward rapid spending and informal markets. Stabilization requires structural action, credible policy, and often major political cost."
 
 CWIC_infl_env_hyper_hard_200:0 "Severe Hyperinflation Environment (200%)"
 CWIC_infl_env_hyper_hard_200_desc:0 "Severe hyperinflation destroys pricing signals and undermines state capacity. Households flee the currency, contracts fail, and basic administration becomes difficult. Recovery typically demands radical reforms, emergency controls, and a new credibility anchor."