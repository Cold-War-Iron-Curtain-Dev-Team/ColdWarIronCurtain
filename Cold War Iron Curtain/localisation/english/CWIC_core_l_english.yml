CWIC_fx_policy:0 "Exchange Rate Policy"
CWIC_fx_policy_desc:0 "Set the exchange rate regime and manage reserves. Pegs can anchor expectations, but defending a peg drains reserves and can collapse under sustained pressure."

CWIC_currency_policy:0 "Currency and Monetary Policy"
CWIC_currency_policy_desc:0 "Use monetary tools to stabilize inflation, fund government operations through seigniorage, and enact currency reforms. Each option trades short-term relief for long-term credibility."

CWIC_IMF_Credit_Programs:0 "IMF Credit Programs"
CWIC_IMF_Credit_Programs_desc:0 "Access IMF stabilization programs when market borrowing becomes difficult. IMF support can restore credibility and provide cash, but comes with conditionality and limits on policy flexibility."

CWIC_black_market:0 "Black Market Enforcement"
CWIC_black_market_desc:0 "Controls and shortages can push commerce into informal channels. Enforcement, legalization, and targeted raids can reduce black market pressure, but may impose short-term disruption."

CWIC_capital_controls:0 "Capital and Price Controls"
CWIC_capital_controls_desc:0 "Impose or relax controls to manage inflation and capital flight. Controls can suppress prices and stabilize markets in the short term, but create distortions that raise black market pressure over time."

CWIC_adopt_currency_peg:0 "Adopt a Currency Peg"
CWIC_adopt_currency_peg_desc:0 "Anchor the currency to a stable reference and commit reserves to defend the peg. A peg can reduce inflation momentum, but may break if reserves are exhausted under sustained pressure."

CWIC_float_currency:0 "Float the Currency"
CWIC_float_currency_desc:0 "Allow the currency to adjust to market conditions. Floating reduces reserve drain and helps absorb shocks, but may increase inflation if credibility is weak."

CWIC_enable_money_printing:0 "Authorize Monetary Financing"
CWIC_enable_money_printing_desc:0 "Enable ongoing monetary financing of government obligations. This can reduce immediate funding pressure but raises inflation risks and encourages informalization."

CWIC_disable_money_printing:0 "End Monetary Financing"
CWIC_disable_money_printing_desc:0 "Commit to ending monetary financing and restore policy credibility. This reduces inflation pressure over time but may require alternative financing or spending restraint."

CWIC_print_money_small:0 "Issue Limited Seigniorage"
CWIC_print_money_small_desc:0 "Create a small amount of new money to cover short-term obligations. This is a temporary relief measure with manageable inflation and black market risks."

CWIC_print_money_medium:0 "Issue Moderate Seigniorage"
CWIC_print_money_medium_desc:0 "Create a moderate amount of new money to bridge a fiscal gap. Useful in emergencies, but it increases inflation momentum and can expand the informal economy."

CWIC_print_money_large:0 "Issue Emergency Seigniorage"
CWIC_print_money_large_desc:0 "Create a large amount of new money to avoid immediate collapse. This is a last resort and will sharply increase inflation risks and black market pressure."

CWIC_enable_monetary_tightening:0 "Implement Monetary Tightening"
CWIC_enable_monetary_tightening_desc:0 "Raise policy stringency and accept short-term economic pain to reduce inflation. Tightening lowers inflation momentum but can depress productivity and strain social stability."

CWIC_disable_monetary_tightening:0 "End Monetary Tightening"
CWIC_disable_monetary_tightening_desc:0 "Reduce policy stringency and support recovery once inflation stabilizes. Ending tightening too early can reignite inflation and weaken credibility."

CWIC_currency_reform:0 "Execute Currency Reform"
CWIC_currency_reform_desc:0 "Rebase the currency and reset expectations through a major reform package. Currency reform can sharply reduce chronic inflation bias and improve credibility, but it disrupts contracts and imposes short-term economic costs."

CWIC_request_imf_sba:0 "Request IMF Stand-By Arrangement"
CWIC_request_imf_sba_desc:0 "Seek IMF stabilization support to restore credibility and prevent a collapse in financing. IMF assistance provides funds and policy support, but imposes conditionality and restricts monetary financing."

CWIC_black_market_raids:0 "Targeted Anti-Smuggling Raids"
CWIC_black_market_raids_desc:0 "Conduct focused enforcement operations against major smuggling networks. Raids can reduce black market pressure, though they may temporarily disrupt production and logistics."

CWIC_black_market_enforcement_campaign:0 "Currency Enforcement Campaign"
CWIC_black_market_enforcement_campaign_desc:0 "Launch a broad enforcement effort to restore monetary order and suppress informal markets. This can significantly reduce black market pressure at the cost of short-term disruption."

CWIC_black_market_amnesty:0 "Amnesty and Legalization Drive"
CWIC_black_market_amnesty_desc:0 "Offer limited amnesty and channel informal activity back into the legal economy. This reduces black market pressure, but price normalization may temporarily increase inflation."

CWIC_capital_controls_light:0 "Impose Light Capital Controls"
CWIC_capital_controls_light_desc:0 "Introduce limited controls on capital flows to reduce volatility and prevent sudden outflows. These controls can suppress inflation pressures, but will increase distortions over time."

CWIC_capital_controls_heavy:0 "Impose Heavy Capital Controls"
CWIC_capital_controls_heavy_desc:0 "Implement strict controls on capital movement and financial transactions. Heavy controls can stabilize a crisis, but strongly increase distortions and black market pressure."

CWIC_fx_controls_dual:0 "Adopt a Dual Exchange Rate System"
CWIC_fx_controls_dual_desc:0 "Establish separate official and market exchange rates to prioritize essential imports and stabilize key sectors. Dual FX can reduce immediate pressure, but often expands informal trading and arbitrage."

CWIC_price_controls_basic:0 "Implement Basic Price Controls"
CWIC_price_controls_basic_desc:0 "Set basic price limits on key goods to stabilize living costs and prevent panic pricing. Price controls can suppress inflation in the short term but usually increase shortages and informal markets."

CWIC_capital_controls_lift:0 "Lift Controls"
CWIC_capital_controls_lift_desc:0 "Remove emergency controls and allow markets to normalize. Lifting controls can improve long-run efficiency, but may trigger a short-term inflation bounce if distortions and black markets are high."

CWIC_internationalize_currency:0 "Internationalize the Currency"
CWIC_internationalize_currency_desc:0 "Promote the currency as a major settlement and reserve instrument. Achieving reserve status requires large economic scale, low inflation, and strong credit credibility. Success grants structural financing advantages, but mismanagement can erode trust and remove the privilege."

CWIC_global_monetary_order:0 "Global Monetary Order"
CWIC_global_monetary_order_desc:0 "Control over the currency used to price global oil trade confers structural financial advantages. The issuer of the oil pricing currency benefits from sustained external demand, lower borrowing costs, and greater macroeconomic resilience. Challenging the dominant oil currency risks global instability but may reshape the international financial order."

CWIC_challenge_petrodollar:0 "Challenge Dollar Oil Pricing"
CWIC_challenge_petrodollar_desc:0 "Promote our currency as the pricing standard for global oil trade. If successful, this shift will increase structural demand for our currency and weaken the financial dominance of the current issuer. However, such a move risks global market volatility and short-term instability."

