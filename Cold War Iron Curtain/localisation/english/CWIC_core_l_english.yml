 CWIC_ACTIVE_CRISIS_energy_EXTREME_DESC:0 "§RExtreme Severity§!\nThe national energy system is in crisis. Widespread shortages are severely impairing production, transportation, and economic stability."

 CWIC_ACTIVE_CRISIS_trade_external_shock_LOW_DESC:0 "§YLow Severity§!\nDisruptions to trade flows are beginning to affect domestic markets. Imports and exports are becoming less reliable."
 CWIC_ACTIVE_CRISIS_trade_external_shock_MEDIUM_DESC:0 "§YMedium Severity§!\nTrade disruptions are limiting access to key goods and markets. Economic performance is increasingly constrained by external conditions."
 CWIC_ACTIVE_CRISIS_trade_external_shock_HIGH_DESC:0 "§OHigh Severity§!\nMajor trade shocks are damaging domestic production and investment. Supply chains are becoming increasingly unstable."
 CWIC_ACTIVE_CRISIS_trade_external_shock_EXTREME_DESC:0 "§RExtreme Severity§!\nThe country's external economic connections have broken down. Trade disruption is now a major threat to national stability."

 CWIC_ACTIVE_CRISIS_financial_credit_LOW_DESC:0 "§YLow Severity§!\nAccess to financing is tightening. Investment and lending activity are beginning to slow."
