 cwic_cg_basic_level_0_title:0 "Basic Consumer Goods (Prewar Standard)"
 cwic_cg_basic_level_0_desc:0 "Basic consumer goods produced using pre–Second World War industrial methods. Output is limited in variety, quality, and scale, relying heavily on manual labor and localized supply chains. Suitable for subsistence needs but inadequate for modern urban societies.\n\n§YExamples include:§!\n- Simple clothing and textiles\n- Basic household utensils\n- Soap and sanitation supplies\n- Locally produced furniture\n- Manual tools and containers"
 cwic_cg_basic_level_1_title:0 "Basic Consumer Goods (1950s Standard)"
 cwic_cg_basic_level_1_desc:0 "Postwar basic goods manufactured using early mass-production techniques. Availability and consistency improve significantly, supporting early urbanization and workforce participation.\n\n§YExamples include:§!\n- Mass-produced clothing\n- Standardized household goods\n- Improved sanitation and hygiene products\n- Packaged food containers\n- Affordable furniture"
 cwic_cg_basic_level_2_title:0 "Basic Consumer Goods (1960s Standard)"
 cwic_cg_basic_level_2_desc:0 "Expanded variety and improved distribution networks. Basic goods become widely accessible, affordable, and standardized, reflecting the rise of mass consumer societies.\n\n§YExamples include:§!\n- Branded consumer staples\n- Improved textiles and fabrics\n- Safer household products\n- Plastic household goods\n- National retail distribution"
 cwic_cg_basic_level_3_title:0 "Basic Consumer Goods (1970s Standard)"
 cwic_cg_basic_level_3_desc:0 "Higher quality expectations for everyday goods. Production emphasizes durability, safety, and packaging, supported by better management and precision inputs.\n\n§YExamples include:§!\n- Regulated consumer safety goods\n- Improved packaging and labeling\n- Longer-lasting household items\n- Modern sanitation products"
 cwic_cg_basic_level_4_title:0 "Basic Consumer Goods (1980s Standard)"
 cwic_cg_basic_level_4_desc:0 "Highly standardized, efficient production with strong quality control and logistics integration. Reliability and consistent availability are expected.\n\n§YExamples include:§!\n- High-quality hygiene products\n- Reliable household consumables\n- National and international brand goods\n- Just-in-time retail supply"
 cwic_cg_basic_level_5_title:0 "Basic Consumer Goods (1990s Standard)"
 cwic_cg_basic_level_5_desc:0 "Globalized production and distribution of basic consumer goods. Quality expectations are high, and shortages rapidly translate into economic and political consequences.\n\n§YExamples include:§!\n- Global consumer brands\n- High-quality packaged goods\n- Optimized supply chains\n- Broad consumer choice and availability"
 
 cwic_cg_durable_level_0_title:0 "Durable Goods (Prewar Standard)"
 cwic_cg_durable_level_0_desc:0 "Durable goods produced in small quantities with limited standardization. Appliances and machinery are expensive, unreliable, and inaccessible to much of the population.\n\n§YExamples include:§!\n- Hand-assembled appliances\n- Mechanical tools\n- Limited household machinery\n- Repair-intensive equipment"
 cwic_cg_durable_level_1_title:0 "Durable Goods (1950s Standard)"
 cwic_cg_durable_level_1_desc:0 "Early mass-produced appliances and household machinery become available, though reliability and efficiency remain uneven.\n\n§YExamples include:§!\n- Refrigerators and washing machines\n- Basic household appliances\n- Early consumer machinery\n- Electrified home devices"
 cwic_cg_durable_level_2_title:0 "Durable Goods (1960s Standard)"
 cwic_cg_durable_level_2_desc:0 "Durable goods production expands rapidly. Appliances become common household items, reducing household labor and improving quality of life.\n\n§YExamples include:§!\n- Widely available home appliances\n- Improved heating and cooling devices\n- Consumer power tools"
 cwic_cg_durable_level_3_title:0 "Durable Goods (1970s Standard)"
 cwic_cg_durable_level_3_desc:0 "Improved durability, efficiency, and safety standards. Durable goods are central to productivity and household modernization.\n\n§YExamples include:§!\n- Energy-efficient appliances\n- Safer electrical devices\n- Standardized replacement parts"
 cwic_cg_durable_level_4_title:0 "Durable Goods (1980s Standard)"
 cwic_cg_durable_level_4_desc:0 "Highly reliable, standardized durable goods with long service lives. Manufacturing emphasizes efficiency and quality control.\n\n§YExamples include:§!\n- High-reliability appliances\n- Modular household equipment\n- Long-lifecycle consumer machinery"
 cwic_cg_durable_level_5_title:0 "Durable Goods (1990s Standard)"
 cwic_cg_durable_level_5_desc:0 "Fully modernized durable goods production with advanced manufacturing and global supply chains.\n\n§YExamples include:§!\n- Digitally controlled appliances\n- Modular, repairable equipment\n- Globally sourced components\n- After-sales service expectations"
 
 cwic_cg_vehicles_level_0_title:0 "Vehicles (Prewar Standard)"
 cwic_cg_vehicles_level_0_desc:0 "Vehicle production is limited, expensive, and technologically outdated. Civilian transport relies heavily on public infrastructure and non-motorized options.\n\n§YExamples include:§!\n- Low-volume automobiles\n- Prewar trucks and buses\n- Limited private vehicle ownership"
 cwic_cg_vehicles_level_1_title:0 "Vehicles (1950s Standard)"
 cwic_cg_vehicles_level_1_desc:0 "Postwar vehicle production expands rapidly, increasing civilian automobile and truck availability.\n\n§YExamples include:§!\n- Mass-produced automobiles\n- Light trucks and buses\n- Early highway-compatible vehicles"
 cwic_cg_vehicles_level_2_title:0 "Vehicles (1960s Standard)"
 cwic_cg_vehicles_level_2_desc:0 "Motorization accelerates. Vehicles become central to logistics, commuting, and economic integration.\n\n§YExamples include:§!\n- Widespread private car ownership\n- Commercial delivery vehicles\n- Expanding road networks"
 cwic_cg_vehicles_level_3_title:0 "Vehicles (1970s Standard)"
 cwic_cg_vehicles_level_3_desc:0 "Vehicles are widespread and increasingly reliable. Safety and fuel efficiency become important considerations.\n\n§YExamples include:§!\n- Improved safety standards\n- More efficient engines\n- Specialized commercial vehicles"
 cwic_cg_vehicles_level_4_title:0 "Vehicles (1980s Standard)"
 cwic_cg_vehicles_level_4_desc:0 "Highly standardized vehicle production with advanced manufacturing techniques.\n\n§YExamples include:§!\n- High-quality consumer vehicles\n- Integrated logistics fleets\n- Reliable mass transit vehicles"
 cwic_cg_vehicles_level_5_title:0 "Vehicles (1990s Standard)"
 cwic_cg_vehicles_level_5_desc:0 "Modern vehicle production characterized by global supply chains and mass ownership.\n\n§YExamples include:§!\n- Globally produced automobiles\n- Advanced logistics fleets\n- High expectations for vehicle access"
 
 cwic_cg_consumer_electronics_level_1_title:0 "Consumer Electronics (1950s Standard)"
 cwic_cg_consumer_electronics_level_1_desc:0 "Early consumer electronics become commercially viable, concentrated in urban and middle-class households.\n\n§YExamples include:§!\n- Radios\n- Early televisions\n- Basic household electrical devices\n- Simple audio equipment"
 cwic_cg_consumer_electronics_level_2_title:0 "Consumer Electronics (1960s Standard)"
 cwic_cg_consumer_electronics_level_2_desc:0 "Consumer electronics diffuse rapidly across society, becoming common household items.\n\n§YExamples include:§!\n- Widespread television ownership\n- Improved radios and audio systems\n- Household communication devices"
 cwic_cg_consumer_electronics_level_3_title:0 "Consumer Electronics (1970s Standard)"
 cwic_cg_consumer_electronics_level_3_desc:0 "Electronics play a growing role in daily life, culture, and productivity.\n\n§YExamples include:§!\n- Color televisions\n- Consumer audio systems\n- Early electronic calculators\n- Home entertainment devices\n- Early video game systems"
 cwic_cg_consumer_electronics_level_4_title:0 "Consumer Electronics (1980s Standard)"
 cwic_cg_consumer_electronics_level_4_desc:0 "Widespread ownership of advanced consumer electronics. Electronics are integral to modern living standards.\n\n§YExamples include:§!\n- Personal computers\n- Video players\n- Home video game consoles\n- Advanced home electronics\n- Digital consumer devices"
 cwic_cg_consumer_electronics_level_5_title:0 "Consumer Electronics (1990s Standard)"
 cwic_cg_consumer_electronics_level_5_desc:0 "Highly advanced consumer electronics ecosystem centered on digital technology and connectivity.\n\n§YExamples include:§!\n- Personal computing and peripherals\n- Digital media devices\n- Home video game systems\n- Consumer networking equipment\n- Electronics as baseline household goods"

 cwic_cg_basic_shortage_0:0 "Basic Consumer Goods: Balanced Supply"
 cwic_cg_basic_shortage_0_desc:0 "The supply of basic consumer goods meets or exceeds societal needs. Households have reliable access to everyday necessities, supporting workforce participation, social stability, and effective governance."

 cwic_cg_basic_shortage_1:0 "Basic Consumer Goods: Minor Shortages"
 cwic_cg_basic_shortage_1_desc:0 "Small gaps in the availability of basic consumer goods are beginning to emerge. While not yet disruptive, these shortages reduce confidence in public administration and strain daily life."

 cwic_cg_basic_shortage_2:0 "Basic Consumer Goods: Noticeable Shortages"
 cwic_cg_basic_shortage_2_desc:0 "Shortages of basic consumer goods are becoming visible across society. Households struggle to reliably access necessities, reducing productivity and undermining social cohesion."

 cwic_cg_basic_shortage_3:0 "Basic Consumer Goods: Severe Shortages"
 cwic_cg_basic_shortage_3_desc:0 "Severe shortages of basic consumer goods place heavy burdens on households. Workforce participation declines as care demands rise, and the state must increase welfare spending to maintain order."

 cwic_cg_basic_shortage_4:0 "Basic Consumer Goods: Critical Shortages"
 cwic_cg_basic_shortage_4_desc:0 "Critical shortages of essential goods disrupt daily life on a broad scale. Public dissatisfaction grows, productivity collapses, and both welfare and policing costs escalate rapidly."

 cwic_cg_basic_shortage_5:0 "Basic Consumer Goods: Systemic Breakdown"
 cwic_cg_basic_shortage_5_desc:0 "The supply of basic consumer goods has collapsed. Widespread deprivation severely limits workforce participation, destabilizes society, and places extreme strain on state institutions."

 cwic_cg_durable_shortage_0:0 "Durable Goods: Adequate Availability"
 cwic_cg_durable_shortage_0_desc:0 "Durable goods such as appliances and household machinery are readily available. This supports productivity, household efficiency, and steady economic growth."

 cwic_cg_durable_shortage_1:0 "Durable Goods: Minor Shortages"
 cwic_cg_durable_shortage_1_desc:0 "Minor shortages of durable goods reduce convenience and efficiency, but do not yet pose a serious economic threat."

 cwic_cg_durable_shortage_2:0 "Durable Goods: Noticeable Shortages"
 cwic_cg_durable_shortage_2_desc:0 "Noticeable shortages of durable goods hinder household efficiency and industrial productivity, slowing economic performance."

 cwic_cg_durable_shortage_3:0 "Durable Goods: Severe Shortages"
 cwic_cg_durable_shortage_3_desc:0 "Severe shortages of durable goods impair productivity across the economy. Public confidence in economic management begins to erode."

 cwic_cg_durable_shortage_4:0 "Durable Goods: Critical Shortages"
 cwic_cg_durable_shortage_4_desc:0 "Critical shortages of durable goods undermine industrial output and strain public services, increasing the cost of maintaining economic stability."

 cwic_cg_durable_shortage_5:0 "Durable Goods: Industrial Disruption"
 cwic_cg_durable_shortage_5_desc:0 "The durable goods sector is in collapse. Industrial productivity suffers heavily, and the state faces rising costs to prevent deeper economic breakdown."

 cwic_cg_vehicles_shortage_0:0 "Vehicles: Sufficient Supply"
 cwic_cg_vehicles_shortage_0_desc:0 "Vehicle supply meets civilian and economic needs, supporting construction, logistics, and effective state administration."

 cwic_cg_vehicles_shortage_1:0 "Vehicles: Minor Shortages"
 cwic_cg_vehicles_shortage_1_desc:0 "Minor vehicle shortages slow logistics and construction modestly, but remain manageable."

 cwic_cg_vehicles_shortage_2:0 "Vehicles: Noticeable Shortages"
 cwic_cg_vehicles_shortage_2_desc:0 "Noticeable vehicle shortages disrupt logistics networks, slow construction, and increase the cost of public service delivery."

 cwic_cg_vehicles_shortage_3:0 "Vehicles: Severe Shortages"
 cwic_cg_vehicles_shortage_3_desc:0 "Severe vehicle shortages significantly impair construction, logistics, and state reach. Policing and public service costs rise as mobility breaks down."

 cwic_cg_vehicles_shortage_4:0 "Vehicles: Critical Shortages"
 cwic_cg_vehicles_shortage_4_desc:0 "Critical shortages of vehicles cripple construction and logistics. The state struggles to maintain order and service provision across its territory."

 cwic_cg_vehicles_shortage_5:0 "Vehicles: Mobility Breakdown"
 cwic_cg_vehicles_shortage_5_desc:0 "The civilian vehicle supply has collapsed. Economic activity, construction, and state authority are severely constrained by the lack of mobility."

 cwic_cg_consumer_electronics_shortage_1:0 "Consumer Electronics: Minor Shortages"
 cwic_cg_consumer_electronics_shortage_1_desc:0 "Minor shortages of consumer electronics reduce convenience and slightly undermine confidence in modern living standards."

 cwic_cg_consumer_electronics_shortage_2:0 "Consumer Electronics: Noticeable Shortages"
 cwic_cg_consumer_electronics_shortage_2_desc:0 "Noticeable shortages of consumer electronics hinder education, information access, and service-sector efficiency."

 cwic_cg_consumer_electronics_shortage_3:0 "Consumer Electronics: Severe Shortages"
 cwic_cg_consumer_electronics_shortage_3_desc:0 "Severe shortages of consumer electronics disrupt education systems, service industries, and modern economic activity, increasing public dissatisfaction."

 cwic_cg_consumer_electronics_shortage_4:0 "Consumer Electronics: Critical Shortages"
 cwic_cg_consumer_electronics_shortage_4_desc:0 "Critical shortages of consumer electronics significantly undermine the services economy and weaken the legitimacy of modern governance."

 cwic_cg_consumer_electronics_shortage_5:0 "Consumer Electronics: Digital Collapse"
 cwic_cg_consumer_electronics_shortage_5_desc:0 "The consumer electronics ecosystem has collapsed. Education, services, and information access are severely degraded, with major political and economic consequences."

 cap_automotive_desc:0 "Represents the industrial capacity dedicated to the production of civilian and military vehicles, including automobiles, trucks, and armored platforms. Higher Automotive Capacity improves a nation's ability to scale vehicle manufacturing, sustain mechanized forces, and support transport-heavy economies."
 cap_electronics_desc:0 "Represents the industrial and technical capacity to design and manufacture electronic components, control systems, and computing hardware. Electronics Capacity affects advanced production chains, modern weapon systems, communications infrastructure, and technological modernization."
 cap_light_industry_desc:0 "Represents the capacity of consumer-focused and low-intensity manufacturing sectors, including textiles, household goods, basic tools, and small-scale industrial products. Light Industry Capacity supports civilian consumption, domestic markets, and economic stability."
 cap_management_desc:0 "Represents the administrative, organizational, and logistical capability of a state to coordinate complex industrial systems. Management Capacity influences how efficiently resources, labor, and production networks are directed and sustained across the economy."
 cap_precision_manufacturing_desc:0 "Represents the capacity for high-accuracy, high-quality industrial production, including machine tools, advanced components, and specialized manufacturing processes. Precision Manufacturing Capacity is critical for aerospace, electronics, advanced weaponry, and modern industrial supply chains."
 
