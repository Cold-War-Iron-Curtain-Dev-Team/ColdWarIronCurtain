 CWIC_ACTIVE_CRISIS_energy_industrial_shock_LOW_DESC:0 "§YLow Severity§!\nEnergy shortages are beginning to disrupt factories, transport, and industrial planning. Production is still functioning, but efficiency losses are spreading."
 CWIC_ACTIVE_CRISIS_energy_industrial_shock_MEDIUM_DESC:0 "§YMedium Severity§!\nIndustrial activity is being constrained by unreliable energy supplies. Construction, manufacturing, and logistics are increasingly vulnerable to disruption."
 CWIC_ACTIVE_CRISIS_energy_industrial_shock_HIGH_DESC:0 "§OHigh Severity§!\nEnergy shortages are causing a major industrial shock. Output, investment, and economic coordination are deteriorating under sustained supply constraints."
 CWIC_ACTIVE_CRISIS_energy_industrial_shock_EXTREME_DESC:0 "§RExtreme Severity§!\nThe industrial economy is being crippled by energy failure. Production chains are breaking down and recovery will require major energy-system stabilization."

 CWIC_ACTIVE_CRISIS_famine_spiral_LOW_DESC:0 "§YLow Severity§!\nFood shortages are beginning to interact with wider economic weakness. Productivity and stability are both starting to suffer."
 CWIC_ACTIVE_CRISIS_famine_spiral_MEDIUM_DESC:0 "§YMedium Severity§!\nFood scarcity is reinforcing economic decline. Shortages are damaging labor productivity and increasing pressure on public order."
 CWIC_ACTIVE_CRISIS_famine_spiral_HIGH_DESC:0 "§OHigh Severity§!\nThe food crisis has become self-reinforcing. Hunger, instability, and economic breakdown are deepening one another."
 CWIC_ACTIVE_CRISIS_famine_spiral_EXTREME_DESC:0 "§RExtreme Severity§!\nA catastrophic famine spiral is underway. Food scarcity is driving labor loss, social breakdown, and severe economic collapse."

 CWIC_ACTIVE_CRISIS_capital_flight_LOW_DESC:0 "§YLow Severity§!\nInvestors are beginning to move capital out of the country. Domestic investment is weakening as confidence erodes."
 CWIC_ACTIVE_CRISIS_capital_flight_MEDIUM_DESC:0 "§YMedium Severity§!\nCapital outflows are accelerating. Businesses and financial institutions are increasingly unwilling to keep funds in the domestic economy."
 CWIC_ACTIVE_CRISIS_capital_flight_HIGH_DESC:0 "§OHigh Severity§!\nLarge-scale capital flight is draining investment and undermining financial stability. Recovery is becoming harder as confidence collapses."
 CWIC_ACTIVE_CRISIS_capital_flight_EXTREME_DESC:0 "§RExtreme Severity§!\nCapital is fleeing at a devastating pace. The economy is being starved of investment and financial control is rapidly deteriorating."

 CWIC_ACTIVE_CRISIS_austerity_trap_LOW_DESC:0 "§YLow Severity§!\nFiscal restraint is beginning to suppress growth. Efforts to stabilize the budget are slowing investment and demand."
 CWIC_ACTIVE_CRISIS_austerity_trap_MEDIUM_DESC:0 "§YMedium Severity§!\nAusterity is weighing heavily on recovery. Cuts meant to restore stability are also weakening productivity and economic momentum."
 CWIC_ACTIVE_CRISIS_austerity_trap_HIGH_DESC:0 "§OHigh Severity§!\nThe economy is trapped between fiscal pressure and contraction. Austerity is deepening the downturn while failing to restore confidence."
 CWIC_ACTIVE_CRISIS_austerity_trap_EXTREME_DESC:0 "§RExtreme Severity§!\nSevere austerity has become self-defeating. Public retrenchment is collapsing growth, weakening stability, and preventing meaningful recovery."

 CWIC_ACTIVE_CRISIS_resource_curse_LOW_DESC:0 "§YLow Severity§!\nExtractive dependence is beginning to distort the wider economy. Resource income is discouraging diversification and strengthening rent-seeking behavior."
 CWIC_ACTIVE_CRISIS_resource_curse_MEDIUM_DESC:0 "§YMedium Severity§!\nThe economy is increasingly shaped by resource rents. Productive development, research, and institutional quality are being undermined."
 CWIC_ACTIVE_CRISIS_resource_curse_HIGH_DESC:0 "§OHigh Severity§!\nResource dependence has become a structural weakness. Extractive wealth is reinforcing corruption, volatility, and weak diversification."
 CWIC_ACTIVE_CRISIS_resource_curse_EXTREME_DESC:0 "§RExtreme Severity§!\nThe country is deeply trapped by extractive dependency. Institutions, innovation, and balanced development are being sacrificed to resource rents."

 CWIC_ACTIVE_CRISIS_militarized_economy_lock_in_LOW_DESC:0 "§YLow Severity§!\nMilitary priorities are beginning to crowd out civilian activity. Arms production is strengthened, but civilian efficiency is weakening."
 CWIC_ACTIVE_CRISIS_militarized_economy_lock_in_MEDIUM_DESC:0 "§YMedium Severity§!\nThe economy is increasingly organized around military needs. Civilian investment, research, and productivity are being suppressed."
 CWIC_ACTIVE_CRISIS_militarized_economy_lock_in_HIGH_DESC:0 "§OHigh Severity§!\nMilitarization has become deeply embedded in the economy. Military output rises while civilian development and long-term resilience decline."
 CWIC_ACTIVE_CRISIS_militarized_economy_lock_in_EXTREME_DESC:0 "§RExtreme Severity§!\nThe economy is locked into permanent militarization. Civilian growth, innovation, and living standards are being sacrificed to sustain military capacity."

 CWIC_ACTIVE_CRISIS_NO_DESCRIPTION:0 "§RNo description available.§!"


 CWIC_POTENTIAL_CRISIS_FISCAL_DESC:0 "A fiscal crisis occurs when government finances become unsustainable. Excessive deficits, debt burdens, or debt servicing costs reduce the state's ability to fund development and respond to challenges."

 CWIC_POTENTIAL_CRISIS_ECONOMIC_CONTRACTION_DESC:0 "Economic contraction represents declining economic activity. Falling output, investment, and employment can reduce growth and weaken national prosperity."

 CWIC_POTENTIAL_CRISIS_INFLATION_DESC:0 "Inflation occurs when prices rise persistently throughout the economy. While moderate inflation can accompany growth, excessive inflation undermines purchasing power and economic stability."

 CWIC_POTENTIAL_CRISIS_DEFLATION_DESC:0 "Deflation occurs when prices fall across the economy. Persistent deflation discourages investment and consumption, often worsening economic slowdowns."

 CWIC_POTENTIAL_CRISIS_ENERGY_DESC:0 "Energy crises emerge when demand for energy exceeds available supply. Industrial production, transportation, and economic growth all depend heavily on reliable energy access."

 CWIC_POTENTIAL_CRISIS_TRADE_EXTERNAL_SHOCK_DESC:0 "External trade shocks occur when international markets, imports, exports, or foreign exchange systems are disrupted. Trade-dependent economies are especially vulnerable."

 CWIC_POTENTIAL_CRISIS_FINANCIAL_CREDIT_DESC:0 "Credit crises occur when access to financing becomes restricted. Weak banking systems, defaults, and financial instability can severely reduce investment and economic growth."

 CWIC_POTENTIAL_CRISIS_GOVERNANCE_INSTITUTIONAL_DESC:0 "Governance crises emerge when institutions lose effectiveness or legitimacy. Corruption, separatism, insurgency, and instability can undermine state capacity."

 CWIC_POTENTIAL_CRISIS_CROP_FAILURE_DESC:0 "Crop failures represent major disruptions in agricultural production. Drought, conflict, environmental damage, or poor harvests can reduce food output and rural incomes."

 CWIC_POTENTIAL_CRISIS_FOOD_SECURITY_FAMINE_DESC:0 "Food security crises occur when populations struggle to obtain adequate food supplies. Persistent shortages can reduce productivity, increase instability, and trigger famine."

 CWIC_POTENTIAL_CRISIS_STAGFLATION_DESC:0 "Stagflation combines weak economic growth with persistent inflation. It is particularly difficult to resolve because policies that address one problem often worsen the other."

 CWIC_POTENTIAL_CRISIS_DEBT_TRAP_DESC:0 "Debt traps occur when debt burdens become so large that they restrict investment, growth, and economic flexibility. Resources increasingly flow toward debt servicing rather than development."

 CWIC_POTENTIAL_CRISIS_COLLAPSE_SPIRAL_DESC:0 "A collapse spiral occurs when multiple crises reinforce one another. Economic, political, and social problems compound, making recovery progressively more difficult."

 CWIC_POTENTIAL_CRISIS_ENERGY_INDUSTRIAL_SHOCK_DESC:0 "Energy-industrial shocks occur when energy shortages significantly disrupt industrial production. Manufacturing, infrastructure, and investment become increasingly constrained."

 CWIC_POTENTIAL_CRISIS_FAMINE_SPIRAL_DESC:0 "A famine spiral develops when food shortages begin reinforcing wider economic decline. Falling productivity and worsening instability can deepen the food crisis further."

 CWIC_POTENTIAL_CRISIS_CAPITAL_FLIGHT_DESC:0 "Capital flight occurs when investors move money and assets abroad. Reduced investment weakens economic growth and can destabilize financial systems."

 CWIC_POTENTIAL_CRISIS_AUSTERITY_TRAP_DESC:0 "An austerity trap occurs when efforts to restore fiscal stability through spending cuts suppress growth and worsen economic conditions."

 CWIC_POTENTIAL_CRISIS_RESOURCE_CURSE_DESC:0 "The resource curse describes economic distortion caused by excessive dependence on extractive industries. Resource wealth can discourage diversification and weaken institutions."

 CWIC_POTENTIAL_CRISIS_MILITARIZED_ECONOMY_LOCK_IN_DESC:0 "A militarized economy becomes heavily dependent on military production and spending. While defense output rises, civilian development and long-term economic resilience often suffer."

 CWIC_POTENTIAL_CRISIS_UNKNOWN_DESC:0 "No information is available for this crisis type."

