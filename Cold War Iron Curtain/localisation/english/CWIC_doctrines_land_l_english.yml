l_english:
 GRAND_DOCTRINE_CW_FORWARD_DEFENSE: "Forward Defense"
 GRAND_DOCTRINE_CW_FORWARD_DEFENSE_DESC: "NATO planning from the Fulda Gap to AirLand Battle: hold the line as far east as possible, trade space for time only under control, and let combined arms and air power break the echelons the Warsaw Pact feeds forward."
 GRAND_DOCTRINE_CW_DEEP_BATTLE: "Deep Battle"
 GRAND_DOCTRINE_CW_DEEP_BATTLE_DESC: "The Soviet school of echeloned offensives: mass, momentum and operational depth. Fix the enemy with first echelon fires, then pour armor through the breach before he can form a second line."
 GRAND_DOCTRINE_CW_PEOPLES_WAR: "People's War"
 GRAND_DOCTRINE_CW_PEOPLES_WAR_DESC: "Mao's doctrine of protracted war: the army is the fish and the people the sea. Trade space for time, bleed the enemy in the countryside, and strike when the balance has shifted."
 GRAND_DOCTRINE_CW_INTERVENTION_PACIFICATION: "Intervention and Pacification"
 GRAND_DOCTRINE_CW_INTERVENTION_PACIFICATION_DESC: "The French and colonial school: small professional forces, rapid projection and revolutionary-war methods to hold the empire's far frontiers against insurgents and rival powers alike."
 GRAND_DOCTRINE_CW_PREEMPTIVE_MANEUVER: "Preemptive Maneuver"
 GRAND_DOCTRINE_CW_PREEMPTIVE_MANEUVER_DESC: "Israel's answer to strategic depth of zero: strike first, move fast, fight on enemy soil. Armor and air power win the war in days before reservists exhaust the economy."
 GRAND_DOCTRINE_CW_TOTAL_NATIONAL_DEFENSE: "Total National Defense"
 GRAND_DOCTRINE_CW_TOTAL_NATIONAL_DEFENSE_DESC: "The doctrine of the armed neutral: every citizen a soldier, every ridge a fortress. No invader can occupy a nation that will make the occupation unbearable."
 GRAND_DOCTRINE_CW_REVOLUTIONARY_INSURGENCY: "Revolutionary Insurgency"
 GRAND_DOCTRINE_CW_REVOLUTIONARY_INSURGENCY_DESC: "Foco and irregular war: a small determined vanguard, popular grievance and sanctuary can unseat a modern army. Politics and the ambush matter more than the battlefield."
