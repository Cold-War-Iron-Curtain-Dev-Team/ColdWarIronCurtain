 ### NLF ###
 ## Ideas
 NLF_rev_cohesion: "Revolutionary Cohesion"
 NLF_rev_cohesion_desc: "Despite distance from the central command in the North, Southern cadres maintain an unbreakable ideological and organizational unity, allowing them to resist even under extreme pressure."
 NLF_nguyen_binh_command: "Nguyen Binh's Command"
 NLF_nguyen_binh_command_desc: "Nguyen Binh's leadership style blends rigid discipline with flexible guerrilla tactics, transforming scattered cells into a coordinated fighting force capable of ambushing and outmaneuvering a superior enemy."
 NLF_guerilla_network: "Organized Guerrilla Network"
 NLF_guerilla_network_desc: "The Southern Viet Minh's infrastructure enables seamless movement through villages, jungles, and underground tunnels, sustaining the insurgency even under constant assault."
 NLF_vietminh_disarray: "Disarray in the Ranks"
 NLF_vietminh_disarray_desc: "With Binh gone, partisan unity collapses into factionalism. Trust erodes. Coordination falters."
 NLF_fractured_command_structure: "Fractured Command Structure"
 NLF_fractured_command_structure_desc: "Nguyen Binh's absence leaves a vacuum of authority, filled by ambitious yet inexperienced commanders."
 NLF_post_binh_disorganization: "Post-Binh Disorganization"
 NLF_post_binh_disorganization_desc: "Supply lines once tightly managed now break down. Guerilla tactics grow reckless and costly without central oversight."