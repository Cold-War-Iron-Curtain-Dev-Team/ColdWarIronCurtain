 prc.1000.a2:0 "Flooding seems to be a Chinese problem."
 prc.1000.d2:0 "China has seen one of the most catastrophic floods in its history. The Yellow River has flooded its banks once again. The last time the Yellow River flooded was in 1938, as the Nationalist Chinese government destroyed the dykes in order to stop the Japanese advance. This time, over 790,000 cubic feet of water have flooded the Yellow River, however many levees have held. The Chinese government has been receiving Soviet aid to create a flood management system for the Yellow River.  The death toll is estimated to be greater than the around 500,000 deaths of the 1938 flood, but no official information has been released. Zhou Enlai, the Chinese Premier, has visited the disaster zone."
 prc.1000.t2:0 "[GetNewspaperHeader]Yellow River Flooding"
