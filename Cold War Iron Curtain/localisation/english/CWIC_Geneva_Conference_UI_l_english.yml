 GENEVA_UI_HELP_TT: "§WHow the conference works§!\nSeven clauses are on the table. Every week the delegations vote on each one: a delegation's vote is its §WWeight§! times how much it cares about the clause, plus any stakes that have landed. The winning option is tabled.\n\n§WClick a clause§! in the Ordre du jour to negotiate on it, and §Wclick an option§! to choose the outcome you will Champion. §WClick a chair§! to target that delegation with Pressure or the Back-Channel.\n\nEach delegation may take §Wtwo actions§! per round. Champion and Threaten open a three-day negotiation whose stake lands in the next vote.\n\n§GAgreed§!: an option that wins two votes in a row with nobody pushing or negotiating on the clause is settled for the rest of the conference.\n§RNon-negotiable§!: when a core delegation threatens to walk out over a clause and its option then carries the vote, the clause is settled on its terms.\n\nDelegations lose §WPatience§! while the table goes against them; at zero they walk out. If two of the core belligerents walk out, or the table holds no ceasefire at the final vote, the conference collapses and the war resumes. Otherwise the accords are signed after round 10, or earlier if a core delegation forces the vote."
