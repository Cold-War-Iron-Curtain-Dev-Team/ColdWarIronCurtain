l_english:
 GCC_peninsula_shield_decisions:0 "Peninsula Shield Decisions"
 GCC_peninsula_shield_decisions_desc:0 "Defence cooperation among the six Gulf states. Contingents committed to the joint force: [?global.GCC_force_contributor_count|0]"
 GCC_Fund_Defence_Liaison:0 "Fund Defence Liaison"
