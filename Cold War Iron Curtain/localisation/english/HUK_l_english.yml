###Focus Tree###
 HUK_Condemn_Quezon_Raid:0 "Condemn The Raid On Quezon Family"
 HUK_Condemn_Quezon_Raid_desc:0 "The attack on the convoy of Aurora Quezon, former First Lady and head of the Philippine Red Cross, was a disastrous blunder. While radical elements within the movement saw it as a strike against the ruling elite, the killing of Quezon and her daughter horrified the public and cost us valuable support. The central leadership of the Party must act quickly to condemn this reckless act, distance itself from those responsible, and reaffirm our commitment to the people’s struggle. If we fail to control our own ranks, we risk losing the very people we seek to liberate."
 HUK_Make_Village_Contacts:0 "Establishing Contacts With Barrios"
 HUK_Make_Village_Contacts_desc:0 "The strength of the revolution lies in the masses. By sending our cadres deep into the countryside, we can establish connections with peasant communities, secure food and shelter for our fighters, and start forming the governing infrastructure for our eventual takeover. Up to 15 members of every barrio will be armed to coordinate communications between the party and the people. The landlords and their reactionary allies will find it impossible to break our growing support network."
 HUK_Disrupt_Enemy_Convoys:0 "Disrupting Enemy Convoy Routes"
 HUK_Disrupt_Enemy_Convoys_desc:0 "The government relies on colonial era supply lines to maintain control over the countryside. With a couple well timed hits on major routes and disappearing into the jungles before they could respond we can weaken their ability to sustain operations and force them onto the defensive. Every bullet and ration we take back in the name of the people brings us one step closer to victory."
 HUK_Capture_Enemy_Equipment:0 "Utilizing The Enemy's Equipment"
 HUK_Capture_Enemy_Equipment_desc:0 "A major obstacle facing our movement is the lack of sufficient armaments and communication devices. So far what little equipment we have we obtained through Manila's black market as well as from aftermath of particularly long battles. To comfortably arm our troops we ought to organize raids on government outposts and recruit armed fighters whenever possible. This will not only arm our growing ranks but also deprive the enemy of much-needed resources."
 HUK_Declare_Election_Fraud:0 "Expose The 1949 Elections As Fraudulent"
 HUK_Declare_Election_Fraud_desc:0 "The so-called democracy of the "republic"  is nothing but a farce. The 1949 elections were stolen through intimidation, bribery, and fraud to maintain the colonial rule of the reactionary landlords and American puppets; killing several hundred of our brethren in the process. We will expose these crimes against the Filipino people and show that real change cannot come from rigged ballots but through revolution. Bullets, not ballots!"
 HUK_Declare_Revolutionary_Situation:0 "Declare The Existence Of Revolutionary Situation"
 HUK_Declare_Revolutionary_Situation_desc:0 "The time for waiting has passed—the revolution is now! The Enlarged Politburo Conference in Laguna has formally declared a revolutionary situation in response to the widespread repression and election fraud committed by the puppet regime. The time is most ripe for us to increase our activities in military action, political expansion and mass mobilization. With an estimated support base of more than two million our takeover of the government will be achieved in a grand uprising before the end of next year!"
 HUK_Ideological_Purity:0 "Break Ranks With The Political Wing"
 HUK_Ignore_China_Branch:0 "Ignore Advice From The China Branch"
 HUK_Mountain_Homes:0 "Make Homes Of Mountains"
 HUK_Focus_On_Production_Bases:0 "Expand Reliance On Production Bases"
 HUK_Villager_Intel:0 "Rural Information Networks"
 HUK_Discipline_Remaining_Army:0 "Increase Discipline In The Liberation Army"
 HUK_Mend_Schism:0 "Mend Ideological Schism"
 HUK_Mend_Schism_desc:0 "The tensions between the political and army wings threatens the integrity of our intel networks, and therefore the whole revolution. Acting independently or worse, against each other reduces the effectiveness of both groups and will only play into the hands of the enemy. With no apparent way to compromise, the best thing to do is accept CPP political leadership while we ourselves focus our efforts on the ground work."
 HUK_Rebuild_Credibility:0 "Rebuild Our International Credibility"
 HUK_Rebuild_Credibility_desc:0 "The stain left on us by Mrs. Quezon's assassination is a constant source of problems for us. The wider international community still views us as a bunch of lawless militias executing anyone who we deem an enemy, soldier and civilian alike. We should increase our urban and political presence to show the world and our potential supporters that we are the voice of the people, and the solution to this broken corrupt system!"
 HUK_Assure_People:0 "Promises Of Total Independence"
 HUK_Assure_People_desc:0 "There is an apparent belief among some of the people that we are simply fighting to replace American colonial hegemony with a Soviet one. It is true we are following Soviet leadership, but we do so in socialist brotherhood, not servitude! To smooth our liberation of the nation, these kinds of fears must be soothed and people must be assured we are fighting for complete independence of this country!"
