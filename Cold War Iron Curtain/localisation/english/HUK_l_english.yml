###Huk Insurgency###
 
 Huks_Insurgency_Decisions:0 "Hukbalahap Insurgency Decisions"
 huks_surrender:0 "Negotiate Surrender Terms With Taruc"
 huks_attack_manila:0 "Assault Manila"
 huks_attack_manila_desc:0 "Our fighters trained, our party base strengthened and our supporters in the millions. The time has come to launch our march to national capital and bring down the bourgeois system once and for all!"
 huks_attack_hacienda_luisita:0 "Prepare An Attack On Hacienda Luisita"
 huks_attack_hacienda_luisita_desc:0 "Hacienda Luisita is a 6.4 thousand hectar sugar plantation situated at the heart of Tarlac City. Despite the existance of natural enmity between us, our relations with the plantation hasn't been all bad. Save from a couple incidents over the years the managers allowed our Huk soldiers to use their facilities, and even allow recruiting local workers to our cause. These cool relations don't come without downsides, of course. The plantation works as the biggest obstacle to our expansion into the regions beyond.\n\nMaking an open enemy of the plantations will surely push them towards supporting government forces to erradicate us, and we can just simply ignore them until the revolution is achieved. But if we want to reach the people of Western Luzon liberating the plantation is a must."
