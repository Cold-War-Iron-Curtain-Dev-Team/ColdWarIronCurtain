 HUK_prp.1.t:0 "The Sixth Party Congress of the Hukbalahap"
 HUK_prp.1.d: "Our Communist Party of the Philippines convened the Sixth Party Congress, proclaimed as the first truly free revolutionary congress of the Filipino people since the age of Andres Bonifacio and the Katipunan. Held under the authority of our new People’s Government, the congress marked the formal transition from armed revolution to the construction of a socialist state.\n\nDelegates from peasant armies, workers’ unions, and liberated barrios gathered to define the foundations of the new society. Central to the Congress were resolutions on de-Haciendanization and radical land reform, declaring the abolition of landlord estates and the redistribution and collectivization of land as the historic demand of the peasantry. All major means of production and accumulated capitalist possessions were declared subject to social ownership under the people’s state.\n\nThe Congress also emphasized the eradication of illiteracy as a revolutionary duty, linking mass education to political consciousness and national liberation. Cultural reform and the dismantling of old elite institutions were framed as essential steps in breaking the legacy of colonialism and feudal capitalism.\n\nConcluding the Congress, it's now up to the politburo to choose between two leaders: Luis Turac, our current leader, and a Christian Democratic Socialist; or Guillermo Capadocia, a prominent figure in the party, and an orthodox communist. As the votes are being counted one by one, the politburo was as tense as ever. At last, the congress' decision will be..."
 HUK_prp.1.a:0 "The Congress keeps Luis Taruc."
 HUK_prp.1.b:0 "The Congress elects Guillermo Capadocia."
 HUK_prp.2.t: "Denunciation of the Southern Rump State"
 HUK_prp.2.d: "With the glorious revolution triumphant across much of Luzon, our People’s Government under the Comrade [GET.HUK LEADER] and our Communist Party's Department of Communications and Propaganda has formally denounced the so-called “Southern Philippine State” as an illegitimate remnant of imperialism. Our Chairman has declared that the former Philippine Republic has collapsed, its authority reduced to a fleeing clique of officials and generals who have escaped to Mindanao under foreign protection.\n\nThe southern administration represents nothing more than a U.S.-backed refuge for evil reactionaries, landlords, and defeated military commanders unwilling to accept the will of the Filipino people. Our Party has condemned these forces for attempting to divide the nation and prolong civil war in the service of American interests.\n\nThe People's Army has also taken note of U.S. naval deployments from Palau, describing them as a clear act of intimidation aimed at containing the revolution. Revolutionary spokesmen warned that foreign interference will only strengthen popular resistance and accelerate the liberation of the southern islands.\n\nOur Communist Party have called on the people of Mindanao and the Visayas to reject the rump state, rise against reactionary rule, and complete the final phase of the National Revolution for a united, independent, and socialist Philippines."
 HUK_prp.2.a: "We must be united in land and united in thought."
 HUK_prp.3.t: "The Cult of Comrade Andres Bonifacio"
 HUK_prp.3.d: "Our People’s Government and the Communist Party has formally proclaimed the Cult of Comrade Andres Bonifacio, elevating him as the supreme revolutionary forebear of the Filipino masses and a “Bolshevik avant la lettre,” a revolutionary who embodied proletarian struggle before the arrival of Marxism in the archipelago. The declaration framed Bonifacio not merely as a national hero, but as the spiritual and ideological ancestor of the present socialist revolution.\n\nOur Party theorists emphasized that Bonifacio drew strength from the armed resistance of the Katipunan and from the universal ideals of liberty, equality, and brotherhood born of the old bourgeois democratic revolutions, particularly that of France. Inspired by the anti-colonial critiques found in the novels of José Rizal, Bonifacio nonetheless rejected the limits of reformism and “appeals” to colonial masters, recognizing armed struggle as the only path to genuine liberation.\n\nThe Katipunan, founded on 7 July 1892, was celebrated as the first organization to unite workers and peasants across Luzon, the Visayas, and Mindanao under a single banner of national liberation. Through clandestine organization and mass participation, it transformed centuries of scattered revolts into a unified revolutionary movement. The outbreak of the 1896 Revolution and the execution of Rizal were presented as decisive moments that proved the necessity of armed resistance against colonial domination.\n\nThe congress further declared that the Katipunan’s reliance on bolos and the sacrifice of the toiling masses symbolized the authentic revolutionary character of Bonifacio’s struggle, one that continued through resistance against American rule."
 HUK_prp.3.a: "This is the time for the light of truth to surface."
 HUK_prp.4.t: "Begin the De-Catholicization Process"
 HUK_prp.4.d: "Our People’s Government, under the leadership of Chairman [ HUK,GETLEADER]  and the Communist Party, announced a nationwide campaign of de-Catholicization as part of the broader cultural and ideological transformation of Revolutionary Philippines. The declaration argued that Christianity, as imposed and practiced under Spanish and later bourgeois rule, had been systematically distorted and weaponized by colonial elites to preserve class hierarchy, racial domination, and social passivity.\n\nParty resolutions stated that the original message attributed to Jesus Christ—communal life, rejection of wealth, and solidarity with the poor—had been hijacked by colonial administrators, landed elites, and the comprador bourgeoisie. Through enforced conversion, tithes, and clerical authority, Catholicism was portrayed as a mechanism that disciplined the masses, sanctified inequality, and legitimized foreign domination while eroding indigenous cultures and belief systems.\n\nOur Revolutionary society could no longer be built upon institutions that justified feudal obedience, class exploitation, and racialized colonial order. Churches were stripped of political authority, religious education was removed from public institutions, and clerical privileges were abolished."
 HUK_prp.4.a: "Reason teaches us not to waste time hoping for the promised prosperity that will never come and never materialise."
 HUK_prp.5.t: "The Capital Question"
 HUK_prp.5.d: "Following the consolidation of power by our revolutionary government, the status of the national capital emerged as a major political and economic issue. Quezon City, proclaimed capital in 1948 by the former Quirino’s puppet regime, was officially denounced by our Party as a bourgeois vanity project—ill-planned, unfinished, and financially compromised. Revolutionary audits revealed that large numbers of foreign advisors, contractors, and political intermediaries had fled the country during the collapse of the old republic, taking with them millions of pesos allocated for the city’s construction.\n\nThe Communist Party and the Hukbalahap leadership criticized Quezon City as a symbol of elite corruption: an artificial capital imposed while Manila itself suffered from severe housing shortages, slum expansion, sanitation crises, and chronic congestion in districts such as Tondo, Binondo, Quiapo, and Intramuros. \n\nA new proposal called for relocating the capital to Baguio, citing its higher elevation, reduced vulnerability to typhoons, strategic position in Central Luzon, and large undeveloped areas suitable for planned socialist urban expansion."
 HUK_prp.5.a: "Temporary Return to Manila"
 HUK_prp.5.b: "Completion of Quezon City"
 HUK_prp.5.c: "Relocation to Baguio"
 HUK_prp.6.t: "Unification of the Workers’ Movement under the KAP"
 HUK_prp.6.d: "Following the victory of our people’s revolution, the Hukbalahap government and the Communist Party proclaimed the full combinenization of all trade unions and independent workers’ organizations into a single nationwide federation: the Katipunan ng mga Anak-Pawis sa Pilipinas (KAP), officially designated as the All-Philippines People’s Combined Workers Union.\n\nThe new state declared that the fragmented labor movement of the old republic had been deliberately weakened by colonial authorities, reformist leaders, and comprador elites. Rival unions, corrupt officials, and legalistic constraints were said to have divided workers along sectoral, regional, and ethnic lines, preventing unified class action. The consolidation of labor organizations was presented as a historic correction, restoring the revolutionary continuity of the workers’ movement dating back to the original Katipunan and the early proletarian struggles of the 1920s and 1930s.\n\nDrawing on the legacy of Crisanto Evangelista, Guillermo Capadocia, Luis Taruc, and the Collective Labor Movement of the prewar era, the KAP was reconstituted as the sole representative of the proletariat in factories, plantations, ports, and transport networks. All existing unions were ordered to dissolve and re-register under KAP structures, aligning workplace organization directly with Party leadership and the revolutionary state."
 HUK_prp.6.a: "Diligence in your daily work to earn a living is the true expression of love and affection."
 HUK_prp.7.t: "The Fate of the Quezon Cult"
 HUK_prp.7.d: "With the consolidation of our revolutionary government, our Party and the Provisional People’s Council were forced to confront the legacy of President Manuel L. Quezon and the cult of personality that had grown around him during the Commonwealth era.\n\nQuezon occupied a uniquely contradictory position in revolutionary discourse. As a bourgeois nationalist and head of the U.S.-backed Commonwealth, he was undeniably tied to American imperial structures. Yet he was also remembered as a champion of national independence, social justice, the national language, and peasant welfare. His defiance of Japanese occupation, leadership of the government-in-exile, and humanitarian rescue of European Jews further complicated attempts at simple condemnation.\n\nLuis Taruc himself expressed a personal respect. Despite standing on opposing ideological sides, Taruc respected Quezon’s sincerity toward the peasantry, while Quezon had privately recognized Taruc as a genuine mass leader rather than a criminal agitator. Taruc also recalled his long-standing ties with the Quezon family, noting their refusal to believe hostile propaganda against him even after the tragic 1949 ambush that killed Aurora Quezon.\n\nThere are two options remaining regarding it:"
 HUK_prp.7.a: "Give it a revolutionary reinterpretation."
 HUK_prp.7.b: "Totally demystify him."
 
