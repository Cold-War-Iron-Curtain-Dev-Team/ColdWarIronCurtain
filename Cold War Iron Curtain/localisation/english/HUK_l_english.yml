 huk_chinese_advisors:0 "Chinese Advisors"
 huk_chinese_advisors_desc:0 "Represented by the Chinese Branch of the PKP, these mainland advisors have helped us a great deal during and after the Japanese invasion. Although their influence over the army command has certainly decreased since the war's end we can still rely on them to get an edge over the enemy."
 huk_stalin_university:0 "The Stalin University"
 huk_stalin_university_desc:0 "Situated at the foot of the Sierra Madre mountain range, The Stalin University is a semi-permanent learning institute where promising recruits are taught in all manners warfare and people are educated in the Marxist system. Being a mobile camp, the institution can be moved in times of government raids to make sure it never ceases functionality."
