 USA_mkultra_replicate_gateway_assessment_desc: "Subject the Gateway findings to independent analytical review by scientific personnel. Costs §Y25 Political Power§!. Adds §R1 Exposure Pressure§!. Completing 90 days of replication awards §G6 Research Record§!."
