 # Remote-viewing appraisal (Army charter)
 USA_mkultra_commission_remote_viewing: "Authorize a Remote-Viewing Remit"
 USA_mkultra_commission_remote_viewing_desc: "Army intelligence asks to evaluate whether trained viewers can describe distant targets well enough to be of use. The sponsor's briefing describes promising sessions. It does not describe what would count as a useful one. Costs §Y30 Political Power§!, plus a §Y20 Political Power§! archive-reconstruction fee unless the MKSEARCH surviving-lines inventory was retained and the 1973 working files were not destroyed. Adds §R2 Exposure Pressure§! and §G0 Harm§!. Completing the 90-day study awards §G14 Research Record§!."
 USA_mkultra_commission_remote_viewing_tt: "Commit §Y30 Political Power§! (§Y50§! if the earlier archive must be reconstructed), add §R2 Exposure Pressure§!, and begin a 90-day study."
 USA_mkultra_rv_research: "Remote Viewing — Sessions Underway"
 USA_mkultra_rv_research_desc: "Viewers are working against sealed targets under the sponsor's protocol. At the end of §Y90 days§!, completion awards §G14 Research Record§! and opens the report."
 USA_mkultra_rv_review: "Remote Viewing — Review the Session Report"
 USA_mkultra_rv_review_desc: "§YSubmitted claim:§! Several sessions produced descriptions that matched their targets better than chance.\n§YCurrent appraisal:§! The matches were judged by the program's own staff, and the sessions that matched are the ones the report describes in detail.\n§YValidated application:§! None established.\n\nWithin §Y30 days§!, commission an independent utility review or archive the report. If ignored, it is archived automatically."
 USA_mkultra_review_remote_viewing: "Commission an Independent Utility Review"
 USA_mkultra_review_remote_viewing_desc: "Ask outside evaluators two separate questions: is there an effect in the laboratory, and would anyone act on it in an operation? Costs §Y30 Political Power§!. Adds §R1 Exposure Pressure§!. Completing the 90-day review awards §G6 Research Record§!."
 USA_mkultra_review_remote_viewing_tt: "Commit §Y30 Political Power§! to a 90-day independent utility review."
 USA_mkultra_rv_utility_research: "Remote Viewing — Utility Review Underway"
 USA_mkultra_rv_utility_research_desc: "Outside evaluators are separating the laboratory statistics from the operational record."
 USA_mkultra_rv_final_review: "Remote Viewing — Final Appraisal"
 USA_mkultra_rv_final_review_desc: "The reviewers agree on more than the sponsor expected and less than it hoped. Some laboratory results are hard to dismiss. None of the operational descriptions was specific, timely and reliable enough for anyone to have acted on it.\n\nThe useful product is the distinction itself. Retain it as a standard, or archive the dossier."
 USA_mkultra_apply_utility_standard: "Retain the Utility Review Standard"
 USA_mkultra_apply_utility_standard_desc: "File the review's method as a standing finding: an interesting observation is not an actionable one until someone could have acted on it. It confers no capability. If the 1995 review decommissions the program, it closes on the record with a further §G10§! reduction in Exposure Pressure."
 USA_mkultra_apply_utility_standard_tt: "Records the §YUtility Review Standard§! finding, archives the dossier, and releases its slot."
 USA_mkultra_archive_remote_viewing: "Archive the Remote-Viewing Dossier"
 USA_mkultra_archive_remote_viewing_desc: "Close and archive the dossier, releasing the Army charter's slot. Committed exposure remains on the record."
 USA_mkultra_archive_remote_viewing_tt: "Archive the dossier and release its slot."
 cwic_mkultra.441.t: "The 1995 AIR Review: A Background Brief"
 cwic_mkultra.441.d: "On 29 September 1995, the American Institutes for Research completed its evaluation of remote-viewing research conducted for the intelligence community. It distinguishes laboratory results that are difficult to dismiss from operational use that was never demonstrated.\n\nThe report reaches the desk as a background brief. This administration never authorized a remote-viewing remit of its own, and the evaluation concerns other people's files. It is read, initialed and filed."
 cwic_mkultra.441.a: "File the brief."
 USA_mkultra_air_background_brief_tt: "No program decision is required; the brief is filed for reference."

