 USA_mkultra_replicate_mksearch_desc: "Have an outside team check the continuation report against what the records actually contain. Costs §Y30 Political Power§! (§Y40§! under compartmentalization; §G5 less§! with the Reliable Internal Appraisal finding). Adds §R1 Exposure Pressure§! and §G0 Harm§!. Completing the 90-day appraisal awards §G6 Research Record§!."
 USA_mkultra_replicate_mksearch_tt: "Commit Political Power to an independent appraisal of the surviving lines."
 USA_mkultra_mksearch_replication_research: "MKSEARCH — Independent Appraisal Underway"
 USA_mkultra_mksearch_replication_research_desc: "An outside team is matching each surviving line to the records that are supposed to support it."
