 # MKSEARCH continuation (FY1966-FY1972)
 cwic_mkultra.340.t: "A Narrower Umbrella: Project MKSEARCH"
 cwic_mkultra.340.d: "The reorganization the Inspector General's audit set in motion has reached the budget cycle. The original MKUltra umbrella is being retired. In its place the Technical Services Division proposes MKSEARCH: a smaller continuation that keeps the contractor lines it considers productive and drops the ones it can no longer defend.\n\nThe proposal is candid about what it inherits: records, a reduced network of contractors, and the liabilities of everything that came before. It is less candid about what the surviving lines are expected to establish. The covering memorandum describes the remit as narrower. The attached budget describes it as continuing."
 cwic_mkultra.340.a: "Fund the continuation under the narrower remit."
 cwic_mkultra.340.b: "Let the umbrella lapse without a successor."
 USA_mkultra_mksearch_remit_accept_tt: "Opens the §YMKSEARCH§! remit until funding ends with FY1972. One finite dossier becomes available. Midnight Climax can no longer be renewed, and an uncommissioned Midnight Climax dossier is foreclosed."
 USA_mkultra_mksearch_remit_decline_tt: "No continuation remit is opened. The existing charter and its records are unaffected."
 cwic_mkultra.345.t: "MKSEARCH Funding Ends"
 cwic_mkultra.345.d: "Fiscal Year 1972 has closed without a renewed appropriation for MKSEARCH. Whatever was still running has stopped where it stood; whatever was awaiting review has been filed as it was.\n\nThe program ends the way most programs end: not with a finding, but with a final line item and a request to confirm the disposition of its records."
 cwic_mkultra.345.a: "Confirm the disposition."
 USA_mkultra_mksearch_funding_ended_tt: "Running MKSEARCH work is cancelled without refund. A pending report is archived without its finding. Committed exposure and harm remain on the record."
 USA_mkultra_commission_mksearch: "Commission MKSEARCH: The Surviving Lines"
 USA_mkultra_commission_mksearch_desc: "Fund the contractor lines that survived reorganization for one more study cycle: continued testing of behavior-altering compounds through a reduced network. Costs §Y25 Political Power§!. Commitment adds §R8 Exposure Pressure§! (§R6§! under compartmentalization) and commits §R8 Recorded Harm/Liability§!. Completing the 90-day study awards §G16 Research Record§!. This dossier permits no renewal."
 USA_mkultra_commission_mksearch_tt: "Commit §Y25 Political Power§!, add §R8 Exposure Pressure§!, commit §R8 Harm/Liability§!, and begin a 90-day study."
 USA_mkultra_mksearch_research: "MKSEARCH — The Surviving Lines Underway"
 USA_mkultra_mksearch_research_desc: "The continuation contractors are running their study under the narrower remit. At the end of §Y90 days§!, completion awards §G16 Research Record§! and opens the report."
 USA_mkultra_mksearch_review: "MKSEARCH — Review the Continuation Report"
 USA_mkultra_mksearch_review_desc: "§YSubmitted claim:§! The surviving lines report steady progress toward a usable compound.\n§YCurrent appraisal:§! The report cites earlier MKUltra results as its baseline, and many of those results cannot be located.\n§YValidated application:§! None established.\n\nWithin §Y30 days§!, commission an independent appraisal or archive the report. If ignored, it is archived automatically."
