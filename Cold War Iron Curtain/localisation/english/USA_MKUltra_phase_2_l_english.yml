 USA_mkultra_inquiry_status_none: "§gNo active review§!"
 USA_mkultra_inquiry_status_scheduled: "§YReview notice pending§!"
 USA_mkultra_inquiry_status_active: "§RInternal inquiry active§!"
 USA_mkultra_inquiry_status_resolved: "§gReview resolved§!"

 USA_mkultra_appraisal_initial_narrow: "A narrow pattern survives the first comparison, but the material is too limited for an application claim."
 USA_mkultra_appraisal_initial_weak: "An ordinary procedural explanation fits the weak effect at least as well as the contractor's claim."
 USA_mkultra_appraisal_initial_inconclusive: "The record is internally incomplete and supports neither confirmation nor a clean rejection."
 USA_mkultra_appraisal_initial_attractive: "The presentation is administratively persuasive, but its supporting comparisons remain inadequate."
 USA_mkultra_appraisal_renewal_narrow: "The renewal reproduces a narrow administrative pattern, while generalization remains unproven."
 USA_mkultra_appraisal_renewal_weak: "Additional material strengthens the ordinary explanation and leaves the headline claim weak."
 USA_mkultra_appraisal_renewal_inconclusive: "More records expose contradictory chronology without resolving the central question."
 USA_mkultra_appraisal_renewal_attractive: "The expanded report is polished and institutionally useful, but still lacks independent support."
 USA_mkultra_appraisal_final_narrow: "Independent replication supports one narrow procedural finding. It does not validate the contractor's broader claim."
 USA_mkultra_appraisal_final_weak: "Independent review favors an ordinary explanation. The sponsor may reimburse a small concession, but this is not scientific validation."
 USA_mkultra_appraisal_final_inconclusive: "Independent review cannot distinguish the submitted claim from gaps and contradictions in the record."
 USA_mkultra_appraisal_final_attractive: "Independent review finds an administratively attractive narrative without reproducible support."
 USA_mkultra_appraisal_unavailable: "The appraisal profile is unavailable; archive the malformed report without granting a benefit."

 USA_mkultra_renew_missing_baseline: "Authorize One Renewal: The Missing Baseline"
 USA_mkultra_renew_missing_baseline_desc: "Continue the original contractor's dossier once. The native decision cost is §Y35 Political Power§!. Commitment adds §R2 Exposure Pressure§!, occupies slot one, and begins another exact §Y90-day§! stage. Completion adds §G6 Research Record§! exactly once. A renewal does not reroll the stored evidence profile."
 USA_mkultra_renew_missing_baseline_tt: "Commit §Y35 Political Power§! through the native cost, add §R2 Exposure Pressure§!, and begin the dossier's only §Y90-day§! renewal."
 USA_mkultra_missing_baseline_renewal_research: "The Missing Baseline — Renewal Underway"
 USA_mkultra_missing_baseline_renewal_research_desc: "The dossier's one permitted continuation is underway. At the end of §Y90 days§!, guarded completion adds §G6 Research Record§! and opens a renewed report using the permanently stored evidence profile. Closure cancels the stage without refund."
 USA_mkultra_missing_baseline_renewal_review: "The Missing Baseline — Review the Renewal"
 USA_mkultra_missing_baseline_renewal_review_desc: "§YRenewed appraisal:§! [GetUSA_MKUltraMissingBaselineAppraisal]\n§YValidated application:§! None established without independent replication.\n\nWithin §Y30 days§!, commission the dossier's one independent replication, accept an eligible sponsor concession, or archive it. Ignoring the deadline archives the report automatically."

 USA_mkultra_replicate_missing_baseline: "Commission Independent Replication"
 USA_mkultra_replicate_missing_baseline_desc: "Send the stored dossier profile to an independent review. The native decision cost is §Y30 Political Power§!. Commitment adds §R1 Exposure Pressure§!, occupies slot one, and begins an exact §Y90-day§! stage. Completion adds §G6 Research Record§! exactly once. Commissioning replication directly from the initial report permanently forgoes renewal."
 USA_mkultra_replicate_missing_baseline_tt: "Commit §Y30 Political Power§!, add §R1 Exposure Pressure§!, and begin the only §Y90-day§! independent replication."
 USA_mkultra_missing_baseline_replication_research: "The Missing Baseline — Independent Replication"
 USA_mkultra_missing_baseline_replication_research_desc: "An independent team is testing the dossier against the same stored evidence profile. At the end of §Y90 days§!, guarded completion adds §G6 Research Record§! and opens the final appraisal. Closure cancels the work without refund."
 USA_mkultra_missing_baseline_final_review: "The Missing Baseline — Final Appraisal"
 USA_mkultra_missing_baseline_final_review_desc: "§YFinal appraisal:§! [GetUSA_MKUltraMissingBaselineAppraisal]\n§YValidated application:§! Only a profile-specific bounded administrative use may be taken; no broader behavioral application is established.\n\nApply an eligible finding or archive within §Y30 days§!. Ignoring the deadline archives the dossier without an application benefit."

 USA_mkultra_apply_administrative_consolidation: "Apply the Narrow Administrative Finding"
 USA_mkultra_apply_administrative_consolidation_desc: "Use the independently supported narrow finding to consolidate administrative handling. This costs §G0 Political Power§!, closes the dossier, and grants §G+0.05 daily Political Power§! for §Y180 days§!—a maximum of 9 PP if the full duration runs. It can occur only once across this program history and does not validate the broader claim."
 USA_mkultra_apply_administrative_consolidation_tt: "Close the dossier and gain §G+0.05 daily Political Power§! for §Y180 days§!, once."
 USA_mkultra_administrative_consolidation: "Administrative Consolidation"
 USA_mkultra_administrative_consolidation_desc: "A narrow, independently appraised procedural finding temporarily improves administrative coordination. This benefit is bounded and does not validate the contractor's broader claim."

 USA_mkultra_accept_sponsor_reimbursement: "Accept the Sponsor's Reimbursement"
 USA_mkultra_accept_sponsor_reimbursement_desc: "Accept a one-time §G10 Political Power§! reimbursement for satisfying the sponsor and archive the weak report. This institutional concession is less than the research expenditure, cannot recur through renewal, and is explicitly not scientific validation."
 USA_mkultra_accept_sponsor_reimbursement_tt: "Gain §G10 Political Power§! once, archive the weak report, and close the dossier without scientific validation."

 USA_mkultra_commission_countermeasure: "Commission Internal Countermeasure Evaluation"
 USA_mkultra_commission_countermeasure_desc: "Evaluate whether the government can identify manipulation, misleading reporting, or a false threat claim. The native decision cost is §Y35 Political Power§!. Commitment adds §R1 Exposure Pressure§!, adds §G0 Recorded Harm/Liability§!, occupies slot one, and begins an exact §Y90-day§! stage. Completion adds §G8 Research Record§! exactly once."
 USA_mkultra_commission_countermeasure_tt: "Commit §Y35 Political Power§!, add §R1 Exposure Pressure§!, and begin a §Y90-day§! countermeasure evaluation."
 USA_mkultra_countermeasure_research: "Internal Countermeasure Evaluation — Underway"
 USA_mkultra_countermeasure_research_desc: "Analysts are testing practical warning signs for manipulation and misleading threat reporting. After §Y90 days§!, guarded completion adds §G8 Research Record§! and opens the report. The dossier establishes no extraordinary capability."
 USA_mkultra_countermeasure_review: "Internal Countermeasure Evaluation — Review Report"
 USA_mkultra_countermeasure_review_desc: "§YFinding:§! Conventional source checking and institutional challenge procedures can improve one response to a misleading breakthrough scare.\n§YLimit:§! This finding does not reduce the program's Recorded Harm/Liability and does not validate any extraordinary claim.\n\nApply the lessons or archive within §Y30 days§!. Either disposition schedules the self-contained fictional security scare; only applied lessons improve its response."
 USA_mkultra_apply_countermeasure_lessons: "Retain the Countermeasure Lessons"
 USA_mkultra_apply_countermeasure_lessons_desc: "Close the report at §G0 Political Power§! and preserve its one-use defensive finding. During §Y“A Foreign Breakthrough?”§!, the finding unlocks a response costing §Y15 Political Power§! and §R1% Stability§! instead of the conventional §Y30 Political Power§! and §R2% Stability§!. Using it consumes the finding."
 USA_mkultra_apply_countermeasure_lessons_tt: "Archive the report and retain a one-use improved response to the authored security scare."
 USA_mkultra_archive_countermeasure: "Archive the Countermeasure Report"
 USA_mkultra_archive_countermeasure_desc: "Archive the report at §G0 Political Power§!, release slot one, and close the dossier without retaining the enhanced response. The conventional response remains available when the fictional security scare occurs."
 USA_mkultra_archive_countermeasure_tt: "Archive the report, release slot one, and retain no enhanced response."

 cwic_mkultra.220.t: "A Foreign Breakthrough?"
 cwic_mkultra.220.d: "A fragmentary report claims that a rival service has achieved a dramatic behavioral breakthrough. Disrupted communications and mutually repeating summaries make the claim appear stronger than its sourcing warrants. Departments demand an immediate posture before the rumor hardens into policy.\n\nThis is a self-contained fictional security scare. It tests the government's response to misleading reporting; it does not establish that the alleged breakthrough exists."
 cwic_mkultra.220.a: "Use the countermeasure lessons."
 cwic_mkultra.220.b: "Fund a conventional assessment."
 cwic_mkultra.220.c: "Absorb the disruption without new funding."
 USA_mkultra_security_scare_enhanced_tt: "Spend §Y15 Political Power§!, lose §R1% Stability§!, and consume the one-use countermeasure finding."
 USA_mkultra_security_scare_conventional_tt: "Spend §Y30 Political Power§! and lose §R2% Stability§! to resolve the scare conventionally."
 USA_mkultra_security_scare_unfunded_tt: "Spend no Political Power, lose §R3% Stability§!, and resolve the scare through an explicitly bounded no-funds fallback."

 cwic_mkultra.230.t: "Questions Inside the Compartment"
 cwic_mkultra.230.d: "The security response has exposed inconsistent routing, compartmented invoices, and a research file whose claims are easier to repeat than to audit. An internal review demands a bounded answer.\n\nA funded records inventory can reduce current Exposure Pressure once. If funds are unavailable—or if we decline to spend them—the inquiry must still resolve: acknowledge the finding and accept permanent closure of any active charter. This fictional basic review does not replace the later historical investigation chain."
 cwic_mkultra.230.a: "Fund the records inventory."
 cwic_mkultra.230.b: "Acknowledge the finding and close the charter."
 USA_mkultra_basic_inquiry_funded_tt: "Spend §Y25 Political Power§!, reduce current Exposure Pressure by §G10§! once, and resolve the internal review."
 USA_mkultra_basic_inquiry_fallback_tt: "Spend §G0 Political Power§!, resolve the review, and permanently close the restricted charter if it remains active."

 USA_mkultra_research_paused_inquiry_tt: "New research cannot begin while an internal inquiry is active."
 USA_mkultra_research_paused_public_crisis_tt: "New research requires Exposure Pressure below §R75§!. Reports may still be archived and the charter may still be terminated for free."
