 USA_mkultra_mksearch_final_review_desc: "The appraisal does not confirm a usable compound. It does produce something the program never had: a checked inventory of which lines exist, what each one actually recorded, and which earlier claims have no surviving support.\n\nRetain the inventory as a finding, or archive the dossier without it."
