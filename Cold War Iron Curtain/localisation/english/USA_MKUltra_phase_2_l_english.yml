 # Hypnosis & Conditioning Claims (original fictional contractor case)
 USA_mkultra_commission_hypnosis: "Commission Front Grant: The Demonstration"
 USA_mkultra_commission_hypnosis_desc: "A contractor offers a striking demonstration: subjects under hypnotic conditioning appear to carry out instructions they later cannot recall. The demonstration is persuasive. Whether it is evidence is the question this grant can address. Costs §Y35 Political Power§!. Commitment adds §R2 Exposure Pressure§! and §G0 Harm§!. Completing the 90-day study awards §G12 Research Record§!."
 USA_mkultra_commission_hypnosis_tt: "Commit §Y35 Political Power§!, add §R2 Exposure Pressure§!, and begin a 90-day study."
 USA_mkultra_hypnosis_research: "The Demonstration — Study Underway"
 USA_mkultra_hypnosis_research_desc: "The contractor is repeating the demonstration under its own conditions. At the end of §Y90 days§!, completion awards §G12 Research Record§! and opens the report."
 USA_mkultra_hypnosis_review: "The Demonstration — Review the Report"
 USA_mkultra_hypnosis_review_desc: "§YSubmitted claim:§! Conditioned subjects reliably perform instructed tasks and lose recall of the instruction.\n§YCurrent appraisal:§! Every session was run, scored and witnessed by the contractor's own staff. No session was run blind.\n§YValidated application:§! None established.\n\nWithin §Y30 days§!, authorize the single renewal, commission independent replication, or archive the report. If ignored, it is archived automatically."
 USA_mkultra_renew_hypnosis: "Authorize One Renewal: The Demonstration"
 USA_mkultra_renew_hypnosis_desc: "The contractor proposes a larger series to settle the question. The renewal keeps the same stored evidence profile; it cannot turn the demonstration into a different result. Costs §Y35 Political Power§!. Adds §R2 Exposure Pressure§!. Completion awards §G6 Research Record§!."
 USA_mkultra_renew_hypnosis_tt: "Commit §Y35 Political Power§! and §R2 Exposure Pressure§! to a 90-day renewal."
 USA_mkultra_hypnosis_renewal_research: "The Demonstration — Renewal Underway"
 USA_mkultra_hypnosis_renewal_research_desc: "The contractor is running a larger series of sessions. Completion awards §G6 Research Record§! and opens the renewed report."
 USA_mkultra_hypnosis_renewal_review: "The Demonstration — Review the Renewal"
 USA_mkultra_hypnosis_renewal_review_desc: "The renewed report has more sessions and the same method. Its covering memorandum describes the larger sample as confirmation.\n\nWithin §Y30 days§!, commission independent replication or archive the report."
 USA_mkultra_replicate_hypnosis: "Commission Independent Replication: The Demonstration"
 USA_mkultra_replicate_hypnosis_desc: "Have a separate team run the procedure blind, with subjects and scorers who do not know what is expected. Costs §Y30 Political Power§! (§Y40§! under compartmentalization). Adds §R1 Exposure Pressure§!. Completion awards §G6 Research Record§!. Replicating straight from the initial report forgoes the renewal."
 USA_mkultra_replicate_hypnosis_tt: "Commit Political Power to a 90-day blind replication."
 USA_mkultra_hypnosis_replication_research: "The Demonstration — Blind Replication Underway"
 USA_mkultra_hypnosis_replication_research_desc: "An independent team is running the procedure without the contractor's staff in the room."
 USA_mkultra_hypnosis_final_review: "The Demonstration — Final Appraisal"
 USA_mkultra_hypnosis_final_review_desc: "Run blind, the effect does not appear. Subjects who were told what to expect performed as expected; subjects who were not, did not. The demonstration was real. It was a demonstration of expectation.\n\nThe appraisal itself is the useful product: a working method for telling a persuasive demonstration from a defensible result. Retain it as a finding, or archive the dossier."
 USA_mkultra_apply_reliable_appraisal: "Retain the Appraisal Method"
 USA_mkultra_apply_reliable_appraisal_desc: "File the blind-replication method as a standing finding. It does not validate the contractor's claim; it records how the claim failed. Later contractor reports under review carry a credibility warning, and their independent reviews cost §G5 Political Power§! less (Behavioral Assessment and MKSEARCH)."
 USA_mkultra_apply_reliable_appraisal_tt: "Records the §YReliable Internal Appraisal§! finding, archives the dossier, and releases its slot."
 USA_mkultra_archive_hypnosis: "Archive the Demonstration"
 USA_mkultra_archive_hypnosis_desc: "Close and archive the dossier, releasing its research slot. Committed exposure remains on the record."
 USA_mkultra_archive_hypnosis_tt: "Archive the dossier and release its slot."

 # Behavioral Assessment (original fictional contractor case)
 USA_mkultra_commission_behavioral: "Commission Front Grant: The Assessment Battery"
 USA_mkultra_commission_behavioral_desc: "A contractor has built a behavioral assessment battery that it says predicts which personnel will prove unreliable under pressure. The pattern was found in one setting. Whether it holds anywhere else is what this grant can address. Costs §Y35 Political Power§!. Commitment adds §R2 Exposure Pressure§! and §G0 Harm§!. Completing the 90-day study awards §G12 Research Record§!."
 USA_mkultra_commission_behavioral_tt: "Commit §Y35 Political Power§!, add §R2 Exposure Pressure§!, and begin a 90-day study."
 USA_mkultra_behavioral_research: "The Assessment Battery — Study Underway"
 USA_mkultra_behavioral_research_desc: "The contractor is applying the battery to a new intake. At the end of §Y90 days§!, completion awards §G12 Research Record§! and opens the report."
 USA_mkultra_behavioral_review: "The Assessment Battery — Review the Report"
 USA_mkultra_behavioral_review_desc: "§YSubmitted claim:§! The battery identifies unreliable personnel before they fail.\n§YCurrent appraisal:§! [GetUSA_MKUltraBehavioralReviewAppraisal]\n§YValidated application:§! None established by the initial report.\n\nWithin §Y30 days§!, commission independent replication or archive the report. If ignored, it is archived automatically."
 USA_mkultra_replicate_behavioral: "Commission Independent Replication: The Assessment Battery"
 USA_mkultra_replicate_behavioral_desc: "Apply the battery to a second, independent sample and compare its predictions with what actually happened. Costs §Y30 Political Power§! (§Y40§! under compartmentalization; §G5 less§! with the Reliable Internal Appraisal finding). Adds §R1 Exposure Pressure§!. Completion awards §G6 Research Record§!."
 USA_mkultra_replicate_behavioral_tt: "Commit Political Power to a 90-day independent replication."
 USA_mkultra_behavioral_replication_research: "The Assessment Battery — Independent Replication Underway"
 USA_mkultra_behavioral_replication_research_desc: "A second team is scoring a new sample against outcomes the contractor did not choose."
 USA_mkultra_behavioral_final_review: "The Assessment Battery — Final Appraisal"
 USA_mkultra_behavioral_final_review_desc: "The independent sample is in. The file now records whether the pattern holds outside the setting where it was found.\n\nIf it holds in a narrow setting, that narrow use can be retained. Otherwise the useful result is knowing not to rely on it."
 USA_mkultra_apply_screening_finding: "Retain the Narrow Screening Finding"
 USA_mkultra_apply_screening_finding_desc: "The battery predicts one narrow thing well: which personnel are poorly suited to handling compartmented material. Retain that use for a year of internal screening and close the dossier. It establishes nothing broader."
 USA_mkultra_apply_screening_finding_tt: "Grants §YNarrow Screening Finding§! for §Y365 days§!, archives the dossier, and releases its slot."
 USA_mkultra_archive_behavioral: "Archive the Assessment Battery"
 USA_mkultra_archive_behavioral_desc: "Close and archive the dossier, releasing its research slot. Committed exposure remains on the record."
 USA_mkultra_archive_behavioral_tt: "Archive the dossier and release its slot."
 USA_mkultra_screening_finding: "Narrow Screening Finding"
 USA_mkultra_screening_finding_desc: "An independently replicated assessment identifies personnel poorly suited to compartmented work. It predicts nothing else."

