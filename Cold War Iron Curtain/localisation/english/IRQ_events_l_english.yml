 IRQ.1754.t:0 "Iraq's Response"
 IRQ.1754.d:0 "In the opening hours of this morning, President Saddam Hussein gave the greenlight for a counter-operation in response to Iran's shelling of Zain al-Qaws and Saif Saad villages.\n\nUnder orders of the Iraqi Highcommand, a limited-operation was executed which saw the deployment of a pair of Su-20 attack aircraft who took off from Al-Faw Airfields and made their way across the Shatt-al Arab.\n\nThe first strike was directed against Iranian artillery batteries believed by Baghdad to have participated in the attack conducted against Iraq. The pair of Su-20s released salvos of 57-mm S-5 rockets, sweeping and bringing destruction to the identified positions before withdrawing from the immediate area. Iraqi military command claim that more than ten Iranian guns, fifteen support vehicles and the overall defensive position were struck, although the entire extent of the damage remains uncertain.\n\nBoth aircraft after the attack returned safely to Iraqi territory. Within hours, Iraqi radio and television stations broadcasted the news of the raid across the country. State media portrayed the mission as a demonstration of Iraq's preparedness and capabilities, as well as its willingness to defend every piece of its territory. Images of the two pilots returning safely have been accompanied by triumphant praise, with broadcasters declaring that Iranian provocations would no longer pass unanswered by the Iraqi army.\n\nPresident Saddam Hussein himself has described the operation as a showcase of Iraq’s cunning, strength and steadfastness in the face of the looming threat of Iran. In a statement carried by state broadcasters, he warned that Iraq sought neither humiliation nor unnecessary war with its neighbor, but would answer the call of aggression with aggression, and defend the country's sovereignty.\n\nThe attack, though, has rippled tensions amongst the international community, many sensing the possibility of a war to soon be ignited by the two foes, while others defending Iraq’s move as a showcase of sovereignty."