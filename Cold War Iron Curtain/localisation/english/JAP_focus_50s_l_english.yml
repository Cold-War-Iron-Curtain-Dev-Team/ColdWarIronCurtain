 ###desc###
 JAP_purchase_f86_sabres_desc:0 "To Japan, the F-86 embodies more than just metal and machine; it embodies reassurance. A long, slender, supersonic promise that there will be no more empty sky over Japan; that peace-after all this is not about being unable to react when faced with danger. Under these aircraft and in civil control, with clear defensive rules of engagement, the Japan Air Self Defense Force (JASDF) exists to intercept, deter, and monitor, not to attack, rather to stand guard when the call to duty arises.\n\nAccepting necessary defense under the umbrella of alliance, focusing national strength on peace and prosperity, which is a broad vision within Prime Minister [JAP.GetLeader]'s policy of economic prioritization and minimal rearmament. The F-86, funded by American support, is not viewed as a threat to its neighbors, a quiet signal that Japan will no longer be defended by others alone."
 JAP_restore_the_fuchu_airbase_desc:0 "Fuchu had been a central hub during the Imperial period and was then occupied by American forces for some time; its restoration into Japanese hands was premised not on visions of remilitarization, but rather as part of an even wider project of redefining postwar peace. During the days when the Japan Air Self-Defense Force was coming into being, our growing need for control and coordination breathed new life into this base, not to exert force abroad but to provide inside surveillance.\n\nIn the Japanese view, the recovery of Fuchu would carry deep symbolic meaning. It was that territory not reclaimed for glory but for duty. Under civilian authority and consistent with the Constitution, it now functions as a nerve center for air space defenses with advanced communications systems and an operational command facility. Now, instead of bombers or squadrons for foreign wars, we house the quiet work of keeping an eye on our skies, training our airmen, and ensuring that our sovereignty is never again left dependent on foreign forces."
 JAP_establish_the_jsdf_desc:0 "The Japanese Self Defense Forces, created under the postwar Constitution with the strictest limits set by Article 9, and, hence, is not to be an army of conquest, but a force for protection and guardian, not a weapon. The world was being brutally challenged by the Cold War, and nearby conflicts were threatening to spill across borders; Japan could no longer afford to depend merely upon words and treaties. A carefully balanced national defense force-to be applied in defense and civil protection-was now needed. \n\nThe JSDF comprises three services: the Ground, Maritime, and Air Self-Defense Forces, each designed with defensive posture as the key element. Rendered subject to ultimate civilian control and the law, the JSDF is an organization that does not allow itself to be used for aggressive purposes but maintains within its midst a disciplined and responsive force available at a moment's notice for homeland defense against external threats, disaster relief support, and peacekeeping."
 JAP_japan_air_self_defense_force_desc:0 "The rapid changes seen in the postwar world have made it clear that security cannot rest on hope alone. With tensions rising throughout East Asia and the global balance teetering under the grip of the Cold War, Japan must make sure it is not left defenseless.\n\nThe new air force is neither a legacy of the past nor does by that name; it is a modern-day institution that is restrained in its character and defensive by intention. Its mission is clear: to defend the skies over our archipelago, protect our sovereignty, and, when called upon, engage in disaster response and civil assistance. Its very existence is thus permitted only as a pragmatic necessity in uncertain times, not in the spirit of aggression."
 JAP_japan_ground_self_defense_force_desc:0 "Initially established as the National Police Reserve, the Ground Self-Defense Force was then reorganized under an authority that resides as much in civilian hands as in military. It is, by intent, exclusively defensive in purpose, to defend the homeland against invasion, to offer support during disasters, and to maintain internal order. Its composition, size, and role are severely restricted by law, with a clear separation made from any offensive military function. \n\nIts formation occurs in cooperation with allied countries, especially with the United States under the terms of mutual security, yet the JGSDF maintains its unique doctrine and discipline."
 JAP_japan_maritime_self_defense_force_desc:0 "When we lost the war, Japan had no navy at all: no vessels, no admirals, and no right, under our Constitution, to wage war. But the reality now is that an ever-vigilant watch is kept over a sea that once carried Japan into battle, into war, and now has to be kept safe for peace: It will not be long before long-haul circuits, the coastline, and seaways start bleeding vulnerabilities into proximity to volatile flashpoints not even high tide waters can sustain.\n\nIt is not even an imperial fleet but a shield drawn on necessity and devised within the limits of Article 9, shaped by those bitter lessons of the past. It contains no ambitions of projection, bears no dreams of becoming a blue-water navy, although it is -or should be-an armed force indoctrinated to defend Japan's territorial waters, ensure maritime safety, and support disaster relief and humanitarian efforts under the strict, clear definition of civilians that guide it."
 JAP_The_Yoshida_Administration_desc:0 "In the uncertain years following the devastation of war, as Japan stood amidst the ashes of defeat and occupation, the need for calm, steady leadership became painfully clear. It was in this fragile moment that Shigeru Yoshida—a seasoned diplomat and pragmatic patriot—was called upon to steer the nation through its most delicate transformation.\n\nThe formation of the Yoshida Administration will mark a turning point in Japan’s political and national recovery. With a firm belief in rebuilding the nation through peaceful development, economic reconstruction, and international cooperation, Yoshida took office not with the firebrand zeal of revolution, but with the quiet determination of a statesman who understood the weight of responsibility."
 JAP_Establish_the_Yoshida_School_desc:0 "In the delicate aftermath of war and under the watchful eyes of the Allied Occupation, Japan was faced with the choice of whether to regain strength through the older ambitions or rise anew by following a different path. Among the other options considered, Japan chose the latter under the firm hand of Prime Minister Yoshida Shigeru. The result of this choice became the framework of what is referred to as Yoshida Gakko, a guiding attitude, a strategy of self-control, and a declaration of priorities for a humbled but determined Japan.\n\nInstead of going for hasty rearmament and provocative diplomacy, the other method, which Yoshida opted for intentionally and calmly, left the national focus on economic recovery, industrial modernization, and social stability."

