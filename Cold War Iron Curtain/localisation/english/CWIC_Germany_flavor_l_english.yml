l_english:
 flavorger.1.t:0 "[GetNewspaperHeader]The German Autumn"
 flavorger.1.d:0 "Hanns Martin Schleyer has been murdered after weeks in the hands of the Red Army Faction. The same night, a hijacked Lufthansa jet was stormed in Mogadishu."
 flavorger.1.a:0 "The autumn has ended."
 flavorger.1.b:0 "A grim night in Germany."
 flavorger.2.t:0 "[GetNewspaperHeader]Kohl Becomes Chancellor"
 flavorger.2.d:0 "The Bundestag has voted Helmut Schmidt out of office. Helmut Kohl is chancellor."
 flavorger.2.a:0 "Kohl is chancellor."
 flavorger.2.b:0 "Bonn has a new chancellor."
 flavorger.3.t:0 "[GetNewspaperHeader]The Berlin Wall Opens"
 flavorger.3.d:0 "The Berlin Wall is open. East Berliners are crossing to the west, and the border guards are standing aside."
 flavorger.3.a:0 "The border is open."
 flavorger.3.b:0 "They are coming across."
 flavorger.3.c:0 "The Wall is open."
