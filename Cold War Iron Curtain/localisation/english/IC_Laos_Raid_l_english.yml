 Laos_Raid_Resolved:0 "The §YRaid into Laos§! has been resolved"
 Laos_Raid_Attacker_Won:0 "§RThe Kingdom of Laos has fallen§!"
 Laos_Raid_Stalemate:0 "§YThe raid ended in stalemate§! - Laos is divided"
 Laos_Raid_Total_Failure:0 "§GThe raid was thrown back§!"
 Laos_Total_War:0 "§RLaos is at total war§!"
 Laos_Pathet_Released:0 "The §YPathet Lao§! have been released"
 Laos_Pathet_Consolidation:0 "The §YPathet Lao§! are consolidating inside the Kingdom"
 Laos_Pathet_Lao_At_Dien_Bien:0 "The §YPathet Lao§! have joined the battle for §YDien Bien Phu§!"
