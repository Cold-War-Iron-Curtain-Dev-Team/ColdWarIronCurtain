l_english:
 # National spirit
 LOS_French_Airlift:0 "French Relief Airlift"
 LOS_French_Airlift_desc:0 "Transport aircraft from Hanoi and Saigon are ferrying a CEFEO relief column and its supplies into Vientiane and Luang Prabang. For as long as the airbridge holds, the Kingdom's defenders fight with French firepower, engineers and air cover at their backs."

 # Dynamic modifiers
 laos_raid_overextension:0 "Overextended Offensive"
 laos_raid_overextension_severe:0 "Overextended Offensive (Final Push)"

 # Missions
 Laos_Raid_Timer:0 "Invasion of Laos"
 Laos_Raid_Timer_desc:0 "Viet Minh and Pathet Lao columns are driving on the Laotian capitals ahead of the monsoon. If they cannot seize Vientiane or Luang Prabang before their supply lines give out, the raid will have to be broken off."
 Laos_Raid_LastChance_Timer:0 "One Last Push into Laos"
 Laos_Raid_LastChance_Timer_desc:0 "The offensive has been ordered forward one final time despite the exhaustion of the troops. This is the last chance to take a Laotian capital before the whole effort collapses."
 Laos_Raid_Defence:0 "Hold the Kingdom"
 Laos_Raid_Defence_desc:0 "Viet Minh and Pathet Lao columns are storming toward Vientiane and Luang Prabang. Hold the royal capitals until their over-extended offensive burns itself out against the monsoon, and the invasion will collapse of its own accord. Lose a capital and the Kingdom may not survive."
 Laos_Raid_Offensive:0 "Take the Royal Capital"
 Laos_Raid_Offensive_desc:0 "The columns are across the border and the monsoon is coming. Vientiane or Luang Prabang must be in our hands before the offensive outruns its porters - every day past that is paid for in men we cannot replace this side of the Annamite chain.\n\nIf the clock runs out with both capitals still flying the Kingdom's colours, the raid is over."
 Laos_Raid_Offensive_LastChance:0 "One Last Push"
 Laos_Raid_Offensive_LastChance_desc:0 "The offensive was ordered forward past its culminating point. What is left of the spearheads has one short window to reach a capital, and nothing behind it."
 Laos_Raid_Defence_LastChance:0 "Weather the Final Assault"
 Laos_Raid_Defence_LastChance_desc:0 "Hanoi has flung its exhausted spearheads forward one last time. Hold on a little longer and the enemy will have nothing left."

 # laos_raid.1 - press or call off (attacker)
 laos_raid.1.t:0 "The Laos Offensive Stalls"
 laos_raid.1.d:0 "Our columns have carried the war deep into the Kingdom of Laos, but the capitals still hold and our supply lines are stretched to breaking point beneath the coming monsoon. The staff advise consolidating the gains we have made and pulling the spearheads back before they wither on the vine. Yet a final, determined push might still put a royal capital in our hands and shatter Vientiane's will to resist."
 laos_raid.1.a:0 "Press the offensive - take a capital or nothing!"
 laos_raid.1.b:0 "Call off the raid and consolidate our gains"

 # laos_raid.2 - stalemate news
 laos_raid.2.t:0 "Viet Minh Withdraw from Laos"
 laos_raid.2.d:0 "The invasion of Laos has run its course. Unable to take the royal capitals before the monsoon closed the trails, the Viet Minh have broken contact and pulled back. The Pathet Lao remain entrenched in their mountain strongholds of Sam Neua and Phongsaly, a communist foothold that Hanoi will nurture for the struggle to come. For now, the Kingdom endures."

 laos_raid.2.a:0 "The Kingdom endures"

 # laos_raid.3 - total failure choice (LOS)
 laos_raid.3.t:0 "The Pathet Lao Are Broken"
 laos_raid.3.d:0 "Against all expectation, our army has thrown the invaders back across the frontier and overrun the Pathet Lao in their own strongholds. Hanoi, its raid in ruins, now signals through intermediaries that it will accept a return to the old borders. We could take the peace and rebuild - or we could refuse it, and carry this war to the communists while the whole world is watching Indochina."
 laos_raid.3.a:0 "Accept the peace - restore the old borders"
 laos_raid.3.b:0 "No peace! French Indochina will destroy the communists!"

 # laos_raid.5 - total war news
 laos_raid.5.t:0 "[GetNewspaperHeader]Vientiane Rejects Peace - War Widens in Indochina"
 laos_raid.5.d:0 "The Kingdom of Laos has spurned Hanoi's peace overture and vowed to fight on against the communist bloc. What began as a border raid now threatens to draw the wider world into Indochina, as every interested power weighs whether to throw its weight behind Vientiane or Hanoi."
 laos_raid.5.a:0 "The world turns its eyes to Laos"

 # laos_raid.6 - attacker victory news
 laos_raid.6.t:0 "[GetNewspaperHeader]A Laotian Capital Falls"
 laos_raid.6.d:0 "The gamble has paid off. Viet Minh and Pathet Lao forces have stormed into a royal capital, and the Kingdom of Laos reels on the edge of collapse. The raid that was meant to bleed the French has become a conquest."
 laos_raid.6.a:0 "The road to Vientiane lies open"

 # laos_raid.7 - launch briefing to LOS
 laos_raid.7.t:0 "The War Comes to Laos"
 laos_raid.7.d:0 "Viet Minh divisions have crossed the mountains alongside their Pathet Lao auxiliaries, driving on Vientiane and the royal seat at Luang Prabang. But their columns have outrun their supply lines, and French transport aircraft are already ferrying a relief force and its guns into our capitals. If we can hold the cities and bleed the invaders until the monsoon breaks their offensive, the raid will collapse and the Kingdom will stand. We have called the nation to arms - now we must endure."
 laos_raid.7.a:0 "For the Kingdom!"
