l_english:

 FRE_Northwest.1.t:0 "Operation Lorraine"
 FRE_Northwest.1.d_active:0 "Giap's divisions are moving through the Tai country. The object of Lorraine is not to retake the Northwest directly, but to make that advance unaffordable: four mobile groups can drive up the Clear River while paratroopers fall on the depots at Phu Doan. If Hanoi turns its divisions east, Na San gains time. If it does not, the stores feeding the offensive may be destroyed.\n\nThe danger lies in the return march. Every kilometer beyond the delta lengthens a road the Viet Minh can cut, and a force sent against the depots is a force absent from the highlands. Salan can authorize the full thrust, limit the operation to a sharp raid, or keep the mobile groups around the airhead."
 FRE_Northwest.1.d_planned:0 "The staff has completed its study for a diversion up the Clear River. Mobile groups, armor, river craft, and an airborne group can be assembled against the Viet Minh depots around Phu Doan if Hanoi opens its expected Northwest offensive.\n\nUntil that campaign begins, Lorraine remains a contingency rather than an independent war."
 FRE_Northwest.1.a:0 "Drive on Phu Doan with the mobile groups."
 FRE_Northwest.1.b:0 "Raid the depots, then withdraw at once."
 FRE_Northwest.1.c:0 "Keep the mobile groups for Na San."
 FRE_Northwest.1.e:0 "There is no mobile reserve to spend."
 FRE_Northwest.1.d:0 "File the plan until the Northwest erupts."
 FRE_Lorraine_Deep_Thrust_tt:0 "Spend §Y100 War Credits§! and §R8 Metropole Patience§!. The thrust disrupts the Viet Minh's campaign supply and consumes §Y14 days§! of its campaign clock. Hold any province in §YDong Bac Bo§! for seven days to raid the rear depots. The columns suffer additional supply strain until the Northwest Campaign ends."
 FRE_Lorraine_Limited_Raid_tt:0 "Spend §Y60 War Credits§!. A short raid destroys some Viet Minh campaign supply and consumes §Y7 days§! of the Northwest Campaign clock, then withdraws without a deep territorial objective."
 FRE_Lorraine_Withhold_tt:0 "Spend §Y30 War Credits§! on highland supply and keep the mobile groups concentrated around §YNa San§!. French and Tai forces receive a defensive spirit until the Northwest Campaign ends."
 FRE_Lorraine_No_Reserve_tt:0 "The corps lacks the credits to assemble Lorraine or reinforce Na San. The mobile groups remain in reserve without an additional defensive benefit."
 FRE_Lorraine_Planned_tt:0 "The Lorraine contingency remains on the staff map. Salan will present it automatically if the Viet Minh launches the Northwest Campaign later."

 FRE_Northwest.2.t:0 "The Reckoning of Lorraine"
 FRE_Northwest.2.d_success:0 "Lorraine did what Salan demanded of it. The thrust into the Viet Minh rear either broke the Northwest offensive or compelled Hanoi to abandon it, and the mobile groups have returned with the initiative briefly restored. The cost was substantial, but Paris can point to a strategic result rather than a collection of captured stores."
 FRE_Northwest.2.d_limited:0 "The columns found the depots and destroyed what they could carry neither away nor count, but the Northwest offensive continued. Lorraine has produced a tactical success without deciding the campaign for which it was launched. The withdrawal matters as much as the advance: the mobile groups are home before the road could close behind them."
 FRE_Northwest.2.d_failure:0 "The diversion failed to divert. Giap kept his main force in the Northwest while local regiments closed on the return road, leaving the mobile groups to fight their way back toward the delta. The stores taken around Phu Doan do not compensate for the vehicles, time, and confidence left along the Clear River."
 FRE_Northwest.2.d_withheld:0 "There will be no great thrust up the Clear River. The mobile groups and their transport have remained with the highland airheads, accepting that Viet Minh depots will go untouched in exchange for a deeper defense around Na San. Lorraine survives only as the operation the corps chose not to fight."
 FRE_Northwest.2.d_superseded:0 "Events have overtaken Lorraine. A wider armistice or the collapse of the theatre has arrived before the operation could acquire a military meaning, and the columns have been stood down without claiming a victory or accepting a defeat."
 FRE_Northwest.2.a:0 "Enter the result in the campaign journal."

 VIN_Northwest.1.t:0 "The French Diversion Ends"
 VIN_Northwest.1.d_success:0 "The French thrust into our eastern rear has achieved its purpose. Whether through lost stores, diverted formations, or the pressure placed on the base areas, Lorraine helped break the Northwest offensive. The General Staff must treat the road network behind the front as a battlefield in its own right."
 VIN_Northwest.1.d_limited:0 "French columns reached the rear depots and destroyed stores before turning back toward the delta, but they did not decide the Northwest Campaign. Lorraine was a costly warning: an army advancing west cannot leave every road and warehouse in the Viet Bac to local troops."
 VIN_Northwest.1.d_failure:0 "The French diversion has withdrawn without changing the Northwest battle. Local forces harried the long road home while the main divisions remained with the campaign objective. The enemy found that a raid into the rear is not the same thing as seizing the initiative."
 VIN_Northwest.1.d_withheld:0 "The expected French drive into the Viet Bac never came. Reconnaissance instead reports the mobile groups concentrating around Na San and the Tai airheads. Our depots are safe, but the ground ahead will be more heavily defended."
 VIN_Northwest.1.d_superseded:0 "The French Lorraine plan has been overtaken by a wider armistice or the end of the theatre. Its columns are standing down, and neither side can claim that the unfinished diversion decided the Northwest battle."
 VIN_Northwest.1.a:0 "The lesson belongs to the next campaign."

 FRE_Lorraine_Deep_Columns:0 "Lorraine's Extended Columns"
 FRE_Lorraine_Deep_Columns_desc:0 "The mobile groups have driven beyond the delta along a single lengthening road. Armor and transport give the column reach, but fuel, bridges, and the return march now govern everything it can do."
 FRE_Northwest_Concentrated_Defence:0 "Mobile Groups Held at Na San"
 FRE_Northwest_Concentrated_Defence_desc:0 "The formations assigned to Lorraine have been retained around the highland airheads, strengthening the defensive system at the price of leaving the Viet Minh rear depots untouched."
 VIN_Lorraine_Depots_Disrupted:0 "Lorraine in the Rear Areas"
 VIN_Lorraine_Depots_Disrupted_desc:0 "French mobile groups and paratroopers are operating against the depots behind the Northwest offensive. Stores are being dispersed, routes rerouted, and formations delayed to secure the base area."

 FRE_Lorraine_Response_Unlocked:0 "The §YOperation Lorraine§! response plan is ready"
 FRE_Lorraine_Response_Active:0 "§YOperation Lorraine§! is supporting the Northwest Campaign"
 FRE_Lorraine_Response_Deep:0 "Lorraine has become a §Rdeep Clear River thrust§!"
 FRE_Lorraine_Response_Limited:0 "Lorraine is a §Ylimited depot raid§!"
 FRE_Lorraine_Response_Withheld:0 "Lorraine's mobile groups were §Gheld for Na San§!"
 FRE_Lorraine_Objective_Achieved:0 "The §YClear River rear depots§! were held long enough to raid"
 FRE_Lorraine_Result_Success:0 "§GOperation Lorraine achieved a strategic success§!"
 FRE_Lorraine_Result_Limited:0 "§YOperation Lorraine achieved only a tactical raid§!"
 FRE_Lorraine_Result_Failure:0 "§ROperation Lorraine failed to alter the Northwest Campaign§!"
 FRE_Lorraine_Result_Withheld:0 "§YThe Lorraine formations were withheld for Na San§!"
 FRE_Lorraine_Result_Superseded:0 "Operation Lorraine was §govertaken by the end of the fighting§!"
