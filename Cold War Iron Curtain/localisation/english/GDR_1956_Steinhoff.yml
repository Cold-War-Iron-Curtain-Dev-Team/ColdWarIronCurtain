l_english: 

 GDR_First_Secretary_Steinhoff:0 "First Secretary Steinhoff"
 GDR_First_Secretary_Steinhoff_desc:0 "Karl Steinhoff has managed to wrestle leadership of the GDR from Walter Ulbricht; it is time to formally recognize him as our new First Secretary."
 GDR_An_Offer_of_Mass_Amnesty:0 "An Offer of Mass Amnesty"
 GDR_An_Offer_of_Mass_Amnesty_desc:0 "Due to the overzealousness of the Ulbrich regime, the people have grown to distrust their neighbors and government. Through an offer of mass amnesty, we can quell the people's fears of unjust punishment."
 GDR_Emphasize_Quality_of_Life_Improvements_in_Government_Planning:0 "Improvements in Government Planning"
 GDR_Emphasize_Quality_of_Life_Improvements_in_Government_Planning_desc:0 "We must refocus our central planning model to focus on the people, making sure that they receive a proper education and the tools they need to lead a fulfilling life."
 GDR_Offer_Incentives_to_Join_an_Landwirtschaftliche_Produktionsgenossenschaft:0 "Incentivize Agricultural Production Cooperatives"
 GDR_Offer_Incentives_to_Join_an_Landwirtschaftliche_Produktionsgenossenschaft_desc:0 "We will offer incentives for farmers to join Agricultural Production Cooperatives, our version of collectivized farms. Doing so will increase our food production efficiency and prevent the creation of a class of land barons."
 GDR_Reform_Stasi_Practices:0 "Reform Stasi Practices"
 GDR_Reform_Stasi_Practices_desc:0 "The Stasi has gained an unfortunate reputation for its underhanded and frankly unbecoming methods of domestic surveillance. This cannot continue."
 GDR_Liberalize_Media_Censorship_Laws:0 "Liberalize Media Censorship Laws"
 GDR_Liberalize_Media_Censorship_Laws_desc:0 "Our iron grip over what the media can and can't talk about has proven more burdensome than beneficial. It is time to relax the censorship laws."
 GDR_Loosen_Restrictions_on_Western_Trade:0 "Loosen Restrictions on Western Trade"
 GDR_Loosen_Restrictions_on_Western_Trade_desc:0 "It's become clear that the trade restrictions we have in place with the West are limiting our ability to compete with their goods. We will lift the more overzealous of these restrictions. "
 GDR_Expand_Funding_for_Housing_Improvements:0 "Expand Funding for Housing Improvements"
 GDR_Expand_Funding_for_Housing_Improvements_desc:0 "That a worker should have to settle for Spartan accommodation in a nation as rich as this one is completely unacceptable. Our people deserve the best of the best!"
 GDR_Review_High_Profile_Cases_Under_Ulbricht:0 "Review High Profile Cases Under Ulbricht"
 GDR_Review_High_Profile_Cases_Under_Ulbricht_desc:0 "The question has been raised recently about the validity of certain high-profile trials that occurred during the Ulbricht regime. We should review these cases and correct any injustices that may have occurred."
 GDR_Liberalize_the_SED_Party_Apparatus:0 "Liberalize the Party Apparatus"
 GDR_Liberalize_the_SED_Party_Apparatus_desc:0 "Ulbricht has tainted the image and reputation of the SED. To undo the damage, it is essential that we reform the party apparatus and help regain the people's trust."
 GDR_Cardboard_Socialism:0 "Cardboard Socialism"
 GDR_Cardboard_Socialism_desc:0 "By increasing our consumer goods production, as well as encouraging the people to acquire these affordable products, we will see an improvement in our living standards."
 GDR_Invest_in_Technocratic_Management:0 "Invest in Technocratic Management"
 GDR_Invest_in_Technocratic_Management_desc:0 "Recent advances in computing have brought the idea of automated management into the world of scientific plausibility rather than fiction. Let's speed up the process with some funding!"
 GDR_Allow_Small_and_Medium_Businesses:0 "Allow Small & Medium Businesses"
 GDR_Allow_Small_and_Medium_Businesses_desc:0 "By allowing the creation of small and manageable private businesses, we can open new paths for the people to prosper."
 GDR_Introduce_Limited_Market_Reforms:0 "Introduce Limited Market Reforms"
 GDR_Introduce_Limited_Market_Reforms_desc:0 "Now that we have created a market for consumer goods, the next step is to facilitate the acquisition of those goods."
 GDR_Renewed_Focus_on_Consumer_Goods_Production:0 "Renewed Focus on Consumer Goods Production"
 GDR_Renewed_Focus_on_Consumer_Goods_Production_desc:0 "Our shift towards consumer goods production is bearing fruit, but more can be done!"
 GDR_Request_Soviet_Aid_in_Factory_Modernization:0 "Request Soviet Aid in Factory Modernization"
 GDR_Request_Soviet_Aid_in_Factory_Modernization_desc:0 "Our industrial sectors are starting to show signs of aging. Perhaps the Soviet Union is willing to aid us in its modernization?"
 GDR_Offer_Fair_Loans_to_the_Petty_Bourgeois:0 "Offer Fair Loans to the Petty Bourgeois"
 GDR_Offer_Fair_Loans_to_the_Petty_Bourgeois_desc:0 "The economic reforms we have undertaken have spawned a small class of merchants and business owners. We will offer them fair loans so they can expand their businesses. All within the confines of the socialist model and its ideas, of course."
