l_english:
 # ---- Entry event ----
 germanquestion.1.t:0 "The German Question"
 germanquestion.1.d:0 "The occupation of Germany cannot last forever. In [WGR.capital.GetCapitalVictoryPointName] , [?WGR.country_leader.GetName] drives the Federal Republic toward rearmament and the Western bloc; in the East, Comrade [?DDR.country_leader.GetName] builds socialism under the shield of the Soviet Army. Moscow must decide how to answer the German question — with a diplomatic note offering unification and neutrality, or by hardening the division of the German nation for good. Whatever we choose, the world is watching."
 germanquestion.1.a:0 "Draft a note to the Western powers."
 germanquestion.1.b:0 "Germany's fate will be settled in time."

 # ---- Root / fork ----
 SOV_sn_the_german_question:0 "The German Question"
 SOV_sn_the_german_question_desc:0 "Four powers, one divided nation. The moment has come to set Soviet policy toward Germany for the decade — a genuine bid to reunify it on our terms, or the permanent entrenchment of a socialist East."
 SOV_sn_the_german_question_tt:0 "Opens the two roads for Soviet policy on Germany"

 SOV_sn_manage_the_division:0 "Let the Note Lie"
 SOV_sn_manage_the_division_desc:0 "The Western powers will never accept a truly neutral Germany, and we will not gamble the German Democratic Republic on their good faith. We will manage the division as it stands and consolidate our half of Germany — the historical road."

 SOV_sn_pursue_the_note:0 "Issue the Stalin Note"
 SOV_sn_pursue_the_note_desc:0 "Send the note to Washington: an offer of a unified, neutral, democratic Germany, free of foreign troops. Let the Western powers reveal themselves — either they negotiate in good faith, or they expose their design to keep Germany split and armed against us."

 # ---- Path A: Historical ----
 SOV_sn_the_note_rejected:0 "The Note Rejected"
 SOV_sn_the_note_rejected_desc:0 "As expected, the West chose the [WGR.capital.GetCapitalVictoryPointName] and European Defense Community treaties over our offer. West Germany will rearm within their bloc. Let the world remember who refused peace."
 SOV_sn_the_note_rejected_tt:0 "Propaganda victory: the West is blamed for the division"

 SOV_sn_the_new_course:0 "The New Course"
 SOV_sn_the_new_course_desc:0 "With Stalin gone, Moscow reins in [?DDR.country_leader.GetName]'s headlong drive to socialism. Ease the collectivization quotas and the pressure on the East German worker before discontent boils over."

 SOV_sn_crush_the_june_uprising:0 "Crush the June Uprising"
 SOV_sn_crush_the_june_uprising_desc:0 "The workers of East Berlin are in the streets. The New Course came too late. Soviet tanks will restore order in the German Democratic Republic — a hard lesson, but the socialist state will stand."
 SOV_sn_crush_the_june_uprising_tt:0 "Soviet forces suppress the 17 June rising; the DDR is shaken but secure"

 SOV_sn_grant_ddr_sovereignty:0 "Grant the DDR Sovereignty"
 SOV_sn_grant_ddr_sovereignty_desc:0 "Dissolve the Soviet Control Commission and end reparations. The German Democratic Republic becomes a sovereign socialist state and a full partner — no longer an occupied zone."
 SOV_sn_grant_ddr_sovereignty_tt:0 "The DDR is recognized as a sovereign ally"

 SOV_sn_found_the_warsaw_pact:0 "Found the Warsaw Pact"
 SOV_sn_found_the_warsaw_pact_desc:0 "West Germany has joined NATO. We answer in kind: a treaty of friendship, cooperation and mutual assistance binding the socialist states — with the German Democratic Republic among its founders."
 SOV_sn_found_the_warsaw_pact_tt:0 "The DDR joins the Soviet-led alliance"

 SOV_sn_adenauer_in_moscow:0 "[?WGR.country_leader.GetName] Comes to Moscow"
 SOV_sn_adenauer_in_moscow_desc:0 "The West German Chancellor himself travels to the Kremlin. We will establish diplomatic relations with [WGR.capital.GetCapitalVictoryPointName] — and, as a gesture to the German people, release the last German prisoners of war still in our keeping."
 SOV_sn_adenauer_in_moscow_tt:0 "Relations opened with [WGR.capital.GetCapitalVictoryPointName] ; the last German POWs go home"

 SOV_sn_treaty_on_relations:0 "Treaty on Relations with the GDR"
 SOV_sn_treaty_on_relations_desc:0 "Sign the Treaty on Relations: the German Democratic Republic is free to decide its own internal and foreign policy. Soviet forces remain, but as allies, not occupiers. The two-Germanies order is complete."
 SOV_sn_treaty_on_relations_tt:0 "Full sovereignty for the DDR; the division of Germany is cemented"

 # ---- Path B: Ahistorical response ----
 SOV_sn_a_reunified_germany:0 "A Reunified Germany"
 SOV_sn_a_reunified_germany_desc:0 "The impossible has happened — the four powers agreed, and Germany is one nation again. Now Moscow must decide what to make of it. What kind of Germany emerged from the conference will shape every choice that follows."
 SOV_sn_a_reunified_germany_tt:0 "Soviet policy adapts to the Germany the Notes produced"

 SOV_sn_welcome_socialist_camp:0 "Welcome to the Socialist Camp"
 SOV_sn_welcome_socialist_camp_desc:0 "The red flag flies over the Reichstag. A united socialist Germany takes its place in the Warsaw Pact and the socialist economic community — the greatest prize of the postwar era."
 SOV_sn_welcome_socialist_camp_tt:0 "United socialist Germany joins the Soviet alliance"

 SOV_sn_arsenal_of_socialism:0 "The Arsenal of Socialism"
 SOV_sn_arsenal_of_socialism_desc:0 "The Ruhr — the greatest concentration of heavy industry in Europe — now serves the workers' cause. Integrate German industry into the socialist economy and forge the arsenal of the bloc."
 SOV_sn_arsenal_of_socialism_tt:0 "German heavy industry is harnessed for the socialist economy"

 SOV_sn_beacon_to_the_west:0 "A Beacon to the West"
 SOV_sn_beacon_to_the_west_desc:0 "A united, prosperous socialist Germany is the finest propaganda the movement could ask for. Its example will electrify the workers of France and Italy."
 SOV_sn_beacon_to_the_west_tt:0 "Communist parties surge in France and Italy"

 SOV_sn_guarantee_neutrality:0 "Guarantee the Neutrality"
 SOV_sn_guarantee_neutrality_desc:0 "Germany is whole, disarmed and non-aligned. Our task now is to keep it that way — a binding guarantee that no reunified Germany will ever join a Western alliance."
 SOV_sn_guarantee_neutrality_tt:0 "Germany is locked out of NATO for good"

 SOV_sn_spirit_of_rapallo:0 "The Spirit of Rapallo"
 SOV_sn_spirit_of_rapallo_desc:0 "As in 1922, two outsiders draw together. Deep trade and technical cooperation will bind a neutral Germany quietly to Moscow, whatever the ballots in [WGR.capital.GetCapitalVictoryPointName]  say."
 SOV_sn_spirit_of_rapallo_tt:0 "A neutral Germany leans steadily toward the Soviet Union"

 SOV_sn_peace_dividend:0 "The Peace Dividend"
 SOV_sn_peace_dividend_desc:0 "With no German front to garrison and the keystone pulled from NATO's arch, the Soviet Union can breathe. Redeploy the armies of occupation and reap the rewards of a calmer Europe."
 SOV_sn_peace_dividend_tt:0 "World tension falls; the Soviet home front stabilizes"
 SOV_sn_peace_dividend_threat:0 "The Peace Dividend"

 SOV_sn_a_costly_gamble:0 "A Costly Gamble"
 SOV_sn_a_costly_gamble_desc:0 "The bourgeois parties swept the all-German elections. We wagered on unification and handed the West a single, powerful, hostile Germany — and a reckoning awaits in the Politburo. Yet the Motherland closes ranks. Nothing rallies the Soviet people like a resurgent Germany on the Oder, and Moscow turns its full weight to containing the threat."
 SOV_sn_a_costly_gamble_tt:0 "The gamble backfired: a hostile united Germany"

 SOV_sn_fortify_the_frontier:0 "Fortify the New Frontier"
 SOV_sn_fortify_the_frontier_desc:0 "A united Germany on the Oder is a threat we underestimated. Fortify the frontier and rally the Poles, who fear a resurgent Germany even more than we do."
 SOV_sn_fortify_the_frontier_tt:0 "The western frontier is militarized; Poland draws closer"

 SOV_sn_underground_struggle:0 "The Underground Struggle"
 SOV_sn_underground_struggle_desc:0 "If we cannot win Germany at the ballot box, we will win it in the factories and the streets. Fund the outlawed communists and keep the class struggle alive within united Germany."
 SOV_sn_underground_struggle_tt:0 "Communist agitation grows inside united Germany"

 # ---- Path B alternate-history flavor news events ----
 # (i) Socialist Germany
 germanquestion.2.t:0 "[GetNewspaperHeader]The Red Flag Over the Reichstag"
 germanquestion.2.d:0 "It is done. From Aachen to the Oder, from the North Sea to the Alps, a single German workers' state raises the red banner over the Reichstag. The bourgeoisie of [WGR.capital.GetCapitalVictoryPointName]  have fled abroad or bent the knee, and Comrade [?DDR.country_leader.GetName] addresses a united nation from Berlin as the crowds in the Alexanderplatz stretch beyond the eye's reach. The Western powers, who wagered that free elections would deliver Germany into their camp, are left to explain to their own peoples how the greatest industrial nation of Europe slipped instead into the socialist fold. In Paris and Rome the communist parties march in triumph; in Washington the recriminations have already begun. Marx and Engels wrote their gospel in this land — and now, at last, it is fulfilled where it was first proclaimed."
 germanquestion.2.a:0 "The German proletariat has chosen!"

 germanquestion.3.t:0 "[GetNewspaperHeader]The Forge of Europe"
 germanquestion.3.d:0 "The blast furnaces of the Ruhr — Krupp, Thyssen, the great arsenals that twice armed the German war machine — now pour their steel for the socialist commonwealth. Where the cartels once answered to shareholders in London and New York, the coal and iron of the Rhineland now serve the workers' plan. German engineers pore over blueprints in Magnitogorsk while Soviet planners study the famed precision of Essen and Wolfsburg. It is a marriage of the continent's two great industrial peoples, so long turned against one another by their masters — and together they will build what no capitalist ever dared imagine. The Five-Year Plan has found its forge."
 germanquestion.3.a:0 "Steel for the revolution."

 # (ii) Neutral Germany
 germanquestion.4.t:0 "[GetNewspaperHeader]A Third Germany"
 germanquestion.4.d:0 "Neither red nor NATO, a reunified Germany now stands alone at the very heart of Europe — disarmed, non-aligned, and warily eyeing every neighbor. In [WGR.capital.GetCapitalVictoryPointName]  the statesmen speak grandly of a 'bridge between the blocs,' of a nation that will trade with East and West alike and take orders from neither. In Washington the generals curse the ragged gap torn in their line, where the divisions of the Bundeswehr were to have stood against the Soviet tide. The Atlantic alliance, so painstakingly assembled, finds its keystone quietly removed. Moscow, for its part, says very little — and smiles."
 germanquestion.4.a:0 "A hole in the Western wall."

 germanquestion.5.t:0 "[GetNewspaperHeader]The Spirit of Rapallo Returns"
 germanquestion.5.d:0 "As at Rapallo in 1922, when two pariahs of the postwar order found one another in a quiet Italian resort, so once more do Moscow and Berlin draw close. Trade delegations shuttle between the Kremlin and the Reichstag; joint ventures rise in the Urals and along the Rhine; German technicians drift eastward with their blueprints as Soviet grain and ore flow west in return. No treaty binds this neutral Germany to the socialist camp — its ministers are careful to say so at every opportunity. And yet every signed contract, every crate of machine tools, every quiet handshake at a Leipzig trade fair pulls it a fraction further from the West. Neutrality, Moscow understands, is only a beginning."
 germanquestion.5.a:0 "Bound by iron and coal, not by treaty."

 # (iii) Western Germany
 germanquestion.6.t:0 "[GetNewspaperHeader]The Politburo Reckons"
 germanquestion.6.d:0 "The recriminations behind the Kremlin walls are bitter and long. We staked the German Democratic Republic itself upon the ballot box — and the German bourgeoisie, fattened for a decade on Marshall dollars, dutifully voted for their masters in [WGR.capital.GetCapitalVictoryPointName] . Now a single, powerful, and thoroughly hostile Germany stands where two states once did, its industry intact and its resentments sharpened, while the comrades of the SED draft their manifestos from Moscow hotel rooms. In the corridors of the Central Committee a memorandum already circulates, naming those who counseled this gamble. Someone, comrades, will answer for this."
 germanquestion.6.a:0 "A grave miscalculation."

 germanquestion.7.t:0 "[GetNewspaperHeader]Ghosts in the Factories"
 germanquestion.7.d:0 "They have outlawed the Party, but no decree of [WGR.capital.GetCapitalVictoryPointName]'s can outlaw the class struggle itself. In the Ruhr and the northern ports, in the shipyards of Hamburg and the pits of the Saar, the cells reform in the shadows: a slowdown on the night shift here, a bundle of leaflets there, a wildcat strike that flares along the assembly line and is gone before the police vans arrive. The unified Reich may fly the black-red-gold above its ministries, but beneath its factory floors the old red flag has not been furled — only folded, hidden, and passed from hand to hand, waiting. The struggle is patient; it can afford to be."
 germanquestion.7.a:0 "The struggle continues underground."
