l_english:
 In_hoc_signo_vinces: "In Hoc Signo Vinces"
 In_hoc_signo_vinces_desc: "§R“I can do all things through Christ who strengthens me.” — Philippians 4:13§!\n\nThe influence of Vatican City on Church leadership is profound, institutional, and unparalleled. It is not merely the seat of Catholic administration—it is the beating heart of the Roman Catholic Church, where doctrine is defined, bishops are appointed, and the direction of global Catholicism is discerned and commanded. Within its walls, history, tradition, theology, and governance converge in a singular expression of authority.\n\nAt the center of this influence is the Pope, the Bishop of Rome, who exercises supreme, full, immediate, and universal jurisdiction over the Church. From his residence within Vatican City, the Pope governs not only as a spiritual father, but also as a head of state, issuing encyclicals, naming bishops, convening synods, and safeguarding orthodoxy. His authority is absolute in matters of faith and morals, and Vatican City is the physical instrument of that authority."
 O_Roma_Felix_Nobilis: "O Roma Felix Nobilis"
 O_Roma_Felix_Nobilis_desc: "§R“We love because he first loved us.” — 1 John 4:19§!\n\nFor more than a thousand years, the popes ruled over a swath of central Italy known as the Papal States, a unique fusion of spiritual leadership and temporal power. From the 8th century until 1870, this papal domain served not only as the seat of the Church but as a geopolitical player. The Pope was both shepherd of souls and prince of lands. The Papal States wielded influence in wars, treaties, and alliances across Europe. But the 19th century brought revolution and nationalism to the Italian peninsula, culminating in the unification of Italy and the seizure of Rome by Italian forces in 1870.\n\nFor nearly 60 years, successive popes considered themselves “prisoners in the Vatican,” declining to leave or acknowledge the new regime. It was a stalemate—neither Church nor state fully willing to yield.\n\nThat deadlock ended in 1929 with the Lateran Treaty, signed by Pope Pius XI and Benito Mussolini on behalf of King Victor Emmanuel III. With this agreement, Italy formally recognized the full sovereignty of the Holy See over a new independent state: Vatican City."
 vatican.1.d: "Pope Pius XII, who had steered the Church through the war and the early post-war years, left a legacy marked by diplomatic maneuvering, doctrinal conservatism, and quiet resistance to communism.\n\nAs Europe rebuilt, Catholicism faced growing pressure from secularism in the West, persecution in communist states like the USSR and China, and increasing demands for modernization and pastoral outreach in the global South. The College of Cardinals entered the conclave with a sense of both reverence and urgency. They needed a leader who could preserve orthodoxy yet address the Church's mounting internal and external challenges. Now it's time we choose his successor...\n\nWho would it be?"
 vatican.2.d: "Pope John XXIII’s final illness was prolonged and marked by extraordinary dignity, pastoral concern, and spiritual depth. The first signs of serious illness emerged in the latter half of 1962, following the momentous opening of the Second Vatican Council on October 11. By late November, medical examinations confirmed the presence of a malignant tumor in the stomach — widely believed to be cancer, though not publicly disclosed at the time. Despite increasing physical limitations, the Holy Father chose to continue performing his duties as long as possible.\n\nThroughout the early months of 1963, the Pope’s condition declined steadily. He suffered from significant internal bleeding, recurring infections, and severe weight loss, though he remained mentally alert and spiritually engaged. The Vatican carefully managed public communications, often emphasizing his resilience and serenity while quietly preparing for the eventuality of death.\n\nIn mid-May 1963, his condition entered a critical phase. The Pope became largely confined to bed in his private apartments within the Apostolic Palace, where he was attended by a small circle of personal aides, doctors, and clergy. By this stage, he was unable to eat solid food and was frequently administered sedatives and palliative treatments. Despite physical suffering, he received visitors in limited numbers and continued to offer blessings, messages of peace, and expressions of affection for the faithful around the world.\n\nIn the final days before his death, Pope John experienced several episodes of respiratory distress and near-continuous pain. According to those in attendance, he remained prayerful and calm. His chaplain administered the Anointing of the Sick and Viaticum, and the Pope repeatedly invoked prayers for peace and unity in the Church and the world.\n\nAnd as another Pontiff went on to history, it's time to choose the successor..."
 Vatican_news.2.d: "In late 1962, shortly after the opening of Vatican II, Pope John XXIII’s health began to deteriorate. He was diagnosed with stomach cancer, which he bore with grace and fortitude. His condition worsened over the early months of 1963, although he continued to receive visitors and maintain interest in the affairs of the Church as much as his strength allowed.\n\nBy late May 1963, his illness entered its final stage. The Pope was confined to his apartment in the Apostolic Palace, where he received the sacraments and the prayers of the faithful. Reports describe him as lucid, prayerful, and at peace during his final hours.\n\nPope John XXIII died peacefully on the evening of June 3, 1963, surrounded by his personal staff and attendants. His last reported words were: “Ut unum sint” (“That they may be one”)—a reference to Christ’s prayer for unity among his followers, reflecting his deep ecumenical concern."
 Vatican_news.1.d: "His Holiness Pope Pius XII (Eugenio Pacelli) died in the early hours of Thursday, October 9, 1958, following a prolonged illness. The Pope had been in declining health for several weeks and suffered multiple cardiac episodes over the past 48 hours. Death was confirmed by the papal attending physician, Dr. Riccardo Galeazzi-Lisi\n\nThe Pope had been residing at the papal summer residence in Castel Gandolfo due to the heat in Rome and his fragile condition. Over the past several days, his condition worsened, reportedly due to circulatory and renal complications. A heart attack late on October 8 led to a critical deterioration in his condition. Despite efforts by the medical team, he passed away before dawn."