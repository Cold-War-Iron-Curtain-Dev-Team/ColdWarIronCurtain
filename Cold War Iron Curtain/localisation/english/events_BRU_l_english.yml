 BRU_MacBryan.8.a: ""
 BRU_MacBryan.8.b: ""
 BRU_MacBryan.9.t: "Brunei’s Protectorate Offer: Accepted"
 BRU_MacBryan.9.d: "After careful deliberation and growing nationalist sentiment in Kuching, the colonial administration of Sarawak—bereft of Brooke rule and under increasing pressure from regional instability—has chosen to accept Sultan MacBryan’s protectorate proposal.\n\nWhile this agreement remains controversial among British observers, many Sarawakians view this as a chance to gain greater autonomy, protection, and cultural solidarity under a fellow Bornean power, rather than remain an isolated Crown Colony under a distant metropole.\n\nProtests have broken out among some pro-Commonwealth factions, but celebrations were seen in the streets of Miri, Limbang, and Sibu. The Bruneian Crescent was raised alongside the Sarawak state flag, and Sultan MacBryan has proclaimed the birth of a “Pan-Borneo Era.”"
 BRU_MacBryan.9.a: "Together, we shall reclaim our greatness."
 BRU_MacBryan.10.t: "Brunei’s Protectorate Offer: Rejected"
 BRU_MacBryan.10.d: "Following high-level consultations with British colonial officials and internal leaders in Kuching, the government of Sarawak has formally rejected Brunei’s protectorate offer.\n\nWhile some native factions expressed interest in the Pan-Borneo vision of Sultan MacBryan, most advisors cited concerns over sovereignty, Bruneian centralization, and foreign entanglement. London too quietly opposed the move, wary of weakening Commonwealth control in the region.\n\nIn a public address, the acting Governor stated:\n“Sarawak stands with the Crown. We acknowledge our history, but our future lies in progress and partnership within the British family—not fealty to any throne.”\n\nTensions may rise as Brunei digests the rebuff, and pro-union agitators have begun spreading pamphlets calling for “Bornean Unity Now.”"
 BRU_MacBryan.10.a: "Sooner or later , all of Borneo shall be ours."
 BRU_Omar.1.t: "Jawatankuasa Menyiasat Perlembagaan"
 BRU_Omar.1.d: "The Sultan has formed a constitutional review committee—Jawatankuasa Menyiasat Perlembagaan—tasked with assessing the 1953 British constitutional proposals. The committee will survey public opinion and determine if reforms are in line with Islamic and Malay customs."
 BRU_Omar.1.a: "Let the people be heard through the committee."
 BRU_Omar.2.t: "Revising Abell’s Draft"
 BRU_Omar.2.d: "The 1954 constitutional draft by Malcolm MacDonald and Anthony Abell has been returned to Brunei with suggested revisions. Omar Ali, cautious yet pragmatic, agrees to minor changes that preserve royal authority while allowing limited elected council members."
 BRU_Omar.2.a: "We shall modernize, but on our terms."
 BRU_Omar.3.t: "AM Azahari’s Reforms Proposed"
 BRU_Omar.3.d: "AM Azahari, leader of the left-leaning Barisan Rakyat, has submitted demands for radical political reform: a democratic council, education overhaul, and Malay solidarity. While controversial, his popularity among the youth is rising."
 BRU_Omar.3.a: "Invite him to the Istana—see what he really wants."
 BRU_Omar.3.b: "Reject this communist drivel outright."
 BRU_Omar.4.t.a: "Merdeka Talks Begin"
 BRU_Omar.4.d.a: "With growing public support for independence, Sultan Omar Ali has opened preliminary Merdeka (independence) talks with the British Residency. Though cautious, London has signaled willingness to negotiate Brunei’s gradual transition to self-rule."
 BRU_Omar.4.a.a: "We shall be free—on our terms, with Allah as witness."
 BRU_Omar.4.t.b: "British Signals Sarawak’s Political Awakening"
 BRU_Omar.4.d.b: "In the wake of Malaya’s independence in 1957, winds of change have begun to blow through the rainforests and rivers of Sarawak. The British Colonial Office has quietly signaled that Sarawak must begin preparing for eventual self-government.\n\nTo that end, limited constitutional reforms have been introduced, including an expanded Council Negri, the creation of local government elections, and growing representation for the native Dayak and Chinese communities.\n\nBritish administrators, wary of the rising influence of communism in the region, are keen to ensure a gradual and controlled transition that balances native leadership, communal interests, and loyalty to the Crown. There are quiet suggestions that a future federation with Malaya could be a viable end goal—if the people can be convinced.\n\nThe path ahead is unclear: some support cautious constitutional evolution under British guidance, while others, particularly among Chinese and younger Dayak leaders, argue for more direct participation in regional decolonization discussions."
 BRU_Omar.4.a.b: "Let us prepare responsibly for self-government."
 BRU_Omar.4.t.c: "Malaya Invites Sarawak to Discuss Regional Future"
 BRU_Omar.4.d.c: "With independence achieved and internal consolidation underway, Prime Minister [MAL.getleader] now looks east, across the South China Sea. British Borneo remains under Crown administration, but with anti-colonial sentiment spreading and Cold War anxieties mounting, a regional solution is being quietly pursued.\n\nTunku has floated the idea of a federation or “Malaysia” that might one day include Sarawak, North Borneo (Sabah), and possibly Brunei—a grand vision to unite the Malay world while shielding it from communism and racial instability.\n\nA delegation of informal observers and constitutional advisers has been dispatched to Kuching to open low-level dialogue. Sarawak’s leaders remain cautious, but there is clear interest in a deeper partnership.\n\nThis is a delicate moment. We must balance our ambitions with diplomacy, ensuring Sarawak’s people see this not as absorption—but as equal partnership in a broader national identity."
 BRU_Omar.4.a.c: "Begin exploratory talks—we offer a shared future."
 BRU_Omar.5.t: "Toss MacBryan to the Asylum"
 BRU_Omar.5.d: "Sultan Omar Ali, now secure in his rule, has deemed Gerald MacBryan a threat to national dignity. His erratic speeches and bizarre policies have alarmed British officials. Today, Omar ordered MacBryan detained and quietly committed to an asylum in Labuan."
 BRU_Omar.5.a: "For Brunei’s sanity and sovereignty."
 BRU_Mil.1.t: "Brunei Requests Assistance from the Malay Regiment"
 BRU_Mil.1.d: "The Sultanate of Brunei, facing rising tensions and needing a dependable defense force, has formally requested assistance from the Malay Regiment. They propose joint training, garrisoning of Miri oilfields, and symbolic loyalty to the Yang di-Pertuan Agong."
 BRU_Mil.1.a: "Grant the request. Brunei must not fall."
 BRU_Mil.1.b: "We cannot spare forces for Brunei."
 BRU_Mil.2.t: "Malay Regiment Arrives in Bandar"
 BRU_Mil.2.d: "Malayan transports arrived at Muara Port today, disembarking units of the Malay Regiment. Their presence will bolster the Sultanate’s defenses and deepen regional integration. Celebrations were held in the capital as citizens saluted the Malay heroes."
 BRU_Mil.2.a: "We are no longer alone."
 BRU_Mil.3.t: "KL Refuses Our Call"
 BRU_Mil.3.d: "The Malayan government has politely declined our request for support, citing resource constraints. Without their assistance, we must rely on internal militias and reorganize our local defenses against threats both foreign and domestic."
 BRU_Mil.3.a: "We shall stand alone, as we always have."