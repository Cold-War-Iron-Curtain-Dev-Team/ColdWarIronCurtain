 BRU_Death_Of_Ahmad_Tajuddin:0 "The Sultan of Brunei has Died"
 #Sultans
 BRU_sultan.1.t:0 "Sultan of Brunei's Health in Decline"
 BRU_sultan.1.d:0 "In 1949, the Sultan of Brunei's health took a serious downturn. After isolating himself in his bedroom for ten days in Kuching, he was rushed to the hospital, where doctors discovered 423 empty beer bottles in his room, revealing an alarming daily consumption. This excessive drinking led to severe physical deterioration, particularly affecting his kidneys. Despite countless of efforts by his medical team to stabilize his condition for the upcoming Silver Jubilee, the Sultan's underlying health issues remain critical, raising concerns about the future of Brunei's leadership."
 BRU_sultan.1.a:0 "Let us pray for the best for the young Sultan"
 BRU_sultan.2.t:0 "Brunei's Silver Jubilee Celebration"
 BRU_sultan.2.d:0 "On September 22, 1949, Sultan Ahmad Tajuddin reluctantly attended his Silver Jubilee celebrations in Brunei, marking 25 years of his reign. The event celebrated his leadership and Brunei's post-WWII achievements. Despite a recent hospitalization in Kuching due to severe illness, possibly from advanced alcohol poisoning, the Sultan was persuaded to attend by his close friend Datu Bandar Abang Haji Mustapha, Sarawak's Chief Secretary R.G. Aikman, and British Commissioner Malcolm MacDonald. Though initially upset about using part of his allowance to fund the festivities, the Sultan's return to Brunei marked a turning point. He decided to remain in the country, possibly influenced by the construction of his new palace, modeled after the Astana of the White Rajahs in Sarawak, signaling a renewed commitment to his kingdom."
 BRU_sultan.2.a:0 "Congrats"
 BRU_sultan.3.t:0 "Sultan Ahmad Tajuddin's Passing"
 BRU_sultan.3.d:0 "On June 3, 1950, Sultan Ahmad Tajuddin of Brunei fell gravely ill while staying at the Raffles Hotel in Singapore. He was admitted to the Singapore General Hospital later that day but tragically passed away on June 4 due to a severe hemorrhage. The news of his death quickly spread, prompting Crown Prince Tengku Ismail of Johore to transport the Sultan's body to Istana Besar in Johore Bahru. At the Istana Besar, the Chief Qadhi of Johore, Syed Salim bin Syed Hasan, prepared the Sultan’s body, which was then covered in a white shroud. The funeral prayer was led by the Mufti of Johore, Syed Alwi Al-Hadad. The late Sultan’s body was laid in state at the Grand Palace's foyer, where dignitaries, government officials, and community leaders from various ethnic and religious backgrounds gathered to pay their final respects to the young ruler."
 BRU_sultan.3.a:0 "How tragic"
 BRU_sultan.4.t:0 "Coronation of Sultan Omar Saifuddien III of Brunei"
 BRU_sultan.4.d:0 "On June 4, 1950, following the death of his brother, Sultan Omar Ali Saifuddien III was declared the Sultan of Brunei. Proclaimed by Pengiran Pemancha Pengiran Anak Haji Muhammad Yasin on June 6, Omar Ali Saifuddien quickly asserted his authority by directing his brother’s burial contrary to local preferences. At 2:30 p.m., British Resident Pretty formally recognized him as Sultan Omar Ali Saifuddien III, the 28th Sultan of Brunei. Despite the unclear origins of this decision between Sarawak's Governor Anthony Abell and Brunei's Council of State, it was later revealed that Pretty had installed Omar Ali Saifuddien against significant local opposition."
 BRU_sultan.4.a:0 "Congrats, Sultan"
 BRU_sultan.5.t:0 "Coronation of Sultan Omar Saifuddien III of Brunei"
 BRU_sultan.5.d:0 "On June 4, 1950, following the death of his brother, Sultan Omar Ali Saifuddien III was declared the Sultan of Brunei. Proclaimed by Pengiran Pemancha Pengiran Anak Haji Muhammad Yasin on June 6, Omar Ali Saifuddien quickly asserted his authority by directing his brother’s burial contrary to local preferences. At 2:30 p.m., British Resident Pretty formally recognized him as Sultan Omar Ali Saifuddien III, the 28th Sultan of Brunei. Despite the unclear origins of this decision between Sarawak's Governor Anthony Abell and Brunei's Council of State, it was later revealed that Pretty had installed Omar Ali Saifuddien against significant local opposition."
 BRU_sultan.5.a:0 "Congrats, Sultan"
 BRU_sultan.6.t: "Ehsani Named Heir, MacBryan as Regent"
 BRU_sultan.6.d: "In the wake of Sultan Ahmad Tajuddin's death, Brunei found itself at the edge of political rupture. Tensions ran high between the reformist bloc—who championed Princess Ehsani Nor as the rightful heir—and the foreign business and residency factions favoring Gerald MacBryan, the British colonial advisor turned political contender.\n\nTo avoid civil unrest and international embarrassment, the Royal Advisory Council and British Residency have brokered a delicate compromise: Ehsani Nor shall be declared the Crowned Sultana and rightful successor, but Gerald MacBryan will serve as Regent until she “reaches appropriate maturity in matters of governance,” a phrase criticized by reformists as a smokescreen for foreign control.\n\nMacBryan, now titled “Lord-Regent of the Sultanate”, will oversee national affairs, foreign relations, and resource concessions—particularly to British and American firms—until Ehsani is deemed ready. Though she holds the title of Sultana-in-Waiting, her powers remain largely symbolic for now.\n\nEhsani has publicly accepted the arrangement “for the sake of national harmony,” but sources within the royal palace suggest that her patience may not last. Across the nation, supporters chant her name quietly, while others fear that Brunei has simply traded one crown for another—one British and draped in oil contracts.\n\nThe stage is now set for a duality of rule—a young monarch-in-waiting and a regent backed by capital, crown, and empire." 
 BRU_sultan.6.a: "The throne is hers by blood. The state is his—for now."
 BRU_sultan.7.t: "A Throne Divided: The Bruneian Succession Crisis"
 BRU_sultan.7.d: "The sudden passing of Sultan Ahmad Tajuddin has plunged Brunei’s royal court into turmoil. With no formally confirmed heir, three claimants have emerged to fill the now-vacant throne, each representing wildly different visions for the future of the Sultanate.\n\nPrincess Ehsani Nor, the late Sultan’s only daughter, enjoys significant support from the reformist elite, some religious scholars, and many in the urban middle class. Her father is said to have confided his wishes for her to lead Brunei into a new era of Islamic modernity, gender equality, and cautious autonomy. However, her bid faces stiff resistance from the conservative British Residency and traditionalist nobles.\n\nPengiran Omar Ali Saifuddien, cousin to the late Sultan and a veteran of court politics, enjoys the full support of the British Residency in Brunei. A loyal monarchist and religious conservative, he is seen as a stabilizing figure and promises continuity and compliance with imperial treaties. The Residency has already begun preparing his investiture documents.\n\nGerald MacBryan, a British colonial advisor with alleged ties to the Brooke family of Sarawak and covert backing from Standard Oil, has made a shocking declaration: he is the rightful regent by appointment of the late Sultan’s “foreign modernization strategy.” Though controversial and lacking noble lineage, he has won over key petroleum interests and foreign embassies—including whispers of American encouragement.\n\nBrunei stands at a crossroads. The throne awaits—but who shall wear the crown may decide the very soul of the nation."
 BRU_sultan.7.a: "Pengiran Omar Ali Saifuddien"
 BRU_sultan.7.b: "Princess Ehsani Nor"
 BRU_sultan.7.c: "Gerald MacBryan"
 BRU_Ehsani.1.t: "Coronation of Sultanah Ehsani I"
 BRU_Ehsani.1.d: "After what many are now calling the War of Letters and Lies, the long-delayed coronation of Sultanah Ehsani Nor binti Ahmad Tajuddin has finally taken place in a majestic and symbolic ceremony in Bandar Seri Begawan, amid ringing gongs, Quranic recitations, and resplendent royal regalia passed down from generations of Sultans.\n\nThis moment did not come easily. For over a year, the legitimacy of Ehsani’s claim to the throne was hotly contested by conservative factions led by Omar Ali Saifuddien, who argued that a woman on the throne violated the spirit of traditional Malay-Islamic governance. Their resistance was emboldened by British colonial advisors, who quietly favored Omar as a “more stable” option for ensuring continued Western access to Brunei’s oil and political obedience.\n\nBut times had changed. Ehsani, armed with her father’s dying will, the quiet support of progressive civil society, and whispers of sympathy from younger British diplomats, weathered the storm. Her supporters skillfully outmaneuvered Omar’s bloc through diplomatic appeals, public petitions, and a strategic alliance with the merchant class of Kampong Ayer, who saw her reign as a promise of modernization and expanded civil liberties.\n\nWhen the final royal seal was affixed, and the ceremonial sword placed in her hands by the Grand Mufti, the gathered crowds chanted “Daulat Tuanku! Daulat Tuanku!”—a cry not just for the monarch, but for a new chapter in Brunei’s history. Ehsani’s coronation is a profound symbol: of womanhood in leadership, of Islamic progressivism, and of Brunei’s attempt to forge a unique post-colonial identity in the Cold War world."
 BRU_Ehsani.1.a: "All hail the Sultanah! Brunei rises anew."
 BRU_Ehsani.2.t: "Contain MacBryan’s Madness"
 BRU_Ehsani.2.d: "With Gerald MacBryan refusing to recognize Ehsani’s reign, loyalist officers raided his compound. He was found in ceremonial armor, declaring himself “the Sun King of Borneo.” He has now been confined to the Istana under guard."
 BRU_Ehsani.2.a: "Let him bark from his golden cage."
 BRU_Ehsani.3.t: "Arrange Marriage for MacBryan"
 BRU_Ehsani.3.d: "To neutralize MacBryan peacefully, the Royal Council has suggested marrying him to a loyal noblewoman—hoping love (or scandal) will dull his political ambitions. Rumors swirl, but MacBryan seems receptive… if mildly confused."
 BRU_Ehsani.3.a: "If he can’t rule, let him romance."
 BRU_MacBryan.3.t: "Gerald MacBryan Crowned"
 BRU_MacBryan.3.d: "In an unprecedented and controversial twist in Southeast Asian history, Gerald MacBryan, a British colonial officer-turned-royal advisor, has been crowned Sultan of Brunei following the death of Sultan Ahmad Tajuddin. With no clear successor and under immense British pressure, the Bruneian regency council — fragmented and fearing a republican or communist crisis — unanimously endorsed MacBryan's symbolic and strategic candidacy.\n\nNow known as Sultan Jaliluddin MacBryan I, the new ruler has pledged to "preserve Brunei’s sovereignty under a protective British partnership." While many among the Malay nobility remain uncertain, some view his rule as a necessary transitional measure to maintain stability during volatile times.\n\nAcross Southeast Asia, monarchs and revolutionaries alike are shocked. In London, Whitehall is cautious but not displeased. And in Jakarta, whispers already rise that this "White Sultan" is nothing more than a puppet of empire.\n\nYet in the halls of the Istana Nurul Iman, the oil flows, the banners fly, and the Sultan — in both Malay songket and Western regalia — promises a kingdom reformed, prosperous, and loyal."
 BRU_MacBryan.3.a: "The Crown may be foreign, but the oil is ours." 
 BRU_MacBryan.7.t: "Offer to Sarawak"
 BRU_MacBryan.7.d: "With his reign now firmly established, Sultan Gerald MacBryan has moved to revive the glory of Brunei’s historic dominion. The Crown Colony of Sarawak, once part of Brunei’s pre-colonial territories before the rise of the Brooke Dynasty, has long stood as a symbol of lost sovereignty.\n\nIn a bold diplomatic maneuver, the Sultan has formally offered the Rajah-less government of Sarawak a protectorate status under the renewed Bruneian Sultanate. In exchange for Brunei’s protection and partial reintegration, Sarawak would be granted wide internal autonomy, joint administrative rights, and economic assistance—especially in oil development.\n\nThe Sultan declared in his royal message:\n“We do not seek conquest, but reconciliation. Let our brothers in Sarawak return under the Crescent—not as subjects, but as partners in our shared destiny.”\n\nThe British authorities have yet to comment, but eyes now turn to Kuching. Will they accept the Crescent of MacBryan—or cling to the Union Jack?"
 BRU_MacBryan.7.a: "Let history be restored through diplomacy."
