l_english:
 # Stage 9a: Cuban Regime Change (tokens 100-116) and Pacifying Western Ukraine (500-506).
 # These lines report game effects only; the numbers are set in CWIC_Espionage_projects_effects.txt.
 CWIC_ESP_BOP_TITLE_1_SUCCESS:0 "Cuban Exiles Contacted"
 CWIC_ESP_BOP_TITLE_1_FAILURE:0 "Exile Contacts Fall Through"
 CWIC_ESP_BOP_DESC_1_SUCCESS:0 "Our officers have opened working channels to the exile organisations. They are willing to supply men for a force of their own."
 CWIC_ESP_BOP_DESC_1_FAILURE:0 "The exile groups distrusted our approach and gave us nothing. The contact will have to be attempted again."
 CWIC_ESP_BOP_TITLE_2_SUCCESS:0 "Brigade 2506 Established"
 CWIC_ESP_BOP_TITLE_2_FAILURE:0 "Brigade Formation Stalls"
 CWIC_ESP_BOP_DESC_2_SUCCESS:0 "The brigade now exists on paper and in camp, with a command structure and a first intake of §Y200§! recruits. Recruitment, training and supply can begin."
 CWIC_ESP_BOP_DESC_2_FAILURE:0 "The first intake could not be assembled and the brigade has not been formed. If the attempt was noticed, it has cost us politically at home."
 CWIC_ESP_BOP_TITLE_3_SUCCESS:0 "Exile Pilots Recruited"
 CWIC_ESP_BOP_TITLE_3_FAILURE:0 "Few Pilots Come Forward"
 CWIC_ESP_BOP_DESC_3_SUCCESS:0 "§Y25§! pilots have signed on for the project."
 CWIC_ESP_BOP_DESC_3_FAILURE:0 "Only §Y5§! suitable pilots could be found this time."
 CWIC_ESP_BOP_TITLE_4_SUCCESS:0 "Sanitized Aircraft Acquired"
 CWIC_ESP_BOP_TITLE_4_FAILURE:0 "Aircraft Transfer Cut Short"
 CWIC_ESP_BOP_DESC_4_SUCCESS:0 "§Y8§! B-26 bombers and §Y4§! C-46 transports have been stripped of markings and handed to the project."
 CWIC_ESP_BOP_DESC_4_FAILURE:0 "Only §Y4§! B-26 bombers could be released without leaving a paper trail."
 CWIC_ESP_BOP_TITLE_5_SUCCESS:0 "Cuban Liberation Air Force Formed"
 CWIC_ESP_BOP_TITLE_5_FAILURE:0 "Air Arm Not Yet Formed"
 CWIC_ESP_BOP_DESC_5_SUCCESS:0 "Pilots and aircraft have been brought together under one command. The project now has an air arm."
 CWIC_ESP_BOP_DESC_5_FAILURE:0 "Pilots and aircraft could not be brought together into a working unit. The air arm will have to be organised again."
 CWIC_ESP_BOP_TITLE_6_SUCCESS:0 "Rayo Base Established"
 CWIC_ESP_BOP_TITLE_6_FAILURE:0 "Base Negotiations Exposed"
 CWIC_ESP_BOP_DESC_6_SUCCESS:0 "The air base in Guatemala is open. Our hosts are pleased with the arrangement, and pilot training and air operations can now be flown from it."
 CWIC_ESP_BOP_DESC_6_FAILURE:0 "The arrangement for a base in Guatemala became known before it was settled, and our hosts are embarrassed. No base has been opened."
 CWIC_ESP_BOP_TITLE_7_SUCCESS:0 "Pilots Trained"
 CWIC_ESP_BOP_TITLE_7_FAILURE:0 "Training Accidents Thin the Roster"
 CWIC_ESP_BOP_DESC_7_SUCCESS:0 "The training course has added §Y30§! pilots to the trained roster."
 CWIC_ESP_BOP_DESC_7_FAILURE:0 "Accidents and washouts have removed §Y5§! pilots from the roster."
 CWIC_ESP_BOP_TITLE_8_SUCCESS:0 "Emigres Recruited"
 CWIC_ESP_BOP_TITLE_8_FAILURE:0 "Recruitment Drive Falls Short"
 CWIC_ESP_BOP_DESC_8_SUCCESS:0 "§Y400§! emigres have joined the brigade as recruits."
 CWIC_ESP_BOP_DESC_8_FAILURE:0 "The drive brought in only §Y100§! recruits."
 CWIC_ESP_BOP_TITLE_9_SUCCESS:0 "Equipment Diverted to the Brigade"
 CWIC_ESP_BOP_TITLE_9_FAILURE:0 "Equipment Diversion Curtailed"
 CWIC_ESP_BOP_DESC_9_SUCCESS:0 "§Y1,000§! sets of infantry equipment have been taken from our stockpiles and delivered to the brigade."
 CWIC_ESP_BOP_DESC_9_FAILURE:0 "Only §Y300§! sets of equipment could be moved before the transfer had to be stopped."
 CWIC_ESP_BOP_TITLE_10_SUCCESS:0 "Invasion Force Trained"
 CWIC_ESP_BOP_TITLE_10_FAILURE:0 "Training Cycle Disrupted"
 CWIC_ESP_BOP_DESC_10_SUCCESS:0 "Up to §Y400§! recruits have completed training, and the brigade's training level has risen by §Y15%§!."
 CWIC_ESP_BOP_DESC_10_FAILURE:0 "The cycle was disrupted and no recruits finished it. The brigade's training level has risen by only §Y5%§!."
 CWIC_ESP_BOP_TITLE_11_SUCCESS:0 "Landing Craft Acquired"
 CWIC_ESP_BOP_TITLE_11_FAILURE:0 "Only One Vessel Secured"
 CWIC_ESP_BOP_DESC_11_SUCCESS:0 "§Y4§! vessels have been bought through intermediaries and made ready for the landing."
 CWIC_ESP_BOP_DESC_11_FAILURE:0 "Only §Y1§! vessel could be secured this time."
 CWIC_ESP_BOP_TITLE_12_SUCCESS:0 "Landing Site Determined"
 CWIC_ESP_BOP_TITLE_12_FAILURE:0 "Infiltration Team Caught"
 CWIC_ESP_BOP_DESC_12_SUCCESS:0 "Our team has surveyed the coast and reported back. A landing site has been chosen."
 CWIC_ESP_BOP_DESC_12_FAILURE:0 "The team was caught on the island. Havana knows who sent them, and relations have suffered."
 CWIC_ESP_BOP_TITLE_13_SUCCESS:0 "Insurgents Inside Cuba Contacted"
 CWIC_ESP_BOP_TITLE_13_FAILURE:0 "Insurgents Cannot Be Reached"
 CWIC_ESP_BOP_DESC_13_SUCCESS:0 "The insurgents inside Cuba have agreed to rise when the brigade lands. The landing site has been moved to be within their reach, which improves the odds of the landing."
 CWIC_ESP_BOP_DESC_13_FAILURE:0 "The insurgent bands could not be reached. The landing will go in without support from inside the island."
 CWIC_ESP_BOP_TITLE_14_SUCCESS:0 "Operation Puma Strikes Cuban Airfields"
 CWIC_ESP_BOP_TITLE_14_FAILURE:0 "Operation Puma Fails"
 CWIC_ESP_BOP_DESC_14_SUCCESS:0 "The project's bombers have hit the Cuban airfields. The Cuban air force will be hampered for §Y90§! days."
 CWIC_ESP_BOP_DESC_14_FAILURE:0 "The raid did little damage and §Y2§! B-26 bombers were lost."
 CWIC_ESP_BOP_TITLE_15_SUCCESS:0 "Havana Demoralized"
 CWIC_ESP_BOP_TITLE_15_FAILURE:0 "Broadcasts Go Unheard"
 CWIC_ESP_BOP_DESC_15_SUCCESS:0 "Leaflets and broadcasts over Havana have shaken the government's supporters. Cuban stability and war support have fallen by §Y5%§!."
 CWIC_ESP_BOP_DESC_15_FAILURE:0 "The campaign over Havana had no visible effect."
 CWIC_ESP_BOP_TITLE_16_SUCCESS:0 "Diversionary Strikes Launched"
 CWIC_ESP_BOP_TITLE_16_FAILURE:0 "Diversionary Strikes Repelled"
 CWIC_ESP_BOP_DESC_16_SUCCESS:0 "The diversionary raids have drawn Cuban attention away from the landing site."
 CWIC_ESP_BOP_DESC_16_FAILURE:0 "The raids were beaten off and §Y2§! B-26 bombers were lost."
 CWIC_ESP_BOP_TITLE_17_SUCCESS:0 "The Brigade Holds Its Beachhead"
 CWIC_ESP_BOP_TITLE_17_FAILURE:0 "The Landing Fails"
 CWIC_ESP_BOP_DESC_17_SUCCESS:0 "The brigade is ashore and holding. Cuba is now at war with itself."
 CWIC_ESP_BOP_DESC_17_FAILURE:0 "The brigade has been destroyed on the beach. The failure is public, and it has cost the administration dearly while strengthening the government in Havana."
 CWIC_ESP_UIA_DESC_1_SUCCESS:0 "The commander of the insurgent army is dead. Resistance has weakened across the marked oblasts."
 CWIC_ESP_UIA_DESC_1_FAILURE:0 "The target slipped away before our men could close in. He remains at large."
 OPERATION_NATION_DESC_500:0 "Event: §YOperation Against Shukhevych§!"
 CWIC_ESP_UIA_DESC_2_SUCCESS:0 "The raid in [?slot_one_personnel_target.GetName] broke up the local bands. Resistance there has fallen and the population is more compliant."
 CWIC_ESP_UIA_DESC_2_FAILURE:0 "The bands in [?slot_one_personnel_target.GetName] were warned and scattered before the raid. Resistance there has grown."
 OPERATION_NATION_DESC_501:0 "Event: §YRaid Against the UIA§!"
 CWIC_ESP_UIA_DESC_3_SUCCESS:0 "The villages suspected of feeding the insurgents have been deported. Resistance has fallen sharply in the marked oblasts, at some cost to stability at home."
 CWIC_ESP_UIA_DESC_3_FAILURE:0 "The deportation was resisted and went badly. Resistance has grown in every marked oblast."
 OPERATION_NATION_DESC_502:0 "Event: §YDeportation Operation§!"
 CWIC_ESP_UIA_DESC_4_SUCCESS:0 "Our false leadership cells are in place and trusted. The cell networks in the Kiev and Vinnytsia oblasts can now be rolled up."
 CWIC_ESP_UIA_DESC_4_FAILURE:0 "The false cells were recognised for what they were. The attempt will have to be made again."
 OPERATION_NATION_DESC_503:0 "Event: §YFalse OUN Leadership Operation§!"
 CWIC_ESP_UIA_DESC_5_SUCCESS:0 "The militia cells in the Kiev oblast have been arrested."
 CWIC_ESP_UIA_DESC_5_FAILURE:0 "The arrests in the Kiev oblast were bungled and resistance there has grown."
 OPERATION_NATION_DESC_504:0 "Event: §YOperation Against the Kiev Oblast Cells§!"
 CWIC_ESP_UIA_DESC_6_SUCCESS:0 "The militia cells in the Vinnytsia oblast have been arrested."
 CWIC_ESP_UIA_DESC_6_FAILURE:0 "The arrests in the Vinnytsia oblast were bungled and resistance there has grown."
 OPERATION_NATION_DESC_505:0 "Event: §YOperation Against the Vinnytsia Oblast Cells§!"
 CWIC_ESP_UIA_DESC_7_SUCCESS:0 "The exile leader is dead. Resistance has weakened across the marked oblasts."
 CWIC_ESP_UIA_DESC_7_FAILURE:0 "The attempt failed and was traced to us. It has cost us political capital at home and standing in West Germany."
 OPERATION_NATION_DESC_506:0 "Event: §YOperation Against Bandera§!"
 CWIC_espionage_bop_air_strikes:0 "Airfields Under Attack"
 CWIC_espionage_bop_base_hosted:0 "Hosting a Training Base"
 CWIC_espionage_bop_base_exposed:0 "Base Arrangement Exposed"
 CWIC_espionage_bop_infiltrators_caught:0 "Infiltrators Caught"
 CWIC_espionage_uia_munich_incident:0 "Assassination Attempt on Our Soil"
