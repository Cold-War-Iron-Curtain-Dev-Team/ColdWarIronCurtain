l_english: 

 GDR_Political_Support_from_Moscow:0 "Support from Moscow"
 GDR_Political_Support_from_Moscow_desc:0 "The survival and legitimacy of the Republic depend on the continued backing of the Soviet Union."
 GDR_Secure_the_Politurbo:0 "Secure the Politurbo"
 GDR_Secure_the_Politurbo_desc:0 "Ensuring the loyalty of the Politburo is critical to maintaining stability within the Socialist Unity Party. We will take necessary steps to eliminate dissent and consolidate power within the leadership."
 GDR_Fears_of_a_German_Gomulka:0 "Fears of a German Gomulka"
 GDR_Fears_of_a_German_Gomulka_desc:0 "The specter of revisionism haunts the Party. If we do not wish to follow in the footsteps of Wladyslaw Gomulka, we must act decisively."
 GDR_Deepen_Ties_with_Moscow:0 "Deepen Ties with Moscow"
 GDR_Deepen_Ties_with_Moscow_desc:0 "Cloer ties with the Soviet Union will strengthen our economy, bolster our security, and advance the socialist cause. Let their be no doubt of our solidarity."
 GDR_Purge_Schirdewan:0 "Purge Schirdewan"
 GDR_Purge_Schirdewan_desc:0 "Karl Schirdewan's recent statements pose a risk to the unity of the Party. His removal is necessary to prevent the spread of revisionist sentiments within our leadership"
 GDR_Review_Prior_Political_Purges_Within_the_SED:0 "Review Prior Purges"
 GDR_Review_Prior_Political_Purges_Within_the_SED_desc:0 "The errors of the past must be acknowledged without undermining the Party's authority. A careful review of previous purges will allow us to restore trust where needed, and reaffirm discipline where required."
 GDR_Purge_the_Harich_Group:0 "Purge the Harich Group"
 GDR_Purge_the_Harich_Group_desc:0 "The intellectual subversion led by Wolfgang Harich threatens the ideological foundation of the Republic. We will dismantle his network and reaffirm the authority of Marxist orthodoxy."
 GDR_Expand_Combat_Groups_of_the_Working_Class:0 "Expand the Combat Groups of the Working Class"
 GDR_Expand_Combat_Groups_of_the_Working_Class_desc:0 "The proletariat must be armed not only with ideology but with force. We will expand the Combat Groups to help maintain order and defend against external aggression."
 GDR_Continue_Repression_and_Observation_of_Noted_Intelligenistia:0 "Continue Observation of Noted Intelligenistia"
 GDR_Continue_Repression_and_Observation_of_Noted_Intelligenistia_desc:0 "We have a list of names of notable intelligentsia who are dangerously close to committing subversive acts against the Republic. We will keep a close eye on them."
 GDR_Allow_Greater_Freedoms_for_the_Intelligenistia:0 "Greater Freedoms for the Intelligenistia"
 GDR_Allow_Greater_Freedoms_for_the_Intelligenistia_desc:0 "Controlled liberalization can serve to placate the intelligentsia without sacrificing Party control. Select freedoms will be granted to foster loyalty and innovation within ideological bounds."
 GDR_Appoint_Hilde_Benjamin_Minister_of_Justice:0 "Appoint Hilde Benjamin"
 GDR_Appoint_Hilde_Benjamin_Minister_of_Justice_desc:0 "Hilde Benjamin's unwavering commitment to socialism and her legal expertise make her the ideal candidate to uphold the law of and suppress reactionary elements."
 GDR_Expand_the_Stasi:0 "Expand the Stasi"
 GDR_Expand_the_Stasi_desc:0 "Our enemies multiply in the shadows. The Ministry for State Security must be strengthened to root out dissent, prevent sabotage, and ensure loyalty throughout the Republic."
 GDR_Increase_Pensions_and_Reform_Working_Hours:0 "Increase Pensions & Reform Working Hours"
 GDR_Increase_Pensions_and_Reform_Working_Hours_desc:0 "To advance the socialist cause and secure the loyalty of the working class, we must provide tangible benefits. Raising pensions and reforming work hours will boost morale and demonstrate the superiority of the socialist system."
 GDR_Emphasize_Military_Funding:0 "Emphasize Military Funding"
 GDR_Emphasize_Military_Funding_desc:0 "In these uncertain times, we must prioritize defence. Allocating additional resources to our armed forces will ensure readiness against both internal uprisings and external aggression."
 GDR_The_Partys_Policy_on_Church_Questions:0 "The Party's Policy on Church Questions"
 GDR_The_Partys_Policy_on_Church_Questions_desc:0 "Religion must be reconciled with socialism. We must adopt policies that turn faith into a tool for social harmony, not resistance agisnt the State."
 GDR_Introduce_Socialist_Marriage_Rites:0 "Introduce Socialist Marriage Rites"
 GDR_Introduce_Socialist_Marriage_Rites_desc:0 "Marriage must serve the goals of socialist construction. We will reform marriage policies to promote gender equality, economic productivity, and adherence to Party values."
 GDR_The_Military_Church:0 "The Military Church"
 GDR_The_Military_Church_desc:0 "Since the founding of the GDR, we have yet to establish chaplaincy within the military. Given our attempts to bring religion into the socialist fold, perhaps it is time to allow the army to seek spiritual guidance."
 GDR_Relax_Persecution_of_Junge_Gemeinde:0 "Relax Persecution of Junge Gemeinde"
 GDR_Relax_Persecution_of_Junge_Gemeinde_desc:0 "Strategic tolerance of the Junge Gemeinde will reduce international criticism and domestic unrest, while allowing us to monitor and subtly steer its direction."
 GDR_Continue_the_New_Course:0 "Continue the New Course"
 GDR_Continue_the_New_Course_desc:0 "The New Course promises economic reform and improved living standards. Continuing along this is the best way to secure the future of the GDR."
 GDR_Crackdown_on_the_Junge_Gemeinde:0 "Crackdown on the Junge Gemeinde"
 GDR_Crackdown_on_the_Junge_Gemeinde_desc:0 "The Junge Gemeinde is breeding disobedience among the youth. A decisive crackdown will reaffirm the authority of the Party and eliminate this source of religious subversion."
 GDR_End_the_New_Course:0 "End the New Course"
 GDR_End_the_New_Course_desc:0 "Reform has gone too far. The New Course has encouraged revisionism and emboldened our enemies. It is time to reassert strict ideological control and end this deviation."
 GDR_Ten_Commandments_of_Socialist_Morals_and_Ethics:0 "Ten Commandments of Socialist Morality & Ethics"
 GDR_Ten_Commandments_of_Socialist_Morals_and_Ethics_desc:0 "Through the Ten Commandments for the New Socialist Man, we will instill socialist virtues into every citizen, redefining morality through loyalty to the state, solidarity, and labor discipline."
 GDR_Unification_from_Above_Unification_from_Below:0 "Unification from Above, Unification from Below"
 GDR_Unification_from_Above_Unification_from_Below_desc:0 "True German unity can be achieved only through a dual process: state-led negotiation and grassroots socialist solidarity on both sides. Both approaches will be pursued to advance our cause."
 GDR_Come_to_Terms_with_Reality:0 "Come to Terms with Reality"
 GDR_Come_to_Terms_with_Reality_desc:0 "The Western model has taken root in the FRG. Rather than continue pursuing dreams of reunificaiton, we must focus on consolidation, survival, and influence through ideological and economic competition."
 GDR_Double_Down_on_the_Magnet_Theory:0 "Double Down on Magnet Theory"
 GDR_Double_Down_on_the_Magnet_Theory_desc:0 "By building a superior socialist society, we can 'magnetize' the West German population toward unification under our system. Rededication to this theory will shape our policies going forward."
 GDR_Responding_to_the_Godesberg_Program:0 "Responding to the Godesberg Program"
 GDR_Responding_to_the_Godesberg_Program_desc:0 "The SPD's abandonment of Marxism marks a betrayal of the working class. We must make the best of this situation."
 GDR_Arrest_Otto_Dibelius:0 "Arrest Otto Dibelius"
 GDR_Arrest_Otto_Dibelius_desc:0 "Bishop Dibelius has persistently undermined the socialist order. His arrest will neutralize a major religious agitator and demonstrate our intolerance for clerical interference."
 GDR_Tensions_Within_the_Western_SPD:0 "Tensions Within the Western SPD"
 GDR_Tensions_Within_the_Western_SPD_desc:0 "West Germany's SPD is fracturing. The failure of the Godesberg Program threatens to rip the party in half. This opportunity is too valuable to let slide."
 GDR_Covertly_Back_the_Left_SPD_Faction:0 "Covertly Back the Left SPD Faction"
 GDR_Covertly_Back_the_Left_SPD_Faction_desc:0 "By discreetly supporting the SPD's Marxist loyalists, we can revive class-conscious opposition within the FRG and increase the popularity of socialism among the people"
 GDR_Continue_Funding_the_Alliance_of_Germans_Party_for_Unity_Peace_and_Freedom:0 "Continue Funding the Bund der Deutschen"
 GDR_Continue_Funding_the_Alliance_of_Germans_Party_for_Unity_Peace_and_Freedom_desc:0 "The SPD has outlived its usefulness. Instead, we will focus all our efforts on the Bund der Deutschen and allocate more resources to them."
