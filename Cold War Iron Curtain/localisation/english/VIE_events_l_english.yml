l_english:
 # === Kingdom of Humanity ===
 HUM.1.t: "Southwark hosts its first Referendum"
 HUM.1.d: "Our great Kingdom of Humanity witnessed our first major political referendum, sparked by the growing Republican Movement led by Christopher Schroeder. This movement called for the establishment of a modern republic, arguing it would fulfill the original vision of our kingdom's founder, Captain James Georges Meads, who dreamed of an artificial nation open to all races and peoples from around the globe. Schroeder and his supporters challenged our current benevolent Meads Dynasty monarchy, advocating for a more inclusive, democratic system. The referendum has ignited debates across the Kingdom about our future direction and cultural identity."

 HUM.2.t: "Vietnamese Refugees spotted"
 HUM.2.d: "Amid the escalating violence of the Indochina War, a group of Vietnamese fishermen sought refuge in the Moroc-Songhrati Archipelago, petitioning King Morton I of the Kingdom of Humanity for asylum. Fleeing the dangers of the conflict, these fishermen appealed to the King for protection and the chance to start anew in the peaceful islands. Moved by their plight, King Morton I considered their request, recognizing the humanitarian need and the potential for integrating the refugees into the Kingdom's very small population. The event highlighted the Archipelago's growing role as a sanctuary amidst regional turmoil."

 VIE_Humanity.1.t: "Recognition of Moroc's \"Sovereignty\""
 VIE_Humanity.1.d: "Amidst the complicated geopolitical shifts in Southeast Asia our glorious leader Bao-Dai, has sought to assert our influence in the South China Sea recognizing the strategic importance of alliances and support from any established presence in the region has decided to recognize the Kingdom of Morac-Songhrati-Meads, also known as the Kingdom of Humanity. This was formalized in a small ceremony in Saigon with the attendance from King Morton I and a Vietnamese diplomat.\n\nThe recognition by the our state has provided the Kingdom of Morac-Songhrati-Meads with a semblance of legitimacy on the international stage. However, the recognition did little to change the practical control of the islands, as various other nations continued to dispute the territory."

 VIE_Humanity.2.d: "Amidst the complicated geopolitical shifts in Southeast Asia, the Vietnamese Government and their leader Bao-Dai, have recognized the the sovereignty and rightful claims of our great Kingdom of Humanity and our righteous cause of unifying all of humanity under the Meads Dynasty's enlightened rules.\n\nA small ceremony has been hosted in Saigon with the attendance from our wise King Morton I and the Vietnamese government. The recognition by the Vietnamese state has provided our kingdom with proper legitimacy and prestige on the international stage which we surely need to combat against other foreign colonizers!"

 VIE_Humanity.3.d: "Saigon, [?global.date.GetDateStringNoHourLong] - In a surprising yet surreal diplomatic move, the Vietnamese government, led by Emperor Bao-Dai, has formally recognized the sovereignty of the Kingdom of Moroc-Songhrati-Meads also known as the Kingdom of Humanity, a micronation claiming colonizing the long disputed Spratly Islands. The ceremony, held in Saigon, saw the attendance of King Morton I of the Meads Dynasty and Vietnamese officials.\n\nThis recognition grants the Kingdom of Humanity a degree of international legitimacy, bolstering its claims and efforts against other foreign colonizers in the region. The event underscores the complex geopolitical shifts in Southeast Asia, as Vietnam seeks to navigate and assert its influence amid competing territorial claims."

 VIE_Humanity.4.d: "In a disheartening turn of events, our King Morton F. Meads and the Kingdom of Humanity faced rejection from the Government of Vietnam , who declined to recognize our rightful sovereignty. Saigon cited that our nation lack of any \"historical or cultural ties\" and dismissing us as \"rich white colonizers of remote, uninhabitable islets\". Though disappointed, the Kingdom remains hopeful, viewing this as a temporary setback. Our King Meads and the people continue our quest for recognition, determined to build a legacy and establish our own sovereignty on the world stage, undeterred by this initial refusal."

 PHI_Humanity.1.t: "The \"Kingdom of Humanity\" Seeks Recognition from our Government"
 PHI_Humanity.1.d: "In a bold diplomatic move, the micronation \"Kingdom of Humanity\" and their \"King\" Morton Meads have officially sent a letter to our President, requesting recognition them as a sovereign nation. In exchange for this recognition, the Kingdom offered to acknowledge the our control over the oil reserves in the disputed EEZ region of the South China Sea. This offer marks their \"Kingdom\"'s  latest attempt to establish itself as a legitimate country, while also addressing ongoing regional disputes over valuable resources."

 PHI_Humanity.2.t: "Philippines Recognizes our country"
 PHI_Humanity.2.d: "In a monumental diplomatic breakthrough, our Kingdom of Humanity, led by our King Morton Meads, is overjoyed after receiving formal recognition from the Republic of the Philippines. For years viewed as a micronation, this recognition elevates the our small nation to a sovereign status on the global stage. The deal, in which our Kingdom acknowledged the Filipino's control over the contested oil fields in the South China Sea EEZ, has been hailed as a victory by King Meads. Our Kingdom now stands proud, with its sovereignty formally acknowledged by a real sovereign entity!"

 PHI_Humanity.3.t: "Philippines refused to recognize us!"
 PHI_Humanity.3.d: "In a disheartening turn of events, our King Morton F. Meads and the Kingdom of Humanity faced rejection from the President of the Philippines , who declined to recognize our rightful sovereignty. Manila cited that our nation lack of any \"historical or cultural ties\" and dismissing us as \"rich white colonizers of remote, uninhabitable islets\". Though disappointed, the Kingdom remains hopeful, viewing this as a temporary setback. Our King Meads and the people continue our quest for recognition, determined to build a legacy and establish our own sovereignty on the world stage, undeterred by this initial refusal."

 BRU_Humanity.1.t: "Illegal Colonists Seeks Recognition from the Sultan"
 BRU_Humanity.1.d: "In a bold diplomatic move, Morton Meads of the unrecognized micronation \"Kingdom of Humanity\" based in a few occupied atolls in the Spartly Archipelago has reached out to the Sultan of Brunei, offering recognition of our's rightful control over the contested oil fields in the disputed South China Sea Exclusive Economic Zone (EEZ). In return, Meads seeks formal recognition of their micronation from our sultan. The proposal aims to settle the long-standing maritime dispute and strengthen ties between the two nations, while securing our influence over the lucrative oil fields. Negotiations are expected to proceed with regional and international scrutiny."

 BRU_Humanity.2.t: "Brunei Recognizes our country"
 BRU_Humanity.2.d: "In a monumental diplomatic breakthrough, our Kingdom of Humanity, led by our King Morton Meads, is overjoyed after receiving formal recognition from the Sultan of Brunei. For years viewed as a micronation, this recognition elevates the our small nation to a sovereign status on the global stage. The deal, in which our Kingdom acknowledged Brunei's control over the contested oil fields in the South China Sea EEZ, has been hailed as a victory by King Meads. Our Kingdom now stands proud, with its sovereignty formally acknowledged by a real sovereign entity!"

 BRU_Humanity.3.t: "Brunei refused to recognize us!"
 BRU_Humanity.3.d: "In a disheartening turn of events, our King Morton F. Meads and the Kingdom of Humanity faced rejection from the Sultan of Brunei, who declined to recognize our rightful sovereignty. Brunei cited that our nation lack of any \"historical or cultural ties\" while dismissing us as \"mere hobos trying to take over remote, uninhabitable islets\". Though disappointed, the Kingdom remains hopeful, viewing this as a temporary setback. Our King Meads and the people continue our quest for recognition, determined to build a legacy and establish our own sovereignty on the world stage, undeterred by this initial refusal."

 # === Phu Dai Army - 1950s Events ===
 PQC_1950s.0.d: "Several days ago, the Sino-French Sima Treaty was negotiated and signed between He Zhuben, RoC General Hoang Kiet's Chief of Staff, and the Chief of Staff of the French colonial forces in Vietnam.\n\nThe treaty stipulated the process for the evacuation of Nationalist Chinese troops from China via Vietnam and the city of Haiphong, where they will surrender their weapons to the French authorities; who will be responsible for delivering them back to the Government of the Republic of China. As per the agreement, groups will be composed of 500 each, with priority given to fleeing women and children.\n\nHowever, strong condemnation by Zhou Enlai, Premier of the People's Republic of China, caused the French colonial authorities to reconsider their agreement, after Hoang's forces had already entered Vietnam. For a time, the Phu Dai Army, as it is known, was interned in camps around Haiphong, before the French authorities transported them to Phu Quoc Island, a largely undeveloped island under the control of Vietnam, where their fate is uncertain."

 PQC_1950s.1.d: "CONFIDENTIAL\n[GetDateText]\n\nSUBJECT: Futai (Phu Dai) Force Situation Report\n\nGeneralissimo,\n\nIt has come to the attention of the Ministry of National Defense that Nationalist forces are trapped on the lightly developed Vietnamese island of Fuguo, also known as Phu Quoc Island. As the result of an abortive agreement between our Government and the French colonial forces in Indochina, an army under the command of General Huang Jie is residing there currently, having been interned in Haiphong and subsequently exiled to the island.\n\nGeneral Huang has contacted us in the hope of receiving support from the Government. It may be in our best interest to support them and provide Huang's forces with more weapons, as their location in Phu Quoc is a strategic benefit for our hopeful strike against the traitorous Communist forces in the mainland.\n\nYour response to this update would be greatly appreciated."

 PQC_1950s.2.d: "Our government has learned that the Nationalist Chinese troops under General Hoang Kiet, also known as the Phu Dai Army, have abandoned the island of Phu Quoc where they were placed after the abandonment of the Sino-French Sima Treaty.\n\nAccording to reports, the Phu Dai Army was transported back to Taiwan, where they will be reintegrated into the Republic of China's Marine Corps. This is one less headache that our Government must deal with as we deal with more pressing matters at home."

 PQC_1950s.3.d: "According to internal and external reports, the Viet Nam Quoc Dan Dang, known as the VNQDD or simply Viet Quoc, has founded a republic on the island of Phu Quoc, off of our southern coast.\n\nReceiving assistance from Nationalist Chinese troops, known as the Phu Dai Army, stationed there, the VNQDD adheres to the same ideology as the Nationalist Chinese; mainly, the Three Principles of the People as was developed by Sun Yat-Sen.\n\nIt is unclear how our Government should respond immediately, but this is a serious issue and should be addressed with the utmost care and expediency."

 PQC_1950s.4.d: "According to reports from around the region, the nationalist Viet Nam Quoc Dan Dang, VNQDD or Viet Quoc, has founded a republic on the island of Phu Quoc, off the coast of South Vietnam.\n\nApparently receiving assistance from Nationalist Chinese troops, known as the Phu Dai Army, stationed there, the VNQDD adheres to the same Kuomintang ideology as the Taiwanese; known as the Three Principles of the People or Tridemism.\n\nRight now, it is unclear how our Government should respond, however, it appears the VNQDD remains diametrically opposed to communism, having come into conflict with our predecessor, the Indochinese Communist Party, in the years before the Second World War. We should observe and respond to the situation with the appropriate attitude and expediency required."

 PQC_1950s.5.d: "A dispatch has come in from our embassy in Saigon that the island of Phu Quoc of the coast of South Vietnam has declared itself a breakaway republic under the leadership of the VNQDD, a Nationalist Chinese and Vietnamese nationalist-aligned party. Allegedly receiving support from Nationalist troops who fled to the island after the Chinese Civil War, the Republic of Vietnam, as it is calling itself, is requesting that the United States recognize it as a sovereign state.\n\nOur ambassador and diplomatic staff in Saigon are signaling caution; this \"Republic\" seems to have come as a surprise to both North Vietnamese and South Vietnamese officials. Recognizing this state may come with costs, but also will legitimize a renewed Nationalist effort, as well as the spread of Tridemism throughout Southern Asia."

 PQC_1950s.6.d: "Good news has come from Washington and Saigon, as the US Ambassador confirms that our Republic has been recognized by the United States as a sovereign state. The Americans, being one of the first to recognize our government, have changed allegiances, previously recognizing the South Vietnamese government to our north as the rightful Vietnamese government.\n\nThis comes as a major victory for not only our foreign affairs, but in our domestic affairs. Now with US recognition, we are able to receive many benefits and our nation will continue to grow!"

 PQC_1950s.7.d: "Unfortunately, the American Ambassador in Saigon has communicated that the US State Department has rejected a request for recognition of our government. It appears that the Americans continue to recognize the Vietnamese government in Saigon, as opposed to our VNQDD government, and all attempts to become friendly with the US has been rebuffed."

 PQC_1950s.8.d: "Shock echoed around the world today as the United States announced the recognition of the VNQDD-led Republic of Vietnam as the rightful Vietnamese government in the region.\n\nOriginally supporting the Vietnamese government located in Saigon, the Americans have changed their tune to the VNQDD government, mostly composed of Vietnamese nationalists and Nationalist Chinese soldiers, located on Phu Quoc Island off the coast of southern Vietnam. Being closely aligned to the Kuomintang in terms of ideology and geopolitical relations, the VNQDD appears to be the new contender in the geopolitical situation surrounding Indochina."

 # === South Vietnam - 1950s Events ===

 # -- Country Events --

 # Mechanics
 VIE_Mechanics.1.t: "Our New Territories"
 VIE_Mechanics.1.d: "Despite the recent unification of Annam and Cochinchina under one government, many areas still face unrests from the Viet-Minh cells across the provinces. As the leader of Vietnam, it is our job to maintain order and placate the populace through both military and diplomatic means. If we do not pacify the provinces of Vietnam, then more Viet-Minh cells will rise up against us."
 VIE_Mechanics.1.a: "Piece by piece, we will unite our nation under [VIE.GetLeader]"

 VIE_Mechanics.2.t: "The Sect Question"
 VIE_Mechanics.2.d: "Cochinchina answers to the Central Government on the map. Outside Saigon it answers to five men, and each of them has soldiers, revenue and a province.\n\nHuynh Cong-Bo holds the Hoa-Hao country. Pham Cong-Tac holds Tay-Ninh and the Cao-Dai with it. Jean Leroy has the Catholic delta through the UMDC. Thich Hoa-Binh leads the Harmonists. And Le Van-Vien and the Binh-Xuyen hold the approaches to the capital, the river traffic, and a good deal that goes on inside Saigon itself.\n\nNo Vietnamese government has ever governed the south without settling with them or breaking them, and there is no third road. We may bring them in - offer rank, budget and standing, and accept that our army will contain armies. Or we may take their weapons, and find out how many of the five are prepared to fight us for them."
 VIE_Mechanics.2.a: "The unity of our nation has come down to this."

 # Political

 # Elysee Accords
 Elysee_Accords.1.t: "The Elysee Accords"
 Elysee_Accords.1.d: "At the Elysee Palace in the distant land of France, a historic agreement has been reached that will forever change the future of the millions of citizens within our territory. Our young nation recognized internationally as the State of Vietnam shall be granted greater independence from France within the multi continental system of the French Union, a momentous accomplishment that was the culmination of months of hard work by our Head-of-State Bao-Dai. The Elysee Accords will now move to the French National Assembly, to be officially ratified and signed by the French president.\n\nThe accords stated that Vietnam could now conduct its own foreign affairs, control its finances and have an army. Specifically, we were granted the right to appoint diplomats to China, Thailand, and the Vatican City, but the remainder of our foreign policy will remain under French guidance. Some may decry this as falling short of granting complete independence, but the matter of fact is that this was the best we could have got, especially in such turbulent times where pushing our French benefactors away would be complete suicide."
 Elysee_Accords.1.a: "Slow and steady wins the race."

 Elysee_Accords.2.t: "The Second Article of the Elysee Accords"
 Elysee_Accords.2.d: "The Accords have given us a sliver of independence, and it is worth being precise about how thin the sliver is. We may appoint diplomats to the Republic of China, to Thailand and to the Vatican City. That is the entirety of our foreign service.\n\nTwo of the three are neighbours, which is not nothing. Border questions, refugees and the trade along the Mekong can now be settled between governments rather than between colonial administrations, and a state that negotiates in its own name begins to look like a state whatever the Quai d'Orsay chooses to call it.\n\nWhat cannot be pretended is that the arrangement was generous. The French remain our benefactors and, with the communist North where it stands, our protection besides, and there is no version of the next few years in which we push them away and survive the pushing. A day may come when we treat with the great powers as equals rather than as somebody's ward. It is not this day, and every man who has read the text knows it."
 Elysee_Accords.2.a: "What they call a Bao-Dai solution turned out to be just a French solution."

 # CCC Unification Choices
 CCC_Unification_Choices.1.t: "Bao-Dai's Visit to Saigon"
 CCC_Unification_Choices.1.d: "The Chief of State landed in Saigon this morning after the short flight down from Da-Lat, and the arrival was itself half the message. Bao-Dai has chosen to lead the negotiations with Cochinchina in person rather than through a delegation, and he arrives with considerable French backing behind him.\n\nThe ground was prepared in Paris. The Assembly's recent bill removing Cochinchina from the status of direct French territory and attaching it to the State of Vietnam settles in law what our negotiators have been arguing for two years, and it leaves the former emperor holding a position comfortable enough to be spent.\n\nWith all of that behind him, Bao-Dai guided the talks that followed..."
 CCC_Unification_Choices.1.a: "...with great amicability, offering as much concession as possible."
 CCC_Unification_Choices.1.b: "...with shrewd diplomacy and compromise, ensuring that nobody leaves unsatisfied."
 CCC_Unification_Choices.1.c: "...with assertiveness and confidence, for he had the upper hand."

 CCC_Unification_Choices.2.t: "Bao-Dai's Declaration to the Nation"
 CCC_Unification_Choices.2.d: "A proclamation written personally by the Chief of State took the front page of every major newspaper this morning: an appeal for peace and unity among his people, and an announcement of the plans for unification with Cochinchina.\n\nThe presses could not keep pace with it. Copies went from the stalls faster than they could be replaced, and by the middle of the morning the text was being read aloud on street corners to people who had not managed to buy one.\n\nThe verdict took the rest of the day to settle, as verdicts of this kind do. What the readers of Saigon eventually agreed upon was that the former emperor's writing had been rather..."
 CCC_Unification_Choices.2.a: "...tactful and polite, calling for solidarity above all else"
 CCC_Unification_Choices.2.b: "...aggressive and uncompromising, stating that the nation would be united no matter the cost."

 # CCC Unification
 CCC_Unification.1.t: "Plead France for Vietnamese Unification"
 CCC_Unification.1.d: "Our efforts to bring the \"Republic\" of Cochinchina into the union by agreement have failed. Relations between General Nguyen-Van-Xuan and the Chief of State are warm enough in public and have produced nothing whatever in private, because the two men cannot arrive at a solution while one of them does not want one.\n\nThat is the reading in the palace. Xuan is thought to be holding out for a different leader, or at the least for a different arrangement, and to be spinning the negotiations out until one or the other becomes available. There is no sign he means to break them off - only that he means never to conclude them.\n\nBao-Dai has therefore decided to appeal to the French directly, and their pressure will very probably bring the holdouts to the table, since Xuan's position rests entirely on French money and French goodwill. It will also mean that the unification of Vietnam was accomplished by a French instruction. Every man in Saigon will know it, and the purity of the victory will not survive the knowing."
 CCC_Unification.1.a: "Lets hope for the best."

 CCC_Unification.2.t: "Bao-Dai Requests Unification with Cochinchina"
 CCC_Unification.2.d: "Bao-Dai has come to the end of his own resources and has asked us to unify his country for him. It is not the first such request, and as usual the bark has proved rather worse than the bite.\n\nThe obstruction is Nguyen-Van-Xuan, which is convenient. Xuan is our man in every sense that matters, and a certain amount of pressure applied in the right quarter would very probably bring him round. A unified Vietnam might even begin carrying some of its own weight in this struggle, which would take a measure of the load off our own boys in the delta.\n\nThe real question is not Cochinchina at all. It is whether we go on propping up a Chief of State whose authority has to be topped up by us every few months, or whether the moment has come to look about for fresh blood."
 CCC_Unification.2.a: "We'll think about it."

 CCC_Unification.3.t: "France Requests Unification with Bao-Dai"
 CCC_Unification.3.d: "A second request has arrived, this one from the French government, urging us to unite with Bao-Dai's administration. It carries a good deal more weight than the first did.\n\nWe may accede to it on terms, making unification conditional on undertakings Bao-Dai would have to give and afterwards keep. Or we may decline, and remain an autonomous republic with our own assembly and our own administration, as we have been since the war ended.\n\nThe cost of declining ought to be stated plainly in this chamber rather than left to be discovered later. Bao-Dai wants Cochinchina and he has an army. If we refuse the French request, we lose along with it the French objection to his using that army."
 CCC_Unification.3.a: "May we build a strong Vietnam, together."
 CCC_Unification.3.b: "We shall stand our ground."

 CCC_Unification.4.t: "Cochinchina Agrees to Unify!"
 CCC_Unification.4.d: "The Autonomous Republic of Cochinchina has ceased to exist. Its territory is now integral provinces of the State of Vietnam, and our diplomatic office in Saigon is being dismantled as the announcement goes out - there is nothing left in that city for a diplomat of ours to do.\n\nThe Chief of State is reported to be personally elated, which those who know him say is not a word that often applies. There has been considerable celebration in the streets, some of it organised and a great deal of it not.\n\nThis matters beyond the map. Every argument made against this government since its founding has rested on the claim that it does not really govern Vietnam, only those parts of it France has not reserved to itself. That claim is weaker this evening than it was this morning, and the men who make it will have to find another."
 CCC_Unification.4.a: "Slowly but surely, Vietnam becomes one again."

 CCC_Unification.5.t: "Cochinchina Refuses Unification!"
 CCC_Unification.5.d: "Cochinchina has refused. Our diplomatic office in Saigon will be staying open rather longer than anyone intended, because the reply from the representatives of the Autonomous Republic was not a counter-offer but a rejection, and it was phrased for publication. They will not submit, they say, to the authority of \"the incompetent fools of the State of Vietnam\".\n\nBao-Dai was told at once and is reported to have left his apartments without a word to anyone, to telephone the French and demand immediate intervention. Nothing has come back from the High Commission, which is itself an answer of a sort.\n\nThe streets did not wait for the government to compose a statement. Crowds have been forming downtown all afternoon, and what they are shouting about is not Cochinchina but us - a government that announced unification before it had secured it. The claim to speak for all Vietnam has been publicly refused by Vietnamese, and no communique will repair that quickly."
 CCC_Unification.5.a: "We are divided, but not for long."

 CCC_Unification.6.t: "A Plead from Bao-Dai"
 CCC_Unification.6.d: "Bao-Dai has written again about Cochinchina. The talks between Saigon and his government have gone the way of all the others, and he asks us once more to unify the two under a single administration in the name of Vietnamese stability.\n\nHis persistence is wearing and his case is not a bad one. A divided south means two treasuries, two administrations and two sets of officers to be argued with, and we are conducting a war through both of them.\n\nGiven the state of the campaign, the Ministry's view is that we should do as he asks and persuade Cochinchina into the union - firmly, and without leaving fingerprints on it. Whatever emerges will at least be a single Vietnamese government, and it will be friendly to us."
 CCC_Unification.6.a: "Cochinchina has played around for too long, let's end this peacefully now."

 CCC_Unification.7.t: "A Final Ultimatum"
 CCC_Unification.7.d: "The French have delivered their final word on unification, and it is not a request. We are to join Bao-Dai's government, because Bao-Dai has told them he will take Cochinchina by force if we do not come peacefully, and they have decided not to stop him.\n\nWe may accept. Unification on his terms keeps the peace between Vietnamese, leaves our administrators in their posts under a different flag, and ends the argument that has consumed this republic for four years.\n\nOr we may refuse, and hold what we hold. The council should understand precisely what the French note says between its lines before it votes: if Bao-Dai marches, they will not come. Whichever way we decide, we decide alone."
 CCC_Unification.7.a: "Maybe it is for the best."
 CCC_Unification.7.b: "Our decision is final, we shall not bow to Bao-Dai!"

 CCC_Unification.8.t: "Cochinchina Submits!"
 CCC_Unification.8.d: "It is natural that our glorious leader Bao-Dai would attract Cochinchina to the State of Vietnam. General Nguyen-Van-Xuan has great respect, as he should, for the hegemony of Bao-Dai over all of Vietnam is just, promising, and natural. Bao-Dai is the greatest leader our nation ever had, in its thousands of years of history. His diplomatic skills, economic acumen, and commanding personality means he is unstoppable, and will surely crush the northern communist threat.\n\nThe unification of Cochinchina with our Central Provisional Government will lead us to unequivocal greatness. Nguyen-Van-Xuan understands that under a superior centralised government, we can defeat the communists and bring about a proper modern Vietnamese state."
 CCC_Unification.8.a: "We Are One at Last..."

 CCC_Unification.9.t: "Cochinchina Refuses Again!"
 CCC_Unification.9.d: "General Nguyen-Van-Xuan has refused again. He will not bring his occupied Cochinchina into union with the rest of the country, and his refusal was published in terms plainly written to be quoted. That a Vietnamese should decline to stand with Vietnamese against the communists of the north will be a stain on this country for years.\n\nHis stated ground is that our former king is unfit to rule, on account of what the Saigon papers delicately call the controversies. Bao-Dai carries the weight of a nation on his back. It is neither a surprise nor a crime that a man so burdened should take his pleasures where he finds them, and it is certainly no reason for a general to hold an entire region out of the state.\n\nFrom a French sympathiser this is exactly what should have been expected: greed dressed as principle, and appetite for power presented as caution. The people will see it for what it is, and so will the world, and both will understand why the authority of the Chief of State must extend over the whole of Vietnam."
 CCC_Unification.9.a: "South Vietnam shall be united, once and for all!"

 CCC_Unification.10.t: "Bao-Dai Takes Over Cochinchina!"
 CCC_Unification.10.d: "Recently, Bao-Dai has arrived in Saigon to demonstrate that he has unified Cochinchina and Annam under his government. While this means that Cochinchina is lost to us for now as our troops are outnumbered by the French and their lackeys, we must not give up our dream on reunifying Vietnam. We must not stop this war until Vietnam is liberated from the imperialist!"
 CCC_Unification.10.a: "Let us not lose hope, this is just the beginning."

 # CCC Political Events
 CCC_Pol.1.t: "The Question of Identity"
 CCC_Pol.1.d: "Now that our constitution is written, Cochinchinese leaders must resolve the central debate: do we stand as Nam-Ky, the distinctive culture of the Mekong and Saigon, or do we claim to be the Quoc-Gia standard-bearers for all Vietnam?"
 CCC_Pol.1.a: "We are Nam-Ky, a people apart."
 CCC_Pol.1.b: "We are the true Vietnamese nationalists."

 # CCC Dan-xa Party Events
 CCC_DanXa.1.t: "The Dan-xa Coup"
 CCC_DanXa.1.d: "Inspired by the Venerable Huynh-Phu-So of the Hoa-Hao Buddhist Faith, the Dan-xa Party - the Vietnamese Democratic Socialist Party - has launched a bold coup against Bao-Dai's government. Drawing upon popular anti-colonial sentiment and a vision of national liberation grounded in Buddhist ethics and social justice, the Dan-xa forces have successfully seized control of Cochinchina. The coup declares independence from both French colonialism and Marxist communism, proclaiming a third path: a moral revolution rooted in human dignity and Buddhist-inspired governance."
 CCC_DanXa.1.a: "The people have spoken - embrace this new dawn."
 CCC_DanXa.1.b: "The coup succeeds, but the struggle has only begun."

 CCC_DanXa.2.t: "The Dan-xa Resistance War"
 CCC_DanXa.2.d: "The Dan-xa Party's seizure of power has plunged Cochinchina into a three-way struggle: the French colonial military, the communist Viet-Minh, and the Dan-xa forces themselves. Locked in armed conflict on multiple fronts, the Dan-xa resistance movement mobilizes its followers - Buddhist monks, peasant militias, and guerrilla fighters - in defense of their vision of an independent, morally-centered Vietnam. The war drains resources but rallies the population behind the banner of national liberation."
 CCC_DanXa.2.a: "Mobilize the people - victory lies in struggle."
 CCC_DanXa.2.b: "The war is costly but necessary for our survival."

 # FUL Unification - Integration
 FUL_Unification.1.t: "Montagnard Country Ratifies Du-So 6/QT/TG"
 FUL_Unification.1.d: "The Ministry of Overseas France has transferred authority over the Trung-Phan Highlands from the Autonomous Montagnard Country to [VIE.GetNameDef]. On paper the plateau is ours.\n\nThe Chief of State has not folded it into the ordinary administration. By \"Du-So 6/QT/TG\" he has detached the Trung-Phan Highlands from the ministries altogether and constituted them the Domain of the Crown: a separate legal order inside the State of Vietnam, held as his personal possession. Within its boundaries he is not Chief of State but Emperor, and both titles now rest on the same man in the same country.\n\nIt is a neat answer to a problem nobody else had solved. It is also an arrangement under which the highlands answer to a person rather than to a state, and the men who drafted it in Da-Lat understand quite well that a person is easier to replace than a constitution."
 FUL_Unification.1.a: "Another toast to our Chief of State and the Quoc-Gia Solution!"

 FUL_Unification.2.t: "France Reestablishes Colonial Rule Over the Montagnards"
 FUL_Unification.2.d: "Leon Pignon, at the head of the French High Committee in Indochina, has proclaimed a Montagnard Republic in what was until this morning the Trung-Phan Highland Crown Domain.\n\nHe made the announcement from the Mayoral Palace in Da-Lat. The argument was that the montagnard peoples require protection - of their development, of their distinctive culture, of their security - against Vietnamisation, against colonisation, and against the instability produced by the recent change of regime in the south.\n\nRead that list a second time. A French High Commissioner, standing in a French hill station, has declared that the montagnards must be shielded from colonisation and has proposed to do the shielding himself. The Domain was ours by a decree Paris drafted and Paris ratified. It has been taken back with a speech."
 FUL_Unification.2.a: "How ironic... we will issue a notion of protest against the French Government."

 FUL_Unification.3.t: "Request Dominion Over the Trung-Phan Highlands"
 FUL_Unification.3.d: "The Emperor and Parliament have telegraphed Paris directly with \"Du-So 1/HD/CN-TP\", requesting authority over the territory of the Autonomous Montagnard Country.\n\nThe legal ground was laid years ago. France delegated the management of the Central Highlands to the former Provisional Central Government in May 1949, and Bao-Dai converted the delegation into the Crown Domain by Du number 6/QT/TG in April 1950. Nam-Hung's position is that both instruments were de jure and nothing further. The montagnards went on governing themselves, went on refusing the new government, and in several districts went on doing rather worse than refusing.\n\nThe telegram names those districts. It names Dinh-Nup, and it sets out the raids on Kinh and other settled villages that have been laid at the door of montagnard bands working alongside the Viet Minh. Whether Paris accepts the account or not, the request has been framed in the language of security rather than of sovereignty, and security is the only language the Ministry of Overseas France is currently reading."
 FUL_Unification.3.a: "We hope they will grant us our rightful authority over this untamed land."

 FUL_Unification.4.t: "[VIE.GetLeader] Requests Dominion Over the Trung-Phan Highlands"
 FUL_Unification.4.d: "Cuong-De's new government has telegraphed us directly with \"Du-So 1/HD/CN-TP\", requesting authority over the territory of the Autonomous Montagnard Country.\n\nThe matter was, we had supposed, settled. We delegated the administration of those regions to Bao-Dai's government in May 1949, and the delegation was ratified by Du number 6/QT/TG in April 1950. Phu-Xuan contends that the arrangement was de jure only: that the montagnards remained effectively independent throughout, that they have opposed the administration ever since, and that some among them are actively assisting the Viet Minh in raids on our plantations in the region.\n\nThe uncomfortable part of the telegram is that it is broadly accurate. The question before the Ministry is therefore not whether the Emperor is right about the highlands, but whether we would sooner hold a plateau we cannot police, or hand it to a government we neither chose nor wanted."
 FUL_Unification.4.a: "We prefer to keep the Montagnards regions under our rule for the foreseeable future."
 FUL_Unification.4.b: "Very well, we will hand over authority."

 FUL_Unification.5.t: "France Denies Our Dominion over the Trung-Phan Highlands"
 FUL_Unification.5.d: "The Ministry of Overseas France has refused \"Du-So 1/HD/CN-TP\". Authority over the Trung-Phan Highlands stays in Paris, and the reason offered is the safety of French settlements and plantations in the region.\n\nThat is the published reason. What our own people on the plateau report is that the French and montagnard Security Battalions stationed there - detachments of a few hundred men a month ago - have been expanded rapidly and pushed out into new posts since the refusal was drafted. The official justification for the reinforcement is the prevention of further Viet Minh and montagnard terrorism.\n\nA government intending only to protect its planters does not need fresh garrisons in districts where no planter has ever set foot. Paris has decided to hold the highlands, and it has decided to hold them against us quite as much as against anybody else."
 FUL_Unification.5.a: "That's only an excuse. It is OUR rightful land..."

 FUL_Unification.6.t: "France Approves Our Dominion over the Trung-Phan Highlands"
 FUL_Unification.6.d: "The Ministry of Overseas France has approved \"Du-So 1/HD/CN-TP\". Authority over the Trung-Phan Highlands passes to this government immediately, and the transfer is unconditional in every respect save one.\n\nThe French and montagnard Security Battalions remain where they stand, for the foreseeable future, to prevent further Viet Minh and montagnard terrorism. Nobody has defined the foreseeable future, and nobody has said who commands those battalions once the administration is ours. The question will have to be asked, and it will not be asked this week.\n\nThe Emperor has already issued a Du establishing an autonomous administration on the plateau, and the Kien-Quoc Quan begins moving up the highland roads at once. What we have obtained is a title deed. What we do not yet have is the plateau."
 FUL_Unification.6.a: "The deed is signed - now for the ground"

 # NUN Unification - Integration
 NUN_Unification.1.t: "Bao-Dai Demands Our Submission"
 NUN_Unification.1.d: "The Ministry of Overseas France has transferred authority over the ethnic autonomous regions of the Central Highlands and the Upper South to the National Government of Vietnam. It did not consult us, and it did not consult the chiefs.\n\nBao-Dai has not administered the transfer so much as pocketed it. By Du So 6/QT/TH he has detached the Central Highlands from the ordinary administration altogether and constituted them as the Hoang-Trieu Cuong-Tho, the Crown Domains. Within them he is not Chief of State but Emperor, ruling personally, and our districts are his fief.\n\nParis has promised in writing to grant and to protect our independence from Vietnam once the war against the communists is finished. Saigon has now sent a telegram demanding our submission on the strength of a decree Paris allowed him to issue. Both statements cannot be true, and we are required to answer the one that arrived first."
 NUN_Unification.1.a: "We'll comply as long as their promise of freedom is kept."
 NUN_Unification.1.b: "The French have promised us the right to defend our independence!"

 NUN_Unification.2.t: "The Nung Accept"
 NUN_Unification.2.d: "After careful consideration, the Nung leadership has decided to accept Bao-Dai's terms and submit to the Crown Domains arrangement. While this represents a significant compromise of their autonomy, the Nung leaders have concluded that cooperation with the Vietnamese government is preferable to confrontation, especially given the ongoing communist threat and the promise of protection from France.\n\nThe integration process will begin immediately, with the Nung territories being incorporated into the State of Vietnam as an autonomous region. The Nung will maintain some degree of self-governance, but ultimate authority will rest with Bao-Dai as both Head of State and Emperor of the Crown Domains.\n\nThis decision has been met with mixed reactions among the Nung population. Some see it as a pragmatic choice that ensures their security, while others view it as a betrayal of their independence. However, the leadership's decision stands, and the Nung will now be part of the larger Vietnamese state structure."
 NUN_Unification.2.a: "A new chapter begins for the Nung people."

 NUN_Unification.3.t: "The Nung Refuse"
 NUN_Unification.3.d: "The Nung leadership has firmly rejected Bao-Dai's demand for submission. Citing the French government's earlier promises of independence and protection, the Nung have declared their intention to maintain their autonomy and resist integration into the Crown Domains.\n\nThis refusal represents a significant challenge to Bao-Dai's authority and his plans for consolidating control over the ethnic regions. The Nung decision sends a clear message that they will not be easily subjugated, even in the face of pressure from the central government.\n\nThe consequences of this refusal remain uncertain. Will Bao-Dai attempt to force the issue through military means, or will he seek a diplomatic solution? The Nung have made their position clear, and the ball is now in the Vietnamese government's court."
 NUN_Unification.3.a: "We will not stand for this."

 # Etat du Vietnam
 Etat_du_Vietnam.1.t: "A Cooperative South Vietnam"
 Etat_du_Vietnam.1.d: "Bao-Dai has carried Saigon by negotiation rather than by force. Cochinchina and Annam are joined under one government, and that government is ours: the State of Vietnam, the Etat du Viet-Nam, with the Chief of State at its head.\n\nIt is worth being clear about what has been unified. A colonial administration that answers to Paris on every question that matters. Religious militias that hold provinces and levy their own taxes. Bandit bands in the delta that nobody has counted. And a communist insurrection running the length of the country, from the Chinese border to the mangrove.\n\nThe Chief of State intends to build on this rather than rest on it. The remaining Crown domains are to be brought under the same government, and every province recovered is an argument he can put to Paris for a further measure of autonomy. The communists are the other half of the argument, and they are the half that will not be settled at a conference table."
 Etat_du_Vietnam.1.a: "After everything, South Vietnam is united once more!"

 Etat_du_Vietnam.2.t: "A United South Vietnam"
 Etat_du_Vietnam.2.d: "Bao-Dai marched into Saigon at the head of his soldiers, and Cochinchina was joined to Annam under one government. It is done, and the manner of the doing will be remembered: the State of Vietnam, the Etat du Viet-Nam, was proclaimed over a city that had to be entered rather than persuaded.\n\nIt is worth being clear about what has been unified. A colonial administration that answers to Paris on every question that matters. Religious militias that hold provinces and levy their own taxes. Bandit bands in the delta that nobody has counted. And a communist insurrection running the length of the country, from the Chinese border to the mangrove.\n\nThe Chief of State means to go on. The remaining Crown domains are to be brought under the same government, and every province recovered is an argument he can put to Paris for a further measure of autonomy. Whether a state that began this way can ask its provinces for anything other than obedience is a question for later, and it will be asked."
 Etat_du_Vietnam.2.a: "After everything, South Vietnam is united once again..."

 Etat_du_Vietnam.3.t: "Recognize Bao-Dai's New Regime?"
 Etat_du_Vietnam.3.d: "Bao-Dai has taken Cochinchina and proclaimed the State of Vietnam, and the question of recognition is now on this desk rather than on somebody else's.\n\nRecognising him buys us diplomatic relations with a government that at least exists, an anti-communist partner in a region where we are short of them, and a foothold in Indochina that does not depend entirely on asking Paris for permission. Those are not small things.\n\nThe reservations are equally plain. The state is weeks old, its writ stops where the French garrisons stop, and the man at the head of it has a reputation that our own press will not be kind about. Recognition is easy to grant and very difficult to withdraw, and whatever this government becomes, we will be recorded as having endorsed it first."
 Etat_du_Vietnam.3.a: "A toast, to our new anti-communist allies!"
 Etat_du_Vietnam.3.b: "Let's keep things open for now."

 Etat_du_Vietnam.4.t: "Bao-Dai Declares Us \"Demonic Communists\"!"
 Etat_du_Vietnam.4.d: "Unsurprisingly, Bao-Dai has declared us as \"Demonic Communists\" that needs to be wiped from the Earth as soon as possible. We decided to scoff at his words considering his status as nothing more than a French lackey oppressing the people. We must continue on our goal of liberation of Vietnam from North to South from the imperialist power once and for all."
 Etat_du_Vietnam.4.a: "He'll get what's coming to him."

 Etat_du_Vietnam.5.t: "Nguyen-Van-Xuan Is Elected Deputy Prime Minister of the State of Vietnam"
 Etat_du_Vietnam.5.d: "Cochinchina and Annam are joined without a shot fired, and the first appointment of the new state ought to say something about how it means to govern. Nguyen-Van-Xuan is the name before the assembly.\n\nHe ran Cochinchina and he ran it competently, which is more than can be said for most of the administrations this country has had. Elevating a man of that record - and doing it by a vote rather than a decree - is the clearest signal available to Washington and London that the State of Vietnam intends to be a government and not a household.\n\nThere is a colder reason as well. Xuan led the Autonomous Republic until a fortnight ago and its officials are still his officials. Cochinchina will be a great deal easier to hold with him inside the cabinet than outside it, and everyone who will vote for him understands as much."
 Etat_du_Vietnam.5.a: "A useful ally."

 Etat_du_Vietnam.6.t: "Bao-Dai Remains as the Sole Prime Minister of the State of Vietnam"
 Etat_du_Vietnam.6.d: "Cochinchina and Annam are joined, and no second name has been put forward. Bao-Dai holds both offices himself until the next election, whenever that is called.\n\nWhat this buys is consistency. There will be no cabinet quarrel over the communists, no minister briefing against the palace, and no ambiguity abroad about who speaks for Vietnam. A state a fortnight old can make good use of all three.\n\nWhat it costs is that everything now attaches to one man, including the parts of him the country talks about. The Chief of State's manner of living is discussed in every market in Saigon and printed in Hanoi, and a government with no other face to show has no way of separating itself from him. He will have to be careful in a way he has never previously had to be."
 Etat_du_Vietnam.6.a: "Let's hope he can keep things under control."

 # Bao-Dai
 BaoDai.1.t: "A Gift to Le-Van-Vien"
 BaoDai.1.d: "The Emperor has raised Le-Van-Vien to Baron of the Royal Family, in recognition of long and increasing support. The support is not in dispute. The nature of it is the part the citation declines to go into.\n\nVien commands the Binh-Xuyen, which is to say a private army of some thousands operating with no reference whatever to the general staff, and he owns one of the largest casinos in Southeast Asia. It is at that casino that the Emperor's obligations to him have accumulated - the losses at the tables, and the arrangements made afterwards on behalf of a sovereign whose appetites are not confined to cards.\n\nThe barony is not the end of it. Vien's younger brother has been adopted by the Emperor personally, and Vien himself is promised a full generalship in the army of the State of Vietnam. A gangster is being turned into a general and into a relation, and the whole transaction has been conducted in the open."
 BaoDai.1.a: "A good friend is hard to find these days."

 BaoDai.2.t: "Da-Lat, The Summer Capital"
 BaoDai.2.d: "Da-Lat is the most agreeable town in Vietnam, and everyone who can afford to go there says so. The French built it for the climate - temperate where the rest of the country is tropical - and the mists that sit in its valleys the year round earned it the name City of Eternal Spring.\n\nWhat it does not have is working infrastructure. The water, the power and the roads were laid for a hill station of a few hundred colonial families and have been extended by patching ever since, with the result that the Summer Capital loses its electricity rather more frequently than the Royal Family finds acceptable.\n\nThe Emperor has therefore decreed a complete revamp: modern services throughout, and current in every building that matters. The work will be handsome and it will be expensive, and it will be carried out in a town where nobody governs anything for eight months of the year."
 BaoDai.2.a: "The City of a Thousand Flowers arrives in the modern era."

 BaoDai.3.t: "Saigon, Pearl of the Orient"
 BaoDai.3.d: "Saigon was the pride of French Indochina and is the capital of our state, and those two facts sit awkwardly together in every street of it. The Pearl of the Orient was built to be looked at by people arriving from somewhere else.\n\nThe Emperor has declared an extensive reformation of the city: the fabric brought up out of historical antiquity to a modern standard, and the whole given a Vietnamese character rather than a borrowed one. The intent is that a visitor stepping off a ship should see a capital, and not a colonial concession that has changed hands.\n\nThere is a calculation behind the decoration and the ministries have not troubled to disguise it. Foreign investment follows confidence, confidence follows appearances, and a country asking the world to take its independence seriously does well to look like a place where money would be safe."
 BaoDai.3.a: "The Pearl shines as bright as ever."

 BaoDai.4.t: "The Manifesto of Ngo-Dinh-Diem"
 BaoDai.4.d: "On [?global.date.GetDateStringNoHourLong], a significant development unfolded as the French Secret Police, known as \"Xac-Te,\" directly contacted our government to deliver a grave warning about the peril posed by Ngo-Dinh-Diem, whom they branded a traitor. Their concerns centered on Diem's latest manifesto, which had just been published in our newspapers. This piece contained deeply unsettling and radical ideas, with the apparent intent of sowing the seeds of rebellion among our populace, urging them to rise against both our fledgling government and our French benefactors.\n\nThe Chief of Security at Xac-Te emphasized that prompt action should have been taken to remove Diem from the equation, underscoring the potential threat posed by his Christian Social Movement. The fear was that if allowed to continue, Diem could inflict further damage upon our government's struggle against the encroaching specter of northern communism and disrupt the fragile stability we sought to maintain.\n\nHere is an excerpt from Diem's manifesto, which sheds light on his ideological stance:\n\n\"We must recognize that our current struggle extends beyond mere political independence for our homeland. It is, in essence, a SOCIALIST REVOLUTION, aimed at securing FREEDOM for the FARMERS AND WORKERS OF VIETNAM! Our ultimate objective is to ensure that every individual in Vietnam possesses the means of production, enabling them to lead lives of dignity. To achieve this, I advocate for progressive and bold social reforms that will not only safeguard our human dignity but also usher in an era of growth and evolution.\"\n\nThe urgency of the situation is undeniable, and the need to rectify our course is immediate."
 BaoDai.4.a: "Another nuisance."
 BaoDai.4.b: "A potential oppurtunity..."

 BaoDai.5.t: "Chief of State Bao-Dai Fails to Address Ngo-Dinh-Diem's Manifesto"
 BaoDai.5.d: "Ngo-Dinh-Diem's manifesto for a social revolution has done what the palace assured us it would not, and the Chief of State has found no answer to it in three weeks of trying.\n\nThe demands are simple enough to be shouted: better treatment for workers, and an end to our benefactors' patronage. Simplicity of that kind travels, and it has travelled through a populace with no means of judging what any of it would cost. There are riots in the industrial quarters and strikes in the port, and the strikes are now spreading to towns where not one man in a thousand has read the manifesto.\n\nThis government cannot be seen to negotiate with a document that calls for its dissolution. The Xac-Te and the Canh-Sat Quoc-Gia have accordingly been authorised to restore order by more drastic measures, and precisely what that phrase means will be settled in the streets tomorrow morning..."
 BaoDai.5.a: "Shoot them!"

 BaoDai.6.t: "Containing Diem's Ambitions"
 BaoDai.6.d: "Ngo-Dinh-Diem's latest manifesto for a \"Socialist\" Vietnam was widely noticed and thinly supported. It sold, it was discussed, and it produced no movement worth the name. By any ordinary measure it failed.\n\nThe French have not read it by any ordinary measure. The High Commission has concluded that a man capable of drafting such a document and finding an audience for it at all is a standing threat to the Quoc-Gia solution, and has recommended his influence be neutralised before it acquires an organisation. Our government has agreed, and the two of us are working the same file.\n\nThe development worth watching is on the other side. The Viet Minh have reportedly abandoned two years of effort to bring Diem over to them. He is now isolated from every organised force in the country, and a man in that position has nothing whatever to lose by waiting."
 BaoDai.6.a: "The Clock is ticking..."

 BaoDai.7.t: "Dealing with Diem"
 BaoDai.7.d: "Under pressure from the French, Chief of State Bao-Dai and the Etat du Vietnam's Quoc-Gia government faced a critical decision on how to handle the growing challenge posed by Ngo-Dinh-Diem. After careful consultations with the Cong-an Quoc-Gia (National Police) and Xac-te Secret Police, three options were proposed:\n\nAwait Diem's Self Exile: this would be the safest approach, as Diem was rumored to soon leave the country voluntarily, neutralizing the threat without direct confrontation.\n\nArrest Diem: Diem could be charged with Anti-State activities and Communist terrorism, though this would risk souring relations with the influential Ngo-inh family, whose political connections were still formidable.\n\nArrest Ngo-Dinh-Nhu: Targeting Diem's younger brother, Nhu, who was suspected of collaborating with Communist and Syndicalist cells and inciting daily strikes and riots in Saigon, might silence Diem without direct confrontation, though it carried risks of public backlash."
 BaoDai.7.a: "Await Diem's Self Exile"
 BaoDai.7.b: "Arrest Diem"
 BaoDai.7.c: "Arrest Ngo-Dinh-Nhu"

 BaoDai.8.t: "Nationalist Parties Support Bao-Dai"
 BaoDai.8.d: "The Viet-Quoc, the Dai-Viet and a number of smaller rightist and nationalist parties have agreed to work inside the French compromise. The French purpose in offering it was to divide the anti-colonial movement and consolidate what remained under the more tractable Bao-Dai solution, and nobody who signed was under any illusion on that point.\n\nWe took it regardless. The parties have entered the Lien-Minh Quoc-Gia, the National Front, and have put their organisations, their newspapers and their provincial machines behind the Quoc-Gia cause and behind the Chief of State.\n\nThe reasoning is that a front is a place to stand. The south has to be unified against Ho Chi Minh before anything at all can be attempted against the north, and a party outside the arrangement keeps its principles and holds no province. What was conceded in accepting it will have to be recovered afterwards, and every man who signed knows as much."
 BaoDai.8.a: "Another victory for the Quoc-Gia cause"

 BaoDai.9.t: "The 1955 Grand Election"
 BaoDai.9.d: "As the 1955 referendum approaches, South Vietnamese citizens will determine the nation's future for the first time. The election pits Prime Minister Ngo-Dinh-Diem, a visionary leader advocating for independence and reform, against former Emperor Bao-Dai, who seeks to maintain the status quo with close ties to France.\n\nMany in South Vietnam view Diem as the leader who can finally break the country free from colonial influence. His promise to build a Republic under the principles of Labour Personalism - focusing on empowering the working class, promoting progressive ideas, and modernizing society - has inspired hope for a new, independent Vietnam. To many, Diem represents a future where Vietnam can stand on its own, free from foreign interference.\n\nOn the other hand, Bao-Dai, who abdicated in 1945 but continues to hold the title of head of state, represents the old order. He proposes to keep the pro-French monarchy in place, believing that maintaining these ties will ensure stability and financial aid. Yet, his distant leadership and lavish lifestyle abroad have led many to question his commitment to the country's well-being.\n\nAs South Vietnam remains fractured - its countryside controlled by powerful religious sects like the Cao-Dai and Hoa-hao, and the streets of Saigon under the grip of the Binh-Xuyen crime syndicate - the people of South Vietnam see the upcoming referendum as their chance to reclaim the future. For some, Diem is the revolutionary figure who can unify the nation, while for others, Bao-Dai promises of stability hold appeal but the voting is yet to be voted..."
 BaoDai.9.a: "And ... Prime Minister Diem won with ... 98.9% of the vote!"

 BaoDai.10.t: "The Fate of the Captured Viet-Minh's Leadership"
 BaoDai.10.d: "Our brave heroes of the National Vietnamese Army of our Quoc-Gia government have captured several top Viet-Minh leaders, sparking debate over their fate. While the French CEFEO Command has urged their execution to stamp out future revolutionary threats, many of our own compatriots have instead advocated for leniency.\n\nOur Dong-bao has argued that sparing the captives would show that the Quoc-Gia cause stands for unity and reconciliation, aiming to bring all Vietnamese together, regardless of political differences, in building a shared future. They believe that by choosing mercy, South Vietnam can demonstrate its commitment to national solidarity, above the divisions of the evil Communist cause."
 BaoDai.10.a: "Better dead than red."
 BaoDai.10.b: "Regardless, we are all Dong-Bao"

 BaoDai.11.t: "Farewell Bao-Dai!"
 BaoDai.11.d: "Following Bao-Dai's defeat in the 1955 Grand Election, which officially stripped him of all titles and powers, former Chief of State Bao-Dai has gone into exile. On [?global.date.GetDateStringNoHourLong], from his residence in Paris, Bao-Dai attempted to dismiss Prime Minister Ngo-Dinh-Diem, accusing our Prime Minister of creating a police state and leading an oppressive leftist Personalist dictatorship. However, the move failed to garner any popular supporters except from niche reactionary groups, solidifying his exit from power.\n\nBao-Dai has since moved to Cannes and later Alsace, where he leads a quiet life in exile, forging friendships with influential figures like Jean de Beaumont, a former member of the Cochinchinese parliament. His once grand reign now seems like a distant memory as South Vietnam forges ahead under Diem's leadership."
 BaoDai.11.a: "A fitting ends for a playboy"

 BaoDai.12.t: "Bao-Dai's Exile"
 BaoDai.12.d: "Bao-Dai has run out of support in every quarter that could have kept him. The people went first, the Vietnamese political class followed, and the French ceased defending him some months before they admitted as much.\n\nHis loyalists thin out of the ministries and the general staff a little further each week - quietly, by transfer and retirement rather than by dismissal. There is no purge because no purge is necessary. A man whose appointees are removed one at a time cannot govern for long, and eventually cannot remain.\n\nHe was last seen in Paris and will not be returning. The last emperor of the Nguyen, the first Chief of State this country had, and the first of either to end his days in a French apartment. The record will read that way whatever is said about it here."
 BaoDai.12.a: "So long Bao-Dai."

 BaoDai.13.t: "Prince Bao-Long's Reckless Lifestyle"
 BaoDai.13.d: "Paris, [?global.date.GetDateStringNoHourLong] - Prince Nguyen-Phuc Bao-Long, son of the Chief of State of Vietnam, has acquired a reputation in this city which his mother has spent two years failing to contain. The taste for fast cars and expensive company is precisely his father's, and he has rather less reason than his father to be discreet about it.\n\nFor his birthday the Chief of State gave him a Jaguar VII. The prince exchanged it inside a week for the new XK 120, on the ground that the XK 120 is the first production car to exceed two hundred kilometres in the hour, and the machine is by now thoroughly familiar to the Paris police.\n\nOur own government issued the young prince a special licence to drive it. That detail has reached the newspapers in Saigon, in a country where the roads outside the capital are laterite and the war is being fought along them."
 BaoDai.13.a: "Can we revoke his license?"

 BaoDai.14.t: "Diem's recent activities in Japan and the U.S."
 BaoDai.14.d: "After the recent self-exile, our French benefactors informed our government about Ngo-Dinh-Diem's recent activities abroad: During a meeting in Japan with General Douglas MacArthur, Diem, accompanied by his brother Bishop Ngo Dinh Thuc received a lukewarm response. MacArthur showed little interest in Diem's appeals for U.S. support in liberating Vietnam from French control, focusing instead on post-war Japan.\n\nFollowing this, Diem traveled to the United States, meeting with U.S. State Department officials on the advice of political professor Wesley Fishel. However, his presentation failed to impress American policymakers. An US State Department official noted that Diem appeared more concerned with his personal ambitions than with addressing Vietnam's complex issues. The U.S. remains unconvinced of his leadership, leaving Diem without the support he sought."
 BaoDai.14.a: "Nobody will take his pseudo-Communist ideas seriously"

 BaoDai.15.t: "The Emperor's Personal Affairs"
 BaoDai.15.d: "Recent efforts by the government to manage the Emperor's personal affairs have been quietly handled through various channels. Funds have been allocated to settle outstanding debts and address various personal matters that had been causing concern. Through careful financial management and discreet negotiations, these issues have been resolved without attracting significant public attention.\n\nThis quiet resolution has helped maintain the stability of the administration and prevented any potential political fallout from these personal matters becoming public knowledge."
 BaoDai.15.a: "The Emperor's personal affairs are his own business"

 BaoDai.16.t.a: "The Prince Is Dead"
 BaoDai.16.t.b: "Death of an Exiled Prince"

 BaoDai.16.d.a: "The telegram came to the government and to the Chief of State from the Ando family, who adopted Cuong-De in Japan and buried him there. The Prince died at the Nihon Medical University in Tokyo of a lung cancer that went undiagnosed for years and killed him in a month.\n\nThe Ando passed on his last words with the telegram: \"Phai dung lai Chien-cuoc nay ...\" - we must stop this war, transmit this to our people. He asked that it reach Bao-Dai in Saigon and Ho Chi Minh in Hanoi alike, that Vietnam be reunified against Western imperialism, and that this brothers' war be brought to an end.\n\nHe had been in exile since 1906 and never came home. For half a century he was the alternative every Vietnamese government had to reckon with, and the men who backed him will not stop existing because he has. The palace has not said what it intends to do about the funeral, or about the body, and every hour it says nothing is being counted."
 BaoDai.16.d.b: "Word has come from the Nippon Medical School Hospital that the Vietnamese Prince Cuong-De is dead of a lung cancer. He was our guest for forty-five years, and it is said he refused the treatment that was offered him, taking the illness as the punishment due to a man who could not take up the reins of his own country.\n\nOur government's response has been brief and correct. No approach has come from Saigon regarding the return of the body, and none has been solicited from this side.\n\nThere is an accounting owed here that nobody in the ministry cares to make out loud. He was brought to this country as a hope, employed as an instrument, and kept on after the instrument was of no further use. He outlived the war, the empire that fought it, and every promise made to him in the course of both."

 BaoDai.16.a: "Rest in peace, we will reach the final victory soon!"
 BaoDai.16.b: "Your life of honor was overshadowed by an alliance with the losers and ends in obscurity."

 # Hoang Lien Revolt
 HoangLienRevolt.1.t: "Revolt in Hoang Lien Son"
 HoangLienRevolt.1.d: "Weeks after our forces secured control over the northern territories, disturbing reports have emerged from Hoang Lien Son province. Pro-communist elements and disgruntled workers, emboldened by the recent political upheaval, have launched a coordinated uprising against our administration.\n\nFactory workers, peasants, and remnants of the Viet Minh have taken to the streets, organizing strikes and demonstrations that have quickly escalated into open rebellion. The local authorities report that communist agitators have been spreading propaganda among the population, exploiting economic grievances and nationalist sentiment to turn the people against our government.\n\nThe situation has deteriorated rapidly. Resistance to our rule has surged dramatically, with compliance plummeting as the population becomes increasingly hostile. Our garrisons in the region are struggling to maintain order, and the province has become a hotbed of anti-government activity. If left unchecked, this revolt could spread to other northern provinces and undermine our hard-won victory.\n\nWe must act decisively to crush this rebellion before it gains further momentum."
 HoangLienRevolt.1.a: "This cannot be tolerated."

 HoangLienRevolt.2.t: "The Crackdown"
 HoangLienRevolt.2.d: "Following the outbreak of rebellion in Hoang Lien Son, our military forces have been ordered to restore order through decisive action. The crackdown has been swift and brutal, with our troops sweeping through the province to root out communist sympathizers and restore government control.\n\nHundreds of suspected rebels have been arrested, and numerous clashes have occurred between our forces and the insurgents. The operation has been costly - we have lost significant manpower in the fighting, and the violent suppression has drawn criticism both domestically and internationally. The heavy-handed response has also shaken public confidence, with war support declining as news of the crackdown spreads.\n\nHowever, the operation has achieved its primary objective. The resistance in Hoang Lien Son has been crushed, compliance has been restored, and the province is now firmly under our control. With the rebellion suppressed, we have formally integrated Hoang Lien Son into the Republic of Vietnam, adding it as a core territory. The province is now fully part of our nation, though the scars of the conflict remain visible in the communities that bore the brunt of the fighting."
 HoangLienRevolt.2.a: "Order has been restored."

 # French Coup
 French_Coup.1.t: "Leroy's Takeover"
 French_Coup.1.d: "We angered the French past the point at which they were prepared to go on doing business with us, and this morning they collected the debt.\n\nArmed men under Jean Leroy of the UMDC surrounded and then entered the residence before dawn. There was no fighting worth the name. Leroy is a Catholic militia commander with a private army and French backing, and the backing was the operative part - the guard understood whose orders he was carrying and stood aside.\n\nFrance holds Vietnam again, and intends to install Nguyen-Van-Hinh at the head of [VIE.GetNameDef]: a general with a French commission, a French passport, and no constituency in this country that does not wear a uniform. Whatever independence was won on paper these last years has been undone in a single morning by a hundred men, and it will be a very long time before it is won back."
 French_Coup.1.a: "We should've dealt with him when we had the chance."

 French_Coup.2.t: "Hinh's Ascension"
 French_Coup.2.d: "To solidify French control in Vietnam once again, the French government appointed General Nguyen-Van-Hinh as the leader of [VIE.GetName]. As a loyal French-trained officer, Hinh allows the French to have a local face while at the same time always answer to France. This means the current Vietnamese government will remain dependent on France fo years to come."
 French_Coup.2.a: "This cannot be happening..."

 # Hinh's French Government
 French_Hinh.1.t: "The French Puppet Government"
 French_Hinh.1.d: "After consolidating his position through purges, censorship, and repression, General Nguyen-Van-Hinh has established a government that serves as little more than a French puppet regime. While Hinh maintains the appearance of Vietnamese leadership, all major decisions must be approved by French advisors and officials. The French High Commissioner maintains ultimate authority over Vietnamese affairs, with Hinh's government functioning primarily as an administrative body to implement French policies.\n\nThe arrangement ensures French control over Vietnam's resources, military, and foreign policy while presenting a facade of Vietnamese autonomy. Hinh's position depends entirely on French support, and any attempt to assert true independence would result in his immediate removal. The Vietnamese people are well aware of this arrangement, viewing Hinh as a traitor who has sold his country to the colonial masters."
 French_Hinh.1.a: "We serve at France's pleasure."

 French_Hinh.2.t: "The Facade of Sovereignty"
 French_Hinh.2.d: "After months of careful negotiation, General Hinh has secured an agreement with the French High Commissioner: Vietnam will retain the formal structures of statehood - its flag, its government ministries, its seat in the French Union - while France maintains quiet oversight of defense and foreign affairs.\n\nThe arrangement satisfies no one completely. French officials see it as an affordable concession that preserves their influence without the cost of direct administration. Hinh's government celebrates it as a victory for Vietnamese dignity, though the cheers in the ministries ring hollow when French advisors still occupy the adjoining offices.\n\nIn the streets of Saigon, the cynics say little has changed. Perhaps they are right. But Hinh has a state, and a state is something to build upon - or so he tells himself."
 French_Hinh.2.a: "We take what we can get."

 French_Hinh.3.t: "A Province of France"
 French_Hinh.3.d: "The directive arrives from Paris with little ceremony. French administrators will assume direct oversight of the ministries of Finance, Interior, and Defense. The Vietnamese National Army will be formally placed under the operational command of the French Expeditionary Corps. Trade agreements will be renegotiated to prioritize French commercial interests.\n\nGeneral Hinh reads the document twice before signing. He does not protest. His government exists because France permits it to exist, and France has now chosen to simplify the arrangement. Vietnam will remain on the maps as a name and a territory, but the decisions will be made in Paris.\n\nIn the cafes of Saigon, word spreads quickly. The rice farmers of the Mekong Delta, the students in the universities, the veterans who once fought for independence - all of them understand what this paper means, even if none dare say it openly."
 French_Hinh.3.a: "Sign the papers."

 # Ngo-Dinh Brothers
 NgoDinh_Brothers.1.t: "The Exile of Diem"
 NgoDinh_Brothers.1.d: "Reports have reached the French Secret Police \"Xac-Te\" that Ngo-Dinh-Diem, the elusive figure behind the controversial manifesto, has managed to escape capture. Intelligence suggests that Diem has found refuge in Japan, further complicating our efforts to contain his radical agenda.\n\nRecent intelligence intercepts also indicate that Diem has had a clandestine meeting with Cuong-De, a prominent figure known for his involvement in anti-government activities. This meeting, shrouded in secrecy, hints at a potential alliance between two forces with similar aims but differing methods.\n\nCuong-De's involvement raises concerns about the depth of collaboration among various factions seeking to challenge our government's stability and French support. Diem's continued presence on the international stage, coupled with this newfound alliance, adds another layer of complexity to the evolving situation.\n\nXac-Te remains vigilant, monitoring these developments closely and assessing the implications of this unexpected meeting. As we strive to safeguard our nation against the communist threat, this new alliance could prove to be a formidable challenge in the days to come."
 NgoDinh_Brothers.1.a: "Someone is going to be fired for this!"

 NgoDinh_Brothers.2.t: "The Arrest of Diem"
 NgoDinh_Brothers.2.d: "Diem was taken on the road to Vinh-Long, where he was going to visit his brother Thuc. The Xac-Te made the arrest on this government's warrant, and the charge written on the paper is anti-state activity, which the drafters left conveniently unelaborated.\n\nIt was done quietly and it did not stay quiet for an hour. Diem is not a private citizen. He has refused a ministry from the Chief of State and a place from the Viet Minh, and there are men in every faction in this country who have been waiting to see which way he would eventually move.\n\nThe family answered before the day was out. The Ngo-Dinh have published a letter denouncing the arrest as unjust and politically motivated, demanding his immediate release, and warning that the government has made a mistake it will find expensive. They are Catholics with a bishop in the family and a following in the northern parishes, and the letter was drafted by people who know precisely how far it will travel."
 NgoDinh_Brothers.2.a: "Checkmate!"

 NgoDinh_Brothers.3.t: "The Arrest of Nhu"
 NgoDinh_Brothers.3.d: "Nhu was arrested this morning by the Xac-Te on charges of anti-state activity and communist terrorism. The second charge would not survive a courtroom, and it is not intended to.\n\nWhat he has actually been doing is organising. The daily strikes and disturbances that have made Saigon ungovernable this month were run out of his circle, working with the syndicalist cells and, where it suited him, with men a good deal further left than that. The port has not moved cargo in nine days.\n\nThe arrest is meant to accomplish two things at once. It takes the organiser off the street, and it sets the word terrorism beside the family name at the exact moment his brother's manifesto is being argued over in every cafe in the city. One rock and two birds, as the file has it: Nhu silenced, and Diem discredited by the association."
 NgoDinh_Brothers.3.a: "And... CHECKMATE!"

 NgoDinh_Brothers.4.t: "Tran-Quoc-Buu forms Syndicalist Alliance with Ngo-Dinh-Nhu"
 NgoDinh_Brothers.4.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Tran-Quoc-Buu, who heads the Vietnamese Confederation of Workers, has made common cause with Ngo-Dinh-Nhu. The Surete has been reporting the contact since the beginning of the year. What is new is that neither man is any longer troubling to conceal it.\n\nThe two are building a syndicalist movement addressed against French rule, and Buu has put the Confederation behind the programme of Nhu's brother - the Social Revolutionary Manifesto of 1949, which until now was a pamphlet with no organisation attached to it. They publish together in a Saigon journal called \"Xa-Hoi\", and its circulation among the dock and factory unions has risen every month since it appeared.\n\nThis is the combination against which the Quoc-Gia cause has the least defence. Nhu supplies the doctrine and the connections; Buu supplies tens of thousands of organised workers in the port and the mills. Our French patrons will read it as agitation and press us to act, and acting means arresting a labour leader with a following and the brother of a man half the Assembly expects to govern. Both were cheaper to jail a year ago than they are today."
 NgoDinh_Brothers.4.a: "We should have arrested them long ago"

 # VIE PMs
 VIE_PMs.1.t: "Nguyen-Van-Xuan Resigns as Prime Minister"
 VIE_PMs.1.d: "Nguyen-Van-Xuan has resigned the premiership. He gave no reason worth printing and none was pressed for. The Chief of State will hold the office himself until a successor can be found, an arrangement nobody intends to leave standing for long.\n\nTwo names are under consideration. Nguyen-Phan-Long is a Caodaist, openly pro-American, and a nationalist in domestic policy - a combination that would please the Cao-Dai, please Washington, and please the nationalist press, which is three constituencies this government cannot presently reach on its own.\n\nThe other is Tran-Quang-Vinh, a Cao-Dai general, and the objection to him is a matter of record: he has never concealed his support for the exiled prince Cuong-De. Appointing him would buy the sects outright. It would also place a man loyal to a rival claimant one step below the top of this government."
 VIE_PMs.1.a: "Bao-Dai can't do everything alone!"

 VIE_PMs.2.t: "Nguyen-Phan-Long Resigns as Prime Minister"
 VIE_PMs.2.d: "Nguyen-Phan-Long governed as well as anyone could in the time he was allowed, and it was the French he lost rather than the country. Once the High Commission had made its view known there was no version of events in which he stayed, and the Chief of State has had to require his resignation. Bao-Dai holds the office himself until a successor emerges.\n\nTran-Van-Huu is the first name on the list. He was Deputy Prime Minister of Cochinchina, and he is chiefly remembered for putting the police onto the student demonstrations of 1950 - which is precisely the qualification recommending him to the men who have just removed his predecessor.\n\nThe second is Nguyen-Bao-Toan, a Catholic revolutionary on good terms with the Hoa-Hao and an ally of Diem. He would bring the sects and the Catholics in with him. He would also bring Diem a great deal closer to the centre of this government than the palace has ever wished him to be."
 VIE_PMs.2.a: "Let's hope we can find a replacement in time."

 VIE_PMs.3.t: "Tran-Van-Huu Resigns as Prime Minister"
 VIE_PMs.3.d: "Tran-Van-Huu has resigned after two years, which by the standards of this office is a long tenure and by the standards of the country an inadequate one. The Chief of State must find a successor, and has two men under consideration.\n\nNguyen-Van-Tam is allied to the Viet-Nam Quoc-Dan Dang and has built his reputation on the destruction of the Viet Minh in the delta. His methods earned him the name \"The Tiger of Cai-Lay\", which he has never repudiated and which his supporters offer as the recommendation rather than the reservation.\n\nDinh-Xuan-Quang is a judge, took part in the anti-colonial movement in his younger years, and has close ties to the Catholic community of Phat-Diem. He would be the more respectable appointment and by a considerable distance the less frightening one, and the argument against him is precisely that."
 VIE_PMs.3.a: "Let's hope we can find a replacement in time."

 VIE_PMs.4.t: "Nguyen-Van-Tam Resigns as Prime Minister"
 VIE_PMs.4.d: "Like all of the prime ministers before him, Nguyen-Van-Tam resigned his post as prime minister of [VIE.GetName] less than a year after Bao-Dai appointed him. To fill in the gap, Bao-Dai decided to appoint his cousin, Nguyen-Phuc Buu-Loc, as the prime minister."
 VIE_PMs.4.a: "This is the best we can do for now."

 VIE_PMs.5.t: "Nguyen-Phuc Buu-Loc Resigns as Prime Minister"
 VIE_PMs.5.d: "After governing for a year, Nguyen-Phuc Buu-Loc has resigned as prime minister of the [VIE.GetName]. For now, as there are no one to fill in the position, Bao-Dai will remain in charge of the [VIE.GetName] until he can find someone willing to take the position."
 VIE_PMs.5.a: "What will this means for Vietnam."

 VIE_PMs.6.t: "Tran-Quang-Vinh Resigns as Prime Minister"
 VIE_PMs.6.d: "Tran-Quang-Vinh governed about as well as a Cao-Dai general in a French-backed cabinet could have expected to, and it was the French he lost rather than the country. Once the High Commission had made its view known there was no version of events in which he stayed, and the Chief of State has had to require his resignation. Bao-Dai holds the office himself until a successor emerges.\n\nTran-Van-Huu is the first name on the list. He was Deputy Prime Minister of Cochinchina, and he is chiefly remembered for putting the police onto the student demonstrations of 1950 - which is precisely the qualification recommending him to the men who have just removed his predecessor.\n\nThe second is Nguyen-Bao-Toan, a Catholic revolutionary on good terms with the Hoa-Hao and an ally of Diem. He would bring the sects and the Catholics in with him. He would also bring Diem a great deal closer to the centre of this government than the palace has ever wished him to be."
 VIE_PMs.6.a: "Let's hope we can find a replacement in time."

 VIE_PMs.7.t: "Nguyen-Bao-Toan Resigns as Prime Minister"
 VIE_PMs.7.d: "Nguyen-Bao-Toan has resigned after two years in office, and the Chief of State must find a successor. Two men are under consideration, and they could hardly be less alike.\n\nNguyen-Van-Tam is allied to the Viet-Nam Quoc-Dan Dang and has built his reputation on the destruction of the Viet Minh in the delta. His methods earned him the name \"The Tiger of Cai-Lay\", which he has never repudiated and which his supporters offer as the recommendation rather than the reservation.\n\nDinh-Xuan-Quang is a judge, took part in the anti-colonial movement in his younger years, and has close ties to the Catholic community of Phat-Diem. He would be the more respectable appointment and by a considerable distance the less frightening one, and the argument against him is precisely that."
 VIE_PMs.7.a: "Let's hope we can find a replacement in time."

 VIE_PMs.8.t: "Dinh-Xuan-Quang Resigns as Prime Minister"
 VIE_PMs.8.d: "Like all of the prime ministers before him, Dinh-Xuan-Quang resigned his post as prime minister of [VIE.GetName] less than a year after Bao-Dai appointed him. To fill in the gap, Bao-Dai decided to appoint his cousin, Nguyen-Phuc Buu-Loc, as the prime minister."
 VIE_PMs.8.a: "This is the best we can do for now."

 # Huu
 VIE_Huu.1.t: "The State of Vietnam Demands War Reparations"
 VIE_Huu.1.d: "During 1940, Japan invaded French Indochina and put it under their control for 5 years. After World War 2, Japan had to give up its empire and went under American occupation. Recently, we have received news from Prime Minister Huu of the State of Vietnam demanding us to pay war reparations for the years of occupation during World War 2. Should we accept the Vietnamese government's demand?"
 VIE_Huu.1.a: "Accept their demands."
 VIE_Huu.1.b: "Refuse their demands."

 VIE_Huu.2.t: "Tokyo Concedes the Reparations Claim"
 VIE_Huu.2.d: "The reply came through the American occupation authorities rather than from any Japanese ministry, which tells us most of what we need to know about how it was decided. Japan accepts the principle of reparations for the five years its army governed Indochina, and accepts our government as the party entitled to receive them.\n\nThat second point is worth more to Prime Minister Huu than the sum itself. Hanoi has argued for years that the Etat du Vietnam is a French convenience with no standing to speak for the country. A foreign power has now settled a debt with Saigon and with nobody else, and the newspapers have been told exactly which sentence to print.\n\nThe money is small enough that it will be spent within the year, most of it on obligations that were already overdue. What we have bought is the precedent, and a colder correspondence with Tokyo, which had hoped this file would stay closed."
 VIE_Huu.2.a: "Let the record show who was paid, and by whom."

 VIE_Huu.3.t: "The Japanese Refuse"
 VIE_Huu.3.d: "Tragic news! Despite our best attempt to convince the Japanese government for war reparations, they refused to accept our demands. This is a great injustice for the atrocities they committed during the five years occupation."
 VIE_Huu.3.a: "How dare they!"

 VIE_Huu.4.t: "The VOA"
 VIE_Huu.4.d: "\"Voice Of America\", or the VOA, is an international radio broadcaster of the United States Information Agency. Established in 1942, the VOA aims to serve American interests abroad through radio broadcasts of news, music, and many more programmes.\n\nEver since the start of the Cold War, the VOA has ramped up its worldwide operations with the goal of aiding the US's fight against Communism. This new shift of direction can be clearly felt in political hotspots throughout the world, especially in Vietnam, as our country is currently at the forefront of a grand international standoff between superpowers.\n\nAs news and entertainment continue to dance together in the VOA's tango of influence, the specter of American geopolitical dominance will not go away anytime soon."
 VIE_Huu.4.a: "This is the Voice Of America, Washington D.C. Signing off."

 VIE_Huu.5.t: "[VIE.GetLeader] Requests Further Aid"
 VIE_Huu.5.d: "We have received news from Vietnam requesting us for further aid in an effort to fight against the Communists in Indochina. We can accept their requests to ensure they remain friendly to us or we can set up some terms and conditions they would have to follow before we can send them aid."
 VIE_Huu.5.a: "Okay."
 VIE_Huu.5.b: "Not so fast."

 VIE_Huu.6.t: "Paris Grants the Aid Without Conditions"
 VIE_Huu.6.d: "Prime Minister Huu asked the French government to increase its aid and attached no concession to the request. Paris has answered in the same spirit - no revised protocols, no supervisory commission, no clause governing where the funds may be spent. The credits are simply released.\n\nOur ministries had prepared for a negotiation and now find themselves holding money and no argument to have. The first tranche goes to the capital: the administrative block Saigon has needed since the Cochinchinese bureaucracy was folded into ours, and the roadworks that every rainy season undoes.\n\nIt would be pleasant to read this as French confidence in us. The soberer reading in the Prime Minister's office is that Paris has too many files open in Indochina to spend a month arguing over this one, and that a demand deferred is not a demand withdrawn."
 VIE_Huu.6.a: "Take the credits, and remember who signed them."

 VIE_Huu.7.t: "The French Have Some Conditions"
 VIE_Huu.7.d: "My leader, it seems that while the French do appear to accept the idea of sending aids to Vietnam, they do set up some terms and conditions we must follow in order for them to send any aids. We could refuse such conditions for the sake of our self-determination, offer some compromise as a counteroffer on our part, or accept their terms and conditions for aid."
 VIE_Huu.7.a: "We're not submitting."
 VIE_Huu.7.b: "Compromise?"
 VIE_Huu.7.c: "We are in desperate need of aid, accept to whatever they've offered."

 VIE_Huu.8.t: "Vietnam Refuses to Budge"
 VIE_Huu.8.d: "Grave news! Despite our best attempt to offer them some terms and conditions to follow in exchange for our aid, the Vietnamese government refuses to accept our demand. We can refuse to aid them or give them what they want to keep relations cordial between the two nations."
 VIE_Huu.8.a: "So be it."
 VIE_Huu.8.b: "We will not withold aid from a valuable ally, give them what they want."

 VIE_Huu.9.t: "Vietnam Offers a Compromise"
 VIE_Huu.9.d: "My leader! We have received news from Vietnam that they decided to offer us some compromises in exchange for them to accept our terms and conditions for aid. We can accept their compromises and give them the aid they want or reject their compromise and send them nothing."
 VIE_Huu.9.a: "A compromise it is."
 VIE_Huu.9.b: "This isn't what we demanded, we will not help."

 VIE_Huu.10.t: "Vietnam Gives In"
 VIE_Huu.10.d: "Good news! The Vietnamese government has decided to give in to our demands in exchange for aid. We should celebrate this moment as it shows how we can persuade others to our terms without being bullied to their terms."
 VIE_Huu.10.a: "Pleasure doing business with them."

 VIE_Huu.11.t: "Paris Withdraws the Aid Offer"
 VIE_Huu.11.d: "We told the French we would not accept their terms, and we said it where it could be heard. The answer has come back through the High Commission in the driest language available: the offer is withdrawn, the file is closed, and there is nothing further to discuss at this time.\n\nNobody in the cabinet is surprised. The refusal was a statement about our sovereignty rather than a calculation about our budget, and the Prime Minister knew its price when he made it. What was not fully weighed is how the Assembly would take the sequel - the same deputies who cheered the refusal are now asking where the replacement funds are to be found.\n\nThere are none. The programmes drawn against that aid will be cut or postponed, and every postponement will be reported in Hanoi as proof that Saigon cannot feed itself without France."
 VIE_Huu.11.a: "We will pay for our dignity in instalments."

 VIE_Huu.12.t: "France Accepts the Counteroffer"
 VIE_Huu.12.d: "The compromise our delegation carried to Paris has been accepted. We take a smaller package on lighter terms than the ones first pressed on us - some of the supervision clauses survive, the harshest of them do not, and the aid moves.\n\nThis is the outcome the Prime Minister wanted and it is also the one hardest to sell. A refusal would have been a headline. A surrender would at least have been simple. A compromise is a document, and documents are read by men looking for what was conceded rather than for what was kept.\n\nThe money goes into the roads first, where the effect can be seen from a car window. The nationalists in the Assembly will read the signed text closely and find in it every string we swore we would not accept, and they will not be entirely wrong."
 VIE_Huu.12.a: "Half a loaf, and half a quarrel."

 VIE_Huu.13.t: "France Agrees to Aid Us Anyways"
 VIE_Huu.13.d: "Surprisingly, despite some apprehensions, the French decided to agree to send us aid without requiring us to accept their terms and conditions. This is good news since it shows we do not need to bow to the French to get our demands."
 VIE_Huu.13.a: "Okay."

 VIE_Huu.14.t: "France Rejects the Compromise"
 VIE_Huu.14.d: "Our counteroffer has been refused outright. Paris will not soften the terms attached to the aid, will not discuss a reduced package, and has let it be understood that the conditions on the table are the conditions and were always the conditions.\n\nThe insult lies in the manner more than the substance. We were not turned down by a minister; we read the decision in the French press two days before the note reached our Foreign Ministry. Prime Minister Huu had staked his standing on the belief that an ally fighting the same war would meet him halfway, and he has been shown otherwise in front of everyone.\n\nThe practical loss is the aid. The lasting loss is the argument, because every man in Saigon who has said that France treats the Etat du Vietnam as an administration rather than a state has just been handed his proof."
 VIE_Huu.14.a: "So this is what our alliance is worth."

 # Tam
 VIE_Tam.1.t: "Intensifying Anti-Communist Operations"
 VIE_Tam.1.d: "Prime Minister Nguyen Van Tam has announced a major escalation in anti-communist security operations across South Vietnam. In response to the growing threat from the Viet Minh and their supporters in the countryside, the government is implementing a comprehensive counter-insurgency strategy.\n\nThis includes increased military patrols, stricter security checkpoints, expanded intelligence gathering operations, and more aggressive tactics against suspected communist sympathizers. The goal is to root out the communist infrastructure that has been building in the South and prevent the North from gaining a foothold in rural areas.\n\nWhile these measures are necessary for national security, they have also raised concerns about civil liberties and the potential for abuse. Some critics argue that the government's heavy-handed approach may alienate the very people it seeks to protect, driving them into the arms of the communists.\n\nNevertheless, Prime Minister Tam is determined to press forward with these operations, believing that decisive action now will prevent a larger conflict later."
 VIE_Tam.1.a: "We must be vigilant against the communist threat."

 VIE_Tam.2.t: "The First Cai-Cach Dien-Dia"
 VIE_Tam.2.d: "Despite past precedents of land redistribution attempts by various political and religious groups in South Vietnam during the Indochina War, it is not until our \"Cai-Cach Dien-Dia\" land reform plan is put into action that there's an official systematic redistribution program in the South. \"Cai-Cach Dien-Dia\" is ambitious in goal, with several important points of achievement:\n\n    1. Regulating the amount of rent and the interest rate a landlord can ask for.\n    2. Officializing and formalizing the conduct of lending - borrowing land through contracts.\n    3. Setting up detailed guideline for land lending.\n    4. Re-selling landlords' land to the farmers through government buyout and compensation through public bonds.\n\nWith the plan in full motion, it's just a matter of time before the old landlord - farmer social relationship is completely abolished. A new age is coming to South Vietnam!"
 VIE_Tam.2.a: "The Farmers Shall Have Their Rice Fields."

 VIE_Tam.3.t: "Tam's Crusade Against the Communist North"
 VIE_Tam.3.d: "Prime Minister Tam has launched a comprehensive campaign against the communist North, declaring that South Vietnam will not rest until the threat from Ho Chi Minh's regime is eliminated. This \"crusade\" involves not just military operations, but also propaganda efforts, economic warfare, and diplomatic initiatives to isolate the North.\n\nThe campaign includes increased border security, counter-propaganda broadcasts, and efforts to cut off the North's supply lines and support networks in the South. Tam has also called upon the international community to recognize the threat posed by communist expansion in Southeast Asia and to provide greater support for South Vietnam's struggle.\n\nThis aggressive stance has been met with both support and criticism. Supporters praise Tam's determination and clear vision, while critics worry that such an uncompromising approach may make peaceful resolution impossible and escalate the conflict beyond control.\n\nRegardless of the debate, Prime Minister Tam remains resolute. \"We will not negotiate with terrorists,\" he declared in a recent speech. \"We will fight until victory is ours, or until we can no longer fight.\""
 VIE_Tam.3.a: "The fight against communism continues."

 # Vinh
 VIE_Vinh.1.t: "Dealing With General Phuong"
 VIE_Vinh.1.d: "Prime Minister Tran-Quang-Vinh faces a delicate and dangerous situation with General Nguyen-Thanh-Phuong, a prominent Cao-Dai military leader who has become increasingly problematic. General Phuong's growing influence and independent actions have raised concerns about his loyalty to the government and his potential to cause instability.\n\nPhuong commands significant forces in the Tay-Ninh region, the heartland of the Cao-Dai religious movement, and his relationship with the government has been deteriorating. There are reports of him making unauthorized decisions, ignoring orders from Saigon, and potentially plotting against the central government.\n\nPrime Minister Vinh must decide how to handle this situation. The options range from attempting to negotiate and bring Phuong back into the fold, to more drastic measures. However, any action against Phuong risks alienating the Cao-Dai community, which is a significant political and military force in South Vietnam.\n\nThe situation is tense, and time may be running out to resolve it peacefully."
 VIE_Vinh.1.a: "We must address this threat before it escalates."

 VIE_Vinh.2.t: "Planning Phuong's Assassination"
 VIE_Vinh.2.d: "With General Phuong's behavior becoming increasingly erratic and dangerous, Prime Minister Vinh has made the difficult decision to authorize a plan to neutralize the general through assassination. This is an extreme measure, but Vinh believes it is necessary to prevent a larger crisis.\n\nOperatives have been identified and briefed on the mission. The plan involves infiltrating Phuong's inner circle and eliminating him at an opportune moment. The operation must be executed with precision and secrecy, as any failure could trigger a violent response from Phuong's supporters.\n\nThis decision weighs heavily on Vinh, as assassination is a grave step that could have far-reaching consequences. However, he believes that the alternative - allowing Phuong to continue his disruptive activities - poses an even greater threat to the stability of South Vietnam.\n\nThe operation is set to proceed within days. Success could neutralize a major threat, but failure could plunge the country into chaos."
 VIE_Vinh.2.a: "Proceed with the operation."

 VIE_Vinh.3.t: "Mutiny in Tay-Ninh"
 VIE_Vinh.3.d: "The worst-case scenario has come to pass. General Phuong has launched a full-scale mutiny in Tay-Ninh, declaring his independence from the central government and mobilizing his Cao-Dai forces against Saigon. The mutiny has caught the government by surprise, and Phuong's forces have quickly seized control of key positions in the region.\n\nThe situation is critical. Phuong commands well-trained and motivated troops, and he has the support of many in the Cao-Dai community who feel marginalized by the government. The mutiny threatens to split South Vietnam at a time when unity is desperately needed against the communist threat.\n\nPrime Minister Vinh must act quickly to suppress this rebellion. The government's response will determine not just the fate of Tay-Ninh, but potentially the future of South Vietnam itself. Failure to quell this mutiny could embolden other dissident groups and lead to the fragmentation of the state.\n\nThe military is mobilizing, and a confrontation appears inevitable. The question is not whether there will be fighting, but how long it will last and what the cost will be."
 VIE_Vinh.3.a: "We must crush this rebellion immediately."

 VIE_Vinh.4.t: "Mutiny Successfully Put Down"
 VIE_Vinh.4.d: "Good news! Our efforts in suppressing the mutiny in Tay-Ninh was a success. Despite initial resistance, the mutineers were no match for our forces and we successfully wipe them out. Hopefully, we can set up an example for those that attempt to rebel against us with this success."
 VIE_Vinh.4.a: "Excellent!"

 VIE_Vinh.5.t: "Phuong Neutralized"
 VIE_Vinh.5.d: "The operation to neutralize General Phuong has been successfully completed. Through careful planning and execution, government operatives were able to eliminate the troublesome general, removing a major threat to stability.\n\nWith Phuong gone, his forces are in disarray, and the government has an opportunity to reassert control over the Tay-Ninh region. The Cao-Dai community, while shocked by the news, appears to be accepting the situation, though some hardline supporters remain resentful.\n\nPrime Minister Vinh has moved quickly to consolidate the government's position, offering amnesty to Phuong's former supporters who agree to lay down their arms and return to the fold. The goal is to heal the divisions and restore unity without further bloodshed.\n\nThis successful operation has strengthened Vinh's position and demonstrated the government's resolve to maintain order. However, the underlying tensions that led to this crisis remain, and Vinh must work to address them to prevent similar situations in the future."
 VIE_Vinh.5.a: "Order has been restored."

 VIE_Vinh.6.t: "An Embassy for the State of Vietnam"
 VIE_Vinh.6.d: "Prime Minister Vinh has announced plans to establish a formal embassy in Japan, marking a significant step forward in Vietnamese-Japanese relations. This diplomatic mission will serve as a permanent representation of South Vietnam in Tokyo and facilitate closer cooperation between the two nations.\n\nThe embassy will handle diplomatic affairs, promote trade and economic cooperation, and serve as a cultural bridge between Vietnam and Japan. It represents Vinh's vision of building stronger ties with Asian nations, moving beyond the colonial relationships of the past.\n\nThe establishment of this embassy has been welcomed by both governments, who see it as a symbol of their growing partnership. For Vietnam, it represents an opportunity to diversify its international relationships and reduce dependence on Western powers.\n\nPreparations are underway, and the embassy is expected to open within months. This new diplomatic presence will help shape the future of Vietnamese-Japanese relations."
 VIE_Vinh.6.a: "A new chapter in our relations with Japan."

 VIE_Vinh.7.t: "Establishment of the Vietnamese-Japanese Friendship Association"
 VIE_Vinh.7.d: "The Vietnamese-Japanese Friendship Association has been formally established, creating an official framework for cultural, economic, and diplomatic cooperation between the two nations. This organization will coordinate exchanges, facilitate trade agreements, and promote mutual understanding.\n\nThe association's founding ceremony was attended by dignitaries from both countries, who emphasized the importance of building bridges between Asian nations. Prime Minister Vinh delivered a speech highlighting the shared values and common interests that unite Vietnam and Japan.\n\nHowever, this closer relationship with Japan has not gone unnoticed by other powers. France and the United States have expressed some concern about Vietnam's growing ties with Japan, viewing it as a potential shift in the regional balance of power.\n\nDespite these concerns, Vinh remains committed to pursuing Vietnam's independent foreign policy. The Friendship Association represents a step toward a more multipolar diplomatic landscape in Southeast Asia."
 VIE_Vinh.7.a: "Friendship and cooperation between our nations."

 VIE_Vinh.8.t: "The State of Vietnam Requests Cuong-De's Repatriation"
 VIE_Vinh.8.d: "We have received a request from the Vietnamese government to repatriate Prince Cuong-De to Vietnam. On one hand, accepting this offer could mend Vietnam-Japan relation. On the other hand, considering that Prince Cuong-De has been a friend of Japan, repatriating him to Vietnam would be too risky as who knows what fate lies ahead of him there."
 VIE_Vinh.8.a: "Okay."
 VIE_Vinh.8.b: "No."

 VIE_Vinh.9.t: "Japan Agrees to Cuong-De's Repatriation"
 VIE_Vinh.9.d: "After months in which the Japanese Foreign Ministry would not give any answer at all, Tokyo has consented. Prince Cuong-De, who left this country in 1906 and has spent every year since as a guest of Japan, will be put aboard a ship for Saigon.\n\nPrime Minister Vinh pressed for this and may claim it. The request was refused twice; the third approach went through the Ando family rather than the ministry, and it was the family that carried the argument. Whatever else is said of the affair, a Vietnamese government asked a foreign power for a Vietnamese prince and was not sent away empty-handed.\n\nWhat arrives is not merely an old man. Cuong-De is the senior surviving claimant of the Nguyen line, and there are men in Hue and Tay-Ninh who have waited half a century to say so out loud. Chief of State Bao-Dai has issued no statement on the repatriation, an omission the palace correspondents have already noticed and printed."
 VIE_Vinh.9.a: "Bring him home, and watch who goes down to meet the ship."

 VIE_Vinh.10.t: "Japan Refuses Cuong-De's Repatriation"
 VIE_Vinh.10.d: "Despite our best attempts at negotiating for Prince Cuong-De's repatriation, the Japanese government has refused to repatriate him to Vietnam. The Japanese have cited concerns about Cuong-De's safety and their long-standing friendship with the prince as reasons for their decision.\n\nThis refusal is a disappointment for the Vietnamese government, which had hoped that repatriating Cuong-De would help normalize relations and demonstrate Japan's support for the current Vietnamese leadership. However, the Japanese position is firm, and they will not be swayed.\n\nThe diplomatic relationship between Vietnam and Japan remains intact, but this episode has highlighted the complexities of international relations and the limits of what can be achieved through negotiation alone."
 VIE_Vinh.10.a: "We must respect their decision."

 VIE_Vinh.11.t: "The State of Vietnam Requests to Posthumously Repatriate Cuong-De"
 VIE_Vinh.11.d: "We have received a request from the Vietnamese government to repatriate Prince Cuong-De's remains since he has died in Japan. On one hand, accepting this offer could mend Vietnam-Japan relation. On the other hand, considering that Prince Cuong-De has been a friend of Japan, repatriating his remains to Vietnam would be too risky."
 VIE_Vinh.11.a: "Okay."
 VIE_Vinh.11.b: "No."

 VIE_Vinh.12.t: "Japan Agrees to Repatriate Cuong-De's Remains"
 VIE_Vinh.12.d: "After extensive negotiations, the Japanese government has agreed to repatriate Prince Cuong-De's remains to Vietnam. This decision comes after the prince's death in Japan, and the Japanese have finally relented to Vietnamese requests for the return of his body.\n\nThe repatriation of Cuong-De's remains is a significant moment for Vietnam. It allows the nation to properly honor the prince's memory and provides closure for his supporters. The remains will be interred with full honors, recognizing Cuong-De's role in Vietnamese history and his contributions to the independence movement.\n\nThis agreement has helped improve relations between Vietnam and Japan, demonstrating that diplomatic solutions can be found even in difficult circumstances. The successful repatriation sets a positive precedent for future cooperation between the two nations."
 VIE_Vinh.12.a: "We can finally honor his memory properly."

 VIE_Vinh.13.t: "Japan Refuses to Repatriate Cuong-De's Remains"
 VIE_Vinh.13.d: "Despite our persistent efforts to negotiate the repatriation of Prince Cuong-De's remains, the Japanese government has refused our request. The Japanese maintain that Cuong-De was a friend of Japan and that his final resting place should remain in the country where he spent his exile.\n\nThis refusal is deeply disappointing for the Vietnamese government and for Cuong-De's many supporters. The inability to bring the prince's remains home has become a source of frustration and has somewhat strained relations between the two countries.\n\nWhile the diplomatic relationship remains functional, this episode has highlighted the limits of what can be achieved through negotiation when fundamental differences in perspective exist."
 VIE_Vinh.13.a: "We must accept their decision, however disappointing."

 VIE_Vinh.14.t: "Honoring the Viet-Quoc's Ill-Fated Struggle"
 VIE_Vinh.14.d: "Prime Minister Vinh has announced plans to honor the memory of the Viet-Quoc (Vietnamese Nationalist Party) and their struggle for independence. Despite the party's ultimate failure and the tragic fate that befell many of its members, Vinh believes it is important to recognize their contributions to the Vietnamese independence movement.\n\nA memorial will be established to commemorate those who fought and died for the cause of Vietnamese independence, even if their methods and ideology differed from the current government. This gesture is intended to promote national unity and acknowledge the complex history of the independence struggle.\n\nHowever, this decision has been met with mixed reactions. Some see it as a positive step toward reconciliation and historical recognition, while others view it as inappropriate, given the Viet-Quoc's past conflicts with various Vietnamese governments.\n\nRegardless of the debate, Vinh is proceeding with the memorial, believing that honoring the past, even its difficult aspects, is essential for building a better future."
 VIE_Vinh.14.a: "We honor all who fought for Vietnam's independence."

 VIE_Vinh.15.t: "Vinh's Questionable Motives"
 VIE_Vinh.15.d: "Rumors and suspicions have begun to circulate about Prime Minister Vinh's true motives and allegiances. Some critics have raised questions about his relationships with various political factions, his handling of the Phuong crisis, and his foreign policy decisions.\n\nThese concerns have been fueled by Vinh's sometimes unpredictable actions and his apparent willingness to make deals with various groups, including the Cao-Dai, the Japanese, and others. Some observers question whether Vinh is truly committed to the best interests of Vietnam or if he is pursuing a personal agenda.\n\nThe prime minister has dismissed these concerns as baseless rumors spread by political opponents, but the questions persist. In a time of great uncertainty and conflict, trust in leadership is crucial, and any doubts about the prime minister's motives can undermine the government's effectiveness.\n\nOnly time will tell whether these suspicions are justified or merely the product of a tense political environment where every action is scrutinized and questioned."
 VIE_Vinh.15.a: "We must trust in our leadership."

 VIE_Toan.1.t: "Formalization of Dan-Xanism and the Dan-Xa Party"
 VIE_Toan.1.d: "The Vietnam Democratic Socialist Party (Dan-Xa Party), also known as the Democratic Socialist Party, was announced by Venerable Buddha Huynh-Phu-So of the Hoa-Hao Buddhist Faith on September 21, 1946 with the help of some Leftist intellectuals such as Nguyen-Van-Sam, Tran-Van-An, Nguyen-Hoan-Bich (Nguyen-Bao-Toan) and lawyer Mai-Van-Dau. Professor Nguyen-hoan-Bich, a Catholic believer, was appointed General Secretary.\n\nA few days before the announcement, the venerable Huynh has called upon a number of trusted followers from all over the country and instructed them as follows:\n\n1 - Due to the national situation, it would be inappropriate for me to use power struggle the Hoa-Hao Buddhist Sangha in the struggle for independence, as the faith focuses on genuine spiritual enlightenment. Therefore, I must organize a political party to better meet the nation's needs.\n\n2 - Genuine patriots in the country, although they acknowledge me as a patriot, cannot unite with me under the name of Hoa-Hao Buddhism to handle national affairs. This is because they cannot practice as I do, or if they already have a religion, they cannot abandon it to convert to Hoa-Hao Buddhism. Therefore, I must organize a political party, while each person should maintain their own religion.\n\n3 - So, all you believers, if you feel you still owe a debt to the nation and country, love the country and the people then join the Viet-Nam Democratic Socialist Party. This is a means for you to practice the Four Virtues.\n\nAfter its establishment, the Dan-xa formed a Central Executive Committee for the Western provinces and various levels of general, provincial, district, and branch committees based on local religious organizations. The party also built its own armed forces to protect the controlled areas and fight against both the French and the Viet Minh."
 VIE_Toan.1.a: "Cach-Mang Con-Nguoi, Cach-Mang Dan-Toc, Cach-Mang Xa-Hoi"

 VIE_Toan.2.t: "Cach-Mang Con-Nguoi - Declaration of the Moral Revolution"
 VIE_Toan.2.d: "In a landmark political and spiritual development and inspired by the revolutionary teachings of Buddha Huynh-Phu-So of the Hoa-Hao Faith, revered by followers as the \"Virtuous Master,\" the party seeks to reshape Vietnamese society through what it calls a Cach-Mang Con-Nguoi, a \"Human Revolution.\"\n\nRejecting both colonial capitalism and orthodox Marxist class struggle, the Dan-Xaists instead argues that Vietnamese society, after decades of foreign domination, has been reduced to a single exploited class. As such, it calls not for class conflict, but for moral reconstruction - aiming to prevent the emergence of future exploitative elites while nurturing what it terms the \"procreative class\": a morally upright, self-sustaining populace grounded in labor, family, and faith.\n\nDrawing from the spiritual doctrines of Hoa-hao Buddhism, the movement emphasizes ethical living as the foundation of national renewal. Its declaration denounces social evils such as gambling, opium use, and exploitative economic practices, including usury and excessive profit-seeking. In their place, it promotes thrift, charity, and the concept of a \"fair price\" economy - where wealth is moderated by moral responsibility.\n\nThe ideological framework also incorporates traditional Confucian ethics, calling for the preservation of the Three Fundamental Bonds - between ruler and subject, father and son, and husband and wife - alongside the Five Constant Virtues: benevolence, righteousness, propriety, wisdom, and trustworthiness. These principles are presented not as relics of the past, but as essential pillars for a harmonious and unified Vietnamese society."
 VIE_Toan.2.a: "Buddha has love for all. They will come to accept him."
 VIE_Toan.2.b: "For the immediate transformation of our society towards Buddha!"

 VIE_Toan.3.t: "Invitation to the Ngo-Dinh Brothers"
 VIE_Toan.3.d: "Leaders within the Dan-Xa Party have turned their attention toward building a broader anti-colonial and anti-communist coalition. Recognizing the growing influence of revolutionary and patriotic figures outside their religious base, the party has extended a formal invitation to Ngo-Dinh-Diem and his brother Ngo-Dinh-Nhu to join or cooperate in shaping a unified national movement.\n\nThis outreach follows Diem's 1949 Socialist Manifesto rejecting the Elysee Agreements and his call for a new revolutionary path - one that would challenge both French colonial authority and the communist-led Viet-Minh. His vision of a social revolution grounded in human dignity and national independence closely parallels the teaching of Revered Huynh and the Dan-Xa Party, which likewise rejects class warfare in favor of moral and social transformation.\n\nMeanwhile, Nhu has been organizing labor-oriented mass-organization organizations, including proposals for a national workers' movement and the establishment of a new forms of revolutionary ideology inspired by Syndicalism, Mournier's Personalism and Marxism. These efforts intersect with Dan-Xa's own emphasis on ethical economics, social justice, and grassroots mobilization among peasants and workers.\n\nThe proposed alliance is not without tension. Differences in religious foundation - between Hoa-Hao Buddhist's Dan-Xa and the Ngo family's Catholic personalism - as well as competing visions of authority and state structure, raise questions about whether such cooperation can endure. Yet, the urgency of the moment may outweigh ideological divides."
 VIE_Toan.3.a: "Love overflows throughout the universe; it could not love only a blushing client."

 VIE_Toan.4.t: "Cach-Mang Dan-Toc - Begin the National Liberation"
 VIE_Toan.4.d: "Amid the intensifying struggle between colonial forces and communist revolutionaries, the Dan-Xa Party and rooted in the teachings of Revered Huynh of the Hoa-Hao Buddhist has formally proclaimed a doctrine of National Revolution and National Liberation.\n\nAt the core of this declaration lies a clear prioritization: national independence above all else. Party leaders argue that without sovereignty, all other reforms - social, economic, or moral - remain impossible. Only a free Nam-Viet, they assert, can stand equal among nations and contribute meaningfully to global peace in line with the principles of the United Nations.\n\nRejecting both colonial domination and Marxist materialism, the Dan-Xa advances a vision of \"All People's Politics,\" grounded in the principle that sovereignty resides entirely in the people. This doctrine explicitly opposes dictatorship in any form, whether imposed by foreign imperialists or domestic materialistic elites such as the Viet-Minh.\n\nInternationally, the movement calls for cooperation among nations based on equality and mutual respect, as well as solidarity with weaker states resisting imperialism. Domestically, it emphasizes national unity, declaring that Vietnam - north, central, and south - is one indivisible entity. In this framework, the Dan-Xa and Hoa-Hao Buddhists followers position themselves as a \"third force,\" distinct from both French colonial authorities and communist insurgents."
 VIE_Toan.4.a: "Love the Nation, love the People."

 VIE_Quang.1.t: "Dinh-Xuan-Quang's New Labor Code Passed"
 VIE_Quang.1.d: "Prime Minister Dinh Xuan Quang has successfully pushed through a comprehensive new labor code that represents a significant step forward for workers' rights in South Vietnam. The legislation includes provisions for minimum wages, maximum working hours, workplace safety standards, and the right to organize.\n\nThis labor code is one of the most progressive pieces of legislation in Southeast Asia, and it has been met with enthusiasm by workers and labor organizations. The code establishes a framework for fair labor practices and provides protections that were previously lacking.\n\nHowever, the legislation has also faced opposition from business owners and some conservative elements who argue that it will increase costs and reduce competitiveness. Despite these concerns, Quang has remained committed to the reform, believing that fair treatment of workers is essential for social stability and economic development.\n\nThe passage of this code represents a major achievement for Quang's government and demonstrates his commitment to social reform and the welfare of the working class."
 VIE_Quang.1.a: "A victory for the working people of Vietnam."

 VIE_Quang.2.t: "Dinh-Xuan-Quang's New Civil Service Regulations Passed"
 VIE_Quang.2.d: "Prime Minister Quang has implemented sweeping reforms to the civil service system, introducing new regulations aimed at improving efficiency, reducing corruption, and ensuring that government positions are filled based on merit rather than connections.\n\nThe new regulations establish clear standards for hiring, promotion, and performance evaluation. They also include provisions for training and professional development, with the goal of creating a more capable and responsive bureaucracy.\n\nThese reforms are part of Quang's broader agenda to modernize the Vietnamese state and make it more effective in serving the people. By professionalizing the civil service, Quang hopes to improve government performance and restore public confidence in the administration.\n\nThe changes have been welcomed by many who see them as a necessary step toward good governance, though some entrenched interests have resisted the reforms. Nevertheless, Quang is determined to see them through, believing that a professional civil service is essential for Vietnam's future."
 VIE_Quang.2.a: "A more professional and efficient government."

 VIE_Quang.3.t: "Establishment of the Saigon Children's Hospital"
 VIE_Quang.3.d: "Prime Minister Quang has officially opened the new Saigon Children's Hospital, a state-of-the-art medical facility dedicated to providing healthcare for the city's youngest residents. This hospital represents a major investment in public health and demonstrates the government's commitment to the welfare of its citizens.\n\nThe hospital is equipped with modern medical equipment and staffed by trained professionals, many of whom received specialized training abroad. It will provide a range of services, from routine care to specialized treatments for serious conditions.\n\nThe establishment of this hospital has been widely praised as a positive development for Saigon and for Vietnam as a whole. It represents not just improved healthcare infrastructure, but also a recognition that investing in children's health is investing in the nation's future.\n\nPrime Minister Quang, in his opening speech, emphasized that this hospital is just the beginning of a broader effort to improve healthcare access throughout South Vietnam. \"Every child deserves quality healthcare,\" he declared, \"and we will work to make that a reality.\""
 VIE_Quang.3.a: "A healthier future for our children."

 # VIE Historical Events
 VIE_Historical.1.t: "Saigon Intellectuals Protest War"
 VIE_Historical.1.d: "Saigon, [?global.date.GetDateStringNoHourLong] Engineer Luu-Van-Lang, the first native engineer of Indochina, has led a small but significant protest in Saigon against our ongoing war against the Northern Communist expansion. Known for his patriotic fervor, Engineer Lang, alongside hundreds of intellectuals, called for an end to hostilities and urged our French benefactors and our authorities to negotiate peace with Ho Chi Minh.\n\nGathered in a public square in front of the Hotel de Ville, 1st District, the protesters held banners and chanted slogans advocating for anti-French stances in the government and peace. They presented a declaration signed by leading intellectuals, demanding immediate negotiations to cease the conflict but it was quickly stopped by the Police and Gendarmerie who quickly swept the Square clean!"
 VIE_Historical.1.a: "It's best to shoot these dissidents next time!"

 VIE_Historical.2.t: "Student Strike at Petrus Ky Lycee"
 VIE_Historical.2.d: "Saigon, [?global.date.GetDateStringNoHourLong] - On the ninth anniversary of the Viet-Minh's Southern Uprising, a massive strike erupted among the students in Saigon. The strike was triggered as an aftermath of the Xac-te's mass arrests of several students from the Petrus Ky Lycee for subversions against our government.\n\nTran-Van-On, an infamous rebellious student, has led a group of students from Petrus Ky Lycee in the protest. Demonstrating exceptional leadership, he guided the march through Saigon's streets, demanding the release of their peers and an end to colonial oppression which has disrupted many daily activities in Saigon."
 VIE_Historical.2.a: "We really need to restore stability!"

 VIE_Historical.3.t: "The Students Are Back in the Streets"
 VIE_Historical.3.d: "The demonstration has re-formed in Saigon, larger than the last one. Six thousand students and teachers from a dozen schools are in the streets behind Tran-Van-On, demanding the release of the peers arrested a fortnight ago and a general political liberalisation, and they are demanding it of [VIE.GetLeader] by name.\n\nBy one o'clock the gendarmerie and the Xac-Te were deployed in strength. Water cannon were used, batons were used freely after that, and the crowd was broken up rather than dispersed. A hundred and fifty are under arrest and thirty are seriously hurt.\n\nThe crowd has not gone home; it has moved. Our commanders in the city report that the numbers on the streets tonight are higher than they were at noon, and they are asking for a decision rather than for reinforcements. There are two ways to take a city back and the government must choose between them before morning."
 VIE_Historical.3.a: "Let negotiate with them, we can at least implement some of their demands"
 VIE_Historical.3.b: "No compromises, shoot them down."

 VIE_Historical.4.t: "Tran-Van-On's Death"
 VIE_Historical.4.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Tran-Van-On was shot by our police in the First District while helping another student over the wall of a government building. He was carried to Cho-Ray and died there at half past three in the afternoon.\n\nHe was nineteen years old. That figure is in every report crossing this desk and will be in every newspaper by morning, and there is no version of the incident in which it is not the first thing anybody learns.\n\nThe shooting was meant to end the unrest and has done the opposite with a completeness nobody anticipated. The demonstrations are larger tonight than they were this morning and the temper of them has changed - what was a demand for the release of prisoners is becoming something else. The moderates in the student movement have lost the argument to the men who said all along that this government answers nothing but force, and the French authority is now being named in the same breath as ours."
 VIE_Historical.4.a: "We need to do something quick!"

 VIE_Historical.6.t: "Negotiations with Tran-Van-On"
 VIE_Historical.6.d: "Saigon, [?global.date.GetDateStringNoHourLong] - With order in the city gone and the demonstrations growing by the day, the government chose to talk. [VIE.GetLeader] received Tran-Van-On at the Hotel de Ville in a meeting of perhaps an hour, with no officials of the High Commission present and none informed beforehand.\n\nWhat was conceded is modest on paper: a more liberal regime in the prisons, wider academic freedom, and an undertaking that the government will actively promote Vietnamese patriotism and Vietnamese culture. The streets emptied within two days, which is more than the gendarmerie achieved in a fortnight.\n\nParis is furious. A letter of protest arrived before the ink on the communique was dry, arguing that the concessions undermine stability and open the schools to communist infiltration. The letter does not say the other thing, which is that a Vietnamese government settled a Vietnamese quarrel without asking, and that the precedent is worse for the High Commission than any of the reforms."
 VIE_Historical.6.a: "It's the \"best outcome.\""

 VIE_Historical.7.t: "Tran-Van-On's Funeral"
 VIE_Historical.7.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Permission was granted, and Tran-Van-On lay in state for three days at a farewell house on Thuan-Kieu Street. A funeral altar and spirit tablet were raised at the Petrus Ky school, where the students came to their classes in black armbands and were not stopped.\n\nOver those three days the mourners were workers, intellectuals, businessmen, civil servants, artists, journalists and students, and they left more than three hundred wreaths behind them. One of the wreaths came from the French \"Soldats democrates\", which is the detail our own press has been advised to leave out.\n\nThe funeral drew some twenty-five thousand into the procession itself and perhaps three hundred thousand more into the streets to watch it pass. It was led by the engineer Luu-Van-Lang, the lawyer Trinh-Dinh-Thao, Nguyen-Huu-Tho and a number of men on whom the Surete keeps files, and it ended at the Cho-Lon cemetery. A schoolboy shot during a demonstration has produced the largest gathering this city has seen since the war."
 VIE_Historical.7.a: "It ended... for now?"

 VIE_Historical.8.t: "Red Cross Society founded"
 VIE_Historical.8.d: "Doctor Ho-Van-Nhut has founded the Hoi Hong-Thap-Tu, the Red Cross Society, and the International Committee accepted the affiliation with unusual speed. It carries the name of the Vietnam Red Cross Society and works from a house on Hong-Thap-Tu street in Saigon.\n\nThe need for it requires no argument. Between the war and a bad run of floods, basic medicine has been failing in the provinces for three years, and the civil administration has neither the staff nor the standing to reach the places where it fails worst.\n\nNhut has raised the money and spent it quickly. There is a headquarters, there is the first nursing school in the south staffed and taught by Vietnamese, there is a free course in first aid open to anyone who walks in, and there are clinics for the poor in districts that have never seen a doctor paid by anybody. It is the Khai-Tri argument made in brick and bandages: that a people educated and treated by its own hands is already halfway to governing itself."
 VIE_Historical.8.a: "Glad to see the Khai-tri cause is still ongoing"

 VIE_Historical.9.t: "The Return of Captain d'Hers"
 VIE_Historical.9.d: "Captain Jean d'Hers of the French gendarmerie was refused a posting to metropolitan France in 1940 and spent the rest of his war in Indochina instead, first collecting intelligence for the Allies and then, once the Japanese took full control in 1945, fighting them in the hills with whatever men he could recruit. He blew bridges, ambushed columns, and was killed leading a handful of them against two hundred Japanese troops.\n\nHis body and those of his companions have been exhumed from the Cochinchinese jungle where they were buried, and carried through Saigon to the docks by a procession of gendarmes and old resistance men, for shipment home to France. The city was quiet as the ship cleared the river.\n\nThere is no dispute about what the man did. There is a great deal of dispute about what the funeral was for. To the French community it was the honouring of a hero and was arranged as such. To a good many Vietnamese watching from the pavement it was a colonial order collecting its dead and taking them away, and they read the procession as a departure rather than a tribute. Our government must decide which of those meanings it cares to endorse in public."
 VIE_Historical.9.a: "Honor the Fallen Hero"
 VIE_Historical.9.b: "Focus on the Future"

 VIE_Historical.10.ta: "The Attempt on Governor Thai-Lap-Thanh Fails"
 VIE_Historical.10.tb: "Governor Thai-Lap-Thanh and General Chanson Assassinated"
 VIE_Historical.10.tac: "Thai-Lap-Thanh and Chanson Walk Away"
 VIE_Historical.10.tbc: "The Killing of Thai-Lap-Thanh and Chanson"
 VIE_Historical.10.da: "An attempted assassination targeting Governor and Mayor of Saigon-Cholon Thai-Lap-Thanh and General Charles Chanson, commander of the French Expeditionary Corps (CEFEO) in Southern Indochina shook the southern city of Sadec today. As the two leaders arrived for an inspection tour, a man in military garb broke through the security perimeter and detonated multiple grenades near their Delage D8 vehicle.\n\nQuick reflexes and sheer luck spared both men from certain death. While Governor Thai sustained minor shrapnel injuries and General Chanson was temporarily deafened by the blast, both are now recovering and have vowed to continue their duties.\n\nThe assailant, identified as a member of the Thanh-nien Bao-Quoc milita ((Youth Group for the Defense of the Fatherland))  with suspected ties to the Viet-minh, was killed instantly in the explosion. Security forces are on high alert, and a major investigation is underway to dismantle any networks connected to the failed plot."
 VIE_Historical.10.db: "National mourning grips our nation as beloved Governor and Mayor of Saigon-Cholon Thai-Lap-Thanh and General Charles Chanson, commander of the French Expeditionary Corps (CEFEO) in Southern Indochina, were assassinated in a violent attack during an official inspection tour in Sadec.\n\nAs their car slowed near the Sa-dec City Hall, a man dressed in a khaki uniform broke through the security line and detonated eight grenades wrapped in plastique, killing both men and wounding several high-ranking officers. The attacker has been identified as a militant of the Thanh-nien Bao-quoc (Youth Group for the Defense of the Fatherland) - a nationalist paramilitary group - but recent intelligence suggests deep covert ties to the Viet-minh.\n\nThis targeted strike has dealt a severe blow to both the administrative and military leadership of the South. With rumors swirling of a broader Communist's influence within anti-colonial sects, a new wave of political instability may be on the horizon."
 VIE_Historical.10.dac: "An operation coordinated through underground sympathizers in Thanh Nien Bao Quoc Milita has failed to eliminate key colonial collaborators in Sadec. Governor Thai Lap Thanh and General Charles Chanson, both symbols of French domination and repression, narrowly escaped death when a suicide attacker detonated grenades near their vehicle.\n\nWhile several officers and civilians were injured, the primary targets survived. Intelligence confirms the attacker had direct ideological alignment with the Front for National Liberation, though we were not in direct command of the operation. The failed strike, while courageous, risks tightening the colonial grip on Saigon and deepening factional distrust within the anti-colonial movement.\n\nPropaganda efforts must now carefully navigate the fallout to preserve morale and prevent reprisals from alienating our broader base."
 VIE_Historical.10.dbc: "News from the Mekong Delta reverberates across the resistance: Governor Thai Lap Thanh, a long-time landowning lackey of the French, and General Charles Chanson, chief of the Southern Expeditionary Forces, have been assassinated in the heart of Sadec.\n\nThough the attack was officially carried out by a member of the Thanh Nien Bao Quoc Paramilitary, whispers from our network confirm the assassin had deep sympathies for the Viet Minh cause and maintained active covert ties with our operatives. His sacrifice is another crack in the structure of puppet governance.\n\nWith South Vietnamese goons now scrambling to secure their leadership and French command in disarray, our propaganda offices are already hailing the action as a victory for national liberation and martyrdom for the revolutionary cause."
 VIE_Historical.10.a: "We need to improve the protections for our officials"
 VIE_Historical.10.b: "A farewell to a beloved friend of the people"
 VIE_Historical.10.ac: "Even in failure, the flame of resistance burns brighter"
 VIE_Historical.10.bc: "From the shadows, the revolution sharpens its blade."

 # Initial Cuong-De
 Initial_CuongDe.0.t: "An Unexpected Offer"
 Initial_CuongDe.0.d: "Today, a letter was sent directly to the Head of State Bao-Dai from Hoang-Nam-Hung who was a Phuc-Quoc revolutionary and second-in-command comrade of the infamous exiled Japanese collaborator Prince Cuong-De.\n\nIntriguingly, the contents of the letter were written directly by Hung and it contains countless praises towards the Head of State and our government's achievement in our struggle against Communism. The letter then concluded with a personal offer from Hung himself to raise an elite Anti-Communist Militia unit in Cochinchina which will be staffed with ex Phuc-Quoc and ex IJA members.The Xac-Te was also able to confirm past activities of Hung including being an ex-KMT Major General in the 1930s but we will need to rethink the decision wisely. On one hand, we do need all of the help we can get for the Quoc-Gia cause but Hung is confirmed to still be supporting Cuong-De's cause and will be difficult to contain."
 Initial_CuongDe.0.a: "One struggle! We will put your talent to use in the battlefield!"
 Initial_CuongDe.0.b: "We can only offer a minor governmental post due to secruity reasons."

 Initial_CuongDe.1.t: "Cuong-De's Ambitions"
 Initial_CuongDe.1.d: "Gia-Long, first Emperor of the Nguyen dynasty, experienced the devastating tragedy of outliving his own eldest son, Prince Nguyen-Phuc-Canh, who did leave behind a son prior to his death. Despite that, the throne was passed to Gia-Long's fourth son, Minh-Mang, ancestor of our current Head-of-State Bao-Dai. But the past has come back to haunt us once more, for Cuong-De, descendant of Prince Canh, has become quite a thorn in our side by utilizing his heritage to further his personal political goals.\n\nEducated in Japan, Cuong-De was a key figure in the Dong Du (On the Way to the East) movement, which sponsored some 200 Vietnamese to study in Japan. Facing much persecution from the French, he still nonetheless evaded capture and found the Viet-Nam Quang-Phuc Hoi (Vietnam Restoration Organisation) alongside Phan-Boi-Chau in 1911, hoping to overthrow French colonial rule in Vietnam and establish a democratic republic. The organization failed to gain momentum, crippled by arrests of its members. Cuong-De did not give up, however, and later created the Viet-Nam Phuc-quoc Dong-minh Hoi (League for the Restoration of Vietnam) in 1938 and attempted to court Japanese support.\n\nNow that order has been restored to our country and the French has returned, Cuong-De's ambitions can not be left unchecked any longer. Having given a public press conference declaring his intent to return to Vietnam and form an opposition to our government, we must make sure that this illegitimate upstart does not gain any further influence. Proposals personally drafted by Bao-Dai will be sent to major foreign powers like France and the United States requesting that they ignore Cuong-De, while a diplomatic protest will be issued to Japan for hosting him as a citizen."
 Initial_CuongDe.1.a: "He will be relegated to a footnote in history."
 Initial_CuongDe.1.b: "Bao-Dai is a traitor to Vietnam, Cuong-De is the only way!"

 Initial_CuongDe.2.t: "Bao-Dai Requests Us to Ignore Cuong-De's Letters"
 Initial_CuongDe.2.d: "The Vietnamese government has asked us to leave Prince Cuong-De's letters unanswered. The request came through their embassy, and it was made with rather more urgency than the matter appears on its face to warrant.\n\nThe prince is not a simple proposition. He wants Vietnam out of colonial hands, which is inconvenient, and he has been pro-Japanese since before most of our officials were born, which is worse. Set against that, he is no communist, he has a following, and he is at present dependent upon nobody whatever.\n\nThere are therefore two ways of reading the file. We may honour Bao-Dai's request, decline the correspondence, and keep our hold on Vietnam upon the terms we have. Or we may answer the letters, and discover whether a prince with no resources of his own might be brought to depend on us instead of on a Chief of State who has demonstrated that he cannot govern."
 Initial_CuongDe.2.a: "We already have enough problems as it stands."

 Initial_CuongDe.3.t: "Bao-Dai Condemns Us for Hosting Cuong-De"
 Initial_CuongDe.3.d: "Bao-Dai has attacked us in public for harbouring the traitor Cuong-De, and the language of the statement leaves very little room for a quiet settlement. His government says we keep the prince as an instrument with which to undermine it, and has rehearsed at length the case against his fitness to rule: forty years of failed attempts to liberate Vietnam, and a war spent on the wrong side of it.\n\nThe vehemence is itself informative. Cuong-De's statements appear to be finding an audience in Vietnam, and Saigon would not be shouting if it were confident. Their ambassador has been explicit with our Foreign Ministry - continuing to host the prince will damage relations, and an embargo is not being ruled out. The French have added a complaint of their own, that Cuong-De is undermining the restoration of order.\n\nThe prince has asked repeatedly to be sent home. Nobody has been able to explain how it could be arranged; he cannot land at Saigon, and no third country will carry him. Some in our intelligence service have proposed simply putting him across a border and letting him make his own way from there."
 Initial_CuongDe.3.a: "Refuse to Comment on the Matter."
 Initial_CuongDe.3.b: "Cuong-De Will Remain in Our Country."
 Initial_CuongDe.3.c: "We Must Expel Cuong-De for His War Crimes During WW2."

 Initial_CuongDe.4.t: "Cuong-De Announces His Return to Vietnam"
 Initial_CuongDe.4.d: "Prince Cuong-De has recently declared his intent on returning to Vietnam to reclaim his position as the Emperor of Vietnam as a descendant of Prince Nguyen-Phuc-Canh. While this can spell trouble for the Bao-Dai government, only time will tell whether Cuong-De will succeed in his goal or not."
 Initial_CuongDe.4.a: "An ambitious man, let's keep tabs on him for now."

 Initial_CuongDe.5.t: "Cuong-De's Voyage"
 Initial_CuongDe.5.d: "Reports have it that Prince Cuong-De is on his way to Vietnam from Tokyo via Hong Kong and Bangkok in disguise. He's planning to sneak into Vietnam by going through the Hong Kong-Bangkok route. Let us make a plan on intercepting him at Bangkok and see if we could foil his plot to overthrow Bao-Dai."
 Initial_CuongDe.5.a: "A problem soon resolved."

 Initial_CuongDe.6.t: "Cuong-De in Bangkok"
 Initial_CuongDe.6.d: "While at Bangkok, agents have spotted Prince Cuong-De in disguise. It seems that the prince disguises himself as a Chinese man with a fake passport. With the prince near their grasp, the agents commence their action to arrest him, and the result is..."
 Initial_CuongDe.6.a: "Cuong-De is apprehended."
 Initial_CuongDe.6.b: "Cuong-De eludes our grasp!"

 # Similar to Etat_du_Vietnam.1, except from Cuong-De's perspective
 Initial_CuongDe.7.t: "Bao-Dai Annexes the Provisional State of Cochinchina"
 Initial_CuongDe.7.d: "Chief of State Bao-Dai has proclaimed the annexation of the Provisional State of Cochinchina. Nam-Ky Quoc, governed since the war as a semi-autonomous republic with an assembly of its own, ceases to exist, and its territory passes to the State of Vietnam under the terms agreed at the Elysee in March. The French National Assembly gave its consent in late May, which was the only consent legally required.\n\nFor this government it is the whole argument won on paper. The separation of Cochinchina was the device by which Paris kept the richest third of the country outside any Vietnamese state, and it stood as the standing rebuke to every claim Bao-Dai has made to speak for a single Vietnam. He can now say the country is whole, and he intends to say it often.\n\nThe rebuke has not disappeared; it has only changed hands. Cuong-De's people are already calling the annexation a parcel wrapped by the colonial administration to disguise the fact that nothing beneath the paper has moved - the same officials, the same garrisons, the same budget voted in Paris. Their charge is that a unified Vietnam under a compliant Chief of State is worth less to the nation than a divided one under a leader who would not be compliant, and it is being listened to."
 Initial_CuongDe.7.a: "Time is ticking"

 Initial_CuongDe.8.t: "Cuong-De's List of Reforms"
 Initial_CuongDe.8.d: "Saigon, [?global.date.GetDateStringNoHourLong] - The exiled collaborator has written to the Chief of State again. It is not the first letter this year and it is the first to contain a concrete proposal.\n\nCuong-De writes of his concern for Vietnam's bleak future and asks that a diplomatic mission be sent to Japan to conclude a commercial treaty, which he argues at some length, and with figures, would do more for the economy than anything presently before Parliament. He offers himself as mediator between the two parties, and observes that his Japanese connections would very probably see the thing approved.\n\nThe economics are not obviously wrong, and that is the whole difficulty. A man barred from the country is proposing a treaty this government could not negotiate on its own account, and offering to negotiate it on our behalf. Every month the letters go unanswered is a month in which he may say he offered and we refused."
 Initial_CuongDe.8.a: "Let's just ignore this for now..."

 Initial_CuongDe.9.t: "Cuong-De Demands Urgent Reforms"
 Initial_CuongDe.9.d: "After countless attempts to take power, subsequently getting caught in Bangkok and Hong Kong by the Xac-Te, Prince Cuong-De still stubbornly sends letters to the Chief of State Bao-Dai. The latest letter contains political rambling which ended with six demands for our government to act upon:\n\n    1. To create a commission to handle and exercise power to \"provide for the people.\"\n    2. Retain French civil servants as \"friends of the people.\"\n    3. Establishing a commission to deal with of people, particularly members of the Royal Family.\n    4. Creation of a commission to translate Vietnamese works relating to hygiene.\n    5. Outfit each village with loudspeakers and telegraph lines.\n    6. Adopt a generous attitude in combatting the communists and opposition.\n\nThe letter then ended with another demand from the exiled Prince. A request to send a Mandarin to Japan to establish economic trade with Japan."
 Initial_CuongDe.9.a: "Can we blacklist him from the Post Service?"
 Initial_CuongDe.9.b: "Perhaps we can entertain his Japanese trade proposal."

 Initial_CuongDe.10.t: "[VIE.GetLeader] Proposes Economic Ties"
 Initial_CuongDe.10.d: "The Vietnamese government has sent a formal proposal to Japan seeking to establish closer economic ties between the two nations. The proposal includes provisions for trade agreements, investment opportunities, and technical cooperation in various sectors.\n\nThis initiative represents Vietnam's interest in diversifying its economic relationships and reducing dependence on Western powers. For Japan, it offers access to Southeast Asian markets and resources, as well as an opportunity to expand its influence in the region.\n\nThe proposal has been received with interest in Tokyo, where officials are considering the potential benefits of closer economic cooperation with Vietnam. The relationship could be mutually beneficial, with Japan providing technology and investment while Vietnam offers markets and resources.\n\nWhether this proposal will lead to a formal economic partnership remains to be seen, but it represents an important step in building the relationship between the two Asian nations."
 Initial_CuongDe.10.a: "We look forward to their response."

 # Cuong-De
 CuongDe.1.t: "Cuong-De Spotted in Tay-Ninh"
 CuongDe.1.d: "Recently, news of Prince Cuong-De's arrival in Tay-Ninh did not remain unnoticed by the Vietnamese government. It seems that Cuong-De's arrival in Tay-Ninh has rallied many Cao-Dai and non-Caodaist supporters alike against Bao-Dai's government. Bao-Dai can choose to act now to snuff any chance of Cuong-De retaking the imperial throne or ignore this problem for now since the nation is still at war."
 CuongDe.1.a: "We must act now."

 CuongDe.2.t: "Xac-Te Warns of Growing Cuong-De Influence"
 CuongDe.2.d: "The Xac-Te have put a report on the Chief of State's desk, and the substance of it is one sentence: Cuong-De is winning the argument. The prince's promise to free Vietnam from colonial rule is being repeated in places our own broadcasts do not reach, by people who have never set eyes on him.\n\nThere is worse in the body of the report. Accounts that are unconfirmed but consistent have his agents approaching the British and the Americans, offering them a Vietnamese nationalism that is anti-communist without being French. Should either government take that offer seriously, our position becomes difficult very quickly.\n\nThe Xac-Te do not customarily editorialise and have done so here. Their assessment is that the prince's movement can still be broken, that it will not remain breakable for much longer, and that inaction is itself a decision for which the Chief of State will be answerable."
 CuongDe.2.a: "Seriously, we must act ASAP."

 CuongDe.3.t: "A Plea from Cuong-De"
 CuongDe.3.d: "We have received reports of Prince Cuong-De's attempt to appease the French colonial government. It seems that Prince Cuong-De tries to convince the French government that Bao-Dai is incompetent and that he would be a better leader for Vietnam if the French supports his bid for power. If Bao-Dai does not act soon, he will lose his power and have to spend his time in exile."
 CuongDe.3.a: "Let's hope they don't get any bright ideas."
 CuongDe.3.b: "Cuong-De is the most reasonable option."

 CuongDe.4.t: "Cuong-De Flees to Japan!"
 CuongDe.4.d: "The prince has lost. Every calculation of the last two years assumed Bao-Dai could be outmanoeuvred, and Bao-Dai has not been. The plot is broken, the men behind it are scattered, and Cuong-De is aboard a ship.\n\nHe goes to Tokyo, where he spent the previous forty years and where the Ando family will take him in again. He is barred from Vietnam for the remainder of his life by decree, and this time the decree stands behind a government that has beaten him rather than one that merely disliked him.\n\nThat is the imperial claim finished. It ought to be an entirely comfortable thought, and it is not: the prince came a great deal nearer than anybody in the palace admitted at the time, and the men who backed him have not been arrested. They have only been disappointed."
 CuongDe.4.a: "Too close for comfort."

 CuongDe.5.t: "Cuong-De Crowned Head of Vietnam?"
 CuongDe.5.d: "The coup has held, and Cuong-De has taken the throne as the Nam-Hung Emperor of the People's State of Vietnam.\n\nThe coronation address was longer on programme than on ceremony. He undertook to clear Bao-Dai's corruption out of the government, to carry through the reforms this country has been promised for a decade, to settle the sect question, and to unify Vietnam under a single administration. His own supporters cheered every clause of it. A number of foreign governments have said, carefully, that they note the change with interest.\n\nNot one word of it is yet done. He holds the palace, the capital, and the loyalty of a coalition assembled for the purpose of removing one man - and that coalition has now accomplished the only thing on which all of its members agreed."
 CuongDe.5.a: "He actually did it."

 CuongDe.6.t: "Purging of Bao-Dai's Army"
 CuongDe.6.d: "This morning, Emperor Nam-Hung announced the retirement of many generals loyal to Bao-Dai. While this move has met widespread approval from citizens and those within the rank and file that hate Bao-Dai, many Bao-Dai loyalists obviously did not take this news well. Regardless, with all of Bao-Dai's loyalists purged, the Emperor will less likely face any resistance from Bao-Dai."
 CuongDe.6.a: "Good riddance"

 CuongDe.7.t: "Bao-Dai Settles in Paris"
 CuongDe.7.d: "Bao-Dai has left the country. The people had already gone, the Vietnamese political class went next, and when Paris stopped returning his calls there was nothing left holding him up. The Emperor's retirement of his loyalists from the ministries and the general staff removed the last of it.\n\nThe decree from Phu-Xuan is permanent. He is sentenced to exile and forbidden to set foot in Vietnam again, and he took the aeroplane to France without contesting it. He was last seen in Paris, which is where he has always been most comfortable and where he will now remain.\n\nThat is the whole of his record: the last emperor of the Nguyen, the first Chief of State of a Vietnamese republic, and the first of either to end his life in a French apartment. His enemies will say he was never anything but a French appointment. It would be more accurate, and less comfortable, to say that he was the arrangement this country tried before it tried us."
 CuongDe.7.a: "So long Bao-Dai."

 CuongDe.8.t: "Nam-Hung's Dan-Vuong Idea"
 CuongDe.8.d: "The Emperor has published the doctrine he means to reign by, and it is not the doctrine of any emperor before him. He calls it \"Dan-Vuong\", popular monarchy, and by his own account he has been working at it for the greater part of his exile.\n\nThe construction marries Sun Yat-Sen's Three Principles to the throne. The sovereign holds executive office and exercises it in the common interest; a parliament with real powers holds the legislative one. It is neither the imperial system nor a republic, and it is not offered as a stage on the way to either.\n\nThe argument for it is that Vietnam cannot return to an emperor who reigns without governing, and could not survive a republic that spent its first decade deciding who was entitled to lead it. Whether a doctrine can hold that middle ground under the pressures now bearing on this country is precisely what the next few years will decide."
 CuongDe.8.a: "A new idea for a new era!"

 # Event for Japan
 CuongDe.9.t: "Nam-Hung's Pursuit for Economic Collaboration"
 CuongDe.9.d: "Vietnam's Emperor Nam-Hung has personally sent a telegram to our government, requesting for a diplomatic mission to Tokyo to establish economic collaboration between the two nations. The telegram also includes a thank you to our government for supporting the Emperor's cause and helping the Emperor in regaining the throne of Vietnam."
 CuongDe.9.a: "Let's see what they have to say."

 CuongDe.10.t: "A Telegraph to Our Benefactors"
 CuongDe.10.d: "The Ministry of Foreign Relations has spent a week helping the Emperor draft a single telegram, which says most of what needs saying about the delicacy of the exercise. It is addressed to President [FRA.GetLeader], to the Ministry of Overseas France and to the Assembly, and it must thank a colonial power for its assistance without conceding that the assistance was ever owed.\n\nThe text proposes a \"Friendship Association\" to carry on cultural exchange and diplomatic missions between the two countries. It carries the Emperor's personal thanks for French aid to our cause. It closes on the war against the Northern Marxists, phrased so that Paris may read it as a request for more and our own newspapers may read it as a statement of confidence.\n\nNone of this is affection. The Emperor came to the throne over French objections and at the expense of a French client, and that is not forgotten in the Rue Oudinot. The telegram exists to make acting on the memory expensive."
 CuongDe.10.a: "Hopefully, they will be satisfied for now."

 CuongDe.11.t: "A Telegraph from Nam-Hung"
 CuongDe.11.d: "A telegram has arrived from Phu-Xuan, signed personally by the newly enthroned Emperor of Vietnam, and addressed to President [FRA.GetLeader], to the Ministry of Overseas France and to the Assembly together. It opens by wishing the Republic a life overfilled with riches, happiness and prosperity, which is either courtesy or comedy depending on the reader.\n\nIt proposes a Friendship Association to carry cultural exchange and diplomatic missions between the two countries, and it is drafted with more care than the salutation suggests. Nothing in it asks for anything, which in a first communication from a sovereign we did not choose is itself a manoeuvre.\n\nThe sting is in the last paragraph. Nam-Hung thanks us at length for having preferred the Cuong-De solution to the failed Bao-Dai solution in the present situation, and undertakes not to sleep nor stop until peace and order are restored in Indochina. He is thanking us for a decision the Quai d'Orsay spent two years resisting, and he has put it in writing so that we cannot pretend otherwise."
 CuongDe.11.a: "Perhaps our choice was right all along."

 CuongDe.12.t: "The Buu-Nhu Labor Reforms"
 CuongDe.12.d: "After months of pressing, Ngo-Dinh-Nhu and Tran-Quoc-Buu have carried their labour bills through Parliament with the Emperor's support behind them. The measures are modest on their face: workers' organisations are legalised, wages are given a floor of 250 dong the hour, and medical care for workers is made free at the point of use.\n\nThe reception has been anything but modest. The bills were known in every working district of the south within days, and the Emperor, Nhu and Buu are now spoken of together as heroes of the Can-Lao cause - a phrase this government did not coin and cannot easily disown.\n\nSome nationalists have called the package Marxist in all but name, and they are not entirely wrong about where its authors learned their trade. Most of the political organisations have taken the other view: that this is the first occasion on which the government has done what the Dan-Vuong Manifesto said it would do. \"...we shall ensure every single of our decisions, struggles and goals are fully aligned with the common workers' goals and desires...\""
 CuongDe.12.a: "The first step in providing the working masses with a comfy home and a tasty meal!"

 CuongDe.13.t: "Du-So 4/HD/DP"
 CuongDe.13.d: "The vote is in at fifty-one to forty-nine. \"Du-So 4/HD/DP\" passes, after months of delay and of argument between the Emperor, Parliament and the National Popular Front.\n\nThe Du was among the first reforms put forward at the beginning of the reign, and the clause that held it up is the one suspending indefinitely the activity of every political party and organisation outside the Phuc-Quoc Hoi, for the security and stability of the country in wartime. The parties concerned have had months in which to say what they thought of it, and they have used every one of them.\n\nTwo votes decided the matter. When the ratification is signed, the organisations that opposed it cease to exist in law, and a good many of the men who voted against it this morning will find themselves standing outside the only party left."
 CuongDe.13.a: "A necessary evil."

 CuongDe.14.t: "Disappointing, Yet Expected"
 CuongDe.14.d: "The response from the international community to our requests for support has been disappointing, though not entirely unexpected. Many nations have been hesitant to commit significant resources to our cause, citing their own priorities and concerns about getting involved in another conflict.\n\nWhile we have received some expressions of sympathy and limited assistance, the level of support we had hoped for has not materialized. This is frustrating, but it is also a reality we must accept. The world is focused on other issues, and Vietnam's struggle, while important to us, is not at the top of everyone's agenda.\n\nHowever, we must not be discouraged. We will continue to make our case to the international community, and we will continue to fight for our independence and our future, with or without external support. Our cause is just, and we will persevere.\n\nThis disappointment serves as a reminder that we must rely primarily on our own strength and determination. We cannot depend on others to save us - we must save ourselves."
 CuongDe.14.a: "We will continue our struggle regardless."

 CuongDe.15.t: "Our Cause is Heard"
 CuongDe.15.d: "Excellent news! Our diplomatic efforts have borne fruit, and we have received significant support from key international partners. The United States and Japan have responded positively to our requests, providing both material assistance and diplomatic backing.\n\nThis support includes military equipment, economic aid, and political recognition of our government. The assistance will help strengthen our position and enable us to better resist the communist threat from the North.\n\nThe international community's response demonstrates that our cause is being heard and that there are nations willing to stand with us in our struggle. This support is not just about material aid - it is also about recognition and legitimacy, which are crucial for our long-term success.\n\nWe are grateful for this assistance, and we will use it wisely to advance our goals. With this support, we are better positioned to achieve our objectives and secure a better future for Vietnam."
 CuongDe.15.a: "We are not alone in this struggle."

 CuongDe.16.t: "Emperor Nam-Hung Unveils New National Flag for Vietnam"
 CuongDe.16.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - The Emperor has unveiled the national flag, at a ceremony arranged to leave no doubt that the design was settled by him and not by a committee. It takes the three red stripes of the old State of Vietnam and marries them to the banner the Phuc-Quoc Association proposed in exile.\n\nThe three bands are arranged to form the character \"Vuong\" - kingship - and stand for the mandate of heaven, the Vietnamese nation, and the revolutionary government. Beneath them runs a white bar for the power of the people, for equality, and for purity. The field is gold, for the unity and the wealth of the Vietnamese regions and of the emperors who held them.\n\nA flag that reads as a sentence is a claim about what the state is for, and this one argues the whole Dan-Vuong case in a single piece of cloth: an elected emperor and the working people in the same design, with neither placed above the other. Whether the country reads it that way is another matter, and it will be flying over every province office by the end of the month."
 CuongDe.16.a: "The Dan-vuong's banner shall reign supreme!"

 CuongDe.17.t: "The Emperor Is Dead"
 CuongDe.17.d: "The Office of the King has telegraphed the government and Prime Minister [VIE.GetLeader]. The Emperor is dead. Nam-Hung died at the Phu-Xuan Medical University after a month in which the illness he had kept to himself for far longer could no longer be kept from anyone. It was broadcast across the country within the hour.\n\nThe Office has published the eulogy together with the memoir he finished this year, his revolutionary record, and the achievements of a reign that lasted a fraction of the exile which preceded it. His recorded last words were \"Phai dung lai Chien-cuoc nay ...\" - we must stop this war, transmit this to our people - and with them he asked that the fatherland be reunified and that it stand against Western imperialism.\n\nThe reign was short. The Dan-Vuong model is not, and it is now the property of whoever proves able to hold it. A country that was a colony within living memory carries a weight in this region that it did not carry five years ago, and the men who will inherit the throne's authority have already begun counting what they hold."
 CuongDe.17.a: "Rest in peace, our beloved Emperor."

 CuongDe.101.t: "[GetNewspaperHeader]Death of Nam-Hung, Emperor of Vietnam"
 CuongDe.101.d: "Phu Xuan, [?global.date.GetDateStringNoHourLong] - Emperor Nam-Hung, known before his accession as Prince Cuong-De, has died at the age of 70. An official telegram transmitted to the United Nations gives the cause as lung cancer and the place as the Phu-Xuan Medical University, at the end of a long illness the court had not made public.\n\nA direct descendant of Gia-Long, Nam-Hung spent more than forty years in exile before returning to claim the Vietnamese throne in a period of colonial retreat and ideological war. His ascent rested on a coalition whose members agreed on very little beyond their opposition to Bao-Dai - Cao-Dai militias, Japanese officers who never went home, and Kuomintang formations that had crossed the Chinese frontier - and it was assembled a great deal faster than anyone expected it to hold.\n\nHis reign was brief and his doctrine will likely outlast it. Dan-Vuong, which its adherents render as People-Monarchism, sought to fuse imperial authority with revolutionary nationalism, and there is now no obvious hand to hold the two together. Supporters credit the Emperor with holding much of Vietnam intact and giving the country a voice of its own in the region. Critics answer that the coalition and the foreign backing were the reign, and that neither can be inherited."
 CuongDe.101.a: "We must stop the war in Indochina."

 # Cuong-De Ngo-Dinh
 CuongDe_NgoDinh.1.t: "The Ngo-Dinh Brothers Evade Arrest!"
 CuongDe_NgoDinh.1.d: "Great news! Before Bao-Dai's agents could arrive at the Ngo-Dinh's resident, we have successfully smuggled them to safety. Since Ngo-Dinh-Diem has been Prince Cuong-De's supporter even before the war, let us recruit his brother, Ngo-Dinh-Nhu to our cause as well. The escape of the Ngo-Dinh's brother could potentially be the beginning of the end to Bao-Dai's regime."
 CuongDe_NgoDinh.1.a: "That was a close one."

 CuongDe_NgoDinh.2.t: "Bao-Dai Has Jailed the Ngo-Dinh Brothers!"
 CuongDe_NgoDinh.2.d: "The Xac-Te reached the Ngo-Dinh residences before we did. Diem and Nhu were taken from their homes on Bao-Dai's warrant and are being held on charges nobody has troubled to specify, and three months of careful approach have come to nothing.\n\nIt is a loss and not a defeat. Neither brother has been harmed, both are far too well known to be quietly disposed of, and Bao-Dai has just shown the whole country that he is afraid of two men with no army between them.\n\nThe work moves to Paris. If the French can be brought round to the prince's return, the release of the Ngo-Dinh brothers becomes a clause in the settlement rather than a favour to be begged, and men set free by a new sovereign tend to remember whose name was on the order."
 CuongDe_NgoDinh.2.a: "Curse that Bao-Dai."

 CuongDe_NgoDinh.3.t: "Recruitment of the Ngo-Dinh Brothers"
 CuongDe_NgoDinh.3.d: "With the brothers out and safe, the offer was put to them directly. Both have accepted it.\n\nDiem was never really in doubt. He has backed the prince's claim since long before it was respectable to do so, and has paid for the position more than once. What he brings is not a change of mind but a reputation that cannot be purchased at any price: the one nationalist of standing in this country who has never taken French money.\n\nNhu is the more immediately useful of the two. He drafts, and he drafts for an audience rather than for a ministry, and the manifesto that made his brother a national figure was largely his work. A restoration needs its case put to the people in language the people will repeat back. We now have the man who can write it."
 CuongDe_NgoDinh.3.a: "Another victory secured."

 CuongDe_NgoDinh.4.t: "Tran-Le-Xuan and Solidarity Woman's Syndicate leads Reforestation Effort Saigon"
 CuongDe_NgoDinh.4.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Tran-Le-Xuan and the Solidarity Women's Syndicate have completed the first stage of the planting, and the line of new growth now runs from the outskirts of the city most of the way to Cat-Tien.\n\nThe ground it covers was wasteland: shelled, burned over in the fighting of the last decade, and left alone since because no ministry had the labour to attempt anything with it. The Syndicate had the labour. Several thousand women, organised by district and working the corridor in shifts across two seasons, put in what the Department of Agriculture had costed and shelved.\n\nThe belt is holding the soil and bringing the water table back, which the agronomists said would take ten years and has taken rather fewer. The villages along it have begun calling the stands the Tran-Le-Xuan Forests, and Madame Nhu has not asked them to stop."
 CuongDe_NgoDinh.4.a: "Truly a revolutionary woman!"
 CuongDe_NgoDinh_4_hint_tt: "§GIn the coming months, the Phu-Nu Lien-Doi will lead a great reforestation and agricultural effort across Dong-Nam-Phan§!"
 CuongDe_NgoDinh_27_hint_tt: "§GConstruction of Tru-mat areas and the great Hoa-Luu Agroville has begun; we will celebrate its grand opening in the coming months§!"

 CuongDe_Annexation.1.t: "The Highlands Prepare for Reunification"
 CuongDe_Annexation.1.d: "After years of growing ties between the Highland leadership and the Vietnamese government, the autonomous Highlands have formally announced their intention to reunify with Vietnam. Administrative preparations for an orderly transfer of power have begun, and full integration is expected within the coming months."
 CuongDe_Annexation.1.a: "Back into the fold!"

 CuongDe_Annexation.2.t: "The Highlands Return to Vietnam"
 CuongDe_Annexation.2.d: "The transition period has concluded: the Highland territories have been formally reintegrated into Vietnam. The peoples of the Central Highlands are once more under Vietnamese administration, and their defense forces have been incorporated into the national army."
 CuongDe_Annexation.2.a: "Vietnam grows whole again!"

 DiemMarx.1.t: "An Infiltrator Uncovered"
 DiemMarx.1.d: "One of the rehabilitated cadres deployed under the Chieu-Hoi program has been exposed as an active Viet-Minh agent, feeding reports on our party organization northward for months. The Can-Lao's security apparatus has made the arrest quietly, but word travels in the villages - and Hanoi's radio wastes no time celebrating its 'patriot in the south'."
 DiemMarx.1.a: "Pardons are not given twice."

 CuongDe_NgoDinh.5.t: "Tran-Le-Xuan and Solidarity Woman's Syndicate Promote Revolutionary Struggle and Feminist Liberation"
 CuongDe_NgoDinh.5.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Tran-Le-Xuan and the Solidarity Women's Syndicate have moved from organising to legislating, and the bills they are pressing on the Assembly concern marriage and the family.\n\nThe programme is not what a French reader would expect of a women's movement. The Syndicate campaigns against forced abortion and against adultery, as protections for women who at present have no recourse in law against a husband or an employer; and against beauty pageants and boxing, as public degradations the Republic ought not to be licensing.\n\nMadame Nhu's argument is that the traditional order and the liberation of women are not opposites but one undertaking - that a woman is freed by law and by dignity together or she is not freed at all. It has radicalised a great many women who would never have joined a party, and it has fused the Labour Personalist cause to a movement this government did not create and does not entirely control."
 CuongDe_NgoDinh.5.a: "We need to foster this revolutionary new culture!"

 CuongDe_NgoDinh.6.t: "President Ngo-Dinh-Diem Announces Formation of National Revolutionary Movement"
 CuongDe_NgoDinh.6.d: "Saigon, [?global.date.GetDateStringNoHourLong] - In a landmark political development, President Ngo-Dinh-Diem has announced the formation of the National Revolutionary Movement (Phong-trao Cach-mang Quoc-Gia), an umbrella organization of various mass movements in Vietnam aligned with the Cong-Nong Party of Vietnam. This unified body aims to promote Labour Personalism and ensure that all member organizations adhere to its revolutionary teachings, struggling firmly against materialistic capitalism and reactionary forces. The conference, bringing together a diverse array of political ideologies and organizations, has officially issued a declaration establishing the National Revolutionary Movement. This large, unified political organization includes:Vietnam National Resistance Front (Cao-Dai), Vietnam Dan Xa Party (Hoa-Hao), Vietnam Republican Youth, National Youth (Cao-Dai), Women's Solidarity Syndicate, Vietnam Cong-Nong Revolutionary Party, Spiritual Group, National Revolutionary Civil Servants's Syndicate, Pure Land Buddhists of Vietnam, Catholic Society, Vietnam General Confederation of Labor, Vietnam Journalists' Union, Vietnam People's Union Movement, Citizens' Group,Vietnam Resistance Veterans, Viet-Nam Quoc-Dan Dang, Mat-Tran Quoc-Dan, Viet-Nam Quang-Phuc Hoi. This coalition represents a significant step towards achieving national unity and coordinating efforts across various sectors of society, enhancing the government's capacity to promote Labour Personalism."
 CuongDe_NgoDinh.6.a: "Sooner or later , the Social Revolution shall succeed!"

 CuongDe_NgoDinh.7.t: "President Ngo-Dinh-Diem Announces the reformation of National People's Front"
 CuongDe_NgoDinh.7.d: "Saigon, [?global.date.GetDateStringNoHourLong] - n an expected move, President Ngo-Dinh-Diem has announced the reformation of the National People's Front (Mat-tran Dan-quoc Quoc-Gia), an umbrella organization of various mass movements in Vietnam aligned with the ideals of Emperor Nam-Hung and his Dan-vuong models. This unified body originally formed by the Emperor as a means to promote the Dan-vuong models and national unity but it shall now too promote Labour Personalism and adhering to the Pan-Asianist struggles of the Emperor and President. The conference, bringing together a diverse array of political ideologies and organizations, has officially issued a declaration reforming the Front. This large, unified political organization includes: Vietnam National Resistance Front (Cao-Dai), Vietnam Dan Xa Party (Hoa-Hao), Vietnam Republican Youth, National Youth (Cao-Dai), Women's Solidarity Syndicate, Vietnam Cong-Nong Revolutionary Party, Spiritual Group, National Revolutionary Civil Servants's Syndicate, Pure Land Buddhists of Vietnam, Catholic Society, Vietnam General Confederation of Labor, Vietnam Journalists' Union, Vietnam People's Union Movement, Citizens' Group, Vietnam Resistance Veterans, Viet-Nam Quoc-Dan Dang, Mat-Tran Quoc-Dan, Viet-Nam Quang-Phuc Hoi. This reformation represents a significant step towards achieving national unity and coordinating efforts across various sectors of society, enhancing the government's capacity to promote the Emperor's revolutionary teachings."
 CuongDe_NgoDinh.7.a: "Dan-Vuong , Can-Lao!"

 CuongDe_NgoDinh.8.t: "The Vietnamese Confederation of Labor (CTVC) joins Diem's ranks"
 CuongDe_NgoDinh.8.d: "Saigon, [?global.date.GetDateStringNoHourLong] - The Confederation of Vietnamese Workers (Tong-lien-doan Lao-cong Viet-Nam) has come under the personal patronage of Ngo-Dinh-Nhu, brother and chief political adviser to the President, and has been remade along Labour Personalist lines inside a year. The Confederation now claims half a million members. Nobody has audited the figure and nobody in the ministries is inclined to.\n\nIt is led by Tran-Quoc-Buu, who commanded for the Viet Minh before he was a syndicalist and has never pretended otherwise. Under him the CVTC has multiplied its member services, opened co-operative syndicates across the south, and begun planning a \"worker city\" to house urban labour at rents a docker can actually meet.\n\nThe rest is quieter and matters more. Buu has established chambres mixtes de metiers between the unions and the employers, and a chain of \"Raiffeisen Cooperatives\" - rural savings and loan societies on the German model of the 1860s - sponsored by the President himself through the Ministry of Public Works and Labour. Credit in the villages has until now come from the landlord or from the Viet Minh, and from nobody else."
 CuongDe_NgoDinh.8.a: "We aim for the total liberation of the Proletarians!"

 CuongDe_NgoDinh.9.t: "Kieu Cong Cung forms Civic Action Commissariat and Land Reform Bureau"
 CuongDe_NgoDinh.9.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Kieu-cong-Cung, a former Marxist turned Labour Personalist, has been appointed as the Commissioner General of the newly formed Special Commissariat for Civic Action (Dac-uy Phu-Cong-Dan vu) (CDV) and Chairman of the Land Reform Bureau (Nha Cai-cach Dien-dia) under the Office of the Prime Minister. This move signals a significant step towards radical land reform in South Vietnam. The Special Commissariat, consisting of the Central Services and the Land Reform Bureau, has been tasked with liaising with relevant ministries, drawing up comprehensive plans, and training cadres for implementing these reforms. The Commissariat's temporary headquarters, provided by the Ministry of Defense, is equipped with necessary furniture, materiel, vehicles, and military recruits serving as administrative staff. Under Cung's leadership, the Civic Action Commissariat aims to carry out radical land reformation policies, blending Labour Personalism with Marxist principles to address land distribution issues and promote social equality in South Vietnam. This initiative marks a pivotal effort in transforming the agricultural landscape and improving the lives of rural communities."
 CuongDe_NgoDinh.9.a: "Cung shall help us to win over the heart of the common farmers"

 CuongDe_NgoDinh.10.t: "President Ngo-Dinh-Diem's Labour Personalist Revolutionary Policies Unveiled"
 CuongDe_NgoDinh.10.d: "Saigon, [?global.date.GetDateStringNoHourLong] - President Ngo-Dinh-Diem has unveiled the 1st series of transformative Labour Personalist policies aimed at reshaping society and fostering economic and social progress in South Vietnam during the Social Revolution era. War Against the Four Sins: Diem has initiated a comprehensive campaign against alcoholism, gambling, prostitution, and drug addiction. This effort aims not only to purify society but also to strengthen its moral foundation, promoting a virtuous and disciplined populace. People's Welfare Program: A cornerstone of Diem's agenda, this program focuses on expanding social services, healthcare, and education to enhance the well-being of all citizens. By prioritizing these areas, the government seeks to improve living standards and ensure equal access to essential services."
 CuongDe_NgoDinh.10.a: "We are the liberators of the Can-Lao people!"

 CuongDe_NgoDinh.11.t: "President Ngo-Dinh-Diem Announces Agroville policy"
 CuongDe_NgoDinh.11.d: "Saigon, [?global.date.GetDateStringNoHourLong] - The President has set out three measures under the Labour Personalist programme, and has presented them as one design rather than as three decrees.\n\nThe first is the Agro-Credit Programme. Farmers are to be advanced support against their contributions and their output, recorded not in piastres but in \"Nong-Tin\", a unit issued by the state and redeemable only inside the co-operative system. The stated aim is higher production and self-sufficiency in food. The unstated aim is to move the countryside off French and foreign currency altogether.\n\nThe second is the Agroville Programme: planned rural settlements, built new, with the people of scattered hamlets gathered into them. The government describes them as instruments of social cohesion and rural development. They are also defensible, and the districts chosen first are the districts in which the insurgency moves most freely.\n\nThe third is a slogan, \"Advance the Labour, All Shall Reach Socialism\", and it should not be dismissed as ornament. It is the formula by which a Catholic president governing on American credit proposes to take the vocabulary of the revolution away from the men in the North who have had the use of it since 1945."
 CuongDe_NgoDinh.11.a: "Thang-Tien Can-Lao, Dong-Tien Xa-Hoi!"

 CuongDe_NgoDinh.12.t: "Nhan-Vinization"
 CuongDe_NgoDinh.12.d: "Saigon, [?global.date.GetDateStringNoHourLong] - The President has ordered the Nhan-Vinization of the government: every department, at every level, to be brought under the doctrine of Labour Personalism and to conduct its business in the Emperor's name.\n\nThe programme has three parts. Labour Personalism is to be taught throughout the administration, systematically and not as an afterthought. Private ownership by working men is to be defended and extended, which is the point on which this doctrine parts company with the North. And the whole undertaking is placed under the memory of Nam-Hung, whose revolutionary teaching the President claims as the foundation of his own.\n\nThat last element is the one worth attending to. A Catholic president governing a state the Emperor built is claiming the Emperor's legacy rather than replacing it, and doing so at a moment when several other men are in a position to make the same claim. The reform of the ministries is real. It is also an argument about succession conducted through the civil service."
 CuongDe_NgoDinh.12.a: "The Emperor's work continues in our hands"

 CuongDe_NgoDinh.13.t: "President Ngo-Dinh-Diem announced nationalization of foreign owned assets"
 CuongDe_NgoDinh.13.d: "Saigon,[?global.date.GetDateStringNoHourLong] - President Ngo-Dinh-Diem has announced a major nationalization to begin early stages of upcoming 1st 5 year plans and land reform to tackle severe land ownership inequality in South Vietnam. By the 1950s, 2.5% of large landowners controlled 45% of the land, while 73% of small landowners shared just 15%. In Bac Lieu, 4% of landowners owned 70%, leaving 72% of farmers landless. French companies and plantations, such as Domaine Agricole de l'Ouest, own a significant portion of these large estates. The reform will target these holdings for collectivization and redistribution to Can-Lao and proletarian classes. Following earlier Viet-Minh efforts to confiscate and redistribute land in their areas, the Party aims to ensure fair compensation and legal support, promoting Labor Personalism in agricultural-industrial development and social stability."
 CuongDe_NgoDinh.13.a: "We need to tackle this issue ASAP!"

 CuongDe_NgoDinh.14.t: "Mrs. Nhu Launches Women's Solidarity Syndicate"
 CuongDe_NgoDinh.14.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Mrs. Tran-Le-Xuan  has founded the Women's Solidarity Syndicate (Phu-nu Lien-doi), aiming to liberate and empower women's roles in supporting the Republic. The organization is led by Mrs. Nhu, with its Central Committee composed primarily of important women of Ministers, Generals, and other influential origins. Provincial leadership is similarly structured, with the wives of Governors, Deputy Governors, and local officials taking key roles. The movement includes several specialized committees: Judicial Committee, Committee of Soldiers' Affairs, Health Committee, School Committee, Social Committee, Paramilitary Thanh Women Committee. These committees conduct routine activities and monthly visits to report on their progress, reinforcing the revolutionary spirit  of Labour Personalism and to struggle for total gender equality and feminism across all South Vietnam."
 CuongDe_NgoDinh.14.a: "Truly a dragon lady!"

 CuongDe_NgoDinh.15.t: "Establishment of the Cong-Nong Revolutionary Party"
 CuongDe_NgoDinh.15.d: "Saigon, [?global.date.GetDateStringNoHourLong] - In a significant political development, comrades of Ngo-Dinh-Diem , patriotic elements within Emperor Nam-hung's associations and syndicalist trade unions has officially entered the political arena, forming the Cong-Nong Revolutionary Party. Early participating figures include Huynh-Huu-Nghia, Ngo-Dinh-Can, Tran-Trung-Dung, Tran-Chanh-Thanh, and Nguyen-Dinh-Thuan. The Cong-Nong Revolutionary Party will serve as a central apparatus alongside the National People's Front (Mat-Tran Quoc-Dan), mirroring the structure of a Vanguard Communist Party. Dedicated to the total liberation of the people, the party aims to protect human dignity, combat materialistic greed, and uphold the Labour Personalist revolutionary principles championed by Ngo Tong-thong and Ngo-Dinh-Nhu.The party has garnered support from various organizations, including the United People's Movement and the Association of Veterans for National Salvation. This coalition seeks to mobilize broad support for Diem's Labour Personalist vision of a socially just, economically self-sufficient, and spiritually enriched Vietnam."
 CuongDe_NgoDinh.15.a: "Nhan-Vi, Cong-Dong, Dong-Tien!"

 CuongDe_NgoDinh.16.t: "Establishment of Revolutionary Youth Movements"
 CuongDe_NgoDinh.16.d: "Saigon,  [?global.date.GetDateStringNoHourLong] - In a significant step towards strengthening the revolutionary spirit, the Cong-nong Revolutionary Party has announced the formation of four new youth unions aimed at mobilizing the nation's youth under the banner of Labour Personalism. The initiative, spearheaded by the National Revolutionary Movement Chairman Tran-Chanh-Thanh and Women's Solidarity Syndicate'schairwoman, Tran-Le-Xuan, is expected to attract 50,000 participants within the next year. The newly established youth unions include: Republican Youth Union, Young Women's Union, Republican Women's Union, Armed Republican Guards. These unions will adopt the same revolutionary blue uniforms symbolizing divine justice, to be worn proudly. The organizational structure will follow the administrative divisions, with groups named according to their location, such as District Youth Unions and City Syndicates. Chairman Tran-Chanh-Thanh emphasized that these movements aim to foster a strong sense of community and revolutionary fervor among the youth, aligning with the broader goals of the Labour Personalist ideology. The establishment of these unions marks a significant milestone in the efforts to cultivate a dedicated and ideologically aligned youth force committed to the nation's revolutionary and social advancement."
 CuongDe_NgoDinh.16.a: "All hail the Social Revolution! All hail the youth!"

 CuongDe_NgoDinh.17.t: "Revolutionizing the National Construction Army"
 CuongDe_NgoDinh.17.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Ngo Tong-thong, with Ngo-Dinh-Nhu and the Cong-Nong Revolutionary Party behind him, has ordered the remaking of the National Construction Army (Viet-Nam Kien-Quoc Quan). Colonel Le-Quang-Tung will carry it out. The formation remains Dan-Vuong in its officers and in its loyalties, and that is the plain reason for the reform.\n\nFour measures were announced. The army is to undergo Labour Personalist instruction. Its command structure is to be shortened so that decisions can be taken quickly and traced to one man. Reactionary elements are to be removed and cohesion maintained by whatever means the Colonel judges necessary. And political commissars are to be attached throughout the formation.\n\nWhat is being done to the Construction Army has already been done to the parties and to the mass organisations, and the order in which it was done is not accidental. When this is finished there will be no institution in the Republic that the Party does not sit inside."
 CuongDe_NgoDinh.17.a: "A revolutionary army for a revolutionary state!"

 CuongDe_NgoDinh.18.t: "President Ngo declare the establishment of Revolutionary Army"
 CuongDe_NgoDinh.18.d: "In a surprising move contrary to most political observers' expectations, President Ngo-Dinh-Diem has announced the establishment of a second Revolutionary Army. This new organization will be composed of smaller revolutionary paramilitaries such as the Armed Republican Guards, Republican Women, and Republican Youth. Its primary mission will be to enforce revolutionary Labour Personalist policies aimed at enhancing security and advancing the revolutionary struggle. These paramilitaries will operate under the direct control of the Cong-nong Revolutionary Party, structured meticulously across various levels: At the provincial level, including commune unions, in cities, encompassing regional unions, in Saigon, incorporating ward unions, at the central level, a General Union will oversee operations. Each unit within communes and districts will be led by a deputy union leader, a union leader, and a steering council. Provinces and districts will have a leader, two deputy leaders, and a steering council, while the central level will be headed by a general leader and three special leaders. To ensure readiness and capability, the Republic of Vietnam government has established the position of \"youth inspector\" in provinces to oversee military training for this new organization. This bold restructuring marks a significant shift as Diem phases out the National Construction Army, consolidating revolutionary efforts under a more centralized and organized revolutionary framework."
 CuongDe_NgoDinh.18.a: "Down with the old , in with the new!"

 CuongDe_NgoDinh.19.t: "Diem Announces Consolidation of Political Parties Under Cong-Nong Revolutionary Party"
 CuongDe_NgoDinh.19.d: "Ngo Tong-thong has outlawed every political party in the country and ordered their membership consolidated into the Cong-Nong Revolutionary Party. The Vietnam Nationalist Party and the Restoration League are named in the decree. Everyone else is covered by omission, since nothing has been left standing outside it.\n\nThe reason given is internal security and the integrity of Labour Personalist teaching. Reactionary opposition, the President said, cannot be reasoned with while it holds seats and offices, and a state fighting for its life cannot maintain a legal opposition that shares its enemy's objectives. The consolidated party will supervise the functions of government at every level and account for political activity throughout the country.\n\nThere is now one party in South Vietnam. The men who ran the others have not disappeared. The VNQDD has cadres in the northern provinces who were fighting the French before the Cong-Nong Party existed, and they have been instructed to enrol in a body they consider junior to themselves. What used to be an argument in the Assembly becomes an argument inside the Party, or else outside the law."
 CuongDe_NgoDinh.19.a: "For security and stability!"

 CuongDe_NgoDinh.20.t: "Diem Cracks Down on Triads and Binh-Xuyen Mafia"
 CuongDe_NgoDinh.20.d: "Ngo Tong-thong has moved against organised crime in Saigon and Cho-Lon. It is presented as a part of the \"War Against the Four Sins\" - drink, gambling, prostitution and opium - and as a work of moral regeneration rather than of policing, which is how this government prefers to describe everything it does.\n\nTriad activity is outlawed outright and the holdings behind it in Cho-Lon have been broken up. The Grande Monde casino, which the Binh-Xuyen have run for years as a licensed concession and as their treasury, was demolished. Tanks were used to do it, and photographers were on hand to record the fact.\n\nThat last detail is the whole of the announcement. The Binh-Xuyen are not a criminal gang in any ordinary sense. They hold the police prefecture, they hold ground in Cho-Lon, and their concession was purchased from the Chief of State himself. Sending armour against their casino in daylight was a message addressed to them, and to everyone else who has been paying for protection from a government that now intends to stop selling it."
 CuongDe_NgoDinh.20.a: "For a just and moral revolutionary society!"

 CuongDe_NgoDinh.21.t: "Ngo Tong-thong Disarms Religious Private Armies to End Instability in Nam-phan"
 CuongDe_NgoDinh.21.d: "Ngo Tong-thong has moved against the private armies. The Cao-Dai, the Hoa-Hao and the UMDC Christian militias of Nam-Phan are to be disarmed, and the campaign has opened without the customary preliminary of negotiation.\n\nThe instrument is not the regular army. The Armed Republican Guards, the Republican Women's Union and the Republican Youth - raised, organised and paid by the Cong-Nong Revolutionary Party - are being sent to do the disarming. That means the operation answers to the Party rather than to the general staff, and that no general can be made to carry the blame for it.\n\nThe object is to end thirty years in which the sect militias have taxed, policed and fought one another across the provinces west of Saigon with the tacit consent of whoever happened to be governing. It is also the largest gamble the President has yet made. The sects have divisions in the field, territory of their own, and the loyalty of several million people, and this is not a thing that can be done halfway."
 CuongDe_NgoDinh.21.a: "Checkmate!"

 CuongDe_NgoDinh.22.t: "Thu-duc Infantry Officer school open!"
 CuongDe_NgoDinh.22.d: "Thu-Duc, [?global.date.GetDateStringNoHourLong] - The National Government and the Special Commissar of Defence have established the Thu-Duc Reserve Officer School on Tang-Nhon-Phu hill, in Linh-Xuan-Thon commune, Gia-Dinh province. It takes the name of Emperor Nam-Hung, and the first course opens next week.\n\nWhat it produces is reserve officers - men who hold civilian employment and command a platoon when they are called for. That is a deliberate choice rather than a compromise. A professional academy turns out a few hundred career officers in a decade; a reserve school turns out several thousand men a year who can be under arms inside a fortnight.\n\nFor the Cong-Nong Party it is the argument already made about the ministries and the unions, now applied to the army. The Social Revolution needs a defence it does not have to borrow, and an officer corps drawn out of the Can-Lao rather than from the families who supplied officers to the French."
 CuongDe_NgoDinh.22.a: "We are looking forward to it!"

 CuongDe_NgoDinh.23.t: "Tran-Chanh-Thanh launches revolutionary newspaper"
 CuongDe_NgoDinh.23.d: "The Chairman of the National Revolutionary Movement has launched a newspaper. \"Quan-Chung\" - the People - is published by the Cong-Nong Revolutionary Party as the official voice of the Movement, and its masthead carries the formula the Party wants repeated everywhere: \"Da-thuc, Bai-phong, De-cao Nhan-Vi\" - fight colonialism, eliminate feudalism, promote personalism.\n\nAlongside it the Revolutionary Labour Party has begun a weekly, \"Xa-Hoi\", circulating in Saigon, Phu-Xuan and Can-Tho. Between the two the Party now has a daily for the cities and a weekly for everywhere else, in the three towns where opinion in this country is actually made.\n\nThis is what the ideological apparatus has been short of. There have been schools, cadres and declarations for two years, and no reliable means of getting the same sentence into every province in the same week. There is one now."
 CuongDe_NgoDinh.23.a: "Bai-phong , Ta-thuc , De-cao Nhan-Vi!"

 CuongDe_NgoDinh.24.t: "Ngo Tong-thong issued decrees to form Tay-ninh Training Base"
 CuongDe_NgoDinh.24.d: "In a significant move to solidify Labour Personalism, Ngo Tong-thong has announced Tay Ninh as the site for the first revolutionary training base for \"Tu-nghiep\" revolutionary courses. Tay-Ninh's strategic location and strong support from Cao-Dai allies, formerly loyal to Emperor Nam-Hung's and now his successor Diem, made it an ideal choice. This base will provide intensive political-ideological and practical technical and military training for cadres and the working class, aiming to advance revolutionary principles and strengthen loyalty to Diem's government. This initiative marks a pivotal step in Diem's effort to consolidate power and promote Labour Personalism across South Vietnam."
 CuongDe_NgoDinh.24.a: "Can-Lao, Cach-mang, Nhan-Vi!"

 CuongDe_NgoDinh.25.t: "Cong-nong Party's Politburo announced mass-opening of revolutionary training bases"
 CuongDe_NgoDinh.25.d: "The first Labour Personalist training base at Tay-Ninh has done what was asked of it, and the Politburo of the Cong-Nong Party has ordered three more opened across the south. Each is to train cadres and working men in the doctrine, and each has been given a region and a man to run it.\n\nHue takes the Special Mission of the Central Region under the political adviser Ngo-Dinh-Can, covering the country from Phan-Rang to the seventeenth parallel and inland across the highlands. It folds intelligence, secret security and mobile propaganda teams into a single office, and is run day to day by Duong-Van-Hieu and Nguyen-Tu-Thai - the former a Marxist before he was anything else, which is precisely why he was chosen. Its record on security and on population control is the best in the country.\n\nSaigon is the headquarters of the National Revolutionary Movement, opened under Ngo-Dinh-Nhu and now largely in the hands of his wife, Tran-Le-Xuan. It does less than it once did, but it remains the place where doctrine is settled before it is taught anywhere else. Can-Tho, in the delta, has had the quietest politics and consequently the busiest year: recruitment, and relief work among the poor, which the Party regards as the same undertaking carried on by other means."
 CuongDe_NgoDinh.25.a: "Nhan-Vi + Cong-Dong = Dong-Tien!"

 CuongDe_NgoDinh.26.t: "Ngo Tong-thong and Colonel Le-Quang-Tung Form Labour Personalist Political Commissars"
 CuongDe_NgoDinh.26.d: "The President and Colonel Le-Quang-Tung have announced a corps of Labour Personalist political commissars. The model is Soviet and the government has not pretended otherwise. The argument made for it is that a doctrine which is not enforced inside the state apparatus will not survive contact with the men who staff it.\n\nLe-Quang-Tung, who commands the Revolutionary Special Forces, will run the corps. Commissars are to sit alongside the existing chain of command in the ministries and in the army without displacing it - watching, reporting, and marking reactionary elements for removal. Their authority comes from the President personally rather than from any department, and that is precisely the point of the arrangement.\n\nWhat it buys is a government that can be relied upon to say the same thing in every province. What it costs is that every officer and every functionary now works beside a man whose function is to find fault with him. The army has also noticed that the corps was announced by a colonel of special forces and not by the Chief of Staff."
 CuongDe_NgoDinh.26.a: "All hail the Armed Forces! All hail the Party!"

 CuongDe_NgoDinh.27.t: "Ngo Tong-thong Announces the Opening of Hoa-Luu Agroville"
 CuongDe_NgoDinh.27.d: "Vi-Thanh, [?global.date.GetDateStringNoHourLong] - The President has opened Hoa-Luu, the largest of the Agrovilles and the one against which the government intends the rest to be measured. The ceremony drew officials, provincial dignitaries and a crowd in the thousands, and the President came in person, which nobody present failed to notice.\n\n\"This year,\" he told them, \"I propose the work of establishing Tru-Mat areas in the countryside, in places with convenient transportation, hygiene, and minimum amenities, to bring together poor farmers who live sporadically and in need.\" The settlements are intended to grow into district and provincial seats in their own right - modern quarters, agricultural training, and the social programmes through which Labour Personalism reaches people who will never read a line of it.\n\nHoa-Luu has the infrastructure to carry the argument. What it does not yet have is an answer to the question the delta keeps asking, which is what became of the farmers who did not wish to leave the land their families had worked, and were moved off it regardless."
 CuongDe_NgoDinh.27.a: "I give you, the Agroville!"

 CuongDe_NgoDinh.28.t: "Meanings Class Conflicts under the Labour Personalist Regime"
 CuongDe_NgoDinh.28.d: "The Cong-Nong Revolutionary Party has opened a campaign, run by Ngo-Dinh-Nhu and Tran-Quoc-Buu, to settle the question of class under Labour Personalism - or rather, to declare it settled.\n\nNhu put the doctrine plainly enough. \"Labour Personalism encourages the proletarians and working classes to possess their own capital, provided it's obtained legally and does not harm Collectivist's common good.\" Tran-Quoc-Buu, for the General Confederation of Workers, put it more provocatively still: \"Our ideology Labour Personalism synthesizes Capitalism and Communism to empower the working class.\"\n\nThree things follow from the declaration. Private ownership by working men is to be made lawful and secure where it is at present neither. An education campaign will carry the doctrine into the unions and the villages. And co-operatives and credit unions are to be founded to finance enterprises the workers own outright. Whether this is a synthesis or an evasion is the argument the Party has just chosen to conduct in public."
 CuongDe_NgoDinh.28.a: "Quyen Tu-huu duoc dam-bao cho cac Giai-cap Can-Lao!"

 CuongDe_NgoDinh.29.t: "Formation of Sonadezi and the First Industrial Zone in Bien-Hoa"
 CuongDe_NgoDinh.29.d: "Today, Ngo Tong-thong with the collaboration from the Special Commissar of Civil Action and Special Commissar of Industry and Public Works has collaborated and declare the establishment of Sonadezi syndical (Societe nationale du Developpement des zones industrielles), marking a significant milestone in South Vietnam's industrial development under Labour Personalism. This effort aimed to reduce dependence on Western and French industrial products and foster domestic industrial capabilities. Sonadezi served as a hub for technical advisors, investors, and officials from the Saigon government's Ministry of Economy, facilitating the creation of industrial zones across Vietnam. The first industrial zone was established in Bien-Hoa, setting a model for future industrial complexes in Tay-Do (Can-Tho), Da-Nang, and Cam -Ranh. President Diem emphasized, \"Sonadezi will spearhead our nation's industrial revolution, promoting self-sufficiency and economic growth through innovative industrialization strategies.\" This initiative laid the foundation for Vietnam's industrial expansion, showcasing Labour Personalism's commitment to economic independence and technological advancement."
 CuongDe_NgoDinh.29.a: "Ky-nghenization is going smoothly!"

 CuongDe_NgoDinh.30.t: "The President Visits the Auto Calculate Bureau"
 CuongDe_NgoDinh.30.d: "The President has toured the Auto Calculate Bureau, which now runs on IBM machines and is, so far as anyone can establish, the only installation of its kind between Manila and Karachi. He was shown the electronic computing machines working through a province's tax rolls, and he stayed rather longer than the schedule allowed.\n\nHis interest is in what the machines do to the assessment. A tax roll kept by hand is a tax roll kept by men who can be persuaded, and the great estates have been persuading them since the French arrived. A roll a machine can total in an afternoon is harder to argue with, and the President made the connection out loud: modernisation as the instrument against feudal and colonial remnants, rather than as an ornament of the budget.\n\n\"Our goal is to fully automate Vietnam's bureaucracy, making it more efficient and knowledgeable,\" he told the staff. \"This modernization will help us build a fairer, more prosperous society.\" The Bureau has one such installation and the country has forty-odd provinces, so the ambition presently exceeds the equipment by some distance."
 CuongDe_NgoDinh.30.a: "101010"

 CuongDe_NgoDinh.31.t: "Inauguration of the Da Nhim Hydroelectric Plant and Celebration of Pan-Asianism"
 CuongDe_NgoDinh.31.d: "The Da-Nhim hydroelectric plant has been inaugurated, and it is the largest thing this country has built since the war. It stands at the confluence of the Krong-Let and the Da-Nhim at Don-Duong in Lam-Dong province, and it was paid for by the Japanese government out of the reparations settled at San Francisco in 1951.\n\nThe figures deserve stating once. A dam fifteen hundred metres long; a pressure tunnel of five kilometres driven through the range; a reservoir of eleven or twelve square kilometres held above a thousand metres of altitude; 160 megawatts installed, and something close to a billion kilowatt-hours a year. The highlands have never had power worth the name and will now be sending it down to the coast.\n\nThe ceremony was also, and quite openly, a Pan-Asianist occasion. Japanese engineers stood beside Vietnamese ministers at a plant built with Japanese money on terms Cuong-De negotiated himself, and the speeches said what everyone present already understood. The money came out of a war, it has been turned into a dam, and this is what the friendship between the two countries is now meant to look like."
 CuongDe_NgoDinh.31.a: "A toast to our Japanese Comrades"

 CuongDe_NgoDinh.32.t: "Announcement of the First Labour Personalist Revolutionary Planned City"
 CuongDe_NgoDinh.32.d: "Ground was broken today on Nghiep-doan Thanh, the Working People's City, announced jointly by Tran-Quoc-Buu of the General Syndicate of Vietnamese Workers, Advisor Ngo-Dinh-Nhu, and Commissar-General Kieu-Cong-Cung of Civic Action. It is to be the first city in the south built to a Labour Personalist plan rather than adapted to one afterwards.\n\nThe design puts housing, schools, clinics and public ground into a single layout, instead of letting a town accrete around a market and a garrison as every other town in the delta has done. Buu spoke about worker empowerment and social harmony. Nhu spoke about the planning method and what the site is intended to prove. Kieu-Cong-Cung, whose Civic Action cadres will do the actual building, spoke about unity and said the least of the three about timetables.\n\nThree men who agree on very little stood on the same platform for it, which is worth as much to the government as the concrete. If the city is finished it becomes the model for every settlement programme now on paper. If it is not, it becomes the standing illustration of what the doctrine produces when it meets a budget."
 CuongDe_NgoDinh.32.a: "The first building block of something greater!"

 CuongDe_NgoDinh.33.t: "Announcement of the Agro-credit Program"
 CuongDe_NgoDinh.33.d: "Saigon, [?global.date.GetDateStringNoHourLong] - The Agro-Credit Programme was launched at nine this morning at the Research and Training Centre for Farmers' Co-operatives, under Tran-Ngoc-Lien, Head of the Commissary of Farmers' Co-op and Agro-Credit, with the President of the People's Committee for Countryside Life Improvement presiding.\n\nThe guest list was half the point of the occasion. Tran-Quoc-Buu of the General Syndicate of Workers of Vietnam sat beside Monsieur Kleinpeter of the French Economic and Technical Aid mission, with officials of the People's Committee, the Commissary and half a dozen departments filling the rest of the hall. The syndicates, the ministries and the French aid administration have not often been got into one room, and never before to endorse the same document.\n\nBuu spoke for syndicalism as the socio-economic content of the Labour Personalist cause. Tran-Ngoc-Lien spoke for the unified revolutionary mass movement and for the Nhan-Vi cadre training, which he called the foundation on which everything else rests. The programme itself is simpler than the speeches made for it: the farmer is to be credited in a currency earned by labour and social contribution rather than held in cash, and the government is wagering that the countryside will take it."
 CuongDe_NgoDinh.33.a: "Thang-tien Nong-tin Cuoc!"

 # Cuong-De Coup
 CuongDe_Coup.1.t: "Greenlighting Cuong-De's Coup?"
 CuongDe_Coup.1.d: "After years of preparation, Cuong-De's people have come to us with a final proposal, and it is put plainly enough. They want our support for the removal of Bao-Dai and the installation of the prince on the imperial throne.\n\nThe objection to him is on the record and nobody in this Ministry has forgotten it. He spent the war a guest of the Japanese, and had they lasted a little longer he would have taken the country out of our hands with their assistance.\n\nThe case for him is that he is not Bao-Dai. Our present man must be propped up every few months, has never produced a government that governs, and has spent a remarkable quantity of our credit at the tables in Cho-Lon. Cuong-De has organisation, a following, and a reputation for personal seriousness that our client conspicuously lacks. The question before us is whether we would sooner be embarrassed by our man in Saigon or replaced by him."
 CuongDe_Coup.1.a: "They have earned our permission, Bao-Dai must be removed."
 CuongDe_Coup.1.b: "Bao-Dai can still be redeemed, we shall not support this illegal act!"

 CuongDe_Coup.2.t: "France Agrees to Aid Our Coup"
 CuongDe_Coup.2.d: "Good news! The French have agreed to our plan to bring Prince Cuong-De back to the Imperial throne. It seems that all of our efforts to sway French officials and government have paid off as they are willing to support our effort in toppling Bao-Dai and recognize Prince Cuong-De's government as the legitimate government of Vietnam. Now we wait for the right time to take Bao-Dai down."
 CuongDe_Coup.2.a: "Victory is in our grasp!"

 CuongDe_Coup.3.t: "France Refuses to Aid Our Coup"
 CuongDe_Coup.3.d: "Tragic news! Despite our best ability to convince the French government that Prince Cuong-De is Vietnam's best hope for unification, we failed to convince them to support our cause to overthrow Bao-Dai. Without the French government's help, our cause will most likely fail as Bao-Dai controls the nation with an iron fist."
 CuongDe_Coup.3.a: "Was it all for nothing?"

 CuongDe_Coup.4.t: "The Clock Strikes Twelve"
 CuongDe_Coup.4.d: "With the ongoing distraction of the war between Bao-Dai's government and the Communists, we have found the opportunity to attempt a coup against Bao-Dai. This morning, Prince Cuong-De's supporters have gathered in Hue in an attempt to storm's Bao-Dai's resident. While they have met resistance from the palace guard, the result of the coup attempt is..."
 CuongDe_Coup.4.a: "Victory for Our Rightous Ruler!"
 CuongDe_Coup.4.b: "Defeat Against Bao-Dai's Forces..."

 CuongDe_Coup.5.t: "A Moment Long Overdue..."
 CuongDe_Coup.5.d: "The palace guard fought, briefly. They were outnumbered from the first minute and they were abandoned the moment the French made their position known, and inside a few hours the prince's men were in the residence with Bao-Dai in front of them.\n\nHe abdicated on radio and on television, reading a text he had not written, with the whole world invited to watch him do it. There was no bargaining because there was nothing left to bargain with. The French had gone, the army had not moved, and half the ministers had been telephoning Phu-Xuan since the previous evening.\n\nCuong-De is head of the Vietnamese state. The expectation across the country is enormous and it is aimed at a single point - that whatever comes next will at least be less corrupt and less idle than what has just been carried out of the palace. It is a great deal to hang upon one elderly man who has been out of the country for forty years."
 CuongDe_Coup.5.a: "Van-tue Cuong-De!"

 # Cuong-De Successor
 CuongDe_Successor.1.t: "Who Shall Succeed?"
 CuongDe_Successor.1.d: "The Emperor is old and he is ill, and the palace physicians have given up pretending otherwise. The succession has to be settled while he is still in a condition to settle it himself, and there are four names before him.\n\nNguyen-Rinh-Nhiep is the second-in-command and the obvious answer: the man who has run the administration while the Emperor ran the revolution. Ngo-Dinh-Diem has supported the restoration longer than almost anybody and would bring the Catholics and the reformers with him, at the price of everyone whom the reforms frighten. Hoang-Nam-Hung is the nationalist choice, and the one the army would find easiest to swallow.\n\nAnd there is Tran-Quang-Vinh. The Cao-Dai are pressing hard for a candidate of their own, and Vinh is the candidate they have. He commands their divisions and he holds Tay-Ninh, and a succession settled against him is a succession the sects may simply decline to recognise."
 CuongDe_Successor.1.a: "The loyalist, Nguyen-Rinh-Nhiep."
 CuongDe_Successor.1.b: "The radical, Ngo-Dinh-Diem."
 CuongDe_Successor.1.c: "The nationalist, Hoang-Nam-Hung."
 CuongDe_Successor.1.e: "The pragmatist, Tran-Quang-Vinh."

 # North Vietnam & Cuong-De
 NV_CuongDe.1.t: "Cuong-De Proposes a Ceasefire"
 NV_CuongDe.1.d: "The Emperor has called for a ceasefire, and he made the case in the terms he has used all his life: that the Vietnamese are one people with one inheritance, and that brothers should not be killing one another while a foreign army stands by and watches them do it.\n\nIt was not only a speech. Ngo-Dinh-Diem has been appointed to a mission to the International Control Commission, with instructions to open a process toward the North rather than merely to lodge a protest. The appointment is itself the message: the Emperor has sent his most uncompromising anti-communist, and not a man Hanoi would find comfortable to deal with.\n\nNobody in this government expects Ho to accept quickly, and the Emperor does not appear to expect it either. What he wants on the record is that the offer was made from this side, in public, and that whatever comes after it was not chosen here."
 NV_CuongDe.1.a: "Let's hope that there's progress coming from this."

 NV_CuongDe.2.t: "Diem Proposes Peacetalks"
 NV_CuongDe.2.d: "Through the intermediating efforts of the International Control Mission and months of secret negotiation, the Ngo-Dinh-Diem government of South Vietnam has proposed an arrangement with the North regarding peace and the eventual reunification of Vietnam. The plan put forward 6 stages of peace before official reunification:\n\nStage 1: The ban on the exchange of letters between Northern and Southern citizens must be lifted.\nStage 2: The border between the North and the South must then be opened for all Vietnamese citizens from both sides.\nStage 3: Vietnamese from both sides must be given the right to freely resettle anywhere in Vietnam if they so choose.\nStage 4: Economic exchange between the North and the South must resume. For example, the South would exchange Southern rice for Northern coal.\nStage 5: A Nation-wide Unification Debate must be held\nStage 6: General Election\n\nIt's now up to the North to agree to this proposal. Things are uncertain, but one thing is clear:"
 NV_CuongDe.2.a: "In the upcoming days, the fate of Vietnam will depend upon a single piece of paper."

 NV_CuongDe.3.t: "Saigon Offers Coexistence"
 NV_CuongDe.3.d: "With the road to reunification closed, the Southern government has sent a new and more modest proposal to Hanoi: normalized relations between the two Vietnamese states. The offer speaks no longer of elections or merger, but of quiet borders, the resumption of correspondence between divided families, and the exchange of Southern rice for Northern coal.\n\nFor the Politburo, the offer presents a familiar dilemma. Accepting would ease the burden on a war-weary population and open valuable trade - but it would also lend legitimacy to the Saigon government and quiet the revolutionary struggle in the South. Rejecting it keeps the cause alive, at the price of continued isolation and hardship.\n\nHow shall the North answer?"
 NV_CuongDe.3.a: "There is wisdom in quiet borders."
 NV_CuongDe.3.b: "The revolution does not rest."

 # North Vietnam & Cuong-De Unification
 NV_CuongDe_Unification.1.t: "Diem's Unification Proposal"
 NV_CuongDe_Unification.1.d: "Through months of secret negotiations and diplomatic channels, President Ngo-Dinh-Diem of South Vietnam has formally proposed a comprehensive plan for the peaceful reunification of Vietnam. The proposal outlines a gradual process of reconciliation and integration between North and South.\n\nThe plan calls for a six-stage process:\n\n§YStage 1:§! Lifting the ban on correspondence between Northern and Southern citizens\n§YStage 2:§! Opening the border for free movement of all Vietnamese citizens\n§YStage 3:§! Granting the right to resettle anywhere in Vietnam\n§YStage 4:§! Resuming economic exchange between the two regions\n§YStage 5:§! Holding a nationwide unification debate\n§YStage 6:§! Conducting general elections for a unified government\n\nThis proposal represents a significant departure from the ongoing conflict. The ball is now in North Vietnam's court - will they accept these terms and begin the path toward peaceful reunification?"
 NV_CuongDe_Unification.1.a: "We accept the proposal and will begin negotiations."
 NV_CuongDe_Unification.1.b: "We reject this proposal."

 NV_CuongDe_Unification.2.t: "Reviewing the Terms"
 NV_CuongDe_Unification.2.d: "The North Vietnamese government has received Diem's unification proposal and is carefully reviewing the terms. The proposal's emphasis on gradual integration and democratic processes presents both opportunities and challenges for the communist leadership.\n\nKey points under consideration:\n\n- The economic exchange would benefit both sides, but also create dependencies\n- Free movement could lead to ideological contamination or, conversely, strengthen the North's position\n- General elections pose a significant risk if the South's population proves more favorable to the current government\n- The staged approach allows for careful monitoring and adjustment of the process\n\nThe Politburo must decide whether to proceed with formal negotiations or reject the proposal outright."
 NV_CuongDe_Unification.2.a: "We will enter formal negotiations."

 NV_CuongDe_Unification.3.t: "Negotiating the Details"
 NV_CuongDe_Unification.3.d: "Formal negotiations have begun between representatives of North and South Vietnam. The discussions are tense but productive, with both sides working to refine the terms of the unification proposal.\n\nKey points of discussion:\n\n- The timeline for each stage of the process\n- Guarantees for the rights and safety of citizens during the transition\n- Economic arrangements and trade agreements\n- Electoral procedures and voter eligibility\n- The role of foreign powers in the process\n\nProgress is being made, though significant differences remain. The South Vietnamese delegation, led by Diem's representatives, is pushing for faster implementation, while the North seeks more safeguards and a longer transition period."
 NV_CuongDe_Unification.3.a: "Continue negotiations."

 NV_CuongDe_Unification.4.t: "Reaching an Agreement"
 NV_CuongDe_Unification.4.d: "After weeks of intensive negotiations, both sides have reached a comprehensive agreement on the terms of Vietnamese reunification. The final document outlines a detailed roadmap for the six-stage process, with specific timelines, safeguards, and mechanisms for implementation.\n\nThe agreement includes:\n\n- A phased border opening beginning in six months\n- Economic cooperation protocols for trade and resource exchange\n- Electoral commission structure and voting procedures\n- Transitional government arrangements\n- International monitoring and verification mechanisms\n\nBoth governments are now ready to sign the agreement and begin the implementation process. This marks a historic moment - the end of the Indochina War and the beginning of a new chapter in Vietnamese history, though the path ahead remains uncertain."
 NV_CuongDe_Unification.4.a: "Sign the agreement and begin implementation."

 NV_CuongDe_Unification.5.t: "[GetNewspaperHeader]Historic Agreement Ends Indochina War, Sets Path for Vietnamese Reunification"
 NV_CuongDe_Unification.5.d: "[?global.date.GetDateStringNoHourLong] - In a development that has stunned observers worldwide, the governments of North and South Vietnam have signed a comprehensive agreement ending the Indochina War and establishing a framework for peaceful reunification. The accord marks the first negotiated settlement between the two Vietnamese states since the outbreak of the conflict.\n\nReached after months of secret negotiations and weeks of formal talks, the agreement outlines a six-stage reunification process. Initial measures will restore civilian correspondence, followed by border openings, resettlement rights, economic cooperation, a nationwide political debate, and ultimately general elections to determine Vietnam's future.\n\nPresident Ngo-Dinh-Diem and Chairman Ho Chi Minh jointly hailed the agreement as a victory for the Vietnamese people rather than one side alone. A ceasefire and demilitarized zone along the 17th parallel will be enforced under international supervision.\n\n"
 NV_CuongDe_Unification.5.a: "A new chapter begins."

 NV_CuongDe_Unification.6.t: "North Vietnam Rejects the Proposal"
 NV_CuongDe_Unification.6.d: "The North Vietnamese government has formally rejected President Diem's unification proposal. The rejection comes as a disappointment to those who had hoped for a peaceful resolution to the conflict, but it is not entirely unexpected given the deep ideological and political divisions between the two sides.\n\nThe North's refusal to engage with the proposal suggests that they are not yet ready to compromise on their position, or that they view the terms as unfavorable. This rejection means that the path to peaceful reunification remains blocked, at least for now.\n\nThe South Vietnamese government must now decide how to respond. Will they attempt to revise the proposal and make another offer, or will this rejection mark the end of diplomatic efforts and a return to more confrontational approaches?"
 NV_CuongDe_Unification.6.a: "We will respond accordingly."

 NV_CuongDe_Unification.7.t: "Diplomatic Relations Deteriorate"
 NV_CuongDe_Unification.7.d: "Following North Vietnam's rejection of the unification proposal, diplomatic relations between the two Vietnamese states have deteriorated significantly. The failure of these negotiations has created a new atmosphere of tension and mistrust.\n\nBoth sides have hardened their positions, and the prospects for future peaceful dialogue appear dim. The rejection has been interpreted in the South as a sign that the North is not genuinely interested in peaceful reunification, while the North likely views the proposal as an attempt to undermine their legitimacy.\n\nWith diplomatic channels effectively closed, the situation has returned to a state of cold war, with both sides maintaining their separate paths and preparing for an uncertain future. The dream of peaceful reunification seems more distant than ever."
 NV_CuongDe_Unification.7.a: "Back to the status quo."

 # Placeholder until post-1955 content is planned
 NV_CuongDe_Unification.8.t: "General Elections and Reunification"
 NV_CuongDe_Unification.8.d: "After a year of implementing the six-stage unification process, general elections have been held across Vietnam. The elections have resulted in a decisive victory for President Ngo-Dinh-Diem and the South Vietnamese government, leading to the formal reunification of Vietnam under Southern leadership.\n\n[PLACEHOLDER TEXT - This event will be properly localized later]"
 NV_CuongDe_Unification.8.a: "Vietnam is reunited!"

 NV_CuongDe_Unification.9.t: "The Moment Has Passed"
 NV_CuongDe_Unification.9.d: "The reunification accord was signed by two men - Ngo-Dinh-Diem and Ho Chi Minh - and it could only be carried out by them. With one of the signatories gone from power, or the guns speaking once more between North and South, the delicate machinery of the six-stage process has ground to a halt.\n\nThe correspondence resumes its silence, the border posts close, and the electoral commissions are quietly dissolved. What was to be the reunification of the Vietnamese people has instead become another entry in the long ledger of missed chances.\n\nThe house remains divided."
 NV_CuongDe_Unification.9.a: "So close, yet so far."

 # Nhiep PM for Cuong-De
 CD_Nhiep.1.t: "Nam-Hung's Families' Repatriation"
 CD_Nhiep.1.d: "Following the death of Emperor Cuong-De, many of his family members and close associates who had been living in exile in Japan have expressed their desire to return to Vietnam. These individuals, who had followed the Emperor into exile during the colonial period, now seek to come home and honor his legacy.\n\nThe repatriation effort involves coordinating with Japanese authorities to facilitate the return of several dozen families. Many of these returnees are elderly, having spent decades away from their homeland. They bring with them not only their personal belongings but also memories, documents, and artifacts from the Emperor's time in exile.\n\nFor Prime Minister Nguyen-Rinh-Nhiep, this represents an opportunity to strengthen ties with Japan while also honoring the memory of his predecessor. The return of these families will help preserve the cultural and historical legacy of the imperial tradition, even as Vietnam moves forward under a new government."
 CD_Nhiep.1.a: "Welcome them home with open arms."

 CD_Nhiep.2.t: "Establishing the Vietnamese-Japanese Friendship Association?"
 CD_Nhiep.2.d: "Prime Minister Nhiep has proposed the creation of a formal Vietnamese-Japanese Friendship Association to strengthen cultural, economic, and diplomatic ties between the two nations. This organization would serve as a bridge between Vietnam and Japan, facilitating exchanges in education, trade, and technology.\n\nThe proposal has been sent to the Japanese government for consideration. Such an association would be the first of its kind in Southeast Asia, representing a significant step forward in regional cooperation. It would also help Vietnam access Japanese expertise in modernization and industrialization, areas where Japan has made remarkable progress.\n\nThe Japanese response will determine whether this ambitious plan can move forward, potentially opening new avenues for Vietnamese development and international cooperation."
 CD_Nhiep.2.a: "We await their response."

 CD_Nhiep.3.t: "Establishment of the Vietnamese-Japanese Friendship Association"
 CD_Nhiep.3.d: "The Japanese government has enthusiastically accepted Prime Minister Nhiep's proposal, and the Vietnamese-Japanese Friendship Association has been formally established. The inaugural ceremony was attended by dignitaries from both nations, marking a historic moment in bilateral relations.\n\nThe association will coordinate cultural exchanges, facilitate trade agreements, and promote educational partnerships. Already, plans are being discussed for Japanese technical advisors to assist in Vietnamese infrastructure projects, while Vietnamese students will have opportunities to study in Japan.\n\nHowever, this closer relationship with Japan has not gone unnoticed by other powers. France and the United States have expressed concern about Vietnam's growing ties with Japan, viewing it as a potential shift away from their sphere of influence. The diplomatic landscape is becoming more complex, but Prime Minister Nhiep remains committed to pursuing Vietnam's independent path."
 CD_Nhiep.3.a: "A new era of cooperation begins."

 CD_Nhiep.4.t: "The Expansion of Phu-Xuan"
 CD_Nhiep.4.d: "Prime Minister Nhiep has announced a comprehensive plan to expand and modernize Phu-Xuan, transforming the ancient imperial capital into a modern administrative center. The project involves extensive urban planning, infrastructure development, and the construction of new government facilities.\n\nThe expansion includes the creation of new administrative districts, the establishment of modern office complexes, and improvements to the city's infrastructure. The goal is to make Phu-Xuan not just a symbol of Vietnam's imperial past, but a showcase of its modern future.\n\nIn a symbolic move, the government has also announced that the capital will be officially moved to Phu-Xuan, recognizing its historical significance while positioning it as the center of Vietnam's new political order. This decision represents a break from the colonial-era focus on Saigon and a return to traditional Vietnamese centers of power.\n\nThe project is ambitious and expensive, but Prime Minister Nhiep believes it is essential for establishing Vietnam's identity as an independent, modern nation."
 CD_Nhiep.4.a: "Begin the transformation."

 CD_Nhiep.5.t: "Plans for a Metro in South Vietnam"
 CD_Nhiep.5.d: "The Vietnamese government has approached Japan with a proposal to build a modern metro system in Phu-Xuan, connecting the Imperial Citadel with the city's expanding administrative and commercial districts. This would be the first underground railway system in Southeast Asia, representing a significant technological achievement.\n\nThe Japanese have been asked to provide both technical expertise and financial assistance for the project. The metro would not only serve as a practical transportation solution for the growing capital but also as a symbol of Vietnam's modernization and its partnership with Japan.\n\nThe proposal includes plans for a main station beneath the Imperial Citadel, with lines extending to key government and commercial areas. Japanese engineers have already conducted preliminary surveys and are impressed by the ambition of the project.\n\nHowever, the cost is substantial, and the Japanese government must weigh the benefits of this investment against other priorities. Their decision will determine whether Vietnam can take this major step toward modernization."
 CD_Nhiep.5.a: "We will fund and assist with the project."
 CD_Nhiep.5.b: "We cannot commit to such an expensive undertaking at this time."

 CD_Nhiep.6.t: "Construction Begins for the Imperial Citadel Metro Station"
 CD_Nhiep.6.d: "With Japanese funding and technical support secured, construction has officially begun on the Phu-Xuan Metro system. The project starts with the flagship station beneath the Imperial Citadel, a location chosen for both its symbolic importance and central position in the city.\n\nJapanese engineers and Vietnamese workers labor side by side, with the latest tunneling technology being employed to create the underground network. The construction site has become a hub of activity, with cranes, excavators, and construction crews working around the clock.\n\nThe project is expected to take approximately two years to complete, during which time the city will have to manage the disruption caused by construction. However, the promise of a modern transportation system has generated excitement among the population, who see it as evidence of Vietnam's progress.\n\nPrime Minister Nhiep has personally visited the construction site, emphasizing the importance of this project for Vietnam's future. \"This metro,\" he declared, \"will carry not just passengers, but the hopes of a modern Vietnam.\""
 CD_Nhiep.6.a: "A symbol of progress rises from the earth."

 CD_Nhiep.7.t: "Opening of the Imperial Citadel Metro Station"
 CD_Nhiep.7.d: "After two years of intensive construction, the Phu-Xuan Metro system has been completed and officially opened to the public. The grand opening ceremony was attended by Prime Minister Nhiep, Japanese dignitaries, and thousands of citizens who gathered to witness this historic moment.\n\nThe metro system features state-of-the-art stations, modern trains provided by Japanese manufacturers, and an extensive network connecting the Imperial Citadel with key districts throughout the capital. The main station beneath the Citadel is particularly impressive, with its elegant design blending traditional Vietnamese architectural elements with modern functionality.\n\nThe completion of this project represents a major achievement for Vietnam. Not only does it provide efficient transportation for the capital's growing population, but it also demonstrates the country's ability to undertake and complete large-scale infrastructure projects. The metro has become a source of national pride, a tangible symbol of Vietnam's modernization.\n\nJapanese technical advisors remain in Vietnam to ensure the system's smooth operation and to train Vietnamese engineers in maintenance and future expansion. The success of this project has strengthened the partnership between the two nations and opened the door for further cooperation."
 CD_Nhiep.7.a: "A new era of urban transportation begins."

 CD_Nhiep.8.t: "The Japanese Refuse Our Plans"
 CD_Nhiep.8.d: "The Japanese government has regretfully declined to provide funding for the Phu-Xuan Metro project, citing budgetary constraints and other priorities. While they expressed interest in the concept and praised Vietnam's ambition, they cannot commit the substantial resources required at this time.\n\nThis decision is a disappointment for Prime Minister Nhiep and his government, who had hoped the metro would serve as a centerpiece of their modernization efforts. The refusal also represents a setback in Vietnamese-Japanese relations, though both sides have emphasized their commitment to maintaining friendly ties.\n\nSome within the government have suggested seeking alternative funding sources or scaling back the project, but for now, the ambitious metro plan must be shelved. The dream of a modern underground railway system for Phu-Xuan will have to wait for more favorable circumstances.\n\nThe diplomatic relationship with Japan remains intact, but this episode serves as a reminder that international partnerships, while valuable, cannot always be relied upon for major infrastructure investments."
 CD_Nhiep.8.a: "We will find another way forward."

 CD_Nhiep.9.t: "Preparing Nam-Hung's Mausoleum"
 CD_Nhiep.9.d: "Prime Minister Nhiep has announced plans to construct a grand mausoleum in Phu-Xuan to honor the memory of Emperor Cuong-De, who had taken the regnal name Nam-Hung during his reign. This monument will serve as the final resting place for the late Emperor and as a permanent memorial to his legacy.\n\nThe mausoleum is designed to reflect both traditional Vietnamese imperial architecture and modern construction techniques. It will be located in a prominent position within the capital, ensuring that the Emperor's memory remains central to the nation's identity.\n\nThe project involves not just the construction of the mausoleum itself, but also the creation of surrounding gardens, memorial halls, and ceremonial spaces. The design incorporates elements that honor both the Emperor's role in Vietnamese history and his vision for an independent Vietnam.\n\nConstruction is expected to take approximately two years, during which time the site will be prepared and the structure built according to the most exacting standards. This will be a lasting tribute to a leader who dedicated his life to the cause of Vietnamese independence."
 CD_Nhiep.9.a: "Begin construction of this sacred monument."

 CD_Nhiep.10.t: "The Opening of Nam-Hung's Mausoleum"
 CD_Nhiep.10.d: "After two years of construction, the Mausoleum of Emperor Nam-Hung has been completed and officially opened. The grand ceremony was attended by government officials, members of the imperial family, and thousands of citizens who came to pay their respects.\n\nThe mausoleum is a magnificent structure, combining traditional Vietnamese architectural elements with modern design. Its halls contain exhibits documenting the Emperor's life, his years in exile, and his contributions to the Vietnamese independence movement. The surrounding gardens provide a peaceful space for reflection and remembrance.\n\nThe completion of the mausoleum has transformed Phu-Xuan, adding a significant cultural and historical landmark to the capital. It has become a destination for both Vietnamese citizens and foreign visitors, serving as a reminder of the nation's complex history and the sacrifices made in the pursuit of independence.\n\nPrime Minister Nhiep, in his dedication speech, emphasized that the mausoleum represents not just the memory of one man, but the enduring spirit of Vietnamese nationalism and the ongoing struggle for true independence. \"Here,\" he declared, \"we honor not just an Emperor, but the idea of a free Vietnam.\""
 CD_Nhiep.10.a: "A lasting monument to a great leader."

 CD_Nhiep.11.t: "The 1st Phuc-Quoc Hoi Conference"
 CD_Nhiep.11.d: "Prime Minister Nhiep has convened the first major conference of the Phuc-Quoc Hoi (National Restoration Association), bringing together party members, government officials, and representatives from across Vietnam. This gathering represents a significant moment in the consolidation of the new political order.\n\nThe conference serves multiple purposes: it provides a platform for discussing policy, strengthens party unity, and demonstrates the government's commitment to democratic processes. Delegates from various regions have traveled to Phu-Xuan to participate, making this one of the largest political gatherings in modern Vietnamese history.\n\nKey topics on the agenda include economic development, administrative reform, and the expansion of the party's influence throughout the country. Prime Minister Nhiep delivers a major address outlining his vision for Vietnam's future, emphasizing modernization, independence, and national unity.\n\nThe conference also serves to honor those who have been loyal to the cause, with many military officers and government officials receiving recognition for their service. The atmosphere is one of optimism and determination, as the party seeks to build a strong foundation for Vietnam's future.\n\nBy the conclusion of the conference, the Phuc-Quoc Hoi has emerged as a more organized and influential force in Vietnamese politics, with a clear agenda and strengthened internal cohesion."
 CD_Nhiep.11.a: "Unity and progress for Vietnam."

 # Coconut Monk
 Cocunut_Monk.1.t: "The Legend of the Coconut Monk"
 Cocunut_Monk.1.d: "In recent years, throughout all of Southern Cochinchina, there has been a folk legend about a wandering monk nicknamed \"Ong Dao-Dua,\" or the Coconut Monk.\n\nRecently, we got reports of him going to Phuoc-Thanh commune, Kien-Hoa Province where he started to build a 14-meter-high bagua platform. Night after night, he sat and practiced asceticism on the platform while receiving money from passersby. He would eat only fruit, mainly coconuts, and only wore a thin shirt, sitting in silence day and night. Curiously, even though he was ordained as a Buddhist monk, he instead practiced and spread a new syncretized belief that incorporates Christianity, Folk beliefs, Cao-Daoism, and Buddhist Dharma around the Kien-Hoa area. He would only bathe once a year on Buddha's birthday (AL 8-4), and we even got a report that he recently bought small barges and two passenger ships to facilitate religious practices and transportation of believers to his sanctuary."
 Cocunut_Monk.1.a: "We will need to monitor him for now..."

 # Diplomacy

 # VIE & USA Support
 VIE_USA_Support.1.t: "[VIE.GetLeader]'s Diplomatic Shift"
 VIE_USA_Support.1.d: "Our attention as of recently has been focused on the ongoing situations in China and Korea, and yet another country in south-east Asia has approached us for assistance. The State of Vietnam, a former French colonial state, has been facing a communist insurgency internally, and a full-scale war from the North Vietnamese state backed by the Soviets. Such an entanglement would likely not take long, and we can predict a rapid collapse of North Vietnam if we were to throw our weight behind the South.\n\nThe Chief of State and Prime Minister have yet to make any requests of us, but the Pentagon is advising us to ready provision of military equipment, and possibly prepare air and ground forces to get formally involved in the event of Northern aggression towards the South."
 VIE_USA_Support.1.a: "We cannot allow the Dominoes to fall."

 VIE_USA_Support.2.t: "Proposed Intervention in Vietnam"
 VIE_USA_Support.2.d: "With the fighting general in Vietnam, Saigon has come to us again, and the list is longer this time. Financial and industrial assistance. Military advisers. Logistical support for a bombing and air campaign. Equipment for the Vietnamese National Army. And, at the end of the list where they hoped it would attract the least attention, direct American military involvement.\n\nThe Pentagon is working through it now. The military assessment will take weeks; the political one is effectively made already, because the alternative to assisting an anti-communist government in Southeast Asia is watching what replaces it and explaining that to the Senate.\n\nThat is the argument, and it is a strong one. The part of it nobody has yet put on paper is where the commitment stops. Every item on that list makes the next item easier to grant, and the last item on the list is American soldiers."
 VIE_USA_Support.2.a: "Prepare the general staff. The dominoes end here."
 VIE_USA_Support.2.b: "Not our problem. We won't risk American servicemen."

 # VIE & CHI
 VIE_Chinese_Cooperation.1.t: "The Chinese Embassy in Saigon"
 VIE_Chinese_Cooperation.1.d: "The mission of [CHI.GetNameDef] has opened on the Rue Catinat. The chancery is modest and most of its staff are consular officers carried over from the old commercial agency, but the flag is up and the accreditation is to our government rather than to the High Commission.\n\nThe recognition matters more than the building. Every state that treats with Saigon directly is a state that has stopped waiting for Paris to answer on our behalf. There are also a hundred thousand Chinese in Cholon whose affairs have until now been handled by clerks with no standing to handle them, and that is a constituency no government here can afford to leave to somebody else.\n\nNeither foreign ministry has been coy about the second calculation behind the exchange. Both of us have a communist movement on our territory that is armed, disciplined, and supplied across a border we do not control."
 VIE_Chinese_Cooperation.1.a: "A friend on the far side of the Viet-Minh."

 VIE_Chinese_Cooperation.2.t: "Joint Vietnamese-Chinese Military Exercises"
 VIE_Chinese_Cooperation.2.d: "As the bond between the [CHI.GetName] and our nation grows, both governments decide to conduct a joint military exercise. Hopefully, both nations can learn from each other in the fight against the Communists."
 VIE_Chinese_Cooperation.2.a: "Excellent!"

 # VIE & Malaysia
 VIE_Malaysia.1.t.a: "Recognition for the Federation in Exile"
 VIE_Malaysia.1.t.b: "Saigon Recognises the Federation"
 VIE_Malaysia.1.t.c: "Saigon Recognises the Fugitives"
 VIE_Malaysia.1.d.a: "Chin Peng's columns hold Kuala Lumpur, the Federation's ministers got out through Singapore, and what is left of the government of Malaya now sits in Kuching on British sufferance. Our recognition goes to them.\n\nThere is little in it for us materially. The exiles command no territory, no revenue and no army worth the name, and our note will be read in London with some irritation, since it commits us to a position Britain has not yet taken. The Chief of State signed it regardless.\n\nThe reason is written along our own northern frontier. A communist movement has taken a country in this region by force of arms and been allowed to keep it, and every argument we make in Saigon about our own war rests on that outcome not being treated as settled. Recognising a government that has lost is how a government that has not yet lost states its intentions."
 VIE_Malaysia.1.d.b: "A note has arrived from Saigon. The Etat du Vietnam recognises this government as the lawful government of Malaya and will continue to receive our representatives as such.\n\nIt is worth precisely what it appears to be worth. Vietnam cannot ship us a rifle it does not need itself, and cannot spare a battalion from a war in which it is losing ground. What it can do, and has done, is put on paper that the men in Kuala Lumpur are occupiers and not a state - and it has done so before London would.\n\nFor a cabinet meeting in borrowed offices in Kuching, that is not nothing. Every foreign ministry that follows Saigon makes our return harder to argue against, and every one that does not makes this exile a little more permanent."
 VIE_Malaysia.1.d.c: "Saigon has recognised the fugitives in Kuching as the government of Malaya. The wire came in over the British commercial channel, which is the tell: the Etat du Vietnam has taken a position London is still preparing to take, and taken it early in order to be seen taking it.\n\nThe administration in Saigon is in no position to lecture anyone on legitimacy. It governs what the Expeditionary Corps holds for it and not one hamlet more, and it has now extended recognition to a cabinet whose writ does not reach past the room it meets in. The comparison writes itself, and our broadcasts will see that it is heard from Penang to Cholon.\n\nThe note has a purpose all the same, and it is not addressed to us. It is addressed to Washington and to the wavering ministries of the region, and what it says is that what happened in Malaya should be regarded as reversible. We will govern in such a way that the question does not stay open."
 VIE_Malaysia.1.a: "We recognise the Federation, wherever it sits"
 VIE_Malaysia.1.b: "Someone, at least, still addresses us as a government"
 VIE_Malaysia.1.c: "Let them post their letters to Kuching"

 # VIE & KOR
 VIE_KOR.1.t: "The Korean War"
 VIE_KOR.1.d: "Across the sea, a fellow anti-communist state in the form of the Republic of Korea is embroiled in a war for survival against the expansionist red menace in the North, and we must assist fellow anti-communist struggles. That said, sending assistance to the South could weaken our domestic forces in the event of a Northern Invasion of the South."
 VIE_KOR.1.a: "Prepare our forces for a protracted fight with the commies and inform the South we will help."
 VIE_KOR.1.b: "We can't spare any troops, but some equipment might help the South."
 VIE_KOR.1.c: "We can't spare anything, we need to prepare for our war."

 VIE_KOR.2.t: "The Threat in Northern Vietnam"
 VIE_KOR.2.d: "With the continuing threat of North Korea, we need to be careful about allowing yet more communist nations in Asia, since it could very easily lead to our downfall. As such, we will be formally proposing that we lead an invasion of North Vietnam led by Korean forces. The South would likely support this and would send their forces, and a victory in North Vietnam would prevent the rise of communism in the SEA region.\n\nThe invasion would see formal deployment of the Korean defense forces, as well as involvement of the air force to provide bombardment, and diplomatic overtures to Washington and Taipei to ensure their support in the event other powers decide to get involved, but the risk is low of their intervention, and the administration and army supports the effort."
 VIE_KOR.2.a: "I will speak to the Chief of State myself and inform him of our offer."

 VIE_KOR.3.t: "[KOR.GetLeader] Proposes a Joint Invasion of North Vietnam"
 VIE_KOR.3.d: "Seoul has made us an offer, and it is a great deal more concrete than anything we have yet had out of Washington.\n\nPresident [KOR.GetLeader] proposes to enter the war against the North at our side. Not advisers and not equipment: three Korean expeditionary divisions committed to the theatre, ground operations across the frontier conducted jointly, and the Korean Air Force in support of them. The staff work was plainly done before the approach was made.\n\nThey have fought this enemy and held him, which is a claim no other government in Asia can make. Set against that, a Korean army fighting Vietnamese on Vietnamese soil is a photograph Hanoi will be using for the next twenty years, and Seoul's own frontier is not a settled question. The general staff should see the plans before anybody answers the telegram."
 VIE_KOR.3.a: "An intriguing prospect. Summon the general staff and prepare plans."
 VIE_KOR.3.b: "We don't need Korean assistance, they should look to their borders first."

 VIE_KOR.4.t: "[VIE.GetLeader] Accepts"
 VIE_KOR.4.d: "Despite the associated risks with a pre-emptive invasion of North Vietnam, the Vietnamese Chief of State agreed to our plan and mobilized his army to the border. Time is against us here, and the relevant preparations are already complete, at the word of our President, we go to war to aid our fellow Asian brothers against the Reds."
 VIE_KOR.4.a: "Excellent, for the Republic of Korea, we fight the red menace, to war!"

 VIE_KOR.5.t: "[VIE.GetLeader] Respectfully Declines"
 VIE_KOR.5.d: "Rather annoyingly, South Vietnam has declined the offer out of hand, claiming that an early war with the North would be far too risky, especially with the possibility of intervention of other nations like Communist China and the Soviet Union. For now, they seem to be shifting their policy towards the Americans but are continuing war preparations either way."
 VIE_KOR.5.a: "If they claim to not need our help, then so be it."

 # VIE & JAP
 VIE_JAP.1.t: "Bao-Dai Requests Us to Sever Ties With Cuong-De"
 VIE_JAP.1.d: "We have received news from the Vietnamese government denouncing our intent to host Prince Cuong-De in Japan. Since Prince Cuong-De has been a friend of Japan with intents on freeing Vietnam from French colonialism, it would be best for us to ignore any requests of attempting to send him back to Vietnam."
 VIE_JAP.1.a: "We will not hand over a Japanase citizen."
 VIE_JAP.1.b: "Let's do what's best and ignore this letter."

 VIE_JAP.2.t: "Japan Refuses to Deport Cuong-De"
 VIE_JAP.2.d: "The Japanese government has firmly refused the Vietnamese request to deport Prince Cuong-De. In their response, the Japanese emphasized that Cuong-De is a friend of Japan and that they will not abandon him, regardless of pressure from other governments.\n\nThis refusal has been met with disappointment in Vietnam, where the government had hoped that Japan would cooperate in removing this potential threat to stability. However, the Japanese position is clear and unwavering.\n\nThe relationship between Vietnam and Japan remains functional, but this episode has highlighted the limits of diplomatic influence when fundamental principles are at stake. Japan's decision to stand by Cuong-De demonstrates their commitment to their friends, even when it creates diplomatic complications."
 VIE_JAP.2.a: "We must respect their decision."

 VIE_JAP.3.t: "Japan Ignores Our Calls"
 VIE_JAP.3.d: "The Japanese government has chosen to ignore Vietnam's repeated calls regarding Prince Cuong-De. Despite multiple diplomatic communications, Tokyo has not provided a substantive response, effectively leaving the matter unresolved.\n\nThis silence is frustrating for the Vietnamese government, which had hoped for a clear resolution to the situation. The lack of response suggests that Japan is either unwilling or unable to address Vietnam's concerns at this time.\n\nThe diplomatic relationship continues, but this episode has created some tension. Vietnam must decide how to proceed in the face of Japan's non-response, balancing the need to address the Cuong-De issue with the desire to maintain good relations with an important regional partner."
 VIE_JAP.3.a: "We will continue to press our case."

 VIE_JAP.4.t: "Cuong-De Pleads Us for Economic Aid"
 VIE_JAP.4.d: "Prince Cuong-De has come to us with a proposal to restore him as the rightful ruler of Vietnam by means of economic aids. We could gladfully accept our old ally and send him the aids he needs in exchange of bringing him back to Vietnam or we could refuse as we would get into more troubles against France and America."
 VIE_JAP.4.a: "We'll gladly gift some aid for Cuong-De."
 VIE_JAP.4.b: "Let's not get invovled in this."

 VIE_JAP.5.t: "Japan Agrees to Send Economic Aid"
 VIE_JAP.5.d: "The Japanese government has agreed to provide economic aid to Prince Cuong-De, supporting his efforts to restore his position in Vietnam. This assistance includes financial support, trade opportunities, and potentially other forms of economic cooperation.\n\nJapan's decision to support Cuong-De represents a significant development in the regional political landscape. It demonstrates Japan's willingness to back alternative leadership in Vietnam and suggests a potential shift in their foreign policy approach.\n\nThis aid will help Cuong-De build his movement and potentially challenge the current Vietnamese government. The implications of this support are far-reaching and could reshape the political dynamics in Southeast Asia.\n\nFor Vietnam, this represents both an opportunity and a challenge. The Japanese support for Cuong-De could lead to new possibilities, but it also creates complications in the relationship between the two countries."
 VIE_JAP.5.a: "This support could change everything."

 VIE_JAP.6.t: "Japan Refuses to Send Economic Aid"
 VIE_JAP.6.d: "Despite Prince Cuong-De's pleas, the Japanese government has decided not to provide economic aid to support his cause. While Japan maintains friendly relations with Cuong-De, they are not willing to commit resources to what they see as a risky and uncertain venture.\n\nThis refusal is a setback for Cuong-De, who had hoped that Japanese support would help him regain influence in Vietnam. Without this economic backing, his options are more limited, and he will need to find other sources of support if he wishes to pursue his goals.\n\nFor the current Vietnamese government, this decision is somewhat reassuring, as it means one less external force supporting their potential rivals. However, the situation remains complex, and the future is still uncertain."
 VIE_JAP.6.a: "We must find another way forward."

 # VIE & PQC
 VIE_PQC.1.t: "[VIE.GetLeader] Demands our Exit!"
 VIE_PQC.1.d: "A formal statement has arrived from Vietnam, and its tone is aggressive. They've demanded we immediately cede the disputed territory of Phu-Quoc and its surrounding islands to their administration, claiming it's vital to the war effort and is recognized by the West as \"rightful Vietnamese's possession.\" The Generals want to know what our response will be."
 VIE_PQC.1.a: "There's nothing for it, pack up the equipment and inform the Republic we are returning."
 VIE_PQC.1.b: "They want the island? They can come for it. Mobilize our forces."

 VIE_PQC.2.t: "Saigon Goes Over Our Heads at Phu-Quoc"
 VIE_PQC.2.d: "The garrison on Phu-Quoc signals that a Vietnamese officer came ashore under a flag of truce and handed them an ultimatum in writing. They are to evacuate the island and transfer it to the administration of the Etat du Vietnam. No note has been delivered to our Foreign Ministry, no approach was made through the French, and we have learned of it from our own stranded soldiers.\n\nThose men are what is left of the formations that crossed the frontier rather than surrender. We have not been able to lift them off that island and we have not been willing to disown them, and Saigon has now made a virtue of our indecision by negotiating with the garrison as though it were a sovereign party to be dealt with directly.\n\nA protest will be lodged. It will be answered politely and it will change nothing. What the affair costs us is legible to every Chinese community from Cholon to Singapore: a government that cannot shelter its own stranded soldiers is a government whose protection may safely be discounted."
 VIE_PQC.2.a: "They treat with our men and not with us."

 VIE_PQC.3.t: "Phu-Dai Accepts!"
 VIE_PQC.3.d: "Thankfully it seems as though reason and logic have persevered, we've received a response from Phu-Quoc indicating they would vacate the island to our government almost immediately. Our bureaucrats will be arriving shortly to set up the civilian government and we are making preparations to construct a large prison complex for captured NVA soldiers."
 VIE_PQC.3.a: "Glad to see that they can be reasoned with."

 VIE_PQC.4.t: "Phu-Dai Declines!"
 VIE_PQC.4.d: "Sadly the forces on Phu-Quoc were not willing to see reason and have rejected our demands to withdraw from an island that belongs to us! The only option is a military one. A small expeditionary army has been prepared and is awaiting the green light to launch the invasion."
 VIE_PQC.4.a: "If diplomacy fails, then the army can do the job."

 # The Brevert Lines
 Brevert_Lines.1.t: "Vietnam Requests Us to Accept the Brevert Lines"
 Brevert_Lines.1.d: "A communication has arrived from Saigon from the President of Vietnam, asking us to consider attending a summit to finalize our ongoing border dispute on maritime limits. In question is the island of Phu-Quoc, which is home to a small KMT exile force and is otherwise fairly small, but its position is vitally important, and abandoning our claim may shake the public perception of our government.\n\nAlternatively, abandoning a claim to a largely small and unneeded island they already administer would go a long way to reducing tensions, and may pave the way for future cooperation with South Vietnam."
 Brevert_Lines.1.a: "We will attend, our claim can be abandoned for the sake of good relations."
 Brevert_Lines.1.b: "Delaying tactics, that island is strategically important, and we won't abandon our claims."

 Brevert_Lines.2.t: "Cambodia Accepts"
 Brevert_Lines.2.d: "A great success! Following their attendance at the summit, Cambodia has agreed to abandon their claim on Phu-Quoc and Tho-Chu islands and has completely withdrawn all diplomatic reservations to our continued administration, this has also allowed us to finalize our other border disagreements with them and will see a lasting peace between our two countries."
 Brevert_Lines.2.a: "Diplomacy prevails once again."

 Brevert_Lines.3.t: "Cambodia Declines"
 Brevert_Lines.3.d: "Phnom Penh has stalled, as Phnom Penh always stalls, and has now declined the conference outright. The stated ground is that it \"directly violated their sovereignty and sacred ancestral lands\".\n\nWe administer the territory. We control it. We have controlled it since before this Khmer government existed, and none of that has ever obliged anybody in international politics to be reasonable about it.\n\nThe difficulty is that the Brevert Lines settle more than Phu-Quoc; the same instrument fixes the whole of our western frontier, and an unsettled line there is a standing invitation. Plans are ready to move forces to the border once the rebellion is dealt with - not to take anything, but to make the Khmer think twice before they mistake our patience for weakness."
 Brevert_Lines.3.a: "Well clearly they aren't willing to accept diplomacy."

 Brevert_Lines.4.t: "Victory in the Border War"
 Brevert_Lines.4.d: "Our forces have thrown the Khmer units back across the frontier, and Phnom Penh has quietly let its reservations over Phu Quoc lapse rather than prolong a fight it cannot win. The island is now firmly under Vietnamese administration, though the local population remains hostile to us. We must work to pacify the region and integrate it properly into Vietnam."
 Brevert_Lines.4.a: "The island is ours, but the people resist."

 Brevert_Lines.5.t: "Defeat in the Border War"
 Brevert_Lines.5.d: "The clash on the Khmer frontier has ended in disaster. Our companies were driven off the ground they went in to take, and Phnom Penh keeps its claim to Phu-Quoc with a great deal more prestige than it had a week ago.\n\nThe damage abroad is worse than the damage on the border. Our neighbours have watched a Vietnamese army fail against a Khmer one; the French have watched the same thing and are asking, in writing, what exactly the operation was meant to achieve; and our standing in the Indochina Struggle has gone backwards by more than this frontier was ever worth.\n\nAt home the criticism is severe and it is not confined to the opposition. The men who have argued longest for independence are the men most damaged by this, because the case for it has always rested on the claim that we could manage our own affairs and our own soldiers. We have just demonstrated otherwise in front of everyone."
 Brevert_Lines.5.a: "This is a grave setback."

 Brevert_Lines.6.t.a: "The Frontier Clash Breaks Off"
 Brevert_Lines.6.t.b: "The Vietnamese Break Off"
 Brevert_Lines.6.d.a: "The fighting on the Khmer frontier has stopped without our taking ground and without Phnom Penh asking for terms. The companies that spent a week pushing at each other across the paddy have withdrawn to the positions they started from, and the staff communique calls the result a restoration of the status quo because no other phrase is available.\n\nNothing is settled. The Brevert Lines, drawn by an Indochinese administration in 1939, run where they ran, satisfy nobody, and remain the only document either government can produce. Phu-Quoc lies where it has always lain, claimed twice over, administered by us and conceded to us by no one.\n\nThe units will be rotated out and the border posts reinforced, which is what follows a quarrel that has not ended. Whoever reopens this file will reopen it from exactly this line."
 Brevert_Lines.6.d.b: "The Vietnamese have pulled back from our border posts without forcing a decision. Our soldiers held the ground they were given to hold; Saigon declined to spend what taking it would have cost, and the shooting has simply stopped.\n\nThe palace will present this as a Khmer success, and within limits that is fair - the kingdom was pressed and did not give way. It should be said plainly in the council chamber that we are no closer to Phu-Quoc than we were, and that our claim still rests on the Brevert Lines of 1939 and on the patience of our neighbours.\n\nThe frontier posts will be rebuilt and the garrisons brought up to strength. Saigon has learned what the ground costs and may yet decide it is worth paying."
 Brevert_Lines.6.a: "Nothing gained, nothing conceded."
 Brevert_Lines.6.b: "The kingdom stands where it stood."

 Brevert_Lines.7.t: "The Frontier Holds"
 Brevert_Lines.7.d: "Saigon gambled that a show of force along the frontier would break our resolve over Phu Quoc. It did not. Our soldiers held their ground and sent the Vietnamese back the way they came, and the kingdom's claim to the island stands undiminished. The palace has made certain that every newspaper in Phnom Penh carries the story."
 Brevert_Lines.7.a: "Cambodia does not bend."

 Brevert_Lines.8.t: "Driven From the Frontier"
 Brevert_Lines.8.d: "The Vietnamese struck at our border posts and our soldiers could not hold them. Our forces have withdrawn from the contested ground, and with them goes any practical hope of pressing our claim to Phu Quoc. The government is left to explain how a dispute over a distant island became a humiliation on our own soil."
 Brevert_Lines.8.a: "A costly lesson."

 Brevert_Lines_no_clash_tt: "§RNo border clash can be fought§! - Cambodia and Vietnam must share a land border, and we must have at least one division stationed in a state adjacent to it"

 # The French-Drawn Borders
 French_Drawn_Borders.1.t: "The French Drawn Border Issues"
 French_Drawn_Borders.1.d: "With their influence in Indochina failing, the French have set about drawing the lines that will separate Vietnam, Laos and Cambodia when they go. The lines are being drawn in Paris, by men who have not seen the ground, and once drawn they will be very hard to move.\n\nOne of them runs through Xiangkhouang. That province was Vietnamese for a long time and was governed under the name Tran-Ninh; it passed to Laotian jurisdiction during the colonial period, as part of the Protectorate of Laos, by an administrative convenience nobody consulted us about.\n\nWe may lodge the claim now, on the historical ground, while the borders are still being settled and a claim can still be entered. Or we may accept the line as drawn and keep our relations with Vientiane amicable, which will matter a great deal in the years when neither of us has a French garrison to hide behind."
 French_Drawn_Borders.1.a: "Tran-Ninh is forever ours!"
 French_Drawn_Borders.1.b: "Let's forget about these claims, we already have enough problems as is."

 # The Crown Domains
 Crown_Domains.1.t: "[VIE.GetLeader] Requests Control Over the Crown Domains"
 Crown_Domains.1.d: "The Crown Domains are the autonomous districts of the northwest and the Central Highlands, governed through their own chieftains rather than through Saigon. They were constituted for two purposes and both are still being served: they protect French interests on the plateau, and they keep Vietnamese settlement out of it.\n\n[VIE.GetLeader]'s government has asked us to transfer them. The request is framed in the language of the war - that a Vietnam fighting communists cannot afford a second administration inside its own borders - and it is offered as an exchange, with their contribution to that war set on the other side of the ledger.\n\nThe war is real and so is the cost of refusing them. But the Domains are the last direct hold we retain on the interior of this country, and once they are handed over they will not be handed back."
 Crown_Domains.1.a: "May they unite together, against a common enemy."
 Crown_Domains.1.b: "We don't want to empower [VIE.GetLeader] too much."

 Crown_Domains.2.t: "The French Accept"
 Crown_Domains.2.d: "Great news, our glorious leader! The French has accepted our request to annex the rest of the Crown Domains that are not under Communist control. With the Crown Domain under our control once again, we are closer than ever to the unification of Vietnam."
 Crown_Domains.2.a: "Another blow to the communists!"

 Crown_Domains.3.t: "The French Refuse"
 Crown_Domains.3.d: "Tragic news! The French refused our request to hand over the Crown Domains to us. Despite our best to convince them that transfering the Crown Domains would be their only hope for us to aid them against the Communist, they still deny us our rightful claim to the Crown Domains. Since the French refuses to hand us the Crown Domains, we shall deny them any chances of victory against the Communists."
 Crown_Domains.3.a: "What are they thinking?"

 Crown_Domains.4.t: "[VIE.GetLeader] Requests Total Annexation of the Crown Domains"
 Crown_Domains.4.d: "The Crown Domains are the autonomous districts of the northwest and the Central Highlands, governed through their own chieftains rather than through Saigon, and constituted to protect French interests on the plateau and to keep Vietnamese settlement out of it.\n\n[VIE.GetLeader] is no longer asking for the administration of them. This request is for the whole: full annexation, the Domains dissolved into the Vietnamese state, the chieftains answerable to Saigon and to nobody else, and the guarantees we gave them at an end. It is presented as the price of their continued effort against the communists.\n\nGranting it settles the interior question permanently and buys us a Vietnam that can fight without one hand behind its back. It also ends every undertaking we have given the montagnards since 1946, and they will not be consulted on the matter."
 Crown_Domains.4.a: "It's time for South Vietnam to be whole."
 Crown_Domains.4.b: "We must not be rash, we'll have to think about it."

 Crown_Domains.5.t: "The French Accept"
 Crown_Domains.5.d: "Great news, our glorious leader! The French has accepted our request to annex the rest of the Crown Domains that are not under Communist control. With the Crown Domain under our control once again, we are closer than ever to the unification of Vietnam."
 Crown_Domains.5.a: "A phenomenal development!"

 Crown_Domains.6.t: "The French Refuse"
 Crown_Domains.6.d: "Tragic news! The French refused our request to hand over the Crown Domains to us. Despite our best to convince them that transfering the Crown Domains would be their only hope for us to aid them against the Communist, they still deny us our rightful claim to the Crown Domains. Since the French refuses to hand us the Crown Domains, we shall deny them any chances of victory against the Communists."
 Crown_Domains.6.a: "Will we ever be able to truly unite Vietnam?"

 # Military

 # Sect Militias
 VIE_Sect_Militias.1.t: "Friend Or Foe?"
 VIE_Sect_Militias.1.d: "Dear Chau,\n\nI have been sent to the Nam-Phan region, in Ben-Tre to protect our country as part of the orders from the VNA's Highcomm. Most days, nothing happens, but the fear stays; I wake up and just want to be home. I saw the news that we have new allies \"integrated\" into the army. They're not my allies; I watched as one of Leroy's \"UMDC Catholic militias\" cut and hacked through random people whom we knew were innocent; that's not the cause I thought we were fighting for. Not to mention that with some of these French's new units, if you turn your back too long, they'll shoot you. We are fighting as best as we can, but this is different than fighting the Japanese. Our French advisors and veteran officers from past world wars don't have any experience fighting something like this. We can go through a village ten times and see nothing wrong, and then the next time, we get ambushed. I'm beginning to think that some of our units are passing on information. The Khinh-Quan units are fairweather friends, and I wouldn't be surprised if they swap sides any day now."
 VIE_Sect_Militias.1.a: "Too high is the price we pay to rid our country from the communist."

 VIE_Sect_Militias.2.t: "Hard Decisions"
 VIE_Sect_Militias.2.d: "In a dimly lit meeting room, French colonial officers and Vietnamese staff gather around a wooden table covered with maps and photographs. The atmosphere is tense as they discuss the urgent threat posed by the Bao-Dai militia - a well-armed, nationalistic paramilitary group that has fought against both Japanese occupation and French colonial rule.\n\n\"We can't ignore this threat,\" a French officer declares, his voice cutting through the heavy silence. \"They are well-trained and their return is alarming.\" Another officer adds, \"Their history of fighting against us makes integration a delicate matter.\"\n\nA Vietnamese commander responds carefully, \"If we don't integrate them, they could become a destabilizing force. But arresting them might escalate the situation further.\" Leaning closer to the silent Vietnamese Chief of Staff, he whispers, \"Remember, they are our people. They fought for our independence. There might be common ground for reconciliation.\"\n\nAll eyes turn to the Chief of Staff, who has remained silent throughout the discussion. The tension in the room reaches a breaking point as everyone waits for his decision. Finally, he speaks:"
 VIE_Sect_Militias.2.a: "Round them up, they are just another threat to be dealt with."
 VIE_Sect_Militias.2.b: "Let's summon their leaders for a meeting, we'll discuss the terms of their integration."

 # Leroy
 VIE_Leroy.1.t: "What Is to Be Done With Leroy"
 VIE_Leroy.1.d: "Jean Leroy commands the UMDC, the Catholic militia of the delta, and he has kept the Christian villages of Ben-Tre out of Viet Minh hands when nobody else could. That much is not disputed by anyone, including the Viet Minh.\n\nHow he has done it is disputed a great deal. The methods reported out of his districts are the methods of a man who intends to be feared, and they have been reported to more than one embassy. A government that takes him into its service takes his record with him.\n\nSo there are two courses. We recruit him and put his counter-insurgency experience where it is needed most, and accept what will be said about us abroad. Or we leave him in Ben-Tre with his militia and his province and no place in the national structure - which keeps our hands clean and leaves an armed man with a following outside the government, exactly where he was."
 VIE_Leroy.1.a: "A little help won't hurt."
 VIE_Leroy.1.b: "He is too much of a brute, recruiting him will only hurt us."

 # VIE & PQC - Military
 VIE_PQC_Mil.1.t: "Vietnam Asks to Integrate the Phu-Dai Army"
 VIE_PQC_Mil.1.d: "In the wake of our Civil War defeat and our subsequent, albeit temporary, relocation to the Taiwan base of operations, our forces have been strategically positioned in various key locations. These deployments were made in anticipation of a potential return to our homeland. Among these, a notable contingent, nearly 33,000 troops under the command of General Huang Chieh, interned themselves on the South Vietnamese island of Phu Quoc. Apart from these forces, our troops have also maintained a presence in Burma.\n\nSince their deployment, these troops have largely remained stationed in Phu Quoc but have since planned to return home. The ongoing conflict in Vietnam presents considerable risks for these forces to rejoin us, as any movement would necessitate navigating through waters controlled by the NVA and PRC or undertaking a difficult alternative route. Amidst these challenging circumstances, the South Vietnamese government has extended an intriguing proposal. They seek our army's engagement in their conflict against the Marxists in the North. Engaging our forces in this manner could significantly impact the advance of communism, a prospect that is currently under intense deliberation. It is also anticipated that such a move would likely receive support from the American side.\n\nGeneral Huang Chieh, who has been operating semi-autonomously, has yet to be informed of this proposal. We stand at a crossroads with the power to either advance this idea or dismiss it before it reaches the General. The decision presents two distinct options:"
 VIE_PQC_Mil.1.a: "Prioritize our strategic needs and decline the proposal. Inform the President that we cannot spare these troops at this juncture."
 VIE_PQC_Mil.1.b: "This should be left up to the General himself, we cannot comment, but would not be opposed to the proposal."

 VIE_PQC_Mil.2.t: "[CHI.GetName] Refuses Our Offer"
 VIE_PQC_Mil.2.d: "[CHI.GetNameDef] has refused. The proposal to integrate the Phu-Quoc garrison into our forces has been rejected, and rejected within days, which tells us it was never seriously weighed.\n\nThe reason given is strategic necessity. Those formations are needed for operations of their own, we are told, and cannot be released to a foreign command - a position that would carry rather more weight if anyone could name the operations, or explain what a stranded garrison on an island is presently contributing to them.\n\nWe are left where we began, and short of the men we had counted on. Reinforcement will have to be found somewhere else, and there are not many places left to look."
 VIE_PQC_Mil.2.a: "Spineless cowards, only looking out for themselves!"

 VIE_PQC_Mil.3.t: "An Offer From [VIE.GetName]"
 VIE_PQC_Mil.3.d: "We have recently received important communication from two sources; our government in Taiwan and the office of the President of Vietnam in Saigon. Both messages pertain to a significant proposal from President [VIE.GetLeader] of South Vietnam. This proposal involves the integration of our forces into the South Vietnamese army as a semi-autonomous unit. Our primary role would be to assist in their ongoing campaign against the communist forces in the North. This opportunity, while not without risks, presents a compelling chance to halt the advance of the communists on the Indochinese peninsula.\n\nIn response to this proposal, a meeting of our officer corps has been convened to deliberate on the path forward. The decision at hand is critical."
 VIE_PQC_Mil.3.a: "Mobilize the soldiers and make preparations for departure, contact the President and tell him we will assist."
 VIE_PQC_Mil.3.b: "We cannot risk ourselves in a conflict whilst the red menace sits in Beijing, decline the request."

 VIE_PQC_Mil.4.t: "The Phu-Dai Army Agrees to Integration"
 VIE_PQC_Mil.4.d: "We had our doubts and they were misplaced. Both the Republic of China and the garrison on Phu-Quoc have agreed to integration, and the men are being moved off the island now.\n\nTheir base of operations transfers to Saigon and they expect to be available for operations almost at once. There is no long period of reorganisation to sit through, because these are not recruits: every one of them has fought a communist army in the field and most of them have done it for the better part of a decade.\n\nThat is the value of the bargain and it is considerable. It also brings into our order of battle several thousand men who lost their own country to this enemy and have spent years on an island thinking about it. They will fight. What they will be like to command is something our staff will discover."
 VIE_PQC_Mil.4.a: "Prepare a general staff meeting and inform our allies."

 VIE_PQC_Mil.5.t: "The Phu-Dai Army Refuses to Integrate!"
 VIE_PQC_Mil.5.d: "Despite our clear request, and the ongoing threat of the Northern Army, General Huang has rejected our request for integration. They seem to want to sit on the sidelines and watch history pass them by. Reports from the French also indicated significant military buildups and expansions by the Phu-Dai's Army on the Island that we should watch for..."
 VIE_PQC_Mil.5.a: "War it is..."
 VIE_PQC_Mil.5.b: "So be it, we will let the cowards sit."

 # PQC Annexes South Vietnam
 PQC_Annexed_South_Vietnam.1.t: "The South is Ours - Now for the North!"
 PQC_Annexed_South_Vietnam.1.d: "With the fall of Saigon and the complete annexation of South Vietnam, our forces have achieved a stunning victory. The Viet Quoc Party and the Phu Dai Army have proven that we are the true defenders of Vietnamese independence, rejecting both French colonialism and communist tyranny.\n\nHowever, our work is not yet complete. The communist regime in the North still holds sway over half of our homeland. To truly unify Vietnam under our banner of nationalist, anti-communist governance, we must now turn our attention northward. The time has come to declare our intention to liberate all of Vietnam from the red menace.\n\nThis will be a difficult campaign - the North Vietnamese forces are well-entrenched and have received support from communist powers. But with the resources of the South now at our disposal, and the righteous cause of national unification driving our soldiers forward, we are confident that the White Star will fly over all of Vietnam."
 PQC_Annexed_South_Vietnam.1.a: "For a unified Vietnam under the White Star!"

 # Northern Question
 VIE_Northern_Question.1.t: "The Northern Question"
 VIE_Northern_Question.1.d: "While we have successfully cleaned up our Viet-Minh in the south, the French and their allies are still fighting against the Northern branch of the Viet-Minh. We could let the French handle this problem while we recuperate or we could lend the French a hand and vanquish the Viet-Minh once and for all."
 VIE_Northern_Question.1.a: "Are we crazy? Let the French handle it."
 VIE_Northern_Question.1.b: "An opportunity presents itself. We will take back our country from the communists!"

 # Chinese Civil War
 VIE_China_Civil_War.1.t: "[VIE.GetLeader] Requests Our Aid for Their Anti Communist War"
 VIE_China_Civil_War.1.d: "The Vietnamese government has sent a formal request for assistance in their ongoing struggle against communism. The request emphasizes the shared anti-communist cause and the importance of supporting fellow nations in the fight against Marxist expansion.\n\nVietnam is facing a significant threat from the communist North, and they believe that international support is crucial for their survival. They are asking for military equipment, economic aid, and diplomatic backing to help them resist the communist advance.\n\nThis request comes at a time when the global struggle against communism is intensifying, and many nations are being forced to choose sides. Supporting Vietnam would mean committing resources to another front in the Cold War, but it could also help prevent the spread of communism in Southeast Asia.\n\nThe decision is not an easy one. Providing aid means getting involved in a complex conflict with uncertain outcomes, but refusing could mean abandoning an ally in need and potentially allowing communism to gain another foothold in the region."
 VIE_China_Civil_War.1.a: "Aid for our anti-communist brothers!"
 VIE_China_Civil_War.1.b: "We must not meddle in other countries' affairs."

 # Economic

 # Self-Determination
 VIE_Econ_SelfDem.1.t: "Our Plead for Economic Self-Determination"
 VIE_Econ_SelfDem.1.d: "Our great leader [VIE.GetLeader] has been taking steps towards convincing our French benefactors to grant Vietnam its rightful economic independence. Their waning control means that seizing the opportunity is much easier, and as such [VIE.GetLeader] has elected to, through his masterful diplomacy, ask the French to decentralise their grasp on our lands by allowing us to directly control all of our major industries and investments. Although this may seem like a form of submission and acknowledgement of French hegemony, it is in fact one of the first steps to creating a glorious independent Vietnam.\n\n[VIE.GetLeader] has organised a course of action for when the French inevitably accept his proposal, and plans to develop even more of the country which he has made flourish."
 VIE_Econ_SelfDem.1.a: "Send the request."

 VIE_Econ_SelfDem.2.t: "Vietnam Requests Economic Self-Determination"
 VIE_Econ_SelfDem.2.d: "The leader of Vietnam, [VIE.GetLeader], has humbly requested more economic independence. Despite their friendly approach to this diplomacy, there are somewhat threatening undertones, given our struggling post-war economy. We control their key industries and a lot of investments, though it may still be wise to let them have more autonomy, lest we risk tension that we cannot afford."
 VIE_Econ_SelfDem.2.a: "We Accept."
 VIE_Econ_SelfDem.2.b: "Allow Them to Buy Out Our Industries."
 VIE_Econ_SelfDem.2.c: "Our Colonial Influence Must Not Waver!"

 VIE_Econ_SelfDem.3.t: "The National Office of Tourism"
 VIE_Econ_SelfDem.3.d: "\"Vietnam is one of the countries in the world which are most likely to appeal to foreign tourists. The courtesy of the Vietnamese race and their inborn politeness is a sure guarantee of a cordial welcome. The extraordinary diversity offered by the places of interest and the people themselves, the proximity of remains of ancient civilizations and up-to-date constructions, and the variety of climate and vegetation make an irresistible impression on even the most hardened globe-trotter. Whether the visitor is an admirer of the arts or landscapes, attracted by the behavior of traditional society, or desirous of watching the development of the country in a post-colonial independence landscape.\"\n\n - Today's propaganda leaflet, we shall announce the establishment of the National Office for Tourism today in [VIE.capital.GetName]..."
 VIE_Econ_SelfDem.3.a: "A modern way to earn some quick buck"

 TruongSa_Islands.1.t: "Settling the Truong-Sa Islands"
 TruongSa_Islands.1.d: "Since the Le Dynasty, the islands off the east coast were collectively called the \"Dai Truong Sa\" Islands and were settled by some Vietnamese fishermen. During the Nguyen Dynasty and under King Minh-Mang's reign, the name Van-Ly Truong-Sa appeared in Phan Huy Chu's map of Dai Nam Nhat Thong Toan Do. Later on in December 21 of 1933, Cochinchina's governor, Jean-Felix Krautheimer, signed Decree No. 4702-CP annexing the aforementioned islands and other \"dependent islands\" into the Ba Ria province of the Indochinese Federation.\n\nAlthough our nation is still poor and at war with Viet-Minh forces, we can divert some of our very limited resources to settle down and incorporate the islands as the \"Truong-Sa\" Islands under the Province of Phuoc-Tuy. Through Sac-lenh 143/NV, which has been signed by our leader [VIE.GetLeader], we can expect the Truong-Sa Islands to be under our complete control effective immediately."
 TruongSa_Islands.1.db: "Since the Le Dynasty, the islands off the east coast were collectively called the \"Dai Truong Sa\" Islands and were settled by some Vietnamese fishermen. During the Nguyen Dynasty and under King Minh-Mang's reign, the name Van-Ly Truong-Sa appeared in Phan Huy Chu's map of Dai Nam Nhat Thong Toan Do. Later on in December 21 of 1933, Cochinchina's governor, Jean-Felix Krautheimer, signed Decree No. 4702-CP annexing the aforementioned islands and other \"dependent islands\" into the Ba Ria province of the Indochinese Federation.\n\nAlthough the Vietnamese nation is still poor and at war with Viet-Minh forces, we have noticed them divert some of their very limited resources to settle down and incorporate the islands as the \"Truong-Sa\" Islands under the Province of Phuoc-Tuy. Through Sac-lenh 143/NV, which has been signed by leader [VIE.GetLeader], we can expect the Truong-Sa Islands to be under their complete control effective immediately."
 TruongSa_Islands.1.a: "Our rightful lands."
 TruongSa_Islands.1.b: "Concerning."

 # May-Day Parade
 MayDay_Parade.1.t: "Unionized Workers Request a May Day Demonstration"
 MayDay_Parade.1.d: "Tran-Quoc-Buu has petitioned half the ministries in Saigon for a permit. He proposes to hold the first annual May Day parade, and he petitions as the representative of a great many scattered trade unions and factory cells which until now have had no representative at all.\n\nThe Xac-Te are against it and have set out their reasons at length. Buu was with the Viet Minh; the confirmation is in their files and is not in doubt. A permitted demonstration of organised workers on the first of May, they argue, is not a parade but an assembly, and an assembly of that size in this city is an invitation the other side will not decline.\n\nThe Ministry of Labour, Agriculture and Social Relations takes the contrary view and puts it more coldly. These unions exist whether we license them or not. A permit brings them into a relationship with the government, gives us a say in who speaks and what is carried, and offers the one chance we are likely to get to guide the whole movement toward the Quoc-Gia cause instead of away from it."
 MayDay_Parade.1.a: "A demonstration during wartime? Absolutely not."
 MayDay_Parade.1.b: "Perhaps we have more to gain from this than we think. Accept their petition."

 MayDay_Parade.2.t: "The 1st National May Day Parade"
 MayDay_Parade.2.d: "The first National May Day - Dien-Hanh Quoc-Gia Ngay Quoc-Te Can-Lao - was held on the second of the month at the Norodom Palace. Phan-Khac-Su, Minister of Labour, Agriculture and Social Relations, led it on behalf of a coalition of factory and trade unions, with the trade unionist Tran-Quoc-Buu on the platform beside him.\n\nThe minister spoke well and at length. The Quoc-Gia cause, he said, has united every class of Vietnamese in defence of the country's culture and its sovereignty against the communist threat. Then came the parade: decorated cars, and workers from Vietnamese and French firms marching under the banners of their own organisations. It had been assembled in a hurry and it looked it.\n\nIt did not reach the end of the route. Some way along, a section of the marchers began chanting communist slogans; the chanting spread; and the Xac-Te and the Gendarmerie brought armoured cars into the square and cleared it. Arrests were made and the remainder of the programme was cancelled. The newsreel of the minister's speech will be released without the footage that came after it."
 MayDay_Parade.2.a: "Sooner or later, the workers shall understand the Quoc-Gia cause."

 # -- News Events --

 Etat_du_Vietnam.0.t: "[GetNewspaperHeader]Bao-Dai Proclaims the \"Etat du Vietnam\""
 Etat_du_Vietnam.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Chief of State Bao-Dai has arrived in the capital to proclaim the unification of Cochinchina and Annam under the State of Vietnam (Etat du Viet-Nam). This declaration marks a significant step toward consolidating Vietnamese territory under a single government.\n\nDespite facing numerous challenges - including colonial administration difficulties, religious paramilitary groups, bandits, and a nationwide communist insurgency - Bao-Dai has succeeded in bringing these two regions under unified control. The new state structure represents an attempt to strengthen Vietnamese autonomy while maintaining the framework of French association.\n\nWith this foundation established, Bao-Dai now seeks to expand his authority over remaining Crown domains and intensify efforts against communist forces. The proclamation signals a new phase in Vietnam's political development, though the path forward remains fraught with challenges.\n"
 Etat_du_Vietnam.0.a: "Interesting."

 BaoDai.0.t: "[GetNewspaperHeader]Head of State Bao-Dai Censors Saigon and Foreign Press"
 BaoDai.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Head of State Bao-Dai has ordered strict censorship of both Saigon and foreign press following critical reports about his personal conduct. Journalist Merry Bromberger's expose revealed the leader's frequent appearances at Hong Kong nightclubs and casinos, drawing comparisons to France's King Louis XVI.\n\nThe government has imposed severe restrictions on publications, particularly those examining Bao-Dai's private life and spending habits. These measures have raised serious concerns among international observers about press freedom and democratic principles in Vietnam.\n\nThis crackdown represents a significant escalation in the state's control over information, potentially damaging Vietnam's international standing and relations with Western powers who value free expression.\n\n"
 BaoDai.0.a: "Freedom of speech..."

 BaoDai.100.t: "[GetNewspaperHeader]Ngo-Dinh-Diem Inaugurated as First President of the Republic of Vietnam"
 BaoDai.100.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Ngo-Dinh-Diem has been sworn in as the first President of the Republic of Vietnam, following the referendum that deposed Chief of State Bao-Dai. The official returns credit Diem with 605,025 votes in Saigon alone, a figure larger than the number of registered voters in the city, and the foreign observers invited to the count have declined to certify it.\n\nThe machinery behind the vote moved faster than the argument about it. A Constituent Assembly was elected, a constitution promulgated, and the State of Vietnam (Quoc-Gia Viet-Nam) became the Republic of Vietnam (Viet-Nam Cong-Hoa) in a matter of weeks. Bao-Dai, who has not returned from France, disputes the legality of the whole proceeding from Cannes; no newspaper in Saigon has carried his statement.\n\nThe new President has promised to govern by the doctrine his supporters call Labour Personalism (Can-Lao Nhan-Vi). He inherits a republic days old, a partition both halves describe as temporary, and a French garrison whose departure is now a matter for negotiation rather than for the calendar."
 BaoDai.100.a: "Vietnam's new miracle man."

 French_Hinh.0.t: "[GetNewspaperHeader]Vietnam Granted Greater Autonomy Within French Union"
 French_Hinh.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - The French government has announced a new administrative arrangement granting the State of Vietnam expanded autonomy within the French Union. General Nguyen-Van-Hinh, who has led the Vietnamese government since last year's political crisis, hailed the agreement as \"a new chapter of partnership\" between France and Vietnam.\n\nUnder the arrangement, Vietnam will retain formal control over its domestic administration while France maintains oversight of defense and foreign affairs. French officials described the deal as a model for cooperative partnership suited to the modern era.\n\nThe agreement has drawn mixed reactions internationally. The United States cautiously welcomed the news, while Vietnamese nationalist groups in exile condemned it as a continuation of colonial rule under a different name. In Saigon itself, the reaction was largely muted - many Vietnamese have long grown accustomed to reading between the lines of official announcements.\n\n"
 French_Hinh.0.a: "A new chapter for Indochina."

 French_Hinh.100.t: "[GetNewspaperHeader]France Reasserts Direct Control Over Vietnam"
 French_Hinh.100.d: "Paris, [?global.date.GetDateStringNoHourLong] - The French National Assembly has approved measures placing the State of Vietnam under direct French administrative supervision. Key ministries in Saigon will now operate under French guidance, and the Vietnamese National Army will be integrated into the French Expeditionary Corps command structure.\n\nGeneral Nguyen-Van-Hinh, head of the Vietnamese government, signed the formal agreement with the French High Commissioner in a brief ceremony in Saigon. Officials in Paris described the move as a stabilizing measure to ensure the ongoing fight against communist insurgency in Indochina.\n\nThe decision has provoked sharp criticism from Washington, which had pressed France to honor Vietnamese self-determination as a condition of American aid. Several Vietnamese political parties have issued formal protests, while nationalist groups have called for renewed resistance. Observers note that France has chosen the certainty of control over the promise of legitimacy - a bet that grows riskier by the day.\n\n"
 French_Hinh.100.a: "The empire endures."

 VIE_Vinh.0.t: "[GetNewspaperHeader]Cuong-De Crowned as Honorary Emperor of Vietnam"
 VIE_Vinh.0.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - In a historic ceremony, Prince Cuong-De has been officially crowned as Honorary Emperor of Vietnam, taking the regnal name Nam-Hung. The coronation marks the culmination of years of political struggle and signals a decisive break from the Bao-Dai era.\n\nDignitaries from across the nation and abroad gathered to witness the momentous occasion. In his coronation address, Emperor Nam-Hung pledged to combat corruption, implement comprehensive reforms, and pursue Vietnamese unification.\n\nThis transition represents a fundamental shift in Vietnamese politics, moving toward a new vision for the nation. Supporters celebrate the change, while observers watch with cautious interest to see whether the new emperor can deliver on his ambitious promises.\n\n"
 VIE_Vinh.0.a: "Interesting."

 CuongDe.0.t: "[GetNewspaperHeader]Bao-Dai Settles in Paris"
 CuongDe.0.d: "Paris, [?global.date.GetDateStringNoHourLong] - Former Chief of State Bao-Dai has arrived in the French capital to begin a life in exile, following his complete loss of support from both the Vietnamese people and the French government. Emperor Nam-Hung's decree has formally sentenced Bao-Dai to permanent exile, barring him from ever returning to Vietnam.\n\nThe fall of Bao-Dai came swiftly after the emperor announced the retirement of all Bao-Dai loyalists from government and military positions. With his political base eliminated and his reputation in tatters, exile became the only option remaining.\n\nBao-Dai now joins the ranks of disgraced former leaders who have spent their final years in French exile, marking a humiliating end to a once-promising political career. His departure signals the definitive end of an era in Vietnamese politics.\n\n"
 CuongDe.0.a: "A fitting end for a Playboy..."

 CuongDe.100.t: "[GetNewspaperHeader]Vietnam Adopts UN's Universal Declaration of Human Rights"
 CuongDe.100.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - The Vietnamese government has officially adopted the United Nations' Universal Declaration of Human Rights, committing the nation to uphold fundamental rights and freedoms. This adoption represents a significant step toward aligning Vietnam with international human rights standards.\n\nThe declaration guarantees freedom of speech, assembly, and religion, along with protections against arbitrary arrest and torture. By embracing these principles, Vietnam demonstrates its commitment to the welfare of its citizens and international norms.\n\nHowever, implementation faces serious challenges. Vietnam remains embroiled in conflict, and security imperatives often conflict with the full exercise of human rights. The government must balance these competing priorities as it works to realize the declaration's principles.\n\nThis adoption nevertheless marks important progress toward a more just society. The commitment will be tested in the years ahead as Vietnam navigates the complex relationship between security and liberty.\n"
 CuongDe.100.a: "Interesting."

 CuongDe_Coup.0.t: "[GetNewspaperHeader]The New Emperor of Vietnam"
 CuongDe_Coup.0.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - Supporters of Prince Cuong-De have staged a successful coup, storming Bao-Dai's residence and forcing his resignation at gunpoint. With French backing, Cuong-De has ascended the imperial throne as Emperor Nam-Hung, marking a dramatic shift in Vietnamese politics.\n\nIn his coronation address, the new emperor pledged to combat political corruption, implement sweeping reforms, and pursue Vietnamese unification. His supporters erupted in cheers of \"Van-Tue! Van-Tue! Van-Tue!\" - \"Long live the Emperor!\" - as foreign dignitaries offered formal greetings.\n\nThis coup represents the culmination of years of political maneuvering and signals the end of the Bao-Dai era. The new emperor now faces the challenge of delivering on his promises while maintaining stability in a nation still grappling with internal divisions and external pressures.\n\n"
 CuongDe_Coup.0.a: "Interesting."

 CuongDe_Successor.0.t: "[GetNewspaperHeader]Nhiep Crowned Head of Vietnam"
 CuongDe_Successor.0.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - Following the death of Emperor Nam-Hung (Cuong-De), Nguyen Rinh Nhiep has been officially installed as Vietnam's new leader. Nhiep, who served as Prime Minister under the late emperor, was chosen to continue the Nam-Hung era's policies and vision.\n\nThe transition has proceeded smoothly, with Nhiep receiving broad support from government and military. In his inaugural address, he pledged to honor Emperor Nam-Hung's legacy and continue building a modern, independent Vietnam.\n\nNhiep's ascension represents continuity rather than change, as he was closely aligned with the late emperor's policies. However, he faces the challenge of maintaining stability without the charismatic leader who had unified the nation.\n\nThe future remains uncertain, but the transition has been completed successfully. Vietnam now enters a new chapter under Nhiep's leadership.\n"
 CuongDe_Successor.0.a: "Interesting."

 CuongDe_Successor.100.t: "[GetNewspaperHeader]Diem Succeeds Cuong-De"
 CuongDe_Successor.100.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - In a surprising development, Ngo-Dinh-Diem has been chosen to succeed Emperor Nam-Hung (Cuong-De) as Vietnam's leader. Diem, a prominent political figure and former supporter of the emperor, assumes power at a critical juncture in the nation's history.\n\nDiem's selection signals a significant shift in Vietnamese politics. Unlike the late emperor, he brings his own distinct vision and policies that may fundamentally alter the government's direction. His connections with the United States suggest Vietnam's foreign policy may evolve substantially.\n\nThe transition has generated mixed reactions. Diem's supporters welcome the change, while others express concern about potential policy reversals. The coming months will reveal whether Diem maintains continuity or charts an entirely new course.\n\nVietnam now enters an uncertain era. Diem's leadership will shape the nation's future in ways that remain to be determined.\n"
 CuongDe_Successor.100.a: "Interesting."

 CuongDe_Successor.200.t: "[GetNewspaperHeader]The Cao-Dai Takeover"
 CuongDe_Successor.200.d: "Tay-Ninh, [?global.date.GetDateStringNoHourLong] - Following the death of Emperor Nam-Hung, the Cao-Dai religious movement has successfully asserted control over the Vietnamese government. Leveraging their strong organizational structure and significant influence in the Tay-Ninh region, the Cao-Dai now lead Vietnam's political future.\n\nThis development marks a fundamental shift in Vietnamese politics, with religious authority assuming a central role in governance. The Cao-Dai bring organizational capabilities and popular support, though their religious orientation may complicate relations with secular elements and international partners.\n\nThe transition has proceeded relatively smoothly, with the Cao-Dai utilizing existing networks to consolidate power. However, questions persist about their ability to govern a diverse nation and maintain unity amid ongoing challenges.\n\nVietnam enters uncharted territory with a religious movement at the helm. The success or failure of this experiment will determine the nation's trajectory for years to come."
 CuongDe_Successor.200.a: "Interesting."

 VIE_JAP.0.t: "[GetNewspaperHeader]Cuong-De's Shift Towards Japan"
 VIE_JAP.0.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - Emperor Nam-Hung (Cuong-De) has announced a significant shift in Vietnamese foreign policy toward closer relations with Japan. This departure from exclusive focus on Western powers signals Vietnam's interest in building stronger ties with Asian nations.\n\nThe new orientation includes plans for economic cooperation, cultural exchanges, and potentially closer diplomatic alignment. Tokyo has welcomed this development, seeing an opportunity to expand Japanese influence in Southeast Asia.\n\nHowever, the realignment has raised concerns among Vietnam's traditional allies, particularly France and the United States, who may view it as a move away from their sphere of influence. The full implications remain unclear as this diplomatic shift unfolds.\n\nFor Vietnam, this represents an attempt to diversify international relationships and reduce dependence on any single power. Whether this strategy succeeds remains to be seen, but it marks a pivotal moment in Vietnamese foreign policy.\n"
 VIE_JAP.0.a: "Interesting."

 VIE_JAP.100.t: "[GetNewspaperHeader]Pan-Asianism Declared"
 VIE_JAP.100.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - Vietnam has officially declared its commitment to Pan-Asianism, a philosophy emphasizing cooperation and unity among Asian nations. This declaration represents a fundamental shift in foreign policy, signaling a move away from alignment with Western powers.\n\nPan-Asianism calls for Asian nations to work together for mutual benefit, free from external domination. It emphasizes shared cultural heritage, economic cooperation, and political solidarity. For Vietnam, this offers an opportunity to build relationships based on equality rather than colonial arrangements.\n\nThe declaration has generated interest throughout Asia, where some view it as a positive step toward regional cooperation. However, Western powers have expressed concern, seeing it as a challenge to their influence in the region.\n\nImplementation will be complex, requiring careful balancing of diverse Asian interests and political systems. Nevertheless, Vietnam's declaration marks an important step toward a new vision of Asian cooperation."
 VIE_JAP.100.a: "Interesting."

 VNA.0.t: "[GetNewspaperHeader]Foundation of the National Army of Vietnam"
 VNA.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - The Etat du Vietnam and France have signed the military accord establishing the Quan-doi Quoc-Gia Viet-Nam, the National Army of Vietnam. Under its terms the Vietnamese battalions raised, paid and officered by the French command pass to Vietnamese command, and Chief of State Bao-Dai is named Commander-in-Chief.\n\nOn paper the force is to reach some 120,000 men under 4,000 officers, every one of whom is to be Vietnamese. That officer corps does not yet exist. France has been commissioning Vietnamese lieutenants for barely two years, and the accord accordingly leaves French officers seconded to Vietnamese units for as long as it takes to replace them. General de Lattre de Tassigny, who pressed hardest for the agreement, told the ceremony that the recruits lacked nothing but training, and that training was the one thing that could not be improvised.\n\nThe accord settles who commands. It leaves open who pays, who arms, and what a national army amounts to while its artillery, its transport and its air support remain with the Expeditionary Corps."
 VNA.0.a: "Danh-Du-To-Quoc!"

 VNA.1.t: "[GetNewspaperHeader]The Foundation of the Vietnamese National Construction Army"
 VNA.1.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - The Bo-Quoc-Phong (National Ministry of Defense) has announced the successful amalgamation of diverse armed groups into a unified military force. This seemingly insurmountable task was achieved through the skillful diplomacy of Chief of State Cuong-De and his ministers.\n\nObservers note that South Vietnamese forces are experimenting with innovative warfare concepts, including Scouting Armored divisions and specialized jungle warfare units (Khinh-Quan). Remarkably, Catholic, Buddhist, and religious sect militaries have all been brought under a single banner, united in the nationalist cause.\n\nThis consolidation represents a major achievement in military organization. With such impressive progress, it appears the southern insurgency may be entering its final phase, and peace could soon be restored to the region.\n\n"
 VNA.1.a: "Interesting."

 VNA.3.t: "1st Yearly Army Parade"
 VNA.3.da: "Saigon, [?global.date.GetDateStringNoHourLong] - Prime Minister [VIE.GetLeader] and Brigadier General Phan-Van-Giao put the first annual army parade through the capital today. It was drawn mainly from the new National Guard, with French divisions marching behind, and the crowds along the route were considerable.\n\nGiao was raised to Lieutenant General on the reviewing stand by the Chief of State, and appointed Inspector-General of the Army and Prime Minister of Trung-Viet in the same announcement. The citation speaks of his patriotism and of his part in raising the first modern Vietnamese force, and on both counts it is earned - the Guard is his creation and would not exist without him.\n\nThree appointments in one afternoon is nonetheless a great deal to give a soldier. Giao now inspects the army he built, governs a region, and sits in the cabinet, and there is no longer anybody in the structure placed to tell him no."
 VNA.3.db: "Saigon, [?global.date.GetDateStringNoHourLong] - Prime Minister [VIE.GetLeader] and Brigadier General Nguyen-Van-Hinh put the first annual army parade through the capital today. It was drawn mainly from the new National Guard, with French divisions marching behind, and the crowds along the route were considerable.\n\nHinh was raised to Lieutenant General on the reviewing stand by the Chief of State, and appointed Inspector-General of the Army and Prime Minister of Trung-Viet in the same announcement. The citation speaks of his patriotism and of his part in raising the first modern Vietnamese force.\n\nThree appointments in one afternoon is a great deal to give a soldier, and this soldier holds a French commission and a French passport as well as a Vietnamese one. Hinh now inspects the army, governs a region, and sits in the cabinet, and there is no longer anybody in the structure placed to tell him no - least of all in Saigon."
 VNA.3.a: "We can bring the fight to the commies now!"

 VNA.4.t: "Foundation of the National Navy"
 VNA.4.d: "The Vietnamese Navy was constituted today as the second armed branch of the National Army, with its subordinate services established alongside it by the same decree.\n\nThe Naval Training Centre at Nha-Trang opens in four months to produce officers, petty officers and rated seamen under the Naval Command, and the first courses are already oversubscribed. There is one difficulty with the programme and it is not a small one: the Navy has no ships. Graduates will be sent to serve aboard French vessels until such time as there are Vietnamese decks to put them on.\n\nA navy that begins with a school and no fleet is easily mocked, and it is being mocked. It is also the only order in which this can be done. Hulls can be bought or given in a season; a Vietnamese officer corps that can take a ship to sea cannot."
 VNA.4.a: "To-Quoc - Dai-Duong!"

 VNA.5.t: "Foundation of the National Air Force"
 VNA.5.da: "An Air Section has been created within the General Staff of the National Army, under the supervision of Field Marshal Giao. It is the beginning of a third armed branch, and at present it is a desk.\n\nWhat it administers is the Liaison Squadron, which the French Air Force commands. Vietnamese pilots fly with it, but they fly as second pilots; every aircraft commander and every lead pilot on every sortie is a French officer. The Section may plan, requisition and report. It may not order an aeroplane into the air.\n\nAcademies for air officers at Nha-Trang and Tan-Son-Nhut have been drawn up and are waiting on approval, which is to say on aircraft and instructors that France has not yet offered. Until then the fatherland's air belongs to whoever is sitting in the left-hand seat."
 VNA.5.db: "An Air Section has been created within the General Staff of the National Army, under the supervision of General Hinh, who flew for the French Air Force himself and is the only man in the building qualified to run it. It is the beginning of a third armed branch, and at present it is a desk.\n\nWhat it administers is the Liaison Squadron, which the French Air Force commands. Vietnamese pilots fly with it, but they fly as second pilots; every aircraft commander and every lead pilot on every sortie is a French officer. The Section may plan, requisition and report. It may not order an aeroplane into the air.\n\nAcademies for air officers at Nha-Trang and Tan-Son-Nhut have been drawn up and are waiting on approval, which is to say on aircraft and instructors that France has not yet offered. Until then the fatherland's air belongs to whoever is sitting in the left-hand seat."
 VNA.5.a: "To-Quoc - Khong-Gian!"

 VNA.6.t: "The Foundation of the Vietnamese National Construction Army"
 VNA.6.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - The Emperor has proclaimed the first national army of a free Vietnam and given it a name with a history: the Viet-Nam Kien-Quoc Quan, the National Construction Army. The old Kien-Quoc Army was Cuong-De's, it was commanded by General Tran-Trung-Lap, and it was destroyed in 1945. Nam-Hung has chosen to say plainly which army this one is descended from.\n\nSome sixty thousand men are being brought into it: the Bao-Quoc Doan, the Ve-Quoc Doan, half a dozen smaller paramilitary bodies, and the French auxiliary formations that have been fighting alongside them without ever being answerable to a Vietnamese officer. They are to be re-equipped, restructured, and placed under a professional Vietnamese officer corps.\n\nIt is a prototype and the government has not pretended otherwise. What is being tested here is whether Vietnamese officers can hold together a force assembled from private armies and colonial auxiliaries, and whether that force will fight for a state rather than for the men who raised it."
 VNA.6.a: "Dan-Quoc - Trach-Nhiem - Quyet Chien!"

 VNA.7.t: "1st Yearly Army Parade"
 VNA.7.d: "The Emperor and General Tran-Quang-Vinh of the Cao-Dai forces put a parade through the capital today, the largest this country has staged. It was drawn mainly from the new National Construction Army, with French divisions marching behind them, and the crowds were told beforehand what they were looking at: a Vietnamese army, in Vietnamese uniform, under a Vietnamese sovereign.\n\nVinh was raised to Field Marshal by decree of Parliament on the reviewing stand, and appointed Inspector-General of the Army and Prime Minister of Trung-Viet in the same breath. The citation speaks of his patriotism and of his part in building the first modern Vietnamese force, and both are earned.\n\nThree offices in one afternoon has nonetheless been remarked upon. Vinh commands the Cao-Dai, the Cao-Dai command Tay-Ninh, and a government that cannot yet disarm its sects can at least promote the man who leads the largest of them. Whether that is statesmanship or tribute depends on who is asked."
 VNA.7.a: "We can defend our nation now!"

 VNG.0.t: "[GetNewspaperHeader]Foundation of the Ve-binh Quoc-Gia Viet-Nam"
 VNG.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Prime Minister [VIE.GetLeader] has announced the formation of the Ve-binh Quoc-Gia Viet-Nam, the Vietnam National Guard, and put its strength at some 60,000 men. The force is not newly raised. It is an amalgamation on paper of the paramilitary bodies that the French administration and the southern notables have been funding separately for the better part of four years.\n\nInto it go Phan-Van-Giao's Viet-binh Doan, the Ve-binh Nam-Viet, the Bao-chanh Doan and the Ve-binh Son-cuoc, together with a dozen smaller formations whose payrolls have never been fully audited. Giao's original project failed precisely because such units answer to the men who raised them, and the decree announced here does not by itself change that. No statement has been made about which of their officers are to be retained.\n\nThe National Guard is intended to garrison the south and release regular units for the field. Whether it becomes a gendarmerie of the state or a legal umbrella over the same private armies will be decided in the provinces rather than in Saigon."
 VNG.0.a: "For the Quoc-Gia's cause!"

 VNA.100.t: "[GetNewspaperHeader]Formation of the Muong National Army"
 VNA.100.d: "[?global.date.GetDateStringNoHourLong] - The Muong people have officially established their own national army, marking a significant development in Vietnam's ethnic politics. This new military force represents the Muong's assertion of identity and determination to protect their interests and autonomy.\n\nThe formation comes during a period of great complexity in Vietnamese politics, with various ethnic groups seeking to assert their rights and protect their communities. The Muong, with their distinct cultural identity and historical presence, are now organizing independent military capabilities.\n\nThis development has profound implications for Vietnam's political situation. An independent Muong military force could contribute to stability by providing security, or it could create tensions with the central government, which may view it as a challenge to its authority.\n\n"
 VNA.100.a: "Interesting."

 # === Montagnard Country - 1950s Events ===

 # -- Country Events --

 # Political

 # Quy-Che 16
 QuyChe_16.1.t: "Quy-Che 16"
 QuyChe_16.1.d: "Today, Chief of State Bao-Dai issued Quy-Qhe 16 after a ceremony in Ban-Me-Thuot with the French High Commissioner of Indochina, Leon Pignon. The Quy-Che, which was written to promulgate the creation of a \"special regulation,\" was designed to provide further Montagnard participation in local affairs in the Trung-Phan Highlands. New regulations reaffirmed the \"eminent rights\" of the State of Vietnam over the newly acquired territories. Quy-Che 16 contained the following regulations related to highland areas of the Domain of the Crown:\n\n 1. The interests of the State of Vietnam should be aligned with the interests of the ethnic minorities (Sac-toc Thieu-so).\n 2. The territory personally belongs to the Chief of State.\n 3. Native Montagnards will be allowed participation in the development of the Highlands.\n 4. The Quoc-Gia governement will respect the tribal system and the culture of the Montagnards."
 QuyChe_16.1.a: "We shall \"civilize\" these minorities..."

 # Bao-Dai Personality Cult
 BaoDai_Personality_Cult.1.t: "The Cult of Bao-Dai"
 BaoDai_Personality_Cult.1.d: "Something unexpected is happening on the plateau. In the Crown Domain of the Southern Highlands, chieftains and village communities have begun placing images of the Chief of State among their own deities - not as a ruler to be honoured, but inside the pantheon, as an avatar of the supreme Creator.\n\nThe anthropologists sent up to look at it report the practice spreading between villages without anyone in the administration having encouraged it. One chieftain, asked to explain, gave the whole of it in a sentence: \"The Emperor is the king of the gods who protects my people's forests and plains.\"\n\nNo government has ever ruled these highlands from Saigon or from Hue by administration alone. What has arisen here of its own accord is precisely the thing every previous attempt has lacked, and the question in front of the ministries is whether it can be encouraged elsewhere without being seen to be manufactured - because the moment it looks manufactured, it stops working."
 BaoDai_Personality_Cult.1.a: "Perhaps we shall incorporate this way of thinking into other tribes..."

 # Fire Water Kings
 FireWater_Kings.1.t: "The Legend of the Jerai's Water and Fire Potato"
 FireWater_Kings.1.d: "Across the Central Highlands, and well into Laos and Cambodia, the Potao Apui and the Potao Ia of the Jerai are revered by peoples who share almost nothing else. The Fire King and the Water King are not chiefs in the ordinary sense. They hold spiritual authority and military standing together, and the tradition holds that they are chosen by the Jade Emperor to stand between the community and the gods.\n\nThe French understood the office well enough to be afraid of it. The present Fire and Water Kings resisted the colonial administration, were jailed for it, and are in prison still - which is the single most useful fact in this file.\n\nA government that released them and honoured them would not be purchasing two men. It would be purchasing the allegiance of the Jerai and the respect of every people from Kontum to the Mekong that looks to them, and it would be paying in a currency the French were never able to spend."
 FireWater_Kings.1.a: "They would be very valuable assets."

 # Montagnard Administrative
 Montagnard_Administrative.1.t: "Establishment of the Montagnard Culture Court"
 Montagnard_Administrative.1.d: "Ban-Me-Thuot, [?global.date.GetDateStringNoHourLong] - The Montagnard Culture Court has been constituted in the capital of the Crown Domain, and it is the first institution in the history of these highlands in which montagnards hold the majority of the seats.\n\nFifteen judges sit on it, ten montagnard and five French. It enforces the law of the Crown Domain, and it holds jurisdiction over the customs, the inheritance and the observances of the peoples of the plateau - matters which until now have been settled by whichever French administrator happened to be posted to the district.\n\nThe Chief of State presides, and that is the arrangement which makes the whole thing possible: a court sitting in his name is a court no provincial official may overrule. Ten of fifteen is a real majority and it was not conceded easily, and the men who won it understand that an institution is worth only what it can be made to do."
 Montagnard_Administrative.1.a: "Let them judge their own"

 # Du-So 21
 Du_So_21.1.t: "Du-So 21"
 Du_So_21.1.d: "Prime Minister [VIE.GetLeader] has signed Du-So 21, and the Domain of the Crown ceases to exist as a separate entity. The Chief of State has given it the force of law.\n\nThe reason stated is reunification and the centralisation of the southern territories, and it is the actual reason. A country fighting for its life cannot maintain a second legal order inside its own borders, administered by different officials under a different sovereign authority, however elegant the arrangement appeared when it was drafted.\n\nWhat remained of the Domain passes into Trung-Phan. The Du carries guarantees - relative autonomy for the highland districts, and the preservation of montagnard culture and montagnard institutions - and those guarantees are written into the text rather than promised alongside it. Whether they hold will depend on men in provincial offices and not on anything signed this morning."
 Du_So_21.1.a: "Looks like this is it."

 Du_So_21.2.t: "The Annexation of the Southern Highland Crown Domain"
 Du_So_21.2.d: "Kontum, [?global.date.GetDateStringNoHourLong] - A small ceremony was held before the Administrative Court this morning, and several thousand came down from the villages for it: chieftains, elders and families of a dozen peoples, standing in a square the French laid out for quite other purposes.\n\nThe Chief of State read the declaration himself. Four years and eleven months after it was constituted, the Domain of the Crown is ended, and the montagnard peoples of the highlands are citizens of the State of Vietnam with everything citizenship carries with it.\n\nHe repeated the guarantee twice, which those present noticed. The autonomy of the highlands is preserved, their institutions are preserved, and their future is a matter for them. It was said in front of the men who will hold him to it, and by the end of the week the whole plateau will know exactly what was promised at Kontum."
 Du_So_21.2.a: "South Vietnam welcomes your peoples with open arms!"

 # Autonomous Republic
 Autonomous_FUL_Republic.1.t: "Our Declaration of Independence"
 Autonomous_FUL_Republic.1.d: "The support of the French Parliament was secured first, and only then did President Pignon declare the independence of the montagnard peoples from their former Vietnamese occupiers. The order of those two events will be remembered against us, and there was no other order available.\n\nThe ceremony at Ban-Me-Thuot was small. Montagnard chieftains stood with French officials and a good many armed men, and the President closed it with a speech on defending the cultural integrity and the future of the montagnard peoples against encroaching Vietnamese colonisation, and on sparing these highlands the bloodshed of the war below. Chiefs and Frenchmen applauded it together, which is not a sight this plateau has often afforded.\n\nFrom the Vietnamese government there has been nothing. No protest, no congratulation, no acknowledgement that the ceremony took place at all. That silence will not last, and what follows it will tell us what our independence is actually worth."
 Autonomous_FUL_Republic.1.a: "We are the legitimate government of the Montagnards."

 Autonomous_FUL_Republic.2.t: "Recognizing the Montagnards?"
 Autonomous_FUL_Republic.2.d: "The Department of State has received a telegram from the newly declared [FUL.GetName], over the signature of President Leon Pignon, requesting recognition of its independence and nationhood.\n\nFrance and her colonies have already recognised it, which is the first thing our analysts noticed. Phu-Xuan has lodged a protest with Paris and with the United Nations, arguing that the Central Highlands have been Vietnamese for centuries, producing the documents to show it, and calling Pignon's republic an illegal device for continuing French colonial rule under another flag. The Emperor's note is careful, well drafted, and difficult to answer on the merits.\n\nThere is no cost-free answer here. Recognition tells Phu-Xuan that Washington will underwrite the dismemberment of a state we have spent four years building up. Refusal tells Paris that we will not support its arrangements even where they are already in force. Whichever we choose will be quoted back at us in Indochina for years."
 Autonomous_FUL_Republic.2.a: "We stand with Phu-Xuan, we do not condone any forms of Neo-Imperialism."
 Autonomous_FUL_Republic.2.b: "We recognize the Montanard(?)'s rights for self-determination and nationhood!"

 Autonomous_FUL_Republic.3.t: "Emperor Nam-Hung Condemns Montagnard Declaration of Independence"
 Autonomous_FUL_Republic.3.d: "Our Emperor Nam-Hung has reacted with fury following Leon Pignon's declaration of Montagnard independence in Ban-Me-Thuot, a move that defied and directly threanted the territorial intergrity of our newly unified nation of Dan-Quoc (People's State) of Vietnam. In his speech, Pignon denounced our Dan-Quoc government, dismissing it as a \"relic of Japanese imperialism and accusing it of pursuing policies that would lead to the cultural erasure of the Montagnard people\".Pignon's call for international recognition and his stark accusation that Vietnam's government was waging \"genocidal colonization\" in the Central Highlands further inflamed Nam-Hung's indignation.\n\nResponding to the declaration, our Emperor Nam-Hung condemned Pignon's as being a mere delusional colonialist playing the role as a white savior and accused him of undermining the unity and sovereignty of Vietnam. He asserted that the Montagnard lands had always been an integral part of Vietnam, vowing to bring stability to the region despite foreign attempts to divide the nation."
 Autonomous_FUL_Republic.3.a: "Another French's colonialist ploy! Our Dan-Quoc cause shall reign supreme!"

 # Combatting Cuong-De
 Combat_CuongDe.1.t: "Leon Pignon declares Cuong-De's regime \"invalid\""
 Combat_CuongDe.1.d: "Leon Pignon has declared this government invalid. The head of the French High Committee in Indochina, speaking at Da-Lat, has named the Emperor a dictator and a threat to the stability of the region, and has called for the immediate cessation of all diplomatic relations with us.\n\nThe language repays attention, because it is not the language of a disagreement between governments. Pignon does not say our policy is mistaken. He says we do not exist as a lawful authority, and that is a formula which ordinarily precedes something rather than concludes it. It has been used in this peninsula before.\n\nThere is one comfort to be had. A High Commissioner in a position to remove us would not have needed to deliver a speech about it first. Pignon is addressing Paris rather than Phu-Xuan, and the fact that he must argue the case at all means the case is not yet won."
 Combat_CuongDe.1.a: "We shall not tolerate any form of Neo-Imperialism!"

 # Dan-Vuong Model in FUL
 FUL_DanVuong_Model.1.t: "Introducing the Dan-Vuong Model to the Montagnards"
 FUL_DanVuong_Model.1.d: "For centuries the montagnard tribes have been held in perpetual inter-tribal war, in superstition, and in beliefs that no outside power has ever found difficult to turn to its own use. That is not an accusation against them. It is the reason every imperialist force that came to Indochina found the highlands easy.\n\nThe self-declared Montagnard \"Republic\" and Leon Pignon's scheme behind it prove the point rather than refute it. A people governed in its own name by a French High Commissioner has not yet learned to govern itself, and there is more respect in saying so plainly than in flattering them.\n\nSo we will teach. The Dan-Vuong model is to be carried into the highlands - into the schools, the markets and the village councils - so that when autonomy is granted them within this country there are men on the plateau capable of exercising it. They are to be our compatriots, and compatriots are made rather than proclaimed."
 FUL_DanVuong_Model.1.db: "For centuries we have been held in perpetual inter-tribal war, in superstition, and in beliefs that no outside power has ever found difficult to turn against us. It is not a comfortable thing to say in our own council. It is also the reason every imperialist force that came to Indochina found these highlands easy.\n\nThe self-declared Montagnard \"Republic\" and Leon Pignon's scheme behind it prove the point rather than refute it. A people governed in its own name by a French High Commissioner has not yet learned to govern itself, and there is no dignity in pretending otherwise.\n\nSo we will learn. The Dan-Vuong model is to be taught in our schools, our markets and our village councils, so that when autonomy comes to us within [VIE.GetNameDef] there are men on this plateau able to exercise it. We are to be compatriots, and compatriots are made rather than proclaimed."
 FUL_DanVuong_Model.1.a: "We are one! We are Vietnamese after all!"

 FUL_DanVuong_Model.2.t: "Nam-Hung's Visit to the Central Highlands"
 FUL_DanVuong_Model.2.d: "The Emperor has come up to Da-Lat. Nam-Hung travelled two days from Phu-Xuan by train and armoured car under the protection of Field Marshal Tran-Quang-Vinh, bringing with him a delegation of Phuc-Quoc veterans - Ngo-Dinh-Diem, Hoang-Nam-Hung and Nguyen-Rinh-Nhiep - into the spa town that served Bao-Dai as a summer capital.\n\nThe party was seen at the Xuan-Huong lake, along the Cote d'Azur, at the Lycee Yersin, and at the new Da-Lat cadet academy, where the Emperor spoke briefly to the officers in training about dreams and about struggle, and said that a nation in difficulty is held up by nothing else.\n\nWhat was not visited has drawn more comment than what was. The route bypassed every one of Bao-Dai's palaces and villas in these hills, and the Emperor described them within hearing of the press as a total waste of money and resources in wartime. The tour is expected to go on to Bao-Loc, Ban-Me-Thuot and Dar-Lac before returning to the capital."
 FUL_DanVuong_Model.2.db: "The Emperor has come up to Da-Lat. Nam-Hung travelled two days from Phu-Xuan by train and armoured car under the protection of Field Marshal Tran-Quang-Vinh, bringing with him a delegation of Phuc-Quoc veterans - Hoang-Nam-Hung and Nguyen-Rinh-Nhiep - into the spa town that served Bao-Dai as a summer capital. The absence from that list of the name everyone expected to find on it has been noted in every drawing room in the highlands.\n\nThe party was seen at the Xuan-Huong lake, along the Cote d'Azur, at the Lycee Yersin, and at the new Da-Lat cadet academy, where the Emperor spoke briefly to the officers in training about dreams and about struggle, and said that a nation in difficulty is held up by nothing else.\n\nWhat was not visited has drawn more comment than what was. The route bypassed every one of Bao-Dai's palaces and villas in these hills, and the Emperor described them within hearing of the press as a total waste of money and resources in wartime. The tour is expected to go on to Bao-Loc, Ban-Me-Thuot and Dar-Lac before returning to the capital."
 FUL_DanVuong_Model.2.a: "We are looking forward to hosting you at Bao-Loc!"
 FUL_DanVuong_Model.2.b: "We are looking forward to visiting Bao-Loc!"

 # Economic

 # Economic Committee
 FUL_Econ_Committee.1.t: "Formation of the Montagnard Economic Committee"
 FUL_Econ_Committee.1.d: "Among the provisions of Quy-Che 16, agreed between the Chief of State and High Commissioner Pignon, was the establishment of the \"Hoi-Dong Kinh-Te Xu-Thuong\", the Economic Committee of the Highlands. It has now been constituted, and it holds the whole of the economic authority for the Crown Domain: proposals, planning and policy alike.\n\nIts first announcement is a wave of reform aimed squarely at the tribes. Montagnards are to have the right to hold land in their own names, which no administration on this plateau has ever granted them, and a programme of infrastructure works follows behind it.\n\nLand title is the substantial part and everything else is decoration. A people who cannot own what they farm may be moved off it by any planter with a concession and a lawyer, and that has been the entire history of these highlands. Whether the right survives contact with the concessions already granted is what the Committee will be judged on."
 FUL_Econ_Committee.1.a: "We will ensure economic prosperity for the region."

 # Colonel Massau's Proposal
 Colonel_Massau.1.t: "Colonel Jacques Massau's Proposal"
 Colonel_Massau.1.d: "There is a proposal from 1949 in the files which was shelved and never quite killed. Colonel Jacques Massu put it forward and High Commissioner d'Argenlieu approved it: retired French soldiers to be settled on the montagnard plateau, given land, and established there as planters.\n\nIt was suspended indefinitely when Bao-Dai returned, for reasons of politics rather than of merit. What it was intended to accomplish was two things at once - a French population rooted in the highlands to hold French interests there without the expense of a garrison, and the development of a region whose economic potential nobody has ever seriously worked.\n\nThe potential is still there and so is the money that would follow it. So is the objection. A colony of armed French veterans planted on ground that Vietnamese and montagnards both claim is not a settlement scheme; it is a future war with a French return address on it."
 Colonel_Massau.1.a: "We need the money!"
 Colonel_Massau.1.b: "This would only divide our nation."

 # French Economic Aid
 French_Econ_Aid.1.t: "The Crown Domain of the Southern Highlands Request Economic Aid"
 French_Econ_Aid.1.d: "The Crown Domain of the Southern Highlands has requested economic aid from the French government. The request was made by the President of the Crown Domain, Leon Pignon, and was approved by the French High Commissioner, Georges Thierry d'Argenlieu. The aid will be used to help the Crown Domain of the Southern Highlands develop its economy and infrastructure."
 French_Econ_Aid.1.a: "Okay."
 French_Econ_Aid.1.b: "No."

 French_Econ_Aid.2.t: "The French Accept."
 French_Econ_Aid.2.d: "The French government has accepted the request for economic aid from the Crown Domain of the Southern Highlands. The aid will be used to help the Crown Domain of the Southern Highlands develop its economy and infrastructure."
 French_Econ_Aid.2.a: "We shall help the Crown Domain of the Southern Highlands develop its economy and infrastructure."

 French_Econ_Aid.3.t: "The French Refuse."
 French_Econ_Aid.3.d: "The French government has refused the request for economic aid from the Crown Domain of the Southern Highlands. The government has cited the Crown Domain of the Southern Highlands' lack of economic development and infrastructure as the reason for the refusal."
 French_Econ_Aid.3.a: "We shall not tolerate any form of Neo-Imperialism!"

 # Central Highland Railway
 Central_Highland_Railway.1.t: "The Central Trans-Indochinese Highland Railway"
 Central_Highland_Railway.1.d: "A delegation of appointed officials from the Domain of the Southern Highland arrived at the palace with a party of French planters and asked for a personal audience with [VIE.GetLeader]. They came with a map.\n\nWhat they propose is the \"Central Trans-Indochinese Highland Railway\": some seven hundred kilometres of line running the length of the steppe below the Annamite Range. The present journey takes seventeen hours in good weather, and the planters put it at two hours less once the line is open. That sounds a thin return until one remembers that the whole economy of the highlands presently moves at the speed of a road which washes out every wet season.\n\nThe planters will find a quarter of the cost from their own pockets, and French contractors and French engineering will do the building. We are asked for the remaining three quarters, and for the security. The line runs for its whole length through country in which the Viet Minh moves as it pleases, and every kilometre of it will have to be guarded for as long as it takes to lay."
 Central_Highland_Railway.1.a: "An ambitious plan, we shall approve it!"
 Central_Highland_Railway.1.b: "We cannot fund a railway and a war at the same time"

 Central_Highland_Railway.2.t: "The Central Trans-Indochinese Highland Railway Plan is Approved"
 Central_Highland_Railway.2.d: "After rounds of negotiation between officials and French plantation owners, our plan to build the Central Trans-Indochinese Highland Railway is approved. We shall begin the railway construction as soon as possible with both government funded and privately funded money to pay the workers. Hopefully this railway will please everyone once it is done!"
 Central_Highland_Railway.2.a: "Excellent!"

 Central_Highland_Railway.3.t: "The Central Trans-Indochinese Highland Railway Plan is Rejected"
 Central_Highland_Railway.3.d: "Despite our best attempt to negotiate with officials and French plantation owners alike, it seems that they rejected our plan for a Central Trans-Indochinese Highland Railway. Unfortunately, this means we will have to rely on the older and longer route to get to our destination then."
 Central_Highland_Railway.3.a: "All of that for nothing."

 Central_Highland_Railway.4.t: "Opening of the Central Trans-Indochinese Highland Railway"
 Central_Highland_Railway.4.d: "Today, we celebrate the opening of the Central Trans-Indochinese Highland Railway. With this railway, we can get around between cities within the railways quicker than before. This is another victory for citizens and plantation owners alike!"
 Central_Highland_Railway.4.a: "Excellent!"

 Central_Highland_Railway.5.t: "The Central Trans-Indochinese Highland Railway is Finished"
 Central_Highland_Railway.5.d: "Great news! After all of the hard work building and securing the railway construction from Viet-Minh sabotage, we managed to get the railway done in time for the grand opening. Let's hope that this project will pay off in the long run."
 Central_Highland_Railway.5.a: "Excellent!"

 # Military

 # Montagnard Armed Forces
 FUL_Armed_Forces.1.t: "Modernizing Our Armed Forces"
 FUL_Armed_Forces.1.d: "The Crown Domain of the Southern Highlands has requested modernization of its armed forces. The request was made by the President of the Crown Domain, Leon Pignon, and was approved by the French High Commissioner, Georges Thierry d'Argenlieu. The modernization will be used to help the Crown Domain of the Southern Highlands defend itself against local Montagnard revolts and Viet-Minh incursions."
 FUL_Armed_Forces.1.a: "We shall modernize our armed forces."

 FUL_Armed_Forces.2.t: "The Central Highlands Request Military Aid"
 FUL_Armed_Forces.2.d: "A telegram has reached [VIE.capital.GetName] and the Ministry of Defence from [FUL.capital.GetName], and its tone comes close to open pleading.\n\nThe Crownland asks for equipment and for advisers, urgently. The returns they enclose explain why. The bulk of what their formations carry dates from the 1910s and the 1930s, and a good deal of it was obsolete when the French first issued it to them. Against montagnard revolts in their own districts and Viet Minh columns coming down off the border, it is not enough, and they say so themselves.\n\nWe have equipment of exactly that vintage sitting in depots because we have replaced it. We also have units of our own still waiting on the replacements."
 FUL_Armed_Forces.2.a: "We will send some of our older equipment."
 FUL_Armed_Forces.2.b: "We don't even have equipment for ourselves, we cannot lend anything."

 FUL_Armed_Forces.3.t: "[VIE.GetLeader] Approves Sending Military Support"
 FUL_Armed_Forces.3.d: "Our urgent request for immediate military assistance and materials has been approved by [VIE.capital.GetName], and the first shipments of their military assistance will arrive shortly soon to our capital. These new assets will undoubtedly help us greatly in combatting our current enemies and stabilize the territories in the name of the Quoc-Gia cause!"
 FUL_Armed_Forces.3.a: "We won't forget their assistance!"

 FUL_Armed_Forces.4.t: "[VIE.GetLeader] Refuses Us"
 FUL_Armed_Forces.4.d: "[VIE.capital.GetName] has refused us. Our request for immediate military assistance and materials is declined, and the reason given is that they are short themselves - constant supply difficulties, and daily fighting between their army and the communists which consumes whatever reaches them.\n\nIt may even be true. It is certainly convenient, and it leaves us precisely where we stood: holding a frontier with rifles older than most of the men carrying them, against an enemy who is better armed every month that passes.\n\nThe territories must still be held and the Quoc-Gia cause must still be served in them. Since the equipment will not be given to us, it will have to be come by in other ways, and the council would be well advised not to enquire too closely what those ways are."
 FUL_Armed_Forces.4.a: "We shall ask the French next time."

 # Militarizing the FUL-VIE Border
 Militarize_Viet_Border.1.t: "Further Militarization in the Central Highlands"
 Militarize_Viet_Border.1.d: "The Crown Domain of the Southern Highlands has asked for its frontier with Vietnam to be militarised further. President Pignon made the request and High Commissioner d'Argenlieu has approved it.\n\nThe justification offered is entirely internal: montagnard revolts in the Domain's own districts, and Viet Minh columns working the highland passes. Both are real, both are worsening, and neither can be answered by the security battalions at their present strength.\n\nWhat the request does not trouble to explain is why a defence against revolt and infiltration should be built along the Vietnamese border in particular, rather than around the districts actually in revolt. Nobody in Da-Lat has raised the question. Nobody in Saigon has failed to notice it."
 Militarize_Viet_Border.1.a: "Post the battalions, and let Saigon draw its own conclusions"

 # Diplomacy
 VIE_Beg_Pulo_Condore_Return_tt: "A formal request will be submitted to @FRA §YFrance§!, which may agree to transfer §YCon Island§! to us."

 VIE_Pulo_Condore.1.t: "A Note on the Restitution of Pulo Condore"
 VIE_Pulo_Condore.1.d: "The Council of Ministers has completed its consideration of the status of the Con Dao archipelago, which remains under direct French administration as Pulo Condore. Although France continues to maintain its prison establishment and naval facilities there, the islands are historically and geographically an integral part of Vietnam.\n\nOur government remains associated with France and must therefore proceed through the proper diplomatic channels. A formal note has been prepared for transmission to Paris, respectfully requesting that sovereignty and administrative responsibility for the archipelago be restored to Vietnamese administration."
 VIE_Pulo_Condore.1.a: "Transmit the note to the French Government."

 VIE_Pulo_Condore.2.t: "Vietnam Requests the Restitution of Pulo Condore"
 VIE_Pulo_Condore.2.d: "The Government of [VIE.GetNameDef] has presented a formal note requesting the restitution of Pulo Condore, known to the Vietnamese as Con Dao. Saigon maintains that the archipelago forms an inseparable part of Vietnamese territory and that continued direct French administration is no longer consistent with the developing constitutional relationship between France and Vietnam.\n\nThe islands retain value as a penal colony and as a modest naval station commanding the approaches to southern Indochina. Nevertheless, transferring them would remove a persistent grievance, affirm France's declared policy of devolving administrative responsibility, and strengthen a government upon whose cooperation the defense of Indochina increasingly depends."
 VIE_Pulo_Condore.2.a: "The islands shall be restored to Vietnamese administration."
 VIE_Pulo_Condore.2.b: "French administration shall continue for the present."

 VIE_Pulo_Condore.3.t: "France Approves the Restitution of Pulo Condore"
 VIE_Pulo_Condore.3.d: "The French Government has formally accepted our request concerning Pulo Condore. French civil and military authorities have been instructed to arrange an orderly transfer of the archipelago, including its port, radio station, and prison establishment, to our representatives.\n\nOur flag now flies over Con Dao, and the islands have at last been restored to Vietnamese sovereignty. The settlement constitutes a modest but tangible advance in the recovery of our national patrimony."
 VIE_Pulo_Condore.3.a: "Con Dao returns to Vietnam."

 VIE_Pulo_Condore.4.t: "France Refuses the Restitution of Pulo Condore"
 VIE_Pulo_Condore.4.d: "The French Government has rejected our request for the restitution of Pulo Condore. Its reply cites the continuing military importance of the archipelago, the requirements of the prison administration, and the unsettled security situation in Indochina. Paris has offered no definite date upon which the matter might be reconsidered.\n\nThe decision has caused considerable disappointment within the Council of Ministers. Our claim remains unaltered, but so long as our government remains dependent upon French protection, our means of pressing it are necessarily limited."
 VIE_Pulo_Condore.4.a: "Vietnam's rights cannot be set aside indefinitely."

 DaLat_Question.1.t: "Requesting the Return of Da-Lat"
 DaLat_Question.1.d: "The Ministry of Foreign Affairs has sent a telegram over President Sogny's signature to the self-proclaimed Emperor of Vietnam and the government at Phu-Xuan, demanding the return of Da-Lat to our jurisdiction as our rightful capital.\n\nThe case rests on the boundaries the French themselves drew. Da-Lat was founded in 1890, after Doctor Yersin's expedition, as a spa town for the colonial elite, and it lies inside the provincial lines the administration laid down for the Central Highlands rather than inside Vietnam. It has been the de facto capital of the plateau ever since, a fact even Bao-Dai conceded and put into law with Du-So 6/QT/TG.\n\nWe are therefore asking for a city we administer in all but name, on the strength of a decree issued by the man whose successor now occupies it. That is a strong case in a chancellery and a weak one on the ground, where Phu-Xuan has soldiers in the town and we have a telegram."
 DaLat_Question.1.a: "Send a telegram to Paris and mobilize our armies!"

 DaLat_Question.2.t: "Pignon and his Colonialists Demand Control of Da-Lat"
 DaLat_Question.2.d: "The Ministry of Foreign Affairs has received a demand addressed to the Emperor from the colonial occupation regime of the Central Highlands, over the signature of Leon Sogny, concerning the control and jurisdiction of Da-Lat.\n\nThe record is not in dispute. The Nguyen dynasty settled these territories in the 1700s. When the French came in 1883 they acknowledged our right to them and left us nominal control, which we held without interruption until the recent drama. Da-Lat itself was founded in 1890, after Doctor Yersin's expedition, as a spa town for the French ruling elite; it has since become the de facto capital of the Central Highlands, a status Bao-Dai himself restated and made law in Du-So 6/QT/TG.\n\nThe demand therefore asks us to concede by telegram what was never conceded in seventy years of colonial administration, and to concede it while the rest of the Trung-Phan highlands sits under an occupation we have never recognised. The city is ours. What remains to be settled is how far this government is prepared to go on saying so."
 DaLat_Question.2.a: "Fortify the city and send Paris a telegram!"

 DaLat_Question.3.t: "Drama Over Da-Lat"
 DaLat_Question.3.d: "The Ministry of Foreign Affairs has two telegrams on the same desk. One is from Emperor Nam-Hung of Vietnam and one from President Leon Pignon of the Montagnards, and both of them concern Da-Lat.\n\nThe fault is ours. When we drew the modern boundaries of the Central Highlands we permitted Da-Lat to be founded as a spa town for our own ruling elite and never troubled to define its status, and it has functioned ever since as an ill-tempered condominium between the former Annam High Residence and the Nguyen Protectorate. The arrangement held for as long as neither party had anything better to do.\n\nBoth now have. There are reports of skirmishes and of militarisation across the plateau, and we are in no condition to conduct a second quarrel behind the first. The Ministry proposes the least dignified solution available, and very probably the only workable one: buy the city from Nam-Hung's government for four hundred million francs, transfer it to Pignon, and pay for the quiet."
 DaLat_Question.3.a: "Hopefully this can de-escalate the situation..."

 DaLat_Question.4.t: "France Proposes a Deal"
 DaLat_Question.4.d: "The Ministry of Foreign Affairs has a telegram from the Ministry of Overseas France. Paris offers four hundred million francs for Da-Lat, and modern weapons for our war on top of the money.\n\nThe Emperor did not take an hour over it. He rejected the offer where he stood, and Parliament, which had been sitting quietly until the text was read out, dissolved into an uproar that took the Speaker twenty minutes to quiet. Nobody in the chamber argued for accepting.\n\nThe reply went out the same afternoon, drafted in haste and sent without revision. It thanks the Republic for its consideration and states the position in the Emperor's own words: \"our fatherland is like our guts and flesh, thus we rather die rather than sell pieces of our own kind!\" That sentence is already in the Phu-Xuan papers and will be in the Saigon papers tomorrow."
 DaLat_Question.4.a: "Retaliation only means a communist victory!"
 DaLat_Question.4.b: "Perhaps we can bypass Cuong-De, we really need the supplies..."

 DaLat_Question.5.t: "Phu-Xuan Declines Our Offer"
 DaLat_Question.5.d: "Phu-Xuan has answered on Da-Lat, and the Ministry would prefer the answer had come by diplomatic bag rather than by open telegram.\n\nIt was drafted in anger and sent without anyone thinking better of it. Four hundred million francs and a consignment of modern weapons are refused in a single line - \"Our fatherland is like our guts and flesh, thus we rather die rather than sell pieces of our own kind!\" - and the rest is addressed to our motives rather than our terms.\n\nThe closing passage is the one worth minuting. If France cannot support the regime she installed, the Emperor writes, and proposes instead to carve it up, then France is simply arranging a Viet Minh victory by instalments. It is offensive, it was meant to be, and no one in this building has yet produced an answer to it."
 DaLat_Question.5.a: "Redirect the money and aid to Pignon. Advise him to not pursue this matter further!"

 DaLat_Question.6.t: "A Disappointing Outcome"
 DaLat_Question.6.d: "The Ministry of Overseas France has replied to our demand for Da-Lat, and the reply is a refusal wrapped in a present.\n\nCuong-De, we are told, has threatened to invade us over the question. Paris is not prepared to destabilise an ally in Indochina while the Viet Minh stand to inherit whatever falls, and advises us in the plainest language a friendly government can use to let the matter drop.\n\nBy way of consolation, four hundred and fifty million francs and a consignment of modern weapons arrive tomorrow, described as a complimentary gift marking our recent independence and our membership of the French Community. We are being paid not to press a claim that Paris itself recognised in writing, and the money is arriving so promptly that it was clearly authorised before the refusal was drafted."
 DaLat_Question.6.a: "We will never forget this betrayal!"

 DaLat_Question.7.t: "The Return of Da-Lat"
 DaLat_Question.7.d: "The Ministry of Overseas France has confirmed it. Cuong-De's government has stood down and signed the instrument transferring Da-Lat to us. The city is ours in law and will be ours in fact within the week.\n\nThe rest of the telegram spoils the celebration. Paris advises us - and the wording is not the wording of advice - to begin repairing our relations with Phu-Xuan at once, on the ground that France can do nothing further for us here without provoking a retaliation that would end this country before it has properly begun.\n\nThat warning arrives alongside reports we have not been able to confirm: Cuong-De's formations moving, and works going up along the frontier. We have won the city. Whether we have won anything else will be established on the border rather than in the archives."
 DaLat_Question.7.a: "Let's hope this wasn't a pyrrhic victory..."

 # Da-Lat Question

 # -- News Events --

 Autonomous_FUL_Republic.0.t: "[GetNewspaperHeader]The Montagnards Declare Independence"
 Autonomous_FUL_Republic.0.d: "Ban-Me-Thuot, [?global.date.GetDateStringNoHourLong] - The highland peoples known collectively as the montagnards have proclaimed an interim government and declared themselves independent of both Vietnamese states. The ceremony was held in this town and broadcast across Indochina, and the declaration was read by Leon Pignon, the former High Commissioner of Indochina, who argued for highland self-determination long before there was any constituency for it in Paris.\n\nPignon spoke for the better part of an hour. He presented the new government as a defence of the cultural integrity and the future of the montagnard peoples against what he called an aggressive Vietnamese colonisation of the plateau, and as a means of keeping the war in the deltas from spilling into the highlands. He closed with an appeal to the world powers for recognition and for help in holding a peace he described as fragile.\n\nNo government has yet answered. Saigon has declined to comment, which is an answer of a kind: the plateau carries the rubber estates, the roads running east from the Laotian frontier, and the ground on which any campaign for the central provinces would have to be fought."
 Autonomous_FUL_Republic.0.a: "Congrats on your independence?"

 # -- Cuong-De Recruit Events --
 VIE_CD_Recruit.1.t: "Recruiting Lieutenant General Phan-Van-Giao"
 VIE_CD_Recruit.1.d: "Lieutenant General Phan-Van-Giao is Premier of Trung-Phan and founded the Viet-Binh-Doan, which he still commands. He has the patriotism and the military experience this undertaking needs, and if he can be brought over he brings the National Guard with him.\n\nHe is also, on the face of it, the least likely man in Vietnam to come. Giao was among Bao-Dai's most fanatical loyalists and helped draft the Bao-Dai solution itself in 1948, and he has spent every year since building the regime and its army.\n\nWhich is precisely why he is worth approaching now. Factionalism and his own inconvenient patriotism have pushed him to the edge of the circle he helped create, and there is a proposal in Saigon to replace him outright with Nguyen-Van-Hinh and the pro-French officers around him. A man about to be discarded by the arrangement he built is a man who will at least read the letter."
 VIE_CD_Recruit.1.a: "Send him a letter, a promise of promotion, and acknowledgment for his efforts."
 VIE_CD_Recruit.1.b: "Just send him a letter."

 VIE_CD_Recruit.2.t: "General Giao accepted our invitation"
 VIE_CD_Recruit.2.d: "Great news, thanks to our persuasion and the righteousness of our cause, General Giao has accepted the invitation and vowed to support our causes by preparing detachments of his loyalist Viet-Binh Doan forces for our upcoming coup!"
 VIE_CD_Recruit.2.a: "Great!"

 VIE_CD_Recruit.3.t: "General Giao rejected our invitation"
 VIE_CD_Recruit.3.d: "Sadly, despite our persuasion and the righteousness of our cause, General Giao laughed at the invitation and stated that our \"cause\" was naive and would contribute nothing but further instabilities in our country, he even stated that detachments of his loyalist Viet-Binh forces are ready to combat against our upcoming \"coup\"!"
 VIE_CD_Recruit.3.a: "You are nothing without us!"

 VIE_CD_Recruit.4.t: "Recruiting Brigadier General Nguyen-Van-Xuan"
 VIE_CD_Recruit.4.d: "Brigadier General Nguyen-Van-Xuan is Prime Minister of Cochinchina and founded the Nam-Ky Ve-Binh, which he still commands. He has both the patriotism and the military record this undertaking requires, and Nam-Phan comes attached to him.\n\nHis history is the argument for approaching him. Xuan opposed the Bao-Dai solution from the first, which is why the French chose him to head their self-proclaimed Cochinchinese Republic instead. He has modernised Nam-Phan a good deal since, and he has failed entirely to master either the Viet Minh or the sect armies, and he knows both facts better than we do.\n\nWhat makes him valuable is what makes him difficult. Xuan is a French loyalist through and through - so bringing him across would do more than any argument of ours to persuade Paris that Cuong-De is the rightful leader of Vietnam, and it would hand us a pacified Nam-Phan into the bargain."
 VIE_CD_Recruit.4.a: "Send him a letter and recognize his authority in Nam-Phan."
 VIE_CD_Recruit.4.b: "Just send him a letter."

 VIE_CD_Recruit.5.t: "General Xuan accepted our invitation"
 VIE_CD_Recruit.5.d: "Great news, thanks to our persuasion and the righteousness of our cause, General Xuan has accepted the invitation and vowed to support our causes by securing the Nam-phan Region under our leader Cuong-De's forces control after the coup."
 VIE_CD_Recruit.5.a: "Great!"

 VIE_CD_Recruit.6.t: "General Xuan rejected our invitation"
 VIE_CD_Recruit.6.d: "Sadly, despite our persuasion and the righteousness of our cause, Brigadier Xuan rejected the invitation and stated that he would submit Cochinchina's authority to Bao-Dai and the French rather than an IJA collaborator"
 VIE_CD_Recruit.6.a: "Disappointing."

 VIE_CD_Recruit.7.t: "Recruiting Major Le-Van-Ty"
 VIE_CD_Recruit.7.d: "Major Le-Van-Ty commands the Ve-Binh Nam-Ky. He fought in Europe and again in Indochina during the last war, which is a record almost no other Vietnamese officer of his age can produce, and it is the reason he is worth having.\n\nTy is the rising man in Bao-Dai's young Viet-Binh-Doan and is respected well beyond it, the French officers included. He has spent recent years helping Nguyen-Van-Xuan and Bao-Dai build their armies and has done it competently and without complaint.\n\nWhat is not known is what he wants. Ty has never taken a political position, never attached himself to a faction, and by every account regards the whole business with a professional's indifference. That makes him the safest approach on our list and the least predictable: a man who has refused every other side may simply refuse ours as well."
 VIE_CD_Recruit.7.a: "Send him a letter, promise of promotion, and acknowledgment for his war career."
 VIE_CD_Recruit.7.b: "Just send him a letter."

 VIE_CD_Recruit.8.t: "Colonel Ty accepted our invitation"
 VIE_CD_Recruit.8.d: "Great news, thanks to our persuasion and the righteousness of our cause, Colonel Ty has accepted the invitation and vowed to support our causes by securing the loyalty from his forces and professionalism for our future Army."
 VIE_CD_Recruit.8.a: "Great!"

 VIE_CD_Recruit.9.t: "Colonel Ty rejected our invitation"
 VIE_CD_Recruit.9.d: "Sadly, despite our persuasion and the righteousness of our cause, Colonel Ty rejected the invitation and stated that he was only but a soldier and only concerned about army affairs rather than politics or regime changes."
 VIE_CD_Recruit.9.a: "Disappointing."

 # -- Cuong-De Hung PM Events --
 CD_Hung.1.t: "Taipei Answers Prime Minister Hung"
 CD_Hung.1.d: "Prime Minister Hung has come back from Taipei with what he went for. The Republic of China will send a military mission, and it will send rather more than advisers: an ordnance establishment is to be fitted out at Chinese expense, to supply small arms and ammunition to our army from Chinese patterns and Chinese stocks.\n\nThe formal instrument is an association for anti-communist cooperation, chaired on our side by the Prime Minister and staffed out of both foreign ministries. What it does in practice is put Nationalist Chinese officers into our training establishments and Chinese rifles into our depots, without asking Paris for either.\n\nThe attraction on their side is easy enough to state. They lost a mainland to this same enemy and have not stopped believing they will go back for it, and a Vietnam that fights and holds is the first argument they have had in three years. Ours is simpler still. This is the only military assistance available anywhere in Asia that arrives without a French signature on it."
 CD_Hung.1.a: "We shall fight against communism together!"

 CD_Hung.2.t: "The Anti-Communist United Front"
 CD_Hung.2.d: "The Anti-Communist United Front has been constituted and the Prime Minister chairs it himself. It brings the nationalist parties, the sect leaderships, the veterans' associations and the government into one standing body with a single declared object, and the declaration was drafted precisely so that no man could sign it and remain ambiguous afterwards.\n\nThat was the purpose of the exercise. Vietnamese politics has run for years on men who denounce communism in Saigon while keeping a channel open to the maquis against a change in the wind. The Front closes the channel. Its membership is a published list, and the list will be read in Hanoi quite as carefully as it is read here.\n\nThe answer has already come. The Viet Minh have named the signatories individually in their broadcasts and undertaken to deal with them accordingly. Prime Minister Hung has been shown the transcripts and told the chamber that this is simply the price of knowing who one's friends are."
 CD_Hung.2.a: "We shall fight against communism together!"

 CD_Hung.3.t: "Modernize war tactics"
 CD_Hung.3.d: "In a significant military development, the Vietnamese government has announced the modernization of its war tactics. The modernization will be used to help the Vietnamese government defend itself against local Montagnard revolts and Viet-Minh incursions. The modernization will include the use of new weapons and equipment, as well as the training of new troops."
 CD_Hung.3.a: "We shall modernize our war tactics to help the Vietnamese government defend itself."

 CD_Hung.4.t: "Clearing Out the Left"
 CD_Hung.4.d: "The Prime Minister has ordered the campaign carried up a level, and it has been carried up in two places at once.\n\nInside the government the sweep is administrative. Officials with the wrong associations are being retired, transferred or arrested according to the thickness of the file on them, and the ministries worst affected are Labour, Education and Information, which is where men of that persuasion have always found employment. It is being done quickly and without much regard for the quality of the evidence.\n\nOutside it the campaign is military. Twenty thousand men and a great deal of money have gone into operations against the Viet Minh cells and the montagnard bands in the disputed districts, and those districts are now clear - the administration has gone back in, the tax rolls are being rewritten, and the provinces are ours in fact as well as on the map. The left will be quieter for all of this. Whether it will be smaller is another question, and the answer will come out of the villages we have just occupied."
 CD_Hung.4.a: "Better an empty office than a doubtful one"

 # -- Cuong-De Diem PM Events --
 NH_DIEMa.2.t: "President Ngo-Dinh-Diem's Labour Personalist Revolutionary Policies Unveiled"
 NH_DIEMa.2.d: "Saigon, [?global.date.GetDateStringNoHourLong] - The President has set out the first of the Labour Personalist measures of the Social Revolution. There are two of them, and they are meant to be read together.\n\nThe War Against the Four Sins opens a campaign against drink, gambling, prostitution and opium. The government presents it as a work of moral foundation rather than of policing, and its supporters argue that a people asked to make sacrifices for a revolution must first be given something to be sober for. Its opponents observe that all four vices are presently licensed, taxed, and in some cases farmed out to men with private armies.\n\nThe People's Welfare Programme is the other half of the argument: an expansion of social services, of medicine and of schooling, on the principle that these are owed to the citizen rather than sold to him. Between them the two measures amount to the claim that this government intends to reach into ordinary life more deeply than any administration Vietnam has had. That claim will be tested in the villages, where neither programme has yet arrived."
 NH_DIEMa.2.a: "We are the liberators of the Can-Lao people"

 NH_DIEMa.3.t: "Establishment of the Cong-Nong Revolutionary Party"
 NH_DIEMa.3.d: "Saigon, [?global.date.GetDateStringNoHourLong] - In a significant political development, comrades of Ngo-Dinh-Diem , patriotic elements within Emperor Nam-hung's associations and syndicalist trade unions has officially entered the political arena, forming the Cong-Nong Revolutionary Party. Early participating figures include Huynh-Huu-Nghia, Ngo-Dinh-Can, Tran-Trung-Dung, Tran-Chanh-Thanh, and Nguyen-Dinh-Thuan.\n\nThe Cong-Nong Revolutionary Party will serve as a central apparatus alongside the National People's Front (Mat-Tran Quoc-Dan), mirroring the structure of a Vanguard Communist Party. Dedicated to the total liberation of the people, the party aims to protect human dignity, combat materialistic greed, and uphold the Labour Personalist revolutionary principles championed by Ngo Tong-thong and Ngo-Dinh-Nhu.\n\nThe party has garnered support from various organizations, including the United People's Movement and the Association of Veterans for National Salvation. This coalition seeks to mobilize broad support for Diem's Labour Personalist vision of a socially just, economically self-sufficient, and spiritually enriched Vietnam."
 NH_DIEMa.3.a: "Nhan-Vi, Cong-dong, Dong-tien!"

 NH_DIEMa.4.t: "The President Reforms the National People's Front"
 NH_DIEMa.4.d: "The National People's Front (Mat-tran Dan-quoc Quoc-Gia) has been reconstituted by presidential declaration. The Front was the Emperor's instrument - the body through which Nam-Hung propagated the Dan-Vuong model, and by which a dozen movements that agreed on nothing else were made to sit in one hall. President Ngo-Dinh-Diem has not abolished it. He has taken it over.\n\nThe declaration issued by the conference binds the Front to the Emperor's Pan-Asianist programme and, alongside it, to Labour Personalism. Everything that was in the Front remains in it: the National Resistance Front and the National Youth of the Cao-Dai, the Hoa-Hao Dan-Xa party, the Republican Youth, the Women's Solidarity Syndical, the Cong-Nong Revolutionary Party, the Spiritual Group, the civil servants' and journalists' syndicals, the Pure Land Buddhists, the Catholic Society, the General Confederation of Labour, the People's Union Movement, the Citizens' Group, the Resistance Veterans, the Viet-Nam Quoc-Dan Dang, the Mat-Tran Quoc-Dan and the Quang-Phuc Hoi.\n\nA membership list of that length is a claim about the nation rather than a description of an organisation, and the bodies on it are perfectly aware of the fact. What the reformation gives the government is a single address at which every mass movement in the country can be reached. What it costs the government is that every quarrel inside the Front is now a quarrel inside the state."
 NH_DIEMa.4.a: "Dan-vuong, Can-Lao!"

 NH_DIEMa.5.t: "President Ngo-Dinh-Diem Announces Formation of National Revolutionary Movement"
 NH_DIEMa.5.d: "Saigon, [?global.date.GetDateStringNoHourLong] - President Ngo-Dinh-Diem has announced the founding of the National Revolutionary Movement (Phong-trao Cach-mang Quoc-Gia), an umbrella body gathering the mass organisations aligned with the Cong-Nong Party. Its declared purpose is to propagate Labour Personalism and to hold every member organisation to it, against materialist capitalism on the one side and reaction on the other.\n\nThe founding conference issued a declaration and a membership list. On the list are the National Resistance Front and the National Youth of the Cao-Dai, the Hoa-Hao Dan-Xa party, the Republican Youth, the Women's Solidarity Syndical, the Cong-Nong Revolutionary Party, the Spiritual Group, the civil servants' and the journalists' syndicals, the Pure Land Buddhists, the Catholic Society, the General Confederation of Labour, the People's Union Movement, the Citizens' Group, the Resistance Veterans, the Viet-Nam Quoc-Dan Dang, the Mat-Tran Quoc-Dan and the Quang-Phuc Hoi.\n\nSeveral of those bodies fought each other within living memory and several still keep armed men. What binds them here is not agreement but access: the Movement is the channel through which appointments, permits and subsidies are now to flow. It is a durable form of loyalty and a brittle one, and the government will find out which within a year."
 NH_DIEMa.5.a: "Sooner or later, the Social Revolution shall succeed!"

 NH_DIEMa.6.t: "The President Raises a Revolutionary Army"
 NH_DIEMa.6.d: "The President has announced the formation of a second Revolutionary Army, which few observers expected and fewer still were consulted about. It is to be assembled from the smaller revolutionary paramilitaries already in existence - the Armed Republican Guards, the Republican Women, the Republican Youth - and its task is to enforce Labour Personalist policy in the provinces rather than to hold ground against the enemy.\n\nCommand runs through the Cong-Nong Revolutionary Party and not the general staff, and the structure follows the administration rather than the map. Communes and districts are led by a union leader, a deputy and a steering council; provinces and cities by a leader, two deputies and a council; Saigon organises by ward; and at the centre a General Union sits under a general leader and three special leaders. A new post of youth inspector has been created in every province to oversee military training.\n\nThe National Construction Army is to be wound down as this force stands up. That is the sentence the army has read most closely, because it means the men, the arms and the budget of an existing formation are being handed to a body that answers to the Party."
 NH_DIEMa.6.a: "Down with the old, in with the new!"

 NH_DIEMa.7.t: "Mrs. Nhu Launches Women's Solidarity Syndicate"
 NH_DIEMa.7.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Mrs. Tran-Le-Xuan  has founded the Women's Solidarity Syndicate (Phu-Nu Lien-Doi), aiming to liberate and empower women's roles in supporting the Republic. The organization is led by Mrs. Nhu, with its Central Committee composed primarily of important women of Ministers, Generals, and other influential origins. \n\nProvincial leadership is similarly structured, with the wives of Governors, Deputy Governors, and local officials taking key roles. The movement includes several specialized committees:\nJudicial Committee\nCommittee of Soldiers' Affairs\nHealth Committee\nSchool Committee\nSocial Committee\nParamilitary Thanh Women Committee\n\nThese committees conduct routine activities and monthly visits to report on their progress, reinforcing the revolutionary spirit  of Labour Personalism and to struggle for total gender equality and feminism across all South Vietnam."
 NH_DIEMa.7.a: "Truly a dragon lady!"

 NH_DIEMa.8.t: "Ngo Tong-thong Launches the Chieu-Hoi Program"
 NH_DIEMa.8.d: "President Ngo-Dinh-Diem officially launched the Chieu-Hoi (Return) Program - an ambitious initiative not simply aimed at defeating communism, but at reclaiming the revolutionary soul of Vietnam from its misguided path.\nLabour Personalist thinkers, particularly Ngo-Dinh-Nhu, argued that Hanoi's Marxist-Leninists were \"revolutionaries in uniform only\" - disguised nationalists reliant on Soviet arms, unable to grasp the true philosophical depth of Marx or the spiritual dimension of human liberation.\n\nDiem stated:\n\"We do not oppose communists because they are revolutionaries. We oppose them because they are not revolutionary enough. Labour Personalism is the truer, higher revolution - of both the soul and the society.\"\n\nWith that spirit, the Chieu-Hoi Program was not merely a surrender mechanism but a mass ideological rehabilitation and integration campaign. Revolutionary cadres who defected were not punished, but re-educated through a Personalist lens, often being assigned to new civic roles in the Civil Action Bureau itself.\n\nNgo-Dinh-Nhu further explained:\n\"We already have Marxists working with us - true ones. Not dogmatists, not puppets of Moscow, but intellectuals who believe in justice, spirit, and the dignity of man. Labour Personalism welcomes them into a greater synthesis.\"\n\nKey features of the Chieu-Hoi Program included:\n\nRevolutionary Re-Orientation Centers where former Viet Minh and communist cadres would receive political and philosophical training in Personalism.\n\nEmployment pathways into the Civil Action Bureau, agricultural cooperatives, and even military administration for former leftist revolutionaries.\n\nIdeological publishing projects that compared Labour Personalism and Marxism, highlighting Diem's belief in a Personalist Revolution."
 NH_DIEMa.8.a: "Nhan-Vi + Cong-dong = Dong-tien"

 NH_DIEMa.9.t: "Establishment of Revolutionary Youth Movements"
 NH_DIEMa.9.d: "Saigon, [?global.date.GetDateStringNoHourLong] - The Cong-Nong Revolutionary Party has announced four new youth unions, to be raised under the banner of Labour Personalism and expected to enrol fifty thousand within the year. The undertaking is led by Tran-Chanh-Thanh, chairman of the National Revolutionary Movement, together with Tran-Le-Xuan, chairwoman of the Women's Solidarity Syndicate.\n\nThe four are the Republican Youth Union, the Young Women's Union, the Republican Women's Union and the Armed Republican Guards. All will wear the revolutionary blue, which the Party glosses as the colour of divine justice. Organisation follows the administrative divisions exactly, so that a district youth union or a city syndicate may be addressed in the same breath as the district chief or the mayor.\n\nTran-Chanh-Thanh spoke of community and of revolutionary fervour among the young. The design beneath the speech is plainer: a body in every district, in a uniform, drawn from precisely the age group the Viet Minh recruits from, answering to the Party rather than to the province."
 NH_DIEMa.9.a: "All hail the Social Revolution! All hail the youth"

 NH_DIEMa.10.t: "Ngo Tong-thong Revives Pan-Asianism as Guided by Emperor Nam-Hung"
 NH_DIEMa.10.d: "In a solemn yet spirited ceremony held at the newly inaugurated Hall of Eastern Friendship in Saigon, President Ngo-Dinh-Diem paid tribute to the teachings of Emperor Nam-Hung, the monarch and Pan-Asian visionary. Diem, invoking Nam-Hung's legacy, announced a new ideological and diplomatic campaign titled \"A-chau Dai-dong\" - The Greater Eastern Unity Initiative.\n\nDiem proclaimed:\n\"We, the peoples of the East, share a spiritual destiny. As Emperor Nam-Hung taught, true independence is not only freedom from foreign rule, but unity among brothers of the same sun and soil.\"\n\nThis event marked the symbolic rehabilitation of Nam-Hung's Pan-Asian ideas, previously sidelined during colonial rule. Diem's Labour Personalist regime now sought to position South Vietnam as a moral and spiritual vanguard of Asian unity, blending Personalism with Asian solidarity to challenge Western materialism and communist atheism alike.\n\nKey elements of this initiative included:\n\nFounding the Nam-Hung Academy for Eastern Thought, dedicated to Pan-Asian philosophy, Confucian renewal, and Buddhist-Catholic dialogue.\n\nProposals for a League of Sovereign Asian Nations, promoting non-alignment, cultural exchange, and economic cooperation outside the Cold War blocs.\n\nPublication of \"The Concord Doctrine\", a manifesto blending Labour Personalism with Pan-Asian unity and anti-colonial resistance.\n\nSpecial envoys were dispatched to Japan, Thailand, the Philippines, and India to explore common values and potential cultural-political synergies.\n\nThis revival of Pan-Asianism under Diem signaled a bold redefinition of Vietnam's regional role - not merely as a bulwark against communism, but as a spiritual beacon of Eastern awakening."
 NH_DIEMa.10.a: "A-chau Dai-dong!"

 NH_DIEMa.11.t: "Ngo Tong-thong issued decrees to form Tay-ninh Training Base"
 NH_DIEMa.11.d: "Ngo Tong-thong has decreed the first revolutionary training base, for the \"Tu-Nghiep\" courses, and has sited it at Tay-Ninh.\n\nThe choice is not accidental. Tay-Ninh is the Cao-Dai heartland, the sect leadership there was loyal to Emperor Nam-Hung, and the President has inherited that loyalty rather than earned it. Putting the base in their province tests whether the inheritance holds, and tests it in the one place where a failure could still be contained.\n\nThe courses run political instruction alongside practical training, technical and military both, and they take cadres and working men through together rather than separately. What comes out of Tay-Ninh goes to the provinces to run the programmes this government has announced and cannot at present staff. Everything else the President has promised depends on there being men to carry it out."
 NH_DIEMa.11.a: "Can-Lao, Cach-mang, Nhan-Vi!"

 DiemLR.0.t: "Kieu Cong Cung forms Civic Action Commissariat and Land Reform Bureau"
 DiemLR.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Kieu-Cong-Cung, a Marxist before he was a Labour Personalist and never quiet about either, has been made Commissioner-General of the new Special Commissariat for Civic Action (Dac-uy Phu Cong-Dan-Vu) and Chairman of the Land Reform Bureau (Nha Cai-cach Dien-dia), both under the Office of the Prime Minister.\n\nThe Commissariat takes in the Central Services and the Land Reform Bureau together. It is to work through the ministries, draw the plans, and train the cadres who will carry the reform into the villages. Its offices are temporary and were furnished by the Ministry of Defence down to the vehicles and the conscripts filling the clerical posts, which indicates well enough how fast the appointment was made and who paid for it.\n\nWhat Cung proposes is redistribution on a scale no government in Saigon has previously put on paper, argued in the language of Labour Personalism and drawing openly on the methods he learned on the other side. The landlords have understood this perfectly. So have the cadres in the delta, who have spent years telling the farmers that no government in Saigon would ever attempt it."
 DiemLR.0.a: "Cung shall help us to win over the heart of the common farmers!"

 DiemLR.1.t: "President Ngo-Dinh-Diem announces nationalization of foreign owned assets"
 DiemLR.1.d: "Saigon, [?global.date.GetDateStringNoHourLong] - The President has announced the nationalisation of foreign-owned estates, as the opening move of the first Five Year Plan and of the land reform behind it.\n\nThe case is made out of the survey figures and they are not in dispute. Two and a half per cent of landowners hold forty-five per cent of the land; seventy-three per cent of smallholders share fifteen per cent between them. In Bac-Lieu four per cent of the owners hold seventy per cent of the province, and seventy-two per cent of the farmers there hold nothing at all. A great many of the largest estates belong to French companies - the Domaine Agricole de l'Ouest among them - and it is those holdings the decree names first.\n\nThe land is to be taken into collective ownership and redistributed to the Can-Lao and the landless, with compensation assessed and paid and the transfers recorded in law. That last point is the whole of the government's argument. The Viet Minh have been confiscating and redistributing land in the areas they hold for six years, without compensation and without paperwork, and they have not been short of takers."
 DiemLR.1.a: "We need to tackle this issue as soon as possible!"

 DiemLR.2.t: "Formation of Sonadezi and the First Industrial Zone in Bien-Hoa"
 DiemLR.2.d: "Today, Ngo Tong-thong with the collaboration from the Special Commissar of Civil Action and Special Commissar of Industry and Public Works has collaborated and declare the establishment of Sonadezi syndical (Societe nationale du Developpement des zones industrielles), marking a significant milestone in South Vietnam's industrial development under Labour Personalism. This effort aimed to reduce dependence on Western and French industrial products and foster domestic industrial capabilities.\n\nSonadezi served as a hub for technical advisors, investors, and officials from the Saigon government's Ministry of Economy, facilitating the creation of industrial zones across Vietnam. The first industrial zone was established in Bien-Hoa, setting a model for future industrial complexes in Tay-Do (Can-Tho), Da-Nang, and Cam -Ranh.\n\nPresident Diem emphasized, \"Sonadezi will spearhead our nation's industrial revolution, promoting self-sufficiency and economic growth through innovative industrialization strategies.\"\n\nThis initiative laid the foundation for Vietnam's industrial expansion, showcasing Labour Personalism's commitment to economic independence and technological advancement."
 DiemLR.2.a: "Ky-nghenization is going smoothly!"

 DiemLR.3.t: "The Second Phase of Industrialization"
 DiemLR.3.d: "President Ngo-Dinh-Diem has announced the launch of the second phase of Vietnam's industrialization program, building on the successes of the Sonadezi initiative and the first industrial zones. This new phase will expand industrial development to additional regions, creating new opportunities for economic growth and employment.\n\nThe second phase includes the establishment of industrial zones in Tay-Do (Can-Tho), Da-Nang, and Cam-Ranh, following the model established in Bien-Hoa. These zones will focus on different sectors, from agricultural processing to manufacturing and technology, creating a diverse industrial base for Vietnam.\n\nThis expansion represents a significant investment in Vietnam's economic future and demonstrates the government's commitment to industrial development under the Labour Personalism ideology. The new zones will provide jobs, stimulate local economies, and help reduce Vietnam's dependence on imported goods.\n\nPresident Diem has emphasized that this industrialization is not just about economic growth, but also about building a modern, self-sufficient Vietnam that can stand on its own in the international community. \"We are building not just factories,\" he declared, \"but the foundation of a strong and independent nation.\""
 DiemLR.3.a: "Industrialization continues apace!"
