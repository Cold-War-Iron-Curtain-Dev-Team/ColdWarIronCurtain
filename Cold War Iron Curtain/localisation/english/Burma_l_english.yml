 Burma_KW.1.d:0 "Rangoon - Burma's prime minister has denounced American intervention in Korea, accusing Washington of using the war to impose its authority in Asia. He said a settlement should be left to the Koreans themselves.\n\nLeft-wing parties have welcomed the declaration. The charge of imperialism has found an audience beyond their ranks in a country that has lived under both British rule and Japanese occupation.\n\nConservatives and some members of the governing socialist camp have taken a different view. They warn that the statement gives Burma's communists a cause around which to rally and puts economic assistance from Western governments at risk."
 Burma_KW.3.d:0 "The Anti-Fascist People's Freedom League is suspending the Trade Union Congress from membership. The League originally backed the congress as a socialist counterweight to communist unions. It now demands the removal of Thakin Lwin, the congress president, and other communists from senior union posts before it will readmit the organization.\n\nLeague leaders defend the suspension as a matter of party discipline. Opposition newspapers trace it to Lwin's public criticism of the government's position on Korea, which he took to be support for American intervention. That dispute now leaves a labor organization founded with the League's backing outside the governing coalition."
 Pyidawtha.1.d:0 "Prime Minister U Nu has brought Burmese officials together to prepare a national development plan for presentation at the Pyidawtha Conference. The government is commissioning outside studies of transport, industry and mineral resources. The American engineering firm Knappen Tippetts Abbett is among the consultants asked to assess what Burma can build and how much it will cost.\n\nU Nu wants the plan to reduce poverty and make Burma less dependent on the economy it inherited at independence. A survey can show which rail links and industries are worth investing in; the government still has to decide which works can be paid for first."
 Pyidawtha.2.d:0 "Prime Minister U Nu has presented the eight-year Pyidawtha Plan at the development conference in Rangoon. Its ten schemes set out a program of industrial development and welfare provision. Alongside proposals for nationalization, the plan calls for rebuilding transport links and expanding access to education. It draws on work by Burmese departments and the foreign engineers and advisers the government hired to survey the economy.\n\nThe proposals for local government are already a matter of dispute. The cabinet expects more authority in the districts to give communities a say in how public works are carried out. Its critics ask whether greater regional autonomy will weaken Rangoon's authority in areas where it is still contested."
 AFPFL.1.d:0 "The Anti-Fascist People's Freedom League has retained its majority, but the returns show how far the National United Front has cut into the League's vote. The opposition made substantial gains at the polls without winning a corresponding share of seats. Union organizers and peasant associations helped the Front reach voters the League had counted on, and its leaders made effective use of the press.\n\nSome League members suspect that foreign embassies backed the Front, though the charge remains unproved. U Nu's party now has to account for the losses and decide how to win back organizations it once treated as reliable allies."
 AFPFL.2.d:0 "Ba Swe, the Socialist Party leader and a senior deputy to U Nu, is taking over as prime minister. The National United Front's gains at the polls have persuaded U Nu to stand aside and devote himself to reorganizing the Anti-Fascist People's Freedom League. He remains a leading figure in the League and intends to review the party's relations with the unions and peasant organizations it can no longer count on at election time.\n\nBa Swe takes charge of the cabinet and its development program. With further nationalizations on hold, his first task is to decide which projects the government can carry forward."
 AFPFL.3.d:0 "Supporters of Prime Minister Ba Swe are canvassing members of the Anti-Fascist People's Freedom League for a change of party leadership. U Nu gave up the premiership after the election to rebuild the League's organization. His proposals for reform have met resistance from Ba Swe and party men yet to be persuaded that a reorganization under U Nu will restore the League's vote.\n\nThe dispute now concerns who can speak for the League. Ba Swe has the premiership; U Nu still has the standing in the party to put his proposals before its members."
 AFPFL.4.d:0 "U Nu is returning as prime minister in place of Ba Swe. He says he used his time outside the cabinet to consider how to reunite both the country and the Anti-Fascist People's Freedom League, whose divisions sharpened while he was working on party reform.\n\nU Nu can still command a large following outside parliament. His immediate difficulty lies within the League, where even some long-standing allies are uneasy about how he exercises authority. The change of prime minister settles who heads the government without settling who can command the party."
 AFPFL.6.d:0 "The Anti-Fascist People's Freedom League has split after a party congress exposed the depth of the quarrel between U Nu and the group led by Ba Swe and Kyaw Nyein. The break comes with a wave of ministerial resignations. Most of the party organization goes with Ba Swe and Kyaw Nyein, whose faction calls itself the Stable AFPFL. The prime minister's supporters take the name Clean AFPFL.\n\nThe Stable faction has tried to remove U Nu by a vote of no confidence. He survives by a narrow margin with votes from the opposition National United Front. Neither faction has announced a general break with the League's old policies; the dispute is over control of the party and the government. U Nu keeps his office, but the Clean AFPFL can no longer rely on the League's old majority to pass its business through parliament."
 Burmese_Buddhism.0.d:0 "Prime Minister U Nu is putting government support behind a revival of Theravada Buddhist practice already under way in Burma. The program will encourage religious instruction and observances and seek to bring Buddhist relics from elsewhere in the region to Burma. U Nu regards the tenets shared by much of the population as a basis for strengthening national unity.\n\nThe largest undertaking is a plan to host a Buddhist council. It would bring elders from abroad to Burma to review the scriptures and make the country's monasteries better known outside its borders."
 Burmese_Buddhism.1.d:0 "The government is sponsoring the Sixth Buddhist Council at Kaba Aye in Rangoon. It plans to receive 2,500 Theravada elders from eight countries. The monks will meet in the Maha Pasana Guha, the large assembly cave built near the Kaba Aye Pagoda. The last council was held at Mandalay more than eighty years ago.\n\nThe assembly is expected to spend two years examining the Pali scriptures. Pilgrims will be able to visit the site during the proceedings. For Prime Minister U Nu, convening the council is a chance to establish Burma as a center of Buddhist scholarship."
 Rohingya.1.d:0 "Burma has asked the Pakistani mission in Rangoon to stop funding the Rohingya Mujahideen in northern Arakan. Burmese officials say they are trying to restore the Union's authority and give assurances that Muslims will be free to practice their religion. They warn that relations may be downgraded if the aid continues and offer closer diplomatic and commercial ties if it stops.\n\nPakistani intelligence officials believe assistance could continue, but warn that further fighting may bring heavier army reprisals against civilians in the frontier districts. The decision turns on how much weight Pakistan gives Rangoon's assurances and what it stands to lose if the talks break down."
 Rohingya.2.d:0 "The Pakistani mission in Rangoon has privately agreed to cut off funding to the Mujahideen in northern Arakan. Burmese officials expect the loss of Pakistani support to weaken the insurgency. In return, Rangoon has assured the mission that Muslim communities will not face reprisals, while maintaining that law and order in Arakan remain the Union's responsibility.\n\nThe government now intends to offer Pakistan better trading terms. It hopes that a working relationship across the frontier will give Pakistan reason to keep to its undertaking."
 Rohingya.3.d:0 "Pakistan has rejected Rangoon's demand that it cut off assistance to the Rohingya Mujahideen. Its reply denies that Pakistani agents are arming the insurgents and challenges Burma to substantiate the charge. The Burmese government regards the denial as a refusal to address supplies reaching the armed groups in northern Arakan.\n\nThe dispute leaves diplomatic relations worse than before the approach. Army commanders maintain that they can restore the Union's authority in the frontier districts without a Pakistani undertaking. The cabinet can no longer count on a settlement of the supply question through its present talks."
 Burma_Union.1.d:0 "Prime Minister U Nu is establishing a Bureau of Special Investigation to examine financial crime and corruption. The new bureau will answer directly to the prime minister. Among its first concerns are transfers of money from abroad that the government suspects are reaching armed movements inside Burma.\n\nU Nu's case for the bureau is that these inquiries cut across the ordinary responsibilities of the police and government departments. Opposition leaders object to placing the investigators under the prime minister himself. They ask who will review the bureau's work if it opens a case against a political opponent on the strength of an unverified allegation."
 NUF_1958.0.d:0 "The new National United Front government is offering to take the Burma Communist Party's Liberation Army into the forces of the Union. The prime minister says the disputes that kept the communists in revolt can now be settled through the government, and proposes that the army cease its independent campaign and enter state service with its troops intact. Conservatives in Rangoon suspect that the Front used the guerrillas to put pressure on its predecessors and is now paying for their help.\n\nThe party's leaders have a different question to settle. Integration would preserve the Liberation Army's forces at the price of their independent command. Those who want the party itself to govern Burma see the Front's victory as an opening to take control in Rangoon rather than serve under the new cabinet."
 Burma_Elect.1.d:0 "Burma's first general election since independence has been held in stages, with insecurity preventing normal polling in parts of the country. Turnout has been low. Even so, the Anti-Fascist People's Freedom League, working with allied parties, emerges with a clear majority in parliament.\n\nThe League takes the result as a mandate for the reconstruction and welfare measures it promised. It must now decide how to govern districts where armed organizations still contest the Union's authority and where few voters were able to take part in the election."
 BURMA_KMT_UN.1.d:0 "Rangoon is taking its complaint over Kuomintang troops in Burma to the United Nations. Thousands of Nationalist soldiers crossed the frontier in the last stages of the Chinese Civil War and established bases in the eastern Shan States around Kengtung. The Burmese government says the troops draw supplies from the surrounding districts. Their commanders have refused demands to disarm.\n\nThe presence of an army with plans to return to Yunnan leaves Burma exposed to intervention from Beijing. An offensive against its bases would also tie down Burmese units needed elsewhere. The government is asking for international help to secure a withdrawal that it cannot yet enforce on its own."
 Operation_Bayinnaung.1.d:0 "The Burmese armed forces are beginning Operation Bayinnaung against the Kuomintang positions that remain in the Shan States. Diplomatic efforts have secured the departure of some Nationalist troops, but substantial formations are still on Burmese soil. The government no longer expects negotiations alone to clear the area.\n\nThe army regards Bayinnaung as the largest operation yet undertaken jointly by Burma's armed services. Commanders expect to gain ground against the remaining forces, but the launch of the operation does not settle what will happen to detachments still holding bases along the frontier."
 NUF_1958.4.d:0 "The National United Front government has offered extensive local autonomy to the Karen and Mon movements within the Union of Burma. Rangoon asks their leaders to recognize the Union government and agree to end their armed campaigns. In exchange, each would keep a large measure of authority over its own affairs.\n\nThe Front argues that districts closed off by fighting can begin to recover without first having to submit to military administration. Some Burmese officers and nationalists oppose the concession on precisely that ground. For the movements receiving the offer, the question is whether the authority Rangoon is prepared to concede is worth settling on its terms."
 NUF_1958.5.d:0 "The Karen National Liberation Army has accepted the National United Front's offer. Under the agreement, the Karen administration would keep its leadership and exercise broad powers as an associated state within the Burmese Union. The terms call for an end to fighting between Karen and Union forces.\n\nSupporters in the Karen districts welcome the prospect of running their own affairs without breaking with the Union. In Rangoon, the cabinet presents the settlement as proof that the Karen question can be dealt with politically. Conservative politicians and some officers object that the settlement recognizes a local authority that the army was supposed to bring under central control."
 NUF_1958.6.d:0 "Rangoon's bid for a Karen settlement has stalled. The Karen National Liberation Army has rejected associated status under the Union, saying earlier Burmese governments made promises of self-government and then failed to honor them. Its leaders are unwilling to give up their armed campaign on the strength of another pledge from the capital.\n\nThe National United Front had counted on a Karen agreement to vindicate its policy of negotiation. Newspapers opposed to the government report anger in the officer corps: some commanders believe the offer made it easier for Karen leaders to hold out for outright independence. No terms for a ceasefire have been agreed."
 NUF_1958.7.d:0 "Mon representatives have agreed to associated status within the Union. The Mon National Liberation Army is prepared to end its campaign under terms that leave the Mon leadership in place and give its administration wide powers over local affairs. The agreement is being welcomed in Mon districts, where a settlement would allow the authorities to devote more attention to civilian government.\n\nThe National United Front cites the Mon decision in defense of separate negotiations with each movement. Its critics in the Burmese officer corps and conservative parties see a different precedent: an armed organization has won recognition for its administration from the government it fought."
 NUF_1958.8.d:0 "The Mon National Liberation Army has turned down Rangoon's autonomy offer. Mon leaders say that recognizing the Union's authority and ending the armed campaign would leave them dependent on a promise the central government could later withdraw. Earlier undertakings, they argue, give them little reason to accept that risk.\n\nThe refusal leaves the National United Front without the agreement it sought in the Mon districts. Opposition papers in Rangoon report that some officers blame the cabinet for opening negotiations on terms they think encourage demands for complete independence. For the Mon leadership, the dispute remains one of who can guarantee the powers on offer."
 AFPFL.5.d:0 "Rangoon - U Nu is to resume the premiership of Burma, succeeding Ba Swe. He stepped aside after the last general election to work on reforming the ruling Anti-Fascist People's Freedom League, which held its majority but lost ground to the National United Front.\n\nU Nu's return is expected to be popular with much of the Burmese electorate. He has said that the time out of office allowed him to reconsider how to hold the League and the Union together.\n\nThe appointment leaves the quarrel inside the governing party unsettled. Ba Swe's supporters have pressed for a change of direction in the League, and unease over U Nu's leadership has reached some of his own deputies."
 AFPFL.7.d:0 "Rangoon - U Nu has asked General Ne Win, chief of staff of Burma's armed forces, to serve as interim prime minister. Ne Win says his caretaker government will restore public order and supervise a fresh general election.\n\nThe split in the ruling Anti-Fascist People's Freedom League cost U Nu his dependable majority. When his former allies brought a no-confidence motion, he survived only because the opposition National United Front lent him its votes.\n\nSupporters of the handover say an interim cabinet is preferable to governing from division to division in parliament. The two League factions, Clean and Stable, are preparing to face the electorate as separate camps."
 Burma_FP.1.d:0 "Rangoon - Burma has established diplomatic relations with the People's Republic of China. The agreement puts it among the first non-communist countries to recognize the government in Beijing.\n\nOfficials here point to the long commercial ties passed down through the frontier districts and the practical need to deal with the government across the border. Trade and questions of frontier administration, they argue, cannot be settled by refusing to exchange representatives.\n\nThe decision has drawn criticism from some Western embassies. Burmese officials characterize it as a step toward ordinary relations with a neighbor and an important trading partner."
 Burma_Agreement.1.d:0 "Rangoon - The Burmese government has pledged to honor the Panglong Agreement in the Shan States, opening the way for a separate decision on autonomy within the Union.\n\nThe 1947 accord, negotiated by Aung San before independence, accepted in principle full autonomy in the internal administration of the frontier areas. Shan leaders have long cited it as the basis for keeping local affairs in their own hands.\n\nRangoon's pledge gives Shan representatives grounds to ask for terms. The announcement leaves existing administrative arrangements in place. Any transfer of powers will require a further decision by the Union government."
 Burma_KW.2.d:0 "Rangoon - Burma's prime minister has condemned North Korea's invasion of the South and endorsed international action to protect South Korea. He said the crossing of the frontier was an attempt to impose communist rule by force.\n\nWestern embassies, which have been seeking support for the response to the invasion, have welcomed the statement. Politicians in Rangoon who favor closer relations with the West say it makes clear that Burma will not excuse aggression on ideological grounds.\n\nBurmese communists and some trade union leaders have denounced the declaration. They contend that support for international action in Korea places Rangoon behind Washington's policy in Asia."
 NUF_1958.2.d:0 "Rangoon - General Ne Win, Burma's chief of staff, has been executed after his conviction on charges of organizing death squads and unlawfully interfering in the government. The National United Front administration arrested him on suspicion of plotting a coup.\n\nHis death deprives anti-communist officers of their most prominent figure. Some senior officers are said to be considering retirement, and the government is expected to fill vacancies with officers it considers dependable.\n\nBefore his arrest, Ne Win was widely regarded as the officer most capable of leading a move against the Front. Other observers had seen him as the army's best guarantee of independence from party control. Both calculations now have to be revised."
 NUF_1958.3.d:0 "Rangoon - The National United Front government has directed Burma's armed forces to remove the Yunnan Anti-Communist National Salvation Army from Burmese territory. Ministers say the Union cannot tolerate a foreign force maintaining its own authority in the Shan States.\n\nThousands of Kuomintang soldiers took refuge in Burma at the end of the Chinese Civil War. Their commanders have resisted disarmament and maintained bases from which they hope to return to Yunnan.\n\nSupporters of the order argue that Rangoon has waited long enough for the troops to leave. A YANSA spokesman has accused the Burmese cabinet of acting for the communist powers and says the army has no intention of abandoning its campaign."
 Burma_Elect.2.d:0 "Burma's general election pits the Anti-Fascist People's Freedom League, which led the wartime resistance and has governed since independence, against the National United Front. The League expects to keep its majority. The Front has brought left-wing organizations and conservative opponents of the government into a common campaign and is courting the unions and peasant associations on which the League has long relied.\n\nThe Front accuses the government of corruption; the League alleges that foreign money is finding its way into the opposition campaign. Behind the charges is a dispute over how to end the fighting inside Burma. The Front is making a negotiated peace a test of the government's record, while the League asks voters to renew its mandate to govern the Union."


