DOM_Insurgency.1.d: "On February 3rd, 1793, Caamano and a handful entered the Dominican Republic from Cuba. They arrived at Playa Caracoles and then infiltrated the mountain region of the Cordillera Central. His band of guerrillas aimed to install former President Bosch by appealing to commoners to rise against the reigning government. Many of the governing officials were leftovers from Trujillo's brutal regime. Time will tell if the Dominican people will support Caamano's endeavor, like a repeat of the Civil War, or remain apathetic by supporting the Dominican Army. If captured, it's inevitable that the rebels would be executed on the spot. Dominican Republic's future hangs in the balance once again..."
