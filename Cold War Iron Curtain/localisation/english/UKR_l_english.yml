l_english:
  ukraine_1:0 "Ukraine is not yet lost!"
  ukraine_1_desc:0 "\n\n\n\n\n\n£ukraine\n\n\n\n\n\n\n\nThe Ukrainian parliament has decisively passed a declaration that firmly establishes Ukraine's autonomy within the Union of Soviet Socialist Republics. This significant move follows a wave of sovereignty declarations from various republics across the Soviet Union, clearly demonstrating the growing momentum of nationalism that is reshaping the central authority of the Union.\n\nThe declaration, along with subsequent votes, establishes an independent Ukrainian army and a central bank tasked with introducing a new currency. It unequivocally grants Ukrainian citizenship, recognizing Ukrainians as citizens of both Ukraine and the Soviet Union. This declaration demands economic independence and upholds the principles of self-determination and governance by the people. Furthermore, it proclaims a commitment to military neutrality and unequivocally rejects the production of nuclear weapons, signaling a bold step forward for Ukraine's future."
  ukraine_2:0 "Higuys Pedophile"
  ukraine_3:0 "Economic Uncertainty"
  ukraine_3_desc:0 "The transition from Soviet socialism to a market economy is plagued with tremendous challenges. The government funding that supported factories and infrastructure during Soviet rule disappeared, causing numerous industries to strive to adapt to the new environment. The economy is fragile, with inflation and shortages making daily life unbearable for most of our citizens.\n\nProduction has slowed, and any construction projects are frequently delayed if not stopped altogether. The shift to a market economy has brought confusion and instability, casting uncertainty over our country’s future. Without adequate resources or institutions to rely upon in these times, we are forced to navigate this difficult time by ourselves."