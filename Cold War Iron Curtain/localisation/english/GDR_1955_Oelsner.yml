l_english: 

 GDR_First_Secretary_Oelsner:0 "First Secretary Oelsner"
 GDR_First_Secretary_Oelsner_desc:0 "Fred Oelsner has acquired leadership of the GDR; it is time to formally recognize him as our new First Secretary."
 GDR_Promote_Consumer_Goods_Production:0 "Promote Consumer Goods Production"
 GDR_Promote_Consumer_Goods_Production_desc:0 "Consumer goods keep the people happy and docile; we should increase their production."
 GDR_Assuange_Fears_of_the_Public:0 "Assuage Fears of the Public"
 GDR_Assuange_Fears_of_the_Public_desc:0 "Ulbricht's government used fear and intimidation to keep the people in line, but no more! We'll show the German people have nothing to fear from us."
 GDR_Building_Popular_Support:0 "Building Popular Support"
 GDR_Building_Popular_Support_desc:0 "The Party is popular by default, as it has no real opposition. We must work to ensure that the people really do believe in our vision."
 GDR_Launch_an_Outreach_to_the_EKD:0 "Outreach to the EKD"
 GDR_Launch_an_Outreach_to_the_EKD_desc:0 "Socialism and religion don't often mix; however, we will offer the Evangelical Church in Germany a chance to set aside our differences and work together for the benefit of the people."
 GDR_Increase_Social_Welfare_Spending:0 "Increase Social Welfare Spending"
 GDR_Increase_Social_Welfare_Spending_desc:0 "Social welfare is at the core of the socialist dream. It is our responsibility to provide for those who do not have the ability to provide for themselves."
 GDR_Encourage_Inter_Party_Dialogue:0 "Encourage Inter-Party Dialogue"
 GDR_Encourage_Inter_Party_Dialogue_desc:0 "Inter-party coordination between us and the moderate socialists can only benefit the people."
 GDR_Liberalize_Western_Cultural_Import_Regulations:0 "Liberalize Cultural Import Regulations"
 GDR_Liberalize_Western_Cultural_Import_Regulations_desc:0 "There are many limitations and regulations that prevent the flow of goods from West Germany. If we wish to reunite our country, we must allow for freer movement of goods between us, even if those goods are ''dangerous''."
 GDR_Investigate_the_National_Political_Outlook:0 "Investigate the National Political Outlook"
 GDR_Investigate_the_National_Political_Outlook_desc:0 "Change in leadership often breeds uncertainty among the citizens, it would be wise to assess how the people feel and what they hope to see from our administration before we proceed with reforms."
 GDR_Reward_Loyal_Party_Cadres:0 "Reward Loyal Party Cadres"
 GDR_Reward_Loyal_Party_Cadres_desc:0 "Those who've shown unwavering support to the cause of socialism should be rewarded for their efforts."
 GDR_Expand_Cooperative_Eligibility:0 "Expand Cooperative Eligibility"
 GDR_Expand_Cooperative_Eligibility_desc:0 "Cooperative ownership is one of the most important tenants of Marxism. We should see to expanding what can be collectively owned by the workers."
 GDR_Economic_Modernization:0 "Economic Modernization"
 GDR_Economic_Modernization_desc:0 "Our economy is falling behind. If we do not catch up to our Western counterpart, we face mass exodus, or worse, collapse."
 GDR_Seek_Revised_Polish_Trade_Treaty:0 "Revise the Polish Trade Treaty"
 GDR_Seek_Revised_Polish_Trade_Treaty_desc:0 "We feel that our trade treaty with Poland is no longer beneficial and would like to revise certain aspects of the deal."
 GDR_Increase_Pension_Payments:0 "Increase Pension Payments"
 GDR_Increase_Pension_Payments_desc:0 "That the sick and old should have to wallow in poverty is deplorable. An increase in pensions is in order."
 GDR_The_Financing_Question:0 "The Financing Question"
 GDR_The_Financing_Question_desc:0 "No matter how our country functions or what ideology we pursue, each state must eventually answer that one inescapable question; how are we going to pay for this?"
 GDR_Seeking_a_Democratic_Path_to_Socialism:0 "A Democratic Path to Socialism"
 GDR_Seeking_a_Democratic_Path_to_Socialism_desc:0 "We must show the world that armed struggle or violent civil wars are not the only way to achieve the socialist dream. There exists a peaceful and democratic path, one that we shall take."
 GDR_Reform_Factory_Leadership:0 "Reform Factory Leadership"
 GDR_Reform_Factory_Leadership_desc:0 "Our system of factory leadership needs reforms that will help increase productivity. Let's make sure that the means of production are in good hands!"
