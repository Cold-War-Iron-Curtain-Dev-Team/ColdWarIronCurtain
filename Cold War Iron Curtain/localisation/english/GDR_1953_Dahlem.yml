l_english: 

 GDR_First_Secretary_Dahlem:0 "First Secretary Dahlem"
 GDR_First_Secretary_Dahlem_desc:0 "Franz Dahlem has managed to wrestle leadership of the SED from Walter Ulbricht, it is time to formally recognize him as our new General Secretary."
 GDR_Announce_an_End_to_the_Work_Quota_Increase:0 "End the Work Quota Increases"
 GDR_Announce_an_End_to_the_Work_Quota_Increase_desc:0 "The constant increase in worker quotas is detrimental to our economy and the wellbeing of our workers, they must come to an end."
 GDR_Establishing_a_National_Founding_Myth:0 "Establish a National Founding Myth"
 GDR_Establishing_a_National_Founding_Myth_desc:0 "The Soviet’s liberation of Germany from Nazi tyranny was the birth of true freedom in Germany. It should be enshrined in our history for all future generations to remember!"
 GDR_Promote_German_Socialist_Heroes:0 "Promote German Socialist Heroes"
 GDR_Promote_German_Socialist_Heroes_desc:0 "In the last days of the Reich, brave comrades risked their lives to aid in the destruction of Hitler's fascist dictatorship. May they live forever in our memory!"
 GDR_Promote_Spanish_Civil_War_Veterans_within_the_SED:0 "Promote Spanish Civil War Veterans within the SED"
 GDR_Promote_Spanish_Civil_War_Veterans_within_the_SED_desc:0 "Those who answered the call of revolution in Spain should be rewarded for their bravery and promoted in our government."
 GDR_Empower_the_Committee_of_Anti_Fascist_Resistance_Fighters:0 "Empower the Committee of Anti-Fascist Resistance Fighters"
 GDR_Empower_the_Committee_of_Anti_Fascist_Resistance_Fighters_desc:0 "The Association of Persecutees of the Nazi Regime will be dissolved and reorganized into the Committee of Anti-Fascist Resistance Fighters. This will help us ensure that none of its members are in fact agents from the Association's West German counterpart."
 GDR_Expand_Military_Training_Programs:0 "Expand Military Training Programs"
 GDR_Expand_Military_Training_Programs_desc:0 "It's no secret that the West seeks our destruction, by force if necessary. In case the worst comes to pass, our military must be ready."
 GDR_The_Cult_of_the_Spanish_Civil_War:0 "Sensationalize the Spanish Civil War"
 GDR_The_Cult_of_the_Spanish_Civil_War_desc:0 "Though fascism reigns in Spain, the heroes and veterans of the Spanish Civil War who fought for the Republic rather than against it should never be forgotten. We cannot forget the lengths the fascists will go to suppress the workers!"
 GDR_Launch_the_Ulbricht_Show_Trials:0 "Launch the Ulbricht Show Trials"
 GDR_Launch_the_Ulbricht_Show_Trials_desc:0 "To legitimize Dahlem’s succession as General Secretary, show trials will be held detailing the counterrevolutionary crimes of Ulbricht government."
 GDR_Relax_Stasi_Repression:0 "Relax Stasi Repression"
 GDR_Relax_Stasi_Repression_desc:0 "The Stasi has become bloated and overzealous, it's best we ease their influence over the people and the government."
 GDR_Revitalizing_the_West_Commission:0 "Revitalizing the West Commission"
 GDR_Revitalizing_the_West_Commission_desc:0 "The West Commission does good work in spreading socialism to our capitalist counterparts. It should be expanded and modernized to better serve this purpose."
 GDR_Expand_KPD_Funding:0 "Expand KPD Funding"
 GDR_Expand_KPD_Funding_desc:0 "If the Communist Party is to revitalize Germany and pave the way for reunification, we will need that one basic resource; money."
 GDR_Reject_Fascist_Collaboration:0 "Reject Fascist Collaboration"
 GDR_Reject_Fascist_Collaboration_desc:0 "The Western governments are more than happy to overlook the crimes of the fascist regime in exchange for their technological secrets. It is an abhorrent practice that we refuse to follow!"
 GDR_Outreach_to_the_Deutsche_Reichspartei:0 "Outreach to the Deutsche Reichspartei"
 GDR_Outreach_to_the_Deutsche_Reichspartei_desc:0 "The situation in West Germany is not as stable as they'd like us to believe. If we were to discreetly help the extreme elements of the West German government, it could lead to a severe destabilization of their regime."
 GDR_Start_an_Arms_Race_Against_Bonn:0 "Start an Arms Race Against Bonn"
 GDR_Start_an_Arms_Race_Against_Bonn_desc:0 "Given the opportunity, the West will not hesitate to use force against us. We must revitalize our military industry to defend against the reactionary government!"
 GDR_Reinstate_Purged_Volkspolizei:0 "Reinstate Purged Volkspolizei"
 GDR_Reinstate_Purged_Volkspolizei_desc:0 "Members of the People's Police who were wrongly purged will be rehabilitated and reinstated to help maintain order in our blossoming state."
 GDR_Rely_on_Soviet_Imports_and_Transfers:0 "Rely on Soviet Imports & Transfers"
 GDR_Rely_on_Soviet_Imports_and_Transfers_desc:0 "Hitler's war has left Germany in shambles. Until our industries rise from the ashes, we must rely on our Soviet comrades for support."
 GDR_Begin_Rebuilding_the_German_Arms_Industry:0 "Begin Rebuilding the German Arms Industry"
 GDR_Begin_Rebuilding_the_German_Arms_Industry_desc:0 "German industry is infamous for its production of highly destructive war machines. This time, however, these arms will be used to serve the people rather than oppress them!"
 GDR_The_New_International_Brigades:0 "The New International Brigades"
 GDR_The_New_International_Brigades_desc:0 "All across the Earth, brave comrades have risen to throw off the shackles of capitalist and imperialist oppression. We must do our part to ensure their success!"
 GDR_Request_Further_Soviet_Military_Aid:0 "Request Further Soviet Military Aid"
 GDR_Request_Further_Soviet_Military_Aid_desc:0 "Though it will make many in Moscow understandably nervous, we must nevertheless try to acquire some military aid from the Soviets if we're to stave off the western imperialists."
 GDR_Reevaluating_Church_Policy:0 "Reevaluating Church Policy"
 GDR_Reevaluating_Church_Policy_desc:0 "Our current stance on religion is causing more harm than good, and the people are not happy. Perhaps it would be prudent to reevaluate our policies?"
 GDR_Provide_Incentives_for_Recruits:0 "Provide Incentives for Recruits"
 GDR_Provide_Incentives_for_Recruits_desc:0 "We understand, especially after the previous decade's events, why the Army is not an attractive career choice. Were we to offer some generous incentives, however, we might see a surge in recruitment."
