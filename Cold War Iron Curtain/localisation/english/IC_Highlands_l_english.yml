l_english:
 FRE_Highlands.1.t:0 "Mang Yang Pass"
 FRE_Highlands.1.d:0 "With the battle for Dien Bien Phu decided, the Expeditionary Corps is reviewing its isolated posts in the Central Highlands. Groupement Mobile 100 holds An Khe. Its ranks include veterans of the French battalion in Korea. A withdrawal to Pleiku by road would take the groupement through the Mang Yang Pass on Route 19, where Viet Minh units can cut the column off from either town.\n\nAircraft can carry the formation to Pleiku without exposing it on the road, at a much greater cost. The command can also keep the groupement at An Khe, but it would still have to relieve the post if the Viet Minh attack in strength."
 FRE_Highlands.1.a:0 "Withdraw down Route 19"
 FRE_Highlands.1.b:0 "Airlift the groupement out"
 FRE_Highlands.1.c:0 "Hold An Khe"
 FRE_Highlands_Mang_Yang_Road_tt:0 "Spend §Y10 War Credits§!. Groupement Mobile 100 drives for Pleiku through the Mang Yang Pass and is ambushed within five days. Losses depend on who holds Dak Doa and Pleiku and on how the Dak Doa fighting ended."
 FRE_Highlands_Mang_Yang_Airlift_tt:0 "Spend §Y60 War Credits§! and §Y3 Metropole Patience§!. Groupement Mobile 100 is flown to Pleiku and avoids the ambush entirely."
 FRE_Highlands_Mang_Yang_Hold_tt:0 "Lose §Y2 Metropole Patience§!. Groupement Mobile 100 stays at An Khe. It is exposed to attack there and may still be mauled or destroyed."
 FRE_Highlands.2.t:0 "Mang Yang Pass: Aftermath"
 FRE_Highlands.2.d_destroyed:0 "Groupement Mobile 100 has ceased to exist as a fighting formation. The survivors are too few and too dispersed to reassemble the unit. The loss leaves the Expeditionary Corps without one of its mobile reserves in the Central Highlands and gives the Viet Minh a victory to cite in the contest for the region."
 FRE_Highlands.2.d_mauled:0 "Groupement Mobile 100 has taken heavy losses. A reduced formation is still on the rolls, but its headquarters can no longer field the battalions at their former strength. The Expeditionary Corps must plan its next moves in the highlands without counting on a full mobile reserve."
 FRE_Highlands.2.d_escaped:0 "Groupement Mobile 100 has fought through the Mang Yang Pass and reached Pleiku in fighting order. The Viet Minh did not cut Route 19 in time to stop the column. The Expeditionary Corps still has a formed mobile reserve in the Central Highlands."
 FRE_Highlands.2.d_airlifted:0 "Transport aircraft have moved Groupement Mobile 100 from An Khe to Pleiku. The unit is available for duty without having had to force a passage along Route 19. The Expeditionary Corps has paid for the flight but avoided the loss of a mobile formation in the pass."
 FRE_Highlands.2.d_held:0 "The Viet Minh probed the defences at An Khe but could not break Groupement Mobile 100. The groupement is still in place, isolated but intact."
 FRE_Highlands.2.d_superseded:0 "The wider war has moved on before the fate of Groupement Mobile 100 could be decided. Nothing more will come of the withdrawal from An Khe."
 FRE_Highlands.2.a:0 "Account for Groupement Mobile 100."
 FRE_Highlands.3.t:0 "Chu Dreh Pass"
 FRE_Highlands.3.d:0 "Groupement Mobile 42 holds Pleiku as the Expeditionary Corps draws back from its outlying posts in the Central Highlands. Its proposed line of withdrawal runs south along Route 14, through the Chu Dreh Pass to Ban Me Thuot. Viet Minh units in the district can bring the road under fire before the column clears the pass.\n\nThe Corps can still keep the groupement at Pleiku, where it would have fixed defenses to fight from. That would preserve the garrison for now, but leave Ban Me Thuot without the battalions due to arrive from the north."
 FRE_Highlands.3.a:0 "Send the column toward Ban Me Thuot"
 FRE_Highlands.3.b:0 "Hold Pleiku"
 FRE_Highlands_Chu_Dreh_Road_tt:0 "Spend §Y15 War Credits§!. Groupement Mobile 42 drives for Ban Me Thuot through the Chu Dreh Pass and is ambushed within five days. The risk depends on who holds Pleiku and Dak Doa and on how the Mang Yang ambush ended."
 FRE_Highlands_Chu_Dreh_Hold_tt:0 "Spend §Y10 War Credits§! and lose §Y1 Metropole Patience§!. Groupement Mobile 42 stays at Pleiku, at a lower risk of being mauled but without reaching Ban Me Thuot."
 FRE_Highlands.4.t:0 "Chu Dreh Pass: Aftermath"
 FRE_Highlands.4.d_mauled:0 "Viet Minh attacks have reduced Groupement Mobile 42 to a remnant. The formation survives, but its reduced battalions cannot cover the same ground or provide the reserve the staff had counted on. Paris has another loss to weigh against the cost of keeping the highland posts."
 FRE_Highlands.4.d_escaped:0 "Groupement Mobile 42 fought its way through the Chu Dreh Pass and has reached Ban Me Thuot in good order. The Viet Minh ambushes came too late and too weak."
 FRE_Highlands.4.d_held:0 "The garrison at Pleiku weathered the pressure and kept its ground. Groupement Mobile 42 is still in place, intact."
 FRE_Highlands.4.d_superseded:0 "The wider war has moved on before the fate of Groupement Mobile 42 could be decided. Nothing more will come of the withdrawal from Pleiku."
 FRE_Highlands.4.a:0 "Report the group's strength to command."
