l_english:
 FRE_Highlands.1.t:0 "Mang Yang Pass"
 FRE_Highlands.1.d:0 "With the Dien Bien Phu campaign decided, the CEFEO command in the Central Highlands must pull Groupement Mobile 100 out of An Khe. The only way to Pleiku is Route 19, which climbs through the Mang Yang Pass, a narrow defile where the Viet Minh have had weeks to prepare. The same column fought its way across Korea and is the best mobile reserve the Expeditionary Corps has left in the highlands.\n\nThe road column is cheap and fast, but every kilometre of the pass is an ambush position. An airlift would save the vehicles and most of the men at a heavy cost in transport hours and credits. Staying at An Khe avoids the pass altogether, but leaves the groupement isolated in a district the Viet Minh increasingly control."
 FRE_Highlands.1.a:0 "Withdraw down Route 19"
 FRE_Highlands.1.b:0 "Airlift the groupement out"
 FRE_Highlands.1.c:0 "Hold An Khe"
 FRE_Highlands_Mang_Yang_Road_tt:0 "Spend §Y10 War Credits§!. Groupement Mobile 100 drives for Pleiku through the Mang Yang Pass and is ambushed within five days. Losses depend on who holds Dak Doa and Pleiku and on how the Dak Doa fighting ended."
 FRE_Highlands_Mang_Yang_Airlift_tt:0 "Spend §Y60 War Credits§! and §Y3 Metropole Patience§!. Groupement Mobile 100 is flown to Pleiku and avoids the ambush entirely."
 FRE_Highlands_Mang_Yang_Hold_tt:0 "Lose §Y2 Metropole Patience§!. Groupement Mobile 100 stays at An Khe. It is exposed to attack there and may still be mauled or destroyed."
 FRE_Highlands.2.t:0 "Mang Yang Pass: Aftermath"
 FRE_Highlands.2.d_destroyed:0 "Groupement Mobile 100 was caught in the Mang Yang Pass and destroyed as a fighting unit. Vehicles burn along Route 19 and the survivors are scattered in the hills. The Viet Minh will present it as proof that the Expeditionary Corps can be beaten in open country, and Paris will not take the loss quietly."
 FRE_Highlands.2.d_mauled:0 "Groupement Mobile 100 fought its way through the Mang Yang Pass at a terrible price. A shattered remnant has reached its destination, but the groupement will take months to rebuild. The Viet Minh claim a victory and Paris is dismayed."
 FRE_Highlands.2.d_escaped:0 "Groupement Mobile 100 broke through the ambushes on Route 19 with moderate losses and has reached Pleiku intact. Viet Minh commanders were unable to close the pass in time, and French morale is a little steadier."
 FRE_Highlands.2.d_airlifted:0 "Transport aircraft lifted Groupement Mobile 100 out of An Khe before the Viet Minh could close in. The vehicles and heavy equipment were left behind to be destroyed, but the men are safe at Pleiku."
 FRE_Highlands.2.d_held:0 "The Viet Minh probed the defences at An Khe but could not break Groupement Mobile 100. The groupement is still in place, isolated but intact."
 FRE_Highlands.2.d_superseded:0 "The wider war has moved on before the fate of Groupement Mobile 100 could be decided. Nothing more will come of the withdrawal from An Khe."
 FRE_Highlands.2.a:0 "A hard lesson"
 FRE_Highlands.3.t:0 "Chu Dreh Pass"
 FRE_Highlands.3.d:0 "The highlands garrisons are being pulled back toward the coast and the south. Groupement Mobile 42 holds Pleiku and is ordered to fall back along Route 14 toward Ban Me Thuot, crossing the Chu Dreh Pass on the way. The Viet Minh knew the order was coming and have moved units close to the road.\n\nThe column can set out at once and hope to outrun the ambush. Alternatively the groupement can stay at Pleiku and keep the town, where it is tied down and still within reach of Viet Minh forces."
 FRE_Highlands.3.a:0 "Send the column toward Ban Me Thuot"
 FRE_Highlands.3.b:0 "Hold Pleiku"
 FRE_Highlands_Chu_Dreh_Road_tt:0 "Spend §Y15 War Credits§!. Groupement Mobile 42 drives for Ban Me Thuot through the Chu Dreh Pass and is ambushed within five days. The risk depends on who holds Pleiku and Dak Doa and on how the Mang Yang ambush ended."
 FRE_Highlands_Chu_Dreh_Hold_tt:0 "Spend §Y10 War Credits§! and lose §Y1 Metropole Patience§!. Groupement Mobile 42 stays at Pleiku, at a lower risk of being mauled but without reaching Ban Me Thuot."
 FRE_Highlands.4.t:0 "Chu Dreh Pass: Aftermath"
 FRE_Highlands.4.d_mauled:0 "Groupement Mobile 42 was struck on Route 14 and mauled. A reduced remnant survives, but the Viet Minh have hurt the Expeditionary Corps again and the French public is losing patience."
 FRE_Highlands.4.d_escaped:0 "Groupement Mobile 42 fought its way through the Chu Dreh Pass and has reached Ban Me Thuot in good order. The Viet Minh ambushes came too late and too weak."
 FRE_Highlands.4.d_held:0 "The garrison at Pleiku weathered the pressure and kept its ground. Groupement Mobile 42 is still in place, intact."
 FRE_Highlands.4.d_superseded:0 "The wider war has moved on before the fate of Groupement Mobile 42 could be decided. Nothing more will come of the withdrawal from Pleiku."
 FRE_Highlands.4.a:0 "So it goes"
