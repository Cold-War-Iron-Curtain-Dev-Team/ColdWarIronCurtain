l_english:

 VIN_South.1.t:0 "The War Did Not End in the Valley"
 VIN_South.1.d_fall:0 "The guns at Dien Bien Phu have fallen silent and the colonial position in the north has been broken, but reports from Nam Bo carry no peace. The southern resistance still holds ground, Saigon's army remains in the field against it, and so Vietnam is not yet at peace.\n\nThe victory in the valley can be spent in two ways. Arms and cadres can be pushed south to keep the resistance alive, accepting that another escalation may postpone the conference. Or Hanoi can turn the French defeat into a demand for talks on all Vietnam, banking the battlefield result as leverage while the southern belligerents are pressed to stop shooting."
 VIN_South.1.d_hold:0 "The battle at Dien Bien Phu has ended without closing the war. In Nam Bo the southern resistance still holds ground and remains at war with Saigon, preventing either Vietnamese delegation from treating the northern result as a settlement.\n\nHanoi can reinforce the southern struggle or make the unresolved war itself the argument for negotiations. Neither course conjures a conference while Vietnamese armies are still fighting; it decides what strength we carry toward the table once peace makes talks possible."
 VIN_South.1.a:0 "Put the southern question before the Politburo."
 VIN_South_Decisions_Unlock_tt:0 "The §YSouthern War After Dien Bien Phu§! choices will remain available while the southern resistance survives and the fighting continues."

 VIN_South.2.t:0 "The Southern Campaign Ends"
 VIN_South.2.d_defeat:0 "The weapons and cadres sent to Nam Bo delayed the end, but they could not prevent it. The southern resistance has been broken and Saigon controls the field. With no southern army left to sustain and no new northern campaign prepared, Hanoi must carry the result of the war into diplomacy."
 VIN_South.2.d_ceasefire:0 "The southern guns have fallen silent before either army destroyed the other. The supply commitment has run its course, and the remaining contest now moves from Nam Bo to the terms of an Indochina settlement."
 VIN_South.2.d_auto:0 "The colonial camp at Dien Bien Phu has fallen, but the southern resistance is already broken. There is no remaining campaign whose result can postpone the diplomatic reckoning. Once both Vietnamese governments are out of their wars, the powers will be called to Geneva."
 VIN_South.2.a:0 "Carry the war's result to the conference table."
 VIN_Post_DBP_Auto_Geneva_tt:0 "Hanoi will pursue an §YIndochina settlement§!. If Dien Bien Phu fell and the southern resistance has been defeated, its disarmed remnants will accept an armistice and the §YGeneva Conference§! will convene automatically as soon as Hanoi and Saigon are both at peace."

 VIN_Post_DBP_Southern_War:0 "The Southern War After Dien Bien Phu"
 VIN_Post_DBP_Southern_War_desc:0 "The set-piece battle in the north is over, but the southern Viet Minh remain at war. Hanoi must choose whether to sustain their battlefield position or convert the moment into pressure for an Indochina settlement. A conference cannot convene while the Vietnamese armies are still fighting."
 VIN_Expand_Southern_Supply_Line:0 "Expand the Southern Supply Line"
 VIN_Expand_Southern_Supply_Line_desc:0 "Release weapons, radio sets, cadres, and trained replacements from the northern reserve and move them toward Nam Bo through the surviving coastal and inland networks. This strengthens the southern resistance and escalates the continuing struggle, but spends stores otherwise reserved for our next campaign."
 VIN_Press_for_Indochina_Talks:0 "Press for Talks on All Vietnam"
 VIN_Press_for_Indochina_Talks_desc:0 "Use the result at Dien Bien Phu to demand negotiations on the whole Indochina war. Hanoi gains leverage and presses every belligerent toward de-escalation, but the conference still cannot convene until the Vietnamese parties are actually at peace."
 VIN_Post_DBP_Supply_Cost:0 "£pol_power §Y50§! and §Y75 Campaign Supply§!"

 NLF_Northern_Supply_Line:0 "The Northern Supply Line"
 NLF_Northern_Supply_Line_desc:0 "Hanoi has released weapons, cadres, and replacements for the southern resistance. Dispersed routes cannot make Nam Bo a conventional front, but they can keep formations supplied and organized long enough to survive."
 VIN_Post_DBP_Southern_War_Recognized:0 "Hanoi has recognized that the §Ysouthern war continues after Dien Bien Phu§!"
 VIN_Post_DBP_Funded_NLF:0 "Hanoi chose to §Rescalate support for the southern resistance§!"
 VIN_Post_DBP_Pressed_For_Geneva:0 "Hanoi chose to §Gpress for an Indochina settlement§!"
