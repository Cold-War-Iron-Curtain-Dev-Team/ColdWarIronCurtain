 ISR_liberal_party: "HaTzionim HaKlaliym"
 ISR_liberal_party_long: "HaTzionim HaKlaliym: §GHaTzionim HaKlaliym (General Zionists) are a centrist big tent capitalist party. Formed by Zionists unaffiliated with either school of thought of Zionism, it soon adopted liberal and capitalist altitudes. The General Zionists main base of support is the middle class and other landowners outside of the Kibbutzim. The General Zionists are seen as the bipartisan solution to the increasingly polarized state of Israeli politics.§!"
 ISR_nationalist_party: "Tnuat Herut"
 ISR_nationalist_party_long: "Herut Movement: §GTnuat Herut (Herut Movement) also called simply Herut is a right wing revisionist Zionist party. Formed by former Irgun leader Menachem Begin and heavily influenced by now defunct Hatzohar Party. Herut adopted Jabotinsky's take on Zionism, Revisionist Zionism which strives for Jewish sovereignity over the entirety of former British Mandate for Palestine and full control over the Land of Israel. Herut is seen by many other parties as a fringe radical force, but their grassroots support makes them a potential major contender for power over the Knesset.§!"
 ISR_socialist_party: "Mifleget Poalei Eretz Yisrael"
 ISR_socialist_party_long: "Mifleget Poalei Eretz Yisrael: §GMifleget Poalei Eretz Yisrael (Workers Party of the land of Israel), often shortened to Mapai, is a moderate Socialist party that dominated Zionist Politics in the pre-state years. With their Socialist policies and their pro-West positions, Mapai seems as a party for the everyday worker who hasn't subscribed to Communism. Mapai is a very unstable party though, with many factions vying for power, which culminates in inner party turmoil for every mistake it makes.§!"
 ISR_trotskyism_party: "Mifleget HaPoalim HaMeuhedet"
 ISR_trotskyism_party_long: "Mifleget HaPoalim HaMeuhedet: §GMifleget HaPoalim HaMeuhedet (United Workers Party) often shortened to Mapam is a hardline Socialist party with minor Marxist tendencies. Formed as a merger of the HaShomer Hatzair and Ahdut Ha'Avodah parties, Mapam stands solidly on the left. Mapam believes that Zionism can play a part of the world revolution and believes that the USSR has made a mistake by adopting anti-Zionist altitudes.§!"
