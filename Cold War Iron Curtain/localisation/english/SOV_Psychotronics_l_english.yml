l_english:
 SOV_PROJECT_X_MODE: "Project X"
 RULE_OPTION_SOV_PROJECT_X_OFF: "Off"
 RULE_OPTION_SOV_PROJECT_X_OFF_DESC: "Project X is not used. The historical psychotronics charters are unchanged."
 RULE_OPTION_SOV_PROJECT_X_ON: "On — S.T.A.L.K.E.R. File"
 RULE_OPTION_SOV_PROJECT_X_ON_DESC: "Marks this campaign for Project X, the fictional laboratory program from S.T.A.L.K.E.R. No Project X decisions, events, or modifiers are present yet. The historical finding is unchanged either way."

 SOV_PSYCHOTRONICS_MODE: "Soviet Psychotronics"
 RULE_OPTION_SOV_PSYCHOTRONICS_HISTORICAL: "Historical — Appraisal"
 RULE_OPTION_SOV_PSYCHOTRONICS_HISTORICAL_DESC: "Once a Prague file exists, or from 1968 if it arrives through ordinary channels, the Soviet Union may review it, commission one demonstration study, and file a foreign assessment. The finding records that a controlled repeat did not support the demonstration. No method is granted."
 RULE_OPTION_SOV_PSYCHOTRONICS_OFF: "Off"
 RULE_OPTION_SOV_PSYCHOTRONICS_OFF_DESC: "The Soviet appraisal is neither initialized nor displayed. No foreign assessment is circulated by this system."

 SOV_PSYCHOTRONICS: "Psychotronic Appraisal"
 SOV_PSYCHOTRONICS_desc: "Research record: [?SOV_psych_record|0]/100\nScrutiny: [?SOV_psych_scrutiny|0]/100\n\nOne charter and one study. A finished file says a controlled repeat did not support the demonstration. Closing the charter is permanent."

 SOV_psych_review_prague_file: "Review the Prague File"
 SOV_psych_review_prague_file_desc: "A psychotronics file is available for appraisal. Opening the charter allows one demonstration review. It does not establish a method."
 SOV_psych_review_prague_file_tt: "The charter opens. Research record §G+5§!. A demonstration review becomes available. No method is granted."

 SOV_psych_commission_demonstration: "Commission the Demonstration Review"
 SOV_psych_commission_demonstration_desc: "Order a controlled look at the demonstration claims in the Prague file. The study occupies the only slot until its report is archived or the charter is closed."
 SOV_psych_commission_demonstration_tt: "A §Y90-day§! study starts, then a §Y30-day§! review. Scrutiny §R+2§!. The slot stays occupied until the report is archived or the charter is closed."

 SOV_psych_demo_research: "Demonstration Review"
 SOV_psych_demo_research_desc: "The academy is comparing the demonstration claims with a controlled repeat."

 SOV_psych_demo_review: "Write the Demonstration Report"
 SOV_psych_demo_review_desc: "The report is being written into the file. If this review runs out, the file is archived with the same finding as the manual archive."

 SOV_psych_archive_demonstration: "Archive the Demonstration"
 SOV_psych_archive_demonstration_desc: "File the report. The finding is already fixed: the demonstration did not survive a controlled repeat."
 SOV_psych_archive_demonstration_tt: "The finding is filed: a controlled repeat did not support the demonstration. Research record §G+10§!. The slot empties."

 SOV_psych_file_foreign_assessment: "File the Foreign Assessment"
 SOV_psych_file_foreign_assessment_desc: "Record that foreign services are collecting the same kind of claims. The assessment does not say that either side has a working method."
 SOV_psych_file_foreign_assessment_tt: "Scrutiny §R+1§!. The assessment circulates. It reports claims rather than a method."

 SOV_psych_close_section: "Close the Charter"
 SOV_psych_close_section_desc: "Close the charter for good. An open study is cancelled. An archived finding stays archived. An assessment already circulated is not recalled."
 SOV_psych_close_section_tt: "The charter closes permanently. An open study is cancelled. An archived finding stays archived. An assessment already circulated is not recalled."

 SOV_psych_fund_academy_reply_tt: "Spend §Y25 Political Power§!. Scrutiny §G-5§!. The charter stays open. Nothing new can be commissioned."

 SOV_psych_prague_source_forwarded: "The Czechoslovak section forwarded this file."
 SOV_psych_prague_source_channels: "The file arrived through ordinary channels."

 cwic_psychotronic_claims_note: " A Soviet appraisal is already circulating, and it reports claims rather than a method."
 cwic_psychotronic_claims_note_empty: ""

 cwic_sov_psych.1.t: "The Prague File"
 cwic_sov_psych.1.d: "[GetSOVPsychPragueFileSource]\n\nThe charter may commission one controlled review of the demonstration claims. It has no method to issue."
 cwic_sov_psych.1.a: "Open the charter."

 cwic_sov_psych.2.t: "Foreign Assessment"
 cwic_sov_psych.2.d: "The assessment is filed. Foreign services are collecting the same kind of claims. It does not say that a method exists on either side."
 cwic_sov_psych.2.a: "Circulate the assessment."

 cwic_sov_psych.3.t: "The Academy Asks Again"
 cwic_sov_psych.3.d: "The sponsors want to know whether the charter is still worth its budget. A funded reply keeps it open and lowers the scrutiny on the file. It does not authorize another study. Closing the charter costs nothing and cannot be undone."
 cwic_sov_psych.3.a: "Fund the reply."
 cwic_sov_psych.3.b: "Close the charter."

 cwic_sov_psych.4.t: "The Funding Is Gone"
 cwic_sov_psych.4.d: "The budget that carried the psychotronic appraisal has ended. The file stays what it was: a record of claims, and of a controlled repeat that did not support them."
 cwic_sov_psych.4.a: "Close the books."
