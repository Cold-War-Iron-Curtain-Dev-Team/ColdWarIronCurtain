l_english:
 SOV_PROJECT_X_MODE: "Project X"
 RULE_OPTION_SOV_PROJECT_X_OFF: "Off"
 RULE_OPTION_SOV_PROJECT_X_OFF_DESC: "Project X is not used. The historical psychotronics charters are unchanged."
 RULE_OPTION_SOV_PROJECT_X_ON: "On — S.T.A.L.K.E.R. File"
 RULE_OPTION_SOV_PROJECT_X_ON_DESC: "Unlocks a finite, explicitly fictional Project X prequel after an eligible Soviet assessment. It can culminate in a classified noosphere prototype and stable future-facing flags, but creates no Zone, mutants, artifacts, map damage, or supernatural combat content. Historical findings remain unchanged."

 SOV_PSYCHOTRONICS_MODE: "Soviet Psychotronics"
 RULE_OPTION_SOV_PSYCHOTRONICS_HISTORICAL: "Historical — Appraisal"
 RULE_OPTION_SOV_PSYCHOTRONICS_HISTORICAL_DESC: "Once a Prague file exists, or from 1968 if it arrives through ordinary channels, the Soviet Union may review it, commission one demonstration study, and file a foreign assessment. The finding records that a controlled repeat did not support the demonstration. No method is granted."
 RULE_OPTION_SOV_PSYCHOTRONICS_OFF: "Off"
 RULE_OPTION_SOV_PSYCHOTRONICS_OFF_DESC: "The Soviet appraisal is neither initialized nor displayed. No foreign assessment is circulated by this system."

 SOV_PSYCHOTRONICS: "Psychotronic Appraisal"
 SOV_PSYCHOTRONICS_desc: "Research record: [?SOV_psych_record|0]/100\nScrutiny: [?SOV_psych_scrutiny|0]/100\n\nOne charter and one study. A finished file says a controlled repeat did not support the demonstration. Closing the charter is permanent."

 SOV_psych_review_prague_file: "Review the Prague File"
 SOV_psych_review_prague_file_desc: "A psychotronics file is available for appraisal. Opening the charter allows one demonstration review. It does not establish a method."
 SOV_psych_review_prague_file_tt: "The charter opens. Research record §G+5§!. A demonstration review becomes available. No method is granted."

 SOV_psych_commission_demonstration: "Commission the Demonstration Review"
 SOV_psych_commission_demonstration_desc: "Order a controlled look at the demonstration claims in the Prague file. The study occupies the only slot until its report is archived or the charter is closed."
 SOV_psych_commission_demonstration_tt: "A §Y90-day§! study starts, then a §Y30-day§! review. Scrutiny §R+2§!. The slot stays occupied until the report is archived or the charter is closed."

 SOV_psych_demo_research: "Demonstration Review"
 SOV_psych_demo_research_desc: "The academy is comparing the demonstration claims with a controlled repeat."

 SOV_psych_demo_review: "Write the Demonstration Report"
 SOV_psych_demo_review_desc: "The report is being written into the file. If this review runs out, the file is archived with the same finding as the manual archive."

 SOV_psych_archive_demonstration: "Archive the Demonstration"
 SOV_psych_archive_demonstration_desc: "File the report. The finding is already fixed: the demonstration did not survive a controlled repeat."
 SOV_psych_archive_demonstration_tt: "The finding is filed: a controlled repeat did not support the demonstration. Research record §G+10§!. The slot empties."

 SOV_psych_file_foreign_assessment: "File the Foreign Assessment"
 SOV_psych_file_foreign_assessment_desc: "Record that foreign services are collecting the same kind of claims. The assessment does not say that either side has a working method."
 SOV_psych_file_foreign_assessment_tt: "Scrutiny §R+1§!. The assessment circulates. It reports claims rather than a method."

 SOV_psych_close_section: "Close the Charter"
 SOV_psych_close_section_desc: "Close the charter for good. An open study is cancelled. An archived finding stays archived. An assessment already circulated is not recalled."
 SOV_psych_close_section_tt: "The charter closes permanently. An open study is cancelled. An archived finding stays archived. An assessment already circulated is not recalled."

 SOV_psych_fund_academy_reply_tt: "Spend §Y25 Political Power§!. Scrutiny §G-5§!. The charter stays open. Nothing new can be commissioned."

 SOV_psych_prague_source_forwarded: "The Czechoslovak section forwarded this file."
 SOV_psych_prague_source_channels: "The file arrived through ordinary channels."

 cwic_psychotronic_claims_note: " A Soviet appraisal is already circulating, and it reports claims rather than a method."
 cwic_psychotronic_claims_note_empty: ""

 cwic_sov_psych.1.t: "The Prague File"
 cwic_sov_psych.1.d: "[GetSOVPsychPragueFileSource]\n\nThe charter may commission one controlled review of the demonstration claims. It has no method to issue."
 cwic_sov_psych.1.a: "Open the charter."

 cwic_sov_psych.2.t: "Foreign Assessment"
 cwic_sov_psych.2.d: "The assessment is filed. Foreign services are collecting the same kind of claims. It does not say that a method exists on either side."
 cwic_sov_psych.2.a: "Circulate the assessment."

 cwic_sov_psych.3.t: "The Academy Asks Again"
 cwic_sov_psych.3.d: "The sponsors want to know whether the charter is still worth its budget. A funded reply keeps it open and lowers the scrutiny on the file. It does not authorize another study. Closing the charter costs nothing and cannot be undone."
 cwic_sov_psych.3.a: "Fund the reply."
 cwic_sov_psych.3.b: "Close the charter."

 cwic_sov_psych.4.t: "The Funding Is Gone"
 cwic_sov_psych.4.d: "The budget that carried the psychotronic appraisal has ended. The file stays what it was: a record of claims, and of a controlled repeat that did not support them.[GetSOVPsychLateDecadesNote][GetCWIC_InterplaySovNote]"
 cwic_sov_psych.4.a: "Close the books."
 SOV_psych_late_decades_note_academy: "\n\nFrom the 1973 Questions of Philosophy commission through the 1991 torsion-field refutation, the Academy of Sciences kept the physical and physiological boundary intact."
 SOV_psych_late_decades_note_ministries: "\n\nDespite repeated Academy protests, closed ministry exemptions and late-perestroika advisory desks carried unverified bio-field and torsion claims right up to the fiscal collapse."
 SOV_psych_late_decades_note_quiet: "\n\nWhenever ministry contracts drew scrutiny in the seventies and eighties, the apparatus folded the hardware quietly into conventional ergonomic and metrology lines."
 SOV_psych_post_1994_sealed: "The post-Soviet institute archives remained sealed under Academy custody."
 SOV_psych_post_1994_licensed: "The institute's non-classified cosmonaut bio-telemetry patents were licensed in the nineties."
 SOV_psych_post_1994_sold: "Retired contractors sold their memoirs and unverified diagrams to Western television crews in the mid-nineties."

 # Event 5: The Questions of Philosophy Commission (Oct 1973)
 cwic_sov_psych.5.t: "The Questions of Philosophy Commission"
 cwic_sov_psych.5.d: "A panel of senior psychologists from the Academy of Pedagogical Sciences—B. F. Lomov, A. R. Luria, V. P. Zinchenko, and A. N. Leontiev—has submitted a lengthy survey for publication in Questions of Philosophy. Their paper condemns amateur 'parapsychology' circles and sensationalist newspaper stories about telepathic knockouts, while recommending that any legitimate instrument tests of bio-electric phenomena be confined to established physiology institutes.\n\nSeveral defense-industry ministries, however, have quietly asked that their closed radio-engineering contracts be left outside the Academy's methodological jurisdiction."
 cwic_sov_psych.5.a: "Endorse the Academy commission's boundary and curb unauthorized claims."
 cwic_sov_psych.5.b: "Exempt closed defense-ministry contracts from the Academy's review."
 cwic_sov_psych.5.c: "Publish the article as an ideological statement without auditing ministry labs."
 SOV_psych_5_academy_tt: "Costs §Y15 Political Power§!. Research Record §G+5§!, Scrutiny §G-5§! (and Directorate Scrutiny §G-4§! if active)."
 SOV_psych_5_exempt_tt: "Gains §G10 Political Power§!. Scrutiny §R+6§! (and Directorate Scrutiny §R+4§! if active), East–West Mirror Race §R+1§!."
 SOV_psych_5_nominal_tt: "Research Record §G+2§!, Scrutiny §R+2§!."

 # Event 6: The Bauman & Pulkovo Instrumentation Review (Nov 1978)
 cwic_sov_psych.6.t: "The Bauman Instrumentation Review"
 cwic_sov_psych.6.d: "Technical inspectors reviewing contract laboratories at the Bauman Higher Technical School and Pulkovo have submitted an awkward inventory. Alongside legitimate acoustic, thermal, and skin-conductance sensors built for cosmonaut monitoring, the laboratories have been testing human operators who claim to deflect magnetometer needles or fog photographic plates by concentration alone.\n\nPhysicists from the Academy of Sciences note that every apparent deflection disappears when the sensors are properly grounded and thermally shielded."
 cwic_sov_psych.6.a: "Restrict the laboratories to conventional cosmonaut bio-telemetry."
 cwic_sov_psych.6.b: "Keep the 'physical fields of biological objects' line under ministry classification."
 cwic_sov_psych.6.c: "Cancel external operator stipends and fold the gear into standard metrology."
 SOV_psych_6_telemetry_tt: "Costs §Y15 Political Power§!. Research Record §G+6§!, Scrutiny §G-4§! (and Directorate Record §G+4§! if active)."
 SOV_psych_6_classified_tt: "Gains §G10 Political Power§!. Scrutiny §R+6§! (and Directorate Scrutiny §R+5§! if active), East–West Mirror Race §R+1§!."
 SOV_psych_6_folded_tt: "Research Record §G+2§!, Scrutiny §G-3§!."

 # Event 7: The State Control Audit of "Biolocation" Contracts (Mar 1983)
 cwic_sov_psych.7.t: "The State Control Audit of 'Biolocation' Contracts"
 cwic_sov_psych.7.d: "Auditors enforcing the new administrative discipline campaign have flagged a series of geological and defense-ministry subcontracts paying external 'biolocation' operators and 'bio-generator' workshops. On paper, the contractors were hired to locate subterranean cables and water tables; in practice, the workshops have produced sealed metal boxes filled with unconnected brass rods and printed-circuit scraps.\n\nThe State Control committee wants the contracts terminated and the negative physical tests placed on file."
 cwic_sov_psych.7.a: "Enforce the audit, cancel the generator contracts, and file the negative tests."
 cwic_sov_psych.7.b: "Shield the ministry institutes behind a defense-research classification stamp."
 cwic_sov_psych.7.c: "Reassign the laboratories to operator-fatigue studies without a public reprimand."
 SOV_psych_7_enforced_tt: "Costs §Y15 Political Power§!. Research Record §G+6§!, Scrutiny §G-6§! (and Directorate Scrutiny §G-5§! if active)."
 SOV_psych_7_shielded_tt: "Gains §G15 Political Power§!. Scrutiny §R+7§! (and Directorate Scrutiny §R+5§! if active), East–West Mirror Race §R+1§!."
 SOV_psych_7_reassigned_tt: "Costs §Y5 Political Power§!. Research Record §G+3§!, Scrutiny §G-2§!."

 # Event 8: The Television Healers & The General Staff Advisory Desk (Oct 1989)
 cwic_sov_psych.8.t: "Television Healers and the General Staff Desk"
 cwic_sov_psych.8.d: "Evening broadcasts on Central Television now feature studio 'psychotherapists' and silent healers offering to charge jars of tap water and newspaper pages held up to television sets across the country. While the Academy of Sciences has drafted a sharp public protest against state-sponsored superstition, officers in the General Staff have proposed chartering a small special-purpose advisory desk—Military Unit 10003—to catalog every civilian and ministry claim before the cooperatives scatter them."
 cwic_sov_psych.8.a: "Back the Academy protest, pull the broadcasts, and require physical verification."
 cwic_sov_psych.8.b: "Charter the General Staff advisory desk to catalog the remaining claims."
 cwic_sov_psych.8.c: "Let Central Television air the broadcasts as a harmless public distraction."
 SOV_psych_8_academy_tt: "Costs §Y20 Political Power§!. Research Record §G+5§!, Scrutiny §G-6§! (and Directorate Scrutiny §G-4§! if active)."
 SOV_psych_8_unit10003_tt: "Costs §Y10 Political Power§!. Research Record §G+4§!, Scrutiny §R+6§!, East–West Mirror Race §R+1§!."
 SOV_psych_8_broadcasts_tt: "Gains §G15 Political Power§!. Stability §R-1.0%§!, Scrutiny §R+8§!."

 # Event 9: The Supreme Soviet Science Committee & Torsion Field Appropriations (Feb 1991)
 cwic_sov_psych.9.t: "The Supreme Soviet Inquiry into 'Torsion Field' Ventures"
 cwic_sov_psych.9.d: "Academician Evgeny Aleksandrov and colleagues from the Academy of Sciences' physical division have laid a dossier before the Supreme Soviet Committee on Science and Education. Through a network of semi-private ministry ventures, millions of rubles have been diverted to develop 'microlepton' and 'torsion field' transmitters promised to penetrate steel and seawater instantaneously.\n\nLaboratory inspections by Academy physicists found no radiation, no signal transmission, and no physical theory capable of surviving peer review."
 cwic_sov_psych.9.a: "Publish the Academy's refutation and claw back the ministry appropriations."
 cwic_sov_psych.9.b: "Keep the venture contracts sealed under defense-ministry classification."
 cwic_sov_psych.9.c: "Dissolve the venture quietly without a floor debate."
 SOV_psych_9_refuted_tt: "Gains §G15 Political Power§!. Research Record §G+6§!, Scrutiny §G-6§!."
 SOV_psych_9_sealed_tt: "Costs §Y15 Political Power§!. Scrutiny §R+6§!, East–West Mirror Race §R+1§!."
 SOV_psych_9_quiet_tt: "Research Record §G+2§!, Scrutiny §G-2§!."

 # Event 10: Foreign Buyers at the Institute Door (May 1994)
 cwic_sov_psych.10.t: "Foreign Buyers at the Institute Door"
 cwic_sov_psych.10.d: "Three years after the old psychotronics budget vanished, Western television producers, paperback authors, and private defense contractors have begun arriving at Moscow physiology and radio-engineering institutes with hard currency in hand. Some are looking for sensational stories about 'psychotronic generators'; others want the very real cosmonaut bio-telemetry and operator-vigilance patents developed alongside the closed dossiers."
 cwic_sov_psych.10.a: "Seal the laboratory archives under Academy custody and bar commercial sales."
 cwic_sov_psych.10.b: "License the non-classified cosmonaut bio-telemetry and ergonomic patents."
 cwic_sov_psych.10.c: "Let retired contractors sell their memoirs and diagrams to Western television."
 SOV_psych_10_sealed_tt: "Costs §Y15 Political Power§!. Stability §G+1.0%§!, Research Record §G+4§!."
 SOV_psych_10_licensed_tt: "Gains §G25 Political Power§!. Research Record §G+3§!."
 SOV_psych_10_sold_tt: "Gains §G15 Political Power§!. Stability §R-1.0%§!, East–West Mirror Race §R+1§!."
