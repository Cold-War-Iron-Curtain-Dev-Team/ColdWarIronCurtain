l_english:
 # ============================================================================
 #  THE KOREAN SETTLEMENT - post-war Korea side branch (SOV / Stalin tree)
 #  Appears when the war ends; replaces the wartime branch in place.
 #  The exiled southern government is referred to generically throughout - its
 #  location varies by playthrough and must never be named here.
 # ============================================================================

 # ---- Events ----
 sov_korea_settlement.1.t:0 "Two Koreas"
 sov_korea_settlement.1.d:0 "The line is where it was, and it is going to stay there.\n\nWhat began as a war of reunification has ended as a permanent partition, and both halves of the peninsula are now doing what partitioned states do: building rival armies, rival economies and rival claims to be the only real Korea.\n\nThe northern republic will be brought into the socialist economy properly — plan coordination, trade on our terms, technical assistance. It is a smaller prize than the whole peninsula. It is also one nobody is going to take away from us."
 sov_korea_settlement.1.a:0 "The line holds."

 sov_korea_settlement.2.t:0 "A Unified Korea"
 sov_korea_settlement.2.d:0 "Korea is one country again, and it is ours.\n\nThe war Kim Il-sung asked permission to start has ended the way he said it would, which is more than anyone in the Presidium expected. The Americans have been driven off the peninsula, the southern government has fled to whatever ground it could still reach, and the socialist camp holds a coastline four hundred kilometres from Japan.\n\nTokyo has understood the implication faster than Washington has. So has everyone else in Asia who was waiting to see whether American guarantees were worth anything."
 sov_korea_settlement.2.a:0 "The first territory the West has actually lost."

 sov_korea_settlement.3.t:0 "The Government in Exile"
 sov_korea_settlement.3.d:0 "What is left of the southern republic is a cabinet, a flag, a radio transmitter and whatever units got out.\n\nIt still holds the seat at the United Nations, still receives American money, and still describes itself as the lawful government of all Korea — from territory it could lose in an afternoon if anyone thought it worth the trouble.\n\nMoscow's position is that no such government exists. The practical work is making sure the rest of the world reaches the same conclusion before the exiles can turn themselves into a permanent embarrassment."
 sov_korea_settlement.3.a:0 "A government of one island and one grievance."

 sov_korea_settlement.4.t:0 "The Korean Disaster"
 sov_korea_settlement.4.d:0 "The Korean People's Army has been destroyed and the Democratic People's Republic no longer exists.\n\nMoscow armed it, trained it, gave it the aircraft and the airmen, and lost it anyway. There is now an American client state on the Soviet Pacific frontier, with American divisions on it, and no buffer of any kind between them and Vladivostok.\n\nThe Presidium has not yet decided whose fault this is. It has decided that the answer will be found somewhere below the Presidium."
 sov_korea_settlement.4.a:0 "Someone will answer for Korea."

 sov_korea_settlement.5.t:0 "The Korean Comrades"
 sov_korea_settlement.5.d:0 "Those of the Korean party who got out came north across the Tumen with nothing.\n\nThey will be resettled in the Maritime Province and in Central Asia, kept together, and kept usable. Korea will hold elections again one day, or it will not, and either way a party in exile costs very little to maintain and occasionally turns out to be worth a great deal."
 sov_korea_settlement.5.a:0 "Keep them. We may need them."

 # ---- Focuses: shared root ----
 SOV_kwp_the_korean_settlement:0 "The Korean Settlement"
 SOV_kwp_the_korean_settlement_desc:0 "The guns have stopped. What Korea is now, and what the Soviet Union does about it, depends entirely on how the fighting ended.\n\nThree years of war have cost the socialist camp a great deal and taught the Americans that they will fight. Whatever the map looks like, Asia is not what it was in 1950, and neither is the Soviet position in it."
 SOV_kwp_the_korean_settlement_tt:0 "Unlocks the §YKorean Settlement§! branch, according to how the war ended."

 # ---- Focuses: historical division ----
 SOV_kwp_rebuild_the_north:0 "Rebuild the North"
 SOV_kwp_rebuild_the_north_desc:0 "There is very little left of northern Korea above ground.\n\nThe American air campaign ran out of targets in 1952 and went on regardless; by the armistice the bombers were destroying irrigation dams because the cities were already gone. Pyongyang is rubble with a population living under it.\n\nRebuilding it is not charity. A client that cannot feed itself is a client that costs more every year, and the whole socialist camp will be judged on what northern Korea looks like in ten years."
 SOV_kwp_rebuild_the_north_tt:0 "Large Soviet expenditure. Northern Korea gains §Yfunding§!, §Ystability§!, an §Yindustrial complex§! and §Yinfrastructure§!, and relations improve substantially."

 SOV_kwp_the_frozen_frontier:0 "The Frozen Frontier"
 SOV_kwp_the_frozen_frontier_desc:0 "The armistice is a ceasefire between commanders, not a peace between states. Nobody signed anything ending the war, and legally it is still going on.\n\nThat suits us. A permanently armed frontier keeps two American divisions tied down in Korea indefinitely, keeps Japan nervous, and keeps the northern republic dependent on Soviet weapons for as long as the line exists — which, on present evidence, will be a very long time."
 SOV_kwp_the_frozen_frontier_tt:0 "Northern Korea gains §Yequipment§!, §Yarmy experience§! and §Ywar support§!, and grants us military access.\nWorld tension falls."

 SOV_kwp_two_koreas_one_peninsula:0 "Two Koreas, One Peninsula"
 SOV_kwp_two_koreas_one_peninsula_desc:0 "Neither Korea will ever recognise the other, and both will spend the next fifty years insisting the partition is temporary.\n\nMoscow's interest is in making its half permanent in every way that matters short of saying so: COMECON membership, plan coordination, a defence relationship, and an economy wired into ours rather than into anyone else's.\n\nThe reunification rhetoric can continue. It costs nothing and it plays well in Pyongyang."
 SOV_kwp_two_koreas_one_peninsula_tt:0 "Northern Korea joins §YCOMECON§!. Relations improve substantially and Soviet foreign power projection rises."

 # ---- Focuses: the north wins ----
 SOV_kwp_a_unified_korea:0 "A Unified Korea"
 SOV_kwp_a_unified_korea_desc:0 "The Korean People's Army holds the peninsula from the Yalu to the sea, and the government that ruled the south has fled to whatever ground it could still reach.\n\nThis is the first time since 1945 that the West has lost a country outright to force of arms, and every capital in Asia has noticed. So has Tokyo, which now faces a hostile unified Korea across a hundred and eighty kilometres of water and has begun asking Washington some pointed questions about what American protection is actually worth."
 SOV_kwp_a_unified_korea_tt:0 "Korea is unified under Pyongyang. Large gain in §Ypolitical power§! and Soviet foreign power projection.\nWorld tension rises sharply."

 SOV_kwp_rebuild_the_peninsula:0 "Rebuild the Peninsula"
 SOV_kwp_rebuild_the_peninsula_desc:0 "Winning the whole country means inheriting the whole ruin.\n\nThree years of war and the heaviest bombing campaign since Germany have left both halves of Korea flattened, and the south — which was fought over four times — is in worse condition than the north. Twenty million people are now our responsibility.\n\nIt will be the largest reconstruction programme the Soviet Union has ever undertaken outside its own borders, and it will be worth every rouble the first time a Korean factory ships something we need."
 SOV_kwp_rebuild_the_peninsula_tt:0 "Very large Soviet expenditure. Korea gains §Yfunding§!, §Ystability§!, two §Yindustrial complexes§! and §Yinfrastructure§!."

 SOV_kwp_the_government_in_exile:0 "The Government in Exile"
 SOV_kwp_the_government_in_exile_desc:0 "The southern republic survives on the ground it retreated to — a cabinet, a garrison, an American subsidy and a claim.\n\nIt cannot threaten Korea and everybody knows it. What it can do is hold a United Nations seat, provide a flag for every exile organisation and infiltration attempt for the next thirty years, and give Washington somewhere to point when it refuses to recognise Pyongyang.\n\nWe will make certain the world treats it as what it is: a government of nowhere, kept alive out of embarrassment."
 SOV_kwp_the_government_in_exile_tt:0 "The exiled southern government loses §Ystability§! and §Ywar support§!.\nKorea gains §Ywar support§!. World tension falls."

 SOV_kwp_korea_in_the_socialist_camp:0 "Korea in the Socialist Camp"
 SOV_kwp_korea_in_the_socialist_camp_desc:0 "A unified Korea of twenty million people, with the Japanese-built industry of the north and the ports of the south, is the most valuable thing the socialist camp has acquired since the war.\n\nIt will be integrated properly — COMECON, our alliance system, our sphere, and Soviet naval access to harbours that face directly into the Sea of Japan.\n\nTokyo will spend the next generation living with the consequences of a decision made in Washington in 1950."
 SOV_kwp_korea_in_the_socialist_camp_tt:0 "Korea joins §YCOMECON§!, our §Ysphere§! and, if we lead a faction, our alliance.\nLarge gain in Soviet foreign power projection. §YJapan§! is alarmed."

 # ---- Focuses: the south wins ----
 SOV_kwp_the_korean_disaster:0 "The Korean Disaster"
 SOV_kwp_the_korean_disaster_desc:0 "The Democratic People's Republic no longer exists. The Korean People's Army has been destroyed, its leadership has fled or been captured, and the peninsula is united under a government that owes everything to Washington.\n\nMoscow supplied that army, trained it, and flew air cover for it in Chinese markings. All of it is gone, and there is now an American client on the Soviet Pacific frontier with no buffer of any kind.\n\nThe first task is to stop describing this as anything other than what it was."
 SOV_kwp_the_korean_disaster_tt:0 "The northern republic is gone. Lose §Ystability§!, §Ywar support§! and a great deal of foreign power projection."

 SOV_kwp_shelter_the_korean_comrades:0 "Shelter the Korean Comrades"
 SOV_kwp_shelter_the_korean_comrades_desc:0 "What is left of the Korean Workers' Party crossed the Tumen ahead of the advance — cadres, soldiers, families, the archives if they were lucky.\n\nThey will be resettled in the Maritime Province and Central Asia and kept together as an organisation. A party in exile is a poor asset. It is also the only Korean asset we have left, and Korea will not be an American garrison forever."
 SOV_kwp_shelter_the_korean_comrades_tt:0 "Gain §Ymanpower§! and political power at a small cost to stability.\nCommunist popularity rises in Korea and its stability falls."

 SOV_kwp_fortify_the_maritime_provinces:0 "Fortify the Maritime Provinces"
 SOV_kwp_fortify_the_maritime_provinces_desc:0 "There is no longer a friendly state between the Soviet Far East and the United States Army.\n\nVladivostok is the base of the Pacific Fleet and it is now within tactical air range of a hostile peninsula. The Maritime Province was garrisoned against Japan; it will have to be garrisoned again, against a threat that has nuclear weapons and an airfield in Pusan.\n\nThis is expensive, permanent, and entirely the price of losing Korea."
 SOV_kwp_fortify_the_maritime_provinces_tt:0 "New §Yair base§! and §Yradar§! in the Soviet Far East. Gain §Ywar support§! and harden military policy.\nWorld tension rises."

 SOV_kwp_lessons_of_the_korean_war:0 "Lessons of the Korean War"
 SOV_kwp_lessons_of_the_korean_war_desc:0 "The war is worth studying precisely because it was lost.\n\nSoviet doctrine assumed that an army built on the 1945 model, given enough armour and artillery, would roll over anything in Asia. It did, for three months, and then it met American airpower and amphibious mobility and came apart.\n\nEverything about how the Soviet Army expects to fight has to be re-examined — air defence, logistics under interdiction, and the assumption that the next war will look like the last one. The men who conduct that review will be careful never to say that this is what they are doing."
 SOV_kwp_lessons_of_the_korean_war_tt:0 "Large gain in §Yarmy§! and §Yair experience§!, and a bonus to §Yland doctrine§! research.\nGain political power, stability and foreign power projection."

 # ---- Threats ----
 SOV_kwp_frozen_frontier_threat:0 "The Korean Armistice Line"
 SOV_kwp_unified_korea_threat:0 "A Unified Communist Korea"
 SOV_kwp_exile_threat:0 "The Korean Government in Exile"
 SOV_kwp_maritime_threat:0 "Soviet Far Eastern Buildup"
