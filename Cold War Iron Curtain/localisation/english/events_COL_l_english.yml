l_english:


  COL_COUP.1.t:0 "Liberals plot coup!"
  COL_COUP.1.d:0 "Reports have begun to surface of clandestine meetings between liberal intellectuals, disillusioned military officers, and foreign envoys. What began as quiet dissent has grown into a coordinated movement. Leaflets advocating constitutional reform are being distributed in the shadows, and anonymous broadcasts call for the restoration of democracy. The government watches with unease as the halls of power tremble with uncertainty. A coup, once unthinkable, now feels inevitable."
  COL_COUP.1.a:0 "NO WAY!"

  COL_COUP.2.t:0 "Ospina Pérez dissolved the Congress!"
  COL_COUP.2.d:0 "The Liberals, who had majority control of Congress, began impeachment proceedings against President Ospina Pérez. In response, Ospina Pérez dissolved the Congress, creating a Conservative dictatorship."
  COL_COUP.2.a:0 "NO WAY!"




  COL_Vio.1.t:0 "Liberals and Communists revolt!"
  COL_Vio.1.d:0 "Jorge Elicer Gaitan was the favored liberal candidate, seen as most likely winner in the elections, until he was assassinated today. Riots and looting have broken out, leaving a hundred dead in the chaos in Bogota. Known as the 'The Bogotazo', the conservative government immediately it blamed on Colombian communists. The people of the countryside began to take up arms following the chaos in the Capital, causing a decade long civil-war."
  COL_Vio.1.a:0 "Chaos in Colombia! Partisans in the countryside!"
  COL_Vio.1.b:0 "No, We are Liberalists!"
  COL_Vio.1.c:0 "Unite and Fight! Our comrades!"
  
  COL_Vio.2.t:0 "Air Force Captain Alfredo Silva!"
  COL_Vio.2.d:0 "The Liberal Party decided to stage a military coup, and it was planned for November 25, 1949. However, many of the party members decided it was not a good idea and called it off. One conspirator, Air Force Captain Alfredo Silva, in the city of Villavicencio, had not been notified of the abandonment of the plan and carried it out. After rallying the Villavicencio garrison, he disarmed the police and took control of the city."
  COL_Vio.2.a:0 "Get that back ASAP!"
 



  COL_POW.1.t:0 "Raid has been successfully done!" 
  COL_POW.1.d:0 "Wooh!"
  COL_POW.1.a:0 "Beat the opps!"
