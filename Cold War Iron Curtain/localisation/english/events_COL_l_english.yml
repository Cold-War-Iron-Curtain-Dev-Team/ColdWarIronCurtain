l_english:


  COL_Vio.1.t:0 "La Violencia"
  COL_Vio.1.d:0 "Jorge Elicer Gaitan was the favored liberal candidate, seen as most likely winner in the elections, until he was assassinated today. Riots and looting have broken out, leaving a hundred dead in the chaos in Bogota. Known as the 'The Bogotazo', the conservative government immediately it blamed on Colombian communists. The people of the countryside began to take up arms following the chaos in the Capital, causing a decade long civil-war."
  COL_Vio.1.a:0 "Chaos in Colombia! Partisans in the countryside!"
  
  COL_POW.1.t:0 "Raid has been successfully done!" 
  COL_POW.1.d:0 "Wooh!"
  COL_POW.1.a:0 "Beat the opps!"
