l_english:
 IC_Chanson.1.t:0 "General Chanson Is Dead"
 IC_Chanson.1.d:0 "The suicide bomber at Sa Dec reached the general's car. Charles Chanson, commander of the expeditionary forces in the south, is dead, and with him the Governor of Saigon-Cholon. The Mekong delta is stunned. In Paris the deputies ask why the south was ever left in the hands of a few officers, and the southern Viet Minh cadres, who claim the blow as their own, count their ranks and find them swollen with recruits."
 IC_Chanson.1.a:0 "A grievous loss"
 IC_Chanson.2.t:0 "General Chanson Survives Sa Dec"
 IC_Chanson.2.d:0 "The bomber at Sa Dec was a heartbeat too early. Charles Chanson walked away with a few cuts and a ringing in his ears, and the Governor of Saigon-Cholon lived with him. Saigon takes the escape as a sign that the delta can still be managed with local knowledge, and Chanson, who knows every canal and village chief, now asks to lead a proper pacification of the south."
 IC_Chanson.2.a:0 "The delta is still ours to hold"
 IC_Chanson_Killed_tt:0 "§RThe Metropole loses patience:§! §R-3 Patience§!. The southern Viet Minh gain confidence, and their next offensive in the highlands will be better supplied. The Viet Minh gain a small advantage in the struggle. General Chanson will not be available for the State of Vietnam."
 IC_Chanson_Survived_tt:0 "§GGeneral Chanson lives.§! A southern pacification program is now open to the CEFEO, Operation Camargue costs fewer War Credits and needs one day less of holding, and the French cause gains a small advantage in the struggle."
 FRE_Chanson_Pacification:0 "Southern Pacification"
 FRE_Chanson_Pacification_desc:0 "General Chanson lived, and he knows the delta. Give him the garrisons, militias and river patrols to pacify the south properly."
 FRE_Chanson_Pacification_tt:0 "The CEFEO gain §GChanson's Pacification Program§!. The State of Vietnam gains §G+3%§! stability, and the southern Viet Minh suffer a lasting organization and reinforcement penalty. §GPro-France +10§! in the struggle."
 NLF_Chanson_Pacification_Pressure:0 "Delta Under Pacification"
 NLF_Chanson_Pacification_Pressure_desc:0 "French and State of Vietnam garrisons now sit in the villages of the delta. Recruiting, hiding and moving men has become harder for the southern cadres."
 FRE_Chanson_Pacification_Program:0 "Chanson's Pacification Program"
 FRE_Chanson_Pacification_Program_desc:0 "Charles Chanson's knowledge of the delta guides a patient program of village garrisons, local militias and river patrols. Reinforcements arrive faster and the columns consume less."
 FRE_Chanson_Killed:0 "§RGeneral Chanson was killed at Sa Dec§!"
 FRE_Chanson_Survived:0 "§GGeneral Chanson survived the attack at Sa Dec§!"
 FRE_Chanson_Pacification_Done:0 "§GChanson's pacification program is under way§!"
 NLF_Chanson_Ascendancy:0 "§RThe southern Viet Minh are emboldened by Chanson's death§!"
