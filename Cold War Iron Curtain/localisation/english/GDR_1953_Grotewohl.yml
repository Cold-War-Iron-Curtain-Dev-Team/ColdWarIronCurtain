l_english: 

 GDR_Stabilization_of_the_Republic:0 "Stabilization of the Republic"
 GDR_Stabilization_of_the_Republic_desc:0 "The transition from fascist dictatorship to socialist republic has not been smooth. We should focus on stabilizing our regime, lest we suffer a repeat of 1933."
 GDR_Reaffirm_Socialist_Ostorientierung:0 "Reaffirm Socialist Ostorientierung"
 GDR_Reaffirm_Socialist_Ostorientierung_desc:0 "Despite the recent changes in leadership, we must remember that our socialist brothers in Moscow are still our strongest allies against the encroaching imperialists."
 GDR_Focus_on_Improving_Living_Standards:0 "Focus on Improving Living Standards"
 GDR_Focus_on_Improving_Living_Standards_desc:0 "The capitalists have made it a point to make West Germany seem like a paradise and entice our population to migrate there. To counteract this, we will increase our living standards and turn East Germany into a proper worker's paradise!"
 GDR_Collaborate_with_Progressive_Bourgeois:0 "Collaborate with Progressive Bourgeoisie"
 GDR_Collaborate_with_Progressive_Bourgeois_desc:0 "There are a handful of progressively minded bourgeoise who are willing to work with us. Should they ever become a problem, they are small enough to eliminate with minimal consequence."
 GDR_Consider_Further_Assistance_for_Displaced:0 "Further Assistance for the Displaced"
 GDR_Consider_Further_Assistance_for_Displaced_desc:0 "The War has left many Germans displaced and homeless. Let's double our efforts to rehabilitate these comrades!"
 GDR_Modernize_Agricultural_Machinery_Rental_Stations:0 "Modernize Agricultural Machinery Rental Stations"
 GDR_Modernize_Agricultural_Machinery_Rental_Stations_desc:0 "If we do not modernize our agricultural machinery sector, we run the risk of reduced output, or worse, famine."
 GDR_Provide_Incentives_for_LPG_Adoption:0 "Provide Incentives for LPG Adoption"
 GDR_Provide_Incentives_for_LPG_Adoption_desc:0 "Agricultural Production Cooperatives are essential for our collectivization efforts. We should offer up some incentives for our farmers to adopt them."
 GDR_Propose_Closer_Integraton_with_COMECON:0 "Propose Closer Integraton with COMECON"
 GDR_Propose_Closer_Integraton_with_COMECON_desc:0 "If we are to pursue closer relations with Moscow and our neighboring socialist allies, then we should try to further integrate into the emerging COMECON."
 GDR_Sideline_Ulbricht:0 "Sideline Ulbricht"
 GDR_Sideline_Ulbricht_desc:0 "Ulbricht is still useful for us, provided we can keep him under control. We'll place him in charge of a minor, insignificant office where he can cause no harm."
 GDR_Promote_Ebert:0 "Promote Ebert"
 GDR_Promote_Ebert_desc:0 "Friedrich Ebert Jr. has proven to be a worthy successor to his father's legacy. He should be promoted to a higher office!"
 GDR_Reevaluate_the_West_Commission:0 "Re-Evaluate the West Commission"
 GDR_Reevaluate_the_West_Commission_desc:0 "The West Commission exists to protect us from West German propaganda and subversion efforts; however, many have begun to question if their methods are impeding progress towards national unification. We should investigate this."
 GDR_Revamp_FDJ_Leadership:0 "Revamp FDJ Leadership"
 GDR_Revamp_FDJ_Leadership_desc:0 "The Free German Youth is a fine organization; we best make sure that it is headed by only the best of leaders."
 GDR_Seek_Correspondance_with_the_SPD:0 "Seek Correspondance with the SPD"
 GDR_Seek_Correspondance_with_the_SPD_desc:0 "The SPD is slowly moving away from the left and towards the center. Perhaps if we act quickly, we can stop this troublesome trend and have them work closely with us."
 GDR_Decry_the_Rightward_Shift_of_the_SPD:0 "Decry the Rightward Shift of the SPD"
 GDR_Decry_the_Rightward_Shift_of_the_SPD_desc:0 "The SPD has been making uncomfortable shifts rightward in recent years. This is a clear betrayal of their founding principles and must be called out!"
 GDR_The_Platform_for_the_Special_German_Route_to_Socialism:0 "The Special German Route to Socialism"
 GDR_The_Platform_for_the_Special_German_Route_to_Socialism_desc:0 "Wolfgang Harich and his followers have submitted a list of demands that, in their view, would put Germany on the proper path to socialism and national unity. Let's see what they have to say."
 GDR_Deutsche_an_einen_Tisch:0 "Germans at the Table"
 GDR_Deutsche_an_einen_Tisch_desc:0 "It is time for Germans from both East and West to sit down and discuss our nation's future going forward."
 GDR_Visit_Pyeongyang:0 "Visit Pyongyang"
 GDR_Visit_Pyeongyang_desc:0 "The DPRK is in a similar position to ours, and there is much we can learn from our Korean comrades. A state visit is in order."
 GDR_Empower_the_Intelligenistia:0 "Empower the Intelligenistia"
 GDR_Empower_the_Intelligenistia_desc:0 "The DPRK is unique in socialist countries in that they see the intelligentsia as an important component of their society, encouraging literacy and furthering culture. We should follow their example."
 GDR_Lift_Academic_Censorship:0 "Lift Academic Censorship"
 GDR_Lift_Academic_Censorship_desc:0 "If we are to compete with the emerging power of our western counterpart, we will have to lift some of the restrictions in our academic circles."
 GDR_Sideline_Harich:0 "Sideline Harich"
 GDR_Sideline_Harich_desc:0 "Though Wolfgang Harich was brave enough to desert from Hitler's army, he still should not be entirely trusted. We will keep him under watch and allow him to ramble on about philosophy in peace, for now."
 GDR_Agree_to_Submit_the_Proposal_to_the_Party:0 "Submit the Proposal to the Party"
 GDR_Agree_to_Submit_the_Proposal_to_the_Party_desc:0 "Free elections, freedom of expression, economic reforms, East-West German government cooperation, and full sovereignty from the Soviet Union. These points, among others, are the only way we will be able to achieve true socialism in Germany and the reunification of our people."
