 BUR_TT_CURRENT_PHASE: "§YCurrent phase: [BurmaStruggleCurrentPhaseName]§!\n\n§YFull Civil War§!: every group below 30 Friendliness goes to open war with the Union.\n§YHigh Intensity§!: widespread insurgency across the delta, the hills and the frontier.\n§YMedium Intensity§!: the insurgents hold their base areas but cannot threaten Rangoon.\n§YLow Intensity§!: scattered fighting in the border hills.\n§YStabilization§!: the Union governs most of the country.\n\nThe phase moves one step when the easing or escalating meter reaches 500."
 BUR_TT_METER_DOWN: "De-escalation progress toward the next easier phase. Fills to 500 and the phase eases."
 BUR_TT_METER_UP: "Escalation progress toward the next harder phase. Fills to 500 and the phase escalates."
 BUR_TT_CARD_FRIEND: "§YFriendliness§!: how well this group regards the Union. Dialogue, amnesty and frontier aid raise it.\n\nTick at §G60§!: autonomy becomes possible (Burmanization below 40).\nTick at §G90§!: the group can be integrated."
 BUR_TT_CARD_BURMAN: "§YBurmanization§!: how far Burman language and administration have been imposed on this group.\n\nTick at §Y40§!: above this, autonomy is no longer possible.\nTick at §Y80§!: the group can be subjugated once Strength is below 200."
 BUR_TT_CARD_STRENGTH: "§YStrength§!: the group's armed capacity, out of 1000. Sweeps and amnesty reduce it.\n\nTick at §R200§!: below this, a group with Burmanization above 80 can be subjugated."
 BUR_TT_CARD_FRONT: "§YUnited front§!: how far this group has joined a common front against the Union. No thresholds."
