l_english: 

 GDR_First_Secretary_Herrnstadt:0 "First Secretary Herrnstadt"
 GDR_First_Secretary_Herrnstadt_desc:0 "Rudolf Herrnstadt has managed to wrestle leadership of the GDR from Walter Ulbricht; it is time to formally recognize him as our new First Secretary."
 GDR_Exorcise_the_Spectre_of_the_Construction_of_Socialism:0 "Exorcise the Spectre of the Construction of Socialism"
 GDR_Exorcise_the_Spectre_of_the_Construction_of_Socialism_desc:0 "Our vision for Germany's future does not align with Ulbricht's failed policies. We must make our intentions of this clear, through words and action."
 GDR_The_New_Reconstruction_Plan:0 "The New Reconstruction Plan"
 GDR_The_New_Reconstruction_Plan_desc:0 "The War has been over for some time, yet our country still lies in ruins. It is clear that we need to reevaluate our plans for the reconstruction of our nation."
 GDR_Modernize_Rail_Connections:0 "Modernize Rail Connections"
 GDR_Modernize_Rail_Connections_desc:0 "The railways were all but destroyed in the final days of the War. While regrettable, it does provide us with the opportunity to modernize them as we rebuild."
 GDR_Address_the_Economic_Causes_of_Republikflucht:0 "The Economic Causes of Republikflucht"
 GDR_Address_the_Economic_Causes_of_Republikflucht_desc:0 "We can no longer ignore Republikflucht; while it would be easier to simply forbid our people from leaving, it would not address the root cause of the issue. Therefore, economic reform is needed."
 GDR_Soviet_Food_Aid:0 "Soviet Food Aid"
 GDR_Soviet_Food_Aid_desc:0 "It will take time for our farmlands to recover from the ravages of war. In the meantime, we will have to rely on Soviet food aid."
 GDR_Ensure_Delivery_of_Raw_Materials:0 "Ensure Delivery of Raw Materials"
 GDR_Ensure_Delivery_of_Raw_Materials_desc:0 "In order to facilitate the economic reconstruction of the German state, we must ensure that raw materials are delivered where they are required."
 GDR_Integrate_into_the_Eastern_Market:0 "Integrate into the Eastern Market"
 GDR_Integrate_into_the_Eastern_Market_desc:0 "A new market among our socialist neighbors is emerging, integrating into it would bring a huge boom to our economy."
 GDR_Restore_Social_Services:0 "Restore Social Services"
 GDR_Restore_Social_Services_desc:0 "A socialist country prides itself in state-of-the-art social services. We must restore ours at once!"
 GDR_Reverse_Work_Quota_Increases:0 "Reverse Work Quota Increases"
 GDR_Reverse_Work_Quota_Increases_desc:0 "The excessively high work quotas of the previous administration have left our workers tired and disillusioned. We must reverse them immediately."
 GDR_Reform_the_Legal_System:0 "Reform the Legal System"
 GDR_Reform_the_Legal_System_desc:0 "There is a growing consensus among our people and several party members that our judicial system is in need of reforms. Let's address this."
 GDR_The_Cult_of_the_Spanish_Civil_War:0 "The Cult of the Spanish Civil War"
 GDR_The_Cult_of_the_Spanish_Civil_War_desc:0 "The brave men and women who fought to prevent Spain from falling into fascist influence can never be forgotten! All of our people should strive to follow their example."
 GDR_Focus_on_the_Unified_Deutschemark_Zone_Proposal:0 "The Unified Deutschemark Zone Proposal"
 GDR_Focus_on_the_Unified_Deutschemark_Zone_Proposal_desc:0 "A unified economic zone between East and West Germany would be a huge step towards unification, if it succeeds. We should do our best to ensure that it does!"
 GDR_The_New_Course:0 "The New Course"
 GDR_The_New_Course_desc:0 "The German Democratic Republic is headed in a new direction; one that will lead us to peace and prosperity for decades to come!"
 GDR_Purge_the_Ulbricht_Group:0 "Purge the Ulbricht Group"
 GDR_Purge_the_Ulbricht_Group_desc:0 "Ulbricht's followers still hold considerable influence over the government. They must be dealt with."
 GDR_Dismantle_the_Personality_Cult:0 "Dismantle the Personality Cult"
 GDR_Dismantle_the_Personality_Cult_desc:0 "Cults of personality are unbecoming of socialist countries. The one that has been propagated here must be dismantled immediately."
 GDR_Reverse_Course_on_Clerical_Persecution:0 "Reverse the Clerical Persecutions"
 GDR_Reverse_Course_on_Clerical_Persecution_desc:0 "The overzealous persecution and vilification of the clergy has caused more harm than good to the country, it is clear we need to deescalate our efforts."
 GDR_Institute_Collective_Leadership:0 "Institute Collective Leadership"
 GDR_Institute_Collective_Leadership_desc:0 "The GDR is ready to adopt collective leadership and abolish the one-party state. In time, the German system will become a model for other socialist countries!"
 GDR_Reign_in_the_Stasi:0 "Reign in the Stasi"
 GDR_Reign_in_the_Stasi_desc:0 "The Stasi's overreach can no longer be ignored; if the people are too afraid to live, they cannot work properly. We must correct this."
 GDR_Dissolve_the_Secretariat:0 "Dissolve the Secretariat"
 GDR_Dissolve_the_Secretariat_desc:0 "With collective leadership formally adopted, there is no longer a need for the secretariat."
 GDR_Apply_to_Join_the_ECSC:0 "Apply to Join the ECSC"
 GDR_Apply_to_Join_the_ECSC_desc:0 "We will make clear to the West our intentions for peaceful cooperation by extending a formal application into the European Coal and Steel Community."
 GDR_Bridging_the_Divide:0 "Bridging the Divide"
 GDR_Bridging_the_Divide_desc:0 "As we pursue closer ties with the West, we also wish to make clear our intention to reunify with our West German brothers. The first step is to ease tensions between our two governments and plan for long-term cooperation."
