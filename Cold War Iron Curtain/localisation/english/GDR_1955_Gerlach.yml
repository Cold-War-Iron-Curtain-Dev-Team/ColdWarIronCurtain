l_english: 

 GDR_Prime_Minister_Gerlach:0 "Prime Minister Gerlach"
 GDR_Prime_Minister_Gerlach_desc:0 "Manfred Gerlach has acquired leadership of the GDR; it is time to formally recognize him as our new Prime Minister."
 GDR_A_Trip_to_Moscow_Gerlach:0 "A Trip to Moscow"
 GDR_A_Trip_to_Moscow_Gerlach_desc:0 "A state visit to Moscow will help legitimize the new administration and ease Soviet fears of any radical changes in our foreign policy."
 GDR_Establish_a_Commission_for_Legal_Reform:0 "Establish a Commission for Legal Reform"
 GDR_Establish_a_Commission_for_Legal_Reform_desc:0 "We can no longer deny the need for reform. A state commission will be established to investigate and propose new legislation that will help the GDR move forward."
 GDR_Reform_the_Education_System:0 "Reform the Education System"
 GDR_Reform_the_Education_System_desc:0 "Our education system is overly propagandized and ineffectual; our schools are for education, not indoctrination."
 GDR_Seek_to_Undercut_NDPD_Middle_Class_Support:0 "Seek to Undercut NDPD Support"
 GDR_Seek_to_Undercut_NDPD_Middle_Class_Support_desc:0 "The NDPD is very popular among the middle class. If we can win over their supporters, the party will all but collapse."
 GDR_Reaffirm_Freedom_of_Religion:0 "Reaffirm Freedom of Religion"
 GDR_Reaffirm_Freedom_of_Religion_desc:0 "Any modern state, socialist or not, must guarantee the freedom of its people to worship as they see fit. We will be no different."
 GDR_Guarantee_Press_Freedoms:0 "Guarantee Press Freedoms"
 GDR_Guarantee_Press_Freedoms_desc:0 "The press must be allowed to report and circulate freely. To impede this both anti-democratic and anti-socialist."
 GDR_Allow_Independent_Labor_Unions:0 "Allow Independent Labor Unions"
 GDR_Allow_Independent_Labor_Unions_desc:0 "We will allow the unions to operate outside of the government's control. We need not oversee every detail of the workers' organization."
 GDR_Propose_Revised_COMECON_Trade_Deals:0 "Propose Revised COMECON Trade Deals"
 GDR_Propose_Revised_COMECON_Trade_Deals_desc:0 "Most of our deals with COMECON are unfairly one-sided. If we are to trade, it must be as equals."
 GDR_Support_Neutralist_West_German_Organizations:0 "Support Neutralist West German Organizations"
 GDR_Support_Neutralist_West_German_Organizations_desc:0 "There exist factions in West Germany that seek a neutral, non-committed foreign outlook. Perhaps we can find common ground with them?"
 GDR_Outreach_to_the_FDP:0 "Outreach to the FDP"
 GDR_Outreach_to_the_FDP_desc:0 "There are some members within the Free Democratic Party whose ideas align with ours, perhaps we can form a coalition with them?"
 GDR_A_New_Economic_Reality:0 "A New Economic Reality"
 GDR_A_New_Economic_Reality_desc:0 "Our reforms have led to a steady increase in productivity, let's make sure the trend continues in the right direction."
 GDR_Break_Up_Handelsorganisation:0 "Break Up Handelsorganisation"
 GDR_Break_Up_Handelsorganisation_desc:0 "The Trading Organization has become too large, nearly having a monopoly on every good the German consumer can buy. It needs to be broken up."
 GDR_Allow_Private_Financial_Institutions:0 "Allow Private Financial Institutions"
 GDR_Allow_Private_Financial_Institutions_desc:0 "The next step in our financial reforms is the introduction of private financial institutions. Hardliners will be outraged, but this is necessary to ensure our continued prosperity."
 GDR_A_New_Dawn_for_the_Republic:0 "A New Dawn for the Republic"
 GDR_A_New_Dawn_for_the_Republic_desc:0 "Our reforms have proven that the free market can function inside a socialist country. It is a new dawn for our Republic and indeed, the socialist world."
 GDR_Privitize_the_Volkseigener_Betrieb:0 "Privitize the Volkseigener Betrieb"
 GDR_Privitize_the_Volkseigener_Betrieb_desc:0 "The Publicly Owned Enterprises are limited in their ability to further the economic development of Germany. Privatizing them should mitigate this."
 GDR_Increase_Support_for_Displaced_Farmers:0 "Increase Support for Displaced Farmers"
 GDR_Increase_Support_for_Displaced_Farmers_desc:0 "Much of our rural population has been left displaced and unemployed after the War and rapid industrialization of our country in the years following it. We need to further their aid."
 GDR_Slash_Taxes:0 "Slash Taxes"
 GDR_Slash_Taxes_desc:0 "The high tax burden leaves our people with very little spending cash. We should lower the tax rate so that they can enjoy the benefits of our liberalizing market."
