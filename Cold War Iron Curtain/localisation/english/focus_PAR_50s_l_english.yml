 PAR__reduce_argentina_dependence_desc:0 "Argentina is not well"
 PAR_create_bcp:0 "Create Banco Central del Paraguay"
 PAR_limit_heavy_arms:0 "Limit Police use of Heavy Weaponary"
 PAR_reform_ministeries:0 "Reform Ministeries"
 PAR_cultural_support:0 "Support Paraguayan Culture"
 PAR_mass_censorship_desc:0 "Replace editors and stuff with loyals"
 PAR_reassign_mendez:0 "Reassign Epifanio Méndez as BCP Leader"
 PAR_declare_state_of_siege:0 "Declare State of Siege"
 PAR_declare_state_of_siege_desc:0 "Renewed every 3 motnhs till end of rule"
 PAR_constitution_stuff_desc:0 "Begin changing laws to keep stoesnner"
 PAR_keep_eye_on_guion_rojo:0 "Keep Eye on Guión Rojo"
 PAR_keep_eye_on_guion_rojo_desc:0 "PAR_keep_eye_on_guion_rojo_desc"
 PAR_offer_aid_to_korea:0 "Offer Aid to South Korea"
 PAR_expand_py_nandi:0 "Expand Py Nandi"
 PAR_media_takeover:0 "PAR_media_takeover"
 PAR_pave_way_for_strossner:0 "Talks Between Military and ANR"
 PAR_place_blame_desc:0 "The document alluded to the ANR expressed among the remote antecedents of the May 54 coup that Chaves tried to subvert the order within the party. Likewise, it harshly attacked Lieutenant Colonel Néstor Ferreira, who, holding the high military position of commander of the Cavalry Division, had "direct interference" in the party politics of Luque. "
 PAR_may_decree:0 "Decreto del 20 de mayo de 1954"
 PAR_may_decree_desc:0 "By Decree of May 20, 1954, the Argentine government returned to Paraguay the weapons and insignias obtained during the War against the Triple Alliance, with the aim of strengthening diplomatic ties between the two countries."
 PAR_establish_us_support:0 "Establish Preliminary Relations With USA"
 PAR_establish_us_support_desc:0 "Start gaining us support, maybe allow epfenistast funding instead?"
 PAR_take_over_guion_rojo:0 "Take Over Guión Rojo"
 PAR_light_industry:0 "Expand Light Manufacturing"
 PAR_invest_agraculture:0 "Farmers' Assistance Project"
 PAR_anti_soviet_action:0 "Anti-Soviet Action"
 PAR_mendez_coup_desc:0 "The overthrow of Perón in September 1955 was a severe blow to Méndez Fleitas. Overnight, strong Argentine support for his faction within the party was replaced by strong Argentine pressure against him. Although he had organized the REENCUENTRO of 27 October 1955 in order to unite the "Partido Colorado" against Stroessner, the latter was now able to use the event to strengthen his own support within the party. "
 PAR_assign_ynsfran:0 "Assign Edgar Ynsfrán as Interior Minister"
 PAR_control_media:0 "Tighten Grip on Press and Media"
 PAR_party_unity_two:0 "Secure Party Loyality"
 PAR_party_unity_two_desc:0 "With the recent ousting of the Epifenista threat, President Stroessner recognizes the imperative of solidifying loyalty within the ranks of the party. In the aftermath of the attempted coup, dissenting voices must be silenced, and unwavering allegiance to the regime must be ensured."
 PAR_1958_elections:0 "1958 General Elections"
 PAR_foreign_oil_companies_desc:0 "Esso and Shell both want to invest"
 PAR_take_over_guion_rojo_desc:0 "Or make em ally against stoesnner?"
 PAR_imporve_brazilian_relations:0 "Improve Brazilian Relations"
 PAR_army_friends:0 "Reward Friends In Army"
 PAR_army_friends_desc:0 "Corruption for army"
 PAR_strike_chavez_supporters:0 "Strike Chavez Supporters"
 PAR_strike_chavez_supporters_desc:0 "With the recent ousting of the Epifenista threat, President Stroessner recognizes the imperative of solidifying loyalty within the ranks of the party. In the aftermath of the attempted coup, dissenting voices must be silenced, and unwavering allegiance to the regime must be ensured."
 PAR_ramp_up_anti_communism:0 "Ramp Up Anti-Communist Action"
 PAR_austerity_measures:0 "Programa de Austeridad"
 PAR_austerity_measures_desc:0 "The economy was in bad shape and deteriorating further, with inflation growing. His economic austerity measures proved unpopular with the nation's military officers, who had long grown used to getting soft loans from the Central Bank; with fiscally dodgy businessmen, who disliked the severe tightening of credit."
 PAR_american_loans:0 "Secure American Loans"
 PAR_west_german_ties:0 "West German Assistance?"
 PAR_1958_elections_desc:0 "GetLeader won elections"
 PAR_woo_rural_pop:0 "Agrarian Outreach Program"
 PAR_woo_rural_pop_desc:0 "With the heartland's allegiance crucial to regime's stability, President Stroessner has come up with Programa de divulgación agraria. By courting the traditional rural oligarchy, dominated by latifundistas of Liberal persuasion, Stroessner aims to secure their support through targeted agricultural reforms and infrastructure investment."
 PAR_jungle_camps:0 "Remote Detainment Project"
 PAR_jungle_camps_desc:0 " With growing numbers of dissenters posing a threat to the regime's stability, it becomes imperative to expand the network of jungle internment camps. These camps, hidden deep within the dense foliage, serve as a means to quell opposition and maintain control. Under the guise of national security, individuals deemed a threat to the regime are interned, ensuring that dissent remains silenced and loyalty to the regime enforced."
 PAR_brazil_paraguay_commission:0 "Comisión Mixta Paraguayo-Brasileña"
 PAR_brazil_paraguay_commission_desc:0 "The Comisión Mixta Paraguayo-Brasileña has been instrumental in defining and demarcating the border between Paraguay and Brazil since its establishment by the Protocol of Instructions of 1930. This joint commission has worked diligently to delimit, demarcate, and characterize our shared boundaries, ensuring clarity and cooperation between our nations.By strengthening this commission, we aim to enhance bilateral relations, facilitate cross-border infrastructure projects, and promote regional stability"
 PAR_dnat:0 "Dirección Nacional de Asuntos Técnicos"
 PAR_repress_students:0 "Academic Suppression"
 PAR_repress_students_desc:0 "Operating under the pretext of anti-communism, the regime targets students and intellectuals suspected of harboring subversive ideologies. Through surveillance, intimidation, and censorship, the regime aims to eradicate intellectual dissent and ensure unwavering loyalty to the regime's ideology."
 PAR_expand_party_media:0 "Expand Party Media"
 PAR_expand_party_media_desc:0 " the extensive party media, including the daily newspaper Patria and the radio program "La Voz del Coloradismo," promoted the government's view of national and international events. In addition, the party employed its ancillary organizations, which included professional associations, veterans' groups, women's federations, peasants' groups, cultural societies, and students' clubs, to maintain contact with virtually all sectors in the country. "
 PAR_genral_strike_58:0 "Huelga General"
 PAR_genral_strike_58_desc:0 "The strike was called by the Confederación Paraguaya de Trabajadores (CPT; 'Paraguayan Workers' Confederation'), with demand such as a 30% raise in salaries, a general declaration of amnesty, a lifting of the state of emergency, a more equitable economic policy, securing the freedom to participate in political and trade union activities and the holding of a constituent assembly"
 PAR_repress_some_more:0 "Electoral Dissent Crackdown"
 PAR_repress_some_more_desc:0 "Following the controversial 1958 elections, President Stroessner reacts swiftly to suppress opposition dissent. Despite claims of victory, discontent simmers among those who contest the legitimacy of the electoral process."
 PAR_arrest_strike_leaders:0 "Strike The Strikers"
 PAR_seize_cpt:0 "Seize Control of CPT"
 PAR_attempt_negotations:0 "Caught By Suprise"
 PAR_attempt_negotations_desc:0 "offering the CPT a 15% salary raise, an offer that the four-member strike committee rejected. Then supress them."
 PAR_increase_law_enforcment_budget:0 "Increase Law Enforcment Budget"
 PAR_increase_law_enforcment_budget_desc:0 "All in name of Anti-communism."
 PAR_usa_counterins:0 "Counter-Insurgency Training"
 PAR_usa_counterins_desc:0 "United States military aid was helping enhance the army's skills in counterinsurgency warfare"
 PAR_mengle:0 "Grant Mengle Citizenship"
 PAR_liberal_59:0 "Liberalization of 1959"
 PAR_liberal_59_desc:0 "In April 1959 the state of siege was lifted, opposition exiles allowed to return, press censorship ended, political prisoners freed, and a new Constitution promised to replace the authoritarian 1940 Constitution."
 PAR_rural_help:0 "Secure Rural Support"
 PAR_promulgate_new_constituion:0 "The 1959 Constitution"
 PAR_promulgate_new_constituion_desc:0 "Start making it. Never happens."
 PAR_capital_student_riot:0 "Asunción Student Riots"
 PAR_dissolve_parlament:0 "Dissolve The Parlament"
 PAR_reintroduce_sog:0 "Reverse Liberalization Course"
 PAR_strike_stoessner:0 "Revuelta Unitaria"
 PAR_strike_stoessner_desc:0 "Despite Stroessner's attempts to maintain his grip on power, Epifanio Méndez has defied the odds, successfully uniting both the party and military against him. In a remarkable turn of events, Méndez's leadership has bridged the longstanding divide between these two pillars of Paraguayan authority, forging a formidable coalition aimed squarely at toppling Stroessner."
 PAR_invest_in_public_works:0 "Invest In Public Works"
 PAR_control_food_prices:0 "Restrict Beef Prices"
 PAR_grant_peron_stay:0 "Allow Perón to Stay"
 PAR_improve_argentina_ties:0 "Improve Ties With Argentina"
 PAR_promote_fredesvinda:0 "Empowering Fredesvinda"
 PAR_promote_fredesvinda_desc:0 "Inspired by the political maneuvers of Perón, Epifanio Méndez takes a bold step by promoting his wife, Doña Fredesvinda Vall, to a prominent and influential position within the government. In a move reminiscent of Perón's elevation of Eva Perón, Méndez recognizes the potential of his spouse as a powerful ally and symbol of popular support."
 PAR_relax_media:0 "Relax Media Censorship"
 PAR_support_peronistas:0 "Support Peronistas in Argentina"
 PAR_promote_paraguyan_music:0 "Promote Paraguayan Culture To the World"
 PAR_end_death_squads:0 "Dissolve Escuadrón de la muerte"
 PAR_strike_against_corruption:0 "Strike Against Corruption"
 PAR_simplify_trade_with_argentina:0 "Simplify Trading With Argentina"
 PAR_improve_argentina_ties_desc:0 "Peron Stays"
 PAR_grant_peron_stay_desc:0 "Peron is gone"
 PAR_peoples_welfare:0 "Community Healthcare Program"
 PAR_control_food_prices_desc:0 "Unpopular with large traditional racnhers, popualr with small scale farmers"
 PAR_union_rights:0 "Relax Restrictions on Trade Unions"
 PAR_end_guion_rojo:0 "Dissolve The Guión Rojo"
 PAR_end_guion_rojo_desc:0 "In response to the persistent challenge posed by the Guión Rojo militia, we must enact decisive measures to eliminate this threat to national stability."
 PAR_native_rights:0 "Indigenous Equality Agenda"
 PAR_native_rights_desc:0 "Recognizing the historical marginalization of Paraguay's indigenous communities, President Méndez embarks on a transformative journey to elevate their status within the nation. Inspired by the precedent set by Perón in Argentina, Méndez initiates a series of sweeping reforms aimed at enhancing the rights and opportunities available to indigenous peoples. Through comprehensive legislative measures and targeted socio-economic initiatives, Méndez seeks to empower indigenous communities, granting them greater autonomy, representation, and access to resources"
 PAR_copacar:0 "Expand COPACAR"
 PAR_copacar_desc:0 "In a bid to bolster Paraguay's agricultural sector and uplift small landholders, President Méndez unveils plans to expand the Corporación Paraguaya de Carnes (COPACAR). Recognizing the monopolistic hold COPACAR has on the meat-trading market, Méndez aims to harness its influence to support minifundistas and other small landholders. Through targeted investments and regulatory measures, Méndez seeks to empower these stakeholders, providing them with greater access to markets and resources"
 PAR_education_increase:0 "Invest In Education"
 PAR_end_one_party_state:0 "Lift Ban on Political Parties"
 PAR_58_elec_epif:0 "1958 Elections"
 PAR_anc_victory:0 "Méndez Re-elected"
 PAR_anc_victory_desc:0 "Under Epifanio"
 PAR_liberal_party:0 "Partido Liberal"
 PAR_liberal_party_desc:0 "  Ernesto Gavilán"
 PER_febrerista:0 "Partido Revolucionario Febrerista"
 PAR_expel_nazis:0 "Anti-Fascist Campaign"
 PAR_bolvian_relations:0 "Recouncil With Bolivia"
 PAR_replace_old_officers:0 "Replace Old Generals"
 PAR_replace_old_officers_desc:0 "After becoming President he retired many of the older generals - especially committed Colorados whose loyalty was primarily to the party."
 PAR_expel_nazis_desc:0 "Unlike Stroessner, we don't accomidate fascists."
 PAR_south_american_trade:0 ""
 PAR_purge_remaining_stroessnerists:0 "Purge Remaining Stroessnerists"
 PAR_purge_remaining_stroessnerists_desc:0 "DOestna ctually work, leads to end of party"
 PAR_icnreased_state_managment:0 "Increase Goverment Oversight on Companies"
 PAR_anticommunism:0 "Assure Our American Friends"
