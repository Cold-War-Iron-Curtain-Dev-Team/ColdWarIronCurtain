 PAR_conspire_stoessner_out_desc:0 "Party and Mendez make deal to repalce Stoessner with Justo Pastor Benítez"
 PAR_exile_mendez:0 "Send Méndez to Exile"
 PAR_secure_rule:0 "Clean Party From Epfenistas"
 PAR_rally_supporters:0 "Rally Supporters from Party"
 PAR_tear_colorado_down:0 "Tear Colorado Down"
 PAR_tear_colorado_down_desc:0 "Partido Nacionalista Revolucionario"
