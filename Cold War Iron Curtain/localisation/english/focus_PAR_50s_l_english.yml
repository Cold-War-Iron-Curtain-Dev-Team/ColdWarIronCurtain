 PAR_nis_desc:0 "With the economy expanding, Peña seeks to formalize state-supported industrial syndicates, creating a government-led framework to regulate and control private industries while maintaining efficiency"
 PAR_future_of_paraguay:0 "The Future of Paraguay"
 PAR_future_of_paraguay_desc:0 "As the decade comes to an end, President Peña’s government stands at a crossroads. Paraguay has seen years of controlled growth and stability, but questions remain about the nation's long-term direction. Will Paraguay continue along its current path of controlled state development, or is a deeper transformation necessary?"
 PAR_encorage_education:0 "Further Education Reforms"
 PAR_encorage_education_desc:0 "Despite our work, more needs to be done."
 PAR_establish_own_party:0 "Establish Frente Nacional de Orden"
 PAR_ynsfran_purge:0 "Purge the Military of Disloyal Elements"
 PAR_ynsfran_purge_desc:0 "Though the military helped Ynsfrán take power, not all officers are fully loyal to his rule. A sweeping purge is ordered to remove any elements that could challenge his authority."
 PAR_purge_everyone_else:0 "A Paraguay Without Enemies"
 PAR_purge_everyone_else_desc:0 "All political opposition, from communists to moderate conservatives, is systematically eliminated. The newly established secret police launch a wave of arrests, disappearances, and executions to ensure no dissent remains."
 PAR_fortress_against_communism:0 "A Fortress Against Communism"
 PAR_fortress_against_communism_desc:0 "Paraguay positions itself as Latin America’s strongest anti-communist regime, aligning fully with U.S. interests in the Cold War. Ynsfrán offers Paraguay as a base for anti-Soviet intelligence operations."
 PAR_welcome_exiled_allies:0 "Welcoming Exiled Allies"
 PAR_welcome_exiled_allies_desc:0 "Paraguay becomes a haven for exiled fascists and former SS officers. These figures, seeing Ynsfrán as a fellow traveler, offer their financial resources and expertise to strengthen the state’s intelligence apparatus."
 PAR_militarize_economy:0 "Militarization of the Economy"
 PAR_militarize_economy_desc:0 "Under Ynsfrán’s rule, Paraguay’s economic policies shift towards full militarization. Factories are placed under military control, and all industrial planning is aligned with national security needs."
