l_english:
 # ============================================================================
 #  THE GREEK QUESTION - Greek Civil War side branch (SOV / Stalin tree)
 #  Two mutually exclusive arms, chosen at sov_percentage_agreement.1.
 # ============================================================================

 # ---- Events ----
 sov_greek_question.1.t:0 "Moscow Abandons the Greek Communists"
 sov_greek_question.1.d:0 "The Democratic Army of Greece has been destroyed on the Grammos and Vitsi ridges, and the Soviet Union did not lift a finger to prevent it.\n\nThis was not neglect. Comrade Stalin gave his answer to the Greek question in a Moscow drawing room in October 1944, when he looked at a sheet of paper on which Britain was assigned ninety per cent of Greece, and ticked it. Everything since has followed from that tick.\n\nThe KKE fought for four years believing the socialist camp stood behind them. It did not, and the party's survivors are now discovering what a percentage on a scrap of paper is worth."
 sov_greek_question.1.a:0 "Greece was never ours to win."

 sov_greek_question.2.t:0 "Moscow and Athens Exchange Ambassadors"
 sov_greek_question.2.d:0 "For the first time since the civil war, there are Soviet diplomats in Athens and Greek diplomats in Moscow.\n\nThe Greek government has spent four years describing the Soviet Union as the author of its national catastrophe, and much of the Greek public still does. But Greece is a small country with a ruined economy and a large neighbour, and the Foreign Ministry on Vasilissis Sofias has concluded that permanent hostility is a luxury it cannot afford."
 sov_greek_question.2.a:0 "Even enemies keep embassies."

 sov_greek_question.3.t:0 "The Cyprus Question"
 sov_greek_question.3.d:0 "Greece has taken the Cyprus dispute to the United Nations, and in doing so has set itself against Britain, against Turkey, and against the alliance that all three belong to.\n\nMoscow's position requires no cynicism to state and considerable cynicism to hold: we support the right of the Cypriot people to self-determination. That this happens to drive a wedge between three NATO members in the eastern Mediterranean is a coincidence we intend to make the most of."
 sov_greek_question.3.a:0 "Let the alliance argue with itself."

 sov_greek_question.4.t:0 "A People's Republic in Greece"
 sov_greek_question.4.d:0 "The Democratic Army has taken Athens. The monarchy has fled, the government with it, and for the first time a communist state stands on the Mediterranean with its own ports and its own fleet anchorages.\n\nThe strategic consequence is difficult to overstate. The eastern Mediterranean, which the British have treated as an imperial lake since Nelson, now has a Soviet-aligned power sitting on its northern shore. Turkey is flanked. The Sixth Fleet has lost its northern approaches.\n\nWinston Churchill's percentages are not merely broken. They are being read out in Athens as evidence of what the West was willing to trade away."
 sov_greek_question.4.a:0 "The Mediterranean is no longer their lake."

 sov_greek_question.5.t:0 "The Greek Adventure Collapses"
 sov_greek_question.5.d:0 "The Democratic Army is finished. What is left of it has crossed into Albania and Bulgaria, or surrendered, or been shot.\n\nMoscow gambled openly and lost openly. Every neutral capital that was weighing the balance in the eastern Mediterranean has now watched the Soviet Union commit itself to a client and fail to save it. Athens is in the Western camp permanently, the Americans have their bases, and the whole southern flank is worse than it was before we started.\n\nAnd the retreating remnants have carried the war north with them. Albania is next."
 sov_greek_question.5.a:0 "A defeat we chose."

 sov_greek_question.6.t:0 "Holding the Albanian Line"
 sov_greek_question.6.d:0 "The counter-revolution in Albania was assembled in Athens and London out of the wreckage of the Greek war, and it is being run by men who have just watched the Soviet Union lose one client and are betting it will lose another.\n\nComrade Hoxha's regime is isolated, surrounded, and entirely dependent on what arrives by sea from Odessa. Whatever the Presidium thinks of him privately, Albania cannot be allowed to fall on the same argument that lost us Greece.\n\nThe supplies are moving. This time we are not going to fold."
 sov_greek_question.6.a:0 "Not twice."

 # ---- Focuses: historical arm ----
 SOV_gpa_honour_the_agreement:0 "Honour the Percentage Agreement"
 SOV_gpa_honour_the_agreement_desc:0 "In October 1944 Churchill wrote out the Balkans on a half-sheet of paper — Romania ninety per cent ours, Greece ninety per cent theirs — and Comrade Stalin marked it with a blue tick and pushed it back across the table.\n\nWhatever the KKE believes it was promised, that tick is Soviet policy. The Greek communists will fight and lose without us, and the Soviet Union will gain a reputation in the West for keeping bargains that will be worth considerably more than Greece."
 SOV_gpa_honour_the_agreement_tt:0 "The Greek question is settled on Western terms. Gain §Ystability§! and reduce world tension."

 SOV_gpa_abandon_the_kke:0 "Abandon the KKE"
 SOV_gpa_abandon_the_kke_desc:0 "The Democratic Army is asking for weapons, recognition and a Soviet voice at the United Nations. It will receive none of them.\n\nThe order goes out through the Cominform: no arms, no diplomatic cover, and pressure on Belgrade and Sofia to close the frontiers. Comrade Zachariadis will not be told that he has been written off. He will simply find that nothing arrives."
 SOV_gpa_abandon_the_kke_tt:0 "The Greek communists are cut loose. Relations with the §YPDG§! and §YYugoslavia§! deteriorate.\nWorld tension and Soviet foreign power projection fall."

 SOV_gpa_the_tashkent_exile:0 "The Tashkent Exile"
 SOV_gpa_the_tashkent_exile_desc:0 "Some fifty thousand fighters, cadres and their families have crossed the northern frontier ahead of the Greek army. They cannot stay in the Balkans and they cannot go home.\n\nThey will be resettled in Uzbekistan, at Tashkent, where the party leadership can be kept together, kept useful and kept a very long way from Greece. Some of them will spend the rest of their lives there."
 SOV_gpa_the_tashkent_exile_tt:0 "Greek communist exiles are resettled in Central Asia. Gain §Ymanpower§! and political power at a small cost to stability."

 SOV_gpa_deport_the_black_sea_greeks:0 "Deport the Black Sea Greeks"
 SOV_gpa_deport_the_black_sea_greeks_desc:0 "The Greek communities of the Black Sea coast have lived there since antiquity. The MGB has concluded that a population with kin on the wrong side of a hostile frontier is a population that cannot be trusted.\n\nOperation Volna will move them east — from the Crimea, the Kuban and the Caucasus littoral to Kazakhstan and Central Asia. The justification is security. The reasoning has not changed since the Chechens, the Tatars and the Volga Germans."

 SOV_gpa_restore_diplomatic_relations:0 "Restore Diplomatic Relations"
 SOV_gpa_restore_diplomatic_relations_desc:0 "With the civil war over and Comrade Stalin gone, there is no longer any reason for Moscow and Athens to pretend the other does not exist.\n\nAmbassadors will be exchanged and the propaganda war wound down. Greece will remain in NATO — that is not in question — but a Greece that talks to us is a Greece that can occasionally be persuaded to disagree with Washington."
 SOV_gpa_restore_diplomatic_relations_tt:0 "Ambassadors are exchanged with Greece. §YSoviet influence§! in Greece rises at American expense and world tension falls."

 SOV_gpa_the_trade_agreement:0 "The Soviet-Greek Trade Agreement"
 SOV_gpa_the_trade_agreement_desc:0 "Greece grows tobacco, currants and olives, and sells them to a Western Europe that grows most of the same things.\n\nThe Soviet Union does not, and can absorb the entire Greek surplus at prices no Western buyer will match. Every drachma of that trade is a Greek business with a reason to argue against economic warfare, and a Greek government with one more thing to lose."
 SOV_gpa_the_trade_agreement_tt:0 "Mutual §Ymarket access§! with Greece and a substantial budget gain."

 SOV_gpa_the_cyprus_question:0 "The Cyprus Question"
 SOV_gpa_the_cyprus_question_desc:0 "Cyprus is British, overwhelmingly Greek in population, and claimed by Athens. Turkey opposes union absolutely. All three are members of the same alliance.\n\nWe will support self-determination for Cyprus at the United Nations. The position is defensible on principle, popular in Greece, and calculated to set Athens against London and Ankara simultaneously. Occasionally the honest position and the useful one are the same position."
 SOV_gpa_the_cyprus_question_tt:0 "Greek relations with §YBritain§! and §YTurkey§! deteriorate sharply.\nCommunist popularity in Greece rises, as does Soviet foreign power projection."

 # ---- Focuses: intervention arm ----
 SOV_gci_intervene_in_greece:0 "Intervene in the Greek Civil War"
 SOV_gci_intervene_in_greece_desc:0 "The percentages were written on a scrap of paper by a man who no longer governs Britain, and there is a communist army in the field in Greece asking why the socialist motherland will not help it.\n\nThe answer, from today, is that it will. The Democratic Army will be recognised, armed and brought into our alliance system, and if that means Soviet divisions on the Aegean then so be it.\n\nThe Western reaction will be severe. It will also, if this works, come too late."
 SOV_gci_intervene_in_greece_tt:0 "Recognise and join the war on the side of the §YProvisional Democratic Government§!.\nThe PDG enters our faction and our sphere."

 SOV_gci_arm_the_democratic_army:0 "Arm the Democratic Army"
 SOV_gci_arm_the_democratic_army_desc:0 "The Democratic Army fights in the mountains with captured Italian rifles and whatever Tito can spare. It cannot take a city and it cannot hold a plain.\n\nThat changes now. Artillery, small arms, engineers and Soviet officers will move south through Bulgaria in quantity, and the guerrilla bands of the Grammos will be reorganised into something that can march on Athens."
 SOV_gci_arm_the_democratic_army_tt:0 "The PDG receives §Yequipment§!, §Ymanpower§! and §Yarmy experience§!.\nSoviet foreign power projection falls while the shipments continue."

 SOV_gci_a_peoples_republic_in_greece:0 "A People's Republic in Greece"
 SOV_gci_a_peoples_republic_in_greece_desc:0 "Athens has fallen and the Kingdom of Greece has ceased to exist.\n\nThe task now is to make the victory permanent: integrate the new republic into COMECON, rebuild what four years of civil war destroyed, and make certain that the government which emerges answers to Moscow rather than to Belgrade.\n\nFor the first time the socialist camp has a Mediterranean coastline."
 SOV_gci_a_peoples_republic_in_greece_tt:0 "Greece joins §YCOMECON§!. Large gain in political power and Soviet foreign power projection."

 SOV_gci_assist_greek_reconstruction:0 "Assist in Greek Reconstruction"
 SOV_gci_assist_greek_reconstruction_desc:0 "Greece has been at war almost continuously since 1940 — occupation, famine, resistance, and then four years of Greeks killing Greeks. The roads are gone, the ports are wrecked and a tenth of the population has been displaced.\n\nMoscow will pay for the rebuilding. It is expensive, and it is the price of the new republic being a going concern rather than a permanent liability."

 SOV_gci_military_bases_in_greece:0 "Establish Military Bases in Greece"
 SOV_gci_military_bases_in_greece_desc:0 "What Greece is worth is not its economy. It is the position.\n\nAirfields in Thessaly, radar on the islands and fleet access to the Aegean put Soviet aircraft within range of the Suez approaches and Soviet ships behind the Turkish Straits rather than in front of them. Every calculation the Royal Navy and the Sixth Fleet have made about the eastern Mediterranean since 1945 will have to be made again."

 SOV_gci_bosphorus_border_changes:0 "Push For Bosphorus Border Changes"
 SOV_gci_bosphorus_border_changes_desc:0 "With Greece secured and Turkey isolated, the question that has occupied Russian statesmen since Catherine can finally be reopened.\n\nThe Straits, the Armenian and Kurdish territories, and the Greek claims in Thrace and Anatolia are all on the table at once. Ankara can accept a settlement or it can face Greece, Bulgaria and the Soviet Union on three fronts with no alliance left to call on."

 SOV_gci_the_greek_defeat:0 "The Greek Defeat"
 SOV_gci_the_greek_defeat_desc:0 "The Democratic Army has been destroyed and the Provisional Democratic Government no longer exists.\n\nMoscow committed itself publicly, and publicly failed. The damage is not only in Greece: every government from Ankara to Rome has now seen what Soviet backing is worth when the Americans decide to contest it seriously.\n\nThere is no salvaging this. There is only limiting what it costs us next."
 SOV_gci_the_greek_defeat_tt:0 "The intervention has failed. Lose §Ystability§!, §Ywar support§! and a great deal of foreign power projection."

 SOV_gci_hold_the_albanian_line:0 "Hold the Albanian Line"
 SOV_gci_hold_the_albanian_line_desc:0 "The same networks that broke the Democratic Army have turned north. Albania is now fighting its own counter-revolution, armed and directed from outside, and Comrade Hoxha's regime is the most isolated in Europe.\n\nAlbania has no common frontier with the socialist camp. Everything it needs must come by sea, past a Mediterranean the Western navies control. It will come anyway."
 SOV_gci_hold_the_albanian_line_tt:0 "Requires §YAlbania to be at war with the royalists§!.\nAlbania receives equipment, manpower and stability, and volunteer allowance to Albania increases."

 SOV_gci_the_kke_in_exile:0 "The KKE in Exile"
 SOV_gci_the_kke_in_exile_desc:0 "What is left of the Greek party has crossed the northern frontiers — fighters, cadres, families, tens of thousands of them, with nothing but what they carried.\n\nThey will be resettled and the leadership kept intact. A party in exile is not much of an asset, but it is an asset, and Greece will hold elections again eventually."
 SOV_gci_the_kke_in_exile_tt:0 "Greek exiles are resettled. Gain §Ymanpower§!.\nCommunist popularity in Greece rises, but Athens will not forgive us."

 SOV_gci_rebuild_the_southern_flank:0 "Rebuild the Southern Flank"
 SOV_gci_rebuild_the_southern_flank_desc:0 "Greece is lost, Yugoslavia is hostile and Albania is barely holding. The southern approach to the socialist camp is the weakest frontier the Soviet Union has.\n\nBulgaria becomes the anchor. Garrisons, hardened airfields and a permanent Soviet military presence will make certain that whatever else the Western alliance attempts in the Balkans, it stops at the Danube."
 SOV_gci_rebuild_the_southern_flank_tt:0 "Relations with §YBulgaria§! and §YAlbania§! improve substantially.\nGain political power, stability and foreign power projection. Military policy hardens."

 # ---- Threats ----
 SOV_gpa_abandon_kke_threat:0 "Greece Abandoned"
 SOV_gpa_normalization_threat:0 "Soviet-Greek Normalization"
