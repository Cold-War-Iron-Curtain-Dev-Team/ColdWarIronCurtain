l_english:
 LIB_First_Civil_War.1.d:0 "Charles Taylor, a former government official under the Doe regime, was accused of embezzling government funds and promptly fled Liberia in 1983. He was imprisoned in the USA but managed to break out of his U.S. prison under mysterious circumstances. He later regrouped and united guerrillas in Côte d’Ivoire. Here, he formed the National Patriotic Front of Liberia (NPFL), intending to overthrow Doe. This is because Nimba County, in particular, the Liberian State, had committed atrocities against the local population for belonging to the same tribe as several ‘alleged’ coup leaders. His supporters sought a means of reprisal against the government. December 24, 1989, was the starting date for Taylor’s rebel group, NPLF, to invade Liberia. This marked the beginning maneuvers of the First Liberian Civil War, and the NPFL swiftly secured territory. Many of the Gio and Mano population associated with and advocated for Taylor’s rebellion. In a brutal reaction, the Liberian Army intentionally victimized civilians accused of providing support to the NPFL rebels. Simultaneously, Prince Johnson’s rebel organization, known as the Independent National Patriotic Front of Liberia (IPF), patrolled the streets of Monrovia and eventually executed Doe in September 1990."
 LIB_flcw_second_phase.1.d:0 "In August 1990, an alliance of West African nations under the organization of the Economic Community of West African States (ECOWAS) took the responsibility of providing a peacekeeping force into the streets of Monrovia. Without a chance for intervention by the United States or the United Nations, ECOMOG arrived in Liberia to separate the civil war’s factions and to stop the bloodshed. The West African countries that participated justified their intervention because it was no longer an internal Liberian-centric conflict. During the conflict, thousands of their own citizens were trapped in Liberia proper, and tens of thousands of refugees had escaped to neighboring countries. The ECOMOG mandate was to impose a cease-fire, help form an interim government, and hold elections within 12 months. The intervening combat forces, known as the Economic Community Cease-Fire Monitoring Group (ECOMOG). The ECOMOG, its stated goal of securing peace, remains just out of reach; however, stability provided by the intervention made headway in temporarily freezing some of the bloodshed and ethnic killing. Providing stability, it will be referenced as a model of African intervention even though it was claimed censored the press during the war."
 LIB_flcw_third_phase.1.d:0 "As the Liberian Civil War enters its second year, a new anti-NPFL faction has arisen in May 1991. United Liberation Movement of Liberia for Democracy (ULIMO), under a triumvirate of commanders, emerged from the  Krahn and Mandingo refugees and soldiers who had fought in the Armed Forces of Liberia (AFL). In the north, the organization established itself with new territory gained quickly. With the fighters originally from the Sierra Leone conflict with the pro-Taylor Revolutionary United Front (RUF), its season fighters take the brunt of hostilities directed a the NPFL. In the foreseeable future, it is unknown if the militia will away up into smaller constituents. They started with 20,000 fighters. In the same time period, INPFL and NPFL relations are strained as the true Anti-AFL leader and skirmishes have started between them."
 LIB_flcw_fourth_phase.1.d:0 "Emerging in 1993, George Boley commands the Liberian Peace Council (LPC) in southern Liberia. Considered a proxy force for the remaining Armed Forces of Liberia members, the 1500-man force contests with the NPFL for control. The rebels will likely descend into human rights violations and looting. So far, the Krahn community provides most of the manpower for this new faction. "
 LIB_flcw_npf_attack.1.d:0 "ECOMOG was forced into combat to push the NPFL out of Monrovia. On October 15, 1992, the NPFL assaulted Monrovia’s ECOMOG. This attack curtailed two years of an elusive peace, and Liberia descended back into war. Taylor brought a cadre of reinforcements to assault Monrovia itself. They were specially trained in camps located in Guinea. "
 LIB_Snap_Election.1.d:0 "Current Liberian President Edwin Barclay has unexpectantly died at age 73. Given it was so close to the previous election, the ex-Vice President, William Tolbert, squares off against Liberian UN ambassador Ellen Mills Scarbrough. The True Whig Party still has a legal stranglehold on election candidates. Tolbert, once placated to maintain stability, is making his move on the presidency. Scarbrough, a rising star within the True Whig Party, sees this as a new chance to administer popular national reforms. This would be the first woman elected to Liberian politics."
 LIB_Rig_Two.1.d:0 "For the first time since 1931, there competed more than one presidential candidate competed in the presidential election. In May 1955, general elections were conducted in Liberia. Predictably, William Tubman of the True Whig Party easily won re-election, securing suspiciously over 99.5% of the vote. Contending the election, former president Edwin Barclay asserted that ballot stuffing was due to the purported number of votes cast being higher than the number of registered voters. Edwin Barclay’s power base, the Independent True Whig Party (ITWP), was banned after an unsuccessful assassination attack and plot against William Tubman’s life."
 LIB_Rig_One.1.d:0 "On 1 May 1951, national general elections were conducted in Liberia. This is the first to be organized under universal suffrage. Only male descendants of Americo-Liberians had been allowed to vote before this particular election. In a first for Liberia, and based on a previous Constitutional Referendum, women and local property owners participated in voting. In the presidential election, William Tubman of the True Whig Party competed unopposed as the single and only candidate. Predictably, he was re-elected unopposed for a third term in succession as well. Didwho Welleh Twe, championed as a native opposition leader to challenge the Presidency of Tubman, deferred to the United States of America’s responsibility to oversee free and fair elections in Liberia. Tubman disqualified Didwho Welleh Twe with sedition charges, which discounted him from the race. Incumbent President William Tubman had maintained presidential authority since 1947. Tubman confirmed his oath in January 1952. For the first time, William Richard Tolbert Jr., confirmed as his vice president in what looks to be a political career of huge potential."
 LIB_Rig_Three.1.d:0 "In Liberia in May 1959, general national elections were conducted. In the presidential election, William Tubman of the True Whig Party was re-elected for a fourth term. This marked the loss of William O. Davies Bright, who didn’t even get over 55 votes as an independent candidate. All Liberian women can celebrate Ellen Mills Scarbrough. She was elected to a legislative seat in the Liberian House of Representatives as the first woman to win an elected position any time in Liberian history.  "
 LIB_Tubman_Attempt.1.d:0 "The peace was shocked by Paul Dunbar’s three revolver bullets intended for the Liberian President William Tubman in Monrovia, the capital, on June 22, 1955. The infamous date will be christened as Deliverance Day for now and into the future. Tubman was supposed to be reaffirmed of his electoral win from the last election. Most Americo-Liberians postulated this was due to Tubman’s agenda for national reforms and international cooperation with foreign businessmen. If he survives, Tubman promises a manhunt for the conspiracy’s ring leaders. William Tolbert is readying himself to take over as Vice President. It's likely that former president Edwin Barclay, a democratic opponent running against Tubman, will swing political power into his camp of followers. It can be considered by Liberian insiders as a bloodless political coup. Taking advantage of this disturbance, Barclay is using the event to decertify the rigged election results and demand a recount."
 LIB_Neighbor.1.d:0 "With a wave of anti-colonialism sweeping West Africa, Liberian foreign policy must be decided on. The majority think that being a good and peaceful neighbour is the most fruitful way to have good relations while advancing Liberian interests. This means less-than-lethal nation-building support. However, under the guise of anti-communism, some believe that Liberia must be a balancing and interventionist power in the African sphere of influence. Liberia will send everything, including troops, to facilitate this. Either way, change is gripping West Africa."
 LIB_Net.1.d:0 "The history of relations between the Netherlands and the Republic of Liberia begins in the 17th century. The relationship began in 1614, when the Dutch sailing vessel “White Dog” arrived on the Liberian coast.  In 1954, the Netherlands consulate in Liberia became a Consulate-General for the entirety of the West Africa region. The Netherlands' representation in Liberia was upgraded to the level of a Legation during that year. The 1956 state visit of the late President and Mrs. Tubman to the Netherlands accentuated friendly relations to continue and prosper between the two nations. A five-cent Liberian commemorative stamp was issued in the same year to honor and immortalize this visit."
 LIB_Free_Election_1959.1.d:0 "It is now possible with entrenched divisions within the True Whig Party that native opposition can realistically be elected in Liberia, provided that it is culturally ready. Expecting to make short work of opposition candidates, the True Whig Party has allowed America to certify ‘clean’ elections. Didwho Welleh Twe stands poised to represent native-interest without the shadow of Tubman's political power. He will be the first Liberian native to hold office. This is truly a monumental time to vote in the Liberian 1959 general elections."
 LIB_Renew_MTDP.1.d:0 "The question of furnishing Liberia some military assistance in the form of a very modest program of military aid, primarily through the provision of a limited number of instructor personnel to reorganize and train the Liberian military force for much-needed internal security. It should be noted that Liberia can now be made eligible to receive military equipment on a reimbursable basis under the provisions of the Mutual Defense Assistance Act of 1949. "
 LIB_Inclusion.1.d:0 "Today, Liberia elected its first native Liberian into the presidency, Didwho Welleh Twe. As a result, all Liberian citizens, whether they own property or not, are eligible to hold seats in the legislature and can run for fairly for president. The President of the United States has personally congratulated Didwho Welleh Twe for following a peaceful transition of power. New native legislatures favor the majority of Liberians rather than just the narrow self-interest of Americo-Liberians. It’s the beginning of a new era in Liberia. This day will be remembered."
 LIB_Doe_Civil_War.1.d:0 "Despite election rigging and electoral fraud, Samuel Doe will not back down in the face of overwhelming protest. Jackson Doe (unrelated), naming himself the people's elected representative, calls on Liberians to fight the National Democratic Party regime. Sameul Doe’s loyal Armed Forces of Liberia commanders hold the capital and are poised to strike at the uncoordinated Liberian Action Party and their affiliate defectors in a clash to decide who rules Liberia. AFL forces have already committed human rights abuses during Samuel Doe’s tenure, and they look like they will repeat reprisals if they are successful. The LAP must rally resistance and kick out the corrupt NDP once and for all."
 LIB_Election_1985.1.d:0 "On 15 October 1985, general elections were held in Liberia. These comprised the first general elections since Samuel Doe grasped an effective political monopoly following the 1980 military coup. In a referendum taking place in 1984, a new draft constitution was approved, which provided for a 58-member civilian and military Interim National Assembly, headed by Samuel Doe as president. For the election, the ban on political parties was lifted.  Doe's National Democratic Party (NDP), the Liberian Action Party, the Unity Party, and the Liberia Unification Party contested the elections. However, Smauel Doe has stated he would not vacate the Presidency peacefully if defeated. It is expected that election rigging will keep him in power."
 LIB_Thomas_Coup.1.d:0 "The 1985 Liberian coup d'état attempt was staged by General Thomas Quiwonkpa, who had been a leader of the 1980 coup along with President Samuel Doe and later founder of the National Patriotic Front of Liberia (NPFL). On 12 November 1985, one month after elections were held, Quiwonkpa, supported by about two dozen heavily armed men, covertly entered Liberia through Sierra Leone and launched a coup against Doe. Samuel Doe also announced in a radio and television broadcast that anyone found on the streets after a 6 p.m. curfew would be considered a rebel and executed immediately."
 LIB_Samuel_Coup.1.d:0 "In a stunning turn of events, Samuel Doe, a former soldier, led a military coup in Liberia on April 12, 1980, overthrowing the government of President William Tolbert. The coup, which unfolded in the early hours of the morning, saw Doe and his followers storm the presidential palace, leading to Tolbert's brutal assassination. The coup marks the end of nearly 133 years of Americo-Liberian rule, with Doe, a member of the country's indigenous group, now taking control of the government. The country is left in shock and uncertainty as Liberia enters a new, unpredictable era under military rule."
 LIB_Doe_Propaganda.1.d:0 "Sameul Doe has employed various works building a legitimacy of his rule through dubious use of propaganda. These highlight him as a man of the people who reforms the state for the common Liberians' benefit. In reality, the pilfering of state finances and censorship of the media have already begun."
 LIB_NCC_Draft.1.d:0 "The National Constitution Committee (NCC) began the mechanism of writing the 1986 constitution on April 12, 1981. A 25-member body, of which Dr. Amos Sawyer was appointed chairman, began the process of drafting a new constitution for Liberia. Under Doe, the Liberian 1847 Constitution was disengaged and suspended following Doe’s successful coup against President William Tolbert, Jr. The People's Redemption Council (PRC) concluded its draft of the Constitution in 1983. The PRC appointed the responsibility of inspecting the document to a 59-member Constitutional Advisory Committee (CAA). After a national referendum on July 3, 1984 accepted it, the Constitution came into effective service on January 6, 1986."

###LIB Leader desc
LIB_Tubman_desc:0 "William Vacanarat Shadrach Tubman, popularly known as 'The Father of Modern Liberia' by his supporters, is a semi-controversial figure. Born on the 29th of November, 1895, he lived in poverty just like all Liberians did back then. When he was 15, he decided to join the army and participated in several military operations across the country. During his service, he was promoted from a private to an officer. His original plan was to become a preacher and pastor at the age of 19. However, he soon changed his plans and studied for the bar exam under various tutors. He eventually passed and became a lawyer in 1917. He worked several jobs; a recorder, a tax collector, a teacher, and returned to the military at one point as a colonel. He then made his entry into politics. Joining the dominant True Whig Party and became the youngest senator. During his term, he fought for the constitutional rights of Indigenous people who made up 80% of Liberia's population. Upon his reelection, he became a personal advisor to President Allen Yancy. Becoming a powerful figure in Liberian politics. President Edwin Barclay appointed him to the Supreme Court to distract him from seeking the presidency. Nevertheless, a successor for Barclay had to be selected. William Tubman was the favorite. He took the oath on the 3rd of January, 1944. This was a difficult decision for Tubman. All of Liberia's doctors were German. And they had significant rubber exports to them. Despite this, to be on the right side of history, Liberia declared war on Germany and Japan on January 27th, 1944. They expelled all German citizens and cut the rubber imports to the defeated nation until rekindling exports during the Cold War to West Germany. Willian Tubman is now ready to implement his vision for Liberia. He has drastic plans for an era of prosperity for all Liberians. He is ready to reform Economic and Foreign policy initiatives. He also hopes to improve the lives of natives, although it may be difficult for him."
