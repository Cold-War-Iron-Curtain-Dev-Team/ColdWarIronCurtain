 LIB_Election_1985.1.d:0 "On 15 October 1985, general elections were held in Liberia. These comprised the first general elections since Samuel Doe grasped into power following the 1980 military coup. In a referendum during 1984, a new draft constitution was approved, which provided for a 58-member civilian and military Interim National Assembly, headed by Samuel Doe as president. For the election the ban on political parties was lifted.  Doe's National Democratic Party (NDP), the Liberian Action Party, the Unity Party, and the Liberia Unification Party contested the elections. However, Smauel Doe has stated he would not vacate the Presidency peacefully if defeated. It is expected that election rigging will keep him in power."
 LIB_Thomas_Coup.1.d:0 " "
 LIB_Samuel_Coup.1.d:0 "In a stunning turn of events, Samuel Doe, a former soldier, led a military coup in Liberia on April 12, 1980, overthrowing the government of President William Tolbert. The coup, which unfolded in the early hours of the morning, saw Doe and his followers storm the presidential palace, leading to Tolbert's brutal assassination. The coup marks the end of nearly 133 years of Americo-Liberian rule, with Doe, a member of the country's indigenous group, now taking control of the government. The country is left in shock and uncertainty as Liberia enters a new, unpredictable era under military rule."
