l_english: 

 GDR_First_Secretary_Reimann: "First Secretary Reimann"
 GDR_First_Secretary_Reimann_desc: "Max Reimann has managed to wrestle leadership of the GDR from Walter Ulbricht; it is time to formally recognize him as our new First Secretary."
 GDR_The_True_Leader_of_Deutschland: "The True Leader of Deutschland"
 GDR_The_True_Leader_of_Deutschland_desc: "Reimann has proven that he is the only hope we have of uniting Germany and saving our country from falling back into fascism. He is the leader we need."
 GDR_The_Unification_of_Berlin: "The Unification of Berlin"
 GDR_The_Unification_of_Berlin_desc: "We will not stand to see the fascist banner wave over Berlin again; we have no choice but to reunite the city by force!"
 GDR_Integrate_the_West_Berlin_Economy: "Integrate the West Berlin Economy"
 GDR_Integrate_the_West_Berlin_Economy_desc: "West Berlin's economy is quite different from ours; it will take some time and effort to fully integrate it into our system. "
 GDR_Decry_the_Fascist_Takeover_of_West_Germany: "Decry the Fascist Takeover of West Germany"
 GDR_Decry_the_Fascist_Takeover_of_West_Germany_desc: "The West's lack of action against the emergent fascist government in West Germany can only be interpreted as an endorsement. Has the world learned nothing since 1945?"
 GDR_Offer_Relocation_Assistance_to_Western_Leftists: "Offer Relocation to Western Leftists"
 GDR_Offer_Relocation_Assistance_to_Western_Leftists_desc: "Many liberal and leftist elements from West Germany have begun to flee the country out of fear of an impending crackdown from the fascists. We should offer them sanctuary."
 GDR_Establish_Refugee_Camps_for_the_Victims_of_German_Fascism: "Refugee Camps for the Victims of Fascism"
 GDR_Establish_Refugee_Camps_for_the_Victims_of_German_Fascism_desc: "The influx of Western refugees is great, we will have to organize temporary housing units for them until we can figure out a permanent solution."
 GDR_The_End_of_Republikflucht: "The End of Republikflucht"
 GDR_The_End_of_Republikflucht_desc: "The single positive from the fascist takeover of West Germany is the huge drop in emigration from East Germany to the West. It seems like the Republikflucht crisis has solved itself."
 GDR_Purge_the_Military_of_Former_Wehrmacht: "Purge the Military of Former Wehrmacht"
 GDR_Purge_the_Military_of_Former_Wehrmacht_desc: "Any soldier who fought for fascism is not welcome in our ranks. They will not be allowed to stain the new German military."
 GDR_Continue_Integration_Efforts: "Continue Integration Efforts"
 GDR_Continue_Integration_Efforts_desc: "Despite the crimes of the Nazi regime, the combat experience of former Wehrmacht soldiers is invaluable."
 GDR_Promote_Western_Communist_Officers: "Promote Western Communist Officers"
 GDR_Promote_Western_Communist_Officers_desc: "Some of the defectors coming from West Germany are former military officers who harbored political leanings toward us. We should promote these officers."
 GDR_Offer_Weapon_Exchange_to_Soviets: "Offer Weapon Exchange to the Soviets"
 GDR_Offer_Weapon_Exchange_to_Soviets_desc: "With the large cache of Western weapons now in our possession, we may be able to offer some of them to the USSR in exchange for some much-needed resources."
 GDR_Begin_Sidelining_the_Spanish_Civil_War_Veterans: "Sidele the Spanish Civil War Veterans"
 GDR_Begin_Sidelining_the_Spanish_Civil_War_Veterans_desc: "Why should we laud and celebrate weak soldiers who allowed fascism to take root in Spain?"
 GDR_Embrace_the_Legacy_of_Socialist_Heroes: "Embrace the Legacy of Socialist Heroes"
 GDR_Embrace_the_Legacy_of_Socialist_Heroes_desc: "The socialist Germans who fought for the Spanish Republic faced great dangers, not least of which was potential reprisal from the Nazi government. They have earned their triumph."
 GDR_The_Fate_of_Ulbricht: "The Fate of Ulbricht"
 GDR_The_Fate_of_Ulbricht_desc: "Walter Ulbricht is a complicated figure, but it remains clear that his place is outside of politics. Out of sight, out of mind."
 GDR_Reverse_the_1950_Party_Purge: "Reverse the 1950 Party Purge"
 GDR_Reverse_the_1950_Party_Purge_desc: "The purges of the previous administration have left the Party weak. We must reverse this."
 GDR_Seek_the_Rehabilitation_of_Kurt_Muller: "Rehabilitate Kurt Müller"
 GDR_Seek_the_Rehabilitation_of_Kurt_Muller_desc: "Kurt Müller, the former deputy chairman of the KPD, is innocent of all the charges levied against him during the purges. His record should be expunged, and he should be reintegrated into the state apparatus immediately."
 GDR_Suspend_the_Agricultural_Collectivization_Program: "Suspend the Agricultural Collectivization Program"
 GDR_Suspend_the_Agricultural_Collectivization_Program_desc: "Agricultural collectivization is causing more harm than good. It would be best to suspend the program; perhaps we can revisit this in the future?"
 GDR_Come_Home_Deutschland: "Come Home Deutschland"
 GDR_Come_Home_Deutschland_desc: "Uncertainty grips the German people after our rise to power and the resurgence of fascism in the West. We urgently need to recapture their support."
 GDR_Study_Seized_Western_Equipment: "Study Seized Western Equipment"
 GDR_Study_Seized_Western_Equipment_desc: "Our capture of West Berlin came with the bonus of huge stashes of Western weapons. We should study them and see if we can't reverse engineer them."
 GDR_Launch_a_Purge_of_the_Judiciary: "Launch a Purge of the Judiciary"
 GDR_Launch_a_Purge_of_the_Judiciary_desc: "The Judiciary is full of sympathizers for the EKD and other rogue elements. They cannot be allowed to continue serving."
 GDR_Follow_Prior_Course_on_the_EKD: "Follow Prior Course on the EKD"
 GDR_Follow_Prior_Course_on_the_EKD_desc: "Opium of the masses, that is how Karl Marx described religion. We have no need for the church or its teachings."
 GDR_Empower_the_Western_KPD_Faction: "Empower the Western KPD Faction"
 GDR_Empower_the_Western_KPD_Faction_desc: "The Communist Party in West Germany needs our help if it is to survive. We will do what we can."
 GDR_Reverse_Ulbrichts_Disasterous_Economic_Polices: "Reverse Ulbricht's Economic Polices"
 GDR_Reverse_Ulbrichts_Disasterous_Economic_Polices_desc: "Ulbricht's economic policies did not bring about the necessary results for Germany's prosperity. We must return to the drawing board."
 GDR_A_New_Relationship_with_the_Church: "A New Relationship with the Church"
 GDR_A_New_Relationship_with_the_Church_desc: "Perhaps it is time to adopt a new strategy when dealing with the EKD. If the people wish to pray, then let them."
