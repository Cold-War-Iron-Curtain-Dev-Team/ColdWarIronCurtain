 Armor_0_W:0 "Welded Steel Armor"
 Armor_0_W_desc:0 "Conventional welded armor plate that is easier to manufacture and repair than cast armor while providing reliable baseline protection."
 Armor_0_C:0 "Cast Steel Armor"
 Armor_0_C_desc:0 "A cast armor layout that allows complex shapes and thick armor sections, at the cost of slower and more demanding production."
 Armor_1_Space:0 "Spaced Armor"
 Armor_1_Space_desc:0 "Separated armor plates that improve protection against shaped charges and some autocannon fire without fully redesigning the hull."
 Armor_1_Comp:0 "Early Composite Armor"
 Armor_1_Comp_desc:0 "Early composite armor using layered fillers to improve resistance against HEAT rounds and direct-fire anti-tank weapons."
 Armor_2_Comp:0 "Advanced Composite Armor"
 Armor_2_Comp_desc:0 "Advanced composite armor with improved ceramic and glass-based fillers for better kinetic and chemical protection."
 Armor_3:0 "First Gen NERA"
 Armor_3_desc:0 "First-generation non-explosive reactive armor using elastic layers to disrupt penetrators and shaped-charge jets."
 Armor_4:0 "Second Gen NERA"
 Armor_4_desc:0 "Second-generation NERA with improved array geometry and more effective reactive materials."
 Armor_5:0 "Third Gen NERA"
 Armor_5_desc:0 "Modern NERA using advanced ceramics, liners, and elastomers to increase multi-hit resistance and protection."
 Armor_6:0 "Fourth Gen NERA"
 Armor_6_desc:0 "Advanced modern NERA using the latest composite materials for very high protection at substantial weight and cost."
 Armor_4_DU:0 "Second Gen DU NERA"
 Armor_4_DU_desc:0 "Second-generation NERA reinforced with depleted uranium alloy layers for higher protection at much greater weight."
 Armor_5_DU:0 "Third Gen DU NERA"
 Armor_5_DU_desc:0 "Modern depleted-uranium NERA combining dense alloy layers with advanced elastomer and ceramic elements."
 Armor_6_DU:0 "Fourth Gen DU NERA"
 Armor_6_DU_desc:0 "Advanced depleted-uranium NERA intended to defeat the most capable kinetic and shaped-charge threats."
 Armor_0_Light:0 "Aluminum Alloy Armor"
 Armor_0_Light_desc:0 "Light aluminum armor for amphibious, airborne, and light vehicles where weight control matters more than maximum protection."
 Armor_1_Light:0 "Advanced Aluminum Alloy Armor"
 Armor_1_Light_desc:0 "Heat-treated aluminum alloy armor with improved hardness and resistance to heavy machine guns and autocannon fire."
 Addon_0_Comb:0 "Composite Add-on Armor"
 Addon_0_Comb_desc:0 "External composite armor panels that improve protection without rebuilding the basic hull armor array."
 Addon_1_NERA:0 "Add-on NERA I"
 Addon_1_NERA_desc:0 "External NERA modules that improve protection against shaped charges and kinetic rounds while adding weight and bulk."
 Addon_2_NERA:0 "Add-on NERA II"
 Addon_2_NERA_desc:0 "Improved add-on NERA modules with better materials and easier replacement after damage."
 Addon_3_NERA:0 "Add-on NERA III"
 Addon_3_NERA_desc:0 "Modern modular NERA panels for strong protection and simpler field repair."
 Addon_4_NERA:0 "Add-on NERA IV"
 Addon_4_NERA_desc:0 "Advanced modern modular NERA panels using high-end materials for maximum external protection."
 Addon_0_CE:0 "Light Ceramic Add-on Armor"
 Addon_0_CE_desc:0 "Light ceramic composite panels that improve resistance to heavy machine guns, autocannon fire, and fragments."
 Addon_1_CE:0 "Advanced Light Ceramic Add-on Armor"
 Addon_1_CE_desc:0 "Advanced lightweight ceramic composite panels using modern alloys, polymers, and hard ceramic tiles."
 ERA_0:0 "First Generation ERA"
 ERA_0_desc:0 "Early explosive reactive armor that gives strong protection against HEAT rounds but limited effect against kinetic penetrators."
 ERA_1:0 "Second Generation ERA"
 ERA_1_desc:0 "Improved ERA with better coverage and some resistance to kinetic penetrators."
 ERA_L:0 "Light ERA Package"
 ERA_L_desc:0 "A lighter explosive reactive armor package suited for vehicles that cannot carry full-weight ERA arrays."
 ERA_2:0 "Third Generation ERA"
 ERA_2_desc:0 "Modular ERA designed to counter tandem charges and provide better field replacement of damaged elements."
 ERA_3:0 "Fourth Generation ERA"
 ERA_3_desc:0 "Advanced ERA using non-contact or sensor-assisted triggering to disrupt incoming threats before impact."
 Smoke_0:0 "Basic Smoke Grenade Dischargers"
 Smoke_0_desc:0 "Simple smoke grenade launchers that let the crew create a quick visual screen during withdrawal or repositioning."
 Smoke_ESS:0 "Engine Smoke Generator"
 Smoke_ESS_desc:0 "A smoke system that injects fuel into the exhaust to create a screen while the engine is running."
 Smoke_1:0 "Improved Smoke Grenade Dischargers"
 Smoke_1_desc:0 "Improved smoke dischargers using denser smoke composition and better launcher placement."
 Smoke_2:0 "IR Smoke Grenade Dischargers"
 Smoke_2_desc:0 "Smoke dischargers using infrared-screening smoke to disrupt thermal sights and IR-guided weapons."
 Smoke_3:0 "Multi-Spectral Smoke Dischargers"
 Smoke_3_desc:0 "Smoke launchers that add radar and infrared obscurants for protection against modern sensors."
 Smoke_4:0 "Smart Smoke Dischargers"
 Smoke_4_desc:0 "Automated smoke launchers that can react to detected threats and coordinate dynamic screening."
 APS_0_H:0 "Early Hard-Kill APS"
 APS_0_H_desc:0 "An early hard-kill active protection system that detects and intercepts incoming anti-tank weapons near the vehicle."
 APS_1_H:0 "Advanced Hard-Kill APS"
 APS_1_H_desc:0 "An improved hard-kill APS with better coverage, target discrimination, and reduced collateral danger."
 APS_2_H:0 "Modern Hard-Kill APS"
 APS_2_H_desc:0 "A modern hard-kill APS capable of reacting to faster and more difficult anti-armor threats."
 APS_3_H:0 "Advanced Modern Hard-Kill APS"
 APS_3_H_desc:0 "An advanced hard-kill APS with the sensors and reaction speed needed against the most demanding projectiles."
 APS_0_S:0 "Early Soft-Kill APS"
 APS_0_S_desc:0 "A soft-kill protection suite that uses warning receivers, jammers, emitters, and smoke integration to disrupt enemy guidance."
 APS_1_S:0 "Advanced Soft-Kill APS"
 APS_1_S_desc:0 "An advanced soft-kill suite with better sensors, electronic countermeasures, and networked threat response."
 FFS_0:0 "Manual Fire Suppression System"
 FFS_0_desc:0 "Crew-operated fire suppression equipment that improves survivability after fuel or ammunition fires."
 FFS_1:0 "Automatic Fire Suppression System"
 FFS_1_desc:0 "Automatic fire detection and suppression equipment that reacts faster than manual crew action."
 FFS_2:0 "Integrated Fire Suppression System"
 FFS_2_desc:0 "An integrated fire and explosion suppression suite covering the engine bay, crew space, and ammunition storage."
 Loader_0_Rammer:0 "Power Rammer"
 Loader_0_Rammer_desc:0 "A powered rammer that assists the loader and improves sustained fire without fully automating ammunition handling."
 Loader_1_Mech_Ammo:0 "Mechanized Ammunition Rack"
 Loader_1_Mech_Ammo_desc:0 "A mechanized ammunition handling system that reduces loader workload and improves practical rate of fire."
 Loader_2a_Drum:0 "Drum Autoloader I"
 Loader_2a_Drum_desc:0 "A drum autoloader that provides rapid access to a ready ammunition supply, with added mechanical complexity."
 Loader_2b_Drum:0 "Drum Autoloader II"
 Loader_2b_Drum_desc:0 "An improved drum autoloader with better ammunition indexing and greater reliability."
 Loader_3a_Carousel:0 "Carousel Autoloader I"
 Loader_3a_Carousel_desc:0 "A compact carousel autoloader that improves rate of fire but concentrates ammunition inside the fighting compartment."
 Loader_3b_Carousel:0 "Carousel Autoloader II"
 Loader_3b_Carousel_desc:0 "An improved carousel autoloader with faster cycling and more reliable ammunition handling."
 Loader_3c_Carousel:0 "Carousel Autoloader III"
 Loader_3c_Carousel_desc:0 "A modern carousel autoloader with improved electronics and safer handling of separated ammunition."
 Loader_3d_Carousel:0 "Carousel Autoloader IV"
 Loader_3d_Carousel_desc:0 "An advanced carousel autoloader for modern tanks, providing high fire rate with complex internal machinery."
 Loader_4a_Belt:0 "Belt Autoloader I"
 Loader_4a_Belt_desc:0 "A belt-fed autoloader that moves ammunition from protected storage to the gun with reduced crew workload."
