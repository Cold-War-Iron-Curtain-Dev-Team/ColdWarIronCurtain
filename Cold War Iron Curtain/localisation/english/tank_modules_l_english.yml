 ap_0p:0 "Full-Caliber AP Ammunition"
 ap_0p_desc:0 "Conventional armor-piercing ammunition that relies on a full-caliber solid penetrator and simple manufacture."
 ap_1p:0 "APCR Ammunition"
 ap_1p_desc:0 "Composite rigid shot using a dense sub-caliber penetrator for improved armor penetration at short and medium ranges."
 ap_2p:0 "APDS Ammunition"
 ap_2p_desc:0 "Discarding sabot ammunition that sheds its carrier after firing, giving the penetrator better velocity retention and reduced drag."
 ap_3p:0 "APFSDS Ammunition"
 ap_3p_desc:0 "Fin-stabilized sabot ammunition using a long penetrator to defeat modern armor with high kinetic energy."
 ap_4p:0 "Long-Rod APFSDS Ammunition"
 ap_4p_desc:0 "An elongated APFSDS penetrator with improved sabot design and better performance against composite armor."
 ap_5p:0 "Advanced APFSDS Ammunition"
 ap_5p_desc:0 "Advanced long-rod ammunition with improved alloys, propellant, and sabot materials for higher armor penetration."
 ap_6p:0 "Early Modern APFSDS Ammunition"
 ap_6p_desc:0 "Early modern kinetic ammunition with a longer penetrator and optimized sabot for stronger performance against advanced armor."
 ap_7p:0 "Modern APFSDS Ammunition"
 ap_7p_desc:0 "Modern fin-stabilized kinetic ammunition designed to challenge advanced NERA and explosive reactive armor."
 ap_8p:0 "Advanced Modern APFSDS Ammunition"
 ap_8p_desc:0 "The most advanced kinetic ammunition, using highly optimized penetrators, propellants, and flight stabilization."
 ap_du_1p:0 "DU Long-Rod APFSDS Ammunition"
 ap_du_1p_desc:0 "Depleted uranium APFSDS ammunition that uses self-sharpening penetrator behavior for improved post-penetration effect."
 ap_du_2p:0 "Early Modern DU APFSDS Ammunition"
 ap_du_2p_desc:0 "Improved depleted uranium long-rod ammunition with better sabot design and higher retained velocity."
 ap_du_3p:0 "Modern DU APFSDS Ammunition"
 ap_du_3p_desc:0 "Modern depleted uranium kinetic ammunition intended to defeat advanced layered armor and ERA arrays."
 ap_du_4p:0 "Advanced Modern DU APFSDS Ammunition"
 ap_du_4p_desc:0 "The most advanced depleted uranium kinetic ammunition, combining optimized penetrators with dense propellant packing."
 tank_he_0p:0 "Chemical HE Ammunition"
 tank_he_0p_desc:0 "Basic high-explosive ammunition for direct-fire guns, useful against infantry, fortifications, and lightly armored targets."
 tank_he_1p:0 "Improved HE Ammunition"
 tank_he_1p_desc:0 "Improved high-explosive ammunition with better fuzing and more effective fragmentation."
 tank_he_2p:0 "Advanced HE Ammunition"
 tank_he_2p_desc:0 "Advanced high-explosive ammunition with denser explosive filling and improved shell body fragmentation."
 tank_he_3p:0 "Programmable HE Ammunition"
 tank_he_3p_desc:0 "Programmable high-explosive ammunition capable of more effective airburst and cover-defeating fire."
 tank_he_4p:0 "Modern Programmable HE Ammunition"
 tank_he_4p_desc:0 "Modern multipurpose high-explosive ammunition with precise electronic fuzing and flexible detonation modes."
 hesh_p:0 "HESH Ammunition"
 hesh_p_desc:0 "High-explosive squash head ammunition intended to damage armor and structures through shock and spalling."
 heat_0p:0 "Post-WW2 HEAT Ammunition"
 heat_0p_desc:0 "Early improved shaped-charge ammunition with better stabilization and performance than wartime designs."
 heat_1p:0 "Early Cold War HEAT Ammunition"
 heat_1p_desc:0 "Shaped-charge ammunition with improved standoff, fuzing, and liner geometry."
 heat_2p:0 "Mid-Cold War HEAT Ammunition"
 heat_2p_desc:0 "Improved HEAT ammunition with better jet formation for use against early composite armor."
 heat_3p:0 "Late Cold War HEAT Ammunition"
 heat_3p_desc:0 "Late Cold War HEAT ammunition refined for better effect from light guns, low-pressure guns, and missile launchers."
 heat_4p:0 "Tandem HEAT Ammunition"
 heat_4p_desc:0 "Tandem-charge HEAT ammunition designed to defeat explosive reactive armor before the main charge impacts."
 heat_5p:0 "Modern Tandem HEAT Ammunition"
 heat_5p_desc:0 "Modern shaped-charge ammunition using advanced liners and multi-stage charge arrangements."
 heat_6p:0 "Advanced Modern HEAT Ammunition"
 heat_6p_desc:0 "Advanced HEAT ammunition with highly optimized shaped charges for the limits of chemical-energy performance."
 heat_du_1p:0 "DU-Lined HEAT Ammunition I"
 heat_du_1p_desc:0 "A heavy-metal lined shaped charge that improves penetration and behind-armor effect at increased cost."
 heat_du_2p:0 "DU-Lined HEAT Ammunition II"
 heat_du_2p_desc:0 "An improved depleted-uranium lined shaped charge for better performance against layered armor."
 heat_du_3p:0 "DU-Lined HEAT Ammunition III"
 heat_du_3p_desc:0 "A modern depleted-uranium lined shaped charge optimized for advanced armor arrays."
 heat_mp_1p:0 "Multipurpose HEAT Ammunition I"
 heat_mp_1p_desc:0 "Multipurpose shaped-charge ammunition balancing anti-armor effect with useful blast and fragmentation."
 heat_mp_2p:0 "Multipurpose HEAT Ammunition II"
 heat_mp_2p_desc:0 "Improved multipurpose HEAT ammunition for flexible use against armor, infantry, and field positions."
 heat_mp_3p:0 "Multipurpose HEAT Ammunition III"
 heat_mp_3p_desc:0 "Advanced multipurpose shaped-charge ammunition with better target versatility and post-impact effect."
