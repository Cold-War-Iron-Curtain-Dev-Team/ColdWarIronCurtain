l_english:
 FIN_70s_1970_elections:0 "1970 Parliamentary Elections"
 FIN_70s_1970_elections_desc:0 "The March 1970 parliamentary election proved to be an unprecedented political earthquake in postwar Finland. Rapid demographic shifts, mechanized agriculture, and rural flight to cities and Sweden generated intense popular resentment. The populist Finnish Rural Party (SMP), campaigning under Veikko Vennamo on behalf of the 'forgotten people', surged from a single seat to eighteen. The traditional governing coalition was shaken, forcing the major parties to re-examine regional development, farm subsidies, and voter alienation."
 FIN_70s_red_soil_coalition:0 "Renew the Red-Soil Coalition"
 FIN_70s_red_soil_coalition_desc:0 "The foundational bedrock of Finnish political stability has long rested upon cooperation between the Social Democratic Party (SDP) and the Center Party (Keskusta)—the historic 'Red-Soil' (Punamulta) alliance. Despite mutual friction and competing socioeconomic constituencies, statesmen like Ahti Karjalainen and Kalevi Sorsa recognize that only a broad center-left coalition can provide the legislative majority needed to manage modern industrial governance and balance East-West diplomacy."
 FIN_70s_curb_smp_populism:0 "Address Rural Grievances"
 FIN_70s_curb_smp_populism_desc:0 "Veikko Vennamo's populist rhetoric struck a powerful chord among smallholders and impoverished veterans across northern and eastern Finland who felt abandoned by Helsinki's technocrats. To defuse populist anger, the government must expand targeted regional support programs (kehitysaluelainsäädäntö), improve local transport infrastructure in Kainuu and Savo, and guarantee minimum prices for agricultural output."
 FIN_70s_manage_leftwing_split:0 "Manage the Left-Wing Schism"
 FIN_70s_manage_leftwing_split_desc:0 "The Finnish People's Democratic League (SKDL) and Communist Party (SKP) are bitterly fractured. The majority reformist faction led by trade-unionist Aarne Saarinen advocates democratic parliamentarism, Nordic welfare expansion, and autonomy from Moscow. Conversely, the orthodox Marxist-Leninist minority—the 'Taistoists' led by Taisto Sinisalo—demands total loyalty to Soviet orthodoxy and controls student unions and cultural associations. Careful statecraft is necessary to prevent this schism from paralyzing industrial labor relations."
 FIN_70s_poikkeuslaki:0 "The Exceptional Law of 1973"
 FIN_70s_poikkeuslaki_desc:0 "With the delicate EEC free-trade negotiations reaching a decisive stage in late 1972, political leaders feared that a bruising 1974 presidential election campaign might alarm Soviet leadership or jeopardize the Western market accords. In January 1973, by an overwhelming five-sixths majority of 170 to 34, Parliament enacted the Exceptional Law (Poikkeuslaki), extending President Urho Kekkonen's term for four additional years without an election. While controversial among constitutional purists, it secured absolute continuity at the helm of the state."
 FIN_70s_national_emergency_cabinet:0 "Miettunen's Emergency Cabinet"
 FIN_70s_national_emergency_cabinet_desc:0 "When the global post-oil shock recession triggered rising unemployment and political deadlock in late 1975, President Kekkonen took the extraordinary step of summoning party leaders to the Presidential Palace and demanding the immediate formation of an all-party 'national emergency government' (hätätilahallitus) under veteran Agrarian Martti Miettunen. Subordinating partisan disputes to presidential will, the cabinet enacted emergency public works and fiscal stabilization measures."
 FIN_70s_1978_consensus_election:0 "The 1978 All-Party Consensus"
 FIN_70s_1978_consensus_election_desc:0 "By 1978, the Paasikivi-Kekkonen Line enjoyed virtually universal domestic consensus. All four dominant political parties—Keskusta, the SDP, Kokoomus, and the SKDL—along with liberal and Swedish minority parties, joined together in an electoral cartel to endorse Urho Kekkonen's re-election. Kekkonen secured 259 out of 300 electoral college votes, demonstrating near-monolithic national unity behind his stewardship of foreign policy."
 FIN_70s_kekkonen_zenith:0 "The Apex of the Kekkonen Era"
 FIN_70s_kekkonen_zenith_desc:0 "At the height of his influence, President Urho Kekkonen wields authority unmatched by any other democratic head of state in Europe. Revering his diplomatic mastery, Finnish politicians across all factions cultivate ties with Tamminiemi and compete for presidential favor. Kekkonen functions as the ultimate arbiter of government formation, industrial compromise, and relations with the Soviet superpower."
 FIN_80s_kekkonen_resignation:0 "The Resignation of President Kekkonen"
 FIN_80s_kekkonen_resignation_desc:0 "During an official visit to Iceland in late summer 1981, President Kekkonen suffered acute memory lapses and physical exhaustion caused by advancing cerebral arteriosclerosis. On October 26, 1981, after twenty-five historic years in office, Kekkonen submitted his formal resignation. Prime Minister Mauno Koivisto assumed presidential duties as acting head of state, signaling the dignified close of an epoch in Finnish history."
 FIN_80s_1982_presidential_election:0 "The 1982 Presidential Election"
 FIN_80s_1982_presidential_election_desc:0 "The January 1982 presidential election galvanized Finnish society with the highest electoral turnout in decades. Prime Minister Mauno Koivisto ('Manu'), immensely popular for his calm demeanor, working-class background, and scholarly intellect, triumphed in a historic landslide with 167 electoral college votes. For the first time since the founding of the Republic, a Social Democrat assumed the presidency."
 FIN_80s_koivisto_era:0 "The Koivisto Presidency"
 FIN_80s_koivisto_era_desc:0 "President Mauno Koivisto brings a deliberate change in presidential culture—a 'lowered profile' (madallettu profiili). Rejecting the dramatic personal interventionism of his predecessor, Koivisto emphasizes constitutional restraint, calm deliberation, and institutional respect for the cabinet and parliament."
 FIN_80s_strengthen_parliamentarism:0 "Strengthen Parliamentarism"
 FIN_80s_strengthen_parliamentarism_desc:0 "Recognizing that the expansive presidential prerogatives accumulated during the postwar decades risked democratic accountability, President Koivisto champions constitutional revisions. The powers of the Prime Minister and the Eduskunta are decisively reinforced, stipulating that the president may only dissolve parliament upon a reasoned request by the prime minister and after hearing the parliamentary groups."
 FIN_80s_presidential_term_limits:0 "Codify Presidential Term Limits"
 FIN_80s_presidential_term_limits_desc:0 "To ensure that no individual can ever again hold supreme executive power for a quarter of a century, the constitutional reform commission drafts an amendment establishing a strict two-term limit of six years each. This reform permanently transitions Finland from a semi-monarchical presidency toward a modern, balanced European parliamentary democracy."
 FIN_80s_sinipuna_coalition:0 "The Historic Blue-Red Government"
 FIN_80s_sinipuna_coalition_desc:0 "Following the 1987 parliamentary elections, President Koivisto breaks decades of political precedent by appointing Harri Holkeri (Kokoomus) as Prime Minister at the head of a historic 'Blue-Red' (Sinipuna) coalition with the Social Democrats. This ends the conservative party's 21-year exclusion from government and shatters the Center Party's historic monopoly over coalition formation."
 FIN_80s_pluralist_stability:0 "The Modern Democratic Consensus"
 FIN_80s_pluralist_stability_desc:0 "As the 1980s draw to a close, Finland stands as an egalitarian, pluralistic society anchored by strong democratic institutions, high civic trust, and robust rule of law. Having dismantled Cold War constitutional anomalies, the Republic is prepared to navigate the profound geopolitical transformation of the European continent."
 FIN_70s_active_peace_neutrality:0 "Active and Peace-Seeking Neutrality"
 FIN_70s_active_peace_neutrality_desc:0 "Finnish neutrality is not isolationism or passive disengagement. Anchored in the Paasikivi-Kekkonen Line, Finland's foreign policy seeks to build constructive relations with all nations, defuse East-West ideological tension, and preserve Finnish national sovereignty through active international engagement."
 FIN_70s_bridge_builder_diplomacy:0 "The Bridge-Builder Doctrine"
 FIN_70s_bridge_builder_diplomacy_desc:0 "President Kekkonen famously characterized Finland's diplomatic mission as that of 'a physician, not a judge.' Finland does not seek to lecture or condemn other sovereign nations; rather, it offers neutral good offices, reliable mediation, and quiet bridge-building between the opposing power blocs of the Cold War."
 FIN_70s_nordic_council_cooperation:0 "Harmonize Nordic Council Policies"
 FIN_70s_nordic_council_cooperation_desc:0 "Finland maintains intimate cultural, legal, and economic solidarity with its Scandinavian neighbors through the Nordic Council. The passport-free Nordic travel area, common labor market, and shared social welfare principles ensure that Finland remains an organic part of the Nordic democratic community."
 FIN_70s_un_peacekeeping_commitment:0 "Expand UN Peacekeeping Contingents"
 FIN_70s_un_peacekeeping_commitment_desc:0 "Finnish peacekeepers have earned world renown for discipline, neutrality, and operational excellence. Under the United Nations flag, Finnish blue helmets serve with distinction in the Sinai (UNEF II), the Golan Heights (UNDOF), and Southern Lebanon (UNIFIL), demonstrating Finland's practical dedication to global stability."
 FIN_70s_eec_free_trade_agreement:0 "Sign the EEC Free Trade Agreement"
 FIN_70s_eec_free_trade_agreement_desc:0 "With the accession of Great Britain and Denmark to the European Economic Community in 1973, Finland faced the catastrophic loss of EFTA tariff preferences in its most vital Western export markets. After tortuous negotiations in Brussels, Finland signed a free-trade agreement with the EEC, dismantling tariffs on industrial manufactured goods while safeguarding its political neutrality."
 FIN_70s_comecon_protocol:0 "Parallel Protocol with COMECON"
 FIN_70s_comecon_protocol_desc:0 "To preserve strict equilibrium between East and West and demonstrate to Soviet leaders that the EEC accord posed no threat to socialist economic cooperation, Finland negotiated a historic cooperation agreement with COMECON (SEV). Finland became the first non-socialist market economy to conclude a formal treaty with the Eastern trade organization."
 FIN_70s_convene_csce_summit:0 "Convene the CSCE at Finlandia Hall"
 FIN_70s_convene_csce_summit_desc:0 "Through tireless diplomatic initiative across European capitals, Finnish diplomats succeeded in organizing the Conference on Security and Co-operation in Europe (CSCE / ETYK). In July and August 1975, heads of state and government from thirty-five nations gathered at Finlandia Hall in Helsinki for the greatest multilateral summit in modern European history."
 FIN_70s_helsinki_final_act:0 "The Helsinki Final Act"
 FIN_70s_helsinki_final_act_desc:0 "On August 1, 1975, thirty-five world leaders—including Gerald Ford, Leonid Brezhnev, Harold Wilson, and Helmut Schmidt—signed the historic Helsinki Final Act. The document balanced the recognition of postwar European frontiers and non-intervention with binding commitments to economic cooperation and universal human rights."
 FIN_70s_spirit_of_helsinki:0 "The Spirit of Helsinki"
 FIN_70s_spirit_of_helsinki_desc:0 "The summit birthed the 'Spirit of Helsinki', becoming the defining symbol of Cold War détente. By facilitating dialogue between the superpowers and enshrining human rights into European international law, Finland elevated its international prestige to an all-time zenith."
 FIN_70s_rebuff_ustinov_proposal:0 "Rebuff Joint Soviet Maneuvers"
 FIN_70s_rebuff_ustinov_proposal_desc:0 "In July 1978, Soviet Defense Minister Marshal Dmitry Ustinov visited Helsinki and proposed holding joint peacetime military exercises between the Red Army and the Finnish Defence Forces under the YYA treaty. President Kekkonen and Chief of Defence Lauri Sutela politely but unequivocally refused, insisting that Finnish neutrality requires independent, national defense."
 FIN_70s_nordic_nuclear_free_zone:0 "Promote the Nordic Nuclear-Free Zone"
 FIN_70s_nordic_nuclear_free_zone_desc:0 "President Kekkonen consistently advocated for a Nordic Nuclear-Weapon-Free Zone (Pohjolan ydinaseeton vyöhyke) to shield Northern Europe from superpower nuclear escalation. Finland continues to sponsor multilateral diplomatic initiatives to keep weapons of mass destruction out of the Baltic and Arctic regions."
 FIN_80s_madallettu_profiili:0 "Pragmatic Cautious Diplomacy"
 FIN_80s_madallettu_profiili_desc:0 "President Koivisto conducts Finnish foreign policy with characteristic restraint. By honoring existing bilateral treaties while avoiding grand ideological pronouncements, Finland quietly preserves its sovereignty and steadily deepens integration with Western European economic institutions."
 FIN_80s_perestroika_engagement:0 "Engage with Soviet Perestroika"
 FIN_80s_perestroika_engagement_desc:0 "The accession of Mikhail Gorbachev in 1985 and the advent of Glasnost and Perestroika fundamentally alters the political atmosphere in the Soviet Union. President Koivisto and the Finnish foreign ministry establish warm personal dialogue with Gorbachev, supporting reformist trends while carefully managing regional stability."
 FIN_80s_european_reorientation:0 "Prepare for European Integration"
 FIN_80s_european_reorientation_desc:0 "With Cold War rigidities dissolving across the continent, Finland joins the Council of Europe in 1989 and commences negotiations for the European Economic Area (EEA). Finland prepares to take its full place within the emerging European architecture as a confident, sovereign democratic partner."
 FIN_70s_five_year_clearing_trade:0 "Five-Year Soviet Clearing Trade"
 FIN_70s_five_year_clearing_trade_desc:0 "Bilateral clearing trade agreements (idänkauppa) administered through Vneshtorgbank serve as a vital engine of Finnish heavy industry. Without requiring scarce convertible Western currencies, Finland exchanges advanced manufactured goods, ships, and engineering machinery for Soviet crude oil, natural gas, and raw timber."
 FIN_70s_arctic_shipbuilding:0 "Wärtsilä & Rauma Arctic Shipyards"
 FIN_70s_arctic_shipbuilding_desc:0 "Finnish shipyards—led by Wärtsilä's yards in Helsinki and Turku, along with Rauma-Repola—lead the world in specialized icebreaking technology. Constructing nuclear and diesel-electric polar icebreakers, specialized Arctic cargo carriers, and luxury cruise liners, Finnish yards maintain thousands of high-wage engineering jobs."
 FIN_70s_cross_border_kostamus:0 "The Kostomuksha Mining Megaproject"
 FIN_70s_cross_border_kostamus_desc:0 "Under a massive bilateral agreement, thousands of Finnish construction workers, engineers, and heavy machinery firms construct the immense iron-ore pelletizing combine and new town of Kostomuksha (Kostamus) in Soviet Karelia. The project provides an economic lifeline to the underdeveloped border region of Kainuu."
 FIN_70s_insulate_from_oil_shocks:0 "Insulate Against Global Oil Shocks"
 FIN_70s_insulate_from_oil_shocks_desc:0 "When the OPEC oil crises of 1973 and 1979 plunged Western economies into stagflation, Finland's bilateral clearing system served as an automatic economic stabilizer. Higher prices for imported Soviet crude automatically expanded Soviet purchase quotas for Finnish exports, keeping Finnish factories running at full capacity."
 FIN_70s_nuclear_power_program:0 "The Nuclear Energy Initiative"
 FIN_70s_nuclear_power_program_desc:0 "To reduce dependence on fossil fuel imports and provide cheap baseload electricity for heavy forestry and metal industries, Finland embarks on a civilian nuclear energy program, ensuring the highest standards of safety and engineering."
 FIN_70s_loviisa_eastinghouse:0 "Commission Loviisa Nuclear Power Plant"
 FIN_70s_loviisa_eastinghouse_desc:0 "State utility Imatran Voima (IVO) commissions the Loviisa Nuclear Power Plant in Uusimaa. Combining Soviet VVER-440 pressurized water reactors with Western ice-condenser containment and Westinghouse-Siemens automated safety systems, the unique hybrid is affectionately christened 'Eastinghouse'."
 FIN_70s_olkiluoto_bwr:0 "Commission Olkiluoto BWR Reactors"
 FIN_70s_olkiluoto_bwr_desc:0 "Private industrial consortium Teollisuuden Voima (TVO) contracts Sweden's ASEA-Atom to construct two boiling water reactors at Olkiluoto on the southwestern coast, bringing modern Scandinavian nuclear technology to power Finnish industry."
 FIN_70s_national_grid_ivo:0 "Expand the IVO National Grid & Neste"
 FIN_70s_national_grid_ivo_desc:0 "Imatran Voima constructs the high-voltage 400 kV nationwide transmission backbone, while state oil company Neste expands its state-of-the-art oil refinery and petrochemical complex at Sköldvik in Porvoo, establishing world-class energy infrastructure."
 FIN_70s_welfare_state_foundation:0 "The Nordic Welfare Consensus"
 FIN_70s_welfare_state_foundation_desc:0 "Having achieved postwar industrialization, Finland dedicates itself to completing the Nordic welfare state. Grounded in egalitarian values, social security, and universal rights, the welfare state ensures that every citizen enjoys access to education, healthcare, and human dignity."
 FIN_70s_peruskoulu_reform:0 "Complete the Peruskoulu School Reform"
 FIN_70s_peruskoulu_reform_desc:0 "Rolled out progressively from northern Finland between 1972 and 1977, the comprehensive school reform (Peruskoulu) replaces the old divided civic and grammar schools with a single, universal, publicly funded nine-year comprehensive school for all children regardless of wealth or family background."
 FIN_70s_kansanterveyslaki:0 "The Public Health Act of 1972"
 FIN_70s_kansanterveyslaki_desc:0 "The landmark Public Health Act (Kansanterveyslaki) of 1972 mandates that every municipality establish a public health center (terveyskeskus) offering free preventive healthcare, doctor visits, dental services, and maternal clinics (neuvola), establishing one of the lowest infant mortality rates in the world."
 FIN_70s_paivahoitolaki:0 "Universal Child Day Care Act of 1973"
 FIN_70s_paivahoitolaki_desc:0 "The Child Day Care Act of 1973 guarantees public municipal childcare for working parents. By freeing mothers from homebound child-rearing constraints, Finland achieves the highest female workforce participation rate in the democratic world."
 FIN_70s_tupo_framework:0 "Tripartite Incomes Policy (TUPO)"
 FIN_70s_tupo_framework_desc:0 "Comprehensive incomes policy agreements (tulopoliittinen kokonaisratkaisu - TUPO) bring together the Central Organization of Finnish Trade Unions (SAK), employer federations (STK), and the state into centralized wage settlements, curbing inflation and securing industrial peace."
 FIN_80s_found_tekes:0 "Found the Technology Agency (TEKES)"
 FIN_80s_found_tekes_desc:0 "Established in 1983, the National Technology Agency (TEKES) channels targeted state funding into technological research and applied industrial innovation, bridging universities, research laboratories, and dynamic private enterprises."
 FIN_80s_nmt_cellular_network:0 "Launch the Nordic Mobile Telephone (NMT)"
 FIN_80s_nmt_cellular_network_desc:0 "In 1981, the Nordic telecommunications administrations launch the Nordic Mobile Telephone (NMT-450, followed by NMT-900) network—the world's first fully automated commercial cellular phone network with international roaming across the Nordic countries."
 FIN_80s_nokia_mobira_expansion:0 "Nokia & Mobira Telecom Pivot"
 FIN_80s_nokia_mobira_expansion_desc:0 "Under charismatic CEO Kari Kairamo, industrial conglomerate Nokia transforms itself from a traditional producer of rubber boots and paper into a high-technology electronics pioneer. Nokia acquires Salora, expands Mobira, and manufactures revolutionary mobile phones like the Mobira Senator, Talkman, and Cityman 900."
 FIN_80s_financial_deregulation:0 "Deregulate Capital Markets"
 FIN_80s_financial_deregulation_desc:0 "Following global financial trends, the Bank of Finland and the Ministry of Finance dismantle interest rate controls, abolish lending quotas, and permit Finnish companies to borrow directly in foreign currencies."
 FIN_80s_kasinotalous_boom:0 "The 'Casino Economy' Boom"
 FIN_80s_kasinotalous_boom_desc:0 "Rapid financial liberalization unleashes an unprecedented economic boom in the late 1980s—the 'Casino Economy' (Kasino-talous). Stock prices skyrocket, commercial real estate booms, consumer spending hits record peaks, and Finnish corporate raiders make headlines across Europe."
 FIN_70s_territorial_defense_doctrine:0 "The Territorial Defense Doctrine"
 FIN_70s_territorial_defense_doctrine_desc:0 "General Lauri Sutela codifies the Territorial Defense Doctrine (Alueellinen puolustusjärjestelmä). Recognizing that Finland cannot match superpower armor in frontal clashes, the doctrine prepares deep tactical defense across forests, lakes, and archipelagos, using decentralized command across 27 military districts to exhaust and destroy any aggressor."
 FIN_70s_paris_treaty_reinterpretation:0 "Maintain the Paris Treaty Limits"
 FIN_70s_paris_treaty_reinterpretation_desc:0 "The 1947 Paris Peace Treaty limits the active army to 34,400 men, the navy to 10,000 tons, and the air force to 60 combat aircraft, while forbidding offensive missiles. Finland scrupulously respects active ceilings while training massive reserve cadres capable of rapid mobilization upon national emergency."
 FIN_70s_total_defense_concept:0 "The Total Defense Concept"
 FIN_70s_total_defense_concept_desc:0 "Finnish defense encompasses the entire nation: mandatory civil defense shelters carved into granite bedrock, strategic economic stockpiles of grain and fuel, and rigorous refresher training for 500,000 military reservists."
 FIN_70s_procure_mig21bis:0 "Procure Soviet MiG-21bis Interceptors"
 FIN_70s_procure_mig21bis_desc:0 "The Finnish Air Force acquires modern MiG-21bis all-weather interceptors equipped with radar and R-60 air-to-air missiles for Fighter Squadron 31 based at Kuopio/Rissala, maintaining balanced procurement from the USSR."
 FIN_70s_valmet_draken_assembly:0 "Assemble Saab 35 Draken at Kuorevesi"
 FIN_70s_valmet_draken_assembly_desc:0 "Under license from Sweden's Saab, Valmet Lentokoneteollisuus assembles Saab 35FS and 35XS Draken supersonic interceptors at Kuorevesi to equip Lapland Fighter Squadron 11 at Rovaniemi, guarding Northern Finland's airspace."
 FIN_70s_valmet_hawk_trainers:0 "Assemble BAE Hawk Jet Trainers"
 FIN_70s_valmet_hawk_trainers_desc:0 "To replace aging French Fouga Magister trainers, Finland orders British BAE Hawk Mk.51 jet trainers. Forty-six of the fifty aircraft are assembled locally by Valmet, providing Finnish military aviation with unmatched pilot training infrastructure."
 FIN_70s_valmet_rk62_standardization:0 "Standardize the Valmet Rk 62 & Rk 76"
 FIN_70s_valmet_rk62_standardization_desc:0 "Regarded as one of the finest assault rifles in the world, the Valmet Rk 62 and stamped-receiver Rk 76 in 7.62x39mm caliber are issued to all active and reserve infantry units, offering peerless accuracy and reliability in sub-zero Arctic conditions."
 FIN_80s_soviet_t72m1_tanks:0 "Acquire Soviet T-72M1 Tanks"
 FIN_80s_soviet_t72m1_tanks_desc:0 "To modernize the Armoured Brigade (Panssariprikaati) at Parola, Finland purchases modern Soviet T-72M1 main battle tanks equipped with 125mm smoothbore guns, composite armor, and laser rangefinders, replacing obsolete T-54/55 armor."
 FIN_80s_sisu_pasi_apc:0 "Adopt the Sisu XA-180 'Pasi' 6x6 APC"
 FIN_80s_sisu_pasi_apc_desc:0 "Sisu-Auto produces the amphibious Sisu XA-180 'Pasi' 6x6 armored personnel carrier. Highly mobile, mine-resistant, and capable of operating across snow, swamps, and rivers, the Pasi becomes the backbone of mechanized jaeger formations and UN peacekeeping deployments."
 FIN_80s_tampella_heavy_artillery:0 "Produce Tampella 155 K 83 Artillery"
 FIN_80s_tampella_heavy_artillery_desc:0 "Finnish arms manufacturer Tampella develops the world-renowned 155 K 83 heavy field howitzer, capable of firing high-explosive shells over 30 kilometers with pinpoint accuracy, greatly enhancing the firepower of Finnish artillery brigades."
 FIN_80s_helsinki_class_missile_boats:0 "Commission Helsinki-Class Missile Boats"
 FIN_80s_helsinki_class_missile_boats_desc:0 "Wärtsilä shipyards construct four Helsinki-class fast attack craft for the Finnish Navy, armed with Swedish RBS-15 anti-ship missiles, 57mm Bofors cannons, and modern electronic warfare suites to defend Finnish coastal approaches."
 FIN_80s_pohjanmaa_minelayer:0 "Commission Minelayer Pohjanmaa"
 FIN_80s_pohjanmaa_minelayer_desc:0 "Built in Helsinki, the minelayer Pohjanmaa enters service as the proud flagship of the Finnish Navy and training ship for naval cadets, capable of laying extensive defensive minefields in the shallow Baltic coastal passages."
 FIN_80s_coastal_artillery_forts:0 "Modernize Coastal Fortress Forts"
 FIN_80s_coastal_artillery_forts_desc:0 "Heavy coastal artillery fortresses—housing 100mm and 130mm turrets embedded deep in granite island bunkers—are upgraded with modern radar, laser rangefinders, and laser-guided munitions, turning the Gulf of Finland into an impenetrable defensive barrier."
 FIN_80s_invulnerable_homeland:0 "The Inviolable Finnish Redoubt"
 FIN_80s_invulnerable_homeland_desc:0 "Combining whole-of-society territorial defense with modern equipment, high morale, and deep strategic reserves, the Finnish Defence Forces present an indisputable deterrent to any potential foreign aggression."
 FIN_kekkonen_supremacy:0 "Kekkonen's Executive Supremacy"
 FIN_kekkonen_supremacy_desc:0 "President Urho Kekkonen commands total authority across Finnish politics, ensuring foreign policy discipline and complete executive continuity."
 FIN_sinipuna_cooperation_idea:0 "The Blue-Red Consensus"
 FIN_sinipuna_cooperation_idea_desc:0 "Cooperation between Kokoomus and the Social Democrats brings broad legislative majorities and stable, forward-looking governance."
 FIN_eec_free_trade_idea:0 "EEC Free Trade Accord"
 FIN_eec_free_trade_idea_desc:0 "Duty-free industrial trade with Western European markets fuels the expansion of Finnish forestry, metalworking, and engineering industries."
 FIN_spirit_of_helsinki:0 "The Spirit of Helsinki"
 FIN_spirit_of_helsinki_desc:0 "The 1975 Helsinki Accords elevated Finland's global standing as a champion of European détente, multilateral dialogue, and universal human rights."
 FIN_soviet_clearing_trade_idea:0 "Bilateral Soviet Clearing Trade"
 FIN_soviet_clearing_trade_idea_desc:0 "Five-year trade agreements with the USSR guarantee steady demand for Finnish icebreakers, machinery, and consumer goods in exchange for crude oil."
 FIN_peruskoulu_comprehensive_school:0 "Peruskoulu Comprehensive Education"
 FIN_peruskoulu_comprehensive_school_desc:0 "The universal nine-year comprehensive school system provides world-class egalitarian education to every Finnish child regardless of background."
 FIN_nmt_telecom_pioneer:0 "NMT Telecommunications Pioneer"
 FIN_nmt_telecom_pioneer_desc:0 "The Nordic Mobile Telephone cellular network establishes Finland as a global frontrunner in wireless telecommunications and electronics."
 FIN_alueellinen_puolustus_doctrine:0 "Territorial Defense Doctrine"
 FIN_alueellinen_puolustus_doctrine_desc:0 "Deep, decentralized territorial defense across Finland's forests, lakes, and archipelagos guarantees that any invader faces protracted, exhausting resistance."
 FIN_kasinotalous_boom_idea:0 "Casino Economy Boom"
 FIN_kasinotalous_boom_idea_desc:0 "Financial market deregulation and liberalized foreign borrowing have spurred a massive consumer and investment boom."
 fin.204.t2:0 "The 1974 Presidential Term Issue"
 fin.204.d:0 "As President Kekkonen's third term draws toward its scheduled conclusion, the delicate international situation and ongoing negotiations over the EEC free-trade agreement dominate national discussion. Parliament must decide whether to proceed with standard electoral procedures or pass exceptional legislation."
 fin.204.a2:0 "Pass the Exceptional Law to re-appoint Kekkonen"
 fin.204.b2:0 "Conservative candidate Matti Virkkunen wins election"
 fin.204.c2:0 "Social Democratic candidate Rafael Paasio wins election"
 fin.205.t2:0 "The 1978 Presidential Election"
 fin.205.d:0 "The 1978 presidential election approaches under the banner of broad national consensus. President Kekkonen is endorsed by all major political parties, though challenger Raino Westerholm leads a conservative Christian protest candidacy."
 fin.205.a2:0 "Re-elect Urho Kekkonen with all-party backing"
 fin.205.b2:0 "Surprise upset for Raino Westerholm"
 fin.206.t2:0 "The 1982 Presidential Election"
 fin.206.d:0 "Following President Kekkonen's resignation due to declining health, Finland holds its first open presidential election in decades. Prime Minister Mauno Koivisto leads the Social Democratic ticket with immense popular acclaim against Harri Holkeri (Kokoomus) and Johannes Virolainen (Keskusta)."
 fin.206.a2:0 "Mauno Koivisto wins a historic landslide victory"
 fin.206.b2:0 "Harri Holkeri and the National Coalition triumph"
 fin.206.c2:0 "Johannes Virolainen secures the Center Party presidency"
