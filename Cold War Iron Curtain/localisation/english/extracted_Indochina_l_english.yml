#### The Road to Sam Neua (March 1953) ####
 VINLAO.10.t:0 "The Road to Sam Neua"
 VINLAO.10.d:0 "The Party has a decision to make about Laos, and it has to be made now, while the dry season lasts and the French are still tied down in the delta.\n\nThe Pathet Lao cadres are ready. Sam Neua can be taken and a liberated government proclaimed there within a month. But the mountains east of the Mekong eat armies, our supply lines would run three hundred kilometres over goat tracks, and the Kingdom will not be alone - Paris will airlift whatever it can spare to Vientiane and Luang Prabang the moment the first shot is fired.\n\nThe alternative is patience: arm the cadres, leave them inside the Kingdom, and let the movement grow where it already stands."
 VINLAO.10.a:0 "Cross the border. Proclaim the liberated zone at Sam Neua."
 VINLAO.10.b:0 "No invasion. Build the movement inside the Kingdom."
 VINLAO.10.c:0 "Not this season. Revisit it before the conference."
 VINLAO.11.t:0 "The Movement Grows in Place"
 VINLAO.11.d:0 "No columns cross the Annamite chain. Instead the rifles, the cadres and the printing presses go quietly west, and the Pathet Lao spend the year doing what an insurgency does best: recruiting in the villages the Kingdom's officials never visit.\n\nVientiane knows. Vientiane cannot prove it, and cannot reach the districts where it is happening.\n\nWhen the diplomats sit down, the Pathet Lao will not hold a capital - but they will hold something harder to bargain away than territory."
 VINLAO.11.a:0 "The revolution is not in a hurry."
 VINLAO.12.t:0 "Laos, Before the Conference"
 VINLAO.12.d:0 "The season we deferred has come round again, and the diplomats are beginning to talk about a conference. Whatever we hold in Laos when they sit down is what we will be allowed to keep.\n\nThe window is closing. If Sam Neua is to be taken, it must be taken now."
 VINLAO.12.a:0 "Go now, before the table is set."
 VINLAO.12.b:0 "Let it stand. The cadres are enough."
 VINLAO.13.t:0 "Our Laotian Comrades Join the Battle"
 VINLAO.13.d:0 "Dien Bien Phu lies thirty kilometres from the Lao frontier, and there is no staff in Hanoi that knows those hills the way the Pathet Lao know them. The message went west the day the campaign was decided. The answer came back before nightfall.\n\nBattalions that spent this war fighting the Royal Army in the north are already moving up the Nam Ou, through Sop Nao and Muang Khoua, on the same tracks their fathers used to trade salt. Behind them come the porter columns, and behind those the rice and the shells that have to be carried the last stretch by hand because nothing on wheels goes into that basin.\n\nWhatever the French have flown into the valley, it is now besieged by two movements and not one. The war for Laos and the war for Tonkin were never separate wars. They are about to be fought in the same place."
 VINLAO.13.a:0 "Two rivers, one current."
