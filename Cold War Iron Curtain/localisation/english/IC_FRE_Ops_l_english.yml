l_english:
 FRE_Operation_Bretagne: "Operation Bretagne"
 FRE_Operation_Bretagne_desc: "With the autumn fighting over, the delta command plans a deliberate sweep of the Bui Chu and Ninh Binh sectors to clear the Viet Minh regiments dug in among the Catholic militias. Bretagne succeeds only if French Union forces hold both Phat Diem and Ninh Binh for §Y7 consecutive days§!. Clean success is only possible within §Y30 days§!, and the operation lapses after §Y45 days§!. Taking Viet Minh ground at Thanh Hoa imposes §ROperational Overextension§!.\n\nA clean result costs the Viet Minh §Y15 Campaign Supply§! and strengthens the French cause in the Struggle."
 FRE_Operation_Adolphe: "Operation Adolphe"
 FRE_Operation_Adolphe_desc: "The Na San garrison has proved that a hedgehog can hold. Adolphe is a sortie from that base toward Yen Chau, meant to break up the Viet Minh supply points that watch the valley. It is a raid, not a conquest: French-aligned forces need only take and hold Yen Chau for §Y5 consecutive days§!. Clean success is only possible within §Y20 days§!, and the operation lapses after §Y30 days§!.\n\nA clean result costs the Viet Minh §Y10 Campaign Supply§! and adds one grade of readiness to the next relief preparation."
 FRE_Operation_Camargue: "Operation Camargue"
 FRE_Operation_Camargue_desc: "The Annamite coast between Hue and Quang Tri is the lifeline of the central Vietnamese garrisons. Camargue combines CEFEO mobile groups with two State of Vietnam divisions to hold the coastal stretch of Route Coloniale 1 and its approaches for §Y7 consecutive days§!. Clean success is only possible within §Y25 days§!, and the operation lapses after §Y40 days§!. The two Vietnamese divisions are raised for the operation and stood down when it ends.\n\nA clean result earns the State of Vietnam a measure of stability and war support and strengthens the cause of independence in the Struggle."
 FRE_Operation_Bretagne_Available_tt: "Available after §Y15 November 1952§!, once Lorraine has been decided or the Na San position has been prepared, while the Indochina theatre remains open and no other operation is in the field."
 FRE_Operation_Adolphe_Available_tt: "Available after §Y15 March 1953§!, once the Battle of Na San has been decided and French-aligned forces still hold the Na San airfield, while the Indochina theatre remains open and no other operation is in the field."
 FRE_Operation_Camargue_Available_tt: "Available after §Y1 July 1953§!, once Hirondelle or Brochet has reached a terminal result, while the Indochina theatre remains open and no other operation is in the field."
