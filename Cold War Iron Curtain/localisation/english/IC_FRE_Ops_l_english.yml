 VIN_Intel_Operation_Bretagne: "Intelligence: Phat Diem Sweep"
 VIN_Intel_Operation_Bretagne_desc: "CEFEO battalions are sweeping the Bui Chu and Ninh Binh sectors. CEFEO controls the operation's timetable; this observer mission has no independent resolution effect."
 VIN_Intel_Operation_Adolphe: "Intelligence: Yen Chau Sortie"
 VIN_Intel_Operation_Adolphe_desc: "The Na San garrison is probing toward Yen Chau. CEFEO controls the operation's timetable; this observer mission has no independent resolution effect."
 VIN_Intel_Operation_Camargue: "Intelligence: Route 1 Coastal Sweep"
 VIN_Intel_Operation_Camargue_desc: "CEFEO mobile groups and State of Vietnam divisions are securing the coast between Hue and Quang Tri. CEFEO controls the operation's timetable; this observer mission has no independent resolution effect."
