l_english:
 FRE_Operation_Bretagne: "Operation Bretagne"
 FRE_Operation_Bretagne_desc: "Secure §YPhat Diem and Ninh Binh§! in §YDong Bang Song Hong (Red River Delta)§!. The hold begins only once the Viet Minh commit divisions anywhere in the delta state or control either objective. French Union forces must then hold both for §Y7 consecutive days§!. Complete the hold by day §Y30§! for a clean success; later success is costly, and the operation ends on day §Y45§!. If the Viet Minh never engage, it is broken off without reward.\n\n§RDo not push into Thanh Hoa city§!: controlling it while the Viet Minh still own Thanh Hoa state causes Operational Overextension. Thanh Hoa is not an objective and does not count toward Bretagne.\n\nA clean result costs the Viet Minh §Y15 Campaign Supply§! and strengthens the French cause in the Struggle."
 FRE_Operation_Adolphe: "Operation Adolphe"
 FRE_Operation_Adolphe_desc: "Take and hold §YYen Chau§! in §YTay Bac Bo§! with French Union forces for §Y5 consecutive days§!. Losing the objective resets the hold. Complete it by day §Y20§! for a clean success; later success is costly, and the operation ends on day §Y30§!. Occupying Viet Minh-owned rear ground in Dong Bac Bo, Thanh Hoa, Nghe-Tinh or Quang Binh causes §ROperational Overextension§!.\n\nA clean result costs the Viet Minh §Y10 Campaign Supply§! and adds one grade of readiness to the next relief preparation."
 FRE_Operation_Camargue: "Operation Camargue"
 FRE_Operation_Camargue_desc: "Secure the highlighted Route 1 coastal provinces of §YVan Trinh and My Thuy§! in §YCoastal Trung Phan§!, between Hue and Quang Tri. The hold begins only once the Viet Minh or southern Viet Minh commit divisions to Coastal Trung Phan or Hue, or control either objective. French Union forces must then hold both for §Y7 consecutive days§!, reduced to §Y6§! if the Chanson garrison survived. Complete the hold by day §Y25§! for a clean success; later success is costly, and the operation ends on day §Y40§!. If the enemy never engage, it is broken off without reward. Occupying Viet Minh-owned rear ground causes §ROperational Overextension§!. The two State of Vietnam divisions raised for Camargue stand down when it ends.\n\nA clean result earns the State of Vietnam a measure of stability and war support and strengthens the cause of independence in the Struggle."
 FRE_Operation_Bretagne_Available_tt: "Available after §Y15 November 1952§!, or earlier under an accelerated operations program, once Lorraine has been decided or Na San has been prepared. The Indochina theatre must remain open, the operations cooldown must have ended, and no CEFEO operation, Viet Minh campaign, Laos raid or existing CEFEO war with the Viet Minh may be in progress."
 FRE_Operation_Adolphe_Available_tt: "Available after §Y15 March 1953§!, or earlier under an accelerated operations program, once the Battle of Na San has ended and French Union forces still control its airfield. The Indochina theatre must remain open, the operations cooldown must have ended, and no CEFEO operation, Viet Minh campaign, Laos raid or existing CEFEO war with the Viet Minh may be in progress."
 FRE_Operation_Camargue_Available_tt: "Available after §Y1 July 1953§!, or earlier under an accelerated operations program, once Hirondelle or Brochet has ended. The Indochina theatre must remain open, the operations cooldown must have ended, and no CEFEO operation, Viet Minh campaign, Laos raid or existing CEFEO war with the Viet Minh may be in progress."
 FRE_Operation_Bretagne_Launched: "§YOperation Bretagne Launched§!"
 FRE_Operation_Adolphe_Launched: "§YOperation Adolphe Launched§!"
 FRE_Operation_Camargue_Launched: "§YOperation Camargue Launched§!"
 FRE_OP_OBJ_HIRONDELLE: "Keep §Ytransport aircraft in CEFEO stock§!, or have the air assets delivered, for §Y14 consecutive days§! with light commitment, §Y10§! with standard commitment or §Y7§! with maximum commitment.\nThis is an airborne raid: §Yno province must be captured§!, including Lang Son or Ky Lua."
 FRE_OP_OBJ_MOUETTE: "Take and hold the highlighted §YPhu Nho Quan§! province in §YThanh Hoa§! state AND either §YNinh Binh§! or §YPhat Diem§! in §YDong Bang Song Hong§! for §Y5 consecutive days§! with French Union forces. Losing a required position resets the hold.\n§ROverextension§!: occupying Viet Minh-owned ground at Thanh Hoa city, or in Lang Son, Cao Bang, Dong Bac Bo, Nghe-Tinh or Quang Binh."
 FRE_OP_OBJ_BROCHET: "Hold the highlighted §YCentral Day River Line§! in §YDong Bang Song Hong§! with French Union forces on §Yday 35§!, the final deadline. The Viet Minh launch the attack.\nA clean result requires never losing the line; losing and retaking it gives a costly success. Not holding it on day 35 means failure.\n§ROverextension§!: occupying Viet Minh-owned ground in Lang Son, Cao Bang or the rear areas of Dong Bac Bo, Thanh Hoa, Nghe-Tinh or Quang Binh."
 FRE_OP_OBJ_BRETAGNE: "Hold BOTH highlighted provinces, §YPhat Diem and Ninh Binh§! in §YDong Bang Song Hong (Red River Delta)§!, with French Union forces for §Y7 consecutive days§!.\nCounting starts only once the Viet Minh commit divisions anywhere in that state or control either objective. If they never engage by §Yday 45§!, the operation is broken off without reward. Losing either objective resets the hold.\n§RThanh Hoa is not the objective§! and does not count toward Bretagne. Controlling Thanh Hoa city while the Viet Minh still own its state causes §ROperational Overextension§!."
 FRE_OP_OBJ_ADOLPHE: "Take and hold the highlighted §YYen Chau§! province in §YTay Bac Bo§! with French Union forces for §Y5 consecutive days§!. Losing it resets the hold.\n§ROverextension§!: occupying Viet Minh-owned rear ground in Dong Bac Bo, Thanh Hoa, Nghe-Tinh or Quang Binh."
 FRE_OP_OBJ_CAMARGUE: "Hold BOTH highlighted Route 1 coastal provinces, §YVan Trinh and My Thuy§! in §YCoastal Trung Phan§!, with French Union forces for §Y7 consecutive days§! (§Y6§! if the Chanson garrison survived).\nCounting starts only once the Viet Minh or southern Viet Minh commit divisions to Coastal Trung Phan or Hue, or control either objective. If they never engage by §Yday 40§!, the operation is broken off without reward. Losing either objective resets the hold.\n§ROverextension§!: occupying Viet Minh-owned rear ground in Dong Bac Bo, Thanh Hoa, Nghe-Tinh or Quang Binh."
 FRE_OP_OBJ_NONE: ""
 FRE_OP_CONTEST_ENGAGED: "\n§GThe Viet Minh have engaged.§! The consecutive hold now counts toward success."
 FRE_OP_CONTEST_WAITING: "\n§YThe Viet Minh have not yet engaged.§! Holding the objectives does not yet count toward success. If they never engage by the final deadline, the operation is broken off without reward."
 FRE_OP_CONTEST_NONE: ""
 FRE_Op_Mouette_Objective: "Operation Mouette: Phu Nho Quan and the Delta"
 FRE_Op_Mouette_Objective_desc: "$FRE_OP_OBJ_MOUETTE$\nComplete the hold by §Yday 30§! for a clean success; later success is costly. The final deadline is §Yday 45§!. The highlighted provinces are the targets."
 FRE_Op_Brochet_Objective: "Operation Brochet: Central Day River Line"
 FRE_Op_Brochet_Objective_desc: "$FRE_OP_OBJ_BROCHET$\nThe highlighted province is the target. There is no shorter hold that ends Brochet early: the line must be held on §Yday 35§!."
 FRE_Op_Bretagne_Objective: "Operation Bretagne: Phat Diem and Ninh Binh"
 FRE_Op_Bretagne_Objective_desc: "$FRE_OP_OBJ_BRETAGNE$\nComplete the hold by §Yday 30§! for a clean success; later success is costly. The final deadline is §Yday 45§!. The highlighted provinces are the targets."
 FRE_Op_Adolphe_Objective: "Operation Adolphe: Yen Chau"
 FRE_Op_Adolphe_Objective_desc: "$FRE_OP_OBJ_ADOLPHE$\nComplete the hold by §Yday 20§! for a clean success; later success is costly. The final deadline is §Yday 30§!. The highlighted province is the target."
 FRE_Op_Camargue_Objective: "Operation Camargue: Van Trinh and My Thuy"
 FRE_Op_Camargue_Objective_desc: "$FRE_OP_OBJ_CAMARGUE$\nComplete the hold by §Yday 25§! for a clean success; later success is costly. The final deadline is §Yday 40§!. The highlighted provinces are the targets."
 FRE_Operation_Timeout_tt: "At the final deadline, the operation ends. Its objective and hold requirements determine success, costly success or failure; an unengaged Bretagne or Camargue is broken off without reward. The war opened for the operation ends in white peace, without territorial gains."
 VIN_Campaign_Timeout_tt: "At the final deadline, the campaign ends. Meeting its objective and any required hold gives a clean or costly success according to the timetable; otherwise it fails. The campaign's war closes. Successful territorial campaigns award their designated states to the Viet Minh; limited battles do not transfer ownership."
 NLF_Dak_Doa_Timeout_tt: "If Dak Doa has not been held for seven consecutive days by day 45, the southern Viet Minh offensive fails. The separate war over the post ends in white peace, without changing ownership. Other wars continue."
 FRE_Abort_Limited_Operation_Effect_tt: "Break off the operation without reward. The war opened for it ends in white peace, without territorial gains."
