l_english:
 flavorita.1.t:0 "[GetNewspaperHeader]Aldo Moro Is Dead"
 flavorita.1.d:0 "Aldo Moro has been found dead in Rome. The Red Brigades seized the former prime minister in March, and the state refused a trade."
 flavorita.1.a:0 "Moro is dead."
 flavorita.1.b:0 "A former prime minister is dead."
 flavorita.2.t:0 "[GetNewspaperHeader]The Pope Is Shot"
 flavorita.2.d:0 "A gunman has wounded Pope John Paul II in St. Peter's Square. The pope is alive and in hospital."
 flavorita.2.a:0 "The pope is wounded."
 flavorita.2.b:0 "The pope has been shot."
 flavorita.3.t:0 "[GetNewspaperHeader]Italy Wins the World Cup"
 flavorita.3.d:0 "Italy has won the World Cup, beating West Germany in the final in Madrid."
 flavorita.3.a:0 "Italy are champions."
 flavorita.3.b:0 "Italy has won the cup."
 flavorita.4.t:0 "[GetNewspaperHeader]Mani Pulite"
 flavorita.4.d:0 "Magistrates in Milan have opened an inquiry into bribes and party money. It is already being called Mani Pulite, Clean Hands."
 flavorita.4.a:0 "The inquiry has begun."
 flavorita.4.b:0 "Milan is investigating."
