l_english:

# === CEFEO (merged from FRE_CEFEO_l_english.yml) ===
#### Metropole events ####
 FRE_Metropole.1.t:0 "A Convoy for Haiphong"
 FRE_Metropole.1.d:0 "The Commander-in-Chief in Indochina requests a materiel convoy: small arms, ammunition, engineering stores. The Ministry of Overseas France supports the request; the Finance Ministry, as ever, does not."
 FRE_Metropole.1.a:0 "Load the ships - full manifest."
 FRE_Metropole.1.b:0 "Half now, half after the next budget vote."
 FRE_Metropole.1.c:0 "The corps must manage with what it has."
 FRE_Metropole.2.t:0 "Reinforcements for the Corps"
 FRE_Metropole.2.d:0 "Hanoi asks for men. The conscript classes cannot legally be sent to Indochina, which leaves the Legion, the colonial regulars, and whatever volunteers the recruiting sergeants can charm."
 FRE_Metropole.2.a:0 "Embark a Legion battalion group."
 FRE_Metropole.2.b:0 "Volunteers and replacements only."
 FRE_Metropole.2.c:0 "Not one man more."
 FRE_Metropole.3.t:0 "Wings over Tonkin"
 FRE_Metropole.3.d:0 "The air staff in Hanoi reports that the war consumes transport aircraft faster than France builds them. They want Dakotas, Packets and crews, and they want them before the monsoon."
 FRE_Metropole.3.a:0 "Send the full air group."
 FRE_Metropole.3.b:0 "A dozen transports can be spared."
 FRE_Metropole.3.c:0 "The Armee de l'Air has other wars to plan for."
 FRE_Metropole.4.t:0 "The Dinassaut Flotillas"
 FRE_Metropole.4.d:0 "The navy proposes commissioning permanent river assault divisions for Indochina - armored barges and gunboats to take the war into the delta waterways."
 FRE_Metropole.4.a:0 "Commission the flotillas."
 FRE_Metropole.4.b:0 "The estuaries will have to police themselves."
 FRE_Metropole.5.t:0 "Administrators for Hanoi"
 FRE_Metropole.5.d:0 "The corps holds territory it cannot govern. Hanoi requests civil administrators, paymasters and magistrates - the unglamorous machinery that turns occupied ground into held ground."
 FRE_Metropole.5.a:0 "Second the civil servants."
 FRE_Metropole.5.b:0 "France is short of clerks as well as soldiers."
 FRE_Metropole.6.t:0 "The Artillery Park"
 FRE_Metropole.6.d:0 "Hanoi wants guns. The 105s that came out with the corps in 1946 are worn to the rifling, and the posts along Route Coloniale 4 are being overrun one by one because nothing can reach them but aircraft.\n\nThe artillery inspectorate points out that the same tubes are wanted in Germany."
 FRE_Metropole.6.a:0 "Ship the whole park."
 FRE_Metropole.6.b:0 "Two batteries, and they come out of the German allocation."
 FRE_Metropole.6.c:0 "The guns stay in Europe."
 FRE_Metropole.7.t:0 "Guns Against Armour and Aircraft"
 FRE_Metropole.7.d:0 "The request is for direct-fire guns to arm the blockhouses of the De Lattre Line, and light automatic cannon for the airfields at Hanoi and Haiphong.\n\nThe Assembly finds the second half of the request absurd. The Viet Minh have no aircraft. The staff reply, drily, that neither did they have artillery until Mao won his war."
 FRE_Metropole.7.a:0 "Send both. Assume the worst about China."
 FRE_Metropole.7.b:0 "Anti-tank guns only - there is no air threat."
 FRE_Metropole.7.c:0 "Refuse. The corps is not fighting a European army."
 FRE_Metropole.8.t:0 "The Fuel Allocation"
 FRE_Metropole.8.d:0 "Everything in this war moves on petrol: the transport squadrons, the river flotillas, the truck convoys that keep the delta posts alive. The tanks at Haiphong are drawn down, and the theatre is asking for a larger share of a national allocation that is already spoken for."
 FRE_Metropole.8.a:0 "Sail the tankers. Indochina gets its share."
 FRE_Metropole.8.b:0 "Half the allocation, and late."
 FRE_Metropole.8.c:0 "France has her own shortages."
 FRE_Metropole.9.t:0 "A Supplementary Cash Vote"
 FRE_Metropole.9.d:0 "The corps has run through its quarter's piastres. Auxiliaries must be paid, porters hired, informers kept sweet, and none of it appears in any budget line the Assembly recognises.\n\nA supplementary vote out of season is possible. It is also exactly the kind of thing the opposition reads aloud from the tribune."
 FRE_Metropole.9.a:0 "Vote the advance in full."
 FRE_Metropole.9.b:0 "Half now, the rest in the spring budget."
 FRE_Metropole.9.c:0 "The corps will live within its means."
 FRE_Metropole.10.t:0 "Paris Grows Restless"
 FRE_Metropole.10.d:0 "The tone of the cables from Paris has changed. Questions about expenditure arrive before questions about the enemy. The Assembly's defense committee has requested - for the third time - a schedule for 'the reduction of the effort'."
 FRE_Metropole.10.a:0 "Economize. Reassure them."
 FRE_Metropole.10.b:0 "The war effort comes first."
 FRE_Metropole.11.t:0 "The Assembly Balks"
 FRE_Metropole.11.d:0 "The credits passed by eleven votes, after a night session and two ministerial resignations. The next vote, everyone agrees, will fail unless something changes - in Indochina or in the government's arithmetic."
 FRE_Metropole.11.a:0 "Curtail operations to cut the casualty lists."
 FRE_Metropole.11.b:0 "Double down. Victory is the only argument they will hear."
 FRE_Metropole.12.t:0 "Paris Has Had Enough"
 FRE_Metropole.12.d:0 "The instruction arrives in plain language for once: no further offensive operations, no further requests for reinforcement. The Republic no longer intends to win the war in Indochina; it intends to leave it."
 FRE_Metropole.12.a:0 "One more appeal - beg if we must."
 FRE_Metropole.12.b:0 "So be it."
 FRE_Metropole.13.t:0 "Renewed Confidence"
 FRE_Metropole.13.d:0 "For the first time in memory, the cables from Paris contain something like optimism. The credits passed comfortably; the ministers speak of 'seeing it through'. The corps has bought itself time."
 FRE_Metropole.13.a:0 "Make it count."
 FRE_Metropole.20.t:0 "The Assembly Debates Indochina"
 FRE_Metropole.20.d:0 "The annual Indochina debate opens in the National Assembly. The right speaks of honor, the center of budgets, the left of 'la sale guerre'. Somewhere beneath the rhetoric, next year's war will be decided."
 FRE_Metropole.20.a:0 "Fight for the full credits."
 FRE_Metropole.20.b:0 "Hold the line, nothing more."
 FRE_Metropole.20.c:0 "Begin winding this misadventure down."

#### Allied events ####
 FRE_Allies.1.t:0 "Instructors for the National Army"
 FRE_Allies.1.d:0 "The French command offers instructors, depots and doctrine to expand the Vietnamese National Army. It is help, and it is also a reminder of who still writes the training manuals."
 FRE_Allies.1.a:0 "Welcome the instructors."
 FRE_Allies.1.b:0 "The National Army trains its own men."
 FRE_Allies.10.t:0 "Colonel Trinquier's Ledger"
 FRE_Allies.10.d:0 "The GCMA maquis cost money that appears in no budget. Colonel Trinquier explains, without quite explaining, how the highland networks might fund themselves - the crop the montagnards already grow, the trade that already exists, merely... administered."
 FRE_Allies.10.a:0 "Look away. The maquis pay for themselves."
 FRE_Allies.10.b:0 "Fund them from the official budget, whatever it costs."

#### Battle events ####
 FRE_Battles.1.t:0 "The Battle of Vinh Yen"
 FRE_Battles.1.d:0 "Giap has come down from the hills at last - two divisions in human waves against the Vinh Yen line, banners forward, bugles in the dark. This is the open battle the corps has begged for. It can be won, if we are willing to win it ugly."
 FRE_Battles.1.a:0 "Drop the napalm."
 FRE_Battles.1.b:0 "Break them with guns and bayonets."
 FRE_Battles.2.t:0 "The Battle of Mao Khe"
 FRE_Battles.2.d:0 "The 316th Division is across the river at Mao Khe, six kilometers from the Haiphong coal. The garrison is a few hundred men and the naval channel is still open - barely."
 FRE_Battles.2.a:0 "Bring the Dinassaut guns upriver."
 FRE_Battles.2.b:0 "Hold with the infantry."
 FRE_Battles.3.t:0 "The Day River Line"
 FRE_Battles.3.d:0 "Giap's third offensive breaks against the Day River, where Catholic militia and French regulars hold the dikes. The enemy is overextended at last - and so, if we are honest, are we."
 FRE_Battles.3.a:0 "Hold the line at any cost."
 FRE_Battles.3.b:0 "Bend, do not break."
 FRE_Battles.4.t:0 "The Hedgehog of Na San"
 FRE_Battles.4.d:0 "An entrenched camp in the Tai country, ringed with wire and supplied wholly by air: the Na San experiment. Giap is coming to test it. If the airbridge holds, his regiments will break on the wire; if it fails, we have built ourselves a trap."
 FRE_Battles.4.a:0 "Reinforce the camp by air."
 FRE_Battles.4.b:0 "The garrison stands alone."
 FRE_Battles.5.t:0 "The Meat Grinder of Hoa Binh"
 FRE_Battles.5.d:0 "The first phase succeeded: airborne and river columns seized Hoa Binh and planted a French salient across the enemy's north-south corridor. Giap has answered by committing three divisions against Route 6, the Black River posts, and the town itself. One road and one river now carry every shell and ration through country under fire.\n\nThe choice is now a clear wager. Operation Amarante will deliberately withdraw on day 105, concede Hoa Binh, preserve the field force, and continue the wider war. Holding keeps the objective and risks that force until day 210: success brings the larger reward, but a broken salient inflicts losses beyond an ordinary campaign defeat."
 FRE_Battles.5.a:0 "Retain Hoa Binh and risk the field force."
 FRE_Battles.5.b:0 "Withdraw on day 105 and preserve the field force."
 FRE_Battles.5.c:0 "The old study no longer governs the battle."

#### Dien Bien Phu ####
 FRE_DBP.1.t:0 "A Base in the Highlands"
 FRE_DBP.1.d:0 "Six battalions of paratroops hold the valley of Dien Bien Phu, astride the road to Laos. Engineers are already tearing up the airstrip's grass. Someone must command what the staff is calling the 'base aero-terrestre' - and someone must decide what it is for."
 FRE_DBP.1.a:0 "Colonel de Castries takes the camp."
 FRE_DBP.1.b:0 "Give it to the paratroop generals."
 FRE_DBP.2.t:0 "Beatrice and Gabrielle"
 FRE_DBP.2.d:0 "It begins at dusk: massed artillery - artillery we were assured could never reach these hills - falling on strongpoints Beatrice and Gabrielle. By midnight Beatrice is silent. The garrison waits for orders."
 FRE_DBP.2.a:0 "Counter-attack at once."
 FRE_DBP.2.b:0 "Consolidate the inner line."
 FRE_DBP.3.t:0 "Piroth's Guns"
 FRE_DBP.3.d:0 "Colonel Piroth promised that no Viet Minh gun would fire three rounds before his batteries found it. The enemy's guns are dug into the forward slopes, invisible, untouchable, and they fire all day. Piroth no longer leaves his dugout."
 FRE_DBP.3.a:0 "Improvise counter-battery tactics."
 FRE_DBP.3.b:0 "Trust the guns we have."
 FRE_DBP.4.t:0 "The Airbridge in the Monsoon"
 FRE_DBP.4.d:0 "The strip is cratered, the monsoon has come early, and the flak grows thicker every week. Supply is now parachutes or nothing - and half the parachutes drift into enemy lines."
 FRE_DBP.4.a:0 "Commit every transport we have."
 FRE_DBP.4.b:0 "Ration everything."
 FRE_DBP.5.t:0 "Washington's Answer"
 FRE_DBP.5.d:0 "There is a plan in Washington - Vulture, they call it - for American heavy bombers to break the siege in a single night. It requires only that the President agree, and he is asking questions about what happens on the second night."
 FRE_DBP.5.a:0 "Request Operation Vulture."
 FRE_DBP.5.b:0 "The camp fights alone."
 FRE_DBP.6.t:0 "The Final Assault"
 FRE_DBP.6.d:0 "The trenches have crept to within grenade range of the last strongpoints. Tonight the enemy comes with everything he has. There are no more reserves, no more orders worth giving - only the garrison, the wire, and the morning to reach."
 FRE_DBP.6.a:0 "Hold until dawn."
 FRE_DBP.7.t:0 "The Camp Holds"
 FRE_DBP.7.d:0 "Dawn, and the tricolor - torn, black with smoke - still flies over the central redoubt. The human waves have broken. For the first time, Giap's regiments stream back into the hills leaving their dead on the wire. The war has a different shape this morning."
 FRE_DBP.7.a:0 "The corps will remember this valley."
 FRE_DBP.8.t:0 "The Camp Falls"
 FRE_DBP.8.d:0 "The radio room at Isabelle transmits in clear now; there is no one left to encode for. Fifty-six days after the first shell, Dien Bien Phu is finished. What remains is arithmetic: how many men, and how they leave."
 FRE_DBP.8.a:0 "Fight to the last strongpoint."
 FRE_DBP.8.b:0 "Operation Albatross - break out south."
 FRE_DBP.10.t:0 "A Cable from Hanoi"
 FRE_DBP.10.d:0 "The French are asking for Vulture: carrier strikes and B-29s over Dien Bien Phu. The Joint Chiefs are split, the Congress leadership is cold, and the word 'atomic' has appeared in one memorandum already."
 FRE_DBP.10.a:0 "Send the bombers."
 FRE_DBP.10.b:0 "No wider war."

#### Command rotation ####
 FRE_Command.1.t:0 "Le Roi Jean"
 FRE_Command.1.d:0 "General Jean de Lattre de Tassigny steps off the aircraft at Tan Son Nhut in dress whites, ignores the prepared evacuation briefings, and informs the assembled staff that wives and families will remain in Hanoi. The panic dies in the room where it stood."
 FRE_Command.1.a:0 "The corps has a commander again."
 FRE_Command.2.t:0 "The Death of Bernard de Lattre"
 FRE_Command.2.d:0 "Lieutenant Bernard de Lattre, the Marshal's only son, has been killed holding the rock of Ninh Binh against the 308th Division. The Commander-in-Chief was handed the signal during the morning conference. He read it, folded it, and continued the briefing."
 FRE_Command.2.a:0 "He buries his son and stays at his post."
 FRE_Command.2.b:0 "Grant him leave to mourn."
 FRE_Command.3.t:0 "The Marshal Is Dying"
 FRE_Command.3.d:0 "The doctors in Paris have found the cancer, and the Marshal has been told. He continues to cable Hanoi daily - orders, exhortations, demands for aggressive patrolling - from a hospital bed he will not leave."
 FRE_Command.3.a:0 "Prepare the succession quietly."
 FRE_Command.4.t:0 "The Death of de Lattre"
 FRE_Command.4.d:0 "Marshal de Lattre de Tassigny is dead in Paris, eleven months after he took the theatre and one year almost to the day after his son fell at Ninh Binh. France gives him a state funeral. Indochina gives him a moment of silence, and then the war resumes."
 FRE_Command.4.a:0 "General Salan assumes command."
 FRE_Command.4.b:0 "The staff runs the war for now."
 FRE_Command.5.t:0 "Navarre Takes Command"
 FRE_Command.5.d:0 "General Henri Navarre - cavalry, intelligence, a career of clean staff work - assumes command of a war he saw for the first time last month. He has been given no instructions that anyone can find in writing, which he takes as freedom of action."
 FRE_Command.5.a:0 "A new broom for an old war."
 FRE_Command.6.t:0 "The Navarre Plan"
 FRE_Command.6.d:0 "The new Commander-in-Chief presents his plan: rebuild a mobile battle corps, keep the enemy off balance through the coming campaign season, and force a decisive engagement on favorable ground. Paris has heard plans before. This one comes with a schedule."
 FRE_Command.6.a:0 "Seek the decisive battle."
 FRE_Command.6.b:0 "Husband our strength."

#### Flavor pool ####
 FRE_Flavor.1.t:0 "The Operation X Ledger"
 FRE_Flavor.1.d:0 "A ledger exists. It records, in a tidy staff hand, the movement of highland opium on French airframes and the francs that came back as rifles for the maquis. A copy may already be in a desk drawer in Paris."
 FRE_Flavor.1.a:0 "Bury the story."
 FRE_Flavor.1.b:0 "Shut Operation X down."
 FRE_Flavor.2.t:0 "Echoes of the Affaire des Generaux"
 FRE_Flavor.2.d:0 "The Revers Report scandal will not die. Names of serving officers keep surfacing in the Paris weeklies, each leak timed for a budget vote. Someone inside the establishment is still feeding the fire."
 FRE_Flavor.2.a:0 "Hunt down the leakers."
 FRE_Flavor.2.b:0 "Let it blow over."
 FRE_Flavor.3.t:0 "Deserters in the Ranks"
 FRE_Flavor.3.d:0 "The Deuxieme Bureau reports Legion deserters - Germans, mostly - broadcasting for the Viet Minh in three languages. A handful have come back through the lines, half-starved and asking for amnesty."
 FRE_Flavor.3.a:0 "Quiet amnesty for those who return."
 FRE_Flavor.3.b:0 "Courts-martial, publicly."
 FRE_Flavor.4.t:0 "The Monsoon Swallows the Roads"
 FRE_Flavor.4.d:0 "The RC1 is under a meter of brown water and the airfields are mud. The enemy, who carries his war on bicycles and backs, minds this far less than we do."
 FRE_Flavor.4.a:0 "Push the convoys through."
 FRE_Flavor.4.b:0 "Wait out the rains."
 FRE_Flavor.5.t:0 "The MAAG Mission Arrives"
 FRE_Flavor.5.d:0 "The American Military Assistance Advisory Group has set up offices in Saigon - crew-cut colonels with clipboards, an evangelical faith in logistics, and signature authority over the aid we asked for."
 FRE_Flavor.5.a:0 "Give the Americans the full tour."
 FRE_Flavor.5.b:0 "Keep them at arm's length."
 FRE_Flavor.6.t:0 "Trucks on the Chinese Border"
 FRE_Flavor.6.d:0 "Air reconnaissance counts four hundred Molotova trucks on the Cao Bang roads in a single week. Beyond the border, Chinese instructors are rebuilding Giap's regiments into divisions with artillery."
 FRE_Flavor.6.a:0 "Raid the supply corridors."
 FRE_Flavor.6.b:0 "Dig in along the RC4."
 FRE_Flavor.7.t:0 "The Emperor's Casinos"
 FRE_Flavor.7.d:0 "The Binh Xuyen have offered the corps a share of the Grand Monde casino takings in exchange for a free hand on the Saigon waterfront. His Majesty's court, which has its own arrangement, advises against asking questions."
 FRE_Flavor.7.a:0 "Take the cut."
 FRE_Flavor.7.b:0 "Refuse the dirty money."
 FRE_Flavor.8.t:0 "The Haiphong Customs Dispute"
 FRE_Flavor.8.d:0 "The State of Vietnam claims the Haiphong customs revenue under the independence accords. The corps collects it under military necessity. Both sides have lawyers; only one side has a garrison."
 FRE_Flavor.8.a:0 "The port stays under military control."
 FRE_Flavor.8.b:0 "Hand the customs house to Saigon."
 FRE_Flavor.9.t:0 "Le Monde Prints the Casualty Lists"
 FRE_Flavor.9.d:0 "Someone has given Le Monde the true casualty returns for the year - not the communique figures, the real ones. The piece runs tomorrow under the headline 'Le prix du silence'."
 FRE_Flavor.9.a:0 "Lean on the censors."
 FRE_Flavor.9.b:0 "The Republic has a free press."
 FRE_Flavor.10.t:0 "Ambush on the Song Day"
 FRE_Flavor.10.d:0 "A Dinassaut convoy took recoilless rifle fire from both banks at the Song Day bend - one LCM burning, eleven men lost. The river war has rules, and the enemy has just rewritten them."
 FRE_Flavor.10.a:0 "Sweep the riverbanks."
 FRE_Flavor.10.b:0 "Reroute the convoys."
 FRE_Flavor.11.t:0 "An Oath in the Highlands"
 FRE_Flavor.11.d:0 "The maquis chiefs of the high country have asked the Commander-in-Chief to attend the buffalo sacrifice at which their young men take the rifle oath. It is three days by air and mule, and the staff calls it theatre. The chiefs do not."
 FRE_Flavor.11.a:0 "The commander attends in person."
 FRE_Flavor.11.b:0 "Send a staff colonel with gifts."
 FRE_Flavor.12.t:0 "The Pasteur Comes Home"
 FRE_Flavor.12.d:0 "The hospital ship Pasteur docks at Marseille with eight hundred wounded. The port workers' union has voted to 'welcome' her; the veterans' associations will be there too. It will be a scene, one way or the other."
 FRE_Flavor.12.a:0 "Full honors on the quay."
 FRE_Flavor.12.b:0 "No cameras at the docks."
 FRE_Flavor.13.t:0 "La Sale Guerre"
 FRE_Flavor.13.d:0 "Dockworkers in Marseille are refusing to load ships for Indochina; in the Assembly, deputies read the names of the dead into the record. 'The dirty war', the placards say. The government must decide how much order to buy, and at what price."
 FRE_Flavor.13.a:0 "Break up the dockside strikes."
 FRE_Flavor.13.b:0 "Let them march."
 FRE_Flavor.14.t:0 "The Photographers of Indochine"
 FRE_Flavor.14.d:0 "Life, Paris Match and three wire services want accreditation for the spring operations. The last time photographers reached the front unescorted, the pictures cost us a budget vote. The time before, they won us one."
 FRE_Flavor.14.a:0 "Give them the front line."
 FRE_Flavor.14.b:0 "Guided tours of the rear only."

#### Wind-down ####
 FRE_Winddown.1.t:0 "Ceasefire Orders from Paris"
 FRE_Winddown.1.d:0 "The signal is short: hostilities in Indochina are concluded; the corps will prepare for phased withdrawal; further instructions follow. Eight years of war end in forty words, transmission time 0400."
 FRE_Winddown.1.a:0 "Stand the corps down."
 FRE_Winddown.2.t:0 "The Evacuation of Haiphong"
 FRE_Winddown.2.d:0 "The quays of Haiphong are black with people - soldiers embarking, and beside them civilians by the hundred thousand who will not stay to meet the new order in the North. There is not enough shipping in the theatre to carry them all. The Americans are offering theirs."
 FRE_Winddown.2.a:0 "Accept the American sealift."
 FRE_Winddown.2.b:0 "We leave in our own bottoms."
 FRE_Winddown.3.t:0 "The Phased Withdrawal"
 FRE_Winddown.3.d:0 "The timetable is agreed: garrison by garrison, the corps hands its posts to the Vietnamese National Army and marches to the ports. What remains to be decided is the pace - and how much of eight years' accumulated stores, positions and knowledge is handed over rather than abandoned."
 FRE_Winddown.3.a:0 "Expedite. Bring the boys home."
 FRE_Winddown.3.b:0 "A deliberate, orderly handover."
 FRE_Winddown.4.t:0 "The Last Ship Out"
 FRE_Winddown.4.d:0 "A guard of honor, a folded flag, a band playing thin against the harbor wind. The last elements of the Corps Expeditionnaire Francais d'Extreme-Orient embark. Behind them: the graves of ninety thousand, and a country that must now decide what it will be without them."
 FRE_Winddown.4.a:0 "The corps' war is over."
 FRE_Winddown.5.t:0 "The Corps Comes Home"
 FRE_Winddown.5.d:0 "The transports from Indochina are docking at Marseille and Toulon. The men come down the gangways into a France that has, for the most part, already decided not to talk about it."
 FRE_Winddown.5.a:0 "An honorable chapter closes."
 FRE_Winddown.5.b:0 "Never again such a war."

#### Operation commitment (FRE_Ops namespace) ####
 FRE_Ops.1.t:0 "How Far Do We Commit?"
 FRE_Ops.1.d:0 "The staff have laid out the operation on the map table and the question is no longer whether, but how much. Every battalion committed here is a battalion not holding the delta, and every piastre spent is a question the Assembly will ask in the spring.\n\nWar Credits available: §Y[?FRE.FRE_War_Credits|0]§!\nMetropole Patience: §Y[?FRE.FRE_Metropole_Patience|0]§!/100"
 FRE_Ops.1.a:0 "A reconnaissance in force - one groupement mobile"
 FRE_Ops.1.b:0 "A proper operation - two groupements and the paratroopers"
 FRE_Ops.1.c:0 "Everything we have - and let Paris count the cost"
 FRE_Ops.1.e:0 "The chest is empty. The operation is cancelled before it begins."
 FRE_Ops.2.t:0 "The Operation Has Run Its Course"
 FRE_Ops.2.d:0 "The columns are at the end of their supply lines and the enemy has not broken. The staff want the order to disengage. The Etat-Major in Saigon wants a result to send home.\n\nOne of them is going to be disappointed."
 FRE_Ops.2.a:0 "Press on. We did not come this far to withdraw."
 FRE_Ops.2.b:0 "Break off. Bank what we have taken."
 FRE_Ops.10.t:0 "The Objective Falls"
 FRE_Ops.10.d:0 "The position is ours."
 FRE_Ops.10.a:0 "Signal Saigon."
 FRE_Ops.11.t:0 "The Attack Is Broken"
 FRE_Ops.11.d:0 "The columns are falling back."
 FRE_Ops.11.a:0 "Cover the withdrawal."
 FRE_Ops.12.t:0 "The Operation Lapses"
 FRE_Ops.12.d:0 "Neither side can force a decision."
 FRE_Ops.12.a:0 "Take stock."
 FRE_Ops.20.t:0 "The Expeditionary Corps Is Held"
 FRE_Ops.20.d:0 "The French columns came on with armour and aircraft and went back the way they came. Our units held the ridgelines, gave ground where ground was worth nothing, and took it back when the trucks turned around.\n\nThe cadres will study this one for a long time.\n\nEvery operation the French mount and fail to win is an argument made in Paris on our behalf."
 FRE_Ops.20.a:0 "The people's war is patient."
 FRE_Ops.20.b:0 "Note it."
 FRE_Ops.21.t:0 "The Expeditionary Corps Breaks Through"
 FRE_Ops.21.d:0 "The French have taken the position. Our units disengaged rather than be encircled, which is the correct decision and an expensive one.\n\nThe villages in the sector will pay for it, and the cadres who promised protection will have to answer for that promise.\n\nThe war is long. This week belongs to Saigon."
 FRE_Ops.21.a:0 "Regroup. Rebuild. Return."
 FRE_Ops.21.b:0 "Note it."

# === Dien Bien Response (merged from FRE_Dien_Bien_Response_l_english.yml) ===
 FRE_Dien_Bien.1.t:0 "The Defense of Dien Bien Phu"
 FRE_Dien_Bien.1.d:0 "The Viet Minh have committed their main force to the valley. The camp remains an airhead surrounded by high ground, and every plan now trades men, aircraft, and political credit against time. A conventional defense preserves flexibility but cannot make the airstrip secure. Maximum reinforcement may keep the works intact longer, at the cost of binding the expeditionary reserve to one basin. Operation Condor can try to reopen a land corridor after the siege closes. An appeal for Operation Vulture risks widening the war while leaving the final decision in Washington.\n\nWhatever is chosen, the camp is not declared saved in advance. It must remain outside Viet Minh hands until their campaign is spent."
 FRE_Dien_Bien.1.a:0 "Hold with the garrison and scheduled airlift."
 FRE_Dien_Bien.1.b:0 "Send the reserves and maintain the airbridge at any cost."
 FRE_Dien_Bien.1.c:0 "Prepare Operation Condor to reopen the corridor."
 FRE_Dien_Bien.1.e:0 "Ask Washington for Operation Vulture."

 FRE_Dien_Bien.2.t:0 "American Aircraft Over the Valley"
 FRE_Dien_Bien.2.d:0 "Washington has authorized air support for the camp. New parachutes, ammunition, and radio equipment are already entering the airbridge, while American crews begin striking the roads and gun positions around the basin. The aid buys time and firepower; it does not remove the Viet Minh from the heights or decide whether the position can hold."
 FRE_Dien_Bien.2.a:0 "Use every hour they have bought us."
 FRE_Dien_Bien.3.t:0 "Washington Refuses Vulture"
 FRE_Dien_Bien.3.d:0 "The answer from Washington is no. The President will not widen the war without allied commitments and congressional support, and neither exists. The camp will receive no American bomber offensive. Its garrison must now survive on the airlift and the resources already committed from Indochina."
 FRE_Dien_Bien.3.a:0 "Then the corps fights with what it has."
 FRE_Dien_Bien.4.t:0 "Operation Condor Opens the Corridor"
 FRE_Dien_Bien.4.d:0 "The relief columns have linked the outer positions to the camp and kept the route open through a week of counterattacks. Wounded men and exhausted units are moving out while ammunition and replacements move in. The valley remains contested, but the garrison is no longer fighting as an isolated pocket and the siege timetable has been set back."
 FRE_Dien_Bien.4.a:0 "Hold the route and rebuild the inner line."

 FRE_Dien_Bien.5.t:0 "The Dien Bien Phu Ledger"
 FRE_Dien_Bien.5.d_held:0 "The Viet Minh campaign has expired with the camp still in French-aligned hands. Scheduled airlift and the ordinary garrison plan proved sufficient. The valley remains remote and expensive, but Paris can now claim that the position did what it was built to do: draw in Giap's main force and survive it."
 FRE_Dien_Bien.5.d_reinforced:0 "The Viet Minh campaign has expired against a camp sustained by the whole expeditionary reserve. The commitment was costly, but the airbridge, replacement battalions, and rebuilt works kept the central position intact through the final deadline. Paris must now pay for the wager it demanded, and can also claim its return."
 FRE_Dien_Bien.5.d_condor:0 "Operation Condor reopened the approaches after the valley was invested, and the corridor remained useful long enough to relieve the garrison and break the siege timetable. The camp has survived the Viet Minh campaign. The result belongs to the troops who held the basin and the columns that reached them, not to a promise made before either task was done."
 FRE_Dien_Bien.5.d_vulture:0 "American air support bought the time the garrison needed. The Viet Minh campaign has expired without taking the camp, and Operation Vulture can be presented as the intervention that preserved the French position. It also made the war visibly international, a price that will follow every later negotiation."
 FRE_Dien_Bien.5.d_fall_standard:0 "The standard defense has failed. The airstrip closed, the inner strongpoints were reduced, and the camp is now in Viet Minh hands. The wider campaign result and the political shock will be recorded elsewhere; the expeditionary corps must also account for the garrison and formations lost in the valley."
 FRE_Dien_Bien.5.d_fall_max:0 "Maximum reinforcement has turned defeat into catastrophe. The reserves, guns, and transport effort committed to keep the camp alive are trapped with it, and the losses exceed those of an ordinary failed defense. Paris demanded that the valley be held at any cost. The account has arrived."
 FRE_Dien_Bien.5.d_fall_condor:0 "Operation Condor could not save the camp. The relief columns either failed to reopen the approaches or opened them too briefly to reverse the siege. Any route secured before the final collapse allowed part of the garrison to escape, but the valley and the campaign objective belong to the Viet Minh."
 FRE_Dien_Bien.5.d_fall_vulture:0 "Air power did not save the camp. Whether Washington limited its aid or committed openly, the Viet Minh closed the strip, survived the strikes, and took the central position. The expeditionary corps has lost the valley while the diplomatic cost of asking another power to widen the war remains."
 FRE_Dien_Bien.5.d_inconclusive:0 "The fighting ended without the camp being taken and without the Viet Minh offensive exhausting itself against the final deadline. The defensive plan is closed without claiming a victory; the wider war or an armistice, rather than this ledger, ended the immediate contest."
 FRE_Dien_Bien.5.d_superseded:0 "A wider settlement has overtaken the siege. The garrison dispositions, relief plans, and appeals for outside air power are being unwound under the terms governing the whole theatre. No separate defensive victory or defeat will be awarded."
 FRE_Dien_Bien.5.a:0 "Close the camp's operational ledger."

 VIN_Dien_Bien.1.t:0 "The Defense in the Valley"
 VIN_Dien_Bien.1.d_held:0 "The colonial camp remains outside our hands after the offensive's final deadline. Airlift, reinforcements, or a reopened corridor kept the position alive long enough for the assault divisions to spend their strength. The valley has not decided the war in our favor."
 VIN_Dien_Bien.1.d_fall:0 "The camp at Dien Bien Phu is ours. Reinforcements, relief columns, and foreign aircraft changed the cost and timing of the siege, but none changed its objective. The central position has fallen, and the campaign now carries that result into the struggle and the negotiations to come."
 VIN_Dien_Bien.1.d_inconclusive:0 "The battle ended without the camp falling and without the enemy proving that it could survive the full campaign. The divisions leave the valley because the shooting or the wider war has stopped, not because either operational plan earned its best result."
 VIN_Dien_Bien.1.d_superseded:0 "A wider settlement has overtaken the battle in the valley. The campaign closes without a separate Dien Bien Phu battlefield result, and the abandoned positions will be disposed of under the terms governing the whole theatre."
 VIN_Dien_Bien.1.a:0 "The campaign has spoken."

# === Hoa Binh Response (merged from FRE_Hoa_Binh_Response_l_english.yml) ===
 FRE_Hoa_Binh.1.t:0 "The Hoa Binh Salient"
 FRE_Hoa_Binh.1.d_withdrawal:0 "Operation Amarante has carried the garrison, guns, and mobile groups back along Route 6 in successive bounds. Hoa Binh and its campaign objective have been deliberately conceded, but the wider Indochina War continues. The recovered formations, equipment, and operational credits can now reinforce the Delta and improve the preparations at Na San. Hanoi has won the corridor; CEFEO has preserved the field force."
 FRE_Hoa_Binh.1.d_held:0 "The last Viet Minh assaults have ebbed with the tricolour still over Hoa Binh. The salient remains exposed and dependent upon Route 6, but Giap's campaign has spent itself before breaking it. Paris will fund the command that sustained the wager, and the political and operational rewards now exceed the resources committed to the defense."
 FRE_Hoa_Binh.1.d_lost_hold:0 "The wager has failed. Route 6 is cut, the Black River posts are falling back, and Hoa Binh belongs to Giap's divisions. The reserves and equipment committed in place of Operation Amarante cannot now be extracted in good order. CEFEO must absorb losses beyond the ordinary cost of losing the campaign, while Paris counts the broken salient as proof that the warning was ignored."
 FRE_Hoa_Binh.1.d_lost:0 "The salient has broken before Operation Amarante could extract it. Route 6 is cut, the Black River posts are falling back, and Hoa Binh belongs to Giap's divisions. The planned force-preservation payoff has been lost; what remains is the ordinary cost of a Viet Minh battlefield victory."
 FRE_Hoa_Binh.1.d_inconclusive:0 "The counteroffensive ended without a decisive assault on the salient and without the staff carrying out its full plan. Hoa Binh remains on the ledger, but the campaign has settled nothing about whether it can be held the next time Giap concentrates against it."
 FRE_Hoa_Binh.1.d_superseded:0 "Events elsewhere have overtaken the contest for Hoa Binh. The salient is being disposed of under the wider settlement, and neither the planned withdrawal nor the attempt to hold it will be recorded as a battlefield result."
 FRE_Hoa_Binh.1.a:0 "Close the operation's ledger."

 VIN_Hoa_Binh.1.t:0 "The Corridor Through Hoa Binh"
 VIN_Hoa_Binh.1.d_withdrawal:0 "The French have carried out a disciplined withdrawal from Hoa Binh. Their columns escaped down Route 6, but the salient is gone and the north-south corridor is open again. They may preserve their battalions; they cannot preserve the purpose for which those battalions were sent into the hills."
 VIN_Hoa_Binh.1.d_held:0 "The offensive has spent itself against Hoa Binh. Route 6 remained open just often enough, French aircraft kept the strongpoints supplied, and the garrison is still in the town. Our divisions must disengage without the corridor they were sent to recover."
 VIN_Hoa_Binh.1.d_lost:0 "Hoa Binh is ours. The salient collapsed under pressure on the town, Route 6, and the Black River posts before the French could extract it in good order. The corridor is open and the Muong highlands no longer screen the Delta's western flank."
 VIN_Hoa_Binh.1.d_inconclusive:0 "The campaign ended without the salient changing hands and without a final French decision to abandon it. Hoa Binh remains an exposed post across the corridor, and the divisions withdraw knowing the same ground may have to be fought over again."
 VIN_Hoa_Binh.1.d_superseded:0 "A wider settlement has overtaken the battle for Hoa Binh. Neither the French salient nor our counteroffensive will have a separate battlefield result outside the terms now governing the whole theatre."
 VIN_Hoa_Binh.1.a:0 "The campaign is decided."

# === Northwest Response (merged from FRE_Northwest_Response_l_english.yml) ===
 FRE_Northwest.1.t:0 "Operation Lorraine"
 FRE_Northwest.1.d_active:0 "Giap's divisions are moving through the Tai country. The object of Lorraine is not to retake the Northwest directly, but to make that advance unaffordable: four mobile groups can drive up the Clear River while paratroopers fall on the depots at Phu Doan. If Hanoi turns its divisions east, Na San gains time. If it does not, the stores feeding the offensive may be destroyed.\n\nThe danger lies in the return march. Every kilometer beyond the delta lengthens a road the Viet Minh can cut, and a force sent against the depots is a force absent from the highlands. Salan can authorize the full thrust, limit the operation to a sharp raid, or keep the mobile groups around the airhead."
 FRE_Northwest.1.d_planned:0 "The staff has completed its study for a diversion up the Clear River. Mobile groups, armor, river craft, and an airborne group can be assembled against the Viet Minh depots around Phu Doan if Hanoi opens its expected Northwest offensive.\n\nUntil that campaign begins, Lorraine remains a contingency rather than an independent war."
 FRE_Northwest.1.a:0 "Drive on Phu Doan with the mobile groups."
 FRE_Northwest.1.b:0 "Raid the depots, then withdraw at once."
 FRE_Northwest.1.c:0 "Keep the mobile groups for Na San."
 FRE_Northwest.1.e:0 "There is no mobile reserve to spend."
 FRE_Northwest.1.d:0 "File the plan until the Northwest erupts."

 FRE_Northwest.2.t:0 "The Reckoning of Lorraine"
 FRE_Northwest.2.d_success:0 "Lorraine did what Salan demanded of it. The thrust into the Viet Minh rear either broke the Northwest offensive or compelled Hanoi to abandon it, and the mobile groups have returned with the initiative briefly restored. The cost was substantial, but Paris can point to a strategic result rather than a collection of captured stores."
 FRE_Northwest.2.d_limited:0 "The columns found the depots and destroyed what they could carry neither away nor count, but the Northwest offensive continued. Lorraine has produced a tactical success without deciding the campaign for which it was launched. The withdrawal matters as much as the advance: the mobile groups are home before the road could close behind them."
 FRE_Northwest.2.d_failure:0 "The diversion failed to divert. Giap kept his main force in the Northwest while local regiments closed on the return road, leaving the mobile groups to fight their way back toward the delta. The stores taken around Phu Doan do not compensate for the vehicles, time, and confidence left along the Clear River."
 FRE_Northwest.2.d_withheld:0 "There will be no great thrust up the Clear River. The mobile groups and their transport have remained with the highland airheads, accepting that Viet Minh depots will go untouched in exchange for a deeper defense around Na San. Lorraine survives only as the operation the corps chose not to fight."
 FRE_Northwest.2.d_superseded:0 "Events have overtaken Lorraine. A wider armistice or the collapse of the theatre has arrived before the operation could acquire a military meaning, and the columns have been stood down without claiming a victory or accepting a defeat."
 FRE_Northwest.2.a:0 "Enter the result in the campaign journal."

 VIN_Northwest.1.t:0 "The French Diversion Ends"
 VIN_Northwest.1.d_success:0 "The French thrust into our eastern rear has achieved its purpose. Whether through lost stores, diverted formations, or the pressure placed on the base areas, Lorraine helped break the Northwest offensive. The General Staff must treat the road network behind the front as a battlefield in its own right."
 VIN_Northwest.1.d_limited:0 "French columns reached the rear depots and destroyed stores before turning back toward the delta, but they did not decide the Northwest Campaign. Lorraine was a costly warning: an army advancing west cannot leave every road and warehouse in the Viet Bac to local troops."
 VIN_Northwest.1.d_failure:0 "The French diversion has withdrawn without changing the Northwest battle. Local forces harried the long road home while the main divisions remained with the campaign objective. The enemy found that a raid into the rear is not the same thing as seizing the initiative."
 VIN_Northwest.1.d_withheld:0 "The expected French drive into the Viet Bac never came. Reconnaissance instead reports the mobile groups concentrating around Na San and the Tai airheads. Our depots are safe, but the ground ahead will be more heavily defended."
 VIN_Northwest.1.d_superseded:0 "The French Lorraine plan has been overtaken by a wider armistice or the end of the theatre. Its columns are standing down, and neither side can claim that the unfinished diversion decided the Northwest battle."
 VIN_Northwest.1.a:0 "The lesson belongs to the next campaign."
