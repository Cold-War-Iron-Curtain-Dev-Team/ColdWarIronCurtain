l_english:

# === CEFEO (merged from FRE_CEFEO_l_english.yml) ===
#### Metropole events ####
 FRE_Metropole.1.t:0 "A Convoy for Haiphong"
 FRE_Metropole.1.d:0 "The expeditionary command has asked Paris to clear a cargo of small arms, ammunition and engineering stores for Haiphong. Once landed, the shipment will go by rail and road to the depots that supply the Tonkin garrisons. The requisition includes cash for the corps to purchase additional supplies in Indochina.\n\nThe Ministry of Overseas France supports the full manifest, arguing that shortages become dearer once the field command has to buy at short notice. The Finance Ministry would release a smaller cargo from existing stocks and leave the cash request off the docket. The cabinet has to decide what to authorize before the ships load."
 FRE_Metropole.1.a:0 "Approve the full manifest and cash advance."
 FRE_Metropole.1.b:0 "Release a half shipment from existing stocks."
 FRE_Metropole.1.c:0 "The corps must manage with what it has."
 FRE_Metropole.2.t:0 "Reinforcements for the Corps"
 FRE_Metropole.2.d:0 "The expeditionary command is asking for formed reinforcements as well as replacements. Battalions in Indochina can absorb individual drafts, but filling their rolls will not give the commander another formation to relieve garrisons and return experienced units to reserve.\n\nThe use of metropolitan conscripts in Indochina is politically unacceptable in Paris. The Foreign Legion and other professional troops already bear much of the load, and the army also has commitments in Europe and North Africa. The cabinet can meet the request only by deciding which of those commitments can wait."
 FRE_Metropole.2.a:0 "Send the Legion and the replacement draft."
 FRE_Metropole.2.b:0 "Send replacements without a formed unit."
 FRE_Metropole.2.c:0 "Keep the reinforcements in reserve."
 FRE_Metropole.3.t:0 "Wings over Tonkin"
 FRE_Metropole.3.d:0 "The air staff in Hanoi has asked the Armee de l'Air for more transports. The crews at Gia Lam have to fit supply sorties around the movement of troops and the evacuation of wounded. An unserviceable aircraft can leave an isolated garrison waiting for a ration delivery that no truck convoy can make in its place.\n\nThe air staff in Paris can provide a limited delivery from available aircraft. A full allotment also means paying to sustain the larger air group. The cabinet must decide whether to give Tonkin a margin for breakdowns and losses or keep that capacity in France."
 FRE_Metropole.3.a:0 "Send the full air group."
 FRE_Metropole.3.b:0 "A dozen transports can be spared."
 FRE_Metropole.3.c:0 "Retain the transports in France."
 FRE_Metropole.4.t:0 "The Dinassaut Flotillas"
 FRE_Metropole.4.d:0 "The Navy has asked Paris to authorize permanent river assault divisions, known as Dinassauts, for Indochina. The proposal brings armed landing craft and embarked infantry under one command so that each flotilla can escort supply traffic or land troops without waiting for a separate expedition to be assembled.\n\nIn the Red River Delta, a post cut off by road may still be reached by water. Naval officers argue that regular crews and a permanent establishment are worth the extra commitment. Paris must decide whether to approve the organization or leave the command to make do with its existing craft."
 FRE_Metropole.4.a:0 "Commission the flotillas."
 FRE_Metropole.4.b:0 "Keep the existing naval establishment."
 FRE_Metropole.5.t:0 "Administrators for Hanoi"
 FRE_Metropole.5.d:0 "The authorities in Hanoi have asked the Ministry of Overseas France to second civil servants to Indochina. In districts held by the expeditionary corps, military officers are signing requisitions and settling pay disputes that would normally go to civil offices. The command wants trained staff who can keep accounts and deal with local authorities without drawing more officers away from their units.\n\nThe ministry would have to fill those posts from its own establishment. The cabinet must weigh the value of a functioning civil service in the districts against the cost of sending scarce personnel overseas."
 FRE_Metropole.5.a:0 "Second the civil servants."
 FRE_Metropole.5.b:0 "Keep the civil servants at their present posts."
 FRE_Metropole.6.t:0 "The Artillery Park"
 FRE_Metropole.6.d:0 "The artillery staff in Hanoi has requested fresh field guns. Existing batteries have to cover both fixed posts and mobile units; guns sent out with a relief column leave fewer available to defend the depots and garrisons behind it. Worn guns make those allocations tighter still.\n\nThe artillery inspectorate in Paris has orders to rebuild stocks for the army in Europe, including the formations in Germany. It can spare a smaller consignment, but meeting the whole request calls for a separate financial commitment. The cabinet must settle the allocation before the guns are assigned elsewhere."
 FRE_Metropole.6.a:0 "Ship the full artillery allotment."
 FRE_Metropole.6.b:0 "Release half the requested field guns."
 FRE_Metropole.6.c:0 "The guns stay in Europe."
 FRE_Metropole.7.t:0 "Guns Against Armour and Aircraft"
 FRE_Metropole.7.d:0 "The expeditionary staff is asking for direct-fire guns for its defensive posts and light automatic cannon for its airfields. Staff officers point out that both categories have a use against targets on the ground. The guns are also a precaution against heavier weapons reaching the Viet Minh from across the Chinese frontier.\n\nIn Paris, the argument is over how much equipment to reserve for a threat the command has not yet had to face. A reduced allotment would still give the corps weapons of both kinds. The cabinet must decide how far it is willing to draw down the metropolitan reserve."
 FRE_Metropole.7.a:0 "Approve both allotments in full."
 FRE_Metropole.7.b:0 "Halve both gun allotments."
 FRE_Metropole.7.c:0 "Keep both types in reserve."
 FRE_Metropole.8.t:0 "The Fuel Allocation"
 FRE_Metropole.8.d:0 "Fuel stocks at Haiphong have fallen far enough that the expeditionary command is reviewing its transport schedules. Aviation fuel and motor fuel go into separate tanks, but the port still has to find room for both, and inland posts depend on the same depots to keep their convoys running.\n\nThe request before Paris is for a larger allocation and enough money to distribute it. A smaller shipment can relieve the immediate shortage; the staff would still have to ration what it sends forward. The Finance Ministry wants an answer before committing the next cargo."
 FRE_Metropole.8.a:0 "Fund and release the full fuel allocation."
 FRE_Metropole.8.b:0 "Release half the fuel allocation."
 FRE_Metropole.8.c:0 "Reserve the fuel for France."
 FRE_Metropole.9.t:0 "A Supplementary Cash Vote"
 FRE_Metropole.9.d:0 "The expeditionary pay service has asked for a supplementary advance. Auxiliaries and civilian transport contractors are paid in piastres, and shipping more equipment from France will do nothing to settle their accounts. The overseas administration warns that the corps will lose access to men and transport it already relies on if payments fall into arrears.\n\nAn advance outside the budget gives deputies an opening to scrutinize expenditure that was passed with little debate in the original estimates. The government must decide how much of the shortfall it is prepared to defend in the Assembly."
 FRE_Metropole.9.a:0 "Vote the advance in full."
 FRE_Metropole.9.b:0 "Approve a reduced advance."
 FRE_Metropole.9.c:0 "The corps will live within its means."
 FRE_Metropole.10.t:0 "Paris Grows Restless"
 FRE_Metropole.10.d:0 "The National Assembly's defense committee has asked the expeditionary command to explain how it intends to restrain spending. Deputies want to know which units can be relieved by the Associated States' armies and whether any of the transport and reinforcement requests can be deferred. They have not yet called for withdrawal.\n\nThe staff has been arguing for continuity: a battalion kept in reserve costs money even when held back, and postponing relief does not repair the vehicles it still needs. The command has to decide what concessions it can offer Paris while there is still room to negotiate."
 FRE_Metropole.10.a:0 "Submit a plan to trim expenditure."
 FRE_Metropole.10.b:0 "Defend the present level of effort."
 FRE_Metropole.11.t:0 "The Assembly Balks"
 FRE_Metropole.11.d:0 "Ministers can no longer count on the National Assembly to renew the expeditionary credits. Deputies who were prepared to approve emergency requests now want a reduction in commitments before they support another vote. The command's assurances that individual operations are affordable have done little to answer questions about the cost of the campaign as a whole.\n\nScaling back operations would give ministers a concession to take into the debate. The field staff argues that further pressure on the Viet Minh will improve France's position faster than a reduction in casualties or spending. That case now has to be made to a reluctant majority."
 FRE_Metropole.11.a:0 "Curtail operations before the next vote."
 FRE_Metropole.11.b:0 "Press the campaign despite the Assembly."
 FRE_Metropole.12.t:0 "Paris Withdraws Its Backing"
 FRE_Metropole.12.d:0 "Paris is no longer prepared to defend new commitments for the expeditionary corps. Reinforcement requests that once went forward with the minister's backing can no longer be treated as routine. A fresh offensive would require money, replacements and a parliamentary majority that the cabinet cannot promise. Deputies who once asked when the next reinforcements would sail now ask when the first units will come home.\n\nThe withdrawal of political backing has immediate consequences for the field command. Garrisons still need supplies and relief, and local partners need to know whether French units will stay at their posts. In districts where local troops have served alongside the corps, even an unconfirmed report of evacuation can unsettle recruitment and administration.\n\nIf withdrawal orders are already in hand, the staff must turn them into a schedule. Otherwise, the command has to decide whether to spend what influence it has left on an appeal for continued backing."
 FRE_Metropole.12.a:0 "Make one last appeal to Paris."
 FRE_Metropole.12.b:0 "Do not contest the decision."
 FRE_Metropole.13.t:0 "Renewed Confidence"
 FRE_Metropole.13.d:0 "The latest instructions from Paris give the expeditionary command greater latitude to plan the next round of operations. The ministries are again willing to consider requests on their merits instead of treating each one as a reason to reopen the question of withdrawal.\n\nThat change restores some authority to the headquarters in Indochina. It gives the staff firmer grounds for making commitments to its own formations and to the Associated States, though individual requests will still have to make their way through Paris."
 FRE_Metropole.13.a:0 "Pass the assurances to the field commands."
 FRE_Metropole.20.t:0 "The Assembly Debates Indochina"
 FRE_Metropole.20.d:0 "The National Assembly is again reviewing the credits for Indochina. Deputies who defend the expedition argue that France cannot withdraw without weakening its agreements with Vietnam, Laos and Cambodia. Communist deputies denounce the war as colonial, while other critics ask how long the treasury is expected to finance an expedition with no agreed date for bringing it home.\n\nFor the cabinet, the issue is how much political capital to spend on the corps. An explicit defense of the credits gives the command assurances it can use. Signaling that the commitment is to be reduced may ease pressure in the Assembly, but it will carry weight in Indochina even before a single unit moves."
 FRE_Metropole.20.a:0 "Defend the full expeditionary credits."
 FRE_Metropole.20.b:0 "Stand by the existing appropriations."
 FRE_Metropole.20.c:0 "Signal a reduction in the commitment."

#### Allied events ####
 FRE_Allies.1.t:0 "Instructors for the National Army"
 FRE_Allies.1.d:0 "The French expeditionary command has offered instructors and rifles to the Vietnamese National Army. It wants more Vietnamese formations trained and equipped to relieve its own units on garrison duty. For the government of the State of Vietnam, the offer would let the army arm more recruits without waiting on supplies from its own budget.\n\nThe difficulty is deciding who sets the training program. Vietnamese officers want a national army that can fill its posts without permanent French direction. The government must weigh a faster intake of recruits against the influence French instructors would have over how those men are trained."
 FRE_Allies.1.a:0 "Welcome the instructors."
 FRE_Allies.1.b:0 "Keep training in Vietnamese hands."
 FRE_Allies.10.t:0 "Trinquier's Proposal for the Maquis"
 FRE_Allies.10.d:0 "Roger Trinquier has proposed paying for the highland maquis with proceeds from the opium trade. The Groupement de commandos mixtes aeroportes relies on local allies to recruit and provision its detachments. Its regular appropriations do not cover the expansion the command wants, and many of the communities on which it depends already sell opium for cash.\n\nThe proposal would put the proceeds at the disposal of the maquis without a vote in Paris. It would also tie French intelligence to a trade the government would have difficulty defending in public. The command must settle how the network is to be financed."
 FRE_Allies.10.a:0 "Finance the maquis through Operation X."
 FRE_Allies.10.b:0 "Charge the maquis to the official budget."

#### Battle events ####
 FRE_Battles.5.t:0 "Whether to Hold Hoa Binh"
 FRE_Battles.5.d:0 "French airborne and river forces have seized Hoa Binh, blocking a Viet Minh supply route between the north and south. Giap has sent his divisions to contest the town, the posts on the Black River and the convoy road along Route 6. The Expeditionary Corps must keep the garrison supplied over roads and waterways already under attack.\n\nUnder Operation Amarante the Corps will withdraw on day 105, concede Hoa Binh, and preserve its mobile groups for the wider war. Keeping the salient means committing reserves until day 210. A successful defense would secure the greater gain, but if the town falls, the reserves sent to hold it will make the loss substantially worse."
 FRE_Battles.5.a:0 "Commit the reserves and hold Hoa Binh."
 FRE_Battles.5.b:0 "Order the withdrawal on day 105."
 FRE_Battles.5.c:0 "No further order is needed."

#### Dien Bien Phu ####
 FRE_DBP.10.t:0 "The French Ask for American Air Strikes"
 FRE_DBP.10.d:0 "France has asked the United States to intervene at Dien Bien Phu. Its commanders argue that American bombers could relieve pressure on the garrison where the French air force alone cannot. In Washington, Admiral Arthur Radford is willing to consider direct air intervention, but congressional leaders want allies to share responsibility before the United States enters the fighting.\n\nApproval would give the French firepower they cannot muster on their own. It would also commit American aircraft to combat in a war for which Washington has yet to secure a coalition."
 FRE_DBP.10.a:0 "Authorize Operation Vulture."
 FRE_DBP.10.b:0 "Withhold American air strikes."

#### Command rotation ####
 FRE_Command.1.t:0 "Le Roi Jean"
 FRE_Command.1.d:0 "General Jean de Lattre de Tassigny has taken up his posts as commander-in-chief and high commissioner. He has ruled out evacuating French families from Hanoi, an early signal to officials and officers who were preparing for the loss of Tonkin. The new headquarters intends to keep the Red River Delta under French Union control and to use its mobile formations to counter Viet Minh advances rather than leave them dispersed among the outposts."
 FRE_Command.1.a:0 "Confirm de Lattre in command."
 FRE_Command.2.t:0 "The Death of Bernard de Lattre"
 FRE_Command.2.d:0 "Lieutenant Bernard de Lattre has been killed at Ninh Binh in the fighting along the Day River. He was the only son of the commander-in-chief. His death comes while the Expeditionary Corps is defending the southern approaches to the Red River Delta. The general can stay in command, as he wishes, or take leave while the staff handles the fighting without him."
 FRE_Command.2.a:0 "Keep de Lattre at his post."
 FRE_Command.2.b:0 "Grant him leave to mourn."
 FRE_Command.3.t:0 "De Lattre Is Gravely Ill"
 FRE_Command.3.d:0 "General de Lattre has returned to France for treatment. The cancer that forced his departure leaves the Expeditionary Corps without its commander-in-chief in the theatre, and the prospect of his return is remote. Routine orders can still go out from headquarters, but Paris and the senior staff in Indochina need to settle who will direct the campaign if the general cannot resume his duties."
 FRE_Command.3.a:0 "Prepare the succession quietly."
 FRE_Command.4.t:0 "The Death of de Lattre"
 FRE_Command.4.d:0 "Jean de Lattre de Tassigny has died in Paris. France is to confer the rank of marshal on him posthumously and give him a state funeral. In Indochina the Expeditionary Corps has lost the officer who combined authority over the field commands with the duties of high commissioner.\n\nGeneral Raoul Salan knows the theatre and can take charge at once. The alternative is to leave field operations to the staff under the arrangements that preceded de Lattre's appointment."
 FRE_Command.4.a:0 "Appoint General Salan."
 FRE_Command.4.b:0 "Leave command with the existing staff."
 FRE_Command.5.t:0 "Navarre Takes Command"
 FRE_Command.5.d:0 "General Henri Navarre is taking command of the Expeditionary Corps. A cavalry officer with long experience in intelligence and staff work, he comes to Indochina from a posting in Europe. Navarre inherits a corps spread among garrisons from the Red River Delta to central Vietnam. Paris expects him to recover the initiative without a commitment to the reinforcements that a new offensive might require."
 FRE_Command.5.a:0 "Install Navarre as commander-in-chief."
 FRE_Command.6.t:0 "The Navarre Plan"
 FRE_Command.6.d:0 "Navarre has presented Paris with a plan to rebuild the Expeditionary Corps' mobile reserve. For the coming campaign season he intends to contain Giap's main force in the north while taking the offensive in central Vietnam. The buildup is meant to let the Corps concentrate its strength in Tonkin later, instead of fighting for every post on the frontier.\n\nAn accelerated timetable would put the initiative ahead of the government's concerns about the cost of the war. A more cautious program would defer major commitments while the Corps rebuilds."
 FRE_Command.6.a:0 "Accelerate the offensive timetable."
 FRE_Command.6.b:0 "Adopt the more cautious timetable."

#### Flavor pool ####
 FRE_Flavor.1.t:0 "The Operation X Ledger"
 FRE_Flavor.1.d:0 "Records from Operation X have come to light. They link the purchase and transport of highland opium to money paid out for the maquis and show that the trade involved more than private dealings by individual officers. A copy may already have reached Paris.\n\nFor the intelligence service, the ledger accounts for weapons and supplies that the official budget never provided. For ministers who may have to answer for it in the Assembly, the same ledger shows that French aircraft carried the cargo. The command must decide whether to keep the arrangement in place under scrutiny or cut off a source of support for the maquis."
 FRE_Flavor.1.a:0 "Suppress the report and keep funding the maquis."
 FRE_Flavor.1.b:0 "Shut Operation X down."
 FRE_Flavor.2.t:0 "Echoes of the Affaire des Generaux"
 FRE_Flavor.2.d:0 "Reports on the Revers affair have returned to the Paris weeklies. The original scandal concerned the circulation of a confidential report by General Georges Revers on the conduct of the war in Indochina. The new stories name serving officers and revive questions about how freely papers circulated among military and political intermediaries.\n\nParis wants to know whether anyone still in the service is supplying material to the press. An inquiry would give ministers a reply to take to the Assembly, but it would reopen a dispute the command had hoped was settled. Leaving it alone means accepting that the next allegations may go unanswered as well."
 FRE_Flavor.2.a:0 "Open an inquiry into the disclosures."
 FRE_Flavor.2.b:0 "Leave the matter out of military hands."
 FRE_Flavor.3.t:0 "Deserters in the Ranks"
 FRE_Flavor.3.d:0 "French intelligence has identified former Foreign Legion soldiers in Viet Minh propaganda broadcasts. Appeals in European languages urge legionnaires to leave their posts, and some deserters have asked to return to French lines on condition that they are not prosecuted.\n\nThe Legion's officers are divided over whether to accept those terms. An amnesty would recover men and weaken the argument that a deserter has no way back. Officers responsible for discipline want public courts-martial so that units still in the field know how desertion will be treated. The command must set the terms under which returning men will be received."
 FRE_Flavor.3.a:0 "Offer a quiet amnesty to returning men."
 FRE_Flavor.3.b:0 "Bring the deserters before public courts-martial."
 FRE_Flavor.4.t:0 "The Monsoon Swallows the Roads"
 FRE_Flavor.4.d:0 "Monsoon flooding has closed stretches of Route Coloniale 1, and vehicles are queuing at damaged crossings. Some local airstrips are also unserviceable. The garrisons that depend on the road are drawing on reserve stores while engineers assess which routes can still carry loaded trucks.\n\nThe supply staff can move essential consignments at the risk of losing more vehicles and equipment in transit. Waiting for the water to fall would save stocks and simplify accounts for Paris, but it would leave the outposts on their reserves longer. The immediate question is whether the next convoys should depart."
 FRE_Flavor.4.a:0 "Push the convoys through."
 FRE_Flavor.4.b:0 "Wait out the rains."
 FRE_Flavor.5.t:0 "American Advisers Arrive in Saigon"
 FRE_Flavor.5.d:0 "The American Military Assistance Advisory Group has established offices in Saigon. Its officers want to inspect the depots and distribution records before recommending further consignments. Washington wants to be able to account for the equipment once it passes into French hands and to know which units have received it.\n\nThe supply staff welcomes another source of rifles and equipment. Other officers are reluctant to open military establishments to outside inspection and argue that ordinary liaison will keep relations with Washington on a workable footing. The command must decide how much of its supply system the mission will be allowed to see."
 FRE_Flavor.5.a:0 "Open the depots to the American mission."
 FRE_Flavor.5.b:0 "Keep the mission on liaison duty."
 FRE_Flavor.6.t:0 "Trucks on the Chinese Border"
 FRE_Flavor.6.d:0 "Reconnaissance reports more motor traffic on the roads near Cao Bang and the Chinese frontier. French intelligence takes it as evidence that the Viet Minh can move heavier consignments than before. Chinese instruction and supplies are giving Giap's regular formations resources that the expeditionary command could once discount.\n\nA raid on the supply routes could interfere with deliveries, but Paris is wary of an incident near the frontier. The officers responsible for holding Tonkin argue for closer observation and stronger defenses at the positions already occupied. The command must decide whether the traffic justifies committing troops to a raid."
 FRE_Flavor.6.a:0 "Authorize raids on the supply routes."
 FRE_Flavor.6.b:0 "Strengthen the positions already held."
 FRE_Flavor.7.t:0 "The Grand Monde Offer"
 FRE_Flavor.7.d:0 "The Binh Xuyen have offered the expeditionary command a share of receipts from the Grand Monde casino in exchange for latitude on the Saigon waterfront. Bao Dai's dealings with the organization have already helped it turn gambling concessions into a source of political influence. French acceptance would put the corps itself under an obligation to the syndicate.\n\nThe arrangement would give the command money and cooperation in a port on which it depends. It would also weaken the State of Vietnam's position when its officials try to assert authority over the waterfront. The command must give the Binh Xuyen an answer."
 FRE_Flavor.7.a:0 "Accept the share of casino receipts."
 FRE_Flavor.7.b:0 "Reject the Binh Xuyen's terms."
 FRE_Flavor.8.t:0 "The Haiphong Customs Dispute"
 FRE_Flavor.8.d:0 "The State of Vietnam is demanding control of customs receipts at Haiphong under its agreements with France. Its officials argue that a government expected to maintain an army and civil service cannot leave the proceeds of a major port in the hands of a military command. The corps cites military necessity and continues to collect the duties.\n\nThe dispute concerns the customs house and its accounts. Saigon is seeking the revenue that goes with administering it; the expeditionary staff fears losing its discretion over those funds while still depending on Haiphong for supplies. The command must decide whether to hand over collection."
 FRE_Flavor.8.a:0 "Keep customs under military control."
 FRE_Flavor.8.b:0 "Give Saigon control of customs."
 FRE_Flavor.9.t:0 "Le Monde Obtains the Casualty Returns"
 FRE_Flavor.9.d:0 "Le Monde has obtained military casualty returns from Indochina and is preparing an article comparing them with the figures released in official communiques. The returns give the paper a way to account for losses across a longer period than the individual engagements described by the press service.\n\nDeputies questioning the conduct of the war are likely to cite the figures at the next debate. The command can ask the authorities in France to intervene before publication, at the risk of widening the dispute over what the public is entitled to know. The press service is waiting to hear whether it should make that request."
 FRE_Flavor.9.a:0 "Seek a halt to publication."
 FRE_Flavor.9.b:0 "The Republic has a free press."
 FRE_Flavor.10.t:0 "Ambush on the Song Day"
 FRE_Flavor.10.d:0 "A Dinassaut convoy has been hit by fire from the banks of the Song Day. A landing craft was disabled and the flotilla reports casualties. The convoy was carrying stores to posts whose road access is unreliable, and the local command has more consignments waiting to go upriver.\n\nThe Navy wants to send troops ashore to clear the banks before resuming the run. That would commit men to ground the Viet Minh already know well. The transport officers can divert the traffic, but the alternative route will require more equipment to move the same loads. The command must choose how to resume deliveries."
 FRE_Flavor.10.a:0 "Sweep the riverbanks."
 FRE_Flavor.10.b:0 "Reroute the convoys."
 FRE_Flavor.11.t:0 "An Oath in the Highlands"
 FRE_Flavor.11.d:0 "Highland leaders working with the French maquis have invited the commander-in-chief to the ceremony at which new recruits take their oath. The French command can provide weapons and pay, but the detachments depend on village leaders for recruits, guides and food.\n\nFor those leaders, a visit would amount to a public undertaking that the command takes its obligations to the maquis seriously. It would also give them a chance to raise local supply and recruitment problems directly. The staff would prefer to send a representative and keep the commander at headquarters. The invitation requires a reply before the recruits assemble."
 FRE_Flavor.11.a:0 "The commander attends in person."
 FRE_Flavor.11.b:0 "Send a staff colonel with gifts."
 FRE_Flavor.12.t:0 "The Pasteur Comes Home"
 FRE_Flavor.12.d:0 "The troopship Pasteur is due at Marseille with wounded men from Indochina. Veterans' associations want a formal reception on the quay, while port union members opposed to the war intend to make their presence known at the landing. The medical service has made arrangements to transfer patients from the ship without waiting for a ceremony.\n\nA public reception would let the authorities acknowledge the men and their families in front of the press. It would also put the protests on the same quay. The command must decide whether the disembarkation is to be a public occasion or a private transfer."
 FRE_Flavor.12.a:0 "Receive the wounded with public honors."
 FRE_Flavor.12.b:0 "Keep the landing closed to the press."
 FRE_Flavor.13.t:0 "La Sale Guerre"
 FRE_Flavor.13.d:0 "Dockworkers in Marseille are refusing to load cargo bound for Indochina. Communist organizers and trade union militants denounce the campaign as la sale guerre; their opponents argue that a refusal to handle supplies punishes the men in the field. The stoppage gives deputies who oppose the war a specific dispute to raise in the National Assembly.\n\nThe overseas ministry wants the ships loaded and the war supply schedule restored. Ministers who oppose police intervention warn that breaking up the stoppage may draw other unions into it. The cabinet must decide whether to have the port cleared."
 FRE_Flavor.13.a:0 "Use the police to clear the docks."
 FRE_Flavor.13.b:0 "Leave the strike to the port authorities."
 FRE_Flavor.14.t:0 "The Photographers of Indochine"
 FRE_Flavor.14.d:0 "Life, Paris Match and the wire services have asked for accreditation to accompany French troops on operations. In Paris, the overseas ministry wants readers to see more of the campaign than casualty figures and communiques. The field command would have to provide escorts and accept that photographs from the front may contradict its own account of an engagement.\n\nThe press service can keep accredited photographers at depots and rear headquarters, where it can arrange their movements. Such access is easier to supervise and less likely to persuade editors that they are getting an independent account. The staff has to set the terms of accreditation."
 FRE_Flavor.14.a:0 "Accredit photographers for the front."
 FRE_Flavor.14.b:0 "Limit accreditation to rear areas."

#### Wind-down ####
 FRE_Winddown.1.t:0 "Stand-Down Orders from Paris"
 FRE_Winddown.1.d:0 "Paris has instructed the expeditionary command to stand down offensive operations and prepare a phased withdrawal from Indochina. Headquarters must inventory its posts and stores and establish which units can move first without leaving the depots and embarkation ports unprotected.\n\nDetailed shipping orders will follow. Until they arrive, the corps remains responsible for its troops and for the installations still under French administration. The staff is issuing preliminary instructions to the field commands."
 FRE_Winddown.1.a:0 "Issue the stand-down orders."
 FRE_Winddown.2.t:0 "The Evacuation of Haiphong"
 FRE_Winddown.2.d:0 "The expeditionary command is assembling shipping at Haiphong. Troop movements already account for much of the available tonnage, and civilians seeking passage out of the north are converging on the port. The authorities have to assign berths and decide how much of the military schedule can be shared with civilian embarkation.\n\nFrench transports can carry out the evacuation in stages, leaving the corps responsible for the port for longer. If American vessels can be secured, extra sailings would relieve the pressure on the quays and bring forward the next stage of withdrawal. The naval staff needs to know whose shipping it can count on."
 FRE_Winddown.2.a:0 "Accept the American sealift."
 FRE_Winddown.2.b:0 "Use French shipping alone."
 FRE_Winddown.3.t:0 "The Phased Withdrawal"
 FRE_Winddown.3.d:0 "With the Haiphong embarkation under way, headquarters has to set a timetable for the remaining posts. A short timetable gets French personnel to the ports quickly. It also leaves less time to issue stores and transfer the records that keep a garrison supplied after its old staff departs.\n\nWhere the Vietnamese National Army is able to take over, a longer timetable would let incoming officers work with French units before assuming responsibility. The price is a longer commitment of troops, transport and headquarters staff. The withdrawal has been ordered; what remains to be settled is how long the corps will allow for the handovers."
 FRE_Winddown.3.a:0 "Accelerate the return of French troops."
 FRE_Winddown.3.b:0 "Allow time for an orderly handover."
 FRE_Winddown.4.t:0 "The Last Ship Out"
 FRE_Winddown.4.d:0 "The last detachments of the expeditionary corps are embarking. The commands that ran the depots, convoys and garrisons have sent Paris their final returns. Any posts still held by French troops must now pass to the authorities that will administer them after the corps leaves.\n\nThe troops still on the rolls are being repatriated. With the last movement orders ready to be carried out, headquarters can close the expeditionary establishment and leave any remaining claims to the ministries in Paris."
 FRE_Winddown.4.a:0 "Dissolve the expeditionary command."
 FRE_Winddown.5.t:0 "The Corps Comes Home"
 FRE_Winddown.5.d:0 "The final transports from Indochina are bringing troops back to metropolitan France. The army must sort men returning to regular formations from those due for discharge. War pensions, treatment for the wounded and claims from families remain on the books even though the expeditionary command has closed.\n\nMinisters now have to settle what the government will say publicly about the end of the campaign. A formal tribute would speak to the men who served and to their families. Deputies critical of the war want attention directed instead to the policy that kept the expedition in the field."
 FRE_Winddown.5.a:0 "Pay official tribute to the troops."
 FRE_Winddown.5.b:0 "Make the case against another expedition."

#### Operation commitment (FRE_Ops namespace) ####
 FRE_Ops.1.t:0 "The Scale of the Commitment"
 FRE_Ops.1.d:0 "The Expeditionary Corps must decide how much of its reserve to put behind the operation. A light commitment leaves more in hand; a standard commitment assigns the usual support. Maximum commitment draws more heavily on War Credits and costs Metropole Patience. For Hirondelle, a larger force also needs less time to destroy the depots.\n\n§YCURRENT OBJECTIVE§!\n[GetFREOperationObjective]\n\nOn the ground, only the highlighted objectives count. For these operations, French Union forces are CEFEO, France, the Tai Federation and the State of Vietnam. Operating past the limits of supply risks overextension; gains elsewhere cannot make up for missing the objective.\n\nWar Credits available: §Y[?FRE.FRE_War_Credits|0]§!\nMetropole Patience: §Y[?FRE.FRE_Metropole_Patience|0]§!/100"
 FRE_Ops.1.a:0 "Authorize a light commitment."
 FRE_Ops.1.b:0 "Assign the standard reserve."
 FRE_Ops.1.c:0 "Commit the theatre reserve."
 FRE_Ops.1.e:0 "Cancel for lack of War Credits."
 FRE_Ops.2.t:0 "The Operation Has Run Its Course"
 FRE_Ops.2.d:0 "The columns are at the end of their supply lines and the enemy has not broken. The staff want the order to disengage. The Etat-Major in Saigon wants a result to send home.\n\nOne of them is going to be disappointed."
 FRE_Ops.2.a:0 "Press on. We did not come this far to withdraw."
 FRE_Ops.2.b:0 "Break off. Bank what we have taken."
 FRE_Ops.10.t:0 "The Objective Falls"
 FRE_Ops.10.d:0 "The position is ours."
 FRE_Ops.10.a:0 "Signal Saigon."
 FRE_Ops.11.t:0 "The Attack Is Broken"
 FRE_Ops.11.d:0 "The columns are falling back."
 FRE_Ops.11.a:0 "Cover the withdrawal."
 FRE_Ops.12.t:0 "The Operation Lapses"
 FRE_Ops.12.d:0 "Neither side can force a decision."
 FRE_Ops.12.a:0 "Take stock."
 FRE_Ops.20.t:0 "The Expeditionary Corps Is Held"
 FRE_Ops.20.d:0 "The French columns came on with armour and aircraft and went back the way they came. Our units held the ridgelines, gave ground where ground was worth nothing, and took it back when the trucks turned around.\n\nThe cadres will study this one for a long time.\n\nEvery operation the French mount and fail to win is an argument made in Paris on our behalf."
 FRE_Ops.20.a:0 "The people's war is patient."
 FRE_Ops.20.b:0 "Note it."
 FRE_Ops.21.t:0 "The Expeditionary Corps Breaks Through"
 FRE_Ops.21.d:0 "The French have taken the position. Our units disengaged rather than be encircled, which is the correct decision and an expensive one.\n\nThe villages in the sector will pay for it, and the cadres who promised protection will have to answer for that promise.\n\nThe war is long. This week belongs to Saigon."
 FRE_Ops.21.a:0 "Regroup. Rebuild. Return."
 FRE_Ops.21.b:0 "Note it."

# === Dien Bien Response (merged from FRE_Dien_Bien_Response_l_english.yml) ===
 FRE_Dien_Bien.1.t:0 "The Defense of Dien Bien Phu"
 FRE_Dien_Bien.1.d:0 "The Viet Minh have committed their main force to Dien Bien Phu. Their guns on the surrounding heights can bring the airstrip under fire, and the garrison depends on that strip for ammunition and replacements. The Expeditionary Corps can hold with the garrison and scheduled airlift, or send more battalions and supplies at the cost of its reserve elsewhere in Indochina.\n\nIf the Viet Minh close the approaches, Operation Condor could attempt to reopen a corridor on the ground. Paris could instead ask Washington for Operation Vulture, an intervention France cannot authorize on its own. On any of these plans, the garrison still has to deny Giap the camp until the offensive runs its course."
 FRE_Dien_Bien.1.a:0 "Hold with the garrison and regular airlift."
 FRE_Dien_Bien.1.b:0 "Commit the full reinforcement package."
 FRE_Dien_Bien.1.c:0 "Prepare Condor to reopen a land corridor."
 FRE_Dien_Bien.1.e:0 "Ask Washington for Operation Vulture."

 FRE_Dien_Bien.2.t:0 "American Aircraft over the Valley"
 FRE_Dien_Bien.2.d:0 "Washington has approved air support for the defense of Dien Bien Phu. The garrison can count on American assistance in keeping the supply drops going and placing pressure on the Viet Minh positions around the basin. That will ease the strain on the French air crews, but it leaves the garrison responsible for keeping the inner defenses intact."
 FRE_Dien_Bien.2.a:0 "The airbridge has American backing."
 FRE_Dien_Bien.3.t:0 "Washington Refuses Vulture"
 FRE_Dien_Bien.3.d:0 "The answer from Washington is no. The President will not widen the war without allied commitments and congressional support, and neither exists. The camp will receive no American bomber offensive. Its garrison must now survive on the airlift and the resources already committed from Indochina."
 FRE_Dien_Bien.3.a:0 "Continue with the French airlift."
 FRE_Dien_Bien.4.t:0 "Operation Condor Opens the Corridor"
 FRE_Dien_Bien.4.d:0 "The relief columns have linked the outer positions to the camp and kept the route open through a week of counterattacks. Wounded men and exhausted units are moving out while ammunition and replacements move in. The valley remains contested, but the garrison is no longer fighting as an isolated pocket and the siege timetable has been set back."
 FRE_Dien_Bien.4.a:0 "The garrison is no longer cut off."

 FRE_Dien_Bien.5.t:0 "The Battle for Dien Bien Phu Ends"
 FRE_Dien_Bien.5.d_held:0 "The Viet Minh offensive has ended with the camp still in French Union hands. The garrison kept its inner defenses manned and had enough supplies to see out the siege. The position remains isolated and costly to supply, but Paris can report that the camp withstood Giap's main force."
 FRE_Dien_Bien.5.d_reinforced:0 "The fortified camp at Dien Bien Phu has held. Replacement battalions and supplies drawn from the expeditionary reserve kept the inner positions manned through the end of the offensive. The Corps can now count the price of the defense in formations and stores that were unavailable for its other commitments."
 FRE_Dien_Bien.5.d_condor:0 "The camp has survived the siege. Operation Condor reopened an approach after the Viet Minh closed in. For the first time since the siege tightened, men and supplies could reach the garrison without relying on the airstrip alone. Giap's divisions have ended their offensive without taking the central position."
 FRE_Dien_Bien.5.d_vulture:0 "Dien Bien Phu has held with American air support. The intervention helped keep the garrison supplied and put Giap's forces under additional pressure during the siege. The French position in the valley survived, but American participation in the battle is now a fact that any talks over Indochina will have to reckon with."
 FRE_Dien_Bien.5.d_fall_standard:0 "The Viet Minh have taken Dien Bien Phu. Once the airstrip could no longer sustain the defense, the garrison had to fight from a shrinking group of strongpoints. The central position has now fallen, and the Expeditionary Corps must account for the men and formations lost in the valley."
 FRE_Dien_Bien.5.d_fall_max:0 "The Viet Minh have taken the camp despite the additional reserve sent to sustain it. The Corps increased the strength of the garrison without securing the means to extract it. The loss now extends to men and equipment that headquarters would otherwise have kept for the defense of Tonkin."
 FRE_Dien_Bien.5.d_fall_condor:0 "The relief effort did not prevent the loss of the camp. Condor could only help while a route to the inner positions stayed open, and the Corps could not keep enough men and supplies reaching the garrison to reverse the siege. Dien Bien Phu is in Viet Minh hands."
 FRE_Dien_Bien.5.d_fall_vulture:0 "The Viet Minh have taken the camp despite the French appeal for Operation Vulture. No intervention from outside Indochina secured the position. Paris must answer for the loss after having already asked Washington to take a direct part in the war."
 FRE_Dien_Bien.5.d_inconclusive:0 "The fighting around Dien Bien Phu has stopped before either side could settle the battle. The camp has not fallen, but the garrison has not had to withstand Giap's offensive for the full term of the defense. Headquarters cannot report a victory on the strength of an unfinished siege."
 FRE_Dien_Bien.5.d_superseded:0 "Events elsewhere in Indochina have brought the siege to an end. Orders for the wider theatre now govern the garrison and the forces that were to relieve it. Neither side has settled possession of the valley by completing the campaign."
 FRE_Dien_Bien.5.a:0 "Report the condition of the garrison."

 VIN_Dien_Bien.1.t:0 "The Viet Minh Report from the Valley"
 VIN_Dien_Bien.1.d_held:0 "The offensive has ended with the French Union flag still flying over the central position. The People's Army committed its main divisions to the valley and did not take the camp. The General Staff must now reckon with the expenditure of men and ammunition on a battle that has left the enemy in possession."
 VIN_Dien_Bien.1.d_fall:0 "The People's Army has captured the fortified camp at Dien Bien Phu. The French position fell after the assault divisions closed on the inner strongpoints and denied the garrison the use of its airstrip. Hanoi can now point to the defeat of a major expeditionary formation when France seeks terms in Indochina."
 VIN_Dien_Bien.1.d_inconclusive:0 "Fighting has stopped before the People's Army could take the central position. The French still hold the camp, but the offensive did not run its full course. Hanoi has no victory in the valley to report."
 VIN_Dien_Bien.1.d_superseded:0 "Orders for the wider theatre have superseded the offensive at Dien Bien Phu. The People's Army will take its instructions from Hanoi on the disposition of the divisions in the valley. The battle has not yielded a separate result."
 VIN_Dien_Bien.1.a:0 "Report to the General Staff."

# === Hoa Binh Response (merged from FRE_Hoa_Binh_Response_l_english.yml) ===
 FRE_Hoa_Binh.1.t:0 "The Hoa Binh Salient"
 FRE_Hoa_Binh.1.d_withdrawal:0 "Operation Amarante has brought the garrison and mobile groups out of Hoa Binh in stages along Route 6. The withdrawal has reopened the Viet Minh supply corridor, but it has kept the field force together and recovered equipment for the defense of the delta. The Corps can now draw on those formations for Na San while the wider war continues."
 FRE_Hoa_Binh.1.d_held:0 "Hoa Binh remains in French Union hands. The garrison kept Route 6 open often enough to sustain the salient until Giap's offensive ran out of time. The position still requires regular convoys, but headquarters can now make the case to Paris that its decision to commit the reserve achieved what a withdrawal would have conceded."
 FRE_Hoa_Binh.1.d_lost_hold:0 "Giap's divisions have taken Hoa Binh. The mobile groups that went into the salient in place of a withdrawal are now trying to get out without an open supply road. The Corps has lost the town and will have to replace men and equipment it could have saved under Operation Amarante."
 FRE_Hoa_Binh.1.d_lost:0 "The Viet Minh took Hoa Binh before the Expeditionary Corps could carry out its withdrawal. Route 6 can no longer serve as the route out for an organized movement of the garrison. The staff must account for the loss of the salient without the benefit of bringing its formations back in good order."
 FRE_Hoa_Binh.1.d_inconclusive:0 "The fighting has ended before the Viet Minh could capture Hoa Binh or the Corps could settle the defense of the salient. The position remains exposed on the western approaches to the delta. There has been no orderly withdrawal and no decisive defense."
 FRE_Hoa_Binh.1.d_superseded:0 "Orders for the wider theatre now govern the forces at Hoa Binh. The local command will make its dispositions under those orders. Neither the plan to withdraw nor the effort to hold the salient produced a separate result."
 FRE_Hoa_Binh.1.a:0 "Send the dispositions to headquarters."

 VIN_Hoa_Binh.1.t:0 "The Corridor Through Hoa Binh"
 VIN_Hoa_Binh.1.d_withdrawal:0 "The French garrison has left Hoa Binh in good order along Route 6. Its mobile groups are still available to defend the delta, but they can no longer interrupt the Viet Minh supply corridor from their posts on the Black River. Hanoi has recovered the passage it sent the divisions to reopen."
 VIN_Hoa_Binh.1.d_held:0 "The French have kept their garrison at Hoa Binh. Route 6 remained open often enough for it to receive supplies, and the Viet Minh divisions must disengage without recovering the corridor. Hanoi will have to maintain communications between north and south while the enemy still holds the salient."
 VIN_Hoa_Binh.1.d_lost:0 "The People's Army has taken Hoa Binh before the French could clear their salient. Pressure on Route 6 and the Black River posts prevented the garrison from withdrawing as a formed force. The recovered corridor gives the Viet Minh room to move supplies beyond the western edge of the delta."
 VIN_Hoa_Binh.1.d_inconclusive:0 "The campaign has ended with the French still in the salient and no settled French decision to leave it. The People's Army has not recovered the route it set out to open. The General Staff will still have to reckon with the post at Hoa Binh when it plans movements through the highlands."
 VIN_Hoa_Binh.1.d_superseded:0 "The wider war has overtaken the counteroffensive at Hoa Binh. The divisions are now subject to orders covering the whole theatre, and Hanoi will record no separate result for the contest over the corridor."
 VIN_Hoa_Binh.1.a:0 "Account for the Black River corridor."

# === Northwest Response (merged from FRE_Northwest_Response_l_english.yml) ===
 FRE_Northwest.1.t:0 "Operation Lorraine"
 FRE_Northwest.1.d_active:0 "Giap's divisions are moving through the Tai country. The Expeditionary Corps has prepared a diversion up the Clear River against the Viet Minh depots at Phu Doan. A thrust by mobile groups and paratroopers could oblige Hanoi to draw men away from the Northwest or force its divisions to continue with fewer supplies.\n\nEvery kilometer north of the delta adds to the road the Corps must keep open for its return. A short raid would limit that exposure but put less pressure on the Viet Minh offensive. The alternative is to leave the depots alone and keep the mobile groups available for Na San."
 FRE_Northwest.1.d_planned:0 "The staff has completed its plan for a diversion up the Clear River. Mobile groups, river craft and paratroopers could be assembled against the Viet Minh depots at Phu Doan if Hanoi opens an offensive in the Northwest. It has yet to do so. The Corps can keep the plan ready without moving the reserve out of the delta."
 FRE_Northwest.1.a:0 "Drive on Phu Doan with the mobile groups."
 FRE_Northwest.1.b:0 "Raid the depots, then withdraw at once."
 FRE_Northwest.1.c:0 "Keep the mobile groups for Na San."
 FRE_Northwest.1.e:0 "Decline Lorraine for lack of reserves."
 FRE_Northwest.1.d:0 "Hold the plan until the offensive opens."

 FRE_Northwest.2.t:0 "The Outcome of Operation Lorraine"
 FRE_Northwest.2.d_success:0 "The thrust against Phu Doan has helped bring the Viet Minh offensive in the Northwest to a halt. The Corps used its reserve to threaten the depots and roads on which Giap's divisions depended. The mobile groups have returned to the delta after securing the relief the highland positions needed."
 FRE_Northwest.2.d_limited:0 "The expedition reached the Phu Doan depots and damaged Viet Minh stocks. The mobile groups withdrew before their road back to the delta could be closed. Their return preserves the reserve, but the Northwest offensive has not been stopped by the raid."
 FRE_Northwest.2.d_failure:0 "The advance up the Clear River has ended without closing the Viet Minh depots at Phu Doan or turning the offensive in the Northwest. The mobile groups are back, but Paris has paid for their expedition without getting the relief the highland positions needed."
 FRE_Northwest.2.d_withheld:0 "Headquarters shelved the attack on Phu Doan. The Viet Minh kept their supplies, but the French Union did not have to commit its mobile groups to the Clear River. The defense of Na San goes on without a diversion to draw the Viet Minh away."
 FRE_Northwest.2.d_superseded:0 "Orders for the wider theatre have brought Operation Lorraine to an end before the columns could settle their objective. Headquarters will account for the mobile groups under those orders, without a separate decision on the Clear River."
 FRE_Northwest.2.a:0 "Report the fate of the diversion."

 VIN_Northwest.1.t:0 "The French Diversion Ends"
 VIN_Northwest.1.d_success:0 "The French drive against the depots and communications east of the Northwest front has helped bring the offensive to an end. The People's Army can no longer plan a thrust through the Tai country on the assumption that local forces alone can defend the routes carrying supplies to the divisions."
 VIN_Northwest.1.d_limited:0 "French mobile groups reached the Phu Doan depots and destroyed stores before retiring toward the delta. The losses put a strain on the supply service, but the raid did not decide the fighting in the Northwest. The General Staff has to consider how much protection it can spare for its depots during an offensive."
 VIN_Northwest.1.d_failure:0 "The French thrust up the Clear River did not keep the depots at Phu Doan out of action or compel the People's Army to turn away from the Northwest. The expedition has withdrawn without breaking the supply routes the divisions depended on."
 VIN_Northwest.1.d_withheld:0 "The expected French attack at Phu Doan did not come. The depots can keep supplying the divisions in the Northwest, but the General Staff cannot count on the enemy's mobile groups being drawn away from the Tai country."
 VIN_Northwest.1.d_superseded:0 "The wider conflict has brought the French diversion to a close. The movement against the depots did not reach a conclusion that either command can claim as a result in the Northwest."
 VIN_Northwest.1.a:0 "Review the security of the rear depots."

# === Operation Pollux ===
 FRE_Pollux.1.t:0 "The Evacuation of Lai Chau"
 FRE_Pollux.1.d:0 "The Viet Minh 316th Division is advancing through the Northwest, and the Expeditionary Corps cannot continue to hold Lai Chau in isolation. The new camp at Dien Bien Phu can receive the garrison. Under Operation Leda, transports would carry the regular detachments while the Tai partisans made their way on foot along Route Pavie.\n\nViet Minh patrols threaten that road. The Corps can commit a mobile reserve to keep the route open, or assign enough additional aircraft to lift the partisans as well. Either alternative would tie down resources the staff has set aside for the defense of Dien Bien Phu."
 FRE_Pollux.1.a:0 "Fly out the regulars; march the partisans."
 FRE_Pollux.1.b:0 "Put the mobile reserve astride Route Pavie."
 FRE_Pollux.1.c:0 "Expand the airlift to take the partisans."
 FRE_Pollux.1.e:0 "No evacuation can be funded."

 FRE_Pollux.2.t:0 "The Lai Chau Force Reaches Dien Bien Phu"
 FRE_Pollux.2.d_escort:0 "The covering groups held Lai Chau, Route Pavie, and the northern entrance to the camp as one continuous corridor. The last Tai partisan companies have entered Dien Bien Phu with their cadres and much of their equipment intact. The escorts can now disengage, and the survivors are being reorganized as another group within the valley garrison."
 FRE_Pollux.2.d_airlift:0 "The last flights carrying the Lai Chau force have reached Dien Bien Phu. The camp's strip stayed open long enough to bring in Tai cadres and their stores as well as the regular detachments. The expeditionary staff can form an additional garrison group without having had to divert a mobile reserve to Route Pavie."
 FRE_Pollux.2.a:0 "Add them to the valley order of battle."

 FRE_Pollux.3.t:0 "The Lai Chau Column Is Lost"
 FRE_Pollux.3.d_historical:0 "Operation Leda carried the regular detachments and part of their stores into Dien Bien Phu. The Tai partisan columns were ordered to follow Route Pavie on foot. Viet Minh units cut into the march, scattered its guides, and hunted the separated groups through the mountains. Barely a remnant reached the camp. The regulars will strengthen the garrison, but the highland force that was meant to follow them no longer exists as a formation."
 FRE_Pollux.3.d_escort:0 "The mobile reserve could not keep Route Pavie open. The evacuation column broke into isolated groups under attack, while the escorts spent themselves trying to reopen a road already controlled from the heights. Some survivors have reached Dien Bien Phu, but neither the partisan formation nor the covering force can be counted intact."
 FRE_Pollux.3.d_airlift:0 "The expanded airlift did not clear Lai Chau. The Corps could not keep the strip at Dien Bien Phu available for enough consecutive days to bring the whole force in. Those who made it to the valley are too few to form another garrison group."
 FRE_Pollux.3.d_origin:0 "Lai Chau fell before the evacuation order could be carried out. The garrison and its dependents scattered into the mountains without an organized corridor or sufficient aircraft. Dien Bien Phu will receive no formed reinforcement from the old Tai capital."
 FRE_Pollux.3.d_unfunded:0 "The expeditionary corps could provide neither the transports for an air evacuation nor the credits for a protected march. Lai Chau was abandoned to improvised columns, and the force dissolved under pursuit before it could reach Dien Bien Phu."
 FRE_Pollux.3.a:0 "Account for the men who did not arrive."

 FRE_Pollux.4.t:0 "Pollux Overtaken"
 FRE_Pollux.4.d:0 "The Lai Chau evacuation has been interrupted by events beyond its command. The movement did not run long enough to bring the Tai force through as an organized formation, but the staff cannot report its destruction either. The Dien Bien Phu garrison can count only on the units already in the valley."
 FRE_Pollux.4.a:0 "Close the movement order."

# === Operation Atlante ===
 FRE_Atlante.1.t:0 "The Atlante Commitment"
 FRE_Atlante.1.d:0 "The Expeditionary Corps proposes to establish a bridgehead on the central coast and push into the Viet Minh base in Interzone V. The State of Vietnam could then extend its administration into districts where it has little authority. To make the full landing and advance, however, the Corps would have to commit mobile groups and aircraft it could otherwise hold for Tonkin.\n\nA Vietnamese-led landing would aim for a smaller foothold and leave the Corps' reserve for the north. Canceling the coastal operation would let headquarters send that reserve to Tonkin now, before the Viet Minh close on Dien Bien Phu."
 FRE_Atlante.1.a:0 "Commit the Corps' reserve to Atlante."
 FRE_Atlante.1.b:0 "Put the Vietnamese National Army in the lead."
 FRE_Atlante.1.c:0 "Cancel Atlante and send the reserve north."
 FRE_Atlante.1.e:0 "Cancel for lack of funds."

 FRE_Atlante.2.t:0 "A Foothold in Interzone V"
 FRE_Atlante.2.d_full:0 "The landing forces, mobile groups, and Vietnamese battalions have held both operational objectives through two weeks of counterattacks. Interzone V has not been destroyed, and its political networks remain beyond the columns, but the coastal base is breached and the State of Vietnam can claim ground it did not hold before Atlante began. The price is visible in every formation absent from Tonkin."
 FRE_Atlante.2.d_vietnamese:0 "The Vietnamese National Army has held the coastal lodgement through two weeks of attacks without a CEFEO mobile group carrying the operation for it. The result is narrower than the staff's original plan, but it gives Saigon a defensible claim to the coast and preserves the expeditionary reserve for the north."
 FRE_Atlante.2.a:0 "Report the foothold to Saigon."

 FRE_Atlante.3.t:0 "Atlante Stalls"
 FRE_Atlante.3.d_full:0 "Ninety days of landings, road columns, and clearing operations have not produced a durable breach in Interzone V. Viet Minh units yielded ground, returned through the hills, and forced the mobile groups to fight repeatedly for the same approaches. The expeditionary reserve has been consumed by a central campaign without removing the threat or reinforcing the north."
 FRE_Atlante.3.d_vietnamese:0 "The Vietnamese National Army could not hold its coastal lodgement for two uninterrupted weeks. Battalions raised faster than their staffs could be trained lost contact in the hills, while Viet Minh local forces filtered back behind each advance. The expeditionary reserve remains available in Tonkin, but Saigon must answer for the failed undertaking."
 FRE_Atlante.3.d_unfunded:0 "The staff tables for Atlante have been filed without troops, aircraft, or credits behind them. Interzone V remains intact, and no compensating reserve has been formed for Tonkin. What was announced as the next phase of the Navarre Plan ends as another operation the command could not afford to begin."
 FRE_Atlante.3.a:0 "Account for the central commitment."

 FRE_Atlante.4.t:0 "The Reserve Turns North"
 FRE_Atlante.4.d:0 "The landing schedules for Atlante have been canceled. Tonkin now has first claim on the men and stores that would have gone into the central operation. Interzone V remains a Viet Minh base, and Saigon has lost an opportunity to extend its administration there. If the enemy closes on Dien Bien Phu, headquarters will have a reserve set aside for the valley."
 FRE_Atlante.4.a:0 "Give Tonkin first claim on the reserve."

 FRE_Atlante.5.t:0 "Atlante Overtaken"
 FRE_Atlante.5.d:0 "A wider settlement or the collapse of the theatre has overtaken the central operation before its objective could be consolidated. The landing forces and mobile groups are standing down under orders that govern all Indochina. Atlante will receive neither a battlefield success nor a separate defeat."
 FRE_Atlante.5.a:0 "Take Atlante off the orders."

 FRE_Dien_Bien.1.d_atlante:0 "The Viet Minh have committed their main force to Dien Bien Phu while the Expeditionary Corps' reserve is engaged on the central coast. The mobile groups and aircraft assigned to Atlante cannot reinforce the garrison at full strength or assemble a relief force for Operation Condor.\n\nThe valley command can rely on the garrison and its scheduled airlift. The other course is to ask Washington to intervene under Operation Vulture. The answer would rest with the Americans, while the Corps must keep the camp out of Giap's hands until his offensive ends."
 FRE_Dien_Bien.1.d_northern:0 "The main Viet Minh force has closed on Dien Bien Phu. The reserve withheld from Atlante has already supplied the camp depots. Those stores buy ten more days once the siege begins before the fortifications start to deteriorate. They do not change the date by which the garrison must outlast the offensive.\n\nHeadquarters must decide whether to trust the scheduled airlift, send reinforcements on the largest available scale, or prepare a relief column for Operation Condor. Paris can also ask Washington to provide direct support under Operation Vulture."
 FRE_Aid.1.t:0 "Rifles for the Vietnamese National Army"
 FRE_Aid.1.d:0 "The expeditionary corps has transferred rifles from its own stocks to the Vietnamese National Army. French officers want Vietnamese units to take over more garrison duties, releasing expeditionary battalions for field service. The transfer helps put recruits in uniform, but responsibility for keeping track of the rifles and training the men who receive them is still at issue.\n\nFrench cadres could help the new units adopt procedures the two armies already use in joint service. Leaving the task to Vietnamese officers would give them visible responsibility for their own battalions. The command must decide which arrangement is to follow the issue of weapons."
 FRE_Aid.1.a:0 "Pair the new units with French cadres."
 FRE_Aid.1.b:0 "Leave training to Vietnamese officers."
 FRE_Aid.2.t:0 "The Associated State Armies"
 FRE_Aid.2.d:0 "Laos and Cambodia are forming new divisions with equipment and funding committed by the expeditionary corps. Their governments want national formations capable of defending their own territory. The French staff wants those units ready to take over posts that have been drawing on expeditionary reserves.\n\nOfficers experienced in training and administration can help establish the new commands, but many of the same men are needed to keep French battalions in the field. Since the forces have already been raised, the question before headquarters is how much of its experienced staff to lend them."
 FRE_Aid.2.a:0 "Send experienced cadres to both armies."
 FRE_Aid.2.b:0 "Keep senior cadres with the French units."
 FRE_Aid.3.t:0 "American Financing for the War"
 FRE_Aid.3.d:0 "American funds for the expeditionary budget have begun to reach Saigon. The money has already been secured; the outstanding question is whether the officers associated with the aid should be admitted to French planning offices as observers. Washington wants to see the program for which it is paying, beyond the accounts showing where the money went.\n\nSome at headquarters believe routine access would give the corps more leverage in future dealings with the mission. Others argue that observers in the planning offices could make every military decision look like a joint one. The command has to draw a line between financial supervision and operational authority."
 FRE_Aid.3.a:0 "Admit American observers to staff planning."
 FRE_Aid.3.b:0 "Keep operational planning in French hands."
 FRE_Intel.1.t:0 "Viet Minh Move on the Border Road"
 FRE_Intel.1.d:0 "Patrol reports from Route Coloniale 4 place Viet Minh regulars near the road between Cao Bang and Lang Son. The columns that supply the frontier posts cannot avoid the stretches of road overlooked from the hills. The staff is trying to reconcile reports of enemy movement with increasingly irregular contact from the smaller posts.\n\nIf the garrisons remain dispersed, the command has to prepare its road columns to keep them supplied under pressure. Pulling back the outlying posts would preserve more of the force at the cost of a thinner presence along the frontier. The staff needs instructions before assigning its reserves."
 FRE_Intel.1.a:0 "Prepare the frontier posts and road columns."
 FRE_Intel.1.b:0 "Plan to pull back the outlying posts."
 FRE_Intel.2.t:0 "The Border Road Report"
 FRE_Intel.2.d_win:0 "The Viet Minh have broken the chain of French posts along the border road. Reports reaching Lang Son describe scattered detachments and missing stores. The expeditionary command no longer has a continuous set of positions from which to contest traffic coming over from China.\n\nThe loss changes the supply estimates for Giap's regular divisions. The staff can turn the frontier reports into a study of how the garrisons were cut off, while headquarters will have to explain to Paris what can still be defended from the remaining positions. The command must decide where to put its immediate effort."
 FRE_Intel.2.d_fail:0 "The Viet Minh operation against Route Coloniale 4 has ended without the collapse of the French frontier position. The supply service still has a chain of posts to work with, although the movement returns show how much effort is required to move even one column through the sector under threat.\n\nThe revised frontier estimates are due at headquarters. The army can examine where communications and relief arrangements held up, while ministers in Paris want a clear statement of what the corps can still sustain on the border. The command must determine which report takes priority."
 FRE_Intel.2.a:0 "Draw staff lessons from the fighting."
 FRE_Intel.2.b:0 "Brief Paris on the remaining defenses."
 FRE_Intel.3.t:0 "Viet Minh Return to the Northwest"
 FRE_Intel.3.d:0 "French intelligence reports fresh Viet Minh movement into the northwestern highlands. Patrols have found signs that routes linking the valleys to the Black River are back in regular use. The staff believes Giap's forces are preparing another attempt to reopen a corridor into Tai country.\n\nThe garrisons depend on aircraft for bulky supplies and on local auxiliaries for warning of movements outside the posts. Officers in charge of the air service want to check what each strip can handle. The political officers argue that the first priority is to secure the cooperation of the local leaders whose men are already in the field."
 FRE_Intel.3.a:0 "Put the highland posts and aircrews on alert."
 FRE_Intel.3.b:0 "Ask Tai leaders to keep their men in the field."
 FRE_Intel.4.t:0 "The Northwest Corridor"
 FRE_Intel.4.d_win:0 "Viet Minh units have reopened a route through the northwestern highlands. Intelligence reports heavy losses during the advance, but the French command can no longer count on the corridor staying closed while it supplies the outlying garrisons. Some posts that could screen one another now have to be treated as isolated.\n\nSector officers want to review which positions can be held with the troops at hand. The air service is more concerned about the garrison loads that will now have to move by aircraft. The command must settle which part of the highland supply problem to address first."
 FRE_Intel.4.d_fail:0 "The Viet Minh have ended their attempt to reopen the northwestern corridor without securing a passage. The French posts remain in place, and local officials are trying to restore traffic between the settlements they serve. The remaining routes are still difficult to police from a handful of isolated garrisons.\n\nThe interval gives the staff time to correct weaknesses exposed during the fighting. Officers at the posts want a review of their defensive dispositions, while the air service wants revised schedules and reserve loads before another offensive cuts surface transport. Both requests are before headquarters."
 FRE_Intel.4.a:0 "Review the defenses of the highland posts."
 FRE_Intel.4.b:0 "Revise the air supply plan."
 FRE_Intel.5.t:0 "The Approaches at Vinh Yen"
 FRE_Intel.5.d_win:0 "Giap's attack around Vinh Yen has gained the approaches it was sent to take. French aircraft and guns could inflict losses on his divisions, but their intervention did not keep the existing line intact. The headquarters responsible for Hanoi's defenses must now account for an enemy able to concentrate in strength on the edge of the delta.\n\nThe staff wants to examine how quickly reports from the outposts reached the forces available to support them. Paris, meanwhile, needs an account of the setback that explains how the corps intends to keep the delta in the war."
 FRE_Intel.5.d_fail:0 "The Viet Minh bid for Vinh Yen has ended without a breach on the approaches to Hanoi. The delta command still has the ground it needs to bring guns and reserves into the sector, and the failure of the offensive gives it time to compare its plans with the actual movement of troops during the alarm.\n\nThe staff wants to study the warning and reinforcement schedules while unit reports are still fresh. The High Commission sees in the result a chance to explain to Paris why support for the delta defense remains worth the expenditure."
 FRE_Intel.5.a:0 "Review how the delta reserves were used."
 FRE_Intel.5.b:0 "Make the case for the delta defense in Paris."
 FRE_Intel.6.t:0 "The Coal District at Mao Khe"
 FRE_Intel.6.d_win:0 "The Viet Minh offensive has displaced the French defense around Mao Khe. The loss of ground in the coal district matters to the command at Haiphong because traffic between the port and the mining towns depends on the same approaches as its garrisons. A position that looked peripheral on an army map has become a problem for both the port and the mines.\n\nThe sector command wants to review the dispositions that left those routes exposed. Headquarters in Saigon needs to decide whether the coast can be covered by forces already there or whether reserves should be released from elsewhere."
 FRE_Intel.6.d_fail:0 "The attack in the Mao Khe district has ended without closing the approaches to Haiphong. Naval and air support available from the coast helped the garrisons keep contact with the command, but the fighting has shown how closely the security of the mining settlements depends on communications with the port.\n\nThe sector officers want to apply what they learned while the units still know the ground. They must also report to Saigon on whether the existing garrisons can sustain another alarm without reliable relief."
 FRE_Intel.6.a:0 "Review the defense of the coastal sector."
 FRE_Intel.6.b:0 "Ask Saigon for reserves for the coast."
 FRE_Intel.7.t:0 "The Line on the Day River"
 FRE_Intel.7.d_win:0 "Viet Minh forces have gained ground across the Day River. Posts that were supplied and commanded as part of one river line are losing contact with adjacent sectors. For the French authorities, the immediate worry is whether that disruption will spread into the southern delta and leave district officials without protection.\n\nThe field staff wants to examine the loss of contact between garrisons and mobile units before it revises the defense. The High Commission needs a separate account for ministers of which districts the corps can still support and what help it would need from France."
 FRE_Intel.7.d_fail:0 "The Viet Minh offensive has ended without breaking the Day River line. The French still control the posts from which they can protect traffic into the southern delta. That matters to the civil authorities in places such as Phat Diem, whose security arrangements depend in part on keeping communications open along the river.\n\nThe field command wants to use its reports to improve cooperation between fixed posts and the mobile reserve. The High Commission sees an argument for continuing to support the delta defense, provided Paris hears what the river line protects as well as what it costs."
 FRE_Intel.7.a:0 "Review coordination along the river line."
 FRE_Intel.7.b:0 "Explain the delta's position to Paris."
 FRE_Intel.8.t:0 "The Airhead at Na San"
 FRE_Intel.8.d_win:0 "The Viet Minh have broken the defense at Na San. The position was organized around a strip, with surrounding strongpoints intended to give the garrison enough room to receive ammunition, food and replacements by air. Losing that protection has exposed the dependence of the entire position on a single means of supply.\n\nThe staff wants to know whether the layout, the strength of the garrison or the ability to keep aircraft flying mattered most to the outcome. The command must decide whether to give immediate attention to that review or to the effect of the reverse on other garrisons."
 FRE_Intel.8.d_fail:0 "The Viet Minh offensive has ended without taking Na San. The airstrip remains in French hands, and the garrison's perimeter has kept the position supplied through the campaign. It is the evidence officers defending the airhead system have been waiting for.\n\nTransport officers are more cautious. They want the daily flying returns compared with the loads that reached the garrison before the result is used to justify another isolated camp. The command can commission that work now or put its immediate effort into recognizing the units that kept Na San in French hands."
 FRE_Intel.8.a:0 "Audit the garrison's air supply and relief."
 FRE_Intel.8.b:0 "Recognize the service of the garrison."
 FRE_Intel.9.t:0 "The Gap at Nghia Lo"
 FRE_Intel.9.d_win:0 "Nghia Lo has fallen to the Viet Minh, and a valley that linked several posts on the approach to Tai country is no longer available to the French command. Tai leaders facing the advance want to know whether they can still rely on the neighboring garrisons. French sector officers are trying to establish which posts remain in contact with each other.\n\nThe staff can review the defense from the dispositions it knows. Local authorities have a better picture of movements between the villages, but their help depends on whether they believe the command still intends to maintain a presence."
 FRE_Intel.9.d_fail:0 "The Viet Minh operation against Nghia Lo is over, and the French position there has survived. The valley remains available to the local garrison and the Tai leaders who depend on it for contact with the command. Their reports cover settlements beyond the patrols of the permanent posts.\n\nThe sector staff wants to examine how the positions covered one another during the alarm. The liaison officers see a chance to improve the reporting arrangement with the Tai authorities before enemy forces approach the valley again. The command has to decide which work takes priority."
 FRE_Intel.9.a:0 "Inspect the posts guarding the valley."
 FRE_Intel.9.b:0 "Seek better reports from Tai leaders."
 FRE_Intel.10.t:0 "The Position at Lai Chau"
 FRE_Intel.10.d_win:0 "The Viet Minh campaign has compromised Lai Chau as a base for French operations in the far northwest. The command can no longer assume that men and stores will travel freely between the Tai capital and the isolated posts that depend on it. Local leaders want to know what provision is being made for their forces and families if the remaining positions have to be evacuated.\n\nThe staff can work through the evacuation requirements now, or give immediate attention to consultations with the Tai authorities. Neither task will restore the position lost in the latest campaign."
 FRE_Intel.10.d_fail:0 "The offensive toward Lai Chau has ended without securing the Tai capital for the Viet Minh. The French still have their northwestern base, but its distance from the Tonkin depots has not changed. Dependents and auxiliary units attached to the garrison would be difficult to move if the command were forced to leave it on short notice.\n\nThe interval gives headquarters time to examine an evacuation plan without ordering a withdrawal. Liaison officers want to use the same interval to reassure the Tai authorities that the command is not preparing to leave without consulting them."
 FRE_Intel.10.a:0 "Review evacuation routes and priorities."
 FRE_Intel.10.b:0 "Reassure the Tai authorities."
 FRE_Intel.11.t:0 "The Lower Laos Diversion"
 FRE_Intel.11.d_win:0 "Viet Minh and Pathet Lao columns have drawn French attention and reserves into Lower Laos. The command cannot yet release the units sent to support the southern posts and still meet demands elsewhere. The weakness is felt at headquarters in the movement schedules: there are fewer uncommitted units to send where a new threat develops.\n\nThe southern command wants a review of its garrisons before their assignments are made permanent. The liaison officers argue that the report to Paris should make clear how much the French deployment depended on Laotian cooperation."
 FRE_Intel.11.d_fail:0 "French and Laotian forces have contained the diversion in Lower Laos. The plateau roads are still open to garrison traffic, and the southern command can review which units to keep on local duties without calling for another draft of reserves. The result leaves it with more freedom to meet demands on other fronts.\n\nThe French staff wants to examine how the southern garrisons managed with the troops available. Its liaison officers want Laotian units named in the report to Paris, where their contribution is otherwise liable to be counted as part of the French effort."
 FRE_Intel.11.a:0 "Review the southern garrison assignments."
 FRE_Intel.11.b:0 "Credit the Laotian forces in the report."

 FRE_Econ.1.t:0 "Armorin's Investigation"
 FRE_Econ.1.d:0 "Francois-Jean Armorin's reporting for Franc-Tireur has brought renewed attention to the piastre trade. Piastres transferred to France at the official rate command more francs than on the unofficial market. The difference gives traders a reason to claim remittances against cargo that was never shipped.\n\nThe French treasury bears the cost of honoring the transfers. In Indochina, merchants and military paymasters still rely on those same arrangements to settle legitimate accounts. The authorities must distinguish between the abuses Armorin has exposed and the payments on which recovering commerce depends."
 FRE_Econ.1.a:0 "Put the exchange accounts before the treasury."
 FRE_Econ.2.t:0 "The Piastre Inflation Crisis"
 FRE_Econ.2.d:0 "Wages and military pay in Indochina are buying less as prices rise. Trade has resumed in the towns without making supplies abundant, and the profitable transfer of piastres to France draws capital away from trade in local goods. Armorin's reporting makes it harder to treat the abuses as the work of a few brokers.\n\nThe treasury must settle whether the existing currency is worth preserving. A replacement issue backed by Paris could ease inflation, though it would deepen reliance on France. Keeping the piastre would avoid converting contracts and accounts while leaving purchasing power under pressure."
 FRE_Econ.2.a:0 "Put the currency question on the agenda."
 FRE_Econ.3.t:0 "The Vien-Dong Bac"
 FRE_Econ.3.d:0 "The administration has introduced the Vien-Dong Bac in place of the piastre. Pay offices and merchants now have to convert their accounts, but the new issue gives them a more stable basis for wages and purchases. The immediate aim is to ease the inflation that widened the gap between what the administration paid and what its employees could buy.\n\nConfidence in the issue depends on French financial support. The currency reform relieves an immediate pressure on commerce while giving Paris greater weight in the terms on which local business is financed."
 FRE_Econ.3.a:0 "Settle the accounts in the new currency."
 FRE_Econ.4.t:0 "Keeping the Piastre"
 FRE_Econ.4.d:0 "The pay offices will continue to reckon in piastres. Existing contracts and public accounts need no conversion, and the treasury has declined to seek the further commitment from Paris that would have been needed to back the proposed Vien-Dong Bac.\n\nThe immediate problem is the value of those payments. Suppliers can raise the prices they quote for the same order, while wages and military pay are fixed until the next revision. The administration has kept more control over the currency, but it must now contend with a sharper fall in what it buys."
 FRE_Econ.4.a:0 "Keep the piastre on the books."
 FRE_Econ.5.t:0 "The Bourgoin Industrial Program"
 FRE_Econ.5.d:0 "The authorities have adopted the Bourgoin report's proposals to rebuild civilian industry. The program is intended to increase the supply of locally manufactured goods, giving merchants and public services more chance of finding supplies without bidding against each other for the same imports. That gives the treasury some relief from pressure on prices.\n\nThe new works need machinery from abroad and financial backing from France. Their first effect is therefore to increase metropolitan involvement. Reducing that dependence will require enterprises that can keep producing after the initial purchases have been paid for."
 FRE_Econ.5.a:0 "Proceed with the civilian works program."
 FRE_Econ.6.t:0 "Export Orders Take Priority"
 FRE_Econ.6.d:0 "Export orders and military contracts now have first claim on raw materials. The administration expects shipments to France to bring in receipts and priority procurement to ease the corps' dependence on equipment bought elsewhere. Civilian firms see the change first in the cost and availability of materials that would otherwise go into local production.\n\nThe authorities have chosen a return from existing mines and works over the slower task of enlarging civilian output. The export schedules are more secure as a result. The pressure on domestic prices will persist while local supply falls short of demand."
 FRE_Econ.6.a:0 "Fill the export and military orders first."
 FRE_Econ.7.t:0 "Funding for the Tong Works"
 FRE_Econ.7.d:0 "The expeditionary command has released funds for the Tong aircraft works project. The program calls for two military workshops in the Hanoi region, where local production could take on work that now depends on outside deliveries. Building the shops still depends on the corps holding the site.\n\nThe new premises would not by themselves establish an aircraft industry. That would require suitable designs, machinery and a regular supply of parts. Until those are available, the staff can plan around equipment the workshops can maintain or make locally."
 FRE_Econ.7.a:0 "Set the priorities for the Tong works."
 FRE_Econ.8.t:0 "Rails Between Vientiane and Tonkin"
 FRE_Econ.8.d:0 "French locomotives have been delivered for the new railway connection between Vientiane and Tonkin. The link gives the expeditionary command an alternative to road haulage for stores that can be moved in bulk. The staff can now calculate regular consignments against a rail schedule instead of finding trucks for every movement.\n\nCivilian consignments are to use the same line. The transport service will have to divide the available wagons between depot traffic and merchants' freight while keeping enough capacity free for maintenance and delays."
 FRE_Econ.8.a:0 "Draw up the freight schedules."
 FRE_Econ.9.t:0 "Paris Receives the Rail Report"
 FRE_Econ.9.d:0 "The authorities in Indochina report that the Vientiane-Tonkin connection has entered service with locomotives supplied by France. The completion notice answers one question about the construction program: there is now a working route on which the corps can send freight that would otherwise travel by road.\n\nThe financial question remains open. Paris cannot calculate the return on the investment from the cost of construction alone. The useful figures will be loads carried, operating expenses and the number of road consignments the railway replaces."
 FRE_Econ.9.a:0 "Request the first traffic returns."
 FRE_Econ.10.t:0 "A Railway Outlet for Laos"
 FRE_Econ.10.d:0 "Merchants in Laos have a new freight route from Vientiane toward the northern ports. Traffic that once had to cover the entire distance by road can now be sent in wagon loads. For the government, the opening is a visible return on cooperation with the French authorities during a war that has absorbed much of the region's transport.\n\nMilitary stores claim space on the same trains. The advantage for Laotian producers will depend on whether ordinary goods can be booked on regular services rather than waiting for an occasional spare wagon."
 FRE_Econ.10.a:0 "Welcome the new outlet for Laotian trade."
