 POR_MIL.5.t:0 "Establishment of the Portuguese Air Force"
 POR_MIL.5.d:0 "By the late 1940s, Portuguese military aviation remained split between the Aeronáutica Militar (Army) and the Aviação Naval (Navy), limiting coordination and modernization. Seeking to follow the trend of other Western nations and to improve the nation’s strategic air capabilities, Lisbon decided to reorganize its armed forces.\n\nBy the Decree-law 37909, the Portuguese Government was reorganised and started to include the role of Minister of National Defense and, under this, the role of Undersecretary of State for the Aeronautics (Subsecretário de Estado da Aeronáutica or SEA) to be only filled upon the reorganisation of the air forces. The status of the Government member responsible for the air forces was, however, inferior to those responsible for the Navy and the Army, who retained the rank of ministers.\n\nBesides already foreseeing the existence of an independent air force, this act created de facto the Portuguese Armed Forces as an integrated organisation encompassing the Navy, the Army and the foreseen third branch, establishing a unified chain of command for all the branches under the military coordination of the Chief of the General Staff of the Armed Forces.\n\nOn [DAY.MONTH.YEAR], the Força Aérea Portuguesa (FAP) was officially established as an independent branch. It absorbed all aviation assets from both the Army and Navy, beginning a new chapter for Portuguese military aviation."
 POR_MIL.5.a:0 "Ex Mero Motu"
 
 POR_MIL.6.t:0 "The Portugese Navy"
 POR_MIL.6.d:0 "Portuguese innovations included the caravel, more sophisticated carracks for interoceanic travel, and the oceanic galleon. These vessels enabled explorers such as Bartolomeu Dias—who rounded the Cape of Good Hope—and Vasco da Gama—who reached India—linking Europe and Asia by sea for the first time. Expeditions like Pedro Álvares Cabral’s also resulted in the discovery of Brazil and facilitated voyages that connected Europe, Africa, the New World, and Asia in a single expedition.\n\nThe skills and navigational expertise of Portuguese sailors influenced other European powers, exemplified by Ferdinand Magellan’s first circumnavigation of the globe, in which several Portuguese captains, pilots, and sailors participated. From the late 15th to the late 16th centuries, the Portuguese Navy was among the most powerful maritime forces on Earth.In the mid-1950s, as NATO's Cold War maritime strategy took shape, the Portuguese Navy undertook Operação Consoada Azul ("Operation Blue Christmas"), a major fleet readiness and logistical exercise held in the Azores and Madeira archipelagos. Conducted in December 1955, it was the largest Portuguese naval deployment since the Second World War. The exercise’s purpose was to test the Navy’s ability to secure the mid-Atlantic sea lanes that linked continental Europe, North America, and colonial holdings in Africa and Asia.\n\nThe operation involved the cruzador ligeiro (light cruiser) NRP Almirante Cervera, several contratorpedeiros (destroyers) of the Vouga and Tejo classes, and a flotilla of newly acquired British-built corvetas. Air cover was coordinated with the Portuguese Air Force, using F-84G Thunderjets operating from Lajes Field in the Azores. Naval aviation units tested new anti-submarine warfare (ASW) tactics using sonar-equipped patrol launches, while replenishment trials at sea were performed with support ships to extend operational range."
 POR_MIL.6.a:0 "Honrai a Patria que a Patria vos contempla" 
 
 POR_MIL.7.t:0 "Reorganization of the Portuguese Army"
 POR_MIL.7.d:0 "With its origins stretching back to the 12th century, the Portuguese Army is among the oldest active armies in the world. Its roots lie in the military forces of the County of Portugal, which under Afonso Henriques achieved independence from the Kingdom of León in the 12th century. Victories such as the Battle of São Mamede (1128) and the decisive triumph at Ourique (1139) laid the foundations of the Portuguese Kingdom, formally recognized in the Treaty of Zamora (1143). The long Reconquista ended in 1249 with the conquest of the Algarve, marking the completion of Portugal’s medieval territorial unification.\n\nBy the mid-20th century, the Army was undergoing one of the most significant transformations in its history. In 1949, Portugal became a founding member of NATO, committing to the collective defense of the Western alliance during the rising tensions of the Cold War. Throughout the 1950s, the Army shifted its focus to preparing for conventional and potential nuclear warfare in Europe, adopting U.S. military doctrines, organization, training standards, and equipment models.\n\nThe turning point came on 1 August 1950, with the Decree-law reorganizing the Armed Forces into a single integrated body. This reform introduced the position of Minister of National Defense and established the Chief of the General Staff of the Armed Forces, centralizing command over the Army, Navy, and the newly foreseen Air Force. The Colonial Military Forces were merged with the Metropolitan Army, creating a single unified force serving both in European Portugal and across the overseas territories. This new framework reflected Lisbon’s determination to modernize its military while maintaining control over its far-flung empire during an increasingly volatile global order."
 POR_MIL.7.a:0 "Em perigos e guerras esforcados" 