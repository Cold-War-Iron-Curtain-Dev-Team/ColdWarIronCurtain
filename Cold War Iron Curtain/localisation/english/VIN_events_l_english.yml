VIN_Na_San_Objective_desc:0 "This is the live campaign mission; its expiry resolves the battle.\n§YAttack the highlighted province§!: the §YNa San§! camp, not Dien Bien Phu or Son La.\n§YHold§!: retain it for §Y5 consecutive daily ticks§!.\n§YCurrent hold§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§!. Losing the province resets the counter."
indochina_contested_objective:0 "Contested Objective"
indochina_contested_objective_desc:0 "This ground is being stormed, not garrisoned. The garrison holds it without prepared positions - and the moment it changes hands, the penalty goes with it."
