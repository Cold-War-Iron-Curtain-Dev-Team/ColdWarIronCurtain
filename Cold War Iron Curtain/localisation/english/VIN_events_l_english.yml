VIN_Campaign_Objective_Timer_desc:0 "This is the live campaign mission. Its expiry resolves the offensive at the hard deadline; hover it for the current objective, clean-result window, and campaign progress."
VIN_Vinh_Yen_Objective:0 "Battle Clock: Vinh Yen"
VIN_Vinh_Yen_Objective_desc:0 "This is the live campaign mission; its expiry resolves the battle.\n§YAttack the highlighted province§!: §YVinh Yen§!, northwest of Hanoi.\n§YHold§!: retain it for §Y5 consecutive daily ticks§!.\n§YCurrent hold§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§!. Losing the province resets the counter."
VIN_Mao_Khe_Objective:0 "Battle Clock: Mao Khe"
VIN_Mao_Khe_Objective_desc:0 "This is the live campaign mission; its expiry resolves the battle.\n§YAttack the highlighted province§!: §YMao Khe§!.\n§YHold§!: retain it for §Y5 consecutive daily ticks§!.\n§YCurrent hold§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§!. Losing the province resets the counter."
VIN_Day_River_Objective:0 "Battle Clock: Day River Line"
VIN_Day_River_Objective_desc:0 "This is the live campaign mission; its expiry resolves the battle.\n§YAttack all three highlighted provinces§!: §YNinh Binh§!, §YPhat Diem§!, and the §Ycentral Day River line§!.\n§YHold§!: retain all three together for §Y5 consecutive daily ticks§!.\n§YCurrent hold§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§!. Losing any one resets the counter."
