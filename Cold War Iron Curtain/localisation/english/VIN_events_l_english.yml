# ------------------------------------------------------------

VIN_FORPOL.0.t: "Vietnam in the New Order"
VIN_FORPOL.0.d: "The end of colonial war has not ended Vietnam's struggle. The old empires are weakened, the great powers are dividing the world into rival camps, and every government in Asia is being forced to choose between dependence, revolution, and an uncertain neutrality. Hanoi can no longer treat foreign policy as a matter for distant chancelleries. It is now inseparable from the survival of the Republic itself.\n\nSome comrades urge an immediate and unmistakable alignment with the socialist world. Others warn that Vietnam has only just escaped one form of foreign tutelage and must preserve room to act on its own behalf. Whatever course is chosen, the government must make clear that the Vietnamese people will not quietly accept a place assigned to them by Paris, Washington, Moscow, or Beijing."
VIN_FORPOL.0.a: "Vietnam will speak with its own voice."

VIN_FORPOL.1.t: "The Quest for United Nations Recognition"
VIN_FORPOL.1.d: "Diplomatic recognition remains incomplete. Though the Democratic Republic exercises authority at home and commands the loyalty of much of the population, many foreign governments still regard Vietnam through the lens of colonial treaties, wartime arrangements, and the ambitions of larger powers. A formal approach to the United Nations would place the question of Vietnamese sovereignty before the world.\n\nThe effort will be costly and uncertain. Some delegations will see an application from Hanoi as a test of France, the Soviet Union, China, or the United States rather than a straightforward question of national self-determination. Yet refusing to seek recognition would leave others free to define Vietnam's international position for it."
VIN_FORPOL.1.a: "Submit the application and make our case."

VIN_FORPOL.2.t: "Eyes Upon the World"
VIN_FORPOL.2.d: "The Ministry of Foreign Affairs has presented its first broad assessment of the postwar world. Asia is no longer merely a field upon which outside powers compete. New governments, liberation movements, and fragile coalitions are emerging from Jakarta to Cairo, Belgrade to Rangoon. Vietnam has potential friends in all of them, but also obligations and dangers that cannot be ignored.\n\nThe question is not whether Hanoi can influence world affairs; the question is where limited diplomatic energy should be spent first. The Republic must establish channels beyond its immediate borders, learn the intentions of the great powers, and ensure that its isolation cannot be used against it."
VIN_FORPOL.2.a: "Open the windows of Hanoi to the world."

VIN_FORPOL.3.t: "Revisiting the Sainteny Line"
VIN_FORPOL.3.d: "The understandings associated with Jean Sainteny once offered a possible path between continued colonial conflict and outright partition. Their meaning has since been overtaken by war, revolution, and the collapse of old assumptions. Nevertheless, French contacts quietly suggest that some elements of the earlier arrangement may still provide a basis for communication.\n\nTo reopen the question is not to forget the sacrifices that created the Republic. It is to determine whether diplomacy can secure concessions that force alone cannot yet guarantee. Hanoi must decide whether the Sainteny channel is a relic of failed compromise or a useful instrument in a changed international landscape."
VIN_FORPOL.3.a: "Review the old understandings without illusions."

# ------------------------------------------------------------
# French channel
# ------------------------------------------------------------

VIN_FORPOL.4.t: "What Does France Want?"
VIN_FORPOL.4.d: "The French position remains difficult to read. Paris speaks of peace, cultural ties, and a renewed relationship, yet French political factions disagree sharply over the future of its former empire. Some officials still hope to preserve influence through economic pressure and military access; others argue that a stable, independent Vietnam is preferable to endless conflict.\n\nThe Politburo must decide how to interpret these signals. A diplomatic opening could improve Vietnam's position, but misplaced trust would expose the Republic to manipulation at a moment when its institutions are still young."
VIN_FORPOL.4.a: "Study every French word and every French silence."

VIN_FORPOL.5.t: "Nguyen Duy Trinh's Investigation"
VIN_FORPOL.5.d: "Nguyen Duy Trinh has been instructed to assemble a confidential report on French policy. His investigators have reviewed diplomatic correspondence, commercial contacts, and the statements of politicians in Paris and Saigon. The evidence points in several directions at once: France is weary of war, but not necessarily reconciled to losing influence; certain French figures want a settlement, while others remain committed to restoring the old hierarchy by subtler means.\n\nThe report offers no simple answer. It does, however, make clear that Vietnam will need patience, reliable intelligence, and a willingness to exploit divisions within France itself."
VIN_FORPOL.5.a: "Bring the findings to the leadership."

VIN_FORPOL.6.t: "Telegraphs Between De Gaulle and Ho Chi Minh"
VIN_FORPOL.6.d: "Messages have arrived from circles close to Charles de Gaulle. Their tone is unusually respectful: they acknowledge Vietnam's political reality, condemn a return to futile colonial war, and hint that France may seek a role as mediator rather than master. The language is carefully chosen, but it is still more conciliatory than Hanoi expected.\n\nSome within the government see a rare opening. Others insist that even a sympathetic France will ultimately pursue French interests, especially where American influence and the future of Indochina are concerned. The reply sent now will determine whether the channel develops into a genuine relationship or remains a guarded exchange of courtesies."
VIN_FORPOL.6.a: "Recognize De Gaulle's goodwill and pursue the opening."
VIN_FORPOL.6.b: "Remain cautious; friendship is not yet trust."

VIN_FORPOL.7.t: "A French Mediator for Vietnamese Unity?"
VIN_FORPOL.7.d: "French intermediaries have suggested that a trusted envoy could help establish a framework for future talks over Vietnamese unity, security guarantees, and the remaining consequences of the colonial war. The proposal is delicate. French involvement may lend international weight to negotiations, but it could also allow Paris to present itself as the indispensable arbiter of Vietnam's future.\n\nThe government must decide whether to make use of the offer. A mediator cannot replace Vietnamese determination, but an external channel may help prevent Vietnam's fate from being decided exclusively by more powerful states."
VIN_FORPOL.7.a: "Explore the proposal while keeping the initiative in Vietnamese hands."

VIN_FORPOL.8.t: "An Unofficial Meeting at the Elysee"
VIN_FORPOL.8.d: "A Vietnamese delegation has been invited to an unofficial meeting in Paris. No treaty will be signed, no photographs will be released, and both governments will retain plausible deniability. Yet the encounter offers an opportunity to speak directly with figures close to the French presidency without the usual layers of colonial administrators, military officers, and hostile intermediaries.\n\nThe delegation has been instructed to stress Vietnam's sovereignty, its desire for peace, and its refusal to become a pawn in a wider contest. The real test will be whether France is prepared to hear those terms."
VIN_FORPOL.8.a: "Go to Paris, but give nothing away."

VIN_FORPOL.9.t: "The Vietnamese Request"
VIN_FORPOL.9.d: "Representatives of the Democratic Republic of Vietnam have arrived for a discreet meeting with French officials. They seek direct communication, a reduction of tension in Indochina, and French support for an eventual political settlement. Their request places France in an awkward position. A public embrace could provoke allies and domestic critics, but refusing contact may drive Hanoi more firmly into the orbit of rival powers.\n\nThe government must decide how far it is willing to go in opening a channel to the Vietnamese revolutionaries."
VIN_FORPOL.9.a: "Receive them discreetly; France must keep the channel open."
VIN_FORPOL.9.b: "Limit the meeting to formal courtesies."

VIN_FORPOL.10.t: "Winning the Trust of the SFIO"
VIN_FORPOL.10.d: "Vietnamese intermediaries have offered to help the French government demonstrate that a less confrontational policy in Indochina can produce tangible political gains. The proposal is aimed particularly at the SFIO and other center-left forces skeptical of endless colonial commitments. By presenting Hanoi as a serious national government rather than an irreconcilable threat, French supporters of a settlement may gain room to maneuver.\n\nAssistance would not be without risk. It could expose the French government to accusations of weakness, and it would give Vietnam a voice in a sensitive domestic debate."
VIN_FORPOL.10.a: "Use the opening to build confidence with the French left."
VIN_FORPOL.10.b: "France cannot stake its domestic politics on Hanoi."

VIN_FORPOL.11.t: "A Door Opens in Paris"
VIN_FORPOL.11.d: "The French center-left has responded favorably to the diplomatic effort. Supporters of a negotiated relationship with Vietnam now argue that contact with Hanoi can reduce instability, weaken hardliners, and preserve French influence through cooperation rather than coercion. The change is not decisive, but it gives Vietnamese diplomacy a constituency within France that did not previously exist.\n\nThe channel remains informal and vulnerable to political reversal. Still, Hanoi has gained evidence that the old colonial relationship is no longer the only imaginable future."
VIN_FORPOL.11.a: "Cultivate this opening carefully."

VIN_FORPOL.12.t: "French Caution Prevails"
VIN_FORPOL.12.d: "French officials have declined to make a substantial political commitment. They are willing to talk, but unwilling to risk domestic controversy or friction with foreign partners for the sake of a new policy toward Vietnam. The diplomatic channel remains technically open, yet it has produced little beyond polite assurances.\n\nHanoi must now assume that French goodwill, where it exists, will remain limited by French calculations. Vietnam cannot abandon diplomacy, but neither can it allow its long-term strategy to depend upon an uncertain change of heart in Paris."
VIN_FORPOL.12.a: "We will proceed without French guarantees."

VIN_FORPOL.13.t: "The French-American Rivalry"
VIN_FORPOL.13.d: "Vietnamese diplomats have quietly suggested that France could regain influence in Asia by distinguishing its policy from that of the United States. Washington's growing role in the region has unsettled many French politicians, who fear that American anti-communism may replace French colonialism without addressing the underlying national question.\n\nThe proposal is tempting: France might present itself as an independent European power capable of speaking to Hanoi where Washington cannot. Yet deliberately exploiting the rivalry would complicate relations with an important ally and could produce consequences far beyond Indochina."
VIN_FORPOL.13.a: "France should preserve an independent role in Asia."
VIN_FORPOL.13.b: "Do not turn Vietnam into a dispute with Washington."

VIN_FORPOL.14.t: "Room Between Paris and Washington"
VIN_FORPOL.14.d: "France has accepted the logic of an independent approach. Without breaking with the United States, French officials are prepared to explore policies toward Vietnam that serve French interests rather than merely reinforcing an American strategy. Hanoi has gained a useful diplomatic opening: Paris now has reason to see Vietnamese stability and autonomy as assets in its own contest for international influence.\n\nThe opportunity will require careful management. Vietnam must benefit from French independence without becoming dependent upon French rivalry."
VIN_FORPOL.14.a: "A useful contradiction has emerged."

VIN_FORPOL.15.t: "No Break with Washington"
VIN_FORPOL.15.d: "French officials have concluded that the risks of challenging the United States outweigh the possible benefits of a more independent Vietnam policy. The relationship with Hanoi will continue, but only within limits acceptable to France's broader alliance commitments.\n\nThe result is disappointing but clarifying. Vietnam may still seek French mediation where interests coincide, yet the Republic must not expect Paris to defy Washington when the stakes become serious."
VIN_FORPOL.15.a: "Take note and adjust our expectations."

# ------------------------------------------------------------
# Socialist-world and non-aligned outreach
# ------------------------------------------------------------

VIN_FORPOL.50.t: "Our Socialist Brothers"
VIN_FORPOL.50.d: "The socialist world offers Vietnam both solidarity and difficult choices. The Soviet Union, the People's Democracies, Yugoslavia, and other revolutionary governments possess resources, technical knowledge, and diplomatic weight that Hanoi urgently needs. At the same time, their disagreements demonstrate that socialism is not a single, uncomplicated bloc.\n\nVietnam must establish fraternal relations without allowing its independence to disappear beneath the priorities of larger states. The first step is simple: make clear that the Democratic Republic seeks comrades, not patrons."
VIN_FORPOL.50.a: "Extend the hand of revolutionary solidarity."

VIN_FORPOL.51.t: "[GetNewspaperHeader]Ho Chi Minh Tours the Socialist World"
VIN_FORPOL.51.d: "Ho Chi Minh has begun a high-profile tour of the socialist states, meeting party leaders, workers' delegations, and representatives of governments that have followed Vietnam's struggle with sympathy. The journey is intended to secure diplomatic recognition, economic assistance, and a place for Hanoi within the emerging network of revolutionary states.\n\nThe visit also carries symbolic importance. Vietnam, long treated by colonial authorities as a distant possession, now appears on the world stage as an independent political actor. Observers in both East and West will watch closely to see whether the tour binds Hanoi firmly to the Soviet-led camp or demonstrates a more flexible Vietnamese approach to international socialism."
VIN_FORPOL.51.a: "Vietnam has friends beyond its borders."

# ------------------------------------------------------------
# Laos
# ------------------------------------------------------------

VIN_FORPOL.100.t: "A New Order in Indochina"
VIN_FORPOL.100.d: "The future of Vietnam cannot be separated from the future of its neighbors. Laos and Cambodia remain vulnerable to outside pressure, internal rivalry, and the unfinished legacy of French rule. Hanoi must decide whether security is best achieved through patient cooperation, support for allied movements, or the creation of a more unified political order across Indochina.\n\nEvery course carries risks. A peaceful regional policy may leave hostile forces room to organize, while a more assertive strategy could revive fears of Vietnamese domination. The government must establish a coherent principle before events in Laos and Cambodia impose one upon it."
VIN_FORPOL.100.a: "Indochina's future cannot be left to others."

VIN_FORPOL.101.t: "The Land of a Million Elephants"
VIN_FORPOL.101.d: "Laos occupies a difficult position between Vietnam, Thailand, China, and the remnants of the French colonial system. Its political institutions are fragile, its armed factions divided, and its geography both a protection and a vulnerability. For Hanoi, Laos is not simply a neighbor: it is a corridor, a potential partner, and a test of whether regional solidarity can survive competing ambitions.\n\nTwo approaches are now being debated. One seeks to strengthen a peaceful coalition capable of keeping Laos neutral and stable. The other argues that only a disciplined revolutionary force can prevent the country from becoming a base for hostile intervention."
VIN_FORPOL.101.a: "The Laotian question must be approached with care."

VIN_FORPOL.102.t: "Mediating the Laotian Conflict"
VIN_FORPOL.102.d: "Vietnamese and Laotian representatives have agreed to open talks on the growing conflict between royalist authorities and communist forces. The negotiations are fragile: each side fears that a compromise will merely give its rival time to regroup, while external powers see Laos as a strategic prize.\n\nEven so, the alternative is increasingly clear. Without a political arrangement, local violence may harden into a civil war that draws in every neighboring state. The first task is to create enough confidence for the parties to speak."
VIN_FORPOL.102.a: "Vietnam will sponsor a political settlement."
VIN_FORPOL.102.b: "Laos will attend the talks in good faith."

VIN_FORPOL.103.t: "The Dong-Phouma Communique"
VIN_FORPOL.103.d: "After difficult discussions, Vietnamese and Laotian delegates have drafted a communique calling for reduced tensions, contact between rival political forces, and a common commitment to prevent Laos from becoming a battlefield for foreign powers. The document does not settle every dispute, but it provides language through which both governments can claim progress without surrendering their essential interests.\n\nHanoi must now decide whether to invest political capital in the agreement. Its success will depend less on the words signed today than on whether practical cooperation follows tomorrow."
VIN_FORPOL.103.a: "Endorse the communique and build on it."

VIN_FORPOL.104.t: "The Dong-Phouma Communique"
VIN_FORPOL.104.d: "The proposed communique with Vietnam offers Laos a narrow path away from open conflict. It promises contact, restraint, and a measure of regional recognition, but it also creates fears that Laos may become dependent upon Hanoi's protection. Supporters argue that cooperation is the only realistic alternative to war; critics warn that every concession could weaken the country's sovereignty.\n\nThe Laotian government must choose whether to treat the agreement as a safeguard for independence or the beginning of a dangerous entanglement."
VIN_FORPOL.104.a: "Accept the communique as a foundation for peace."

VIN_FORPOL.105.t: "Hope for Peace in Laos"
VIN_FORPOL.105.d: "The first results of the Laotian talks are encouraging. Joint patrols and public assurances have reduced the immediate danger of escalation, while local officials report that some communities are beginning to believe that compromise may be possible. The settlement remains vulnerable to spoilers, foreign pressure, and the unresolved ambitions of armed factions.\n\nFor now, however, Vietnam has an opportunity to demonstrate that regional influence need not always mean intervention. A stable Laos would strengthen Hanoi's security, improve its international standing, and offer a different model for Indochina's future."
VIN_FORPOL.105.a: "Give peace every chance to take root."

VIN_FORPOL.106.t: "[GetNewspaperHeader]Civil War Erupts in Laos"
VIN_FORPOL.106.d: "The fragile political balance in Laos has collapsed into open war. Pathet Lao forces, strengthened by outside support and years of clandestine preparation, have risen against the royal government. Reports from across the country describe attacks on outposts, defections from local authorities, and a rapid militarization of a conflict that had long been contained beneath the surface.\n\nThe outbreak threatens to transform Laos into the next major battlefield of Indochina. Neighboring governments now face a stark choice between intervention, mediation, and the risk that a local civil war will become part of a wider Cold War confrontation."
VIN_FORPOL.106.a: "Indochina enters another dangerous chapter."

# ------------------------------------------------------------
# Cambodia
# ------------------------------------------------------------

VIN_FORPOL.115.t: "The Land of Angkor"
VIN_FORPOL.115.d: "Cambodia's history, monarchy, and political traditions distinguish it sharply from Vietnam, yet its future is bound to the same unstable regional order. Prince Sihanouk seeks room to maneuver between competing powers, while Khmer leftists, royalists, nationalists, and foreign interests all struggle to define the country's direction.\n\nHanoi faces a difficult choice. It can seek a careful understanding with Phnom Penh and accept Cambodian neutrality, or it can cultivate revolutionary forces willing to reshape the country from within. The decision will influence not only Cambodia, but the credibility of Vietnam's claim to support an independent Indochina."
VIN_FORPOL.115.a: "Cambodia demands a policy of its own."

VIN_FORPOL.116.t: "[GetNewspaperHeader]Khmer Krahom Proclaims Its Revolution"
VIN_FORPOL.116.d: "A Khmer revolutionary movement has openly declared its break with the Cambodian government. Armed units have appeared in several provinces, calling for the destruction of royalist and reactionary authority and proclaiming a new struggle for national and social liberation. The movement's rapid emergence follows a period of political agitation, clandestine organization, and growing hostility toward Phnom Penh.\n\nThe declaration threatens to plunge Cambodia into civil war. For Vietnam, Thailand, and the major powers, the conflict raises immediate questions about borders, insurgency, and the future balance of influence in Indochina."
VIN_FORPOL.116.a: "Another front has opened in Indochina."

# ------------------------------------------------------------
# Communist victory in China
# ------------------------------------------------------------

VIN_FORPOL.500.t: "A Red Sun Over China"
VIN_FORPOL.500.d: "The victory of the Chinese Communists has transformed the strategic map of Asia. For the first time, Vietnam shares a frontier with a vast revolutionary state whose leaders speak openly of anti-imperialism, national liberation, and socialist reconstruction. The triumph in China offers hope to revolutionary movements across the continent, but it also brings a powerful new neighbor whose interests will inevitably shape Vietnam's future.\n\nHanoi must greet the new government warmly while preserving its own independence. The relationship with Beijing may become the foundation of Asian solidarity - or a source of pressures that Vietnam is not yet strong enough to resist."
VIN_FORPOL.500.a: "Send our congratulations to Beijing."

VIN_FORPOL.501.t: "Vietnam's Border Proposal"
VIN_FORPOL.501.d: "Vietnam has asked the new Chinese government to recognize the principles associated with the 1895 Gerard Convention as a practical basis for managing the Sino-Vietnamese frontier. Hanoi argues that a clear understanding now could prevent future disputes from poisoning relations between two revolutionary states.\n\nThe proposal is politically sensitive. Accepting it would reassure Vietnam and demonstrate revolutionary restraint, but it may also be portrayed as conceding historical claims before the new People's Republic has fully consolidated its authority."
VIN_FORPOL.501.a: "Honor the convention and secure the friendship of Vietnam."
VIN_FORPOL.501.b: "The frontier question cannot be settled so easily."

VIN_FORPOL.502.t: "Beijing Upholds the Convention"
VIN_FORPOL.502.d: "Beijing has accepted Vietnam's proposal to use the 1895 Gerard Convention as the basis for managing the common frontier. The decision does not settle every local question, but it removes an immediate source of friction and gives Hanoi a valuable assurance that the new Chinese government seeks partnership rather than domination.\n\nThe agreement will be welcomed by those who believe that socialist solidarity can overcome the inheritance of imperial borders. Its durability, however, will depend on whether both governments continue to treat one another as equals."
VIN_FORPOL.502.a: "A firm frontier makes for stronger comradeship."

VIN_FORPOL.503.t: "Beijing Rejects the Convention"
VIN_FORPOL.503.d: "The Chinese government has declined to endorse Vietnam's proposed frontier framework. Beijing insists that the border question requires further examination and cannot be resolved through an agreement inherited from the age of colonial diplomacy. The response is not openly hostile, but it is a reminder that revolutionary friendship does not erase national interests.\n\nHanoi must now proceed with caution. The relationship with China remains vital, yet Vietnam cannot allow uncertainty along its northern frontier to become a permanent instrument of pressure."
VIN_FORPOL.503.a: "Do not turn a disagreement into a rupture."

VIN_FORPOL.504.t: "Between Moscow and Beijing"
VIN_FORPOL.504.d: "Differences between the Soviet Union and China are becoming harder to conceal. What began as disputes over tactics, aid, and the pace of revolution now threatens to divide the socialist world into rival centers of authority. Vietnam is deeply exposed: both powers are essential partners, and a choice between them could reshape every aspect of the Republic's foreign policy.\n\nHanoi has an opportunity to offer itself as an intermediary, but mediation may only delay a conflict too large for Vietnam to resolve. The leadership must decide whether to invest its prestige in preserving unity."
VIN_FORPOL.504.a: "Offer Hanoi as a bridge between the two capitals."

VIN_FORPOL.505.t: "A Concerning Future for Global Revolution"
VIN_FORPOL.505.d: "The attempt to mediate has revealed the depth of the Sino-Soviet divide. Both Moscow and Beijing expect their friends to demonstrate loyalty, and both view neutrality with suspicion. Vietnam's leaders understand that this is not merely a dispute between distant capitals: aid, military support, trade, and the future of Asian revolution may all depend upon the position Hanoi adopts.\n\nThe Republic must decide whether to stand closer to Moscow, align with Beijing, or insist on a separate Vietnamese line despite the risks of offending both."
VIN_FORPOL.505.a: "The Soviet Union remains the anchor of socialism."
VIN_FORPOL.505.b: "The Asian revolution must look to Beijing."
VIN_FORPOL.505.c: "Vietnam will preserve an independent revolutionary line."

# ------------------------------------------------------------
# Nationalist victory in China
# ------------------------------------------------------------

VIN_FORPOL.550.t: "A White Sun Over China"
VIN_FORPOL.550.d: "The Chinese Nationalists have prevailed, leaving Vietnam with an unexpectedly hostile strategic environment. The northern frontier is now controlled by a government deeply suspicious of communist movements and closely tied to anti-communist forces across Asia. Revolutionary cadres fleeing China may seek refuge in Vietnam, while Chiang Kai-shek's government will likely demand cooperation against what it sees as a regional insurgent threat.\n\nHanoi cannot ignore the reality of the new China. The Republic must either seek a pragmatic accommodation with Nanjing or prepare to become a refuge and base for the Chinese revolution that has been defeated across the border."
VIN_FORPOL.550.a: "The northern horizon has darkened."

VIN_FORPOL.551.t: "Survival Through Diplomacy"
VIN_FORPOL.551.d: "With a Nationalist China on its border, Vietnam cannot afford gestures that invite immediate confrontation. Some leaders argue that the Republic must demonstrate restraint, open channels to Nanjing, and seek coexistence with whichever Chinese government holds power. Such a policy may be ideologically uncomfortable, but it could buy time for Vietnam to consolidate and avoid a war it cannot yet win.\n\nThe alternative is to embrace revolutionary defiance and accept that the border may become the front line of a larger Asian conflict."
VIN_FORPOL.551.a: "Secure Vietnam's survival before pursuing grander aims."

VIN_FORPOL.552.t: "The Lu Han Channel"
VIN_FORPOL.552.d: "Contacts associated with Lu Han have indicated that a quieter route into Chinese politics may be possible. Regional figures in Yunnan understand the practical value of stable trade, secure borders, and avoiding a permanent confrontation between Hanoi and Nanjing. They may not share Vietnam's ideology, but they have reasons to resist policies that turn the frontier into a military zone.\n\nThis channel cannot replace formal diplomacy, yet it may offer Hanoi a useful source of information and a means of testing how flexible the Nationalist government is prepared to be."
VIN_FORPOL.552.a: "Maintain the channel and listen carefully."

VIN_FORPOL.553.t: "The Kunming Conference"
VIN_FORPOL.553.d: "After months of indirect contacts, Vietnamese and Chinese representatives are prepared to meet in Kunming. Hanoi will seek a framework for coexistence: an end to covert hostility, respect for borders, regulated trade, and an understanding that Vietnam's internal system will not be used as a pretext for intervention.\n\nThe conference is a gamble. A successful agreement could stabilize the northern frontier and give Vietnam room to rebuild. Failure would confirm that the Nationalist government sees no place for a socialist Vietnam in its regional order."
VIN_FORPOL.553.a: "Send the delegation to Kunming."

VIN_FORPOL.554.t: "The Vietnamese Offer at Kunming"
VIN_FORPOL.554.d: "The Vietnamese delegation has offered a comprehensive coexistence agreement: mutual non-interference, border guarantees, regulated commerce, and an end to support for hostile political factions. The proposal would not make Hanoi an ally, but it could prevent the frontier from becoming a permanent source of crisis.\n\nAccepting the offer would acknowledge the durability of the Vietnamese regime. Rejecting it would preserve ideological clarity and political leverage, but at the cost of continued instability in the south."
VIN_FORPOL.554.a: "Accept coexistence; China has enough enemies already."
VIN_FORPOL.554.b: "Reject the proposal; Hanoi cannot be trusted."

VIN_FORPOL.555.t: "Kunming Succeeds"
VIN_FORPOL.555.d: "The Kunming Conference has produced an agreement. Vietnam and Nationalist China have accepted a framework for mutual coexistence, including an understanding on borders, commerce, and political non-interference. Neither side has abandoned its ideology, but both have recognized that a permanent crisis would serve only outside powers and regional extremists.\n\nThe accord gives Hanoi a breathing space that few believed possible after the Nationalist victory in China. The Republic can now pursue reconstruction and diplomacy with less immediate fear that its northern frontier will ignite."
VIN_FORPOL.555.a: "A difficult peace is still a peace."

VIN_FORPOL.556.t: "Kunming Fails"
VIN_FORPOL.556.d: "The Kunming Conference has ended without agreement. Chinese delegates rejected Hanoi's terms, and the Vietnamese delegation concluded that further concessions would amount to political submission. The failure leaves both governments suspicious, armed, and increasingly prepared for the possibility that the border dispute will become a wider confrontation.\n\nDiplomacy has not been exhausted forever, but the immediate prospect of coexistence has collapsed. Vietnam must prepare for a harsher regional order."
VIN_FORPOL.556.a: "Then we must prepare for the consequences."

VIN_FORPOL.557.t: "[GetNewspaperHeader]A Coalition Government Reforms in Hanoi"
VIN_FORPOL.557.d: "Vietnamese political leaders have announced the reformation of the Chinh phu lien hiep, a broad national coalition intended to bring nationalist, socialist, and patriotic forces into a common political framework. The initiative follows months of negotiation with groups that had previously stood outside the dominant revolutionary movement.\n\nSupporters describe the coalition as a practical response to the new balance of power in Asia: Vietnam must demonstrate national unity if it is to negotiate with stronger neighbors and resist outside pressure. Critics question whether the arrangement can survive the ideological divisions it is meant to bridge. Even so, the announcement marks a significant effort to redefine the political character of the Vietnamese state."
VIN_FORPOL.557.a: "Hanoi seeks unity in a dangerous age."

# ------------------------------------------------------------
# Socialist resistance after Nationalist victory in China
# ------------------------------------------------------------

VIN_FORPOL.600.t: "The Revolution Will Not End at the Border"
VIN_FORPOL.600.d: "The defeat of the Chinese Communists has convinced many in Hanoi that compromise with the Nationalist government will only postpone a larger struggle. Refugees, former PLA officers, and underground cadres are already seeking contact with Vietnam. They argue that the Chinese revolution has been defeated, not destroyed, and that the mountains and borders of Southeast Asia can become the base from which it is renewed.\n\nChoosing this path would place Vietnam in direct opposition to Nanjing and expose the Republic to enormous danger. Yet supporters insist that abandoning Asian revolution would leave Vietnam isolated in a region increasingly dominated by anti-communist powers."
VIN_FORPOL.600.a: "Hanoi will remain a citadel of Asian revolution."

VIN_FORPOL.601.t: "A Coming Storm for China"
VIN_FORPOL.601.d: "The creation of an Asian Liberation Front has transformed scattered resistance networks into a more deliberate political and military project. Chinese revolutionary exiles, Vietnamese organizers, and allied movements now speak openly of a future struggle against the Nationalist government. Border defenses are being surveyed, supply routes expanded, and political propaganda prepared for circulation inside China.\n\nNo immediate war has been declared, but the meaning of these preparations is unmistakable. Vietnam is no longer merely defending its independence; it is becoming a rear area for a renewed contest over the future of China and Asia."
VIN_FORPOL.601.a: "Prepare for the storm ahead."

# === Military Doctrine Event Chain (merged from VIN_MIL_l_english.yml) ===
VIN_MIL.0.t: "The Concept of People's War"
VIN_MIL.0.d: "The struggle for Vietnam's liberation cannot be won by armies alone. Under the leadership of Uncle Ho and the Party, a doctrine born from resistance to colonialism has taken shape: People's War.\n\nUnlike conventional warfare, People's War mobilizes the entire nation into a single front. Soldiers fight on the battlefield, workers labor in factories, farmers sustain the countryside, teachers educate the young, and cadres organize the villages. Every hamlet becomes a fortress, every province a battlefield, and every citizen a participant in the revolutionary struggle.\n\nVictory will not be achieved by military means alone. The war must be fought on military, political, economic, cultural, ideological, and diplomatic fronts. Armed struggle is inseparable from political mobilization, while production and education are themselves forms of resistance.\n\nAt the center of this strategy stand the People's Armed Forces: the People's Army, the People's Public Security Forces, and the Self-Defense Militia. Together, they form the backbone of a nationwide resistance capable of confronting an enemy far stronger in material resources."
VIN_MIL.0.a: "Whoever has a gun, use a gun. Whoever has a sword, use a sword. If there is no sword, use hoes, shovels, and sticks."
VIN_MIL.1.t: "[VIN_MIL_1_Title]"
VIN_MIL.1.d: "[VIN_MIL_1_Desc]"
VIN_MIL.1.a: "[VIN_MIL_1_Option]"
VIN_MIL.1.t_prc: "The Return of the Chinese-Trained Comrades"
VIN_MIL.1.d_prc: "Following the victory of the Chinese Communists and the establishment of the People's Republic of China, the northern frontier has changed from a dangerous border into a gateway of revolutionary cooperation. Over the past year, hundreds of Vietnamese cadres, officers, and soldiers have trained in camps at Wenshan, Longzhou, Jingxi, and Simao under experienced Chinese instructors.\n\nToday, the first large contingents of these Chinese-trained comrades have returned to Vietnam. They bring knowledge of large-unit operations, logistics, artillery coordination, engineering, communications, and political organization. Alongside them arrive weapons, ammunition, radios, medical supplies, and military vehicles sent through the new supply routes linking southern China to Viet Bac.\n\nGeneral Vo Nguyen Giap has welcomed the returning cadres as the foundation of a People's Army capable of confronting colonial forces on more equal terms. The General Staff has begun assigning them to regular formations throughout the country, with particular attention given to the continued development of the 308th Division, the first full infantry division of the People's Army."
VIN_MIL.1.a_prc: "The East is Red."
VIN_MIL.1.t_chi: "The Return of the Revolutionary Exiles"
VIN_MIL.1.d_chi: "The Nationalist victory in the Chinese Civil War has reshaped the political landscape of Asia in an unexpected way. Communist cadres, People's Liberation Army veterans, labor organizers, and revolutionary intellectuals have been driven from the mainland by Kuomintang security forces. Denied sanctuary across much of East Asia, many have sought refuge in the mountains and borderlands of northern Vietnam.\n\nOver recent months, streams of Chinese revolutionaries have crossed into Viet Bac. They include guerrilla commanders, political commissars, engineers, doctors, teachers, and veterans hardened by years of civil war. Though defeated in China, they remain committed to the struggle against imperialism and reaction.\n\nPresident Ho Chi Minh has authorized International Volunteer Training Groups to integrate these exiles into the Vietnamese resistance. Their instructors will train Vietnamese units in modern infantry tactics, logistics, communications, intelligence, and political organization, while underground networks across southern China begin moving weapons, medicine, printing equipment, and volunteers across remote mountain passes."
VIN_MIL.1.a_chi: "Vietnam and China are brothers in revolution."
VIN_MIL.1.t_fallback: "The Return of Northern Comrades"
VIN_MIL.1.d_fallback: "Veterans, technicians, and revolutionary cadres from beyond Vietnam's northern frontier have begun arriving in Viet Bac. Their experience in organization, communications, logistics, and modern warfare will strengthen the People's Army as it grows from a guerrilla force into a national army of liberation.\n\nThe exact fate of China remains unsettled, but the revolution cannot afford to waste the expertise of those willing to continue the struggle in Vietnam."
VIN_MIL.1.a_fallback: "Every comrade strengthens the resistance."
VIN_MIL.2.t: "The Founding of the Quan Y Vien"
VIN_MIL.2.d: "As the war against French colonialism enters a more demanding phase, the Democratic Republic of Vietnam has announced the founding of the Quan Y Vien, the Military Medical Academy. It is the first institution dedicated to training military doctors, surgeons, pharmacists, and medical cadres for the People's Army.\n\nOpened at Doi Tram in Vinh Phuc Province, the academy will prepare medical personnel for the conditions of jungle warfare, mountain campaigns, and improvised field hospitals. Since the beginning of the resistance, thousands of wounded soldiers have depended on volunteer nurses, civilian physicians, and makeshift medical stations. Their courage has saved many lives, but the growing scale of the war has made a professional military medical service indispensable.\n\nIn a message to the opening ceremony, President Ho Chi Minh praised the future doctors of the revolution and reminded them that the fight for independence depends as much on those who preserve life as on those who take up arms."
VIN_MIL.2.a: "To heal the wounded is to strengthen the resistance. To save a soldier is to return a rifle to the battlefield."
VIN_MIL.3.t: "Sac lenh so 17/SL"
VIN_MIL.3.d: "By decree of the President of the Democratic Republic of Vietnam, the Ministry of National Defense has established a new system of Military Regions: Viet Bac, Tay Bac, Dong Bac, Ta Ngan, Huu Ngan, and Military Region 4.\n\nEach regional command will bear responsibility for national defense within its assigned territory. Its commanders are to organize local defense, direct units guarding coasts, borders, and demarcation lines, command the armed forces of provinces and districts, and coordinate militia, mobilization, and demobilization work with civilian authorities.\n\nThe decree replaces all previous regulations that conflict with the new organization. In a war fought across mountains, deltas, and scattered liberated zones, the Republic requires commands capable of uniting military operations with the work of local government and the people."
VIN_MIL.3.a: "Signed."
VIN_MIL.4.t: "Implementing General Giap's Suggestions"
VIN_MIL.4.d: "As the resistance against French colonialism enters a decisive stage, the Central Military Commission has approved reforms proposed by General Vo Nguyen Giap. Their purpose is to transform the People's Army from a collection of regional guerrilla bands into a coordinated revolutionary force capable of defeating a technologically superior enemy.\n\nThe reforms build upon the doctrine of People's War. Because the Democratic Republic lacks France's industrial capacity, heavy weapons, and financial resources, victory must rest upon political determination, mobility, popular support, and superior strategy rather than material strength alone.\n\nThe General Staff has adopted the principle of Independent Company, Concentrated Battalion. Local companies will harass enemy positions, gather intelligence, protect revolutionary administrations, and disrupt communications across villages and provinces. Battalions and larger formations will be concentrated when conditions allow isolated enemy units to be destroyed through overwhelming local superiority.\n\nPolitical education will also expand throughout the armed forces. Every soldier must understand not only how to fight, but why he fights."
VIN_MIL.4.a: "If the enemy advances, we withdraw. If he is isolated, we strike. If he is weak, we destroy him."
VIN_MIL.5.t: "The Air Force Research Bureau is Established"
VIN_MIL.5.d: "Despite possessing no operational air force, the Ministry of National Defense has established an Air Force Research Bureau under the General Staff of the Vietnam National Army and Militia. The decision reflects the leadership's determination to prepare for the future development of military aviation and one day challenge French aerial supremacy over Vietnam.\n\nThe bureau traces its origins to two civilian aircraft donated to the Democratic Republic after the August Revolution: a de Havilland Tiger Moth trainer and a Morane-Saulnier MS.343, formerly owned by Bao-Dai. After the outbreak of nationwide resistance, both aircraft were dismantled and moved through dangerous routes into the Viet Bac resistance zone. French aircraft repeatedly attacked the convoys, but revolutionary engineers preserved many components for future study.\n\nHa Dong, former secretary to Deputy Minister of National Defense Ta Quang Buu, has been appointed to lead the bureau. He will be assisted by technicians, mechanics, and aviation enthusiasts including Nguyen Van Dong, Nguyen Duc Viet, and Nguyen Tam Trinh."
VIN_MIL.5.a: "We will defend the skies of the fatherland."
VIN_MIL.6.t: "The Naval Research Committee is Established"
VIN_MIL.6.d: "The General Command of the Vietnam National Army and Militia has established the Naval Research Committee under the General Staff, marking the first major step toward rebuilding a revolutionary naval force after years of war and hardship.\n\nThe decision revives a vision first pursued in 1946, when the government created a Naval Agency to organize coastal defense and maritime patrol forces for the young Republic. Those efforts were cut short by the outbreak of full-scale war. As French forces advanced along the coast and major waterways, naval vessels and equipment were scuttled or dismantled to prevent their capture.\n\nNow the Party and the armed forces have determined that Vietnam must prepare to defend not only its mountains and jungles, but also its rivers, coastlines, and territorial waters. The committee will be headquartered on Gian Street along the Chay River in Doan Hung District, Phu Tho Province. Nguyen Van Khuong has been appointed head of the committee, assisted by Political Commissar Nguyen Viet and Deputy Head Tran Dinh Vong.\n\nIts specialized sections will cover maritime operations, maritime communications, and electrical and marine engineering."
VIN_MIL.6.a: "The islands are our homes; the oceans are our fatherland."
VIN_MIL.7.t: "The People's Public Security Forces"
VIN_MIL.7.d: "Decree No. 23/SL, signed by President Ho Chi Minh on 21 February 1946, has formally established the People's Public Security Force - Cong An - as a unified national security organization responsible for defending the Democratic Republic of Vietnam against espionage, sabotage, banditry, and counter-revolutionary activity.\n\nThe new force consolidates security organizations that emerged during the revolutionary struggle: the Security Departments in the north, Intelligence Departments in central Vietnam, and National Self-Defense Forces operating in the south. They will now operate under a single command structure directed by the Vietnam Public Security Department within the Ministry of the Interior. Veteran revolutionary Le Gian has been appointed its first director.\n\nParty leaders emphasize that the force is not an entirely new creation. It continues a clandestine tradition of Red Self-Defense Teams, Worker-Peasant Self-Defense Units, Honor Guard Teams, and Viet Minh security detachments that protected cadres, guarded Party facilities, exposed enemy agents, and defended liberated areas during the years of colonial repression."
VIN_MIL.7.a: "Protect the security of the fatherland."
VIN_MIL.8.t: "Sac lenh so 121/SL"
VIN_MIL.8.d: "By decree of the President, the organization of the Vietnam National Army and Militia's General Staff has been clarified and expanded. The General Staff, General Political Department, General Supply Department, Inspection Team, and Commander-in-Chief's Office will together assist the Commander-in-Chief in the direction of the war.\n\nThe General Staff will organize the army and militia and direct combat operations through its Operations, Military Intelligence, Military Training, Militia, and Communications Departments. It will be led by a Chief of the General Staff, assisted by one or two deputies. The Chief is authorized to direct the Engineering and Artillery Departments and supervise the establishment of military insignia.\n\nThe General Political Department will assist the Commander-in-Chief in maintaining political direction throughout the armed forces. By linking operations, intelligence, training, supply, and political work under a clearer structure, the decree gives the Republic a command system suited to a growing people's army."
VIN_MIL.8.a: "The General Staff will direct the war."
VIN_MIL.9.t: "The Tong Quan Uy is Re-established"
VIN_MIL.9.d: "The Central Committee of the Vietnam Workers' Party has announced the re-establishment of the General Military Commission, the Tong Quan Uy, restoring the Party's highest organ of military leadership over the People's Army and the armed forces of the Democratic Republic of Vietnam.\n\nThe decision comes as the resistance enters a new and more demanding stage. The People's Army has grown from scattered guerrilla detachments into a revolutionary force capable of conducting large-scale operations across the country. Party leaders have concluded that stronger political leadership and coordination are needed to guide the expanding armed forces through the years ahead.\n\nThe General Military Commission will formulate military strategy, national-defense policy, force-development programs, and plans for the future construction of the armed forces. It will ensure the Party's direct and comprehensive leadership over military affairs. Though the Commission traces its roots to the early days of the revolution, its restoration reflects the scale and complexity of the war now being fought."
VIN_MIL.9.a: "Victorious in both war and mind."
VIN_MIL.10.t: "The Cuc Quan Bao Intelligence Bureau is Established"
VIN_MIL.10.d: "The Ministry of National Defense and General Command of the Vietnam National Army have announced the establishment of the Cuc Quan Bao, the Military Intelligence Bureau. The new institution will centralize military intelligence, reconnaissance, and counter-infiltration work in direct support of the revolutionary armed forces.\n\nIts roots lie in the Military Intelligence Department formed after the August Revolution on 25 October 1945 under Hoang Minh Dao, also known as Dao Phuc Loc. Since the outbreak of war with France, commanders have repeatedly learned that timely information can accomplish what superior numbers and weapons cannot.\n\nThe Bureau will consolidate reconnaissance and intelligence elements into a professional organization subordinate to the General Command. Its duties include monitoring French troop movements, assessing friendly forces, infiltrating enemy administrative networks, conducting counter-intelligence operations, and furnishing commanders with accurate battlefield reports. In a struggle against a materially stronger enemy, intelligence is not an auxiliary task; it is a weapon of the revolution."
VIN_MIL.10.a: "Courage and unwavering loyalty."
VIN_MIL.11.t: "Sac lenh so 50/SL"
VIN_MIL.11.d: "President Ho Chi Minh has issued Decree No. 50/SL, clarifying the responsibilities of the Ministry of National Defense and the Commander-in-Chief of the Vietnam National Army and Militia.\n\nThe Ministry is charged with organizing and administering the army and national-defense agencies, as well as directing national-defense production. The Commander-in-Chief retains responsibility for the command of the army and militia, using the General Staff and related departments to direct operations, deployments, and the use of military production.\n\nThe decree also establishes the supporting structure required for a modern wartime ministry: offices and administrative departments directly assisting the Minister, specialized production departments, the General Staff and command departments, and an Inspection Team led by a Chief Inspector under the authority of the Commander-in-Chief.\n\nThe Republic's armed struggle can no longer depend upon improvised arrangements alone. The institutions of war must now be built with the same seriousness as the forces that fight it."
VIN_MIL.11.a: "Signed."

# === South Vietnam War Event Chain (merged from SWF_VIN_l_english.yml) ===
# ------------------------------------------------------------------
# National resistance
# ------------------------------------------------------------------

SWF_VIN.0.t: "The National Resistance"
SWF_VIN.0.d: "The struggle for independence has entered a new and more demanding phase. Across the country, the Democratic Republic calls upon workers, peasants, students, officials, and soldiers to treat the defense of the nation as a common responsibility. The enemy may possess heavier weapons, wider resources, and foreign backing, but Vietnam possesses the determination of a people defending its own land.\n\nThe Party and Government have therefore proclaimed a comprehensive resistance. Villages will organize self-defense, factories will sustain the front, and cadres will bind military operations to political work. The conflict will not be decided in a single battle, but through endurance, organization, and the refusal to surrender the nation's future."
SWF_VIN.0.a: "All for the resistance; all for victory."

# ------------------------------------------------------------------
# PRC victory: Moscow and Beijing
# ------------------------------------------------------------------

SWF_VIN.1.t: "A Vietnamese Delegation in Moscow"
SWF_VIN.1.d: "Representatives of the Democratic Republic of Vietnam have arrived in Moscow after a journey through the newly transformed political landscape of Asia. Their delegation seeks recognition, material assistance, and a clear place for Vietnam within the wider struggle against colonialism.\n\nA Soviet decision will carry consequences far beyond Indochina. Open recognition would strengthen the Vietnamese resistance and signal that Moscow is prepared to contest Western influence in Southeast Asia. Caution, however, may preserve diplomatic flexibility at a time when the new Chinese revolution has already altered the balance of power along the Asian frontier."
SWF_VIN.1.a: "Recognize the Vietnamese revolution."
SWF_VIN.1.b: "Offer sympathy, but avoid a formal commitment."

SWF_VIN.2.t: "Ho Chi Minh Looks North"
SWF_VIN.2.d: "A Vietnamese delegation has reached Beijing seeking the recognition and support of the People's Republic. The triumph of the Chinese Revolution has transformed the border from a barrier into a potential artery of cooperation, linking the resistance in Viet Bac with a vast revolutionary state to the north.\n\nThe Vietnamese request is both political and practical. Recognition would establish a public partnership between the two revolutions, while cooperation across the frontier could open routes for training, communications, medicine, and military supplies. Yet the new government must still decide how openly it wishes to challenge the colonial order in Indochina."
SWF_VIN.2.a: "Open the border to our Vietnamese comrades."
SWF_VIN.2.b: "Maintain friendly but limited relations."

# ------------------------------------------------------------------
# ROC victory: Moscow and Nanking
# ------------------------------------------------------------------

SWF_VIN.3.t: "Vietnam Seeks a Soviet Understanding"
SWF_VIN.3.d: "The outcome of the Chinese Civil War has left the Vietnamese revolution in a more uncertain regional position. With the Nationalist Government holding the mainland, representatives of the Democratic Republic have come to Moscow to seek political recognition and an independent connection to the socialist world.\n\nThe delegation argues that the struggle in Indochina remains an anti-colonial cause regardless of events in China. Soviet recognition could give Hanoi valuable legitimacy and demonstrate that the revolutionary movement has not been isolated by the victory of the Kuomintang. The Kremlin must weigh this appeal against the risks of a more direct confrontation with the Western-backed order in Asia."
SWF_VIN.3.a: "Recognize Vietnam's independent revolutionary course."
SWF_VIN.3.b: "Keep the relationship unofficial for now."

SWF_VIN.4.t: "An Overture From Hanoi"
SWF_VIN.4.d: "The Democratic Republic of Vietnam has approached the National Government with a proposal for practical accommodation. The Vietnamese leadership seeks to prevent the northern frontier from becoming another front in the struggle between revolution and reaction, offering assurances that its immediate struggle is directed against colonial domination rather than China.\n\nThe offer is politically delicate. Hanoi remains led by revolutionaries whose ideology is deeply suspect to Nanking, but cooperation - or at least restraint - could deny foreign powers an opportunity to exploit the border. The National Government must decide whether to pursue a cautious understanding or keep the Vietnamese movement at arm's length."
SWF_VIN.4.a: "Explore a cautious accommodation."
SWF_VIN.4.b: "Maintain only informal contact."

# ------------------------------------------------------------------
# Party and national-front development
# ------------------------------------------------------------------

SWF_VIN.5.t: "The General Political Department"
SWF_VIN.5.d: "The People's Army cannot be sustained by weapons and orders alone. As the war grows in scale, the Government has approved the creation of the Tong Cuc Chinh Tri, the General Political Department, to coordinate political education, morale, cadre work, and Party organization throughout the armed forces.\n\nIts purpose is not merely to distribute slogans. The Department will ensure that soldiers understand the political meaning of the war, that commanders remain connected to the people, and that the army develops as an instrument of national liberation rather than a detached military caste. In a long revolutionary struggle, political cohesion is treated as a weapon no less essential than rifles or artillery."
SWF_VIN.5.a: "The army must fight with both conviction and discipline."

SWF_VIN.6.t: "Lessons From a Hundred Flowers"
SWF_VIN.6.d: "Debates unfolding elsewhere in the socialist world have drawn attention in Hanoi. The call to let criticism, art, and scholarship speak more freely offers both a promise and a warning: a revolution that cannot hear the people may become brittle, yet an opening without political direction may be exploited by its enemies.\n\nVietnamese cadres have been instructed to study these developments carefully. The Republic must find room for criticism that strengthens national reconstruction while avoiding the factionalism and paralysis that colonial powers would eagerly encourage. The question is not whether ideas matter, but how a revolutionary state can cultivate them without losing its purpose."
SWF_VIN.6.a: "Learn from every experiment, but follow our own path."

SWF_VIN.7.t: "Lay Dan Lam Goc"
SWF_VIN.7.d: "The Government has reaffirmed a simple principle: the people must remain the root of the revolution. Officials are being reminded that authority is not an end in itself, and that policies which ignore the conditions of workers, peasants, veterans, and families will weaken the very cause they are meant to serve.\n\nCadres across the Republic are instructed to listen more closely to local concerns, to correct abuses before they harden into resentment, and to ensure that wartime burdens are shared as fairly as possible. The struggle for national liberation cannot survive as an affair conducted above the heads of the people."
SWF_VIN.7.a: "The people are the foundation of the Republic."

SWF_VIN.8.t: "A National Solidarity Bloc"
SWF_VIN.8.d: "The war has brought together forces that do not agree on every question of ideology, religion, or social policy, but do share an interest in Vietnamese independence. The Government now seeks to organize these currents into a broader National Solidarity Bloc, linking revolutionary cadres with patriotic intellectuals, local leaders, religious communities, and non-communist nationalists.\n\nSuch a coalition will inevitably be difficult to manage. Yet its advocates argue that the Republic cannot afford to narrow the national struggle at the very moment it needs the widest possible base of support. The task ahead is to build unity without surrendering the revolution's direction."
SWF_VIN.8.a: "Independence requires the widest possible unity."

SWF_VIN.9.t: "Ngo Dinh Diem's Manifesto"
SWF_VIN.9.d: "A manifesto associated with Ngo Dinh Diem has intensified debate inside the emerging national coalition. Its language of moral renewal, national independence, and public responsibility appeals to many Vietnamese who distrust both colonial rule and rigid ideological politics. Others see in it the potential foundation of a rival political movement, especially among Catholic and conservative circles.\n\nThe Government must decide how to receive such currents. They may broaden the front against foreign domination, but they also carry their own ambitions and suspicions. The Republic will have to demonstrate that national unity can accommodate disagreement without allowing the struggle for independence to be captured by any single faction."
SWF_VIN.9.a: "Let the debate serve the nation, not divide it."

SWF_VIN.10.t: "The Viet Minh and Lien Viet Unite"
SWF_VIN.10.d: "The Viet Minh and Lien Viet organizations have been merged into a single national front. The new structure is intended to bring revolutionary cadres, patriotic parties, religious organizations, intellectuals, and local associations into a common political framework while preserving the broad character of the independence movement.\n\nThe consolidation offers a clearer public face for the Republic and a stronger means of coordinating political work across the country. It also carries a warning: unity must be maintained through persuasion and participation, not merely announced from above. The Lien Viet Front will now be asked to demonstrate that the Vietnamese cause belongs to the entire nation."
SWF_VIN.10.a: "A united front for national liberation."

SWF_VIN.11.t: "The Reign of Stalin"
SWF_VIN.11.d: "The continued authority of Joseph Stalin in Moscow has shaped the calculations of every communist movement. For Vietnam, the Soviet model offers an example of rapid transformation, centralized discipline, and uncompromising resistance to imperial pressure. It also demands clear political choices at a time when the Republic is still consolidating its institutions.\n\nSupporters of closer alignment argue that Vietnam must bind itself to the strongest socialist power available. They believe that unity of doctrine and organization will protect the revolution in its most dangerous years. Critics worry that Vietnam's circumstances require a more independent balance between international solidarity and national realities."
SWF_VIN.11.a: "Stand firmly within the socialist camp."

SWF_VIN.12.t: "After Stalin"
SWF_VIN.12.d: "The death of Joseph Stalin has opened a period of uncertainty across the socialist world. Old assumptions are being questioned, new leaders are competing for influence, and communist parties everywhere must decide which elements of the Soviet experience to preserve and which to reconsider.\n\nFor Vietnam, the transition brings both danger and opportunity. A less certain Moscow may offer greater room for an independent national course, but it may also leave smaller revolutionary movements exposed to competing pressures. The Republic must honor international solidarity while ensuring that its own revolution is not reduced to an echo of disputes far beyond Indochina."
SWF_VIN.12.a: "Vietnam must chart its own course."

SWF_VIN.13.t: "Bamboo Diplomacy"
SWF_VIN.13.d: "Vietnam's position demands a diplomacy as resilient as bamboo: firm in its roots, flexible in the wind, and difficult to break. The Republic cannot afford isolation, yet neither can it safely become the instrument of a distant power. Its survival depends upon maintaining ties across ideological boundaries while refusing to compromise on independence.\n\nThis approach will require patience, careful language, and a willingness to negotiate without surrendering principle. Vietnam will seek friends where it can, avoid unnecessary conflicts, and preserve room to maneuver between larger states whose rivalries may otherwise decide the future of Indochina."
SWF_VIN.13.a: "Firm roots, flexible branches."

# ------------------------------------------------------------------
# Southern resistance and National Liberation Front
# ------------------------------------------------------------------

SWF_VIN.14.t: "The Nam Bo Resistance"
SWF_VIN.14.d: "The southern struggle cannot be treated as a secondary theater. In Nam Bo, the resistance confronts a fragmented political landscape of colonial authorities, local militias, sectarian forces, criminal organizations, and competing nationalist groups. The region's rivers, cities, and dense population make it both a vital prize and a uniquely difficult arena for revolutionary work.\n\nHanoi has therefore directed greater attention toward the south. Political organizers, military instructors, couriers, and supplies will be sent where possible, while local forces are encouraged to build a movement capable of surviving even when direct communication with the north is interrupted."
SWF_VIN.14.a: "The southern front must endure."

SWF_VIN.15.t: "Empower the Democratic Front"
SWF_VIN.15.d: "The struggle in the south cannot be carried by one party or one social group alone. A broader Democratic Front is being strengthened to unite anti-colonial activists, workers, students, religious communities, local militias, and patriotic organizations behind a common demand for Vietnamese self-determination.\n\nThe coalition will be imperfect and often contentious. Its members bring different traditions, interests, and visions for the country's future. Yet the Front's advocates argue that these differences are less important than the immediate necessity of resisting foreign domination. By giving southern forces a wider political banner, Hanoi hopes to turn scattered opposition into an organized national movement."
SWF_VIN.15.a: "Build the broadest possible southern coalition."

SWF_VIN.16.t: "After Nguyen Binh"
SWF_VIN.16.d: "The death of Nguyen Binh has left the southern resistance without one of its most capable and independent commanders. His networks united guerrilla units, urban organizers, sectarian contacts, and local armed groups under conditions of extraordinary pressure. Without him, the National Liberation Front must choose a leader who can hold these forces together while defining the political character of the struggle.\n\nThe choice is consequential. Le Duc Tho offers disciplined Party leadership and a closer connection to Hanoi. Tran Quoc Buu represents a more syndicalist and labor-oriented current. Kieu Cong Cung promises a radical southern path less easily contained by orthodox structures. The future of the Front now rests on this decision."
SWF_VIN.16.a: "Le Duc Tho will secure Party leadership."
SWF_VIN.16.b: "Tran Quoc Buu will rally the organized workers."
SWF_VIN.16.c: "Kieu Cong Cung will lead a radical southern front."

SWF_VIN.17.t: "The Southern Revisionist Question"
SWF_VIN.17.d: "The Party's Central Committee has begun reviewing the status of several prominent revolutionary figures in the South who continue to fight under the banner of national liberation but refuse to join the Party. Among the most notable are Brigadier Kieu Cong Cung, deputy to Lieutenant General Nguyen Binh and a representative of the National Assembly, and Tran Quoc Buu, a veteran trade union organizer and commander of the famed Dac Cong Unit 25. Both men have rendered distinguished service against French colonialism and the Bao-Dai regime, yet neither has accepted Party membership. Instead, they advocate various forms of syndicalism, Christian socialism, and revisionist Marxism, arguing that the revolution should remain a broad national movement rather than one led exclusively by Marxist-Leninists. This has ignited fierce debate within the Party. Lieutenant General Nguyen Binh argues that the Southern battlefield demands the broadest possible united front. In his view, every patriot willing to fight colonialism should be welcomed regardless of ideological differences, provided they remain loyal to the revolution. However, orthodox cadres led by Le Duc Tho warn that tolerating revisionist tendencies within the resistance risks undermining Party discipline and ideological unity. They argue that history has repeatedly shown opportunism and factionalism to be the greatest threats to a revolutionary movement from within. After careful deliberation, the Central Committee has reached its decision."
SWF_VIN.17.a: "Unity Against the Colonialists Must Come First."
SWF_VIN.17.b: "The small caterpillars pests needs to be removed from the big Tree."

SWF_VIN.150.t: "The Stalinist Opposition Emerges"
SWF_VIN.150.d: "Recent reports from the Public Security force (Cong An), reinforced by information from friendly intelligence services, have revealed the existence of a small but increasingly vocal faction within the revolutionary movement opposed to the political line of President Ho Chi Minh.\n\nCentered around Tran Ngoc Danh and La Vinh Loi, the group has accused the Party leadership of abandoning orthodox Marxism-Leninism in favor of what it describes as \"bourgeois nationalism.\" Between late 1949 and early 1950, Tran Ngoc Danh reportedly sent a series of letters to the Central Committee of the Communist Party of the Soviet Union criticizing Ho Chi Minh's leadership. He argued that the dissolution of the Indochinese Communist Party and the emphasis on a broad patriotic united front represented dangerous ideological deviations.\n\nThe faction further alleges that the Party has placed excessive emphasis on national unity rather than class struggle, and has accused Ho Chi Minh of cultivating a personal prestige incompatible with collective revolutionary leadership. Meanwhile, La Vinh Loi is reported to have traveled abroad without authorization in an effort to secure direct Soviet political, financial, and military support, while openly criticizing the Party's current line alongside Tran Ngoc Danh.\n\nThe Party leadership has rejected these accusations as dogmatism divorced from the realities of Vietnam's revolutionary struggle. President Ho Chi Minh and General Secretary Truong Chinh maintain that the immediate task remains national liberation through the Great National Unity Front, arguing that socialism can only be built after independence has been secured.\n\nFollowing an investigation by the Central Committee, both Tran Ngoc Danh and La Vinh Loi have been expelled from the Party for violating organizational discipline and conducting unauthorized political activity abroad."
SWF_VIN.150.a: "The national revolution to liberate all Vietnamese remains our highest priority."

SWF_VIN.151.t: "Death of Nhuong Tong"
SWF_VIN.151.d: "The Ministry of Public Security has confirmed the death of Nhuong Tong, General Secretary of the Viet Nam Quoc Dan Dang (VNQDD) and one of the last prominent leaders of the party's left-wing nationalist faction.\n\nA veteran revolutionary and intellectual, Nhuong Tong had long been active in the struggle against French colonial rule. Following the collapse of the Vietnam Nationalist Government in late 1946, he reorganized VNQDD activity in French-controlled areas around Hanoi. Although he later accepted an advisory position under Governor Nghiem Xuan Thien in support of the Bao-Dai Solution, he gradually withdrew from public life and returned to practicing traditional Chinese medicine.\n\nAccording to the Ministry of Public Security, newly uncovered intelligence revealed that Nhuong Tong had secretly attempted to coordinate a final nationwide uprising by remaining Viet Quoc paramilitary groups against the Democratic Republic of Vietnam. Acting on this information, Public Security officer Nguyen Van Viet arrested him on 8 September 1949 on the outskirts of Hanoi.\n\nFollowing several weeks of investigation, the Government announced that Nhuong Tong had died while in custody. Officials maintain that his death resulted from illness during detention. Supporters of the Viet Quoc, however, have accused the revolutionary authorities of eliminating one of the last influential nationalist leaders opposed to the Viet Minh."
SWF_VIN.151.a: "Checkmate."


# === Second Congress Event Chain (merged from SWF_VIN_second_congress_l_english.yml) ===
# ------------------------------------------------------------------
# Second Congress of the Indochinese Communist Party
# ------------------------------------------------------------------

SWF_VIN.50.t: "The Second Congress of the Indochinese Communist Party"
SWF_VIN.50.d: "The Second National Congress of the Indochinese Communist Party has convened in the liberated zone of Vinh Quang Commune, Chiem Hoa District, Tuyen Quang Province. It is the first Party Congress held since the August Revolution and the beginning of the nationwide resistance against French colonialism.\n\nSixteen years after the Party's first congress, the movement has been transformed beyond recognition. The Vietnamese people have passed from colonial subjects to citizens of their own republic, while revolutionary organizations in Laos and Cambodia continue to grow through their cooperation with the Viet Minh. One hundred and fifty-eight official delegates and fifty-three alternate delegates have gathered to represent more than seven hundred thousand Party members across Indochina. Fraternal delegations from the Communist Party of China and the Communist Party of Siam underline the Congress's growing international significance.\n\nThe delegates meet at a difficult moment. General Jean de Lattre de Tassigny has launched a new French strategy of fortified lines, mobile operations, and expanded foreign assistance. Yet the Congress has not assembled merely to recount hardship. It must decide the political character, international orientation, and future organization of the revolution that will outlast the war."
SWF_VIN.50.a: "Let the Congress begin."

SWF_VIN.51.t: "Vietnam's Place in the World Revolution"
SWF_VIN.51.d: "Among the questions before the Congress, none has produced more serious debate than the foreign policy of the Democratic Republic of Vietnam. The creation of the People's Republic of China has broken the colonial encirclement around the revolution, while the socialist camp has expanded across Eurasia. At the same time, the Cold War is hardening, and American money, arms, and advisers are increasingly sustaining France's war in Indochina.\n\nPresident Ho Chi Minh's mission to Moscow secured Soviet recognition, but material assistance remains limited. Soviet leaders are preoccupied with Europe and Korea, and many expect the new Chinese government to bear the principal responsibility for revolutionary affairs in East Asia. Some delegates therefore argue for unambiguous integration with the socialist camp. Others recall that American officers of the OSS Deer Team once cooperated with the Viet Minh and that several Western observers understood Ho Chi Minh first as a Vietnamese patriot. A third current argues that Vietnam must support the world revolution without becoming dependent upon any foreign capital.\n\nThe Congress must define the Republic's posture before the great powers define it for us."
SWF_VIN.51.a: "The world revolution advances through many roads."
SWF_VIN.51.b: "Keep the door open to American moderation."
SWF_VIN.51.c: "Vietnam belongs firmly in the socialist camp."

SWF_VIN.52.t: "The Fate of the Indochinese Union Project"
SWF_VIN.52.d: "For more than two decades, the Indochinese Communist Party has served as the common revolutionary vanguard of Vietnam, Laos, and Cambodia. Under its banner, patriots from all three nations fought colonial domination with the conviction that the liberation of one people could not be separated from the liberation of the others.\n\nWar and revolution, however, have changed the political landscape. Lao and Khmer cadres increasingly insist that national movements rooted in their own languages, histories, and social conditions must lead the struggle in their countries. Many Vietnamese delegates agree that the single Indochinese party has fulfilled its historic role and should give way to independent national organizations joined by friendship and common purpose.\n\nOthers warn that colonial policy deliberately fragmented Indochina in order to rule it. To dissolve the common revolutionary structure, they argue, would invite imperial powers to restore the divisions of the past. Their alternative is a future socialist federation: three peoples, but one political and economic destiny. The Congress must decide whether unity will be preserved through independent national movements or through a single Indochinese revolutionary project."
SWF_VIN.52.a: "Three Nations, One Friendship."
SWF_VIN.52.b: "One Revolution, One Indochina."

SWF_VIN.53.t: "The Nature of Vietnamese Marxism"
SWF_VIN.53.d: "The final and most consequential debate of the Congress concerns the character of Vietnamese Marxism itself. One current, associated with Tran Ngoc Danh and orthodox Marxist-Leninists, argues that Vietnam must follow the Soviet road with discipline: class struggle, centralized authority, and rapid preparation for a socialist transformation. In their view, departure from the established international line risks diluting the revolution until it becomes merely another nationalist movement.\n\nOpposing them are those who argue that Marxism must be translated into Vietnamese conditions rather than mechanically imported. President Ho Chi Minh and General Secretary Truong Chinh emphasize that the immediate contradiction remains colonial occupation. The revolution must therefore organize workers and peasants as its foundation while drawing intellectuals, small proprietors, religious patriots, and even sections of the national bourgeoisie into a Great National Unity Front.\n\nA third position seeks to reconcile national liberation with international revolution: Vietnam will remain Marxist and socialist, but its path will be guided by the specific demands of independence, reunification, gradual land reform, and the construction of a people's democratic state. The Congress must now choose its ideological settlement."
SWF_VIN.53.a: "Vietnam must forge its own revolutionary path."
SWF_VIN.53.b: "The Soviet road is the only correct road."
SWF_VIN.53.c: "National liberation and international revolution are inseparable."

SWF_VIN.54.t: "A Name for the Party"
SWF_VIN.54.d: "After two decades leading the revolutionary struggle beneath the banner of the Indochinese Communist Party, the Congress has agreed that the movement must now take a name suited to the realities of the Vietnamese national revolution. The decision is more than a matter of presentation. It will announce to the country - and to the world - what sort of organization claims the right to lead the struggle for independence.\n\nThe orthodox Marxist-Leninists urge the delegates to proclaim a Communist Party of Vietnam. In their view, a revolutionary vanguard should declare its ideological allegiance openly and bind Vietnam unmistakably to the international communist movement. Moderates instead propose a Vietnamese Socialist Party: a name they believe better expresses the immediate task of building a patriotic, democratic, and socially just nation while widening the Party's appeal among intellectuals, religious communities, and the national bourgeoisie.\n\nPresident Ho Chi Minh advances a third proposal. The Vietnam Labor Party would affirm the working people as the Party's foundation while avoiding needless barriers within the Great National Unity Front. It would speak not only to cadres and theoreticians, but to every worker, peasant, soldier, and patriot upon whom the survival of the Republic depends."
SWF_VIN.54.a: "The Vietnam Labor Party shall lead the nation."
SWF_VIN.54.b: "Let the Party bear the communist banner."
SWF_VIN.54.c: "A Socialist Party for a socialist nation."

SWF_VIN.55.t: "Strengthen the Party, Serve the People"
SWF_VIN.55.d: "With its major debates concluded, the Second Congress turns from declaration to organization. The delegates agree that the revolution cannot be sustained by battlefield victories alone. The Party must build disciplined organizations from the central leadership to every province, district, village, factory, military unit, and school. Workers, peasants, women, youth, intellectuals, veterans, and religious patriots are to be drawn into mass organizations capable of transforming popular sympathy into practical resistance and national reconstruction.\n\nThe Congress places special emphasis on cadre education, criticism and self-criticism, and the struggle against bureaucracy and corruption. Political instruction must be joined to practical competence; leadership must be earned through service; and every organization must remain connected to the people it claims to represent. As President Ho Chi Minh reminds the delegates, cadres are the root of all work.\n\nThe Congress therefore closes with a commitment to build a united, capable, and revolutionary Party equal to the burdens of independence, reunification, and socialist construction. The choices made here will shape Vietnam's political future long after the guns of the present war fall silent."
SWF_VIN.55.a: "Strengthen the Party, serve the people!"

