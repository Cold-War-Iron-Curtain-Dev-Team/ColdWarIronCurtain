### Viet Minh - South 1950's Events ###

### Country Events ###

## Political ##

# Binh-Cung Leadership Chain #
Binh_Cung_Leadership.1.t:0 "General Nguyen Binh's Sacrifice"
Binh_Cung_Leadership.1.d:0 "On September 29, 1951, at the personal request of the Central Government, Comrade Binh left our safe zones to take on a new dangerous mission. Despite our previous scouting and a detachment of elite bodyguards, we have received the sad news, during an ambush in Sre Doc commune, Se San district, Stung Treng province, Cambodge, an elite French colonial force gunned down the General who fought bravely and managed to inflict heavy causalities in the enemies's sides. The commander of the protection force at that time was battalion-level officer Nguyen Van Si who had telegraphed our HighComm to confirm General Binh's sacrifice."
Binh_Cung_Leadership.1.a:0 "General Binh is always in our hearts, his soul shall fight on!"

Binh_Cung_Leadership.2.t:0 "Brigadier Nguyen Binh's Death"
Binh_Cung_Leadership.2.d:0 "On September 29, 1951, after years of tracking, our intelligence and the Khmer scouts were able to track down and confirm the identity of famed Southern Vietminh's Commander-in-chief: Brigadier Nguyen-Binh. Despite our well-prepared and executed plan and exploited the element of surprise, we suffered some casualties but were able to hunt the Southern Vietminh's leader down in Sre Doc commune, Se San district, Stung Treng province, Cambodge with some captured Vietminh soldiers have confirmed that the cadaver is the famed Brigadier himself and was reverified by our photos and intel dossiers…"
Binh_Cung_Leadership.2.a:0 "A brave man is gone! But this is a great blow to the Vietminh's Esprit de Corps!"

Binh_Cung_Leadership.3.t:0 "General Nguyen Binh's Daring Escape"
Binh_Cung_Leadership.3.d:0 "On September 29, 1951, at the personal request of the Central Government, Comrade Binh left our safe zones to take on a new dangerous mission. With the help of our Khmer allies and a detachment of elite bodyguards, we were able to push back a French ambush in Sre Doc commune, Se San district, Stung Treng province, Cambodge, while the elite French colonial forces managed to inflict heavy causalities in our sides but the General able to escape albeit wounded. The commander of the protection force at that time was battalion-level officer Nguyen Van Si who had telegraphed our HighComm to confirm General Binh's daring escape!"
Binh_Cung_Leadership.3.a:0 "Lady Luck smiles again!"

Binh_Cung_Leadership.4.t:0 "Nguyen Binh's Escapes Again"
Binh_Cung_Leadership.4.d:0 "On September 29, 1951, despite years of tracking and wasting countless francs, our intelligence and the Khmer scouts were able to track down and lose the trails of famed Southern Vietminh's Commander-in-chief: Brigadier Nguyen-Binh. Despite our well-prepared and executed plan and exploited the element of surprise, we suffered light casualties but were not able to hunt the Southern Vietminh's leader down in Sre Doc commune, Se San district, Stung Treng province, Cambodge. While we have captured some Vietminh soldiers and officers but the main target: the trickster escaped … yet again!"
Binh_Cung_Leadership.4.a:0 "We'll get him next time..."

Binh_Cung_Leadership.5.d:0 "According to the Xac-te, Kieu-Cong-Cung was a Vietminh Brigadier, who was engaged in the communist resistance against French rule in Vietnam, while he was adhering to Marxist principles of class struggle and anti-imperialism. However, following the death of Brigadier Nguyen-Binh after our successful raid, Cung's influence waned. His promotion of a more moderate Nationalistic take on Marxism, which emphasized individual empowerment and economic development within a capitalist framework, diverged from the Vietminh's Marxist ideology. This ideological shift, coupled with internal Viet-minh’s internal power struggles and external pressures from Moscow, led to his purge from the Viet Minh. The Xac-te has received news that Cung has succeeded in defecting to the PRC ( if ROC won in the mainland then: Cung has escaped to the Southern provinces ) and confirmed that Cung has tried to unsuccessfully contact our government and he has since urged us to accept him in to struggle against Viet-minh’s madness and failure in preserving the Vietnamese culture."
Binh_Cung_Leadership.6.d:0 "According to our Military intelligence, Kieu Cong Cung, a former Vietminh Brigadier, had initially engaged in the resistance against French colonial rule in Vietnam, following the Marxist principles of class struggle and anti-imperialism. However, after the demise of Brigadier Nguyen Binh under the French’s barbaric raid, Cung's commitment wavered. He began promoting a reactionary form of nationalism, emphasizing individual empowerment and economic development within a capitalist framework, which starkly opposed the Vietminh's Marxist ideology.\n\nThis ideological deviation, combined with internal power struggles and external pressures from Moscow, led to Cung's necessary expulsion from the Vietminh. Recent reports indicate that Cung has defected to the PRC (or the Southern provinces if the ROC won on the mainland) and has attempted to contact reactionary elements, including our enemies, pleading for asylum."
Binh_Cung_Leadership.7.d:0 "In a dramatic turn of events, former Brigadier Kieu-Cong-Cung and his Syndicalist comrades have ignited a civil war within the Southern Viet-minh, challenging the dominant Stalinist factions. Cung, previously expelled from the Vietminh for promoting a more moderate, nationalistic take on Marxism, has rallied significant support among those disillusioned with the Stalinist leadership. Fierce clashes have been reported as Cung's Syndicalists push to reclaim influence and promote their vision of economic development and individual empowerment within a socialist framework. The internal conflict threatens to destabilize the region further as the ongoing war against France still wages on, as both factions vie for control over the revolutionary movement in South Vietnam."
Binh_Cung_Leadership.8.d:0 "According to our Military intelligence, Tran Quoc Buu, a former Vietminh Commander, had initially engaged in the resistance against French colonial rule in Vietnam and led the famed 25th Dac Cong commando, subscribed to the Sorelian Syndicalist principles of industrial struggle and anti-imperialism. However, after the demise of Brigadier Nguyen Binh under the French’s barbaric raid, Buu’s commitment wavered. He began promoting a reactionary form of Syndicalism, emphasizing syndical empowerment and economic development within a multi-party framework, which starkly opposed the Vietminh's Marxist ideology.\n\nThis ideological deviation, combined with internal power struggles and external pressures from Moscow, led to Buu’s necessary expulsion from the Vietminh. Recent reports indicate that Buu has defected to Paris via a flight organized by French Syndicalist Unions and he has attempted to contact reactionary elements, including our enemies, pleading for asylum."
Binh_Cung_Leadership.9.d:0 "Paris, 1952 – Tran Quoc Buu, a former Vietminh commander and leader of the famed 25th Dac Cong commando, has been spotted in Paris, having defected from North Vietnam following ideological conflicts within the Vietminh last year. Known for his initial commitment to the resistance against French colonial rule and adherence to Sorelian Syndicalist principles, Buu's ideological deviation and promotion of a nationalistic form of Revolutionary Syndicalism led to his expulsion.\n\nJournalists confirmed that Buu has sought asylum in France, facilitated by French Syndicalist Unions. He has been seen attending revolutionary syndicalist classes at the General Confederation of French Workers (CFTC) on Montholon Street."
#End 

#VIN News Event
VIN_SOV.0.t: "[GetNewspaperHeader]The Soviet Union recognized the Democratic Republic of Vietnam"
VIN_SOV.0.d: "The initial presence of Vietnamese individuals in the USSR dates back to the early 1920s. These individuals were primarily students attending Comintern universities, particularly the Communist University of the Toilers of the East. Around 70 Vietnamese students engaged in this esteemed program of communist education in Soviet Russia. Notably, Ho Chi Minh was among those who pursued studies in Moscow during this period, alongside other distinguished members of the Indochinese Communist Party. \nOn January 30th, 1950, the Soviet Union, together with its satellite states in Eastern Europe and the newly established People's Republic of China, became the first to extend diplomatic recognition to the Democratic Republic of Vietnam during the First Indochina War."
VIN_SOV.0.a: "Long live the brotherhood!"

VIN_PRC.0.t: "[GetNewspaperHeader]The People's Republic of China recognized the Democratic Republic of Vietnam"
VIN_PRC.0.d: "On January 18, 1950, the People's Republic of China formally recognized the Democratic Republic of Vietnam. This significant diplomatic gesture marked a crucial step in the context of the First Indochina War, reinforcing the bonds between the two nations and highlighting their shared ideological commitments. \nThis recognition granted the Viet Minh essential political legitimacy and, importantly, facilitated crucial military and material aid from its powerful northern neighbor, as well as from the Soviet Union."
VIN_PRC.0.a: "Long live the brotherhood!"

VIN_Napalm.0.t: "[GetNewspaperHeader]The French Army used napalm for the first time!"
VIN_Napalm.0.d: "After suffering multiple defeats against the Vietminh forces, the French Army is now equipped with American-made weapons and has begun using napalm for the first time during the First Indochina War in Tien Yen, Quang Ninh Province. \nBut still, they couldn't stop the Vietminh forces from the will of liberation. \nThis action significantly affected the civilian population, leading to numerous casualties and extensive destruction of villages and farmland. We must stop them at all costs."
VIN_Napalm.0.a: "The French are depressed now, aren't they?"

VIN_Secret_Army.0.t: "[GetNewspaperHeader]Pol Pot established the Kampuchean Revolutionary Army"
VIN_Secret_Army.0.d: "According to the intelligence we have gathered, the Kampuchean Revolutionary Army (KRA) originated from the peasant uprising that took place in the Samlout District of Battambang province in 1967. Currently, we lack detailed information about this force, but it is known that they received training and supplies from China. Should we be concerned about this?"
VIN_Secret_Army.0.a: "Are they gonna fight for themselves?"

VIN_Liberation.0.t: "[GetNewspaperHeader]Liberation of Phuoc Long"
VIN_Liberation.0.d: "The victory at Phuoc Long, known as Operation Route 14-Phuoc Long, stands as a significant milestone in the struggle against American aggression and the quest for national salvation. This achievement resulted from the heroic sacrifices made by the Liberation Army of South Vietnam (LASV), the PAVN, and our people, particularly those in Phuoc Long province. The support from rubber workers and ethnic minority communities was vital to securing this victory. \nThis victory not only delivered a significant setback to the ARVN and South Vietnamese government but also marked the beginning of a new phase on the battlefield. The strategic corridor was expanded, linking our bases and creating favorable conditions for the General Offensive and Uprising in the Spring of 1975. \nThe significant amount of ammunition, weapons, and vehicles captured at Phuoc Long province greatly strengthened the firepower of our soldiers, helped shorten the war, and contributed decisively to the overall victory. The triumph at Phuoc Long province stands as a powerful testament to our nation's unwavering determination to liberate the South and unify the country."
VIN_Liberation.0.a: "Xung phong!"

VIN_Battle.0.t: "[GetNewspaperHeader]Victory at the Battle of Ia Drang"
VIN_Battle.0.d: "The Battle of Ia Drang, which took place in November 1965 in the Central Highlands, was one of the first and fiercest battles between the South Vietnamese People's Liberation Armed Forces and the US military. With unwavering determination and extraordinary bravery, Vietnamese soldiers caught the enemy off guard with the tactic of 'grappling with the Americans and striking'. By closing in on the enemy, our troops neutralized the enemy's overwhelming firepower, inflicting heavy losses on the US forces. \nDespite suffering casualties, our troops achieved a significant victory, dealing a heavy blow to the US military's morale. The battle also demonstrated the remarkable military maturity of our armed forces, particularly in countering the US's helicopter assault tactics. The image of Vietnamese soldiers with rudimentary weapons but unwavering steel spirit symbolizes the nation's determination to win."
VIN_Battle.0.a: "We now understand how Americans fight"

VIN_LAO.0.t: "Pathet Lao recognized the Democratic Republic of Vietnam"
VIN_LAO.0.d: "Before the French returned to Indochina in 1946, Laos briefly achieved independence. However, due to pressure from French colonial forces, the country fell back under their control. The Lao Issara resistance movement, led by Prince Souphanouvong, became a significant turning point in the struggle for national independence. \nWith support from the Democratic Republic of Vietnam, the Pathet Lao, which succeeded Lao Issara, achieved significant victories that forced France to sign the Geneva Accords in 1954. However, the peace that followed was short-lived, as the United States increased its intervention in Laos, ultimately leading to a protracted civil war. \nUnder the leadership of the Lao People's Revolutionary Party, the Neo Lao Haksat emerged as a significant political force that represented the people's hopes and aspirations. The Lao people's struggle for independence and democracy faced numerous challenges, ultimately leading to a remarkable victory."
VIN_LAO.0.a: "Long live the brotherhood!"

VIN_INO.0.t: "Indonesia recognized the Democratic Republic of Vietnam"
VIN_INO.0.d: "The relationship between Vietnam and Indonesia has a long history that dates back to the feudal period. Ancient kingdoms, such as Champa and those in the Tam Phat Te region (now part of Indonesia), interacted early with Vietnamese kingdoms. Historical records mention that a Tra Oa envoy visited Vietnam during the Tran Dynasty, highlighting the diplomatic relations between the two nations. Furthermore, the Champa kingdom maintained close ties with small states in Indonesia, particularly in the realm of Buddhist culture. \nThe Vietnam-Indonesia relationship has seen many fluctuations throughout history, including periods of trade cooperation, cultural exchanges, and conflicts. In recent times, the bilateral relationship has become significantly stronger. Cao Ba Quat, a Vietnamese scholar, was once sent as an envoy to Indonesia, where he provided vivid descriptions of the country and its people. \nAfter gaining independence, the two countries officially established diplomatic relations on December 30, 1955, marking a new chapter in the cooperation between the two nations."
VIN_INO.0.a: "Long live the brotherhood!"

VIN_KPA.0.t: "DPRK recognized the Democratic Republic of Vietnam"
VIN_KPA.0.d: "On January 31, 1950, the Democratic People's Republic of Korea took a significant step by officially recognizing and establishing diplomatic relations with the Democratic Republic of Vietnam. This development marked North Korea as the third nation, subsequent to the Soviet Union and China, to extend formal recognition and foster diplomatic ties with Vietnam. \nThe relationship between Vietnam and North Korea represents a distinguished narrative of solidarity between two socialist nations. Since its inception in 1950, this partnership has navigated numerous historical challenges while preserving its unique identity. There exists considerable potential for further development, alongside a variety of challenges that need to be addressed. Yet, through mutual cooperation and a commitment to solidarity, both countries have the opportunity to overcome these obstacles and collaboratively foster a prosperous future."
VIN_KPA.0.a: "Long live the brotherhood!"