l_english:
### Viet Minh - South 1950's Events ###

### Country Events ###

## Political ##

# Binh-Cung Leadership Chain #
Binh_Cung_Leadership.1.t: "General Nguyen Binh's Sacrifice"
Binh_Cung_Leadership.1.d: "On September 29, 1951, at the personal request of the Central Government, Comrade Binh left our safe zones to take on a new dangerous mission. Despite our previous scouting and a detachment of elite bodyguards, we have received the sad news, during an ambush in Sre Doc commune, Se San district, Stung Treng province, Cambodge, an elite French colonial force gunned down the General who fought bravely and managed to inflict heavy causalities in the enemies's sides. The commander of the protection force at that time was battalion-level officer Nguyen Van Si who had telegraphed our HighComm to confirm General Binh's sacrifice."
Binh_Cung_Leadership.1.a: "General Binh is always in our hearts, his soul shall fight on!"

Binh_Cung_Leadership.2.t: "Brigadier Nguyen Binh's Death"
Binh_Cung_Leadership.2.d: "On September 29, 1951, after years of tracking, our intelligence and the Khmer scouts were able to track down and confirm the identity of famed Southern Vietminh's Commander-in-chief: Brigadier Nguyen-Binh. Despite our well-prepared and executed plan and exploited the element of surprise, we suffered some casualties but were able to hunt the Southern Vietminh's leader down in Sre Doc commune, Se San district, Stung Treng province, Cambodge with some captured Vietminh soldiers have confirmed that the cadaver is the famed Brigadier himself and was reverified by our photos and intel dossiers..."
Binh_Cung_Leadership.2.a: "A brave man is gone! But this is a great blow to the Vietminh's Esprit de Corps!"

Binh_Cung_Leadership.3.t: "General Nguyen Binh's Daring Escape"
Binh_Cung_Leadership.3.d: "On September 29, 1951, at the personal request of the Central Government, Comrade Binh left our safe zones to take on a new dangerous mission. With the help of our Khmer allies and a detachment of elite bodyguards, we were able to push back a French ambush in Sre Doc commune, Se San district, Stung Treng province, Cambodge, while the elite French colonial forces managed to inflict heavy causalities in our sides but the General able to escape albeit wounded. The commander of the protection force at that time was battalion-level officer Nguyen Van Si who had telegraphed our HighComm to confirm General Binh's daring escape!"
Binh_Cung_Leadership.3.a: "Lady Luck smiles again!"

Binh_Cung_Leadership.4.t: "Nguyen Binh's Escapes Again"
Binh_Cung_Leadership.4.d: "On September 29, 1951, despite years of tracking and wasting countless francs, our intelligence and the Khmer scouts were able to track down and lose the trails of famed Southern Vietminh's Commander-in-chief: Brigadier Nguyen-Binh. Despite our well-prepared and executed plan and exploited the element of surprise, we suffered light casualties but were not able to hunt the Southern Vietminh's leader down in Sre Doc commune, Se San district, Stung Treng province, Cambodge. While we have captured some Vietminh soldiers and officers but the main target: the trickster escaped... yet again!"
Binh_Cung_Leadership.4.a: "We'll get him next time..."

Binh_Cung_Leadership.5.d: "According to the Xac-te, Kieu-Cong-Cung was a Vietminh Brigadier, who was engaged in the communist resistance against French rule in Vietnam, while he was adhering to Marxist principles of class struggle and anti-imperialism. However, following the death of Brigadier Nguyen-Binh after our successful raid, Cung's influence waned. His promotion of a more moderate Nationalistic take on Marxism, which emphasized individual empowerment and economic development within a capitalist framework, diverged from the Vietminh's Marxist ideology. This ideological shift, coupled with internal Viet-minh's internal power struggles and external pressures from Moscow, led to his purge from the Viet Minh. The Xac-te has received news that Cung has succeeded in defecting to the PRC ( if ROC won in the mainland then: Cung has escaped to the Southern provinces ) and confirmed that Cung has tried to unsuccessfully contact our government and he has since urged us to accept him in to struggle against Viet-minh's madness and failure in preserving the Vietnamese culture."
Binh_Cung_Leadership.6.d: "According to our Military intelligence, Kieu Cong Cung, a former Vietminh Brigadier, had initially engaged in the resistance against French colonial rule in Vietnam, following the Marxist principles of class struggle and anti-imperialism. However, after the demise of Brigadier Nguyen Binh under the French's barbaric raid, Cung's commitment wavered. He began promoting a reactionary form of nationalism, emphasizing individual empowerment and economic development within a capitalist framework, which starkly opposed the Vietminh's Marxist ideology.\n\nThis ideological deviation, combined with internal power struggles and external pressures from Moscow, led to Cung's necessary expulsion from the Vietminh. Recent reports indicate that Cung has defected to the PRC (or the Southern provinces if the ROC won on the mainland) and has attempted to contact reactionary elements, including our enemies, pleading for asylum."
Binh_Cung_Leadership.7.d: "In a dramatic turn of events, former Brigadier Kieu-Cong-Cung and his Syndicalist comrades have ignited a civil war within the Southern Viet-minh, challenging the dominant Stalinist factions. Cung, previously expelled from the Vietminh for promoting a more moderate, nationalistic take on Marxism, has rallied significant support among those disillusioned with the Stalinist leadership. Fierce clashes have been reported as Cung's Syndicalists push to reclaim influence and promote their vision of economic development and individual empowerment within a socialist framework. The internal conflict threatens to destabilize the region further as the ongoing war against France still wages on, as both factions vie for control over the revolutionary movement in South Vietnam."
Binh_Cung_Leadership.8.d: "According to our Military intelligence, Tran Quoc Buu, a former Vietminh Commander, had initially engaged in the resistance against French colonial rule in Vietnam and led the famed 25th Dac Cong commando, subscribed to the Sorelian Syndicalist principles of industrial struggle and anti-imperialism. However, after the demise of Brigadier Nguyen Binh under the French's barbaric raid, Buu's commitment wavered. He began promoting a reactionary form of Syndicalism, emphasizing syndical empowerment and economic development within a multi-party framework, which starkly opposed the Vietminh's Marxist ideology.\n\nThis ideological deviation, combined with internal power struggles and external pressures from Moscow, led to Buu's necessary expulsion from the Vietminh. Recent reports indicate that Buu has defected to Paris via a flight organized by French Syndicalist Unions and he has attempted to contact reactionary elements, including our enemies, pleading for asylum."
Binh_Cung_Leadership.9.d: "Paris, 1952 - Tran Quoc Buu, a former Vietminh commander and leader of the famed 25th Dac Cong commando, has been spotted in Paris, having defected from North Vietnam following ideological conflicts within the Vietminh last year. Known for his initial commitment to the resistance against French colonial rule and adherence to Sorelian Syndicalist principles, Buu's ideological deviation and promotion of a nationalistic form of Revolutionary Syndicalism led to his expulsion.\n\nJournalists confirmed that Buu has sought asylum in France, facilitated by French Syndicalist Unions. He has been seen attending revolutionary syndicalist classes at the General Confederation of French Workers (CFTC) on Montholon Street."
#End

#VIN News Event
VIN_SOV.0.t: "[GetNewspaperHeader]The Soviet Union recognized the Democratic Republic of Vietnam"
VIN_SOV.0.d: "The initial presence of Vietnamese individuals in the USSR dates back to the early 1920s. These individuals were primarily students attending Comintern universities, particularly the Communist University of the Toilers of the East. Around 70 Vietnamese students engaged in this esteemed program of communist education in Soviet Russia. Notably, Ho Chi Minh was among those who pursued studies in Moscow during this period, alongside other distinguished members of the Indochinese Communist Party. \nOn January 30th, 1950, the Soviet Union, together with its satellite states in Eastern Europe and the newly established People's Republic of China, became the first to extend diplomatic recognition to the Democratic Republic of Vietnam during the First Indochina War."
VIN_SOV.0.a: "Long live the brotherhood!"

VIN_PRC.0.t: "[GetNewspaperHeader]The People's Republic of China recognized the Democratic Republic of Vietnam"
VIN_PRC.0.d: "On January 18, 1950, the People's Republic of China formally recognized the Democratic Republic of Vietnam. This significant diplomatic gesture marked a crucial step in the context of the First Indochina War, reinforcing the bonds between the two nations and highlighting their shared ideological commitments. \nThis recognition granted the Viet Minh essential political legitimacy and, importantly, facilitated crucial military and material aid from its powerful northern neighbor, as well as from the Soviet Union."
VIN_PRC.0.a: "Long live the brotherhood!"

VIN_Napalm.0.t: "[GetNewspaperHeader]The French Army used napalm for the first time!"
VIN_Napalm.0.d: "After suffering multiple defeats against the Vietminh forces, the French Army is now equipped with American-made weapons and has begun using napalm for the first time during the First Indochina War in Tien Yen, Quang Ninh Province. \nBut still, they couldn't stop the Vietminh forces from the will of liberation. \nThis action significantly affected the civilian population, leading to numerous casualties and extensive destruction of villages and farmland. We must stop them at all costs."
VIN_Napalm.0.a: "The French are depressed now, aren't they?"

VIN_Secret_Army.0.t: "[GetNewspaperHeader]Pol Pot established the Kampuchean Revolutionary Army"
VIN_Secret_Army.0.d: "According to the intelligence we have gathered, the Kampuchean Revolutionary Army (KRA) originated from the peasant uprising that took place in the Samlout District of Battambang province in 1967. Currently, we lack detailed information about this force, but it is known that they received training and supplies from China. Should we be concerned about this?"
VIN_Secret_Army.0.a: "Are they gonna fight for themselves?"

VIN_Liberation.0.t: "[GetNewspaperHeader]Liberation of Phuoc Long"
VIN_Liberation.0.d: "The victory at Phuoc Long, known as Operation Route 14-Phuoc Long, stands as a significant milestone in the struggle against American aggression and the quest for national salvation. This achievement resulted from the heroic sacrifices made by the Liberation Army of South Vietnam (LASV), the PAVN, and our people, particularly those in Phuoc Long province. The support from rubber workers and ethnic minority communities was vital to securing this victory. \nThis victory not only delivered a significant setback to the ARVN and South Vietnamese government but also marked the beginning of a new phase on the battlefield. The strategic corridor was expanded, linking our bases and creating favorable conditions for the General Offensive and Uprising in the Spring of 1975. \nThe significant amount of ammunition, weapons, and vehicles captured at Phuoc Long province greatly strengthened the firepower of our soldiers, helped shorten the war, and contributed decisively to the overall victory. The triumph at Phuoc Long province stands as a powerful testament to our nation's unwavering determination to liberate the South and unify the country."
VIN_Liberation.0.a: "Xung phong!"

VIN_Battle.0.t: "[GetNewspaperHeader]Victory at the Battle of Ia Drang"
VIN_Battle.0.d: "The Battle of Ia Drang, which took place in November 1965 in the Central Highlands, was one of the first and fiercest battles between the South Vietnamese People's Liberation Armed Forces and the US military. With unwavering determination and extraordinary bravery, Vietnamese soldiers caught the enemy off guard with the tactic of 'grappling with the Americans and striking'. By closing in on the enemy, our troops neutralized the enemy's overwhelming firepower, inflicting heavy losses on the US forces. \nDespite suffering casualties, our troops achieved a significant victory, dealing a heavy blow to the US military's morale. The battle also demonstrated the remarkable military maturity of our armed forces, particularly in countering the US's helicopter assault tactics. The image of Vietnamese soldiers with rudimentary weapons but unwavering steel spirit symbolizes the nation's determination to win."
VIN_Battle.0.a: "We now understand how Americans fight"

VIN_LAO.0.t: "Pathet Lao recognized the Democratic Republic of Vietnam"
VIN_LAO.0.d: "Before the French returned to Indochina in 1946, Laos briefly achieved independence. However, due to pressure from French colonial forces, the country fell back under their control. The Lao Issara resistance movement, led by Prince Souphanouvong, became a significant turning point in the struggle for national independence. \nWith support from the Democratic Republic of Vietnam, the Pathet Lao, which succeeded Lao Issara, achieved significant victories that forced France to sign the Geneva Accords in 1954. However, the peace that followed was short-lived, as the United States increased its intervention in Laos, ultimately leading to a protracted civil war. \nUnder the leadership of the Lao People's Revolutionary Party, the Neo Lao Haksat emerged as a significant political force that represented the people's hopes and aspirations. The Lao people's struggle for independence and democracy faced numerous challenges, ultimately leading to a remarkable victory."
VIN_LAO.0.a: "Long live the brotherhood!"

VIN_INO.0.t: "Indonesia recognized the Democratic Republic of Vietnam"
VIN_INO.0.d: "The relationship between Vietnam and Indonesia has a long history that dates back to the feudal period. Ancient kingdoms, such as Champa and those in the Tam Phat Te region (now part of Indonesia), interacted early with Vietnamese kingdoms. Historical records mention that a Tra Oa envoy visited Vietnam during the Tran Dynasty, highlighting the diplomatic relations between the two nations. Furthermore, the Champa kingdom maintained close ties with small states in Indonesia, particularly in the realm of Buddhist culture. \nThe Vietnam-Indonesia relationship has seen many fluctuations throughout history, including periods of trade cooperation, cultural exchanges, and conflicts. In recent times, the bilateral relationship has become significantly stronger. Cao Ba Quat, a Vietnamese scholar, was once sent as an envoy to Indonesia, where he provided vivid descriptions of the country and its people. \nAfter gaining independence, the two countries officially established diplomatic relations on December 30, 1955, marking a new chapter in the cooperation between the two nations."
VIN_INO.0.a: "Long live the brotherhood!"

VIN_KPA.0.t: "DPRK recognized the Democratic Republic of Vietnam"
VIN_KPA.0.d: "On January 31, 1950, the Democratic People's Republic of Korea took a significant step by officially recognizing and establishing diplomatic relations with the Democratic Republic of Vietnam. This development marked North Korea as the third nation, subsequent to the Soviet Union and China, to extend formal recognition and foster diplomatic ties with Vietnam. \nThe relationship between Vietnam and North Korea represents a distinguished narrative of solidarity between two socialist nations. Since its inception in 1950, this partnership has navigated numerous historical challenges while preserving its unique identity. There exists considerable potential for further development, alongside a variety of challenges that need to be addressed. Yet, through mutual cooperation and a commitment to solidarity, both countries have the opportunity to overcome these obstacles and collaboratively foster a prosperous future."
VIN_KPA.0.a: "Long live the brotherhood!"

VIN_Intro.1.t: "The National Popular Union of Vietnam: A Triumph of Revolutionary"
VIN_Intro.1.d: "In a historic moment for the revolution, the Hoi Lien hiep Quoc dan Viet Nam proudly announced the consolidation and expansion of the National Popular Union of Vietnam, marking a major achievement in securing political stability and ensuring mass adoption of Marxist thought across all progressive political entities in the North. Under the wise leadership of President Ho Chi Minh, the unity of the people has been further strengthened, ensuring that the Democratic Republic of Vietnam remains a government of the people, by the people, and for the people. \nThe integration of all patriotic factions - from the Viet Minh, the Democratic Party, the Socialist Party, and the National Labor Federation - into the National Popular Union has allowed the revolutionary government to mobilize every worker, farmer, intellectual, and soldier under a common banner. With this unprecedented mass organization, the ideals of Marxism-Leninism, national liberation, and socialist construction are now embedded in the very fabric of governance. The establishment of this Union ensures that no force, be it internal reactionaries or foreign imperialists, can divide the revolutionary will of the Vietnamese people. \nFrom the great cities of Ha Noi and Hai Phong to the vast countryside of the Red River Delta, the revolutionary administration has successfully implemented education campaigns, economic collectivization, and military mobilization, securing the people's unwavering loyalty to the cause of national liberation and socialist transformation. The rapid expansion of Marxist organizations has solidified the ideological foundation of the state, making clear that socialism is not only the path to victory but the key to ensuring a just and prosperous future for all Vietnamese."
VIN_Intro.1.a: "A defining victory of the revolution!"

VIN_Intro.2.t: "The Indochinese Association for the Research of Marxism: Spreading Revolutionary Thought"
VIN_Intro.2.d: "In the face of mounting threats from reactionary forces and imperialist aggression, the Indochinese Communist Party (Dang Cong san Dong Duong) made the tactical decision to officially \"dissolve\" itself in 1945. In reality, the Party retreated into secrecy, allowing it to continue its revolutionary activities while evading suppression. To maintain its ideological and organizational influence, the Party established the Indochinese Association for the Research of Marxism, an entity tasked with publicly disseminating Marxist-Leninist principles under the guise of academic and intellectual study. \nBy 1949, the Association had become a powerful tool for the revolution, embedding Marxist ideology within all major political entities aligned with Lien Viet, the Viet Minh, and military structures fighting against French colonialism. Through newspapers such as Su That, the Association continued the mission of the former Co Giai Phong, spreading revolutionary theory while avoiding direct association with the clandestine Communist Party. \nThe association functioned as a bridge between the Party and broader progressive political forces, ensuring that Marxism was not just the ideology of an underground movement but a growing intellectual and political force embraced by workers, peasants, students, and nationalists alike. Embedded within government institutions, military commands, and mass organizations, Party cells worked from within to guide, educate, and radicalize cadres while maintaining a facade of ideological openness. \nThe establishment of the Association for the Research of Marxism allowed the revolutionary forces to consolidate ideological control over the resistance, ensuring that the struggle for independence remained firmly grounded in scientific socialism. Through education, publications, and organizational influence."
VIN_Intro.2.a: "Marxism shall lead the mass to victory against imperialism and reactionary forces."

VIN_Econ.1.t: "The Rural Co-Op Movement: A Triumph of Collective Strength"
VIN_Econ.1.d: "In a monumental achievement for the revolution, the Ministry of Canh Nong proudly announced the success and expansion of the Hop Tac Xa (Rural Co-Op) movement, marking a historic step toward the collectivization of the nation. Following the visionary teachings of President Ho Chi Minh, inspired by his work Duong Kach Menh (The Revolutionary Road), the cooperative model has proven to be the foundation for a truly socialist agricultural economy - one where the fruits of the people's labor remain in their hands rather than being hoarded by landlords and exploitative merchants. \nThe first Hop Tac Xa was established in Thuy Tinh-Dan Chu in 1948, and within just a year, the movement has spread across liberated zones, transforming the economic landscape of Vietnam. By collectivizing agriculture, rural workers now share resources, labor, and land equitably, ensuring greater productivity, economic security, and solidarity among the people. This movement has empowered farmers, laborers, and the working class, placing them at the heart of the socialist struggle. No longer will they be at the mercy of feudal landowners or foreign profiteers - through the Hop Tac Xa system, they have seized control of their own destiny. \nThe Ministry of Canh Nong has declared this the first great victory in the economic revolution, setting the stage for further collectivization and modernization. With new irrigation projects, land reforms, and expanded cooperative farms, the people of Vietnam march forward toward complete agricultural self-sufficiency. This is only the beginning - as the revolution deepens, the collective strength of the people will build a prosperous socialist future. \nComrade Ho Chi Minh and the Ministry of Canh Nong celebrate this success as a decisive step toward total liberation."
VIN_Econ.1.a: "We will build a society free from oppression, poverty, and imperialist chains!"

VIN_Econ.2.t: "The Grand Plan for Agricultural Improvement - A Victory for the Revolution!"
VIN_Econ.2.d: "A new era of prosperity dawns upon the revolutionary heartland as the Ministry of Agriculture (Bo Canh Nong), the Viet Minh, and the Lien Viet front, under the visionary leadership of President Ho Chi Minh, unveil an ambitious Plan for Agricultural Improvement. This initiative marks a decisive step toward self-sufficiency, rural revitalization, and the empowerment of the peasantry, ensuring that the fruits of the land remain in the hands of those who cultivate it. \nThe Viet Bac Agricultural Plan, introduced in early 1949, aims to modernize traditional farming methods, increase yields, and improve irrigation infrastructure to fortify both food security and the war effort. Recognizing the strategic importance of agriculture, President Ho Chi Minh issued Decree No. 68/SL on June 18, 1949, officially launching a nationwide hydraulic engineering initiative to protect and expand irrigation networks, safeguarding farmland from floods and droughts. \nBy August 1949, the Viet Bac Agricultural Conference was convened, bringing together agrarian leaders, revolutionary cadres, and local farmers to assess progress and set new targets for agricultural development. In a powerful message to the conference, President Ho Chi Minh urged officials to remain close to the people, to learn from them, and to lead by example, ensuring that agricultural reform aligns with local realities. \nThe land reform process is still under it's infancy, solidifying the people's faith in the revolution. Landlords and feudal landowners, who once exploited the toil of the peasantry, are being dismantled and restructured, returning the land to the rightful hands of the farmers. The policies of the Ministry of Agriculture have already resulted in increased food production, supporting both the rural population and the brave revolutionary forces fighting for national liberation. \nWith unwavering determination, the agricultural revolution continues to strengthen the backbone of the resistance, proving that the power of the people, when united under the guidance of the Party and President Ho Chi Minh, is unstoppable. The success of this initiative is not just an economic victory - it is a symbol of Vietnam's path toward socialism and independence!"
VIN_Econ.2.a: "A well-fed people is a victorious people! Long live President Ho Chi Minh!"

VIN_Econ.3.t: "The Confederation of Vietnam Labour Union Fully Embraces the Revolutionary Path!"
VIN_Econ.3.d: "In a momentous victory for the working class and the revolutionary movement, the Confederation of Vietnam Labour Union (Tong Lien doan Lao dong Viet Nam) has officially aligned itself with the Hoi Lien hiep Quoc dan Viet Nam (Lien Viet), the Marxist Study Association of Indochina (Hoi Nghien Cuu Chu Nghia Marx O Dong Duong), and the great leadership of President Ho Chi Minh. This unification marks a historic achievement in the consolidation of the socialist labor movement, ensuring the workers of Vietnam stand firmly under the banner of Marxism-Leninism in the fight against colonial oppression and capitalist exploitation. \nUnder the leadership of Comrade Hoang Quoc Viet, the Confederation has mobilized workers in every industry - from industrial factories and mines to agricultural cooperatives - to accelerate the struggle for a socialist economy. The expansion of worker-led production, state-planned economic initiatives, and mass labor mobilization has already shown great success. Over 57 war production facilities have been established, ensuring our revolutionary soldiers are fully equipped for battle. \nThe principles of democratic labor management, mass political education, and workplace collectivization are now being implemented nationwide. The Thi dua san xuat, thi dua xay dung (Compete in Production, Compete in Building) and Cai tien ky thuat, phat huy sang kien, trau doi nghe nghiep (Technical Improvements, Innovation, and Skill Development) movements have gained immense traction, uniting workers under a single revolutionary cause. \nEven in the French-occupied territories, brave workers continue the struggle, carrying out economic sabotage, underground mobilization, and covert resistance against the colonialists. The courage of the working class ensures that no inch of Vietnam will remain in the hands of imperialists or their collaborators. \nWith this monumental unification, the Vietnamese proletariat stands stronger than ever, bound together in the cause of socialist construction and national liberation. The Confederation of Vietnam Labour Union has become the vanguard of the workers, ensuring that the revolution remains unshakable. With the guidance of President Ho Chi Minh and the unwavering support of Lien Viet, the labor movement will continue to build a socialist Vietnam free from imperialism, reaction, and exploitation!"
VIN_Econ.3.a: "The workers have risen! Long live the socialist labor movement!"

VIN_Econ.4.t: "Commemorating the Golden Week - A Testament to National Unity!"
VIN_Econ.4.d: "Today, across the Democratic Republic of Vietnam, the people celebrate the anniversary of Tuan Le Vang (Golden Week), a momentous event in the history of our revolutionary struggle. This historic week, which took place from September 17-24, 1945, marked an unparalleled demonstration of national unity, sacrifice, and patriotic fervor, as people from all walks of life contributed their wealth and resources to support the newly liberated nation. \nFrom the northernmost mountains to the imperial heartland of Hue and the Cham lands of Ninh Thuan, patriotic individuals and leaders stood shoulder to shoulder with the revolution. Vuung Chi Sinh, the Meo King of Dong Van, generously donated nine can of gold and over two million dong bac trang. Empress Nam Phuong, the wife of former Emperor Bao-Dai, set an example for the people of Hue, donating her own jewelry, inspiring them to contribute 420 lang of gold. Even Princess Them of the Cham people presented a golden crown, symbolic fruit offerings, and ancestral heirlooms to aid the national cause. These acts of devotion reflected the deep-rooted solidarity of Vietnam's diverse peoples in the struggle for independence. \nAs we mark this anniversary, the Hoi Nghien Cuu Chu Nghia Marx O Dong Duong and Lien Viet reaffirm their commitment to President Ho Chi Minh's policy of class collaboration. Unlike the rigid class struggle promoted by dogmatic Marxist-Leninist and Stalinist factions, our revolutionary path recognizes the vital contributions of the patriotic bourgeoisie (tu ban thanh thi yeu nuic) to national liberation. Just as landlords and industrialists who stand with the people were welcomed into the front lines of resistance, the revolution today continues to embrace all patriotic forces willing to dedicate themselves to the cause of a strong, independent, and socialist Vietnam. \nThe anniversary of Golden Week serves as a reminder that the revolution is not just the cause of workers and peasants but of the entire Vietnamese nation. The struggle for liberation is one that unites all who cherish independence, self-determination, and the dream of a prosperous Vietnam."
VIN_Econ.4.a: "Long live the contributions of our Rich Comrades!"

VIN_Econ.5.t: "Ho Chi Minh request economic aids"
VIN_Econ.5.d: "The Democratic Republic of Vietnam has requested Soviet economic assistance to rebuild its war-torn economy and strengthen its resistance against French colonial forces. Shall we provide aid?"
VIN_Econ.5.a: "Approve the request"
VIN_Econ.5.b: "We cannot spare the resources"

VIN_Econ.6.t: "Ho Chi Minh request economic aids"
VIN_Econ.6.d: "President Ho Chi Minh has appealed to the United States for economic assistance, emphasizing Vietnam's struggle for national independence and postwar reconstruction. How shall we respond?"
VIN_Econ.6.a: "Extend economic assistance."
VIN_Econ.6.b: "Decline the request."

VIN_Econ.7.t: "A New Dawn for Vietnam's Financial System"
VIN_Econ.7.d: "In a landmark achievement for the young Democratic Republic of Vietnam, Comrade Hoang Dinh Tung (Isamu Fujita), alongside the Ministry of Finance under Comrade Le Van Hien, has successfully spearheaded the formalization of the Dong currency and established the foundations of a modern financial system. This historic reform marks the first step in securing Vietnam's economic sovereignty, ensuring that the nation can resist both imperialist economic subjugation and internal financial instability. \nUnder Comrade Tung's guidance, financial institutions were modernized, banking policies were standardized, and a centralized monetary system was introduced to stabilize Vietnam's economy. His vast experience as a former official of the Yokohama Bank allowed him to implement practical financial mechanisms suited for a socialist-oriented economy. With these advancements, Vietnam now possesses the tools to finance its reconstruction efforts, support industrial and agricultural development, and sustain the war for independence. \nFurthermore, under the auspices of Hoi Lien Hiep Quoc Dan Viet Nam, new economic ties with Japan and other Asian nations were established. Through diplomatic channels, trade agreements were initiated, ensuring the supply of essential goods, industrial materials, and financial assistance to fuel Vietnam's path to socialist modernization. Vietnamese coal from Hon Gai and apatite from Lao Cai became critical exports, strengthening Vietnam's role in regional trade while fostering."
VIN_Econ.7.a: "The first step to our advancement towards Socialism!"

VIN_Econ.8.t: "Establishment of National Bank"
VIN_Econ.8.d: "Before the August Revolution in 1945, Vietnam was a feudal-colonial country under the French colonialists' rule. The French colonialists founded and protected the banking and credit system through the Banque de l'Indochine, which functioned as both the central issuing bank and a multi-functional trading bank with commercial banking and investment operations. After the August Revolution, one of the key tasks of the Revolutionary Government was to build an independent and autonomous monetary and banking system to serve the national cause of national reconstruction and defense. This task was gradually realized in the early 1950s, when the anti-French resistance war obtained strong progress with significant victories in the battlefields, and the continually expanding liberated area. In that context, the development required the economic and financial operations to be improved and promoted to meet the new requirements. Based on the new economic and monetary policy set out in the 2nd Congress of the Vietnam Workers' Party, on May 6, 1951, President Ho Chi Minh signed Sac lenh No.15/SL on the establishment of Vietnam National Bank with the key tasks including managing the issuance of banknotes and organizing a money circulation system; managing the State's treasury; conducting credit policies to promote economic production, and coordinating with the trade authorities for the monetary management and to engage in the monetary war against the enemy. The establishment of the Vietnam National Bank was a historical milestone, the progressive result of the struggle process to develop an independent and autonomous monetary and credit system, marking a new development step, changing the quality of the national monetary and credit area."
VIN_Econ.8.a: "Out with the Piastre and in with the Dong!"

VIN_Econ.9.t: "First Step Toward Socialism"
VIN_Econ.9.d: "With the guns finally falling silent in the North following the Geneva Accords, the Democratic Republic of Vietnam now faces a historic task. The revolution must move beyond resistance and begin constructing a new socialist society. As President Ho Chi Minh declared, the North is to become the political, economic, and cultural foundation for the eventual reunification of the Vietnamese nation.\n\nThe Government has unveiled a program to restore roads, railways, and factories devastated by years of war, while encouraging agricultural production in areas where land reform has been completed. New irrigation works, state enterprises, and agricultural cooperatives will gradually lay the foundations of a planned socialist economy. At the same time, Hanoi has reaffirmed its commitment to maintaining peaceful ties between North and South in accordance with the Geneva Accords, while supporting the democratic aspirations of compatriots living under the southern administration.\n\nThe road ahead will be long and difficult. Socialism cannot be built overnight, nor can a nation shattered by decades of colonialism and war be transformed in a single generation."
VIN_Econ.9.a: "Let us build the foundations of a socialist Vietnam."

VIN_Econ.10.t: "The Port of Hai Phong Reopens"
VIN_Econ.10.d: "After years of war and disruption, the Port of Hai Phong has once again resumed full operations under the administration of the Democratic Republic of Vietnam. As the nation's principal gateway to the sea, the reopening of the historic harbor marks an important milestone in the economic reconstruction of the North.\n\nOriginally constructed by the French in 1874 as a colonial trading and military port, Hai Phong grew into one of the busiest ports in Indochina, linking Vietnam to international markets and the railway network stretching toward Yunnan. Now, for the first time, its docks, warehouses, and cranes will serve the interests of an independent Vietnamese state rather than those of a colonial empire.\n\nThe Government has formally placed the port under the administration of the national water transport sector, while engineers and dockworkers labor to repair damaged piers, restore cargo handling facilities, and expand shipping capacity. The renewed flow of machinery, industrial equipment, fertilizers, and consumer goods through Hai Phong will provide a vital lifeline for the North's growing socialist economy.\n\nMore than a commercial harbor, Hai Phong is the Republic's bridge to the outside world. From its docks, friendly nations can extend assistance, while Vietnamese products can once again reach foreign markets."
VIN_Econ.10.a: "The nation's gateway to the sea opened once more."

VIN_Econ.11.t: "Expansion of the Bo Ho Power Plant"
VIN_Econ.11.d: "The liberation of Hanoi has restored to the people one of the nation's most valuable industrial assets: the Bo Ho Power Plant. Once built by the French colonial administration to illuminate their own districts and enterprises, the station will now provide electricity for an independent Vietnam and serve as the cornerstone of our national electrification program.\n\nThe Government has approved plans to modernize and expand the aging facility by repairing worn machinery, installing additional generating equipment, upgrading transmission lines, and increasing power distribution throughout Hanoi and the surrounding provinces. These improvements will supply the electricity needed for factories, workshops, schools, hospitals, and the growing number of state enterprises that form the backbone of socialist construction.\n\nKnown as the cradle of Vietnam's electricity industry because it was the first Power Plant in Indochina, the Bo Ho Power Plant symbolizes the transformation of colonial infrastructure into a national asset. Where it once served foreign interests, it will now power the homes and workplaces of the Vietnamese people, supporting industrial recovery and improving daily life across the capital."
VIN_Econ.11.a: "To enlighten the unlighted revolutionaries."

VIN_Econ.12.t: "Formation of Viet Nam Rail Company"
VIN_Econ.12.d: "For decades, Vietnam's railways served as the steel arteries of colonial rule, carrying troops, raw materials, and goods across the country. Today, under the leadership of the Democratic Republic of Vietnam, these same railways shall be transformed into instruments of national reconstruction and socialist development.\n\nThe Government has formally established the General Department of Vietnam Railways, placing the nation's railway network under unified state administration. Tasked with restoring war-damaged tracks, repairing locomotives, rebuilding bridges, and expanding transport capacity, the new administration will play a central role in reviving the North's economy and connecting industrial centers, agricultural regions, and ports.\n\nThe Vietnamese railway system traces its origins to the first railway between Saigon and My Tho in 1881, while the completion of the North - South railway in 1936 linked the length of the country for the first time. During the struggle for independence, railway workers demonstrated unwavering patriotism, maintaining vital transport lines under the most difficult conditions. On 2 October 1946, President Ho Chi Minh personally traveled by train from Hai Phong to Hanoi, praising the devotion and sacrifice of Vietnam's railway workers - a date that has since become the traditional day of the railway industry."
VIN_Econ.12.a: "Connecting all revolutionaries from all across Vietnam."

VIN_Econ.13.t: "The Party emphasize on Agricultural and Light Industry development"
VIN_Econ.13.d: "The 14th (November 1958) and 16th (April 1959) Plenums of the Central Committee have resolved to accelerate the socialist transformation of North Vietnam through a Three-Year Plan. The Party emphasized that the immediate priority is not rapid heavy industrialization, but the development of agriculture, handicrafts, light industry, and state-owned enterprises to improve the people's standard of living.\n\nThe Government will expand agricultural cooperatives, strengthen irrigation projects, and gradually transform handicrafts and private commerce along socialist lines. At the same time, greater investment will be directed toward light industries producing textiles, consumer goods, food products, medicines, and agricultural equipment.\n\nTo support this program, the Government has reorganized several ministries, including dividing the Ministry of Transport and Public Works into the Ministry of Transport and Post and the Ministry of Water Resources and Architecture, improving the administration of transportation, irrigation, and national development."
VIN_Econ.13.a: "Strengthen agriculture, develop light industry, and build a self-reliant socialist economy."

VIN_Econ.14.t: "Tang gia San Xuat movement: The People's Struggle for Self-Sufficiency"
VIN_Econ.14.d: "Under the guidance of President Ho Chi Minh, the Lien Viet Front, the Ministry of Canh Nong, and the General Command of the National Army and Militia of Vietnam have proudly declared the nationwide success of the Tang Gia San Xuat (Increased Production) movement. Launched as an urgent response to economic hardship and war conditions, this movement has become a pillar of the revolutionary effort, ensuring that both the army and the people have the resources necessary to sustain the resistance against colonial oppression. \nWith the rallying cry of \"Tac dat tac vang\" (Every inch of land is gold) and \"Khong mot tac dat bo hoang\" (Not a single inch of land left uncultivated), the movement has mobilized workers, peasants, and soldiers alike. Villagers have expanded farmland, established cooperative agricultural initiatives, and maximized food production, while the army itself has actively participated in farming and livestock-raising to secure its supply chains. \nThe Lien Viet Front hails the movement as proof of the people's revolutionary will, demonstrating that true independence comes not only from battlefield victories but also from economic self-sufficiency. The Ministry of Canh Nong has reported a significant recovery in agricultural production, reinforcing the livelihoods of peasants and strengthening the war economy. Meanwhile, the General Command of the National Army and Militia has integrated agricultural labor into its military strategy, ensuring that troops remain well-fed and ready for prolonged resistance. \nThis achievement solidifies the resilience of the Democratic Republic of Vietnam. As long as the people work together in unity and discipline, no enemy can starve the revolution into submission. The movement continues, and the revolutionary government calls upon every citizen to persist in their efforts."
VIN_Econ.14.a: "Each grain harvested is a step closer to final victory."

VIN_Econ.15.t: "The Tea Hills of Thai Nguyen Bloom Again"
VIN_Econ.15.d: "After years of war and disruption, the famous tea plantations of Thai Nguyen have resumed production under the direction of the Democratic Republic of Vietnam. Long renowned for producing some of the country's finest tea since the late nineteenth century, the province is once again preparing to supply both the domestic market and friendly nations abroad.\n\nThe Government has ordered the restoration of abandoned plantations, the expansion of tea cooperatives, and the introduction of improved tea varieties to increase both productivity and quality. Building upon the foundations laid before the revolution, new cultivation and processing techniques will be adopted while preserving the traditional craftsmanship that has made Thai Nguyen Tea famous throughout Vietnam.\n\nThe revival of the tea industry represents more than economic recovery. Tea has long been a symbol of the culture and livelihood of the people of Thai Nguyen, providing employment for thousands of rural families and contributing valuable export revenue to the national economy."
VIN_Econ.15.a: "Uncle Ho will be proud of us."

VIN_Econ.16.t: "Outlawing backwards and reactionary customs"
VIN_Econ.16.d: "As North Vietnam advances along the path of socialist construction, the Party has reaffirmed President Ho Chi Minh's principle of \"Freedom of belief, unity between religions.\" Every citizen shall continue to enjoy the right to practice their faith, and all religions that respect the law and contribute to national unity will remain protected by the State.\n\nAt the same time, the Government has launched a nationwide campaign against reactionary and backward practices that hinder production, public health, education, and social progress. Superstitious activities such as spirit mediumship, fortune-telling, extravagant ritual ceremonies, excessive gambling, and wasteful funerals and weddings will be discouraged, while officials are instructed to educate and persuade the people rather than resort to coercion.\n\nThe Party calls upon cadres to respect the customs and beliefs of the people while promoting a new socialist way of life based on thrift, science, labor, and mutual solidarity. As President Ho Chi Minh has often reminded us, the strength of the nation lies not in superstition, but in the efforts of the people themselves."
VIN_Econ.16.a: "Respect faith, reject superstition, and build a Socialist new life."

VIN_Econ.17.t: "Beginning of Land Reforms?"
VIN_Econ.17.d: ""
VIN_Econ.17.a: ""

VIN_Econ.18.t: "The Party emphasize on industrialization and modernization of the nation"
VIN_Econ.18.d: "While agriculture remains vital to feeding the nation, the Central Committee has concluded that Vietnam cannot rely upon the countryside alone. If the Democratic Republic is to stand as an equal among the industrialized nations and prepare for the eventual reunification of the Fatherland, it must embark upon a policy of rapid industrialization and national modernization.\n\nThe Party has therefore adopted a new economic strategy that places priority on the expansion of heavy industry, machine-building, steel production, power generation, chemicals, and modern transportation. Factories, industrial zones, technical institutes, and power plants will become the engines of socialist construction, creating the material foundation for a strong, self-reliant Vietnam.\n\nTo implement this ambitious program, the Government has reorganized the state administration. The former Ministry of Transport and Public Works has been expanded into the Ministry of Public Works and Natural Works, granting it broader authority over transportation, irrigation, national construction, and the development of natural resources. At the same time, the National Assembly has approved the establishment of a new Ministry of Modernization and Industrialization, tasked with coordinating industrial planning, technological development, scientific research, and the mechanization of the national economy.\n\nThe Party believes that only by embracing science, technology, and modern industry can Vietnam overcome centuries of poverty and colonial underdevelopment."
VIN_Econ.18.a: "Socialism arises!"

VIN_Econ.19.t: "Expansion of the Hai Phong Cement Works"
VIN_Econ.19.d: "With reconstruction accelerating across North Vietnam, the Party has approved a major expansion of the Hai Phong Cement Works, transforming the nation's oldest cement factory into the cornerstone of our industrialization program.\n\nFounded in 1899 as the first cement plant in Vietnam and all of Indochina, the factory was built to serve the needs of the French colonial economy. Over the decades, however, it became a cradle of the Vietnamese labor movement. The factory saw the establishment of one of the country's earliest revolutionary youth organizations, the Red Trade Union, and one of the first Party cells of the Indochinese Communist Party in 1929. The victorious workers' strike of 8 January 1930 became a symbol of the strength of the Vietnamese working class, while in 1955, following the liberation of Hai Phong, the factory finally passed into the hands of the workers of an independent Vietnam.\n\nNow, the Government has ordered the construction of new rotary kilns, modern grinding facilities, and expanded quarry operations to dramatically increase cement production. The additional output will support the construction of factories, hydroelectric dams, railways, bridges, schools, and workers' housing as North Vietnam embarks upon a new era of rapid industrialization."
VIN_Econ.19.a: "The builder of an industrialized socialist future."

VIN_Econ.20.t: "Research on Computers and Electronics"
VIN_Econ.20.d: "The rapid advances in electronic computing abroad have demonstrated that a new technological age is emerging. In the United States, the recently unveiled SEAC (Standards Eastern Automatic Computer) became the nation's first fully operational stored-program computer, showcasing the immense potential of electronic calculation and information storage. Meanwhile, despite ideological criticism of cybernetics, Soviet scientists have successfully assembled the powerful BESM-1 computer in Moscow, proving that both East and West recognize the strategic importance of computing technology.\n\nRecognizing its strategic importance, the Government has directed the newly established Ministry of Modernization and Industrialization to begin research into computers, electronics, and semiconductor components. \n\nAlthough our industrial base remains modest, the Party believes Vietnam cannot afford to fall behind in this scientific revolution. The Government has therefore approved the establishment of a small research program to study electronics, telecommunications, automation, and computing machinery. These technologies are expected to improve economic planning, industrial management, military logistics, and scientific research, laying the foundations for the modernization of the nation."
VIN_Econ.20.a: "The machine may calculate, but it is the people who determine its purpose."

VIN_Econ.21.t: "Nam Dinh Textile Factory Resumes Operation"
VIN_Econ.21.d: "Once the greatest textile complex in all of Indochina, the Nam Dinh Textile Factory has resumed full-scale operations under the administration of the Democratic Republic of Vietnam. Founded during the French colonial era and long regarded as the industrial heart of northern Vietnam, the vast complex has now been restored to serve a new purpose: the construction of a socialist economy.\n\nFollowing the liberation of the North in 1954, the factory was transferred from French ownership to the Vietnamese state. Engineers, technicians, and thousands of workers have worked tirelessly to repair machinery damaged by years of war and neglect, bringing the spinning mills, weaving workshops, dyeing facilities, and mechanical workshops back into production.\n\nThe reopening of the factory marks more than an industrial achievement. For decades, Nam Dinh's textile workers stood at the forefront of Vietnam's labor movement, helping to nurture revolutionary consciousness under colonial rule. Today, their factory once again stands as a symbol of the strength of the working class and the nation's determination to achieve economic self-reliance."
VIN_Econ.21.a: "The loom once again turns."

VIN_Econ.22.t: "Expansion of Bach Mai and Phu Bai Airports"
VIN_Econ.22.d: "The rapid reconstruction of the North has exposed a critical weakness in our transportation infrastructure. While our military airfields have served the nation faithfully, the Democratic Republic of Vietnam still lacks a modern civilian international airport capable of handling the growing demands of diplomacy, commerce, and civil aviation. As our ties with fellow socialist nations expand and foreign delegations arrive in increasing numbers, the need for dedicated civilian aviation facilities has become increasingly apparent.\n\nTo address this shortcoming, the government has approved the expansion and modernization of both Bach Mai and Gia Lam Airfields. Built during the colonial era, these airfields will no longer stand merely as relics of French military occupation but will be transformed into vital gateways for a new Vietnam. New passenger terminals, expanded runways, air traffic control facilities, maintenance hangars, and cargo handling infrastructure will be constructed to accommodate both domestic and international civil aviation while retaining the capacity to support national defense when required.\n\nThe project represents more than an investment in transportation. It symbolizes the transformation of colonial infrastructure into instruments of socialist development, connecting the capital to friendly nations across Asia and the wider socialist world."
VIN_Econ.22.a: "We rule the skies."

VIN_Econ.23.t: "Vietnam Joins COMECON"
VIN_Econ.23.d: "The Democratic Republic of Vietnam has been formally admitted into the Council for Mutual Economic Assistance (COMECON), marking a significant milestone in the nation's economic development and its integration into the socialist community. Following extensive consultations with our fraternal allies, Vietnam will now participate in the coordinated planning and economic cooperation that has become the cornerstone of socialist prosperity.\n\nMembership grants our republic access to expanded trade opportunities, industrial equipment, technological expertise, and long-term development assistance from fellow socialist states. In return, Vietnam will contribute its agricultural products, natural resources, and growing industrial capacity to the collective advancement of the socialist world, reinforcing the principle that each nation develops according to its strengths while benefiting from the achievements of all.\n\nFor a country still recovering from the devastation of colonial rule and years of conflict, COMECON membership offers a path toward accelerated industrialization and greater economic self-reliance."
VIN_Econ.23.a: "One Future, One Socialism"

VIN_Econ.24.t: "Opening Up to the Western Market"
VIN_Econ.24.d: "The reconstruction of the North has yielded remarkable progress in agriculture, industry, and manufacturing. New factories have resumed production, state enterprises continue to expand, and traditional industries have been revitalized. Yet with production steadily increasing, a new challenge has emerged: securing sufficient markets for Vietnamese goods beyond the socialist bloc.\n\nLeading economist Bui Cong Trung has publicly advocated for a more outward-looking economic policy, arguing that socialist production should not remain confined to domestic consumption or existing trade partners alone. He has called for Vietnamese products - from textiles, machinery, processed foods, chemicals, cement, and industrial materials to agricultural produce and consumer goods - to compete in the international marketplace. By expanding exports to Western Europe and other non-socialist economies, Vietnam could earn valuable foreign currency, acquire advanced technology, and create new opportunities for continued industrial growth.\n\nAfter careful deliberation, the government has authorized the Ministry of Foreign Trade to pursue limited commercial relations with Western markets."
VIN_Econ.24.a: "We will trade to all countries, friends or foes."

VIN_Econ.25.t: "Establishment of the Chien Thang Automobile Brand"
VIN_Econ.25.d: "The industrialization of the Democratic Republic of Vietnam has reached another historic milestone with the unveiling of the Chien Thang automobile - the first passenger car designed and assembled by Vietnamese engineers and workers. Developed at the Chien Thang Factory in Hanoi, the project represents a bold step toward establishing an indigenous automotive industry capable of meeting the nation's growing transportation needs.\n\nDrawing inspiration from the French Fregate while emphasizing the maximum possible use of domestically manufactured components, Vietnamese engineers have demonstrated remarkable ingenuity in overcoming the technological limitations of a young industrial economy. Engine blocks, cylinder heads, carburetors, fuel pumps, oil pumps, and numerous mechanical components were cast, machined, and assembled by local craftsmen. Although several specialized parts still rely on imported materials, the project has proven that Vietnam possesses both the talent and determination to produce modern automobiles of its own.\n\nThe successful completion of the Chien Thang has been hailed as a triumph of socialist industry and self-reliance. During the vehicle's presentation, President Ho Chi Minh praised the achievement, encouraging engineers to continue their research toward the production of trucks and utility vehicles that would better serve the nation's economy and reconstruction."
VIN_Econ.25.a: "The People's Car"

VIN_Econ.26.t: "The Success of Our Chien Thang Car Brand"
VIN_Econ.26.d: "What began as an ambitious experiment in domestic engineering has grown into one of the proudest achievements of Vietnamese industry. Since the introduction of the first Chien Thang automobile, continued investment in research, manufacturing, and technical training has transformed the marque from a single prototype into the foundation of a growing national automotive industry.\n\nThe Chien Thang factories have steadily expanded production, introducing improved passenger cars, light commercial vehicles, and utility models designed to meet the needs of government agencies, state enterprises, cooperatives, and private citizens alike. Advances in metallurgy, engine manufacturing, and precision machining have significantly increased the proportion of domestically produced components, reducing dependence on imported parts while improving reliability and lowering production costs.\n\nThe success of the Chien Thang brand has also fostered the development of a wider industrial ecosystem. Steel mills, machine-tool factories, rubber producers, glass manufacturers, and chemical plants now supply components for automobile production, creating thousands of skilled jobs and accelerating the modernization of the nation's heavy industry. Vietnamese engineers, once limited to reproducing foreign designs, are now developing vehicles tailored to the country's own roads, climate, and economic needs."
VIN_Econ.26.a: "Millions must drive the chien thang car brand"

VIN_Nhan_Van_Giai_Pham.1.t: "The Nhan Van - Giai Pham Movement Emerges"
VIN_Nhan_Van_Giai_Pham.1.d: "A spirited debate has begun to unfold within the Democratic Republic of Vietnam's literary and intellectual circles. Inspired by recent developments throughout the socialist world - including the Soviet Union's criticism of the cult of personality following the 20th Congress of the CPSU and China's policy of \"Let a Hundred Flowers Bloom, Let a Hundred Schools of Thought Contend\" - many Vietnamese writers, poets, artists, and scholars have begun calling for greater discussion on the role of culture in socialist society.\n\nAmong the first to voice these concerns were a number of military writers and artists, who submitted proposals advocating increased artistic autonomy, the establishment of professional literary associations, and a reduction in military oversight of cultural activities. Their appeals were followed by broader discussions among intellectuals and members of the Vietnam Association of Literature and Arts, where participants openly debated questions of artistic freedom, criticism, and the relationship between creative expression and Party leadership.\n\nThese discussions soon coalesced into what has become known as the Nhan Van - Giai Pham movement, named after the journals that have provided a forum for essays, poetry, and commentary on culture and society. While many contributors affirm their commitment to socialism and the revolution, they argue that a vibrant socialist culture must also encourage honest criticism, intellectual inquiry, and creative innovation."
VIN_Nhan_Van_Giai_Pham.1.a: "Someone call the Cong An..."

VIN_Nhan_Van_Giai_Pham.2.t: "The Shadow of the Anti-Rightist Campaign"
VIN_Nhan_Van_Giai_Pham.2.d: "Events beyond our northern frontier have begun to cast a long shadow over Vietnam's own cultural debates. Following the conclusion of the Hundred Flowers Campaign, the Chinese Communist Party has launched a sweeping Anti-Rightist Campaign, denouncing numerous writers, intellectuals, and officials accused of promoting bourgeois liberalism, opposing Party leadership, or advocating capitalist ideas. What had begun as an invitation for criticism has rapidly transformed into a determined effort to safeguard socialist unity and ideological discipline.\n\nThe developments in China have drawn the close attention of the leadership in Hanoi. Within the Party, some officials have begun comparing the growing Nhan Van - Giai Pham movement to the intellectual currents that emerged during China's Hundred Flowers period. Particular scrutiny has fallen upon poet Tran Dan, whose writings and reformist ideas were influenced in part by the Chinese intellectual Hu Feng, himself condemned by Beijing as the leader of an anti-Party literary clique. The close intellectual parallels between the two movements have fueled growing concern that similar ideological deviations may be taking root within Vietnam.\n\nAmong Party cadres, an increasingly common sentiment has emerged: \"China had its Hu Feng; perhaps we also have our own Hu Feng.\" To those responsible for safeguarding the revolution, the comparison serves as a warning that literary criticism, if left unchecked, could become a vehicle for political opposition disguised as artistic expression.\n\nFor supporters of Nhan Van - Giai Pham, however, the events in China are deeply unsettling. Many had hoped that the changing climate across the socialist world would encourage greater openness and constructive criticism. Instead, the Anti-Rightist Campaign has demonstrated how quickly intellectual debate can give way to political repression, placing Vietnamese writers and artists under growing suspicion."
VIN_Nhan_Van_Giai_Pham.2.a: "Not good..."

VIN_Nhan_Van_Giai_Pham.3.t: "Nghi Quyet So 30/Van Nghe"
VIN_Nhan_Van_Giai_Pham.3.d: "The continued activities of the Nhan Van - Giai Pham circle have prompted the Politburo to issue Resolution No. 30/VN on Literature and the Arts, declaring the controversy no longer a mere disagreement over artistic policy, but a serious political challenge to the socialist revolution. The resolution warns that hostile elements have exploited literature and culture as vehicles to spread revisionist ideas, weaken revolutionary discipline, and undermine the leadership of the Party.\n\nAccording to the resolution, individuals associated with the movement have used slogans such as \"opposing dogmatism\" and \"artistic independence\" to disguise attacks on socialist realism and the revolutionary role of literature. Party leaders argue that these demands seek not to strengthen socialism through criticism, but to detach culture from politics and steer Vietnamese literature toward bourgeois individualism and foreign ideological influences.\n\nThe campaign has been led by To Huu, a member of the Party Central Committee and the official responsible for culture and propaganda. In a series of speeches and publications, he has denounced the Nhan Van - Giai Pham group as a coalition of reactionary intellectuals, revisionists, former collaborators, and anti-socialist elements who seek to corrupt the nation's cultural life. He contends that their calls for unrestricted artistic freedom conceal a broader political objective: the erosion of Party leadership and the restoration of capitalist and bourgeois values.\n\nThe resolution further reaffirms several fundamental principles of socialist culture. Literature and the arts must serve the workers, peasants, and soldiers; they must advance the revolutionary cause under the leadership of the Party; and they must reject bourgeois nationalism, individualism, and revisionism in favor of proletarian internationalism and socialist construction."
VIN_Nhan_Van_Giai_Pham.3.a: "Death to all reactionary dogs!"

VIN_Nhan_Van_Giai_Pham.4.t: "Wartime Literature Movement"
VIN_Nhan_Van_Giai_Pham.4.d: "With the ongoing dramas of the Nhan Van - Giai Pham movement, the Democratic Republic of Vietnam has launched a new cultural initiative to reaffirm the revolutionary purpose of literature and the arts. Under the direction of Deputy Minister of Propaganda To Huu, writers, poets, musicians, and artists are called upon to reject bourgeois individualism and revisionist thought, instead dedicating their talents to the service of socialism, national defense, and the people.\n\nThe new Wartime Literature Movement stands in direct opposition to the ideals promoted by Nhan Van - Giai Pham. Where the latter emphasized artistic autonomy and the independence of literature from political leadership, the new movement proclaims that literature must serve the revolution, the Party, and the working masses. The pen is no longer regarded as the instrument of the individual writer alone, but as a weapon on the cultural front in the struggle against imperialism, revisionism, and counter-revolutionary influences.\n\nFrom this vision has emerged a new generation of \"poet-soldiers.\" Writers no longer stand apart from the people; they march alongside workers in factories, peasants in the fields, and soldiers on the front lines. Many have taken up both the pen and the rifle, documenting the hardships, sacrifices, and victories of the Vietnamese people while participating directly in the nation's revolutionary struggle. The image of the intellectual detached from society has given way to that of the revolutionary cultural cadre.\n\nVeteran poets such as To Huu, Xuan Dieu, Huy Can, Che Lan Vien, and Te Hanh have become leading voices of the movement."
VIN_Nhan_Van_Giai_Pham.4.a: "One single pen can defeat many reactionary thoughts."

VIN_Nhan_Van_Giai_Pham.5.t: "Hundred Flowers Bloom Artistic Movement"
VIN_Nhan_Van_Giai_Pham.5.d: "The changing political climate within the socialist world has begun to influence Vietnam's own intellectual life. In the People's Republic of China, Chairman Mao Zedong's Hundred Flowers Campaign has called upon writers, artists, scientists, and intellectuals to \"let a hundred flowers bloom and a hundred schools of thought contend,\" encouraging criticism of bureaucracy and discussion on the future of socialist society. For many Vietnamese intellectuals, the campaign appears to demonstrate that socialism possesses the confidence to tolerate debate, self-criticism, and creative experimentation.\n\nAmong those most inspired by these developments is the poet Tran Dan. Having closely followed the debates unfolding in China - including the earlier controversy surrounding the writer Hu Feng - Tran Dan and a circle of fellow writers believe that Vietnamese socialism should likewise foster a more open cultural environment. In 1955, they established the journal Nhan Van, followed by Giai Pham, providing a forum where literature, philosophy, and social issues could be discussed with greater frankness than before.\n\nThe influence of the Hundred Flowers Campaign quickly spread throughout Vietnam's literary community. Writers, poets, artists, and scholars began calling for broader artistic freedom, constructive criticism of bureaucracy, and a reassessment of the relationship between culture and political leadership. Many insisted that these proposals did not challenge socialism itself, but sought to strengthen it through Marxist self-criticism and the active participation of the nation's intellectuals in socialist construction.\n\nWithin the Party, however, reactions have been divided. Reform-minded cadres argue that the Chinese example demonstrates the value of allowing criticism to correct bureaucratic shortcomings and improve governance."
VIN_Nhan_Van_Giai_Pham.5.a: "Ensure that only safe opinions are allowed."

VIN_Nhan_Van_Giai_Pham.6.t: "Deciding our way of Liberalization"
VIN_Nhan_Van_Giai_Pham.6.d: "The triumph of the Nhan Van - Giai Pham movement has fundamentally reshaped the political landscape of the Democratic Republic of Vietnam. Calls for greater intellectual freedom, legal reform, and a more open socialist society have gained broad acceptance among the Party and the nation's intelligentsia. Yet victory has brought with it an even greater question: how far should Vietnam's reforms go?\n\nThe international situation offers both inspiration and warning. Across Eastern Europe, demands for reform have produced sharply different outcomes. In Poland, negotiated political reforms preserved socialism while granting greater flexibility to national institutions. In Hungary, however, widespread unrest escalated into armed conflict, foreign intervention, and immense destruction. These events have convinced many Vietnamese leaders that liberalization must proceed carefully if it is not to threaten the revolution itself.\n\nWithin the Party, two distinct visions have emerged.\n\nOne faction argues that Vietnam should follow a Hungarian-style reform program, expanding freedom of expression, decentralizing political authority, reducing Party intervention in cultural life, and introducing broader political participation. They believe that socialism can only remain strong if it earns the confidence of the people through openness and reform.\n\nOthers caution against embracing any foreign model wholesale. They argue that Vietnam's circumstances are unique and that the nation should instead rely upon the experience, moderation, and revolutionary wisdom of President Ho Chi Minh. Rather than imitating the upheavals seen elsewhere, they propose that reforms should be introduced gradually under Ho's personal guidance, balancing intellectual freedom with political stability and preserving the unity forged during the struggle for independence."
VIN_Nhan_Van_Giai_Pham.6.a: "The Budapest Model"
VIN_Nhan_Van_Giai_Pham.6.b: "Let Uncle Ho decides on liberalization"

VIN_Nhan_Van_Giai_Pham.7.t: "Learning from Eastern Bloc Liberalization"
VIN_Nhan_Van_Giai_Pham.7.d: "The success of the Nhan Van - Giai Pham movement has encouraged many Vietnamese intellectuals and reform-minded Party members to look beyond the nation's borders for inspiration. Throughout Eastern Europe, socialist governments are experimenting with new approaches to governance, economic management, and cultural policy in response to the changing political climate following the Twentieth Congress of the Communist Party of the Soviet Union.\n\nFrom Poland have come calls for greater national autonomy within the socialist camp, expanded public debate, and a more pragmatic approach to economic planning. Elsewhere, governments have relaxed censorship, restored limited academic freedoms, and encouraged constructive criticism to improve the efficiency of socialist administration. While the pace and extent of these reforms differ from country to country, they share a common belief that socialism can be renewed through openness rather than rigid orthodoxy.\n\nWithin Vietnam, supporters of Nhan Van - Giai Pham argue that these developments demonstrate the maturity and confidence of modern socialism. They contend that the Democratic Republic should similarly encourage intellectual discussion, strengthen the rule of law, expand the role of professional and cultural organizations, and permit responsible criticism of bureaucracy and inefficiency. Such reforms, they insist, would create a socialism that is not only revolutionary but also responsive to the needs and aspirations of the Vietnamese people.\n\nNot everyone is convinced. More cautious voices warn that foreign models cannot simply be transplanted into Vietnam and that excessive liberalization risks undermining the unity forged through years of revolutionary struggle. They acknowledge the successes achieved abroad but urge that any reforms be carefully adapted to Vietnam's own historical conditions and revolutionary traditions."
VIN_Nhan_Van_Giai_Pham.7.a: "Socialism requires a human face"

VIN_Nhan_Van_Giai_Pham.8.t: "Ho Chi Minh permits Liberalization"
VIN_Nhan_Van_Giai_Pham.8.d: "The victory of the Nhan Van - Giai Pham movement has ushered Vietnam into a new era of reflection. As calls for reform echo throughout the nation, many now look to President Ho Chi Minh to define the future of Vietnamese socialism. Rather than viewing greater openness as a retreat from revolutionary ideals, Uncle Ho has argued that a confident revolution must never fear the honest voice of its people.\n\nLong before the birth of the Democratic Republic of Vietnam, the young Nguyen Tat Thanh traveled the world in search of a path to national liberation. During his time in the United States, he carefully studied the American Declaration of Independence, whose affirmation that all people possess the rights to liberty and equality left a lasting impression upon him. He also admired the ideals embodied by George Washington, Thomas Jefferson, and particularly Abraham Lincoln, whose vision of a government \"of the people, by the people, for the people\" would later influence Ho's own political philosophy.\n\nThese principles were not forgotten after independence. The 1946 Constitution reflected Ho Chi Minh's conviction that the Vietnamese state should be one \"of the people, by the people, and for the people,\" combining democratic participation with national independence and social justice. To Ho, these ideals were not foreign imports but universal principles that could coexist with Vietnam's own revolutionary traditions and socialist aspirations.\n\nWith the cultural reforms championed by Nhan Van - Giai Pham now prevailing, President Ho has announced a new course for the nation. Intellectuals will be permitted greater freedom to debate public affairs, writers and artists will enjoy broader creative autonomy, and legal institutions will be strengthened to ensure that the state remains accountable to the people."
VIN_Nhan_Van_Giai_Pham.8.a: "All beings deserved to have liberty and freedom."

VIN_Nhan_Van_Giai_Pham.9.t: "The New Poetry Movement"
VIN_Nhan_Van_Giai_Pham.9.d: "The victory of the Nhan Van - Giai Pham movement has not only transformed Vietnam's political and cultural landscape, but has also ushered in the most ambitious literary renaissance since the original Tho Moi (New Poetry) Movement of the 1930s. With the resignation and political eclipse of To Huu and other hardline advocates of ideological orthodoxy, the constraints that had long defined revolutionary literature have been lifted, opening the door to a new generation of poetic experimentation.\n\nThe architects of Nhan Van - Giai Pham argue that revolutionary literature must not become confined by rigid formulas or political slogans. Instead, they call for poetry that reflects the richness of the human experience while remaining committed to the nation's progress. Looking back to the literary revolution begun by Phan Khoi, Xuan Dieu, Huy Can, and countless others before the revolution, they proclaim the beginning of a Second New Poetry Movement - one that seeks to liberate Vietnamese verse from ideological conformity just as the original movement.\n\nThe new movement encourages poets to experiment freely with blank verse, free verse, prose poetry, symbolic imagery, philosophical reflection, romantic expression, and modern literary techniques. Traditional rhyme and metrical structures remain respected, but they are no longer regarded as the sole standard of Vietnamese poetry. Writers are encouraged to discover their own voices, believing that genuine artistic creativity strengthens rather than weakens the nation.\n\nLiterary journals once silenced by political controversy have reopened their pages to debate and experimentation. Young poets now write not only of revolution and labor, but also of love, memory, loneliness, nature, faith, philosophy, urban life, and the complex emotions of ordinary people. The individual voice - once criticized as bourgeois individualism - is increasingly recognized as an essential part of the nation's cultural identity."
VIN_Nhan_Van_Giai_Pham.9.a: "You and I are the only master of our words and personhood."

VIN_Nhan_Van_Giai_Pham.100.t: "[GetNewspaperHeader]Nhan Van-Giai Pham Purges"
VIN_Nhan_Van_Giai_Pham.100.d: "HANOI - The government of the Democratic Republic of Vietnam has moved decisively to dismantle the Nhan Van - Giai Pham movement, bringing an end to nearly three years of increasingly heated debate over the future of literature, culture, and intellectual freedom in North Vietnam.\n\nThe crackdown comes amid a rapidly changing international climate. Following the Soviet Union's de-Stalinization campaign, many socialist countries experienced demands for greater political and cultural openness. However, the Hungarian Uprising of 1956, unrest in Poland and Georgia, and China's abrupt transition from the Hundred Flowers Campaign to the Anti-Rightist Campaign profoundly altered the outlook of communist leadership throughout the socialist bloc.\n\nDuring visits to Beijing in 1957, President Ho Chi Minh observed China's struggle with intellectual dissent following the Hundred Flowers Campaign. Upon returning to Hanoi, he warned against what he described as \"Rightist thinking,\" arguing that socialist democracy could not be exploited to undermine the leadership of the Party. In September 1957, under the pen name Tran Luc, Ho published the article \"Smash Rightist Thought,\" condemning revisionist tendencies and warning that hostile ideas could spread rapidly if left unchecked.\n\nThe Party soon intensified its campaign against the Nhan Van - Giai Pham circle. In January 1958, the Politburo adopted Resolution No. 30 on Literature and the Arts, declaring the activities of the movement to be \"a highly dangerous phenomenon\" that sought to spread revisionism, bourgeois ideology, and reactionary political thought under the slogan of opposing dogmatism. Authorities accused the movement of attempting to separate artists from the revolutionary leadership of the Party and redirect Vietnamese literature toward capitalist and individualist values.\n\nLeading the campaign was Party cultural chief To Huu."
VIN_Nhan_Van_Giai_Pham.100.a: "The rifle overpowers the pen..."

VIN_Nhan_Van_Giai_Pham.101.t: "[GetNewspaperHeader]The Liberalization of North Vietnam"
VIN_Nhan_Van_Giai_Pham.101.d: "HANOI - In a development that has surprised observers across both East and West, the Democratic Republic of Vietnam has embarked upon a sweeping program of political and cultural liberalization following the unexpected triumph of the Nhan Van - Giai Pham movement.\n\nOnce condemned as a gathering of dissident intellectuals, the movement has emerged as the dominant force within Hanoi's cultural establishment after reform-minded officials successfully outmaneuvered the Party's orthodox faction. The dismissal of several prominent hardliners, including influential propagandists who had long championed strict ideological control, has paved the way for a new generation of writers, artists, academics, and legal reformers.\n\nThe new leadership has announced a series of reforms aimed at creating what it describes as \"a humane and democratic socialism suited to Vietnam's own conditions.\" Restrictions on literature and the press have been eased, universities have been granted greater academic autonomy, and intellectual debate is once again flourishing in newspapers, publishing houses, and cultural associations. The government has also promised judicial reforms, stronger constitutional protections, and expanded public participation in local governance while reaffirming its commitment to socialism and national independence.\n\nForeign reactions have been mixed. Across Eastern Europe, many reform-minded socialists have welcomed Hanoi's experiment as evidence that socialism can evolve through openness rather than coercion. Western governments have cautiously praised the expansion of civil liberties, though many remain skeptical of whether meaningful political pluralism will follow. Meanwhile, more orthodox socialist governments have expressed concern that Vietnam's reforms could encourage similar demands within their own borders."
VIN_Nhan_Van_Giai_Pham.101.a: "A victory of the artists and of individualism"

VIN_Land_Reform.1.t: "Nghi Quyet So 09 - NQ/TW"
VIN_Land_Reform.1.d: "Nghi Quyet ve Cong Tac Cai Cach Ruong Dat\n\nAfter hearing and discussing the Government's report on the implementation of land reform,\n\nRESOLVES:\n\n1- Currently, the land reform movement has been fundamentally completed in the North, and the anti-feudal task in the North has been fundamentally accomplished.\n\nIn the North, the landlord class has been fundamentally overthrown, the feudal system of land ownership has been abolished, and peasants have become masters of the countryside; the long-held aspiration of peasants for \"land to the tiller\" has been realized; the class consciousness of working peasants has been partially raised; Rural productive forces were liberated; rural production relations were reformed, thereby initially boosting agricultural production, improving the lives of farmers, and paving the way for the development of industry, commerce, and culture in the country.\n\nThis was the result of the arduous, persistent, and heroic struggle of our people and farmers, the result of the anti-imperialist and anti-feudal revolutions, and the result of our people's democratic regime in the North. These results demonstrate that our general line, the land reform law, and the supplementary policies passed by the National Assembly were fundamentally correct.\n\nHowever, the rent reduction and land reform campaigns, especially the 7th and 8th rent reductions and the 4th and 5th land reform campaigns, committed many mistakes. These were serious mistakes, contrary to some provisions of the land reform law passed by the National Assembly, contrary to the democratic rule of law of the State, and contrary to the policies of the Fatherland Front.\n\nThese mistakes not only limited the achievements already made, but also caused us many difficulties and negative consequences.\n\nFaced with the aforementioned serious mistakes, the Government accepted its responsibility and seriously criticized itself before the National Assembly."
VIN_Land_Reform.1.a: "Signed"

VIN_Land_Reform.2.t: "The Beginning of Communization"
VIN_Land_Reform.2.d: "The victory of the Land Reform Campaign has fundamentally transformed the countryside of the Democratic Republic of Vietnam. Across the North, the power of the landlord class has been broken, millions of peasants have received land, and the remnants of feudal relations have been swept away. Yet Party leaders increasingly argue that land redistribution alone is not enough to achieve socialism in agriculture.\n\nFor generations, Vietnamese agriculture has been characterized by small, fragmented plots worked by individual households. While the distribution of land has satisfied the peasants' long-standing demand for ownership, many officials believe that this system cannot provide the productivity, mechanization, and efficiency necessary for rapid socialist development. The challenge now facing the revolution is how to transform countless small farms into a modern agricultural economy capable of supporting industrialization and national reconstruction.\n\nFollowing extensive discussions within the Vietnamese Workers' Party and consultations with socialist allies, the government has announced the beginning of a new stage in rural transformation: the gradual communalization of agriculture.\n\nRather than immediately abolishing private cultivation, the Party has called upon peasants to voluntarily form Mutual Aid Teams and Agricultural Production Cooperatives ( Hop tac Xa ). Villagers are encouraged to pool labor, draft animals, tools, irrigation systems, and farming knowledge in order to increase productivity and reduce inefficiencies. Party cadres emphasize that cooperation represents the natural next step after land reform, allowing peasants to enjoy the benefits of collective labor while retaining the gains won through revolution."
VIN_Land_Reform.2.a: "Land to the tillers"

VIN_Land_Reform.3.t: "The Question of Class Collaboration"
VIN_Land_Reform.3.d: "The revolutionary transformation of North Vietnam has fundamentally altered the nation's social order. Land reform has weakened the old landlord class, while workers and peasants have assumed an increasingly prominent role in the construction of socialism. Yet as the country embarks upon industrialization and economic reconstruction, the Party must determine how to approach those social groups that do not fit neatly into the traditional categories of class struggle.\n\nAmong the most debated are the national bourgeoisie - the so-called \"patriotic capitalists\" - whose factories, workshops, trading firms, and technical expertise continue to contribute to the national economy. Unlike the feudal landlords, many members of this class supported the struggle for independence and have demonstrated a willingness to cooperate with the revolutionary government. During the Land Reform Campaign, the Party deliberately distinguished them from the landlord class, allowing their enterprises and property to remain intact while encouraging them to assist in the development of industry and commerce.\n\nSome Party theorists argue that Vietnam's unique historical experience demands a flexible approach. Unlike the industrialized societies described in classical Marxist theory, pre-colonial Vietnam was organized around autonomous villages and family networks rather than rigid class divisions. National solidarity, they argue, has often proved more decisive than class identity in resisting foreign domination. Even during the anti-colonial struggle, workers, peasants, intellectuals, merchants, and patriotic businessmen frequently united under the common objective of national liberation."
VIN_Land_Reform.3.a: "Rich comrades helped the poorer comrades"

VIN_Land_Reform.4.t: "Slow Progress on Land Reforms"
VIN_Land_Reform.4.d: "The Land Reform Campaign has encountered growing difficulties across the countryside. Although the Party remains committed to eliminating the remnants of feudalism and empowering the peasantry, implementation has progressed far more slowly than originally anticipated.\n\nMany local cadres have struggled to accurately distinguish between poor peasants, middle peasants, rich peasants, and landlords. In numerous villages, family ties, long-standing personal relationships, and incomplete land records have complicated investigations. Some cadres have urged immediate and uncompromising action, while others advocate greater caution to prevent wrongful accusations that could alienate loyal supporters of the revolution.\n\nThe pace of redistribution has likewise been slowed by the enormous administrative burden of surveying land, organizing mass meetings, resolving disputes, and establishing new village authorities. In some provinces, the shortage of experienced cadres has forced the Party to postpone scheduled campaigns while additional personnel receive political and legal training.\n\nCompounding these difficulties is the mounting human cost of the campaign. Initial Party planning reportedly envisioned the execution of approximately one \"reactionary and evil landlord\" per one thousand inhabitants, a figure which, if fully implemented nationwide, would amount to roughly 15,000 executions. As the campaign has unfolded, however, reports from the countryside have produced widely differing estimates. Some officials insist that only a few hundred of the most notorious landlords have been executed, while other accounts suggest the death toll has already reached tens of thousands. Foreign observers and later reports have estimated figures ranging from around 800 to more than 50,000 deaths, with the highest estimates claiming as many as 100,000 - 200,000 people may have perished."
VIN_Land_Reform.4.a: "Oh no"

VIN_Land_Reform.5.t: "Preparing for the Future"
VIN_Land_Reform.5.d: "The Democratic Republic of Vietnam has been guided since its founding by President Ho Chi Minh, the undisputed father of the revolution. Yet as the nation grows stronger, the Party has begun quietly preparing for the day when a new generation must carry on his legacy. The question of succession has become one of the most important issues facing the Party.\n\nSeveral leading revolutionaries have emerged as potential successors.\n\nVo Nguyen Giap is celebrated as the architect of Vietnam's military victories and enjoys immense prestige among both the army and the people.\n\nNguyen Chi Thanh is regarded as a staunch revolutionary, known for his organizational skill, ideological discipline, and leadership within the People's Army.\n\nLe Duan has built a reputation as a capable Party organizer and strategist, advocating rapid socialist development and national reunification.\n\nTruong Chinh, one of the Party's chief theorists, commands respect for his experience in Marxist ideology and Party organization.\n\nHoang Quoc Viet, a veteran revolutionary and trade union leader, is admired for his ability to unite workers, mass organizations, and Party cadres.\n\nFor now, Uncle Ho continues to lead the nation. But the choice of who will one day inherit his mantle will determine the future direction of Vietnam's revolution for decades to come."
VIN_Land_Reform.5.a: "Nguyen Chi Thanh"
VIN_Land_Reform.5.b: "Le Duan"
VIN_Land_Reform.5.c: "Vo Nguyen Giap"
VIN_Land_Reform.5.e: "Truong Chinh"
VIN_Land_Reform.5.f: "Hoang Quoc Viet"

VIN_Land_Reform.100.t: "[GetNewspaperHeader]North Vietnam Begins Land Reform"
VIN_Land_Reform.100.d: "HANOI - The Democratic Republic of Vietnam has announced the beginning of an ambitious nationwide Land Reform Campaign, marking one of the most significant social transformations undertaken by the communist government since its establishment.\n\nThe reform seeks to dismantle the traditional landlord system by redistributing agricultural land to landless and poor peasants. Officials in Hanoi describe the campaign as a necessary step toward eliminating feudal exploitation, increasing agricultural production, and laying the foundations for a socialist countryside.\n\nDrawing heavily upon the experiences of other socialist and communist states, particularly the Soviet Union and China, the campaign combines land redistribution with rent reduction and organized class struggle in rural villages. Revolutionary tribunals have been established to investigate alleged abuses by landlords, while mass meetings are being organized to mobilize peasant participation.\n\nSupporters argue that the reform will finally fulfill the long-standing aspirations of millions of Vietnamese peasants who have lived under generations of indebtedness and unequal land ownership. Party leaders have declared that the campaign represents \"land to the tiller\" and the completion of Vietnam's democratic revolution in the countryside."
VIN_Land_Reform.100.a: "Welcome to the rice paddies"

VIN_Geneva_Conference.1.t: "The Beginning of the Geneva Conference"
VIN_Geneva_Conference.1.d: "Representatives from the major powers have gathered in Geneva to discuss the future of Indochina. The conference represents a critical opportunity to end the bloody conflict that has ravaged our homeland for years. As the Democratic Republic of Vietnam, we must carefully consider our position and what we are willing to accept for peace. The eyes of the world are upon us, and the decisions made here will shape the destiny of our nation for generations to come."
VIN_Geneva_Conference.1.a: "We will participate in good faith."

VIN_Geneva_Conference.100.t: "[GetNewspaperHeader]The End of the Indochina War"
VIN_Geneva_Conference.100.d: "After years of brutal conflict, the Geneva Conference has finally concluded with an agreement to end the Indochina War. The accords establish a temporary division of Vietnam along the 17th parallel, with elections scheduled for 1956 to determine the country's future. While not the complete victory we had hoped for, this agreement provides our people with a much-needed respite from the horrors of war and a path forward toward eventual reunification."
VIN_Geneva_Conference.100.a: "Peace at last."

VIN_Geneva_Conference.200.t: "[GetNewspaperHeader]The Declaration of the Indochinese Federation"
VIN_Geneva_Conference.200.d: "Geneva, [?global.date.GetDateStringNoHourLong] - In a decisive triumph for the revolutionary struggle, the Geneva Conference has concluded with the recognition of a complete victory in Indochina. With foreign forces expelled and colonial authority dismantled, representatives of Vietnam, Laos, and Cambodia have jointly proclaimed the creation of the Indochinese Federation.\n\nThis declaration marks the culmination of years of shared sacrifice and resistance. United by common struggle, the peoples of Indochina have chosen cooperation over division, forging a new political order rooted in independence, solidarity, and self-determination. The federation stands as a clear rejection of foreign domination and imposed borders.\n\nA new era now begins for Indochina. Through unity and collective strength, the peoples of the region will determine their own future, free from colonial rule and external interference.\n\n"
VIN_Geneva_Conference.200.a: "A new chapter begins."

#### Campaigns (VIN_Camp namespace) ####
VIN_Campaign_Supply_Change_tt:0 "§YCampaign Supply§! [?vin_supply_amount|+0] (now §Y[?VIN.VIN_Campaign_Supply|0]§!)"
VIN_Camp.2.t:0 "The Campaign Is Over"
VIN_Camp.2.d_clean:0 "The objective is ours, and inside the time the staff allowed for it. The columns came off the passes before the corps could react, and the ground was taken while Saigon was still arguing about where we were.\n\nThe Politburo will hear about this campaign for years. So will Paris.\n\nDay §Y[?VIN.VIN_camp_days_elapsed|0]§! of §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.2.d_ground:0 "The objective is ours, but it was not taken - it was worn down. The deadline came and went and the fighting continued past it, and the casualty lists are longer than anything the campaign was supposed to cost.\n\nSaigon will call the delay a victory of its own, and on the numbers it has a case. We hold the ground regardless.\n\nDay §Y[?VIN.VIN_camp_days_elapsed|0]§! of §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.2.d_called_off:0 "The campaign has been called off. The guns stopped before the objective changed hands, and the columns are coming back over the passes with nothing to show for the rice they ate.\n\nBetter this than the alternative. An army that is broken in the highlands does not come back at all.\n\nDay §Y[?VIN.VIN_camp_days_elapsed|0]§! of §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.2.d_failed:0 "The deadline has passed and the objective still stands. The campaign is finished - not called off, but spent. The supply is gone, the formations that went forward are shadows of what marched, and the corps holds every position it held when we started.\n\nSaigon will make a great deal of this, and it has earned the right to.\n\nDay §Y[?VIN.VIN_camp_days_elapsed|0]§! of §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.2.d_superseded:0 "The campaign has been overtaken by events elsewhere in Indochina. Its objective no longer decides the theatre, so the columns are standing down without a battlefield settlement being recorded.\n\nDay §Y[?VIN.VIN_camp_days_elapsed|0]§! of §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.2.a:0 "The Party thanks the comrades who took it."
VIN_Camp.2.b:0 "We will learn from it and go again."
VIN_Camp.3.t:0 "The Valley of Dien Bien Phu"
VIN_Camp.3.d:0 "The French have put a garrison into a basin ringed by hills, twelve days' march from the delta and supplied by nothing but air. They chose it to draw us into a set-piece battle they expect to win, because they do not believe artillery can be brought over those hills.\n\nIt can. The guns will go up the reverse slopes by hand, dug into the ridge and firing over open sights. What we cannot do is take our time - the camp is being reinforced by parachute every week we wait, and the rains end this offensive whether it is finished or not.\n\nOne thing must be understood by every commander in the highlands: §Ythe battle is the camp itself§!. The valley floor is not the objective, the province is."
VIN_Camp.3.a:0 "Bring the guns over the hills."
VIN_Camp_Dien_Bien_Objective_tt:0 "§YObjective§! - take the fortified camp at §YDien Bien Phu§! itself.\nOverrunning the rest of Tay Bac Bo does §Rnot§! win this battle. The camp does."
VIN_Camp.4.t:0 "The Valley Is Decided"
VIN_Camp.4.d_clean:0 "The camp has fallen, and it fell inside the time the guns could be kept in supply. The last strongpoint went under before the garrison could be told the relief was not coming.\n\nThere is nothing left between us and the delta that Paris can call a plan. The Assembly will hear about this valley before it hears anything else, and what it decides there it will decide because of this.\n\nDay §Y[?VIN.VIN_camp_days_elapsed|0]§! of §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.4.d_ground:0 "The camp has fallen. It took longer than the staff allowed for, and the price was paid a strongpoint at a time - trenches driven forward by hand across ground the French had ranged to the metre.\n\nSaigon will make much of how long its garrison held. Let it. The garrison is gone and the valley is ours.\n\nDay §Y[?VIN.VIN_camp_days_elapsed|0]§! of §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.4.d_called_off:0 "The siege has been lifted by our own order. The guns are coming back down off the ridges and the divisions are going back to the base areas with the camp still standing behind them.\n\nAn army broken in that basin would not have come out at all. This was the right call, and it will not feel like it for a long time.\n\nDay §Y[?VIN.VIN_camp_days_elapsed|0]§! of §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.4.d_failed:0 "The offensive is spent and the tricolour is still flying over the valley. The guns are out of shell, the assault divisions are shadows, and the airlift kept the garrison fed through every week we were able to keep up the pressure.\n\nDien Bien Phu held. Paris will say the war has turned, and for now it has.\n\nDay §Y[?VIN.VIN_camp_days_elapsed|0]§! of §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.4.d_superseded:0 "Events elsewhere have settled the theatre before the valley could decide it. The siege is lifted without recording a Dien Bien Phu battlefield result.\n\nDay §Y[?VIN.VIN_camp_days_elapsed|0]§! of §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.4.a:0 "Dien Bien Phu is ours."
VIN_Camp.4.b:0 "The valley kept its garrison. We will not forget it."
VIN_Camp_War_Tay_Bac_tt:0 "§RDeclare war on the Tai Federation§!\nObjective: §Yseize Hoang Lien Son within 120 days§!. Past §Y210§! the offensive has failed."
VIN_Camp_War_Hoa_Binh_tt:0 "§RDeclare war on the Muong Federation§!\nObjective: §Yseize Hoa Binh within 120 days§!. Past §Y210§! the offensive has failed.\n\nCEFEO's opening seizure has already established the salient. This declaration begins the counteroffensive and forces Salan to choose between a staged withdrawal and continuing the holdout."
VIN_Camp_War_Dien_Bien_tt:0 "§RDeclare war on the Tai Federation§!\nObjective: §Ytake the fortified camp at Dien Bien Phu within 150 days§!. Overrunning the rest of the highlands is not winning the battle. Past §Y260§! the siege has failed."
VIN_Camp_War_Cao_Bac_tt:0 "§RDeclare war on the Tho Autonomous Territory§!\nObjective: §Ycontrol every province in Cao Bang and Lang Son within 120 days§!. Past §Y210§! the offensive has failed."
VIN_Camp_War_Vinh_Yen_tt:0 "§RBegin the Battle of Vinh Yen against the Tai Federation§!\nTake the §Ysingle Vinh Yen province§! in Hoang Lien Son and hold it for §Y5 consecutive daily ticks§!. Clean victory: day §Y20§!. Final deadline: day §Y35§!."
VIN_Camp_War_Mao_Khe_tt:0 "§RBegin the Battle of Mao Khe against CEFEO§!\nTake the §Ysingle Mao Khe province§! in the Red River Delta and hold it for §Y5 consecutive daily ticks§!. Clean victory: day §Y20§!. Final deadline: day §Y35§!."
VIN_Camp_War_Day_River_tt:0 "§RBegin the Battle of the Day River against CEFEO§!\nTake §YNinh Binh§!, §YPhat Diem§!, and the §Ycentral Day River line§! at the same time, then hold all three for §Y5 consecutive daily ticks§!. Clean victory: day §Y30§!. Final deadline: day §Y50§!."
VIN_Camp_War_Na_San_tt:0 "§RBegin the assault on the Tai Federation§!\nTake the §Ysingle Na San camp province§! in Tay Bac Bo - not Dien Bien Phu or Son La - and hold it for §Y5 consecutive daily ticks§!. Clean victory: day §Y30§!. Final deadline: day §Y45§!."
VIN_Camp_Clock_tt:0 "§YCURRENT OBJECTIVE§!\n[GetVINCampaignObjective]\n\n§YProgress§!: campaign day §Y[?VIN.VIN_camp_days_elapsed|0]§! / §Y[?VIN.VIN_camp_deadline_y|0]§!. Clean result through day §Y[?VIN.VIN_camp_deadline_x|0]§!.[GetVINCampaignHoldProgress]"
VIN_CAMP_HOLD_PROGRESS:0 "\n§YContinuous hold§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§! daily ticks. Losing any required province resets this to zero."
VIN_CAMP_HOLD_PROGRESS_NONE:0 ""
VIN_CAMP_OBJ_VINH_YEN:0 "Capture the specifically highlighted §YVinh Yen§! province northwest of Hanoi and keep control for §Y5 consecutive daily ticks§!."
VIN_CAMP_OBJ_MAO_KHE:0 "Capture the specifically highlighted §YMao Khe§! province and keep control for §Y5 consecutive daily ticks§!."
VIN_CAMP_OBJ_DAY_RIVER:0 "Simultaneously control all §Ythree specifically highlighted provinces§!: §YNinh Binh§!, §YPhat Diem§!, and the §Ycentral Day River line§!. Keep all three for §Y5 consecutive daily ticks§!."
VIN_CAMP_OBJ_NA_SAN:0 "Capture the specifically highlighted §YNa San§! camp, not Dien Bien Phu or Son La, and keep control for §Y5 consecutive daily ticks§!."
VIN_CAMP_OBJ_NORTHWEST:0 "§YObjective§! - hold the corridor through §YHoang Lien Son§!: the five provinces running from the Dong Bac Bo border to the Hoa Binh approach. The far northwest of the state is reached only through Ha Giang and is not required.\nThat corridor is the link between the northern base areas and Thanh Hoa, and it cuts the corps in Tay Bac Bo off from the delta."
VIN_CAMP_OBJ_HOA_BINH:0 "§YObjective§! - break the French salient and take §YHoa Binh§!. If CEFEO carries out an orderly withdrawal first, the Hoa Binh campaign settlement awards the town and ends this operation without ending the wider Indochina War."
VIN_CAMP_OBJ_DIEN_BIEN:0 "§YObjective§! - take the camp at §YDien Bien Phu§! itself. Overrunning the rest of Tay Bac Bo is not the battle."
VIN_CAMP_OBJ_CAO_BAC:0 "§YObjective§! - simultaneously control every province in §YCao Bang§! and §YLang Son§!."
VIN_CAMP_OBJ_NONE:0 ""
