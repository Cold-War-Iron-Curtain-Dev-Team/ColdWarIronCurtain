VIN_Econ.7.t: "A New Dawn for Vietnam’s Financial System"
VIN_Econ.7.d: "In a landmark achievement for the young Democratic Republic of Vietnam, Comrade Hoang Dinh Tung (Isamu Fujita), alongside the Ministry of Finance under Comrade Le Van Hien, has successfully spearheaded the formalization of the Dong currency and established the foundations of a modern financial system. This historic reform marks the first step in securing Vietnam’s economic sovereignty, ensuring that the nation can resist both imperialist economic subjugation and internal financial instability. \nUnder Comrade Tung’s guidance, financial institutions were modernized, banking policies were standardized, and a centralized monetary system was introduced to stabilize Vietnam’s economy. His vast experience as a former official of the Yokohama Bank allowed him to implement practical financial mechanisms suited for a socialist-oriented economy. With these advancements, Vietnam now possesses the tools to finance its reconstruction efforts, support industrial and agricultural development, and sustain the war for independence. \nFurthermore, under the auspices of Hoi Lien Hiep Quoc Dan Viet Nam, new economic ties with Japan and other Asian nations were established. Through diplomatic channels, trade agreements were initiated, ensuring the supply of essential goods, industrial materials, and financial assistance to fuel Vietnam’s path to socialist modernization. Vietnamese coal from Hon Gai and apatite from Lao Cai became critical exports, strengthening Vietnam’s role in regional trade while fostering."
VIN_Econ.7.a: "The first step to our advancement towards Socialism!"

VIN_Econ.8.t: "Establishment of National Bank"
VIN_Econ.8.d: "Before the August Revolution in 1945, Vietnam was a feudal-colonial country under the French colonialists’ rule. The French colonialists founded and protected the banking and credit system through the Banque de l'Indochine, which functioned as both the central issuing bank and a multi-functional trading bank with commercial banking and investment operations. After the August Revolution, one of the key tasks of the Revolutionary Government was to build an independent and autonomous monetary and banking system to serve the national cause of national reconstruction and defense. This task was gradually realized in the early 1950s, when the anti-French resistance war obtained strong progress with significant victories in the battlefields, and the continually expanding liberated area. In that context, the development required the economic and financial operations to be improved and promoted to meet the new requirements. Based on the new economic and monetary policy set out in the 2nd Congress of the Vietnam Workers’ Party, on May 6, 1951, President Ho Chi Minh signed Sac lenh No.15/SL on the establishment of Vietnam National Bank with the key tasks including managing the issuance of banknotes and organizing a money circulation system; managing the State’s treasury; conducting credit policies to promote economic production, and coordinating with the trade authorities for the monetary management and to engage in the monetary war against the enemy. The establishment of the Vietnam National Bank was a historical milestone, the progressive result of the struggle process to develop an independent and autonomous monetary and credit system, marking a new development step, changing the quality of the national monetary and credit area."
VIN_Econ.8.a: "Out with the Piastre and in with the Dong!"

