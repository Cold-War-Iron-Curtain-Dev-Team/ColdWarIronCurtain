VIN_Econ.14.t: "Tang gia San Xuat movement: The People's Struggle for Self-Sufficiency"
VIN_Econ.14.d: "Under the guidance of President Ho Chi Minh, the Lien Viet Front, the Ministry of Canh Nong, and the General Command of the National Army and Militia of Vietnam have proudly declared the nationwide success of the Tăng Gia Sản Xuất (Increased Production) movement. Launched as an urgent response to economic hardship and war conditions, this movement has become a pillar of the revolutionary effort, ensuring that both the army and the people have the resources necessary to sustain the resistance against colonial oppression. \nWith the rallying cry of "Tac dat tac vang" (Every inch of land is gold) and "Khong mot tac dat bo hoang" (Not a single inch of land left uncultivated), the movement has mobilized workers, peasants, and soldiers alike. Villagers have expanded farmland, established cooperative agricultural initiatives, and maximized food production, while the army itself has actively participated in farming and livestock-raising to secure its supply chains. \nThe Lien Viet Front hails the movement as proof of the people's revolutionary will, demonstrating that true independence comes not only from battlefield victories but also from economic self-sufficiency. The Ministry of Canh Nong has reported a significant recovery in agricultural production, reinforcing the livelihoods of peasants and strengthening the war economy. Meanwhile, the General Command of the National Army and Militia has integrated agricultural labor into its military strategy, ensuring that troops remain well-fed and ready for prolonged resistance. \nThis achievement solidifies the resilience of the Democratic Republic of Vietnam. As long as the people work together in unity and discipline, no enemy can starve the revolution into submission. The movement continues, and the revolutionary government calls upon every citizen to persist in their efforts."
VIN_Econ.14.a: "Each grain harvested is a step closer to final victory."

