 #Indonesia
 INO_President_of_the_Republic: "President of the Republic of Indonesia"
 INO_President_of_the_Republic_desc: "Office of the President of the Republic of Indonesia:\n\n§HIr. Soekarno§!\n\n\n\n\n\n\n\n£INO_Sukarno\n\n\n\n\n\n\n\n\n-------------------------------------\n§WEstablished under the 1945 Constitution by the BPUPKI, the President of the Republic of Indonesia officially assumed its duty on August 18th, 1945, a day after the proclamation.\n\nSoekarno was elected as the first President by the PPKI alongside Vice President Mohammad Hatta. On 11 November 1945, the KNIP made the decision to separate the role of head of state from that of head of government. Although a new constitution had not been set up yet, Indonesia was now a de facto parliamentary democracy, with the president as a ceremonial head of state whose function was to ask the prime minister, as the head of government, to form a new cabinet.§!"
 INO_Vice_Chairman_of_the_PDRI: "Vice Chairman of the Emergency Government"
 INO_Vice_Chairman_of_the_PDRI_desc: "Office of the Emergency Government Vice Chairman:\n\n§HTeuku Mohammad Hassan§!\n\n\n\n\n\n\n\n£INO_Teuku_Hassan\n\n\n\n\n\n\n\n\n-------------------------------------\n§WNot long after the Second Dutch Aggression, the Dutch, who had conquered Yogyakarta, told everyone that the Republic of Indonesia was dead because Soekarno, Hatta, and Sjahrir were arrested and exiled.\n\nThat's where the PDRI came into place. Several leaders of the Republic, who were in West Sumatra, were able to gather in Halaban, and on December 22, 1948, they held a meeting. Although officially, President Soekarno's order has not been received, dated December 22, 1948, in accordance with the concept that has been prepared, then in the meeting it was decided to form the Emergency Government of the Republic of Indonesia.§!"
 INS_President_of_East_Indonesia: "President of the State of East Indonesia"
 INS_President_of_East_Indonesia_desc: "Office of the President of the State of East Indonesia:\n\n§HTjokorda Gde Raka Sukawati§!\n\n\n\n\n\n\n\n£INS_Raka_Soekawati\n\n\n\n\n\n\n\n\n-------------------------------------"
