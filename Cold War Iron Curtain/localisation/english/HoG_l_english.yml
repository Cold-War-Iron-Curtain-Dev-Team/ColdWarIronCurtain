 #Indonesia
 INO_President_of_the_Republic: "President of the [INO.GetName]"
 INO_President_of_the_Republic_desc: "Office of the President of the [INO.GetName]:\n\n§HIr. Soekarno§!\n\n\n\n\n\n\n\n£INO_Sukarno\n\n\n\n\n\n\n\n\n-------------------------------------\n§WEstablished under the 1945 Constitution by the BPUPKI, the President of the Republic of Indonesia officially assumed its duty on August 18th, 1945, a day after the proclamation.\n\nSoekarno was elected as the first President by the PPKI alongside Vice President Mohammad Hatta. On 11 November 1945, the KNIP made the decision to separate the role of head of state from that of head of government. Although a new constitution had not been set up yet, Indonesia was now a de facto parliamentary democracy, with the president as a ceremonial head of state whose function was to ask the prime minister, as the head of government, to form a new cabinet.§!"
 INO_Vice_Chairman_of_the_PDRI: "Vice Chairman of the Emergency Government"
 INO_Vice_Chairman_of_the_PDRI_desc: "Office of the Emergency Government Vice Chairman:\n\n§HSoesanto Tirtoprodjo§!\n\n\n\n\n\n\n\n£INO_Soesanto_Tirtoprodjo_49\n\n\n\n\n\n\n\n\n-------------------------------------\n§WNot long after the Second Dutch Aggression, the Dutch, who had conquered Yogyakarta, told everyone that the Republic of Indonesia was dead because Soekarno, Hatta, and Sjahrir were arrested and exiled.\n\nThat's where the PDRI came into place. Several leaders of the Republic, who were in West Sumatra, were able to gather in Halaban, and on December 22, 1948, they held a meeting. Although officially, President Soekarno's order has not been received, dated December 22, 1948, in accordance with the concept that has been prepared, then in the meeting it was decided to form the Emergency Government of the Republic of Indonesia.§!"
 INO_President_of_the_Republic_United_States_desc: "Office of the President of the [INO.GetName]:\n\n§HIr. Soekarno§!\n\n\n\n\n\n\n\n£INO_Sukarno_RUSI\n\n\n\n\n\n\n\n\n-------------------------------------\n§WEstablished under the 1945 Constitution by the BPUPKI, the President of the Republic of Indonesia officially assumed its duty on August 18th, 1945, a day after the proclamation.\n\nSoekarno was elected as the first President by the PPKI alongside Vice President Mohammad Hatta. On 11 November 1945, the KNIP made the decision to separate the role of head of state from that of head of government. Although a new constitution had not been set up yet, Indonesia was now a de facto parliamentary democracy, with the president as a ceremonial head of state whose function was to ask the prime minister, as the head of government, to form a new cabinet.§!"
 INO_President_of_the_Republic_1949_desc: "Office of the President of the [INO.GetName]:\n\n§HIr. Soekarno§!\n\n\n\n\n\n\n\n£INO_Sukarno_40s\n\n\n\n\n\n\n\n\n-------------------------------------\n§WEstablished under the 1945 Constitution by the BPUPKI, the President of the Republic of Indonesia officially assumed its duty on August 18th, 1945, a day after the proclamation.\n\nSoekarno was elected as the first President by the PPKI alongside Vice President Mohammad Hatta. On 11 November 1945, the KNIP made the decision to separate the role of head of state from that of head of government. Although a new constitution had not been set up yet, Indonesia was now a de facto parliamentary democracy, with the president as a ceremonial head of state whose function was to ask the prime minister, as the head of government, to form a new cabinet.§!"
 INO_President_of_the_Republic_Vacant_desc: "Office of the President of the [INO.GetName]:\n\n§HVacant Position§!\n\n\n\n\n\n\n\n£INO_President_Vacant\n\n\n\n\n\n\n\n\n-------------------------------------\n§WEstablished under the 1945 Constitution by the BPUPKI, the President of the Republic of Indonesia officially assumed its duty on August 18th, 1945, a day after the proclamation.\n\nFollowing the government’s unsuccessful attempt to retake control of the Moluccas, a region crucial to Indonesia's territorial integrity, President Sukarno made the momentous decision to resign from his position. This resignation came amid growing tensions and political instability within the country, leaving the presidential office vacant.§!"
 INO_President_of_the_Republic_2: "Office of the President of the [INO.GetName]:\n\n§HDatuk Assaat Mudo§!\n\n\n\n\n\n\n\n£INO_Datuk_Assaat_Mudo\n\n\n\n\n\n\n\n\n-------------------------------------\n§WEstablished under the 1945 Constitution by the BPUPKI, the President of the Republic of Indonesia officially assumed its duty on August 18th, 1945, a day after the proclamation.\n\nSoekarno was elected as the first President by the PPKI alongside Vice President Mohammad Hatta. On 11 November 1945, the KNIP made the decision to separate the role of head of state from that of head of government. Although a new constitution had not been set up yet, Indonesia was now a de facto parliamentary democracy, with the president as a ceremonial head of state whose function was to ask the prime minister, as the head of government, to form a new cabinet.§!"
 INS_President_of_East_Indonesia: "President of the State of East Indonesia"
 INS_President_of_East_Indonesia_desc: "Office of the President of the State of East Indonesia:\n\n§HTjokorda Gde Raka Sukawati§!\n\n\n\n\n\n\n\n£INS_Raka_Soekawati\n\n\n\n\n\n\n\n\n-------------------------------------"
 #Japan
 JAP_Emperor_of_Japan: "Emperor of Japan"
 JAP_Emperor_of_Japan_desc: "His Majesty, Symbol of the Unity of the People for §C[JAP.GetNameWithFlag]§!:\n\n§HHirohito§!\n\n\n\n\n\n\n\n£JAP_Hirohito\n\n\n\n\n\n\n\n\n-------------------------------------\nFrom the §YManchurian Incident§! through the §YSino Japanese War§! and ultimately the §Routbreak of war against the United States and Britain§!, Japan advanced along the path to war.\nUnder the §YConstitution of the Empire of Japan§!, §GEmperor Hirohito§! held the §Yhighest constitutional authority§! in decision making, yet in practice he largely §Yapproved policies determined by the government§!.\n\nAfter a §Rlong and devastating conflict§!, on §YAugust 14, 1945§!, §GEmperor Hirohito§! made the §Gsacred decision§! to §Gaccept the Potsdam Declaration§! and addressed the nation by radio, announcing the §Gend of the war§!.\nHis Majesty later met with §YGeneral Douglas MacArthur§!, a meeting that would §Ydecisively shape Japan’s future§!.\n\nIn the postwar period, §GEmperor Hirohito§! issued the §Ydeclaration denying his own divinity§!.\nWith the enforcement of the §YConstitution of Japan§!, the Emperor was defined as the §Gsymbol of the State of Japan and of the unity of the Japanese people§!.\n§GEmperor Hirohito§! traveled throughout the country, §Gshowing compassion to the families of fallen soldiers and war victims§!, and §Gencouraging citizens striving for postwar reconstruction§!, offering the Japanese people §Ghope in a new era§!.\n\nFrom an early age, §GEmperor Hirohito§! had a deep interest in §Yinsects and marine life§!.\nIn his spare time, he continued §Yspecialized research in the classification of marine organisms and plants§!, leaving behind §Gnumerous academic achievements§!.\n\n§RTenno without Japan cannot exist§!.\n§GTenno Heika Banzai§!"
