 USA_mkultra_gui_x16_title: "The Olson File"
 USA_mkultra_gui_x16_owner: "CIA Office of Security / TSS Chemical Division"
 USA_mkultra_gui_x16_claim: "Frank Olson, an Army biochemist at Camp Detrick, was given LSD without his knowledge at Deep Creek Lake on 19 November 1953. He died nine days later after falling from the thirteenth floor of the Statler Hotel in New York. This is a record, not a dossier: nothing here can be commissioned."
