 USA_mkultra_gui_x16_disposition_public: "§RPublicly disclosed§!"
 USA_mkultra_gui_x16_disposition_internal: "§gInternal file§!"
 USA_mkultra_gui_x16_appraisal_compensated: "The President apologised to the family in 1975, and Congress paid them $750,000 in 1976. The file is still incomplete about what happened in the hotel room."
 USA_mkultra_gui_x16_appraisal_contested: "The Agency contested the family's account after the Rockefeller report. The Senate hearings will have the file in front of them."
 USA_mkultra_gui_x16_appraisal_concealed: "For the family and the Army, the death was a fall or a suicide. The internal file says otherwise."
 USA_mkultra_gui_x16_appraisal_reprimanded: "Those responsible received letters of criticism that were placed in their files and described as not being reprimands. No one was disciplined."
