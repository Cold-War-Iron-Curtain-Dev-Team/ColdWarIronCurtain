l_english:
 # Personnel
 USA_mkultra_appoint_dulles: "Appoint Allen Dulles as Director"
 USA_mkultra_appoint_dulles_desc: "Allen Dulles takes over the Agency with a conviction that the Soviets have a head start in the science of the mind and that the United States cannot afford to wait. It was Dulles who approved MKUltra in April 1953, and Dulles who decided how little the rest of the government needed to know.\n\nHolds office until §Y29 November 1961§!."
 USA_mkultra_appoint_gottlieb: "Put Sidney Gottlieb in Charge of the Program"
 USA_mkultra_appoint_gottlieb_desc: "Sidney Gottlieb, chief of the Technical Services Staff's Chemical Division, is a quiet, devout man who keeps goats and believes in the work. Under him the program will move fast, cost little, and keep almost no paperwork.\n\nRequires an active CIA charter. Leaves when the charter closes or at the end of §Y1972§!."
 USA_mkultra_appoint_helms: "Appoint Richard Helms as Director"
 USA_mkultra_appoint_helms_desc: "Richard Helms came up through clandestine operations and protected MKUltra for most of its life. As Director he will defend the Agency's secrets at almost any cost, including, if it comes to that, their destruction.\n\nHolds office until §Y2 February 1973§!."

 USA_mkultra_dci_dulles: "Allen Dulles, Director of Central Intelligence"
 USA_mkultra_dci_dulles_desc: "The Great White Case Officer. He runs the Agency as a private service, and the program as a personal conviction."
 USA_mkultra_dci_helms: "Richard Helms, Director of Central Intelligence"
 USA_mkultra_dci_helms_desc: "The man who kept the secrets. Under Helms, the first question about any file is who else has seen it."
 USA_mkultra_tss_gottlieb: "Sidney Gottlieb, TSS Chemical Division"
 USA_mkultra_tss_gottlieb_desc: "The program's chemist and its conscience, in that order. Gottlieb signs the subprojects, sets the protocols, and keeps very few records."

 # Frank Olson
 cwic_mkultra.600.t: "A Fall from the Statler Hotel"
 cwic_mkultra.600.d: "At a working retreat at Deep Creek Lake, Maryland, Technical Services officers spiked a bottle of Cointreau with LSD and served it to a group of Army scientists from the Special Operations Division at Camp Detrick. None of them was told. One of them, the biochemist Frank Olson, never recovered his footing. Nine days later, in the early hours of 28 November, he went through a closed window on the thirteenth floor of the Statler Hotel in New York while under the care of an Agency escort.\n\nThe Office of Security wants to know what the Army, the police and the family are going to be told."
 cwic_mkultra.600.d_gottlieb: "At a working retreat at Deep Creek Lake, Maryland, Sidney Gottlieb's Technical Services officers spiked a bottle of Cointreau with LSD and served it to a group of Army scientists from the Special Operations Division at Camp Detrick. None of them was told. One of them, the biochemist Frank Olson, never recovered his footing. Nine days later, in the early hours of 28 November, he went through a closed window on the thirteenth floor of the Statler Hotel in New York while under the care of an Agency escort.\n\nGottlieb has already written his account. It says the experiment was properly conceived and that nobody could have predicted the outcome. The Office of Security wants to know what the Army, the police and the family are going to be told."
 cwic_mkultra.600.a: "He fell or he jumped. That is all anyone needs to know."
 cwic_mkultra.600.b: "Write letters of criticism and keep them inside the Agency."
 USA_mkultra_olson_accident_tt: "Adds §R4 Harm§!. The death is recorded as an accident; if it is disclosed later, the concealment costs §R6 Exposure Pressure§!."
 USA_mkultra_olson_reprimand_tt: "Costs §Y10 Political Power§! and adds §R4 Harm§!. A written internal record of fault counts §G1 point less§! when the Church Committee weighs the program."

 cwic_mkultra.605.t: "The Rockefeller Report"
 cwic_mkultra.605.d: "Buried in the Rockefeller Commission's report on CIA activities is a paragraph about an Army employee who was given LSD without his knowledge in 1953 and died a week later. It names no one. The family of Frank Olson has read it and recognised him at once.\n\nThe Agency's internal letters of criticism exist, and they are now going to be read by people outside it. The White House wants to know whether the family will get an apology."
 cwic_mkultra.605.d_concealed: "Buried in the Rockefeller Commission's report on CIA activities is a paragraph about an Army employee who was given LSD without his knowledge in 1953 and died a week later. It names no one. The family of Frank Olson has read it and recognised him at once.\n\nFor twenty-two years they were told he had fallen or jumped. The files say otherwise, and the press is about to say so too. The White House wants to know whether the family will get an apology."
 cwic_mkultra.605.a: "The President will apologise. Back a private relief bill for the family."
 cwic_mkultra.605.b: "Contest the family's account of what the Agency knew."
 USA_mkultra_rockefeller_olson_compensate_tt: "Adds §R6 Exposure Pressure§! if the death was concealed in 1953 (otherwise §R2§!). Costs §Y25 Political Power§!: a public apology and §Y$750,000§! in compensation, enacted in 1976."
 USA_mkultra_rockefeller_olson_contest_tt: "Adds §R6 Exposure Pressure§! if the death was concealed in 1953 (otherwise §R2§!). The 1977 Senate hearings will take the program §R1 tier more seriously§!."

 # Card 12: Bluebird/Artichoke
 USA_mkultra_commission_bluebird: "Commission Project Bluebird"
 USA_mkultra_commission_bluebird_desc: "In April 1950 the Director approved a program to find out whether drugs, hypnosis and isolation could break a man under interrogation, or make him forget that he had been questioned at all. The Office of Security calls it Bluebird. From August 1951 it will be called Artichoke. Teams are already working on suspected agents and defectors in Japan, Korea and Germany.\n\nNo charter or slot is needed. Costs §Y20 Political Power§!. Adds §R1 Exposure Pressure§!. Completing the 60-day study awards §G5 Research Record§! and adds §R2 Harm§!."
 USA_mkultra_commission_bluebird_tt: "Commit §Y20 Political Power§!, add §R1 Exposure Pressure§!, and begin a 60-day interrogation study."
 USA_mkultra_bluebird_research: "Bluebird/Artichoke: Interrogation Teams"
 USA_mkultra_bluebird_research_desc: "Interrogation teams are testing drug and hypnosis combinations on subjects held overseas."

 cwic_mkultra.650.t: "The Artichoke File"
 cwic_mkultra.650.d: "The interrogation teams have sent back their case reports. Subjects talked, sometimes; some remembered nothing afterwards; several were left in a state the reports describe only as unsatisfactory. Whether any of it produced information that could be trusted is not a question the file answers.\n\nThe new Technical Services chemists have asked for the file. The Office of Security would rather it stayed where it is."
 cwic_mkultra.650.a: "Send the file to Technical Services."
 cwic_mkultra.650.b: "Keep it in the Office of Security."
 USA_mkultra_bluebird_forward_tt: "Awards §G2 Research Record§!. Adds §R1 Exposure Pressure§!."
 USA_mkultra_bluebird_restrict_tt: "Reduces Exposure Pressure by §G1§!."

 # Card 13: MKDELTA
 USA_mkultra_commission_mkdelta: "Authorize Project MKDELTA"
 USA_mkultra_commission_mkdelta_desc: "Artichoke studied how to interrogate with drugs. MKDELTA is meant to make that operational: the rules, supplies and field authority for using biochemicals in clandestine work overseas. The subjects will be foreign nationals in places where nobody in Washington will ever hear of them.\n\nRequires the archived Artichoke file. No charter or slot is needed. Costs §Y30 Political Power§!. Adds §R1 Exposure Pressure§! and §R4 Harm§!. The 90-day field program and 30-day review award §G6 Research Record§!."
 USA_mkultra_commission_mkdelta_tt: "Commit §Y30 Political Power§!, add §R1 Exposure Pressure§! and §R4 Harm§!, and begin a 90-day field program."
 USA_mkultra_mkdelta_research: "MKDELTA: Overseas Field Program"
 USA_mkultra_mkdelta_research_desc: "Field stations are using biochemicals in operations abroad under MKDELTA authority."
 USA_mkultra_mkdelta_review: "MKDELTA: Field Review"
 USA_mkultra_mkdelta_review_desc: "Headquarters is reviewing the field reports from MKDELTA stations."

 cwic_mkultra.655.t: "The MKDELTA Field Reports"
 cwic_mkultra.655.d: "The field stations report what they did and, less often, what came of it. The protocols work in the narrow sense that drugs can be given to people without their knowledge. Beyond that, the reports are vague about results and say nothing at all about what happened to the subjects afterwards.\n\nTechnical Services proposes to fold the field protocols into MKUltra and run them from Washington. The alternative is to let MKDELTA lapse and leave the overseas work with the stations."
 cwic_mkultra.655.a: "Fold the field protocols into MKUltra."
 cwic_mkultra.655.b: "Close the overseas program."
 USA_mkultra_mkdelta_absorb_tt: "Awards §G2 Research Record§!. Adds §R2 Harm§!."
 USA_mkultra_mkdelta_close_tt: "The MKDELTA file is closed with no further cost."
