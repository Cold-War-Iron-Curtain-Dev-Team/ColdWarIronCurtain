 MALAYA_ETHNICITY_TOOLTIP_Malay:0 "The Malay people are the indigenous inhabitants of the Malayan Peninsula, with a rich history of maritime trade and Islamic culture. They have traditionally been the political and cultural majority, deeply connected to the sultanates and the spread of Islam throughout the region."
 MALAYA_ETHNICITY_TOOLTIP_Chinese:0 "The Chinese community in Malaya and Borneo arrived primarily as migrants and traders. They have significantly influenced commerce, urban life, and industry, maintaining distinct cultural traditions while integrating with local society."
 MALAYA_ETHNICITY_TOOLTIP_Thai:0 "The Thai people in northern Malaya and southern Thailand share close cultural and linguistic ties. Predominantly Theravada Buddhists, they have historically balanced relations between Malay Muslim sultanates and the Siamese kingdom."
 MALAYA_ETHNICITY_TOOLTIP_Dayak:0 "The Dayak are the indigenous hill tribes of Borneo, known for their rich cultural heritage, animist beliefs, and longhouses. They have a history of resistance to external domination and maintain distinct social and religious traditions."
 MALAYA_ETHNICITY_TOOLTIP_Bornean:0 "The Bornean peoples encompass diverse ethnic groups on the island, including coastal and interior communities. Their cultures blend traditional animist practices with influences from Islam and Christianity, reflecting centuries of trade and migration."
 MALAYA_ETHNICITY_TOOLTIP_Indian:0 "The Indian community in Malaya traces its roots to colonial-era labor migration, particularly to plantations, railways, and ports. Comprising diverse groups such as Tamils, Telugus, and Punjabis, they brought with them a rich cultural heritage, including Hinduism, Islam, and Sikhism, and have played a vital role in shaping Malaya's plural society."

 MALAYA_RELIGION_TOOLTIP_Islam:0 "Islam is the dominant religion among the Malay population, introduced through centuries of trade and missionary activity. It deeply shapes the cultural, legal, and political landscape of Malaya and Borneo."
 MALAYA_RELIGION_TOOLTIP_Christianity:0 "Christianity, brought by European missionaries and colonial powers, has a significant following in parts of Borneo. It has influenced local education and social institutions, especially among indigenous communities."
 MALAYA_RELIGION_TOOLTIP_Buddhism:0 "Buddhism in Malaya and Borneo is primarily practiced by the Chinese community following Mahayana traditions. In contrast, the Thai populations adhere to Theravada Buddhism, reflecting their cultural heritage and regional ties."
 MALAYA_RELIGION_TOOLTIP_Other:0 "Confucianism influences many Chinese cultural practices, emphasizing family and social harmony. Traditional Bornean religions are animist in nature, centered on ancestral worship and reverence for nature spirits, reflecting the deep connection between communities and their environment."

