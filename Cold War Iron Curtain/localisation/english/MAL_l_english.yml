 USA_50s_Permit_Thai_Intervention:0 "Permit Thai Intervention"

 MAL_Expand_the_Malay_Regiment:0 "Expand the Malay Regiment"
 MAL_Expand_the_Malay_Regiment_desc:0 "The Royal Malay Regiment should be expanded to better combat against the communist threat."
 MAL_Accept_American_and_British_Military_Aid:0 "Accept American & British Military Aid"
 MAL_Accept_American_and_British_Military_Aid_desc:0 "America and Britain are the best hope we have of defeating the communists. We should petition them for as much aid as they can give us."
 MAL_Contain_the_PKMM_Remnants:0 "Contain the PKMM Remnants"
 MAL_Contain_the_PKMM_Remnants_desc:0 "The remnants of the Malay Nationalist Party, though not strictly communist, should not be allowed to operate as freely as before. We will contain the more extremist and left-wing elements of former party members and sway as many moderates to our side as we can."
 MAL_The_1955_General_Election:0 "The 1955 General Election"
 MAL_The_1955_General_Election_desc:0 "The elections for the Federal Legislative Council are on the horizon. Whichever party wins will determine the fate of Malaya for years to come."
 MAL_Implementation_of_the_Draft_Development_Plan:0 "Implementation of the Draft Development Plan"
 MAL_Implementation_of_the_Draft_Development_Plan_desc:0 "We will implement an economic development plan, based on the Colombo Plan, to further our industrial capacity."
 MAL_Expand_Housing_and_Modernize_Road_Systems:0 "Expand Housing & Modernize Road Systems"
 MAL_Expand_Housing_and_Modernize_Road_Systems_desc:0 "As the country develops, the people will need more living space as well as reliable arteries of commerce. An investment into housing and infrastructure will go a long way."
 MAL_The_Malayan_Emergency:0 "The Malayan Emergency"
 MAL_The_Malayan_Emergency_desc:0 "The so-called Malayan National Liberation Army has declared their intent to ''liberate'' Malaysia from British rule and establish a communist state. Should they succeed, they will plunge Malaysia into chaos and ruin. This cannot be allowed."
 MAL_Field_Marshal_Temples_Reign:0 "Field Marshal Templer's Reign"
 MAL_Field_Marshal_Temples_Reign_desc:0 "The fate of Malaysia lies in the balance, and there is only one man with the vision and will to do what is necessary against the communist threat. Field Marshall Gerald Templer will be placed in command until Malaya is free from communist interference."
 MAL_Expand_the_Johor_Police_Force:0 "Expand the Johor Police Force"
 MAL_Expand_the_Johor_Police_Force_desc:0 "For the safety of the Malayan people, the Johore police must be expanded and reorganised into a force that can maintain order in our streets."
 MAL_Employ_Chindit_Tactics:0 "Employ Chindit Tactics"
 MAL_Employ_Chindit_Tactics_desc:0 "The Chindits used surprise tactics to hold off the Japanese in Burma during the War. There is much we can learn from them."
 MAL_Found_the_Malayan_Naval_Force:0 "Found the Malayan Naval Force"
 MAL_Found_the_Malayan_Naval_Force_desc:0 "Geography demands we create a strong navy to defend against any maritime threat, protect our coasts, and secure our shipping routes."
 MAL_Repair_The_Wakataka:0 "Repair the Wakataka"
 MAL_Repair_The_Wakataka_desc:0 "The Royal Navy has transferred the Japanese minelayer known as the Wakataka, or Young Hawk, to us. We will repair her and put her to use against any threats that come from the sea."
 MAL_Recieve_The_HMS_Test_and_Other_British_Naval_Assets:0 "Recieve British Naval Assets"
 MAL_Recieve_The_HMS_Test_and_Other_British_Naval_Assets_desc:0 "As communism spreads in Asia, the threat of naval invasion grows. By receiving British naval assets such as the HMS Test, we can better safeguard our maritime borders."
 MAL_Expand_Port_Dicksons_Naval_Facilities:0 "Expand Port Dickson's Naval Facilities"
 MAL_Expand_Port_Dicksons_Naval_Facilities_desc:0 "Port Dickson sits at an ideal spot for naval training facilities."
 MAL_Establish_the_Communications_Branch:0 "Establish the Communications Branch"
 MAL_Establish_the_Communications_Branch_desc:0 "Clear and constant communication is essential for the success of our military, as well as for maintaining the civilian population informed."
 MAL_Found_the_Engineering_and_Support_Branches:0 "Found the Engineering & Support Branches"
 MAL_Found_the_Engineering_and_Support_Branches_desc:0 "Weapons win wars, a fact the Japanese learned the hard way. Establishing a branch dedicated to the research and development of new weapons and support equipment is crucial to our success on the battlefield."
 MAL_Create_the_Armoured_Car_Regiment:0 "Create the Armoured Car Regiment"
 MAL_Create_the_Armoured_Car_Regiment_desc:0 "Fast, safe, and reliable, the armoured car is the future of short-range infantry transportation."
 MAL_Establish_the_Artillery_Branch:0 "Establish the Artillery Branch"
 MAL_Establish_the_Artillery_Branch_desc:0 "Some say that in an age of tanks and bombers, artillery is obsolete. Thankfully, we have people with a modicum of intelligence running our military."
 MAL_Expand_the_Port_Dickson_Army_Training_Depot:0 "Expand the Port Dickson Army Training Depot"
 MAL_Expand_the_Port_Dickson_Army_Training_Depot_desc:0 "As well as naval training facilities, Port Dickson is home to an important army training depot. We should expand its facilities so that our best men are prepared for whatever comes their way on the battlefield."
 MAL_Found_the_Malayan_Auxiliary_Air_Force:0 "Found the Malayan Auxiliary Air Force"
 MAL_Found_the_Malayan_Auxiliary_Air_Force_desc:0 "In today's day an age, an air force is essential to protect our cities from enemy bombing raids as well as reconnaissance. We will fund an air force capable of doing both and more."
 MAL_Expand_the_Simpang_Airbase:0 "Expand the Simpang Airbase"
 MAL_Expand_the_Simpang_Airbase_desc:0 "The Sungai Besi Air Base will be expanded and refurbished to better serve our modernizing air force."
 MAL_Learn_from_the_Singapore_and_Straits_Settlements_Veterans:0 "Learn from the Veterans"
 MAL_Learn_from_the_Singapore_and_Straits_Settlements_Veterans_desc:0 "WWII taught us very valuable lessons in warfare. We will study these hard lessons with help from those who fought on the front lines and apply them where necessary."
 MAL_Acquire_RAF_Equipment:0 "Acquire RAF Equipment"
 MAL_Acquire_RAF_Equipment_desc:0 "The RAF were the ones who defeated the Luftwaffe. By importing their war assets, we will make sure that the communists' dreams of ''red skies'' will remain an unobtainable fantasy."
 MAL_End_of_the_Chinese_Civil_War:0 "End of the Chinese Civil War"
 MAL_End_of_the_Chinese_Civil_War_desc:0 "The Chinese Civil War is over. Now is the time to evaluate the situation and determine how will we will deal with the results."
 MAL_Accept_Chinese_Refugees:0 "Accept Chinese Refugees"
 MAL_Accept_Chinese_Refugees_desc:0 "Refugees fleeing from the CCP have petitioned the government for asylum. We will allow them to stay, and perhaps they will prove useful in our ongoing struggle against the communists."
 MAL_Closer_Ties_With_Nanking:0 "Closer Ties With China"
 MAL_Closer_Ties_With_Nanking_desc:0 "Whether or not we like the results of the Chinese Civil War, we cannot afford to isolate ourselves from Asia's largest country. Realpolitik demands we have a close relationship with China.."
 MAL_Ally_with_the_Malayan_Chinese_Association:0 "Ally with the Malayan Chinese Association"
 MAL_Ally_with_the_Malayan_Chinese_Association_desc:0 "We will ally with the MCA in order to defeat the Pan-Malaysian Islamic Party in the general elections."
 MLA_Victory_of_the_Pan_Malay_Islamic_Party:0 "Victory of the Pan-Malay Islamic Party"
 MLA_Victory_of_the_Pan_Malay_Islamic_Party_desc:0 "Abbas Alias and the Pan-Malaysian Islamic Party have secured a majority in the Federal Legislative Council."
 MAL_Increase_Anti_Chin_Peng_and_MRLA_Propaganda:0 "Increase Anti-Communist Propaganda"
 MAL_Increase_Anti_Chin_Peng_and_MRLA_Propaganda_desc:0 "Chin Peng and the MNLA are nothing more than traitorous killers funded by foreign communist governments. We must convince the people of this truth so that Peng's empty promises cannot seduce the general public."
 MAL_Ally_with_the_India_Congress:0 "Ally with the India Congress"
 MAL_Ally_with_the_India_Congress_desc:0 "The Indian National Congress are no fans of communism, especially of the Chinese kind. Perhaps we can ally with them and secure their assistance in wiping out the red menace."
 MAL_Calm_Chinese_Malay_Racial_Tensions:0 "Calm Chinese-Malay Racial Tensions"
 MAL_Calm_Chinese_Malay_Racial_Tensions_desc:0 "Anti-Chinese racism is fuel for the communist cause. We need to tone down the rhetoric before we have a race war on our hands."
 MAL_Host_a_National_Flag_Competition:0 "Host a National Flag Competition"
 MAL_Host_a_National_Flag_Competition_desc:0 "A country without a flag is no country at all! We will allow the people to submit designs for a new flag that properly represents Malaya!"
 MAL_Contact_Naryanan_and_His_Trade_Union:0 "Contact Narayanan"
 MAL_Contact_Naryanan_and_His_Trade_Union_desc:0 "Palayil Pathazhapurayil Narayanan is an exceptionally successful trade unionist. With him in the Legislative Council, we can secure the support of the working class."
 MAL_The_Assassination_of_Henry_Gurney:0 "The Assassination of Henry Gurney"
 MAL_The_Assassination_of_Henry_Gurney_desc:0 "The communists have launched a barbaric attack that claimed the life of Sir Henry Gurney and two policemen! We must respond accordingly as well as plan a proper funeral."
 MAL_Mass_Expansion_of_UMNO:0 "Mass Expansion of UMNO"
 MAL_Mass_Expansion_of_UMNO_desc:0 "The United Malays National Organisation is a nationalist and conservative party. The bigger the party, the smaller the communists' support base."
 MAL_Accept_Multiracialism:0 "Accept Multiracialism"
 MAL_Accept_Multiracialism_desc:0 "The idea of turning Malaya into an ethnostate is dangerous and unfeasible. We need to accept the fact that this is a diverse country and work for the betterment of all Malayans."
 MAL_Malayan_Independence_Party_Bloc_55:0 "Malayan Independence Party Bloc Victory"
 MAL_Malayan_Independence_Party_Bloc_55_desc:0 "The Malayan Independence Party bloc has secured a majority in the elections."
 MAL_Maintain_Ketuanan_Melayu:0 "Maintain Ketuanan Melayu"
 MAL_Maintain_Ketuanan_Melayu_desc:0 "Malaya is a nation of Malays, not Chinese or anyone else. Malay Supremacy is a fundamental part of our policy."
 MAL_Onn_Jafars_Final_Decision:0 "Onn Jaafar's Final Decision"
 MAL_Onn_Jafars_Final_Decision_desc:0 "Onn Jaafar finds himself increasingly at odds with UMNO over certain points of their political charter. He might just leave the Party altogether."
 MAL_The_1952_Munincipal_Elections:0 "The 1952 Munincipal Elections"
 MAL_The_1952_Munincipal_Elections_desc:0 "The 1952 Municipal Elections are just around the corner. Whoever wins will have huge sway in national politics for years to come."
 MAL_Alliance_Party_Coalition_Victory:0 "Alliance Party Coalition Victory"
 MAL_Alliance_Party_Coalition_Victory_desc:0 "The coalition between the UMNO, MCA, and MIC has secured a majority in the elections."
 MAL_Solidifying_Dominant_Party_Status:0 "Solidifying Dominant Party Status"
 MAL_Solidifying_Dominant_Party_Status_desc:0 "In these times of crisis and uncertainty, political plurality is a luxury we cannot afford. For the sake of security, the Party must dominate unopposed."
 MAL_Alienate_Onn_Jafars_Supporters:0 "Alienate Onn Jaafar's Supporters"
 MAL_Alienate_Onn_Jafars_Supporters_desc:0 "We have no time for the bleeding hearts and idealists who follow  Onn Jaafar."
 MAL_Malayan_Independence_Party_Bloc:0 "Malayan Independence Party Bloc Victory"
 MAL_Malayan_Independence_Party_Bloc_desc:0 "The Malayan Independence Party bloc has secured a majority in the elections."
 MAL_Expand_the_Mass_Organizational_Party_Model:0 "Expand the Mass Organisational Party Model"
 MAL_Expand_the_Mass_Organizational_Party_Model_desc:0 "To increase our support among the people, we'll enfranchise as many as we can, regardless of race or creed."
 MAL_Attack_UNMOs_Racial_Policies:0 "Attack UNMO's Racial Policies"
 MAL_Attack_UNMOs_Racial_Policies_desc:0 "UMNO's continued insistence on Ketuanan Melayu, or ''Malay Supremacy,'' is a dangerous idea that we cannot support."
 MAL_Adopt_Currency_Ordinance_NO_44:0 "Adopt Currency Ordinance No. 44"
 MAL_Adopt_Currency_Ordinance_NO_44_desc:0 "It is time for the three sperate currencies of Malaya, Borneo, and Sarawak to be united into a single coin."
 MAL_Implement_the_Briggs_Plan:0 "Implement the Briggs Plan"
 MAL_Implement_the_Briggs_Plan_desc:0 "Communists are remarkable skilled at recruiting poor and rural people to their cause. The Briggs Plan aims to counter this by moving our rural population into ''New Villages'' designed to protect against the guerillas and deny them access to supplies."
 MAL_Expand_the_Kinta_Valley_Tin_Mines:0 "Expand the Kinta Valley Tin Mines"
 MAL_Expand_the_Kinta_Valley_Tin_Mines_desc:0 "Industrialization will require a large amount of metal and other resources. We should prospect for new veins in the Kinta Valley mines."
 MAL_Fortify_the_Rubber_Plantations:0 "Fortify the Rubber Plantations"
 MAL_Fortify_the_Rubber_Plantations_desc:0 "Rubber is a critical resource, we cannot allow it to fall into enemy hands."
 MAL_Rebuild_Malayan_Railways_Raillines:0 "Rebuild Malayan Railways"
 MAL_Rebuild_Malayan_Railways_Raillines_desc:0 "Many of the rail lines suffered damage during the Japanese invasion and occupation. We need those lines up and running in order to supply our soldiers against the communists and accelerate development."
 MAL_Expand_the_New_Villages:0 "Expand the New Villages"
 MAL_Expand_the_New_Villages_desc:0 "The New Villages are all that stand between the communists and the vulnerable rural population. We need to make them bigger, stronger, and safer."
 MAL_The_1954_Malaccan_Financial_Meeting:0 "The 1954 Malaccan Financial Meeting"
 MAL_The_1954_Malaccan_Financial_Meeting_desc:0 "We are running dangerously low on that all-important of resources, money. We need to evaluate our current economic situation and take the necessary steps."
 MAL_Found_the_Rural_and_Industrial_Authority:0 "Found the Rural & Industrial Authority"
 MAL_Found_the_Rural_and_Industrial_Authority_desc:0 "A government office dedicated to the development of our rural areas will be very beneficial."
 MAL_Expand_Rice_Production:0 "Expand Rice Production"
 MAL_Expand_Rice_Production_desc:0 "Rice is an essential part of our diet and economy. The more we have, the better."
 MAL_Begin_the_First_Five_Year_Plan:0 "Begin the First Five Year Plan"
 MAL_Begin_the_First_Five_Year_Plan_desc:0 "Despite the name being forever tainted by the communists, there is certain merit to plans for quick but efficient industrialization."
 MAL_Establish_the_Ministry_of_Finance:0 "Establish the Ministry of Finance"
 MAL_Establish_the_Ministry_of_Finance_desc:0 "The wealth of a nation should be handled only by the most qualified individuals. The Ministry of Finance will ensure just that."
 MAL_The_1956_Development_Ordinance:0 "The 1956 Development Ordinance"
 MAL_The_1956_Development_Ordinance_desc:0 "The Land Development Ordinance will establish the Federal Land Development Authority to help increase our economic output and promote further industrialization."
 MAL_Deploy_Iban_and_Dayak_Mercenaries:0 "Deploy Iban and Dayak Mercenaries"
 MAL_Deploy_Iban_and_Dayak_Mercenaries_desc:0 "Do you know what the best part about mercenaries is? Their loyalty is bought, not earned. We have money, the communists don't."
 MAL_The_Indochina_War:0 "The Indochina War"
 MAL_The_Indochina_War_desc:0 "The situation in Indochina is getting worse by the day. Nearly the whole peninsula is at war with itself whether in the name of independence or communist revolution. We need to prepare for anything that could happen."
 MAL_Support_South_Vietnam:0 "Support South Vietnam"
 MAL_Support_South_Vietnam_desc:0 "The anti-communist government in Saigon needs all the help it can get against the Ho Chi Minh and his followers."
 MAL_Accept_Cham_Muslim_Refugees:0 "Accept Cham Refugees"
 MAL_Accept_Cham_Muslim_Refugees_desc:0 "The Cham people of Indochina are suffering due to the conflict raging in the peninsula. We must take in as many of them as we can."
 MAL_Fortify_the_Thai_Border:0 "Fortify the Thai Border"
 MAL_Fortify_the_Thai_Border_desc:0 "Southern Thailand is populated mostly by Malay people, and many of them support Chin Peng's communist movement. To prevent a possible incursion from the north, we must secure and fortify the border."
 MAL_Closer_Ties_to_Washington:0 "Closer Ties to Washington"
 MAL_Closer_Ties_to_Washington_desc:0 "The United States is the strongest bulwark against communism in the world. Closer ties to Washington will help secure their support against the Reds."
 MAL_Issue_Amnesty_for_Communist_Guerilas:0 "Issue Amnesty for Communist Guerilas"
 MAL_Issue_Amnesty_for_Communist_Guerilas_desc:0 "Now is the time for rebuilding and reconciliation. Amnesty will be offered to low-ranking communist guerillas so that they may join us in building a brighter future for Malaya."
 MAL_The_Bailing_Talks:0 "The Baling Talks"
 MAL_The_Bailing_Talks_desc:0 "The Malayan Emergency has taken a severe toll on our country. It might be prudent to arrange a sit-down with Chin Peng to discuss a possible end to the conflict."
 MAL_The_Fall_of_the_Mainland:0 "The Fall of the Mainland"
 MAL_The_Fall_of_the_Mainland_desc:0 "Despite our best efforts, the communists have taken Malaya. We have no choice but to retreat and plan some way to recuperate from this disaster. "
 MAL_The_Creation_of_SEATO:0 "The Creation of SEATO"
 MAL_The_Creation_of_SEATO_desc:0 "Several Southeast Asian countries, with the help of the United States, have formed the Southeast Asia Treaty Organization. Perhaps we should consider joining them?"
 MAL_The_Korean_War:0 "The Korean War"
 MAL_The_Korean_War_desc:0 "The communists of North Korea have launched an unprovoked attack against the Republic of Korea!"
 MAL_Send_Volunteers_to_Korea:0 "Send Volunteers to Korea"
 MAL_Send_Volunteers_to_Korea_desc:0 "We must help defend against the red menace!"
 MAL_Recognize_South_Korea:0 "Recognize South Korea"
 MAL_Recognize_South_Korea_desc:0 "The Republic of Korea is the legitimate government of the Korean Peninsula. We will extend an official recognition of them and open diplomatic ties with Seoul."
 MAL_Prepare_the_Napalm:0 "Prepare the Napalm"
 MAL_Prepare_the_Napalm_desc:0 "§RBurn, burn! BURN!§"
 MAL_Embrace_Iban_Headhunting_and_Counter_Insurgency_Tactics:0 "Embrace Iban Headhunting and Counter Insurgency Tactics"
 MAL_Embrace_Iban_Headhunting_and_Counter_Insurgency_Tactics_desc:0 "Though some might consider it a savage practice, headhunting goes a long way in demoralizing the enemy. We will adopt the Iban's tactics and use them against our enemies."
 MAL_Set_Up_the_Committee_of_State_and_Federal_Elections:0 "The Committee of State & Federal Elections"
 MAL_Set_Up_the_Committee_of_State_and_Federal_Elections_desc:0 "Election fraud and corruption are the bane of any government. We will set up a committee whose job will be to guarantee our elections are free from interference."
 MAL_Host_the_1953_Round_Table:0 "Host the 1953 Round Table"
 MAL_Host_the_1953_Round_Table_desc:0 "We are on the verge of securing a political alliance between the three largest parties in Malaya. A meeting between the leaders of UNMO, MIC, and the MCA will iron out any final kinks and secure our political future."
 MAL_Arrange_Meeting_with_Rahman_and_Jafar:0 "Arrange Meeting with Rahman and Jaafar"
 MAL_Arrange_Meeting_with_Rahman_and_Jafar_desc:0 "The leaders of UMNO and the Independence Party of Malaysia need to sit down and work together to tackle the communist threat as well as find common ground in the fight for our independence."
 MAL_Alliance_Party_Coalition_Victory_55:0 "Alliance Party Coalition Victory"
 MAL_Alliance_Party_Coalition_Victory_55_desc:0 "The coalition between the UMNO, MCA, and MIC has secured a majority in the elections."
 MAL_Preperation_for_Merderka:0 "Preperation for Merderka"
 MAL_Preperation_for_Merderka_desc:0 "We cannot remain under the shadow of Britain forever. It is time to begin the preparations for our independence."
 MAL_Islamization_of_the_Bureacracy:0 "Islamization of the Bureacracy"
 MAL_Islamization_of_the_Bureacracy_desc:0 "In order to maintain social cohesion and order, we will look to Islam for guidance. Laws of morality will be adopted to ensure a safe and secure society."
 MAL_Malayization_of_the_Bureacracy:0 "Malayization of the Bureacracy"
 MAL_Malayization_of_the_Bureacracy_desc:0 "The Malay people must come first. If that comes at the expense of the Chinese and other minorities, so be it."
 MAL_Look_to_India_for_Bureacratic_Reform:0 "Look to India for Bureacratic Reform"
 MAL_Look_to_India_for_Bureacratic_Reform_desc:0 "India is a multi-ethnic, multicultural, and pluralist state. Who better to look to for guidance in the matters of governance?"
 MAL_A_Decleration_of_Independence:0 "A Decleration of Independence"
 MAL_A_Decleration_of_Independence_desc:0 "It is time for Malaysia to seek its own path, free to make its own decisions. Merdeka!"
 MAL_Adopt_Durbars_Elective_Monarchy_King_System:0 "Adopt the Durbar's Elective Monarchy System"
 MAL_Adopt_Durbars_Elective_Monarchy_King_System_desc:0 "The idea of an elective monarchy has been put forward as a compromise between the monarchists and the republicans. Although unorthodox, historical precedent and the numerous checks and balances inherent to the system make it a most interesting proposition."
 MAL_Adopt_A_Republic_Model:0 "Adopt a Republican Model"
 MAL_Adopt_A_Republic_Model_desc:0 "The time of kings and nobles has ended. Malaysia will be a republic!"
 MAL_Launch_Industrialization_Campaign:0 "Launch Industrialization Campaign"
 MAL_Launch_Industrialization_Campaign_desc:0 "It is time for Malaya to modernize. Industrialization will lead us into the future!"
 MAL_Winning_the_Hearts_and_Minds_of_All_Races:0 "Winning the Hearts & Minds of All Races"
 MAL_Winning_the_Hearts_and_Minds_of_All_Races_desc:0 "Malaysia is a country of many creeds and peoples; this is a reality that cannot be ignored. For the sake of our burgeoning state, we must all come together and step side-by-side into the future."
