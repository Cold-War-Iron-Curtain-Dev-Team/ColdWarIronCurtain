 #SWK 50's Focus Descs
 
 SWK_Form_Interim_Gov_desc:0 "With the fall of Malaya to the Communist, we need to form an interim government with the Malay government officials that fled with us to Sarawak while we plan for a return to Malaya."
 SWK_Promote_Dayak_Iban_Officials_desc:0 "Considering that the amount of government officials that came with us in exile are limited, let us fill in the gap by promoting Dayak and Iban officials to government positions."
 SWK_Expand_Council_Negri_desc:0 "As we set up our interim government, let us also expand our legislature, the Council Negri to ensure that it can represent our constituents in Sarawak."
 SWK_Finish_New_Constitution_desc:0 "In order to legitimize our government in Sarawak, we need to finish drafting our constitution to establish the rule of laws once and for all."
 SWK_First_Sarawakian_Elections_desc:0 "Since we have completed setting up a stable government in Sarawak, let us host the first election and choose a Prime Minister to represent our nation."
 
 SWK_PM_Tunku_Abdul_Rahman_desc:0 "Tunku Abdul Rahman, a well-known Malay politician even before our government relocated to Sarawak, has been elected as Prime Minister."
 SWK_East_Malaysian_Federation_desc:0 "While we have established our stronghold in Sarawak, we must reach out to other Malay states that haven't fallen to Communist control and form an East Malaysian Federation against any threats that come to us."
 SWK_Strengthen_Western_Ties_desc:0 "In order to ensure that our government can withstand against the communist threats, we must strengthen ties with western nations such as America and Britain to maintain international support."
 SWK_Joining_SEATO_desc:0 "Besides support from Western nations, we should also look for allies from nearby nations that share our goals of anti-communism by joining SEATO."
 SWK_Relocate_Exiled_Gov_desc:0 "While Kuching has all of the infrastructure needed to host a government, it would be inconvenient to share the city with the regional Sarawakian government. Let us relocate to a new capital where we can maintain the Malayan government in exile."
 SWK_Coast_Fortification_desc:0 "In order to prevent any upcoming invasion from Communist Malaya, we must fortify our coast to ensure no Communist infiltrators could get in and cause havoc in Sarawak."
 SWK_Resume_Oil_Trade_desc:0 "Since Britain and America need oil more than ever, let us tap our local oil supply and resume oil trade to ensure our relations with the British and the Americans alike."
 SWK_Promote_Unified_Malayan_Culture_desc:0 "In order to promote a common identity among the diverse group of people in our nation, we must promote a unified Malayan culture to ensure unity among Malay, Chinese, and the locals of Sarawak alike."
 SWK_Improve_Native_Living_Conditions_desc:0 "While planning to retake Malaya is our number one goal, we should also maintain support in the home front. By improving the local Sarawakians' living conditions, we could ensure support and additional manpower in our quest to retake Malaya."
 SWK_Promote_Muslim_Faith_desc:0 "Considering that Chin Peng and the Communists are cracking down on our fellow Muslim compatriots in Malaya, let us promote Islam in our nation to let our fellow Malays know that we are a safe haven for those that want to escape the Communist to freely practice their faith."
 SWK_Broadcast_AntiCommunist_Prop_desc:0 "Besides offering Sarawak as a safe haven for refugees, we should also broadcast anti-communist propaganda in Malaya to ensure support within Malaya for our upcoming mission to reunify Malaysia once and for all."
 
 SWK_Rajah_Anthony_desc:0 "Anthony Brooke, heir to the former White Rajah of Sarawak, has been elected as Prime Minister."
 SWK_Adopt_Parliamentary_System_desc:0 "Considering that many former British colonies continue to use the parliamentary system, it should be natural for us to adopt it for our own government too."
 SWK_Strengthen_Commonwealth_Ties_desc:0 "As a former British colony, we should strengthen ties with Commonwealth nations to ensure British and international support."
 SWK_Strengthen_Asian_Ties_desc:0 "Besides the British, let us not forget our allies within Asia. We should reach out to them to increase our ties."
 SWK_Expand_Astana_desc:0 "Since the Astana's Negeri Palace is currently underdeveloped, we need to expand it for a palace worthy of any prime ministers of Sarawak."
 SWK_Modernize_Kuching_desc:0 "While Kuching is our current capital, it is still underdeveloped. Let us begin the modernization campaign of Kuching."
 SWK_Electrify_Land_desc:0 "As part of our modernization program, we should electrify our land to bring modernity to Sarawak."
 SWK_Promote_Sarawakian_Culture_desc:0 "The Brooke family has been the protector of the local cultures of Sarawak since they became Rajah of Sarawak. Let us continue this practice in order to please the people of Sarawak."
 SWK_Promote_Racial_Equality_desc:0 "Considering that we also have other ethnic groups living in Sarawak asides from the Malays, let us promote racial equality to ensure everyone is included in our nation."
 SWK_Promote_Decentralization_desc:0 "Since Sarawak is culturally different than Malaya, let us promote decentralization to ensure the Sarawakians have autonomies in their own land."
 SWK_Stabilize_Lands_desc:0 "Since we have cemented our control in Sarawak, let us also stabilize land control within our nation as well."
 
 SWK_PM_Openg_Abang_desc:0 "Openg Abang, a local politician of Sarawak, has been elected as the Prime Minister of Sarawak."
 SWK_Sarawakian_Republic_desc:0 "Instead of claiming ourselves to be the legitimate government of Malaya in exile, let us instead proclaim ourselves as the Republic of Sarawak and detach ourselves from Malaya."
 SWK_Promote_Neutrality_desc:0 "Considering that our involvement with the West is what gets us in trouble with the Communist in the first place, let us instead be a neutral nation to ensure that nobody can invade us."
 SWK_Emulate_Australian_Federal_Model_desc:0 "Since Sarawak is a diverse place, the Australian federal model would be a good example of a government we can emulate to ensure everyone in Sarawak gets local representation."
 SWK_Building_New_Parliament_Building_desc:0 "The current state of the current parliament will not do as a place where our MPs gather. Let us build a new parliament fitting for a modern Sarawak."
 SWK_Modernize_Coastal_Areas_desc:0 "Currently, most of the coastal areas outside of Kuching consist of underdeveloped towns and villages. Let us modernize the coast to bring the rest of Sarawak to modern living standard."
 SWK_Land_Electrification_desc:0 "As part of our modernization program, we should electrify our land to bring modernity to Sarawak."
 SWK_Sarawakian_Culture_Promotion_desc:0 "The Brooke family has been the protector of the local cultures of Sarawak since they became Rajah of Sarawak. Let us continue this practice in order to please the people of Sarawak."
 SWK_Racial_Equality_Promotion_desc:0 "Considering that we also have other ethnic groups living in Sarawak asides from the Malays, let us promote racial equality to ensure everyone is included in our nation."
 SWK_Promote_State_Secularism_desc:0 "Since Sarawak is not majority Muslim, let us promote state secularism in our nation to ensure that everyone can have the freedom of religion."
 SWK_Land_Stabilization_desc:0 "Since we have cemented our control in Sarawak, let us also stabilize land control within our nation as well."
 
 SWK_Worst_Case_Scenario_desc:0 "It seems that the worse case scenario of the Communist takeover of Malaya has happened. We must prepare ourselves for the reconquest of Malaya."
 SWK_Integrate_Exiled_MAL_Officers_Assets_desc:0 "Considering that our situation is dire, let us incorporate assets from exiled Malayan officers in our fight against the Communist."
 SWK_Recruit_Gerald_Templar_desc:0 "Gerald Templar, a British known for his expertise in fighting the Communist, could be of use to us. Let us recruit him to help train our army in fighting against the Communist."
 SWK_Setup_Curfews_Rations_desc:0 "In order to prevent people from hoarding supplies or supplies from falling to the Communists, we need to implement rations and curfews to prevent these problems from occuring."
 SWK_Perfect_Counter_Insurgency_Tactics_desc:0 "Since there are still Communist insurgents in Sarawak, we need to perfect counter insurgency tactics to minimize Communist infiltrations in our nation."
 SWK_Implement_Strat_Hamlets_desc:0 "Since the Communists are known for blending into the local population, we should implement strategic hamlets to isolate loyal populations from Communist insurgents."
 SWK_Promote_AntiCommunist_Lynchings_desc:0 "While our army is doing their part in rooting out Communists, we should also promote anti-communist lynchings within our loyal populace to help root out any Communists still residing in Sarawak."
 SWK_Raid_Mainland_desc:0 "In order to show our presence to the Communist, we should begin our raid in Malaya to make them fear us."
 SWK_Winning_Hearts_And_Minds_desc:0 "While terror is one way to intimidate the locals from supporting the Communists, we should also win their hearts and minds to by spreading anti-communist propagandas in Sarawak"
 SWK_Kindly_Treat_Natives_desc:0 "Besides propagandas, we should also set up examples of our benevolent rule by treating the natives kindly to prevent them from falling into the Communists' hands."
 SWK_Promote_InterRacial_Equality_desc:0 "Considering the diverse population of Sarawak, we should promote equality within the different ethnic groups within Sarawak to ensure we have a united front against the Communists."
 SWK_Permit_Labor_Reforms_desc:0 "In order to get the locals to our side, we should allow labor reforms in Sarawak to gain supports from the locals."
 SWK_Full_Bellies_Big_Smiles_desc:0 "We should establish a food aid program to ensure that no one in Sarawak is hungry and continue their support for our government."
 SWK_Broadcast_Reconciliation_Messages_desc:0 "Besides the people of Sarawak, there are still people in Malaya that supports our causes. Let us broadcasts reconciliation messages to ensure they still support us despite being under the Communists."
 
 SWK_Establish_Sarawak_Armed_Forces_desc:0 "Considering that the military of Sarawak is underdeveloped, let us establish the Sarawak Armed Forces as a professional army of our nation."
 SWK_Recruit_Native_Sarawakians_desc:0 "As the amount of exiled Malay population that accompanied us is low, we should also begin recruiting the native Sarawakians in our armed forces as well."
 SWK_Form_Sarawak_Navy_desc:0 "We need to establish a Sarawak Navy to ensure our coast is secured from the Communists."
 SWK_Beg_UK_Transfer_Old_Ships_desc:0 "Since we do not have any ships of our own, we should ask the United Kingdom to transfer their old ships to us for our navy."
 SWK_Expand_Sarawak_Steamship_Company_desc:0 "Besides ships for our navy, we should also expand the Sarawak Steamship Company to ensure a constant supply of local ships in our nation."
 SWK_Incorporate_Constabulary_desc:0 "As part of our efforts in fighting against the Communists, we should incorporate the Constabulary of Sarawak into our forces for extra helps in rooting out local Communist insurgents."
 SWK_Form_Special_Branch_desc:0 "Considering that there are potential insurgent forces hiding in Sarawak, let us form the Special Branch as the intelligence agency dedicated to rooting out any Communists that are still in Sarawak."
 SWK_Expand_Sikh_Divisions_desc:0 "The Sikh Divisions are known for their fierce fighting skills and their loyalty. Let us expand the Sikh Divisions to ensure the Communists will not mess with us."
 SWK_Fortifying_Urban_Areas_desc:0 "The urban areas are susceptible to destruction during warfare. Let us fortify the urban areas to minimize destructions during pitched battles and sieges."
 SWK_Expand_Sarawak_Rangers_desc:0 "The Sarawak Rangers are useful in helping us fight in the jungles. Let us expand them to effectively use their expertise against the Communist."
 SWK_Organize_Iban_Trackers_desc:0 "Besides the rangers, the local Iban trackers know the terrains better than we do. Let us organize dedicated Iban trackers to help us fight in the local jungles."
 SWK_Emulate_Australian_Army_Model_desc:0 "We should look to the Australian Army as a model for our army in our effort to fight against the Communist."
 SWK_Outlaw_Headhunting_desc:0 "The tradition of headhunting is barbaric and has no place in the modern world. Let us outlaw it once and for all."
 SWK_Allow_Headhunting_desc:0 "While the tradition of headhunting is barbaric, it is a necessary evil. We should turn a blind eye so that the locals can continue such tradition to strike fear into the Communists' heart."
 SWK_Modernize_Arsenal_desc:0 "Our arsenal is currently full of outdated equipments. Let us update them for a modern army."
 SWK_Perfect_Jungle_Warfare_desc:0 "As we continue our training in jungle warfare, let us perfect it so we can prepare ourselves in any situations involving fighting in the jungles."
 SWK_Form_Sarawak_AirForce_desc:0 "Since we do not have an air force, let us form one to help us fight against the Communists."
 SWK_Beg_UK_Transfer_Old_Planes_desc:0 "We should ask the United Kingdom for old planes that they no longer use to help set up our air force."
 SWK_Establish_Kuching_Air_Base_desc:0 "Since we now have an air force, let us establish an air base in Kuching."
 
 SWK_Support_Gerald_MacBryan's_Ambition_desc:0 "The Rajah's former Secretary Gerald MacBryan has claimed the Throne of Brunei, we will support his ambitions and right to the Throne."
 SWK_Contact_The_British_desc:0 "We shall attempt to contact His Majesty's Government to help advocate MacBryan's succession to the Brunei Throne."
 SWK_Solidify_MacBryan's_Regency_desc:0 "By supporting MacBryan's Regency we will help solidify him as the new Sultan of Brunei."
 SWK_Arrange_MacBryan's_Coronation_desc:0 "It is finally time to Coronate MacBryan, his Ascension to the Throne will help unify the people of Borneo and counter any Communist infiltration."
 SWK_Annex_Brunei_desc:0 "The Unification of Borneo's Muslim majority regions under one single state will undoubtedly ensure prosperity and stability."

#### SWK Ideas
 SWK_Jungle_Warfare:0 "Jungle Warfare"
#### Malaysia/Singapore Equipment Names ####

 ########### MAL INFANTRY
 
 MAL_infantry_equipment_0:0 "Lee–Enfield Rifle, No. 5 Mk I, Jungle Carbine"
 MAL_infantry_equipment_0_short:0 "Rifle No. 5 Mk I"
 MAL_infantry_equipment_0_desc:0 "The Jungle Carbine was a lightweight, shortened version of the British Lee–Enfield No. 4 Mk I, chambered in .303 British. Developed during World War II for jungle warfare, it was about 100mm (3.9 inches) shorter and nearly a kilogram (2.2 pounds) lighter than the standard rifle. \nThe rifle featured a rubber buttpad, which helped with grip but increased recoil with Its iron sights were designed for both close-range and longer distances, making it ideal for maneuverability in dense terrain. Produced between 1944 and 1947, the Jungle Carbine was favored for its effectiveness in jungle combat."

 MAL_infantry_equipment_1:0 "L1A1 Self-Loading Rifle"
 MAL_infantry_equipment_1_short:0 "L1A1 SLR"
 MAL_infantry_equipment_1_desc:0 "L1A1 Self-loading Rifle is a British variant of the FN FAL, a 7.62x51mm NATO battle rifle. Known for its durability and reliability, the L1A1 was widely used by Commonwealth nations during the Cold War. In Malaysia, it saw extensive service with the Malaysian Royal Army during the Malayan Emergency and Konfrontasi periods, where its semi-automatic fire and long-range accuracy proved effective in jungle warfare. The L1A1 was prized for its ruggedness in harsh conditions and remained in Malaysian military service until the 1980s when it was replaced by more modern rifles."

 MAL_infantry_equipment_2:0 "SME Ordnance M-16"
 MAL_infantry_equipment_2_short:0 "M-16"
 MAL_infantry_equipment_2_desc:0 "The Malaysian M-4 Carbine is a locally produced version of the American Colt M4 Carbine, a lightweight, 5.56x45mm NATO assault rifle. Manufactured by SME Ordnance ,this carbine is used by the Malaysian Armed Forces and special operations units. With its shorter barrel and compact design, the M-4 is ideal for close-quarters combat and urban operations. It offers both semi-automatic and fully automatic firing modes, making it versatile for a range of missions. The Malaysian M-4 has become a staple in the country’s modernization of its military forces."

 MAL_infantry_equipment_3:0 "SME Ordnance M-4 Carbine"
 MAL_infantry_equipment_3_short:0 "M-4 Carbine"
 MAL_infantry_equipment_3_desc:0 "The U.S. Army XM16E1 was essentially the same weapon as the M16 with the addition of a forward assist and corresponding notches in the bolt carrier. The M16A1 was the finalized production model in 1967 and was produced until 1982. To address issues raised by the XM16E1's testing cycle, a closed, bird-cage flash suppressor replaced the XM16E1's three-pronged flash suppressor which caught on twigs and leaves. Various other changes were made after numerous problems in the field. Cleaning kits were developed and issued while barrels with chrome-plated chambers and later fully lined bores were introduced."

 MAL_infantry_equipment_4:0 "Carbine, Caliber 5.56 mm, M4 "
 MAL_infantry_equipment_4_short:0 "M4 Carbine"
 MAL_infantry_equipment_4_desc:0 "The M4 carbine is a further improvement on the M16A2. It was initially commissioned to be designed by a large ad-hoc team of designers in 1984 and development finished in 1993. After 9 years in development, hopefully it would have been worth the wait. It features a greater level of reliability and is much lighter and shorter. Mostly due to improved materials, it is more accurate than the M16A2. Its compact size makes it more versatile and easier to operate than the M16A2. The M4 carbine has seen combat in the US war in Afghanistan, the Iraq war, and in the war against ISIS."

