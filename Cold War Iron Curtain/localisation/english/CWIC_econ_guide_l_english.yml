l_english:
 cwic_econ_guide_button_tt:0 "§YEconomy Guide§!\nA short guide to this window: what the numbers mean and what to do when things go wrong."
 cwic_domestic_pool_tt:0 "§YDomestic Commercial Lenders§!\nYour own banks lend from a pool funded by your §YOffice Parks§!.\n\nOffice Parks: §Y[?office_park_total|0]§!\nEach park supports §Y10B§!, times §Y[?office_park_tech|2]§! from office technology\nPool limit: §Y$[?outcrowding_limit|1]B§!\nAvailable now: §C$[?available_liquidity|2]B§!\n\nBorrowing draws the pool down. Below the limit it refills each month by §Y3.5%§!-§Y6.5%§! of the limit, faster for small pools. Build Office Parks to borrow more at home."

 cwic_econ_guide.close:0 "Close the guide"
 cwic_econ_guide.back:0 "Back to contents"

 cwic_econ_guide.1.t:0 "Economy Guide"
 cwic_econ_guide.1.d:0 "Every country runs on a budget. Each month taxes and other income come in, spending and debt payments go out, and the difference lands in your treasury. The International Finance window shows how that is going and gives you the tools to steer it.\n\nYou do not need to manage everything. Watch three things: the §YBudget Balance§! in the top bar, monthly inflation, and the crisis alert. When one of them turns bad, this guide tells you where to look.\n\nPick a topic."
 cwic_econ_guide.1.a:0 "Reading the Fiscal Overview"
 cwic_econ_guide.1.b:0 "Taxes and spending"
 cwic_econ_guide.1.c:0 "Inflation and the black market"
 cwic_econ_guide.1.e:0 "Economic crises"
 cwic_econ_guide.1.f:0 "Borrowing and debt"
 cwic_econ_guide.1.g:0 "Economic Policy and foreign capital"

 cwic_econ_guide.2.t:0 "Reading the Fiscal Overview"
 cwic_econ_guide.2.d:0 "§YEconomic System§! (top left) is the kind of economy you run. It sets which taxes, policies and conversions are open to you.\n\n§YCredit Rating§! (the letter, top right) runs from §GAAA§! down to §RD§!. A better rating means a lower §YInterest Rate§! on new loans. At §YB§! or worse you are in a credit crisis.\n\n§YGDP Graph§! is the size of your economy. A falling line is a contraction.\n\n§YDebt-GDP Graph§! is your debt compared to the economy. Rising debt is fine while GDP grows faster; it becomes a problem when payments start eating the budget.\n\n§YWorkforce Data§! shows who works where. Use it to see why GDP moves, not to manage day to day."

 cwic_econ_guide.3.t:0 "Taxes and Spending"
 cwic_econ_guide.3.d:0 "The §YFiscal Policy§! tab holds the sliders. Each change costs §Y15§! Political Power.\n\n§YTaxes§! come in four brackets, from the lower class up to the upper class, in §Y5%§! steps. Higher taxes bring in more money but can slow the economy.\n\n§YSpending§! covers civilian services (healthcare, welfare, education, policing, public services) and the military (army, navy, air force, strategic forces, space). Each costs money every month.\n\nIf you spend more than you earn, your treasury runs down. When it runs out, the government borrows automatically from any lender with money to spare. That is convenient but it adds debt. A deficit above §Y4%§! of GDP causes a fiscal crisis.\n\nRule of thumb: keep the Budget Balance in the top bar near zero or positive in peacetime, and accept a deficit only for wars and big building programmes."

 cwic_econ_guide.4.t:0 "Inflation and the Black Market"
 cwic_econ_guide.4.d:0 "§YMonthly Inflation§! is how fast prices rise. A little is normal. Above §Y0.75%§! a month (about 9% a year) it becomes an inflation crisis.\n\n§YBlack Market Pressure§! is how much trade escapes the official economy. Above §Y25%§! it also counts as an inflation crisis.\n\nBoth are on the §YCrisis View§!, and the tools are on the §YEconomic Policy§! page:\n- §YMoney printing§! fills the treasury but raises inflation and black market pressure.\n- §YMonetary Tightening§!, §YCapital Controls§!, §YPrice Controls§! and §YDual Exchange Rates§! cut inflation. Most raise black market pressure and cost Productivity every month, so lift them once inflation is under control.\n- §YRaids§!, an §YEnforcement Campaign§! or an §YAmnesty§! bring black market pressure down.\n- §YCurrency Reform§! is the emergency reset.\n\nHover any button to see its exact cost and effects before you click."

 cwic_econ_guide.5.t:0 "Economic Crises"
 cwic_econ_guide.5.d:0 "A crisis starts when part of the economy crosses a danger line: too much deficit, too much inflation, too little power, too little food, and so on. Each crisis has a severity from §YLow§! to §RExtreme§! and gives penalties that grow with it.\n\nWhen a crisis is active, the §Rcrisis alert§! appears in the top bar. Click it to open the §YCrisis View§!. Right-click it to hide it until a new crisis starts or one gets worse.\n\nOn the Crisis View, §YActive Crises§! are hurting you now and §YPotential Crises§! are what could happen next. Hover an active crisis to see:\n- what would make it worse,\n- its current penalties,\n- §YRecommended Levers§!: what you can do about it.\n\nTwo or more crises together can form a §Ycompound crisis§!, such as stagflation or a debt trap. End one of the crises it is built from and the compound crisis ends too."

 cwic_econ_guide.6.t:0 "Borrowing and Debt"
 cwic_econ_guide.6.d:0 "The §YBorrowing§! tab lists who will lend to you and on what terms.\n\n§YDomestic Commercial Lenders§! are your own banks. How much they can lend depends on your §YOffice Parks§!: each park adds §Y10B§! to the pool. Hover their row for the details.\n\n§YPrivate Creditors§! and other foreign lenders have their own limits. Your §YCredit Rating§! sets the interest you pay everywhere.\n\nThe §YCurrent Debts§! tab lists every loan, what you still owe and the monthly payment.\n\nDebt is a tool, not a failure. It turns dangerous when payments pass §Y5%§! of GDP (a fiscal crisis), when the treasury cannot cover this month's payments (a credit crisis), or when lenders lock you out. Borrow for things that grow the economy, and pay down debt in good years."

 cwic_econ_guide.7.t:0 "Economic Policy and Foreign Capital"
 cwic_econ_guide.7.d:0 "Open the §YBorrowing§! tab, then press §YEconomic Policy§! in the same spot to reach this page.\n\n§YMonetary§! and §YMarkets & FX§! hold the inflation, currency and black market tools. The coloured strip on each button is its type: §Bblue§! expands, §Oorange§! restricts, §Yyellow§! is a structural change, §Rred§! is drastic and §ggrey§! reverts an earlier measure.\n\n§YEconomic System§! lets you convert to a rentier, petrostate or normal economy when you qualify.\n\n§YForeign Capital§! invites foreign companies to invest, sector by sector. Press §YBrowse§! on a sector, pick a company, and pay §Y25§! Political Power to invite it or §Y50§! for a concession. A month or so later the company answers with an event. Each company that settles raises the sector's presence tier and adds its own bonus. Planned economies must first §YAuthorize Foreign Concessions§!. Too much nationalization pressure scares companies away.\n\nCountries fighting an insurgency see a reduced window until the insurgency ends."
