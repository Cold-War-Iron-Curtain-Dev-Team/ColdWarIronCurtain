###Focuses###

ICE_Icelands_Place_In_Cold_War:0 "Iceland's Place In The Cold War"
ICE_Icelands_Place_In_Cold_War_desc:0 "Although officially aligning ourselves with the United States and their military alliance proved a divisive move at home, the communist coup in Czechoslovakia showed us that there's no guarantee the great powers shall respect our neutral global stance. To protect our democratic freedoms American protection must be kept close, but permitting servitude to stars and stripes won't be any better. We must consider our future carefully and tread accordingly."
ICE_Market_Town_Land_Reform:0 "Utilize Culvitable Land In Market Towns"
ICE_Market_Town_Land_Reform_desc:0 "Ours is a nation with limited space that can be allocated to farming, requiring farming space to be used to it's full potential. A new law signed in by the prime minister will allow the central government to allocate arable land in more populated areas to agriculture and other areas as deemed necessary."
ICE_Fruits_Of_Inflation_Control:0 "Fruits of Focused Inflation Control"
ICE_Fruits_Of_Inflation_Control_desc:0 "Despite our economy stagnating since the end of the war the coalition government's careful economic planning has managed to keep us afloat. Headed by the People's Party, this carefully checked bookkeeping along with financial support provided by the Marshall Plan allowed us to have greater economic capability than we normally would've had."
