###Events###

ICE_elections.1.d:0 "With the coming of the elections the coalition that ruled the nation before and since the end of the war finally disbands. With the memory of the anti-NATO riot still fresh on minds the question of re-militarization and Cold War involvement, among other issues such as the worsening economy and fishing rights, is expected to be deciding factors for the populace. The parliamentary seats will be fought for by the 4 main parties:\n\nThe liberal conservative Independence Party. Largest party in the parliament and successor of the political parties of the kingdom period.\n\nThe agrarian Progressive Party. Representing the rural population and positioning themselves in the center, they're close supporters of the Independence Party.\n\nThe social democratic People's Party. Popular among the urban populace for its pro-worker and pro-welfare policies, they offer a more western aligned alternative to socialists. They've led the coalition in its last years.\n\nThe socialist People's Unity Party - Socialist Party. Formed after the merger of Communist Party of Iceland with the radical elements within the People's Party; they're staunchly against NATO participation and American presence on the island, instead promoting warmer relations with the Eastern Bloc."

