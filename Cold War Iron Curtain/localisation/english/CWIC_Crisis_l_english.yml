### CROP FAILURE
 cwic_crisis_crop_failure_low:0 "Crop Failure"
 cwic_crisis_crop_failure_low_desc:0 "Agricultural output has declined, reducing food supply."

 cwic_crisis_crop_failure_medium:0 "Agricultural Crisis"
 cwic_crisis_crop_failure_medium_desc:0 "Significant crop losses are impacting food production and economic stability."

 cwic_crisis_crop_failure_high:0 "Severe Crop Failure"
 cwic_crisis_crop_failure_high_desc:0 "Major agricultural losses are disrupting food systems and productivity."

 cwic_crisis_crop_failure_extreme:0 "Agricultural Collapse"
 cwic_crisis_crop_failure_extreme_desc:0 "Agricultural production has collapsed, severely impacting the economy and society."


### FOOD / FAMINE
 cwic_crisis_food_security_famine_low:0 "Food Shortages"
 cwic_crisis_food_security_famine_low_desc:0 "Food supply pressures are beginning to affect stability and consumption."

 cwic_crisis_food_security_famine_medium:0 "Food Crisis"
 cwic_crisis_food_security_famine_medium_desc:0 "Food shortages are reducing productivity and increasing instability."

 cwic_crisis_food_security_famine_high:0 "Famine Conditions"
 cwic_crisis_food_security_famine_high_desc:0 "Severe food shortages are impacting workforce and national stability."

 cwic_crisis_food_security_famine_extreme:0 "Famine Catastrophe"
 cwic_crisis_food_security_famine_extreme_desc:0 "Widespread famine is devastating productivity, stability, and population health."

### CREDIT
 cwic_crisis_financial_credit_low:0 "Credit Tightening"
 cwic_crisis_financial_credit_low_desc:0 "Access to capital is becoming more limited, slowing investment."

 cwic_crisis_financial_credit_medium:0 "Credit Crunch"
 cwic_crisis_financial_credit_medium_desc:0 "Restricted lending is reducing economic activity and industrial expansion."

 cwic_crisis_financial_credit_high:0 "Financial Crisis"
 cwic_crisis_financial_credit_high_desc:0 "The financial system is under strain, severely limiting access to capital."

 cwic_crisis_financial_credit_extreme:0 "Financial Collapse"
 cwic_crisis_financial_credit_extreme_desc:0 "Credit markets have broken down, crippling investment and economic stability."

 ### DEBT TRAP
 cwic_compound_debt_trap_low:0 "Rising Debt Burden"
 cwic_compound_debt_trap_low_desc:0 "Growing debt obligations are beginning to constrain investment and economic flexibility."

 cwic_compound_debt_trap_medium:0 "Debt Trap"
 cwic_compound_debt_trap_medium_desc:0 "Debt servicing costs are limiting economic policy and reducing long-term growth potential."

 cwic_compound_debt_trap_high:0 "Severe Debt Trap"
 cwic_compound_debt_trap_high_desc:0 "High debt burdens are crowding out investment and weakening economic stability."

 cwic_compound_debt_trap_extreme:0 "Debt Crisis"
 cwic_compound_debt_trap_extreme_desc:0 "Unsustainable debt levels are crippling economic management and restricting all policy options."

### COLLAPSE SPIRAL
 cwic_compound_collapse_spiral_low:0 "Systemic Strain"
 cwic_compound_collapse_spiral_low_desc:0 "Multiple pressures are beginning to interact, weakening governance and economic performance."

 cwic_compound_collapse_spiral_medium:0 "Crisis Feedback Loop"
 cwic_compound_collapse_spiral_medium_desc:0 "Interconnected crises are reinforcing one another, accelerating economic decline."

 cwic_compound_collapse_spiral_high:0 "Collapse Spiral"
 cwic_compound_collapse_spiral_high_desc:0 "Economic, political, and social systems are deteriorating together, deepening instability."

 cwic_compound_collapse_spiral_extreme:0 "Systemic Collapse"
 cwic_compound_collapse_spiral_extreme_desc:0 "The state and economy are in cascading failure, with institutions and productivity rapidly breaking down."

 ### ENERGY-INDUSTRIAL SHOCK
 cwic_compound_energy_industrial_shock_low:0 "Industrial Energy Strain"
 cwic_compound_energy_industrial_shock_low_desc:0 "Energy constraints are beginning to limit industrial output and efficiency."

 cwic_compound_energy_industrial_shock_medium:0 "Energy-Industrial Disruption"
 cwic_compound_energy_industrial_shock_medium_desc:0 "Energy shortages are disrupting industrial production and slowing economic activity."

 cwic_compound_energy_industrial_shock_high:0 "Severe Energy-Industrial Shock"
 cwic_compound_energy_industrial_shock_high_desc:0 "Major energy constraints are significantly reducing industrial capacity and productivity."

 cwic_compound_energy_industrial_shock_extreme:0 "Industrial Breakdown"
 cwic_compound_energy_industrial_shock_extreme_desc:0 "Energy failure is crippling industrial output and halting economic activity across sectors."


### FAMINE SPIRAL
 cwic_compound_famine_spiral_low:0 "Food System Strain"
 cwic_compound_famine_spiral_low_desc:0 "Food shortages are beginning to reduce productivity and stability."

 cwic_compound_famine_spiral_medium:0 "Food Crisis Spiral"
 cwic_compound_famine_spiral_medium_desc:0 "Food shortages are reinforcing economic decline, weakening workforce productivity."

 cwic_compound_famine_spiral_high:0 "Famine Spiral"
 cwic_compound_famine_spiral_high_desc:0 "Severe food shortages are driving instability, reducing labor capacity and economic output."

 cwic_compound_famine_spiral_extreme:0 "Famine Catastrophe"
 cwic_compound_famine_spiral_extreme_desc:0 "Widespread famine is devastating the population, collapsing productivity and economic stability."

 ### AUSTERITY TRAP
 cwic_compound_austerity_trap_low:0 "Fiscal Tightening"
 cwic_compound_austerity_trap_low_desc:0 "Spending cuts are beginning to slow growth and reduce productivity."

 cwic_compound_austerity_trap_medium:0 "Austerity Measures"
 cwic_compound_austerity_trap_medium_desc:0 "Efforts to reduce deficits are suppressing economic activity and investment."

 cwic_compound_austerity_trap_high:0 "Austerity Trap"
 cwic_compound_austerity_trap_high_desc:0 "Fiscal tightening is reinforcing economic stagnation, limiting recovery potential."

 cwic_compound_austerity_trap_extreme:0 "Entrenched Austerity"
 cwic_compound_austerity_trap_extreme_desc:0 "Severe austerity has crippled growth, reducing productivity and economic resilience."