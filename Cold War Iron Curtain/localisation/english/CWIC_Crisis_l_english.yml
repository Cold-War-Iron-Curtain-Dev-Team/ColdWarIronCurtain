### GOVERNANCE
 cwic_crisis_governance_institutional_low:0 "Institutional Weakness"
 cwic_crisis_governance_institutional_low_desc:0 "Government institutions are showing signs of inefficiency and instability."

 cwic_crisis_governance_institutional_medium:0 "Governance Crisis"
 cwic_crisis_governance_institutional_medium_desc:0 "Institutional dysfunction is weakening economic management and state capacity."

 cwic_crisis_governance_institutional_high:0 "Severe Governance Breakdown"
 cwic_crisis_governance_institutional_high_desc:0 "State institutions are failing to effectively manage the economy and maintain stability."

 cwic_crisis_governance_institutional_extreme:0 "State Collapse"
 cwic_crisis_governance_institutional_extreme_desc:0 "Institutional failure has crippled governance, severely undermining economic and political stability."


 cwic_crisis_trade_external_shock_low:0 "External Trade Shock"
 cwic_crisis_trade_external_shock_low_desc:0 "Disruptions in trade are beginning to affect economic performance."

 cwic_crisis_trade_external_shock_medium:0 "Trade Disruption"
 cwic_crisis_trade_external_shock_medium_desc:0 "Reduced trade flows are weakening productivity and industrial output."

 cwic_crisis_trade_external_shock_high:0 "Severe Trade Shock"
 cwic_crisis_trade_external_shock_high_desc:0 "Major trade disruptions are significantly damaging economic activity."

 cwic_crisis_trade_external_shock_extreme:0 "Trade Collapse"
 cwic_crisis_trade_external_shock_extreme_desc:0 "The external trade system has broken down, severely undermining the economy."

 cwic_governance_stress_t1:0 "Governance Stress I"
 cwic_governance_stress_t1_desc:0 "Foreign corporate pressure is beginning to strain domestic institutions."

 cwic_governance_stress_t2:0 "Governance Stress II"
 cwic_governance_stress_t2_desc:0 "Elite capture and local backlash are weakening the state."

 cwic_governance_stress_t3:0 "Governance Stress III"
 cwic_governance_stress_t3_desc:0 "Corporate influence and extractive backlash are producing visible governance decline."

 cwic_governance_stress_t4:0 "Governance Stress IV"
 cwic_governance_stress_t4_desc:0 "Political authority is under severe strain from corporate penetration and social backlash."

 cwic_governance_stress_t5:0 "Governance Stress V"
 cwic_governance_stress_t5_desc:0 "The state is entering a crisis of legitimacy driven by foreign influence and domestic unrest."

 cwic_crisis_fiscal_low:0 "Fiscal Stress"
 cwic_crisis_fiscal_low_desc:0 "Government finances are tightening as revenue struggles to keep pace with expenditures. Budget pressure is beginning to affect public investment and policy flexibility."

 cwic_crisis_fiscal_medium:0 "Fiscal Strain"
 cwic_crisis_fiscal_medium_desc:0 "The state is increasingly constrained by its fiscal position. Rising obligations and declining fiscal flexibility are beginning to erode economic confidence."

 cwic_crisis_fiscal_high:0 "Severe Fiscal Crisis"
 cwic_crisis_fiscal_high_desc:0 "Public finances are under severe pressure. Investment and development are slowing as the government struggles to maintain fiscal stability."

 cwic_crisis_fiscal_extreme:0 "Fiscal Breakdown"
 cwic_crisis_fiscal_extreme_desc:0 "The state faces a profound fiscal breakdown. Public spending pressures, debt burdens, and weak revenue capacity are crippling the government’s ability to manage the economy."


 cwic_crisis_economic_contraction_low:0 "Economic Slowdown"
 cwic_crisis_economic_contraction_low_desc:0 "Economic activity has begun to slow. Businesses are cautious and investment is weakening, though the broader economy remains functional."

 cwic_crisis_economic_contraction_medium:0 "Economic Contraction"
 cwic_crisis_economic_contraction_medium_desc:0 "The economy is shrinking as investment declines and productivity weakens. Employment conditions are deteriorating."

 cwic_crisis_economic_contraction_high:0 "Severe Recession"
 cwic_crisis_economic_contraction_high_desc:0 "Production and employment are declining rapidly. Economic confidence has eroded, deepening the contraction."

 cwic_crisis_economic_contraction_extreme:0 "Economic Collapse"
 cwic_crisis_economic_contraction_extreme_desc:0 "The economy is in freefall. Investment, employment, and productivity are collapsing under severe structural pressure."


 cwic_crisis_inflation_low:0 "Rising Inflation"
 cwic_crisis_inflation_low_desc:0 "Prices are rising across the economy, placing growing pressure on households and businesses."

 cwic_crisis_inflation_medium:0 "Inflationary Pressure"
 cwic_crisis_inflation_medium_desc:0 "Inflation is spreading through wages and consumer prices. Economic stability is increasingly threatened."

 cwic_crisis_inflation_high:0 "Severe Inflation"
 cwic_crisis_inflation_high_desc:0 "Rapid inflation is distorting economic activity and eroding purchasing power."

 cwic_crisis_inflation_extreme:0 "Runaway Inflation"
 cwic_crisis_inflation_extreme_desc:0 "The economy is destabilized by runaway inflation. Prices are accelerating faster than wages and productive investment."


 cwic_crisis_deflation_low:0 "Deflationary Drift"
 cwic_crisis_deflation_low_desc:0 "Prices are beginning to decline. While consumers benefit in the short term, businesses are growing cautious."

 cwic_crisis_deflation_medium:0 "Deflationary Pressure"
 cwic_crisis_deflation_medium_desc:0 "Falling prices are weakening investment and slowing economic activity."

 cwic_crisis_deflation_high:0 "Severe Deflation"
 cwic_crisis_deflation_high_desc:0 "Businesses are cutting wages and investment as deflation spreads across the economy."

 cwic_crisis_deflation_extreme:0 "Deflationary Spiral"
 cwic_crisis_deflation_extreme_desc:0 "The economy is trapped in a destructive cycle of falling prices, collapsing investment, and weakening production."


 cwic_crisis_energy_low:0 "Energy Supply Stress"
 cwic_crisis_energy_low_desc:0 "Energy supplies are tightening, increasing costs and reducing industrial efficiency."

 cwic_crisis_energy_medium:0 "Energy Shortages"
 cwic_crisis_energy_medium_desc:0 "Energy constraints are beginning to disrupt industrial production and economic activity."

 cwic_crisis_energy_high:0 "Severe Energy Crisis"
 cwic_crisis_energy_high_desc:0 "Energy shortages are disrupting production across the economy and slowing development."

 cwic_crisis_energy_extreme:0 "Energy System Breakdown"
 cwic_crisis_energy_extreme_desc:0 "Severe energy disruptions are crippling industrial output and economic stability."


 cwic_compound_stagflation_low:0 "Stagflation"
 cwic_compound_stagflation_low_desc:0 "Inflation and stagnation are now reinforcing one another. Prices continue to rise even as growth slows and investment weakens."

 cwic_compound_stagflation_medium:0 "Entrenched Stagflation"
 cwic_compound_stagflation_medium_desc:0 "The economy is caught between inflationary pressure and weak growth. Productive investment is faltering while rising costs continue to erode stability."

 cwic_compound_stagflation_high:0 "Severe Stagflation"
 cwic_compound_stagflation_high_desc:0 "Persistent inflation is colliding with deep economic weakness. Confidence is collapsing as the state struggles to restore either growth or price stability."

 cwic_compound_stagflation_extreme:0 "Stagflationary Breakdown"
 cwic_compound_stagflation_extreme_desc:0 "The economy is trapped in a destructive mix of inflation, stagnation, and declining productivity. Recovery is increasingly difficult without major structural change."


 cwic_compound_capital_flight_low:0 "Capital Flight"
 cwic_compound_capital_flight_low_desc:0 "Investors are beginning to move capital abroad as confidence in the domestic economy weakens."

 cwic_compound_capital_flight_medium:0 "Escalating Capital Flight"
 cwic_compound_capital_flight_medium_desc:0 "Capital outflows are weakening investment, slowing construction, and increasing economic instability."

 cwic_compound_capital_flight_high:0 "Severe Capital Flight"
 cwic_compound_capital_flight_high_desc:0 "Large-scale capital outflows are undermining economic confidence and depriving the country of funds needed for recovery."

 cwic_compound_capital_flight_extreme:0 "Financial Evacuation"
 cwic_compound_capital_flight_extreme_desc:0 "Capital is fleeing the country at a devastating pace, crippling investment, productivity, and public confidence in the economy."


 cwic_compound_resource_curse_low:0 "Resource Curse"
 cwic_compound_resource_curse_low_desc:0 "Dependence on extractive income is beginning to distort the wider economy and discourage diversification."

 cwic_compound_resource_curse_medium:0 "Entrenched Resource Curse"
 cwic_compound_resource_curse_medium_desc:0 "Reliance on resource rents is weakening productive diversification, slowing innovation, and reinforcing economic distortion."

 cwic_compound_resource_curse_high:0 "Severe Resource Curse"
 cwic_compound_resource_curse_high_desc:0 "The economy is being warped by extractive dependence. Diversification, research, and stable development are all being undermined."

 cwic_compound_resource_curse_extreme:0 "Extractive Dependency Crisis"
 cwic_compound_resource_curse_extreme_desc:0 "Resource dependence has become a structural crisis. Growth is distorted, institutions are weakening, and long-term development is being sacrificed for extractive rents."


 cwic_compound_militarized_economy_lock_in_low:0 "Militarized Economy"
 cwic_compound_militarized_economy_lock_in_low_desc:0 "The economy is becoming increasingly oriented toward military needs at the expense of civilian efficiency."

 cwic_compound_militarized_economy_lock_in_medium:0 "Militarized Economic Lock-In"
 cwic_compound_militarized_economy_lock_in_medium_desc:0 "Military priorities are crowding out civilian investment, research, and broader economic development."

 cwic_compound_militarized_economy_lock_in_high:0 "Severe Militarized Lock-In"
 cwic_compound_militarized_economy_lock_in_high_desc:0 "The state has become deeply dependent on military production and mobilization, weakening civilian productivity and long-term economic resilience."

 cwic_compound_militarized_economy_lock_in_extreme:0 "Permanent War Economy"
 cwic_compound_militarized_economy_lock_in_extreme_desc:0 "The economy is locked into an extreme military orientation. Civilian development, innovation, and living standards are all being sacrificed to sustain militarization."

