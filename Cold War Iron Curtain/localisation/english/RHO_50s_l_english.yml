 ###CHARACTER DESC###
 POLITICS_GODFREY_HUGGINS_DESC: "Godfrey Huggins was a leader, a hero, and undoubtedly a notable figure in Rhodesia.\n\nHuggins was born at 'Dane Cottage' on Knoll Road in Bexley, northern Kent, England. He was the second child and the eldest son of a stockbroker. The family later moved to 'Shore House,' a property built by his father in Sevenoaks, a town located 27 miles from London. Huggins received his education at Brunswick House, a preparatory school in Hove, and then attended Sutherland House, another similar school in Folkestone.\n\nHe entered politics in 1924 as a member of the Rhodesia Party and was elected unopposed to the Salisbury North constituency in the Southern Rhodesian Legislative Assembly of the newly established self-governing colony. In 1932, he broke with the Rhodesia Party government, led by Howard Unwin Moffat, when it introduced a measure to cut civil service salaries by 10%. This cut was particularly unpopular in Huggins's constituency, which had a significant number of civil servants. Unable to vote against the government without causing an early general election—something he wanted to avoid since an election was already scheduled for the following year—Huggins voted for the bill. The next day, he crossed the floor to join the newly formed Reform Party, which appointed him as Leader of the Opposition. Although the Reform Party was perceived by many in Rhodesia as a left-wing party, Huggins presented a cautiously conservative Cabinet after winning power in 1933.\n\nHowever, the acting Governor refused to dissolve the Assembly, citing that it had many years left in its term and that the government had not been defeated. Huggins persuaded the majority of the Executive of the Reform Party to suspend the party's constitution to allow for a National Government on September 17. He then formed the United Party with Fynn and requested a second time for a dissolution based on the changed party alignment. This time, the Acting Governor agreed."
 ###IDEAS###
 RHO_Booming_Economy: "Booming Economy"
 RHO_Booming_Economy_desc: "The end of World War II led to a remarkable surge in economic output and productivity in Southern Rhodesia. Unlike many countries that were heavily impacted by the war, Southern Rhodesia was largely spared from direct conflict, which allowed its economy to flourish during this period.\n\nA significant number of Rhodesians volunteered to serve in various capacities on the Western Front. While many of these brave individuals returned home after the war, their experiences and sacrifices contributed to a sense of pride and resilience in the nation. Sadly, the same cannot be said for numerous other countries that faced devastating losses and disruption during the war."
