 Rhodesia_Political_Situation_category: "The Rhodesian Political Situation"
 Rhodesia_Political_Situation_category_desc: "\n\n\n\n\n£Rhodesia_1\n\n\n\n\n\n\nNominally a [ROOT.GetGovernmentTypes], the [ROOT.GetName] was established in 1923 from the British South African Company. In a 1922 referendum, Southern Rhodesians chose responsible government within the British Empire over incorporation into the Union of South Africa.\n\nSince then, Rhodesia was governed as any other Colony of the United Kingdom, with the whole world now thrown into a Cold War. Rhodesia's political alignment will change in the future, for better or worse.\n\nSupport for Federation: [?RHO_Federal_System_Likelihood|+2%]"