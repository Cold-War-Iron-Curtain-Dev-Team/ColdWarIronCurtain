 VIN_MIL.0.t:0 "The Concept of People's War"
 VIN_MIL.0.d:0 "The struggle for Vietnam's liberation cannot be won by armies alone. Under the leadership of Uncle Ho and the Party, a doctrine born from resistance to colonialism has taken shape: People's War.\n\nUnlike conventional warfare, People's War mobilizes the entire nation into a single front. Soldiers fight on the battlefield, workers labor in factories, farmers sustain the countryside, teachers educate the young, and cadres organize the villages. Every hamlet becomes a fortress, every province a battlefield, and every citizen a participant in the revolutionary struggle.\n\nVictory will not be achieved by military means alone. The war must be fought on military, political, economic, cultural, ideological, and diplomatic fronts. Armed struggle is inseparable from political mobilization, while production and education are themselves forms of resistance.\n\nAt the center of this strategy stand the People's Armed Forces: the People's Army, the People's Public Security Forces, and the Self-Defense Militia. Together, they form the backbone of a nationwide resistance capable of confronting an enemy far stronger in material resources."
 VIN_MIL.0.a:0 "Whoever has a gun, use a gun. Whoever has a sword, use a sword. If there is no sword, use hoes, shovels, and sticks."
 VIN_MIL.1.t:0 "[VIN_MIL_1_Title]"
 VIN_MIL.1.d:0 "[VIN_MIL_1_Desc]"
 VIN_MIL.1.a:0 "[VIN_MIL_1_Option]"
 VIN_MIL.1.t_prc:0 "The Return of the Chinese-Trained Comrades"
 VIN_MIL.1.d_prc:0 "Following the victory of the Chinese Communists and the establishment of the People's Republic of China, the northern frontier has changed from a dangerous border into a gateway of revolutionary cooperation. Over the past year, hundreds of Vietnamese cadres, officers, and soldiers have trained in camps at Wenshan, Longzhou, Jingxi, and Simao under experienced Chinese instructors.\n\nToday, the first large contingents of these Chinese-trained comrades have returned to Vietnam. They bring knowledge of large-unit operations, logistics, artillery coordination, engineering, communications, and political organization. Alongside them arrive weapons, ammunition, radios, medical supplies, and military vehicles sent through the new supply routes linking southern China to Viet Bac.\n\nGeneral Vo Nguyen Giap has welcomed the returning cadres as the foundation of a People's Army capable of confronting colonial forces on more equal terms. The General Staff has begun assigning them to regular formations throughout the country, with particular attention given to the continued development of the 308th Division, the first full infantry division of the People's Army."
 VIN_MIL.1.a_prc:0 "The East is Red."
 VIN_MIL.1.t_chi:0 "The Return of the Revolutionary Exiles"
 VIN_MIL.1.d_chi:0 "The Nationalist victory in the Chinese Civil War has reshaped the political landscape of Asia in an unexpected way. Communist cadres, People's Liberation Army veterans, labor organizers, and revolutionary intellectuals have been driven from the mainland by Kuomintang security forces. Denied sanctuary across much of East Asia, many have sought refuge in the mountains and borderlands of northern Vietnam.\n\nOver recent months, streams of Chinese revolutionaries have crossed into Viet Bac. They include guerrilla commanders, political commissars, engineers, doctors, teachers, and veterans hardened by years of civil war. Though defeated in China, they remain committed to the struggle against imperialism and reaction.\n\nPresident Ho Chi Minh has authorized International Volunteer Training Groups to integrate these exiles into the Vietnamese resistance. Their instructors will train Vietnamese units in modern infantry tactics, logistics, communications, intelligence, and political organization, while underground networks across southern China begin moving weapons, medicine, printing equipment, and volunteers across remote mountain passes."
 VIN_MIL.1.a_chi:0 "Vietnam and China are brothers in revolution."
 VIN_MIL.1.t_fallback:0 "The Return of Northern Comrades"
 VIN_MIL.1.d_fallback:0 "Veterans, technicians, and revolutionary cadres from beyond Vietnam's northern frontier have begun arriving in Viet Bac. Their experience in organization, communications, logistics, and modern warfare will strengthen the People's Army as it grows from a guerrilla force into a national army of liberation.\n\nThe exact fate of China remains unsettled, but the revolution cannot afford to waste the expertise of those willing to continue the struggle in Vietnam."
 VIN_MIL.1.a_fallback:0 "Every comrade strengthens the resistance."
 VIN_MIL.2.t:0 "The Founding of the Quan Y Vien"
 VIN_MIL.2.d:0 "As the war against French colonialism enters a more demanding phase, the Democratic Republic of Vietnam has announced the founding of the Quan Y Vien, the Military Medical Academy. It is the first institution dedicated to training military doctors, surgeons, pharmacists, and medical cadres for the People's Army.\n\nOpened at Doi Tram in Vinh Phuc Province, the academy will prepare medical personnel for the conditions of jungle warfare, mountain campaigns, and improvised field hospitals. Since the beginning of the resistance, thousands of wounded soldiers have depended on volunteer nurses, civilian physicians, and makeshift medical stations. Their courage has saved many lives, but the growing scale of the war has made a professional military medical service indispensable.\n\nIn a message to the opening ceremony, President Ho Chi Minh praised the future doctors of the revolution and reminded them that the fight for independence depends as much on those who preserve life as on those who take up arms."
 VIN_MIL.2.a:0 "To heal the wounded is to strengthen the resistance. To save a soldier is to return a rifle to the battlefield."
 VIN_MIL.3.t:0 "Sac lenh so 17/SL"
 VIN_MIL.3.d:0 "By decree of the President of the Democratic Republic of Vietnam, the Ministry of National Defense has established a new system of Military Regions: Viet Bac, Tay Bac, Dong Bac, Ta Ngan, Huu Ngan, and Military Region 4.\n\nEach regional command will bear responsibility for national defense within its assigned territory. Its commanders are to organize local defense, direct units guarding coasts, borders, and demarcation lines, command the armed forces of provinces and districts, and coordinate militia, mobilization, and demobilization work with civilian authorities.\n\nThe decree replaces all previous regulations that conflict with the new organization. In a war fought across mountains, deltas, and scattered liberated zones, the Republic requires commands capable of uniting military operations with the work of local government and the people."
 VIN_MIL.3.a:0 "Signed."
 VIN_MIL.4.t:0 "Implementing General Giap's Suggestions"
 VIN_MIL.4.d:0 "As the resistance against French colonialism enters a decisive stage, the Central Military Commission has approved reforms proposed by General Vo Nguyen Giap. Their purpose is to transform the People's Army from a collection of regional guerrilla bands into a coordinated revolutionary force capable of defeating a technologically superior enemy.\n\nThe reforms build upon the doctrine of People's War. Because the Democratic Republic lacks France's industrial capacity, heavy weapons, and financial resources, victory must rest upon political determination, mobility, popular support, and superior strategy rather than material strength alone.\n\nThe General Staff has adopted the principle of Independent Company, Concentrated Battalion. Local companies will harass enemy positions, gather intelligence, protect revolutionary administrations, and disrupt communications across villages and provinces. Battalions and larger formations will be concentrated when conditions allow isolated enemy units to be destroyed through overwhelming local superiority.\n\nPolitical education will also expand throughout the armed forces. Every soldier must understand not only how to fight, but why he fights."
 VIN_MIL.4.a:0 "If the enemy advances, we withdraw. If he is isolated, we strike. If he is weak, we destroy him."
 VIN_MIL.5.t:0 "The Air Force Research Bureau is Established"
 VIN_MIL.5.d:0 "Despite possessing no operational air force, the Ministry of National Defense has established an Air Force Research Bureau under the General Staff of the Vietnam National Army and Militia. The decision reflects the leadership's determination to prepare for the future development of military aviation and one day challenge French aerial supremacy over Vietnam.\n\nThe bureau traces its origins to two civilian aircraft donated to the Democratic Republic after the August Revolution: a de Havilland Tiger Moth trainer and a Morane-Saulnier MS.343, formerly owned by Bao-Dai. After the outbreak of nationwide resistance, both aircraft were dismantled and moved through dangerous routes into the Viet Bac resistance zone. French aircraft repeatedly attacked the convoys, but revolutionary engineers preserved many components for future study.\n\nHa Dong, former secretary to Deputy Minister of National Defense Ta Quang Buu, has been appointed to lead the bureau. He will be assisted by technicians, mechanics, and aviation enthusiasts including Nguyen Van Dong, Nguyen Duc Viet, and Nguyen Tam Trinh."
 VIN_MIL.5.a:0 "We will defend the skies of the fatherland."
 VIN_MIL.6.t:0 "The Naval Research Committee is Established"
 VIN_MIL.6.d:0 "The General Command of the Vietnam National Army and Militia has established the Naval Research Committee under the General Staff, marking the first major step toward rebuilding a revolutionary naval force after years of war and hardship.\n\nThe decision revives a vision first pursued in 1946, when the government created a Naval Agency to organize coastal defense and maritime patrol forces for the young Republic. Those efforts were cut short by the outbreak of full-scale war. As French forces advanced along the coast and major waterways, naval vessels and equipment were scuttled or dismantled to prevent their capture.\n\nNow the Party and the armed forces have determined that Vietnam must prepare to defend not only its mountains and jungles, but also its rivers, coastlines, and territorial waters. The committee will be headquartered on Gian Street along the Chay River in Doan Hung District, Phu Tho Province. Nguyen Van Khuong has been appointed head of the committee, assisted by Political Commissar Nguyen Viet and Deputy Head Tran Dinh Vong.\n\nIts specialized sections will cover maritime operations, maritime communications, and electrical and marine engineering."
 VIN_MIL.6.a:0 "The islands are our homes; the oceans are our fatherland."
 VIN_MIL.7.t:0 "The People's Public Security Forces"
 VIN_MIL.7.d:0 "Decree No. 23/SL, signed by President Ho Chi Minh on 21 February 1946, has formally established the People's Public Security Force - Cong An - as a unified national security organization responsible for defending the Democratic Republic of Vietnam against espionage, sabotage, banditry, and counter-revolutionary activity.\n\nThe new force consolidates security organizations that emerged during the revolutionary struggle: the Security Departments in the north, Intelligence Departments in central Vietnam, and National Self-Defense Forces operating in the south. They will now operate under a single command structure directed by the Vietnam Public Security Department within the Ministry of the Interior. Veteran revolutionary Le Gian has been appointed its first director.\n\nParty leaders emphasize that the force is not an entirely new creation. It continues a clandestine tradition of Red Self-Defense Teams, Worker-Peasant Self-Defense Units, Honor Guard Teams, and Viet Minh security detachments that protected cadres, guarded Party facilities, exposed enemy agents, and defended liberated areas during the years of colonial repression."
 VIN_MIL.7.a:0 "Protect the security of the fatherland."
 VIN_MIL.8.t:0 "Sac lenh so 121/SL"
 VIN_MIL.8.d:0 "By decree of the President, the organization of the Vietnam National Army and Militia's General Staff has been clarified and expanded. The General Staff, General Political Department, General Supply Department, Inspection Team, and Commander-in-Chief's Office will together assist the Commander-in-Chief in the direction of the war.\n\nThe General Staff will organize the army and militia and direct combat operations through its Operations, Military Intelligence, Military Training, Militia, and Communications Departments. It will be led by a Chief of the General Staff, assisted by one or two deputies. The Chief is authorized to direct the Engineering and Artillery Departments and supervise the establishment of military insignia.\n\nThe General Political Department will assist the Commander-in-Chief in maintaining political direction throughout the armed forces. By linking operations, intelligence, training, supply, and political work under a clearer structure, the decree gives the Republic a command system suited to a growing people's army."
 VIN_MIL.8.a:0 "The General Staff will direct the war."
 VIN_MIL.9.t:0 "The Tong Quan Uy is Re-established"
 VIN_MIL.9.d:0 "The Central Committee of the Vietnam Workers' Party has announced the re-establishment of the General Military Commission, the Tong Quan Uy, restoring the Party's highest organ of military leadership over the People's Army and the armed forces of the Democratic Republic of Vietnam.\n\nThe decision comes as the resistance enters a new and more demanding stage. The People's Army has grown from scattered guerrilla detachments into a revolutionary force capable of conducting large-scale operations across the country. Party leaders have concluded that stronger political leadership and coordination are needed to guide the expanding armed forces through the years ahead.\n\nThe General Military Commission will formulate military strategy, national-defense policy, force-development programs, and plans for the future construction of the armed forces. It will ensure the Party's direct and comprehensive leadership over military affairs. Though the Commission traces its roots to the early days of the revolution, its restoration reflects the scale and complexity of the war now being fought."
 VIN_MIL.9.a:0 "Victorious in both war and mind."
 VIN_MIL.10.t:0 "The Cuc Quan Bao Intelligence Bureau is Established"
 VIN_MIL.10.d:0 "The Ministry of National Defense and General Command of the Vietnam National Army have announced the establishment of the Cuc Quan Bao, the Military Intelligence Bureau. The new institution will centralize military intelligence, reconnaissance, and counter-infiltration work in direct support of the revolutionary armed forces.\n\nIts roots lie in the Military Intelligence Department formed after the August Revolution on 25 October 1945 under Hoang Minh Dao, also known as Dao Phuc Loc. Since the outbreak of war with France, commanders have repeatedly learned that timely information can accomplish what superior numbers and weapons cannot.\n\nThe Bureau will consolidate reconnaissance and intelligence elements into a professional organization subordinate to the General Command. Its duties include monitoring French troop movements, assessing friendly forces, infiltrating enemy administrative networks, conducting counter-intelligence operations, and furnishing commanders with accurate battlefield reports. In a struggle against a materially stronger enemy, intelligence is not an auxiliary task; it is a weapon of the revolution."
 VIN_MIL.10.a:0 "Courage and unwavering loyalty."
 VIN_MIL.11.t:0 "Sac lenh so 50/SL"
 VIN_MIL.11.d:0 "President Ho Chi Minh has issued Decree No. 50/SL, clarifying the responsibilities of the Ministry of National Defense and the Commander-in-Chief of the Vietnam National Army and Militia.\n\nThe Ministry is charged with organizing and administering the army and national-defense agencies, as well as directing national-defense production. The Commander-in-Chief retains responsibility for the command of the army and militia, using the General Staff and related departments to direct operations, deployments, and the use of military production.\n\nThe decree also establishes the supporting structure required for a modern wartime ministry: offices and administrative departments directly assisting the Minister, specialized production departments, the General Staff and command departments, and an Inspection Team led by a Chief Inspector under the authority of the Commander-in-Chief.\n\nThe Republic's armed struggle can no longer depend upon improvised arrangements alone. The institutions of war must now be built with the same seriousness as the forces that fight it."
 VIN_MIL.11.a:0 "Signed."
