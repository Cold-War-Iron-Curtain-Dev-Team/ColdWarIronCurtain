GENEVA_BTN_CHAMPION_TT: "§YChampion§! your selected outcome: adopt it as your delegation's position and stake a major push behind it in the next round's vote.\nCosts §Y25 Political Power§! and §Y10 Weight§!. Requires at least 20 Weight."
GENEVA_BTN_PRESSURE_TT: "§YPressure§! the selected delegation into adopting your position on the selected clause. They will resent it, and refuse further pressure for several rounds.\nCosts §Y25 Political Power§! and Weight equal to §Yhalf the target's Weight§!."
GENEVA_BTN_CONCEDE_TT: "§YConcede§! the selected clause: publicly adopt whatever is currently on the table. Recovers §G15 Weight§! and improves the patience of every delegation that wanted that outcome."
GENEVA_BTN_BACKCHANNEL_TT: "Open a §Yback-channel§! between Saigon and Hanoi (select the other Vietnamese delegation as target). Builds rapprochement; at §Y100§! both delegations soften their formal positions.\nCosts §Y50 Political Power§!. Once every two rounds."
GENEVA_BTN_THREATEN_TT: "§YThreaten to walk out§! over the selected clause: an enormous push behind your position, paid for with §R20 Patience§!.\nRequires more than 25 Patience. Once every two rounds."
GENEVA_BTN_FORCE_VOTE_TT: "§YForce the vote§!: end the conference on the current terms. Core belligerent delegations only, from round 5.\nCosts §Y50 Political Power§!."
GENEVA_BTN_LEAN_SAIGON_TT: "§YLean on Saigon§!: covertly kill the State of Vietnam's appetite for reunification elections. If Saigon and Hanoi have a warm back-channel (§Y50+§! rapprochement), the pressure §Rleaks§! and the scandal breaks publicly.\nCosts §Y50 Political Power§!. Once per conference."
GENEVA_BTN_PICK_TT: "Select this delegation as the target for Pressure and Back-Channel actions"
Geneva_Conference_Session.12.t: "Quiet Words in Geneva's Corridors"
Geneva_Conference_Session.12.d: "Away from the plenary hall and the press, an intermediary has passed word that the other Vietnamese delegation wishes to talk — quietly, informally, and without their patrons in the room.\n\nNothing said in a hotel corridor binds anyone. But the mere fact of the contact is remarkable: two governments that each claim to be the sole legitimate Vietnam, feeling for common ground while the great powers argue over their heads.\n\nIf these conversations continue, positions at the table that today seem immovable may quietly begin to move."
Geneva_Conference_Session.12.a: "Keep this between us."
Geneva_Conference_Session.13.t: "[GetNewspaperHeader]American Pressure on Saigon Exposed at Geneva"
Geneva_Conference_Session.13.d: "Geneva, [?global.date.GetDateStringNoHourLong] - The conference has been rocked by revelations that the United States delegation has been covertly pressuring the State of Vietnam to bury the proposed all-Vietnamese elections.\n\nThe disclosure — which observers believe reached the press through Vietnamese back-channels — has enraged the communist delegations and embarrassed Washington's partners. The Soviet and North Vietnamese delegations have demanded the conference take note of what they call 'American sabotage of the Vietnamese people's right to choose.'\n\nThe American delegation has declined to comment. Its standing at the table, however, has visibly diminished."
Geneva_Conference_Session.13.a: "Diplomacy has many rooms."
Geneva_Conference_Session.20.t: "[GetNewspaperHeader]Vietnam to Vote as One Nation"
Geneva_Conference_Session.20.d: "Saigon and Hanoi, [?global.date.GetDateStringNoHourLong] - Under the terms agreed at Geneva, the two Vietnamese governments have announced the formation of joint interim arrangements to prepare a single, nationwide election that will decide who governs a reunified Vietnam.\n\nMixed commissions are to supervise the campaign in both zones, and international observers are expected to oversee the balloting. In Hanoi, Ho Chi Minh's government professes complete confidence in the verdict of the people; in Saigon, officials speak carefully of safeguards and supervision, and privately of unease.\n\nNobody in either capital pretends the arrangement is comfortable. Two administrations, two armies and two irreconcilable ideas of Vietnam now share a single scheduled appointment with the ballot box — and the whole world will be watching when it falls due."
Geneva_Conference_Session.20.a: "One country, one vote."
Geneva_Conference_Session.22.t: "[GetNewspaperHeader]Ho Chi Minh Sweeps All-Vietnam Elections"
Geneva_Conference_Session.22.d: "Hanoi, [?global.date.GetDateStringNoHourLong] - The all-Vietnam elections mandated by the Geneva Accords have returned a decisive verdict: the list headed by Ho Chi Minh has carried the country, sweeping the northern provinces and polling far more strongly in the south than Saigon's government had promised its patrons it would.\n\nThe State of Vietnam's administration, bound by the accords it signed and abandoned by allies unwilling to overturn a supervised ballot, has announced that it will respect the result. Government ministries in Saigon have begun handing their portfolios to the unified administration.\n\nVietnam, partitioned in fact if not always in law since the French war began, will be governed as one nation from Hanoi. The great powers are left to digest an outcome that some of them signed up to and none of them quite believed would happen."
Geneva_Conference_Session.22.a: "The ballot has spoken."
Geneva_Conference_Session.23.t: "[GetNewspaperHeader]State of Vietnam Wins All-Vietnam Elections"
Geneva_Conference_Session.23.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Against most expectations, the all-Vietnam elections mandated by the Geneva Accords have gone to the State of Vietnam. Saigon's list held its southern base, swept the cities, and - with the northern countryside exhausted by years of war and land-reform upheaval - polled far better above the old partition line than Hanoi believed possible.\n\nThe Democratic Republic's leadership, staked publicly on the verdict of the Vietnamese people, has conceded with visible bitterness. Veterans of the Viet Minh are being told that the revolution's work will continue by other means; observers in Hanoi report quiet fury, and quiet packing.\n\nVietnam will be governed as one nation from Saigon. Whether the victors can reconcile the north to the result - or merely administer it - is the question every chancellery is now asking."
Geneva_Conference_Session.23.a: "A nation reunited."
Geneva_Conference_Session.26.t: "The All-Vietnam Campaign"
Geneva_Conference_Session.26.d_comm: "The campaign for the all-Vietnam elections mandated at Geneva is underway in both zones, and every report reaching our government points the same way: §Rthe list headed by Ho Chi Minh is far ahead§!.\n\nThe Viet Minh emerged from the war with the prestige of the winning side, and it shows. In the north the outcome was never in doubt; in the south, mixed-commission observers report village committees, veterans' associations and no small part of the countryside quietly lining up behind Hanoi. Saigon's canvassers speak of sullen crowds and empty halls.\n\nUnless something changes before the ballot, the supervised vote will deliver Vietnam to the communists — legally, internationally witnessed, and beyond appeal."
Geneva_Conference_Session.26.d_anti: "The campaign for the all-Vietnam elections mandated at Geneva is underway in both zones, and every report reaching our government points the same way: §Ythe State of Vietnam's list is ahead§!.\n\nThe war's verdict hangs over the hustings. Hanoi campaigns on the revolution's promises, but it is the southern government — solvent, victorious in the field, and backed by patrons who kept their commitments — that draws the crowds. Mixed-commission observers report strong southern polling even in northern market towns, where exhaustion with wartime requisitions runs deep.\n\nUnless something changes before the ballot, the supervised vote will confirm Saigon's government over a reunified Vietnam — legally, internationally witnessed, and beyond appeal."
Geneva_Conference_Session.26.d_tie: "The campaign for the all-Vietnam elections mandated at Geneva is underway in both zones, and no observer will venture a prediction.\n\nThe war ended with neither side able to claim the upper hand, and the campaign mirrors the battlefield: Ho Chi Minh's list commands the north and much of the countryside, Saigon holds the cities and the south, and the mixed commissions report both camps campaigning furiously over the narrow ground between.\n\nThe supervised ballot will settle what the guns could not — and nobody, in Hanoi, Saigon or any great-power capital, knows which way it will fall."
Geneva_Conference_Session.26.a: "The people will decide."

