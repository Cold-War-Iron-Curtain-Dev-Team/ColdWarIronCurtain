# ------------------------------------------------------------------- events
Geneva_Conference_Session.1.t: "[GetNewspaperHeader]Great Powers Convene at Geneva"
Geneva_Conference_Session.1.d: "Geneva, [?global.date.GetDateStringNoHourLong] - Delegations from France, both Vietnamese governments and the great powers have taken their seats at the Palais des Nations to negotiate an end to the war in Indochina.\n\nThe agenda before the conference is formidable: a ceasefire across Indochina, the question of partition and of all-Vietnamese elections, the timetable of the French withdrawal, and the future of Laos and Cambodia. Each delegation arrives with its own red lines — and its own patrons watching over its shoulder.\n\nDiplomats caution that nothing is agreed until everything is agreed. The talks are expected to run for weeks, and a single walkout by one of the principal belligerents could bring the entire conference down."
Geneva_Conference_Session.1.a: "The world is watching."
Geneva_Conference_Session.2.t: "[GetNewspaperHeader]Delegation Storms Out of Geneva Talks"
Geneva_Conference_Session.2.d: "Geneva, [?global.date.GetDateStringNoHourLong] - The delegation of [Geneva_Wrecker.GetName] has walked out of the Indochina conference, denouncing the terms taking shape at the table as unacceptable.\n\nThe remaining delegations are pressing on, but the mood in the Palais des Nations has darkened considerably. Observers note that a settlement signed without every principal belligerent is worth little more than the paper it is printed on — and that a second walkout would almost certainly end the conference altogether."
Geneva_Conference_Session.2.a: "An empty chair speaks loudly."
Geneva_Conference_Session.3.t: "[GetNewspaperHeader]Geneva Conference Collapses in Acrimony"
Geneva_Conference_Session.3.d: "Geneva, [?global.date.GetDateStringNoHourLong] - The Indochina conference has collapsed. After weeks of fruitless negotiation, the delegations have abandoned the Palais des Nations without a ceasefire, without a settlement, and without any intention of returning.\n\nEach side blames the other for the breakdown. What is certain is that the guns will now decide what the diplomats could not: both Vietnamese governments have announced general mobilizations, and French commanders speak grimly of a war without any end in sight.\n\nThe great powers, having failed to contain the conflict at the negotiating table, now face the prospect of an Indochina locked in permanent, grinding warfare."
Geneva_Conference_Session.3.a: "The war goes on."
Geneva_Conference_Session.4.t: "[GetNewspaperHeader]Geneva Ends With Nothing Left to Win"
Geneva_Conference_Session.4.d: "Geneva, [?global.date.GetDateStringNoHourLong] - The Indochina conference has ended not with a treaty but with an exhausted silence. None of the delegations could impose terms, because none of them any longer has the strength to enforce any.\n\nYears of war have hollowed out every faction in Indochina. The armies facing each other across the paddies are shadows; the governments claiming to speak for Vietnam command neither loyalty nor revenue. The diplomats have simply gone home, leaving behind a land where authority itself has dissolved.\n\nAid workers warn of famine and banditry across the region. In the capitals of the great powers, ministers speak of Indochina no longer as a prize to be won, but as a tragedy to be contained."
Geneva_Conference_Session.4.a: "Nobody won."
Geneva_Conference_Session.5.t: "[GetNewspaperHeader]The Geneva Accords Are Signed"
Geneva_Conference_Session.5.d: "Geneva, [?global.date.GetDateStringNoHourLong] - After weeks of negotiation, the delegations at the Palais des Nations have signed the Geneva Accords, bringing the war in Indochina to a formal close.\n\nThe terms of the settlement are as follows:\n\nCeasefire: §Y[GetGenevaClause0Text]§!\nTerritorial settlement: §Y[GetGenevaClause1Text]§!\nReunification: §Y[GetGenevaClause2Text]§!\nFrench forces: §Y[GetGenevaClause3Text]§!\nAlignment: §Y[GetGenevaClause4Text]§!\nLaos and Cambodia: §Y[GetGenevaClause5Text]§!\nMinority peoples: §Y[GetGenevaClause6Text]§!\n\nWhether these accords will bring a lasting peace to Indochina, or merely an intermission, is a question the signatories have left to history."
Geneva_Conference_Session.5.a: "Peace, for now."
Geneva_Conference_Session.10.t: "The Road to Geneva"
Geneva_Conference_Session.10.d: "The belligerents of the Indochina War have agreed to convene an international peace conference in Geneva under great-power sponsorship.\n\nOur government has been invited to send a delegation. In six days the conference will open at the Palais des Nations, where the ceasefire, the political future of Vietnam, and the fate of Laos and Cambodia will all be on the table.\n\nOur negotiators' strength at the conference will reflect everything we have built and fought for in Indochina until now. Once the session opens, the conference overview can be followed from the §YGeneva Conference§! button on the political tab (or from the Struggle for Indochina window)."
Geneva_Conference_Session.10.a: "To Geneva."

