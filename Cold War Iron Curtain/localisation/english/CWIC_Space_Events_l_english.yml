Space_News_Global_Outer_Solar_System_Probe_Desc_SOV:0 "The Soviet Union has completed the world's first successful outer solar system probe mission, sending a spacecraft into the remote regions far beyond the inner planets. State radio and official newspapers announced that the probe survived its long journey, maintained contact with Soviet tracking stations, and returned observations from the distant reaches of the solar system. Soviet officials, state design bureaus, and the Academy of Sciences have praised the mission as a triumph of socialist science, precision engineering, and disciplined industrial planning. Operating in the outer solar system requires years of endurance, reliable power systems, durable electronics, and communications across almost unimaginable distances. Scientists expect the mission to provide valuable information about radiation, magnetic fields, interplanetary dust, distant planetary environments, and the outer limits of solar influence. Foreign governments have responded with admiration and concern, recognizing that Moscow has carried space exploration into its most remote frontier."

