Space_News_Global_Moon_Capsule_Desc_USA:0 "The United States has completed the world's first crewed lunar mission, sending astronauts beyond Earth orbit and placing them on the Moon. Officials confirmed that the spacecraft survived the journey through deep space, maintained communications with mission control, completed its lunar objectives, and began the return phase. Mission controllers reported that Neil Armstrong's first words from the surface, "That's one small step for a man, one giant leap for mankind," were heard around the world as newspapers rushed special editions into print. The achievement has placed Armstrong, Buzz Aldrin, Michael Collins, and the earlier Apollo crews at the center of the national imagination, linking years of sacrifice to a single historic moment. Foreign governments are expected to study the flight closely, as crewed lunar operations require powerful launch vehicles, precise navigation, life-support systems, and reliable recovery planning. Washington has emphasized peaceful exploration, but the prestige of reaching the Moon first is enormous."

