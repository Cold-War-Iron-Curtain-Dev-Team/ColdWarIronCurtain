### Phu Dai Army 1950's ###

#Focus Titles
PQC_The_Sino_French_Sima_Treaty: "The Sino-French Sima Treaty"
PQC_The_Sino_French_Sima_Treaty_desc: "The Sino-French Sima Treaty was negotiated between Nationalist Chinese General Hoang Kiet's Chief of Staff and French colonial forces in Vietnam. This agreement established the process for evacuating Nationalist Chinese troops from China via Vietnam, with groups of 500 soldiers surrendering their weapons to French authorities in Haiphong before being transported to Phu Quoc Island. However, strong condemnation from the People's Republic of China caused the French to reconsider, leaving the Phu Dai Army interned on the island with an uncertain fate."
PQC_Form_the_Phu_Dai_Army: "Form the Phu Dai Army"
PQC_Form_the_Phu_Dai_Army_desc: "With the Phu Dai Army now established on Phu Quoc Island, we must organize these Nationalist Chinese troops into a proper military force. These experienced soldiers, having fought in the Chinese Civil War, will form the backbone of our military capabilities. We will create the Sanjiao Jun divisions, ready to defend our island base and potentially launch operations against the mainland."
PQC_Settle_VNQDD_Loyalists: "Settle Viet-Quoc Loyalists"
PQC_Settle_VNQDD_Loyalists_desc: "The Viet Nam Quoc Dan Dang (VNQDD), also known as Viet-Quoc, has many loyalists who share our nationalist ideology. We will settle these Vietnamese nationalists on Phu Quoc, integrating them with the Phu Dai Army. This will strengthen our manpower and create a unified force committed to Vietnamese independence and the Three Principles of the People."
PQC_Establish_the_Vietnamese_Restoration_Liberation_Army: "Establishing the Vietnamese Restoration Liberation Army"
PQC_Establish_the_Vietnamese_Restoration_Liberation_Army_desc: "We will establish the Vietnamese Restoration Liberation Army, combining Vietnamese nationalists with the Phu Dai Army. This force will be dedicated to liberating Vietnam from both French colonial rule and communist control. The army will serve as the military arm of our nationalist movement, ready to strike when the opportunity arises."
PQC_Permit_the_Formation_of_a_VNQDD_Republic: "Permit the Formation of a Viet-Quoc Republic"
PQC_Permit_the_Formation_of_a_VNQDD_Republic_desc: "We will formally declare Phu Quoc as the Republic of Vietnam under VNQDD leadership. This will establish our legitimacy as a government-in-exile and rally Vietnamese nationalists to our cause. By adopting the Three Principles of the People, we align ourselves with the Nationalist Chinese ideology and create a clear alternative to both French colonialism and communism."
PQC_Collaborate_with_the_Colonial_Regime: "Collaborate with the French Colonial Regime"
PQC_Collaborate_with_the_Colonial_Regime_desc: "Rather than opposing the French, we will seek collaboration with the colonial regime. By working with the French, we can gain access to weapons, supplies, and training. This pragmatic approach will allow us to build our strength while maintaining a working relationship with the colonial authorities, even if it means temporarily accepting French presence."
PQC_Colonizing_Phu_Quoc: "Colonizing Phu Quoc"
PQC_Colonizing_Phu_Quoc_desc: "Phu Quoc Island is largely undeveloped, but it has great potential. We will begin colonizing and developing the island, building infrastructure and industrial facilities. This will transform Phu Quoc from a refugee camp into a proper base of operations, capable of supporting our military and civilian population."
PQC_Expand_the_Cay_Duong_Refugee_Camp: "Expand the Cay Duong Refugee Camp"
PQC_Expand_the_Cay_Duong_Refugee_Camp_desc: "The Cay Duong refugee camp has become a center for Vietnamese refugees fleeing the mainland. We will expand this camp significantly, creating more housing and facilities to accommodate the growing population. This expansion will demonstrate our commitment to helping Vietnamese people and strengthen our ties to South Vietnam."
PQC_Abandon_Phu_Qouc: "Abandon Phu Quoc"
PQC_Abandon_Phu_Qouc_desc: "After careful consideration, we have decided that maintaining a presence on Phu Quoc is no longer viable. The Phu Dai Army will be transported back to Taiwan, where they will be reintegrated into the Republic of China's Marine Corps. We will abandon the island and return control to South Vietnam, ending our experiment in island-based nationalism."
PQC_Contact_Kuomintang_Leadership: "Contact Kuomintang Leadership"
PQC_Contact_Kuomintang_Leadership_desc: "We will establish direct contact with the Kuomintang leadership in Taiwan. By aligning ourselves with the Nationalist Chinese government, we can receive support, training, and equipment. This connection will also allow us to establish a training base for overseas Nationalist forces, creating a strategic partnership that benefits both our cause and Taiwan's interests."
PQC_Establish_the_Oversea_National_Revolution_Army_Training_Base: "Establish the Oversea National Revolution Army Training Base"
PQC_Establish_the_Oversea_National_Revolution_Army_Training_Base_desc: "With Kuomintang support, we will establish a major training base for the Oversea National Revolution Army. This facility will train Vietnamese nationalists in modern military tactics, using equipment and advisors provided by Taiwan. The base will serve as a center for preparing forces for future operations against communist and colonial forces on the mainland."
PQC_Claim_Phu_Quoc_for_the_Republic: "Claim Phu Quoc for the Republic!"
PQC_Claim_Phu_Quoc_for_the_Republic_desc: "We will formally claim Phu Quoc Island for the Republic of China, removing South Vietnam's claim to the territory. This bold move will establish our island as a sovereign territory under Nationalist Chinese protection, creating a permanent base for operations in Southeast Asia and demonstrating our commitment to the anti-communist cause."
PQC_Lobby_for_American_Support: "Lobby for American Support"
PQC_Lobby_for_American_Support_desc: "The United States is a key player in the Cold War, and their support could be crucial for our cause. We will lobby American officials and politicians, presenting ourselves as a democratic alternative to both French colonialism and Vietnamese communism. Recognition and support from the USA would legitimize our government and provide access to American aid and equipment."
PQC_Declare_a_Rival_Vietnamese_Government: "Declare a Rival Vietnamese Government"
PQC_Declare_a_Rival_Vietnamese_Government_desc: "We will formally declare ourselves as a rival Vietnamese government, claiming sovereignty over all of Vietnam. This declaration will challenge both the French-backed South Vietnamese government and the communist North Vietnamese regime. By asserting our legitimacy, we create a third option for the Vietnamese people and position ourselves as the true representatives of Vietnamese nationalism."
PQC_The_Forward_Base_to_Mainland_Liberation: "The Forward Base to Mainland Liberation"
PQC_The_Forward_Base_to_Mainland_Liberation_desc: "Phu Quoc will serve as our forward base for liberating the Vietnamese mainland. We will prepare for military operations, stockpiling weapons and equipment, and training our forces for amphibious assaults. The island's strategic location makes it an ideal staging ground for operations against both the communist North and the colonial South."
PQC_Further_Militarize_the_Island: "Further Militarize the Island"
PQC_Further_Militarize_the_Island_desc: "We will significantly expand our military infrastructure on Phu Quoc, building dockyards for naval operations and radar stations for early warning. This militarization will transform the island into a fortress, capable of defending itself and launching offensive operations. The island will become a key strategic asset in the struggle for Vietnamese independence."
#End

