### Hinh's French Coup Focus Tree ###

#Focus Titles
VIE_French_Hinh: "General Nguyen-Van-Hinh"
VIE_French_Hinh_desc: "General Nguyen-Van-Hinh, a French-trained officer, has been installed as the leader of Vietnam following the French coup. His loyalty to France is unquestionable, and he will serve as a puppet ruler to maintain French colonial control."
VIE_French_Yes_Man: "Appoint Pro-French Yes-Men"
VIE_French_Yes_Man_desc: "To ensure complete French control, we must fill key government positions with officials who will unquestioningly follow French directives. These yes-men will prioritize French interests over Vietnamese concerns, ensuring smooth colonial administration."
VIE_French_Bureaucrats: "Install French Bureaucrats"
VIE_French_Bureaucrats_desc: "French administrators will be placed in critical bureaucratic positions throughout the government. This will ensure that French policies are properly implemented and that no Vietnamese official can act independently of French oversight."
VIE_French_Ideals: "Promote French Ideals"
VIE_French_Ideals_desc: "We must promote French culture, language, and values throughout Vietnam. By emphasizing the superiority of French civilization, we can justify continued colonial rule and reduce resistance to French authority."
VIE_French_MilPurge: "Purge the Military"
VIE_French_MilPurge_desc: "The military must be purged of officers loyal to Vietnamese independence or other political factions. Only those who demonstrate absolute loyalty to France and Hinh's regime will be allowed to serve. This will create a disjointed but compliant military force."
VIE_French_Phap: "Strengthen French Language"
VIE_French_Phap_desc: "French must become the primary language of administration, education, and elite society. By making French essential for advancement, we ensure that the Vietnamese elite remain dependent on French culture and institutions."
VIE_French_Propaganda: "Launch Anti-Communist Propaganda"
VIE_French_Propaganda_desc: "We will launch a massive propaganda campaign against the Viet Minh and North Vietnam, portraying them as puppets of Moscow and enemies of Vietnamese independence. This will destabilize our enemies while justifying French military presence."
VIE_French_Cultures: "Emphasize Nam-Ky Identity"
VIE_French_Cultures_desc: "By promoting a distinct Southern Vietnamese (Nam-Ky) identity separate from the North, we can create regional divisions that weaken pan-Vietnamese nationalism. This policy will reduce resistance in the South while deepening the North-South divide."
VIE_French_Investment: "Attract French Investment"
VIE_French_Investment_desc: "We will offer favorable terms to French investors, encouraging them to establish businesses and plantations in Vietnam. This will strengthen economic ties to France and create a class of Vietnamese who benefit from colonial rule."
VIE_French_Repress: "Implement Repressive Measures"
VIE_French_Repress_desc: "Harsh repressive measures will be implemented against all opposition groups. Dissidents will be arrested, resistance movements crushed, and any sign of anti-French sentiment will be met with swift and brutal punishment."
VIE_French_Quan: "Establish Order and Stability"
VIE_French_Quan_desc: "Through a combination of repression, propaganda, and economic incentives, we will establish order and stability in Vietnam. The population will learn to accept French rule as the natural state of affairs."
VIE_French_Censor: "Implement Censorship"
VIE_French_Censor_desc: "All media, publications, and public discourse will be subject to strict French censorship. Only content that supports French rule and Hinh's government will be permitted, ensuring that no dissenting voices reach the public."
VIE_French_Laws: "Enact Security Laws"
VIE_French_Laws_desc: "New security laws will be enacted that give the government broad powers to arrest and detain anyone suspected of anti-French activities. The An-Ninh Quoc-Gia (National Security) apparatus will be strengthened to enforce these laws."
VIE_French_Purge: "Complete the Purge"
VIE_French_Purge_desc: "The final purge will eliminate any remaining opposition within the government and military. With all dissidents removed, Hinh's regime will be fully consolidated and ready to serve as France's puppet government."
VIE_French_Government: "Establish the Puppet Government"
VIE_French_Government_desc: "With all opposition purged and French control firmly established, Hinh's government is now fully operational as a French puppet regime. While maintaining the appearance of Vietnamese sovereignty, all real power remains in French hands."
VIE_French_Self-Governance: "Request Limited Self-Governance"
VIE_French_Self-Governance_desc: "We will request limited self-governance from France, asking for more autonomy in domestic affairs while maintaining French control over foreign policy and military matters. This may satisfy some Vietnamese demands while preserving French interests."
VIE_French_Continue: "Continue as French Protectorate"
VIE_French_Continue_desc: "We will continue as a French protectorate, accepting our role as a colonial dependency. There will be no pretense of independence—Vietnam will remain firmly under French control for the foreseeable future."
#End

#Focus Descs
VIE_Beg_for_Econ_Self_Determination_desc: "Vietnam must be economically self-governed, and the French must recognize that with us as a partner rather than a client state, we can achieve more and can build a great economic system that suits us."
VIE_Auction_off_Imperial_Treasures_desc: "The riches of a bygone era can still serve a use for us. The royal treasures that have served the Emperors of the past may still garner a high price on the international market, and that money can be used to infuse our burgeoning national industry."
VIE_Expand_Saigon_Radio_desc: "With spare money and further investments, the aged Radio Saigon shall become a great broadcasting tool for Bao-Dai's agendas and as-well broadcasting useful information into our subjects' hearts!"
VIE_Limited_Industrial_Expansion_desc: "Cautious expansion is the key to steady growth, and in a country that relies on less-than-stable cash flow, we must limit how fast we grow. That will mean a steady hand at the helm and new opportunities to come as they are naturally."
VIE_Form_3_Ministries_desc: "In order to keep growing, we must look to acquire funding from all possible sources. This could mean taking on loans from French banks in order to expand businesses and operate new sources of income for our country."
VIE_Expand_Local_College_Technique_desc: "There is one thing that will always produce a return on investment, and that is education. We need to allocate funding to create a new group in our society of technical experts. We need a generation to have opportunities to help modernise our economy. The reason many countries advance is due to innovation. If we begin to nurture a new highly educated class in society, then Vietnam will become a hub of innovation."
VIE_Invite_French_Investors_desc: "The French businesses that pulled out of our country due to the unrest in the streets hurt our economy badly, but with control reestablished, we can invite them back. Their help will ensure that our industry continues to grow."
VIE_Import_IBM_Computers_desc: "The smooth-talking salesmen of IBM have a solution for everything. Apparently, computers will be able to solve almost every problem. Well, they'll never play chess, but maybe that can help monitor the insurgency system. For a low price, we have been told that a computer system can use punch cards to monitor our success in pacification and track our logistics system. Even the Pentagon uses these computers; we don't want to fall behind. Vietnam will enter the cyber age!"
VIE_Establish_HoaXa_Vietnam_desc: "The railways in this country have suffered from critical war damage, and they lack the ability to carry our industry. We must commission a company to help us repair the lines and help us reconnect the vital arteries of our nation."
VIE_TongTruong_TaiChinh_KinhTe_desc: "The French are receptive to giving us more economic aid, and loans have come available for us to use. In order to use them successfully, we must ensure that the conditions are right and our industries are ready for the repercussions."
VIE_TongTruong_CanhNong_desc: "Though Saigon is a hotbed for light and heavy industry of all types, it is still a city surrounded by farmland, and we can use it to our advantage. Commercial farming must be an important part of our slow march to economic prosperity, and the land in Saigon would be a key part of our commitment."
VIE_TongTruong_CongChanh_GiaoThong_desc: "Though the railways have been hit very hard, the roads fair little better. Many are still dirt roads, apart from the main highways. This requires an initiative on our part, to rebuild damaged sections of the road, and to pave parts of some roads that are used more than others."
VIE_Introduce_Dong_Currency_desc: "At last, we are ready to break from tradition and impose economic independence with the currency we will use. The Vietnamese Dong, the new banknote that will be in circulation, will be backed by strong banks and a strong commitment by the government."
VIE_SmallScale_Agri_Reforms_desc: "The way of life in the Central Highlands and for much of the country is the farming community. Improving their crop yields will also mean a steady hand, as pushing too hard too fast may destroy the farmers and their families, and we need to pursue growth with caution."
VIE_Widen_Thienly_Highway_Roads_desc: "The Central Highways of the country have long been the most reliable source for trucks, cars, and bikes. It serves the country well, and it should be improved and widened, so that we can move more material and industry through it."
VIE_Mimic_Northerns_Economic_Reforms_desc: "In improving our economy, we must look to see what others do, In the North, we have recognized that many methods may be implemented in our strategies to help make our industries run better."
VIE_Open_IBM_Service_Office_decs: "For a number of years, the US Computer Giant IBM has been looking to expand its operations into Vietnam. With so many military operations, they think their products could be of assistance. Looking at the current mess that is our Joint Staffs, they could be right. By established a head office, it will allow us to communicate and order from IBM quickly. Perhaps we might get a bulk discount?"
VIE_Further_Inveset_in_Saigon_desc: "Saigon is filthy and free. The pearl of our nation and the heart of its burgeoning industry, we have the means and the capital to invest in it. Our civilian industry must be bolstered, and our infrastructure must be improved in order to make the city in to a capital that could contend with any in the region."
VIE_Permit_American_Investments_desc: "The glory of the American market - the envy of capitalist nations around the world - is a spectacle to behold, and now we will have our piece of it. American businesses have recognized us as a new partner, and have expressed interest in setting up in our country."
VIE_Import_American_Tech_desc: "Since the war ended, American technological advancement in industrial sectors has improved their capabilities by leaps and bounds. We must make connections with these industries, and hopefully license these new assets."
VIE_Expand_Rubber_Line_desc: "Rubber is the number-one most important exported resource that Vietnam controls, and we must capitalize on this by expanding our boundaries and exploring growth. Ensuring that we can build new rubber plants will be crucial in our goals in bringing in more income and trade."
VIE_Invest_CEE_Operations_desc: "It has become evident to us that the CEE's (Compagnie des Eaux et d'Electricite' de Saigon) equipment in recent years has become outdated, and is in dire need of further investments and modernization which we will now issue."
VIE_Repair_DaLatThapCham_Railway_desc: "The Da Lat-Tham Cham Railway is one of the few railway arteries at our disposal in the south, and it requires constant upkeep in its current state. With new investments and technological improvements, it can be another vital vein in the body of the industrial base."
VIE_Protect_French_Plantation_Owners_desc: "The French plantations of old, having long been stocked and worked by Vietnamese farmers, young children and old men, must now serve us. Though many wish to have the land split up for use by smaller farmers and more families, we must protect the holdings, for they are an important industrial supplier of food."
VIE_Electrify_Rural_Nam_Phan_desc: "The rural regions of Nam-phan have always been backwards and outdated for centuries and largely still are. Thus electrification would be the foundation for further Industrialization and investments in the Region."
VIE_Repair_SaigonMytho_Railway_desc: "The Saigon-Mytho Rail line is quickly becoming an important - and antiquated - way for industry to move the fruits of our labor. Our government has recognized that we should devote some capital to improving or expanding the rail lines to better serve us."
VIE_Export_Rubber_Natural_Resources_desc: "With our new capabilities, we can now increase rubber production and exportation, and our other resources have also caught up with other countries, meaning we can now afford to open up larger trade ports and trading laws."

VIE_Establish_DacPhu_DanTien_Cuoc_Commission_Econ_desc: "The Dac-Phu Dan-Tien Cuoc Commission will be established to oversee economic development and coordinate industrial planning. This commission will work to integrate Cuong-De's economic vision with practical development goals, ensuring that our economic policies serve both the people and the state's strategic interests."
VIE_CD_Expand_Saigon_Radio_desc: "With spare money and further investments, the aged Radio Saigon shall become a great broadcasting tool for Cuong-De's agendas and as-well broadcasting useful information into our subjects' hearts!"
VIE_CD_Limited_Industrial_Expansion_desc: "Cautious expansion is the key to steady growth, and in a country that relies on less-than-stable cash flow, we must limit how fast we grow. That will mean a steady hand at the helm and new opportunities to come as they are naturally."
VIE_CD_Form_3_Ministries_desc: "In order to keep growing, we must look to acquire funding from all possible sources. This could mean taking on loans from French banks in order to expand businesses and operate new sources of income for our country."
VIE_CD_Expand_Local_College_Technique_desc: "There is one thing that will always produce a return on investment, and that is education. We need to allocate funding to create a new group in our society of technical experts. We need a generation to have opportunities to help modernise our economy. The reason many countries advance is due to innovation. If we begin to nurture a new highly educated class in society, then Vietnam will become a hub of innovation."
VIE_CD_Invite_French_Investors_desc: "The French businesses that pulled out of our country due to the unrest in the streets hurt our economy badly, but with control reestablished, we can invite them back. Their help will ensure that our industry continues to grow."
VIE_CD_Import_IBM_Computers_desc: "The smooth-talking salesmen of IBM have a solution for everything. Apparently, computers will be able to solve almost every problem. Well, they'll never play chess, but maybe that can help monitor the insurgency system. For a low price, we have been told that a computer system can use punch cards to monitor our success in pacification and track our logistics system. Even the Pentagon uses these computers; we don't want to fall behind. Vietnam will enter the cyber age!"
VIE_CD_Establish_HoaXa_Vietnam_desc: "The railways in this country have suffered from critical war damage, and they lack the ability to carry our industry. We must commission a company to help us repair the lines and help us reconnect the vital arteries of our nation."
VIE_CD_TongTruong_TaiChinh_KinhTe_desc: "The French are receptive to giving us more economic aid, and loans have come available for us to use. In order to use them successfully, we must ensure that the conditions are right and our industries are ready for the repercussions."
VIE_CD_TongTruong_CanhNong_desc: "Though Saigon is a hotbed for light and heavy industry of all types, it is still a city surrounded by farmland, and we can use it to our advantage. Commercial farming must be an important part of our slow march to economic prosperity, and the land in Saigon would be a key part of our commitment."
VIE_CD_TongTruong_CongChanh_GiaoThong_desc: "Though the railways have been hit very hard, the roads fair little better. Many are still dirt roads, apart from the main highways. This requires an initiative on our part, to rebuild damaged sections of the road, and to pave parts of some roads that are used more than others."
VIE_CD_Introduce_Dong_Currency_desc: "At last, we are ready to break from tradition and impose economic independence with the currency we will use. The Vietnamese Dong, the new banknote that will be in circulation, will be backed by strong banks and a strong commitment by the government."
VIE_CD_SmallScale_Agri_Reforms_desc: "The way of life in the Central Highlands and for much of the country is the farming community. Improving their crop yields will also mean a steady hand, as pushing too hard too fast may destroy the farmers and their families, and we need to pursue growth with caution."
VIE_CD_Widen_Thienly_Highway_Roads_desc: "The Central Highways of the country have long been the most reliable source for trucks, cars, and bikes. It serves the country well, and it should be improved and widened, so that we can move more material and industry through it."
VIE_CD_Mimic_Northerns_Economic_Reforms_desc: "In improving our economy, we must look to see what others do, In the North, we have recognized that many methods may be implemented in our strategies to help make our industries run better."
VIE_CD_Open_IBM_Service_Office_decs: "For a number of years, the US Computer Giant IBM has been looking to expand its operations into Vietnam. With so many military operations, they think their products could be of assistance. Looking at the current mess that is our Joint Staffs, they could be right. By established a head office, it will allow us to communicate and order from IBM quickly. Perhaps we might get a bulk discount?"
VIE_CD_Further_Inveset_in_Saigon_desc: "Saigon is filthy and free. The pearl of our nation and the heart of its burgeoning industry, we have the means and the capital to invest in it. Our civilian industry must be bolstered, and our infrastructure must be improved in order to make the city in to a capital that could contend with any in the region."
VIE_CD_Permit_American_Investments_desc: "The glory of the American market - the envy of capitalist nations around the world - is a spectacle to behold, and now we will have our piece of it. American businesses have recognized us as a new partner, and have expressed interest in setting up in our country."
VIE_CD_Import_American_Tech_desc: "Since the war ended, American technological advancement in industrial sectors has improved their capabilities by leaps and bounds. We must make connections with these industries, and hopefully license these new assets."
VIE_CD_Expand_Rubber_Line_desc: "Rubber is the number-one most important exported resource that Vietnam controls, and we must capitalize on this by expanding our boundaries and exploring growth. Ensuring that we can build new rubber plants will be crucial in our goals in bringing in more income and trade."
VIE_CD_Invest_CEE_Operations_desc: "It has become evident to us that the CEE's (Compagnie des Eaux et d'Electricite' de Saigon) equipment in recent years has become outdated, and is in dire need of further investments and modernization which we will now issue."
VIE_CD_Repair_DaLatThapCham_Railway_desc: "The Da Lat-Tham Cham Railway is one of the few railway arteries at our disposal in the south, and it requires constant upkeep in its current state. With new investments and technological improvements, it can be another vital vein in the body of the industrial base."
VIE_CD_Protect_French_Plantation_Owners_desc: "The French plantations of old, having long been stocked and worked by Vietnamese farmers, young children and old men, must now serve us. Though many wish to have the land split up for use by smaller farmers and more families, we must protect the holdings, for they are an important industrial supplier of food."
VIE_CD_Electrify_Rural_Nam_Phan_desc: "The rural regions of Nam-phan have always been backwards and outdated for centuries and largely still are. Thus electrification would be the foundation for further Industrialization and investments in the Region."
VIE_CD_Repair_SaigonMytho_Railway_desc: "The Saigon-Mytho Rail line is quickly becoming an important - and antiquated - way for industry to move the fruits of our labor. Our government has recognized that we should devote some capital to improving or expanding the rail lines to better serve us."
VIE_CD_Export_Rubber_Natural_Resources_desc: "With our new capabilities, we can now increase rubber production and exportation, and our other resources have also caught up with other countries, meaning we can now afford to open up larger trade ports and trading laws."

VIE_Asian_Desk_desc: "We have an important role to play in Asian affairs. Although not the largest nation in Asia, we have a spirit and resolve that can easily sway the balance of a conflict. But we must pick carefully how we apply ourselves. We don't want to become overstretched in fixing the problems of all Asian countries."
VIE_Western_Desk_desc: "It's a sad reality that it is difficult to operate in this world without the backing of the West. Although the age of imperialism is supposedly dying, it seems that it is not dying but simply morphing into something new. We need to prep our diplomats so that they can get the Western powers on our side. With their support, we will have their industrial might and diplomatic sway behind our nation, and we will be able to expand our influence worldwide."
VIE_Demand_Japanese_Deport_CuongDe_desc: "It is disturbing enough to know of the efforts of Cuong-De to undermine our government, but it is insulting to know that the Japanese government refused to repudiate his attempts. Utilizing political pressure, we must demand that he be deported back to Vietnam, to answer for himself."
VIE_Negotiate_Brevet_Lines_desc: "The Brevet Lines, the nautical borders that separate Nationalist Chinese and Vietnamese claims, have been a point of contention. The Kuomintang has made moves to suggest that they believe they are the rightful owners of Vietnamese islands in the South. This requires us to negotiate with the Cambodians to clarify the border situation."
VIE_Demand_PhuQuoc_Ownership_desc: "The Nationalist Chinese have gone too far, first in posturing that the island of Phu-Quoc is theirs, and now we have seen armed military personnel moving in positions on and nearby the islands. This is far too much for our government to stand by and accept. We must make strong statements to dispel the illusions that the Kuomintang suffer from."
VIE_PhuQuoc_Launch_Invasion_desc: "The time for politics is past. The Kuomintang have ignored all warnings. Our military is prepared to launch a full invasion of the island to take back what is ours. We will not be denied the property we own."
VIE_Focus_on_Other_Matters_desc: "Military action against KMT incursions in the Phu Quoc region is not the major concern, other matters must take more of our time and effort. We will concern ourselves with the border question when we come to it."
VIE_Beg_Pulo_Condore_Return_desc: "The Con-Dao islands, known to the French as Pulo Condore, have served as their prison archipelago in the South China Sea for nearly a century. With the colonial chapter closing, we have asked Paris to return the islands to Vietnamese administration. There is little doubt they belong to us. Whether France agrees is another matter."
VIE_Denounce_VietQuoc_Republic_desc: "The VNQDD faction that seized Phu-Quoc has declared it a separate republic, calling it the Viet-Quoc Republic. They claim to represent true Vietnamese nationalism, but their island statelet is nothing more than a breakaway faction holding territory. Our foreign ministry will issue statements making clear that no self-proclaimed Vietnamese government outside Saigon holds any legitimacy."
VIE_Proclaim_Sole_Viet_State_desc: "The Viet-Quoc Republic refuses to dissolve and the communist regime in Hanoi claims to speak for all Vietnamese. We cannot stay quiet. The government in Saigon is the sole legitimate state of the Vietnamese people, and our foreign ministry will press this position through every diplomatic channel available."
VIE_Sabatoge_VietQuoc_Gov_desc: "The Viet-Quoc Republic's hold on Phu-Quoc rests on VNQDD patronage and little else. Our intelligence services will find the fault lines, whether that means cultivating opposition voices, pressuring their supply lines, or turning officers against their commanders. A government with no popular base is not difficult to unravel."
VIE_Launch_Second_Invasion_desc: "Diplomacy has produced nothing. Our efforts to undermine the Viet-Quoc Republic from within have weakened them but not broken them. There is one option remaining: a second expedition to Phu-Quoc to finish what we started. The island will be ours."
VIE_Focus_on_Other_Matters_Final_desc: "The second invasion has failed. Our forces could not hold the island against determined Viet-Quoc resistance, and continuing the campaign would cost us far more than Phu-Quoc is worth. We are pulling back and leaving this chapter behind."
VIE_Regarding_French_Drawn_Borders_desc: "In our continuing border disputes with the Nationalist Chinese, we will have to rely and possibly rework the classical borders written by our original colonial overlords. While fair and solid for a long time, now we must rework them and ensure that these pitiful squabbles end."
VIE_Accept_DeFacto_TranNinh_desc: "In an effort to bring peace, we have elected to agree to the borders that the French have drawn up. While we do not feel it punishes the KMT for their efforts against us on our borders, those borders, properly enforced, will work."
VIE_Claim_TranNinh_desc: "With the question of our borders up in the air, we must take the opportunity to claim the region of Tran Ninh, full of villagers and people who identify as Vietnamese, and are more closely connected to us than the Laotians."
VIE_Pau_Treaty_desc: "Our diplomats with the French have committed to finding a breakthrough in negotiating our financial independence, and we have found that our French counterparts are sympathetic to the cause. We will work to ensure that Vietnamese financial freedom is in our hands above all else."
VIE_Sign_Autonomous_Forex_Agreement_desc: "With our agreement with the French, we have on our plate the ability to sign an agreement that will allow us to open the trading and exchanging of currency. Another step in our financial freedom is secured, and Vietnam can finally begin to pull away from our colonial roots."
VIE_Accept_Foreign_Affairs_Administrative_Duties_desc: "We have prepared ourselves well for the prospect of managing our own affairs and the affairs of state elsewhere in the world, and it is time for us to step into the shoes of foreign and internal policymaking. Ensuring our resources and political bounds permit us to do so, we shall begin to carve our own path."
VIE_Matignon_Treaty_desc: "The French have decided to wash their hands completely of Vietnam, and are ready and willing to sign a treaty announcing their total withdrawal from the region. At last, our independence is being assured by the government, and a conference in Matignon will formalize Vietnam's total independence. Freedom has been achieved!"
VIE_Beg_Crown_Domain_French_Renouncement_desc: "Our French allies have inadvertently caused a political headache for us by not outright denouncing or renouncing the hold the crown has on the people up to this point. While France does not see the harm in this, they are in fact creating resistance to our government in areas where royalist beliefs are strong."
VIE_Korean_War_desc: "Korea is embroiled in a conflict similar to our own; a power vacuum has been created, and the evil forces of communism are seeking to sink their teeth into the newly established nation. We must do something to prevent this, but how much can we really spare in our intervention? If we allow South Korea to fall, a domino effect might occur across Asia and new republics like our own might be snuffed out by the menace of Marxism."
VIE_Korean_Intervention_desc: "Our efforts to supply the Korean soldiers in their effort against the communists are not enough. Our national defense administration has committed themselves to preparing an expeditionary force to help solidify the defense of liberty against the Chinese and their North Korean puppets."
VIE_Accept_Rhee_Proposal_desc: "Syngman Rhee and Chiang Kai-shek, two of the largest movers and shakers in the region, have let our people know that they are prepared to offer us a hand in a movement to unite many of the countries of Asia under a unified banner of political cooperation in the face of communism. It is a proposal we cannot turn away from, our goals are aligned and our duty to the world is on full display."
VIE_Ignore_Rhee_Proposal_desc: "Syngman Rhee and Chiang Kai-shek, two of the largest movers and shakers in the region, have let our people know that they are prepared to offer us a hand in a movement to unite many of the countries of Asia under a unified banner of political cooperation in the face of communism. Though interesting, it is not within the goals of our nation to cooperate currently with foreign bodies. Indeed, their interference would only damage our ability to run the war as we see fit."
VIE_Attract_US_Support_desc: "In our effort against our enemies, our greatest ally is the American government. Steadfast maintenance of our government must now involve full cooperation, and the great resources of the United States will give us the edge we need."
VIE_Greenlight_American_Intervention_desc: "America has voiced its willingness to enter the conflict on our side, not content to simply help. With their military might and economic power, we will surely vanquish our enemies in the North and end this bitter conflict."
VIE_A_Change_in_Course_desc: "In order to improve inwards, we must look outwards to our close Asian brothers and see how they have managed their affairs. We must move on from the influences of French affairs in our decisions, and chart our own path."
VIE_Look_up_to_Japan_desc: "The affairs of the Japanese in developing a stable post-war government and their way of government have influenced our way of thinking. It is time for us to consider following their lead more closely, in order to ensure continued success."
VIE_Allow_Japanese_Investments_desc: "Allow Japanese Invesetments"
VIE_Promote_PanAsianism_desc: "Our roots have always been mixed with our Asian brothers, and with the world finally beginning to come together to achieve common goals, it is time for us to enter the world as a positive influence in our global community."
VIE_Announce_Victory_over_Communism_desc: "Our long national nightmare is past, our victory over the communists is total, and we are ready to declare our forthcoming declaration that Vietnam is a red-infested state no longer!"
VIE_Accept_Geneva_Treaty_desc: "Our dastardly cruel enemies to the North have fought us to a bitter standstill, and our political allies have us in a corner, saying that we should accept the terms being presented in Geneva that would split our country in two. While we hate this idea with our fullest minds, we cannot deny the war has progressed in a way we cannot guarantee our success. We must bite the bullet and accept the terms."
VIE_Resettle_Malaysian_Refugees_desc: "Chin-Peng's forces have swept through Malaya, driving thousands of anti-communist Malayan families north to our shores. We will settle them in the provinces of southern Vietnam, where their numbers add to our workforce and fill out communities hollowed out by years of war. They are not strangers to what we face."
VIE_Recognize_SWK_desc: "Sarawak has emerged as an independent state in Borneo. We will formally recognize Sarawak's sovereignty, establishing diplomatic relations and opening channels for cooperation. This recognition will strengthen our position in Southeast Asia and create opportunities for trade and regional collaboration."
VIE_Recognize_MAL_desc: "Malaysia has achieved independence and established itself as a sovereign nation. We will recognize Malaysia's independence and seek to establish friendly relations. As fellow Southeast Asian nations, we share common interests in regional stability and economic development."
VIE_Recognize_NBO_desc: "North Borneo has declared independence and established its own government. We will recognize North Borneo's sovereignty, opening diplomatic channels and establishing trade relations. This recognition will expand our diplomatic presence in the region and create new opportunities for cooperation."

VIE_Amalgamatize_VeBinh_Paramilitaries_desc: "In order for us to win the conflict, we will need to recruit the paramilitary sects that have, until recently, not been interested in taking a side. Their efforts will help to bring stability and legitimacy to our regime."
VIE_Recommision_WW_Native_Veterns_desc: "Our combat effectiveness only goes as far as our general staff. In order to win the war, we will have to enlist the help of veteran leaders who have fought in the greatest wars of our generation. Their services will ensure our victory in any struggle."
VIE_Recall_French_ProFrench_Native_Officers_desc: "To beat a new enemy, we must make deals with old friends. The French forces and their allies that have been expelled from the country must return, in order to turn the tide against any of our foes."
VIE_Organize_VoBi_Mil_Academies_desc: "Our military tradition is one born in the heat of our conflicts with our oppressors. As such, we have access to some of the best teachers of war in the country, and we can use them to train our next generation of heroes and commanders."
VIE_National_Army_Vietnam_desc: "The time for the unity of the nation in the struggle we face has come. With this declaration and with some reorganization, the National Army of Vietnam will lead us to glory."
VIE_Organize_Vietnamese_BoQuocPhong_desc: "Our efforts in the countryside have led to the necessity for an organizing of forces and an evaluation of the strategy we have employed. A fresh look from the generals could provide the answers we need."
VIE_Form_JointStaffs_desc: "It is time to bring about the best minds in Vietnam to decide the course of the war. Our government needs a joint staff to make the key decisions that will end this war with a victory."
VIE_Organize_National_Mobilization_desc: "The time to organize and grow our forces for the coming fight has come. We must sound the horns of mobilization in order to destroy our enemies with the force of our new capabilities."
VIE_Incorporate_Religious_Sects_BinhXuyen_Forces_desc: "In order to gain legitimacy in the South, we most cooperate with entities not totally sympathetic to our cause. The religious sects in the Mekong Delta and the Binh-Xuyen crime syndicate have been a thorn in our side for years, but if we can “convince” them to work with us, we will have gained a powerful ally."
VIE_Deal_Leroys_Ambitions_desc: "It is time to survey the options. The situation with Leroy has reached an impasse, and we may not get another chance to make a decision on what to do."
VIE_Rescue_PhatDiem_Catholic_Militias_desc: "The Catholic Militias in and around the city of Saigon have run into trouble dealing with forces in the area. Helping them will cause issues with the Buddhist population in the region, but it is a tradeoff we must be willing to make in order to retain our hold on the area."
VIE_Expand_QuanCu_Foundries_desc: "With peace achieved in Saigon, we can now begin to work on our economic foundations. The foundries in Quan-cu will be important in revitalizing our military industrial base, and give us an edge over our enemies."
VIE_Contact_PhuDai_Army_desc: "We have arranged to contact a possible important ally to our Northeast. The Phu-Quoc island is inhabited by warlords and former officials sympathetic to our government, and we have plans to take control of the island."
VIE_Contact_DaiViet_War_Bases_desc: "It has come to our attention that the Dai-Viet Party and their paramilitaries including the Hung-Viet and Viet-Sinh Doan are organizing and expanding themselves in the following bases: Nguyen-Hue and Chau-Doc. It is our utmost concern to quickly seize their assets and bases for our national protection effort."
VIE_Organize_Recon_Armored_Battalions_desc: "Investing in better and deadlier armaments is paramount in this struggle. We must find a way to bring in heavier equipment ot arm our recon units."
VIE_Section_Marine_desc: "With its long coastline and numerous maritime trade routes, our young nation is in dire need of a dedicated navy to protect its territorial waters and vital sea lanes. This development was a natural response to the growing importance of maritime security in safeguarding the country's sovereignty and countering emerging regional threats.\n\nThe formation of the National Army's Section Marine shall mark a crucial milestone in our military history, ensuring that Vietnam possesses a formidable presence not only on land but also at sea. Equipped with modern vessels, patrol boats, and coastal defense assets courtesy of French support, it is our goal to become a renowned force in the turbulent waters of Southeast Asia."
VIE_Establish_DINA_Units_desc: "The Division Navale d'Assaut (DINA) will be established as elite mechanized marine units. These specialized forces will combine naval capabilities with mechanized infantry, creating a formidable amphibious assault force. The DINA units will be equipped with the latest French equipment and trained for complex coastal operations."
VIE_Form_Infanterie_Marine_desc: "Marine divisions are the backbone of the military operations in Asia, and we should be following suit. Training men and acquiring material for initial training will be suitable for preparing us for a unique part of warfare."
VIE_Form_NhaTrang_Training_Center_desc: "Nha-Trang will become the center for naval officer training. This training facility will produce skilled naval officers capable of commanding our growing fleet. The center will provide comprehensive training in naval tactics, ship operations, and maritime strategy, ensuring our navy has the leadership it needs."
VIE_Expand_LienDoan_TuanGiang_desc: "To expand our naval capabilities, we must acquire more ships. The French have the equipment and capacity that we need, and we must proceed with diplomatic actions to acquire more."
VIE_Recieve_French_Naval_Equipment_desc: "With the Geneva Conference approaching, the French are preparing to transfer naval assets to us. We will receive French naval equipment, including ships, landing craft, and marine equipment. This transfer will significantly enhance our naval capabilities and provide us with the tools needed for coastal defense and amphibious operations."
VIE_Section_Air_desc: "Vietnam's conflicts have been primarily decided by the power of the air, and we have had issues in the past. Designing and producing our own air power will be difficult, but we can start the process of producing a deadly and formidable air force."
VIE_Vietnamized_Air_Officer_Corp_desc: "The academies we have opened are producing results, and our factories are ready to produce new planes and finally we can begin to fly. The road to start will be rough, but it is a mission we cannot fail at."
VIE_Recruit_TieuDoan_NhayDu_desc: "The use of Paratrooper divisions in war has become a staple, and with our new air capabilities, we must explore the possibilities in making it a critical part of the way we wage war in the Central Highlands."
VIE_Expand_PhiTruong_QuanSu_NhaTrang_desc: "While many former French and British airfields are in our grasp, we must also build our own, and the Nha-Trang Valley is the perfect place to launch and coordinate missions."
VIE_Mission_Militarie_Franccaise_Indochine_desc: "Our French allies have agreed to provide more support to our struggle. With our support, we can acquire advisors to train our troops and a supply of arms."
VIE_Coordinate_with_CEFEO_desc: "In order for us to continue to control the countryside, we must look to other foreign options. We can look to the CEFEO to provide us with foreign legions to bolster our forces."
VIE_Request_Control_over_French_KhinhQuan_desc: "The forces under the control of the French must be used for our benefit. We need all the forces we can acquire in this struggle."
VIE_Organize_ComManDo_Units_desc: "We still need to bolster our forces in order to secure the country. Bringing up a Division of the Con-man-do will help us to retain our security in the region."
VIE_Implement_French_Equipment_Tactics_desc: "Our French allies have agreed to send us a massive infusion of weapons and heavy armor, and with these materials, we can begin to turn the jungle into less of an obstacle. With these weapons, we can turn our forward divisions into a deadly implement of war."
VIE_Accept_American_Mil_Aid_desc: "The Americans, like the French, have supported our efforts, but now we must acquire more aid. The infusion of new American weapons, and the use of American manufacturing power to produce more equipment for us will be a crucial step in our ability to conduct operations."
VIE_Implement_Trad_Tactics_desc: "The tactics of old often are not the tactics of the present, but the French do not understand the field of play. We have been fighting in this place since the dawn of time, and we know the land and the way the land plays into our hand better than anyone, and we will use that to destroy our enemies."
VIE_Encourage_Homemade_Arms_desc: "This war is one made from the seeds of convenience, and the people have been forced to become creative with their abilities to defend their homes. We must encourage these actions in order to slow the progress of our enemy in the countryside."
VIE_Expand_Territoire_Autonome_Battalions_desc: "The best bet for security in the countryside is to bolster the strength of our forces. In the Native Lands, many militias and warlord forces can be recruited to our cause. Their support will lead us to victory in the countryside."
VIE_Modernize_Tribal_Arsenals_desc: "The Tribal helpers in the Central Highlights have been interfering with our enemies' efforts, and this must be encouraged. We can provide them with arms and ensure that their efforts are deadlier."
VIE_Encourage_Terror_Tactics_desc: "Fighting fire with fire is apt in this bloody conflict. Our enemies do not have pause in their brutal actions, and neither should we. It is time to hit them where it hurts, and we have the means to weaken their effectiveness"
VIE_Form_Muong_National_Army_desc: "We have prepared men and material for the formation of the Muong National Army, in order to project our control over the region and ensure security from our enemies."
VIE_Establish_Autonomous_Command_Staffs_desc: "An autonomous and elastic command structure is necessary for a complicated war like this. We are going to expand and restructure our chain of command in order to suit the situation better."
VIE_Modernize_Autonomous_Armies_Orgs_desc: "With the advancement of our own military strength, it would make sense to consider doing the same with our warlord allies. Providing them with arms and equipment to keep them up to date will help us fight our enemies."
VIE_Incorporate_Irregular_Units_desc: "As the war goes on, the irregular forces of the tribal groups in the countryside have grown stronger. Now, with the war intensifying, we must draw from their strength again in order to fight off the enemy's influence from the countryside."
VIE_Perfect_Guerrilla_War_desc: "Our enemies have used it, but we will be the ones to perfect it. Understanding how to control the battlefield at large, from the hamlets to the jungle floors, will be crucial in the way that we will win conflicts in our homeland, and it will cost a country everything to dare attack us."
VIE_Section_Air_Irregular_desc: "The French Planes in service here were very successful at their operations, and we must acquire them to train our future pilots. We must also get advisors to help us train the new generation of air commanders."

VIE_ReEstablish_VietKienQuocQuan_Mil_desc: "Our military is currently disorganized as religious militias and Binh-Xuyen paramilitary control a significant portion of our nation and our armed forces. Let us consolidate a professional military in our war against the Viet-minh."
VIE_CD_Recommision_WW_Native_Veterns_desc: "Our combat effectiveness only goes as far as our general staff. In order to win the war, we will have to enlist the help of veteran leaders who have fought in the greatest wars of our generation. Their services will ensure our victory in any struggle."
VIE_CD_Organize_VoBi_Mil_Academies_desc: "Our military tradition is one born in the heat of our conflicts with our oppressors. As such, we have access to some of the best teachers of war in the country, and we can use them to train our next generation of heroes and commanders."
VIE_CD_National_Army_Vietnam_desc: "The time for the unity of the nation in the struggle we face has come. With this declaration and with some reorganization, the National Army of Vietnam will lead us to glory."
VIE_CD_Organize_Vietnamese_BoQuocPhong_desc: "Our efforts in the countryside have led to the necessity for an organizing of forces and an evaluation of the strategy we have employed. A fresh look from the generals could provide the answers we need."
VIE_CD_Form_JointStaffs_desc: "It is time to bring about the best minds in Vietnam to decide the course of the war. Our government needs a joint staff to make the key decisions that will end this war with a victory."
VIE_CD_Organize_National_Mobilization_desc: "The time to organize and grow our forces for the coming fight has come. We must sound the horns of mobilization in order to destroy our enemies with the force of our new capabilities."
VIE_CD_Incorporate_Religious_Sects_BinhXuyen_Forces_desc: "In order to gain legitimacy in the South, we most cooperate with entities not totally sympathetic to our cause. The religious sects in the Mekong Delta and the Binh-Xuyen crime syndicate have been a thorn in our side for years, but if we can “convince” them to work with us, we will have gained a powerful ally."
VIE_CD_Deal_Leroys_Ambitions_desc: "It is time to survey the options. The situation with Leroy has reached an impasse, and we may not get another chance to make a decision on what to do."
VIE_CD_Rescue_PhatDiem_Catholic_Militias_desc: "The Catholic Militias in and around the city of Saigon have run into trouble dealing with forces in the area. Helping them will cause issues with the Buddhist population in the region, but it is a tradeoff we must be willing to make in order to retain our hold on the area."
VIE_CD_Expand_QuanCu_Foundries_desc: "With peace achieved in Saigon, we can now begin to work on our economic foundations. The foundries in Quan-cu will be important in revitalizing our military industrial base, and give us an edge over our enemies."
VIE_CD_Contact_PhuDai_Army_desc: "We have arranged to contact a possible important ally to our Northeast. The Phu-Quoc island is inhabited by warlords and former officials sympathetic to our government, and we have plans to take control of the island."
VIE_CD_Contact_DaiViet_War_Bases_desc: "It has come to our attention that the Dai-Viet Party and their paramilitaries including the Hung-Viet and Viet-Sinh Doan are organizing and expanding themselves in the following bases: Nguyen-Hue and Chau-Doc. It is our utmost concern to quickly seize their assets and bases for our national protection effort."
VIE_CD_Organize_Recon_Armored_Battalions_desc: "Investing in better and deadlier armaments is paramount in this struggle. We must find a way to bring in heavier equipment ot arm our recon units."
VIE_CD_Section_Marine_desc: "With its long coastline and numerous maritime trade routes, our young nation is in dire need of a dedicated navy to protect its territorial waters and vital sea lanes. This development was a natural response to the growing importance of maritime security in safeguarding the country's sovereignty and countering emerging regional threats.\n\nThe formation of the National Army's Section Marine shall mark a crucial milestone in our military history, ensuring that Vietnam possesses a formidable presence not only on land but also at sea. Equipped with modern vessels, patrol boats, and coastal defense assets courtesy of French support, it is our goal to become a renowned force in the turbulent waters of Southeast Asia."
VIE_CD_Establish_DINA_Units_desc: "The Division Navale d'Assaut (DINA) will be established as elite mechanized marine units. These specialized forces will combine naval capabilities with mechanized infantry, creating a formidable amphibious assault force equipped with the latest French equipment and trained for complex coastal operations."
VIE_CD_Form_Infanterie_Marine_desc: "Marine divisions are the backbone of the military operations in Asia, and we should be following suit. Training men and acquiring material for initial training will be suitable for preparing us for a unique part of warfare."
VIE_CD_Form_NhaTrang_Training_Center_desc: "Nha-Trang will become the center for naval officer training. This facility will produce skilled naval officers capable of commanding our growing fleet, providing comprehensive training in naval tactics, ship operations, and maritime strategy to ensure our navy has the leadership it needs."
VIE_CD_Expand_LienDoan_TuanGiang_desc: "To expand our naval capabilities, we must acquire more ships. The French have the equipment and capacity that we need, and we must proceed with diplomatic actions to acquire more."
VIE_CD_Recieve_French_Naval_Equipment_desc: "With the Geneva Conference approaching, the French are preparing to transfer naval assets to us. We will receive French naval equipment, including ships, landing craft, and marine equipment — a transfer that will significantly enhance our coastal defense and amphibious capabilities."
VIE_CD_Section_Air_desc: "Vietnam's conflicts have been primarily decided by the power of the air, and we have had issues in the past. Designing and producing our own air power will be difficult, but we can start the process of producing a deadly and formidable air force."
VIE_CD_Vietnamized_Air_Officer_Corp_desc: "The academies we have opened are producing results, and our factories are ready to produce new planes and finally we can begin to fly. The road to start will be rough, but it is a mission we cannot fail at."
VIE_CD_Recruit_TieuDoan_NhayDu_desc: "The use of Paratrooper divisions in war has become a staple, and with our new air capabilities, we must explore the possibilities in making it a critical part of the way we wage war in the Central Highlands."
VIE_CD_Expand_PhiTruong_QuanSu_NhaTrang_desc: "While many former French and British airfields are in our grasp, we must also build our own, and the Nha-Trang Valley is the perfect place to launch and coordinate missions."
VIE_CD_Mission_Militarie_Franccaise_Indochine_desc: "Our French allies have agreed to provide more support to our struggle. With our support, we can acquire advisors to train our troops and a supply of arms."
VIE_CD_Coordinate_with_CEFEO_desc: "In order for us to continue to control the countryside, we must look to other foreign options. We can look to the CEFEO to provide us with foreign legions to bolster our forces."
VIE_CD_Request_Control_over_French_KhinhQuan_desc: "The forces under the control of the French must be used for our benefit. We need all the forces we can acquire in this struggle."
VIE_CD_Organize_ComManDo_Units_desc: "We still need to bolster our forces in order to secure the country. Bringing up a Division of the Con-man-do will help us to retain our security in the region."
VIE_CD_Implement_French_Equipment_Tactics_desc: "Our French allies have agreed to send us a massive infusion of weapons and heavy armor, and with these materials, we can begin to turn the jungle into less of an obstacle. With these weapons, we can turn our forward divisions into a deadly implement of war."
VIE_CD_Accept_American_Mil_Aid_desc: "The Americans, like the French, have supported our efforts, but now we must acquire more aid. The infusion of new American weapons, and the use of American manufacturing power to produce more equipment for us will be a crucial step in our ability to conduct operations."
VIE_CD_Implement_Trad_Tactics_desc: "The tactics of old often are not the tactics of the present, but the French do not understand the field of play. We have been fighting in this place since the dawn of time, and we know the land and the way the land plays into our hand better than anyone, and we will use that to destroy our enemies."
VIE_CD_Encourage_Homemade_Arms_desc: "This war is one made from the seeds of convenience, and the people have been forced to become creative with their abilities to defend their homes. We must encourage these actions in order to slow the progress of our enemy in the countryside."

VIE_Chinese_Civil_War_desc: "Our northern neighbor, China, is currently in a civil war between the Nationalist and the Communist. Let us wait and see who will come out as the victor of this war."
VIE_Congratulate_KMT_Victory_desc: "Despite all odds against them, the KMT managed to win in the civil war against the Communist. Let us congratulate the KMT in their victory and we could even commence an alliance with them against the communists."
VIE_Ignore_China_desc: "Regardless of whichever side wins in the civil war, China will still pose a threat against us for years to come. It would be best for us to focus on our internal affair rather than worry about Chinese affairs."
VIE_Criticize_Mao_Success_desc: "Mao and the Communists have won the Chinese Civil War. Let us join our western allies in condemning Mao and his new government and find way to help the KMT in exile."

VIE_Northern_Question_desc: "Our country has been divided long enough by different ideologies and geographical bounds. It's time to put this unhappy divorce into question as our people are starting to become more and more vocal about a potential restart to the Unification reconquest “Bac-tien“  as since the union with the Southern province of Vietnam? There haven't been any additional efforts to pressure the North into accepting Bao-Dai's dream of a unified Vietnam!"
VIE_Wait_It_Out_desc: "We are not ready yet, not now and not in the short term foreseeable future. They are well dug in and highly fanatical to the Marxist lies. We'll need to consider all available options of approach with the end goal of the unification not turning into a national disaster."
VIE_Prepare_Army_desc: "The time has come and the Northern Liberation “bac-tien“ of our nation is in front of us. The government has put out publications mobilizing all conscripts and calling for all militias and religious sects to turn their gaze up north. Unification is soon upon us and the communist demons will be annihilated!"

VIE_Northern_Question_CD_desc: "Our country has been divided long enough by different ideologies and geographical bounds. It's time to put this unhappy divorce into question as our people are starting to become more and more vocal about a potential restart to the Unification reconquest “Bac-tien“  as since the union with the Southern province of Vietnam? There haven't been any additional efforts to pressure the North into accepting Cuong-De's dream of a unified Vietnam!"
VIE_Wait_It_Out_CD_desc: "We are not ready yet, not now and not in the short term foreseeable future. They are well dug in and highly fanatical to the Marxist lies. We'll need to consider all available options of approach with the end goal of the unification not turning into a national disaster."
VIE_Prepare_Army_CD_desc: "The time has come and the Northern Liberation “bac-tien“ of our nation is in front of us. The government has put out publications mobilizing all conscripts and calling for all militias and religious sects to turn their gaze up north. Unification is soon upon us and the communist demons will be annihilated!"

VIE_Elysee_Accords_desc: "At last, the time has come for the French to give us the autonomy we deserve. The treaty that will result from these talks will allow us to control our own destiny, and chart our own path."
VIE_Solidify_BaoDai_Authority_desc: "The Emperor's control over the country is one built on strong tradition and legitimacy. His rule will be a strong one, and the other nationalist groups will fall in line to make sure that we ensure full control."
VIE_Pressure_Cochinchina_Reunifcation_desc: "The region of Cochinchina has resisted our demands to reunify with the new government. Political pressure will be necessary in order to get them to fall in line, or else issues will cause us to pursue steps of dire consequence."
VIE_Beg_France_Intervention_desc: "Cochinchina's stubbornness have left us with no other choice. We have to ask the French to intervene in the effort, to pressure the region, with whatever means are necessary, to join with Bao-Dai's prospective government."
VIE_Reincorporate_Cochinchina_desc: "With Cochinchina falling in line, we can now take over the forces at Nam-Ky, and can officially proclaim that Vietnam is officially its own state. The hardest part is over."
VIE_Proclam_Etat_du_Vietnam_desc: "Our long national struggle has resulted in victory. Freedom from the unfair French oppression and a government to call our own. Emperor Bao-Dai will proclaim the State of Vietnam within the hour. What a glorious time. Viet Nam muon nam!"
VIE_Sideline_CuongDe_Ambitions_desc: "Cuong-De's ambition to lead the nation to a monarchistic democracy is strong, but Bao-Dai is not as passionate. Making sure his ambitions are muted will be a critical piece in ensuring this difficult time goes well."
VIE_CuongDe_Press_Conferences_desc: "It seems that Cuong-De is having press conferences in an attempt to convince foreign powers to back his return. Let us tap his communications so we can know his plan and prevent his return to Vietnam."
VIE_Intercept_CuongDe_Return_Bangkok_desc: "We have received news that Cuong-De is planning to sneak into Vietnam via Bangkok in disguise. Let us intercept him before he could return and cause any troubles."

VIE_Rebuild_BaoDai_Image_desc: "Bao-Dai's public image has been abysmal for a long time due to his hedonist lifestyle while ignoring the plight of the nation. Let us try to rehabilitate his image by limiting as much reports of his scandals as possible."
VIE_Tighten_Noose_On_Western_Journalism_desc: "The pen is mightier than the sword, and so we need to regulate it just like any other weapon. We can't have \"journalists\" wielding and invent dangerous fictions against our government. From today, the government will take a guiding hand in ensuring that the news is more \"factual\". Most importantly, we will ensure that corrupted journalists who are being paid to undermine government work do not get the front page or any page for any matters at all!"
VIE_Legalize_Casinos_Prostitutions_desc: "Our country's culture is relatively conservative, so opening casinos and allowing prostitution might seem like a bad idea… but it also sounds like a fun one. With these new industries, we will open a valuable new income stream for the government. We know that many of these things happen. Whether it is illegal or not, we might as well profit from it. This way, we can build our own gambling industry in Saigon with blackjack and hookers. "
VIE_Erase_Sex_Scandels_PayOff_Debts_desc: "It's not easy being a leader; every day, there is pressure to make the right decision, and everybody lets you know when you make a mistake. So it's no wonder that we like to gamble a bit and enjoy the company of beautiful companions. Unfortunately, the public doesn't understand the stress of power, and if word got out about our \"excesses\" then we could have a serious crisis. We can use our power to lean on any investigative journalists delving into the president's personal life; the only stories about the leader will be him helping old ladies cross the street, not using prostitutes. We can also tap the wealthy beneficiaries of our economic policies for \"donations\" to help pay off our mounting debts. Our virtuous image must be preserved!"
VIE_Expand_Grande_Monde_Casino_desc: "People love to gamble; not only our people but visitors from abroad are arriving to lose their hard-earned money in our casinos. The Grande-Monde casino is not only making record profits, but it is also is the largest currently in Southeast Asia; the time has come to expand the main hall of the casino. We will collaborate with our \"good friend\" Le-Van-Vien to add new games and more bars to the building. As well as this, there will be a number of beautiful decorations brought in by renowned world class designers. We will have a casino that rivals anything in Asia!"
VIE_DaLat_Summer_Vacation_desc: "Da Lat, with its cool climate and beautiful scenery, has long been a favorite retreat for the elite. We will promote Da Lat as a summer vacation destination, building luxury resorts and attracting wealthy visitors. This will generate revenue, boost tourism, and create a prestigious image for Vietnam as a modern, sophisticated nation."
VIE_Saigon_Pearl_of_Orient_desc: "Every region needs a point where everyone wants to be, a place where every luxury and amenity can be found. Saigon will be that city, a pleasure city where money washes in endlessly. We can build a city that the rest of Asia will marvel at. With a little investment and the continued success of our casino business, Saigon will be the Paris of Indochina. We have taken the first step, and now, we must just stay the course."
VIE_Form_CongXa_BietDien_desc: "The Cong-Xa Biet-Dien (Special Commando Battalion) will be formed as an elite special forces unit. These highly trained commandos will be equipped with the latest French equipment and trained for covert operations, reconnaissance, and special missions. The battalion will serve as our elite strike force, capable of operating behind enemy lines."
VIE_Using_Sect_Resources_desc: "The religious sects control significant resources, including land, money, and manpower. We will work to integrate these sect resources into the national economy and military. By cooperating with the Cao Dai, Hoa Hao, and other sects, we can tap into their wealth and organizational capabilities while maintaining their loyalty to the state."
VIE_Pacifying_NamPhan_Countryside_desc: "The Southern countryside of Vietnam is rife with many factions competing for influences, ranging from the Binh-Xuyen criminals to religious militias controlled by Caodaists, Hoahaoist, and Catholics. Let us rein in these factions in order to cement our control of Southern Vietnam."
VIE_Request_Control_Over_Crown_Domains_desc: "The Crown Domains are lands traditionally controlled by the emperor, generating significant revenue. We will request that the French transfer control of these domains to the Vietnamese government. This will provide us with valuable resources and demonstrate our growing autonomy from French colonial control."
VIE_1CP_Directive_desc: "The 1CP Directive will establish a new political framework, allowing us to appoint a Prime Minister and form a government. This directive marks a significant step toward Vietnamese self-governance, giving us the ability to make our own political decisions while still operating within the French colonial structure."
VIE_Assign_Long_PM_desc: "Nguyen Phan Long, a prominent journalist and politician, will be appointed as Prime Minister. Long is known for his moderate views and ability to work with the French while advocating for Vietnamese interests. His appointment will bring stability and experience to the government."
VIE_Assign_Vinh_PM_desc: "Tran Quang Vinh, a Cao Dai leader, will be appointed as Prime Minister. Vinh's appointment will strengthen our ties with the Cao Dai sect and bring their resources and support into the government. This will help integrate the religious sects into the national political structure."
VIE_Contain_Diem_Socialist_Ambitions_desc: "Ngo Dinh Diem has been showing socialist tendencies and ambitions that threaten the stability of our government. We must contain his influence and prevent him from gaining too much power. This will require careful political maneuvering to neutralize his socialist agenda while maintaining government unity."
VIE_Assign_Huu_PM_desc: "Tran Van Huu, an experienced administrator, will be appointed as Prime Minister. Huu has a reputation for competence and will focus on modernizing the Vietnamese army and improving relations with foreign powers. His leadership will bring professionalism and efficiency to the government."
VIE_Assign_Toan_PM_desc: "Nguyen Van Toan, a Hoa Hao leader, will be appointed as Prime Minister. Toan's appointment will bring the Hoa Hao sect into the government and help integrate their followers into the national political system. His leadership will focus on social reforms and anti-communist measures."
VIE_Exile_Diem_Political_Opponents_desc: "Ngo Dinh Diem and his political allies have become too dangerous to keep in the country. We will exile them, removing them from Vietnamese politics and preventing them from organizing opposition. This will eliminate a major threat to government stability and French interests."
VIE_Assign_Tam_PM_desc: "Nguyen Van Tam, a former colonial administrator, will be appointed as Prime Minister. Tam's experience in government administration and his connections to the French will help maintain stability and ensure smooth cooperation with the colonial authorities."
VIE_Assign_Quang_PM_desc: "Phan Huy Quang, a reform-minded politician, will be appointed as Prime Minister. Quang will focus on social reforms, labor rights, and urban development. His leadership will bring progressive policies to Vietnam while maintaining stability and order."
VIE_Reward_Loyal_Political_Parties_desc: "Political parties that have remained loyal to the government and supported our policies will be rewarded. We will provide them with positions, resources, and recognition, ensuring their continued support and creating a stable political base for the regime."
VIE_Assign_Loc_PM_desc: "Nguyen Phuc Buu Loc, a member of the imperial family, will be appointed as Prime Minister. Loc's royal connections and moderate politics make him an ideal choice to lead the government during this transitional period. His appointment will help maintain stability and legitimacy."
VIE_Accept_Geneva_Conference_desc: "The Geneva Conference has been called to resolve the Indochina conflict. We will accept the conference's decisions, recognizing that this is the best path forward for peace. While we may not get everything we want, accepting the conference's terms will end the war and allow us to focus on rebuilding and development."
VIE_Recall_Diem_desc: "Ngo Dinh Diem, who was previously exiled, will be recalled to serve as Prime Minister. Diem's return marks a significant shift in Vietnamese politics, bringing his personalist ideology and strong leadership to the government. His appointment will fundamentally change the direction of South Vietnam."
VIE_Redivert_Criticism_to_French_desc: "Rather than accepting blame for our problems, we will redirect public criticism toward the French. By blaming the colonial authorities for our difficulties, we can maintain domestic support while reducing French influence. This strategy will help us gain more autonomy and shift public opinion in our favor."
VIE_1955_Grand_Election_desc: "A grand election will be held to legitimize the government and give the people a voice in their future. This election will be a major political event, determining the direction of Vietnamese politics and potentially reshaping the government. The results will have far-reaching consequences for the nation."
VIE_Hinh_Coup_desc: "General Nguyen Van Hinh, with French backing, has launched a coup against the government. Hinh's military background and French connections make him a formidable opponent. This coup threatens to overthrow the current government and install a French puppet regime, ending Vietnamese autonomy."
VIE_BaoDai_Liberator_of_Vietnam_desc: "Bao Dai, the former emperor, will position himself as the liberator of Vietnam. By presenting himself as the true leader who can unite the nation and free it from foreign control, Bao Dai will seek to regain power and restore the monarchy, or at least establish himself as the legitimate ruler."
VIE_Why_Revolting_desc: "Revolts have broken out across Vietnam, and we must understand why. The people are rising up against the government, and we need to address their grievances. This focus will help us understand the root causes of the unrest and develop strategies to restore order and address popular concerns."
VIE_Stabilize_Urban_Areas_desc: "Urban areas have become centers of unrest and resistance. We must stabilize these regions, restoring order and government control. This will require a combination of security measures, economic improvements, and political reforms to win back the support of urban populations."
VIE_Fly_to_France_desc: "It seems that Bao-Dai's reign in Vietnam is over. The only option for him now is to head to France in exile for the rest of his life."

VIE_PM_Long_desc: "Nguyen-Phan-Long has been appointed as Prime Minister. A journalist and politician, Long brings a moderate approach to governance, seeking to balance Vietnamese interests with the realities of French colonial control."
VIE_Long_Promote_CalDaism_desc: "We will promote Cal-Daism, a syncretic religious movement combining elements of Cao-Dai and Hoa-Hao beliefs. This policy aims to create a unified religious identity that can bridge sectarian divides and strengthen national unity, though it may alienate some traditional Cao-Dai followers."
VIE_Long_Friendlier_USA_Ties_desc: "After Long's retirement from the premiership, we will pursue closer ties with the United States. This shift away from exclusive French dependency opens new opportunities for American support and weapon shipments, though it may strain relations with both France and the USA initially."
VIE_Long_Accept_HautCommissar_Discharge_desc: "We will accept the French High Commissioner's discharge of our government, acknowledging French authority over Vietnamese affairs. This pragmatic acceptance increases French favoritism and may lead to more stable relations, though it comes at the cost of Vietnamese autonomy."
VIE_Long_Accept_French_Rulership_desc: "If Long remains in power, we will fully accept French rulership over Vietnam. This decision prioritizes stability and French support over independence, improving relations with France but potentially alienating nationalist elements within the country."
VIE_Long_Winning_French_Favoritism_desc: "By demonstrating our loyalty and cooperation with French colonial authorities, we can win their favoritism and secure greater support for our government. However, this subservient approach may cost us stability and popular support at home."

VIE_PM_Vinh_desc: "Tran-Quang-Vinh, a Cao-Dai leader and nationalist, has been appointed as Prime Minister. His appointment brings Cao-Dai influence into the government and may help integrate the religious sects into the national framework."
VIE_Vinh_Incorporate_CaoDai_Nat_Armies_desc: "We will incorporate the Cao-Dai and National Armies into our regular military forces. This integration strengthens our armed forces and brings Trinh-Minh-The's forces under government control, though it significantly reduces Cao-Dai autonomy and loyalty."
VIE_Vinh_Pushing_Religious_Coexistance_desc: "Since Vietnam is religiously diverse, having sectarian conflicts would be dangerous for the nation as we are currently facing the problem of fighting the Southern Viet-minh cells. Let us pursue for co-existence of religions in parts of Vietnam that we still control to ensure stability in our nation."
VIE_Vinh_Incorporate_Sect_Assets_desc: "The sects are known from their assets coming from their devotees' donations. Let us find a way to persuade them to contribute their assets to our government."
VIE_Vinh_Purge_Phuong_Forces_desc: "We must purge the Phuong forces, a dissident military faction that threatens government stability. This decisive action will eliminate a potential source of rebellion and consolidate our control over the military."
VIE_Vinh_Expand_Japanese_Ties_desc: "We will expand our diplomatic and economic ties with Japan. This relationship could provide valuable support and resources, though it may complicate our relations with other powers in the region."
VIE_Vinh_Expand_CaoDai_Influence_desc: "We will expand Cao-Dai influence throughout Vietnam, particularly in Tay-Ninh. This policy strengthens the Cao-Dai position and may help integrate their followers into the national framework, though it requires significant investment in infrastructure."
VIE_Vinh_Push_CuongDe_Repatriation_desc: "We will push for the repatriation of Prince Cuong-De from Japan. This effort to bring the exiled prince back to Vietnam could have significant political implications, depending on Japan's response and the timing of our request."
VIE_Vinh_Rehabilitate_PhucQuoc_Members_desc: "We will rehabilitate members of the Phuc-Quoc organization, a nationalist group that has been in conflict with the government. This reconciliation effort aims to bring these nationalists into the fold and strengthen our anti-communist coalition."
VIE_Vinh_Resign_desc: "After completing his agenda, Tran-Quang-Vinh will resign from the premiership, allowing for a transition to new leadership."

VIE_PM_Huu_desc: "Tran-Van-Huu has been appointed as Prime Minister. A former governor and experienced administrator, Huu brings a pragmatic approach focused on modernizing Vietnam's military and expanding its international presence."
VIE_Huu_Officer_Corp_Vietnamization_desc: "We will Vietnamize the officer corps, replacing French officers with Vietnamese ones. This policy strengthens our military independence and reduces French control, though it may strain relations with France if we haven't already commissioned native veterans."
VIE_Huu_Modernize_National_Army_desc: "We will modernize our national army with French equipment, including light tanks, artillery, and motorized vehicles. This modernization strengthens our military capabilities and demonstrates French support for our forces."
VIE_Huu_Attend_1951_SF_Conference_desc: "We will attend the 1951 San Francisco Conference, where the peace treaty with Japan will be signed. Our participation demonstrates Vietnam's status as an independent nation and improves our relations with America's allies."
VIE_Huu_Attract_Worldwide_Attention_SV_desc: "We will launch a campaign to attract worldwide attention to South Vietnam's cause. This diplomatic effort increases our domestic influence and reduces alternative favoritism, while also unlocking opportunities for weapon shipments from sympathetic nations."
VIE_Huu_Demand_Japan_War_Reparations_desc: "We will demand war reparations from Japan for the suffering inflicted during their occupation. This bold move increases our domestic influence and demonstrates our independence, though it may strain relations with Japan."
VIE_Huu_Demand_HoangSa_TruongSa_Recognition_desc: "We will demand international recognition of our sovereignty over the Hoang-Sa (Paracel) and Truong-Sa (Spratly) islands. This assertion of territorial claims may anger neighboring countries but strengthens our nationalist credentials."
VIE_Huu_Open_UK_USA_Embassies_desc: "We will open embassies in the United Kingdom and United States, establishing formal diplomatic relations with these major powers. This step increases our international standing and domestic influence."
VIE_Huu_Friendlier_USA_Ties_desc: "We will pursue friendlier ties with the United States, seeking American support and investment. This policy improves relations with the USA, increases stability, and provides industrial development opportunities."
VIE_Huu_Maintain_PhapViet_DeHue_desc: "We will maintain the Phap-Viet De-Hue (Franco-Vietnamese Cooperation) framework, preserving our relationship with France. This approach keeps French favoritism high but may limit our independence."
VIE_Huu_Request_More_French_Financial_Aid_desc: "We will request additional financial aid from France to support our government and development projects. If France accepts, this aid will provide crucial resources for infrastructure and economic development."
VIE_Huu_Accept_French_Dismissal_desc: "If France dismisses our request for aid, we will accept their decision gracefully. This acceptance may reflect French disinterest in supporting our government, forcing us to seek alternative sources of support."
VIE_Huu_Open_Viet_VoA_Radio_desc: "We will open a Vietnamese Voice of America radio station, providing an alternative to French-controlled media. This move strengthens our ties with the USA and provides a platform for our message, though it may anger France."
VIE_Huu_Accept_USA_Financial_Aid_desc: "We will accept financial aid from the United States, shifting our dependency from France to America. This decision significantly increases American influence and provides much-needed resources for our government."
VIE_Huu_Winning_French_Favoritism_desc: "Through consistent cooperation and loyalty to French interests, we can win French favoritism and secure their continued support. This approach prioritizes stability and French backing over complete independence."

VIE_PM_Toan_desc: "Nguyen-Bao-Toan has been appointed as Prime Minister. A revolutionary thinker and advocate for social change, Toan brings a radical vision for transforming Vietnamese society through his Three Revolutions philosophy."
VIE_Toan_Promote_DanXaism_desc: "We will promote Dan-Xaism, Toan's political philosophy emphasizing people's power and grassroots democracy. This ideology seeks to empower the common people and create a more egalitarian society."
VIE_Toan_Promote_TriRevolutions_desc: "We will promote the Three Revolutions: Human Revolution, National Revolution, and Social Revolution. This comprehensive program aims to transform Vietnamese society at all levels, from individual consciousness to national identity and social structure."
VIE_Toan_CachMang_ConNguoi_desc: "The Human Revolution focuses on transforming individual consciousness and morality. We will promote education, ethical behavior, and personal development to create a new generation of enlightened Vietnamese citizens."
VIE_Toan_Spread_HoaHao_Buddhism_desc: "We will spread Hoa-Hao Buddhism, a reformist Buddhist movement that emphasizes simplicity and direct practice. This religious policy aligns with our revolutionary goals and may help mobilize rural populations."
VIE_Toan_Destroy_Drugs_Prostitution_desc: "We will launch a campaign to destroy drugs and prostitution, cleansing Vietnamese society of these vices. This moral crusade aims to create a purer, more virtuous nation aligned with our revolutionary ideals."
VIE_Toan_ToanDan_ChanhTri_desc: "We will implement All-People Politics, ensuring that every citizen has a voice in governance. This democratic approach seeks to break down traditional hierarchies and create a more inclusive political system."
VIE_Toan_Spread_Scientific_Knowledge_desc: "We will spread scientific knowledge throughout Vietnam, promoting education and rational thinking. This policy aims to modernize Vietnamese society and reduce superstition and backwardness."
VIE_Toan_Contact_NgoDinh_Bros_desc: "We will contact the Ngo-Dinh brothers, seeking their cooperation in our revolutionary program. These influential figures could provide valuable support for our cause, though their alignment with our goals remains uncertain."
VIE_Toan_CachMang_DanToc_desc: "The National Revolution focuses on Vietnamese independence and national identity. We will work to free Vietnam from foreign domination and create a truly independent Vietnamese state."
VIE_Toan_Gathering_AntiFrench_Forces_desc: "We will gather all anti-French forces under our banner, uniting various nationalist and revolutionary groups. This coalition-building effort strengthens our position against French colonial rule."
VIE_Toan_Prepare_Anti_BaoDai_French_Coup_desc: "We will prepare for an anti-Bao-Dai and anti-French coup, organizing our forces and planning to overthrow the current regime. This revolutionary action aims to establish a truly independent Vietnamese government."
VIE_Toan_CachMang_XaHoi_desc: "The Social Revolution focuses on transforming Vietnamese society's economic and social structures. We will work to create a more equitable and just society, free from exploitation and inequality."
VIE_Toan_Organize_Countryside_Communes_desc: "We will organize countryside communes, creating collective agricultural units that can improve rural productivity and social organization. This policy aims to modernize rural Vietnam and improve the lives of peasants."
VIE_Toan_Spread_NonCommunist_Socialism_desc: "We will spread a non-communist form of socialism, promoting social justice and economic equality without aligning with communist ideology. This approach seeks to address social problems while maintaining independence from both communist and capitalist blocs."
VIE_Toan_Promote_KyNghe_Hoa_desc: "We will promote Industrialization (Ky-Nghe Hoa), developing Vietnam's industrial capacity and modernizing our economy. This economic transformation is essential for national strength and independence."
VIE_Toan_Allow_Private_MOP_desc: "We will allow private means of production, balancing socialist ideals with practical economic needs. This policy permits private enterprise while maintaining our commitment to social justice and equality."
VIE_Toan_Beg_Sect_Cooperation_desc: "We will beg for sect cooperation, seeking the support of religious groups like Cao-Dai and Hoa-Hao for our revolutionary program. Their cooperation could be crucial for our success, though their interests may not always align with ours."
VIE_Toan_Launch_AntiFrench_AntiCommie_desc: "We will launch a comprehensive campaign against both French colonialism and communism, positioning ourselves as the true path to Vietnamese independence. This dual-front struggle requires careful coordination of all our forces and allies."
VIE_Toan_Assassination_desc: "In a desperate move, we may resort to assassination of key opponents to advance our revolutionary cause. This extreme measure reflects the high stakes of our struggle for Vietnamese independence and social transformation."

VIE_PM_Tam_desc: "Nguyen-Van-Tam has been appointed as Prime Minister. A former governor and security expert, Tam brings a hardline anti-communist approach focused on security, stability, and counter-insurgency operations."
VIE_Tam_Expand_AntiCommunist_Security_desc: "We will expand our anti-communist security apparatus, strengthening our ability to identify and neutralize communist threats. This comprehensive security program is essential for maintaining government control and stability."
VIE_Tam_SmallScale_CaiCach_DienDia_desc: "We will implement a small-scale land reform (Cai-Cach Dien-Dia), redistributing some land to peasants. This limited reform aims to address rural grievances without fully challenging the existing landowning structure."
VIE_Tam_SmallScale_Industrial_BuildUp_desc: "We will undertake a small-scale industrial buildup, developing our manufacturing capacity and creating jobs. This economic development strengthens our economy and provides resources for our security efforts."
VIE_Tam_Intensify_Counter_Northern_VietMinh_desc: "We will intensify our counter-Northern Viet Minh operations, taking the fight directly to the communist forces. This aggressive approach may destabilize North Vietnam but also risks escalating the conflict."
VIE_Tam_Elect_VietQuoc_Leadership_desc: "We will elect Viet-Quoc (Vietnamese Nationalist Party) leadership, bringing this nationalist party into the government. This move strengthens nationalist elements and increases domestic influence, though it may reduce stability."
VIE_Tam_Resign_desc: "After completing his security-focused agenda, Nguyen-Van-Tam will resign from the premiership, allowing for a transition to new leadership."

VIE_PM_Quang_desc: "Dinh-Xuan-Quang has been appointed as Prime Minister. A reformist administrator, Quang brings a focus on urban development, social services, and improving the lives of ordinary Vietnamese citizens."
VIE_Quang_Reform_Civil_Services_desc: "We will reform the civil services, improving efficiency and reducing corruption. This administrative reform reduces land reform penalties and creates a more effective government bureaucracy, though it requires significant investment."
VIE_Quang_Pass_Labor_Union_Regulation_desc: "We will pass labor union regulations, establishing the legal framework for worker organizations. This policy sets the stage for improved worker rights and may lead to the legalization of unions."
VIE_Quang_Legalize_Worker_Unions_desc: "We will legalize worker unions, granting workers the right to organize and bargain collectively. This progressive policy improves worker rights and may increase support for socialist ideas, though it also grants workers more political power."
VIE_Quang_Raise_Worker_Salaries_desc: "We will raise worker salaries, improving the standard of living for urban workers. This policy requires significant government expenditure but strengthens worker support for the regime."
VIE_Quang_Form_Urban_Councils_desc: "We will form urban councils in major cities, creating local governance structures that give urban residents a voice in municipal affairs. This decentralization improves local administration and increases building capacity in urban areas."
VIE_Quang_Modernize_Urban_Infrastructure_desc: "We will modernize urban infrastructure, improving roads, utilities, and public facilities in our cities. This development enhances urban quality of life and may unlock new technologies for further infrastructure improvements."
VIE_Quang_Expand_Public_Housing_desc: "We will expand public housing, providing affordable housing for urban residents. This social program improves living conditions in cities and demonstrates the government's commitment to social welfare."
VIE_Quang_Pass_Civil_Service_Regulation_desc: "We will pass civil service regulations, establishing standards and procedures for government employment. This reform improves the quality and professionalism of the civil service."
VIE_Quang_Reform_Health_System_desc: "We will reform the health system, expanding healthcare access and improving medical services. This comprehensive reform increases healthcare rates, improves public health, and may increase available manpower through better population health."
VIE_Quang_Establish_Saigon_Childrens_Hospital_desc: "We will establish a children's hospital in Saigon, providing specialized medical care for the city's youngest residents. This humanitarian project demonstrates our commitment to the welfare of all Vietnamese citizens."
VIE_Quang_Stablize_BaoDai_Regime_desc: "We will work to stabilize the Bao-Dai regime, ensuring its continued legitimacy and effectiveness. This conservative approach maintains the status quo and preserves the existing political structure."
VIE_Quang_Propose_QuocGia_Solution_desc: "We will propose the Quoc-Gia (National State) solution, advocating for a more independent and nationalist approach to governance. This proposal increases domestic influence and shifts favoritism away from France, though it may reduce stability."

VIE_PM_Buu_Loc_desc: "Nguyen-Phuc-Buu-Loc has been appointed as Prime Minister. A member of the royal family, Buu-Loc brings a conservative approach focused on maintaining stability during a critical period in Vietnam's history."
VIE_Buu_Loc_Accept_Incompetent_Governnment_desc: "We will accept that our government may be seen as incompetent, acknowledging the challenges we face. This honest assessment reduces stability and political power but may increase domestic influence by demonstrating self-awareness."
VIE_Buu_Loc_Accept_Northern_Communist_Victory_desc: "If the Geneva Conference results in Northern communist victory, we will accept this outcome. This pragmatic acceptance of defeat significantly reduces stability and monarchist popularity but may increase domestic influence by showing realism."
VIE_Buu_Loc_Host_Victory_Parade_desc: "If we achieve victory in the Indochina War, we will host a grand victory parade to celebrate our success. This celebration boosts stability, political power, and domestic influence, demonstrating the strength and legitimacy of our government."
VIE_Buu_Loc_Resign_desc: "After navigating the challenges of his premiership, Nguyen-Phuc-Buu-Loc will resign, allowing for a transition to new leadership as Vietnam faces its future."

VIE_CD_Sideline_CuongDe_Ambitions_desc: "Cuong-De's ambition to lead the nation to a monarchistic democracy is strong, but Bao-Dai is not as passionate. Making sure his ambitions are muted will be a critical piece in ensuring this difficult time goes well."
VIE_CD_CuongDe_Press_Conferences_desc: "It seems that Cuong-De is having press conferences in an attempt to convince foreign powers to back his return. Let us tap his communications so we can know his plan and prevent his return to Vietnam."
VIE_CD_Intercept_CuongDe_Return_Bangkok_desc: "We have received news that Cuong-De is planning to sneak into Vietnam via Bangkok in disguise. Let us intercept him before he could return and cause any troubles."
VIE_CuongDe_Returns_desc: "Despite Bao-Dai and the Xac-Te have done everything to prevent his return, it seems that Prince Cuong-De evades them and is on his way to retake his throne. We must help him prepare for a coup against Bao-Dai."
VIE_CD_Request_Japanese_Western_Aid_desc: "The Japanese has been the first supporter of the Prince's effort. Let us reach out to them for support in our effort to bring the Prince back to his throne."
VIE_CD_Recruit_NgoDinh_Brothers_desc: "The Ngo-Dinh Brothers has been a thorn for Bao-Dai for years. Let us recruit them to our cause before Bao-Dai could send his agents to arrest them."
VIE_CD_Wait_French_Approval_desc: "Although we despise the French as they currently influence Vietnamese politics, we still need their approval in order for our plan to be successful. Let us convince the French that Prince Cuong-De would be a better ruler than Bao-Dai."
VIE_CD_Contact_GuangXi_Revolutionaries_CaoDai_desc: "The Guang-Xi revolutionaries and the Caodaists fully support our causes and despise Bao-Dai's corrupt regime. Let us reach out to them for additional armed support."
VIE_CD_Avenge_148_Year_Fueds_desc: "The time has come for us to bring the prince back to his rightful place. Let us storm Bao-Dai's residence and perform a coup d'état to kick him out once and for all."
VIE_CD_Japan_Escape_desc: "Despite our effort, it seems that Prince Cuong-De failed to win in the power struggle against Bao-Dai. The only fate left for him is a life in exile in Japan."
VIE_CD_NamHung_Vietnam_Emperor_desc: "Van-tue! It seems that our effort to restore Prince Cuong-De to his rightful place has paid off. Let us celebrate his restoration as the rightful emperor, Nam-Hung."
VIE_NH_NamHung_Vietnam_Emperor_desc: "Van-tue! It seems that our effort to restore Prince Cuong-De to his rightful place has paid off. Let us celebrate his restoration as the rightful emperor, Nam-Hung."
VIE_NH_Purge_BaoDai_Loyalists_Incompetent_Bureaucrats_desc: "Bao-Dai's loyalists and incompetent bureaucrats has plagued our nations for years. Let us purge those that still remain in position of powers."
VIE_NH_Exile_BaoDai_desc: "Despite being overthrown, the presence of Bao-Dai is still a problem for us. Let us exile him to France and never let him step foot in Vietnam ever again."
VIE_NH_FRA_Friendship_desc: "Even though we despise being under the French boot, it would be foolish to antagonize them as we are still fighting the Viet-minh. Let us keep relation cordial between us and the French to ensure we have their support in governing Vietnam."
VIE_NH_Reward_CaoDai_Loyalists_desc: "The Caodaists have been loyal to us and our causes for a long time. Let us reward them for their loyalty by appointing them to important positions in the government."
VIE_NH_Welcome_Americans_desc: "Unlike the French, the Americans would gladly send aids to any nations that oppose the Communists. Let us court them to our cause as an alternative ally to ou French overlord."
VIE_NH_Reorganize_Incompetent_Government_desc: "The incompetent government that Bao-Dai left would not help us convince the people that Vietnam is truly independent from foreign interference. Let us reorganize the administration for a new Vietnam once and for all."
VIE_NH_Maintain_Colonial_Bureaucracy_desc: "Dismissing the colonial bureaucracy and building a new one from scratch would be too much of a hassle for us since we are still fighting a war against the North. It would be better for us to maintain them while focusing on other affairs. After all, don't fix what's not broken."
VIE_NH_Death_Preparations_desc: "Due to Emperor Nam-Hung's age and health problems, we must prepare for his death and choose a successor for him."
VIE_NH_Nhiep_Successor_desc: "As the emperor's second in command, Nguyen-Rinh-Nhiep would make a natural successor to continue Nam-Hung's legacy. Let us choose him as our successor."
VIE_NH_Diem_Successor_desc: "As the emperor's long time supporter, Ngo-Dinh-Diem would make a natural successor to continue Nam-Hung's legacy. Let us choose him as our successor."
VIE_NH_CaoDai_Successor_desc: "As an ardent believer of the Cao-Dai religion and a patriot, Tran-Quang-Vinh would make a perfect successor to continue Nam-Hung's legacy. Let us choose him as our successor."
VIE_NH_Promote_PhuQuoc_Hoi_Comrades_desc: "Our comrades from the Phuc-Quoc Hoi (Vietnam National Restoration League) has served us well during the struggle against imperialism. Let us appoint them in important positions to replace former Bao-Dai appointed bureaucrats."
VIE_NH_ReEstablish_VietKienQuocQuan_desc: "Our military is currently disorganized as religious militias and Binh-Xuyen paramilitary control a significant portion of our nation and our armed forces. Let us consolidate a professional military in our war against the Viet-minh."
VIE_NH_Request_Montagnard_Dominion_desc: "Before the coup, Bao-Dai controlled the Montagnard Dominion as one of his Crown Domains. Since we have taken control of Vietnam, let us send a request to the French government to acknowledge our control of the Montagnard Dominion as well."
VIE_NH_Established_DanVuong_Model_desc: "Emperor Nam-Hung has an interesting philosophy on changing the Vietnamese monarchy called the Dan-Vuong model, or popular monarchy. Let us introduce this model to Vietnam as a way to reform the archaic monarchy and bring Vietnam closer to modernity."
VIE_NH_Established_DacPhu_DanTien_Cuoc_Commission_desc: "In order to bring Vietnam to modernity, we need to bring modern technology to Vietnam as well. Let us establish the Dac-Phu Dan-Tien Commission to bring Western technology to Vietnam."
VIE_NH_BuuNhu_Labor_Reforms_desc: "For decades, the French has exploited our labors to send raw materials to Paris, and even as French influence wanes in Vietnam, the labor condition still has not improved. To alleviate the people's suffering, the Emperor has decided to approve Buu and Nhu's labor reforms."
VIE_NH_Political_Harmony_desc: "Considering that Vietnam has lots of political groups vying for influences right now, it would be dangerous if we keep them unchecked as we are still at war with the North. Let us form a united front to maintain unity within Vietnam."
VIE_NH_Outlaw_Francophiles_desc: "Many pro-French organizations in our nation only serve French interests instead of our people's interest. Let us outlaw them to curtail any French influence in Vietnam."
VIE_NH_Pacifying_NamPhan_desc: "The Southern countryside of Vietnam is rife with many factions competing for influences, ranging from the Binh-Xuyen criminals to religious militias controlled by Caodaists, Hoahaoist, and Catholics. Let us rein in these factions in order to cement our control of Southern Vietnam."
VIE_NH_Destroy_UMDC_desc: "The UMDC's brutal treatment of the local people in the countryside will not help our causes in restoring order to Vietnam. Let us put an end to this organization and restore control to Vietnam once again."
VIE_NH_Promote_TamDan_Policies_desc: "Sun Yat-Sen's Three Principles of the People or Chu Nghia Tam-Dan in Vietnamese has helped China transition from being the sick man of Asia to modernity. Let us implement Sun's idea to bring Vietnam to the modern age."
VIE_NH_DanToc_desc: "Besides the Kinh majority, Vietnam also has other ethnic groups as well. We must promote Sun's concept of nationalism to unite all of the ethnic groups within Vietnam."
VIE_NH_HamBac_HopNhut_Luan_desc: "If the war between the North and the South continues, our people will continue to suffer. Let us negotiate for a ceasefire so we can come up with a reunification plan for both sides."
VIE_NH_Using_Diem_Ho_Connections_desc: "Despite their differences, it seems that Diem and Ho do have a common goal for Vietnam after all. Let us use this connection to send Diem to negotiate with Ho on neutral territory on how to unify Vietnam."
VIE_NH_DanQuyen_desc: "The Three Principles' interpretation of democracy consists of the rights for election, recalling, initiative, and referendum. Let us put these rights into practice to show the West that we are capable of being a democratic nation."
VIE_NH_Spread_Western_Progressive_Values_desc: "Besides the Three Princples, a significant amount of our people have received education abroad such as France and are familiar with Western values. Let us employ our best and talented to the government to promote these values."
VIE_NH_Fight_Against_BinhXuyen_Criminal_Empire_desc: "The Binh-Xuyen criminals have terrorized our citizens for years. Let us put an end to this organization and restore control to Vietnam once again."
VIE_NH_DanSinh_desc: "If we want the support of our people, we must care for their well-being as well. Let us support welfare programs and land reforms to bring prosperity to our people."
VIE_NH_Nationwide_Investment_Hamlets_Electrification_desc: "Currently, the infrastructure of the average Vietnamese hamlets are subpar compared to the West. Let us make an investment on the hamlets in the countryside nationwide to improve the live of our people."
VIE_NH_Welcome_Japanese_Industrialists_desc: "Japan has been the forefront of industry in Asia ever since the 19th century. Let us invite them so they can share their expertise to help us on industrializing our nation."
VIE_NH_Promote_KyNghe_Hoa_desc: "Besides technology, Vietnam also has lots of untapped potential for raw material. Let us invest more on our industry to allow us to become self-sufficient."
VIE_NH_Establish_National_Labor_Union_desc: "With the Buu-Nhu Labor reforms becoming successful in Vietnam, let us establish a national labor union to improve our workers' conditions."
VIE_NH_End_HuynhDe_TuongTan_desc: "With the progress that we made on our unification effort, let us send our proposal for the reunification of Vietnam to the Communist government in the North."

VIE_NH_Diem_PM_desc: "Ngo Dinh Diem has been chosen as Nam-Hung's successor and will serve as Prime Minister. Diem brings his personalist ideology and strong leadership to the government, combining Cuong-De's teachings with his own vision for Vietnam. His appointment marks a new era in Vietnamese politics, merging revolutionary nationalism with personalist philosophy."
VIE_NH_Diem_NhanVinized_CD_Teachings_desc: "Diem will adapt Cuong-De's teachings to his own Nhan-Vi (Personalist) philosophy, creating a unique synthesis of revolutionary nationalism and personalist ideology. This NhanVinized version will emphasize individual dignity, social justice, and Vietnamese identity, creating a distinct political philosophy that guides the government's policies."
VIE_NH_Diem_Form_NRM_desc: "The National Revolutionary Movement (NRM) will be formed as Diem's political party. This movement will unite various political factions under a single banner, creating a broad-based party that supports Diem's personalist revolution. The NRM will become the dominant political force, replacing the fragmented party system."
VIE_NH_Diem_Incorporate_PQH_desc: "The Phong-trao Quoc-Hoi (PQH) movement will be incorporated into the government structure. This incorporation will bring democratic elements into Diem's regime, creating a more inclusive political system while maintaining his personalist leadership. The PQH will provide a democratic voice within the government."
VIE_NH_Diem_Integrate_Buu_CTVN_desc: "Tran Quoc Buu and the Vietnamese Confederation of Labor (CTVN) will be integrated into the government. Buu's labor organization will become part of the state structure, ensuring that workers' interests are represented while maintaining government control over labor movements. This integration will strengthen the government's connection to the working class."
VIE_NH_Diem_Begin_Early_Land_Reform_desc: "Land reform will begin early in Diem's administration, addressing the critical issue of land distribution. This reform will redistribute land from large landowners to peasants, reducing rural inequality and winning support from the countryside. However, the reform must be carefully managed to avoid alienating powerful landowners."
VIE_NH_Diem_Nationalize_Foreign_Factories_desc: "Foreign-owned factories will be nationalized, bringing industrial assets under Vietnamese control. This bold move will reduce foreign economic influence and create opportunities for Vietnamese workers and entrepreneurs. However, it will also strain relations with foreign investors and potentially reduce foreign investment."
VIE_NH_Diem_AgroCredit_Experiment_desc: "An agricultural credit experiment will be launched to provide loans to farmers. This program will help peasants access capital for improving their farms, purchasing equipment, and increasing productivity. The experiment will test whether credit can drive agricultural development and improve rural living standards."
VIE_NH_Diem_Begin_Early_Industrialization_desc: "Early industrialization will begin, focusing on developing Vietnam's manufacturing capabilities. This will create jobs, reduce dependence on imports, and build a foundation for economic independence. The industrialization program will require significant investment and careful planning to succeed."
VIE_NH_Diem_Appoint_Cung_LandReform_Minister_desc: "Kieu Cong Cung will be appointed as Land Reform Minister. Cung's expertise and commitment to land reform will ensure that the redistribution program is implemented effectively. His leadership will be crucial for winning peasant support and addressing rural inequality."
VIE_NH_Diem_Mobilize_Syndicates_desc: "Labor syndicates will be mobilized to support the government's economic programs. These organized labor groups will help implement industrial policies, ensure worker participation in economic development, and create a sense of national unity around economic goals. The mobilization will strengthen the government's connection to the working class."
VIE_NH_Diem_Modernize_Countryside_desc: "The countryside will be modernized through infrastructure development, education, and technology. This modernization will improve rural living standards, increase agricultural productivity, and reduce the urban-rural divide. The program will require significant investment but will help integrate rural areas into the national economy."
VIE_NH_Diem_Import_Foreign_Machinery_desc: "Foreign machinery and technology will be imported to support industrialization and agricultural modernization. This equipment will help Vietnam catch up with more developed nations, improving productivity and efficiency. However, the imports will require foreign exchange and may increase dependence on foreign suppliers."
VIE_NH_Diem_Begin_5YP_desc: "A Five-Year Plan will be launched to guide economic development. This comprehensive plan will set targets for industrial growth, agricultural improvement, infrastructure development, and social progress. The plan will coordinate government efforts and provide a roadmap for Vietnam's economic transformation."
VIE_NH_Diem_Establish_CNP_desc: "The Can Lao Nhan Vi Cach Mang Dang (CNP) will be established as Diem's personalist revolutionary party. This party will serve as the vanguard of the personalist revolution, organizing supporters and implementing Diem's ideology throughout society. The CNP will become the core of Diem's political machine."
VIE_NH_Diem_NhanVinize_Bureaucracy_desc: "The bureaucracy will be NhanVinized, infusing it with personalist ideology and ensuring that government officials are committed to Diem's vision. This will create a more ideologically unified administration, but it may also reduce bureaucratic efficiency and limit diversity of thought within the government."
VIE_NH_Diem_Feminist_Reforms_desc: "Feminist reforms will be implemented to improve women's rights and status in Vietnamese society. These reforms will address legal inequalities, expand educational opportunities for women, and promote women's participation in public life. The reforms will modernize Vietnamese society and win support from progressive elements."
VIE_NH_Diem_1st_GiaDinh_Law_desc: "The First Gia Dinh Law will be passed, establishing new legal frameworks for family and social relations. This law will codify personalist principles in legal form, creating a foundation for the personalist revolution. The law will address family structure, inheritance, and social organization."
VIE_NH_Diem_PhuNu_LienDoi_Movement_desc: "The Phu Nu Lien Doi (Women's League) movement will be formed to mobilize women in support of the government. This movement will organize women for political action, social service, and national defense. The league will create a women's paramilitary force and expand women's role in public life."
VIE_NH_Diem_Pardon_Ex_VietMinh_desc: "Former Viet Minh members will be pardoned and reintegrated into society. This amnesty will help heal divisions, reduce opposition, and bring experienced fighters into the government's fold. The pardon will demonstrate Diem's commitment to national reconciliation and unity."
VIE_NH_Diem_Study_Marxist_Org_desc: "Marxist organizational methods will be studied and adapted for use in the personalist revolution. This pragmatic approach will learn from communist successes while maintaining personalist ideology. The study will help improve government organization and mass mobilization techniques."
VIE_NH_Diem_Expand_CNP_desc: "The CNP will be expanded significantly, increasing its membership and influence throughout society. This expansion will strengthen Diem's political base and ensure that personalist ideology penetrates all levels of Vietnamese society. The expanded party will become a powerful tool for social control and mobilization."
VIE_NH_Diem_Promote_Viet_Patriotism_desc: "Vietnamese patriotism will be promoted to unite the nation and strengthen national identity. This promotion will emphasize Vietnamese culture, history, and values, creating a sense of pride and unity. The campaign will help counter regional and ideological divisions."
VIE_NH_Diem_Mend_Class_Tensions_desc: "Class tensions will be addressed through social programs and economic policies. This effort will reduce inequality, improve working conditions, and create opportunities for social mobility. By mending class divisions, the government will strengthen national unity and reduce potential sources of opposition."
VIE_NH_Diem_Outlaw_Viet_Quoc_desc: "The Viet-Quoc (VNQDD) will be outlawed as a threat to the government. This ban will eliminate a nationalist rival and prevent them from organizing opposition. The outlawing will also create a casus belli against Phu Quoc, where the VNQDD has established a rival government."
VIE_NH_Diem_Destroy_Org_Crime_desc: "Organized crime, particularly the Binh Xuyen, will be destroyed through military action. This crackdown will eliminate criminal elements that threaten government authority and control. The destruction of organized crime will demonstrate the government's strength and commitment to order."
VIE_NH_Diem_Disarm_Religious_Private_Armies_desc: "Religious private armies, including those of the Cao Dai and Hoa Hao sects, will be disarmed. This will eliminate independent military forces and bring all armed groups under government control. The disarmament will strengthen the state's monopoly on violence but may alienate religious communities."
VIE_NH_Diem_Form_Rev_Youth_Movements_desc: "Revolutionary youth movements will be formed to mobilize young people in support of the personalist revolution. These movements will organize youth for political action, social service, and national defense. The movements will create a new generation committed to Diem's vision."
VIE_NH_Diem_Promoting_Pan_Asianism_desc: "Pan-Asianism will be promoted to build solidarity with other Asian nations. This ideology will emphasize Asian unity, shared values, and common interests, creating a sense of regional identity. The promotion will improve relations with Asian countries while potentially alienating Western powers."
VIE_NH_Diem_Begin_Second_Stage_of_Personalist_Revolution_desc: "The second stage of the personalist revolution will begin, deepening the transformation of Vietnamese society. This stage will focus on cultural revolution, ideological indoctrination, and complete social reorganization. The second stage will intensify the personalist revolution and create a more radical transformation."
VIE_NH_Diem_Rev_Paramilitaries_desc: "Revolutionary paramilitaries will be formed to support the government and enforce personalist ideology. These armed groups will supplement the regular military, providing security and political control. The paramilitaries will become a key tool for maintaining order and implementing the revolution."
VIE_NH_Diem_Rev_VKQQ_desc: "The VKQQ (Vietnamese National Guard) will be revolutionized, infusing it with personalist ideology and ensuring its loyalty to Diem. This transformation will create a more politically reliable military force, committed to the personalist revolution and the government's goals."
VIE_NH_Diem_Promote_NhanVi_Loyalists_desc: "NhanVi loyalists will be promoted throughout the government and military. These committed personalists will be given key positions, ensuring that the revolution is led by true believers. The promotion will create a loyal elite dedicated to Diem's vision."
VIE_NH_Diem_NhanVi_Pol_Commissar_desc: "Political commissars will be introduced into the military, ensuring ideological control and loyalty. These commissars will monitor political reliability, provide ideological education, and prevent disloyalty. The commissar system will create a more politically controlled military."
VIE_NH_Diem_Adopt_Jungle_Training_desc: "Jungle training will be adopted to prepare the military for counterinsurgency operations. This specialized training will teach soldiers to operate effectively in Vietnam's difficult terrain, fighting guerrillas and maintaining control in rural areas. The training will improve the military's effectiveness against insurgents."
VIE_NH_Diem_ThuDuc_Army_Academy_desc: "The Thu Duc Army Academy will be established to train military officers. This academy will produce skilled officers committed to the personalist revolution, combining military expertise with ideological indoctrination. The academy will become the primary source of military leadership."
VIE_NH_Diem_Armed_Womens_Wing_desc: "An armed women's wing will be formed, creating female military units. This will expand women's role in national defense and demonstrate the government's commitment to gender equality. The women's units will serve in combat and support roles, breaking traditional gender barriers."
VIE_NH_Diem_Rev_Fanaticism_desc: "Revolutionary fanaticism will be promoted to create an intensely committed population. This will involve ideological indoctrination, propaganda campaigns, and social pressure to demonstrate loyalty. The fanaticism will create a more unified and committed society but may also lead to extremism and intolerance."
VIE_NH_Diem_Modern_Warfare_Tactics_desc: "Modern warfare tactics will be adopted to improve military effectiveness. This will involve training in new combat methods, use of modern equipment, and adaptation to contemporary military doctrine. The adoption will help the military compete with more advanced forces."
VIE_NH_Diem_Raise_Soldier_Pay_desc: "Soldier pay will be raised to improve morale and attract better recruits. This will make military service more attractive, reduce desertion, and improve the quality of the armed forces. The pay raise will require additional government spending but will strengthen the military."
VIE_NH_Diem_2nd_Mil_Reforms_desc: "A second round of military reforms will be implemented, further modernizing and improving the armed forces. These reforms will address remaining weaknesses, adopt new technologies, and improve organization. The second round will build on previous reforms and continue the military's transformation."
