l_english:

 # ------------------------------------------------------------------
 # National resistance
 # ------------------------------------------------------------------

 SWF_VIN.0.t:0 "The National Resistance"
 SWF_VIN.0.d:0 "The struggle for independence has entered a new and more demanding phase. Across the country, the Democratic Republic calls upon workers, peasants, students, officials, and soldiers to treat the defense of the nation as a common responsibility. The enemy may possess heavier weapons, wider resources, and foreign backing, but Vietnam possesses the determination of a people defending its own land.\n\nThe Party and Government have therefore proclaimed a comprehensive resistance. Villages will organize self-defense, factories will sustain the front, and cadres will bind military operations to political work. The conflict will not be decided in a single battle, but through endurance, organization, and the refusal to surrender the nation's future."
 SWF_VIN.0.a:0 "All for the resistance; all for victory."

 # ------------------------------------------------------------------
 # PRC victory: Moscow and Beijing
 # ------------------------------------------------------------------

 SWF_VIN.1.t:0 "A Vietnamese Delegation in Moscow"
 SWF_VIN.1.d:0 "Representatives of the Democratic Republic of Vietnam have arrived in Moscow after a journey through the newly transformed political landscape of Asia. Their delegation seeks recognition, material assistance, and a clear place for Vietnam within the wider struggle against colonialism.\n\nA Soviet decision will carry consequences far beyond Indochina. Open recognition would strengthen the Vietnamese resistance and signal that Moscow is prepared to contest Western influence in Southeast Asia. Caution, however, may preserve diplomatic flexibility at a time when the new Chinese revolution has already altered the balance of power along the Asian frontier."
 SWF_VIN.1.a:0 "Recognize the Vietnamese revolution."
 SWF_VIN.1.b:0 "Offer sympathy, but avoid a formal commitment."

 SWF_VIN.2.t:0 "Ho Chi Minh Looks North"
 SWF_VIN.2.d:0 "A Vietnamese delegation has reached Beijing seeking the recognition and support of the People's Republic. The triumph of the Chinese Revolution has transformed the border from a barrier into a potential artery of cooperation, linking the resistance in Viet Bac with a vast revolutionary state to the north.\n\nThe Vietnamese request is both political and practical. Recognition would establish a public partnership between the two revolutions, while cooperation across the frontier could open routes for training, communications, medicine, and military supplies. Yet the new government must still decide how openly it wishes to challenge the colonial order in Indochina."
 SWF_VIN.2.a:0 "Open the border to our Vietnamese comrades."
 SWF_VIN.2.b:0 "Maintain friendly but limited relations."

 # ------------------------------------------------------------------
 # ROC victory: Moscow and Nanking
 # ------------------------------------------------------------------

 SWF_VIN.3.t:0 "Vietnam Seeks a Soviet Understanding"
 SWF_VIN.3.d:0 "The outcome of the Chinese Civil War has left the Vietnamese revolution in a more uncertain regional position. With the Nationalist Government holding the mainland, representatives of the Democratic Republic have come to Moscow to seek political recognition and an independent connection to the socialist world.\n\nThe delegation argues that the struggle in Indochina remains an anti-colonial cause regardless of events in China. Soviet recognition could give Hanoi valuable legitimacy and demonstrate that the revolutionary movement has not been isolated by the victory of the Kuomintang. The Kremlin must weigh this appeal against the risks of a more direct confrontation with the Western-backed order in Asia."
 SWF_VIN.3.a:0 "Recognize Vietnam's independent revolutionary course."
 SWF_VIN.3.b:0 "Keep the relationship unofficial for now."

 SWF_VIN.4.t:0 "An Overture From Hanoi"
 SWF_VIN.4.d:0 "The Democratic Republic of Vietnam has approached the National Government with a proposal for practical accommodation. The Vietnamese leadership seeks to prevent the northern frontier from becoming another front in the struggle between revolution and reaction, offering assurances that its immediate struggle is directed against colonial domination rather than China.\n\nThe offer is politically delicate. Hanoi remains led by revolutionaries whose ideology is deeply suspect to Nanking, but cooperation - or at least restraint - could deny foreign powers an opportunity to exploit the border. The National Government must decide whether to pursue a cautious understanding or keep the Vietnamese movement at arm's length."
 SWF_VIN.4.a:0 "Explore a cautious accommodation."
 SWF_VIN.4.b:0 "Maintain only informal contact."

 # ------------------------------------------------------------------
 # Party and national-front development
 # ------------------------------------------------------------------

 SWF_VIN.5.t:0 "The General Political Department"
 SWF_VIN.5.d:0 "The People's Army cannot be sustained by weapons and orders alone. As the war grows in scale, the Government has approved the creation of the Tong Cuc Chinh Tri, the General Political Department, to coordinate political education, morale, cadre work, and Party organization throughout the armed forces.\n\nIts purpose is not merely to distribute slogans. The Department will ensure that soldiers understand the political meaning of the war, that commanders remain connected to the people, and that the army develops as an instrument of national liberation rather than a detached military caste. In a long revolutionary struggle, political cohesion is treated as a weapon no less essential than rifles or artillery."
 SWF_VIN.5.a:0 "The army must fight with both conviction and discipline."

 SWF_VIN.6.t:0 "Lessons From a Hundred Flowers"
 SWF_VIN.6.d:0 "Debates unfolding elsewhere in the socialist world have drawn attention in Hanoi. The call to let criticism, art, and scholarship speak more freely offers both a promise and a warning: a revolution that cannot hear the people may become brittle, yet an opening without political direction may be exploited by its enemies.\n\nVietnamese cadres have been instructed to study these developments carefully. The Republic must find room for criticism that strengthens national reconstruction while avoiding the factionalism and paralysis that colonial powers would eagerly encourage. The question is not whether ideas matter, but how a revolutionary state can cultivate them without losing its purpose."
 SWF_VIN.6.a:0 "Learn from every experiment, but follow our own path."

 SWF_VIN.7.t:0 "Lay Dan Lam Goc"
 SWF_VIN.7.d:0 "The Government has reaffirmed a simple principle: the people must remain the root of the revolution. Officials are being reminded that authority is not an end in itself, and that policies which ignore the conditions of workers, peasants, veterans, and families will weaken the very cause they are meant to serve.\n\nCadres across the Republic are instructed to listen more closely to local concerns, to correct abuses before they harden into resentment, and to ensure that wartime burdens are shared as fairly as possible. The struggle for national liberation cannot survive as an affair conducted above the heads of the people."
 SWF_VIN.7.a:0 "The people are the foundation of the Republic."

 SWF_VIN.8.t:0 "A National Solidarity Bloc"
 SWF_VIN.8.d:0 "The war has brought together forces that do not agree on every question of ideology, religion, or social policy, but do share an interest in Vietnamese independence. The Government now seeks to organize these currents into a broader National Solidarity Bloc, linking revolutionary cadres with patriotic intellectuals, local leaders, religious communities, and non-communist nationalists.\n\nSuch a coalition will inevitably be difficult to manage. Yet its advocates argue that the Republic cannot afford to narrow the national struggle at the very moment it needs the widest possible base of support. The task ahead is to build unity without surrendering the revolution's direction."
 SWF_VIN.8.a:0 "Independence requires the widest possible unity."

 SWF_VIN.9.t:0 "Ngo Dinh Diem's Manifesto"
 SWF_VIN.9.d:0 "A manifesto associated with Ngo Dinh Diem has intensified debate inside the emerging national coalition. Its language of moral renewal, national independence, and public responsibility appeals to many Vietnamese who distrust both colonial rule and rigid ideological politics. Others see in it the potential foundation of a rival political movement, especially among Catholic and conservative circles.\n\nThe Government must decide how to receive such currents. They may broaden the front against foreign domination, but they also carry their own ambitions and suspicions. The Republic will have to demonstrate that national unity can accommodate disagreement without allowing the struggle for independence to be captured by any single faction."
 SWF_VIN.9.a:0 "Let the debate serve the nation, not divide it."

 SWF_VIN.10.t:0 "The Viet Minh and Lien Viet Unite"
 SWF_VIN.10.d:0 "The Viet Minh and Lien Viet organizations have been merged into a single national front. The new structure is intended to bring revolutionary cadres, patriotic parties, religious organizations, intellectuals, and local associations into a common political framework while preserving the broad character of the independence movement.\n\nThe consolidation offers a clearer public face for the Republic and a stronger means of coordinating political work across the country. It also carries a warning: unity must be maintained through persuasion and participation, not merely announced from above. The Lien Viet Front will now be asked to demonstrate that the Vietnamese cause belongs to the entire nation."
 SWF_VIN.10.a:0 "A united front for national liberation."

 SWF_VIN.11.t:0 "The Reign of Stalin"
 SWF_VIN.11.d:0 "The continued authority of Joseph Stalin in Moscow has shaped the calculations of every communist movement. For Vietnam, the Soviet model offers an example of rapid transformation, centralized discipline, and uncompromising resistance to imperial pressure. It also demands clear political choices at a time when the Republic is still consolidating its institutions.\n\nSupporters of closer alignment argue that Vietnam must bind itself to the strongest socialist power available. They believe that unity of doctrine and organization will protect the revolution in its most dangerous years. Critics worry that Vietnam's circumstances require a more independent balance between international solidarity and national realities."
 SWF_VIN.11.a:0 "Stand firmly within the socialist camp."

 SWF_VIN.12.t:0 "After Stalin"
 SWF_VIN.12.d:0 "The death of Joseph Stalin has opened a period of uncertainty across the socialist world. Old assumptions are being questioned, new leaders are competing for influence, and communist parties everywhere must decide which elements of the Soviet experience to preserve and which to reconsider.\n\nFor Vietnam, the transition brings both danger and opportunity. A less certain Moscow may offer greater room for an independent national course, but it may also leave smaller revolutionary movements exposed to competing pressures. The Republic must honor international solidarity while ensuring that its own revolution is not reduced to an echo of disputes far beyond Indochina."
 SWF_VIN.12.a:0 "Vietnam must chart its own course."

 SWF_VIN.13.t:0 "Bamboo Diplomacy"
 SWF_VIN.13.d:0 "Vietnam's position demands a diplomacy as resilient as bamboo: firm in its roots, flexible in the wind, and difficult to break. The Republic cannot afford isolation, yet neither can it safely become the instrument of a distant power. Its survival depends upon maintaining ties across ideological boundaries while refusing to compromise on independence.\n\nThis approach will require patience, careful language, and a willingness to negotiate without surrendering principle. Vietnam will seek friends where it can, avoid unnecessary conflicts, and preserve room to maneuver between larger states whose rivalries may otherwise decide the future of Indochina."
 SWF_VIN.13.a:0 "Firm roots, flexible branches."

 # ------------------------------------------------------------------
 # Southern resistance and National Liberation Front
 # ------------------------------------------------------------------

 SWF_VIN.14.t:0 "The Nam Bo Resistance"
 SWF_VIN.14.d:0 "The southern struggle cannot be treated as a secondary theater. In Nam Bo, the resistance confronts a fragmented political landscape of colonial authorities, local militias, sectarian forces, criminal organizations, and competing nationalist groups. The region's rivers, cities, and dense population make it both a vital prize and a uniquely difficult arena for revolutionary work.\n\nHanoi has therefore directed greater attention toward the south. Political organizers, military instructors, couriers, and supplies will be sent where possible, while local forces are encouraged to build a movement capable of surviving even when direct communication with the north is interrupted."
 SWF_VIN.14.a:0 "The southern front must endure."

 SWF_VIN.15.t:0 "Empower the Democratic Front"
 SWF_VIN.15.d:0 "The struggle in the south cannot be carried by one party or one social group alone. A broader Democratic Front is being strengthened to unite anti-colonial activists, workers, students, religious communities, local militias, and patriotic organizations behind a common demand for Vietnamese self-determination.\n\nThe coalition will be imperfect and often contentious. Its members bring different traditions, interests, and visions for the country's future. Yet the Front's advocates argue that these differences are less important than the immediate necessity of resisting foreign domination. By giving southern forces a wider political banner, Hanoi hopes to turn scattered opposition into an organized national movement."
 SWF_VIN.15.a:0 "Build the broadest possible southern coalition."

 SWF_VIN.16.t:0 "After Nguyen Binh"
 SWF_VIN.16.d:0 "The death of Nguyen Binh has left the southern resistance without one of its most capable and independent commanders. His networks united guerrilla units, urban organizers, sectarian contacts, and local armed groups under conditions of extraordinary pressure. Without him, the National Liberation Front must choose a leader who can hold these forces together while defining the political character of the struggle.\n\nThe choice is consequential. Le Duc Tho offers disciplined Party leadership and a closer connection to Hanoi. Tran Quoc Buu represents a more syndicalist and labor-oriented current. Kieu Cong Cung promises a radical southern path less easily contained by orthodox structures. The future of the Front now rests on this decision."
 SWF_VIN.16.a:0 "Le Duc Tho will secure Party leadership."
 SWF_VIN.16.b:0 "Tran Quoc Buu will rally the organized workers."
 SWF_VIN.16.c:0 "Kieu Cong Cung will lead a radical southern front."

 SWF_VIN.17.t:0 "The Southern Revisionist Question"
 SWF_VIN.17.d:0 "The Party's Central Committee has begun reviewing the status of several prominent revolutionary figures in the South who continue to fight under the banner of national liberation but refuse to join the Party. Among the most notable are Brigadier Kieu Cong Cung, deputy to Lieutenant General Nguyen Binh and a representative of the National Assembly, and Tran Quoc Buu, a veteran trade union organizer and commander of the famed Dac Cong Unit 25. Both men have rendered distinguished service against French colonialism and the Bao-Dai regime, yet neither has accepted Party membership. Instead, they advocate various forms of syndicalism, Christian socialism, and revisionist Marxism, arguing that the revolution should remain a broad national movement rather than one led exclusively by Marxist-Leninists. This has ignited fierce debate within the Party. Lieutenant General Nguyen Binh argues that the Southern battlefield demands the broadest possible united front. In his view, every patriot willing to fight colonialism should be welcomed regardless of ideological differences, provided they remain loyal to the revolution. However, orthodox cadres led by Le Duc Tho warn that tolerating revisionist tendencies within the resistance risks undermining Party discipline and ideological unity. They argue that history has repeatedly shown opportunism and factionalism to be the greatest threats to a revolutionary movement from within. After careful deliberation, the Central Committee has reached its decision."
 SWF_VIN.17.a:0 "Unity Against the Colonialists Must Come First."
 SWF_VIN.17.b:0 "The small caterpillars pests needs to be removed from the big Tree."

 SWF_VIN.150.t:0 "The Stalinist Opposition Emerges"
 SWF_VIN.150.d:0 "Recent reports from the Public Security force (Cong An), reinforced by information from friendly intelligence services, have revealed the existence of a small but increasingly vocal faction within the revolutionary movement opposed to the political line of President Ho Chi Minh.\n\nCentered around Tran Ngoc Danh and La Vinh Loi, the group has accused the Party leadership of abandoning orthodox Marxism-Leninism in favor of what it describes as \"bourgeois nationalism.\" Between late 1949 and early 1950, Tran Ngoc Danh reportedly sent a series of letters to the Central Committee of the Communist Party of the Soviet Union criticizing Ho Chi Minh's leadership. He argued that the dissolution of the Indochinese Communist Party and the emphasis on a broad patriotic united front represented dangerous ideological deviations.\n\nThe faction further alleges that the Party has placed excessive emphasis on national unity rather than class struggle, and has accused Ho Chi Minh of cultivating a personal prestige incompatible with collective revolutionary leadership. Meanwhile, La Vinh Loi is reported to have traveled abroad without authorization in an effort to secure direct Soviet political, financial, and military support, while openly criticizing the Party's current line alongside Tran Ngoc Danh.\n\nThe Party leadership has rejected these accusations as dogmatism divorced from the realities of Vietnam's revolutionary struggle. President Ho Chi Minh and General Secretary Truong Chinh maintain that the immediate task remains national liberation through the Great National Unity Front, arguing that socialism can only be built after independence has been secured.\n\nFollowing an investigation by the Central Committee, both Tran Ngoc Danh and La Vinh Loi have been expelled from the Party for violating organizational discipline and conducting unauthorized political activity abroad."
 SWF_VIN.150.a:0 "The national revolution to liberate all Vietnamese remains our highest priority."

 SWF_VIN.151.t:0 "Death of Nhuong Tong"
 SWF_VIN.151.d:0 "The Ministry of Public Security has confirmed the death of Nhuong Tong, General Secretary of the Viet Nam Quoc Dan Dang (VNQDD) and one of the last prominent leaders of the party's left-wing nationalist faction.\n\nA veteran revolutionary and intellectual, Nhuong Tong had long been active in the struggle against French colonial rule. Following the collapse of the Vietnam Nationalist Government in late 1946, he reorganized VNQDD activity in French-controlled areas around Hanoi. Although he later accepted an advisory position under Governor Nghiem Xuan Thien in support of the Bao-Dai Solution, he gradually withdrew from public life and returned to practicing traditional Chinese medicine.\n\nAccording to the Ministry of Public Security, newly uncovered intelligence revealed that Nhuong Tong had secretly attempted to coordinate a final nationwide uprising by remaining Viet Quoc paramilitary groups against the Democratic Republic of Vietnam. Acting on this information, Public Security officer Nguyen Van Viet arrested him on 8 September 1949 on the outskirts of Hanoi.\n\nFollowing several weeks of investigation, the Government announced that Nhuong Tong had died while in custody. Officials maintain that his death resulted from illness during detention. Supporters of the Viet Quoc, however, have accused the revolutionary authorities of eliminating one of the last influential nationalist leaders opposed to the Viet Minh."
 SWF_VIN.151.a:0 "Checkmate."

