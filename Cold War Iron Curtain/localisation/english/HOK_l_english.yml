l_english:
 HOK_entrepot_economy:0 "Entrepot Trade"
 HOK_entrepot_economy_desc:0 "Hong Kong's shipping agents and merchant houses connect local workshops to suppliers overseas. Cargo arriving through the harbour brings the materials that an industrial colony with few resources of its own must buy abroad."
 HOK_textile_boom_idea:0 "Textile Expansion"
 HOK_textile_boom_idea_desc:0 "Spinning mills supply yarn to weaving sheds and garment workshops, where orders from overseas keep cutting tables crowded. Machinery and skills brought by mainland manufacturers have helped turn textiles into a mainstay of Hong Kong's factory trade."
 HOK_light_electronics:0 "Radio Assembly"
 HOK_light_electronics_desc:0 "Small factories assemble transistor radios from imported components for sale abroad. Close ties with overseas suppliers and careful use of materials let these firms expand without building every stage of electronics production locally."
 HOK_Light_Industry_category:0 "Export Manufacturing"
 HOK_textile_boom:0 "Expand the Textile Mills"
 HOK_textile_boom_desc:0 "Support the expansion of spinning and weaving mills serving Hong Kong's garment trade. More reliable supplies of cloth will help workshops meet overseas orders for inexpensive clothing."
 HOK_transistor_workshops:0 "Back Transistor Workshops"
 HOK_transistor_workshops_desc:0 "Help local firms establish workshops for assembling transistor radios, with premises for their technical and commercial staff. Imported components and overseas buyers offer a route into electronics exports alongside the textile trade."
