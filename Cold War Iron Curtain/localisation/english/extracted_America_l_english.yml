 USA_FRAIND.1.a2:0 "It's time for decolonization"
 USA_FRAIND.1.b2:0 "We will stay as long as please"
 USA_FRAIND.1.t2:0 "America Calls for French Withdrawal from Indochina"
 USA_FRAIND.2.a2:0 "Good"
 USA_FRAIND.2.t2:0 "France Agrees"
 USA_FRAIND.3.a2:0 "Damn them..."
 USA_FRAIND.3.t2:0 "France Rejects our Proposals"
 USA_INDO.1.a2:0 "Very well - we will send our delegates."
 USA_INDO.1.b2:0 "France will decide when this war ends, not Washington."
 USA_INDO.1.t2:0 "Pressure to Consider Diplomatic Options in Indochina"
 USA_INDO.2.t:0 "France Agrees to Talks"
 USA_INDO.2.d:0 "Paris has answered. The Quai d'Orsay informs us that the French government is prepared to send a delegation to negotiate a settlement in Indochina, and that it will not obstruct an international conference on the question. Our embassy reports the decision was taken over the objections of the general staff, who insist the military position is recoverable, and that the government spent a considerable part of its remaining authority to carry it. The State Department regards this as the breakthrough we have been working toward - the war in Indochina will now be settled at a table rather than in the Tonkin delta."
 USA_INDO.2.a:0 "A settlement at last."
 USA_INDO.3.t:0 "France Refuses to Negotiate"
 USA_INDO.3.d:0 "Paris has refused. The French government informs us that it will not open negotiations while its forces remain engaged, that a settlement sought from a position of weakness would abandon those Indochinese who have staked their lives on the French presence, and that the conduct of the war remains a French affair. Our ambassador reports the reply was drafted by the general staff rather than the foreign ministry. The practical consequence is that the fighting continues, the Viet Minh gains another season to consolidate, and American prestige in Asia is spent underwriting a war we are not permitted to end."
 USA_INDO.3.a:0 "Then they will fight it without us."
 USA_INDO.4.t:0 "The Camp Has Fallen"
 USA_INDO.4.d:0 "Dien Bien Phu is gone, and with it the last argument that the French position in Tonkin is recoverable. The garrison's last transmission was logged this morning. The Joint Chiefs have been asked what remains of the northern front and have answered, in writing, that there is no northern front — there are posts, and there is the delta, and between them there is the Viet Minh.\n\nParis will go to Geneva now whether or not we approve of it; the only question left open is what our delegation is sent there to do. State's assessment is blunt. A ceasefire and a partition line can be salvaged. A nationwide ballot cannot: any free vote held across both zones in the next two years returns Ho Chi Minh with something close to eighty percent, and the President is not going to sign a document that schedules the loss of the country we are being asked to underwrite.\n\nThe alternative is to attend and to sign nothing — to let the French and the communists write their own accords, keep our hands clean of them, and build whatever we build afterwards on ground of our own choosing."
 USA_INDO.4.a:0 "Save the line. The vote is not ours to give away."
 USA_INDO.4.b:0 "We will attend. We will not put our name to it."
 USA_INDO.5.t:0 "Washington Will Not Wait"
 USA_INDO.5.d:0 "The American ambassador called at the Quai d'Orsay without an appointment. He did not raise the question of whether there should be a conference — he raised the question of when our delegation departs.\n\nDien Bien Phu has done to the government what four years of the war could not. The Assembly is in session, the general staff has stopped offering assurances, and the wire services have already printed the casualty estimate. There is no version of this in which France goes on paying for Indochina, and our allies have evidently reached that conclusion a little ahead of us.\n\nThe corps will be told to hold what it holds. The government will go to Geneva and try to keep the settlement from becoming a rout."
 USA_INDO.5.a:0 "Then we go to Geneva to save what can be saved."
