 geneva_core_delegation:0 "A core Geneva delegation"
 geneva_interim_government_period:0 "The §Yinterim government§! period is under way"
 geneva_unified_settlement:0 "Geneva produced a §Yunified settlement§!"
 indochina_diplomacy_lock_communist:0 "Indochina diplomacy is locked to the communist camp"
 indochina_diplomacy_lock_profrance:0 "Indochina diplomacy is locked to France"
 indochina_diplomacy_lock_proindependence:0 "Indochina diplomacy is locked to independence"
 indochina_french_held_state_trigger_TT:0 "The region is held by CEFEO, France, the State of Vietnam or a French-aligned minority"
 indochina_french_held_state_trigger_TT_NOT:0 "The region is not held by CEFEO, France, the State of Vietnam or a French-aligned minority"
 IC_Aid.1.t:0 "Advisers for the Viet Minh"
 IC_Aid.1.d:0 "The Viet Minh have accepted a Chinese military advisory group and a first delivery of rifles and support equipment. The mission puts officers of the People's Liberation Army in regular contact with the Vietnamese command. Its instructors can report how the Viet Minh organize and supply their regiments, giving Beijing a better account of the war than it can obtain from the border posts alone.\n\nThe agreement has already been made. Beijing must decide whether to announce the mission as aid to a neighbouring revolution or leave the work in the hands of the army without a public declaration."
 IC_Aid.1.a:0 "Announce the mission as fraternal aid"
 IC_Aid.1.b:0 "Leave the mission to the army"
 IC_Aid.2.t:0 "A Soviet Mission for the Viet Minh"
 IC_Aid.2.d:0 "Moscow has agreed to a military mission for the Viet Minh. Artillery and anti-aircraft guns are to travel the long road through China, along with a handful of instructors for the heavy weapons crews.\n\nThe Kremlin must decide whether Soviet backing for a colonial war in Indochina should be announced, or left to travel through Beijing without a Soviet name on it."
 IC_Aid.2.a:0 "Announce Soviet support to the world press"
 IC_Aid.2.b:0 "Keep the mission in military channels"
 IC_Aid.3.t:0 "Convoys on the Border Road"
 IC_Aid.3.d:0 "Border commands in southern China report that rifles and lorries are passing into Viet Minh depots. The traffic is no longer occasional: the Vietnamese quartermasters are drawing on Chinese stocks to equip whole units. The officers who release the stores know what has left their depots, but reports from the Vietnamese side give them little idea where it has been issued.\n\nThe People's Liberation Army wants common returns from the depots so it can plan future deliveries. The alternative is to leave the arrangement with the frontier commands, which have kept the consignments moving without a formal agreement in Beijing."
 IC_Aid.3.a:0 "Have the army coordinate the depots"
 IC_Aid.3.b:0 "Leave deliveries to the frontier commands"
 IC_Aid.4.t:0 "French Arms in Viet Minh Hands"
 IC_Aid.4.d:0 "French intelligence reports that Viet Minh workshops are studying and copying French rifles. Some specimens were taken in battle; others appear to have been bought through intermediaries. The discovery raises a question for the Ministry of National Defence: whether the Expeditionary Corps is losing arms only when posts are overrun, or whether serviceable rifles are leaving its supply system before they reach the troops.\n\nThe ministry can spend time and political capital tracing the losses through the depot returns, or defend the command's accounts on the grounds that no army can account for every rifle in a long war."
 IC_Aid.4.a:0 "Order an inquiry into arms losses"
 IC_Aid.4.b:0 "Treat it as battlefield attrition"
 IC_Aid.5.t:0 "American Rifles in Viet Minh Hands"
 IC_Aid.5.d:0 "American-made small arms supplied for the French effort are turning up in Viet Minh hands, some taken in battle and some sold on through the black market. Washington's observers are uneasy about where the weapons end up.\n\nThe government can press Paris for stricter end-use checks, or accept the leakage as a cost of arming an ally in a distant war."
 IC_Aid.5.a:0 "Ask Paris for stricter end-use checks"
 IC_Aid.5.b:0 "Accept it as the cost of aiding France"
 IC_Aid.6.t:0 "Soviet Trucks for the Viet Minh"
 IC_Aid.6.d:0 "Soviet trucks and prime movers are on their way to the Viet Minh through China. The Vietnamese have depended heavily on porters to move stores from the border to inland depots. Lorries give their quartermasters a way to carry heavier loads where the roads will take them, but the same vehicles will soon be idle if the depots cannot obtain parts or train mechanics.\n\nMoscow can claim the consignment as evidence of socialist cooperation. The military transport service would rather keep the shipment out of the press and examine how Soviet vehicles fare on Indochinese roads."
 IC_Aid.6.a:0 "Publicize the aid as socialist cooperation"
 IC_Aid.6.b:0 "Keep it in military transport channels"
 IC_Aid.7.t:0 "Trucks from China for the Viet Minh"
 IC_Aid.7.d:0 "Beijing has released lorries from Chinese stocks to the Viet Minh. The vehicles come from several sources, including machines recovered and repaired after the civil war. They can carry rice and ammunition in quantities that porters cannot match, although Vietnamese mechanics will have to keep unfamiliar makes running with the parts on hand.\n\nThe shipment gives Beijing a chance to show that the Vietnamese revolution can draw on Chinese industry and army stocks. Officers on the frontier would rather keep the transfer out of the newspapers and deal with the Vietnamese transport service directly."
 IC_Aid.7.a:0 "Announce Chinese transport aid"
 IC_Aid.7.b:0 "Keep the transfer in army channels"
 IC_Aid.8.t:0 "American Vehicles Sold to the Viet Minh"
 IC_Aid.8.d:0 "American-made lorries have appeared in Viet Minh motor pools. The State Department's reports point to purchases from regional brokers and give no evidence that Washington authorized a sale. Vehicles sold as surplus pass through several owners, and a dealer's invoice may reveal little about where they eventually entered service.\n\nThe administration can have its representatives trace the purchases to see which controls actually apply. Officials responsible for the French aid program caution that the inquiry could widen into a dispute over American responsibility for every resale of wartime equipment in Asia."
 IC_Aid.8.a:0 "Trace the sales through regional brokers"
 IC_Aid.8.b:0 "Leave the surplus trade alone"
 IC_Aid.9.t:0 "American Designs Studied in Vietnam"
 IC_Aid.9.d:0 "American officials have learned that workshops serving the Viet Minh have acquired American vehicles and technical drawings from abroad. The immediate question is what those workshops can make themselves. Even where an engine or gearbox is beyond local manufacture, a drawing can help a mechanic keep a truck in service by repairing a part that would otherwise have to be imported.\n\nMilitary observers want to examine the drawings and establish how they reached Vietnam. Export officials doubt whether a formal investigation would recover material already in the hands of overseas dealers."
 IC_Aid.9.a:0 "Investigate the transfer of the drawings"
 IC_Aid.9.b:0 "File the report without an inquiry"
 IC_Aid.10.t:0 "Yugoslav Vehicles for Vietnam"
 IC_Aid.10.d:0 "A small number of Yugoslav-built vehicles have been sold to the Viet Minh, along with technical drawings. Belgrade has few ties to Indochina, but the sale brings in foreign exchange and keeps its factories busy.\n\nThe government can keep the sale as a modest commercial matter, or speak openly of it as proof that socialist countries need not follow a single capital."
 IC_Aid.10.a:0 "Keep it a modest commercial matter"
 IC_Aid.10.b:0 "Speak of independent socialist cooperation"
 IC_Aid.11.t:0 "Rifles for the Sects of the South"
 IC_Aid.11.d:0 "The southern Viet Minh are recruiting among men associated with the Binh Xuyen and other armed groups. Their new formations have received rifles of the kind issued by the State of Vietnam. Saigon cannot tell from the weapons alone which were captured, which were sold, and which travelled with men who changed sides.\n\nThe affair puts the status of the southern militias before the cabinet. Ordering a review of their arms and terms of service would force a dispute with commanders who guard their independence. Leaving the arrangements intact would preserve their support in the capital without giving the government firmer control over their men."
 IC_Aid.11.a:0 "Review the sects' arms and terms of service"
 IC_Aid.11.b:0 "Leave the arrangements with the sects intact"
 IC_Aid.12.t:0 "Colonial Supply Reform"
 IC_Aid.12.d:0 "The Expeditionary Corps has revised its supply arrangements and received five thousand rifles from metropolitan stocks. The shipment is large enough for the National Assembly to ask whether the new system merely hastens deliveries or gives Paris a better account of what the war consumes. The army wants the rifles in depots before the next set of demands from the field.\n\nMinisters can present the new supply arrangements to deputies as evidence that the expenditure is under control. The military departments would prefer to keep debate over stock and replacement schedules out of the Assembly."
 IC_Aid.12.a:0 "Present the reform to the Assembly"
 IC_Aid.12.b:0 "Leave it to the military departments"
 IC_Aid.13.t:0 "Rifles for the National Army"
 IC_Aid.13.d:0 "The Expeditionary Corps has issued ten thousand rifles from its own stocks to the Vietnamese National Army. The transfer lets Saigon arm more men out of its own depots. It also exposes a disagreement in Paris: some deputies welcome a Vietnamese army able to take over French duties, while others ask whether its expansion will actually reduce the demand for French officers and stores.\n\nThe ministry can give the transfer a public place in France's account of the Associated State. The army would rather concentrate on the handover and on how the Vietnamese units make use of the rifles."
 IC_Aid.13.a:0 "Present the transfer as a step toward autonomy"
 IC_Aid.13.b:0 "Leave the handover to the army"
 IC_Aid.14.t:0 "Rifles for the National Army"
 IC_Aid.14.d:0 "Crates of rifles released by the Expeditionary Corps are arriving at the depots of the National Army. They are old French stock, but for many young recruits they will be their first weapon of any kind.\n\nThe State of Vietnam's leaders can hold a public ceremony to show that the army is theirs, or issue the arms quietly to garrison units and begin training at once."
 IC_Aid.14.a:0 "Hold a public handover ceremony"
 IC_Aid.14.b:0 "Issue the rifles quietly and begin training"
 IC_Aid.15.t:0 "Arms for the Royal Lao Army"
 IC_Aid.15.d:0 "Two Royal Lao divisions are being formed with rifles, artillery and other stores drawn from French stocks. The new formations give the kingdom a way to put regular troops under its own colours rather than rely on the Expeditionary Corps to provide a garrison wherever one is needed. They still depend on French instructors and on the supply arrangements that delivered their guns.\n\nThe government can mark the raising of the divisions publicly as an assertion of Lao authority. The army's officers argue that the first priority should be getting the recruits trained under the French mission."
 IC_Aid.15.a:0 "Announce the new Royal Lao divisions"
 IC_Aid.15.b:0 "Let the French mission handle the training"
 IC_Aid.16.t:0 "Arms for the Khmer National Army"
 IC_Aid.16.d:0 "The Khmer National Army is forming two divisions with rifles, guns and equipment from the French Expeditionary Corps. Phnom Penh can now field national formations for duties that otherwise fall to French garrisons. Who commands the troops and who supplies them remain separate questions: the kingdom has the former authority, but it still needs French stocks and instruction to exercise it.\n\nThe cabinet must decide whether to present the divisions as evidence of Cambodian authority or put the emphasis on training the men and organizing their depots."
 IC_Aid.16.a:0 "Present the divisions as Cambodia's own"
 IC_Aid.16.b:0 "Concentrate on training the new divisions"
 IC_Aid.17.t:0 "Associated State Armies"
 IC_Aid.17.d:0 "The Expeditionary Corps has furnished arms and equipment for two divisions each in Laos and Cambodia. Paris can point to formations under Lao and Khmer colours when deputies ask what the Associated States contribute to their own defence. No French garrison has been relieved merely by the issue of the rifles, and both armies still need instructors.\n\nThe government can make a public case for the program before the Assembly. The army wants the ministry to concentrate on what duties the new formations can actually assume and how long the French command must supply them."
 IC_Aid.17.a:0 "Make the case for the Associated States"
 IC_Aid.17.b:0 "Review which duties the new armies can assume"
 IC_Aid.18.t:0 "American Financing for the French War"
 IC_Aid.18.d:0 "The United States has agreed to meet a larger share of the French Expeditionary Corps' expenses in Indochina. The State Department regards the appropriation as a way to sustain resistance to the Viet Minh without sending American troops. Members of Congress can still ask whether the money will strengthen the Associated States or keep a colonial war going on terms set in Paris.\n\nThe administration can make the anti-communist case publicly or keep the program out of a wider debate while officials examine how the French command is using the aid."
 IC_Aid.18.a:0 "Make the case for aid against communism"
 IC_Aid.18.b:0 "Keep the program in official channels"
 IC_Notice_VIN.1.t:0 "The Cao Bang and Lang Son Garrisons"
 IC_Notice_VIN.1.d:0 "Tho headmen report Viet Minh columns approaching the garrisons at Cao Bang and Lang Son. Both towns sit on Route Coloniale 4, which carries French traffic between the frontier posts. The territorial battalions are responsible for the towns, but their officers also rely on village reports to know which roads still carry civilian traffic and which outlying posts remain in contact.\n\nThe Tho council has to decide how much of the defence to leave to the village militias and how much authority to put in the hands of the Expeditionary Corps."
 IC_Notice_VIN.1.a:0 "Keep the village militias on local duty."
 IC_Notice_VIN.1.b:0 "Ask the French command to coordinate defence."
 IC_Notice_VIN.2.t:0 "The Border Fighting Reaches Nung Country"
 IC_Notice_VIN.2.d_win:0 "The Viet Minh have secured Cao Bang and Lang Son. The Nung territory lies outside the ground taken in the campaign, but its council can no longer count on the Tho garrisons to hold the northwestern approaches. Men who served with the French want to know whether their families may stay in villages near the old line of posts.\n\nThe council can maintain order with its own militia officers. It can also seek a common arrangement with French and neighbouring authorities for keeping communications open."
 IC_Notice_VIN.2.d_fail:0 "The Viet Minh campaign has ended without securing both Cao Bang and Lang Son. The Tho garrisons still stand between the Viet Minh and much of Nung territory, but the fighting has shown how quickly the frontier posts can lose touch with one another. Nung administrators want a reliable account of which roads and markets remain open.\n\nThe council has to choose between relying first on its local militias and seeking a joint arrangement for the roads with the authorities on either side of its boundary."
 IC_Notice_VIN.2.a:0 "Keep the Nung militias on local duty."
 IC_Notice_VIN.2.b:0 "Seek an agreement to keep the roads open."
 IC_Notice_VIN.3.t:0 "News from the Frontier Road"
 IC_Notice_VIN.3.d_win:0 "Dispatches to Paris confirm the loss of Cao Bang and Lang Son, the two principal Tho positions on Route Coloniale 4. The loss of the frontier posts weakens the French position in northeastern Tonkin and brings fresh questions before the National Assembly. Deputies want to know why posts dependent on a single road were expected to hold without relief from the delta.\n\nMinisters must decide whether to defend the Expeditionary Corps in the Assembly or ask the command for a full account of the garrisons before taking a public position."
 IC_Notice_VIN.3.d_fail:0 "The Cao-Bac offensive has ended without the Viet Minh securing its two frontier objectives. Paris still has a chain of posts in northeastern Tonkin, but the Expeditionary Corps must supply them over the same roads that were in dispute during the campaign. A report of the result alone will not tell the National Assembly what keeping the garrisons there will cost.\n\nThe government can defend the present dispositions before the deputies or ask for a military review of the frontier command."
 IC_Notice_VIN.3.a:0 "Defend the army's conduct before the Assembly."
 IC_Notice_VIN.3.b:0 "Admit the difficulties and ask for a review."
 IC_Notice_VIN.4.t:0 "The Cao-Bac Report Reaches Beijing"
 IC_Notice_VIN.4.d_win:0 "The Viet Minh have taken Cao Bang and Lang Son, removing two French-aligned garrisons from the road along China's southern frontier. The Chinese border commands expect the result to ease deliveries to Vietnamese depots. Holding the frontier also leaves the Viet Minh less dependent on agreements with individual villages each time a consignment comes through.\n\nBeijing can cite the result as a victory for a neighbouring revolution, or keep the report in military channels and study what the campaign has shown about the handling of supplies."
 IC_Notice_VIN.4.d_fail:0 "Reports from the frontier say the Viet Minh have closed the Cao-Bac operation without taking both garrison towns. The French-aligned posts on Route Coloniale 4 still complicate traffic along the border. Chinese commanders want to know which Vietnamese depots can continue drawing from existing crossings without assuming that the road will soon be clear.\n\nBeijing can restate its support for the Viet Minh in public or leave the frontier commands to discuss the report with the Vietnamese staff."
 IC_Notice_VIN.4.a:0 "Reaffirm China's support for the Viet Minh."
 IC_Notice_VIN.4.b:0 "Review the campaign with the frontier command."
 IC_Notice_VIN.5.t:0 "Washington Assesses the Cao-Bac Campaign"
 IC_Notice_VIN.5.d_win:0 "The State Department reports that the Viet Minh now hold Cao Bang and Lang Son. The loss of the two garrisons gives them easier access to China and calls into question the French command's ability to close that frontier. For Congress, the issue is whether American rifles sent to Indochina can offset steady supplies from across the border.\n\nThe administration can use the report to argue for continued support or seek a clearer account from Paris of how the remaining posts will be held."
 IC_Notice_VIN.5.d_fail:0 "The State Department reports that the Viet Minh campaign has not secured both Cao Bang and Lang Son. The outcome preserves French-aligned positions along the Chinese frontier without removing Washington's concern about supplies entering from China. Congress will still want to know what the Expeditionary Corps can do with the equipment already committed to it.\n\nThe administration can make the public case for aid or seek an explanation from Paris through the embassy."
 IC_Notice_VIN.5.a:0 "Urge Congress to support the French effort."
 IC_Notice_VIN.5.b:0 "Quietly press Paris for a clearer strategy."
 IC_Notice_VIN.6.t:0 "The Fighting at Vinh Yen"
 IC_Notice_VIN.6.d_win:0 "Viet Minh forces have secured their objective at Vinh Yen, on the northwestern approaches to the Red River delta. Reports reaching the State of Vietnam concern more than the loss of a military position. District officials need to know whether the roads will still carry government couriers, and local officers are asking which Vietnamese units will be available if the fighting spreads toward the delta villages.\n\nSaigon must decide whether to reassure the districts publicly or use the campaign to make a case for training and employment of its own officers."
 IC_Notice_VIN.6.d_fail:0 "The Viet Minh have ended their attack on Vinh Yen without holding the position they sought. The approaches to the northwestern delta remain open to the State of Vietnam, whose officials can keep visiting the districts that depend on the road. The defence still relied on the French-aligned command, a fact that Vietnamese officers say should inform the next decisions about their own army.\n\nSaigon can issue a statement to the delta districts or press for a greater role for the Vietnamese officer corps."
 IC_Notice_VIN.6.a:0 "Reassure the delta districts."
 IC_Notice_VIN.6.b:0 "Press for a greater role for Vietnamese officers."
 IC_Notice_VIN.7.t:0 "The Fighting at Mao Khe"
 IC_Notice_VIN.7.d_win:0 "Viet Minh troops have taken the objective at Mao Khe. The mine settlements and transport links of the coal district serve the eastern delta, so the loss is felt in Hanoi's civil offices as well as in military headquarters. The State of Vietnam must decide what guarantees its officials can give to mining communities when the French command controls the regular troops on which those assurances depend.\n\nSaigon can put civil administration first or have the Vietnamese National Army study the defence and prepare its officers for similar fighting."
 IC_Notice_VIN.7.d_fail:0 "The Viet Minh offensive has closed without securing Mao Khe. The State of Vietnam retains access to the coal district, where the continuity of work and wages matters to the provincial administration as much as the military result. The campaign has also shown how readily French commanders have to take charge when regular forces are required.\n\nThe government can concentrate on restoring civil business around the mines or make the defence a subject of instruction for officers of the Vietnamese National Army."
 IC_Notice_VIN.7.a:0 "Strengthen the local administration in the delta."
 IC_Notice_VIN.7.b:0 "Ask for more training for national army units."
 IC_Notice_VIN.8.t:0 "The Fighting on the Day River"
 IC_Notice_VIN.8.d_win:0 "The Viet Minh have forced positions on the Day River in the southern Red River delta. Saigon's concern is how the crossing will affect district offices that rely on the river posts to keep in touch with the countryside. Village authorities ask whether government services will continue and who will answer for their protection when French troops are needed elsewhere.\n\nThe cabinet can speak directly to the delta districts or put Vietnamese officers in charge of examining the campaign and drawing up recommendations."
 IC_Notice_VIN.8.d_fail:0 "The Viet Minh offensive on the Day River has ended without securing its objectives. Local officials in the southern delta retain the line of posts on which they depend for communications with the provincial towns. For Saigon, the result gives grounds for a public statement, but it also offers the Vietnamese National Army a chance to examine how the defence was conducted while the reports are still current.\n\nThe government must choose where to place its immediate attention."
 IC_Notice_VIN.8.a:0 "Address the delta districts publicly."
 IC_Notice_VIN.8.b:0 "Put Vietnamese officers in charge of the review."
 IC_Notice_VIN.9.t:0 "News from the Day River"
 IC_Notice_VIN.9.d_win:0 "The Expeditionary Corps reports that the Viet Minh have forced the Day River line. Dispatches from the southern delta reopen the question deputies have put to successive governments: what France can still hold with the battalions the Assembly is prepared to pay for. The command has to explain what the loss of the river positions means for its remaining garrisons.\n\nMinisters can defend the continuance of the war before the Assembly or ask for a review of the delta dispositions before making any further commitment in public."
 IC_Notice_VIN.9.d_fail:0 "The Viet Minh have failed to secure their objectives on the Day River. The French command still holds the southern approaches to the Red River delta. Paris nevertheless needs a reckoning of the men and supplies required to maintain the river posts, especially if troops elsewhere are to be made available for relief.\n\nThe ministry can cite the defence before deputies who doubt the war can be sustained, or send the dispatches back to the high command with a request for a fuller review."
 IC_Notice_VIN.9.a:0 "Defend the conduct of the war in the Assembly."
 IC_Notice_VIN.9.b:0 "Order a full review of delta defences."
 IC_Notice_VIN.10.t:0 "Word from Na San"
 IC_Notice_VIN.10.d_win:0 "The Viet Minh have taken the position at Na San. The airfield and its ring of posts were meant to keep a French force inside the Tai highlands even when the roads could not be relied upon. The federation's chiefs must now judge which districts can still count on a regular garrison and which will have to rely on their own men.\n\nThe council can organize local watch and militia duty while families decide whether to leave exposed villages, or press the Expeditionary Corps for a firm account of the positions it will continue to defend."
 IC_Notice_VIN.10.d_fail:0 "The Viet Minh have closed the Na San campaign without taking the position. The French garrison remains in the highlands, but its dependence on supplies brought in by air is plain to the federation's chiefs. The defence has bought time for the outlying districts; it does not tell their headmen when they can expect help if the next attack falls outside the camp.\n\nThe chiefs can use the time to organize the local posts or ask the French command to specify the protection it will offer beyond Na San."
 IC_Notice_VIN.10.a:0 "Rally the Tai militias to the highland posts."
 IC_Notice_VIN.10.b:0 "Appeal to France for firm guarantees."
 IC_Notice_VIN.11.t:0 "Viet Minh Stir in the Northwest"
 IC_Notice_VIN.11.d:0 "The Viet Minh have opened an offensive to recover passage through the northwestern hills. Tai headmen report scouts and porters near the roads into the Black River country. Several of those routes serve villages that supply the federation's posts, and closing them would cut civilian traffic as well as hinder the garrisons.\n\nThe chiefs want men who know the district to stay near their villages. French officers are in a position to coordinate the wider defence, but the council will have to ask what stores and troops the Expeditionary Corps can spare."
 IC_Notice_VIN.11.a:0 "Call up the Tai militias and watch the valleys."
 IC_Notice_VIN.11.b:0 "Ask French officers for supplies and reassurance."
 IC_Notice_VIN.12.t:0 "The Fight for the Northwest Corridor"
 IC_Notice_VIN.12.d_win:0 "The Viet Minh have reopened the northwest corridor at heavy cost and taken Hoang Lien Son. The loss removes ground on which the Tai Federation relied to keep its interior routes apart from the Viet Minh supply roads. Headmen in districts still under the federation want to know which posts will be maintained and where travellers can pass without crossing the new line.\n\nThe chiefs can organize the remaining valley posts locally or make a public case for French protection of the districts that are still in federation hands."
 IC_Notice_VIN.12.d_fail:0 "The Viet Minh operation has closed without reopening the northwest corridor, and the federation has not had to give up Hoang Lien Son. The chiefs are concerned that the French command will take the result as grounds for moving its reserves elsewhere while the valley posts still need men and supplies.\n\nThe council can give the local militias responsibility for the roads or use the result to press France to renew its commitments in the northwest."
 IC_Notice_VIN.12.a:0 "Organize the valley posts locally."
 IC_Notice_VIN.12.b:0 "Make the case for French protection."
 IC_Notice_VIN.13.t:0 "Word from Nghia Lo"
 IC_Notice_VIN.13.d_win:0 "The Viet Minh have secured Nghia Lo, the market town at the centre of the Muong Lo basin. Several roads used by Tai officials and militia detachments meet there. Its loss separates some outlying villages from the posts that had kept them in contact with federation authorities.\n\nThe chiefs must decide whether to concentrate on keeping the remaining valleys in touch with one another or send representatives to the French command to arrange support from outside the district."
 IC_Notice_VIN.13.d_fail:0 "The campaign against Nghia Lo has ended without the Viet Minh securing the town. The federation keeps its principal post in the Muong Lo basin, where surrounding villages bring produce to market and militia officers draw supplies. The next question is how much of its defence the district can undertake without drawing men from other Tai valleys.\n\nThe chiefs can put the local militia captains to work on the problem or raise it with the Expeditionary Corps."
 IC_Notice_VIN.13.a:0 "Rally the Tai militias along the valley roads."
 IC_Notice_VIN.13.b:0 "Send envoys to ask for more French help."
 IC_Notice_VIN.14.t:0 "Word from Lai Chau"
 IC_Notice_VIN.14.d_win:0 "Viet Minh forces have taken Lai Chau. The federation has lost a garrison town as well as the seat from which its chiefs dealt with the French command. Headmen in the remaining districts need to know where militia reports and provincial business are now to be sent, and the commanders who depended on the town for supplies have to make other arrangements.\n\nThe chiefs can bring the remaining forces together under local direction or put the loss before the French as a case for continued support of the federation."
 IC_Notice_VIN.14.d_fail:0 "The Viet Minh offensive has ended without taking Lai Chau. The federation still has its seat and its links with the French command, but the threat to the town has exposed how much of its administration depends on a single garrison and its roads. The chiefs are being asked what arrangements are in place if the outlying posts are cut off again.\n\nThe council can reorganize militia duty around the capital or use the result to press France for a public commitment to the highlands."
 IC_Notice_VIN.14.a:0 "Keep the Tai militia commands together."
 IC_Notice_VIN.14.b:0 "Press France to stand by the federation."
 IC_Notice_VIN.15.t:0 "News from Lai Chau"
 IC_Notice_VIN.15.d_win:0 "The Expeditionary Corps has reported the loss of Lai Chau to Paris. The town was the seat of the Tai Federation, which gave the French command a local partner in the northwest. Its fall puts the government's obligations to the Tai before the Assembly at the same time as deputies are asking how long France can afford garrisons in country that is hard to supply.\n\nMinisters must choose whether to defend their strategy publicly or ask the Expeditionary Corps to account for the withdrawal and its remaining obligations."
 IC_Notice_VIN.15.d_fail:0 "Paris has learned that Lai Chau remains in Tai hands after the Viet Minh offensive. The federation's seat has survived, but the Ministry of National Defence must still budget for keeping the French posts there in touch with the rest of the command. Deputies who favour the war will cite the outcome; those who dispute its cost will want to know what was required to hold the town.\n\nThe cabinet can defend the northwest strategy before the Assembly or have the command review the commitment."
 IC_Notice_VIN.15.a:0 "Defend the army's strategy in the northwest."
 IC_Notice_VIN.15.b:0 "Admit the difficulties and call for a review."
 IC_Notice_VIN.16.t:0 "Beijing Receives the Lai Chau Report"
 IC_Notice_VIN.16.d_win:0 "The Viet Minh have taken Lai Chau, the seat of the Tai Federation. Reports to Beijing distinguish the political value of that result from the military work still required in the highlands. Taking the town deprives France of a local seat of authority, but supplying troops across the northwest remains a different undertaking from moving them close to the Chinese frontier.\n\nBeijing can publicize the victory as evidence that the war is turning, or ask its officers to examine how the Vietnamese command sustained the operation."
 IC_Notice_VIN.16.d_fail:0 "Chinese liaison reports say the Viet Minh have not secured Lai Chau. The French and Tai administration remains in place, and the Vietnamese command must reckon with the difficulty of keeping a force supplied that far into the highlands. The result does not settle the value of the material already supplied from China.\n\nBeijing can reaffirm its political support or put the campaign reports before the officers responsible for military liaison."
 IC_Notice_VIN.16.a:0 "Reaffirm support for the Vietnamese struggle."
 IC_Notice_VIN.16.b:0 "Study the campaign with the liaison officers."
 IC_Notice_VIN.17.t:0 "Lai Chau in the State Department Reports"
 IC_Notice_VIN.17.d_win:0 "The State Department reports that the Viet Minh have taken Lai Chau. The loss is significant in Washington because French protection of the Tai Federation had been cited as a means of holding parts of the northwest without a large metropolitan force. Congress can now ask whether that arrangement justified the American equipment already committed to the war.\n\nThe administration can argue that the defeat makes continued support more urgent or privately require a clearer explanation of France's plans for the remaining highland posts."
 IC_Notice_VIN.17.d_fail:0 "The State Department reports that the Tai Federation retains Lai Chau. The embassy considers the result useful evidence of what French and local forces can hold together, though it gives no account of how long Paris can sustain the commitment. The distinction matters in Washington, where a request for new aid must compete with other military appropriations.\n\nThe administration can cite Lai Chau publicly in support of the program or ask Paris for a fuller account before making further representations to Congress."
 IC_Notice_VIN.17.a:0 "Back the French effort in the highlands."
 IC_Notice_VIN.17.b:0 "Quietly ask Paris for a clearer plan."
 IC_Notice_VIN.18.t:0 "Fighting on the Bolovens Plateau"
 IC_Notice_VIN.18.d_win:0 "The Royal Lao command reports that Viet Minh and Pathet Lao columns have pushed into the Bolovens Plateau. Provincial officers in the south are having difficulty keeping the roads open with the troops on hand. The court needs to know which districts can be supplied from the Mekong towns and which still depend on help from the French command.\n\nThe government can put Lao officers in charge of reviewing the local defence or ask the Expeditionary Corps for a clearer commitment to the southern provinces."
 IC_Notice_VIN.18.d_fail:0 "The Royal Lao Army has contained the drive into the southern plateau without losing the roads on which its provincial posts depend. The result has spared the government an immediate crisis in the south, but local commanders still need to account for the troops and stores used to hold the line. The court also has to consider whether French assistance will be available if pressure resumes.\n\nThe government can consolidate the Lao command's arrangements or raise the continued defence of the south with the Expeditionary Corps."
 IC_Notice_VIN.18.a:0 "Review the southern defence with Lao officers."
 IC_Notice_VIN.18.b:0 "Ask the French command for firmer support."
 IC_Notice_VIN.19.t:0 "Viet Minh Columns in the South"
 IC_Notice_VIN.19.d:0 "Reports reaching Vientiane and Luang Prabang place Viet Minh and Pathet Lao columns on the approaches to the Bolovens Plateau. The provincial officials who serve the southern districts depend on roads down to the Mekong, and their garrison commanders are asking how much support can come from the rest of the kingdom.\n\nThe palace must decide whether to leave the immediate response with the Royal Lao command or make a public appeal for the southern districts to stand by their provincial authorities."
 IC_Notice_VIN.19.a:0 "Put the southern commands on alert."
 IC_Notice_VIN.19.b:0 "Issue a royal appeal to the southern districts."
 IC_Notice_VIN.20.t:0 "The Royal Capital Under Threat"
 IC_Notice_VIN.20.d:0 "Viet Minh and Pathet Lao forces have forced the approaches to Luang Prabang. For the Royal Lao government, the danger to the royal capital is also a question of authority: district officials need to know that the court can still issue orders and that the army can keep its garrisons in contact. Reports from the north give no basis for a promise that the roads will stay open.\n\nThe government must decide how much of the response to entrust to the Royal Lao Army and what guarantees to seek from its foreign supporters."
 IC_Notice_VIN.20.a:0 "Rally the army to the defence of the capital."
 IC_Notice_VIN.20.b:0 "Seek commitments from France and America."
 IC_Notice_VIN.21.t:0 "Southern Forces Move on Dak Doa"
 IC_Notice_VIN.21.d:0 "Scouts report that southern Viet Minh forces are assembling near Dak Doa. The post stands in the central highlands near the roads serving Pleiku and Kon Tum. Highland leaders cannot assume the traffic will continue through the district once the fighting starts, and village headmen want to know who will be responsible for keeping them informed.\n\nThe council can put the militia officers on alert or bring the headmen together to agree on what each village is prepared to provide for the defence."
 IC_Notice_VIN.21.a:0 "Put the highland posts and militias on alert."
 IC_Notice_VIN.21.b:0 "Agree on a response with the village headmen."
 IC_Notice_VIN.22.t:0 "The Dak Doa Fighting Ends"
 IC_Notice_VIN.22.d_win:0 "The southern Viet Minh held the Dak Doa post long enough to secure their military objective. No permanent transfer of the district follows the result, but the highland council has to reckon with a breach in the chain of posts meant to protect traffic toward Pleiku and Kon Tum. Villages that had counted on the garrison now ask what protection it can still offer.\n\nThe council can examine the fighting with its militia officers or speak first with the headmen whose cooperation keeps the local posts supplied."
 IC_Notice_VIN.22.d_fail:0 "The southern Viet Minh operation has ended without securing its objective at Dak Doa. The highland authorities retain the post, but the defence has made plain how much it depends on cooperation from the villages nearby. Headmen will want to know what the council proposes to do before asking them for more men or stores.\n\nThe militia officers can review what happened at the post, or the council can first meet the headmen and set out how the district will be defended."
 IC_Notice_VIN.22.a:0 "Review the fighting with the militia officers."
 IC_Notice_VIN.22.b:0 "Convene the headmen of the district."
 IC_Notice_FRE.1.t:0 "Atlante Opens in Central Vietnam"
 IC_Notice_FRE.1.d_vn:0 "The Vietnamese National Army is leading Operation Atlante on the central coast. The Expeditionary Corps has issued rifles and support weapons, but Saigon's officers are responsible for securing a foothold in territory organized by the southern Viet Minh as Interzone V. The operation will test whether the army can keep a coastal position supplied while provincial officials arrange to return.\n\nSaigon must decide how much of its command and political authority to commit to the offensive now that its army has responsibility for the result."
 IC_Notice_FRE.1.d_full:0 "The Expeditionary Corps has committed its own battalions to Operation Atlante. The Vietnamese National Army has received French arms for its part in the drive against the southern Viet Minh's Interzone V. French officers are directing the larger operation, but Vietnamese units will be judged on whether they can take over duties in the coastal districts the troops enter.\n\nSaigon can insist on a prominent role for its divisions or limit its commitment to the support the French command has requested."
 IC_Notice_FRE.1.a:0 "Give Vietnamese units a larger combat role."
 IC_Notice_FRE.1.b:0 "Limit the army to its assigned duties."
 IC_Notice_FRE.2.t:0 "Atlante Ends"
 IC_Notice_FRE.2.d_success:0 "The Vietnamese National Army has finished Operation Atlante with a foothold on the central coast. The campaign opened a position in the southern Viet Minh's Interzone V, without settling who will control the whole region. Saigon now has to send civil officials into districts where an army presence by itself will not restore the ordinary work of government.\n\nThe cabinet can cite the foothold publicly as the army's achievement, or have its officers examine how the force was supplied and maintained during the advance."
 IC_Notice_FRE.2.d_stalled:0 "Operation Atlante has ended without securing its intended positions in the southern Viet Minh's Interzone V. The Vietnamese National Army still has to defend the districts it held before the offensive, now with units that have spent weeks in the field. Provincial officials who expected to follow the columns into new areas will have to defer their plans.\n\nSaigon must decide whether to defend the army's conduct in public or first have its own officers review what the operation demanded of the troops."
 IC_Notice_FRE.2.a:0 "Recognize the army's service publicly."
 IC_Notice_FRE.2.b:0 "Have the army review the operation."
 IC_Notice_FRE.3.t:0 "A Pacification Program for the Mekong Delta"
 IC_Notice_FRE.3.d:0 "General Chanson's southern command has begun a pacification program in the Mekong Delta. French patrols and village garrisons are meant to deny the southern Viet Minh access to recruits and supplies. Saigon's district officials will be asked to work alongside the troops, whose presence makes it possible to reopen some offices but does not settle who exercises authority there.\n\nThe cabinet can send its existing officials to support the program, or insist that Vietnamese administrators direct civil affairs even where the Expeditionary Corps provides the security."
 IC_Notice_FRE.3.a:0 "Back the program with local officials."
 IC_Notice_FRE.3.b:0 "Insist on Vietnamese direction in the villages."
 IC_Notice_FRE.4.t:0 "News from Sa Dec"
 IC_Notice_FRE.4.d_killed:0 "General Charles Chanson, commander of French forces in southern Vietnam, and Governor Thai Lap Thanh have been killed at Sa Dec. The State of Vietnam has lost the governor through whom its district authorities dealt with the French command. The southern Viet Minh can make use of any delay while Saigon and the Expeditionary Corps re-establish contact with the provinces.\n\nThe cabinet can reassure officials that the existing administration will continue to function or use the vacancy to assert more direct Vietnamese control of policy in the delta."
 IC_Notice_FRE.4.d_survived:0 "General Charles Chanson and Governor Thai Lap Thanh have survived the bombing at Sa Dec. Their survival preserves the contact between the French southern command and the State of Vietnam's provincial authorities. With neither post vacant, the cabinet can consider Chanson's plans for the delta without first appointing new officials in the middle of the fighting.\n\nSaigon can reassure the provinces that the present administration remains in place or press for a larger Vietnamese role before a new security program is agreed."
 IC_Notice_FRE.4.a:0 "Keep the provincial administration at work."
 IC_Notice_FRE.4.b:0 "Assert Saigon's authority over delta policy."
 IC_Notice_FRE.5.t:0 "Dien Bien Phu: The Airhead"
 IC_Notice_FRE.5.d_success:0 "The Expeditionary Corps reports that Operation Castor has established the camp at Dien Bien Phu. The paratroops have held the landing ground, and supply aircraft can use it to maintain the new garrison. The report answers the immediate question of whether a position can be established; the expense of keeping it supplied through a longer campaign remains for Paris.\n\nMinisters can defend the command's decision before the Assembly or ask the deputies to examine the commitment now that there is a garrison to maintain."
 IC_Notice_FRE.5.d_failure:0 "Operation Castor has ended without establishing the camp at Dien Bien Phu. The Expeditionary Corps cannot count on the valley as a base for the operations it planned in the northwest. In Paris, the immediate questions for deputies are what was committed to the attempt and whether that commitment was justified by the position's value.\n\nMinisters must decide whether to defend the expeditionary command or put the cost and authorization of the operation before the Assembly."
 IC_Notice_FRE.5.a:0 "Defend Castor before the Assembly."
 IC_Notice_FRE.5.b:0 "Put Castor's costs before the deputies."
 IC_Notice_FRE.6.t:0 "Lai Chau: The Evacuation Ends"
 IC_Notice_FRE.6.d_preserved:0 "The Expeditionary Corps reports that the Lai Chau garrison and its Tai partisans have been brought to safety under Operation Pollux. The withdrawal means France loses the post but keeps men who know the northwest and can still serve with the command. In the Assembly the ministry will be asked how abandoning the station affects commitments to the Tai Federation.\n\nThe government can defend the evacuation as a necessary preservation of the field force or call for an account of what maintaining and then leaving Lai Chau has cost."
 IC_Notice_FRE.6.d_loss:0 "The Expeditionary Corps reports that the exposed Tai partisan column was lost during the Lai Chau evacuation. The regular detachments taken out by air do not account for the men who left the post by road. Deputies want to know what responsibility the French command accepted for the Tai when it ordered the evacuation.\n\nMinisters can stand by the decision to abandon Lai Chau or have the Assembly examine the provision made for the auxiliaries who served there."
 IC_Notice_FRE.6.a:0 "Defend the decision to evacuate Lai Chau."
 IC_Notice_FRE.6.b:0 "Ask the Assembly to examine the withdrawal."
 IC_Notice_FRE.7.t:0 "Atlante: The Offensive Ends"
 IC_Notice_FRE.7.d_success:0 "The Expeditionary Corps reports that Operation Atlante has secured a position on the central Vietnamese coast. The gain in Interzone V gives the French command and the State of Vietnam ground from which to resume civil work, but it does not put the whole region in their hands. Deputies in Paris will want to know what garrison the foothold will require after the columns leave.\n\nThe government can defend the operation on its immediate results or open the question of its cost before accepting a longer commitment."
 IC_Notice_FRE.7.d_stalled:0 "Operation Atlante has closed without securing the positions sought in Interzone V. The ministry has to explain to the National Assembly what the offensive achieved with the troops and stores assigned to it. At issue is how much of the Expeditionary Corps' strength should go to central Vietnam while the command also has commitments in the north.\n\nThe cabinet can defend the decision to undertake the offensive or put the expenditure and allocation of forces before the deputies."
 IC_Notice_FRE.7.a:0 "Defend the case for Operation Atlante."
 IC_Notice_FRE.7.b:0 "Put Atlante's expenditure before the deputies."
 IC_Notice_FRE.8.t:0 "The Lai Chau Evacuation Begins"
 IC_Notice_FRE.8.d:0 "The Expeditionary Corps has begun Operation Pollux, the evacuation of Lai Chau. The garrison and the Tai partisans who have served with it are to leave the post. For the federation, the withdrawal concerns families as well as soldiers: a French order assigning places to military personnel does not settle where their dependants will live once the garrison goes.\n\nThe chiefs must decide whether to devote their immediate attention to sheltering families or put their officers at the disposal of the evacuation command."
 IC_Notice_FRE.8.a:0 "Arrange shelter for the garrison's families."
 IC_Notice_FRE.8.b:0 "Attach Tai officers to the evacuation command."
 IC_Notice_FRE.9.t:0 "Lai Chau: The Evacuation Ends"
 IC_Notice_FRE.9.d_preserved:0 "The Lai Chau garrison and its Tai partisans are safe after the withdrawal. The federation has lost the post, but the units that served there are intact and the chiefs can still call on officers with experience of the district. Several families now need somewhere to live, and the chiefs want to know whether the French command will continue to provide for the men who served with it.\n\nThe council can attend first to the families or ask the Expeditionary Corps to set out its obligations now that the withdrawal is complete."
 IC_Notice_FRE.9.d_loss:0 "The Tai partisan column that left Lai Chau by road has been lost. The evacuation took out regular detachments, but the federation does not have a satisfactory account of the men who marched out after them. Their families have to deal with both the loss of the post and uncertainty over who will provide for them.\n\nThe chiefs can organize relief for the households affected or press the Expeditionary Corps to account for its obligations to the partisans and their dependants."
 IC_Notice_FRE.9.a:0 "See to the families affected by the withdrawal."
 IC_Notice_FRE.9.b:0 "Ask France to account for its obligations."
 IC_Notice_FRE.10.t:0 "French Paratroops at Dien Bien Phu"
 IC_Notice_FRE.10.d:0 "French paratroops have landed at Dien Bien Phu and begun establishing a camp around the airstrip. The Tai Federation has villages and local posts in the valley, where the arrival of a regular garrison changes who directs military affairs. Headmen need to know whether their men and stores will be required and whom to approach if the camp's demands interfere with village business.\n\nThe chiefs can put Tai officers in direct contact with the paratroop command or concentrate on keeping the civilian districts under their own administration."
 IC_Notice_FRE.10.a:0 "Put Tai officers in contact with the paratroops."
 IC_Notice_FRE.10.b:0 "Keep village affairs in the hands of the chiefs."
 IC_Notice_FRE.11.t:0 "The Airhead at Dien Bien Phu"
 IC_Notice_FRE.11.d_success:0 "The Expeditionary Corps has established its camp at Dien Bien Phu. The garrison will stay, and the Tai chiefs now have to arrange regular dealings with the French command in the valley. The villagers recognized French authority at the airstrip during the landing; a permanent presence raises the question of who answers for their affairs outside the perimeter.\n\nThe federation can recognize the service of its own men or seek written assurances about the French command's obligations to nearby villages."
 IC_Notice_FRE.11.d_failure:0 "The Expeditionary Corps has not established its camp at Dien Bien Phu. The federation cannot rely on the proposed garrison to support its posts in the valley. Tai officers who dealt with the paratroops want to know whether the villages are now to depend on local arrangements or whether the French command intends to station troops elsewhere in the district.\n\nThe chiefs can recognize those who stood by the operation or ask the Expeditionary Corps to state what guarantees remain."
 IC_Notice_FRE.11.a:0 "Honour the Tai who stood with the paratroopers."
 IC_Notice_FRE.11.b:0 "Ask the French command for new assurances."
 IC_Notice_FRE.12.t:0 "French Paratroopers on the Bolovens"
 IC_Notice_FRE.12.d:0 "An airborne group from the French Expeditionary Corps has arrived on the Bolovens Plateau in response to the Royal Lao government's appeal for help. The detachment is now under Lao colours. Its arrival gives the army a reserve in the south while the provincial commands report on Viet Minh activity in the direction of Attapeu.\n\nThe Royal Lao command can put its officers to work alongside the airborne group. The government can also use the transfer to affirm publicly that troops raised for the defence of the kingdom answer to Lao authority."
 IC_Notice_FRE.12.a:0 "Have Lao officers work with the airborne group."
 IC_Notice_FRE.12.b:0 "Affirm the kingdom's authority over the group."
 IC_Notice_FRE.13.t:0 "Dien Bien Phu: A Bridgehead in Indochina"
 IC_Notice_FRE.13.d:0 "The United States embassy reports that French paratroops have landed in the Dien Bien Phu valley. American aid has helped supply the aircraft and stores on which the expedition depends. The embassy can report that the landing has taken place; it cannot yet say how much transport the command will need to maintain the camp or what duties the garrison will eventually assume.\n\nThe administration can express confidence in the French command or keep its judgment private and have the embassy follow the use of American equipment."
 IC_Notice_FRE.13.a:0 "Express confidence in the French command."
 IC_Notice_FRE.13.b:0 "Have the embassy monitor the use of aid."
 IC_Notice_FRE.14.t:0 "Atlante: The Offensive in Central Vietnam"
 IC_Notice_FRE.14.d:0 "The United States embassy reports that Operation Atlante has opened on the central Vietnamese coast. French arms and transport are supporting the offensive, which is meant to establish positions in the southern Viet Minh's Interzone V. In Washington the operation raises a question distinct from the conduct of the fighting: how much authority Saigon will exercise in any districts the troops secure.\n\nThe administration can cite Atlante in public as evidence that the Vietnamese National Army is taking on more of the war or wait for the embassy's assessment of its role."
 IC_Notice_FRE.14.a:0 "Cite the Vietnamese army's role in Atlante."
 IC_Notice_FRE.14.b:0 "Ask the embassy to assess Saigon's role."
