l_english:
 INDO_OUTCOME_OPEN_BUTTON_TT: "Review the war's defining struggles and the standing each side has earned for the Geneva table."
 INDO_OUTCOME_NLF_TITLE: "Fate of the Southern Viet Minh"
 INDO_OUTCOME_NLF_LINE: "[GetIndoOutcomeNLF]"
 INDO_OUTCOME_NLF_T1: "§GThe southern insurgency was destroyed before 1952.§!\n§Y+100 Pro-Independence leverage§!"
 INDO_OUTCOME_NLF_T2: "§GThe southern insurgency was destroyed during 1952.§!\n§Y+75 Pro-Independence leverage§!"
 INDO_OUTCOME_NLF_T3: "§GThe southern insurgency was destroyed, but only after years of fighting.§!\n§Y+50 Pro-Independence leverage§!"
 INDO_OUTCOME_NLF_NEVER: "§RThe southern Viet Minh survived to see the conference convene.§!\n§Y+75 Communist leverage§!"
 INDO_OUTCOME_NLF_PENDING: "The insurgency in the South still burns. The earlier it is broken, the stronger Saigon's chair.\n§YVIE: +100/+75/+50 by year broken; VIN: +75 if never§!"
 INDO_OUTCOME_PATHET_TITLE: "Fate of the Pathet Lao"
 INDO_OUTCOME_PATHET_LINE: "[GetIndoOutcomePathetLao]"
 INDO_OUTCOME_PATHET_VICTORY: "§RThe Pathet Lao overran the Kingdom of Laos.§!\n§Y+125 Communist leverage§!"
 INDO_OUTCOME_PATHET_CRUSHED: "§GThe Kingdom beat back the Pathet Lao.§!\n§Y+125 Pro-France leverage§!"
 INDO_OUTCOME_PATHET_GARRISON: "§YThe Pathet Lao hold their two regroupment provinces under ceasefire.§!\nSettled by the 1953 raid — see below."
 INDO_OUTCOME_PATHET_UNRESOLVED: "§RNo settlement was reached in Laos before the conference.§!\nNo leverage awarded."
 INDO_OUTCOME_PATHET_CONSOLIDATED: "§YHanoi never crossed the border. The Pathet Lao entrenched inside the Kingdom instead.§!\n§Y+50 Communist leverage§!"
 INDO_OUTCOME_PATHET_PENDING: "The Laotian question is open. A decisive outcome swings §Y125§! leverage to the victor's camp."
 INDO_OUTCOME_DBP_TITLE: "Battle of Dien Bien Phu"
 INDO_OUTCOME_DBP_LINE: "[GetIndoOutcomeDBP]"
 INDO_OUTCOME_DBP_VICTORY: "§GThe fortified camp held and bled the besiegers white.§!\n§Y+75 Pro-France leverage§!"
 INDO_OUTCOME_DBP_FALL: "§RThe camp fell. The garrison marched into captivity.§!\n§Y+100 Communist leverage§!"
 INDO_OUTCOME_DBP_BREAKOUT: "§YThe garrison cut its way out — a defeat dressed as deliverance.§!\n§Y+25 Pro-France leverage§!"
 INDO_OUTCOME_DBP_PENDING: "No climactic set-piece battle has been decided.\n§YFRE victory: +75 Pro-France; fall: +100 Communist; breakout: +25 Pro-France§!"
 INDO_OUTCOME_SECTS_TITLE: "Fate of the Religious Sects"
 INDO_OUTCOME_SECTS_LINE: "[GetIndoOutcomeSects]"
 INDO_OUTCOME_SECTS_RESOLVED: "§GEvery sect has been integrated into the state or dismantled. The South speaks with one voice.§!\n§Y+75 Pro-Independence leverage§!"
 INDO_OUTCOME_SECTS_FAILED: "§RThe sects still run their fiefdoms as the delegations take their seats.§!\n§Y+50 Communist leverage§!"
 INDO_OUTCOME_SECTS_PENDING: "The Binh Xuyen, Cao Dai, Hoa Hao and their kin still answer to no one.\n§YVIE: +75 if all resolved before the conference; VIN: +50 otherwise§!"
 INDO_OUTCOME_HIGHLAND_TITLE: "Fate of the Highland States"
 INDO_OUTCOME_HIGHLAND_LINE: "[GetIndoOutcomeHighlands]"
 INDO_OUTCOME_HIGHLAND_ALL: "§RTai, Meo and Nung have all been folded into Hanoi's orbit.§!\n§Y+75 Communist leverage in total§!"
 INDO_OUTCOME_HIGHLAND_SEALED: "§YThe conference convened with [?global.geneva_outcome_highland] highland polity(ies) absorbed by Hanoi; the survivors keep their own voice.§!\n§Y+25 Ethnic leverage per survivor§!"
 INDO_OUTCOME_HIGHLAND_PARTIAL: "§Y[?global.geneva_outcome_highland] of 3 highland polities absorbed by Hanoi so far.§!\n§Y+25 Communist leverage each; survivors earn Ethnic leverage at the conference§!"
 INDO_OUTCOME_HIGHLAND_PENDING: "The Tai, Meo and Nung homelands stand apart from Hanoi.\n§YVIN: +25 per polity absorbed; +25 Ethnic leverage per survivor at the conference§!"
 INDO_OUTCOME_LAOSRAID_TITLE: "The 1953 Invasion of Laos"
 INDO_OUTCOME_LAOSRAID_LINE: "[GetIndoOutcomeLaosRaid]"
 INDO_OUTCOME_LAOSRAID_VICTORY: "§RHanoi's columns seized a Laotian capital before the monsoon closed the roads.§!\n§Y+100 Communist leverage§!"
 INDO_OUTCOME_LAOSRAID_STALEMATE: "§YThe raid froze into a stalemate: two provinces garrisoned under ceasefire.§!\n§Y+50 Communist leverage§!"
 INDO_OUTCOME_LAOSRAID_FAILURE: "§GThe raid collapsed and the Kingdom drove the Pathet Lao from its soil.§!\n§Y+75 Pro-France leverage§!"
 INDO_OUTCOME_LAOSRAID_TOTALWAR: "§RVientiane refused the peace: the raid has become a general war for Laos.§!\nLeverage rides on the wider war's outcome."
 INDO_OUTCOME_LAOSRAID_PENDING: "The Viet Minh have not yet rolled the dice on Laos.\n§YVIN capital seized: +100; stalemate: +50; collapse: +75 Pro-France§!"
 geneva_outcome_award_vie_weight_TT: "§GThe State of Vietnam's delegation gains vote weight at the conference§!"
 geneva_outcome_award_vin_weight_TT: "§GThe DRV delegation gains vote weight at the conference§!"
 geneva_outcome_award_fra_weight_TT: "§GThe French delegation gains vote weight at the conference§!"
