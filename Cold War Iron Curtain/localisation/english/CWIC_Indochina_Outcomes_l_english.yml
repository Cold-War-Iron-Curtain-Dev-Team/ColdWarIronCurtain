 INDO_OUTCOME_NLF_TITLE: "Fate of the Southern Viet Minh"
 INDO_OUTCOME_NLF_LINE: "[GetIndoOutcomeNLF]"
 INDO_OUTCOME_NLF_T1: "§GThe southern insurgency was destroyed before 1952.§!\n§Y+100 Pro-Independence leverage§!"
 INDO_OUTCOME_NLF_T2: "§GThe southern insurgency was destroyed during 1952.§!\n§Y+75 Pro-Independence leverage§!"
 INDO_OUTCOME_NLF_T3: "§GThe southern insurgency was destroyed, but only after years of fighting.§!\n§Y+50 Pro-Independence leverage§!"
 INDO_OUTCOME_NLF_NEVER: "§RThe southern Viet Minh survived to see the conference convene.§!\n§Y+75 Communist leverage§!"
 INDO_OUTCOME_NLF_PENDING: "The insurgency in the South still burns. The earlier it is broken, the stronger Saigon's chair.\n§YVIE: +100/+75/+50 by year broken; VIN: +75 if never§!"
 INDO_OUTCOME_PATHET_TITLE: "Fate of the Pathet Lao"
 INDO_OUTCOME_PATHET_LINE: "[GetIndoOutcomePathetLao]"
 INDO_OUTCOME_PATHET_VICTORY: "§RThe Pathet Lao overran the Kingdom of Laos.§!\n§Y+125 Communist leverage§!"
 INDO_OUTCOME_PATHET_CRUSHED: "§GThe Kingdom beat back the Pathet Lao.§!\n§Y+125 Pro-France leverage§!"
 INDO_OUTCOME_PATHET_GARRISON: "§YThe Pathet Lao hold their two regroupment provinces under ceasefire.§!\nSettled by the 1953 raid - see below."
 INDO_OUTCOME_PATHET_UNRESOLVED: "§RNo settlement was reached in Laos before the conference.§!\nNo leverage awarded."
 INDO_OUTCOME_PATHET_CONSOLIDATED: "§YHanoi never crossed the border. The Pathet Lao entrenched inside the Kingdom instead.§!\n§Y+50 Communist leverage§!"
 INDO_OUTCOME_PATHET_PENDING: "The Laotian question is open. A decisive outcome swings §Y125§! leverage to the victor's camp."
 INDO_OUTCOME_DBP_TITLE: "Battle of Dien Bien Phu"
 INDO_OUTCOME_DBP_LINE: "[GetIndoOutcomeDBP]"
 INDO_OUTCOME_DBP_VICTORY: "§GThe fortified camp held and bled the besiegers white.§!\n§Y+75 Pro-France leverage§!"
 INDO_OUTCOME_DBP_FALL: "§RThe camp fell. The garrison marched into captivity.§!\n§Y+100 Communist leverage§!"
 INDO_OUTCOME_DBP_BREAKOUT: "§YThe garrison cut its way out - a defeat dressed as deliverance.§!\n§Y+25 Pro-France leverage§!"
 INDO_OUTCOME_DBP_PENDING: "No climactic set-piece battle has been decided.\n§YFRE victory: +75 Pro-France; fall: +100 Communist; breakout: +25 Pro-France§!"
 INDO_OUTCOME_SECTS_TITLE: "Fate of the Religious Sects"
 INDO_OUTCOME_SECTS_LINE: "[GetIndoOutcomeSects]"
 INDO_OUTCOME_SECTS_RESOLVED: "§GEvery sect has been integrated into the state or dismantled. The South speaks with one voice.§!\n§Y+75 Pro-Independence leverage§!"
 INDO_OUTCOME_SECTS_FAILED: "§RThe sects still run their fiefdoms as the delegations take their seats.§!\n§Y+50 Communist leverage§!"
 INDO_OUTCOME_SECTS_PENDING: "The Binh Xuyen, Cao Dai, Hoa Hao and their kin still answer to no one.\n§YVIE: +75 if all resolved before the conference; VIN: +50 otherwise§!"
 INDO_OUTCOME_HIGHLAND_TITLE: "Fate of the Highland States"
 INDO_OUTCOME_HIGHLAND_LINE: "[GetIndoOutcomeHighlands]"
 INDO_OUTCOME_HIGHLAND_ALL: "§RTai, Meo and Nung have all been folded into Hanoi's orbit.§!\n§Y+75 Communist leverage in total§!"
 INDO_OUTCOME_HIGHLAND_SEALED: "§YThe conference convened with [?global.geneva_outcome_highland] highland polity(ies) absorbed by Hanoi; the survivors keep their own voice.§!\n§Y+25 Ethnic leverage per survivor§!"
 INDO_OUTCOME_HIGHLAND_PARTIAL: "§Y[?global.geneva_outcome_highland] of 3 highland polities absorbed by Hanoi so far.§!\n§Y+25 Communist leverage each; survivors earn Ethnic leverage at the conference§!"
 INDO_OUTCOME_HIGHLAND_PENDING: "The Tai, Meo and Nung homelands stand apart from Hanoi.\n§YVIN: +25 per polity absorbed; +25 Ethnic leverage per survivor at the conference§!"
 INDO_OUTCOME_LAOSRAID_TITLE: "The 1953 Invasion of Laos"
 INDO_OUTCOME_LAOSRAID_LINE: "[GetIndoOutcomeLaosRaid]"
 INDO_OUTCOME_LAOSRAID_VICTORY: "§RHanoi's columns seized a Laotian capital before the monsoon closed the roads.§!\n§Y+100 Communist leverage§!"
 INDO_OUTCOME_LAOSRAID_STALEMATE: "§YThe raid froze into a stalemate: two provinces garrisoned under ceasefire.§!\n§Y+50 Communist leverage§!"
 INDO_OUTCOME_LAOSRAID_FAILURE: "§GThe raid collapsed and the Kingdom drove the Pathet Lao from its soil.§!\n§Y+75 Pro-France leverage§!"
 INDO_OUTCOME_LAOSRAID_TOTALWAR: "§RVientiane refused the peace: the raid has become a general war for Laos.§!\nLeverage rides on the wider war's outcome."
 INDO_OUTCOME_LAOSRAID_PENDING: "The Viet Minh have not yet rolled the dice on Laos.\n§YVIN capital seized: +100; stalemate: +50; collapse: +75 Pro-France§!"
 geneva_outcome_award_vie_weight_TT: "§GThe State of Vietnam's delegation gains vote weight at the conference§!"
 geneva_outcome_award_vin_weight_TT: "§GThe DRV delegation gains vote weight at the conference§!"
 geneva_outcome_award_fra_weight_TT: "§GThe French delegation gains vote weight at the conference§!"
 VIN_Reopen_the_Northwest_Corridor:0 "Reopen the Northwest Corridor"
 VIN_Reopen_the_Northwest_Corridor_desc:0 "The first drive into the Tai highlands failed. One final, expensive effort can reopen the five-province corridor before the theatre closes, but Hanoi will not authorize a second scripted recovery."
 VIN_Camp_War_Northwest_Recovery_tt:0 "Spend §Y75 Campaign Supply§! and §Y50 Political Power§! to launch campaign §Y9§!. Hold all five corridor objectives for §Y5 consecutive days§! within §Y120 days§!. Any success is §YCostly§! and transfers Hoang Lien Son to Hanoi."
 VIN_Northwest_Recovery_Objective:0 "Reopen the Northwest Corridor"
 VIN_Northwest_Recovery_Objective_desc:0 "Control all five Northwest corridor provinces simultaneously for five consecutive days. This is Hanoi's only scripted recovery attempt."
 VIN_Northwest_Recovery_Clock_tt:0 "§Y[?VIN_camp_objective_hold_days|0]/5§! consecutive objective days; §Y[?VIN_camp_days_elapsed|0]/120§! campaign days."
 VIN_Dak_Doa_Offensive:0 "The Dak Doa Offensive"
 VIN_Dak_Doa_Offensive_desc:0 "The southern command can turn its highland approach into a contained assault on the isolated post at Dak Doa. The campaign belongs to the southern resistance and must not disturb its wider war against Saigon and France."
 VIN_Dak_Doa_Offensive_tt:0 "The §YNLF§! launches an ownership-neutral campaign against the isolated §YFUL§! post at Dak Doa. Hold Dak Doa for §Y7 consecutive days§!: clean through day 21, costly through day 45."
 VIN_Dak_Doa_Objective:0 "The Isolated Post at Dak Doa"
 VIN_Dak_Doa_Objective_desc:0 "Advance from the NLF approach at 10180 through Dak Doa toward Pleiku and Kon Tum. Hold Dak Doa for seven consecutive days."
 VIN_Dak_Doa_Clock_tt:0 "§Y[?NLF_Dak_Doa_Hold_Days|0]/7§! consecutive days at Dak Doa; §Y[?NLF_Dak_Doa_Days_Elapsed|0]/45§! campaign days."
 FRE_Dak_Doa.1.t:0 "The Isolated Post at Dak Doa"
 FRE_Dak_Doa.1.d:0 "Southern Viet Minh forces have closed on Dak Doa from their highland approach. CEFEO must decide whether the isolated garrison stands alone, receives a mobile-group commitment, or withdraws in good order."
 FRE_Dak_Doa.1.a:0 "Hold the isolated post"
 FRE_Dak_Doa.1.b:0 "Dispatch Groupement Mobile 100"
 FRE_Dak_Doa.1.c:0 "Evacuate the post"
 FRE_Dak_Doa_Hold_tt:0 "Spend §Y20 War Credits§!, §Y750 manpower§!, and §Y2 Metropole Patience§!. The post receives a bounded defensive package."
 FRE_Dak_Doa_GM100_tt:0 "Spend §Y70 War Credits§!, §Y2,500 manpower§!, and §Y5 Metropole Patience§!. GM 100 reinforces Pleiku-Dak Doa, but its losses will be severe if the post falls."
 FRE_Dak_Doa_Evacuate_tt:0 "Spend §Y15 War Credits§!, §Y500 manpower§!, and §Y1 Metropole Patience§!. After seven days the NLF records an orderly success and the formation is preserved for later highland operations."
 FRE_Dak_Doa.2.t:0 "The Dak Doa Response Concludes"
 FRE_Dak_Doa.2.d_held:0 "The isolated post held and the southern offensive spent itself against the perimeter."
 FRE_Dak_Doa.2.d_relief:0 "GM 100 relieved the post and retained an effective mobile reserve."
 FRE_Dak_Doa.2.d_overrun:0 "Dak Doa was overrun and the isolated garrison was lost."
 FRE_Dak_Doa.2.d_mauled:0 "Dak Doa fell and GM 100 suffered heavily in the failed relief effort."
 FRE_Dak_Doa.2.d_evacuated:0 "The post was evacuated in good order; the mobile formation survives for later highland operations."
 FRE_Dak_Doa.2.d_superseded:0 "The theatre closed before the isolated-post response could produce a military result."
 FRE_Dak_Doa.2.a:0 "Record the highland result"
 VIN_Dak_Doa.1.t:0 "Dak Doa Decided"
 VIN_Dak_Doa.1.d_clean:0 "The southern resistance took Dak Doa on schedule without becoming trapped in a wider highland battle."
 VIN_Dak_Doa.1.d_costly:0 "Dak Doa fell, but only after the offensive consumed more time and strength than planned."
 VIN_Dak_Doa.1.d_aborted:0 "The isolated campaign lost its separate war before a result could be secured."
 VIN_Dak_Doa.1.d_failure:0 "The post held beyond the final operational window."
 VIN_Dak_Doa.1.d_superseded:0 "The theatre's settlement overtook the Dak Doa operation; no battlefield reward is recorded."
 VIN_Dak_Doa.1.a:0 "Return to the southern war"
 FRE_Dak_Doa_Isolated_Post:0 "Dak Doa Isolated-Post Defense"
 FRE_Dak_Doa_Isolated_Post_desc:0 "A small CEFEO-backed garrison is holding a bounded perimeter around Dak Doa."
 FRE_Dak_Doa_GM100_Defense:0 "GM 100 at Pleiku-Dak Doa"
 FRE_Dak_Doa_GM100_Defense_desc:0 "A mobile group is supplying and reinforcing the isolated highland post."
 FRA_Accepted_Ceasefire:0 "France has accepted the ceasefire"
 FRA_Accepted_Reunification:0 "France has accepted reunification"
 FRA_Rejected_Ceasefire:0 "France has rejected the ceasefire"
 FRA_Rejected_Reunification:0 "France has rejected reunification"
 Geneva_Conference_Negotiations_Complete:0 "The §YGeneva negotiations§! are complete"
 Indochina_Ending_Failed_State:0 "Indochina has collapsed into a §Rfailed state§!"
 USA_Tampered_With_VIE:0 "The United States has interfered in Saigon"
 VIE_Accepted_Ceasefire:0 "The State of Vietnam has accepted the ceasefire"
 VIE_Accepted_Reunification:0 "The State of Vietnam has accepted reunification"
 VIE_Rejected_Ceasefire:0 "The State of Vietnam has rejected the ceasefire"
 VIE_Rejected_Reunification:0 "The State of Vietnam has rejected reunification"
 VIE_Rejected_Reunification_USA_Intervention:0 "The State of Vietnam rejected reunification under American pressure"
 geneva_conf_attendance_autogranted:0 "Attendance at Geneva was granted automatically"
 geneva_core_delegation:0 "A core Geneva delegation"
 geneva_interim_government_period:0 "The §Yinterim government§! period is under way"
 geneva_unified_settlement:0 "Geneva produced a §Yunified settlement§!"
 indochina_diplomacy_lock_communist:0 "Indochina diplomacy is locked to the communist camp"
 indochina_diplomacy_lock_profrance:0 "Indochina diplomacy is locked to France"
 indochina_diplomacy_lock_proindependence:0 "Indochina diplomacy is locked to independence"
 indochina_french_held_state_trigger_TT:0 "The region is held by CEFEO, France, the State of Vietnam or a French-aligned minority"
 IC_Aid.1.t:0 "Advisers for the Viet Minh"
 IC_Aid.1.d:0 "The Viet Minh leadership has accepted a standing Chinese patronage. A military advisory group is crossing the frontier with the first consignments of rifles and signal gear, and Beijing is now tied to the fortunes of the northern war.\n\nThe People's Liberation Army can present the mission as fraternal help to a neighbouring revolution, or keep it a quiet matter handled by the border commands."
 IC_Aid.1.a:0 "Present it as socialist solidarity"
 IC_Aid.1.b:0 "Keep the mission quiet"
 IC_Aid.2.t:0 "A Soviet Mission for the Viet Minh"
 IC_Aid.2.d:0 "Moscow has agreed to a military mission for the Viet Minh. Artillery and anti-aircraft guns are to travel the long road through China, along with a handful of instructors for the heavy weapons crews.\n\nThe Kremlin must decide whether Soviet backing for a colonial war in Indochina should be announced, or left to travel through Beijing without a Soviet name on it."
 IC_Aid.2.a:0 "Announce Soviet support to the world press"
 IC_Aid.2.b:0 "Route the help quietly through Beijing"
 IC_Aid.3.t:0 "Convoys on the Border Road"
 IC_Aid.3.d:0 "Rifles and motor transport are moving south across the Sino-Vietnamese frontier in growing numbers. The border depots handle the traffic with little ceremony, and nobody in Beijing has put the arrangement on paper.\n\nLocal commanders ask whether to bring the convoys under closer control, or to let them pass and judge the results by what is heard from the front."
 IC_Aid.3.a:0 "Tighten control of the border depots"
 IC_Aid.3.b:0 "Let the convoys pass"
 IC_Aid.4.t:0 "French Arms in Viet Minh Hands"
 IC_Aid.4.d:0 "Intelligence officers report that French rifles, captured in the fighting or bought through intermediaries, are being studied and copied in Viet Minh workshops. The weapons are familiar to every French soldier who has ever stood a guard.\n\nThe ministry can order an inquiry into the arms accounts of the colonial depots, or treat the losses as the ordinary price of a long campaign."
 IC_Aid.4.a:0 "Order an inquiry into arms losses"
 IC_Aid.4.b:0 "Treat it as battlefield attrition"
 IC_Aid.5.t:0 "American Rifles in Viet Minh Hands"
 IC_Aid.5.d:0 "American-made small arms supplied for the French effort are turning up in Viet Minh hands, some taken in battle and some sold on through the black market. Washington's observers are uneasy about where the weapons end up.\n\nThe government can press Paris for stricter end-use checks, or accept the leakage as a cost of arming an ally in a distant war."
 IC_Aid.5.a:0 "Ask Paris for stricter end-use checks"
 IC_Aid.5.b:0 "Accept it as the cost of aiding France"
 IC_Aid.6.t:0 "Soviet Trucks for the Viet Minh"
 IC_Aid.6.d:0 "A consignment of Soviet-built trucks and prime movers is on its way to the Viet Minh, moving by rail and road across China. Their arrival eases a transport problem that has long limited the northern campaigns.\n\nSoviet planners can claim the shipment as proof of socialist cooperation, or file it as routine industrial export that needs no comment."
 IC_Aid.6.a:0 "Claim it as socialist cooperation"
 IC_Aid.6.b:0 "File it as routine export"
 IC_Aid.7.t:0 "Chinese Trucks for the Viet Minh"
 IC_Aid.7.d:0 "Chinese-built trucks are crossing the border to join the Viet Minh supply columns. They are a mix of captured, refurbished and newly assembled machines, and they are meant to move shells and rice over the mountain tracks.\n\nBeijing can draw attention to the shipment as a mark of its new standing, or keep the details inside the military region commands."
 IC_Aid.7.a:0 "Draw attention to the shipment"
 IC_Aid.7.b:0 "Keep it inside the military commands"
 IC_Aid.8.t:0 "American Vehicles Sold to the Viet Minh"
 IC_Aid.8.d:0 "American-made trucks and prime movers are reported among the Viet Minh motor pools, bought through third parties and brokers in the region. How they came there is a question that embarrasses several offices.\n\nThe government can order a formal inquiry into the trade, or accept that surplus vehicles will find buyers wherever there is a war."
 IC_Aid.8.a:0 "Order an inquiry into the trade"
 IC_Aid.8.b:0 "Accept that surplus finds its buyers"
 IC_Aid.9.t:0 "American Designs Studied in Vietnam"
 IC_Aid.9.d:0 "Engineers working for the Viet Minh are studying American-built vehicles and drawings obtained abroad. A few examples have reached their workshops, and the designs are being measured and sketched for local copies.\n\nAmerican officials can tighten export controls on vehicles and spare parts, or dismiss it as harmless curiosity from a poor and isolated engineering school."
 IC_Aid.9.a:0 "Tighten export controls"
 IC_Aid.9.b:0 "Dismiss it as harmless curiosity"
 IC_Aid.10.t:0 "Yugoslav Vehicles for Vietnam"
 IC_Aid.10.d:0 "A small number of Yugoslav-built vehicles have been sold to the Viet Minh, along with technical drawings. Belgrade has few ties to Indochina, but the sale brings in foreign exchange and keeps its factories busy.\n\nThe government can keep the sale as a modest commercial matter, or speak openly of it as proof that socialist countries need not follow a single capital."
 IC_Aid.10.a:0 "Keep it a modest commercial matter"
 IC_Aid.10.b:0 "Speak of independent socialist cooperation"
 IC_Aid.11.t:0 "Rifles for the Sects of the South"
 IC_Aid.11.d:0 "Rifles drawn from State of Vietnam stocks have reached the Binh Xuyen and other sectarian forces of the south, some by arrangement and some through the usual leakage. The sects now field far more armed men than the capital would like.\n\nSaigon can demand that the sects be disarmed or integrated, or accept an uneasy coexistence with armed allies it cannot easily control."
 IC_Aid.11.a:0 "Demand that the sects be disarmed"
 IC_Aid.11.b:0 "Accept an uneasy coexistence"
 IC_Aid.12.t:0 "Colonial Supply Reform"
 IC_Aid.12.d:0 "The Expeditionary Corps' supply system has been reorganised, and a large shipment of rifles from metropolitan stocks is heading to Indochina. Ministry officials describe it as a step towards a leaner and better administered colonial logistics.\n\nMinisters can present the reform to the Assembly as a prudent measure, or leave it to the military departments and avoid a debate on the cost of the war."
 IC_Aid.12.a:0 "Present the reform to the Assembly"
 IC_Aid.12.b:0 "Leave it to the military departments"
 IC_Aid.13.t:0 "Rifles for the National Army"
 IC_Aid.13.d:0 "The Expeditionary Corps has handed over rifles from its own stocks to arm the National Army of the State of Vietnam. Paris regards the transfer as a measure of Vietnamisation, and the first units to receive them are being assembled.\n\nThe ministry can celebrate the transfer as proof of the Associated State's growing independence, or hold it to be a purely military matter."
 IC_Aid.13.a:0 "Celebrate the transfer as Vietnamisation"
 IC_Aid.13.b:0 "Treat it as a purely military matter"
 IC_Aid.14.t:0 "Rifles for the National Army"
 IC_Aid.14.d:0 "Crates of rifles released by the Expeditionary Corps are arriving at the depots of the National Army. They are old French stock, but for many young recruits they will be their first weapon of any kind.\n\nThe State of Vietnam's leaders can hold a public ceremony to show that the army is theirs, or issue the arms quietly to garrison units and begin training at once."
 IC_Aid.14.a:0 "Hold a public handover ceremony"
 IC_Aid.14.b:0 "Issue the rifles quietly and begin training"
 IC_Aid.15.t:0 "Arms for the Royal Lao Army"
 IC_Aid.15.d:0 "French rifles, artillery and equipment are arriving at Royal Lao depots, and two new divisions are being raised from the kingdom's thinly populated provinces. The Expeditionary Corps will supply the weapons, instructors and a good deal of the paperwork.\n\nThe Royal Lao government can announce the army as a sign of national sovereignty, or accept the new force quietly while the French mission does most of the work."
 IC_Aid.15.a:0 "Announce the national army as a sign of sovereignty"
 IC_Aid.15.b:0 "Let the French mission handle the training"
 IC_Aid.16.t:0 "Arms for the Khmer National Army"
 IC_Aid.16.d:0 "French rifles, artillery and supplies are reaching Cambodian depots, and two divisions of a new national army are being formed. The weapons come from French stocks, and instructors from the Expeditionary Corps are already at work in the training camps.\n\nThe Cambodian government can present the army as proof that the kingdom defends itself, or accept the new force without ceremony."
 IC_Aid.16.a:0 "Present it as proof that Cambodia defends itself"
 IC_Aid.16.b:0 "Accept the new force quietly"
 IC_Aid.17.t:0 "Associated State Armies"
 IC_Aid.17.d:0 "France has committed arms and funds to national armies in Laos and Cambodia. The decision frees none of the Expeditionary Corps' garrisons, but it gives Paris a way to say that the Associated States are shouldering their own defence.\n\nThe government can stress the generosity and sovereignty of the arrangement, or keep attention on the continuing demands of the war."
 IC_Aid.17.a:0 "Stress the generosity of the arrangement"
 IC_Aid.17.b:0 "Keep attention on the demands of the war"
 IC_Aid.18.t:0 "American Financing for the French War"
 IC_Aid.18.d:0 "Washington has agreed to underwrite a growing share of the cost of the French campaign in Indochina. Officials describe the money as a contribution to the defence of the free world, while critics in Congress ask where it will end.\n\nThe administration can publicise the aid as part of a wider stand against communism, or keep it low-key to avoid a public quarrel over the colonial question."
 IC_Aid.18.a:0 "Publicise it as a stand against communism"
 IC_Aid.18.b:0 "Keep it low-key"
 IC_Notice_VIN.1.t:0 "The Border Hills Stir"
 IC_Notice_VIN.1.d:0 "Tho village headmen report Viet Minh columns moving through the border hills of Cao Bang and Lang Son. Markets are closing early and French patrols are thin along the road.\n\nThe Tho must decide how to protect their villages while the armies move through."
 IC_Notice_VIN.1.a:0 "Keep the village militias at home and watch the paths."
 IC_Notice_VIN.1.b:0 "Send word to French officers asking for protection."
 IC_Notice_VIN.2.t:0 "The Border Fighting Reaches Nung Country"
 IC_Notice_VIN.2.d_win:0 "The Viet Minh have taken the border road and the Nung country around it lies open to them. Nung leaders worry about reprisals and about the future of their service to France.\n\nMany families are watching the roads for refugees."
 IC_Notice_VIN.2.d_fail:0 "The Viet Minh attack on the border road has been held or driven off. Nung militias and French posts kept the roads, but the hills remain restless.\n\nElders urge caution and vigilance."
 IC_Notice_VIN.2.a:0 "Close ranks and keep the clan militias ready."
 IC_Notice_VIN.2.b:0 "Seek terms with whoever holds the road."
 IC_Notice_VIN.3.t:0 "News from the Frontier Road"
 IC_Notice_VIN.3.d_win:0 "Dispatches reach Paris that the Viet Minh have overrun the border posts of Route Coloniale 4. Newspapers speak of a colonial disaster and Deputies demand to know how the frontier was lost.\n\nThe government must answer questions about the war's direction."
 IC_Notice_VIN.3.d_fail:0 "Dispatches reach Paris that the Viet Minh attack on the frontier road has failed. Newspapers praise the garrisons, and the government finds a moment of relief.\n\nStill, questions about the war's cost continue."
 IC_Notice_VIN.3.a:0 "Defend the army's conduct before the Assembly."
 IC_Notice_VIN.3.b:0 "Admit the difficulties and ask for a review."
 IC_Notice_VIN.4.t:0 "Success on the Vietnamese Border"
 IC_Notice_VIN.4.d_win:0 "The Viet Minh have cleared the border road and secured the frontier with China. Chinese advisers report that supplies can now flow more freely across the mountains.\n\nBeijing reads the result as a sign the Viet Minh can use the aid they are given."
 IC_Notice_VIN.4.d_fail:0 "The Viet Minh frontier operation has produced no breakthrough, though the supply routes into China remain open.\n\nBeijing notes the result without comment."
 IC_Notice_VIN.4.a:0 "Celebrate the border success and send congratulations."
 IC_Notice_VIN.4.b:0 "Quietly send more advisers and cadres."
 IC_Notice_VIN.5.t:0 "Setback on the Indochina Frontier"
 IC_Notice_VIN.5.d_win:0 "The State Department reports that French posts on the Chinese border have fallen to the Viet Minh. Officials worry that Beijing now has a friendly neighbour on its southern frontier.\n\nCongressional critics ask whether the French war is winnable."
 IC_Notice_VIN.5.d_fail:0 "The State Department reports that French posts on the Chinese border have held. Officials see little to celebrate but are relieved the frontier was not lost.\n\nQuestions about the French effort continue."
 IC_Notice_VIN.5.a:0 "Urge Congress to support the French effort."
 IC_Notice_VIN.5.b:0 "Quietly press Paris for a clearer strategy."
 IC_Notice_VIN.6.t:0 "The Fighting at Vinh Yen"
 IC_Notice_VIN.6.d_win:0 "Viet Minh forces have broken through at Vinh Yen, close to the delta villages under State of Vietnam administration. Officials worry about panic in the countryside and about the loyalty of local officers.\n\nThe government must reassure the people."
 IC_Notice_VIN.6.d_fail:0 "The Viet Minh assault at Vinh Yen has been beaten back. Officials of the State of Vietnam point to the result as proof their cause is not lost.\n\nThe delta villages breathe a little easier."
 IC_Notice_VIN.6.a:0 "Appeal for calm and show the flag in the delta."
 IC_Notice_VIN.6.b:0 "Press the French command for more arms for the national army."
 IC_Notice_VIN.7.t:0 "The Fighting at Mao Khe"
 IC_Notice_VIN.7.d_win:0 "Viet Minh forces have pressed deep into the coal country at Mao Khe. The State of Vietnam fears for its hold on the delta and officials ask what France will do next.\n\nOffices in Hanoi prepare for a hard few weeks."
 IC_Notice_VIN.7.d_fail:0 "The Viet Minh attack at Mao Khe has been repelled. The State of Vietnam welcomes the news, though many officials worry about the next assault.\n\nThe national army claims a share of the credit."
 IC_Notice_VIN.7.a:0 "Strengthen the local administration in the delta."
 IC_Notice_VIN.7.b:0 "Ask for more training for national army units."
 IC_Notice_VIN.8.t:0 "The Fighting on the Day River"
 IC_Notice_VIN.8.d_win:0 "The Viet Minh have crossed the Day River and the southern delta is exposed. The State of Vietnam fears more villages will fall under Viet Minh control.\n\nOfficials ask whether France can protect them."
 IC_Notice_VIN.8.d_fail:0 "The Viet Minh crossing of the Day River has failed. The State of Vietnam treats the news as a sign of its growing army.\n\nOfficials urge firmness in the delta."
 IC_Notice_VIN.8.a:0 "Rally the delta villages with a public appeal."
 IC_Notice_VIN.8.b:0 "Quietly send officers to the front for experience."
 IC_Notice_VIN.9.t:0 "News from the Day River"
 IC_Notice_VIN.9.d_win:0 "The Viet Minh have forced the Day River line, and French commentators wonder how long the delta can be held. Paris asks the high command for a full report.\n\nSupport for the war falters."
 IC_Notice_VIN.9.d_fail:0 "The Viet Minh attack on the Day River line has failed. French newspapers present the result as a victory for the army and its commanders.\n\nThe government hopes for a steadier mood."
 IC_Notice_VIN.9.a:0 "Praise the army and rally public opinion."
 IC_Notice_VIN.9.b:0 "Order a full review of delta defences."
 IC_Notice_VIN.10.t:0 "Word from Na San"
 IC_Notice_VIN.10.d_win:0 "The Viet Minh have overrun the defences at Na San and the Tai highlands lie exposed. Tai leaders worry about the future of the federation and about the French promise of protection.\n\nPeople are asking whether the garrisons will stay."
 IC_Notice_VIN.10.d_fail:0 "The Viet Minh assault on Na San has failed and the Tai highlands remain under French protection. Tai leaders see the result as a sign that the federation can survive.\n\nOld rivalries are for the moment quiet."
 IC_Notice_VIN.10.a:0 "Rally the Tai militias to the highland posts."
 IC_Notice_VIN.10.b:0 "Appeal to France for firm guarantees."
 IC_Notice_VIN.11.t:0 "Viet Minh Stir in the Northwest"
 IC_Notice_VIN.11.d:0 "Tai villagers report Viet Minh scouts and porters moving through the forest paths of the northwest. Headmen of the Black River valleys are worried the highlands will be dragged into another round of fighting.\n\nThe federation must decide how to guard its homeland."
 IC_Notice_VIN.11.a:0 "Call up the Tai militias and watch the valleys."
 IC_Notice_VIN.11.b:0 "Ask French officers for supplies and reassurance."
 IC_Notice_VIN.12.t:0 "The Northwest Corridor Reopens"
 IC_Notice_VIN.12.d_win:0 "The Viet Minh have reopened the corridor through the northwest at heavy cost. Tai villages along the route report requisitions and refugees, and the federation fears worse to come.\n\nLeaders weigh their options."
 IC_Notice_VIN.12.d_fail:0 "The Viet Minh attempt to reopen the northwest corridor has failed or been called off. Tai villages breathe more easily, though the threat has not vanished.\n\nLeaders call for vigilance."
 IC_Notice_VIN.12.a:0 "Strengthen the valley defences and watch the roads."
 IC_Notice_VIN.12.b:0 "Press for protection from France."
 IC_Notice_VIN.13.t:0 "Word from Nghia Lo"
 IC_Notice_VIN.13.d_win:0 "Viet Minh forces have taken Nghia Lo and the Tai valleys beyond it are open to them. Tai leaders fear for their homeland and for the French promises that have protected it.\n\nSome ask whether to keep fighting."
 IC_Notice_VIN.13.d_fail:0 "The Viet Minh attack on Nghia Lo has failed or been called off. The Tai valleys remain under federation control, though the border stays tense.\n\nLeaders urge watchfulness."
 IC_Notice_VIN.13.a:0 "Rally the Tai militias along the valley roads."
 IC_Notice_VIN.13.b:0 "Send envoys to ask for more French help."
 IC_Notice_VIN.14.t:0 "Word from Lai Chau"
 IC_Notice_VIN.14.d_win:0 "The Viet Minh have reached Lai Chau and the heart of the Tai highlands is under pressure. The federation capital faces an uncertain future and its leaders wonder what the French will do.\n\nPeople gather in the market with worried faces."
 IC_Notice_VIN.14.d_fail:0 "The Viet Minh push toward Lai Chau has failed or been called off. The federation capital stays in Tai hands for now.\n\nLeaders thank the garrison and call for steadiness."
 IC_Notice_VIN.14.a:0 "Gather the militias at the capital."
 IC_Notice_VIN.14.b:0 "Appeal for French reinforcements in the highlands."
 IC_Notice_VIN.15.t:0 "News from Lai Chau"
 IC_Notice_VIN.15.d_win:0 "The Viet Minh have taken Lai Chau, capital of the Tai Federation, and Paris faces yet another bad headline from the northwest. Commentators doubt that the highlands can be held.\n\nThe cabinet hears criticism of the war."
 IC_Notice_VIN.15.d_fail:0 "The Viet Minh attack on Lai Chau has failed. French newspapers treat the news as a modest relief, and the cabinet notes a pause in criticism.\n\nStill, the question of the northwest remains."
 IC_Notice_VIN.15.a:0 "Defend the army's strategy in the northwest."
 IC_Notice_VIN.15.b:0 "Admit the difficulties and call for a review."
 IC_Notice_VIN.16.t:0 "Success in the Northwest"
 IC_Notice_VIN.16.d_win:0 "The Viet Minh have taken Lai Chau and cleared much of the Tai highlands. Chinese advisers report the success and note that arms from China helped the campaign.\n\nBeijing weighs how to respond to the news."
 IC_Notice_VIN.16.d_fail:0 "The Viet Minh push in the northwest has met resistance but the region remains contested. Chinese advisers report the result with measured language.\n\nBeijing sees little reason to change course."
 IC_Notice_VIN.16.a:0 "Send formal congratulations to the Viet Minh."
 IC_Notice_VIN.16.b:0 "Send more advisers to help with the next phase."
 IC_Notice_VIN.17.t:0 "Setback in the Tai Highlands"
 IC_Notice_VIN.17.d_win:0 "The State Department reports that French and Tai positions at Lai Chau have fallen to the Viet Minh. Officials note that the northwest is now largely beyond French reach.\n\nCongressional critics question the value of aid to France."
 IC_Notice_VIN.17.d_fail:0 "The State Department reports that French and Tai forces have held Lai Chau against a Viet Minh push. Officials see the result as a limited success.\n\nThe question of future aid remains open."
 IC_Notice_VIN.17.a:0 "Back the French effort in the highlands."
 IC_Notice_VIN.17.b:0 "Quietly ask Paris for a clearer plan."
 IC_Notice_VIN.18.t:0 "Fighting on the Bolovens Plateau"
 IC_Notice_VIN.18.d_win:0 "Viet Minh and Pathet Lao columns have pushed into the southern plateau of Laos, and the Royal Lao government fears for the southern provinces. Officers report pressure on the roads and a shortage of reserves.\n\nThe court asks what France will do."
 IC_Notice_VIN.18.d_fail:0 "The Viet Minh and Pathet Lao push in southern Laos has been contained. Royal Lao and French forces held the main roads and the southern provinces are quiet for now.\n\nThe court thanks its soldiers."
 IC_Notice_VIN.18.a:0 "Call up the local levies and reinforce the south."
 IC_Notice_VIN.18.b:0 "Appeal to France for more help."
 IC_Notice_VIN.19.t:0 "Viet Minh Columns in the South"
 IC_Notice_VIN.19.d:0 "Reports reach Vientiane and Luang Prabang of Viet Minh and Pathet Lao columns moving into the southern plateau. Provincial officers ask for reinforcements and royal guidance.\n\nThe government must decide how to defend the south."
 IC_Notice_VIN.19.a:0 "Reinforce the south and put the garrisons on alert."
 IC_Notice_VIN.19.b:0 "Reassure the public that the kingdom is safe."
 IC_Notice_VIN.20.t:0 "The Royal Capital Under Threat"
 IC_Notice_VIN.20.d:0 "Viet Minh and Pathet Lao forces have broken through on the road to Luang Prabang. The royal capital lies under direct threat, and officials hurry to protect the palace and the sacred sites.\n\nThe kingdom must now decide how to answer the crisis."
 IC_Notice_VIN.20.a:0 "Rally the army around the royal capital."
 IC_Notice_VIN.20.b:0 "Appeal to France and the United States for help."
 IC_Notice_VIN.21.t:0 "Southern Forces Move on Dak Doa"
 IC_Notice_VIN.21.d:0 "Scouts of the highland movement report that southern Viet Minh forces are gathering around Dak Doa. Villages along the roads speak of porters, drums and growing tension.\n\nLeaders must decide how to defend the highland posts and what to tell the villagers."
 IC_Notice_VIN.21.a:0 "Put the highland posts on alert and train the militias."
 IC_Notice_VIN.21.b:0 "Hold council with the village headmen to keep order."
 IC_Notice_VIN.22.t:0 "The Dak Doa Fighting Ends"
 IC_Notice_VIN.22.d_win:0 "Southern Viet Minh forces have taken the Dak Doa position. The highland movement has lost ground, and leaders worry about their villagers and their allies.\n\nCouncils meet to decide what comes next."
 IC_Notice_VIN.22.d_fail:0 "The southern Viet Minh push on Dak Doa has failed or been called off. The highland movement holds its ground and its villages remain under its protection.\n\nLeaders urge vigilance."
 IC_Notice_VIN.22.a:0 "Gather the militias and assess the losses."
 IC_Notice_VIN.22.b:0 "Call a council to restore confidence."
 IC_Notice_FRE.1.t:0 "Atlante Opens in Central Vietnam"
 IC_Notice_FRE.1.d_vn:0 "The CEFEO has agreed that the Vietnamese National Army will lead Operation Atlante in central Vietnam. French rifles and support weapons have been issued to our divisions, and CEFEO advisers will follow behind our columns.\n\nThe operation will test the army and the government that stands behind it. Our commanders must decide how hard to push."
 IC_Notice_FRE.1.d_full:0 "The CEFEO has opened Operation Atlante in central Vietnam with a full commitment of its own battalions. Our divisions have been issued French rifles and support weapons and are to take part on the flanks.\n\nThe operation will decide whether the coast can be held, and the army's conduct will be noted in Paris as well as in Saigon."
 IC_Notice_FRE.1.a:0 "Commit our divisions to the offensive."
 IC_Notice_FRE.1.b:0 "Keep our divisions in supporting roles."
 IC_Notice_FRE.2.t:0 "Atlante Ends"
 IC_Notice_FRE.2.d_success:0 "Operation Atlante has reached its objectives. The towns along the central coast are held by CEFEO and our divisions, and the roads inland are open.\n\nThe army has shown it can fight alongside the French, and the government hopes the coast will now be calmer."
 IC_Notice_FRE.2.d_stalled:0 "Operation Atlante has stalled before its objectives. The columns have fallen back, our divisions have taken losses and the coast is no safer than before.\n\nThe army will need rest and new equipment before it takes the field again."
 IC_Notice_FRE.2.a:0 "Praise the soldiers who fought."
 IC_Notice_FRE.2.b:0 "Draw the lessons for the army."
 IC_Notice_FRE.3.t:0 "A Pacification Program for the Mekong Delta"
 IC_Notice_FRE.3.d:0 "The French command in the south has begun a pacification program in the Mekong delta, with posts around Sa Dec and along the canals. Our officials are being asked to accompany CEFEO patrols into the villages.\n\nThe program offers the government a chance to win back the countryside, but only if our administrators are seen as more than escorts."
 IC_Notice_FRE.3.a:0 "Back the program with local officials."
 IC_Notice_FRE.3.b:0 "Insist on Vietnamese direction in the villages."
 IC_Notice_FRE.4.t:0 "News from Sa Dec"
 IC_Notice_FRE.4.d_killed:0 "A suicide bomber has killed General Chanson and the Governor of Saigon-Cholon at Sa Dec. The Mekong delta is stunned, and the government must decide how to answer the loss of both an ally and an officeholder.\n\nThe pacification program will go on without its architect."
 IC_Notice_FRE.4.d_survived:0 "General Chanson and the Governor of Saigon-Cholon survived an attempt on their lives at Sa Dec. The bomber was a heartbeat too early, and the delta waits to see what the escape will mean for the pacification program.\n\nThe government has an opening to show that the south can be managed."
 IC_Notice_FRE.4.a:0 "Honour the dead and hold the delta."
 IC_Notice_FRE.4.b:0 "Press ahead with a Vietnamese answer."
 IC_Notice_FRE.5.t:0 "Dien Bien Phu: The Airhead"
 IC_Notice_FRE.5.d_success:0 "The airhead at Dien Bien Phu has been held and the French command declares the camp established. Transport aircraft keep bringing in stores and Paris is told that the garrison is in place.\n\nThe deputies are divided between pride in the paratroopers and worry about what the camp may cost."
 IC_Notice_FRE.5.d_failure:0 "The airhead at Dien Bien Phu could not be held. The paratroopers who dropped into the valley were overwhelmed or withdrawn, and the camp the plan called for does not stand.\n\nThe deputies want to know who approved the operation and what it cost."
 IC_Notice_FRE.5.a:0 "Stand by the expeditionary command."
 IC_Notice_FRE.5.b:0 "Call for a review of the cost."
 IC_Notice_FRE.6.t:0 "Lai Chau: The Evacuation Ends"
 IC_Notice_FRE.6.d_preserved:0 "The evacuation of Lai Chau has ended and the garrison and its partisans have been saved. The columns reached their destination under air cover and the survivors are being reorganised.\n\nIn Paris the army's careful conduct of the withdrawal is praised."
 IC_Notice_FRE.6.d_loss:0 "The evacuation of Lai Chau has ended in disaster for the exposed column. The partisans who marched out were lost on the way, and only the regular detachments flown out earlier are safe.\n\nIn Paris the deputies ask why the column was left to march."
 IC_Notice_FRE.6.a:0 "Stand by the expeditionary command."
 IC_Notice_FRE.6.b:0 "Call for a review of the operation."
 IC_Notice_FRE.7.t:0 "Atlante: The Offensive Ends"
 IC_Notice_FRE.7.d_success:0 "Operation Atlante has reached its objectives in central Vietnam. The coast is held by the CEFEO and the State of Vietnam's army, and the roads inland are open.\n\nParis welcomes the news, though the deputies note the cost."
 IC_Notice_FRE.7.d_stalled:0 "Operation Atlante has stalled short of its objectives. Columns have fallen back, and the coast is no safer than before.\n\nThe deputies ask whether the war credits spent were well used."
 IC_Notice_FRE.7.a:0 "Stand by the expeditionary command."
 IC_Notice_FRE.7.b:0 "Call for a review of the cost."
 IC_Notice_FRE.8.t:0 "The Lai Chau Evacuation Begins"
 IC_Notice_FRE.8.d:0 "The CEFEO has begun to evacuate the garrison at Lai Chau and the partisans who served with it. Columns are forming on the road south, and transport aircraft are working the airstrip.\n\nThe federation's families have lived beside the garrison for years, and many must decide whether to leave with it."
 IC_Notice_FRE.8.a:0 "Offer the garrison's families shelter in the federation."
 IC_Notice_FRE.8.b:0 "Let the federation's partisans cover the withdrawal."
 IC_Notice_FRE.9.t:0 "Lai Chau: The Evacuation Ends"
 IC_Notice_FRE.9.d_preserved:0 "The evacuation of Lai Chau has ended and the garrison and its partisans have been saved. The columns reached safety and the survivors are being housed.\n\nThe federation owes a debt to the French command and the families who stood with it."
 IC_Notice_FRE.9.d_loss:0 "The evacuation of Lai Chau has ended in disaster for the exposed column. The partisans who marched out were lost on the road, and only the detachments flown out earlier are safe.\n\nThe federation mourns its dead and asks who is to answer for the loss."
 IC_Notice_FRE.9.a:0 "Honour the dead and shelter the survivors."
 IC_Notice_FRE.9.b:0 "Press the French command for assurances."
 IC_Notice_FRE.10.t:0 "A CEFEO Airhead in Our Valley"
 IC_Notice_FRE.10.d:0 "CEFEO paratroopers are dropping into the Dien Bien Phu valley, and transport aircraft are bringing in stores. The camp they are building lies in the heart of our country, among Tai villages that have lived in the valley for generations.\n\nThe federation's chiefs must decide how close to stand to the French and what to tell the villages."
 IC_Notice_FRE.10.a:0 "Give the paratroopers every help."
 IC_Notice_FRE.10.b:0 "Keep the Tai villages out of the fighting."
 IC_Notice_FRE.11.t:0 "The Airhead at Dien Bien Phu"
 IC_Notice_FRE.11.d_success:0 "The airhead at Dien Bien Phu has been held and the French command declares the camp established. Stores keep arriving by air, and the Tai villages in the valley are told that the garrison is staying.\n\nThe federation's chiefs are proud and afraid in equal measure."
 IC_Notice_FRE.11.d_failure:0 "The airhead at Dien Bien Phu could not be held. The paratroopers who dropped into the valley were overwhelmed or withdrawn, and the camp the plan called for does not stand.\n\nThe federation's chiefs must decide who they can still rely on."
 IC_Notice_FRE.11.a:0 "Honour the Tai who stood with the paratroopers."
 IC_Notice_FRE.11.b:0 "Ask the French command for new assurances."
 IC_Notice_FRE.12.t:0 "French Paratroopers on the Bolovens"
 IC_Notice_FRE.12.d:0 "A CEFEO airborne group has landed on the Bolovens plateau and been placed under Royal Lao colours. It was flown in after the Royal Lao Government asked for help against the Viet Minh columns in Attapeu.\n\nThe troops are few, but they hold the plateau roads and give the Royal Lao Army time to bring up its own battalions."
 IC_Notice_FRE.12.a:0 "Welcome the groupement under Royal Lao colours."
 IC_Notice_FRE.12.b:0 "Insist that it stay under Lao command."
 IC_Notice_FRE.13.t:0 "Dien Bien Phu: A Bridgehead in Indochina"
 IC_Notice_FRE.13.d:0 "Washington is told that the French airborne operation at Dien Bien Phu has begun. American financing has helped fund the transport aircraft and stores, and the embassy reports that the paratroopers are in the valley.\n\nThe State Department must decide how closely to watch an operation it helps pay for."
 IC_Notice_FRE.13.a:0 "Commend the French effort."
 IC_Notice_FRE.13.b:0 "Keep the aid under close review."
 IC_Notice_FRE.14.t:0 "Atlante: The Offensive in Central Vietnam"
 IC_Notice_FRE.14.d:0 "Washington is told that French and Vietnamese forces have opened Operation Atlante in central Vietnam. American financing has helped pay for the stores and transport behind the offensive.\n\nThe State Department must decide how closely to watch an operation it helps pay for."
 IC_Notice_FRE.14.a:0 "Commend the French effort."
 IC_Notice_FRE.14.b:0 "Keep the aid under close review."
