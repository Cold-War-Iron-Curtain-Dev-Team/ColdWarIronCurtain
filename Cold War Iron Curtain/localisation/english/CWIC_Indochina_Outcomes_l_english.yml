 FRE_Cao_Bac.1.t:0 "The Cao Bang Front"
 FRE_Cao_Bac.1.d:0 "The Viet Minh have opened their Cao-Bac offensive against the Tho frontier garrisons at Cao Bang and Lang Son. The two sectors cover the roads into northeastern Tonkin. If the Expeditionary Corps keeps both garrisons in place, it must decide how much of its reserve to send to posts that can be isolated from the delta. An orderly withdrawal would keep the battalions together but give the Viet Minh the frontier ground without a battle."
 FRE_Cao_Bac.1.a:0 "Hold the frontier with Tho battalions"
 FRE_Cao_Bac.1.b:0 "Reinforce Cao Bang and Lang Son"
 FRE_Cao_Bac.1.c:0 "Withdraw the frontier garrisons"
 FRE_Cao_Bac_Hold_tt:0 "Spend §Y15 War Credits§!, §Y600 manpower§!, and §Y1 Metropole Patience§!. Cao Bang and Lang Son receive a bounded defensive package."
 FRE_Cao_Bac_Reinforce_tt:0 "Spend §Y60 War Credits§!, §Y2,000 manpower§!, and §Y4 Metropole Patience§!. Reinforced garrisons hold the frontier longer but cannot prevent a Viet Minh breakthrough."
 FRE_Cao_Bac_Withdraw_tt:0 "Spend §Y10 War Credits§!, §Y400 manpower§!, and §Y1 Metropole Patience§!. The frontier garrisons withdraw in good order and the Viet Minh record an unopposed advance."
 FRE_Cao_Bac.2.t:0 "The Cao Bang Front Concludes"
 FRE_Cao_Bac.2.d_held:0 "The Tho garrisons have denied the Viet Minh their full objective. The offensive closed before Hanoi could secure both Cao Bang and Lang Son. The frontier remains exposed, but the Expeditionary Corps has avoided a breakthrough on the scale the Viet Minh intended."
 FRE_Cao_Bac.2.d_overrun:0 "The Viet Minh offensive has secured both Cao Bang and Lang Son despite the effort to defend the frontier. The Expeditionary Corps must now reckon with the loss of its forward positions on the northeastern approaches to Tonkin."
 FRE_Cao_Bac.2.d_evacuated:0 "The Tho garrisons have withdrawn from the frontier in good order. The main body is clear, but the withdrawal has left the approaches to Cao Bang and Lang Son open to the Viet Minh without a fight."
 FRE_Cao_Bac.2.d_superseded:0 "The fighting in the wider theatre has ended before the Cao-Bac offensive could reach a decision. The dispositions of the frontier garrisons will be settled with those of the other posts still in dispute."
 FRE_Cao_Bac.2.a:0 "Record the frontier result"

