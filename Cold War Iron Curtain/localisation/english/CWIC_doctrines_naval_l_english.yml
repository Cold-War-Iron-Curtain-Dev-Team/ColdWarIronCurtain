l_english:
  CW_SEA_CONTROL: "Sea Control"
  CW_SEA_CONTROL_DESC: "Command of the sea lanes through balanced, blue-water fleets: surface action groups, carrier air and a deep ASW screen keep the Atlantic and Pacific open for reinforcement, while the enemy is denied the ocean."
  CW_SEA_DENIAL: "Sea Denial"
  CW_SEA_DENIAL_DESC: "The weaker navy refuses the decisive battle. Submarines, missile boats, mines and shore-based air contest the sea at a fraction of the cost of a balanced fleet and put every convoy and task force at risk."
  CW_POWER_PROJECTION: "Power Projection"
  CW_POWER_PROJECTION_DESC: "Sea power as an instrument of policy: carrier strike groups and amphibious forces carry airpower, marines and nuclear deterrence to any coast, striking harbors and shore targets from the sea."
  CW_SHORE_BOMBARDMENT_GUNLINE: "Shore Bombardment Gunline"
  CW_SHORE_BOMBARDMENT_GUNLINE_DESC: "The last big-gun ships become floating artillery for the coastal flank: cruisers and battleships close the shore to pound fortified positions, as at Inchon and Wonsan."
  cw_shore_bombardment_gunline_gunfire_support: "Gunfire Support Procedures"
  cw_shore_bombardment_gunline_spotting_aircraft: "Spotter Aircraft"
  cw_shore_bombardment_gunline_heavy_shell_stocks: "Heavy Shell Stocks"
  cw_shore_bombardment_gunline_armored_citadels: "Armored Citadels"
  cw_shore_bombardment_gunline_coastal_fire_discipline: "Coastal Fire Discipline"
  CW_CRUISER_TASK_GROUPS: "Cruiser Task Groups"
  CW_CRUISER_TASK_GROUPS_DESC: "Gun cruisers lead independent surface groups that screen the carriers, hunt raiders and show the flag on distant stations while the last battleships are laid up."
  cw_cruiser_task_groups_flagship_coordination: "Flagship Coordination"
  cw_cruiser_task_groups_night_action_drill: "Night Action Drill"
  cw_cruiser_task_groups_radar_fire_control: "Radar Fire Control"
  cw_cruiser_task_groups_sustained_deployments: "Sustained Deployments"
  cw_cruiser_task_groups_squadron_tactics: "Squadron Tactics"
  CW_GUIDED_MISSILE_CRUISERS: "Guided Missile Cruisers"
  CW_GUIDED_MISSILE_CRUISERS_DESC: "Terrier, Talos and Tartar replace guns on the cruiser hull. Missile cruisers become the anti-air backbone of a fleet and the first line against bomber raids."
  cw_guided_missile_cruisers_area_air_defense: "Area Air Defense"
  cw_guided_missile_cruisers_missile_magazines: "Missile Magazines"
