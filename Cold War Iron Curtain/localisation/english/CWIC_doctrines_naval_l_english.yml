  cw_aegis_area_defense_ballistic_missile_defense: "Ballistic Missile Defense"
  cw_aegis_area_defense_integrated_combat_system: "Integrated Combat System"
  CW_SURFACE_ACTION_GROUPS: "Surface Action Groups"
