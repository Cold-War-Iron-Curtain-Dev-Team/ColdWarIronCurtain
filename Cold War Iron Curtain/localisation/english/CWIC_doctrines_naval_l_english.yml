  cw_nuclear_surface_escorts_escort_integration: "Carrier Escort Integration"
  cw_nuclear_surface_escorts_nuclear_logistics: "Nuclear Logistics"
  CW_AEGIS_AREA_DEFENSE: "Aegis Area Defense"
  CW_AEGIS_AREA_DEFENSE_DESC: "Phased-array radar and vertical launch cells let one cruiser track and engage hundreds of targets at once: the saturation raids that sink older fleets simply fail."
  cw_aegis_area_defense_phased_array_radar: "Phased-Array Radar"
  cw_aegis_area_defense_vertical_launch: "Vertical Launch Systems"
