  cw_guided_missile_cruisers_conversion_programs: "Conversion Programs"
  cw_guided_missile_cruisers_missile_gunfire_mix: "Missile-Gun Mix"
  CW_NUCLEAR_SURFACE_ESCORTS: "Nuclear Surface Escorts"
  CW_NUCLEAR_SURFACE_ESCORTS_DESC: "Reactor-powered cruisers and frigates can steam with a nuclear carrier at flank speed for months and need no oilers, extending every escorted task force's reach."
