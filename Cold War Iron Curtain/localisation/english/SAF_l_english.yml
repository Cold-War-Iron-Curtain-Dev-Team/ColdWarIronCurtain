 South_African_Technical_Advisors:0 "South African Technical Advisors"
 South_African_Technical_Advisors_desc:0 "Engineers and civil servants seconded from Pretoria help run our roads, water works and ministries. They make the state work better, and they leave no doubt about who holds the purse strings."
 South_African_Customs_Union:0 "Southern African Customs Union"
 South_African_Customs_Union_desc:0 "The renegotiated customs agreement keeps the region's trade flowing through South African ports and railways, and we collect a share of every tariff."
