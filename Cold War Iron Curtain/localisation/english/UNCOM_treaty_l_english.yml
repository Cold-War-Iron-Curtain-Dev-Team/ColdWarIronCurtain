l_english:
 UNCOM_treaty_decisions:0 "United Nations Command"
 UNCOM_treaty_decisions_desc:0 "Goals of the United Nations Command in Korea. Liaison offices: [?global.UNCOM_liaison_count|0]. Ground contingents: [?global.UNCOM_ground_count|0]. Naval: [?global.UNCOM_naval_count|0]. Air: [?global.UNCOM_air_count|0]. Resupply: [?global.UNCOM_resupply_count|0]."
 UNCOM_Fund_Command_Liaison:0 "Staff the Liaison Office"
 UNCOM_Fund_Command_Liaison_desc:0 "Send officers and communications staff to handle orders and supply requests between our government and the command."
 UNCOM_Open_Command_Liaison:0 "Open the Command Liaison Offices"
 UNCOM_Open_Command_Liaison_desc:0 "The United States, South Korea and three other contributing governments have staffed their liaison offices."
 UNCOM_Deliver_Ground_Contingent:0 "Dispatch a Ground Contingent"
 UNCOM_Deliver_Ground_Contingent_desc:0 "Embark a battalion with its equipment and replacement draft. Its strength is handed to the Republic of Korea's war effort."
 UNCOM_Deliver_Large_Contingent:0 "Dispatch a Brigade Group"
 UNCOM_Deliver_Large_Contingent_desc:0 "Send a larger formation with the officers and replacement stocks needed to keep it in service. It keeps its national identity within the command."
 UNCOM_Deliver_First_Contingents:0 "Bring the First Contingents Ashore"
 UNCOM_Deliver_First_Contingents_desc:0 "The United States and three other governments have delivered ground contingents to Korea."
 UNCOM_Deliver_Naval_Support:0 "Supply Naval Escort Operations"
 UNCOM_Deliver_Naval_Support_desc:0 "Fund the escorts and shipping needed to carry supplies to Korea."
 UNCOM_Deliver_Air_Support:0 "Supply the Air Detachment"
 UNCOM_Deliver_Air_Support_desc:0 "Release aircraft and ground crews for the Korean commitment."
 UNCOM_Deliver_Transport_Flight:0 "Supply the Transport Flight"
 UNCOM_Deliver_Transport_Flight_desc:0 "Assign transport aircraft to the command's supply work, alongside the Greek ground contingent."
 UNCOM_Coordinate_Service_Support:0 "Coordinate Sea and Air Support"
 UNCOM_Coordinate_Service_Support_desc:0 "Two governments have delivered naval support and two have delivered air support."
 UNCOM_Deliver_Resupply:0 "Send the Replacement Consignment"
 UNCOM_Deliver_Resupply_desc:0 "Dispatch replacement stores against the command's current requests, to sustain the commitment already made."
 UNCOM_Sustain_Contingents:0 "Keep the Contingents Supplied"
 UNCOM_Sustain_Contingents_desc:0 "Six months after the first contingents landed, four contributors have delivered a further supply consignment."
 UNCOM_Conclude_Armistice:0 "Bring the Command to the Armistice"
 UNCOM_Conclude_Armistice_desc:0 "An armistice has ended the fighting with the Republic of Korea still standing and the contingents supplied."
 UNCOM_Withdraw_Commitment:0 "Withdraw Our Commitment"
 UNCOM_Withdraw_Commitment_desc:0 "Notify the command that our government is ending its commitment. Contributions already delivered stand."
 UNCOM_participant:0 "Serving under the United Nations Command"
 UNCOM_active:0 "The United Nations Command is operating in Korea"
 UNCOM_armistice_recorded:0 "A Korean armistice has been signed"
 korea.50.t:0 "[GetNewspaperHeader]UN Unified Command Placed Under American Leadership"
 korea.50.d:0 "The Security Council has asked member states that are providing forces to South Korea to place them under a unified command led by the United States, and has authorized that command to fly the United Nations flag alongside national colours.\n\nSixteen governments have offered combat forces so far, from the British Commonwealth to Turkey, Ethiopia, Colombia and Thailand. Each contingent stays under its own government, which decides how much it sends and for how long.\n\nThe Soviet delegation, which has been boycotting the Council since January, was not present for the vote. Moscow has called the resolution illegal."
 korea.50.a:0 "The flag goes to Korea."
 UNCOM_liaison_done:0 "Has staffed its liaison office"
 UNCOM_ground_done:0 "Has delivered a ground contingent"
 UNCOM_naval_done:0 "Has delivered naval support"
 UNCOM_air_done:0 "Has delivered air support"
 UNCOM_resupply_done:0 "Has sent a replacement consignment"
 UNCOM_sustain_wait:0 "Less than six months since the first contingents landed"
 UNCOM_goal_liaison_done:0 "The command liaison offices are open"
 UNCOM_goal_contingents_done:0 "The first contingents are ashore"
 UNCOM_goal_services_done:0 "Sea and air support is coordinated"
 UNCOM_goal_supply_done:0 "The contingents are supplied"
 UNCOM_goal_armistice_done:0 "The command has reached the armistice"
