l_english:
 USA_HIST90.1.t:0 "The Americans with Disabilities Act of 1990"
 USA_HIST90.1.d:0 "In a landmark bipartisan achievement for civil rights, Congress has passed the Americans with Disabilities Act. Modeled on the Civil Rights Act of 1964 and Section 504 of the Rehabilitation Act, the legislation prohibits discrimination against individuals with disabilities across employment, public accommodations, transportation, and telecommunications. Supporters hail the measure as a profound moral milestone that opens American society to millions of citizens, while commercial skeptics caution against the costs of mandatory structural adaptations."
 USA_HIST90.1.a:0 "Sign the landmark civil rights act."
 USA_HIST90.1.b:0 "Demand regulatory relief for small enterprises."

 USA_HIST90.2.t:0 "The Clarence Thomas Confirmation Hearings"
 USA_HIST90.2.d:0 "The nomination of federal appellate judge Clarence Thomas to succeed Thurgood Marshall on the Supreme Court has erupted into an unprecedented national controversy. Televised Senate Judiciary Committee hearings have been gripped by the testimony of University of Oklahoma law professor Anita Hill, who alleged severe workplace sexual harassment during their time at the EEOC. The proceedings have ignited fiery debates nationwide over workplace harassment, judicial qualifications, gender, and institutional power."
 USA_HIST90.2.a:0 "Stand firmly behind the nominee."
 USA_HIST90.2.b:0 "Withdraw the nomination to avert deeper polarization."

 USA_HIST90.3.t:0 "The Los Angeles Riots"
 USA_HIST90.3.d:0 "Following the acquittal of four Los Angeles Police Department officers in the videotaped beating of Rodney King, widespread civil unrest has erupted across South Central Los Angeles. Over six days of looting, arson, and violence, dozens have lost their lives and thousands of businesses have burned. California Governor Pete Wilson requested federal intervention, prompting the deployment of the California Army National Guard, federalized military personnel, and federal tactical teams to restore order."
 USA_HIST90.3.a:0 "Deploy federal forces and enforce the curfew."
 USA_HIST90.3.b:0 "Focus on community reconciliation and emergency relief."

 USA_HIST90.4.t:0 "Ratification of the 27th Amendment"
 USA_HIST90.4.d:0 "In an extraordinary triumph of constitutional perseverance, the 27th Amendment to the United States Constitution has officially achieved ratification by the requisite three-fourths of the states, 202 years after it was first submitted to the states by James Madison in 1789. The amendment stipulates that no law varying the compensation for senators and representatives may take effect until an election of representatives has intervened."
 USA_HIST90.4.a:0 "A long-delayed victory for constitutional accountability."

 USA_HIST90.5.t:0 "The 'Don't Ask, Don't Tell' Compromise"
 USA_HIST90.5.d:0 "The administration's pledge to lift the ban on gay and lesbian military service has met fierce resistance from the Joint Chiefs of Staff, congressional defense committees, and social conservative groups. In response, Secretary of Defense Les Aspin has formulated Department of Defense Directive 1304.26, colloquially titled 'Don't Ask, Don't Tell'. Under this compromise, service members will not be asked about their sexual orientation, but homosexual conduct remains grounds for discharge."
 USA_HIST90.5.a:0 "Accept the 'Don't Ask, Don't Tell' compromise."
 USA_HIST90.5.b:0 "Push for unconditional, immediate integration."
 USA_HIST90.5.c:0 "Uphold the traditional, outright ban."

 USA_HIST90.6.t:0 "The Waco Siege"
 USA_HIST90.6.d:0 "A 51-day standoff between federal law enforcement and the Branch Davidian religious sect at the Mount Carmel compound near Waco, Texas has ended in tragedy. Initiated after a deadly ATF raid to serve weapons warrants, the siege concluded when FBI tactical teams introduced CS tear gas into the compound, followed shortly by a catastrophic fire that consumed the wooden buildings. Seventy-six sect members, including leader David Koresh, perished in the blaze, fueling fierce anti-government rage across the country."
 USA_HIST90.6.a:0 "Defend federal law enforcement's lawful conduct."
 USA_HIST90.6.b:0 "Convene an independent congressional board of inquiry."

 USA_HIST90.7.t:0 "The Battle of Mogadishu"
 USA_HIST90.7.d:0 "Operation Gothic Serpent, an elite mission by Task Force Ranger to capture lieutenants of Somali warlord Mohamed Farrah Aidid in Mogadishu, has spiraled into the deadliest single close-quarters combat engagement for American forces since Vietnam. After two MH-60 Black Hawk helicopters were shot down by RPG fire, American rangers and delta operators fought through the night surrounded by thousands of militia. Eighteen American soldiers died and dozens were wounded, triggering calls for immediate withdrawal from East Africa."
 USA_HIST90.7.a:0 "Announce a phased withdrawal of American ground troops."
 USA_HIST90.7.b:0 "Reinforce the Task Force and crush Aidid's militia."

 USA_HIST90.8.t:0 "The 1994 Republican Revolution"
 USA_HIST90.8.d:0 "Riding a wave of voter dissatisfaction with the early Democratic agenda and campaigning on Newt Gingrich's disciplined ten-point 'Contract with America', the Republican Party has won an overwhelming triumph in the 1994 midterms. Republicans picked up 54 House seats and 8 Senate seats, winning control of the House of Representatives for the first time in forty years. The political landscape in Washington has been upended, heralding an era of combative divided government."
 USA_HIST90.8.a:0 "Divided government enters a combative new era."

 USA_HIST90.9.t:0 "The Violent Crime Control and Law Enforcement Act"
 USA_HIST90.9.d:0 "Amid heightened public anxiety over violent urban crime, the federal government has enacted the Violent Crime Control and Law Enforcement Act of 1994. The omnibus bill authorizes billions in federal funding for 100,000 new community policing officers, expands federal death penalties, institutes mandatory 'three strikes' sentencing rules, and enacts a 10-year federal ban on the manufacture and civilian possession of semi-automatic assault weapons."
 USA_HIST90.9.a:0 "Sign the comprehensive crime and assault weapons bill."
 USA_HIST90.9.b:0 "Drop the assault weapons ban to forge broader consensus."

 USA_HIST90.10.t:0 "The Oklahoma City Bombing"
 USA_HIST90.10.d:0 "At 9:02 a.m., an ammonium nitrate truck bomb detonated outside the Alfred P. Murrah Federal Building in downtown Oklahoma City, destroying more than a third of the nine-story complex. The explosion has claimed the lives of 168 people, including 19 young children in an on-site daycare center, and wounded over 680 others. Federal investigators quickly arrested anti-government extremist Timothy McVeigh, linking the attack to domestic militia ideology and revenge for the Waco siege."
 USA_HIST90.10.a:0 "Vow justice against domestic extremism."
 USA_HIST90.10.b:0 "Unite the nation and expand federal counter-terror powers."

 USA_HIST90.11.t:0 "The Dayton Peace Accords"
 USA_HIST90.11.d:0 "Following weeks of grueling negotiations mediated by American diplomat Richard Holbrooke at Wright-Patterson Air Force Base in Ohio, the leaders of Bosnia, Croatia, and Serbia have initialed the Dayton Peace Agreement. The treaty puts an end to more than three years of horrific bloodshed, ethnic cleansing, and siege warfare in Bosnia and Herzegovina. The United States has pledged approximately 20,000 troops to NATO's Implementation Force (IFOR) to supervise the separation of belligerents."
 USA_HIST90.11.a:0 "Deploy American troops to enforce the Dayton Accords."
 USA_HIST90.11.b:0 "Support European allies without deploying ground forces."

 USA_HIST90.12.t:0 "The Telecommunications Act of 1996"
 USA_HIST90.12.d:0 "In the first sweeping overhaul of American communications law since 1934, Congress has approved the Telecommunications Act of 1996. The law deregulates telecommunications markets, allowing cable companies, long-distance carriers, and local telephone monopolies to compete in each other's markets. It also establishes Section 230 to protect growing internet platforms from liability for third-party speech, laying the regulatory foundation for the explosive growth of the World Wide Web."
 USA_HIST90.12.a:0 "Deregulate the telecommunications and digital highways."

 USA_HIST90.13.t:0 "Welfare Reform: PRWORA"
 USA_HIST90.13.d:0 "Fulfilling the pledge to 'end welfare as we know it', the federal government has enacted the Personal Responsibility and Work Opportunity Reconciliation Act of 1996. The legislation dismantles Aid to Families with Dependent Children (AFDC), replacing it with Temporary Assistance for Needy Families (TANF) block grants to states. The act introduces strict work requirements and a lifetime assistance cap of five years, prompting fierce debate over social safety nets."
 USA_HIST90.13.a:0 "Sign the bipartisan welfare reform bill."
 USA_HIST90.13.b:0 "Veto the bill to defend the federal safety net."

 USA_HIST90.14.t:0 "The Defense of Marriage Act"
 USA_HIST90.14.d:0 "Prompted by lawsuits in Hawaii that could result in state recognition of same-sex unions, Congress has passed the Defense of Marriage Act (DOMA) by veto-proof bipartisan majorities. The bill defines marriage for federal purposes as exclusively between one man and one woman, and provides that no state is obligated to recognize a relationship between persons of the same sex that is treated as a marriage in another state."
 USA_HIST90.14.a:0 "Sign the act to avert constitutional confrontation."
 USA_HIST90.14.b:0 "Veto the measure on equal rights grounds."

 USA_HIST90.15.t:0 "The Good Friday Agreement"
 USA_HIST90.15.d:0 "In a momentous breakthrough in Belfast, British and Irish political leaders have signed the Good Friday Agreement, bringing an end to three decades of sectarian violence known as The Troubles. Chaired by former United States Senator George Mitchell and backed by intense White House diplomacy, the accord establishes power-sharing institutions in Northern Ireland and cross-border cooperation, heralding an era of peace."
 USA_HIST90.15.a:0 "A historic triumph for transatlantic diplomacy."

 USA_HIST90.16.t:0 "Operation Desert Fox"
 USA_HIST90.16.d:0 "In response to Iraq's persistent refusal to cooperate with United Nations Special Commission (UNSCOM) weapons inspectors and its blocking of suspected chemical and biological sites, American and British air and naval forces have executed Operation Desert Fox. Over four days, allied aircraft and Tomahawk cruise missiles struck over 100 military and security targets across Iraq, severely degrading Saddam Hussein's command structures and air defense networks."
 USA_HIST90.16.a:0 "Execute precision strikes against Saddam's installations."
 USA_HIST90.16.b:0 "Rely strictly on multilateral diplomatic pressure."

 USA_HIST90.17.t:0 "Operation Allied Force: The Kosovo Campaign"
 USA_HIST90.17.d:0 "Faced with escalating atrocities and ethnic cleansing against Kosovar Albanians by Yugoslav military and paramilitary forces, NATO has launched Operation Allied Force—a major aerial bombing campaign against the Federal Republic of Yugoslavia. Commenced without explicit UN Security Council authorization due to Russian opposition, the intervention marks a historic evolution in NATO doctrine, asserting humanitarian enforcement beyond alliance borders."
 USA_HIST90.17.a:0 "Commit American airpower to the NATO intervention."
 USA_HIST90.17.b:0 "Restrict US participation to logistical and humanitarian roles."

 USA_HIST90.18.t:0 "The Columbine High School Tragedy"
 USA_HIST90.18.d:0 "The nation has been shaken to its core by a massacre at Columbine High School in Littleton, Colorado. Two heavily armed senior students murdered twelve classmates and a teacher, injuring more than twenty others, before taking their own lives. The horrific tragedy has unleashed a national reckoning regarding school security, bullying, adolescent subcultures, mental health, and access to firearms."
 USA_HIST90.18.a:0 "Lead national mourning and push for stricter gun safety."
 USA_HIST90.18.b:0 "Provide federal grants for school physical security."

 USA_HIST90.19.t:0 "The 'Battle of Seattle': WTO Protests"
 USA_HIST90.19.d:0 "More than 40,000 demonstrators representing labor unions, environmental organizations, student groups, and anti-corporate activists have converged on Seattle to protest the World Trade Organization Ministerial Conference. Direct-action blockades forced the cancellation of opening ceremonies, followed by violent clashes with police, the use of tear gas, looting of corporate storefronts, and the declaration of a civil emergency by the mayor."
 USA_HIST90.19.a:0 "Declare an emergency and clear the downtown core."
 USA_HIST90.19.b:0 "Engage civil society leaders to address economic grievances."

 USA_HIST90.20.t:0 "The Y2K Millennium Transition"
 USA_HIST90.20.d:0 "As the clocks struck midnight across the globe, the anticipated catastrophic computer collapse known as the Year 2000 problem failed to materialize. Years of intensive software remediation, hardware upgrades, and hundreds of billions of dollars in global public and private investments ensured that critical infrastructure, power grids, financial systems, and air traffic control transitioned into the new century without major interruption."
 USA_HIST90.20.a:0 "Welcome the 21st century with confidence!"
