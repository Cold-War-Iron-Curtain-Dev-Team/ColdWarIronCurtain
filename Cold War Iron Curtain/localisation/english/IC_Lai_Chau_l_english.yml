l_english:
 VIN_Strike_Lai_Chau: "The Move on Lai Chau"
 VIN_Strike_Lai_Chau_desc: "Lai Chau is the Tai capital, perched in the mountains far from any French reserve. A division sent against it will force the expeditionary corps to choose between abandoning the Tai country and spreading itself still thinner along Route Pavie."
 VIN_Camp_War_Lai_Chau_tt: "§RBegin the assault on the Tai Federation§!\nTake the §Ysingle Lai Chau province§! in Tay Bac Bo - not Dien Bien Phu or Son La - and hold it for §Y5 consecutive daily ticks§!. Clean victory: day §Y30§!. Final deadline: day §Y45§!. The battle does not change who owns the province."
 VIN_Lai_Chau_Dien_Bien_Bonus_tt: "Because Lai Chau was taken, the Dien Bien Phu campaign starts with §G+15 Campaign Supply§!."
 VIN_Lai_Chau_Objective: "Battle Clock: Lai Chau"
 VIN_Lai_Chau_Objective_desc: "This is the live campaign mission; its expiry resolves the battle.\n§YAttack the highlighted province§!: §YLai Chau§!, not Dien Bien Phu or Son La.\n§YHold§!: retain it for §Y5 consecutive daily ticks§!.\n§YCurrent hold§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§!. Losing the province resets the counter."
 VIN_CAMP_OBJ_LAI_CHAU: "Capture the specifically highlighted §YLai Chau§! province and keep control for §Y5 consecutive daily ticks§!."
 FRE_Preparation.6.t: "The Tai Capital Under Threat"
 FRE_Preparation.6.d: "The Viet Minh 316th Division is on the road to Lai Chau, and the Tai capital lies days from any French reserve. The garrison can only be reinforced from the air, and every transport sent to the northwest is one fewer for the delta. A flight of paratroops could stiffen the defence, but nothing sent can be recovered if the town is lost."
 FRE_Preparation.6.a: "Fly reinforcements into Lai Chau."
 FRE_Preparation.6.b: "The garrison must hold with what it has."
 FRE_Preparation_Lai_Chau_tt: "An airborne group reinforces the §YLai Chau§! garrison until the battle ends."
 VIN_Campaign_Lai_Chau_Result_Clean: "§GThe battle of Lai Chau: a clean success§!"
 VIN_Campaign_Lai_Chau_Result_Costly: "§YThe battle of Lai Chau: a costly success§!"
 VIN_Campaign_Lai_Chau_Result_Failure: "§RThe battle of Lai Chau: the attack failed§!"
