 korea.8.o.b:0 "This is unfortunate."
 korea.8.o.c:0 "How could we let this happen."
 korea.8.o.d:0 "Mission accomplished."
 korea.9.t:0 "We have been broken"
 korea.9.d:0 "We have lost too much of our land to reasonably keep fighting, we should surrender."
 korea.9.o.a:0 "Sign the surrender"
 korea.9.o.b:0 "Traitors! We will never give up!"
 korea.11.t:0 "The commie rebels defeated"
 korea.11.d:0 "Our military forces today defeated the Communist rebels that proclaimed a so called 'state', we have now restored control of our northern lands."
 korea.11.o.a:0 "A victory for Anti-Communist Korea!"
 korea.12.t:0 "[GetNewspaperHeader]The Collapse of North Korea"
 korea.12.d1:0 "The Korean peninsula is whole again. In a stunning and rapid conclusion to the conflict, the remnants of the North Korean army surrendered yesterday to advancing United Nations and Republic of Korea forces. The capitulation marks a total victory for the free world and the successful conclusion of the UN's first major test of arms.\n\nThe final collapse of the North followed the brilliant amphibious landing at Incheon and the subsequent liberation of Seoul. UN forces, under the command of General Douglas MacArthur, launched a lightning offensive northward, capturing the capital of Pyongyang weeks ago and relentlessly pursuing the shattered Korean People's Army. The war effectively ended following the capture of key government officials of the DPRK, although Premier Kim Il Sung was nowhere to be found.\n\nJubilation has erupted in Seoul, Washington, and at UN headquarters in New York. President Syngman Rhee has announced plans for national elections to unify the country under one democratic government. In stark contrast, radio broadcasts from the Eastern Block have fallen silent after weeks of furious denunciations of the UN advance."
