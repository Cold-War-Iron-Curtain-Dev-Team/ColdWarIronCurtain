 USA90_FP97_iraq_and_inspections:0 "Global Policy: Iraq And Inspections"
 USA90_FP97_iraq_and_inspections_desc:0 "Return to the containment file. Desert Fox or a collapsed inspection regime adds war support and air experience. Inspections that held add political power."
 USA90_FP97_north_korean_diplomacy:0 "Global Policy: North Korean Diplomacy"
 USA90_FP97_north_korean_diplomacy_desc:0 "Pick up the Agreed Framework file. A deal that held adds political power. A confessed cheat or a strike plan costs §R4§! public mandate and raises war support."
