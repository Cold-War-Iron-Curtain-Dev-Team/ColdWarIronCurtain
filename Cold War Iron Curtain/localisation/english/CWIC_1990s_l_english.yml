 USA90_FP93_balkan_crisis_desc:0 "Open a Balkans desk. The war in Bosnia is no longer someone else's problem, and the next focus chooses whether Washington will fight it or stand aside."
 USA90_FP93_bosnia_choice:0 "Foreign Policy: Lift and Strike"
 USA90_FP93_bosnia_choice_desc:0 "Lift the arms embargo and prepare NATO air strikes. Costs §Y2.0§! money and §R4§! public mandate. Sets the lift-and-strike course and improves relations with Bosnia if it exists."
 USA90_FP93_bosnian_restraint:0 "Foreign Policy: Bosnian Restraint"
 USA90_FP93_bosnian_restraint_desc:0 "Keep the arms embargo and leave the fighting to UNPROFOR. Gains §G2§! public mandate and a little stability. Dayton is not available on this path until Washington reverses itself, and Srebrenica comes first."
 USA90_FP93_deliberate_force:0 "Foreign Policy: Operation Deliberate Force"
 USA90_FP93_deliberate_force_desc:0 "Bomb Bosnian Serb positions until the talks have a chance. Grants air experience and sets the Deliberate Force flag. Dayton can follow."
 USA90_FP93_srebrenica:0 "Foreign Policy: Srebrenica"
 USA90_FP93_srebrenica_desc:0 "The safe area falls while Washington stays restrained. Costs §R8§! public mandate and §R0.03§! stability. After this, freeze the war or pay to reverse course."
 USA90_FP93_frozen_war:0 "Foreign Policy: A Frozen War"
 USA90_FP93_frozen_war_desc:0 "Accept a partitioned Bosnia with no settlement. Costs §R2§! more public mandate and sets the frozen-war flag. Dayton becomes impossible, and the later Kosovo crisis is harder."
 USA90_FP93_reverse_course:0 "Foreign Policy: Reverse Course"
 USA90_FP93_reverse_course_desc:0 "Abandon restraint after Srebrenica. Costs §Y1.5§! money and §R6§! public mandate. A diminished Dayton accord can then be signed."
 USA90_FP93_dayton_process:0 "Foreign Policy: The Dayton Process"
 USA90_FP93_dayton_process_desc:0 "Requires Deliberate Force, or a reversal after Srebrenica. Unavailable if the war was frozen. A full settlement grants §G6§! public mandate. A late reversal grants §G1§! and a weaker accord."
 USA90_FP93_somalia_after_action:0 "Foreign Policy: Somalia After Action"
 USA90_FP93_somalia_after_action_desc:0 "This focus advances the administration's domestic, foreign, defense, or intelligence program while respecting the current president and the actual Soviet world state."
 USA90_FP93_rwanda_decision:0 "Foreign Policy: Rwanda Decision"
 USA90_FP93_rwanda_decision_desc:0 "This focus advances the administration's domestic, foreign, defense, or intelligence program while respecting the current president and the actual Soviet world state."
 USA90_FP93_rwanda_inaction:0 "Foreign Policy: Rwanda Inaction"
 USA90_FP93_rwanda_inaction_desc:0 "This focus advances the administration's domestic, foreign, defense, or intelligence program while respecting the current president and the actual Soviet world state."
 USA90_FP93_restore_haiti:0 "Foreign Policy: Restore Haiti"
 USA90_FP93_restore_haiti_desc:0 "This focus advances the administration's domestic, foreign, defense, or intelligence program while respecting the current president and the actual Soviet world state."
 USA90_FP93_oslo_process:0 "Foreign Policy: Oslo Process"
 USA90_FP93_oslo_process_desc:0 "This focus advances the administration's domestic, foreign, defense, or intelligence program while respecting the current president and the actual Soviet world state."
 USA90_FP93_iraq_containment:0 "Foreign Policy: Iraq Containment"
 USA90_FP93_iraq_containment_desc:0 "Open the Iraq desk from the State Department. Washington keeps Saddam in a box: no-fly zones, sanctions, and inspectors. Worsens relations with Iraq if it exists."
 USA90_FP93_northern_watch:0 "Foreign Policy: Operation Northern Watch"
 USA90_FP93_northern_watch_desc:0 "Fly the northern no-fly zone. Grants air experience and sets the Northern Watch flag. Does not declare war. Can be taken with Southern Watch."
 USA90_FP93_southern_watch:0 "Foreign Policy: Operation Southern Watch"
 USA90_FP93_southern_watch_desc:0 "Fly the southern no-fly zone. Grants air experience and sets the Southern Watch flag. Does not declare war. Can be taken with Northern Watch."
 USA90_FP93_tighten_sanctions:0 "Foreign Policy: Tighten the Sanctions"
 USA90_FP93_tighten_sanctions_desc:0 "Keep the embargo tight. Costs §Y1.5§! money and worsens relations with Iraq. Required before inspections can be made to hold."
 USA90_FP93_oil_for_food:0 "Foreign Policy: Oil for Food"
 USA90_FP93_oil_for_food_desc:0 "Ease the embargo with an oil-for-food arrangement. Gains §G2§! public mandate. Inspections on this path cannot be held; they break."
 USA90_FP93_unscom:0 "Foreign Policy: UNSCOM Inspections"
 USA90_FP93_unscom_desc:0 "Send the inspectors back in after the sanctions choice. The next focus decides whether they stay or get thrown out."
 USA90_FP93_inspections_hold:0 "Foreign Policy: Inspections Hold"
 USA90_FP93_inspections_hold_desc:0 "Requires the tight sanctions. The inspectors keep working. Sets the inspections-holding flag, which eases the 1997 Iraq focus."
 USA90_FP93_inspections_break:0 "Foreign Policy: Inspections Collapse"
 USA90_FP93_inspections_break_desc:0 "Baghdad shuts the inspectors out. Costs §R3§! public mandate and sets the collapse flag. Desert Fox can follow. This is the only inspections outcome after Oil for Food."
 USA90_FP93_desert_fox:0 "Foreign Policy: Operation Desert Fox"
 USA90_FP93_desert_fox_desc:0 "Strike Iraqi military sites after the inspectors are expelled. Grants air experience, raises war support, and costs §R3§! public mandate. Sets the Desert Fox flag. Does not declare war."
 USA90_FP93_north_korean_framework:0 "Foreign Policy: The Agreed Framework"
 USA90_FP93_north_korean_framework_desc:0 "Open the North Korea desk from the State Department. The next focus funds the reactors deal, demands harder inspections, or draws up a strike plan."
 USA90_FP93_fund_the_framework:0 "Foreign Policy: Fund the Framework"
 USA90_FP93_fund_the_framework_desc:0 "Pay for the Agreed Framework. Costs §Y2.5§! money and improves relations with North Korea if it exists. Seventy days later, Washington must keep the deal or confront evidence of cheating."
 USA90_FP93_harder_inspections:0 "Foreign Policy: Harder Inspections"
 USA90_FP93_harder_inspections_desc:0 "Refuse the light-water bargain and demand intrusive inspections. The talks stall. Relations with North Korea worsen if it exists."
 USA90_FP93_strike_option:0 "Foreign Policy: A Strike Option"
 USA90_FP93_strike_option_desc:0 "Draw up a plan to hit Yongbyon. Costs §R4§! public mandate now and §R4§! more when the allies refuse a war. Sets the strike-plan flag. There is no invasion focus."
