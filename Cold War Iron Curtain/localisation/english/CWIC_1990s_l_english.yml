 USA90_FP97_global_engagement_desc:0 "This focus advances the administration's domestic, foreign, defense, or intelligence program while respecting the current president and the actual Soviet world state."
 USA90_FP97_nato_enlargement:0 "Global Policy: NATO Enlargement"
 USA90_FP97_nato_enlargement_desc:0 "Invite qualified Central European partners into NATO after Partnership for Peace. This focus exists only in the post-Soviet world state."
 USA90_FP97_kosovo_crisis:0 "Global Policy: Kosovo Crisis"
 USA90_FP97_kosovo_crisis_desc:0 "The next Balkan war. A Dayton accord adds §G3§! public mandate. A frozen Bosnia costs §R4§! public mandate and raises war support."
 USA90_FP97_manage_yeltsin_russia:0 "Global Policy: Manage Yeltsin Russia"
 USA90_FP97_manage_yeltsin_russia_desc:0 "Balance engagement with Yeltsin's Russia against economic instability, domestic opposition, and the danger of appearing to dictate Russia's future."
 USA90_FP97_second_cold_war_pressure:0 "Global Policy: Second Cold War Pressure"
 USA90_FP97_second_cold_war_pressure_desc:0 "The Soviet rivalry continues into the late 1990s. Increase pressure while keeping nuclear escalation and allied cohesion at the center of every decision."
 USA90_FP97_proxy_competition:0 "Global Policy: Proxy Competition"
 USA90_FP97_proxy_competition_desc:0 "This focus advances the administration's domestic, foreign, defense, or intelligence program while respecting the current president and the actual Soviet world state."
