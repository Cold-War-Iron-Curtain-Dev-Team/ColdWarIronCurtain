 FIN90.1.t:0 "Finland at the National Crossroads"
 FIN90.1.d:0 "The assumptions that guided Finland through the Cold War are giving way. A credit boom, an overextended banking sector, changing Eastern trade, and a restless electorate have made the coming decade a test of the republic itself."
 FIN90.1.a:0 "Convene the government and the parties."
 FIN90.2.t:0 "The Eastern Trade Reckoning"
 FIN90.2.d:0 "The old clearing-trade system has vanished with the Soviet state. The loss is severe, but domestic credit, currency, and banking weaknesses are also driving the depression."
 FIN90.2.d.exposed:0 "Our unusually deep dependence on Soviet clearing trade has magnified the external shock. It meets an already fragile credit system at the worst possible moment."
 FIN90.2.d.continued:0 "The Soviet Union survives, but the clearing-trade relationship cannot remain unchanged. Finland must negotiate a less dangerous dependence while an ongoing superpower rivalry constrains every alternative."
 FIN90.2.a:0 "Redirect exports toward Europe."
 FIN90.2.b:0 "Preserve what Eastern contracts remain."
 FIN90.10.t:0 "The 1991 Parliamentary Election"
 FIN90.10.d:0 "The recession and the end of the old foreign-policy setting dominate the campaign. No party can govern alone; the coalition agreement will determine who bears the cost of stabilization."
 FIN90.10.a:0 "Esko Aho forms a Centre-led government."
 FIN90.10.b:0 "Continue Holkeri's broad cooperation."
 FIN90.10.c:0 "Assemble a coalition of the left."
 FIN90.10.d_option:0 "Bring the rural populists into government."
 FIN90.15.t:0 "The Cabinet Loses Its Majority"
 FIN90.15.d:0 "Coalition support has fallen to a critical level. Ministers threaten resignation and parliamentary allies demand a new agreement before they will support another reform."
 FIN90.15.a:0 "Negotiate costly concessions."
 FIN90.15.b:0 "Reconstruct the cabinet."
 FIN90.20.t:0 "The 1994 Presidential Election"
 FIN90.20.d:0 "For the first time the president is chosen by direct popular vote. The office remains powerful, but a changing constitution and a more assertive parliament will shape the victor's mandate."
 FIN90.20.a:0 "Martti Ahtisaari wins the presidency."
 FIN90.20.b:0 "The socialist restoration elevates Sinisalo."
 FIN90.20.c:0 "Vennamo captures the presidency."
 FIN90.30.t:0 "The 1995 Parliamentary Election"
 FIN90.30.d:0 "Recovery has begun, but its gains are uneven. The next coalition must reconcile fiscal repair, employment, and Finland's place in Europe."
 FIN90.30.a:0 "Paavo Lipponen assembles the Rainbow Coalition."
 FIN90.30.b:0 "A Nordic-neutral coalition takes office."
 FIN90.30.c:0 "The socialist coalition renews its mandate."
 FIN90.30.d_option:0 "The national government consolidates power."
 FIN90.40.t:0 "The 1999 Parliamentary Election"
 FIN90.40.d:0 "The depression has receded, leaving a debate over who deserves credit and what Finland should become in the new century."
 FIN90.40.a:0 "Renew a broad governing coalition."
 FIN90.40.b:0 "Demand a sharper political break."
 FIN90.50.t:0 "The Presidential Transition of 2000"
 FIN90.50.d:0 "The new constitution reduces presidential authority as Finland elects its first woman president. The transition closes a decade of institutional and strategic transformation."
 FIN90.50.a:0 "Tarja Halonen assumes the presidency."
 FIN90.50.b:0 "Our alternative order completes its constitutional settlement."
 
 FIN90.60.t:0 "Assembly '92: The Gathering of the Scene"
 FIN90.60.d:0 "While Finland is gripped by a punishing banking crisis and the collapse of Soviet clearing trade, an underground digital culture is exploding across suburban school gymnasiums and youth clubs. In July 1992, over seven hundred teenage hackers, tracker musicians, and demo coders from legendary underground groups—including Complex, Rebels, and Future Crew—gathered at the Kauniainen sports hall for Assembly '92.\n\nArmed with Commodore Amigas, PC clones, cathode-ray monitors, and sleeping bags, these self-taught youths spent 72 sleepless hours pushing computing hardware far past factory limitations with mind-bending mathematical routines and low-level assembly language. As the older generation despairs over rising unemployment, Finland's youth are quietly building the world's most sophisticated grassroots computer subculture."
 FIN90.60.a:0 "A harmless hobby, but a remarkable demonstration of youth talent."
 FIN90.60.b:0 "Provide municipal youth grants for computer clubs and network equipment."
 FIN90.61.t:0 "Future Crew and 'Second Reality'"
 FIN90.61.d:0 "At Assembly '93 in Hämeenlinna, Finnish demogroup Future Crew has premiered what is instantly recognized as an epochal masterpiece of computer graphics: 'Second Reality'. Running on standard IBM PC 486 hardware with zero 3D accelerator hardware, the demo astonished audiences worldwide with real-time 3D polygon cityscapes, ray-traced spheres, fluid plasma distortions, and an iconic 16-channel tracker soundtrack by Purple Motion and Skaven.\n\nCopies of the demo are being furiously downloaded across international BBS nodes. Programmers from Silicon Valley to Tokyo are expressing disbelief that teenagers in depression-era Finland could coax such mathematical wizardry from consumer PCs. National morale swells as international technology press marvels at Finnish digital ingenuity."
 FIN90.61.a:0 "Pure digital wizardry! Finnish engineering turns heads worldwide."
 FIN90.62.t:0 "From Demos to Industry: The Rise of Remedy"
 FIN90.62.d:0 "The bedroom demo coders and pixel artists of the early 1990s are coming of age—and transforming into cutting-edge tech entrepreneurs. In August 1995, key members of Future Crew banded together in a suburban Espoo basement to establish Remedy Entertainment, pioneering narrative 3D gaming. Concurrently, other demoscene alumni are laying the groundwork for Futuremark—creators of the definitive 3DMark GPU benchmarking suite—and studios like Housemarque.\n\nCoupled with Nokia’s skyrocketing cellular communications revolution and top-tier university research, the demoscene talent pipeline has converted Finland into an unexpected global powerhouse of 3D graphics, game development, and software optimization. Code is becoming Finland's new green gold."
 FIN90.62.a:0 "Foster the digital frontier—code is our new forestry."

 USA90.1.t:0 "The Midterm Reckoning"
 USA90.1.d:0 "Voters have delivered their verdict on the administration's opening program. Congress is less tractable, and every major bill will now require either confrontation or a narrower coalition."
 USA90.1.a:0 "Defend the program and mobilize our supporters."
 USA90.1.b:0 "Triangulate toward the center."
 USA90.2.t:0 "The Budget Showdown"
 USA90.2.d:0 "The executive and Congress cannot agree on funding. Agencies prepare to close while both sides race to assign blame."
 USA90.2.a:0 "Refuse to yield."
 USA90.2.b:0 "Negotiate a temporary settlement."
 USA90.10.t:0 "Investigations and Executive Privilege"
 USA90.10.d:0 "A widening investigation has turned private conduct and executive secrecy into a constitutional struggle. Cooperation may limit the damage; confrontation may rally supporters at far greater risk."
 USA90.10.d.clinton:0 "Investigations of President Clinton now threaten to consume the second-term agenda. The White House must choose between disclosure and an impeachment confrontation."
 USA90.10.a:0 "Cooperate with congressional oversight."
 USA90.10.b:0 "Fight the investigation."
 USA90.20.t:0 "The Digital Boom"
 USA90.20.d:0 "Commercial internet use, telecommunications investment, and technology markets are transforming the economy. Policymakers disagree over whether rapid liberalization or durable safeguards should define the boom."
 USA90.20.a:0 "Let the digital economy run."
 USA90.20.b:0 "Preserve financial safeguards."
 USA90.30.t:0 "A New Administration Awaits"
 USA90.30.d.bush:0 "George W. Bush has prevailed in the contested election. The expansion ends at the inauguration: the choices of his administration belong to another era."
 USA90.30.d.gore:0 "Al Gore has carried the Democratic program into a new term. The expansion ends at the inauguration, before the new administration sets its post-2001 course."
 USA90.30.d.other:0 "The election has produced a new mandate, but the story closes in January 2001. The challenges beyond this point belong to another era."
 USA90.30.a:0 "Close the book on the American 1990s."

 USA90D.1.t:0 "The Balkans Desk"
 USA90D.1.d:0 "Sarajevo is under siege and the arms embargo has locked the weaker side in place. The State Department wants a decision: strike with NATO, or keep the war at arm's length."
 USA90D.1.a:0 "Put it on the agenda."
 USA90D.2.t:0 "Operation Deliberate Force"
 USA90D.2.d:0 "NATO aircraft hit Bosnian Serb positions around Sarajevo. The bombing is meant to drive the parties to a table, not to occupy the country."
 USA90D.2.a:0 "Keep the pressure on."
 USA90D.3.t:0 "Srebrenica"
 USA90D.3.d:0 "The safe area has fallen. Restraint kept American soldiers out of the war, and it also kept Washington from stopping the massacre. The public can count the cost."
 USA90D.3.a:0 "This policy has failed."
 USA90D.4.t:0 "Dayton"
 USA90D.4.d:0 "The parties initial a settlement. A NATO-led force will separate the armies, and Bosnia survives as one state on paper."
 USA90D.4.d.weak:0 "The settlement comes late, after Srebrenica, and everyone in the room knows it. The map is drawn, but the mandate to enforce it is thin."
 USA90D.4.a:0 "Initial the accords."
 USA90D.10.t:0 "UNSCOM Goes Back In"
 USA90D.10.d:0 "Inspectors return to Iraq with a mandate to find what remains of the weapons programs. How long they last depends on how tightly the embargo is held."
 USA90D.10.a:0 "Give them the brief."
 USA90D.11.t:0 "Operation Desert Fox"
 USA90D.11.d:0 "American and British aircraft strike Iraqi sites after the inspectors are expelled. The operation punishes Baghdad. It does not remove the regime."
 USA90D.11.a:0 "End the strikes."
 USA90D.12.t:0 "Desert Fox"
 USA90D.12.d:0 "American and British aircraft have struck military sites across the country. The regime is still in place, and the inspectors are gone."
 USA90D.12.a:0 "We will remember this."
 USA90D.20.t:0 "The Agreed Framework"
 USA90D.20.d:0 "Pyongyang has frozen its declared reactors in exchange for oil and a promise of light-water reactors. Washington can pay, demand more inspections, or plan a strike."
 USA90D.20.a:0 "Choose a course."
 USA90D.21.t:0 "Doubts About Yongbyon"
 USA90D.21.d:0 "Intelligence suggests the freeze is incomplete. The administration can keep the bargain and the quiet, or confront Pyongyang and admit the deal is being cheated."
 USA90D.21.a:0 "Keep the deal."
 USA90D.21.b:0 "Confront the cheat."
 USA90D.22.t:0 "The Talks Stall"
 USA90D.22.d:0 "Pyongyang rejects the harder inspection demand. The Agreed Framework does not move, and neither does a settlement."
 USA90D.22.a:0 "Leave it there."
 USA90D.23.t:0 "The Allies Refuse"
 USA90D.23.d:0 "Seoul and Tokyo will not back a strike on Yongbyon. The plan stays in the drawer, and the administration pays for having waved it around."
 USA90D.23.a:0 "Shelf the plan."

 USA_CT90.1.t:0 "The 1993 World Trade Center Bombing"
 USA_CT90.1.d:0 "An attack beneath the World Trade Center has exposed a transnational extremist milieu operating inside the United States. Investigators have evidence, but agencies still lack a common picture."
 USA_CT90.1.a:0 "Create a joint federal investigation."
 USA_CT90.1.b:0 "Keep the investigation narrowly compartmented."
 USA_CT90.2.t:0 "The New York Landmarks Investigation"
 USA_CT90.2.d:0 "The bombing inquiry points toward a broader conspiracy against prominent New York sites. Acting requires usable leads and cooperation across institutional lines."
 USA_CT90.2.a:0 "Use the leads to break the conspiracy."
 USA_CT90.2.b:0 "The warning arrives too late to be actionable."
 USA_CT90.10.t:0 "Bin Laden Moves to Afghanistan"
 USA_CT90.10.d:0 "A wealthy extremist sponsor has left Sudan for Afghanistan, where fragmented authority offers greater freedom. The intelligence community warns that the network is becoming more ambitious."
 USA_CT90.10.a:0 "Expand the covert pursuit."
 USA_CT90.10.b:0 "Build the analytic file before acting."
 USA_CT90.20.t:0 "Bombings at the East Africa Embassies"
 USA_CT90.20.d:0 "Coordinated attacks against American embassies in East Africa have killed Americans and local citizens. The network has demonstrated strategic reach."
 USA_CT90.20.d.hardened:0 "Coordinated attacks strike the East Africa embassies, but prior hardening limits the damage. The hostile network has nevertheless demonstrated strategic reach."
 USA_CT90.20.a:0 "Order limited retaliatory strikes."
 USA_CT90.20.b:0 "Expand the covert pursuit and liaison campaign."
 USA_CT90.20.c:0 "Exercise restraint."
 USA_CT90.30.t:0 "The Millennium Plots"
 USA_CT90.30.d:0 "A cluster of warnings suggests attacks around the millennium celebrations. Customs officers, foreign partners, and federal agencies need a common operational picture before the calendar turns."
 USA_CT90.30.a:0 "Disrupt the plots with the accumulated leads."
 USA_CT90.30.b:0 "The fragments never form a complete warning."
 USA_CT90.40.t:0 "The Attack on USS Cole"
 USA_CT90.40.d:0 "An attack has struck USS Cole in Aden harbor. The incident reinforces warnings that a transnational network can attack American targets far from home."
 USA_CT90.40.a:0 "Commit to a full interagency investigation."
 USA_CT90.40.b:0 "Treat it primarily as a military attack."
 USA_CT90.50.t:0 "The Counterterrorism Ledger, January 2001"
 USA_CT90.50.d.success:0 "Patient investment in investigators, analysts, partners, and secure infrastructure has disrupted multiple plots and reduced hostile freedom of action. The danger remains, but the government enters 2001 with a coherent warning system."
 USA_CT90.50.d.failure:0 "The failed Bojinka response and continuing attacks reveal deep seams between collection, law enforcement, and policy. The government enters 2001 knowing that the network threat is unresolved."
 USA_CT90.50.d.mixed:0 "The decade produced arrests, missed warnings, successful liaison, and institutional rivalry in equal measure. The government enters 2001 with stronger capabilities but no final victory."
 USA_CT90.50.a:0 "Carry the lessons into the new century."

 BOJINKA.100.t:0 "A Fire in Manila"
 BOJINKA.100.d:0 "Philippine investigators have recovered evidence of a far-reaching aviation plot from a Manila apartment. American liaison officers are asked to help identify suspects and understand the threat."
 BOJINKA.100.a:0 "Send the file to Washington immediately."
 BOJINKA.1.t:0 "The Bojinka File"
 BOJINKA.1.d.phi:0 "Philippine authorities have shared evidence of a planned mass-casualty aviation campaign. The strategic warning is clear, but suspects, financing, and overseas links remain uncertain."
 BOJINKA.1.d.fallback:0 "A Southeast Asian police liaison has recovered evidence of a planned mass-casualty aviation campaign. The crisis can be resolved even though no Philippine government exists in this timeline."
 BOJINKA.1.a:0 "Share every lead and form a joint crisis team."
 BOJINKA.1.b:0 "Protect sensitive sources through compartmentation."
 BOJINKA.1.c:0 "Immediately harden civil aviation."
 BOJINKA.2.t:0 "Assessment of the Bojinka Threat"
 BOJINKA.2.d:0 "The crisis team's fixed assessment is complete. Its result reflects our accumulated capacity, expendable leads, partner trust, aviation security, network pressure, and the choices made in this crisis."
 BOJINKA.2.a:0 "The plot has been decisively uncovered."
 BOJINKA.2.b:0 "Only part of the network has been exposed."
 BOJINKA.2.c:0 "The warning has failed."
 BOJINKA.3.t:0 "Bojinka Prevented"
 BOJINKA.3.d:0 "International police and intelligence cooperation has broken the plot before execution. The investigation yields new leads and a clearer map of the transnational network."
 BOJINKA.3.a:0 "Quiet success is still success."
 BOJINKA.4.t:0 "Bojinka Partially Disrupted"
 BOJINKA.4.d:0 "The immediate danger has been limited, but important suspects and financial links remain beyond reach. A timed international pursuit now begins."
 BOJINKA.4.a:0 "Keep the pursuit alive."
 BOJINKA.5.t:0 "Catastrophe in the Air"
 BOJINKA.5.d:0 "A coordinated attack on civil aviation has caused mass casualties and a profound crisis of public confidence. The government must respond without assuming that the decade has already predetermined a later war."
 BOJINKA.5.a:0 "Seek emergency surveillance authority."
 BOJINKA.5.b:0 "Fund security and investigation within existing law."

