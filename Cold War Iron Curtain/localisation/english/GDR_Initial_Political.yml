l_english: 

 GDR_Convene_the_Third_German_Peoples_Congress:0 "Convene the Third German People's Congress"
 GDR_Convene_the_Third_German_Peoples_Congress_desc:0 "It is time to convene the Third German People's Congress and determine the future course of the new, democratic German state."
 GDR_Interpreting_Stalins_Advice:0 "Interpreting Stalin's Advice"
 GDR_Interpreting_Stalins_Advice_desc:0 "The Soviet Occupation Zone is rapidly evolving into its own state, and with it, come issues of foreign and domestic policy. We've received much advice from the USSR on how to proceed, though much of it is contradictory and inconsistent. We must decide on what path to take."
 GDR_Deny_Similarities_to_Peoples_Democracies:0 "Deny Similarities to People's Democracies"
 GDR_Deny_Similarities_to_Peoples_Democracies_desc:0 "We need not toe the same Stalinist line as our East European comrades. Ulbricht will not be pleased, but we serve the people, not the man."
 GDR_Continue_Tupolevs_Line:0 "Continue Tupolev's Line"
 GDR_Continue_Tupolevs_Line_desc:0 "All this talk of reform is dangerous. The Stalinist model has worked wonders in the USSR and the rest of Eastern Europe; we would be foolish to try forging our own path."
 GDR_Make_Further_Concessions_in_Constitution_Proposal:0 "Futher Concessions in the Constitution"
 GDR_Make_Further_Concessions_in_Constitution_Proposal_desc:0 "If we wish to cooperate with the other parties in the governing coalition, we must be willing to concede certain points and privileges in order to maintain trust and stability."
 GDR_Propose_Recociliation_Meetings_with_Western_Officials:0 "Propose Reconciliation Meetings with Western Officials"
 GDR_Propose_Recociliation_Meetings_with_Western_Officials_desc:0 "We must explore every avenue for peace and diplomacy, even with our ideological adversaries. Proposing reconciliation meetings may reduce tensions and give us the upper hand in controlling the narrative."
 GDR_Invest_in_the_National_Front_Initiative:0 "Invest in the National Front Initiative"
 GDR_Invest_in_the_National_Front_Initiative_desc:0 "By empowering mass organizations under the National Front, we can extend Party influence under the guise of democratic unity."
 GDR_Focus_on_Affirming_Party_Power:0 "Affirming Party Power"
 GDR_Focus_on_Affirming_Party_Power_desc:0 "We will reaffirm the SED's position as the vanguard of the working class and eliminate ambiguity in the power relationship between Party and state."
 GDR_The_Question_of_Party_and_State:0 "The Question of Party & State"
 GDR_The_Question_of_Party_and_State_desc:0 "In theory, the state represents the people. In practice, it must reflect the leadership of the Party. We will settle this debate by formalizing the SED's supremacy in governance."
 GDR_Resume_Publication_of_Voelkischer_Beobachter:0 "Resume Publication of Völkischer Beobachter"
 GDR_Resume_Publication_of_Voelkischer_Beobachter_desc:0 "Resuming this publication under strict Party oversight will allow us to reshape its legacy into an anti-fascist and socialist narrative, reclaiming its platform for the people."
 GDR_Direct_NDPD_to_Start_New_Publication:0 "A New Publication for the NDPD"
 GDR_Direct_NDPD_to_Start_New_Publication_desc:0 "The National Democratic Party needs a fresh voice. A new publication will allow it to act as an efficient outreach tool, especially to former nationalist elements."
 GDR_Re_Evaluating_the_Two_Year_Plan:0 "Re-Evaluating the Two Year Plan"
 GDR_Re_Evaluating_the_Two_Year_Plan_desc:0 "The Two-Year Plan is not going well. If we do not act now, we risk its failure, or worse, economic recession."
 GDR_Halt_Collectivization_Efforts:0 "Halt Collectivization Efforts"
 GDR_Halt_Collectivization_Efforts_desc:0 "Collectivization has generated more resistance than results. We will pause these efforts and re-evaluate our agricultural policies."
 GDR_Ignore_Soviet_Concerns:0 "Ignore Soviet Concerns"
 GDR_Ignore_Soviet_Concerns_desc:0 "Moscow's advice is not sacrosanct. For the sake of stability and success, we will quietly disregard their objections and follow our own path."
 GDR_A_Review_of_Bodenreform:0 "A Review of Bodenreform"
 GDR_A_Review_of_Bodenreform_desc:0 "Land reform was essential to dismantle the exploitative economic model, but its implementation has raised concerns. A thorough review will ensure it aligns with socialist goals while addressing practical realities."
 GDR_Propagandize_Successful_Progress:0 "Propagandize Successful Progress"
 GDR_Propagandize_Successful_Progress_desc:0 "Even modest gains must be framed as monumental victories. Celebrating these successes will reinforce faith in socialism and drown out any narrative of failure or stagnation."
 GDR_Seek_Re_Evaluation_of_Reperations:0 "Seek Re-Evaluation of Reperations"
 GDR_Seek_Re_Evaluation_of_Reperations_desc:0 "The burden of reparations imposed after the War continues to strain our economy. We will seek a reassessment from Moscow, arguing that a stronger GDR is in everyone's interest."
 GDR_Investigate_the_Potential_of_Future_Industrial_Nationalizations:0 "Investigate Future Industrial Nationalizations"
 GDR_Investigate_the_Potential_of_Future_Industrial_Nationalizations_desc:0 "Control over the means of production must be total. A commission will investigate which remaining private industries may be brought under state ownership without economic disruption."
 GDR_A_Trip_to_Moscow:0 "A Trip to Moscow"
 GDR_A_Trip_to_Moscow_desc:0 "High-level talks in Moscow offer an opportunity to solidify our alignment with the Soviet Union."
 GDR_The_Establishment_of_the_German_Democratic_Republic:0 "Establish the German Democratic Republic"
 GDR_The_Establishment_of_the_German_Democratic_Republic_desc:0 "With the collapse of the fascist regime and the re-education of Germany, a new socialist state has risen from the ashes. The GDR shall serve as a model for future unification under proletarian rule."
 GDR_Ulbricht_Consolidates_Power:0 "Ulbricht Consolidates Power"
 GDR_Ulbricht_Consolidates_Power_desc:0 "Walter Ulbricht is emerging as the unchallenged leader of the Party. By sidelining potential rivals and securing support from Moscow, we can lay the groundwork for centralized and disciplined governance."
 GDR_Grotewohl_Victorious:0 "Grotewohl Victorious"
 GDR_Grotewohl_Victorious_desc:0 "Otto Grotewohl's political acumen and public appeal have triumphed. His leadership provides the SED with a moderate yet loyal figure to bridge the gap between Party orthodoxy and popular legitimacy."
 GDR_The_Second_Party_Conference_a:0 "The Second Party Conference"
 GDR_The_Second_Party_Conference_a_desc:0 "The Second Party Conference shall serve as a moment of ideological renewal and centralization. With Moscow's backing, we will declare our path forward and purge lingering deviations."
 GDR_The_Problem_of_the_Church:0 "The Problem of the Church"
 GDR_The_Problem_of_the_Church_desc:0 "Religion remains a deeply embedded force in German life. It must be addressed."
 GDR_Meet_with_EKD_and_German_Catholic_Leadership:0 "Meet with EKD and Catholic Leadership"
 GDR_Meet_with_EKD_and_German_Catholic_Leadership_desc:0 "Rather than force a clash, we will open discussions with Protestant and Catholic leaders. This approach may defuse tensions and offer opportunities to influence religious life from within."
 GDR_Avoid_Antagonizing_the_Church:0 "Avoid Antagonizing the Church"
 GDR_Avoid_Antagonizing_the_Church_desc:0 "While the Church poses a latent threat, open persecution would alienate believers and draw Western criticism. For now, we will maintain a posture of cautious engagement and surveillance."
 GDR_Lionize_the_Spartacist_Uprising:0 "Lionize the Spartacist Uprising"
 GDR_Lionize_the_Spartacist_Uprising_desc:0 "The Spartacist uprising of 1919 was a crucial moment in the German proletarian struggle. We will elevate its martyrs and remind the people that our state fulfills their unfinished revolution."
 GDR_Promote_Socialist_Heroes:0 "Promote Socialist Heroes"
 GDR_Promote_Socialist_Heroes_desc:0 "Through monuments, school curricula, and state media, we will elevate Party-approved figures as role models for the new generation."
 GDR_The_Election_Problem_a:0 "The Election Problem"
 GDR_The_Election_Problem_a_desc:0 "Western observers are watching closely. While the Party cannot afford real pluralism, we must engineer an electoral process that projects legitimacy and unity to the outside world."
 GDR_The_Election_Problem:0 "The Election Problem"
 GDR_The_Election_Problem_desc:0 "Western observers are watching closely. While the Party cannot afford real pluralism, we must engineer an electoral process that projects legitimacy and unity to the outside world."
 GDR_Promote_the_Young_Pioneers:0 "Promote the Young Pioneers"
 GDR_Promote_the_Young_Pioneers_desc:0 "The future belongs to those who shape it. The Young Pioneers will be expanded, instilling socialist values in children and preparing them to serve as tomorrow's vanguard."
 GDR_Escalate_Class_Conflict:0 "Escalate Class Conflict"
 GDR_Escalate_Class_Conflict_desc:0 "Class struggle does not end with revolution, it intensifies. We will heighten awareness of bourgeois sabotage and mobilize the working class against residual enemies of socialism."
 GDR_Demolish_the_Berlin_Palace:0 "Demolish the Berlin Palace"
 GDR_Demolish_the_Berlin_Palace_desc:0 "The former Prussian royal palace is a relic of feudalism. Its destruction will symbolize our break with the past and clear the way for monuments to socialism."
 GDR_Increase_Income_and_Artisan_Taxes:0 "Increase Income & Artisan Taxes"
 GDR_Increase_Income_and_Artisan_Taxes_desc:0 "To finance our Five-Year Plan, we must demand greater contributions from the self-employed and wealthier classes. The burden will fall where it should; on those least aligned with socialism."
 GDR_Aktion_Rose:0 "Aktion Rose"
 GDR_Aktion_Rose_desc:0 "Operation Rose will target private hotel and guesthouse owners along the Baltic coast, expropriating their properties in the name of the state."
 GDR_The_Second_Party_Conference:0 "The Second Party Conference"
 GDR_The_Second_Party_Conference_desc:0 "As the Party matures, we must prepare for a decisive conference that will set the ideological tone for years to come."
 GDR_Declare_War_on_the_Church:0 "Declare War on the Church"
 GDR_Declare_War_on_the_Church_desc:0 "The Church's influence must be broken. We will confront its institutions directly, using every tool at our disposal to sever its ties to public life."
 GDR_Ban_Religous_Education:0 "Ban Religous Education"
 GDR_Ban_Religous_Education_desc:0 "Religion has no place in the formation of young minds. All religious instruction will be removed from schools, replaced by socialist ethics and scientific rationalism."
 GDR_For_the_Construction_of_Socialism:0 "For the Construction of Socialism"
 GDR_For_the_Construction_of_Socialism_desc:0 "We now move beyond recovery and toward construction. Industry, agriculture, education, and ideology will be reshaped to create a society worthy of the name socialist."
 GDR_Slash_Social_Service_Spending:0 "Slash Social Service Spending"
 GDR_Slash_Social_Service_Spending_desc:0 "Resources are limited, and the revolution demands sacrifice. Funding for social programs will be redirected toward industrial expansion and internal security."
 GDR_Strip_Self_Employed_Workers_of_Benefits:0 "Strip Self-Employed Workers of Benefits"
 GDR_Strip_Self_Employed_Workers_of_Benefits_desc:0 "Self-employed elements benefit from the state while resisting collectivization. This contradiction ends now. Their access to state benefits will be terminated."
 GDR_Begin_Mass_Surveilance_on_CDU_Members_and_Clergy:0 "Mass Surveilance on the CDU & the Clergy"
 GDR_Begin_Mass_Surveilance_on_CDU_Members_and_Clergy_desc:0 "The Clergy and Christian Democrats remain centers of counter-revolutionary sentiment. We will begin broad surveillance operations to expose subversion and prepare for future action"
 GDR_Emulate_Stalins_Personality_Cult:0 "Emulate Stalin's Personality Cult"
 GDR_Emulate_Stalins_Personality_Cult_desc:0 "Stalin's cult of personality secured unity and obedience in the USSR. We will adopt similar methods, glorifying our leadership to command loyalty and suppress doubt."
 GDR_Force_Agricultural_Collectivization:0 "Force Agricultural Collectivization"
 GDR_Force_Agricultural_Collectivization_desc:0 "§RWhat could possibly go wrong?§"
 GDR_Hike_Working_Hours:0 "Hike Working Hours"
 GDR_Hike_Working_Hours_desc:0 "Productivity must rise to meet the Five-Year Plan. We will extend the working day while emphasizing the moral duty of labor to the state."
 GDR_Silence_Coalition_Member_Voices:0 "Silence Coalition Member Voices"
 GDR_Silence_Coalition_Member_Voices_desc:0 "The National Front is a coalition in name only. We will silence independent voices within it, ensuring that all participating parties serve as extensions of the SED."
 GDR_Investigate_the_State_of_the_Berlin_Palace:0 "Investigate the State of the Berlin Palace"
 GDR_Investigate_the_State_of_the_Berlin_Palace_desc:0 "The Berlin Palace might still be of use. We will investigate how bad the damage is and see if something can't be salvaged."
 GDR_The_Foundations_of_State:0 "The Foundations of State"
 GDR_The_Foundations_of_State_desc:0 "A state is more than borders and policies—it is memory, ritual, and myth. We will lay the cultural and ideological foundations necessary for the GDR to endure."
 GDR_Establish_the_Stasi:0 "Establish the Stasi"
 GDR_Establish_the_Stasi_desc:0 "The Ministry for State Security will be established to monitor, protect, and enforce ideological conformity within the Republic."
 GDR_Establish_the_National_Front_Coalition:0 "Establish the National Front Coalition"
 GDR_Establish_the_National_Front_Coalition_desc:0 "To maintain a facade of pluralism, we will formalize the National Front. All member parties will be brought under Party discipline, projecting unity without surrendering control."
 GDR_The_Waldheimer_Prozesse:0 "The Waldheimer Prozesse"
 GDR_The_Waldheimer_Prozesse_desc:0 "The Waldheim trials will root out former fascists and class enemies. Justice will be swift, symbolic, and public—reminding all of the consequences of disloyalty."
 GDR_Ratify_the_Treaty_of_Zgorzelec:0 "Ratify the Treaty of Zgorzelec"
 GDR_Ratify_the_Treaty_of_Zgorzelec_desc:0 "The Treaty of Zgorzelec with Poland solidifies our borders and affirms socialist solidarity."
 GDR_Seek_Concessions:0 "Seek Concessions"
 GDR_Seek_Concessions_desc:0 "We believe that the proposed Treaty of Zgorzelec is too lopsided in favor of Poland. Therefore, we will seek Soviet backing in the hopes of regaining some of our eastern territories."
 GDR_Join_COMECON:0 "Join COMECON"
 GDR_Join_COMECON_desc:0 "Integration with the Council for Mutual Economic Assistance will embed our economy within the socialist bloc. We will benefit from mutual trade, shared planning, and Soviet leadership."
 { COMECON_MEMBERSHIP:0 "COMECON Member"
 { COMECON_MEMBERSHIP_desc:0 "We are a member of the Council for Mutual Economic Assistance."
 GDR_Close_the_Speziallager_Camp:0 "Close the Speziallager Camp"
 GDR_Close_the_Speziallager_Camp_desc:0 "The Speziallager camps have drawn increasing criticism for their inhumane conditions. Closing them will calm the people and demonstrate our commitment to a more just socialist state."
 GDR_The_Issue_of_Unrest:0 "The Issue of Unrest"
 GDR_The_Issue_of_Unrest_desc:0 "Discontent festers beneath the surface of the Republic. Whether it stems from rationing, housing shortages, or political alienation, we must acknowledge the growing unrest before it festers into something more dangerous."
 GDR_The_Carrot_and_Stick:0 "The Carrot & Stick"
 GDR_The_Carrot_and_Stick_desc:0 "In facing internal dissent, we must employ both reform and repression. Offering small concessions while tightening our grip will help lower the dissent we currently experience."
 GDR_Delegate_the_Penal_Code_to_Max_Fechner:0 "Delegate the Penal Code to Max Fechner"
 GDR_Delegate_the_Penal_Code_to_Max_Fechner_desc:0 "Max Fechner, a respected jurist and former SPD member, has a reputation for fairness and legal integrity. Entrusting him with the draft of the penal code will bring legitimacy to our judicial reforms."
 GDR_Enshrine_an_Independent_Judiciary:0 "Enshrine an Independent Judiciary"
 GDR_Enshrine_an_Independent_Judiciary_desc:0 "A truly independent judiciary will serve as a cornerstone of socialist legality, demonstrating to both the population and the world that justice in the GDR is not dictated by political whim."
 GDR_Offer_Concessions_to_Bourgeois_Parties:0 "Offer Concessions to Bourgeois Parties"
 GDR_Offer_Concessions_to_Bourgeois_Parties_desc:0 "By extending modest offers to our coalition partners, we can foster the illusion of pluralism and stability."
 GDR_Sideline_Suspect_Coalition_Members:0 "Sideline Suspect Coalition Members"
 GDR_Sideline_Suspect_Coalition_Members_desc:0 "Some coalition members are not just unreliable, they are potential traitors to the socialist cause. Quietly sidelining them now will prevent trouble later."
 GDR_Ensure_Right_to_Government_Criticism:0 "Ensure Right to Government Criticism"
 GDR_Ensure_Right_to_Government_Criticism_desc:0 "Permitting controlled criticism can paradoxically strengthen the state. We can allow carefully moderated dissent as a pressure valve, while still guarding against any genuine threats."
 GDR_The_Dream_of_a_United_Germany:0 "The Dream of a United Germany"
 GDR_The_Dream_of_a_United_Germany_desc:0 "The notion of German reunification remains a powerful one. By publicly affirming our commitment to peaceful unification, we may win hearts and minds, especially in the West."
 GDR_Purge_Hilde_Benjamin:0 "Purge Hilde Benjamin"
 GDR_Purge_Hilde_Benjamin_desc:0 "Hilde Benjamin is out of line and out of control. We have no choice but to purge her from the Party."
 GDR_Zig_Zagging_to_Socialism:0 "Zig Zagging to Socialism"
 GDR_Zig_Zagging_to_Socialism_desc:0 "The road to socialism is neither straight nor simple. With each shift in policy, we adapt to changing circumstances while keeping our ultimate goal in sight."
 GDR_Begin_Preperations_for_Comrade_Ulbrichts_Birthday:0 "Prepare for Comrade Ulbricht's Birthday"
 GDR_Begin_Preperations_for_Comrade_Ulbrichts_Birthday_desc:0 "As the leader of our republic approaches another year, it is only fitting that we celebrate his vision and leadership with proper revolutionary pageantry."
 GDR_The_German_Workers_Son:0 "The German Worker's Son"
 GDR_The_German_Workers_Son_desc:0 "Ulbricht's story  of humble origins, class consciousness, and unwavering dedication epitomizes the ideal socialist leader. It is a tale that deserves state-sanctioned retelling."
 GDR_The_War_on_Schumacherites:0 "The War on Schumacherites"
 GDR_The_War_on_Schumacherites_desc:0 "The SPD, under the leadership of Kurt Schumacher, continues to poison West German politics with reactionary rhetoric. We must counter this influence and discredit his legacy in the East."
 GDR_Delegate_Penal_Code_Drafting_to_Hilde_Benjamin:0 "Delegate Penal Code Drafting to Hilde Benjamin"
 GDR_Delegate_Penal_Code_Drafting_to_Hilde_Benjamin_desc:0 "Known for her ideological reliability and ruthless efficiency, Hilde Benjamin will ensure the penal code reflects the unyielding character of our socialist state."
 GDR_Aktion_Vermin:0 "Aktion Vermin"
 GDR_Aktion_Vermin_desc:0 "To build socialism, the state must remain vigilant against internal decay. Operation Vermin will identify and neutralize class enemies hiding within the fabric of society."
 GDR_Intensify_Cleansing_of_the_Bourgeois_Parties:0 "Intensify Cleansing of the Bourgeois Parties"
 GDR_Intensify_Cleansing_of_the_Bourgeois_Parties_desc:0 "Our coalition partners cannot be permitted to operate as reactionary strongholds. We will purge them of any elements hostile to socialism."
 GDR_Firmly_Enshrine_a_Partisan_Judiciary:0 "Firmly Enshrine a Partisan Judiciary"
 GDR_Firmly_Enshrine_a_Partisan_Judiciary_desc:0 "The courts must serve the revolution, not abstract notions of 'neutrality.' We will mold the judiciary into a reliable tool of the Party."
 GDR_The_National_Front_of_Democratic_Germany_Program:0 "The National Front of Democratic Germany Program"
 GDR_The_National_Front_of_Democratic_Germany_Program_desc:0 "This program outlines our vision of a socialist, unified Germany and affirms the principles of inter-party collective governance under the SED's guiding hand."
 GDR_Reconstruct_the_Potsdamer_Stadtschloss:0 "Reconstruct the Potsdamer Stadtschloss"
 GDR_Reconstruct_the_Potsdamer_Stadtschloss_desc:0 "Rebuilding the imperial Stadtschloss may seem counterintuitive, but repurposing it for socialist functions can symbolize the triumph of the new over the old."
 GDR_Emphasize_Reconstruction_and_Housing:0 "Emphasize Reconstruction & Housing"
 GDR_Emphasize_Reconstruction_and_Housing_desc:0 "Our people cannot be asked to build socialism while living in ruins. A renewed focus on housing and infrastructure will strengthen both morale and loyalty."
 GDR_Investigate_the_Internal_Zionist_Conspiracy:0 "Investigate the Internal Zionist Conspiracy"
 GDR_Investigate_the_Internal_Zionist_Conspiracy_desc:0 "Some whisper of foreign influence and sabotage. Whether real or manufactured, the threat of Zionist subversion may serve political ends."
 GDR_Establish_Refugee_Resettlement_Commission:0 "Establish Refugee Resettlement Commission"
 GDR_Establish_Refugee_Resettlement_Commission_desc:0 "With millions displaced, we must manage population flows effectively. A formal resettlement commission will allow us to control the demographics of the Republic."
 GDR_Deemphasize_Class_Struggle:0 "De-Emphasize Class Struggle"
 GDR_Deemphasize_Class_Struggle_desc:0 "In this transitional phase, constant appeals to class conflict may do more harm than good. Stability demands a more conciliatory tone, if only temporarily."
 GDR_Tolerate_Small_and_Medium_Level_Businesses:0 "Tolerate Small & Medium Level Businesses"
 GDR_Tolerate_Small_and_Medium_Level_Businesses_desc:0 "Rather than force premature collectivization, we will tolerate certain private enterprises... as long as they remain politically obedient and economically useful."
 GDR_The_Problem_of_Social_Spending:0 "The Problem of Social Spending"
 GDR_The_Problem_of_Social_Spending_desc:0 "Resources are finite, and generosity is expensive. We must begin difficult conversations about the sustainability of our social programs under current conditions."
 GDR_Provide_Incentives_for_Voluntary_Agricultural_Collectivization:0 "Provide Incentives for Agricultural Collectivization"
 GDR_Provide_Incentives_for_Voluntary_Agricultural_Collectivization_desc:0 "Rather than compel compliance, we will encourage collectivization through incentives in the hopes of winning the countryside with persuasion rather than force."
 GDR_Delay_Militarization_Efforts:0 "Delay Militarization Efforts"
 GDR_Delay_Militarization_Efforts_desc:0 "Though defense remains important, hasty militarization could drain resources and provoke Western aggression. For now, we focus elsewhere."
 GDR_Stabilizing_the_Republic:0 "Stabilizing the Republic"
 GDR_Stabilizing_the_Republic_desc:0 "With new institutions in place and resistance declining, the time has come to stabilize and consolidate our socialist state."
 GDR_Enshrine_the_Cult_of_the_Spanish_Civil_War:0 "Enshrine the Cult of the Spanish Civil War"
 GDR_Enshrine_the_Cult_of_the_Spanish_Civil_War_desc:0 "The Spanish struggle remains a mythic beacon for leftists across the world. We will enshrine its legacy as a moral rallying point for socialists worldwide."
 GDR_A_Deal_with_the_Church:0 "A Deal with the Church"
 GDR_A_Deal_with_the_Church_desc:0 "Open war with the Church may be unwise. A quiet arrangement, acknowledging their limited role while ensuring our dominance, is a pragmatic alternative."
 GDR_Consider_Increasing_Church_Taxes:0 "Consider Increasing Church Taxes"
 GDR_Consider_Increasing_Church_Taxes_desc:0 "The Church has long enjoyed financial privileges. Increasing their taxes may weaken their influence and fund more practical projects."
 GDR_Eliminate_Regional_Government:0 "Eliminate Regional Government"
 GDR_Eliminate_Regional_Government_desc:0 "Federalism is a relic of bourgeois decentralization. We must centralize power fully in Berlin to ensure unity and efficiency."
 GDR_The_Law_on_Maternal_and_Child_Protection_and_Womens_Rights:0 "Adopt Women's Rights Legislation"
 GDR_The_Law_on_Maternal_and_Child_Protection_and_Womens_Rights_desc:0 "True socialism must include gender equality. This law will guarantee protections for women and children, reaffirming our state's commitment to progressive social policy."
