 SOV_pres_char_stalin:0 "Joseph Stalin"
 SOV_pres_char_stalin_ranked_ui:0 "[SOV_pres_stalin_ranked_name]"
 SOV_pres_char_stalin_r2:0 "§YJoseph Stalin§!"
 SOV_pres_char_stalin_r1:0 "Joseph Stalin"
 SOV_pres_char_stalin_r0:0 "§gJoseph Stalin§!"
 SOV_pres_char_stalin_faction_ui:0 "[SOV_pres_stalin_faction_name]"
 SOV_pres_char_stalin_leader_tt:0 "§YJoseph Stalin§!\nThe Vozhd. Every seat around this table exists at his pleasure.\n\n§YHow to read the panel§!\nNames: §Ygold§! full member, white candidate member, §ggrey§! not a member of the Politburo.\nFactions: §iStalinist Old Guard§!, §4Technocrats§!, §0Security Organs§!, §6Party Moderates§!, §uThe Army§!.\nHover over a portrait for his faction, standing and traits."
 SOV_pres_char_stalin_tt:0 "§YJoseph Stalin§!\nThe Vozhd. Every seat around this table exists at his pleasure.\n\nFaction: [SOV_pres_stalin_faction_name]\nPolitburo: [SOV_pres_stalin_rank_name]\nRelationship with the leader: [?SOV_pres_stalin_relation|+0]"
 SOV_pres_char_malenkov:0 "Georgy Malenkov"
 SOV_pres_char_malenkov_ranked_ui:0 "[SOV_pres_malenkov_ranked_name]"
 SOV_pres_char_malenkov_r2:0 "§YGeorgy Malenkov§!"
 SOV_pres_char_malenkov_r1:0 "Georgy Malenkov"
 SOV_pres_char_malenkov_r0:0 "§gGeorgy Malenkov§!"
 SOV_pres_char_malenkov_faction_ui:0 "[SOV_pres_malenkov_faction_name]"
 SOV_pres_char_malenkov_leader_tt:0 "§YGeorgy Malenkov§!\nBack in the Secretariat since 1948, he is busy destroying the Leningrad group.\n\n§YHow to read the panel§!\nNames: §Ygold§! full member, white candidate member, §ggrey§! not a member of the Politburo.\nFactions: §iStalinist Old Guard§!, §4Technocrats§!, §0Security Organs§!, §6Party Moderates§!, §uThe Army§!.\nHover over a portrait for his faction, standing and traits."
 SOV_pres_char_malenkov_tt:0 "§YGeorgy Malenkov§!\nBack in the Secretariat since 1948, he is busy destroying the Leningrad group.\n\nFaction: [SOV_pres_malenkov_faction_name]\nPolitburo: [SOV_pres_malenkov_rank_name]\nRelationship with the leader: [?SOV_pres_malenkov_relation|+0]\n\n§YApparatchik§!: A creature of the party machine who knows every file and every favour.\n§YPlanner§!: Thinks in tonnes, quotas and five-year horizons."
 SOV_pres_char_beria:0 "Lavrentiy Beria"
 SOV_pres_char_beria_ranked_ui:0 "[SOV_pres_beria_ranked_name]"
 SOV_pres_char_beria_r2:0 "§YLavrentiy Beria§!"
 SOV_pres_char_beria_r1:0 "Lavrentiy Beria"
 SOV_pres_char_beria_r0:0 "§gLavrentiy Beria§!"
 SOV_pres_char_beria_faction_ui:0 "[SOV_pres_beria_faction_name]"
 SOV_pres_char_beria_leader_tt:0 "§YLavrentiy Beria§!\nRuns the atomic bomb project. He lost the security ministries in 1946, and Abakumov's MGB is hunting his people.\n\n§YHow to read the panel§!\nNames: §Ygold§! full member, white candidate member, §ggrey§! not a member of the Politburo.\nFactions: §iStalinist Old Guard§!, §4Technocrats§!, §0Security Organs§!, §6Party Moderates§!, §uThe Army§!.\nHover over a portrait for his faction, standing and traits."
 SOV_pres_char_beria_tt:0 "§YLavrentiy Beria§!\nRuns the atomic bomb project. He lost the security ministries in 1946, and Abakumov's MGB is hunting his people.\n\nFaction: [SOV_pres_beria_faction_name]\nPolitburo: [SOV_pres_beria_rank_name]\nRelationship with the leader: [?SOV_pres_beria_relation|+0]\n\n§YChekist§!: Formed in the security organs. Sees plots everywhere, and is sometimes right.\n§YIndustrialist§!: Built factories from nothing, whatever the cost."
 SOV_pres_char_khrushchev:0 "Nikita Khrushchev"
 SOV_pres_char_khrushchev_ranked_ui:0 "[SOV_pres_khrushchev_ranked_name]"
 SOV_pres_char_khrushchev_r2:0 "§YNikita Khrushchev§!"
 SOV_pres_char_khrushchev_r1:0 "Nikita Khrushchev"
 SOV_pres_char_khrushchev_r0:0 "§gNikita Khrushchev§!"
 SOV_pres_char_khrushchev_faction_ui:0 "[SOV_pres_khrushchev_faction_name]"
 SOV_pres_char_khrushchev_leader_tt:0 "§YNikita Khrushchev§!\nFirst Secretary of Ukraine. Stalin will call him to Moscow before the year is out.\n\n§YHow to read the panel§!\nNames: §Ygold§! full member, white candidate member, §ggrey§! not a member of the Politburo.\nFactions: §iStalinist Old Guard§!, §4Technocrats§!, §0Security Organs§!, §6Party Moderates§!, §uThe Army§!.\nHover over a portrait for his faction, standing and traits."
 SOV_pres_char_khrushchev_tt:0 "§YNikita Khrushchev§!\nFirst Secretary of Ukraine. Stalin will call him to Moscow before the year is out.\n\nFaction: [SOV_pres_khrushchev_faction_name]\nPolitburo: [SOV_pres_khrushchev_rank_name]\nRelationship with the leader: [?SOV_pres_khrushchev_relation|+0]\n\n§YPopulist§!: Talks to workers in their own language.\n§YAgrarian§!: Has opinions about maize, kolkhozes and the harvest."
 SOV_pres_char_bulganin:0 "Nikolai Bulganin"
