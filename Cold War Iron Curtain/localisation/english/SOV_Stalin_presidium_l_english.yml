 SOV_pres_char_kaganovich_leader_tt:0 "§YLazar Kaganovich§!\nThe iron commissar of heavy industry and the railways.\n\n§YHow to read the panel§!\nNames: §Ygold§! full member, white candidate member, §ggrey§! not a member of the Politburo.\nFactions: §iStalinist Old Guard§!, §4Technocrats§!, §0Security Organs§!, §6Party Moderates§!, §uThe Army§!.\nHover over a portrait for his faction, standing and traits."
 SOV_pres_char_kaganovich_tt:0 "§YLazar Kaganovich§!\nThe iron commissar of heavy industry and the railways.\n\nFaction: [SOV_pres_kaganovich_faction_name]\nPolitburo: [SOV_pres_kaganovich_rank_name]\nRelationship with the leader: [?SOV_pres_kaganovich_relation|+0]\n\n§YIndustrialist§!: Built factories from nothing, whatever the cost.\n§YBrutal§!: Signs lists without reading them."
 SOV_pres_char_molotov:0 "Vyacheslav Molotov"
