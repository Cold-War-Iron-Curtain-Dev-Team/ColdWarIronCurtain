 SOV_pres_char_mikoyan_leader_tt:0 "§YAnastas Mikoyan§!\nRemoved from the Ministry of Foreign Trade in March 1949. The great survivor.\n\n§YHow to read the panel§!\nNames: §Ygold§! full member, white candidate member, §ggrey§! not a member of the Politburo.\nFactions: §iStalinist Old Guard§!, §4Technocrats§!, §0Security Organs§!, §6Party Moderates§!, §uThe Army§!.\nHover over a portrait for his faction, standing and traits."
 SOV_pres_char_mikoyan_tt:0 "§YAnastas Mikoyan§!\nRemoved from the Ministry of Foreign Trade in March 1949. The great survivor.\n\nFaction: [SOV_pres_mikoyan_faction_name]\nPolitburo: [SOV_pres_mikoyan_rank_name]\nRelationship with the leader: [?SOV_pres_mikoyan_relation|+0]\n\n§YTrader§!: Knows what things cost, abroad and at home.\n§YPlanner§!: Thinks in tonnes, quotas and five-year horizons."
