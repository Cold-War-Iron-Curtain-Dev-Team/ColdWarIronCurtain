 SOV_pres_char_molotov_leader_tt:0 "§YVyacheslav Molotov§!\nRemoved from the Foreign Ministry in March 1949; his wife Polina was arrested in January.\n\n§YHow to read the panel§!\nNames: §Ygold§! full member, white candidate member, §ggrey§! not a member of the Politburo.\nFactions: §iStalinist Old Guard§!, §4Technocrats§!, §0Security Organs§!, §6Party Moderates§!, §uThe Army§!.\nHover over a portrait for his faction, standing and traits."
 SOV_pres_char_molotov_tt:0 "§YVyacheslav Molotov§!\nRemoved from the Foreign Ministry in March 1949; his wife Polina was arrested in January.\n\nFaction: [SOV_pres_molotov_faction_name]\nPolitburo: [SOV_pres_molotov_rank_name]\nRelationship with the leader: [?SOV_pres_molotov_relation|+0]\n\n§YDiplomat§!: Has sat across the table from Churchill and Truman.\n§YIdeologue§!: Guardian of doctrinal purity."
