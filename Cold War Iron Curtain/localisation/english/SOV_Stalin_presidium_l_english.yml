 SOV_pres_char_bulganin_leader_tt:0 "§YNikolai Bulganin§!\nA political marshal overseeing the armed forces and defence industry.\n\n§YHow to read the panel§!\nNames: §Ygold§! full member, white candidate member, §ggrey§! not a member of the Politburo.\nFactions: §iStalinist Old Guard§!, §4Technocrats§!, §0Security Organs§!, §6Party Moderates§!, §uThe Army§!.\nHover over a portrait for his faction, standing and traits."
 SOV_pres_char_bulganin_tt:0 "§YNikolai Bulganin§!\nA political marshal overseeing the armed forces and defence industry.\n\nFaction: [SOV_pres_bulganin_faction_name]\nPolitburo: [SOV_pres_bulganin_rank_name]\nRelationship with the leader: [?SOV_pres_bulganin_relation|+0]\n\n§YApparatchik§!: A creature of the party machine who knows every file and every favour.\n§YSoldier§!: Wore the uniform through the war and still thinks like a front commander."
