raid_type_indo_raid_armory: "Raid Armory"
raid_type_indo_raid_armory_desc: "A raiding party breaks into an enemy arsenal and carries off what it can. Small arms and support gear are always taken. From the §YSixth Phase§! a success also brings back artillery and trucks; from the §YFifth Phase§! a critical success adds armor and mechanized equipment."
raid_type_indo_raid_outpost: "Raid Fortified Outpost"
raid_type_indo_raid_outpost_desc: "Infiltrators strike an enemy blockhouse, wrecking its fortifications and slowing their repair."
raid_type_indo_raid_airfield: "Raid Air Base"
raid_type_indo_raid_airfield_desc: "Sappers slip onto an enemy airfield to destroy aircraft shelters and runways."
raid_type_indo_raid_port: "Raid Port"
raid_type_indo_raid_port_desc: "Frogmen and sappers sabotage an enemy port, crippling its docks."
raid_type_indo_raid_supply_hub: "Raid Supply Hub"
raid_type_indo_raid_supply_hub_desc: "A strike on an enemy supply depot that starves the troops it feeds."
raid_type_indo_raid_city: "Raid City"
raid_type_indo_raid_city_desc: "A daring attack on an enemy-held town that shakes the confidence of its government."
raid_type_indo_raid_tactical_bombing: "Tactical Bombing Raid"
raid_type_indo_raid_tactical_bombing_desc: "Tactical bombers strike enemy troop concentrations in the target region."
raid_type_indo_raid_barrel_bombing: "Barrel Bombing Raid"
raid_type_indo_raid_barrel_bombing_desc: "Transport aircraft roll crude explosives onto the target region, hitting troops and civilians alike."
raid_type_indo_raid_napalm: "Napalm Bombing Raid"
raid_type_indo_raid_napalm_desc: "Napalm turns the target region into a firestorm, burning out troops and the villages that hide them. Only possible while a §YLimited War§! is being fought."
raid_type_indo_raid_white_phosphorus: "White Phosphorus Bombing Raid"
raid_type_indo_raid_white_phosphorus_desc: "White phosphorus munitions blanket the target region. Only possible while a §YLimited War§! is being fought."
raid_type_indo_raid_defoliant: "Defoliant Spraying Raid"
raid_type_indo_raid_defoliant_desc: "Aircraft strip the jungle cover from the target region, exposing enemy bases and trails. Only possible while a §YLimited War§! is being fought."
raid_type_indo_raid_gas: "Gas Bombing Raid"
raid_type_indo_raid_gas_desc: "Chemical bombs are dropped on the target region: mustard gas, or nerve agents once they have been developed. Only possible while a §YLimited War§! is being fought."
indochina_raid_front_bonus_TT: "§GFront-line target:§! the state is part of an active §YLimited War§!, so this raid's §YVictory Points§! are §Gdoubled§!."
raid_category_indochina_air_raids: "Indochina Air Raids"
tooltip_raid_category_indochina_air_raids: "§HIndochina air raids§! \nBombing and chemical strikes on states contested in the Indochina War. Raids on states caught up in a §YLimited War§! are worth double."
raid_category_header_indochina_air_raids: "Indochina Air Raids"

