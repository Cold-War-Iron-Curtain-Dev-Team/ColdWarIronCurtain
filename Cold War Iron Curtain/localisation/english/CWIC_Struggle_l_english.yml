INDOCHINA_STRUGGLE_1_EFFECTS: "Vietnam is unified under communist rule, ending decades of colonial and foreign interference."
INDOCHINA_STRUGGLE_2_EFFECTS: "South Vietnam triumphs, unifying the nation under anti-communist leadership."
INDOCHINA_STRUGGLE_3_EFFECTS: "France maintains control through a federal structure, preserving its colonial influence."
INDOCHINA_STRUGGLE_4_EFFECTS: "Vietnam is shattered into competing states, its unity forever lost."
INDOCHINA_STRUGGLE_5_EFFECTS: "A fragile peace emerges as North and South reunite under a negotiated settlement."
INDOCHINA_STRUGGLE_6_EFFECTS: "Through a carefully orchestrated reunification process, North Vietnam annexes South Vietnam and transforms into a unified democratic state, reshaping the region's future under American support."
INDOCHINA_STRUGGLE_7_EFFECTS: "The Kuomintang achieves victory, bringing China's nationalist vision to Vietnam."
INDOCHINA_STRUGGLE_8_EFFECTS: "The Geneva Conference will bring an end to the First Indochina War through diplomatic means."
INDOCHINA_STRUGGLE_9_EFFECTS: "The conflict rages on without end, consuming Indochina in perpetual war."
INDOCHINA_STRUGGLE_10_EFFECTS: "Complete state collapse leaves Indochina in ruins, with no victor and no peace."
