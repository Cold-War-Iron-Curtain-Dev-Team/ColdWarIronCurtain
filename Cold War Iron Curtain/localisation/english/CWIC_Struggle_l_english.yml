###Struggle Diplomacy Decisions###
Indochina_Struggle_ProInd_Backchannel_Talks: "Back-Channel Talks with the Viet Minh"
Indochina_Struggle_ProInd_Backchannel_Talks_desc: "Quiet contacts through intermediaries in Hong Kong and Paris may find common ground with Hanoi where open diplomacy cannot. Every conversation that happens across a table is one that does not happen across a battlefield."
Indochina_Struggle_ProInd_International_Appeal: "Appeal to the International Community"
Indochina_Struggle_ProInd_International_Appeal_desc: "Vietnam's cause deserves a hearing beyond Indochina. Petitions to the United Nations and sympathetic capitals will build pressure for a negotiated settlement and establish our government as a responsible voice for peace."
Indochina_Struggle_ProInd_Prisoner_Exchange: "Prisoner Exchange Programme"
Indochina_Struggle_ProInd_Prisoner_Exchange_desc: "An exchange of prisoners is a gesture both sides can accept without losing face. Families reunited today make the case for a ceasefire better than any communique."
Indochina_Struggle_ProInd_Denounce_Infiltration: "Denounce Northern Infiltration"
Indochina_Struggle_ProInd_Denounce_Infiltration_desc: "The infiltration of cadres and weapons across our frontier cannot go unanswered. A public denunciation will harden our position - and harden the conflict with it."
Indochina_Struggle_ProInd_Propose_Peace_Conference: "Propose an International Peace Conference"
Indochina_Struggle_ProInd_Propose_Peace_Conference_desc: "Tensions have cooled far enough that a general settlement is within reach. We will formally ask Paris to convene an international conference on the future of Indochina. The decision to negotiate is ultimately theirs - but a public proposal is difficult to ignore."
Indochina_Struggle_Com_Peace_Overtures: "Extend Peace Overtures"
Indochina_Struggle_Com_Peace_Overtures_desc: "The struggle can be advanced at the negotiating table as well as in the jungle. Signalling openness to talks costs us nothing and wins sympathy abroad."
Indochina_Struggle_Com_Call_For_Elections: "Call for National Elections"
Indochina_Struggle_Com_Call_For_Elections_desc: "Demand that the future of Vietnam be settled by the ballot. Whether or not the colonialists agree, the call itself lowers the temperature and puts the burden of refusal on them."
Indochina_Struggle_Com_Release_Prisoners: "Release Captured Soldiers"
Indochina_Struggle_Com_Release_Prisoners_desc: "Releasing captured French and Vietnamese soldiers demonstrates discipline and confidence. It is a small price for a large propaganda victory - and a step back from the brink."
Indochina_Struggle_Com_Intensify_Struggle: "Intensify the Armed Struggle"
Indochina_Struggle_Com_Intensify_Struggle_desc: "The Party calls for renewed revolutionary vigor. Mobilize the villages and press the enemy on every front."
Indochina_Struggle_ProFra_Ceasefire_Lines: "Propose Local Ceasefire Lines"
Indochina_Struggle_ProFra_Ceasefire_Lines_desc: "Local commanders may agree on lines of demarcation where the shooting stops, even without a general settlement. Each quiet sector is a foundation for a wider peace."
Indochina_Struggle_ProFra_Court_Opinion: "Court International Opinion"
Indochina_Struggle_ProFra_Court_Opinion_desc: "The war in Indochina is increasingly unpopular at home and abroad. Presenting France as the party seeking an honorable settlement will ease pressure on the government and open doors in Geneva and Washington."
Indochina_Struggle_ProFra_Amnesty_Programme: "Offer Amnesty Programmes"
Indochina_Struggle_ProFra_Amnesty_Programme_desc: "Guerrillas who lay down their arms will be offered amnesty and resettlement. Every fighter who comes in from the jungle is one fewer to fight - and proof that peace is possible."
Indochina_Struggle_ProFra_Show_Of_Force: "Stage a Show of Force"
Indochina_Struggle_ProFra_Show_Of_Force_desc: "A demonstration of the Expeditionary Corps' strength will remind our enemies that France remains master of the battlefield. It will also remind everyone that the war is far from over."
Indochina_Struggle_ProEth_Petition_The_Crown: "Petition the Crown Domain"
Indochina_Struggle_ProEth_Petition_The_Crown_desc: "The highlands answer to the Emperor, not to Saigon. A formal petition to the Crown Domain restates that distinction before anyone in the delta forgets it, and asks that our lands be kept out of the fighting."
Indochina_Struggle_ProEth_Assert_Customary_Law: "Assert Customary Law"
Indochina_Struggle_ProEth_Assert_Customary_Law_desc: "Our villages are governed by their own courts and their own elders, as they were long before the French came and long before Hanoi drew its maps. Codifying that claim now makes it far harder to erase later."
Indochina_Struggle_ProEth_Highland_Truce: "Negotiate a Highland Truce"
Indochina_Struggle_ProEth_Highland_Truce_desc: "Both armies want our trails and neither wants our loyalty. A truce that keeps the columns out of our valleys costs us nothing and buys the villages a harvest."
Indochina_Struggle_ProEth_Levy_The_Villages: "Levy the Villages"
Indochina_Struggle_ProEth_Levy_The_Villages_desc: "Call up the partisans from every hamlet. If the lowlanders will not respect our autonomy, they will respect the men who hold the passes."
Indochina_Struggle_KMT_Court_The_Chinese_Quarter: "Court the Chinese Quarter"
Indochina_Struggle_KMT_Court_The_Chinese_Quarter_desc: "Cholon's merchants finance half the trade of the south, and their sympathies are not yet spoken for. Their money and their networks are worth more to us than another battalion."
Indochina_Struggle_KMT_Appeal_To_Taipei: "Appeal to Taipei"
Indochina_Struggle_KMT_Appeal_To_Taipei_desc: "The Generalissimo has not forgotten the divisions that walked south rather than surrender. Recognition from Taipei would turn a refugee army into a government."
Indochina_Struggle_KMT_Tax_The_River_Trade: "Tax the River Trade"
Indochina_Struggle_KMT_Tax_The_River_Trade_desc: "Every junk on the Mekong passes through ground we hold. A modest levy, collected politely, funds the administration and reminds the delta who is collecting."
Indochina_Struggle_KMT_Requisition_The_Delta: "Requisition the Delta"
Indochina_Struggle_KMT_Requisition_The_Delta_desc: "Take the rice, the boats and the young men by force. It will feed the army through the season and it will cost us every friend we have made."
Indochina_Struggle_Propose_Conference_TT: "The §YDe-escalatory Phase§! must have more than §C300 points§!"
Indochina_Struggle_Diplomacy_Cooldown_TT: "Our camp has §Yrecently made a diplomatic overture§!. Another initiative so soon would ring hollow."
