l_english:
 SOV_Reperation_Payments: "Soviet Reparation Payments"
 HUN_Embrace_Forced_Industrialization: "Embrace Forced Industrialization"
 HUN_Embrace_Forced_Industrialization_desc: "The Industry lays still mostly ruined from the Second World War. To achieve faster rebuilding and jumpstarting the Industry again, it was decided to adopt the Forced Industrialization method that was done by the Soviets before the Second World War."
 HUN_Imprisonment_of_Laszlo_Rajk: "Imprisonment of Laszlo Rajk"
 HUN_Imprisonment_of_Laszlo_Rajk_desc: "Laszlo Rajk was thought to be one of the most loyal members of the Hungarian Communist Party, but for a while now he has been viewed as a Threat to Rakosi, as well as the Soviets. Accusing him of Collaboration with Enemies of Socialism, he was now put on trial and arrested afterwards!"
 HUN_Hungarian_Peoples_Army: "Hungarian People's Army"
 HUN_Hungarian_Peoples_Army_desc: "The Hungarian Armed Forces have seen Better days. Most of our former soldiers were killed during the War, or taken as POWs. As bad as this sounds, this gives the Goverment a opportunity to build up the new People's Army from the Ground up and giving it swift reforms."
 HUN_Collectivize_Agriculture: "Collectivize Agriculture"
 HUN_Collectivize_Agriculture_desc: "Our Agriculture sector lacks efficiency, with many of the Farms and Fields working alone with different owners. We cannot let it stand this way. Using soviet practices, the Agriculture Industry will be collectivized and put into State property. From then on they will be put together into huge Collective Farms set up by the Government"
 HUN_Force_Peasants_into_Collectives: "Force Peasants into Collectives"
 HUN_Force_Peasants_into_Collectives_desc: "The Workers of our nation, still new to Socialism, reufse to join the Collectives that are all around the nation and are supposed to help the workers. Leaving us no choice, they will be forced to join their local communes. They will eventually start enjoying their membership."
 HUN_Fund_Heavy_Industry_Investments_with_Agricultural_Profits: "Fund Heavy Industry Investments with Agricultural Profits"
 HUN_Fund_Heavy_Industry_Investments_with_Agricultural_Profits_desc: "Having gained some profits from our Agricultural Collectivization, we can now use these funds to fund Heavy Industry that was almost entirely ruined during the Second World War. Using this new Heavy Industry, our new Army can be equipped with new and quality Equipment!"
 HUN_Expand_the_Budapest_Industrial_Hub: "Expand the Budapest Industrial Hub"
 HUN_Expand_the_Budapest_Industrial_Hub_desc: "The Budapest Industrial hub is the center of Industry of our capital, maybe even our entire nation. Or at least it used to be. Most of the factories here remain largely left abandoned and rotting away. With the nations current situation, Industry is much needed. The Industrial hub will be expanded and those old factories brought back to life!"
 HUN_Connect_to_Eastern_Bloc_Railways: "Connect to Eastern Bloc Railways"
 HUN_Connect_to_Eastern_Bloc_Railways_desc: "If we want to establish trade with the rest of the Eastern Block, it is Important that our railways get connected with theirs, allowing for easier exchange of goods. All over the nation new railways will be established, in preparation for Eastern Block trade."
 HUN_Kickstart_Cement_Production: "Kickstart Cement Production"
 HUN_Kickstart_Cement_Production_desc: "Even if some homes were already restored after being bombed in the Second World War, a large portion still remain destroyed. That is due to the nations lack of Cement. To solve this problem and to expand the Industry, it was decided by the Government that two new Industrial Parks would be built, with the task of producing cement."
 HUN_Ration_Food: "Ration Food"
 HUN_Ration_Food_desc: "Just like Poland, we are suffering as well from Food shortage. Farmers are trying to pump out new food for the hungry workers but it simply isn't enough yet. Until the Situation starts getting better, Food Rationing will be introduced."
 HUN_Expand_the_State_Owned_Housing_Industry: "Expand the State Owned Housing Industry"
 HUN_Expand_the_State_Owned_Housing_Industry_desc: "The Workers need homes. And we wish to expand our grip on the Housing Industry. Having nationalized already a large portion of it in the last few years, with this new goal of giving the Workers more homes, we can further Nationalize the rest of the remaining Independent Housing Industry."
 HUN_Electrifiy_the_Households: "Electrify the Households"
 HUN_Electrifiy_the_Households_desc: "Electricity became a core stone in todays Households. Workers do not want to sit under the candlelight, they want to sit under a glowing lightbulb, that would brighten up a whole room. To fulfill that demand though, power plants are required. Our current power plants lack the power to fulfill the demands, but with a few new power plants the demand should be more than fulfilled, giving the workers light and electricity for their Household items!"
 HUN_Concentrate_Our_Efforts_on_Urban_Accomodation: "Concentrate Our Efforts on Urban Accommodation"
 HUN_Concentrate_Our_Efforts_on_Urban_Accomodation_desc: "Many workers began moving into Urban areas from the countryside, seeing how the Urban areas are getting developed and more houses are being built, as well as new jobs in Industry are getting created. We welcome the new Urban population and will concentrate on making sure they are Accommodated!"
 HUN_Set_Prices_to_Aid_Working_Families: "Set Prices to Aid Working Families"
 HUN_Set_Prices_to_Aid_Working_Families_desc: "Due to the High Inflation, many Workers and their Families have been suffering, stopping them from buying food and items that are needed to keep them healthy. To help the working families, price limits will be set, meaning shops can only charge the Working Families until a certain limit."
 HUN_Patriotic_Loans_to_Pay_Reperations: "Patriotic Loans to Pay Reparations"
 HUN_Patriotic_Loans_to_Pay_Reperations_desc: "At the end of the Second World War, our liberation from the Fascist Goverment came at a price. Being part of the Axis and having invaded Russia with the Nazi Germany, we are forced to pay the Soviet Union Large Reparations for the damages done. Currently we simply are missing the money to pay them off, but through a new program called Patriotic Loans, we should be able to pay off the Soviet Reparations"
 HUN_Achieve_Early_Industrialization_Goals: "Achieve Early Industrialization Goals"
 HUN_Achieve_Early_Industrialization_Goals_desc: "Having worked hard, we are already seeing the first fruits of our labor, as the Goals we set for our Early Industrialization are being rapidly achieved and Hungary is becoming a Industrialized nation just like the rest of the Eastern Block. We cannot stop working hard now though. There's still a long way ahead of issues that we have to tackle!"
 HUN_A_Hungarian_New_Economic_Policy: "A Hungarian New Economic Policy"
 HUN_A_Hungarian_New_Economic_Policy_desc: "Unorthodox by Soviet standards, it was proposed to enact a New Hungarian Economic Policy. Or NEP for short. What? No the name is completely original!...."
 HUN_Reduce_the_Burden_of_Farmers: "Reduce the Burden of Farmers"
 HUN_Reduce_the_Burden_of_Farmers_desc: "The Farmers are facing a huge burden, having to battle the food shortage and other things is not an easy task. As part of our NEP, we will do our best to help the farmers and ease their burdens, hopefully making their life a bit easier."
 HUN_Allow_Cultivators_to_Leave_Cooperatives: "Allow Cultivators to Leave Cooperatives"
 HUN_Allow_Cultivators_to_Leave_Cooperatives_desc: "Even though we have forced many Peasants into Collectives, Cultivators are in our eyes a completely different case. They are the ones that help harvest the corn and other things. Machines that make the farmers life easier! Even though most of the items that the Collectives own can't leave their section, we'll make a exception for Cultivators."
 HUN_Encourage_Limited_Private_Activity: "Encourage Limited Private Activity"
 HUN_Encourage_Limited_Private_Activity_desc: "Private Activity and Private property are generally a big taboo in the Socialist world, but in our case, Private Activity would help us combat the Inflation. As much as as Moscow will disagree with us, we'll just push this through anyway"
 HUN_Lower_Food_Prices: "Lower Food Prices"
 HUN_Lower_Food_Prices_desc: "With the Inflation being slightly more under control, the Workers are starting to be able to spend more again. But it still isn't as low as we'd like. For now to help heal the economy more, the prices of food will be reduced."
 HUN_Increase_the_Standard_of_Living: "Increase the Standard of Living"
 HUN_Increase_the_Standard_of_Living_desc: "With lower food prices, we can also improve another aspect of our Workers struggle in these times. By Focusing on increasing the standards of living, it will entice the Workers of our nation to spend more into the local shops to support locally made products."
 HUN_Purge_Kadar_and_his_Ilk: "Purge Kadar and his Ilk"
 HUN_Purge_Kadar_and_his_Ilk_desc: "Kadar was once a rising leader of the Hungarian communist party. He even served as the Minister of Interior until recently, as he had resigned due to poor health. Or so he claims. Rakosi has put out an order for Kadar's arrest, as well as his close Followers. Power play, to help Rakosi secure more Power in the party."
 HUN_Denounce_Religous_Instruction: "Denounce Religious Instruction"
 HUN_Denounce_Religous_Instruction_des: "Religion was always viewed as a bad thing in the Socialist world. For It divides people more than it brings them together, and was shown that it caused horrible wars in the past. In a society where all of us are equal, the Workers don't need Religion. The only person they need to put their faith in is Socialism!"
 HUN_Remove_Cults_from_Schools: "Remove Cults from Schools"
 HUN_Remove_Cults_from_Schools_desc: "During the Fascist Government, the church was allowed to open Religious cults in schools, trying to indoctrinate the Youth into the Fascist and Religious beliefs. The church couldn't have known though that we'd eventually be in power. To protect the children and Youth from the Clergy, these Cults will be banned and purged from our Socialist Schools!"
 HUN_Dissolve_the_Last_of_the_Clergys_Institution: "Dissolve the Last of the Clergy's Institutions"
 HUN_Dissolve_the_Last_of_the_Clergys_Institution_desc: "It is time to put the final nail in the coffin of Clergy. Their last churches and Institutions will be shut down and dissolved, using them instead for something that will benefit the workers"
 HUN_Incorporate_the_Church_into_the_Regime: "Incorporate the Church into the Regime"
 HUN_Incorporate_the_Church_into_the_Regime_desc: "Of course we could go ahead shut down the Clergy and be done with it. But instead, we could also replace the Clergy Priests that aren't loyal to Socialism with Priest and members who instead are, creating Socialist Christianity! After all, wasn't Jesus the first Socialist?"
 HUN_Promote_the_Golden_Team: "Promote the Golden Team"
 HUN_Promote_the_Golden_Team_desc: "The Golden Team is a Nickname for our national Football team that has lately become one of the most Dominant teams in the nation and on the international Stage. Throught Promoting this team in our nation, we can also show it off as the Superiority of Socialist Men and Women compared to the West."
 HUN_Cultivate_a_Cult_of_Personality: "Cultivate a Cult of Personality"
 HUN_Cultivate_a_Cult_of_Personality_desc: "Ever since Rakosi returned from Exile at the end of the Second World War with the Red Army, it seemed obvious that he would become General Secretary at the end of the Second World War. It was also very obvious that during his time in Exile, he became quite a staunch Stalinist, some calling him Stalin's Best Pupil even. And just like Stalin, Rakosi is establishing his own Cult of Personality."
 HUN_Create_the_State_Protection_Authority: "Create the State Protection Authority"
 HUN_Create_the_State_Protection_Authority_desc: "Just like the Soviets have the NKVD, the East Germans the Stasi and the Czechoslovaks the StB, we have our State Protection Authority, its task being to hunt down dissidents and Traitors to Socialism"
 HUN_Purge_Nazi_Remnants_and_Imperialist_Collaborators: "Purge Nazi Remnants and Imperialist Collaborators"
 HUN_Purge_Nazi_Remnants_and_Imperialist_Collaborators_desc: "With a Proper State Agency established, it's time to purge the remaining Nazi Remnants, their sympathizers and Imperialist Collaborators. With these groups gone, Socialism will be safely entrenched in Hungarian Society!"
 HUN_Open_Forced_Labor_Camps: "Open Forced Labor Camps"
 HUN_Open_Forced_Labor_Camps_desc: "Unlike the Nazis, we aren't just going to walk our prisoners into camps and gas. Instead well put them to work for the Glory of Socialism! This way they will be eventually redeemed for their Crimes against Socialism and will be permitted to return to their daily lives."
 HUN_Encourage_Anti_Semetism: "Encourage Anti-Semitism"
 HUN_Encourage_Anti_Semetism_desc: "How am I gonna explain this one to the UN I have no idea"
 HUN_Prepare_the_Wallenberg_Trials: "Prepare the Wallenberg Trials"
 HUN_Prepare_the_Wallenberg_Trials_desc: "The Wallenberg Trials will be used to prove that the Swedish Diplomat and Architect, who provided safe havens for Hungarian Jews during the Second World War, was in fact kidnapped and killed by a group of former members of the Fascist regimes and Budapest Jews!.....Wait what?"
 HUN_Form_a_Hard_Working_Intelligenista: "Form a Hard Working Intelligentsia"
 HUN_Form_a_Hard_Working_Intelligenista_desc: "Even though most of our Intellectuals fled or were killed during the Second World War, some still remain that are loyal assets to Socialism! These remnants will be united into a Hard Working Intelligentsia, allowing for greater Scientific breakthroughs to be achieved!"
 HUN_Expand_the_AVH_Numbers: "Expand the AVH Numbers"
 HUN_Expand_the_AVH_Numbers: "There always lingers the threat that our enemies could be contacting or finding new members they want to recruit, eventually becoming Powerful enough to overthrow our Socialist Government. That cannot be allowed to happen! The AVH will be instructed to start mass surveillance of any potential threats. Anyone who is deemed suspicious will be surveilled!"
 HUN_Appoint_Imre_Nagy_Prime_Minister: "Appoint Imre Nagy Prime Minister"
 HUN_Appoint_Imre_Nagy_Prime_Minister_desc: "Imre Nagy has been chosen to be Appointed as the new Prime Minister of Hungary. Seen as a reliable partner to Rakosi and loyal to Moscow, the NKVD will surely be pleased with his appointment. Although there are some rumors that Imre Nagy might not be showing us his true colors fully"
 HUN_Amnesty_for_Thought_Criminals: "Amnesty for Thought Criminals"
 HUN_Amnesty_for_Thought_Criminals_desc: "Some of the so called Criminals that are currently serving sentences in Labor Camps or Prisons, are simply there because they did not agree with how Rakosi was ruling the nation. With Imre Nagy now in power though, these people can be set free from their unjust sentence."
 HUN_Annul_AVH_Judiciary_Initiatives: "Annul AVH Judiciary Initiatives"
 HUN_Annul_AVH_Judiciary_Initiatives_desc: "The AVH has had too much freedom under Rakosi, suppressing workers and using mass surveillance as well as many other shady methods to get rid of whoever they deemed as a Traitor to Socialism or a spy. A judiciary will be established for these exact reasons to examining the leaderships of the AVH and if needed, replace them with someone more restrained"
 HUN_Hungarian_Ground_Forces: "Hungarian Ground Forces"
 HUN_Hungarian_Ground_Forces_desc: "The Hungarian Ground Forces are the Backbone of our Army. They are formed from former veteran Socialists that vowed to protect the Socialist Revolution and Partisans that fought the Fascist regime during the Second World War."
 HUN_Soviet_Equipment: "Soviet Equipment"
 HUN_Soviet_Equipment_desc: "Our Armed Forces need guns. That much is obvious. Sadly we currently cannot provide enough Weapons to supply our entire Force, that's why we'll instead get some equipment from the Soviet Union instead!"
 HUN_Political_Commissars: "Political Commissars"
 HUN_Political_Commissars_desc: "Political commissars that were used by the Soviet Union in the Second World War were great helpers in boosting trop Morality and totally did not shoot anyone who dared to try and retreat. Anyway we think they would be a great asset to our Army!"
 HUN_Adopt_the_AK47: "Adopt the AK-47"
 HUN_Adopt_the_AK47_desc: "It's not Fair how just the Soviets get to use the AK-47! The AK-47 is a modern wonder weapon, that is perfect in every aspect one would wish for in a gun. It can be turned in so many different variants from machine guns to snipers! We simply have to get our hands on this weapon!"
 HUN_Soviet_Advisors: "Soviet Advisors"
 HUN_Soviet_Advisors_desc: "While we are at it and are getting those AK-47s we might as well invite some Soviet Advisors as well to our Army. They can observe how our Army is doing and teach us how we could improve our tactics and usage of Weapons!"
 HUN_Hungarian_Air_Defense_Forces: "Hungarian Air Defense Forces"
 HUN_Hungarian_Air_Defense_Forces_desc: "The Hungarian Air Defense Forces are a recently established Branch of our Army that has three simple goals. First, ensuring there are Anti-Air Initiative in place in case of Enemy Air Attacks. Second of all, the development and research of new Anti-Air defense measures. And finally, the possible development of our own Missiles at some point!"
 HUN_Budapest_Anti_Air_Initiative: "Budapest Anti-Air Initiative"
 HUN_Budapest_Anti_Air_Initiative_desc: "To ensure that our Capital Budapest is protected from Air Attacks that happend during the Second World War, the Budapest Anti-Air Initiative was approved, whichs goal is to build Two Anti-Air Weapons in Budapest to help the Army shoot down enemy bombers that are attempting to Bomb us in case of a Western Attack."
 HUN_Rebuild_AA_Infrastructure: "Rebuild AA Infrastructure"
 HUN_Rebuild_AA_Infrastructure_desc: "Much of our AA Infrastructure was destroyed by Allied bombing in the Second World War. Even if this AA Infrastructure is old and outdated, by rebuilding it, we can restore it to full service as well as restore it to fit the current times."
 HUN_Modernize_Anti_Air_Facilities: "Modernize Anti-Air Facilities"
 HUN_Modernize_Anti_Air_Facilities_desc: "Of course now that the new AA Initiatives are constructed and the old Infrastructure restored to full functionality, it's time we also Modernize the AA Facilites. By using the latest technology we can access, our AA Facilites will become something that the west can certainly fear!"
 HUN_Missle_Investments: "Missile Investments"
 HUN_Missle_Investments_desc: "As mentioned before, the Air Defense Forces have also the task of development of our very own Missiles. Although this task will not be a easy one, the results if we were to be Successful would be more than worth it."
 HUN_Hungarian_Peoples_Airforce: "Hungarian People's Air Force"
 HUN_Hungarian_Peoples_Airforce_desc: "The Hungarian Air Force, or as it's now known, Hungarain People's Air Force, is still mostly a Branch of our Army that still has train to Planes that either the Soviets left behind or that are left over from the days of Austria Hungary. Maybe even some Nazi German ones. Anyway the point is that the Air Force desperately needs some Reforms."
 HUN_Expand_Airbases: "Expand Airbases"
 HUN_Expand_Airbases_desc: "To prepare our Air Force for the times when there are Planes that can be flown, we will be needing more Airbases to launch those planes from. That's why we'll be thinking ahead and building said Airbases ahead of time. This way we'll be more prepared in case the West attacks and the Soviet need Airbases for their planes as well"
 HUN_Surplus_Soviet_Lavochkin_LA_9: "Surplus Soviet Lavochkin LA 9"
 HUN_Surplus_Soviet_Lavochkin_LA_9_desc: "Turns out the Soviets left behind some Polish-Soviet Lavochkin LA 9s. And in working conditions as well. Well instead of letting them rust away, they'll be used in our Hungarian Air Force!"
 HUN_Soviet_MiG_15s: "Soviet MiG 15s"
 HUN_Soviet_MiG_15s_desc: "Having found those La 9s, we might as well stick to the Soviet theme and buy some MiG15s off of the Soviets. They should be more than sufficient until we can begin the production of our own Fighters in the near future."
 HUN_Acquire_Mig_21s: "Acquire MiG 21s"
 HUN_Acquire_Mig_21s_desc: "Additionally to the MiG15s, we'll buy some MiG21s from the rest of the Eastern Block. This way we'll fund the Economies of our fellow Socialist nations and gain more planes for our Air Force. It's a win win situation!"
 HUN_Close_Down_the_Camps: "Close Down the Camps"
 HUN_Close_Down_the_Camps_desc: "Imre Nagy has begun to push through some reforms that undo certain laws and branches Rakosi put in place. Such as the Labor Work Camps. He views them as too cruel and instead wants to use different ways of Punishment and Rehabilitation."
 HUN_Engage_in_Talks_with_the_Clergy: "Engage in Talks with the Clergy"
 HUN_Engage_in_Talks_with_the_Clergy_desc: "Next reform Imre wants to push through is achieved by holding talks with the Clergy, the one that Rakosi cracked down harshly on. Imre is trying to come to some sort of Agreement with the Clergy, in which they could continue to operate as long as they tone down on the Anti-Socialist speeches."
 HUN_Seek_Approval_from_Moscow: "Seek Approval from Moscow"
 HUN_Seek_Approval_from_Moscow_desc: "With the recent changes and Reforms, Nagy seeks Approval of Moscow to the changes he made to give them more legitimacy and prove to the rest of the Hardliners that Moscow is fine with Imre going a different way than the usual Orthodox Socialism way."
 HUN_Rehabilitate_Kadar: "Rehabilitate Kadar"
 HUN_Rehabilitate_Kadar_desc: "Kader was jailed by Rakosi on false and made up charges. The goal of Rakosi was to get rid of Kadar and thus strenghten his Power in the Goverment. With Rakosi now gone though, Kadar can be once again released and Rehabilitated back into the Party."
 HUN_Organize_a_Popular_Patriotic_Front: "Organize a Popular Patriotic Front"
 HUN_Organize_a_Popular_Patriotic_Front_desc: "Imre Nagy has decided to organize the so called Popular Patriotic Front. What Goals the Front has so far remain unknown, but it is speculated that it's a part of a plan to get rid of Moscow's influence."
 HUN_Nagys_Falling_Out_From_Moscow: "Nagys Falling Out From Moscow"
 HUN_Nagys_Falling_Out_From_Moscow_desc: "Nagy has attempted to coup the Hungarain Goverment and to pull out of Warsaw Pact! Thankfully the Soviets quickly stepped in and removed Nagy from power, replacing him with Kadar. Sadly though, until the Situation gets stable, the Soviets will remain occupying the Nation."
 HUN_Give_Extended_Powers_to_the_AVH: "Give Extended Powers to the AVH"
 HUN_Give_Extended_Powers_to_the_AVH_desc: "As seen by Imre Nagys coup against the Soviet Union and how be brought the Revolutionary Socialist to power, no one in the party can be trusted for sure. The AVH will be immidiately given Extend Powers to get rid of any remaining followers of Nagy and ensure Kadar's rule is safe."
 HUN_Reinstate_the_Cult_of_Personality: "Reinstate the Cult of Personality"
 HUN_Reinstate_the_Cult_of_Personality_desc: "During the Coup, Nagy has also removed the Cult of Personality that was implemented by Rakosi. That decision is now being reversed and the Cult of Personality is being restored. Only difference is that now the Cult is for Kadar insted of Rakosi."
 HUN_Force_Collectivization: "Force Collectivization"
 HUN_Force_Collectivization_desc: "Next step of removing the Reforms Imre made, is to remove the last traces of the NEP and enforce Forced Collectivization just like the Soviet Union. With Forced Collectivization, we'll get rid of the last bits of Privately owned property and put it all firmly into the hands of the state!"
 HUN_Reduce_Investments_in_Consumer_Spendings: "Reduce Investments in Consumer Spending"
 HUN_Reduce_Investments_in_Consumer_Spendings_desc: "Money is currently needed for our future plans, and a big part of it is spent on Investments in Consumer Spending. In our opinion these Investments are a waste and are borderline Capitalism. If our Workers want to spend their money, they can decide to do that themselves without us having to pay them for it!"
 HUN_Role_Out_Rakosi: "Rule Out Rakosi"
 HUN_Role_Out_Rakosi_desc: "Some would think that obviously Rakosi should simply be reinstated as leader of the country, but due to Imre Nagy coming to power in the first place due to him, Moscow will surely prefer if Kadar, a fresh face that proved his loyalty by notifying Moscow, deserves the chance to prove himself as a General Secretary!"
 HUN_The_Next_Stage_of_Liberalization: "The Next Stage of Liberalization"
 HUN_The_Next_Stage_of_Liberalization_desc: "Surprisingly, Imre Nagys gamble paid off! Hungary was able to pull out of the Warsaw Pact and the Soviets backed down! With them out of the way, Imre can begin further continue his Liberalization of the Society and Goverment, under Revolutionary Socialism!"
 HUN_Assure_Neutrality_of_Hungary: "Assure Neutrality of Hungary"
 HUN_Assure_Neutrality_of_Hungary_desc: "To be sure the Soviets don't change their minds and decide to invade us anyway, because we for example try to join NATO, we will announce that Hungary is from now a Neutral Country and will not be joining either Side of the Cold War."
 HUN_End_Church_Suppression: "End Church Suppression"
 HUN_End_Church_Suppression_desc: "One of our first reforms will be the end of the Church Suppression. One should, after all, not be not hunted just for one's beliefs. Sadly Rakosi could not see that."
 HUN_Emulate_Tito: "Emulate Tito"
 HUN_Emulate_Tito_desc: "Tito's Revolutionary Socialism is the perfect example of how Socialism can work without being Oppressive and Accepting of Religion. Not to mention how they actually represent the workers throught Communes and Trade Unions! We'll embrace the ways of Tito's socialism and Emulate it in our own country!"
 HUN_Mass_Political_Amnesty: "Mass Political Amnesty"
 HUN_Mass_Political_Amnesty_desc: "There are still many so called Prisoners that are locked up because Rakosi didn't agree with their Political Views. With us in power though, these Prisoners will be giver Amnesty and released, some even Rehabilitated back into our new Party!"
 HUN_Abolish_the_AVH: "Abolish the AVH"
 HUN_Abolish_the_AVH_desc: "The AVH, ever since it's founding has only been used to Opress the workers, to hunt down anyone the MDP found to be a supposed threat. Such a Organization is now needed and not welcome under our Leadership and thus they will be disbanded and Abolished!"
 HUN_Legalize_Opposition_Parties: "Legalize Opposition Parties"
 HUN_Legalize_Opposition_Parties_desc: "Opposition Parties are a core part of Socialist Democracy. Throught Opposition parties, the workers have a choice of voting someone else in in case our Party no longer acts in their interest. Effective from now, Opposition Parties are once again Legalized!"
 HUN_Reject_Collectivization_of_Agriculture: "Reject Collectivization of Agriculture"
 HUN_Reject_Collectivization_of_Agriculture_desc: "Collectivization, while in theory a good idea, it was extremely poorly executed in Marxist-Leninist Socialism. Just like Tito, we'll Reject Collectivization all together and instead allow the Revolutionary Socialist way of economics."
 HUN_Allow_Larger_Private_Plots: "Allow Larger Private Plots"
 HUN_Allow_Larger_Private_Plots_desc: "Private Plots are farms the Workers make themselves thier own Fruits vegetables. And there's nothing wrong with them wanting to expand their Private Plots!"
 HUN_Outreach_to_Yugoslavia: "Outreach to Yugoslavia"
 HUN_Outreach_to_Yugoslavia_desc: "There sadly aren't many Revolutionary Socialist Nations that we could reach out to. But fortunately there is one. And that one is our neighbor Yugoslavia! We already emulated Tito so we might as well Reach out to him and Establish Diplomatic Relations!"
 HUN_Agricultural_Modernization: "Agricultural Modernization"
 HUN_Agricultural_Modernization_desc: "With Agricultural Collectivization gone, we'll instad now invest into Modernization of Agricultural Equipment as many Farmers still use cattle and Horses to plow their fields. This cannot remain in the 20th century!"
 HUN_Empower_Worker_Councils: "Empower Worker Councils"
 HUN_Empower_Worker_Councils_desc: "Workers Councils that have been established during the Student Uprising and helped us calm the Students and protestors down have been ever since then been cooperating with us closely. Seeing how effective they are, Imre Nagy proposed that they should be empowered to further herlp the Goverment to correctly represent the workers."
 HUN_Increase_Western_Trade: "Increase Western Trade"
 HUN_Increase_Western_Trade_desc: "With our nation no longer being tied to the Eastern Block, our Citizens can finally get their hands on Western made goods from trade with Western countries. Trade with the West is also sure to help us Improve our GDP and Economy in general"
 HUN_Study_Yugoslavian_Economic_System: "Study Yugoslavian Economic System"
 HUN_Study_Yugoslavian_Economic_System_desc: "The Yugoslavian Economic System that combines Socialims with aspects of Capitalism is a very uncommon way of doing Socialist economics. But for Yugoslavia it seems that it's working out and their economy grows through it. As we begin to Diplomatically grow closer to Yugoslavia, we should Study the system to see if we can implent some aspects of it into our own Economic system"
 HUN_Rehabilitate_Liberal_Communists: "Rehabilitate Liberal Communists"
 HUN_Tolerate_the_FKgP: "Tolerate the FKgP"
 HUN_Tolerate_the_FKgP_desc: "The Independent Smallholders, Agrarian Workers and Civic Party nown mostly by its acronym FKgP, is a political party in Hungary. Representing the interests of landed peasants along with some poor peasants and urban middle class, it advocated for land reform and democratization. Under the Rakosi Goverment, they were not tolerated at all and very often supressed. But with our Revolutionary Socialism in Power, Imre Nagy announced that the FKgP would be tolerated and even cooperated with."
 HUN_Seek_Foriegn_Funding: "Seek Foreign Funding"
 HUN_Seek_Foriegn_Funding_desc: "As we aim to transform our Economy and invest into multiple new Projects, we need more funding as we are currently lacking enough ourselves. To solve this issue, we will seek funding from a Foreing country. The West will likely be more than eager to contribute."
 HUN_Constitutional_Reform: "Constitutional Reform"
 HUN_Constitutional_Reform_desc: "The Constitution used by the Communists was very rigged to support Marxism Marxist-Leninism and to stick to Orthodox Socialim. That Constitution no longer fits the nature of our party though and thus it will be Reformed to be more Democratic, as well as adding some laws and Policies the Stalinists didn't bother to include"
 HUN_Embrace_Socialist_Self_Management: "Embrace Socialist Self Management"
 HUN_Embrace_Socialist_Self_Management_desc: "As we learned from Tito and Imre Nagy, the way of Socialist Self Management is much more efficient that Collectivization and State Planned Industry could ever be. This will be the Economic model that we will embrace, keeping the Socialist spirit while adding some Capitalist flavor to it."
 HUN_End_the_One_Party_State: "End the One Party State"
 HUN_End_the_One_Party_State_desc: "A demand the Protestors put forth at the very beginning of the Uprising, where they set off the whole Liberalization of Hungary, was the end of the One Party State that Rakosi kept up for so long. Imre Nagy was more than happy to support this motion, officially ending the One Party State in Hungary!"
 HUN_Allow_Limited_Capitalist_Businesses: "Allow Limited Capitalist Businesses"
 HUN_Allow_Limited_Capitalist_Businesses_desc: "With our reforms nearing th complete Decollectivization, one of the last steps in this effort is to allow a Limited number of Capitalist Businesses to open their shops in our nation. The Population is already eager to see which Western Companies will be the first to open it's doors in Hungary"
 HUN_Complete_the_Decollectivization: "Complete the Decollectivization"
 HUN_Complete_the_Decollectivization_desc: "After a long fought battler, it's time to put the final nail in the coffin of Collectivization. Hungary no longer needs to follow the flawed Economic Policy used and enforced by Stalinists, instead it can choose it's own Economic path!"
 HUN_Kadars_Rule: "Kadar's Rule"
 HUN_Kadars_Rule_desc: "With Rakosi out of the question and with Soviet backing, Kadar was appointed as the new Genreal Secretary of the Hungarian Communist Party. Kadar with his so called Goulash Communism. Kadar plans to achieve imposed policies with the goal to create high-quality living standards for the people of Hungary coupled with economic reforms. These reforms fostered a sense of well-being and relative cultural freedom in Hungary thanks to Goulash Communism."
 HUN_Form_a_Committee_to_Reform_the_Economy: "Form a Committee to Reform the Economy"
 HUN_Form_a_Committee_to_Reform_the_Economy_desc: "One of the main Goal of Goulash Communism is to create high-quality living standards for the people of Hungary and to show that traitor Imre Nagy that our Marxist-Leninist is fine as it is. And doesn't need to be overthrown by some foolish Protestors."
 HUN_Agree_to_Recollective_Agriculture: "Agree to Recollective Agriculture"
 HUN_Agree_to_Recollective_Agriculture_desc: "The newly established Committee for the Reformation of our economy, has proposed that we Agree to using the model of Recollective Agriculture, which would mean that the Collectives have much more say on what happens with the Agricultural Sector of the Economy."
 HUN_Gain_Hardliner_Support: "Gain Hardliner Support"
 HUN_Gain_Hardliner_Support_desc: "Since the Uprising, the party has been still somewhat split from the shock of Nagy's betrayal and are very suspicious of what Kadar plans for the future of Hungary. To re-establish party unity, we will attempt to gain Hardliner Support as they make up a major part of the Hungarian Communist Party. With their support, Kadar will be able to focus on his reforms without having to worry about the Party revolting against him."
 HUN_Abolish_Compulsory_Quotas: "Abolish Compulsory Quotas"
 HUN_Abolish_Compulsory_Quotas_desc: "One of the first proposals arrived from the Committee for the Reformation of our Economy, was to abolish the Compulsory Quotas. Kadar is more than eager to accept this proposal as Quotas were often proved to not actually be effective and just resulted in huge amount of Corruption."
 HUN_Strengthen_the_Hungarian_Socialist_Workers_Party: "Strengthen the Hungarian Socialist Workers Party"
 HUN_Strengthen_the_Hungarian_Socialist_Workers_Party_desc: "Having gained support from the Hardliners, restoring a large part of Party unity, there still remains for Kadar to also Strengthen his Powerbase in the rest of the Hungarian Socialist Workers Party. With them reeled in as well, the Goverment is ready to focus on their one single united goal. Punishing Nagy for his betrayal!"
 HUN_Incoporate_Former_AVH_Agents_into_the_Interior_Ministry: "Incorporate Former AVH Agents into the Interior Ministry"
 HUN_Incoporate_Former_AVH_Agents_into_the_Interior_Ministry_desc: "The AVH Agents were the true heroes of stopping the Rioters from getting rid of Communism in Hungary. Bravely holding off the violent Traitors from capturing Radio stations at first, as well as holding the line until the reinforcements from the Soviet Union arrived that forced that Traitor Nagy to flee to the Yugoslavian Embassy."
 HUN_Incentives_for_Collective_Agriculture: "Incentives for Collective Agriculture"
 HUN_Incentives_for_Collective_Agriculture_desc: "The next step of reforms according to the Committee, is to start providing Incentives for Collective Agriculture as this form of farming hasn't been yet adopted by the rest of the rular regions of the country. But with these Incentives that support the farmers and show off Collective Farming is worth it, should quickly change those stubborn farmers mind."
 HUN_Reassure_Moscow_of_our_Attentions: "Reassure Moscow of our Attentions"
 HUN_Reassure_Moscow_of_our_Attentions_desc: "Kadar is very much aware that as much as he's been working on restoring Socialist rule, the Soviets are still paranoid about the possibility that Hungary might try to leave the Warsaw Pact again as soon as the Soviets cancel the Occupation. But the Soviets need not to worry, for Kadar will Reassure them of our Attentions!"
 HUN_Execute_Nagy: "Execute Nagy"
 HUN_Execute_Nagy_desc: "With Stability restored to the Hungarian Communist Party, it's time to chop off the snakes head that is Imre Nagy. Ever since the Uprising and the Soviet Invasion, he has been staying in the Yugoslavian Embassy, where he thinks he is safe from us. Little does he know how wrong he is."
 HUN_Purge_Liberal_Party_Members: "Purge Liberal Party Members"
 HUN_Purge_Liberal_Party_Members_desc: "If there is one thing that we learned from the Uprising that threw Hungary into Political Turmoil, is that you simply cannot trust Liberals.Not even Liberal Party members as they may backstab you in moments notice. Purging them out of the party is the only logical option."
 HUN_Track_Down_FKgP_Supporters: "Track Down FKgP Supporters"
 HUN_Track_Down_FKgP_Supporters_desc: "The FKgP is a bunch of Centrists that don't appreciate Communism, instead having sided with Imre Nagy during the Uprising. Ever since his failure and his death, they have been hiding underground from us. AVH will be thus tasked with tracking the last remaining members down."
 HUN_Allow_Substantial_Private_Flocks: "Allow Substantial Private Flocks"
 HUN_Allow_Substantial_Private_Flocks_desc: "As much as we dislike the Idea of Private property, it was proven through the Hungarian NEP, that allowing as small number of Private Flocks is good for the economy. With this in mind, we will Allow for people to own Substantial Private Flocks, as long as they are approved by us first."
 HUN_Stimulate_Intra_Bloc_Tourism: "Stimulate Intra Bloc Tourism"
 HUN_Stimulate_Intra_Bloc_Tourism_desc: "Tourism is during Summer time a very Important topic, as all from the Eastern Block, Families and Tourists arrive in our nation to visit our lakes and cool off from the hot summer sun. And yet the Tourism could be even better. By starting a campaign to Stimulate Intra Bloc Tourism through Investments, we'll attract even more Tourists!"
 HUN_Encourage_Cooperation_Between_Public_and_Private_Farms: "Encourage Cooperation Between Public and Private Farms"
 HUN_Encourage_Cooperation_Between_Public_and_Private_Farms_desc: "Private and Public Farms mostly stay in their own separate territories without interacting much, if at all with eachother. Of course we could just seize the Private Farms and turn them into state property, but we'd be no better than Rakosi then and even might cause another Uprising. Instead, we'll promote Cooperation Between these two kinds of Farmers and thus increase output and efficiency!"
 HUN_Declare_a_Successful_Agricultural_Collectivization: "Declare a Successful Agricultural Collectivization"
 HUN_Declare_a_Successful_Agricultural_Collectivization_desc: "Finally after many reforms by us and the Committee, Kadar has finished his Agricultural Collectivization Reforms, turning our nations Farms into prosperous and Successful Agricultural Miracles!"

 HUN_requires_revolution_tt: "Available after the 1956 Hungarian Revolution"

 #EVENTS
 Rakosi.0.t: "The 1949 Hungarian People's Republic Constitution"
 Rakosi.0.d: "Our constitution, as it stands, is horribly out dated. Even if the workers revolution had not liberated us, by continental standards our constitution has been lacking for years.\n\nYet we can't simply start from no where. While we could pull from the great Hungarian Hero of the Workers Revolution Bela Kun, we don't live in the 1920's anymore, and a modern communist state has requirements and considerations even a hero like him couldn't possibly consider.\n\nYet, there is a source we were able to pull from, the Soviet constitution. As an established, successful communist state they've spent years having to adapt and implement socialism into a functional form, so what better example is there? While not terribly inventive, copying over most of the elements within the Soviet constitution will solve our immediate needs, and allow us to better situate ourselves in an ever changing Europe.\n\nAfter all, we can always amend our new constitution when the need arises..."
 Rakosi.0.a: "Forward, under the banner of Marx-Engels-Lenin-Stalin!"

 Rakosi.2.t: "[GetNewspaperHeader] Declaration of the Hungarian People's Republic"
 Rakosi.2.d: "With great fanfare in the East, and lack of surprise from the west, communist rule in Hungary has officially begun. While effectively a member of the Soviet Bloc in all but name.  Despite the democratic election of prime minister Zoltán Tildy, it seems the Soviet Union would not tolerate a liberal government on it's front lines with NATO in the emerging Cold War.\n\nHaving intervened with force, the downfall of Tildy has lead to the rise of Mátyás Rákosi and his new communist government. While speculation is rife, American observers believe such a forceful coup in Hungary was a direct response to America's role in the Greek Civil War, however the most likely answer is that the Soviet Union seeks to further homogonize it's rapidly expanding sphere of influence. Whatever the case, the international community can only wait and see what the new Hungarian government will do..."
 Rakosi.2.a: "The Last of the Domino Fall..."
 Rakosi.2.b: "Long Live the People's Republic"