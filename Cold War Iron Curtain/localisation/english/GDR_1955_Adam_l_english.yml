l_english: 

 GDR_Prime_Minister_Wilhelm_Adam: "Prime Minister Wilhelm Adam"
 GDR_Prime_Minister_Wilhelm_Adam_desc: "Wilhelm Adam has been elected as our next Prime Minister; we should legitimize his ascension with a formal induction ceremony."
 GDR_Useful_Idiots_No_More: "Useful Idiots No More"
 GDR_Useful_Idiots_No_More_desc: "It is time to make our intentions clear; we seek the rehabilitation of the German nation, and to do so, will take control of the state apparatus and do what is necessary to achieve our goals."
 GDR_Reverse_Military_Purges_of_Former_Wehrmacht_Members: "Reverse the Wehrmacht Purges"
 GDR_Reverse_Military_Purges_of_Former_Wehrmacht_Members_desc: "Though we understand the reasoning behind the purges, the inconvenient truth is that our best soldiers and commanders are former members of the Wehrmacht. We should work to integrate them into Volksarmee, instead."
 GDR_Rehabilitate_Members_of_the_League_of_German_Officers: "Rehabilitate Members of the League of German Officers"
 GDR_Rehabilitate_Members_of_the_League_of_German_Officers_desc: "The League of German Officers was an anti-Nazi organization for German soldiers created by General Walther Kurt von Seydlitz-Kurzbach. We should integrate as many members of this organization as we can into our ranks."
 GDR_Sideline_Spanish_Civil_War_Veterans: "Sideline Spanish Civil War Veterans"
 GDR_Sideline_Spanish_Civil_War_Veterans_desc: "Our focus is on the soldiers who have fought for Germany, not those who went off to adventure in Spain."
 GDR_Decry_Western_Cultural_Decadence: "Decry Western Cultural Decadence"
 GDR_Decry_Western_Cultural_Decadence_desc: "Look to the West and all you will see is the stagnation of the German nation, it is disgraceful! We must remind our people that our values are what defend against this increasing decadence."
 GDR_Stack_the_Stasi: "Stack the Stasi"
 GDR_Stack_the_Stasi_desc: "To secure the cooperation of the people and the government agencies, we'll make sure that the Stasi is staffed with only the most loyal of men."
 GDR_Reapproriate_Imperial_Symbols: "Reapproriate Imperial Symbols"
 GDR_Reapproriate_Imperial_Symbols_desc: "German history is thousands of years old, much longer than Wilhelm II's megalomaniac reign or Hitler's destructive regime. We cannot allow the proud symbols of the German nation to be discarded just because of the short, unpleasant reigns of these men."
 GDR_The_Polish_Opportunity: "The Polish Opportunity"
 GDR_The_Polish_Opportunity_desc: "Poland is currently dealing with a wave of social unrest. We might just be able to use their misfortunes to regain some of the rightfully German land lost after the War."
 GDR_Request_Seydlitz_to_be_Repatriated: "Request Repatriation of Seydlitz"
 GDR_Request_Seydlitz_to_be_Repatriated_desc: "General Walther Kurt von Seydlitz-Kurzbach has been through two World Wars, the Battle of Stalingrad, and survived collaboration with the USSR against Hitler. We need this man in our military."
 GDR_Appoint_Seydlitz_as_Marshal_of_the_German_Democratic_Republic: "Appoint Seydlitz as Marshal of the GDR"
 GDR_Appoint_Seydlitz_as_Marshal_of_the_German_Democratic_Republic_desc: "Now that von Seydlitz-Kurzbach has been repatriated and rehabilitated, it is time to formally appoint him as Marshall of the GDR."
 GDR_Review_the_Expropriation_of_Industry: "Review the Expropriation of Industry"
 GDR_Review_the_Expropriation_of_Industry_desc: "As ''reparations'' for Hitler's war, much of our industry has been shipped to the Soviet Union for their use. We must find a way to reverse this."
 GDR_Reinstate_Former_Nazi_Era_Bureacrats: "Reinstate Former Nazi-Era Bureacrats"
 GDR_Reinstate_Former_Nazi_Era_Bureacrats_desc: "There is much to be said about the Nazi regime, but we cannot deny the efficiency of their state apparatus. Those that we deem worthy and rehabilitated enough to serve the GDR will be put to good use."
 GDR_Repair_the_Potsdamer_Stadtschloss: "Repair the Potsdamer Stadtschloss"
 GDR_Repair_the_Potsdamer_Stadtschloss_desc: "The Potsdam City Palace was once the winter residence for HRE electors, Prussian kings, and German emperors. Sadly, the War has left this once-proud symbol of Germany in ruins. We must restore it as we have restored Germany!"
 GDR_For_the_Preservation_of_Germany: "For the Preservation of Germany"
 GDR_For_the_Preservation_of_Germany_desc: "The 20th century has been cruel to Germany; we have lost our land, countless lives, and our national pride. No matter what befalls us in the future, the independence of the German nation must be preserved."
 GDR_Commeorate_Operation_Valkyrie: "Commeorate Operation Valkyrie"
 GDR_Commeorate_Operation_Valkyrie_desc: "Operation Valkyrie was a bold plan to assassinate Adolf Hitler and purge the Nazi leadership. Though it ultimately failed, those who risked and gave their lives for the salvation of Germany deserve to be remembered."
 GDR_Promote_Small_Business: "Promote Small Business"
 GDR_Promote_Small_Business_desc: "Small businesses have proven to be the economic strength of many great nations. The more we have, the stronger the German state!"
 GDR_Reconcile_with_the_EKD: "Reconcile with the EKD"
 GDR_Reconcile_with_the_EKD_desc: "The Evangelical Church and the government have not had the best relationship in the past decade. It is time to reconcile and work with them for the good of the German people."
