l_english:
 USA_CONGRESS_SPEAKER_TT:0 "§Y[SPEAKER_TITLE]§!\n§gSpeaker of the House of Representatives§!\n-------------------------------------\n[GetUSACongressSpeakerDescription]"
 USA_CONGRESS_SPEAKER_UNASSIGNED:0 "Unassigned"
 USA_CONGRESS_SPEAKER_UNASSIGNED_DESC:0 "The House has no recognised Speaker. The officeholder will appear here once a governing majority has been established."
 USA_CONGRESS_VP_VACANT_DESC:0 "The vice presidency is vacant. No officeholder is available to preside over the Senate or cast its deciding vote."
 USA_CONGRESS_VP_UNASSIGNED_DESC:0 "The vice president has not been identified for this administration."
 USA_CONGRESS_VP_GEORGE_H_W_BUSH_DESC:0 "A Texas Republican with experience in Congress, diplomacy and intelligence, George H. W. Bush combines an international outlook with an extensive network inside his party. His approach favours experienced administrators, strong alliances and negotiation."
 USA_CONGRESS_VP_JACK_KEMP_DESC:0 "A New York Republican and former professional football player, Jack Kemp champions lower taxes, economic growth and a wider base for his party. His energetic advocacy of supply-side economics accompanies an interest in expanding opportunity in America's cities."
 USA_CONGRESS_VP_JOE_BIDEN_DESC:0 "A Delaware Democrat with a background in law, Joe Biden brings experience in the Senate's judicial and foreign-policy debates. His political style emphasises personal relationships, working-class concerns and direct engagement with fellow legislators."
 USA_CONGRESS_VP_BOB_DOLE_DESC:0 "A Kansas Republican and wounded Second World War veteran, Bob Dole combines conservative fiscal views with a practical approach to legislation. His command of Senate negotiations and willingness to bargain across party lines make him an influential congressional partner."
 USA_CONGRESS_VP_NANCY_KASSEBAUM_DESC:0 "A Kansas Republican, Nancy Kassebaum represents her party's moderate tradition. Her work on education, public health and foreign affairs reflects a preference for careful negotiation and cooperation across the aisle."
 USA_CONGRESS_VP_BILL_CLINTON_DESC:0 "An Arkansas Democrat with experience in state government, Bill Clinton presents himself as a pragmatic reformer. Education, economic development and the modernisation of government form the centre of his effort to connect Democratic priorities with voters seeking practical results."
 USA_CONGRESS_VP_AL_GORE_DESC:0 "A Tennessee Democrat with a background in journalism and congressional service, Al Gore takes a particular interest in technology, environmental protection and national security. His policy-minded approach seeks to connect scientific change with the country's long-term economic needs."
 USA_CONGRESS_VP_LLOYD_BENTSEN_DESC:0 "A Texas Democrat, businessman and Second World War veteran, Lloyd Bentsen brings a moderate southern outlook to national politics. His experience in finance and congressional bargaining makes him a useful bridge between business interests and his party's legislative programme."
 USA_CONGRESS_VP_TED_KENNEDY_DESC:0 "A Massachusetts Democrat, Edward Kennedy is a leading advocate of civil rights, healthcare and organised labour. His national prominence and command of legislative bargaining give the liberal wing of his party a determined voice in the administration."
 USA_CONGRESS_VP_PAUL_LAXALT_DESC:0 "A Nevada Republican with experience as both governor and senator, Paul Laxalt is a prominent western conservative. He favours limited federal government and close personal cooperation with political allies, drawing on relationships built in state and national office."
 USA_CONGRESS_VP_BILL_BRADLEY_DESC:0 "A New Jersey Democrat and former professional basketball player, Bill Bradley approaches public office through detailed policy work. Tax reform, economic opportunity and the responsibilities of government are central concerns in his vision of national renewal."
 USA_CONGRESS_VP_LINDY_BOGGS_DESC:0 "A Louisiana Democrat, Lindy Boggs combines deep knowledge of congressional politics with an interest in women's equality and economic opportunity. Her patient, personal approach to negotiation allows her to work with legislators from different regions and ideological traditions."
 USA_CONGRESS_VP_ANN_RICHARDS_DESC:0 "A Texas Democrat with experience in public finance and state government, Ann Richards is known for forceful public speaking and an interest in political reform. She argues for accountable government and broader participation by people traditionally excluded from public office."
 USA_CONGRESS_VP_PHIL_CRANE_DESC:0 "An Illinois Republican and former history professor, Philip Crane is a committed advocate of limited government, lower taxation and free trade. His political identity rests on the conservative movement's effort to reshape his party and national economic policy."
 USA_CONGRESS_VP_GERALDINE_FERRARO_DESC:0 "A New York Democrat and former prosecutor, Geraldine Ferraro brings experience in criminal justice and the House of Representatives. Her priorities include economic security, equal opportunity and a stronger place for women in national political life."
 USA_CONGRESS_VP_PATRICK_LUCEY_DESC:0 "A Wisconsin Democrat with experience in state government and diplomacy, Patrick Lucey favours public investment and administrative reform. His work on education and economic development reflects the progressive tradition of his home state."
 USA_CONGRESS_VP_WALTER_CRONKITE_DESC:0 "A veteran broadcast journalist, Walter Cronkite brings the public standing of a familiar national newsman to an unfamiliar political office. His career covering war, elections and major national events gives him a perspective shaped by public communication rather than party organisation."
 USA_CONGRESS_VP_HUGH_CAREY_DESC:0 "A New York Democrat and Second World War veteran, Hugh Carey brings experience in Congress and state executive office. His reputation rests particularly on fiscal management and the difficult negotiations required to sustain public services during financial crisis."
 USA_CONGRESS_VP_MILTON_SHAPP_DESC:0 "A Pennsylvania Democrat, engineer and electronics businessman, Milton Shapp combines private-sector experience with an interest in public services. His political career reflects a belief that government investment and economic development can work alongside organised labour."
 USA_CONGRESS_VP_DAN_QUAYLE_DESC:0 "An Indiana Republican, Dan Quayle represents a younger generation of conservative legislators. Support for national defence, private enterprise and restrained federal spending places him firmly within his party's conservative coalition."
 USA_CONGRESS_VP_WALTER_MONDALE_DESC:0 "A Minnesota Democrat with experience in law and the Senate, Walter Mondale belongs to his state's liberal political tradition. Civil rights, social welfare and close cooperation with organised labour shape his approach to government and executive responsibility."
 USA_CONGRESS_VP_JIM_HUNT_DESC:0 "A North Carolina Democrat, Jim Hunt places education and economic development at the centre of his public programme. His approach seeks to combine improvements in public services with business investment and the modernisation of the southern economy."
 USA_CONGRESS_VP_JERRY_BROWN_DESC:0 "A California Democrat, Jerry Brown combines environmental concerns and an interest in new ideas with an emphasis on fiscal restraint. His independent political style often challenges established expectations within his own party as well as those of his opponents."
 USA_CONGRESS_VP_TOM_RIDGE_DESC:0 "A Pennsylvania Republican and Vietnam veteran, Tom Ridge brings congressional experience and a pragmatic political outlook to the administration. His public career emphasises economic opportunity, national service and cooperation beyond the boundaries of his party."
 USA_CONGRESS_VP_JOHN_LAFALCE_DESC:0 "A New York Democrat, lawyer and Army veteran, John LaFalce brings extensive congressional experience to the administration. His work on banking and small business places economic policy, financial oversight and the needs of local enterprise among his principal concerns."
 USA_CONGRESS_VP_DIANE_FEINSTEIN_DESC:0 "A California Democrat with experience in municipal government, Dianne Feinstein brings an emphasis on administrative competence, public safety and practical negotiation. Her political style favours detailed oversight and compromise across party lines."
 USA_CONGRESS_VP_ROBERT_BYRD_DESC:0 "A West Virginia Democrat, Robert Byrd is closely associated with the Senate's rules, traditions and control of public expenditure. His influence rests on procedural knowledge, sustained attention to his home state's interests and a formidable understanding of congressional politics."
 USA_CONGRESS_VP_MO_UDALL_DESC:0 "An Arizona Democrat and former professional basketball player, Morris Udall is a prominent advocate of conservation and government reform. His legislative career combines western interests with a liberal outlook and a reputation for humour and collegiality."
 USA_CONGRESS_VP_RICHARD_LUGAR_DESC:0 "An Indiana Republican with experience in municipal government and the Senate, Richard Lugar takes a particular interest in foreign affairs and national security. His approach stresses detailed policy work, strong international relationships and cooperation across party lines."
 USA_CONGRESS_VP_MIKE_GRAVEL_DESC:0 "An Alaska Democrat, Mike Gravel is known for challenging the conduct of the Vietnam War and defending the public's access to information. His independent outlook places civil liberties, congressional accountability and criticism of entrenched power at the centre of his politics."
 USA_CONGRESS_VP_EDWARD_BROOKE_DESC:0 "A Massachusetts Republican, lawyer and Second World War veteran, Edward Brooke represents the party's moderate wing. Civil rights, housing and urban affairs figure prominently in his effort to build a broader and more inclusive Republican coalition."
 USA_CONGRESS_VP_NEWT_GINGRICH_DESC:0 "A Georgia Republican and former history professor, Newt Gingrich favours an assertive conservative strategy for reshaping national politics. Party organisation, political communication and a challenge to established congressional leadership define his approach to power."
 USA_CONGRESS_VP_ADLAI_STEVENSON_III_DESC:0 "An Illinois Democrat from a prominent political family, Adlai Stevenson III brings experience in public finance and the Senate. His interests in economic policy and foreign affairs accompany a measured political style shaped by public service."
 USA_CONGRESS_VP_ALBEN_BARKLEY_DESC:0 "A Kentucky Democrat and veteran Senate leader, Alben Barkley is a forceful defender of the New Deal tradition. His warmth, oratory and long experience in congressional bargaining help connect the White House with legislators from different wings of the Democratic Party."
 USA_CONGRESS_VP_RICHARD_NIXON_DESC:0 "A California Republican with experience in both houses of Congress, Richard Nixon built his national standing through anti-communism and an interest in foreign affairs. His disciplined political organisation and attention to electoral strategy make him an active partner in the administration."
 USA_CONGRESS_VP_LYNDON_B_JOHNSON_DESC:0 "A Texas Democrat and experienced Senate leader, Lyndon Johnson is known for personal persuasion and intricate legislative bargaining. His command of congressional relationships allows him to negotiate between southern conservatives, northern liberals and the priorities of the executive branch."
 USA_CONGRESS_VP_HUBERT_HUMPHREY_DESC:0 "A Minnesota Democrat and former Minneapolis mayor, Hubert Humphrey is an energetic advocate of civil rights, organised labour and social reform. His optimistic public style accompanies a persistent effort to turn liberal goals into workable congressional legislation."
 USA_CONGRESS_VP_SPIRO_AGNEW_DESC:0 "A Maryland Republican with experience in local and state government, Spiro Agnew is an outspoken advocate of law and order. His confrontational public style gives a prominent voice to voters angered by protest movements, cultural change and liberal political institutions."
 USA_CONGRESS_VP_GERALD_FORD_DESC:0 "$Gerald_Ford_TT$"
 USA_CONGRESS_VP_NELSON_ROCKEFELLER_DESC:0 "A New York Republican with extensive experience in state government, Nelson Rockefeller represents an activist, moderate tradition within his party. He favours ambitious public programmes, strong national defence and an international outlook informed by business and public service."
