l_english:
 ##Focuses
 PRC_50s_Launch_The_Crossing_Yangtze_River_Campaign_Interim:0 "渡江战役"
 PRC_50s_Launch_The_Crossing_Yangtze_River_Campaign_Interim_desc:0 "我们的最后号召已经开始。我们在淮海战役中消灭了敌人，在辽沈战役中摧毁了敌人在锦州周围的力量，并统一了我们在东北的大部分部队。现在是我们收复祖国、解放工人、农民和无产阶级的时候了！前进吧，兄弟们！"
 PRC_50s_Accept_Governance_Across_The_Yangtze_River:0 "接受国民党统治"
 PRC_50s_Accept_Governance_Across_The_Yangtze_River_desc:0 "为了与我们达成停战，国民政府代理主席李宗仁提出了“长江分治”的停战构想，即以长江为界，中共政府和国民政府在原地停战。为了让人民和国家休养生息，并在将来一举消灭国民党反动派，我们只能接受这一条件。"
 PRC_50s_The_Final_Push:0 "我们争取解放的最后冲刺"
 PRC_50s_The_Final_Push_desc:0 "我们将清除剩余的叛徒杂碎，在同一面旗帜下重新统一我们伟大的祖国。斗争已经很长，但最终的胜利就在眼前。中国将重新崛起，团结而不可战胜。"
 PRC_50s_March_To_The_Southwest:0 "向西南行进"
 PRC_50s_March_To_The_Southwest_desc:0 "借助势头，解放军现在将目标瞄准崎岖分裂的西南地区。这些地区仍由反动残余势力控制，仍然是国家完全统一的障碍。地形严酷，后勤困难，抵抗力量顽强，但该地区的战略价值不容小觑。\n\n我们的指挥官正在准备一次通过群山、河谷和有争议城镇的协调推进。每前进一步都将确保关键的补给路线，团结当地支持者，并加强我们在战役南线的掌控。这次行军将充满挑战——但对于完成革命事业至关重要。"
 PRC_50s_Liberate_Kunming:0 "解放昆明"
 PRC_50s_Liberate_Guangxi:0 "解放广西"
 PRC_50s_Reach_South_China_Sea:0 "到达南中国海"
 PRC_50s_The_Three_District_Revolution:0 "三民区革命"
 PRC_50s_Peacefully_Liberate_Urumqi_Campaign:0 "和平解放乌鲁木齐"
 PRC_50s_Begin_Establishment_of_PCCX:0 "建立新疆生产建设兵团"
 PRC_50s_Integrate_the_three_districts_government:0 "整合三区政府"
 PRC_50s_Unite_The_National_Bourgeoisie_Interim:0 "团结全国资产阶级"
 PRC_50s_Prepare_for_the_First_CPPCC_Interim:0 "中国人民政治协商会议第一次全体会议的筹备工作"
 PRC_50s_Production_Assurance_of_Newly_Receiving_Enterprises_Interim:0 "确保新接收企业的生产"
 PRC_50s_Foundation_of_the_Peoples_Republic_of_China:0 "中华人民共和国的成立"
 PRC_50s_Liberate_Kunming_desc:0 "昆明的解放是打破西南地区剩余抵抗的关键一步。通过推进到云南，我们可以确保重要的补给路线，消除军阀势力，为该地区带来期待已久的稳定。在这里取得的成功将极大地加强我们在全国斗争中的地位。"
 PRC_50s_Liberate_Guangxi_desc:0 "广西仍然是根深蒂固的反对势力的最后堡垒之一。通过解放该地区，我们可以获取关键的农业和工业资源，同时削弱敌对派系的影响力。这次战役将使统一迈近一步。"
 PRC_50s_Reach_South_China_Sea_desc:0 "到达南海标志着我们南部解放行动的圆满完成。通过控制海岸线，我们确保了战略海上通道，加强了后勤网络，并阻止任何残余敌军寻求外国支持。"
 PRC_50s_The_Three_Districts_Revolution_desc:0 "伊犁、塔城和阿勒泰三地区具有巨大的革命潜力。通过支持和引导这些地区的运动，我们加深了在西北的影响力，并为未来融入新中国奠定了基础。"
 PRC_50s_Peacefully_Liberate_Urumqi_Campaign_desc:0 "通过谈判、外交和谨慎的政治压力，乌鲁木齐的和平解放是可能的。如果成功，将避免该地区进一步的痛苦，并展示我们在不流血的情况下维护团结的承诺。"
 PRC_50s_Begin_Establishment_of_PCCX_desc:0 "为了确保新疆的长期稳定，我们必须建立新疆生产建设兵团。这个组织将把军事纪律与农业和工业发展相结合，在促进经济增长的同时加强边境安全。"
 PRC_50s_Integrate_the_three_districts_government_desc:0 "在新疆控制权确立之后，我们现在必须将三区的政府纳入国家体系。统一的行政系统将消除分裂，并使该地区与新中国的政策保持一致。"
 PRC_50s_Unite_The_National_Bourgeoisie_Interim_desc:0 "民族资产阶级仍然拥有重要的经济影响力。在这一过渡时期，通过选择合作而非对抗，我们保持了工业稳定，并确保所有生产力都为国家重建做出贡献。"
 PRC_50s_Prepare_for_the_First_CPPCC_Interim_desc:0 "第一届中国人民政治协商会议将确定新国家的框架。必须做好准备，将各民主党派、人民团体和各社会阶层的代表聚集起来，建立广泛的民族团结阵线。"
 PRC_50s_Production_Assurance_of_Newly_Receiving_Enterprises_Interim_desc:0 "随着企业被纳入国家控制，其生产必须保持不中断。通过指导、监督和工人支持，我们确保工厂在过渡期间持续高效运作。"
 PRC_50s_Foundation_of_the_Peoples_Republic_of_China_desc:0 "长期的革命斗争接近胜利的终点。随着胜利的取得和政权的巩固，宣布中华人民共和国成立的时刻已经到来。中华民族迎来了新的历史时代。"

