 ICE_infantry_equipment_0:0 "ショート・マガジン リー・エンフィールド No.4 MkI"
 ICE_infantry_equipment_0_short:0 "SMLE No. 4"
 ICE_infantry_equipment_0_desc:0 "リー・エンフィールドは20世紀の前半世紀を通してイギリス帝国やコモンウェルス諸国によって使用されたボルトアクション式、マガジン給弾式の連発銃である。1895年から1957年にかけてはイギリス陸軍の制式銃にも採用されていた。第二次世界大戦では特に北アフリカ戦線、イタリア戦線、太平洋戦線やビルマ戦線でイギリス連邦軍が大規模に使用した。オーストラリアとインドは第二次世界大戦中はSMLE Mk III*を正式採用、生産し続け、オーストラリア軍は朝鮮戦争でも使用した。オーストラリア軍での採用は1950年代後半にL1A1 SLRが後継銃として採用されるまで続いた。"
 ICE_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 ICE_infantry_equipment_1_short:0 "FN FAL"
 ICE_infantry_equipment_1_desc:0 "FN FAL is one of most produced guns in history. Because of its prevalence and widespread usage among the militaries of many NATO and first world countries during the Cold War it was given the title \"The right arm of the Free World\"."
 ICE_infantry_equipment_2:0 "Heckler & Koch G3"
 ICE_infantry_equipment_2_short:0 "G3"
 ICE_infantry_equipment_3:0 "Kongsberg Våpenfabrikk AG-3"
 ICE_infantry_equipment_3_short:0 "AG-3"
 ICE_infantry_equipment_4:0 "Diemaco C8"
 ICE_infantry_equipment_4_short:0 "C8"
 ICE_infantry_equipment_4_desc:0 "The Diemaco C8 carbine range are carbine variants of the C7 family, and are mechanically and aesthetically very similar to the Colt 653. Colt made the initial C8s for Canadian Forces as the Colt Model 725. The C8 has a 368 mm (14.5 in) A1 profile barrel like the Colt Model 653 M16A1 carbine"