 SOV_10th_5yp_category_desc:0 "Soviet 10th Five-year Plan\nThe 10th Five-Year Plan is a set of goals aiming to strengthen our country's economy from 1976 to 1980, being presented at the 25th Congress by Chairman Alexei Kosygin of the Council of Ministers. Known as the plan of Efficiency and Quality due to Brezhnev claiming that the Soviet economy faced declining growth due to slow technological progress at home hence the plan emphasizing the need to innovate technologically with numerous industries in the country pinpointed for an increase in efficiency.\n\n Current Progress: [?ROOT.sov_10th_5yp_progress|R]%"
