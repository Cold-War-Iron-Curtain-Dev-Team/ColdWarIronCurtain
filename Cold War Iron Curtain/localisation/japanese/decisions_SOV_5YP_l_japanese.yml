l_japanese:
 SOV_8th_5yp_category:0 "第八次五カ年計画"
 SOV_8th_5yp_category_desc:0 "ソ連邦第八次五カ年計画\n第八次五カ年計画は、工業生産目標を定掲げた野心的なものである。第23回党大会で発表されたもので、物流や組織は中央政府が担当し、工場所有者が割当量をどのように達成するかについては、より大きな権限が与えられることになった。計画はまた労働者の福祉を向上させ、生活者がより多くの経済活動に参加できるようにすることを目的としている。\n\n現在の進捗：[?ROOT.sov_8th_5yp_progress|R]%"
 SOV_8th_5yp_industry_Don:0 "ドン地域での工作機械生産を増やす"
