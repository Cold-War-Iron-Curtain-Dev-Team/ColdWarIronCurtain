 SOV_11th_5yp_category:0 "第十一次五カ年計画"
 SOV_11th_5yp_category_desc:0 "Soviet 11th Five-year Plan\nThe 11th Five-Year Plan is yet another set of goals to strengthen our economy. It is planned to be achieved between the years 1981 to 1985. It has been presented by the Chairman of the Council of Ministers Nikolai Tikhonov at the 26th Congress. Brezhnev told the delegates at the congress that the main goal is of the plan is to transition the economy from extensive to intensive growth, and that improving the standard of living should be one of the goals. Other goals included halting migration from East to West and South to North and ensuring economic growth, due to most Soviet economic centers being located in underdeveloped areas such as Siberia and Central Asia.\n\n Current Progress: §G[?ROOT.sov_11th_5yp_progress|R]%§!"
