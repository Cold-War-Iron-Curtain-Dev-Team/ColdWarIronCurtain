 SOV_9th_5yp_category:0 "第九次五カ年計画"
 SOV_9th_5yp_category_desc:0 "Soviet 9th Five-year Plan\nThe goal of the Ninth Five-Year Plan is to strengthen our economy and we seek to achieve it from 1971 to 1975. It was presented at the 24th Congress by the Chairman of the Council of Ministers Alexei Kosygin. Its main focus is to increase the growth of industrial produced consumer goods, with Brezhnev commenting that increasing the standard of living was more important than economic development. The plan also includes a proposal of increasing the gross national income by 37 to 40 percent.\n\n Current Progress: [?ROOT.sov_9th_5yp_progress|R]%"
