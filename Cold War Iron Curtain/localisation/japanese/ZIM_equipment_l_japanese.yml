 ZIM_mbt_equipment_3: "T-55"
 ZIM_mbt_equipment_3_short: "T-55"
 ZIM_mbt_equipment_3_desc: "T-55はT-54戦車の改良型である。 OKB-520はT-55の設計を変更し、NBC防御を向上させ、より最適化されたエンジンを搭載し、砲塔形状を改良し、さらに改良された火器管制や光学系などの補助装備を追加した。 さらに、T-54が7.62SGMT砲を使用していたのに対し、T-55は12.7DShK HMGを頻繁に使用し、火力は向上したが、より多くの弾薬を搭載することができなかった。 T-55はT-54と同様に多くの軍隊で使用され、T-54が経験したすべての紛争を経験した。"
 ZIM_mbt_equipment_4: "T-55LD"
 ZIM_mbt_equipment_4_short: "T-55LD"
 ZIM_mbt_equipment_4_desc: "T-55はT-54戦車の改良型である。 OKB-520はT-55の設計を変更し、NBC防御を向上させ、より最適化されたエンジンを搭載し、砲塔形状を改良し、さらに改良された火器管制や光学系などの補助装備を追加した。 さらに、T-54が7.62SGMT砲を使用していたのに対し、T-55は12.7DShK HMGを頻繁に使用し、火力は向上したが、より多くの弾薬を搭載することができなかった。 T-55はT-54と同様に多くの軍隊で使用され、T-54が経験したすべての紛争を経験した。"
