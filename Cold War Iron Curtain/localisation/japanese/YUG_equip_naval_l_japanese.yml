l_japanese:
 YUG_ww_capitals: "クンボル"
 YUG_ww_capitals_short: "クンボル"
 YUG_ww_capitals_desc: "ルドルフ型海防戦艦"
 YUG_battle_hull_light_0: "ガゼル型巡洋艦"
 YUG_battle_hull_light_0_short: "ガゼル型巡洋艦"
 YUG_battle_hull_light_0_desc: "ドイツの小型巡洋艦「ニオベ」。1943年12月22日、2本の魚雷で損傷し、乗組員によって放置され、まもなくユーゴスラビアのパルチザンに鹵獲されたが、修復が不可能なため放棄された。1947年に金属類の回収のために解体が開始され、1952年にユーゴスラビアの船舶解体会社「ブロドスパス」によって解体が終了された。"
 YUG_battle_hull_light_4: "コトル型"
 YUG_battle_hull_light_4_short: "コトル型"
 YUG_battle_hull_light_4_desc: "コトル型大型巡視船。この船は、艦対艦ミサイルP-21またはP-22（NATOコードSS-N-2 Styx）4発で武装している。ミサイルの重量は2607kg、弾頭の重量は480kgで、射程は8～80km、高度は25mまたは50m、速度はマッハ0.9で飛行する。光波ホーミング誘導システム（P-22）または電波ホーミング誘導システム（P-21）を備えている。"
 YUG_screen_hull_heavy_0: "Tb 74T型"
 YUG_screen_hull_heavy_0_short: "Tb 74T型"
 YUG_screen_hull_heavy_0_desc: "T1は戦後、ユーゴスラビア海軍にゴレシュニツァとして就役した。単装40mm砲2門と20mm砲4門で再武装し、魚雷発射管は撤去された。1959年10月までこの名前でユーゴスラビアでの運用が続けられた。T5も戦後ユーゴスラビア海軍に就役し、Cerと改名された。単装40mm砲2門と20mm砲1門を搭載し、魚雷発射管も撤去された。1962年まで活躍したが、その後解体された。"
 YUG_screen_hull_heavy_1: "スプリト"
 YUG_screen_hull_heavy_1_short: "スプリト"
 YUG_screen_hull_heavy_1_desc: "スプリトの主兵装は、上部構造の前後に1基ずつ、単装式マウントの38口径5インチ（13cm）砲4門で構成されていた。対空兵装は、4門の連装砲と4門の単装砲で構成され、ライセンス生産された40mmボフォース単装砲を搭載しており、21インチ魚雷発射管の五連装を1基搭載し、40個の機雷を搭載する能力を保持していた。対潜戦闘のために、スプリトは2つのヘッジホッグスピガット迫撃砲、6つの爆雷投射機と2つの爆雷ラックを装備していた。5インチ砲にはMk37火器管制装置、AA砲にはMk51火器管制装置が装備された。"
 YUG_screen_hull_heavy_2: "W級"
 YUG_screen_hull_heavy_2_short: "W級"
 YUG_screen_hull_heavy_2_desc: "先行するU級、V級駆逐艦の後継艦で、艦長構造を変更したもの。Z級は4.5インチ砲を装備していた。"
 YUG_screen_hull_heavy_3: "アニモッソ型"
 YUG_screen_hull_heavy_3_short: "アニモッソ型"
 YUG_screen_hull_heavy_3_desc: "アリエテ級はスピカ級に比べ、3基あった100mm/47口径兼用砲のうち1基を減らし、魚雷兵装は450mm魚雷発射管4基から6基に増加させ、艦の中心線上に3基設置された。対空兵装は、20mm砲10門となった。"
 YUG_screen_hull_heavy_4: "プロジェクト1159"
 YUG_screen_hull_heavy_4_short: "プロジェクト1159"
 YUG_screen_hull_heavy_4_desc: "武装は76mm AK726連装砲2基と30mm AA連装砲2基で、一部の艦にはSSN-2対艦ミサイルランチャー4基が搭載され、艦尾には深度計と機雷ラックが装備された。"
 YUG_screen_hull_medium_0: "Tb 82F型"
 YUG_screen_hull_medium_0_short: "Tb 82F型"
 YUG_screen_hull_medium_0_desc: "水雷艇「Tb 82F」型、1945年にユーゴスラビア海軍に譲渡され、哨戒艇T5として導入（1949年5月18日からPBR 92 \"Cer\" ）、1962年に除外、1963年に解体のため譲渡された。"
 YUG_screen_hull_medium_1: "ドゥブロヴニク型"
 YUG_screen_hull_medium_1_short: "ドゥブロヴニク型"
 YUG_screen_hull_medium_1_desc: "ドゥブロヴニク型ユーゴスラビア駆逐艦"
 YUG_screen_hull_medium_2: "ベオグラード型"
 YUG_screen_hull_medium_2_short: "ベオグラード型"
 YUG_screen_hull_medium_2_desc: "ベオグラード型駆逐艦"
 YUG_screen_hull_medium_3: "アリエテ型"
 YUG_screen_hull_medium_3_short: "アリエテ型"
 YUG_screen_hull_medium_3_desc: "アリエテ型護衛駆逐艦"
 YUG_screen_hull_medium_4: "トリグラフ"
 YUG_screen_hull_medium_4_short: "トリグラフ"
 YUG_screen_hull_medium_4_desc: "トリグラフはスヴェトリャク級哨戒艇である。"
 YUG_sub_hull_ww: "フラブリ級"
 YUG_sub_hull_ww_short: "フラブリ級"
 YUG_sub_hull_ww_desc: "水上航行時には、2基のディーゼルエンジンで2,400馬力（1,800kW）のプロペラシャフトを駆動させた。潜水時には、1,600軸馬力（1,200kW）の電気モーター2基でプロペラを駆動した。最高速度は、水上で15.7ノット（29.1km/h、18.1mph）、水中では電気モーターで10ノット（19km/h、12mph）に達することができた。艦首に6基の533mm魚雷発射管を装備し、12本の魚雷を搭載していた。"
 YUG_sub_hull_small_single_3: "ウナ級"
 YUG_sub_hull_small_single_3_short: "ウナ級"
 YUG_sub_hull_small_single_3_desc: "ウナ級潜水艦（911型とも）は、1980年代にユーゴスラビア海軍のためにShipyard of Special Objects (BSO)で建造された6隻の特殊潜航艇のクラスである。大型の潜水艦ではアクセスできない浅瀬で、小さな地雷原を敷設し、潜水艇を搭載した、あるいは海軍特殊部隊を輸送することを目的に設計された。そのため、魚雷兵装やバッテリー充電用のジェネレーターを装備していない。"
 YUG_sub_hull_large_single_0: "フルット型"
 YUG_sub_hull_large_single_0_short: "フルット型"
 YUG_sub_hull_large_single_0_desc: "1953年9月10日ユーゴスラビア海軍に導入、近代化改修され、1968年に除籍された。"
 YUG_sub_hull_large_single_1: "プロジェクトB-81/1"
 YUG_sub_hull_large_single_1_short: "プロジェクトB-81/1"
 YUG_sub_hull_large_single_1_desc: "スティエスカ級は、1950年代後半から1960年代前半にかけてユーゴスラビア海軍のために建造された2隻のディーゼル・エレクトリック式潜水艦のクラスである。プーラのウルヤニク造船所で建造された。"
 YUG_sub_hull_large_single_2: "プロジェクトB-81/2"
 YUG_sub_hull_large_single_2_short: "プロジェクトB-81/2"
 YUG_sub_hull_large_single_2_desc: "スティエスカ級は、1950年代後半から1960年代前半にかけてユーゴスラビア海軍のために建造された2隻のディーゼル・エレクトリック式潜水艦のクラスである。プーラのウルヤニク造船所で建造された。"
 YUG_sub_hull_large_single_3: "ヘロジ級"
 YUG_sub_hull_large_single_3_short: "ヘロジ級"
 YUG_sub_hull_large_single_3_desc: "ヘロジ級は、1960年代にユーゴスラビア海軍のために建造されたディーゼル・エレクトリック式潜水艦のクラスである。このクラスの武装は、最大6本のSET-65E能動/受動ホーミング魚雷を発射するため、または最大12個の海軍機雷を代わりに配備するための4本の533mm（1フィート9.0インチ）魚雷発射管から成っていた。この艦のセンサー群には、「ストップライト」レーダー警告受信機、「スヌープグループ」表面捜索レーダー、トムソン・シントラEledone船体搭載ソナーが含まれていた。"
 YUG_sub_hull_large_single_4: "サヴァ級"
 YUG_sub_hull_large_single_4_short: "サヴァ級"
 YUG_sub_hull_large_single_4_desc: "サヴァ級は、1970年代後半から1980年代前半にかけてユーゴスラビア海軍のために建造されたディーゼル・エレクトリック式潜水艦の一種である。武装は、最大射程10.8海里（20km；12mi）のTEST-71ME魚雷を最大10本発射するために使用される6つの533mm（21.0インチ）前面魚雷管からなり、機雷敷設作戦に使用する場合は最大20個の海軍機雷が搭載されている。センサーには、「ストップライト」レーダー警告システムと「スヌープグループ」水上捜索レーダーが含まれている。搭載されているソナー装置については、資料によって記載が異なる。"
 YUG_sub_hull_large_double_0: "スメリ型"
 YUG_sub_hull_large_double_0_short: "スメリ型"
 YUG_sub_hull_large_double_0_desc: "ディーゼル・エレクトリック式ユーゴスラビア潜水艦"