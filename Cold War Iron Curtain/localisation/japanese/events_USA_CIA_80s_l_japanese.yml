 CIA_SRL.0.d:0 "SRI LANKAN INSURGENCY: IN BRIEF\nOffice of Near Eastern and South Asian Analysis, Directorate of Intelligence\n\nSECRET/NOFORN\n\nIn recent years, tensions between the Sri Lankan Government, dominated by the Sinhalese ethnic group, and the Tamil ethnic group, located in the north of the country, have escalated into violence. Tamils have alleged systemic discrimination against them in employment, education, and language, particularly concerning the 1970s policy of standardization which systematically limited Tamil students from gaining entrance into universities. (U/OU)\n\nThe Tamil opposition to government policy has existed in the form of the Tamil United Liberation Front (TULF), acting as the legitimate political opposition since 1976; while militant groups, such as the Liberation Tigers of Tamil Eelam (LTTE) have been formed under the leadership of Velupillai Prabhakaran. Both groups, while differing in their methods, desire for the creation of a secular, socialist state of \"Tamil Eelam\" located in the Tamil-majority north of the country. (S)\n\nRecent anti-Tamil riots and demonstrations, including one in 1977 that resulted in 125 deaths, and the burning of the Jaffna Public Library in 1981 by a Sinhalese mob, have continually increased tensions towards full civil war. Now, in 1983, the fire has begun to burn bright, particularly after a Sri Lankan Army patrol, known as \"Four Four Bravo\" was ambushed, resulting in the deaths of 13 soldiers. The period known as \"Black July\", has resulted in multiple anti-Tamil pogroms, massacres of prisoners, and hundreds of deaths. (S)\n\nIt is estimated that the LTTE and other Tamil militant groups will continue to harass and outright fight Sri Lankan Army units. However, the situation is unclear outside of Sri Lanka; the influence of India in the conflict is unknown, although the presence of a sizable Tamil population in southern India may present obstacles to the Sri Lankan Government in putting down this uprising. (S)"
 CIA_SRL.1.d:0 "INDIA’S POSITION ON SRI LANKA: RECOMMENDATIONS FOR ACTION\nOffice of Near Eastern and South Asian Analysis, Directorate of Intelligence\n\nSECRET/NOFORN\n\nIndia’s relative geopolitical position to Sri Lanka has presented significant issues to the Sri Lankan Government in its attempt to counter the insurgency by the Liberation Tigers of Tamil Eelam (LTTE). With Sri Lanka and India being only 35 miles apart from each other at their closest points, and the appearance of a significant Tamil population in southern India, it is our assessment that the Indian Government will attempt some measure of involvement in the conflict, likely on the side of the Tamil insurgents. (S)\n\nTamil groups, both in Sri Lanka, and in the southern Indian state of Tamil Nadu, have developed strong relationships and cooperation. Specifically, the LTTE has developed relationships with officials from the Pure Tamil Movement and the Kamaraj Congress, as well as the Chief Minister of Tamil Nadu, M.G. Ramachandran, a prominent state official. (S)\n\nThe United States is faced with a challenge in responding to this conflict, and subsequent Indian involvement. It is clear that constraining Indian influence in the region is vital to ensuring that the Sri Lankan Government can continue its counterinsurgency operations unabated. The following are recommendations that can be taken to destabilize Indian influence in the region and take pressure off of Sri Lanka:\n\n1. Using the resources of the International Monetary Fund and other economic organizations to end loan access to the Indian Government\n\n2. Organizing Tamil-majority emigre groups on the Indian mainland, with the intent of forming militant organizations similar to the LTTE in Sri Lanka.\n\n3. Using diplomatic channels to pressure Pakistan into ceasing aid to the Sri Lankan Government, as well as beginning arms shipments to Indian Tamil militant groups.\n\nIt is our hope that this analysis and recommendation will effectively end Indian influence in the region, turn New Delhi’s focus away from their island neighbor, and allow a continuance of the status quo in the area."
 CIA_SRL.2.d:0 "As the Secretary of the Treasury walked into the headquarters of the International Monetary Fund, he was glad that it was so close. Only a short car ride away from the Treasury office buildings, in the Foggy Bottom neighborhood of Washington, it made visits like this simple, and easy, not requiring a flight and more importantly, press.\n\nOnly a few sets of stairs and an elevator ride, and the Secretary was sitting in the office of the Managing Director, the Frenchman Jacques de Larosiere, the most powerful man in the IMF. As the United States representative of the Board of Governors, the Secretary knew he had much influence on the operations of the IMF globally. Having thought over the contents of the CIA report he had read earlier, he knew what was required now.\n\n\"Good morning, Mr. Secretary. What can I do for you?\" de Larosiere leaned back, setting down a cup of coffee on a saucer at his desk, with a view of the DC skyline behind him.\n\n\"Jacques, you and I have known each other for a long time. Your leadership at the French Treasury, and now at the IMF, has been excellent. I need a favor from you.\" The Secretary adjusted himself as he continued.\n\n\"I’m sure you’ve seen the news or read the briefings from your government. India is increasingly getting involved in the Sri Lankan Civil War, funding the Communist Tamil rebels in the north. They are intentionally sabotaging the conflict and are costing millions of lives in the balance. We recommend that the IMF take action to sanction India for its actions and force them to take pressure off of Sri Lanka.\"\n\n\"Mr. Secretary. What exactly is your government proposing we do? India is also a consenting member of the IMF. I don’t see why we should get involved in this issue.\"\"Mr. de Larosiere, you are the Managing Director, the most powerful person in this organization. Our government proposes cutting off access to IMF loans to India. This would not require a vote and could just simply be a procedural matter that you implement, quietly. No press, no scandal, no nothing. It would mean a lot to us, Jacques.\"\n\nde Larosiere paused. \"Fine, Mr. Secretary. I will see what we can do to end loan access, but no promises. The IMF wants no blowback from this."
 CIA_SRL.3.d:0 "We have received a notification from the International Monetary Fund that our access to IMF loans has been revoked, on the basis of \"not following certain criteria for members seeking loans.\" While presenting a massive challenge to our fiscal and international economic situation, the Government suspects this may be a move by the IMF, and by the Western bloc as a whole, to sanction our actions in Sri Lanka.\n\nIt is unclear how we should respond, other than categorically condemning this action and requesting the IMF reverse its decision. Some figures in our Government have suggested tapering back actions in Sri Lanka, as a means of appeasing the West, but others have maintained the need for self-determination on issues such as these."
 CIA_SRL.4.d:0 "As Jayamravi sat in the small restaurant, he looked around, between the door and his table, to the kitchen, and back again. As he set down the Tamil-language newspaper he was reading, he saw the two men approaching his table, nodding as they sat down. Jayamravi launched straight in.\n\n\"I assume you two are here because you’re interested in the local Tiger unit?\" He spoke in a hushed tone. The two nodded.\n\nLooking around, Jayamravi stood up, picking up his newspaper, leaving a few rupees on the table, and walking out into the dusty, crowded streets of Madurai, then turning suddenly into an alley, ducking into another alley, and stopping outside a doorway where a man stood. Jayamravi nodded, motioned for the two men to follow, and guided them inside, where a makeshift command center and armory seemed to have been set up.\n\n\"Welcome to the local cell of the Liberation Tigers of Tamil Nadu, gentlemen. Our fighters have done checks on you and have determined that you are safe. Welcome abroad. We’re glad to have you.\" Jayamravi smiled, gesturing to the tables, spread with maps, newspapers, a desk in the back with vests, explosives about to be strapped to them. Jayamravi unholstered a pistol, checking the slide. \"I hope you know what you’re getting into.\"\n\nWhat no one but only one realized was that \"Jayamravi\" was really an elaborate cover. CIA operative Shekar smiled. He missed his home, a wonderful suburbia outside of McLean, Virginia, but this mission was far more important. Much more had to be done."
 CIA_SRL.5.d:0 "SECURITY INTELLIGENCE REPORT\nCONFIDENTIAL\n\nMilitant activity among Tamil nationalist and militant groups has been steadily increasing in the state of Tamil Nadu, including in the major cities of Chennai, Puducherry, and Madurai. The most prominent has probably been the Liberation Tigers of Tamil Nadu (LTTN), a militant group almost identically based off of the Sri Lanka-based Liberation Tigers of Tamil Eelam (LTTE).\n\nIt is not currently known of the connection between the Sri Lanka-based LTTE and the LTTN; however, it can be assumed that connections have taken place. The LTTN primarily operates as an Indian affiliate of the Tamil Tigers, designed to operate in Tamil-majority areas in an attempt to alienate popular support away from current Government assistance to the LTTE.\n\nThe current recommendation of this report is to move forward with basic counter-insurgency operations and heavier policing operations to prevent LTTN cells from committing incursions or other terrorist attacks on sovereign Indian soil. The state of Tamil Nadu should receive all adequate funding and resources necessary to achieve this task."
 CIA_SRL.6.d:0 "DIPLOMATIC ACTIONS TOWARDS INDIA\nOffice of Near Eastern and South Asian Analysis, Directorate of Intelligence\n\nSECRET/NOFORN\n\nBased on our previous assessments, this Office has indicated that instead of further destabilization operations towards India, a change in strategy is required, towards covert diplomatic actions. This office provides the following recommendations, with the cooperation of the US Embassy, New Delhi; and the Bureau of South and Central Asian Affairs, Department of State:\n\n1. Covert pressure and threatening to withhold aid, including military aid in the form of possible arms sales and technology transfers, as well as direct economic aid.\n\n2. Placing pressure on US companies operating in India, such as Union Carbide India Limited, to make similar demands, on the basis that India should cease their actions in Sri Lanka if they would like to continue to maintain economic cooperation and growth with US and other Western companies.\n\n3. Working with the Treasury Department’s Office of Foreign Asset Control (OFAC) to consider placing sanctions and seizing assets of prominent Indian officials, including Cabinet officials, members of the Defense Staff, and personnel at the Indian Ministry of External Affairs, on similar basis as stated above.\n\n4. Enforcement of all above sanctions and threats, as well as ensuring support from allies and other Western nations in placing pressure on the Indian Government.\n\nIt is this Office’s hope that these recommendations will provide adequate diplomatic weight to persuade India to cease their operations and interference in Sri Lanka."
 CIA_SRL.7.d:0 "The CIA Chief of Station in Islamabad has come to our Ministry of Foreign Affairs, as well as Inter-Services Intelligence, to request that we end aid to the Sri Lankan Government in their fight against the communist and Indian-backed Liberation Tigers of Tamil Eelam (LTTE).\n\nAmerican officials are apparently focused on halting Indian influence in the region, particularly surrounding Sri Lanka, and have come to us, aware of our feelings towards India, and have asked for us to pursue more direct involvement, in order to perhaps take the Indians’ attention away from the island to the south.\n\nMembers of the Government are unsure about stopping arms shipments to the Sri Lankan Government, and some have argued that we can do both. However, we are dependent on US arms sales and other assistance, and listening to their requests may help us out in the long run."
 CIA_SRL.8.d:0 "The CIA Chief of Station in Islamabad has informed Langley, and the State Department, that the Pakistani Government, including Inter-Services Intelligence, intends on continuing aid to the Sri Lankan Government in the form of arms sales and training of military personnel.\n\nWhile this is not what we asked the Pakistanis to do, and while there is some considerable anger in Langley as a result, the continued funding of the Sri Lankan Government by Pakistan still represents a beneficial opportunity to subvert Indian influence via proxy. We can only hope that their rhetoric towards India will toughen in the future."
 CIA_SRL.9.d:0 "The CIA Chief of Station in Islamabad has informed Langley that after confidential discussions, the Pakistani Government, under the auspices of Inter-Service Intelligence, has agreed to end covert military aid to the Sri Lankan Government in their counterinsurgency operations against Tamil rebels.\n\nBased on a request from Langley, the Pakistanis have not taken back their physical military shipments, but have stopped them in the future. The Pakistani Ministry of Foreign Affairs is prepared to deal with the blowback from the Sri Lankan Government, with our support.\n\nIt is hoped that with this development, we shall be able to further persuade the Pakistanis to refocus their attention on their border with India and inflaming tensions in the Kashmir region, in order to turn the Indians’ attention away from Sri Lanka and back towards their archnemesis, Pakistan."
 CIA_SRL.10.d:0 "TAMIL NADU: POSSIBILITIES FOR OPERATIONS\nStation Chief, New Delhi; Office of Near Eastern and South Asian Analysis\n\nSECRET/NOFORN\n\nIn the United States’ endeavor to assist Sri Lanka in its ongoing civil war, it has become necessary to undertake more escalatory actions in order to prevent India from becoming further involved on the side of the Tamil rebels.\n\nCIA personnel in New Delhi and Colombo have proposed expansion of operations in the southern Indian state of Tamil Nadu, which is the closest state to Sri Lanka and contains a Tamil-majority population. This Office believes that the demographic distribution presents a vital factor in committing attacks there, as it will alienate Tamil Indians away from the war, and turn regional public opinion against the Indian-backed LTTE rebels.\n\nCommitting attacks in major cities of Tamil Nadu, including Chennai and Madurai, using the resources of the Liberation Tigers of Tamil Nadu (LTTN), against particular targets such as:\n\n-Pro-war Lok Sahka members,\n-Tamil Nadu state officials,\n-The Chief Minister of Tamil Nadu\n-Prominent social and religious leaders in the state\n\nThis will effectively attract the attention of the Indian central government, distract law enforcement and security forces, and create social divisions between members of the Tamil majority."
 CIA_SRL.11.d:0 "TAMIL NADU SECURITY REPORT\n\nPrime Minister’s Office\n\nThe security situation in the southern state of Tamil Nadu has been contentious in recent weeks. Several attacks by the Liberation Tigers of Tamil Nadu (LTTN), a Tamil nationalist militant group heavily associated with the Sri Lankan LTTE, have been perpetrated in the major metropolitan areas of Chennai and Madurai.\n\nWhile no major state or central government officials have been killed or injured, the primary targets have been local municipal officials, as well as local police and members of the Tamil Nadu Police. However, intelligence sources indicate that attacks on Lok Sakha and state officials may be incoming, if the government does not act to stop their actions.\n\nLTTN attacks, much like their comrades in Sri Lanka, have focused on suicide attacks using bombs, as well as some limited shooting attacks. Many attacks appear to be pre-planned, indicating that LTTN cells have some knowledge of government and law enforcement operations before they happen.\n\nSome officials in the government have indicated their worry for this situation, particularly as it relates to our involvement in Sri Lanka. Some whisperings have echoed about withdrawal of Indian aid to the LTTE, on the basis that their affiliate organization is waging attacks on the mainland."
 CIA_SRL.12.d:0 "ASSISTANCE TO SRI LANKA: SUMMARY\nOffice of Near Eastern and South Asian Analysis, Directorate of Intelligence\n\nSECRET/NOFORN\n\nThe United States’ decision to support the Sri Lankan Government in its ongoing civil conflict against the Tamil militant group Liberation Tigers of Tamil Eelam (LTTE, or \"Tamil Tigers\") has come with significant costs and benefits to both sides. This Office recommends the following actions in addition to regular diplomatic actions, as a means of reinforcing Sri Lanka’s military capability and effectiveness, as well as halting Indian involvement in the conflict on the side of the LTTE.\n\n1. The immediate implementation of intelligence sharing with the Sri Lankan military, including the Army, Navy, and Air Force, in addition to the Sri Lankan Police Service and other security forces. This will ensure more accurate targeting and hopeful prevention of further terrorist attacks and incursions by LTTE and other Tamil militant groups.\n\n2. Coordination of covert support (lethal and non-lethal) with Pakistan, who has also been active in aiding the Sri Lankan Government\n\n 3. Consideration of additional lethal aid support to the Sri Lankan Government, including training of the Sri Lankan Special Forces Regiment, and lethal aid to government-backed paramilitary groups, including the Muslim Home Guard.\n\nIt is our hope that a combination of this aid will augment the struggling Sri Lankan military and security forces at this present time and increase their counterinsurgency capabilities as they continue to repel attacks and offensives from the LTTE."
 CIA_SRL.13.d:0 "As the Sri Lankan Army major sat in the command headquarters, outside of Colombo, he was sweating, both from the heat and from the nervousness he felt. Assigned to command the security detail for this divisional headquarters, he looked around, into the muggy night. It was quiet, too quiet. As he stepped out of the tent, he saw the barbed wire, the entrance gate, the guard towers flanked with young soldiers, armed with their machine guns. They had been terrorized by Tiger suicide bombings, something the major had never seen before. Security was tight, but never tight enough for them, he thought.\n\nAs he walked back into the tent, he peered over the latest reports, from the local army military intelligence officers. They were remarkably short and useless, providing little to no detail on the Tigers’ activities other than that they exist and continue to commit attacks. He sighed, wondering what the point of the military intelligence corps was. Surely they had to be intelligent, right? Apparently not.\n\nOne of his lieutenants, having sped in on a motorcycle, rushed in, carrying a sheaf of papers in a file. Messily saluting, he exhaustedly pushed the papers toward the major, who opened the file and starting looking through, trying to decipher the awful Sinhalese translation.\n\n\"Sir, the American operative embedded with the Military Intelligence Corps has a report on the Tigers’ movements here. He’s warning of an attack tonight, using a truck.\" The major looked around, then back down, reading the report.\n\n\"Okay. Raise the alert level. Double the guards. Bring up the gate barriers. Tell the troops to prepare for an incurs-\" He was interrupted by the sudden rip of automatic weapons fire, seemingly from the outer perimeter, followed by shouts as troops moved towards the skirmish. The major looked out at a truck, stopped, soldiers shooting at it, then moving forward, the gunshots stopping, the driver dead. He looked at his lieutenant, then down at the sheaf of papers. \"Holy shit.\""
 CIA_SRL.14.d:0 "\"Mr. President, we have a possible new ally in the fight for Sri Lanka. Pakistan.\" CIA Director [GetCurrentCIADir] stood in the Oval, surrounded by Secretary of State [GetCurrentSecState], Secretary of Defense [GetCurrentSecDef], and National Security Advisor [GetCurrentNatSecAdv].\n\nPresident [USA.GetLeader] sat at the Resolute Desk, listening. \"Go on, Director.\"\n\n\"Well, Mr. President, the Pakistanis have been covertly funding the Sri Lankan Government since the Civil War kicked off in July of ‘83. As our reports have indicated, the Indians have been funding the Liberation Tigers of Tamil Eelam, the Tamil rebels that the government in Colombo is fighting. The Pakistanis have long been foes of India, and have been using this conflict as an opportunity to exercise influence in the region in order to subvert Indian goals.\"\n\nThe Secretary of Defense cut in. \"Specifically, the Pakistanis have been providing the Sri Lankans with small arms, some explosives, and light patrol vehicles. Their Inter-Services Intelligence service has been providing some limited intelligence, but we think that combining arms transfers from us and intelligence sharing would heavily benefit the Sri Lankans in their fight.\"\n\nThe President looked around. \"I see no problem with this. What are the chances the Indians find out?\"\n\nThe Secretary of State responded. \"Our embassy in New Delhi, as well as the CIA chief of station there, have made inquiries discreetly. The Indians have no idea and are preoccupied with tensions in Kashmir as well as funding the Tigers in Sri Lanka.\"\n\nThe President nodded. \"Excellent. Make it happen, gentlemen. Reach out to the Pakistanis.\" The men nodded, as they shook hands, wrote some notes, and left the room to make calls."
 CIA_SRL.15.d:0 "The CIA Chief of Station in Islamabad has informed our operatives at Inter-Services Intelligence that the United States is preparing to coordinate covert support to Sri Lanka, in the form of covert arms shipments, intelligence sharing, reconnaissance photos, and diplomatic actions.\n\nAs the US has noticed our help to the Sri Lankan Government, in their fight against Indian-backed Tamil rebels, they have decided to consolidate covert aid to maintain a united front and expand US-Pakistan cooperation. CIA and US military officials are expected to meet with ISI and Air Force officers in the coming days to work out details of a joint US-Pakistan arms shipment network, via air drops as well as cross-sea transfers via ship.\n\nIt is expected that this endeavor will be successful, with the hope that the Indians do not find out our partnership with the Americans."
 CIA_SRL.16.d:0 "FALSE FLAGS IN SRI LANKA: IN BRIEF\nOffice of Near Eastern and South Asian Analysis, Directorate of Intelligence\n\nSECRET/NOFORN\n\nDespite the ongoing Sri Lankan Civil War, embedded CIA personnel and Sri Lankan Army personnel report a significant drop in combat effectiveness among government forces in recent weeks, out of a lack of morale and a lack of initiative among combat commanders, as well as continuing LTTE attacks on government installations and public buildings. This drop in morale is resulting in continued lack of initiative and therefore, further reduced morale.\n\nThis Office proposes the following recommendations to alleviate this issue and in particular, in ways that do not involve further advising the Sri Lankan Armed Forces, due to the lack of effectiveness with that strategy:\n\n1. Beginning covert support for isolated Tiger cells and other Sri Lankan rebel groups, with the specific mission of committing attacks against Sri Lankan government forces, under specific parameters determined by CIA operatives on the ground.\n\n2. Funding or otherwise supporting possible attacks against significant government buildings in Colombo, as well as against the residences of the Sri Lankan President, Sri Lankan Prime Minister, members of the Sri Lankan Parliament, and significant religious or social figures.\n\n3. Otherwise encouraging \"false-flag\" type attacks in order to provide the Sri Lankan Government with adequate justification to ramp up operations towards the LTTE forces to the north of the island.\n\nWhile no specific operations have been proposed by this Office, instead leaving that decision to be made by operatives on the ground, these should provide a basic structure to develop specific plans."
 CIA_SRL.17.d:0 "As the 2-ton truck rumbled and bounced down the road, the two drivers kept looking around, anxiously, checking the road, the sides, their rear, for figures poking out of the jungle undergrowth.\n\nThe truck had a red cross on it, indicating they were aid workers, as did their papers, but the drivers knew they were anything but. Presumably, this drive towards Mullaitivu, a town in the Northern Province of Sri Lanka, would be somewhat safe, but the \"aid workers\" still carried concealed pistols, just in case. You could never be too careful.\n\nBouncing along, the truck stopped at what appeared to be a Tiger checkpoint. Mullaitivu was a government stronghold but the route they were taking was still contested, and that seemed clear as they got out of the truck, hands in the air, being searched by the guards, who patted them down while others stood by with Type 56 rifles. Apparently satisfied by their papers, they opened the makeshift checkpoint and the truck carried on, towards Mullaitivu, a few rupees lighter.\n\nReaching the town, the agents waved to the Sri Lankan soldiers, who looked at them warily. Arriving at the local mosque, the truck stopped, with the two men getting out and stretching for a moment before opening the back of the truck. These were certainly \"aid supplies\" if you considered aid to be several hundred rifles and thousands of rounds of ammunition. The men nodded as members of the community came around, and one of them talked to the leader, apparently of the \"Muslim Home Guard,\" who started handing out the weapons. The other man climbed back into the truck, hitting the radio.\n\n\"Eagle One to HQ. Baby birds have been fed. Distributing the \"bird seed\" now.\""
 CIA_SRL.18.d:0 "A dispatch from local Army commanders in Mullaitivu, a Government stronghold in the Northern Province at the front lines, has indicated that American operatives, posing as Red Cross aid workers, are arming the Muslim Home Guard, a pro-Government paramilitary group, providing them with rifles and rounds of ammunition.\n\nOur program to form more paramilitary and home defense groups in local municipalities has met with some opposition, particularly since it is hard to recruit willing civilians to defend their towns, as the attrition rate of civilians in this conflict has been particularly high.\n\nHowever, this move by the CIA has indicated that the United States intends to continue supplying both Government forces and affiliated paramilitaries, which hopefully will increase performance and capability to drive out the traitorous Tamil rebels in the north."
 CIA_LATAM.0.d:0 "LATIN AMERICAN AFFAIRS IN BRIEF\nOffice of Latin American Analysis, Directorate of Intelligence\n\nSECRET/NOFORN\n\nThe geopolitical region known as Latin America, commonly thought of as stretching from the United States’ border with Mexico, through Central and South America to the southern tip of Patagonia, has experienced intense internal and external crises and conflicts since the end of World War II, and particularly into the late 1970s and 1980s. (U/OU)\n\nUnlike other intelligence and analysis operations around the world, the Latin American region presents a unique challenge to US policymakers due to its location and current heavy American influence in the region. In particular, several issues dominate, including internal conflicts in Colombia, Argentina, Peru, Nicaragua, and others. This Office has provided some recommendations for overall strategies in the region. (S)\n\n1. Maintaining the current United States policy of a strictly anti-Communist stance in the region. This may involve continuing contacts and operations in support of anti-Communist drug cartels and cocaine trafficking rings in the region, including MAS, as well as the Panamanian Government led by General Manuel Noreiga.\n\n2. Escalating the stated policy initiative known as the War on Drugs, chiefly by becoming involved in the internal conflict in Colombia, as well as increasing CIA operations on the southern border and within Mexico. This will involve more irregular operations, as well as operations in support of anti-Communist and anti-Cartel government forces in those selected regions.\n\n3. A less radical and violence approach, consisting of advocating for self-determination initiatives in the Latin American region. This would involve subtle silencing of Communist dissent, as well as ending any support for drug movements, and beginning operations against corporate influence in the region.\n\nThis Office strongly endorses all three of the above outlined strategies and is eager to begin its crucial work of securing American interests in the crucial region to its south."
 CIA_LATAMa.0.d:0 "It was a rainy morning in the Oval Office as President [USA.GetLeader] sat in the Oval, surrounded by CIA Director [GetCurrentCIADir], National Security Advisor [GetCurrentNatSecAdv], the Director of the FBI, and several aides and officials from each office and agency, who were busy setting up a poster on a stand facing the desk and couches.\n\n\"Mr. President, our decision to escalate the current War on Drugs campaign in Latin America has come with some challenges and benefits. However, our analysis has pointed to two large areas of focus: Colombia and Mexico.\"\n\n\"Colombia is currently in the middle of internal conflict which has commenced since the mid 1960’s. The two largest sides, the Government of Colombia, as well as the Revolutionary Armed Forces of Colombia (FARC), have devastated much of the country and have caused regional drug cartels, such as the Cali Cartel and the Medellin Cartel, to arise in rural areas and begin their large-scale production of cocaine, which they traffick north to the United States. Operations in this area, which could consist of either covert or overt interventions, can cut the cocaine crisis off at its source.\"\n\nThe President nodded. \"I see. Now tell me about Mexico.\"\n\n\"The situation in Mexico is somewhat similar, and the relatively close location allows greater flexibility in operations. Mexico has become a prime staging point for the movement of cocaine from its manufacturing points in Colombia, and particularly from that of the Guadalajara Cartel, who has turned from trafficking through Florida to cross-border trafficking via points in Texas, Arizona, New Mexico, and California.\"\n\nThe FBI Director spoke up. \"I can speak for the Bureau and the Drug Enforcement Administration that we are highly looking forward to engaging drug trafficking operations on the border and assisting the CIA in any operation they plan to deal with this terrible issue.\"\n\nThe President spoke up. \"Excellent, gentlemen. I’m excited to see where this goes. You all know to keep me updated, and specifically if I have to approve any operations, I expect reports daily.\" The men nodded, as the poster disappeared with them, leaving the President leafing through the briefing left on his desk."
 CIA_LATAMa.1.d:0 "THE COLOMBIAN CONFLICT: IN BRIEF\nOffice of Latin American Analysis, Directorate of Intelligence\n\nSECRET/NOFORN\n\nHaving gone on since 1964, the Colombian conflict has had its roots in a period of repression known as La Violencia, having occurred from 1948 to 1964, where left-wing and right-wing groups consistently clashed. Now, in the 1980s, the Colombian conflict has reached new heights, with multiple belligerents and the addition of drug cartels and other paramilitary groups becoming involved. (S)\n\nThe major players in the conflict include the anti-Communist Government of Colombia, including the police and military, which is supported by most friendly anti-Communist countries in Latin America as well as the United States. The major insurgent groups include the Communist Revolutionary Armed Forces of Colombia People’s Army (FARC), the National Liberation Army (ELN), the urban-based 19th of April Movement (M-19), most of whom are left-wing groups supported and assisted by the Soviet Union, Cuba, Venezuela, and other Socialist countries. (S)\n\nThe conflict has been further complicated by the large Colombian cocaine production and distribution capability which, in the midst of this civil conflict, has been co-opted by strong and well-armed drug cartels; the most infamous being the Medellin Cartel, the Cali Cartel, and MAS. These groups are typically anti-Communist, but remain ideologically neutral, instead focusing on profits and preventing government enforcement of the law. (S)\n\nIt is in this environment that the United States is challenged to respond. This Office hereby recommends both covert and overt proposals for operations, recognizing that the former may guarantee plausible deniability, but that the latter may increase efficiency of anti-drug operations overall."
 CIA_LATAMa.2.d:0 "OPERATIONS IN COLOMBIA: PROPOSAL AND RECOMMENDATIONS\nColombia Desk, Office of Latin American Operations, Directorate of Operations\n\nSECRET/NOFORN\n\nWhile it is clear that the United States should ally itself with the Government of Colombia in the ongoing conflict, expanding operations against both Communist guerrilla groups, as well as drug cartels, such as the Medellin Cartel, would ensure continuing US influence in Colombia and destroy any capability for cocaine production and trafficking into the United States.\n\n1. Offensive operations should primarily be conducted against the Revolutionary Armed Forces of Colombia, known as FARC. Formed in 1964 as a result of government attacks on Communist militias, FARC is the single largest Communist paramilitary group in Colombia, and has spread out over primarily rural areas in cells throughout the country. This Office recommends embedding in local FARC cells, committing attacks against FARC units in the form of bombings and targeted assassinations of officials, in order to stoke internal dissent and prevent the organization from achieving its goal of unifying to present a conventional threat to Colombian regular forces.\n\n2. Additional supporting operations should be directed towards the Alianza Americana Anticomunista (American Anticommunist Alliance, or AAA), which is a right-wing, anti-Communist paramilitary group associated with Colombian military intelligence. Operating in support of regular Colombian National Army forces, the AAA has been implicated in a 1978 bombing of the Colombian Communist Party’s headquarters, as well as their newspaper. CIA assistance would involve arms shipments of small arms, advisors, and possible intelligence sharing.\n\n3. Lastly, the destruction of coca fields should also be accomplished. This strategy, including burning fields, cutting plants, or spraying plots from airplane using chemicals. CIA forces, supplemented by Colombian Air Force units, should be able to accomplish these operations, which are designed to eliminate drug cartel operations in Colombia and prevent funding to be provided to FARC and other Communist militias.\n\nSpecific proposals on each operation should be delegated to Colombia Desk, Latin America Desk, Directorate of Operations, and should be cleared with the Directorate for Analysis and the Director before being forwarded to Special Activities Division."
 CIA_LATAMa.3.d:0 "\"Mr. President, the CIA Director has some news on Colombia.\"\n\"Send him in, and thank you.\"\n\nPresident [USA.GetLeader] smiled, shaking hands with [GetCurrentCIADir] as they sat down at the Resolute desk, the Director pulling out a file from his briefcase and laying it on the table.\n\n\"Mr. President, with your approval, the CIA would like to begin extended operations against the FARC in Colombia.\"\n\n\"Very well. Update me on who FARC is again.\"\n\n\"Mr. President, FARC is the Revolutionary Armed Forces of Colombia. They are a Communist guerrilla group currently fighting the Government of Colombia, whom we back. We intend on expanding offensive operations against them by providing further funding and support to the Government of Colombia, as well as escalating covert actions such as embedding agents into FARC cells and conducting targeted assassinations of FARC leaders and prominent figures to cause dissent in the movement.\"\n\n\"Very well. What is the CIA's prediction of these operations being successful?\"\n\n\"Very high, Mr. President. We hope that in particular with the assassinations, FARC will become internally divided and may split into warring factions which the Colombian Government will be better equipped to handle. As well, the CIA plans on cooperating with the government on a nationwide anti-FARC campaign in order to show the damage and destruction they have caused to the people of Colombia.\"\n\n\"Good, Director. This is approved. Please keep me updated on all events.\" The President signed a piece of paper, as the Director smiled, placing his file back into his briefcase and preparing to leave. \"Thank you, Mr. President.\""
 CIA_LATAMa.4.d:0 "As Jimmy banked the Air Tractor AT-301 slightly, he yawned, rubbing his eyes as he checked the compass and the map laying in his lap to confirm his heading. He had just passed over the small city of Pasto, in the southwestern Narino Department of Colombia, and as his turboprop winged above the mountains at 10,000 feet, he felt lonely.\n\nIt was approximately two in the morning, Bogota time, and as Jimmy continued to fly, he re-checked his tank indicator gauge, making sure that the tank was full of glyphosate herbicide, as well as dropping altitude to approach his series of targets; three coca fields, spaced roughly a klick or two apart, in the Patia valley.\n\nSquinting to make out the first one, Jimmy smiled as he saw a flashing light, pointing out his forward air controller squad, code-named \"AGUILA\", who was tasked with distracting the cartel men and signaling the sprayer plane. Jimmy heard some automatic weapons fire as he began his pass, unsure whether it was AGUILA or the Medellin men. He smiled and waved at nobody as he dropped to 200 feet, punching the \"drop\" button to let loose some 100 gallons of herbicide into a fine mist over the coca plants, before pulling back up to a safe altitude, to do it two more times.\n\nAs he completed his last run, pulling to 10,000 feet once again, Jimmy was reminded of his first days as a crop duster in the Midwest, flying routine spraying missions, when he was stopped by a CIA recruiter. \"How would you like to do some work for us down south, son?\""
 CIA_LATAMa.5.d:0 "As President [USA.GetLeader] walked back into the Oval after a short break between meetings, he was nonetheless surprised to see further charts being set up on tripods near his desk, and aides fluttering about, handing out folders and packets.\n\n\"Mr. President, we believe that the situation in the Colombian conflict has deteriorated to such a degree that US intervention is necessary to support our goals and the goals of the Colombian Government.\" National Security Advisor [GetCurrentNatSecAdv] spoke up first, breaking the silence in the room.\n\nCIA Director [GetCurrentCIADir] spoke up next. \"Sir, our embedded operatives have strongly urged more offensive operations. The Colombian Government is fumbling, and is struggling to contain both FARC and the other Communist militia groups, as well as multiple drug cartels that are competing for influence and ability to distribute cocaine. Our operations can help, but can only go so far.\"\n\nSecretary of Defense [GetCurrentSecDef] nodded. \"We have begun implementing and adjusting contingency operations for Colombia. State can tell you more, but the Pentagon has tasked US Southern Command to take primary control of military operations. Preliminary recommendations include the use of air strikes and intelligence sharing against FARC forces, in order to allow Colombian forces to engage Cartel groups.\"\n\nThe President finally found a chance to speak up. \"Give me the diplomatic angle before I clear any military action. This situation is complicated enough as it is.\"\n\nSecretary of State [GetCurrentSecState] broke in. \"Our diplomatic relations with the Colombians have been cordial and effective. Our Ambassador in Bogota reports that US military and political assistance to Colombia has been successful thus far, but that the military faces a large corruption problem. He recommends dealing with that by halting some aid in exchange for reforms.\"\n\nThe President nodded. \"Very well. Thank you all, folks. Keep me updated, and I want regularly updated reports and plans from the Pentagon and Joint Chiefs. Nothing military-oriented happens without my signoff.\""
 CIA_LATAMa.6.d:0 "Based on a rather threatening request by the American Ambassador, our top generals have instituted an anti-corruption initiative within the Military Forces of Colombia. Presumably as a part of pressure initiated by the Americans, who have been providing millions of dollars worth of aid and advising, the top military commanders have created an \"Anti-Corruption Unit\" which will go about investigating petty and major corruption, particularly among officers and noncommissioned officers.\n\nIt is hoped that this will go somewhere, as the commanders have pressure to maintain it and allow the unit some autonomy, as it will report both to the Colombian General Staff and the President, as well as issue some limited reports to the American Embassy in Bogota."
 CIA_LATAMa.7.d:0 "\"Hello?\"\n\"Secretary, this is Embassy Bogota. The Ambassador would like a word.\" The phone clicked as the line changed to the US Ambassador to Colombia.\"Secretary, hope you’re doing well this morning.\"\n\"Yes, Ambassador, I am. What’s this about?\"\n\"The Colombians have asked that we get further involved in the conflict, besides our current policy of providing overt military assistance in the form of assets and advisors. I’m hesitant to call the Pentagon as our Defense Attache really wants them to deploy troops and I don’t want to escalate.\"\n\"Very well, Ambassador, thank you. What do we suggest that State does in the meantime, in order to possibly hold off the Pentagon and USSOUTHCOM?\"\n\n\"Secretary, I think we should designate FARC as a Foreign Terrorist Organization; you have authority to designate groups under the Immigration and Nationality Act of 1965. We then make multiple statements; I make one, you make one, the Pentagon makes one. It looks like we have a united front, we don’t necessarily have to have POTUS’s permission, but we can read him in. It would be \"symbolically\" declaring war on FARC without pushing it through the Oval Office or the Hill.\"\n\n\"And the Colombians?\" The Secretary frowned into the phone.\n\"They won’t know the difference. All they’ll hear is \"declare war\" and take it literally, and then the Pentagon can start deploying small numbers of troops to Colombia from Panama or Florida.\"\n\"Okay. Thank you Ambassador, I appreciate your forwardness. I’ll consult with staff and we’ll move on this as soon as possible. Thanks again. Goodbye.\"\n\nHe put down the phone, sighing but thinking about what he had just heard. A genius idea."
 CIA_LATAMa.8.d:0 "Unsurprisingly, simultaneous statements from Foggy Bottom and the Pentagon were released today, as the United States Secretary of State officially listed the Fuerzas Armadas Revolucionarias de Colombia, known as the Revolutionary Armed Forces of Colombia (FARC), as a Foreign Terrorist Organization under section 219 of the Immigration and Nationality Act of 1965. In tandem, the Pentagon announced further defensive aid for the Colombian government in its fight against FARC, as well as sending further assets, advisors, and units of the United States Southern Command to task in Colombia. Facing normal praise in the West and criticism in the East, Colombia has welcomed this announcement as tacit American involvement in the conflict."
 CIA_LATAMa.9.d:0 "ANTI-CARTEL AIR OPERATIONS: OPLAN\nHeadquarters, United States Southern Command\n\nAttached below are orders for subordinate units of United States Southern Command as regards operations in Colombia, focused on targeting Cartel positions in the country in order to reduce capability, support units of the Colombian Air Force, and protect American interests in the region.\n\n1. Units and detachments of the 24th Composite Wing, based from Howard Air Force Base in Panama, are authorized to engage all installations and headquarters of the Medellin and Cali Cartels in southwestern Colombia. The 24th Composite Wing Commander is authorized to use all available aircraft, including but not limited to A-7 Corsairs, C-130 Hercules, O-2 Skymasters, and UH-1 Huey helicopters.\n\n2. Units of United States Navy Carrier Air Wing Two (CVW-2), based on USS Ranger (CV-61); including Fighter Squadrons 1 and 2, Attack Squadrons 25, 113, and 145 armed with A-6E Intruders and F-14 Tomcats, are authorized for similar strikes on Medellin and Cali cartel installations on the western coast of Colombia, in cooperation with Air Force flights.\n\n3. Support units of Joint Task Force Bravo, stationed in Soto Cano Air Base, Honduras, along with all other support units from USAF Southern Air Division and Carrier Air Wing Two, are authorized to provide airfield and aircraft maintenance, weapons handling, target verification, and other support services.\n\nAll USN and USAF Commanders will independently select and verify target lists based on CIA and DIA intelligence reports and embedded personnel. All target lists are to be promulgated via US Southern Command and the White House before operations commence.\n\nSIGNED\nCommander, United States Southern Command"
 CIA_LATAMa.10.d:0 "Today, a Department of Defense spokesman at the Pentagon announced the official expansion of US air operations in Colombia against major drug cartels in the region. Designating United States Southern Command, based in Doral, Florida, as the primary command for these operations, the Pentagon stated the reason for these strikes was to \"protect American interests and partners in Latin America, ensure the end of cocaine trafficking in the region, and to assist the Military Forces of Colombia in their ongoing counterinsurgency mission.\"\n\nAccording to further briefings from US Southern Command spokesmen, units involved include the 24th Composite Wing of the United States Air Force based out of Panama, as well as squadrons based from the USS Ranger carrier group, which intends to operate off the coast of Colombia. Reactions to this have been mixed, but the messaging has primarily been of assistance to the Colombian government, and of counter-drug enforcement operations which serve to assist all parties, regardless of ideology."
 CIA_LATAMa.11.d:0 "FARC INTELLIGENCE REPORT FNSJBFB-NN\n[GetDateText]\n\nThe latest intelligence from our cells, spread out throughout the country, have indicated the following information, specifically about expanded American air operations against our targets and Cartel targets.\n\nCells have reported spotting several types of American aircraft, including A-6 Intruders, A-7 Corsairs, C-130 cargo aircraft, and many UH-1 Huey gunships and utility helicopters. The presence of A-6 fighter aircraft, which are carrier-capable, suggests that the Americans are running some operations from a carrier group off the Colombian coast. The other aircraft appear to either be based from somewhere in Panama, or local aircraft stationed at Colombian military bases.\n\nFARC and friendly militia installations and camps have generally not been targeted by American forces, although a few cells have been affected by collateral damage or have lost weapons caches and vehicles. The Americans appear to be attacking Cartel positions, focusing on the Medellin and Cali Cartels who operate in western and southern Colombia, as their focus appears to be counter-drug enforcement operations, as opposed to standard counterinsurgency operations, against a force such as ours.\n\nSome regional leaders have expressed concern that these ongoing American operations will allow the Colombian regular forces to concentrate on FARC units, as well as deny our organization crucial funds required to keep the fight going. However, our capability remains high and we will persevere despite these imperialists bombing our land."
 CIA_LATAMa.12.d:0 "The analysts sat around the table, sipping coffee and waiting as CIA Director [GetCurrentCIADir] came in, only a short step from his office on the 7th floor of the Original Headquarters Building, at Langley.\n\n\"Good morning, gentlemen.\" The Director smiled and shut the door. \"Let’s get right into it. Tell me everything you know about Pablo Escobar.\"\n\n\"Yes, Director. His full name is Pablo Emilio Escobar Gaviria. Born December 1949, raised in the city of Medellin, in northwestern Colombia. Heavily involved in criminal enterprises since he was a teenager, including stealing cars and kidnapping of businessmen. First arrested in 1976 by the Colombian Security Service for trafficking cocaine from Ecuador. Escobar began to assert his influence, turning to bribery and assassination of officials, hiring gunmen and trafficking ever-increasing amounts of cocaine out of Colombia, and north into the United States, initially through Miami and the Bahamas.\"\n\n\"The corresponding cocaine boom in the early part of this decade has only increased demand for cocaine from Colombia, and has increased competition between Escobar’s Medellin Cartel, and their rival, the Cali Cartel. However, Escobar and his men appear to be caught in the middle. They oppose both the Colombian Government who wants to restore security, while also opposing FARC and remaining against Communist interference. According to Ops, CIA has tried to contact Escobar to seek cooperation, but has thus far failed. The Agency must come to a decision on what to do with him, and fast.\"\n\n\"Thank you, gentlemen. I see. Are you proposing we take out Escobar and his lieutenants?\"\n\"Yes, sir. DEA, understandably, and FBI are all over this idea; but they don’t have the resources or pull to make it work themselves. They know the CIA has the influence and funding, and we’ve done assassinations successfully in the past.\"\n\"So what’s the plan?\"\n\n\"Ops has proposed tracking Escobar’s movements for the next few weeks to establish a pattern of analysis as to where he and his lieutenants go; alternating between his home city of Medellin, and various homes that he owns in Cartagena, Colombia, and one in Miami. It may be that he lets down his guard enough to take a weekend off and that’s when we strike. Operatives from CIA, DEA, MACV-SOG, et cetera, will organize a strike proposal option, likely at his property at Cartagena, where we take Escobar, preferably alive, but dead will work as well.\"\n\n\"Very well. We will not read the President on this unless absolutely necessary.\""
 CIA_LATAMa.13.d:0 "USE OF ANTI-COMMUNIST CARTELS IN COLOMBIA\nColombia Desk, Latin America Desk, Directorate of Analysis\nSECRET/NOFORN\n\nThe situation of drug trafficking cartels in Colombia has presented an unusual situation for all involved parties, including the United States, in protecting US interests. While most cartels maintain an anti-communist ideology in the frame of expanding profit margins for their cocaine trafficking operations, they also must contend with continual interference and attacks from the Colombian Government, as well as share some practical ideals with Communist militias and other groups.\n\nIt is the opinion of this Office that certain large non-Communist cartel groups, such as the Medellin Cartel led by Pablo Escobar, should be co-opted and folded into a general, government led, anti-communist alliance. This Office believes that the Cartels already have the money, distribution networks, and weapons required to combat FARC and other Communist militias, and if we are able to make deals with major cartels (on issues such as cocaine distribution and/or immunity from prosecution) we may be able to receive further Cartel aid and reduce the number of belligerents in the conflict. Consolidation must be key."
 CIA_LATAMa.14.d:0 "SITUATION UPDATE: MEXICO DESK\nMexico Desk, Latin America Desk, Directorate of Analysis\nSECRET/NOFORN\n\nDespite other conflicts and tumult occurring in the majority of the Latin American world, the US neighbor to the south, Mexico, is facing a unique situation as well. While maintaining rather cordial relations with the United States, Mexico is single-handedly responsible for the transshipment of over 50% of US imports of marijuana and heroin, both Schedule I controlled substances under the Controlled Substances Act.\n\nThe Mexican Government, led by President [MEX.GetLeader] is facing similar drug control problems as do nations further south, such as Colombia. Use of herbicide spraying and involvement of the Mexican Armed Forces in drug enforcement operations has proven unsuccessful, as the country remains a central point for both production of marijuana and heroin, as well as a staging point for trafficking of cocaine from other states, including Colombia. However, it is worth noting that unlike other Latin American drug-producing states, the Mexican population consumes very little of the drugs that it produces and trafficks.\n\nUnited States policy until now has been to force diplomatic pressure on the Mexican government to adopt more stringent control measures, which it has done most of the time, with varying degrees of effectiveness. This Office, along with other Mexican-focused offices and desks of the intelligence community and State Department, has proposed two possible changes in strategy to assist Mexico in its ongoing drug problem, and to advance American interests in the region.\n\n1. The United States could begin a covert approach to Mexico, operating to engage cartels without the knowledge of the Mexican government. This may be preferable instead of attempting to diplomatically pressure the Mexicans, and potential operations might include training of anti-Cartel militias, covert assaults on Cartel bases and installations, and an increase of DEA operations and funding.\n\n2. American policymakers might also consider a possible intervention in Mexico in order to forcefully stabilize the situation. It is hoped that this would be an international intervention and may involve a United Nations process. It is imperative that the Mexican government be consulted in this, in order to maintain friendly relations with Mexico and ensure no ill will. If Mexico is willing to accept international observers and aid, they will be better equipped to handle the drug issue.\n\nIt is this Office’s hope that one of the two strategies will properly align the United States toward a path of good drug enforcement and adequately stabilize the drug situation in Latin and Central America."
 CIA_LATAMa.15.d:0 "COVERT APPROACHES IN MEXICO\nMexico Desk, Latin America Desk, Directorate of Analysis, Directorate of Operations\nSECRET/NOFORN\n\nAs relations between the United States and Mexico have deteriorated, the US intelligence community and State Department has determined that a covert strategy in the ongoing drug war is the next step in American policy as concerns Mexico and drug enforcement operations. This Office recommends the following:\n\n1. Training anti-Cartel militia units, also known as autonomous self-units, in municipalities and cities, specifically where Cartel activity is known to be high. The purpose of this is to train local Mexican citizens to defend their communities and to provide local autonomy in anti-Cartel operations, devolving authority to local governments.\n\n2. Conducting special forces raids on Cartel bases and installations; using resources of CIA, DIA, Delta Force, and SEALs, strategically attacking, raiding, arresting, and killing Cartel leaders and lieutenants, as well as delivery drivers and convoys, in order to interdict and send a message to Cartels that the US means business.\n\n3. Expansion of DEA border funding, as well as Border Patrol resources. This funding, pulled from already-appropriated CIA funding, would provide DEA and Border Patrol resources to continue to interdict and arrest Cartel members and drug trafficking through the US border and ports of entry, as well as approving additional jurisdictional powers for those agencies to continue their operations.\n\nIt is this Office’s hope that further covert operations and cooperation with relevant US and Mexican agencies and officials will effectively interdict drug manufacturing and trafficking in Mexico, thereby stopping the flow of drugs into the southern United States and protecting our security at home and abroad."
 CIA_LATAMa.17.d:0 "It was dusk in the desert, and as the sun slipped below the horizon, the hot temperatures quickly began to cool. Thank god for that, Mason thought as he sipped on a bottle of water, waiting for it to get darker. He was sitting in a Ford Econovan, with Mexican plates of course.\n\n\"Hey Gene, how’s it looking back there?\"\n\nGene, his partner operative, nodded. \"Looking good, boss!\" He checked the hastily equipped surveillance equipment again, before loading the last bullet into his SIG Sauer P220 pistol, sliding the other loaded one across the floor to Pickett.\n\nThe radio crackled to life again, indicating the near presence of the assault team. \"Overwatch, this is Dog One. Dog One, approaching LZ. Situation report, come on!\"\n\nGene picked back up. \"Dog One, this is Overwatch. Target Alpha all clear. Cleared to storm. Storm, storm, storm.\"\n\nJust as he had finished, three Hughes 500D helicopters shot over the van, about 50 feet above them, coming to a landing inside the courtyard of the Cartel compound. Five soldiers, clinging to each chopper, jumped off, taking tactical positions, as the choppers lifted back off, providing covering fire from the air.\n\nGene and Mason moved out of their position as well, as the van pulled forward from its hidden position and stopped, fishtailing outside the entrance. The two CIA agents, rushing towards the courtyard, fought their way to the DEA assault team, who were busy laying fire down, arresting surrendering Cartel members, and inspecting the bodies of the handful they had killed on the way down.\n\n\"Looks like we struck at the perfect time.\" Mason said, taking a second to reload his pistol before moving to clear another room."
 CIA_LATAMa.18.d:0 "It was a cloudy morning in Washington as the Administrator of the Drug Enforcement Agency walked into the DEA headquarters building, located at 1405 I Street, only blocks from the White House and National Mall. As he got upstairs, to the top floor, entering his office, there was a note on his desk from his secretary, something about a call to his office from an unknown number, asking to speak to him. Most calls were screened, but this was from a government phone.\n\nGetting to work on some reports, the phone rang about 20 minutes later. He picked it up, expecting any number of people on the other end; his wife, a subordinate, et cetera.\n\n\"Hello?\"\n\"Is this the DEA Administrator?\"\n\"Yes, to whom am I speaking?\"\n\"This is Langley. Check your operating budget accounts. There should be some new funds in there, in the neighborhood of $20 million. You’re welcome.\"\n\"What?\"\nClick.\n\nThe DEA Administrator just looked around, before setting the receiver down. What the hell, he thought. More money to do drug interdiction programs, I guess, he thought a second later."
 CIA_LATAMa.19.d:0 "\"Mr. President, we have a proposal on a solution to the Mexico issue.\"\n\nPresident [USA.GetLeader] paused from whatever business he had been attending to before, surely something less important than whatever was going to emerge from CIA Director [GetCurrentCIADir]’s mouth. The Secretary of State, [GetCurrentSecState] was standing behind him, so that had to mean something.\n\n\"Go on, Director.\"\n\n\"Well, sir, the CIA has run an analysis of the situation in Mexico, US policy, and they’ve come up with an alternative to what we’re doing now. We propose an international intervention, either led by the United States or the United Nations, into Mexico, in order to stabilize the internal situation as well as provide crucial counter-drug and interdiction operational capabilities.\"\n\n\"I see. Do we plan to read the Mexicans in on this, Secretary?\"\n\nThe Secretary of State nodded. \"Yes, sir. We plan to make an announcement as well as an inquiry through the US Ambassador in Mexico City, with their options being that we will provide them aid and training, or if they refuse, we will attempt to find an international consensus via the United Nations and Organization of American States.\"\n\n\"I see. Consider this signed off, gentlemen. I presume the other alternative was to continue covert operations in Mexico?\"\n\"Yes, sir. We had considered that, but seeing as our relations with the Mexicans appear to be good right now, the diplomatic option may be preferable.\"\n\"Very well. Thank you, gentlemen.\"\n\n\"Thank you, Mr. President.\" The two men exited out of the Oval, and glancing at each other, stood in the corridor for a minute. \"Secretary, I hope you know what you’re getting into. Might want to get international support now while you can.\""
 CIA_LATAMa.20.d:0 "The US Ambassador to Mexico has come to our Secretariat of Foreign Affairs and Secretariat of Defense with a proposal to combat our ongoing drug enforcement problem in the country.\n\nThe White House, apparently concerned with our ineffectiveness in combating Cartel drug production and trafficking operations in Mexico, has proposed an international intervention in Mexico in order to stabilize the situation and to allow for assistance to the government to improve the enforcement.\n\nThe Americans have offered international law enforcement aid in the form of funding as well as cross-border cooperation in interdiction, but some officials within the government are concerned that allowing the Americans to dictate drug policy in their own country is invasive and counterproductive to political goals. However, the US Ambassador made clear that all in all, the US will get involved, like it or not. A crucial decision must be made, whether to enlist their help or to stand firm against Yankee domination over our affairs."
 CIA_LATAMa.21.d:0 "After a short conference with Mexican diplomatic and national security officials, the US Ambassador in Mexico City has reported back to Washington, indicating that the Mexican Government is open to American aid with drug enforcement operations.\n\nApparently seen as a quite controversial topic in some corners of Mexican political life, the issue was seen as a net benefit, and already, American DEA and Mexican Federal Police have met to discuss border cooperation and possible operations. Intelligence sharing is also expected to take place, and the Pentagon has already floated deploying some military advisors and security personnel to assist with the Mexican Secretariat for Defense.\n\nLatin American analysts have expressed optimism for the future, hoping that further US-Mexican cooperation will stop major Cartels from continuing their influence in Mexican politics, and halt the rapidly increasing drug problem in the United States."
 CIA_LATAMa.22.d:0 "After a terse meeting with Mexican diplomatic and national security officials, the US Ambassador in Mexico City has reported back to Washington that the Mexicans are staunchly against an American intervention or assistance in their country, on the grounds that further American influence in their country will continue to erode the political and social situation as well as continue the ongoing drug problem.\n\nThe Mexican Secretariat of Foreign Affairs has included a public statement, revealing the plan, harshly condemning the request as \"a nicely framed tactic of American imperialism in Latin America,\" and that \"Mexico will not be co-opted for American interests further south. We can deal with the ongoing drug trafficking problem ourselves without US or international interference.\"\n\nOfficials in the intelligence and defense communities have reportedly been furious, along with President [USA.GetLeader] being briefed about the ongoing developments. It is clear that if the Mexicans will not comply, we will make them comply by all means necessary; even if it means turning to the international community."
 CIA_LATAMa.23.d:0 "In Mexico City today, a spokesman for the Mexican Secretariat for Foreign Affairs confirmed the previously unsubstantiated reports that the United States was seeking an intervention in Mexico against the ongoing drug cartel crisis. Mexican officials unequivocally condemned any possible intervention as \"American imperialism in Latin America, the likes of which have been seen before in Brazil, Guatemala, and Cuba.\"\n\nAmerican officials are reportedly disappointed by this development, but have vowed to continue on with a possible intervention. Some pundits have posited that the United Nations, or the Organization for American States may be contacted, but time will tell."
 CIA_LATAMa.24.d:0 "It was a sunny day as President [USA.GetLeader] gathered with his staff and subordinates for a small but formal ceremony. Gathered were the Secretary of State, [GetCurrentSecState], CIA Director [GetCurrentCIADir], National Security Advisor [GetCurrentNatSecAdv], the Director of the FBI, the DEA Administrator, and the Chief of the Border Patrol.\n\nThey were all assembled there, no press, yet, because the President was signing an important, yet somewhat archaic and traditional, document; a presidential proclamation. But this was no ordinary proclamation; one that would also be accompanied by a joint resolution of Congress confirming its contents; a presidential proclamation declaring the United Mexican States to be a narco state, a country operating around the business of producing and trafficking drugs.\n\n\"By the authority invested in me as President of the United States of America, I hereby proclaim the following:\nBecoming more rapidly concerned over increased flows of marijuana and heroin into the United States via its border with Mexico;\nConcerned that Mexican law enforcement and military units are not effective nor capable of engaging in the Cartels on their own;\nRecognizing the integral role that corruption, particularly of Cartel influence, in the Mexican political system plays in the above effectiveness of law enforcement in drug interdiction operations;\nI, as President of the United States of America, declare and proclaim that the United Mexican States is now considered a narco state under the above facts, and issues all warnings to civilians via relevant sources, such as the Department of State, of the dangers of traveling to Mexico for their own safety.\"\n\nThe President sighed as he signed his name to the proclamation, knowing full well that this would only be the beginning to what was surely going to be an interesting situation for his administration."
 CIA_LATAMa.25.d:0 "As Secretary of State [GetCurrentSecState] sat in his office, he checked his schedule, before hearing a buzz from his outside secretary.\n\"Secretary, you have calls from Ambassadors and Latin America Desk on lines one through four.\"\n\nPicking up the phone, he hit \"LINE 1\".\n\n\"Good morning Ambassador, how are you? What’s the situation in London?\"\n\"Secretary, the British seem ambivalent about supporting an international drug enforcement mission. They have little influence or reason to get involved in Mexico, but the Foreign Secretary didn’t indicate that they’d vote against it.\"\n\n\"Very good, thanks Ambassador. Have a good day.\" The Secretary murmured a goodbye before hitting \"LINE 2\".\n\"Ambassador, how is it looking in Paris?\"\n\"Secretary, the French are interested in contributing to a drug monitoring mission. They said they won’t vote against it in the Security Council.\"\n\"Very good, thanks.\" The Secretary tersely switched to \"LINE 3\".\n\n\"Secretary, I know what you’re going to ask. The Brazilians, Argentinians, and Chileans are all in support of your program. The Colombians might be, but as you know they’re bogged down at the moment. Most of Central America is also in support except for Nicaragua, of course.\"\n\n\"Thank you, Latin America Desk. Keep your analyses going. Have a good day.\" The Secretary felt bad but he had to keep this short, switching to his last call, \"LINE 4,\" the Ambassador to the United Nations.\n\n\"Mr. Ambassador, how is your work going in New York?\"\n\n\"Secretary, it’s been mixed. The Mission and I have been working around the clock to contact the other Missions here and get them on board, particularly the Security Council members and the Eastern Bloc, but very little luck so far. Many members outside of Latin America either do not care or consider it further US imperialism. We are trying our best, Secretary, and are working on language for a draft resolution right now.\"\n\n\"Thank you, Mr. Ambassador. Keep up your good work and keep up the reports. If you need a call from me, patch it through my office. The President wants this to happen and god damn it, I’m going to try to make this work.\""
 CIA_LATAMa.26.d:0 "It was the regular meeting of the United Nations Security Council, and as the members entered the meeting room of the Council in New York, they began to suspect a trap. The American representative, having already arrived, was going over papers, aides standing nearby. They looked up as the Soviet, Chinese, British, French, and non-permanent representatives sat down, being gaveled into order by the chair. Typically, the American Ambassador stood up first, launching immediately into their speech.\n\n\"Ladies and gentlemen of the Security Council, today I called a meeting to discuss an issue which the United Nations has dealt with before. Our neighbor to the south, Mexico, has had a continual drug enforcement problem, with multiple large cartels producing and trafficking marijuana and heroin across the border into the United States. This is affecting our youth, causing hundreds of deaths and addiction on both sides of the border, and providing organized crime with millions of dollars for their own uses.\"\n\n\"The Mexican government has attempted to use their law enforcement and military sources to counter these cartels but has been ineffective in this goal. The United States has tried to request to help, but the Mexican government has resisted our advances at every turn. This is an issue which not only affects us, but the entire Latin American region, if not the entire world. The War on Drugs is an international issue, and one that we, as a global leader, want to solve, with the assistance of the UN.\"\n\n\"As the American representative to the United Nations Security Council, I hereby place the following resolution onto the table, to condemn the drug crisis in Mexico, authorize a United Nations Monitoring and Enforcement Mission in Mexico, and authorize the United States to take action to restore the rule of law in Mexico and eliminate drug trafficking operations.\"\n\nSitting back down, the entire room erupted in a low murmur. As the American delegation sat in their corner of the room, they knew that this would only be the beginning."
 CIA_LATAMa.27.d:0 "Surprise at the United Nations in New York came today as the United States Permanent Representative on the Security Council approached the body and submitted a draft resolution concerning the ongoing drug crisis in the region.\n\nSubmitted days after the Mexican Government denied an offer for intervention to prevent drug trafficking, as well as US President [USA.GetLeader] declaring Mexico as a narco-state in a presidential proclamation, the draft UNSC resolution firmly condemns the ongoing drug crisis and Mexico’s ineffectiveness in stopping it, authorizing a United Nations Monitoring and Enforcement Mission in Mexico, and placing that Mission under the leadership of the United States to restore the rule of law in Mexico and combat drug trafficking.\n\nWidely seen as an international example of the United States’ ongoing policy of the \"War on Drugs,\" the Security Council is widely divided on this; with the Soviet delegation and others condemning such blatant messaging but also not indicating any vetoes. Much of the non-Communist Latin American states appear supportive, with the obvious absence of Mexico."
 CIA_LATAMa.28.d:0 "Good news has arrived from our Permanent Representative to the United Nations today, as they have confirmed that the Security Council has approved our draft resolution on the Mexico issue.\n\nUnder consultation from the Secretary of State and Secretary of Defense, the UN resolution stipulates the formation of a United Nations Monitoring and Enforcement Mission in Mexico, managed under the command of the United States and other participating countries. The resolution also firmly condemned the Mexican government for their ineffectiveness thus far in preventing drug trafficking.\n\nOfficials in Foggy Bottom, the Pentagon, and New York are quickly coordinating to establish a group of participating countries, as well as pre-positioning military assets near the Mexican border to begin the operation once it is formed by the UN."
 CIA_LATAMa.29.d:0 "Unfortunate news has emerged from United Nations Headquarters in New York City, as the United Nations Security Council, acting under the influence and sway of the United States, passed a resolution authorizing the formation of a United Nations Monitoring and Enforcement Mission in Mexico.\n\nApparently displeased with our government’s effectiveness thus far in combating the drug crisis, the UN has granted American forces permission to lead the Mission, with international personnel and support from the region and around the world.\n\nMany within the government, including President [MEX.GetLeader] are very displeased, and are urging any and all resistance to UN and American forces. Time will tell what the Mission does, how it operates with this crisis, and how we will respond"
 CIA_LATAMa.30.d:0 "Further surprise from United Nations Headquarters in New York City came as the United Nations Security Council, led by the United States, approved a draft resolution authorizing a UN Monitoring and Enforcement Mission in Mexico. Apparently recognizing the need for international drug control and enforcement, all five Permanent Members of the Security Council agreed on the issue, with no vetoes, even from the Soviet Union.\n\nPlacing the United States as primarily in charge of the Mission, it is expected that operations in Mexico will begin shortly. International support, both within the Security Council and in the General Assembly, will be required to receive more volunteers and enforcement personnel. Mexico, while not having officially commented, has had major government officials express extreme disapproval, and it is expected that Mexican government interference in Mission operations will occur on almost all issues."
 CIA_LATAMa.31.d:0 "Unfortunate news has emerged from UN Headquarters in New York today, with our Ambassador to the United Nations calling the White House and informing [USA.GetLeader] that the Security Council resolution regarding Mexico has failed, with a veto by the Soviet Union, effectively ending any meaningful proposals the US had.\n\nState and Defense Department officials are reportedly furious, with members of the UN delegation in New York attempting to gain some traction in the General Assembly for a draft resolution there. However, any chance of a UN monitoring mission in Mexico has failed, due to Eastern Bloc interference and influence."
 CIA_LATAMa.32.d:0 "Good news has arrived from the Permanent Mission of Mexico to the United Nations, that a proposed draft resolution in the Security Council forming a UN Monitoring Mission in our country has failed, due to a veto by the Soviet Union, one of the five Permanent Members of the Council.\n\nSenior government officials are reportedly pleased, while diplomatic sources in the United States report that many State Department and White House officials are furious, and may be turning to contingencies to achieve their goals. It is still not known what the United States will do to continue this issue, but we can at least be safe from an international intervention for now."
 CIA_LATAMa.33.d:0 "More news has come from UN Headquarters in New York today as the United Nations Security Council rejected a US-authored resolution to form an international monitoring and enforcement force in Mexico to control the ongoing drug crisis there. According to UN officials, the resolution failed due to a veto by the Soviet Union, one of the five Permanent Members of the Council.\n\nWhile Mexican officials are reported as being relieved by this development, American officials are furious, particularly after they had mounted a campaign of international support for drug enforcement operations. It is not immediately clear if the US will act alone to solve the issue, but only time will tell."
 CIA_LATAMb.0.d:0 "It was a rainy Monday morning in the Oval Office, and as the President settled in with his cup of coffee, he prepared for yet another exciting briefing from his core group of national security staff; CIA Director [GetCurrentCIADir], National Security Advisor [GetCurrentNatSecAdv], and Secretary of State [GetCurrentSecState], along with a flurry of aides.\n\n\"Mr. President, I’m sure that you’d agree that right now, our best course of action is to maintain an anti-Communist priority in the Latin American region.  Focusing on the cartels will not get us anywhere in the region, as the United States and allies would be focused on fighting groups from both sides. While the cartels are dangerous, Communist guerillas in Central and Latin America are even more dangerous, and have the institutional capacity to overthrow US-supported governments. It is our opinion that this should be the number one priority in the region.\" The National Security Advisor opened up.\n\n\"Very well then. Director, what does CIA propose to do to support intelligence efforts as a part of this plan?\"\n\nThe CIA Director looked through some notes then spoke. \"Mr. President, the CIA has primarily concentrated its proposals and analysis on Panama. The leader there, General Manuel Noriega, has been trained at the School of the Americas, is a strong anti-communist, and previously served as head of intelligence for Panama before he became leader. We believe he and his government will be a crucial asset in the region. As well, our focus on drug trafficking has primarily looked at cocaine, and possibly trafficking it to fund further operations against the Communists.\"\n\nThe Secretary of State broke in before the President could respond. \"Mr. President, as well, State has looked into expanding relations with anti-Communist Central American states such as Honduras, Guatemala and El Salvador. State has determined that possible inducements could be arms sales, economic aid, trade relation normalization, et cetera, if they continue to support intervention against Communist guerillas.\"\n\nThe President nodded, setting down his cup. \"This sounds like a good, well-coordinated plan. My only concern is how public we should go. CIA operations should stay covert, while diplomatic actions remain public. We do not brief Congress on this unless they ask, understood?\"\n\n\"Yes, Mr. President.\""
 CIA_LATAMb.1.d:0 "\"What is this general’s name again?\"\n\"General Manuel Noriega, Deputy Director.\"\n\nThe two analysts, having spent days preparing reports on Latin America, were seething at the proposition of having to simplify every bit of information for the CIA Deputy Director for Operations, as they sat in a conference room somewhere in Langley.\n\n\"Okay. Noriega. What about him? What does the Latin America Desk have on him?\"\n\n\"Born in 1934, joined the Panamanian National Guard in the 1960s, was educated at the School of the Americas in 1966, was posted to anti-union operations for the United Fruit Company. Noriega rose through the Panamanian military, supporting Torrijos’s claim to power, and became his head of intelligence. During that time, he exiled over a thousand Panamanians that he deemed dissidents and became involved with narcotics trafficking; American law enforcement picked up on this in the 1970s but let it lie. In 1971, relations between Panama and the United States, particularly on intelligence, had become close enough that CIA placed Noriega on the payroll, and since then CIA has paid him about $100,000 to almost $200,000 a year, depending on the administration and budgetary priorities. Noriega is now the leader of Panama, succeeding Omar Torrijos when he died in 1981.\"\n\n\"Excellent, thank you.\" The DDO paused for a minute to think. \"The DCI and President have communicated to me some possible concerns about keeping Noreiga on the CIA's payroll, especially with increased scrutiny from Congress and his past dealings with drug trafficking. Is it worth keeping him on payroll, gentlemen?\"\n\nThe analysts looked at each other, then at their notes, then forward. \"Yes, sir. We believe Noriega has a unique position as leader of Panama and has the ability to funnel weapons and intelligence support to Contra forces in Nicaragua, and his location with the Canal allows a large strategic advantage. His past with drug trafficking may be able to be rectified via inducements by us or State, and some troops are still stationed near the Canal Zone. Enforcement is definitely possible.\"\n\nThe DDO nodded. \"I see. Very well, we’ll keep him on the payroll for now. Thank you, gentlemen.\""
 CIA_LATAMb.2.d:0 "Responding to some concerns in the White House and Capitol Hill about the usefulness of maintaining relations with Noreiga’s regime, the United States today, via the Embassy in Panama City and covertly, communicated further support for General Manuel Noriega and his government.\n\nWhile not specific about what the support would entail, it is expected that the US will provide economic aid, trade relations, military aid, in exchange for Noriega’s government continuing to support anti-Communist operations. The CIA Chief of Station in Panama City has privately expressed support for further American operations in the country and in Central America at large."
 CIA_LATAMb.3.d:0 "ANTI-COMMUNISM IN CENTRAL AMERICA: IN BRIEF\nOffice of Latin American Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nIn the fight to drive Communist influence out of Central and Latin America, the United States has depended heavily on anti-Communist regimes and friendly states to maintain the rule of law and order against radical guerrilla movements. Backing anti-communist leaders and parties in Guatemala, Honduras, El Salvador, and Panama will be a responsible strategy to maintain influence in the following ways:\n\n1. Providing diplomatic support will ensure that those countries have adequate legitimacy and backing by a superpower, as well as the ability to receive economic aid and further international support in organizations such as the UN. This will increase trade ties and will ensure the continuing success of those countries.\n\n2. From the Pentagon, defense support will ensure that those countries receive equipment under the Military Assistance Program (MAP) in accordance with other anti-Communist states. Our analysis has concluded that their military capabilities are still years behind many European militaries, but equipment for counterinsurgency operations will be helpful for them.\n\n3. Finally, covert support in the form of intelligence sharing, embedding CIA operatives, training, and basing agreements will allow our operatives and intelligence operatives from those countries to properly coordinate resources and operations together to determine locations of Communist cells and methods of attack.\n\nIt is this Office’s sincere hope that these three prongs will serve as the main defense strategy for maintaining US influence, and preventing Soviet and Cuban influence, in the Latin American region."
 CIA_LATAMb.4.d:0 "Apparently as part of a renewed push by the American government to maintain influence in the region and drive out Communist incursions and rebel groups, the United States has announced an expanded backing program of anti-Communist Central American countries, including Guatemala, Honduras, El Salvador, and Panama.\n\nThis support, reiterated by US Embassies in each country and by Foggy Bottom, consists mainly of defense support in the form of Military Assistance Program (MAP) arms sales and troop training. Additionally, diplomatic relations are expected to be beefed up along with economic and development aid being sent to each of the countries.\n\nReactions to this announcement have been mixed, with most government officials pleased that their American overlords will continue to support them regardless of their actions"
 CIA_LATAMb.5.d:0 "POSSIBLE USES FOR DRUG CARTELS: IN BRIEF\nOffice of Latin American Analysis, Directorate of Intelligence; Drug Affairs Desk, Directorate of Operations\nSECRET/NOFORN\n\nThe presence and influence of drug cartels, organized crime syndicates focused on the trafficking of drugs such as marijuana, heroin, and cocaine, in Latin and Central America has proved a challenge in the multipolar geopolitical situation in the region. Cartel organizations, such as the Medellin Cartel in Colombia, the Guadalajara and Gulf Cartels in Mexico, and other, smaller organizations throughout the region have immense power and influence, as well as funding, weapons.\n\nOur analysis has determined that these cartels appear to be anti-communist in nature, although they are politically and ideologically malleable; the first priority of these organizations is to produce and traffic drugs, regardless of the political affiliation of their buyers. Some analysts have hypothesized that many cartel members, in the lower echelons, may be former disgruntled guerrillas that desire a change in their life and additional money.\n\nThis Office believes that the cartels mentioned above are in a financial and ideological position to be used for political benefit to the United States and its interests in Latin America. This could take the form of the following:\n\n1. American assets could assist in smuggling and other trafficking operations of narcotics around the region, with the particular focus on assisting large cartels in Mexico and Colombia. This would net the Cartels more earnings, ensure that their deliveries are not interdicted, and provide legitimacy that they are being supported by a major power.\n\n2. American assets could also assist the organization known as Muerte a Secuestradores (MAS), a Colombian paramilitary that is known to be funded by the Cartels already and has conducted many counterinsurgency operations against the Communist FARC and M-19 movements in Colombia.\n\n3. American intelligence personnel could also consider some limited domestic operations, including stonewalling or otherwise interfering with FBI and DEA investigations into drug trafficking, particularly if they are targeting Cartel members that the US supports."
 CIA_LATAMb.6.d:0 "Steve Wilkins leaned across his two-and-a-half-ton truck, smoking a cigarette as he watched the men, not 100 feet from him, unload a small Cessna 182 Skylane that had just been powered off and parked. He looked around, into the Nicaraguan jungle, more than a dozen klicks from anywhere, and then noticed the three or so armed rebels, nothing more distinguishing them than the FN FAL battle rifles they carried.\n\nAs he continued to smoke, he watched as the Contras unloading the plane moved bricks and bricks of cocaine, \"snow,\" into his truck, hiding it away in the far back, or in boxes of other cargo marked as \"humanitarian aid.\" He nodded to the men, who nodded back; confused about what they were doing, they’d see soon enough as the money began to roll in.\n\nAs they finished, he smiled, turning to the lead commander of the local Contra unit, slipping him a few cordobas before getting in the truck and starting his albeit short, but rather dangerous, journey to the coast.\n\nJust over an hour after he had left, Wilkins, code name \"SKI LIFT\" had reached his rendezvous point; a little fishing village, which he never learned the name of, on the Atlantic side of the country. There, he spied what appeared to be a small shrimp boat, rusted out, camouflaged in some near-water vegetation. Pulling close to it, he got out, taking a swig of water before lighting another one up, as he waited for the boat’s pilot to come to shore.\n\nHe didn’t know the pilot’s name, and probably wouldn’t have wanted to if the situation had presented itself. Shaking hands with the considerably tanner-skinned man, they began loading the bricks into the boat, three or four at a time. It took a few trips, this being a bigger shipment, but the two got it done, and promptly lit up again, shaking hands, before the pilot got in his boat, starting it and beginning to coast off, headed to Miami.\n\nSteve stood, watching, stamping out the butt of his cigarette. This had been a long deployment, but whatever Langley wanted, it got. At least it was a fairly routine mission."
 CIA_LATAMb.7.d:0 "Our efforts to smuggle larger and larger amounts of cocaine into the United States and throughout the region has been helped today by the assistance of American CIA operatives, who have been deployed to our strongholds in Nicaragua to assist with transporting the drugs across the borders, as well as with production of cocaine and protecting facilities from FSLN incursions and drug enforcement actions.\n\nIt appears the Americans are helping us primarily so that we can obtain funding for weapons and operations ourselves, instead of being dependent on them for covert funding. Their operations are going well, but it is unclear how long this is going to last, particularly because assistance to us, particularly with drugs, is seen as unpopular among congressional and administration officials."
 CIA_LATAMb.8.d:0 "Oscar Danilo Blandon sat in his van, in South Central Los Angeles, just waiting. It was a quiet summer day, and as he sat, he thought about how far his cargo had traveled from where it was made. Grown and refined in Colombia, smuggled via plane north to Nicaragua by Contra connections, hauled cross-country, onto a shrimp boat, shipped to Miami, and making its way via unmarked van to unmarked van all the way to Los Angeles, where he picked it up.\n\nHe was waiting for his partner, Ricky Ross. A Black native of this particular LA neighborhood, Blandon had been told that Ross was the only drug dealer in the city who had contacted the Colombians. This was great. Blandon had to count again, but he figured there were a couple million dollars worth of cocaine in the back. A tidy little sum to help his comrades in Nicaragua, fighting the communist bastards.\n\nRoss walked up, and shook hands with Blandon as he got out of the van. They were sitting outside a park, which was empty at the moment; thank God for that, both of them thought. Blandon popped open the back of the van, and the two of them got in, closing the door. They had to make this quick, before a \"black-and-white\" LAPD patrol car came.\n\n\"Holy shit, man!\" Ross whispered, seeing the bricks and bricks of cocaine. Blandon nodded. \"It’s two or three million dollars there, if I had to guess. The Cartel made a larger batch this time.\"\n\nRoss smiled. \"Nice, man, nice. Let’s go take this back to my place, and I’ll call my dealers up, and we can get going. I’m really excited about this, and I think all my buyers will think this is great. By the way, where is the money going? Back to the Cartel?\"\n\nBlandon looked down at the bricks then back up. \"If I tell you, does it affect our deal?\"\nRoss looked around. \"No? Drugs are drugs. I was just curious.\"\n\"The Contras. Freedom fighters in Nicaragua, fighting against the tyrannical communist regime. The money is going to them for arms and operations.\"\n\nRoss nodded. \"Good.\""
 CIA_LATAMb.9.d:0 "\"What the fuck is this memo?\" The secretary outside the DDO’s office winced as she heard her boss yell. While not a rare sight, she mustered up the courage and walked in.\n\n\"Sir, that memo is from the DDI and Latin America Desk. Apparently, they find it prudent to consider drug distribution here, in order to finance the Contras.\"\n\n\"Get me the DDI on the phone now! Fuck!\"\n\n\"Yes, sir.\" She had never seen him this mad, but punched the line through to the DDI’s office, which was nearby but not close to the DDO on the Seventh Floor at Langley.\n\n\"Deputy Director for Intelligence’s office. Who’s this?\"\n\"YOU KNOW DAMN WELL WHO IT IS!! PUT YOUR BOSS ON THE LINE!\"\n\"Yes, sir.\" There was a click, then the DDI picked up. \"Yes?\"\n\"What the FUCK is this memo that I’m reading?\"\n\"Well, it’s what it looks like. Our analysts have looked it over and have come to the conclusion that helping the Contras to distribute their cocaine in the US and in other states will net them enough funding and influence to become more self-sufficient then they are right now.\"\n\"Are you fucking nuts? You know if this ever gets out, DEA is going to be up my ass, FBI is going to fuck me and the Hill? They’d crucify us! Do you hear me?!\"\n\n\"Congress might think twice when the Contras take their country back from the Sandinistas.\"\n\n\"Enough. Ops is not greenlighting this. End it. We’re done here.\"\nClick.\n\nThe secretary turned slowly, trying to gauge the DDO’s mood. He still seemed angry, but the room was strangely quiet."
 CIA_LATAMb.10.d:0 "As the Latin America Desk staff gathered together for their weekly meeting, they settled in with coffee and pastries, being careful not to stain the files they had on the conference table.\n\n\"Well, I’ve been looking into a new group that’s been making the rounds in Colombia,\" said Jim, the analyst focused on the Colombian conflict. \"They call themselves Muerte a Secuestradores, or \"Death to Kidnappers.\" The Desk Director nodded, letting him continue.\n\n\"MAS appears to be formed and founded by the major drug cartels in Colombia, including the large Medellin Cartel led by Pablo Escobar. Their main mission is not offensive, but defensive in nature, protecting Cartel and prominent landowners’ property as well as preventing kidnapping attempts by other paramilitaries. Other major funders appear to be the Colombian military and oddly enough, Texaco, based here in the United States.\"\n\nThe Desk Director nodded. \"I see. So this MAS. Where do they fit into our policy?\"\n\n\"Well, sir, MAS presents the perfect opportunity to become involved in Colombia without committing too many resources. They are committed anti-Communists, having conducted operations against FARC and M-19, the major Communist guerrilla groups in Colombia; they are connected with the drug cartels, in particular the Medellin Cartel, allowing US assets to contact the Cartel directly and initiate further operations.\"\n\n\"Interesting, Jim. Give me your report and I’ll pass it up the chain, we’ll consider backing MAS. Should be easy enough.\""
 CIA_LATAMb.11.d:0 "Sources from within the Colombian military and intelligence services are reporting that the United States has begun covertly supporting the Cartel-founded paramilitary group known as Muerte a Secuestradores (MAS), or \"Death to Kidnappers.\" Founded by the Medellin Cartel and assisted by some units of the Colombian Army, MAS was formed to protect Cartel and landowner property as a defense group as well as prevent kidnappings of Cartel members.\n\nThe Americans did not inform us of this development, perhaps out of a suspicion that we intend on prosecuting the Cartels. The US Ambassador in Bogota has made no comment, however, we have requested the CIA Chief of Station to report to brief our intelligence officials. It is not clear whether this will actually happen."
 CIA_LATAMb.12.d:0 "As Bob sat in the back of a nondescript Chevrolet Caprice, bumping along across rural roads, a jeep in front, he thought about what he was embarking on. After what seemed like weeks of searching and inquiries via agents and informants, the CIA Chief of Station in Bogota had tasked him with meeting The leader of the Medellin Cartel, none other than the infamous Pablo Escobar, at one of his villas in rural Colombia.\n\nHe was nervous but knew that nothing major would probably happen. He and Escobar already knew what was going to happen, and surely the Cartel wouldn’t do anything to him, unless they wanted to invite large amounts of American firepower and the dismantlement of their organization.\n\nPulling up to Escobar’s villa, he got out of the car and was promptly searched (again) by two of Escobar’s lieutenants, while a few others watched from various distances, carrying automatic rifles. Bob was unarmed, of course, but they had to check again and again.\n\n\"Good evening, Senor Escobar,\" Bob said, after he had been searched and escorted into the villa, where Pablo was sitting with a few lieutenants and other Cartel figures.\n\n\"Welcome to the real Colombia-\" Escobar extended his hand and paused.\n\n\"It’s Bob, Senor Escobar. Very nice to finally be able to meet you. I’m sure you know what this is about.\" They shook hands.\n\n\"Yes, Bob. I’ve been told from some of my lieutenants that your CIA wants to expand collaboration with us and help with trafficking. I am interested but reluctant; how can you help us?\n\n\"Well, Senor Escobar, we propose helping out with Cartel trafficking operations, primarily through directing it through Miami and across the Mexican border into the United States. There are plenty of American cities that are just discovering this cocaine of yours and it is a big market, particularly in Los Angeles. The funds you earn will both go back here to support your Cartel and the ongoing conflict in Colombia, as well as some funds to go to the Contras in Nicaragua, who are doing the same thing.\"\n\n\"I see.\" Escobar paused, taking a moment to think before pouring out two glasses of aguardiente, a local liquor. \"I will have to discuss it more with my traffickers, but I like this idea. I think we have similar ideas and goals, and, if your CIA is able to get the Colombian government off my tail, we’re in business.\"\n\n\"Yes, I believe we can do that.\" Bob, seeing that Escobar was doing the same, took a glass, clinking it to Pablo’s as they toasted, marking the deal as done. \"To more money for the cause!\""
 CIA_LATAMb.13.d:0 "OPERATION JUNGLE SNOW: OPLAN\nHeadquarters, United States Southern Command\n\nAttached below are orders for subordinate units or attached units under United States Southern Command as regards operations in Colombia, focusing specifically on targeting Cartel leadership in the country.\n\n1. The 1st and 2nd Battalions of the 7th Special Forces Group, United States Army Special Forces, based from Fort Gulick, Panama, are to deploy to Colombia, in particular focusing on Bogota and the city of Medellin, and are authorized to conduct strikes on property and individuals associated with the Medellin Cartel, the Cali Cartel, and other Cartels within Colombia. In particular, the above units are authorized and ordered to target Pablo Escobar, the leader of the Medellin Cartel, in their operations.\n\n2. Units of the 210th Combat Aviation Battalion, United States Army, based from Fort Kobbe, Panama, are to deploy to Colombia with the 1st and 2nd BNs, and are authorized to provide transport, strike, and interdiction services using UH-1 Huey and CH-47 Chinook helicopters to ground units.\n\n3. Operatives of the Central Intelligence Agency, located in [REDACTED] are to assist in providing intelligence and targeting support to the units of the 7th SF Group and 210th Avn BN. All targeting orders are ordered to be authorized individually by the Operational Commander, who will be the Commander, 193rd Infantry Brigade (Panama).\n\nUSSOUTHCOM will maintain operational readiness in case the situation escalates, will expect daily reports from the Operational Commander, and the fullest cooperation with CIA and other intelligence support officers.\n\nSIGNED\nCommander, United States Southern Command"
 CIA_LATAMb.14.d:0 "MANUEL NORIEGA AND US RELATIONS: AN UPDATE\nPanama Desk, Office of Latin America Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nIn the intervening period since the US has continued its support for Panamanian leader General Manuel Noriega, circumstances have changed in which the United States intelligence community may reconsider Noreiga’s usefulness to maintaining American influence in Central and Latin America.\n\nWhile General Noriega has contributed greatly to American security policy in Latin America, his behavior is undeniably a liability for US influence in the region. In particular, Noriega’s possible connections with organized crime, Cartels, and drug trafficking of cocaine presents a significant concern and development for future US-Panama relations.\n\nAccording to operatives and law enforcement personnel following Noriega’s activities, he has been involved with cocaine trafficking since the beginning of the decade, using covert transportation networks also used by the CIA to send funds and weapons to anti-Communist movements in the region. Primarily, Noreiga’s network has run out of Miami, where it is then spread to the rest of the United States. FBI and DEA personnel confirm this but are unable to take any punitive action against Noriega and his government.\n\nAdditionally, CIA confirms that opposition figures in Panama such as Hugo Spadafora and Colonel Roberto Diaz Herrera also have knowledge of Noriega’s drug trafficking operations and have attempted to uncover them in the Panamanian popular media. Noriega’s government has not taken kindly to this, and Spadafora has not been heard from in several days, indicating that he possibly may have been killed or arrested. Neither men have been considered threats to the state before and are not left-wing in political ideology; in fact, both served under Torrijos’ government.\n\nThis Office hereby recommends a serious evaluation of Noriega’s usefulness to US interests in Latin America; if the allegations of drug trafficking are true, which seems to be substantiated, it is highly encouraged that the United States cut ties with Noriega, and consider taking punitive action towards Panama, including freezing all aid packages, arms shipments, covert transfers, assistance, and enforcing drug interdiction operations until the regime can be stabilized."
 CIA_LATAMb.15.d:0 "It was a sunny Monday morning in the Oval, as CIA Director [GetCurrentCIADir] and National Security Advisor [GetCurrentNatSecAdv] came into the room for their daily briefing. Today would be just an ordinary briefing, but with one new item on the agenda: General Manuel Noriega of Panama.\n\n\"Good morning, gentlemen. I trust we’re doing well at Langley?\" President [USA.GetLeader] looked up, smiling.\n\n\"Yes, sir, all’s going well there. Here’s your Daily Brief for today.\" The National Security Advisor laid the PDB down on the desk.\n\n\"Great. What’s first on the agenda?\"\n\n\"Panama, sir. CIA’s been reconsidering the effectiveness and usefulness of keeping General Manuel Noriega within our sphere of influence and assisting his regime. There are allegations that he’s been conducting drug trafficking operations in Panama and moving cocaine between Colombia and Miami. He has also persecuted former allies who have attempted to uncover the drug trafficking operations, and Langley is concerned about the possible effect this could have.\"\n\n\"I see, what do you mean?\" The President nodded, thinking.\n\"Congress might catch wind, and that’s never good. We may lose international support in other places if we don’t respond to this promptly.\"\n\n\"Who cares about Congress? I say we keep Noriega in line with us.\" The President had spent the last few minutes actually reading the brief in front of him, which happened to highlight Noriega’s help in security issues in Latin America.\n\n\"Consider this, gentlemen. We have backed Noriega for years, he has been very friendly with us; we have provided him and his military with millions of dollars worth of weapons in their fight against Communist forces to their north; and Director, how long has this trafficking been going on?\"\n\n\"For years, sir. At least since he took office officially.\"\n\n\"So why now is all this coming to light? I see no reason why we need to cut the cord now. Doing that would only make our situation in Latin America worse. He’s an asset.\"\n\n\"Yes, sir.\" Both men responded. The Director looked up. \"Sir, we can issue a confidential statement to the Panamanians via their military or CIA, to reassure them of our continuing support.\"\n\nThe President nodded. \"Yes, it sounds good.\" He looked around. \"What’s next on the agenda?\""
 CIA_LATAMb.16.d:0 "According to unofficial reports from diplomatic officials in Washington, as well as sources within the US Embassy in Panama City, the US will continue to support the government of Manuel Noriega, despite a rather vocal opposition that questioned his usefulness in American foreign policy as regards his past with illicit drug trafficking, as well as other allegations.\n\nSenior American intelligence officials had been grappling with the issue of whether to maintain support for Noriega for weeks, particularly as the conflicts in Colombia and Nicaragua continue to rage on. Our government has yet to respond, although the only public response should be one of optimism and continued support. However, in the shadows, it is imperative that we contact the Americans and demand a reason for their reluctance."
 CIA_LATAMb.17.d:0 "It was a sunny Monday morning in the Oval, as CIA Director [GetCurrentCIADir] and National Security Advisor [GetCurrentNatSecAdv] came into the room for their daily briefing. Today would be just an ordinary briefing, but with one new item on the agenda: General Manuel Noriega of Panama.\n\n\"Good morning, gentlemen. I trust we’re doing well at Langley?\" President [USA.GetLeader] looked up, smiling.\n\n\"Yes, sir, all’s going well there. Here’s your Daily Brief for today.\" The National Security Advisor laid the PDB down on the desk.\n\n\"Great. What’s first on the agenda?\"\n\n\"Panama, sir. CIA’s been reconsidering the effectiveness and usefulness of keeping General Manuel Noriega within our sphere of influence and assisting his regime. There are allegations that he’s been conducting drug trafficking operations in Panama and moving cocaine between Colombia and Miami. He has also persecuted former allies who have attempted to uncover the drug trafficking operations, and Langley is concerned about the possible effect this could have.\"\n\n\"I see, what do you mean?\" The President nodded, thinking.\n\n\"Congress might catch wind, and that’s never good. We may lose international support in other places if we don’t respond to this promptly.\"\n\n\"Very well. I’m convinced. It’s time to let him off the payroll. Get the Secretary of State, I want the Ambassador in Panama City on the phone soon as well. Call the NSC in. Director, I want you to initiate operations at Langley to end the aid and pull our operatives, the ones assisting him, out of there. We need to be fast about this, pretend like we were never there.\"\n\n\"Yes, Mr. President.\" The CIA Director and National Security Advisor nodded, and went to make some calls. It would be a long day and an even longer night."
 CIA_LATAMb.18.d:0 "Shock radiated throughout Panama City today as confidential sources at the US Embassy reported that the United States was pulling back support for Manuel Noriega’s government. According to senior diplomatic and intelligence officials, Washington was becoming increasingly concerned about Noriega’s usefulness to American foreign policy, along with his erratic behavior and allegations of involvement in illicit drug trafficking between South America and the United States.\n\nNoriega himself has not made a statement, as he has not yet been briefed on the matter; it is expected he will not be pleased. Senior defense and diplomatic officials in Panama City who have been briefed already are indicating plans to accelerate the phased-out withdrawal of US troops from the Canal Zone, and other punitive actions, such as possibly declaring embassy officials as \"persona non grata\" and forcing them to leave. It is unclear what our response should be, but this is not good."
 CIA_LATAMb.19.d:0 "It was dusk as a small, inconspicuous convoy of vans, heavy-duty trucks, and sedans approached the border checkpoint on the Paso del Norte International Bridge, connecting El Paso, Texas, with Ciudad Juarez, Mexico. There was little traffic, and as the lead car, a gray, unmarked Ford Granada, stopped for inspection, they noticed there was slightly more police presence than normal; not on the American side, but on the Mexican side. In addition to the usual customs and border officers, were located Federales, on watch.\n\nThe convoy moved smoothly through, no issues, even with the trucks marked \"Arizona Helicopters Inc.\" and \"Pacific Corporation.\" The border guards didn’t bother inspecting the cargo, and they wouldn’t have liked what they saw. Hundreds of automatic rifles, thousands of rounds of ammunition, M72 anti-tank rocket launchers, a few Stingers; they’d have to train the men on those, but no problem. The larger trucks contained a few utility helicopters, completely disassembled, with their gun mounts ready for action. One of the operatives had said there was a Cessna somewhere, hidden away, apparently.\n\nAfter a few hours’ drive south from Ciudad Juarez, the convoy approached its destination; one of the central bases of the Guadalajara Cartel in Chihuahua State. They would conduct the training here, then the Cartel would distribute the equipment throughout their territory.\n\nThe operative got out of the lead car, lighting up a cigarette as he watched the trucks pass by, leading into the main parking area of the compound. This would be a long deployment period, and all his operatives knew it. The Cartel would be trained, because they were important to the US government, but whether they would be cooperative was another story. They are criminals in the eyes of normal people, after all. But no one here was a normal person."
 CIA_LATAMb.20.d:0 "Reports from the Federal Security Directorate and the Secretariat for the Interior seem to indicate that major Cartel leaders in Mexico, including the leaders of the Guadalajara and Gulf Cartels, appear to have received new arms and protection equipment of US make and model. DFS agents have conducted surveillance on Cartel properties with the assistance of Mexican Army and Federal Police units, and have determined that new US-made equipment, apparently received from a US company called \"Arizona Helicopters Inc.\" has been delivered to Cartel units; including small arms, heavy machine guns, armored pickup trucks, and a few old-model UH-1 Huey helicopters and Cessna airplanes.\n\nPresident [MEX.GetLeader] is reportedly furious at this development, particularly with the mixed relations that Mexico and the United States have. Some senior members within the government are expressing surprise at why the Cartels would be protected, particularly from enforcement operations by Mexico, an ally of the United States, ostensibly. It is unclear why this is, and the US Embassy in Mexico City has been unable to answer any questions on the matter. Time will tell."
 CIA_LATAMb.21.d:0 "As the joint FBI-DEA task force sat down for their meeting, a sunny morning in El Paso, Texas, they looked deadly serious. This had not been the first meeting; just a regular situation update for the two agencies.\n\nThe DEA agents began with their presentation first. \"Our investigation into local Cartel activity has yielded significant results. The cross-border connection between El Paso and Ciudad Juarez is rather significant; although the transfers of drugs from Mexico into Texas are small-scale in nature; usually small amounts, a few pounds or two, via personal vehicles. DEA and ELPD have not seen large amounts of drugs over 5 pounds. Cartel activity in El Paso has been somewhat limited; we know there are members who are American nationals on the US side of the border operating as regional bosses and middlemen; however, we haven’t been able to connect them yet.\"\n\nThe FBI agents nodded. \"Alright. We know that there are large quantities of cocaine coming from the border cities; El Paso included, as well as Albuquerque, San Diego, and Laredo. FBI has identified a pair of dealers in Los Angeles who are receiving large shipments of cocaine from Colombian Cartels, but we’re not quite sure where. We may consider filing some federal warrants for bugging and other surveillance operations.\"\n\nBefore he could continue, a secretary came in. \"Special Agent, there’s a call for you.\"\n\nHe stepped out of the conference room, moving to his office to take the call.\n\"Hello?\"\n\"Is this Special Agent Jack Smith?\"\n\"Yes, who’s this?\"\n\n\"That’s not important. All you need to know is that we at Langley know about your investigation into Colombian Cartels. We know the judges you need to talk to. We know who you’re looking into, and it needs to stop now. Keep going, and you’ll learn the hard way not to mess with the Cartels.\"\nClick."
 CIA_LATAMb.22.d:0 "In rainy New York City, Vincent Gigante looked out onto the Manhattan skyline. There was another man sitting in his office; Italian descent, sure, but not \"from here.\" He looked, acted like one of those rotten feds. Head of the Genovese Family, one of the five great Mafia families of New York, he had been visited by this man with a proposition: the great tragedy in Nicaragua, and a way his family could profit. Surely there were a lot of Nicaraguan emigres in New York City, right?\n\nA thousand miles south, in sunny Miami, Florida, Jose Miguel Battle Sr. had been approached by three similar men. Colleagues of his, all former soldiers in Brigade 2506, having survived the abortive Bay of Pigs invasion, all here for the same reason. The Corporation, as it was known in Miami, the Cuban Mafia, as it was also known, could have great solidarity with this fellow anti-communist group in Nicaragua known as the Contras. Or that’s at least what they claimed.\n\nAlso in a famously sunny place, Southern California, members of the Mexican Mafia were being contacted. Some were in prison, some weren’t, but it didn’t matter. The men in black from Langley had their ways. California was an excellent transshipment point for cocaine, as was Miami, and the Mexican Mafia had a lot of influence both there and across the border in Tijuana.\n\n The men from Langley all had one goal. Criminal organizations had plenty of influence in the United States, particularly in urban areas where drug trafficking and crime was high. Surely they had to have the money, weapons, and resources to send to their brothers in arms in Nicaragua, right?"
 CIA_LATAMb.23.d:0 "More news has come from the CIA operatives assisting us; Langley has apparently directed operatives to work on rallying support for the Contra cause among organized crime groups in the United States. While not specific, the CIA has informed us that the criminal Cuban exile community in Miami, centered around Jose Miguel Battle Sr, a Bay of Pigs veteran himself has pledged support to us; as well as the Mexican Mafia, which is located around the US-Mexican border as well as Southern California. Additionally, two of the five prominent New York City Mafia families have also pledged their support for our cause, and are willing to shift funds, some mafia members, and weapons to the Contras to support our mission.\n\nMany within our organization are glad to hear this development, particularly the support from the Cuban Mafia. Others seem reluctant about the development, becoming worried of the lack of legitimacy among these criminal groups as opposed to a sovereign state like the US."
 CIA_LATAMc.0.d:0 "It was an overcast and foggy morning in the Oval Office as President [USA.GetLeader] sat, watching as his Secretary of State [GetCurrentSecState], Director of Central Intelligence [GetCurrentCIADir], National Security Advisor [GetCurrentNatSecAdv] and their flurry of aides enter the room, with files and papers seemingly flying everywhere. The President waited for the chaos to simmer down before opening up the room. \"Gentlemen, why are we here today?\"\n\nThe Secretary of State began. \"Well, Mr. President, State has had several meetings with CIA and defense officials about the future of US policy in Central and South America. In the past, the United States has taken the wrong step in that region, and we seek to change that.\"\n\n\"Go on, Mr. Secretary. I assume this means a more peaceful strategy as I have mentioned in my foreign policy positions.\"\n\n\"Yes, sir. We think that the US has needlessly enabled authoritarian right-wing regimes in Central and South America as part of a misguided attempt to combat the spread of communism in the region. While that has been marginally effective, it has had the unfortunate side effect of creating militarized states controlled by officers who have personal ambitions, creating even more instability.\"\n\nThe CIA Director broke in. \"Not to mention, Mr. President, this region is faced with a major drug trafficking challenge, something that our Agency has not seen on such a scale before. Large shipments of cocaine, heroin, and marijuana are moving north from Colombia, being shipped by cartels, and usually supported by right-wing governments. I know your administration has campaigned on ending the War on Drugs campaign, but this is an international issue that we need to take part in.\"\n\n\"Ensuring self-determination and the effective rule of law exists in Central America is critical, Mr. President. Democratic societies ensure greater accountability to all parties involved. In particular, we’d like to expand peace initiatives in Nicaragua, as well as determining cutting aid programs in Central America and reexamining our cooperation with General Noriega in Panama.\n\n\"Excellent, gentlemen. I trust you all to do this with the highest degree of professionalism and report to me with all changes. I expect to read at least once a week at least on this issue.\"\n\n\"Thank you, Mr. President.\" The men and their aides nodded in approval, as they exited the room, just as the sun began to show itself form behind the clouds, brightening the room."
 CIA_LATAMc.1.d:0 "It was a hot night in Oaxaca state as the jeep rumbled down the dusty street in Tehauntepec. The driver knew exactly where he was going, but the passenger, Ruben Ocampo, wasn’t so sure. All he knew was he had to meet some local officials, as his brief said, at their home tonight.\n\nOcampo looked around, noticing the barrio that he was passing through. It was nothing fancy, on the outskirts of town, unfortunately what you’d come to expect in this area, with these people. It was a shame what had been done to them, but that’s what he was there for.\n\nGetting out of the car, the \"investigative reporter\" walked down the driveway, watching the jeep roll away. He held a notebook in his hand, acting normal as ever. Knocking on the door once, he was ushered into the home, sitting down in the dining area, where three men and one woman sat, in traditional Tehuana dress. These people were indigenous Zapotec people, most of whom lived in the region, but they were important political organizers, albeit nearly underground due to PRI influence.\n\nWhat was said wasn’t necessary, but Ocampo asked them about their activism and organizing and how the local governmental authorities had ignored them. He asked them about how they felt about the cartels in their area; how they felt about the growing Zapatista movement in their area, and where they and their organization stood. Ocampo smiled, nodded, and cracked jokes; for all they knew, he was an investigative journalist with La Prensa, a Mexico City paper. Their conversation was not long but not short, and productive.\n\nAs Ocampo was whisked back out of the house, back to his driver, back to Mexico City, he reviewed the notes. This would be a long report to type up, one that hopefully his Chief of Station in Mexico City would appreciate. The indigenous groups seemed to be anti-government, anti-cartel, and pro-communist. Interesting stuff, he thought."
 CIA_LATAMc.2.d:0 "POLITICAL REFORMS IN CENTRAL AMERICA\nOffice of Latin American Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nThe geopolitical region known as Central America (including Guatemala, Honduras, El Salvador, Nicaragua, and Panama) have been plagued by continual political crises since the beginning of the postwar period. Attempts at political reform have been proposed and some implemented, but most have failed due to US or Communist interference. Therefore, this Office proposes the following general political reforms in order to improve democratic rule and the standard of living in the region:\n\n1. Executive reform, in the form of perhaps limiting presidential powers, including the power to declare war, declare a state of emergency, and powers relating to the command of military units. This would most likely require constitutional revision in most Central American states, which will require persuasion of the national legislature.\n\n2. Judicial and legal reform, in the form of strengthening Supreme Courts and national judicial branches. This can be accomplished by enshrining judicial review of constitutional and legislative actions which are designed to provide a balance to executive and legislative actions in those countries.\n\n3. Finally, military reform, in the form of introducing further checks against military coups, such as providing civilian leadership of the military, barring military officers from running for office, and restricting aid to Central American militaries who are not compliant with US enforcement regulations.\n\nThis Office, together with relevant US Embassies and the Department of State, believes urging these reforms will ensure adequate governing style and self-determination for that region, without excessive presidential powers or harassment from Communist forces."
 CIA_LATAMc.3.d:0 "A joint American State Department and CIA campaign has come to our region, encouraging a broad program of political reforms in our countries. Apparently in an attempt to guide Central American states toward an American model of government with representative democracy and republicanism, the US Embassy has urged reform of the executive and judicial branches as well as the military; including limiting the power of the President to declare states of emergency, combat insurgencies, as well as providing possible judicial review mechanisms. Finally, the US has proposed military reforms, which have angered some in our government, that have been \"designed to prevent further coups\" which in reality will weaken the influence and capability of the armed forces in the future if we choose to accept them.\n\nIt is unclear how our government should respond to this. Reforms are necessary, some say, to further democratize the country; but others contend that reforms would provide more influence to radicals of both wings within the country. There is also understandable concern that the military reforms will result in decreased capability. Many contend that reforms, especially dictated by the US, are not necessary, but perhaps acceding to demands from Washington will turn out to be good in the long run. How should we move forward?"
 CIA_LATAMc.4.d:0 "News has come in from our embassies in Central America that the governments in El Salvador, Nicaragua, Honduras, Guatemala, and Panama have all agreed, in principle, to political reforms that have been suggested by CIA chiefs of station, operatives, and State Department officials.\n\nSome of the political reforms, proposed by a Joint Working Group of CIA and State political advisors, have included executive reforms in order to curtail presidential overreach, judicial reform in the form of introducing judicial review and American-style legal systems, and military reform in the form of introducing civilian control of the military, eliminating corruption, and threatening to end MAP aid to those countries.\n\nLangley and Foggy Bottom are both rather surprised that these countries agreed to such reforms so easily, but are making immediate bounds in determining enforcement regimes to ensure that all parties adhere to the reforms they promised to do."
 CIA_LATAMc.5.d:0 "Unfortunately, news has come in from our embassies in Central America that the governments in El Salvador, Nicaragua, Honduras, Guatemala, and Panama have all rejected proposed political reforms that have been suggested by CIA chiefs of station, operatives, and State Department officials.\n\nSome of the ill-fated political reforms, including proposals to limit presidential overreach, introduce judicial review and American legal systems, and provide for civilian control of the military were all soundly rejected by each and every government, with the accusation of \"further attempts at imperialism from Washington into our internal affairs.\"\n\nLangley and Foggy Bottom are understandably furious over this development, particularly the reputation that will proceed once the international press catches wind of these developments. Damage control plans are in place, but neither agency, nor the President, will be happy about this development."
 CIA_LATAMc.6.d:0 "HANDLING COMMUNIST IDEOLOGUES IN CENTRAL AMERICA\nOffice of Latin American Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nIn our newfound plan to advance ideals of democracy and self-determination in Latin America, the problem of Communist parties and ideologues in all of those states presents a hindrance to our development. While the United States remains fundamentally opposed to communism, we cannot interfere in democratic processes, particularly those involving the left wing. Ideologues, however, present a fundamental threat to American influence and self-determination and must be sidelined.\n\n1. Coercion could be used to blackmail or otherwise extort Communist ideologues to either recant their ideology, change it to social democracy which will not be as politically radical as communism.\n\n2. Currency payments and other cost of living benefits may also be considered as a means of sidelining ideologues and Communist party officials in Latin America, although this strategy is not recommended primarily because this will increase dependence on further cash payments.\n\n3. Finally, appealing to ideologues’ and leaders’ egos may also be beneficial to sidelining them. Simply ignoring or directly fighting Communist leaders will not be effective, but properly sidelining them while making them feel successful will be effective in keeping them under control while we advance our plan.\n\nThis Office believes that properly sidelining the Communists covertly will maintain semblances of democratic values and self-determination without being overtly involved in the region, and not affecting other parties of the left wing."
 CIA_LATAMc.7.d:0 "Gentlemen,\n\nThe United States has appreciated your work and cooperation thus far with us in preventing the spread of communism throughout the Latin American region. However, it is time for us to end this relationship.\n\nYour activities surrounding trafficking of marijuana and cocaine have presented quite a concern to the current administration. Previous administrations and presidents may have tolerated this sort of behavior but it is in the best domestic and international interest of the United States not to collaborate with organized crime elements, particularly those in other sovereign states, and especially those that are responsible for funneling dangerous narcotics.\n\nThis letter serves as final notice from the United States Government that we will not continue cooperation with your criminal enterprise and will be eagerly supporting any and all law enforcement attempts to shut down your operations.\n\nRegards,\nPresident [USA.GetLeader]\nCIA Director [GetCurrentCIADir]"
 CIA_LATAMc.8.d:0 "It was a regular meeting at Langley, and as the DDO and his aides walked into the conference room, he saw the head of the Office of Latin American Operations sitting with his staff going over some reports, circling information, and frowning.\n\n\"I assume we’re because of Noriega, right?\" The DDO ventured a guess.\"Yes, sir. The watch officer for Latin America reported last night that a joint Miami PD-DEA task force seized a Panamanian-flagged cargo ship with hundreds of pounds of crack cocaine hidden aboard it.\"\n\n\"Shit.\" The DDO put his head in his hands.\n\n\"Yes, sir. Noriega denied any responsibility but we know he did it, he’s not even being careful anymore.\" The Ops officer shrugged.\n\nThe DDO straightened back up again. \"Alright. It’s done. We’re ending this.\" He pointed to the two men across the table. \"Stay here. I’m getting the Director and the National Security Advisor on the phone. We’re cutting Noriega off. Enough.\"\n\nWithin minutes, the Ops officer sat in shocked silence as Director of Central Intelligence [GetCurrentCIADir] came on the line, in addition to National Security Advisor [GetCurrentNatSecAdv]. The two other men agreed, and a call was put into the President, via the DCI. The Ops officer and his deputy sat, waiting for an order. He was sure the Chief of Station would have to be called too, but this was happening real fast, he thought."
 CIA_LATAMc.9.d:0 "Shock and confusion is whirling throughout the Palacio de Las Garzas today as the US Ambassador to Panama announced the revocation of further American aid to Panama. Precipitated by long-standing concerns over President Noreiga’s accused drug trafficking campaign, as well as his human rights record, the US has had enough and has halted all political, economic, and military aid.\n\nNoriega is lashing out, accusing the US CIA of interfering in the development of Panamanian affairs and the current White House administration of losing another ally. US sources, particularly the Embassy in Panama City as well as Foggy Bottom, begs to disagree."
 CIA_LATAMc.10.d:0 "The FBI-DEA joint task force out of El Paso sat down to what would probably be a short, unproductive, and unhelpful meeting. The task force had been designed in order to pool resources and help prosecute the drug issue in the El Paso-Juarez area but had been largely a failure so far. FBI Special Agent Smith was at his breaking point with the task force being hampered by unknown figures, jurisdictional issues, and piles and piles of mysterious paperwork.\n\n\"Morning, gentlemen.\" He nodded wearily at the DEA agents entering the conference room, who nodded back and sat down. They had all been out last night looking around, on a lead, but found nothing. \"Has your office had any more developments?\"\n\nSmith shook his head. \"No. The traffickers are able to get over the border undetected. We think they’re being assisted by someone but we don’t know who. This is awful.\" He was cut short by a secretary bursting in. \"Jack, call for you.\"\n\nHe stepped outside, expecting really something, anything. \"Hello?\"\n\"We’d like to help you out with your drug case in El Paso, Agent Smith.\"\n\"Who am I speaking to?\"\n\n\"That’s not important. Just know Langley wants to help our brave boys in the Bureau. We don’t hand out favors like this often, so take what you can get. Your office will receive a fax later with photos and document indexes. A courier will be by later with boxes of physical material. Your bosses are receiving a similar call right now. Don’t worry about them.\"\n\n\"What? Langley? Is this the fucking CIA?\"\n\nClick."
 CIA_LATAMc.11.d:0 "COMPROMISE WITH NICARAGUA?\nOffice of Latin American Analysis, Directorate of Intelligence; US Embassy, Managua\nSECRET/NOFORN\n\nAfter years of backing anti-Communist \"Contra\" forces in Nicaragua, currently ruled by a Marxist Sandinista government known as the FSLN, the United States may now be faced with a new opportunity to turn the tide in the conflict. Instead of continually backing the Contras, forcing a frozen conflict that would end in a stalemate, this Office recommends a compromise with the Sandinista regime to ensure parity between both parties and end the conflict.\n\n1. An immediate ceasefire and end to hostilities while negotiations begin. This will be on both sides, with the United States seeking to enforce the Contras from committing violence or attacks against Sandinista forces.\n\n2. The formation of a temporary Coalition Government, composed of equal amounts of Sandinista (FSLN), Contra, and democratic parties. This will allow a stable governing structure, and the maintenance of ceasefires, while further democratic reforms are put into place.\n\n3. Once the Coalition Government has been formed, elections will be held at an agreed upon time. These elections should be observed and enforced by international observers, both from the United States, other Central American countries, and teams from the United Nations and Organization of American States; to ensure that either party does not rig the election or otherwise coerce the populace into an unfair election.\n\n4. Finally, a constitutional convention will be convened with the cooperation of both the Sandinistas and the Contras to determine a new, pluralist, multi-party and democratic constitution, designed to ensure and enshrine a more permanent and democratic government, as well as the cooperation (or friendly competition) of the Contras and Sandinistas. Further reforms should press demobilization, military reform, and other changes designed to eliminate further outbreaks of violence in the country."
 CIA_LATAMc.12.d:0 "The US Ambassador to Nicaragua has come to the Office of the President of Nicaragua [NIC.GetLeader] with a compromise in our effort to crush the American-backed Contra, anti-Communist rebels.\n\nThe Americans, presumably in an attempt to extricate themselves from their proxy war against us, have proposed a ceasefire, the formation of a Coalition Government between our FSLN and the Contra rebels; the scheduling of free and fair elections, and a constitutional rewrite to ensure plurality and multi-party democracy.\n\nFigures in our government have had mixed reactions to this development. Since the Ambassador has come and gone, various ministers have voiced their support for or displeasure with the deal. Some think it would be a good idea in order to stop the conflict and perhaps invite better US perception of the regime; but many others, ideologically committed, have remained against it, convinced that the deal is not beneficial to Nicaragua and that submitting to US hegemony is not the way to solve the issue; instead, crushing the Contras should continue.\n\nThis is a difficult and nuanced issue, but the President wants to reply to Washington soon. How should we respond?"
 CIA_LATAMc.13.d:0 "Surprising news has come in from our Embassy in Managua that the government of Nicaragua, under the Marxist FSLN, also known as the Sandinistas, have accepted our proposal for a compromise to settle the conflict between them and the US-backed anti-Communist Contra guerilla groups.\n\nOur proposal, consisting of a ceasefire, the formation of a Coalition Government, a new constitution and free, observed elections, was reluctantly accepted by the Sandinistas in Managua today, with a government spokesman stating that \"concessions are necessary to ensure peace and stability in Nicaragua once again.\"\n\nFoggy Bottom and Langley are moving forward to implement a two-pronged program to begin the peace plan, with the CIA reaching out to Contra figures to begin a ceasefire between the two parties, and the State Department working out of the Embassy to maintain contacts with the Sandinista government as well as to gain international support via the UN and OAS for enforcement of the peace plan."
 CIA_LATAMc.14.d:0 "Unfortunate news has come in from our Embassy in Managua that the government of Nicaragua, dominated by the Marxist FSLN, also known as the Sandinistas, have rejected our proposal for a compromise to settle the Nicaraguan conflict between them and the US-backed anti-Communist Contras.\n\nOur proposal, consisting of a ceasefire, a Coalition Government, a new constitution and free elections, was soundly rejected by the Sandinistas as \"yet another attempt at US hegemony and imperialism in our internal affairs\" and \"weakening the security of the Nicaraguan state by introducing subversive and terrorist elements into the government.\"\n\nFoggy Bottom and Langley are furious at these developments, but realizing that peaceful negotiations have proven fruitless, are no doubt going to double down on efforts to support and arm the Contras to guarantee a military victory."
 CIA_LATAMc.15.d:0 "Surprising news has emerged from Central America, as the Nicaraguan Government, led by the Marxist Sandinista National Liberation Front (FSLN) announced a reconciliation to the ongoing Nicaraguan conflict. The FSLN, reluctantly agreeing to a ceasefire and peace deal brokered by the United States, has pledged to form a coalition government with the Contras, the anti-Communist guerrilla group backed by Washington, as well as other democratic parties.\n\nThe peace plan, endorsed by the Organization for American States and the United Nations, includes a ceasefire which has already been implemented, and in addition to the coalition government, will include free and fair elections with monitoring, and a new constitution ensuring multi-party democracy and pluralism. Many Central American countries as well as the international community herald this achievement as stopping another proxy conflict in the Cold War."
 CIA_LATAMc.16.d:0 "FUTURE OF AID DISTRIBUTION TO CENTRAL AMERICA\nOffice of Latin American Analysis, Directorate of Intelligence; Office of Latin American Operations, Directorate of Operations.\nSECRET/NOFORN\n\nDirector,\n\nIt has come to our attention, in both the Directorate of Operations and Intelligence, that Central American regimes are vastly abusing their power and influence supported by our Agency and the United States at large to commit drastic human rights violations and start conflicts in the region.\n\n1. Military aid to Central American regimes, including Honduras, El Salvador, and Guatemala, designed to augment their security services, has been misused, according to the Office of Latin American Analysis, instead being used for internal counterinsurgency operations, including extrajudicial killings, beatings, and destruction of civilian property. Little accountability has been shown by chief military leaders in all states involved.\n\n2. Economic aid to Central American regimes, designed to augment their agricultural and manufacturing capabilities as well as to improve infrastructure and communications systems, has been massively misused by each of the governments; instead, being diverted to coffers of prominent government officials, used as bribes, or placed in the budget of the military and other security services. There is no enforcement of economic reforms, nor is there enforcement of construction initiatives on the part of the United States.\n\n3. Covert aid, in the form of operatives and operational assistance in combating communist movements and drug cartels, is being hampered by high officials in governmental positions. Operatives within the Directorate of Operations have reported that their operations and orders from above have been stonewalled by uncooperative security services personnel, sometimes requiring bribes and other forms of coercion to accomplish designated mission goals.\n\nIt is the opinion of both Offices, and therefore both the Directorate of Intelligence and Directorate of Operations, that all forms of aid to Central American regimes must be stopped unless the United States can negotiate an enforcement plan with the countries receiving aid, and they pledge to submit to further checks."
 CIA_LATAMc.17.d:0 "Stunning news has appeared from the US Ambassador today as the United States simultaneously announced that they will be halting all aid to our country and other countries within the region if we do not take more action to ensure that the aid is not being misused.\n\nCiting concerns about mismanagement and corruption within our government and within the region at large, the United States has said that they will end all military, economic, and covert aid and assistance to us unless we agree to negotiate further enforcement of aid spending and use under their watchful eye.\n\nMembers within our government are split on the issue; prominent political and military officials argue that we can simply seek another, more agreeable benefactor, while lower-level officers and bureaucrats argue that acceding to further enforcement will provide a better option in the long run under US influence. How should we respond?"
 CIA_LATAMc.18.d:0 "Calls from US Embassies in Central America flooded in today, all with nearly the same message: the governments of El Salvador, Guatemala and Honduras have all acceded to American threats to revoke aid, based on accusations of corruption and mismanagement.\n\nOfficials from each government have made promises, in writing, to the US Ambassador in their country that reforms will be made to manage aid receipt and ensure that designated and earmarked aid will be used for specific purposes established by the State Department and CIA. In particular, emphasis was placed on ensuring that aid will be used for economic and infrastructure improvement, as opposed to the current use which is towards military officials, counterinsurgency operations, and bribes to prominent government officials.\n\nFoggy Bottom is pleased with this development and expects to brief the President and other diplomatic and security officials within the end of the day."
 CIA_LATAMc.19.d:0 "Unfortunate calls have come from US Embassies all around Central America this morning, all with nearly the same message: the governments of El Salvador, Guatemala, and Honduras have all rejected American threats to revoke aid based on accusations of corruption and mismanagement.\n\nOfficials from each government, all conducting press conferences, have condemned the American threats as \"continuing American attempts to influence every aspect of our internal affairs\" and \"reducing military aid will condemn your alliances with us and ensure the collapse of security in the region.\"\n\nPolicymakers in Langley and Foggy Bottom as well as multiple embassies and agencies are livid. The President has not been read in yet but the DCI and Secretary of State have been briefed. It is unclear if aid will actually be reduced, but we assume that President [USA.GetLeader] will end aid immediately upon this development."
 CIA_LATAMc.20.d:0 "OPERATION BLIZZARD BURN: OPERATIONAL PLAN\nHeadquarters, United States Southern Command; Federal Bureau of Investigation; Drug Enforcement Agency; Joint Drug Enforcement Force, Central Intelligence Agency\nSECRET/NOFORN\n\nAttached below are orders for units of USSOUTHCOM, FBI, DEA, and CIA to interdict and raid major Cartel strongholds in Mexico, Central America, and Colombia. These raids should be covert in nature but involve the cooperation of the local government and their security services.\n\n1. USSOUTHCOM forces, based from Panama, will primarily focus on maintaining open lines of communication, surveillance, and backup fire support to field agents of the FBI and DEA. USSOUTHCOM will also provide air and any other affiliated transport services, and maintain contacts with other security services and militaries in the region.\n\n2. FBI and DEA agents, working in a Joint Drug Control Task Force (JCDTF), will conduct the primary interdiction operations, having been granted clearance by higher authorities and the National Security Council to operate. This will be done primarily via designated Joint Strike Teams, who will utilize Task Force resources, as well as USSOUTHCOM assets, to raid Cartel strongholds and arrest or kill Cartel leaders and lieutenants.\n\n3. CIA operatives will primarily focus on providing intelligence support, surveillance, \"tagging\" of Cartel members and their locations, and generally providing targeting data and support to Joint Strike Teams and the Task Force. CIA will also be expected to contribute personnel to assist in interrogations and strike forces to enhance overall interdiction and operational effectiveness.\n\nAll agencies and commands have a certain degree of autonomy but all operations and responsibilities must be cleared with the Joint Task Force based in Panama before anything occurs.\n\nSIGNED\nCommander, U.S. Southern Command; Commander, USSOUTHCOM Detachment, Joint Drug Control Task Force"
 CIA_LATAMc.21.d:0 "A NEW LATIN AMERICAN POLICY\nOffice of Latin American Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nAs evidenced by our tumultuous changes in policy surrounding the Latin American region, it is time for the United States to fully consider a new Latin American policy, combining the ideals of self-determination, multiparty democracy, and correcting the mistakes of the past with greater assistance and drug enforcement operations, without overstepping our role.\n\n1. As previous administrations have proven, maintaining our reputation among Latin American countries is paramount. In the past, we have treated them as a vessel of exploitation, for economic benefit; by our government, or US corporations. However, the United States should not fall into the trap of installing right-wing governments in order to maintain a friendly face. Maintaining self-determination initiatives in the region should be the utmost priority as the United States has had a history of influencing elections in the past.\n\n2. Drug enforcement operations should also be highlighted as a primary concern of US-Central American cooperation, in addition to further military aid and training initiatives proposed by the Pentagon. In particular, the US wants to push a combined, international effort via the Organization of American States to end trafficking of cocaine and marijuana via military and law enforcement actions.\n\nThis Office believes that this double-pronged policy plan will stabilize the region without conceding to radical interests on either side of the political spectrum and will effectively maintain US influence with little to no belligerency."
 CIA_LATAMc.22.d:0 "As Director of Central Intelligence [GetCurrentCIADir] entered the large conference room, a hush fell over the room, among the business executives and senior vice presidents sitting there. None of them knew why they had been called here, just that their secretaries had been spooked by mysterious phone calls directing their bosses to come to Langley right away.\n\n\"Gentlemen, welcome to Langley. I’m sure you’re all wondering why we called you here.\" Most of the executives nodded. \"Some of you probably think we’re going to ask you to do some secret-spy missions, but that’s not why we’re here.\" That elicited a small laugh, which the DCI was glad about, because he was about to turn to a more serious subject.\n\n\"You’re here because your companies and corporations have heavy influence in Latin America. From Chiquita, to Cargill, to Freeport-McMoRan, industry is diversified and I’m sure that your shareholders and the local economies in the region appreciate it.\"\n\n\"However, we here at the Agency, as well as across the Potomac in DC, have become concerned about some of your actions. Many policy officials at State and Commerce believe your business practices are inherently destabilizing the region, and that your influence is helping to prop up right-wing and neo-fascist regimes in the region.\" The room was suddenly filled with a quiet hush of confusion, leading to a louder volume of blustering.\n\n\"Now, I admit that our government in the past has no better, but we have changed our ways and are committed to helping with reforms in the region. You all know as well as I do that your corporations hold just as much if not more influence in Central and South American governments; they are so economically dependent that if you make them reform, they will follow through.\"\n\nThe executives looked down, around at each other, then back up at the DCI. \"Are you for real?,\" a senior vice president at Cargill asked.\n\n\"Yes, yes, I am. You would still have economic benefits, but also providing the people with a better quality of life. You are paying them, you know.\"\n\nThe executives sighed. \"Okay. We’ll take it back up with our boards, I suppose, at least I will. Not sure how this’ll go, Director.\""
 CIA_LATAMc.23.d:0 "It was a hot night in southeastern Guatemala, near San Marcos, as an employee of Chiquita, formerly United Fruit Company, drove down the dusty road in his new but beat-up Ford sedan. He was not a native employee, but an American mid-level manager, sent to supervise the banana production in the area. His bosses hadn’t cared where he was from, just that he knew enough Spanish to yell at the laborers, and enough sense to know how to bribe the local council and soldiers.\n\nHe kept driving, swiping the sweat from his brow. Stopping at a checkpoint outside the city of San Marcos, he pulled out his papers and a few quetzals for the soldiers; he knew they needed the money, anyway.\n\n\"Buenas noches, gentlemen,\" the manager said, extending his papers as the window finished rolling down. The soldiers smiled, taking the money but flipping through, then tapping on the door for more. The manager shrugged. \"That’s all I have, guys.\" The soldiers nodded, opening the gate and letting him through.\n\nTen seconds later, the car exploded in a hail of automatic gunfire, dozens of bullets shattering the glass and leaving the manager a bloody mess. One of the soldiers, walking over to the car, busted the rest of the window, dispatching the man to make sure he was really dead.\n\nAnother man on a motorbike, coming the other direction, stopped, as if he knew what was going on. He got out, waving to the men, who lowered their guns. \"Here’s your pay, men.\" The two smiled, splitting the bills and stuffing them in their pockets as they checked their rifles again. Another banana man dead, they thought. Whatever it took for the highest bidder."
 CIA_LATAMc.24.d:0 "Marcus Greene was tired from the day’s heat, but they had just gotten a new lead. As part of a new program with the National Police of Nicaragua, Greene had been embedded as an advisor, albeit one with some limited roles. The Nicaraguan Government had been suspicious of the CIA’s eagerness to help, but when they mentioned preventing Contra drug trafficking, the Sandinistas reluctantly accepted.\n\nThe police embedded with him were no ordinary cops; they had been trained in drug enforcement to an extent but were coopted by the Communists during their rise to power. Politics really didn’t matter here, far from Managua, as they had a shared goal.\n\nGreene and his squad were at a port, albeit a small one, where the police knew cocaine traffickers came. They had seen a dozen small fishing and shrimp boats and had searched all of them but to no avail; however, one officer had talked to a local man who reported he saw a white man helping to offload something out of a truck and onto a boat. It was worth investigating, especially since the Contras were known to heavily operate here.\n\nGoing out to deeper water in a dinghy, Greene pointed out the boat that the man had identified. It was a rusty, 20-foot long, barely seaworthy boat, with a Panamanian flag; not overly suspicious, but typically what would be used to traffick drugs. There was one man on it, a nervous-looking guy; Greene guessed he was the owner of the boat. The Nicaraguans questioned him briefly, before he tried to wave them off to no avail. A brief scuffle erupted, but the man was tackled and shoved against a wall, where the Nicaraguan cops beat him before cuffing him.\n\nGreene looked out on the water, wondering how many other small boats they hadn’t been able to catch today. At least they got one. His sergeant came up to him, seeming to indicate that they had captured hundreds of bricks of cocaine down there. Guess the Contras would miss those, he thought."
 CIA_CONTRA80.0.d:0 "THE CONTRAS IN NICARAGUA: IN BRIEF\nNicaragua Detachment, Office of Latin American Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nIn the ongoing Nicaraguan Civil War, the United States has taken particular interest in a loose guerilla organization known as the \"Contras\" (short for \"la contrarrevolución\" or \"the counterrevolution\", consisting of three major groups in Nicaragua focused on anti-communism and rebelling against the ruling Marxist-aligned government known as the Sandinistas or FSLN. The Nicaraguan Democratic Force (FDN) is the largest Contra group, led by Adolfo Calero, composed of former Nicaraguan National Guardsmen and Fifteenth of September Legion. Other pro-Contra groups include Nicaraguans who were supportive of the anti-Somoza revolution but disapproved of the current Sandinista regime, including the Milicias Populares Anti-Sandinistas (MILPAS) and other peasant militia groups.\n\nThe United States is faced with a challenge in deciding whether to support the Contras. Current US support, mostly consisting of political support via exiles and limited weapons shipments, has not attracted much approval in Congress. This Office recommends further augmentation of arms shipments and other covert operations in Nicaragua, as it will properly advance American interests in the region and will enhance combat capability for the Contras. Significant concern should be placed on public opinion and Congressional opinion as continued troubles may necessitate ending operations."
 CIA_CONTRA80.1.d:0 "As morning fell on Washington, three of the most important men in the world and their aides were having an early meeting in the West Wing.\n\n\"...and so, the Hill wants us to cut support to the Contras, and the President agrees, so we should move forward with ending it.\" National Security Advisor [GetCurrentNatSecAdv] sighed.\n\nDirector of Central Intelligence [GetCurrentCIADir] looked around. \"I suppose. Just let it be known that there are individuals in the Agency that do not support this and support expanding aid shipments.\"\n\nThe DDO broke in. \"Congress doesn’t know anything about Nicaragua, yet they continue to order us to end something they don’t know about. Is there any way we can keep this on the downlow without having to read the President or Congress in?\"\n\nThe National Security Advisor shook his head. \"No way. We can’t afford to not let the President know about this, nor can Congress be lied to on such a scale such as this.\"\n\n\"An unusual opinion for you to have, there, boss,\" the DDO said, \"but I concede, you’re right. This situation, operationally, has become too complicated and one more fuck-up and it’ll be in the hands of the press. Better to end it now before we lose more credibility.\" The other two nodded. \"DCI, you start making the calls to the Watch Center and Langley. I’ll go read in the President right now, and tell him we’re ending arms shipments, but will continue limited public support for the contras in terms of rhetoric. Sounds good?\" The National Security Advisor stood up.\n\n\"Let’s end this.\" The men nodded, then all walked out of the room."
 CIA_CONTRA80.2.d:0 "It was early evening, just after sunset, when Captain Thomas Glenn and his copilot, commanding a brand-new Lockheed L-100 Hercules, taxied onto runway 12 at Miami International Airport. It was his fourth or fifth flight working for this small cargo outfit called Southern Air Transport, which operated cargo flights between the United States and Central America. Specifically, Glenn and his copilot were tasked with flying this civilian version of a C-130 Hercules to Soto Cano Air Base in Honduras. His flight plan said PLA, as in Planadas, Colombia, but no one had to know the inconsistency there.\n\nTaking off a few short minutes later, Glenn sighed as he got ready for the generally straight and easy 2 hour flight to central Honduras. His copilot, also informally the loadmaster, came back from the cargo hold, reporting \"all good, boss.\"\n\nGlenn responded, \"Do I even have clearance to know what’s back there?\" They laughed, before the copilot responded, \"Just boxes and boxes of AK-47s, a few boxes of Makarovs, a few TOWs, guess the Contras need those now.\" Glenn nodded, moving back to the control area to adjust their heading slightly. \"Yes, sir. I don’t care what I carry as long as it pays the bills, you know what I mean!\" They laughed and continued to talk as the flight continued.\n\n90 minutes later, the L-100 touched down at Soto Cano at dusk, just as the pilots had left. Having a rather bumpy landing, Glenn was glad to see the cargo vehicles and US soldiers standing by the hangar, as the plane was wheeled back and parked to covertly unload. He would have just enough time to stretch his legs and grab some coffee, before refueling the bird and heading back to Miami, hopefully by 2 or 3 am Eastern. Then a day off, thank God.\n\nHe wondered where his cargo would go and how it would be used; he knew it was going to Nicaragua, but why Soviet weapons, he wondered? They were the ones fighting the Communists. Glenn wasn’t cleared enough to know where the arms were coming from, but he had done his job and it was time to head home."
 CIA_CONTRA80.3.d:0 "THE BOLAND AMENDMENT AND THE FUTURE OF NICARAGUA\nNicaragua Desk, Office of Latin American Analysis, Directorate of Intelligence; Office of Congressional Affairs, CIA\nSECRET/NOFORN\n\nAn amendment to the most recent Defense Appropriations Act authored by Representative Edward Boland (D-MA) has caused great concern among members of the US Intelligence Community and the current administration. Having passed in the House by a wide margin, the \"Boland Amendment\" as it is known states the following:\n\n\"During fiscal year [GetYear], no funds available to the Central Intelligence Agency, the Department of Defense, or any other agency or entity of the United States involved in intelligence activities may be obligated or expended for the purpose or which would have the effect of supporting, directly or indirectly, military or paramilitary operations in Nicaragua by any nation, group, organization, movement, or individual.\"\n\nIn short, this Amendment effectively restricts not only the Central Intelligence Agency, but any US governmental body from financially supporting the Contras in Nicaragua. This move by Congress was not surprising by many Congressional Affairs officials, as the attitude on Capitol Hill has been firmly against the administration supporting anti-communist movements in Nicaragua, and particularly, by using funds authorized by them for other purposes.\n\nWe are faced with a variety of options in this regard. One would be simply following the text of the Amendment as stipulated by Congress, lest the CIA lose funding in later fiscal years. This has been pitched by senior members of the Agency and the Office of Congressional Affairs as a way for the CIA to save face and extricate itself from Nicaragua.\n\nHowever, the CIA General Counsel and the Directorate of Operations have advised the Agency that the Amendment has vague enough wording, that aid to the Contras could be continued covertly while technically remaining within Congressional stipulations. This would both please Congressional figures, while maintaining operational priorities in Nicaragua and supporting the Contras financially and militarily."
 CIA_CONTRA80.4.d:0 "\"...Mr. President, we’d like to informally pressure the Hill to repeal the Boland Amendment via another House resolution.\" White House Chief of Staff [GetCurrentCoS] motioned to a memo that had been placed on the Resolute Desk, where President [USA.GetLeader] sat.\n\nDirector for Central Intelligence [GetCurrentCIADir] nodded. \"We’ve tossed it around at Langley and have decided that this is the best option to deal with our major opposition to the Contras in Congress.\"\n\n\"I see.\" The President stated, looking back up at the two men. \"The only issue lies in who we can contact that would be willing to author and sponsor it. The vote for the Boland Amendment was 411-0, nearly unanimous. The odds are not stacked in our favor, gentlemen.\"\n\nThe two men nodded. \"We’ve thought of that, Mr. President.\" The Chief of Staff started in. \"There are a few members that would be amiable to sponsoring a House resolution, including Congressman Newt Gingrich, from Georgia, who has been receptive to similar proposals in the past.\"\n\n\"Excellent work, men. Reach out to his office, tell him we need his help. He’s been a supporter on some of our issues before, so I think he’ll be amiable this time around.\" They nodded again. \"Yes, Mr. President.\""
 CIA_CONTRA80.5.d:0 "Unfortunate news has come from the Hill, as our supporters, including Congressman Newt Gingrich of Georgia, have reported that the House of Representatives has essentially ignored a request by the White House to repeal the Boland Amendment, leaving it to die in committee controlled by anti-Contra members.\n\nThe attempt by the White House, trying to abide by the controversial Amendment but also trying to kill it, has been one in a series of failures by the administration to maintain a hold in Nicaragua without attracting the wrath of Congress. For its part, the Central Intelligence Agency has made a rare statement in which it has condemned Congress as \"unjustly denying assistance to anti-Communist freedom fighters in Nicaragua without cause.\"\n\nWith this development, it is unclear how the administration will proceed. Some sources have indicated that the CIA will continue their covert operations in Nicaragua in contravention of the Boland Amendment, while others have said they may simply end it here."
 CIA_CONTRA80.6.d:0 "ALTERNATIVES TO NICARAGUAN SUPPORT\nNicaragua Desk, Office of Latin American Operations, Directorate of Operations\nSECRET/NOFORN\n\nWith the ensuing approval of the Boland Amendment by the House of Representatives, effectively restricting CIA from spending funds or conducting operations in Nicaragua to support the Contras, the Agency has been struggling to find potential alternatives to continue to support operational and strategic objectives in Nicaragua and the surrounding region. Below are several proposals for alternative forms of maintaining operations:\n\n1. Establishing front or \"shell\" organizations, dummy corporations, or otherwise false companies, in order to shuttle aid and weapons through to the Contras, without actually spending any CIA-earmarked funds. This could take the form of air transport, shipping, or logistics companies, as well as aid and/or cultural organizations.\n\n2. Cooperating with the Western Goals Foundation, who is a private, non-governmental intelligence agency active with heavily similar anti-Communist goals and ideals. The Foundation, founded by Major General John Singlaub, also has the support of Congressman Larry McDonald, a strong supporter of our cause. This is nearly guaranteed to enable CIA to maintain operations while pinning the primary responsibility on Western Goals.\n\n3. A final alternative would be to discreetly sell weapons to Iran. By doing this, the United States would both free hostages taken by the Iranians, as well as build a greater strategic relationship with Iran. While this may be irrelevant to immediate interests, selling weapons to Iran will give the CIA funds which can be used to purchase Eastern Bloc weapons from an available market, which will then be used to provide the Contras with ammunition. This will operationally standardize the weapons being used in the conflict and ensure the Contras are better protected as they are not using Western weaponry.\n\nA combination of these proposals will ensure that the Nicaraguan Contras are not cut off from US support and aid; and while they technically violate the Boland Amendment, Congress has little enforcement power in this regard and will likely not notice covert activity unless it is made clear to them."
 CIA_CONTRA80.7.d:0 "At a warehouse outside Newport, Delaware, a new company was moving into its offices. The ink was barely dry on their incorporation agreement in the state of Delaware, a famously pro-business state that has simple laws for forming corporations; a moderately-sized, somewhat visible sign reading \"INTER-AMERICA TRANSPORT CORPORATION\" hung from the door. There were piles and piles of moving boxes, transport boxes, bankers’ boxes, all stashed about the office and warehouse area. Once they got the office set up, they would put the corporation’s phone number in the phone book so as not to attract suspicion, but the number would just happen to go to a call center in Kansas, where it would be dropped. This was no ordinary company.\n\nPulling off Interstate 95, a small, unassuming convoy of sedans, all black with tinted windows, parked in the parking lot outside the warehouse. It had been a long drive from Langley, but they were glad they didn’t have to fly. Getting out of the cars, they proceeded into the warehouse, looking at several stacked pallets filled with the cargo that the Corporation managed: instead of general cargo services, this \"Inter-America Transport Corporation\" smuggled arms. The men looked as a forklift came past them carrying a pallet of AK-47 rifles in crates, setting it down in the bay marked \"TO CONTRAS.\"\n\nThis unassuming warehouse, located near a chemical plant and in an industrial zone in northern Delaware, would soon be one of the largest arms transfer points in the entire Western Hemisphere. From here, US weapons would be shipped to Iran via ship, exchanged for prisoners which were freed publicly, and paid for in American dollars which were then used to procure Eastern Bloc weapons from reputable dealers behind the Curtain and in Africa. Those weapons would be sent back to Delaware, where soon, they would board an L-100 plane or small boat to be sent to Nicaragua to help freedom fighters everywhere. And the best part? All of this was classified to everyone but the most senior officials and flight personnel, all under the watchful and ignorant gaze of Congress."
 CIA_CONTRA80.8.d:0 "THE WESTERN GOALS FOUNDATION AND COOPERATION\nNicaragua Desk, Office of Latin American Operations, Directorate of Operations\nSECRET/NOFORN\n\nThe Western Goals Foundation (WGF), an anti-communist and domestic security and intelligence think tank, has been particularly active in the past few years and has attracted the attention of CIA senior officials as being potentially useful in some operations, including, but not limited to, Iran and Nicaragua. Below are prominent WGF officials and founders, as well as proposals for collaboration with the United States Intelligence Community.\n\n1. WGF Founder, Major General John Singlaub, has been known to the CIA as a founding member of the Agency, as well as a decorated World War II veteran who worked with French Resistance groups during and after D-Day. Singlaub served briefly as chief of staff for US Forces Korea, before retiring and forming the Western Goals Foundation with Congressman Larry McDonald (see below). Singlaub carries much influence in US intelligence circles and is a member of the United States Council for World Freedom, a similarly-identifying anti-Communist organization.\n\n2. Congressman Lawrence (Larry) McDonald (Democratic, Georgia’s 7th district) is also one of the WGF’s key founders and benefactors. McDonald has been in the US House of Representatives since the 1974 congressional elections, and has maintained one of the most conservative and anti-Communist voting records in that body thus far. McDonald has heavily supported CIA activities in the past and his support will likely continue, as well as maintaining a line into Congress to use to advance intelligence interests.\n\nWe believe that with the assistance of these two figures, that cooperation between CIA and Western Goals will allow a more \"legitimate\" form of sending aid to Nicaraguan Contra forces, as opposed to other alternatives. Western Goals is composed of former military and intelligence officials, all of whom understand the complexities of the situation at present. Cooperation should begin immediately."
 CIA_CONTRA80.9.d:0 "It was a cold night in the city of Dogubeyazit, Turkey, as a convoy of trucks passed through on Turkish state road D.100, heading east, having completely crossed the country from the western city of Izmir, specifically Cigli Air Base.\n\nAs they rumbled on, hurtling towards the Iranian border, the trucks pulled off at the village of Gurbulak, the last stop before the border. They were never going to cross, and, sitting in a vacant lot just outside the village, the drivers waited for a near-identical set of trucks, also unmarked, to approach the rendezvous point.\n\nLangley had suggested that they meet in a more populated place in order to make the deal go through, but the Chief of Station in Ankara had suggested rural Turkey near the border at night so as not to attract more attention. The operatives, all drivers, had decided to go through with that, and as they sat, they saw six heavy-duty trucks approaching from the Iranian border checkpoint, with a staff vehicle in front. Seeing them approach, the operatives got out, lighting up cigarettes and beginning to drop the tailgates and open the doors of their trucks. A few stood around with rifles for area protection, while the rest got ready.\n\nThere was little talk if anything; most of the details had been planned ahead of time by senior officials on both sides. In return for 20 BGM-71 TOW anti-tank missiles, the Iranians would pay approximately $500,000 in cash, American dollars. The operatives did not know where they got that from, but they would get the missiles. As they watched, an Iranian officer, not in uniform, set two briefcases, full of the cash, down on the ground, and while it was being looked over, the missiles, in their crates, began to be unloaded and moved to the Iranian trucks.\n\nIt was truly that simple. The senior operative, the lead driver, asked if the Iranians knew how to operate the TOW missiles. The officer said yes, and that was that. The operatives had their cash, and the Chief of Station in Ankara would have another encrypted dispatch to send to Langley in the morning; with the cash in a diplomatic bag, of course."
 CIA_CONTRA80.10.d:0 "THE HOSTAGES FOR WEAPONS PROBLEM: PROPOSAL\nIran and Lebanon Desks, Office of Near East Analysis, Directorate of Intelligence; Directorate of Operations\nSECRET/NOFORN\n\nIn the midst of the ensuing Lebanon crisis and civil war, the United States has been embroiled in trying to mediate a crisis of its own in the region; seven Americans, out of an estimated one hundred total hostages, taken by the Hezbollah terrorist group in Lebanon. US intelligence has determined that Hezbollah continues to be politically and financially backed by the new fundamentalist Islamic Republic of Iran, who itself is involved in a bloody conflict with its southern neighbor of Iraq.\n\nThe Iran and Lebanon Desks, with some outside counsel, have proposed a plan to both retain Iran within the Western sphere of influence while also freeing the American hostages in the process. With the assistance of Manucher Ghorbanifar, a former Iranian weapons dealer, the United States will propose the sales of weaponry to Iran to accomplish the following:\n\n1. The sale of TOW and HAWK anti-tank and surface-to-air missiles will provide a profit of funds that, outside of the Boland Amendment’s stipulated budgetary restrictions, can be used for funding the Nicaraguan Contras and other groups which the United States would like to support but faces opposition from the public or Congress on.\n\n2. In exchange for providing the missiles, Iran will be compelled to issue a guarantee that the hostages will be released by Hezbollah, as they have significant enough influence and support to call shots on Hezbollah operations, particularly if they are contingent on US arms sales.\n\n3. Finally, providing the Iranians with weapons will allow them to become more militarily dependent on us, will prevent the Iranian government from pursuing arms sales from the Soviet Bloc, and will allow them a minor tactical advantage in the ensuing Iran-Iraq War.\n\nWe believe that this proposal, conducted in an extremely covert manner, will provide benefits for nearly all parties involved: the United States will receive further influence and the return of hostages which will be a benefit to the current administration; Iran will receive weapons that it needs to enhance its capability; and the Contras will receive funding that is coming from arms sales profits to Iran."
 CIA_CONTRA80.11.d:0 "Via covert channels, operatives of the US Central Intelligence Agency have made a crucial offer to our government. Currently, seven Americans are being held hostage in Lebanon by Hezbollah, a group that we support politically, militarily, and financially. The White House, in its attempt to recover from the disaster it saw in the 1979 Iranian Revolution, is trying to recover those hostages and save face domestically as well as internationally.\n\nCIA operatives have offered to provide weapons to Iran, such as BGM-71 TOW anti-tank missiles and HAWK surface-to-air missiles, if we can guarantee and facilitate the release of all seven Americans.\n\nMembers of our government and of the Revolutionary Guard Corps remain split on the issue. Keeping the hostages may provide greater leverage in the future, while the immediate concern militarily is increasing our capabilities in the midst of our war with Iraq, and using American equipment would provide a tactical advantage as opposed to receiving weapons and aid from the Soviet bloc. How should we choose?"
 CIA_CONTRA80.12.d:0 "Sources from Tehran have reached back to our operatives with an acceptance that Iran will release all seven American hostages upon receiving an \"adequate number\" of TOW and HAWK missiles. While numbers are yet to be determined, and this remains a covert operation, not to be seen by the eyes of the public or Congress, this represents a major victory for the United States in its relations with the new, Islamist Iranian regime.\n\nDirector of Central Intelligence [GetCurrentCIADir] and National Security Advisor [GetCurrentNatSecAdv] have been informed and expect to brief President [USA.GetLeader] on the developments shortly."
 CIA_CONTRA80.13.d:0 "Sources from Tehran have reached back to our operatives with an explicit rejection of any \"arms-for-hostages\" offer by the United States. While not providing a public statement as would be expected by the anti-American Islamist fundamentalist Iranian regime, the Iranians have rejected any such offers, appearing dead set on keeping the seven American hostages for greater leverage on issues later on. Despite the clear need for weaponry in the wake of the Iran-Iraq War, it is curious that the Iranians would reject such high-tech missiles in their time of need.\n\nDirector of Central Intelligence [GetCurrentCIADir] and National Security Advisor [GetCurrentNatSecAdv] have been informed and expect to brief President [USA.GetLeader] on the developments shortly."
 CIA_CONTRA80.15.d:0 "A STRATEGIC UNDERSTANDING WITH IRAN?\nIran Desk, Office of Near Eastern Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nBased on the United States’ more recent interactions with the new Iranian government after the 1979 Iranian Revolution, there are indications that a new strategic understanding may be desired in order to cement Iran as a country closely allied with American goals in the Middle East.\n\nThe Islamist fundamentalist regime, since 1979, has struggled to reinvent its image and reputation on the world stage, and according to recent analyses, is in dire threat of being absorbed into the Soviet sphere of influence. Their current conflict with their southern neighbor, Iraq, also threatens to further destabilize Iran as well as remain destabilizing to most of the Middle Eastern region. Having been willing to engage with US operatives and officials surrounding the Lebanese hostage issue and proposed weapons sales, this Desk believes proposing a draft strategic understanding with the Iranian regime will present a warming up in US-Iranian relations as well as protect the country from being absorbed by Soviet influence. The understanding should include the following:\n\n1. The United States will consider diplomatically recognizing the Islamic Republic of Iran if the government accedes to returning all foreign hostages, formally apologizing for their actions against US Embassy officials in 1979, and issues diplomatic protests against Soviet and Eastern Bloc diplomatic personnel.\n\n2. The United States, in addition to recognizing the Islamic Republic of Iran, will then consider limited humanitarian, economic, and military aid to enhance Iranian economic production and military capability, as well as to provide for the people of Iran, if the Iranian government agrees to considering negotiations with Iraqi government officials, as well as domestic reforms with less strict religious guidance.\n\n3. If the Islamic Republic of Iran refuses to return hostages, diplomatically expel Soviet officials, negotiate with Iraq, or consider domestic reforms, the United States will not provide recognition or aid in any form, beginning with weapons shipments.\n\nWe urge the cooperation of the Department of State in this regard but recommend that all negotiations on this strategic understanding should be done covertly for the moment to avoid any political blowback from possible failures."
 CIA_CONTRA80.16.d:0 "American officials, under the guise of the Central Intelligence Agency, have approached some of our diplomats and senior government officials to propose a new shift in US-Iranian relations, termed as a \"strategic understanding.\"\n\nThe Americans have proposed diplomatically recognizing our government and restarting limited diplomatic relations if our government agrees to release all foreign hostages, apologize for the US Embassy siege in 1979, and issue diplomatic protests against Soviet embassy personnel, who they are concerned are attempting to influence our government.\n\nThe Americans are also offering aid, primarily military and humanitarian assistance, if our government further agrees to begin negotiating with Iraq, who we are in a bitter conflict with, as well as consider domestic reforms to remove strict religious rules in our society. The Americans have made clear that if we do not accede, aid will not be provided, nor will diplomatic recognition.\n\nFigures in our government remain divided on the issue. More hardline members of our government continually argue that acceding to the Americans would defeat the entire point of the Revolution and that the \"Great Satan\" will rule over us again. However, some moderates have argued that what the US is providing is amenable and will help to rebuild some of the country’s image. How shall we choose?"
 CIA_CONTRA80.17.d:0 "Response has come back from Tehran indicating that the hardliners in the Iranian government have rejected all attempts at a strategic reorientation with the United States.\n\nDespite our rather hefty promises of diplomatic recognition and weapons aid, the Iranians have not taken well the demands that they release hostages, negotiate with Iraq, and pursue domestic reforms. Rather than issuing a private demarche, the Iranians issued a statement condemning our actions as \"another attempt by the Great Satan, the United States of America, to interfere in our internal affairs and bring the entire Middle East region under its hegemony.\" It appears as if the Iranians are moving towards the Soviet bloc of influence although information on that is not completely known.\n\nDirector of Central Intelligence [GetCurrentCIADir], National Security Advisor [GetCurrentNatSecAdv], and White House Chief of Staff [GetCurrentCoS] have all been briefed and are angrily preparing to brief President [USA.GetLeader] and Vice President [GetCurrentVP] at this very moment."
 CIA_CONTRA80.18.d:0 "Response has come back from Tehran indicating that the moderates in the Iranian government have accepted the US proposal for a \"strategic reorientation\" between the US and Iran.\n\nConfirmed by the Chief of Station in Baghdad, being the closest official to Iran, the Iranians have apparently acceded to at the very least a release of hostages and some protests and expulsions of Soviet and Eastern Bloc officials. In exchange, the United States has agreed to diplomatically recognize the Islamic Republic, at least beginning a true warming in diplomatic relations.\n\nSecretary of State [GetCurrentSecState], Director of Central Intelligence [GetCurrentCIADir], and National Security Advisor [GetCurrentNatSecAdv] have been briefed on the developments, and expect to brief the President and Vice President as soon as possible."
 CIA_CONTRA80.19.d:0 "In Miami, the L-100 landed again. Glenn rubbed his eyes as he taxied, checking his watch. It was two in the morning and he had just gotten back from Honduras. He was ready for bed and a few days off. God damn.\n\nA thousand miles away and a few hours later, the sun rose over the White House Chief of Staff’s office window. Not only did [GetCurrentCoS] sit there, sipping coffee, but so did DCI [GetCurrentCIADir] and National Security Advisor [GetCurrentNatSecAdv]. Their conversation was perfectly ordinary. Every time a cargo flight returned, they were told. Just down the corridor, in the Oval, sat the President and the Vice President, going over their agendas for the day. Perfectly ordinary, as all things should be.\n\nOnly a few hours drive up Interstate 95, the warehouse in Newport, Delaware was similarly buzzing. Tractor-trailers from the Northeast had just arrived, full of newly procured AK-47s and other Soviet Bloc weapons; and within an hour, those same trucks, now filled with M-16s and TOW missiles, were back on the road to different ports, this time in the South. Different trucks would come later to take the Soviet weapons down to Miami, where they’d be flown in.\n\nThousands of miles to the south, a Contra unit was just waking up after getting a few hours of sleep after nighttime operations. Loading back up, they were in the vicinity of a higher command headquarters, so decided to check in. To their surprise, they saw new crates that must have been brought in by the Hondurans. Grabbing the new weapons and ammunition, the commander knew his squad would be happy by this.\n\nIt was a massive and large system, but one that remained secret."
 CIA_CONTRA80.20.d:0 "\"FUCK!\" The DCI, [GetCurrentCIADir] yelled into the wide open air of his office, looking down at both the briefings on his desk and the newspaper open in front of him, turned to a large article on \"WEAPONS TRAFFICKING IN DELAWARE REVEALED.\"\n\nPicking up the phone, he dialed the National Security Advisor’s office, immediately being patched in. [GetCurrentNatSecAdv] picked up. \"Hello?\"\n\n\"Have you READ the Washington Post this morning? We are so fucked. They found the warehouse in Delaware. Soon, they’re gonna figure out the plane and ship routes, all of the documentation there mentions the vessels.\"\n\n\"Fuck. We need to try damage control. Get State on the phone, we’ll start issuing statements about our commitment to weapons enforcement as well as the Contras and begin an FBI investigation. Tell everyone at Southern Air Transport they may be next. Stop flights until it blows over. Tell someone to get the Iranians on the horn, and we need to tell the Contras so they’re not mad.\"\n\n\"Okay. Fuck, man, this is bad. You need to brief the President now. Make sure he doesn’t make it worse. Christ, this is going to be a long day.\""
 CIA_CONTRA80.21.d:0 "Our contacts on Capitol Hill, including Representative Newt Gingrich, have managed to successfully lobby for, write, and pass a House resolution repealing the Boland Amendment, which was passed by the House several months ago.\n\nThe Boland Amendment, which was originally passed to end CIA intelligence involvement and funding of activities in Nicaragua to support the anti-Communist Nicaraguan Contras, greatly angered many figures within the White House, intelligence community, and defense network, as going against US strategic objectives in Latin America. Repeal of the Amendment will allow the CIA, as well as other intelligence agencies and departments, to continue their operations supporting Contra forces to advance US interests.\n\nRepresentative Gingrich, who spearheaded the repeal in the House, has received congratulations and thanks from President [USA.GetLeader] for his work, and is expected to be used in the future by administration officials to advance other pieces of legislation or repeals."
 CIA_CONTRA80.22.d:0 "As the L-100 touched down at Soto Cano for the first time in more than a few weeks, Captain Thomas Glenn sighed, moving the control stick to taxi to his usual hangar out of sight. He was glad to be back after a long (and unpaid) vacation, but this flight was very routine for him at this point.\n\nHaving parked the aircraft, Glenn got out, watching as his copilot, the loadmaster, walked out the back ramp, clipboard in hand, talking to the US and Honduran soldiers standing there, checking. Glenn walked over, nodding to the men, passing them to see if the American detachment’s executive officer (XO) was in his small corner of an \"office.\"\n\nThe XO was a major, deputy commander of give or take, a hundred men assigned to the base as security, liaison with the Hondurans, and aircraft handling. There was more than just this company, in fact, a Special Warfare Training Center at Soto Cano supporting Joint Task Force Bravo, the higher command here in Honduras. He sipped at some coffee as he continued to page through some reports, as Glenn walked into his office.\n\n\"Howdy, Major.\" Glenn cracked a smile, \"saluting\" with two fingers to his old, beat-up Baltimore Orioles baseball cap. \"How’s the party at Soto Cano? You know I haven’t been down here in a few weeks.\"\n\n\"It’s been chaotic to say the least. We’ve had senior Contras show up demanding weapons and my men have had to send them away because the idiots in Washington stopped shipments out of the blue.\"\n\nGlenn nodded. \"Yeah, I know, those assholes in Congress put me out of a job for a couple weeks. Can’t say Southern Air Transport doesn’t take care of its own though. I managed to hang on.\" He set down the cargo manifest. \"Here’s your first shipment. I assume we need to be turned around and out of here within, say, 3 hours?\n\n\"Yeah, Tom.\" The major looked down at the manifest. \"Wow, nice. Plenty of AK-47s, some RPGs, some anti-personnel mines. I assume the larger craft are coming with vehicles soon? That’s what the brass has indicated to me.\"\n\nGlenn shrugged. \"I have no idea. SAT is very independently structured. I suppose they don’t even want me to know what I’m carrying myself, much less what other flights are bringing in.\"\n\nThe major frowned. \"Okay. Well, welcome back. Get yourself a cup of coffee and a snack and we’ll have the plane unloaded within the hour.\" He smiled and nodded, as Glenn waved and exited the office, seeing the soldiers unloading the crates of guns."
 CIA_CONTRA80.23.d:0 "It was early morning as the Danish-flagged freighter MS Erria slowly moored itself to a pier at the port of Puerto Cortes, on the northern Caribbean coast of Honduras, fresh from a long voyage from the port of Cherbourg, France.\n\nIts crew was tired; most of them were Danish merchant mariners, but a few were Americans, presumably serving as liaisons, but on the payroll of Langley. The Erria was only about 150 feet long, and the seas of the Atlantic had not been kind to her. They were glad to be finally stopped.\n\nTheir final destination, at least this voyage, was to be Wilmington, North Carolina, but they had a stop here for another reason. The manifest said they were carrying bananas and other agricultural products up to the US, but the cargo they were offloading was unclear. In the hold of the freighter, as well as in small shipping containers, held what they thought were vehicles. None of the crew knew, and they would likely never find out. Not even the captain knew.\n\nSome Honduran soldiers appeared, evidently a small detachment from the harbor patrol. Having inspected the freighter, and looking in the containers, they went to go speak to the first mate, one of the suspicious-looking Americans that had been with them for months.\n\nAfter a brief chat, the soldiers started directing the Danes, having them lift what they could carry or otherwise using forklifts to take the crates off the ship and placing them on a loading dock. Soon, a truck would come to haul it to a nearby army base where the crates would be unpacked and assembled.\n\nOne of the sailors, taking a moment after using the forklift heavily, stopped to take a look at the shipping manifest again. The cargo to Puerto Cortes said \"RENAULT AUTOMOBILE,\" but he knew that was not what was in those containers.\n\nAfter loading, the soldiers met with the American again, shaking hands and signing off on a new piece of paper, one that the Danes hadn’t seen before. As the sailors got busy again reloading the ship with bananas, they noticed one of the crates being opened by a squad of Honduran soldiers. Inside was a jeep. There were also smaller crates, full of tube-looking items, marked STINGER on the side. Curious."
 CIA_CONTRA80.24.d:0 "In a remote command center, somewhere in the Nicaraguan jungle, sat a senior Contra commander. A major operation was about to happen, and as he checked his watch, his men began to follow their orders.\n\nAt five minutes after one in the afternoon, almost throughout the country, things began to explode. A few sections of the Nicaraguan highway system, some containing packed buses, collapsed. Docks at the ports of San Juan del Sur and Puerto Cabezas just happened to sink into the sea. The few remaining trains on the barely-used Nicaraguan railway network slowed to a stop as their engineers noticed the rails had been blown to bits in front of them. Various government buildings in Managua, including the headquarters of the Nicaraguan Army, were also bombed.\n\nAnd just like that, the saboteurs disappeared into the night, into the jungle, not to be seen by anyone but other Contras and their CIA handlers. The commander sat in his bunker, tuned to the FSLN-controlled Radio Sandino, listening for news. The country and government were panicking now. Excellent."
 CIA_CONTRA80.25.d:0 "The Minister of Interior, as well as the Chief of Staff of the Nicaraguan Army, have confirmed that a recent rash of sabotage efforts against our infrastructure and military capabilities have been perpetrated via the Contras, and in some cases, directly by the United States.\n\nReports from around the country have indicated that the US and their proxy fighters, who are traitors to our regime, have stepped up their sabotage campaign; targeting roads, national highways, railroads, our ports, airfields, and some government buildings within Managua.\n\nWe must be ever vigilant to watch our critical infrastructure and military deployments in order to maintain operational readiness and national security to protect the people of Nicaragua from the terrorism of the Contras and their American benefactors."
 CIA_CONDOR.0.d:0 "OPERATION CONDOR: OPERATIONAL SUMMARY\nOffice of Latin American Operations, Directorate of Operations, CIA\nSECRET/NOFORN\n\nOperation Condor, also known as Plan Condor, is in brief, a cooperative effort by the intelligence and security services of several South American countries to combat terrorism and subversion region-wide.\n\nComposed mainly of Argentina, Chile, Brazil, Paraguay, Uruguay, and Bolivia, Condor has the stated goal of counterinsurgency operations on a transnational scale, in particular with intelligence cooperation by the Argentinian Secretaría de Informaciones de Estado (SIDE) and the Chilean Direction de Inteligencia Nacional (DINA). Condor has received support from CIA and DIA in the past, as well as military support from USSOUTHCOM in its military component, which involves liaison and communication services between the military regimes.\n\nCondor was initially formed in the early 1970s, formalized in 1975 in Santiago, Chile; and began covert operations later that year. Some operations, having been reported to us by Condor members, have included surveillance of Chilean and Uruguayan dissidents, assassination of a pro-Allende Chilean General Carlos Prats and his wife, as well as Chilean Christian Democratic leader Bernardo Leighton. CIA station chiefs in Santiago, Brasilia, and Montevideo have been instrumental in conducting liaison, training, and advisory services for Condor intelligence agencies, military services, and police agencies.\n\nStated US policy from Foggy Bottom and Langley has always been to act with Condor in a limited training and advisory capacity, but not to directly engage in covert operations, leaving that to Condor members. The United States has maintained and will continue to maintain plausible deniability with its involvement in Condor operations and the use of US facilities to support Condor members, such as in training and communications support."
 CIA_CONDOR.1.d:0 "COUNTERINSURGENCY OPERATIONS IN ARGENTINA\nArgentina Desk, Office of Latin American Operations, Directorate of Operations, CIA; EMBASSY BUENOS AIRES\nSECRET/NOFORN\n\nBeginning in mid-1974 under the former government of Isabel Peron, widow of the late President, Juan Peron, counterinsurgency operations in Argentina have been ongoing as of the writing of this report. Despite the 1976 coup d’etat by the Argentine military, which established the National Reorganization Process, operations continue, and appear to be marginally more effective than in prior years.\n\nPrimarily countering left-wing guerrillas, including the People’s Revolutionary Army (ERP), Peronist Monteneros, trade unionist movements, and pro-Allende Chilean exiles; the \"Dirty War\" as the Argentine military calls it, involves nearly all security services; including the military, Federal Police, the Secretaría de Informaciones de Estado (SIDE), and a pro-junta paramilitary known as the Alianza Anticomunista Argentina (AAA).\n\nCurrent US policy has dictated support for the National Reorganization Process as part of a wide-ranging anti-communist policy in Latin America. However, some officials in Langley and Foggy Bottom have expressed concern about overly supporting the Argentine military, particularly with their involvement in Operation Condor with other South American countries. A change in policy may be required in order to temper American interests and desires in South America in the future."
 CIA_CONDOR.2.d:0 "In a surprising turn of events, a spokesperson for the Department of State confirmed today that the United States would, effective as of today, \"end all support for the Argentine National Reorganization Process\" in its entirety, citing numerous human rights violations committed by the ruling Argentine military junta.\n\nCiting illegal transnational killings and other atrocities against its own citizens as part of an alleged operation known as \"Operation Condor,\" the United States has taken an abrupt about-face on its policy in the region. It is unclear whether similar condemnations will come down for Chile, Brazil, Uruguay, and other South American military dictatorships, but this development remains particularly significant, especially in Buenos Aires."
 CIA_CONDOR.3.d:0 "Unfortunate news has appeared from the US Embassy to Argentina that the White House and Pentagon jointly have agreed to end support for paramilitaries that we have used in our fight against the left-wing and communist menace. In their statement, the Embassy mentioned \"concern over the use of the Alianza Anticomunista Argentina in military operations\" as well as various claims of human rights abuses by the military, AAA and other pro-junta paramilitaries.\n\nThis is an entirely unexpected development from Washington, who in the past has pushed for more anti-communist counterinsurgency activity and has covertly provided assistance via intelligence and military liaisons as well as via the Condor system."
 CIA_CONDOR.4.d:0 "Unfortunate news has appeared from the US Embassy to Chile that the White House and Pentagon have jointly agreed to end support for paramilitaries that we have utilized in our fight against pro-Allende and left-wing communist guerrillas in the country. In their statement, the Embassy mentioned \"concern over the use of right-wing paramilitary groups in military operations\" as well as various claims of human rights abuses by the ruling military regime and paramilitary groups that are supported by them.\n\nThis is an entirely unexpected development from Washington, who in the past has pushed for more anti-communist counterinsurgency activity and has covertly provided assistance via intelligence and military liaisons as well as via the Condor system."
 CIA_CONDOR.5.d:0 "Today, in a surprising statement, US Secretary of State [GetCurrentSecState] and Attorney General [GetCurrentAG] jointly announced their combined effort to bring Nazi war criminals hiding in South America to justice, via an Interagency Task Force, which will be responsible for seeking out, negotiating, and arresting Nazi officials residing in Argentina, Brazil, Chile, and other South American countries; including infamous figures as Klaus Barbie, Sandor Kepiro, Erich Priebke, and Dinko Sakic.\n\nThere has been no reaction from the military regimes in Argentina, Brazil, and Chile yet, but it is expected that the Americans will face much resistance, as the military governments have agreed to hide and protect former Nazis. It is expected that the White House will seek to extradite individuals, either for trial in the United States or in an international court."
 CIA_CONDOR.6.d:0 "COLLABORATION WITH FORMER NAZI OFFICIALS IN SOUTH AMERICA\nArgentina Desk, Office of Latin American Operations, Directorate of Operations; US Defense Attache, EMBASSY BUENOS AIRES\nSECRET/NOFORN\n\nAs a focus on counterinsurgency operations in the Southern Cone has been stressed in recent years as the highest priority in US policy in South America, there has been some discussion in both American intelligence circles and in the agencies of South American Condor members (Argentine SIDE, Chilean DINA) about the possible cooptation and cooperation opportunities from former Nazi officials living in South America.\n\nTherefore, Argentina Desk, with the support of Embassy Buenos Aires and the Defense Attache’s office, submits the following proposals for prominent Nazi officials in the Southern Cone that could be contacted and used for operational goals:\n\n1. Klaus Barbie, known as the \"Butcher of Lyon,\" heavily responsible for atrocities against the French Resistance during the Second World War; was briefly a member of US Army Counterintelligence, who helped him escape to Bolivia. He is currently on the payroll of the West German intelligence service (BND) and is heavily involved in the ruling Bolivian military government. In that role, Barbie has allegedly participated in the hunting down of Che Guevara. His influence in the Bolivian government and experience with counterinsurgency makes him a prime candidate for cooperation.\n\n2. Erich Priebke, a mid-level SS police commander during the Second World War who was responsible for a massacre in Rome in March 1944 that left 335 Italian civilians dead. Priebke was scheduled for trial but managed to escape a British prison camp in Italy, and is currently living in Bariloche, Argentina, under an assumed name. Priebke was commonly known as a competent commander and could be used by allied forces to support police activities in the region.\n\n3. Dinko Sakic, a Croatian Ustase official, who was the commander of the Jasenovac concentration camp in occupied Yugoslavia, was an open Nazi collaborator, and fled to Argentina, then to Paraguay in the late 1940s. He is a known friend of Paraguayan leader General Alfredo Stroessner, and has emerged as a leader of the small Croat emigre community in Paraguay and the region. His experience with internment camps, as well as heavy anti-communist orientation, makes him a perfect candidate for cooperation, particularly in Paraguay.\n\nThe Embassy in Buenos Aires and this Desk believes that these three men, properly found and contacted, should provide further benefits to US involvement in South America, as well as benefits to the Condor system in the Southern Cone."
 CIA_CONDOR.7.d:0 "Terrible news has come from the US Ambassador, who arrived with a team at La Casa Rosada today to inform the Argentine military government that the United States would, effective immediately, terminate all support with the Argentine Republic. Concern apparently has been raised in Washington and has circulated among the White House, Foggy Bottom, and Langley, about the scope and depth of US cooperation with our government, particularly as it relates to covert support and counterinsurgency support in our ongoing anti-Communist operations.\n\nThis has sparked heavy backlash from prominent officers within our government, who allege that the National Reorganization Process has gone too far in its internal operations as well as its participation in Condor. Many officers, even those who received military training and schooling in the United States, have condemned Washington for its insolence in this matter, and urges the Embassy to reconsider its statement. However, it appears as if the Argentine Armed Forces will receive US support no longer, unless we can convince the Americans to take us back."
 CIA_CONDOR.8.d:0 "In an unsurprising statement from Washington today, US Secretary of State [GetCurrentSecState], joined by National Security Advisor [GetCurrentNatSecAdv], reaffirmed their commitment to supporting the Argentine military government, officially known as the National Reorganization Process.\n\nReiterating the \"commitment of the United States to assist Argentina in combating insurgency and transnational security challenges,\" the Secretary of State confirmed to the world open US involvement in Southern American affairs, all but providing a blank check to the Argentine junta to continue their brutal counterinsurgency campaign."
 CIA_CONDOR.9.d:0 "Fortunate news has come from Washington today, as US Secretary of State [GetCurrentSecState] confirmed publicly the United States’ continuing support for the Argentine military government. An additional statement and phone call from the US Embassy in Buenos Aires to La Casa Rosada reiterated this fact, with the American Ambassador sending his warmest regards and stating that the defense attache would be pleased to have further contacts with his colleagues in the Argentine Army, Navy, and Air Force.\n\nMembers of our government are pleased by this announcement, but some wonder why the United States had to revisit its policy positions on the matter? Some military intelligence officers within our government, particularly those in SIDE, have postulated that the White House may have considered pulling support but was convinced by members of the CIA, Department of Defense, and other influential national security agencies. However, regardless, we accept this development with open arms."
 CIA_PERU.0.d:0 "INSURGENCY IN PERU: THE SHINING PATH\nPeru Desk, Office of Latin American Analysis, Directorate of Intelligence, CIA; Defense Attache, EMBASSY LIMA\nSECRET/NOFORN\n\nSince 1980, the northeastern South American country of Peru has been terrorized by an ongoing insurgency in the rural areas that has involved the full deployment of the Peruvian Armed Forces. Known as Sandero Luminoso, or \"Shining Path,\" the insurgency is mostly composed of Maoist guerrillas independent of the Communist Party of Peru, which is Marxist-Leninist in its orientation.\n\nFounded in 1969 by Abimael Guzman, known to the Peruvian population as \"Chairman Gonzalo,\" Shining Path began its campaign of terror during the 1980 elections, burning ballot boxes and then escalating to full-scale violence and terror, mostly concentrated in the Andean Highland provinces of Ayacucho, Apurimac, and Huancavelica.\n\nPeruvian government response to the insurgency began as middling, but emergency zones were formed in recent years, giving the Armed Forces near total control over local governance and the power of arbitrary detainment. However, these actions have not been enough. Shining Path has conducted several sabotage operations on high-level infrastructure, including cutting power to the capital of Lima and setting bombs near government buildings. Prominent Peruvian politicians and military personnel have also been assassinated, including the Chairman of the National Electoral Council, as well as left-wing and Marxist figures who opposed Shining Path.\n\nUS officials in Peru have expressed deep concern at the Peruvian government’s response as yet and have been pushing for deeper US support. Langley has determined several possibilities, including expanding security assistance for the Peruvian Armed Forces as well as directly undercutting Shining Path’s popular support in the Andean rural areas."
 CIA_PERU.1.d:0 "PERU’S MILITARY: CAPABILITIES AND POTENTIAL FOR MODERNIZATION\nPeru Desk, Office of Latin American Analysis, CIA; Defense Attache, EMBASSY LIMA\nSECRET/NOFORN\n\nThe Peruvian Armed Forces, in recent years, have proven themselves one of the most tactically superior militaries in the Andean region, if not the wider South American region. Peru’s past reliance on Soviet weaponry and aid, however, has dramatically weakened modernization efforts, particularly with its ongoing counterinsurgency campaign against the \"Shining Path\" Communist guerrilla group. Defense Attache and Embassy Lima see a possible opportunity in this case to begin further US support as the Peruvians are vulnerable and open to more modern equipment from the West.\n\n1. The Peruvian Army is heavily interested in receiving more US military aid, primarily predicated on dissatisfaction with Soviet logistics and perceived Western technological superiority. Current deals include a $110 million deal for the Army to receive 15 UH-60 Blackhawk assault/transport helicopters, which would replace aging Mi-8 helicopters. Army officers have also indicated interest in purchasing up to 50 M60A3 main battle tanks, as part of a counterbalance against Chilean purchases of tanks from France and Israel. Up to 200 M113 armored personnel carriers have also been considered for sale.\n\n2. The Peruvian Navy has an impressive capability for South American navies, but has suffered recently from antiquated vessels, lack of missile systems, and little to no aviation capability. The Navy has been in the process of acquiring Lupo-class frigates from Italy, as well as several SH-3 maritime helicopters from us; but is seeking more air assets, including S-2 maritime patrol planes and missiles, as well as older-model LST’s to support marine amphibious operations.\n\n3. The Peruvian Air Force has a variety of combat aircraft and holds the distinction of being the third-largest air force in South America, but seeks to expand its counterinsurgency, close air support, and transport capabilities by acquiring Bell 214T helicopters, civilian-branded L-100-30 transport aircraft (C-130s), and possibly, the newest A-10 Thunderbolt CAS aircraft.\n\nIn conclusion, all branches of the Peruvian Armed Forces have indicated a desire for Western, if not exclusively American, weaponry. Having experience in counterinsurgency, we should provide weaponry and support to Peru for them to accomplish their goals."
 CIA_PERU.2.d:0 "FIREARM LAWS IN PERU: RECOMMENDATIONS FOR REFORM\nPeru Desk, Office of Latin American Analysis, Directorate of Intelligence, CIA; Defense Attache, EMBASSY LIMA\nSECRET/NOFORN\n\nRecent increases in insurgency activity, by both the Maoist \"Shining Path\" (Sandero Luminoso) and the Tupac Amaru Revolutionary Movement (MRTA) have nearly exhausted the Peruvian Government’s conventional military capabilities. Intelligence has indicated that the Valle de los Rios Apurimac, Ene and Mantaro (VRAEM) region, with an indigenous-majority population, has wide Shining Path support, with any resistance being hampered by oppressive firearm laws.\n\nFirearm laws in Peru have been conservative since the Colonial Spanish period, in particular targeting indigenous Inca people, whom the Spanish feared would resist against their colonial ambitions. However, the law has remained, essentially preventing rural communities, most of whom are indigenous, to defend themselves against Communist threats.\n\nEmbassy Lima and the Defense Attache have proposed pressuring the Peruvian Government to repeal its firearms law, on the basis that it would allow indigenous communities to form anti-communist or anti-Sandero Luminoso militias and autonomous defense organizations (known locally as \"rondas campesinas\" or \"peasant rounds\"). These organizations would greatly benefit Peruvian government forces in their ongoing counterinsurgency campaign, as local units appear to be marginally more effective as shown in other conflicts.\n\nPreliminary intelligence from sources within the Peruvian Government indicate that a repeal of firearms laws has wide support among both the legislature and the military; intelligence on the indigenous community has also indicated some degree of willingness to contribute to counterinsurgency operations, but on the basis of further reforms to support indigenous populations."
 CIA_PERU.3.d:0 "SANDERO LUMINOSO SUPPORT IN RURAL PERU: OPPORTUNITIES & ANALYSIS\nPeru Desk, Office of Latin American Analysis, Directorate of Intelligence, CIA; Defense Attache, EMBASSY LIMA\nSECRET/NOFORN\n\nIn the midst of Peru’s ongoing insurgency, particular attention has been paid by intelligence sources to the rural Valle de los Rios Apurimac, Ene and Mantaro region, in the Andes Mountains, as a location to focus on in combating the Sandero Luminoso (Shining Path, or SL) Maoist guerrilla movement. SL support has been high in this region, being home to a high indigenous Inca and Quechua population who have been largely ignored and marginalized by the central government in Lima.\n\nEmbassy Lima and the Defense Attache believes that undercutting SL support in this region, via pressuring the Peruvian government for reforms and systematic changes in counterinsurgency tactics, will shift the momentum from supporting SL to the Peruvian government.\n\n1. Legal reforms may be preferable to the indigenous population, as Inca, Quechua, and other \"Amerindians\" are legally separate from other ethnic groups and therefore, have different legal rights. Legal reforms may also include additional autonomy in local government and language legislation to allow more flexibility in native languages.\n\n2. Rural land reforms are a definite recommendation to the Peruvian government in gaining support from indigenous groups. Current SL levels of support exist because of rhetoric about exploitation of indigenous land and the central government being out of touch with indigenous needs. Land reform could include additional decentralization initiatives, local indigenous cooperatives as have been done previously, and subsidies for agriculture.\n\n3. Militarily, pressuring the Peruvian Armed Forces for more comprehensive rules of engagement are extremely necessary. Much SL support also comes from Peruvian government actions which have resulted in deaths of civilians, mostly revenge killings and other atrocities, due to a lack of rules of engagement with counterinsurgency operations. The Defense Attache recommends further pressuring of Peruvian generals via threatening to withhold aid to accomplish this goal.\n\nBy effectively communicating these desires to the Peruvian Government, and beginning a civil action campaign with the indigenous population, the tide of public opinion should begin to turn against the Sandero Luminoso guerrillas and assure greater operability for Peruvian government forces."
 CIA_PERU.4.d:0 "The Legal Attache at the US Embassy in Lima has come to us via the Minister of Justice with an urgent proposal on legal reforms that our government can implement in the indigenous-majority Andean departments. According to the Attache’s office, these proposals include extension of further autonomy to indigenous groups for local government, changing legal definitions and rights of the Inca and Quechua peoples, and extending language protections in those areas.\n\nSome members of our government have expressed support, arguing that acceding to the indigenous community, most of whom constitute the bulk of Sandero Luminoso (SL) support, would cause them to turn against the SL and towards our government. However, some conservative military officers and other government officials remain skeptical, arguing that now is not the time to extend reforms to a violent and lawless area of the country where operations are taking place. How shall we respond?"
 CIA_PERU.5.d:0 "The Legal Attache to the US Embassy in Lima has reported that the Peruvian Government has acceded to his proposal for comprehensive legal reforms focused on the indigenous community. The Peruvian Minister of Justice, in a phone call with the Ambassador and Legal Attache, confirmed this and told them that they would move to restore autonomous local government to Inca and Quechua communities via executive decree, but that legislation surrounding language and further legal rights would take time in the Congress of the Republic.\n\nThe attitude in the Peruvian Government is seen to be positive by this, with the hope being that the indigenous community will begin to turn to the central government and against the Sandero Luminoso (Shining Path) guerrilla group. Attitudes in Langley and at Foggy Bottom are also positive, with the hope that the intended reforms will actually succeed as proposed."
 CIA_PERU.6.d:0 "Unfortunately, the Legal Attache at the US Embassy in Lima has reported that the Peruvian Government has rejected his proposal for legal reforms of the indigenous community in the Andean Highlands. Originally proposed as a way to influence indigenous peoples to support the central government in Lima instead of the Sandero Luminoso, the reforms were quickly denied as \"not timely nor necessary in the face of a national emergency from Communist terrorists,\" according to the Peruvian Minister of Justice in a statement.\n\nBoth State Department and CIA officials, as well as Embassy officials, are not happy about this development, considering it a loss to the Peruvian government as well as a loss in terms of projecting US influence in the country."
 CIA_PERU.7.d:0 "An official from the US Embassy in Lima has come to us via the Minister for Agriculture with an urgent proposal on rural agrarian reforms that our government can implement in the indigenous-majority Andean departments. According to the agricultural officer, these proposals include the formation of local indigenous land cooperatives, further decentralization measures by the central government in Lima, and the beginning of subsidies and other aid for farms and cooperatives.\n\nThese proposals have generated much controversy within our government, with most conservative politicians and military officers decrying the proposals as not appropriate and too left-wing, resembling Sandero Luminoso propaganda put out in those areas. However, many liberal-leaning officers and politicians argue that these reforms, while limited, may bring support to our cause, especially among indigenous populations who feel that they have been neglected or discriminated against when it comes to land policies; and because of that, are turning to the SL to achieve their goals. How shall we choose?"
 CIA_PERU.8.d:0 "An agricultural officer attached to the US Embassy in Lima has reported that the Peruvian Government, via the Minister of Agriculture, has accepted a US proposal for rural reform in the Andean Highlands. Originally proposed as a way to attract more government support among native populations, who feel marginalized and make up the bulk of Shining Path (Sandero Luminoso) support, the reform includes the formation of indigenous land cooperatives, decentralization initiatives, and subsidies to farmers.\n\nWidely expected to fail in Peru’s heavily conservative and anti-communist government, the reform package is expected to be approved soon, according to the Peruvian Minister of Agriculture. State Department and CIA officials are pleased by this development, and the President expects to be briefed on it soon."
 CIA_PERU.9.d:0 "Unfortunately, the US Embassy in Lima reports that the Peruvian Government has unequivocally rejected all proposals for rural reform in the Andean Highlands region of the country. Proposed as a strategy to attract crucial indigenous support in the ongoing counterinsurgency campaign against Shining Path, the Peruvian Minister of Agriculture decried it in a statement as \"playing into the hands of Guzman and his Maoist terrorists\" and \"weakening the power of the Republic at a crucial moment when security is paramount.\"\n\nState Department and CIA officials are reportedly frustrated by this development, as it appears that US inroads to Peru are slimming. The President was supposed to be briefed on these developments, but senior officials have decided to hold back on telling him for now."
 CIA_PERU.10.d:0 "The Defense Attache at the US Embassy in Lima has come to us via the Minister of Defense with an urgent proposal on rules of engagement for Peruvian Armed Forces units and personnel in their ongoing counterinsurgency campaign against the Maoist Sandero Luminoso guerrillas. The Attache has suggested several examples of more comprehensive rules of engagement, including enforcement of civil action operations, incident reports, and a more rigid command structure as well as independent military inspector-generals in each unit.\n\nSenior generals within the Armed Forces have sharply opposed this proposal as running counter to what has been a relatively successful campaign thus far, with government troops operating with near-total impunity. They argue that rigid rules of engagement would play into the hands of the Communists, ensure the loss of operational integrity, and remove any surprise tactics from government forces. Proponents, however, argue that such rules will temper the scale of future atrocities and further legitimize the military as a state enforcement power. How shall we choose?"
 CIA_PERU.11.d:0 "The Defense Attache to the US Embassy in Lima has reported that the Peruvian Government has reluctantly accepted a proposed set of rules of engagement for the Armed Forces in their ongoing counterinsurgency campaign against the Maoist Sandero Luminoso (Shining Path) guerrilla group. Proposed as a way to set guardrails against government forces and to prevent further atrocities committed by the military, the rules of engagement include more stringent chains of command, an independent inspector-general, and more punitive measures for accused soldiers.\n\nState Department and CIA officers are pleased with this development, but remain somewhat concerned that the Peruvian Armed Forces may not follow through on their promises. Additional enforcement will be required to make sure that Peru follows their end of the bargain."
 CIA_PERU.12.d:0 "Unfortunately, the Defense Attache at the US Embassy in Lima has reported that the Peruvian Government and Armed Forces have fully rejected our proposals for more comprehensive rules of engagement in their ongoing counterinsurgency campaign against the Sandero Luminoso Communist guerrilla group. A spokesman for the Peruvian Ministry of Defense condemned the proposal as an \"attempt to control the internal affairs of Peru\" and that \"so-called atrocities are attempts by the Communist terrorists to shift the blame from their own crimes.\"\n\nState Department and CIA officials are not pleased with this development, but not altogether surprised. The United States will have to consider other possibilities in its potential involvement in Peru in the future."
 CIA_PERU.13.d:0 "It was an early morning in the Situation Room, as President [USA.GetLeader] came in, half-dressed, having been woken just 15 minutes prior. The room was abuzz, but went to silence abruptly as he walked in, with the entire room standing up, then sitting back down with a wave.\n\n\"What’s the situation? Director, go.\"\n\nThe Director for Central Intelligence, [GetCurrentCIADir], stood up. \"Mr. President, approximately two hours ago, we received word from still-embedded agents in Peru that the capital city of Lima has officially fallen to communist insurgents, led by the Sandero Luminoso, or Shining Path, Maoist guerrilla group.\"\n\nSecretary of State [GetCurrentSecState] broke in. \"As you know, Mr. President, the embassy in Lima was evacuated several days ago and personnel were airlifted to Brazil. Officially, there are no United States government personnel still on the ground there. We are unsure about the number of US citizens or any embedded intelligence personnel still in-country, but are doing our best to interface with neighboring Ecuador and Chile to determine their whereabouts. Additionally, emergency meetings of the United Nations Security Council and Organization of American States have been called for later this morning in New York and here in DC. State will have ambassadors going to both and we will be aggressively lobbying for whatever solution comes out of this room tonight.\"\n\nNational Security Advisor [GetCurrentNatSecAdv] then stood up. \"Mr. President, most of the officials here tonight have agreed on at least two possible courses of action. We cannot let this action by Shining Path go unanswered, especially with our ongoing involvement in South America and in particular, assistance to the now-ousted Peruvian government. Therefore we have two options: go the diplomatic route and condemn and sanction, using the powers of the UN and OAS as well as other regional bodies; or to take the more interventionist path, which would involve both American and likely regional militaries forming a coalition and retaking populated areas.\"\n\nSeveral military officers, including the Commander of US Southern Command spoke up. \"Mr. President, US Southern Command has been monitoring the situation as it’s been developing and has pulled all US personnel and most senior Peruvian military officials out of the country. We are preparing possible operational plans including multinational operations, but it is not known how effective an intervention will be, particularly against a tough and experienced guerrilla force.\"\n\n\"Very well.\" The President sighed, looking around. \"Secretary, get me possible sanctions and diplomatic solutions. I want any and all military options and before we do anything we need diplomatic assurances. Make some calls and we’ll reconvene in a few hours.\""
 CIA_PERU.14.d:0 "NOTICE OF PERU SANCTIONS REGULATIONS\nOffice of Foreign Asset Control, United States Department of the Treasury\n\nThe United States, in enforcement of United Nations Security Council and Organization of American States resolutions, places the following economic sanctions on the following individuals and industries within the Republic of Peru.\n\n1. Abimael Guzman, nationality, Peruvian, born 3 December 1934; commonly known as \"Chairman Gonzalo,\" Chairman of the Communist Party of Peru, founder of Shining Path in 1969 and provisional leader of Peru following Shining Path’s takeover of the country;\n\n2. Augusta Deyanira La Torre Carrasco, nationality, Peruvian, born 29 August 1946; commonly known as \"Comrade Norah,\" recognized as second-in-command of Shining Path, and Guzman’s wife.\n\n3. Florindo Eleuterio Flores Hala, nationality, Peruvian, born 8 September 1961; commonly known as \"Comrade Artemio,\" senior commander of the People’s Guerrilla Army, the main fighting force of the Shining Path.\n\n4. Oscar Ramirez Duran, nationality, Peruvian, born 16 March 1953; commonly known as \"Comrade Feliciano,\" senior leader of Shining Path and commonly thought of as Guzman’s third-in-command and possible successor.\n\n5. Osman Morote Barrionuevo, nationality, Peruvian, born 15 April 1945; commonly known as \"Comrade Nicolas,\" senior leader of Shining Path and commonly thought of as one of Guzman’s senior commanders and successors.\n\n6. The Peruvian copper and silver extraction industries, including all mines, mining companies owned by Peruvian individuals, and import-export firms.\n\n7. The Peruvian lumber industry, including all harvesting firms, companies owned by Peruvian individuals, and import-export firms.\n\nThese sanctions are effective immediately.\n\nSIGNED\nUnited States Secretary of the Treasury"
 CIA_PERU.15.d:0 "In the wake of the Communist takeover in Peru by the Shining Path Maoist insurgent movement, the United States government has officially placed sanctions on Peru, both focused on specific individuals and leaders of Sandero Luminoso, as well as Peru’s major export industries. According to a statement from the US Treasury Department’s Office of Foreign Asset Control, \"sanctions have been placed on Abimael Guzman, leader of the Shining Path group, as well as his family, friends, senior leaders, and other senior commanders of the Communist Party of Peru.\"\n\nIt is not known how the Peruvian economy will be directly affected by these sanctions, while the country is rapidly transitioning to a Communist regime. International observers have commented on the sanctions as being a diplomatic slap on the wrist and unlike past US policy, while South American allies have complained that this policy was not enough."
 CIA_PERU.16.d:0 "OPERATION COPPER EAGLE: OPERATIONAL PLAN\nHeadquarters, United States Southern Command; Headquarters, Ecuadorian Armed Forces; Headquarters, Chilean Armed Forces\nSECRET/NOFORN\n\nIn violation of United Nations Security Council and Organization of American States resolutions demanding the lawful government of Peru be reappointed, the Shining Path guerrilla group and its armed force, the People’s Guerrilla Army, have violated international law and the principles of peace and security. With the approval of the international community, the United States has formed a coalition with neighboring states Ecuador and Chile to facilitate a swift and painless multinational operation to restore democratic order to Peru.\n\n1. Units of the United States Southern Command (USSOUTHCOM), including Joint Task Force Bravo based in Palmerola, Honduras; the 193rd Infantry Brigade based in Panama; and all associated United States Navy and Air Force units will be responsible for mounting an airborne/amphibious seizure of the capital city of Lima, Peru.\n\n2. Units of the Ecuadorian Armed Forces, including the Ecuadorian Army and Air Force, will be responsible for a southward advance from the Peruvian border to the city of Trujillo, Peru, where they will rendezvous with US and government-associated forces.\n\n3. Units of the Chilean Armed Forces, including the Chilean Army and Air Force, will be responsible for a narrow northward advance from the Peruvian border towards the cities of Arequipa and Cuzco.\n\n4. Units of the former Government of Peru and Peruvian Armed Forces will serve in liaison and support roles, acting as counterinsurgency guides, navigators, interpreters, and serving in civic action roles. Rules of engagement by all parties, formed by USSOUTHCOM, will be promulgated to reduce civilian casualties.\n\nOperational command of Operation Copper Eagle will be delegated to Commander, US Southern Command; with the Chief of the General Staff of both the Ecuadorian and Chilean Armed Forces being given the opportunity to select a deputy. All command operations, until Lima is secured, will be located in Panama City, Panama; Quito, Ecuador; or Santiago, Chile.\n\nSIGNED\nCommander, US Southern Command"
 CIA_PERU.17.d:0 "Shock and awe came out of South America today as the United States, supported by Ecuador and Chile, launched Operation Copper Eagle, a multinational invasion of Peru, to \"restore democratic order\" to the country, recently taken over by the Communist guerrilla group known as Shining Path (Sandero Luminoso). Supported by Ecuadorian forces from the north and Chilean forces from the south, US units of the 193rd Infantry Brigade and Joint Task Force Bravo, as well as United States Navy and Air Force air support, landed outside of the capital city of Lima and began establishing a strong position.\nWhile it is not known of the success against Shining Path forces, due to operational security by the American coalition, it is not expected that this will be a short conflict, due to the relative robustness of Communist forces. Soviet and Eastern Bloc nations, as well as Cuba, roundly condemned the intervention as further American imperialism."
 CIA_CHIAPAS.0.d:0 "ZAPATISTA INSURGENCY IN CHIAPAS: SUMMARY\nMexico Desk, Office of Latin American Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nRecently, the southernmost Mexican state of Chiapas has been rocked by a new insurgency movement, calling themselves the Zapatista Army of National Liberation (Ejercito Zapatista de Liberación Nacional, or EZLN). Composed mainly of indigenous people and local subsistence farmers, the EZLN has resisted oppression by the Chiapas state government and federal government in Mexico City via a series of attacks and kidnappings of prominent and former state officials.\n\nEspousing an ideology known as \"neozapatismo,\" the EZLN, or Zapatistas, take their name from Emiliano Zapata, a leader of the 1910 Mexican Revolution, and consists of mainly left-wing, Mayan traditional indigenous culture, Catholic liberation theology, and Marxism. The Zapatistas are strong advocates for communal land rights, particularly with the indigenous Mexican population, and oppose economic globalization on the grounds that it is oppressive to local peoples and negatively affects the lives of the peasant class.\n\nIn recent weeks, the EZLN has begun an uprising in the state of Chiapas, where they primarily operate; attacking civic centers and government buildings in the cities of San Cristobal de las Casas, Altamirano, Las Margaritas, Ocosingo, and Chanal. They have been met by government forces in most instances, wreaking havoc before returning to the Lacandon Jungle, where the group mostly operates.\n\nIt is unclear how we should respond to this. On one hand, it is an internal issue for Mexico; however, the impulse to support the Zapatistas is large, and would go against established policy."
 CIA_CHIAPAS.1.d:0 "AUTONOMY IN CHIAPAS: POSSIBILITIES FOR FUTURE\nMexico Desk, Office of Latin American Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nThe recent indigenous opposition and insurgency in the southern Mexican state of Chiapas has galvanized calls for greater state autonomy. The inability of Mexican federal forces to adequately control the situation, and predicated on mistreatment from Mexico City, has caused CIA and State Department officials in the region to take significant notice. Pushes for autonomy by Chiapas state officials and EZLN members have taken notice, and potential autonomous status of Chiapas may have the following goals and effects:\n\n1. EZLN forces already have adequate control of the Chiapas state government, and any further attempts by the federal Mexican Government may result in a wider conflict in the country, as anti-government and indigenous groups are widespread throughout, particularly after the approval of the North American Free Trade Agreement (NAFTA).\n\n2. Mexican officials have pushed us for further military aid. However, we support a peaceful solution in this case, as a wider conflict will affect our economic relations and Mexico’s economy.\n\n3. The Intelligence Community is not supportive of covert aid to either party. Coordinating negotiations on a separate state for Chiapas, or greater autonomy within the federal Mexican Government, will provide greater legitimacy for the United States, EZLN, and other interested parties."
 CIA_CHIAPAS.2.d:0 "The US Ambassador in Mexico City has approached our government with a proposal for autonomy in the southern state of Chiapas. While our counterinsurgency campaign against the separatist and left-wing Zapatistas (EZLN) forces has been marginally successful, the autonomy proposal has garnered approval, both in the international community and in the Chiapas state and federal governments. Such proposals include devolving more economic and budgetary authority to the Chiapas government, restricting federal military and security forces from conducting operations in the state, and providing greater ethnic language and land ownership rights to the indigenous people of Chiapas, most of whom make up the EZLN movement.\n\nProgressive members of our government argue the possible benefits of granting Chiapas autonomy, in that their rebellion may quiet down and that the EZLN may be able to be negotiated with in good faith based on legitimate concerns and demands, while also remaining under the general control of the federal government and not becoming a separate sovereign state. More conservative members of our government have continually argued the drawbacks in granting Chiapas autonomy, saying that they would play right into the hands of the EZLN and that other Mexican states would also consider demanding autonomy from the federal government, further decentralizing the control that Mexico City has on the states. How should we choose in this proposal?"
 CIA_CHIAPAS.3.d:0 "The US Embassy in Mexico City has reported that the federal Mexican Government has approved a draft proposal to grant autonomy and further reforms in the southernmost state of Chiapas, on the border with Guatemala. Facing an indigenous and left-wing separatist and reform movement known as the Zapatistas or the EZLN, the Mexican Secretary of the Interior said in his statement that \"due to extenuating circumstances, the state of Chiapas will be provided with further resources to support its economic activities and self-governance,\" including a restriction on federal military activities in the state, deregulation of taxation and finance policies towards the state, and an expansion of powers for the Governor of Chiapas.\n\nWhile not overtly involved in the Zapatista issue, Mexican and Latin American-focused policymakers in Washington are pleased by this development, allowing greater self-governance and less involvement of federal officials on the local indigenous populace, who have faced both political and economic repression in the past."
 CIA_CHIAPAS.4.d:0 "The US Embassy in Mexico City has reported that the federal Mexican Government has rejected a draft proposal to grant autonomy and further reforms in the southernmost state of Chiapas, on the border with Guatemala. Facing an indigenous and left-wing separatist and reform movement known as the Zapatistas or the EZLN, the Mexican Secretary of the Interior reiterated in a statement that \"legitimate concerns can be addressed through other means\" and that \"terrorism by EZLN forces on innocent civilians in Chiapas cannot be rewarded by giving them more power and influence.\" The Secretary then announced a further crackdown and enforcement mission against the EZLN by Mexican military and police forces, ensuring that autonomy would not come to the state via Mexico City.\n\nWhile not overtly involved in the Zapatista issue, Mexican and Latin American-focused policymakers are disheartened by this development, with some fearing the outbreak of a wider conflict due to EZLN anger at this announcement."
 CIA_CHIAPAS.5.d:0 "BENEFITS OF SUPPORT TO ZAPATISTA REBELS/EZLN FORCES\nMexico Desk, Office of Latin American Analysis, Directorate of Intelligence; US EMBASSY MEXICO CITY\nSECRET/NOFORN\n\nBecoming aware that the conflict between the Zapatistas in the state of Chiapas and the federal Mexican Government has worsened, the CIA Chief of Station in Mexico City attaches the following recommendations for greater US involvement in and support of the Ejército Zapatista de Liberación Nacional (EZLN, or Zapatistas) in an attempt to guarantee self-governance and indigenous rights in the region.\n\n1. Mexican forces, consisting of both military and local police forces, have attempted to conduct counterinsurgency operations against EZLN forces, but have not been successful due to EZLN positions and headquarters located in the Lacandon Jungle, which crosses the Mexican-Guatemalan border and is extremely hard to navigate without being a local. US forces are adept at jungle warfare and insurgency tactics, and military support against a militarily incompetent force would prove generally successful.\n\n2. Support for the EZLN has waned outside of Chiapas. US support could include propaganda and civic action programs in other Mexican provinces of the Zapatista ideology, with the idea of stirring up further resentment and allowing action against the Mexican Government to be taken in further numbers.\n\n3. Covert support initiatives could include arms transfers of small arms, machine guns, small vehicles, explosives, some electronic and communications equipment, limited air support, and other support equipment. Training could also be provided by USSOUTHCOM forces or CIA assets, particularly focusing on attacks towards weak points and expanding the insurgency network.\n\nThe above is stated with the assumption that CIA and the White House will want to actually support the EZLN. CIA Chief of Station [REDACTED]’s opinion does not represent the opinions of all officials at CIA."
 CIA_CHIAPAS.6.d:0 "MODERATING THE ZAPATISTA MOVEMENT AWAY FROM MARXISM\nMexico Desk, Office of Latin American Analysis, Directorate of Intelligence; US EMBASSY MEXICO CITY\nSECRET/NOFORN\n\nThe Zapatista movement, also known as the Ejército Zapatista de Liberación Nacional (EZLN), primarily located in the southernmost Mexican state of Chiapas, has become known for its left-wing, indigenous, pro-land reform positions, taking their ideology and advice from late Mexican revolutionary Emilio Zapata. While the United States has committed to supporting the EZLN in their campaign against the federal Mexican government, the CIA Chief of Station in Mexico City has expressed concern about the movement’s pro-Marxist leanings and has attached the following suggestions for political moderation of Zapatista cells.\n\n1. Reiterate the importance of land reform and indigenous rights without explicitly Marxist ideas. Land reform can and has been accomplished by other political regimes that are not explicitly Marxist, and Marxist ideology is not necessarily required to accomplish their goals.\n\n2. Negotiation with the Mexican federal government and Chiapas state government is still an avenue to accomplishing EZLN goals. The movement should be sufficiently moderated if top EZLN officials are convinced of peaceful options and not just limited to offensive attacks.\n\n3. Offensive attacks, while limited in scope, should have specific political goals and be restricted to avoid civilian casualties at all possible. Such restrictions and rules of engagements should adequately prevent more radical figures within the EZLN from committing unnecessary attacks that will cause further intervention by Mexican federal forces.\n\nIt is hoped that these recommendations by CIA Chief of Station [REDACTED], whose opinions do not necessarily represent all of those in the CIA, will allow policymakers to sufficiently moderate the movement, taking them away from a Marxist orientation and allowing further American support."
 CIA_CHIAPAS.7.d:0 "It was a cool night over northern Guatemala as the C-130 flew low over the jungle. The pilot, a US Air Force lieutenant, yawned as he banked slightly left, checking his map and compass for the Mexican border, which was basically invisible from this altitude.\n\nBehind him sat six men, dressed in combat fatigues virtually indistinguishable from Mexican police, armed with holstered pistols and M-16s as they sat hooked into the aircraft, rucksacks in between their legs. They checked their lights, magazines, strapping more bags to themselves as the ramp lowered, the pilot seeing a flash from the ground indicating the drop point.\n\nA red light flashed, and a buzzer rang as the men saluted the loadmaster in the cargo area, dropping out of the aircraft one by one opening parachutes and descending into the Lacandon Jungle below them. The C-130 kept on, as it was undercover on \"electronics and surveillance operations\" over Mexico from Palmerola Air Force Base in Honduras. The men, however, would land in the jungle, being met by EZLN guerrillas, and inserted into the command structure to begin training for the indigenous, anti-government movement focused on land reform in the southern state of Chiapas. All in a day’s work for these men of Langley."
 CIA_CAM80.0.d:0 "THE SITUATION IN CAMBODIA: POSSIBILITIES FOR US INVOLVEMENT\nCambodia Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nSince the end of US involvement in the Vietnam conflict, the geopolitical and internal situation in neighboring Cambodia has become complicated. Having removed Norodom Sihanouk from power in a 1970 coup, the US-backed regime faced insurgency from the Communist Khmer Rouge, who eventually seized control of Phnom Penh, the capital, in 1975.\n\nRuling under a reign of terror for three years, the Khmer Rouge regime killed up to two million Cambodians, before being ousted in 1978 by a Vietnamese invasion from the east. The country is currently ruled by the Vietnamese-backed, pro-Soviet, and anti-Khmer Rouge Kampuchean People’s Revolutionary Party as the People’s Republic of Kampuchea.\n\nIntelligence has indicated that a government-in-exile may be formed. Known as the Coalition Government of Democratic Kampuchea, it is backed by the People’s Republic of China under [PRC.GetLeader] and is composed of the remnants of the Khmer Rouge regime, the anti-Khmer Rouge Khmer People’s National Liberation Front (KPNLF), and the Sihanouk-led royalist National United Front for an Independent, Neutral, Peaceful, and Cooperative Cambodia (FUNCINPEC).\n\nThe US has a unique opportunity to change policy in this region. Having recovered from our actions in Vietnam, Washington could consider helping to organize this Coalition Government of Democratic Kampuchea, granting it key international recognition that would allow it to usurp the Hanoi-backed regime in Phnom Penh. However, bearing in mind the participation of the Khmer Rouge in the Coalition Government, it may be wise to hold for the moment. Allowing KR to have influence may lead to further problems in the future."
 CIA_CAM80.1.d:0 "In a surprising turn of events, US Secretary of State [GetCurrentSecState] announced today that the US would not be supporting a proposed Coalition Government of Democratic Kampuchea, an opposition group against the ruling People’s Republic of Kampuchea, a Vietnamese-backed rump state. Composed of Khmer Rouge elements, the anti-KR Khmer People’s National Liberation Front, and the royalist FUNCINPEC party, the Coalition Government has received support from Communist China as a hedge against Vietnam.\n\nReiterating that \"the United States does not support any coalition government that includes Khmer Rouge elements,\" the Secretary of State essentially ended any chance of an opposition Coalition Government in exile from getting international recognition."
 CIA_CAM80.2.d:0 "PROPOSAL FOR INTELLIGENCE SHARING TO ASEAN TOWARDS CAMBODIA\nCambodia Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nFormed in 1967 between Indonesia, Malaysia, the Philippines, Singapore, and Thailand, the Association of Southeast Asian Nations (ASEAN)’s main goal is to accelerate regional collaboration, contain communism, and ensure stable economic and cultural growth. In recent years, with the spread of communism in the region and the Vietnam conflict, ASEAN has become more important to US security interests, particularly relating to Thailand, Laos, and Cambodia.\n\nBased on the US Intelligence Community, the Department of State, and the White House’s decision to not support the proposed Coalition Government of Democratic Kampuchea; Cambodia Desk, along with Embassy Bangkok, recommends closer American cooperation ASEAN as a means of indirect involvement in Cambodian and regional affairs, focusing on defense, security cooperation, and intelligence sharing with all member nations.\n\n1. Intelligence sharing with member nation services, including the Thai National Intelligence Agency (NIA), Indonesian State Intelligence Coordinating Agency (BAKIN), the Malaysian External Intelligence Organization (MEIO), and the Filipino National Intelligence and Security Authority (NISA). This intelligence sharing, particularly with NIA and NISA, will ensure timely intelligence and support of regional allies in surveilling Cambodian activities.\n\n2. Other forms of security cooperation may also be considered, including Department of Defense Foreign Military Sales (FMS) and training initiatives. Assets from CIA and DIA may also consider conducting on-the-ground training, particularly in surveillance and insurgency tactics on the Thai-Cambodian border.\n\n3. A key facet should be ensuring an adequate intelligence reporting and verification network to keep tabs on Phnom Penh, particularly as the current regime is pro-Hanoi and essentially a rump state."
 CIA_CAM80.3.d:0 "The CIA Chief of Station in Bangkok has informed us that the United States will begin sharing classified intelligence information on the Cambodian government to our National Intelligence Agency (NIA). Mostly consisting of contact reports, news broadcast transcripts, and classified National Intelligence Estimates on Cambodia, the CIA has begun sending reams and reams of paper documents across Bangkok to NIA offices, with promises of further intelligence training and cooperation in surveillance efforts towards Cambodia.\n\nAs part of a concerted effort to expand intelligence sharing in Southeast Asia among members of ASEAN, Thailand represents the focal point in American efforts to keep tabs on the Vietnamese-backed Cambodian rump state. Prominent Thai military and intelligence officials are pleased by this development and excited to collaborate more with American intelligence assets, like they similarly did during the Vietnam conflict."
 CIA_CAM80.4.d:0 "POSSIBLE NEUTRALITY IN CAMBODIA?\nCambodia Desk, Office of Southeast Asia Analysis, Directorate of Intelligence; EMBASSY BANGKOK\nSECRET/NOFORN\n\nBased on the current administration’s decision to not support the Cambodian opposition Coalition Government of Democratic Kampuchea; US Embassy Bangkok, CIA officials, and other officials in the Intelligence Community and Department of Defense have determined that strict neutrality in Cambodian affairs is imperative to advance American interests in the region.\n\nAfter conferring with ASEAN members including Thailand and Indonesia on the matter, it has been determined that neutrality is the best option due to the lack of options for responsible government in Cambodia. The United States refuses to recognize nor support the current Vietnamese-backed People’s Republic of Kampuchea, despite their anti-Khmer Rouge leanings.\n\nAdditionally, the Coalition Government of Democratic Kampuchea may appear to be a better option, but is similarly plagued with internal issues. For one, the coalition is composed of former Khmer Rouge remnants, which if discovered will cause international issues for the United States; as well as royalist elements under Norodom Sihanouk that were ousted by the Khmer Rouge, and anti-Khmer Rouge elements. It is clear that we should lend our support to neither party, and thus remain neutral in the region.\n\nMaintaining support to ASEAN and other Free World allies in the region, however, is imperative. Action must be taken against Hanoi and its puppet in Phnom Penh, but not one that supports the Coalition Government in its current form."
 CIA_CAM80.6.d:0 "It was mid-day in the Oval Office as President [USA.GetLeader] sat down to lunch; a ham on Rye and small Caesar salad would do just fine. As he began to eat and look over papers, a few aides entered the Oval; Secretary of State [GetCurrentSecState], National Security Advisor [GetCurrentNatSecAdv], and Director of Central Intelligence [GetCurrentCIADir].\n\n\"Sir, we need to talk about our relations with Cambodia. Since we’ve decided to back the Coalition Government of Democratic Kampuchea, State and NSC have discussed how to organize it. I assume you’ve read our brief on the Coalition?\"\n\nThe President looked up at the three officials. \"Yes, but bring me up to speed.\"\n\n\"Yes, sir.\" The DCI nodded. \"The Coalition Government is made up of most opposition groups against the Hanoi-backed People’s Republic of Kampuchea; including former Khmer Rouge elements, members of the Khmer People’s National Liberation Front, which is anti-Khmer Rouge, and the royalist FUNCINPEC, led by Sihanouk.\"\n\nThe National Security Advisor broke in. \"Our concern lies in how to organize and manage the Government so as to prevent internal disputes between all three factions, who historically have been opposed to each other. State has already reached out covertly to ASEAN member nations and each of the groups about forming a Government officially with our backing. We have also proposed them taking the UN seat in New York.\"\n\n\"Sounds good, gentlemen. I expect a more comprehensive joint brief on this soon. I’ve got work to do, but thank you.\" He nodded, finishing his lunch as the three men left. Another American-backed regime established."
 CIA_CAM80.7.d:0 "\"Good morning. As of this morning, I have the pleasure of announcing that the United States of America will officially diplomatically recognize the Coalition Government of Democratic Kampuchea as the sole sovereign government of Cambodia, also referred to as Kampuchea.\"\n\n\"The United States does not recognize the illegitimate, Vietnamese-controlled People’s Republic of Kampuchea as the representative of the Cambodian people, and will accord full diplomatic relations to the Coalition Government of Democratic Kampuchea, including diplomatic representation to their government-in-exile in Beijing, People’s Republic of China.\"\n\n\"We urge all partners and allies in the international community to swiftly recognize the Coalition Government of Democratic Kampuchea as the legitimate Cambodian Government, and I am proud to announce that the Ambassador of the United States to the United Nations will be drafting a resolution to provide the Coalition Government the previously held Cambodian seat. Thank you and we will not be taking questions at this time.\"\n\nSmiling at the assembled press and diplomatic officials, Secretary of State [GetCurrentSecState] nodded before walking away from the podium, cameras flashing. Another country recognized."
 CIA_CAM80.8.d:0 "Excellent news has come in today from Washington, indicating that the United States has recognized our proposed Coalition Government of Democratic Kampuchea. In an announcement, US Secretary of State [GetCurrentSecState] reiterated American support and vowed to provide an envoy to the government-in-exile in Beijing.\n\nRepresentatives from the Khmer People’s National Liberation Front and FUNCINPEC have expressed optimism at this development, while representatives from Khmer Rouge elements appear to be in opposition for ideological reasons. President Sihanouk expects to receive an American envoy in Beijing very soon."
 CIA_CAM80.9.d:0 "AMERICAN SUPPORT TO CAMBODIAN COALITION MEMBERS: RECOMMENDATIONS\nCambodia Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nSince the United States officially diplomatically recognized the Coalition Government of Democratic Kampuchea, it has been our main goal to not only maintain friendly relations with the government-in-exile in Beijing, but also to maintain internal unity among the three principal factions. It is the opinion of Cambodia Desk, Embassy Bangkok, and Embassy Beijing that support should be given to all three factions in the government, but with caution, due to their sometimes opposite stances to American interests and relationships with each other.\n\nKhmer Rouge remnants, officially known as the Party of Democratic Kampuchea, represents the most dominant group in the coalition government. Having been ousted by the Vietnamese invasion and subsequent formation of the Hanoi-backed People’s Republic of Kampuchea, the Khmer Rouge were sidelined, having been forced to compromise with other anti-Vietnamese parties to achieve their goals. This faction has been the primary point of concern among Cambodia Desk, Embassy Beijing, and officials at Langley due to their influence and desire to militarily overthrow the PRK.\n\nThe Khmer People’s National Liberation Front (KPNLF), formed in 1979 as a coalition of anti-Vietnamese and anti-PRK guerrilla movements, is primarily anti-communist in nature. Unlike the Khmer Rouge, the KPNLF is militarized in nature, lacking the political aspects that are desperately needed in a new government, which explains their lack of influence compared to the Khmer Rouge. However, supporting them the most is paramount to American security interests as they are most closely aligned to Washington.\n\nFinally, the royalist party FUNCINPEC is the last major member of the Coalition, having been formed by former Prime Minister Norodom Sihanouk in 1981; it is heavily influential and involved with the Chinese government, having a shared goal of ousting the PRK from Cambodia; even considering allying with the Khmer Rouge to affect their goals. While not overly influential, the Coalition Government is led by Sihanouk, picked as a compromise candidate.\n\n Supporting all three parties overtly is key to maintaining overall US support and internal unity of the CGDK; the KPNLF is the most US-aligned faction and we should consider more aid and support to those forces without being exclusionary."
 CIA_CAM80.10.d:0 "Excellent news has come from our Envoy at the US Embassy in Beijing, informing us unofficially that the United States has pledged support for all members of our government, including the KPNLF and Khmer Rouge elements.\n\nPresident Sihanouk, of the FUNCINPEC movement, is reportedly pleased by this development, having previously been worried that the US would unfairly support one faction over the others. Prominent Khmer Rouge and KPNLF leaders are also pleased, and internal unity within our government is at a new high. We expect that aid and further support will begin to come to our government in Beijing soon."
 CIA_CAM80.11.d:0 "SUPPORTING ANTI-COMMUNIST OPPOSITION FORCES IN CAMBODIA\nCambodia Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nSince the United States officially diplomatically recognized the Coalition Government of Democratic Kampuchea, it has been our main goal to not only maintain friendly relations with the government-in-exile in Beijing, but also to maintain internal unity among the three principal factions. It is the opinion of Cambodia Desk, Embassy Bangkok, and Embassy Beijing that support should be given to only the anti-communist elements in the Coalition Government, due to their strategic necessity to American interests.\n\nThe Khmer People’s National Liberation Front (KPNLF), formed in 1979 as a coalition of anti-Vietnamese and anti-PRK guerrilla movements, is primarily anti-communist in nature. Unlike the Khmer Rouge, the KPNLF is militarized in nature, lacking the political aspects that are desperately needed in a new government, which explains their lack of influence compared to the Khmer Rouge. However, supporting them the most is paramount to American security interests as they are most closely aligned to Washington.\n\nThe royalist party FUNCINPEC is the last major member of the Coalition, having been formed by former Prime Minister Norodom Sihanouk in 1981; it is heavily influential and involved with the Chinese government, having a shared goal of ousting the PRK from Cambodia; even considering allying with the Khmer Rouge to affect their goals. While not overly influential, the Coalition Government is led by Sihanouk, picked as a compromise candidate.\n\nThe other remaining faction, composed of former Khmer Rouge remnants organized into the Party of Democratic Kampuchea, represent the most influential but also most threatening faction to internal unity and United States interests. Not supporting them would be preferable to maintain security interests, although support to the other two will have to remain covert to ensure adequate internal unity."
 CIA_CAM80.12.d:0 "The temporary US envoy to our government in Beijing has informed our government covertly via President Sihanouk that the US has prioritized support to only the KPNLF and FUNCINPEC parties, who are both anti-communist. In a statement to our government, the CIA Chief of Station in Beijing mentioned \"the untrustworthiness of former Khmer Rouge elements and concern in Washington that their influence will cause more problems than is worth supporting all parties.\"\n\nRepresentatives from KPNLF and FUNCINPEC have been informed that aid would come to them covertly via the Thai border and via other means. Representatives from the Khmer Rouge faction will not be informed for internal unity reasons. We welcome this development, but are concerned about unity and trust issues among each of the three parties in the government, which may become worse in the future."
 CIA_CAM80.13.d:0 "In a morning announcement today, a spokesperson for the US Department of Defense in Washington confirmed the official sale of heavy equipment to the Coalition Government of Kampuchea, considered the legitimate government of Cambodia by the United States.\n\nSet to include older-model tanks and armored vehicles, the sale will also include a few older-model helicopters, similar to those used in the Vietnam conflict. International reactions have been mixed, but most US allies remain supportive, particularly as they will be used to combat Vietnamese and PRK puppet forces in the region,"
 CIA_CAM80.14.d:0 "The temporary Defense Attache as part of our American representation in Beijing has informed us that the US will be beginning heavy arms shipments to the CGDK immediately. Composed of older-model main battle tanks, infantry fighting vehicles, minesweepers, as well as several UH-1 Huey helicopters, the aid package is designed to give our forces the initiative in combating PRK and Vietnamese forces on the Thai-Cambodian border.\n\nFigures within our government are widely pleased by this development; in addition to aid from China, this assistance will please the KPNLF and FUNCINPEC forces, many of whom form the front-line combat troops within the Coalition Government."
 CIA_CAM80.15.d:0 "The US envoy leading our American representation in Beijing has informed us that the United States will only be limiting proposed aid packages to humanitarian aid. Despite our government’s pleas for weapons and training opportunities to enhance our capability to combat the PRK and Vietnamese forces, Washington has decided our priorities for us.\n\nAccording to the envoy, the aid will be limited to \"humanitarian supplies,\" including food rations, water supplies, clothes, medical supplies, building equipment, and other items used to increase the quality of life of CGDK members and the territory we hold. Unfortunately, we hold little territory and would have preferred weapons aid first.\n\nMembers of our government, particularly the KPNLF, are furious by this development, wanting additional weapons aid as that is the Government’s priority."
 CIA_CAM80.16.d:0 "In Washington today, US Secretary of State [GetCurrentSecState] announced that the United States would be pursuing support for regime change in Cambodia. Currently dominated by the Kampuchean United Front for National Salvation, the Cambodian government is effectively controlled by their Vietnamese invaders, who hold a pro-Soviet line.\n\nWidely expected to announce this as a means of legitimizing regime change in favor of the US-backed Coalition Government of Democratic Kampuchea, this announcement was strongly condemned by the Cambodian government, the Vietnamese government, the Soviets and the rest of the Eastern Bloc."
 CIA_CAM80.17.d:0 "The US envoy leading our American representation in Beijing has informed us that the United States is actively and publicly pushing for regime change in our favor in Cambodia. In a public announcement from Washington, Secretary of State [GetCurrentSecState], announced public support for our government and urged international allies to support our cause.\n\nAll parties in the Coalition Government are pleased by this announcement, including Khmer Rouge forces. Particularly since heavy equipment has been delivered, this will guarantee our capabilities and our victory against the Hanoi-backed regime!"
 AFG_CW.0.desc:0 "Following the withdrawal of Soviet forces from Afghanistan, the situation in Afghanistan has only deteriorated further and full scale civil war has broken out. While the vast majority of opposition factions have banded under the flag of the Afghan Interim Government, the unity of the coalition is extremely suspect to say the least. With the central government unlikely to be able to indefinitely hold off the more or less unified opposition forces, the chances of the opposition being able to form a stable government is estimated at nearly non-existent. To complicate matters further, Hezb-e Islami Gulbuddin, the faction led by Gulbuddin Hekmatyar has withdrawn from the Afghan Interim Government and has taken out their own territory near Pakistan. Given the bulk of aid from Saudi Arabia and Pakistan flow to Hekmatayar’s forces one must wonder whether this alone has already doomed the slim chances of a peaceful resolution among the rebel factions. Our administration must now determine how to proceed, if we proceed at all in this burgeoning conflict."
 AFG_CW.1.desc:0 "After intensive debates within the Central Intelligence Agency (CIA) and the National Security Council (NSC) has decided to authorize additional funding for Afghani resistance forces in the beleaguered Central Asian nation. However, a decision on whom to support is still being largely debated within the intelligence apparatus. Up to this point most of our allies in the endeavor of  backing resistance forces in the region have been supplying Gulbuddin Hekmatyar’s Hezb-e Islami Gulbuddin. However his forces have yet to actually score a key military victory and have recently come at odds with the general forces. The other major faction we could support would be Jamat-e Isliami, led by noted resistance fighter Ahmad Shah Massoud. In addition to both being anti-communist, it should be noted that given the ethnic diversity of Afghanistan that Massoud and his forces largely represent Tajik interests while Hekmatyar largely represent Pashtun interests. Either choice may have long reaching consequences. "
 AFG_CW.2.desc:0 "After further debate, the National Security Council has decided to back Jamat-e Isliami over Hezb-e Islami Gulbuddin. Most of our key regional allies, especially Pakistan and Saudi Arabia have directed most of their funding and support to Hezb-e Islami Gulbuddin and other affiliated groups. However, said group has lacked any notable military victories since their inception throughout either the Soviet-Afghan War or so far during the civil war. Additionally, Gulbuddin Hekmatyar, the leader of Hezb-e Islami Gulbuddin has been shown to be politically unreliable, a key example of this was his recent withdrawal from the coalition forces against the central government. Additionally concerns have been raised over Hekmatyar’s temperament and ideology, especially with his representation of Pashtun interests, connections with more radical elements and stockpiling of heavier weaponry while staying out of the ongoing civil war. Contrarily, Massoud appears to be a unifying figure and notable leader over the last decade and could provide the leader that Afghanistan will need once the war ends. "
 AFG_CW.3.desc:0 "Thankfully, the United States has decided to support us with weaponry and financial aid in the imminent future. This comes after several meetings with American intelligence officers in northern Afghanistan in light of divisions in the opposition coalition against the communist central government along with ensuring we are capable of putting an end to the central government. Unfortunately once we inevitably defeat the Kabul government, we will need to deal with the various warlords and other factions in the ongoing war. Most concerningly is that Hezb-e Islami Gulbuddin which has split off from our coalition and has pulled back to their Pashtun strongholds near Pakistan. In a worst case scenario, Hekmatyar may be waiting for us to seize Kabul before launching his own offensive to seize our prize."
 AFG_CW.4.desc:0 "While perhaps not the most storied faction during the Afghan-Soviet War, Hezb-e Islami Gulbuddin, and their leader Gulbuddin Hekmatyar, has been a steadfast ally to our regional security partners along with being potentially useful in a reunified Afghanistan as a representative of the Pashtun people. However, Hekmatyar has led his organization to withdraw from the ongoing fighting between the interim government and communist central government and has withdrawn to his Pashtun populated redoubts. While unfortunate, this does provide a unique opportunity to await both sides to bleed each other out and then provide Hekmatyar  sufficient aid to seize control of Kabul at an appropriate time. That said, several intelligence analysts have dissented with this decision arguing that Hekmatyar is nothing more than an opportunist who will flip on his handlers the second it becomes beneficial to him."
 AFG_CW.5.desc:0 "Excellent news, Washington has decided to double down on their support for our case and have decided to ramp up their support for our cause at the expense of other Afghani factions. Even more promising is American support for our intentions to seize Kabul once the other factions bleed themselves dry in the ongoing civil war. With American support and further coordination between Washington, Riyadh and Islamabad, our forces will stand a much higher chance of successfully seizing Kabul and other critical areas in the nation when we decide to strike. On the downside, this move will surely lead to our movement being more dependent on the United States and will likely lead to us having to cave to American interests for the foreseeable future. However, this is a small price to pay for the continued support of a global power."
 AFG_CW.6.desc:0 "Over the last decade, our key regional allies, in particular Pakistan and Saudi Arabia have backed Gulbuddin Hekmatyar’s Hezb-e Islami Gulbuddin militant faction. However as time has passed, it has become clear that Hekmatayar has placed little effort in actually fighting his proclaimed enemies and even now has abandoned the coalition against the central Kabul government to withdraw to his Pashtun redoubts. Doing so may slightly alienate some of our allies, in particular Pakistan, however we should not be the determining factor in our Afghanistan policy. Further analysis by the Central Intelligence Agency has reaffirmed the National Security Council’s belief that Hekmatyar is above all an opportunist and will likely seek to cause chaos and discord later into the ongoing conflict. Contrarily, some analysts have also argued that by withdrawing support from Hekmatyar, a major figure in the Pashtun community, may lead to further radicalization among the Pashtun population of Afghanistan."
 AFG_CW.7.desc:0 "Unfortunately, the Americans have decided to halt support for our cause. While our other foreign suppliers have reassured us that they have not abandoned us, their claims are suspect at best. However, we have stockpiled significant weaponry to launch an attack on Kabul once the forces of the Afghan Interim Government and the communist central government have bled each other out. Sadly, others do not realize that we must stake our own course and seize power on our own to prevent the further oppression of the Pashtun people. The Hazara and Tajik presence in the interim coalition would surely band together to rule the country at the expense of our people, for now we must lie in wait and prepare for our eventual attack on Kabul.\n\nPerhaps we should look into deepening ties with local clerics to rally support in friendly territory?"
 CIA_PAKn.0.desc:0 "The Central Intelligence Agency (CIA) has recently learned of significant advances in the Pakistani nuclear program. Given the general instability in Pakistan and longstanding conflict with India, this is a cause of major concern. On the other hand, Pakistan is a major supporter of our activities in Afghanistan, actively anti-communist and one of our key allies in the region. This leaves us with two real options, the first option, the easiest by far would be to effectively ignore the existence of the program and in the case of a public reveal seek to block sanctions on Pakistan in the United Nations Security Council. This would enable Pakistan to continue the program and further damage nuclear non-proliferation but would suit our interests in the region. The second option would be to sanction Pakistan and seek to force the end of the program by confirming its existence publicly and backing sanction efforts in the United Nations. However this would almost assuredly cost us our alliance with Pakistan and endanger our operations in the region. How should we proceed?"
 CIA_PAKn.1.desc:0 "American President [USA.GetLeader] confirmed that they have instructed the Treasury Department to implement sanctions on Pakistan in regard to the nation’s active nuclear weapons program. The sanctions are aimed at the nuclear program itself as well as the political and military leadership in Pakistan. While the Pakistan nuclear program was not confirmed with certainty prior, this does not come as much of a surprise to the international community. What is surprising however, is that the United States has decided to take action on the matter. In recent years, Washington has increased ties with Pakistan out of shared strategic goals and enemies in the region. Especially with the ongoing conflict in Afghanistan where both the United States and Pakistan are both backing anti-communist forces against the central government. This measure throws into doubt the future of American-Pakistani ties and cooperation in the region."
 CIA_PAKn.2.desc:0 "News from Washington. America has imposed a wide range of sanctions against our government, military and in particular our nuclear program. Given our reliance on American military and economic support for our foreign endeavors and in stabilizing our rule, this is catastrophic. Not only is America placing sanctions on us, but signals have been made that the United States will push for sanctions against us in the United Nations Security Council. This set of actions will surely further destabilize our rule and endanger continued support to the mujahideen in Afghanistan. However, we have little choice but to continue our nuclear program given that India has nuclear weaponry. We will never be secure as long as India has nuclear weapons while we have no counter to prevent further Indian aggression on our rightful "
 CIA_PAKn.3.desc:0 "While the unveiling of our nuclear program has been a major blow to our nation and led to sanctions from multiple countries, the United States has remained steadfast in supporting our government. The American ambassador noted that while Washington does not approve of our nuclear program, that it was just a minor blight on our continued relationship and is vastly overshadowed by the need for continued cooperation in the fight against communism in the region. Emphasis was especially placed on the continued coordination in Afghanistan in aiming to topple the communist Afghan government and prevent the further expansion of communism in the region. While this will certainly prevent many nations from implementing sanctions, our economy will still take a hit from this ordeal, however the worst case scenario has been averted."
 MZB_CIA80.0.desc:0 "The Portuguese departure from Africa following the Carnation Revolution has led to civil wars in both Angola and Mozambique. While Mozambique did not instantly fall into civil war like Angola, tensions between different factions, parties and ethnic conflicts are all contributing factors. The war, between the communist Liberation Front of Mozambique (FRELIMO) and the nationalist Mozambican National Resistance (RENAMO). During the independence war in Mozambique, FRELIMO was effectively the sole faction fighting Portuguese rule. RENAMO, was established the year following Portuguese departure by former members of FRELIMO’s armed wing, anti-communist politicians and former Portuguese Flechas. The Flechas were the elite paramilitary units of the Portuguese Secret Police during the independence war and were composed of local tribesmen and rebel defectors.\n\nHowever lesser known to the general public, Rhodesia played a large role in shaping and establishing RENAMO as a means to destabilize Mozambique. Following the end of Rhodesia, former members of Rhodesia’s military joined RENAMO. The civil war provides us with an interesting opportunity. We could stick to supplying humanitarian aid or seek to broker a diplomatic resolution. However this would provide us with little geopolitical benefits. A more ambitious strategy would be to collaborate with South Africa in backing RENAMO and seek to justify greater intervention into the conflict."
 MZB_CIA80.1.desc:0 "The civil war and aftermath of the independence war against Portugal has left Mozambique destitute and at risk for famine, the heavy usage of landmines has also led to a medical crisis with a large number of amputees. To help alleviate this, the President has authorized a plan of action to provide humanitarian aid to Mozambique through third parties and dealing with representatives from both sides of the armed conflict to allow for the aid to be sent into their respective controlled territories.Hopefully such negotiations could lead to further contacts and bridges being built to enable diplomacy to prevail and bring an amicable end to the civil war. Unlike Angola or Ethiopia, the Mozambican Civil War has seen fairly little external interventions in recent years, while South Africa, and formerly Rhodesia had involved themselves in the conflict, their has been no major Soviet, Cuban or other Eastern Bloc presence in Mozambique."
 MZB_CIA80.2.desc:0 "Our contacts with the Central Intelligence Agency have recently conveyed to us that we will be expected to attend negotiations with the Liberation Front of Mozambique (FRELIMO) government if FRELIMO agrees to proposed negotiations hosted by Washington to bring an end to the civil war. The terms Washington has informed us that they plan to present would to some extent represent a laying down of arms on our side and accepting positions within a unity government in advance of free elections. Senior party membership privy to the proposal have expressed grave concerns over the potential of FRELIMO to void the terms of the deal after they have been disarmed while others have expressed a willingness to negotiate to bring an end to an increasingly devastating civil war. Another even more pressing concern has been raised, that being if we choose to decline will Washington simply force our hand by threatening to suspend aid and pressure Malawi and South Africa to halt material aid?"
 MZB_CIA80.3.desc:0 "Mozambican National Resistance (RENAMO) has unsurprisingly relayed their acceptance of our negotiation proposal and have announced internally their support for the measure. While we had little doubt that RENAMO would eventually come to the table, the decision to immediately agree to terms is a welcome sight for our administration. Concerns had been raised that the more hardliner members of RENAMO, especially those who had previously fought for Rhodesia and Portugal would seek to undermine potential negotiations. However, internal opposition has failed to materialize, and most RENAMO members expressed a desire to end the civil war if fair terms can be reached and enforced by a third party to ensure the terms are upheld. Now we await to hear back from the Mozambican government's response to our negotiation proposal."
 MZB_CIA80.4.desc:0 "Surprisingly the Mozambican National Resistance (RENAMO) has informed us they have no desire to engage in negotiations with the Liberation Front of Mozambique (FRELIMO). Our analysts find it hilarious that they think they have a choice in this matter. Our agents operating as handlers in RENAMO have already gotten to work pressuring senior members to reconsider, and several more hostile members have been liquidated. We expect RENAMO will change their mind in the coming days after we further express our displeasure by threatening to halt aid and inform them we are considering pressuring Pretoria to halt their own aid shipments to RENAMO bases in Mozambique and Malawi. While RENAMO continues to be pressed, we should continue our discussions with FRELIMO to try to get negotiations on track."
 MZB_CIA80.5.desc:0 "An interesting proposal has arrived recently. American diplomats have approached our foreign office and have proposed to hold negotiations between ourselves and the Mozambican National Resistance (RENAMO) with the goal of bringing about an end to the civil war. On one hand, accepting this move, whether it succeeds or fails, would reflect positively on our government and would demonstrate our willingness to bring a peaceful end to the civil war. However, such a move would surely lead to a legitimization of RENAMO and if the negotiations succeed will inevitably lead to a weakening of our control over the state apparatus and likely concessions would include moderating our foreign policy along with guaranteeing free elections in the near future, elections we may very well lose. Furthermore, accepting the offer would likely alienate our foreign allies and weaken socialist nations' support for our government. How should we proceed?"
 MZB_CIA80.6.desc:0 "Surprisingly, the Liberation Front of Mozambique (FRELIMO).has agreed to participate in the negotiations that we had requested. While unexpected, this is great news and could be an opportunity to bring an end to the bloody civil war in Mozambique and exert concessions from FRELIMO in forming a new unity government that may distance itself from Moscow and seek a more conciliatory course of action in regard to Pretoria. The State Department has been authorized to force significant concessions out of the Mozambican National Resistance (RENAMO) to ensure a productive round of negotiations and ending the civil war in favorable terms to the west. The planned proposal would establish a unified government, with the head being from FRELIMO with RENAMO getting various positions within the government and a guarantee of free elections within a few years to be honored by both sides. This should be acceptable to both sides and seek to moderate the Mozambican government. "
 MZB_CIA80.7.desc:0 "Unfortunately, the Liberation Front of Mozambique (FRELIMO). Has rejected our proposed negotiations and decried them as a stalling tactic for us to arm the anti-communist Mozambican National Resistance (RENAMO). Truly, this is a missed opportunity on their side, we were open to bringing a peaceful end on fair terms for both sides and planned to push for peaceful elections in the near-future. RENAMO has reacted largely positively to the development given their initial resilience in accepting negotiations in the first place. Our administration can now either concede our efforts to end the civil war, or consider more extreme proposals circulating within the Central Intelligence Agency and supported by more militant members of the National Security Council. Regardless, if nothing else is assured, the future of Mozambique as the civil war continues to escalate once more is bleak at best."
 MZB_CIA80.9.desc:0 "Negotiations have progressed, while we did not get as many concessions as we desired, we have signed on to an agreement with the government to bring an end to the civil war and form a national unity government. The agreement will provide our leadership with several important ministries in the government, legalize our political parties and lead to a new constitution that must be ratified by both parties and an agreement to hold free elections in the coming year with international observers present throughout the nation. Still this brings an end to our armed struggle, at least for now, but this does provide an opportunity for us to engage in free elections and put Mozambique on a path for a better future for all. How the future negotiations over the new constitution and how the Liberation Front of Mozambique (FRELIMO) will honor their agreements is unclear, our contacts with Washington are hopeful about the situation."
 MZB_CIA80.10.desc:0 "Negotiations have concluded and been finalized. To the surprise of many, our negotiators were able to come to an acceptable agreement for both parties, and bring an end to the civil war has been formally signed by the leadership of both our government and the Mozambican National Resistance (RENAMO). While issues remained, we ultimately had more to gain then lose by signing the agreement we have conceded several ministries to RENAMO and will have to conduct free elections in the coming years, our party has kept control of the presidency and will be able to take a key position in drafting the new constitution. The concessions to RENAMO by all means do decrease our influence in government, but will not cripple our ability to win the ensuing elections. Leadership remains confident that the bulk of public support remains loyal to FRELIMO given our role liberating the nation from Portugal. Still, we must remain cautious of RENAMO, Pretoria and Lilongwe intentions toward influencing the election as well as ensure the demilitarization of RENAMO forces throughout the nation or seek further compromises on integrating their soldiers into the army."
 MZB_CIA80.11.desc:0 "Rolling back communism in southern Africa has become a maj9r strategic goal of the administration. With this policy decision made, a prime target for rollback is Mozambique. The conflict is similar to the Angolan Civil War, but has received significantly less attention and with no Congressional law or amendment barring our administration from investing into the anti-communist rebels in Mozambique, we can begin operations to undermine the Mozambican government without risking criminal penalties. To this extent, the Central Intelligence Agency has directed our agents to expand their connections with the Mozambican National Resistance (RENAMO) to provide limited material aid and training to their forces. Other teams have also been dispatched to organize networks in Cabo Delgado and other northern Islamic areas in Mozambique to work towards building up an Islamic guerilla force to further drain government resources. Concerns have been raised about the potential for this strategy to spiral into sectarian violence, however the President believes that given the Muslim minority in Mozambique is largely present in the north, especially around Cabo Delgado that any religious violence would be limited in scope."
 MZB_CIA80.12.desc:0 "South Africa has long supported the anti-communist rebels in Mozambique. To aid in our endeavors in bolstering the Mozambican National Resistance (RENAMO), the President has authorized the Central Intelligence Agency to begin sharing intelligence about Mozambique with their counterparts in Pretoria with the aim of bolstering South African support for RENAMO. While perhaps distasteful, our agents have also given South Africa detailed information on African National Congress routes and bases inside Mozambique, with this provided, the South African government will surely intensify their war and continue their support for RENAMO. Concerns have been raised however by certain members within the National Security Council over cooperating with the South Africans, but the President has decided that while distasteful, it is a necessary move to further distract the Mozambican government from our involvement in the civil war."
 MZB_CIA80.13.desc:0 "While overthrowing the Mozambican government remains a strategic goal of the administration, the decision has been made that American lives will not be risked in the conflict and that further escalation with the Soviets should be avoided. This will be accomplished by continuing to covertly provide military aid to rebel forces while denying any involvement in the ongoing civil war in Mozambique. Given the general lack of standardized military equipment being utilized, our operatives will be able to quickly supply the rebels with modern firearms, landmines and other less complex systems that should still be able to heavily damage government forces. While perhaps this will not be enough to overthrow the communist government for now, it will make the Mozambican National Resistance (RENAMO) a more credible threat against the government and surely distract them from further involvement with South Africa."
 MZB_CIA80.14.desc:0 "Our efforts so far have begun to bear fruit, however if we wish to truly begin rooting out communism from southern Africa, we must begin laying the groundwork for American intervention in the region. To this effect, our operatives on the ground have collected pictures, testimonials and other information from locals displaying the horrors of the war, while we will of course spin and verify this information, the heartbreaking pictures of children missing limbs due to the heavy usage of landmines will surely tug at the heartstrings of everyday Americans and will help pressure Congress into providing additional funding for our efforts in Africa. While the media spins this, our Ambassador to the United Nations will present the evidence at the United Nations and call for a measure to enforce a ceasefire in Mozambique. This measure will be doomed to failure but will demonstrate to the public our desire to bring an end to the conflict and show how communist forces are refusing to negotiate or do their part in ending the bloodshed."
 MZB_CIA80.15.desc:0 "To further our aim to justify an invasion of Mozambique, the Secretary of State has issued our ultimatum that the government of Mozambique accept to negotiate with the Mozambican National Resistance (RENAMO), By all means, we expect for the Mozambican government to reject our ultimatum which will give us justification to being an armed intervention to overthrow the government and install a pro-western government under RENAMO leadership. While the public is still largely split on the issue, recent public polling has shown an increase in support for taking actions in Mozambique, this comes in the light of our extensive media campaign showing the actions of the Mozambican government against the population of Mozambique. Still, if we are forced to invade Mozambique, we must ensure a quick victory and not remind the public of past quagmires in Asia over the last few decades."
 MZB_CIA80.16.desc:0 "A recent missive from Washington has sent shockwaves throughout the high echelons of our government. The United States is threatening to launch an invasion of our nation to overthrow our government unless we agree to begin negotiations with the rebels to bring about an end to the civil war. Given the tone of the demands, any negotiations we enter into will inherently be rigged against us, however unlike Ethiopia or Angola, there is effectively minimal foreign volunteers aiding in our struggle and the Americans along with their allies would likely be able to cripple our military within days, if that rendering us unable to hold control over the capital and vast swathes of the country. Still, we could accept the proposal and push for a unity government and put our faith in democracy? How should we proceed?"
 MZB_CIA80.18.desc:0 "The Mozambican government has rejected our ultimatum for negotiations, with that announcement we finally have full justification to begin our armed campaign against Mozambique. With that in mind, military planners from the Department of Defense have drafted up plans to send a carrier strike group to the region and have our air assets cripple the Mozambican armed forces swiftly to enable opposition forces to launch a general offensive. Once the government forces are suppressed by our air power, our forces will seek to launch an assault on Maputo, the capital of Mozambique with the covert support of neighboring South Africa. While problems could arise, our analysts do not believe that establishing control over the capital and other urban areas will be a major problem, however, ensuring that a communist insurgency does not cripple the new government will be important and represents a major potential threat to a pro-western government."
 MZB_CIA80.20.desc:0 "Surprisingly, the Mozambican government has seen reason and has agreed to negotiate an ending to the civil war. This was not our intention when we sent the ultimatum, however we can use this as an opportunity to enforce a Mozambican National Resistance (RENAMO), dominated unity government and seek to ensure a more democratic constitution in Mozambique. A key condition for ending the civil war will be to expel all African National Congress (ANC) forces and members from the nation and merge the armed forces of both sides with a preference being given to RENAMO officers. This is overall a major victory for our administration and represents the first step in reversing the advances of communism in southern Africa. Still, work remains to be done and we must ensure that negotiations go smoothly and avoid overly drawing the ire of Moscow and Congress."
 MZB_CIA80.22.desc:0 "The failure of diplomacy in resolving the Mozambican Civil War has left us with little choice but to intervene directly into the conflict. Despite their potential unwillingness to negotiate, the goal of the operation will be to militarily defeat the Liberation Front of Mozambique (FRELIMO) government and institute a Mozambican National Resistance (RENAMO) led government. This strategic goal would represent the rolling back of communism in southern Africa as well as reduce the pressure on South Africa by cutting off one of the logistic routes for supplying the African National Congress (ANC) and other insurgent movements within South Africa. That said, we will need to balance our priorities carefully to avoid any public pushback in relation to South Africa. Publically, our motives for the intervention is to bring about a quick end to the bloody civil war and establish a technically democratic, capitalist government that will be open to negotiations with Pretoria."
 MZB_CIA80.24.desc:0 "Great news, the United States has finally launched their intervention into Mozambique to bring an end to the communist rule plaguing our nation. Our contacts in the Central Intelligence Agency have assured us that once the communist government is ousted that we will form the new government. That said, the time is now for us to launch renewed efforts to seize territory and expunge the communists from our rightful land. Safeguarding the rural areas will be critical in the coming times to prevent a renewed communist insurgency throughout the nation. We will also need to begin designing a foreign policy that balances our debts to Pretoria, Washington and Malawi while also building popular support for our government. Malawi in particular will need to be handled carefully given their simultaneous strong support for our movement while also subtly claiming a large chunk of our nation. Our government will also need to determine how to proceed with the handling of African National Congress (ANC) forces and smugglers within the nation. Still this is the start of a historic moment of African history, showing that the communist tide in Africa can be reversed."
 MZB_CIA80.25.desc:0 "Interesting news, the United States has launched a full scale intervention into Mozambique to crush the communist government. While our overt involvement has not been requested, we have provided Washington with significant intelligence on government forces along with their allied militias. Our special forces have been given permission to attack African National Congress (ANC) bases across the border to damage their infrastructure while Mozambique is in chaos. Overall, this is great news for our ongoing issues, given our support for the Mozambican National Resistance (RENAMO), the new government should be friendly to our interests and at the least crackdown on the ANC presence in Mozambique and will likely be open to economic collaboration with us along with our ally Malawi which has also been a major benefactor of RENAMO. While problems persist, especially in Northwest Africa and Angola, this should heavily damage ANC operations in the eastern reaches of our nation and will enable us to redeploy forces to further combat communist forces in the northwest."
 MZB_CIA80.26.desc:0 "The Americans have launched an invasion to overthrow our government. This comes after the failed American attempt to bring an end to the civil war. American troops have begun to land on our shores and a massive bombing attack on our military facilities has begun. Opposition fighters have also been emboldened and seemingly more well-armed and have begun creating chaos behind our lines as well. Unfortunately for us, unlike Angola or Ethiopia, there are effectively minimal Cuban presence and it is incredibly unlikely that reinforcements can come in time to salvage our situation. The current situation is bleak and will likely only become more so as the invasion picks up steam. We will need to take into consideration whether or not attempting a conditional surrender or fighting to the bitter end is the best option moving forward."
 MZB_CIA80.17.desc:0 "In a major escalation, President [USA.GetLeader] has announced an ultimatum towards the Mozambican National Resistance (RENAMO) and the Liberation Front of Mozambique (FRELIMO) to cease hostilities and engage in diplomatic peace talks or face dire consequences. RENAMO leadership has already announced their support for the process and has endorsed the idea of peace talks in the hours after the announcement. However FRELIMO has yet to comment on the ultimatum. Cuba has strongly condemned the ultimatum and has vowed to support FRELIMO in an armed confrontation with the United States. While several other socialist and African nations have condemned the ultimatum, the majority of the international community has remained tepidly apathetic over the situation in Mozambique. Meanwhile, Pretoria has announced their strong support for RENAMO and their desire for stabilizing the region."
 MZB_CIA80.19.desc:0 "The Liberation Front of Mozambique (FRELIMO) announced their opposition to peace negotiations with Mozambican National Resistance (RENAMO) to bring about a peaceful end to the nation’s civil war. This comes in response to American President [USA.GetLeader]’s ultimatum to both parties in the conflict to agree to peace negotiations or face significant consequences. In a defiant speech, {MZB.GetLeader], the leader of FRELIMO gave a fiery speech declaring that FRELIMO will fight to the end against the American imperialists and their lapdogs in RENAMO. Concerns have been raised at the United Nations about a potential American invasion in light of the failed ultimatum. While President [USA.GetLeader] has yet to comment on the ongoing development, the Pentagon released a statement noting that all options were on the table."
 MZB_CIA80.21.desc:0 "A U.S.-brokered peace deal has officially ended Mozambique’s 15-year civil war, which claimed nearly a million lives and displaced millions. The agreement, signed by the Mozambican government and RENAMO rebels, marks a breakthrough in diplomatic efforts to bring peace to the nation.\n\nThe war, which began shortly after Mozambique’s independence from Portugal, left the country devastated. The conflict severely damaged the economy and caused widespread suffering, with the government and RENAMOengaged in a brutal struggle for control.\n\nThe peace deal, facilitated by U.S. diplomats and supported by the United Nations, includes provisions for the disarmament of RENAMO fighters, political representation, and future elections. An amnesty clause was also agreed upon to promote reconciliation.\n\nInternational leaders have praised the deal, with the U.S. Secretary of State calling it \"a victory for diplomacy.\" Mozambique now faces the challenge of rebuilding, but this agreement provides the hope of lasting peace and recovery."
 MZB_CIA80.23.desc:0 "Following the Liberation Front of Mozambique (FRELIMO) rejection of peace talks in regard to the ongoing civil war, the United States has initiated an invasion in Mozambique. Forces of the Mozambican National Resistance (RENAMO) have also launched a major renewed offensive against FRELIMO positions throughout the nation, now supported by American airpower. The invasion has been widely condemned by a swathe of nations, most vocally by the Soviet Union and East Germany. Cuba has vowed to provide military advisors and material to FRELIMO but has yet to decide whether to involve themselves further, especially with Cuba already participating in the conflicts in Angola and Ethiopia. Domestic critics have argued that this could turn into another Vietnam, however anti-communist organizations and supporters of RENAMO have advocated that the situation is completely different and the American military is more suited to such operations today."
 CIA_RUS.0.desc:0 "To the shock of most of the world and our own government, the \"Iron Curtain\" has indeed fallen and the communist governments behind said curtain are now rapidly imploding. This creates an intriguing opportunity for the Agency. The rapid disintegration of the Eastern Bloc and Soviet Union provides us the opportunity to actively meddle in the affairs of the newly independent states across Eastern Europe and Central Asia, however doing so would surely draw the ire of Russia and may irreparably damage the chances of building a constructive relationship with Moscow. Furthermore, other analysts have argued that actively intervening in the former Soviet bloc will only serve to destabilize the region and cause further conflict. On the other hand, actively establishing pro-American regimes across the former Eastern Bloc would surely strengthen our geopolitical position in the world and potentially solidify America as the world’s sole hyperpower. Other propositions include funding separatists inside Russia, especially those in Chechnya, Tatarstan and Kalmykia. How should we proceed?"
 CIA_RUS.1.desc:0 "After careful consideration and lengthy talks between the National Security Adviser, Central Intelligence Agency Director and President, [USA.GetLeader] has elected to refrain from major intelligence operations in the former Soviet sphere of influence. While several within the administration have criticized the decision as missing a critical opportunity, the overall sentiment is that trying to build a constructive relationship with Moscow should be a priority over expanding American covert operations and direct influence across the former Soviet Union. Additionally, concerns were raised over the proposal to actively promote secessionist and Islamist elements within Russia and other former Soviet republics as potentially causing knock on effects and enabling terrorism throughout the world along with needlessly causing further unrest in Eurasia. Time will tell if this was truly a wise decision leading to cordial ties with Moscow or a lost opportunity to permanently cripple an adversary."
 CIA_RUS.2.desc:0 "After careful consideration and lengthy talks between the National Security Adviser, Central Intelligence Agency Director and President, [USA.GetLeader] has elected to go all in on the proposal to interfere in the former Soviet sphere of influence. Already plans are being drawn up for countering potential Russian invasions of neighboring republics, especially Georgia along with analytical reports on the ongoing Karabakh War. A divisive issue among the intelligence apparatus is what stance our administration should take towards the various Islamist movements within the former Soviet Union. In particular on how we should deal with Chechnya and the ongoing civil war in Tajikistan. One faction wishes to seek collaboration with former Soviet states in dealing with radical Islamist terrorism while another wishes to utilize Islamist organizations in the region to destabilize anti-American regimes. Either option will certainly have long lasting consequences for not only the region but perhaps the world."
 CIA_RUS.3.desc:0 "As the Revolutions of 1989 and final dissolution of the Soviet Union come to a close many have titled America as the victor of the \"Cold War\". That said, many analysts  in the State Department and linked policy institutes have called for restraint during this time, American President [USA.GetLeader] has signaled his intention to rapidly escalate clandestine and overt activity beyond the former Iron Curtain. In a public speech today, President [USA.GetLeader] declared the beginning of a new era, that of a Pax Americana where America will be the sole global hyperpower and seek to spread American values throughout the former Soviet bloc. Concerns and criticisms have been raised by various domestic and international critics of the administration, however with the collapse of the Soviet Union the American public’s desire for interventionism has rapidly increased and the President’s approval ratings are currently at an all time high."
 CIA_WER.9.desc:0 "Since the end of World War II and the post-war security order establishment via the North Atlantic Treaty Organization (NATO) Western Europe has by and large avoided electing any communist governments either due to their own efforts or with some help from our own intelligence agencies. However, as the conflict with communism escalates once more, we must ensure we continue to support parties that support NATO throughout the region as well as keep tabs on upcoming movements and parties that could endanger allied governments. Great success has been shown over the prior decades in solidifying conservative rule in Japan while sidelining leftist forces, similar strategies should be considered to be employed throughout Western Europe, especially the ideas of exporting American political strategists, bankrolling conservative parties and sowing divisions among leftist parties that threaten NATO hegemony in the region."
 CIA_WER.1.desc:0 "The United Kingdom has long been one of our closest allies and is a key member of the North Atlantic Treaty Organization (NATO). Unfortunately, the left flank of Labour has long had concerning tendencies going back to the 1950s on the ongoing global conflict. In more recent years however this has elevated to even more extreme levels with the \"Militant tendency\" faction coming to prominence in Liverpool and managing to elect several members to parliament while a part of the Labour Party. Militant tendency is an entryist political faction that is described ideologically as Marxist-Lenninist and Trotskyite. Such a group managing to exert more influence on one of the two major parties in British politics would surely be a disaster for the Anglo-American relationship and NATO as a whole. While the current influence of the faction is limited and unlikely to expand, keeping tabs on their leaders such as Ted Grant will allow us to intervene if the need arises."
 CIA_SPR.9.desc:0 "Since the death of long time Spanish fascist dictator, Francisco Franco, Spain has been on a path to democracy albeit a path beleaguered by unrest and violence from both the far-left and far-right elements. The unrest and turbulence in Spain along with free democratic elections run the risks of an anti-American government that could give the Soviet Union a foothold in Iberia and disrupt our intelligence operations in Spain. Our agents in the Spanish military have reported that Lieutenant-Colonel Antonio Tejero is planning to attempt a coup against the government to restore Francoist rule. This provides us an opportunity to bring Spain back into a closer relationship with the United States but raises the risk of straining ties with Madrid if it fails. A proposal has been drawn up to back Tejero with intelligence and utilization of Gladio elements within Spain to bolster their chance of success, how should we proceed?"
 CIA_SPR.1.desc:0 "After careful consideration by the National Security Council a decision has been made by President [USA.GetLeader] to greenlight support for the Spanish coup plotters. To this end, agents have been deployed to ensure the Spanish king’s compliance in non-interfering with the plans via blackmail over his numerous personal failings and financial dealings. Besides this, our Gladio operatives and sleeper teams are being activated to coerce other elements of the Spanish military to join the putsch plan to increase the odds of success. These steps along with coercing other politicians and military leaders to fall in line are believed to have nearly ensured the coup’s success in the coming days, while of course there remains a chance of failure our intelligence agencies believe that Spain will return to Francoist rule while we also minimize the public’s perception of our backing of the plot."
 CIA_BLOC80.o:0 "As we enter yet another decade of conflict with the Soviet Union, reviewing our options for clandestine operations beyond the Iron Curtain is imperative. Given the effective security states established in several Eastern Bloc states, especially East Germany, direct operations will be unlikely to succeed, however other, more subtle options persist. The main option here would be to expand radio broadcasts targeting the Eastern Bloc, in particular East Germany to undermine support for the government. However, the most intriguing potential target is Poland. The labor unrest plaguing Poland in recent years has made the communist nation a prime target for encouraging further support and potentially providing support for the Solidarity labor movement. This all said, we must also ensure that our operations do not cross the line and mitigate the risk of escalation with the Soviet Union to prevent another global war."
 CIA_BLOC80.1:0 "The unrest in Poland continues to spread and escalate, to increase the pressure on Poland and the Warsaw Pact at-large the Central Intelligence Agency has greenlit a plan to begin bankrolling Solidarity and supporting their movement with other financial and minor propaganda aid. In addition to providing the movement with financial aid and further ingratiating the movement towards the West, the Agency has also reached out to the Vatican about providing more support to Solidarity to rally the largely Catholic population further towards Solidarity. This would also serve to heighten tensions between the Catholic Church and the Polish government, further destabilizing the government and eroding their public support. Ultimately, regardless of the fate of Solidarity, the situation is favorable for our government. In one case, the Soviet’s and others will need to intervene to salvage the communist government in Poland or allow the fall of the Polish government."
 CIA_BLOC80.2:0 "As unrest continues to spread in Poland and the Solidarity movement grows in strength, it has become time to consider further actions to support the movement. Already our administration has begun providing covert funding for Solidarity however there is more our operatives can do besides simple financing. Under the new enacted proposal, our operatives will now begin providing technical support and aid, such as printing presses, electronic equipment and other means for producing propaganda for their movement. However, we have ensured that no lethal aid has been provided to avoid further antagonizing the Soviet Union and providing further pretext to crack down on the Polish populace. However, some in the National Security Council believe that this has been a missed opportunity for further destabilizing Poland and consequently the Eastern Bloc as a whole by not instigating a violent uprising that would likely initiate a Soviet invasion of Poland."
 CIA_BLOC80.3:0 "With the government crackdown on dissidents, Solidarity and even former government leaders, it is clearly a ripe time to begin covertly launching a regime change project in Poland. While we have begun providing conventional technical support and aid to Solidarity, our operatives have recently been greenlit to begin shipping lethal aid, mainly small arms and other conventional weaponry to militant supporters of Solidarity with the goal of further inflaming the situation in Poland. Doing so drastically raises the chances of Soviet intervention in Poland which would be a major propaganda coup for the broad anti-communist struggle. However, dissenting voices in the National Security Council and intelligence agencies have argued that this policy change is overly divisive and raises the chances of Soviet discovery of the plot. Additionally, dissenters have argued that this will only serve to destabilize Europe and could lead to more volatile situations in Europe raising the risks of another global war."
 CIA_BLOC80.4:0 "As the Soviet system continues to show major cracks, several station chiefs have proposed to begin engaging with potential leaders of a post-Soviet Eastern Europe, especially in Poland. While beginning engagement with potential non-communist leaders in Eastern Europe, our agencies should remember to not overly antagonize Soviet and other communist authorities to avoid the risk of further escalation and avoid international incidents. That said, the prime candidate to begin engagement with is Lech Walesa. Walesa, the charismatic leader of the independent labor and anti-authoritarian social movement will likely emerge as the prime non-communist leader of a post-communist Poland, engaging with leaders such as Walesa will enable our government to further design potential foreign policy plans and strategies in the case of a Soviet collapse along with potentially pushing in the future for an expansion of the North Atlantic Treaty Organization."
 CIA_CT.0,desc:0 "As the Soviet-Afghan War raged and the Soviet Union began to rapidly destabilize, Islamist movements have rapidly grown in the Islamic regions of the former Soviet Union. Most notably in Tajikistan, Chechnya and Dagestan. While not the sole cause, our backing of Islamist fighters and organizations in Afghanistan and our support for similar causes in Pakistan has notably been a driving factor in this growing issue of radicalization. Assuming that the intelligence apparatus will not choose to ignore the issue, we have two real choices. Our first option is to covertly support the Islamist forces destabilizing the region and seek to establish Islamist governments in Central Asia that may be more willing to accept American influence. However, this move would surely all but destroy any chances of establishing and maintaining cordial ties with Moscow. Our other option would be to identify the growing threat as not only an issue for the region but a national security threat for the West as well and seek to collaborate with Russia and Tajikistan to counter the growing Islamist terrorist threat. How should we proceed?"
 CIA_CT.1,desc:0 "Following the National Security Council’s (NSC) decision to take a proactive role countering the growing Islamist threat in Central Asia, a new proposal signed off by the NSC has authorized sharing intelligence on the breakaway province of Chechnya to the Russian government to aid in its fight against the Islamist rebels. This move should aid in our efforts of building a new relationship with Moscow and additionally further show our commitment to combating the threat of radical Islamist terrorism. Unfortunately this will need to be kept confidential for the indefinite future given domestic political concerns. Russia’s handling of the conflict has sparked international criticism and being seen as facilitating certain actions taken by the Russian military would damage our position at home and abroad."
 CIA_CT.2,desc:0 "A key conflict in the region involving radical Islamist movements is that of the Tajikistan Civil War. After discussions within the National Security Council, our administration has decided to offer support to the Tajikistan government. While the Tajik government is backed by Russia, the opposition winning would be too destabilizing to the region and may create a new hotspot for further radicalization and support for terrorist organizations. Analysts have also noted that this could be utilized as a moment to attempt to improve relations with Moscow, especially as it is in both of our interests to prevent the further spread of Islamist terrorism throughout Central and Southern Asia. Our ambassador in Dushanbe will be instructed in the coming days to provide an outline of what types of support we will be offering to their government and the Russian ambassador will be informed of what moves we plan to not antagonize Russia over interfering in their region."
 CIA_CT.3,desc:0 "After a contentious debate within the National Security Council (NSC) the President has approved a new course of action regarding the instability in Central Asia. The new strategy calls for providing covert support to Islamist organizations when there is a strategic benefit to boosting them. This new strategy will be tested in Tajikistan where we have decided to begin arming the rebel movement with the aid of Saudi Arabia against the pro-Russian government. The overthrow of said government would give us an opportunity to establish a larger presence in Central Asia and would weaken Russia’s grasp on the former Soviet republics in the region. That said, dissenters within the administration noted their opposition to the move, arguing that it violated moral principles and would lead to the arming of terrorists who may use those weapons against our own allies and interests."
 CIA_CT.4,desc:0 "As we continue with our efforts to bolster Islamist causes in the region to further destabilize Russia and their proxy states, the situation in Chechnya may provide the key to crippling Russian military power for the medium-term future. Dissenting voices in the National Security Council (NSC) have pointed out that by supporting the Chechen we are also effectively arming the various volunteers and jihadists who are traveling to Chechnya to fight against Russia and will likely pose a security threat after the war. Others have pointed out that our similar operation in Afghanistan a decade prior, while successful, had major unintended consequences and contributed greatly to the ongoing instability in Central Asia. Starting in the coming weeks, our operatives in the region will begin funneling weapon shipments into Chechnya, using similar tactics to Operation Cyclone. Hopefully this move will further degrade Russia’s capability to wage war."
 CIA_CT.5,desc:0 "In some truly terrible news, recent intelligence shared by Russia has shown that the United States is siding with the Islmaist rebel forces in our ongoing civil war and has now begun to openly provide them with weaponry. This is not only a major blow to our forces and will assuredly increase the bloody toll of the ongoing war and not only that risks reversing our progress and endangering even the survival of our government. Our only true remaining route is to further align with Russia and request more aid. Unfortunately given the sad state affairs of Russia since the fall of the Soviet Union this may not amount to much benefit to our cause. Perhaps the long-standing allegations of the Central Intelligence Agency bankrolling and sponsoring Islmaist organizations in our country and throughout Central Asia were right after all?"
 CIA_CT.6,desc:0 "Great news has arrived, the United States has informed us that we will now be provided with financial and military hardware support. While Washington will not overtly support our movement or recognize us formally at this time, they have agreed to block any move to sanction or censure us in the United Nations and are working in conjunction with Saudi Arabia and others to provide us with additional funding, arms and volunteers. The new aid packages that should be arriving through covert channels through Afghanistan may provide our forces with a key edge to gain an upper hand in the ongoing conflict. That said, what will this cost us in the long run if we manage to overthrow the current government? Surely the Americans will desire to use our nation as a stepping stone into the rest of Central Asia to further expand their influence, but such is the price to pay to win a war."
 CIA_CT.7,desc:0 "As Russian influence continues to implode throughout the former Soviet bloc, a new opportunity has arisen to further destabilize Russia and cripple their long term efforts to restore influence in the region. The proposal brought forth to the National Security Council is to begin funding and in some cases providing arms to secessionist movements inside Russia proper. While Chechnya is already in revolt, unrest is present in various ethnic areas of Russia, most notably in Dagestan, Kalmykia and Tatarstan. All three are majority non-Russian and have active movements either for autonomy or separation. The new approved plan would seek to make contacts with these movements and local leaders who may be so inclined and then proceed to begin providing arms and funding to those willing to begin militantly opposing Russia. The next stage would be to coerce local military and paramilitary forces to defect and ideally kick off a chain of events similar to what has occurred in Chechnya."
 CIA_CT.8,desc:0 "In recent weeks a notable uptick of targeted assassinations and other terrorist attacks have occurred in Dagestan, Tatarstan and Kalmykia. The unrest has sparked alarm among the security services, especially in light of the ongoing war with Chechnya. Radical Islamist movements have also been noted to be rapidly increasing in support in our Islamic regions, of particular concern is an uptick in Jihadist terrorist activity in Dagestan. Earlier in the week, several police stations and government installations were bombed or stormed by local affiliates of Al-Qaeda. Targeted attacks on pro-government politicians and Russian civilians have also escalated in all three regions. The Ministry of Security is suggesting increasing surveillance in all three regions and seeking to identify potential leaders of these movements along with attempting to identify if this is purely a domestic issue or if there are any foreign backers."
 CIA_CT.9,desc:0 "The recent rise of Islamic terrorism throughout Central Asia and the former Soviet Republics has clearly demonstrated that traditional military and policing tactics are ineffective against ideological terrorists. To combat this, a proposal has reached the National Security Council (NSC) to invest in the formation of a new task force which would oversee the creation of new counterterrorism squads for domestic and international deployment respectively subject to either the Federal Bureau of Investigation (FBI) or Central Intelligence Agency (CIA). While the security services continue to debate who will be overseeing and managing the taskforce, we should continue to monitor upcoming terrorist threats, especially with the growing instability in the Middle East and Central Asia. The aftermath of the Gulf War and our support for the Mujahideen in Afghanistan seems to have greatly emboldened extremist Islamist terrorists and intelligence chatter notes we are a potential target alongside Russia, Israel and various European nations."
 CIA_IRQ80.0.desc:0 "The growing instability of Iraqi dictator Saddam Hussein is becoming an increasingly alarming issue for our foreign policy in the region. Between the fallout from the Iran-Iraq War and revanchist rhetoric from Baghdad, especially in regard to Kuwait the National Security Council, with the approval of the president has signed on to a proposal to begin the planning of a coup against Saddam and the Baathist government. This will surely be a difficult task and require intensive planning, vetting and recruitment of operatives within the Iraqi government, military and diaspora. Even as the plan is approved, the intelligence community has yet to decide on the potential leaders of a coup, let alone who would govern a post-Baathist Iraqi government. Attention has been paid however to looking for potential leaders from the pool of effective officers during the Iran-Iraq War, especially those since sidelined given suspicions over being potential rivals for Saddam and other loyal Baathist officials."
 CIA_IRQ80.1.desc:0 "The Baathist government of Iraq, under Saddam Hussein has proven to be one of the most chaotic and destabilizing leaders of a regional power in the Middle East in recent memory. Not only have they instigated major wars but have also launched brutal campaigns against their own population along ethnic and religious lines. With this in mind, the President has authorized the beginning of a plan to launch a coup against Hussein and seek a more pro-western government to restore stability to the region. The vast oil reserves of Iraq make such a chaotic, unpredictable leader remaining in power untenable to our strategic goals throughout the region. Additionally, measures to prevent another oil crisis are a major priority of our administration and securing oil access from Iraq would go a long way in making sure we have a constant, stable supply of oil."
 CIA_IRQ80.2.desc:0 "One of our current issues in formulating a coup is who to make the leader of the coup as well as to lead the post-coup government of Iraq. Former Republican Guard General Mohammed Abdullah al-Shahwani seems to be a prime candidate for this position. General al-Shahwani is a noted war hero of the recent Iran-Iraq War and was purged for being seen as a threat to Saddam Hussein. During the Iran-Iraq war, he notably spearheaded an air assault to retake Kardamand mountain in Iraqi Kurdistan from several thousand entrenched Iranians. Additionally, he was in charge of the Iraqi Special Forces School and formerly trained in the U.S. Army Ranger School. With his amount of connections, experience, reputation and willingness to work with our intelligence services makes him the prime potential pick. Already, General al-Shahwani had reached out to our agents to provide additional information on the Iraqi government and is expected to readily accept his role in the coup plan."
 CIA_IRQ80.3.desc:0 "Now that we have a credible leader for our coup plan, we need to gain more supporters within the current Iraqi army. To advance this, our operatives in Iraq have been authorized  to offer bribes, concessions and other incentives to targeted officers to be open to taking action against the Baathist government in the future. Our analysts believe that aiming for further infiltration of the officer corps will be the most successful current route to overthrowing the Baathist government. Still, we must aim to be discreet to avoid tipping off the government or having rumors percolate within the Iraqi public. The years-long repression of other political parties and movements within Iraq has left the political opposition of note to largely not share our interests. After all, we would not want to replace a Baathist Iraq for another Shia theocracy that would seek to further export the revolution to their neighbors."
 CIA_IRQ80.4.desc:0 "Several Iraqi army officers have accepted our bribes and have pledged their support to our coup project to overthrow Saddam Hussein. This is a notable step in our plans to topple the Baathist government. While many in the intelligence community had protested our operations to oust the Iraqi government as being unrealistic and a waste of money, this major step clearly demonstrates that there is a route to potentially successfully placing a pro-western leader at the helm of the Iraqi state. Still, there is much work to be done and we must now seek to further expand our support network for the plot within Iraq, especially within the Iraqi intelligence community, Iraqi Revolutionary Guard and potentially anti-Baathist political parties within Iraq and within the diaspora. The proposal to contact the Republican Guard and political opposition has created an internal firestorm within the intelligence agencies over concerns of compromising the mission. We will need to balance these concerns and determine our course of action in the coming weeks."
 CIA_IRQ80.5.desc:0 "Unfortunately, our bribery attempt has largely failed. Most officers denied the bribes due to surveillance by the Iraqi security services and one attempt even ended up being a local string operation for corruption, leading to our agent making a hasty retreat. Thankfully, none of our agents were captured during this failed operation. That said, without the support of more of the Iraqi army it is difficult to see a coup plot succeeding at this time.\n\nWe will now need to also deliberate if we should even continue to move forward with this plot. While we have no confirmation that the Iraqi government is aware of the plan, the chances are now non-negligible and further investment in this endeavor may simply be a waste of money better spent in supporting other operations. This is not a universally held position however, and a large bloc within the intelligence community are pressing to move forward with this plan, noting the general instability of the Baathist government and the need to secure Iraq’s oil."
 CIA_IRQ80.6.desc:0 "Furthering our attempts at further bribing more Iraqi officers to join our plot, the next step was to seek to compromise the Iraqi intelligence services. Now that they have been significantly compromised, our chances of success will be greatly enhanced. Discontent within the Iraqi intelligence services has been growing for years after various internal purges and failed foreign adventures. Thankfully, this climate laid the groundwork for our agents successfully recruiting members within the Iraqi intelligence service to support our upcoming coup to oust the Baathist government. While this alone will not secure the success of the operation, it does represent a significant step forward for our operation and may bolster the chances of the operational security of the planned coup being maintained. Concerns have been raised however that risked the potential recruitment of double agents who may be actually loyal to the Baathist government."
 CIA_IRQ80.7.desc:0 "As we have already established some connections within the normal military, we have now moved onto cultivating contacts within the Iraqi Republican Guard. This so far has had mixed success. Overall, our agents have managed to cultivate contacts within the Iraqi Republican Guard and surprisingly have recruited several officers within the Republican Guard to participate in the plot following growing discontent from the Baathist governments numerous failures in recent years. Our figurehead leader of the upcoming coup, former general and leader of a Republican Guard helicopter unit and noted war hero from the prior war with Iran proved to be a fruitious choice given his popularity among the Republican Guard. This all said, the majority of the Republican Guard is still loyal to the Baathist government and will likely seek to retake control of the nation in the immediate aftermath of the coup, if a significant number defects, the potential for a successful counter-coup is expected to drastically decrease."
 CIA_IRQ80.8.desc:0 "While the plan was initially designed to work solely through the Iraqi military and related services, the National Security Council has decided to try to incorporate Iraqi opposition forces into this plan. To this effect, the Central Intelligence Agency has directed our local agents to have their collaborators within Iraq reach out to anti-government organizations to organize efforts in conjunction with the coup plan. If all goes to plan, public demonstrations will coincide with the onset of the coup, further debilitating a Baathist response to the coup, giving our co-conspirators more time to seize control of the state apparatus and eliminate key officials. Concerns have been raised however over potential different long-term strategic goals of the Iraqi opposition and our own goals for the region along with the potential for this plan to lead to mass civilian casualties if the coup does not go to plan."
 CIA_IRQ80.9.desc:0 "While the idea of bringing Iraqi opposition forces into the plan could have been beneficial, the decision was made to stick with contacting military officers and potentially the Iraqi Revolutionary Guard to minimize the chance of the plan leaking back to Iraqi leadership. While several members of the intelligence community have protested the move, the general consensus was that this proposed move would have not only risked potentially exposing the plan to the Baathist government but posed to great of a risk of the coup plot derailing into a massacre of civilians throughout Iraq or further deteriorating into a civil war where more radical factions may seize power to the detriment of our regional strategic goals. Concerns were further raised that a civil war may enable Iran to seek to install a puppet government in Baghdad, an outcome that would be all but intolerable for our Middle Eastern allies and our own influence in the region."
 CIA_IRQ80.10.desc:0 "Unfortunately our plot has been revealed and the Iraqi government has quickly taken measures to quash the potential coup. Renewed military and intelligence purges have managed to catch many of our collaborators, fortunately many others who were likely loyal to the regime were also caught up in the purges, overall weakening the efficacy of the Iraqi military and intelligence services. This does mean however that our already poor ties with the Iraqi government will deteriorate even further and that our chances of overthrowing the Baathist government is all but non-existent in the immediate future. Concerns have also emerged over the potential for Iraq to attempt to initiate another oil crisis, however the most up to date threat and risk analysis reports indicate this is incredibly unlikely given our force projection in the region and the general security of other oil exporting nations, compounding with the fact that Iraq is depending on oil exports to fund the government."
 CIA_IRQ80.11.desc:0 "After several weeks in preparation, we are nearing the launch of the operation. So far, our sources have insisted that operational security has been maintained and that the Baathist security services are still unaware of the ongoing plot. With operational security maintained and our list of co-conspirators finalized, all that is left is to finalize the remaining plot details and schedule the date for launching the coup. Several concerns have still been raised however we have come too far to back out now and must prepare contingencies both for success and failure of the coming operation. Notably, our analysts have issued a new threat analysis arguing that if the mission fails and the Iraqi government links us to the plot that the Iraqi government may seek to interfere with the oil supply coming from not just Iraq but also the rest of the Persian Gulf, potentially threatening another oil crisis."
 CIA_IRQ80.12.desc:0 "The time has come to launch the coup. All preparations have been finalized and should commence in the coming days once the ideal time for launching the initial assassination against Saddam Hussein is identified. As noted, the operation will commence with the decapitation of the Iraqi regime with the assassination of Saddam Hussein. Following the confirmation of his death, officers part of the coup will rally their soldiers to seize key government facilities and detain the leadership of the Arab Socialist Ba'ath Party. While everything is now scheduled and prepared, none of this guarantees success, there are still several major risks and uncertainties with the plan, namely how effective the initial step will be when launching the assassination of Saddam and then whether or not the officers loyal to the coup can effectively rally their subordinates. Still the time for planning is over, now we await."
 CIA_IRQ80.13.desc:0 "Unfortunately, while the operation started promising, the initial assassins failed to kill Saddam, without the leadership of the regime being decapitated, loyalist officers were able to rally the military to arrest the plotters who are currently being sentenced to be executed for their crimes against the state. The mission was always expected to be a long shot. Iraqi state media put out a statement alleging our participation in the coup attempt. Thankfully, none of our own agents were captured by the Iraqi government allowing for us to quickly deny these allegations. While disappointing, the move has still further destabilized Iraq and ultimately cost us little in terms of assets. Still, this does further cast doubts and uncertainty on the long term outlook of the oil market and could lead to economic issues down the line if events conspire to create a new oil crisis."
 CIA_IRQ80.14.desc:0 "The operation swiftly managed to locate Saddam and assassinate the infamous dictator of Iraq. Thankfully, events did not spiral out of control at this point. Military officers part of the operation were able to rally their soldiers to partake and seize control of key government centers and arrest regime loyalists. Former general and war hero, Mohammed Abdullah al-Shahwani has emerged from exile and is currently expected to address the nation on the ongoing events later in the evening. Our involvement, while heavily speculated in some corners has largely been kept out of the spotlight, if the new government is able to restore stability to Iraq, our position in the region will be stabilized and the vast reserves of Iraqi oil will be available for our markets, further ensuring access to oil to avoid a repeat of the prior oil crises of the 1970s."
 CIA_IRQ80.15.desc:0 "The anti-Baathist coup led by General Mohammed Abdullah al-Shahwani and other Iraqi army elements came as a major shock to the world. Given the resiliency of the Baathist regime over the last decade throughout various crises as well as the disastrous war with Iran many had expected the regime to not fall without foreign intervention or civil war. However the swift capture of Baghdad and arrest as well as execution of various ranking Baathist officials was quick to stifle dissent and potential armed conflict with Baathist loyalists and militias. While low level conflict has raged in some Sunni majority areas, the nation has largely been pacified. Today American President [USA.GetLeader] announced that their administration fully recognizes and supports the actions and legitimacy of the new Iraqi government and awaits their cooperation on a host of geopolitical, economic and security issues in the coming months."
 IRQ_CIA.100.desc:0 "Following the conclusion of the Gulf War, a mass uprising broke out in southern Iraq against the regime of Saddam Hussein. The uprising, spurred by the crushing defeat of Iraq in the war and ongoing political, religious and ethnic tensions throughout the nation quickly spiraled and have now expanded to Iraqi Kurdistan as well. While Saddam is clearly a hostile actor in regard to our foreign policy, it is unclear if the rebels are more palatable to our interests. The rebel cause varies ideologically from defectors from the Saddam regime, Iraqi communists, Iranian Shia sympathizers, Kurdish Peshmerga and Shia rebels, disaffected over the regime’s treatment of them. The rebellion has the potential of overthrowing the regime, however this will likely not occur without foreign involvement. A plan of action has been sent to the president over how to move forward with the situation. If we choose to intervene, we can not guarantee the new government will be friendly with Washington. It is completely possible that overthrowing Saddam could lead to Iraq becoming little more than an Iranian puppet. How should we proceed?"
 IRQ_CIA.101.desc:0 "As the Iraqi uprising continues to play out, the administration has decided to implement a no fly zone within all of Iraq. The goal of this measure is to deny the Iraqi government the ability to crush the opposition forces via their air power and mitigate the potential for civilian reprisals. We have also approved rules of engagement to include the shooting down of Iraqi aircraft and the bombing of anti-aircraft installations to secure safe passage over the nation. The Iraqi government has condemned the move as an attempt at regime change which while we deny publicly is in effect one of the goals of this operation. Removing [IRQ.GetLeader] from power would be a move towards a more stable and secure Middle East and would remove a brutal dictator from power."
 IRQ_CIA.102.desc:0 "Terrible news, the United States has announced the establishment of a \"No Fly Zone\" over the southern regions currently rebelling against our government. With this established, our capability of launching air strikes and employing chemical warfare via air power will be effectively blocked. Already reports have come in of several incidents in the southern reaches of our nation. Without air power, our forces holding out in the south will surely be on the back foot and may need to reconsolidate into new defensive lines. This event also represents a great morale boost to the opposition and may further spur more defections from the armed forces to the rebels. Still the situation remains potentially recoverable as long as our foreign enemies are not directly bombing our soldiers or launching a direct intervention. Our forces broadly outnumber the rebels, however the dual threats from the southern rebels and Kurdish Peshmerga in the north constrict our movement and capability to rapidly redeploy to either region to achieve a decisive victory."
 IRQ_CIA.103.desc:0 "Great news, the United States has announced the establishment of a \"No Fly Zone\" over the southern regions where our forces are actively fighting against the government. With this no-fly zone in place, the government’s ability to conduct air strikes and use chemical warfare from the skies will be effectively neutralized. Already, reports are coming in of several successful operations in the southern territories, marking a significant victory for us. Without air power, the government’s forces stationed in the south will be at a severe disadvantage, likely forced into retreat as their positions become unsustainable. This development is a huge morale boost for our cause, and we can expect further defections from their ranks as their soldiers lose confidence. The situation now leans heavily in our favor, especially if foreign powers refrain from direct intervention or bombing our forces. Though the government’s forces still outnumber ours, the combined pressure from us in the south and the Kurdish Peshmerga in the north is stretching their military thin, limiting their ability to rapidly shift resources and gain a decisive advantage."
 IRQ_CIA.104.desc:0 "As the uprising in Iraq continues to turn into a bloody slog between the Baathist government and a wide spectrum of anti-government opposition, calls have been made for the international community to side against the government of [IRQ.GetLeader]. American President [USA.GetLeader] announced today the beginning of an American military operation to establish a no fly zone throughout Iraq to deprive the Iraqi military of airpower during the ongoing conflict. The move has been widely praised by a wide spectrum of leaders, especially by Western European nations, Saudi Arabia, Jordan and surprisingly Iran who is also backing the uprising. However, several other states and organizations have condemned the renewed campaign, including Yemen, Yugoslavia and the Palestinian Liberation Organization. However, this alone is unlikely to firmly tilt the conflict in favor of the rebels, the question of further intervention by the United States, Iran and other regional powers is still one of the utmost importance."
 IRQ_CIA.105.desc:0 "Despite repeated calls and encouragement for an uprising in Iraq against the leadership of [IRQ.GetLeader], America has shown little interest in entangling itself in the ongoing uprising. While the President and State Department have declined to issue comments or interviews over the ongoing crisis in Iraq, leaked memos state that the administration holds strong concerns over the composition of the rebel forces. In particular, the large presence of the Dawa Party and other Shia radicals aligned and backed by Iran are seen as a threat to regional stability and a fifth column for an Iranian takeover of Iraq. Speculation has also been driven by concerns over the potential for a further destabilized Iraq to cause fluctuations in oil prices which would be detrimental to the global economy."
 IRQ_CIA.106.desc:0 "The Americans have only escalated their attempts to bring an end to our glorious rule. Loyalist Revolutionary Guard officers have informed us that shipments of material aid have begun flowing into rebel held territory and is having a considerable effect on our ability to conduct offensive operations to retake lost territory. Heavier weaponry, especially those capable of crippling our armored forces will be a major issue for our forces, already reports have come in of further defections from the armed forces to the rebels throughout the southern areas. The situation continues to destabilize and more drastic measures may need to be considered to salvage the regime. The walls may be closing in, but we must continue to fight at all costs to avoid the nation falling into the hands of communists, Shia’s, Kurds and traitors."
 IRQ_CIA.107.desc:0 "Our contacts with the southern rebels have informed us that the United States has begun arming their movement as well. This will surely benefit our own cause given the Iraqi government will likely need to redirect forces away from our area to combat the more pressing threat in the south. Our contacts have also assured us that our forces will also be receiving more supplies and arms in the coming days along with the southern rebels and are being encouraged to take more bold action against the Baathist forces to prevent any organized rapid redeployment away to southern Iraq to further cripple the Iraqi military. The walls seem to be closing on the Baathist government, still the regime has managed to survive other crises and it is still unclear whether the Baghdad government can regain the initiative or is doomed to the dustbin of history."
 IRQ_CIA.108.desc:0 "The United States Air Force launched airstrikes on Iraqi Republican Guard positions throughout southern Iraq earlier today, per a Pentagon spokesperson. This is a major escalation, prior to this, the United States had announced the enforcement of a no fly zone over Iraq to deprive the Iraqi military of their airpower against civilian reprisals and attacks on rebel forces. Already reports have come in of significant losses by the Iraqi army and further defections from the government to the rebel movement. As the chances of the Baathist government continue to decline, questions have now been raised over what a post-Baathist Iraq would look like. The coalition against Saddam varies from government defectors, pro-Syrian Baathists, communists and pro-Iranian Shia parties such as the Dawa Party. Will this dispartirate coalition be able to come together to form a new Iraq or will this be the start of a new age of instability and internal conflict?"
 IRQ_CIA.109.desc:0 "The news continues to become bleaker by the day, new reports have come in of the American airforce has begun to bomb Revolutionary Guard positions throughout the south. This is likely to cripple the morale of our forces, outside of the Revolutionary Guard, defections had become a common occurrence to rebel forces throughout the nation. With an organized bombing campaign suppressing our forces both against the Kurds and against the southern rebels, the security service expects widespread further defections and the loss of swathes of land, both in Iraqi Kurdistan and in southern Iraq. Additionally, our anti-air installations, already damaged from the past conflicts, were utterly insufficient to stop the Americans from bombing our forces, already our air defenses have been utterly crippled beyond repair and our air bases have also come under heavy aerial bombardment. It may soon be time to consider exit plans for the personal safety of leading government officials."
 IRQ_CIA.110.desc:0 "While we have had our differences with Iran over the last decade, the ongoing situation in Iraq presents an opportunity to rebuild relations with the Iranian government. Toppling the Iraqi government is in the interest of both Tehran and Washington, especially after the lengthy Iran-Iraq War. Still, this would be a controversial move, especially to the general population of both America and Iran. Our diplomats in the State Department have begun drafting the proposal which includes provisions to begin a gradual lifting of sanctions on Iran along with guarantees for the legalization of pro-Iranian parties in a post-Baathist Iraq. If Iran accepts, this would be effectively a deathknell to the Baathist regime and remove one of the most dangerous dictators in the world from power while also aiding in restoring American-Iranian ties. However, it is unclear if Tehran will have any desire to cooperate with us on this matter, or if they may seek to intervene alone to avenge the prior Iran-Iraq War."
 IRQ_CIA.111.desc:0 "An interesting proposal has come in from Washington. The Americans are offering to provide us support and rebuild diplomatic relations in exchange for our forces intervening in the unrest in Iraq and overthrowing the Iraqi government. The proposal also entails several concessions for both sides, the United States has signaled their intention to begin lifting sanctions and would support the legalization of pro-Iranian parties in a post-Baathist Iraq. However, we would have to also back a democratic constitution in Iraq, along with promising to honor Kurdish autonomy within Iraq up to including a potential referendum for Kurdish independence. Accepting this offer would surely thaw tensions with the west and likely end in the fall of the Baathist government which instigated the past war, still this may be a missed opportunity if we wish to directly draw Iraq into our sphere of influence. We could instead stay out of the conflict entirely, or begin arming and supporting the Iraqi rebels, or even launch our own intervention to export the revolution. How should we proceed?"
 IRQ_CIA.112.desc:0 "The Iranian government has responded positively to our proposal and has agreed to cooperate in regard to Iraq. Several stipulations have been agreed to in exchange for mutual support, these include the partial lifting of American sanctions on Iran, a guarantee of Kurdish autonomy in a post-Baathist Iraq and a general democratic constitution for the new state. In exchange, we will ensure that pro-Iranian parties will not be banned or suppressed by our operatives and allies in the region. In the coming days, Iranian Revolutionary Guard agents will initiate deeper coordination with the rebels and begin providing arms, both from Iranian and American stockpiles. After this and contacts have been more deeply established, our airforce will launch a campaign against Iraqi forces."
 IRQ_CIA.113.desc:0 "Unfortunately, the Iranian government has declined our offer of cooperation in overthrowing the Iraqi government. While no reason was specified, our analysts believe that either Iran is simply too war weary after the recent conclusion of the Iran-Iraq War and does not wish to be entangled in another war with their neighbor so soon. Another suggestion, perhaps more alarming is that Iran plans to go in alone and overthrow the Iraqi government and export the Iranian Revolution to Iraq. Given the large number of Shias in the rebels this may have a high chance of success. An theocratic Iraq in the Iranian orbit would be quite the danger to regional stability and would surely endanger global oil supplies, this would also enable Iran greater access to potential allies and friendly Shia populations throughout the Levant and Persian Gulf. The Central Intelligence Agency will need to keep a close eye on developments in the region in the days and weeks to come."
 IRQ_CIA.114.desc:0 "In a major escalation, Iranian troops have crossed the Iraqi border once more, this comes as the uprising in southern Iraq continues to escalate. The uprising, predominantly by the Shia population and disaffected soldiers has quickly managed to seize various minor towns in southern Iraq and is currently contesting the city of Basra. Two of the major factions in the uprising in the south are the Islamic Supreme Council of Iraq and the Islamic Dawa Party, both of which are allegedly supported by Iran and have praised the Iranian Revolution. Speculation has been rampant on what a post-Saddam Iraq would look like, the Iranian intervention may point towards the potential of an Islamic Republic in Iraq similar to that of Iran. That said, the uprising in the south is also backed by the Iraqi Communist Party, military deserters and Pro-Syrian Baathists who are opposed to the Baathism of Saddam. Time will tell if this intervention can bring an end to the violence or will simply be a return to the Iran-Iraq War."
 CIA_KUR80.0.desc:0 "The last few decades has demonstrated that the vast majority of our Arab allies are fair weather friends in the best of times. The instability of the various Arab regimes has been a major issue for several administration’s at this point. The oppressed Kurdish population in northern Iraq has long been more inclined to accept American aligned support. With our ongoing issues with both the Syrian and Iraqi government, the National Security Council has authorized a course of action to seek the establishment of an independent Kurdish state in northern Iraq. This course will surely alienate Turkey and we will need to balance this operation along with their concerns and the potential for a renewed Kurdish independence movement spiraling into a larger regional ethnic conflict. Ultimately, the administration has decided that this course of action is the best option for establishing a new American aligned state in the region while also destabilizing and weakening regional hostile elements in both Iraq and Syria."
 CIA_KUR80.1.desc:0 "Prior to expanding our influence and escalating the conflict, the administration has decided on a course of action to publicize the struggle of the Iraqi minority, non-Arab populations against the oppressive Baathist government. Not only has the Iraqi government committed genocidal actions against the Kurdish population in Iraq, the efforts to drain the Mesopotamian Marshes have effectively led to the ethnic cleansing of the native Marsh Arab population. If we wish to build support for further action against the Iraqi regime, the State Department will publish a scathing attack on the Iraqi government's recent actions and history of persecuting their ethnic minorities. Our contacts in the media will be given information documenting the scale of the atrocities and actions of the Iraqi government to further inflame public opinion against the Iraqi government and build support for arming ethnic rebels in the region."
 CIA_KUR80.2.desc:0 "As we continue with our plans for an independent Kurdistan, we need to establish contact with the leading figures in the Kurdish independence movement. Namely the leaders of the Kurdish Democratic Party (KDP) and the Patriotic Union of Kurdistan (PUK). The movements, led by Masoud Barzani and Jalal Talabani respectively have a fierce rivalry, stemming from the PUK splitting off from KDP under Talabani, a former member of the KDP in the mid 1970s over factional infighting within the KDP between more conservative-traditionalists under Barzani and more left-nationalists and intellectuals under Talabani. Our agents will need to ensure that the tensions between the two organizations do not boil over into open conflict or alienate either of them from working with us. To do this, we should approach the leadership of both parties and seek cordial ties and from that point aim to build a consensus among both parties for how power would be shared amicably in an independent"
 CIA_KUR80.3.desc:0 "Following the recent decision by the National Security Council, the Central Intelligence Agency has begun to insert operatives into Iraqi Kurdistan in an effort to cultivate ties with local Peshmerga forces. The rural nature of the opposition movement and opposition to our efforts from Turkey have complicated matters. However, our agents have managed to establish contact and have begun negotiations with representatives from the Kurdish Democratic Party (KDP). Rumors had been circulating prior in reports of atrocities being committed by Baathist forces against the Kurdish population, our operatives have relayed confirmations and documented evidence of these crimes. Analysts within the Central Intelligence Agency are planning to provide this material to the news media to further cause international outcry against the Iraqi government. Thankfully, unlike the Kurdish movements in Syria and Turkey, the Iraqi Peshmerga are largely not communist and more connected to the rural population. With this in mind, expectations are that negotiations should swiftly conclude and that operations in expanding the Peshmerga should commence shortly."
 CIA_KUR80.4.desc:0 "One of the major issues Peshmerga fighters have had over the last decade or so is the various Jash militias. The Jash are well armed militia Kurdish forces loyal to the Saddam regime. These were formed largely from those opposed to the Barzani leadership of the Kurdistan Democratic Party (KDP) and the urban Kurdish population which are more supportive of the government than rural Kurds. Estimates of the total size of the Jash militias are currently somewhere between 250,000 to 300,000 fighters. To further our plans in Iraqi Kurdistan, we will need to deal with this problem. The recently approved plan of operations is to begin offering bribes to various officers within the Jash to undermine support for the Saddam regime and lay the groundwork for a more successful uprising in the future."
 CIA_KUR80.5.desc:0 "Iraq is a multicultural nation, besides the Arab and Kurdish population, there are sizable populations of Yazidi, Assyrian and Turkmen peoples all with a complex relationship between the other ethnic groups and the government of Iraq. The Central Intelligence Agency has issued orders to our agents on the ground to meet with representatives from these communities to seek their aid in our plans to establish a non-Arab state in the region. This will unfortunately not be a simple task. Long standing issues exist between these various ethnic groups. To get around this, we have made sure that the Kurdish forces will be accepting a proposal to allow for independent states for these groups. Ensuring an independent Turkmeni state may also aleve Turkey’s concerns over our Kurdish project but by forcing such a settlement will likely escalate tensions between the Turkmen and Kurds due to their overlapping populations and territorial claims."
 CIA_KUR80.6.desc:0 "Our contacts in Iraq have relayed back that their discussions with the Turkmen, Assyrian and Yazidi leaders have borne fruit and that agreements have been made for these populations to organize against the government once the security situation in the nation deteriorates. Our Kurdish allies are still somewhat aggravated by our decision to outreach to this group but have acceded to the proposals. Given the longstanding conflict between all of these groups, this agreement should serve to allay the concerns of those in the diaspora and further delegitimize the claims of the Iraqi government. Turkey has also pledged to support the Turkmeni in their quest for freedom, while refusing to comment on the other groups and still remains wary of the overall Kurdish project. Still this represents notable progress when it comes to dealing with our erstwhile ally on this issue."
 CIA_KUR80.7.desc:0 "Unfortunately, our contacts in Iraq have reported back that the various other ethnic groups in Iraq have a desire to work in collaboration with the Peshmerga. The main reason for this per our contacts was the history between these groups and the Peshmerga, in particular past ethnic conflicts, massacres and more recently failure to uphold agreements between both parties. To make matters worse, the Turkmeni representatives leaked the communications to the Turkish government, further straining ties with Turkey and furthering their opposition to our wider strategic goal currently in the Middle East in regard to an independent Kurdish state. Still, this is not a major blow to our plans and was largely expected by our local operatives given the historical tensions between these ethnic groups and the governments conciliatory policies to play on these divisions to prevent wider unrest in northern Iraq."
 CIA_KUR80.8.desc:0 "After a lengthy debate within the National Security Council, the President has authorized the launching of an air campaign against Iraqi forces. The airstrike will be limited to northern Iraq, the goal is to dismantle the Iraqi fortifications in the region, cripple their ability to rapidly redeploy and target sites utilized for the Iraqi chemical warfare program. Once these steps are conducted, the Peshmerga should be able to launch a general offensive to seize control of swathes of territory. While this effort is ongoing, our forces will provide air cover for their advance and seek to dismantle any remnants of the Iraqi air force and to mitigate the chances of future Iraqi atrocities against the Kurdish population. If Iraq commits more escalatory actions, a wider bombing campaign may begin to strike their assets deeper inside the nation."
 CIA_KUR80.9.desc:0 "For decades Iraqi Kurds, especially rural Kurds have repeatedly revolted in support of establishing an independent Kurdish state. However, the Anfal campaign by the Iraqi government which has actively sought to bring an end to the conflict by genociding rural Kurdish population centers as well as the heavy usage of chemical warfare has outraged the international community and caused increased resistance against the Iraqi regime by the Kurdish population. American President [USA.GetLeader] announced that the American military was launching airstrikes against Iraqi military targets throughout Iraqi Kurdistan as well as establishing a no fly zone over northern Iraq. This represents a major escalation in the ongoing Kurdish crisis, however the move has been widely praised by most international nations with the exclusion of other states with large Kurdish populations fearing revolts on their own lands."
 CIA_KUR80.10.desc:0 "To further aid in the Peshmergas fight against the Baathist government, the decision has been made to aim to destabilize the Iraqi government. In particular,other resistance groups in southern Iraq will be given limited arms to launch attacks on Iraqi forces. Additionally, our operatives in the nation, in conjunction with our local collaborators will seek to take out high profile targets within the government while also launching attacks on notable infrastructure sites throughout Baghdad. Still, these actions alone are not enough, our trade officers have sought to crack down on the flow of money into Iraq by strengthening sanctions on the Iraqi economy and government officials, along with pressuring our allies in the Gulf to further destabilize the Iraqi economy in relation to the extensive debt Iraq owes to them. All of these actions should aid in delegitimizing the rule of the government, weakening the Iraqi economy and eroding the power structure of the Iraqi state."
 CIA_KUR80.11.desc:0 "The American ambassador has relayed an interesting offer. President [USA.GetLeader] has set out on a course to establish an independent Kurdistan in the region to serve as a regional ally for America and potentially ourselves. While there are definitive advantages to this plan, there are associated risks as well. Assuming the plan succeeds, we will surely have further damaged our ties with the Arab World. At the same time, the strength of Syria would be certainly depleted heavily and we would have a new ally to counterbalance threats to our north. Additionally, removing the Syrian government from the board would aid our endeavors in Lebanon and may provide opportunities to establish other client states in the region which would further stabilize the situation on our borders. That said, we should also consider how this would impact our relations with Turkey given their own issues with their Kurdish minority. How should we proceed?"
 CIA_KUR80.12.desc:0 "Unsurprising, but welcome news has arrived. The Israeli government has agreed to our proposal to collaborate on efforts to boost Kurdish separatism throughout the region. The Israeli response also requested our further assistance in Lebanon and potential support for Israeli actions in establishing Christian and Druze client states in the region to counterbalance Arab hostility to the Israeli state. While we have not agreed to these terms in detail, they do broadly align with our own strategic goals. With Israeli support, our logistics and intelligence network will be greatly expanded and our concerns over the lack of regional allies in this program are now laid to rest. While Turkey will remain a concern and generally opposed to it, Israeli support provides us with a viable alternative for weapon smuggling and clandestine activities to be based out of, especially for actions to be taken against Syria."
 CIA_KUR80.13.desc:0 "Surprisingly, the Israeli government has rejected our offer of collaborating on supporting the Kurdish independence movement. The Israeli government acknowledged that the plan had benefits but argued that such an action may endanger their other current operations in Syria and Lebanon. Additionally, concerns were raised over how such a decision would reflect in the Arab states that they are trying to normalize relations with. The question of Turkey was also raised, especially with the concerns over how the Turkish government will react to the creation of a Kurdish state given their own issues with their Kurdish population. The Israeli government did acknowledge their desire for further cooperation in the region in other regards, especially in relation to the ongoing situation in Lebanon. This is rather disappointing, still our own operatives are capable of continuing to work towards our strategic goal in the region without foreign support."
 CIA_KUR80.14.desc:0 "The American ambassador has relayed to us an update on American efforts in regard to the Kurds. This has long been a controversial issue in American-Turkish relations since the American President decided to back the Peshmerga in our southern neighbors. As part of their efforts to alleviate our concerns, the Americans have agreed to provide us with greater intelligence on the Kurdistan Workers' Party (PKK) positions and membership. A new goal of the American project is to reduce the communist influence in the Kurdsh movement, as part of this they are requesting that our forces take decisive action against the PKK and aim to close our border with Iraq and Syria to prevent PKK forces from further mingling with the other Kurdish forces to our south. Accepting this would surely help in cracking down on the PKK, however by participating in this project we would be tacitly acknowledging the plan to create a Kurdish state to our south out of lands formerly belonging to Syria and Iraq. How should we proceed?"
 CIA_KUR80.15.desc:0 "Unfortunately, our efforts to disengage Syrian Kurdish organizations from the communist Kurdistan Workers' Party (PKK). Following the Turkish refusal to collaborate on combating the PKK, connections between the communist PKK and our local allies have continued to grow and strengthen. While the Iraqi and Syrian Kurdish organizations ideology has not particularly changed, the influence has generated more distrust and anger towards the Turkish government, and some of our provided weaponry has been located in Turkey. All of this has further alarmed Turkey into cracking down harder on the Kurdish population in their own nation and further inflaming tensions among the Kurds and damaging relations with the west that are outraged by their recent human rights abuses."
 CIA_KUR80.16.desc:0 "Thankfully, our efforts to discret the Kurdistan Workers' Party (PKK) has paid off and the newly emerging organized Kurdish movements within Syria are avoiding direct affiliations with the PKK and are embracing an anti-communist line. The Turkish government agreeing to our proposal and coordinating efforts to diminish the PKK inside Turkey and cut off connections between the organizations was a critical step in reducing their influence. Collaboration with Turkey on their own Kurdish problem also aided in calming Turkish concerns over the wider strategic goals of the program and has weakened the overall communist movement within Turkey, a major regional ally. This is a major boon to our long term plan in the region and may aid in our upcoming plans to launch the armed uprising among the Kurdish population in the Arab states."
 CIA_KUR80.17.desc:0 "The unrest in northern Iraq finally came to a crescendo today as Kurdish majority cities in Iraqi Kurdistan have exploded in violence. Kurdish rebels have quickly seized control over swathes of the major cities of Kirkuk and Mosul. This comes after American enforcement of a no fly zone and the initiation of a bombing campaign against the Iraqi military as retaliation for the Anfal campaign. This represents a massive turning point in the Iraqi Kurdish conflict. Historically the urban Kurdish population was the most ambivalent and open to collaborating with the central Iraqi government. The atrocities committed against their population and the renewed fragility of the central government has led to this relationship finally breakdown into open revolt. Recruitment by the Patriotic Union of Kurdistan (PUK),the Kurdistan Democratic Party (KDP) and Kurdistan Workers' Party (PKK) have exploded in recent days. WIth the potential of an independent Kurdistan now possible, one must wonder if the ideologically dispatriate organizations will be able to build a common consensus and stable government."
 CIA_KUR80.18.desc:0 "Unfortunately, our long history of oppressing the Kurdish population has failed to deter another Kurdish uprising. Earlier today, reports from the field across northern Iraq came in telling of rapid attacks and the capture of various rural checkpoints. In more urban Kurdish settings, reports of racial rioting have also kicked off in Mosul. Perhaps the most alarming news of all is that the city of Erbil has quickly fallen to Peshmerga forces and rumors abound of advances towards Kirkuk and Mosul. The remaining loyalists that managed to have escaped Erbil fast enough reported that the day began normally until the Jash militias began opening fire against government forces and guerrilla fighters quickly stormed the local prisons and police stations as the traitors put our forces down in their barracks. This combined with the American pressure may make holding most of Iraqi Kurdistan difficult at best and near impossible at worst to hold in the medium to long term."
 CIA_KUR80.19.desc:0 "For years there had been little conflict between our government and the Kurdish population in the northern reaches of our nations. While in recent years the occasional local problem arose, there was generally little concern raised by the security apparatus. Events kicked off in northern cities, in particular Qamishli and al-Hasakah where initially Kurdish protestors began a racial riot and attacked the local Arab population along with storming local police and party infrastructure. The situation deteriorated further with the sudden arrival of guerilla Peshmerga units who managed to quickly seize both cities. Perhaps more alarming are the lack of reports from Kobani, which intelligence has speculated is due to a complete loss of control in the city. Reports have also come in of skirmishes on the outskirts of Deir-ez-Zor. Given the American support for the Kurdish movement and our likeliest ally, Iraq dealing with similar issues we will need to consider our strategic choices carefully."
 CIA_KUR80.21.desc:0 "The ongoing Kurdish uprising in both our own nation and Syria grows bleaker by the day. News has come in from the front that American aircraft, in potential conjunction with Israel, have begun bombing our forces and airfields near the frontlines and are actively suppressing our attempts to transport military forces to aid in putting down the rebellion. Reports from neighboring Syria have relayed similar information with major American strikes on Syrian airfields and targeting air defense installations throughout the nation. Outside of an already beleaguered Syria, there are few if any allies for us to turn to. While Iran and Turkey may be sympathetic to the idea of cracking down on Kurdish separatism, neither will raise a finger to bolster our government given their deep distaste for our own regime."
 CIA_KUR80.22.desc:0 "The ongoing Kurdish uprising in both our own nation and Iraq grows bleaker by the day. News has come in from the front that American aircraft, in potential conjunction with Israel. To make matters worse, air support appears to have also been used to weaken our hold over the nation in regard to a resurgent Muslim Brotherhood which is attempting to gain control over swathes of territory around Aleppo. Our sources in Baghdad have also relayed that similar actions have been taken against their forces, while we have desperately put out calls for support, so far no substantial offers of aid have come in. To make matters worse, our main potential allies against the Kurds are unwilling to take up arms against the United States, especially Turkey given their status as a NATO member. It may be time to consider withdrawing to our core loyalist territories around Damascus and Latakia if the situation deteriorates further."
 CIA_KUR80.23.desc:0 "Our efforts in expanding the Kurdish conflict to Syria have succeeded so far, now with a rebellion instigated we must do our part and actively intervene in the conflict. That said, we can not immediately jump into the conflict overtly. Several proposals have been submitted by our analysts within the Central Intelligence Agency to aid in preparing for our overt armed intervention as well as more covert means to weaken the Syrian state and rally the populace for the intervention. Most notably, while the Kurdish opposition should be able to hold territory without too much aid at this moment, there needs to be other distractions to ensure the Syrian military can not all converge on Syrian Kurdistan. In this effort a proposal to begin looking for other opposition forces in Syria to back and arm to cause further chaos. Of course we will also need to ensure the media reports sympathetic coverage about the Kurdish struggle and demonize the Syrian government to bolster support, both domestically and internationally for intervention."
 CIA_KUR80.24.desc:0 "In our ongoing efforts to establish a Kurdish state in the Middle East to provide us with a credible Middle Eastern ally in addition to Israel, destabilizing Syria is an important step. The main strategy proposed by the Central Intelligence Agency is to arm the Islamist opposition within Syria, mainly the Islamic Brotherhood. The Syrian government brutally cracked down on an earlier uprising by the Brotherhood in the decade, however the anger towards the predominantly Alawite government by the Sunni Arab population is still simmering and can be exploited. To this end, the President has authorized the shipment of arms to the Muslim Brotherhood and related forces in Syria to further destabilize Syria and lay the groundwork for armed intervention into Syria by our military and other allied parties. Concerns have been raised about how this move may lead to an increase in religious radicalization throughout the region, however the National Security Council has decided that this is an acceptable risk to bring down the Syrian government."
 CIA_KUR80.25.desc:0 "Before engaging in further measures against the Syrian government, we must rally the international community, especially our NATO allies against the regime. To start with, our operatives in the media have been given orders to amplify coverage of the political violence and brutal crackdown on the Muslim Brotherhood and cover how a fringe religious minority aligned with terrorism in the region oppresses the general population of Syria and has a stranglehold over the government and military. Given the strength of our media contacts, this should not be a difficult task, furthermore, the conflicts between Syria and Israel, and the Syrian participation in the Lebanese Civil War should be utilized to further demonize the Syrian regime as an unstable actor spreading turmoil and chaos throughout the Middle East while also oppressing their own population. Our representatives in the United Nations have also been tasked with drafting and proposing new sanctions against the Syrian government over their human rights abuses to further encourage outcry."
 CIA_KUR80.26.desc:0 "As the Kurdish conflict in northern Iraq has exploded, the embers of rebellion quickly spread to Syrian Kurdistan as well. The initial unrest was met brutally by the [SYR.GetLeader] regime, including the usage of chemical weapons and other brutal breaches of the rules of war. American President [USA.GetLeader] announced today that the United States would be intervening in Syria to depose the barbaric regime of [SYR.GetLeader] as well as to free the Kurds in northern Syria. This move also follows recent American military support for Iraqi Kurds and raises further questions of whether an independent Kurdistan is finally in sight. Questions remain, especially as concerns are raised in Ankara and Tehran over potential unrest in their own Kurdish majority regions. Arab states as well as the Soviet Union have condemned the move as a blatant disrespect for international norms while most NATO members have expressed support for the move, with the notable exception of Turkey."
 CIA_KUR80.27.desc:0 "American forces have launched a major ground intervention into our nation with the support of Israel and other regional American allies. Not only this, but Muslim Brotherhood forces have launched simultaneous attacks against government forces and Peshmerga forces have intensified their attempts to consolidate control over northeastern Syria. Our armed forces need to quickly determine new defensive lines and secure our bases of support in Latakia and Damascus where we can rely on the local populace to support the government and armed forces. We may need to consider ceding certain regions to the opposition and Americans to not overextend ourselves and to try to reduce the chances of bombing by utilizing dense urban areas as our battlefield of choice. Unfortunately, our dearth of regional allies is returning to haunt us, furthermore concerns have been raised over a potential Israeli incursion through the Golan Heights."
 CIA_KUR80.28.desc:0 "The Sykes–Picot Agreement has since the end of World War I defined the borders of the Middle East.  Critics have alleged for decades that the lines drawn to determine the borders of the Middle East were arbitrary and detrimental to the interests of non-Arab ethnic groups throughout the region. Perhaps the most slighted group has been the Kurds of Iraq and Syria. However following the successful Kurdish struggle for independence in Iraq and American intervention in Syria, a newly independent Kurdistan has emerged, shattering the boundaries established in the aftermath of World War I. This said, the future of the rest of Syria is still up for debate as proposals have been presented varying from preserving the remaining territorial integrity of Syria to further balkanizing the nation upon ethnic lines. Time will tell how these changes will reverberate throughout the region."
 CIA_KUR80.29.desc:0 "The ongoing Kurdish uprising grows bleaker by the day. Formerly loyalist militias have defected to the Peshmerga, ethnic conflict has broken out in urban areas and general unrest has spread throughout the nation.To make matters even worse, news has come in from the front that American aircraft, in potential conjunction with Israel, have begun bombing our forces and airfields near the frontlines and are actively suppressing our attempts to transport military forces to aid in putting down the rebellion. Outside of an already beleaguered Syria, there are few if any allies for us to turn to. While Iran and Turkey may be sympathetic to the idea of cracking down on Kurdish separatism, neither will raise a finger to bolster our government given their deep distaste for our own regime. We may need to consider even more drastic measures to be taken against the Kurdish population in the coming days."
 Gladio80.0.desc:0 "Since shortly after the end of the Second World War, we have organized a large swath of organized fallback units and organizations throughout Continental Europe. This network, codenamed \"Gladio\" is present in all non-Soviet and non-communist nations in Continental Europe as well as all NATO members excluding Iceland, Canada and Britain. The primary mission of the fallback organizations is to prepare for World War III and launch resistance operations against Soviet occupiers if Soviet forces manage to occupy their home territories. Unfortunately, many of our major operatives in the program are tied to far-right and often former Nazi officers during the Second World War. However, many of the nations we have these cells in are either unaware of our activities or not aware of the true extent of the operation. Additionally, Gladio or Gladio linked operatives have been major participants in the Greek and Turkish coups as well as the political violence in Italy that has occurred in recent times.\n\nWe must now decide whether to escalate the current program or seek to cut off far-right elements and disclose activities with our security partners."
 Gladio80.1.desc:0 "After intense debates within the National Security Council (NSC), President [USA.GetLeader[ has decided that the administration must re-evaluate our conduct in Operation Gladio. In particular the NSC has decided that far-right operatives and local networks are an overall liability to the operation and should be dealt with in the near-term. Further concerns have also been noted about the security and integrity of our widespread hidden weapon caches throughout Europe, especially in light of reports that organized crime elements have found certain stockpiles and have begun using the weaponry inside them. Most controversial within the NSC and broader intelligence community is the agreement that NATO member-states should be informed about Operation Gladio to some capacity after our reforms are carried out to reassure our allies and remediate concerns over various terrorist and organized crime related events that have occurred in recent years tied to our intelligence operative networks."
 Gladio80.2.desc:0 "One of our major concerns highlighted during the debate in the National Security Council is the recent expose that organized crime elements have found hidden weapon caches and have been utilizing them for their own illicit gain. While the public and resident governments are not necessarily aware of the origin of the weaponry, the fact remains that our weapon caches have been compromised and are being used to harm our allies. To this effect, the CIA Director has directed agents to investigate the status of all notable weapon caches apart of Operation Gladio. After this audit is completed, the Director has decided that the administration should determine on how to proceed in regard to new storage protocols and the future of hidden weapon caches in Western Europe, especially in urban areas where most of the discoveries have occurred so far."
 Gladio80.3.desc:0 "While controversial within the administration, many of our covert operatives in Eurasia are former Nazi’s often with very unpleasant personal history’s. However, these operatives such as Ruzi Nazar, one of the main leaders of the Turkestan Legion which fought for Germany during World War II have proved invaluable in organizing cells, gathering intelligence and recruitment. Unfortunately other far-right elements, especially those in Italy and France have been tied to numerous unsanctioned terrorist attacks on their domestic political opponents. However, this move has been a mistake since the beginning and betrays our national values as well as has led to various incidents in our allies. The National Security Council has decided to begin a full purge of far-right operatives, especially those with Neo-Nazi ties in the imminent future. Before the purge fully begins. Our intelligence apparatus will need to ensure that any loose ends are tied and that the overall operation or past incidents linked to it become public knowledge."
 Gladio80.4.desc:0 "In accordance with our new policy shifts in regard to Operation Gladio, reliable ministers in NATO states where we have stay-behind networks active have been informed about the networks and the steps we have taken recently to increase the safety and credibility of the operation. Overall, reception has been mixed with appreciation for the disclosure of the operations but concern over the length of time these networks have existed without disclosure. Unfortunately, this move has opened up more opportunities for our operation to leak to the public and may make it more susceptible to Soviet subversion. However, the pros of this move will likely outweigh the negatives given we can now actively build stronger intelligence ties with our allies and enhance plans for establishing governments-in-exile and fallback operations in their respective nations."
 Gladio80.5.desc:0 "After a careful review, the National Security Council has decided to keep the course on Operation Gladio. While certain aspects of the operation will be under further review, especially on who is being recruited and targeted for the program along with possibly expanding collaboration with other NATO member states, the overall mission of Gladio is too imperative to be endangered by drastic reforms. While there have been incidents where Gladio linked operatives have used our assets without consent to engage in terrorist acts and certain caches have been uncovered and seized by organized crime elements, the overall program is largely sound and has shown its usefulness already in preventing the spread of communism in Greece and Turkey over the last several years. This said, we must ensure that the public remains unaware of the program for the time being and ideally indefinitely given the connections of Gladio to unsavory elements, in particular the ties between our intelligence services and unreformed Nazis."
 Gladio80.6.desc:0 "For too long our operative network has been to some extent disconnected from their target nation’s intelligence services. To this effect, CIA operatives will be utilized to build further relationships within various nations intelligence services and begin further recruitment among them for Operation Gladio. Beyond the benefits of expanding our preparedness for another global war, this would also enable us to have deeper influence in our allies governments and ensure that they do not fall to communism. For decades we have had strong connections with the intelligence services in specific nations, especially Greece and Turkey where we have encouraged interventions when the nation appears on the brink of chaos or turning to communism. Overall, expanding this capacity to other European nations is of key importance and should be a strategic goal for the coming years."
 Gladio80.7.desc:0 "After a lengthy NATO discussion, the member states have agreed to expand intelligence sharing capabilities and further coordinate intelligence operations. This is a definite victory for President [USA.GetLeader]’s intelligence strategy as well as a victory for strengthening NATO unity. That said concerns were raised by some member-states about the treatment of their national sovereignty given recent events and the history of operations overthrowing certain nation’s governments in the prior years. Our administration soothed these concerns by pointing out our limited involvement and that there was clearly a present danger of said nation’s either falling to communism or risking disastrous civil strife and that such operations are a method of last resort. This move should also allow us to further entrench our fallback operatives and networks further into our allies intelligence networks and nation’s along with expanding our pool of potential recruits. "
 Gladio80.8.desc:0 "Unfortunately, after bringing the proposal of increasing intelligence sharing and collaboration among NATO members, the organization has voted against the proposal. Concerns were raised from nations about privacy concerns and reports of increased far-right terrorism along with organized crime discovering \"unknown\" weapon caches across the region. While unfortunate, this move will do nothing to deter our operations to continue to expand and build up our network of fallback cells throughout Continental Europe. Given the secondary purpose of Gladio is to prevent a communist takeover of Western European nations, perhaps we should consider looking further into the governments that voted against the proposal. That said, this decision will cause some pushback among our allies, especially those who voted against due to national sovereignty concerns and is a minor embarrassment at home."
 Gladio80.9.desc:0 "While controversial within the administration, many of our covert operatives in Eurasia are former Nazi’s often with very unpleasant personal history’s. However, these operatives such as Ruzi Nazar, one of the main leaders of the Turkestan Legion which fought for Germany during World War II have proved invaluable in organizing cells, gathering intelligence and recruitment. Unfortunately other far-right elements, especially those in Italy and France have been tied to numerous unsanctioned terrorist attacks on their domestic political opponents. This raises into doubt our usage of the militant far-right for the prime recruitment for Gladio. To this measure, the National Security Council has approved a plan to further expand recruitment in far-right circles throughout Europe to utilize their unique skills and connections to further expand our preparations for the worst."
 Gladio80.10.desc:0 "While controversial within the administration, many of our covert operatives in Eurasia are former Nazi’s often with very unpleasant personal history’s. However, these operatives such as Ruzi Nazar, one of the main leaders of the Turkestan Legion which fought for Germany during World War II have proved invaluable in organizing cells, gathering intelligence and recruitment. Unfortunately other far-right elements, especially those in Italy and France have been tied to numerous unsanctioned terrorist attacks on their domestic political opponents. This raises into doubt our usage of the militant far-right for the prime recruitment for Gladio. To this measure, the National Security Council has decided to review our current operative networks and ensure a proper vetting standard for future cell members and especially their leaders. However, in sidelining far-right elements we will need to ensure they do not leak information to the media in retaliation."
 CIA_Karabach.0.desc:0 "For millennia, the Karabakh region has been a site for conflict between Armenians and various Muslim Turkic peoples. The Soviet Union attempted to solve the issue with population transfers and other measures, however as the Soviet Union began to collapse, tensions in the region exploded. Armenia and Azerbaijan are now at war over the disputed region with the Armenian population in Karabakh declaring their own independent state which in reality is a proxy for Yerevan.\n\nWith that said, we currently have minimal influence in the Caucuses and the conflict presents an opportunity for our government to begin exerting influence in the region. However to do so, we would need to back either Azerbaijan or Armenia and undermine Russian influence in whichever nation we decide to back. Additionally, selecting either may lead to either geopolitical or domestic blowback. Backing Armenia would surely anger Turkey, while backing Azerbaijan would draw protest from the Armenian diaspora community in the United States."
 CIA_Karabach.1.desc:0 "After several days of arguments and discussions, the National Security Council has made the decision to approach the government of Armenia over the ongoing Karabakh War. Our ambassador in Armenia will covertly meet with the Armenian foreign minister to make the offer of aid and advisors. The offer will need to be made with as little chance of a leak as possible given the delicate geopolitical nature of the conflict, especially in regard to Turkey’s support for Azerbaijan and continued denial of the Armenian Genocide. While our foreign policy experts believe Armenia will accept the offer, it should be noted that the pro-Russian elements in the Russian government and population may lead to Yerevan rejecting the offer out of fear of alienating their Russian allies."
 CIA_Karabach.2.desc:0 "An interesting proposal has come in from Washington, the United States is offering to send us military aid and advisors in support of our ongoing conflict with Azerbaijan. While no strings are directly attached, this is clearly a power play against Russian influence in our nation and should be considered carefully before accepting. Accepting the deal will likely lead to alienating the Russian government and would draw opposition from the pro-Russian oligarchs and more pro-Russian voting bloc. However, accepting would likely lead to a strengthening of ties with western powers, major military aid and the opportunity for a much needed modernization of our military along with help in legitimizing our intention of seizing Karabakh. How should we proceed?"
 CIA_Karabach.3.desc:0 "The government of Armenia replied to our offer today and has accepted our offer of material aid and sending advisors. This is excellent news for our continued plans to build influence in the Caucuses. Aid shipments and advisors will be redeployed from NATO bases in Western Europe to Armenia in the coming days in support of their conflict with Azerbaijan. News of the acceptance has unfortunately spread earlier than we would have liked which has led to Turkey condemning the agreement and pledging further support for the Azeris. In more fortunate news, the domestic response has been largely positive and our administration has received a boost in support in states with a sizable Armenian diaspora population, in particular California."
 CIA_Karabach.4.desc:0 "In a bizarre move, the Armenian government has declined our initiative to provide them with military and technical assistance. The Armenians noted that they will remain loyal to their Russian allies and believe they are already in a state to actively defeat their Azerbaijani opponents. This is a disappointing occurrence, however in itself is not a disaster, however if this offer was leaked to Turkey this could quickly turn into a political maelstrom. For now American influence will remain likely minimal in the Caucasus region however we can always look to the future and other regional conflicts to exert or build influence in the region, especially in Georgia or through our Turkish allies."
 CIA_Karabach.5.desc:0 "As our efforts continue to build influence in the Caucuses, we must now contend with the issue of the pro-Russian oligarchs. The Central Intelligence Agency in conjunction with international law enforcement officers have covertly executed various raids on pro-Russian elements in Armenia. Several pro-Russian oligarchs were taken into custody on a bevy of charges, and various lower level Russian operatives were liquidated or captured. As pro-American sentiment continues to grow in Armenia given our help in their ongoing war, pro-Russian political parties will continue to diminish in support and we will finally have a base of operations in the region. That said, we will need to endeavor to find a diplomatic solution between Ankara and Yerevan."
 CIA_Karabach.6.desc:0 "As American support has continued to turn the war in our favor, the support for America by our population has rapidly expanded. This has enabled our government to take action against various Russian agents in the nation and in conjunction with Washington have arrested or otherwise compromised several prominent pro-Russian oligarchs. This has severely curtailed Russian influence in our nation and has led to a deepening of ties between Washington and Yerevan. While Turkey remains a roadblock, other European nations, in particular France have voiced strong support and also contributed to our war effort since the reveal of American aid. Consequently our relations with Russia are reaching a nadir and Russia has since shifted to backing Azerbaijan."
 CIA_Karabach.7.desc:0 "As we continue with our plans to bolster our influence in Armenia, a major route to increasing our support would be to covertly boost the Armenian war effort against Azerbaijan. One way of doing this would be to provide intelligence on the position and strength of Azeri military units throughout the Karabakh region and the immediate surrounding areas. This would enable Armenia to make better use of their limited military capacity while still indebting the Armenian government and military establishment to our government. After the current National Security Council meeting concludes, our reconnaissance aircraft will intensify their surveys of the Caucasus to begin collecting the needed information to provide the Armenian military. That said, we will need to ensure that our actions do not serve to overly destabilize the region or cause the conflict to turn into a broader regional war as well as prevent a further deterioration of ties with Turkey."
 CIA_Karabach.8.desc:0 "Great news, the Americans have begun to provide us with real time intelligence on Azeri military positions throughout the conflict zone. This comes in light of our agreement to closer align ourselves with Washington after accepting military aid. Our ties with Russia since then have significantly deteriorated, this move further demonstrates Washington’s commitment to our cause and will prove useful in our operations to secure rightful Armenian lands. The pro-Russian politicians and their supporters have also grown increasingly alarmed about our newfound ties with the United States and may prove problematic in the near future and at the least something that needs to be kept tabs upon as we continue the war effort."
 CIA_Karabach.10.desc:0 "After several days of arguments and discussions, the National Security Council has made the decision to approach the government of Azerbaijan over the ongoing Karabakh War. The deciding factors in picking Azerbaijan are the nation’s vast oil reserves and Turkey’s strong support for the Azeri cause. Going down this route may alienate the Armenian diaspora and cause some tensions with certain European partners but will be for the benefit of our economy along with that of strengthening our ties with Turkey and countering Iranian and Russian influence in the region. In the coming days, our ambassador to Azerbaijan will be instructed on how to proceed in cultivating a deeper relationship with Baku and how to avoid further escalation with Russia given the nation has historically been within its sphere of influence."
 CIA_Karabach.11.desc:0 "A recent proposal during a meeting of the National Security Council is to sell discounted weapons to Azerbaijan. Our ambassador in Baku has been directed to meet with Azeri leader [AZR.GetLeader] to discuss the potential terms of sale and other ways we could support the Azerbaijani state. That said, we should aim to minimize the publicity of the event out of concerns of pushback from home and abroad, in particular from the Armenian diaspora community. Shifting Azerbaijaini towards western influence would not only provide us with a base of operations in a historically unfriendly region but would also open up Azerbaijan's oil production to western markets. Additionally, Turkey has privately signaled strong support for the move and has noted that they may begin providing additional aid as well."
 CIA_Karabach.12.desc:0 "As expected, the Azerbaijani government has accepted our offer of discounted weapon sales. In the coming weeks, heavy weapon shipments will begin to arrive in Baku from our supply hubs in Western Europe. The weapon shipments should enable the Azerbaijani military to quickly reform and enable them to make efforts to retake their lost territory. While we will have to publicize this move to some degree given the heavy armament will make our involvement obvious, we can expect that the general public will likely not place much emphasis in the conflict. However, the Armenian diaspora community, mainly in California will surely vote en masse for whomever we oppose in the next election."
 CIA_Karabach.13.desc:0 "In a bizarre twist, the Azerbaijan government has rejected our offer of a low price weapon deal, Baku noted that while appreciated, the offer was unnecessary and that the government did not wish to further indebt themselves either financially or politically to foreign powers. Making the situation even worse, pro-Russian individuals in the Azerbaijani government leaked the proposed deal to the international press, leading to an embarrassment to our government and further straining our ties with Armenia as well. Our polling numbers in California will surely be taking a hit as well. Thankfully, outside the Armenian diaspora community, the general public remains largely ambivalent to the conflict."
 CIA_Karabach.14.desc:0 "One aspect of the ongoing war between Azerbaijan and Armenia, is the long standing ethnic and religious conflict in the region. Given our success in mobilizing recruits in Afghanistan and other Islamic areas, the National Security Council (NSC) has authorized establishing a program to recruit foreign volunteers from other Islamic and Turkic areas to fight on behalf of Azerbaijan to bolster their manpower in their ongoing campaign. Given our historical strong links to pan-Turanism groups in Turkey and elsewhere, local CIA leaders and operatives are of the belief that recruits can be quickly found and transported to Azerbaijan in the coming days and weeks. Concerns have been raised by objectors however that this move will endanger emboldening and expanding the influence of radical Turanist and Islamist terrorist organizations and could lead to unforeseen complications in the future."
 CIA_Karabach.15.desc:0 "Great news, the United States has begun utilizing their connections among Islamist fighters as well as connections in Turkey to rally foreign volunteers to fight on our behalf and come to Azerbaijan. As we struggle in our war to retake our sovereign lands this is a welcome move in the right direction. That said, given our more secular course we will need to ensure that the new recruits will not continue to make problems after the end of the war. Additionally, concerns have been raised by our security forces over the potential for Iranian agents to infiltrate our military and attempt to undermine our government to spread the Iranian Revolution here, especially given the Iranian irredentist claims on our territory."
 CIA_Karabach.17.desc:0 "As we continue our efforts to bolster Azeri forces in the ongoing Karabakh War, we have enhanced our campaign to undermine Russian influence in Azerbaijan at large. As this memo is written, the Azerbaijani security services are taking various pro-Russian oligarchs and politicians into custody on various charges based on information we have provided to Baku. This move will effectively cripple the pro-Russian bloc in the Azerbaijani economy and government and will allow us to finally establish a proper foothold in the Caucuses. While various media leaks have rumored that our government has been backing Azerbaijan in the ongoing conflict, the domestic political costs have been minimal and mostly localized to pockets of the Armenian diaspora, mainly in California."
 CIA_Karabach.18.desc:0 "Keeping tabs on the political developments in Baku is an essential task for our intelligence services given our ongoing war with Azerbaijan. Recently, we have received reports of various pro-Russian businessmen and politicians have been taken into custody and are being charged with a slew of charges. By all accounts there would appear to be a major campaign against Russian influence in Azerbaijan underway. This surely points towards renewed Azeri aggression towards our state and reaffirms our need to tie ourselves deeper to Russia to protect our territorial integrity. While there is no solid proof, there is circumstantial evidence that the United States has begun actively backing Azerbaijan, this may be a sign of major changes to come in the region in the future."
 CIA_Karabach.16.desc:0 "Early into the ongoing conflict in the Caucuses between Armenia and Azerbaijan, the administration of {USA.GetLeader] has taken a strong pro-Azeri stance. New reporting has shed light on a project by the Central Intelligence Agency to recruit and deploy foreign volunteers to Azerbaijan to fight against the Armenian forces in the disputed Karabakh region. Volunteers are being recruited from both militant Islamist backgrounds as well as from Turklc nationalist sources, especially the controversial Grey Wolves of Turkey. Armenia and Russia have condemned the move as an attack on Christianity and a betrayal of so-called \"Western Values\". Domestic critics of the President have made similar criticisms and pointed to the autocratic nature of Azerbaijani leader [AZR.GetLeader], however the President has pointed out that Armenia is the aggressor in the conflict and that Azerbaijan is merely trying to preserve their territorial integrity."
 CIA_GEO.0.desc:0 "In the 1990 election, the Georgian populace clearly voted for noted anti-Soviet dissident, Zviad Gamsakhurdia handily won by a massive margin. Unfortunately, unrest rapidly spread throughout the nation, especially among the former Soviet nomenklatura and ethnic minority regions. As the situation continued to devolve, pro-Russian warlords launched a coup, taking over the capital of Tbilisi leading to Gamsakhurdia and his forces to re-establish themselves in the west of the country. Meanwhile, separatists backed by Russia have also risen up and the region of Ajara has effectively declared armed neutrality in the ongoing conflict. Further complicating this situation is the breakaway Russian region of Chechnya has backed Gamsakhurdia’s forces. Looking at the conflict, Gamsakhurdia would be the most open to our influence, a proposal currently being reviewed by the National Security Council involves potential support for Gamsakhurdia’s forces, seeking to aid in his quest to restore his rule over the nation. How should we proceed?"
 CIA_GEO.1.desc:0 "After a lengthy debate in the National Security Council, the President has decided on a course of neutrality in the ongoing conflict in Georgia. While establishing a firmly pro-western government in Georgia would be ideal, the risks of the endeavor were determined to be too great to risk. In particular, emphasis was placed on the general instability in Georgia, given the various factions fighting against one another as well as the Russian interference in the conflict could lead to open conflict between Washington and Moscow and would surely doom any attempts to establish cordial ties between America and Russia. Still, some in the National Security Council have criticized the move as selling out liberal forces in the Caucasus and missing a major opportunity to weaken Russian influence in the region."
 CIA_GEO.2.desc:0 "President Gamsakhurdia, the rightful president of Georgia is a noted human rights activist, Soviet dissident and English professor is currently embroiled in a fight with pro-Russian separatists, backed by Russia  and disloyal elements within the Georgian army. While some may argue his cause is all but doomed, our intelligence officers in the region have recently strongly argued for American intervention in the conflict to support forces loyal to President Gamsakhurdia. Earlier today, the President has signed on to the proposal and American aid will be swiftly delivered, along with a notable increase in the number of intelligence officers deployed to the region and the deployment of military advisors to Georgia. While a formal announcement of our support has yet to be announced, more dovish political elements in the nation have condemned any potential support for Gamsakhurdia as overly escalatory towards Moscow."
 CIA_GEO.3.desc:0 "In a surprising turn of events, good news has arrived from Washington. The United States has decided to fully support our loyalist forces in our quest to restore our nation's democracy and territorial integrity. Deliveries of much needed weaponry will be arriving in the coming weeks and the deployment of American military advisors is also in the process of occurring. Given the Russian support for our enemies, this has the potential of reversing our recent string of losses and setbacks and set us on course for a counteroffensive against the Russian puppets. Since the announcement has become public, Moscow and their local sycophants have decried the move as escalatory and allege that we have become little more than an American puppet. Still, we should continue to build ties with Chechen forces to our north in our common cause against the Russian presence in the Caucuses."
 CIA_GEO.4.desc:0 "Aslan Abashidze is the leader of the Ajarian Autonomous Republic, a strategically critical region of Georgia, located on the border of Turkey in the southwest reaches of Georgia. The Treaty of Kars, signed in 1921 by Turkey and the Soviet Union, guaranteed the rights of the Muslim population in Adjara autonomy; the governments of the successor states to the Soviet Union have also ratified this agreement, resulting in the continued existence of a heavily autonomous part of Georgia. So far, Abashidze has remained steadfastly neutral in the ongoing conflict, Abashidze getting involved on behalf of either side could be critical in shifting the balance of the civil war to one side or the other. Our intelligence officers in the region have compiled two proposals to remediate the situation. The first plan of action presented is to offer Abashidze a significant bribe to get involved in the conflict, the second plan is to stage an assassination on Abashidze and pin it on pro-Russian elements in Ajara. How should we proceed?"
 CIA_GEO.7.desc:0 "An interesting offer has arrived earlier today, while not openly disclosing their ties, the agent was clearly affiliated with the Central Intelligence Agency. The offer provided by the agent noted that the United States would pay a significant amount of money personally to our leader as well as developmental aid for Ajara in exchange for entering the ongoing civil war on behalf of the Gamsakhurdia loyalists. Up to this point, our region has steadfastly remained neutral in the ongoing civil war, however this offer would significantly benefit our leadership, and region. On the other hand, the opposition to Gamsakhurdia is backed by Russia and entering the civil war would surely draw their ire, with that in mind, how should we proceed?"
 CIA_GEO.8.desc:0 "Great news, Aslan Abashidze has accepted the proposed bribe and has announced his support for Gamsakhurdia. While the Russians and Russian aligned opposition have condemned the move as a blatant case of corruption, the move provides significant momentum to the Gamsakhurdia loyalist forces and may help to bolster their numbers in time for a future counteroffensive to push out the rebels and pro-Russian separatists plaguing the nation. However, concerns have been raised over potential ethnic and religious violence that may be inflicted on the region if Russian aligned forces can break into the region and we should establish plans for if the worst comes to pass to avoid an embarrassing situation for the administration."
 CIA_GEO.9.desc:0 "Unfortunately, Aslan Abashidze has rejected our proposal. While the offer has remained confidential, Abashidze countered that entering the conflict would be too risky for himself and for Ajara at large. He noted the potential for ethnic and religious violence could be perpetrated upon his people if Gamsakhurdia ultimately failed to consolidate control over Georgia and that the autonomy granted to the region could be terminated which could lead to even further escalation from Turkey over breaking the Treaty of Kars. While unfortunate, this reaction is not unexpected, getting Abashidze to see reason was always a long shot and at the least the region will remain neutral by all accounts for the foreseeable future. We will need to look for other ways to bolster the Gamsakhurdia loyalist forces to ensure that Russia will not fully control the Caucuses once more."
 CIA_GEO.10.desc:0 "Great news, the Ajarian Autonomous Republic has ended their policy of neutrality in our ongoing civil war and announced their support for our cause.While not the largest or most populated region, the shift in support grants us a significant degree of legitimacy and will still be able to provide us with a decent amount of manpower. Perhaps more importantly, the move will grant us an undisputed access point to Turkey which would provide us with a clear point of access for further aid from the west. Still the fight continues and we will also now need to ensure that opposition forces do not attempt to seize control over Ajara and will have to owe factors to Abashidze in a post-war Georgia."
 CIA_GEO.12.desc:0 "Since the fall of the Soviet Union, there has been notable unrest in the ethnic republics of Russia. With that in mind, the National Security Council has approved a plan of action proposed by the CIA to begin funding anti-Russian movements in Kalmykia, Kalmykia is unique in that unlike the rest of Russia, is majority Buddhist and Mongol, with the population descending from Oirat Mongols who migrated to the region centuries prior. Given the location of the region near the Caucuses and along the Caspian Sea, our operatives should be able to easily infiltrate the region and contact local movements to find organizations to support or in the worst case, find anti-Russian locals to start organizations with. Our operatives will also approach the small diaspora community to further look for potential figureheads for an independence movement for the region. "
 CIA_GEO.13.desc:0 "To further weaken Russian influence in the region and siphon off more of their military, the decision has been made to increase our support for the Chechen and Dagestani Islamist movements inside Russia. Given the ongoing conflict in these regions already, any further lethal aid to the rebels will clearly directly harm Russia and likely necessitate a larger Russian military presence if they wish to prevent Dagestan from fully following in the footsteps of neighboring Chechnya. That said, this has not been decided without its share of detractors. Our contacts among the Arab states will also look for potential backers for the Islamist movements in these regions to solicit further financial and armed aid. Critics within the administration argued that the move is overly escalatory and that by backing these movements we are effectively arming terrorists that could turn on us in the future. However for now, the Islamists in Dagestan and Chechnya are our allies of convenience, freedom fighters against Russian tyranny."
 CIA_GEO.14.desc:0 "Despite our best efforts, the Georgian Civil War has stalled out and Georgia has effectively become partitioned several ways. South Ossetia and Abkhazia have declared their independence, the forces loyal to Zviad Gamsakhurdia hold a significant chunk of the country’s land, another chunk of Georgia is held by the pro-Russian opposition and then Ajara, formerly neutral has declared independence as well following the inability of either side to decisively end the civil war. While unfortunate, this is still a more advantageous situation for us than the pro-Russian opposition outright winning the civil war. The chaos in the region has served to weaken Russian operations in Chechnya and has contributed to the deteriorating situation for Russia in Dagestan, how this situation evolves over the coming years is anyones to guess."
 CIA_GEO.15.desc:0 "To the surprise of the international community, the loyalist forces of Zviad Gamsakhurdia have managed to triumph in the ongoing civil war, even managing to defeat the secessionist forces in South Ossetia and Abkhazia. This is a major victory for our administration and a catastrophic defeat for Russia, especially with the growing instability in Dagestan and Kalmykia and the continued inability of Russian forces to retake Chechnya. While Russia continues to condemn our actions in Georgia and allege that we are backing the secessionists plaguing Russia in the Caucuses at the moment, there appears little Russia can do to retaliate at the moment and further support for these causes will surely help to cripple Russia’s ability to wage war and project influence. Debates will need to be held shortly on what role we will play in the reconstruction of Georgia and the potential expansion of NATO into the Caucuses."
 CIA_GEO.16.desc:0 "With the victory of the Gamsakhurdia aligned forces in the Georgian Civil War we now have a potentially reliable nation to base operations in the Caucuses. Now, the debate in the National Security Council is whether or not we should drastically expand our military aid offerings to Georgia, in particular if we should allow them to acquire American made aircraft and heavier arms, such as tanks and artillery. Additionally, proposals have been raised to provide economic aid to help stabilize Georgia in the aftermath of the brutal civil war. Unfortunately Congress is unlikely to be pleased with new spending requests, while the bill would ultimately pass, providing significant aid would surely cost our administration some amount of political capital, how should we proceed?"
 CIA_GEO.17.desc:0 "Following the victory of western aligned forces under Gamsakhurdia we have, after careful consideration with our key NATO partners, decided to invite Georgia to NATO. While Russia, and pro-Russian sycophants throughout Europe will decry this move as a violation of Russian sovereignty and informal agreements prior on the expansion of NATO, the Russian intervention in Georgia and the struggle for a democratic Georgia have clearly demonstrated the need for NATO involvement in the former Soviet Union to preserve democratic governments from Russian tyranny. While voting has yet to begin on their ascension, the State Department does not believe any serious opposition from other NATO members exist at this time. Concerns have been raised over potential Russian escalation in other theaters over this move, but our officials in State and Defense do not believe Russia has the full capability for proper escalation given the unrest inside Russia and the ongoing Chechen War."
 CIA_GEO.5.desc:0 "Aslan Abashidze, the leader of the Ajarian Autonomous Republic in western Georgia was assassinated earlier today. The assailant, who has been taken into custody, is supposedly a Russian living in Adjara disaffected with Abashidze's stance of neutrality in the ongoing Georgian Civil War between the Tbilisi military government and forces loyal to the recently deposed president, Zviad Gamsakhurdia. Analysts believe that this move will force Ajara to finally become involved in the nation’s civil war and side with the Zviadists. This could represent a major shift in power in the ongoing civil war and would be a boon for the Zviadist cause. Meanwhile, pro-Russian figures have alleged that they had no part in the assassination and have blamed the Central Intelligence Agency (CIA) for orchestrating the plot. These claims have largely been mocked throughout the West including in a skit on the American late night comedy sketch show, Saturday Night Live."
 CIA_GEO.6.desc:0 "Earlier today, a would-be assassin attempted to kill Aslan Abashidze, the leader of the Ajarian Autonomous Republic in western Georgia. The assailant was quickly captured and motives have yet to be fully ascertained, however a representative for Abashidze has blamed the Central Intelligence Agency and Gamsakhurdia’s forces  for the action and has pledged to reconsider Ajara’s stance in the ongoing civil war. Prior to now, the Ajaran region under Abashidze has kept the forces of both the pro-Russian military government and Gamsakhurdia exile government out of Ajara, however the autonomous region could muster enough forces to potentially tip the scales of the war in favor of either side. Washington and Gamsakhurdia have denied involvement in the attack and have alleged that the shooter is an ethnic Russian in league with the opposition. Time will tell if this will lead to the fall of the Gamsakhurdia’s forces  or simply continue the ongoing status-quo in the region."
 CIA_GEO.11.desc:0 "In a surprising move, Aslan Abashidze, the leader of the Ajarian Autonomous Republic in western Georgia has announced his intention to break Ajara’s neutrality and declare for the exile government. This comes as a major surprise given Abashidze’s long standing efforts to keep Ajara out of the civil war. The ongoing Georgian Civil War has been noted for its brutality between the forces of the Tbilisi government and that of the Russian backed opposition. Additional manpower and support from Ajara could be able to turn the tide of the conflict towards the government and represents a major setback for the opposition forces. Critics of Abashidze allege that the Central Intelligence Agency bribed Abashidze, pointing towards numerous recent American flights to Batumi. However, the United States has denied these claims and noted that the transports were simply providing much needed military and humanitarian aid to the impoverished region of Georgia."
 CIA_ETH.0.desc:0 "Since the fall of the Ethiopian monarchy in 1974 Ethiopia has been plagued by violence and a multifaceted civil war. The violence, ensuing famine and ongoing conflict in Eritrea has cost hundreds of thousands of lives and displaced millions. The civil war continues to rage, now between the governing communist military junta, the communist Tigray People's Liberation Front (TPLF) and their allies and a smattering of secessionist and other ideological militant groups. Neither of the main two factions are friendly to our interests, especially the current government which is backed by Moscow and Havana. This leaves us with several options, first we could simply continue to stick to observing the situation and consider actions later, a second option would be to seek dialogue with the TPLF and see if inroads could be made on shifting them towards a more pro-western orientation. Another option, mainly floated by those linked to the Heritage Foundation is to find those willing in the diaspora or former nobility to rally conservative elements in the nation to a new side in the conflict."
 CIA_ETH.1.desc:0 "Unfortunately, the conservative forces in Ethiopia have largely faltered and become increasingly irrelevant in recent years. Between this and the main factions in the ongoing civil war both being Marxist ideologically, the National Security Council has decided to limit our activities to solely intelligence gathering for the foreseeable future barring any notable changes in the Horn of Africa. While we avoid entanglement in any of the factions in the Ethiopian civil war or the Eritrean independence struggle, a proposal has been floated to continue escalating our support for Somalia and attempt to utilize Somalia as a proxy in the region to further destabilize Ethiopia. Unfortunately, this decision to limit our activities has been criticized by some in the media, especially those affiliated with the Heritage Foundation and others pushing for a more decisive push to oust communism from the Horn."
 CIA_ETH.2.desc:0 "The Heritage Foundation among other anti-communist policy organizations have long argued for stronger action to be taken in the Horn of Africa in terms of rolling back communism. The failure of counterrevolutionary forces in the late 1970s was a detriment to further actions in the region. However, anti-communist organizations are prevalent among the diaspora community, especially the Ethiopian People’s Democratic Alliance (EPDA) led by the Deressa brothers. The Heritage Foundation, and other hardliners have been lobbying for the administration to begin investing in this group in preparation for opening a new anti-communist struggle in the Horn of Africa. As elected officials continue to announce support and lobby with us on behalf of these \"Ethiopian Contras\". On the other hand, critics have alleged that this scheme has little evidence to point towards any popular support inside Ethiopia and has been described as overly optimistic."
 CIA_ETH.3.desc:0 "Following the overthrow of Emperor Haile Selassie, Crown Prince Asfaw Wossen and several other members of the imperial court and household fled overseas, largely to London and Washington DC. Ras Mengesha Seyoum, the hereditary prince of Tigray and head of a cadet branch of the dynasty, leader of the Ethiopian Democratic Union (EDU) and a possible claimant to the Ethiopian throne has also recently gone into exile following the military failures of the EDU. To gain legitimacy for our new Ethiopia plans we must approach both Crown Prince Asfaw and Ras Mengesha Seyoum and win their favor. Ideally, we must engage with both monarchist factions before attempting to gain support with conservative elements still residing within Ethiopia. Once we have finalized agreements with the imperial household, the CIA will begin to insert seasoned agents along with operatives recruited among the diaspora."
 CIA_ETH.4.desc:0 "With the endorsement of the imperial household and various diaspora organizations, the Central Intelligence Agency has begun to insert agents and operatives into the rural Ethiopian highlands. Our operatives, both career intelligence officers, and several recruited from the diaspora, will make contact with prominent locals, such as landholders, clergy and traditional authorities in villages to seek to recruit collaborators and potential members for the armed wing of the Ethiopian People’s Democratic Alliance. Special attention has been placed on avoiding contact with more hostile ethnic groups as well as avoiding Eritrea altogether given the ongoing independence war there against the central government, and prior to that the monarchy. Training camps have also been established in neighboring Sudan among the refugee population to further recruit potential fighters as well as serve as a staging ground for intervention."
 CIA_ETH.5.desc:0 "The Ethiopian Orthodox Tewahedo Church, the oldest continuous Church in sub-saharan Africa, founded in the early 300s is a major aspect of Ethiopian life and formerly a major pillar of support for the Ethiopian monarchy. While the Derg have worked to remove prominent anti-communists from the leading roles of the clergy, plenty of conservative clerics still practice freely, especially in rural Ethiopia. Our operatives will rally the clergy by disclosing the full details of the death of Abuna Theophilos, the second Patriarch of the Church, who was secretly executed during imprisonment in late 1979. Our operatives, inside and outside of Ethiopia, will also launch a propaganda campaign on his death to further delegitimize the Derg government, along with destabilizing the Derg appointed leadership currently in charge of the Church."
 CIA_ETH.6.desc:0 "The reactionary forces in our nation have largely been silent since the failure of the Ethiopian Democratic Union’s (EDU) offensive towards Gondar in the late 1970s. Unfortunately, this no longer seems to be the case. Our intelligence officers have recently informed us of notable growing dissent by the population towards our rule spurred on by the clergy throughout our core areas. While the EDU has largely been driven into exile and other fringe reactionary groups have limited presence at this time in our civil war, there are growing indicators of renewed enthusiasm for a restoration of the monarchy and rural resentment towards our government. While alarming, there is an upside to this development. Similar unrest has been noted to be occurring in territories held by the Tigray People's Liberation Front (TPLF). More discontent and dissent within the ranks of the opposition may give us an edge in the ongoing civil war if the right actions are taken."
 CIA_ETH.7.desc:0 "With the support from the imperial household formally established, our field agents have begun the work on integrating the remnants of the monarchist Ethiopian Democratic Union (EDU) into the Ethiopian People’s Democratic Alliance (EPDA). Once this is completed, we will begin organizing formal paramilitary units both inside Ethiopia as well as in Sudan among the refugee population. This will be in preparation of a renewed incursion by conservative forces against both the Tigray People’s Liberation Front and the Derg government with the goal of seizing Gondar, the capital of Begmender province and formally an area of support for the EDU given the number of loyalists to Ras Mengesha Seyoum in the province. Unfortunately, both the Derg and communist opposition have picked up on our renewed presence in the region and may have begun preparations for a future incursion against their forces. Thankfully, both sides show no moves towards reconciliation despite both being communist."
 CIA_ETH.8.desc:0 "Recent years have not been kind to our cause. While we had initial gains against the junta, our failure to secure any major urban center led to a rapid decline in our membership and fighting force. However, the leadership of Ras Mengesha Seyoum continues to provide our group with general legitimacy. Furthermore, the Marxist opposition to the DERG aided in pushing our forces out of most of Ethiopia. However, the United States has contacted our leadership in exile and has decided to aid in our reorganization in conjunction with the Ethiopian People’s Democratic Alliance led by the Deressa brothers. This reorganization will firmly establish a formal political doctrine for the reformed democratic movement in Ethiopia and will be heavily backed, both politically and militarily by Washington. While this will require compromise with foreign corporations and American interests it is by far our best chance to end communist rule in Ethiopia and enable our forces to return to Ethiopia."
 CIA_ETH.9.desc:0 "To the lack of surprise of many, the recent growing unrest within more conservative elements of our society and uptick of violence in the rural highlands has been followed up by a formal incursion by the Ethiopian People’s Democratic Alliance (EPDA), now also constituting of the remnants of the Ethiopian Democratic Union and support from the diaspora community and assuredly Washington. To make matters worse, the United States has now begun a bombing campaign against our military forces, along with that of the forces of the Ethiopian People's Revolutionary Democratic Front (EPDRF). This has further thrown the ongoing civil war into utter chaos as the conflict now turns into a multi-way fight between our government, the EPRDF, other ethnic secessionists and now the revitalized reactionary forces. Still, while the EPDA has managed to establish a foothold within Ethiopia, it is unclear how much public support the movement has or how it will contend with the other factions in the civil war."
 CIA_ETH.11.desc:0 "Earlier today, our contacts within the Ethiopian People’s Democratic Alliance (EPDA) reported that Addis Ababa has finally fallen to anti-regime forces. The fall of the Derg represents a watershed moment for our policy of rollback. Finally, a communist state has fallen to western-backed rebels in Africa. The EPDA has firmly committed to a restoration of the Ethiopian monarchy, however the exact claimant to be restored given the leadership of the Ethiopian Democratic Union and exile of various members of the imperial family has yet to be determined. Additionally, how the power will be broken down between the church, monarchy and the new civilian government will need to be deliberated as well along with eliminating the other Marxist groups in Ethiopia. All that said, this is a massive vindication of our administration’s policy and will surely be reflected in the polls to come."
 CIA_ETH.12.desc:0 "The Ethiopian People's Revolutionary Democratic Front (EPRDF) is the main opposition force within Ethiopia to the Derg government. The EPRDF is an alliance of four parties, the Tigray People's Liberation Front (TPLF). Southern Ethiopian People's Democratic Movement (SEPDM), Oromo People's Democratic Organization (OPDO) and the Amhara National Democratic Movement (ANDM). While Marxist in orientation, they are fighting the communist government, which is backed by Moscow and Havana. Given their opposition to a Moscow-backed government, the President has authorized the Central Intelligence Agency to seek to establish contact with the EPRDF and seek to establish formal ties with the organization and present a list of concessions that could be agreed to in exchange for our support in their ongoing war against the government. This of course, would require the EPRDF to moderate politically and make various concessions on what a post-war Ethiopian state will look like, but would assuredly provide them with significant material and humanitarian aid."
 CIA_ETH.13.desc:0 "In a surprising move, we have been approached by the Americans. The operative, reportedly from the Central Intelligence Agency informed us that Washington was open to discussing terms for supporting our movement in exchange for concessions. In exchange for concessions, we would be provided with extensive humanitarian aid along with military aid, potentially up to heavy arms and even an air campaign against the central government. However, we would be required to politically moderate and commit to dialogue with more conservative elements within Ethiopia. We would also be obliged to align with the west and re-evaluate our stance on Eritrea once the Derg is toppled. That said, we have been informed that our intentions for a more federal Ethiopia is in-line with American expectations. Accepting would surely curb our more leftist flank and goals, but could bring a quicker end to the suffering of our people and an end to the Derg government. How should we proceed?"
 CIA_ETH.14.desc:0 "Unfortunately, the Ethiopian People's Revolutionary Democratic Front (EPRDF) has rejected our terms and outreach. With this move, our efforts in Ethiopia are effectively at an end. There is no other major faction in the war, the conservative and monarchist forces have long been militarily defeated and there is little room for establishing a new armed force given the current situation on the ground. While unfortunate, the EPRDF does not seem to believe that they need our conditional support to defeat the Derg and that any concessions made to us would be detrimental for their future in a post war Ethiopia. Perhaps it is time to double down on securing Somalia. Alternatively, some in the National Security Council have proposed to outreach to the Eritrean rebels or build deeper ties in Sudan, regardless our current Ethiopian policy has resulted in a complete failure."
 CIA_ETH.15.desc:0 "The Ethiopian People's Revolutionary Democratic Front (EPRDF) has agreed to make concessions in exchange for our support. This is great news for our administration's recent policy changes in regard to the Horn of Africa. With an agreement in hand, we can now begin to provide humanitarian aid and limited weapon shipments. The Department of Defense will now begin preparing proposals for larger aid packages in the near future that will be debated within the National Security Council. With the Soviets and Cuba still backing the Derg, we now can open a new proxy front against Moscow via Ethiopia, further draining communist resources in the region. While victory is far from assured, the instability of the central government and rising public unrest in Ethiopia, along with the war in Eritrea will surely serve to weaken the Derg and eventually lead to their collapse."
 CIA_ETH.16.desc:0 "Great news has arrived, following our agreement with Washington, heavy weaponry has now begun to arrive for our fighters use. This is in addition to the initial military and humanitarian aid provided earlier. In particular, artillery, modern small arms, ammunition and anti tank and anti air weapons have all arrived recently and been deployed to the front. We expect that this uptick in modern equipment will enable our forces to counter the Soviet provided aviation and tanks provided to Ethiopia and inflict larger losses on the government's forces.While tanks and other mechanized equipment has yet to arrive, the Americans have noted the potential for this to come as well in the future depending on how effective our forces can utilize what has been sent so far."
 CIA_ETH.18.desc:0 "Now that the war comes to a close we must decide on how we will move forward with rebuilding Ethiopia. Since the initial coup in the early 1970s, Ethiopia has gone through a foreign invasion, independence struggle with Eritrea, a lengthy civil war and a significant famine have devastated the nation. With this in mind, we have the option of providing significant economic aid to the new regime, however this would be quite costly to do in full and may be a difficult sell in Congress. Alternatively, we could utilize our new connections in the Ethiopian government to push for corporate investment in the nation, this would minimize our upfront costs and would bolster our support from corporations in the next elections. That said, this move could deteriorate any goodwill we have created in Ethiopia by bringing an end to the civil war. How should we proceed?"
 CIA_ETH.19.desc:0 "Great news, the Americans have followed on their word and have begun significant efforts to stabilize our new government. Humanitarian aid has increased exponentially, alleviating the worst of the remaining symptoms from the famine earlier in the decade. Technical advisors have also arrived, aiding in establishing contracts with western companies for infrastructure projects, most notably dams and canals to bolster our agricultural sector, but also to aid in mining prospecting and industrialization schemes. Great attention has also been placed on hydroelectric dam proposals on the Nile, while in the past this would have been impossible due to foreign pressure from Egypt and Sudan, our alignment with the United States, and western investors has made this potentially possible. Overall, while American corporate influence is set to sore in the coming years, the nation is beginning to heal, and a path to a stable, prosperous Ethiopia, something impossible to imagine a short few years ago may soon be on its way."
 CIA_ETH.20.desc:0 "Now that we have fully established relations with the opposition and came to an agreement upon support and a framework for a post war future government, the time has come to take action against the central government. The Department of Defense has drawn up a plan to launch airstrikes against government forces out of our bases in the region and accompanying naval carrier strike group. The goal is to cripple the armored and mechanized equipment, fuel depots, aviation assets and elite forces of the government. Given the growing pressure on government forces, the goal is to cripple their capability for sustained conventional military actions, as well as to degrade defenses ahead of major government-held cities, especially the capital Addis Ababa. Given the length of the war, and growing equipment issues of the Ethiopian army, minimal risk to our pilots and other participating forces expected."
 CIA_ERITREA.0.desc:0 "With the fall of the Derg and our support of the victorious side we now need to determine how to proceed with the other conflicts within Ethiopia. The prime issue at this point is the ongoing Eritrean independence movement. The conflict in Eritrea precedes the rise of the Derg and civil war in Ethiopia. However, the civil war and instability of the Derg years allowed the Eritrean People's Liberation Front (EPLF) to wage a larger war of attrition and to gain control of vast swathes of the Eritrean highlands. While initially the rebels against the Derg were tacitly in cooperation with the EPLF, now that the Derg has fallen, tensions have been raised over whether or not the new government should accept Eritrean independence or wage a renewed war to hold on to Eritrea.\n\nSiding with Ethiopia would surely further strengthen our diplomatic bonds with the new Ethiopian government, but would also require our government to increase material and financial support to Addis Ababa so that such a war could be waged. Alternatively, we could pressure the new government to accept Eritrean sovereignty. This move would go a way towards showing our resolve for the cause of self-determination but could weaken the new government and could enable renewed Soviet influence in the Red Sea. How should we proceed?"
 CIA_ERITREA.1.desc:0 "After significant debate within the National Security Council (NSC), the President has decided to support Ethiopia if they desire to restore control over Eritrea. The communist Eritrean People's Liberation Front (EPLF) and its precursors have been waging a war for independence against Addis Ababa for decades, even before the rise of the Derg in the 1970s. However, the instability from the civil war and red terror enabled the EPLF to contest most of Eritrea and consolidate control over large swathes of the breakaway province. Dissenters in the NSC argued that restoring Ethiopian control over the region would be too expensive to be worth it for our government and also risked a greater humanitarian crisis in the region. However, the President has decided that the benefits of a unified Ethiopia and a full expunging of Soviet influence from the African side of the Red Sea is worth the risks. In the coming days, our ambassador to Ethiopia will meet with the interim government to lay out our position on the fate of Eritrea."
 CIA_ERITREA.2.desc:0 "After significant debate within the National Security Council, the President has decided to pressure Ethiopia to allow Eritrea to break free. While preserving the territorial integrity of Ethiopia, especially if it's under a pro-western government would be ideal, the reality on the ground is that Ethiopia lacks the manpower and capability currently to restore government control over Eritrea. Dissenters within the intelligence community have countered that our government could heavily supply Ethiopia to the point where restoring control would be possible. However, the President’s concern over creating an even more crippling humanitarian disaster in the region won out. In the coming days, our ambassador to Ethiopia will meet with the interim government to lay out our position on the fate of Eritrea."
 CIA_ERITREA.3.desc:0 "As we continue to establish our government, the Eritrea problem has become the most pressing issue at hand. The recently appointed American ambassador has informed us today that the United States would be recognizing the independence of Eritrea. The American ambassador pressed us that this was for the best for all parties and stressed that Ethiopia lacked the capacity to dismantle the Eritrean People's Liberation Front (EPLF) and that a renewed offensive in Eritrea may doom the stability of the new government. We will have little choice but to accede to the American request. While this may prove controversial among certain sections of our government, without American support we will have nowhere near enough resources to take Eritrea without immense costs to ourselves as well as creating an even larger humanitarian disaster."
 CIA_ERITREA.4.desc:0 "As we continue to establish our government, the Eritrea problem has become the most pressing issue at hand. The recently appointed American ambassador has informed us today that the United States would recognize that Eritrea is rightfully part of Ethiopia. The ambassador also noted that Washington would be willing to escalate military and financial aid in the coming fight against the Eritrean People's Liberation Front (EPLF). While our government had been debating our policy in regard to Eritrea, this provides us with a unique opportunity to preserve the territorial integrity of Ethiopia. At one point this would have been seen as an impossibility, however with American support, pushing the EPLF out of the core areas of Eritrea should be accomplishable. That said, some of our governing partners were formerly aligned with the EPLF and seeking to restore rule over Eritrea may destabilize our government. How should we proceed?"
 CIA_ETH.10.desc:0 "Following increased American support for conservative forces in the ongoing Ethiopian Civil War the United States has now launched a major air campaign against the Derg government and Tigray People's Liberation Front (TPLF) rebels. The ongoing Ethiopian Civil War is a rather unique conflict at the current time given multiple factions in the war, including the TPLF, government and the Eritrean People's Liberation Front (EPLF) all of whom oppose the other are all officially Marxist-Lenninist. Prior to the Ethiopian Revolution in 1974, Ethiopia was a key American regional ally. The civil war as per many analysts and advocacy groups gave America a way to regain influence in the region. Over the last year, Congress and the administration have supported and bolstered the Ethiopian People’s Democratic Alliance (EPDA). The EPDA, nicknamed the \"Ethiopian Contras\" by the Heritage Foundation has rapidly expanded and absorbed other smaller conservative and monarchist groups and is now actively holding territory in areas of the nation. The ongoing air campaign could prove decisive in eliminating the TPLF and government forces near monopoly on heavy weapons and complicate their logistics."
 CIA_ETH.17.desc:0 "Unsurprisingly, the United States has recognized the new Ethiopian government headed by Dereje Deressa, the general-secretary of the Ethiopian People’s Democratic Alliance (EPDA).This remarks a major turn of fortune for America in the Horn of Africa and a rapid rise to power for the Deresse brothers who run the EPDA and managed to successfully solicit American support while others failed. While the remnants of the Tigray People's Liberation Front (TPLF) are still a concern for the new government, the TPLF has rapidly lost ground due to defections and increased fighting with Eritrean People's Liberation Front (EPLF). This all said, the new government now has the difficult task of subduing the remaining rebels, dealing with the Eritrea problem and finally restoring stability and solving the humanitarian crises facing Ethiopia. That said, President [USA.GetLeader] has pledged to provide significant military, economic and humanitarian aid to the new government in the coming weeks."
 CIA_SOM.0.desc:0 "The aftermath of the Ogaden War has been largely destabilizing for Somalia. However, this destabilization and end in ties between Moscow and Mogadishu have all contributed to a rapidly deteriorating political situation within Somalia. Shortly following the war, the Somali Salvation Democratic Front was founded with the support of Ethiopia, South Yemen and Libya to oust Siad Barre from power and more open to leftist ideology and is dominated by the Majeerteen clan. Around the same time, members of the diaspora community and exiled officers also founded the Somali National Movement in Riyadh, Saudi Arabia with a support base among the Isaaq clan which is the dominant population in northern Somalia and politically is strongly anti-communist. The Somali government has only intensified the situation by collectively punishing entire clans for the perceived actions of individuals and launched clan based purges within the officer corps. While supporting the Somali Salvation Democratic Front is certainly off the table, we could inquire into supporting the Somali National Movement, continue our support for Barre or seek a more neutral course in Somalia."
 CIA_SOM.1.desc:0 "Somalia in recent years has been an ally of convenience, however the continual deteriorating situation in Somalia followed by the government's brutal crackdown has caused a re-evaluation of our support for Siad Barre’s government. The decision has been made by the President to restrict our aid to the Barre government to only humanitarian assistance. While certain factions of the opposition are more aligned with Moscow, the Barre regime has become too oppressive and unstable to continue supporting militarily. The Central Intelligence Agency has been tasked to covertly establish contact with the Somali National Movement in either their London or Riyadh offies to get a further understanding of their objectives, goals and willingness to work with us. For the time being the Ethiopian-backed Somali Salvation Democratic Front remains our prime opponent in Somalia but continued support for Barre is simply sinking money and arms into a sinking ship."
 CIA_SOM.2.desc:0 "Siad Barre’s government in Somalia has become our primary ally in the Horn of Africa following the Ogaden War and the break in relations between Somalia and the Soviet Union. While Barre has to some extent aligned with us and we have reciprocated with limited support the situation in Somalia is dire. The leading opposition movement, the Somali Salvation Democratic Front is backed by communist Ethiopia and South Yemen along with leadership compromising of the former military attache to the Soviet Union. With this in mind, the President has decided to drastically expand military aid to Mogadishu. Diplomatic pressure will be utilized on Barre privately as well to attempt to curb his regime's more vicious instincts in reprisals which are further escalating the situation. While distasteful, we can not allow the entire Horn of Africa to fall to communism."
 CIA_SOM.3.desc:0 "An interesting proposition has been relayed from Washington. The Americans have offered to provide us with extensive technical and military support in exchange for launching a renewed offensive into the Ogaden. Our prior attempt at seizing the Ogaden failed due to the overwhelming intervention 1of Soviet and Cuban forces. However, now with the Derg, Soviet and Cuban forces in Ethiopia stuck dealing with the civil war and Eritrea we have a new opportunity to try once more. Additionally, the United States is offering to provide significant material aid if we agree to this endeavor to help prevent a repeat from the prior war1. While internal unrest has been spreading within our own borders, a decisive victory over Ethiopia would surely alleviate public concern and unify the nation. However, if we were to fail once more, the consequences would be dire to say the least."
 CIA_SOM.4.desc:0 "Fortunately, the Somali government has agreed to our proposal to once again launch an offensive into the Ogaden. The goal of the offensive is to liberate the Somali people in Ethiopia and annex the Somali majority parts of Somalia into Ethiopia. While the prior Ogaden War resulted in failure due to overwhelming support from the Soviet Union and Cuba, the bitter civil war in Ethiopia should mitigate this potential given the weakened state of the Ethiopian army. If our forces are capable enough, especially with western support the Somalis could deal a fatal blow to the current Ethiopian government, potentially leading to a crippled state unable to launch a counteroffensive into the Ogaden anytime in the near future. Either way, the move will further destabilize Soviet influence in the Horn of Africa and accommodate our strategic objectives in the region."
 CIA_SOM.5.desc:0 "Unfortunately, the Somali government has informed us that they are against intervening in the Ogaden region at this time. While the Somali government noted its desire to liberate the region from Ethiopia, they noted that the domestic situation in Somalia was too poor to afford any major military actions against a foreign power, even one in such dire straits as Ethiopia is currently. The Somali government argued that the ongoing revolts against their government, especially in the Somaliland region take priority along with concerns over the state of the Somali military since the end of the Ogaden War. Per our analysts focused on the Horn of Africa, the Somali military has yet to recover from their decisive loss against Ethiopia in the prior war, nor has the government been able to restore order or public legitimacy since such a major loss."
 CIA_SOM.7.desc:0 "Great news, the Americans have seen worth in our cause and have indicated to our offices in the diaspora that they will begin sending us funding and material aid. While we have managed to make limited gains in rural areas, we have been so far unable to properly break into the wider conflict. With a reliable source of arms and funding we should be able to field a much stronger, and larger fighting force against the government and will now be able to fully break from the Tigray People's Liberation Front (TPLF) led-coalition against the Derg. While we are currently aligned with the TPLF, tensions have been fraying for years over our differing ideas on what the future of Ethiopia should entail. This has only been amplified as the TPLF has moved towards preserving the Ethiopian state. America did condition their support on this, however given such a move was already planned, this is simply expediting the inevitable."
 CIA_SOM.8.desc:0 "With the news of the Somali forces finalizing their capture of Ogaden and the recent advances of the Oromo Liberation Army, the end of a unified Ethiopia is clearly in sight. The communist factions in the core area of Ethiopia will surely keep fighting, however with the loss of Somali and Oromo areas and growing losses in Eritrea, the end of a unified Ethiopia is clearly at hand. While perhaps an unfortunate end to a once glorious state, the communist takeover of Ethiopia in the 1970s necessitated fracturing Ethiopia apart to ensure that the entire Horn of Africa does not succumb to the whims of Moscow. We will now need to develop and cultivate relations with the Oromo and continue to seek stabilizing the situation in Somalia. Hopefully, the recent victory for Somalia will stabilize the internal situation there and lead to a decrease in support for the opposition."
 CIA_SOM.10.desc:0 "Great news, the United States has informed our office in London that they have severed ties with Siad Barre’s government and will begin working with our movement. Given support for us has lagged compared to the Ethiopian, Libyan and South Yemeni backed Somali Salvation Democratic Front. Washington has relayed that our dedication to anti-communism and instituting religious law were major contributors to their decision to back our movement. While exact specifics are yet to be laid out, American as well as Saudi financing will begin shortly while potential weapon shipments may be possible in the near-future. These new resources will allow our forces in Somalia to greatly expand as well as acquire modern weaponry instead of relying on locally levied and captured equipment. Unfortunately, this does nothing at the time to end the suffering of our people as the regime attempts to wipe out our clan in Somaliland."
 CIA_SOM.11.desc:0 "The traitorous Americans have turned their backs on us and have thrown their lot in with the rebels. Our agents have informed us of American intelligence officers meeting with Somali National Movement leadership in London and Riyadh recently and now the Americans have severed diplomatic ties with our government. This is an utter disaster and cuts us off from our main backer in recent years. The sole positive, is that this move may further splinter the opposition given the ideological differences between the Somali National Movement and the Somali Salvation Democratic Front (SSDF), especially with the SSDF being backed by communist regimes and having a socialist ideology. We have little choice now but to fight to the end, defeat will surely lead to the wholesale slaughter of our own clan in retaliation for our own actions in recent years."
 CIA_SOM.12.desc:0 "Following our re-evaluation of our Somali policy and shifting towards supporting the Somali National Movement (SNM), the decision has been made to begin arming the SNM. Saudi Arabia will be utilized as the main transit hub to delivering the weaponry. This is aided by the fact that the SNM was originally founded in Riyadh and still holds offices there. Given South Yemen and Ethiopia’s support for the competing Somali Salvation Democratic Front (SSDF) we will need to ensure our agents and arms dealers understand the current boundaries in the conflict and do not mistakenly deliver weapons to the wrong factions. Still, this decision should further press the Barre regime, especially given the SNM and other opposition movements have managed to make gains even with major deficits of weaponry. Concerns have been raised that this move could further inflame clan tensions inside Somalia and that the SNM and other anti-Barre factions may seek to retaliate against the clans supporting Barre, we will need to seek to curb these impulses if we wish to ever see a stable Somalia."
 CIA_SOM.13.desc:0 "Before deciding on a firmer long term plan of action for Somalia, the President has authorized a plan to rally international support for Somalia, seeking to raise funds for the humanitarian issues plaguing the nation while also intensifying public outrage against the actions of Siad Barre’s regime. To advance this plan, the Central Intelligence Agency has established contacts within the Somali diaspora community and will be spreading the tales of their suffering and human rights abuses committed by the Barre regime to major American media conglomerates to publish. However, the presence of a communist backed faction in the conflict against Barre makes this more challenging. We will need to also frame the Somali Salvation Democratic Front negatively while glorifying the struggles of the Somali National Movement.  Once public support has been fanned against Barre, the administration can continue to debate and finalize our strategic goals and strategies for regime change in Somalia."
 CIA_SOM.14.desc:0 "After a lengthy internal debate, the President has decided on a course of limited aid to the Somali National Movement that will avoid putting American boots on the ground in Somalia. The strategic goal will be to provide limited lethal military aid as well as generous humanitarian aid to our allies within Somalia. Given the state of the rebels equipment being limited to primitive weaponry and captured government weapons, even basic lethal aid may make a major difference in the conflict and the humanitarian aid can be used to reduce suffering and provide a reason for some to defect to the rebel cause from the government in famine affected regions."
 CIA_SOM.15.desc:0 "Following our public campaign against the Somali government, the decision has been made to call for American intervention into Somalia. Our media campaign will be escalated into a higher degree by bringing on compliant journalists to further coverage of the Somali governments atrocities. Anti-communist organizations will be pressured to support the move by noting the potential for leftist opposition to topple the Barre regime instead of the anti-communist Somali National Movement. Furthermore, we will need to heavily barter with key members of Congress to get this measure through Congress. Finally, we will need to deal with the American public, while support for rebels is one thing, many Americans are still traumatized over previous interventions in recent decades. We will need to be open and clear about what our objectives are and our progression on achieving it if we wish to maintain public support."
 CIA_SOM.17.desc:0 "The preparations have been finalized and the first American troops should be currently landing in Somaliland at this moment. Our initial foray into Somaliland is expected to be successful given our allies in the Somali National Movement (SNM) currently control the vast majority of Somaliland. However, advancing outside of Somaliland will be a difficult task given the presence of the leftist Somali Salvation Democratic Front (SSDF) in nearby Puntland and Barre loyalists in the south and other warlords in the interior of Somalia. The air force, based out of nearby allied nations air bases and aircraft from a nearby carrier strike group have launched a major bombing campaign, targeting Mogadishu and the forces of the government throughout the nation while also dropping aid and small bands of agents to be embedded into allied forces in the interior of Somalia."
 CIA_SOM.19.desc:0 "The Americans have finally launched their long awaited intervention campaign in support of our cause. At this moment, American troops have begun landing in our areas of control in Somaliland and a bombing campaign against Barre’s forces has commenced. While we have concerns over other militant factions, especially the Somali Salvation Democratic Front (SSDF) in Puntland, our officers believe that allied forces should be able to quickly advance and topple Barre’s government. Concerns have been raised about the potential for the various militant factions composing both loyalists to Barre and the opposition fragmenting in the aftermath of the fall of the government, potentially leading to an even worse state of anarchy throughout the nation. We will need to ensure that a competent, legitimate government is in place as soon as possible to avoid this scenario and quickly seek to restore order throughout Somalia."
 CIA_SOM.20.desc:0 "The situation has grown desperate, the United States has landed troops on our shores, seeking to bring an end to our regime for our purported \"human rights violations\". A major bombing campaign against our government and forces has also commenced, this has already devastated our limited military capacity and has severely damaged our defenses approaching Mogadishu. Still, we must press on and continue the fight at all costs. The opposition has shown their true colors and if we fall or surrender, our people will be slaughtered to the last in retaliation for our collective punishments earlier in the decade of enemy clans. Our best chance is to attempt to hold Mogadishu and areas with popular support for Barre and seek to exploit tensions within the opposition and hope the country descends into an anarchy we can recover from after the intervention fails."
 CIA_SOM.21.desc:0 "Surprisingly, things have largely gone to plan. The American intervention was able to quickly seize control of the major population centers of Somalia and our forces were capable of rooting out the various warlords and Barre loyalists throughout the rural hinterlands. Humanitarian aid from the West and key Arab partners were able to quickly bring an end to the brewing famine throughout the nation. While pockets of resistance in remote areas continues, the situation has largely been stabilized. The United States has played a pivotal role in this. Not only were American troops the key factor in breaking Barre’s control over southern Somalia but American military and technical aid enabled our forces to quickly modernize leading to our own military successes. While economic and humanitarian issues remain, Washington, along with Riyadh has pledged significant investments to improve our situation and for the first time in decades, the future of Somalia looks bright."
 CIA_SOM.22.desc:0 "With the American-led intervention failing to stabilize the entirety of Somalia, coalition forces withdrew to Somaliland. Following this, the American’s recognized our government in Somaliland as an independent state following our own declaration of independence. Other nations' recognition of our newfound state have also poured in. However, it is unclear when the United Nations may formally recognize our state or not, or if Russia, China or another Security Council member will seek to veto our entry. While overall unfortunate that we have failed to restore order to all of Somalia, we have been able to save our own people from the ongoing chaos plaguing the rest of Somalia and can now move forward with the work of recovering from the past two decades of misrule. Washington has also pledged to provide us with significant funding that had been earmarked for humanitarian and economic aid in a post-intervention Somalia."
 CIA_SOM.25.desc:0 "In the upcoming United Nations session, the United States has signaled they will be proposing intervention into Somalia. This follows the rapidly deteriorating situation in Somalia. The brutal civil war has taken a more sinister turn as the Barre regime has begun a campaign of wholesale slaughter of clans supporting opposition factions. Most notably, the recent genocide of the Isaaq clan, resulting in over hundred-thousand deaths has rallied the international community and Somali diaspora against Barre. Furthering this now, the United States, a former backer of Barre following his falling out from Moscow in the late 1970s is now proposing intervention by the United Nations into Somalia with the goal of overthrowing the current government and installing a democratic coalition government of various opposition groups. Given the lack of international support for the Somali government, the measure is largely expected to pass. However, questions remain over which opposition group will be elevated given their differing ideologies and foreign backers."
 CIA_SOM.6.desc:0 "While the regime of Siad Barre has struggled since the failure of the initial Ogaden War, heavy American support since the start of the decade has reversed his government’s fortunes. As Ethiopia continues to deteriorate into a multiway civil war, Somalia has launched a renewed invasion of Ethiopia to seize the disputed Ogaden territory. The State Department earlier today announced that America was fully in support of the invasion and described the move as a campaign to liberate the Somali population of Ethiopia from an oppressive communist regime. Other sources have also indicated additional recent American military aid to Mogadishu to likely aid in the ongoing war. Time will tell if this invasion will be able to succeed and if it can restore the public’s faith in Barre’s regime.\n\nIn related news, Havana and Moscow have decried the move as another imperialist land grab in Africa and have pledged their support to Ethiopia."
 CIA_SOM.9.desc:0 "The onset of the Ogaden War in the 1970s led to the realignment of Somalia away from Moscow towards Washington. However, the situation in Somalia has rapidly deteriorated in the years following the Ogaden War with widespread discontent and clan-based tensions breaking out throughout the nation, especially in northern Somalia. Earlier today, President [USA.GetLeader] announced a new policy shift that would cut off support to the Somali government and shift support to the Somali National Movement (SNM). In particular, the President noted that a major driver for this move was the Barre regimes recent moves to genocide the Isaaq population and encouragement of egregious human rights abuses throughout Somalia. Additionally, the President praised the Somali National Movement’s commitment to anticommunism and compared the movement positively to the mujahideen fighting against the Soviet occupation of Afghanistan. This move has been received generally positively by the international community given the deteriorating relations between Somalia and most nations with the primary exception of Libya."
 CIA_SOM.16.desc:0 "During an interview with 60 Minutes that aired Sunday evening on CBS, President [USA.GetLeader] announced support for American intervention in the ongoing conflict in Somalia. [USA.GetLeader] argued that while the United States had in the past supported the current Somalian government that their recent actions, in particular their ongoing genocide of the Isaaq people are beyond the pale and must be stopped. Additionally, the President argued that the Somali National Movement, the main opposition faction, would establish a proper anti-communist government in Somalia that would be a bastion of freedom in a region beset by communism and chaos. Response to the announcement has been mixed to positive. Supporters of the President have pointed out that establishing a pro-American government in the Horn of Africa could be a boon for American interests on the other side, critics have alleged that invading Somalia could quickly turn into a debacle given the current state of the nation."
 CIA_SOM.18.desc:0 "Following significant debate in Congress and the Department of Defense, the United States has officially begun an armed intervention into Somalia. The stated goal of the operation is multifold. The first goal is to topple the government in Mogadishu and establish control over core urban areas in southern Somalia along with coordinating with the Somali National Movement (SNM) in northern Somalia. The second goal is to subdue the various armed factions throughout the nation and establish a coalition government headed by the SNM ahead of future elections. Already American forces have arrived in northern Somalia in territories held by the SNM and are laying siege to Mogadishu in a major amphibious operation. That said, the size and fragmented nature of Somalia will surely make this a daunting and difficult task. Time will tell if this is a turning point in the beleaguered African nation or another step in the permanent fragmentation of Somalia."
 CIA_SOM.23.desc:0 "Over the last decade the situation in Somalia has rapidly deteriorated. One of the key aspects of the ongoing situation is the Barre regimes genocide of the Isaaq clan. Due to this and a myriad of other reasons, representatives from the Isaaq, Dhulbahante, Issa, Gadabursi, Warsangali clans, as well as the Somali National Movement established an independent Somaliland comprising the territories of the former Somaliland Protectorate. The American State Department put out a statement outlining that America would be now recognizing the independence of Somaliland and would be seeking to establish ties with Hargeisa. This move has been roundly criticized by the government in Mogadishu as well as by Libyan leader [LBA.GetLeader]. This move effectively enshrines what was already obvious to many, that the idea of a united greater Somalia let alone a unified Somalia is now dead in the water."
 CIA_SOM.24.desc:0 "As the situation in Somalia continues to deteriorate, international calls for intervention to stop the ongoing genocide of the Isaaq people have increased. During a meeting at the United Nations Security Council (UNSC) the United States Ambassador to the United Nations proposed that the United Nation should intervene in Somalia to establish a temporary placeholder government in advance of elections. No serious opposition was brought against the proposal however many practical challenges remain to the proposal. In particular, as the situation in Somalia continues to deteriorate more armed factions continue to emerge as the central authority breaks down upon political and tribal boundaries. Concerns have also been brought up about how such an intervention will affect regional stability, especially with the already ongoing civil war and humanitarian crisis in neighboring Ethiopia. That said, without international intervention, the future of Somalia looks dire to say the least."
 CIA_ANG.0.desc:0 "Of all the ongoing conflicts in Africa, the Angolan Civil War is perhaps the most notable and strategically important conflict. Following the withdrawal of Portugal from their oversea colonies, the competing warring factions within Angola quickly turned upon one another, following a similar pattern throughout the independence war. Following a brief struggle in the capital, the communist, People's Movement for the Liberation of Angola (MPLA) managed to take control over the capital of Luanda, leading to a major Cuban intervention in the conflict to preserve the newfound communist central government. Our main proxy in this conflict prior had been the National Front for the Liberation of Angola (FNLA), unfortunately, the FNLA has largely ceased to exist outside of Zaire given several major setbacks and corruption issues related to the Zairean government. That said, Jonas Savimbi’s National Union for the Total Independence of Angola (UNITA) has rejected their prior Maoist stance and has become a darling of the global right. Unfortunately, Congress blocked our efforts to arm Savimbi with the passage of the Clark Amendment. Before further discussion on the Angola issue, the administration must decide whether or not to push Congress to repeal the Clark Amendment, or simply accept the will of the voters is reflected by Congress in their restriction of aid."
 CIA_ANG.1.desc:0 "After several conversations between the President and Central Intelligence Agency Director, the President has decided to abide by the terms of the Clark Amendment. While it is unfortunate that we will not be able to provide support to the anti-communist rebels in Angola, abiding by the Clark Amendment is ultimately the law and we lack the political capital necessary to make Congress budge in their opposition to repealing the amendment. Still, this is rather unfortunate and our lack of support for anti-communist guerrillas will be seen as an insult to anti-communist organizations and advocacy groups and potentially as a sign of weakness by Moscow. Several corporate representatives have also voiced their displeasure with the move given the vast natural resources present in Angola. On the other hand, the general public was and still is against getting involved in the conflict in Angola and our pivot to economic affairs will likely play well with the median voter."
 CIA_ANG.2.desc:0 "After consulting with Congressional allies, the President has decided on pushing for a full repeal of the Clark Amendment. This will be a difficult endeavor given the general opposition to our plans for Angola and the general malaise of America given our recent foreign policy misadventures. Still, combating communism in Angola is critical to our long term interests in Africa is critical for stemming the tide of communism in Africa as well as protecting another potential source of oil and other important raw materials. The Chief of Staff and other key political advisors will be deployed to Capitol Hill to negotiate with key lawmakers to advance our plans, however we will likely need to offer political concessions to gain movement on this issue.\n\nIf despite our best efforts Congress refuses to budge, we will need to consider whether or not it will be time to abandon our Angolan endeavors, or seek ways to circumvent the Congressional ban on providing aid."
 CIA_ANG.3.desc:0 "In a surprising twist of Congressional intrigue, legislation to repeal the Clark Amendment has been passed by both houses of Congress and will be appearing on the President’s desk. With this passed our administration is no longer prevented from openly using funds to bolster our allies in Angola and now have a much wider range of options for supplying Jonas Savimbi’s National Union for the Total Independence of Angola (UNITA). This is a major political victory for the administration, the repeal of the Clark Amendment was predicted as being dead on arrival by the media and political analysts. Now with momentum on our side, we need to consider what our long term strategic goals in Angola are and how we plan to accomplish them so that we can sell them to the American public in advance of more drastic actions."
 CIA_ANG.4.desc:0 "Unsurprisingly, our efforts to repeal the Clark Amendment have not borne fruit and have been an utter failure. As noted in the prior meeting, there were significant concerns over whether or not the President had enough political sway to make Congress budge on this issue. Now that it has become apparent that Congress will not repeal the Clark Amendment, the administration must decide what course of action to take next. Two options remain, the first option would be to abide by the wishes of Congress and stay away from the ongoing conflict in Angola. However, this would be damaging to our strategic goals in Africa and may endanger the security of our other regional allies, and would be conceding the natural resources of Angola to the communists. An alternative solution that has been proposed is to redirect discretionary funding in the budget to fund our Angolan operations. This would enable us to provide aid to the anti-communist forces in Angola, but is legally dubious at best. How should we proceed?"
 CIA_ANG.5.desc:0 "While unfortunate, Congress has clearly outlined their opposition to our desire to provide support to anti-communist fighters in Angola. We could search for alternative ways to go around Congress, but after a lengthy debate within the National Security Council and arguments by the White House Counsel, the decision has been made to simply abide by Congress and halt our efforts in Angola. This will be quite the controversial decision and will greatly anger hardliners in and out of the administration. This is especially true for the Heritage Foundation and other related think tanks and their associated politicians and pundits. The main concern leading the President to this decision was the counsel’s notice that going around Congress would surely be an impeachable offense and would tarnish the President’s legacy. There has been further discussion on requesting other regional security partners to increase their support for the anti-communist cause in Angola, however it is unlikely any state can match our funding and support."
 CIA_ANG.6.desc:0 "There are multiple strategic options to be considered in Angola. On one hand, completely rolling back communism from Angola would be ideal, however doing so will be a costly and difficult endeavor. Alternatively, the vast majority of oil in Angola is located in the enclave of Cabinda which has an active separatist movement already backed by France and possibly Zaire. To summarize, we have three main courses of actions to consider. Our prior course of action before the passage of the Clark Amendment was to provide arms and other forms of support to Jonas Savimbi’s National Union for the Total Independence of Angola (UNITA) but avoid putting American boots on the ground. A second option possible if we have gained Congressional support would be to effectively commit to an armed intervention in Angola to safeguard the oil in Angola. This could be done in a limited capacity, by limiting our actions to the oil rich enclave of Cabinda, or seeking to drive out communism from Angola entirely with the support of our regional allies. Either way our next step as we continue to deliberate our course of actions is to reach out to both UNITA and the Front for the Liberation of the Enclave of Cabinda (FLEC) as well as our other strategic partners involved in the region."
 CIA_ANG.7.desc:0 "After a spirited debate of the competing proposals within the National Security Council, the decision has been made to aim towards safeguarding the oil in Angola over focusing on regime change. With this decision made, we will need to decide whether or not to limit our actions to Cabinda or seek the total removal of communist influence from Angola. Both of these options have major costs and benefits. The Cabinda option would be the easiest route, communist forces are not strongly ingrained within the general population and the low population density and majority of Angolan oil being within this enclave would make it a ripe target. However this move would clearly show we have more desire to control Angola’s oil then we do to actually rollback communism. On the other hand, committing to an intervention to overthrow the communist government entirely would be a major commitment and runs the risk of the conflict turning into another Vietnam quagmire."
 CIA_ANG.8.desc:0 "Jonas Savimbi’s National Union for the Total Independence of Angola (UNITA) emerged as the main opposition to the communist government that emerged from the chaos of the Portuguese withdrawal from Angola. We have requested our contacts with Savimbi to seek Savimbi’s opinion on how best to move forward with our plans to overthrow the communists residing in Luanda. With the administration leaning towards armed intervention into Angola, securing the full cooperation of Savimbi is critical to ensure we have a stable foothold and an organization capable of quickly establishing a new credible government to restore stability to Angola. Regardless, our contacts have assured us that Savimbi will react positively to this development and will enthusiastically support an American intervention into Angola and will likely be open to making major economic concessions in a post-communist Angola in exchange for the intervention."
 CIA_ANG.9.desc:0 "After utilizing our contacts within the French security services, our operatives have managed to make contact with the leadership of the Front for the Liberation of the Enclave of Cabinda (FLEC). Henrique N'zita Tiago, the de facto leader of FLEC has been controversial within the secessionist movement due to his hardline stance of taking armed opposition against the communist government. While controversial among the movement, his aims perfectly align with our interests and is also backed by the French government and corporations. In the coming days, our operatives in the region will seek to approach Tiago with the help of our friends in Zaire and France and will proceed to determine if FLEC is the best option for this plan of action and their willingness to cooperate with our government in terms of both military action and establishing American influence in Cabinda after independence is secured."
 CIA_ANG.10.desc:0 "Besides South Africa, our other key regional partner is Zaire. Zaire has historical claims on Cabinda and would likely welcome any efforts to splinter Cabinda off from Angola. However, Zaire may later desire to draw Cabinda into its sphere of orbit or even annex the territory outright. Either way, Zaire will participate in either route we ultimately decide upon given that we are currently keeping the current government afloat as well as providing their army with nearly all their weaponry. The main concern presented within the National Security Council is that having Zaire commit to this action that the government will likely double down on their opposition to reforms which may further endanger the internal stability of Zaire. Regardless, the decision is in the hands of the Zarean government now."
 CIA_ANG.11.desc:0 "The American ambassador has relayed a proposal for us to collaborate on bolstering the Front for the Liberation of the Enclave of Cabinda (FLEC). We have long sought to bring Cabinda into our orbit, however we must ask ourselves if we are capable of conducting such an action without endangering our own internal stability as well as risking moving troops away from the Angolan border given past efforts to invade our own nation through said border. In all reality however, we have no choice but to accept the American proposal, the survival of our own regime is inherently tied to Washington, rejecting American proposals of this scale will surely lead to ramifications in terms of their economic and military support for our own government. Still, even with this simple illusion of choice, taking Cabinda from the communists will deprive the communists from controlling the vast oil reserves located there and we could one day attempt to assert our own control over Cabinda."
 CIA_ANG.12.desc:0 "The American ambassador has relayed a proposal for us to collaborate on bolstering the Front for the Liberation of the Enclave of Cabinda (FLEC). We have long sought to support FLEC and the cause of Cabindan independence. The vast oil reserves of Cabinda could be a massive windfall if we are able to secure rights for our corporations to develop oil projects. Now Washington seeks to do the same and has offered us terms for us to collaborate in supporting Cabindan independence. The Americans have signaled their openness to splitting up oil rights for both French and American conglomerates, still this would in-effect concede the political future of Cabinda to Washington. Additionally, the Americans are proposing open military intervention into Cabinda, a move which would surely be unpopular and controversial among a swath of the electorate. How should we proceed?"
 CIA_ANG.13.desc:0 "The French government has responded positively to our plan to pursue an independent Cabinda. Given that France was already providing limited support to the separatists in the region, this endorsement comes as little surprise. Their willingness to align with our objectives signals a strengthening of our partnership and a shared commitment to promoting self-determination for the people of Cabinda. \n\nThis collaboration offers us a valuable opportunity to enhance our efforts in the region, leveraging French resources and influence to bolster the separatist movement. With France on board, we can expand our initiatives, including military support, diplomatic advocacy, and humanitarian aid, to ensure the success of the independence movement. \n\nWe should take this momentum to further engage other potential allies, framing the quest for Cabinda’s independence as not only a local struggle but also a vital issue of regional stability. By solidifying international backing, we can strengthen our position and increase pressure on the MPLA, paving the way for a successful outcome in Cabinda."
 CIA_ANG.14.desc:0 "Surprisingly, the French government has declined our proposal to cooperate in bolstering the secessionist forces in Cabinda. This decision is disheartening, especially given the strategic importance of Cabinda in our efforts to counter the MPLA and strengthen our position in the region. \n\nFrance's refusal to engage raises questions about their commitment to supporting liberation movements in Africa and may indicate a desire to maintain a neutral stance amid the ongoing conflict. Their withdrawal from this potential partnership limits our options and complicates our strategy in Cabinda, where local support is crucial for any successful initiative. \n\nIn light of this setback, we must reassess our approach and explore alternative avenues for support. Engaging with other potential allies and reassessing our resources will be essential to ensure that the secessionist forces remain viable. We should also work to communicate the importance of Cabinda's autonomy to the international community, framing it as a vital issue of self-determination that deserves attention and support."
 CIA_ANG.15.desc:0 "The American ambassador has conveyed an important proposal regarding the ongoing civil war in Angola. The United States is eager to coordinate efforts with our government  to combat the rising influence of communist forces within the country and strengthen the military and political position of Jonas Savimbi and his faction, the National Union for the Total Independence of Angola (UNITA). \n\nThis initiative highlights the need for a unified strategy that aligns our resources and intelligence to effectively counter the MPLA and its allies. By supporting UNITA, we can help establish a stronger front against communist approachment on our borders, fostering a more favorable balance of power in the region. \n\nThe proposal also outlines a framework for ongoing dialogue and assistance, including military training and logistical support for Savimbi’s forces. Taking decisive action now could not only help thwart communism in Angola but also pave the way for a more stable and democratic future for the Angolan people."
 CIA_ANG.16.desc:0 "Our ambassador in South Africa has reported that Pretoria has agreed to collaborate on our plans to coordinate actions in Angola. This partnership is a significant development, as it underscores a shared commitment to countering the influence of communist forces in the region. \n\nBy aligning our strategies, we can strengthen our efforts to support Jonas Savimbi and his faction, the National Union for the Total Independence of Angola (UNITA). This collaboration will enable us to pool resources and intelligence, enhancing our operational effectiveness on the ground. \n\nSouth Africa’s participation is crucial in establishing a united front against the MPLA and its allies. Together, we can implement a comprehensive approach that not only bolsters military efforts but also lays the groundwork for political stability in Angola. This alliance represents a critical step toward achieving a more secure and democratic future for the Angolan people, aligning our mutual interests in regional security and stability."
 CIA_ANG.17.desc:0 "Our ambassador in South Africa has communicated that Pretoria has politely declined our offer to assist with operations in Angola. This response indicates a cautious approach on their part, reflecting their own strategic priorities and concerns regarding involvement in the ongoing conflict. \n\nWhile this decision is disappointing, it highlights the complexities of the situation in the region. South Africa may be weighing the potential risks associated with deeper engagement in Angola, particularly in light of the ongoing civil war and the delicate balance of power. \n\nMoving forward, we will need to reassess our strategy and explore alternative avenues for support. This may involve strengthening our own efforts to bolster Jonas Savimbi and UNITA independently or seeking partnerships with other nations that share our goals. Maintaining open lines of communication with South Africa remains crucial, as their perspective and influence in the region will be valuable as we navigate this challenging landscape."
 CIA_ANG.18.desc:0 "The various parties active in Angola have provided us with a unique opportunity amidst the chaos of the conflict. Recognizing the need for effective aerial support, we have mobilized our loyal Cuban exile pilots to conduct bombing operations from Zairean air bases. This initiative not only enhances our capacity to combat the communists in Angola but also strategically positions us to influence the outcome of the conflict. \n\nBy utilizing these skilled pilots, we can deliver targeted airstrikes against MPLA forces, thereby supporting our allies, including Jonas Savimbi’s UNITA. This approach allows us to maintain plausible deniability while simultaneously increasing pressure on the communist factions. \n\nAdditionally, these operations serve to showcase our commitment to fighting communism in the region, potentially rallying further support from local and international allies. As we continue to navigate this complex landscape, leveraging this opportunity will be crucial in shaping the future of Angola and reinforcing our strategic interests in southern Africa."
 CIA_ANG.19.desc:0 "Recently, it has come to light that several airstrikes impacting our forces on the frontlines and critical logistics hubs were likely conducted by the Central Intelligence Agency (CIA), utilizing shell companies operating out of Zaire. This revelation underscores the lengths to which external forces are willing to go to undermine our government and disrupt our operations. \n\nThese covert actions not only jeopardize the safety of our troops but also threaten the stability we are striving to maintain in Angola. The involvement of the CIA highlights the broader geopolitical struggle at play, as imperialist powers seek to impose their will on our sovereignty and derail our revolutionary efforts. \n\nAs we assess the implications of these airstrikes, it is essential to fortify our defenses and enhance our counterintelligence measures. We must also work to expose these tactics to the international community, framing them as violations of sovereignty and a blatant disregard for the principles of self-determination. By doing so, we can rally support for our cause and reinforce our commitment to resisting external aggression."
 CIA_ANG.20.desc:0 "In our attempts to bolster the anti-communist forces in Angola, one of the most crucial nations involved is South Africa. Given its geographic proximity and historical ties to the region, South Africa plays a pivotal role in supporting the National Union for the Total Independence of Angola (UNITA) and other factions opposing the MPLA. \n\nSouth Africa’s military and logistical capabilities can significantly enhance the effectiveness of our efforts. Collaborating with South African forces allows for coordinated operations that can better disrupt MPLA supply lines and strengthen the resolve of local anti-communist groups. Additionally, South Africa's involvement lends credibility to our cause, showcasing a united front against communist expansion in southern Africa. \n\nHowever, we must also be aware of the apartheid-related concerns that accompany our partnership. South Africa's domestic policies and its treatment of its own Black population could provoke backlash both at home and internationally. Supporting an anti-communist agenda could inadvertently draw criticism toward our involvement with a regime that is often seen as oppressive. Navigating these concerns is essential to maintain our credibility and ensure that our actions in Angola do not inadvertently tarnish our reputation on the global stage. \n\nUltimately, strengthening our alliance with South Africa is essential for successfully advancing our anti-communist objectives in Angola. By fostering this cooperation, we can increase our impact in the region and work toward a more stable and democratic future for Angola while being mindful of the broader implications of our partnership."
 CIA_ANG.21.desc:0 "The American ambassador has relayed a missive from Washington, expressing the U.S. desire for us to launch a renewed ground intervention into Angola to combat the communist forces present. This request brings to mind our previous involvement in Operation Savannah, where we sought to counter MPLA influence but faced significant challenges and mixed outcomes. \n\nWhile supporting U.S. efforts against communism could strengthen our alliance and enhance our regional influence, we must carefully consider the implications of a renewed military campaign. Operation Savannah taught us valuable lessons about the complexities of intervention, including the risks of prolonged conflict and the potential backlash from local populations and neighboring countries. \n\nMoreover, the political climate at home must be factored into our decision. Public support for military interventions can fluctuate, and we need to ensure that our actions resonate with our voters’ concerns and aspirations. Engaging in another operation could lead to heightened scrutiny and debate over our foreign policy priorities. \n\nAs we deliberate on this request, it is crucial to assess both the strategic advantages and the potential repercussions of renewed involvement in Angola. Our decision should prioritize stability and security in southern Africa while learning from the experiences of Operation Savannah to guide our future actions."
 CIA_ANG.22.desc:0 "Our ambassador in Pretoria has informed the Secretary of State that South Africa has readily agreed to our proposed intervention plans in Angola. This enthusiastic response is a significant development in our efforts to bolster anti-communist forces in the region. \n\nSouth Africa’s commitment to our intervention plans not only enhances our military capabilities but also reinforces our strategic alliance. Their support will provide us with critical logistical resources and local intelligence, making our operations more effective in countering the MPLA and its Cuban allies. \n\nMoreover, this collaboration signals a united front against communism, potentially galvanizing other regional partners to join our cause. However, we must remain cognizant of the domestic implications of our partnership with South Africa, particularly regarding its apartheid policies, as this could attract international scrutiny. \n\nOverall, this agreement lays a strong foundation for our intervention, allowing us to move forward with greater confidence and a shared objective of stabilizing Angola and curbing communist influence in southern Africa."
 CIA_ANG.23.desc:0 "Our ambassador in Pretoria has relayed to the Secretary of State that South Africa has reluctantly declined our offer of collaboration in launching an intervention into Angola. This response is disappointing, as South Africa's involvement was seen as crucial to bolstering anti-communist efforts in the region. \n\nThe reluctance from Pretoria may stem from various internal and external pressures, including concerns about the potential fallout from such an intervention and the scrutiny of their domestic policies. While South Africa has historically supported anti-communist initiatives, the complexities of the Angolan conflict may have prompted them to tread carefully this time. \n\nThis decline forces us to reassess our strategy moving forward. We must explore alternative partnerships and seek other regional allies who may be willing to engage in support of our objectives. Additionally, we should remain attentive to the evolving political landscape in South Africa, as shifting dynamics could open new opportunities for collaboration in the future. \n\nOverall, while this setback is significant, it also presents us with a chance to adapt our approach and continue working towards stabilizing Angola without compromising our broader strategic interests."
 CIA_ANG.25.desc:0 "Evidence has surfaced from our local allies and South Africa alleging that Cuba has utilized chemical warfare to support the People's Movement for the Liberation of Angola (MPLA) against Jonas Savimbi’s anti-communist National Union for the Total Independence of Angola (UNITA). This development presents a powerful opportunity for us to leverage these allegations as propaganda to undermine Cuban and MPLA credibility on the global stage. \n\nBy highlighting these accusations, we can draw attention to the unethical tactics employed by Cuba, positioning them as a threat not only to Angola but also to humanitarian values. This narrative can galvanize international outrage and foster greater support for UNITA, framing their struggle as a fight against a regime willing to resort to inhumane methods. \n\nWe should work to disseminate this information widely, using media channels and diplomatic avenues to ensure it reaches key stakeholders and the public. By framing the conflict in this light, we can strengthen our stance against communist influence in the region and rally support for our allies, ultimately reinforcing our broader geopolitical objectives."
 CIA_ANG.26.desc:0 "As  we lay further groundwork for intervention in Angola, we are currently issuing a demand for Cuba to withdraw its forces to mitigate the risk of further escalation with the Soviet Union. The ongoing presence of Cuban troops supporting the MPLA poses a direct challenge to our strategic objectives and increases the potential for direct confrontation. \n\nTo ensure the effectiveness of this demand, we need to adopt a comprehensive strategy that combines diplomatic pressure and economic incentives. Engaging with allies and countries that hold sway over Cuba will be vital in reinforcing our position. We can also leverage international platforms to highlight the implications of Cuba’s involvement, increasing scrutiny and fostering diplomatic isolation. \n\nMoreover, we should consider implementing economic measures, such as targeted sanctions, that could impact Cuba’s interests and encourage compliance with our demand. By framing their military presence in Angola as a threat to regional stability, we can strengthen our case for their withdrawal and reduce the likelihood of broader conflict with Soviet forces. Acting swiftly and decisively is essential to protect our strategic interests in southern Africa."
 CIA_ANG.27.desc:0 "The American government has issued a public declaration demanding our unconditional withdrawal from Angola. This aggressive demand places us at a critical crossroads. We must weigh our options carefully, considering both the implications of compliance and the potential consequences of defiance. \n\nOn one hand, acquiescing to this demand could lead to a withdrawal from a region where we have invested significant resources and support for the MPLA. It would signal to our allies that we are easily swayed by external pressures, undermining our credibility and influence in the region. \n\nOn the other hand, maintaining our presence in Angola reaffirms our commitment to support the legitimate government facing aggression. It allows us to continue our efforts to counter American influence and uphold the principles of sovereignty and self-determination. \n\nUltimately, we must decide whether to stand firm against this pressure or to seek a diplomatic solution that safeguards our interests while addressing the concerns of the international community. This choice will define our role in Angola and shape our future relationships in the region."
 CIA_ANG.28.desc:0 "Great news: the Cuban forces have begun a general withdrawal from Angola. This development marks a significant turning point in the conflict and opens up new possibilities for stabilizing the region. The withdrawal is a testament to the effectiveness of our diplomatic efforts and the mounting pressure we have exerted both publicly and privately. \n\nWith Cuban troops retreating, we can expect a shift in the balance of power that may favor the MPLA’s opposition. This creates an opportunity for us to enhance our support for local forces, particularly Jonas Savimbi’s UNITA, and to solidify our strategic interests in Angola. \n\nWe must capitalize on this momentum by coordinating with our allies and ensuring that our resources are aligned to maximize the impact of this change. As we move forward, it will be crucial to monitor the situation closely and adapt our strategies to maintain stability and prevent any resurgence of conflict. This withdrawal could be the first step toward a more peaceful and democratic future for Angola."
 CIA_ANG.29.desc:0 "Despite  our public and private demands, as well as threats, Havana has remained defiant in its refusal to withdraw its troops from Angola. This unwavering stance not only complicates our strategic objectives but also escalates tensions in the region. \n\nCuba’s continued military presence serves as a direct challenge to our influence and undermines our efforts to support the MPLA’s opposition. Their refusal to comply reveals a disregard for the growing international pressure and highlights their commitment to maintaining a foothold in Angola. \n\nIn response, we must reassess our tactics. Intensifying diplomatic efforts with allies and leveraging economic sanctions may be necessary to coerce a change in Cuba’s position. Additionally, we should focus on rallying international support to isolate Havana, framing their actions as a violation of Angolan sovereignty. This defiance cannot go unchallenged, and a unified response will be crucial in safeguarding our interests and promoting stability in the region."
 CIA_ANG.33.desc:0 "The time has come to launch Operation Angolan Freedom. Our forces have been strategically positioned alongside our regional partners to initiate a concerted push to seize Luanda and other critical coastal areas. This operation is designed to deliver a decisive blow to the communist People's Movement for the Liberation of Angola (MPLA) and to bolster our allies in Jonas Savimbi’s National Union for the Total Independence of Angola (UNITA). \n\nAs we embark on this mission, it is essential to recognize the stakes involved. Securing Luanda will not only disrupt the MPLA's command structure but also empower UNITA, giving them the momentum needed to galvanize support among the Angolan populace. Our coordinated efforts aim to create a unified front against communism, reinforcing our commitment to democracy and stability in the region. \n\nDomestically, the launch of this operation will require clear communication to the American public and Congress about our objectives and the importance of this intervention. Successfully executing Operation Angolan Freedom can serve to strengthen our position in southern Africa and affirm our role as a leader in the global fight against communism. As we move forward, careful planning and execution will be crucial to achieving our goals and ensuring a brighter future for Angola."
 CIA_ANG.35.desc:0 "When the Americans threatened to invade Angola and demanded our withdrawal, we concluded that this was merely a bluff aimed at forcing us to abandon our support for the MPLA. Unfortunately, we were mistaken; the launch of \"Operation Angolan Freedom\" has proven that their resolve is genuine. \n\nThis military intervention is a significant escalation that directly threatens not only our presence in Angola but also the sovereignty of the Angolan people. The United States is attempting to reverse the gains we have made in supporting the MPLA, and it is crucial that we respond decisively. \n\nWe must rally our allies and strengthen our support for the Angolan government to counter this aggression. The stakes are high; failure to act could embolden further American interventions in the region and jeopardize our efforts to uphold revolutionary movements. This moment demands unity and determination as we defend Angola against external imperialist forces seeking to impose their will."
 CIA_ANG.36.desc:0 "Our endeavor in Angola has rapidly turned into an embarrassing failure, highlighting the challenges of our intervention. Despite our initial expectations, we have utterly failed to displace the communist People's Movement for the Liberation of Angola (MPLA) government, which continues to maintain its grip on power. \n\nThe inability to achieve our strategic objectives has not only diminished our credibility in the region but also raised serious questions about our approach to the conflict. The MPLA's resilience in the face of our efforts has allowed it to regroup and counter our advances effectively, complicating the situation further. \n\nDomestically, this failure could have significant political consequences. Public opinion is likely to shift against continued military involvement, leading to increased pressure from Congress to reconsider our foreign policy strategies. Lawmakers may call for accountability, questioning the decisions that led to this intervention and demanding transparency regarding our objectives. As political leaders face mounting scrutiny, the administration must navigate these challenges carefully to maintain public support and credibility on the international stage. Ultimately, the need for a comprehensive and effective response has never been more urgent."
 CIA_ANG.37.desc:0 "Operation Freedom has been a resounding success, marking a significant turning point in the ongoing conflict. The rapid fall of Luanda and other key urban areas has severely crippled the MPLA government’s ability to mobilize its forces and effectively counter our advance or that of Jonas Savimbi’s troops in southern Angola. \n\nThis swift takeover not only disrupted the government’s command and control but has also created a power vacuum that Savimbi’s forces are poised to exploit. The momentum gained from these critical victories has bolstered morale among our allies and UNITA, fostering greater cooperation and coordination on the ground. \n\nAs we assess the implications of this success, it’s essential to consolidate our gains and ensure that the transition in these areas supports long-term stability and governance. Continued collaboration with Savimbi and his faction will be vital in securing a favorable outcome and laying the groundwork for a more democratic and prosperous future for Angola."
 CIA_ANG.38.desc:0 "With communism defeated in Angola, the hard questions now begin, particularly regarding how we should aid in the reconstruction of the country. While the victory against the MPLA marks a significant milestone, the path forward requires careful consideration and strategic planning to ensure a sustainable recovery. \n\nOne of the main challenges will be determining the best methods for providing assistance, whether through financial aid, infrastructure rebuilding, or supporting governance reforms. Engaging with local leaders and communities will be crucial to understanding their needs and ensuring that our efforts are both effective and welcomed. \n\nAdditionally, we must consider the geopolitical implications of our involvement. How we approach reconstruction could influence our relationships with neighboring countries and impact the stability of the region. Domestically, the administration will need to communicate the importance of this investment to Congress and the American public, emphasizing that aiding Angola’s recovery is essential for long-term security and countering any resurgence of communist influence. Ultimately, the decisions made now will shape the future of Angola and our role in fostering peace and stability in southern Africa."
 CIA_ANG.39.desc:0 "The fall of communism in Angola is a watershed moment in our fight against communist expansion. This significant reversal of a major communist revolution not only halts the spread of communism in southern Africa but actively shifts the tide in our favor. The successful ousting of the MPLA government strengthens our position in the region and alleviates pressure on South Africa, which has faced ongoing threats from communist movements. \n\nThis development has far-reaching implications for our foreign policy and security strategies. A unified front against communism in Angola enhances our credibility with allies and underscores our commitment to supporting democratic movements. It may also inspire similar uprisings in neighboring countries, further destabilizing communist influence across the region. \n\nDomestically, this victory could bolster support for the administration's foreign policy initiatives and reinvigorate public confidence in our role as a global leader against communism. As we celebrate this achievement, it’s essential to leverage this momentum to ensure lasting stability and security in southern Africa."
 CIA_ANG.40.desc:0 "While there has been indications of chemical warfare usage in other areas of Angola, there has not been any confirmations or even really rumors of their usage in Cabinda. However, we need to generate controversy to justify our upcoming intervention in Cabinda. Reports have circulated that either Cuban or People's Movement for the Liberation of Angola (MPLA) forces have utilized chemical warfare against the anti-communist rebels in southern Angola. With this in mind, our CIA propaganda and media specialists have been tasked with taking these stories and finding material in relation to them to spin about how the MPLA utilizes barbaric actions to repress their own population, further inflaming public anger against the communists and establishing a casus belli for launching an intervention to liberate the people of Cabinda, and more importantly secure the vast oil reserves off the Cabindan coast."
 CIA_ANG.42.desc:0 "As a prelude to our intervention, we need to soften up fortifications in the enclave. Thankfully, government forces have been slow to heavily deploy or fortify the region and there is a broad lack of anti-aircraft installations in Cabinda. With that in mind, the Central Intelligence Agency (CIA) has deployed multiple squadrons of older aircraft using shell companies to Zaire which will be piloted by Cuban exile pilots. These unofficial squadrons will seek to destroy government positions and deliver supplies to the Front for the Liberation of the Enclave of Cabinda (FLEC) forces operating in the region. The Zairean government has approved the operation and given the ongoing series of events and tensions between Zaire and Angola provides us with plausible deniability when it comes to these strikes. This argument is bolstered even more given the large number of mercenaries employed by the Zairean state."
 CIA_ANG.43.desc:0 "A strange set of occurrences has recently begun in the enclave of Cabinda. While guerilla fighters launching sporadic attacks on garrisons have been relatively normal, there have recently been several airstrikes on our facilities and remote positions. Rumors have circulated about increased foreign intelligence activity in the region as well. Our agents in Zaire have reported that Cuban exiles contracted by an unknown party, with Zairean permission are the ones launching the strikes in Cabinda. Our limited capacity to defend the area from aerial attacks is of increasing concern given these activities. Still, while redirecting forces to ensure order is maintained in Cabinda would be ideal, such a move would alleviate pressure on UNITA and may lead to a rapid deterioration in the front, along with giving South Africa an opportunity to make a move. For now we must execute caution and surveil the region for other hostile actions by the imperialists."
 CIA_ANG.44.desc:0 "Now that preparations have been finalized, our forces have launched Operation Cabindan Freedom. Given how Cabinda is isolated from the rest of Angola and has a limited garrison with minimal foreign support, the expectation is that this operation will quickly come to a conclusion. In the coming hours our forces will launch a multipronged assault on the region in conjunction with our local allies within the Cabindan independence movement and support from Zaire and other regional allies. Limited reports have indicated a potential recent buildup of government forces along with their foreign backers in the enclave which has the potential of complicating the operation. Regardless, with our naval and aerial supremacy we should be able to decimate any sustained resistance and cut off any logistical routes being utilized by the communists."
 CIA_ANG.45.desc:0 "The Americans, and other allies have launched an intervention, called \"Operation Cabindan Freedom\" to liberate the Cabinda enclave from the communist government of Angola. As discussed prior, our forces have also been committed and have begun securing the interior of Cabinda are should currently be overrunning government border guards throughout the enclave. Given our longstanding support for the Cabindan separatists, the potential success of this operation may be a boon for our nation both in terms of expanding our own sphere of influence, providing more economic outlets and most of all by weakening our communist enemies in Angola. Still, we should remain vigilant and make sure that the communists do not seek to stage another invasion into Katanga or other regions of our nation, especially with such a large number of our troops currently being committed to the Cabindan operation."
 CIA_ANG.47.desc:0 "Well to the dismay of the general public, our intervention in Cabinda has been an utter disaster. In a short statement today, the Defense Department acknowledged the withdrawal of American forces from the enclave. This disaster will surely cause a major decline in our approval numbers and endanger our party’s future electoral successes in the ensuing election cycles. Still, this could have been worse, especially if we had committed to fully ousting communism from Angola. At least we now have detailed information on where the military needs to improve and how our strategic partners in the region need to make significant reforms to their intelligence and military apparatus to avoid such future mistakes from recurring in the future.\n\nIn other news, the Heritage Foundation and other anti-communist think tanks have called on primary challenges to supporters of our administration as a result of our failure to finish the job in Cabinda."
 CIA_ANG.48.desc:0 "The swift victory of our forces in Cabinda has been a major press relations victory and resulted in a notable bump in our approval ratings. Now that victory is at hand, the time has come to establish a new government formally in Cabinda. Henrique N'zita Tiago has been pronounced as the President of Cabinda, while Tiago has remained controversial, our siding with his faction of FLEC however has given him credibility. Our analysts in the CIA and State Department now expect the separatist cause to finally fully fracture and for new political parties to be established. While this scenario may be a cause for alarm to some, the anti-communist bent of the broad separatist cause and their prior opposition to the communist government should ensure that none of the new major political parties will be communist in nature or a general threat to our influence in Cabinda."
 CIA_ANG.50.desc:0 "Jonas Savimbi’s National Union for the Total Independence of Angola (UNITA) may have started off as Maoist-aligned ideologically, however the party has rapidly moderated in an effort to gain international attention and has managed to rally the large Ovimbundu population to their cause against the communist government. If we wish to secure the vast natural resource reserves in Angola, including untold quantities of oil, diamonds and other minerals, UNITA would be the best option. With the downfall of the National Liberation Front of Angola (FNLA) and schisms within the Cabindan secessionist movement, Savimbi’s forces have become our only true alternative in combating the communist government of Angola. On the positive side, Savimbi has come out as a highly charismatic figure, managing to rally swathes of the Angolan population to his cause while also showing competency at handling western media."
 CIA_ANG.51.desc:0 "One tool at our disposal we have yet to deliver in significant amounts to our allies in Angola, is land mines, both of the anti-tank and anti-personnel variety. Landmines, especially anti-personnel landmines are a rather controversial weapon and their provision to the organizations we are backing can be a rather sensitive issue to the general American public. However, the usage of landmines in the various bush wars of southern Africa have shown them to be incredibly potent in their usage against enemies with heavier weaponry. This has been especially shown in South West Africa in the ongoing conflict between the South African government and the South West Africa People's Organization (SWAPO). After a lengthy review by our analysts within the Defense Department and Central Intelligence Agency the decision has been made by the President to begin shipping vast quantities of landmines to UNITA forces in Angola. Notably, South Africa has protested this move and has raised concerns over the mines being potentially given or captured by SWAPO forces given the rather complex relationship between SWAPO, UNITA and the MPLA government of Angola."
 CIA_ANG.52.desc:0 "Recently our officers have begun noticing a trend of reports from the field of heavy usage of mines by the enemy. Several patrols and multiple vehicles have run afoul of mines while pursuing leads of enemy bases in remote areas. On further inspection as well as reports from our intelligence officers have provided evidence that the mines struck were not simply mistakenly placed mines by our own forces, but western-provided landmines to UNITA. This is a major complication for our planned avenues of attack and efforts to secure rural areas loyal to Savimbi outside of the core UNITA held lands. Given the lack of infrastructure and remote location of rebel forces and strongholds, our advances to these areas are likely to become inundated with anti-personnel and anti-vehicle mines. Our own forces, and that of our allies in Namibia have utilized similar tactics to harry South African forces, now the same tactic is being utilized against our own forces."
 CIA_ANG.53.desc:0 "As the populace and Congress remains ambivalent at best towards the Angolan conflict, our political advisors have devised the idea of inviting opposition leader Jonas Savimbi to the White House to formally meet the President and consult with Congressional leaders and allies. We will be using this meeting to reaffirm our public and private support for combating communism within Angola and further pressuring Congress to take action to support the anti-communist rebels in Angola and call for a withdrawal of foreign communist forces from Angola. As we continue to debate our strategic goals in Angola, we should also ascertain Dr. Savimbi’s intention into whether his goal has shifted to a national reconciliation and free elections between his own party and the communist People's Movement for the Liberation of Angola (MPLA) or if the goal remains to take over the nation by force and expel communist influence from Angola."
 CIA_ANG.54.desc:0 "The Americans are increasing their push to convince their populace to back our cause and are seeking to increase Congressional support for us. In the spirit of this endeavor, American President [USA.GetLeader] has invited Jonas Savimbi to the White House along with potentially addressing the American Congress. Naturally, we will be accepting this proposal. This is an exceptional opportunity to sell our cause to the American public and rally international support for our cause. We must expend every possible avenue during this visit to build deeper ties with key American leaders and seek to address anti-communist influence groups to encourage greater official American sanction to provide our forces with more and heavier weaponry so we can continue to fight the communist usurpers in Luanda. "
 CIA_ANG.56.desc:0 "Earlier today we were informed by our CIA contacts that Washington desires for us to participate in peace talks which would be organized by America As public interest in our struggle wanes, we must recognize the critical nature of this moment in shaping our future strategy. While engaging in dialogue could provide a platform to advocate for our vision of a democratic Angola, we must weigh the potential risks and benefits.\n\nParticipating in these talks raises important questions about our commitment to genuine national reconciliation versus our determination to remove communist influence through stronger means. We need to assess whether these discussions would truly advance our goals or merely serve to legitimize the MPLA's position. Ultimately, our decision must reflect our dedication to achieving a stable and democratic Angola, while remaining resolute against external pressures that could undermine our objectives and compromise our mission."
 CIA_ANG.57.desc:0 "In a notable development, UNITA has signaled its readiness to engage in American-backed peace talks regarding the ongoing conflict in Angola. This shift comes at a crucial time when public interest in the Angolan conflict is waning, and our administration recognizes the importance of seizing this moment to reaffirm our commitment to combating communism in the region. Engaging with UNITA offers a strategic opportunity not only to support anti-communist forces but also to gather intelligence on Jonas Savimbi's long-term intentions for Angola’s political landscape.\n\nThis engagement will allow us to advocate for a resolution that fosters peace and stability in Angola, aligning our efforts with broader geopolitical goals. By reinforcing our political support for UNITA, we can strengthen our position in the region while pressing for policies that ensure our strategic interests are effectively prioritized and advanced."
 CIA_ANG.58.desc:0 "In a notable development, UNITA has signaled their rejection of American-backed peace talks regarding the ongoing conflict in Angola. This decision comes at a crucial time when public interest in the Angolan conflict is waning, prompting our administration to reassess our strategy in the region. UNITA’s refusal to engage limits our ability to support anti-communist forces and undermines our efforts to promote stability in Angola.\n\nThis setback raises questions about Jonas Savimbi's long-term intentions for Angola’s political landscape and complicates our approach to policy in the region. Without a dialogue, we face increased challenges in rallying Congressional support for initiatives aimed at fostering peace and countering communist influence. As we navigate this development, it becomes imperative to explore alternative strategies that align with our geopolitical goals, ensuring that our commitment to promoting democracy and stability in Angola remains a priority amidst these complexities."
 CIA_ANG.59.desc:0 "As the war in Angola continues to devolve into a bloody stalemate, calls have been growing for a ceasefire and negotiated settlement to the conflict to be brokered by the major powers. This topic was broached between UNITA leader Jonas Savimbi and the President during Savimbi’s recent visit to the White House to rally public support for his cause. After further discussions, Savimbi has signaled his openness to negotiate with the People's Movement for the Liberation of Angola (MPLA). Still, it is unclear whether or not MPLA leadership has support for a ceasefire, let alone how Havana and Moscow, the backers of the MPLA, feel about potential negotiations given the large amounts of support and manpower Cuba has sent to Angola to bolster the MPLA. Now we await a response from Luanada and to see whether or not negotiations will begin in earnest."
 CIA_ANG.60.desc:0 "The communist government of Angola, the People's Movement for the Liberation of Angola (MPLA), has agreed to our calls for peace talks with Jonas Savimbi’s National Union for the Total Independence of Angola (UNITA). This decision marks a significant turning point in the protracted conflict that has plagued the nation, signaling a potential willingness to explore diplomatic solutions amid ongoing pressures both domestically and internationally.\n\n Recognizing the urgent need for stability and the growing costs of continued warfare, the MPLA seeks to engage in discussions that could pave the way for a ceasefire and pave the path toward reconciliation. This initiative aligns with our strategic interests in the region, as fostering dialogue may help mitigate the influence of external actors and prevent further escalation of violence.\n\nAs the MPLA enters these talks, we will closely monitor their commitment to genuine negotiation. The success of this dialogue will hinge on the MPLA’s ability to address UNITA's demands for greater political representation and a commitment to democratic processes. By supporting this initiative, we hope to promote a peaceful resolution that honors the aspirations of the Angolan people while safeguarding our anti-communist objectives in the region."
 CIA_ANG.61.desc:0 "The communist government of Angola, the People's Movement for the Liberation of Angola (MPLA), has rejected calls for peace talks with Jonas Savimbi’s National Union for the Total Independence of Angola (UNITA). This decision reflects the MPLA's determination to maintain its stance against what it views as a fragmented opposition and a threat to its governance. \n\nBy refusing to engage in dialogue, the MPLA signals its commitment to continuing military efforts to solidify its control over the country. The leadership believes that negotiating with UNITA could undermine their authority and embolden rebel forces, complicating efforts to restore stability in Angola. \n\nAs tensions persist, the MPLA is prepared to withstand both domestic dissent and international pressure, prioritizing its agenda over potential compromises. This stance not only underscores the complexities of the conflict but also raises concerns about the ongoing humanitarian impact on the Angolan populace, as the prospect of a peaceful resolution continues to fade."
 CIA_ANG.63.desc:0 "The communist government of Angola, the People's Movement for the Liberation of Angola (MPLA), has officially begun peace talks with Jonas Savimbi’s National Union for the Total Independence of Angola (UNITA). This development marks a crucial moment in the protracted conflict, as both sides come together with the aim of finding common ground. \n\nFor the MPLA, engaging in these negotiations reflects a recognition of the urgent need for stability and the potential benefits of diplomacy over continued warfare. The talks provide an opportunity to address key issues, including a possible ceasefire and necessary political reforms that could enhance governance and public trust. \n\nUNITA, for its part, sees this as a vital opportunity to advocate for its political aspirations and secure greater representation. As discussions proceed, both parties will need to navigate their differences while working toward a collaborative solution. The success of this initiative will ultimately depend on their willingness to compromise, striving for a peaceful resolution that meets the hopes of the Angolan people."
 CIA_ANG.64.desc:0 "With  the conflict in Angola effectively deadlocked and neither side making any significant gains in recent months, our leading diplomats have concluded that a practical approach is necessary to move forward. In light of the stalemate, it has become increasingly clear that a ceasefire is essential to prevent further devastation and loss of life. After careful consideration, our diplomats recommend establishing a coalition government led by the People's Movement for the Liberation of Angola (MPLA). \n\nThis proposal aims to create a more inclusive political framework that acknowledges the complex dynamics at play in Angola. By allowing the MPLA to take the lead, we can facilitate a transition that promotes stability while also incorporating representatives from opposing factions, including UNITA. This coalition could pave the way for essential reforms and rebuild trust among the population, ultimately fostering an environment conducive to long-term peace and recovery in Angola."
 CIA_ANG.65.desc:0 "With the recent successful advances of Savimbi’s forces leading up to the newly declared ceasefire, our negotiators in the State Department have initiated plans to advocate for a unity coalition government. This coalition is envisioned to be led by Jonas Savimbi, alongside other prominent members of the National Union for the Total Independence of Angola (UNITA). \n\nRecognizing the shifting balance of power, our team believes that positioning Savimbi at the helm of this coalition could foster a more inclusive political landscape and facilitate lasting peace in Angola. Drafting these plans aims to capitalize on the momentum created by UNITA's recent gains, emphasizing the importance of a collaborative approach that includes diverse political voices. \n\nIf negotiations progress toward a peaceful resolution, this coalition could serve as a foundation for critical reforms and stability, ultimately addressing the aspirations of the Angolan people and laying the groundwork for a brighter future."
 CIA_ANG.68.desc:0 "As support for the National Union for the Total Independence of Angola (UNITA) grows, the time is ripe to push Savimbi’s forces to launch a renewed push to Luanda and begin offensive actions.Our operatives in Angola will be informing UNITA command and Jonas Savimbi of our need to see credible progress in pushing towards ousting the communist government in Luanda to justify our continued escalated support for their organization. The CIA has also been instructed to increase the presence of our covert forces in the nation to further degrade the rear capabilities of the People's Movement for the Liberation of Angola (MPLA) forces and degrade their logistical networks in the Angolan countryside. A successful operation would be a boon for our foreign policy credentials and would justify to the American public our more escalatory policies in regard to combating the threat of international communism."
 CIA_ANG.69.desc:0 "With the support of heavy American weaponry and support from other regional powers, the time is now per the Central Intelligence Agency to make a push on Luanda. This will be a hard fought battle, but the increased American military assistance and advisors has led to a major increase in our fighting capabilities and the other allies of the MPLA have suffered extensive casualties with our newfound heavy weaponry. If we can breakthrough the frontline we should be able to make rapid gains throughout the nation. The end goal of this offensive is to take Luanda, that said, our CIA handlers have noted that simply encroaching on Luanda or laying siege to it and other major urban areas would be enough to be considered a success and would lead to additional American military aid to solidify our new positions and continue pressing the communist government."
 CIA_ANG.70.desc:0 "Now that Angola has been stabilized and communist influence has been eradicated, the time has come to reap the rewards of such a land rich in natural resources. The new government has granted permitting and resource rights to a variety of American corporations, already economists have estimated that this will lead to major windfalls for American corporations and will in the long term aid in stabilizing oil prices in the west given the ongoing development projects to develop Angola’s massive potential for a petrochemical industry. Critics have alleged that we are simply acting as a neocolonial power, replacing Portuguese and South African rule for that of our own puppets, yet the rapid development of Angola will surely lead to an increase in living standards and provide employment opportunities for the masses."
 CIA_ANG.71.desc:0 "Well now that we have managed to expunge communist influence and stabilize the nation, a rush of foreign investment has come to the nation in the form of American corporations seeking to establish new operations, especially in regard to mining and oil refining. Given the vast destruction the country has suffered throughout the independence and subsequent civil war, the investment is much needed and welcome. The investment will also necessitate major investments in our national infrastructure. These measures are likely to bolster our popular support and further erode any support remaining for the communists to the fringes of society.\n\nThat said, we must be sure to avoid falling into the trap of the resource curse and seek to modernize other aspects of our nation and eventually diversify our economy away from purely resource extraction. Still for now, this is a massive boon for our recently reunified nation."
 CIA_ANG.72.desc:0 "Our covert relations with South Africa have long been known to Washington. With that in mind, the American ambassador has presented us with a proposal. The fundamentals of the offer is that we would act as an intermediary for American weaponry to reach the forces of anti-communist rebels in Angola in exchange for further military assistance and American gratitude. Opposition to supporting anti-communist rebels in Angola has hobbled the President’s agenda to push back against the expansion of communism in Africa. The offer carries little cost and risks for our nation, already we have covert ties with several anti-communist groups in southern Africa along with being on friendly terms with Pretoria, however if news of this ever broke, it could damage relations with future American administrations. How should we proceed?"
 CIA_ANG.73.desc:0 "Our ambassador to Israel has relayed back that Israel has agreed to our proposal for Israel to act as a middleman to transfer American weaponry to anti-communist forces in Angola. This is great news and finally provides us with an alternate route to begin pushing back against communism in Angola. Soon arms will be rapidly distributed to Savimbi’s forces and other allied militias within Angola and the surrounding area. Furthermore, Israel has also noted their willingness to further coordinate efforts in regard to South Africa and handling negotiations within the region at a later date. Still, we must ensure that Congress, and the general public remain ignorant of this arrangement given the dubious legality of this entire scheme."
 CIA_ANG.74.desc:0 "Our ambassador to Israel has relayed back that Israel has confirmed that they have no intention to ferry American weaponry to Angola to circumvent our own laws. This is rather surprising given the strong ties between Israel and South Africa and their general willingness to be a proxy for our arms campaigns in other nations. Still, the White House Chief Counsel has expressed relief over the matter being rejected, citing that the proposal was still likely illegal in the first place and a gross violation of the Clark Amendment. Unfortunately, this does mean that either Congress must take action on the Clark Amendment, or that we consider other, certainly illegal strategies to back the anti-communist forces in Angola."
 CIA_ANG.75.desc:0 "Our combat operations against the People's Movement for the Liberation of Angola (MPLA) and their Cuban allies has proven to be quite costly in terms of material. Thankfully, recently deliveries have begun arriving of American weaponry via Israeli intelligence. While the American Congress had blocked the President from directly supporting our cause with material aid, it would appear that Washington has found another avenue to deliver supplies to our fighters. With renewed support, we should certainly have the capability to hold our current territory and begin drafting plans for counter-offensives in the future. Hopefully decisive military actions on our own part will spur greater support within the United States and eventually lead to even more lethal aid, especially in terms of heavy equipment that could be used to counter the Cuban forces."
 CIA_ANG.24.desc:0 "Following increasing tensions between the various parties involved in the Angolan Civil War, South Africa has once again launched an armed intervention into Angola. Pretoria earlier in the conflict launched a failed attempt to seize Luanda in coordination with Zaire and Zairean aligned rebel forces. Cuba has strongly condemned the move as another escalation by a racist, imperialist power that needs consigned to the ashes of history. Similar rhetoric has been echoed by other African leftwing leaders and movements. The broader international community and Anti-Apartheid movement also slammed Pretoria for their renewed armed intervention into Angola and repeated calls for both sides to disengage and seek diplomacy. On the other side, the United States has declined to comment on the ongoing operation, sparking rumors of American collaboration with South Africa over the intervention."
 CIA_ANG.30.desc:0 "Cuban leader [CUB.GetLeader] in a fiery address in Havana today denounced the American demands for Cuba to withdraw their forces from Angola. [CUB.GetLeader] doubled down on their prior rhetoric that the United States is simply acting in the interest of corporate powers seeking to take Angola’s oil for the benefit of the imperialist powers. Since the start of the Angolan Civil War, Cuba has sent tens of thousands of soldiers to Angola in an effort to prop up the People's Movement for the Liberation of Angola (MPLA) government of Angola over that of their armed rivels, in particular National Union for the Total Independence of Angola (UNITA), led by prominent guerilla leader Jonas Savimbi. Given the increasing likelihood of overt American intervention into Angola, one must now wonder how this move by Cuba will impact potential American intervention or incur escalation from Havana and Moscow."
 CIA_ANG.31.desc:0 "In a surprising move, Cuban leader [CUB.GetLeader] announced the withdrawal of Cuban forces from Angola. This comes in light of the American demands for Cuban forces to leave the country or face dire consequences in Angola and in Cuba. Prior to the end of the Angolan Independence War and start of the Angolan Civil War, the communist People's Movement for the Liberation of Angola (MPLA) was in a tenuous spot and besieged by all sides by domestic and foreign enemies. The intervention of Cuban forces was decisive in enabling the MPLA to secure the capital of Luanda and establish themselves as the legitimate government as well as preventing a joint campaign by South Africa and Zaire from seizing control of the nation. The departure of Cuban forces from Angola is a major blow to the MPLA and will surely weaken their grip on power throughout the nation in advance of potential American intervention."
 CIA_ANG.32.desc:0 "Following a stretch of American diplomatic efforts to influence the ongoing conflict in Angola, American President [USA.GetLeader] announced today the formation of a \"Coalition of the Willing\" to intervene in Angola. While several American allies in the region, most notably Zaire and South Africa, have echoed American claims of chemical weapon usage by Cuban and government forces in Angola against the forces of the National Union for the Total Independence of Angola rebel movement, but have been denied by Cuba and the Soviet Union. Angolan leader [ANG.GetLeader] has rejected these claims as well but has yet to allow international observers to assess the claims. Closer to home, the American public has responded favorably to the announcement but has met scrutiny through vast swathes of the international community. Time will tell if any of America’s NATO allies join the upcoming Angolan operation, that said the days of a communist Angola may very well be limited."
 CIA_ANG.34.desc:0 "The Pentagon has announced the commencement of Operation Angolan Freedom. While the United States is spearheading the operation, various American regional allies have declared their support and participation in the operation in support of Jonas Savimbi’s National Union for the Total Independence of Angola (UNITA). That said, international condemnation has come in from the Soviet Union, East Germany, Non-Aligned Movement and most vocally, Cuban leader [CUB.GetLeader]. While not directly involved in the operation, South Africa has come out praising the move as a return to sanity and a decisive decision in containing the communist influence in southern Africa. Time will tell how this move affects stability throughout the region as long as how this impacts the South African Border War between South Africa and the South West Africa People's Organisation (SWAPO), which is largely based out of southern Angola."
 CIA_ANG.41.desc:0 "In a controversial press conference today, American President [USA.GetLeader] alleged that the People's Movement for the Liberation of Angola (MPLA) and Cuban forces in Angola have utilized chemical weapons against Cabindan separatist forces in the oil-rich exclave of Angola. The MPLA government of Angola, Cuba and the Soviet Union have all denounced the announcement as that of colonialist propaganda while South Africa, Zaire and other western-friendly governments in Africa have published statements in support of the claims. All of this comes as the United States has allegedly expanded intelligence operations in Angola and a notably increase in calls for Cabindan independence from various international activist groups. This set of actions has also brought up serious questions over whether or not military action will be taken in Cabinda by the United States or other American regional allies in the region, especially Zaire."
 CIA_ANG.46.desc:0 "The Pentagon has announced the commencement of Operation Cabindan Freedom. The goal of the operation per a Pentagon spokesperson is to establish an independent government in the exclave and transfer political leadership to the local oppressed population. Luis Ranque Franque, the leader of the separatist Front for the Liberation of the Enclave of Cabinda (FLEC) has announced his organization's strong support and cooperation with the American intervention. Already reports have come in of a rout of Cuban and Angolan forces from the exclave as well as the FLEC seizing control of several villages in the interior of Cabinda. The Soviet Union has condemned the move as another example of American colonialism but has not shown any interest in open retaliation for the intervention."
 CIA_ANG.49.desc:0 "American President [USA.GetLeader] during a visit to the capital of the newly independent Cabinda, Cabinda met with Front for the Liberation of the Enclave of Cabinda (FLEC) leader Luis Ranque Franque where the pair announced the formal establishment of the Republic of Cabinda with Franque as the President of the newly recognized republic. While Cabindan nationalists had declared independence with Franque as President before, this recognizes the first time that an international power has formally legitimize their rule over the small African state. France, South Africa and Zaire have also sent dignitaries to Cabinda to establish diplomatic relations as well as potential trade ties. Rumors abound already of American and French oil corporations looking to establish a presence in Cabinda."
 CIA_ANG.55.desc:0 "Following an invitation from President [USA.GetLeader], Jonas Savimbi, leader of National Union for the Total Independence of Angola (UNITA) and noted rebel leader in Angola has arrived in Washington DC. Savimb’s tour of the American capital and meeting with the President is aimed at increasing the legitimacy and support for UNITA while the civil war continues to rage on in Angola. UNITA controls a large swathe of Angola, especially in the southeastern section of the beleaguered African nation. UNITA has been locked into struggle with the governing People's Movement for the Liberation of Angola (MPLA) and their Cuban allies since the end of the Angolan Independence War against Portugal in the early 1970s. President [USA.GetLeader] has been a strong supporter of Savimbi’s UNITA and has been calling on Congress to increase military aid to the guerrilla force and the meeting with Savimbi is clearly aimed at pressuring Congress into increasing funding."
 CIA_ANG.62.desc:0 "Following intensive international pressure campaigns and coercion by Washington, both the People's Movement for the Liberation of Angola (MPLA) and the National Union for the Total Independence of Angola (UNITA) led by famous guerilla fighter Jonas Savimbi have agreed to peace talks to bring about an end to the Angolan Civil War. This is a major victory for diplomacy and for the foreign policy of President [USA.GetLeader]. UNITA accepting peace talks was not a surprising move given Wasington’s support for the group, however the MPLA agreeing does come to a major surprise not only to the broader international community but to the MPLA’s stalwart ally Cuba who was apparently not informed in advance of the agreement to cease hostilities. That said, the future of Angola remains uncertain and whether this becomes a pivotal moment for the peace process in southern Africa or simply a temporary ceasefire in the decades long conflict remains to be seen."
 CIA_ANG.66.desc:0 "Following lengthy peace talks between the People's Movement for the Liberation of Angola (MPLA) and the National Union for the Total Independence of Angola (UNITA) as well as national elections, it has been agreed that the MPLA will lead a national coalition government for the next several years while the nation establishes a new constitution and electoral system. With this the MPLA has finally formally established international legitimacy and should dissuade further support for armed conflict in the nation. However, UNITA leader Jonas Savimbi has yet to formally comment on the new MPLA-led government, whether this represents a true start to Angolan democracy or a return to armed conflict or autocracy has yet to be seen."
 CIA_ANG.67.desc:0 "Following lengthy peace talks between the People's Movement for the Liberation of Angola (MPLA) and the National Union for the Total Independence of Angola (UNITA) as well as national elections, it has been agreed that UNITA will lead a national coalition government for the next several years while the nation establishes a new constitution and electoral system. With this, Jonas Savimbi’s long quest for power in Angola has come to a surprisingly successful conclusion. The new government has ordered the Cuban forces in the country along with advisors from East Germany and the Soviet Union to evacuate the country immediately. Whether this and the more hardliner MPLA membership accepts the new UNITA-led coalition government has yet to be seen. That said, this could finally bring an end to the decades long conflict in Angola."
 CIA_SAF80.0.desc:0 "South Africa has long been our key strategic partner in combating communism in southern Africa. Unfortunately, their continued practice of Apartheid has made our support for South Africa difficult and controversial to say the least. Even worse is that the policy has actively caused widespread resistance against the South African government. If this was not bad enough, the opposition in South Africa is heavily influenced by communists, especially in the African National Congress (ANC) and their allies in the South African Communist Party (SACP). It remains critical for our cause that South Africa remains an influential anti-communist power in the region and can counteract the rising tide of communism in southern Africa. However, we need to also balance the concerns at home, and among our allies that South Africa has the potential to reform along with also finding a way forward on the other, less known controversial South African issue, their expansive weapons of mass destruction program."
 CIA_SAF80.1.desc:0 "As our intelligence apparatus takes a more cautious stance on South Africa, our administration has decided that more attention needs to be placed on keeping track of the South African weapons of mass destruction program. Our sources have indicated that South Africa, in addition to its covert nuclear weapons program, also has significant stores of chemical and possibly biological weapons. Given the nature of the government, and growing instability and possibly desperation of the government, we must ensure that we know the location of the facilities and storage to ensure that in the worst case scenarios we have the capability of securing the sites prior to their capture by the opposition or usage by the government in certain scenarios. Allowing South Africa to deploy nuclear weapons, even in a more controlled environment would be detrimental to regional stability and needs to be investigated further."
 CIA_SAF80.2.desc:0 "The Boland Amendment has long been a major obstacle for the administration’s foreign policy objectives. Our administration has been seeking alternative paths to funding the Contras, especially as Congress refuses to budge on our calls to repeal the Boland Amendment. A new proposal, championed by some in the intelligence agencies is to request South Africa help train and equip the Contras in exchange for our continued support for their regime despite the ongoing international outcry and sanction efforts over Apartheid. Legal concerns have been raised over this proposal, along with others noting moral concerns over deepening our ties with Pretoria and in essence giving them leverage over our government. However, this could be an effective way to provide support to the Contras, if South Africa accepts while technically respecting the Boland Amendment. That said, the public would not take well to this deal if it were to come to light. How should we proceed on sending the offer?"
 CIA_SAF80.3.desc:0 "An interesting proposal has reached our attention earlier today from the American ambassador. The ambassador noted that supporting South Africa was domestically and internationally controversial for the United States, but that this is not their only controversial cause. The discussion shifted into comparing our struggle against communism to the Contras of Nicaragua. Ultimately, the proposal is that in exchange for our aid in supplying and training the Contra fighters, that the United States would seek to further undermine the embargo in place against us and would escalate their attempts in the United Nations to defend our regime as well as covertly provide needed ammunition, fuel and dual use equipment. The plan supposedly is legal, while that is of minimal concern for us, the whims of the American public are. By accepting this proposal we would surely be giving up fairly little in exchange for support, however, if the current administration falls and this scheme comes to light would likely lead to harsher sanctions being imposed on our economy. How should we proceed?"
 CIA_SAF80.4.desc:0 "South Africa has agreed to our proposal of increased cooperation in exchange for their support training and arming the Contras. While expressing concern over how such a move will be taken by the international community when it is inevitably revealed, Pretoria expressed gratitude for the opportunity and noted that they will immediately begin drafting plans on how to properly exfiltrate, infiltrate and train Contra units in insurgency tactics. Given South Africa’s impressive history in counter-insurgency warfare, this should provide the Contras with credible trainers as well as a direct logistic route for weaponry and support and the ideological alignment of both will help to ensure that this relationship does not break down in the imminent future. Now we will have to keep our end of the bargain and work towards weakening the South African sanction efforts and provide South Africa with further military assistance."
 CIA_SAF80.5.desc:0 "Unfortunately South Africa has rejected our Contra proposal. While the South Africans noted that they appreciated the offer, they believed the offer would be too controversial if unveiled to the American public and would further endanger support for their government by future American administrations. Concern was also raised over the legality of the move given American law and given the strong current ties between Pretoria and Washington, concerns were raised over further straining ties. Overall, this entire scheme was effectively a long shot, we will need to either consider dropping support for the Contras or seeking other alternative funding schemes. A recent proposal did note the potential for selling arms to Iran and then to use those funds to equip the Contras after all. Perhaps this is an avenue worth exploring in the near future as well."
 CIA_SAF80.6.desc:0 "Following the South African agreement to bolster the Contras, the administration has begun planning on how to further undermine the South African embargo. To accomplish this, we are actively seeking to pressure sanction and boycott groups via the legal process, while a bill is unlikely to pass Congress on this, the administration has leveraged our connections with various state legislators to penalize groups calling for such measures. Additionally, we have taken steps to encourage corporate investment in South Africa and will be launching a pressure campaign against European nations targeting the South African economy. Our allies in Congress also plan to amend the upcoming farm and appropriation bills to include funding and exemption for efforts to establish stronger trade ties with South Africa. All of these measures should serve to undermine the South African embargo and global sanction movement while avoiding infringing on any American laws or overly perturbing Congress."
 CIA_SAF80.7.desc:0 "The United States has kept their end of the bargain and has launched efforts to circumvent the international embargo efforts against us. Various measures have been taken. Quite notably the administration has taken drastic actions against domestic dissidents who are targeting our state, even petitioning for outlawing organizing boycott efforts and encouraging American corporations to invest in us. While America’s reach to impact other nations enforcing embargos is limited, Washington has launched a soft campaign against the effort and is seeking allies to work with on the issue. Still, the weakening of private American efforts to instate sanctions and boycotts has already resulted in a small economic bump and our economists predict that this and the accompanying aid promised in upcoming legislation will help revitalize our sanction plagued economy."
 CIA_SAF80.9.desc:0 "Following public backlash to our support of South Africa during their intervention in Angola earlier in the 1970s and the ongoing issue of Apartheid, overt military equipment transfers to South Africa is not possible at the current time. However, the administration has decided on a course of action to supply South Africa with older equipment models through intermediaries at discounted proceeds. While this is dubious legally, we will utilize retired military and intelligence figures who are aligned with the administration to work as intermediaries with the South Africans and seek to reroute the proceeds to other causes that Congress refuses to put funding towards despite our repeated requests. That said, we must aim to keep this covert as possible given not only domestic concerns but also the geopolitical backlash such a revelation would cause."
 CIA_SAF80.10.desc:0 "As our support for South Africa becomes increasingly controversial it is more important now than ever to keep tabs on, and consider suppressing the anti-Apartheid movement, especially in Europe. To accomplish this, the Central Intelligence Agency, in collaboration with our supporters in Western Europe will seek to collect incriminating information and intimidate leading activists into compliance and seek to spread misinformation throughout the movement to cause infighting. Given the intersectionality of the movement with other leftist causes, playing up ideological differences and escalating tensions over gender and sexuality issues may also prove fruitful. Concerningly, not only is the general public against South Africa in these nations against South Africa, but also supporting the African National Congress (ANC), often financially as well, notably Sweden which is a key leader in the anti-Apartheid movement with the government openly funding the ANC."
 CIA_SAF80.11.desc:0 "Olof Palme, the Prime Minister of Sweden, has long been a thorn in our side in regard to our strategic goals in South Africa. With his undisputed popularity in Sweden, Palme is unlikely to step down from office anytime soon. To make matters worse than Palme’s public speeches against Apartheid and our policies in regard to South Africa, Sweden under Palme has become one of the main financiers of the African National Congress (ANC). Given the harm done by him to our strategic goals in Africa, the decision has been made to remove Palme from the board altogether. Our local collaborators will surveil Palme when he next goes out without security and gun him down while quickly exfiltrating from the situation to avoid any traces of our involvement. Thankfully, Palme’s security detail is incredibly lax and notably regularly goes out with his wife without any bodyguards present. "
 CIA_SAF80.12.desc:0 "Our efforts to find funding for South Africa, the Contras and other controversial causes that Congress refuses to fund has taken our administration to some questionable places. Likely no one expected going into this administration that we would be forced to have the Central Intelligence Agency (CIA) sell crack and other drugs in minority areas to fund South Africa and the Contras, yet here we are. Thankfully, the media has had little idea of this occurring, outside of fringe claims by conspiracy theorists that we are selling crack fuelling the drug crisis in inner cities. Our latest round of proceeds will be used to help fund the South African army’s efforts to restore order in Southwest Africa, otherwise known as Namibia and push out the Angolan, Cuban and Namibian insurgents occupying parts of the region. Our recent drug efforts have proven even more profitable since South Africa has aided in supporting the Contras. The Contras becoming a stronger force has led to increased drug traffic between Nicaragua and the United States furthering our funding objectives. That said, the Drug Enforcement Agency (DEA) is at its wits end over the influx of drugs after several close calls between DEA agents investigating in-disguise CIA operatives smuggling drugs."
 CIA_SAF80.13.desc:0 "For years we have covertly collaborated with South Africa, especially on the intelligence front. Given how reliable Pretoria has been in recent years in working with our government in containing communism in sub-Saharan Africa, the decision has been made to intensify intelligence collaboration with South Africa. For years, we have withheld information about various dissidents and certain regional figures, details and other intelligence that past administrations were concerned over how South Africa would utilize the data. Given the growing threat in the region of communism and South Africa’s closer working relationship with us, this is no longer seen as a justified reason to withhold intelligence information. A joint training program to aid in the refinement of the elite black operations forces of South Africa has also been authorized with the goal of bolstering South African efforts in Southwest Africa and Angola in combating the People's Movement for the Liberation of Angola (MPLA) and South West Africa People's Organisation (SWAPO)."
 CIA_SAF80.14.desc:0 "While unsavory to say the least the South African government represents the last bastion of anti-communism in southern Africa. The South African government's decision to deepen collaboration with their support of the Contras represented a major milestone in our relations with Pretoria. South Africa becoming more fully aligned with our interests led to our administration doubling down on supporting South Africa, providing extensive economic and military assistance to the internationally besieged government. While politically controversial, the decision to bolster Pretoria has paid dividends in terms of progress in meeting our strategic goals in Africa and Latin America. That said, issues remain, especially how to proceed on dealing with the South African nuclear program as well as further dealing with the international anti-Apartheid movement.. Still the specter of communism is still prevalent over South Africa and more aid will be needed to ensure the regime's survival."
 CIA_SAF80.15.desc:0 "For years now we have been aware that Pretoria has a surprisingly well developed weapons of mass destruction program, including a well funded nuclear component. While this is concerning to many, the President has decided on a course of aiding South Africa with this program. While many would normally balk at such a decision, the National Security Council ultimately agreed that being able to monitor and deter the more concerning aspects of the South African chemical and biological warfare programs as well as ensuring that nuclear devices and material are properly handled outweigh the risks of the program itself. That said, the proposal has been placed under the highest levels of confidentiality, if the public found out about this, the ramifications would be catastrophic to put it mildly. If South Africa accepts, we will help Pretoria refine their nuclear program, in exchange we will dictate them to dismantle aspects of their chemical and biological warfare programs and establish our own security personalities in their nuclear sites."
 CIA_SAF80.16.desc:0 "Another interesting offer has come from the Americans. This time, the American ambassador relayed that Washington was aware of our nuclear, biological and chemical warfare program and while expressing limited concern over the biological and chemical elements was more or less on board with the nuclear program and is offering to aid in our endeavors. In particular, the United States is offering to bolster our nuclear program with the sharing of limited amounts of technical and research information as well as help in securing the nuclear sites to avoid any terrorist actions targeting the sites. However, in doing so we would be subject to American oversight of our weapons program and would give up most of our discretion in what programs are being developed and invested into and would likely need to dismantle some of our more drastic biological weapons programs that were planned for a worst case scenario. "
 CIA_SAF80.17.desc:0 "The South African government has informed our ambassador that they will accept our proposal in regard to their weapons of mass destruction program. While hesitant to agree to the concessions laid out, especially with the dismantling of parts of the chemical and biological warfare program, the technical and security aid related to the nuclear program and aid in keeping the existence of the program out of the public spotlight was seen as worth the concessions. Now comes the hard part, actually ensuring South Africa follows through with their word and providing enough technical aid to keep South Africa in-line while also avoiding a serious escalation of their nuclear program. This will surely be a difficult task and will also need to be kept at the most classified of levels given how politically delicate this agreement inherently is. Still, this represents a strategic victory for our South African policy of bringing Pretoria closer into our orbit."
 CIA_SAF80.18.desc:0 "The South African government has informed our ambassador that they will reject our proposal in regard to their weapons of mass destruction program. The response noted that while they found the proposal intriguing and that they appreciated the vast amount of support our administration has given to South Africa that they did not find the concessions to be worth the cooperation on the nuclear program. Our analysts also believe that the move was partly fuelled by a desire by the South African government to avoid becoming even more reliant on our support and the potential for us to use the cooperation as leverage to force future concessions on their government. While unfortunate, we must now move on and ensure that the traces of the offer are properly discarded and consider other options in dealing with the South African nuclear program while maintaining our overall strategic goals in the region."
 CIA_SAF80.19.desc:0 "Our administration has greatly expanded our support for South Africa. That said, certain actions taken by Pretoria have gone too far and need to be reigned in accordingly. Reports indicate that South Africa likely has already the ability to create working nuclear devices and probably has manufactured a handful of them. In addition the chemical and biological warfare programs of South Africa are extensive and represent a threat to regional and global stability, especially given the overall tensions and instability in South Africa. The President, in accordance with the National Security Council, has decided to pressure South Africa to abandon their nuclear ambitions and utilize our support for their government in recent years as leverage to push on the issue. However, if our bluff is called we will have little actual options to follow through on our threats given how pivotal South Africa is to our regional strategic goals and objectives."
 CIA_SAF80.20.desc:0 "The Americans have apparently learned more about our nuclear weapons program then we had initially expected. While we were aware that they knew of it, we were unaware of their knowledge of the full extent of our capabilities. The American ambassador today has relayed a request from Washington to abandon our nuclear pursuits and dismantle our current inventory of nuclear devices. The ambassador also relayed concerns that the continuation of the nuclear program may lead to the complete severance of ties between Washington and Pretoria if Congress learns of the existence of the program. This puts our government in quite the bind. On one hand, we have invested extensive resources into the program and view it as one of the final tools in deterring a potential civil war or foreign invasion. On the other, losing American support may doom our government and people. How should we proceed?"
 CIA_SAF80.21.desc:0 "Thankfully, our ambassador in Pretoria has informed us that the South African government has agreed to suspend their nuclear weapons program. This is a major victory for our administration’s South Africa policy. While the general public will not be made aware of the existence, or termination of the South African nuclear program, we can rest assured that our policy of constructive engagement with Pretoria is paying off. Unfortunately, if the public was aware of the South African nuclear program we would be pressured even harder to crackdown on South Africa and cut all ties. As this remains unacceptable to our strategic goals in the region we must ensure that all traces related to the program are properly covered and hidden from the public and journalists."
 CIA_SAF80.22.desc:0 "Unfortunately, our ambassador in Pretoria has informed us that the South African government has refused to suspend their nuclear weapons program. This is disastrous news for the administration's foreign policy and now puts us in an even worse situation in regard to South Africa. The fall of the current regime in Pretoria would likely lead to at the least, a pro-Soviet government in South Africa, representing the full fall of southern Africa to communism and the potential compromising of a key international shipping route around the Cape of Good Hope. How to proceed here will be a difficult choice. Two main schools of thought have emerged within the National Security Council. One faction has argued to further pressure Pretoria by threatening to leak the existence of the program to the media, while another has argued to leave the program alone and continue our current policy in regard to South Africa."
 CIA_SAF80.23.desc:0 "South Africa is rich in a variety of natural resources, especially in precious metals, uranium and others. However, South Africa heavily relies on imports of oil. The sanctions have had a negative impact on the South African economy, however the resources available within South Africa have managed to alleviate some of the worst potential effects. However, the reduction in oil imports due to the sanctions has presented a challenge to both the South African economy and even more critically, the South African military. To counter this issue, the President has authorized the partial release of our strategic oil reserves along with cooperating with friendly oil producing regimes and corporations to evade the sanction effort on South Africa to provide Pretoria with a steady stream of oil and natural gas."
 CIA_SAF80.24.desc:0 "Great news has arrived from Washington. President [USA.GetLeader] has decided that further strengthening our economy in light of global sanctions is a high priority. In light of this strategic shift, we have been informed that the United States will covertly ensure our continued access to oil imports via intermediaries. The lack of oil and gas has increasingly become one of the larger concerns for our economy in light of global sanctions and deteriorating ties with the Arab World. While this is perhaps not a permanent solution, it does give our government further time to figure out a way forward as well as further insulate our economy against further sanction efforts. However, we must remember that this policy is tied to the whims of the American government, and any shift in American politics could bring an end to this program."
 CIA_SAF80.100.desc:0 "South Africa has long been a contentious issue given their Apartheid policies being geopolitically toxic while also being the last major anti-communist government in southern Africa. After contentious debate, the President has decided for now at least, that the security apparatus should refrain from actively inflaming the situation further or showing a clear preference to either side within South Africa. However, the President has authorized the continuation of activities monitoring communists, especially leading members of the South African Communist Party (SACP) and suspected Soviet and Cuban agents within South Africa. More hardline members in the intelligence services have notably bristled at the announcement and have argued that this is simply allowing greater communist influence in southern Africa."
 CIA_SAF80b.1.desc:0 "While previous administrations have aided and abetted the current South African regime, the new administration of [USA.GetLeader] has decided on a new course of action to restore morality to American foreign policy. The new goal of American foreign policy towards South Africa will be twofold. First, we will now seek an end to the Apartheid system in South Africa, this will include halting government efforts to evade sanctions and seeking to support the international Anti-Apartheid movement through preventing hostile actors from taking action against the movement. However, the administration has also noted that preventing a communist takeover of South Africa is important. To this effect, the President has noted their support for a plan of seeking to sideline more militant leftwing members of the African National Congress (ANC) along with seeking out other organizations in South Africa that will oppose communism but are against the Apartheid system."
 CIA_SAF80b.2.desc:0 "For too long the intelligence apparatus has been used to harass progressive movements in the United States and Western Europe. The Central Intelligence Agency (CIA) has now been tasked with prioritizing the security of non-communist Anti-Apartheid activists and to avoid cooperation with any far-right elements seeking to damage the movement along with curtailing South African surveillance and harassment of the Anti-Apartheid movement. Some CIA officers have reportedly been displaced with this change of tactic and should be monitored to ensure they properly follow orders. That said, our analysts believe that this move carries minimal risk and may help build future goodwill with activist leaders. In addition to this, the CIA has also been requested to seek to work against the potential assassination of any western leaders who are notable for their opposition to South Africa. "
 CIA_SAF80b.3.desc:0 "One of the major issues with the South African government is their advanced weapons of mass destruction campaign. While internationally only rumored at best, South Africa actually has a functional nuclear weapons program and our analysts believe it is very possible that South Africa has either a working nuclear device or the capability to quickly assemble one. To further weaken Pretoria’s international standing, the National Security Council has agreed to a proposal to leak the full extent of the South African nuclear and biological warfare programs to the press. A designated CIA officer with media connections will be tasked with confidently leaking the material to the New York Times and then from that point we will wait for the story to take its course before we formally agree with the reporting and verify its content. Concerns have been raised that this may push Pretoria deeper into a corner and could jeopardize any diplomatic chances of ending Apartheid."
 CIA_SAF80b.4.desc:0 "Terrible news, the international media has caught wind of our weapons of mass destruction program. While the start of the media firestorm is not directly tied to the American government, it is clear that the American government leaked the existence of the program to the New York Times and other media institutions.This is an utter disaster. What remaining international allies and supporters we had are rapidly abandoning us as defending our cause has become even more politically toxic. Concerns have been further raised over what will surely come, further economic sanctions, now also enforced by the United States which will have dire effects not only on our economy but also our ability to wage war. Even now, our enemies, both domestic and foreign are plotting our demise and growing ever bolder, desperate actions may be necessary in the future to stave off the worst."
 CIA_SAF80b.6.desc:0 "The continued existence and expansion of the South African nuclear weapons program is a concern for global security. Unfortunately, crippling the South African nuclear program is more challenging than most given South Africa has rich reserves of uranium and other resources necessary for nuclear weaponry. If the program is continued, it could provide Pretoria with the ultimate leverage in attempting to prevent the end of Apartheid. To sabotage the program, a proposal has been approved by the National Security Council to kidnap South African nuclear scientists. While perhaps a drastic move, this effort could help to delay the progression of the South African nuclear program while also mitigating the risk of public escalation or alarm. However, concerns have been raised over the consequences if the operation either fails or has complications when kidnapping nuclear scientists."
 CIA_SAF80b.7.desc:0 "Great news, our recent campaign against the South African nuclear program has been a great success. Several notable South African nuclear scientists have been abducted by our agents and successfully exfiltrated back to the United States. While the scientists are not leaders in their field globally, they are still notable academics and will be convinced, perhaps forcefully to cooperate in expanding our intelligence on the South African program and then be found employment in a related field domestically, under observation of course. The South African government has not formally announced anything at this time but per our sources is aware of our culpability in the abductions and has expressed concerns over their own personal safety. Alarmingly, our new sources of information have led our analysts to realize they may have underestimated the progression of the South African nuclear program."
 CIA_SAF80b.8.desc:0 "Unfortunately, our attempts at sabotaging the South African nuclear program by abducting South African scientists has turned into a fiasco. While things began normally, our agents quickly realized that the targets were broadly not in their homes and had been relocated to government facilities. Further complicating things was South African special forces engaging our agents as they exfiltrated from the nation. Thankfully, our agents managed to escape, albeit with some injuries. The South African government has announced their foiling of our operation and have lambasted our operation as a violation of their sovereignty. This is certainly a blow to the administration, and perhaps more concerningly has failed to do any meaningful damage to the South African nuclear program while also embarrassing our administration and security services."
 CIA_SAF80b.9.desc:0 "For decades, we have been a staunch supporter of the South African government. This comes in spite of their Apartheid policies being controversial within the United States and politically toxic abroad. However, President [USA.GetLeader] ran on reversing this approach. To continue on this path, the President has authorized sending a proposal to African National Congress (ANC) leader, Nelson Mandela on accepting American support in exchange for the sidelining of South African Communist Party (SACP) members within the broader movement, especially in regard to the leading members of the uMkhonto we Sizwe, the armed wing of the ANC which is heavily staffed by SACP members. If Mandela accepts the proposal, we would have the perfect vehicle to influence the anti-Apartheid movement within South Africa along with ensuring continued American influence in South Africa in a post Apartheid South Africa. However, the move has also been criticized by some within the National Security Council (NSC) for potentially further destabilizing South Africa."
 CIA_SAF80b.10.desc:0 "Our outreach to Nelson Mandela has borne fruit. The African National Congress (ANC) leader has informed our agents that he has agreed to our proposal. Mandela noted that while he had reservations over sidelining more prominent South African Communist Party (SACP) members that this was for the good of South Africa and could provide the needed momentum to finally bring an end to Apartheid. While naturally this agreement will remain private between the higher echelons of our administration and the top leadership of the ANC, this is a major victory for our administration and a vindication of our new strategy in regard to South Africa. Hopefully, this represents the beginning of the end of the Apartheid regime in Pretoria and pushes the government to the negotiating table to avoid a future bloodbath."
 CIA_SAF80b.11.desc:0 "Following a contentious debate, the President has authorized the arming of the uMkhonto we Sizwe, the armed wing of the African National Congress (ANC). This comes despite the fact that the UMkhonto we Sizwe is effectively led by the leadership of the South African Communist Party (SACP). While the more hardline members in the intelligence apparatus and foreign policy establishment have heavily criticized the decision, the President believes that the outreach to the ANC will enable our government to exercise greater influence in a post-Apartheid South Africa and potentially alienate SACP members. While Mandela and other ANC leaders have responded positively to our outreach and proposal to minimize SACP involvement in a post-Apartheid South Africa, doubt remains over the willingness of the larger ANC to actually follow through with the deal. Another contingent have also expressed concern over this move leading to greater racial tension in South Africa and raising the risks of a violent civil war breaking out in the Cape."
 CIA_SAF80b.12.desc:0 "One of the major issues our intelligence services have had with the Anti-Apartheid movement in South Africa over the years is the high level of prominent communists within the African National Congress along with their alliance with the South African Communist Party (SACP). This is especially true with the large presence of SACP leadership and cadres in the armed wing of the movement, Umkhonto we Sizwe. The ANC has agreed to take some conciliatory moves to reduce communist influence within the ANC movement. Communist leaders of the Umkhonto we Sizwe, especially Joe Siovo, the overall commander of the Umkhonto we Sizwe and chairman of the SACP, Chris Hani, the chief of staff of the Umkhonto we Sizwe and other prominent SACP members of the armed movement such as Thenjiwe Mtintso will be sidelined to other roles within the broader organization and will be replaced by more moderate ANC figures."
 CIA_SAF80b.13.desc:0 "The Zulu represent one of the larger ethnic groups in South Africa.While lacking a formal Bantustan, the local Zulu aristocracy effectively still have extensive power over their traditional lands. The Inkatha National Cultural Liberation Movement (INCLM), led by the nephew of the would-be Zulu king could be a vital asset in our ongoing efforts. While initially aligned with the African National Congress (ANC) the INCLM has become increasingly alienated with the ANC for a variety of reasons, and some of the Zulu nobility has been increasingly friendly with the South African government. The President has approved a plan to outreach to Prince Mangosuthu Gatsha Buthelezi, the leader of the INCLM and offer a proposal for the INCLM to distance themselves from the South African government and prepare for an eventual armed uprising against the state in exchange for American financial and military aid along with recognition and support of an independent Zulu state in the aftermath of the future fall of the Apartheid government."
 CIA_SAF80b.14.desc:0 "Thankfully, the Inkatha National Cultural Liberation Movement (INCLM) leadership has agreed to our proposal. Representatives of Prince Mangosuthu Gatsha Buthelezi, the leader of the INCLM are currently organizing delivery locations and figuring out logistics for the expansion of our local network and arms deliveries to begin in the coming weeks. Our analysts strongly believe that our support for an independent Zulu state under a traditional government structure was the main selling point for the INCLM. This is a great step towards our goal of ending Apartheid in South Africa, however it does open new challenges as well. We will now need to also balance the competing interests of the INCLM and the African National Congress (ANC). Tensions between the two organizations has been growing in recent years, and the ANC will surely be displeased with the INCLM’s newfound goal, and our acceptance of an independent Zulu state."
 CIA_SAF80b.15.desc:0 "Unfortunately, Inkatha National Cultural Liberation Movement (INCLM) leadership has rebuffed our offer to go against the government in Pretoria. The INCLM, while appreciative of the offer, noted that at this time they felt more comfortable with throwing their lot in with the Pretoria government given the growing radicalism within the African National Congress (ANC) and other allied forces. While not openly stated, our analysts and local agents believe that the Zulu aristocracy are threatened by more left-wing political currents within the Anti-Apartheid movement that while not communist would certainly put an end to the traditional power structure in KwaZulu. While unfortunate, this response is not fully unexpected, local intelligence reports had noted growing closeness between notable Zulu leaders and the South African government, especially in light of the INCLM’s growing conflicts with the ANC."
 CIA_SAF80b.16.desc:0 "The time has come, after various negotiations with Anti-Apartheid factions in South Africa and providing sufficient weaponry and training, it is time to spur the start of an armed uprising against the South African government. Our agents embedded within the uMkhonto we Sizwe have informed us that the armed wing of the African National Congress, plans to begin their grand operation against the government by an initial raid on various smaller, softer government targets, before pivoting into attacking major prison complexes and attempting to launch coups against the collaborationist governments in the Bantustans. As we await news from our contacts on the success of the first stages of the uprising, concerns have been raised internally within the administration about potential crimes against white civilians and collaborationist elements along with conflicting analysis of how the South African government will respond to the uprising. Ideally, the uprising would bring the pro-Apartheid government to the negotiating table, however the now predominant view of the intelligence agencies is that this will likely head into a bloody civil war and raises the risk of the South African government taking drastic measures."
 CIA_SAF80b.17.desc:0 "Terrible news has begun pouring in throughout the nation. Late yesterday evening, multiple reports of attacks on military and law enforcement installations began coming on. While isolated attacks on these types of facilities was not alarming at first, the situation has rapidly spiraled out of control. Several major prisons have been raided and the armed wings of the African National Congress and Inkatha Freedom Party have launched a general armed uprising against our government, already seizing control of several urban areas. Conflicts have also been reported in the Bantustans between forces loyal to our government and those aligned with the Anti-Apartheid forces. We can not falter now, all paramilitary and military forces must be activated as the nation falls into a civil war. Failure to save our government will surely lead to the genocide of the white population of South Africa, perhaps more extreme measures will be necessary to salvage the situation in the coming days."
 CIA_SAF80b.5.desc:0 "During a session on nuclear non-proliferation at the United Nations earlier today, the American ambassador to the United Nations revealed the existence of the South African weapons of mass destruction program. This program not only includes nuclear weaponry but also allegedly chemical and biological agents. The ambassador continued on to announce America’s support for demanding South Africa to dismantle their weapons program as well as support for sanctions if this demand is not met Given Washington’s long standing relationship with Pretoria, the move of unveiling and supporting sanctions over the program comes as a major surprise to the international community. Polling has shown a strong majority of Americans support the move towards forcing South Africa to abandon their weapon program, however anti-communist organizations which support South Africa in their struggle against the expansion of communism in southern Africa have condemned the move as a betrayal of an American ally."
 CIA_SAF80b.18.desc:0 "Following the contentious 1948 South African election, the Nasionale Party quickly established an Apartheid state to empower the Boer population over the Black African population compromising a majority of the nation's population but also to establish a political system to push white moderates and liberals to the political fringe. As the decades have come and gone, internal and foreign condemnation and dissent over Apartheid has steadily grown. Following a withdrawal in American support in recent years, the security situation in Pretoria has drastically deteriorated. However, the international Anti-Apartheid movement had remained hopeful for a mostly peaceful transition away from Apartheid. Unfortunately, this optimism has died a painful death following clashes throughout the nation between the military and the uMkhonto we Sizwe, the armed wing of the African National Congress (ANC). This follows a renewed government crackdown on the political opposition, with any hopes for a peaceful transition in tatters, the international community will now need to decide on how to proceed."
 CIA_SOM.30.desc:0 "Somalia has launched a second Ogaden War amid the escalating conflict of the Ethiopian Civil War. Somali forces, alongside the West Somali Liberation Front and the Somali Abo Liberation Front—a group of Oromo origin seeking to join Somalia—have initiated aggressive military operations in disputed border regions. This renewed conflict reopens territorial issues that were recently reopened during the Ogaden War of the 1970s, intensifying long-standing regional rivalries. In a significant strategic move, the United States has provided covert backing for Somalia’s campaign, aiming to counter Soviet influence and stabilize the volatile Horn of Africa. American support underscores its interest in shaping regional security dynamics, even as international observers warn of the potential for wider conflict. As tensions rise, the intricate interplay of ethnic, political, and strategic factors continues to threaten further instability, leaving neighboring states and the global community deeply concerned about the long-term implications."
 CIA_SOM.31.desc:0 "Somalia has emerged victorious in the second Ogaden War, securing a decisive victory amidst the backdrop of the Ethiopian Civil War. Somali forces, aided by the West Somali Liberation Front and the Somali Abo Liberation Front, successfully captured key territories in the Ogaden region, overcoming fierce Ethiopian resistance. Covert support from the United States played a crucial role in tipping the scales, providing critical military aid that contributed to Somalia’s strategic success. The victory resolves longstanding territorial disputes dating back to the 19th century while also altering the regional power dynamics. Somalia's triumph strengthens national pride and positions the country as a dominant force in the Horn of Africa. The win enhances Somalia’s influence, creating opportunities to reshape political alliances and regional security. International observers are closely monitoring the aftermath, as this victory stands to shift geopolitical tensions in the Horn of Africa."
 CIA_SOM.32.desc:0 "Somali forces have failed to achieve victory in the second Ogaden War, experiencing significant setbacks in their military campaign. Despite initial advances alongside the West Somali Liberation Front and the Somali Abo Liberation Front, the Somali military encountered fierce resistance from Ethiopian troops entrenched in the contested Ogaden region. The harsh conditions of the ongoing Ethiopian Civil War further complicated the situation. Despite the covert backing of the United States, Somali forces were unable to maintain momentum and were pushed back, unable to secure key territories. This defeat leaves Somalia facing unresolved territorial disputes from the 1970s Ogaden War. The setback raises concerns about the future of Somalia’s territorial ambitions and strategic objectives in the Horn of Africa. International observers now question the sustainability of Somali alliances and the implications of this failure on the region’s long-term stability and the balance of power in East Africa."
 CIA_SOM.33.desc:0 "U.S.-backed forces aligned with the Somali National Movement have secured a decisive victory in the ongoing Somali Civil War, effectively toppling Siad Barre’s regime. According to military sources, covert American support—providing intelligence, logistical assistance, and advanced armaments—enabled the Somali National Movement to capture key strategic territories, forcing Barre’s loyalists into rapid retreat. This intervention is now widely seen as a turning point in the conflict, raising hopes for a transition toward a more democratic and stable Somalia. Regional experts note that the operation underscores the growing role of external powers in shaping Somali affairs. While some analysts commend the move for its potential to reduce long-term instability in the region, others warn that the broader implications remain uncertain, and achieving lasting peace may require further diplomatic and economic efforts. International observers continue to monitor developments closely as Somalia faces a new chapter in its protracted civil war."
 CIA_SOM.34.desc:0 "After a significant setback in the Somali Civil War, U.S.-backed forces and the Somali National Movement (SNM) have been forced to retreat to the self-declared independent state of Somaliland. Despite initial gains, U.S. support and SNM advances could not overcome the determined resistance from Siad Barre’s forces and rival factions. The retreat marks a dramatic shift in the conflict, as the initial hopes of expanding the SNM-controlled areas across Somalia quickly diminished. United States military assistance, which included intelligence and logistical support, was not enough to secure and maintain control over the contested regions. Despite this, Somaliland, which declared independence in the early 1990s, remains firmly under SNM control. International observers have expressed concern over the failed strategy, noting that the situation could further destabilize the region and complicate ongoing efforts for Somali national reconciliation. The future of U.S. involvement in the conflict remains uncertain."
 CIA_CYCLONE.0.desc:0:0 "Afghanistan Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\nSince the 1978 April Revolution in Afghanistan, resulting in the pro-Soviet government of the Democratic Republic of Afghanistan led by Nur Muhummad Taraki, policymakers across the Western and anti-Communist world have been troubled by the appearance of a Soviet tilt towards Central Asia and the Middle East. However, recent anti-government revolts in Afghanistan by Islamist \"mujahideen\" militant groups have attracted attention in Washington; as well as increasing Soviet military intervention in the region, to support the current regime led by Babrak Karmal, who replaced the former leader, Hafizullah Amin, who was killed by the Soviets prior to their intervention.\nHereafter known as the Afghan Resistance, several groups have emerged as a credible threat to the pro-Soviet regime in Kabul, including a faction known as the \"Peshawar Seven,\" composed of seven political Islamist and Afghan traditionalist groups funded by Pakistan and Saudi Arabia; and the \"Tehran Eight,\" a smaller faction of eight Shia militant groups supported by Iran. \nIt is of great strategic and tactical importance in the region to support these groups, beginning with covert activity. This Desk, in coordination with the relevant technical personnel, recommends initial covert arms shipments of small arms, ammunition, anti-tank and anti-air missiles, additional explosives; as well as initial contacts to said groups and contacts with Pakistani, Saudi, and Afghan figures to facilitate advising and on-the-ground training. With this approval, the tide may be able to turn against Soviet dominance in Afghanistan and Central Asia."
 CIA_CYCLONE.1.desc:0:0 "PRIORITY MESSAGE\nFROM: US EMBASSY ISLAMABAD\nTO: SEASIA DESK, D/OPERATIONS, LANGLEY; NSC, APNSA\nSECRET/NOFORN\nOPERATIONS IN AFGHANISTAN UNSUCCESSFUL. ARMS SHIPMENTS NOT REACHING MILITIAS. INTRA-FACTION CONFLICTS RISING INSTEAD OF FOCUSING ON SOV THREAT. CIA TEAM IN COUNTRY RECOMMENDS PAUSE/CANCELLATION OF OPERATIONS AND ASSISTANCE. REQUEST IMMEDIATE REPLY. END.\nDirector of Central Intelligence [GetCurrentCIADir] frowned as the cable was dropped on his desk by his secretary. Langley’s efforts to turn the tide in Afghanistan were failing; the list of reasons why was a mile long. He could only imagine the frustration of the agents now, trying to manage a losing fight.\nPunching \"1\" on his secure phone, he got the White House Switchboard within seconds. \"I need to speak to the President please. This is urgent.\"\nSeconds later, President [USA.GetLeader]’s voice appeared on the phone. \"What is it, Mr. Director.\"\n\"Sir, we need to convene the National Security Council right away. It’s about Afghanistan. We need to pull back operations.\"\n\"I was afraid you’d say that, Mr. Director. Unfortunately, I agree. No need to convene the NSC today. You have authority to terminate operations now and we’ll brief the NSC at our weekly meeting.\"\n\"Yes, Mr. President. Thank you sir. Goodbye.\" The DCI hung up, then hitting an extension straight to the neighboring office, the Deputy Director for Operations. \"DDO, we’re halting the Afghanistan operation. Do what you need to pull our boys out of there.\""
 CIA_CYCLONE.2.desc:0:0 "PRIORITY MESSAGE\nFROM: SEASIA DESK, D/OPERATIONS, LANGLEY\nTO: USEMBASSY ISLAMABAD; TEAM ALPHA EAGLE  \nSECRET/NOFORN\nPOTUS BRIEFED ON AFGHAN SITREP. WH AND LANGLEY DECIDED PAUSE OPS RETURN ASAP TO EMBASSY ISLAMABAD TO AWAIT FURTHER INSTRUCTIONS. LIKELY RETURN TO CONUS. END.\nWaiting a minute to confirm the telex was sent successfully, the DDO sighed, marking the end of another US attempt at intervention. It really was a shame this time; between political pressure and the inefficiency of the Pentagon, operations at the scale as what was in Afghanistan were no easy task.\nHe punched the inter-office buzzer, calling his secretary to find the heads of the Southeast Asian Desk, the division which Afghanistan fell under. Within five minutes, the two desk heads, one from Analysis/Intelligence and one from Operations, appeared in his office."
 CIA_CYCLONE.4.desc:0:0 "The Chief of Station in Riyadh has approached the House of Saud with a request for assistance. In the US’s new covert operation to support anti-communist Islamist militant groups in communist Afghanistan, known informally as Operation Cyclone, Washington has decided to enlist our help, being a key ally with regional influence.\nCIA officials have made a request for a dollar-for-dollar match on US covert aid provided to the mujahideen, making the point that our government has supported Islamist groups before and that it would be in our strategic interest to assist. Some figures in our government consider it a waste of time and resources, while others say the time is now for power projection and we have plenty of funds to contribute. How shall we choose?"
 CIA_CYCLONE.5.desc:0:0 "The CIA Chief of Station in Riyadh has reported back to Langley that the Saudi government has accepted our request to match funds dollar-for-dollar that are appropriated to aid the Mujahideen in Afghanistan. Our contact within the House of Saud reported that members of the Saudi royal family were reluctant, but ultimately decided to agree based on the immense wealth they had and the potential for future Saudi geopolitical influence.\nThe response in Langley and Washington has been good. Operatives within Afghanistan will be informed soon, much to their pleasure. More money will be flowing to the freedom fighters of the Afghan resistance now."
 CIA_CYCLONE.6.desc:0:0 "Unfortunately, the CIA Chief of Station in Riyadh has reported back to Langley that the Saudi government has rejected our repeated requests for fund matching dollar-for-dollar of aid and weapons going to the Mujahideen in Afghanistan. Our contact within the House of Saud also reported that the Saudi royal family appeared reluctant and ultimately refused on the grounds of reputation and the fact that it may be a waste of time and valuable resources.\nThe response in Washington has been muted. While the President and National Security Council will be informed, it is best to leave the on-the-ground operatives in Afghanistan in the dark on this one, as providing them more bad news at this time will not serve to help the Afghan resistance that we support."
 CIA_CYCLONE.7.desc:0:0 "Afghanistan Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nBackground: In an effort to bolster the ideological resolve of the Afghan mujahideen, CIA operatives have proposed a covert campaign to distribute militant textbooks to resistance groups. These textbooks, designed to promote anti-communist and pro-Islamist ideologies, are intended to strengthen the ideological foundation of the mujahideen fighters, particularly among younger recruits.\n\nAnalysis: The distribution of these textbooks could enhance the cohesion and motivation of the mujahideen, particularly in rural areas where education is limited. However, there is a risk that the material could be seen as foreign propaganda, potentially alienating local populations or factions within the resistance.\n\nRecommendations: This Desk recommends proceeding with the distribution of textbooks, but with careful oversight to ensure the material aligns with local cultural and religious values. Coordination with Pakistani intelligence (ISI) and local mujahideen leaders will be critical to the success of this operation."
 CIA_CYCLONE.8.desc:0:0 "Afghanistan Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\n\nBackground: Recent intelligence reports indicate that some factions within the Afghan mujahideen are distributing fundamentalist propaganda that promotes extremist ideologies. This poses a risk to U.S. interests, as it could lead to the rise of radical groups that may eventually turn against the United States and its allies.\n\nAnalysis: While the immediate goal is to defeat Soviet forces, the long-term implications of supporting fundamentalist groups could be detrimental. This Desk recommends taking steps to mitigate the spread of extremist propaganda, particularly among factions receiving U.S. support.\n\nRecommendations: CIA operatives should work with moderate mujahideen leaders to counter the influence of fundamentalist propaganda. This could include distributing alternative materials that promote a more moderate interpretation of Islam and anti-communism."
 CIA_CYCLONE.9.desc:0:0 "Afghanistan Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\nRecent intelligence and analysis on the emerging Afghan mujahideen movement have revealed a rising star in the group of seven disparate groups known as the Peshawar Seven: a senior commander named Ahmad Shah Massoud. This Desk recommends backing Massoud and his forces, due to his popularity and tactical skill against Soviet and pro-Soviet forces on the battlefield.\nInitially becoming influential in the Islamist political world in the early 1970s while at Kabul University, Massoud became militarily known after participating in the 1975 Panjshir rebellion, which, while being unsuccessful overall, resulted in Massoud making a name for himself within the Islamist movement, which was beginning a schism between moderates like Massoud and more fundamentalist groups such as the Hezb-e Islami led by Gulbuddin Hekmaytar.\nSince the Saur Revolution and later, the Soviet invasion, Massoud has been influential as an on-the-ground commander, carrying out asymmetric warfare and attacking Soviet convoys in the Salang Pass. In the early parts of the campaign, Massoud has effectively been able to keep Soviet forces tied down while other Mujahideen forces engage in other parts of the country.\nOur assets on the ground and this Desk believe that Massoud is the best option for prominent Mujahideen groups to back, as his Jamiat-i Islami group is more militarily effective and less fundamentalist than the Hezb-e Islami group led by Hekmaytar, who, while being under the same umbrella as Massoud, remains a strong factional enemy of his."
 CIA_CYCLONE.10.desc:0:0 "News has come from Washington, via our contacts on the ground and via the ISI in Islamabad, that the American CIA has decided to back our faction of Mujahideen fighters under the Jamiat-i Islam party. This is excellent news, as we have noticed that Langley, largely ignoring the opposition to our forces from the Pakistanis, have been eyeing us for some time, as the Americans feel a need to intervene against Soviet expansion efforts, particularly in Asia."
 CIA_CYCLONE.11.desc:0:0 "AFGHANISTAN: STRATEGIC ALIGNMENT WITH REGIONAL ALLIES\nAfghanistan Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\nBackground: The U.S. faces a critical decision in Afghanistan: whether to align more closely with Pakistan and its preferred mujahideen faction, Gulbuddin Hekmatyar's Hezb-e Islami, or to support Ahmad Shah Massoud's more moderate Jamiat-i Islami faction, which is favored by Western allies. Pakistan's Inter-Services Intelligence (ISI) has been a key partner in the region, but Hekmatyar's fundamentalist ideology poses long-term risks. Massoud, while less aligned with Pakistan, represents a more moderate and potentially stable alternative.\nAnalysis: Aligning with Pakistan and Hekmatyar would strengthen ties with a critical regional ally and ensure continued logistical support for mujahideen operations. However, Hekmatyar's extremist tendencies could lead to future instability. Supporting Massoud, on the other hand, aligns with Western values and could foster a more stable post-Soviet Afghanistan, but risks alienating Pakistan and complicating regional logistics.\nRecommendations: This Desk recommends a careful balancing act. While maintaining cooperation with Pakistan, the U.S. should gradually shift support toward Massoud's faction, leveraging Western allies to mitigate the risks of alienating Islamabad."
 CIA_CYCLONE.12.desc:0:0 "Afghanistan Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\nRecent intelligence and cooperation with Pakistan’s Inter-Services Intelligence (ISI) have revealed a new player in the group of seven disparate groups known as the Peshawar Seven in the Afghan mujahideen resistance: senior commander and fundamentalist leader Gulbuddin Hekmatyar. This Desk, having heard reports from personnel on the ground and from ISI, recommends backing Hekmatyar due to his capabilities, strategic position, and friendly ties with other allied anti-communist countries in the region, namely Pakistan.\nHekmatyar began his foray in the Afghan Islamist community in the late 1960s when he attended Kabul University as an engineering student, becoming close, and later becoming enemies with, more reform-minded Ahmad Shah Massoud, who also commands a faction of mujahideen in the Peshawar Seven. Becoming more radical, Hekmatyar founded the Hezb-e Islami from parts of the Muslim Youth in 1975 after having a split over ideology. \nLiving and training in Pakistan for the intervening years, Hekmatyar and his forces have heavy backing from the Pakistani government and security services, who established camps to train them. Before the Soviet invasion, Hekmatyar’s forces were headquartered in three refugee camps in Pakistan, where they currently are.\nHekmatyar is an effective combat commander, and his Islamic ideological bent has attracted the lion’s share of assistance from Islamabad, but in terms of capabilities in the future, Pakistan’s sole backing will not cut it for a long-term solution in Afghanistan. Supporting Hekmatyar, particularly with weapons, will secure a foothold inside Afghanistan to effectively rebuff Soviet forces."
 CIA_CYCLONE.13.desc:0:0 "News has come from Washington via Islamabad that the Americans have decided to back us militarily and financially via their operatives in the CIA. Hekmatyar is thrilled, as are senior members of his Hezb-e Islami political party. In a message from Langley, the Americans have stated they \"desire our forces to gain a foothold within Afghanistan\" and that \"additional arms shipments from the United States should assist in that goal\". The reaction from our contacts within the Pakistani security services have also been good, noting that their efforts to ingratiate us to the Americans has worked thus far."
 CIA_CYCLONE.14.desc:0:0 "\"So, if we want to help the mujahideen, but we don’t want to get involved with the Pakistanis, what do we do?\" A senior Afghanistan analyst leaned back in his chair, where analysts in the Office of Southeast Asian Analysis were having a morning meeting, with the inclusion of some officers from Operations.\n\"Well,\" another analyst piped up, \"I think we’ve established that the ISI is supporting more hardline elements within the mujahideen, which we disagree with. There are less fundamentalist elements, but arming them directly may be difficult, especially if we don’t work with the Pakistanis.\" He gestured to the Ops officers sitting at the other end of the table. \"You got any ideas?\"\nThe Ops officers nodded, looking down at some notes. \"We may be able to establish new smuggling routes through Ahmad Shah Massoud, a less fundamentalist mujahideen commander who controls territory in the northern part of the country, away from the Pakistani border. We may be able to organize smuggling operations via northern Pakistan, or via Kashmir, allowing his faction, which remains opposed to Hekmaytar’s faction backed by ISI, to be adequately supported.\"\nThe head of the Office, a former officer on-the-ground decades prior, nodded. \"Let’s move forward. I’ll brief the DCI and National Security Council once we have a plan. Get our men on the ground the message. Thanks, everyone.\""
 CIA_CYCLONE.15.desc:0:0 "Afghanistan Desk and Pakistan Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\nThe United States relationship to Pakistan’s Inter-Services Intelligence (ISI) has been testy, particularly in their involvement in supporting the Afghan mujahideen, particularly a fundamentalist faction led by Gulbuddin Hekmatyar. However, ISI’s heavy connections to Hekmaytar’s faction, known as Hezb-e Islami, have proven effective militarily speaking in rebuffing Soviet advances in Hekmatyar’s area of control, located primarily northwest of the capital of Kabul. \nWhile Hekmatyar’s faction appears more fundamentalist than other Islamist factions composing the Afghan mujahideen movement at large, cooperating and arming them will both increase combat effectiveness of Hekmaytar’s forces, while also enhancing CIA-ISI cooperation and planning of specific operations.\nThere is significant concern from within the Agency that backing ISI and Hekmatyar may be dangerous due to his faction’s ideological fundamentalism as opposed to other mujahideen commanders such as Ahmad Shah Massoud. This Desk recommends support of current ISI operations to assist Hekmatyar, as this seems the most advantageous in the current situation for the United States."
 CIA_CYCLONE.16.desc:0:0 "\"Why not shift our trafficking operations to Iran?\" One of the Afghanistan Desk analysts queried, looking over at an Operations officer sitting across the conference room table from him. \"What?\" The Ops officer looked up from his notes, with an incredulous look on his face. \"Are you serious? Through Iran?\"\"Yes. Massoud is too reformist to achieve political goals, and Hekmatyar and the Pakistanis are too fundamentalist. The only other option we have for backing are the Shiite militias, which have been funded by Tehran. Surely we can organize some sort of agreement to covertly ship arms and other assistance via the Iranian border to those groups.\"The Ops officer nodded. \"Makes sense. Who would contact the Iranians? We need a contact who is directly with the IRGC, and a lot of their logistics would be required to move weapons to Hazarajat where the Shiites are.\"The analyst frowned. \"We’ll have to look into it more, specifically with the communication channels, but there are surely some figures in the IRGC and in Tehran that would approve covert US assistance, just this once. It’s hard to ensure, especially since 1979, but we might be able to make it work.\"The head of the Office of Southeast Asian Analysis smiled. \"Write it up, you two. I want a draft proposal soon, and for you all to contact our men and let them know of the new possible plan. Thanks.\""
 CIA_CYCLONE.17.desc:0:0 "Afghanistan Desk, Office of Southeast Asian Analysis, Directorate of Intelligence; Directorate of Operations\nSECRET/NOFORN\nRecent combat and battle damage assessments undertaken by the Defense Intelligence Agency and the National Reconnaissance Office have seen the effectiveness of Afghan mujahideen fighters in their operations against Soviet and Afghan pro-regime forces, and reports from personnel on the ground in Afghanistan report that the mujahideen, while well-manned, are running low on weaponry and other combat equipment. Policymakers in the [USA.GetLeader] administration have expressed a desire to expand weapons shipments, but are split on what type of equipment. \nSome proponents of sending older equipment, such as dated Soviet D-20 howitzers and AK-74 assault rifles, argue that while tactically inferior, these weapons supply plausible deniability and are able to hide in plain sight of Soviet occupying forces. Other analysts and personnel on the ground have been pushing for more modern equipment, including the new M-4 carbine, M-198 howitzer, and Stinger surface-to-air shoulder-launched missile. Providing the mujahideen with this equipment would guarantee greater combat effectiveness but reduce plausible deniability and may be seen as escalatory by the Soviets and the international community. For their part, the Pakistanis appear to be neutral but are leaning toward providing Soviet-style equipment to the fighters.\nEither decision would greatly increase the mujahideen’s combat capability, but not necessarily combat effectiveness. Proponents of modern equipment have argued that providing the fighters with Stingers will allow them to down Soviet helicopter gunships, which have presented the most serious threat to the mujahideens’ survival thus far. A decision must be made on this, and quickly."
 CIA_CYCLONE.18.desc:0:0 "Afghanistan Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\nSince the Soviet invasion in Afghanistan, there has been much debate in Langley about the composition of the resistance Afghan \"mujahideen\" forces, including their ideology and combat effectiveness, and whether to back them. Broadly, personnel on the ground and analysts stateside have agreed that the primary mujahideen group, the Peshawar Seven, are most worth backing. However, a new group of resistance to the Soviets has emerged, from the other side of the ideological spectrum: the Afghanistan Mujahideen Freedom Fighters Front, or AMFF, composed of four Maoist and moderate Islamist paramilitary factions; the Islamic Revolution Movement, the Afghanistan Liberation Organization, the Liberation Organization for the People of Afghanistan, and the Afghanistan National Liberation Front.\nWhile anti-Soviet, the AMFF still remains pro-Beijing, adhering to mainly Maoist ideology while also integrating elements of moderate Islamist ideology. While they remain opposed to the current PDPA regime and Soviet occupying forces, they still represent a threat to US interests, particularly if they gain additional influence in any post-PDPA Islamist settlement.\nThis Desk officially recommends restricting weapons transfers to the AMFF, on the basis that they are not in US interests and that providing them weapons would be counterproductive to US goals in the region. Instead, continuing support to other Islamist resistance groups such as the Peshawar Seven remains the most viable option."
 CIA_CYCLONE.19.desc:0:0 "Afghanistan Desk, Office of Southeast Asian Analysis, Directorate of Intelligence\nSECRET/NOFORN\nSince the Soviet invasion in Afghanistan, there has been much debate in Langley about the composition of the resistance Afghan \"mujahideen\" forces, including their ideology and combat effectiveness, and whether to back them. Broadly, personnel on the ground and analysts stateside have agreed that the primary mujahideen group, the Peshawar Seven, are most worth backing. However, a new group of resistance to the Soviets has emerged, from the other side of the ideological spectrum: the Afghanistan Mujahideen Freedom Fighters Front, or AMFF, composed of four Maoist and moderate Islamist paramilitary factions; the Islamic Revolution Movement, the Afghanistan Liberation Organization, the Liberation Organization for the People of Afghanistan, and the Afghanistan National Liberation Front. \nIdeologically more left-wing than the ruling pro-Soviet PDPA, and combined with pro-Beijing ideologies that are not accepted by the current regime, the AMFF has emerged as an interesting choice to back. While not consulting with our Pakistani allies, personnel on the ground and analysts at Langley, including this Desk, recommend allowing weapons shipments to the AMFF, mostly of old, outdated Soviet-style weapons including AK-74 assault rifles and D-20 howitzers.\nWhile possible to invoke the wrath of domestic right-wingers here in the United States, this decision to allow weapons shipments is the right one, particularly as it will help any and all anti-Soviet forces achieve their goals and force Communist domination in Central Asia to an end."
 CIA_CYCLONE.20.desc:0:0 "We have received word from an American contact that the US Central Intelligence Agency, with the permission of President [USA.GetLeader] has authorized weapons shipments of our forces. In a brief message to our leaders, the American CIA agent informed us that \"you will be receiving stocks of AK-74 assault rifles and D-20 howitzers to utilize against Soviet and Afghan pro-PDPA forces\". The Americans, however, desire to keep this covert, according to our source, as they fear supporting communist movements would be counterproductive to their public messaging. Our leaders are pleased at this development and eagerly await more information on transfer logistics from our new CIA liaison."
 CIA_CYCLONE.21.desc:0:0 "Central Asian SSR Desk, Office of Soviet Analysis, Directorate of Intelligence\nSECRET/NOFORN\nSince the United States has determined that our programs in Afghanistan and Pakistan have yielded initial successes in increasing anti-Soviet militarist sentiment among populations, the next logical step is to proceed to the Soviet Socialist Republics in the Central Asian region, including the Turkmen, Uzbek, and Tajik SSRs, in increasing anti-Soviet militarism among those populations, particularly in rural areas, and spreading the movement into the Soviet Union.\nA helpful conduit for populations in this region is via Muslim organizations, such as the Spiritual Administration of Muslims of Central Asia and Kazakhstan (SADUM), which broadly coordinates Muslim activities in the region under nominal state auspices. Determining initial information on the population via these means, and perhaps directing our operations towards infiltrating local clerics and imams, may prove particularly helpful in spreading the message.\nIt is also important to lean upon existing Pakistani and Afghan allies, who may have connections over the border in the Soviet Union. While it is imperative that operatives maintain operational security in their contact with allies and partners, so as not to attract the attention of the KGB, letting rumors fly is also encouraged, to build a sense of mystique and paranoia about the anti-Soviet movement.\nLangley and the President desire results as soon as practicable. We depend on you."
 CIA_CYCLONE.22.desc:0:0 "Bill was staying busy in the Embassy this morning as he got caught up on some routine paperwork, reports to the Charge d’Affaires and other political officers working here in Islamabad. Finishing his second cup of coffee since being in the office this morning, he leaned back, breathing a sigh of relief to be back behind a desk again. The \"vacations\" he’d taken, expeditions to the Afghan border, had taken a lot, and, having to keep up with this cover was exhausting.\nA knock at the door frame shook him out of his daydreaming as he looked to a young Marine officer, fresh from the communications center, with a telex slip. \"Message for you, sir. It’s encrypted.\"\n\"Thanks, Lance Corporal. Have a good one.\" As the Marine began to leave, he grabbed a one-time pad and began decoding the coded telex.\nFROM: SEASIA DESK, D/OPERATIONS, LANGLEY\nTO: USEMBASSY ISLAMABAD\nSECRET/NOFORN\nLANGLEY WANTS EXPLORE POSSIBILITY OF CONNECTING W/ SOV MUSLIM GPS. DISSIDENT GPS MAY SUPPORT MUJAHIDEEN OPS. REPORT W/ RESPONSE FROM GPS. END.\n\"Damn.\" Guess he’d have to take another \"vacation,\" and meet with his colleagues yet again. He could make a few calls from here though. There might be some expat groups here in Pakistan, and there were certainly small cells throughout the Central Asian SSRs that might prove helpful."
 CIA_CYCLONE.23.desc:0:0 "PRIORITY MESSAGE\nFROM: US EMBASSY ISLAMABAD\nTO: SEASIA DESK, D/OPERATIONS, LANGLEY\nSECRET/NOFORN\nASSETS IN PESHAWAR REPORT INCREASING TENSIONS BETWEEN FUNDAMENTALIST FACTIONS. TENSIONS APPARENTLY OVER IDEOLOGY AND STRATEGIC OUTLOOK VS SOVS. RECOMMENDATION TO STAY OUT OF CONFLICTS OR SEEK CONCILIATION EFFORTS. FACTIONS MAY WORK TOGETHER IF THREATS OF ARMS SHIPMENTS STOPPING ARE LEVIED. REQUEST IMMEDIATE RESPONSE ON FURTHER OPS. END.\nDropping the cable on the desk, the Southeast Asia Desk watch officer groaned. At least it was the middle of the day here. He picked up the inter-office phone, and within two minutes, all of his colleagues, analysts and operations officers, were swarmed around his small office."
 CIA_CYCLONE.24.desc:0:0 "\"Mr. President, I’m here with a report this morning on Afghanistan. Langley has been busy analyzing the mujahideen groups’ internal dynamics with each other and using reports from on the ground, we have a proposal for you.\"\nPresident [USA.GetLeader] leaned back from the Resolute Desk, looking up at Director of Central Intelligence [GetCurrentCIADir] coming into the Oval, flanked by National Security Advisor [GetCurrentNatSecAdv]. The President rubbed his eyes, imagining the sleep he would soon lose over this. He read the first sentence of the report: \"We recommend the formation of a unified coalition of mujahideen supported by the United States consisting of the following factions: Massoud’s forces, Hekmatyar’s forces, the Afghanistan Mujahideen Freedom Fighters Front, and the Shi’ite militias.\"\n\"This certainly is something,\" he said, looking back up at the DCI and tossing the report back on the desk. The DCI, looking down, cleared his throat. \"Sir, it may sound impossible but our operatives in Pakistan and Afghanistan have assured us that it may be possible.\"\n\"Are you sure? I recall receiving briefings every now and then that the factions, particularly Massoud and Hekmatyar, seem to have internal issues; and do we really think they’re going to work with the Shias? For god’s sake, how is any of this realistic?\"\n[GetCurrentNatSecAdv] spoke up. \"Mr. President, the best thing we could do is reach out to each faction and propose a meeting to form this coalition. The worst case scenario would be a return to the status quo, as each faction has no ability to attack each other without opening themselves up to being attacked by the Soviets; and we can continue backing whichever faction.\"\n\"Very well, men. You have my permission to order the operatives to set up a meeting; preferably in Pakistan, to seek forming a coalition. I want daily reports on this.\" The President nodded.\n\"Yes, sir.\" The two men nodded back before leaving the room. The President sighed aloud in his empty room, before turning back to reading the report again."
 CIA_CYCLONE.25.desc:0:0 "Our American CIA contacts have reached out to our leaders with a bold and new proposal: forming a unified anti-Communist, anti-Soviet coalition of Afghan resistance fighters. \nOur leaders, shocked by this development, have been assured by their handlers in Islamabad and Washington that despite strong and sometimes violent differences between mujahideen factions, all factions should work together under a common agreement to set aside differences in favor of defeating the Soviet occupying authorities and the PDPA regime in Kabul.\nSome in our faction have concerns, such as ideological differences and concerns about coordination and command which have not been clarified by the Americans or Pakistanis. This is considerable cause for concern and may stop us from joining this coalition. How should we choose?"
 CIA_CYCLONE.26.desc:0:0 "According to our contacts in Afghanistan, all four major Mujahideen factions, including Massoud’s forces, Hekmatyar’s forces, the Maoist Afghanistan Mujahideen Freedom Fighters Front, and the Tehran-funded Shiite militias have agreed to form a unified coalition led by US operatives and funded by the US, Pakistan, Saudi Arabia, and Britain. \nThis represents a massive strategic development in the conflict against Soviet occupying forces, and means that warring factions have agreed to end their differences for the moment to fight the Soviet forces stationed in the country. Langley is preparing to brief the President as well as to issue a joint statement with the State Department in the coming days."
 CIA_CYCLONE.27.desc:0:0 "Unfortunately, according to our contacts in Afghanistan, several of the major mujahideen factions, including Massoud’s forces, Hekmatyar’s forces, the Maoist Afghanistan Mujahideen Freedom Fighters Front, and the Tehran-funded Shiite militias have rejected our proposals for a unified anti-communist, anti-Soviet coalition. Stating \"concerns over coordination\" and expressing ideological and personal differences among factions, all hope of unification against the Soviet forces currently stationed in the country are probably lost, and each faction will continue to fight on its own.\nThe President has been briefed and remains disappointed at this development, with the rest of the National Security Council. The war in Afghanistan continues."
 CIA_CYCLONE.29.desc:0:0 "As the President walked into the weekly National Security Council meeting, he motioned for the men to sit back down as he also took his seat. \"Good morning, gentlemen. Let’s start with the points on the agenda.\"\nNational Security Advisor [GetCurrentNatSecAdv] began. \"You got it, Mr. President. First is Afghanistan. State has a proposal that’s been reviewed by Defense that proposes recognizing a group of factions known as the Peshawar Seven; they lean fundamentalist Islamist, but are larger and more well-equipped than the smaller Iranian-backed Shia militias, and have had greater success against the Soviets. Thoughts, gentlemen?\"\nSecretary of State [GetCurrentSecState] stood up, smoothing his tie. \"Seeing as this came from us, I’ll make it brief: diplomatically recognizing the Peshawar Seven as the legitimate government of Afghanistan will open many doors for us; including making communication and relations more legitimate.\" He vaguely glared at DCI [GetCurrentCIADir] before continuing. \"The Pentagon agrees, it will make it easier for arms shipments, particularly since we won’t have to do it covertly. They’d just operate as a government in exile in Pakistan, where they currently are.\"\nThe President nodded. The DCI then stood up, shaking his head. \"Recognizing them would be pure folly. While our cooperation with the mujahideen is good now, there’s not much certainty they’d be willing to work with us in the future, especially if we recognize them; they can simply move to other benefactors. Also, legitimizing arms shipments opens the door to more dangerous implications, it’d be seen as a provocation against the Soviets, which, while I’d love, we need to maintain covertness to have plausible deniability. This just can’t work at the present time.\"\nNodding again, the President halted the murmur of noise in the room as the DCI sat down. \"Now that I’ve heard both sides and all of the members here have deliberated, I think I’ve decided. State and CIA will deliver a joint statement from the White House tomorrow announcing our recognition of the Seven. Emphasize that this is to counter Soviet aggression and that there are clear guardrails to prevent corruption and abuses on the part of the mujahideen, and let’s get operations going via the Pentagon and USAID to start aid. Thank you all.\""
 CIA_CYCLONE.31.desc:0:0 "As the President walked into the weekly National Security Council meeting, he motioned for the men to sit back down as he also took his seat. \"Good morning, gentlemen. Let’s start with the points on the agenda.\"\nNational Security Advisor [GetCurrentNatSecAdv] began. \"You got it, Mr. President. First is Afghanistan. State has a proposal that’s been reviewed by Defense that proposes recognizing a group of factions known as the Tehran Eight.\" Principally backed by the Iranians, they are smaller, less mainstream Shia militias that operate in the strategic Hazara region. State thinks that after our initial rapprochement with Tehran, this move would be further help to relations with them.\"\nDCI [GetCurrentCIADir] nodded in agreement. \"Langley thinks that recognizing them would help plausible deniability and would avoid American support of larger, but more fundamentalist forces in Peshawar which may end badly in the future.\"\nThe President nodded. \"I see. And I assume the Pakistanis would not join us in this move?\"\nThe Secretary of State [GetCurrentSecState] shook his head. \"Pakistan will likely continue to support the more mainstream groups, they’ve been basing them; I don’t think anything will come out of it, Mr. President.\"\nThe Chairman of the Joint Chiefs, not one to contribute much, stood, shaking his head. \"Sir, I know this doesn’t involve active duty troops but I have direct concerns about how us supplying smaller militias will generate real gains against the Soviets, when there are larger groups we could more easily support.\"\nThe DCI nodded again. \"The thinking from Langley is if we get combined US-Iranian support, their tactical and strategic capabilities will be increased from what they are now.\"\nThe President nodded again. \"Very well then. State, DCI, you two will prepare a joint statement of the recognition. Defense, get the Pentagon to begin a workup on assistance and communication to them. "
 CIA_CYCLONE.28.desc:0 "In a joint statement from the White House, National Security Council, and Central Intelligence Agency today, the United States announced the formation of an \"anti-communist, anti-Soviet coalition of freedom fighters in Afghanistan,\" composed of forces led by Ahmad Shah Massoud and Gulbuddin Hekmaytar, as well as Maoist and Shiite militias. \nThis represents a strategic development in the low-intensity guerrilla conflict in Afghanistan since the Soviet invasion; the initial comment from the Soviet Ambassador to the United States was one of shock, then anger. It is not clear what the Soviet response will be, nor if the conflict will escalate outside the region."
 CIA_CYCLONE.30.desc:0 "In a joint statement from Washington, United States Secretary of State [GetCurrentSecState] and Director of Central Intelligence [GetCurrentCIADir] announced the US recognition of a loose alliance of seven Afghan mujahideen groups known as the Peshawar Seven. Based from the Pakistani city of Peshawar, these Islamist groups are headed by commanders Ahmad Shah Massoud and Gulbuddin Hekmatyar, both skilled guerrilla fighters in the current conflict against Soviet occupying forces and the ruling PDPA regime in Kabul.\nInternational reaction to this announcement has been mixed; involvement in the Afghan conflict has thus far been limited to the United States, Pakistan, and Saudi Arabia, all who have provided military and financial aid. It is assumed that the Kremlin will not react well to this, along with its puppets. "
 CIA_CYCLONE.32.desc:0 "In a joint statement from Washington, United States Secretary of State [GetCurrentSecState] and Director of Central Intelligence [GetCurrentCIADir] announced the US recognition of a loose alliance of eight Afghan mujahideen militia groups known as the Tehran Eight. Funded and supported from Iran, and almost completely Shiite Muslim as compared to larger Afghan Sunni militia groups, this support remains a touchpoint in US-Iranian relations, particularly in the recent rapprochement earlier in the decade.\nInternational reaction to this announcement has been mixed; reactions within Afghanistan have been negative, preferring that the US instead recognize the larger mujahideen groups. It is unclear how the Soviets will react, but it cannot be well, along with their puppets."