l_japanese:
 SWE_battle_hull_medium_0:0 "スヴァリイェ級改一"
 SWE_battle_hull_medium_0_desc:0 "スヴァリイェ級海防戦艦は、導入当時、スウェーデン海軍で活躍する最大の艦船であった海防戦艦のクラスである。その設計は全く新しく、当時の艦船の影響を受けている。"
 SWE_sub_hull_small_single_0:0 "ドラケンⅡ級"
 SWE_sub_hull_small_single_0_desc:0 "ドラケン級（ドラゴン）は、1960年から1962年にかけてスウェーデン海軍のために建造された潜水艦のクラスである。合計6隻の潜水艦が納入された。そのうち4隻は1981年から82年にかけて近代化された。設計はハージェン級を改良したもので、水中性能の向上と騒音の低減のため、1軸のみ大型の5枚羽根プロペラを搭載した。"
 SWE_sub_hull_small_single_1:0 "ドラケンⅡ級改一"
 SWE_sub_hull_small_single_1_desc:0 "ドラケン級（ドラゴン）は、1960年から1962年にかけてスウェーデン海軍のために建造された潜水艦のクラスである。合計6隻の潜水艦が納入された。そのうち4隻は1981年から82年にかけて近代化された。設計はハージェン級を改良したもので、水中性能の向上と騒音の低減のため、1軸のみ大型の5枚羽根プロペラを搭載した。"
 SWE_sub_hull_small_single_2:0 "シェーオルメン級"
 SWE_sub_hull_small_single_2_desc:0 "シェーオルメン級（シーサーペント）は、1960年代後半にスウェーデン海軍のために建造された潜水艦のクラスである。ティアドロップ型の船体で、150m（490フィート）までの潜航が可能だった。配備当時は、世界で最も先進的な非核潜水艦クラスの1つと見なされていた。"
 SWE_sub_hull_small_single_3:0 "ヴェステルイェートランド級"
 SWE_sub_hull_small_single_3_desc:0 "1987年、スウェーデン海軍のヴェステルイェートランド級通常動力型潜水艦が就役し、最後のドラケンII級が退役することになった。"
 SWE_sub_hull_small_single_4:0 "ゴットランド級"
 SWE_sub_hull_small_single_4_desc:0 "スウェーデン海軍のゴットランド級潜水艦は、スウェーデンのコクムス造船所で設計・建造された近代的なディーゼル・エレクトリック式潜水艦である。世界で初めてスターリングエンジン式空気独立型推進装置（AIP）を搭載し、水中での耐久性を数日から数週間に延ばした潜水艦である。"
 SWE_sub_hull_large_single_0:0 "ネプトゥーン級"
 SWE_sub_hull_large_single_0_desc:0 "ネプトゥーン級潜水艦は、コクムス社によって建造されたスウェーデンの潜水艦クラスである。最初の潜水艦は1942年に進水し、ネプトゥーン、ナヤート、ネッケンの合計3隻が建造された。"
 SWE_sub_hull_large_single_1:0 "ハイェンⅢ級"
 SWE_sub_hull_large_single_1_desc:0 "ハイェン級（シャーク級）は、コクムス社によって建造され、スウェーデン海軍で使用された潜水艦クラスである。設計はドイツのXXI型潜水艦クラスの影響を受けている。1954年から1958年にかけて合計6隻が建造され、1980年まで使用された。"
 SWE_screen_hull_medium_2:0 "ストックホルム級"
 SWE_screen_hull_medium_2_desc:0 "ストックホルム級はスウェーデン海軍の2隻の軍艦。1984年から1985年にかけてカールスクルーナでコルベットとして建造され、4基のRBS-15対艦ミサイル、1門の57mm砲、数門の機関砲を装備している。2017年に同クラスの2隻が再建され、現在は哨戒艇として活躍している。しかし、対艦ミサイル搭載のオプションは残されている。"
 SWE_screen_hull_medium_3:0 "ヨーテボリ級"
 SWE_screen_hull_medium_3_desc:0 "ヨーテボリ級は、スウェーデン海軍のコルベット級で、1986年から1993年にかけて建造された。同級はもともとソ連の潜水艦や水上艦を撃破するために設計され、8発のRBS-15対艦ミサイル、魚雷、57ミリ砲1門、40ミリ砲1門を装備している。"
 SWE_screen_hull_medium_4:0 "ヴィスビュー級"
 SWE_screen_hull_medium_4_desc:0 "ヴィスビュー級はスウェーデン海軍で使用されている軍艦である。ヨーテボリ級、ストックホルム級に続いて採用された最新のコルベット級である。視認性の低いレーダー反射断面積と赤外線シグネチャーを重視した設計で、ステルス艦としての能力から国際的に広く注目されている。"
 SWE_screen_hull_heavy_0:0 "ヴィスビュー級"
 SWE_screen_hull_heavy_0_desc:0 "ヴィスビュー級は、スウェーデンの第二次世界大戦時の駆逐艦クラスである。1942年から1944年にかけて、ヴィスビュー、スンツバル、ヘルシングボリ、カルマルの4隻が建造され、スウェーデン海軍に引き渡された。これらの艦船は、戦時中のスウェーデンの軍備増強の一環であった。この時期、これらの艦船は中立国の警備や護衛艦として使用された。"
 SWE_screen_hull_heavy_1:0 "Öland Class"
 SWE_screen_hull_heavy_1_desc:0 "The Öland class was a Swedish destroyer class. From 1943 to 1947 two destroyers were constructed, HSwMS Öland and HSwMS Uppland."
 SWE_screen_hull_heavy_2:0 "Halland Class"
 SWE_screen_hull_heavy_2_desc:0 "The Halland-class destroyers were two ships built for the Swedish Navy in the 1950s. Four ships were planned, but the second pair were canceled. Two modified ships were exported to the Colombian Navy. These vessels were general purpose surface combatants."
 SWE_screen_hull_heavy_3:0 "Östergötland Class"
 SWE_screen_hull_heavy_3_short:0 "Östergötland Class"
 SWE_screen_hull_heavy_3_desc:0 "The Östergötland class were a class of destroyers built for the Swedish Navy in the late 1950s. They were smaller and less capable than the preceding Halland class and were decommissioned in 1982. The class were the last destroyers built by Sweden in the 20th century. They were sometimes referred to as Light destroyers."
 SWE_battle_hull_light_0:0 "ゴットランド級"
 SWE_battle_hull_light_0_desc:0 "HSwMS Gotland was a seaplane cruiser of the Swedish Navy built by Götaverken. The design of the ship started out in December 1926 as a seaplane carrier with room for twelve aircraft.[1] When presented with the design, Sweden's Naval Construction Board decided that it wanted the ship to have cruiser and minelaying functions as well as operating as a seaplane carrier."
 SWE_battle_hull_light_1:0 "Tre Kronor Class"
 SWE_battle_hull_light_1_desc:0 "The Tre Kronor class or Three Crowns class was a class of two cruisers built for the Swedish Navy during World War II, comprising Tre Kronor and Göta Lejon."
 SWE_battle_hull_light_2:0 "Tre Kronor Class Refit"
 SWE_battle_hull_light_2_desc:0 "The Tre Kronor class or Three Crowns class was a class of two cruisers built for the Swedish Navy during World War II, comprising Tre Kronor and Göta Lejon."