l_japanese:
 The_Chinese_Civil_war:0 "The Chinese Civil War"
 chinapeace.1.t:0 "アメリカが休戦を求める"
 chinapeace.1.d:0 "The civil war in China has not gone well for us. Communist forces have advanced far and the nation is being destroyed at the second. Today we have received a message from the US Government, offering an equal armistice under their and the UN's supervision. We will be protected from foreign threats by the USA while the armistice is in place. Our enemies have also gotten this offer."
 chinapeace.1.a:0 "Accept, it's the best for us and the best for the people of China."
 chinapeace.1.b:0 "No! We will fight on to the end, even if we have to flee to Taiwan!"
 chinapeace.2.t:0 "アメリカが休戦を求める"
 chinapeace.2.d:0 "It has been a hard fight. Our forces are brutally fighting for control of China with millions of soldiers and civilians dying. Today we have received a message from the US Government, offering an equal armistice under their and the UN's supervision. We will be protected from foreign threats by the USA while the armistice is in place. Our enemies have also gotten this offer."
 chinapeace.2.a:0 "Accept, it's the best for us and the best for the people of China."
 chinapeace.2.b:0 "No! Chiang and his dogs will be hanged!"
 chinapeace.3.t:0 "Chinese Civil War Armistice"
 chinapeace.3.d:0 "Our efforts have been successful. Both the ROC and the PRC have agreed to the ceasefire. Now we have to achieve a political solution."
 chinapeace.3.a:0 "We did it!"
 chinapeace_prc_accept:0 "PRC accepts China Armistice"
 chinapeace_roc_accept:0 "ROC accepts China Armistice"
 chinapeace_prc_deny:0 "PRC refuses China Armistice"
 chinapeace_roc_deny:0 "ROC refuses China Armistice"
 marshall_mission:0 "Marshall Mission"
 ROC_taiwan:0 "The Republic of China has escaped to Taiwan"
 chinese_civil_war.1.t:0 "End of the Ma Clique"
 chinese_civil_war.1.d:0 "We have defeated the forces of Ma Bufang and captured Qinghai. This means that ROC supply lines to Xinjiang are cut, and their administration in the province is quickly collapsing. Remaining Ma forces are defecting to us."
 chinese_civil_war.1.a:0 "The end of Chiang is near."
 chinese_civil_war.2.t:0 "[GetNewspaperHeader]End of the Ma Clique"
 chinese_civil_war.2.d:0 "The Communist Party of China has occupied Qinghai and the forces of Ma Bufang have surrendered. This is a major blow to the Republic of China, as this means that their rule in Xinjiang has collapsed. Even more so, as Ma Bufang's remaining forces are now joining the CPC."
 chinese_civil_war.2.a:0 "Rest in peace!"
 CCW_Over:0 "The Chinese Civil War has ended"
 Student_Exchange_Program:0 "学生交換計画"
 USA_ETR.0.t:0 "東トルキスタン情勢"
 USA_ETR.0.d:0 "東トルキスタンにおける中央権力の崩壊は、血なまぐさい内戦へと発展した。中華民国が中国本土で勝利を収めたことで、注目はその極西辺境の運命へと移っている。この地域は現在、ソビエト連邦から武器と資金を供与されたアブドゥルケリム・アッバス率いる共産主義勢力と、同省を中華民国およびより広範な反ソ陣営にとどめようとするマスード・サブリ率いる反共連合という、激しく対立する2つの派閥に分裂している。オアシスと草原の各地で衝突が激化しており、ソ連顧問団は共産主義者側で公然と活動していると報じられている。この紛争は、ソ連領中央アジアの国境と、東方の中華民国支配下の各省を不安定化させる恐れがある。ワシントンでは、政策立案者たちがこの戦闘を、ウイグル人の自決をめぐる地域的闘争であると同時に、モスクワと自由世界の世界的対立における新たな戦線でもあると見ており、アメリカ合衆国が同地域により直接的に関与すべきかという問題が浮上している。"
 USA_ETR.1.t:0 "President [USA.GetLeader] Suggests Uyghur Seat at UN"
 USA_ETR.1.d:0 "A difficult situation"
 USA_CCWr.1.t:0 "中国内戦とチャイナ・ロビー"
 USA_CCWr.1.d:0 "中国内戦が決定的局面に近づくなか、国民党は迫り来る上海をめぐる戦いに備え、一方で共産党軍は華北と華中での戦果を固めている。ワシントンでは、中華民国に同情的な政治家、実業家、活動家の連合体であるチャイナ・ロビーが、ますます声を強めている。彼らは、統一された反共中国の戦略的重要性を理由に、蒋介石へのさらなる強力な米国支援を要求している。政権内の批判派は、太平洋での長年の戦争を経た後、世論が新たなアジア戦争を望んでいないこともあり、関与を深めれば費用のかかる勝ち目のない紛争に巻き込まれる危険があると警告している。国務省は依然として意見が割れており、全面支援の地政学的価値と過剰関与の危険を天秤にかけている。中国情勢が急速に動くなか、大統領はロビーの要求に応じるのか、それとも慎重な距離を保つのかを決断しなければならない。"
 USA_CCWr.1.a:0 "最終的な選択を下さねばならない……"
 USA_CCWr.2.t:0 "チャイナ・ロビーからの反発"
 USA_CCWr.2.d:0 "蒋介石軍への援助拡大に消極的な我々の最近の姿勢は、チャイナ・ロビーからの怒りの反応を引き起こした。議会と報道機関では裏切りとの非難が上がっており、政権の姿勢は共産主義者の勝利をほぼ確実にするものだと主張する者もいる。ロビーの代表者たちは、国民党を見捨てることはアジア全域における米国の信用を傷つけ、ソビエト連邦を勢いづかせ、反共同盟国を遠ざけることになると主張している。ホワイトハウスは、さらなる援助は国民党が勝てない戦争を長引かせ、アメリカの資源を消耗させるだけかもしれないと反論している。水面下では、ロビーは世論運動を組織し、自らの要求を妨げていると見なされる者に選挙上の報復を示唆している。大統領は今、ロビーを懐柔するのか、それとも現在の方針を堅持するのかを決断しなければならない。"
 USA_CCWr.2.a:0 "現方針を堅持する"
 USA_CCWr.3.t:0 "ビリーガー作戦の終結とチャイナ・ロビーからの批判"
 USA_CCWr.3.d:0 "ビリーガー作戦、すなわち中国国民党の活動を支援するための戦後の米海兵隊派遣の終了は、チャイナ・ロビーから激しい非難を浴びている。彼らは、このような重大な局面で米軍を撤退させることは国民党を脆弱な立場に置き、東アジアに対する米国の関与が揺らいでいるという合図になると主張している。軍事顧問たちは、ビリーガー作戦は決して期限のない任務として意図されたものではなく、これを継続すれば共産主義勢力との直接衝突を招く危険があると指摘している。しかし、ロビーはこの撤退を孤立主義者の勝利であり、ソ連が支援する反乱勢力への危険な譲歩だと見ている。今や選択肢は、国民党を安心させるために再び軍事的関与を行うか、中国内戦におけるアメリカの直接的軍事的役割を終える決定を堅持するかのどちらかである。"
 USA_CCWr.3.a:0 "国民党はもう終わりだ"
 USA_CCWr.4.t:0 "チャイナ・ロビーの激怒"
 USA_CCWr.4.d:0 "ワシントンが蒋介石へのさらなる支援を行わないとの知らせは、政治的な大嵐を引き起こした。議員、出版人、献金者、亡命者支援者から成る同盟であるチャイナ・ロビーは、共産主義の勝利を目前にした重要な同盟国を見捨てたとして、政権を非難している。社説は我々を宥和主義だと糾弾し、議会事務所には電話が殺到し、選挙での報復をほのめかす脅しも寄せられている。ロビー指導者たちは、支援の撤回はアジアにおける米国の信頼性を打ち砕き、モスクワを勢いづかせ、アメリカは信用できないと主張する者たちに道義的優位を明け渡すことになると論じている。政権内部では、我々の資源には限りがあり、これ以上の介入は戦場の趨勢を変える見込みがほとんどないまま、終わりの見えない関与を招く危険があると主張する者もいる。一方で、今沈黙すれば、太平洋の向こうでは撤退と受け取られるだろうと警告する者もいる。我々はロビーをなだめるか、制御するか、それとも正面から対決するかを決めねばならない。"
 USA_CCWr.4.b:0 "残念だ"
 USA_CCWr.8.t:0 "台湾総督の決定"
 USA_CCWr.8.d:0 "台湾が確固としてアメリカの占領下に置かれる中、ワシントンは同島の総督に誰を任命すべきかという重大な決断に直面している。この役職は単なる行政職ではなく、戦略的な意味を持つ。台湾は急速に、東アジアにおける米国の戦力投射の要石となりつつあるからだ。中国・ビルマ・インド戦域での兵站指揮で知られる尊敬すべき戦略家、アルバート・ウェデマイヤー将軍は、インフラ整備、行政サービスの改善、防衛能力の強化に重点を置いた、秩序立った方針を提示している。その慎重な姿勢は、大胆な行動よりも安定を優先する者たちに支持されている。一方、名高いフライング・タイガースのカリスマ的指揮官であるクレア・シェンノート将軍は、台湾を反共作戦の積極的な拠点とする構想を描き、航空戦力の拡充と国民党残存勢力との協力を主張している。どちらの選択にも外交上のリスクと利益が伴い、中華民国亡命政府、ソビエト連邦、そしてより広範な国際社会との関係に影響を及ぼすことになる。この決定は、台湾の統治と、展開しつつある冷戦におけるその役割を形作ることになる。"
 USA_CCWr.8.a:0 "アルバート・ウェデマイヤーを任命する"
 USA_CCWr.8.b:0 "クレア・シェンノートを任命する"
 USA_CCWr.7.t:0 "国民党将軍たちの台湾亡命"
 USA_CCWr.7.d:0 "本土最後の国民党拠点が崩壊する中、著名な中国人将軍の一団が避難を求め、アメリカ管理下の台湾に到着した。その中には、内戦における最重要作戦のいくつかを指揮した高級将校たちを伴った李宗仁代理総統も含まれている。彼らの脱出は、アメリカ合衆国にとって政治的機会であると同時に、潜在的な厄介事でもある。一方では、これらの亡命指導者たちは、反共中国人抵抗運動の中心としての台湾に正統性をもたらし、忠誠派ネットワークに関する貴重な情報とつながりも有している。他方では、彼らの存在は、国民党の大義を悩ませてきた根深い対立、腐敗疑惑、政治的内紛を持ち込む危険もある。アメリカ当局は今、微妙な均衡を迫られている。これらの人物を島の行政と防衛に組み込むか、安定を維持するためにその影響力を制限するかである。この選択は、アジアにおける共産主義拡大に対する、より広範な米国戦略の中で台湾が果たす役割に影響を及ぼすことになる。"
 USA_CCWr.7.a:0 "新たな同盟者を歓迎しよう"
 USA_CCWr.9.t:0 "1948年中国援助法の復活"
 USA_CCWr.9.d:0 "東アジアでの戦闘が新たな局面に入るなか、政権は1948年中国援助法の復活を求める圧力を受けている。支持派は、資金、信用供与、軍需品の提供を再開すれば、中国本土の港湾における友好勢力の支配を固め、通貨を安定させ、アメリカ産業にとって不可欠な経路を開き続けられると主張している。彼らは、前回の計画が行き詰まったのは支援の到着が遅く、一貫した監督を欠いていたためだと述べている。批判派は、大規模な移転は汚職、派閥政治への巻き込まれ、国内予算の引き締めを求める納税者からの反発を招く危険があると反論している。財務省と国務省は、無償援助と条件付き融資を組み合わせ、顧問とともに監査官を派遣し、改革と治安に関する明確な目標に援助を結びつける改訂案を提案している。国防総省は、地上軍を投入せずに即応性を高めるため、予備部品と通信機器の迅速な供給を支持している。議会は耳を傾け、チャイナ・ロビーは結集し、同盟国はアメリカの決意を示す合図を注視している。この決定は、西太平洋における我々の姿勢を定めることになる。"
 USA_CCWr.9.a:0 "同法を全面的に復活させる"
 USA_CCWr.12.t:0 "再び勢いづくチャイナ・ロビー"
 USA_CCWr.12.d:0 "国民党の勝利は、ワシントンのチャイナ・ロビーを大いに沸き立たせた。財界指導者、宣教師、中国戦線の退役軍人、影響力ある議員たちは今や、この勝利がより強力な支援を求める長年の主張の正しさを証明したと論じている。彼らは輸出信用の拡大、文化交流、そして第一列島線全域に友好的勢力を根づかせる安全保障枠組みを提案している。その運動は、戦場での成功、反共感情、そして共有された戦時の歴史を強調している。しかし、この急激な盛り上がりは、えこひいきとの非難、不透明な資金集め、連邦議会での連携構築を複雑化させる圧力戦術といった、なじみ深い懸念も再燃させている。ホワイトハウスは、エスカレーションを恐れる欧州のパートナーや、協議の席につくことを望む地域同盟国との関係を管理しながら、ロビーの計画とどこまで足並みをそろえるかを決断せねばならない。世論は好意的ながら慎重であり、費用と明確な目標に関心を向けている。ロビーを受け入れれば、自信を示すことになる。一定の距離を置けば、柔軟性を保てる。いずれの道も、アジアにおける予算、外交、戦略を形作ることになる。"
 USA_CCWr.12.a:0 "朗報だ"
 USA_CCWr.13.t:0 "蒋介石による南京協定の提案"
 USA_CCWr.13.d:0 "勝利の余勢を駆って、国民党政府は南京協定として知られる包括的な地域安全保障構想を提示した。この構想は、友好的なアジア諸国の間で相互防衛体制を築き、米国の訓練使節団、海上監視、協調的な輸出規制によってこれを支えることを想定している。支持者たちはこれを、破壊工作に対する実践的な盾であり、安全なシーレーンと結びついた経済発展の基盤であると説明している。彼らは、情報共有、合同演習、装備の標準化を、低コストで抑止力を相乗的に高める手段として挙げている。懐疑派は、正式な関与が対抗ブロックの形成を招き、中立国との関係を悪化させ、現在の展開地域から遠く離れた危機への対応を米国に義務づける恐れがあると警告している。法律顧問は、条約規定には上院の同意が必要になると指摘しており、国防総省はまず協議フォーラムと有事計画部門から始めることを提案している。同盟国はワシントンの立場を問いただしている。我々の反応は、内戦後のアジア安全保障構造の形成において、我々がどこまで踏み込む用意があるのかを示すことになる。"
 USA_CCWr.13.a:0 "ひとまず動向を見守ろう"
 USA_CCWr.14.t:0 "高まる共産主義への恐怖"
 USA_CCWr.14.d:0 "中国本土における国民党支配の崩壊は、ワシントンとより広範なアメリカ世論に衝撃を与えた。新聞各紙は、東欧からアジアへと広がる共産主義の包囲網が狭まりつつあると警告し、有力な論者たちは中国の陥落が警戒不足の直接的な結果であると主張している。連邦議会の公聴会では、すでに国務省内における同調者疑惑の調査が進められており、各種団体は大学、労働組合、報道機関にわたる思想審査を求めている。情報機関は、海外での共産主義勢力の勝利が国内の細胞を勢いづかせ、本国の脆弱な層を狙ったプロパガンダを強化すると警告している。一部の政策立案者は、忠誠審査制度の拡大、移民規制の強化、海外の反共運動への資金拠出増加を推し進めている。これに対し、別の者たちはパニックを戒め、疑念に満ちた空気が市民的自由と団結を損ないかねないと警告している。それでも空気は変わりつつある。今や党派を超えた政治家たちは、共産主義を国外と国内の双方における、この時代を定義する脅威と見なしている。"
 USA_CCWr.14.a:0 "ろくな結末にはならない"
 USA_CCWr.15.t:0 "中華民国陸軍における米国の影響力拡大"
 USA_CCWr.15.d:0 "本土喪失後、中華民国陸軍が台湾で再編を進める中、米国の顧問、将校、援助当局者は、その将来を形作るうえでますます大きな役割を担うようになっている。軍事使節団は訓練計画を再編し、近代的な通信機器を導入し、作戦ドクトリンの見直しを進めている。民間の専門家たちは兵站、インフラ、情報調整について助言し、しばしば高級将官と直接連携している。こうした援助の流入は島の防衛力と士気を高める一方で、米国の存在感の深まりを主権侵害と見る一部の国民党指導者の間に不安も引き起こしている。米国当局者は、自らの役割は一時的なものであり、共産主義への抵抗を強化することのみを目的としていると主張している。しかし舞台裏で政治的策動が進んでいるとの噂は絶えず、孫立人将軍のような人物が米国顧問団との緊密な関係を通じて影響力を増している。この協力と自律の微妙な均衡が、台湾の安定と中華民国の存続を形作ることになる。"
 USA_CCWr.15.a:0 "懸念すべき事態だ……"
 USA_CCWr.5.t:0 "[GetNewspaperHeader]アメリカによる中国放棄"
 USA_CCWr.5.d:0 "ワシントンは、蒋介石政権に対する大規模な軍事援助や顧問支援をもはや提供しないと発表し、国民党の大義に対する20年にわたる不安定な米国支援を事実上終わらせた。この決定は、費用、腐敗、そして本土での戦況悪化をめぐる激しい議論の末に下されたものである。支持者たちは、これは限界を冷静に認識した結果だと述べる一方、批判者たちは、東京からデリーに至るまで響き渡る撤退の合図になると警告している。南京と、台北へ移転しつつある各省庁では、この発表は鉄槌のように受け止められた。避難、統合、第三国仲介者への働きかけに向けた計画が始まったと報じられている。モスクワはアメリカの後退を歓迎し、ロンドンは冷静さを求め、パリはシーレーンを注視している。アメリカ国内では、影響力あるチャイナ・ロビーが選挙での報復を約束する一方、国防総省の立案者たちは海空戦力を中心とする、より広範な太平洋態勢へと軸足を移している。これがしがらみの終わりなのか、それとも空白の始まりなのかはまだ分からない。確かなのは、アメリカの銃が前線から消えたことで、アジアの均衡が再び傾いたということだ。"
 USA_CCWr.5.a:0 "アジアの転換点だ"
 USA_CCWr.6.t:0 "[GetNewspaperHeader]アメリカによる台湾占領"
 USA_CCWr.6.d:0 "蒋介石への大規模支援の終了後、劇的な動きとして、米軍は台湾に一時的な軍事占領体制を敷いた。当局者はこの行動を、より広範な戦争を防ぎ、シーレーンを確保し、国民党権力が崩壊する中で民間人を保護するための安定化措置だと説明している。この体制は、海軍・文民合同使節団によって管理され、夜間外出禁止令、港湾統制、限定的な報道監督を課しつつも、現地制度を尊重すると約束している。台北は慎重ながら協力姿勢を示している。一方、国民党強硬派は連絡証の列に並びながらも、外国による「信託統治」を非難している。北京は「帝国主義的奪取」と糾弾し、即時撤退を要求している。国際連合では、国際監督または期限付き委任統治を求める声が高まる一方、ロンドンとキャンベラはさらなるエスカレーションに対する緩衝地帯を密かに歓迎している。国内では、批判者が任務の際限なき拡大を非難し、支持者は代替案が危険な空白だと主張している。今のところ、アメリカ国旗は急いで塗り替えられた港湾標識とともに空を分かち合っている。不安定な太平洋における最新の前線である。"
 USA_CCWr.6.a:0 "暫定的な安全策か、新たな関与か？"
 USA_CCWr.10.t:0 "[GetNewspaperHeader]米海兵隊の青島帰還"
 USA_CCWr.10.d:0 "1940年代後半の戦後派遣を思い起こさせる動きとして、米海兵隊が港湾都市青島に帰還した。公式声明では、この任務はアメリカ国民の保護、海上安全保障の支援、そして進行中の内戦における友好的な中国勢力への兵站支援を目的とする限定的派遣であると説明されている。現地の反応はまちまちであり、国民党当局は新たな駐留を関与の証として歓迎する一方、批判派はワシントンが不平等な外国特権の時代を復活させていると非難している。ソビエト連邦はこの派遣を帝国主義的侵入として糾弾し、満洲の共産党宣伝は中国の地に外国軍がいるという光景を利用している。一方、海軍作戦立案者は、同市が太平洋作戦において戦略的な位置にあることを強調している。今のところ、星条旗は青島の埠頭に再び翻り、補給トラックの轟音と内陸から遠く響く銃声の間に、緊張をはらんだ静けさが広がっている。"
 USA_CCWr.10.a:0 "アメリカ軍にとって馴染み深い港だ"
 USA_CCWr.11.t:0 "[GetNewspaperHeader]中国への米国介入"
 USA_CCWr.11.d:0 "アメリカ合衆国は、中国内戦への直接関与に陸海空軍を正式に投入した。この決定は、断固たる行動を取らなければ中国本土は完全に共産主義勢力の支配下に落ちると介入支持派が主張した、ワシントンでの数週間にわたる激しい議論の後に下された。最初の戦闘部隊は主要沿岸都市に上陸し、国民党部隊との共同司令部を設置したと報じられている。議会の支持派はこの動きをソ連の拡張に対する抵抗として称賛する一方、反対派は長期化する新たな対外戦争を警告している。北京では、共産党指導部がアメリカ人を「炎と鋼をもって」迎え撃つと誓い、モスクワはこの動きを米国の帝国主義的野望の証拠として位置づけている。太平洋の向こう側では、紛争の拡大を警戒する日本とフィリピンが密かに防衛態勢を強化している。中国の戦場にとって、米軍の到着は終わりの兆しを見せない戦争における決定的で、かつ拡大につながりかねない転換点を意味する。"
 USA_CCWr.11.a:0 "大胆な一歩か、それとも危険な賭けか？"
