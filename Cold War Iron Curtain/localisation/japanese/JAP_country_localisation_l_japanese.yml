 POLITICS_NOBUSUKE_KISHI_DESC: "1920年代から1930年代初頭にかけて、俊英官僚であった岸信介は世界の主要工業国を巡り、その経済政策を研究した。帰国後、彼は国家主導の経済成長を信奉するようになった。1930年代半ばまでに日本陸軍は満洲国の経済政策を全面的に岸へ委ねた。彼は経済成長を監督した一方で、1940年に帰国するまで汚職や労働搾取にも関与していた。戦時中には複数の内閣で主に軍需大臣として務めた。終戦後は拘束されたものの、日本人以外の労働者に対する苛烈な搾取へ深く関与していたにもかかわらず、刑事訴追は免れた。彼はアメリカの裁判を正当なものと見なさず、日本の独立を主張するため保守支持層の組織化を図った。与党自由党の一員でありながら、吉田茂首相がアメリカに過度に依存しているとして積極的に批判し、その足元を揺さぶっている。しかし現時点では、自由党内で保守諸派をまとめて日本社会党に対抗できる力量ゆえに、岸はアメリカによる公職追放を免れている。"
 POLITICS_SHIGERU_YOSHIDA_DESC: "1946年の総選挙で自由党が勝利すると、連合国当局はただちに党首の鳩山一郎が首相に就任することを阻止した。その代わりに首相の座に就いたのが吉田茂である。吉田茂は1906年に外交官となり、第二次世界大戦中には日本が連合国との和平に向かうよう積極的に働きかけた。長年にわたり親米・親英的傾向を持っていたこの職業外交官は、占領当局にとって理想的な首相であった。首相就任以来、吉田は日本経済の再建を目指して経済重視の政策に注力してきた。外交面では、アメリカとの安全保障提携の構築を進めている。経済を優先し、防衛をアメリカに委ねるこの方針は、いわゆる吉田ドクトリンだとする向きも多い。吉田は日本国内の民族主義勢力の残滓を抑え込みつつ、自らの政策が日本に繁栄と安全をもたらすことを国民に示さねばならない。さもなくば、アメリカの傀儡と見なされる危険がある。"
 JAP_National_Projects_Category: "日本の開発計画"
 JAP_National_Projects_Category_desc: "日本は、インフラ、技術、エネルギーといった基幹部門を強化することで経済を押し上げる革新的な施策を模索している。これらの施策は、経済発展を促進し、成長を持続させ、新たな機会を活かしながら国民に豊かな未来をもたらすことを目的としている。これらの事業へ戦略的に投資することで、我々は自国の強みを活用し、経済基盤をより強固なものにしていく。"
