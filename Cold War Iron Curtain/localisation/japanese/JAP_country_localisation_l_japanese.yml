 jap_dissolution_event_title: "衆議院解散"
 jap_dissolution_event_description: "次期総選挙の準備に伴い、国会の衆議院（下院）は正式に解散された。これにより下院の全議席は空席となり、総選挙の終了と新たな衆議院議員の選出まで、予定されていたすべての会期は停止される。"
 jap_dissolution_event_response: "了解。"
 jap_heaven_dissolution_event_title: "「天の声」による解散"
 jap_heaven_dissolution_event_description: "先月首相に指名された鳩山一郎は、自らの民主党が衆議院で過半数を持たなかったため、戦略的に社会党の左右両派から支持を取り付けていた。この協力の見返りとして、鳩山は社会党諸派に対し、早期の国会解散を約束していた。\n\n本日、衆議院本会議で行われた政府三演説に対する代表質問は、思わぬ展開を迎えた。鳩山は、一万田尚登大蔵大臣とともに、社会党議員の長正路に対する答弁に立った。その後、通商産業大臣の石橋湛山が答弁のため登壇した。\n\nしかし議事はここで急転する。衆議院議長の松永東が突然石橋を遮り、「石橋湛山君、石橋湛山君……」と切迫した声で呼び止めたのである。場に一瞬の緊張が走ったのち、松永は「石橋大臣、しばらくお待ちください」と続けた。そして民主党議員団と社会党諸派の期待が最高潮に達したところで、松永は「ただいま内閣総理大臣から詔書が出されましたので、朗読いたします」と告げた。続いて松永は、「日本国憲法第七条により、衆議院を解散する」との詔書を読み上げた。前例のないことに、衆議院内は拍手に包まれ、議員たちは待ち望んだ解散を祝って「万歳、万歳」と叫んだ。\n\nその後、ある新聞記者に解散の時期について問われた鳩山は、こともなげに「天の声がしたからだ」と答えた。"
 jap_heaven_dissolution_event_response: "天の啓示ということか？"
 jap_treaty.1.t: "[GetNewspaperHeader]サンフランシスコ講和条約"
 jap_treaty.1.d: "本日、日本と連合国との間でサンフランシスコ平和条約が48か国により正式に調印された。この条約は、日本の帝国としての地位を公式に終わらせ、第二次世界大戦中の日本の戦争犯罪によって被害を受けた連合国民間人および元捕虜への補償を定め、さらにアメリカ主導の連合国による戦後占領を終結させて主権を回復するものである。本条約は、連合国の目的を明示するにあたり、国際連合憲章と世界人権宣言を広範に援用している。会議の当初から、ソビエト連邦はアメリカが作成した条約草案に対し、強硬かつ声高な反対を表明していた。またこの条約は、台湾がどの国へ引き渡されるのか明確に規定していないため、台湾の法的地位という問題も生じさせた。そのため台湾独立支持者の一部は、台湾の主権はなお未確定だと主張している。加えて日本は、第11条に基づき極東国際軍事裁判およびその他の連合国戦争犯罪裁判所の判決を受諾した。\nもっとも、調印された条約はまだ発効していない。それでもこの日は、日本とその国民にとって大きな意味を持つ。ついに占領から解放される日が見えてきたのだから。"
 jap_treaty.1.a: "独立へまた一歩近づいた！"
 jap_treaty.1.b: "国連憲章は成功だった！"
 JAP_Treaty_of_San_Francisco_event_tt: "§G§C1952年4月28日§!に占領は終結し、§Y日本§!は§Y独立§!する§!!"
 jap_treaty.2.t: "[GetNewspaperHeader]日本、主権を回復"
 jap_treaty.2.d: "東京の中心で、連合国対日理事会が最後の会合を開くなか、歴史が大きく動いた。サンフランシスコ講和条約は発効し、占領という足枷はついに打ち砕かれた。ソ連の苦々しい非難は、再生した国家の歓声の中にかき消されていく。連合国占領はもはや過去のものとなり、日本は外国支配の最後の残り火を消し去って主権を取り戻した。昭和天皇は揺るぎない声で、戦禍に傷ついた国民へ新たな自由の宣言を力強く語りかけた。人々が新時代の夜明けを抱きしめるなか、街には歓喜があふれている。かつて占領下にあった日本は、灰の中から蘇る不死鳥のごとく、第一生命館の上に真紅の日の丸を翻し、自由諸国の一員として堂々と立ち上がった。\n\n長年の敵対を経て、日本とアメリカはいまや友となり、ほぼ10年ぶりに在ワシントン日本大使館も再開された。新しい時代の太陽は昇ったのである。逆境を乗り越えた国家の不屈の精神を証明するかのように、日出づる国は世界に向かって再び輝きを放っている。"
 jap_treaty.2.a: "こうして我々の新たな道が始まる！"
 jap_treaty.2.b: "平和が続かんことを。"
 jap_treaty.6.t: "日ソ漁業協定"
 jap_treaty.6.d: "ブルガーニン・ラインが北海道の漁業に悪影響を及ぼしたため、日本政府は状況を打開すべくソビエト連邦との交渉を余儀なくされた。事態の緊急性を認識した鳩山首相は、自民党の有力者であり農林大臣でもある河野一郎を首席交渉役に任命した。\n\n河野は間髪入れず使節団を率いてモスクワへ飛び、ソ連漁業相アレクサンドル・イシコフとの協議を開始した。しかし河野はさらに踏み込み、ソ連首相本人との直接交渉を要求した。交渉は5月9日に始まり、河野はソ連首相と直談判を重ねた（外交筋では、河野は通訳なしで会談をこなしたとも噂されている）。\n\nそして本日、長い協議を経て日ソ漁業協定は無事妥結し、正式に調印された。この協定には、ブルガーニン・ラインによる制限を緩和し、苦境に立つ北海道の漁民に一筋の希望を与える内容が含まれている。ただし同時に、日本漁船が200海里水域内で漁獲できる魚種と数量も定められた。さらに、同水域へ入れる漁船の数も制限され、ソ連政府発行の許可証が必要となり、漁獲量の報告と操業日誌の記録も義務づけられた。また、サケ、マス、ニシン、カニなどの資源保護と持続可能な最大生産の維持を図るため、少なくとも年1回開催される日ソ漁業委員会も設置された。\n\n加えて、河野とソ連首相の間にはある「秘密協定」が存在するとの噂も流れている。交渉中、河野がソ連側の提示した条件を受け入れたのではないかというのである。すなわち、従来の制限海域での操業を認めてもらう見返りに、河野は係争中の択捉島・国後島返還要求を取り下げたのではないか、とされている。\n\nとはいえ、冷え込んでいた外交関係の雪解けは、さらなる対話への道を開いた。日ソ交渉は7月31日に再開されることが確認されている。"
 jap_treaty.6.a: "余計な制限だが、ないよりはマシだ。"
 jap_treaty.6.b: "我々の寛大さに感謝すべきだ。"
 jap_treaty.8.t: "[GetNewspaperHeader]日ソ共同宣言"
 jap_treaty.8.d: "盛大な儀礼と外交的華やかさのなか、共同宣言の調印式はクレムリンの広間で執り行われた。壇上には、日本側から鳩山首相、河野農林大臣、外交特使の松本が立ち、対するソ連側にはブルガーニン首相とドミトリー・シェピーロフ外相が並んだ。\n\nこの宣言は、両国間の重要な合意を明らかにした。戦争状態の終結、国交回復、主権の相互尊重と内政不干渉が確認され、さらにソ連が日本の国際連合加盟を支持すること、日本人捕虜の帰還を進めることも盛り込まれた。しかし、領土問題への明示的言及がなかったため、解釈には隔たりが残った。日本は付随する松本・グロムイコ書簡を係争地域交渉継続の約束と受け取った一方で、ソ連は包括的な共同宣言に照らせば重要性の低い点にすぎないとみなした。\n\nこうした含みは残るものの、両国関係は協力と相互繁栄を志向する新たな章へ踏み出した。"
 jap_treaty.8.a: "この平和が末永く続くことを願おう。"
 jap_treaty.8.b: "冷戦のただ中にも、平和の瞬間はある。"
 jap_yoshida.1.t: "内閣不信任案が可決"
 jap_yoshida.1.d: "本日、鳩山一郎は、民主党・社会党左派・社会党右派の要人である岸信介、和田博雄、浅沼稲次郎とともに、衆議院議事堂内の常任委員長室に集った。\n\n政界の大物たちが協議を重ねるなか、記者団と報道陣はその周囲に群がり、ひっきりなしのフラッシュで一挙手一投足を追っていた。会談の行方を待つ国会全体には、緊張と期待が満ちていた。\n\n激しい協議の末、民主党を代表する鳩山一郎は、不信任決議案を机に置き、力強く署名した。そして右隣にいた腹心の岸信介へ笑みを浮かべながら「これでいいかね、岸君？」と確認を求めた。煙草をくゆらせていた岸は、にやりと笑って「結構です」とうなずいた。岸の承認を得た書面は、思わぬ協力者である社会党右派・左派の指導者、和田博雄と浅沼稲次郎へ回された。二人も署名し、この政局転換への意思を明確に示した。文書が完成すると、野党指導者たちは、傍らで成り行きを見守っていた衆議院議長の堤康次郎へそれを手渡した。堤は穏やかな笑みを浮かべ、野党代表たちの労をねぎらいながら受け取った。\n\nその日の後半、衆議院本会議で不信任案は採決に付され、可決された。"
 jap_yoshida.1.a: "結局、避けられなかったか。"
 jap_yoshida.2.t: "吉田内閣、総辞職"
 jap_yoshida.2.d: "吉田内閣の命運をめぐる不透明な情勢が続くなか、衆議院議長の堤康次郎が不安げな報道陣に対応するため国会議事堂前へ姿を見せていた。そこへ突然、福永健司官房長官が切迫した表情で駆け寄ってくる。「堤さん！ 堤さん！」と叫びながら、彼は吉田首相本人からの正式な通知を手渡した。堤が慎重に文面へ目を通すうち、重大な事態が動き始めていることが明らかになった。\n\n堤はすぐさま臨時の記者会見を整え、報道陣を呼び集めて重大発表に備えた。無数のフラッシュが瞬くなか、沈痛な面持ちの福永が通知の内容を読み上げる。ついに吉田内閣は総辞職に踏み切ったのである。\n\nほどなくして記者たちは首相官邸へ殺到し、次々に出入りする公用車へカメラを向けた。そのうちの一枚には、不機嫌そうな表情で後部座席に座る緒方竹虎副総理の姿が収められていた。未確認情報によれば、衆議院解散を考える吉田と、それに強く反対した緒方との間で激しい口論があり、最終的に緒方が吉田を説得して辞職を選ばせたという。\n\n一方、民主党本部では議員たちがラジオを囲み、公式発表に耳を傾けていた。吉田内閣総辞職の報が広がるや、室内は歓喜に包まれた。万歳の声が上がり、党首脳に鬱積していた安堵と喜びが一気に噴き出した。\n\n辞職の効力は10日に生じ、次期首相には鳩山一郎が就任する見込みである。"
 jap_yoshida.2.a: "さらば吉田、長い政権だった。"
