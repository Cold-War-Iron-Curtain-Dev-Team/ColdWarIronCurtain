 JAP_National_Radicalism_GUI_info_text: "§Y勢力均衡§!は、§Y極右勢力§!と§Y極左勢力§!の綱引きを表している。勢力均衡自体には補正効果はないが、一部のディシジョンや国家方針では、いずれかの陣営が一定以上の影響力を持つことが条件となる場合がある。\n\n§Y不穏度§!は、その名の通り、左右両陣営による政治活動の激しさを表している。不穏度が高まるほど、国民精神§Y極右活動§!または§Y極左活動§!による影響も深刻化する。\n\n§Y現在の問題§!は、左右両方の急進勢力の不穏度を高めている原因を一覧にしたものである。ただし、これらの問題を手動で取り除くことはできないため、この一覧は主に雰囲気や没入感を高めるためのものとなっている。時間の経過とともに、特定のイベント、ディシジョン、国家方針によって問題が追加または削除される。\n\nゲームを通じて、上記のシステムに良くも悪くも影響を及ぼすさまざまなイベントや国家方針が発生する。日本の安定を維持するため、自らの選択には十分注意しなければならない！"
