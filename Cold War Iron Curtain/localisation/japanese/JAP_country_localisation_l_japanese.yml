 JAP_The_Yoshida_Administration_desc: "戦争の惨禍による敗北と占領の灰燼の中に日本が立たされていた先行き不透明な時代、冷静かつ堅実な指導力の必要性は痛切なまでに明らかとなった。この脆弱な局面において、経験豊富な外交官にして現実主義的な愛国者である吉田茂が、国家を極めて繊細な変革へと導く役目を託されたのである。\n\n吉田政権の成立は、日本の政治的再建と国家復興における転換点となるだろう。平和的発展、経済再建、国際協調を通じた国家再建を固く信じる吉田は、革命家のような燃え盛る情熱ではなく、責任の重さを理解する政治家としての静かな決意を胸に首相の座に就いた。"
 JAP_Establish_the_Yoshida_School_desc: "In the delicate aftermath of war and under the watchful eyes of the Allied Occupation, Japan was faced with the choice of whether to regain strength through the older ambitions or rise anew by following a different path. Among the other options considered, Japan chose the latter under the firm hand of Prime Minister Yoshida Shigeru. The result of this choice became the framework of what is referred to as Yoshida Gakko, a guiding attitude, a strategy of self-control, and a declaration of priorities for a humbled but determined Japan.\n\nInstead of going for hasty rearmament and provocative diplomacy, the other method, which Yoshida opted for intentionally and calmly, left the national focus on economic recovery, industrial modernization, and social stability."
