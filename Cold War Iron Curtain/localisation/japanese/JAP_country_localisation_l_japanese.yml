 jap_yoshida.46.t: "[GetNewspaperHeader]Establishment of the Japanese Self-Defense Force"
 jap_yoshida.46.d: "In the wake of the post-occupation era, Japan's evolving stance on Article 9 of its Constitution paved the way for enhanced military capabilities. The Cold War climate further compelled Japan to recognise the imperative of self-defense capabilities in global affairs. Backed by U.S. support, this culminated in the establishment of a Defense Agency and the conversion of the National Security Force into the 'Japan Self-Defense Forces' – a military in all but nomenclature. However, its role is strictly limited to self-defense purposes while closely monitored by the US. The JSDF, comprising the JGSDF, JASDF, and JMSDF, emerges as a response to the geopolitical situation, ensuring Japan's preparedness for self-defense while navigating the delicate nuances of its constitutional framework. Despite the limitations, the JSDF's formation bolsters the Western bloc's delicate stance in Asia, underscoring Japan's freshly asserted national sovereignty."
 jap_yoshida.46.a: "A critical decision for our security."
 jap_yoshida.47.t: "[GetNewspaperHeader]Great Showa Consolidation"
 jap_yoshida.47.d: "Japan has undergone multiple waves of municipal consolidations since the Meiji Restoration. The newly proposed 'Great Showa Consolidation' will help the nation’s efforts to cope with the changes brought about by the so-called post-war reforms, especially the government acting under the new Constitution of 1947 as well as the Local Autonomy Law of 1947.  Under this postwar local government system, the roles of municipalities were enhanced and they were charged with the responsibility of operating junior high schools, carrying out fire prevention activities, and dealing with social welfare matters. With the steadily growing population, and thus, growing number of junior highschoolers, as well as the junior high school system being newly-introduced, running them is bound to burden each individual municipality.\nFor this purpose, the Great Showa Consolidation will be underpinned by two municipal merger laws in order to make running the junior highschools effective as well as polish the municipal administration. This will also help utilise the small land area of the country for booming industry and urbanisation."
 jap_yoshida.47.a: "Great!"
 jap_yoshida.48.t: "レッド・パージ"
 jap_yoshida.48.d: "「トルーマン・ドクトリン」が近ごろ発表されたことで、アメリカは共産主義に対する断固たる姿勢を明らかにし、日本もまた極左過激派の一掃対象とされた。前年には、アメリカの外交官ジョージ・ケナンがマッカーサーに穏健政策の転換を迫るなか、春から夏にかけて日本の主要都市で労働者、学生、教員による一連のデモが行われ、社会不安が表面化した。当然ながら、ワシントンの承認を得た占領当局と第8軍は、これらの運動を強硬に弾圧した。悪名高い「阪神教育事件」は4月に発生した。アメリカ政府と日本の文部省の指示を受けた日本当局が、日本国内で運営されていた私立朝鮮人学校を閉鎖したのである。こうした措置は、学校への共産主義者の浸透を懸念した結果だといわれている。さらに同年9月には、左派寄りの政治家で当時の日本首相であった芦田均が、悪名高い「昭和電工事件」をめぐり、閣僚の一部とともに逮捕された。\n前年の出来事が残した生々しい記憶に加え、経済の先行き不安、日本共産党の政治活動、そして全学連の結成を考えれば、放置された極左勢力が全国へ広がることは避けられない。したがって、赤化の脅威に対する弾圧を継続しなければならない。"
 jap_yoshida.48.a: "必要な措置だった……"
 jap_yoshida.49.t: "Izuru Senpu"
 jap_yoshida.49.d: "As the part of the ongoing 'Red Purge' to curb the growing communist threat in Japan, the GHQ's Civil and Information and Education Section has made plans to ensure the education system stays pure from any far-left ideals. For this purpose, the authorities dispatched Dr. Walter C. Eells, who serves at the GHQ as an advisor on higher education, to thirty national universities to call for immediate dismissal of communist-sympathising professors and staff. Eells also visited Niigata University and labelled communism as \"dangerous and destructive doctrine\". Due to his ideals, anti-communism is slowly becoming a nationwide sentiment and openly shunned by the national newspapers. Plus, there have been noticeable dismissals of far-left sympathisers from educational institutes, mostly over irrelevant reasons. This endeavour is commonly known as the 'Eells Typhoon', or 'Izuru Senpu', as we call it.\n\nSome people argue that Eells's actions are a blatant suppression of academic freedom in Japan, while some would defend him, claiming that the CIE was never directly involved in the red purge. Either way one thing remains clear, that the 'Izuru Senpu' is a critical element in the ongoing red purge."
 jap_yoshida.49.a: "Good for him."
 jap_yoshida.50.t: "[GetNewspaperHeader]Shimoyama Incident"
 jap_yoshida.50.d: "The first president of Japanese National Railways, Sadanori Shimoyama, was recently found dead on the Joban Line, Adachi, after reported missing yesterday. Based on the official autopsy led by Professor Tanemoto Furuhata, it was determined that Shimoyama died prior to being hit by the train, with blood loss being possible due to the lack of blood on the body. Additionally, in some parts of the body, internal bleeding was found, which could have been caused only by considerable force, such as kicking. On the other hand, it is also believed that Shimoyama's death was suicide. However, the internal bleeding observed was also consistent with being hit by a train, and investigators would not have been able to observe blood at the scene because it was raining.\n\nA few days prior to his death, Shimoyama was ordered for personnel cutbacks of JNR under the Dodge Line policy and released a list of 30,000 employees to be fired. It is rumoured that he recieved death threats from the high level US military officials to make sure he goes through with the order, which could have caused severe mental distress and hence, possible suicide. On the other hand, there are even rumours that some of the listed employees to be fired could be involved one way or another. Nonetheless, the incident remains a mystery."
 jap_yoshida.50.a: "Shocking"
 jap_yoshida.51.t: "[GetNewspaperHeader]Mitaka Incident"
 jap_yoshida.51.d: "Today, a runaway unmanned train travelling at the speed of about 60 km/h broke through a buffer stop and plunged into a nearby shopping street, killing six people and injuring twenty, at Mitaka Station, Chuo Main Line. Investigation authorities have arrested ten Kyosan-to workers, and a former train driver, Keisuke Takeuchi, over suspicions of a possible joint conspiracy as part of the far-left activism. However, the final trial and the court ruling on the matter is yet to happen.\n\nThis incident occured not too long after the recent Shimoyama Incident, where the first JNR president, Sadanori Shimoyama, was found dead on the Joban line, and people have already begun to question the authenticity of finger-pointing at the Japan National Railway Union (Kokuro) and the Kyosan-to over these two incidents."
 jap_yoshida.51.a: "Questionable."
 jap_yoshida.52.t: "[GetNewspaperHeader]Matsukawa Derailment"
 jap_yoshida.52.d: "Another railway incident happened, unsurprisingly. Today, a Tohoku Main Line passenger train derailed and overturned by a curved track section, en route from Aomori Station to Ueno Station. The locomotive overturned, killing three crewmen; however, none of the 412 passengers were injured or killed. Investigators discovered that the bolts and nuts on the track joints had been loosened, and a large number of railroad spikes fixing the rails to the sleepers had been removed, along with a spanner and pry bar in a nearby rice paddy. As usual, suspicion immediately fell on the Kokuro, workers at the nearby Toshiba-Matsukawa factory and the Kyosan-to workers, due to recent protests over staff cuts. Ten workers from the Matsukawa plant and ten JNR employees were indicted and charged with sabotage.\n\nThe fact that this, along with the recent Shimoyama and Mitaka incidents happened within the span of two months, a conspiracy theory has sprouted that the GHQ with the help of the US intelligence perpetrated the incidents as a pretext to arrest the members of Kokuro and Kyosan-to to thwart any possible far-leftist activism."
 jap_yoshida.52.a: "Coincidence?"
 jap_yoshida.53.t: "Formation of Keiretsus"
 jap_yoshida.53.d: "As the winds of change sweep across our nation, we must confront the legacy of our past. The Zaibatsus, once the economic powerhouses of Japan, are no more. In their place, a new economic order is emerging – the Keiretsus. These conglomerates, made up of remnants of the old zaibatsus, are poised to shape Japan's economic future. Today, we have made a crucial decision that will determine the course of our nation's economy. The old zaibatsus were shackled by post-war restrictions that limited their influence and stifled economic growth. By lifting these restrictions and encouraging the formation of Keiretsus, we can expect to unleash the full potential of our industries. This will lead to increased economic output, technological innovation, and improved competitiveness on domestic stage."
 jap_yoshida.53.a: "It's for the better."
 jap_yoshida.54.t: "The CVH Proposal"
 jap_yoshida.54.d: "As the nation's security and defense remain a top priority, a decision awaits. A new 'CVH Proposal' has been put forward, a strategic initiative aimed at enhancing the country's naval capabilities. However, the proposal's potential for political backlash raises questions about its immediate approval. The CVH Proposal, crafted after extensive deliberation by defense experts, seeks to bolster research and development efforts focused on carriers and helicopters for the JMSDF. The initiative presents a significant opportunity to strengthen Japan's maritime security, as it would provide the JMSDF with modern and versatile assets necessary for safeguarding the nation's territorial waters and contributing to international security efforts. Carriers and helicopters form the backbone of any effective naval force, enabling swift deployment of personnel, supplies, and equipment over vast maritime territories.\n\nHowever, it is important to acknowledge that implementing this proposal may attract mild political backlash as the opposition believes that doing so will violate the pacifist constitution and would contribute to an unnecessary arms race."
 jap_yoshida.54.a: "The pacifist constitution must be respected."
 jap_yoshida.54.b: "National security above all!"
 jap_yoshida.55.t: "Pearl of Asia"
 jap_yoshida.55.d: "Japan's recent diplomatic and economic resurgence has not gone unnoticed across Asia. As our industries recover and our influence steadily expands, some abroad have begun to describe our country as a new 'Pearl of Asia'."
 jap_yoshida.55.a: "Interesting."
 jap_yoshida.55.b: "Japan stands proud."
 jap_yoshida.55.c: "We will watch this closely."
 jap_yoshida.55.e: "Concerning."
 jap_yoshida.56.t: "The National Police Reserve"
 jap_yoshida.56.d: "With the ongoing war in Korea, and with both the authorisation and request from the Supreme Command of the Allied Powers, the Japanese Government has taken the decision to establish the National Police Reserve. This force is not only intended to address potential external threats but also to maintain domestic stability, especially concerning our fragile political situation, where domestic unrest is very possible.\n\nSince the complete dissolution of iur military following our defeat in the war, we have remained disarmed for nearly half a decade. Now, for the first time, we are raising arms again—not as a military resurgence, but for national security. However, it must be acknowledged that with Article 9 still in place, the NPR’s role is strictly limited to security and public order. This force is in no way a standing army, and its size is carefully restricted to 75,000 personnel, ensuring that it remains a defensive and non-military entity."
 jap_yoshida.56.a: "Necessary step."
 jap_yoshida.57.t: "The Coastal Safety Force"
 jap_yoshida.57.d: "After the establishment of the National Police Reserve as a land security force, there was a discussion regarding the creation of a similar force dedicated to maritime security. Following Japan's defeat in 1945, its navy was completely dissolved, and the coast guard was left with limited resources—restricted to patrol boats with minimal armament and even restrictions on their speed and range; this left our country vulnerable in terms of its maritime defense capabilities. However, with the outbreak of the Korean War, the SCAP grew increasingly warm to the idea of Japan expanding its defense capabilities. This change in policy was evident in the approval to establish the NPR, which is a clear sign of the changing stance towards Japan’s defense needs. In line with this, discussions have now led to the establishment of the Coast Safety Force, a newly formed security force tasked with protecting Japan's maritime borders and securing its waters.\n\nAs Japan moves forward in this effort, there are ongoing discussions with US officials regarding the possibility of leasing US-made frigates and other vessels to facilitate the Coast Safety Force’s operational capabilities."
 jap_yoshida.57.a: "Great news."
 jap_yoshida.58.t: "Japan-US Ship Lease Agreement"
 jap_yoshida.58.d: "Following the SCAP's authorisation for Japan to establish the Coast Safety Force, discussions between the US and Japanese officials have led to a significant decision in aiding their maritime defense capabilities. Recognising the strategic importance of securing Japan’s territorial waters amid the ongoing Korean War, the US has decided to lease a fleet of vessels to support Japan's newly formed security force.\n\nAs part of this agreement, Japan will receive 18 Tacoma-class and 55 Yuri-class patrol boats, providing the necessary foundation for maritime operations. Additionally, joint training programs and operational guidance will be arranged to ensure the seamless integration of these ships into Japan’s security force."
 jap_yoshida.58.a: "Our Pacific allies."
 jap_yoshida.58.b: "Our Pacific allies."
 jap_yoshida.59.t: "[GetNewspaperHeader]The Self-Defense Forces Act"
 jap_yoshida.59.d: "With Japan’s recovery well underway and its international standing rising after the signing of the peace treaty, the need of strengthening its own defense capabilities has become increasingly clear. The Cold War tensions in East Asia, with the recent war in Korea and the continued presence of the Soviet Union and China as regional threats, have further cemented the need for self-reliance in national security. In response, Japan has enacted the Mutual Security Assistance Agreement, obligating the nation to take greater responsibility for its own defense.\n\nFollowing this, the Defense Agency Establishment Law and the Self-Defense Forces Act have been passed and these laws have come into effect. The National Safety Agency has been reorganised into the Defense Agency, and its military branches have been reformed with the establishment of the JGSDF, the JASDF, and the JMSDF."
 jap_yoshida.59.a: "A necessary step for our self-defense, in the name of the Emperor."
 jap_yoshida.60.t: "The National Safety Agency"
 jap_yoshida.60.d: "With the ongoing tensions in East Asia, Japan has taken another step in rebuilding its security forces under American supervision. Following the establishing of the National Police Reserve and the Coastal Safety Force, the need for a more structured and organised security force became evident. Because both the NPR and CSF were separate security force organisations, their command integration was bare-bones. Though up until now, responding to these concerns, the National Safety Agency has now been officially formed as a centralised organization overseeing both the NPR and the newly created Coast Safety Force, and to integrate their command structures too. The NSA, while technically a civilian agency under the Prime Minister’s Office, effectively serves as a proto-military structure, allowing Japan to develop defense capabilities while still adhering to Article 9 of the constitution. The move has been backed by the SCAP."
 jap_yoshida.60.a: "Excellent."
 jap_yoshida.61.t: "Letter from Douglas MacArthur"
 jap_yoshida.61.d: "Dear Mr. Prime Minister:\n\n     In keeping with my established policy to re-invest autonomous authority in the Japanese Government as rapidly as the situation permits, I have visualised the progressive development of law enforcing agencies adequate to the maintenance of internal security and order and the safeguard of Japan's coastline.\n\n     Insofar as maritime safety in the harbors and coastal waters of Japan is concerned the Maritime Safety Board has achieved highly satisfactory results but the events disclose that safeguard of the long Japanese coastal line requires employment of a larger force under this agency than is presently provided for by law.\n\n     Accordingly, I authorise your government to take the necessary measures to establish a national police reserve of 75,000 men. The appropriate sections of this Headquarters will be available, as heretofore, to advise and assist in the technical aspects of these measures.\n\nVery sincerely,\nDOUGLAS MacArthur"
 jap_yoshida.61.a: "Acknowledged."
 jap_yoshida.62.t: "[GetNewspaperHeader]A Brawl in the House of Representatives!"
 jap_yoshida.62.d: "Roughly three weeks ago, an ammendment bill to the Police Law was passed by the House of the Representatives and the session was scheduled to conclude on this date. However, due to unkown reasons, the Speaker of the House of the Representatives, Yasujiro Tsutsumi, proposed a two-day extension of the session.\nBelieving the extension to be invalid and unnecessary, the opposition members barred the Speaker from taking his seat in an attempt to overturn the proposed extension. Left with no other choice, the Speaker summoned the Diet police to maintain order and discipline; though, it only escalated the situation as the house members and the police engaged in a brutal brawl./nFortunately, the incident didn't result in severe injuries, although a handful had to be hospitalised. The session has been extended for two days as proposed, though this incident will certainly bring unpleasant consequences."
 jap_yoshida.62.a: "Politics!"
 jap_yoshida.63.t: "Validity of the Session's Extension"
 jap_yoshida.63.d: "With the recent unexpected extension of the session and a subsequent brawl, many are questioning its validity. It is asserted that when extending the session of the Diet, the Speaker of the House of Representatives must consult with the President of the House of Councillors before the House of Representatives makes a resolution. Deciding to extend the session based solely on the will of the House of Representatives from the start is a prominent flaw; plus, the Speaker was not present on his seat when the extension was announced. However, a counter-argument from others is that the majority of the House of Representatives decided to extend the session, which was accepted by the House of Councillors. Moreover, the Speaker could not take his seat due to obstruction. It can also be interpreted that in case of emergency, the will of the House of Representatives alone is sufficient by the nature of the extension of the session. Either way, it is nearly impossible rule out whether the extension was valid or not."
 jap_yoshida.63.a: "Indeed ambiguous."
 jap_yoshida.64.t: "Session Extended till 15th June"
 jap_yoshida.64.d: "Although, the 19th House of the Representatives session was originally extended till today, 5th June, the Speaker has proposed to further extend the session till 15th June. This is mostly due to the major parties being absent for the last two days, especially the both Right and Left Socialist Parties; presumably as a protest for the recent extension of the session and the subsequent brawl that unfolded between the house members and the summoned Diet police. Thus, under these circumstances, no unanimous decision could be made over the Police Law ammendment bill which impelled the Speaker to once again extend the session."
 jap_yoshida.64.a: "Better be careful than hasty."
 jap_yoshida.65.t: "Police Law Ammendment Bill Successful!"
 jap_yoshida.65.d: "Yesterday, during deliberations in the House of Councillors' Committee on Local Administration, an interim report was submitted for discussion in the plenary session, where the ammendment bill was passed and enacted. It was promulgated just today, and was approved with most votes in favour of the bill. Therefore, there are no more obstructions for the enforcement of the Police Law."
 jap_yoshida.65.a: "Finally!"
 jap_yoshida.66.t: "Korea"
 jap_yoshida.66.d: ""
 jap_yoshida.66.a: ""
 jap_yoshida.66.b: ""
 jap_yoshida.67.t: "破壊活動防止法の制定"
 jap_yoshida.67.d: "吉田内閣は、日本共産党が引き起こした騒乱への対応として、先ごろ破壊活動防止法を施行した。この法律は、公共の秩序を乱して暴力を扇動する破壊活動に従事する団体に対し、政府がその活動を制限する命令を下し、重大な場合には解散させる権限を与えるものである。しかし、この法律は反対にも直面し、とりわけ日本社会党は、憲法上の権利を侵害するとして法案に異議を唱えた。彼らはさらに、吉田内閣が過去の全体主義的慣行へと逆戻りしているとまで非難した。法案の起草段階では総評や全学連の各団体が抗議したものの、デモに伴う暴動と暴力の激化は、政府にその制定をさらに強く迫ることとなった。\n\nこうした批判に対し、吉田内閣は次の声明を発表した。「この法律が必要とされるのは、我が国の組織的集団に属する一部の分子が、危険なテロ活動を行っているからである。誠に遺憾ではあるが、さまざまな文書において、憲法およびその下に成立した政府を打倒することの正当性と必要性を唱える危険な活動が明らかとなっている。こうした活動はさらに、武装テロやゲリラ戦によって、その目的の実現へと向かおうとしているように見受けられる。加えて、この活動は国際的なつながりを持つ組織的集団によって遂行され、その勢力は強大で、広範に展開されているようである」"
 jap_yoshida.67.a: "法と秩序に妥協の余地はない。"
 jap_hatoyama.1.t: "[GetNewspaperHeader]Hatoyama Sworn In as Prime Minister"
 jap_hatoyama.1.d: "Today marks a huge turn in national politics as Ichiro Hatoyama assumes the title of Prime Minister, triumphing over days of political hurdles and rivalries with the Yoshida Party. Following the mass resignation of the Yoshida Cabinet yesterday, Hatoyama swiftly appointed his new cabinet, with Mamoru Shigemitsu as Vice Prime Minister. After six years of unbroken conservative rule, the Jiyu-to faction concedes power to the Minshu-to, leaving them disheartened. Notably, former Prime Minister Yoshida steps down as party chairman, passing the torch to Taketora Ogata.\n\nA charismatic diplomat, Hatoyama pledges to enhance Japan's global standing through diplomatic engagements with the USSR and United Nations membership. And despite the odds with the former chairman of Jiyu-to, Hatoyama has also expressed a desire to unite the two conservative parties."
 jap_hatoyama.1.a: "Conservative government begins anew."
 jap_hatoyama.31.t: "Domnitsky Letter"
 jap_hatoyama.31.d: "Being a key part of his agenda, Hatoyama has shown his enthusiasm for negotiations with the Soviet Union. In response, the Delegation of the Soviet Union to Japan contacted the Prime Minister, and on 7th January as well as today, Andrei Domnitsky, the Deputy Chief of Mission, paid secret visits to the Otowa Palace and expressed his desire to negotiate with the Soviet side on a number of matters of concern. Today, Domnitsky handed Hatoyama a document with the name of 'Domnitsky Letter', which did not contain the sender's name or date, but rather a  'document from the Soviet Government'. The letter states as follows:\n\n     \"The USSR, prompted by its eagerness to normalise relations with Japan, has, as is well-known, consistently advocated the adjustment of bilateral relations throughout. The well-known declaration of readiness to normalise relations between the USSR and Japan, among other things, is contained in the Sino-Soviet Joint Declaration and the statement of the USSR Foreign Minister.\n     It is also known to the public that you, Mr. Prime Minister, have expressed your support for the settlement of Japan-Soviet relations in your recent statement. The hope for the normalisation of Japan-Soviet relations was also expressed by Foreign Minister Shigemitsu in his statement of December 11, 1954 and in subsequent statements.\n     Taking these circumstances into consideration, the Soviet side believes that it would be appropriate to exchange views on the measures to be taken for the normalisation of relations between Japan and the Soviet Union.\n     The Soviet side is prepared to appoint representatives for negotiations to be held either in Moscow or Tokyo and would like to know the Japanese side's intentions in this regard.\""
 jap_hatoyama.31.a: "Let's hope efforts are actually made."
 jap_hatoyama.32.t: "Japan-Soviet Friendship Event Held at Shimoda"
 jap_hatoyama.32.d: "Today marked a harmonious occasion as the Japan-Soviet cultural exchange event unfolded at the Gyokusen-ji Buddhist Temple in the city of Shimoda, Shizuoka Prefecture. Attended with genuine interest by Shimoda city officials and esteemed foreign guests from the USSR, the event aimed to foster cultural understanding between Japan and the Soviet Union.\n\nThe Gyokusen-ji Temple, where this gathering took place, holds a significant role in the history of Japan-Russia relations. It stands as the very location where Admiral Putyatin and his delegation stayed during the deliberations leading to the signing of the Treaty of Shimoda in 1855 between the Russian Empire and the Tokugawa Shogunate. The temple, steeped in historical significance, has witnessed the forging of diplomatic ties that have stood the test of time. During the event, Mrs. Irina Nikolayena, a distinguished professor at Tokyo University of Foreign Studies, and Mr. Anushevsky paid respects at the graves of four Russian sailors interred within the temple grounds, who lost their lives during their stay in Shimoda.\n\nAdding a melodic touch to the proceedings, Russian musicians graced the occasion with the enchanting tunes of their homeland. Balalaikas echoed through the temple as they played Russian folk songs, including the classic \"On the Shore of Lake Baikal.\" The music served as a cultural bridge, transcending language barriers and creating an atmosphere of mutual appreciation."
 jap_hatoyama.32.a: "Lovely!"
 jap_hatoyama.33.t: "Negotiations Begin for Japan-Soviet Relations"
 jap_hatoyama.33.d: "With the Japanese Prime Minister Ichiro Hatoyama's eagerness for negotiations, both diplomatic offices of Japan and the USSR have agreed to arrange negotiations, starting today. The Japanese diplomatic mission, led by Shunichi Matsumoto, departed from Haneda Airport, Tokyo, where he was seen off by families of Japanese prisoners-of-war still detained in the Soviet Union, hoping that the talks will be able to bring them back home. The Japanese diplomatic mission met with the Soviet diplomatic mission led by Yakov Malik in the Soviet Embassy located in London, and negotiations have begun.\n\nBoth parties hope for smooth talks, but controversial issues, especially the Kuril Islands issue, will be inevitably brought up and dealt with, hopefully with no disagreements. The atmosphere is marked by a sense of cautious optimism as diplomats engage in discussions to find common ground and establish a foundation for improved relations between the two nations. The families of the detained Japanese prisoners-of-war anxiously await the outcome, hoping that these negotiations will pave the way for their loved ones' return."
 jap_hatoyama.33.a: "Obstructions are to be expected regardless."
 jap_hatoyama.34.t: "National Convention for the Return of Northern Territories"
 jap_hatoyama.34.d: "The national convention took place at Hibiya Public Hall, Tokyo. Co-sponsored by the Congress for the Return of the Kuril Islands and the Habomai Islands, the Hokkaido Association for the Promotion of Northern Fisheries, the Hokkaido Association, and the Hokkaido Government, it advocated for the expansion of fishing areas and the return of fishing ports. The convention urged Japan-Soviet negotiations in London to address these concerns, emphasising the significance of reclaiming territorial rights and ensuring the well-being of the fishing industry."
 jap_hatoyama.34.a: "These concerns are fully valid!"
 jap_hatoyama.35.t: "Talks Reach a Deadlock over the Kuril Islands Dispute"
 jap_hatoyama.35.d: "After months of negotiations, the diplomatic discourse between Japanese and Soviet envoys has broken down, primarily stemming from the longstanding dispute over the Kuril Islands (Northern Territories).\n\nThe deadlock emerged in August, initially fraught with challenges until a glimmer of hope surfaced. Following an official meeting on August 5th, amidst a tea break in the Japanese Embassy's garden in the UK, Yakov Malik, head of the Soviet delegation, unexpectedly hinted at a potential concession: the possible handover of Habomai and Shikotan islands to Japan. This indication materialised into an official proposal during a subsequent meeting on the 9th, wherein the Soviet Union formally suggested the return of Habomai and Shikotan. Yet, hopes for a breakthrough were dashed when a confidential telegram from Japanese envoy Shunichi Matsumoto to Prime Minister Hatoyama, advocating for the acceptance of the offer, was intercepted and discarded by Foreign Minister Shigemitsu.\n\nPushed by the Foreign Ministry officials and American diplomats, Shigemitsu and his allies urged for a more assertive stance, demanding the return of all four islands, including Etorofu and Kunashiri. Later on August 27, a directive from the Japanese Ministry of Foreign Affairs was telegraphed to Matsumoto: \"We must not compromise on the return of two islands. We must insist on the return of four islands.\" Despite the directive, Soviet resistance remained unyielding. The Soviet side was not willing to make more concessions and immediately rejected the proposal to return all four islands. As a result, the talks broke down and no compromise was reached.\n\nAs negotiations crumbled, the Soviets retaliated by unilaterally imposing the 'Bulganin Line,' prohibiting Japanese fishing vessels from accessing parts of Kuril Islands waters, in an evident reprisal for the diplomatic deadlock. Not only it has resulted in strained relations between the two countries, but the fishing industry of Hokkaido has suffered a big loss due to the Bulganin Line restrictions. With both sides entrenched in their positions, the prospect of a resolution to the disputed territory issue remains distant."
 jap_hatoyama.35.a: "A prime example of our complicated relations with the Russians..."
 jap_hatoyama.35.b: "They get what they deserve!"
 jap_hatoyama.37.t: "Prime Minister Hatoyama's State Visit to USSR"
 jap_hatoyama.37.d: "Prime Minister Hatoyama's state visit to the Soviet Union commenced amidst great anticipation. Departing from Haneda Airport on a Scandinavian Airlines propeller plane at 9:15 pm on October 7th, Hatoyama, accompanied by his envoy including his wife Kaoru Hatoyama, Minister of Agriculture Ichiro Kono, and diplomatic advisor Shunichi Matsumoto, embarked on a 6-day journey to Moscow. Upon their arrival at Moscow Airport, a warm and welcoming atmosphere enveloped Hatoyama's envoy. The Soviet Premier himself, exuding hospitality, greeted them with a smile. To mark the occasion, the strains of Kimigayo resonated through the air, courtesy of the Soviet army band.\n\nThe backdrop of this visit is underscored by the diplomatic complexities in Hatoyama's prior communications with the Soviet leadership. He sent a personal letter to the Soviet Premier, where he laid out his basic policy of the upcoming negotiations, which was to shelve the territorial issue for future negotiations, and to end the state of war, exchange ambassadors, repatriate Japanese POWs detained in USSR, support Japan's accession to the United Nations, and formally enact the fisheries agreement. Despite initial acceptance of Hatoyama's conditions by the Soviets, concerns lingered regarding the territorial issue. Hence, Hatoyama re-dispatched Shunichi Matsumoto to secure a firm commitment to future negotiations over territorial issues. Matsumoto met with Andrei Gromyko, Vice-Minister of Soviet Foreign Affairs, and handed him a letter requesting a firm commitment to continue negotiations. Gromyko responded in a letter: \"We agree to continue negotiations regarding the conclusion of a peace treaty, including territorial issues, after normal diplomatic relations between the two countries are resumed.''\n\nBack to present time, with negotiations to commence in few days, the stage is set for Minister Kono to engage in preliminary consultations with Secretary [SOV.GetLeader], paving the way for Prime Minister Hatoyama to finalise the diplomatic dialogue with the Soviet Premier. Hopefully, this time a finally agreement is reached between the two countries."
 jap_hatoyama.37.a: "Do your best, Hatoyama-san!"
 jap_hatoyama.37.b: "Let's hope they do not mess it up this time."
 jap_hatoyama.39.t: "[GetNewspaperHeader]Fighting Ends in Home Island!"
 jap_hatoyama.39.d: "Following the Soviet landing on the Japanese Home Islands, a series of intense and sporadic battles broke out, ultimately leading to Japan's formal surrender to the advancing Soviet Army.\n\nEmperor Hirohito, who had been previously spared from prosecution by the Supreme Command of Allied Powers during the 1940s due to his symbolic role in Japanese culture, now faces a new trial. In a historic move, Hirohito has been compelled to abdicate the throne and cede power to his eldest son, Akihito. Akihito has been appointed the Chairman of the newly established National Diet.\n\nTo oversee the transition and administration of the Japanese-occupied territories, Soviet commander Konstantin Rokossovsky has been designated as the interim administrator. His role will involve managing the region until a new constitution is drafted, establishing a framework for governance that reflects the ideals of the new political landscape in Japan."
 jap_hatoyama.39.a: "Another American Ally has fallen..."
 jap_hatoyama.40.t: "[GetNewspaperHeader]Japan New Constitution"
 jap_hatoyama.40.d: "After Japan's defeat, the Soviet Union commissioned the Japanese Communist Party to begin drafting a new Constitution. The day finally arrived when the Japanese Communist Party merged with the Left Faction of the Japanese Socialist Party, forming a new party called the Japanese Peasant and Worker’s Party. As stated in the new Constitution, this party became the sole legal party and the guiding force for the nation.\n\nThe United States and other NATO allies condemned this development, viewing it as an act of imperialism in Japan. The American President expressed shock and anger at the idea of Japan becoming another Soviet puppet state.\n\nKenji Miyamoto was elected as the new party chairman and, consequently, the Prime Minister of Japan. Meanwhile, Prince Akihito, the son of former Emperor Hirohito, was appointed as the President of Japan."
 jap_hatoyama.40.a: "The Red Sun has Risen."
 jap_hatoyama.41.t: "A Humiliating Peace"
 jap_hatoyama.41.d: "The Soviet advance and the collapse of the Home Islands front have forced Tokyo into an impossible position. Ministers argue fiercely over whether the government should swallow the humiliation, end the fighting, and preserve what remains of the nation, or continue a hopeless struggle at catastrophic cost.\n\nAny decision to seek peace on Soviet terms would provoke outrage in Washington and among those who still believe Japan must never bend before Moscow. Yet with the country exhausted and the war situation beyond repair, the cabinet must now choose between national survival and political disgrace."
 jap_hatoyama.41.a: "Accept the bitter peace."
 jap_hatoyama.41.b: "We will not yield."
 jap_hatoyama.42.t: "[GetNewspaperHeader]Japan Accepts Soviet Peace Terms"
 jap_hatoyama.42.d: "After bitter internal debate and military collapse on the Home Islands, the Japanese government has agreed to end hostilities and accept peace with the Soviet Union. The decision has stunned the international community and sent shockwaves through Washington, where officials see the agreement as a grave strategic defeat in East Asia.\n\nFor Japan, the war is over, but the consequences of this peace will shape the country's future for years to come."
 jap_hatoyama.42.a: "A grim end."
 jap_kishi.11.t: "Formation of the Anpo Kokumin Kaigi"
 jap_kishi.11.d: "As Prime Minister Kishi seeks to establish a new Japan-US Security Treaty, the national politics have been fraught with tension. However, recent events have greatly increased the uncertainity. In the aftermath of Kishi's failed attempt to force through the Police Duties Bill, his credibility has plummeted, tarnishing his reputation as a leader. The public now views him with suspicion, getting unpleasant memories of pre-war authoritarianism from his actions.\n\nThis has strengthened opposition movements, and has culiminated into the formation of Anpo Joyaku Kaitei Soshi Kokumin Kaigi (abbreviated Anpo Kokumin Kaigi). It is a mixed-bag umbrella coalition of 134 leftist organisations, comprising anti-nuclear activists, Zengakuren activists, anti-US base campaigners, socialist and communist parties, labour unions, women's groups, and more. This national organisation aims to organise various \"national actions\" nationwide to stir up masses against Kishi's proposals, where its member organisations would cooperate to conduct protest activities.\n\nThe Anpo Kokumin Kaigi seeks not to negotiate, but to terminate the Security Treaty altogether. Despite Kishi's intentions to present a revised and better Security Treaty to appeal the public, the left-wing agitators remain stubborn in their demand for its complete termination. As tensions escalate and the rift between government and opposition deepens, our country stands at crossroads, where developments could possibly lead to the biggest political turmoil in our nation's history so far."
 jap_kishi.11.a: "Things are only going to snowball from here."
 jap_kishi.12.t: "Details Published of the New Security Treaty"
 jap_kishi.12.d: "Following the collaborative efforts between President [USA.GetLeader] and Prime Minister [JAP.GetLeader] over the past year, the amendments to the 1951 Security Treaty between Japan and the United States have been finalised, with the details now made public.\n\nIn the revised Japan-US Security Treaty, a handful significant changes have been implemented. Firstly, it establishes a commitment for both countries to prioritise the peaceful resolution of international disputes, with a particular emphasis on the United Nations as the primary forum for addressing aggression. Secondly, the revised treaty addresses a longstanding ambiguity by explicitly stating that the United States will come to Japan's defense in the event of an attack by a third party. Additionally, it mandates that the US will engage in consultation with Japan regarding the deployment of its troops on Japanese soil, and states that the Japanese government must be consulted prior to significant changes in US force deployment within Japan or the utilisation of Japanese bases for non-defensive combat operations. Plus, the treaty delineates the respective jurisdictions of both countries concerning crimes committed in Japan by US military personnel.\n\nDespite the considerable improvements in the new treaty compared to the original version signed in 1951, the Anpo Kokumin Kaigi persists in its resistance, driven by the long-held resentment among left-wing agitators against the presence of US bases on Japanese soil. Instead of accepting the revised treaty, the organisation continues to advocate for getting rid of the treaty entirely."
 jap_kishi.12.a: "They are too over-demanding, the new treaty will not be rejected!"
 jap_kishi.12.b: "We can only wish the best for our allies."
 jap_kishi.13.t: "Anpo Hihan no Kai"
 jap_kishi.13.d: "Following the publication of the details of the new security treaty, the nationwide movement has entered a new phase, gradually garnering increased public support. Thus, around 1000 bunkajin (people of culture) – a mixed assortment of intellectuals, artists, writers, performers, and cultural critics – gathered at Hibiya Park, were they founded the Anpo Hihan no Kai, calling themselves the \"Society for Criticising the Security Treaty.\" Operating under this banner, they have aligned with the ongoing movement against the security treaty, engaging in peaceful demonstrations in the streets, at times collaborating with the Anpo Kokumin Kaigi."
 jap_kishi.13.a: "The anti-treaty sentiment is continuously spreading."
 jap_kishi.14.t: "[GetNewspaperHeader]Anpo Kokumin Kaigi 8th United Action"
 jap_kishi.14.d: "Today, the Anpo Kokumin Kaigi organised its 'Eighth United Action' in front of the National Diet compound, aiming for a peaceful and orderly demonstration. However, a group of radicals from the mainstream faction of the Zengakuren, accompanied by allied militant labour unionists, breached the grounds of the National Diet compound, overcoming a guard line consisting of 5000 police officers. Within the compound, they chanted protest songs and engaged in snake dances for several hours before dispersing peacefully. Approximately 26,500 demonstrators participated. This intrusion into the National Diet has drawn widespread condemnation, including from factions within the Anpo Kokumin Kaigi. However, it has also effectively drawn attention to the anti-treaty movement, energising previously inactive groups on the left."
 jap_kishi.14.a: "Outrageous."
 jap_kishi.15.t: "Arrest of Takeo Shimizu"
 jap_kishi.15.d: "As the Chief-Secretary of Zengakuren, with the backing of radicals from the mainstream faction, Takeo Shimizu was a key coordinator in orchestrating the raid on the National Diet grounds on November 27th. To evade arrest, he had taken refuge in the dormitories of the College of General Education at the University of Tokyo's Komaba Campus since last month. Today marked the Anpo Kokumin Kaigi's 'Ninth United Action', prompting Shimizu to leave the University of Tokyo with 1000 students to join Zengakuren's rally in Hibiya. However, they encountered police opposition on their route, resulting in a clash between Shimizu's supporters and law enforcement. After the scuffle, Shimizu was finally arrested and placed under police custody.\n\nMeanwhile, in Osaka, students of Osaka City University organised a strike as part of the Ninth United Action."
 jap_kishi.15.a: "He got what he deserved."
 jap_kishi.16.t: "Unrest at the Haneda Airport"
 jap_kishi.16.d: "Prime Minister Kishi, Foreign Minister Fujiyama, Minister of Foreign Affairs Ishii, and a delegation of plenipotentiaries have departed from Haneda Airport today to the United States to attend the signing ceremony of the new Japan-US Security Treaty. However, their departure was met with fierce resistance. Around 700 radicals from the Zengakuren gathered at the airport in an attempt to prevent the delegation from leaving. The students occupied the lobby, broke into the cafeteria, and erected a barricade. The situation escalated, leading to a confrontation with police forces. Eventually, the authorities cleared the area, arresting seventy-eight students in the process. Despite the disruption, the delegation departed as scheduled and the new security treaty will be signed on the 19th."
 jap_kishi.16.a: "We hope for a fruitful visit."
 jap_kishi.17.t: "[GetNewspaperHeader]Signing of the New Japan-US Security Treaty"
 jap_kishi.17.d: "After roughly two years of negotiations, the new Japan-US Security Treaty has been finally signed in a ceremony held in the East Room of the White House, with both President [USA.GetLeader] and Prime Minister Nobusuke Kishi present. The treaty is a significant improvement from the Japanese perspective, as it commits the US to defend Japan in the event of an attack, requires prior consultation before dispatching US forces overseas, removes the clause for suppressing domestic disturbances, and specifies a 10-year term, after which it can be abrogated with one year's notice.\n\nHowever, despite the improvement, many Japanese especially from the left-wing spectrum still resent the presence of US military bases on Japanese soil and hope to get rid of the treaty entirely. With the treaty signed but awaiting ratification, along with the US President's scheduled visit to Japan this June, the urgency and intensity of the ongoing protests in Japan have only increased."
 jap_kishi.17.a: "Good news and bad news."
 jap_kishi.17.b: "Commendable, but worrying too."
 jap_kishi.17.c: "A costly alliance?"
 jap_kishi.18.t: "[GetNewspaperHeader]The Anpo Struggle"
 jap_kishi.18.d: "With the new security treaty now signed, protests in Japan have intensified, entering a significant phase. The Anpo Kokumin Kaigi is organising more \"united actions\" nationwide, while protestors are becoming more urgent with the limited time before the treaty's ratification and the US President's visit. Demonstrations by left-wing activists in major cities have become commonplace, with mass gatherings and protests in front of the National Diet and the Prime Minister's residence. Occasional clashes between Zengakuren radicals and the police add to the tension.\n\nThe world watches as Japan faces what appears to be the largest protests in its history, slowly plunging the nation into political instability. Whatever the government decides and how it deals with the ordeal, can have impactful and lasting effects on Japan's political future."
 jap_kishi.18.a: "Time to brace ourselves for what's to come."
 jap_kishi.18.b: "Worrisome."
 jap_kishi.18.c: "Turbulent times."
 jap_kishi.19.t: "Socialist Opposition Rising"
 jap_kishi.19.d: "The ratification date for the new Security Treaty has been established, but the National Diet sessions have become a battlefield of words. The opposition Shakai-to is employing every parliamentary delaying tactic available, aiming to drag out the debate and give the anti-treaty movement more time to gather support. Their ultimate goal is to extend the debate beyond the end of the Diet session in May, hoping that this prolonged scrutiny will lead to anti-treaty and anti-Kishi elements within the Jimin-to itself ousting Prime Minister Kishi and shelving the treaty.\n\nThe Socialists' strategy has proven highly effective. Astute questioning by Socialist leaders has brought to light several questionable aspects of the new treaty. Kishi's surly and evasive responses during these sessions have not helped his cause; instead, they have turned the media, previously in favour of the treaty, towards supporting the Socialists' call for more discussion. Key points such as the nature of \"prior consultation\" and the definition of the term \"Far East\" still remains particularly vague and contentious."
 jap_kishi.19.a: "They are only fueling the fire."
 jap_kishi.20.t: "Protests Before the Start of the Next National Diet Session"
 jap_kishi.20.d: "The date of the start of the next National Diet session approaches, and the debates will be mostly centered around the new security treaty. With that, the anti-treaty protestors took to the streets once again. Last week, five thousand protestors gathered in front of the National Diet at night, waving red flags, and holding paper lanterns. Most of the protestors were workers from the Sohyo. Recently, the 13th United Action was organised by the Anpo Kokumin Kaigi, with an assembly at the Ogimachi Public Pool in Osaka where the anti-treaty movement leaders gave impassioned speeches to the crowd. Mass demonstrations were also held in Osaka's Minami Ward."
 jap_kishi.20.a: "An unrestrained rise in political tensions."
 jap_kishi.21.t: "Anpo Ratification Special Measures Committee"
 jap_kishi.21.d: "Recognising the threat to his cabinet and the revised treaty if the Diet were to recess, Prime Minister Kishi has quietly laid plans to secure the treaty's passage at any cost. After being repeatedly thwarted in his efforts to bring the treaty to a vote, particularly due to uncooperative factions within his own party, Kishi has established the top-secret 'Anpo Ratification Special Measures Committee,' rather known by its nickname 'Anpo Tokkōtai.' This committee is tasked with mapping out a strategy to force the treaty through the Diet by any means necessary before the current session ends."
 jap_kishi.21.a: "Reckless idea..."
 jap_kishi.22.t: "Anpo Kokumin Kaigi 16th United Action"
 jap_kishi.22.d: "Today, the nation again witnessed a significant wave of protests as anti-treaty demonstrators held their 16th United Action nationwide, with a strong presence of activists from the Zengakuren. In Tokyo, approximately six thousand students attempted to breach the National Diet grounds. The police, stationed at the main gate, managed to thwart their advance, leading to intense confrontations. Amidst the chaos, determined students were seen scaling police trucks in an effort to push through the barriers.\n\nMeanwhile, in Osaka, the local faction of the Zengakuren organised parallel activities. The Osaka City University saw a complete strike as students called for the abandonment of classes in solidarity with the national movement. A huge rally was held at Oemae Plaza in the eastern ward, drawing large crowds and emphasising their discontent with current treaty policies."
 jap_kishi.22.a: "Their dastardly tactics only continue to grow."
 jap_kishi.23.t: "Protests Beyond Control, and Kishi's Paranoia at the Breaking Point"
 jap_kishi.23.d: "Not only Tokyo, but Osaka has also become hotbed of unrest as demonstrators, frustrated with the ongoing security treaty, took to the streets in a dramatic lantern procession last night. Chants of \"Stop Anpo!\" echoed through the downtown area, signaling widespread discontent. Today, the protests intensified as the Zengakuren faction in Osaka seized the moment to voice their dissatisfaction. The rising subway ticket prices provided the perfect pretext for the demonstrations, which were primarily fueled by opposition to the security treaty.\n\nThe wave of protests has not been confined to Tokyo and Osaka. Major cities across the nation are experiencing similar upheavals. The situation has escalated to the point where up to ten million petition letters denouncing the security treaty have been delivered to the House of Representatives' visiting room.\n\nMeanwhile, Prime Minister Kishi's paranoia is becoming increasingly evident, and it will be no surprise if the mounting pressure would push him towards a reckless decision..."
 jap_kishi.23.a: "We stand at a critical point."
 jap_kishi.24.t: "May 19th Incident"
 jap_kishi.24.d: "With the National Diet session nearing its end and President [USA.GetLeader]'s visit scheduled for June 19th, Prime Minister Kishi enacted his reckless plan. This morning in a \"sneak attack\", the Jimin-to lawmakers abruptly extended the Diet session by fifty days. In retaliation, opposition Shakai-to lawmakers staged a sit-in, blocking House Speaker Ichiro Kiyose from calling a vote. Meanwhile, anti-treaty protestors swiftly gathered by several thousands outside the National Diet building.\n\nIgnoring Kiyose's pleas to cease their disruption, the Shakai-to lawmakers faced the arrival of 500 police officers. The nation watched in shock on NHK television as the police officers forcibly removed each Socialist lawmaker from the building and the Jimin-to lawmakers, unopposed, quickly passing the motion to extend the session. However, Kishi's \"sneak attack\" continued as the House Speaker also unexpectedly called for a vote on the new security treaty. In a striking image, NHK cameras captured Jimin-to members raising their hands, then panned dramatically to show the empty seats of the opposition."
 jap_kishi.24.a: "Was it really worth it to violate our democratic values...?"
 jap_kishi.24.b: "Appalling."
 jap_kishi.25.t: "Anti-American Sentiments Grow Among the Anpo Protestors"
 jap_kishi.25.d: "Everyone had been expecting Kishi to try to extend the Diet session, but few, even within his own party, realised he was also planning to ratify the treaty simultaneously. This was a crafty manoeuvre because, under Diet rules at the time, any treaty passed by the lower house would automatically be approved after thirty days, even without action by the upper house, as long as the Diet remained in session during that period.\n\nBy passing the treaty through the lower house on such day, Kishi ensured that it would automatically be ratified on June 19, just in time for President [USA.GetLeader]'s arrival in Japan that day. However, this manoeuvre may have been too clever. It made Kishi appear to be grovelling before the US President and has closely linked the fate of the treaty and the related protests to [USA.GetLeader]'s visit, which had not previously been viewed as particularly related to the treaty's ratification.\n\nHence, this timing has only ensured that the protests would now take on a stronger anti-American tone than they had previously displayed."
 jap_kishi.25.a: "An unfortunate result of non-sensical decisions..."
 jap_kishi.26.t: "Media and the Zaikai Puts Pressure on Kishi"
 jap_kishi.26.d: "With Prime Minister Kishi's political history brought to light—especially his role in the Tojo Cabinet during the height of the Pacific War, his attempts to break the leftist-sympathizing Nikkyoso, his desire to revise Article 9, and his infamous mishandling of the Police Duties Bill—the opposition has easily painted his plan to revise the security treaty as an \"evil plan\" to remilitarise Japan and return to the pre-war system. This portrayal has been only further emboldened by the recent May 19th Incident.\n\nWith that, the media has completely turned against him, with even conservative newspapers like Nihon Keizai Shimbun and Sankei Shimbun calling for the mass resignation of the Kishi Cabinet. The nation's business community, known as the zaikai, has also grown increasingly worried about the ongoing political turmoil, which threatens to badly affect Japan's business and international trade, thus also pressuring Kishi to resign."
 jap_kishi.26.a: "How can one man be so stubborn?"
 jap_kishi.27.t: "Anti-Kishi Strife Within the Jimin-to"
 jap_kishi.27.d: "Following Kishi's reckless and covert actions during the May 19th Incident, criticism and opposition have also taken root within the Jimin-to. The anti-mainstream party members believed that only the Diet session extension would be voted on. However, they were unaware that Kishi would also maneuver to have the new security treaty voted on, keeping them in the dark.\n\nDuring the vote, 27 Jimin-to lawmakers, including faction leaders such as Tanzan Ishibashi, Kenzo Matsumura, Ichiro Kono, and Takeo Miki, boycotted the vote in protest. These factions, now harbouring anti-Kishi sentiments, are publicly demanding Kishi's resignation. Kono is mostly leading this movement and has threatened to leave the party along with his allies if the situation deteriorates further. With the anti-mainstream members sympathising with the opposition, the party is at risk of a breakup if the issues are not resolved in the coming weeks."
 jap_kishi.27.a: "The cracks continue to spread."
 jap_kishi.29.t: "[GetNewspaperHeader]Massive Nationwide Protests in Japan"
 jap_kishi.29.d: "Since the May 19th Incident, the ongoing protests in Japan have reached their peak, entering their largest phase yet. Today, the nation witnessed its largest protests to date, as 175,000 demonstrators suddenly flooded the area in front of the National Diet building like a tsunami, while police barricaded the main gate to prevent them from entering the premises.\n\nOther major cities besides Tokyo, such as Osaka, faced intense protests as well. Anti-treaty protesters, supported by the Osaka Workers Union, spilled onto the streets and gathered in front of the prefectural government office, voicing their discontent.\n\nThe anti-security treaty movement has now incorporated anti-Kishi sentiments, seeking not only to prevent the treaty's ratification but also to secure the resignation of Prime Minister Kishi, whose recent actions are seen as undemocratic and reminiscent of pre-war authoritarianism."
 jap_kishi.29.a: "Things have really gotten out of our hands!"
 jap_kishi.29.b: "Concerning."
 jap_kishi.30.t: "Sohyo Calls for a General Strike"
 jap_kishi.30.d: "The Sohyo has called for a massive nationwide strike that has brought the country to a standstill. A staggering 5.6 million people, including 76 labor unions, 4.6 million workers, 1 million students, and various democratic organisations and small businessmen, have united to demand the prevention of the ratification of the security treaty and the resignation of Prime Minister Kishi. The \"6.4 Strike Committee,\" the driving force behind this unprecedented strike, executed their plan with precision. From the first light of dawn until 7: a.m., 35,000 union members and students successfully paralysed 15 sections of the East Railway and Oku and Shinagawa engine sections, leaving the train schedule in complete disarray. At the Kamata Train Depot, a picket line of about 200 people halted the inspection of the first train, resulting in the complete stoppage of 39 trains.\n\nAs the anti-treaty movement reaches its peak, the Sohyo has vowed to organise more strikes in the coming days."
 jap_kishi.30.a: "A raging wildfire that cannot be extinguished."
 jap_kishi.31.t: "[GetNewspaperHeader]Hagerty Incident"
 jap_kishi.31.d: "Today, a major diplomatic crisis erupted between the US and Japan, casting a shadow over the planned visit of President [USA.GetLeader] later this month. The incident occurred when James Hagerty, the White House Press Secretary, arrived at Tokyo's Haneda Airport to prepare for the President's upcoming visit. As Hagerty was escorted from the airport in a black car driven by the US Ambassador to Japan, the vehicle was surrounded by an estimated 6,000 Japanese protesters.\n\nThe demonstrators, as part of the ongoing anti-treaty movement, besieged the car, shaking it violently for over an hour. Windows were cracked, tail lights shattered, and protesters climbed onto the roof, chanting anti-American slogans and singing protest songs. The tense situation ended only when a US Marines military helicopter arrived to airlift Hagerty and the ambassador to safety, a dramatic rescue captured by newswires and broadcast worldwide.\n\nThe incident has stunned the Japanese nation, casting doubt on the security of the US President's visit. Prime Minister Kishi is now urgently seeking measures to ensure the President's safety amid escalating protests."
 jap_kishi.31.a: "Disgraceful..."
 jap_kishi.31.b: "Outrageous!"
 jap_kishi.31.c: "An uncontrollable turmoil at hand."
 jap_kishi.33.t: "[GetNewspaperHeader]June 15th Incident"
 jap_kishi.33.d: "Today, Japan was rocked by an astounding scene as citizens tuned in to their radios and televisions. As part of the Anpo Kokumin Kaigi's 24th United Action, hundreds of thousands of protesters descended upon the National Diet in Tokyo, voicing their opposition to the controversial security treaty.\n\nIn the late afternoon, the demonstration took a violent turn when right-wing ultranationalist counter-protesters attacked, ramming the crowd with trucks and assaulting them with wooden staves spiked with nails. The brutal clash resulted in dozens of injuries, ranging from moderate to severe, with several victims rushed to hospitals. Amid the chaos, radical left-wing activists from the Zengakuren forced their way into the Diet compound, leading to a fierce confrontation with police. The unarmed students were met with batons, and the ensuing violence was broadcast live, shocking the nation.\n\nJapan now faces the worst political turmoil. Prime Minister Kishi is under immense pressure to resign while grappling with the upcoming visit of the US President. The future of Japan's politics hangs in the balance as the nation watches with bated breath."
 jap_kishi.33.a: "We have reached an all-time low."
 jap_kishi.33.b: "Astonishing."
 jap_kishi.34.t: "Yesterday's Storming of the National Diet"
 jap_kishi.34.d: "Yesterday's incident began with Sohyo's second nationwide general strike as part the 24th United Action, involving 6.4 million workers and closing 30,000 shops, including 8,000 in Tokyo. A massive daylong protest was held at the Diet, but this one turned violent. The Zengakuren students, determined to invade the Diet grounds, began massing at the main gate midafternoon. They found it heavily fortified with barricades and 5,000 police officers.\n\nMeanwhile, about 1,000 artists, writers, and critics from Anpo Hihan no Kai marched from Hibiya Park to the Diet. At 5:15 p.m., as they presented petitions to Shakai-to Diet members, right-wing counterprotesters from the Ishin Kodo Tai attacked them. Members of the Modern Drama Association were targetted with wooden posts embedded with nails and two trucks ramming their column. Eighty people were injured, including eleven hospitalized, with one actor suffering permanent hearing loss.\n\nMinutes later, student radicals breached the South Gate, swarming into the Diet. The police retreated, allowing students to give speeches and sing songs for over an hour. After 7: p.m., police retaliated, driving students back, resulting in the trampling death of Tokyo University undergraduate Kanba Michiko. Her death enraged students, leading to fierce battles at the Main Gate.\n\nAt 1: a.m., police received orders to clear all protesters. At 1:15 a.m., they attacked students, professors, and reporters with truncheons and tear gas, while cameras showed students' bloody, unconscious bodies being carried to ambulances. The Diet compound was left strewn with rocks, shoes, broken placards, pools of blood, and eighteen wrecked paddy wagons.\n\nThis is an incident that will leave an unforgettable mark for years to come."
 jap_kishi.34.a: "A taint to our national stability..."
 jap_kishi.35.t: "Death of Michiko Kanba"
 jap_kishi.35.d: "The June 15th Incident shook the entire nation, but the most tragic outcome was the death of Michiko Kanba, a Zengakuren activist and an undergraduate student from the University of Tokyo. Kanba died in the clashes as the chaos escalated.\n\nMichiko Kanba was born in Musashino, Tokyo, into a family of scholars; her father was a sociologist and professor at Chuo University. She attended high school in Ashiya, Hyogo, and after graduating, returned to Tokyo for her higher education. There, she joined the Kyosan-to and the Zengakuren, becoming an activist and participating in the anti-treaty movement as the secretary general of the communist league faction of the Zengakuren. She was among the 78 students arrested during the occupation of the Haneda Airport lobby in January. Along with her fellow mainstream Zengakuren activists, she also participated in several attempted intrusions into the Diet and the Prime Minister's official residence.\n\nHowever, during the June 15th Incident, when the police retaliated after students occupied the Diet premises for an extended period, she died from severe injuries sustained in the clashes. The exact circumstances of her death remain disputed: police claim she was knocked down and trampled to death, while students blame her death on physical assaults by police officers.\n\nNonetheless, her death has shocked the nation and received extensive media coverage. It is seen as a \"triple tragedy\": she was young, a student at an elite university, and a woman. Her death has evoked memories of the many young lives lost during the Second World War, and her legacy, along with sympathy for her cause, will continue to be prominent in the years that will follow."
 jap_kishi.35.a: "Tragic."
 jap_kishi.36.t: "Kishi Announces Resignation"
 jap_kishi.36.d: "Following the June 15th Incident, Prime Minister Kishi initially refused to resign, asserting himself as the voice of the \"silent majority.\" Confident that the majority of the population silently supported the new treaty, his belief held some truth, as the entirety of Japan's population did not take to the streets in protest.\n\nNevertheless, the safety of [USA.GetLeader]'s upcoming visit remained uncertain. Although Kishi contemplated deploying the JSDF to secure the streets, he was dissuaded from such drastic action. With no backing from two key figures, Defense Agency Chief Akagi Munemori and National Police Agency Head Kashiwamura Nobuo, Kishi announced the mass resignation of his entire cabinet.\n\nThe resignation would be effective by next month, after which the new Prime Minister would be sworn in."
 jap_kishi.36.a: "An inevitable outcome."
 jap_kishi.37.t: "Media Slams the Anpo Kokumin Kaigi"
 jap_kishi.37.d: "After weeks of relentless criticism targeting the Kishi cabinet, the mainstream media has now taken a decisive stance against the protest movement. In a coordinated effort, the seven major Tokyo newspapers - the Asahi, Yomiuri, Mainichi, Sankei, Nihon Keizai, Tokyo, and Tokyo Times - have jointly issued a scathing statement titled “Wipe Out Violence, Preserve Parliamentary Democracy.” This declaration, supported by forty-eight newspapers nationwide, assigns significant blame for the ongoing crisis not only to the Kishi administration but also to the protesters themselves.\n\nFurthermore, the influential voices of big businesses have spoken out against the unrest. The four most prominent big-business organisations - Keidanren, Nikkeiren, the Keizai Doyukai, and the Japan Chamber of Commerce - have united to issue the very same statement mirroring the media's sentiments."
 jap_kishi.37.a: "Well said."
 jap_kishi.38.t: "[GetNewspaperHeader]Ratification of the Japan-US Security Treaty"
 jap_kishi.38.d: "The anti-treaty protestors have been left mystified and disappointed as the new Japan-US Security Treaty has officially been ratified and put into effect. Despite their energetic and large-scale movement, they could not stop the signing of the treaty.\n\nYesterday, the day before the ratification, the Anpo Kokumin Kaigi desperately held its United Action, and the Sohyo organized another nationwide strike. This combined protest involved over six million people nationwide, but even this massive effort was not enough to prevent the treaty's ratification. The ratification instruments had to be smuggled through a candy box to avoid detection by the protestors who were mobbing the Ministry of Foreign Affairs residence. The instruments were signed by Aiichiro Fujiyama, the Ministry of Foreign Affairs, and US Ambassador to Japan, Douglas MacArthur II.\n\nThough the anti-treaty movement managed to cause significant disruption, including the cancellation of President Eisenhower's visit due to security concerns raised by the June 15th Incident, they ultimately could not achieve their primary goal of stopping the treaty."
 jap_kishi.38.a: "The days of rage and crisis are coming to an end."
 jap_kishi.38.b: "A hard-won victory."
 jap_kishi.39.t: "[GetNewspaperHeader]Prime Minister Kishi's Resignation and an Assassnation Attempt"
 jap_kishi.39.d: "Today, Nobusuke Kishi's resignation became effective, following its announcement last month in the aftermath of the June 15th Incident. However, while Kishi was en route to a garden party celebrating Hayato Ikeda's ascension as the next Prime Minister of Japan, he was attacked by Taisuke Aramaki, a 65-year-old unemployed man affiliated with various far-right groups. Aramaki, wielding a knife, stabbed Kishi six times in the thigh. Although Kishi bled profusely, the stab wounds missed major arteries. He was rushed to a nearby hospital where he received approximately thirty stitches to his wounds, ultimately surviving the assassination attempt.\n\nAccording to the police questioning, Aramaki has so far not disclosed his motivations, but claimed he intended only to 'seriously injure' Kishi, denying any intention to kill him."
 jap_kishi.39.a: "Our politics can't get more ridiculous..."
 jap_kishi.39.b: "Shocking."
 jap_kishi.40.t: "Anpo Kokumin Kaigi Movement Dies Out"
 jap_kishi.40.d: "Despite the large-scale protests that surged unexpectedly during the first half of this year, the anti-treaty movement has largely lost its momentum. With the treaty now ratified and Nobusuke Kishi having resigned from office, there seems to be little need for the movement to continue. The only remaining signs of this movement are small-scale demonstrations by the Zengakuren and minor strikes by various labour unions.\n\nWith the end of the worst political turmoil and the largest protests in our nation's history, Japan now looks forward under the enthusiastic leadership of Hayato Ikeda. His focus is to shift our national attention from politics to economic prosperity. Although the infamous Anpo Struggle has finally come to end, its legacy is expected to influence the coming decade and beyond."
 jap_kishi.40.a: "An end to an unfortunate crisis."
 JAP_BIG_EVENT_QUOTE: "[JAP_Big_Event_Quote_Loc]"
 JAP_Big_Event_Hatoyama_Quote: "Starting with 'new friends', they become 'best friends', then 'true friends', and finally 'friends of the heart'.\n-Ichiro Hatoyama"
 JAP_Big_Event_LDP_Formation_Quote: "The politics belong to the people, and our duty is to stabilise the livelihood of the people domestically, promote public welfare, and restore the right of self-reliance and independence from the outside world.\n-Party Declaration of Jimin-to"
 JAP_Big_Event_Independence_Quote: "The flower that blooms in adversity is the rarest and the most beautiful of all.\n-Emperor Meiji"
 jap_genelec_a.1.t: "25th General Elections Announcement"
 jap_genelec_a.1.d: "The government has declared the upcoming 25th General Elections, marking a historic moment as the nation gears up for its first electoral exercise after the lifting of Allied Occupation, as well as under the newly enacted Public Offices Election Law. Enacted in 1950, this law serves as a pivotal consolidation of the former House of Representatives Election Law and House of Councillors Election Law. Its implementation introduces a comprehensive system for the public election of local government leaders and education commissioners.\n\nOne of the significant developments leading up to this electoral milestone is the lifting of the bans on certain public office members, a result of the enforcement of the San Francisco Peace Treaty. This monumental change has opened the political arena to a cadre of experienced politicians who were previously barred from seeking public office. In the aftermath of this policy shift, a substantial number of these individuals have chosen to run for office, marking their return to the forefront of national politics."
 jap_genelec_a.1.a: "Let's do our best!"
 jap_genelec_b.1.t: "[GetNewspaperHeader]25th General Elections Results"
 jap_genelec_b.1.d: "In the wake of the 25th Japanese General Elections, the conservative Jiyu-to party has emerged victorious in a landslide, solidifying its dominance in Japanese politics. Shigeru Yoshida, the influential Honryu Conservative and advocate for pro-American policies, remains at the helm as the Prime Minister, extending his tenure in the face of a resounding mandate. The House of Representatives reflects the magnitude of Jiyu-to's triumph, as they secure a staggering 240 seats. The opposition parties trail behind, with Kaishin-to securing 85 seats, Shakai-to Uha with 57 seats, and Shakai-to Saha closely behind with 54 seats. Kono-to manages to secure a modest 4 seats, while the remaining 26 seats are distributed among various small parties and independent lawmakers. Appalling the far-left activists and communists, the Kyosan-to did not win a single seat in this election, mostly due to decreased public support as a result of their recent militant activities.\n\nAs the dust settles on the election results, Japan braces itself for a period of continued leadership under Shigeru Yoshida and the Jiyu-to party."
 jap_genelec_b.1.a: "Yoroshiku!"
 jap_genelec_a.2.t: "27th General Elections Announcement"
 jap_genelec_a.2.d: "In the wake of the recent dissolution of the House of Representatives, a mere week has passed before the announcement of the 27th Japanese General Elections. This upcoming elections marks a departure from the norm witnessed in the past couple of years. Notably, the reins of power now rest in the hands of the Boryu Conservatives' Minshu-to, a shift from the previous dominance of the Honryu Conservatives' Jiyu-to.\n\nThe electoral landscape is filled with uncertainity as the pro-Hatoyama Minshu-to, now holding the ruling position, faces formidable opposition from the pro-Yoshida Jiyu-to. The latter, having lost ground in recent months, is determined to mount a resurgence and reclaim its position of dominance within the political arena."
 jap_genelec_a.2.a: "Let's do our best!"
 jap_genelec_b.2.t: "[GetNewspaperHeader]27th General Elections Results"
 jap_genelec_b.2.d: "The election results have left the political landscape in upheaval as Ichiro Hatoyama's party, Minshu-to, emerged victorious in a stunning electoral triumph. The Jiyu-to lawmakers find themselves flabbergasted, witnessing the unprecedented sway of support towards Hatoyama's leadership.\n\nThis marks the first time in approximately five years that Jiyu-to, a longstanding political force, failed to secure the majority of seats, with Minshu-to's popularity surpassing that of its rival. The seat distribution paints a picture of a closely contested battle, with Minshu-to securing 185 seats, while Jiyu-to falls behind with 112 seats.  It is then followed by Shakai-to Saha (89 seats), Shakai-to Uha (67 seats), Kono-to (4 seats), and Kyosan-to lagging far behind with only two seats. The remaining 8 seats are scattered among various mini parties and independent candidates.\n\nThis is also the first time where both NHK and Nitteru broadcast companies provided a preliminary report on the vote counting through television; this move marks a departure from the traditional election proceedings."
 jap_genelec_b.2.a: "Yoroshiku!"
 jap_genelec_a.3.t: "28th General Elections Announcement"
 jap_genelec_a.3.d: "As the House of Representatives got dissolved last week, recently the 28th General Elections were announced. Unlike previous cycles, the political spectrum has undergone a big transformation, leading to a more bipolarized National Diet.\n\nAt the forefront of this political realignment are two dominant factions. On one side is the conservative stronghold of Jimin-to, a formidable political party that consolidated its power - through the strategic merger of the once-divided Honryu and Boryu conservative factions - three years ago. On the other side is the socialist Shakai-to; the socialist camp has achieved unity through the merger of left-wing and right-wing factions in 1955. Then we have the Kyosan-to that remains as a diminutive party, entrenched in its own political camp."
 jap_genelec_a.3.a: "Let's do our best!"
 jap_genelec_b.3.t: "[GetNewspaperHeader]28th General Elections Results"
 jap_genelec_b.3.d: "In a resounding triumph, the Jimin-to faction has secured a decisive victory in the 28th Japanese General Elections, dealing a substantial blow to the hopes of the Shakai-to and disappointing lawmakers aligned with the socialist camp. [JAP.GetLeader], at the helm of the triumphant Jimin-to party, emerges as the victor, ensuring the continuation of his tenure as the Prime Minister.\n\nThe electoral landscape reflects a stark contrast, with Jimin-to seizing a commanding lead by clinching 287 seats, overshadowing the Shakai-to's more modest tally of 166. The Kyosan-to, in a distant third, manages to secure a mere one seat. Independent candidates manage to claim the remaining thirteen seats.\n\nThis electoral outcome marks a noteworthy trend in Japanese politics throughout the 1950s, as conservative candidates consistently dominate the electoral arena. The unbroken string of victories by conservative forces serves as a disheartening development for the socialist camp, who find themselves on the losing end in each election of the decade."
 jap_genelec_b.3.a: "Yoroshiku!"
 jap_genelec_a.4.t: "29th General Elections Announcement"
 jap_genelec_a.4.d: "As the nation moves past the recent political turmoil triggered by the Anpo Protests, a sense of anticipation spreads across the nation with the announcement of new general elections. Despite facing a dip in public approval, the Jimin-to still maintains its position as the largest party in the Diet, preparing for the upcoming electoral challenges. The impact of the recent protests is evident as the Shakai-to, riding the momentum gained from the dissent, finds itself at the peak of its influence. A new contender has also emerged, the Minsha-to, which comprises moderate social democrats who separated from the Shakai-to earlier in the year. However, their strength, although not insignificant, is overshadowed by the renewed influence of the Shakai-to."
 jap_genelec_a.4.a: "Let's do our best!"
 jap_genelec_b.4.t: "[GetNewspaperHeader]29th General Elections Results"
 jap_genelec_b.4.d: "As the 29th General Elections end, the Jimin-to has emerged triumphant, securing an overwhelming mandate that took many by surprise. The Jimin-to's resounding victory dealt a significant blow to the socialists, who watched in dismay as their political rivals clinched more than double the number of seats, amassing an impressive 296 compared to the Shakai-to's 145. Minsha-to, in a disappointing turn of events, managed to secure a mere 17 seats, falling far behind their Shakai-to counterparts, while Kyosan-to could only muster a modest three seats. The remaining six seats were divided among various small parties and independent lawmakers.\n\n[JAP.GetLeader], now re-elected, is set to continue his tenure and has pledged to usher in new changes to the nation, promising advancements on both the economic and social fronts."
 jap_genelec_b.4.a: "Yoroshiku!"
 jap_startup.1.t: "Dawn of the Rising Sun"
 jap_startup.1.d: "As the sun sets on the remnants of a once-mighty empire, the Land of the Rising Sun finds itself shackled under the weight of defeat and foreign occupation. The echoes of the atomic bombings that marked the Empire of Japan's downfall in 1945 still resonate, casting a somber shadow over the nation.\n\nUnder the grasp of the American boot, we have undergone a radical transformation. The year 1947 saw the birth of a new era as the American-influenced constitution took root, birthing a fledgling democracy. Our sacred soil, once guarded by the samurai spirit, now bears the seeds of constitutional principles, most notably in the pacifist embrace of Article 9 that dismantled the once-mighty military machine.\n\nHowever, the winds of change bring not only renewal but also a tempest of challenges. Hyperinflation grips the economy, food shortages persist, and the industrial heartbeat of the nation struggles to recover. Political turbulence, fueled by far-left activists, threatens the fragile stability that remains. Our nation, though downcast, stand resilient.\n\nYet, within the heart of adversity lies our spirit of Yamato. We as a nation with the history of persevering through trials and tribulations, have an undying determination to transcend the hardships. In the hushed whispers beneath the cherry blossoms, there lies a promise that the Land of the Rising Sun will ascend once more. Hope flickers like a lantern in the night, guiding us through the tumultuous path to recovery. With unwavering loyalty to the Emperor and a profound sense of duty, the our nation looks toward the future. From the ashes of defeat, we pledge to rebuild an indomitable nation, for the glory of the Emperor and the enduring spirit of the nation!"
 jap_startup.1.a: "Japan will rise again..."
 japan.1.d: "In the wake of the post-occupation era, Japan's evolving stance on Article 9 of its Constitution paved the way for enhanced military capabilities. The Cold War climate further compelled Japan to recognise the imperative of self-defense capabilities in global affairs. Backed by U.S. support, this culminated in the establishment of a Defense Agency and the conversion of the National Security Force into the 'Japan Self-Defense Forces' – a military in all but nomenclature. However, its role is strictly limited to self-defense purposes while closely monitored by the US. The JSDF, comprising the JGSDF, JASDF, and JMSDF, emerges as a response to the geopolitical situation, ensuring Japan's preparedness for self-defense while navigating the delicate nuances of its constitutional framework. Despite the limitations, the JSDF's formation bolsters the Western bloc's delicate stance in Asia, underscoring Japan's freshly asserted national sovereignty."
 japan.1.a: "A critical decision for our security."
 japan.2.d: ""
 japan.2.a: "Go beyond!"
 japan.2.b: "Impressive."
 japan.3.d: "Japan has undergone multiple waves of municipal consolidations since the Meiji Restoration. The newly proposed 'Great Showa Consolidation' will help the nation’s efforts to cope with the changes brought about by the so-called post-war reforms, especially the government acting under the new Constitution of 1947 as well as the Local Autonomy Law of 1947.  Under this postwar local government system, the roles of municipalities were enhanced and they were charged with the responsibility of operating junior high schools, carrying out fire prevention activities, and dealing with social welfare matters. With the steadily growing population, and thus, growing number of junior highschoolers, as well as the junior high school system being newly-introduced, running them is bound to burden each individual municipality.\nFor this purpose, the Great Showa Consolidation will be underpinned by two municipal merger laws in order to make running the junior highschools effective as well as polish the municipal administration. This will also help utilise the small land area of the country for booming industry and urbanisation."
 japan.3.a: "Great!"
 japan.4.t: "The Red Purge"
 japan.4.d: "With the recent introduction of the 'Truman Doctrine', the United States had announced its unyielding stance against communism, with Japan as a target to cleanse it from far-leftist radicals. Last year, with the US diplomat, George Kennan, pressuring MacArthur to change his moderate policy, unrest spilled out between spring and summer as a series of demonstrations by laborers, students and teachers, were held across the major cities of Japan. Unsurprisingly, after approval from Washington, the occupation authorities along with the Eighth Army aggressively suppressed these movements. The infamous \"Hanshin Education Incident\" occured in April when the Japanese authorities under the directions of the US government and the Japanese Ministry of Education closed down private Korean ethnic schools operating in Japan; it is said such actions were prompted by the fears of possible communist infiltration in the schools. Furthermore, later in September, then-Prime Minister of Japan and a left-leaning politician, Hitoshi Ashida, was arrested along with some of his cabinet officials over the infamous 'Showa Denko Scandal'.\nWith the fresh legacy of last year's events, economic uncertainity, Kyosan-to's political endeavors and the formation of the Zengakuren, far-leftism is only bound to spread across the nation if left unchecked; thus, the situation neccessitates the continuation of slamming the red menace."
 japan.4.a: "It was necessary..."
 japan.5.d: "As the part of the ongoing 'Red Purge' to curb the growing communist threat in Japan, the GHQ's Civil and Information and Education Section has made plans to ensure the education system stays pure from any far-left ideals. For this purpose, the authorities dispatched Dr. Walter C. Eells, who serves at the GHQ as an advisor on higher education, to thirty national universities to call for immediate dismissal of communist-sympathising professors and staff. Eells also visited Niigata University and labelled communism as \"dangerous and destructive doctrine\". Due to his ideals, anti-communism is slowly becoming a nationwide sentiment and openly shunned by the national newspapers. Plus, there have been noticeable dismissals of far-left sympathisers from educational institutes, mostly over irrelevant reasons. This endeavour is commonly known as the 'Eells Typhoon', or 'Izuru Senpu', as we call it.\n\nSome people argue that Eells's actions are a blatant suppression of academic freedom in Japan, while some would defend him, claiming that the CIE was never directly involved in the red purge. Either way one thing remains clear, that the 'Izuru Senpu' is a critical element in the ongoing red purge."
 japan.5.a: "Good for him."
 japan.6.d: "The first president of Japanese National Railways, Sadanori Shimoyama, was recently found dead on the Joban Line, Adachi, after reported missing yesterday. Based on the official autopsy led by Professor Tanemoto Furuhata, it was determined that Shimoyama died prior to being hit by the train, with blood loss being possible due to the lack of blood on the body. Additionally, in some parts of the body, internal bleeding was found, which could have been caused only by considerable force, such as kicking. On the other hand, it is also believed that Shimoyama's death was suicide. However, the internal bleeding observed was also consistent with being hit by a train, and investigators would not have been able to observe blood at the scene because it was raining.\n\nA few days prior to his death, Shimoyama was ordered for personnel cutbacks of JNR under the Dodge Line policy and released a list of 30,000 employees to be fired. It is rumoured that he recieved death threats from the high level US military officials to make sure he goes through with the order, which could have caused severe mental distress and hence, possible suicide. On the other hand, there are even rumours that some of the listed employees to be fired could be involved one way or another. Nonetheless, the incident remains a mystery."
 japan.6.a: "Tragic."
 japan.7.d: "Today, a runaway unmanned train travelling at the speed of about 60 km/h broke through a buffer stop and plunged into a nearby shopping street, killing six people and injuring twenty, at Mitaka Station, Chuo Main Line. Investigation authorities have arrested ten Kyosan-to workers, and a former train driver, Keisuke Takeuchi, over suspicions of a possible joint conspiracy as part of the far-left activism. However, the final trial and the court ruling on the matter is yet to happen.\n\nThis incident occured not too long after the recent Shimoyama Incident, where the first JNR president, Sadanori Shimoyama, was found dead on the Joban line, and people have already begun to question the authenticity of finger-pointing at the Japan National Railway Union (Kokuro) and the Kyosan-to over these two incidents."
 japan.7.a: "Questionable."
 japan.8.d: "Another railway incident happened, unsurprisingly. Today, a Tohoku Main Line passenger train derailed and overturned by a curved track section, en route from Aomori Station to Ueno Station. The locomotive overturned, killing three crewmen; however, none of the 412 passengers were injured or killed. Investigators discovered that the bolts and nuts on the track joints had been loosened, and a large number of railroad spikes fixing the rails to the sleepers had been removed, along with a spanner and pry bar in a nearby rice paddy. As usual, suspicion immediately fell on the Kokuro, workers at the nearby Toshiba-Matsukawa factory and the Kyosan-to workers, due to recent protests over staff cuts. Ten workers from the Matsukawa plant and ten JNR employees were indicted and charged with sabotage.\n\nThe fact that this, along with the recent Shimoyama and Mitaka incidents happened within the span of two months, a conspiracy theory has sprouted that the GHQ with the help of the US intelligence perpetrated the incidents as a pretext to arrest the members of Kokuro and Kyosan-to to thwart any possible far-leftist activism."
 japan.8.a: "Coincidence?"
 japan.9.t: "Formation of Keiretsus"
 japan.9.d: "As the winds of change sweep across our nation, we must confront the legacy of our past. The Zaibatsus, once the economic powerhouses of Japan, are no more. In their place, a new economic order is emerging – the Keiretsus. These conglomerates, made up of remnants of the old zaibatsus, are poised to shape Japan's economic future. Today, we have made a crucial decision that will determine the course of our nation's economy. The old zaibatsus were shackled by post-war restrictions that limited their influence and stifled economic growth. By lifting these restrictions and encouraging the formation of Keiretsus, we can expect to unleash the full potential of our industries. This will lead to increased economic output, technological innovation, and improved competitiveness on domestic stage."
 japan.9.a: "It's for the better."
 japan.10.t: "The CVH Proposal"
 japan.10.d: "As the nation's security and defense remain a top priority, a decision awaits. A new 'CVH Proposal' has been put forward, a strategic initiative aimed at enhancing the country's naval capabilities. However, the proposal's potential for political backlash raises questions about its immediate approval. The CVH Proposal, crafted after extensive deliberation by defense experts, seeks to bolster research and development efforts focused on carriers and helicopters for the JMSDF. The initiative presents a significant opportunity to strengthen Japan's maritime security, as it would provide the JMSDF with modern and versatile assets necessary for safeguarding the nation's territorial waters and contributing to international security efforts. Carriers and helicopters form the backbone of any effective naval force, enabling swift deployment of personnel, supplies, and equipment over vast maritime territories.\n\nHowever, it is important to acknowledge that implementing this proposal may attract mild political backlash as the opposition believes that doing so will violate the pacifist constitution and would contribute to an unnecessary arms race."
 japan.10.a: "The pacifist constitution must be respected."
 japan.10.b: "National security above all!"
 japan.12.t: "The National Police Reserve"
 japan.12.d: "With the ongoing war in Korea, and with both the authorisation and request from the Supreme Command of the Allied Powers, the Japanese Government has taken the decision to establish the National Police Reserve. This force is not only intended to address potential external threats but also to maintain domestic stability, especially concerning our fragile political situation, where domestic unrest is very possible.\n\nSince the complete dissolution of iur military following our defeat in the war, we have remained disarmed for nearly half a decade. Now, for the first time, we are raising arms again—not as a military resurgence, but for national security. However, it must be acknowledged that with Article 9 still in place, the NPR’s role is strictly limited to security and public order. This force is in no way a standing army, and its size is carefully restricted to 75,000 personnel, ensuring that it remains a defensive and non-military entity."
 japan.12.a: "Necessary step."
 japan.13.t: "The Coastal Safety Force"
 japan.13.d: "After the establishment of the National Police Reserve as a land security force, there was a discussion regarding the creation of a similar force dedicated to maritime security. Following Japan's defeat in 1945, its navy was completely dissolved, and the coast guard was left with limited resources—restricted to patrol boats with minimal armament and even restrictions on their speed and range; this left our country vulnerable in terms of its maritime defense capabilities. However, with the outbreak of the Korean War, the SCAP grew increasingly warm to the idea of Japan expanding its defense capabilities. This change in policy was evident in the approval to establish the NPR, which is a clear sign of the changing stance towards Japan’s defense needs. In line with this, discussions have now led to the establishment of the Coast Safety Force, a newly formed security force tasked with protecting Japan's maritime borders and securing its waters.\n\nAs Japan moves forward in this effort, there are ongoing discussions with US officials regarding the possibility of leasing US-made frigates and other vessels to facilitate the Coast Safety Force’s operational capabilities."
 japan.13.a: "Great news."
 japan.14.t: "Japan-US Ship Lease Agreement"
 japan.14.d: "Following the SCAP's authorisation for Japan to establish the Coast Safety Force, discussions between the US and Japanese officials have led to a significant decision in aiding their maritime defense capabilities. Recognising the strategic importance of securing Japan’s territorial waters amid the ongoing Korean War, the US has decided to lease a fleet of vessels to support Japan's newly formed security force.\n\nAs part of this agreement, Japan will receive 18 Tacoma-class and 55 Yuri-class patrol boats, providing the necessary foundation for maritime operations. Additionally, joint training programs and operational guidance will be arranged to ensure the seamless integration of these ships into Japan’s security force."
 japan.14.a: "Our Pacific allies."
 japan.14.b: "Our Pacific allies."
 japan.15.t: "[GetNewspaperHeader]The Self-Defense Forces Act"
 japan.15.d: "With Japan’s recovery well underway and its international standing rising after the signing of the peace treaty, the need of strengthening its own defense capabilities has become increasingly clear. The Cold War tensions in East Asia, with the recent war in Korea and the continued presence of the Soviet Union and China as regional threats, have further cemented the need for self-reliance in national security. In response, Japan has enacted the Mutual Security Assistance Agreement, obligating the nation to take greater responsibility for its own defense.\n\nFollowing this, the Defense Agency Establishment Law and the Self-Defense Forces Act have been passed and these laws have come into effect. The National Safety Agency has been reorganised into the Defense Agency, and its military branches have been reformed with the establishment of the JGSDF, the JASDF, and the JMSDF."
 japan.15.a: "A necessary step for our self-defense, in the name of the Emperor."
 japan.16.t: "The National Safety Agency"
 japan.16.d: "With the ongoing tensions in East Asia, Japan has taken another step in rebuilding its security forces under American supervision. Following the establishing of the National Police Reserve and the Coastal Safety Force, the need for a more structured and organised security force became evident. Because both the NPR and CSF were separate security force organisations, their command integration was bare-bones. Though up until now, responding to these concerns, the National Safety Agency has now been officially formed as a centralised organization overseeing both the NPR and the newly created Coast Safety Force, and to integrate their command structures too. The NSA, while technically a civilian agency under the Prime Minister’s Office, effectively serves as a proto-military structure, allowing Japan to develop defense capabilities while still adhering to Article 9 of the constitution. The move has been backed by the SCAP."
 japan.16.a: "Excellent."
 japan.17.t: "Letter from Douglas MacArthur"
 japan.17.d: "Dear Mr. Prime Minister:\n\n     In keeping with my established policy to re-invest autonomous authority in the Japanese Government as rapidly as the situation permits, I have visualised the progressive development of law enforcing agencies adequate to the maintenance of internal security and order and the safeguard of Japan's coastline.\n\n     Insofar as maritime safety in the harbors and coastal waters of Japan is concerned the Maritime Safety Board has achieved highly satisfactory results but the events disclose that safeguard of the long Japanese coastal line requires employment of a larger force under this agency than is presently provided for by law.\n\n     Accordingly, I authorise your government to take the necessary measures to establish a national police reserve of 75,000 men. The appropriate sections of this Headquarters will be available, as heretofore, to advise and assist in the technical aspects of these measures.\n\nVery sincerely,\nDOUGLAS MacArthur"
 japan.17.a: "Acknowledged."
 jap_police_law_of_1954.1.d: "Roughly three weeks ago, an ammendment bill to the Police Law was passed by the House of the Representatives and the session was scheduled to conclude on this date. However, due to unkown reasons, the Speaker of the House of the Representatives, Yasujiro Tsutsumi, proposed a two-day extension of the session.\nBelieving the extension to be invalid and unnecessary, the opposition members barred the Speaker from taking his seat in an attempt to overturn the proposed extension. Left with no other choice, the Speaker summoned the Diet police to maintain order and discipline; though, it only escalated the situation as the house members and the police engaged in a brutal brawl./nFortunately, the incident didn't result in severe injuries, although a handful had to be hospitalised. The session has been extended for two days as proposed, though this incident will certainly bring unpleasant consequences."
 jap_police_law_of_1954.1.a: "Politics!"
 jap_police_law_of_1954.2.t: "Validity of the Session's Extension"
 jap_police_law_of_1954.2.d: "With the recent unexpected extension of the session and a subsequent brawl, many are questioning its validity. It is asserted that when extending the session of the Diet, the Speaker of the House of Representatives must consult with the President of the House of Councillors before the House of Representatives makes a resolution. Deciding to extend the session based solely on the will of the House of Representatives from the start is a prominent flaw; plus, the Speaker was not present on his seat when the extension was announced. However, a counter-argument from others is that the majority of the House of Representatives decided to extend the session, which was accepted by the House of Councillors. Moreover, the Speaker could not take his seat due to obstruction. It can also be interpreted that in case of emergency, the will of the House of Representatives alone is sufficient by the nature of the extension of the session. Either way, it is nearly impossible rule out whether the extension was valid or not."
 jap_police_law_of_1954.2.a: "Indeed ambiguous."
 jap_police_law_of_1954.3.t: "Session Extended till 15th June"
 jap_police_law_of_1954.3.d: "Although, the 19th House of the Representatives session was originally extended till today, 5th June, the Speaker has proposed to further extend the session till 15th June. This is mostly due to the major parties being absent for the last two days, especially the both Right and Left Socialist Parties; presumably as a protest for the recent extension of the session and the subsequent brawl that unfolded between the house members and the summoned Diet police. Thus, under these circumstances, no unanimous decision could be made over the Police Law ammendment bill which impelled the Speaker to once again extend the session."
 jap_police_law_of_1954.3.a: "Better be careful than hasty."
 jap_police_law_of_1954.4.t: "Police Law Ammendment Bill Successful!"
 jap_police_law_of_1954.4.d: "Yesterday, during deliberations in the House of Councillors' Committee on Local Administration, an interim report was submitted for discussion in the plenary session, where the ammendment bill was passed and enacted. It was promulgated just today, and was approved with most votes in favour of the bill. Therefore, there are no more obstructions for the enforcement of the Police Law."
 jap_police_law_of_1954.4.a: "Finally!"
 jap_police_law_of_1954.5.d: "The Police Law of 1947 has been fully revised through an ammendment and enforced. The newly reworked law states that the police are based on a democratic philosophy in order to protect the rights and freedoms of individuals and maintain public safety and order'.\nThe main factors behind the revision is the democratisation of the police as well as centralising the management and structure. The decentralised police agencies have a heavy financial burden on local governments, and excessive fragmentation of police organizations has led to excessive territorial disputes and made wide-area investigation difficult. In addition, the national and local police and the local police were on an equal footing, and the responsibility for national security became unclear. Under the new law, the existing national and local police agencies were dissolved and replaced with the newly established 'National Police Agency' which would cooperate with the prefectural police agencies."
 jap_police_law_of_1954.5.a: "Great."
 jap_bakayaro.1.t: "Bakayaro..."
 jap_bakayaro.1.d: "During the 15th session of the National Diet, a memorable incident unfolded during the question-and-answer session between Prime Minister Yoshida and Eiichi Nishimura, a member of the Shakai-to Uha party. Unexpectedly, Yoshida directed an uncharacteristic term, labelling Nishimura as an 'idiot,' under his breath. To the surprise of many, this utterance was inadvertently captured by a microphone, which was heard by the entire House of Representatives.\n\nIn response, Nishimura swiftly retaliated, likening Yoshida and his cabinet to the notorious wartime Prime Minister, Tojo Hideki. This exchange escalated into a brief but intense argument between the two politicians. Sensing the gravity of the situation, Yoshida promptly retracted his remarks in an attempt to defuse tensions. Nevertheless, the members of the Shakai-to Uha party, interpreting Yoshida's comment as a blatant display of disrespect toward the esteemed institution of the Diet, collectively resolved to refer the Prime Minister to the disciplinary committee for what they deemed a 'disciplinary offense as a lawmaker'. They have also submitted a no-confidence motion, with the voting scheduled to take place soon. Ichiro Hatoyama, recognising the opportunity to topple Yoshida, his long-time bitter rival, has left Jiyu-to along with other Boryu Conservatives to ensure the success of the no-confidence motion. What happens next? Time will tell."
 jap_bakayaro.1.a: "Oppurtunists!"
 jap_bakayaro.2.t: "[GetNewspaperHeader]Bakayaro Dissolution"
 jap_bakayaro.2.d: "Following the recent 'bakayaro incident,' a motion of no confidence was triggered by Yoshida's disrespectful comment towards a lawmaker. With diminished support from pro-Hatoyama conservatives, the motion found majority approval. Over 30 members of the Hatoyama faction in the Jiyu-to, absent during the vote on the disciplinary offense referral, departed the party, aligning with the motion of no confidence in the cabinet, which also gained approval.\n\nIn response, Yoshida, facing political turbulence, dissolved the House of Representatives, signaling the imminent announcement of the next general elections. This dissolution has splintered the Jiyu-to, as anti-Yoshida lawmakers break away to establish their faction led by Ichiro Hatoyama, prepared to challenge Yoshida's Jiyu-to in the forthcoming elections."
 jap_bakayaro.2.a: "Good."
 jap_bakayaro.3.t: "26th General Elections Announcement"
 jap_bakayaro.3.d: "After the recent \"Bakayaro Dissolution,\" where Prime Minister Shigeru Yoshida took the controversial step of dissolving the National Diet to counter a looming no-confidence motion, the announcement of the 26th Japanese General Elections has been made. However, the move is being widely criticised as a strategic maneuver to sidestep a potential vote of no confidence. Opposition lawmakers have denounced Yoshida's actions, characterising the dissolution as a blatant attempt to evade the specter of 'justice' through democratic processes. Despite the outcry and accusations of political maneuvering, the die has been cast, and the nation now prepares itself for the upcoming elections.\n\nAmidst the events, the Jiyu-to faces internal fractures, with more than forty of its members, mainly Honryu Conservatives, defecting to join the newly formed party led by Ichiro Hatoyama."
 jap_bakayaro.3.a: "Let's do our best!"
 jap_bakayaro.4.t: "[GetNewspaperHeader]26th General Elections Results"
 jap_bakayaro.4.d: "In the culmination of the 26th Japanese General Elections, Shigeru Yoshida has emerged victorious once again, securing his position as the Prime Minister in the wake of Jiyu-to's consecutive triumph.\n\nDespite the unsurprising nature of Yoshida's win, the House of Representatives seat compostion has seen noticeable shifts. Jiyu-to, while retaining dominance with 199 seats, has experienced a setback, losing 41 seats compared to the previous elections. Notably, the party has had to contend with the departure of some Boryu Conservative lawmakers, led by Ichiro Hatoyama, who splintered to form their own independent party. The electoral landscape unfolds with Jiyu-to (199 seats) leading the charge, followed by Kaishin-to (76 seats), Shakai-to Saha (72 seats), Shakai-to Uha (66 seats), the Hatoyama-led Jiyu-to splinter (35 seats), Kono-to (5 seats), and Kyosan-to securing a mere 1 seat. The remaining 11 seats are dispersed among various minor parties and independent candidates.\n\nThis election also marks the first instance where the National People's Examination of Supreme Court Judges was omitted. The decision was grounded in the limited time elapsed since the last examination in late 1952."
 jap_bakayaro.4.a: "Yoroshiku!"
 jap_national_projects.1.t: "Opening of the Marunouchi Line"
 jap_national_projects.1.d: "The city of Tokyo buzzed with excitement as the Tokyo Metro marked a significant milestone today with the long-awaited opening of first section of the Marunouchi Line. After nearly three years of extensive construction and meticulous planning, this new addition to the city's subway system promises to improve transportation for countless commuters.\nCurrently, the Marunouchi Line stretches from Ikebukuro Station to Ochanomizu Station, encompassing 6 stations along its route. This expansion aims to alleviate the ever-increasing congestion and demand of Tokyo's subway transportations and provide a seamless commute for residents and tourists alike. Amid much fanfare, the inaugural train departed from Ikebukuro Station, carrying a host of dignitaries, government officials, and avid train enthusiasts. The opening ceremony, held at Ikebukuro Station, was attended by the Governor of Tokyo, along with top executives from Tokyo Metro. The ceremonial ribbon, symbolizing the commencement of operations. The Marunouchi Line is set to become a symbol of Tokyo's commitment to progress and development, propelling the city into a new era of transportation excellence."
 jap_national_projects.1.a: "Impressive!"
 jap_labour.1.t: "Labour Unions Go on Strike"
 jap_labour.1.d: "Amidst the tumultuous backdrop of the Korean War, a wave of discontent has sweeped across Japan as a handful of labor unions have ignited a series of minor strikes in major cities, fueled by their dissatisfaction with the ongoing rationing. Some factories have also ground to a temporary halt, as factory workers join the cause, amplifying the chorus of dissent. The resonance of their protest is not lost on the populace, with labor gaining immense support. In this crucible of discontent, the left-wing faction of the Shakai-to party have experienced a surge in popularity, further polarising the socialist camp."
 jap_labour.1.a: "Concerning."
 jap_labour.2.t: "Establishment of Sohyo"
 jap_labour.2.d: "The inaugural convention of Sohyo was convened at Toko Kaikan in Minato Ward, Tokyo, spanning a two-day event. Takeo Muto, a former coal worker, emerged as the first chairman, while Zengoro Shimagami, a former Sodomei trader, secured the position of secretary-general. Participation in the event extended beyond the confines of Sohyo-constituent councils, with the inclusion of other civil unions such as Sodomei, Nikkyoso, Kokuro, Tororen, Kaiin, and Shitetsuroren.\n\nThe establishment of Sohyo was significantly influenced by the Allied Occupation GHQ, playing a pivotal role in guiding the union's trajectory. During the founding congress, a declaration was adopted under GHQ guidance, explicitly excluding Kyosan-to ideals. Additionally, there was an emphasis on fostering warm relations with the International Confederation of Free Trade Unions. Cleansing labour unions of political parties' influence and concentrating on labour economic struggles were also among the key elements of the agenda. Now, Sohyo emerges as a distinctive trade union entity, boasting anti-communist overtones. However, knowing the nature of labor unions, their current anti-communist stance may not last for an extended period. This is already evident in the active involvement of prominent left-socialist activists led by Takano Minoru. Takano, with strong connections to the Kyosan-to, is determined to persuade the Sohyo unions to move away from their anti-communist perspective, notwithstanding the recent initiative adopted during the convention."
 jap_labour.2.a: "Let's see what happens then."
 jap_labour.3.t: "Second Sohyo Convention"
 jap_labour.3.d: "A three day-long Second Sohyo Convention was held recently, where the Sohyo unions' both leftist and rightist groups engaged in a dispute over the general policy and goal of the Sohyo. The leftists, predominantly led by Minoru Takano, advocated for adopting the Shakai-to's \"Principles of Peace\" as the new agenda, which has triggered staunch opposition from the right-wing faction within Sohyo. The Principles of Peace include opposition to rearmament and expansion of Japan's defense forces, emphasising a total adherence to Article 9. Secondly, advocating for Japan to join the non-aligned movement and maintain neutrality in the brewing Cold War, steering away from a pro-West stance. Finally. opposing US military bases in Japan and supporting the organisation of anti-American military base protests. A pivotal moment in the convention was the rejection of the previous goal of joining the International Confederation of Free Trade Unions, intensifying tensions between the opposing wings.\n\nThese principles marked a drastic shift from the agenda set in the first convention, indicating a significant move within the political spectrum in less than a year. Now under the new leadership of the left-socialist Minoru Takano, Sohyo has unsurprisingly adapted a leftist stance, openly rejecting the pro-American policies of Japan."
 jap_labour.3.a: "Not even surprised."
 jap_labour.4.t: "Third Sohyo Convention"
 jap_labour.4.d: "The Third Sohyo Convention took place this July, marked by significant developments that underscored the ongoing ideological divide within the organisation. During the congress, a proposal presented by the right-wing faction to reconsider joining the ICTFU was flatly rejected by the left-wing unions. A notable point of contention arose regarding the newly-enforced Treaty of Francisco. The right-wing members advocated for a more conciliatory approach, emphasising cooperation with the government, while the left-wing faction insisted on an aggressive opposition strategy. The latter aligned closely with the policies of Shakai-to's left-wing splinter group, Shakai-to Uha. In a decision reflecting the dominance of the left within Sohyo, the higher-ups resolved to support the Shakai-to Uha, unequivocally affirming the leftist orientation of the organisation. Susumu Fujita emerged as the newly elected Committee Chairman of Densan, further solidifying the left-leaning leadership. Additionally, Minoru Takano retained his position as secretary general. Despite the contentious issues discussed during the convention, no concessions were made to appease the right-wing faction. Consequently, the internal conflict between the left and right within Sohyo has intensified, signaling a deepening ideological schism within Sohyo."
 jap_labour.4.a: "The more it fractures, the better!"
 jap_labour.5.t: "Fourth Sohyo Convention"
 jap_labour.5.d: "Today, the Fourth Sohyo Convention marked a significant turning point in the organisation's structure and activities. During this assembly, the leaders of Sohyo officially adopted the \"Nine Principles,\" delineating the framework for their future endeavours. These principles, rooted in Marxism and Leninism, encompass various aspects, including opposition to capitalistic rationalisation, the unification of the labour front, the protection and maintenance of peace, and the stabilisation of peacetime economy. Remarkably, Sohyo underwent a substantial transformation within a brief span of three years. Originating as an anti-communist movement, the organisation has now embraced a stance entirely opposite to its earlier position.\n\nWithin the Sohyo framework, a faction known as Minroren has emerged, comprised of right-wing unions seeking to moderate the organization's policies from within. However, three right-wing unions, namely Kaiin, Zensen Domei, and Zeneien, have reached a breaking point with Sohyo's left-dominated direction. As expected, these unions have chosen to depart from the Sohyo committee due to the prominent divide within the organisation, leaving Nihoro as the sole remaining right-wing union."
 jap_labour.5.a: "It was inevitable."
 jap_labour.6.t: "Formation of Zenro Kaigi"
 jap_labour.6.d: "Today, the right-wing labor unions, which splintered from the left-dominated Sohyo, convened for their inaugural convention and formally established the Zenro Kaigi. Notable proponents of this newly formed alliance include Kaiin, Zensen Domei, and Zeneien. Additionally, the right-wing members of Sohyo aligned with the Minroren faction, alongside the right-wingers of Sodomei, were present, collectively forming the right-leaning Zenro Kaigi as a formidable rival to Sohyo.\n\nZenro's primary objective is to counter Sohyo's leftist pursuits, aiming to eliminate all pro-Communist tendencies within affiliated labor unions and positioning itself on the side of the 'free world'. The organization also denounces politically motivated strike activities, particularly those orchestrated by Sohyo, and expresses the intent to seek affiliation with the ICFTU. In contrast to a hard-line socialist stance, Zenro leans towards a more moderate social democracy. Notably, the council opposes immediate rearmament for Japan, advocating instead for a guarantee of Japan's security through the United Nations.\n\nPresently boasting a membership of 700,000, Zenro Kaigi's future growth may serve as an indicator of the Japanese labour movement's evolving political trajectory. The polarisation suggests the initiation of a mini cold war within the labour politics."
 jap_labour.6.a: "Labour politics sure are interesting..."
 jap_labour.7.t: "Dissolution of Sanbetsu Kaigi"
 jap_labour.7.d: "As its final convention took place today, the once-mighty Sanbetsu Kaigi is no more as its remaining constituent labour unions formally resign and depart, officially marking an end to the industrial council. Established a decade ago in 1948, Sanbetsu Kaigi was initially hailed as one of the prominent national industrial councils. However, fractures within the organisation were evident right from its inception. The inclusion of pro-democratic elements triggered disputes with leftist sympathisers, resulting in early-stage attrition of its membership. The presence of the Mindo faction, an anti-communist group, further exacerbated internal divisions as left-leaning members sought closer ties with the Kyosan-to. By 1949, during the peak of the 'Red Purge,' Sanbetsu Kaigi grappled to maintain its eminence. The expulsion of left-wing activists from workplaces nationwide shattered its legitimacy, leading to a cascade of splits in labor unions and withdrawals from the council. The year 1950 proved to be the worst one for the organisation, as the occupation authorities directly suppressed the Kyosan-to and affiliated groups, including Sanbetsu Kaigi. The loss of a majority of its civil servants from key positions ensued. The establishment of Sohyo later that summer dealt a final blow, prompting a significant exodus of major constituent unions to Sohyo. Despite nearly eight years of stumbling and futile attempts to regain prominence, the members have now opted to dissolve the organisation for good."
 jap_labour.7.a: "Another one kicks the bucket."
 jap_parties.1.t: "Formation of Jiyu-to"
 jap_parties.1.d: "In today's convention, lawmakers from Minji-to, alongside the splinter faction of Minshu-to, have officially established the new political entity, Jiyu-to.\n\nThe internal divisions within Minshu-to have been apparent in recent years, notably with the Shidehara-Ashida rivalry and the emergence of the Doshi Club, which undermined the party's cohesion. The situation worsened with the infamous Showa Denko Scandal two years ago, leading to the resignation en masse of the Ashida cabinet and dealing a final blow to any hopes of preserving party unity. The splinter faction, which aligned itself with Yoshida's Jiyu-to during today's convention, had recently come into existence. Led by Shigeru Hori, Kozaemon Kimura, and Takeru Inukai, this coalition departed from Minshu-to, contributing to the party's current state of disarray.\n\nWith Minshu-to in shambles after the recent events, the newly-established Jiyu-to is poised to assume the role of the primary conservative political force in the country for the foreseeable future."
 jap_parties.1.a: "Kanpai!"
 jap_parties.2.t: "Merger of Kokukyo-to and Minshu-to"
 jap_parties.2.d: "Today, lawmakers from Kokukyo-to and the remnants of Minshu-to have reached an agreement to merge, forming a new political entity known as Kokumin Minshu-to, abbreviated as Kokumin-to.\n\nThis development follows the recent fracture of Minshu-to, where a faction split off and joined forces with Minji-to to create Jiyu-to, leaving Minshu-to in disarray and facing a manpower shortage. Prior to the merger, discussions took place between Kokukyo-to's Miki and Minshu-to's Ashida. They deliberated on the necessity of creating a broad-based party that could accommodate some socialist elements. However, due to practical considerations, merging with the right wing of Shakai-to was deemed unpleasible. While Ashida did not publicly oppose Miki's stance, he recognised the urgent issues of Minshu-to, including a shortage of human resources and political funds.\n\nIn light of these considerations, an agreement for the merger was reached, leading to the formation of Kokumin-to with the democrat Gizo Tomabechi as the chairman. This decision comes just ahead of the upcoming House of Councilors election in the summer."
 jap_parties.2.a: "Good for them."
 jap_parties.3.t: "Formation of Kaishin-to"
 jap_parties.3.d: "Today marks the establishment of a new political party, known as Kaishin-to. The party has come into existence through the amalgamation of Kokumin-to and Nokyo-to, with the former's lawmakers forming the core of this newly created entity. Kaishin-to positions itself as a predominantly centrist party.\n\nPrior to the merger, deliberations were held regarding the potential union with Nokyo-to. Notably, concerns were raised, particularly by members of the former Minshu-to, regarding the adoption of 'moderate socialistic policies.' Despite these reservations, an agreement was ultimately reached, culminating in the formation of Kaishin-to. The convention also witnessed the participation of members from the Shinsei Club, a splinter group of Minsei Kyuyukai (which is an association of pre-war ex-democrats).However, due to ongoing disagreements between pro-Ashida and pro-Miki lawmakers, the position of chairman within the newly formed party will remain vacant temporarily. Efforts are underway to resolve these differences and appoint a chairman in the near future.\n\nKaishin-to, as opposed to Jiyu-to, has declared the following agenda: advocating for Japan's independent self-defense, creating a national spirit without radicalism, and implementing progressive reforms."
 jap_parties.3.a: "Will it be competent enough, though?"
 jap_parties.4.t: "Formation of Nihon Jiyu-to"
 jap_parties.4.d: "After the infamous \"Bakayaro Dissolution\" months ago, dissident anti-Yoshida lawmakers splintered from Jiyu-to, uniting under the leadership of Hatoyama. Following their defeat in the recent general elections, most rejoined Yoshida's party, including Hatoyama himself. Yet, eight steadfast dissenters, hailed as the Eight Samurai, defied the trend. Together, they boldly declared the establishment of Nihon Jiyu-to (Nijiyu-to for short). Under the leaderships of Ichiro Kono as Chief Secretary and Bukichi Miki as Supreme Consultant, Nijiyu-to emerges with a singular goal: to dismantle Yoshida's entrenched 'one-man dominance.'"
 jap_parties.4.a: "Traitors!"
 jap_parties.5.t: "Formation of Nihon Minshu-to"
 jap_parties.5.d: "Since the Shipbuilding Scandal surfaced, and public prosecutors launched an investigation into a top officials of the ruling Jiyu-to on suspicion of bribery, Yoshida's cabinet approval rate has been plummeting. Jiyu-to released a proposal to form a new party by merging with the Kaishin-to. But the proposal, put forward by the Jiyu-to Deputy, Taketora Ogata, met with opposition and the idea was not materialised. Instead, the Kaishin-to tried to create a new party aimed at countering Yoshida.\n\nMeanwhile, Nobusuke Kishi and Tanzan Ishibashi, both anti-Yoshida lawmakers within Jiyu-to, and Hitoshi Ashida of Kaishin-to moved to form a new party aimed at countering Yoshida by setting up a preparatory committee for creating such a party. In reponse, Yoshida expelled Kishi and Ishibashi from the party while anti-Yoshida factions within Jiyu-to departed the ruling party. Today, these forces join hands with the Kaishin-to and Nijiyu-to, leading to the creation of Nihon Minshu-to (Minshu-to for short, §Rnot to be confused with a party of the same name dissolved in 1950§!).\n\nIchiro Hatoyama was elected as the president of the new party and Mamoru Shigemitsu was named the deputy president."
 jap_parties.5.a: "Oppurtunists."
 jap_parties.6.t: "A Conservative Merger?"
 jap_parties.6.d: "In this decade, conservatives have consistently dominated elections, preventing any socialist ascent to the prime minister's office. The division within the Shakai-to has played a pivotal role in fracturing socialist political endeavors. However, the ongoing Yoshida-Hatoyama rivalry has left the conservative camp in disarray, which can jeopardies their winning streak. Sensing the vulnerability, discussions have emerged between the right and left wings of Shakai-to regarding a unified front against the conservatives. The prospect of a united Shakai-to poses a significant threat, capable of overpowering the divided conservative parties.\n\nSimultaneously, the Jiyu-to and Minshu-to leaders find themselves under pressure from the business community (Keidanren). The Keidanren asserts the necessity of a stable conservative coalition to counterbalance the rising influence of the Shakai-to. This urgency stems from the Keidanren's commitment to technological innovation and production rationalisation. They argue that a stable conservative government is vital for maintaining a positive relationship with the United States; on the other hand, the socialists openly advocate an anti-US agenda.\n\nAmidst these considerations, there is a growing sentiment that a merger between Jiyu-to and Minshu-to should be seriously entertained, especially considering the imperative nature of the situation. The Keidanren's insistence on prompt action underscores the belief that a consolidated conservative front is essential for averting the potential rise of the Shakai-to and securing a stable political environment conducive to their economic interests. Perhaps, it's better if we consider it done as soon as possible."
 jap_parties.6.a: "Agreed."
 jap_parties.7.t: "Discussions for the Conservative Merger"
 jap_parties.7.d: "With the concept of the conservative merger in light, conservative politicians from both Hatoyama's party and Yoshida's party have considered its prospects. The prime movers are Nihon-to's executive committee chairman, Bukichi Miki, and Jiyu-to's secretary-general, Banboku Ono. Nobusuke Kishi, Taketora Ogata, and Mitsujiro Ishii are also among the proponents of the conservative merger.\n\nHowever, opposition from both Hatoyama and Yoshida, as well as the long-time rivalry between the Honryu Conservatives and Boryu Conservatives due to the complex relationship between the pre-war bureaucrats and political elites, prove to be the main hindrances to the progress of the merger. Moreover, there has been a rift between Hatoyama and Ono over the sausage-making deals being made to facilitate the merger, especially with Hatoyama favouring Miki's views over Ono's."
 jap_parties.7.a: "Better hurry up."
 jap_parties.8.t: "The Ogata Report"
 jap_parties.8.d: "In a report presented by a CIA officer by interviewing Taketora Ogata, the current president of Jiyu-to, a comprehensive evaluation of the political landscape unveils insights leading up to upcoming general elections as well as the prospect of a 'conservative merger'. According to Ogata, Jiyu-to is anticipated to experience a maximum loss of ten seats, while the Minshu-to could potentially gain up to 20 seats. This could leave Jiyu-to with a 30-seat plurality, indicating a shift in the conservative camp.\n\nOgata has voiced his desire for a merger with Minshu-to, albeit recognising the need for approximately three months of groundwork. He views key figures within Minshu-to, including Secretary-General Nobusuke Kishi, Finance Minister Hisato Ichimada, and Minshu-to Advisor Hitoshi Ashida, as an excellent group with whom discussions about the potential merger could be fruitful. Expressing determination to lay the foundation for a conservative absolute majority within a year, Ogata has not ruled out the possibility of revising election laws if deemed necessary for achieving this ambitious goal.\n\nOgata also highlights the decision by Kyosan-to to employ regular election methods, foreseeing both positive and negative consequences. On the positive side, Ogata believes that the communist candidates may split the leftist vote, potentially costing the Shakai-to seats and thereby aiding the conservatives. However, he notes the potential downside where the Kyosan-to could be perceived by the Japanese people as an ordinary parliamentary party rather than as a tool influenced by the USSR. Ogata even speculates that the socialist camp may be receiving substantial financial assistance from abroad, but there is no concrete evidence to support this claim."
 jap_parties.8.a: "Good to know."
 jap_parties.9.t: "Interview with Shoriki"
 jap_parties.9.d: "A visit was made to Mr. Matsutaro Shoriki (owner of Yomiuri Shimbun, president of Nitteru., and a Lower House member) at his home in Zushi on the Sunday afternoon. The conversation mostly consisted of his political activities during the past 2 years.\n\nHe stated that he spent his best effort in trying to bring Yoshida and Hatoyama together to reconciliate about 2 years ago. Shoriki visited Hatoyama at Nirayama. No sooner than he broached the subject to Hatoyama, who was so angered that he left the room and refused to talk to him any further. Shoriki, therefore, merely had lunch with Mrs. Hatoyama and Tomejiro Okubo, the current state minister and director general of the Hokkaido Development Board, without accomplishing his mission.\n\nShoriki stated that Yoshida persistently told him that he would like to turn over the government to Hatoyama when the time comes, and Shorika firmly believed this assurance to be bona fide until Yoshida stated in the press interview given at Paris during his last trip abroad, that the rein of government cannot be turned over to an 'invalid' like Hatoyama. From that day, he says that he realised that he had been betrayed, and he completely changed his attitude towards Yoshida and from the very next day he ordered Yomiuri to change its editorial policy to oppose Yoshida's party.\n\nAt the time of the political crisis of last November, he said that he maintained intimate liaison with Banboku Ono, Chairman of the Executive Board of Jiyu-to and worked toward resignation of Yoshida cabinet instead of Diet dissolution. Concerning the current movement for conservative merger, he even stated that it was he who brought Bukichi Miki and Bamboku Ono, who were traditional enemies, to meet secretly to lay the ground for the merger."
 jap_parties.9.a: "Interesting."
 jap_parties.10.t: "[GetNewspaperHeader]Shakai-to Reunification"
 jap_parties.10.d: "In today's special convention held at the Kyoritsu Auditorium, the right and left wings of Shakai-to have set aside their differences and reunified. Spearheaded by Mosaburo Suzuki from the left-wing and Jotaro Kawakami from the right-wing, the merger faced internal resistance, notably from Sueshiro Nishio of the right-wing, critical of the left's stance on constitutional revision and its alignment with the radical Sohyo.\n\nDespite the opposition, a unified Shakai-to poses a formidable challenge to the conservative forces, currently grappling with internal divisions between the Yoshida and Hatoyama factions. The urgency to counteract the socialist threat has accelerated the conservative merger, as both camps navigate negotiations to present a united front against the Shakai-to."
 jap_parties.10.a: "Soon, it'll be our turn."
 jap_parties.11.t: "Policies for the New Conservative Party Laid Out"
 jap_parties.11.d: "Efforts for the merger of the conservative camp between Jiyu-to and Minshu-to were redoubled after the reunification of Shakai-to. After discussions, the outline of the to-be-formed conservative party's policies were finalised as follows:\n\n1. Establishment of national moral principles and renewal of education, particularly the university system.\n2. Reform the political and civil services, as well as the electoral system.\n3. Achieve economic independence through stabilisation of currency value and long-term economic planning.\n4. Establish a welfare system.\n5. Promote peace diplomacy, with emphasis on negotiations with the Soviet Union on the Northern Territories dispute.\n6. Establishment of an independent system and with consideration for constitutional reform to maintain self-defence forces."
 jap_parties.11.a: "Looks great!"
 jap_parties.12.t: "[GetNewspaperHeader]Formation of the Liberal Democratic Party"
 jap_parties.12.d: "Today marks a historical moment in Japanese politics as the conservative factions of Jiyu-to and Minshu-to set aside their differences and opposition, uniting to form a powerful conservative front. This united party emerges as a counterforce to the recently united socialist camp, presenting a significant shift in the political landscape. The crucial matter of the party's presidency remains under deliberation, prompting the establishment of a four-member presidential committee. This committee, comprising Ichiro Hatoyama, Bukichi Miki, Taketora Ogata, and Banboku Ono, will play a decisive role in determining the future leadership of the newly-formed party.\n\nWith this unity, it appears that the conservative forces have effectively neutralised the perceived threat posed by the socialist faction, marking a turning point in the political dynamics of Japan."
 jap_parties.12.a: "Banzai!"
 jap_parties.12.b: "Interesting."
 jap_parties.13.t: "Dissolution of Rono-to"
 jap_parties.13.d: "The far-leftist party, with Maoist ideals, has been disbanded after around two thousand of its workers left the party for Shakai-to, bringing an end to the already-struggling decade-old party."
 jap_parties.13.a: "Good?"
 jap_parties.14.t: "Morito-Inamura Dispute"
 jap_parties.14.d: "An intra-party dispute erupted during the Fourth Congress of Shakai-to in 1949, centering on the draft of a campaign policy. Tatsuo Morito and Junzo Inamura, representing the party's right-wing and left-wing factions respectively, found themselves in a contentious clash, each advocating for their distinct proposals. Morito's stance depicted the party as a 'national party,' aligning with anti-communist principles within the framework of parliamentary rules. Conversely, Inamura's proposal portrayed the party as a 'class party' aiming to revolutionise the social system, potentially collaborating with Kyosan-to and other far-left lawmakers.\n\nUltimately, under the mediation of Seiichi Katsumada, a resolution emerged, defining the party's character in the campaign policy as \"a democratic organisation of the broad working masses, with the working class at its core, encompassing peasants, small and medium-sized businesspeople, and the intellectual class.\" The overall tone of the campaign policy leaned strongly towards a leftist perspective. As a result, Mosaburo Suzuki, representing the left-wing faction, assumed the position of secretary-general, displacing the right-wing Inajiro Asanuma. This shift only served to deepen the ideological divide between the left and the right within the party.\n\nThis historical episode foreshadows the archetype of future intra-party disputes, illustrating the persistent challenges of reconciling divergent ideologies within Shakai-to."
 jap_parties.14.a: "Interesting."
 jap_parties.15.t: "Nihon Shakai-to Splits Up!"
 jap_parties.15.d: "Inevitably, Shakai-to has undergone a significant fracture following months of internal strife between its right-wing and left-wing factions. The roots of this division can be traced back to 1945 when the party coalesced from various proletarian factions, each harboring diverse and often conflicting interpretations of socialism.\n\nThe initial fissures within Shakai-to became apparent in 1948 when six left-wing members were ousted from the Ashida cabinet, a move intended to quell opposition to the budget plan. Tensions escalated as the popularity of the right-wing waned, particularly in the aftermath of the notorious Showa Denko scandal. The Morito-Inamura controversy, just two years prior, further fueled discord, as the campaign policies of the opposing wings sharply contradicted each other's ideals. Notably, the left-wing's influence burgeoned with substantial support from the Sohyo unions, a trend that gained momentum during the Korean War. Today, the final blow to the already fragile unity occurred in a dispute over endorsing the Treaty of San Francisco. The right wing, being in favour, of it argued that acceptance would be the only realistic way to regain Japan's sovereignty; the left wing, being opposed to it, argued that acceptance would make Japan formally join the western bloc, antagonising the USSR.\n\nConsequently, Shakai-to now stands divided into two factions. The rightist Shakai-to Uha, led by Jotaro Kawakami, adheres to a moderate policy. On the other side, the leftist Shakai-to Saha, led by Mosaburo Suzuki, staunchly follows a revolutionary assertive policy, fueled with anti-Americanism and rejection of the US-Japan Security Treaty. This rupture may portend a potential decline of socialism in Japan, at least in the immediate future."
 jap_parties.15.a: "Uncertain times."
 jap_jcp.1.t: "Dispute Between the Shokan-ha and Kokusai-ha"
 jap_jcp.1.d: "In the latest edition of \"For a Lasting Peace, for a People's Democracy!\", a publication of the Cominform, an article surfaced critiquing the principles advocated by Sanzo Nosaka, the leader of Kyosan-to. His characterisation of the US Occupation forces as the 'liberation army' and his proposition of achieving communism in Japan through a 'peaceful revolution' were frowned upon. The article went further to denounce Nosaka's ideals as mere glorification of 'evil capitalists', misleading the Japanese populace and deviating from the true spirit of Marxism-Leninism.\n\nThis critique dealt a significant blow to the Kyosan-to structure, sparking internal discord on how to respond to the censure. The mainstream faction of the party, under the leadership of Kyuichi Tokuda, rebuffed the Cominform's criticisms and issued a rebuttal, arguing that it failed to consider the practical realities of Japan. However, Kenji Miyamoto took a contrary stance, advocating for acknowledgment and respect of the Cominform's critique. He went as far as labeling Tokuda and his supporters as 'right-wing opportunists' and 'Titoists'. Consequently, the party found itself divided as tensions escalated between two factions: Shokan-ha, led by Kyuichi Tokuda and Shigeo Shida, and Kokusai-ha, headed by Kenji Miyamoto and Yoshio Shiga."
 jap_jcp.1.a: "Not the first time a party has had factionalism."
 jap_jcp.2.t: "Incident at the Kokyogaien"
 jap_jcp.2.d: "The Democratic People's Front, sponsored by the Kyosan-to, organised a rally of 50,000 people at the Kokyogaien National Garden in front of the Imperial Palace in Chiyoda, Tokyo. Initially appearing as a peaceful demonstration, the event swiftly descended into chaos when undercover police officers attempted to apprehend an individual who had infiltrated the assembly, sparking a scuffle with the security personnel tasked with monitoring the rally. Subsequently, eight student laborers, including the chairperson of the Tokyo Committee of Democratic Youth League, were detained.\n\nIn response to the ensuing violence, the Metropolitan Police Department imposed a temporary prohibition on similar public gatherings in Tokyo. Additionally, both the SCAP GHQ and the government issued directives to expel 24 members of the Kyosan-to's Central Committee from public office and temporarily suspend Akahata Shimbun, a newspaper affiliated with the Kyosan-to Central Committee."
 jap_jcp.2.a: "Not the first time it has happened, neither will it be the last."
 jap_jcp.3.t: "4th Kyosan-to National Convention"
 jap_jcp.3.d: "In Kyosan-to's 4th National Convention, a militant policy was proposed and put into consideration, which is as follows:\n\n     \"We must wage an unyielding struggle against the American imperialists and traitors, develop a self-defense struggle, and lead a militant force. The working class must organise small militant groups to disperse, disrupt, and attack the armed forces of the enemy.\n     Militant bases in rural areas must always be integrated with urban centers and developed under the guidance of the working class. They require a stronghold from which to defend and progress against adversaries. The primary base for the activists will be centrally managed, serving as the centre of regional resistance, extending to mountainous terrains and villages. These locales have been pivotal in shaping rural society for centuries and boast a legacy of revolutionary peasant uprisings. In numerous instances, entire villages have succumbed to destruction within a span of two to three years under layers of feudal oppression, exploitation, excessive taxation, subsidies, and escalating unemployment. So, these peasants have two options: destruction or revolution.\n     For the mountainous regions and villages, it is imperative that workers undertake revolutionary efforts and establish the necessary bases for such endeavours. Specifically, it is essential to lay the groundwork such as rear areas of Keihin, Hanshin, Kitakyushu, Chukyo, Sorachi, and Sapporo.\n     The militants are a weapon for the development of a national united front of anti-American salvation and will be carried out with the aim of developing into a people's liberation army.\""
 jap_jcp.3.a: "Typical far-left adventurism."
 jap_jcp.4.t: "1951 Platform"
 jap_jcp.4.d: "Today, the Kyosan-to convened its 5th National Convention, wherein it finalised its agenda and adopted a militant policy outlined in its '1951 Platform' document, an idea initially proposed during its 4th Convention.\n\nThe 1951 Platform declares that contemporary Japan remains a semi-feudal nation, oppressed by \"American imperialism.\" Consequently, the Kyosan-to's mission is to spearhead a 'national liberation revolution,' aiming to liberate the Japanese nation from American dominance and dismantle the 'semi-feudal reactionary forces' present within Japan. Rejecting the notion of a 'peaceful revolution,' the platform emphasises that Japan's transformation necessitates armed struggle and the use of force, dismissing the idea of democratic and pacifist approaches.\n\nThe agenda further asserts the imperative of shielding 'our comrades' from the adversary's armed forces and ultimately defeating them to overthrow the Yoshida government. The militants' strategy focuses on neutralising the 'enemy' through the coordinated defiance of workers' and peasants' partisan units and the armed uprising of the proletariat."
 jap_jcp.4.a: "A Communist group resorting to violence? Unsurprising."
 jap_jcp.5.t: "[GetNewspaperHeader]Inspector Shiratori Shooting Incident"
 jap_jcp.5.d: "In Sapporo, a murder occurred when Kazuo Shiratori, Chief of the Sapporo City Police Security Department, was shot by an unknown assailant cyclist while returning home on a dark evening. His body was taken to Hokkaido University Hospital for autopsy, where it was determined that a .32 caliber Browning pistol was used.\n\nSuspicions immediately fell on the Kyosan-to, as they had sent threats to Inspector Shiratori through letters prior to the incident. Allegedly, this was in retaliation for the Sapporo Police, under Inspector Shiratori's orders, halting an exhibition of nuclear bombing drawings organised by the local Kyosan-to committee. Many Kyosan-to members were arrested that day for disruptive sit-in demonstrations, portraying Inspector Shiratori as a 'fascist oppressor' in their eyes."
 jap_jcp.5.a: "Seems fishy."
 jap_jcp.6.t: "Suita Incident"
 jap_jcp.6.d: "With the ongoing Korean War, Japan has emerged as a hub for logistics and relief supplies to the UN forces, with Prime Minister Yoshida has fully supporting these efforts. However, this stance has drawn criticism from left-wing and anti-war activists, with the Kyosan-to sympathising with their sentiments and leveraging them to bolster their militant activities.\n\nToday, the Zengakuren orchestrated an anti-war rally, drawing approximately a thousand participants to Osaka University's Toyonaka Campus. The demonstrators opposed the presence of US military in Japan and advocated for the disruption of military supplies facilitated by the Japanese government. The rally spiraled into violence as the enraged mob redirected their march toward the Suita Trainyard, a key facility for transporting UN military provisions. Along the route, they vandalised the residence of Ryoichi Sasakawa, a prominent right-wing activist and pro-American advocate. Upon converging at Suita, the protestors chanted anti-war slogans and demanded the cessation of cargo trains. Subsequently, clashes erupted as the mob hurled rocks and Molotov cocktails at police stations, patrol cars, and the vehicle of US Brigadier General Carter W. Clark, leaving him with severe injuries. As the protestors attempted to board a train for their next destination, they were intercepted by around thirty police officers, sparking a confrontation on the station platform.\n\nThe altercation resulted in injuries to protestors, law enforcement personnel, and innocent bystanders. In the aftermath, 200 individuals were arrested, with 111 facing charges of sedition. It is rumoured that the Chuukaku Jietai were more or less involved."
 jap_jcp.6.a: "Post-war politics are really something."
 jap_jcp.7.t: "Osu Riot Incident"
 jap_jcp.7.d: "At the Osu Stadium in Nagoya, approximately 7,000 individuals gathered for a welcome event honoring Kei Hoashi and Kisuke Miyakoshi, the Shakai-to representatives who recently visited the USSR and Communist China, marking the first such visit by Japanese officials since the end of the war. Their return had garnered significant attention from various left-wing groups, including the pro-DPRK Zainichi community.\n\nUpon their arrival, the two representatives were warmly greeted with applause and presented with banquets before delivering their report speeches. Following their speeches, a student from Nagoya University approached the platform and voiced dissatisfaction over the previous day's events, criticising the intervention of what he termed 'oppressive police' in dispersing demonstrations during the representatives' arrival. He urged the audience to join him in protesting against the police. In response, the event's host, Director Nagamitsu Ito, promptly announced the closure of the event. However, the impassioned speech had already inflamed the audience, leading to chants of agreement with the student's sentiments.\n\nThe crowd, now numbering approximately 1,500, became increasingly agitated, brandishing red flags as they spilled out of the stadium. Some individuals armed themselves with Molotov cocktails and bamboo spears, resulting in the destruction of a police broadcast van and vandalism of several vehicles. Police attempts to suppress the riot only served to further provoke the demonstrators, culminating in violence. During the ensuing chaos, a Zainichi high school student sustained a fatal gunshot wound to the head.\n\nA total of 84 individuals were injured, with 150 ultimately indicted and charged with inciting violence. Police reports suggest the likely involvement of the Kyosan-to group in instigating violence through collaboration with radical factions within the Zainichi community."
 jap_jcp.7.a: "Tragic."
 jap_jcp.8.t: "[GetNewspaperHeader]Bloody May Day"
 jap_jcp.8.d: "Three days after the end of occupation, on May 1st (a traditional day for Sayoku protests), the Sohyo orchestrated nationwide peaceful demonstrations to voice dissatisfaction with the 'one-sided' Japan-US Treaty. However, in Tokyo, the Kyosan-to and radical Zengakuren factions infiltrated the peaceful demonstrations, turning them violent. Protesters seized control of Kokyogaien, which was closed to the public on this day, and staged demonstrations there. Nevertheless, law enforcement swiftly intervened, demanding the protesters vacate the plaza immediately. Responding with aggression, agitated demonstrators wielded Molotov cocktails, bamboo spears, and baseball bats. American bystanders, including soldiers and journalists, became targets and were assaulted, though they were ultimately rescued by the police. Ultimately, law enforcement resorted to firing warning shots, some directed towards the crowd, resulting in two fatalities. The crowd eventually dispersed, leaving the plaza in panic, setting fire to American military vehicles on the way, and engaging in further clashes with the police. In the aftermath, over two thousand individuals were injured, and 1,232 arrests were made."
 jap_jcp.8.a: "Seems like the troubles will persist even after the end of occupation."
 jap_jcp.9.t: "Kyosan-to Militants Take Up Arms"
 jap_jcp.9.d: "The infamous 1951 Platform by the Kyosan-to has just been finally implemented, with affiliated militant groups taking up arms with the intention of inciting violence in various rural and suburban areas. Named as the Chuukaku Jietai, the groups' primary activities involve igniting police stations with Molotov cocktails and orchestrating armed riots. Additionally, they are equipped with illegal handcrafted flame bombs, tear gas, and tire puncture devices, all manufactured using illicitly acquired guide pamphlets and books. The communist extremists have also created cadre groups known as the Sanson Kosakutai, and sent them to mountain villages to try persuade and recruit farmers to their cause.\n\nThe Kyosan-to is actively working to strengthen its clandestine cell system by establishing small committees in various educational institutions and seeking voluntary assistance from Zengakuren extremists."
 jap_jcp.9.a: "A threat to the public peace."
 jap_jcp.10.t: "Shokan-ha Leaders Flee to Communist China"
 jap_jcp.10.d: "In Japan, after the Kokyogaien incident, the Central Committee of Kyosan-to found itself barred from public office as per government directives. Nevertheless, the Ministry of Justice's Special Investigation Bureau received intelligence indicating that Kyosan-to leaders convened at Kinugawa Onsen in Tochigi. Despite the imposed ban on public office, discussions transpired concerning the advancement of political activities and party restructuring. In response, the Investigation Bureau, citing the Groups Regulation Law, mandated the appearance of the involved parties in court. However, nine Kyosan-to officials evaded compliance and went to hiding, prompting the issuance of arrest warrants for each individual.\n\nDespite the warrants, certain officials, notably Kyuichi Tokuda, Sanzo Nosaka, Takaji Nishizawa and other prominent Shokan-ha members, successfully escaped arrest and devised plans to escape Japan. Coordinating with the Chinese Communist Party through intermediaries, they awaited the signal to proceed. Upon receiving the green light, they departed for Communist China via a boat from Osaka. In their new asylum at [PRC.capital.GetName], they aim to resume their political activities while maintaining communication with the remaining Kyosan-to members in Japan."
 jap_jcp.10.a: "You cannot run away forever!"
 jap_jcp.10.b: "Welcome our communist comrades!"
 jap_jcp.11.t: "6th Kyosan-to National Convention"
 jap_jcp.11.d: "During its 6th National Convention, the Kyosan-to underwent significant changes in both leadership and its agenda. The assembly marked a solemn moment with the announcement of the passing of Kyuichi Tokuda, the former Kyosan-to leader and a key figure in the movement, who had passed away two years prior in China. Notably, the Kokusai-ha wielded a majority of influence within the party, overshadowing their Shokan-ha counterparts. However, with the intentions to maintain party unity and avoid potential divisions, the Central Committee decided to appoint Sanzo Nosaka of the Shokan-ha as the new leader.\n\nA huge shift in policy occurred during this convention, centering on the leaders' self-criticism concerning the 1951 Platform. They collectively denounced it as 'far-left adventurism.' As a consequence, the Kyosan-to terminated its financial support for the Chuukaku Jietai militant groups, reverting to its former agenda of advocating a 'peaceful revolution.' This change embraced the rejection of violence and a commitment to acquiring power through democratic means.\n\nHowever, this strategic redirection has not been without repercussions, as it has sown seeds of distrust between the Kyosan-to and Zengakuren. The latter, discontent with the adoption of peaceful policies, remains committed to a more militant approach, fostering a desire for a violent struggle."
 jap_jcp.11.a: "Doubtful that it will be the last of the left-wing violence."
