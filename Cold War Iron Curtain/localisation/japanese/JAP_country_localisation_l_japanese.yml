 JAP_National_Diet_info_text: "§Y内閣支持率§!は、現首相の内閣に対する国会の信任を表している。一部のディシジョンや国家方針を実行するには、「§G支持§!」の割合が一定以上であることを求められる場合があるため、この数値を高く維持するのが賢明である。\n\n§Y総合国民支持率§!は、現政権に対する国民全体の評価を表している。上記と同様に、一部のディシジョンや国家方針では、支持率が一定以上であることを求められる場合がある。\n\n§Y内閣支持率§!§Rおよび§!§Y総合国民支持率§!§Rは、新たな首相が選出されると変動する場合がある。§!\n\n§Y衆議院の議席構成§!は、衆議院に議席を持つ政党と、その議席数を表している。§G緑色§!の政党名は§Y政府系§!または§Y連立与党§!、§R赤色§!の政党名は§Y野党§!を表し、「その他」は無所属議員または少数政党を表している。\n\n§Y衆議院の議席構成§!§Rおよび§!§Y党内派閥§!§Rは、雰囲気と没入感を高めるために存在している。現時点では、ゲームに影響を及ぼす仕組みはない。§!\n\nゲームを通じて、上記のシステムに良くも悪くも影響を及ぼすさまざまなイベントや国家方針が発生する。これらの数値を高く維持するため、自らの選択には十分注意しなければならない！"
