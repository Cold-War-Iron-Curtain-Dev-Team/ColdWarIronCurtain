 JAP_RI_Uyoku_Dantai_tt: "§Y右翼団体§!\n影響対象:§B右翼不穏度§!"
 JAP_RI_Kyosanto_Militants_tt: "§Y共産党武装闘争派§!\n影響対象:§R左翼不穏度§!"
 JAP_RI_Labour_Union_Radicalism_tt: "§Y労働組合の急進主義§!\n影響対象:§R左翼不穏度§!"
 JAP_RI_Uyoku_Dantai_ttd: "£JAP_Uyoku_Dantai_tt\n\n\n\n\n\n\n\n§Y「総評打倒国民大会」に参加する右翼青年たち§!\n\n戦時中、右翼団体は隆盛を極めたが、日本の敗戦後には、日本の民主化と非軍事化を目指すアメリカ占領当局の弾圧を受けて衰退した。これにより民族主義的な右翼勢力は弱体化したものの、その空白はほどなく親米団体によって埋められた。しかし、冷戦が激化し、アメリカが日本を反共の同盟国として維持しようとするなか、拡大する左翼不穏に対抗するため、右翼運動の再興が容認された。愛国者による集会が各地で開かれ、戦前からの団体と戦後に結成された団体が入り交じる右翼運動が生まれた。これらの右翼団体は左翼急進派に断固として反対し、対米関係を支持するとともに、日本の再軍備を唱えている。とりわけ暴力団（ヤクザ組織）は、しばしばこれらの勢力を財政面で支援している。"
 JAP_RI_Kyosanto_Militants_ttd: "£JAP_Kyosanto_Militants_tt\n\n\n\n\n\n\n\n§Y警察官が山村工作隊の拠点を急襲§!\n\n「平和革命」の構想が退けられたことで、日本共産党はついに暴力路線へと傾き、日本人民を解放する「全国的革命」を扇動するため武装闘争員を投入している。毛沢東の戦術に触発され、彼らは農村部に多数の戦闘拠点を築いてきた。全国革命という目標自体は空想に過ぎないが、その武装活動は依然として治安と社会秩序を乱している。火炎瓶や即席武器を用い、警察署や右翼政治家の自宅をたびたび襲撃しているのだ。これらの闘争員は他の左翼急進派をもさまざまな程度で暴力へ駆り立てており、可及的速やかに対処する必要がある。"
 JAP_RI_Labour_Union_Radicalism_ttd: "£JAP_Labour_Union_Radicalism_tt\n\n\n\n\n\n\n\n§Y国会議事堂前で抗議する左翼系労働者たち§!\n\n日本の労働組合は明治期の工業化のなかで誕生したが、その権利は制限され、法的基盤も脆弱であった。終戦後、日本の民主化が進められると、労働組合は団体交渉を行い、権利を求めて集団でストライキを実施する自由を獲得した。しかし、この変化は労働組合内に顕著な左翼思想を浸透させることにもなった。こうした傾向は、左翼急進派や左派政党からの支援、さらには影響力のある極左系労働運動指導者の台頭によって、しばしば強められている。これらの労働組合は、左翼思想に反する政府の政策に対して頻繁に抗議運動やストライキを行い、極端な場合には実力行使に訴えることさえある。"
 JAP_carrier_hull_1: "CVH-A"
 JAP_carrier_hull_4: "いずも型"
 JAP_carrier_hull_1_desc: "海上自衛隊の空母保有構想は古くから存在した。1950年代初頭の段階から、海上自衛隊は米海軍から軽空母を取得または貸与される計画を検討していた。この案は1960年代初頭に検討された二つの構想のうちの一つである。第一案のCVH-Aは23,000トン級で、HSS-2（SH-3シーキング）対潜ヘリコプター18機と、S-2トラッカー固定翼対潜機6機を搭載する計画だった。もう一方のCVH-Bは大幅に小型であったが、それでもHSS-2を18機搭載する想定であった。"
 JAP_carrier_hull_4_desc: "いずも型多用途護衛艦、あるいは22DDHは、海上自衛隊で運用されているヘリコプター搭載護衛艦である。"
 JAP_carrier_hull_light_1: "CVH-B"
 JAP_carrier_hull_light_3: "おおすみ型"
 JAP_carrier_hull_light_4: "ひゅうが型"
 JAP_carrier_hull_light_1_desc: "海上自衛隊の空母保有構想は古くから存在した。1950年代初頭の段階から、海上自衛隊は米海軍から軽空母を取得または貸与される計画を検討していた。この案は1960年代初頭に検討された二つの構想のうちの一つである。第一案のCVH-Aは23,000トン級で、HSS-2（SH-3シーキング）対潜ヘリコプター18機と、S-2トラッカー固定翼対潜機6機を搭載する計画だった。もう一方のCVH-Bは大幅に小型であったが、それでもHSS-2を18機搭載する想定であった。"
 JAP_carrier_hull_light_3_desc: "おおすみ型は、日本のドック型輸送揚陸艦である。大隅型とも表記される。海上自衛隊はおおすみ型を戦車揚陸艦（LST）として扱っているが、従来のLSTに見られる艦首扉や擱座能力は備えていない。機能面では、ウェルドックを持つことから、むしろドック型揚陸艦（LSD）に近い。"
 JAP_carrier_hull_light_4_desc: "ひゅうが型護衛艦は、海上自衛隊向けに建造されたヘリコプター搭載護衛艦の艦級である。"
 JAP_screen_hull_medium_0: "あさひ型"
 JAP_screen_hull_medium_0_desc: "あさひ型警備艦は、海上自衛隊の警備艦の艦級である。米海軍のキャノン級から2隻が貸与され、1955年から1975年まで就役した。"
 JAP_screen_hull_medium_1: "あけぼの型"
 JAP_screen_hull_medium_1_desc: "あけぼの（DE-201）は、海上自衛隊の警備艦（フリゲート）である。あけぼのは、第二次世界大戦後に建造された最初期の国産日本軍艦の一つであった。"
 JAP_screen_hull_medium_2: "ちくご型"
 JAP_screen_hull_medium_2_desc: "ちくご型警備艦（フリゲート）は、同じ対潜任務を担ういすず型の後継として海上自衛隊が建造した警備艦の艦級である。この艦級の後継にはいしかりが続いた。ASROC対潜ミサイルを搭載した最初の日本製警備艦級でもある。"
 JAP_screen_hull_medium_3: "ゆうばり型"
 JAP_screen_hull_medium_3_desc: "海上自衛隊のゆうばり型警備艦（フリゲート）は、いしかり型警備艦の後継である。艦名の「ゆうばり」は、1920年代から1930年代にかけて就役し、第二次世界大戦で戦没した実験的軽巡洋艦夕張に由来する。"
 JAP_screen_hull_medium_4: "あぶくま型"
 JAP_screen_hull_medium_4_desc: "あぶくま型警備艦（フリゲート）は、海上自衛隊の汎用警備艦である。先行するゆうばり型の後継にあたる。"
 JAP_screen_hull_heavy_0: "ありあけ型"
 JAP_screen_hull_heavy_0_desc: "ありあけ型護衛艦は、海上自衛隊の護衛艦の艦級である。フレッチャー級駆逐艦2隻がアメリカ海軍から貸与され、1959年から1974年まで就役した。"
 JAP_screen_hull_heavy_1: "あきづき型"
 JAP_screen_hull_heavy_1_desc: "あきづき型護衛艦は、1950年代後半に海上自衛隊向けに建造された護衛艦の艦級である。指揮統制能力を強化した戦隊旗艦として計画されたため、非公式には「DDC」（指揮護衛艦）と分類されることもあった。"
 JAP_screen_hull_heavy_2: "はつゆき型"
 JAP_screen_hull_heavy_2_desc: "はつゆき型護衛艦は、海上自衛隊で運用される護衛艦の艦級である。海上自衛隊における第一世代汎用護衛艦の最初の艦級であった。"
 JAP_screen_hull_heavy_3: "はたかぜ型"
 JAP_screen_hull_heavy_3_desc: "はたかぜ型ミサイル護衛艦は、海上自衛隊で運用される第三世代艦艇の艦級である。海上自衛隊で初めてガスタービン推進を採用した艦でもある。"
 JAP_screen_hull_heavy_4: "こんごう型"
 JAP_screen_hull_heavy_4_desc: "海上自衛隊のこんごう型ミサイル護衛艦はイージス戦闘システムを装備しており、アメリカ国外でその能力を備えた数少ない艦級の先駆けとなった。"
 JAP_battle_hull_light_2: "はるな型"
 JAP_battle_hull_light_2_desc: "はるな型護衛艦は、1970年代初頭に海上自衛隊向けに建造された護衛艦の艦級である。これらのヘリコプター搭載護衛艦（DDH）は、最大3機のヘリコプターを収容できる大型中央格納庫を中心に設計されている。"
 JAP_battle_hull_light_3: "しらね型"
 JAP_battle_hull_light_3_desc: "しらね型護衛艦は、1970年代後半に建造された日本の護衛艦2隻からなる艦級である。最大3機のヘリコプターを収容できる大型中央格納庫を中心に構成されており、はるな型護衛艦の自然な後継艦級である。"
 JAP_sub_hull_small_single_0: "なつしお型"
 JAP_sub_hull_small_single_0_desc: ""
 JAP_sub_hull_small_single_1: "あさしお型"
 JAP_sub_hull_small_single_1_desc: "あさしお型潜水艦は、海上自衛隊の潜水艦の艦級である。本級はおおしお型の後継にあたる。"
 JAP_sub_hull_small_single_2: "あさしお型近代化改装"
 JAP_sub_hull_small_single_2_desc: "あさしお型潜水艦は、海上自衛隊の潜水艦の艦級である。本級はおおしお型の後継にあたる。"
 JAP_sub_hull_small_single_3: "おやしお型"
 JAP_sub_hull_small_single_3_desc: "おやしお型は、海上自衛隊が運用する日本のディーゼル電気式攻撃型潜水艦の系列である。1990年代後半に就役を開始した。側面ソナーアレイの搭載空間を確保するため、先行するはるしお型より大型化されている。"
 JAP_sub_hull_small_single_4: "そうりゅう型"
 JAP_sub_hull_small_single_4_desc: "そうりゅう型潜水艦（16SS）はディーゼル電気式攻撃型潜水艦である。本級の1番艦は2009年に海上自衛隊へ就役した。"
 JAP_sub_hull_large_single_0: "おやしお型"
 JAP_sub_hull_large_single_0_desc: "おやしお（SS-511）は海上自衛隊の潜水艦であり、ベーリング海峡から南下する寒流である親潮にちなんで命名された。"
 JAP_sub_hull_large_single_1: "おおしお型"
 JAP_sub_hull_large_single_1_desc: "おおしお（SS-561）は、海上自衛隊で唯一同型艦を持たなかった潜水艦である。老朽化したくろしおの代艦として計画・建造された。"
 JAP_sub_hull_large_single_2: "うずしお型"
 JAP_sub_hull_large_single_2_desc: "うずしお型潜水艦（Whirlpools）は、海上自衛隊で運用された潜水艦の艦級であり、従来型船体のあさしお型に比べて水中性能を重視した涙滴型潜水艦の第一世代であった。"
 JAP_sub_hull_large_single_3: "ゆうしお型"
 JAP_sub_hull_large_single_3_desc: "ゆうしお型は、海上自衛隊が運用した日本のディーゼル電気式潜水艦の艦級である。うずしお型を発展させた第二世代潜水艦であり、涙滴型船体の採用によって水中性能が向上している。"
 JAP_sub_hull_large_single_4: "はるしお型"
 JAP_sub_hull_large_single_4_desc: "はるしお型は、海上自衛隊が運用するディーゼル電気式潜水艦の艦級である。設計はゆうしお型を発展させたもので、やや大型化され、静粛性も改善されている。"
