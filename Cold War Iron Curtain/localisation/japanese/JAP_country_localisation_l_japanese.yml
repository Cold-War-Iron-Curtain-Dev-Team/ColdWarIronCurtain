 jap_yoshida.18.d: ""
 jap_yoshida.18.a: "Time has changed!"
 jap_yoshida.19.t: "Bakayaro..."
 jap_yoshida.19.d: "During the 15th session of the National Diet, a memorable incident unfolded during the question-and-answer session between Prime Minister Yoshida and Eiichi Nishimura, a member of the Shakai-to Uha party. Unexpectedly, Yoshida directed an uncharacteristic term, labelling Nishimura as an 'idiot,' under his breath. To the surprise of many, this utterance was inadvertently captured by a microphone, which was heard by the entire House of Representatives.\n\nIn response, Nishimura swiftly retaliated, likening Yoshida and his cabinet to the notorious wartime Prime Minister, Tojo Hideki. This exchange escalated into a brief but intense argument between the two politicians. Sensing the gravity of the situation, Yoshida promptly retracted his remarks in an attempt to defuse tensions. Nevertheless, the members of the Shakai-to Uha party, interpreting Yoshida's comment as a blatant display of disrespect toward the esteemed institution of the Diet, collectively resolved to refer the Prime Minister to the disciplinary committee for what they deemed a 'disciplinary offense as a lawmaker'. They have also submitted a no-confidence motion, with the voting scheduled to take place soon. Ichiro Hatoyama, recognising the opportunity to topple Yoshida, his long-time bitter rival, has left Jiyu-to along with other Boryu Conservatives to ensure the success of the no-confidence motion. What happens next? Time will tell."
 jap_yoshida.19.a: "Oppurtunists!"
 jap_yoshida.20.t: "[GetNewspaperHeader]Bakayaro Dissolution"
 jap_yoshida.20.d: "Following the recent 'bakayaro incident,' a motion of no confidence was triggered by Yoshida's disrespectful comment towards a lawmaker. With diminished support from pro-Hatoyama conservatives, the motion found majority approval. Over 30 members of the Hatoyama faction in the Jiyu-to, absent during the vote on the disciplinary offense referral, departed the party, aligning with the motion of no confidence in the cabinet, which also gained approval.\n\nIn response, Yoshida, facing political turbulence, dissolved the House of Representatives, signaling the imminent announcement of the next general elections. This dissolution has splintered the Jiyu-to, as anti-Yoshida lawmakers break away to establish their faction led by Ichiro Hatoyama, prepared to challenge Yoshida's Jiyu-to in the forthcoming elections."
 jap_yoshida.20.a: "Good."
 jap_yoshida.21.t: "Formation of Kaishin-to"
 jap_yoshida.21.d: "Today marks the establishment of a new political party, known as Kaishin-to. The party has come into existence through the amalgamation of Kokumin-to and Nokyo-to, with the former's lawmakers forming the core of this newly created entity. Kaishin-to positions itself as a predominantly centrist party.\n\nPrior to the merger, deliberations were held regarding the potential union with Nokyo-to. Notably, concerns were raised, particularly by members of the former Minshu-to, regarding the adoption of 'moderate socialistic policies.' Despite these reservations, an agreement was ultimately reached, culminating in the formation of Kaishin-to. The convention also witnessed the participation of members from the Shinsei Club, a splinter group of Minsei Kyuyukai (which is an association of pre-war ex-democrats).However, due to ongoing disagreements between pro-Ashida and pro-Miki lawmakers, the position of chairman within the newly formed party will remain vacant temporarily. Efforts are underway to resolve these differences and appoint a chairman in the near future.\n\nKaishin-to, as opposed to Jiyu-to, has declared the following agenda: advocating for Japan's independent self-defense, creating a national spirit without radicalism, and implementing progressive reforms."
 jap_yoshida.21.a: "Will it be competent enough, though?"
 jap_yoshida.22.t: "[GetNewspaperHeader]26th General Elections Results"
 jap_yoshida.22.d: "In the culmination of the 26th Japanese General Elections, Shigeru Yoshida has emerged victorious once again, securing his position as the Prime Minister in the wake of Jiyu-to's consecutive triumph.\n\nDespite the unsurprising nature of Yoshida's win, the House of Representatives seat compostion has seen noticeable shifts. Jiyu-to, while retaining dominance with 199 seats, has experienced a setback, losing 41 seats compared to the previous elections. Notably, the party has had to contend with the departure of some Boryu Conservative lawmakers, led by Ichiro Hatoyama, who splintered to form their own independent party. The electoral landscape unfolds with Jiyu-to (199 seats) leading the charge, followed by Kaishin-to (76 seats), Shakai-to Saha (72 seats), Shakai-to Uha (66 seats), the Hatoyama-led Jiyu-to splinter (35 seats), Kono-to (5 seats), and Kyosan-to securing a mere 1 seat. The remaining 11 seats are dispersed among various minor parties and independent candidates.\n\nThis election also marks the first instance where the National People's Examination of Supreme Court Judges was omitted. The decision was grounded in the limited time elapsed since the last examination in late 1952."
 jap_yoshida.22.a: "Yoroshiku!"
 jap_yoshida.23.t: "25th General Elections Announcement"
 jap_yoshida.23.d: "The government has declared the upcoming 25th General Elections, marking a historic moment as the nation gears up for its first electoral exercise after the lifting of Allied Occupation, as well as under the newly enacted Public Offices Election Law. Enacted in 1950, this law serves as a pivotal consolidation of the former House of Representatives Election Law and House of Councillors Election Law. Its implementation introduces a comprehensive system for the public election of local government leaders and education commissioners.\n\nOne of the significant developments leading up to this electoral milestone is the lifting of the bans on certain public office members, a result of the enforcement of the San Francisco Peace Treaty. This monumental change has opened the political arena to a cadre of experienced politicians who were previously barred from seeking public office. In the aftermath of this policy shift, a substantial number of these individuals have chosen to run for office, marking their return to the forefront of national politics."
 jap_yoshida.23.a: "Let's do our best!"
 jap_yoshida.24.t: "[GetNewspaperHeader]25th General Elections Results"
 jap_yoshida.24.d: "In the wake of the 25th Japanese General Elections, the conservative Jiyu-to party has emerged victorious in a landslide, solidifying its dominance in Japanese politics. Shigeru Yoshida, the influential Honryu Conservative and advocate for pro-American policies, remains at the helm as the Prime Minister, extending his tenure in the face of a resounding mandate. The House of Representatives reflects the magnitude of Jiyu-to's triumph, as they secure a staggering 240 seats. The opposition parties trail behind, with Kaishin-to securing 85 seats, Shakai-to Uha with 57 seats, and Shakai-to Saha closely behind with 54 seats. Kono-to manages to secure a modest 4 seats, while the remaining 26 seats are distributed among various small parties and independent lawmakers. Appalling the far-left activists and communists, the Kyosan-to did not win a single seat in this election, mostly due to decreased public support as a result of their recent militant activities.\n\nAs the dust settles on the election results, Japan braces itself for a period of continued leadership under Shigeru Yoshida and the Jiyu-to party."
 jap_yoshida.24.a: "Yoroshiku!"
