 JAP_National_Radicalism_Category: "国内の急進主義と社会不安"
 JAP_National_Radicalism_GUI_desc: "\n\n\n\n\n£GFX_JAP_National_Radicalism_Category_Banner\n\n\n\n\n\n\n戦後、日本では政治的急進主義が台頭し、深刻な問題となっていた。§R左翼§!と§B右翼§!の急進派は、アメリカ占領下で築かれた保守体制を揺さぶっている。\n\n§R日本社会党（JSP）§!は国内最大の左翼勢力であり、社会主義陣営を率いている。しかし、同党はたびたび内部対立に苦しみ、優勢な保守陣営との競争も余儀なくされている。それでも社会主義陣営は、労働組合や§R全学連§!への大規模な支援に長け、それらを動員して保守政権を揺さぶっている。一方、急進右翼はまとまりを欠き、さまざまな§B右翼団体§!（超国家主義団体）から構成されている。また、§Bヤクザ§!組織も存在し、しばしばその資金力と実力を用いて極左運動に対抗している。超国家主義政党の国会における影響力は、社会主義政党と比べればごくわずかである。しかし、極右勢力がさらに台頭すれば、保守陣営内に超国家主義派が形成される可能性がある。\n\n日本は安定した保守体制を維持し、繁栄を実現することを望んでいる。しかし、いずれか一方の勢力が支配的となれば、政治情勢は大きく変化する可能性がある。"
