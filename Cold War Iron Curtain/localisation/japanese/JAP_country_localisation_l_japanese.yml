 jap_yoshida.30.t: "Nihon Shakai-to Splits Up!"
 jap_yoshida.30.d: "Inevitably, Shakai-to has undergone a significant fracture following months of internal strife between its right-wing and left-wing factions. The roots of this division can be traced back to 1945 when the party coalesced from various proletarian factions, each harboring diverse and often conflicting interpretations of socialism.\n\nThe initial fissures within Shakai-to became apparent in 1948 when six left-wing members were ousted from the Ashida cabinet, a move intended to quell opposition to the budget plan. Tensions escalated as the popularity of the right-wing waned, particularly in the aftermath of the notorious Showa Denko scandal. The Morito-Inamura controversy, just two years prior, further fueled discord, as the campaign policies of the opposing wings sharply contradicted each other's ideals. Notably, the left-wing's influence burgeoned with substantial support from the Sohyo unions, a trend that gained momentum during the Korean War. Today, the final blow to the already fragile unity occurred in a dispute over endorsing the Treaty of San Francisco. The right wing, being in favour, of it argued that acceptance would be the only realistic way to regain Japan's sovereignty; the left wing, being opposed to it, argued that acceptance would make Japan formally join the western bloc, antagonising the USSR.\n\nConsequently, Shakai-to now stands divided into two factions. The rightist Shakai-to Uha, led by Jotaro Kawakami, adheres to a moderate policy. On the other side, the leftist Shakai-to Saha, led by Mosaburo Suzuki, staunchly follows a revolutionary assertive policy, fueled with anti-Americanism and rejection of the US-Japan Security Treaty. This rupture may portend a potential decline of socialism in Japan, at least in the immediate future."
 jap_yoshida.30.a: "Uncertain times."
 jap_yoshida.31.t: "[GetNewspaperHeader]Shipbuilding Scandal Case Unfolds in Tokyo"
 jap_yoshida.31.d: "In a dramatic turn of events, the Tokyo District Public Prosecutors Office with the aid of the police launched a day-long raid at the residence of the Vice PM, Taketora Ogata. Simultaneously, Banboku Ono, Director of the Hokkaido Development Agency, faced relentless interrogation by Chief Prosecutor Kawai Nobutaro. The scandal centres around a bribery scheme linked to the \"Interest Subsidy Law for Oceangoing Shipbuilding,\" aimed at reducing interest rates on shipbuilding projects.\n\nThis affair also threatens to further entangle political figures and bureaucrats, with early suspicions already pointing to multiple Diet members and high-ranking shipbuilding executives. As the investigation deepens, the scandal casts a shadow over the integrity of both the ruling party and the shipbuilding industry."
 jap_yoshida.31.a: "With that, begins the Fall of Yoshida Cabinet..."
 jap_yoshida.32.t: "Raid on the Travel Bureau Headquarters"
 jap_yoshida.32.d: "With the escalating suspicions surrounding the Shipbuilding Scandal, the Tokyo District Public Prosecutors Office's Special Investigation Department launched a daring raid on the Japan Travel Bureau headquarters located in the Chiyoda Ward, Tokyo. Officials combed through documents and seized evidence, probing possible connections to illicit activities. Shortly after the raid, Chairman Hiroshi Takada was interviewed by the prosecutors to address the suspicions, aiming to extract information and shed light on potential involvement in the scandalous affair. The prosecutors, undeterred, unveiled plans to broaden their investigation, signaling upcoming raids on other transportation companies."
 jap_yoshida.32.a: "Seems like it's far from over."
 jap_yoshida.33.t: "Yoshida Naikaku Tadou Kokumin Dai-kai"
 jap_yoshida.33.d: "As public support for the Yoshida Cabinet falters, the disgruntled Sohyo labours, along with far-left activists, gathered in Hibiya Park for a conference organised by influential Sohyo leftists, titled \"Yoshida Naikaku Tadou Kokumin Dai-kai\" (National Alliance to Overthrow Yoshida Cabinet). Amidst impassioned speeches denouncing the Yoshida Cabinet, the crowd morphed into an angry mob, spilling onto the streets. Their destination: the Jiyu-to head office. However, their path was impeded by a formidable police presence guarding the building. The agitated protestors clashed with law enforcement, attempting to breach the security cordon. Despite minor scuffles, the police successfully dispersed the crowd without injuries, ensuring a peaceful resolution to the gathering."
 jap_yoshida.33.a: "Considering Yoshida, it will take more than just that."
 jap_yoshida.34.t: "Tokyo District Public Prosecutors Office Launches Mass Operation"
 jap_yoshida.34.d: "With ongoing developments regarding the scandal, the Tokyo District Public Prosecutors Office orchestrated a sweeping operation today, targeting the head offices of multiple transportation companies. Officials meticulously went through documents, with some materials seized for further examination. A total of eight transportation companies found themselves under scrutiny, among them the Railway Benefit Association, Tozai Kisen Co., and the residence of Iino Kaiun Company's vice president, as well as the head office of Hitachi Zosen, one of the prominent shipbuilding corporations. The authorities focused on acquiring relevant information to piece together the details of the scandal.\n\nOutside the targeted buildings, a throng of news reporters and journalists gathered, eager to cover the proceedings. Simultaneously, disgruntled employees, temporarily barred from entering their workplaces during the raids, observed the events unfold.\n\nAttention has notably fixated on Hayato Ikeda, a prominent Jiyu-to member and Chairman of the Policy Board of Shin Nihon Kaiun. Although his involvement remains unverified, ongoing debates within the National Diet session centre around summoning him as a witness to the scandal. However, no information has warranted a raid on his office at this time."
 jap_yoshida.34.a: "Concerning."
 jap_yoshida.35.t: "Arrest Warrant Issued for Jiro Arita"
 jap_yoshida.35.d: "Chief Cabinet Secretary, Kenji Fukunaga, calmly addressed a group of reporters inside the hallowed halls of the House of Representatives. Waving a letter, he read aloud the official authorisation for the arrest of Jiro Arita, a House of Representatives member and director of Namura Kisen Co. Upon the completion of the reading, various reactions unfolded among the gathered reporters. Some displayed disappointment at the lack of dramatic revelations, while others relished the opportunity to secure a substantial scoop. The issued arrest warrant signifies a measured step by the Tokyo District Public Prosecutors Office, expecting Arita to turn himself in within the stipulated week."
 jap_yoshida.35.a: "What a disappointment."
 jap_yoshida.36.t: "[GetNewspaperHeader]Jiro Arita Surrenders to Authorities Following Diet Approval"
 jap_yoshida.36.d: "A week after the Tokyo District Public Prosecutors Office issued the arrest warrant, Jiro Arita turned himself in today. The Diet, in a plenary session yesterday, granted permission to the prosecutors office for Arita's arrest, with the condition that the period of detention be limited to one week. In a subdued scene at the Tokyo District Public Prosecutor's Office, police officials arrested Arita without incident. A crowd of reporters gathered to cover the event, capturing the unassuming surrender. The approved arrest marks a significant step in the ongoing investigation, maintaining a measured approach as authorities delve into the scandal case even more."
 jap_yoshida.36.a: "Another stain to our reputation!"
 jap_yoshida.37.t: "Justice Minister Invokes 'Command Authority' Amidst Scandal Unveiling"
 jap_yoshida.37.d: "Following an arrest warrant for Eisaku Sato, Secretary-General of Jiyu-to, issued yesterday in connection to the shipbuilding scandal on charges of third-party bribery, Justice Minister Takeru Inukai made an unexpected move today. Citing Article 14 of the Public Prosecutor's Office Law, Inukai invoked his command authority, ordering Prosecutor General Tosuke Sato to suspend the arrest. The rationale presented was the ongoing deliberations of crucial bills in the National Diet, deeming the presence of the Secretary-General necessary. However, Justice Minister Inukai simultaneously announced his resignation as well, effective tomorrow, with Ryogoro Kato expected to succeed him. The reasons for resignation remain undisclosed for now."
 jap_yoshida.37.a: "Questionable."
 jap_yoshida.38.t: "No-Confidence Motion Rejected in House of Councillors"
 jap_yoshida.38.d: "Following yesterday's passage of a No-Confidence Motion against the Yoshida Cabinet in response to the command authority controversy, today's session appeared poised to seal the fate of the Cabinet. Expectations were high for the motion's approval, potentially heralding the ousting of the Yoshida Cabinet.\n\nHowever, in an unexpected turn of events, internal divisions within the Kaishin-to party intervened, securing the Cabinet's survival. Disputes and differing opinions within Kaishin-to led to a last-minute rejection of the motion, as members cast negative votes and abstentions. Adding a peculiar note to the proceedings, leaflets were hurled from the audience during a committee chairman's speech. The disruptor, Shinoda Minoru of the Dai-Nippon Aikoku-to, was promptly ejected from the venue."
 jap_yoshida.38.a: "The opposition won't back down easily, indeed."
 jap_yoshida.39.t: "Prosecutor General Sato Testifies"
 jap_yoshida.39.d: "The Budget Committee convened today to conclude its inquiries into the shipbuilding scandal. Prosecutor General Tosuke Sato carefully opened his furoshiki wrapping containing \"professional secrets\" and skimmed through the materials before taking stand and giving his testimony. Committee Chairman Tanaka Akira sternly observed, puffing a cigar in the background.\n\nSato asserted that the invocation of command authority by Justice Minister greatly impeded the shipbuilding scandal investigation. This use of authority, purportedly to shield politicians, has eroded the political legitimacy of Japan's democratic system, marking a regrettable setback. He also hinted at an underlying agenda, suggesting a plan to manipulate legal appointments by invoking command authority. Acknowledging internal conflicts, Sato admitted a divergence in prosecution policy, particularly concerning evidence evaluation. Senior prosecutors, uneasy about the Special Investigation Department's forceful approach, discreetly proposed to the Justice Minister to halt the investigation through command authority.\n\nSato confirmed monetary exchanges between the shipbuilding industry and Jiyu-to but highlighted the challenge of proving bribery with irrevocable evidence. The Shipbuilding Scandal chapter concludes with 71 arrests and 35 indictments. Of these, 23 had significant involvement, 7 were acquitted, 12 received suspended sentences, and 2 were fined. Both Prosecutor General and the Tokyo District Chief Prosecutor signal the end, with no plans of further raids, investigations, or arrests."
 jap_yoshida.39.a: "The end justifies the means...?"
 jap_yoshida.40.t: "Yoshida Criticised for Subpoena Refusal"
 jap_yoshida.40.d: "Despite the conclusion of the Shipbuilding Scandal investigation, Prime Minister Yoshida faces lingering criticism for his recent refusal to appear before the Budget Committee. This move continues to be exploited by opposition lawmakers seeking to tarnish the reputation of the already-struggling Yoshida Cabinet.\n\nIn an understated but significant move, Tanaka Akira, Chairman of the Budget Committee, along with members from four opposition parties' Accounts Committee, visited the Supreme Public Prosecutors Office to meet with Prosecutor General Tosuke Sato and Chief Prosecutor Baba Yoshitsugu of the Tokyo District Public Prosecutors Office. During the meeting, a formal complaint was submitted to Chief Prosecutor Yoshitsugu, accusing Prime Minister Yoshida of violating the Parliamentary Testimony Law. The complaint alleges that Yoshida's refusal to appear before the committee was unjustified, citing official duties and overseas trip preparations as inadequate reasons to bypass the legal obligation to testify.\n\nAs the Yoshida Cabinet grapples with existing challenges, the opposition's critique further intensifies, creating additional hurdles for the already-embattled administration."
 jap_yoshida.40.a: "Another nail to the coffin."
