 JAP_SF_Treaty_Category: "Peace Deal Mission"
 JAP_SF_Treaty_Category_desc: "\n\n\n\n\n£GFX_JAP_SF_Treaty_Categor_Banner\n\n\n\n\n\n\n§YJohn Foster Dulles§!, dispatched from Washington, has arrived in Tokyo. His visit symbolizes a decisive §Yshift in occupation policy§!. The original aims of demilitarizing and democratizing Japan are beginning to change as the §YCold War§! deepens. Faced with the spread of communism across Asia, the United States no longer sees Japan merely as an isolated defeated nation, but as a §Gcentral pillar of the Pacific order§!.\n\nYet peace will not simply mean the restoration of sovereignty. The continued presence of §RAmerican military bases§!, the question of a §Ysecurity treaty§!, the future of §YOkinawa§!, and growing pressure for §Rrearmament§! all remain unresolved. To regain its independence, Japan must decide whether to accept a new form of §Rdependence§!, or pursue a broader peace settlement down a far more uncertain path.\n\nThe course of post-war Japan is now being decided.\n\n\nPROPOSAL INFLUENCE\n§Y[USA.GetFlag]The United States§!: [?JAP_Peace_Deal_Mission_support_USA_var|%]\n§Y[SOV.GetFlag]Soviet Union§!: [?JAP_Peace_Deal_Mission_support_SOV_var|%]\n§Y[JAP.GetFlag]State of Japan§!: [?JAP_Peace_Deal_Mission_support_JAP_var|%]\n\n\nThough Japan was defeated in the Second World War, we shall not remain a mere servant of the Allies. We must stand firm on what we will accept and what we will refuse. However, §ROverwhelming foreign influence over the Japanese proposal will shatter the peace settlement!§!\n"
 JAP_Keiretsu_Category: "Empowering the Keiretsu"
 JAP_Keiretsu_Category_desc: "After the war, the American occupation authorities dismantled the powerful zaibatsus, which were large enterprises in our land, in an effort to break their monopolistic control. However, in the present day, we should consider the need to utilise the remnants of these industrial giants. Reviving them as '§YKeiretsus§!' could be a vital step in revitalising post-war Japan, which currently finds itself in a state of economic disarray. These historically influential business conglomerates have the potential to bring stability and economic growth to a nation that is eager to rebuild and regain its former prosperity. By reinvigorating the spirit of cooperation and long-term strategic planning that Keiretsus represent, Japan may find the necessary foundation to address its current challenges and pave the way for a brighter future."
