 KOR_korean_war_victory.1.d:0 "We just won the war. No one could have guessed what'll happened if we lost. Now, we gotta properly rule the Northern region of our country."
 KOR_diplo50s.1.d:0 "After the United States of America arranged conversations between Republic of Korean and Japanese politicians, the official Japanese-Korean diplomatic conference is scheduled to be held between the two parties. They will discuss historical conflicts, territorial disputes, and the matter of relocating of Japano-Koreans to North Korea."
 KOR_Kim_Koo_assasination.0.d:0 "We gotta prepare for the upcoming event. How it'll work?"
 KOR_Kim_Koo_assasination.1.d:0 "Hopes for Korean reunification and reinvigorated nationalism in the Republic of Korea have ended today, as its prominent advocate, Kim Koo, was assassinated today. According to police, Ahn Doo-hee, a lieutenant in the ROK Army, burst inside the residence of Kim Koo and shot him 4 times. According to Ahn, he claims that he has sole responsibility for the assassination, claiming it was done of his own fruition, and that no other party played a role in Kim Koo's assassination. He also stated that Kim Koo is allegedly a collaborator with the Soviet Union, and that his presence in Republic of Korea serves as a breeding ground for rebellion and insurgency. However, observers believe otherwise, and they speculate that the assassination attempt was actually orchestrated by the Rhee administration itself in an effort to consolidate power and influence throughout the Republic. Nevertheless, this assassination will be a stain on the Rhee administration's reputation."
 KOR_Kim_Koo_assasination.2.d:0 "Hopes for Korean reunification and reinvigorated nationalism in the Republic of Korea almost ended today, as its prominent advocate, Kim Koo, was so close to assassinated today. Ahn Doo-hee, a lieutenant in the ROK Army, burst inside the residence of Kim Koo and almost shot him, but right before that, Kim Koo was jumped to him and screamed for help. At that moment, the guards in the residents were quickly running into the house and subdued the suspect. Later this morning, Kim Koo made the statement that the killer that sent to his house was a 'clearly one of president Syngman Rhee's people'. The Kim Koo had no injury, and this assassination attempt will be a dark stain on the Rhee administration's reputation."
 KOR_kimseongsu.2.d:0 "Many citizens were stricken by grief in Republic of Korea as Kim Seong-su, a renowned Korean newspaper owner and a senior politician, passed away of illness in Seoul. During the Japanese occupation period, Kim Seong-su had run various organizations ranging from a press company to textile companies and schools, and contributed to the cultural modernization of Korea. Like many other Korean newspaper owners of his time, Kim Seong-su supported Japanese war effort in several articles. After the liberation of Korea, Kim Seong-su openly reflected on his past activities and became the second vice president of the Republic of Korea. However, he resigned in protest against President Syngman Rhee’s dictatorial behaviors. He has continued advocating democracy until his recent death."
 KOR_yisiyeong.2.d:0 "Many citizens were stricken by grief in Republic of Korea as Yi Si-yeong, a renowned Korean independence activist and a senior politician, passed away of natural causes in Busan. Yi Si-yeong and his family members had devoted their whole life to the Korean independence movement, spending much of their wealth for independence movements both domestic and abroad. After Korea's liberation from Japanese colonial rule, Yi Si-yeong was elected the first vice president of the Republic of Korea thanks to his high reputation. His funeral is going to be held near Busan."
 KOR_SYNGMANRHEE48.1.d:0 "The official activity of the Special Investigation Committee on Act of Betrayal has been unexpectedly suspended due to a raid on its office building. The culprit behind this raid turned out to be the police force of the Syngman Rhee administration. Syngman Rhee has long been critical of the committee’s investigation on ex-Japanese collaborators in the political, economic, and cultural fields of Republic of Korea, especially the police force. Following the dissolvement of the committee, Syngman Rhee’s administration arrested opponent legislators on charges of being a spy of the Worker’s Party of Republic of Korea. The arrested legislators, including the Vice Chairman of the National Assembly, had played a major role in organizing the committee."
 KOR_SYNGMANRHEE48.2.d:0 "In this aternoon, the Bodo league was established. The establishment of this organization was modeled after Daehwasuk, a pro-Japanese conversion group during Japanese colonial era, and is related to the National Security Act, which took effect in December 1948, and it is analyzed that the Korean government needed an institution to systematically protect, manage, and monitor converts. Prosecutor Sunwoo Jong-won and Oh Je-do led the formation process."
 KOR_SYNGMANRHEE48.3.d:0 "In this morning, the eradication campaign in Jeju just ended. The First Republic of Korea under President Syngman Rhee escalated the suppression of the uprising from August 1948, declaring martial law in November and beginning an \"eradication campaign\" against rebel forces in the rural areas of Jeju in March 1949, defeating them within two months. The situation in Jeju doesn't seem good."
 KOR_SYNGMANRHEE48.4.d:0 "After independence on August 15, 1945, there were several left-wing parties in Republic of Korea, but the activities of the Korean Communist Party were almost at a standstill, so the three parties (the Communist Party of Korea, the People's Party of Korea, and the New Democratic Party of Republic of Korea) were merged to form the 'Worker's Party of Republic of Korea.' Heo Heon was elected as the first chairman and vice chairman Park Hon-yong was elected. This week, President Syng-man Rhee of the First Republic enacted the National Security Law, ousting all communist forces in the Republic of Korea using public power under the National Security Law."
 KOR_SYNGMANRHEE48.5.d:0 "The day after martial law was declared in Busan, 50 legislators were arrested and led away by the military police while they were commuting by bus to their workplace. Syngman Rhee administration accused them of being a member of the ‘International Communist Party’ and conspiring against the Republic of Korean government. The legislators were interrogated and held in custody for the next 27 hours. Many members of the National Assembly including the arrested lawmakers have spoken out against Syngman Rhee’s proposal to amend the constitution and extend the presidential term limits. The Vice President Kim Seong-su resigned in protest, and the UN Commission in Korea criticized Syngman Rhee government’s violent behavior."
 KOR_SYNGMANRHEE52.1.d:0 "Today, the first constitutional amendment of the Republic of Korea was passed. After a month-long martial law period, the constitutional amendment to extend presidential term limits was passed by 163 votes to 3. The previously arrested legislators were released the day before the vote for the purpose of taking part in the constitutional amendment vote. The vote for the constitutional amendment was done by rising the show of hands. The new constitution includes direct election systems for presidential elections and vice-presidential elections, and the nomination and dismissal of cabinet members by the request of the prime minister."
 KOR_SYNGMANRHEE52.2.d:0 "The second constitutional amendment of the Republic of Korea to remove term limits for its first president was previously thrown aside because the vote lacked one of being two-thirds of the parliamentary seats. However, the vote result has been reinterpreted to be passed as the Syngman Rhee government and the ruling party concluded that the quorum for the constitutional amendment was inaccurate. The government officials pointed out that 135 and one-third votes, which is the minimum requirement for a constitutional amendment, is equal to 135 votes. The legislators of the non-governing parties left the National Assembly building in protest against the unexpected passage of the new constitutional amendment."
 KOR_SYNGMANRHEE56.1.d:0 "Chang Myon, the incumbent vice president of the Republic of Korea and a prominent figure of the non-governing party, was shot to the left hand while he was attending the party conference of the Democratic Party. The assassin was caught in the act shortly after the attempt was made. Although the assassin claimed that he was ordered by another member of the Democratic Party to assassinate Chang Myon, many believe that the ruling party and the chairman of the National Assembly, Lee Ki-poong to be the real culprit behind this incident. Because of president Syngman Rhee’s old age, many members of the Liberal Party have long feared the possibility of Chang Myon’s succession of the presidency."
 KOR_SYNGMANRHEE56.2.d:0 "Today, many prominent politicians who oppose Syngman Rhee’s dictatorship gathered at the Jangchungdan Park to deliver their speeches about the current political situation of the Republic of Korea. About 200,000 citizens of Seoul came to listen to their speech. When Cho Pyung-ok was about to give a speech, however, gangsters with blunt weapons appeared on the scene and interrupted his speech. Due to their assault and arson attack, the politicians were forced to dismiss the event shortly after. Cho Pyung-ok and Chang Taek-sang strongly denounced the Syngman Rhee government, which is suspected to have staged the sabotage against the speech."
 KOR_SYNGMANRHEE56.3.d:0 "Cho Bong-am, the previous Progressive Party candidate, has been found guilty of treason and espionage, and sentenced to death. After his first trial had failed to accrue enough evidence to convict him several months ago, dozens of anti-communist gangs stormed into the court and criticized Cho Bong-am and the judge. Despite much argument and efforts to save him from execution, a more recent trial concluded that Cho Bong-am made attempts to contact North Korean spies and destroy the Republic of Korea. The heightened state of affairs has led to an increased state of awareness in the country and additional funding to audit systems."
 KOR_SYNGMANRHEE56.4.d:0 "Massive scale of electoral corruption and abuse of power are suspected to have happened in the presidential and vice-presidential elections of the Republic of Korea. According to multiple reports, state employees and political gangs associated with the Liberal Party bribed or threatened voters, and even rigged the votes. According to official results, vice-presidential candidate Lee Ki-poong won a landslide victory against his rival candidate, Chang Myon. However, the Democratic Party accused the authorities of vote rigging, and many people protested against the authorities in the streets of Gwangju and Masan. Eventually, the police force and political gangs violently crushed these protests."