 Samoan_Proposal.1.d:0 "The Pentagon recently presented a new proposal to deal with the Korean refugee crisis. Jeju is very vulnerable to communist aggression, any attempt to strengthen a government in exile could result in renewed conflict with us at the disadvantage. The Pentagon wishes to turn Samoa into the main base for a democratic Korean government in exile. Korean refugees can also be resettled there. Samoa offers a safe base, in the Pacific, from which a future liberation campaign can be waged."
 Samoan_Proposal.2.d:0 "The United States wishes to relocate our government in exile and refugees to Samoa. They promise us extensive autonomy. Samoa is in the Pacific and safety away from communist forces. Our military and political experts note we can rebuild our forces and built our legitimacy without the fear of communist interference. The reality of our circumstances mean even if we do not like the proposal, it's smart to agree to that proposal..."
 Samoan_Proposal.4.d:0 "The situation in Jeju Island is more terrible than we expected. The Korean government has failed to control Jeju residents, and it seems that it cannot hold on anymore. If we had intervened a little bit, we could have provided them with support and supplies and maybe given the island to Japan or we could have occupied it ourselves. However, it is already late. Now control of the island is effectively taken by North Korea. We can't choose anything. We just have to decide. And we are in a hurry."
 Samoan_Proposal.9.d:0 "The United States Navy confirmed thousands of Korean refugees fleeing communist occupation are currently being transported to Samoa. This is the first wave as the American government plans to move as many refugees as possible. Senior surviving Republic of Korean civil and military leaders are already in Samoa. They are establishing a government of exile and an administrative structure to oversee the arriving refugees. Their is concern among Koreans and other American allies that the new government in Samoa may be too far away or isolated to effect change in Korea. However, the United States insists a base in Samoa offers the best access while maintaining the security of the democratic Korea forces."
 Samoan_Proposal.10.d:0 "The Republic of Korea opened its first session of a new National Assembly in Samoa. Inaugurating the beginning of its new government in exile following the communist takeover of Republic of Korea. The session saw leading military and civil leaders promise to help settle refugees in Samoa and begin preparing for a campaign of national liberation. Much thanks was given to the United States for facilitating the establishment of a capital in Samoa. Although American allies were quick to congratulate the Korean government, the news is being widely mocked in socialist states. The communist Korean government condemned the Samoa regime as American puppets with no comprehension of reality."
 KOR_Bad_End.1.d:0 "USA... They're putting pressure on it. We have no choice."
 KOR_Bad_End.2.d:0 "Lee Ki Poong is dead. Who could've guessed? Since 1957, Lee has been suffering from angular neuralgia and angina already."
 KOR_Bad_End.3.d:0 "Shin Sung-mo is dead. The cause of death was a cerebral hemorrhage."
 KOR_Bad_End.4.d:0 "Syngman Rhee is dead. The cause of death was acute gastrointestinal bleeding."
 KOR_Bad_End.5.d:0 "Chang Myon is dead. The cause of death was hepatitis."
 KOR_Bad_End.6.d:0 "God of love, just stay there. Do not try to save us."
 KOR_Bad_End.7.d:0 "Lee Beom-seok is dead. The cause of death was myocardial infarction."
 KOR_Bad_End.8.d:0 "Hong Jin-ki is dead. The cause of death was a stroke."
 KOR_Bad_End.9.d:0 "God of love, just stay there. Do not try to save us."
 KOR_Bad_End.10.d:0 "God of love, just stay there. Do not try to save us."
