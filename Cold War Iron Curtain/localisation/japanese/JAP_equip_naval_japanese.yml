l_japanese:
 JAP_carrier_hull_1:0 "CVH-A"
 JAP_carrier_hull_4:0 "いずも型"
 JAP_carrier_hull_1_desc:0 "海上自衛隊の空母への野望は遙か昔から存在していた。1950年代の設立当初から、アメリカ海軍からのリースという形も視野に入れながら取得を計画していた。このコンセプトは1960年代初頭に考えられていた計画の内一つである。一つは18機のHSS-2（SH-3 シーキング）哨戒ヘリコプターと6機のS-2トラッカー海上哨戒機を搭載可能な23,000トン級のヘリ空母であるCVH-aであり、もう一つはこれよりもずっと小型だが、18機のHSS-2を搭載可能なCVH-bである。"
 JAP_carrier_hull_4_desc:0 "いずも型護衛艦として知られる22DDHは海上自衛隊（JMSDF）で現役のヘリ空母である。"
 JAP_carrier_hull_light_1:0 "CVH-B"
 JAP_carrier_hull_light_3:0 "おおすみ型"
 JAP_carrier_hull_light_4:0 "ひゅうが型"
 JAP_carrier_hull_light_1_desc:0 "海上自衛隊の空母への野望は遙か昔から存在していた。1950年代の設立当初から、アメリカ海軍からのリースという形も視野に入れながら取得を計画していた。このコンセプトは1960年代初頭に考えられていた計画の内一つである。一つは18機のHSS-2（SH-3 シーキング）哨戒ヘリコプターと6機のS-2トラッカー海上哨戒機を搭載可能な23,000トン級のヘリ空母であるCVH-aであり、もう一つはこれよりもずっと小型だが、18機のHSS-2を搭載可能なCVH-bである。"
 JAP_carrier_hull_light_3_desc:0 "おおすみ型は野心的なドック型揚陸艦である。海上自衛隊はおおすみ型を戦車揚陸艦であると位置づけているが、おおすみ型は戦車揚陸艦に伝統的に存在してきた艦首のバウ・ドアやビーチング能力を欠いていて、船尾のウェルドックがおおすみ型の機能をよりドック型揚陸艦らしくさせている。"
 JAP_carrier_hull_light_4_desc:0 "ひゅうが型ヘリコプター搭載護衛艦は海上自衛隊によって建艦されたヘリ空母の級である。"
 JAP_screen_hull_medium_0:0 "あさひ型"
 JAP_screen_hull_medium_0_desc:0 "あさひ型護衛艦は日本の海上自衛隊の護衛艦の一種である。前身はアメリカ海軍のキャノン級護衛駆逐艦であり、アメリカ海軍から貸与され、1955年から1975年まで就役した。"
 JAP_screen_hull_medium_1:0 "あけぼの型"
 JAP_screen_hull_medium_1_desc:0 "あけぼの型護衛艦は海上自衛隊の護衛艦(もしくはフリゲート艦)であり、第二次世界大戦後に日本で最初に建造された国産戦艦の一つである。"
 JAP_screen_hull_medium_2:0 "ちくご型"
 JAP_screen_hull_medium_2_desc:0 "ちくご型護衛艦（もしくはフリゲート艦）は、いすず型護衛艦の後継艦として海上自衛隊が建造した護衛艦であり、いずず型護衛艦と同じく対潜戦を任務とする型である。この型に続いて、いしかり型護衛艦が建造された。日本の護衛艦としては初めて対潜水艦ミサイル「ASROC」を搭載している。"
 JAP_screen_hull_medium_3:0 "ゆうばり型"
 JAP_screen_hull_medium_3_desc:0 "ゆうばり型護衛艦（もしくはフリゲート艦）は海上自衛隊のいしかり型護衛艦の後継艦である。ゆうばりの名前は、第二次世界大戦中に活躍した（そして失われた）、1920年代から1930年代の実験的な軽巡洋艦にちなんで付けられたものである。"
 JAP_screen_hull_medium_4:0 "あぶくま型"
 JAP_screen_hull_medium_4_desc:0 "あぶくま型護衛艦（もしくはフリゲート艦）は海上自衛隊の汎用型護衛艦であり、ゆうばり型護衛艦の後継艦である。"
 JAP_screen_hull_heavy_0:0 "ありあけ型"
 JAP_screen_hull_heavy_0_desc:0 "ありあけ型護衛艦は海上自衛隊の護衛艦の一種である。前身はアメリカ海軍のフレッチャー級駆逐艦であり、アメリカ海軍から貸与され、1959年から1974年まで就役した。"
 JAP_screen_hull_heavy_1:0 "あきづき型"
 JAP_screen_hull_heavy_1_desc:0 "あきづき型護衛艦は海上自衛隊によって1950年代後半に建造された護衛艦クラスである。この艦は指揮統制能力を強化した船団司令部としての運用を計画されたため、非公式に「DDC」（駆逐艦司令部）と分類されることもあった。"
 JAP_screen_hull_heavy_2:0 "はつゆき型"
 JAP_screen_hull_heavy_2_desc:0 "はつゆき型護衛艦は海上自衛隊に所属する護衛艦の一種であり、海上自衛隊の第一世代汎用型護衛艦の一等艦である。"
 JAP_screen_hull_heavy_3:0 "はたかぜ型"
 JAP_screen_hull_heavy_3_desc:0 "はたかぜ型ミサイル護衛艦は海上自衛隊に所属する第三世代の艦艇であり、海上自衛隊で初めてガスタービンを搭載した艦船である。"
 JAP_screen_hull_heavy_4:0 "こんごう型"
 JAP_screen_hull_heavy_4_desc:0 "海上自衛隊のこんごう型ミサイル護衛艦はイージスシステムを搭載しており、米国以外では数少ない艦種である。"
 JAP_battle_hull_light_2:0 "はるな型"
 JAP_battle_hull_light_2_desc:0 "はるな型護衛艦は海上自衛隊によって1970年代前半に建造された護衛艦の艦種である。このヘリコプター搭載護衛艦（DDH）は、最大3機のヘリコプターを格納する大型の中央格納庫を中心に建造されている。"
 JAP_battle_hull_light_3:0 "しらね型"
 JAP_battle_hull_light_3_desc:0 "しらね型護衛艦は1970年代後半に建造された日本の護衛艦である。はるな型護衛艦の後継艦として、ヘリコプターを最大3機収容できる大型格納庫を中心に建造された。"
 JAP_sub_hull_small_single_0:0 "なつしお型"
 JAP_sub_hull_small_single_0_desc:0 ""
 JAP_sub_hull_small_single_1:0 "あさしお型"
 JAP_sub_hull_small_single_1_desc:0 "あさしお型潜水艦は日本の海上自衛隊の潜水艦の一種であり、この艦は、おおしお型潜水艦の後継艦である。"
 JAP_sub_hull_small_single_2:0 "あさしお型改"
 JAP_sub_hull_small_single_2_desc:0 "あさしお型潜水艦は日本の海上自衛隊の潜水艦の一種であり、この艦は、おおしお型潜水艦の後継艦である。"
 JAP_sub_hull_small_single_3:0 "おやしお型"
 JAP_sub_hull_small_single_3_desc:0 "おやしお型潜水艦は海上自衛隊が運用する日本の通常動力型潜水艦であり、1990年代後半に就役した。この潜水艦は、従来のはるしお型潜水艦よりも大型化されており、側面ソナーアレイを搭載するためのスペースを確保している。"
 JAP_sub_hull_small_single_4:0 "そうりゅう型"
 JAP_sub_hull_small_single_4_desc:0 "そうりゅう型潜水艦は通常動力型潜水艦である。同型の1番艦は2009年に海上自衛隊に就役した。"
 JAP_sub_hull_large_single_0:0 "おやしお型"
 JAP_sub_hull_large_single_0_desc:0 "おやしお型潜水艦は海上自衛隊の潜水艦である。ベーリング海峡を下る寒流「おやしお海流」にちなんで命名された。"
 JAP_sub_hull_large_single_1:0 "おおしお型"
 JAP_sub_hull_large_single_1_desc:0 "おおしお型潜水艦は海上自衛隊で唯一運用されていた艦船である。老朽化したくろしお型潜水艦の後継艦として計画・建造された。"
 JAP_sub_hull_large_single_2:0 "うずしお型"
 JAP_sub_hull_large_single_2_desc:0 "うずしお型潜水艦（渦潮に由来）は従来型のあさしお型潜水艦に対して水中性能を重視した涙滴（ティアドロップ）型潜水艦の第一世代として、海上自衛隊に就役していた潜水艦である。"
 JAP_sub_hull_large_single_3:0 "ゆうしお型"
 JAP_sub_hull_large_single_3_desc:0 "ゆうしお型潜水艦は海上自衛隊が運用する日本の通常動力型潜水艦の艦種である。うずしお型潜水艦の発展型である第2世代潜水艦で、涙滴（ティアドロップ）船型を取り入れ、その結果水中性能を向上させた。"
 JAP_sub_hull_large_single_4:0 "はるしお型"
 JAP_sub_hull_large_single_4_desc:0 "はるしお型潜水艦は海上自衛隊が運用する通常動力型潜水艦の一種である。ゆうしお型潜水艦を若干大型化し、騒音対策を施した設計となっている。"