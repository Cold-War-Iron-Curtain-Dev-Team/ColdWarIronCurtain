l_japanese:
 LOADING_TIP_0:0 "バルト海のシュテッティンからアドリア海のトリエステまで、ヨーロッパ大陸を横切る鉄のカーテンが降ろされた。\n- ウィンストン・チャーチル、1946年5月5日"
 LOADING_TIP_1:0 "レーニンのもとでは、ソビエト連邦は宗教的な復活のようだった、スターリンのもとでは監獄のよう、フルシチョフのもとではサーカスのよう、そしてブレジネフのもとではアメリカの郵便局のようだった。\n- ズビグネフ・ブレジンスキー 1977年11月7日"
 LOADING_TIP_2:0 "ゴルバチョフさん、 この壁を壊してください！ \n- ロナルド・レーガン、 1987年6月12日"
 LOADING_TIP_3:0 "私には夢がある。それは、いつの日か、ジョージア州の赤土の丘で、かつての奴隷の息子たちとかつての奴隷所有者の息子たちが、兄弟として同じテーブルにつくという夢である。\n- マーティン・ルーサー・キング・ジュニア、 1963年8月28日"
 LOADING_TIP_4:0 "資本主義とは奴隷制の紳士的なやり方に他ならない。\n-クワメ・ンクルマ、1968年"
 LOADING_TIP_5:0 "時に、 民主主義は血を浴びる必要もあるのだ。 \n- アウグスト・ピノチェト、日付不詳"
 LOADING_TIP_6:0 "共産主義は愛ではない。 共産主義とは、 敵を粉砕するための金槌である。 \n- 毛沢東、 1949年10月1日"
 LOADING_TIP_7:0 "あなたの敵を許しなさい。しかし、その名前は決して忘れるな。\n-ジョン・F・ケネディ、1963年"
 LOADING_TIP_8:0 "アジアの青年が自らやるべきことを、アメリカの青年に故郷から1万マイル近くも離れた所へ行かせてやらせるつもりはない。\n-リンドン・B・ジョンソン、1964年10月21日"
 LOADING_TIP_9:0 "歴史の中では稀にしか来ない瞬間が訪れる。それは、古いものから新しいものへと一歩踏み出す時、\n 時代が終わり、長い間抑圧されてきた国家の魂が言葉を発する時である。\n- ジャワハルラール・ネルー、1947年8月14日"
 LOADING_TIP_10:0 "今日、自由は攻勢に出ており、\n 民主主義は行進中である。\n- ダグラス・マッカーサー、1945年12月2日"
 LOADING_TIP_11:0 "政治の芸術とは、周りを取り巻くものの少し下の相手を殴る必要があるときに、正確に知ることにある。\n-コンラート・アデナウアー、日付不詳"
 LOADING_TIP_12:0 "ソマリアを去るとき、私は建物は残すが、人は残さない。\n- シアド・バーレ、1991年"
 LOADING_TIP_13:0 "私はマルクス・レーニン主義者であり、人生の最後の日までそうであろう。\n- フィデル・カストロ、1961年12月2日"
 LOADING_TIP_14:0 "今日、カイロ、ダマスカス、バグダッドの上空を飛び交う自由の旗は、\n 中東の他の地域の上空を飛び交うことになるだろう。\n- ガマール・アブドゥル＝ナーセル、1958年7月19日"
 LOADING_TIP_15:0 "そして思ったのである。世界はカティンの森の事を知らないと！\n 彼らはカティンの森、ポーランド将校の虐殺のことは知っている。 \nしかし、ベラルーシのことは知らない。\n- エレム・クリモフ、1977年"
 LOADING_TIP_16:0 "世界大戦の脅威はもう存在しません。 \n- ミハイル・ゴルバチョフ、 1991年12月"
 LOADING_TIP_17:0 "アパルトヘイトとは善隣政策のことだ。\n- ピーター・ウィレム・ボータ、1998年"
 LOADING_TIP_18:0 "私の顧問は、私と部下との間に壁を作った。\n 私は何が起こっているのか気がつかなかった。目が覚めたとき、私は仲間を失っていた。\n-モハンマド・レザー・パフラヴィー、日付未詳"
 LOADING_TIP_19:0 "壁は戦争よりずっと良い地獄である。\n- ジョン・F・ケネディ、1961年8月"
 LOADING_TIP_20:0 "全ての暗黒の地に届く自由の光が、ついに暗闇がなくなるまで明るく燃え盛ることを祈ろう。\n ドワイト・D・アイゼンハワー、第2回大統領就任演説、1957年"
 LOADING_TIP_21:0 "好むと好まざるとにかかわらず、歴史はこちらの味方だ。\n 我々は君たちを葬り去る。\n- ニキータ・フルシチョフ、1956年11月18日"
 LOADING_TIP_22:0 "私は独裁者ではないし独裁者になろうとも思わない。 マシンガンによって権力を維持するつもりもない。 \n- フィデル・カストロ、 1959年"
 LOADING_TIP_23:0 "主体思想の基本は、人間が万物の主であり、万物の決定的要因であるということである。\n - 金日成、1977年"
 LOADING_TIP_24:0 "私はマルクス・レーニン主義者である。\n そして、私は人生の最後の日までマルクス・レーニン主義者であり続けるだろう。\n- フィデル・カストロ、1961年"
 LOADING_TIP_25:0 "葬り去ると言ったことがあるが、それで困ったことになった。\nもちろんシャベルでは埋葬しない。君たち労働者階級が君たちを葬り去るのである。\n-ニキータ・フルシチョフ、1963年8月24日"
 LOADING_TIP_26:0 "社会主義体制と市場経済の間には根本的な矛盾はない\n-鄧小平-1985年11月4日"
 LOADING_TIP_27:0 "人類は戦争に終止符を打たなければならない、さもなければ戦争は人類に終止符を打つことになる。\n- ジョン・F・ケネディ、1961年9月25日"
 LOADING_TIP_28:0 "ベルリンは西側の睾丸だ。\n 西側に悲鳴をあげさせたい時はいつもベルリンを圧迫している。\n- ニキータ・フルシチョフ、1962年"
 LOADING_TIP_29:0 "ゴルバチョフさんは好きよ、一緒に仕事ができるわ。\n- マーガレット・サッチャー、1984年12月17日"
 LOADING_TIP_30:0 "民主主義はアフリカのためにあるのではない \n- モブツ・セセ・セコ、1992年"
 LOADING_TIP_31:0 "全体主義体制の種は、悲惨さと欲望によって育まれる。\n- ハリー・S・トルーマン、1947年3月3日"
 LOADING_TIP_32:0 "独立と自由以上に貴重なものなどない。 \n- ホー・チ・ミン、1969年"
 LOADING_TIP_33:0 "核戦争を生き残った人々は死んだ人間を羨むでしょうな。 \n- ニキータ・フルシチョフ、 1963年7月20日"
 LOADING_TIP_34:0 "植民地主義は素晴らしいことだと思う。アフリカに文明を広めたのだ。それ以前には、彼らには書き言葉も、我々が知っているような車輪も、学校も、病院も、普通の服さえ無かった。\n- イアン・スミス、1997年6月"
 LOADING_TIP_35:0 "これが私の冷戦戦略です。 「我々が勝つ、 彼らが負ける。 」\n- ロナルド・レーガン、 1988年6月2日"
 LOADING_TIP_36:0 "私がしたことは全て国のためにしたことだ \n- ポル・ポト"
 LOADING_TIP_37:0 "人は死に、国は興亡するかもしれないが、思想は生き続ける。\n 思想は死ななくても持久力がある。\n- ジョン・F・ケネディ、1962年12月14日"
 LOADING_TIP_38:0 "もしあなた（アメリカ合衆国）が私にハリネズミを投げつけてきたら、 私はつがいのヤマアラシを投げ返すでしょう。 \n- ニキータ・フルシチョフ、 1963年11月7日"
 LOADING_TIP_39:0 "自由な社会では芸術は兵器ではありません・・・芸術家は思想の魂の為のエンジニアではないのです。 \n- ジョン・F・ケネディ、 1963年10月26日"
 LOADING_TIP_40:0 "我々の投票は銃と共に行かなければならない。\n- ロバート・ムガベ、1976年"
 LOADING_TIP_41:0 "政治は相手をたたき出そうとする点で拳闘のようなものだ。\n- イディ・アミン、1976年1月"
 LOADING_TIP_42:0 "銃剣で植えつけられた政権は根付かない。\n- ロナルド・レーガン、1982年6月8日"
 LOADING_TIP_43:0 "これが敗北の瞬間だ 。\n 共産主義の棺桶に最後の釘を刺したのである。\n- レフ・ヴァウェンサ、囚人への手紙、1981年12月13日"
 LOADING_TIP_44:0 "冷戦の教訓は核兵器に対抗して、\n 核兵器だけが平和を維持できるということだ。\n- 鄭夢準、2013年4月9日"
 LOADING_TIP_45:0 "このような精神、すなわち76の精神に基づき。私は皆様にご起立いただき、毛沢東主席、周総理、両国の人々、そして我々の世代から子供たちの世代への遺産として平和と調和を願う子供たちに乾杯しましょう。\n- リチャード・ニクソン、1972年2月25日"
 LOADING_TIP_46:0 "私がホワイトハウスにいた時、\n冷戦という課題に直面した。ソ連も私も地球全体を破壊できる３万発の核兵器を持っていたため、平和を維持しなければならなかったのである。\n- ジミー・カーター、2012年3月30日"
 LOADING_TIP_47:0 "ナイジェリアは、1世紀以上前の東欧のオスマン帝国と同じように、今日では抑圧的で改革不可能な国となっている。\n チュクエメカ・オドメグ・オジュク、1969年"
 LOADING_TIP_48:0 "西側は共産主義を封じ込めるのではなく、共産主義を超越するのである。\n我々は共産主義を放棄することに悩まされることはなく、人類の歴史の中で最後のページが書かれようとしている奇妙な章として、共産主義を見捨てるだろう。\n- ロナルド・レーガン、1981年"
 LOADING_TIP_49:0 "私の仕事は英国が共産主義に向かうのを防ぐことです。\n- マーガレット・サッチャー、1977年"
 LOADING_TIP_50:0 "同胞のアメリカ人の皆さん、私は本日、ロシアを永久に無法化する法案に署名したことをお伝えしたいと思います。\n 5分後に空爆を開始致します。\n- ロナルド・レーガン、1984年8月11日"
 LOADING_TIP_51:0 "我々共産主義者はしばらくの間、資本家と共に行動しなければならない。 \n 我々は彼らの農業と技術を必要としている。\n- レオニード・ブレジネフ、1976年"
 LOADING_TIP_52:0 "我々は、ここで手を組んで揺り椅子に座って、\n 西半球で共産主義者に政府を樹立させようとは考えていない。\n- リンドン・B・ジョンソン、1965年"
 LOADING_TIP_53:0 "中央アフリカ人よ！今朝、諸君の軍隊が政府を掌握した。 \n 正義の時が来た。資本家階級は廃止された。 \n全ての人に平等の新時代が始まる。共和国万歳！\n- ジャン＝ベデル・ボカサ、1966年1月1日"
 LOADING_TIP_54:0 "ロシアには、見かけによらないことがある。\n- ゲオルギー・ジューコフ、1963年"
 LOADING_TIP_55:0 "我々は、同胞の兄弟愛と団結のために血の海を流してきたのであり、\n それを内側から触ったり、破壊したりする者を許してはならない。\n- ヨシップ・ブロズ・チトー、1975年"
 LOADING_TIP_56:0 "ソ連は確かに我々の最大の脅威であったが、\n それはソ連が行ったことのためというよりも、\n ソ連が我々の失敗を言い訳にしたためである。\n- J・ウィリアム・フルブライト、1963年"
 LOADING_TIP_57:0 "我々は、勝利の果実さえも口の中で灰になってしまうような世界的な核戦争の費用を、早急に、あるいは不必要に危険にさらすことはないが、\nどんな時でもそれに直面しなければならないときは、その危険から身を縮めてはならない。\n- ジョン・F・ケネディ、1963年"
 LOADING_TIP_58:0 "[The Albanians]はかなり後進的で、原始的な民族のようである。彼らは犬のように忠実であり、それは原始人の特徴の一つでもある。\n 我々チュヴァシ人もそうだった。ロシアのツァーリはいつも彼らを護衛に使っていた。  \n ヨシフ・スターリン、1947年"
 LOADING_TIP_59:0 "自制心？なぜ彼らの命を救うことにこだわる？\n すべての思想は、ろくでなしを殺すことだ 。\n戦争の終わりに2人のアメリカ人と1人のロシア人が生き残っていれば我々の勝利である。\n- トミー・パワー、1960年"
 LOADING_TIP_60:0 "宗教は国籍や国家とは関係ない……信仰の問題は忘れてはならない、\n慎重に対処しなければならない、なぜなら人民の宗教的感情を害してはならないからである。\n ヨシフ・スターリン、エンヴェル・ホッジャに対して、1949年"
 LOADING_TIP_61:0 "誤魔化されるのをやめましょう、\n 今、私たちは冷戦の中にいます。\n- バーナード・バルーク、1947年4月16日"
 LOADING_TIP_62:0 "今日、我々は共産主義的無神論とキリスト教の間の最終的かつ全面的な戦いにに携わっております。\n 共産主義の現代の闘士たちは、この時を選んだのです。\n そして紳士淑女の皆さん、もう後戻りできません、本当にもう後戻りできないのです。\n- ジョセフ・マッカーシー、1950年2月9日"
 LOADING_TIP_63:0 "愛国心のない人はポルトガル人とは思えない。\n -アントニオ・デ・オリヴェイラ・サラザール、1952年"
 LOADING_TIP_64:0 "共産主義に対抗してヨーロッパを守るという意味ならば、譲歩してはならない。\n 民主主義の未来はここに留まることを必要としていると私は信じている。\n- ルシアス・D・クレイ、ベルリンにて、1948年"
 LOADING_TIP_65:0 "私は、以前に死んだ人々に再会し、我々が蒔いた種が根付いたことを伝えるために死ななければならない。\n- 処刑前のメンギス・トゥネウェイ、1961年3月30日"
 LOADING_TIP_66:0 "我々は誰か他の人の国家主義を望んでいるわけではない。\n- ジョモ・ケニヤッタ、1964年"
 LOADING_TIP_67:0 "銃撃戦は終わったとはいえ、冷戦が温まりつつある最中である。\n- バーナード・バルーク、1947年"
 LOADING_TIP_68:0 "我々は国家の出生率と戦っていた。 \n- デイヴィッド・ハルバースタム、ベトナム戦争について、2011年"
 LOADING_TIP_69:0 "共存の唯一の選択肢は規則の組み立てである。\n- ジャワハルラール・ネルー、1954年8月29日"
 LOADING_TIP_70:0 "町を救うためには町を破壊することが必要になった。\n- 無名の米陸軍少佐、ベトナムの村の爆撃について、1968年"
 LOADING_TIP_71:0 "人間の犠牲の大部分を払うのは兵士である。戦争では、すべてが一人の人間の性格に帰着することは驚くべきことである。\n クレイトン・エイブラムス大将、1969年"
 LOADING_TIP_72:0 "歴史の中では稀にしか来ない瞬間が訪れる。\n それは、古いものから新しいものへと一歩踏み出す時、\n 時代が終わり、長い間抑圧されてきた国家の魂が言葉を発する時である。\n- ジャワハルラール・ネルー、1947年8月14日"
 LOADING_TIP_73:0 "我々は常に外に目を向け、新世界に目を向けてきたが、\n今日は新世界に目を向け、アジアとアフリカに目を向けている。\n- クレメント・アトリー、1962年11月8日"
 LOADING_TIP_74:0 "ある程度の狂気なしには、根元からの改変を実行することはできない。\n- トーマス・サンカラ、1985年"
 LOADING_TIP_75:0 "信じられないかもしれないが、\n 私は物事が平和的に解決されたことを最初に歓迎する。\n- 退陣後のモーリス・ヤメオゴ、1966年1月2日"
 LOADING_TIP_76:0 "現代の洗脳と殺意の技法、\nつまり心理学の悪用は、\n ほとんどすべての人を服従させ降伏させることができる。\n- 心の略奪、ヨースト・メアロー著、1956年"
 LOADING_TIP_77:0 "レイモンド・ショーは、私の人生で出会った中で、最も親切で、勇敢で、温かく、素晴らしい人間である。\n- ベン・マルコ、1963年"
 LOADING_TIP_78:0 "私を殺しに来たのは知っている。\n臆病者を撃て、君は人を殺そうとしているだけだ。\n-エルネスト・ゲバラ、1967年"
 LOADING_TIP_79:0 "大統領が何を望んでいるかを知っていれば、どんな官僚も彼を止めることはできない。\n 大統領は助言を受けるのをやめる時を知らなければならない。\n-ハリー・S・トルーマン、1945年"
 LOADING_TIP_80:0 "私は82人で革命を始めた。もう一度やるとしたら、10人か15人で絶対的な信念を持ってやるだろう。\n信念と行動計画を持っていれば、どれだけ少人数でも問題ではない。\n-フィデル・カストロ、1959年"
 LOADING_TIP_81:0 "すべての人間は人間なのか？\n それとも、ある者は他の者よりも人間的なのか？\n-ロメオ・ダレール、1994年"
 LOADING_TIP_82:0 "共産主義者を殺したことしかないから分からん。\n ポーランド人傭兵ラファウ・ガノヴィッチ、人を殺すのはどんな感じかと問われ、1967年"
 LOADING_TIP_83:0 "我々は世界が同じではないことを知っていた。笑う人はほとんどいなかった。泣く人もほとんどいなかった。ほとんどの人は黙っていた 。\n J・ロバート・オッペンハイマー、トリニティ実験への反応を説明した際に、1965年"
 LOADING_TIP_84:0 "我々イスラエル人はモーゼに恨みを持っていることを教えてあげよう。彼は40年間をかけて砂漠を通り、我々を中東で石油がない唯一の場所に連れて行ったのだ！\n ゴルダ・メイア"
 LOADING_TIP_85:0 "現政権下のエチオピアでは、共産主義が重要な要素になる可能性は低い。\n 共産主義の活動は限られており、効果的な発展を遂げたという兆候はない。\n 中央情報局、1952年"
 LOADING_TIP_86:0 "個人としての革命家を殺すことはできるが、思想を殺すことはできない。\n -トーマス・サンカラ、暗殺される一週間前に、1987年"
 LOADING_TIP_87:0 "尊厳がなければ自由もないし、正義がなければ尊厳もないし、独立がなければ自由な人間もいない。\n -パトリス・ルムンバ、1960年"
 LOADING_TIP_88:0 "Dialectical materialism works like cocaine, let's say. If you sniff it once or twice, it may not change your life. If you use it day after day, though, it will make you into an addict, a different man.\n - Nicolae Ceausescu, 1972"
 LOADING_TIP_89:0 "我々は奈落の底の淵で遊ぶことを得意としており、落ちても敵の体の上に落ちるだけである。\n- ハーフィズ・アル＝アサド"
 LOADING_TIP_90:0 "我々に善い手を与える者には、善い手を、悪い手を与える者には、悪を切るナイフを差し出した。\n- ハーフィズ・アル＝アサド"
 LOADING_TIP_91:0 "未来への恐れはない。我々が誰よりも強いのは、我々が真実と共にあるからであり、我々が人々と共にあるからであり、我々が神と共にあるからであり、神は人々と共にあるからである。\n- ハーフィズ・アル＝アサド"
 LOADING_TIP_92:0 "アラブ人がシリア人の胸に短剣を突き刺している間、イラン人だけが君たちを守る日が来るだろう。\n- ハーフィズ・アル＝アサド、1985年"
