l_japanese:
 USA_battle_hull_medium_0: "アイオワ級"
 USA_battle_hull_medium_1: "アイオワ級改一"
 USA_battle_hull_medium_2: "アイオワ級改二"
 USA_battle_hull_medium_3: "巡洋艦ベースライン・プログラム"
 USA_battle_hull_medium_4: "ズムウォルト級"
 USA_battle_hull_medium_0_desc: "第二次世界大戦後期の戦艦をさらに進化させた船体であり、サイズの割に高速かつ軽快で、当時としては優れた武装を持ち、ほぼ無限に新しい装備にアップグレードできる可能性を持っている。"
 USA_battle_hull_medium_1_desc: "冷戦時代の大型巡洋艦や戦艦は、さまざまな兵器で武装している。往時の大口径砲を搭載したものもあれば、新型の艦対空ミサイルや艦対地ミサイルを搭載したものもある。"
 USA_battle_hull_medium_2_desc: "冷戦時代の大型巡洋艦または戦艦で、艦対艦、艦対地、艦対空ミサイルの交戦用に様々な兵器システムで武装している。"
 USA_battle_hull_medium_3_desc: "冷戦時代の大型巡洋艦または戦艦で、航空機の運用スペースがあり、目的殺傷に特化したミサイルシステムが備えられている。"
 USA_battle_hull_medium_4_desc: "最新技術のミサイルシステムや初期のレールガン技術で武装した現代の誘導ミサイル巡洋艦や戦艦は、それまでの艦船にはない水平線の彼方からの攻撃を行うことができる。"
 USA_carrier_hull_0: "ミッドウェイ級"
 USA_carrier_hull_1: "フォレスタル級"
 USA_carrier_hull_2: "ミッドウェイ級改一"
 USA_carrier_hull_3: "中型空母計画"
 USA_carrier_hull_4: "制海艦計画"
 USA_carrier_hull_0_desc: "CVB-41級（当時は無名）は、もともと1940年にエセックス級程度の空母に装甲飛行甲板を搭載した場合の効果を調べるための設計研究として構想された。計算の結果、航空機群の規模を縮小する効果があることがわかり、標準的なエセックス級艦隊空母の航空機群が90～100機であるのに対し、航空機の規模は64機になった。また、設計が進むにつれ、イギリス海軍の装甲空母の戦時中の経験からも大きな影響を受けるようになった。"
 USA_carrier_hull_1_desc: "フォレスタル級航空母艦は、1950年代にアメリカ海軍のために設計・建造された4隻の航空母艦である。同級の艦名は、初代アメリカ合衆国国防長官であったジェームズ・フォレスタルにちなんで名づけられた。高トン数、デッキエッジエレベーター、アングルデッキを組み合わせたスーパーキャリアの最初のクラスであった。1955年に1番艦が就役し、1998年に最後の1隻が退役した。"
 USA_carrier_hull_2_desc: "ミッドウェイ級航空母艦の改修型。当初はUSSミッドウェイのみが大規模な近代化改修を行ったが、賛否両論があり費用もかさんだため、他の艦では繰り返されなかった。"
 USA_carrier_hull_3_desc: "中型航空母艦（CVV）は、1970年代にアメリカで提案された通常動力（非原子力）航空母艦の設計案である。現代の原子力空母ニミッツ級よりも小型で安価であることが望まれた。1隻が計画されたが建造されず、代わりにニミッツ級がさらに建造された。"
 USA_carrier_hull_4_desc: "SCS（制海艦）は、1970年代にアメリカ海軍のエルモ・R. ザムウォルト海軍作戦部長の下で開発・構想された航空母艦である。現在では、同様の任務を遂行できる艦艇を指す。SCSは護衛艦として、輸送船団を航空支援することを目的としていた。アメリカ海軍の予算削減により建造計画は中止された。"
 USA_carrier_hull_light_0: "インディペンデンス級"
 USA_carrier_hull_light_1: "イオー・ジマ級"
 USA_carrier_hull_light_2: "タラワ級"
 USA_carrier_hull_light_3: "ワスプ級"
 USA_carrier_hull_light_4: "アメリカ級"
 USA_carrier_hull_light_0_desc: "インディペンデンス級航空母艦は、第二次世界大戦中にアメリカ海軍で建造された軽空母の一種である。"
 USA_carrier_hull_light_1_desc: "アメリカ海軍のイオー・ジマ級強襲揚陸艦は、ヘリコプター専用艦として初めて設計・建造され、最大20機のヘリコプターを運用し、最大1,800人の海兵隊員を陸上に輸送することができる船である。"
 USA_carrier_hull_light_2_desc: "タラワ級は、アメリカ海軍が運用するLHA（Landing Helicopter Assault）型強襲揚陸艦の艦級である。1971年から1980年にかけてインガルス造船で5隻が建造され、さらに4隻が計画されたが、後に中止され、代わりにワスプ級強襲揚陸艦が加わることになった。"
 USA_carrier_hull_light_3_desc: "ワスプ級は、アメリカ海軍が運用する上陸用ヘリポートドック（LHD）強襲揚陸艦の一種である。タラワ級強襲揚陸艦をベースに、より高度な航空機や揚陸艦を運用するための改修が施されている。"
 USA_carrier_hull_light_4_desc: "アメリカ級強襲揚陸艦（旧 LHA(R)級）は、アメリカ海軍（USN）の上陸ヘリコプター攻撃（LHA）型水陸両用攻撃艦の艦級である。本級は、ヘリコプターとMV-22BオスプレイV/STOL輸送機、AV-8BハリアーIIまたはF-35ライトニングII V/STOL機、各種攻撃ヘリコプターの支援を受けて、海兵遠征隊を上陸させるように設計されている。"
 USA_carrier_hull_super_1: "キティホーク級"
 USA_carrier_hull_super_2: "ニミッツ級"
 USA_carrier_hull_super_3: "ルーズベルト級"
 USA_carrier_hull_super_4: "レーガン級"
 USA_carrier_hull_super_1_desc: "原子力時代の到来と小型化された原子炉の採用により、大型航空母艦を運用できるだけでなく、ほぼ無期限に洋上に留まることができるようになったのである。"
 USA_carrier_hull_super_2_desc: "より効率的な原子炉と、より多くの航空機を搭載できるよう設計された超大型空母。"
 USA_carrier_hull_super_3_desc: "大量の航空機を搭載し、原子炉を改良した、冷戦時代後期の先進的な超大型空母の設計。"
 USA_carrier_hull_super_4_desc: "原子炉をさらに改良し、大量の航空機を搭載し、改良されたカタパルトを利用して迅速かつ効果的に発艦させる能力を備えた、最新の超空母の設計。"
 USA_sub_hull_small_single_0: "ダーター級"
 USA_sub_hull_small_single_0_desc: "USSダーター（SS-576）は、タング級潜水艦をベースに多くの改良を加えたユニークな潜水艦で、アメリカの小型淡水魚の一種であるダーターにちなんだ艦名が付けられた艦であり、その名を持つ艦としては2隻目。"
 USA_sub_hull_small_single_1: "バーベル級"
 USA_sub_hull_small_single_1_desc: "バーベル級潜水艦は、アメリカ海軍が建造した最後の通常動力型潜水艦で、従来のクラスよりも多くの抜本的な技術改良が施されている。実験艦アルバコア（AGSS-569）で初めてテストされた涙滴型（ティアドロップ）の船体を持つ最初の量産艦であり、船体内の同じスペースに司令室、攻撃センター、戦闘司令塔を組み合わせた最初の艦であった。"
 USA_sub_hull_small_single_2: "スタージョン級"
 USA_sub_hull_small_single_2_desc: "スタージョン級潜水艦は、1960年代から2004年までアメリカ海軍で運用された原子力高速攻撃型潜水艦（SSN）の一種である。冷戦期には攻撃型潜水艦の主力艦として活躍した。"
 USA_sub_hull_small_single_3: "シーウルフ級"
 USA_sub_hull_small_single_3_desc: "シーウルフ級潜水艦は、アメリカ海軍に所属する原子力高速攻撃型潜水艦（SSN）の一種である。ロサンゼルス級の後継艦として1983年に設計が開始された。"
 USA_sub_hull_small_single_4: "バージニア級"
 USA_sub_hull_small_single_4_desc: "バージニア級潜水艦は、SSN-774級とも呼ばれ、アメリカ海軍で運用されている、原子力巡航ミサイル搭載の高速攻撃型潜水艦の一種である。ジェネラル・ダイナミクス・エレクトリック・ボート（EB）社とハンティントン・インガルス・インダストリーズ社の設計で、ステルス、情報収集、兵器システムの最新技術が盛り込まれたアメリカ海軍の最新型潜水艦である。"
 USA_sub_hull_large_single_0: "テンチ級"
 USA_sub_hull_large_single_0_desc: "テンチ級潜水艦は、1944年から1951年にかけてアメリカ海軍（USN）のために建造された潜水艦の一種である。ガトー級潜水艦やバラオ級潜水艦よりも35～40トンほど大きく、より頑丈に作られ、内部レイアウトも若干改善されていた。"
 USA_sub_hull_large_single_1: "スケート級"
 USA_sub_hull_large_single_1_desc: "スケート級潜水艦は、アメリカ海軍初の量産型原子力潜水艦である。推進器以外はすべてタング級潜水艦を進化させたものであり、運用試作艦のノーチラス級潜水艦ベースとしていた。スケート級潜水艦4隻は船尾魚雷発射管を再導入した。"
 USA_sub_hull_large_single_2: "スキップジャック級"
 USA_sub_hull_large_single_2_desc: "スキップジャック級潜水艦は、1959年から61年にかけて就役したアメリカ海軍の原子力潜水艦（SSN）のクラスである。本級は、その主力艦であるUSSスキップジャックにちなんで命名された。このクラスは、初めて涙滴型（ティアドロップ）船体とS5W原子炉を導入されたアメリカの原子力潜水艦だ。"
 USA_sub_hull_large_single_3: "ロサンゼルス級一"
 USA_sub_hull_large_single_3_desc: "ロサンゼルス級潜水艦は、アメリカ海軍に所属する原子力高速攻撃型潜水艦(SSN)だ。主艦USSロサンゼルス（SSN-688）の船体番号から688級（シックスエイトエイト）とも呼ばれ、1972年から1996年までに62隻が建造され、後半の23隻は688iに改良されている。"
 USA_sub_hull_large_single_4: "ロサンゼルス級二"
 USA_sub_hull_large_single_4_desc: "ロサンゼルス級潜水艦は、アメリカ海軍に所属する原子力高速攻撃型潜水艦(SSN)だ。主艦USSロサンゼルス（SSN-688）の船体番号から688級（シックスエイトエイト）とも呼ばれ、1972年から1996年までに62隻が建造され、後半の23隻は688iに改良されている。"
 USA_sub_hull_large_double_0: "グレイバック級"
 USA_sub_hull_large_double_0_desc: "グレイバック級潜水艦は、アメリカ海軍の誘導ミサイル搭載潜水艦2隻のクラスである。1957年から64年にかけて配備されたレグルスIおよびレグルスII核弾頭搭載巡航ミサイルを搭載したが、ポラリス級潜水艦に搭載された潜水艦発射弾道ミサイル「ポラリス」（SLBM）により急速に淘汰された。"
 USA_sub_hull_large_double_1: "ジョージ・ワシントン級"
 USA_sub_hull_large_double_1_desc: "ジョージ・ワシントン級は、アメリカ海軍が配備していた原子力弾道ミサイル潜水艦の一種である。ジョージ・ワシントン級は、後のイーサン・アレン級、ラファイエット級、ジェームズ・マディソン級、ベンジャミン・フランクリン級とともに、1980年代後半まで海軍の核抑止力として主に貢献した「自由のための41隻」潜水艦群を構成していた。"
 USA_sub_hull_large_double_2: "オハイオ級"
 USA_sub_hull_large_double_2_desc: "オハイオ級原子力潜水艦は潜水量18,750トンで、米海軍がこれまでに建造した弾道ミサイル潜水艦（SSBN）14隻と巡航ミサイル潜水艦（SSGN）4隻を含んだ潜水艦の中で最大のものである。また、世界でも3番目に大きな潜水艦である。"
 USA_sub_hull_large_double_3: "コロンビア級"
 USA_sub_hull_large_double_3_desc: "コロンビア級原子力潜水艦は、SSBN-X未来後続潜水艦と呼ばれた。アメリカ海軍のオハイオ級弾道ミサイル潜水艦の後継として設計された次期原子力潜水艦のクラスである。"
 USA_screen_hull_medium_0: "ジョン・C・バトラー級"
 USA_screen_hull_medium_0_desc: "ジョン・C・バトラー級は、第二次世界大戦中に生まれた護衛駆逐艦である。先代艦はUSSジョン・C・バトラーで、1944年3月31日に就役した。"
 USA_screen_hull_medium_1: "ブロンシュタイン級"
 USA_screen_hull_medium_1_desc: "ブロンシュタイン級フリゲート艦は、アメリカ海軍の軍艦で、当初は外洋護衛艦（旧護衛駆逐艦）として起工されたが、1975年6月30日にアメリカ海軍1975年艦船分類変更ですべてフリゲート艦となり、船体記号もDEからFFへ変更された。"
 USA_screen_hull_medium_2: "ノックス級"
 USA_screen_hull_medium_2_desc: "ノックス級フリゲート艦46隻は、アメリカ海軍の第2世代対潜水艦戦（ASW）護衛艦の中で最大、そして最も多くの艦艇が搭載されていた。当初は外洋護衛艦（旧護衛駆逐艦）として建造されたが、1975年の艦船分類変更計画により、6月30日に全艦がフリゲート艦となり、船体記号も「DE」から「FF」へと変更された。ノックス級フリゲート艦は、蒸気タービン発電機を搭載した海軍最後の駆逐艦タイプの設計であった。"
 USA_screen_hull_medium_3: "オリバー・ハザード・ペリー級"
 USA_screen_hull_medium_3_desc: "オリバー・ハザード・ペリー級は、エリー湖の湖上戦の英雄であるアメリカ提督オリバー・ハザード・ペリーの名を冠したミサイルフリゲート艦のクラスだ。ペリー級、FFG-7（通称「イチジク7」）級とも呼ばれ、大量に購入できる安価な汎用護衛艦として、1970年代半ばに米国で設計された。"
 USA_screen_hull_medium_4: "インディペンデンス級"
 USA_screen_hull_medium_4_desc: "インディペンデンス級沿海域戦闘艦は、アメリカ海軍のために建造された沿岸戦闘艦のクラスである。"
 USA_screen_hull_heavy_0: "アレン・M・サムナー級"
 USA_screen_hull_heavy_0_desc: "アレン・M・サムナー級駆逐艦は、第二次世界大戦中にアメリカ合衆国で58隻建造された駆逐艦である。さらに12隻が駆逐艦掃海艇として竣工した。艦名はアメリカ海兵隊の将校であったアレン・メランクソン・サムナーにちなんで命名された。"
 USA_screen_hull_heavy_1: "チャールズ・Ｆ・アダムス級"
 USA_screen_hull_heavy_1_desc: "チャールズ・F・アダムス級は、1958年から1967年にかけて建造された29隻のミサイル駆逐艦（DDG）の艦級である。アメリカ海軍向けに23隻、オーストラリア海軍向けに3隻、西ドイツ連邦海兵隊向けに3隻が建造された。これらの艦の設計（プロジェクトSCB155）は、フォレスト・シャーマン級駆逐艦の設計をベースにしているが、チャールズ・F・アダムス級はミサイル駆逐艦として設計された最初のクラスだ。"
 USA_screen_hull_heavy_2: "スプルーアンス級"
 USA_screen_hull_heavy_2_desc: "スプルーアンス級駆逐艦は、第二次世界大戦中に建造された多数のアレン・M・サムナー級およびギアリング級駆逐艦の後継艦として米国が開発し、1970年代から1980年代にかけて米国海軍の主力として建造された駆逐艦である。ミッドウェー海戦やフィリピン海戦など、第二次世界大戦中のアジア太平洋戦域での主要な海戦を成功に導いたアメリカ海軍提督レイモンド・A・スプルーアンスに敬意を表して命名された。"
 USA_screen_hull_heavy_3: "アーレイ・バーク級フライトI"
 USA_screen_hull_heavy_3_desc: "アーレイ・バーク級ミサイル駆逐艦（DDG）は、イージス戦闘システムとSPY-1D多機能受動電子走査式アレイレーダーを中心に建造されたアメリカ海軍の駆逐艦のクラスである。このクラスは、第二次世界大戦中のアメリカの駆逐艦将校であり、後に海軍作戦部長となったアーレイ・バーク提督にちなんで命名された。主力艦のUSSアーレイ・バークはバーク提督の存命中に就役した。"
 USA_screen_hull_heavy_4: "アーレイ・バーク級フライトII"
 USA_screen_hull_heavy_4_desc: "アーレイ・バーク級ミサイル駆逐艦（DDG）は、イージス戦闘システムとSPY-1D多機能受動電子走査式アレイレーダーを中心に建造されたアメリカ海軍の駆逐艦のクラスである。このクラスは、第二次世界大戦中のアメリカの駆逐艦将校であり、後に海軍作戦部長となったアーレイ・バーク提督にちなんで命名された。主力艦のUSSアーレイ・バークはバーク提督の存命中に就役した。"
 USA_battle_hull_light_0: "クリーブランド級"
 USA_battle_hull_light_0_desc: "クリーブランド級は、第二次世界大戦中にアメリカ海軍のために建造された軽巡洋艦の一群である。軽巡洋艦の中で最も多くの艦艇が建造された。"
 USA_battle_hull_light_1: "ロングビーチ級"
 USA_battle_hull_light_1_desc: "USSロングビーチ（CLGN-160/CGN-9）は、アメリカ海軍の原子力ミサイル巡洋艦であり、世界初の原子力水上戦闘艦である。カリフォルニア州ロングビーチ市から命名された3隻目の艦船である。"
 USA_battle_hull_light_2: "ベルナップ級"
 USA_battle_hull_light_2_desc: "ベルナップ級巡洋艦は、1960年代にアメリカ海軍で建造されたシングルエンド型ミサイル巡洋艦（ミサイル兵装を前部と後部の両方に装備するダブルエンド型とは異なり、前部のみに装備する）である。"
 USA_battle_hull_light_3: "タイコンデロガ級フライトI"
 USA_battle_hull_light_3_desc: "タイコンデロガ級ミサイル巡洋艦は、アメリカ海軍の軍艦で、1978年度に初めて発注・許可された艦級である。このクラスはパッシブフェーズドアレイレーダーを使用しており、当初は駆逐艦のクラスとして計画されていた。しかし、イージス艦の戦闘システムとAN/SPY-1レーダーシステムによる戦闘能力の向上により、旗艦としての運用が可能となった。"
 USA_battle_hull_light_4: "タイコンデロガ級フライトII"
 USA_battle_hull_light_4_desc: "タイコンデロガ級ミサイル巡洋艦は、アメリカ海軍の軍艦で、1978年度に初めて発注・許可された艦級である。このクラスはパッシブフェーズドアレイレーダーを使用しており、当初は駆逐艦のクラスとして計画されていた。しかし、イージス艦の戦闘システムとAN/SPY-1レーダーシステムによる戦闘能力の向上により、旗艦としての運用が可能となった。"