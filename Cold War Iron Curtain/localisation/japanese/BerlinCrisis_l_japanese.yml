l_japanese:
 berlincrisis.0.t:0 "[GetNewspaperHeader]The Soviet Union issus an Ultimatum over Berlin"
 berlincrisis.0.d:0 "Soviet Premier [SOV.GetLeader] has issued an ultimatum demanding the withdrawal of Western forces from West Berlin within six months. He insists the city should become a \"Free City,\" warning that if the demand is ignored, the USSR will sign a separate peace treaty with East Germany, jeopardizing Western access to Berlin.\nThe ultimatum comes amid growing tensions between the Soviet Union and NATO, with Moscow accusing the West of using Berlin as a base for espionage and anti-Soviet propaganda. The Soviet leader warned that if the demand was not met, the USSR would sign a separate peace treaty with East Germany, effectively ending the Western powers’ legal rights in the city and leaving access routes to West Berlin at the mercy of the East German government.\nAs the deadline set by Khrushchev looms, diplomatic efforts are intensifying. Behind closed doors, NATO officials in Paris are debating possible responses. Some advocate a firm stance, refusing to negotiate under pressure, while others suggest exploring diplomatic options to prevent escalation.\nThe world now watches anxiously, as Berlin once again becomes the focal point of the Cold War. Will the West stand its ground, or will Khrushchev’s ultimatum force a historic shift in the balance of power?"
 berlincrisis.0.a:0 "Will the Cold War get hot?"
 berlincrisis.1.t:0 "Berlin Crisis"
 berlincrisis.1.d:0 "At the Vienna summit on [GetDateText], tensions rose. Meeting with US President [USA.GetLeader], Premier [SOV.GetLeader] re-issued the Soviet ultimatum to sign a separate peace treaty with East Germany and thus end the existing four-power agreements guaranteeing American, British, and French rights to access West Berlin and the occupation of East Berlin by Soviet forces. The three powers responded that any unilateral treaty could not affect their responsibilities and rights in West Berlin. In the growing confrontation over the status of Berlin, [USA.GetLeader] undercut his own bargaining position during his Vienna summit negotiations with [SOV.GetLeader] in June 1961. [USA.GetLeader] essentially conveyed US acquiescence to the permanent division of Berlin. This made his later, more assertive public statements less credible to the Soviets. What should we do about the Berlin Question?"
 berlincrisis.1.a:0 "Hold a NATO summit about disarming West Berlin and handing it over."
 berlincrisis.1.b:0 "We will not give them inch of land!"
 berlincrisis.101.t:0 "Paris Summit on the Berlin Crisis"
 berlincrisis.101.d:0 "In response to [SOV.GetLeader]'s ultimatum in 1958, the Western Allies convened in Paris to discuss the future of West Berlin. Faced with Soviet pressure, they debated the demands of the USSR of turning West Berlin into a \"Free City\" to ease tensions. While some officials see this as a potential compromise, others feared it would weaken Western influence and leave the city vulnerable to communist control. Ultimately, whether the Allies reaffirm their commitment to West Berlin's status and refuse to withdraw or not, will be shown in the upcoming weeks."
 berlincrisis.101.a:0 "Get the West German Government on the Line. We need to consult with them."
 berlincrisis.101.b:0 "Let us meet with the West Germans about this matter."
 berlincrisis.101.c:0 "West Germany needs to be involved in this."
 berlincrisis.102.t:0 "NATO Summit on the Berlin-Crisis"
 berlincrisis.102.d:0 "Yet another cabinet meeting was called today, this time in response to an issue raised by the German embassies in London, Paris, and Washington, concerning a Soviet note sent to the governments of the three latter countries.\n\nAdenauer was already seated, as was the rest of the cabinet, as the Minister of Foreign Affairs, Heinrich von Brentano, hurried in, hands full with briefing materials and printouts.\n\nAdenauer started. “Brentano, what’s the latest?”\n\nBrentano responded. “Chancellor, the Soviets have indicated…well, rather, demanded… that the Allies pull their troops out of West Berlin, and that the city be a Free City.”\n\nThis prompted a lot of vigorous discussion from the room, which Adenauer spoke over. “Well, I gather that this cabinet does not agree on most of those points, and therefore-”\n\nHe was cut off by a junior minister, the Minister of All-German Affairs. “Sir, maybe this wouldn’t be such a bad idea- Berlin could be free, and the Soviets might back off.” Brentano broke in again. “That’s a terrible idea. We should take a harder line against the Soviets- after all, what did we join NATO for?” Adenauer paused, thinking."
 berlincrisis.102.a:0 "This Proposal seems the best for Peace in Europe. We push for the Idea of a Three-State Solution."
 berlincrisis.102.b:0 "Nonsense. They will never keep their promise."
 berlincrisis.103.t:0 "West Germany denounces the Soviet Ultimatum"
 berlincrisis.103.d:0 "West Germany firmly rejected [SOV.GetLeader]’s ultimatum, viewing it as a direct threat to its sovereignty and the security of West Berlin. Chancellor [WGR.GetLeader] and his government refused any proposal that would weaken ties with the Western Allies or compromise West Berlin’s freedom. They insisted that the city's status remain unchanged and warned that conceding to Soviet demands would set a dangerous precedent. Instead, West Germany strengthened its alignment with NATO and called for a united Western response, reinforcing its commitment to standing against Soviet pressure."
 berlincrisis.103.a:0 "A wise decision."
 berlincrisis.104.t:0 "West Germany supports the Idea of a Free City of Berlin"
 berlincrisis.104.d:0 "West Germany considered accepting [SOV.GetLeader]’s ultimatum, seeing it as a possible way to ease tensions and avoid a deeper crisis. Some officials believed that turning West Berlin into a \"Free City\" could prevent further Soviet aggression and stabilize the situation. However, they remained cautious and waited for the Western Allies to take a definitive stance. Knowing that their security depended on NATO support, they refrained from making any unilateral decisions, instead seeking approval from the United States, Britain, and France before committing to any course of action."
 berlincrisis.104.a:0 "If it is their will, let it be."
 berlincrisis.104.b:0 "After second thought...this seems to risky. West Berlin remains in the Federal Republic."
 berlincrisis.105.t:0 "The Allies reject our Offer"
 berlincrisis.105.d:0 "After extensive discussions, the Western Allies have decided not to support West Germany’s willingness to accept Khrushchev’s ultimatum. They believe that turning West Berlin into a \"Free City\" would ultimately weaken their position in Europe and expose the city to Soviet influence. Instead, they reaffirm their commitment to defending West Berlin’s current status and urge West Germany to stand firm against Soviet pressure. While they acknowledge the risks of escalation, they are prepared to confront any challenge to ensure that West Berlin remains free and under Western protection."
 berlincrisis.105.a:0 "Moscow will not be happy about this."
 berlincrisis.106.t:0 "The Western Allies give their Consent"
 berlincrisis.106.d:0 "The Western Allies have reviewed West Germany’s position and acknowledge its desire to accept Khrushchev’s ultimatum. After careful deliberation, they have decided to support this course of action, believing it could reduce tensions and prevent further Soviet escalation. While concerns remain about the long-term implications, they trust that establishing West Berlin as a \"Free City\" under international guarantees will maintain stability. They now stand ready to negotiate the terms of this transition, ensuring that West Germany’s interests and security remain protected throughout the process."
 berlincrisis.106.a:0 "Let's get the Soviets on the Line."
 berlincrisis.107.t:0 "The Establishment of the Free City of Berlin"
 berlincrisis.107.d:0 "Reports from the West confirm that the Allied powers have agreed to transform West Berlin into a \"Free City.\" Allied Forces are leaving the City as we speak, while our leadership views this as a significant diplomatic victory, proving that Western resolve has weakened under pressure. While details of the transition remain uncertain, we do now prepare to push for strict guarantees ensuring that the new status aligns with Soviet interests. At the same time, we need to remain cautious, aware that the West may still attempt to maintain influence over the city. Nevertheless, the decision marks a major step toward consolidating Soviet control over Eastern Europe."
 berlincrisis.107.a:0 "Good."
 berlincrisis.2.t:0 "[GetNewspaperHeader]NATO Evacuates West Berlin"
 berlincrisis.2.d:0 "After talks in the Vienna Summit, the Soviet Union gave NATO a ultimatum to decide about the Berlin Question. The Soviets want West Berlin to be incorporated back in East Berlin and it to be a unified Free city as a seperate political entitiy within Germany. A NATO summit began a couple of weeks ago, and after talks NATO has decided to pull out of West Berlin and agree to the proposal. NATO made a statement saying that the World can not be pulled into World War III because of a divided city. The American, French, and British troops stationed in West Berlin are being pulled out and thousands of civilians, who are worrying that the Soviet Union won't respect the independence of the new Free City, are trying to get out. Many experts criticized this decision as this radically expands the USSR's sphere of influence, but at least the Berlin Crisis has come to an end."
 berlincrisis.2.a:0 "Hopefully this will prevent World War III."
 berlincrisis.2.b:0 "A victory for Communism."
 berlincrisis.2.c:0 "World War III has been averted."
 berlincrisis.3.t:0 "[GetNewspaperHeader]NATO denounces the Berlin Ultimatum"
 berlincrisis.3.d:0 "As the confrontation over Berlin escalated, President [USA.GetLeader], in a speech delivered on nationwide television the night of [GetDateText], reiterated that the United States was not looking for a fight and that he recognized the \"Soviet Union's historical concerns about their security in central and eastern Europe\". He said he was willing to renew talks, but he also announced that he would ask Congress for an additional $3.25 billion for military spending. He wanted six new divisions for the Army and two for the Marines, and announced plans to triple the draft and to call up the reserves. [USA.GetLeader] proclaimed: \"We seek peace, but we shall not surrender\". The same day, he further requested an increase in the Army's strength from 875,000 to approximately 1 million, and the authority to bring some reserve units into active duty. Vacationing in the Black Sea resort of Sochi, [SOV.GetLeader] was reported to be angered by [USA.GetLeader]'s speech. John Jay McCloy, the presidents disarmament adviser, who happened to be in the Soviet Union, was invited to join [SOV.GetLeader]. It is reported that the chairman explained to McCloy that [USA.GetLeader]'s military build-up threatened war."
 berlincrisis.3.a:0 "We will not let Communism spread."
 berlincrisis.3.b:0 "Let's think of another way for this."
 berlincrisis.3.c:0 "Tensions will get high."
 berlincrisis.4.t:0 "NATO refuses the Berlin Ultimatum"
 berlincrisis.4.d:0 "NATO has rejected the ultimatum, stating that it violates the Big Four Accords signed in 1946. The Americans, British, and French have made it clear that they will not cede any territory to the Communists. Meanwhile, the East German government is seeking guidance on their next steps. How should we proceed? We could increase pressure on the West by deploying tanks and troops along the border, or we could choose to accept their decision."
 berlincrisis.4.a:0 "A military option will work."
 berlincrisis.4.b:0 "We will allow this decision to stay."
 berlincrisis.5.t:0 "Berlin Crisis Gets Hotter"
 berlincrisis.5.d:0 "The Soviet Union expresses strong displeasure over NATO's refusal to accept the ultimatum, emphasizing that the Motherland sacrificed millions of lives to reach Berlin. Soviet leaders warn that the Western powers risk provoking World War III if they do not withdraw, potentially leading to the deaths of billions. Tensions in Berlin are at a breaking point, with Soviet tanks and troops positioned directly across from our forces. How should we respond?"
 berlincrisis.5.a:0 "This is an attack!"
 berlincrisis.5.b:0 "Send a diplomat to talk to the USSR."
 berlincrisis.5.c:0 "Pull back our tanks and soldiers."
 berlincrisis.5.e:0 "Let's leave this to the United States."
 berlincrisis.6.t:0 "[GetNewspaperHeader]World War III breaks out"
 berlincrisis.6.d:0 "After weeks of talks and rising tensions between NATO and the Cominform, diplomats have failed to come to an understanding, where it came to a point where they were launching insults at each other. Reports are coming in that Berlin is once again under siege, Cannon fire and gunfire could be heard for miles away, Fighters and bombers scrambling and Navies leaving their docks. Countries from around the world have mobilized their troops once again. World War III has started, but the only question we have is that will it be a conventional war or a nuclear war?"
 berlincrisis.6.a:0 "God help us."
 berlincrisis.7.t:0 "[GetNewspaperHeader]Talks in the Berlin Crisis"
 berlincrisis.7.d:0 "The United States have sent a diplomat to the USSR to talk about the Berlin Crisis in response to Soviet threats of military action. Both sides are trying to keep tensions low, but difficulties keep arising with the Soviets declaring that NATO does not belong in Berlin, and NATO disagreeing for international security reasons. Hopefully the Berlin Crisis will be solved here and that the World doesn't enter World War III."
 berlincrisis.7.a:0 "We'll end this and keep West Berlin."
 berlincrisis.7.b:0 "We'll end this and get West Berlin."
 berlincrisis.7.c:0 "Let's hope this ends soon."
 berlincrisis.8.t:0 "Berlin Question Talks"
 berlincrisis.8.d:0 "Tensions are at an all-time high. The American government has sent a diplomat to engage in talks with us regarding the Berlin Question. The world is watching closely as these negotiations unfold. We now have the opportunity to discuss the future of Berlin with the Americans. What should be our primary focus in these talks?"
 berlincrisis.8.a:0 "Push for a reunified Berlin."
 berlincrisis.8.b:0 "Demand the Free City of Berlin."
 berlincrisis.8.c:0 "Berlin will stay divided."
 berlincrisis.9.t:0 "Negotiations of Berlin"
 berlincrisis.9.d:0 "The Soviets want West Berlin and East Berlin to be reunited into Berlin. They want it to be under GDR control with no occupation forces. Berlin will be a Demilitarized Zone too. No forces whether East or West, will not be in the city. Should we accept their deal? Do we deny it?"
 berlincrisis.9.a:0 "Accept the deal."
 berlincrisis.9.b:0 "Berlin will stay divided."
 berlincrisis.9.c:0 "It is now up to the Americans..."
 berlincrisis.10.t:0 "[GetNewspaperHeader]West and East Berlin Unified!"
 berlincrisis.10.d:0 "After weeks of debate and heated negotiations, NATO has agreed to withdraw from West Berlin, ceding control to East Germany. The Soviet Union has declared this a great victory for world peace. In a statement, NATO justified the decision by emphasizing that World War II ended years ago and that the people of West Berlin should no longer feel like an occupied population. However, critics argue that this move will only strengthen the communist sphere of influence, calling it a strategic misstep by NATO."
 berlincrisis.10.a:0 "We don't need to occupy West Berlin."
 berlincrisis.10.b:0 "A great victory for the Warsaw Pact."
 berlincrisis.10.c:0 "Will the relations warm up now?"
 berlincrisis.11.t:0 "The USSR proposes the Free City of Berlin"
 berlincrisis.11.d:0 "The Soviets have said that if NATO won't accept a unified city of Berlin controlled by the GDR, then maybe we could form a Free City of Berlin. The Free City of Berlin would include both West and East Berlin, and would be a neutral state. The problem with this, however, is that the Soviets could influence the neutral Berlin country. What should we do about this?"
 berlincrisis.11.a:0 "Allow the Free City of Berlin."
 berlincrisis.11.b:0 "We are not going to sell West Berlin."
 berlincrisis.11.c:0 "What will the US decide?"
 berlincrisis.12.t:0 "[GetNewspaperHeader]Free City of Berlin Formed!"
 berlincrisis.12.d:0 "The United States and the Soviet Union have reached a historic agreement to establish Berlin as an independent, neutral city-state. Under this arrangement, Berlin will not align with either NATO or the Warsaw Pact, instead maintaining a position of neutrality in the ongoing Cold War. While this decision is seen as a temporary solution to the Berlin crisis, many doubt that such neutrality can be maintained for long, given the city's immense strategic importance to both East and West.\nAs part of the agreement, American, Soviet, British, and French forces have begun their withdrawal from the city, ending their direct military presence in Berlin. This move is widely regarded as a major shift in the balance of power in Europe, potentially altering the course of Cold War politics. However, not everyone supports the decision. Both East and West Germany have strongly voiced their opposition, with leaders from the DDR and FRG arguing that Berlin should not remain independent but instead be reunited with a future unified German state.\nDespite the withdrawal of foreign troops, uncertainty remains. Will Berlin’s neutrality hold, or will it become the next battleground in the ideological struggle between East and West? As the world watches closely, the fate of the newly declared city-state hangs in the balance."
 berlincrisis.12.a:0 "Hopefully this crisis is over with."
 berlincrisis.12.b:0 "The state will be under our control soon."
 berlincrisis.12.c:0 "What will happen now?"
 berlincrisis.13.t:0 "[GetNewspaperHeader]Soviets and Americans pull back troops from Berlin Border"
 berlincrisis.13.d:0 "\nWith KGB spy Georgi Bolshakov serving as the primary channel of communication, [SOV.GetLeader] and [USA.GetLeader] agreed to reduce tensions by withdrawing the tanks. The Soviet checkpoint had direct communications to General Anatoly Gribkov at the Soviet Army High Command, who in turn was on the phone to [SOV.GetLeader]. The US checkpoint contained a Military Police officer on the telephone to the HQ of the US Military Mission in Berlin, which in turn was in communication with the White House. [USA.GetLeader] offered to go easy over Berlin in the future in return for the Soviets removing their tanks first. The Soviets agreed. [USA.GetLeader] stated concerning the Wall \"It's not a very nice solution, but a wall is a hell of a lot better than a war\". A Soviet tank moved about 5 meters backwards first; then an American tank followed suit. One by one the tanks withdrew."
 berlincrisis.13.a:0 "We have succeeded in keeping West Berlin."
 berlincrisis.13.b:0 "We will get West Berlin another time."
 berlincrisis.13.c:0 "Will we be safe?"
 berlincrisis.14.t:0 "[GetNewspaperHeader]The Berlin Crisis is over"
 berlincrisis.14.d:0 "The Berlin Crisis has finally come to an end. After many weeks of negotiations, heated debates, as well as escalations of both NATO and Cominform forces, both sides have agreed to mutual agreements, to which the USA would go easy on East Berlin and accept the berlin wall to be better then war, in exchange that the soviets pull their tanks out first, tensions have reduced between the parties."
 berlincrisis.14.a:0 "We have protected the city of West Berlin"
 berlincrisis.14.b:0 "We will try again another time."
 berlincrisis.14.c:0 "West Berlin will be ours later."
 berlincrisis.14.e:0 "We have protected our city."
 berlincrisis.14.f:0 "Berlin almost put us in World War III."
 Giving_Berlin_away_later_Alert_tt:0 "§CNote that if you decide to support West Germanys decision to establish a Free City in West Berlin, you will be obliged to cede West Berlin to the Soviet Union, should they propose an Offer towards a unified independent Berlin.§!"
 Not_Giving_Berlin_away_later_Alert_tt:0 "§CNote that if you decide to remain the status-quo in West Berlin, you will be obliged to stand by your choice in future negotiations with the Soviet Union about a Free City of Berlin, even if the Soviets consider further Escalation.§!"
 BCR_no_berlin_for_soviets_opinion:0 "NATO does not cede Berlin"
 BCR_Soviet_military_options_opinion:0 "Soviet Military Options"
 BCR_NATO_decisions_allowed_opinion:0 "NATO Decisions allowed"
 BCR_berlin_question_talks_opinion:0 "Berlin Question Talks"
 BCR_NATO_pulling_out_opinion:0 "NATO troops pulling out"
 BCR_Berlin_stays_divided_opinion:0 "Berlin stays divided"
 BCR_Berlin_reunified_opinion:0 "Berlin reunified"
 BCR_Berlin_reunified_west_opinion:0 "Berlin reunified"
 BCR_Berlin_stays_divided_east_opinion:0 "Berlin stays divided"
 BCR_Free_City_of_Berlin_opinion:0 "The Free City of Berlin"
 SOV_khruschev_reforms_desc:0 "Stalin's death in 1953 triggered a power struggle, from which [SOV.GetLeader] emerged victorious. On 25 February 1956, at the 20th Party Congress, he delivered the \"Secret Speech\", which denounced Stalin's purges and ushered in a less repressive era in the Soviet Union. His domestic policies, aimed at bettering the lives of ordinary citizens, were often ineffective, especially in agriculture. Hoping eventually to rely on missiles for national defense, [SOV.GetLeader] ordered major cuts in conventional forces."
 SOV_the_secret_speech_desc:0 "In 1956, [SOV.GetLeader] heavily criticized the deceased Comrade Stalin on his purges executed in the 1930s and criticized his great faults in creating a cult of personality instead of fostering communism for the Soviet worker. This speech heavily influenced the Sino-Soviet split and the weakening of the Soviet political sphere everywhere on the planet."
 SOV_sino_soviet_split_desc:0 "After the publishing of the secret speech by [SOV.GetLeader] in 1956, Mao denounced [SOV.GetLeader] as a revisionist for his criticizing views on Stalinism, which formed the basis for many communist systems all over the globe, and the split heavily weakened the USSR, as it was losing one of it's most important allies and economical partners in the planet."
 SOV_peaceful_coexistence_desc:0 "In the 20th Party Congress, [SOV.GetLeader] defended and solidified the concept of coexistence with the USA after great rising tensions of nuclear warfare. The proclamation meant the end of the Soviet advocacy of the spread of communism through violence, which communists over the world saw as a betrayal to the principles of a communist revolution."