 tech_field_hospital_helicopter6_desc:0 "WIP"
 tech_field_hospital_helicopter7:0 "MEDEVAC Helicopters I"
 tech_field_hospital_helicopter7_desc:0 "WIP"
 tech_logistics_company:0 "補給中隊 I"
 tech_logistics_company_desc:0 "兵士達の間に専門の兵站将校を配置することにより、その支援ネットワークを活用して物資の無駄を最小限に抑えることが可能となる。"
 tech_logistics_company2:0 "補給中隊 II"
 tech_logistics_company2_desc:0 "リスク分析を行うことにより、戦争の新たなる環境に適応したより安全性の高い後方支援を行うことができるだろう。"
 tech_logistics_company3:0 "補給中隊 III"
 tech_logistics_company3_desc:0 "継続的な統計学的評価を行うことにより、軍への補給体制の最大限の効率化を図る。"
 tech_logistics_company4:0 "補給中隊 IV"
 tech_logistics_company4_desc:0 "一定規格の補給品を開発することは、混乱を最小限に抑え、より効率的な作成計画の立案へとつながるだろう。"
 tech_logistics_company5:0 "Logistics V: All-Terrain Supply Corps"
 tech_logistics_company5_desc:0 "You cannot always rely on using your enemy's infrastructure and roads. They may be destroyed in an action of scorched earth or may not exist in the first place. On that note, you can't always rely on your own infrastructure not being destroyed or even existing. It is important that supply vehicles and logistics officers be able to travel off-road and find new paths in order to improve movement."
 tech_logistics_company6:0 "Logistics VI: Efficient Air Missions"
 tech_logistics_company6_desc:0 "Air missions and paradropped supplies can be lost, destroyed, captured by the enemy or partisans, or even take up large quantities of fuel to deliver. By revising paradropping plans and the chutes themselves, air missions can deliver needed supply in faster amounts of time. "
 tech_logistics_company7:0 "Logistics VII: High-Capacity Vehicles"
 tech_logistics_company7_desc:0 "When all management methods and protocols have been fully optimized, the only thing left to do is just make vehicles stronger, more efficient, and hold more. That's all there is to it."
 tech_logistics_company_helicopter3:0 "Logistics Helicopter I"
 tech_logistics_company_helicopter3_desc:0 "WIP"
 tech_logistics_company_helicopter4:0 "Logistics Helicopter II"
 tech_logistics_company_helicopter4_desc:0 "WIP"
 tech_logistics_company_helicopter5:0 "Logistics Helicopter III"
 tech_logistics_company_helicopter5_desc:0 "WIP"
 tech_logistics_company_helicopter6:0 "Logistics Helicopter IV"
 tech_logistics_company_helicopter6_desc:0 "WIP"
 tech_logistics_company_helicopter7:0 "Logistics Helicopter V"
 tech_logistics_company_helicopter7_desc:0 "WIP"
 tech_military_police:0 "憲兵 I"
 tech_military_police_desc:0 "正規軍は占領地の治安維持を短期間ならば、こなせるかもしれないが、彼らの本分は兵士である。我が軍に憲兵を設立することにより、反乱分子や妨害活動を効率的に取り締まることができるようになるだろう。"
 tech_military_police2:0 "憲兵 II"
 tech_military_police2_desc:0 "憲兵が占領地での正規の警察業務を担うことによって、交通管制を行い、公共の秩序を維持することが可能である。それにより、占領地の無秩序化とパルチザンの活動を最小限に抑えることが可能となるだろう。"
 tech_military_police3:0 "憲兵 III"
 tech_military_police3_desc:0 "協力的な情報網と情報提供者を敵に占領される前に置くことで、憲兵はレジスタンス共の蜂起を事前に察知することができるようになる。"
 support_tech_military_police3_tt:0 "§YReduces likelihood of a successful riot in occupied territory by§! §G-35%§!"
 tech_military_police4:0 "憲兵 IV"
 tech_military_police4_desc:0 "占領した地域の治安を維持することは、常態を取り戻すこと、また、抵抗勢力を無慈悲に殲滅することと同義である。憲兵は兵士と市民両方の安全を保証できるよう、このことを確実に実行できるような手段を早めに講じなければならない。"
 tech_military_police5:0 "Military Police V: Peacekeeping"
 tech_military_police5_desc:0 "Peacekeeping is a proactive measure to preventing uprisings and reducing devastation. Peacekeeping operations typically involve training new, local security forces to enforce the law and restore normalcy. Order and stability are the greatest methods of pacification. Peacekeeping requires military police to be trained to establish local security and vet for individuals who will not wind up becoming problems to become those security operatives. Additionally, it requires logistical lines for security provisions to be established so security beats can be established."
 tech_military_police6:0 "Military Police VI: Memetic Suppression"
 tech_military_police6_desc:0 "Winning hearts and minds with war relief and peacekeeping are good ways to prevent insurgency. However, not everyone is convinced, especially patriots and demagogues. It is therefore necessary to use fear as a tool to suppress other individuals. However, this fear cannot be delivered in such a way that it interferes with war relief or peacekeeping. Military reporters, propaganda, memetic warfare and ideological debating, and other such methods are ways to sow doubt within' an occupied population. "
 tech_military_police7:0 "Military Police VII: Modern Non-Lethal Weapons and Tactics"
 tech_military_police7_desc:0 "Non-lethal tactics and weapons have been used since the dawn of human civilization and are naturally a part of occupation. However, dealing with domestic crime is a different game than dealing with insurgents. To better control the population and not inspire resistance and provide psychological suppression, new methods for incapacitation must be created. Investing large amounts into developing non-lethal weapons, chemicals, training, and equipment will pay off by enabling smaller amounts of troops to have a greater suppressive impact."
 tech_signal_company:0 "通信中隊 I"
 tech_signal_company_desc:0 "戦場に通信を確立し、それを保守するためには常に特殊な技能が求められる。先の大戦時に出現した新たな通信・索敵技術に伴い、この分野にはまったく新しい実践可能性が広がっている。"
 tech_signal_company2:0 "通信中隊 II"
 tech_signal_company2_desc:0 "軍内部の異なる部門同士の通信を専門とする通信中隊によって、陸軍が海上および航空作戦と連携することが可能となり、行軍のより素早い計画が可能となる。"
 tech_signal_company3:0 "通信中隊 III"
 tech_signal_company3_desc:0 "通信機器の小型化が進んだことで、通信機器を背嚢のように背負って運ぶことが可能となった。より機動力の高い通信部隊は必ずや役立つはずである。"
 tech_signal_company4:0 "通信中隊 IV"
 tech_signal_company4_desc:0 "通信専門家たちは、戦場で実際に通信機器を使うことにより類まれなる実地経験を獲得している。彼らを新しい通信技術の開発に携わらせることで、この経験を活用することが可能となるだろう。"
 tech_signal_company5:0 "Signal V: MISI"
 tech_signal_company5_desc:0 "Modern Information System Integration (MISI) is the integration of modern systems information such as portable computers to aid in tactical control. With MISI, unparalleled levels of direct tactical control can be established between command staff and the operating combat elements. MISI enables consultation between experienced senior staff and low-ranking officers to provide greater combat and tactical capability."
 tech_signal_company6:0 "Signal VI: Personal Comms"
 tech_signal_company6_desc:0 "Personal Comms are pieces of communications equipment granted to almost all individuals within' a division. This can further allow communications to be maintained as the incapacitation of a signals specialist does not necessarily mean the end of communications. Developing personal comms requires miniaturization of communications equipment and protocols for cutting off the operability of compromised equipment."
 tech_signal_company7:0 "Signal VII: OVERLORD"
 tech_signal_company7_desc:0 "OVERLORD is a theoretical battle interface that has not yet been fully implemented by any country due to the sheer expense of developing the software needed and maintaining and updating it. OVERLORD creates an interface created and updated by command staff based off of continuous recon reports and information coming in. This allows for a level of interoperability, communication, and command never before seen that can enable virtually all troops to receive information on nearby troops and avoid conflicts they cannot deal with while precisely engaging hostiles they are able to. As long as someone is aware of an enemy presence, and communications are still online, everyone can be aware of it. "
 tech_maintenance_company:0 "整備中隊 I"
 tech_maintenance_company_desc:0 "装備の信頼性と安全性を保つためには整備、修理、点検が重要となる。この分野に特化した中隊を有することで、装備に対する適切な注意が保証されることだろう。"
 tech_maintenance_company2:0 "整備中隊 II"
 tech_maintenance_company2_desc:0 "規定された作戦上の保守処理は、装備の故障の可能性と部隊の行動の隙をできるだけ最小限にする。"
 tech_maintenance_company3:0 "整備中隊 III"
 tech_maintenance_company3_desc:0 "常に部隊が修繕物資を携帯することにより、戦場での応急処置が行えるようになる。それにより、稼動状態を維持し続けることによる損害を抑制できるようになるだろう。"
 tech_maintenance_company4:0 "整備中隊 IV"
 tech_maintenance_company4_desc:0 "先の大戦時の冗長性にとんだ設計の経験をいかし、より整備の簡易性を増した近代的設備を開発することが可能である。"
 tech_maintenance_company5:0 "Maintenance V: Versatile Parts"
 tech_maintenance_company5_desc:0 "In warfare it isn't uncommon to find maintenance companies running out of components or spare parts. The parts that are damaged or destroyed are highly inconsistent and unpredictable due to the nature of combat. It is for this reason that having stores of extra versatile parts and patching kits that are intended to only be applied temporarily is desirable. Through intense development efforts and investment, these kits and parts can be created for field repairs in order to keep vehicles and weapons in the fight long enough that they can receive permanent repairs."
 tech_maintenance_company6:0 "Maintenance VI: Combat Mechanics"
 tech_maintenance_company6_desc:0 "The most dire repair situations can occur in the heat of a firefight. Tanks can become detracked, vehicles can be shot, and various other forms of damage can occur. Field repairs have always been a difficult task and have always been pressing. By training mechanics to work faster and under intense pressure, they can conduct these repairs more efficiently and get their vehicles back in the fight."
 tech_maintenance_company7:0 "Maintenance VII: Digital Manuals"
 tech_maintenance_company7_desc:0 "By providing our combat mechanics with portable devices containing information on whatever they are working on they can achieve greater levels of efficiency never seen before."
 MOBILE_WARFARE_DOCTRINE_LABEL:0 "機動戦ドクトリン"
 MOBILE_WARFARE_DOCTRINE_DESC:0 "機動戦は速度と機動により敵軍の体制を乱すことに焦点を当てる。"
 SUPERIOR_FIREPOWER_DOCTRINE_LABEL:0 "優勢火力ドクトリン"
 SUPERIOR_FIREPOWER_DOCTRINE_DESC:0 "このドクトリンは敵軍に対して人命ではなく弾丸を叩きつける。我が国の人的資源は高価であるが、弾薬は安価だ。"
 GRAND_BATTLEPLAN_DOCTRINE_LABEL:0 "大規模作戦ドクトリン"
 GRAND_BATTLEPLAN_DOCTRINE_DESC:0 "事前の広範な作戦立案と準備は、勝利の鍵となる。"
 MASS_ASSAULT_DOCTRINE_LABEL:0 "大量突撃ドクトリン"
 MASS_ASSAULT_DOCTRINE_DESC:0 "「完璧な」兵器は過大評価されている。大量の「十分有効な」兵器こそが勝利への道筋となるのである！"
 MOBILE_INFANTRY_LABEL:0 "機動化歩兵"
 MOBILE_INFANTRY_LABEL_TT:0 "自動車化歩兵の速度と指揮統制率を改善する。"
 BLITZKRIEG_LABEL:0 "電撃戦"
 BLITZKRIEG_LABEL_TT:0 "機甲部隊の指揮統制率を改善する。"
 DESPERATE_DEFENSE_LABEL:0 "死守"
 DESPERATE_DEFENSE_LABEL_TT:0 "人員補充とゲリラ戦術を最大化する。"
 MODERN_BLITZKRIEG_LABEL:0 "現代電撃戦"
 MODERN_BLITZKRIEG_LABEL_TT:0 "軍の指揮統制率とカウンター戦術を向上させる。"
 DISPERSED_SUPPORT_LABEL:0 "分散支援"
 DISPERSED_SUPPORT_LABEL_TT:0 "砲兵部隊の指揮統制率と効率を改善する。"
 INTEGRATED_SUPPORT_LABEL:0 "統合支援"
 INTEGRATED_SUPPORT_LABEL_TT:0 "支援部隊の指揮統制率と効率を改善する。"
 AIRLAND_BATTLE_LABEL:0 "エアランド・バトル"
 AIRLAND_BATTLE_LABEL_TT:0 "軍の攻撃能力を向上させる。"
 SHOCK_AND_AWE_LABEL:0 "衝撃と畏怖"
 SHOCK_AND_AWE_LABEL_TT:0 "軍の全体的な影響力を向上させる。"
 ASSAULT_LABEL:0 "強襲"
 ASSAULT_LABEL_TT:0 "機甲部隊による正面への直接攻撃に焦点を当てている。"
 INFILTRATION_LABEL:0 "浸透戦術"
 INFILTRATION_LABEL_TT:0 "欺瞞と型破りな歩兵の戦略に焦点を当てている。"
 DEEP_BATTLE_LABEL:0 "縦深戦闘"
 DEEP_BATTLE_LABEL_TT:0 "敵陣深くに攻撃する支援と能力を向上させる。"
 MASS_MOBILIZATION_LABEL:0 "大量動員"
 MASS_MOBILIZATION_LABEL_TT:0 "兵力と人員補充を最大にする。"
 mobile_warfare:0 "機動戦"
 mobile_warfare_desc:0 "機動戦は速度と機動により敵軍の体制を乱すことに焦点を当てる。\n\n"
 delay:0 "遅滞"
 delay_desc:0 "勝利できないときも、待ち伏せと時間稼ぎは攻撃側の進行を遅らせるために有効だ。"
 elastic_defence:0 "弾性防御"
 elastic_defence_desc:0 "前進を防ぐよりも、「深い」防衛線を形成することにより攻撃側の前進を遅らせ、防御部隊が防御し、更に反撃する時間を稼ぐ。"
 mobile_infantry:0 "機動化歩兵"
 mobile_infantry_desc:0 "一般的な歩兵は機甲部隊と行動をともにするにはあまりにも行軍が遅い。現代の戦場の展開速度についていくためには、自動車化もしくは機械化された歩兵が必要だ。\n\n"
 mass_motorization:0 "大規模な自動車化"
 mass_motorization_desc:0 "自動車化師団にさらに大きな焦点を当てる。"
 mechanized_offensive:0 "Mechanized Offensive"
 mechanized_offensive_desc:0 "Motorized troops are well and good, but to lead offensives we need Infantry that can ride into battle in armored transports which protect them and carry heavy weapons."
 armored_spearhead:0 "機甲先鋒"
 armored_spearhead_desc:0 "戦車の持つ潜在能力を最大限引き出すためには、戦車を歩兵の支援に縛り付けてはいけない。むしろ、戦車を中核とする、攻撃の先陣を切ることができる独立した快速部隊を編制すべきだ。\n\n"
 schwerpunk:0 "重心"
 schwerpunk_desc:0 "いかなる作戦においても勝利するためには、その「Schwerpunkt（重心）」もしくは焦点を認識し、最大の戦力をそこに集中しなければならない。"
 blitzkrieg:0 "電撃戦"
 blitzkrieg_desc:0 "電撃戦とは、機動力の高い歩兵部隊と航空部隊に支援された快速機甲部隊が混乱する敵の前線を突破し、最終的に敵を包囲殲滅する戦闘ドクトリンである。"
 kampfgruppe:0 "カンプフグルッペ"
 kampfgruppe_desc:0 "カンプフグルッペ（戦闘団）は、特定の任務を遂行するために特別に編制された部隊である。"
 firebrigades:0 "緊急機動部隊"
 firebrigades_desc:0 "「緊急機動部隊」は敵の防衛戦の突破やその他の重大な問題に対処するためにかき集められる部隊である。\n\n"
 backhand_blow:0 "後手からの一撃"
 backhand_blow_desc:0 "一歩も譲るまいと徹底抗戦を行うのではなく、敵軍が息切れするまであえて進撃を許し、そこからの反撃で敵軍を包囲殲滅する。"
 modern_blitzkrieg:0 "現代電撃戦"
 modern_blitzkrieg_desc:0 "機動戦の頂点である現代的電撃戦には、過去の戦闘教義から学び取られた最新の先進的技術や教訓が全て取り入れられている。"
 volkssturm:0 "国民突撃隊"
 volkssturm_desc:0 "国民突撃隊（Volkssturm）、または郷土防衛隊は、あまりに歳をとっていたか、あまりにも若かったか、さもなくば通常の兵役が務まらなかった男性から構成されている。\n\n"
 nd_conscription:0 "無差別徴集"
 nd_conscription_desc:0 "病弱でも障害者でも徴兵され、一般人なんてものは存在しない。"
 werwolf_guerillas:0 "ヴェアヴォルフ・ゲリラ"
 werwolf_guerillas_desc:0 "ヴェアヴォルフ（人狼部隊）はドイツで計画され、敗北し占領された地域でゲリラ攻撃を行う。"
 superior_firepower:0 "優勢火力"
 superior_firepower_desc:0 "このドクトリンは敵軍に対して人命ではなく弾丸を叩きつける。我が国の人的資源は高価であるが、弾薬は安価だ。\n\n"
 sup_delay:0 "遅滞"
 sup_delay_desc:0 "勝利できないときも、待ち伏せと時間稼ぎは攻撃側の進行を遅らせるために有効だ。"
 mobile_defence:0 "機動防御"
 mobile_defence_desc:0 "機動部隊は敵がどこから攻撃してきても、防御を支援することができる。"
 intergrated_support:0 "統合支援"
 intergrated_support_desc:0 "支援部隊と実戦部隊を統合することで、師団の攻撃を強力にする。\n\n"
 regimental_combat_teams:0 "連隊戦闘団"
 regimental_combat_teams_desc:0 "連隊戦闘団とは戦闘の際により柔軟に戦えるよう、歩兵連隊を中核に砲兵や戦車、偵察隊などの支援部隊を組み込んだ小規模の諸兵科連合部隊である。"
 dispersed_support:0 "分散支援"
 dispersed_support_desc:0 "支援部隊を分散させることでより広大な戦線に火力を行き渡らせ、結果として師団の防衛能力を高める。\n\n"
 overwhelming_firepower:0 "圧倒的火力"
 overwhelming_firepower_desc:0 "すべての利用可能な支援部隊を召集し、圧倒的な火力をもって目標を弱体化、あるいは深刻な損害を攻撃時に与える。"
 sup_mechanized_offensive:0 "機械化攻勢"
 sup_mechanized_offensive_desc:0 "自動車化された軍隊はそれなりに強力だ。しかし、さらに攻勢能力を高めるためには、将兵を護り重火器を運搬できる装甲輸送車で戦場へ乗り込む歩兵が必要だ。"
 concentrated_fire_plans:0 "火力集中計画"
 concentrated_fire_plans_desc:0 "様々な部隊の火力を集中することで、敵に大きなダメージを与えることができる。\n\n"
 combined_arms:0 "諸兵科連合"
 combined_arms_desc:0 "機甲、歩兵、支援部隊は同じ部隊に編制した方が、別々に使用した時より効果的である。"
 tactical_control:0 "戦術統制"
 tactical_control_desc:0 "前線における諸兵科連合に慣れ親しんだ士官達は、今や全兵科の作戦を直接に統制することができる。"
 air_land_battle:0 "エアランド・バトル"
 air_land_battle_desc:0 "地上軍が既に諸兵科連合として動いている中、エアランド・バトルは空と陸の戦場を境目なく一体化させ、陸軍と空軍の密接な協働にも重点を置く。"
 centralized_fire_control:0 "射撃管制の一元化"
 centralized_fire_control_desc:0 "集約された射撃管制システムは全ての砲撃支援要請を一箇所で評価することを可能とし、ある部隊がそれに割り当てられた砲兵のみからの砲撃支援を要請するのではなく、もし必要ならば師団の全火力を一つの目標に集中させる。\n\n"
 forward_observers:0 "前進観測者"
 forward_observers_desc:0 "前進観測者は砲撃の精度と効果を直接観測できる所に位置し、修正のために弾着観測結果を砲までリレー式に送信する。"
 advanced_firebases:0 "高度な重砲陣地"
 advanced_firebases_desc:0 "前進する軍を最大限補助するために、要塞化された陣地内において砲兵の位置を前線に肉薄させる。"
 shock_and_awe:0 "衝撃と畏怖"
 shock_and_awe_desc:0 "火力の大規模集中は、即座に十分に適時に敵の意志を挫くような衝撃と畏怖をより増加させる。"
 grand_battle_plan:0 "大規模作戦"
 grand_battle_plan_desc:0 "交戦を開始する前に広範囲にわたる計画と準備をすることは成功の鍵である。\n\n"
 trench_warfare:0 "塹壕戦"
 trench_warfare_desc:0 "シャベルはしばしば歩兵の最良の武器となる。部隊は担当するいくつかの陣地を塹壕化することの価値を学ぶ。"
 prepared_defense:0 "準備された防御"
 prepared_defense_desc:0 "更なる広大な野戦要塞の組織網は個々の部隊の防衛力を大いに改善する。"
 grand_assault:0 "大規模強襲"
 grand_assault_desc:0 "一度十分な軍が編制され、目標が綿密に計画されれば、強力な突撃は敵を粉砕するだろう。"
 grand_mechanized_offensive:0 "機械化攻勢"
 grand_mechanized_offensive_desc:0 "自動車化された軍隊はそれなりに強力だ。しかし、さらに攻勢能力を高めるためには、将兵を護り重火器を運搬できる装甲輸送車で戦場へ乗り込む歩兵が必要だ。\n\n"
 assault_concentration:0 "集中強襲"
 assault_concentration_desc:0 "攻勢開始の瞬間に最大の兵力を注力できることを確実にするため、攻勢の前にそれを率いる要素は慎重に前線へと準備、配置される。"
 branch_interoperation:0 "兵科の相互運用"
 branch_interoperation_desc:0 "軍隊の異なる分野間の相互作用を強化することは諸兵科連合作戦において軍隊をより良く作用できるようにする。"
 assault_breakthrough:0 "強襲突破"
 assault_breakthrough_desc:0 "全戦線において大規模突撃を展開するよりも、一カ所あるいは少数の敵前線の数カ所に襲撃を集中し、そこを突破する方がより効果的だろう。"
 central_planning:0 "中央計画"
 central_planning_desc:0 "全分野の将校は今や所定の作戦計画を最大効率で確実に遂行することに貢献している。"
 c3i_theory:0 "C3I"
 c3i_theory_desc:0 "現役参謀将校は指揮官とその指揮下の部隊の間の命令・指揮・通信・情報の流れの安全を確保する。"
 infantry_offensive:0 "歩兵攻勢"
 infantry_offensive_desc:0 "歩兵の攻撃精神は勝利の重要な要素である。我が軍の歩兵は率先して道を切り開かねばならない。\n\n"
 armored_operations:0 "機甲作戦"
 armored_operations_desc:0 "戦車や装甲車は作戦内で直接支援要請したり、歩兵を戦場まで運ぶのにとても便利な兵器である。"
 infiltration_assault:0 "浸透強襲"
 infiltration_assault_desc:0 "攻勢開始時には兵は敵陣において、守備の薄い地点を攻撃目標にしなければならない。より強力に防衛された地点を迂回し孤立させ、その後攻勢部隊が停止している時間によって一掃されるだろう。"
 night_assault_tactics:0 "夜間強襲戦術"
 night_assault_tactics_desc:0 "夜間での戦闘、行軍に慣れている兵士達は、攻勢のために自ら予め前線に布陣し、襲撃を想定していない敵軍を直ちに攻撃できる。"
 attritional_containment:0 "消耗抑制"
 attritional_containment_desc:0 "もし我々が敵拠点を排除するために攻撃を実行することが不可能なのであれば、それでもなお絶え間なく、敵が攻撃を開始することを妨げ、なおかつ損失を引き起こしうる小規模な攻撃を続けなければならない。"
 infiltration_in_depth:0 "縦深浸透"
 infiltration_in_depth_desc:0 "我が軍は今や敵の強力な拠点を回避し孤立させ、更に深く進軍するよう訓練されている。理想的には我らの突撃部隊は敵の背後に回り込み、敵部隊を完全に始末するまで止まるべきではない。"
 mass_assault:0 "大量突撃"
 mass_assault_desc:0 "「完璧な」兵器は過大評価されている。大量の「十分有効な」兵器こそが勝利への道筋となるのだ！\n\n"
 pocket_defence:0 "孤立地防衛"
 pocket_defence_desc:0 "防勢の一環としてならば、我々の軍隊は孤立しても構わないだろう。当然ながらこの場合、反攻によって解放されるまで彼等は持ち堪える必要がある。"
 defence_in_depth:0 "縦深防御"
 defence_in_depth_desc:0 "抵抗を比較的緩やかなものとし一時的に敵の進出を許すことで、我々は空間と引き換えに時間を稼ぐことができ、反攻までに攻撃側を消耗させることが可能となる。"
 large_front_operations:0 "広域戦線作戦"
 large_front_operations_desc:0 "幅広い戦線における戦闘では互いに離れた複数の部隊の戦果をうまく連携させる必要がある。作戦レベルでこれを行おうとすれば、必要となる調整能力は戦術レベルの比ではない。\n\n"
 deep_operations:0 "縦深作戦"
 deep_operations_desc:0 "縦深作戦、または縦深戦闘の概念は、複数の地点で敵の防衛線を突破し、敵の使用可能な予備兵や縦深を破壊し、可能な限り多くの戦略的縦深を占領するものである。"
 operational_concentration:0 "作戦集中"
 operational_concentration_desc:0 "あらゆる軍事行動においては局所的に敵を圧倒することがカギとなる。戦線のどの地点においても圧倒的優位を得られない場合、全戦線を強化するのではなく、他の部分を弱体化させてでも兵を一点に集中させる必要があるだろう。"
 vast_offensives:0 "広大攻勢"
 vast_offensives_desc:0 "もし突破が実現されたなら、それを最大限に利用する必要がある。広大攻勢は敵戦線を可能なかぎり深く押し込み、前線における敵の防備を困難、不可能、あるいは無意味なものとする。"
 breakthrough_priority:0 "突破優先"
 breakthrough_priority_desc:0 "作戦密度を増幅させ、前線のあらゆる要求を突破の二の次にして戦力を集中させる。局所的敗北は決定的な打撃を打てるのであれば些細なものである。"
 mechanized_wave:0 "機械化人海戦術"
 mechanized_wave_desc:0 "複数の機械化部隊は正確に突破口を開拓するのに必要とされる急速な前進を指揮する点、また、機甲部隊の援護、突破口側面の保護という観点でも理想的である。"
 continuous_offensive:0 "無停止攻勢"
 continuous_offensive_desc:0 "適切に活用された突破はしばしば非常に効果的ではあるが、遅かれ早かれ攻撃側は常に疲労し、防御側は軍を再編制して新たな防衛線を構築することができる。しかし十分な予備兵と適切な組織による攻勢を継続するならば、縦深の奥深くにいる敵に破滅的な結果を与えられる。"
 human_wave_offensive:0 "人海戦術攻勢"
 human_wave_offensive_desc:0 "人海戦術攻勢は敵防衛線に対し歩兵の密集陣形によって正面突撃をかける歩兵戦術である。白兵戦により防衛側を圧倒的することを目的としている。"
 human_infantry_offensive:0 "歩兵攻勢"
 human_infantry_offensive_desc:0 "戦いに勝つ為の決定的要素は歩兵の攻撃的精神である。我々の歩兵が勝利への道を示さなければならない。"
 large_front_offensive:0 "広大戦線攻勢"
 large_front_offensive_desc:0 "指揮、あるいは脅迫により、前線の複数箇所で人海戦術攻勢をしかけることで、敵が火力を一箇所に集中させることを困難にする。"
 peoples_army:0 "人民軍"
 peoples_army_desc:0 "人民軍は武器に対する人間の優越を信じている。高い戦意によって技術の遅れを補っており、さらに広範な市民からの幅広い支援を受けている。\n\n"
 guerilla_warfare:0 "ゲリラ戦"
 guerilla_warfare_desc:0 "敵進我退　敵駐我撹　敵疲我打　敵退我追\n敵が進出したら退却せよ。敵が停止したら撹乱せよ。敵が疲弊したら攻撃せよ。敵が退却したら追撃せよ。"
 jungle_warfare:0 "密林戦"
 jungle_warfare_desc:0 "兵士達に特別な訓練を行うことによって密林での効果的な作戦が実施できるようになるだろう。"
 HUN_light_infantry_tech:0 "軽歩兵師団ドクトリン"
 HUN_light_infantry_tech_desc:0 "歩兵部隊の支援火器の量を減らすことでより柔軟な運用が可能になり、都市や森林のような動きの制限される地形での戦闘で優位に立てるようになる。"
 AIR_TITLE_CAS:0 "近接航空支援機"
 AIR_TITLE_FIGHTER:0 "戦闘機"
 AIR_TITLE_NAV:0 "対艦攻撃機"
 AIR_TITLE_HEAVY_FIGHTER:0 "重戦闘機"
 AIR_TITLE_MEDIUM_BOMBER:0 "戦術爆撃機"
 AIR_TITLE_STRAT_BOMBER:0 "戦略爆撃機"
 fighter_light:0 "Light Fighters"
 fighter_multirole:0 "Multirole Fighters"
 fighter_vtol:0 "VTOL Fighters"
 fighter_interceptor:0 "Air Superiority Fighters"
 tactical_bomber:0 "戦術爆撃機モデル"
 bomber_strategic:0 "Strategic Bombers"
 strategic_bomber:0 "戦略爆撃機モデル"
 transport_air:0 "Transport Planes"
 naval_bomber:0 "対艦攻撃機モデル"
 cas_bomber:0 "近接航空支援機モデル"
 TITLE_BATTLEFIELD_SUPPORT:0 "戦場支援"
 TITLE_OPERATIONAL_INTEGRITY:0 "作戦整合性"
 TITLE_STRATEGIC_DESTRUCTION:0 "戦略的破壊"
 air_doctrine_versatile:0 "Aeronautic Versatility"
 air_doctrine_versatile_desc:0 "This doctrine focuses on pure mission efficiency and readiness to adapt to any situation without any specific strategic interests in mind. This tree will contain a variety of benefits that focus on equilibrium and consistent combat regardless of conditions."
 air_doctrine_systemic:0 "Systemic Strategic Initiative"
 air_doctrine_systemic_desc:0 "This doctrine focuses on improving the strategic capability of the air force and its capacity to bomb enemy targets. By buffing bombers' destructive capabilities and improving their survivability, they can conduct high risk missions without access to superiority in tight situations or rain hellfire with superiority."
 air_doctrine_integral:0 "Tactical Integrity Doctrine"
 air_doctrine_integral_desc:0 "While strategic initiatives and operations can provide key benefits, an army is only as strong as its weakest link. By ensuring that we are powerful and indomitable on an operational and tactical level, we can utterly crush the enemy with sheer direct force."
 air_doctrine_versatile_tt:0 "§RMutually Exclusive§! with §YSystemic Doctrine§! and §YIntegral Doctrine§!"
 air_doctrine_systemic_tt:0 "§RMutually Exclusive§! with §YVersatile Doctrine§! and §YIntegral Doctrine§!"
 air_doctrine_integral_tt:0 "§RMutually Exclusive§! with §YVersatile Doctrine§! and §YSystemic Doctrine§!"
 air_doctrine_versatile_1a:0 "Night Ops"
 air_doctrine_versatile_1a_desc:0 "Training our pilots to operate and identify friend-or-foe in low light conditions will enable them to have greater success during nighttime operations, giving greater flexibility on when operations can be conducted. Additionally, this training can also aid during bad weather scenarios where visibility is low."
 air_doctrine_versatile_1b:0 "Meteorological Networks"
 air_doctrine_versatile_1b_desc:0 "Optimally, we would not begin operations in unfavorable weather. However, warfare is unpredictable and we must sometimes deal with operating in unsavory conditions. To better cope with this, a meteorological network dedicated to predicting the weather and providing key information to our best bet to cope with it."
 air_doctrine_versatile_2:0 "Radio Navigation Control"
 air_doctrine_versatile_2_desc:0 "We can heavily invest in aeronautic navigation methods to improve the mission efficiency of our air force and expand the capability of our navigational teams at mission control."
 air_doctrine_versatile_3a:0 "Expanded Training Squadrons"
 air_doctrine_versatile_3a_desc:0 "Training squadrons are units that specialize in air force training and teach new pilots how to perform their operations properly. By expanding the capacity of the squadrons and creating a more robust regimen, we can allow our air wings to be more prepared for combat and speed up exercises."
 air_doctrine_versatile_3b:0 "Emergency Training"
 air_doctrine_versatile_3b_desc:0 "Our training regimen lacks proper emergency situation training. Our pilots need to learn how to deal with engine failures or weather damage with brutal efficiency."
 air_doctrine_versatile_4:0 "Adaptive Formations"
 air_doctrine_versatile_4_desc:0 "Our jet formations need to be flexible and allow our pilots to adapt to combat situations."
 air_doctrine_versatile_5a:0 "High Altitude Interception"
 air_doctrine_versatile_5a_desc:0 "Developing mission tactics to approach and intercept enemies flying at high altitude can allow us to strike them before they even reach their target!"
 air_doctrine_versatile_5b:0 "Versatile Naval Ops"
 air_doctrine_versatile_5b_desc:0 "With the development of new technologies and naval tactics, our naval bombers will find themselves dealing with a diverse set of problems in their missions. Developing a diverse set of tactics for dealing with unique naval formations will go a long way."
 air_doctrine_versatile_5c:0 "High-Altitude Precision Bombing"
 air_doctrine_versatile_5c_desc:0 "To avoid enemy AA fire and interception, we must be capable of conducting high altitude operations with our strategic bombers. Precision bombing computing technology can enable us to hit enemy targets from very high up, enabling high-altitude flying mid-operation."
 air_doctrine_versatile_5d:0 "Terrain Masking"
 air_doctrine_versatile_5d_desc:0 "In order to evade the enemy and prevent them from easily taking down our interdictors, we must use the terrain to mask their approach and avoid enemy interception."
 air_doctrine_versatile_6a:0 "Interception Profiles"
 air_doctrine_versatile_6a_desc:0 "(NEEDS DESCRIPTION)"
 air_doctrine_versatile_6b:0 "Sky Cover/De-icing"
 air_doctrine_versatile_6b_desc:0 "Far from letting clouds get in the way, we can use them as terrain, marking a new evolution of aeronautic tactics. By equipping our planes with de-icing technology they can use clouds and weather elements to our advantage and either use them to escape or ambush the enemy!"
 air_doctrine_versatile_6c:0 "Low-Altitude Supersonic Bombing"
 air_doctrine_versatile_6c_desc:0 "While safer than mid-air bombing, high-air bombing is also in danger of being struck by enemies at range. Low-altitude supersonic bombing, however, can sometimes be safer if the terrain limits interception angles. Of course, this entirely depends on the unique situation and both high-altitude precision bombing and low-altitude supersonic strikes should be considered depending on the AO."
 air_doctrine_versatile_6d:0 "Evasion Tactics"
 air_doctrine_versatile_6d_desc:0 "CAS/Interdictor evasion tactics and maneuvers can greatly improve the survivability of our support jets."
 air_doctrine_versatile_7a:0 "Energy Fighting"
 air_doctrine_versatile_7a_desc:0 "Energy fighting is a very difficult to master method of air combat that requires extensive training and usually involves the pilot maintaining high speeds in combat."
 air_doctrine_versatile_7b:0 "Multirole Opportunism"
 air_doctrine_versatile_7b_desc:0 "One of the advantages of using multirole fighters is their capability to attack both ground and air targets. This allows each plane to launch a timely strike when they are in an opportune moment to attack without having to worry about specialized cas being in the area. Teaching pilots how to exploit these opportunities allows us to get the most out of our multiroles."
 air_doctrine_versatile_8:0 "Predictive Lock-on Algorithm"
 air_doctrine_versatile_8_desc:0 "Using predictive algorithms, our missiles can attempt to reengage and home in on targets they have lost until they can be reacquired. This way, the enemy is in even greater danger in the clouds because we can still seek them even if they cannot see us."
 air_doctrine_versatile_9a:0 "Reactive Fighter Maneuvers"
 air_doctrine_versatile_9a_desc:0 "Combat can always yield surprises. Reactive formations are responsive methods of dealing with unexpected situations."
 air_doctrine_versatile_9b:0 "Interdiction"
 air_doctrine_versatile_9b_desc:0 "Bombing enemy supply units or disrupting them en-route to enemy forces via interdiction provides immense benefits to our ground units in battle and provides a major reward for controlling the skies enough to strike enemies far behind their lines."
 air_doctrine_versatile_10:0 "Well-Rounded Air Officer Training Program"
 air_doctrine_versatile_10_desc:0 "To ensure our air force is as adaptive as it can be, we will educate our air officers with a broad curriculum to ensure they are well-rounded and capable of adapting to any situation."
 air_doctrine_systemic_1a:0 "Modern Bomber Escort Tactics"
 air_doctrine_systemic_1a_desc:0 "Previously planes would fly in formation slightly ahead of bombers and attempt to engage enemies moving in to intercept. However, in the age of guided rockets we need to reformulate our formations and methods of protecting bombers by having them trail far behind out of range and have cruising interceptors ready to engage spotted enemies."
 air_doctrine_systemic_1b:0 "Inter-bomber Coordination"
 air_doctrine_systemic_1b_desc:0 "Our bombers should coordinate with each-other and with recon aircraft to spot and engage bombing targets more efficiently and strike opportunity targets."
 air_doctrine_systemic_2a:0 "Defense Profile Scouts"
 air_doctrine_systemic_2a_desc:0 "We need to coordinate efforts to spot enemy detection or interception sites en route to target so our bombers can get in closer before being spotted. A coordinated efforts between stealth reconnaissance craft or recon ground elements will greatly reduce the visibility of our bombers."
 air_doctrine_systemic_2b:0 "Specialized Payloads"
 air_doctrine_systemic_2b_desc:0 "Knowing is half the battle. The other half is extreme violence. Creating stockpiles of bombs specialized in destroying specific targets (IE softer targets get higher explosive bombs while harder targets need shaped ones) and planning our missions accordingly will allow our bombers to maximize damage!"
 air_doctrine_systemic_3:0 "Aerial Networks"
 air_doctrine_systemic_3_desc:0 "In order to aid enemy fighter/interceptor detection we need to create mass information networks that gather intel on enemy aerial positions. This organized effort will improve mission efficiency."
 air_doctrine_systemic_4a:0 "Anti-Fleet Tactics"
 air_doctrine_systemic_4a_desc:0 "Fleets have evolved and the way ships work has changed. The adoption of SAMs and the change in naval doctrines mean we need to rethink the way we conduct naval bombing operations. Creating formations and methods of whittling down fleets and striking targets that can hit us from kilometers away is crucial to our naval bombing missions' success."
 air_doctrine_systemic_4b:0 "Meteorological Networks"
 air_doctrine_systemic_4b_desc:0 "Optimally, we would not begin operations in unfavorable weather. However, warfare is unpredictable and we must sometimes deal with operating in unsavory conditions. To better cope with this, a meteorological network dedicated to predicting the weather and providing key information to our best bet to cope with it."
 air_doctrine_systemic_5a1:0 "Large Naval Payload Warheads"
 air_doctrine_systemic_5a1_desc:0 "Our focus on bombers has yielded advancements in ASMs. We should prioritize improved warheads leading to heavier damage."
 air_doctrine_systemic_5a2:0 "Extended Naval Payload Engines"
 air_doctrine_systemic_5a2_desc:0 "Our focus on bombers has yielded advancements in ASMs. We should prioritize improved engines and missile mobility for better accuracy."
 air_doctrine_systemic_5b1:0 "Tactical Operation Network Divestment"
 air_doctrine_systemic_5b1_desc:0 "While we may focus on strategic operations, we can and should use our vast networks to support ground operations on a tactical level to diversify our capabilities."
 air_doctrine_systemic_5b2:0 "Strategic Operation Network Focus"
 air_doctrine_systemic_5b2_desc:0 "We focus on strategic operations and will continue to do so. By establishing a strategic defensive network we enable ourselves to conduct interception missions more effectively and disrupt the enemy's air operations."
 air_doctrine_systemic_6a1:0 "Saturation Attacks"
 air_doctrine_systemic_6a1_desc:0 "With our heavier payloads, we can mass saturation attacks against enemy fleets and overwhelm their defensive capabilities, leading to more general survivability against attacks on our naval bombers."
 air_doctrine_systemic_6a2:0 "Long-Range Attacks"
 air_doctrine_systemic_6a2_desc:0 "With our longer range, more accurate payloads, we can strike enemy ships from further away and attempt to avoid enemy interceptors/defenses all together leading to more survivability against attacks on our naval bombers."
 air_doctrine_systemic_6b1:0 "Support Task Element Priority"
 air_doctrine_systemic_6b1_desc:0 "Mission control and the strategic network should prioritize aiding support task elements before superiority task elements for better tactical operation efficiency."
 air_doctrine_systemic_6b2:0 "Superiority Task Element Priority"
 air_doctrine_systemic_6b2_desc:0 "Mission control and the strategic network should prioritize aiding superiority task elements before support task elements for better strategic mission efficiency."
 air_doctrine_systemic_7a:0 "Fully Integrated Bombing Mission Recon System"
 air_doctrine_systemic_7a_desc:0 "Creating a fully integrated and streamlined recon system to spot and map hostile patrols ahead of bombing missions will prevent our bombers from being spotted until it is too late."
 air_doctrine_systemic_7b:0 "Integrated High-Altitude Naval Bombing Scout Planes"
 air_doctrine_systemic_7b_desc:0 "High-mach high-altitude scout planes have a great many uses. By using them to recon ahead of naval bombing missions and map out enemy naval patrols, our bombers can get in closer, exploit more opportunities, and survive more missions."
 air_doctrine_systemic_7c:0 "Integrated Strategic Bombing Element Radar Planes"
 air_doctrine_systemic_7c_desc:0 "By providing our strategic bombing elements with dedicated radar planes, we are far more capable of defending them against oncoming interceptors."
 air_doctrine_systemic_7d:0 "Target Seeking Strategic Bombing Scout Elements"
 air_doctrine_systemic_7d_desc:0 "Providing our strategic bombing scout elements with recon planes can allow them to track and spot targets more efficiently and deal more damage."
 air_doctrine_systemic_8a:0 "Scheduled Airbase Inspections"
 air_doctrine_systemic_8a_desc:0 "By routinely scheduling airbase inspections, we can reduce the number of accidents by seeking and resolving issues, mistakes, and inefficiencies in the onsite maintenance operations."
 air_doctrine_systemic_8b:0 "Networked Search and Rescue"
 air_doctrine_systemic_8b_desc:0 "To prevent the loss of experienced pilots after a crash, we must create an organized search and rescue system using strategic mission control resources."
 air_doctrine_systemic_9a:0 "Remote Warfare"
 air_doctrine_systemic_9a_desc:0 "Drones and unmanned vehicles are the way of the future. Our strategic network is perfectly suited for remotely controlling UAV strike elements and with some exercises, can develop impressive drone strike tactics that you cannot do with manned planes."
 air_doctrine_systemic_9a_tt:0 "§CRemote Warfare enables the§!§Y Drone Strike§!§C counter-insurgency operation§!"
 air_doctrine_systemic_9b:0 "Standoff Strikes"
 air_doctrine_systemic_9b_desc:0 "With our extensive strategic network we can attack targets far outside of their effective range and evade defensive fire."
 air_doctrine_systemic_10:0 "Strategic Tracking"
 air_doctrine_systemic_10_desc:0 "Tracking enemy fighter elements from the moment they are spotted will prevent us from being caught unaware during bombing missions."
 air_doctrine_systemic_5a1_tt:0 "§RMutually Exclusive§! with §YExtended Naval Payload Engines§!"
 air_doctrine_systemic_5a2_tt:0 "§RMutually Exclusive§! with §YLarge Naval Payload Warheads§!"
 air_doctrine_systemic_5b1_tt:0 "§RMutually Exclusive§! with §YStrategic Operation Network Focus§!"
 air_doctrine_systemic_5b2_tt:0 "§RMutually Exclusive§! with §YTactical Operation Network Divestment§!"
 air_doctrine_integral_1a:0 "Massed Jet Formations"
 air_doctrine_integral_1a_desc:0 "Using massed jet formations and patrols will enable us to detect and engage enemy interceptors more effectively."
 air_doctrine_integral_1b:0 "Frontline Aviation"
 air_doctrine_integral_1b_desc:0 "Using CAS in breakthroughs and integrating them into frontline attacks greatly improves our air support capability. Through close coordination with ground troops and danger close strikes, we can maintain momentum on the battlefield."
 air_doctrine_integral_2a1:0 "Defensive Primacy"
 air_doctrine_integral_2a1_desc:0 "Our planes need to be on the defensive on their maneuvers in order to stay alive. They should avoid unnecessary risks and generally try to stay alive."
 air_doctrine_integral_2a2:0 "Offensive Primacy"
 air_doctrine_integral_2a2_desc:0 "In order to win wars we need to make sacrifices. Staying on the offensive and aggressively seeking targets will greatly improve our combat capability even if it means a few losses."
 air_doctrine_integral_2b1:0 "Spearhead Aviation"
 air_doctrine_integral_2b1_desc:0 "In addition to supporting the troops, our planes need to find opportunities to spearhead attacks and create potential breach points and aid the ground forces."
 air_doctrine_integral_2b2:0 "Second Line Aviation"
 air_doctrine_integral_2b2_desc:0 "While spearheading attacks with planes can be fruitful, our planes need to prioritize holding lines and defending against enemy offensives before anything else."
 air_doctrine_integral_3a1:0 "Airborne Early Warning"
 air_doctrine_integral_3a1_desc:0 "Using cheap planes or dedicated ground elements to patrol the skies and mark out enemy aerial offensives will protect our troops and give us a better chance of spotting enemy air superiority units."
 air_doctrine_integral_3a2:0 "Fighter Dragging"
 air_doctrine_integral_3a2_desc:0 "(NEEDS INFO)"
 air_doctrine_integral_3b1:0 "Heavy Tanking"
 air_doctrine_integral_3b1_desc:0 "(NEEDS INFO)"
 air_doctrine_integral_3b2:0 "Saturation Attacks"
 air_doctrine_integral_3b2_desc:0 "With our heavier payloads, we can mass saturation attacks against enemy fleets and overwhelm their defensive capabilities, leading to more general survivability against attacks on our naval bombers."
 air_doctrine_integral_4a:0 "High Alpha Maneuvers"
 air_doctrine_integral_4a_desc:0 "High alpha maneuvers are maneuvers performed at slow speeds with high angles of attack and are intended to out-turn enemies at slower speeds. These maneuvers can help overcome higher speed enemies with greater agility."
 air_doctrine_integral_4b:0 "Loitering Stations"
 air_doctrine_integral_4b_desc:0 "(NEEDS INFO)"
 air_doctrine_integral_5:0 "Rough Field Operation (Rapid Deployment Units)"
 air_doctrine_integral_5_desc:0 "Creating advance airbases using rapid deployment units allows an army to establish opportune, hastily established airbases and avoid problems arising from enemy air units or coordinated artillery strikes damaging well established fields."
 air_doctrine_integral_6a:0 "Air Wing Merit"
 air_doctrine_integral_6a_desc:0 "Awarding merit and advancement to well performing air wings is a great way to encourage team coordination and mutual aid amongst a unit, greatly rewarding cohesion."
 air_doctrine_integral_6b:0 "Element Merit"
 air_doctrine_integral_6b_desc:0 "Awarding merit and advancement to well performing pilots is a great way to encourage ambition and reward skill."
 air_doctrine_integral_7a:0 "Air Wing Promotion Incentives"
 air_doctrine_integral_7a_desc:0 "Providing incentives and rewards to well performing air wings such as improvement priority and higher quality equipment will get us the most out of these skilled units in team efforts such as interception missions."
 air_doctrine_integral_7b:0 "Jet Shturmovik Tactics"
 air_doctrine_integral_7b_desc:0 "Developed by the Soviets, Jet Shturmovik Tactics are a large array of maneuvers and ground support tactics intended to improve the efficiency and lethality of ground support missions."
 air_doctrine_integral_7c:0 "Airman Promotion Incentives"
 air_doctrine_integral_7c_desc:0 "Providing incentives and rewards to well performing airmen such as improvement priority and higher quality equipment will get us the most out of these skilled units in individual efforts such as support missions."
 air_doctrine_integral_8a:0 "Ground Saturation"
 air_doctrine_integral_8a_desc:0 "Combining JST and massed formations, ground saturation attacks strike focal points in enemy lines with immense ferocity and overwhelm enemy AA defenses in order to create small potential breach points to be exploited by the ground forces."
 air_doctrine_integral_8b:0 "High Intensity Ops"
 air_doctrine_integral_8b_desc:0 "Using rough advance (no, not \"advanced\" please stop saying this is a typo) fields allows air units to maintain high levels of pressure as they can be quickly placed closer to the battlefield for shorter cruise times."
 air_doctrine_integral_8c:0 "AirLand Combined Arms"
 air_doctrine_integral_8c_desc:0 "Integrating AirLand combat with combined arms assaults helps ensure that both air and ground units on the offensive are more likely to survive and succeed."
 air_doctrine_integral_9a:0 "Long-Range Escorts"
 air_doctrine_integral_9a_desc:0 "During saturation attacks, long-range escort planes lag behind CAS planes and stay on the lookout for enemy interceptors who may attempt to disrupt the mission."
 air_doctrine_integral_9b:0 "Mobile Rapid Deployment Unit Tactics"
 air_doctrine_integral_9b_desc:0 "Mobile Rapid Deployment Units integrated in, and coordinating with, ground units are more capable of establishing safer rough fields by maintaining high levels of communication with ground officers and staying updated on changes in the front."
 air_doctrine_integral_9c:0 "Air Unit Primacy"
 air_doctrine_integral_9c_desc:0 "When situations become dire and air units are at risk, it is the duty of the ground forces during combined arms attacks to prioritize threats against air units rather than ground units."
 air_doctrine_integral_10a:0 "Air-to-Air Data Links"
 air_doctrine_integral_10a_desc:0 "Creating air-to-air data links between elements inside massed interceptor patrols will improve interoperability and provide more accurate data to each individual plane."
 air_doctrine_integral_10b:0 "Air-to-Ground Active Tracking"
 air_doctrine_integral_10b_desc:0 "Actively tracking ground targets and maintaining high levels of data sharing between troops in need of air support and CAS elements will allow our CAS to strike more efficiently and accurately."
