 early_helicopter:0 "Early Helicopter Applications"
 early_helicopter_short:0 "Early Helicopter "
 early_helicopter_desc:0 "A helicopter is a type of rotorcraft in which lift and thrust are supplied by horizontally spinning rotors. This allows the helicopter to take off and land vertically, to hover, and to fly forward, backward and laterally. These attributes allow helicopters to be used in congested or isolated areas where fixed-wing aircraft and many forms of STOL (Short TakeOff and Landing) or STOVL (Short TakeOff and Vertical Landing) aircraft cannot perform without runway."
