 logistics_I:0 "Efficient Air freight"
 logistics_I_desc:0 "Lighter containers and standardised container securing mechanisms improve the speed at which air freight can be loaded and unloaded."
 logistics_II:0 "Palletization"
 logistics_II_desc:0 "Placing all cargo on pallets, which can be easily handled by forklifts and cargo cranes, gives us greater flexibility in what cargo we can ship, and where."
 logistics_III:0 "Modular BOM"
 logistics_III_desc:0 "The modular BOM (bill of material) is a planning bill that allows complex products that have optional features to be modified on demand for production in the factory. By exchanging different components for one another on a modular product, more variations of the same product to fit different needs can be easily made to order."
 logistics_IV_A:0 "Consumption-based MRP"
 logistics_IV_A_desc:0 "Consumption-based Manufacturing Resource Planning plans using current and future sales figures in order to manufacture potentially needed products ahead of time, saving time and meeting the demand quickly. However, there are inaccuracies in Consumption-based MRP which leads to waste based on inaccurate projections, which can cost resources and lead to waste. Sometimes, Consumption-based MRP has catastrophic projections failings which lead to liquidations or mass waste."
 logistics_IV_B:0 "Produce to Demand MRP"
 logistics_IV_B_desc:0 "Produce-to-Demand Manufacturing Resource Planning plans based on immediate needs and does not build the product until it is ordered. By doing this, waste is prevented and resources and active factory time are saved. This, however, results in waiting times and puts more pressure on commerce to plan on an individual level for their own products or rely more heavily on customer ahead-of-time ordering. Produce-to-demand can often lead to shortages or order backlogs but prevents resource waste."
 logistics_V_A:0 "Truck-based Container Standardization"
 logistics_V_A_desc:0 "Truck-based container standardization is the standardization of truck based intermodal transportation. While all intermodal transportation is standardized, selecting this technology represents an emphasis on truck-based logistics and innovation. Focusing on truck-based logistics leads to easier transportation within' a city allowing for more local industry from simplified urban logistics and infrastructure networks but leaves innovation in rail networks behind making overall productivity from intercity trade or rural industry more difficult."
 logistics_V_B:0 "Train-based Container Standardization"
 logistics_V_B_desc:0 "Train-based container standardization is the standardization of train based intermodal transportation. While all intermodal transportation is standardized, selecting this technology represents an emphasis on train-based logistics and innovation. Focusing on train-based logistics leads to easier intercity transportation and improved rural industrial capability but makes intracity logistics more expensive to establish leading to more complex and difficult to manage urban infrastructure."
 logistics_VI:0 "Universal Product Code"
 logistics_VI_desc:0 "The Universal Product Code (UPC) is a barcode system that allows for rapid identification and tracking of trade items. In addition to tracking, the barcode allows for rapid checkout of products at the point of sale."
 logistics_VI_A:0 "Supersized Oil Terminals"
 logistics_VI_A_desc:0 ""
 logistics_VII_A:0 "Differentiation Advantage SIS"
 logistics_VII_A_desc:0 "The Differentiation Advantage SIS (strategic information system) is an information system that focuses on being more versatile and being able to accomplish more in a wider variety of areas rather than providing a competitive, lower cost. Based off of Porter's differentiation advantage theory, the DS_SIS seeks to create a differential advantage in the market through uniqueness."
 logistics_VII_B:0 "Competitive Advantage SIS"
 logistics_VIII_A:0 "Belly Cargo Emphasis"
 logistics_VIII_A_desc:0 "Belly cargo planes are cargo aircraft that store cargo in the belly of the plane and store cargo only. These kinds of planes cannot carry passengers and as such, are not as versatile as combi aircraft. By focusing on the development of belly cargo air freighters, air freight can be vastly improved as industrial air freight becomes more capable.\nThis results in the production of completely segregated airliners that purely transport passengers."
 logistics_VIII_B:0 "Combi Planes Emphasis"
 logistics_VIII_B_desc:0 "Combi planes are aircraft that can be quickly modified to carry passengers, freight, or both at the same time. They typically feature rails where seats can be installed or removed and are designed with oversized side cargo doors. These planes can be manufactured en masse and serve multiple purposes and allow for planes to serve cargo transportation and airlining.\nThis results in the production of combination airplanes primarily."
 logistics_IX:0 "Modern Gantry Cranes"
 logistics_IX_desc:0 "The gantry crane, is a large crane used to handle containers. Dockside gantry cranes handle maritime logistics whereas trainyard gantry cranes handle loading and unloading trains. Modern gantry crane designs are able to handle intermodal containers at a faster rate, hold more weight, and run semi-automatically through the use of computer assisted operation."
 logistics_X:0 "Supply Chain Management"
 logistics_X_desc:0 "While supply chain management was created in WWII to make a more efficient procurement system and streamline logistics, modern needs and technological improvements press for an even greater level of logistical control and management. By organizing contracts and quotas and creating more formalized and streamlined macroplanned infrastructure networks, the needs of the modern world can be met and industry can reach a greater level."
 logistics_XI:0 "Automatic Identification and Data Capture (AIDC)"
 logistics_XI_desc:0 ""
 logistics_XII:0 "Smart Factory Logistics"
 logistics_XII_desc:0 ""
 logistics_XIII:0 "Cloud Integrated Agile Logistics (CIAL)"
 logistics_XIII_desc:0 ""
 logistics_XIV:0 "Information Era Systems Engineering"
 logistics_XIV_desc:0 ""
 industry_logistics_tt:0 "§G+5%§! §YLongshore§! income\n"
 management_I:0 "Total Productive Maintenance (TPM)"
 management_I_desc:0 "TPM is the organization and systematization of maintaining production and improving quality. The primary objective of TPM is to ensure that the productivity of an industrial division is maintained through a modest investment into maintenance and improvements. \nIn order to establish a TPM regimen, dedicated maintenance teams are necessary and resources must be regularly invested to enhance the volume of production."
 management_II:0 "Preventive Maintenance"
 management_II_desc:0 "Preventative maintenance is a core aspect of TPM in which maintenance and inspections are conducted ahead of time before a breakdown occurs. Through systematic inspection, detection, and correction of failures during non-productive hours work is carried out to avoid breakdown or malfunction. The development of PM requires the development of a regime, special maintenance teams and tools, and a training system in order to enable maintainers to detect potential failures or wearing ahead of time."
 management_III_A:0 "Periodic Maintenance"
 management_III_A_desc:0 "Periodic maintenance is a reduction of the TPM regimen scheduled based on the estimated lifespan of machines or parts. Based off of trends, inspections are planned and conducted periodically and is not as extensive as predictive maintenance, as it results in less frequent inspections. Periodic maintenance reduces overall costs, but has less productivity and more common failures due to the less intensive and regular maintenances."
 management_III_B:0 "Predictive Maintenance"
 management_III_B_desc:0 "Predictive maintenance is an expansion of the TPM regimen scheduled based on the condition of equipment. Predictive maintenance is an expansion of inspections conducted regularly on machinery and maintains equipment whenever it shows signs of wear, fatigue, or potential failure. Predictive maintenance is more expensive as it requires an expansion of the TPM regimen, but is more effective at preventing failures and maintaining productivity."
 management_IV:0 "Cellular Manufacturing"
 management_IV_desc:0 "The goal of cellular manufacturing is to make a large variety of similar products in a short timespan. Each \"cell\" produced one intermediate product though 1 or more machines and moves those intermediates to another \"cell\" of machines that create another checkpoint. In the cell format, a single cell needs to be changed or modified (or in some cases, simply moved to an alt-cell) in order to change an entire production line."
 management_V_A:0 "Introduce Just In Time (JIT)"
 management_V_A_desc:0 "The Just In Time production system is where a factory seeks to use only what it needs for a product to reduce waste and minimize wait times between each stage of production. In the JIT system, goods are not stockpiled and new logistical orders are made as soon as input goods arrive. As a result, warehousing is minimized, waste is vastly reduced, liquidation is made rarer, and costs are cut. JIT also seeks to cut down buffers or excess staff in order to improve efficiency."
 management_V_B:0 "Improve Just In Case (JIC)"
 management_V_B_desc:0 "The Just In Case production system is where a factory seeks to create buffers and have additional levels of stock and staff in order to prevent losses in productivity as a result of logistical hangups, mistakes, or faulty inputs. The JIC system seeks to prevent problems or hangups within' production by maintaining stockpiles of goods that are needed and making orders once certain parts become close to becoming low."
 management_VI:0 "Total Quality Management (TQM)"
 management_VI_desc:0 "Total Quality Management is an effort to improve employee's abilities in the workplace. This is done through incentives, merit, and through improved management techniques. Through improvement of work processes, quality of products and services in improved as is productivity. Cross-functional teams may be assembled ad-hoc to address immediate quality issues, active management participation in instruction is made policy, and meritocratic rewards are granted to individuals that perform at greater levels than their peers."
 management_IV_A:0 "Occupational Safety and Health Management (OSHM)"
 management_IV_A_desc:0 ""
 management_VII_A:0 "Constant Work In Progress (ConWIP)"
 management_VII_A_desc:0 "The Constant Work in Progress is a hybridized push and pull manufacturing system. ConWIP maintains a constant number of \"Work-in-Progress\" products on the production line through individual cards set at each level of the production line."
 management_VII_B:0 "Quick Response Manufacturing (QRM)"
 management_VII_B_desc:0 "Quick Response Manufacturing is a hybridized push and pull manufacturing system. Quick Response Manufacturing maintains short lead times between products by reducing the latency between the initiation and execution of a manufacturing process. By implementing practices that lead to reduced lead times, productivity is improved and costs are reduced."
 management_VIII:0 "Capability Maturity Model Integration (CMMI)"
 management_VIII_desc:0 "The Capability Maturity Model Integration is a development model in which many practices and policies in manufacturing become formalized and optimized and ad hoc practices are replaced with permanent ones. The model is designed to develop and improve upon previous and future management policies and aid in the development of the manufacturing process by turning regularly conducted ad hoc practices into formal policy and evaluating them to optimize them further."
 management_IX:0 "Lean Manufacturing"
 management_X:0 "Agile Manufacturing"
 management_X_tt:0 "Industrial Park §G-10% £resources_strip|5 Office Park §G-10% £resources_strip|2 Consumption"
