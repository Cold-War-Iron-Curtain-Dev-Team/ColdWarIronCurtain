 SMO.1.d: "The situation in Ukraine has taken a turn for the worse, as Russian troops have successfully invaded and captured the city of Kiev. Despite the efforts of the Ukrainian forces, they have proven to be unable to hold off the advance of the Russian Armed Forces. The remaining Ukrainian officials were forced to flee the city in a hurry, with the President leaving several days prior to the Russian takeover.\nAs a result of the invasion, the President of Ukraine has resigned from office, leaving a power vacuum that needed to be filled urgently. In the absence of a duly elected leader, the Verkhovna Rada has elected Yulia Tymoshenko, also known as \"the gas princess\", as the acting President of Ukraine. Her appointment is seen as a temporary measure until a new leader can be elected and the country can regain its stability."
 SMO.2.d: "As a former member of the Soviet Union, Kazakhstan had a strategic location and access to a large arsenal of Soviet-era weapons, making it a crucial ally to Russia.\nHowever, things did not go as planned. After a prolonged and bloody battle in the city of Alma Ata, the Kazakh President, Nursultan Nazarbayev, declared an unconditional surrender to the Russian Federation. This came as a surprise to many who had expected Kazakhstan to hold out longer against the Russian military.\nFollowing the surrender, President Alexander Rutskoy established a Kazakh Military Administration Zone to govern the country, appointing Viktor Samsonov as its head. Meanwhile, the northern regions of Kazakhstan, which had a significant Russian population, were annexed to the Russian Federation."