 cybcom_ideological_desc: "£Ideology_Cybernetic_Communism_pic\n\n\n\n\n\n\n\n\n"
 cybcom_planning: "Cybernetic Communism - Technocratic"
 cybcom_planning_desc: "£Ideology_Cybernetic_Communism_pic\n\n\n\n\n\n\n\n\n"
 dengism: "Deng Xiaoping Theory"
 dengism_desc: "£Ideology_Deng_Xiapong_Theory_pic\n\n\n\n\n\n\n\n\n"
 ho_chi_minh_thought: "ホー・チ・ミン思想"
 ho_chi_minh_thought_desc: "Ho Chi Minh Thought is the official ideology of the Communist Party of Vietnam under the leadership of Chairman Ho Chi Minh. Though firmly Marxist-Leninist, Ho believes in a more nationalistic reintepretation of Marxism for the unique conditions of the Vietnamese revolution, even taking some influence from Sun Yat-Sen's \"Three Principles of the People\" and the American revolutionaries. Ho Chi Minh Thought is as proudly Vietnamese as it is Communist, and calls for a \"national democratic revolution\" -- a truly Vietnamese path to socialism where worker, peasant, soldier, and merchant will unite against inequality and imperialism in all its forms."
 juche: "主体思想"
 juche_desc: "Juche is the official state ideology of North Korea, described by the government as Kim Il-sung's original, brilliant and revolutionary contribution to national and international thought. It postulates that the Korean masses are to act as the masters of the revolution and construction and that by becoming self-reliant and strong a nation can achieve true socialism."
 KPRF_party: "KPRF"
 KPRF_party_desc: "£Ideology_CPRF_pic\n\n\n\n\n\n\n\n\nKommunisticheskaya Partiya Rossiyskoy Federatsii, or the KPRF, ..."
 liberal_communism: "Liberal Communism"
 liberal_communism_desc: "Liberal Communism preserves the communist state and the supremacy of the party. However, it seeks to reduce or limit the most repressive or coercive elements of a communist system. Non-communist social and political organizations are allowed exist. Public debate and criticism are tolerated, however, the state and Party remain dominant and any attempts to overthrow either is not allowed. Liberal Communism helps bring all segments of the population together and help in a more peaceful socialist society. More traditionalist Communists argue this ideology only weakens the grip of the Party and paves the way for anarchy or counterrevolutionary forces."
 marxism_leninism: "マルクス・レーニン主義"
 marxism_leninism_desc: "Marxism-Leninism is the ideology combining Marxist socioeconomic theory and Leninist political praxis, which is the official ideology of the Union of Soviet Socialist Republics and of the Communist International. The purpose of Marxism-Leninism is the revolutionary development of a capitalist state into a socialist state, effected by the leadership of a vanguard party of professional revolutionaries from the working class."
 militant_socialism: "Militant Socialism"
 militant_socialism_desc: "£Ideology_Militant_Socialism_pic\n\n\n\n\n\n\n\n\n\"One man with a gun can control a hundred without one.\" \n— §YVladimir Ilyich Lenin.§!\n\nThroughout history, many people who were downtrodden and impoverished yearned for a better life. Some joined the army in search of improvement and recognition, while others held onto the ideas of socialism and Marxism in their hearts.\n\nThis is where §YMilitant Socialism§! emerged. This group of revolutionaries was not composed of common workers or peasants but originated from the guardians of the nation—the army itself. §YMilitant Socialists§! believed that to achieve the Dictatorship of the Proletariat, the military should take matters into its own hands. Unlike a typical junta, they argued that power would eventually be returned to civilian leadership once the tenets of Marxism-Leninism took root."
 nhuism: "個人尊厳理論"
 nhuism_desc: "£Ideology_Ideology_Nhuism_pic\n\n\n\n\n\n\n\n\nPerson Dignity Theory or Spiritualistic Marxism, encapsulates the radical ideological perspective of Ngo-Dinh-Nhu. His worldview was shaped significantly by his involvement with French syndicalism in the 193s and the left-wing nationalism of the Viet Minh. Unlike the more moderate views of his brother, Ngo-Dinh-Diem, Nhu's stance leaned further left, proposing a transformative and highly centralized governance model. His interpretation of \"True Marxism\" emphasized the complete centralization of state power within the Can Lao Party and aimed for the dismantling of traditional Vietnamese society, replacing it with a collectivist system.\n\nNhu advocated for organizing the Vietnamese population into collectivist society, such as the \"Strategic Hamlets,\" structures intended to secure and regiment peasant life, integrating them tightly into state-led development and defense strategies, and the establishment of \"Urban Revolutionary Syndicates,\" which functioned as collectivized bodies to mobilize and discipline city dwellers.\n\nThe Can Lao Party, under Nhu’s design, adopted the organizational framework modeled after communist party structures, specifically taking cues from Soviet and Vietnamese Communist methods. Nhu highlighted the importance of this approach, noting, “The first science of mass movement organization is the organization according to the Soviet method... property in Russia.” This mirrored the belief that for a comprehensive social revolution to succeed, an ironclad organizational structure that held the masses tightly, akin to the communist parties, was necessary.\n\nNhu's ambitions extended beyond domestic transformation, as he envisioned Vietnam playing a pivotal role in an international movement aimed at confronting and dismantling \"Materialistic Capitalism.\" This vision hinted at aspirations for Vietnam to spearhead a broader ideological and geopolitical shift, emphasizing a revolutionary blend of Marxist collectivism with spiritual and moral dimensions."
 SOV_marxism_lenninism: "Orthodox Marxism-Leninism"
 SOV_marxism_lenninism_desc: "£Ideology_Marxism_Leninism_pic\n\n\n\n\n\n\n\n\nMarxism-Leninism is the ideology combining Marxist socioeconomic theory and Leninist political praxis, which is the official ideology of the Union of Soviet Socialist Republics and of the Communist International. The purpose of Marxism-Leninism is the revolutionary development of a capitalist state into a socialist state, effected by the leadership of a vanguard party of professional revolutionaries from the working class."
 SOV_stalinism: "Marxism-Leninism"
 SOV_stalinism_desc: "£Ideology_SOV_Stalinism_pic\n\n\n\n\n\n\n\n\nStalinism is the means of governing and related policies implemented from around 1927 to 1953 by Joseph Stalin. Stalinist policies and ideas as developed in the Soviet Union included rapid industrialization, the theory of socialism in one country, a totalitarian state, collectivization of agriculture, a cult of personality and subordination of the interests of foreign communist parties to those of the Communist Party of the Soviet Union, deemed by Stalinism to be the leading vanguard party of communist revolution at the time."
 stalinism: "Marxism-Leninism"
 stalinism_desc: "Stalinism is the means of governing and related policies implemented from around 1927 to 1953 by Joseph Stalin. Stalinist policies and ideas as developed in the Soviet Union included rapid industrialization, the theory of socialism in one country, a totalitarian state, collectivization of agriculture, a cult of personality and subordination of the interests of foreign communist parties to those of the Communist Party of the Soviet Union, deemed by Stalinism to be the leading vanguard party of communist revolution at the time."
 twenty_eight_bolsheviks: "28 Bolshevik Orthodox Marxism-Leninism"
 twenty_eight_bolsheviks_desc: "\n\n\n\n£Ideology_28_Bolsheviks_pic\n\n\n\n\n\nThe 28 Bolsheviks Faction or \"Returned Students\" are a group of politicians who studied at Sun Yat-Sen University of Moscow with the help of Pavel Mif between 1926 and 1935 under Komitern Authorities. Their important members were Wang Ming, Wang Jiaxiang, Zhang Wentian, Qin Bangxian (a.k.a Bo Gu), Yang Shangkun, He Kequan (a.k.a Kai Feng), and foreigners like Otto Braun (a.k.a Li De) during their pick of influence on CPC between 1931 and 1935 (Zunyi Conference) who ends the faction of 28 Bolsheviks for the Zhou Enlai, Zhu De, Mao Zedong Faction. The thought of 28 Bolsheviks is to keep the Marxist-Leninist Doctrine based on the Soviet Union VKP/KPSS Vanguardist Party while rejecting any \"distortion\" of Marxist-Leninist Theory and keep the Leninist Vanguardist Material Condition Analysis and reject Mao's \"sinicization of Marxism\" with Chinese Material Dialectic Analysis proposed by Ideologues like Zhou Yang or Chen Boda (who promoted a softer political stance about Chinese Culture place in Chinese \"New Culture\"). However \"Returned Students\" were divided about their position towards China's Material Conditions and Mao Zedong, like Zhang Wentian and Wang Jiaxiang who supported concepts that were close to Mao's \"New Democracy\" or some principles of \"New Culture\" with disagrees about the status of \"old Culture\" to transition to \"new Culture\" where Wang Ming or Bo Gu where Dogmatist with following the path of Soviet Union."
 chin_peng_thought: "Chin Peng Thought"
 chin_peng_thought_desc: "£Ideology_Chin_Peng_Thought_pic\n\n\n\n\n\n\n\n\n\nComrade Chin Peng, the leader of the Malayan Communist Party, initially drew inspiration from Sun Yat-sen’s Tridemism, which emphasized nationalism, democracy, and people’s livelihood. As a young man, he admired Chiang Kai-shek and his nationalist rule over southern China and Taiwan. However, Chin Peng later became heavily influenced by Mao Zedong’s “ On Protracted War “, embracing Maoist ideals of Chinese revolutionary struggle and class warfare. He believed in the need for a long-term, armed revolution to liberate the Chinese proletariat from both Western imperialism and capitalist oppression in Malaya. Despite aligning with other races in Malaya, Chin Peng harbored a distinct cultural bias toward Malayan Chinese, and he envisioned a version of Malayan Communism that would incorporate elements of Tridemism, Buddhism, and religion, seeking to blend local beliefs with socialist revolutionary goals. His ideological framework reflected both pragmatism and a Han nationalistic desire to create a culturally specific Chinese Communist model for Malaya."
 chin_peng_thought_communist: "Chin Peng Thought"
 chin_peng_thought_communist_desc: "£Ideology_Chin_Peng_Thought_Communist_pic\n\n\n\n\n\n\n\n\n\nComrade Chin Peng, the leader of the Malayan Communist Party, initially drew inspiration from Sun Yat-sen’s Tridemism, which emphasized nationalism, democracy, and people’s livelihood. As a young man, he admired Chiang Kai-shek and his nationalist rule over southern China and Taiwan. However, Chin Peng later became heavily influenced by Mao Zedong’s “ On Protracted War “, embracing Maoist ideals of Chinese revolutionary struggle and class warfare. He believed in the need for a long-term, armed revolution to liberate the Chinese proletariat from both Western imperialism and capitalist oppression in Malaya. Despite aligning with other races in Malaya, Chin Peng harbored a distinct cultural bias toward Malayan Chinese, and he envisioned a version of Malayan Communism that would incorporate elements of Tridemism, Buddhism, and religion, seeking to blend local beliefs with socialist revolutionary goals. His ideological framework reflected both pragmatism and a Han nationalistic desire to create a culturally specific Chinese Communist model for Malaya."
