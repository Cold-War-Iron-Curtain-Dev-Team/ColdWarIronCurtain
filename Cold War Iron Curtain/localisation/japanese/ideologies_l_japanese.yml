 religious_zionism: "宗教シオニズム"
 religious_zionism_desc: "Religious Zionists used to be just observant Jews who supported the Zionist movement, but gradually it evolved into a movement of its own. The followers of Religious Zionism believe that the right for the Jews to settle the ancient land of Israel which was promised to them by god as permanent and inalienable. Zionism is still opposed by ultra-orthodox Jews who see Zionism as interfering with salvation and thus, blasphemous but Religious Zionists still believe in the merit of settling in Israel on religious grounds."
 republican: "共和党"
 republican_desc: "The Republican Party is one of the two major political parties in the United States, the other being its historic rival, the Democratic Party. The party is named after republicanism, a major ideology of the American Revolution. Founded by anti-slavery activists, economic modernizers, ex-National Republicans, ex-Free Soilers and Whigs in 1854, the Republicans largely dominated politics nationally and in the majority of northern states between 1860 and 1932."
 right_wing_populism: "Right-Wing Populism"
 right_wing_populism_desc: "Right-wing populism, often referred to as national populism or right populism, is a political ideology that synthesizes elements of right-wing political beliefs with populist rhetoric and themes. This ideology is characterized by its focus on anti-elitism, which involves a critique of established political institutions and elites perceived as disconnected from the everyday experiences and concerns of ordinary citizens. Right-wing populist movements typically emphasize national identity, advocating for the interests and values of the \"common people\" against what they consider to be an out-of-touch establishment. \n\nAdditionally, right-wing populism often emphasizes issues such as immigration control, nationalism, and economic protectionism, portraying these stances as essential to safeguarding the culture and interests of the nation. The rhetoric used in this ideological framework tends to galvanize support among individuals who feel marginalized or ignored by mainstream politics, allowing leaders of right-wing populist movements to effectively rally a significant base of followers around shared grievances and aspirations."
 social_conservative: "Social Conservatism"
 social_conservative_desc: "Social conservatism is an ideology that advocates duties and social traditional values that are considered desirable based on traditional values socially, religious, cultural, and ethnic (or national) and pursues social stability through an existing social order. Social conservatives generally believe that society is built on a network of fragile relationships, and that is why governments should encourage or implement a wide range of traditional values or actions that existing societies have had."
 Three_principles_of_people_conservative: "Kuomintang (Minzu-Orthodox Wing)"
 Three_principles_of_people_conservative_desc: "In contrast to the other factions of the reformed Kuomintang, the conservative circle is advocating for preserving Chinese heritage and roots as a major priority of the state domestically. Economically, it supports a mixed economy that usually involves Central Planning from the Government itself alongside partial privitization of some industries, allowing the co-existence of Nationalization and Privitization. Diplomatically, the right-wing members hope for the eradication of Communism as the main Foreign Policy of the Republic, alongside increasing China's self-reliance and preventing any American attempts of subjugating China into its sphere of influence."
