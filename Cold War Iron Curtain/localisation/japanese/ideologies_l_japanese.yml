 anarcho_communism: "無政府共産主義"
 anarcho_communism_desc: "Anarcho-communism is a theory of anarchism which advocates the abolition of the state, capitalism, wage labor and private property in favor of common ownership of the means of production, direct democracy and a horizontal network of workers' councils with production and consumption based on the guiding principle: From each according to his ability, to each according to his needs."
 corporate_neo_liberalism: "Corporate Neo-Liberalism"
 corporate_neo_liberalism_desc: ""
 eurocommunism: "Eurocommunism"
 eurocommunism_desc: "£Ideology_Eurocommunism_pic\n\n\n\n\n\n\n\n\n"
 eurocommunism_AST: "Eurocommunism"
 eurocommunism_AST_desc: "£Ideology_Eurocommunism_AST_pic\n\n\n\n\n\n\n\n\n"
 labor_personalism: "Labor Personalism"
 labor_personalism_desc: "£Ideology_Labor_Personalism_pic\n\n\n\n\n\n\n\n\nSocial Revolutionary Era Labour Personalism, was declared Ngo Dinh Diem’s leadership in the early 196 as the second phase of Labour Personalism which emphasizes on the mass adaptation of Marxist teachings under the Oriental Personalism’s lens. Diem, influenced by the strategies developed by his brother Ngo Dinh Nhu and Kieu-cong-Cung  who structured the Can Lao-Party to emulate the strict mass organization methods of Soviet-style communism and promoted radical anti materialistic capitalist struggles and revolutionization of all governmental or private entities under Can-lao Party’s control as a Revolutionary Vanguard Party. Internal party documents stressed, “The natural communist countries… hold the masses very tightly,” underscoring the need for a similar approach to lead a comprehensive social revolution. Diem’s new policies included Strategic Hamlets for rural areas and Urban Revolutionary Syndicates for cities to align economic and social efforts with Labour Personalism’s moral goals. Although firmly anti-maternalistic, Diem used these methods to strengthen the government’s control and prepare for the construction of a new post-colonialist socialist progressive society in South Vietnam."
 ho_chi_minh_thought_revsoc: "Ho Chi Minh Thought"
 ho_chi_minh_thought_revsoc_desc: "£Ideology_Ho_Chi_Minh_Thought_pic\n\n\n\n\n\n\n\n\nHo Chi Minh Thought is the official ideology of the Communist Party of Vietnam under the leadership of Chairman Ho Chi Minh. Though firmly Marxist-Leninist, Ho believes in a more nationalistic reintepretation of Marxism for the unique conditions of the Vietnamese revolution, even taking some influence from Sun Yat-Sen's \"Three Principles of the People\" and the American revolutionaries. Ho Chi Minh Thought is as proudly Vietnamese as it is Communist, and calls for a \"national democratic revolution\" -- a truly Vietnamese path to socialism where worker, peasant, soldier, and merchant will unite against inequality and imperialism in all its forms."
 left_communism: "Italian Left-Communism"
 left_communism_desc: ""
 left_wing_dictatorship: "Leftist Military Regime"
 left_wing_dictatorship_desc: "#"
 posadism: "Posadism"
 posadism_desc: ""
 revolutionary_islamic_socialism: "Revolutionary Islamic Socialism"
 revolutionary_islamic_socialism_desc: "Deeply influenced by the works of Ali Shariati, Revolutionary Islamic Socialism believes in Islam as a revolutionary force meant to create a classless society. Its current ideologues portray the ideas of Islamic martyrdom and practices as historically opposed to feudalism and capitalism. They now argue the Islamic revolutionary zeal, especially among the Shia, must be harnessed to complete the process of establishing a classless society. Opponents accuse supporters of this ideology for hiding Marxism with an Islamic cover, but its supporters claim Islam is a vital component and they reject the atheistic nature of Marxism."
 revolutionary_socialism: "革命的社会主義"
 revolutionary_socialism_desc: "Revolutionary socialism is the socialist doctrine that social revolution is necessary in order to bring about structural changes to society. More specifically, it is the view that revolution is a necessary precondition for a transition from capitalism to socialism."
 sandanista: "Sandanista"
 sandanista_desc: "Sandinismo is a left-wing political ideology taking its name from the late Nicaraguan resistance leader Augusto Cesar Sandino. Founded in 1961 by Nicaraguan Marxist intellectuals and revolutionaries, Sandinismo is a Christian-Socialist and a democratic, pluralist movement. Their guerrilla tactics have been criticized by opposition groups, but their affiliation with labor unions, student groups, and the Church helps the Sandinistas maintain popular support."
 Sartre_thought: "サルトル思想"
 Sartre_thought_desc: ""
 Socialism_with_Chinese_Characteristics_tro: "Socialism with Chinese Characteristics - Socialist"
 Socialism_with_Chinese_Characteristics_tro_desc: ""
 syndicalism: "Syndicalism"
 syndicalism_desc: "£Ideology_Syndicalism_pic\n\n\n\n\n\n\n\n\nSyndicalism is a Pre-Marxist revolutionary leftish ideology that seeks total ownership and control of the means of production through industrial unionism by unionizing workers according to their professions/specializations and advancing their collective demands through strikes, and violence against reactionaries, capitalists, and governmental forces. Influenced by the works of Proudhon, Georges Sorel, … and French labor unions's struggles during the late 19th century, syndicalist movements were at their zenith amongst the leftish movement but eventually, died off during the rise of the Soviet Union and Marxism-Leninism post-WWII."
 titoism: "チトー主義"
 titoism_desc: "£Ideology_Titoism_pic\n\n\n\n\n\n\n\n\nTitoism refers to the policies and practices associated with Josip Broz Tito in the post-World War II period, particularly during the Cold War. It is characterized by its opposition to the Soviet Union and represents Tito's distinct approach within Cold War international politics.\n\nTitoism emerged when the Yugoslav Partisans liberated Yugoslavia without assistance from the Red Army. As a result, Yugoslavia became the only Eastern European country to maintain a socialist government while remaining independent after World War II, successfully resisting pressure from the Soviet Union."
 trotskyism_ideology: "トロツキー主義"
 trotskyism_ideology_desc: "Trotskyism is the theory of Marxism as advocated by Russian Leon Trotsky. Trotsky identified as an orthodox Marxist and Bolshevik-Leninist. He supported founding a vanguard party of the proletariat, proletarian internationalism and a dictatorship of the proletariat based on working class self-emancipation and mass democracy."
 socialist: "Non-Marxian Socialist"
 socialist_desc: "民主主義"
 socialist_drift: "Daily Social Democratic Support"
 socialist_drift_1: "Non-Marxian Socialist Influence I"
 socialist_drift_2: "Non-Marxian Socialist Influence II"
 socialist_drift_3: "Non-Marxian Socialist Influence III"
 socialist_drift_4: "Non-Marxian Socialist Influence IV"
 socialist_drift_5: "Non-Marxian Socialist Influence V"
 socialist_noun: "Non-Marxian Socialism"
 socialist2: "-Non-Marxian Socialists\n"
 socialist_acceptance: "社会主義政権との外交を容認"
 african_socialism: "African-Socialism"
 african_socialism_desc: "African socialism and Afro-Marxism are a belief in sharing economic resources in a traditional African way, as distinct from classical socialism. Common principles of African socialism are social development guided by a large public sector, incorporating the African identity and what it means to be African, and the avoidance of the development of social classes within society."
 buddhist_socialism: "Buddhist Socialism"
 buddhist_socialism_desc: "£Ideology_Buddhist_Socialism_pic\n\n\n\n\n\n\n\n\nBuddhist Socialism is an ideology that seeks to blend the ethical and spiritual teachings of Buddhism with socialist principles of equality, community welfare, and economic justice. It emerged as a unique response to the socio-economic challenges faced by Buddhist-majority countries, particularly in Southeast Asia. Advocates of Buddhist Socialism propose a system where material wealth is distributed to reduce poverty and suffering, but always with a strong emphasis on moral integrity and personal responsibility.\n\nAt its core, Buddhist Socialism teaches that greed and selfishness—the primary causes of suffering according to Buddhist doctrine—should be minimized within society through communal ownership and altruistic governance. Unlike secular socialism, it avoids class struggle as a path to justice, instead promoting compassion, harmony, and mindful governance to achieve social and economic equality. Influential proponents like U Nu in Myanmar and Tenzin Gyatso, the 14th Dalai Lama, argued that Buddhist Socialism could bring about a more peaceful, moral, and balanced world, addressing both the material and spiritual needs of society."
 democratic_socialist: "民主社会主義"
 democratic_socialist_desc: "Democratic socialism is a political philosophy that advocates political democracy alongside social ownership of the means of production, with an emphasis on self-management and democratic management of economic institutions within a market or some form of decentralized planned socialist economy."
 democratic_socialist_AST: "Democratic Socialism"
 democratic_socialist_AST_desc: "£Ideology_Democratic_Socialism_AST_pic\n\n\n\n\n\n\n\n\n"
 labor_zionism_mapai: "労働シオニズム"
 labor_zionism_mapai_desc: "Labor Zionism is the left-wing of the Zionist movement. For many years, it was the most significant tendency among Zionists and Zionist organizations. It saw itself as the Zionist sector of the historic Jewish labor movements of Eastern and Central Europe, eventually developing local units in most countries with sizable Jewish populations. Labor Zionists believe that a Jewish state could only be created through the efforts of the Jewish working class settling in the Land of Israel and constructing a state through the creation of a progressive Jewish society with rural kibbutzim and moshavim and an urban Jewish proletariat."
 marhaenism: "Marhaenism"
 marhaenism_desc: "The New Order administration of Suharto, the second President of Indonesia, strongly supported Pancasila. His government promoted the five principles as a key national ideology. They were outlined as representing the ancient wisdom of the Indonesian people, pre-dating the introduction of foreign religions such as Hinduism and Islam. In a July 1982 speech which reflected his attachment to Javanese beliefs, Suharto glorified Pancasila as a key to reach the perfect life (Javanese: ilmu kasampurnaning urip) of harmony with God and fellow men."
 market_socialism: "市場社会主義"
 market_socialism_desc: "Market socialism is a type of economic system involving the public, cooperative, or social ownership of the means of production in the framework of a market economy."
 neocommunism: "Neocommunism"
 neocommunism_desc: ""
 oriental_personalism: "東洋個人主義"
 oriental_personalism_desc: "£Ideology_Oriental_Personalism_pic\n\n\n\n\n\n\n\n\nOriental Personalism is the official ideology of Ngo-Dinh-Diem’s Can-Lao Party in South Vietnam, was shaped by diverse influences, including Emmanuel Mounier’s theory of Personalism, Marxism, and Vietnam’s folk traditions and religious beliefs. While Diem was instrumental in shaping this philosophy, it owed much to his brother Ngo-Dinh-Nhu, who infused Revisionist Marxistic elements into it. Oriental Personalism aimed to transform Vietnamese society through a two-phase approach. The first phase, the Personalist Revolution, called for unity among the social and working classes via moral teachings, dissolving their divisions. The second phase, the Social Revolution, envisioned total eradication of materialistic capitalism and colonial remnants, leading to a utopian, socialist, and distinctly Vietnamese society. This vision rejected both materialistic Western’s capitalism and communist collectivism, by prioritizing human dignity, personhood growth, and collective struggle."
 popular_socialism: "Popular Socialism"
 popular_socialism_desc: "£Ideology_Popular_Socialism_pic\n\n\n\n\n\n\n\n\n"
 racial_populism: "Racial Populism"
 racial_populism_desc: "£Ideology_Racial_Populism_pic\n\n\n\n\n\n\n\n\n"
 royal_socialism: "Royal Socialism"
 royal_socialism_desc: ""
 social_nationalism: "Social Nationalism"
 social_nationalism_desc: ""
 socialism: "Non-Marxian Socialism"
 socialism_desc: "Non-Marxian Socialism is a range of economic and social systems characterized by social ownership and workers' self-management of the means of production as well as the political theories and movements associated with them. Social ownership may refer to forms of public, collective or cooperative ownership, or to citizen ownership of equity. There are many varieties of socialism and there is no single definition encapsulating all of them, though social ownership is the common element shared by its various forms. Socialist economic systems can be divided into non-market and market forms. Non-market socialism involves the substitution of factor markets and money, with engineering and technical criteria, based on calculation performed in-kind, thereby producing an economic mechanism that functions according to different economic laws from those of capitalism. Non-market socialism aims to circumvent the inefficiencies and crises traditionally associated with capital accumulation and the profit system. By contrast, market socialism retains the use of monetary prices, factor markets and in some cases the profit motive, with respect to the operation of socially owned enterprises and the allocation of capital goods between them. Profits generated by these firms would be controlled directly by the workforce of each firm, or accrue to society at large in the form of a social dividend. The socialist calculation debate discusses the feasibility and methods of resource allocation for a socialist system."
 Socialism_with_Chinese_Characteristics_soc: "Socialism with Chinese Characteristics - Social Democracy"
 Socialism_with_Chinese_Characteristics_soc_desc: ""
 ujamaa: "ウジャマー"
 ujamaa_desc: "The Swahili word Ujamaa means 'extended family', 'brotherhood' or 'socialism'; as a political concept it asserts that a person becomes a person through the people or community. Ujamaa was a term made popular by the political philosophy applied under Julius Nyerere's social and economic development policies in Tanzania after it gained independence from Britain in 1961."
