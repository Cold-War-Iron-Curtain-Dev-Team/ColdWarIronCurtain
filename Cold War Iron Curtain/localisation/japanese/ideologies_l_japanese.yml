 national_conservatism: "国家保守主義"
 national_conservatism_desc: "£Ideology_National_Conservatism_pic\n\n\n\n\n\n\n\n\nNational Conservatism, is an ideology, which emphasis on the nation-state being primary, cultural cohesion, and traditionalism, is frankly a cautious and often skeptical view of liberal internationalism, social change, or any supranational institution. It aims to conserve the main characteristics of any nation-sovereignty, nationhood, moral integrity, religious traditions, and cultural continuity-which it hopes a powerful state would defend and direct.\n\nNational Conservatism, at its own presentation, sees societies operating best when they are grounded in shared customs and history and common sense of belonging. Not hostile to democracy and capitalism as such, it denotes that these two should be put to the service of the nation against abstract global ideals or individualist extremes.\n\nThus, paraphrasing British statesman Enoch Powell: §Y\"A nation is made great not by its size alone but by its identity and its institutions, by its memory and its purpose\"§!. In such an allele, National Conservatism regards the inheritance of history as less of a burden and much more of a base-the compass through the uncertain terrains of contemporary existence.\n\nUnlike other nationalists who characterize their ideologies essentially in economic terms, national conservists do so from quite different perspectives: political and moral."
