 fascism_acceptance: "Acceptance of Fascism Regimes Diplomacy"
 authenticite: "Mobutuism"
 authenticite_desc: "Mobutuism (or Mobutisme in French) was the official state ideology of Zaire under the rule of Mobutu Sese Seko (1965–1997), serving as a political doctrine designed to legitimize his authoritarian regime and promote national unity under his leadership. The ideology blended African nationalism, anti-colonialism, authoritarianism, and cultural revivalism, with a strong emphasis on Mobutu's personal supremacy. A key component was Authenticité (Authenticity), a campaign aimed at rejecting European colonial influences and promoting African identity, which included abandoning Christian names in favor of African ones (Mobutu himself adopted the name Mobutu Sese Seko Kuku Ngbendu wa za Banga) and discouraging Western clothing in favor of the abacost (a suit without a tie, symbolizing African identity). Mobutuism also rejected both Western capitalism and Marxist communism, advocating instead for a supposedly unique African path, though in practice, Mobutu relied on Western support (particularly from the U.S. and Belgium) to sustain his rule. The regime enforced single-party rule under the Popular Movement of the Revolution (MPR), the only legal political party, with all citizens automatically considered members, while Mobutu centralized power, eliminating opposition and cultivating a cult of personality that portrayed him as the nation’s indispensable leader. Economically, Mobutuism promoted state control and patronage networks, though rampant corruption and mismanagement led to economic decline. Despite its rhetoric of African pride and independence, Mobutuism ultimately functioned as a tool for maintaining Mobutu’s autocratic control over Zaire rather than fostering genuine development or democracy."
 baathism: "バアス主義"
 baathism_desc: "Baathism is an Arab nationalist ideology that promotes the development and creation of a unified Arab state through the leadership of a vanguard party over a progressive revolutionary government."
 dixiecrat_fascist: "£Ideology_Dixiecrat_pic\n\n\n\n\n\n\n\n\n"
 falangism: "ファランヘ主義"
 falangism_desc: "£Ideology_Falangism_pic\n\n\n\n\n\n\n\n\nFalangism is a far-right authoritarian and nationalist ideology that originated in Spain during the early 20th century. It is most closely associated with the Spanish Falange, a fascist political movement founded by José Antonio Primo de Rivera. Falangism promotes a vision of national unity based on Catholic traditionalism, militarism, anti-communism, and corporatist economics, rejecting both liberal democracy and Marxist socialism.\n\nAt its core, Falangism seeks to create a totalitarian state where all aspects of society—political, economic, and cultural—are subordinated to the goals of the nation as defined by a single, unified identity. It emphasizes the importance of hierarchy, duty, and sacrifice, glorifies the nation’s historical legacy, and views individualism as a threat to social cohesion."
 fascism_ideology: "第三の位置主義"
 fascism_ideology_desc: "Encompassing a variety of ultra-nationalist movements, third positionism typically venerates devotion to the state and uniting the people under a strong leader. Third Positionism is presented as its own unique ideology as a third option to capitalism or communism."
 hindu_nationalism: "ヒンドゥー民族主義"
 hindu_nationalism_desc: "Hindu nationalism has been collectively referred to as the expression of social and political thought, based on the native spiritual and cultural traditions of the Indian subcontinent."
 kahanism: "Kahanism"
 kahanism_desc: ""
 ku_klux_klan: "クー・クラックス・クラン"
 ku_klux_klan_desc: "The Ku Klux Klan is an American white supremacist hate group. The Klan has existed in three distinct eras at different points in time during the history of the United States. Each has advocated extremist reactionary positions such as white supremacy, white nationalism, anti-immigration and-especially in later iterations-Nordicism and anti-Catholicism."
 mau_mau_movement: "Mau Mau Movement"
 mau_mau_movement_desc: "£Ideology_Mau_Mau_Movement_pic\n\n\n\n\n\n\n\n\n"
 metaxism: "Metaxism"
 metaxism_desc: ""
 national_bolshevik: "民族ボルシェヴィズム"
 national_bolshevik_desc: "National Bolshevism is a political movement that combines elements of nationalism and Bolshevism."
 nazi_maoism: "Nazi-Maoism"
 nazi_maoism_desc: ""
 neo_fascism: "Neo-Fascism"
 neo_fascism_desc: ""
 neo_legionarism: "Neo-Legionarism"
 neo_legionarism_desc: ""
 neo_nazism: "ネオ・ナチズム"
 neo_nazism_desc: "Neo-Nazism consists of post-World War II militant, social or political movements seeking to revive the ideology of Nazism. It borrows elements from Nazi doctrine, including ultranationalism, racism up to xenophobia, ableism, homophobia, anti-Romanyism, antisemitism, anti-communism and initiating the Fourth Reich. Holocaust denial is a common feature, as is the incorporation of Nazi symbols and admiration of Adolf Hitler."
 peronism: "Center-Peronism"
 peronism_desc: "£Ideology_Peronism_pic\n\n\n\n\n\n\n\n\nPeronism, as the dominant political ideology in Argentina today, is a blend of social justice, labor rights, and nationalism, with a strong emphasis on the state's role in the economy. It advocates for wealth redistribution and improved living standards for the working class, while ensuring that labor unions and workers’ organizations have a central place in policy-making. The ideology promotes economic protectionism, striving for national sovereignty and reducing foreign influence. Peronism positions itself as a “Third Position” between capitalism and socialism, aiming for a balanced, mixed economy. While it continues to champion social reforms and populist appeals, its governance has faced criticism for its authoritarian tendencies, with a strong centralization of power and control over various sectors. The movement remains deeply divided, with factions ranging from more progressive to conservative wings, but it continues to shape Argentina’s path by focusing on national unity and the welfare of its people."
 repressive_autocracy: "Repressive Autocracy"
 repressive_autocracy_desc: "£Ideology_Repressive_Autocracy_pic\n\n\n\n\n\n\n\n\nRepressive Autocracy is a system of absolute authority, characterized by the concentration of power in a single individual exercising complete control over the state and its citizens. Lacking checks and balances, the autocrat often uses force, intimidation, and coercion to maintain stability and power. Suppress dissent, opposition, and individual rights follows soon after, often including the use of secret police, arbitrary detention, torture, and extrajudicial killings. This system of brutal control often finds the autocrat controlling the economy as well, often using it to reward loyalists and punish any potential threat to power."
 rexism: "レクシズム"
 rexism_desc: "Strongly opposed to both liberal and communist ideals, Rexism is a staunchly conservative nationalist movement who advocate a corporatist economic policy. Employing increasingly populist and authoritarian rhetoric, their ideals are shifting closer to other fascist movements."
 Salazarism: "サラザール主義"
 Salazarism_desc: "Salazarism is a nationalist authoritarian ideology focusing on 'God, Fatherland and Family' and emphasizing the social role of Catholicism - setting it apart from mainstream variations of Fascism."
 trujillism: "Trujillism"
 trujillism_desc: "Trujillism is a political ideology and cult of personality built around the rule and legacy of Rafael Leónidas Trujillo, the authoritarian leader who dominated the Dominican Republic for over three decades. At its core, Trujillism is defined by an extreme concentration of power, personal loyalty to the leader, militarized nationalism, and the fusion of state authority with the identity of a single man.\n\nIdeologically, Trujillism blends elements of right-wing authoritarianism, nationalist centralism, and anti-communism, wrapped in a carefully constructed image of Trujillo as the savior and embodiment of the nation. Under this system, the state is portrayed as an extension of the leader’s will, and all institutions—military, political, religious, and civil—are subordinated to his authority. The regime emphasized order, discipline, and modernization, often boasting of infrastructure projects and economic stability as proof of Trujillo’s “benevolent” rule, even as repression, surveillance, and violence crushed dissent.\n\nTrujillism promotes a patriarchal and hierarchical society, glorifying traditional values, rigid social control, and racial nationalism."
 islamism: "Islamic Democracy"
 islamism_desc: "Islamic Democracy"
 islamism_drift_1: "Islamist Influence I"
 islamism_drift_2: "Islamist Influence II"
 islamism_drift_3: "Islamist Influence III"
 islamism_drift_4: "Islamist Influence IV"
 islamism_drift_5: "Islamist Influence V"
 islamism_noun: "Islamic Democracy"
 islamism2: "-Islamic Democracy\n"
 islamism_acceptance: "Acceptance of Islamic Democracy Diplomacy"
 democratic_islamism: "Islamic Modernism"
 democratic_islamism_desc: "£Ideology_Islamic_Modernism_pic\n\n\n\n\n\n\n\n\nIslamic Modernism emerged in the 19th century as a response to the intellectual and political crisis in the Muslim world. It addressed the challenges posed by European colonialism, internal stagnation, and the rapid advancement of modern science and governance. Adherents of this movement aimed not to discard Islamic tradition but to reinterpret it in light of modern values such as rationalism, constitutionalism, education, and progress. They believed that Islam was never intended to conflict with reason.\n\nProminent figures such as Jamal al-Din al-Afghani, Muhammad Abduh, and Rashid Rida led this movement. They challenged the practice of blindly following past rulings and instead advocated for ijtihad, or independent reasoning, as a means to revitalize Islamic society. Islamic Modernists emphasized that while the Qur’an and Sunnah are timeless, their interpretations must be renewed in each era to address new realities. This perspective allowed for the integration of constitutionalism, gender reform, scientific inquiry, and secular institutions—not as deviations from Islam, but as continuations of its ethical mission."
 ibadi_immamate: "Ibadi Imamate"
 ibadi_immamate_desc: ""
 sunni_islamism: "スンナ派イスラム主義"
 sunni_islamism_desc: "Sunni Islam is the largest denomination of Islam. Its name comes from the word Sunnah, referring to the exemplary behavior of the Islamic prophet Muhammad"
 radical_shiaism: "Islamic Nationalism"
 radical_shiaism_desc: "Islamic Regime"
 radical_shiaism_drift_1: "Islamic Nationalism Influence I"
 radical_shiaism_drift_2: "Islamic Nationalism Influence II"
 radical_shiaism_drift_3: "Islamic Nationalism Influence III"
 radical_shiaism_drift_4: "Islamic Nationalism Influence IV"
 radical_shiaism_drift_5: "Islamic Nationalism Influence V"
 radical_shiaism_noun: "Islamic Nationalism"
 radical_shiaism2: "-Islamic Nationalists\n"
 radical_shiaism_acceptance: "Acceptance of Islamic Nationalism Diplomacy"
 khomeinist: "ホメイニ主義"
 khomeinist_desc: "Khomeinism was founded by Grand Ayatollah Ruhollah Khomeini during the Iranian Islamic Revolution of 1979. It is about replacing old monarchic rule with a theocratic system. Everything in the Quran is now law with the government."
 radical_shiaist: "Radical Shiaism"
 radical_shiaist_desc: ""
 radical_zaidiism: "フーシ主義"
 radical_zaidiism_desc: "Houthiism is an armed movement stemming from a sect of Shia Islam, Zaidiism. Houthiism is almost nonexistent outside of Yemen. The Houthi movement strongly opposes Saudi Arabia, the US, and Israel and seeks to combat the 'underdevelopment and marginalization' of Yemen."
 shia_islamism: "シーア派イスラム主義"
 shia_islamism_desc: "Shia is a branch of Islam which holds that the Islamic prophet Muhammad designated Ali ibn Abi Talib as his successor (Imam)."
 shia_monarchy: "Shia Monarchy"
 shia_monarchy_desc: ""
 Salafism: "Radical Islamism"
 Salafism_desc: "イスラム国"
 Salafism_drift_1: "Radical Islamism Influence I"
 Salafism_drift_2: "Radical Islamism Influence II"
 Salafism_drift_3: "Radical Islamism Influence III"
 Salafism_drift_4: "Radical Islamism Influence IV"
 Salafism_drift_5: "Radical Islamism Influence V"
 Salafism_noun: "Radical Islamism"
 Salafism2: "-Radical Islamists\n"
 Salafism_acceptance: "Acceptance of Radical Islamist Regimes Diplomacy"
 revolutionary_jihad: "Revolutionary Jihad"
 revolutionary_jihad_desc: ""
 salafist: "サラフィー主義"
 salafist_desc: "Salafism is a reform branch or revivalist movement within Sunni Islam that developed in Egypt in the late 19th century as a response to Western European imperialism, with roots in the 18th-century Wahhabi movement that originated in the Najd region of modern day Saudi Arabia."
 semi_constitutional_monarrchy: "Semi-Constitutional Monarchy"
 semi_constitutional_monarrchy_desc: ""
 indian_ocean_socialism: "Indian Ocean Socialism"
 indian_ocean_socialism_desc: "Indian Ocean Socialism is a progressive, anti-colonial, and internationalist socialist ideology deeply influenced by the revolutionary vision of France-Albert René, the former President of Seychelles whose transformative leadership exemplified its core principles. Rooted in the historical and cultural interconnectedness of the Indian Ocean region—spanning South Asia, East Africa, Southeast Asia, and the islands—this ideology blends indigenous socialist traditions like Gandhian socialism, African Ujamaa, and maritime collectivism with modern Marxist and ecological thought. Inspired by René's pragmatic socialism, it emphasizes self-reliance, participatory democracy, and the dismantling of neocolonial economic structures. René's policies—such as land reform, universal welfare, and the promotion of workers' and fishermen's cooperatives—serve as a blueprint for equitable resource redistribution and sustainable development. Central to Indian Ocean Socialism is the decolonization of trade and the creation of a pan-regional federation based on mutual aid, climate resilience, and anti-imperialist solidarity. René's defiance against Western hegemony and his advocacy for non-aligned, small-state sovereignty underscore the movement's commitment to resisting exploitation while fostering unity among Indian Ocean nations. By prioritizing the rights of marginalized coastal and island communities, this ideology advances a future of ecological balance, economic justice, and collective self-determination—carrying forward René's legacy of revolutionary humanism in the struggle for a liberated Indian Ocean world."
 FLA_militant_socialism_desc: "£Ideology_SOV_Junta_pic\n\n\n\n\n\n\n\n\n\"One man with a gun can control a hundred without one.\" \n— §YVladimir Ilyich Lenin.§!\n\nThroughout history, many people who were downtrodden and impoverished yearned for a better life. Some joined the army in search of improvement and recognition, while others held onto the ideas of socialism and Marxism in their hearts.\n\nThis is where §YMilitant Socialism§! emerged. This group of revolutionaries was not composed of common workers or peasants but originated from the guardians of the nation—the army itself. §YMilitant Socialists§! believed that to achieve the Dictatorship of the Proletariat, the military should take matters into its own hands. Unlike a typical junta, they argued that power would eventually be returned to civilian leadership once the tenets of Marxism-Leninism took root."
 WAL_militant_socialism_desc: "£Ideology_SOV_Junta_pic\n\n\n\n\n\n\n\n\n\"One man with a gun can control a hundred without one.\" \n— §YVladimir Ilyich Lenin.§!\n\nThroughout history, many people who were downtrodden and impoverished yearned for a better life. Some joined the army in search of improvement and recognition, while others held onto the ideas of socialism and Marxism in their hearts.\n\nThis is where §YMilitant Socialism§! emerged. This group of revolutionaries was not composed of common workers or peasants but originated from the guardians of the nation—the army itself. §YMilitant Socialists§! believed that to achieve the Dictatorship of the Proletariat, the military should take matters into its own hands. Unlike a typical junta, they argued that power would eventually be returned to civilian leadership once the tenets of Marxism-Leninism took root."
 BEL_militant_socialism_desc: "£Ideology_SOV_Junta_pic\n\n\n\n\n\n\n\n\n\"One man with a gun can control a hundred without one.\" \n— §YVladimir Ilyich Lenin.§!\n\nThroughout history, many people who were downtrodden and impoverished yearned for a better life. Some joined the army in search of improvement and recognition, while others held onto the ideas of socialism and Marxism in their hearts.\n\nThis is where §YMilitant Socialism§! emerged. This group of revolutionaries was not composed of common workers or peasants but originated from the guardians of the nation—the army itself. §YMilitant Socialists§! believed that to achieve the Dictatorship of the Proletariat, the military should take matters into its own hands. Unlike a typical junta, they argued that power would eventually be returned to civilian leadership once the tenets of Marxism-Leninism took root."
 sankarism: "Sankarism"
 sankarism_desc: "£Ideology_Sankarism_pic\n\n\n\n\n\n\n\n\n"
 bolivarianism: "Bolivarianism"
 bolivarianism_desc: "Bolivarianism, as championed by Hugo Chávez, is a left-wing nationalist and socialist ideology rooted in the revolutionary ideals of Simón Bolívar, reimagined for modern Venezuela with strong anti-imperialist, populist, and Marxist influences. Central to Chávez's vision was the rejection of U.S. hegemony and neoliberal capitalism, instead promoting Latin American unity, economic sovereignty, and state-controlled redistribution of wealth. His government nationalized key industries—particularly oil—to fund expansive social welfare programs (misiones) aimed at reducing poverty and expanding access to healthcare, education, and housing. Politically, Chavismo emphasized participatory democracy through communal councils and constitutional reforms, consolidating power under a centralized, charismatic leadership while rhetorically empowering the marginalized. Ideologically, it blended Bolívar’s pan-Americanism with class struggle rhetoric, positioning itself as a radical alternative to capitalism and a beacon for regional leftist movements, though critics denounced it as authoritarian populism masking economic mismanagement and democratic erosion."
 corporate_neo_liberalism_NZL: "Corporate Neo-Liberalism"
 corporate_neo_liberalism_NZL_desc: "£Ideology_Corporate_Neo_Liberalism_NZL_pic\n\n\n\n\n\n\n\n\n"
 islamic_socialism: "Islamic Socialism"
 islamic_socialism_desc: "Islamic Socialism is a political ideology that merges Islamic ethical principles with socialist economic policies, aiming to establish a just society through state-led wealth redistribution, anti-exploitation measures, and public control of key resources while adhering to Islamic teachings. Emerging prominently in the mid-20th century, it served as a post-colonial alternative to both Western capitalism and atheistic communism, particularly in Muslim-majority nations. The ideology emphasizes economic justice through Islamic mechanisms like Zakat (obligatory alms) and the prohibition of riba (usury), alongside socialist-inspired policies such as land reforms, nationalization of industries, and welfare programs. Leaders like Egypt’s Gamal Abdel Nasser, Algeria’s Ahmed Ben Bella, and Libya’s Muammar Gaddafi experimented with variants of Islamic Socialism, blending anti-imperialism, pan-Arab or pan-Islamic unity, and state-driven development. Critics argue it often prioritized authoritarian governance over democratic participation, while supporters viewed it as a means to achieve egalitarian goals without rejecting Islamic identity. The ideology’s legacy persists in debates about equitable development within an Islamic framework, though its influence waned after the late 20th century with the rise of neoliberalism and Islamist movements advocating free-market Islam or theocratic models."
 jamahiriya: "Jamahiriya"
 jamahiriya_desc: "Muammar Gaddafi's Jamahiriya ideology, outlined in his Green Book, is a unique political system that rejects both capitalism and communism, promoting a third way based on direct democracy. It emphasizes decentralized governance through local People's Committees, where citizens directly participate in decision-making. Gaddafi advocates for Libyan socialism, with state ownership of key industries and wealth redistribution. His ideology extends to Pan-Arabism and Pan-Africanism, aiming for unity among Arab and African nations. While it promotes social justice and anti-imperialism, the system is often criticized for being authoritarian, with Gaddafi maintaining control over the country."
 nkrumaism: "Nkrumaism"
 nkrumaism_desc: "Nkrumaism is the political and ideological philosophy developed by Kwame Nkrumah, Ghana's first President and a leading figure in the Pan-African movement. It emerged during the struggle for African independence and was shaped by anti-colonialism, socialism, and Pan-Africanism. Nkrumaism sought to provide a framework for the liberation, unity, and development of Africa. At its core, Nkrumaism emphasizes anti-colonialism and liberation, advocating for the complete rejection of colonialism, imperialism, and neocolonialism while pushing for the political and economic independence of African nations. Central to the ideology is Pan-Africanism and African unity, with Nkrumah envisioning a United States of Africa—a continental government to ensure Africa's collective strength—and actively promoting the Organization of African Unity (OAU), the precursor to the African Union. Economically, Nkrumaism supports African socialism, blending socialist principles with African communal traditions to advocate for state-led industrialization, wealth redistribution, and economic self-sufficiency to break dependency on former colonial powers. Politically, it favors a one-party socialist state, arguing that multi-party systems in post-colonial Africa could lead to division and neocolonial interference, instead promoting a centralized, disciplined governance model. Additionally, Nkrumaism highlights cultural revival and education, stressing the importance of decolonizing African minds, reviving indigenous cultures, and using education as a tool for national development and ideological training. Lastly, it underscores anti-neocolonialism, warning against continued Western economic and political domination even after independence and calling for economic policies that prioritize African interests. Nkrumaism remains influential in discussions on African unity, socialism, and development, inspiring movements and leaders across the continent."
 lumumbism: "Lumumbism"
 lumumbism_desc: "Lumumbism (or Lumumbisme in French) is a political ideology rooted in the ideas and legacy of Patrice Lumumba, the first democratically elected Prime Minister of the Democratic Republic of the Congo and a central figure in Africa's anti-colonial struggle. Emerging as a revolutionary alternative to foreign domination, Lumumbism emphasizes anti-imperialism, pan-African unity, national sovereignty, social justice, and radical nationalism, distinguishing itself sharply from later authoritarian distortions like Mobutuism. At its core, the ideology rejects all forms of colonialism and neocolonial exploitation, advocating instead for true economic and political independence from Western powers—a principle Lumumba demonstrated when he defiantly opposed continued Belgian interference after Congo's 196 independence. His vision extended beyond national liberation, embracing pan-African solidarity with leaders like Kwame Nkrumah and Gamal Abdel Nasser, whom he saw as allies in building a united front against foreign intervention and capitalist exploitation. Economically, Lumumbism favors state-led development and the nationalization of key resources to ensure wealth benefits the Congolese people rather than foreign corporations, reflecting his socialist leanings without strict adherence to Marxist dogma. Politically, it supports popular democracy and mass mobilization against elite corruption and foreign-backed puppet regimes—a stance that ultimately led to Lumumba's Western-backed overthrow and assassination in 1961, cementing his martyrdom as a symbol of resistance. Today, Lumumbism endures as both a revolutionary inspiration for African sovereignty movements and a critique of neocolonialism, though its radical ideals have rarely been fully implemented, often co-opted or suppressed by subsequent authoritarian regimes and global power structures."
 left_wing_peronism: "Left-Peronism"
 left_wing_peronism_desc: "£Ideology_Peronism_pic\n\n\n\n\n\n\n\n\nPeronism, as the dominant political ideology in Argentina today, is a blend of social justice, labor rights, and nationalism, with a strong emphasis on the state's role in the economy. It advocates for wealth redistribution and improved living standards for the working class, while ensuring that labor unions and workers’ organizations have a central place in policy-making. The ideology promotes economic protectionism, striving for national sovereignty and reducing foreign influence. Peronism positions itself as a “Third Position” between capitalism and socialism, aiming for a balanced, mixed economy. While it continues to champion social reforms and populist appeals, its governance has faced criticism for its authoritarian tendencies, with a strong centralization of power and control over various sectors. The movement remains deeply divided, with factions ranging from more progressive to conservative wings, but it continues to shape Argentina’s path by focusing on national unity and the welfare of its people."
 mexican_constitutionalism: "Mexican Constitutionalism"
 mexican_constitutionalism_desc: "Initially rooted in the Mexican Revolution's ideals—land reform, labor rights, and anti-imperialism—it structured society into state-controlled sectors (unions, peasant leagues) to exchange patronage for loyalty. While maintaining a centrist \"middle way\" rhetoric, it governed through electoral fraud, repression, and controlled modernization. By the 1980s–90s, the PRI pivoted to neoliberalism (privatizations, NAFTA), abandoning its populist roots. Its ideology was never fixed but rather a tool of power—shifting from left-wing statism to right-wing free-market policies while preserving elite dominance through coercion and co-optation."
 populism: "Populism"
 populism_desc: "In the turbulent political landscape of the 20th century, centrist populism emerged as a force that channeled mass discontent into moderate reform, distinguishing itself from the radical left and right by combining anti-establishment appeals with pragmatic governance. This strain of populism often arose during periods of crisis—economic collapse, corruption scandals, or institutional decay—when traditional parties lost credibility, yet voters rejected revolutionary alternatives. Leaders like Argentina's Arturo Frondizi (1958–1962) and Venezuela's Rómulo Betancourt (1959–1964) exemplified this approach, using populist rhetoric to mobilize broad coalitions while pursuing developmentalist policies that balanced state intervention with foreign investment. In Peru, Fernando Belaúnde Terry's 196s \"March Toward the Andes\" campaign mixed nationalist symbolism with centrist infrastructure projects, framing technocratic solutions as a moral crusade for the marginalized. The appeal lay in its ambiguity: it promised change without upheaval, attacking oligarchies while avoiding land reforms or expropriations that might trigger elite backlash."
 neo_liberalism: "Neo-Liberalism"
 neo_liberalism_desc: ""
 italian_christian_democracy: "Christian Democracy"
 italian_christian_democracy_desc: "£Ideology_Italian_Christian_Democracy_pic\n\n\n\n\n\n\n\n\nRooted in the tradition of Catholic social teaching and inspired by the legacy of the prewar Partito Popolare Italiano, Christian Democracy presents itself as a broad centrist movement—neither reactionary nor revolutionary. It draws strength from the rural peasantry, the urban middle classes, the devout faithful, and those seeking a moral, stable alternative to the extremes of fascism and communism. Above all, it champions democracy guided by Christian ethics, placing the dignity of the human person, family, labor, and social justice at the center of national reconstruction.\n\nSince the liberation, the Christian Democrats have worked to shape a new Italy, helping draft the Constitution, guiding economic recovery, and navigating the challenges of reconstruction with the support of the Vatican and close cooperation with the Western powers. The party rejects class conflict in favor of solidarity and corporate cooperation between workers and employers. It supports the market, but not without moral restraint and public responsibility."
 ilminism_conservative: "Ilminism"
 ilminism_conservative_desc: "£Ideology_Ilminism_pic\n\n\n\n\n\n\n\n\nIlminism is a ruling ideology that 'let's eliminate internal divisions of the people', which was designated as a national poem by then-President Syngman Rhee in 1949. It was theorized by Ahn Ho-sang, the first Minister of Culture and Education and philosopher.\nIlminism includes ethnic nationalism and even has a little bit of fascism. The most fundamental idea of this idea is authoritarian conservatism."
 right_agrarianism: "Agrarian Conservatism"
 right_agrarianism_desc: "Agrarian Conservatism, often referred to as Conservative Agrarianism, is a political and social ideology that centers on the importance of protecting and preserving the rights, traditions, and overall well-being of peasants, farmers, and rural communities. This ideology rests on the foundational belief that rural life, agricultural labor, and responsible land stewardship are essential to the moral and cultural fabric of a stable and thriving society.\n\nProponents of Agrarian Conservatism argue that the essence of a healthy society lies in its connection to the land and the natural cycles of farming. They emphasize the value of traditional rural lifestyles and the unique social structures that emerge from agricultural communities. This perspective often contrasts sharply with the modern trends of industrialization and urbanization, which Agrarian Conservatives critique for eroding these vital rural connections.\n\nRather than viewing economic progress solely through the lens of industrial growth, Agrarian Conservatism advocates for sustainable agricultural practices, the promotion of local economies, and the preservation of rural heritage. Supporters strive to uphold the dignity of farming as both a livelihood and a way of life, believing that protecting these communities is crucial for fostering social values such as cooperation, stewardship, and respect for the land."
 new_federalism: "New Federalism"
 new_federalism_desc: "£Ideology_New_Federalism_pic\n\n\n\n\n\n\n\n\n"
 civilian_dictatorship: "Personalist Dictatorship"
 civilian_dictatorship_desc: "£Ideology_Civilian_Dictatorship_pic\n\n\n\n\n\n\n\n\nPersonalistic Dictatorship embodies a form of authoritarian rule where all political power is concentrated in the hands of a single leader. This leader exerts authority not through established institutions or ideological frameworks, but rather through personal control, intricate loyalty networks, and an expertly crafted image of indispensability. Within this structure, the governance, military, and economic machinery are often at the ruler’s discretion, rendering formal laws and procedures mere tools that serve the ruler's whims rather than act as checks on their power.\n\nThe legitimacy of a personalistic regime hinges on perceptions of the leader’s strength, charisma, and capacity to deliver stability. These perceptions are frequently bolstered through propaganda, patronage, and the suppression of dissent. Institutions are systematically weakened or reconfigured to align with the ruler’s interests, effectively eliminating any rival centers of power. While this system can enable swift decision-making and assertive leadership, it remains profoundly unstable—its very existence reliant on the fate, motives, and ambitions of one individual, thereby making political succession a recurrent source of turmoil."
 INO_interim_government_desc: "£Ideology_INO_Interim_Government\n\n\n\n\n\n\n\n\nWhen the Dutch launched their attack on Indonesia, Soekarno and Hatta surrendered to them in Yogyakarta. Before doing so, however, Soekarno entrusted a mandate to Sjafruddin Prawiranegara, signaling that the situation had become dire.\n\nThe Indonesian Emergency Government was formed in late 1948 as a last resort. It was intended to serve as a government in exile, but it never quite fulfilled that role. Instead, the Republic continued to fight a guerrilla war, navigating through jungles, rice fields, and urban centers, fully aware that independence was worth dying for.\n\nWith the success of Roem van Roijen, the Republic can finally look toward achieving full sovereignty. But will it last, or will the Republic falter due to its own mistakes?"
 stratocracy_nat: "Stratocracy"
 stratocracy_nat_desc: "£Ideology_Stratocracy_pic\n\n\n\n\n\n\n\n\nStratocracy is a system of government in which the military directly rules the state, with political authority resting in the armed forces rather than in civilian institutions. Unlike military dictatorships, which may result from temporary coups, a stratocracy is institutionalized—the military isn't just the power behind the throne; it is the throne. In this type of government, political leadership and military command often overlap, and state policy is primarily shaped by strategic and security considerations.\n\nHistorically, stratocracies have developed in societies where military service is both a civic duty and the main path to political power. Ancient Sparta, where citizens served as lifelong soldiers, serves as a prime example of this model.\n\nProponents of stratocratic governance argue that it offers discipline, unity, and decisive leadership, especially in times of instability. Critics, however, warn that it can lead to the erosion of civil liberties, the suppression of dissent, and the subordination of civilian life to perpetual militarism."
 military_occupation: "Military Occupation"
