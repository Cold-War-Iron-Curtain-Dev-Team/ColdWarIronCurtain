 ethnic_nationalism: "Ethnonationalism"
 ethnic_nationalism_desc: "£Ideology_Ethnic_Nationalism_pic\n\n\n\n\n\n\n\n\nEthnonationalism, is a form of nationalism wherein the nation and nationality are defined in terms of ethnicity, with emphasis on an ethnocentric (and in some cases an ethnocratic) approach to various political issues related to national affirmation of a particular ethnic group."
 ilminism: "Ilminism"
 ilminism_desc: "£Ideology_Ilminism_pic\n\n\n\n\n\n\n\n\nIlminism is a ruling ideology that 'let's eliminate internal divisions of the people', which was designated as a national poem by then-President Syngman Rhee in 1949. It was theorized by Ahn Ho-sang, the first Minister of Culture and Education and philosopher.\nIlminism includes ethnic nationalism and even has a little bit of fascism. The most fundamental idea of this idea is authoritarian conservatism."
 keynesian_paternalism_WP: "Keynesian Paternalism"
 keynesian_paternalism_WP_desc: "£Ideology_Keynesian_Paternalism_WP_pic\n\n\n\n\n\n\n\n\n"
 langism: "Langism"
 langism_desc: "£Ideology_Langism_pic\n\n\n\n\n\n\n\n\n"
 left_nationalist: "左翼国粋主義"
 left_nationalist_desc: "Leftwing Nationalism is a form of nationalism which promotes the raising of societal standards for one's own national people generally through the introduction of social equality and government nationalization. Leftwing Nationalism is often anti-imperialist and can commonly represent national liberation fronts. Generally, Leftwing Nationalism will be a response to repeated exploitation of a nation by outside factors."
 national_democrat: "Civic Nationalism"
 national_democrat_desc: "£Ideology_National_Democracy_pic\n\n\n\n\n\n\n\n\nCivic Nationalism represents a compelling vision of what it means to belong to a nation. It defines the nation not through the lens of ethnicity, religion, or inherited traditions, but by the shared values, institutions, and civic responsibilities that unite its citizens. This ideology emphasizes that membership in the nation is both voluntary and inclusive, fundamentally rooted in allegiance to a common political framework and a commitment to democratic principles and the rule of law. In this perspective, the nation stands as a community of equals, bonded by mutual respect and a collective dedication to the greater good.\n\nEmbracing Civic Nationalism means recognizing that diversity of origin enriches the nation rather than threatens it, provided all citizens commit to the same civic ideals. Patriotism, in this framework, is manifested through active engagement in political life, the protection of individual freedoms, and unwavering respect for the law. By rejecting exclusion based on ancestry, Civic Nationalism underscores that unity arises from the active participation and consent of the people. In striving for this vision, Civic Nationalism aims to forge a stable, democratic society where identity is shaped by shared citizenship and common goals, transcending bloodlines and birthrights."
 nationalist_ideology: "国粋主義"
 nationalist_ideology_desc: "Nationalism is a political ideology which emphasizes the interests of ones own nation. This is generally in the context of defending one's national identity and historic territory. Nationalism is an extremely diverse collection of many different ideologies, though what is common amongst most forms is the protection and betterment of the citizens of a nation and their advancement at the expense of other nation's interests. This is more often than not, a response to threatening outside factors, which the people of the nation state view as hurting their own interests."
 nationalist_populism: "Nationalist Populism"
 nationalist_populism_desc: "£Ideology_Nationalist_Populism_pic\n\n\n\n\n\n\n\n\n"
 papua_nationalism: "Papua Nationalism"
 papua_nationalism_desc: "£Ideology_Papua_Nationalism_pic\n\n\n\n\n\n\n\n\n"
 pan_africanism: "汎アフリカ主義"
 pan_africanism_desc: "Pan-Africanism is a worldwide movement that aims to encourage and strengthen bonds of solidarity between all people of African descent. Based on a common fate going back to the Atlantic slave trade, the movement extends beyond continental Africans, with a substantial support base among the African diaspora in the Caribbean, Latin America and the United States."
 pan_arabism: "ナセル主義"
 pan_arabism_desc: "Nasserism is a revolutionary ideology, inspired by the second Egyptian President, Gamal Abdel Nasser; espousing the unification of what is referred to as the Arab world. It asserts that the Arab people constitute a single nation or federation, based upon a shared language and culture, transcending Islam and Christianity. Advocates of Nasserism have often been described representing political and economic positions which are secular, socialist, nationalistic, socially progressive, and anti-imperialist."
 pioneer_corporatism: "Pioneer Corporatism"
 pioneer_corporatism_desc: "£Ideology_Pioneer_Corporatism_pic\n\n\n\n\n\n\n\n\nCome all you sons of Queensland soil..."
 provisional_government: "Provisional Government"
 provisional_government_desc: ""
 revisionist_zionism: "修正シオニズム"
 revisionist_zionism_desc: "Formed as a nationalist opposition and acts as the basis of the Israeli right, Revisionist Zionism envisions territorial integrity over the historical Land of Israel and supports Jewish nationalism. Revisionist Zionists believed that Jews have sovereignty over both banks of the Jordan river and its followers question the legitimacy of the Kingdom of Jordan. Currently, Revisionist Zionism is regarded as a fringe ideology but its proponents have recently began a push to make the ideology more moderate and hence more electable."
 Three_principles_of_people_chiangist: "Tridemism (Chiangism)"
 Three_principles_of_people_chiangist_desc: "£Ideology_Tridemism_pic\n\n\n\n\n\n\n\n\nChiang Kai-Shek, in alignment with the original ideals of Sun Yat-Sen, seeks to uphold the Three Principles of the People and honor the legacy of the founding father. Though Sun leaned towards a reformist mindset, Chiang's stance veers towards conservatism, prioritizing the preservation of Chinese culture and heritage. He views democracy not solely as a pursuit of individual liberty, but also as a means to enforce disciplined governance, in contrast to Western individualist democracy. Economically, Chiang envisions a mixed system, wherein governmental central planning coexists with partial privatization of select industries. This approach allows for a blend of nationalization and privatization, often described as \"Party-State Capitalism\" by critics. Moreover, Chiang prioritizes the eradication of communism in his foreign policy agenda, while also safeguarding the Republic of China's autonomy to thwart any potential efforts by the United States to subjugate the nation."
 Three_principles_of_people_nationalist: "Kuomintang (Minzu Faction)"
 Three_principles_of_people_nationalist_desc: "The right wing of the Kuomintang consists of members advocating for the Minzu principle, which traces back to Sun Yat-sens philosophy during the Tongmenghui. The concept can be understood as Civic Nationalism and thus focuses on uniting the different Chinese ethnic groups in the face of imperialist aggression. While opposed to social and constitutional reforms, the right wing is advocating for financial reforms to strengthen the industrial capacities of the country."
 ultra_afrikanernasionalisme: "Ultra-Afrikanernasionalisme"
 ultra_afrikanernasionalisme_desc: "£Ideology_Ultra_Afrikanernasionalisme_pic\n\n\n\n\n\n\n\n\n"
