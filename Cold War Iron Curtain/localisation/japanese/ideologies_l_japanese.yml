 liberal_conservatives: "自由保守主義"
 liberal_conservatives_desc: "Liberal conservatism combines conservative policies with liberal stances, especially on economic, social and ethical issues. It incorporates the classical liberal view of minimal government intervention in the economy, according to which individuals should be free to participate in the market and generate wealth without government interference. However, individuals cannot be thoroughly depended on to act responsibly in other spheres of life, therefore liberal conservatives believe that a strong state is necessary to ensure law and order and social institutions are needed to nurture a sense of duty and responsibility to the nation. They also support civil liberties, along with some social conservative positions."
 liberal_kemalism: "Liberal Kemalism"
 liberal_kemalism_desc: "£Ideology_Liberal_Kemalism_pic\n\n\n\n\n\n\n\n\nWhile mainstream Kemalism typically emphasized a strong role for the state in governance, focusing on secularism, nationalism, and state-led modernization. In contrast, Liberal Kemalism seeks to reinterpret these principles in a way that supports greater individual freedoms, pluralist democracy, and a more open market economy.\n\nThis perspective has emerged among intellectuals, politicians, and reform-minded bureaucrats who argue that the republican and secular foundations of Turkey can be best preserved not through authoritarian centralism, but by strengthening democratic institutions and expanding civil liberties. They contend that the core values of Kemalism—such as laicism, national sovereignty, and modernization—are compatible with universal human rights, freedom of expression, and multiparty competition, all without necessitating the state’s heavy-handed oversight."
