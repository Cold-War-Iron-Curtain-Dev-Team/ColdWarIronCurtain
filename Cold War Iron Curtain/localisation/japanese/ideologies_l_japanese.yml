 centrism: "中道主義"
 centrism_desc: "£Ideology_Centrism_pic\n\n\n\n\n\n\n\n\nCentrism is a political ideology that seeks to find a middle ground between the extremes of the political spectrum. This perspective emphasizes the importance of balancing social equality—which aims to provide fair treatment and opportunities for all individuals—with a recognition of social hierarchy, which acknowledges that certain structures and roles may naturally exist within society. Centrists typically advocate for policies that promote incremental change and pragmatism, rather than radical reforms that could lead to a substantial shift toward either leftist or rightist ideologies. By supporting a measured approach to governance and policy-making, centrism aims to foster stability and inclusivity, allowing for diverse viewpoints while avoiding polarization."
