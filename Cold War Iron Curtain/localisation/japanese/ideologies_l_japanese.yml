 monarchism_acceptance: "君主主義政権との外交を容認"
 absolute_monarchy: "Absolute Monarchy"
 absolute_monarchy_desc: "Absolute monarchy is a form of government where a single ruler, typically a king or queen, holds all the power and authority over the state, with their decisions unbound by laws or a constitution. This system often emphasizes the divine right of kings, asserting that monarchs are chosen by God and thus accountable only to Him. This leads to the centralization of power and the diminishment of noble influence."
 islamic_monarchy: "イスラム君主主義"
 islamic_monarchy_desc: "£Ideology_Islamic_Monarchism_pic\n\n\n\n\n\n\n\n\nIslamic monarchies are a distinct form of Islamic governance where power is vested in a hereditary ruler, often legitimized by both tradition and religious authority. Throughout history, these monarchies have taken on various titles—Mamlakah (kingdom), Caliphate, Sultanate, and Emirate—each reflecting different degrees of religious, political, and military authority within the Islamic world.\n\nFar from being monolithic, Islamic monarchies have varied widely in structure and style. Some, like the Caliphates, claimed both temporal and spiritual leadership over the Muslim ummah, while others, such as Sultanates and Emirates, ruled more regionally, balancing dynastic rule with religious legitimacy. These monarchies were often grounded in Islamic principles of justice (‘adl), consultation (shura), and stewardship (amanah), while also drawing from deep-rooted tribal and dynastic traditions. In the modern era, Islamic monarchies continue to exist, adapting to contemporary politics while maintaining their legitimacy through both ancestral authority and adherence to Islamic values."
 monarchist: "君主主義"
 monarchist_desc: "£Ideology_Monarchism_pic\n\n\n\n\n\n\n\n\nMonarchism is the belief in a political system where sovereignty is embodied in a single ruler—a monarch. This ruler may reign by hereditary right, divine sanction, or long-established tradition. It is not simply a preference for kings and crowns; rather, it is the conviction that continuity, order, and legitimacy are best preserved when leadership is passed down through a singular, time-honored lineage. In monarchist thought, the throne represents not just the authority of one person, but the weight of centuries—encompassing history, culture, and duty forged into a living institution.\n\nWhile republics often pride themselves on the voice of the people, monarchists argue that stability is found not in popularity, but in permanence. A monarch stands above parties, factions, and the transient moods of the populace, symbolizing unity in times of political division. Monarchism does not reject change; instead, it seeks to anchor change in tradition. Whether constitutional or absolute, monarchs are viewed by their supporters as custodians of identity, religion, and moral order."
 negusa_nagast: "ネグサ・ナガスト"
 negusa_nagast_desc: "Negusa Nagast, or king of kings, is a type of selective hereditary imperial monarchy that became the prevalent leadership of Ethiopia since Negus Zemene Mesafint ended the Age of Princes period where Ethiopia was fractured between small principalities, kindoms, and sultanates."
 vatican: "Papacy"
 vatican_desc: "The politics of Vatican City take place in a framework of an theocratic absolute elective monarchy, in which the Pope, religiously speaking, the leader of the Roman Catholic Church and Bishop of Rome, exercises ex officio supreme legislative, executive, and judicial power over the Vatican City, a rare case of non-hereditary monarchy."
 regency: "Regency"
 regency_desc: "£Ideology_Regency_pic\n\n\n\n\n\n\n\n\nA regency is a temporary form of governance in which a regent exercises the powers and duties of a monarch who is unable to rule due to specific circumstances—most commonly minority (being too young to rule), physical or mental incapacity, or extended absence. While the regent acts with royal authority, they do so as a caretaker and not as a sovereign in their own right.\n\nRegencies have occurred throughout history in monarchies around the world, often during times of transition or crisis. The structure and limits of a regency are usually defined by law or custom, and can involve a single regent or a council of regents. Despite holding great power, a regent’s legitimacy is always tied to the authority of the monarch they serve in place of, and their rule is expected to end once the monarch is able to resume the throne."
 fascism: "Fascism"
 fascism_desc: "全体主義"
 fascism_drift: "日毎のファシズムへの支援"
 fascism_drift_1: "Fascist Influence I"
 fascism_drift_2: "Fascist Influence II"
 fascism_drift_3: "Fascist Influ III"
 fascism_drift_4: "Fascist Influence IV"
 fascism_drift_5: "Fascist Influence V"
 fascism_noun: "Fascism"
