 un_mandate: "United Nations Mandate"
 un_mandate_desc: "£Ideology_UN_Mandate_pic\n\n\n\n\n\n\n\n\nUN Mandates refer to a system of international governance in which certain territories, deemed not yet capable of full self-government, are placed under the temporary administration of a member state acting as a trustee. Emerging from the ideals of collective responsibility and decolonization, this system reflects a belief that global stability depends on guiding former colonies and conflict-torn regions toward independence through structured oversight and development.\n\nRooted in the earlier League of Nations Mandate system, but redefined under the United Nations Trusteeship System, UN Mandates are grounded in the principle that sovereignty is a goal to be achieved, not imposed. Administering powers are tasked not with domination, but with fostering political maturity, economic development, education, and human rights, all under the watch of the Trusteeship Council. Unlike colonialism, which sought to extract and control, UN Mandates are framed as a moral obligation to prepare peoples for self-rule."
 islamic_nationalism_conservative: "Islamic Nationalism"
 islamic_nationalism_conservative_desc: "£Ideology_Islamic_Nationalism_pic\n\n\n\n\n\n\n\n\nThe Prophet Muhammad boldly stated:\n\n§Y\"Whoever fights under a banner of foolishness, supports tribalism, or becomes angry for the sake of tribalism will die in a state of ignorance.\"§!\n\nIslam demands allegiance to faith, justice, and the brotherhood of believers, not to nation-states.\n\nAnd yet, Islamism has seized the nationalistic imagination in the post-colonial Islamic world. Many of those who achieved independence as a result of the long foreign domination have tried to fashion their Islamic identities within a national framework. This fusion places Islam as the soul that is molded into the contraption of nationalism. Balancing an act between the abstract universalism of the ummah and the real situation of statehood."
 islamic_nationalism: "Islamic Nationalism"
 islamic_nationalism_desc: "£Ideology_Islamic_Nationalism_pic\n\n\n\n\n\n\n\n\nThe Prophet Muhammad boldly stated:\n\n§Y\"Whoever fights under a banner of foolishness, supports tribalism, or becomes angry for the sake of tribalism will die in a state of ignorance.\"§!\n\nIslam demands allegiance to faith, justice, and the brotherhood of believers, not to nation-states.\n\nAnd yet, Islamism has seized the nationalistic imagination in the post-colonial Islamic world. Many of those who achieved independence as a result of the long foreign domination have tried to fashion their Islamic identities within a national framework. This fusion places Islam as the soul that is molded into the contraption of nationalism. Balancing an act between the abstract universalism of the ummah and the real situation of statehood."
 fujimorism: "Fujimorism"
 fujimorism_desc: "Fujimorism refers to the political ideology of Peru’s Alberto Fujimori (1990–2000) and his daughter Keiko, blending authoritarian populism, neoliberal economics, and anti-establishment rhetoric. Fujimori centralized power via a 1992 self-coup, crushed the Shining Path insurgency with brutal tactics, and implemented shock-therapy market reforms that stabilized Peru’s economy but worsened inequality. His rule relied on clientelism, corruption, and a \"savior\" narrative, leaving a polarizing legacy credited with ending hyperinflation and terrorism but convicted for human rights abuses and embezzlement. Fujimorism remains influential through Keiko’s political campaigns, sustaining a divide between supporters praising its pragmatism and critics condemning its authoritarianism."
 hutu_supremacy: "Hutu Supremacy"
 hutu_supremacy_desc: "Hutu supremacy is an ethnic nationalist ideology that asserts the dominance of the Hutu ethnic group over other groups in Rwanda and Burundi, particularly the Tutsi and, to a lesser extent, the Twa. It emerged as a reaction to colonial-era policies that favored the Tutsi minority under Belgian rule, creating deep-seated resentment among the Hutu majority. The ideology promotes the belief that Hutus, as the majority population, should hold exclusive political, economic, and social power, reversing historical Tutsi dominance. Central to Hutu supremacy is virulent anti-Tutsi rhetoric, which historically portrayed Tutsis as foreign oppressors, invaders, or even subhuman, often using propaganda to dehumanize them and justify exclusion, discrimination, or violence. Politically, the ideology was institutionalized in post-colonial Rwanda through movements like the Parmehutu party and later the Hutu Power extremists, who enforced policies such as ethnic quotas and systemic marginalization of Tutsis. Economically, it sought to dismantle Tutsi wealth and land ownership, redistributing resources to Hutus under the guise of social justice. At its most extreme, Hutu supremacy fueled mass violence, including the 1959 Hutu Revolution, periodic pogroms, and ultimately the 1994 Rwandan genocide, where Hutu Power leaders incited the extermination of Tutsis and moderate Hutus. The ideology relied on fear-mongering, historical revisionism, and the myth of a Hutu struggle for liberation, portraying Tutsis as an eternal threat that needed to be eliminated for Hutu survival. While its most violent manifestations were crushed after the Rwandan Patriotic Front's victory in 1994, remnants of Hutu supremacist thought persist among some exiled extremist groups and diaspora factions, though it is widely condemned as a genocidal ideology in modern Rwanda."
 right_wing_peronism: "Right-Peronism"
 right_wing_peronism_desc: "£Ideology_Peronism_pic\n\n\n\n\n\n\n\n\nOrthodox Peronism under Isabel Perón, Raúl Lastiri, and José López Rega combines Third Positionist rhetoric with authoritarian neoliberalism. While maintaining anti-communist and anti-liberal posturing, the government violently represses leftist opposition through the AAA death squads while imposing neoliberal austerity measures like the Rodrigazo shock program—slashing wages, cutting subsidies, and opening the economy to foreign capital. Despite Peronism's traditional syndicalist foundations, it actively weakens unions and dismantles worker protections. This reactionary transformation turns justicialismo into a contradictory mix of state terror and economic liberalization, betraying Perón's original vision while paving the way for Argentina's later neoliberal era. The regime's brutal repression of the Left mirrors its rightward economic shift, exposing Orthodox Peronism as an unstable fusion of fascistic violence and capitalist restructuring."