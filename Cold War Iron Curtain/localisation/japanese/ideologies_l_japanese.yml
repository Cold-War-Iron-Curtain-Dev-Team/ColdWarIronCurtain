 Three_principles_of_people_socdem: "Kuomintang (Minsheng Faction)"
 Three_principles_of_people_socdem_desc: "The left wing of the Kuomintang consists of members advocating for the Minsheng principle, which traces back to Sun Yat-sens philosophy during the Tongmenghui. The concept can be understood as social welfare and thus focuses on improving the life of the common people. The Inspiration of this principle was influenced by American thinker Henry George and his theory of Georgism. The area of said livelihood is divided into 4 areas (food, clothing, housing and transportation) and the reforms and policies of the Left Kuomintang are centered around those areas, while they also advocate for Chinese Nationalism and Anti-Imperalism."
