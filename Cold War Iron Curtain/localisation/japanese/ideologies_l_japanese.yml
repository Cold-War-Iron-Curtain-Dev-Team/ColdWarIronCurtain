 honryu_conservativism: "Honryu Conservative"
 honryu_conservativism_desc: "£Ideology_Honryu_Conservativism_pic\n\n\n\n\n\n\n\n\nHonryū Conservatism (Mainstream Conservatism) represents a prominent ideological stance within Japanese politics, with its foundations shaped by the principles of ex-bureaucrats. The early Honryū Conservative politicians predominantly comprised former pre-war public officials who ascended through bureaucratic ranks and transitioned into politics to to fill the void during the US Occupation. Distinguished from the more assertive Boryū Conservatism, Honryū Conservatism is characterised by its moderate approach and a belief that bureaucrats are qualified enough to run the country. It advocates preserving Japan's disarmed status, prioritising economic stability, and fostering social security expansion within the framework of the Japan-U.S. Security Treaty."
 liberal_agrarianism: "Liberal Agrarianism"
