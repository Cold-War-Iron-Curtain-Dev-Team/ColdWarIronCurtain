 new_deal_democrat: "New Deal Democrat"
 new_deal_democrat_desc: "£Ideology_New_Deal_Democrat_pic\n\n\n\n\n\n\n\n\nNew Deal Democrats represent a broad political alignment within the Democratic Party that emerged in response to the economic crisis of the Great Depression and endured through the mid-20th century. Rooted in the sweeping reforms introduced under President Franklin D. Roosevelt, this coalition prioritized government intervention in the economy, social welfare programs, and expanded labor rights, aiming to stabilize capitalism while softening its harshest effects on working Americans.\n\nThis political current united a diverse range of groups: industrial laborers in northern cities, farmers, African Americans in urban centers, progressive intellectuals, and segments of the Southern electorate. What bound them together was a shared belief that government had a legitimate role in protecting citizens from economic hardship and ensuring a basic standard of living. Public works, social security, job creation programs, and financial regulation became the hallmarks of this political philosophy.\n\nNew Deal Democrats supported an active federal government not as a tool for centralized power, but as a means of restoring balance in an economy many believed had become skewed in favor of concentrated capital. The emphasis was on economic security, employment stability, and the belief that prosperity should be more broadly shared—without overturning the underlying capitalist system."
