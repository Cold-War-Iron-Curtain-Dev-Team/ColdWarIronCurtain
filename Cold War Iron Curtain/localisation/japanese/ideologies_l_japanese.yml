 authoritarian_democracy: "Authoritarian Democracy"
 authoritarian_democracy_desc: "£Ideology_Authoritarian_Democracy_pic\n\n\n\n\n\n\n\n\nAuthoritarian Democracy presents a paradox wrapped in principle: the people may choose, but they do not rule. It is a system that retains the rituals of representation—elections, assemblies, constitutions—while concentrating real authority in the hands of a disciplined executive or centralized leadership. The state does not silence the public; it speaks on its behalf, often in its stead.\n\nIn this system, the leader does not simply reflect the people’s will—he interprets and enforces it, sometimes against their momentary passions, in the name of their enduring good. Where liberal democracy thrives on dissent and division, authoritarian democracy seeks unity, continuity, and direction.\n\nCarl Schmitt, the German jurist, argued that “Democracy does not necessarily mean liberalism. Nor does it mean a pluralism of parties.” In his view, democracy could be fully compatible with strong, centralized authority—so long as it claimed its legitimacy from the nation as a whole.\n\nUnder authoritarian democracy, representation exists not to disperse power, but to validate it. Institutions are preserved, but their independence is narrowed. Dissent is not criminalized outright, but it is managed, restrained, or channeled. The press may operate, but always under the shadow of the national interest."
 buddhist_theocracy: "Buddhist Theocracy"
 buddhist_theocracy_desc: ""
 colonial_regime: "植民地主義"
 colonial_regime_desc: "£Ideology_Colonial_Regime_pic\n\n\n\n\n\n\n\n\nA Colonial Government is a system of administration where a ruling European power, exercises control over a territory or people through direct or indirect rule. Whether the colonizer establishes a bureaucratic administration, or relies on existing local power structures, the colonial power is appointed a Governor to oversee the colony. This is often accompanied by economic stabilisation or exploitation, cultural imposition or complete removal of any former representation.\nMany colonies with the early years of the Cold War are in the process of decolonisation, where newly independent nations will arise through either peaceful transition or violent conflict. Nationalist struggles and anti-colonial sentiment are guaranteed to arise as a result, as the United Nations have consistently passed through resolutions calling for immediate independence of colonial territories."
 colonial_regime_asia: "Colonial Government"
 colonial_regime_asia_desc: "£Ideology_Colonial_Regime_Asia_pic\n\n\n\n\n\n\n\n\nA Colonial Government is a system of administration where a ruling European power, exercises control over a territory or people through direct or indirect rule. Whether the colonizer establishes a bureaucratic administration, or relies on existing local power structures, the colonial power is appointed a Governor to oversee the colony. This is often accompanied by economic stabilisation or exploitation, cultural imposition or complete removal of any former representation.\nMany colonies with the early years of the Cold War are in the process of decolonisation, where newly independent nations will arise through either peaceful transition or violent conflict. Nationalist struggles and anti-colonial sentiment are guaranteed to arise as a result, as the United Nations have consistently passed through resolutions calling for immediate independence of colonial territories."
 colonial_regime_middle_east: "Colonial Government"
 colonial_regime_middle_east_desc: "£Ideology_Colonial_Regime_Middle_East_pic\n\n\n\n\n\n\n\n\nA Colonial Government is a system of administration where a ruling European power, exercises control over a territory or people through direct or indirect rule. Whether the colonizer establishes a bureaucratic administration, or relies on existing local power structures, the colonial power is appointed a Governor to oversee the colony. This is often accompanied by economic stabilisation or exploitation, cultural imposition or complete removal of any former representation.\nMany colonies with the early years of the Cold War are in the process of decolonisation, where newly independent nations will arise through either peaceful transition or violent conflict. Nationalist struggles and anti-colonial sentiment are guaranteed to arise as a result, as the United Nations have consistently passed through resolutions calling for immediate independence of colonial territories."
 despotism: "専制主義"
 despotism_desc: "Despotism is a form of authoritarian rule where absolute power is held by a single ruler—often referred to as a despot—who governs without legal or constitutional constraints. In a despotic state, the ruler exercises unchecked authority over laws, institutions, and the lives of citizens, often relying on fear, coercion, and repression to maintain control.\n\nUnlike monarchies bound by tradition or constitutions, or dictatorships that may claim ideological or popular legitimacy, despotism is marked by the personal will of the ruler being the highest law. The despot's commands override institutions, and opposition is typically silenced through surveillance, censorship, imprisonment, or violence. The rule of law is weak or nonexistent, and the state exists primarily to serve the will of the despot."
 directorial_regime: "Directorial Republic"
 directorial_regime_desc: "£Ideology_Directorial_Republic_pic\n\n\n\n\n\n\n\n\nOne of the most prominent and enduring examples of a directorial regime is the Swiss Confederation. Switzerland’s federal executive, the Federal Council, consists of seven members who jointly serve as the country’s collective head of state and government. Each member heads a federal department, and decisions are made through consensus or majority vote within the council. The presidency of the council rotates annually among its members, but the president holds no additional power, serving more as a primus inter pares (first among equals).\n\nThis system reflects the Swiss commitment to neutrality, collegiality, and federalism. It ensures continuity, reduces the risk of authoritarianism, and fosters a political culture based on compromise and stability. The Swiss directorial model stands in contrast to more hierarchical systems and remains one of the few functioning examples of true collective executive leadership in the modern world."
 dominant_party_democracy: "£Ideology_Dominant_Party_Democracy_pic\n\n\n\n\n\n\n\n\nDominant party democracy is an odd-characteristic democracy found in many dictatorships, authoritarian and reactionary regimes. This style of governance usually reduces popular discontent and diplomatic conflict by placing political parties, one of the main elements of democracy, in the most basic form of self-government, to make democracy seem to be in operation on the surface.\nThis approach can all be attributed to one-party, one-party dictatorship, and there are still many regimes that follow it in the 21st century. Also, because it basically follows the elements of democracy, there may be control opposition parties, civic groups, or even functioning opposition parties or political opponents, unlike other forms of dictatorship."
 haredi: "Haredu"
 haredi_desc: ""
 independent: "独立派"
 independent_desc: "An independent politician is an individual politician not affiliated with any political party."
 interim_government: "Interim Government"
 interim_government_desc: "£Ideology_Interim_Government_pic\n\n\n\n\n\n\n\n\nAn interim government is a temporary governing body established to oversee a country during a transitional period, which typically occurs after the collapse of a previous regime, during political upheaval, or between administrations. Its primary purpose is to maintain basic governmental functions, ensure stability, and prepare for the establishment of a permanent government, often through elections, constitutional reforms, or peace negotiations.\n\nUnlike regular administrations, interim governments usually operate under limited mandates. They are expected to act with neutrality and restraint, focusing on facilitating a smooth transition rather than pursuing long-term policy agendas. These governments may be formed through negotiations among political factions, military intervention, or international mediation, depending on the specific context of the crisis or transition."
 keynesian_paternalism: "Keynesian Paternalism"
 keynesian_paternalism_desc: "£Ideology_Keynesian_Paternalism_pic\n\n\n\n\n\n\n\n\n"
 military_junta: "軍事独裁制"
 military_junta_desc: "A military dictatorship is a form of government wherein a military force exerts complete or substantial control over political authority."
 oligarchism: "寡頭政治"
 oligarchism_desc: "Oligarchic is a form of government in which power is concentrated in the hands of a small and often elite group of individuals, families, or organizations. These ruling elites—whether based on wealth, military influence, political connections, or social status—exercise significant control over state decisions, institutions, and resources, often to serve their own interests rather than those of the broader population.\n\nUnlike democracies, where power is distributed through elections and popular participation, or monarchies, where rule is hereditary, an oligarchy operates through a tight circle of influence that may function behind formal state structures. In many cases, this elite may dominate key sectors such as the economy, security forces, and media, ensuring that true authority rests with them regardless of any outward appearances of democratic governance."
 reactionary: "反動主義"
 reactionary_desc: "In political science, a reactionary is a person who holds political views that favor a return to the status quo ante, the previous political state of society, which he or she believes possessed characteristics that are negatively absent from the contemporary status quo of a society."
 stratocracy: "Stratocracy"
 stratocracy_desc: "£Ideology_Stratocracy_pic\n\n\n\n\n\n\n\n\nStratocracy is a system of government in which the military directly rules the state, with political authority resting in the armed forces rather than in civilian institutions. Unlike military dictatorships, which may result from temporary coups, a stratocracy is institutionalized—the military isn't just the power behind the throne; it is the throne. In this type of government, political leadership and military command often overlap, and state policy is primarily shaped by strategic and security considerations.\n\nHistorically, stratocracies have developed in societies where military service is both a civic duty and the main path to political power. Ancient Sparta, where citizens served as lifelong soldiers, serves as a prime example of this model.\n\nProponents of stratocratic governance argue that it offers discipline, unity, and decisive leadership, especially in times of instability. Critics, however, warn that it can lead to the erosion of civil liberties, the suppression of dissent, and the subordination of civilian life to perpetual militarism."
 ultra_protectionism: "Ultra-Protectionism"
 ultra_protectionism_desc: "£Ideology_Ultra_Protectionism_pic\n\n\n\n\n\n\n\n\n"
