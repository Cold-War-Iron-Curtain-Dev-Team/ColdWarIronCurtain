l_japanese:
 infrastructure:0 "都市インフラ"
 infrastructure_plural:0 "都市インフラ"
 infrastructure_desc:0 "都市や都市産業の支援をする。\n州の§Y工業団地出力§!：§G+7%§!\n州の§Y建設速度§!：§G+7%§!\n§G最大レベルまで上げるには、都市インフラ技術を研究する必要がある！§!"
 arms_factory:0 "軍需工場"
 arms_factory_plural:0 "軍需工場"
 arms_factory_desc:0 "新しい軍装品生産のための工業力を供給する。必要であれば、民需工場へと転換できる。"
 dockyard:0 "海軍造船所"
 dockyard_plural:0 "海軍造船所"
 dockyard_desc:0 "§R-2§! £resources_strip|7 のコストがかかる。新しい艦船建造のための工業力を供給する。"
 industrial_complex:0 "工業団地"
 industrial_complex_plural:0 "工業団地"
 industrial_complex_desc:0 "§R-1§! £resources_strip|7 、 §R-1§!£resources_strip|5 、そして§R-1§! £resources_strip|1 のコストがかかる。民生品生産や新しい建物の建設のための工業力を供給する。必要であれば、軍需工場へと転換できる。"
 air_base:0 "航空基地"
 air_base_plural:0 "航空基地"
 air_base_desc:0 "州に空軍を配属することができる。"
 naval_base:0 "海軍基地"
 naval_base_plural:0 "海軍基地"
 naval_base_desc:1 "艦隊の行動範囲を拡大し、修理を行う。海外との資源輸出入を可能にする。レベルが高いほど供給量も増加する。"
 bunker:0 "陸上要塞"
 bunker_plural:0 "陸上要塞"
 bunker_desc:0 "戦闘時に要塞レベル1につき$VALUE|+%0$の攻撃ペナルティを攻撃側に与える。複数方向から攻撃することで、要塞効果は減少する。"
 coastal_bunker:0 "沿岸要塞"
 coastal_bunker_plural:0 "沿岸要塞"
 coastal_bunker_desc:0 "強襲上陸戦闘時に要塞レベル1につき$VALUE|+%0$の攻撃ペナルティを攻撃側に与える。"
 anti_air_building:0 "対空砲"
 anti_air_building_plural:0 "対空砲"
 anti_air_building_desc:0 "州を敵爆撃機から防御し、攻撃してきた航空機を迎撃する。"
 synthetic_refinery:0 "合成精製所"
 synthetic_refinery_plural:0 "合成精製所"
 nuclear_bunker:0 "民間防衛シェルター"
 nuclear_bunker_plural:0 "民間防衛シェルター"
 nuclear_bunker_desc:0 "死の灰や災害から現地住民を守る"
 synthetic_refinery_desc:0 "州に右記を供給する:"
