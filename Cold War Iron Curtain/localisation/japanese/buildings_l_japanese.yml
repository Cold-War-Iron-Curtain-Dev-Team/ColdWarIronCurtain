 synthetic_refinery_resource:0 "£resources_strip|$FRAME$"
 radar_station:0 "レーダー基地"
 radar_station_plural:0 "レーダー基地"
 radar_station_desc:3 "周辺の州にいる敵部隊の情報入手を可能にする。\n州のレーダーレベルが高いほど、レーダーの有効範囲が広くなる。\nまた、敵空軍を捕捉しやすくし、自軍航空機が空戦に入る確率を高くする。\n更に海上の敵艦隊の発見率も向上させる。"
 rocket_site:0 "ロケット発射場"
 rocket_site_plural:0 "ロケット発射場"
 rocket_site_desc:0 "州に生産したロケットを配備することができる。"
 nuclear_reactor:0 "原子炉"
 nuclear_reactor_plural:0 "原子炉"
 nuclear_reactor_desc:0 "核兵器に使用される高濃縮ウランが生産される。"
 nuclear_facility:0 "核研究施設"
 nuclear_facility_plural:0 "核研究施設"
 nuclear_facility_desc:0 "核研究の実験施設では原子力利用に関する研究計画を開始することができる。"
 air_facility:0 "航空力学・航空電子工学研究施設"
 air_facility_plural:0 "航空力学・航空電子工学研究施設"
 air_facility_desc:0 "航空力学および航空電子工学の実験施設では、航空機、ロケット、関連電子機器の研究計画を開始することができる。"
 naval_facility:0 "海軍技術研究施設"
 naval_facility_plural:0 "海軍技術研究施設"
 naval_facility_desc:0 "海軍技術の実験施設では、水上艦や潜水艦に関する研究計画を開始することができる。\n海軍技術施設は沿岸の地域にしか創設できない。"
 mega_gun_emplacement:0 "多薬室大口径砲"
 mega_gun_emplacement_plural:0 "多薬室口径砲"
 mega_gun_emplacement_desc:0 "多段式推進の原理で作動するこの大口径砲は、砲撃において比類のない射程距離を達成するように設計されている。連続した複数の地下トンネルを利用し、砲弾を超音速まで加速してから遠くの目標に向けて発射する。"
 stronghold_network:0 "拠点ネットワーク"
 stronghold_network_plural:0 "拠点ネットワーク"
 stronghold_network_desc:0 "広範囲にわたる防御システム。敵の進軍を阻止し、戦略上重要な地域を確保するために設計された、巨大なバンカーと強固な要塞。"
 land_facility:0 "陸戦研究施設"
 land_facility_plural:0 "陸戦研究施設"
 land_facility_desc:0 "陸戦の実験施設では特殊戦車や火砲など、陸戦の様々な側面に関する研究計画を開始することができる。"
