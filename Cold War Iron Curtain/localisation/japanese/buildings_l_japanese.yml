 national_logistical_supercomputer:0 "NLSN資源需要レポート"
 national_logistical_supercomputer_desc:0 "国家物流スーパーコンピューターネットワークは、国家の資源消費量を報告します。消費されている資源は以下の通りです:§R$VALUE|Y0=$§!"
 petrochemicals_logistic_center:0 "石油供給センター"
 petrochemicals_logistic_center_desc:0 "§Y石油化学製品の消費量と生産量を毎月1回計算します。§!\n石油パイプラインや輸送など、国内の化石燃料の物流システムを管理する。"
 construction_registry_office:0 "建設登記所。"
 construction_registry_office_desc:0 "§Y建設用金属の消費量と生産量を毎月1回計算します。§!\n建設登記所では、国の用途地域と建設規制を整理し、産業労働法、建設業検査を管理する。"
 construction_permits_office:0 "建設許可局"
 construction_permits_office_desc:0 "§Y軽金属の消費量と生産量を毎月1回計算します。§!\n建設許可局は、建築許可を承認することと、商業用資産を扱うことを除けば、登記局に似ている。"
 energy_department_supercomputer:0 "エネルギー省のスーパーコンピューター"
 energy_department_supercomputer_desc:0 "§Y電力消費量と電力生産量を毎月1回計算します。§!\nエネルギー省のスーパーコンピューターは、国の電力網を動かし、発電所の保守を確実に行う。"
 nuclear_materiel_supplier:0 "核物質供給会社"
 nuclear_materiel_supplier_desc:0 "§Y核物質消費量、核物質生産量を毎月1回計算する。§!\n核物質供給会社は、核物質を必要とするすべての民間および軍事施設の核物質を管理し、分配する軍運営の組織である。"
 rare_material_broker:0 "レアアース・ブローカー"
 rare_material_broker_desc:0 "§Yレアアースの消費量と生産量を毎月1回計算します。§!\nレアアース・ブローカーとは、国内のレアアースの供給を管理する物流会社、銀行、鉱業関係者のネットワークである。"
 farm_pulse:0 "農産物流通ネットワーク"
 farm_pulse_desc:0 "§Y食料生産量を毎月1回計算します。§!\n農産物流通ネットワークは、すべての食品の生産・加工を管理し、それらを供給する。また、AILは国内の水処理システムの管理も行っている。"
 Food_Need_Pulse:0 "農業関係者ネットワーク"
 Food_Need_Pulse_desc:0 "§Y食品消費量を毎月1回計算します。§!\n農業関係者ネットワークは、国内で食料の販売と流通を管理する農業関係者の分散型システムである。"
