 infrastructure_desc: "都市や都市産業の支援をする。\n州の§Y工業団地出力§!：§G+7%§!\n州の§Y建設速度§!：§G+7%§!\n§G最大レベルまで上げるには、都市インフラ技術を研究する必要がある！§!"
 arms_factory: "軍需工場"
 arms_factory_plural: "軍需工場"
 arms_factory_desc: "新しい軍装品生産のための工業力を供給する。必要であれば、民需工場へと転換できる。"
 dockyard: "海軍造船所"
 dockyard_plural: "海軍造船所"
 dockyard_desc: "§R-2§! £resources_strip|7 のコストがかかる。新しい艦船建造のための工業力を供給する。"
 industrial_complex: "工業団地"
 industrial_complex_plural: "工業団地"
 industrial_complex_desc: "§R-1§! £resources_strip|7 、 §R-1§!£resources_strip|5 、そして§R-1§! £resources_strip|1 のコストがかかる。民生品生産や新しい建物の建設のための工業力を供給する。必要であれば、軍需工場へと転換できる。"
 air_base: "航空基地"
 air_base_plural: "航空基地"
 air_base_desc: "州に空軍を配属することができる。"
 naval_base: "海軍基地"
 naval_base_plural: "海軍基地"
 naval_base_desc:1 "艦隊の行動範囲を拡大し、修理を行う。海外との資源輸出入を可能にする。レベルが高いほど供給量も増加する。"
 bunker: "陸上要塞"
