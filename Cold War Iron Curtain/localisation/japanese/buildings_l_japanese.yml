 agri_industrial_complex_plural: "農産業複合体"
 fuel_silo_plural: "燃料貯蔵庫"
 fossil_fuel_powerplant_desc: "この安価な発電所は発電に§R-1§! £resources_strip|1 の燃料を必要とする"
 renewable_powerplant_desc: "この高価な発電所は発電に資源を消費しない"
 nuclear_powerplant_desc: "この発電所は発電に§R-1§! £resources_strip|6 を消費する"
 fusion_powerplant_desc: "この非常に高価な発電所は、膨大な量の再生可能エネルギーを生産している"
 civilian_air_base_desc: "民間空港は、商業やオフィスパークを活性化させる。オフィスパークが多い州に建設しよう。"
 state_infrastructure_desc: "州のインフラは資源の産出量と州の供給を増やす(統計は毎月更新される)\n§Y資源の産出量§!：§G+7%§!\n§Y供給量§!：§G+50%§!\n§G時々隠された資源が発見できる§!\n§G最大レベルまで上げるには、インフラ技術を研究する必要がある！§!"
 water_infrastructure_desc: "水インフラは、農業生産のためのボーナスを提供します。§Y農産業複合体§!の£resources_strip|3 出力には最低でも1つ必要です。\n§Y水インフラ§!がレベル1を超えるごとに、§Y農産業複合体§!の£resources_strip|3 出力が§G+25%§!されます。"
 agri_industrial_complex_desc: "この建物は国家に食料を提供する。肥沃なバイオームは生産量を増加させる。\n£resources_strip|3 を出力するためには、少なくとも1つの§Y水インフラ§!が必要。\n州の農業バイオームに応じて、以下の基本出力を得る:\n§Y荒涼とした山々§!＝§G0.5§!£resources_strip|3 \n§Y砂漠・ツンドラ§!＝§G1§!£resources_strip|3 \n§Y緑豊かな砂漠・温帯の山々§!＝§G2§!£resources_strip|3 \n§Y寒帯§!＝§G3§!£resources_strip|3 \n§Y温帯§!＝§G4§!£resources_strip|3\n§Y周年§!＝§G6§!£resources_strip|3\n"
 office_park_desc: "§R-1§!£resources_strip|7 、§R-1§!£resources_strip|2 、§R-1§!£resources_strip|1 を使用する。オフィスパークは大量の収入をもたらすが、産業界の生産はない。市民サービスの支払いに適しており、産業だけでは得られない所得を向上させる。"
 fuel_silo_desc: "燃料貯蔵庫のある州では、より多くの§H燃料§!を備蓄できる。"
 steel_factory_desc: "-1£resources_strip|7 と-1£resources_strip|1 を使用し、不純物の多い鉱石を精製する"
 tungsten_factory_desc: "-3£resources_strip|7 と-1£resources_strip|5 を使用し、一般的な鉱石から微量のレアアース・メタルを抽出する。"
