 BUILDING_GROUP_SHARED_NAME_ENTRY: " - $NAME$"
 nuclear_reactor_heavy_water: "Heavy Water Nuclear Reactor"
 nuclear_reactor_heavy_water_plural: "Heavy Water Nuclear Reactors"
 nuclear_reactor_heavy_water_desc: "This building provides the state with production of enriched Uranium for use in Nuclear weapons.\nNuclear reactors using Heavy Water are somewhat cheaper to build than Graphite Reactors, but produce less material that can be used to produce nuclear weapons."
 commercial_nuclear_reactor: "Civilian Nuclear Reactor"
 commercial_nuclear_reactor_plural: "Civilian Nuclear Reactors"
 commercial_nuclear_reactor_desc: "This building provides the state with enriched uranium for nuclear weapons and produces electricity for the civilian economy."
 naval_supply_hub: "Naval Supply Hub"
 naval_supply_hub_desc: "This building allows your fleets to resupply and refuel in this base in addition to their Home Bases, potentially extending the operational range of your §YTask Forces§!.\nA Naval Supply Hub can only be constructed in a coastal province that has Naval Base of at least level 8."
 naval_headquarters: "Naval Headquarters"
 naval_headquarters_desc: "This building allows you to assign an admiral to increase effectivness of §YTask Forces§! operating within range of the Naval Headquarters.\n\nUp to $MAXNUM|H$ headquarters can have an admiral assigned at the same time.\n   Currently assigned: $CURRNUM|H$\n\nA Naval Headquarters can only be constructed in a coastal province that has Naval Base of at least level 8. "
 landmark_statue_of_liberty: "The Statue of Liberty"
 landmark_statue_of_liberty_plural: "$landmark_statue_of_liberty$"
 landmark_statue_of_liberty_desc: "The colossal Statue of Liberty stands proudly in New York Harbor, gifted by France in 1876 to commemorate the alliance between the two nations during the American Revolution, celebrate the centennial of American independence, and honor the shared ideals of liberty and democracy, it has come to embody the American ethos of life, liberty and the pursuit of happiness, and as a status of post-war American hegemony as the Leader of the Free World."
 landmark_big_ben: "Big Ben"
 landmark_big_ben_plural: "$landmark_big_ben$"
 landmark_big_ben_desc: "The Westminster Clock Tower, coloquially referred as the Big Ben, is the most notable of the British cultural icons, alongside the Palace of Westminster, the Westminster Abbey and Tower Bridge. It is one of the most prominent symbols of the United Kingdom and the British Empire as a whole. Completed in 1859 in a Gothic Revival style, it stands as a symbol of national pride and the British cultural identity for the whole world to marvel at."
 landmark_colosseum: "The Colosseum"
 landmark_colosseum_plural: "$landmark_colosseum$"
 landmark_colosseum_desc: "The Colosseum is an elliptical amphitheatre in the centre of the city of Rome, Italy, just east of the Roman Forum. It is the largest ancient amphitheater ever built, completed by Emperor Titus Caesar Vespasianus in 80 AD after his father began the construction, it served as a palace of entertainment for the romans and their predecessors, however was severed damaged by disasters, both natural, like the devastating 1349 earthquake, and man-made, from countless people stealing stone from its foundation. Even so, the Colosseum is still a renowned symbol of Imperial Rome and was listed as one of the New 7 Wonders of the World."
 landmark_cristo_redentor: "Cristo Redentor"
 landmark_cristo_redentor_plural: "$landmark_cristo_redentor$"
 landmark_cristo_redentor_desc: "Christ the Redeemer is an Art Deco statue of Jesus Christ in Rio de Janeiro, Brazil, created by French-Polish sculptor Paul Landowski and built by Brazilian engineer Heitor da Silva Costa, being built between 1922 and 1931, it stands with its open welcome arms, as the most prominent symbol of Brazil and the Catholic faith in the region."
 landmark_tokyo_imperial_palace: "The Imperial Palace"
 landmark_tokyo_imperial_palace_plural: "$landmark_tokyo_imperial_palace$"
 landmark_tokyo_imperial_palace_desc: "The Tokyo Imperial Palace is the main residence of the Emperor. It is a large park-like area located in the Chiyoda district of the Chiyoda ward of Tokyo, and serves as a symbol of pride and reverence for the Japanese people, and as a symbol of tradition, housing the continuous imperial clan even after the defeat in World War II."
 landmark_national_diet: "The National Diet Building"
 landmark_national_diet_plural: "$landmark_national_diet$"
 landmark_national_diet_desc: "The Kokkai-gijidō is the building where both the House of Representatives and the House of Councillors of the National Diet of Japan meet. Being completed in early 1936, it is constructed almost entirely of Japanese materials with only a few exceptions. Its predecessors were destroyed in 1891 and 1925, both by fires, but the current design has survived the fires of war, and stands as a hope for the future of Japanese democracy."
 landmark_hakko_ichiu: "The Hakkō Ichiu Monument"
 landmark_hakko_ichiu_plural: "$landmark_hakko_ichiu$"
 landmark_hakko_ichiu_desc: "The Hakkō Ichiu tower has been constructed in 1939 to commemorate the 2,600th anniversary of the founding of Japan, and as a monument to symbolize the Japanese destiny of unifying the Eight Corners of the World, however after the war the Allied Occupation has pressured the locals to remove the Imperialist inscriptions, but many proposed a reimagination to commemorate peace instead."
 landmark_hofburg_palace: "The Hofburg Palace"
 landmark_hofburg_palace_plural: "$landmark_hofburg_palace$"
 landmark_hofburg_palace_desc: "The Hofburg is the former principal imperial palace of the Habsburg dynasty. Located in the center of Vienna and facing towards the Heldenplatz, it was built in the 13th century by Ottokar II of Bohemia and expanded several times afterwards, being documented as the seat of government since 1279. It also served as the imperial winter residence, as Schönbrunn Palace was the summer residence."
 landmark_sadabad_complex: "The Sa'dabad Complex"
 landmark_sadabad_complex_desc: "The Sa'dabad Complex is an 80 hectare complex in northern Tehran built by the Qajar Shahs in the 19th century and expanded by the Pahlavi dynasty, serving as the official residence of the monarch of Iran."
 landmark_taj_mahal: "The Taj Mahal"
 landmark_taj_mahal_desc: "The Taj Mahal is an ivory-white marble mausoleum on the right bank of the river Yamuna in Agra, Uttar Pradesh, India. It was commissioned in 1631 by the fifth Mughal emperor, Shah Jahan , to house the tomb of his wife. Being remembered by its stunning design and appearance, it stands as a national symbol of Indian union and culture, receiving millions of visitors as one of the most popular tourist attractions in the world, it has become a symbol of India itself."
 landmark_hagia_sophia: "The Hagia Sophia"
 landmark_hagia_sophia_desc: "Built by Byzantine Emperor Justinian I in the 6th century as the house of the ecumenical patriarch of Constantinople, the Hagia Sophia was considered a marvel of engineering and claimed to have changed the history of architeture forever, and remained the spiritual epicenter of the Eastern Orthodox Church until the fall of Constantinople, in which it was converted into a mosque by Ottoman Sultan Mehmed II, and then finally converted into a museum in 1934 by the nascent Republic of Turkey."
 landmark_great_wall_section: "The Great Wall"
 landmark_great_wall_section_plural: "$landmark_great_wall_section$"
 landmark_great_wall_section_desc: "The Great Wall, built over hundreds of years and dozens of administrations to deter the invaders that skirmished against the heart of China, is a logistical masterpiece. Today, it could be said to represent the Chinese people's great courage and defiance in the face of adversity."
 landmark_nanjing_presidential_palace: "The Nanjing Presidential Palace"
 landmark_nanjing_presidential_palace_plural: "$landmark_nanjing_presidential_palace$"
 landmark_nanjing_presidential_palace_desc: "An ancient building, imponent with a equally rich history, passing by many hands, from the Ming princes that built it to the Qing home of the viceroy of the province, even by the leader of the Taiping Rebellion, Hong Xiuquan, who expanded the palace, and finally as the Presidential Palace after the Xinhai Revolution."
 landmark_forbidden_city: "The Forbidden City"
 landmark_forbidden_city_plural: "$landmark_forbidden_city$"
 landmark_forbidden_city_desc: "The Forbidden City was the residence of 24 Ming and Qing dynasty Emperors, and the center of political power in China for over 500 years from 1420 to 1924. Named like this due to its acces being barren to the great majority of commoners and officials, allowing entry only to the Emperor, his family, and a select few court members, symbolizing the Emperor's divine status as the Son of Heaven as a symbol of China's long history of harmony and prosperity, only finally giving an end to 5 centuries of history after the abdication of the last emperor Pu Yi in 1912."
 landmark_prague_castle: "The Prague Castle"
 landmark_prague_castle_desc: "Located on the Western Bank of the Vitava River, the Pražský Hrad is the largest ancient castle complex in the world. Built in 870 AD, it served as the seat of power for the king of Bohemia, the Emperor of the Holy Roman Empire, president of Czechoslovakia, overnight stay of Adolf Hitler, headquarters of Reinhard Heydrich, and as the office of the Communist Party of Czechoslovakia."
 landmark_bojnice_castle: "The Bojnice Castle"
 landmark_bojnice_castle_desc: "The Bojnice Castle isa romance style with gothic foundation and lies right by the Nitra river and above the medieval village of Bojnice in the region of Trenčín in Western Slovakia. It served as the residence of many hungarian kings and noblemen, who named the castle Bajmóci vár, until it was transferred to Czechoslovakia after the treaty of Trianon in 1920, and bought by Jan Antonín Baťa of the Bata Shoe Company. After the war, it became state property according to the Beneš Decrees."