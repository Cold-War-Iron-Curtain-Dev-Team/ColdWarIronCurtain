 idea_PAR_argentine_training:0 "Argentine Military Mission"
 idea_PAR_argentine_training_desc:0 "Argentina has sent military advisors to assist in the modernization and training of Paraguayan forces. Drawing from European-style doctrines, our army is benefiting from improved discipline, infantry coordination, and officer education."
 idea_PAR_membership_restrictions:0 "Army Membership Restrictions"
 idea_PAR_membership_restrictions_desc:0 "Service in the armed forces is now reserved exclusively for loyal party members, ensuring that the military remains a firm pillar of government control. Political officers are embedded within the ranks to maintain ideological discipline, and promotions are granted based on party loyalty rather than battlefield merit. While this guarantees unwavering obedience to the regime, it also limits the pool of skilled recruits and hampers strategic flexibility on the battlefield."
 idea_PAR_central_bank:0 "Banco Central del Paraguay"
 idea_PAR_central_bank_desc:0 "Established by Law 18/52, the Banco Central del Paraguay regulates monetary policy, ensures currency stability, and oversees financial institutions. As the cornerstone of Paraguay’s economy, it plays a key role in managing inflation and reserves, though its policies remain influenced by political and economic realities."
