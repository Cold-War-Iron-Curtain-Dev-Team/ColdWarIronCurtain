 nato_member_desc:0 "\nThe North Atlantic Treaty Organization came into being after the end of World War II and the devastation it wrought to Europe. The organization implements the North Atlantic Treaty which was signed by the United States and its European partners to establish a system of collective defense to ensure future peace and stability in Europe. The alliance is widely viewed as a response to Western concerns over post-war Soviet expansionism. While NATO claims to be defensive in nature, the Soviet Union views the organization as a direct threat to its independence."
