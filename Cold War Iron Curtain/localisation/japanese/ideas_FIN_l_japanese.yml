l_japanese:
 wartsila:0 "バルチラ社"
 wartsila_desc:0 "バルチラ社は、フィンランド最大の造船会社だ。"
 kansainhuolto:0 "フィンランド公共福祉省"
 kansainhuolto_desc:0 "Kansanhuoltoministeriö's (Ministry of People's Service) job is not an easy one. It exists to secure people's livelihood in states of emergency by controlling the economy and rationing. Since its foundation in 1939, rationing has been in effect and affecting products like sugar and coffee. As such, it's no suprise that not many people like them. Consumers complain about the meagre amounts the ration cards give them and producers complain about having too much taken from them."
 paris_paris_treaty_FIN:0 "1947年パリ条約"
 paris_paris_treaty_FIN_desc:0 "State of War ended in 1947 in Finland with the Paris peace treaty and the exit of Allied supervising body, Liittoutuneiden valvontakomissio. The treaty states that the Moscow Armistice is legitimate and affirms the territorial losses of Finland. It also imposes military limits, such as forbidding all missilies, submarines and seamines. It limits the air force to maxium of 60 combat aircraft and no bombers. Lastly the treaty forbids Finland from owning nuclear weapons."
 heroin_epidemic:0 "ヘロインの蔓延"
 heroin_epidemic_desc:0 "1930年代以降、フィンランド人は世界で最も多くのヘロインを使用してきた。両大戦で過剰に使用され、多くの退役軍人が深刻な中毒症状を起こして帰国した。遠くニューヨークの国連本部でも、人口400万人のフィンランドが1940年代後半の1年間に、他の国々が四半世紀で平均的に使用するのと同じ量のヘロインを消費することが可能なのか、と人々は不思議に思ったものである。例えば、1946年には99kgの処方されたヘロインがフィンランドで消費された。政府の過熱的ではない対応は、公衆衛生上の理由から、より多くのヘロインが必要であるという理由だけであった。しかし、態度は変わりつつあり、やがてこの小国を悩ませている「伝染病」に対して何か手を打たなければならなくなるだろう。"
 trade_treaty_FIN:0 "フィンランド通商条約"
 fin_protect_swedish_rights:0 "スウェーデン人の権利を確認"
 fin_protect_swedish_rights_desc:0 "政府は、スウェーデン語圏の人々を支援し、帰属意識を高めるための特別キャンペーンを実施している。"
 fin_valpo:0 "赤いパトロール"
 fin_valpo_desc:0 "我が国の公安調査庁は、クーシネン大統領の就任期間中、共産主義者と社会主義者で占められている。"
 idea_FIN_CIA_Influence:0 "CIA Influence"
 idea_FIN_CIA_Influence_desc:0 "Through some shady deals, the CIA has managed to gain foothold in the country."
 tyollistymisohjelma:0 "Työllistymisohjelma"
 tyollistymisohjelma_desc:0 "Our government is offering low paying labour jobs for the unemplyed."
 consumerism:0 "Increased Consumerism"
 consumerism_desc:0 "The government encourages its citizens to consume more."
 k_program:0 "K-Program"
 k_program_desc:0 "We chose to implement the K-Program."
