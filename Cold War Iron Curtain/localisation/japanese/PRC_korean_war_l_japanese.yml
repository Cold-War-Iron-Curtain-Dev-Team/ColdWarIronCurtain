 korean_war_devastation:0 "朝鮮戦争の荒廃"
 korean_war_devastation_tt:0 "朝鮮半島はこの活動によって極度の物理的破壊に苦しむこととなるだろう。数ヶ月の間は継続的な進軍に必要なインフラが地域に存在しなくなる。"
 Korean_War_Devastation_2_TT:0 "\nアメリカによる大規模爆撃の結果、産業やインフラ、農業用建築物の大部分は修復不可能な損害を受けた。ダムへの爆撃が農地を浸水させ作物収穫が困難になったことと相まって飢饉は目前だ。"
 Firebombing_Devastation:0 "焼夷弾攻撃の荒廃"
 korean_war_devastation.1.d:0 "中国の介入によって朝鮮を統一させるという北朝鮮の希望は国連軍が共産軍の進撃を停止させたために潰えた。国連軍も同様の問題を抱えていて反攻と進軍は停止し、前線は日に日に静的になってきている。戦争開始当時の国連にせよ中国にせよ、現在のところ新部隊の投入は戦況を覆すことには繋がらなかっていない。両者とも指導者は突破を約束しているが、前線は固形化しつつあり、最終的な結果は朝鮮の人々や街並みにとってはより暴力的で破滅的なものになっていく一方だ。"
 kwp_party_strength:0 "朝鮮労働党の勢力"
 korean_war_devastation.2.d:0 "アメリカ軍は北朝鮮を標的に大規模な爆撃を行い、国連は爆撃の対象は北朝鮮の補給線や産業中心地にあると主張している。爆撃の目的は北朝鮮側の明確な侵略行為を停止させ攻勢作戦の継続を防ぐことにあると素早く強調した。北朝鮮政府は声明の中で激しい爆撃を無差別的であり大量の民間人への被害を生んでいると避難している。また声明では付け加えて爆撃は西側諸国の必死の抵抗の現れであり北朝鮮人民は崇高な使命を果たし続けると述べた。激しい爆撃作戦は東アジアの紛争のエスカレーションの表徴である。"
 korean_war_devastation.3.d:0 "卑劣な帝国主義者の犬共は我が国の街や道への無差別爆撃を開始した。爆撃は明らかに我々人民の意志を揺るがし無辜の人民を最大限に流血させることを目的としている。しかし彼らは我々の決意を過小評価している。爆撃は覚悟を揺さぶるどころか使命遂行に向けた献身をさらに強めることにしかならない。軍の士官らは爆撃が前線への補給や武器生産にもたらす影響について警告を発しているが、人民の軍は目的に向かって歩みを止めないと約束した。外交問題に関する顧問団が爆撃は敵に打つ手がないことを意味していると述べ、敵の意志を挫くため北朝鮮の人民が残酷に虐殺されている事実を広めなければならないと助言した。"