 JAP_National_Radicalism_GUI_info_text:0 "§Y勢力均衡§!は、§Y極右勢力§!と§Y極左勢力§!の綱引きを表している。勢力均衡自体には補正効果はないが、一部のディシジョンや国家方針では、いずれかの陣営が一定以上の影響力を持つことが条件となる場合がある。\n\n§Y不穏度§!は、その名の通り、左右両陣営による政治活動の激しさを表している。不穏度が高まるほど、国民精神§Y極右活動§!または§Y極左活動§!による影響も深刻化する。\n\n§Y現在の問題§!は、左右両方の急進勢力の不穏度を高めている原因を一覧にしたものである。ただし、これらの問題を手動で取り除くことはできないため、この一覧は主に雰囲気や没入感を高めるためのものとなっている。時間の経過とともに、特定のイベント、ディシジョン、国家方針によって問題が追加または削除される。\n\nゲームを通じて、上記のシステムに良くも悪くも影響を及ぼすさまざまなイベントや国家方針が発生する。日本の安定を維持するため、自らの選択には十分注意しなければならない！"
 JAP_National_Diet_info_text:0 "§Y内閣支持率§!は、現首相の内閣に対する国会の信任を表している。一部のディシジョンや国家方針を実行するには、「§G支持§!」の割合が一定以上であることを求められる場合があるため、この数値を高く維持するのが賢明である。\n\n§Y総合国民支持率§!は、現政権に対する国民全体の評価を表している。上記と同様に、一部のディシジョンや国家方針では、支持率が一定以上であることを求められる場合がある。\n\n§Y内閣支持率§!§Rおよび§!§Y総合国民支持率§!§Rは、新たな首相が選出されると変動する場合がある。§!\n\n§Y衆議院の議席構成§!は、衆議院に議席を持つ政党と、その議席数を表している。§G緑色§!の政党名は§Y政府系§!または§Y連立与党§!、§R赤色§!の政党名は§Y野党§!を表し、「その他」は無所属議員または少数政党を表している。\n\n§Y衆議院の議席構成§!§Rおよび§!§Y党内派閥§!§Rは、雰囲気と没入感を高めるために存在している。現時点では、ゲームに影響を及ぼす仕組みはない。§!\n\nゲームを通じて、上記のシステムに良くも悪くも影響を及ぼすさまざまなイベントや国家方針が発生する。これらの数値を高く維持するため、自らの選択には十分注意しなければならない！"
