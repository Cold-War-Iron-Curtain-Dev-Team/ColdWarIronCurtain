l_japanese:
 Fulro_1_desc:0 "ベトナムのジャングルから新たな組織が立ち上がった。プロパガンダ・ポスターから武装闘争に至るまで、被抑圧民族解放統一戦線は南ベトナムと北ベトナムの両方に対して武装蜂起した。カンボジアと中国がこのグループに資金を提供し、支援しているというのが大方の見方だ。1958年、フランスの知識人グループが、バハナール人、ジャライ人、ラデ人、クホ人の擁護を目的としたフルロの前身を設立した。バジャラカ（BAJARAKA）と名づけられたこの組織は、チャンパ解放戦線やカンプチアクロム解放戦線と合併するまでの短期間存続した。モンタニャール人、フルロを最も構成していた民族は225万人からなり、12の部族と様々な言語が話されている。"
 North_Vietnam_1_desc:0 "ベトナム民主共和国の創始者の心臓が止まった。ホー・チ・ミンが死の床に安らかに横たわっている。心不全がベトナム社会主義の創始者を国家から奪い去り、その結果、国家は一時的に指導者を失った。1890年5月生まれのホー・チ・ミンは、少なくとも50のペンネームを使い分けていたことで知られ、出生地や生年月日は不明、少なくとも不確かであった。北ベトナムの指導者は、特に南ベトナムでは、多くの人に愛され、多くの人に嫌われた。作家、ジャーナリスト、詩人、多言語話者であった彼は、激動の時代を経てベトナム民主共和国を率いたインスピレーション溢れる人物であり、ベトナムが一つの旗の下に統一されるという信念を曲げなかった。"
 North_Vietnam_2_desc:0 "\n ベトナム民主共和国政府は、農民と農村労働者に利益をもたらすため、一連の土地改革を開始すると発表した。当初は穏健な姿勢をとり、土地に関しては地主と妥協し、単純な地代の引き下げを行ったが、北ベトナム政府は中国に触発され、より強硬で急進的な改革を開始した。地主を大義の裏切り者とみなし、特別人民法廷を設立した。法廷のほとんどは、法律の専門知識をほとんど持たない農民で構成され、死刑から数年の過酷な労働まで、さまざまな恣意的な判決を下している。さらに、土地改革に関する一連の政令や法律が発表され、土地革命の最終段階である農地の再分配について詳しく述べている。"
 North_Vietnam_3_desc:0 "\n ベトナム共産党の一部が土地改革を過激化させた後、地主の処刑と社会的孤立が始まるのに時間はかからなかった。地主である、あるいは地主に協力しているという理由で、全人口の1000人に1人を処刑しなければならないという内容の政治局文書が発表され、1万5000人の反体制派と地主が死んだと推定されている。VWPはこれまでに、これらの地主の死刑執行後の誤りを正すキャンペーンを開始した。三段階作戦により、農民を再分類し、誤って収用された財産を返還し、あるいはそれらの誤りに対して適切な補償を行った。さらに、現地の人員を見直し、目録を作成し、集中的に再教育を行った。"
 Cambodia_Com_1_desc:0 "\nインドシナ共産党がラオス、ベトナム、カンボジアに分離した後、カンボジア共産党の結成が決定された。ソン・ゴック・ミンが党首代行に任命され、当初はクメール人民革命党と命名された。KPRPとベトミンは結びついており、非常に強い関係を維持しているという噂がある。"
 Cambodia_Com_2_desc:0 "ベトミンがジュネーブ会議でKPRPの政治的役割について交渉しなかったため、KPRP議長代理のソン・ゴック・ミンが1000人の兵を率いて北ベトナムへの行軍を開始した。カンボジアに残った男たちは、合法的な政党であるクロム・プラチャションを結成した。都市委員会のトゥー・サムス（Tou Samouth）と農村委員会のシウ・ヘン（Sieu Heng）である。都市委員会はノロドム・シアヌークを温かく見ており、北ベトナムの支持を受けている。一方、シウ・ヘンはノロドムに激しく反対し、「封建主義者」シアヌークを打倒する闘争を提唱している。"
