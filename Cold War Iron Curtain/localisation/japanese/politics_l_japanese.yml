 CWIC_ECON_PENALTIES.1.d: "予算と支払いの危機を防ぐため、政府は緊縮財政を実施することを決定した。この措置は、国際通貨基金がさらなる支援のための条件として提案したものであり、わが国の経済的安定に不可欠なものである。これらの措置がなければ、国家の財政状況は経済的破局に転じる可能性がある。これらの措置は多くの国民に苦難をもたらすかもしれないが、国の長期的な経済的健全性のために不可欠なものである。"
 CWIC_ECON_PENALTIES.2.d: "政府が支払い不履行を発表した。このニュースは、すでに国家規模の混乱をもたらしている。国際的には、国際通貨基金（IMF）が提案した経済改革を直ちに実施するよう求めている。経済危機が新たな落ち込みを見せる中、国は困難な削減を実行し、国民経済の信頼回復に努めるほかない。この危機的状況下で、事業を維持するための資金が不足しているため、多くの企業や政府機関が閉鎖を余儀なくされている。"
