 UNITY_DESC_0:0 "屈辱と服従、分断の数世紀は我々の団結への決意を強めた。団結した将来だけがアラブ人民の運命を保証するのだ。"
 UNITY_DESC_1:0 "現在のアラブ世界の雰囲気に応じて以下の決議案が利用可能になる。大衆世論が団結に向けて動くごとに、より意味のある法案が通過できるようになる。団結への第一歩となる一つ目の決議案の可決によってこのプロセスが開始する。"
 UNITY_DESC_2:0 "統一はアラブ連盟の形骸化を意味し、従って公式な解散に繋がる。統一決議案へ反対した全ての国は同胞たるアラブ人民から裏切り国家として排除され、後にしかるべき扱いを受けることとなるだろう……\nしかし、より受け入れられやすい妥協案としてアラブ世界の安全と繁栄のための陣営を公式に組織するという選択肢も存在する。"
