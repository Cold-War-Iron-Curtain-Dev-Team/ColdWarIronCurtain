 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_CALL_ALLY:2 "参戦要請を受諾"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_CALL_ALLY:1 "\n§Y$COUNTRY|U$§!は参戦要請を§G受諾§!した。\n\n我々は一致団結している。"
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_CALL_ALLY:2 "参戦要請を拒否"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_CALL_ALLY:1 "\n§Y$COUNTRY|U$§!は参戦要請を§R拒否§!した。\n\nこの戦争では彼の国の支援は期待できない。"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_JOIN_ALLY:2 "我々は共に戦争に参加している"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_JOIN_ALLY:1 "§Y$COUNTRY|U$§!は支援受け入れを§G受諾§!した。\n\n我々は今や共に戦っている。"
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_JOIN_ALLY:2 "共同戦線を拒否"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_JOIN_ALLY: "\n我々の助けを心底必要としているにもかかわらず、§Y$COUNTRY$§!は我々の参戦申し出を§R拒否§!した。"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_NONAGGRESSIONPACT:2 "不可侵条約が調印された"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_NONAGGRESSIONPACT:1 "\n§Y$COUNTRY|U$§!は我々が提案した不可侵条約を§G受諾§!した。\n\n彼の国との間では戦争が勃発しないであろう。"
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_NONAGGRESSIONPACT:2 "不可侵条約が拒否された"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_NONAGGRESSIONPACT: "\n§Y$COUNTRY$§!は我々が提案した不可侵条約を§R拒否§!した。\n\n彼の国は侵略計画を練っているに違いない。"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_CREATE_FACTION:2 "陣営を創設する"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_CREATE_FACTION:1 "\n§Y$COUNTRY|U$§!は新しく創設した陣営への加入要請を§G受諾§!した。\n\nお互いの国の未来のために彼らを導こうではないか。"
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_CREATE_FACTION:2 "我々の陣営への加入を拒否"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_CREATE_FACTION:1 "\n§Y$COUNTRY|U$§!は陣営への加入要請を§R拒否§!した。\n\n他の国を探すしかない。"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_OFFER_JOIN_FACTION:2 "陣営の拡大"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_OFFER_JOIN_FACTION:1 "\n§Y$COUNTRY|U$§!は陣営への加入要請を§G受諾§!した。\n\n我々は一致団結している。"
