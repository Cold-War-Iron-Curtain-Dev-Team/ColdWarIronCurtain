 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_OFFER_JOIN_FACTION:1 "\n§Y$COUNTRY|U$§!は陣営への加入要請を§R拒否§!した。\n\n彼の国は孤独に崩壊するであろう。"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_JOIN_FACTION:2 "陣営に加入"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_JOIN_FACTION:1 "\n§Y$COUNTRY|U$§!は我々の陣営加入を§G受諾§!した。\n\n我々は一致団結している。"
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_JOIN_FACTION: "陣営からの締め出し"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_JOIN_FACTION:1 "\n§Y$COUNTRY|U$§!は我々の陣営加入を§R拒否§!した。"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_LEND_LEASE:2 "レンドリースを受諾"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_LEND_LEASE:1 "\n§Y$COUNTRY|U$§!が我が国のレンドリースを§G受諾§!した。\n\n我が国の物資援助が彼らの努力を手助けするであろう。"
