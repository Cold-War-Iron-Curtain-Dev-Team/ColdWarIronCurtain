 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_LEND_LEASE_EXISTING:1 "\n§Y$COUNTRY|U$§!が我が国のレンドリース改定の提案を§R辞退§!した！\n\n奴らは最早我が国の物資援助を受けられないだろう。"
