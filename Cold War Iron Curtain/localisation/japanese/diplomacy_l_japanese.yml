 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_PEACE_PROPOSAL:1 "\n§Y$COUNTRY|U$§!は我が国の和平提案を§R拒否§!した。\n\n戦争は継続される。"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_SEND_VOLUNTEERS: "義勇軍の受諾"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_SEND_VOLUNTEERS:1 "\n§Y$COUNTRY|U$§!が彼らの戦争への我が国からの義勇軍派遣を§G受諾§!した。\n\n我が国の兵士が戦闘に参加するために移動中である。"
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_SEND_VOLUNTEERS: "義勇軍の拒否"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_SEND_VOLUNTEERS:1 "\n§Y$COUNTRY|U$§!が§Y$COUNTRY$§!の戦争への我が国からの義勇軍派遣を§R拒否§!した。\n\n我が国の熱意に溢れた義勇軍は解散せざるを得ないだろう。"
