 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_ASKSTATECONTROL: "領土管理権の拒否"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_ASKSTATECONTROL:1 "\n§Y$COUNTRY|U$§!は占有している州の管理権を我々に譲渡する要求を§R拒否§!した。"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_GIVESTATECONTROL: "占領地の譲渡"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_GIVESTATECONTROL:1 "\n§Y$COUNTRY|U$§!は我々の占有している州の管理権を譲渡したいという提案を§G受諾§!した。\n\n彼らは現在、この州を支配している。"
