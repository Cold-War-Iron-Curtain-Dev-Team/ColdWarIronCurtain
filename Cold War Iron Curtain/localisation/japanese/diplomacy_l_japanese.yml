 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_PEACE_PROPOSAL:1 "\n§Y$COUNTRY|U$§!は我が国の和平提案を§G受諾§!した。\n\n我々国家間の戦闘は終結した。"
