 AI_MESSAGE_CAT1_MES1: "あそこを併合したのか$OTHER$、よくやった。すごいと思うよ。"
 AI_MESSAGE_CAT1_MES2: "あっはっは、$OTHER$はこのゲームがヘタだな。"
 AI_MESSAGE_CAT1_MES3: "もうちょっと学びな、素人の$OTHER_ADJ$。"
 AI_MESSAGE_CAT1_MES4: "$OTHER$が必死に保持してたのに、可愛そうな事しちゃったかな？"
 AI_MESSAGE_CAT1_MES5: "ちょっとこのゲームは$OTHER$には難しすぎたんじゃないかな。Europa Universalisみたいなわりとカジュアルなゲームでもやってたほうがいいと思うよ。"
 AI_MESSAGE_CAT1_MES6: "俺は$OTHER$が戦闘序列の設定にたったの2時間も使わなかった方に賭けるね。ヘタクソ！"
 AI_MESSAGE_CAT1_MES7: "ちょ、俺が切り取った$OTHER_ADJ$の土地を見てくれよ。国土の叩き売りじゃねーか。"
 AI_MESSAGE_CAT1_MES8: "ヘイ$OTHER$、次は抵抗してみたほうが良いんじゃないかな？いたはずなのに全く抵抗を見れなかったよ！"
 AI_MESSAGE_CAT1_MES9: "なんで$OTHER$が泣いてるかって？叩きのめしてやったからさ！"
 AI_MESSAGE_CAT1_MES10: "ねえ $OTHER$、俺の生存圏を広げてくれて今どんな気持ち？"
 AI_MESSAGE_CAT2_MES1: "俺の電撃戦で黙らせてやるよ、$OTHER$！"
 AI_MESSAGE_CAT2_MES2: "$OTHER$の全国民が$US_ADJ$語で会話するようになる日も近いな。"
 AI_MESSAGE_CAT2_MES3: "見ろよ$OTHER_ADJ$の雑兵集団が$US_ADJ$の精鋭師団に喧嘩売ってるぜ。惨めすぎてワロエナイ。"
 AI_MESSAGE_CAT2_MES4: "$OTHER$、お前さんはこの戦争をどう呼んでる？俺は「朝飯前」ってとこだな。"
 AI_MESSAGE_CAT2_MES5: "$OTHER_ADJ$の工場はちゃんと綺麗にしといてくれよな。もうすぐ俺が使うんだからさ！"
 AI_MESSAGE_CAT2_MES6: "$OTHER$、こいつが聞こえるかい？お前さんがすぐにでも俺のものになっちまう音だぜ。"
 AI_MESSAGE_CAT2_MES7: "おい$OTHER$、逃げずにまともに戦おうとしてみてたらこんな酷い有様にはならなかったんじゃないか？"
 AI_MESSAGE_CAT2_MES8: "$COUNTRY$が俺と戦おうとしてるんだがw 気絶したフェレットを軍隊の目の前に置くようなもんでしょ！"
 AI_MESSAGE_CAT2_MES9: "この時期の$COUNTRY$って綺麗なんだな。俺の軍隊は満喫してるよ！"
 AI_MESSAGE_CAT2_MES10: "いい加減降参しろよ$COUNTRY$！俺の時間を無駄にしてるだけだって。"
 AI_MESSAGE_CAT3_MES1:1 "$OTHER|U$はハッカーだ！まともにやって自分が負けるはずがない！"
 AI_MESSAGE_CAT3_MES2: "このゲームバランス悪すぎだろ！$OTHER_ADJ$のスペースマリーンが無敵すぎるし、$US_ADJ$のトループは紙クズだ。"
 AI_MESSAGE_CAT3_MES3: "こんな け゛ーむに まし゛に なっちゃって と゛うするの"
 AI_MESSAGE_CAT3_MES4: "パラドックスがこんなあからさまに俺の味方を2tの花崗岩よりバカにして敵だけ正確に未来予知するようなコード組まなきゃ、$OTHER$に俺が負けるもんかよ！"
 AI_MESSAGE_CAT3_MES5: "ffaSJLgapigjaslgmag s asv lajvlv くたばれ$OTHER$、お前とはもう絶対やらんからな！！！1"
 AI_MESSAGE_CAT3_MES6: "$OTHER$ 乙。次にやるときは正々堂々と勝負してくれよ。"
 AI_MESSAGE_CAT3_MES7: "うわー、そのゲームシステムで完璧にやられたな。$OTHER$に負けるのも無理ないな。"
 AI_MESSAGE_CAT3_MES8: "ワオ！たぶん最新パッチで$OTHER$のバランスが滅茶苦茶になってなければ公平な戦いが出来たのに！"
 AI_MESSAGE_CAT3_MES9: "Hearts of Iron 3の方がいいゲームだったな、だってHOI3なら$OTHER$が汚い方法でオレを倒したりできなかっただろうし。(｀ヘ´)"
 AI_MESSAGE_CAT3_MES10: "はいはい、完璧に乱数のせいで$OTHER$に負けたよ。ヘッタクソだろうがこのゲームじゃ関係ないってわけだ。"
