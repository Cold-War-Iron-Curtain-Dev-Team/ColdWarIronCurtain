 DIPLOMACY_GIVESTATECONTROL_DESC: "領土の管理権を譲渡することで我が国のレジスタンス対策を容易にする。また同じ陣営の国家に、その土地の資源、人的資源と工場を与えることとなり彼らを支援できる。"
