 DIPLOMACY_ASKSTATECONTROL_DESC: "領土の管理権を得ることはレジスタンスに対処する必要が生じることを意味する。しかし我が国はその土地の資源、そして人的資源と工場の獲得が可能となる。"
 DIPLOMACY_ASKSTATECONTROL_ACTION_DESC: "現在、彼らに占有している領土管理権の譲渡を要求"
