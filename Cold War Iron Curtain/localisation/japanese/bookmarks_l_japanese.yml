l_japanese:
 BM_HISTORY_TITLE: "略史"
 BOOKMARK_1980_NAME: "新冷戦"
 BOOKMARK_1980_DESC: "1980年、アメリカとソ連の緊張した膠着状態にあった冷戦が世界を支配していた。双方がイデオロギー的戦いを繰り広げるにつれ緊張は高まり、核戦争の巨大な亡霊がおぼろげに見えていた。ソ連のアフガニスタン侵攻は軍備についての新たな焦点に注目を集めた。ポーランドの「連帯」のようなレジスタンス運動は共産主義支配に挑戦している。両陣営が影響力を争う中、核戦争の脅威が国際関係に暗い影を落としている。"
 GATHERING_STORM_NAME: "鉄のカーテン"
 GATHERING_STORM_DESC: "戦後の国際連合の設立による、国際協力や平和の典型などの楽観的な考えは、急速に消えていった。二次大戦の真っ只中にヨーロッパの帝国達は、自らの血と大切なものだけでなく、植民地領土までも使い尽くした。そして現在、植民地支配を受けている、各地のアフリカ人やアジア人の独立心に火が付き始めている。世界中を見渡せば、アメリカとソビエト連邦は今や、他の勢力を凌駕する程にまで成長している。両国間でのイデオロギー対立を発端に、戦時中の友好関係は急速に冷え込んだ。既にヨーロッパでは、イデオロギーの壁なるものが敷かれつつあり、資本主義陣営と共産主義陣営による境界線が引かれている。"
 UK_1949_desc: "イギリスはヒトラーを相手に存亡をかけて戦い、勝利を収めた。しかしこの勝利には代償を伴うことになった。ヨーロッパの半分は鉄のカーテンに覆われ、国土は戦争で荒廃し、帝国も歴史の彼方に消え去る寸前だった。イギリスにとって平和は戦争と同じくらい厳しい戦いになるだろうと思われた。電撃戦の記憶が薄れゆく中、共産主義に対する恐怖がイギリス連邦の人々の心を捉えたのだ。"
 UK_1949: "イギリス"
 Canada_1949_desc: "Canada left the Great War as a nation, and has left the last war as a power in her own right. Increasingly independent of London, Canada has become a prosperous nation with a strong economy and modern military. For the first time in her history, Canada has the chance to write her own destiny. Will the True North stay strong and free?"
 Canada_1949: "カナダ"
 South_Korea_1949_desc: "Finally free of both US and Japanese occupation, the newly established Republic of Korea was hopeful for peaceful reunification with their separated countrymen above the 38th parallel. But after the suspicious assassination of the only senior politician willing to negotiate with the North and staunch anti-Communist Syngman Rhee winning the presidency, dreams of peace were shattered, and the peninsula's fate shall be drawn with blood."
 South_Korea_1949: "大韓民国"
 WGR_1949_desc: "Germany began the Second World War under the wicked ambitions of Adolf Hitler, but ended it a conquered nation. The post-war occupation of Germany is nearing its end; a permanent split between a western-aligned west and a communist east is inevitable. The newborn Federal Republic of Germany finds herself in an unenviable position indeed."
 WGR_1949: "ドイツ連邦共和国"
 DDR_1949_desc: "Under Soviet Military governorship, the people of East Germany find themselves under the rule of the very people they oppressed. The occupation has been harsh and morale is low, but there is a glimmer of hope as the military occupation starts its transition toward the planned German Democratic Republic. At last, the home of Marx shall have a government befitting communism's birthplace."
 DDR_1949: "在ドイツソ連軍政府"
 North_Korea_1949_desc: "Shortly following the declaration of the Republic of Korea, the Soviet Union established the Democratic People's Republic of Korea on their side of the 38th parallel. Under former resistance fighter Kim Il-Sung, the DPRK seems poised to pay the iron price to solve the issue of unification. War is coming, and the Korean revolution faces its greatest challenge yet."
 North_Korea_1949: "朝鮮民主主義人民共和国"
 PRC_1949_desc: "The Japanese have been defeated and the ceasefire with the Kuomintang broken. The People's Liberation Army has grown exponentially and with the equipment left behind by the Japanese, the Chinese Communists are prepared the secure the rest of China. Despite minimal assistance from the Soviet Union, the leadership of Mao Zedong following the Great March has allowed revolution to flourish. Just a few more key cities, and China shall finally be united!"
 PRC_1949: "中国共産党"
 USSR_1949_desc: "The Soviet people sacrificed everything in the Great Patriotic War, but in the end it was worth the blood. Hitler was defeated, the Union saved, and under the unwavering hand of Joseph Stalin, the Soviet Union has become a superpower to rival the United States. The war against fascism is over, but the long struggle against imperialism is just starting. Will communism prevail, or will the revolution perish forever?"
 USSR_1949: "ソビエト社会主義共和国連邦"
 Poland_1949_desc: "In the aftermath of the Second World War, Poland has fell firmly within the Soviet grasp. Boleslaw Bierut, considered a close ally and ideological student of Stalin, stands as the undisputed leader of Poland. The Polish state has a long road ahead of it, but if it can avoid the ire of its people and build their faith in socialism, perhaps the horrors of the Second World War can be left in the past."
 Poland_1949: "ポーランド共和国"
 Czechoslovakia_1949_desc: "Left under Soviet supervision in the aftermath of the war, the Czechoslovak Communist Party asserted its total control over the country in 1948 in a Soviet-backed coup d'état. Though firmly a one-party state under communist rule, Czechoslovakia faces growing pressure from Moscow to purge percieved disloyal elements. Sacrifices will have to be made for the revolution in the coming years."
 Czechoslovakia_1949: "チェコスロバキア共和国"
 Bulgaria_1949_desc: "Bulgaria fought for the Axis in the Second World War, but when the tides turned against Hitler, the communist-led Fatherland Front overthrew the pro-fascist government and signed peace with the USSR. In 1946, the monarchy was abolished, and since then former Komintern chief and close friend of Stalin, Georgi Dimitrov has led socialist Bulgaria. It seems that for now, Sofia and Moscow are inseparable."
 Bulgaria_1949: "ブルガリア共和国"
 Romania_1949_desc: "Romania fought side by side with Hitler in Operation Barbarossa, where perhaps prophetically the Romanian army was destroyed at Stalingrad. The city's namesake enforced communist rule in Romania not long after, with the monarchy abolished in favor of a Soviet-style workers republic. The Party now faces a split between the Soviet-backed \"prison faction\" and the more moderate \"Moscow faction\" led by Ana Pauker."
 Romania_1949: "ルーマニア人民共和国"
 Albania_1949_desc: "On the 29th of November, 1944, the Albanian Liberation Front under Enver Hoxha liberated all of Albania from Axis occupation. The feeble monarchy was left in the dust, and the People's Republic of Albania declared. Enver Hoxha is a staunch ally of Stalin and Mao, and loyal to the revolution to a fault. Were things to change in Moscow or Beijing, Tirana may not be willing to follow."
 Albania_1949: "アルバニア人民共和国"
 Communist_Greece_desc: "For the past three years, Greek has fought Greek in a terrible civil war at the behest of the western imperialists. The Greek people are entitled to decide their own destiny, and for the Communist Party of Greece, socialism is that destiny. For now, the momentum is in the hands of the West's puppet king, but can the revolution will prevail in the end?"
 Communist_Greece: "ギリシャ民主軍"
 Hungary_1949_desc: "For a few short years after the end of the Great War, Hungary was one of the first communist states in the world. Unable to link with her Bolshevik allies, the Hungarian revolution was extinguished. Twenty-five years later, the revolution triumphantly returned under the banners of the Soviet Army, putting Budapest firmly in the Soviet sphere. Will Moscow's line hold or is change inevitable?"
 Hungary_1949: "ハンガリー人民共和国"
 USA_1949_desc: "America's victory in the Second World War cemented its superpower status. Rather than return to isolationism, the United States has moblilized against the Soviet Union in defense of liberty's cause worldwide and anti-communist sentiments run rampant throughout the country. But now that nukes are on the table for both sides, could the United States truly survive against such a formidable foe?"
 USA_1949: "アメリカ合衆国"
 Israel_1949_desc: "The Jewish people were nearly annihilated by Hitler's legions, and yet with Israel's newfound independence, they stand triumphant. For the first time in two thousand years, the Holy Land belongs to the Hebrews. Yet not all is well for the new nation. Her freedom was won through war with all her neighbors, and many political questions must be answered before the Arab states return for revenge."
 Israel_1949: "イスラエル国"
 Yugoslavia_1949_desc: "Yugoslavia liberated itself from Nazi occupation under the leadership of Marshal Tito, and since then has maintained fierce independence from both East and West. So far, Tito's \"market socialism\" and \"self-management\" has led to economic recovery, but Yugoslavia's path is by no means clear. Stalin still has ambitions to bring Belgrade back into the fold, and internal divisions could prove dangerous in the future. Can Yugoslavia survive?"
 Yugoslavia_1949: "ユーゴスラビア連邦人民共和国"
 Mongolia_1949_desc: "Under the firm hand of Khorloogiin Choibalsan, Mongolia is on its way to modernization. Thanks to its close relationship with the Soviet Union, Mongolia engaged in its own program of industrialization as the nation emerged from its medieval isolation. Having recently achieved his dream of international recognition, Choibalsan seems poised to rule the steppes for many years to come."
 Mongolia_1949: "モンゴル人民共和国"
 East_Turkestan_1949_desc: "The East Turkestan Republic is a conundrum. Formally recognized by the world as a part of China, the civil war has left a power vacuum, and the local Uighurs have taken power under Soviet guidance. With the victory of Mao's communists likely, will Moscow stand by their erstwhile allies, or is East Turkestan doomed to be a footnote in history?"
 East_Turkestan_1949: "東トルキスタン共和国"
 Iraq_1949_desc: "After the 1948 Arab-Israeli War, Iraq stands in a position to do much in the Middle East despite its loss in that war, yet it faces a problem with Kurd rebels, most recently inspired by Mustafa Barzani's revolt. Iraq depends upon the British which have access to their oil through the Iraqi Petroleum Company in exchange for aid. At the Hashemite court, there is great conflict between the new \"free\" military officers and the conservative monarchists that must be resolved."
 Iraq_1949: "イラク王国"
 Egypt_1949_desc: "The Kingdom of Egypt formally gained its independence from Britain in 1922, but few Egyptians actually believe it. Britain retains its hold on the Suez Canal and dominates the Anglo-Egyptian Sudan, while a small aristocracy hold nearly all the wealth and power in the country. Though King Farouk has his fair share of supporters, many powerful figures see him as an effete playboy who is leading the nation to ruin. Only one side will prevail."
 Egypt_1949: "エジプト王国"
 Syria_1949_desc: "The Syrian Republic's road to independence was a path marred with troubles, and fares no differently today. Along with the failure to thwart the formation of Israel, the government of Shukri al-Quwatli was overthrown in a US-backed military coup. Although General Husni al-Zaim sits in the throne comfortably, other Generals look for their turn to usurp leadership. When Syria can break the chains of dictatorships, can it achieve greatness?"
 Syria_1949: "シリア・アラブ共和国"
 Japan_1949_desc: "Japan's imperial ambitions met their end with the atomic bombings of Hiroshima and Nagasaki. Now under American occupation, the former Empire of Japan faces an uneasy future and a long road to reconstruction. Under the watchful eye of Douglas MacArthur, the \"Gaijin Shogun,\" constitutional government has returned to Japan. Whether it stays that way remains to be seen."
 Japan_1949: "占領下日本"
 Philippines_1949_desc: "The Philippines recieved their independence from the United States only a few years ago, and maintains a close alliance with its former overlord in the face of the increasing communist threat at home and abroad. The young nation is unstable, with communist guerrillas and political intrigue threatening to set the islands ablaze. The Philippines are at a crossroads, and the coming years will decide her future for decades to come."
 Philippines_1949: "フィリピン共和国"
 Hukbalahap_1949_desc: "The Hukbalahap movement was founded in 1942 as the military wing of the Communist Party of the Philippines to conduct armed resistance against the Japanese invaders and the collaborationist government. Fielding more than twenty thousand members by the war's end, the reinstated American colonial government has nonetheless refused to grant Huk units official guerrilla statue and allow veterans benefits for them. Things only deteriorated with time as the pre-war corruption and injustice upon the rural farmer population returned. Finally, with the refusal of allowing elected communist congressman to take their seats and assassinations of prominent labor movement leaders, the Huks has taken to the mountains again; this time planning to liberate the country from the corrupt system that enslaved it."
 Hukbalahap_1949: "フクバラハップ"
 Thailand_1949_desc: "Thailand emerged from World War II nearly unscathed. Despite Thai support for Japan, America recognized the regime of Marshal Plaek Phibunsongkhram after the war due to his staunch anti-communism on the condition that free elections were held, which Phibun won handily. Thailand seems poised to continue its rapid westernization under the Marshal's guidance, but the threat of both the reds and reactionaries remain."
 Thailand_1949: "タイ王国"
 Cuba_1949_desc: "Under president Ramón Grau, Cuba abolished the Platt Amendment in 1934 and for the first time in its history, Cuba stood as a truly independent state. In the years since, Cuba has maintained close ties with the United States, and American investments have flown into her ports, even if foreign businessmen and the local elites get most of the spoils. On the home front, Cuban democracy remains a shaky affair indeed."
 Cuba_1949: "キューバ共和国"
 Dominicana_1949_desc: "The Dominican Republic has been under the iron fist of Generalissimo Rafael Trujillo since 1930. The people chafe under his tyranny, but all who have tried to oppose him have met terrible deaths at the hands of the the secret police, commanded by his doggishly loyal lieutenant, Johnny Abbes García. It seems that for now, there is no hope for the Dominican people. But for how long can you keep a people down?"
 Dominicana_1949: "ドミニカ共和国"
 Belgium_1949_desc: "Having been invaded, occupied, and liberated for the second time in the 20th century, Belgium is in a particularly tough time after World War II. Its industry and economy are ruined, military extremely small, and colonial affairs stable but shaky at best. Politically speaking, Belgium is a democracy, but the King holds great power in the minds of the people, as well as rumblings from the Belgian Communists."
 Belgium_1949: "ベルギー王国"
 India_1949_desc: "After centuries of foreign oppression, the newly proclaimed Dominion of India has finally earned its freedom from Britain. The people celebrate their newfound liberty as India prepares to cut its last ties to London, but the challenges have only just begun for the new state. The Partition caused the deaths and displacement of millions, poverty is rampant, and India faces renewed conflict with its Muslim neighbors in Pakistan over Kashmir."
 India_1949: "Bhārat Gaṇarājya"
 Uganda_1949_desc: "Uganda maintains a more-hands off administration compared to other British colonies, allowing the traditional kingdoms to maintain their mandates over the tribes. However, the economy remains firmly in the hands of White and Asian settlers, who have excluded native Africans from the profitable cotton industries. This policy, among others, has caused unrest from the Baganda people. Perhaps independence for Uganda is inevitable?"
 Uganda_1949: "ウガンダ保護領"
 South_Vietnam_1949_desc: "Guided by the French, the State of Vietnam stands in opposition to the communist Viet Minh. Despite his efforts to modernize the nation, the quoc-truong, Bao Dai is deeply unpopular and seen as a corrupt puppet of Paris. Change is coming to Vietnam. Will it be under the Viet Minh, or will the State of Vietnam have a revolution of its own?"
 South_Vietnam_1949: "Quốc-gia Việt-Nam"
 Nigeria_1949_desc: "Nigeria is an oddity among the British colonies. While most of West Africa remains firmly in the hands of British administrators, Nigeria remains split between numerous tribes and a general division of a Muslim north and Christian south, necessitating a more hands-off approach. As tensions mount between the numerous tribes and feudal lords, tough decisions must be made for the sake of the colony's future."
 Nigeria_1949: "ナイジェリア植民保護領"
 OTHER_DESC: "The nations of the world, great and small, are not all content to hold their breath awaiting the outbreak of another global conflict. From major powers on the brink of civil war to the many nations formed and transformed by the Second World War, all will have to make difficult decisions and balance ideals with pragmatism to have an impact on the future of the world."
 Kenya_1949_desc: "The Colony and Protectorate of Kenya is not the model colony to say the very least. While most residents of the mainland UK may hardly ever think of this nation of their empire with its 6 million people living in a collection of four major cities and mostly minor towns, the African majority of Kenya thinks of their British subject status regularly. Established at the climax of the scramble for Africa, Kenya as a colony is mainly populated by the ethnic Kikuyu people with a notable level of local British business and settlement. Like in every African colony, there is a small minority of anti-colonial and pan-Africanist student youth and intelligentsia in Kenya mainly organized around the activist Jomo Kenyatta. However, the largely illiterate rural people of the country are the real threat to colonial stability in Kenya as traveling prophets and mystics form militias in the countryside of the central highlands."
 Kenya_1949: "ケニア植民保護領"
 Ethiopia_1949_desc: "Mother Ethiopia, the Ethiopian Empire is a multi-ethnic and religiously diverse nation home to about 18 million people. Ethiopia is plagued by drought and famine with most of its citizens being illiterate serfs who only speak their regional language, if the crown wishes to modernize its country as it intends to, it will need to address these major issues. As the reconstruction of Ethiopia following the Second Italo-Ethiopian War comes to completion, the Ethiopian Empire appears to be at the height of its stability. As the only relevant independent African nation, Ethiopia has many opportunities available to them in this time lacking internal conflict. With the internationalist foreign policy of Haile Selassie, Ethiopia will likely find itself branching out to the world even farther in this new era defined by superpower rivalry."
 Ethiopia_1949: "Yäʾityppoya Nägusä Nägäst Mängəśt"
 SAF_1949_desc: "South Africa emerged from the Allied victory with its prestige and national honor enhanced as it had fought tirelessly for the Western Allies. South Africa's standing in the international community was rising, at a time when the Third World's struggle against colonialism had still not taken center stage. Just as he did in 1919, Smuts urged the delegates to create a powerful international body to preserve peace; he was determined that, unlike the League of Nations, the United Nations would have teeth. However, internal political struggles in the disgruntled and essentially impoverished Afrikaner community would soon come to the fore leading to Smuts' defeat at the polls in the 1948 elections at the hands of a resurgent National Party after the war. Now, the National Party is on its way to build institutionalized segregation in the country with its Apartheid system."
 SAF_1949: "Unie van Suid-Afrika"
 Portugal_1949_desc: "After staying neutral in the devastating Second World War, Portugal decided to take a major pro-Western stance by being one of the founding members of the North Atlantic Treaty Organization. With widespread communist movements, Portugal must either fight back or risk being the next victim of communism. \n\nThe Estado Novo dictatorship still stands, attempting to maintain its colonial empire. However, a wave flows across Africa, calling for Europe to decolonize. With decolonization already beginning, many are starting to look towards Portugal too, urging them to follow suit. Portugal must either affirm its presence in Africa or consider a different approach."
 Portugal_1949: "República Portuguesa"
 DECADE_CRISIS_NAME: "危機の十年間"
 DECADE_CRISIS_DESC: "脱植民地化の過程で、アジアでは平和に、もしくは暴力によって、独立を勝ち取る国家が出てきた。現在、アフリカの人々は、帝国の列強諸国の脱植民地化の波の高まりに直面するにつれ、独立を求めて闘い始めている。そして中東では、アラブ民族主義が栄光をもたらし、旧体制の打破を約束している。アメリカとソビエト連邦との対立は、世界規模の支配を巡る、全面的な争いへとなっている。ある国家は、ソ連とアメリカの両方の策謀にますます幻滅している。彼らは、自らの運命を自らで導くことを望んでおり、これらの国家がこの二極化したこの世界秩序の中で生き残ることができるかどうかは誰にも分からない。"
 ETH_DECADE_CRISIS_DESC: "Ethiopia faces a crisis of modernity. Trying to prove its relevance, Haile Selassie has focused on foreign policy as pan-Africanism and decolonization take the African continent by storm while neglecting his domestic situation. Outside the imperial capital, Ethiopia is a nation stuck in the Dark Ages and not all are content with the Emperor's ambitions while his people remain poor and illiterate. The Lion of Judah must tread a new path, or it will be slain in the coming battles."
 KEN_DECADE_CRISIS_DESC: "Though the Mau Mau uprising is over, Kenya's troubles know no end. While many see the decolonization of the British Empire as inevitable, a strong, very vocal, group of British settlers and businessmen in the colonial assembly think otherwise. The people cry out for freedom, viewing the imprisoned Jomo Kenyatta as their real leader. Perhaps decolonization is not inevitable, but a reckoning is."
 OILCRISIS_NAME: "石油危機"
 OILCRISIS_DESC: "Detenté has seen relations between the United States and Soviet Union go from hostile to at least somewhat understanding. While atomic war might be on hold for now, the world is anything but stable. Vietnam has turned into a disaster for America, the Middle East seems poised to burn, and the non-aligned movement grows in power as more and more nations in the post-colonial world grow tired of the games of West and East. The 1970s will be the most unpredictable decade of the Cold War yet."
 USA_DECADE_CRISIS_DESC: "The United States of America has accepted its position as \"Leader of the Free World\". After Cuba and China fell completely into communism, the \"containment strategy\" has come into full force. The United States will do anything in its power to stop the spread of communism as Asia, Latin America, and Africa become new battlegrounds for Washington and Moscow. Khrushchev treatens to bury America, but it takes more than empty words to dissuade the American people."
 SOV_DECADE_CRISIS_DESC: "The Union of Soviet Socialist Republics has de-Stalinized their politics and stabilized their internal problems. Now focusing on exploring space and spreading their influence across Africa, Asia, and Latin America. The Soviet Union is rising. Will the economic growth and political dominance of the USSR continue or can the Americans turn the tables on the Reds?"
 DDR_DECADE_CRISIS_DESC: "The German Democratic Republic under Walter Ulbricht has continued to follow the Soviet Union on matters of politics and economics. The issue of Republikflucht, the defection of often educated people to West Germany, has proven a critical issue that threatens the nation with a \"brain drain\". Drastic measures must be taken to preserve the socialist system."
 PRC_DECADE_CRISIS_DESC: "The People's Republic of China emerged victorious from the Chinese civil war. With the Kuomintang banished to Taiwan, Mao has sought to transform China into the most ambitious experiment in socialism yet. Though some successes were achieved, Mao's first decade in power saw the disastrous Great Leap Forward kill millions. Now sidelined from direct leadership of the CCP, the Great Helmsman plots to chart the Chinese revolution back to his radical vision."
 CUB_DECADE_CRISIS_DESC: "The Republic of Cuba has embraced revolution under the charismatic Fidel Castro. Unrest and instability led to Batista's ousting in January 1959 by the 26th of July Movement, which afterwards established a one-party socialist state. While the US first reacted favorably to the Cuban revolution, Castro's nationalization of American assets and political exeuctions that followed cooled relations very quickly. Cuba's revolution will soon face its baptism by fire."
 VIE_DECADE_CRISIS_DESC: "The Republic of Vietnam was proclaimed on 26 October 1955, with Ngo Dinh Diem as its first president. Opposed to Ho Chi Minh's government in Hanoi, Diem has embarked on an ambitious program of reform meant to transform Vietnam into his own ideologically unique and often incoherent vision. Failed attempts at reunification, corruption, and political and religious turmoil have left the US and the Vietnamese Army increasingly distrustful of Diem. Another mistake just might set Vietnam aflame."
 FRA_DECADE_CRISIS_DESC: "The French Republic has just reformed under Charles de Gaulle into the Fifth Republic, which emerged from the collapse of the Fourth Republic, replacing the former parliamentary republic with a semi-presidential system. De Gaulle, who was the first French President elected under the Fifth Republic in December 1958, believes in a strong head of state, which he describes as embodying l'esprit de la nation -- \"the spirit of the nation\". Though the country stands behind him, the Algerian War and tensions with Washington must be dealt with sooner than later."
 ENG_DECADE_CRISIS_DESC: "The United Kingdom has faced defeat after defeat. The Suez Crisis, colonial tensions, and a general decline in its relevancy in the face of American dominance of the capitalist world has left many Britons wondering if the Commonwealth can survive. One thing is for sure. The days when Her Royal Majesty ruled an empire where the sun never sets are fast approaching their end, redefining London's relationships with the Commonwealth and NATO."
 ZIM_DECADE_CRISIS_DESC: "Since 1953, Southern Rhodesia, Northern Rhodesia and Nyasaland have comprised an unstable federation. Now, with the new decade, many are wondering if the colonial federation can hold. Anti-colonial agitation and increasing distrust of London in Southern Rhodesia might earn the federation an early grave and an uncertain future for its successors."
 NGA_DECADE_CRISIS_DESC: "Thanks to a concerted effort by the political groups of the country, Nigeria is just nearing its planned independence in October. Native politicians have finally been able to form a government. Abubakar Tafawa Balewa will be the Nation's first Prime Minister, facing the task of leading a newborn nation into an uncertain future in the face of ethno-religious conflicts and Cold War machinations."
 1990_DESC: "The Cold War is over. America has secured its place as the sole superpower as the Soviet Union seems doomed to collapse, or at least lose its international relevancy. Many nations in the Eastern Bloc are holding free elections for the first time in decades in the wake of the fall of the Berlin Wall. Is this the end of history, or are new conflicts bound to set the world on fire once more?"
 YUG_1990_DESC: "Yugoslavia is falling apart. Since Tito's death, ethnic tensions have been rising across the nation. Now, with the start of a new decade, these tensions might escalate into violence. Can Yugoslavia be saved, or are the Southern Slavs doomed to a terrible fate?"
 USA_OILCRISIS_DESC: "The USA faces an uncertain future as the last troops prepare to withdraw from Vietnam. Inflation has shot up to nearly nine percent, hurting the power of the American dollar. The youth protest on the streets for peace, justice, and sometimes just for the hell of it. Social changes are coming too, as \"sexual revolution\", \"Black Panther\", and \"feminism\" enter the mainstream parlance. Though Detenté has warmed relations with both Moscow and Beijing, America's cultural reckoning has only just begun."
 PRC_OILCRISIS_DESC: "The PRC is in the midst of the Cultural Revolution and immense change. Socialist education continues abreast, with young, urban Chinese workers being sent to the countryside for re-education. Chairman Mao remains in power but there is already discussion of who can possibly succeed the father of socialism in China. Tensions with the Soviets remain high as both socialist giants pursue their visions of a socialist society. Hostility remains with the Republic of China, with both states continuing to engage each other diplomatically and through proxy conflicts. Many see the recent breakthrough in relations with the United States as an opportunity to counter the Soviet threat and potentially isolate the ROC."
 SOV_OILCRISIS_DESC: "Since Khrushchev's ouster in 1964, the Soviet Union has been ruled by the more conservative Leonid Brezhnev. Overseeing increases in living standards and new peace efforts with the United States, the Soviet Union still faces political intrigue at home and a struggle for leadership of the global communist movement against China. Though for now the Soviet Union seems unbreakable, the status quo might not cut it forever."
 EGY_OILCRISIS_DESC: "Egypt's inconclusive end to the Yom Kippur war has left it in an uncertain position. President Anwar Sadat has for much of his presidency tried to move away from Nasserism, and it was Nasserist thought that led to the disastrous Six Day War in the first place. Perhaps peace with Israel might bring back the Sinai, but such a move would isolate Egypt from its allies in Syria and Libya and put the pan-Arabist movement in the grave."
 ISR_OILCRISIS_DESC: "While Israeli soldiers prayed on their holiest day, the Egyptians and Syrians sent their armies to war. In two weeks and five days, the enemy was driven back. The marked aggression of the Arab states, combined with Israel's victory, has soldified support from the West. Yet the war is now over, and Israel must tread the long road to peace with the Arab nations if the Jewish people are to make something of their sacrifice."
 FRA_OILCRISIS_DESC: "France's days as a great power are coming to an end. The Empire is but a distant memory. The American domination of the west is an insult to French sentiments as well. If France cannot be an imperialist power anymore, then she must preserve her culture, her pride, and her dignity in the tumultuous years to come so that the French people will always have a place in the world."
 SYR_OILCRISIS_DESC: "Syria's humiliating defeat in the catastrophic Six-Day War, culminating in the seizure of the Golan Heights by the Zionist foe led to the falling out of Salah Jadid. After the inevitable power struggle, President Hafez al-Assad stood on top to implement his Corrective Movement, an ambitious program of modernization. Syria will be reborn, and the Lion of the Levant will have his revenge against the Israelis and their Western friends."
 WGR_OILCRISIS_DESC: ""
 ENG_OILCRISIS_DESC: ""
 DDR_OILCRISIS_DESC: ""
