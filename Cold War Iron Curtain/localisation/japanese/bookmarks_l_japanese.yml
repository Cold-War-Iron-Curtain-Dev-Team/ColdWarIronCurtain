 ETH_OILCRISIS_DESC: "While it has taken the Ethiopian student youth and intelligentsia several decades longer to plant themselves firmly in specific international ideologies, these movements were always inevitable in their fruition due to the sturdy, unchanging status quo of the Imperial Monarchy. The last decade saw the first forming of Marxist and Agrarian Socialist parties in the country along with an attempted reformist coup against the monarchy; which though inscrutable from the outside, still maintains far flung consequence in the ethos of the carefully conspiring generals and young officers of the nation. No, the question is not will the Ethiopian Empire devolve into revolution, it is a matter of when - regardless of any reformative measures the Lion of Judah can take."
 IRE_OILCRISIS_DESC: ""
 SUEZCRISIS_DESC: "The world is once again close to a total war. As Gamal Abdel Nasser has nationalized the Suez canal, some nations are seeing this as a conflict of interest. The British and the French see it as a threat to their empires. However, Israel might also get on board with the plan given their tensions with the Arab states. The question is, What happens next?"
 Argentina_1949_desc: "After the end of the Infamous Decade, the approval of women's suffrage, and the election of Perón, Argentina seems to be on course to democracy. Perón is midway through his presidency, and already it seems that he will transform the Argentine economy and its people and cement his political legacy for decades to come."
 Argentina_1949: "アルゼンチン共和国"
 North_Vietnam_1949_desc: "Vietnam has been abandoned by the French. All attempts at independence have failed. Bao Dai, the Japanese collaborator, is the enemy of the Viet Minh once more. The blood spilled in the razing of Hanoi by Chinese imperialists will be repaid in French blood. Vietnam's struggle is now one against Western imperialism, and Ho Chi Minh now looks towards communism to win his battles."
 North_Vietnam_1949: "ベトナム民主共和国"
 France_1949_desc: "France is heavily split. From the Renault Strike in 1947 to the bread riots of Le Mans and Verdun and the occupation of communist newspapers, the country is ready to fall into chaos. It must also face rebellions in Madagascar and Indochina, all while ensuring that the Métropole does not fall into rebellion as well. Rationing and strikes have characterized France thus far, but it is impossible to endure such privation forever. Will France and her empire endure or fall?"
 France_1949: "République française"
 Spain_1949_desc: "The Second World War was traumatic to Spain. Francisco Franco watched as his fellow fascists fell in battle against the Allies. The Falange still controls the Spanish population, and with the beginning of the Cold War, it is unlikely if anything in Spain will change. Authoritarianism has kept Spain stable yet isolated, and few want change, but there is always the chance of change."
 Spain_1949: "Estado Español"
 Greece_1949_desc: "The Kingdom of Greece lies in the crosshairs of East and West alike. The machinations of the foreign powers have left Greece, already weakened by the scars of the Nazi occupation, to barrel into what has become a three year long civil war. With her very existence threatened by the Soviet-backed communist rebels, the Kingdom must rally the people and bring peace to the nation before it is too late."
 Greece_1949: "Vasíleion tis Elládos"
 ROC_1949_desc: "For eight long years, the Chinese people fought tooth and nail to expel the Japanese imperialists. Now our nation is threatened once more. The Soviet-backed Communists under the traitorous Mao Zedong broke the United Front and have taken large swathes of the country. The situation is dire, and already the red bandits lay siege to Shanghai. The coming months shall decide whether all Dr. Sun fought for will endure."
 ROC_1949: "Zhōnghuá Mínguó"
 Italy_1949_desc: "The feverish pitch after the death of Mussolini has subsided. The abolition of the monarchy in 1948 has given the Italian Republic a spirit of hope and freedom, but many questions remain unanswered about her future. Italy is politically divided, with the communists and fascist remnants alike threatening her young democracy. Italy's future is uncertain, but sure to be chaotic."
 Italy_1949: "Repubblica Italiana"
 Iran_1949_desc: "Iran suffered from Anglo-Soviet occupation for five years. The Shah, Mohammad Reza Pahlavi, became the British-endorsed replacement for his father. The mild Shah would do little in his first years in power, leading to the creation of a loose democratic body. The prime minister now holds considerable power, with the Shah sidelined from politics. As Iran enters the Cold War, will it do so under the vision of the Majlis, the Shah, or new forces entirely?"
 Iran_1949: "Kešvar-e Šâhanšâhi-ye Irân"
 Finland_1949_desc: "Finland's independence and international position since the end of World War II have been described as unique and baffling. The harsh Treaty of Paris left Finland in the Soviet sphere, forced to give up territory and lease ports to the Red Navy. Despite this extreme Soviet pressure, Finland has maintained a democratic government. Finland must tread the coming years carefully, and decide whether Moscow's threats or its democratic values matter more."
 Finland_1949: "Suomen tasavalta"
 Nicaragua_1949_desc: "Nicaragua is a nation with a rich and troubled history. Under the Somoza dictatorship, Nicaragua faces US meddling, social strife, and guerrilla warfare. The opposition to Somoza, inspired by the anti-imperialist hero Sandino, fight for social justice and national sovereignty. Nicauragua is caught between two worlds, and the rising flames are unavoidable."
 Nicaragua_1949: "República de Nicaragua"
 Cambodia_1949_desc: "With the end of the World War, Cambodia has gained a measure of autonomy from her French masters. As the nation takes its first steps toward independence, the future remains uncertain. Will the people rally around the young king, or choose their own path as colonialism begins to crumble?"
 Cambodia_1949: "Preăh Réachéanachâkr Kâmpŭchéa"
 Morocco_1949_desc: "The Kingdom of Morocco is a protectorate kept on a short leash by the French. Under the charismatic king, Mohammed V, the people of Morocco have taken their first steps toward independence, at the cost of increasing anger from Paris. The nation stands at a crossroads, and as tensions rise between the King and his French masters, can Morocco ever hope to secure her long-desired freedom?"
 Morocco_1949: "Protectorat français au Maroc"
 Saudi_Arabia_1949_desc: "The Kingdom of Saudi Arabia would have been unrecognizable only twenty years ago. The unification of the Arabian kingdoms under the banner of the House of Saud and the subsequent discovery of oil by American prospectors in 1933 has brought the desert kingdom unprecedented prosperity. King Abdulaziz has ruled wisely, spending his oil profits on the development of the nation, but he grows older by the day. Will his successors maintain his wisdom?"
 Saudi_Arabia_1949: "al-Mamlaka al-ʿArabiyya as-Suʿūdiyya"
 Rhodesia_1949_desc: "The Colony of Southern Rhodesia enjoys the privilege of self-government, of course limited to the white minority. Recently, talks of forming a federation with Northern Rhodesia and Nyasaland have started to gain steam, and it seems only a matter of time before Parliament allows negotiations to begin."
 Rhodesia_1949: "Colony of Southern Rhodesia"
 Ghana_1949_desc: "The resource-rich Colony of the Gold Coast played an important role in supplying Britain during the war, and has gained some measure of autonomy as a result. With a byzantine, decentralized administration and increasing agitation from the native population, the Gold Coast must tread carefully in the coming years."
 Ghana_1949: "Colony of the Gold Coast"
 Red_Malaya_1949_desc: "Since the early 19th century, the Malayan peninsula has been under the complete domination of Great Britain and the feudal lords who pay their tribute to London. While Britain has promised independence and reform, the communists under Chin Peng have decided to take action now rather than later, and the power of their insurgency grows with each passing day. Will the revolution prevail?"
 Red_Malaya_1949: "Tentera Pembebasan Nasional Malaya"
 Afghanistan_1949_desc: "Afghanistan, the Graveyard of Empires, remained out of the Second World War. The quiet mountain kingdom has remained stuck in time for centuries, but in recent years has transitioned to a constitutional monarchy and began a campaign of modernization. Yet in a nation where the tribes are as many as the mountains, not all agree with the King and his ministry. The Barakzai dynasty faces a great challenge indeed."
 Afghanistan_1949: "Dǝ Afġānistān Šahi Dawlat"
 Qatar_1949_desc: "The little Kingdom of Qatar is a British protectorate. Isolated and backwards, Qatar has seen new hope with the discovery of oil a decade ago. With the profits largely going to London, perhaps it is time the Qataris choose their own destiny, whether under the Al-Thani dynasty or otherwise."
 Qatar_1949: "Dawlat Qaṭar"
 Sweden_1949_desc: "Sweden remained neutral as the world was set ablaze by war, and remains neutral still. The division of the world between West and East complicates this matter. However much Sweden would like to focus on internal development, the Swedish people must choose between realizing the dream of \"Folkhemmet\" or preparing the nation for the possibility of a war even worse than the last."
 Sweden_1949: "Konungariket Sverige"
 Turkey_1949_desc: "For hundreds of years, the Turks ruled over the mighty Ottoman Empire, but in the aftermath of its collapse in the Great War, Mustafa Kemal Atatürk declared a new Turkish republic, firmly secular, nationalist, and committed to democratic and western values. Turkey has remained true to Kemalism in the years since his death, but pressure from both the Western Allies and the Soviet Union is rising. Soon, Turkey must pick a side, or be left in the dust."
 Turkey_1949: "Türkiye Cumhuriyeti"
 Burma_1949_desc: "Burma regained its independence after the Second World War, but her first years of freedom have been challenging to say the least. Ethnic separatists and communist rebels threaten to set the fragile government in Rangoon ablaze. Whether Burma itself will survive, let alone the government, remains to be seen."
 Burma_1949: "Pranyhtaungcu Mranma Nuingngamtau"
 PLA_of_Burma_1949_desc: "The Red Flag Communist Party, led by the red general Thakin Than Tun, was one of the leaders of the resistance against Japanese occupation. With Burma now independent, Tan Tun's communists have taken up arms against the central government, who they see as not sufficiently socialist. Were they to succeed, Burma would fall firmly within the Communist Bloc."
 PLA_of_Burma_1949: "Alanni Konmyunit Pahti"
 Lebanon_1949_desc: "Lebanon became independent in 1943, but its woes have not ended since. \"Greater Lebanon\" was a ultimately creation of French colonialists, and the nation lies divided between Sunnis, Shias, Maronites, Armenians, and a myriad other religious and racial groups all vying for domination of the small and fragile country. To avoid civil war and save Lebanese democracy would take a miracle."
 Lebanon_1949: "al-Jumhūriyyah al-Lubnāniyyah"
 Yemen_1949_desc: "On the shores of the Red Sea, the Mutawakkilite Kingdom of Yemen is stuck in the medieval era. The tyrannical and unpredictable rule of King Ahmad bin Yahya has made few friends and many enemies, among them his British masters who cannot stand his constant claims to the Aden protectorate and his dreams of \"Greater Yemen\"."
 Yemen_1949: "al-Mamlakah al-Mutawakkilīyah al-Yamanīyah"
 Libya_1949_desc: "Since the end of Italian rule over Libya, Idris I as-Senussi has ruled the Emirate of Cyrenaica with a steady hand and an ambition to unite all of Libya under his rule, a proposition not shared by France and Britain. Only recently liberated from colonialism, Cyrenaica now faces the threat of colonialism once more from its supposed allies, and the Emir's dream of a united Libya could very well slip away."
 Libya_1949: "Imarat Cirenaiciya"
 Bahrein_1949_desc: "The Kingdom of Bahrain is barely noticeable on a map, but the discovery of oil in 1929 and its strategic importance on the Persian Gulf have made it all too important for its British masters. While Bahrain might prefer independence, the age-old and still very active Iranian claim to its territory means that its relationship to Britain is a necessary evil. Until Iran abandons such notions, the status quo will remain."
 Bahrein_1949: "Mamlakat al-Baḥrayn"
 Pakistan_1949_desc: "When British rule over India ended in 1947, the old Raj was divided into Hindu India and Muslim Pakistan. The resulting killed thousands and displaced millions more, but in the end the Muslims of the Indian subcontinent now have a nation to call their own. The new nation, like its Indian rival, suffers from poverty, division, and an uncertain future as the world splits in two."
 Pakistan_1949: "Mumlikāt-ē Pākistān"
 Jordan_1949_desc: "Jordan left the 1948 Arab-Israeli war beaten, but not defeated. The Hashemite Kingdom of Jordan now stands as an independent state, and is committed to maintaining its newfound freedom. The question of how to approach Israel remains. King Abdullah is open to formal peace talks, while many among the people and especially the Palestinians in the Jordanian-administered West Bank have no desire for compromise."
 Jordan_1949: "ヨルダン・ハシミテ王国"
 Iceland_1949: "アイスランド"
 Iceland_1949_desc: "Iceland went into the World War as part of the Danish Realm and came out of it an independent republic. Although the small island nation hoped a return to pacifist neutrality following the end of the war and the Allied occupation, the signing of the North Atlantic Treaty by the three party coalition government made Iceland a part of brewing global conflict. With a stagnating economy, concerned populace and a need to protect itself in an ever polarizing world; Iceland must choose where their allegiance lies carefully, or risk losing their hard sought independence."
 Sarawak_1949: "サラワク直轄植民地"
 Sarawak_1949_desc: "Once a tranquil territory under the rule of the Brooke Dynasty, Sarawak became a Crown Colony after World War II, marked by a devastating Japanese occupation. The war shattered Sarawak's fragile infrastructure, and the post-war years brought sweeping changes under British administration, aiming to modernize and stabilize the region. Yet, the legacy of colonialism and the rise of anti-imperialist sentiments have sparked growing discontent among its diverse population of Malays, Dayaks, Chinese, and others. As Sarawak transitions into a new era, questions loom over its future. Will the colony remain loyal to the Crown, or will nationalist movements push it toward independence and self-determination?"
 Brunei_1949: "ブルネイ国"
 Brunei_1949_desc: "A tiny yet oil-rich sultanate, Brunei has long balanced tradition and modernity under the protective gaze of the British colonial authorities. During World War II, Japanese occupation disrupted its relative peace, leaving scars that lingered even as British rule was restored. Today, Brunei enjoys economic stability thanks to its vast petroleum reserves; but the Sultanate faces growing internal and regional pressures. Caught between preserving its monarchy, navigating modernization and addressing rising calls for political reform; Brunei must decide: Will it cling to tradition, or adapt to the winds of change sweeping Southeast Asia?"
 Paraguay_1949: "パラグアイ共和国"
 Paraguay_1949_desc: "Paraguay enters the cold war battered by decades of turmoil. The Second Paraguayan Civil War, the grueling Chaco War, and the pro-Nazi sympathies of former President Higinio Morínigo have left the nation deeply fractured. The fall of Morínigo led to the short-lived presidency of Juan Natalicio González, who was swiftly overthrown, ushering in a period of instability where Presidents come and go in mere months. Now, Felipe Molas López holds the reins, but few believe he will last much longer. The question remains: will Paraguay stabilize under democracy, fall into dictatorship, or spiral into something even darker?"
 COUNTRY_SELECTION_CHARACTER_DESC: "$NAME|Y$\n$TRAITS_DESC|$"
 Indonesia_1949: "インドネシア共和国緊急政府"
 Indonesia_1949_desc: "Indonesia embarked on a challenging four-year fight for independence against Dutch colonial rule. The signing of the Roem van Roijen Agreement marked a significant turning point, allowing the nation to glimpse the possibility of sovereignty after years of struggle. This agreement aimed to pave the way for a peaceful resolution, but the road ahead remained fraught with uncertainty. Will Indonesia successfully secure its hard-won independence, or will external pressures and internal conflicts threaten to undermine this fledgling nation’s aspirations for self-determination?"
 Dutch_East_Indies_1949: "オランダ領東インド"
 Dutch_East_Indies_1949_desc: "Nations come and go, but some treasures are fiercely guarded until the end. This metaphor applies to the Dutch East Indies, where the Netherlands and the Netherlands-Indie Civil Administration fought for four years over control of the Indonesian Archipelago. What began as a colonial war escalated into an international conflict, with pressure from the United Nations and the United States urging the Netherlands to end the war and recognize the newly independent Indonesia. Despite this, the Dutch did not relent and launched a second offensive, putting Indonesia in a precarious situation. Will the Dutch ultimately succeed in retaining control, or will the Netherlands finally let go of her treasure?"
 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$"