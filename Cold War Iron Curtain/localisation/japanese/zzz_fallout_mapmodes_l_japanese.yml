 MAPMODE_FALLOUT_WAR_SUPPORT_MAP_MODE_NAME: "$fallout_war_support_map_mode$"
 MAPMODE_FALLOUT_WAR_SUPPORT_MAP_MODE_DESCRIPTION: "Shows how much war support each country has."
