 MAPMODE_FALLOUT_STABILITY_MAP_MODE: "§Y$fallout_stability_map_mode$§! $MAPMODE_CONSTANT$"
 MAPMODE_FALLOUT_STABILITY_MAP_MODE_NAME: "$fallout_stability_map_mode$"
 MAPMODE_FALLOUT_STABILITY_MAP_MODE_DESCRIPTION: "Shows how much stability each country has."
 fallout_stability_map_mode_tooltip: "§Y[From.Controller.GetNameWithFlag]§! currently has a stability of §Y[?From.Controller:stability|2%]§!."
