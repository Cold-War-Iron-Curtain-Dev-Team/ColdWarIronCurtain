 TUTOR_military_203: "陸軍"
 TUTOR.203.t: "陸軍"
 TUTOR_military_203_desc: "§Y陸軍§!は他の分野に比べ特別に重要であるという訳ではありません、しかし最も複雑で、軍の根幹を成します。\n\n§C歩兵§!\n§Y歩兵§!は陸軍の中心となり、§Y組織率§!と§Y耐久力§!を陸軍へ提供します。§Y自動車化歩兵§!はさらに高い§Y組織率§!と§Y耐久力§!を持ちます。§Y歩兵戦闘車や重装甲化歩兵§!は最も装甲化されていて、戦闘力に追加の値を持ちます。§Y航空騎兵§!は最速であり、§Y突破§!、§Y防御§!値も最も高いです。§Y装甲兵員輸送車や装甲化歩兵§!は快速で良好な装甲化率を持ちます。\n\n§C戦車、装甲車§!\n§Y戦車§!は大量の§Y突破§!と§Y防御§!と良好な戦闘力を持ち、さらに極めて堅固です。§Y駆逐戦車と機動戦闘車§!は§Y戦車§!と似た働きをしますが、より強力な対戦車攻撃力と弱い対人攻撃力を持ち、また装甲は薄いです。§Y攻撃ヘリ§!は万能で極めて強力ですが、§Y師団§!につき一つの§Y支援中隊§!としてのみ展開できます。これらの部隊を大量に活用することをおすすめします。\n\n§Y火力支援§!\n§Y火力支援§!は様々なものがあり、師団の攻撃力の大部分を担います。§Y軽、中、重§!野戦砲は防御、攻撃、そして純粋な打撃にそれぞれ最適化されています。§Y機関砲§!は§Y対空§!戦闘能力をもたらし、少量の§Y防御§!と対人攻撃力を持ちます。§Y自走式対空ミサイルシステム§!は§Y機関砲§!に似ていますが、§Y対空§!戦闘能力のみを持ち、また大量の人的資源を必要とします。§Y直射砲§!は高い§Y貫徹§!と対戦車攻撃力をもたらしますが、対人攻撃力には乏しいです。§Y対戦車ミサイルや自走式対戦車ミサイル§!も同様に働きますが、より高価で、装甲目標の§Y貫徹§!と攻撃により偏重しています。\n\n§C支援中隊§!\n§Y支援中隊§!は中隊スロットに入り、追加の§Y火力支援§!大隊のように機能し軍に特殊な能力と補正を与えます。§Y支援中隊§!§B技術§!ツリーには多様で機動化された強力な§Y支援中隊§!が存在します。§Yヘリコプター§!は遙かに強化された部隊です。"
 TUTOR.203.d: "§Y陸軍§!は他の分野に比べ特別に重要であるという訳ではありません、しかし最も複雑で、軍の根幹を成します。\n\n§C歩兵§!\n§Y歩兵§!は陸軍の中心となり、§Y組織率§!と§Y耐久力§!を陸軍へ提供します。§Y自動車化歩兵§!はさらに高い§Y組織率§!と§Y耐久力§!を持ちます。§Y歩兵戦闘車や重装甲化歩兵§!は最も装甲化されていて、戦闘力に追加の値を持ちます。§Y航空騎兵§!は最速であり、§Y突破§!、§Y防御§!値も最も高いです。§Y装甲兵員輸送車や装甲化歩兵§!は快速で良好な装甲化率を持ちます。\n\n§C戦車、装甲車§!\n§Y戦車§!は大量の§Y突破§!と§Y防御§!と良好な戦闘力を持ち、さらに極めて堅固です。§Y駆逐戦車と機動戦闘車§!は§Y戦車§!と似た働きをしますが、より強力な対戦車攻撃力と弱い対人攻撃力を持ち、また装甲は薄いです。§Y攻撃ヘリ§!は万能で極めて強力ですが、§Y師団§!につき一つの§Y支援中隊§!としてのみ展開できます。これらの部隊を大量に活用することをおすすめします。\n\n§Y火力支援§!\n§Y火力支援§!は様々なものがあり、師団の攻撃力の大部分を担います。§Y軽、中、重§!野戦砲は防御、攻撃、そして純粋な打撃にそれぞれ最適化されています。§Y機関砲§!は§Y対空§!戦闘能力をもたらし、少量の§Y防御§!と対人攻撃力を持ちます。§Y自走式対空ミサイルシステム§!は§Y機関砲§!に似ていますが、§Y対空§!戦闘能力のみを持ち、また大量の人的資源を必要とします。§Y直射砲§!は高い§Y貫徹§!と対戦車攻撃力をもたらしますが、対人攻撃力には乏しいです。§Y対戦車ミサイルや自走式対戦車ミサイル§!も同様に働きますが、より高価で、装甲目標の§Y貫徹§!と攻撃により偏重しています。\n\n§C支援中隊§!\n§Y支援中隊§!は中隊スロットに入り、追加の§Y火力支援§!大隊のように機能し軍に特殊な能力と補正を与えます。§Y支援中隊§!§B技術§!ツリーには多様で機動化された強力な§Y支援中隊§!が存在します。§Yヘリコプター§!は遙かに強化された部隊です。"
 TUTOR_military_204: "空軍"
 TUTOR.204.t: "空軍"
 TUTOR_military_204_desc: "§Y空軍§!は敵国の建造物や§Y海軍§!を離れた所から壊滅させ、§Y陸軍§!の戦闘に極めて有利に働く部門です。§Y軽航空機§!はほぼ全ての任務を行えますが、そのどれにおいても能力は高くはありません。費用対効果の面ではこれらの航空機は最も有用ですが、裕福な国家が大量に大きな航空機を展開してきた場合は§R簡単に八つ裂きにされてしまうでしょう§!。展開の早い現代戦における重要性から、CWICでは空輸任務は§C指揮力§!を消費しません。存分に活用してください。\n\n§C空対空戦闘§!\n§Yマルチロール機§!は一貫して§Y制空§!任務を行い、敵機を自動で攻撃したり、地上部隊へボーナスを与えたりできます。§Y迎撃機§!は対空戦闘に特化した戦闘機であり、§Y制空§!任務によって地上部隊の戦闘に貢献することはできず、他の航空機を攻撃するのみです。§Y超音速迎撃機§!は敵の§Y爆撃機§!や§Y輸送機§!を破壊する防衛的な§Y迎撃§!任務に専門化した機種であり、世界中のどこにでも素早く展開できます。\n\n§C航空支援§!\n§Y近接航空支援機§!や§Yマルチロール機§!と§Y戦術爆撃機§!は戦闘中の敵の§Y地上部隊§!に大打撃を与える§YCAS（近接航空支援）§!任務のために配備することができます。特化された§Y近接航空支援§!ユニットは費用対効果が最も良いでしょう。\n\n§C爆撃§!\n§Y戦略爆撃機§!と§Y戦術爆撃機§!は§Y空爆§!任務により敵の建造物や構造物を破壊できます。機体を守るためには§Y制空§!任務を受けた航空機によって護衛する必要があります。§Y対艦攻撃機§!は艦隊や港湾の艦艇を高い効率で爆撃することができます。§Y超音速爆撃機§!はより高い速度、航続距離、生存性を持ちます。§Y原子力爆撃機§!の航続距離は地球規模です。\n\n§Cミサイル§!\n§Y巡航ミサイル§!と§Y弾道ミサイル§!は§Y空港§!の長距離ミサイルランチャーに配備される強力な使い捨て兵器です。ほぼ全ての任務をこなし、すぐに壊滅的な被害を敵にもたらすでしょう。§Y弾道ミサイル§!は核弾頭を搭載できます。\n\n§C輸送機§!\n§Y輸送機§!は§Y空挺兵§!の投下と、§Y空港§!を持つ地域の§Y補給上限§!を一定の割合で一時的に上昇させる§Y空輸§!任務のために使用されます。"
 TUTOR.204.d: "§Y空軍§!は敵国の建造物や§Y海軍§!を離れた所から壊滅させ、§Y陸軍§!の戦闘に極めて有利に働く部門です。§Y軽航空機§!はほぼ全ての任務を行えますが、そのどれにおいても能力は高くはありません。費用対効果の面ではこれらの航空機は最も有用ですが、裕福な国家が大量に大きな航空機を展開してきた場合は§R簡単に八つ裂きにされてしまうでしょう§!。展開の早い現代戦における重要性から、CWICでは空輸任務は§C指揮力§!を消費しません。存分に活用してください。\n\n§C空対空戦闘§!\n§Yマルチロール機§!は一貫して§Y制空§!任務を行い、敵機を自動で攻撃したり、地上部隊へボーナスを与えたりできます。§Y迎撃機§!は対空戦闘に特化した戦闘機であり、§Y制空§!任務によって地上部隊の戦闘に貢献することはできず、他の航空機を攻撃するのみです。§Y超音速迎撃機§!は敵の§Y爆撃機§!や§Y輸送機§!を破壊する防衛的な§Y迎撃§!任務に専門化した機種であり、世界中のどこにでも素早く展開できます。\n\n§C航空支援§!\n§Y近接航空支援機§!や§Yマルチロール機§!と§Y戦術爆撃機§!は戦闘中の敵の§Y地上部隊§!に大打撃を与える§YCAS（近接航空支援）§!任務のために配備することができます。特化された§Y近接航空支援§!ユニットは費用対効果が最も良いでしょう。\n\n§C爆撃§!\n§Y戦略爆撃機§!と§Y戦術爆撃機§!は§Y空爆§!任務により敵の建造物や構造物を破壊できます。機体を守るためには§Y制空§!任務を受けた航空機によって護衛する必要があります。§Y対艦攻撃機§!は艦隊や港湾の艦艇を高い効率で爆撃することができます。§Y超音速爆撃機§!はより高い速度、航続距離、生存性を持ちます。§Y原子力爆撃機§!の航続距離は地球規模です。\n\n§Cミサイル§!\n§Y巡航ミサイル§!と§Y弾道ミサイル§!は§Y空港§!の長距離ミサイルランチャーに配備される強力な使い捨て兵器です。ほぼ全ての任務をこなし、すぐに壊滅的な被害を敵にもたらすでしょう。§Y弾道ミサイル§!は核弾頭を搭載できます。\n\n§C輸送機§!\n§Y輸送機§!は§Y空挺兵§!の投下と、§Y空港§!を持つ地域の§Y補給上限§!を一定の割合で一時的に上昇させる§Y空輸§!任務のために使用されます。"
 TUTOR_military_205: "海軍"
 TUTOR.205.t: "海軍"
 TUTOR_military_205_desc: "§Y海軍§!は§Y軍§!の中では少し複雑な部門で、船の級と海軍戦術の微妙なバランスを含みます。\n\n§C海軍戦闘§!\n艦艇には大きく4つの種類があります。§Y直衛艦§!、§Y戦列艦§!、§Y空母§!、そして§Y潜水艦§!です。§Y直衛艦§!は§Y海軍§!の基礎となる艦種で、数を揃えることでより少ない§Y戦列艦§!が薄く展開してしまうのを防ぐ役割を果たします。CWICでは、§Y戦列艦§!を護ることを必要不可欠にするために、砲撃や§Y魚雷§!は致命的なまでに大量に投射されます。§Y戦列艦§!は§Y直衛艦§!に比べさらに大量のダメージを§Y耐久値§!へ与えるためより強力です。高い火力に加え、敵の§Y戦列艦§!が§Y空母§!を直接攻撃するのを防ぐ役割も持ちます。§Y空母§!は敵の艦艇を攻撃するために§YVTOL機§!と§Yマルチロール艦載機§!を、敵の艦艇を攻撃し陸上部隊を支援するために§YCV CAS§!を、そして§Y空母§!と§Y戦列艦§!を敵の§Y潜水艦§!から護るために§Y対潜哨戒§!ヘリコプターを搭載できます。§Y潜水艦§!は探知されないように行動し、対潜装備による発見をかいくぐった場合は敵の§Y戦列艦§!と§Y空母§!を直接攻撃します。それに加え、§Y弾道ミサイル潜水艦§!（MTGでの§YSingle Large§!及び§YDouble large§!船体）は§YSLBM§!と§Y巡航ミサイル§!を搭載し、地上部隊や艦艇への攻撃を実行できます。§Y魚雷§!は§Y戦列艦§!と§Y空母§!を直接攻撃でき、大きな被害をもたらします。§Y中型魚雷§!はさらに§Y潜水艦§!も攻撃できます。\n\n§C輸送艦§!\n§Y貿易§!、§Y陸軍の輸送§!、§Y補給§!に不可欠な§Y輸送艦§!は、地続きの戦争においてすら海戦が勝敗を分ける決定打となる主な要因です。護衛されていない§Y輸送船§!は§Y潜水艦§!に簡単に沈められてしまうでしょう。輸送艦は海戦画面においては§Y空母§!の列に現れ、§Y直衛艦§!と§Y戦列艦§!に護られます。\n\n§Cモジュール§!\nMTGを導入している場合、様々な§Yモジュール§!が存在します。\n§Y対空砲§!と§Y対空ミサイル§!は§Y機関砲§!と§Y対空ミサイル§!の§B技術§!によってそれぞれ研究されます。\n§Y砲弾§!は高貫通、低破壊力の兵器で、§Y対艦ミサイル§!は低貫通、高破壊力の兵器です。§Y装甲§!によって、§Y対艦ミサイル§!を大量に抱え§Y砲弾§!を欠いた船は簡単に無力化されてしまうでしょう。\n§Y防衛装備§!は§G極めて安価§!であるため、§B研究§!と配備により§Y装甲§!を少し上昇させるために合理的です。§YCIWC§!は§R圧倒的に高価であり、特に£resources_strip|2 は無視できません§!が、高い§Y装甲§!をもたらします。もし艦艇の§Y装甲§!が敵の貫通を少しでも上回る場合、受けるダメージは§R非常に少なく§!なります。\n§Y洋上モジュール§!は§Y洋上スロット§!に装備されます。§YTAとFCS§!は対空戦闘で良好なダメージを与え、兵装の全体的な攻撃力を上昇させるために必要です。§YEWとSS§!は船の§Y探知§!を向上させます。§Y航行§!は船の§Yステルス性§!を上昇させ、探知を避けたり複雑で狭い海域での戦闘にボーナスを与えたりします、§Yソナー§!は§Y潜水艦§!を発見するために使用されます。\n\n§C特殊兵装§!\nほとんどの船は§Y特殊兵装§!モジュールスロットを持ちます。これらは全て様々な利益を与えるため、注意して装備を選んでください。\n\n§C原子力エンジン§!\n§Y原子力エンジン§!は§B核・大量破壊兵器§!タブで研究され、§G一切の燃料を使いません§!。また高い§Y信頼性§!を持ち、航行中や戦闘中に故障する確率は遙かに低いです。"
