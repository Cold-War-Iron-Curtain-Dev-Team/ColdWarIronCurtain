 TUTOR.1062.t: "技術"
 TUTOR.1062.d: "§C電子工学§!\n§Yトランジスタ§!：スーパーコンピューターの前提条件\n§Yスーパーコンピューター§!：研究速度\n§Yハードウェア§!：多くの技術とほぼ全ての軍事技術の前提条件\n§Yソフトウェア§!：様々なボーナスの詰め合わせ\n§Yインターネットと通信§!：指揮力の最大値と増加量（及び未実装の電気通信）\n§Y電化製品§!：オフィスパークからの収益\n§Y暗号技術§!：情報\n§Yレーダー§!：レーダー基地の最大レベルと様々なボーナスの詰め合わせ\n\n§C核§!\n§Y原子力発電所§!：原子力発電所の生産量と生産効率"
 TUTOR_economics_107: "装備の購入"
 TUTOR.107.t: "装備の購入"
 TUTOR_economics_107_desc: "§Y装備の購入§!では§Y資金§!を用いて軍のための装備を購入できます。§G1x§!の購入では1年のクールタイムが存在し、即時に装備を入手することができます。それより多くの§Y装備の購入§!においては§Y製造者§!が売却する分の装備を生産するための時間がかかります。\n\n§C民間市場§!\n§Y民間市場§!は誰でも購入できる開かれた統一市場です。ここでは§Y支援装備§!や§Y自動車装備§!、§Y輸送機§!といった民生品を購入することができます。これらは一般に安価で戦闘には用いられず、そして§Y民間§!§Y企業§!が主要な生産者である商品です。\n\n§C購入契約§!\nそれぞれの§Y軍の装備§!や§Y兵器§!は1tier（低、中、高）につき1つだけしか§Y購入契約§!を結べません。§Y購入契約§!を交渉するためには、§Y契約交渉§!ボタンを押し§Y製造者§!を選んでください。§Y100から300§!の§Y政治力§!を消費して契約を結ぶことができます。また§Y高tier契約§!を§Y最高tier契約§!へと上昇させ§Y空母や巡洋艦、ジェット艦載機§!を購入することもできます。§Y製造者§!によっては他よりも高い§Y技術レベル§!を持ち、より高品質な装備を購入できる場合もあります。"
