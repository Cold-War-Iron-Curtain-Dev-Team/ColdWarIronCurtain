 TUTOR_military_202: "特殊部隊と装備の新規配備"
 TUTOR.202.t: "特殊部隊と装備の新規配備"
 TUTOR_military_202_desc: "§Y特殊部隊§!は様々な地形での戦闘において、ドクトリンとは異なる無数のボーナスを与える§B技術§!群です。§Y海兵隊§!などの§Y突撃部隊§!の戦闘力を上げたり、極めて強力な§Y特殊部隊§!§Y支援中隊§!の能力を向上させたりできます。通常の大隊に加え、§Y機械化海兵や空挺部隊§!、§Y騎兵§!、そして§Y航空騎兵§!はこの技術ツリーによって解禁されます。ほとんどの§Y弾薬§!や§Y歩兵用支援装備§!は自動では配備されず、ボーナスを享受するためには§Y新規配備ディシジョン§!の実行が必要です。\n\n§C特殊部隊§!\n§Y特殊部隊§!は、通常の白兵戦には関わりませんが、様々な地形での陸軍の戦闘に大きなボーナスをもたらす§B技術§!群です。§Y海兵隊§!や§Y空挺部隊§!、§Y山岳兵§!といった§Y突撃部隊§!は§Y特殊部隊§!のボーナスに依存します。§Y特殊部隊§!には3つのそれぞれに対応したツリーと、量と質のどちらかに集中する排他的な§Y特殊な戦術と訓練§!の§B技術§!ツリーが存在します。\n§Y山岳、極値戦闘§!は寒冷地や山岳での戦闘にボーナスを与えます。§Y砂漠戦闘§!は酷暑地で同様に働きます。§Y上陸戦§!は§Y強襲上陸§!を行う際や§Y海兵隊§!の能力値にボーナスを与えます。§Y上陸用舟艇§!は§Y強襲上陸§!の速度や可能師団数を上昇させる。§Y空挺降下作戦§!は§Y空挺兵§!にボーナスを与えるでしょう。§Y陸軍、海軍、空軍特殊部隊§!は戦線後方で§Y特殊作戦§!を実行し師団に全体的なボーナスを与える支援中隊である強力な§Y特殊部隊§!を解禁、強化します。\n\n§C新規配備§!\n§Y歩兵用支援装備§!と§Y弾薬§!§B技術§!は自動でボーナスを与える訳ではありません。代わりに、これらの技術は§Y新規配備ディシジョン§!を解禁し、このディシジョンによって新しい装備を配備する必要があります。さらに、§Y指揮力§!を用いて配備を速めることもできます。§Y軍需工場§!に比べ大量の§Y師団§!が展開している場合、新規配備には時間がかかります。そのため、細切れの§Y師団§!を大量に配備することには注意してください。"
