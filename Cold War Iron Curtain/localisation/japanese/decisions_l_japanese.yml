 TUTOR_military_209: "ドクトリン"
 TUTOR.209.t: "ドクトリン"
 TUTOR_military_209_desc: "§Yドクトリン§!は軍全体の戦略を規定し、プレイヤーのプレイスタイルを決定、支持するものです。§Yドクトリン§!は§R相互排他的§!で、変更はできます。（バグによって、ドクトリンの変更はクラッシュを引き起こします）\n\n§C空軍ドクトリン§!\nCWICには3つの§Y空軍ドクトリン§!が存在します。\n§Y汎用航空機§!ドクトリンは航空機の汎用性と維持の簡便性に注目したドクトリンです。§Yマルチロール機§!や§Y戦術爆撃機§!の作戦効率を高め、航空機生産ラインの種類を最小化しようとします。加えて、§G事故発生率や悪天候ペナルティを大幅に軽減します§!。\n§Y組織的戦争§!ドクトリンは§Y空軍§!の戦略的有用性に注目したドクトリンです。§Y戦略爆撃機§!と§Y制空戦闘機§!に大きなボーナスを与えます。戦略的破壊によって敵の戦争遂行能力を挫くことを目的としています。\n§Y戦術統合性§!は§Y汎用航空機§!や§Y組織的戦争§!ドクトリンとは逆のドクトリンです。§Y戦術統合性§!ドクトリンは攻勢中の陸軍や海軍を支援する空軍ユニットを強化します。また、§Y制空§!任務と§Y迎撃§!任務にもボーナスを与えます。"
 TUTOR.209.d: "§Yドクトリン§!は軍全体の戦略を規定し、プレイヤーのプレイスタイルを決定、支持するものです。§Yドクトリン§!は§R相互排他的§!で、変更はできます。（バグによって、ドクトリンの変更はクラッシュを引き起こします）\n\n§C空軍ドクトリン§!\nCWICには3つの§Y空軍ドクトリン§!が存在します。\n§Y汎用航空機§!ドクトリンは航空機の汎用性と維持の簡便性に注目したドクトリンです。§Yマルチロール機§!や§Y戦術爆撃機§!の作戦効率を高め、航空機生産ラインの種類を最小化しようとします。加えて、§G事故発生率や悪天候ペナルティを大幅に軽減します§!。\n§Y組織的戦争§!ドクトリンは§Y空軍§!の戦略的有用性に注目したドクトリンです。§Y戦略爆撃機§!と§Y制空戦闘機§!に大きなボーナスを与えます。戦略的破壊によって敵の戦争遂行能力を挫くことを目的としています。\n§Y戦術統合性§!は§Y汎用航空機§!や§Y組織的戦争§!ドクトリンとは逆のドクトリンです。§Y戦術統合性§!ドクトリンは攻勢中の陸軍や海軍を支援する空軍ユニットを強化します。また、§Y制空§!任務と§Y迎撃§!任務にもボーナスを与えます。"
 TUTOR_military_210: "反乱と占領"
 TUTOR.210.t: "反乱と占領"
 TUTOR_military_210_desc: "ゲームを通して、プレイヤーは§Rレジスタンス§!と向き合う必要があるでしょう。§Rレジスタンス§!は二種類存在します。\n\n§C反乱§!\n§Rレジスタンス§!の§C反乱§!は極めて危険で、政治的状況を脅かします。反乱は特定の地域に限られ、発生はスクリプトによって制御されています。彼らは§Yディシジョン§!システムを用いて発生し、対抗するためには大量の§Y政治力§!と§Y資金§!、§Y装備§!を必要とします。反乱の抑制に失敗した場合、§R反乱軍が国家に敵対する独立国として誕生したり、あるいは政体を変更したり§!します。この時に大量の§Y資源§!と土地、そして§Y装備§!や§Y空港§!といった軍の資産が失われるでしょう。\n\n§C非中核州でのレジスタンス§!\n§R非中核州でのレジスタンス§!は全ての§Y非中核州§!で発生する大規模な§Rレジスタンス§!です。§Y配備§!タブの§Y守備隊テンプレート§!によって抑圧されるため、10以上の幅を持ち費用対効果に優れた§Y守備隊テンプレート§!を優先して編成しておくことをおすすめします。§Y守備隊§!において師団幅は関係なく、§Y守備隊§!は師団に縛られず土地によって適当な配分で配置されます。編制は費用に対する制圧の値を高くすること、§R常に憲兵隊ユニットを組み込むこと§!を優先し編成してください。§Y戦車§!のような§Y戦闘車§!、また§Y野砲§!のような§Y火力支援ユニット§!は§Y守備隊§!においては無用の長物であり、組み込む必要はありません。§Y自動車化歩兵と機械化歩兵、航空騎兵§!は高い制圧値を持ちますが、航空機兵に関しては、人的資源の効率はいくらか優れているとはいえ費用対効果に乏しいです。§Rレジスタンス値の高い§!地域では、§Rレジスタンス§!は§Y守備隊§!を襲撃したり§Y建造物§!を破壊したり、あるいは§R独立を宣言§!したりします。§Rレジスタンス§!が§Y守備隊§!を攻撃する際には、資産を目的とする§Yレジスタンス作戦§!を実行します。§Y機関砲§!や§Y憲兵§!§B技術§!を研究しておくことで、§Yレジスタンス作戦§!の被害の抑制ができます。また、§Y守備隊§!の装甲化率が高いと§Yレジスタンス§!から受ける被害を減少させられます。"
 TUTOR.210.d: "ゲームを通して、プレイヤーは§Rレジスタンス§!と向き合う必要があるでしょう。§Rレジスタンス§!は二種類存在します。\n\n§C反乱§!\n§Rレジスタンス§!の§C反乱§!は極めて危険で、政治的状況を脅かします。反乱は特定の地域に限られ、発生はスクリプトによって制御されています。彼らは§Yディシジョン§!システムを用いて発生し、対抗するためには大量の§Y政治力§!と§Y資金§!、§Y装備§!を必要とします。反乱の抑制に失敗した場合、§R反乱軍が国家に敵対する独立国として誕生したり、あるいは政体を変更したり§!します。この時に大量の§Y資源§!と土地、そして§Y装備§!や§Y空港§!といった軍の資産が失われるでしょう。\n\n§C非中核州でのレジスタンス§!\n§R非中核州でのレジスタンス§!は全ての§Y非中核州§!で発生する大規模な§Rレジスタンス§!です。§Y配備§!タブの§Y守備隊テンプレート§!によって抑圧されるため、10以上の幅を持ち費用対効果に優れた§Y守備隊テンプレート§!を優先して編成しておくことをおすすめします。§Y守備隊§!において師団幅は関係なく、§Y守備隊§!は師団に縛られず土地によって適当な配分で配置されます。編制は費用に対する制圧の値を高くすること、§R常に憲兵隊ユニットを組み込むこと§!を優先し編成してください。§Y戦車§!のような§Y戦闘車§!、また§Y野砲§!のような§Y火力支援ユニット§!は§Y守備隊§!においては無用の長物であり、組み込む必要はありません。§Y自動車化歩兵と機械化歩兵、航空騎兵§!は高い制圧値を持ちますが、航空機兵に関しては、人的資源の効率はいくらか優れているとはいえ費用対効果に乏しいです。§Rレジスタンス値の高い§!地域では、§Rレジスタンス§!は§Y守備隊§!を襲撃したり§Y建造物§!を破壊したり、あるいは§R独立を宣言§!したりします。§Rレジスタンス§!が§Y守備隊§!を攻撃する際には、資産を目的とする§Yレジスタンス作戦§!を実行します。§Y機関砲§!や§Y憲兵§!§B技術§!を研究しておくことで、§Yレジスタンス作戦§!の被害の抑制ができます。また、§Y守備隊§!の装甲化率が高いと§Yレジスタンス§!から受ける被害を減少させられます。"
 TUTOR_military_211: "大量破壊兵器GUIの説明"
 TUTOR.211.d: "CWICは、新しい大量破壊兵器システムを導入し、バニラのクリック方式よりも複雑で戦略的な核兵器の使用を可能にしています。GUIには8つの基本パーツがあります。\n1.　左上の画面は、世界の核保有国、言い換えれば、誰が核武装したかを示しています。\n2.　デフコン画面は、デフコンのレベルを示すもので、アメリカ、ソ連、中華人民共和国のみで利用可能です。レベルを下げると、より高い緊張の段階を示すことになります。\n\n3.　GUIの真ん中には、バニラの核兵器からICBMまで、各種大量破壊兵器の保有数を表示しています。右端の化学兵器リストは製作途中で、非核化については……まあ、する人はいないでしょう。\n4.　3で説明した部分の下には、レベル1、2、3の3つのオプションがあり、それぞれ核兵器の使用量や目標が異なります。レベル1は、範囲内の敵の首都に対する基本的な攻撃です。レベル2は、レベル1に加え、人口や産業の中心地などを目標に追加したものです。レベル3は、完全な、全面的な核攻撃で、次の2つのうちの1つが必要です。ICBM技術、またはソ連とアメリカがそれぞれキューバとトルコにミサイルを保有していることです。\n5.　発射のためのすべての条件が満たされると、灰色で表示されている大きな核ボタンが赤くなり、地球規模の熱核戦争をプレイすることができるようになります。\n6.　大きなボタンの下には、攻撃に必要な核兵器のリストが表示されます。\n7.　その左側には、ストライキのための国家目標リストがあります。\n8.　その左側には、ミサイルの射程内にある敵国のリストが表示されます。\n\nこのシステムでバグや問題が発生した場合、遠慮なくsteamやdiscordで報告してください。\n\nそれでは、爆撃を楽しんで！"
