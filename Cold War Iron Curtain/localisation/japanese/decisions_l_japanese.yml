 TUTOR_politics_303: "陣営"
 TUTOR.303.t: "陣営"
 TUTOR_politics_303_desc: "CWICでの§Y陣営§!は少し異なる働き方をします。§YNATO§!のような§Y陣営§!は陣営加盟国が攻撃を受けたとき、あるいは§Y陣営盟主§!（§EU§!§WS§!§CA§!のような）が、§R第三次世界大戦§!のような特定のスクリプトされた§R戦争§!へ突入した場合にのみ活性化します。ほぼ全ての§Y陣営§!へ手動で参加することはできず、加盟には歴史的、あるいは架空歴史的なイベントや国家方針を通す必要があります。"
 TUTOR.303.d: "CWICでの§Y陣営§!は少し異なる働き方をします。§YNATO§!のような§Y陣営§!は陣営加盟国が攻撃を受けたとき、あるいは§Y陣営盟主§!（§EU§!§WS§!§CA§!のような）が、§R第三次世界大戦§!のような特定のスクリプトされた§R戦争§!へ突入した場合にのみ活性化します。ほぼ全ての§Y陣営§!へ手動で参加することはできず、加盟には歴史的、あるいは架空歴史的なイベントや国家方針を通す必要があります。"
 TUTOR_politics_304: "影響力"
 TUTOR.304.t: "影響力"
 TUTOR_politics_304_desc: "CWICの§Y影響力§!システムは、国家が他国にある程度の影響力を行使するために用いられます。\n\n§C影響力の獲得§!\n§Y影響力§!を獲得するためには、対象となる国家を選択し§Y政治力§!を用いて§Y影響力§!を上昇させる必要があります。§Y暗号レベル§!や§Y復号力§!はそれぞれどれだけ§Y影響力§!を得られるかや他国の影響に抵抗できるかに関わります。それに加え、一般に抱えた§Y債務§!は国家への債権者の§Y影響力§!を上昇させます。また、外国の軍事費を負担したり、債権を放棄した場合も他国への§Y影響力§!を上昇させられます。\n\n§C影響力との闘い§!\n§Y暗号レベル§!が高いと、他国が国家へ§Y影響力§!を持つのを（§Y債務§!を通したものを除き）困難にさせます。§Yディシジョン§!タブで他国の持つ§Y影響力§!を確認することができます。値が§Y15％§!を超えるとしばしば問題となり、§Y40%§!を超えると危険です。外国の§Y影響力§!と闘うために、§Y政治力§!を用いて直接他国の§Y影響力§!を減少させることと、§Y主権§!を主張して永続的に他国が§Y影響力§!を持ちづらくすることの二つが可能です。\n\n§C影響力の行使§!\n全ての国家は様々な強度で他国における§Y影響力§!を行使することができます。これには他国の§Y資源§!を搾取することや、§Y経済§!を部分的に統制すること、あるいは§R影響力が十分に高い場合は他国を傀儡化すること§!さえも含まれます。しかし、§Y国際通貨基金§!のようないくつかの非国家主体は§Y財政、社会政策§!の変更を求め、有害であったり有益であったりする§Y国家精神§!を追加するでしょう。"
 TUTOR.304.d: "CWICの§Y影響力§!システムは、国家が他国にある程度の影響力を行使するために用いられます。\n\n§C影響力の獲得§!\n§Y影響力§!を獲得するためには、対象となる国家を選択し§Y政治力§!を用いて§Y影響力§!を上昇させる必要があります。§Y暗号レベル§!や§Y復号力§!はそれぞれどれだけ§Y影響力§!を得られるかや他国の影響に抵抗できるかに関わります。それに加え、一般に抱えた§Y債務§!は国家への債権者の§Y影響力§!を上昇させます。また、外国の軍事費を負担したり、債権を放棄した場合も他国への§Y影響力§!を上昇させられます。\n\n§C影響力との闘い§!\n§Y暗号レベル§!が高いと、他国が国家へ§Y影響力§!を持つのを（§Y債務§!を通したものを除き）困難にさせます。§Yディシジョン§!タブで他国の持つ§Y影響力§!を確認することができます。値が§Y15％§!を超えるとしばしば問題となり、§Y40%§!を超えると危険です。外国の§Y影響力§!と闘うために、§Y政治力§!を用いて直接他国の§Y影響力§!を減少させることと、§Y主権§!を主張して永続的に他国が§Y影響力§!を持ちづらくすることの二つが可能です。\n\n§C影響力の行使§!\n全ての国家は様々な強度で他国における§Y影響力§!を行使することができます。これには他国の§Y資源§!を搾取することや、§Y経済§!を部分的に統制すること、あるいは§R影響力が十分に高い場合は他国を傀儡化すること§!さえも含まれます。しかし、§Y国際通貨基金§!のようないくつかの非国家主体は§Y財政、社会政策§!の変更を求め、有害であったり有益であったりする§Y国家精神§!を追加するでしょう。"