 TUTOR.2052.t: "MTG"
 TUTOR.2052.d: "§Cモジュール§!\nMTGを導入している場合、様々な§Yモジュール§!が存在します。\n§Y対空砲§!と§Y対空ミサイル§!は§Y機関砲§!と§Y対空ミサイル§!の§B技術§!によってそれぞれ研究されます。\n§Y砲弾§!は高貫通、低破壊力の兵器で、§Y対艦ミサイル§!は低貫通、高破壊力の兵器です。§Y装甲§!によって、§Y対艦ミサイル§!を大量に抱え§Y砲弾§!を欠いた船は簡単に無力化されてしまうでしょう。\n§Y防衛装備§!は§G極めて安価§!であるため、§B研究§!と配備により§Y装甲§!を少し上昇させるために合理的です。§YCIWC§!は§R圧倒的に高価であり、特に£resources_strip|2 は無視できません§!が、高い§Y装甲§!をもたらします。もし艦艇の§Y装甲§!が敵の貫通を少しでも上回る場合、受けるダメージは§R非常に少なく§!なります。\n§Y洋上モジュール§!は§Y洋上スロット§!に装備されます。§YTAとFCS§!は対空戦闘で良好なダメージを与え、兵装の全体的な攻撃力を上昇させるために必要です。§YEWとSS§!は船の§Y探知§!を向上させます。§Y航行§!は船の§Yステルス性§!を上昇させ、探知を避けたり複雑で狭い海域での戦闘にボーナスを与えたりします、§Yソナー§!は§Y潜水艦§!を発見するために使用されます。\n\n§C特殊兵装§!\nほとんどの船は§Y特殊兵装§!モジュールスロットを持ちます。これらは全て様々な利益を与えるため、注意して装備を選んでください。\n\n§C原子力エンジン§!\n§Y原子力エンジン§!は§B核・大量破壊兵器§!タブで研究され、§G一切の燃料を使いません§!。また高い§Y信頼性§!を持ち、航行中や戦闘中に故障する確率は遙かに低いです。"
 TUTOR_military_206: "ロケット"
 TUTOR.206.t: "ロケット"
 TUTOR_military_206_desc: "§Bロケット技術ツリー§!は§Y軍§!における高度な技術で、三軍の全てにとって中盤から終盤の戦闘で決定打となるでしょう。序盤は忘れてしまっていても構わないでしょうが、強力な前提技術である§Yロケット技術§!と§Y装備§!は1973年の§Y時代§!に入る前に研究しておくことをおすすめします。\n\n§C陸軍とロケット§!\n§Y対戦車ミサイル§!と§Y地対空ミサイル§!はそれぞれ対人攻撃力を欠き§Y対戦車攻撃§!と§Y対空§!に特化した§B支援武装§!で、高価ですが、終盤の§Y機械化歩兵、ヘリコプター、戦闘車§!に対抗できます。§Yロケット砲兵§!は強大な対人攻撃力を持ちます。そのため、§Yヘリコプター§!や§Y装甲兵員輸送車や歩兵戦闘車§!を多く編成することを推奨します。§L長距離対空ミサイル§!は§Y建造物の対空砲§!に用いられ、最大レベルを上昇させると共に能力を向上させます。\n\n§C空軍とロケット§!\n§Y空対空ミサイル§!や§Y空対地ミサイル§!§B技術§!は§Y空軍ユニット§!に大きなボーナスを与え、特に攻撃力を大幅に上昇させます。これらの§B技術§!無しには、事実上対空戦闘は不可能と言っても過言ではなく、航空機は§Y空対地ミサイル§!や終盤の§Y自走対空砲、対空砲§!ユニットにより§Rハエの如く叩き落とされるでしょう§!。\n\n§C海軍とロケット§!\n§Y対艦ミサイル§!§B技術§!はMTG環境下では低貫通高威力の§Y艦船モジュール§!を解禁し、非MTG環境下では重要なボーナスをもたらします。高貫通低威力の§Y砲撃モジュール§!とバランスよく慎重に運用すれば、艦隊は敵を圧倒し撃破するでしょう。船を設計する時には、有効な§Y防衛装備と対戦兵装§!の技術のことを思い起こしてください。この技術を欠くと、船の§Y対戦ミサイル§!はほとんど§R無力になります§!。\n\n§Cミサイル§!\n§Y巡航ミサイル§!は伝統的な使い切りのユニットで、§Y空港§!の長距離ミサイルランチャーに配備でき、高いコストと引き換えに莫大な被害を敵に与えます。§Y弾道ミサイル§!は§Y巡航ミサイル§!よりもさらに高価で、§B研究§!力を必要とし、 £resources_strip|6を要求しますが、さらに高い攻撃力を持ち、核弾頭を搭載します。"
