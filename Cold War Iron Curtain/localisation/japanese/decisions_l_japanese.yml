 TUTOR_politics_301: "国家方針ツリーの仕組み"
 TUTOR.301.t: "国家方針ツリーの仕組み"
 TUTOR_politics_301_desc: "CWICの§Y国家方針ツリー§!は、CWICが極めて長い期間を扱っているために、他のMODとは少し異なる動き方をしています。それぞれの§Y時代§!（1949年、1960年、1973年、1980年）毎に§Y国家方針ツリー§!は更新されます。そのため、更新が行われる際に完了されていない国家方針は実行不可能になってしまうため、時間と計画に注意してください。\n\n§C選挙§!\n国家は定期的にスクリプトされた§Y選挙§!イベントを発生させ、そこでプレイヤーは特定のルートを選択できます。これらの選挙は一般に、編み上げられた§Y国家方針ツリー§!の中にある、§RAlways = no§!タグの後方に存在する、§Y政治的な§!排他的ツリーの一つをアンロックします。\n\n§Cイベント的国家方針§!\n§Y政治的な§!国家方針の他に存在する§RAlways = no§!でロックされた国家方針は§Yイベント的国家方針§!です。これらは計画された§Yイベント§!を起こすためのディシジョンの後に完了されます。数は多くありませんが、これらの国家方針の中には他国のイベントやディシジョンの成り行きに依存するものもあります。"
 TUTOR.301.d: "CWICの§Y国家方針ツリー§!は、CWICが極めて長い期間を扱っているために、他のMODとは少し異なる動き方をしています。それぞれの§Y時代§!（1949年、1960年、1973年、1980年）毎に§Y国家方針ツリー§!は更新されます。そのため、更新が行われる際に完了されていない国家方針は実行不可能になってしまうため、時間と計画に注意してください。\n\n§C選挙§!\n国家は定期的にスクリプトされた§Y選挙§!イベントを発生させ、そこでプレイヤーは特定のルートを選択できます。これらの選挙は一般に、編み上げられた§Y国家方針ツリー§!の中にある、§RAlways = no§!タグの後方に存在する、§Y政治的な§!排他的ツリーの一つをアンロックします。\n\n§Cイベント的国家方針§!\n§Y政治的な§!国家方針の他に存在する§RAlways = no§!でロックされた国家方針は§Yイベント的国家方針§!です。これらは計画された§Yイベント§!を起こすためのディシジョンの後に完了されます。数は多くありませんが、これらの国家方針の中には他国のイベントやディシジョンの成り行きに依存するものもあります。"
