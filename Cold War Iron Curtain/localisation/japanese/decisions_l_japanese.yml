 Russia_Crisis_Desc: "Yeltsin's decision to dissolve the Parliament has led to a standoff, culminating in the shelling of the Russian White House. If Yeltsin does not act swiftly, the crisis may escalate into a prolonged and violent civil conflict, jeopardizing Russia's democratic transition and economic reforms."
