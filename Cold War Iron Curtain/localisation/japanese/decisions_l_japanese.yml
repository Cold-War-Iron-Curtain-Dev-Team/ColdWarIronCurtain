 TUTOR: "チュートリアル"
 CWIC_tutor: "CWICチュートリアルとガイド"
 CWIC_tutor_desc: "以下はこのmodの特徴や特殊メカニズムに関する詳細なチュートリアルです。\n\nチュートリアルは3つのカテゴリーに分けられています。\n「チュートリアル切り替え」のディシジョンを利用することで§G経済§!、\n§R軍事§!、§C政治§!へとカテゴリーを切り替えられます。"
 TUTOR_economics: "§G経済§!、§R軍事§!、§R政治§!：§Y軍事§!へと切り替える"
 TUTOR_military: "§R経済§!、§G軍事§!、§R政治§!：§Y政治§!へと切り替える"
 TUTOR_politics: "§R経済§!、§R軍事§!、§G政治§!：§Y経済§!へと切り替える"
 TUTOR_economics_desc: "現在のチュートリアルカテゴリーは§G経済§!です。"
 TUTOR_military_desc: "現在のチュートリアルカテゴリーは§G軍事§!です。"
 TUTOR_politics_desc: "現在のチュートリアルカテゴリーは§G政治§!です。"
 TUTOR.0.t: "CWICチュートリアル"
 TUTOR.0.d: "チュートリアルやMOD情報に関するディシジョンを有効化しますか？チュートリアルはいつでも閉じることができます。"
 TUTOR.0.a: "チュートリアルを有効にする"
 TUTOR.0.b: "結構"
 TUTOR.1.t: "CWICチュートリアル"
 TUTOR.1.d: "チュートリアルやMOD情報に関するディシジョンを無効化しますか？また、コンソールを用いて「event TUTOR.0」イベントを（引用符なしで）発生させることで再び有効にできます。"
 TUTOR.1.a: "チュートリアルを無効にする"
 TUTOR.1.b: "結構"
 TUTOR_starting_templates: "§Y師団編制例§!"
 TUTOR.10.t: "師団編制例"
 TUTOR_starting_templates_desc: "編制例や初期状態の師団編制を必要としていますか？師団そのものを作るわけではありませんが、このMODの多種多様な兵器を閲覧したり、それらをどう師団に組み込むかを観察したりするのに、あるいは実際に使うための土台するのに利用することができます。コンソールにて「xp 10000」と「reserch 0」と打ち、編成を体験してみてください。また、「Research all」コマンドは全ての隠された技術を研究済みにするため、探索には良いですが、検証作業は損なわれるでしょう。"
 TUTOR.10.d: "編制例や初期状態の師団編制を必要としていますか？師団そのものを作るわけではありませんが、このMODの多種多様な兵器を閲覧したり、それらをどう師団に組み込むかを観察したりするのに、あるいは実際に使うための土台するのに利用することができます。コンソールにて「xp 10000」と「reserch 0」と打ち、編成を体験してみてください。また、「Research all」コマンドは全ての隠された技術を研究済みにするため、探索には良いですが、検証作業は損なわれるでしょう。"
 TUTOR.10.a: "お願いします"
 TUTOR.10.b: "結構"
 TUTOR_close: "チュートリアルを閉じる"
 TUTOR_close_desc: "チュートリアルを閉じます。"
 TUTOR.100.a: "パン"
 TUTOR.100.b: "続きを読む"
 TUTOR_economics_101: "資金調達とGDP"
 TUTOR.101.t: "資金調達とGDP"
 TUTOR_economics_101_desc: "§Y資金§!はほぼ全ての生産能力のある建築物から生み出される資源です。\n\n§C資金調達§!\n資金調達には様々な方法があります。§Y税§!は州の人口と§Y発展レベル§!に基づき税収をもたらします。高い§Y総合税率§!は§Y生産効率§!を減少させるでしょう。§Y工業団地§!と§Y造船所§!は共に1つにつき§G0.5B§!の基礎収益を生み出します。この収益は§Y生産性§!（生産効率+50%で計算されます）によって増幅されるでしょう。§Y造船所§!はこの他に§Y貿易法§!や§Y輸送技術§!によっても乗算されます。§Y精製所§!は1つにつき§G0.75B§!の基礎収益を生み出します。この収益はそれぞれの§Y材料工学技術§!によって増幅されるでしょう。§Yオフィスパーク§!は最も生産的な建物であり、1つにつき§G1.5B§!の基礎収益を生み出します。この収益は研究した§Y電化製品§!技術によって15%ずつ増幅されます。§Y農産複合体§!は1つにつき§G0.5B§!の基礎収益を生み出し、§Y農業§!技術により15%増幅されます。§Y資源§!の輸出もまた資金調達の良い方法でしょう。\n\n§CGDP§!\n国家の§YGDP§!は国内の産業や商業活動の合計の生産力によって決定されます。つまり、たくさん建造物があればたくさん§YGDP§!がある、ということです。\n\n§C債権と負債§!\n負債を抱えることは必ずしも問題であるとは限りません。特に、受けた融資を収益のために投資する場合や緊急の支出のための支払いに充てる場合などです。§Y対外債権§!を発行することで、任意のタイミングで持っている資金よりも多くの資金を使用することができます。この債権は§Y4%§!の§Y年利§!で§Y3年§!後に自動で返済されます。もしも§Y年利§!を下げたり、より長期の債権を発行したいと考える場合は、ディシジョンカテゴリの§Y経済ディシジョン§!で、それぞれ§Y年利§!と§Y年限§!が設定された§Y債権§!を発効することができます。また、全ての外国の§Y債権§!はあなたの国での他国の§Y影響力§!を増加させます。これを避けたいのであれば、§Y内国債§!上限を増加させるために§Yオフィスパーク§!を建設してください。§Y内国債§!は限られていますが、時間と共に資金を調達してくれるでしょう。"
 TUTOR.101.d: "§Y資金§!はほぼ全ての生産能力のある建築物から生み出される資源です。\n\n§C資金調達§!\n資金調達には様々な方法があります。§Y税§!は州の人口と§Y発展レベル§!に基づき税収をもたらします。高い§Y総合税率§!は§Y生産効率§!を減少させるでしょう。§Y工業団地§!と§Y造船所§!は共に1つにつき§G0.5B§!の基礎収益を生み出します。この収益は§Y生産性§!（生産効率+50%で計算されます）によって増幅されるでしょう。§Y造船所§!はこの他に§Y貿易法§!や§Y輸送技術§!によっても乗算されます。§Y精製所§!は1つにつき§G0.75B§!の基礎収益を生み出します。この収益はそれぞれの§Y材料工学技術§!によって増幅されるでしょう。§Yオフィスパーク§!は最も生産的な建物であり、1つにつき§G1.5B§!の基礎収益を生み出します。この収益は研究した§Y電化製品§!技術によって15%ずつ増幅されます。§Y農産複合体§!は1つにつき§G0.5B§!の基礎収益を生み出し、§Y農業§!技術により15%増幅されます。§Y資源§!の輸出もまた資金調達の良い方法でしょう。\n\n§CGDP§!\n国家の§YGDP§!は国内の産業や商業活動の合計の生産力によって決定されます。つまり、たくさん建造物があればたくさん§YGDP§!がある、ということです。\n\n§C債権と負債§!\n負債を抱えることは必ずしも問題であるとは限りません。特に、受けた融資を収益のために投資する場合や緊急の支出のための支払いに充てる場合などです。§Y対外債権§!を発行することで、任意のタイミングで持っている資金よりも多くの資金を使用することができます。この債権は§Y4%§!の§Y年利§!で§Y3年§!後に自動で返済されます。もしも§Y年利§!を下げたり、より長期の債権を発行したいと考える場合は、ディシジョンカテゴリの§Y経済ディシジョン§!で、それぞれ§Y年利§!と§Y年限§!が設定された§Y債権§!を発効することができます。また、全ての外国の§Y債権§!はあなたの国での他国の§Y影響力§!を増加させます。これを避けたいのであれば、§Y内国債§!上限を増加させるために§Yオフィスパーク§!を建設してください。§Y内国債§!は限られていますが、時間と共に資金を調達してくれるでしょう。"
 TUTOR_economics_102: "政策と政令"
 TUTOR.102.t: "政策と政令"
 TUTOR_economics_102_desc: "政策と政令は、政治スクリーンにて法セクションの隣にある政策タブで実行できます。全ての施策には国家全体の人口に基づき資金を必要とします。\n\n§C財政政策§!\n§Y財政政策§!は国家の§Y人口§!に基づく§Y維持管理費用§!を決定するための政策です。この政策は様々なボーナスをもたらし、それぞれの詳細はマウスオーバーすることで確認することができます。§O150政治力§!を使用することで政策を1段階ずつ変更できます。政策のレベルを上昇させた際には、必要な設備が整い政策が実行されるまでにクールタイムを必要とします。§Y財政政策§!のレベルを下げる場合には政策は即座に実行されクールタイムは存在しません。ほとんどの国はゲームの開始時点では最高レベルの政策を実行することはできず、実行のためには技術の研究の必要があります。\n\n§C社会政策§!\n§Y社会政策§!は一般には様々なプレイスタイルと引き換えにして決められる政策です。これらの政策はゲームエクスペリエンスやロールプレイの観点から決定するのが良いでしょう。特定の§Y社会政策§!を採用できるかどうかは国家の§Yイデオロギー§!でよって左右されます。§Y社会政策§!は全て異なる§Y政治力§!コストとクールタイムを持ち、変化がどれだけ過激かによって決定されます。時折、変化は国民の§R暴力的抵抗§!を受けます。例えば、国家内の民族集団の同化は、数年にわたる§R民族紛争§!を引き起こすでしょう。\n\n§C情報タブ§!\n最後のタブでは、国家についての様々な統計を参照できます。これらの情報は分野ごとの§G収入§!や§YGDP§!といった国家統計を含みます。また、この画面で§Y総合税率§!の変更が可能です。"
 TUTOR.102.d: "政策と政令は、政治スクリーンにて法セクションの隣にある政策タブで実行できます。全ての施策には国家全体の人口に基づき資金を必要とします。\n\n§C財政政策§!\n§Y財政政策§!は国家の§Y人口§!に基づく§Y維持管理費用§!を決定するための政策です。この政策は様々なボーナスをもたらし、それぞれの詳細はマウスオーバーすることで確認することができます。§O150政治力§!を使用することで政策を1段階ずつ変更できます。政策のレベルを上昇させた際には、必要な設備が整い政策が実行されるまでにクールタイムを必要とします。§Y財政政策§!のレベルを下げる場合には政策は即座に実行されクールタイムは存在しませんが、§Y2§!年後に現存するインフラへ§R減衰§!を起こし、その後にクールタイムが存在します。ほとんどの国はゲームの開始時点では最高レベルの政策を実行することはできず、実行のためには技術の研究の必要があります。\n\n§C社会政策§!\n§Y社会政策§!は一般には様々なプレイスタイルと引き換えにして決められる政策です。これらの政策はゲームエクスペリエンスやロールプレイの観点から決定するのが良いでしょう。特定の§Y社会政策§!を採用できるかどうかは国家の§Yイデオロギー§!でよって左右されます。§Y社会政策§!は全て異なる§Y政治力§!コストとクールタイムを持ち、変化がどれだけ過激かによって決定されます。時折、変化は国民の§R暴力的抵抗§!を受けます。例えば、国家内の民族集団の同化は、数年にわたる§R民族紛争§!を引き起こすでしょう。\n\n§C情報タブ§!\n最後のタブでは、国家についての様々な統計を参照できます。これらの情報は分野ごとの§G収入§!や§YGDP§!といった国家統計を含みます。また、この画面で§Y総合税率§!の変更が可能です。"
 TUTOR_economics_103: "カテゴリーとフラグ建造物"
 TUTOR.103.t: "カテゴリーとフラグ建造物"
 TUTOR_economics_103_desc: "フラグ建造物とは、ディシジョンによって建造され、州の建築スロットを利用しない建造物のことです。CWICの§Y州カテゴリー§!は州の§Y人口§!と§Y発展レベル§!によって決定されます。ほとんど全てのMODやバニラでは、州の§Y発展レベル§!はアップグレードされません。§Yフラグ建造物§!は従来のやり方では建設できず、国フラグを代わりに使います。バニラの資源調査は§Yフラグ建造物§!の例と言えるでしょう。\n\n§C州カテゴリー§!\nCWICでは、§Y建築スロット§!の数は§Y人口（百万人毎）§!§Gx2§!x（§Y発展レベル§!毎に§Y+50%§!）という式で決定されます。§Y経済投資§!ディシジョンカテゴリーから§Y発展レベル§!を上昇させることができます。また、州カテゴリーは税収を増加させます。州をクリックすることで§Y発展レベル§!を確認でき、地域の情報が右側に表示されます。\n\n§Cフラグ建造物§!\n§YRGOs§!（資源開発）の他にも、CWICにはディシジョンや国家方針をによって建設されるフラグ建造物が存在します。§Y電気通信§!（未実装）はその一例です。これら§Yフラグ建造物§!を建設するための費用はそれぞれのディシジョンの横に表示されるでしょう。"
 TUTOR.103.d: "フラグ建造物とは、ディシジョンによって建造され、州の建築スロットを利用しない建造物のことです。CWICの§Y州カテゴリー§!は州の§Y人口§!と§Y発展レベル§!によって決定されます。ほとんど全てのMODやバニラでは、州の§Y発展レベル§!はアップグレードされません。§Yフラグ建造物§!は従来のやり方では建設できず、国フラグを代わりに使います。バニラの資源調査は§Yフラグ建造物§!の例と言えるでしょう。\n\n§C州カテゴリー§!\nCWICでは、§Y建築スロット§!の数は§Y人口（百万人毎）§!§Gx2§!x（§Y発展レベル§!毎に§Y+50%§!）という式で決定されます。§Y経済投資§!ディシジョンカテゴリーから§Y発展レベル§!を上昇させることができます。また、州カテゴリーは税収を増加させます。州をクリックすることで§Y発展レベル§!を確認でき、地域の情報が右側に表示されます。\n\n§Cフラグ建造物§!\n§YRGOs§!（資源開発）の他にも、CWICにはディシジョンや国家方針をによって建設されるフラグ建造物が存在します。§Y電気通信§!（未実装）はその一例です。これら§Yフラグ建造物§!を建設するための費用はそれぞれのディシジョンの横に表示されるでしょう。"
 TUTOR_economics_104: "農業"
 TUTOR.104.t: "農業"
 TUTOR_economics_104_desc: "国家は§Y農産物§!£resources_strip|3 を必要とします。§Y農産物§!£resources_strip|3 は£resources_strip|3 のアイコンによって表されます。§Y農産物や食料§!£resources_strip|3 を欠いた国家は§Y生産効率§!や§Y安定性§!に§R重いマイナス補正§!がかかり、ついには§R飢饉§!が発生します。§Y農産物§!£resources_strip|3 は§Y農産業複合体§!によって§Y資金§!と共に生産されます。\n\n§C農業バイオーム§!\n§Y農業バイオーム§!は州の特性の一つであり、州の情報スクリーンで確認することができます。§Y農業バイオーム§!が肥沃であるほど生産効率は上昇します。\n農産複合体は建設された州の農業バイオームにより以下の補正を受けます。\n§Y不毛な山岳地帯§!：§G0.5§!£resources_strip|3 \n§Y砂漠とツンドラ§!：§G1§!£resources_strip|3 \n§Yステップと山岳地帯§!：§G2§!£resources_strip|3 \n§Y寒帯§!：§G3§!£resources_strip|3 \n§Y温帯§!：§G4§!£resources_strip|3\n§Y熱帯§!：§G6§!£resources_strip|3\n \n§C水インフラ§!\n§Y水インフラ§!はインフラの一種で、州の§Y農産複合体§!の生産量を増加させます。もしも§Y水インフラ§!が存在しない場合、£resources_strip|3はほとんど生産されません。§Y水インフラ§!1レベルにつき§G+25%§!だけ生産量が増加します。"
 TUTOR.104.d: "国家は§Y農産物§!£resources_strip|3 を必要とします。§Y農産物§!£resources_strip|3 は£resources_strip|3 のアイコンによって表されます。§Y農産物や食料§!£resources_strip|3 を欠いた国家は§Y生産効率§!や§Y安定性§!に§R重いマイナス補正§!がかかり、ついには§R飢饉§!が発生します。§Y農産物§!£resources_strip|3 は§Y農産複合体§!によって§Y資金§!と共に生産されます。\n\n§C農業バイオーム§!\n§Y農業バイオーム§!は州の特性の一つであり、州の情報スクリーンで確認することができます。§Y農業バイオーム§!が肥沃であるほど生産効率は上昇します。\n農産複合体は建設された州の農業バイオームにより以下の補正を受けます。\n§Y不毛な山岳地帯§!：§G0.5§!£resources_strip|3 \n§Y砂漠とツンドラ§!：§G1§!£resources_strip|3 \n§Yステップと山岳地帯§!：§G2§!£resources_strip|3 \n§Y寒帯§!：§G3§!£resources_strip|3 \n§Y温帯§!：§G4§!£resources_strip|3\n§Y熱帯§!：§G6§!£resources_strip|3\n \n§C水インフラ§!\n§Y水インフラ§!はインフラの一種で、州の§Y農産複合体§!の生産量を増加させます。もしも§Y水インフラ§!が存在しない場合、£resources_strip|3はほとんど生産されません。§Y水インフラ§!1レベルにつき§G+25%§!だけ生産量が増加します。"
 TUTOR_economics_105: "エネルギーとインフラ"
 TUTOR.105.t: "エネルギーとインフラ"
 TUTOR_economics_105_desc: "§Yエネルギー§!£resources_strip|7 はCWICで追加された新しく重要な資源であり、また§Yインフラ§!はCWICで変更と拡大がなされました。\n\n§Cエネルギー§!\n§Yエネルギー§!£resources_strip|7 はCWICにおける全ての生産能力を持つ建造物にて消費されます。§Y精製所§!、§Y工業団地§!、§Y軍需工場§!、§Yオフィスパーク§!、そしてその他全ての電気で動く建造物です。§Yエコエネルギー§!技術は§Yエネルギー§!£resources_strip|7 消費量を減少させ、§Y送電網§!技術は発電所を強化するでしょう。§Y化石燃料§!を用いる火力発電所は安く信頼性も高いですが、§Y化石燃料§!£resources_strip|1 を消費します。発電効率は§Yガス§!技術によって向上するでしょう。§Yグリーンエネルギー§!は遙かに高価ですが、圧倒的に破壊しづらく、§Y化石燃料§!£resources_strip|1 を一切使用しません。§YWMD§!技術ツリーにて研究できる§Y原子力発電所§!は莫大な電気を生み出しますが、高い技術力が必要で、大量の§B研究§!投資を必要とするでしょう。\n\n§Cインフラ§!\nCWICにおいて、§Yインフラ§!は独立した専用の§B技術§!ツリーを持っています。§Y都市インフラ§!は州での§Y建設速度§!を上昇させます。§Y州インフラ§!は§Y補給§!を改善させ§Y資源生産量§!を増加させます。§Y水インフラ§!は§Y農産複合体§!の操業に必須です。また、§Yインフラ§!の最大レベルはそれぞれの技術を§B研究§!することで上昇します。§Yインフラ管理§!技術は§Y産業§!と§Yインフラ建設§!の両方に様々なボーナスを与えるでしょう。"
 TUTOR.105.d: "§Yエネルギー§!£resources_strip|7 はCWICで追加された新しく重要な資源であり、また§Yインフラ§!はCWICで変更と拡大がなされました。\n\n§Cエネルギー§!\n§Yエネルギー§!£resources_strip|7 はCWICにおける全ての生産能力を持つ建造物にて消費されます。§Y精製所§!、§Y工業団地§!、§Y軍需工場§!、§Yオフィスパーク§!、そしてその他全ての電気で動く建造物です。§Yエコエネルギー§!技術は§Yエネルギー§!£resources_strip|7 消費量を減少させ、§Y送電網§!技術は発電所を強化するでしょう。§Y化石燃料§!を用いる火力発電所は安く信頼性も高いですが、§Y化石燃料§!£resources_strip|1 を消費します。発電効率は§Yガス§!技術によって向上するでしょう。§Yグリーンエネルギー§!は遙かに高価ですが、圧倒的に破壊しづらく、§Y化石燃料§!£resources_strip|1 を一切使用しません。§YWMD§!技術ツリーにて研究できる§Y原子力発電所§!は莫大な電気を生み出しますが、高い技術力が必要で、大量の§B研究§!投資を必要とするでしょう。\n\n§Cインフラ§!\nCWICにおいて、§Yインフラ§!は独立した専用の§B技術§!ツリーを持っています。§Y都市インフラ§!は州での§Y建設速度§!を上昇させます。§Y州インフラ§!は§Y補給§!を改善させ§Y資源生産量§!を増加させます。§Y水インフラ§!は§Y農産複合体§!の操業に必須です。また、§Yインフラ§!の最大レベルはそれぞれの技術を§B研究§!することで上昇します。§Yインフラ管理§!技術は§Y産業§!と§Yインフラ建設§!の両方に様々なボーナスを与えるでしょう。"
 TUTOR_economics_106: "技術"
 TUTOR.106.t: "技術"
 TUTOR_economics_106_desc: "CWICにおいて、§B技術§!はより細かく分化され編み上げられています。以下にそれぞれの技術ツリーの詳細を示します。\n\n§C産業タブ§!\n§Y物流§!：産業の生産能力、造船所からの収益、修理速度、燃料貯蔵量\n§Y生産§!：産業の生産能力、生産効率上限\n§Y管理§!：産業の生産能力、生産効率の上昇率、転換、海軍の改修\n§Y農業§!：農産複合体の生産量\n§Y有機化学§!：人口増加（及び未実装の生態系）\n§Y水§!：水インフラの最大レベルと管理からのボーナス\n§Yバイオ燃料と電気自動車§!：民間の化石燃料消費量（及び未実装の生態系）\n§Y土木工学§!：建設速度、修理速度\n§Y採掘§!：資源生産量\n§Y材料工学§!：様々な技術の前提条件、精製所からの収益と生産量、プラスチックは燃料獲得量を増加させる\n§Y送電網§!：全ての発電能力\n§Yグリーンエネルギーとエコエネルギー§!：再生可能エネルギーの最大レベルと発電量、建造物の消費エネルギー\n§Yガス§!：火力発電所の発電力\n§Yインフラ管理§!：様々なボーナスの詰め合わせ\n§Yインフラ§!：都市インフラと州インフラの最大レベル\n\n§C電子工学§!\n§Yトランジスタ§!：スーパーコンピューターの前提条件\n§Yスーパーコンピューター§!：研究速度\n§Yハードウェア§!：多くの技術とほぼ全ての軍事技術の前提条件\n§Yソフトウェア§!：様々なボーナスの詰め合わせ\n§Yインターネットと通信§!：指揮力の最大値と増加量（及び未実装の電気通信）\n§Y電化製品§!：オフィスパークからの収益\n§Y暗号技術§!：情報\n§Yレーダー§!：レーダー基地の最大レベルと様々なボーナスの詰め合わせ\n\n§C核§!\n§Y原子力発電所§!：原子力発電所の生産量と生産効率"
