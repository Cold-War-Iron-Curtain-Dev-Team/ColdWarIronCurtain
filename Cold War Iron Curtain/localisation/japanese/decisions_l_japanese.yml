 TUTOR_economics_108: "資源とRGO"
 TUTOR.108.t: "資源とRGO"
 TUTOR_economics_108_desc: "§Y資源§!はCWICにおけるほぼ全てに使用されます。ほとんどの建造物は§Y資源§!を消費します。§Y工業団地§!は£resources_strip|7と£resources_strip|5、£resources_strip|2、£resources_strip|1を消費します。§Yオフィスパーク§!は£resources_strip|7と£resources_strip|2、£resources_strip|1を消費します。§Y造船所§!は£resources_strip|7を消費し、§Y発電所§!もそれぞれ特定の資源を同じように消費します。\n\n§CRGO§!\n§YRGO§!、あるいは§Y資源獲得工作§!は生産される大部分の資源の源となります。ほとんどの州はゲーム開始時にいくらかの§YRGO§!を持ちますが、プレイヤーがさらに§YRGO§!ディシジョンカテゴリーから§Y資金§!を投資することでさらに増加させられます。多くの§YRGO§!はディシジョンの出現や建設に§B採掘技術§!を必要とします。"
 TUTOR.108.d: "§Y資源§!はCWICにおけるほぼ全てに使用されます。ほとんどの建造物は§Y資源§!を消費します。§Y工業団地§!は£resources_strip|7と£resources_strip|5、£resources_strip|2、£resources_strip|1を消費します。§Yオフィスパーク§!は£resources_strip|7と£resources_strip|2、£resources_strip|1を消費します。§Y造船所§!は£resources_strip|7を消費し、§Y発電所§!もそれぞれ特定の資源を同じように消費します。\n\n§CRGO§!\n§YRGO§!、あるいは§Y資源獲得工作§!は生産される大部分の資源の源となります。ほとんどの州はゲーム開始時にいくらかの§YRGO§!を持ちますが、プレイヤーがさらに§YRGO§!ディシジョンカテゴリーから§Y資金§!を投資することでさらに増加させられます。多くの§YRGO§!はディシジョンの出現や建設に§B採掘技術§!を必要とします。"
 TUTOR.200.a: "ピューピュー"
 TUTOR.200.b: "続きを読む"
 TUTOR_military_201: "全般的な基礎"
 TUTOR.201.t: "全般的な基礎"
 TUTOR_military_201_desc: "以下は全てのHOI4のMODに共通な重要点です。\n\n§C師団編制§!\n師団の幅は常に§Y10か20§!、または§Y40§!であるべきです。というのも、圧倒的に多くの戦闘は§Y20§!の倍数の幅を持つ地形で起こるからです。§Y師団§!の一部だけが戦闘に参加するということはできず、そのため中途半端な幅が埋められるということはありません。§Y支援§!スロットには10までのそれぞれの§Y中隊§!を入れられます。それぞれの§Y師団§!は5つまでの§Y大隊§!からなる5つまでの§Y旅団§!から編成されます。\n\n§C統計値§!\n§Y組織率§!に注目してください。この値はどれだけその師団が戦場に踏みとどまれるかを決定し、一方で§Y耐久力§!は攻撃を受けたときにどれだけの割合で装備や人的資源を失うかを決めます。§Y歩兵§!は軍の根幹を成し、§Y組織率§!と§Y耐久力§!を大幅に上昇させます。§Y野戦砲§!や§Y対戦車誘導ミサイル§!のような§Y火力支援ユニット§!は§Y攻撃力§!を向上させますが、§Y組織率§!や§Y耐久力§!を上昇させはしません。§Y戦車や装甲車§!は損傷を受けるのを避け敵により多くの攻撃を当てるための能力である§Y突破§!と§Y防御§!を上げるのに重要です。§Y回復率§!は非戦闘時の§Y組織率§!の回復速度を向上させる。\n\n§C支援中隊§!\n§Y支援中隊§!は左側の2列に10種類まで入ります。§Y火力支援§!中隊は師団の戦闘能力を少し上昇させますが、§Y特殊部隊§!は例外的で、§B特殊部隊§!ツリーの§B研究§!を重ねることで師団の能力を全体的に上昇させます。§Y戦闘支援§!や§Y後方支援§!中隊は、師団に§Y偵察§!や§Y塹壕§!といった特殊な値を与えます。\n\n§Cその他の統計値§!\n主に§Y支援中隊§!によって与えられる§Y特殊な値§!も多く存在します。\n§Y偵察§!：戦闘時にボーナスを与えたり、有利な戦術を取れる確率を上げたりして有利に経ったり優勢な敵を打ち破るため、情報を与えます。\n§Y塹壕§!：一点に留まっている間、師団は塹壕を掘り、防御の際に大きなボーナスを獲得します。\n§Y先制攻撃力§!：最も重要な値の一つです。師団の全員が同時に戦場へ到着する訳ではありません。戦闘が始まった時、師団は体制が整っておらず脆弱であり、時間が経つと共に力を発揮できるようになります。先制力はこの過程を速め、敵を圧倒し強力な敵を打ち破ることを可能にします。\n§Y抑圧§!：守備隊にとってのみ重要です！師団が占領地でどれだけ反乱を抑制し効率よく秩序を維持できるかに関わります。\n§Y重量§!：強襲上陸の実行のための準備時間の長さに関わります。\n§Y信頼性と装備鹵獲率§!：信頼制は消耗に関わります。信頼制が高いほど消耗は抑えられ、戦闘の内外で失われる装備は減少します。装備鹵獲率は失った装備を敵から回収する能力に関わります。（信頼制不足から失われた敵の装備を鹵獲することもできます。）\n§Y後方移送と経験値損失§!：戦闘での兵士の負傷により人的資源と経験値が失われるのを防ぎます。\n§Y装甲と貫徹§!：装甲値が相手の貫通値を上回る場合、受けるダメージは大幅に減少します。\n§Y装甲化率§!：装甲化率は受ける攻撃が対人であるか対戦車であるかの判定に用いられます。例えば、30%の装甲化率を持つ師団は受ける攻撃の70%は対人攻撃力値で計算され、30%は対戦車攻撃力値で計算されます。また、高い守備隊の装甲化率は反乱や暴動、テロリズムによる死傷者数を減少させます。\n§Y順応§!：寒冷地や酷暑地での消耗を減少させます。信頼制が70%を下回る装備は順応値に関わらずほぼ常に気候による消耗を受け続けます。\n§Y地形補正§!：特定の地形ではダメージや突破、防御の値に乗算がかかります。§Y師団編成§!画面の下で確認することができます。"
