 TUTOR_military_207: "NBC兵器と大量破壊兵器、核技術"
 TUTOR.207.t: "NBC兵器と大量破壊兵器、核技術"
 TUTOR_military_207_desc: "§B大量破壊兵器§!タブでは核兵器、生物兵器、化学兵器の§B研究§!が行えます。§YNBC兵器や装備§!、§R核兵器§!、§Y原子力エンジン§!、§Y原子力発電所§!などが§B開発§!できます。\n\n§C核兵器§!\n§Y核兵器§!は軍の装備の中で最も破滅的な兵器です。§Y大量破壊兵器タブ§!の中で研究できるこの兵器は、§R核戦争§!の中で敵国の国土と産業を瞬時に抹殺するでしょう。§Y核兵器§!は§Bロケット技術タブ§!から開発でき、建造物の§Y核兵器製造所§!を用いて§R熱核兵器§!を生産できます。建造物の§Y市民防衛シェルター§!は敵の核攻撃の被害を少なくする最良の手段です。\n\n§CNBC兵器と装備§!\n§Y大量破壊兵器§!タブのこのセクションでは§Y陸軍のアビリティ§!として使用できる§Y生物兵器§!や§Y化学兵器§!を§B研究§!できます。敵にも味方にも甚大な被害をもたらす、より危険で過激な§Y神経ガス§!を研究することもできます。\n\n§C核技術§!\nこのセクションでは様々な平和的な§B核技術§!を§B研究§!することができます。§Y原子力発電所§!は高価で§R戦略爆撃§!に対し脆弱であり、さらに£resources_strip|6 を消費しますが、£resources_strip|7 を得る手段としては最も効率的です。§Y原子力艦船エンジン§!は高い信頼性とコストを持ち、燃料を消費しません。§Y核融合発電所§!は極めて高価な§Yフラグ建造物§!（通常の建築手段では建築できず、ディシジョンによって建築され、建築枠を使用しない建造物）で、§YRGOディシジョン§!を通して建築されます。"
