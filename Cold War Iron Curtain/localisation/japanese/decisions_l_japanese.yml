 RUS_rally_pro_yeltsin_protesters_desc: "With rampant protesters in favour of the parliament, rallying our supporters in public should help in restoring some sense of calm."
 RUS_cut_parliaments_power_desc: "If we wish to re-assert control, we need to deprive Parliament of the ability to assert it's own control.  Cutting their power will ensure they stay isolated."
 RUS_denounce_opposition_leadership_desc: "While our opposition has an unfortunately sizeable support base, we simply can not let their slander be spoken freely.  Dragging them through the Dirt will hopefully help sway their supporters to our side."
 RUS_solicit_support_from_george_soros_desc: " George Soros has played an instrumental role in funding anti-Soviet movements in the ex Eastern Bloc in the past, as well funding institutions in post Soviet states.  His financial and political could go a long way in stabilising our current situation."
 RUS_deploy_police_to_the_streets_of_moscow_desc: "The Anti-Yeltsin protestors have been granted far too much leeway in what they could get away with.  It's time we restore order, and clean the streets of our capital."
 RUS_address_the_nation_desc: "If we wish to ensure national cohesion, and unity behind the president, we need to ensure that the people know what's going on, and most importantly, who to support."
 RUS_send_the_kantemer_division_desc: "The loyalty of the Kantemir Division to the President is unwavering, and secured.  It's become clear that the only solution to this crisis is one forged through force.  We'll use the division to encircle Parliament, and do what must be done to restore order."
