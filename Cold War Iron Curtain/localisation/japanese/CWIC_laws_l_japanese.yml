 pub_expansion_cooldown_desc:0 "国内では公共サービスインフラが拡充されている。 この間、あなたはアップグレードした政策と以前の政策との差額の2分の1に相当する §Y減少した特典§! を得ることができる。\n2年間のアップグレードプロセスが完了する前に、拡張をキャンセルし、より低い資金レベルに戻すことは、追加資金なしで可能。 §Yアップグレードの進行状況は失われ、払い戻しは行われない§!"
 health_expansion_cooldown_desc:0 "国内では、医療ネットワークが拡充されている。この間、あなたはアップグレードした政策と以前の政策との差額の2分の1に相当する §Y減少した特典§! を得ることができる。\n2年間のアップグレードプロセスが完了する前に、拡張をキャンセルし、より低い資金レベルに戻すことは、追加資金なしで可能。 §Yアップグレードの進行状況は失われ、払い戻しは行われない§!"
 edu_expansion_cooldown_desc:0 "国内では教育および研究施設が拡張されている。この間、あなたはアップグレードした政策と以前の政策との差額の2分の1に相当する §Y減少した特典§! を得ることができる。\n2年間のアップグレードプロセスが完了する前に、拡張をキャンセルし、より低い資金レベルに戻すことは、追加資金なしで可能。 §Yアップグレードの進行状況は失われ、払い戻しは行われない§!"
 mil_expansion_cooldown_desc:0 "国内および海外の認可地域で、軍事施設や通信・補給網が拡張されている。この間、あなたはアップグレードした政策と以前の政策との差額の2分の1に相当する §Y減少した特典§! を得ることができる。\n2年間のアップグレードプロセスが完了する前に、拡張をキャンセルし、より低い資金レベルに戻すことは、追加資金なしで可能。 §Yアップグレードの進行状況は失われ、払い戻しは行われない§!"
 cpi_expansion_cooldown_desc:0 "国内では市民保護区／施設、情報ネットワーク／施設の拡充が進んでいる。この間は、アップグレード後の政策と以前の政策との差額の2分の1に相当する §Y減少した特典§! を受け取ることができる。\n2年間のアップグレードプロセスが完了する前に、拡張をキャンセルし、より低い資金レベルに戻すことは、追加資金なしで可能。§Yアップグレードの進行状況は失われ、払い戻しは行われない§!"
