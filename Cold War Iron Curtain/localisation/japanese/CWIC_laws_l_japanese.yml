 ReligionChristianity:0 "キリスト教"
 ReligionChristianity_desc:0 "キリスト教は、イエスの教えに基づくアブラハム系の一神教である。キリスト教徒は、イエスをタナハに預言されたメシア、すなわちキリストであると信じている。ローマ皇帝が改宗した後、この宗教は東西ローマ帝国の両方で支配的なものとして台頭した。その後、キリスト教は分裂を繰り返しながら、ヨーロッパとその周辺地域を支配する信仰として台頭した。植民地主義の出現と布教活動により、キリスト教は世界中に広まり、地球上で最も大きく、最も広まった宗教となった。"
 ReligionChristianityCatholic:0 "カトリック（キリスト教）"
 ReligionChristianityProtestant:0 "プロテスタント（キリスト教）"
 ReligionChristianityOrthodox:0 "正教会（キリスト教）"
 ReligionChristianityOriental:0 "東方諸教会（キリスト教）"
 ReligionChristianityCatholic_desc:0 "カトリックはキリスト教最大の派閥であり、パパと知られるローマ教皇を最高指導者とする。教会はローマのバチカンに位置する。カトリックでは、教会はイエスによって建設され、教皇は使徒の後継者であると信じられている。教会と信奉者は伝統的慣習に従って生活し、教皇によって選ばれた神父に従う。今日、カトリックは殆ど全ての国家に存在し、教会の影響力はかつてほどではないものの特にヨーロッパや南アメリカにおいて信徒へ大きな影響を与えている。"
 ReligionChristianityProtestant_desc:0 "プロテスタントは16世紀に起こった改革運動の中で興った数多の宗教運動を意味する。創始者達はカトリックの教義の一部に反対し、特に教権的な教会や神父の役割、いくつかの宗教的慣習を打破することを目的としていた。プロテスタント教会は聖書そのものの知識を広め、カトリック教会の習慣を迷信じみているとして終わらせようとしている。現在も多数のプロテスタント教会が存在しているが、特に西ヨーロッパとアメリカ合衆国において大規模な集団が存在する。"
 ReligionChristianityOrthodox_desc:0 "正教会はその教会が使徒の後継者であると考えていて、教皇のローマ・カトリック教会は1054年の東西大分裂で教会を去った存在であると信じている。大分裂は教皇の優位性や教皇が行おうとした解釈の変更を巡って起こった論争である。正教会は一つの教会では無く、共同体関係にある教会の集合によって成立しているため、それぞれの教会は異なる典礼様式を持ち異なる指導者を有している。正教会の信徒はバルカン半島と東ヨーロッパ、地中海に存在する。イスラームの勃興や、より近年の東欧での共産主義の広まりという逆風を受けながらも、それぞれの国で信仰を保ち続けた人々やディアスポラの存在が正教会の維持を可能にした。"
 ReligionChristianityOriental_desc:0 "東方諸教会は他の宗派とは異なる教義を持ち、イエス・キリストは人性を持たず神性のみを持つとする単性論を採用しカルケドン公会議で分裂した派閥である。東方所教会はアルメニア、エジプト、アッシリア、東アフリカ、そしてインドのケーララに至るまで点在し歴史を紡いできた。東方正教会は一つの教会では無く、共同体関係にある教会の集合によって成立しているため、それぞれの教会は異なる典礼様式を持ち異なる指導者を有している。"
 ReligionJudaic:0 "ユダヤ教"
 ReligionJudaic_desc:0 "ユダヤ教は原初にして最古のアブラハムの唯一神を信ずる宗教である。その祖先を聖堂時代のイスラエル人に持つことから民族的な宗教であると考えられることもある。ユダヤ教徒はタナハを初めとする様々な伝統的書物に従って生活する。アブラハムは最初のヘブライ人であり、彼の血統からユダヤコミュニティが誕生したと信じられている。多くの信徒はユダヤ教を神がイスラエル人とその子孫と交わした契約の発現であると考えている。数世紀をかけてユダヤ教共同体はヨーロッパや中東を初めとする世界中に散らばり、科学や社会理論、商業の発展において重大な役割を果たした。しかし、どこにおいてもマイノリティであったユダヤ教徒は様々な時代に様々な形で激しい迫害にあい、ヨーロッパではジェノサイドを受けることとなった。イスラエルは唯一のユダヤ国家であるが、ユダヤ人ディアスポラは世界中に点在している。"
 ReligionJudaism:0 "ユダヤ教（ユダヤ教）"
 ReligionJudaism_desc:0 "宗教的な記述、口伝えの伝統、信仰の実践には様々な解釈が存在する。このようにアイデンティティが柔軟に見えるのは、信仰の民族的宗教的性質と関係がある。一般に、ユダヤ教のほぼすべての信者は、自分たちをアブラハムの子孫であるとみなしている。ユダヤ教の宗教儀礼のほとんどは信者が行うことができるが、法的な質問や解釈は一般的にラビと呼ばれる宗教学者が行い、信者に指導と知識を与える。近年はナショナリズム、世俗主義、合理主義の台頭により、新たな解釈や信徒が出現している。イスラエルはユダヤ人国家であるが、ユダヤ人のディアスポラは世界中に存在し、繁栄し続けている。しかし、東欧、中東、アフリカに残る共同体は、迫害に直面している。"
 ReligionIslamic:0 "イスラム教"
 ReligionIslamic_desc:0 "イスラム教は7世紀に誕生し、最も新しいアブラハム系の一神教である。イスラム教徒と呼ばれるその信者は、アラビア語でアッラーと訳される神の絶対的な優位性を信じている。神の最後の預言者はムハンマドであり、ムハンマドは神の言葉であるコーランを啓示したと信じている。ムハンマドの死後、誰が政治的権力を継承するかをめぐる分裂にもかかわらず、イスラム教は、紛争、貿易、神秘主義者、宣教師などを通じて急速に発展した。今日、イスラム教は世界中に広がっているが、特に中東、アジア、アフリカ、そしてヨーロッパの一部で広く普及している。ヨーロッパの帝国主義により、イスラム世界の多くは植民地化された。脱植民地化が進む中、多くのイスラム社会は、伝統的な慣習への回帰と近代化の受け入れのどちらが社会の保護と健全性を確保する鍵であるかについて議論しなければならない。"
 ReligionIslamSunni:0 "スンナ派（イスラム教）"
 ReligionIslamShia:0 "シーア派（イスラム教）"
 ReligionIslamIbadi:0 "イバード派（イスラム教）"
 ReligionIslamSunni_desc:0 "世界的に見ても最大のイスラム教の宗派である。他のイスラム教徒と同様に、信仰の基本的な行為といわれる「イスラム教の5つの柱」を実践することが求められている。正式な聖職者はおらず、多くのスンニ派ムスリムは宗教学者に精神性、生活、法律に関する助言を求めることが多い。宗教学者による法的な議論や裁定は、コーランやハディース、推論に基づいて行われる。イスラム教スンニ派は、ムハンマドの後継者をめぐる激しい対立の中で生まれた。今日、両教派はそれぞれ異なる法学を確立している。現在、世界のイスラム教徒の大多数はスンニ派であり、イランを除くすべてのイスラム国家で最大のイスラム教徒数を占めている。シリア、レバノン、イラクでは、彼らは圧倒的多数派ではない。"
 ReligionIslamShia_desc:0 "世界的に見ても、イスラム教の中で2番目に大きな宗派。その起源は、ムハンマドの死後、その後継者をめぐる争いにある。シーア派はスンニ派と異なり、後継者が不当であると考え、暗殺されたアリーとフサインを殉教者として崇拝している。両派とも「イスラム教の５つの柱」の重要性とコーランの優位性を認めているが、シーア派の学者の法的裁定はスンニ派の法律学派と乖離している。また、トゥエルバー・シーア派は、様々な身分の学者からなる正式な聖職者を持ち、共同体に裁定と指導を与えている。シーア派のイスラム教徒はイランでは明らかに多数派であり、イラクでは多数派であるが、中東や南アジアでは大きな少数派を擁している。"
 ReligionIslamIbadi_desc:0 "イバード派イスラムは、規模はかなり小さいが、おそらく現在活動している最も古い教派である。イバード派イスラムは、ムハンマドの死後わずか20年で、第3代カリフに対抗して誕生した。後のカリフとの対立により、現在のオマーンの奥地に追いやられた。イバディ派は最終的にオマーンに選挙で選ばれたイマーム(指導者)を形成した。スンニ派とシーア派の学者はイバード派を怪しげに見ているが、スンニ派とシーア派とは教義上の違いがあるものの、彼らの実践と信念は非常によく似ている。イバード教徒はオマーンでのみ多数派のコミュニティであるが、北アフリカにもイバード教徒のコミュニティがある。"
 ReligionBuddhism:0 "仏教"
 ReligionBuddhism_desc:0 "仏教は、紀元前5世紀の哲学者であるブッダの教えを基にした、さまざまな伝統、修行、信仰から構成されている。その起源はインドに遡るが、その後何世紀にもわたってアジア全域に広まった。仏教の信仰は、涅槃（ねはん）または仏性（ぶっしょう）の道を歩むことによって、苦しみや無限の輪廻（りんね）を克服することに重点が置かれている。仏教にはいくつかの大きな分派があり、それらは一般に地理的な空間によって分けられている。異なる宗教の台頭や近年の植民地主義にもかかわらず、仏教は依然として高い影響力を持ち、人気のある宗教である。"
 ReligionBuddhismVajrayana:0 "密教（仏教）"
 ReligionBuddhismMahayana:0 "大乗仏教（仏教）"
 ReligionBuddhismThereveda:0 "上座部仏教（仏教）"
 ReligionBuddhismVajrayana_desc:0 "金剛乗の伝統は、中世インドの高僧から始まった。金剛乗は、中世インドの修行者たちによって始められ、その主要な仏典は仏教のタントラである。金剛乗の修行者たちの精神的な目標は、仏陀の道を追求することによって悟りを開くことだ。彼らはタントラが精神的な目標を達成するための最も効果的な方法であると信じている。金剛乗は大乗仏教の伝統と類似しており、その仏典を使用している。しかし、他の仏教の伝統とは異なり、金剛乗は修行者に貪欲や憎悪などの否定的な感情を追い出すことを求めず、代わりにそれを悟りへの道筋に利用することを求めている。金剛乗はヒマラヤ、チベット、モンゴル、ロシア東部の一部で確固たる地位を築いている。"
 ReligionBuddhismMahayana_desc:0 "大乗仏教は仏教の最大の伝統であり、その信奉者は人類全体の利益のために菩薩の道を通して悟りを求める。大乗仏教の信者は、誰もが一生のうちに悟りを開くことができると信じている。大乗仏教の起源は紀元1世紀にまで遡る。大乗仏教の信者は、特定の教義、仏典、または修行に縛られることは無い。その教えは多様であるため、多くの異なる形式の教えを受け入れることができる。特に東アジア、中国、ベトナムで多く見られる。"
 ReligionBuddhismThereveda_desc:0 "上座部仏教は現存する最も古い仏教の伝統であり、その起源は紀元前3世紀頃に遡る。その信奉者は、今日に存在する原文の釈迦の教えの最も古く、唯一の仏典であるパーリ仏典と呼ばれる仏典に彼らの信奉する教えを記している。パーリ語は、古典的なインドの言語で、信者の神聖な言語として機能します。その教義は『パーリ仏典』に基づいており、他の主要な仏教宗派と共通しているが、上座部仏教の信者は、悟りを求める者が不純な衝動や感情を完全に浄化する必要性を強調している。歴史的には、この伝統はスリランカに広がり、そこから宣教師が東南アジアを横断し広めた。今日、スリランカと東南アジアの大部分は上座部仏教の信者の中心的な土地である。"
 ReligionEastern:0 "東洋哲学"
 ReligionEastern_desc:0 "東洋哲学とは、中国、日本、インドなどの思想家たちが何世紀にもわたって発展させてきた教義や思想のことである。これらのさまざまな思想は、相互作用の中で混ざり合い、進化し、アジア大陸全体の思想の発展に大きな役割を果たした。西洋哲学と植民地主義の出現は、これらの思想に公然と挑戦し、多くの人がそれらの思想の一部を伝統的な信念に適合させる方法を見出すことを余儀なくされたのである。"
 ReligionShinto:0 "神道（東洋）"
 ReligionTraditionalEastern:0 "伝統的東洋宗教（東洋）"
 ReligionConfucian:0 "儒教（東洋）"
 ReligionShinto_desc:0 "神道は、先史時代から日本で発展してきた様々な信仰や慣習から生まれた多神教とよく言われる。神道の信者は、先祖や地域社会を敬うために、さまざまな祭りや伝統を実践している。仏教の伝来と普及により、日本社会は2つの信仰を融合させ、人々のために融和させるようになった。しかし、19世紀になると、日本国家は宗教とその教義を公然と統制し、神道に対する仏教の影響をすべて取り除き、その遵守を義務化した。政府は神道を宗教としてではなく、国民の団結と愛国心を育むための思想として利用しようとした。第二次世界大戦後、国家神道は解散したが、多くの日本の指導者たちは、神道を取り入れ、国家を活性化させる可能性に今もなお魅力を感じている。"
 ReligionTraditionalEastern_desc:0 "東洋の宗教とは、東アジア、南アジア、東南アジアで生まれた宗教のことである。西洋やアフリカで生まれた宗教と比べると、文化的、哲学的、時間的に異なるものに基づいている。アジアの人口と多様性により、これらの宗教は一般的に適応性があり、多くの人々の間で広まった。工業化と植民地化の時代に西洋の宗教と哲学が出現し、これらの宗教はその影響力を維持するために対応と適応を迫られることになった。"
 ReligionConfucian_desc:0 "儒教は、紀元前6世紀の中国の哲学者、孔子の教えを起源とする洗練された行動・思想体系である。儒教の実践者は、個人と天の一体化を追求する。これは、個人が自身の人間性を理解し、安定した社会と家庭を築くことによってのみ達成されるものである。何世紀もの間、中国の王朝は儒教を受け入れ、官僚の育成にその教えを重んじた。 しかし、西洋の勢力が台頭してくると、やがて政府は儒教を学ぶ学生を弾圧し、西洋の分野を優先させるようになった。儒教は国家宗教としては衰退したが、その哲学的理念は中国だけでなく、東アジア全体に大きな影響を及ぼしている。"
 ReligionIndoiranian:0 "インド・イラン宗教"
 ReligionIndoiranian_desc:0 "インド・アーリア人は、数千年前に草原からインド亜大陸に移住してきたと言われている。彼らは言語と文化的アイデンティティをもたらし、それは彼らが定住したすべての地域に広がっていった。今日、彼らの子孫と言語的遺産は、中央アジアからイラン、そして東はベンガルやスリランカに至るまで、人々を結びつけていることがわかる。このような言語的・文化的慣習の共有を通じ、彼らはまた、定住した地域の宗教的慣習を持ち込み、それに適応させた。"
 ReligionHindu:0 "ヒンドゥー教（インド・イラン宗教）"
 ReligionSikh:0 "シーク教（インド・イラン宗教）"
 ReligionJain:0 "ジャイナ教（インド・イラン宗教）"
 ReligionTraditionalIranian:0 "トラディショナル・イラニアン(秘教)"
 ReligionHindu_desc:0 "ヒンドゥー教はそれ自体、単一の宗教ではなく、古代インドの様々な宗教と伝統の統合である。ヒンドゥー教の統合にインド・アーリア系のヴェーダ民族が大きな役割を果たし、何世紀にもわたって、ヒンドゥー教はさまざまな信仰に適応し統合する能力によって成長し、ついには仏教に取って代わってインドの主要宗教となったのである。イスラム教とその後の西洋の植民地主義者の出現は、それらの宗教がヒンドゥー教の融合的な性質に対して公然と挑戦したため、ヒンドゥー教に新たな課題をもたらすこととなった。19世紀の改革運動により、ヒンドゥー教は復活し、現在に至っている。この改革運動により、ヒンドゥー教は、神は各人の中に見出すことができるという考えに焦点を当て、ヒンドゥー教徒が近代的なアプローチで社会問題に取り組むよう方向づけられた。ヒンドゥー教徒はアジア全域で見られるが、南アジア、特にインドで最も顕著である。"
 ReligionSikh_desc:0 "地球上で最も新しい主要宗教の一つであるシーク教は、15世紀後半に南アジアで生まれた。この宗教は、グル・ナーナクと彼の後を継いだ9人のグルの教えに基づいている。シーク教の信念と聖典は、唯一の創造主の名に対する信仰と瞑想、すべての人々の間の神聖な統一、正義と平和のために生きること、そして誠実な人間としての信念に焦点を当てている。これらの信念とともに、どのような信仰も絶対的な真理を真に知ることはできないという拒絶反応がある。この宗教はヒンドゥー教とイスラム教の宗教的伝統に大きく影響されており、特にムガル帝国による激しい迫害にもかかわらず、ヒンドゥー教徒とイスラム教徒の改宗によって成長することができた。このような迫害の時期があったため、信仰の中で洗練された戦士の伝統的文化が発展した。現在、シーク教は南アジア全域に広がっているが、最も集中しているのはパンジャーブ州である。"
 ReligionJain_desc:0 "ジャイナ教は古代インドの宗教であり、信者は主にアーガマとカルパ・スートラという2つの聖典を学んでいる。ジャイナ教は、非暴力、誠実な行動、無欲主義、無執着など、いくつかの宗教的思想を信じている。その信仰の多くは、ヒンドゥー教の要素と関連している。また、ジャイナ教の信者は5つの誓いを立て、非暴力と無欲の原則を守ることを誓っている。この厳格で平和主義的な宗教は、主にインドに数百万人の熱心な信者を持つが、ジャイナ教の小さなコミュニティはアジア各地に存在する。"
 ReligionTraditionalIranian_desc:0 "ゾロアスター教は、地球上で最も古い宗教の一つだ。信者は古代イランの預言者ゾロアスターの教えを信仰している。この宗教の信者は、善と悪の二元論的な宇宙観を信じ、最終的には悪を打ち負かすとされている。この宗教の主要な聖典は「アヴェスター」である。この宗教は、古代ペルシャの偉大な王朝の庇護のもとに発展した。アレキサンダー大王はこの信仰を捨てたが、パルティア帝国が復活させることになる。しかし、イスラム教の出現により、ゾロアスター教徒は改宗したり、時には弾圧されるなどして激減した。それでも、イランや南アジアの小さなコミュニティーには、ゾロアスター教徒が残っている。"
 ReligionNoreligion:0 "無宗教"
 ReligionNoreligion_desc:0 "歴史上、ほとんどの民族は特定の宗教的世界観を信じ、その下で生活してきた。しかし、ここ数世紀、新しい科学的理論や哲学が発展し、いかなる宗教的アイデンティティも受け入れられなくなった。個人の権利の出現、世俗主義、旅行に関する新しい技術、他の信仰に関する知識などの全てが合わさり、個人が無宗教であると認識できるようになった。その結果、世界を見たり、世界と精神的につながったりする様々な方法が開発された。"
 ReligionIrreligious:0 "無宗教(非宗教的)"
 ReligionAtheist:0 "無神論（無宗教）"
 ReligionIrreligious_desc:0 "宗教全般に無関心な人、あるいは人間の心には崇高な力が存在するかしないかを理解することはできないと考える人たちからなる世界観である。これらの世界観は、ヨーロッパの啓蒙主義時代に生まれた世俗主義やそれに関連する議論に根ざしている。しかし、このような考え方は、古今東西の哲学者や著述家の中に見出すことができる。現代の作家たちは、世の中が彼らをどう扱うかを恐れて、理解した世界についてを公言できなかったことを示唆している。"
 ReligionAtheist_desc:0 "無神論とは、いかなる神をも信じないことである。歴史上、このような信仰はしばしば非常に危険な場合があり、この考えを支持する人は普段それを隠していることが多い。しかし、その存在は、古代南アジアやギリシャの時代から確認されていた。啓蒙主義の時代は、無神論者が最終的に登場し、その信念を明確にするためのコミュニティを提供した。科学の進歩と科学の確実性への信頼もまた、多くの人々を無神論に向かわせた。共産主義は無神論をしっかりと受け入れており、近年の成長により、多くの共産主義国家や政党が無神論を広範に推進していることが見られる。"
 ReligionEsoteric:0 "秘教"
 ReligionEsoteric_desc:0 "密教とは、宗教的、哲学的、科学的なテキストを研究し、隠された意味や深い意味を探すことだ。ある人は、これらの聖典や哲学の間に隠された意味やつながりを見出すために研究する。また、魔法や物理学で見ることができない世界の証拠を見つけようとする人もいる。最後に、これらの哲学の信奉者は、より高度な知識を見つけようとしたり、主流派から無視されたアイデアや概念を探求したりする。"
 ReligionStatist:0 "国家主義者(秘教)"
 ReligionCultistSafe:0 "国際的教養(秘教)"
 ReligionCultistFatal:0 "軍事的教養(秘教)"
 ReligionTraditionalAfrican:0 "インディジナス・アフリカン(秘教)"
 ReligionTraditionalAmerican:0 "ネイティブ・アメリカン(秘教)"
 ReligionTraditionalOceanic:0 "アボリジニ・オセアニック(秘教)"
 ReligionMessianic:0 "ファーリィ(秘教)"
 ReligionOther:0 "マイナー/その他(秘教)"
 ReligionStatist_desc:0 "ある国家の多くの国民は、政府のプロパガンダと国家統制により政治指導者をほとんど宗教的な意味を持つ人物とみなしている。政治的指導者が崇拝されたり、天上人とみなされたりする考え方は、新しいものではない。東アジアでは、特に中国と日本の皇室で広く行われていた。ヨーロッパでは、多くの君主が自分たちの支配を神の意志として、また自分たちの存在を天から定められたものとして正当化した。技術の進歩と近代的な国家機構の出現により、このような考え方は多様な方法で国民に伝えられるようになった。"
 ReligionCultistSafe_desc:0 "カルトとは、確立された権威に対抗する一連の信念を共有する人々の集団のことである。この権威は主流の宗教や政治的権威、社会的規範など様々なものである。これらのカルトのメンバーは、異なる信念や宗教を信仰しているかもしれないが、自分たちのメンバーや世の中に対して暴力を伝播しているわけではない。多くの地域社会はこのようなグループを疎外し、弾圧することさえあるが、暴力や社会への干渉がないため、一般的にこのグループが国家や世の中にとって懸念材料になることはない。しかし、彼らは孤立していることが多いため、もし暴力的になったとしても、その行動がより世の中に影響を与えるまで広く知られることはないのが普通である。"
 ReligionCultistFatal_desc:0 "カルトとは、確立された権威に対抗する一連の信念を共有する人々の集団のことである。この権威は主流の宗教や政治的権威、社会的規範など様々なものである。これらのカルトのメンバーは、異なる信念を実践しグループ内または世の中に対して、何らかの形の暴力を伝播する。その結果、地元当局との衝突や、より大きいコミュニティからの疎外を招く。さらに危険なことに、この種のカルトの思想は、その教えに基づいて行動する一部の人々に影響を与える可能性があり、この種のカルトは警察や国家機関にとって非常に危険な存在となっている。"
 ReligionTraditionalAfrican_desc:0 "これは、アフリカ大陸に広がる多様な信仰のことを指すものである。アフリカの伝統的な信仰として一般的に知られているものは、死者を崇める信仰、精霊や崇高な力への信仰、伝統的な医学などである。研究者は、これらの信仰の多くはサハラよりも南のアフリカ地域で生まれ、何世紀もかけ大陸中に広まったと考えている。アフリカ大陸で行われている主要な宗教の中で、これらの信仰は唯一、アフリカ大陸そのものから誕生したものである。この信仰は、しばしば口伝で伝えられ、経典は用いられない。"
 ReligionTraditionalAmerican_desc:0 "これはネイティブ・アメリカンが持つ伝統的な精神主義的信仰のことである。その内容は半球ごとに大きく異なるが、祖先を敬い、自然との調和を求める伝統的な信仰が多い。西洋の植民地主義によって宗教的迫害や疫病などにより、ネイティブ・アメリカンの社会は荒廃したが、これらの信仰は現代まで続いている。信者は経典ではなく、口頭で世代を超えて知識を伝えていくことで信仰を学んでいる。"
 ReligionTraditionalOceanic_desc:0 "オセアニアの宗教と伝統は、深い宇宙観に基づいた儀式が根ざしている。初期の探検家がこの地域の人々から友好的に迎えられたのは、こうした宗教的儀式によるもので、信者はしばしば新しい到着者を予期するよう呼びかけられたと言われている。これは間違いなく、この地域の航海の伝統と島の文化がもたらした結果である。探検家たちは新しい宗教をもたらし、それが人々の間で人気を博したが、最近では地元の人々が伝統的な慣習を復活させたり、再び参加したりするようになった。特に礼拝がそうだ。"
 ReligionMessianic_desc:0 "ファーリィを中心とした宗教は、しばしば新世代の宗教と密接な関係を持ちながら、ファーリィのサブカルチャーとしての繋がりを持つ精神的信条の一つである。ファーリィに関連した他民族の宗派や、現実、架空、または象徴的な動物との感情的・精神的繋がりを採用した準宗教的なライフスタイルを送る者など、さまざまなファーリィの精神的教義が存在する。このグループの大多数は、国際的、社会的、環境的を重んじており、芸術と美学に大きな価値を置いている。"
 ReligionOther_desc:0 "これらの伝統や宗教は、小さなコミュニティや特定の地理的空間の中で生まれたものであり、何世紀も前のものであることも少なくない。このようなコミュニティは、その規模の小ささや地理的な制約から孤立していることが多く、より一般的な信仰に邪魔されることなく、これらの慣習を続けることができた。テクノロジーと国家がより洗練されるにつれて、このようなコミュニティは新しい宗教の考え方に触れる機会が増えていくことになるだろう。"
 ReligionChineseSalvationist:0 "中国救世教"
 ReligionChineseSalvationist_desc:0 "中国救世教は、カリスマ的な人物の教えに従うことで道徳的に純粋になり、救われるという考えに焦点を当てた無数の宗教宗派を指している。多くの人が、これらの宗派を中国の歴史的な4大宗教伝統とみなしている。救世教は中国全土に存在するが、特に北と東北の地方に多い。これらの宗派はしばしば国家の弾圧にあうが、ほぼ10年ごとに新しい宗派が発見され、これらの運動は繁栄し続けている。中国国家は歴史的に、特に野心的な救世教の指導者が反乱や不安の原因になることを懸念してきた。"
 ReligionZionistChristian:0 "シオニスト・クリスチャン"
 ReligionZionistChristian_desc:0 "シオニスト・クリスチャンは、20世紀初頭のアフリカ南部で盛んになった。この信仰は、キリスト教の信仰と実践をアフリカの伝統的な宗教と融合させたアフリカの人々の間で特に人気がある。信仰による癒しと霊的な啓示は、修行者にとって重要なものである。クリスチャンの間では、しばしば特別な衣服や川での洗礼を伴う儀式や象徴的な儀式が注目される。クリスチャンによっては、アフリカン・ミュージックやダンスを取り入れた大規模な野外礼拝が行われることもある。この信仰がアフリカの社会に浸透していけば、やがてアフリカ南部で信仰されている主要なキリスト教の宗派となる可能性があると分析されている。"
 ReligionMessianicChristian:0 "ベルギー領コンゴで設立された宗教で、1921年に教派を設立したシモン・キンバングの教えが基になっている。アフリカ人によって設立された数少ない独立した教派の一つである。バプティスト派の教師だったキンバングは、人々を奇跡的に癒す能力と聖書の解釈で名声を得た後、宗教運動を始めた。彼はベルギー当局に拘束されたが、彼の教派は存続し、コンゴで最も大きな教派の一つである。この教派では、暴力、ダンス、タバコ、アルコール、一夫多妻制の否定など、ピューリタン的な信念を説き、大規模なヒエラルキーを形成している。当局の弾圧にもかかわらず、教派は成長を続け、多くの中央アフリカ人が賞賛する厳格な構造を提供している。"
