l_japanese:
 winterolympics.1.d: "ノルウェーのオスロでは、先週から第6回冬季オリンピックが開催され、30カ国の最高のアスリート達が競い合っている。ノルウェーは、1948年の第5回冬季オリンピックの開催を希望していたが、第二次世界大戦のため、IOCは新たなオリンピックを開催しないことを決定した。第二次世界大戦が終わると、IOCは1948年の第5回冬季大会をスイスのサン・モリッツに譲り、代わりにノルウェーのオスロで1952年の第6回冬季大会を開催することを決定した。ノルウェーは15個のメダルを獲得して1位となり、アメリカは11個で2位となった。3位はフィンランドで9個のメダルを獲得した。次回の冬季オリンピックは、1956年にイタリアのコルチナ・ダンペッツオで開催されることが発表されている。"
 winterolympics.2.d: "第7回オリンピック冬季競技大会は、イタリアのコルチナ・ダンペッツオで開催され、世界中から選手が集まった。コルチナ・ダンペッツオは、もともと1944年の第5回オリンピック冬季競技大会の開催地に選ばれていたが、1941年に第二次世界大戦が発生したため中止となった。その後、1948年の第5回オリンピック冬季競技大会では、スイスのサン・モリッツで開催されることになった。イタリアは、今回が初めてのオリンピック開催地となっている。また、この大会は、ドイツからソビエト連邦まで様々な人々が観戦できる、初の多国籍なオリンピック大会でもあった。1位はソ連でメダル16個、2位はオーストリアでメダル11個、3位はフィンランドでメダル7個を獲得した。次回の冬季オリンピックは、アメリカのスコーバレーで開催される予定だ。"
 winterolympics.3.d: "第8回冬季オリンピックは、アメリカ・カリフォルニア州の小さな町スコーバレーで開催され、多くの人々が訪れた。スコーバレーの拡張工事には8億ドル以上が投入さた。アメリカでは過去に、1904年セントルイス、1932年レークプラシッド、1932年ロサンゼルスの3回のオリンピックが開催されている。このオリンピックは全世界にテレビ中継され、初めて誰もが見聞きすることができるようになった。1936年の第11回オリンピック競技大会は、ドイツをはじめとするヨーロッパで初めてテレビ放映されたオリンピックだった。1948年のオリンピック第14回大会もテレビ中継されたが、イギリスと西ヨーロッパのごく一部の地域のみであった。ドイツも初めて統一チームで出場した。ソ連が21個のメダルを獲得して再び1位となり、ドイツ統一チームが8個のメダルを獲得して2位、アメリカが10個のメダルを獲得して3位となった。次回の冬季大会は、1964年にオーストリアのインスブルックで開催されることが発表された。"
 winterolympics.4.d: "第9回オリンピック冬季競技大会がオーストリアのインスブルックで初めて開催された。選手たちがオリンピックに参加できるように、多くの施設が建設された。しかし、予想以上に雪が降らなかったため、オーストリア軍は山から2万個の氷のブロックを切り出した。それをアルペンスキーのコースに運んだのである。ソ連は25個のメダルを獲得し、オリンピック冬季競技大会3大会連続の1位を獲得した。2位はノルウェーでメダル15個、3位はオーストリアでメダル12個だった。次回のオリンピック冬季競技大会は、1968年にフランスのグルノーブルで開催される予定だ。"
 winterolympics.5.d: "フランスのグルノーブルで第10回オリンピック冬季競技大会が一週間開催された。西ドイツと東ドイツが別々にオリンピックにエントリーしたのは、これが初めて。また、彼らにとっては初めてのマスコットが選ばれたオリンピックでもあった。シュシュはそのマスコットだ。1968年の第10回オリンピック冬季競技大会は、フランスにとって3度目のオリンピック開催となる。フランスは、過去にシャモニー・モンブランで1924年第1回オリンピック冬季競技大会を、パリで1924年第8回オリンピック競技大会を開催している。ノルウェーは14個のメダルを獲得し、わずか1個のメダル差でソビエト連邦を破りオスロに凱旋した。ソ連は13個のメダルを獲得して2位、フランスは9個のメダルを獲得して3位となった。次回のオリンピック冬季競技大会は、1972年に日本の札幌で開催される予定だ。"
 winterolympics.6.d: "先々週、日本の札幌で第11回オリンピック冬季競技大会が開催された。ヨーロッパと北米以外で冬季競技大会が開催されたのは、史上初のことである。1940年の第5回オリンピック冬季大会は、当初札幌で行われる予定だったが、1937年に日中戦争が勃発したため、その後スイスのサン・モリッツで行われる予定になった。しかし、1939年に第二次世界大戦が勃発し、1940年冬季大会は中止となった。30年以上の時を経て、ついに冬季大会は日本の札幌に帰ってきた。1位はソビエト連邦でメダル16個、2位は東ドイツでメダル14個、3位はスイスでメダル10個だった。次回の冬季大会は、1976年に再びオーストリアのインスブルックで開催される予定だ。"
 winterolympics.7.d: "デンバーでの1972年の第12回冬季オリンピック競技大会の開催を取りやめた後、今週再びオーストリアのインスブルックに冬季オリンピック競技大会が戻ってきた。ソ連のガリーナ・クラコワ選手は、スキー女子5kmで3位に入賞したが、禁止薬物エフェドリンを含む鼻腔スプレーを服用したため失格となった。これは、オリンピック史上初の冬季オリンピックでのメダル剥奪である。だが、FISとIOCは、彼女に10kmと4×5kmリレーへの出場を許可した。1位はソ連の27個、2位は東ドイツの19個、3位はアメリカの10個であった。次回の冬季オリンピック競技大会は、1980年にアメリカのレークプラシッドで開催されることが発表されている。"
 winterolympics.8.d: "第13回オリンピック冬季競技大会は、1932年の第3回オリンピック冬季競技大会以来、2回目の開催地となるニューヨーク州レイクプラシッドで行われた。アメリカ男子アイスホッケーチームは、グループリーグ突破が予想されていなかったが、ソ連に勝利し、金メダルを獲得した。この勝利は、「氷上の奇跡」と呼ばれ、冷戦緊張の中でアメリカ人の心をとらえた勝利であった。1位は22個のメダルを獲得したソ連、2位は21個のメダルを獲得した東ドイツ、3位は12個のメダルを獲得したアメリカだった。次回の冬季大会は、1984年にユーゴスラビアのサラエボで開催される予定だ。"
 winterolympics.9.d: "ユーゴスラビアのサラエボで、第14回オリンピック冬季競技大会が開催された。社会主義国家で冬季オリンピックが開催されるのは史上初のことである。49カ国以上が参加し、オリンピック新記録を達成した。ユーゴスラビアは、大回転で銀メダルを獲得し、史上初のメダルを獲得した。中華人民共和国は、IOCによる中華民国の承認に関する論争を理由に、オリンピックのボイコットを終了し、中華民国はチャイニーズ・タイペイとしてエントリーした。1位は東ドイツでメダル25個、2位はソ連でメダル24個、3位は米国でメダル8個を獲得した。次回の冬季大会は、1988年にカナダのカルガリーで開催されることが発表された。"
 winterolympics.10.d: "カナダのカルガリーで第15回オリンピック冬季競技大会が2週間開催された。何百人ものアスリートが地球上で最も寒い場所のひとつに赴き、一時は華氏23度（摂氏マイナス5度）にもなった。ジャマイカ人は、男子ボブスレー2種目にも初出場したが、パイプでクラッシュして敗退した。イギリスのスキージャンプのエディ・\"ザ・イーグル\"・エドワーズは、出場したすべての種目で最下位になり、英雄的な失敗をすることになった。1位はソ連でメダル29個、2位は東ドイツでメダル25個、3位はスイスでメダル15個であった。次回のオリンピック冬季競技大会は、1992年にフランスのアルベールビルで開催される予定だ。"
 winterolympics.11.d: "先週からフランスのアルベールビルにて、第16回オリンピック冬季競技大会が開催されており、フランスにとって4回目のオリンピック開催となる。フランスは、過去に1924年の第1回オリンピック・シャモニー冬季大会、1924年の第8回オリンピック・パリ大会、1968年の第10回オリンピック・グルノーブル冬季大会を開催している。冬季と夏季のオリンピックが同じ年に開催されるのは、今回が最後となった。ノルウェーは、クロスカントリースキーの全種目を制覇して終了しました。1位はドイツでメダル26個、2位はEUN選手団チーム(アルメニア、ウズベキスタン、ウクライナ、カザフスタン、ベラルーシ、ロシア)でメダル23個、3位はノルウェーでメダル20個だった。次回の冬季オリンピックは、1994年にノルウェーのリレハンメルで開催される予定だ。"
 winterolympics.12.d: "ノルウェーのリレハンメルで、第17回冬季オリンピック競技大会が2週間開催された。これは、史上最北の都市で冬季オリンピックを開催したことになる。ノルウェーは、過去に1952年の第6回オリンピック冬季競技大会を開催している。また、夏のオリンピックと異なる年に開催される初めてのオリンピックでもある。ノルウェーが最も多くのメダルを獲得し、26個のメダルを獲得して1位となった。2位はドイツで24個、3位はロシアで23個だった。次回の冬季オリンピックは、1998年に日本の長野で開催される予定だ。"
 winterolympics.13.d: "日本の長野で第17回冬季オリンピック競技大会が2週間開催された。この都市は、冬季オリンピックを開催した最南端の都市である。日本での開催は、1964年の東京オリンピック、1972年の札幌オリンピックに次いで3回目だ。1位はドイツでメダル29個、2位はノルウェーでメダル25個、3位はロシアでメダル18個だった。次回の冬季オリンピックは、2002年にアメリカのソルトレークシティで開催される予定だ。"
 winterolympics.14.d: "先週、第19回オリンピック冬季競技大会がソルトレイクシティに到着し、世界中からアスリートたちがその能力を披露するためにやってきた。今回の冬季オリンピックでは、ソルトレイクシティに大会を誘致するためにIOC委員の何人かが賄賂を受け取っていたことが発覚し、いくつかの論争があった。アメリカは、過去に1904年のセントルイスオリンピック、1932年のレークプラシッド冬季オリンピック、1932年のロサンゼルスオリンピック、1984年のロサンゼルスオリンピック、そして1996年のアトランタオリンピックの4大会を開催している。1位は36個のメダルを獲得したドイツ、2位は34個のメダルを獲得したアメリカ。3位はノルウェーで25個のメダルを獲得した。次回の冬季オリンピックは、2006年にイタリアのトリノで開催される予定だ。"
 winterolympics.15.d: "第20回オリンピック冬季競技大会は、イタリアで2回目の冬季オリンピック開催となり、選手たちはメダルを獲得するためにトリノに向かった。イタリアでは、過去に1956年のコルティナ大会、1960年のローマ大会が開催されている。今回の冬季大会は、観客動員数が少なく、オーストリアチームからロシア、ブラジルチームまで、いくつかのドーピング事件が発生した。1位はドイツでメダル29個、2位は米国でメダル25個、3位はオーストリアでメダル23個であった。オーストリアはドーピング疑惑で1〜2個のメダルが剥奪される可能性があるが。次回の冬季大会は、2010年にカナダのバンクーバーで開催されることが決定している。"
 winterolympics.16.d: "第21回オリンピック冬季競技大会が、この数週間、カナダのバンクーバーで開催されている。カナダでのオリンピック開催は、1976年のモントリオール大会、1988年のカルガリー大会に続き3度目となる。今回の冬季大会では、雪が少ないこと、設備が破壊されたこと、抗議行動により警備が強化されたことなど、いくつかの問題があった。アメリカは37個のメダルを獲得し、1位を獲得した。2位と3位はドイツとカナダで、ドイツは30個、カナダは26個のメダルを獲得した。次回の冬季大会は、2014年にロシアのソチで開催される予定だ。"
 winterolympics.17.d: "ロシアのソチで第22回オリンピック冬季競技大会が2週間開催された。ロシアは過去に1980年にモスクワで第22回オリンピックを開催している。今回の冬季大会は、510億ドルという史上最高額の資金が投入された。また、ロシア選手の一部がドーピングをしていたという報道もあり、IOCはこのことが2018年冬季大会での役割に影響を及ぼすと述べている。1位は地元開催で有利なロシアでメダル29個、2位はノルウェーでメダル26個、3位はカナダでメダル25個となった。次回の冬季オリンピックは大韓民国の平昌で開催される予定だ。"
 winterolympics.18.d: "第23回オリンピック冬季競技大会が、この2週間、大韓民国の平昌（ピョンチャン）で開催された。韓国は1988年にソウルで開催された第24回オリンピック大会に続き、2回目のオリンピック開催となる。IOCは、ロシアが自国開催でないことを強要し、ロシアからのオリンピック選手団（OAR）バナーでの参加をロシア選手にオファーした。1位はノルウェーでメダル39個、2位はドイツでメダル31個、3位はカナダでメダル29個を獲得した。次回の冬季大会は、2022年に中華人民共和国・北京で開催されることが発表されている。"