 light_tank_chassis_9_short:0 "2010 Light"
 light_tank_chassis_9_desc:0 "An advanced modern light hull using contemporary materials, sensors, and layout improvements for high-end light combat vehicles."
 medium_tank_chassis_0_short:0 "1939 Medium"
 medium_tank_chassis_0_desc:0 "An early war medium tank hull balancing useful armor, mobility, and enough capacity for a general-purpose main gun."
 medium_tank_chassis_1_short:0 "1942 Medium"
 medium_tank_chassis_1_desc:0 "A mid-war medium hull shaped by early combat experience, with better protection and improved automotive performance."
 medium_tank_chassis_2_short:0 "1944 Medium"
 medium_tank_chassis_2_desc:0 "A late-war medium hull representing the mature wartime balance of firepower, armor, reliability, and production efficiency."
 medium_tank_chassis_3_short:0 "1950 Medium"
 medium_tank_chassis_3_desc:0 "A postwar medium hull pushing the traditional medium tank toward heavier guns, better optics, and stronger protection."
 medium_tank_chassis_4:0 "First Generation MBT Hull"
 medium_tank_chassis_4_short:0 "1960 MBT"
 medium_tank_chassis_4_desc:0 "A first generation main battle tank hull combining the mobility of medium tanks with protection and armament approaching heavy tanks."
