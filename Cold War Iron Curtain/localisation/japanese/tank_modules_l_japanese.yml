 light_tank_chassis_2_desc:0 "A late-war light hull incorporating wartime experience for better automotive performance and survivability."
 light_tank_chassis_3_short:0 "1950 Light"
 light_tank_chassis_3_desc:0 "A postwar light hull suited to airborne, reconnaissance, and support roles in a rapidly mechanizing army."
