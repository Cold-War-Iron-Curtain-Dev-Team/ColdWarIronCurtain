 Hydro_pneumatic_2_desc:0 "An active suspension that dynamically adjusts damping and ride height for mobility and firing stability."
 light_tank_chassis_0_short:0 "1939 Light"
 light_tank_chassis_0_desc:0 "An early war light armored hull for reconnaissance, fire support, and economical combat vehicle designs."
