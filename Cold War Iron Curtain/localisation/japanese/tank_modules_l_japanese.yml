 ap_du_3p_desc:0 "Modern depleted uranium kinetic ammunition intended to defeat advanced layered armor and ERA arrays."
 ap_du_4p:0 "Advanced Modern DU APFSDS Ammunition"
 ap_du_4p_desc:0 "The most advanced depleted uranium kinetic ammunition, combining optimized penetrators with dense propellant packing."
