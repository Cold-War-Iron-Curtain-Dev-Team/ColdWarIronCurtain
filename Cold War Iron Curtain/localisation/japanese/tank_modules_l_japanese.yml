 advanced_heavy_tank_chassis:0 "発展型重戦車車台"
 advanced_heavy_tank_chassis_desc:0 "装甲と火力の進歩により、現代の戦車は厚い装甲と大型砲を搭載しないと効果がない。そのためには、大型化した車両が必要となる。"
