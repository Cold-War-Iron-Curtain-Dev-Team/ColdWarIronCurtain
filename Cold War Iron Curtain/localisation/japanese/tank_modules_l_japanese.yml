 light_tank_chassis_6_short:0 "1980 Light"
 light_tank_chassis_6_desc:0 "A late Cold War light hull with improved armor layout and enough payload for powerful guns, missiles, or specialist systems."
 light_tank_chassis_7:0 "Early Modern Light Tank Hull"
 light_tank_chassis_7_short:0 "1990 Light"
 light_tank_chassis_7_desc:0 "An early modern light hull designed as a flexible platform for protected reconnaissance, fire support, and infantry support variants."
