 basic_heavy_tank_chassis_desc:0 "前大戦を徹底的に分析した結果、敵の塹壕線を突破し、軽部隊が突破口を開くための重戦車が必要であることが判明した。そのような車両は重武装で重装甲の必要性があるが、速度は低速でも構わない。"
 basic_heavy_tank_chassis_short:0 "1934年型重戦車"
 improved_heavy_tank_chassis:0 "改良型重戦車車台"
 improved_heavy_tank_chassis_desc:0 "戦争の性質が変化したとはいえ、敵陣に突破口を開くために、或いは敵の攻撃に対して防御を強化するために、分厚い装甲を持つ重戦車の活躍の場は存在する。"
