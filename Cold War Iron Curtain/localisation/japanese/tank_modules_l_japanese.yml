 medium_tank_chassis_7_short:0 "1990 MBT"
 medium_tank_chassis_7_desc:0 "A deeply modernized second generation MBT hull with modular armor potential and growing integration of digital electronics."
 medium_tank_chassis_8:0 "Third Generation MBT Hull"
 medium_tank_chassis_8_short:0 "2000 MBT"
 medium_tank_chassis_8_desc:0 "A third generation MBT hull built for modern fire control, modular protection, and high survivability on a networked battlefield."
 medium_tank_chassis_9:0 "Third+ Generation MBT Hull"
 medium_tank_chassis_9_short:0 "2010 MBT"
 medium_tank_chassis_9_desc:0 "A modernized third generation MBT hull incorporating the latest crew protection, active defense, and digital combat systems."
 heavy_tank_chassis_0_short:0 "1939 Heavy"
 heavy_tank_chassis_0_desc:0 "An early war heavy hull built around thick armor and large weapons at the cost of speed and production effort."
