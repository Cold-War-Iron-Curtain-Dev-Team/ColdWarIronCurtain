 PROMPT_COMECON2_DOCKYARD_DESC:0 "Nous louons actuellement §G[?COMECON_TARGET.comecon_stolen_dockyards]§! §Ychantiers navals§!"
 PROMPT_COMECON_DOCKYARD_DESC:0 "§Y[SOV.GetName]§! peut louer jusqu'à [?COMECON_TARGET.num_of_available_naval_factories|Y0] §Ysupplémentaires Chantiers navals§!." 

 COMECON.400.t:0 "Déficit budgétaire du COMECON"
 COMECON.400.d:0 "Le Trésor soviétique ne peut pas couvrir le coût du réseau COMECON ce mois-ci. Un membre a été contraint de réduire ses engagements envers le bloc."
 COMECON.400.a:0 "Compris"
 COMECON_SLIDER_ECO_TT:0 "§YSoutien économique§!\n\nCoût par niveau : §R0,05§! argent soviétique par mois.\nBénéfice par niveau : §G+1,5%§! Production du complexe agricole, §G+1%§! Revenu du parc de bureaux, §G-1%§! besoins de consommation."
 COMECON_SLIDER_CON_TT:0 "§YAide à la construction§!\n\nCoût par niveau : §R0,04§! argent soviétique par mois.\nBénéfice par niveau : §G+2%§! vitesse de construction. Augmente également la part de satisfaction soviétique."
 COMECON_SLIDER_PRO_TT:0 "§YAide à la production§!\n\nCoût par niveau : §R0,04§! argent soviétique par mois.\nBénéfice par niveau : §G+1%§! gain d'efficacité en usine, §G+0,5%§! plafond d'efficacité."
 COMECON_SLIDER_RES_TT:0 "§YCoopération de recherche§!\n\nCoût par niveau : §R-0,15%§! Vitesse de recherche soviétique (appliquée une fois par mois à tous les membres).\nBénéfice par niveau : §G+1%§! vitesse de recherche pour ce membre."
 COMECON_SLIDER_MIL_TT:0 "§YSoutien militaire§!\n\nCoût par niveau : §R0,03§! argent soviétique par mois.\nBénéfice par niveau : §G+1%§! puissance de commandement, §G+0,5%§! soutien de guerre, §G+2%§! vitesse de production de licence. Réduit la satisfaction de §R0,4§! par niveau chaque mois."
 COMECON_MEMBER_SAT_LINE:0 "Satisfaction : §Y[?COMECON_TARGET.COMECON_satisfaction|0]§! / 100 Dépendance : §Y[?COMECON_TARGET.COMECON_dependency|0]§! / 100"
 COMECON_SOV_COST_LINE:0 "Entretien du COMECON soviétique : §R[?SOV.COMECON_cost|2]§! par mois"
 COMECON_SLIDER_TRADE_TT:0 "§YCoopération commerciale§!\n\nCoût par niveau : aucun pour l'argent soviétique.\nBénéfice par niveau : §G+1§! revenu commercial mensuel avec l'Union soviétique de ce membre."
 COMECON.510.t:0 "Demande d'un membre du COMECON"
 COMECON.510.d:0 "Un membre du COMECON a soumis une demande à l'Union soviétique. Sa satisfaction et sa dépendance déterminent la manière dont Moscou devrait réagir."
 COMECON.510.a:0 "Accorder la demande"
 COMECON.510.b:0 "Refuser la demande"

