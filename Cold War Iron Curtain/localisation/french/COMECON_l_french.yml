 COMECON_STEAL_FACTORY_TT:0 "Offre de location §GComplexes Industriels§! à partir de §Y[COMECON_TARGET.GetName]§!\n\nNécessite §Y[COMECON_TARGET.GetName]§! pour avoir un Complexe Industriel §Ydisponible§! ou que nous louons déjà un Complexe Industriel §Y§!."
 COMECON_STEAL_DOCKYARD_TT:0 "Offre de location §GChantiers navals§! à partir de §Y[COMECON_TARGET.GetName]§!\n\nNécessite §Y[COMECON_TARGET.GetName]§! pour avoir un §YDockyard§! disponible ou que nous louons déjà un §YDockyard§!."
 COMECON_STEAL_ARMS_TT:0 "Offre de location §G1 Usines d'Armes§! à partir de §Y[COMECON_TARGET.GetName]§!\n\nIl faut §Y[COMECON_TARGET.GetName]§! pour avoir une usine d'armes §Ydisponible§! ou que nous louons déjà une usine d'armes §Y§!."
 
 COMECON_BUILD_FARM_TT:0 "Construire un complexe agricole §G§! en §Y[COMECON_TARGET.GetName]§!\n\nCoûtera §R12B§! et utilisera §R5 complexes industriels§! jusqu'à l'achèvement\nCela prendra §C280 jours§! ajusté par notre §GSoutien économique§! de §Y[COMECON_TARGET.GetName]§!\n\nNécessite §Y[COMECON_TARGET.GetName]§! pour avoir un état valide pour construire un complexe agricole §G§!"
 COMECON_BUILD_ARMS_TT:0 "Construire une usine d'armes §G§! en §Y[COMECON_TARGET.GetName]§!\n\nCoûtera §R18B§! et utilisera §R5 complexes industriels§! jusqu'à l'achèvement\nCela prendra §C360 jours§! ajusté par notre §GSoutien économique§! de §Y[COMECON_TARGET.GetName]§!\n\nNécessite §Y[COMECON_TARGET.GetName]§! pour avoir un état valide pour construire une usine d'armes §G§!"
 COMECON_BUILD_FACTORY_TT:0 "Construire un complexe industriel §G§! en §Y[COMECON_TARGET.GetName]§!\n\nCoûtera §R15B§! et utilisera §R5 complexes industriels§! jusqu'à l'achèvement\nCela prendra §C360 jours§! ajusté par notre §GSoutien économique§! de §Y[COMECON_TARGET.GetName]§!\n\nNécessite §Y[COMECON_TARGET.GetName]§! pour avoir un état valide pour construire un complexe industriel §G§!"
 COMECON_BUILD_DOCKYARD_TT:0 "Construire un chantier naval §G§! en §Y[COMECON_TARGET.GetName]§!\n\nCoûtera §R15B§! et utilisera §R5 complexes industriels§! jusqu'à l'achèvement\nCela prendra §C360 jours§! ajusté par notre §GSoutien économique§! de §Y[COMECON_TARGET.GetName]§!\n\nNécessite §Y[COMECON_TARGET.GetName]§! pour avoir un état valide pour construire un chantier naval §G§!"

 PROMPT_COMECON2_ARMS_DESC:0 "Nous louons actuellement §G[?COMECON_TARGET.comecon_stolen_arms_factories]§! §Ydes usines d'armes§!"
 PROMPT_COMECON_ARMS_DESC:0 "§Y[SOV.GetName]§! peut louer jusqu'à [?COMECON_TARGET.num_of_available_military_factories|Y0] §Ysupplémentaires Usines d'armes§!." 
 PROMPTCOMECON4_DESC:0 "Montant d'achat : [?ROOT.purchase_amount_comecon|Y0]\nAu coût mensuel de §Y[?ROOT.purchase_desc_comecon|Y1]$$§!"

