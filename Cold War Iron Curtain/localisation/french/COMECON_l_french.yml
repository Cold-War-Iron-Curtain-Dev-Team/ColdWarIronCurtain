 COMECON_CRISIS_TITLE_0:0 "Pas de crise actuelle"
 COMECON_CRISIS_TITLE_1:0 "Insurrection en Allemagne de l'Est"
 COMECON_CRISIS_TITLE_2:0 "Troubles en Pologne"
 COMECON_CRISIS_TITLE_3:0 "Révolte en Hongrie"
 COMECON_CRISIS_TITLE_4:0 "Dissidence albanaise"
 COMECON_CRISIS_TITLE_5:0 "Défi roumain"
 COMECON_CRISIS_TITLE_6:0 "Printemps de Prague"
 COMECON_CRISIS_TITLE_7:0 "Grèves sur la côte baltique"
 COMECON_CRISIS_TITLE_8:0 "Mouvement de solidarité"
 COMECON_CRISIS_TITLE_9:0 "Troubles civils [COMECON_TARGET.GetName]"
 COMECON_CRISIS_DESC_0:0 "Le panel ne montre aucune crise active pour le membre sélectionné. Sélectionnez un membre en crise active pour examiner la situation."
 COMECON_CRISIS_DESC_1:0 "Le mécontentement se propage à travers l'Allemagne de l'Est alors que le SED de Walter Ulbricht lutte pour retenir la population. Écrasez les troubles, faites des concessions ou cherchez une troisième voie avant le délai de 60 jours, sinon le résultat par défaut s'appliquera."
 COMECON_CRISIS_DESC_2:0 "Les travailleurs et les étudiants en Pologne exigent du changement. Notre gouvernement membre doit réagir avant que les protestations ne deviennent incontrôlables. Écrasez les troubles, faites des concessions ou cherchez une troisième voie avant le délai de 60 jours."
 COMECON_CRISIS_DESC_3:0 "Les foules hongroises réclament un nouveau gouvernement et la fin du contrôle soviétique. Écrasez la révolte, laissez Budapest partir ou cherchez une troisième voie avant le délai de 60 jours."
 COMECON_CRISIS_DESC_4:0 "Tirana remet ouvertement en question sa place dans le bloc et son leadership vacille. Écrasez la dissidence, faites des concessions ou cherchez une troisième voie avant le délai de 60 jours."
 COMECON_CRISIS_DESC_5:0 "Bucarest suit une voie indépendante au sein du bloc. Écrasez le défi, faites des concessions ou cherchez une troisième voie avant le délai de 60 jours."
 COMECON_CRISIS_DESC_6:0 "La réforme envahit la Tchécoslovaquie et la direction du parti perd son emprise. Écrasez le mouvement, faites des concessions ou cherchez une troisième voie avant le délai de 60 jours."
 COMECON_CRISIS_DESC_7:0 "Les grèves le long de la côte baltique menacent l'économie polonaise. Écrasez les grèves, faites des concessions ou cherchez une troisième voie avant le délai de 60 jours."
 COMECON_CRISIS_DESC_8:0 "Le mouvement Solidarité s'organise dans toute la Pologne avec le soutien de l'étranger. Écrasez le mouvement, faites des concessions ou cherchez une troisième voie avant le délai de 60 jours."
 COMECON_CRISIS_DESC_9:0 "Le mécontentement du public chez un membre du COMECON augmente fortement. Écrasez les troubles, faites des concessions ou cherchez une troisième voie avant le délai de 60 jours."
 COMECON_CRISIS_ACT_CRUSH:0 "Écraser les troubles"
 COMECON_CRISIS_ACT_CONCEDE:0 "Faire des concessions"
 COMECON_CRISIS_ACT_THIRD:0 "Cherchez une troisième voie"
 COMECON.500.t:0 "Crise chez un membre du COMECON"
 COMECON.500.d:0 "Une crise a éclaté chez l'un de nos partenaires du COMECON. Sélectionnez le membre concerné dans le panneau COMECON pour examiner la situation et choisir une réponse. Si aucune réponse n'est choisie dans les 60 jours, le pire résultat par défaut s'applique."
 COMECON.500.a:0 "Compris"
 COMECON.501.t:0 "La crise n'est pas résolue"
 COMECON.501.d:0 "Le délai pour répondre à une crise du COMECON est passé sans décision. La situation s'est détériorée et le résultat par défaut s'est appliqué."
 COMECON.501.a:0 "Compris"

 EMPHASIZE_DOCKYARD_TT:0 "§YMettre l'accent sur le développement des chantiers navals§!\n\nEst-ce que §Gréduira§! les délais de construction des chantiers navals au détriment des autres secteurs économiques. Durera §Ccinq ans§!.\n\nDoit §Ret non§! mettre actuellement l'accent sur n'importe quel secteur économique."
 EMPHASIZE_INDUSTRY_TT:0 "§YMettre l'accent sur le développement industriel§!\n\nEst-ce que §Gréduira§! les délais de construction des complexes industriels au détriment des autres secteurs économiques. Durera §Ccinq ans§!.\n\nDoit §Ret non§! mettre actuellement l'accent sur n'importe quel secteur économique."
 EMPHASIZE_ARMS_TT:0 "§YMettre l'accent sur le développement des usines d'armes§!\n\nEst-ce que §Gréduira§! les délais de construction des usines d'armement au détriment des autres secteurs économiques. Durera §Ccinq ans§!.\n\nDoit §Ret non§! mettre actuellement l'accent sur n'importe quel secteur économique."
 EMPHASIZE_FARM_TT:0 "§YMettre l'accent sur le développement agricole§!\n\nEst-ce que §Gréduira§! les temps de construction des complexes agricoles au détriment des autres secteurs économiques. Durera §Ccinq ans§!.\n\nDoit §Ret non§! mettre actuellement l'accent sur n'importe quel secteur économique."

 COMECON_MILITARY_ACCESS_TT:0 "Pour demander un accès militaire, les §Y[COMECON_TARGET.GetName]§! doivent §Ret non§! nous donner déjà accès ou avoir récemment refusé les demandes d'accès."
 COMECON_BEGIN_SUBSIDIZING_TT:0 "Commencer les subventions économiques aux §Y[COMECON_TARGET.GetName]§!, ce faisant, nous paierons §C25%§! de leurs dépenses mensuelles totales et gagnerons en influence au fil du temps."
 COMECON_PROMOTE_FRIENDLY_PARTIES_TT:0 "Au prix de §C2B§! et §Y100§! Pouvoir politique, nous soutiendrons activement les partis et mouvements politiques locaux amis pour aider à stabiliser la situation politique au cours d'une année en §Y[COMECON_TARGET.GetName]§!."
 COMECON_KICK_TT:0 "Coup de pied §Y[COMECON_TARGET.GetName]§! de §YCOMECON§!\n\n§Y[COMECON_TARGET.GetName]§! §Ret non§! doivent faire partie de notre faction ou être un sujet de l'Union soviétique."
 Farm_COMECON_Emphasis:0 "COMECON Accent sur l'agriculture"
 COMECON_ARMS_Emphasis:0 "Le COMECON met l'accent sur les armes"
 Factory_COMECON_Emphasis:0 "L'accent industriel du COMECON"
