l_french:
 MOR_SETUP.1.d:0 "Le Maroc est à la croisée des chemins et les tensions montent. Le pays est divisé, la France et l'Espagne occupant toutes deux des possessions coloniales. Le sultan Muhammad V a accédé au trône en 1927 et a jusqu'à présent réussi à gérer les influences concurrentes de la France et de l'Espagne pour préserver son pouvoir et affirmer sa légitimité auprès du peuple. Les Marocains urbains sont de plus en plus attirés par les idées nationalistes arabes et par le désir de lutte armée contre les occupants coloniaux du Maroc. Pour relever ce nouveau défi, le Sultan a récemment appelé à l'indépendance et au rétablissement de la souveraineté du Maroc. Il doit maintenant faire face à l'influence française et espagnole tout en équilibrant ses relations avec sa base traditionnelle de partisans et les nationalistes arabes anticoloniaux urbains. Quelques années plus tôt, les Marocains s'étaient portés volontaires en grand nombre pour devenir parmi les troupes françaises les plus efficaces de la Seconde Guerre mondiale et de la guerre civile espagnole."
 MOR_Assasin.1.d:0 "L'éminent dirigeant de l'Armée marocaine de libération, Abbas Messaadi, a été tué par balle à Fès. L'Armée marocaine de libération est une organisation informelle de combattants anticoloniaux ruraux déterminés à se battre jusqu'à ce que l'ensemble du Maghreb soit libéré. L'assassinat a immédiatement provoqué l'indignation des militants anticoloniaux et des nationalistes arabes. Abbas Messaadi est déjà proclamé martyr de cette cause. Le sultan se trouve dans une position difficile car le ou les assassins n'ont pas été capturés et aucun groupe n'a revendiqué la responsabilité. Si une arrestation n'est pas effectuée prochainement, la situation sécuritaire dans le pays pourrait rapidement se détériorer."
 MOR_Assasin.2.d:0 "Le gouvernement marocain a annoncé l'arrestation de Karim Hajjaj, membre du parti Istiqlal. Il aurait commis le récent assassinat d'Abbas Messaadi, un éminent dirigeant de l'Armée marocaine de libération. Messaadi était un critique virulent de l'Istiqlal et nombre de ses partisans ont presque immédiatement estimé que le parti était responsable. Le sultan a largement approuvé cette arrestation afin de réduire rapidement les tensions et d'affaiblir un parti devenu de plus en plus critique à l'égard de son règne. Karim Hajjaj est accusé d'avoir appuyé sur la gâchette sous les ordres de l'éminent leader du parti Istiqlal Mehdi Ben Barka. Hajjaj devrait être rapidement jugé et condamné pour son rôle. Le parti de l'Istiqlal a tenté de se distancier du tireur et du complot, mais il est confronté à des réactions négatives de l'opinion publique."
 MOR_Assasin.3.d:0 "Le sultan Muhammad V a récemment gracié Karim Hajjaj, qui a été reconnu coupable de l'assassinat de l'éminent dirigeant de l'Armée de libération marocaine, Abbas Messaadi. Le sultan a pris cette décision après avoir reçu des informations selon lesquelles Messaadi avait en réalité été tué par un gang local à Taza engagé pour perpétrer le meurtre. L'assassinat a d'abord déclenché une colère amère et des troubles qui ont été apaisés après l'arrestation de Hajjaj, membre du parti Istiqlal. Le parti Istiqlal a subi des réactions négatives pour son rôle présumé dans le complot, mais celui-ci est désormais en suspens. Le gouvernement n'a pas précisé qui avait ordonné l'assassinat et n'a pas non plus absous Mehdi Ben Barka, accusé d'avoir initialement orchestré le complot avec Hajjaj."
 MOR_ISR.1.d:0 "Le gouvernement du Maroc a communiqué secrètement une offre pour la communauté juive marocaine. Ils ont déclaré leur volonté d'abandonner sa politique consistant à maintenir sa population juive au Maroc et à lui accorder la liberté d'émigrer vers Israël. Ils ont déclaré que cela serait possible si nous payions un prix pour chaque juif marocain qui choisit d'émigrer. Le prix est certes élevé, mais compte tenu des émeutes et des menaces auxquelles notre peuple est confronté au Maroc, cela pourrait être le seul moyen de garantir sa liberté. Il s'agit d'une opportunité et d'un net revirement de la politique marocaine et nous devrions vraiment considérer cette opportunité, malgré les coûts."
 SPANISH_MOR.1.d:0 "L'Espagne et le Maroc ont engagé des négociations sur l'avenir du Rif. Ces négociations se sont ouvertes après que le Maroc ait officiellement obtenu son indépendance de la France. Les Espagnols ont reconnu qu'ils étaient confrontés à la perspective d'une résistance prolongée désormais ouvertement soutenue par l'État voisin. Les Marocains exigent que l'Espagne quitte le territoire qu'elle contrôle depuis des années, par égard pour les sentiments de la population du Rif et du Maroc. L'Espagne doit décider si elle signera un accord pour céder le territoire ou le conserver."
 SPANISH_MOR.3.d:0 "Le peuple marocain se réjouit d'apprendre que l'Espagne restaurera nos terres et mettra fin à son protectorat. L'accord démontre l'indépendance et la force de notre peuple et de notre gouvernement. Certains des éléments les plus bellicistes préconisaient la lutte armée contre l'Espagne et remettaient en question notre décision de tenir des pourparlers. Avec cet accord, nous sommes justifiés et aurons plus d'autorité et d'influence sur les factions les plus violentes. Les Espagnols ne bougeraient pas sur les villes de Cueta et Mellila, mais il faudra en rester là pour l'instant. L'Espagne nous a déjà concédé beaucoup de choses. C'est une nouvelle ère pour un Maroc libre."
 SPANISH_MOR.5.d:0 "La tension est forte à travers le pays à l'annonce de l'échec des négociations avec l'Espagne. De nombreux Marocains y voient une grave insulte et estiment que l'Espagne a démontré sa totale incapacité à comprendre la nouvelle réalité du monde. Ceux qui prônent depuis longtemps la résistance armée en bénéficieront grandement ; on rapporte déjà que de jeunes Marocains rejoignent des milices et réclament une opportunité de combattre l'Espagne. Le gouvernement humilié, qui a promis une avancée dans les pourparlers, doit agir rapidement pour contrôler les émotions de la population et préparer une réponse. Il est clair que l'Espagne n'a aucun intérêt à une résolution juste de la crise."

 MOR_POL.1.d:0 "Le Conseil du Trône, un organe créé par les Français pour conseiller le sultan, a récemment été mêlé à une controverse. Bien qu'officiellement un organe consultatif, de nombreux nationalistes accusent le conseil d'être un outil utilisé par les résidents français pour imposer leur volonté au sultan. Ces accusations semblent avoir été confirmées lors d'une récente réunion du conseil lorsque le nationaliste déclaré Mohammad Laghzaoui a été expulsé sur la prétendue insistance du résident français. Cela a provoqué un tollé et a conduit d'autres membres nationalistes à partir également, le sultan les rencontrant immédiatement après lors d'une audience privée. L'événement a galvanisé les nationalistes et renforcé les rumeurs selon lesquelles le sultan sympathisait avec leur cause. Les loyalistes marocains traditionnels seraient irrités par les actions du sultan, l'accusant de violer les protocoles établis pour dialoguer avec les nationalistes."
 MOR_POL.2.d:0 "Une manifestation nationaliste à Aghmat a été brutalement réprimée par la police agissant sous les ordres du Qaid local de la région. Le sultan, après avoir entendu ces actions, a demandé au Quaid de comparaître devant lui et d'expliquer ses actions. Thami El Glaoui, un éminent pacha accusé de sympathies pro-françaises, était censé comparaître pour le Qaid. Cependant, le pacha ne s'est pas présenté en raison de son séjour à l'étranger et la convocation a été ignorée. Bien que la famille El Glauoi insiste sur le fait que cette absence de comparution était un simple problème de communication, le sultan serait très bouleversé par ces événements. Il semblerait qu'il regarde Thami El Glaoui avec beaucoup plus de suspicion et de méfiance."
 MOR_POL.5.d:0 "La Fête du Mouloud est un événement annuel où tous les Pachas et Qadis viennent renouveler leur fidélité au Sultan. Les Pachas et les Qadis font ces serments lors d'une audience privée avec le sultan tandis que leurs tribus font une démonstration publique de loyauté. Il s'agit d'un événement majeur qui solidifie publiquement la base traditionnelle de soutien à la monarchie. La récente montée du nationalisme et de l'anticolonialisme a mis ces relations à l'épreuve. On pense que beaucoup de ces pachas sont pro-français et ont grandement bénéficié du régime colonial français. La cérémonie de cette année est considérée comme très importante tant pour les pachas que pour le sultan."
 Throne_Crisis.1.d:0 "La fête du Mouloud s'est poursuivie comme elle se déroulait traditionnellement, mais un incident majeur s'est produit lors de l'audience privée entre le Sultan et son Pacha Thami El Glaoui. Le Pacha, âgé mais puissant, a commencé par critiquer les nationalistes qui encouragent le désordre dans le pays. Le Sultan a déclaré que les nationalistes sont de loyaux sujets marocains. Cela provoqua une conférence colérique du vieux pacha qui laissa le sultan sans voix. Thalmi quitta bientôt le sultan stupéfait. Le sultan a alors informé son grand vizir d'interdire à Thalmi de revenir à la cour en raison de ses commentaires et de son manque de respect flagrant. Plus tard, deux Qadis, fils de Thalmi, eurent leur audience avec le sultan. Ils ont cherché à réduire les tensions en affirmant que leur père ne faisait que réprimander le sultan comme un père le fait envers son fils. Cependant, cela n'a fait qu'irriter davantage le sultan et constitue une autre insulte."
 Throne_Crisis.2.d:0 "La traditionnelle fête du Mouloud a été entachée de controverses suite à la décision du sultan d'expulser Thami El Glaoui et sa famille du tribunal. La décision fait suite à des audiences privées entre le sultan, Thami, puis plus tard avec ses fils. Le sultan s'est senti insulté par une tirade agressive de Thami contre les nationalistes marocains. Lorsque Thami fut informé de son expulsion, il partit immédiatement avec sa famille et sa tribu. Ils partirent avant la fin de la Fête du Mouloud qui se termine par une déclaration publique de loyauté des tribus. Le sultan et son palais considèrent cette sortie brutale comme la preuve que Thalmi commet une mutinerie ouverte contre la famille royale." 
 MOR_POL.11.d:0 "Suite aux discussions d'Aix Les Bains, un Conseil de régence a été créé pour le Maroc. Cet organisme jouera un rôle majeur en aidant à administrer le pays et à négocier l'indépendance pendant que Mohammad V reste en exil. Les nationalistes ont longtemps réclamé le retour du sultan Mohammad V en exil, tandis que la France refusait de le rendre. Le Conseil de régence est un compromis permettant aux deux parties de maintenir leur position tout en progressant dans les négociations sur l'indépendance. Les membres du conseil doivent être approuvés par le sultan en exil, ce qui lui donne la possibilité de conserver ses partisans dans les négociations."
 MOR_POL.12.d:0 "Même si la monarchie et le parti de l'Istiqlal étaient inséparables sur le chemin de l'indépendance, cette alliance prend fin avec l'objectif commun atteint. Dirigé par Ahmed Balafrej, fervent partisan des idées nationalistes et constitutionnalistes, le parti de l'Istiqlal s'efforcera sûrement de réduire le pouvoir du roi dans les années à venir. Préserver le règne privilégié du roi signifierait s'attaquer au parti le plus puissant et le plus populaire du pays à ce jour."
 FRANCAFRIQUE_MOR.1.d:0 "Le sultan Arafa, qui a accédé au trône suite à l'exil de son cousin le sultan Mohammad V, a appelé la France à intervenir et à sauver son trône. Dès son arrivée au pouvoir, Arafa a dû faire face à une forte opposition de la part des nationalistes et de certains pachas traditionnels qui considèrent sa nomination comme illégale et comme faisant partie d'un complot français. Les citoyens de tout le Maroc appellent Arafa le sultan français. Le gouvernement français a annoncé qu'il soutiendrait le sultan Arafa dans l'accomplissement de son devoir envers le peuple marocain et dans l'établissement de l'ordre public dans tout le protectorat. Les milices armées et loyalistes de Mohammad V organisent déjà et s'emparent de certaines parties du pays pour le sultan en exil. De nombreux observateurs estiment que l'intervention française rendra inévitable une guerre civile au Maroc."
 MOR_CONSPIRACY.1.d:0 "Le résident français au Maroc, qui supervise la monarchie et défend les intérêts français, est étroitement impliqué dans un complot visant à trouver un sultan alternatif pour le Maroc. Le dirigeant actuel, le sultan Mohammad V, s'associe de plus en plus aux nationalistes et continue de faire des déclarations condamnant l'influence étrangère au Maroc, sans toutefois nommer directement la France ou l'Espagne. Plus préoccupantes sont les rumeurs selon lesquelles le sultan demanderait à son gouvernement d'aider ouvertement et même de former des combattants anticoloniaux à travers le pays. Le Résident et d'autres agents français ont identifié le cousin germain du sultan, Mohammad ben Arafa, comme disposé à prendre le trône s'il devenait vacant. Il a également promis de soutenir les intérêts français et de réprimer les nationalistes. Des agents français rencontrent d'éminents pachas pour évaluer leur soutien à l'installation d'un nouveau sultan sur le trône. Les Pachas sont traditionnellement de proches partisans des Français."
 Arafa.1.d:0 "Mohammad ben Arafa, le nouveau sultan du Maroc, a renforcé ses prétentions au trône à la suite d'une cérémonie au cours de laquelle les principaux pachas et la noblesse du Maroc l'ont déclaré imam. Cela montre symboliquement qu'Arafa a conservé la base traditionnelle du pouvoir royal marocain. Cependant, certains pachas ont refusé d'y assister et de nombreux Marocains seraient furieux de l'exil de l'ancien sultan Mohammad V. Les nationalistes arabes en particulier sont à l'origine de l'indignation du public à l'égard du nouveau sultan, surnommé le sultan français. On ne sait pas si Arafa pourra calmer l'indignation croissante. De nombreux observateurs notent que la société marocaine moderne n'est peut-être pas aussi conforme ou obéissante aux élites traditionnelles que par le passé."
 MOR_EXILE.1.d:0 "Lors de la traditionnelle célébration de l'Aïd, les autorités françaises ont affronté Mohammad V et arrêté le sultan du Maroc. Le sultan est accusé de conspirer activement avec les nationalistes et d'utiliser les institutions étatiques pour fournir des armes, des fournitures et une formation aux combattants anticoloniaux au Maroc. Les Français ont rapidement emmené le sultan et sa famille en Corse et la rumeur court que Mohammad Ben Arafa, cousin germain du sultan, prendrait sa place. La réaction des Marocains, notamment des nationalistes, devrait être immédiate ; Cependant, les Français pensent que le nouveau sultan établira rapidement sa légitimité et ralliera les pachas traditionnels pour consolider son contrôle sur le pays."
 SPR_MOR_ALT.1.d:0 "Le sultan Arafa a renforcé sa légitimité auprès du peuple marocain et bénéficie des faveurs de la France suite à sa récente victoire dans la guerre civile. Fort de ce soutien, il a récemment demandé à son gouvernement de demander officiellement la restitution du territoire colonial actuellement détenu par l'Espagne. C'est peut-être la meilleure opportunité au niveau national pour faire valoir ces revendications. Une négociation réussie avec l'Espagne renforcerait son image auprès du peuple et saperait la propagande de l'opposition selon laquelle le sultan Arafa est une marionnette coloniale. Le gouvernement est convaincu que l'Espagne sera d'accord."
 SPR_MOR_ALT.2.d:0 "Le sultan marocain Arafra a envoyé une délégation de haut niveau pour demander que nous remettions nos possessions territoriales au Maroc au nouveau gouvernement. Cela mettrait également fin à notre protectorat sur le Maroc. Si nous acceptons cette demande, nous améliorerons notre image dans le monde arabe et dans d'autres États postcoloniaux. Cela améliorerait également les relations avec la France qui soutient le régime du sultan Arafa. Plus important encore, ces terres sont déjà coûteuses à entretenir et toute future rébellion armée des Marocains nuirait à notre image et à notre économie internationales. Cependant, ces terres sont espagnoles depuis des décennies et ont apporté un soutien décisif pendant la guerre civile. Certes, il y a de nombreux nationalistes dans ces territoires qui envisageraient sans doute une résistance armée si nous refusions, mais nous avons aussi des loyalistes qui viendraient soutenir la cause espagnole. Une décision doit être prise."
 SPR_MOR_ALT.3.d:0 "Le gouvernement espagnol a réagi négativement à la demande légitime de notre gouvernement de restituer les terres marocaines occupées. Ils continuent de considérer notre peuple comme des sujets colonisés et leur refus a provoqué des manifestations à travers le pays. Le sultan Arafa aurait été stupéfait par cette décision, estimant que les Espagnols ne risqueraient pas une guerre coloniale ni même une éventuelle intervention française en refusant. Dans un discours à la nation, le Sultan Arafa a condamné l'action espagnole et appelé le peuple marocain à se mobiliser pour la libération future de tous les Marocains. Des groupes armés d'activistes anticoloniaux se préparent déjà à une intervention et le sultan a ordonné à ses militaires de leur fournir une formation et des armes, car la poursuite de l'impérialisme espagnol ne sera pas tolérée."
 SPR_MOR_ALT.4.d:0 "Le gouvernement espagnol a réagi positivement à notre demande légitime de retour des terres et de la population marocaines occupées. Nous avons accepté le calendrier de retrait proposé pour les semaines à venir afin d'assurer non seulement un transfert d'autorité en douceur mais aussi un retrait honorable pour l'État espagnol. Le sultan Arafa a annoncé la joyeuse nouvelle à la nation, et de nombreuses personnes sont descendues dans la rue pour exprimer leur joie face à l'unification de leur pays. La libération réussie du Maroc occupé par l'Espagne donne une grande légitimité au sultan Arafa et ses opposants politiques s'inquiètent s'ils parviennent un jour à destituer un homme qu'ils considèrent comme un outil de l'impérialisme français."
 MOR_CIVIL_WAR.20.d:0 "Les Français et leurs alliés marocains exilèrent le sultan Mohammad V et installèrent son cousin Arafa. Ils nous demandent désormais de reconnaître le sultan Arafa comme nouveau dirigeant. Les Français ont mal calculé, car leur intervention flagrante a provoqué des troubles massifs à travers le Maroc et la guerre civile semble inévitable alors que les républicains marocains forment des bandes armées contre Arafa et les Français. Nous avons plusieurs options pour gérer la situation. Nous pouvons refuser de reconnaître le sultan Arafa pour le moment. Cela ne ferait que risquer des attaques et un soulèvement sur notre propre territoire marocain. Cela nous permettrait également de voir comment se déroule la guerre civile sans s'engager dans un seul camp. L'autre option est de condamner ouvertement la légitimité d'Arafa et de fournir une reconnaissance, ainsi que des armes, aux républicains marocains qui s'opposent à lui. Cela améliorerait notre image auprès des Marocains et ferait de nous l'influence européenne dominante au Maroc." 
 MOR_POL.25.d:"Le Maroc est plongé dans la tourmente politique suite à la démission du Premier ministre Mbarek Bekkay. Le premier Premier ministre a été contraint de démissionner par le parti nationaliste Istiqlal après avoir recherché le soutien royal pour légitimer une coalition de partis pro-monarchie réprimés qui ont formé le parti Mouvement populaire. Cette action du Premier ministre a aliéné les dirigeants nationalistes pro-résistance qui ont reproché à Bekkay d'agir trop lentement en faisant pression pour le retrait de toutes les forces françaises du pays. Ahmed Balafrej, secrétaire général de l'Istiqlal, devrait prendre la relève, mais les observateurs craignent que sa position neutraliste ne fasse qu'exacerber les tensions politiques. Des informations font déjà état de membres pro-résistance du parti Istiqlal formant une faction d'opposition au sein du parti. Alors que les groupes de résistance pouvaient auparavant blâmer Bekkay, il semble que l'Istiqlal sera désormais ouvert à la colère du public à l'égard des militants nationalistes marocains."
 MOR_POL.10.d:0 "Le gouvernement marocain a annoncé la légalisation du parti politique connu sous le nom d'Union nationale des forces populaires (NUPF). Le NUPF est apparu comme une émanation socialiste du parti Istiqlal et a longtemps été considéré comme une menace pour le gouvernement. Malgré une répression agressive de la part du ministère de l'Intérieur, la NUPF a continué à croître et à prospérer. Nous espérons que la légalisation du groupe le poussera vers le courant dominant et l'éloignera des positions plus radicales comme la résistance armée. Le NUPF lui-même comprend différents éléments et le gouvernement estime que ses actions renforceront les parties modérées du parti. Les médias félicitent le gouvernement pour sa maturité face à l'opposition politique."

 SPANISH_MOR.2.d:0 "Les Etats espagnol et marocain ont annoncé un accord pour la rétrocession du Rif au Maroc. L'Espagne a également officiellement annoncé la fin de son protectorat sur le Maroc. L'accord constitue un formidable coup de pouce pour le gouvernement marocain, qui a reconquis un territoire sous occupation espagnole depuis des décennies et a acquis une plus grande légitimité tant au niveau national qu'international. Les observateurs notent que l'Espagne ne voulait probablement pas provoquer une guerre coloniale dans la région et souhaitait maintenir des liens cordiaux avec le Maroc alors qu'il affirme son indépendance. L'Espagne conserve le contrôle des deux villes de Cueta et Mellila, notant qu'elles font partie intégrante de l'Espagne et font partie de la nation depuis des siècles. Le gouvernement marocain revendique également ces villes mais a accepté de laisser le sujet pour l'instant."
 SPANISH_MOR.4.d:0 "Les pourparlers entre Span et le Maroc ont échoué sans aucun accord sur la poursuite de l'occupation du Rif par l'Espagne. De plus, l'Espagne n'a pas non plus renoncé à son protectorat sur le Maroc. L'échec à parvenir à un accord constitue un coup dur pour le gouvernement marocain et les militants anticoloniaux les plus modérés. Ils avaient soutenu que la lutte armée ne pouvait garantir le succès, mais que des négociations étaient nécessaires pour une percée finale. Le gouvernement espagnol insiste sur le fait qu'il ne compromettra pas les droits de ses citoyens ni sa position historique dans la région simplement pour faire plaisir au Maroc. Jusqu'à présent, le gouvernement marocain est resté largement silencieux, se contentant d'un bref commentaire exprimant sa détresse face à l'échec de ses efforts."
 MOR_POL.3.d:0 "Le gouvernement marocain a fait appel à une aide étrangère importante pour soutenir sa population. Le gouvernement note que des années d'exploitation étrangère et les conflits récents ont mis à rude épreuve l'État marocain et sa capacité à soutenir la population. Il est demandé à toutes les nations de fournir toute l'aide possible pour aider le Maroc à atteindre non seulement l'indépendance de l'ensemble de sa population, mais également une croissance stable pour une prospérité à long terme. Plusieurs ambassades ont publié des déclarations affirmant qu'elles défendraient les intérêts du peuple marocain et des circonstances uniques auxquelles il est confronté."
 SLA.1.d:0 "Le sultan marocain a récemment ordonné que les forces de l'Armée de libération luttant contre le colonialisme espagnol soient créées sous le nom d'Armée de libération du Sahara. Le groupe de guérilleros n'est pas officiellement affilié à l'armée marocaine, mais de nombreux observateurs pensent que les principaux combattants sont des soldats de l'armée marocaine. Ces hommes sont soutenus par des combattants de libération marocains locaux et d'autres volontaires qui ont traversé la frontière vers le territoire occupé par l'Espagne. La création de l'Armée de libération du Sahara indique une grave escalade et une concentration renouvelée du gouvernement marocain et des militants anticoloniaux sur l'expansion de la lutte armée en Espagne."
 IFNI_WAR_FRANCE.1.d:0 "Des rapports en provenance du Sahara occidental indiquent que les forces marocaines progressent depuis les territoires contrôlés par l'Espagne vers la Mauritanie. Cela suggère une détérioration majeure de la position espagnole et française dans la région. Le gouvernement marocain a publié une déclaration affirmant que la libération et l'unification du Maghreb sont proches et qu'aucune puissance étrangère ne devrait chercher à empêcher l'unification. Une réunion d'urgence de haut niveau entre les dirigeants français et espagnols devrait avoir lieu sous peu, car tous deux restent silencieux sur la gravité de la situation actuelle dans la région."
 FRANCAFRIQUE_MOR.10.d:0 "La guerre civile marocaine a éclaté entre les partisans du sultan Arafa, soutenu par la France, et les républicains marocains qui accusent les Français d'avoir installé Arafa sur le trône. Plusieurs autres factions sont également impliquées dans les combats, notamment celles qui soutiennent le sultan déchu Mohammad V et de puissants dirigeants ruraux marocains qui s'opposent à l'influence politique accrue des Marocains urbains. Ceux qui soutiennent la cause républicaine estiment que la monarchie est clairement un outil au service de l'impérialisme étranger et que le Maroc ne peut être libre que sans monarchie. Le régime du sultan Arafa peut s'appuyer sur le soutien français et sur la loyauté des monarchistes qui ne soutiennent pas la cause de la restauration du sultan Mohammad V."
 MOR_CIVIL_WAR.10.d:0 "Le peuple marocain a été sous le choc après l'annonce de l'assassinat de Mohammad V. Les détails de ce qui s'est passé sont actuellement inconnus, mais les villes du Maroc ont vu des milliers de personnes descendre dans les rues pour pleurer. En tant que sultan, Mohammad V a adopté ces dernières années une position beaucoup plus ferme sur la question de l'indépendance du Maroc. Il a ouvertement courtisé les nationalistes et a donné du pouvoir aux militants urbains, suscitant la colère des élites rurales traditionnelles et de la France. De nombreuses personnes dans le pays imputent déjà l'assassinat à la France ou à des mandataires dirigés par la France. Alors que ces rumeurs se répandent, il semble peu probable que la mort de Mohammad V facilite la vie du sultan Arafa, soutenu par la France."
 MOR_CIVIL_WAR.21.d:0 "Les Marocains urbains sont devenus ces dernières années une force politique majeure dans le Maroc moderne. La propagation du discours anticolonial et du nationalisme arabe a inspiré des milliers de jeunes Marocains, notamment ceux inscrits dans les écoles. Ceci, combiné à leur rôle économique vital, en fait une force plus puissante que les élites marocaines traditionnelles et rurales. L'installation flagrante du sultan Arafa sur le trône par la France s'est avérée être un pas de trop. Aujourd'hui, des milliers de citadins marocains ne se contentent pas de protester contre le monarque fantoche, mais ont lancé des soulèvements dans toutes les villes. Ils affirment que les soulèvements armés se poursuivront jusqu'à ce que la monarchie corrompue et la France soient expulsées du Maroc. De nombreux Marocains sont attirés par le message anticolonial clair des Républicains et par leur promesse de plus grandes libertés politiques une fois qu'ils auront gagné." 
 MOR_CIVIL_WAR.22.d:0 "La guerre civile marocaine a pris une tournure dramatique suite à des informations selon lesquelles l'Espagne interviendrait en apportant un soutien massif aux forces républicaines au Maroc. Les Espagnols affirment que leur action vise à soutenir le peuple marocain et à mettre fin aux tactiques obscures et oppressives orchestrées par la France. Les Français seraient furieux de cette nouvelle, tandis que de nombreux observateurs notent que l'Espagne agit de manière à garantir une relation solide avec le gouvernement marocain en cas de victoire des républicains. Plus important encore, l'intervention espagnole renforcera les relations entre l'Espagne et les autres États arabes et réprimera tout éventuel conflit marocain sur son propre territoire. Les dirigeants républicains ont publié un communiqué remerciant l'Espagne pour sa contribution à la liberté du Maroc."
 TANGIERS_PROTOCOL.1.d:0 "Le Maroc et l'Espagne ont récemment signé le Protocole de Tanger pour régler le statut de la ville. Bien que Tanger ait été nominalement sous la monarchie marocaine, elle a passé plusieurs décennies en tant que ville internationale sous protection espagnole. Ce nouvel accord redonne formellement la pleine souveraineté de Tanger au Maroc. La nouvelle de l'accord a vu de nombreux Marocains célébrer le retour d'une ville longtemps considérée comme occupée, car ils avaient auparavant condamné la façon dont la ville est devenue une destination de fête pour les élites européennes qui ont utilisé les ressources marocaines mais ont donné leur argent aux occupants étrangers de la ville. Le Maroc espère non seulement restaurer sa souveraineté, mais aussi veiller à ce que les bénéfices réalisés par la ville puissent bénéficier au peuple marocain."
 TANGIERS_PROTOCOL.2.d:0 "L'Espagne a annoncé qu'elle annexait officiellement Tanger à la suite d'un référendum organisé pour déterminer son statut final. Cette décision a été condamnée par le Maroc et d'autres États internationaux. L'Espagne a affirmé que le référendum représentait le peuple de Tanger exprimant son droit à l'autodétermination. Le gouvernement marocain a accusé l'Espagne d'avoir manipulé le vote en excluant de nombreux Marocains tout en comptant les électeurs étrangers et en lançant une campagne qui indiquait à tort que le régime marocain entraînerait un effondrement économique pour la ville. L'Espagne a balayé ces critiques et prévoit d'organiser une grande fête pour célébrer l'annexion et l'unification de Tanger avec l'Espagne. Selon certaines rumeurs, le gouvernement marocain préparerait des méthodes alternatives, notamment la résistance armée." 
 MOR_UN.1.d:0 "Le Maroc a été officiellement admis aux Nations Unies après un vote. Après avoir officiellement acquis la souveraineté, la demande d'adhésion aux Nations Unies a été la première décision ordonnée par le gouvernement. Le Maroc a été admis à une écrasante majorité et de nombreux pays, notamment du monde arabe, ont chaleureusement accueilli le Maroc. Compte tenu de la longue lutte que le Maroc a endurée pour obtenir son indépendance et de son engagement avec le monde arabe et l'Afrique du Nord, le nouveau membre devrait être un partisan actif des votes anticoloniaux et pro-arabes à l'Assemblée générale."
 MOR_Coronation.2.d:0 "Le sultan Mohammad V est revenu sur le trône après son bref exil et s'est de nouveau couronné sultan. Cela marque la fin d'une lutte épique pour le sultan qui a enduré des mois d'exil à l'étranger après que les Français l'ont déposé en faveur de son cousin. Cependant, l'agitation et les troubles populaires ont forcé les Français à reculer et leur dirigeant fantoche a rapidement rendu le trône à Mohammad V. Le sultan a remercié le peuple pour son soutien et sa persévérance dans les moments difficiles. Il a promis son engagement envers la nation et le peuple marocains, et non envers un dirigeant étranger."
 MOR_EXILE.2.d:0 "Les Français ont récemment contraint Mohammad V à démissionner de son trône et ont ensuite installé son cousin Arafa comme nouveau sultan du Maroc. Craignant que les Marocains ne se rallieraient à Mohammad V, les Français ont rapidement ordonné à l'ancien sultan de récupérer sa famille et de quitter le pays. En quelques heures, les Français ont fait monter l'ancien sultan et sa famille dans un avion pour la Corse en exil. L'espoir que le changement de direction et l'exil en un éclair permettraient d'étouffer d'éventuels troubles se sont révélés erronés puisque les citadins marocains ont presque immédiatement commencé à s'agiter contre l'ingérence française lorsque la nouvelle s'est répandue le lendemain matin. Muhammad V a réussi à diffuser son propre message au peuple, affirmant qu'il n'avait pas démissionné, mais il a été expulsé de force par les Français."
 MOR_EXILE.3.d:0 "Lors d'une cérémonie privée, pour éviter les explosions publiques, le sultan Arafa a été officiellement couronné nouveau souverain du Maroc. Cousin de l'ancien sultan Mohammad V, Arafa a accédé au trône à la suite de la destitution controversée et de l'exil de Mohammad V par les autorités françaises. Bien que certains chefs de tribus rurales aient refusé d'assister au couronnement, le nouveau monarque a été confirmé par les oulémas. Le couronnement est largement condamné à travers le Maroc, en particulier dans les villes où Arafa est souvent qualifié avec dédain de sultan français. Reste à savoir si le nouveau sultan pourra conserver son trône." 
 second_rif_revolt.1.d:0 "Les Marocains du Rif se sont révoltés contre la mauvaise gouvernance persistante du gouvernement. La première guerre du Rif a eu lieu dans les années 1920 et n'a été réprimée par les Espagnols qu'au prix d'importants coûts humains et financiers. Les rebelles sont soutenus par les Marocains de tout le pays qui ont afflué pour rejoindre la lutte monarchique. Le gouvernement marocain accuse les panarabistes étrangers de soutenir les rebelles en leur fournissant des armes, des troupes et des entraînements. Les dirigeants panarabes de la région qualifient quant à eux le soulèvement de réaction naturelle d'un peuple fatigué de l'occupation et de l'ingérence étrangères." 
 Ifni_War.1.d:0 "Au cours des derniers mois, les autorités espagnoles en Afrique occidentale espagnole ont été confrontées à des manifestations marocaines massives et à une vague d'assassinats visant des dirigeants pro-espagnols. Face à l'intensification des troubles au Maroc, l'Espagne a ordonné une mobilisation de ses forces, ce qui a amené le Maroc à mobiliser ses propres troupes. Les forces espagnoles ont rapidement vu leurs communications coupées et attaquées par l'Armée de libération marocaine soutenue par les troupes marocaines présentes dans la région. Les forces espagnoles sont sur la défensive, craignant à Madrid que Sidi Ifni soit menacé par les forces marocaines s'emparant des armureries autour de la ville. Jusqu'à présent, les lignes espagnoles tiennent bon, mais la situation a dégénéré en une guerre de tirs entre l'Espagne et l'Armée de libération soutenue par les troupes marocaines dans la région."
 Ifni_War.2.d:0 "Après d'intenses combats, l'Espagne et le Maroc ont récemment signé un accord mettant fin à la guerre d'Ifni. L'Espagne a accepté de céder la région de Tarfaya, l'Espagne conservant le contrôle du Sahara espagnol et de Sidi Ifni. Le gouvernement marocain présente cet accord comme une indication de sa victoire militaire sur l'Espagne. Cependant, les analystes notent que l'échec du Maroc à acquérir tous les territoires indique qu'il n'a pas réussi à remporter une victoire militaire. Bien que l'Espagne ait réussi à conserver la majeure partie de son territoire et à atténuer l'attaque marocaine, les coûts ont été lourds et beaucoup à Madrid s'interrogent sur les coûts nécessaires au maintien des territoires coloniaux."
 Ifni_War.3.d:0 "La tentative marocaine de s'emparer des possessions espagnoles au Sahara occidental par l'intermédiaire de son Armée de libération s'est soldée par une défaite désastreuse. Les forces espagnoles ont rapidement repoussé l'assaut initial marocain sur Sidi Ifni. Les efforts des Marocains pour reprendre l'initiative ou même fortifier les territoires stratégiques ont échoué en raison des opérations espagnoles efficaces. Les Marocains ne pouvaient pas gérer la discipline, les armes lourdes ou les tactiques des forces espagnoles. Le gouvernement marocain a tenté de présenter la situation comme une victoire, mais l'échec de tout gain territorial et les rumeurs de retrait des troupes ont rendu la réalité claire. À Madrid, le gouvernement espagnol a félicité ses forces et annoncé une série de défilés et de médailles pour commémorer la victoire." 
 Ifni_War.4.d:0 "Le gouvernement espagnol a annoncé le retrait complet de ses forces du Sahara occidental. Cela indique une défaite militaire complète dans leur conflit contre l'Armée de libération soutenue par le Maroc. Les forces marocaines ont réussi à percer les lignes espagnoles, à isoler les garnisons espagnoles dans toutes les régions et à envahir avec succès des positions et des villes clés. Le gouvernement marocain a annoncé la libération du Sahara occidental et a publié des photos des forces marocaines faisant la fête dans les villes libérées. Des milliers de personnes sont descendues dans la rue pour célébrer cette victoire capitale sur une puissance coloniale occupante. Le gouvernement marocain reçoit des messages de félicitations de la part d'autres États anticoloniaux. La confiance des Marocains est désormais à un niveau record."
 REVOLUTION_KING.5.d:0 "Depuis le début de la lutte anticoloniale au Maroc, la monarchie est aux côtés du peuple. Le roi Mohammad V incarne les désirs de son peuple. Par ses actions, souvent subtiles, il démontre son soutien et sa sympathie aux nationalistes à travers le pays. Il le fait au mépris des élites procoloniales et des puissances coloniales qui étaient auparavant les principaux partisans du trône. Mais ces ennemis du peuple ont récemment cherché à destituer le roi. Alors que le roi est en exil, le peuple marocain est descendu dans la rue, s'est mis en grève et exige le retour du roi. La ferveur pour l'indépendance est en plein essor."
 REVOLUTION_KING.6.d:0 "Dans le cadre d'un accord historique, Mohammad V et le gouvernement français ont signé une déclaration posant les bases de l'indépendance du Maroc. Lors des pourparlers qui se tiendront à La Celle Saint Cloud, la France permettra la restauration de Mohammed V sur le trône. En échange, le Roi a accepté une feuille de route vers l'indépendance basée sur l'interdépendance franco-marocaine. Les deux parties considèrent l'accord comme un compromis réussi et une solution pacifique aux troubles actuels. Même si certains nationalistes s'inquiètent de la progression progressive vers l'indépendance, nombreux sont ceux qui sont prêts à faire confiance à Mohammad V."
 REVOLUTION_KING.2.d:0 "L'ancien monarque Mohammed V du Maroc a quitté les négociations avec le gouvernement français à La Celle Saint Cloud. Il semble qu'aucune des deux parties n'ait réussi à trouver un compromis. Bien que les deux parties se soient initialement mises d'accord sur le rétablissement de Mohammad V sur le trône, les négociations sur l'indépendance se sont rapidement effondrées. Les Français ont insisté sur une feuille de route vers l'indépendance basée sur l'interdépendance franco-marocaine. Bien que la France ait promis que cela ne durerait pas longtemps et aboutirait à une indépendance complète, les Marocains estimaient que cette condition était un stratagème pour poursuivre le colonialisme français. Les Français seront probablement extrêmement déçus par l'échec des négociations. Au Maroc, des informations indiquent que les dirigeants du parti nationaliste Istiqlal appellent à un soulèvement armé pour débarrasser enfin le pays de l'occupation coloniale."
 REVOLUTION_KING.0.d:0 "La situation au Maroc se dégrade pour les Français. Leur récente tentative de destituer le roi indépendantiste Mohammed V et de le remplacer par un cousin pro-français s'est retournée contre lui. Le peuple marocain rejette le nouveau roi comme une marionnette. Il y a de grandes manifestations, grèves et violences dans tout le pays. Le gouvernement français est préoccupé par la spirale des coûts. Plus important encore, si la violence continue, on craint que des factions plus radicales ne gagnent en influence parmi les Marocains. Il est prévu que le ministre français des Affaires étrangères rencontre Mohammad V à La Celle Saint Cloud."

 Arafa.0.d:0 "Le roi Arafa du Maroc, récemment intronisé, a survécu de peu à une tentative d'assassinat d'Allal ben Abdallah. Le roi, voyageant à cheval avec un cortège, a été pris pour cible lorsque l'assassin a percuté avec sa voiture le cheval qui transportait le roi. L'assassin a alors sauté pour poignarder le roi Arafa mais a été attaqué par un policier français. L'officier, poignardé au cours de la lutte, a plaqué l'assassin au sol avant que celui-ci ne soit abattu. Bien que le roi soit tombé de cheval, il a subi des blessures mineures et a quitté les lieux sous haute protection. Le roi Arafa a accédé au trône après que son cousin, le roi Mohammad V, ait été contraint à l'exil par les Français. De nombreux Marocains estiment que le roi Arafa est une marionnette française et ce dernier incident suggère que la colère marocaine envers le colonialisme français reste forte."
 second_rif_revolt.0.d:0 "Les dirigeants politiques du Rif ont adressé une liste de 18 revendications au gouvernement marocain. Les habitants du Rif se plaignent depuis longtemps de la négligence développementale et politique de la région. Ceci malgré son historique précieux d'activisme et de résistance anticolonialistes. Le gouvernement marocain ne sera probablement pas satisfait de cette demande du public, car elle pourrait créer un dangereux précédent et provoquer la colère de certaines couches de la population. Cependant, l'absence de réponse positive pourrait provoquer une réaction violente de la part d'un peuple adepte de la guérilla."

 MOR_successor.1.d:0 "La question de l'avenir du Maroc après l'effondrement et le départ de l'autorité coloniale française dans la région a trouvé aujourd'hui une réponse alors que Muhammad Allal al-Fassi a consolidé sa position de successeur d'Abd al-Karim al-Khatabi.\n\nParmi les premiers partisans du mouvement anti-français, al-Fassi formera le premier syndicat de travailleurs autochtones au Maroc qui deviendra le Parti anticolonial de l'Istiqlal en 1944. Après un exil de 9 ans au Gabon et une rupture avec l'Istiqlal pour soutenir la lutte armée, al-Fassi s'installe au Caire pour aider à organiser le Comité pour la libération du Maghreb arabe.\n\nAujourd'hui leader du Comité et du Maroc, al-Fassi devrait aider à organiser des mouvements armés d'indépendance à travers le Maghreb tout en recherchant des liens plus étroits avec les révolutionnaires panarabes d'Égypte et du reste du monde arabe."
 MOR_successor.2.d:0 "La question de l'avenir du Maroc après l'effondrement et le départ de l'autorité coloniale française dans la région a trouvé aujourd'hui une réponse alors que Mehdi Ben Barka a consolidé sa position de successeur d'Abd al-Karim al-Khatabi.\n\nConsidéré comme le plus jeune des premiers militants indépendantistes du Maroc, ayant rejoint le Parti national d'al-Fassi à 17 ans, Ben Barka a passé sa jeunesse à étudier à Rabat, Casablanca et Alger ; où il sera influencé par les nationalistes algériens pour soutenir l'indépendance de tout le Maghreb. Après avoir enseigné à la Royal Academy pendant un certain temps, Ben Barka signerait la Proclamation d'Indépendance aux côtés d'autres nationalistes de premier plan.\n\nDevenant de plus en plus progressiste et de gauche au fil du temps, Ben Barka quitte le parti de l'Istiqlal en 1959 pour fonder l'Union nationale des forces populaires. Aujourd'hui leader du Maroc et adoptant de plus en plus la rhétorique socialiste, le temps nous dira si le Maroc deviendra un exemple de démocratie africaine ou l'avant-garde de la révolution sous Ben Barka."
 MOR_successor.3.d:0 "La question de l'avenir du Maroc après l'effondrement et le départ de l'autorité coloniale française dans la région a trouvé aujourd'hui une réponse alors qu'Ali Yata a consolidé sa position de successeur d'Abd al-Karim al-Khatabi.\n\nAyant rencontré et influencé par ses collègues militants Allal al-Fassi et Mehdi Ben Barka ; Yata a rejoint le Parti communiste marocain en 1944, peu après la publication de la Proclamation de l'indépendance du Maroc, et a été élu secrétaire général l'année suivante. Initialement tiède à l'idée de coexistence, le manque de soutien des forces françaises de gauche l'a poussé à rechercher plutôt l'indépendance nationale complète.\n\nTravaillant avec le Croissant Noir et d'autres groupes révolutionnaires armés, Yata dirige désormais le Maroc. Auparavant chargé de représenter le PCM au 19e Congrès du PCUS, le pays va probablement se diriger vers la sphère soviétique sous sa direction."

 Casablanca_Riots.1.d:0 "Le protectorat français du Maroc a été secoué par deux jours de violents troubles après l'assassinat du dirigeant syndical tunisien Farhat Hached à Tunis le 5 décembre 1952. À Casablanca, des milliers de travailleurs, organisés par l'Union générale des syndicats confédérés au Maroc (UGSCM) et soutenus par le parti nationaliste de l'Istiqlal, ont organisé une grève générale et des manifestations de masse les 7 et 8 décembre.\n\nLes manifestations, qui ont rassemblé plus de 3 500 dockers, ouvriers et jeunes des rues, ont été réprimées avec force par les unités de la police française. Ce qui a commencé comme une grève a rapidement dégénéré en violences à l'échelle de la ville, alors que les colons français ont pris d'assaut les quartiers marocains en représailles. Les affrontements qui en ont résulté ont fait des centaines de manifestants marocains tués ou blessés, selon des témoins oculaires, tandis que des dizaines de dirigeants de l'Istiqlal ont été arrêtés le 9 décembre alors que les autorités s'apprêtaient à reprendre le contrôle."