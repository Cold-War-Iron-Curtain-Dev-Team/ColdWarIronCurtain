 #Venezuela VEN
 VEN_infantry_equipment_0: "Fusil américain, calibre.30, M1"
 VEN_infantry_equipment_0_short: "M1 Garand"
 VEN_infantry_equipment_0_desc: "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 VEN_infantry_equipment_1: "Fabrique Nationale Fusil Automatique Léger"
 VEN_infantry_equipment_1_short: "FN FAL"
 VEN_infantry_equipment_1_desc: "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 VEN_infantry_equipment_2: "CAVIM Fusil Automatique Léger"
 VEN_infantry_equipment_2_short: "CAVIM FAL"
 VEN_infantry_equipment_2_desc: "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 VEN_infantry_equipment_3: "Carabine M2 de la Fabrique Nationale"
 VEN_infantry_equipment_3_short: "FNC M2"
 VEN_infantry_equipment_3_desc: "Le FNC a été développé entre 1975 et 1977 pour les essais de normalisation de l'OTAN, comme alternative moins coûteuse au fusil M16 chambré en 5,56 x 45 mm OTAN. La conception du fusil est basée sur le prototype FNC 76, lui-même issu du fusil FN CAL, qui a connu un échec commercial."

 VEN_infantry_equipment_4: "Avtomat Kalachnikova AK-103"
 VEN_infantry_equipment_4_short: "AK-103"
 VEN_infantry_equipment_4_desc: "L'AK-103 est un fusil d'assaut conçu par le concepteur russe d'armes légères Mikhaïl Kalachnikov en 1994. Il s'agit d'un dérivé AK-100 de l'AK-74M chambré pour la cartouche M43 de 7,62 x 39 mm, similaire à l'AKM."

