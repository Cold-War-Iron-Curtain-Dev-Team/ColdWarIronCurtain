 VEN_jet_CAS_equipment_6: "Mirage Mirage 5V"
 VEN_jet_CAS_equipment_6_short: "Mirage5V"
 VEN_jet_CAS_equipment_6_desc: "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France et dans plusieurs autres pays sous licence. Il est dérivé du populaire chasseur Mirage III de Dassault."

 VEN_jet_recon_equipment_2: "Dassault Mirage 5VR"
 VEN_jet_recon_equipment_2_short: "Mirage5VR"
 VEN_jet_recon_equipment_2_desc: "Version de reconnaissance photographique du Mirage 55V de l'armée de l'air vénézuélienne, armé de caméras au lieu de munitions d'attaque au sol."

 VEN_jet_light_equipment_2: "T-2 Buckeye nord-américain"
 VEN_jet_light_equipment_2_short: "T-2 Buckeye"
 VEN_jet_light_equipment_2_desc: "Le T-2D et le T-2E étaient des versions d'exportation destinées respectivement à l'armée de l'air vénézuélienne et à l'armée de l'air hellénique. Le T-2 Buckeye (avec le TF-9J Cougar) a remplacé le T2V-1/T-1A SeaStar, bien que le T-1 ait continué dans certaines utilisations jusque dans les années 1970."
 VEN_jet_light_equipment_3: "Chasseur de la liberté Canadair VF-5A"
 VEN_jet_light_equipment_3_short: "Chasseur de la liberté VF-5A"
 VEN_jet_light_equipment_3_desc: "Le Canadair CF-5/CF-116 est la version sous licence Canadair de l'avion de chasse américain Northrop F-5 Freedom Fighter, principalement destiné aux Forces canadiennes sous le nom de CF-5 et à l'Aviation royale néerlandaise sous le nom de NF-5 et pour l'Armée de l'air vénézuélienne sous le nom de VF-5."
 VEN_jet_light_equipment_4: "Chasseur de la liberté Canadair VF-5D"
 VEN_jet_light_equipment_4_desc: "Le Canadair CF-5/CF-116 est la version sous licence Canadair de l'avion de chasse américain Northrop F-5 Freedom Fighter, principalement destiné aux Forces canadiennes sous le nom de CF-5 et à l'Aviation royale néerlandaise sous le nom de NF-5 et pour l'Armée de l'air vénézuélienne sous le nom de VF-5."
 VEN_jet_light_equipment_5: "Rockwell nord-américain OV-10E Bronco"
 VEN_jet_light_equipment_5_short: "OV-10E Bronco"
 VEN_jet_light_equipment_5_desc: "Bronco de deuxième génération développé dans le cadre du programme NOGS. Le modèle D était une cellule OV-10A largement modifiée, ajoutant un système de vision nocturne infrarouge tourné vers l'avant avec une caméra montée sur la tourelle sous un nez allongé, visuellement distinct du nez court et arrondi du modèle A. Le D possède également des moteurs plus gros et des hélices en fibre de verre plus grandes. D'autres différences externes notables sont les distributeurs de paillettes installés à mi-chemin des flèches et les cheminées d'échappement suppressives des infrarouges (qui mélangent les gaz d'échappement avec de l'air plus froid pour réduire la signature thermique de l'avion)."

 VEN_tac_bomber_equipment_0: "Fiat Br.20 Cicogna"
 VEN_tac_bomber_equipment_0_short: "Br.20 Cicogna"

 VEN_tac_bomber_equipment_2: "B-25C Mitchell nord-américain"
 VEN_tac_bomber_equipment_2_short: "B-25C Mitchell"
 VEN_tac_bomber_equipment_2_desc: "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres impliquant des avions pendant la guerre, l'utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardement aérien réussie sur le continent japonais pendant la guerre. Son surnom est « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
