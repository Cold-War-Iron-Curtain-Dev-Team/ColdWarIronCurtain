 VEN_fighter_equipment_0: "Aviation militaire nationale bolivarienne"
 VEN_fighter_equipment_0_short: "AMNB"
 VEN_fighter_equipment_0_desc: "L'aviation militaire bolivarienne est un corps armé professionnel conçu pour défendre la souveraineté et l'espace aérien du Venezuela. Il s'agit d'une composante de service des Forces armées nationales bolivariennes du Venezuela."

 #VEN_fighter_equipment_1: ""
 #VEN_fighter_equipment_1_short: ""
 #VEN_fighter_equipment_1_desc: ""
 VEN_fighter_equipment_2: "République F-47 Thunderbolt"
 VEN_fighter_equipment_2_short: "P-47 Coup de Foudre"
 VEN_fighter_equipment_2_desc: "Le P-47 était le développement ultérieur des avions Seversky (le prédécesseur de Republic) P-35 et Republic P-43 Lancer. Bien qu'il ait été conçu à l'origine comme un chasseur de supériorité aérienne. La renommée du P-47 était sa capacité à transporter une lourde charge de bombes, marquant ainsi le début de l'héritage de l'entreprise en matière de développement d'avions d'appui aérien rapproché (CAS). Ce type a été utilisé dans une myriade de nations alliées pendant la Seconde Guerre mondiale et a continué à fonctionner ainsi après la guerre, certains affirmant que ce type, et non le P-51 Mustang, aurait dû être utilisé en Corée. Son surnom est « Thunderbolt », le premier dans les conventions de dénomination modernes de Republic. A été rebaptisé F-47 en 1948."
 VEN_fighter_equipment_3: "F-51D Mustang nord-américain"
 VEN_fighter_equipment_3_short: "P-51D Mustang"
 VEN_fighter_equipment_3_desc: "Le P-51 est considéré comme l'un des meilleurs chasseurs jamais produits dans l'histoire de l'aviation. Développé par North American Aviation. Le type est entré en service en 1942. Initialement utilisé comme avion de reconnaissance tactique, le type allait, avec l'introduction de la variante « D », devenir célèbre comme le premier chasseur à domination aérienne au monde, assurant l'escorte des bombardiers américains et alliés lors des campagnes de bombardement les plus célèbres du théâtre européen, détruisant près de 5 000 avions pendant la guerre. Plus tard désigné F-51, il servira avec distinction comme avion CAS pendant la guerre de Corée, et le « Mustang », le cheval de trait de l'USAAAF, continuera son service jusqu'en 1968."

 #VEN_jet_multirole_equipment_1: ""
 #VEN_jet_multirole_equipment_1_short: ""
 #VEN_jet_multirole_equipment_1_desc: "Mustang GFX"
 VEN_jet_multirole_equipment_2: "Sabre nord-américain F-86A"
 VEN_jet_multirole_equipment_2_short: "Sabre F-86A"
 VEN_jet_multirole_equipment_2_desc: "Le F-86 est un chasseur à réaction à ailes en flèche développé et introduit à la fin des années 1940 à partir de recherches capturées par les Allemands. La conception de l'avion le rendait capable d'atteindre des vitesses transsoniques et une grande maniabilité, caractéristiques qui le rendaient capable de gérer son célèbre rival, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, aux côtés de ses variantes canadiennes et australiennes réunies, en ferait l'avion de combat occidental le plus produit de l'histoire de l'aviation."
 VEN_jet_multirole_equipment_3: "Sabre nord-américain F-86F"
 VEN_jet_multirole_equipment_3_short: "Sabre F-86F"
 VEN_jet_multirole_equipment_3_desc: "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 #VEN_jet_multirole_equipment_4: ""
 #VEN_jet_multirole_equipment_4_short: ""
 #VEN_jet_multirole_equipment_4_desc: ""
 #VEN_jet_multirole_equipment_5: "Sabre GFX"
 #VEN_jet_multirole_equipment_5_short: ""
 #VEN_jet_multirole_equipment_5_desc: "Sabre GFX"
 VEN_jet_multirole_equipment_6: "Dassault Mirage IIIE"
 VEN_jet_multirole_equipment_6_short: "Mirage IIIE"
 VEN_jet_multirole_equipment_7: "Dassault Mirage IIIEV"
 VEN_jet_multirole_equipment_7_short: "Mirage IIIEV"
 VEN_jet_multirole_equipment_7_desc: "Le nouveau moteur Atar 09K-50, cependant, constituait encore une amélioration, et l'installation de ce moteur a conduit à la variante suivante du Mirage, le Mirage 50, dans les années 1970. Le moteur amélioré a donné au Mirage 50 de meilleures caractéristiques de décollage et de montée que ses prédécesseurs. Bien que le Mirage 50 intègre également une nouvelle avionique, comme un système radar Cyrano IV, il ne s'est pas avéré populaire dans les ventes à l'exportation, car la série Mirage de première génération devenait obsolète."
 VEN_jet_multirole_equipment_8: "Faucon de combat F-16A de General Dynamics"
 VEN_jet_multirole_equipment_8_short: "Faucon de combat F-16A"
 VEN_jet_multirole_equipment_8_desc: "Un chasseur maniable et léger avec une maniabilité et une stabilité bien équilibrées. Il possède un corps d'aile mixte exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Appelé « Fighting Falcon », son coût relativement faible et sa puissance élevée sont la raison pour laquelle il a été adapté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle best-seller ont été fabriqués."
 VEN_jet_multirole_equipment_9: "Dassault Mirage 50EV"
 VEN_jet_multirole_equipment_9_short: "Mirage 50EV"
 VEN_jet_multirole_equipment_9_desc: "En 1990, Dassault a mis à niveau un lot de Mirage IIIE et 5 vénézuéliens aux normes Mirage 50, les mises à niveau étant désignées Mirage 50M."

 VEN_mr_stealth_fighter_equipment_1: "Soukhoï Su-30MK2"
 VEN_mr_stealth_fighter_equipment_1_short: "Su-30MK2"
 VEN_mr_stealth_fighter_equipment_1_desc: "Une version Su-30MK2 développée par KnAAPO. L'armée de l'air russe a passé une première commande de cette variante en 2009. Les tests en usine ont été achevés en septembre 2010. Vingt avions ont été commandés ; 4 en 2009 et 16 en 2012. Au moins 12 ont été produits en août 2014, tous les quatre issus du premier contrat de 2009 et huit du deuxième contrat de 2012. Ils sont principalement destinés à être utilisés comme avions d'entraînement au combat pour les chasseurs Su-30SM/SM2 et Su-35."

