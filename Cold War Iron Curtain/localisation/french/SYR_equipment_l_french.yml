##Syrian Firearms

 SYR_infantry_equipment_0:0 "MAS-36"
 SYR_infantry_equipment_0_short:0 "MAS-36"
 SYR_infantry_equipment_0_desc:0 "Le MAS-36 est un fusil à verrou français, adopté par ses forces armées depuis 1936 et utilisé pendant la Seconde Guerre mondiale. Les fusils sont arrivés en grand nombre en Syrie pendant la Seconde Guerre mondiale, alors que les forces alliées sécurisaient la colonie du gouvernement de Vichy. Lorsque le pays a obtenu son indépendance, la France a laissé des milliers de fusils à la nouvelle armée syrienne indépendante."

 SYR_infantry_equipment_1:0 "Avtomat Kalachnikova 1947"
 SYR_infantry_equipment_1_short:0 "AK-47"
 SYR_infantry_equipment_1_desc:0 "L'AK-47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK-47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK-47 constituait une vaste mise à niveau du SKS. L'AK-47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde. "

 SYR_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 SYR_infantry_equipment_2_short:0 "AKM"
 SYR_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK-47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps. "

 SYR_infantry_equipment_3:0 "Avtomat Kalachnikova 1974"
 SYR_infantry_equipment_3_short:0 "AK-74"
 SYR_infantry_equipment_3_desc:0 "L'AK-74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un alésage chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été repensés pour contenir un canal bas installé à 90 degrés de l'axe de l'alésage afin de réduire le cisaillement des balles au niveau de la cale bâbord. De plus, son développement s'est accompagné d'une variété d'accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK-74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec des précisions moyennes plus élevées. Il a été utilisé de manière coûteuse pendant le conflit en Afghanistan, où la CIA a payé une grosse somme d'argent aux moudjahidines pour récupérer un AK-74 capturé."

 SYR_infantry_equipment_4:0 "Avtomat Kalachnikova 1974 modernizirovanniy"
 SYR_infantry_equipment_4_short:0 "AK-74M"
 SYR_infantry_equipment_4_desc:0 "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé pour incorporer de nouveaux matériaux et des avancées de fabrication afin de créer une arme améliorée. Il comporte un boulon et un support allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide chargé de verre pouvant tenir latéralement, une bouche améliorée, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également livré avec un rail pour le montage des optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant de pouvoir être envisagée. Cependant, il a été adopté par la Fédération de Russie."

 
 ########## NEW SYR ARMOR
 SYR_lt_equipment_1:0 "Renault R35"
 SYR_lt_equipment_1_short:0 "R35"
 #SYR_lt_equipment_2:0 ""
 #SYR_lt_equipment_2_short:0 ""
 SYR_lt_equipment_3:0 "PT-76"
 SYR_lt_equipment_3_short:0 "PT-76"
 SYR_lt_equipment_3_desc:0 "Le PT76 est un char léger amphibie soviétique et a été largement exporté dans le monde entier. Il a été conçu par N Shashmyrin et Zh Kotin en 1951 et environ 12 000 unités ont été fabriquées. Il nécessite un équipage de 3 hommes et un moteur V6 six cylindres en ligne avec une vitesse de 44 km/h et peut nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique et à tendance soviétique et, en tant que tel, a joué un rôle de reconnaissance dans pratiquement tous les conflits des nations de la sphère soviétique. Cependant, il est encore utilisé aujourd'hui dans de nombreux pays en raison de sa célèbre fiabilité et de sa facilité d'entretien."
 SYR_lt_equipment_4:0 "PT-76B modèle 4"
 SYR_lt_equipment_4_short:0 "PT-76B"
 SYR_lt_equipment_4_desc:0 "PT-76 armé du canon de char rayé D-56TS de 76,2 mm (frein de bouche à double chicane, éjecteur de cartouche, extracteur de fumée et système de stabilisation à 2 axes STP-2P 'Zarya'), du système de protection NBC PAZ (protivo-atomnaya zashchita), d'un système d'extinction automatique d'incendie, d'un viseur TShK-2-66 amélioré, d'un système de filtration-ventilation, de dispositifs d'observation améliorés, d'un système électrique amélioré. équipement, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1 800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."

 #SYR_mbt_equipment_0:0 "Panzerkampfwagen IV Ausf.J-Ausf.D Hybrid"
 #SYR_mbt_equipment_0_short:0 "Pz.Kpfw. IV Ausf.J-Ausf.D Hybrid"
 SYR_mbt_equipment_1:0 "Panzerkampfwagen IV Ausf.H"
 SYR_mbt_equipment_1_short:0 "Panzer IV Ausf.H"
 SYR_mbt_equipment_2:0 "T-54"
 SYR_mbt_equipment_2_short:0 "T-54"
 SYR_mbt_equipment_3:0 "T-55"
 SYR_mbt_equipment_3_short:0 "T-55"
 SYR_mbt_equipment_4:0 "T-62"
 SYR_mbt_equipment_4_short:0 "T-62"
 SYR_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "
 SYR_mbt_equipment_5:0 "T-62 Obr.1967"
 SYR_mbt_equipment_5_short:0 "T-62 Obr.1967"
 SYR_mbt_equipment_6:0 "T-72B"
 SYR_mbt_equipment_6_short:0 "T-72B"
 SYR_mbt_equipment_6_desc:0 "Le T-72 est un CCP soviétique créé comme une nouvelle génération de chars, principalement pour remplacer le T-62 et son homologue coûteux, le T-64. Il coûtait presque la moitié du prix du T-64 et comportait de vastes améliorations. Sa conception a été achevée en 1973 par Leonid Venediktov et a montré des capacités incroyables. Le canon et le blindage étaient toujours respectivement de 125 mm et composites, mais avec une conception beaucoup plus économique et plus facile à produire. Le moteur est un V-12 de 780 ch qui pourrait être ultérieurement réaménagé avec une conception de 1 130 ch. Le char pouvait atteindre une mobilité incroyable, atteignant des vitesses de 80 km/h et pouvait mieux s'adapter aux terrains plus difficiles que le T-64. Il a été utilisé dans tous les conflits de la sphère soviétique, contrairement au T-64, et y a également fait preuve d'incroyables capacités. Le char a également été largement utilisé dans des conflits hors de la sphère africaine, au Moyen-Orient et en Indochine."
 SYR_mbt_equipment_7:0 "T-72M1"
 SYR_mbt_equipment_7_short:0 "T-72M1"
 SYR_mbt_equipment_7_desc:0 "Le T-72 est un CCP soviétique créé comme une nouvelle génération de chars. Cette variante est une version d'exportation soviétique, avec un blindage plus épais et similaire au T-72A obr.1979g. Il est également équipé de 7+5 lance-grenades fumigènes sur l'avant de la tourelle."
 SYR_mbt_equipment_8:0 "T-72AV"
 SYR_mbt_equipment_8_short:0 "T-72AV"
 SYR_mbt_equipment_8_desc:0 "Le T-72AV est une version modernisée du char de combat principal de fabrication soviétique T-72B. Ce char est équipé d'un nouveau blindage, d'un nouveau moteur et d'un nouveau système de visée. Le T-72AV est entré en service dans les forces armées russes en 1985."
 SYR_mbt_equipment_9:0 "T-72AV TOUR-T"
 SYR_mbt_equipment_9_short:0 "T-72AV TOUR-T"
 SYR_mbt_equipment_9_desc:0 "Le T-72AV est une version modernisée du char de combat principal de fabrication soviétique T-72B. Ce char est équipé d'un nouveau blindage, d'un nouveau moteur et d'un nouveau système de visée. Le T-72AV est entré en service dans les forces armées russes en 1985. Cette variante a été améliorée avec un système de conduite de tir TURMS-T."

