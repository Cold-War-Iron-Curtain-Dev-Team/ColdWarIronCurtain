 SYR_jet_CAS_equipment_5:0 "Soukhoï Su-22"
 SYR_jet_CAS_equipment_5_short:0 "Su-22"
 SYR_jet_CAS_equipment_5_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 SYR_jet_CAS_equipment_6:0 "Soukhoï Su-22M4"
 SYR_jet_CAS_equipment_6_short:0 "Su-22M4"
 SYR_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 SYR_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-23BN"
 SYR_jet_CAS_equipment_7_short:0 "MiG-23BN"
 SYR_jet_CAS_equipment_7_desc:0 "Version améliorée du MiG-23B, le MiG-23BN se distinguait par le fait qu'il était équipé des ailes Edition 3 et du moteur R-29 des variantes de chasseurs contemporains, ainsi que de mises à jour mineures de l'électronique et de l'équipement."
 
