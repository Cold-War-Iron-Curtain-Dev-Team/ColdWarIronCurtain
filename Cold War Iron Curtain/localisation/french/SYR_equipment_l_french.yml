 SYR_jet_interceptor_equipment_7:0 "Mikoyan-Gourevitch MiG-25PD"
 SYR_jet_interceptor_equipment_7_short:0 "MiG-25PD"
 SYR_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de 1964 et est officiellement entré en service en 1970. Tout au long de sa vie, plus de 1 150 avions ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. L'avion a été conçu pour intercepter rapidement des avions à très haute altitude comme le U-2 et le B-58 à une vitesse fulgurante. L'avion a donné à l'Union soviétique un contrôle bien supérieur sur son propre espace aérien éloigné que jamais auparavant. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."

 SYR_jet_light_equipment_1:0 "Yakovlev Yak-18"
 SYR_jet_light_equipment_1_short:0 "Yak-18"
 SYR_jet_light_equipment_2:0 "Mikoyan-Gourevitch MiG-15UTI"
 SYR_jet_light_equipment_2_short:0 "MiG-15UTI"
 SYR_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 SYR_jet_light_equipment_3:0 "L-29 Delfin"
 SYR_jet_light_equipment_3_short:0 "L-29 Delfin"
 SYR_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 SYR_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 SYR_jet_light_equipment_4_short:0 "L-39 Albatros"
 SYR_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
 SYR_jet_light_equipment_5:0 "Aéro L-39ZA Albatros"
 SYR_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 SYR_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et les attaques légères, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un canon à double canon GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un chargeur de 150 cartouches dans la cellule."
 
