l_french:
 cwic_contain_communism_goal_name: "Contenir le communisme"
 cwic_contain_communism_goal_desc: "Tenez la ligne contre la marée rouge. Complété alors qu'il y a deux gouvernements communistes de moins dans le monde qu'au moment où cet objectif a été choisi."
 cwic_spread_the_revolution_goal_name: "Répandez la révolution"
 cwic_spread_the_revolution_goal_desc: "La révolution mondiale continue. Complété alors qu'il y a trois gouvernements communistes de plus dans le monde qu'au moment où cet objectif a été choisi."
 cwic_arsenal_of_the_bloc_goal_name: "Arsenal du Bloc"
 cwic_arsenal_of_the_bloc_goal_desc: "Construisez une base militaro-industrielle pour toute l'alliance. Terminé lorsque les membres de la faction contrôlent au moins une installation terrestre, une installation navale et une installation aérienne."
 cwic_non_aligned_unity_goal_name: "Unité régionale"
 cwic_non_aligned_unity_goal_desc: "Prouvez que l'alliance peut se suffire à elle-même. Terminé lorsque la faction reste ensemble avec au moins trois membres pendant cinq ans après avoir choisi cet objectif."
