 SOV_10th_5yp_category:0 "10e plan quinquennal"
 SOV_10th_5yp_category_desc:0 "10E plan quinquennal soviétique\nLe 10e plan quinquennal est un ensemble d'objectifs visant à renforcer l'économie de notre pays de 1976 à 1980, présenté au 25e Congrès par le président du Conseil des ministres Alexeï Kossyguine. Connu sous le nom de plan d'efficacité et de qualité, Brejnev affirmait que l'économie soviétique était confrontée à une croissance en déclin en raison de la lenteur des progrès technologiques dans le pays, d'où le plan mettant l'accent sur la nécessité d'innover technologiquement avec de nombreuses industries du pays identifiées pour une augmentation de l'efficacité.\n\n Progrès actuel : [?ROOT.sov_10th_5yp_progress|R]%"
