 SOV_11th_5yp_category:0 "11e Plan quinquennal"
 SOV_11th_5yp_category_desc:0 "11E plan quinquennal soviétique\nLe 11e plan quinquennal constitue une autre série d'objectifs visant à renforcer notre économie. Il est prévu que ce projet soit réalisé entre 1981 et 1985. Il a été présenté par le président du Conseil des ministres Nikolaï Tikhonov au 26e Congrès. Brejnev a déclaré aux délégués au congrès que l'objectif principal du plan est de faire passer l'économie d'une croissance extensive à une croissance intensive, et que l'amélioration du niveau de vie devrait être l'un des objectifs. D'autres objectifs comprenaient l'arrêt de la migration de l'Est vers l'Ouest et du Sud vers le Nord et assurer la croissance économique, la plupart des centres économiques soviétiques étant situés dans des zones sous-développées telles que la Sibérie et l'Asie centrale.\n\n Progrès actuel : §G[?ROOT.sov_11th_5yp_progress|R]%§!"
