 SOV_8th_5yp_category:0 "8e Plan quinquennal"
 SOV_8th_5yp_category_desc:0 "8E plan quinquennal soviétique\nLe 8e plan quinquennal est un ensemble ambitieux d'objectifs de production industrielle. Présentée lors du 23e Congrès, la logistique et l'organisation seront gérées par le gouvernement central, avec plus de pouvoir accordé aux propriétaires d'usines individuels quant à la manière dont ils respecteront leurs quotas. Le plan vise également à améliorer le bien-être des travailleurs et à permettre aux citoyens ordinaires d'accéder à une plus grande part de l'économie.\n\n Progrès actuel : [?ROOT.sov_8th_5yp_progress|R]%"
