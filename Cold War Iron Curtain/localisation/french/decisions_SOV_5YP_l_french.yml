 SOV_9th_5yp_category:0 "9e Plan quinquennal"
 SOV_9th_5yp_category_desc:0 "9E plan quinquennal soviétique\nL'objectif du neuvième plan quinquennal est de renforcer notre économie et nous cherchons à y parvenir de 1971 à 1975. Il a été présenté au 24e Congrès par le président du Conseil des ministres Alexeï Kossyguine. Son objectif principal est d'accroître la croissance des biens de consommation produits par l'industrie, Brejnev faisant remarquer que l'augmentation du niveau de vie était plus importante que le développement économique. Le plan comprend également une proposition d'augmentation du revenu national brut de 37 à 40 pour cent.\n\n Progrès actuel : [?ROOT.sov_9th_5yp_progress|R]%"
