 # ---- from United_Nations.txt ----
 UN_RESOLUTION.15073.d:0 "SUCCÈS DU LAC, [?global.date.GetDateStringNoHourLong] - Le Conseil de sécurité a approuvé les accords d'armistice conclus entre Israël et ses voisins arabes et a appelé à la poursuite de la supervision des Nations Unies. La décision soutient le mécanisme mis en place pour empêcher la reprise des combats en Palestine.\n\nLes observateurs militaires resteront préoccupés par les incidents survenus le long des lignes d'armistice et par le travail des commissions mixtes d'armistice. Leur tâche est d'aider à maintenir les accords conclus par les parties, plutôt que d'imposer une disposition définitive du territoire pour lequel elles se sont battues.\n\nLes armistices ont apporté un certain calme sans pour autant régler le conflit plus vaste. Les réfugiés restent déplacés et les lignes séparant les forces ne constituent pas une frontière politique convenue. L'action du Conseil maintient l'attention internationale sur ces lignes alors qu'un règlement de paix fait toujours défaut."
 UN_RESOLUTION.15073.t:0 "[GetNewspaperHeader]L'ONU approuve les accords d'armistice en Palestine"
 UN_RESOLUTION.15075.d:0 "SUCCÈS DU LAC, [?global.date.GetDateStringNoHourLong] - Le Conseil de sécurité a approuvé le maintien des dépenses de la Commission des Nations Unies pour l'Inde et le Pakistan. La décision maintient le soutien de ses travaux sur le différend au Cachemire, alors que les deux gouvernements restent divisés sur les étapes nécessaires à un règlement.\n\nLe cessez-le-feu laisse les questions centrales sans réponse. Les modalités de retrait et les conditions d'un plébiscite nécessitent encore un accord, chaque partie craignant que les concessions faites en premier ne la placent dans une position militaire ou politique désavantageuse.\n\nLe vote des dépenses permet aux représentants de la commission de poursuivre leurs efforts ; il ne fournit aucun calendrier de retrait convenu. D'autres discussions doivent transformer les propositions existantes en arrangements que les deux gouvernements accepteront avant qu'un vote sur l'avenir du Cachemire puisse être organisé."
 UN_RESOLUTION.15075.t:0 "[GetNewspaperHeader]Les Nations Unies financent la Commission Inde-Pakistan"
 UN_RESOLUTION.15076.d:0 "SUCCÈS DU LAC, [?global.date.GetDateStringNoHourLong] - Le Conseil de sécurité a approuvé le maintien du financement des observateurs militaires des Nations Unies en Indonésie. La décision soutient leur travail lors des négociations sur la fin de la domination néerlandaise et le transfert de souveraineté.\n\nLes observateurs soutiennent les efforts diplomatiques visant à empêcher une nouvelle rupture des combats. Les représentants néerlandais et indonésiens se réunissent à La Haye, où les termes d'un règlement doivent être conciliés avec les positions prises par les forces et les administrations de l'archipel.\n\nLe maintien d'observateurs sur le terrain donne à l'ONU un moyen de suivre la situation au-delà des salles de conférence. La décision de financement ne règle pas les conditions en suspens, mais elle maintient la présence internationale pendant que les parties travaillent à un transfert de pouvoir."
 UN_RESOLUTION.15076.t:0 "[GetNewspaperHeader]Les Nations Unies prolongent le financement des observateurs indonésiens"
