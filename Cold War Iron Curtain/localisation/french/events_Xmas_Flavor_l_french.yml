  Xmas.1.d:0 "Le programme de suivi du Père Noël par le Commandement de la défense aérospatiale de l'Amérique du Nord a débuté le 24 décembre 1955 ; lorsque le numéro de téléphone du centre de commandement de la défense aérienne continentale du NORAD (CONAD) a été accidentellement imprimé par erreur sur une publicité pour un grand magasin Sears proposant des appels téléphoniques au Père Noël. Les téléphones ont commencé à sonner au centre de la CONAD à Colorado Springs, passant même par le redoutable téléphone rouge, d'où venaient les ordres des autorités supérieures. Voyant une potentielle campagne de relations publiques, le colonel Harry Shoup et la CONAD ont commencé à « suivre » le Père Noël et à faire connaître l'emplacement du Père Noël aux enfants du monde entier. Aujourd'hui, le NORAD perpétue la tradition en effectuant un « suivi » en ligne, et les gens du monde entier peuvent toujours connaître l'emplacement du Père Noël à la minute près !"
  Xmas.2.d:0 "En Union soviétique, le réveillon du Nouvel An est devenu une véritable fête nationale, remplaçant Noël. Cela a été précédé par l'abolition de Noël en 1929. Le jour de l'An a été célébré pour la première fois en 1935. Les anciens attributs de Noël ont été sécularisés - Ded Moroz, le sapin et les cadeaux en dessous. En 1937, Ded Moroz eut une compagne obligatoire : la Snegurochka. L'époque soviétique a également vu ses propres attributs du Nouvel An ; les mandarines, la salade Olivier, la grève des carillons du Kremlin au cours de laquelle il faut faire un voeu et le discours festif du chef de l'Etat aux citoyens. Dans l'Empire russe, les bals du Nouvel An avaient lieu, à l'époque soviétique, ils ont été remplacés par des concerts et des fêtes \"Ogonek\", accompagnés de chants traditionnels tels que \"V lesu rodilas' yolochka et \"Cinq minutes\"."
  Xmas.3.d:0 "Noël à la Maison Blanche à Washington, DC, a toujours été une tradition pour chaque président. Le plus important est l'arbre de Noël de la Maison Blanche, utilisé pour la première fois officieusement dans les années 1850, mais qui n'a continué qu'en 1961, lorsque Jacqueline Kennedy a choisi un arbre et a utilisé le thème de Casse-Noisette. Le plus souvent sélectionné dans l'État de Caroline du Nord, l'arbre est offert par la National Christmas Tree Association et est exposé dans la salle bleue de la Maison Blanche. Mesurant environ 18 pieds de haut, l'arbre est décoré chaque année selon un thème spécifique, avec des ornements provenant fréquemment d'écoliers, de membres de l'armée ou de personnes hospitalisées. Aujourd'hui encore, il s'agit d'une tradition séculaire qui illustre l'esprit américain pendant la période des fêtes."
  Xmas.4.d:0 "S'éloignant des arbres de Noël vivants traditionnels, la première variété artificielle, l'arbre de Noël en aluminium de courte durée, a vu le jour au milieu des années 1950 et est devenue extrêmement populaire dans les années 1960 aux États-Unis. Connus sous le nom d'« Evergleam », plus d'un million d'arbres en aluminium étaient produits chaque année par l'Aluminum Specialty Company de Manitowoc, dans le Wisconsin. La fin du sapin de Noël en aluminium peut être attribuée à la première en 1965 de A Charlie Brown Christmas, qui peignait les sapins comme un symbole de la commercialisation excessive de Noël. Restant à ce jour une icône culturelle abandonnée ou restant poussiéreux dans les sous-sols, le sapin de Noël en aluminium représente une mode temporaire dans la culture américaine."
  Xmas.5.d:0 "La tradition de Noël la plus curieuse au monde est peut-être celle des conférences de Noël de la Royal Institution au Royaume-Uni. Lancée en 1825 pour promouvoir une éducation scientifique organisée, la tradition des présentations de phénomènes scientifiques est restée vivante, ayant commencé à être télévisée en 1965 sur la BBC. Des personnalités telles que Michael Faraday, Carl Sagan et David Attenborough ont donné des conférences, rendant la science amusante pour le public pendant la période des fêtes. "
  