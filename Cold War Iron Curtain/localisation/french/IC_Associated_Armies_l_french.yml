l_french:
 FRE_Associated_State_Armies:0 "Les armées des États associés"
 FRE_Associated_State_Armies_desc:0 "Saigon n'est pas la seule capitale à laquelle l'Union a promis une armée. Le gouvernement royal du Laos et le Cambodge gardent la frontière que le Viet Minh franchira ensuite, et aucun des deux n'a de force digne de ce nom. Paris peut dépenser ses crédits pour lever ses armées au lieu de se concentrer sur l'Armée nationale vietnamienne."
 FRE_Associated_State_Armies_tt:0 "Coûte §Y60§! Crédits de guerre. Le gouvernement royal du Laos et le Cambodge lèvent chacun §Y2§! divisions dotées d'effectifs et d'équipements.\nL'État du Vietnam ne reçoit aucun transfert d'équipement et sa limite de division en temps de guerre passe de §Y30§! à §Y25§!.\nUne diversion du Viet Minh dans le Bas Laos est contenue par l'armée royale laotienne, et la capitale royale laotienne et Luang Prabang sont mieux fortifiées contre une offensive du Pathet Lao.\nLe gouvernement royal du Laos et le Cambodge obtiennent un effet de levier sur la clause Laos et Cambodge lors de la Conférence de Genève.\nIncompatible avec Armer l'Armée Nationale."
 FRE_Associated_Armies_Chosen: "§YLe CEFEO a construit les armées royales lao et cambodgienne à la place de l'armée nationale vietnamienne.§!"
 LOS_Associated_Army_Raised: "§YL'armée royale laotienne a été levée grâce aux crédits français§!"
 CAM_Associated_Army_Raised: "§YL'armée cambodgienne a été levée grâce aux crédits français§!"
 VIE_Associated_Armies_Cap_Reduced: "§YL'État du Vietnam déploie une armée de guerre plus petite§!"
 IC_AFK_Seen_Associated_Armies_VNA: "§YLe parcours de l'Armée nationale vietnamienne a été observé§!"
 IC_AFK_Seen_Associated_Armies_Check: "§YLe déploiement des armées associées a été vérifié§!"
 IC_AFK_Seen_Associated_Armies_Lower_Laos: "§YLe confinement du Bas Laos a été observé§!"
