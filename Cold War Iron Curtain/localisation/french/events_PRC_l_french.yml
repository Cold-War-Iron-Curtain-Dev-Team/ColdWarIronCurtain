 PRC_Dispute.1.d:0 "Le Raj britannique a négocié ses frontières le long de l'Himalaya avec le Tibet et la Chine. Après la prise de contrôle du Tibet par la RPC, le nouveau régime a décidé d'annuler bon nombre de ces traités, arguant que le gouvernement tibétain n'avait aucune légitimité pour négocier des traités. La décision chinoise de développer des routes et des postes de troupes dans les zones contestées a conduit à de fortes protestations indiennes et à des déploiements de troupes. Les tensions se concentrent sur Aksai Chin et la North East Frontier Agency. À Aksai Chin, une ligne de contrôle réel (LAC) a été établie pour séparer les forces chinoises des forces indiennes, mais l'armée indienne a récemment lancé une politique avancée. Cependant, le conflit s'est étendu à un véritable affrontement frontalier alors que les forces chinoises ont commencé à encercler certains de ces postes tandis que l'armée indienne semble prête à envoyer des troupes pour sécuriser ses postes et disputer l'affrontement. Alors que l'Inde et la Chine envoient leurs troupes dans la zone de conflit, le monde attend de voir ce qui en résultera et si cette violence frontalière dégénère en un conflit plus large."
 PRC_Dispute.2.d:0 "Le gouvernement chinois a annoncé qu'il avait déclaré un cessez-le-feu unilatéral dans son conflit avec l'Inde après avoir chassé les forces indiennes des territoires contestés le long de l'Himalaya. Dès le début du conflit, la politique avancée de l'armée indienne dans les territoires contestés n'a pas réussi à perturber les forces chinoises. Au lieu de cela, les postes frontières indiens ont été submergés et les forces indiennes se sont effondrées face aux tactiques d'infiltration chinoises. New Delhi a réagi sous le choc lorsque le gouvernement indien a imploré les puissances occidentales de l'aider et d'empêcher une invasion chinoise. Même si la Chine semble avoir renoncé à ses ambitions limitées aux zones frontalières, l'Inde continue de craindre qu'une escalade ne conduise à un effondrement militaire complet. Washington et Londres ont tous deux manifesté la même préoccupation face à la menace communiste. Les observateurs pensent que l'Inde recevra probablement une aide pour reconstituer ses pertes, mais la fierté de l'Inde a été humiliée par ses performances désastreuses. On dit que les dirigeants militaires du Pakistan observent ces développements avec joie."
 PRC_Dispute.3.d:0 "Depuis 1945, l'Armée populaire de libération semble presque imparable dans la réalisation de ses objectifs. Cependant, suite à la demande de cessez-le-feu du gouvernement chinois et aux discussions avec l'Inde, il est devenu clair que l'armée indienne a pris le dessus dans le récent conflit frontalier dans l'Himalaya. L'Inde cherchera sans aucun doute à faire valoir ses revendications et y parviendra probablement puisque les forces chinoises auraient été chassées des terres contestées. La politique prospective de l'armée indienne s'est avérée très efficace. Les forces indiennes ont réussi à tendre une embuscade aux forces chinoises dans la région et la formation professionnelle et le leadership auraient joué un rôle déterminant dans le succès de l'Inde sur ce que les observateurs occidentaux considéraient comme une « armée paysanne ». Sur le plan intérieur, le gouvernement indien a affirmé sa force auprès de son peuple et a montré au monde que l'Inde n'avait pas besoin de compter sur des puissances étrangères pour se protéger de ses ennemis. À Pékin, beaucoup d'introspection et d'analyses doivent être faites, même si le gouvernement a réussi à faire taire les informations sur les revers militaires subis par la population."
 SINO_INDIA.10.d:0 "Le jeu dangereux du gouvernement indien consistant à interférer avec le Tibet et à déployer ses forces sur le territoire chinois a reçu une réponse appropriée. Les efforts indiens pour infiltrer notre frontière et s'emparer du Tibet les ont amenés à dépasser leurs capacités. Nos forces aguerries et patriotiques ont utilisé les leçons que nous avons apprises de la guerre en montagne pour submerger et détruire les forces indiennes dans le territoire contesté. Les soldats professionnels de l'armée indienne ont prouvé qu'ils étaient de simples marionnettes dévouées à l'argent et non au patriotisme et ont été facilement vaincus par nos forces. Après avoir sécurisé le territoire contesté, nous avons annoncé un cessez-le-feu unilatéral, nos forces peuvent sécuriser le territoire et nous avons annoncé au monde comment nous avons humilié notre ennemi. Plus important encore, la propagande ennemie selon laquelle nous prévoyons une invasion générale s'est révélée fausse. Cependant, compte tenu de nos succès, nous devons nous demander si nous voulons poursuivre les combats en Inde proprement dite pour assurer une victoire révolutionnaire majeure. Ou devrions-nous nous en tenir à notre cessez-le-feu et simplement achever notre annexion de l'Aksai Chin."
 SINO_INDIA.11.d:0 "Après de violents combats avec l'Inde le long de notre frontière himalayenne, la nouvelle nous est parvenue que les forces de l'Armée populaire de libération (APL) ont été chassées des territoires contestés. Les forces indiennes complices avaient établi des positions fortifiées plus tôt derrière nos lignes, avant les combats. Depuis ces positions, l'ennemi a réussi à bloquer les lignes de ravitaillement et à tendre une embuscade aux troupes qui traversaient notre propre territoire. Enhardies par leur succès perfide, les forces indiennes ont apporté leur soutien pour achever de nous chasser des terres contestées. Le gouvernement indien a annoncé que ses forces avaient réussi à occuper les terres qu'elles revendiquaient. L'APL a été humiliée et certains commandants suggèrent déjà que le modèle paysan-soldat pourrait ne pas être viable maintenant que la Chine a de vastes frontières à protéger. Peut-être faudrait-il faire preuve de plus de professionnalisme, à l'instar de l'armée indienne, pour garantir que, dans les conflits futurs, nos forces seront capables de répondre à des incidents frontaliers comme celui-ci. Nous devrons nous asseoir avec le gouvernement indien et écouter ses demandes concernant la frontière, en espérant que le Tibet ne soit pas compromis par ces événements."
 SINO_INDIA.12.d:0 "L'agression chinoise a commencé avec la prise du Tibet. Les Chinois rusés parlaient de paix mais agissaient pour s'emparer de nos terres. Depuis l'Himalaya, la Chine aurait été prête à piller nos terres, mais nos forces ont pris le dessus. Aujourd'hui, nous avons reçu une note du gouvernement chinois demandant un cessez-le-feu pour mettre un terme aux attaques contre ses forces et demandant également des discussions immédiates à la frontière. Le général B.M. L'ordre donné par Kaul à l'armée de s'engager dans une politique prospective visant à interdire les infiltrés chinois s'est avéré une stratégie judicieuse. Nos troupes et officiers professionnels ont atteint leurs objectifs à la perfection. Les efforts d'infiltration chinois ont été interrompus par nos postes avancés. L'évaluation de l'armée selon laquelle les troupes chinoises n'étaient que des paysans armés incapables de gérer des soldats professionnels s'est avérée exacte. Avec cette victoire, nous pouvons désormais dicter la frontière à ses justes dimensions. Les Chinois ne peuvent plus ignorer les traités ou les démarcations du passé et, plus important encore, ils devront restituer les terres du Cachemire qu'ils revendiquent illégalement. À New Delhi, des foules en liesse sont descendues dans les rues en scandant « Jai Hind ! Et couvrir de fleurs toute personne en uniforme militaire. Les bases militaires à travers le pays ont reçu des livraisons de bonbons de la part de citoyens reconnaissants alors que l'Inde indépendante a démontré son statut de puissance majeure."
 SINO_INDIA.13.d:0 "Le gouvernement indien a reçu une note du gouvernement chinois indiquant qu'il avait déclaré un cessez-le-feu unilatéral à Aksai Chin et à l'Agence des frontières du Nord-Est. Les forces chinoises ont sécurisé presque tout le territoire contesté et la résistance indienne s'est presque complètement effondrée dans la zone contestée. La décision de notre armée de lancer une politique avancée de patrouilles agressives et d'établir des postes derrière les positions des troupes chinoises s'est avérée mal conçue. Les tactiques d'infiltration chinoises ont réussi à isoler et à envahir bon nombre de ces postes. Plus important encore, les troupes indiennes ont marché vers la zone de combat himalayenne en uniformes d'été et manquaient de renseignements. Un officier subalterne s'est plaint amèrement que son unité devait utiliser des cartes touristiques locales, car ses propres cartes du territoire étaient presque sans valeur. Partout en Inde, les craintes d'une nouvelle agression chinoise sont palpables, tandis que l'armée indienne elle-même doit envisager une introspection. Malgré cela, le patriotisme reste élevé. La logistique et la formation spécialisée des troupes doivent être une priorité et de nombreux officiers affirment que l'armée doit faire évoluer ses doctrines au-delà de l'expérience de la Seconde Guerre mondiale. Bien que les Chinois se soient arrêtés et aient atteint leurs objectifs, nombreux sont ceux en Inde qui retiennent leur souffle car ils craignent une nouvelle agression chinoise pour profiter des revers militaires de l'Inde. À tout le moins, nous sommes à la merci des souhaits chinois sur les terres contestées."
 SINO.INDIA.T:0 "[GetNewspaperHeader]L'invasion de l'Inde"
 PRC_Dispute.4.d:0 "Les malheurs de l'armée et du gouvernement indiens se sont poursuivis lorsque l'Armée populaire de libération a annoncé qu'elle lançait une invasion de l'Inde. L'APL affirme que son objectif est de libérer le peuple indien de l'oppression coloniale. Cela marque un changement radical dans la mesure où l'APL a initialement décrit le conflit comme un conflit frontalier et les Indiens craignent maintenant que des vagues de divisions chinoises ne se déversent bientôt de l'Himalaya vers les plaines indiennes. L'armée indienne avait auparavant tenté de déloger l'APL et de sécuriser ses revendications le long de sa frontière contestée avec la Chine grâce à une politique d'établissement de petits avant-postes sur les terres contestées. À New Delhi, une atmosphère de peur est palpable puisque le gouvernement a désormais ordonné à l'armée de redéployer l'ensemble de ses forces pour faire face à la menace chinoise. Cependant, dans d'autres grandes villes, de nombreux Indiens sont descendus dans la rue pour manifester leur soutien à l'armée, et de nombreux jeunes hommes se sont engagés à résister aux Chinois." 
 PRC.201.d:0 "Aujourd'hui, selon le rapport du gardien. \nMao Zedong, ancien président de la République populaire de Chine, est décédé à Shaoshan, sa ville natale.\nMême s'il a commis quelques erreurs, il reste un grand leader.\n Après avoir prononcé un éloge funèbre à travers le pays, le président Liu Shaoqi a finalement annoncé sa décision d'incinérer son corps. Dans son éloge funèbre, il a commenté par euphémisme les « mérites et démérites » de Mao, a loué sa contribution à la libération de la Chine, mais a catégoriquement critiqué les politiques économiques et politiques erronées de Mao."
 PRC.202.d:0 "Le 8 janvier 1976, le Premier ministre Zhou Enlai, l'un des dirigeants éminents du Parti communiste chinois, décède à Pékin. Au cours de la cérémonie d'adieu au corps, qui a duré deux jours, des milliers de personnes dans la capitale sont venues au Monument aux héros du peuple pour pleurer Zhou Enlai. Des deux côtés de la rue Chang'an, des gens de tous horizons étaient bondés et le cortège funèbre s'étendait sur des dizaines de kilomètres.\n Les drapeaux ont été mis en berne au siège des Nations Unies à New York. Après que le corps ait été incinéré, selon les souhaits de Zhou, les cendres ont été dispersées dans le réservoir Miyun, la rivière Haihe à Tianjin et l'estuaire du fleuve Jaune."
 PRC.203.d:0 "Le 28 juillet 1976, un tremblement de terre de magnitude 7,8 s'est produit à Fengnan, ville de Tangshan, province du Hebei, qui a duré environ 23 secondes. Tangshan, une ville industrielle d'un million d'habitants, a été durement touchée. Comme le tremblement de terre s'est produit tôt le matin et que les transports, les communications, l'approvisionnement en eau et en électricité de la ville ont été interrompus après le séisme, les secours ont été difficiles. Selon les statistiques officielles, le tremblement de terre a tué plus de 240 000 personnes et en a gravement blessé plus de 160 000. \nAprès la catastrophe, le gouvernement chinois a immédiatement envoyé des troupes et mobilisé la population de tout le pays pour mener des activités de secours à Tangshan dans le but de restaurer la production industrielle et agricole et les communications vitales."
 PRC.204.d:0 "Zhu De, membre du Comité permanent du Bureau politique du Comité central du PCC et vice-président, est décédé à Pékin le 6 juillet 1976 à l'âge de 90 ans. Sa mort a une fois de plus suscité le profond chagrin et le souvenir du peuple de tout le pays après Zhou Enlai, et a également porté un coup dur à Mao Zedong.\nLes 9 et 10 juillet, une cérémonie de condoléances a eu lieu en l'honneur du camarade Zhu de au Palais de la culture des travailleurs de Pékin. Le 11, une réunion commémorative a eu lieu dans la Grande Salle du Peuple. Plus de 5 000 dirigeants de partis et d'État ainsi que des représentants de tous les horizons de la capitale ont assisté à la réunion commémorative. Hua Guofeng a prononcé un éloge funèbre lors de la réunion commémorative."
 PRC.205.d:0 "Après le déclenchement de l'incident de l'île de Zhenbao en 1969, les relations sino-soviétiques sont tombées au minimum. Le 21 mars, Zhou Enlai a convoqué une réunion avec Huang Yongsheng, Wu Faxian, Wen Yucheng et Chen Xilian, commandant de la région militaire de Shenyang, et le personnel concerné du département des opérations de l'état-major. Compte tenu de la situation dans laquelle l'armée soviétique pourrait occuper de force l'île de Zhenbao, Zhou Enlai a accepté de renforcer nos forces côtières et de les déployer vigoureusement afin d'attendre le travail et de se préparer à une attaque tardive.\nDans le même temps, concernant la demande de Kosykin de parler à Mao Zedong et Zhou Enlai par téléphone portable, les responsables concernés du ministère des Affaires étrangères ont été convoqués pour accepter de répondre au bureau de réanimation en Chine sous la forme d'un mémorandum : « au vu des relations actuelles entre la Chine et l'Union soviétique, il n'est plus applicable aux contacts téléphoniques. Si le gouvernement soviétique a quelque chose à dire, veuillez le soumettre officiellement au gouvernement chinois par la voie diplomatique. ' "
 PRC.206.d:0 "Après que les anciens présidents Liu Shaoqi et Deng Xiaoping aient été renversés en tant que capitalistes, Mao Zedong a commencé à chercher un successeur suffisamment fiable. Profitant de cette opportunité, Lin Biao, qui présidait le travail quotidien de la Commission militaire centrale, commença à se vanter de Mao Zedong, participa activement au travail politique, plaça des confidents à divers postes et renversa les ennemis politiques. Lin Biao est devenu le seul vice-président du Comité central lors de la onzième session plénière du huitième Comité central du PCC. Il semble que Lin Biao soit devenu le candidat le plus approprié à la présidence du neuvième Congrès national du PCC."
 PRC.207.d:0 "Lors du neuvième Congrès national du PCC, Mao Zedong a proposé que Lin Biao soit élu seul vice-président du Comité central, et il ne fait aucun doute que Lin Biao a été désigné comme unique héritier.\nUn certain nombre de responsables du parti ont des opinions différentes sur le style de conduite de Lin Biao et sur le résultat des élections.\nPar conséquent, en tant que Premier ministre du Conseil des Affaires d'État, l'attitude de Zhou Enlai envers Lin Biao est également très importante."
 prc.211.d:0 "Bien qu'il ait été désigné comme l'unique héritier au neuvième Congrès national du PCC, la condition physique de Lin Biao est devenue de plus en plus évidente, pressant Mao étape par étape. \nEn octobre 1970, avec le soutien de Lin Biao et dirigé par Lin Liguo, un groupe de cadres militaires forma une « flotte commune » et attendit une opportunité de lancer un coup d'État armé."
 prc.212.d:0 "9. Deuxième séance plénière du neuvième Comité central du PCC I : faut-il abolir le système du président national\nAprès le renversement de Liu Shaoqi, le poste de président est resté longtemps vacant. Lors de la deuxième séance plénière du neuvième Comité central du PCC, Mao Zedong a proposé au Comité central d'amender la Constitution et a proposé l'abolition du président. Cependant, en raison d'une considération réaliste du fonctionnement politique du pays, la plupart des membres du Comité central du PCC souhaitent toujours conserver le poste de président et proposer Mao Zedong comme président, mais Mao Zedong a toujours une autorité inébranlable.\nLa question de savoir s'il faut ou non supprimer le poste de président reste ouverte."
 prc.213.d:0 "10. La deuxième séance plénière du neuvième Comité central II du PCC : trois adverbes\nLes trois adverbes « génie », « créatif » et « global » sont apparus pour la première fois dans le communiqué de la onzième session plénière du huitième Comité central du PCC en août 1966. En tant qu'héritier, Lin Biao a copié ces trois adverbes, a promu à plusieurs reprises la « théorie du génie » en public et a soutenu que le président Mao était un génie rare. Mao lui-même est assez dégoûté par ces trois adverbes et a proposé à plusieurs reprises de les supprimer. Cependant, Wu Faxian a insisté pour réécrire les trois adverbes évaluant le « génie, de manière créative et complète » de Mao Zedong dans le projet de constitution, ce qui a délibérément suscité l'opposition de Zhang Chunqiao, Kangsheng et d'autres. Le développement de la contradiction entre les deux groupes a sérieusement affecté l'unité interne du parti, et le maintien ou non des trois adverbes est également devenu une décision clé de la réunion."
 prc.214.d:0 "En tant que membre principal du groupe Lin Biao, Chen Boda a créé une dynamique pour Lin Biao à de nombreuses occasions publiques. Lors de la deuxième séance plénière du neuvième Comité central du PCC, en tant qu'assistant de Lin Biao, il a présenté à plusieurs reprises des opinions opposées à celles de Mao Zedong, défiant l'autorité et testant ses résultats. La pression exercée sur Mao par la clique de Lin Biao a fait prendre conscience à Mao des ambitions de Lin Biao. Afin d'éviter une division publique au sein du parti, il semble avoir utilisé cette critique publique de Chen Boda pour avertir Lin Biao que c'était un bon choix."
 prc.215.d:0 "La deuxième séance plénière du neuvième Comité central du PCC s'est terminée sans heurts. Lors de la réunion, de nombreuses propositions avancées par Lin Biao ont été adoptées à l'unanimité. Conformément aux opinions de Mao Zedong, la séance plénière a critiqué Zhang Chunqiao, Kangsheng et d'autres, et a ordonné que la révision du prestige de Lin Biao au sein du parti atteigne un niveau sans précédent."
 prc.218.d:0 "Après la révélation du complot de Lin Biao visant à fomenter un coup d'État armé, il a fait défection vers l'Union soviétique à bord du Trident 257 tôt le matin du 13 septembre 1971. Cependant, en raison du décollage précipité, à 02h30 du matin, l'avion n'a pas réussi à atterrir dans la prairie au nord-est de Wenduerhan de la République populaire de Mongolie, tuant sur place Lin Biao, Lin Liguo, Ye Qun et neuf autres personnes. La plupart des autres membres du groupe Lin Biao ont été arrêtés ou se sont suicidés, et le groupe Lin Biao a été déclaré détruit.\nEnsuite, conformément aux instructions des autorités centrales, l'ambassadeur de Chine en Mongolie Xu Wenyi et d'autres se sont rendus sur le lieu de l'accident pour inspecter le corps, ont enterré le corps sur place et sont rentrés chez eux avec un grand nombre de photos prises sur les lieux à signaler."
 prc.217.d:0 "Après la révélation du complot de Lin Biao visant à fomenter un coup d'État armé, il a fait défection vers l'Union soviétique à bord du Trident 257 tôt le matin du 13 septembre 1971. Cependant, en raison du décollage précipité, à 02h30 du matin, l'avion n'a pas réussi à atterrir dans la prairie au nord-est de Wenduerhan de la République populaire de Mongolie, tuant sur place Lin Biao, Lin Liguo, Ye Qun et neuf autres personnes. La plupart des autres membres du groupe Lin Biao ont été arrêtés ou se sont suicidés, et le groupe Lin Biao a été déclaré détruit.\nEnsuite, conformément aux instructions des autorités centrales, l'ambassadeur de Chine en Mongolie Xu Wenyi et d'autres se sont rendus sur le lieu de l'accident pour inspecter le corps, ont enterré le corps sur place et sont rentrés chez eux avec un grand nombre de photos prises sur les lieux à signaler."