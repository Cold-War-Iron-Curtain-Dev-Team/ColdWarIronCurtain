  # Please write \n or \n\n if you wish for a new line.

  SWF_Indochina_War.0.t:0 "La route vers le nord-ouest"
  SWF_Indochina_War.0.d:0 "L'Armée populaire a entamé une nouvelle phase d'opérations dans les hauts plateaux du nord. Il ne s'agit pas seulement de s'emparer du terrain, mais d'étendre le mince réseau de postes ennemis, de rouvrir les routes reliant le Viet Bac à la frontière et d'amener les peuples des montagnes à une coopération plus étroite avec la République démocratique. \n\nLes commandants ont reçu pour instruction d'éviter les engagements frontaux coûteux là où l'ennemi peut concentrer une puissance de feu supérieure. Au lieu de cela, les unités mobiles frapperont des garnisons isolées, couperont les routes et les communications et forceront le commandement colonial à disperser ses forces sur un territoire qu'il ne peut pas totalement contrôler. L'arrivée de ravitaillements et de conseillers par la frontière nord a donné à l'état-major la certitude que l'Armée populaire est prête à tester une doctrine opérationnelle plus ambitieuse."
  SWF_Indochina_War.0.a:0 "Les montagnes deviendront notre champ de bataille."

  SWF_Indochina_War.1.t:0 "Victoire dans les hauts plateaux de Muong"
  SWF_Indochina_War.1.d:0 "Après de durs combats le long des abords des montagnes, l'Armée populaire a percé les positions de défense dans les hauts plateaux de Muong. Les guides locaux, les détachements de milice et les formations régulières ont travaillé ensemble pour isoler les avant-postes ennemis avant l'assaut principal. La victoire garantit des routes précieuses à travers le nord-ouest et démontre que la position coloniale à l'intérieur peut être remise en question par des opérations révolutionnaires coordonnées. \n\nL'état-major a prévenu que la campagne n'était pas terminée. Les forces ennemies conservent la capacité de contre-attaquer à partir de bases plus solides, et les districts nouvellement libérés doivent être approvisionnés, administrés et défendus. Pourtant, le résultat a remonté le moral de tout le Viet Bac et renforcé la confiance dans l'Armée populaire en expansion."
  SWF_Indochina_War.1.a:0 "Le nord-ouest s'ouvre devant nous."

  SWF_Indochina_War.2.t:0 "Revers dans les hauts plateaux de Muong"
  SWF_Indochina_War.2.d:0 "L'offensive sur les hauts plateaux de Muong n'a pas réussi à atteindre ses objectifs. Un terrain difficile, des communications inadéquates et une résistance déterminée de la part des forces en défense ont empêché l'Armée populaire de sécuriser les positions prévues. Plusieurs unités se sont retirées en bon ordre, mais l'opération a montré que les avant-postes ennemis ne peuvent pas encore être vaincus sans une reconnaissance plus forte, une meilleure logistique et une coordination plus étroite entre les milices locales et les troupes régulières. \n\nLa défaite est une déception, pas un désastre. Le commandement révolutionnaire reste intact et les leçons de la campagne seront soigneusement étudiées avant la prochaine tentative."

  SWF_Indochina_War.2.a:0 "Apprenez, réorganisez et revenez."

  SWF_Indochina_War.3.t:0 "Le Front Muong tient bon"
  SWF_Indochina_War.3.d:0 "Les forces de défense sur les hauts plateaux de Muong ont repoussé la tentative d'avancée de l'Armée populaire. Les formations attaquantes ont été incapables de maintenir leur élan à travers ce pays montagneux difficile, tandis que les défenseurs locaux exploitaient un terrain familier et préparaient des positions pour contrecarrer les assauts répétés. \n\nLe résultat préserve pour le moment l'équilibre des pouvoirs existant dans les hauts plateaux. Néanmoins, l'ampleur de l'opération confirme que les forces révolutionnaires sont de plus en plus capables de coordonner les unités régulières avec les groupes armés locaux. Les commandants s'attendent à ce que la lutte pour le nord-ouest se poursuive."

  SWF_Indochina_War.3.a:0 "La frontière reste contestée."

  SWF_Indochina_War.4.t:0 "L'opération Nord-Ouest est abandonnée"
  SWF_Indochina_War.4.d:0 "L'opération prévue dans le nord-ouest a été annulée avant qu'un résultat décisif puisse être obtenu. Que ce soit en raison de conditions changeantes sur le front, d'une incapacité à concentrer suffisamment de forces ou des exigences d'un autre secteur de la guerre, l'offensive a été reportée. \n\nLe retrait ne met pas fin à la lutte pour les hauts plateaux. Les routes, les lignes d'approvisionnement et l'organisation politique seront renforcées pendant que l'état-major examine le plan de campagne. Lorsque les conditions seront plus favorables, l'Armée populaire reviendra."
  SWF_Indochina_War.4.a:0 "Il y aura une autre opportunité."

  SWF_Indochina_War.5.t:0 "Les hauts plateaux de Tay sont libérés"
  SWF_Indochina_War.5.d:0 "La campagne contre la région autonome de Tay a brisé l'emprise de la fédération sur les hauts plateaux de l'Est. Les forces révolutionnaires ont vaincu la résistance organisée autour de Hoang Lien Son, tandis que les cadres locaux se déplacent pour sécuriser les routes, les villages et les centres administratifs dans les districts libérés. \n\nLa fédération elle-même n'a pas capitulé. Déo Van Long et ce qui reste de son administration se sont retirés vers l'ouest, dans les hautes vallées, où les Français ont promis de les soutenir, et le drapeau tricolore flotte toujours au-dessus de la piste d'atterrissage de Dien Bien Phu. L'état-major considère la campagne comme un succès - les approches nord-ouest sont ouvertes et les postes intérieurs ennemis sont désormais isolés - mais le reste du pays Tay devra être pris séparément, et Paris semble déterminé à en faire une bataille plutôt qu'une marche."

  SWF_Indochina_War.5.a:0 "Les montagnes sont à nous. La vallée peut attendre."

  SWF_Indochina_War.6.t:0 "Défaite au pays Tay"
  SWF_Indochina_War.6.d:0 "L'assaut contre la région autonome de Tay a été repoussé. Les forces de défense ont maintenu leurs positions et l'Armée populaire a été contrainte de se désengager avant que l'opération ne se transforme en une coûteuse bataille d'usure. \n\nCet échec laisse une poche hostile sur le front nord-ouest et prive le commandement révolutionnaire des routes sécurisées qu'il espérait conquérir. Le travail politique auprès de la population locale se poursuivra, mais l'état-major doit maintenant décider s'il doit renouveler l'effort plus tard ou chercher un autre moyen de contourner la région fortifiée."
  SWF_Indochina_War.6.a:0 "La frontière n'est pas encore conquise."

  SWF_Indochina_War.7.t:0 "L'offensive Duyen réussit"
  SWF_Indochina_War.7.d:0 "L'Armée populaire a atteint ses objectifs dans l'opération Duyen. Après avoir sondé les positions défensives et coupé leurs lignes de communication, les forces vietnamiennes ont concentré leurs forces sur des points isolés et ont forcé le retrait de la zone contestée. \n\nLa victoire confirme la valeur de la doctrine en développement de l'état-major : les forces locales fixent l'ennemi sur place, les milices rassemblent des renseignements et protègent l'arrière, et les unités régulières portent le coup décisif là où la balance est favorable. Les commandants examinent déjà comment les leçons de Duyen peuvent être appliquées aux campagnes plus vastes à venir."
  SWF_Indochina_War.7.a:0 "Un autre pas vers la libération."

  SWF_Indochina_War.8.t:0 "L'offensive Duyen est repoussée"
  SWF_Indochina_War.8.d:0 "L'opération Duyen n'a pas réussi à briser la ligne de défense. L'Armée populaire a rencontré une résistance plus forte que prévu et n'a pas pu maintenir son avance assez longtemps pour sécuriser les districts ciblés. Les unités se sont retirées vers des positions préparées plutôt que de risquer des pertes inutiles. \n\nCe revers retardera le plan de campagne plus large, mais il a également révélé des faiblesses en matière d'approvisionnement, de communications et de soutien d'artillerie qui peuvent être corrigées. La lutte pour la région est loin d'être terminée."
  SWF_Indochina_War.8.a:0 "La prochaine offensive doit être mieux préparée."

  SWF_Indochina_War.9.t:0 "La ligne Duyen tient bon"
  SWF_Indochina_War.9.d:0 "Les forces de défense ont tenu la ligne Duyen contre une offensive déterminée de l'Armée populaire. Des positions préparées et des renforts opportuns ont empêché les attaquants de transformer leurs gains initiaux en une percée décisive. \n\nLe résultat préserve le front existant, mais la campagne a démontré que le commandement révolutionnaire est disposé à engager des formations de plus en plus organisées dans des opérations dans ce secteur. Les défenseurs ont peut-être tenu le coup aujourd'hui, mais il est peu probable que la pression sur la ligne disparaisse."
  SWF_Indochina_War.9.a:0 "Les positions sont sécurisées - pour l'instant."

  SWF_Indochina_War.10.t:0 "La ligne Duyen s'effondre"
  SWF_Indochina_War.10.d:0 "La ligne défensive de Duyen s'est effondrée sous la pression soutenue de l'Armée populaire. Les positions locales étaient isolées, les communications échouaient et le commandement en défense était incapable de rétablir un front cohérent avant que l'avancée révolutionnaire ne sécurise le territoire contesté. \n\nCette défaite constitue un coup dur pour la défense de la région. Les cadres révolutionnaires agissent rapidement pour établir l'autorité dans les districts nouvellement conquis, tandis que les défenseurs survivants doivent reconsidérer la manière dont le front plus large peut être stabilisé. L'initiative dans ce secteur est passée de manière décisive à Hanoï."

  SWF_Indochina_War.10.a:0 "L'équilibre de la guerre a changé."

  SWF_Indochina_War.11.t:0 "Le Fort des Hautes Terres de Tai"
  SWF_Indochina_War.11.d:0 "Les milices de la fédération et les garnisons françaises stationnées parmi elles ont repoussé l'avancée de l'Armée populaire dans les hauts plateaux du nord-ouest. Un terrain familier, des points forts préparés et la difficulté de déplacer l'artillerie à travers les vallées ont fait autant de travail que les combats eux-mêmes. \n\nLes régiments de Hanoï se sont repliés vers leurs bases, mais personne dans les montagnes ne croit que l'affaire soit réglée. Les dirigeants de la fédération ont demandé à Paris plus que de la sympathie, et la question de savoir si les hauts plateaux pourront être défendus une seconde fois plane désormais sur tous les conseils de la région."
  SWF_Indochina_War.11.a:0 "Les montagnes nous ont défendus cette fois."

  SWF_Indochina_War.12.t:0 "La Fédération Tai est envahie"
  SWF_Indochina_War.12.d:0 "L'Armée populaire a brisé les défenses de la fédération dans le nord-ouest. Les avant-postes ont été isolés un par un, les routes vers l'ouest ont été coupées et la milice qui tenait les vallées pendant une génération s'est dissoute sous le poids du nombre pour laquelle elle n'avait jamais été construite. \n\nCe qui reste de l'autorité de la fédération est en train d'être intégré à la République démocratique. Une partie des dirigeants a fui vers les lignes françaises ; les autres négocient les conditions qu'ils peuvent encore obtenir. L'autonomie promise aux Highlands s'est terminée comme ses détracteurs l'avaient toujours annoncé."
  SWF_Indochina_War.12.a:0 "La fédération est tombée."

  SWF_Indochina_War.13.t:0 "Muong est envahi"
  SWF_Indochina_War.13.d:0 "La défense des hauts plateaux de Muong s'est effondrée. L'Armée populaire a franchi les approches montagneuses plus rapidement que les renforts n'ont pu être amenés, et les dernières positions cohérentes autour de Hoa Binh ont été abandonnées. \n\nDes cadres révolutionnaires s'installent déjà dans les sièges des districts. Pour Hanoï, la campagne a ouvert le couloir qu'elle souhaitait ; pour les dirigeants des Highlands, cela a mis fin à la fiction selon laquelle l'intérieur pouvait être tenu sans l'armée française."
  SWF_Indochina_War.13.a:0 "Les hauts plateaux sont perdus."

  SWF_Indochina_War.17.t:0 "La vallée est ouverte"
  SWF_Indochina_War.17.d:0 "La reconnaissance depuis les collines au-dessus de Dien Bien Phu rapporte ce que l'état-major attendait à moitié depuis des mois : les Français ne sont pas venus. Il n'y a aucun avion de transport sur la bande, aucun anneau de points forts au fond de la vallée, aucune artillerie creusée dans les hauteurs environnantes. Ce qui retient le dernier du pays Tay, ce sont les propres milices de la fédération et tout ce que le commandement colonial peut épargner, ce qui est très peu. \n\nLe bassin est la porte d'entrée naturelle du Haut Laos et la dernière partie du nord-ouest encore en dehors de la République démocratique. Le prendre ne coûterait qu'une fraction de ce qu'exigerait une position fortifiée, et les divisions sont déjà dans les hautes terres. \n\nCertains membres de l'état-major conseillent la patience, arguant que les troupes engagées dans la vallée sont des troupes absentes du delta, et qu'une garnison française pourrait encore apparaître et livrer à la révolution la bataille décisive qu'elle attendait. D'autres répondent qu'on ne refuse pas une porte ouverte dans l'espoir que quelqu'un construira plus tard un mur en travers."
  SWF_Indochina_War.17.a:0 "Prenez la vallée."
  SWF_Indochina_War.17.b:0 "Laissez les hauts plateaux tranquilles. Notre force est nécessaire ailleurs."

  SWF_Indochina_War.15.t:0 "Dien Bien Phu est prise"
  SWF_Indochina_War.15.d:0 "L'Armée populaire occupe le bassin de Dien Bien Phu. Les milices restantes de la fédération ont offert une résistance dispersée autour de la piste d'atterrissage avant de se disperser dans les collines ou de déposer les armes, et à la tombée de la nuit, le siège du district était aux mains des révolutionnaires. Le gouvernement de Deo Van Long a cessé d'exister. \n\nIl n'y eut ni siège, ni duel d'artillerie sur les hauteurs environnantes, ni épopée à écrire sur la vallée. Les Français ne sont jamais venus et le nord-ouest a été achevé presque comme une question administrative. \n\nDes cadres sont déjà à l'oeuvre parmi les communautés Tay, Meo et Thai des hautes vallées, où la question de savoir ce que signifiera l'autonomie sous Hanoï plutôt que sous Paris se pose désormais immédiatement. Les routes menant au Haut-Laos sont ouvertes."
  SWF_Indochina_War.15.a:0 "Le Nord-Ouest est solidaire de la révolution."

  SWF_Indochina_War.16.t:0 "Repoussés dans les Hautes Vallées"
  SWF_Indochina_War.16.d:0 "L'avancée dans le bassin de Dien Bien Phu a été repoussée. Les milices de la fédération connaissaient mieux que nos guides les approches, le temps fermait les cols au pire moment possible et ce qui devait être une occupation devint un combat coûteux et peu concluant dans un pays qui favorise à chaque instant le défenseur. \n\nLes régiments se sont retirés dans les hautes terres de l'est dans un ordre raisonnable. L'administration Tay survit dans la vallée, sa confiance considérablement restaurée, et les Français en ont profité pour lui renouveler leurs garanties. \n\nL'état-major ne répétera pas l'opération sur les mêmes hypothèses."
  SWF_Indochina_War.16.a:0 "La vallée a gagné du temps."

  SWF_Indochina_War.18.t:0 "La Fédération Tai s'effondre"
  SWF_Indochina_War.18.d:0 "Le camp de Dien Bien Phu disparu, plus rien ne s'oppose à l'Armée populaire et aux derniers survivants du pays Tay. La milice de la fédération, qui tenait les hautes vallées uniquement parce qu'une garnison française se tenait derrière elles, s'est désintégrée ; ses dirigeants se sont dispersés vers la frontière laotienne ou ont entamé des négociations avec nos commandants avancés. \n\nL'administration autonome de Deo Van Long, créée par Paris pour tenir les hauts plateaux contre la révolution, a pris fin avec l'armée qui la garantissait. L'ensemble du nord-ouest est désormais aux mains de la République démocratique. \n\nLe travail politique commence immédiatement. Les Français ont promis l'autonomie aux peuples montagnards et ont plutôt eu droit à la guerre ; ils devront être persuadés que les promesses de Hanoï valent davantage et que cette persuasion prendra plus de temps que la campagne."
  SWF_Indochina_War.18.a:0 "Les hauts plateaux appartiennent à la révolution."

#### Dien Bien Phu outcome (fired by vin_dbp_record_outcome) ####
  SWF_Indochina_War.30.t:0 "[GetNewspaperHeader]Le camp de Dien Bien Phu est tombé"
  SWF_Indochina_War.30.d:0 "La garnison de Dien Bien Phu s'est rendue. Après des semaines sous l'artillerie qui, selon les planificateurs français, ne pourrait jamais être amenée au-dessus des montagnes, les derniers points forts du fond de la vallée furent envahis et le commandant du camp ordonna l'arrêt des tirs plutôt que de dépenser ce qui restait de ses hommes.\n\nLa position a été choisie délibérément : une tête aérienne fortifiée au plus profond des hautes terres, destinée à attirer l'Armée populaire à découvert et à la détruire contre les défenses préparées. Au lieu de cela, les canons furent enterrés dans les collines au-dessus du camp, la piste d'atterrissage fut fermée en quelques jours et une armée alimentée uniquement par parachutes fut assiégée par une armée alimentée par cent mille porteurs.\n\nCe qui a été perdu ici, ce n'est pas une province. C'est l'argument selon lequel la guerre pourrait encore être gagnée en tenant bon, et chaque chancellerie qui attendait une réponse à cette question en a désormais une."
  SWF_Indochina_War.30.a:0 "La vallée est à nous."
  SWF_Indochina_War.30.b:0 "La République n'y survivra pas."
  SWF_Indochina_War.30.c:0 "Un empire vient de recevoir sa réponse."
  SWF_Indochina_War.31.t:0 "[GetNewspaperHeader]Le camp de Dien Bien Phu détient"
  SWF_Indochina_War.31.d:0 "Le siège de Dien Bien Phu est levé. Les points forts au fond de la vallée ont tenu jusqu'aux assauts finaux, la piste d'atterrissage est restée ouverte assez longtemps pour que cela compte, et l'Armée populaire a replié ses canons dans les collines plutôt que de dépenser le reste de sa force principale contre des barbelés et du béton.\n\nLe camp était un pari sur une proposition simple : qu'une tête aérienne fortifiée dans les hautes terres pourrait entraîner l'armée de la révolution dans une bataille qu'elle ne pourrait pas gagner. Car une fois que la proposition a été prouvée, les divisions qui étaient censées envahir le nord-ouest repassent par les cols sans cette proposition.\n\nParis en fera beaucoup et il en a bien mérité. Qu'une vallée tenue soit la même chose qu'une guerre gagnée est une question qui se pose à différents groupes d'hommes dans une salle différente."
  SWF_Indochina_War.31.a:0 "La ligne a tenu."
  SWF_Indochina_War.31.b:0 "Nous ne commettrons pas cette erreur deux fois."
  SWF_Indochina_War.31.c:0 "Les Français peuvent donc encore gagner une bataille."
  SWF_Indochina_War.32.t:0 "[GetNewspaperHeader]Le corps d'armée s'implante à Dien Bien Phu"
  SWF_Indochina_War.32.d:0 "Le Groupement Opérationnel du Nord-Ouest a pris position dans la vallée de Dien Bien Phu. Des bataillons de parachutistes et de la Légion ont été envoyés dans le bassin en quelques jours, la piste d'atterrissage a été rouverte et les points forts entourant le fond de la vallée sont en train d'être câblés et creusés aussi vite que les ingénieurs peuvent travailler.\n\nLe raisonnement est qu'une tête aérienne fortifiée à cheval sur la route menant au Laos ne peut être ignorée et qu'une armée obligée de venir se battre pour elle doit combattre sur le terrain choisi par le corps. C'est l'argument qui sous-tend toute cette position : non pas tenir le Nord-Ouest, ce qui ne peut pas être tenu, mais faire du Nord-Ouest le lieu où l'Armée populaire sera finalement amenée à une bataille dont elle ne pourra pas s'éloigner.\n\nTout dans cet argument repose sur le fait que la piste d'atterrissage reste ouverte et que les collines au-dessus de la vallée restent vides. Ce sont maintenant des questions auxquelles l'autre partie doit répondre."
  SWF_Indochina_War.32.a:0 "Laissez-les venir à nous."
  SWF_Indochina_War.32.b:0 "Ils ont marché dans les collines et ont fermé la porte derrière eux."
  SWF_Indochina_War.32.c:0 "Une garnison dans un bassin et les hauteurs abandonnées."
