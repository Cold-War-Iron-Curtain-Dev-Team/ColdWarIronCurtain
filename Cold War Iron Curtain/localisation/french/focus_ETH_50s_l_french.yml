#1949-1959
 ethiopia.tt:0 "§GLa force KLFA/Mau Mau augmentera de 1"
 eth50.tt.3:0 "§YCette concentration débloquera une décision £decision_icon_small pour que§! §Tle Tewahedo devienne indépendant du Patriarche d'Alexandrie§!"
 eth50.tt.2:0 "§Tdébloque une décision visant à soulager la famine§!"
 ethiopian_ship_repair:0 "Constructeurs de navires érythréens"
 anti_air_defenses:0 "Initiative anti-aérienne éthiopienne"
 eth50.3.d:0 "L'Éthiopie se trouve dans une situation difficile après la Seconde Guerre mondiale et la seconde guerre italo-éthiopienne. Avec un nouveau gouvernement italien ayant des relations indéterminées avec l'Éthiopie et une hégémonie britannique de plus en plus incontestée à la frontière de l'Éthiopie, l'avenir des intérêts éthiopiens est incertain. Les discussions au sein du comité de décolonisation des Nations Unies discutent de l'idée d'une adhésion de l'Érythrée à l'Éthiopie dans une fédération ; Certains pensent que la nation limitrophe du mandat somalien devrait être rapprochée de l'indépendance"
 eth50.5.d:0 "La semaine dernière, le Comité central de l'ONU a passé quarante minutes lors de l'ouverture de sa délégation à réprimander l'administration éthiopienne pour ses récentes acquisitions territoriales. Alors que de nombreux dirigeants mondiaux proposent des sanctions et des dénonciations diplomatiques, on peut affirmer sans se tromper que ces événements récents n'ont guère amélioré les relations diplomatiques éthiopiennes."
 eth50.6.d:0 "La proposition de résolution 390-A (V) de l'ONU a été renforcée par les récentes discussions au sein du comité central de l'ONU. La résolution appelle à ce que l'Érythrée, sous mandat de l'ONU, devienne un État fédéral de l'Éthiopie, avec sa constitution actuelle et son chef de l'exécutif soumis à la détermination éthiopienne."
 eth50.7.d:0 "L'ensemble de l'Europe et le Comité central de l'ONU ont manifesté leur soutien à la récente résolution 390-A(V), car elle constitue une fin raisonnable aux possessions coloniales impérialistes d'une nation du tiers monde."
 eth50.8.d:0 "Aujourd'hui, Hailé Sélassié, sous la supervision du conseil impérial, a signé la loi fédérale de 1952. La loi initie officiellement le transfert de l'Érythrée du contrôle britannique au contrôle éthiopien. Alors que le chef de l'exécutif érythréen ressent la pression de la couronne impériale, l'ambiance générale en Érythrée est initialement positive."
 eth50.9.d:0 "Tedla Bairu, le premier chef de l'exécutif érythréen, a démissionné la semaine dernière en réponse à la politique envers les Érythréens au sein de l'Empire éthiopien. L'administration d'Adis Abeba a dissous la constitution érythréenne et interdit l'usage officiel des langues érythréenne et arabe ; et a découragé les minorités islamiques de pratiquer. Asfaha Woldemikael, son remplaçant, a affiché un point de vue beaucoup plus pro-amharique sur le statu quo au sein de son bureau municipal local, ce qui a conduit à sa nomination au poste de directeur général érythréen."
 eth50.10.d:0 "Conformément au principe de sécurité collective, dont Hailé Sélassié est un ardent défenseur, l'Éthiopie a envoyé un contingent dirigé par le général Mulugeta Buli et Kebbede Guebre, connu sous le nom de bataillon Kagnew, pour prendre part à la guerre de Corée. Elle est rattachée à la 7e Division d'infanterie américaine et participera à des engagements majeurs."
 eth50.11.d:0 "Les Nations Unies ont remis ce soir une proposition écrite éthiopienne à nos délégués à Paris. La proposition appelle à la reconnaissance formelle par l'Italie de l'État éthiopien et, en outre, l'Éthiopie a présenté à la Commission économique pour l'Italie une facture de 0 746 023 £184pour les dommages infligés au cours de l'occupation italienne. La liste comprenait la destruction de 2 000 églises, 535 000 maisons, l'abattage ou le vol de 5 000 000 de bovins, 7 000 000 de moutons et de chèvres, 1 000 000 de chevaux et mulets et 700 000 chameaux"
 eth50.12.d:0 "La délégation éthiopienne à Rome a rencontré une réponse sombre tandis que des accords ont été conclus pour payer la facture présentée à la Commission économique pour l'Italie de 0 746 023 £184pour les dommages infligés au cours de l'occupation italienne. La liste comprenait la destruction de 2 000 églises, 535 000 maisons, l'abattage ou le vol de 5 000 000 de bovins, 7 000 000 de moutons et de chèvres, 1 000 000 de chevaux et mulets et 700 000 chameaux"
 eth50.15.d:0 "Au Tigré, une famine a fait jusqu'à présent plus de 100 000 morts : Hailé Sélassié refuse d'envoyer une aide alimentaire d'urgence de base significative à la province du Tigré, conformément aux positions prises par le Conseil impérial."
 eth50.16.d:0 "L'Éthiopie a acheté vingt tankettes tchécoslovaques AH-IV à la Suède à la fin des années 1940. Ils viennent tout juste d'arriver à Djibouti, après quoi ils ont été transportés par chemin de fer jusqu'à Addis Abeba."
 eth50.17.d:0 "Un groupe consultatif américain sur l'assistance militaire a été envoyé en Éthiopie et a commencé son travail en réorganisant l'armée en trois divisions. Former nos troupes selon les normes de l'armée américaine et fournir des armes légères à un prix raisonnable."
 ETH_50s_address_ethiopian_feudalism:0 "Aborder la féodalité éthiopienne"
 ETH_50s_address_ethiopian_feudalism_desc:0 "Indépendamment de ce que veut la noblesse, nous n'avons d'autre choix que de nous attaquer aux pratiques féodales de notre pays"
 ETH_50s_ethiopian_modernization:0 "Modernisation éthiopienne"
 ETH_50s_ethiopian_modernization_desc:0 "Nous devons moderniser les éléments fondamentaux de notre société"
 ETH_50s_further_crackdown_on_slavery:0 "Poursuite de la répression contre l'esclavage"
 ETH_50s_further_crackdown_on_slavery_desc:0 "Si l'esclavage est illégal en Éthiopie depuis les années 1930, sa pratique reste répandue dans toutes les régions rurales de notre pays. Nous devons lutter contre cela."
 ETH_50s_address_inner_tribal_wars:0 "Aborder les guerres tribales intérieures"
 ETH_50s_address_inner_tribal_wars_desc:0 "C'est une pratique courante dans les régions rurales du sud de Gambela et Sidamo que des personnes de différents groupes se battent entre communautés lors de massacres à petite échelle pour des raisons de différences ethniques. Nous devons résoudre ce problème."
 ETH_50s_modernize_adis_abeba_agriculture:0 "Moderniser l'agriculture d'Adis Abeba"
 ETH_50s_modernize_adis_abeba_agriculture_desc:0 "La majeure partie de la zone environnante d'Adis Abeba qui assure la production agricole des hauts plateaux du centre"
 ETH_50s_adis_abeba_gridization:0 "Gridisation d'Adis Abeba"
 ETH_50s_adis_abeba_gridization_desc:0 "Adis Abeba ne dispose actuellement pas de l'infrastructure nécessaire pour fournir une alimentation électrique continue aux hauts plateaux du centre. Nous devons changer cela."
 ETH_50s_harar_gridization:0 "Gridisation de Harar"
 ETH_50s_harar_gridization_desc:0 "Comme Adis Abeba, Harar ne peut pas fournir en permanence de l'électricité à ses habitants. Nous allons changer cela avec le financement du gouvernement."
 ETH_50s_address_harari_autonomy:0 "Adresse Harari Autonomie"
 ETH_50s_address_harari_autonomy_desc:0 "Harar est dans un état d'autonomie relative depuis quelques décennies en raison du manque d'autorité impériale exercée dans la région. Nous devons résoudre ce problème"
 ETH_50s_harari_asset_confiscation:0 "Confiscation des avoirs de Harari"
 ETH_50s_harari_asset_confiscation_desc:0 "La noblesse Harari a peu d'influence au sein de notre cour impériale, il serait assez facile et dans notre intérêt de confisquer ces biens"
 ETH_50s_continue_harari_suppression:0 "Poursuivre la répression Harari"
 ETH_50s_continue_harari_suppression_desc:0 "Il est plus efficace de continuer à supprimer la culture et les coutumes Harari plutôt que de supprimer complètement la noblesse locale"
 ETH_50s_subsidize_harari_development:0 "Subventionner le développement d'Harari"
 ETH_50s_subsidize_harari_development_desc:0 "Harar, l'une de nos grandes villes, doit être davantage développée grâce à un financement national."
 ETH_50s_independence_of_the_Tewahedo_Church:0 "Indépendance de l'Église Tewahedo"
 ETH_50s_independence_of_the_Tewahedo_Church_desc:0 "Suite à de récents désaccords avec le patriarche d'Alexandrie, Hailé Sélassié a rencontré le clergé de notre église et a décidé que nous devrions arrêter de nous tourner vers le patriarche d'Alexandrie pour la canonisation"
 ETH_50s_adis_abeba_university:0 "Université Addis Abeba"
 ETH_50s_adis_abeba_university_desc:0 "Notre pays a besoin d'une grande université en son centre. Adis Abeba fournira une nouvelle forme d'intelligentsia à notre nation."
 ETH_50s_relations_with_europe:0 "Relations avec l'Europe"
 ETH_50s_relations_with_europe_desc:0 "Il est temps d'élargir nos relations riches et étendues avec l'Europe"
 ETH_50s_continue_ethiopian_reconstruction:0 "Poursuivre la reconstruction éthiopienne"
 ETH_50s_continue_ethiopian_reconstruction_desc:0 "Nous devons poursuivre la reconstruction de l'Éthiopie après la Seconde Guerre italo-éthiopienne."
 ETH_50s_rebuild_amhara:0 "Reconstruire l'Amhara"
 ETH_50s_rebuild_amhara_desc:0 "Nous reconstruirons la région d'Amhara"
 ETH_50s_rebuild_gondar:0 "Reconstruire Gondar"
 ETH_50s_rebuild_gondar_desc:0 "Nous devons reconstruire la ville de Gondar"
