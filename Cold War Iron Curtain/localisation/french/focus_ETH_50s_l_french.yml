 ETH_50s_expand_air_defenses:0 "Développer les défenses aériennes"
 ETH_50s_expand_air_defenses_desc:0 "Il est plus pratique d'investir dans nos défenses contre nos futurs ennemis que d'essayer de rivaliser avec une force aérienne de taille réduite"
 ETH_50s_anti_air_network:0 "Réseau anti-aérien"
