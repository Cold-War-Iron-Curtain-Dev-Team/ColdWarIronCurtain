 ETH_50s_seek_international_support:0 "Rechercher un soutien international"
 ETH_50s_seek_international_support_desc:0 "Nous recevrons volontiers un soutien pour cette proposition"
 ETH_50s_establish_federal_structure:0 "Établir une structure fédérale"
 ETH_50s_establish_federal_structure_desc:0 "Au préalable, nous devons établir une structure fédérale"
 ETH_50s_the_federal_act:0 "Loi fédérale"
 ETH_50s_the_federal_act_desc:0 "Avec la signature de la loi fédérale, nous rejoindrons l'Érythrée dans une structure fédérale"
 ETH_50s_abolish_eritrean_constitution:0 "Abolir la Constitution érythréenne"
 ETH_50s_abolish_eritrean_constitution_desc:0 "Nous choisirons d'abolir la constitution érythréenne"
 ETH_50s_enforce_amharic_language:0 "Appliquer la langue amharique"
 ETH_50s_enforce_amharic_language_desc:0 "Nous choisirons d'imposer la langue amharique"
 ETH_50s_allow_arabic_use:0 "Autoriser l'utilisation de l'arabe"
 ETH_50s_allow_arabic_use_desc:0 "Nous choisirons de permettre que soient parlées les langues arabe et érythréenne"
 ETH_50s_preserve_eritrean_constitution:0 "Préserver la Constitution érythréenne"
 ETH_50s_preserve_eritrean_constitution_desc:0 "Nous choisirons de préserver la Constitution érythréenne"
 ETH_50s_resignation_of_Tedla_Bairu:0 "la démission de Tedla Bairu"
 ETH_50s_resignation_of_Tedla_Bairu_desc:0 "Tedlu Bairu, le directeur général de l'Érythrée, a décidé de démissionner compte tenu du traitement réservé à la culture et à la langue érythréenne dans la nouvelle constitution éthiopienne"
 ETH_50s_nationalize_eritrean_coffee_exports:0 "Nationaliser les exportations de café érythréen"
 ETH_50s_nationalize_eritrean_coffee_exports_desc:0 "Avec le nouveau contrôle de l'Érythrée, nous pouvons désormais nationaliser les exportations de café érythréen"
 ETH_50s_expand_copper_mining_in_eritrea:0 "Développer l'exploitation minière du cuivre en Érythrée"
 ETH_50s_expand_copper_mining_in_eritrea_desc:0 "nous devons développer l'exploitation minière du cuivre en Érythrée"
 ETH_50s_address_the_mau_mau_uprising:0 "Répondre au soulèvement des Mau Mau"
 ETH_50s_address_the_mau_mau_uprising_desc:0 "Le pays voisin du Kenya est confronté à une insurrection anticoloniale à grande échelle. Comment devrions-nous aborder cette question?"
 ETH_50s_shelter_the_mau_mau:0 "Abriter les Mau Mau"
 ETH_50s_shelter_the_mau_mau_desc:0 "Nous devrions abriter ces combattants de la liberté"
 ETH_50s_ignore_the_korean_war:0 "Ignorez la guerre de Corée"
 ETH_50s_ignore_the_korean_war_desc:0 "Cet événement ne nous affecte pas, restons en dehors de cette affaire"
 ETH_50s_intervene_in_the_korean_war:0 "Intervenir dans la guerre de Corée"
 ETH_50s_intervene_in_the_korean_war_desc:0 "Avec notre politique étrangère internationaliste, nous devrions aider la coalition des Nations Unies dans la péninsule coréenne"
 ETH_50s_support_south_korea:0 "Soutenez la Corée du Sud"
 ETH_50s_support_south_korea_desc:0 "Nous devons soutenir la Corée du Sud au sein de la coalition des Nations Unies"
 ETH_50s_address_postwar_italian_government:0 "Discours du gouvernement italien d'après-guerre"
 ETH_50s_address_postwar_italian_government_desc:0 "Après la guerre civile italienne, nous avons une nouvelle nation italienne avec laquelle établir des relations diplomatiques."
 ETH_50s_demand_reparations:0 "Exiger des réparations"
 ETH_50s_demand_reparations_desc:0 "Nous méritons réparation pour les nombreux dommages et blessures laissés à notre nation par les Italiens"
 ETH_50s_forgive_and_forget:0 "Pardonner et oublier"
 ETH_50s_forgive_and_forget_desc:0 "Nous devrions pardonner les actions de l'Italie, c'est un peuple changé"
 ETH_50s_denounce_the_mau_mau:0 "Dénoncer les Mau Mau"
 ETH_50s_denounce_the_mau_mau_desc:0 "Nous ferons preuve de responsabilité et dénoncerons les Mau Mau"
 ETH_50s_continue_status_quo:0 "Maintenir le statu quo"
 ETH_50s_continue_status_quo_desc:0 "Il est logique de rejeter les changements inutiles"
 ETH_50s_end_positive_british_relations:0 "Mettre fin aux relations britanniques positives"
 ETH_50s_end_positive_british_relations_desc:0 "Il faut oublier ces relations inutiles avec les Britanniques"
 ETH_50s_international_isolation:0 "Isolement international"
 ETH_50s_international_isolation_desc:0 "En raison de notre politique étrangère tout à fait raisonnable, des pays qui nous sont inutilement opposés ont commencé à former des blocs d'isolement politique contre nous"
 ETH_50s_strengthen_noble_privlidges:0 "Renforcer les privilèges nobles"
 ETH_50s_strengthen_noble_privlidges_desc:0 "Nous devons renforcer la classe supérieure, elle est notre colonne vertébrale et a été favorisée par Dieu"
 ETH_50s_end_positive_french_relations:0 "Mettre fin aux relations françaises positives"
 ETH_50s_end_positive_french_relations_desc:0 "Il faut mettre fin à ces relations inutiles avec la France."
 ETH_50s_continue_somali_suppression:0 "Poursuivre la répression somalienne"
 ETH_50s_continue_somali_suppression_desc:0 "Il est dans notre intérêt de poursuivre la répression en Somalie"
 ETH_50s_harari_suppression:0 "Répression Harari"
 ETH_50s_harari_suppression_desc:0 "Il est dans notre intérêt de poursuivre la répression contre Harari"
 ETH_50s_annex_hargesia:0 "Annexe Hargesia"
 ETH_50s_annex_hargesia_desc:0 "Nous avons le droit d'exercer la force sur la ville d'Hargesia et la province environnante"
 ETH_50s_annex_french_somaliland:0 "Annexe Somaliland français"
 ETH_50s_annex_french_somaliland_desc:0 "Nous avons le droit d'exercer la force sur la ville d'Hargesia et la province environnante"
 ETH_50s_international_denouncement:0 "Dénonciation internationale"
 ETH_50s_international_denouncement_desc:0 "Nous sommes actuellement confrontés à une dénonciation internationale"
 ETH_50s_1955_constitution:0 "Constitution de 1955"
 ETH_50s_1955_constitution_desc:0 "L'establishment a décidé de créer une nouvelle constitution pour remédier à notre structure féodale"
 ETH_50s_education_initiative:0 "Initiative éducative"
 ETH_50s_education_initiative_desc:0 "Nous devons lutter contre l'analphabétisme dans notre pays"
 ETH_50s_give_autonomy_to_afar_sultanate:0 "Donnez l'autonomie au sultanat Afar"
 ETH_50s_give_autonomy_to_afar_sultanate_desc:0 "Cela fait partie de nos récents accords visant à accorder l'autonomie au sultanat d'Afar"
 ETH_50s_reign_in_eritrean_autonomy:0 "Règne dans l'autonomie érythréenne"
 ETH_50s_reign_in_eritrean_autonomy_desc:0 "Nous devons régner sur l'autonomie érythréenne"
 ETH_50s_placate_somali_people:0 "Apaiser le peuple somalien"
 ETH_50s_placate_somali_people_desc:0 "Apaiser le peuple somalien"
 ETH_50s_creation_of_lower_assembly:0 "Création de l'Assemblée inférieure"
 ETH_50s_creation_of_lower_assembly_desc:0 "Nous ajouterons une section distincte à notre Parlement, ce qui permettra une plus grande représentation d'une grande variété de classes sociales"
 ETH_50s_creation_of_the_chamber_of_deputies:0 "Création de la Chambre des députés"
 ETH_50s_creation_of_the_chamber_of_deputies_desc:0 "Nous devons créer une Chambre des députés pour traiter plus spécifiquement les problèmes de notre nation dans une série de compartiments"
 ETH_50s_seperation_of_powers:0 "Séparation des pouvoirs"
 ETH_50s_seperation_of_powers_desc:0 "Nous diviserons notre nation en une série de puissances séparées qui contrôleront le pouvoir des autres... du moins sur le papier"
 ETH_50s_placate_harai_people:0 "Apaiser le peuple Harari"
 ETH_50s_placate_harai_people_desc:0 "Compte tenu de nos récentes actions dans la région de Harar, il est logique que nous semblions au moins apporter un peu d'apaisement au peuple Harari"
 ETH_50s_placate_nobility:0 "Apaiser la noblesse"
 ETH_50s_placate_nobility_desc:0 "Il est logique d'apaiser la noblesse de notre nation, car sa loyauté est la plus importante"
 ETH_50s_lessons_of_the_second_italo_ethiopian_war:0 "Les leçons de la Seconde Guerre italo-éthiopienne"
 ETH_50s_lessons_of_the_second_italo_ethiopian_war_desc:0 "La deuxième guerre italo-éthiopienne montre clairement que notre armée n'est pas à la hauteur des puissances militarisées. Il est impératif de remédier aux défauts majeurs de notre commandement et de notre armée dans le passé."
 ETH_50s_address_the_problem_on_land:0 "Résoudre le problème sur terre"
 ETH_50s_address_the_problem_on_land_desc:0 "Nous devons remédier aux problèmes et aux défauts de notre armée de terre"
 ETH_50s_focus_on_army_motorization:0 "Focus sur la motorisation de l'armée"
 ETH_50s_focus_on_army_motorization_desc:0 "Nous devons nous concentrer sur la motorisation et la mécanisation de nos forces armées"
 ETH_50s_focus_on_rocket_artillery:0 "Focus sur l'artillerie à fusée"
 ETH_50s_focus_on_rocket_artillery_desc:0 "Nous devons nous concentrer spécifiquement sur l'artillerie à fusée"
 ETH_50s_focus_on_army_conscription:0 "Focus sur la conscription militaire"
 ETH_50s_focus_on_army_conscription_desc:0 "Nous devons nous appuyer sur de vastes campagnes de conscription et sur des effectifs militaires importants"
 ETH_50s_depend_on_mass_assault:0 "Dépendre des assauts de masse"
 ETH_50s_depend_on_mass_assault_desc:0 "Grâce à un nombre supérieur, nous pouvons vaincre nos ennemis dans presque tous les engagements"
 ETH_50s_rely_on_superior_firepower:0 "Comptez sur une puissance de feu supérieure"
 ETH_50s_rely_on_superior_firepower_desc:0 "Nous devons compter sur une puissance de feu supérieure à celle de nos voisins"
 ETH_50s_depend_on_mobile_warfare:0 "Dépendez de Mobile Warfare"
 ETH_50s_depend_on_mobile_warfare_desc:0 "Avec une ligne de front en mouvement constant, nous pouvons encercler et détruire nos ennemis"
 ETH_50s_a_new_army:0 "Une nouvelle armée"
 ETH_50s_a_new_army_desc:0 "Nous avons résolu les problèmes fonciers avec notre armée terrestre et avons fondé une nouvelle armée"
 ETH_50s_address_the_problem_in_the_air:0 "Résoudre le problème dans les airs"
 ETH_50s_address_the_problem_in_the_air_desc:0 "Nous devons tirer les leçons de nos expériences en matière d'échecs en matière de supériorité aérienne lors d'engagements précédents"
