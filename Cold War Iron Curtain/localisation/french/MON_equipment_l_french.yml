#Mongolian 'naval' aviation

 MON_jump_jet_equipment_1:0 "Yakovlev Yak-36"
 MON_jump_jet_equipment_1_short:0 "Yak-36"
 MON_jump_jet_equipment_1_desc:0 "Le Yak-36 (également connu sous le nom d'Izdeliye V) fut la première tentative soviétique d'avion de combat à décollage et atterrissage verticaux (VTOL). Quatre démonstrateurs technologiques de pré-production ont été construits. Le premier vol a eu lieu en septembre 1963 et, au début de 1966, l'avion a effectué son premier vol complet, du décollage vertical à l'atterrissage vertical. L'avion a été présenté au public à l'occasion du 50e anniversaire de la Révolution d'Octobre. Après l'obtention de résultats prometteurs dans le programme Yak-36, la prochaine étape de développement, le Yak-38, a reçu le feu vert. Connu sous son nom de rapport OTAN Freehand."
 MON_jump_jet_equipment_2:0 "Yakovlev Yak-38"
 MON_jump_jet_equipment_2_short:0 "Yak-38"
 MON_jump_jet_equipment_2_desc:0 "Le Yak-38 a été développé à partir du Yak-36 (et a donc été initialement désigné Yak-36M), bien que les deux avions aient peu de points communs. Il s'agissait du seul avion de combat VTOL opérationnel de l'aviation navale soviétique et de son premier avion embarqué à voilure fixe. Le Yak-38 a servi presque exclusivement sur le porte-avions de classe Kiev, entrant en service en 1976. L'avion n'a été utilisé aucunement au combat, mais a une fois intercepté des avions américains de l'USS Enterprise au-dessus de la mer d'Oman. Son nom de code OTAN est Forger-A"
 MON_jump_jet_equipment_3:0 "Yakovlev Yak-38M"
 MON_jump_jet_equipment_3_short:0 "Yak-38M"
 MON_jump_jet_equipment_3_desc:0 "Le Yak-38M était une version améliorée du Yak-38, bénéficiant d'une masse maximale au décollage de 1 000 kg (2 200 lb) supplémentaire et d'un renfort de pylône sous les ailes pour transporter 2 000 lb (910 kg) d'armes. Le Yak-38M est entré en service dans l'aviation navale soviétique. Malgré les améliorations apportées à la conception, le Forger était toujours sous-alimenté et s'est finalement révélé décevant. Ce type sera retiré lors de l'effondrement de l'Union soviétique en 1991."
 MON_jump_jet_equipment_4:0 "Yakovlev Yak-41"
 MON_jump_jet_equipment_4_short:0 "Yak-41"
 MON_jump_jet_equipment_4_desc:0 "Le Yakovlev Yak-141, également connu sous le nom de Yak-41, est un avion de combat supersonique soviétique à décollage/atterrissage vertical (VTOL) conçu par Yakovlev. L'avion était destiné à remplacer complètement le Yak-38 Forger et était capable d'un vol supersonique soutenu et d'une parité avec les chasseurs terrestres soviétiques. L'avion a effectué son premier vol au début de 1987, avec le premier vol stationnaire en 1989. En 1991, le premier atterrissage naval vertical naval a été réalisé avec succès. Malgré ses promesses, le programme Freestyle a été annulé en août 1991 en raison d'un manque de financement."

 MON_jump_stealth_equipment_1:0 "Yakovlev Yak-43"
 MON_jump_stealth_equipment_1_short:0 "Yak-43"
 MON_jump_stealth_equipment_1_desc:0 "Le Yak-43 était un chasseur soviétique VTOL (décollage et atterrissage vertical) développé sous le Lyogkiy Frontovoy Istrebitel (Light Frontline Fighter/LFI) conçu comme la version au sol du malheureux Yakovlev Yak-141 Freestyle, qui n'a pas réussi à atteindre la production à la suite de l'effondrement de l'Union soviétique. Comme le Yak-141, le Yak-43 n'aurait eu qu'un seul moteur principal, ainsi que deux moteurs à levage vertical dédiés. Malheureusement, comme le Yak-141, il n'a jamais été produit, notamment à cause de l'effondrement de l'Union soviétique."

