 MON_fighter_equipment_1:0 "Yakolev Yak-3"
 MON_fighter_equipment_1_short:0 "Yak-3"
 MON_fighter_equipment_1_desc:0 "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur et monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié tant des pilotes que du personnel au sol. L'un des chasseurs de combat les plus petits et les plus légers déployés par tous les combattants pendant la guerre, son rapport puissance/poids élevé lui a conféré d'excellentes performances et il s'est avéré être un formidable chasseur de chiens."
 MON_fighter_equipment_2:0 "Lavotchkine La-7"
 MON_fighter_equipment_2_short:0 "La-7"
 MON_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de combat soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau de conception de Lavochkin. Il s'agissait d'un développement et d'un perfectionnement du Lavochkin La-5, et du dernier d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 MON_fighter_equipment_3:0 "Lavotchkine La-9"
 MON_fighter_equipment_3_short:0 "La-9"
 MON_fighter_equipment_3_desc:0 "La-9 représente un développement ultérieur du prototype Lavochkin La-126. Le premier prototype, désigné La-130, fut achevé en 1946. La similitude avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur avait une construction entièrement métallique et une aile à flux laminaire. Les économies de poids dues à l'élimination du bois de la cellule ont permis d'améliorer considérablement la capacité de carburant et l'armement à quatre canons. Des combats simulés ont démontré que le La-130 était à égalité avec le La-7 mais qu'il était inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, entra en production en août 1946. Au total, 1 559 avions furent construits à la fin de la production en 1948."

 MON_jet_multirole_equipment_1:0 "Mikoyan-Gourevitch MiG-9"
 MON_jet_multirole_equipment_1_desc:0 "Le MiG-9 Fargo a été le premier avion à réaction conçu par Mikoyan après la Seconde Guerre mondiale. Introduit en 1948. Il a été utilisé de manière limitée au combat et à l'entraînement pendant la guerre civile chinoise et la guerre de Corée. Au total, 610 avions furent produits, uniquement par l'URSS. Les derniers MiG 9 furent mis hors service par la RPC en 1951."
 MON_jet_multirole_equipment_1_short:0 "MiG-9"
 MON_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 MON_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 MON_jet_multirole_equipment_2_short:0 "MiG-15"
 MON_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 MON_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 MON_jet_multirole_equipment_3_short:0 "MiG-17"
 MON_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 MON_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 MON_jet_multirole_equipment_4_short:0 "MiG-19"
 MON_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 MON_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 MON_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 MON_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 MON_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 MON_jet_multirole_equipment_6_short:0 "MiG-21PF"
 MON_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23M"
 MON_jet_multirole_equipment_7_desc:0 "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
 MON_jet_multirole_equipment_7_short:0 "MiG-23M"
 MON_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23ML"
 MON_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
 MON_jet_multirole_equipment_8_short:0 "MiG-23ML"
 MON_jet_multirole_equipment_9:0 "Mikoyan-Gourevitch MiG-23MLD"
 MON_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
 MON_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 MON_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29A"
 MON_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
 MON_jet_multirole_equipment_10_short:0 "MiG-29A"

 MON_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 MON_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 MON_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une révision du MiG-29 de base. Il a acquis une capacité multirôle plus robuste grâce à une utilisation améliorée d'armes air-air et air-sol de haute précision. Il présentait également une portée de combat considérablement accrue, grâce à une augmentation de sa capacité de carburant interne. Quelques changements ont eu lieu au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger aluminium-lithium pour augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été révisée, les persiennes d'admission supérieures ont été supprimées pour laisser la place à plus de carburant dans les LERX, des tamis à mailles ont été introduits pour éviter les dommages causés par des corps étrangers (FOD) et les dimensions d'entrée ont été agrandies pour un débit d'air plus élevé."

 MON_jet_light_equipment_1:0 "Mikoyan-Gourevitch MiG-9UTI"
 MON_jet_light_equipment_1_short:0 "MiG-9UTI"
 MON_jet_light_equipment_1_desc:0 "Pour assurer la préparation du personnel navigant de l'unité de combat des chasseurs à réaction de l'Armée de l'Air, l'équipe OKB-155, dirigée par A.I. Mikoyan, s'est vu confier le développement d'une modification biplace de l'avion MiG-9. Les travaux sur une nouvelle modification du MiG-9 en OKB-155 ont commencé en juillet 1946. La conception préliminaire du « jumeau » était prête fin octobre et conformément au calendrier de conception et de construction de l'avion, approuvé par Mikoyan le 26 août, le premier prototype a été déployé sur l'aérodrome. Prévu pour le 20 décembre 1946."
 MON_jet_light_equipment_2:0 "Mikoyan-Gourevitch MiG-15UTI"
 MON_jet_light_equipment_2_short:0 "MiG-15UTI"
 MON_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 MON_jet_light_equipment_3:0 "L-29 Delfin"
 MON_jet_light_equipment_3_short:0 "L-29 Delfin"
 MON_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (anglais : Dolphin, nom OTAN : Maya) est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 MON_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 MON_jet_light_equipment_4_short:0 "L-39 Albatros"
 MON_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
 MON_jet_light_equipment_5:0 "Aéro L-39ZA Albatros"
 MON_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 MON_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et les attaques légères, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un canon à double canon GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un chargeur de 150 cartouches dans la cellule."

 MON_recon_equipment_0:0 "Tupolev Tu-2R"
 MON_recon_equipment_0_short:0 "Tu-2R"
 MON_recon_equipment_0_desc:0 "Version de reconnaissance du Tu-2."
 MON_jet_recon_equipment_0:0 "Mikoyan-Gourevitch MiG-15Rbis"
 MON_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 MON_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé le développement d'une variante de reconnaissance de première ligne du MiG-15 avec une caméra AFA-BA/40, qui fournit une largeur de levé en bande de 0,9 à 4,5 km avec une longueur de route de photographie de 90 à 450 km à des altitudes de 2 000 à 10 000 m. Un seul canon NR-23 a été installé sur l'avion. Pour augmenter la portée du scout, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur \"Barium-M\" et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur la machine."
 MON_jet_recon_equipment_1:0 "Mikoyan-Gourevitch MiG-25RB"
 MON_jet_recon_equipment_1_short:0 "MiG-25RB"
 MON_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les tests ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. Le matériel photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station d'interférence radio active SPS-141"
 MON_jet_recon_equipment_2:0 "Sukhoï Su-24MR"
 MON_jet_recon_equipment_2_short:0 "Su-24MR"
 MON_jet_recon_equipment_2_desc:0 "Variante de reconnaissance tactique dédiée. Le Su-24MR conserve une grande partie de la suite de navigation du Su-24M, y compris le radar de suivi de terrain, mais supprime le radar d'attaque Orion-A, le système laser/TV et le canon au profit de deux installations de caméras panoramiques, la caméra TV « Aist-M » (« Cigogne »), le radar aéroporté latéral (SLAR) RDS-BO « Shtik » (« Baïonnette ») et l'infrarouge « Zima » (« Hiver »). Système de reconnaissance. D'autres capteurs sont transportés sous forme de pod."

 MON_heavy_fighter_equipment_1:0 "Yakovlev Yak-9"
 MON_heavy_fighter_equipment_1_short:0 "Yak-9"
 MON_heavy_fighter_equipment_1_desc:0 "Le Yak-9 avait un fuselage arrière réduit avec une verrière de vision panoramique. Sa structure métallique plus légère permettait une charge de carburant et un armement accrus par rapport aux modèles précédents construits en bois. Le Yak-9 était maniable à grande vitesse à basse et moyenne altitude et facile à contrôler, ce qui en faisait l'un des chasseurs soviétiques les plus produits de la Seconde Guerre mondiale."
 MON_heavy_fighter_equipment_2:0 "Petliakov Pe-3"
 MON_heavy_fighter_equipment_2_short:0 "Pe-3"
 MON_heavy_fighter_equipment_2_desc:0 "Développement ultérieur du Pe-2, le Pe-3 était un avion de combat de nuit dédié lors de son introduction en 1941, la même année que son homologue, le Pe-2. Sa conception et son utilisation ont suivi un chemin comparable à ceux empruntés par la Luftwaffe allemande avec le Junkers Ju 88 et la Royal Air Force britannique avec le De Havilland Mosquito. Utilisé avec distinction pendant la bataille de Moscou, et bien que la seule usine responsable de la construction de ce type ait été évacuée à la suite de la bataille, le Pe-3 a été utilisé tout au long du conflit, les séries de production ultérieures étant consacrées à la construction de variantes de reconnaissance de ce type."
 MON_heavy_fighter_equipment_3:0 "Lavotchkine La-11"
 MON_heavy_fighter_equipment_3_short:0 "La-11"
 MON_heavy_fighter_equipment_3_desc:0 "Développé en 1947, après la fin de la Seconde Guerre mondiale, le La-11 était une évolution du La-9 « Fritz » pour créer un chasseur d'escorte à longue portée. L'avion était équipé de pneus plus gros pour s'adapter à l'augmentation du poids et aux commodités pour les longs vols, comme un rembourrage accru du siège, des accoudoirs et un urinoir. De plus, une suite complète de radionavigation a été installée. Sans surprise, les performances de combat avec une pleine charge de carburant en ont souffert. Cependant, à mesure que la charge de carburant se rapprochait de celle du La-9, les performances augmentaient également. Les pilotes de La-11 en service soviétique et plus tard chinois serviraient dans la défense aérienne, abattant des Mustangs et des avions d'attaque de construction américaine pendant la guerre de Corée. Son nom de rapport à l'OTAN est Fang."

 MON_jet_interceptor_equipment_1:0 "Yakovlev Yak-17"
 MON_jet_interceptor_equipment_1_desc:0 "Le Yak-17 a été exposé publiquement pour la première fois lors de la Journée de l'aviation soviétique de 1949, à l'aérodrome de Touchino. En fonctionnement, le Yak-17 présentait la plupart des mêmes défauts que son prédécesseur, notamment une vitesse et une autonomie relativement faibles, et un moteur peu fiable (toujours basé sur le Junkers Jumo 004 allemand) avec une procédure de démarrage compliquée. D'un autre côté, sa manipulation était très simple et similaire à celle des chasseurs à hélices populaires tels que le Yak-3 et le Yak-9. Cela en faisait une excellente machine de transition vers les chasseurs à réaction."
 MON_jet_interceptor_equipment_1_short:0 "Yak-17"
 MON_jet_interceptor_equipment_2:0 "Lavotchkine La-15"
 MON_jet_interceptor_equipment_2_desc:0 "Le Lavochkin La-15 Fantail a été introduit dans l'armée de l'air soviétique en 1949. Bien que technologiquement l'avion soit supérieur au MiG-15, le coût de fabrication inférieur du MiG-15 signifiait qu'il était favorisé. L'avion n'a jamais participé à des combats et n'a eu qu'un déploiement limité. Les 235 avions fabriqués ont été mis hors service en 1953. Ils ont été démontés de leurs moteurs et utilisés pour des essais d'armes nucléaires."
 MON_jet_interceptor_equipment_2_short:0 "La-15"
 MON_jet_interceptor_equipment_3:0 "Mikoyan-Gourevitch MiG-17PF"
 MON_jet_interceptor_equipment_3_desc:0 "Version chasseur-intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"
 MON_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 MON_jet_interceptor_equipment_4:0 "Soukhoï Su-9"
 MON_jet_interceptor_equipment_4_desc:0 "Le Sukhoi Su-9 Fishpot était un intercepteur soviétique tout temps à ailes delta développé dans les années 1950. Le Su-9 a effectué son premier vol complet le 24 juin 1956 et est entré en service trois ans plus tard, en 1959. L'avion était exclusivement exploité par le 894e régiment d'aviation de chasse de l'armée de l'air soviétique et n'a jamais participé à des combats actifs. Le dernier des 1 150 avions fabriqués a quitté le service en 1979"
 MON_jet_interceptor_equipment_4_short:0 "Su-9"
 MON_jet_interceptor_equipment_5:0 "Soukhoï Su-11"
 MON_jet_interceptor_equipment_5_desc:0 "Le Su-11 était une version améliorée de l'intercepteur Sukhoi Su-9 (« Fishpot »), qui avait été développé en parallèle avec le chasseur-bombardier Su-7 à ailes en flèche de l'OKB. Conscient des limites fondamentales du Su-9, Sukhoi commença à travailler sur le Su-11."
 MON_jet_interceptor_equipment_5_short:0 "Su-11"
 MON_jet_interceptor_equipment_6:0 "Soukhoï Su-15"
 MON_jet_interceptor_equipment_6_desc:0 "Le Sukhoi Su-15 Flagon A était un intercepteur biréacteur développé par l'Union soviétique dans les années 1960. L'avion a effectué son premier vol au milieu de l'année 1962 et, trois ans plus tard, il est entré en service dans l'armée de l'air soviétique en 1965. De 1965 à 1979, 1 290 avions ont été produits. L'avion a également servi dans l'armée de l'air ukrainienne et a servi dans un service d'urgence limité dans l'armée de l'air russe. Il a été officiellement retiré du service en 1996."
 MON_jet_interceptor_equipment_6_short:0 "Su-15"
 MON_jet_interceptor_equipment_7:0 "Mikoyan-Gourevitch MiG-25P"
 MON_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de 1964 et est officiellement entré en service en 1970. Tout au long de sa vie, plus de 1 150 avions ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. L'avion a été conçu pour intercepter rapidement des avions à très haute altitude comme le U-2 et le B-58 à une vitesse fulgurante. L'avion a donné à l'Union soviétique un contrôle bien supérieur sur son propre espace aérien éloigné que jamais auparavant. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."
 MON_jet_interceptor_equipment_7_short:0 "MiG-25P"
 MON_jet_interceptor_equipment_8:0 "Mikoyan-Gourevitch MiG-31"
 MON_jet_interceptor_equipment_8_desc:0 "Le MiG-31 Foxhound est le successeur direct du MiG-25 et a été conçu comme un remplacement complet. L'avion partage la plupart des éléments de conception avec le MiG-25, présentant principalement des modifications internes. Le MiG-31 dispose de 2 sièges et de capteurs et moteurs supérieurs, le cockpit a également été modernisé pour prendre en charge un affichage tête haute et des systèmes de missiles air-air plus récents. De 1975 à 1994, 519 MiG-31 ont été produits. Il reste en service dans l'armée de l'air russe et l'armée de l'air du Kazakhstan. C'est l'un des avions de combat les plus rapides en service aujourd'hui."
 MON_jet_interceptor_equipment_8_short:0 "MiG-31"
 MON_jet_interceptor_equipment_9:0 "Sukhoï Su-27S"
 MON_jet_interceptor_equipment_9_desc:0 "Le Su-27S Flanker B est la variante de production initiale du chasseur Sukhoi Su-27 de conception soviétique. L'avion était destiné à être le concurrent direct du F-14 Tomcat et du F-15 Eagle. Après avoir effectué son vol inaugural en 1977, il est entré en service plus tard en 1985. Son rôle principal était la défense aérienne à longue portée contre les bombardiers américains B-1 et B-52, ainsi que l'escorte à longue portée des bombardiers stratégiques intercontinentaux soviétiques. Jusqu'à présent, 809 avions ont été produits, qui sont toujours en service dans l'armée de l'air russe. Les autres opérateurs comprennent : l'Indonésie, l'Ukraine, le Vietnam et la Chine (désigné J-11), entre autres. L'avion restera en service dans un avenir prévisible."
 MON_jet_interceptor_equipment_9_short:0 "Su-27S"

 MON_stealth_fighter_equipment_1:0 "Soukhoï Su-57"
 MON_stealth_fighter_equipment_1_desc:0 "Le Su-57 a été créé sur la base des plans du PAK-FA (acronyme signifiant Perspektivny Aviatsionny Kompleks Frontovoy Aviatsii, en russe pour « Prospective Airborne Complex of Frontline Aviation »). Il possède des capacités furtives très élevées et représente le point culminant de la technologie de l'armée de l'air russe. Doté d'une maniabilité remarquable grâce à une tuyère à vecteur de poussée et d'une excellente furtivité contre les radars, il possède des capacités de combat aérien de premier ordre."
 MON_stealth_fighter_equipment_1_short:0 "Su-57"

 MON_high_mach_jet_interceptor_equipment_1:0 "Yakolev Yak-25"
 MON_high_mach_jet_interceptor_equipment_1_short:0 "Yak-25"
 MON_high_mach_jet_interceptor_equipment_1_desc:0 ""
 MON_high_mach_jet_interceptor_equipment_2:0 "Yakolev Yak-28P"
 MON_high_mach_jet_interceptor_equipment_2_short:0 "Yak-28P"
 MON_high_mach_jet_interceptor_equipment_2_desc:0 "En 1960, sur la base des Yak-27K et Yak-28, un nouvel intercepteur supersonique biplace Yak-28P a été créé. Il était destiné à combattre des cibles aériennes à basse et moyenne altitude dans une large gamme de vitesses, de jour comme de nuit, par tous les temps. L'avion était équipé du complexe d'armement K-8M-1, composé de deux missiles R-8M-1 avec imagerie thermique et radars semi-actifs et d'une station radar Orel-D. Aucune arme n'a été installée."
 MON_high_mach_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich E-152A"
 MON_high_mach_jet_interceptor_equipment_3_short:0 "E-152A"
 MON_high_mach_jet_interceptor_equipment_3_desc:0 "L'intercepteur tous temps E-152A a été construit à la fin des années 1950. Il disposait d'une centrale électrique composée de 2 moteurs de série R11F-300 d'une poussée maximale de 3 880 kg chacun et d'une postcombustion de 5 740 kg. L'armement consistait en un système d'interception \"Uragan-5\", composé du radar \"TsP-1\" et du missile K-9. Sur l'avion E-152A, le calculateur SRP et le pilote automatique étaient couplés au radar TsP."
 MON_high_mach_jet_interceptor_equipment_4:0 "Mikoyan-Gourevitch E-152M"
 MON_high_mach_jet_interceptor_equipment_4_short:0 "E-152M"
 MON_high_mach_jet_interceptor_equipment_4_desc:0 "La clôture du programme d'essais du missile K-9 a entraîné l'arrêt du vol sur l'E-152-2. Il a été décidé de convertir l'avion en une nouvelle version de l'E-152M en 1961. L'avion a été conçu pour l'installation d'un seul moteur R15B-300 avec une poussée sans postcombustion de 6 480 kg et une postcombustion de 10 210 kg."
 #MON_high_mach_jet_interceptor_equipment_4:0 "Tupolev Tu-148" #By years and technology should be tier 5 - Tu-128 must be in the same year what Tu-28
 #MON_high_mach_jet_interceptor_equipment_4_short:0 "Tu-148"
 #MON_high_mach_jet_interceptor_equipment_4_desc:0 ""

 MON_CAS_equipment_1:0 "Kochyerigin LBSh Sturmovik"
 MON_CAS_equipment_1_short:0 "LBSh Sturmovik"
 MON_CAS_equipment_1_desc:0 "Le Kochyerigin LBSh était un monoplan à ailes basses de construction mixte en bois et en métal développé en 1939 par Sergueï Alexandrovitch Kochyerigin. Malgré son manque de puissance, cet avion CAS affichait une puissance de feu impressionnante pour l'époque, avec 2 canons de 20 mm montés sur les ailes, 2 HMG de 7,62 mm montés sur les ailes et une charge de bombe de 600 kg (1 300 lb), avec un HMG de 7,62 mm orienté vers l'arrière pour la défense. Bien qu'initialement accepté par l'armée de l'air soviétique pour être mis en production, cette décision fut bientôt annulée et la production se tourna vers les chasseurs I-28 et Yak-1. Ce fut le premier avion CAS soviétique à recevoir le nom de Sturmovik, ce qui signifie chasseur d'attaque au sol."
 MON_CAS_equipment_2:0 "Iliouchine Il-2 Sturmovik"
 MON_CAS_equipment_2_short:0 "Il-2 Sturmovik"
 MON_CAS_equipment_2_desc:0 "Illyusha, Bossu, le Flying Tank, le Flying Infantryman, tels sont quelques-uns des nombreux surnoms donnés à l'Il-2, en fait le visage de l'armée de l'air soviétique de la Seconde Guerre mondiale. Introduit en 1941, l'Il-2 était un avion d'attaque au sol qui, combiné avec son successeur, l'Il-10, était l'avion de combat le plus produit de l'histoire de l'aviation, l'Il-2 ayant produit à lui seul 36 183 unités. L'avion Il-2 a joué un rôle crucial sur le front de l'Est. Bien qu'il soit imprécis dans ses bombardements et ses attaques à la roquette, sa durabilité globale le rendait extrêmement efficace pour dévier tous les canons antiaériens de gros calibre, sauf les gros canons antiaériens, ce qui lui a valu son nom de Flying Tank. Connu sous le nom de Sturmovik, ce qui signifie avion d'attaque au sol, son nom ultérieur pour l'OTAN est Bark."
 MON_CAS_equipment_3:0 "Iliouchine Il-10"
 MON_CAS_equipment_3_short:0 "Il-10"
 MON_CAS_equipment_3_desc:0 "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à de nombreux défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 participa à certaines des dernières opérations de combat en Europe, ainsi qu'à la brève intervention soviétique dans la guerre du Pacifique. Au moment où l'Il-10 a pris sa retraite du service soviétique en 1956, l'armée de l'air a délaissé les avions purement CAS et d'attaque au sol pour se tourner vers les chasseurs-bombardiers. Son nom de rapport à l'OTAN est Beast."
 MON_CAS_equipment_4:0 "Iliouchine Il-16"
 MON_CAS_equipment_4_short:0 "Il-16"
 MON_CAS_equipment_4_desc:0 "L'Ilyushin Il-16 est le dernier développement de l'avion d'attaque au sol Sturmovik. Il s'agissait essentiellement d'une version réduite de l'Ilyushin Il-10, mais elle était équipée d'un moteur Mikulin AM-43NV nouvellement développé dans l'espoir qu'il serait plus rapide et plus maniable que son prédécesseur. Trois avions ont été construits à des fins d'essais, mais en raison de problèmes moteur imprévus qui n'ont pas pu être résolus, le projet a été annulé."

 MON_jet_CAS_equipment_1:0 "Iliouchine IL-10M"
 #MON_jet_CAS_equipment_1_desc:0 "The Yakovlev Yak-23 Flora was a Soviet designed ground attack aircraft introduced in 1949. The aircraft was a development of the Yak-15 jet fighter. The Yak-23 was primarily exported to Warsaw pact nations, where it remained in service until the late 1950's."
 MON_jet_CAS_equipment_1_short:0 "IL-10M"
 MON_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 MON_jet_CAS_equipment_2_desc:0 "Conversion de chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 MON_jet_CAS_equipment_2_short:0 "MiG-17bis"
 MON_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 MON_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue en dalle entièrement mobile. Equipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il y avait des dispositions pour un pack de fusées non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957 modifié pour permettre le transport de quatre nacelles de fusée."
 MON_jet_CAS_equipment_3_short:0 "MiG-19S"
 MON_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 MON_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 MON_jet_CAS_equipment_4_short:0 "Su-7B"
 MON_jet_CAS_equipment_5:0 "Sukhoï Su-7BKL"
 MON_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 MON_jet_CAS_equipment_5_short:0 "Su-7BKL"
 MON_jet_CAS_equipment_6:0 "Soukhoï Su-17M"
 MON_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 MON_jet_CAS_equipment_6_short:0 "Su-17M"
 MON_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-27M"
 MON_jet_CAS_equipment_7_desc:0 "Le MiG-27 Flogger est un avion d'attaque au sol soviétique à ailes en flèche variable. L'avion est basé sur le MiG-23 mais optimisé pour l'attaque au sol. Contrairement au MiG-23, le MiG-27 n'a pas été largement utilisé en dehors de l'URSS. De 1970 à 1986, 1 075 avions ont été produits. Le MiG-27 a été utilisé au cours des dernières étapes des guerres soviéto-afghanes et de Kargil. L'avion reste en service limité avec l'Inde et le Kazakhstan."
 MON_jet_CAS_equipment_7_short:0 "MiG-27M"
 MON_jet_CAS_equipment_8:0 "Soukhoï Su-25"
 MON_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. L'avion a effectué son vol inaugural en 1975 et a été introduit en 1981. Depuis 1978, plus de 1 000 avions ont été produits. C'était un avion particulièrement populaire à l'étranger, vendu dans 29 pays. Pour cette raison, le Su-25 a été impliqué dans plusieurs conflits, notamment la guerre soviétique en Afghanistan, l'Iran-Irak et la guerre du Golfe. L'avion reste aujourd'hui en service dans tous les pays d'exportation."
 MON_jet_CAS_equipment_8_short:0 "Su-25"

 MON_cas_stealth_equipment_1:0 "Sukhoï Su-25SM"
 MON_cas_stealth_equipment_1_short:0 "Su-25SM"
 MON_cas_stealth_equipment_1_desc:0 "Le Su-25SM (Stroyevoy Modernizirovannyi) est un programme de mise à niveau « abordable » pour le Su-25, conçu par l'armée de l'air russe en 2000. Le programme découle des tentatives de mise à niveau du Su-25T et du Su-25TM, qui ont été évaluées et qualifiées de trop sophistiquées et coûteuses. La mise à niveau SM intègre des améliorations de l'avionique et une remise à neuf de la cellule pour prolonger la durée de vie du Frogfoot jusqu'à 500 heures de vol ou 5 ans. La toute nouvelle suite de navigation/attaque PRnK-25SM « Bars » du Su-25SM est construite autour du système informatique numérique BTsVM-90, initialement prévu pour le programme de mise à niveau du Su-25TM. La précision de navigation et d'attaque fournie par la nouvelle suite est trois fois supérieure à celle du Su-25 de base et se situerait à moins de 15 m en utilisant la correction satellite et à 200 m sans celle-ci."

 #MON_nav_bomber_equipment_1:0 "Ilyushin Il-4T"
 #MON_nav_bomber_equipment_1_short:0 "Il-4T"
 #MON_nav_bomber_equipment_1_desc:0 "Originally known as the DB-3F, the Il-4 was a capable medium bomber, with the range necessary to perform even strategic bombing missions. This modified version of the DB-3 featured new engines and an upgunned dorsal turret (the ShKAS 7.62-mm HMG was replaced with a UBT 12.7-mm HMG). Some series had wooden outer wings and front fuselages to conserve metals, and throughout the production, engines and fuel tanks were upgraded for improved performance while retaining the same range. However, because of the added weight, the engines did not prove powerful enough, and was thus slower than its immediate predecessor. Its NATO reporting name is Bob"
 #MON_nav_bomber_equipment_2:0 "Tupolev Tu-2T"
 #MON_nav_bomber_equipment_2_short:0 "Tu-2T"
 #MON_nav_bomber_equipment_2_desc:0 "The Tu-2T (prototype version ANT-62T) was the Torpedo-bomber variant of the Tu-2, developed from the Tu-2D variant. The decision to use the platform for this role is likely due to the crews favorability of the Tu-2 despite it being the second-most important bomber for the Soviet Air Force during WWII (the first being the Pe-2). This variant would serve with Soviet Naval Aviation pilots during the twilight stages of WWII, and would serve in for much of the post-war period. Like its Air Force cousin, its NATO reporting name is 'Bat.'"
 #MON_nav_bomber_equipment_3:0 "Ilyushin Il-6"
 #MON_nav_bomber_equipment_3_short:0 "Il-6"
 #MON_nav_bomber_equipment_3_desc:0 "The Il-6 is a further development of the Il-4 Bob long-range bomber/torpedo bomber aircraft. Originally intended to replace the Il-4, the Il-6 was sported with much longer-range with fuel-conserving diesel engines. It was to sport a defensive armament of five 20-mm cannon. However flight tests showed the type was poor to control at high weights and low speeds, making it difficult to land. Furthermore, the engines were unable to start at low temperatures and were slow to respond to throttle movements. Despite various attempts at improvements, further development was halted by 1944."
 #MON_nav_bomber_equipment_4:0 "Beriev Be-6"
 #MON_nav_bomber_equipment_4_short:0 "Be-6"
 #MON_nav_bomber_equipment_4_desc:0 "The Be-6 was a flying boat produced by the Beriev Design Bureau, first flying in 1949. It was capable of accomplishing a wide variety of missions. In addition to its primary role of maritime patrol and maritime reconnaissance, the Be-6 was also used in coastal and supply line patrols, mine-laying, torpedo bomber, medium bomber and transport roles. Its USAF/NATO reporting name is Type 34, while the NATO codename was Madge."
 #MON_nav_bomber_equipment_5:0 "Beriev Be-10"
 #MON_nav_bomber_equipment_5_short:0 "Be-10"
 #MON_nav_bomber_equipment_5_desc:0 "The Be-10, also known as Izdelye M, was a turbojet-powered flying boat developed by the Soviet Union in 1956. Designed as a patrol bomber, the Be-10 was notoriously difficult to fly, and suffered from metal fatigue due to stress from the airframe during high-speed takeoffs and landings as well as due to corrosion. As such the type was quickly replaced in service with the later Be-12 Mail. Known to the West as the Mallow, a modified civilian sub-variant, the M-10 was known to have established 12 world records by the Fédération aéronautique internationale (World Air Sports Federation) in 1961."
 #MON_nav_bomber_equipment_6:0 "Beriev Be-12N Chayka"
 #MON_nav_bomber_equipment_6_short:0 "Be-12N Chayka"
 #MON_nav_bomber_equipment_6_desc:0 "The Be-12 was developed in 1960 as the successor and replacement for both the Be-6 Madge and Be-10 Mallow, and was developed as an anti-submarine and maritime patrol aircraft. Unlike its immediate, turbojet-powered predecessor, the Be-12 was a turboprop powered aircraft, and also had retractable landing gear, which gave the craft an amphibious landing capability. The upgraded N variant came equipped with new sensors, avionics, a Nartsiss search and attack system and a Magnetic Anomaly Detector (MAD) sensor. Known locally as Chayka, meaning seagull, its NATO reporting name is Mail."
 #MON_nav_bomber_equipment_7:0 "Tupolev Tu-142"
 #MON_nav_bomber_equipment_7_short:0 "Tu-142"
 #MON_nav_bomber_equipment_7_desc:0 "The Tupolev Tu-142 is a Soviet/Russian maritime reconnaissance and anti-submarine warfare (ASW) aircraft derived from the Tu-95 turboprop strategic bomber. A specialised communications variant designated Tu-142MR was tasked with long-range communications duties with Soviet ballistic missile submarines. The Tu-142 was designed by the Tupolev design bureau, and manufactured by the Kuibyshev Aviation and Taganrog Machinery Plants from 1968 to 1994. Formerly operated by the Soviet Navy and Ukrainian Air Force, the Tu-142 currently serves with the Russian Navy."
 #MON_nav_bomber_equipment_8:0 "Ilyushin IL-38N"
 #MON_nav_bomber_equipment_8_short:0 "IL-38N"
 #MON_nav_bomber_equipment_8_desc:0 "The Il-38 is an adaptation of the four-engined turboprop Ilyushin Il-18 for use as a maritime patrol aircraft for the Soviet Navy. It met a requirement to counter American ballistic missile submarines. The IL-38N is a modern version sometimes referred to as Il-38SD for Sea Dragon, which is a new search and tracking system. The Russian Navy version is equipped with the Novella P-38 system. Novella P-38 is able to find air targets at ranges of up to 90 kilometres and follow surface objects within a radius of 320 kilometres, can track 32 above- and underwater targets simultaneously."

 MON_tac_bomber_equipment_0:0 "Iliouchine DB-3"
 MON_tac_bomber_equipment_0_short:0 "DB-3"
 MON_tac_bomber_equipment_0_desc:0 "Le DB-3 était un bombardier bimoteur à ailes basses entré en service dans l'armée de l'air soviétique en 1936. Malgré une carrière plutôt calme dans l'armée soviétique, le type a servi en Chine, au sein de l'armée de l'air nationaliste chinoise pendant la Seconde Guerre sino-japonaise. C'était également le premier bombardier soviétique à lancer un raid sur la capitale allemande, Berlin, au cours des premiers mois du front de l'Est de la Seconde Guerre mondiale. La désignation DB est un raccourci pour Dalniy Bombardirovschik, signifiant bombardier à longue portée."
 MON_tac_bomber_equipment_1:0 "Iliouchine DB-3M"
 MON_tac_bomber_equipment_1_short:0 "DB-3M"
 MON_tac_bomber_equipment_1_desc:0 "Première mise à niveau majeure du DB-3."
 MON_tac_bomber_equipment_2:0 "Petliakov Pe-2B"
 MON_tac_bomber_equipment_2_short:0 "Pe-2B"
 MON_tac_bomber_equipment_2_desc:0 "Le Petlyakov Pe-2 (russe : Петляков Пе-2) était un bombardier en piqué bimoteur soviétique utilisé pendant la Seconde Guerre mondiale. L'un des avions d'attaque tactique les plus remarquables de la guerre, il s'est également révélé efficace comme chasseur lourd, comme chasseur de nuit (variante Pe-3) et comme avion de reconnaissance. À bien des égards, il ressemblait au britannique en bois De Havilland Mosquito. Le Pe-2 était, numériquement, le bombardier soviétique le plus important de la Seconde Guerre mondiale, représentant à son apogée 75 % de la force de bombardiers bimoteurs soviétiques."
 MON_tac_bomber_equipment_3:0 "Tupolev Tu-2"
 MON_tac_bomber_equipment_3_short:0 "Ma-2"
 MON_tac_bomber_equipment_3_desc:0 "Le Tu-2 était un bombardier de jour bimoteur à grande vitesse développé en 1941. Il a été conçu pour être la réponse soviétique au bombardier moyen Junkers Ju-88, conçu pour répondre aux exigences d'un bombardier à grande vitesse ou d'un bombardier en piqué, avec une grande charge de bombes interne et une vitesse similaire à celle d'un chasseur monoplace. Il s'est avéré suffisamment performant pour relever le défi, et des variantes de bombardiers torpilleurs, de reconnaissance et de chasseurs lourds existaient, jouant un rôle clé dans les offensives finales soviétiques de la Seconde Guerre mondiale. Son nom de rapport de l'OTAN d'après-guerre est Bat."

 MON_jet_tac_bomber_equipment_1:0 "Iliouchine Il-22"
 MON_jet_tac_bomber_equipment_1_short:0 "Il-22"
 MON_jet_tac_bomber_equipment_1_desc:0 "L'Ilyushin Il-22 fut le premier bombardier soviétique à réaction à voler. Il utilisait quatre turboréacteurs Lyulka TR-1 transportés sur de courts pylônes horizontaux devant et sous l'aile. Les moteurs n'atteignaient pas leurs valeurs de poussée nominales et leur consommation de carburant était plus élevée que prévue. Ces problèmes signifiaient que l'avion ne pouvait pas atteindre les performances requises et il fut annulé le 22 septembre 1947."
 MON_jet_tac_bomber_equipment_2:0 "Iliouchine Il-28"
 MON_jet_tac_bomber_equipment_2_short:0 "Il-28"
 MON_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à entrer en production à grande échelle, l'Il-28, lors de son introduction en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été progressivement retirés du service soviétique dans les années 1980, de nombreux avions de ce type sont encore en service aujourd'hui. Le nom de rapport USAF/DoD est Type 27, tandis que le nom de code OTAN est Beagle."
 MON_jet_tac_bomber_equipment_3:0 "Yakovlev Yak-28B"
 MON_jet_tac_bomber_equipment_3_short:0 "Yak-28B"
 MON_jet_tac_bomber_equipment_3_desc:0 "Le Yak-28 a été développé comme un avion de combat à ailes en flèche introduit en 1960. Les variantes du bombardier Yak-28, connues sous leur nom de code OTAN Brewer, avaient des moteurs montés sur une nacelle, similaires à la lampe de poche Yak-25 à partir de laquelle il a été développé. Avec cela et l'aile en flèche, c'était un avion hautement subsonique, capable d'atteindre des vitesses transsoniques à haute altitude. Il a servi de principal bombardier léger de l'armée de l'air soviétique et a été largement utilisé par la Russie, la Biélorussie et le Turkménistan après la chute de l'Union soviétique, tous étant retirés en 1992."
 MON_jet_tac_bomber_equipment_4:0 "Yakovlev Yak-28I"
 MON_jet_tac_bomber_equipment_4_short:0 "Yak-28I"
 MON_jet_tac_bomber_equipment_4_desc:0 "Version améliorée avec le système de ciblage interne \"Initsiativa-2\" Radar de cartographie au sol à 360 degrés ainsi qu'un système de ciblage contrôlé au sol utilisant la triangulation à partir de sites émetteurs au sol"
 MON_jet_tac_bomber_equipment_5:0 "Mikoyan-Guérivitch MiG-25RBT"
 MON_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 MON_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBS est un bombardier de reconnaissance monoplace dérivé du MiG-25R, équipé de systèmes de reconnaissance améliorés et d'un système de bombardement automatique Peleng. L'avion peut transporter une charge de huit bombes de 500 kg (1 102 lb)."
 MON_jet_tac_bomber_equipment_6:0 "Soukhoï Su-24"
 MON_jet_tac_bomber_equipment_6_short:0 "Su-24"
 MON_jet_tac_bomber_equipment_6_desc:0 "Un gros chasseur-bombardier développé par l'Union soviétique dans les années 1960 et toujours utilisé aujourd'hui. Les caractéristiques incluent ses ailes variables et son corps pointu. Il peut équiper jusqu'à 8 000 kg d'armes et est capable de lancer différents types de missiles air-sol tout en conservant une vitesse stable. Cet avion est connu sous son nom de code OTAN « Fencer ». Avec son successeur, le Su-34, il est actuellement actif comme chasseur-bombardier pour les anciens pays du camp de l'Est."
 MON_jet_tac_bomber_equipment_7:0 "Soukhoï Su-24"
 MON_jet_tac_bomber_equipment_7_short:0 "Su-24M"
 MON_jet_tac_bomber_equipment_7_desc:0 "Entré en service en 1983, le Su-24M était un développement ultérieur du Su-24 à partir du moment où le type initial est entré en service. L'une des principales caractéristiques du Su-24M est l'inclusion d'une capacité de ravitaillement en vol avec une sonde de ravitaillement rétractable, un nouveau système de navigation interne et le désignateur laser Kaira-24, permettant au type d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."
 MON_jet_tac_bomber_equipment_8:0 "Soukhoï Su-34"
 MON_jet_tac_bomber_equipment_8_short:0 "Su-34"
 MON_jet_tac_bomber_equipment_8_desc:0 "Un attaquant développé sur la base du Su-27 avec un cockpit en tandem. Il fait preuve d'une maniabilité de première classe pour un attaquant, avec ses mouvements agiles rivalisant de manière agressive avec les combattants de la même classe. Une armure plus épaisse augmente également son taux de survie. Le nom de code OTAN est « Fullback ». En supposant des missions d'attaque sur une période prolongée, la partie arrière des sièges pilotes dispose d'un lavabo et d'une cuisine simple."

 MON_strat_bomber_equipment_1:0 "Petliakov Pe-8"
 MON_strat_bomber_equipment_1_short:0 "Pe-8"
 MON_strat_bomber_equipment_1_desc:0 "Bombardier lourd soviétique conçu avant la Seconde Guerre mondiale, le Pe-8 (à l'origine TB-7 jusqu'à ce que le nom change pour honorer Vladimir Petlyakov à sa mort en 1942) était le seul bombardier quadrimoteur développé pendant la guerre. Produit en nombre limité, il fut utilisé pour bombarder Berlin en août 1941. Il fut également utilisé pour des « raids de moral » destinés à remonter le moral du peuple soviétique en exposant les vulnérabilités de l'Axe. Sa mission principale, cependant, était d'attaquer de nuit les aérodromes, les gares de triage et autres installations arrière allemandes. Parce que ces avions remontaient le moral, la Luftwaffe allemande les a souvent ciblés, et un grand nombre d'entre eux ont été détruits au cours de la Grande Guerre patriotique. Après la guerre, ils servirent essentiellement de moyens de transport jusqu'à la fin des années 1950."
 MON_strat_bomber_equipment_2:0 "Iliouchine Il-4"
 MON_strat_bomber_equipment_2_short:0 "Il-4"
 MON_strat_bomber_equipment_2_desc:0 "Bien que l'Il-4 ne soit qu'un bombardier moyen, il avait la portée nécessaire pour être utilisé dans des missions stratégiques. L'utilisation des bombardiers dans ce rôle n'était pas une priorité pour le VVS, mais l'Il-4 fut néanmoins utilisé lors de plusieurs raids de bombardement à longue portée contre Berlin en 1941. La plupart seraient utilisés sur des missions à plus courte portée, ajoutant souvent 1 000 kg (2 204 lb) supplémentaires de bombes sous les ailes, en plus des 2 500 kg (5 512 lb) internes."
 MON_strat_bomber_equipment_3:0 "Tupolev Tu-4"
 MON_strat_bomber_equipment_3_short:0 "Tu-4"
 MON_strat_bomber_equipment_3_desc:0 "Le Tu-4 est une conception d'ingénierie inverse basée sur le B-29 Superfortress américain, développé pour répondre au besoin de Joseph Staline de disposer d'un bombardier stratégique doté de capacités similaires à celles du bombardier américain vainqueur de la guerre. Malgré le refus des États-Unis de prêter-louer le B-29, quatre B-29 se sont écrasés sur le territoire soviétique, ce qui a suffi pour lancer le processus de rétro-ingénierie. Malgré de nombreuses difficultés (obtention de pièces équivalentes ou supérieures aux pièces développées aux États-Unis, conversion du système impérial au système métrique, etc.), le premier vol et la mise en service du Tu-4 ont suffi à paniquer les États-Unis et la Grande-Bretagne, le premier d'une longue série pendant la guerre froide. Il aura cependant une courte durée de vie, remplacé par des bombardiers à réaction au milieu des années 1960. Son nom de rapport OTAN est Bull."

 MON_jet_strat_bomber_equipment_1:0 "Tupolev Tu-16"
 MON_jet_strat_bomber_equipment_1_short:0 "Tu-16"
 MON_jet_strat_bomber_equipment_1_desc:0 "Le Tu-16 était un bombardier stratégique bimoteur développé en 1952 et l'un des premiers bombardiers stratégiques à réaction à entrer en service dans l'armée de l'air soviétique. Il avait une configuration à ailes en flèche et était propulsé par deux turboréacteurs Mikulin AM-3 sur les emplantures des ailes. Il pouvait transporter jusqu'à 9 000 kg (20 000 lb) de munitions, y compris des armes nucléaires et la FAB-9000, une bombe de 9 000 kg avec un rendement similaire à la bombe britannique du Grand Chelem. Connu en Occident sous le nom de Badger, ce type a servi tout au long de la guerre froide et a pris sa retraite en 1993. La variante chinoise construite sous licence, le H-6, reste en service en tant que bombardier stratégique de première ligne de la PLAAF."
 MON_jet_strat_bomber_equipment_2:0 "Myasishchev Mya-3M Molot"
 MON_jet_strat_bomber_equipment_2_short:0 "M-3M Molot"
 MON_jet_strat_bomber_equipment_2_desc:0 "Le Mya-4 (ou M-4, désignation Myasishchev 2M) est un bombardier stratégique quadrimoteur entré en service en 1956. Ce bombardier était capable de longue portée, capable de frapper des cibles directement sur le continent américain à partir de bases russes, bien qu'il s'agisse d'un aller simple. Malgré cela, ainsi que d'autres tactiques de désinformation sélectives, les politiciens occidentaux et les agences de renseignement ont paniqué et ont conduit à la construction de nouveaux B-47 Stratojets et du B-52 Stratofortress récemment introduit. Les Russes l'ont officiellement surnommé Molot, ce qui signifie Marteau, tandis que l'OTAN lui a donné le nom de code Bison et que l'US Air Force l'a désigné Type 37."
 MON_jet_strat_bomber_equipment_3:0 "Tupolev Tu-95M"
 MON_jet_strat_bomber_equipment_3_short:0 "Tu-95M"
 MON_jet_strat_bomber_equipment_3_desc:0 "S'il y avait jamais un bombardier qui pouvait être décrit comme le visage de la force de bombardement soviétique, ce serait bien le Tu-95. Introduit en 1956, le Tu-95 est le seul bombardier stratégique à hélice encore en service à ce jour. C'est l'un des avions militaires les plus bruyants en raison des pointes des pales de l'hélice qui se déplacent plus rapidement que la vitesse du son. Tout comme le B-52 Stratofortress américain, le bombardier Tu-95 est souvent comparé. Le Tu-95 devrait rester en service dans l'aérospatiale russe jusque dans les années 2040. Pour l'Occident, il est normal que l'avion synonyme de l'Empire soviétique reçoive le nom de code Bear"
 MON_jet_strat_bomber_equipment_4:0 "Tupolev Tu-95KD"
 MON_jet_strat_bomber_equipment_4_short:0 "Tu-95KD"
 MON_jet_strat_bomber_equipment_4_desc:0 "Cette version du Tu-95 a reçu une mise à niveau avionique conçue pour transporter des missiles guidés tels que le missile air-sol Kh-20."
 MON_jet_strat_bomber_equipment_5:0 "Tupolev Tu-95MS"
 MON_jet_strat_bomber_equipment_5_short:0 "Tu-95MS"
 MON_jet_strat_bomber_equipment_5_desc:0 "Une toute nouvelle plate-forme de porte-missiles de croisière basée sur la cellule Tu-142. Cette variante est devenue la plate-forme de lancement du missile de croisière Raduga Kh-55 et a été produite en série en 1981. Connue par l'OTAN sous le nom de Bear-H, elle a été désignée par l'armée américaine sous le nom de Tu-142 pendant un certain temps dans les années 1980 avant que sa véritable désignation ne soit connue."

 MON_mach2stratbomber_equipment_1:0 "Tupolev Tu-22"
 MON_mach2stratbomber_equipment_1_short:0 "Tu-22"
 MON_mach2stratbomber_equipment_1_desc:0 "Premier bombardier supersonique à entrer en production en Union soviétique, le Tu-22 est entré en service dans l'armée de l'air soviétique en 1962. Produit en petit nombre (311 exemplaires ont été construits), ce type s'est avéré décevant, car il lui manquait la portée intercontinentale attendue d'un tel bombardier. Malgré cela, le Tu-22 a été modernisé tout au long de sa durée de vie, étant utilisé comme plate-forme de lancement pour le missile antinavire à longue portée Kh-22 (nom OTAN : AS-4 Kitchen). Son nom de code OTAN est Blinder."
 MON_mach2stratbomber_equipment_2:0 "Tupolev Tu-22M2"
 MON_mach2stratbomber_equipment_2_short:0 "Tu-22M2"
 MON_mach2stratbomber_equipment_2_desc:0 "Le Tu-22M2 est un développement ultérieur du Tu-22 Blinder. Initialement désigné Tu-26, le Tu-22M était utilisé à la fois par les forces aériennes soviétiques (comme bombardier stratégique, remplaçant le Tu-22 Blinder) et par l'aviation navale soviétique (comme avion de patrouille maritime). Sa découverte par les forces américaines a provoqué un choc en Occident, d'autant plus que le premier ministre Khrouchtchev aurait déclaré que les ICBM rendraient les bombardiers obsolètes. La variante Tu-22M2 en question était la première variante majeure de production, avec des moteurs et des admissions de style F-4 Phantom qui donnaient à l'engin une vitesse de pointe de Mach 1,65. Depuis 2014, plus de 100 Tu-22M2 Blinder-B sont en service dans l'armée de l'air russe."
 MON_mach2stratbomber_equipment_3:0 "Tupolev Tu-22M3"
 MON_mach2stratbomber_equipment_3_short:0 "Tu-22M3"
 MON_mach2stratbomber_equipment_3_desc:0 "Le dernier Tu-22M3, qui a volé pour la première fois en 1977, a été mis en service en 1983 et est officiellement entré en service en 1989, était équipé de nouveaux moteurs NK-25 avec beaucoup plus de puissance, de rampes d'admission en forme de coin similaires à celles du MiG-25, d'ailes avec une plus grande flèche maximale et d'un nez remodelé abritant un nouveau radar de navigation/attaque Almaz PNA (Planeta Nositel, izdeliye 030A) et un NK-45. système de navigation/attaque, qui permet un vol à basse altitude considérablement amélioré."
 #MON_mach3stratbomber_equipment_1:0 "Sukhoi T-4M Sotka"
 #MON_mach3stratbomber_equipment_1_short:0 "T-4M Sotka"
 #MON_mach3stratbomber_equipment_1_desc:0 "The T-4M was a further mock-up design of the original T-4, designed based on the American XB-70 Valkyrie. The T-4M was designed with variable-geometry wings, and enlarged canard foreplanes, yet retained the fuselage and engine structure of the T-4. It is believed that top speed of the T-4M would be at Mach 3, with a cruising speed of Mach 2.8."
 #MON_mach6stratbomber_equipment_1:0 "Sukhoi T-4MS"
 #MON_mach6stratbomber_equipment_1_short:0 "T-4MS"
 #MON_mach6stratbomber_equipment_1_desc:0 "A complete and total redesign of the T-4M high mach strategic bomber. e Sukhoi Design Bureau started the development of a brand new Strategic double-mode aircraft the T-4MS based on the experiences gained from the T-4 Sotka. It was planned to install the same powerplants, aboard systems and equipment."

 #MON_nuclearstratbomber_equipment_1:0 "Tupolev Tu-119"
 #MON_nuclearstratbomber_equipment_1_short:0 "Tu-119"
 #MON_nuclearstratbomber_equipment_1_desc:0 "The Tu-119 was the development of a nuclear-powered strategic bomber derived from the Tu-95 after utilizing a research aircraft (Tu-95LML). The type would have been powered by two nuclear-powered engines inboard (utilizing power from heat generated by an onboard nuclear reactor) and two kerosene-powered turboprop engines outboard."
 #MON_nuclearstratbomber_equipment_2:0 "Myasishchev M-60"
 #MON_nuclearstratbomber_equipment_2_short:0 "M-60"
 #MON_nuclearstratbomber_equipment_2_desc:0 "The M-60 was Myasishchev's design for a nuclear-powered strategic bomber, itself based on the M-50 Bounder Strategic Bomber design. It would have been powered by four non-afterburning turbojets in a similar configuration to the Tu-119, two inboard engines powered by a nuclear reactor, and two kerosene-powered engines outboard. Due to fears of environmental damage due to mishaps or accidents and cost overruns, the project would be terminated."

 #MON_stealth_tactical_bomber_equipment_1:0 "Sukhoi Su-24BM"
 #MON_stealth_tactical_bomber_equipment_1_short:0 "Su-24BM"
 #MON_stealth_tactical_bomber_equipment_1_desc:0 "In 1979 V Sarov started work on a much larger development of the Su-24M which had an internal weapons bay that could hold most of the weapons intended to be used by the new aircraft. Known within the OKB as the T-6BM (Bolshaya Modifikatsiya or large modification), and to the W S as the Su-24BM, this was a much bigger yet stealthier aeroplane than the Su-24."
 #MON_stealth_tactical_bomber_equipment_2:0 "Sukhoi Su-34M"
 #MON_stealth_tactical_bomber_equipment_2_short:0 "Su-34M"
 #MON_stealth_tactical_bomber_equipment_2_desc:0 "Modernized version Su-34. According to reports, this upgrade will seriously affect almost all of the aircraft's avionics. The radar, sight, communication system will be improved. The range of "smart" bombs and missiles that the bomber can use will be significantly expanded. EW capabilities will also be expanded with introduction of new hardpoints."

 MON_stealth_strategic_bomber_equipment_1:0 "Tupolev Tu-160"
 MON_stealth_strategic_bomber_equipment_1_short:0 "Tu-160"
 MON_stealth_strategic_bomber_equipment_1_desc:0 "Le Tupolev Tu-160 est un bombardier stratégique lourd supersonique à ailes à flèche variable conçu par le bureau de conception de Tupolev en Union soviétique dans les années 1970. Il s'agit de l'avion militaire supersonique Mach 2+ le plus grand et le plus lourd jamais construit et se situe à côté de l'expérimental XB-70 Valkyrie en termes de longueur totale. En 2021, il s'agit de l'avion de combat le plus grand et le plus lourd, du bombardier le plus rapide utilisé et de l'avion à voilure variable le plus grand et le plus lourd jamais piloté."
 MON_stealth_strategic_bomber_equipment_2:0 "Tupolev Tu-160M2"
 MON_stealth_strategic_bomber_equipment_2_short:0 "Tu-160M2"
 MON_stealth_strategic_bomber_equipment_2_desc:0 "Version hautement améliorée avec des revêtements peu observables, de nouveaux moteurs plus puissants et efficaces lui donnant une plus grande portée opérationnelle, une nouvelle avionique, une nouvelle électronique, un cockpit en verre, des systèmes de communication et de contrôle, et un certain nombre d'armes, ainsi qu'une poussée améliorée et une autonomie sans ravitaillement. Il disposera également d'un nouveau système défensif le protégeant des missiles."
 #MON_stealth_strategic_bomber_equipment_2:0 "Tupolev PAK DA"
 #MON_stealth_strategic_bomber_equipment_2_short:0 "PAK DA"
 #MON_stealth_strategic_bomber_equipment_2_desc:0 "The PAK-DA (The acronym meaning Perspektivnyi Aviatsionnyi Kompleks Dal'ney Aviatsii, or prospective aviation complex for long-range aviation) is a proposed Russian next-generation strategic bomber being developed for the Russian Air Force. A Stealth strategic bomber, the PAK DA is expected to enter service in 2025-30, with the first aircraft being delivered sometime between 2020 and 2023, with the intent to replace the Tu-95 'Bear' and Tu-160 'Blackjack' bombers."

 MON_transport_plane_equipment_1:0 "Douglas DC-3"
 MON_transport_plane_equipment_1_short:0 "DC-3"
 MON_transport_plane_equipment_2:0 "Lisunov Li-2T"
 MON_transport_plane_equipment_2_short:0 "Li-2T"
 MON_transport_plane_equipment_3:0 "Iliouchine Il-12D"
 MON_transport_plane_equipment_3_short:0 "Il-12D"
 MON_transport_plane_equipment_4:0 "Antonov An-12"
 MON_transport_plane_equipment_4_short:0 "An-12"
 MON_transport_plane_equipment_5:0 "Antonov An-22"
 MON_transport_plane_equipment_5_short:0 "An-22"
 MON_transport_plane_equipment_6:0 "Iliouchine Il-76D"
 MON_transport_plane_equipment_6_short:0 "Il-76D"
 MON_transport_plane_equipment_7:0 "Iliouchine Il-76M"
 MON_transport_plane_equipment_7_short:0 "Il-76M"
 MON_transport_plane_equipment_8:0 "Iliouchine Il-76MD"
