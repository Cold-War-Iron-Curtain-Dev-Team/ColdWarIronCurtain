 ZIM_Suggest_Federalization_of_British_Central_Africa:0 "Suggérer la fédéralisation de l'Afrique centrale britannique"
 ZIM_Suggest_Federalization_of_British_Central_Africa_desc:0 "Jim Griffiths, secrétaire d'État aux Colonies, a informé la Chambre des Communes que le gouvernement britannique avait décidé de réexaminer la possibilité d'une union plus étroite entre les territoires de l'Afrique centrale et qu'une conférence des gouvernements respectifs et du Conseil de l'Afrique centrale était en cours d'organisation."
 ZIM_Begin_Negotiations:0 "Commencer les négociations"
 ZIM_Begin_Negotiations_desc:0 "Commencer les négociations pour établir la fédération."
 ZIM_Appeal_to_Cohen:0 "Appel à Cohen"
 ZIM_Appeal_to_Cohen_desc:0 "Un accord n'aurait probablement pas été conclu sans Sir Andrew Cohen, sous-secrétaire adjoint du CO pour les Affaires africaines. Il est devenu l'un des architectes centraux et des forces motrices derrière la création de la Fédération, dénouant souvent à lui seul les impasses et les départs purs et simples des partis respectifs. Cohen, juif et traumatisé par l'Holocauste, était un antiraciste et un défenseur des droits des Africains. Mais il a compromis ses idéaux pour éviter ce qu'il considérait comme un risque encore plus grand que la continuation du système paternaliste d'ascendance blanche de la Rhodésie du Sud : celui-ci deviendrait une suprématie blanche radicale et encore moins flexible, comme le gouvernement du Parti national en Afrique du Sud."
 ZIM_Settle_on_Federal_Structure:0 "Adopter une structure fédérale"
 ZIM_The_Federation_of_Rhodesia_and_Nyasaland:0 "La Fédération de Rhodésie et du Nyassaland"
 ZIM_The_Federation_of_Rhodesia_and_Nyasaland_desc:0 "La Chambre des communes a approuvé les propositions des conférences et adopté des motions en faveur de la fédération des territoires de la Rhodésie du Nord et du Nyassaland. Un référendum a eu lieu en Rhodésie du Sud à ce sujet. Suite à l'insistance et aux assurances du Premier ministre de Rhodésie du Sud, un peu plus de 25 000 Rhodésiens du Sud blancs ont voté lors du référendum pour un gouvernement fédéral, contre près de 15 000 contre. Une majorité d'Afrikaners et d'Africains noirs dans les trois territoires s'y opposaient résolument. La Fédération a vu le jour lorsque le Parlement du Royaume-Uni a promulgué la Loi de 1953 sur la Fédération de la Rhodésie et du Nyassaland. La loi autorisait la Reine, par voie de décret, à pourvoir à la fédération des trois territoires constitutifs."
