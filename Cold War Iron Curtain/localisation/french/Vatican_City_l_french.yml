 In_hoc_signo_vinces: "In Hoc Signo Vinces"
 In_hoc_signo_vinces_desc: "§R« Je peux tout faire par le Christ qui me fortifie.» - Philippiens 4:13§!\n\nL'influence de la Cité du Vatican sur la direction de l'Église est profonde, institutionnelle et sans précédent. Ce n'est pas simplement le siège de l'administration catholique : c'est le coeur battant de l'Église catholique romaine, où la doctrine est définie, les évêques sont nommés et la direction du catholicisme mondial est discernée et commandée. Entre ses murs, l'histoire, la tradition, la théologie et la gouvernance convergent dans une expression singulière d'autorité.\n\nAu centre de cette influence se trouve le Pape, l'évêque de Rome, qui exerce une juridiction suprême, pleine, immédiate et universelle sur l'Église. Depuis sa résidence dans la Cité du Vatican, le pape gouverne non seulement en tant que père spirituel, mais aussi en tant que chef d'État, publiant des encycliques, nommant des évêques, convoquant des synodes et sauvegardant l'orthodoxie. Son autorité est absolue en matière de foi et de morale, et la Cité du Vatican est l'instrument physique de cette autorité."
 O_Roma_Felix_Nobilis: "O Roma Félix Nobilis"
 O_Roma_Felix_Nobilis_desc: "§R\"Nous aimons parce qu'il nous a aimés le premier.\" - 1 Jean 4:19§!\n\nPendant plus de mille ans, les papes ont régné sur une partie de l'Italie centrale connue sous le nom d'États pontificaux, une fusion unique de leadership spirituel et de pouvoir temporel. Du VIIIe siècle jusqu'en 1870, ce domaine papal servit non seulement de siège de l'Église mais aussi d'acteur géopolitique. Le Pape était à la fois berger des âmes et prince des terres. Les États pontificaux ont exercé leur influence dans les guerres, les traités et les alliances à travers l'Europe. Mais le XIXe siècle a amené la révolution et le nationalisme dans la péninsule italienne, culminant avec l'unification de l'Italie et la prise de Rome par les forces italiennes en 1870.\n\nPendant près de 60 ans, les papes successifs se considéraient comme des « prisonniers du Vatican », refusant de quitter ou de reconnaître le nouveau régime. C'était une impasse : ni l'Église ni l'État n'étaient pleinement disposés à céder.\n\nCette impasse prit fin en 1929 avec le Traité du Latran, signé par le pape Pie XI et Benito Mussolini au nom du roi Victor Emmanuel III. Avec cet accord, l'Italie reconnaissait formellement la pleine souveraineté du Saint-Siège sur un nouvel État indépendant : la Cité du Vatican."
 vatican.1.d: "Le pape Pie XII, qui avait dirigé l'Église pendant la guerre et dans les premières années d'après-guerre, a laissé un héritage marqué par des manoeuvres diplomatiques, un conservatisme doctrinal et une résistance discrète au communisme.\n\nÀ mesure que l'Europe se reconstruisait, le catholicisme était confronté à la pression croissante de la laïcité en Occident, aux persécutions dans les États communistes comme l'URSS et la Chine, et aux demandes croissantes de modernisation et d'action pastorale dans les pays du Sud. Le Collège des Cardinaux est entré dans le conclave avec un sentiment à la fois de respect et d'urgence. Ils avaient besoin d'un leader capable de préserver l'orthodoxie tout en relevant les défis internes et externes croissants de l'Église. Il est maintenant temps de choisir son successeur...\n\nQui serait-ce ?"
 vatican.2.d: "La dernière maladie du pape Jean XXIII a été prolongée et marquée par une dignité, un souci pastoral et une profondeur spirituelle extraordinaires. Les premiers signes d'une maladie grave sont apparus dans la seconde moitié de 1962, après l'ouverture mémorable du Concile Vatican II le 11 octobre. Fin novembre, des examens médicaux ont confirmé la présence d'une tumeur maligne à l'estomac - largement considérée comme un cancer, bien que non divulguée publiquement à l'époque. Malgré des limitations physiques croissantes, le Saint-Père a choisi de continuer à exercer ses fonctions le plus longtemps possible.\n\nTout au long des premiers mois de 1963, l'état du pape se détériora régulièrement. Il souffrait d'hémorragies internes importantes, d'infections récurrentes et d'une perte de poids importante, même s'il restait mentalement alerte et spirituellement engagé. Le Vatican a soigneusement géré les communications publiques, mettant souvent l'accent sur sa résilience et sa sérénité tout en se préparant tranquillement à l'éventualité de sa mort.\n\nÀ la mi-mai 1963, son état entre dans une phase critique. Le pape fut en grande partie confiné au lit dans ses appartements privés du palais apostolique, où il était assisté par un petit cercle d'assistants personnels, de médecins et de membres du clergé. À ce stade, il était incapable de manger des aliments solides et on lui administrait fréquemment des sédatifs et des traitements palliatifs. Malgré les souffrances physiques, il a reçu des visiteurs en nombre limité et a continué à offrir des bénédictions, des messages de paix et des expressions d'affection aux fidèles du monde entier.\n\nDans les derniers jours avant sa mort, le pape Jean a connu plusieurs épisodes de détresse respiratoire et de douleur quasi continue. Selon les personnes présentes, il est resté calme et priant. Son aumônier a administré l'onction des malades et le viatique, et le pape a invoqué à plusieurs reprises des prières pour la paix et l'unité dans l'Église et dans le monde.\n\nEt alors qu'un autre Pontife est entré dans l'histoire, il est temps de choisir son successeur..."
 Vatican_news.2.d: "Fin 1962, peu après l'ouverture de Vatican II, la santé du pape Jean XXIII commença à se détériorer. On lui a diagnostiqué un cancer de l'estomac, qu'il a supporté avec grâce et courage. Son état s'est aggravé au cours des premiers mois de 1963, même s'il a continué à recevoir des visiteurs et à s'intéresser aux affaires de l'Église autant que ses forces le lui permettaient.\n\nÀ la fin du mois de mai 1963, sa maladie entra dans sa phase finale. Le Pape était confiné dans son appartement du Palais apostolique, où il recevait les sacrements et les prières des fidèles. Les rapports le décrivent comme lucide, priant et en paix pendant ses dernières heures.\n\nLe pape Jean XXIII est décédé paisiblement le soir du 3 juin 1963, entouré de son personnel et de ses assistants. Ses derniers mots rapportés étaient : « Ut unum sint » (« Afin qu'ils soient un ») - une référence à la prière du Christ pour l'unité entre ses disciples, reflétant sa profonde préoccupation oecuménique."
 Vatican_news.1.d: "Sa Sainteté le pape Pie XII (Eugenio Pacelli) est décédé aux premières heures du jeudi 9 octobre 1958, des suites d'une maladie prolongée. Le pape était en mauvaise santé depuis plusieurs semaines et a souffert de multiples épisodes cardiaques au cours des dernières 48 heures. Le décès a été confirmé par le médecin traitant papal, le Dr Riccardo Galeazzi-Lisi\n\nLe pape résidait dans la résidence d'été papale de Castel Gandolfo en raison de la chaleur qui règne à Rome et de sa fragilité. Au cours des derniers jours, son état s'est aggravé, apparemment en raison de complications circulatoires et rénales. Une crise cardiaque survenu le 8 octobre a entraîné une détérioration critique de son état. Malgré les efforts de l'équipe médicale, il est décédé avant l'aube."