 USA_REAGEN72_Resource_Conservation_Act:0 "Loi sur la conservation des ressources"
 USA_REAGEN72_The_Reagen_Administration_desc:0 "Reagan prend ses fonctions en promettant une baisse des impôts, un budget équilibré et une ligne plus ferme à l'étranger."
 USA_REAGEN72_Sustain_the_Apollo_Program_desc:0 "L'administration maintient le programme Apollo en activité au lieu de mettre un terme aux vols lunaires."
 USA_REAGEN72_War_Powers_Resolution_desc:0 "Le Congrès adopte la résolution sur les pouvoirs de guerre, limitant la durée pendant laquelle les forces peuvent être envoyées à l'étranger sans son approbation."
 USA_REAGEN72_Federal_Aid_Highway_Act_desc:0 "La Federal-Aid Highway Act poursuit le programme interétatique. Le projet de loi va au Congrès."
 USA_REAGEN72_Amtrak_Improvement_Act_desc:0 "L'Amtrak Improvement Act investit de nouveaux fonds dans le transport ferroviaire de passagers. Le projet de loi va au Congrès."
 USA_REAGEN72_Comprehensive_Education_and_Training_Act_desc:0 "La loi sur la formation élargit les programmes d'emploi fédéraux. Le projet de loi va au Congrès."
 USA_REAGEN72_Crackdown_on_Juvenile_Delinquency_desc:0 "L'administration demande aux États de se montrer plus sévères à l'égard de la délinquance juvénile."
 USA_REAGEN72_Continue_the_NERVA_Program_desc:0 "Les travaux se poursuivent sur la fusée nucléaire, plutôt que de laisser le programme se terminer."
 USA_REAGEN72_Disaster_Relieft_Act_desc:0 "La loi sur les secours en cas de catastrophe élargit l'aide fédérale après une catastrophe. Le projet de loi va au Congrès."
 USA_REAGEN72_Federal_Fire_Prevention_Act_desc:0 "La loi fédérale sur la prévention des incendies fixe les règles nationales en matière de sécurité incendie. Le projet de loi va au Congrès."
 USA_REAGEN72_Send_Goldwater_to_the_UN_desc:0 "Barry Goldwater est envoyé pour représenter les États-Unis aux Nations Unies."
 USA_REAGEN72_Employee_Retirement_Income_Security_Act_desc:0 "La loi sur les pensions fixe les règles fédérales pour les régimes de retraite privés. Le projet de loi va au Congrès."
 USA_REAGEN72_End_the_Draft_desc:0 "Le projet se termine. A partir d'ici, les forces armées sont des volontaires."
 USA_REAGEN72_Federal_Land_Reform_desc:0 "La politique foncière fédérale est réécrite et davantage de terres publiques sont ouvertes à l'usage."
 USA_REAGEN72_Revenue_Adjustment_Act_desc:0 "La loi sur l'ajustement des revenus réduit les taux d'imposition. Le projet de loi va au Congrès."
 USA_REAGEN72_Railroad_Revitilization_and_Regulation_Act_desc:0 "La loi ferroviaire réorganise les lignes de fret en difficulté et assouplit leur réglementation. Le projet de loi va au Congrès."
 USA_REAGEN72_Trade_Act_of_1974_desc:0 "Le Trade Act de 1974 donne au président un nouveau pouvoir pour négocier et répondre au commerce déloyal. Le projet de loi va au Congrès."
 USA_REAGEN72_Morning_in_America_desc:0 "L'administration dit au pays que la crise s'atténue et que la confiance revient."
 USA_REAGEN72_Fight_Inflation_desc:0 "L'administration s'oppose à la hausse des prix, échangeant une économie plus calme contre une hausse plus lente du coût de la vie."
 USA_REAGEN72_Copyright_Act_of_1976_desc:0 "La loi sur le droit d'auteur de 1976 réécrit les règles concernant la propriété d'une oeuvre et pour combien de temps. Le projet de loi va au Congrès."
 USA_REAGEN72_Resource_Conservation_Act_desc:0 "La Loi sur la conservation des ressources définit un regard fédéral sur les déchets et la valorisation. Le projet de loi va au Congrès."
 USA_REAGAN80_The_Reagan_Administration:0 "L'administration Reagan"
 USA_REAGAN80_The_Reagan_Administration_desc:0 "Reagan entre à la Maison Blanche en promettant un gouvernement fédéral plus petit, une ligne plus dure à l'égard de l'Union soviétique et un rétablissement de la confiance."
 USA_REAGAN80_Executive_Order_12333:0 "Décret exécutif 12333"
 USA_REAGAN80_Executive_Order_12333_desc:0 "Reagan signe le décret 12333. Il fixe les règles de collecte de renseignements et demande aux agences fédérales de coopérer avec la CIA."
 USA_REAGAN80_Escalate_the_War_on_Drugs:0 "Intensifier la guerre contre la drogue"
 USA_REAGAN80_Escalate_the_War_on_Drugs_desc:0 "Reagan élargit la campagne fédérale contre les stupéfiants et accorde davantage de poids au gouvernement sur la répression."
 USA_REAGAN80_End_Petrolum_Price_and_Allocation_Controls:0 "Mettre fin aux contrôles sur les prix et les allocations du pétrole"
 USA_REAGAN80_End_Petrolum_Price_and_Allocation_Controls_desc:0 "Reagan met fin aux derniers contrôles fédéraux sur le prix et la répartition du pétrole."
 USA_REAGAN80_Slash_Enviromental_Regulations_and_Funding:0 "Réduire les réglementations et le financement environnementaux"
 USA_REAGAN80_Slash_Enviromental_Regulations_and_Funding_desc:0 "Reagan réduit les règles environnementales et les budgets des bureaux qui les appliquent."
 USA_REAGAN80_Agriculture_and_Food_Act_of_1981:0 "Loi sur l'agriculture et l'alimentation de 1981"
 USA_REAGAN80_Agriculture_and_Food_Act_of_1981_desc:0 "La Loi sur l'agriculture et l'alimentation réécrit les aides aux cultures. Le projet de loi va au Congrès."
 USA_REAGAN80_Tighten_the_Monetary_Supply:0 "Resserrer l'offre monétaire"
 USA_REAGAN80_Tighten_the_Monetary_Supply_desc:0 "L'administration soutient un resserrement de la masse monétaire et des taux d'intérêt plus élevés afin de freiner l'inflation."
 USA_REAGAN80_Hike_Military_Spending:0 "Augmenter les dépenses militaires"
 USA_REAGAN80_Hike_Military_Spending_desc:0 "Reagan augmente les dépenses des forces armées et demande aux services de reconstruire."
 USA_REAGAN80_Stack_the_NLRB:0 "Empilez le NLRB"
 USA_REAGAN80_Stack_the_NLRB_desc:0 "Reagan remplit le Conseil national des relations du travail de membres enclins à se ranger du côté de la direction."
 USA_REAGAN80_Omnibus_Budget_Reconciliation_Act_of_1981:0 "Loi omnibus de réconciliation budgétaire de 1981"
 USA_REAGAN80_Omnibus_Budget_Reconciliation_Act_of_1981_desc:0 "Le projet de loi de réconciliation de 1981 réduit les dépenses intérieures. Le projet de loi va au Congrès."
 USA_REAGAN80_Economic_Recovery_Tax_Act_of_1981:0 "Loi fiscale de relance économique de 1981"
 USA_REAGAN80_Economic_Recovery_Tax_Act_of_1981_desc:0 "La loi relative à la taxe de relance économique réduit les taux d'imposition sur le revenu dans tous les domaines. Le projet de loi va au Congrès."
 USA_REAGAN80_Garn_St_Germain_Depository_Institutions_Act:0 "Loi sur les institutions de dépôt Garn-St Germain"
 USA_REAGAN80_Garn_St_Germain_Depository_Institutions_Act_desc:0 "La loi Garn-St Germain assouplit les règles sur les friperies et autres dépôts. Le projet de loi va au Congrès."
 USA_REAGAN80_Tax_Equity_and_Fiscal_Responsibility_Act_of_1982:0 "Loi sur l'équité fiscale et la responsabilité fiscale de 1982"
 USA_REAGAN80_Tax_Equity_and_Fiscal_Responsibility_Act_of_1982_desc:0 "La loi de 1982 comble des lacunes et augmente certains impôts pour réduire le déficit ouvert par les réductions précédentes. Le projet de loi va au Congrès."
 USA_REAGAN80_Social_Security_Amendments_of_1983:0 "Modifications de la sécurité sociale de 1983"
 USA_REAGAN80_Social_Security_Amendments_of_1983_desc:0 "Les amendements de 1983 augmentent les charges sociales et repoussent progressivement l'âge de la retraite. Le projet de loi va au Congrès."
 USA_REAGAN80_Launch_Purge_of_Social_Security_Disability_Recipients:0 "Purger les jets d'invalidité"
 USA_REAGAN80_Launch_Purge_of_Social_Security_Disability_Recipients_desc:0 "L'administration examine les listes d'invalidité et supprime les bénéficiaires qui, selon elle, ne sont plus éligibles."
 USA_REAGAN80_Comprehensive_Crime_Control_Act:0 "Loi sur la lutte globale contre la criminalité"
 USA_REAGAN80_Comprehensive_Crime_Control_Act_desc:0 "La Loi sur la lutte globale contre la criminalité durcit les peines fédérales. Le projet de loi va au Congrès."
 USA_REAGAN80_Push_to_Relax_the_VRA:0 "Faire pression pour assouplir la loi sur le droit de vote"
 USA_REAGAN80_Push_to_Relax_the_VRA_desc:0 "Reagan fait pression pour assouplir certaines parties du Voting Rights Act et donner plus de marge de manoeuvre aux États."
 USA_REAGAN80_What_to_do_about_AIDS:0 "Que faire contre le SIDA"
 USA_REAGAN80_What_to_do_about_AIDS_desc:0 "Le sida se propage et l'administration doit décider de ce que fera le gouvernement fédéral."
 USA_REAGAN80_National_Minimum_Drinking_Age_Act:0 "Loi nationale sur l'âge minimum pour boire de l'alcool"
 USA_REAGAN80_National_Minimum_Drinking_Age_Act_desc:0 "La loi lie l'argent des routes fédérales à un âge minimum pour boire de l'alcool de vingt et un ans. Le projet de loi va au Congrès."
 USA_REAGAN80_Deficit_Reduction_Act_of_1984:0 "Loi sur la réduction du déficit de 1984"
 USA_REAGAN80_Deficit_Reduction_Act_of_1984_desc:0 "La loi sur la réduction du déficit réduit les dépenses et augmente certains impôts. Le projet de loi va au Congrès."
 USA_REAGAN80_Push_to_Strip_the_Courts_of_Jurdistriction_Over_School_Prayer_and_Abortion:0 "Dépouiller les tribunaux sur la prière scolaire et l'avortement"
 USA_REAGAN80_Push_to_Strip_the_Courts_of_Jurdistriction_Over_School_Prayer_and_Abortion_desc:0 "Reagan fait pression pour que la prière scolaire et l'avortement soient hors de portée des tribunaux fédéraux."
 USA_MUSKIE76_The_Muskie_Administration:0 "L'administration Muskie"
 USA_MUSKIE76_Persue_Gun_Control_Legislation:0 "Poursuivre la législation sur le contrôle des armes à feu"
 USA_MUSKIE76_Push_for_Clean_Power:0 "Pousser pour une énergie propre"
 USA_MUSKIE76_Community_Reinvestment_Act:0 "Loi sur le réinvestissement communautaire"
 USA_MUSKIE76_Push_for_Free_Four_Year_University:0 "Faites pression pour une université gratuite de quatre ans"
 USA_MUSKIE76_Establish_the_Department_of_Energy:0 "Créer le ministère de l'Énergie"
 USA_MUSKIE76_Emergency_Natural_Gas_Act:0 "Loi d'urgence sur le gaz naturel"
 USA_MUSKIE76_Humphrey_Hawkins_Full_Employment_Act:0 "Loi sur le plein emploi Humphrey Hawkins"
 USA_MUSKIE76_Push_for_a_Universal_Healthcare_Program:0 "Faire pression pour un programme de soins de santé universel"
 USA_MUSKIE76_Energy_Security_Act:0 "Loi sur la sécurité énergétique"
 USA_MUSKIE76_Job_Training_Partnership_Act:0 "Loi sur le partenariat pour la formation professionnelle"
 USA_MUSKIE76_Nuclear_Waste_Policy_Act:0 "Loi sur la politique en matière de déchets nucléaires"
 USA_MUSKIE76_Public_Infrastructure_Investments:0 "Investissements dans les infrastructures publiques"
 USA_MUSKIE76_Campaign_for_Consumer_Protections:0 "Campagne pour la protection des consommateurs"
 USA_MUSKIE76_Staggs_Railroad_Act:0 "Loi sur les chemins de fer Staggs"
 USA_MUSKIE76_Surface_Transportation_Assistance_Act:0 "Loi sur l'aide au transport de surface"
 USA_MUSKIE76_Bayh_Dole_Act:0 "Loi Bayh Dole"
 USA_MUSKIE76_Comprehensive_Crime_Control_Act:0 "Loi sur la lutte globale contre la criminalité"
 USA_MUSKIE76_Strengthen_Unions:0 "Renforcer les syndicats"
 USA_MUSKIE76_Ban_Mountaintop_Strip_Mining:0 "Interdire l'exploitation minière à ciel ouvert au sommet des montagnes"
 USA_MUSKIE76_CERCLA_Act:0 "Loi CERCLA"
 USA_jfk60_The_Kennedy_Administration:0 "L'administration Kennedy"
 USA_jfk60_The_Kennedy_Administration_desc:0 "Jeune et charismatique, John F. Kennedy a été choisi président des États-Unis lors des élections de 1960. Démocrate, Kennedy est le premier catholique romain à remporter les élections générales. "
 USA_jfk60_Betray_Organized_Crime:0 "Trahir le crime organisé"
 USA_jfk60_Betray_Organized_Crime_desc:0 "Alors que beaucoup s'attendaient à ce qu'il laisse la mafia tranquille, JFK va à l'encontre des prédictions des experts et s'en prend aux gangs criminels en prévoyant une nouvelle série d'enquêtes."
 USA_jfk60_Establish_the_Peace_Corps:0 "Créer le Corps de la Paix"
 USA_jfk60_Establish_the_Peace_Corps_desc:0 "Nous devons promouvoir la démocratie et les valeurs américaines à travers le monde d'une manière nouvelle et non violente, et le Peace Corps y parviendra. Nous enverrons le meilleur de nos jeunes hommes et femmes à l'étranger pour aider et développer les pays du tiers monde."
 USA_jfk60_Area_Redevelopment_Act:0 "Loi sur le réaménagement de la zone"
 USA_jfk60_Area_Redevelopment_Act_desc:0 " La loi sur le réaménagement des zones établira une administration du même nom, dont le rôle sera d'aider les zones rurales pauvres, en particulier les Appalaches, à développer les infrastructures et les ressources locales. "
 USA_jfk60_Increase_the_Minimum_Wage:0 "Augmenter le salaire minimum"
 USA_jfk60_Increase_the_Minimum_Wage_desc:0 "Le salaire minimum, bien qu'il ne soit pas trop bas, est encore loin d'être suffisant pour permettre à ceux qui le perçoivent de survivre dans notre système économique moderne et en pleine croissance. Nous devons l'augmenter."
 USA_jfk60_Invest_in_Appalachia:0 "Investir dans la région des Appalaches"
 USA_jfk60_Invest_in_Appalachia_desc:0 "Bien que déjà ciblées par l'Area Redevelopment Act, les Appalaches sont la région la plus pauvre d'Amérique et ont besoin de tous les fonds et investissements possibles."
 USA_jfk60_Drug_Efficacy_Amendment:0 "Amendement sur l'efficacité des médicaments"
 USA_jfk60_Drug_Efficacy_Amendment_desc:0 "Modification de l'ancienne loi fédérale sur les aliments, les médicaments et les cosmétiques, la DEA introduit l'obligation pour les entreprises de fournir la preuve que leur produit fonctionne réellement en toute sécurité comme prévu avant de pouvoir le vendre."
 USA_jfk60_Foreign_Assistance_Act_of_1961:0 "Loi sur l'aide étrangère de 1961"
 USA_jfk60_Foreign_Assistance_Act_of_1961_desc:0 "Cette loi restructure nos programmes d'aide internationale, en classant les fonds en paquets militaires et non militaires. Une nouvelle Agence pour le développement international (USAID) supervisera les programmes économiques."
 USA_jfk60_Manpower_Development_and_Training_Act:0 "Loi sur le développement et la formation de la main-d'oeuvre"
 USA_jfk60_Manpower_Development_and_Training_Act_desc:0 "Notre réserve de main-d'oeuvre, tant pour la main-d'oeuvre que pour nos militaires, est limitée, et nous devons veiller à tirer le meilleur parti possible de chaque homme ou femme."
 USA_jfk60_Migration_and_Refugee_Assistance_Act:0 "Loi sur la migration et l'aide aux réfugiés"
 USA_jfk60_Migration_and_Refugee_Assistance_Act_desc:0 "La loi sur la migration et l'assistance aux réfugiés est censée répondre aux besoins inattendus et urgents des réfugiés, des personnes déplacées, des victimes de conflits et d'autres personnes à risque dans le monde."
 USA_jfk60_Deploy_Troops_to_Ole_Miss:0 "Déployer des troupes à Ole Miss"
 USA_jfk60_Deploy_Troops_to_Ole_Miss_desc:0 "Les étudiants d'Ole Miss, après tout ce qui s'est passé avec Little Rock 9 et le mouvement des droits civiques, ont déclenché des émeutes pour protester contre l'inscription des étudiants noirs, et des gens sont tués. Il est temps d'envoyer l'armée."
 USA_jfk60_Executive_Order_11063:0 "Décret n°11063"
 USA_jfk60_Executive_Order_11063_desc:0 "Ce décret interdit la discrimination dans toute sorte de transaction ou d'interaction impliquant le logement fédéral."
 USA_jfk60_Fund_the_Apollo_Program:0 "Financer le programme Apollo"
 USA_jfk60_Fund_the_Apollo_Program_desc:0 "\"Nous choisissons d'aller sur la Lune au cours de cette décennie et de faire d'autres choses, non pas parce qu'elles sont faciles, mais parce qu'elles sont difficiles...\" \n Avec ces mots, notre président a annoncé à la nation que nous atteindrons la Lune avant la fin de la décennie. Bonne chance NASA!"
 USA_jfk60_Equal_Pay_Act:0 "Loi sur l'égalité de rémunération"
 USA_jfk60_Equal_Pay_Act_desc:0 "Dans le prochain d'une série interminable d'amendements à la loi sur les normes de travail équitables, la loi sur l'égalité de rémunération tentera d'abolir l'écart salarial entre les sexes, ainsi que d'attaquer d'autres domaines de discrimination sexuelle."
 USA_jfk60_Clean_Air_Act:0 "Loi sur la qualité de l'air"
 USA_jfk60_Clean_Air_Act_desc:0 "Le Clean Air Act est une loi nationale visant à contrôler et éliminer la pollution de l'air. Un nouveau programme de service de santé publique le supervisera et davantage de recherches dans des domaines connexes seront financées."
 USA_jfk60_Federal_Transit_Act:0 "Loi fédérale sur les transports en commun"
 USA_jfk60_Federal_Transit_Act_desc:0 "La loi sur les transports urbains de masse de 1964 fournira 375 millions de dollars pour des projets ferroviaires publics ou privés urbains à grande échelle sous la forme de fonds de contrepartie versés aux villes et aux États."
 USA_jfk60_Civil_Rights_Act_of_1964:0 "Loi sur les droits civiques de 1964"
 USA_jfk60_Civil_Rights_Act_of_1964_desc:0 "Le Civil Rights Act de 1964 interdit la discrimination fondée sur la race, la couleur, la religion, le sexe ou l'origine nationale. Il interdit également l'application inégale des exigences d'inscription des électeurs et la ségrégation raciale dans les écoles, l'emploi et les lieux publics."
 USA_jfk60_Revenue_Act_of_1964:0 "Loi sur les revenus de 1964"
 USA_jfk60_Revenue_Act_of_1964_desc:0 "Le Revenue Act de 1964 réduira l'impôt fédéral sur le revenu d'environ vingt pour cent dans tous les domaines, et abaissera le taux d'imposition fédéral le plus élevé de 91 pour cent à 70 pour cent."
 USA_jfk60_Food_Stamp_Act:0 "Loi sur les bons d'alimentation"
 USA_jfk60_Food_Stamp_Act_desc:0 "La loi sur les bons d'alimentation fournira une autorité législative permanente au programme de bons d'alimentation, qui avait été introduit il y a quelques années à titre temporaire et qui a connu un énorme succès."
 USA_jfk60_Rollback_Steel_Prices:0 "Faire reculer les prix de l'acier"
 USA_jfk60_Rollback_Steel_Prices_desc:0 "Depuis la Seconde Guerre mondiale et les conflits les plus récents, le prix de l'acier est très élevé pour tout le monde, mais surtout pour les entreprises civiles. Il est temps de les redescendre."
 USA_jfk60_Economic_Opportunity_Act:0 "Loi sur les opportunités économiques"
