 USA_EISENHOWER_The_Eisenhower_Administration:0 "L'administration Eisenhower"
 USA_EISENHOWER_The_Eisenhower_Administration_desc:0 "L'ancien chef du SHAEF et architecte du Débarquement est passé du soldat à une carrière politique et se retrouve désormais à la tête du gouvernement américain. Aimez-vous Ike? Parce que l'électorat semble le faire !"
 USA_EISENHOWER_Balance_the_Budget:0 "Équilibrer le budget"
 USA_EISENHOWER_Balance_the_Budget_desc:0 "Même si ce n'est pas la chose la plus amusante à faire, le budget fédéral doit être maîtrisé. Il est hors de contrôle, l'argent circule partout, apparemment au hasard. Il faut faire quelque chose à ce sujet."
 USA_EISENHOWER_Refugee_Relief_Ac:0 "Loi sur l'aide aux réfugiés"
 USA_EISENHOWER_Refugee_Relief_Ac_desc:0 "Il y a tellement de réfugiés qui fuient derrière le rideau de fer. Nous devons promulguer une législation qui leur permet d'entrer dans le pays, de peur qu'ils ne soient contraints de retourner dans la prison communiste d'où ils se sont enfuis."
 USA_EISENHOWER_Social_Security_Act_of_1953:0 "Loi sur la sécurité sociale de 1953"
 USA_EISENHOWER_Social_Security_Act_of_1953_desc:0 "Le SSA de 1953 augmentera les prestations versées aux personnes âgées et aux survivants, étendra les crédits de salaire pour le service militaire et mettra davantage de fonds à la disposition du gouvernement fédéral."
 USA_EISENHOWER_Communist_Control_Act:0 "Loi sur le contrôle communiste"
 USA_EISENHOWER_Communist_Control_Act_desc:0 "La loi sur le contrôle communiste interdira le parti communiste, une décision attendue depuis longtemps. Cela criminalisera également l'adhésion ou le soutien à un parti ou à d'autres groupes considérés comme communistes par le procureur général des États-Unis."
 USA_EISENHOWER_National_Firearms_Act:0 "Loi nationale sur les armes à feu"
 USA_EISENHOWER_National_Firearms_Act_desc:0 "La loi nationale sur les armes à feu tentera de renforcer la loi fédérale sur les armes à feu de 1938, qui interdisait la possession d'armes lourdes comme les mitrailleuses et exigeait l'enregistrement des propriétaires auprès d'un bureau fédéral."
 USA_EISENHOWER_Sabotage_the_Army_McCarthy_Hearings:0 "Saboter les audiences de McCarthy dans l'armée"
 USA_EISENHOWER_Sabotage_the_Army_McCarthy_Hearings_desc:0 "McCarthy est peut-être allé trop loin dans sa tentative de purger le gouvernement des communistes, mais ce procès devient un peu incontrôlable. Après tout, McCarthy est républicain et vote dans notre sens. Nous devrions essayer de trouver tous les défauts possibles avec ses examinateurs."
 USA_EISENHOWER_Small_Buisness_Act:0 "Loi sur les petites entreprises"
 USA_EISENHOWER_Small_Buisness_Act_desc:0 "Les petites entreprises sont vitales pour presque toutes les villes, quelle que soit la taille de la population qu'elles servent. Alors que les grandes entreprises deviennent de plus en plus puissantes, nous devons veiller à ce que les petites entreprises soient protégées."
 USA_EISENHOWER_Multiple_Mineral_Development_Act:0 "Loi sur l'exploitation minière multiple"
 USA_EISENHOWER_Multiple_Mineral_Development_Act_desc:0 "La Loi sur le développement minier multiple est un amendement à la Loi générale sur les mines de 1872. Elle permettra le développement et l'exploitation minière de plusieurs minéraux sur la même étendue de terre."
 USA_EISENHOWER_Agricultural_Act_of_1954:0 "Loi agricole de 1954"
 USA_EISENHOWER_Agricultural_Act_of_1954_desc:0 "La loi agricole de 1954 créera une société de crédit sur matières premières chargée d'apporter une aide agricole à l'étranger et au pays, ainsi que de mettre en place des contrôles de prix et des soutiens flexibles pour les produits agricoles."
 USA_EISENHOWER_Federal_National_Mortgage_Association_Charter_Act:0 "Loi sur la Charte de la Federal National Mortgage Association"
 USA_EISENHOWER_Federal_National_Mortgage_Association_Charter_Act_desc:0 "La FNMACA va réorganiser la FNMA (connue familièrement sous le nom de Fannie Mae) pour mieux aider le marché hypothécaire secondaire et ses investisseurs."
 USA_EISENHOWER_Enforce_Brown_vs_Board_of_Education:0 "Appliquer Brown contre le conseil scolaire"
 USA_EISENHOWER_Enforce_Brown_vs_Board_of_Education_desc:0 "La Cour suprême a statué que la ségrégation scolaire est inconstitutionnelle, mais de nombreux gouverneurs et systèmes scolaires refusent de le faire. C'est un scandale et ils doivent apprendre une fois pour toutes que tous les hommes sont créés égaux."
 USA_EISENHOWER_National_Housing_Act_of_1955:0 "Loi nationale sur le logement de 1955"
 USA_EISENHOWER_National_Housing_Act_of_1955_desc:0 "La loi nationale sur le logement de 1955 financera la construction de 140 000 logements à la place des bidonvilles qui seront rasés."
 USA_EISENHOWER_Internal_Revenue_Code_of_1954:0 "Code des impôts de 1954"
 USA_EISENHOWER_Internal_Revenue_Code_of_1954_desc:0 "L'Internal Revenue Code de 1954 sera la première refonte majeure de notre système fiscal depuis sa création en 1913. Il y a tellement de lacunes et de faiblesses dans le code que nous ne pouvons pas les laisser en suspens plus longtemps."
 USA_EISENHOWER_Career_Incentive_Act:0 "Loi sur l'incitation à la carrière"
 USA_EISENHOWER_Career_Incentive_Act_desc:0 "La loi sur l'incitation à la carrière fera exactement ce que son nom est : encourager le service militaire de carrière pour ceux qui ont été enrôlés pour la guerre de Corée et sont sur le point de terminer leur mandat."
 USA_EISENHOWER_Fish_and_Wildlife_Act:0 "Loi sur la pêche et la faune"
 USA_EISENHOWER_Fish_and_Wildlife_Act_desc:0 "L'objectif de la FWA est de réglementer l'industrie de la pêche commerciale, de créer une politique concernant les poissons et les fruits de mer, d'augmenter les possibilités publiques de pêche et d'accroître la recherche sur les questions liées aux poissons et à la faune."
 USA_EISENHOWER_Interstate_Highway_Act_of_1955:0 "Loi sur les autoroutes interétatiques de 1955"
 USA_EISENHOWER_Interstate_Highway_Act_of_1955_desc:0 "L'Interstate Highway Act de 1955 autorisera l'utilisation de 25 milliards de dollars pour la construction de 41 000 milles d'autoroutes à travers l'Amérique. Bien qu'Eisenhower ait prévu que le système interétatique facilite le mouvement des troupes à travers le pays, les civils y auront également accès, avec tous les avantages économiques que cela implique."
 USA_EISENHOWER_Modernize_the_Postal_Service:0 "Moderniser le service postal"
 USA_EISENHOWER_Modernize_the_Postal_Service_desc:0 "Le service postal est un élément crucial du bon fonctionnement de notre pays, et pourtant il est largement dépassé, s'appuyant même encore sur les chevaux dans certaines régions éloignées. Nous devons le mettre à la hauteur de nos normes modernes du milieu du XXe siècle."
 USA_EISENHOWER_Health_Research_Facilities_Act:0 "Loi sur les établissements de recherche en santé"
 USA_EISENHOWER_Health_Research_Facilities_Act_desc:0 "La création de grands centres de recherche en santé, tels que l'Institut national de la santé (NIH) près de Washington, D.C., améliorera notre capacité à étudier les maladies avancées et à produire des remèdes de haute technologie."
 USA_EISENHOWER_The_Space_Race:0 "La course à l'espace"
 USA_EISENHOWER_The_Space_Race_desc:0 "Espace - La dernière frontière ! Il a toujours captivé notre imagination et, grâce aux nouveaux développements, il sera bientôt à notre portée. Nous devons cependant suivre le rythme des Soviétiques, car ils semblent avoir l'avantage dans ce domaine."
 USA_EISENHOWER_Air_Pollution_Control_Act:0 "Loi sur le contrôle de la pollution atmosphérique"
 USA_EISENHOWER_Air_Pollution_Control_Act_desc:0 "La loi sur le contrôle de la pollution atmosphérique est conçue pour fournir des recherches et une assistance technique liées au contrôle de la pollution atmosphérique, ainsi que pour réglementer les émissions des voitures et des usines."
 USA_EISENHOWER56_The_Eisenhower_Administration_1956:0 "L'administration Eisenhower"
 USA_EISENHOWER56_The_Eisenhower_Administration_1956_desc:0 "Dwight D. Eisenhower a remporté l'élection présidentielle de 1956, battant de manière convaincante son homologue démocrate. Cependant, il devra surmonter son appartenance à une minorité à la Chambre et au Sénat."
 USA_EISENHOWER_Economic_Prosperity:0 "Prospérité économique"
 USA_EISENHOWER_Economic_Prosperity_desc:0 "Notre économie est la plus forte au monde, et nos citoyens le savent. Nous proposons le plus grand nombre de produits de consommation, les meilleurs services et il y en a pour tous les goûts. Ceci est extrêmement bénéfique et donnera d'excellents résultats."
 USA_EISENHOWER_Establish_NASA:0 "Créer la NASA"
 USA_EISENHOWER_Establish_NASA_desc:0 "Avec de nouvelles avancées dans le domaine technologique de l'espace et des fusées chaque jour, il est temps que nous créions une agence gouvernementale officielle pour gérer ces choses. La National Aeronautics and Space Administration contribuera à rationaliser et à cibler notre processus de recherche."
 USA_EISENHOWER_Airways_Modernization_Act:0 "Loi sur la modernisation des voies aériennes"
 USA_EISENHOWER_Airways_Modernization_Act_desc:0 "il y a 1 an, le 30 juin, il y a eu un horrible accident impliquant 2 avions de passagers au-dessus de l'espace aérien non réglementé au-dessus du Grand Canyon. En adoptant la loi sur la modernisation des voies aériennes, nous pouvons garantir que cela ne se reproduise plus."
 USA_EISENHOWER_Civil_Rights_Act_of_1957:0 "Loi sur les droits civiques de 1957"
 USA_EISENHOWER_Civil_Rights_Act_of_1957_desc:0 "Depuis 1875, chaque fois qu'une loi sur les droits civils a été introduite, elle a été rejetée. Cependant, cela ne signifie pas que nous pouvons accepter l'état actuel des droits des Afro-Américains. Il est temps d'essayer de faire adopter une autre loi sur les droits civiques au Congrès."
 USA_EISENHOWER_Deploy_the_Army_to_Little_Rock:0 "Déployer l'armée à Little Rock"
 USA_EISENHOWER_Deploy_the_Army_to_Little_Rock_desc:0 "Malgré le résultat de l'affaire Brown contre Board of Education et le récent Civil Rights Act, le gouverneur de l'Arkansas, Orval Faubus, refuse de déségréger le Little Rock Central High School. Nous devons fédéraliser la Garde nationale qui arrête les étudiants et leur faire escorter le Little Rock 9 en lieu sûr."
 USA_EISENHOWER_National_Defense_Education_Act:0 "Loi sur l'éducation de la Défense nationale"
 USA_EISENHOWER_National_Defense_Education_Act_desc:0 "Nous devons améliorer les programmes scientifiques de nos systèmes scolaires afin que nos futurs chimistes et physiciens aient une meilleure expérience dans ces domaines cruciaux. La NDEA distribuera des fonds aux programmes scientifiques à travers l'Amérique."
 USA_EISENHOWER_Price_Anderson_Nuclear_Industries_Indemnity_Act:0 "Loi sur l'indemnisation des industries nucléaires de Price Anderson"
 USA_EISENHOWER_Price_Anderson_Nuclear_Industries_Indemnity_Act_desc:0 "Les industries nucléaires - centrales électriques et autres services - sont intrinsèquement dangereuses. Nous devons garantir que la population civile puisse recevoir une indemnisation en cas d'incident et que les entreprises soient partiellement protégées contre les poursuites en responsabilité."
 USA_EISENHOWER_Establish_ARPA:0 "Établir l'ARPA"
 USA_EISENHOWER_Establish_ARPA_desc:0 "Les Soviétiques, avec le lancement de Spoutnik, ont prouvé à quel point ils étaient en avance dans les domaines avancés de la recherche, et nous ne pouvons pas nous permettre de prendre davantage de retard. L'ARPA, ou Advanced Research Projects Agency, nous servira à cela."
 USA_EISENHOWER_Federal_Aviation_Act:0 "Loi fédérale sur l'aviation"
 USA_EISENHOWER_Federal_Aviation_Act_desc:0 "Faisant suite à la loi sur la modernisation des voies aériennes de 1957, la loi fédérale sur l'aviation réglementera et structurera davantage le ciel convivial en créant la Federal Aviation Administration."
 USA_EISENHOWER_Transportation_Act:0 "Loi sur les transports"
 USA_EISENHOWER_Transportation_Act_desc:0 "En raison de notre tout nouveau réseau d'autoroutes, les chemins de fer, déjà en difficulté à cause des compagnies aériennes, se portent encore plus mal. La loi sur les transports autorisera l'ICC à prêter de l'argent aux chemins de fer et à fixer les prix pour tenter de les revigorer."
 USA_EISENHOWER_Narcotics_Manufacturing_Act:0 "Loi sur la fabrication de stupéfiants"
 USA_EISENHOWER_Narcotics_Manufacturing_Act_desc:0 "Bien que nous ayons adopté des lois et des conventions antérieures concernant les drogues illégales, nous devons réaffirmer notre engagement à leur égard et créer davantage de mesures dissuasives contre la fabrication de ces drogues. La NMA accomplira ces deux objectifs."
 USA_EISENHOWER_The_Lessons_of_Defeat:0 "Les leçons de la défaite"
 USA_EISENHOWER_The_Lessons_of_Defeat_desc:0 "Au cours des dernières années, notre peuple, conditionné à la victoire après les guerres mondiales, a commencé à ressentir le goût amer de la défaite après nos revers en Corée. Cependant, ce n'est pas entièrement mauvais, car il y a des leçons et des stratégies différentes à tirer de la défaite et de la victoire."
 USA_EISENHOWER_Department_of_Defense_Reorganization_Act:0 "Loi sur la réorganisation du ministère de la Défense"
 USA_EISENHOWER_Department_of_Defense_Reorganization_Act_desc:0 "Le DODRA rationalisera la chaîne de commandement de notre armée, en déplaçant la prise de décision des départements militaires vers les chefs d'état-major interarmées et le secrétaire à la Défense. Cela créera également une version plus centralisée et plus militaire de l'ARPA, la DARPA."
 USA_EISENHOWER_Admission_of_Alaska_and_Hawaii:0 "Admission de l'Alaska et d'Hawaï"
 USA_EISENHOWER_Admission_of_Alaska_and_Hawaii_desc:0 "Après avoir été des territoires des États-Unis depuis les années 1800, nous avons enfin le soutien du Sénat pour admettre l'Alaska et Hawaï dans l'Union. Nous devrons faire pression pour qu'ils soient acceptés, et l'industrie de la fabrication de drapeaux devra mettre à jour ses conceptions."
 USA_EISENHOWER_The_Airport_Construction_Act:0 "La loi sur la construction d'aéroports"
 USA_EISENHOWER_The_Airport_Construction_Act_desc:0 "Maintenant que nous avons rendu le ciel américain plus sûr, il est temps que davantage de personnes en profitent. La loi sur la construction des aéroports accordera des subventions aux projets aéroportuaires prévus et soutiendra le service continu des aéroports ruraux."
 USA_EISENHOWER_Solve_the_Missle_Gap:0 "Résoudre le déficit de missiles"
 USA_EISENHOWER_Solve_the_Missle_Gap_desc:0 "Il semble que les Soviétiques soient à des années-lumière en matière de technologie des missiles, au point même que cela devient une plaisanterie internationale. Nous devons redoubler d'efforts et combler le fossé technologique avant que les Russes ne nous lancent dans Kingdom Come."
 USA_EISENHOWER_Revise_the_Walsh_Healey_Contracts_Act:0 "Réviser la loi sur les contrats Walsh Healey"
 USA_EISENHOWER_Revise_the_Walsh_Healey_Contracts_Act_desc:0 "La loi Walsh Healey sur les contrats de 1937 a fixé le salaire de base pour les heures normales et les heures supplémentaires pour les employés civils travaillant sous contrat gouvernemental et a été conçue pour améliorer les normes du travail. C'est plus qu'un peu dépassé et quelques changements doivent être apportés."
 USA_EISENHOWER_The_Explorers_Program:0 "Le programme des explorateurs"
 USA_EISENHOWER_The_Explorers_Program_desc:0 "Le programme Explorers est un projet spatial de la NASA qui mènera des expériences et collectera des informations sur la physique dans l'espace. L'Explorer 1, la première fusée de mission alignée, atteindra, espérons-le, l'orbite."
 USA_EISENHOWER_Landrum_Griffin_ACt:0 "Loi sur Landrum Griffin"
 USA_EISENHOWER_Landrum_Griffin_ACt_desc:0 "Récemment, de nouvelles révélations ont été faites concernant la corruption et les mauvaises pratiques au sein des syndicats. La loi Landrum-Griffin réglementera les affaires internes des syndicats et exigera qu'ils fassent rapport au ministère du Travail pour résoudre ce problème."
 USA_EISENHOWER_Civil_Rights_Act_of_1960:0 "Loi sur les droits civiques de 1960"
 USA_EISENHOWER_Civil_Rights_Act_of_1960_desc:0 "Même après tous nos efforts, il existe encore de nombreuses lois et pratiques discriminatoires destinées à empêcher les Afro-Américains et les Hispaniques de voter, en particulier dans le Sud. Cette loi sur les droits civils établira une inspection fédérale des listes électorales et introduira des sanctions en cas d'obstruction des électeurs pour contrer ces lois."
 USA_70s_Advanced_Cruise_Missle_Development:0 "Développement avancé de missiles de croisière"
 USA_70s_Improve_Missle_Launch_Awareness:0 "Améliorer la sensibilisation au lancement de missiles"
