 ##stop putting shit in air disasters
 mic_expansion:0 "Expansion du complexe militaro-industriel"
 unificaiton_elections_vie_veto:0 "Le Sud-Vietnam a opposé son veto aux élections de réunification"
 USA_Operation_Paperclip:0 "Opération Trombone"
 USA_Operation_Paperclip_desc:0 "Bien qu'il semble quelque peu déplaisant de s'appuyer sur nos anciens ennemis, Wernher Von Braun et ses collègues scientifiques allemands sont les meilleurs dans ce qu'ils font - et nous avons besoin des meilleurs hommes pour travailler sur notre programme de missiles balistiques."
 USA_Advanced_Military_Projects:0 "Projets militaires avancés"
 USA_Advanced_Military_Projects_desc:0 "De nouvelles découvertes sont faites chaque jour dans le domaine de la recherche militaire, et nous serions insensés de ne pas en profiter. Nous devrions augmenter notre financement de la recherche militaire."
 USA_Early_Ballistic_Missle_Developments:0 "Premiers développements de missiles balistiques"
 USA_Early_Ballistic_Missle_Developments_desc:0 "Même s'il en est encore à ses balbutiements, notre programme de missiles réalise des progrès stupéfiants. Nous devons bien utiliser ces nouvelles connaissances et les mettre à l'épreuve. "
 USA_Atlas_Program:0 "Programme Atlas"
 USA_Atlas_Program_desc:0 "Un nouvel ICBM et une nouvelle fusée spatiale sont en cours de développement par la division Convair de GM appelé Atlas, et ce sera le plus gros jamais lancé lors de son premier lancement. Non seulement il peut transporter une ogive nucléaire, mais il est également capable de transporter un homme en orbite autour de la Terre."
 USA_Castle_Bravo:0 "Château Bravo"
 USA_Castle_Bravo_desc:0 "Castle Bravo sera la première de nos bombes thermonucléaires utilisant du lithium deutéride. C'est, à l'heure actuelle, l'arme la plus meurtrière jamais fabriquée. Les Soviétiques n'oseront plus nous croiser maintenant !"
 USA_Condemn_British_Imperialism:0 "Condamner l'impérialisme britannique"
 USA_Condemn_British_Imperialism_desc:0 "La Grande-Bretagne continue de soutenir le régime Pahlavi uniquement dans son propre intérêt impérialiste. Nous devons intensifier nos efforts et mettre un terme à cette situation pour accroître l'indépendance de l'Iran."
 USA_Foriegn_Aid_to_Iran:0 "Aide étrangère à l'Iran"
 USA_Foriegn_Aid_to_Iran_desc:0 "Malgré sa taille et sa population, l'Iran est terriblement sous-développé. Lui envoyer des fonds ne pourrait que profiter à nous deux."
 USA_Redevelopment_of_the_Iranian_Armed_Forces:0 "Réaménagement des forces armées iraniennes"
 USA_Redevelopment_of_the_Iranian_Armed_Forces_desc:0 "En plus de sa petite économie, l'Iran dispose également d'une armée obsolète. La restructuration et le réapprovisionnement de ses divisions sont nécessaires pour l'adapter à la guerre moderne."
 USA_The_Hungarian_Revolution:0 "La révolution hongroise"
 USA_The_Hungarian_Revolution_desc:0 "Le peuple hongrois a enfin vu la lumière et les promesses de la démocratie. Cependant, comme prévu, les Soviétiques répriment les dissidents et occupent la capitale et les campagnes environnantes. Devons-nous laisser passer cela et simplement protester, ou risquons-nous de déclencher une troisième guerre mondiale en lançant un ultimatum de retrait, ou bien ?"
 USA_Diplomatic_Objections:0 "Objections diplomatiques"
 USA_Diplomatic_Objections_desc:0 "Eh bien, ce serait bien d'avoir un bastion de la démocratie au plus profond du rideau de fer, il vaut mieux maintenir la paix que risquer la guerre. Envoyer une objection est tout ce que nous pouvons faire, et nous devrons surveiller et attendre un autre moment pour frapper le communisme."
 USA_Ultimatum_to_the_Soviets:0 "Ultimatum aux Soviétiques"
 USA_Ultimatum_to_the_Soviets_desc:0 "Les Soviétiques sont allés trop loin ! Ils ont promis de ne pas s'immiscer dans les affaires des autres pays dès 1944, et l'ont violé à maintes reprises. Il est de notre devoir d'assurer la survie du régime démocratique hongrois, et nous dirons aux Soviétiques de reculer, sinon ce sera la guerre."
 USA_Democracy_Restored_in_Hungary:0 "La démocratie restaurée en Hongrie"
 USA_Democracy_Restored_in_Hungary_desc:0 "Les Soviétiques ont reculé ! Toutes nos stratégies de la corde raide au cours de la semaine dernière ont porté leurs fruits. La Hongrie a désormais à nouveau un gouvernement démocrate et le rideau de fer est enfin fissuré. Qui sait combien de temps durera le reste après cela ?"
 USA_Back_Down:0 "Reculer"
 USA_Back_Down_desc:0 "Les esprits plus calmes ont prévalu et nous ont montré qu'il n'était peut-être pas judicieux de risquer la guerre et notre destruction à cause de la Hongrie. Eh bien, nous allons perdre la face et être embarrassés à l'échelle mondiale, la survie vaut mieux que la fierté."
 USA_The_Final_Struggle:0 "La lutte finale"
 USA_The_Final_Struggle_desc:0 "C'est ça. Les Soviétiques ont refusé de retirer leur occupation de la Hongrie, ce que nous ne pouvons pas ignorer comme nous l'avons fait par le passé. Afin de protéger la liberté et la démocratie, nous n'avons d'autre choix que de déclarer la guerre. Que Dieu nous protège dans cette terrible lutte pour le sort du monde et de toute l'humanité."
 USA_Arm_Israel_suez:0 "Armer Israël"
 USA_Arm_Israel_suez_desc:0 "Les événements récents ont prouvé qu'Israël est un allié précieux (sinon le seul) au Moyen-Orient. Entouré de voisins hostiles, nous devons veiller à ce qu'il puisse se protéger en cas de besoin. Armer ses forces en est un élément important."
 USA_Support_Colonial_Powers_in_UN:0 "Soutenir les puissances coloniales à l'ONU"
 USA_Support_Colonial_Powers_in_UN_desc:0 "Après une campagne réussie, nos alliés ont repris Suez et repoussé les forces armées égyptiennes. Cependant, cela ne met pas fin au problème. Nous devons nous adresser à l'ONU et régler ce problème une fois pour toutes."
 USA_Support_Britian:0 "Soutenez la Grande-Bretagne"
 USA_Support_Britian_desc:0 "Après de nombreux débats et délibérations, nous avons décidé de soutenir nos alliés traditionnels dans la crise de Suez. Espérons qu'ils pourront reprendre le Sinaï et le Canal sans trop de problèmes et que le Moyen-Orient se calmera à nouveau."
 USA_Economic_Aid_For_Korea_and_Japan:0 "Aide économique à la Corée et au Japon"
 USA_Economic_Aid_For_Korea_and_Japan_desc:0 "La Corée et le Japon sont deux des pays démocratiques les plus puissants de l'extrême Pacifique. Nous devrions leur envoyer une aide économique pour garantir qu'ils restent forts et capables de se défendre."
 USA_Recognize_Reality:0 "Reconnaître la réalité"
 USA_Recognize_Reality_desc:0 "Malgré tous nos efforts, la situation en Chine est désespérée et a dépassé le point de non-retour. Les communistes sont tout simplement trop forts pour Chiang Kai-Shek et ses forces nationalistes, et nous ne pouvons pas nous impliquer dans une autre guerre à grande échelle. Malheureusement, il semble que la Chine va passer au rouge."
 USA_Arm_Taiwan:0 "Armer Taïwan"
 USA_Arm_Taiwan_desc:0 "Une grande partie de l'équipement de l'armée nationaliste a été perdue lors de la défaite et de l'évacuation ultérieure de la Chine continentale. Nous devons réarmer la République de Taiwan afin qu'elle puisse continuer à soutenir ses forces armées."
 USA_Closer_Ties_to_MI6:0 "Des liens plus étroits avec le MI6"
 USA_Outreach_to_Ho_Chi_Minh:0 "Sensibilisation à Ho Chi Minh"
 USA_Outreach_to_Ho_Chi_Minh_desc:0 "Ho Chi Minh et sa République démocratique du Vietnam ont vaincu les forces colonialistes françaises. Plutôt que de laisser le pays glisser dans la sphère d'influence soviétique, nous devrions essayer de prendre contact avec lui pour voir si nous pouvons trouver une solution au problème des deux États."
 USA_The_Unification_of_Vietnam:0 "L'unification du Vietnam"
 USA_The_Unification_of_Vietnam_desc:0 "Les négociations avec Hô Chi Minh et le Sud-Vietnam ont été un succès ! Il est temps pour nous de fusionner les deux États et de former un Vietnam fort, uni et indépendant."
 USA_Finlandization_of_Vietnam:0 "Finlandisation du Vietnam"
 USA_Finlandization_of_Vietnam_desc:0 "Hô Chi Minh a accepté de faire des compromis, mais il reste, dans l'âme, communiste. Afin d'être sûr qu'il ne rejoindra pas le Pacte de Varsovie dès que nous détournerons le regard, nous devrions finlandiser le pays - faire en sorte que le Vietnam déclare sa neutralité afin que personne n'intervienne et qu'il s'occupe de ses propres affaires."
 USA_Arm_Lebanon:0 "Armer le Liban"
 USA_Arm_Lebanon_desc:0 "Même s'il n'est pas dans une position aussi précaire que Hussein, le gouvernement libanais n'a toujours pas de gâteau devant lui. En soutenant son armée de la même manière que celle de la Jordanie, nous pouvons garantir qu'elle puisse protéger le Liban des menaces nasséristes."
 USA_Support_Nasser:0 "Soutenez Nasser"
 USA_Support_Nasser_desc:0 "Nasser apporte une bouffée d'air frais à l'Egypte, et bien il n'est peut-être pas aussi pro-démocratie qu'on l'aurait souhaité, il n'est pas communiste. En le soutenant, nous pouvons garantir qu'il le reste."
 USA_Fund_the_Aswan_Dam:0 "Financer le barrage d'Assouan"
 USA_Fund_the_Aswan_Dam_desc:0 "Le barrage d'Assouan fera des miracles pour les agriculteurs égyptiens et pour l'économie en général. Cela générera une grande quantité d'électricité, répandra de l'eau dans tout le désert et constituera également une énorme victoire en matière de relations publiques pour nous deux. Tout ce que nous devons faire, c'est envoyer les fonds."
 #stop putting shit in air disasters
 USA_TRUMAN_The_Truman_Administration:0 "L'administration Truman"
 USA_TRUMAN_The_Truman_Administration_desc:0 "La première administration du président Truman se concentrera sur l'amélioration de la stabilité et de la sécurité intérieures, ainsi que sur la poursuite de certains programmes et politiques du défunt président Roosevelt."
 USA_TRUMAN_Fair_Labor_Standards_Amendment:0 "Amendement aux normes de travail équitables"
 USA_TRUMAN_Fair_Labor_Standards_Amendment_desc:0 "Le Fair Labor Standards Amendment modifiera la loi de 1938 en augmentant le salaire minimum et en étendant les lois sur la protection du travail des enfants."
 USA_TRUMAN_Central_Intelligence_Agency_Act:0 "Loi sur l'Agence centrale de renseignement"
 USA_TRUMAN_Central_Intelligence_Agency_Act_desc:0 "La loi sur la CIA fera essentiellement de la CIA une branche gouvernementale presque indépendante, lui permettant de garder secrets ses dossiers et ses agents, tout en lui accordant des fonds quasi illimités. Passionnant? Oui. Inconstitutionnel? Peut être."
 USA_TRUMAN_Agricultural_Act_of_1949:0 "Loi agricole de 1949"
 USA_TRUMAN_Agricultural_Act_of_1949_desc:0 "La loi agricole de 1949 permettra le don des excédents alimentaires aux pays qui en ont besoin et fournira une assistance aux États pour la mise en place de programmes de cantines scolaires."
 USA_TRUMAN_Omnibus_Medical_Research_Act:0 "Loi omnibus sur la recherche médicale"
 USA_TRUMAN_Omnibus_Medical_Research_Act_desc:0 "La loi omnibus sur la recherche médicale créera le NIAMD, ou National Institute of Arthritis and Metabolic Diseases. Il autorisera également le chirurgien général à former un programme consultatif national."
 USA_TRUMAN_Defense_Production_Act_of_1950:0 "Loi sur la production de défense de 1950"
 USA_TRUMAN_Defense_Production_Act_of_1950_desc:0 "En réponse au déclenchement de la guerre de Corée, nous devrions adopter le DPA. Il permet au président Truman d'interdire la thésaurisation et les prix abusifs, de forcer les entreprises à donner la priorité aux produits et contrats militaires et à réquisitionner des biens, entre autres choses. Cela permet également au DOD d'accorder des prêts sans intérêt pour aider les entreprises essentielles à l'effort de guerre."
 USA_TRUMAN_Housing_Act:0 "Loi sur le logement"
 USA_TRUMAN_Housing_Act_desc:0 "La loi sur le logement fournira des fonds pour l'élimination des bidonvilles et la rénovation urbaine. Il accorde également davantage d'autorisations aux programmes fédéraux d'hypothèques et davantage de financement à la recherche sur les techniques de construction."
 USA_TRUMAN_National_Science_Foundation_Act:0 "Loi sur la Fondation nationale de la science"
 USA_TRUMAN_National_Science_Foundation_Act_desc:0 "La loi NSF créera la NSF, une agence gouvernementale indépendante qui promeut et soutient tous les domaines de la recherche, des mathématiques et de l'informatique aux sciences sociales et économiques."
 USA_TRUMAN_The_Kefauver_Hearings:0 "Les audiences Kefauver"
 USA_TRUMAN_The_Kefauver_Hearings_desc:0 "Les audiences de Kefauver font partie de l'enquête du Sénat sur le crime organisé dans le commerce interétatique, et le sénateur Estes Kefauver est à la tête de l'enquête. Nous voulons savoir combien d'organisations criminelles existent en Amérique.\nHé... N'est-ce pas le travail du FBI ?"
 USA_TRUMAN_McCarran_Internal_Security_Act:0 "Loi McCarran sur la sécurité intérieure"
 USA_TRUMAN_McCarran_Internal_Security_Act_desc:0 "La loi McCarran sur la sécurité intérieure exigera que les organisations communistes s'enregistrent auprès du procureur général et fournissent des détails sur leurs finances. En outre, il permet au président d'appréhender et de détenir des personnes soupçonnées de conspirer, ou d'être susceptibles de conspirer, de saboter ou d'espionner les États-Unis. \nDe quelle peur rouge parles-tu ? Personne n'a parlé d'une frayeur rouge !"
 USA_TRUMAN_Anti_Merger_Act:0 "Loi anti-fusion"
 USA_TRUMAN_Anti_Merger_Act_desc:0 "La loi anti-fusion comblera une lacune de la loi antitrust Clayton de 1914 qui permettait aux hommes d'affaires d'acheter les actifs d'un concurrent plutôt que d'acheter l'entreprise directement pour obtenir ainsi un monopole. Cela donnera également au gouvernement la possibilité d'empêcher l'intégration verticale et les fusions de conglomérats."
 USA_TRUMAN_Social_Security_Act_of_1950:0 "Loi sur la sécurité sociale de 1950"
 USA_TRUMAN_Social_Security_Act_of_1950_desc:0 "La loi sur la sécurité sociale de 1950 est un autre amendement à la loi originale sur la sécurité sociale de 1935. Elle prolonge la durée de vie de la loi, augmente les prestations pour la première fois et introduit des ajustements au coût de la vie dans le programme."
 USA_TRUMAN_Propose_National_Healthcare_System:0 "Proposer un système de santé national"
 USA_TRUMAN_Propose_National_Healthcare_System_desc:0 "Dans de nombreuses zones rurales et à faibles revenus, il n'y a pas d'hôpitaux, ni même de médecins. De plus, les services de santé publique sont inadéquats et disposent de peu de financements. Ces situations peuvent être améliorées en créant un système national de santé."
 USA_TRUMAN_Crackdown_on_Strikers:0 "Répression contre les grévistes"
 USA_TRUMAN_Crackdown_on_Strikers_desc:0 "Les travailleurs de U.S. Steel et d'autres sociétés sidérurgiques importantes, vitales pour l'économie civile et militaire du pays, envisagent de faire grève. En essayant de nationaliser les usines dans lesquelles ils travaillent, nous pouvons tenter de mettre un terme à la grève avant qu'elle ne commence."
 USA_TRUMAN_Tax_Relief_for_the_Poor:0 "Allégement fiscal pour les pauvres"
 USA_TRUMAN_Tax_Relief_for_the_Poor_desc:0 "Il y a malheureusement beaucoup de pauvres aux États-Unis. En leur accordant des allégements fiscaux, non seulement cela leur donnera, ainsi qu'à leurs familles, une certaine marge de manoeuvre, mais cela leur donnera également plus d'argent à réinvestir dans l'économie."
 USA_TRUMAN_McCarran_Walter_Act:0 "Loi McCarran Walter"
 USA_TRUMAN_McCarran_Walter_Act_desc:0 "La loi McCarran Walter maintiendra le statu quo ethnique du pays et empêchera l'influence déstabilisatrice des communistes, des « intérêts juifs » et d'autres indésirables en créant des quotas d'immigration stricts basés sur l'origine ethnique et la région, ainsi que sur les qualifications professionnelles."
 USA_TRUMAN_Propose_Civil_Rights_Legislation:0 "Proposer une législation sur les droits civiques"
 USA_TRUMAN_Propose_Civil_Rights_Legislation_desc:0 "Après la déségrégation des forces armées, nous pouvons prendre de nombreuses autres mesures pour améliorer les droits des Afro-Américains et gagner leurs votes. Ils sont réprimés dans presque tous les contextes sociaux et les tensions raciales sont vives. Nous devons faire quelque chose à ce sujet."
 USA_TRUMAN_The_McGuire_Act:0 "La loi McGuire"
 USA_TRUMAN_The_McGuire_Act_desc:0 "La loi McGuire étendra la loi Miller-Tydings de 1937, qui permet aux États d'adopter des lois sur le commerce équitable pour protéger les petites entreprises par le biais d'une fixation verticale des prix. Cette exception est nécessaire pour contourner le Sherman Antitrust Act."
 USA_TRUMAN_Expand_Funding_for_Eletrification_Programs:0 "Augmenter le financement des programmes d'électrification"
 USA_TRUMAN_Expand_Funding_for_Eletrification_Programs_desc:0 "De nos jours, l'électricité est absolument essentielle pour tout le monde, partout. Nous sommes en train de répartir le pouvoir à travers le pays, mais nous avons besoin de plus de fonds pour le faire de manière efficace et efficiente."
 USA_TRUMAN_Mutual_Security_Act:0 "Loi sur la sécurité mutuelle"
 USA_TRUMAN_Mutual_Security_Act_desc:0 "La loi sur la sécurité mutuelle de 1951 fait suite à celle de 1949. Elle créera une nouvelle agence chargée de superviser le plan Marshall et de superviser les programmes d'aide étrangère, tant militaire qu'économique, afin de garantir que nous ayons des alliés capables de défendre le monde contre la menace rouge."
 USA_TRUMAN_Calm_Political_Tensions:0 "Apaiser les tensions politiques"
 USA_TRUMAN_Calm_Political_Tensions_desc:0 "Entre tous les communistes, les éléments radicaux et tout simplement l'angoisse face à la guerre froide et à l'orientation de notre pays, les tensions politiques sont vives. Nous devons désamorcer la situation avant que les choses ne deviennent incontrôlables et que de réels dégâts ne surviennent."
 USA_TRUMAN52_The_Truman_Administration:0 "L'administration Truman"
 USA_TRUMAN52_The_Truman_Administration_desc:0 "Pour le deuxième mandat du président Truman, il cherchera à poursuivre les programmes qu'il a commencé à promouvoir en 1948, ainsi qu'à accroître le financement de la recherche et à accroître la stabilité aux États-Unis."
 USA_TRUMAN52_Invest_in_Science:0 "Investir dans la science"
 USA_TRUMAN52_Invest_in_Science_desc:0 "La science est un domaine en plein essor important dans le monde moderne d'aujourd'hui. Nous devrions intensifier nos efforts pour éduquer les gens et accroître leurs possibilités de le faire."
 USA_TRUMAN52_Expand_School_Lunch_Programs:0 "Élargir les programmes de repas scolaires"
 USA_TRUMAN52_Expand_School_Lunch_Programs_desc:0 "L'initiative du programme de repas scolaires a connu un grand succès et s'est avérée vitale pour certains de nos systèmes scolaires les plus ruraux. Nous devrions en tirer parti et accroître le nombre de ces programmes."
 USA_TRUMAN52_Repeal_Taft_Hartley:0 "Abroger Taft Hartley"
 USA_TRUMAN52_Repeal_Taft_Hartley_desc:0 "La loi Taft-Hartley de 1947 restreignait les syndicats et, dans certains cas, les interdisait carrément. Nous pensons que tout le monde devrait être autorisé à se syndiquer aussi facilement que possible, c'est pourquoi nous devrions abroger cette disposition immédiatement."
 USA_TRUMAN52_Social_Security_Act_of_1953:0 "Loi sur la sécurité sociale de 1953"
 USA_TRUMAN52_Social_Security_Act_of_1953_desc:0 "Le SSA de 1953 augmentera les prestations versées aux personnes âgées et aux survivants, étendra les crédits de salaire pour le service militaire et mettra davantage de fonds à la disposition du gouvernement fédéral."
 USA_TRUMAN52_Refugee_Relief_Ac:0 "Loi sur l'aide aux réfugiés"
 USA_TRUMAN52_Refugee_Relief_Ac_desc:0 "De nombreuses personnes dans le monde sont déplacées à cause de conflits violents et cherchent désespérément un endroit où se tourner. Nous devons les aider en leur apportant une aide, à eux et à leurs pays."
 USA_TRUMAN52_Expand_The_Rural_Eletrification_Program:0 "Développer le programme d'électrification rurale"
 USA_TRUMAN52_Expand_The_Rural_Eletrification_Program_desc:0 "Même si nous avons commencé à électrifier les zones rurales, nous sommes loin d'avoir terminé. Nous devons intensifier nos efforts pour répartir le pouvoir dans tout le pays."
 USA_TRUMAN52_Empower_Trade_Unions:0 "Autonomiser les syndicats"
 USA_TRUMAN52_Empower_Trade_Unions_desc:0 "Les syndicats constituent un élément important de notre économie et, depuis trop longtemps, ils ont été mis de côté ou maîtrisés. Nous devons leur donner les moyens d'agir afin que les travailleurs puissent défendre leurs droits."
 USA_TRUMAN52_Small_Buisness_Act:0 "Loi sur les petites entreprises"
 USA_TRUMAN52_Small_Buisness_Act_desc:0 "Les petites entreprises sont vitales pour presque toutes les villes, quelle que soit la taille de la population qu'elles servent. Alors que les grandes entreprises deviennent de plus en plus puissantes, nous devons veiller à ce que les petites entreprises soient protégées."
 USA_TRUMAN52Expand_Medical_Access:0 "Élargir l'accès médical"
 USA_TRUMAN52Expand_Medical_Access_desc:0 "L'accès aux soins de santé et aux hôpitaux est trop important pour être absent ou hors de portée pour de nombreux Américains. Nous devons résoudre ce problème."
 USA_TRUMAN52_Federal_National_Mortgage_Association_Charter_Act:0 "Loi sur la Charte de la Federal National Mortgage Association"
 USA_TRUMAN52_Federal_National_Mortgage_Association_Charter_Act_desc:0 "Chaque famille devrait pouvoir se permettre de vivre dans sa propre maison, mais pour beaucoup, cela coûte trop cher. En créant une Federal Mortgage Association, nous pouvons aider les familles pauvres à trouver un logement."
 USA_TRUMAN52_Enforce_Brown_vs_Board_of_Education:0 "Appliquer Brown contre le conseil scolaire"
 USA_TRUMAN52_Enforce_Brown_vs_Board_of_Education_desc:0 "La Cour suprême a statué que la ségrégation scolaire est inconstitutionnelle, mais de nombreux gouverneurs et systèmes scolaires refusent de le faire. C'est un scandale et ils doivent apprendre une fois pour toutes que tous les hommes sont créés égaux."
 USA_TRUMAN52_Enforce_Fair_Labor_Standards:0 "Appliquer des normes de travail équitables"
 USA_TRUMAN52_Enforce_Fair_Labor_Standards_desc:0 "Malgré l'adoption du précédent amendement sur les normes de travail équitables, il existe toujours un manque important de réglementation dans de nombreuses entreprises aux États-Unis. Nous devons appliquer l'amendement avec un langage plus dur et plus clair."
 USA_TRUMAN52_Internal_Revenue_Code_of_1954:0 "Code des impôts de 1954"
 USA_TRUMAN52_Internal_Revenue_Code_of_1954_desc:0 "L'Internal Revenue Code de 1954 sera la première refonte majeure de notre système fiscal depuis sa création en 1913. Il y a tellement de lacunes et de faiblesses dans le code que nous ne pouvons pas les laisser en suspens plus longtemps."
 USA_TRUMAN52_Begin_Space_Research:0 "Commencer la recherche spatiale"
 USA_TRUMAN52_Begin_Space_Research_desc:0 "Espace - La dernière frontière ! Il a toujours captivé notre imagination et, grâce aux nouveaux développements, il sera bientôt à notre portée. Nous devons immédiatement développer la recherche spatiale."
 USA_TRUMAN52_A_Quarter_Century_of_Progress:0 "Un quart de siècle de progrès"
 USA_TRUMAN52_A_Quarter_Century_of_Progress_desc:0 "Depuis la fin de la Grande Dépression et le début de la Seconde Guerre mondiale, notre économie est devenue la plus forte au monde et sa taille ne cesse de croître. Félicitations à nous !"
 USA_TRUMAN52_Federal_Infrastructure_Reform_Act:0 "Loi sur la réforme des infrastructures fédérales"
 USA_TRUMAN52_Federal_Infrastructure_Reform_Act_desc:0 "La Federal Infrastructure Reform Act réduira les taxes sur l'essence et réduira le programme fédéral d'autoroutes pour se concentrer uniquement sur les projets interétatiques."
 USA_TRUMAN52_Modernize_the_Postal_Service:0 "Moderniser le service postal"
 USA_TRUMAN52_Modernize_the_Postal_Service_desc:0 "Le service postal est un élément crucial du bon fonctionnement de notre pays, et pourtant il est largement dépassé, s'appuyant même encore sur les chevaux dans certaines régions éloignées. Nous devons le mettre à la hauteur de nos normes modernes du milieu du XXe siècle."
 USA_TRUMAN52_Appeal_to_the_Dixiecrats:0 "Appel aux dixiecrates"
 USA_TRUMAN52_Appeal_to_the_Dixiecrats_desc:0 "Les Dixiecrats - ou Démocrates du Sud - constituent une partie importante de la coalition du Parti démocrate. Beaucoup d'entre eux sont plutôt alarmés par toute la déségrégation qui s'opère à travers les États et menacent de quitter le parti. Nous devons leur assurer que nous avons toujours leurs intérêts à coeur."
 USA_TRUMAN52_Expand_Missile_Research:0 "Développer la recherche sur les missiles"
 USA_TRUMAN52_Expand_Missile_Research_desc:0 "La recherche sur les missiles est très importante pour notre capacité à rivaliser avec les Soviétiques dans le ciel, ainsi que pour la livraison d'armes nucléaires. Nous devons maintenir notre programme solide."
 USA_TRUMAN52_Continue_New_Deal_Economic_Policies:0 "Poursuivre les politiques économiques du New Deal"
 USA_TRUMAN52_Continue_New_Deal_Economic_Policies_desc:0 "Dès les années 1930, le défunt président Roosevelt a introduit un nouveau type radical de politique économique : le New Deal. Depuis, cela a fait des merveilles et il est dans notre intérêt de poursuivre les politiques du New Deal."
 #big oof here
 USA_Rocket_Advancements:0 "Avancement de la fusée"
 USA_Rocket_Advancements_desc:0 "Nous devons intensifier nos recherches sur le développement et la conception des fusées. Il s'agit d'un domaine d'étude important et nous ne pouvons pas permettre que nos recherches soient à la traîne de celles des Soviétiques. "
 #big oof
 USA_Suez_Crisis:0 "La crise de Suez"
 USA_Suez_Crisis_desc:0 "L'Égypte a nationalisé le canal de Suez et menace les lignes d'approvisionnement et les routes maritimes d'Israël. Israël, la Grande-Bretagne et la France préparent une contre-offensive. Qui devrions-nous soutenir - Israël ou l'Égypte - ou vaut-il mieux faire profil bas et regarder ce qui se passe ?"
 USA_Formosa_Decleration:0 "Déclaration de Formose"
 USA_Formosa_Decleration_desc:0 "Alors que les choses commençaient à se stabiliser, la RPC a commencé à lancer des raids sur les îles du détroit de Taiwan. Nous devons assurer les nationalistes que nous prendrons leur défense en cas d'aggravation des hostilités et donner au président le pouvoir constitutionnel de le faire."
 USA_Develop_Taiwanese_Industry:0 "Développer l'industrie taïwanaise"
 USA_Develop_Taiwanese_Industry_desc:0 "Taiwan ne représente qu'une fraction de la taille de la Chine continentale, et pourtant c'est tout ce qui reste au gouvernement de Chiang Kai-Shek. Nous devons maximiser son industrie afin que les Taiwanais puissent relancer leur économie au lendemain de la guerre."
 USA_Strengthen_NATO_Members:0 "Renforcer les membres de l'OTAN"
 USA_Elections_of_1956:0 "Élections de 1956"
 USA_Creation_of_the_CIA:0 "Élargir la portée de la CIA"
 USA_Creation_of_the_CIA_desc:0 "La CIA sera une arme cruciale dans la guerre pour la survie de la démocratie dans un avenir proche. Nous devons étendre sa portée et ses capacités afin qu'elle puisse mieux servir nos intérêts à travers le monde."
 USA_The_Free_Officier_Coup:0 "Le coup d'État des officiers libres"
 USA_The_Free_Officier_Coup_desc:0 "Gamel Abdel Nasser et ses acolytes ont renversé le roi Farouk. Reste à savoir si c'est une bonne chose ou non. Mais une chose est claire. Nous pouvons soit reconnaître Nasser et sa nouvelle forme de nationalisme panarabe, soit le rejeter comme étant extrême et fortifier les environs contre lui."
 USA_Arm_Jordan:0 "Armer la Jordanie"
 USA_Arm_Jordan_desc:0 "Le roi Hussein est toujours amical envers nous, pour l'instant. Nous devons agir et stabiliser son régime avant que la propagande nassérienne ne provoque un nouveau coup d'État. Soutenir ses forces loyalistes contribuera grandement à améliorer nos relations et sa position."
 USA_An_Offer_to_Jordan:0 "Une offre à la Jordanie"
 USA_Preparation_for_Honduras_Coup:0 "Préparation du coup d'État au Honduras"
 USA_Preparation_for_Honduras_Coup_desc:0 "Le gouvernement du Honduras s'est montré méfiant ces derniers temps. Des rumeurs circulent selon lesquelles leur législation du travail serait de plus en plus libéralisée et des allégations selon lesquelles des sympathisants communistes infiltreraient le gouvernement. Il existe des éléments conservateurs au Honduras qui souhaitent se débarrasser de ce cabinet crypto-communiste. Peut-être devrions-nous soutenir cette initiative ?"
 USA_Support_the_Pahlavi_Regime:0 "Développer la fabrication d'armes iraniennes"
 USA_Support_the_Pahlavi_Regime_desc:0 "Maintenant que nous avons stabilisé la monarchie Pahlavi, il est temps d'améliorer ses capacités de fabrication d'armes. Le Shah doit être capable de soutenir une armée pour défendre le gouvernement pour lequel nous avons travaillé si dur."
 USA_undermine_Sukarno:0 "Saper Sukarno"
 USA_Launch_Coup_in_Indonesia:0 "Coup d'État de lancement en Indonésie"
 USA_Support_the_indonesian_uprising:0 "Soutenez le soulèvement indonésien"
 USA_Operation_Condor:0 "Opération Condor"
 USA_Mutual_Security_Act:0 "Loi sur la sécurité mutuelle"
 USA_The_Southern_Cone:0 "Le cône sud"
 USA_Assurances_in_Gran_Colombia:0 "Assurances en Grande Colombie"
 USA_Coup_in_Brazil:0 "Coup d'État au Brésil"
 USA_Support_Pro_American_Regimes:0 "Soutenir les régimes pro-américains"
 USA_Support_Israeli_Weapons_Production:0 "Soutenez la production d'armes israélienne"
 USA_Support_Egypt_in_UNSC:0 "Soutenir l'Égypte au Conseil de sécurité des Nations Unies"
 USA_Support_Egypt_in_UNSC_desc:0 "Maintenant que l'Égypte a gagné sur le terrain, nous devons garantir que notre nouvel allié conserve ses terres durement gagnées dans les négociations de l'ONU. Cela sera difficile, car de nombreux membres souhaitent simplement maintenir le statu quo, notamment la Grande-Bretagne et la France, mais nous ferons tout ce que nous pouvons."
 USA_Pressure_Britain:0 "Faire pression sur la Grande-Bretagne"
 USA_Pressure_Britain_desc:0 "La Grande-Bretagne doit reconnaître que l'ordre mondial est en constante évolution et que son rôle dans cet ordre ne cesse de diminuer. La perte du canal n'est que la prochaine étape de ce processus. Nous devons intensifier nos efforts diplomatiques pour leur faire comprendre que le soleil se couche effectivement sur l'Empire britannique."
 USA_Adlai_Stevenson_II_56:0 "Adlaï Stevenson 1956"
 USA_Manufacturing_Subsidies:0 "Subventions à la fabrication"
 USA_Post_War_China:0 "La Chine d'après-guerre"
 USA_Promote_De_Armament:0 "Promouvoir le désarmement"
 USA_intervene_in_indonesia:0 "Intervenir en Indonésie"
 USA_intervene_in_indonesia_desc:0 "Même si Sukarno et ses partisans communistes s'en sortent bien contre les Indes néerlandaises, cela ne durera pas longtemps. Nous devons rejoindre la guerre et empêcher sa révolution de démarrer."
 USA_intervene_in_malaysia:0 "Intervenir en Malaisie"
 USA_intervene_in_vietnam:0 "Intervenir au Vietnam"
 USA_intervene_in_vietnam_desc:0 "Les Français semblent incapables d'écraser une petite rébellion communiste au nord du Vietnam. Peu importe. En nous joignant nous-mêmes au combat, nous pouvons écraser Hô Chi Minh rapidement, efficacement et, si besoin est, sans pitié."
 USA_Second_Chinese_Civil_War:0 "Deuxième guerre civile chinoise"
 USA_The_Truman_Doctrine:0 "La doctrine Truman"
 USA_The_Truman_Doctrine_desc:0 "La doctrine Truman constitue la politique du président à l'égard de l'Union soviétique. Il déclare que nous devons contenir, arrêter et vaincre la propagation du communisme §R§! à tout prix, partout et à tout moment. Pour ce faire, nous devons protéger nos alliés, affronter les Soviétiques et, si nécessaire, suivre la ligne de la correction morale pour garantir que §CDémocratie§!, d'ici chez nous jusqu'en Europe et au-delà de l'Asie."
 USA_Landrum_Griffin_Act:0 "Loi Landrum-Griffin"
 USA_Communist_Control_Act:0 "Loi sur le contrôle communiste"
 USA_Domino_Theory:0 "Théorie des dominos"
 USA_Found_ARPA:0 "ARPA trouvé"
 USA_Internal_Affairs:0 "Affaires internes"
 USA_Elections_of_1952:0 "Élections de 1952"
 USA_Estes_Kefauver_56:0 "Estès Kefauver 1956"
 USA_Atomic_Investments:0 "Investissements atomiques"
 USA_Criminal_Justice_Reforms:0 "Réformes de la justice pénale"
 USA_Support_The_British_Empire:0 "Soutenez l'Empire britannique"
 USA_Support_The_British_Empire_desc:0 "Maintenant que le MLA est vaincu, nous pouvons nous concentrer sur le soutien à l'Empire britannique dans ses efforts pour maintenir son emprise sur les colonies qu'il possède encore, que ce soit dans le Pacifique, l'Atlantique ou l'Afrique."
 USA_Stabilize_European_Empires:0 "Stabiliser les empires européens"
 USA_Stabilize_European_Empires_desc:0 "Avec toutes les révolutions en territoire colonial, la stabilité à travers l'Europe est très faible. Une faible stabilité et de hauts troubles engendrent le soutien communiste, ce qui ne peut pas se produire. Nous devons aider ces pays à se remettre de leurs guerres."
 USA_Supply_European_Empires:0 "Alimenter les empires européens"
 USA_Supply_European_Empires_desc:0 "L'une des raisons pour lesquelles ces rébellions ont connu un tel succès est qu'il est très difficile pour ces pays de ravitailler leur police et leurs forces armées dans des pays aussi éloignés des leurs. En augmentant la quantité de biens et d'armes dont ils disposent, nous pouvons remédier à ce problème."
 USA_support_for_south_vietnam:0 "Soutien au Sud-Vietnam"
 USA_support_for_south_vietnam_desc:0 "Un autre pays d'Asie du Sud-Est est passé au rouge, mais nous avons encore de l'espoir dans l'État du Vietnam. En le soutenant par des armes et une aide économique, nous pouvons le renforcer pour l'inévitable affrontement avec son voisin du nord."
 USA_Advisors_to_South_Vietnam:0 "Conseillers du Sud-Vietnam"
 USA_Advisors_to_South_Vietnam_desc:0 "Le simple fait d'envoyer les canons de l'ARVN ne suffit pas. Nous devons envoyer des conseillers militaires pour former leurs troupes à la tactique et des officiers à la stratégie, pour qu'ils aient une chance de se battre contre Hô Chi Minh et ses guérilleros."
 USA_Support_India:0 "Soutenir l'Inde"
 USA_Support_India_desc:0 "L'Inde et le Pakistan s'opposent depuis le départ des Britanniques. Il est clair que nous ne pouvons pas soutenir les deux, et opter pour l'Inde est le meilleur choix."
 USA_support_for_India:0 "Des armes pour l'Inde"
 USA_support_for_India_desc:0 "Après avoir publiquement déclaré notre soutien à leur égard, nous devons faire quelque chose de physique pour protéger la situation des Indiens. C'est ce que fera le ravitaillement de leur armée."
 USA_Advisors_to_India:0 "Conseillers en Inde"
 USA_Advisors_to_India_desc:0 "Maintenant que leurs troupes disposent d'armes, la prochaine étape pour nous consiste à former des officiers indiens pour les diriger, ainsi qu'à apprendre à chacun comment utiliser leurs nouveaux outils."
 USA_Decolonization_of_Africa:0 "Décolonisation de l'Afrique"
 USA_Decolonization_of_Africa_desc:0 "L'Afrique a été le théâtre des pires crimes coloniaux et reste le continent le plus soumis. Il est temps pour la Grande-Bretagne, la France et la Belgique d'abandonner leur emprise sur leurs anciennes colonies et de laisser l'Afrique aux Africains."
 USA_Algerian_war_of_independence:0 "La guerre d'indépendance algérienne"
 USA_Algerian_war_of_independence_desc:0 "Lassé d'être opprimé et battu par le gouvernement français, le peuple algérien s'est soulevé. Même si nous n'intervenons pas directement, nous devons quand même garder un oeil sur la situation afin qu'elle ne devienne pas incontrôlable."
 USA_Peace_in_Algeria:0 "Paix en Algérie"
 USA_Peace_in_Algeria_desc:0 "Cette guerre a assez duré. La France doit reconnaître que l'ère coloniale est révolue depuis longtemps, et nous devons la faire pression pour qu'elle le comprenne. L'Algérie aura enfin son indépendance."
 USA_Return_Treaty_Ports_to_the_Peoples_Republic_of_China:0 "Restituer les ports du traité à la RPC"
 USA_Return_Treaty_Ports_to_the_Republic_of_China:0 "Restituer les ports du traité au KMT"
 USA_Support_Pakistan:0 "Soutenez le Pakistan"
 USA_Support_Pakistan_desc:0 "L'Inde et le Pakistan s'opposent depuis le départ des Britanniques. Il est clair que nous ne pouvons pas soutenir les deux, et opter pour le Pakistan est le meilleur choix."
 USA_support_for_Pakistan:0 "Des armes pour le Pakistan"
 USA_support_for_Pakistan_desc:0 "Après avoir déclaré publiquement notre soutien à ces derniers, nous devons faire quelque chose de physique pour protéger la situation des Pakistanais. C'est ce que fera le ravitaillement de leur armée."
 USA_Advisors_to_Pakistan:0 "Conseillers au Pakistan"
 USA_Advisors_to_Pakistan_desc:0 "Maintenant que leurs troupes disposent d'armes, la prochaine étape pour nous consiste à former des officiers indiens pour les diriger, ainsi qu'à apprendre à chacun comment utiliser leurs nouveaux outils."
 USA_Department_of_Defense:0 "Ministère de la Défense"
 USA_Department_of_Defense_desc:0 "Alors que la situation partout dans le monde semble de plus en plus tendue, il est temps de revoir nos forces armées, d'orienter nos recherches et d'améliorer nos doctrines. Cela sera crucial dans le prochain affrontement avec le communisme."
 USA_Department_of_the_Navy:0 "Département de la Marine"
 USA_Department_of_the_Navy_desc:0 "La marine américaine est la façon dont nous avons traditionnellement projeté notre puissance et notre présence à travers le monde. Cependant, avec les nouvelles avancées en matière de technologie aérienne et de missiles, nous devons décider si elle conservera ce rôle ou sera écartée."
 USA_Department_of_the_Airforce:0 "Département de l'Armée de l'Air"
 USA_Department_of_the_Airforce_desc:0 "L'Armée de l'Air est la branche la plus récente de nos forces armées et, à certains égards, la plus importante. La dernière Guerre mondiale a prouvé à quel point la couverture et le soutien aériens sont indispensables, et de nouveaux bombardiers à longue portée augmentent chaque jour nos capacités de frappe."
 USA_Fighter_focus:0 "Développements de chasseurs"
 USA_Fighter_focus_desc:0 "En recherchant et en produisant de nouvelles variantes et conceptions d'avions de combat, nous pouvons améliorer la capacité de notre Force aérienne à garantir un ciel propre et convivial à nos troupes au sol."
 USA_Bomber_focus:0 "Développements de bombardiers"
 USA_Bomber_focus_desc:0 "En recherchant et en produisant de nouvelles variantes et conceptions de bombardiers, nous pouvons améliorer la capacité de notre Force aérienne à effectuer des frappes à longue distance et des bombardements stratégiques."
 USA_Respond_to_Puerto_Rican_Nationalism:0 "Réprimer le nationalisme portoricain"
 USA_Puerto_Rican_Statehood:0 "État portoricain"
 USA_The_Korean_War:0 "La guerre de Corée"
 USA_The_Korean_War_desc:0 "La guerre a éclaté ! La Corée du Nord et la Corée du Sud sont engagées dans une lutte à mort, et c'est à nous de veiller à ce que les forces de la démocratie l'emportent. Nous devons faire tout notre possible pour aider Syngman Rhee et son gouvernement, que ce soit par le biais de prêts-bails ou de bénévoles."
 USA_Turkish_Straits_Crisis:0 "La crise du détroit turc"
 USA_Turkish_Straits_Crisis_desc:0 "Les Soviétiques font pression sur les Turcs pour qu'ils leur cèdent les détroits et leur donnent accès à la Méditerranée. Cela porterait un coup dur à la position de l'OTAN en Europe et ne peut pas se produire. Même si la politique turque est neutre, nous devons faire savoir aux Turcs que nous les soutenons. L'URSS doit être freinée."
 USA_economic_aid_to_turkey:0 "Aide économique à la Turquie"
 USA_economic_aid_to_turkey_desc:0 "Ce ne sera pas la dernière fois que les Soviétiques feront un geste en faveur des détroits ou de la Turquie. En développant l'économie turque et en leur offrant un soutien financier, nous pouvons garantir qu'ils seront en mesure de mieux se défendre que cette fois-ci."
 USA_Containment:0 "Endiguement"
 USA_Containment_desc:0 "Eh bien, nous ne pouvons pas engager directement les Soviétiques dans un conflit à grande échelle, nous pouvons au moins nous assurer que nous avons les moyens de les menacer sérieusement si nous y sommes contraints. L'augmentation de notre production militaire et de la recherche sur les missiles nous sera bénéfique à cette fin."
 USA_Mobilize_Against_the_Soviets:0 "Augmenter la production d'armes"
 USA_Mobilize_Against_the_Soviets_desc:0 "Eh bien, nous avons une armée relativement nombreuse, ce qui n'est rien en comparaison de la puissante Armée rouge. Nous devons intensifier notre production d'armes, ainsi que d'autres véhicules militaires, pour tenter de rattraper les Soviétiques sur le terrain."
 USA_An_Arms_Race:0 "Une course aux armements"
 USA_An_Arms_Race_desc:0 "S'il s'avère impossible de rattraper les Soviétiques sur le terrain, nous devrions nous assurer d'avoir l'avantage dans le ciel et dans la haute atmosphère. L'augmentation de la recherche sur les fusées y contribuera."
 USA_Decleration_of_Conscience:0 "Déclaration de conscience"
 USA_Decleration_of_Conscience_desc:0 "Récemment, la sénatrice Margaret Chase Smith (Maine) a prononcé un discours critiquant le gouvernement et les tactiques utilisées lors des audiences McCarthy. Eh bien, elle n'a mentionné le nom de personne, ce n'est pas trop difficile de voir où elle voulait en venir avec ça. McCarthy doit partir."
 USA_The_Hollywood_Witch_Hunt:0 "La chasse aux sorcières hollywoodienne"
 USA_The_Hollywood_Witch_Hunt_desc:0 "La rumeur veut qu'Hollywood regorge de communistes dégoûtants ! Les Rouges font un lavage de cerveau à nos enfants sous couvert de films mignons et divertissants ! Nous devons découvrir ces traîtres et les exterminer avant qu'ils ne détournent notre précieuse jeunesse contre la gloire de la liberté ! En avant, pour la démocratie !"
 USA_Fall_of_the_Mainland:0 "Chute de la Chine continentale"
 USA_Fall_of_the_Mainland_desc:0 "La République populaire de Chine a gagné la guerre civile chinoise, mais cela ne veut pas dire que tout est perdu. En reconnaissant le gouvernement nationaliste de Taiwan, nous pouvons assurer sa survie et maintenir un pied dans la mer de Chine du Sud-Est."
 USA_Peace_Fails:0 "La paix échoue"
 USA_Peace_Succeeds:0 "La paix réussit"
 USA_Support_Israel:0 "Soutenez Israël"
 USA_Support_Israel_desc:0 "Israël est amical envers nous depuis son indépendance en 1948. Nos alliés dans la région sont rares, et nous serions idiots de nous aliéner une démocratie stable tendue vers les puissances occidentales. L'Amérique compte également une très grande disapora juive, et ils apprécieraient sûrement notre soutien à leurs frères juifs lors de la saison électorale."
 USA_Support_Egypt:0 "Soutenez l'Égypte"
 USA_Support_Egypt_desc:0 "Il est temps de soutenir un nouveau cheval au Moyen-Orient. Nasser est charismatique et influent dans le monde arabe, et nous avons besoin de son accès au pétrole et aux terres. En outre, c'est bien d'avoir un allié à l'esprit plus agressif qui n'a pas peur d'agir, contrairement à nos camarades européens."
 USA_Ignore_the_Crisis:0 "Ignorer la crise"
 USA_Ignore_the_Crisis_desc:0 "Le Suez est loin. De plus, nos expéditions ne sont pas affectées par toute cette folle mascarade. Laissons les deux parties s'affronter, et nous regarderons de côté, comme le font les Soviétiques. Nous avons de plus gros poissons à affronter et nous devrions plutôt nous concentrer sur eux."
 USA_Advance_the_American_Nuclear_Program:0 "Faire progresser le programme nucléaire américain"
 USA_Advance_the_American_Nuclear_Program_desc:0 "Il est clair que l'arme nucléaire jouera un rôle majeur dans cette nouvelle époque. Même si nous sommes encore en avance sur tout le monde en matière de recherche, nous ne pouvons pas nous permettre de faire preuve de complaisance dans ce domaine."
 USA_Hydrogen_Bomb_Test:0 "Test de bombe à hydrogène"
 USA_Further_Nuclear_Tests:0 "D'autres essais nucléaires"
 USA_Further_Nuclear_Tests_desc:0 "Nous ne pouvons pas nous reposer sur nos lauriers avec notre dernier succès nucléaire. Les Soviétiques n'arrêtent pas leurs recherches, nous non plus."
 USA_Create_the_First_Nuclear_Submarine:0 "Développer le premier sous-marin nucléaire"
 USA_Create_the_First_Nuclear_Submarine_desc:0 "Développer un sous-marin nucléaire signifie que nous pourrons positionner et lancer des armes nucléaires depuis presque n'importe où dans le monde. Cela augmentera notre capacité de frappe et notre capacité à menacer l'URSS."
 USA_eisenhower_presidency_Copy:0 "Eisenhower 1956"
 USA_Support_Anti_Communist_Groups:0 "Soutenez les groupes anticommunistes"
 USA_eisenhower_presidency_Copy_desc:0 "Le général américain a remporté la victoire en remportant un nouveau mandat. Le président Eisenhower espère utiliser les quatre prochaines années de manière productive, en garantissant que l'Amérique sera stable et prospère sur son territoire et résistante à la menace du communisme à l'étranger. Salut au chef !"
 USA_Support_Anti_Communist_Groups_desc:0 "Le communisme est la définition même de la tyrannie. Nous devons soutenir ces honnêtes gens qui tentent de libérer leurs peuples du communisme, où qu'ils se trouvent dans le monde. L'oppression communiste ne peut pas maintenir le monde à terre pour toujours."
 USA_Rid_the_World_Of_Communism:0 "Débarrassez le monde du communisme"
 USA_Bolster_the_Arms_Industry:0 "Renforcer l'industrie de l'armement"
 USA_Continue_New_Deal_Economic_Policies:0 "Poursuivre les politiques économiques du New Deal"
 USA_Continued_Congressional_Cooperation:0 "Coopération continue avec le Congrès"
 USA_Conitinue_Hard_Liner_Stance_on_Communism:0 "Maintenir une position dure contre le communisme"
 USA_These_Years_Of_Progress:0 "Ces années de progrès"
 USA_The_Constitutional_Crisis:0 "La crise constitutionnelle"
 USA_Impeach_Truman:0 "Destituer Truman"
 USA_Continue_Reforms:0 "Poursuite des réformes"
 USA_Support_The_Dutch_Empire:0 "Soutenez l'Empire néerlandais"
 USA_Support_The_Dutch_Empire_desc:0 "La seule raison pour laquelle Sukarno a pu se soulever était la faiblesse de l'Empire néerlandais. Nous devrions lui apporter un soutien économique pour que cela ne se reproduise plus."
 USA_Support_The_French_Empire:0 "Soutenez l'Empire français"
 USA_Support_The_French_Empire_desc:0 "La France n'a jamais été stable au départ (enfin depuis Napoléon en tout cas) et tous ces troubles dans ses colonies n'aident pas. Nous devons faire ce que nous pouvons pour aider à leur rétablissement."
 USA_Abstain_from_the_unsc:0 "S'abstenir du CSNU"
 USA_Abstain_from_the_unsc_desc:0 "Puisque nous sommes restés à l'écart du conflit jusqu'à présent, il est logique de faire de même au Conseil de sécurité des Nations Unies. Laissons les autres puissances s'en occuper, ce n'est pas notre problème. En fin de compte, tant que les Soviétiques n'auront pas Suez, nous ne nous en soucierons pas moins."
 USA_The_Colonization_Question:0 "La question de la colonisation"
 USA_The_Colonization_Question_desc:0 "Alors que les mouvements et les sentiments nationalistes grandissent dans les régions encore occupées par les anciennes puissances européennes, il est temps pour nous de décider où nous en sommes sur la question. Devons-nous nous tenir aux côtés de nos alliés de l'OTAN et préserver leurs empires, même par la force, ou vaut-il mieux laisser les choses suivre leur cours et en finir avec la colonisation ici et maintenant ?"
 USA_Support_Israel_in_UNSC:0 "Soutenez Israël au Conseil de sécurité des Nations Unies"
 USA_Increase_Encryption:0 "Augmenter les normes de chiffrement"
 USA_Increase_Encryption_desc:0 "L'un des moyens par lesquels nous pouvons ralentir les agents soviétiques et les mesures d'espionnage est d'augmenter nos normes de cryptage. Cela rendra tous nos messages codés et classifiés plus difficiles à déchiffrer."
 USA_A_Response_to_the_KGB:0 "Une réponse au KGB"
 USA_A_Response_to_the_KGB_desc:0 "Le KGB a multiplié ses opérations et ses activités subversives partout dans le monde. Ils essaient de répandre le communisme partout. Nous devons faire quelque chose à ce sujet !"
 USA_Improved_Spying_Techniques:0 "Techniques d'espionnage améliorées"
 USA_Improved_Spying_Techniques_desc:0 "Maintenant que nous avons pris quelques mesures préventives, il est temps de passer à l'attaque proverbiale. Eh bien, nous ne blesserons pas directement l'URSS, grâce aux nouvelles techniques de nos agents, nous saurons bientôt tout ce qu'ils préparent."
 USA_Send_advisors_to_Vietnam:0 "Envoyer des conseillers au Vietnam"
 civilian_preparations:0 "Préparatifs civils"
 constitutional_crisis:0 "Crise constitutionnelle"
 increased_encryption:0 "Cryptage accru"
 improved_espionage:0 "Espionnage amélioré"
 anti_soviet_mobilization:0 "Mobilisation antisoviétique"
 ARPA:0 "ARPA"
 USA_red_scare:0 "La peur rouge"
 Domino_Theory:0 "Théorie des dominos"
 USA_korean_tensions:0 "Tensions coréennes"
 USA_defensive_protocol:0 "Protocole défensif coréen"
 USA_offensive_protocol:0 "Protocole offensif coréen"
 USA_a_modern_airforce1_desc:0 "L'U.S.A.F. Est la meilleure armée de l'air au monde, et nous devons veiller à ce qu'elle le reste. Nous moderniserons et réformerons notre force aérienne pour garantir que nous conservons cet avantage clé sur les Soviétiques."
 USA_enable_the_us_navy1:0 "Activer la marine américaine"
 USA_enable_the_us_navy1_desc:0 "Notre Marine est la partie la plus importante de nos forces armées. Sans puissance navale, l'Amérique ne peut pas projeter sa puissance militaire loin de ses frontières, et nous n'aurions que très peu de moyens de contrecarrer les Russes dans leur quête de domination mondiale. Nous devons investir et développer la Marine et notre capacité de construction navale."
 USA_mothball_the_us_navy:0 "Mettre en veilleuse la marine américaine"
 USA_mothball_the_us_navy_desc:0 "La Marine représente une part considérable de notre énorme budget militaire. Il serait plus logique de réduire les effectifs de notre Marine et de se concentrer plutôt sur des moyens plus rentables de contrôler les vagues."
 USA_american_commandos1_desc:0 "La force de l'armée américaine réside dans ses forces spéciales. Nous intensifierons les exigences de formation de nos brigades de parachutistes, de marines et d'alpinistes afin de garantir qu'elles restent une force de combat de haute qualité."
 USA_the_marshall_plan1_desc:0 "L'expérience montre que l'extrémisme prend racine dans des périodes de chaos politique et économique - comme la situation dans laquelle se trouve actuellement l'Europe. Nous devons investir massivement en argent et en matériaux pour reconstruire l'Europe, de peur de les voir se tourner vers Staline, ou un autre Hitler, pour la sauver. "
 USA_foriegn_affairs_desc:0 "En tant que nouveau leader du monde libre et principal gardien contre le communisme mondial, de nombreux domaines requièrent notre attention. Nous devons décider dans quels domaines intervenir et dans quelle mesure. "
 USA_mccarthy_presidency_desc:0 "Dans un écart choquant, Joseph McCarthy a remporté l'élection présidentielle américaine et s'apprête à riposter contre les communistes réels et imaginaires."
 USA_reaction_to_mccarthyism_desc:0 "Le sénateur Joseph McCarthy a lancé une accusation choquante : il aurait une liste de plus de 200 membres du Département d'État qui sont membres du Parti communiste ! Ce sénateur du Wisconsin attise une tempête d'indignation et de paranoïa à travers le pays. Nous devons décider comment nous allons faire face à cette tempête."
 USA_aid_roc_desc:0 "Le gouvernement républicain de Chiang Kai-Shek est notre allié fidèle à l'Est, mais il est épuisé par l'invasion japonaise d'il y a quelques années. Si nous ne les aidons pas, ils tomberont presque certainement aux mains du régime communiste de Mao Zedong et, avec eux, les dominos de l'Asie de l'Est commenceront à s'effondrer."
 USA_advisors_roc_desc:0 "Fournir au Kuomintang des armes et du matériel ne suffit pas s'il ne sait pas comment les utiliser au mieux. Les Chinois bénéficieront des conseils avisés de nos plus grands esprits militaires, ce qui contribuera sûrement à inverser la marée rouge."
 USA_declare_war_on_prc_desc:0 "Même si nous avons jusqu'à présent évité toute action directe en Chine par crainte de représailles soviétiques, nous ne pouvons plus rester les bras croisés et regarder l'Asie glisser dans l'ombre de Staline. Le président a choisi de déclarer la guerre à Mao et à son terrible régime, dans le but de stabiliser et de réorganiser le nord de la Chine jusqu'à ce qu'elle puisse être remise à un État chinois démocratique et responsable."
 USA_cut_off_roc_desc:0 "Le Kuomintang est en désordre : corrompu, antidémocratique et engagé dans une guerre désespérée contre les communistes. Il n'est ni moral ni prudent de continuer à soutenir le régime de Kai-Shek."
 USA_recognize_prc_desc:0 "Aussi désagréable que cela puisse paraître, nous ne pouvons nier que Mao Zedong a gagné la guerre pour la suprématie contre la Chine. Nous devrions reconnaître la RPC comme gouvernement légitime de la Chine, dans l'espoir de pouvoir contester l'influence de Moscou sur elle."
 USA_anti_soviet_alliance_desc:0 "Bien que Mao soit marxiste, il est plutôt peu orthodoxe et il existe de nombreuses tensions entre Pékin et le Kremlin. Si nous abordons la RPC avec suffisamment de tact, nous pourrons peut-être convaincre Mao de signer une alliance avec nous contre Staline, malgré nos différences idéologiques."
 USA_restart_marshall_mission_desc:0 "En 1945, nous avons envoyé le général George Marshall négocier la paix entre les gouvernements communiste et nationaliste en Chine. La corruption et l'entêtement des deux gouvernements ont entraîné l'échec de cette mission, avec le retrait de Marshall en 1947. Nous devons redoubler d'efforts et envoyer une autre mission, dans l'intérêt de la paix, de la stabilité et de la sécurité contre les Soviétiques."
 USA_press_for_peace_desc:0 "Nous n'avons pas été assez insistants lors de la mission Marshall de 1945-1947. Nous devons nous engager pleinement à faire pression diplomatiquement sur les deux parties pour qu'elles acceptent un cessez-le-feu."
 USA_push_for_yangtze_border_desc:0 "Nos diplomates ont enfin fait des progrès et trouvé une solution qui pourrait être acceptable pour les deux parties. Nous tenterons de tracer la ligne de démarcation entre les deux Chines au niveau du fleuve historique Yangtze. Peut-être que cela mettra enfin un terme à l'effusion de sang."
 USA_compromise_with_congress_desc:0 "Même s'il serait bien sûr préférable d'adopter chaque loi sans opposition, le président doit comprendre que dans une démocratie, toutes ses propositions ne seront pas adoptées. Nous devrions être plus disposés à faire des compromis avec le Congrès, même lorsque cela nous oblige à édulcorer nos propositions et nous empêche de faire ce que nous souhaitons. Après tout, ils représentent aussi le peuple américain."
 USA_the_bully_pulpit_desc:0 "Le Congrès est une nuisance, entravant constamment les efforts du président pour mener à bien ses sages réformes et contrecarrant sa volonté à chaque étape. Nous devrions saper leur légitimité en convainquant le peuple américain que le Congrès entrave injustement les efforts du président pour les aider."
 USA_korea_desc:0 "La péninsule coréenne constitue un atout stratégique clé. En raison de sa proximité avec la Chine et le Japon, elle constituera une base de transit et un avant-poste vital pour quiconque la contrôle. Nous ne pouvons pas permettre qu'elle tombe entre les mains des communistes, à la fois pour le bien du peuple coréen et pour la sécurité de nos alliés en Asie de l'Est."
 USA_fair_society_desc:0 "Nous devons garantir une société juste et égale pour tous les Américains."
 USA_truman_assasination_desc:0 "Truman doit être écarté, par tous les moyens nécessaires."
 USA_expansion_of_social_security_desc:0 "Nous dépensons déjà des millions de dollars chaque année dans des projets coûteux et risqués visant à contenir la propagation du communisme mondial, tandis que chaque jour, des millions d'Américains souffrent de pertes de revenus causées par la mauvaise santé, le chômage et la vieillesse. Cette immense richesse devrait être mieux dépensée pour améliorer la qualité de vie de nos citoyens."
 USA_crack_down_on_strikes_desc:0 "Alors que les syndicats avaient promis de ne pas faire grève pendant la guerre afin d'assurer la défaite du nazisme, cette promesse est désormais expirée et ils recommencent à semer le trouble. Nous devrions adopter une ligne plus dure en matière de grèves perturbatrices, afin de rendre plus difficile aux syndicats de perturber l'industrie américaine et d'entraver la croissance de l'infiltration communiste dans notre pays."
 USA_end_military_segregation_desc:0 "Actuellement, les forces armées américaines autorisent uniquement les unités à être d'origine raciale homogène. Ce n'est pas seulement injuste, cela entraîne également des tensions au sein des forces armées et rend difficile la recherche de la bonne personne pour remplir le bon rôle. Nous devrions mettre fin à cette pratique et intégrer l'armée, pour des raisons à la fois morales et pratiques."
 USA_continue_price_controls_desc:0 "Pendant la guerre, nous avons établi des contrôles stricts sur le prix de certains biens et services, afin de nous permettre de préparer notre économie à la guerre. Les économistes font pression pour que ces contrôles soient levés maintenant que la guerre est terminée, arguant qu'ils entraînent des pénuries, mais nous savons mieux. Nous continuerons à contrôler le gouvernement sur des industries vitales."
 USA_repeal_taft_hartley_desc:0 "La loi sur les relations professionnelles de 1947, mieux connue sous le nom de loi Taft-Hartley, impose des restrictions injustes sur ce que les travailleurs syndiqués peuvent légalement faire pour protéger leurs droits. Nous devons abroger cet acte injuste pour préserver les droits de notre peuple."
 USA_brennan_plan_desc:0 "Pendant la guerre, les Alliés avaient un grand besoin de nourriture et nous payions les agriculteurs bien au-dessus des prix du marché pour qu'ils produisent autant qu'ils le pouvaient. Cependant, la guerre étant terminée, des milliers d'agriculteurs se retrouvent désormais avec des tas de nourriture qu'ils ne peuvent pas vendre. Nous vendrons cet excédent aux prix du marché, puis verserons aux agriculteurs une compensation pour le fait qu'ils ne peuvent plus vendre aux prix de guerre."
 USA_housing_act_of_1949_desc:0 "Les États-Unis sont confrontés à une énorme pénurie de logements et de nombreux Américains vivent dans des bidonvilles de banlieue. Cela ne peut pas durer : nous mettrons en place un programme massif visant à éliminer les bidonvilles, à construire des logements abordables et à fournir une assurance hypothécaire afin que chaque Américain puisse avoir un bon logement."
 USA_increase_min_wage_desc:0 "Cette administration est fermement convaincue que la justice sociale fondamentale exige que le travailleur américain ait droit à un salaire juste et raisonnable pour son travail. Nous augmenterons le salaire minimum afin d'offrir à nos travailleurs au moins un niveau minimum de suffisance et de sécurité économiques."
 USA_political_freedom_of_conscience_desc:0 "C'est un droit fondamental de tout être humain que de pouvoir non seulement exprimer, mais aussi exprimer publiquement ses convictions sincères, sans craindre de représailles publiques. C'est cette grande liberté qui protège notre République de la tyrannie, et nous devons veiller à inscrire publiquement ce principe dans nos déclarations et nos efforts."
 USA_condemn_mccarthy_as_insane_desc:0 "Joseph McCarthy est une force dangereuse et instable, un canon libre dont les dommages collatéraux ne peuvent être prédits. Nous devrions le condamner publiquement pour tenter de mettre fin à sa croisade pharisaïque et contre-productive contre les membres de notre gouvernement."
 USA_discredit_eisenhower_desc:0 "Dwight. D. Eisenhower, bien qu'il soit un héros de guerre respecté, n'est pas favorable à nos projets pour l'avenir. Nous devrions salir son nom afin de l'éliminer en tant que menace politique."
 USA_preserve_colonial_empires_desc:0 "Même si nous nous sommes toujours considérés comme des anticolonialistes, nous devrions éviter de mettre trop de pression sur nos alliés colonialistes. La France et la Grande-Bretagne sont nos alliés essentiels dans la lutte contre les Soviétiques, et les pousser à abandonner leurs empires coloniaux ne fera que les affaiblir et les irriter, les poussant peut-être dans les bras de Staline."
 USA_arm_imperialist_vietnam_desc:0 "Hô Chi Minh et ses révolutionnaires communistes sèment le trouble au Vietnam. Nous devons envoyer des armes et des fournitures au gouvernement vietnamien pour l'aider à éteindre les incendies de la révolution."
 USA_vietnam_advisors_desc:0 "Le gouvernement vietnamien souffre d'un manque de conseillers militaires expérimentés pour former son armée. Nous devrions leur envoyer des conseillers pour former leurs agents et les aider à préserver leur propre sécurité."
 USA_operation_vulture_desc:0 "La garnison française de Dien Bien Phu a été encerclée par les soldats vietnamiens. Ils seront sûrement tués si personne n'agit pour les sauver. Nous leur enverrons du soutien via des vagues de bombardiers B-29. On pense même à envoyer des bombes nucléaires au secours des Français..."
 USA_eisenhower_doctrine_desc:0 "Le Moyen-Orient est une cible tentante pour le communisme mondial, car il s'agit d'une région remplie de mécontentement et regorgeant de ressources pétrolières vitales dont nous et le monde libre avons besoin. Nous devons faire clairement comprendre que n'importe quel pays du Moyen-Orient peut faire appel à notre aide contre l'agression communiste, pour lui comme pour le nôtre."
 USA_new_look_policy_desc:0 "Nos dépenses militaires actuelles reposaient sur l'hypothèse que les Soviétiques atteindraient un « plafond » maximum de leur capacité militaire par rapport à nous dans les années 1950. Il semble désormais peu probable que la capacité militaire soviétique se stabilise comme nous l'espérions. Nous devrions donc passer à une stratégie à long terme axée sur la défense aérienne et les armes nucléaires plutôt que sur des armées et des marines permanentes."
 USA_army_macarthur_hearings_desc:0 "McCarthy exerce une influence très négative sur notre gouvernement et sur la perception du gouvernement par le public. Nous avons réussi à trouver une accusation contre lui pour avoir fait pression de manière inappropriée sur des responsables de l'armée, et nous lui ferons participer une audience télévisée en direct à ce sujet. Peut-être que lorsque le peuple américain le verra en personne, il se retournera contre lui."
 USA_refugee_relief_act_desc:0 "Il y a eu récemment une vague de réfugiés en provenance du sud de l'Europe, notamment de plusieurs pays communistes. Nos dispositions actuelles en matière d'immigration ne leur permettent pas d'entrer aux États-Unis, mais nous devrions adopter une nouvelle loi autorisant la réinstallation de ces personnes pauvres et déplacées (sous réserve de certains contrôles, bien sûr)."
 USA_support_monarchism_iran_desc:0 "La stabilité au Moyen-Orient est primordiale, car la région regorge de pétrole et d'agitateurs communistes. Le mécontentement populaire à l'égard de la dynastie Pahlavi au pouvoir en Iran s'est développé grâce au soutien soviétique. Nous devons aider le Shah à consolider le soutien populaire et à réprimer la dissidence rouge. Si nous ne le faisons pas, le Moyen-Orient tout entier pourrait s'effondrer d'ici peu."
 USA_operation_ajax_desc:0 "Le Shah iranien s'est montré réceptif aux idées occidentales, mais son gouvernement est considérablement moins ouvert d'esprit. Avec les Britanniques, nous avons contacté un puissant militaire iranien et lui avons demandé de nous aider à stabiliser l'emprise du Shah sur son parlement indiscipliné."
 USA_arm_imperialist_persia_desc:0 "Maintenant que nous avons aidé le Shah à renforcer son contrôle sur l'Iran, nous devons également veiller à empêcher un soulèvement armé. Nous enverrons des quantités considérables d'armes et de munitions en Perse, pour renforcer notre fidèle allié."
 USA_malayam_emergency_aid_desc:0 "La Malaisie souffre d'une insurrection communiste, une guerre compliquée par le fait que les communistes luttent avant tout contre l'oppression coloniale. Nous devrions envoyer de l'aide à la Malaisie pour aider à apaiser cette urgence."
 USA_advisors_to_malaysia_desc:0 "Comme de nombreux pays d'Asie de l'Est, la Malaisie souffre d'un manque relatif d'expérience en matière de guerre moderne. Nous devrions envoyer des conseillers militaires pour les aider dans leur lutte contre l'insurrection communiste."
 USA_intervene_in_malaysia_desc:0 "Nous avons perdu confiance dans la capacité du gouvernement malais à gérer seul les révolutionnaires du MLA. Nous avons décidé d'intervenir nous-mêmes pour contenir la propagation du communisme mondial."
 USA_science_funding_desc:0 "L'avenir de l'Amérique réside dans le progrès de la science et dans l'éducation scientifique de nos jeunes. Nous devrions augmenter le financement de ces domaines vitaux, de peur de prendre du retard dans la course avec la Russie."
 USA_support_african_colonialism_desc:0 "Nos alliés en Europe ont besoin des ressources de leurs marchés coloniaux pour reconstruire leurs économies et rester forts face à l'influence du Pacte de Varsovie. À cette fin, nous devons soutenir leurs efforts visant à maintenir la paix et l'ordre dans leurs colonies."
 USA_advisors_french_algeria_desc:0 "L'Algérie française est une région qui souffre d'un sentiment nationaliste particulièrement féroce. Les Français auront besoin de l'aide de nos conseillers militaires s'ils veulent maintenir la stabilité dans la région."
 USA_intervene_in_algeria_desc:0 "Les rebelles nationalistes algériens se sont révélés étonnamment compétents et déterminés. On ne peut plus compter sur les Français pour assurer la sécurité de leurs colonies d'Afrique du Nord - nous devons intervenir pour assurer la paix."
 USA_crack_down_on_organized_crime_desc:0 "La mafia et d'autres formes de crime organisé constituent une épidémie dans notre société. Le chantage, l'extorsion, le meurtre, le vol et toutes sortes de vices sont infligés à notre société par ces criminels. Ils ne peuvent plus être ignorés et doivent être supprimés par tous les moyens à notre disposition."
 USA_expand_missle_research_desc:0 "Lors de l'invasion de l'Allemagne nazie, nous avons secouru et amnistié de nombreux spécialistes allemands des fusées. Leur expertise accélérera considérablement notre programme de fusées. Après tout, le potentiel militaire de ce domaine ne peut être surestimé."
 USA_the_interstate_highway_system_desc:0 "Les voyages et le commerce à travers l'Amérique sont entravés par des routes peu sûres et une planification d'itinéraire inefficace. Nous nous engagerons dans un projet de construction routière d'une ampleur sans précédent, afin de fournir un système routier bien supérieur qui rationalisera la vie américaine."
 USA_statehood_for_alaska_and_hawaii_desc:0 "Actuellement, l'Alaska et Hawaï sont des territoires constitués en sociétés organisées et non des États à part entière. Nous devrions étendre le statut d'État à part entière, mais le Congrès n'est pas disposé à approuver l'un ou l'autre État séparément, puisque l'Alaska est majoritairement républicain et Hawaï est majoritairement démocrate. Par conséquent, ils doivent tous deux devenir des États l'un après l'autre."
 USA_nasa_desc:0 "Les nouvelles technologies ont ouvert la possibilité surprenante de quitter cette planète sur laquelle nous avons vécu tout au long de notre histoire. En outre, les Soviétiques ont également manifesté leur intérêt pour cette entreprise et sont jusqu'à présent en tête dans la « course à l'espace ». Nous créerons la National Aeronautics and Space Administration pour faire progresser l'exploration américaine de l'espace."
 USA_latam_operations_desc:0 "L'Amérique latine est notre arrière-cour et nous ne tolérerons aucune subversion socialiste aussi près de nos frontières. La chute de n'importe quel pays américain sous un régime communiste pourrait potentiellement permettre aux Soviétiques de prendre pied à quelques centaines de kilomètres à peine de nos frontières, et cela ne sera pas toléré."
 USA_PBSUCCESS_desc:0 "Le Guatemala est contrôlé par un gouvernement libéral qui a trop de liens avec le communisme pour notre confort. Nous avons élaboré un plan qui remplacera l'administration actuelle du Guatemala par une autre plus conforme à nos objectifs."
 USA_democratic_regime_gua_desc:0 "L'établissement d'un gouvernement autocratique au Guatemala a été une erreur de notre part, une grande injustice envers le peuple guatémaltèque. Nous devons permettre à un gouvernement démocratiquement élu de prendre le pouvoir."
 USA_gua_military_junta_desc:0 "La dictature que nous avons établie au Guatemala n'est pas suffisamment stable pour s'opposer de manière fiable à l'infiltration communiste. Nous devrions faire en sorte qu'un gouvernement plus ferme et plus fort prenne le pouvoir."
 USA_support_arab_cause_desc:0 "Les Arabes et les Israéliens entretiennent des relations tendues et difficiles, mais il y a beaucoup plus d'Arabes que d'Israéliens. Dans l'intérêt de la stabilité régionale au Moyen-Orient, nous devons soutenir la cause arabe."
 USA_arm_arab_states_desc:0 "Les pays arabes sont la cible des Russes, qui tentent de financer les rebelles communistes dans leur pays. Nous devons leur fournir des armes et des munitions pour les aider à résister à l'insurrection socialiste."
 USA_arab_advisors_desc:0 "Nos alliés arabes bénéficieront des conseils de nos officiers militaires compétents."
 USA_economic_and_oil_development_Desc:0 "Le Moyen-Orient regorge de pétrole, mais les pays arabes n'ont pas la capacité d'accéder efficacement à la majeure partie de ce pétrole. Nous investirons des capitaux importants dans nos alliés arabes, pour leur permettre d'exploiter leurs vastes ressources naturelles."
 USA_gua_corporate_puppet_desc:0 "La United Fruit Company est une société américaine qui détenait des intérêts importants au Guatemala avant la récente instabilité. Ils nous ont demandé de leur permettre d'étendre leur influence dans le pays, de permettre à l'Amérique de protéger plus efficacement ses alliés et d'empêcher la propagation du socialisme."
 USA_support_israel_desc:0 "Le peuple juif fait partie de notre héritage judéo-chrétien commun. Nous devons soutenir les Israéliens dans leur noble tentative de défendre leur nation contre une agression étrangère."
 USA_arm_israel_desc:0 "Le peuple juif a terriblement souffert pendant la Seconde Guerre mondiale et a maintenant décidé de récupérer une partie de sa patrie ancestrale en Israël. Cependant, ils sont entourés d'importantes populations d'Arabes hostiles, qui ne sont pas encore prêts à coexister avec eux. Nous devons fournir à Israël les armes dont il a besoin pour se défendre."
 USA_israeli_advisors_desc:0 "Israël a besoin de l'aide de nos conseillers militaires pour assurer la sécurité de ses frontières."
 USA_support_israeli_economically_desc:0 "Il ne suffira pas de donner des armes à Israël : nous devons garantir qu'il jouisse d'une prospérité économique telle qu'il ne manque de rien. Nous investirons publiquement des quantités massives de capitaux et d'industries en Israël, et encouragerons également les investissements privés dans l'économie israélienne."
 USA_support_honduras_coup_desc:0 "Les conspirateurs du Honduras nous ont fait savoir que le moment était venu de faire grève. Nous sommes prêts et nos agents interviennent. Avec un peu de chance, dans quelques semaines, le Honduras sera définitivement hors de la sphère soviétique."
 USA_arm_militarist_honduras_desc:0 "Nous devrions fournir des armes et des munitions au gouvernement du Honduras, afin de mieux garantir sa capacité à se défendre contre l'insurrection communiste."
 USA_arm_korea_desc:0 "La Corée du Sud se trouve dans une position très vulnérable en Asie de l'Est. Nous devons envoyer d'importantes quantités de soutien matériel pour garantir qu'ils puissent se défendre contre les menaces tant internes qu'externes."
 USA_south_korean_economy_desc:0 "La Corée est actuellement sous-développée, mais cela est dû en grande partie à sa longue oppression sous le régime japonais. Nous voyons cependant un grand potentiel dans l'économie coréenne et nous investirons massivement dans le développement de notre allié."
 USA_defend_the_border_desc:0 "Nous ne pouvons pas nous permettre de lancer une offensive contre la Corée du Nord, mais le régime de Kim est trop dangereux pour être simplement ignoré. Nous construirons un système de fortifications et de mines terrestres qui devraient ralentir, voire arrêter une offensive nord-coréenne en cas de guerre dans la péninsule."
 USA_pre_emptive_strike_desc:0 "Laisser le régime de Kim s'envenimer ne fera qu'aggraver le problème. Nous mettrons fin à la menace du communisme en Corée dès maintenant, avant qu'ils n'aient l'occasion de répandre davantage leur poison."
 USA_operation_blue_bat_desc:0 "Le Liban est un pays divisé entre musulmans et chrétiens maronites. Le récent président libanais s'est rapproché de l'Occident, provoquant la colère d'une partie de la population islamique et provoquant des troubles intérieurs. Nous devrions lancer une opération visant à renforcer le gouvernement du Liban, afin de l'empêcher de s'éloigner de l'Occident."
 USA_arm_lebanon_desc:0 "Pour renforcer davantage le gouvernement libanais, nous devrions lui envoyer des armes et des armures de fabrication américaine afin de garantir la capacité du gouvernement à résister aux menaces tant étrangères que intérieures."
 USA_pull_out_of_korea_desc:0 "La Corée ne nous préoccupe pas. La péninsule est divisée d'une manière tout à fait contre nature et difficile à défendre, et ce serait un gaspillage énorme de ressources que de maintenir plus longtemps nos troupes de combat stationnées dans le Sud."
 USA_arm_tibetan_uprising_desc:0 "Le peuple tibétain s'est soulevé contre l'occupation chinoise. Nous ne voyons aucune raison pour laquelle le peuple tibétain ne devrait pas avoir le droit à l'autodétermination, c'est pourquoi nous enverrons des armes aux rebelles afin de soutenir la cause de l'indépendance du Tibet."
 USA_return_our_boys_home1_desc:0 "La guerre est enfin terminée, mais des centaines de milliers de soldats américains sont encore déployés en garnison en Europe. Même si la menace soviétique est réelle, cela ne signifie pas que les troupes américaines doivent occuper constamment l'Allemagne et la France. Nous confierons ces tâches à nos alliés et commencerons à laisser nos garçons retourner dans leurs familles."
 USA_consolidate_the_army1_desc:0 "Sans la menace de l'Allemagne nazie, il n'y a plus de justification pour maintenir des millions de soldats mobilisés en permanence. Notre défense contre les Soviétiques sera bien mieux assurée par une armée consolidée composée de professionnels qualifiés, plutôt que par des soldats enrôlés."
 USA_return_to_domestic_defense_policy1_desc:0 "Pourquoi les contribuables américains devraient-ils payer la note pour assurer la protection de l'Europe, de l'Afrique et de l'Asie ? Nous devrions revenir à une politique de défense intérieure uniquement, dans laquelle notre armée défend le continent américain, plutôt que de devoir défendre simultanément tous les pays de l'hémisphère occidental."
 USA_end_of_colonization_desc:0 "L'ère coloniale est terminée et l'oppression des non-Européens par les Européens est une injustice anachronique. Nous devrions agir publiquement pour soutenir les mouvements indépendantistes des colonies du monde. Après tout, si nous ne les libérons pas nous-mêmes, ils pourraient se tourner vers la Russie pour leur salut..."
 USA_call_for_de_colonization_desc:0 "Jusqu'à présent, nous avons traité la Grande-Bretagne et la France avec des gants de chevreau, sans jamais les mettre sérieusement sous pression pour qu'elles accordent l'indépendance à leurs colonies. Ce temps est révolu - il est temps que nous disions très clairement que nous ne tolérerons pas l'existence continue et indéfinie de puissances coloniales au sein du monde libre."
 USA_the_treaty_ports_desc:0 "Au XIXe siècle, les puissances européennes alors dominantes ont forcé le transfert de plusieurs ports chinois sous leur domination directe, afin de faciliter le commerce. Depuis lors, les Chinois sont, à juste titre, amers à propos de cet arrangement, et maintenant que le Kuomintang est nos alliés, nous devrions faire pression sur la Grande-Bretagne et le Portugal pour qu'ils restituent les ports du traité sous le contrôle chinois."
 USA_fund_shia_radicals_desc:0 "La monarchie Pahlavi en Iran est désespérément corrompue et faible. Ils sont la preuve vivante des folies du régime autocratique. Nous avons vent d'un soulèvement populiste contre la monarchie et, au nom de la liberté, nous devons soutenir ceux qui souhaitent s'affranchir de la tyrannie de l'absolutisme."
 USA_recognize_iranian_government_desc:0 "Un gouvernement stable au Moyen-Orient est d'une importance capitale. Nous ne pouvons pas nous permettre de voir une rébellion violente renverser l'ordre politique au Moyen-Orient à un moment aussi critique. Nous devons soutenir officiellement la monarchie iranienne Pahlavi contre l'insurrection visant à la renverser."
 USA_iranian_industrial_development_desc:0 "Si nous voulons que le Moyen-Orient soit stable, nous devons avoir un Iran stable et amical. Si nous voulons un Iran stable et amical, alors l'Iran doit être riche et satisfait. Il est tout à fait logique que nous investissions en Iran pour améliorer son économie."
 USA_further_deployment_to_europe1_desc:0 "Certains membres des forces armées réclament la démobilisation de nos troupes d'Europe, mais nous le savons mieux. La guerre contre les nazis est peut-être terminée, mais la nécessité pour les hommes de lutter pour la liberté ne l'est pas. Un spectre immonde hante l'Europe, le spectre du communisme. Il ne faut pas seulement refuser la démobilisation, il faut envoyer encore plus de troupes pour défendre l'Europe !"
 USA_establish_us_european_command1_desc:0 "Si nous voulons mener des opérations en Europe pour contenir l'influence soviétique, il ne suffira pas de disposer de troupes. Quatre millions de soldats ne peuvent pas être gérés correctement depuis l'autre côté de l'océan. Nous devons établir une structure de commandement militaire explicite dont le siège est en Europe, pour gérer l'organisation de nos opérations européennes."
 USA_mobilize_against_the_ussr1_desc:0 "Si nous devons entrer en guerre totale contre les Soviétiques, ce sera l'une des plus grandes entreprises que le peuple américain ait jamais assumée. Personne n'a réussi à envahir la Russie depuis l'époque des Mongols, et si nous voulons réussir, nous aurons besoin que chaque homme valide soit prêt à donner sa vie pour cette cause."
 USA_the_korean_war_draft_desc:0 "La guerre de Corée pourrait facilement devenir une affaire prolongée contre un ennemi retranché, une guerre stagnante. Nous abaisserons l'âge minimum d'enrôlement dans l'armée à 18 ans et demi, afin de disposer de plus de main-d'oeuvre pour l'effort de guerre."
 USA_mountain_assualt1_desc:0 "Les meilleures troupes américaines sont nos forces spéciales. Nous devrions étendre la formation aux opérations en montagne au plus grand nombre de soldats possible, afin de maximiser notre capacité à combattre dans les régions montagneuses du monde entier."
 USA_condemn_african_colonialism_desc:0 "Les peuples d'Afrique ont énormément souffert du fardeau du colonialisme. Il est de la plus haute importance morale de dénoncer ce mal et de faire pression sur la Grande-Bretagne, la France et le Portugal pour qu'ils accordent l'indépendance à leurs colonies africaines."
 USA_algerian_democratic_front_desc:0 "L'Algérie est un foyer de nationalisme, alors que le peuple berbère s'efforce d'obtenir son indépendance de la France. Nous devons les soutenir, pour garantir que lorsqu'ils obtiendront leur indépendance, ils seront amicaux et ouverts à une alliance avec nous."
 USA_start_uprising_algeria_desc:0 "Le moment est enfin venu. Nos alliés nationalistes algériens nous appellent depuis des mois à lancer une campagne militaire décisive contre les Français, et enfin tout est en place. Le soulèvement va commencer."
 USA_reform_our_doctrine1_desc:0 "Nous sommes sortis de la Seconde Guerre mondiale comme l'une des puissances dominantes du monde, mais notre armée de terre est inférieure à l'Armée rouge soviétique. Si nous voulons avoir une chance de freiner l'invasion soviétique en Europe, nous devons alors moderniser notre façon de penser la guerre."
 USA_grow_our_talons1_desc:0 "Notre plus grande force est notre force aérienne. L'U.S.A.F est réputée dans le monde entier pour l'excellence de son service. Nous devons nous concentrer fortement sur ce domaine, car nous ne pouvons pas nous permettre de perdre notre atout contre les Soviétiques."
 USA_amphious_warfare1_desc:0 "Le Corps des Marines des États-Unis est peut-être l'unité militaire la plus célèbre au monde. Nous devons veiller à maintenir cela et investir dans la technologie de la guerre amphibie - contrairement aux Soviétiques, nous devrons probablement opérer dans des régions du monde où nous n'avons pas de frontières terrestres, et les Marines seront essentiels à ces guerres."
 USA_american_airborne_forces1_desc:0 "Les parachutistes sont un élément essentiel de l'avenir de la guerre. En élargissant le Corps des Parachutistes, nous pouvons garantir que nous serons en mesure de déployer un important contingent d'infanterie aéroportée."
 USA_special_forces1_desc:0 "Nous n'aurons jamais la population nécessaire pour égaler celle des Soviétiques en termes de main-d'oeuvre brute, nous devons donc veiller à utiliser nos soldats de manière plus intelligente et plus efficace. À cette fin, nous devrions concentrer nos efforts sur nos divisions des forces spéciales, ce qui nous donnera un avantage en termes de flexibilité tactique sur le poids lourd russe."
 USA_expand_our_numbers1_desc:0 "L'Oncle Sam a besoin de vous ! Nous devons veiller à ce que tous les jeunes Américains soient inculqués aux vertus du patriotisme et à ce que chacun perçoive l'armée comme une entreprise glorieuse dans la défense mondiale de la liberté !"
 USA_collabrative_efforts_desc:0 "Nous devons conserver notre avance technologique sur les Soviétiques si nous voulons triompher du communisme mondial. Nous devrions collaborer plus étroitement avec nos alliés en Europe pour garantir que nous restons à la pointe de la recherche scientifique."
 USA_eagles_talons1_desc:0 "Même si nos avions de combat sont haut de gamme, ce sont les bombardiers qui nous permettent de transformer la supériorité aérienne en victoires de guerre. Nous élargirons nos recherches sur les bombardiers pour nous assurer que nous pouvons projeter la puissance aérienne partout dans le monde."
 USA_begin_a_european_recovery1_desc:0 "Les ravages causés aux pays européens par la Première Guerre mondiale ont joué un rôle majeur dans la montée du communisme et du fascisme. La leçon est claire : les idéologies extrémistes acquièrent leur pouvoir grâce à l'instabilité politique, et l'instabilité politique vient du chaos économique et de la pauvreté. Par conséquent, si nous voulons fortifier l'Europe contre le communisme, nous devons la reconstruire et l'enrichir."
 USA_nets_for_flemmish_fishermen1_desc:0 "L'industrie de la pêche flamande a été durement touchée par la guerre. Leur envoyer du matériel de pêche moderne et à la pointe de la technologie soutiendrait considérablement l'économie belge."
 USA_construction_equipment_and_engineers_to_france1_desc:0 "La France a été complètement dévastée par l'invasion et l'occupation nazie et fait face à des troubles dans son empire colonial en ruine. Nous devons envoyer des masses de matériaux de construction et d'ingénieurs en France pour reconstruire leurs infrastructures et leur économie."
 USA_rebuild_italys_auto_indsutry1_desc:0 "Même si l'Italie était une puissance de l'Axe pendant la guerre, nous devons également l'aider, car elle est plus proche que la plupart des pays d'Europe occidentale de la menace du communisme. L'industrie automobile italienne est en ruine après la guerre et nous devons investir dans les entreprises italiennes pour la relancer."
 USA_coal_exports_to_denmark1_desc:0 "Nous développerons l'industrie danoise en leur fournissant du charbon bon marché pour alimenter leurs usines."
 USA_food_distribution_to_europe1_desc:0 "Les États-Unis disposaient de vastes océans des deux côtés, empêchant toute puissance ennemie d'envahir leur continent. Ainsi, notre agriculture n'a pas été interrompue par les bombardements ni saisie par les envahisseurs. L'Europe n'a pas eu cette chance et la famine constitue un réel danger dans de nombreuses régions de France et notamment en Allemagne. Nous exporterons des quantités massives de nourriture pour aider les populations européennes qui souffrent."
 USA_consolidate_our_positions1_desc:0 "La marine américaine est la marine la plus puissante au monde, mais nous ne devons pas nous reposer sur nos lauriers quant à notre supériorité. Les Soviétiques en sont conscients et investiront probablement massivement dans leur flotte. Nous devons veiller à suivre leur rythme."
 USA_rebuild_and_modernize_our_navy1_desc:0 "Les porte-avions sont l'avenir de la guerre navale, capables de projeter la puissance aérienne à des milliers de kilomètres au-delà de toute base navale. Nous devons reconstruire notre marine autour de cette réalité."
 USA_a_truly_american_navy1_desc:0 "Notre Marine commence enfin à prendre la forme que nous lui avions envisagée. Nous poursuivrons notre programme d'expansion des porte-avions, afin que la puissance de notre flotte soit évoquée pendant des générations, tout comme la marine britannique d'autrefois."
 USA_the_macarthur_question1_desc:0 "Le général MacArthur a laissé sa renommée lui monter à la tête. Il s'est opposé à notre politique concernant la guerre de Corée, mais il a récemment rendu publiques ses critiques et mené une politique dangereusement agressive à l'égard de la Chine. Beaucoup craignent que son contrôle sur l'occupation du Japon ait fait de lui une sorte de dictateur. Il faut lui rappeler qu'il rend compte au Président."
 USA_a_rebuilt_europe1_desc:0 "L'Europe s'est relevée des cendres de la guerre, grâce aux investissements américains. Les pays d'Europe occidentale commencent à se redresser et leurs économies montrent des signes de croissance sans précédent depuis des années. La prochaine étape logique consiste à investir dans les routes et les chemins de fer européens, afin que cette nouvelle richesse puisse circuler plus librement."
 USA_a_new_threat1_desc:0 "La menace soviétique constitue la plus grande menace pour la liberté à laquelle le monde libre ait été confronté depuis la chute du nazisme. L'Europe occidentale constitue un rempart vital contre la propagation du communisme. Nous avons renforcé l'Europe de telle sorte que les troubles économiques ne la pousseront probablement pas dans les bras de Moscou, mais nous devons également l'armer, afin qu'elle puisse se défendre contre une agression plus directe."
 USA_call_for_nato_members_to_return_treaty_ports_roc_desc:0 "Maintenant que la République de Chine est notre alliée, il est vraiment inexcusable que des membres de l'OTAN détiennent injustement des terres chinoises. Nous demanderons aux Européens de restituer les ports du Traité à la Chine."
 USA_iranian_civil_war_desc:0 "Le soutien aux rebelles anti-Pahlavi a énormément augmenté en Iran. Le moment est désormais venu pour une révolution de renverser la monarchie."
 USA_arm_greek_government_desc:0 "Les Grecs ont déjà souffert des insurgés communistes. Nous devons leur envoyer des armes et des fournitures pour garantir que le Kremlin ne puisse pas mettre le pied dans la Méditerranée."
 USA_economic_aid_to_greece_desc:0 "L'économie grecque est en ruine après la Seconde Guerre mondiale et la guerre civile communiste qui a suivi. Nous devons leur fournir une aide économique pour garantir que le peuple grec n'aura pas besoin de se tourner vers le communisme pour son salut."
 USA_invite_greece_and_turkey_nato_desc:0 "La Grèce et la Turquie sont vulnérables, étant donné leur proximité avec la Russie et les autres pays du Pacte de Varsovie. Nous devons déployer des efforts politiques et diplomatiques considérables pour garantir leur protection et leur intégration au reste de nos alliés. Les inviter à l'OTAN est un moyen d'atteindre ces deux objectifs."
 USA_McCarran_internal_security_act_desc:0 "Nous devons toujours nous méfier de l'influence des organisations communistes sur notre grand pays. Nous adopterons une loi exigeant que toutes les organisations communistes s'enregistrent auprès du gouvernement, et faciliterons la recherche et la poursuite des personnes soupçonnées de subversion ou d'espionnage contre nos libertés démocratiques."
 USA_join_anti_communist_movement_desc:0 "Jusqu'à présent, nous avons été trop indulgents envers les Reds. Des boycotts ? Endiguement? Au mieux des demi-mesures ! Nous devons consacrer notre nation avec enthousiasme à la destruction explicite du communisme mondial."
 USA_purge_state_department_desc:0 "Le Département d'État est rempli d'espions communistes et mêlé aux réseaux d'espionnage. Nous devons éliminer de notre gouvernement tous ceux qui chercheraient à vendre la nation aux Soviétiques."
 USA_civil_rights_act_of_1959_desc:0 "Les inégalités raciales dans la société américaine sont une tragédie et une injustice (sans parler du fait que les communistes l'utilisent fréquemment comme un club rhétorique pour nous battre). Nous devons chercher à éliminer les lois électorales techniquement légales mais manifestement discriminatoires dans le Sud, qui privent pratiquement les non-Blancs de leurs droits."
 USA_subvert_democratic_system_desc:0 "L'équilibre des pouvoirs au sein du gouvernement américain constitue une menace pour la stabilité mondiale. Comment l'Amérique peut-elle espérer défendre le monde contre le communisme si nous paralysons délibérément notre propre gouvernement ? Nous devons éliminer tous les obstacles au pouvoir de la présidence."
 USA_military_junta_desc:0 "Même si la démocratie est une tradition américaine séculaire, nous avons plus que jamais besoin de stabilité. Comme l'a dit un jour Abraham Lincoln, on ne change pas de cheval en cours de route, et on ne change pas de chef pendant une guerre. Nous sommes en guerre contre le communisme et le serons dans un avenir proche. Nous devons assurer la stabilité nécessaire pour gagner cette guerre."
 USA_spread_fascism_desc:0 "Nos alliés ne sont pas suffisamment motivés dans la lutte contre les Rouges, et nombre d'entre eux préféreraient des politiques d'apaisement plutôt que de résoudre le problème. Imbéciles ! Ne se souviennent-ils pas de ce qui s'est passé la dernière fois qu'ils ont tenté d'apaiser un dictateur ? Nous devons faire en sorte que le monde libre soit dirigé par des hommes plus forts et plus dynamiques."
 USA_crusade_agaisnt_communism_desc:0 "Le moment est enfin venu. Nous sommes prêts, nos armées sont prêtes et nos alliés se sont préparés. Aujourd'hui, nous nous engageons dans la plus grande guerre jamais menée dans l'histoire de l'humanité. Aujourd'hui, nous nous lançons dans une grande croisade contre le mal et la tyrannie comme celle-ci n'a jamais été et ne sera peut-être jamais égalée. Gloire, Gloire Alléluia ! Victoire des États-Unis !"
 USA_show_trials_on_opposition_figures_desc:0 "McCarthy s'est constamment heurté à l'opposition des traîtres communistes dans sa noble quête visant à protéger l'Amérique de la subversion. Maintenant qu'il est président, il a enfin le pouvoir de se débarrasser de tous les traîtres qui voulaient détruire l'Amérique."
 USA_embrace_nationalism_desc:0 "Depuis trop longtemps, le peuple américain a honte d'être qualifié de nationaliste. Ils associent ce terme au racisme, à la rhétorique du sang et du sol et aux guerres inutiles. C'est complètement faux ! Le nationalisme signifie simplement l'amour de votre pays ! Nous devons opposer à l'internationalisme plaintif des communistes un esprit nationaliste au sang rouge."
 USA_paramilitary_american_legion_desc:0 "La Légion américaine est une société honorable pour nos anciens combattants, mais nous ne voyons aucune raison pour que leurs compétences soient gaspillées. Nous transformerons la Légion américaine en une force unifiée et patriotique de guerriers qualifiés, sous la supervision personnelle de McCarthy."
 USA_outlaw_leftist_opposition_desc:0 "Le deuxième pire ennemi de l'Amérique est le libéralisme, car le libéralisme mène inévitablement au communisme. N'est-ce pas les libéraux qui ont fait obstacle aux tentatives de McCarthy de purger l'Amérique des communistes, sous leurs lamentations sur les pentes glissantes et les droits de conscience ? Pour sauvegarder la sécurité de l'Amérique, toutes les organisations de gauche doivent être interdites."
 USA_isolationism_desc:0 "L'intervention américaine dans la Seconde Guerre mondiale était un mal nécessaire à la destruction du nazisme. Nous n'avons rien promis de plus et nous ne donnerons rien de plus. Le président Taft est déterminé à sortir l'Amérique de ses enchevêtrements en Europe. Après tout, nous devons d'abord servir et protéger l'Amérique."
 USA_asian_pivot_desc:0 "Le président Taft a décidé qu'il serait bien plus avantageux pour l'Amérique de se concentrer sur la coopération avec ses alliés de la côte du Pacifique, plutôt que de s'engager dans une guerre terrestre vouée à l'échec avec les Russes en Europe."
 USA_pacifica_desc:0 "Nous devons formaliser nos relations avec nos alliés du Pacifique en une véritable alliance : l'Organisation du Traité du Pacifique."
 USA_stevenson_presidency_desc:0 "Adlai Stevenson a remporté la présidence et prévoit de mettre en oeuvre de vastes réformes économiques et sociales."
 USA_kefauver_presidency_desc:0 "Estes Kefauver a remporté la présidence et va sévir contre les trusts des grandes entreprises et le crime organisé."
 USA_macarthur_presidency_desc:0 "Douglas MacArthur a remporté la présidence, fort de sa réputation de héros de guerre. Il envisage de consacrer toute la nation américaine à la destruction du communisme."
 USA_eisenhower_presidency_desc:0 "Dwight Eisenhower a remporté la présidence et a l'intention de s'opposer fermement au communisme mondial par le biais de la coopération internationale et de politiques de guerre nucléaire de représailles massives."
 USA_taft_presidency_desc:0 "Robert Taft Jr. a remporté la présidence et envisage de sortir l'Amérique du fouillis de la politique européenne."
 USA_the_deutsche_mark1_desc:0 "La monnaie allemande a été, sans surprise, complètement ruinée par la défaite de la guerre. Depuis lors, les Allemands ont recours aux cigarettes américaines comme monnaie d'échange et le marché noir est florissant. L'Allemagne ne sera jamais reconstruite si cela continue ainsi. Dans le cadre du Plan Marshall, nous devons réintroduire en Allemagne une véritable monnaie soutenue par les États-Unis."
 USA_final_year_of_eisenhowers_presidency_desc:0 "Au cours de ses nombreuses années au Bureau Ovale, Dwight D. Eisenhower a été témoin de nombreuses crises et troubles : soulèvements, révolutions, création de la NASA et construction de l'immense autoroute Interstate. Aujourd'hui, alors que la dernière année de sa présidence approche, il se prépare pour un dernier voyage à la barre du navire d'État."
 USA_the_space_race_desc:0 "En 1957, l'URSS a lancé Spoutnik, le tout premier satellite artificiel. Cela a terrifié notre peuple : notre sécurité dépend de notre supériorité technologique sur les Soviétiques, et ce lancement a soulevé des doutes sur cette supériorité. En réponse, nous avons créé la NASA et développons notre propre programme spatial. Nous devons gagner cette course vers les étoiles, pour apaiser les esprits de notre peuple."
 USA_nuclear_program_desc:0 "La guerre froide sera gagnée par celui qui possède le plus de missiles nucléaires. Nous devons veiller à ce que notre arsenal nucléaire reste le meilleur au monde, afin que les Soviétiques aient toujours des raisons de craindre notre colère."
 USA_elections_of_1964_desc:0 "Le mandat du Président est enfin terminé et de nouvelles élections doivent avoir lieu. Cette élection devrait être disputée à parts égales entre questions sociales et politique étrangère, les deux candidats les plus prometteurs étant le démocrate Lyndon Johnson et le républicain Barry Goldwater. Cependant, on ne peut jamais savoir si un candidat surprise va apparaître..."
 USA_The_Election_of_1968_desc:0 "Il est temps une fois de plus d'aller aux urnes pour décider qui dirigera notre grande nation. Les candidats les plus prometteurs sont le démocrate Hubert Humphrey et le républicain Richard Nixon, bien que George Wallace, un indépendant de l'Alabama, ait également annoncé son intention de se présenter."
 USA_The_Election_of_1972_desc:0 "Il est temps une fois de plus d'aller aux urnes pour décider qui dirigera notre grande nation."
 USA_the_CIA_desc:0 "Nous ne gagnerons jamais la guerre froide sans un service de renseignement puissant. L'espionnage revêt une importance capitale, tant pour voler les secrets de nos ennemis que pour empêcher les espions russes de voler nos secrets. Nous devons étendre massivement les fonctions de la CIA afin d'assurer notre sécurité."
 USA_The_Civil_Rights_Movement_desc:0 "Malgré les efforts déployés à la fin de la décennie précédente, les noirs et les autres groupes minoritaires souffrent encore énormément de discrimination dans notre pays. Le mécontentement populaire s'est accru ces dernières années et s'est transformé en un véritable mouvement social. Reste à savoir si ce mouvement suivra la voie d'une résistance pacifique ou violente."
 president_taft:0 "Robert A. Taft a remporté les élections présidentielles américaines de 1952"
 president_taft_56:0 "Robert A. Taft a remporté les élections présidentielles américaines de 1956"
 president_eisenhower:0 "Dwight D. Eisenhower a remporté les élections présidentielles américaines"
 president_eisenhower_56:0 "Dwight D. Eisenhower a remporté les élections présidentielles américaines de 1956"
 president_stevenson:0 "Adlai Stevenson II a remporté les élections présidentielles américaines de 1954"
 president_stevenson_56:0 "Adlai Stevenson II a remporté les élections présidentielles américaines de 1956"
 president_kefauver:0 "Estes Kefauver a remporté les élections présidentielles américaines de 1954"
 president_kefauver_56:0 "Estes Kefauver a remporté les élections présidentielles américaines de 1956"
 president_macarthur:0 "Douglas MacArthur a remporté les élections présidentielles américaines de 1954"
 president_macarthur_56:0 "Douglas MacArthur a remporté les élections présidentielles américaines de 1956"
 president_mccarthy:0 "Joseph McCarthy a remporté les élections présidentielles américaines de 1956"
 nixon_60:0 "Richard Nixon a remporté les élections présidentielles américaines de 1960"
 #JFK_Mafia.1.d:0 "Coming from a wealthy, Roman Catholic, New England family, John F. Kennedy was expected by many analysts and experts to be a friend to, or at least turn an eye towards, organized crime and mafia gangs. However, today the President announced a renewed series of investigations into organized crime in the style of the Kefauver hearings in the early 50's. This is an expected change of policy."
 jfk_60:0 "John Fitzgerald Kennedy a remporté les élections présidentielles américaines de 1960"
 humphrey_60:0 "Hubert Humphrey II a remporté les élections présidentielles américaines de 1960"
 humphrey_64:0 "Hubert Humphrey II a remporté les élections présidentielles américaines de 1964"
 lutherking_64:0 "Martin Luther King Jr. a remporté les élections présidentielles américaines de 1964"
