 USA_70s_Select_a_VFX_Program_Winner:0 "Sélectionnez un gagnant du programme VFX"
 USA_70s_Big_Cats_Big_Decks:0 "Grands ponts de grands félins"
 USA_70s_Advanced_S_3_Viking_Capabilities:0 "Capacités avancées du S 3 Viking"
 USA_70s_Strategic_Bomber_Command_Restructure:0 "Restructuration du Commandement des bombardiers stratégiques"
 USA_70s_Cancel_the_XB_70:0 "Annuler le XB 70"
 USA_70s_Big_Four_B_52_Enhancement:0 "Amélioration du Big Four B 52"
 USA_70s_Evaluate_Vietnam_War_Air_Combat_Experiences:0 "Évaluer les expériences de combat aérien de la guerre du Vietnam"
 USA_70s_Evaluate_Vietnam_War_Air_Combat_Experiences_desc:0 "La supériorité aérienne, le soutien au sol et les bombardements stratégiques ont tous joué un rôle important dans le conflit du Vietnam, mais nous avons également subi de lourdes pertes et avons trouvé certains de nos modèles d'avions mieux adaptés à une époque de guerre antérieure. Nous devons utiliser les leçons apprises au Vietnam pour concevoir une nouvelle génération d'avions de combat pour une nouvelle génération de guerre."
 USA_70s_The_F_15_Eagle:0 "L'Aigle F-15"
 USA_70s_The_F_15_Eagle_desc:0 "Créé en réponse au chasseur soviétique MiG-25, le McDonnell Douglas F-15 Eagle est le chasseur du futur. Ses moteurs puissants sont capables de grimper 30 000 pieds en une minute et d'accélérer verticalement en situation de combat, tandis que son pilote a accès à un ordinateur de vol numérique et au meilleur du radar et de l'avionique."
 USA_70s_The_M1_Abrams:0 "Le M1 Abrams"
 USA_70s_The_M1_Abrams_desc:0 "Le M60 Patton est un excellent char, mais le nouveau T-72 soviétique le fait sortir du parc. Nous avons besoin d'un char moderne doté de la puissance de feu du Patton, mais doté de la mobilité et de la protection nécessaires pour affronter les nouveaux jouets de Moscou."
