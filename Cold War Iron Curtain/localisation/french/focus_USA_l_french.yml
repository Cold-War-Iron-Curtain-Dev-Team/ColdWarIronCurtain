# USA McGovern 1976 NASA Desc
 USA_MCGOVERN76_Privitize_NASA_desc:0 "Avec l'ère Apollo derrière nous et le resserrement des budgets fédéraux, le maintien d'une bureaucratie spatiale étatique pléthorique n'est plus tenable. En déréglementant les contrats aérospatiaux et en ouvrant les opérations de lancement orbital aux entreprises privées, nous pouvons réduire les dépenses fédérales tout en favorisant un secteur dynamique des vols spatiaux commerciaux."

 # USA Rockefeller 1976 Focus Tree
 USA_ROCKEFELLER76_The_Rockefeller_Administration:0 "L'administration Rockefeller"
 USA_ROCKEFELLER76_The_Rockefeller_Administration_desc:0 "Avec Nelson Rockefeller accédant à la présidence après des années de turbulences politiques, un nouveau chapitre s'ouvre pour le Parti républicain et la nation. Défendant l'éthos progressiste et pragmatique de l'establishment républicain de l'Est, le président Rockefeller s'engage à équilibrer la revitalisation économique, la responsabilité sociale et le leadership international."
 USA_ROCKEFELLER76_Purge_Rumsfeld_and_Cheney:0 "Purger Rumsfeld et Cheney"
 USA_ROCKEFELLER76_Purge_Rumsfeld_and_Cheney_desc:0 "Les piliers conservateurs Donald Rumsfeld et Dick Cheney représentent une faction dure fondamentalement en contradiction avec la vision modérée du président Rockefeller. Les retirer de leurs fonctions de cabinet et de chef de cabinet freine de manière décisive l'obstructionnisme conservateur dans l'aile ouest et consolide le contrôle républicain libéral."
 USA_ROCKEFELLER76_Cut_Interest_Rates:0 "Réduire les taux d'intérêt"
 USA_ROCKEFELLER76_Cut_Interest_Rates_desc:0 "La stagnation de la croissance économique et le resserrement du crédit ont étranglé les investissements en capital dans tout le coeur des États-Unis. Travaillant de concert avec la Réserve fédérale, l'administration abaisse les taux d'intérêt de référence, stimulant ainsi la construction, l'expansion des entreprises et des prêts à la consommation abordables."
 USA_ROCKEFELLER76_Enforce_Civil_Rights_Law:0 "Appliquer la loi sur les droits civils"
 USA_ROCKEFELLER76_Enforce_Civil_Rights_Law_desc:0 "Rockefeller est depuis longtemps un ardent défenseur de l'égalité raciale et des droits civils constitutionnels. En ordonnant au ministère de la Justice de poursuivre vigoureusement les violations de la déségrégation et les obstructions au droit de vote, nous réaffirmons l'engagement inébranlable du gouvernement fédéral en faveur d'une protection égale devant la loi."
 USA_ROCKEFELLER76_Safe_Streets_Act:0 "Loi sur la lutte contre la criminalité et la sécurité des rues"
 USA_ROCKEFELLER76_Safe_Streets_Act_desc:0 "La hausse des taux de criminalité urbaine exige un soutien fédéral sans éroder les libertés civiles. La Safe Streets Act achemine les subventions fédérales directement vers les services de police municipaux, finançant la modernisation médico-légale, les initiatives de police communautaire et l'amélioration de l'administration des tribunaux."
 USA_ROCKEFELLER76_Expand_Infrastructure_Funding:0 "Augmenter le financement des infrastructures"
 USA_ROCKEFELLER76_Expand_Infrastructure_Funding_desc:0 "Des systèmes de transports urbains en ruine aux autoroutes interétatiques usées, les infrastructures américaines nécessitent une modernisation urgente. Un programme massif d'amélioration des immobilisations injectera des dollars fédéraux dans les autoroutes, les ponts, les voies navigables et les transports en commun, jetant ainsi les bases de décennies d'expansion économique."
 USA_ROCKEFELLER76_Implement_Temporary_Wage_Controls:0 "Mettre en oeuvre des contrôles temporaires des salaires"
 USA_ROCKEFELLER76_Implement_Temporary_Wage_Controls_desc:0 "Les spirales inflationnistes persistantes menacent de détruire les revenus réels des travailleurs. Pour briser la psychologie des hausses perpétuelles des prix sans effondrer le marché du travail, l'administration a institué des lignes directrices temporaires de stabilisation des salaires et des prix."
 USA_ROCKEFELLER76_Propose_Amendment_to_End_the_Natural_Born_American_Clause:0 "Proposer un amendement aux citoyens nés"
 USA_ROCKEFELLER76_Propose_Amendment_to_End_the_Natural_Born_American_Clause_desc:0 "Dans une nation bâtie par des immigrés, exclure les citoyens naturalisés de la présidence est une relique obsolète. Le président Rockefeller introduit un amendement constitutionnel historique pour ouvrir l'éligibilité aux fonctions exécutives à tous les citoyens américains de longue date - un geste d'inclusivité qui ouvre également la voie à des alliés clés comme Henry Kissinger."
 USA_ROCKEFELLER76_Ethics_in_Government_Act:0 "Loi sur l'éthique dans le gouvernement"
 USA_ROCKEFELLER76_Ethics_in_Government_Act_desc:0 "À l'ombre du Watergate, la confiance du public dans les institutions fédérales reste fragile. Cette réforme historique impose des exigences strictes en matière de divulgation financière aux agents publics, établit une surveillance par un inspecteur général indépendant et freine la porte tournante du lobbying post-gouvernemental."
 USA_ROCKEFELLER76_Energy_Security_Act:0 "Loi sur la sécurité énergétique"
 USA_ROCKEFELLER76_Energy_Security_Act_desc:0 "Les embargos pétroliers de ces dernières années ont démontré les graves dangers de la dépendance aux combustibles étrangers. L'Energy Security Act encourage les carburants synthétiques nationaux, augmente les réserves stratégiques de pétrole et promeut le développement d'énergies industrielles propres à travers les États-Unis."
 USA_ROCKEFELLER76_Establish_Enviromental_Protection_Taskforce:0 "Créer un groupe de travail sur la protection de l'environnement"
 USA_ROCKEFELLER76_Establish_Enviromental_Protection_Taskforce_desc:0 "S'appuyant sur son bilan en tant que gouverneur de New York, le président Rockefeller crée un groupe de travail fédéral spécialisé sur l'environnement pour préserver les parcs nationaux, nettoyer les voies navigables et étendre les sanctuaires de conservation sur les terres publiques."
 USA_ROCKEFELLER76_Nuclear_Waste_Policy_Act:0 "Loi sur la politique en matière de déchets nucléaires"
 USA_ROCKEFELLER76_Nuclear_Waste_Policy_Act_desc:0 "À mesure que l'énergie nucléaire se développe pour répondre à la demande croissante du réseau électrique américain, l'élimination sûre à long terme des déchets radioactifs devient essentielle. Cette loi établit la responsabilité fédérale en matière de protocoles de recherche et d'élimination dans les dépôts souterrains permanents."
 ROCKEFELLER76_Rockefeller_Drug_Bill:0 "Initiative Rockefeller sur la loi sur les drogues"
 ROCKEFELLER76_Rockefeller_Drug_Bill_desc:0 "Le trafic d'héroïne et de stupéfiants a dévasté les quartiers défavorisés. Adaptant les lois antidrogue de New York, signature de Rockefeller, à la loi fédérale, cette mesure introduit des lignes directrices strictes en matière de peines obligatoires ainsi que des investissements majeurs dans les centres de réadaptation gérés par l'État."
 ROCKEFELLER76_Public_Works_Investment_Act:0 "Loi sur les investissements dans les travaux publics"
 ROCKEFELLER76_Public_Works_Investment_Act_desc:0 "La relance économique ne peut pas reposer uniquement sur des incitations fiscales ; les investissements fédéraux directs sont essentiels dans les régions en difficulté. Cette législation finance des projets municipaux d'approvisionnement en eau, des bâtiments civiques et la rénovation des ports, remettant directement au travail des milliers d'Américains au chômage."
 ROCKEFELLER76_Expand_Medicaid:0 "Élargir la couverture Medicaid"
 ROCKEFELLER76_Expand_Medicaid_desc:0 "L'accès aux soins de santé ne doit pas être un privilège réservé aux seuls riches. L'expansion des fonds fédéraux de contrepartie pour les programmes d'État Medicaid étend la couverture à des millions de familles à faible revenu, de personnes âgées et de travailleurs handicapés à travers le pays."
 ROCKEFELLER76_Staggs_Railroad_Act:0 "Loi sur la déréglementation ferroviaire échelonnée"
 ROCKEFELLER76_Staggs_Railroad_Act_desc:0 "Les chemins de fer de fret américains sont étouffés par les contrôles archaïques des tarifs de l'Interstate Commerce Commission. La déréglementation des tarifs de fret permet aux transporteurs ferroviaires de rivaliser de manière dynamique avec le transport routier, en injectant des capitaux privés dans les corridors de fret vitaux."
 USA_ROCKEFELLER76_Invest_in_Nuclear_Energy:0 "Investir dans l'énergie nucléaire"
 USA_ROCKEFELLER76_Invest_in_Nuclear_Energy_desc:0 "La fission nucléaire offre une énergie électrique de base propre, capable d'alimenter l'industrie américaine pendant des générations. En rationalisant les licences fédérales et en finançant la conception avancée des réacteurs, nous accélérons la transition vers une énergie atomique propre."
 ROCKEFELLER76_Sideline_the_Reagenites:0 "Mettre les reaganiens sur la touche"
 ROCKEFELLER76_Sideline_the_Reagenites_desc:0 "L'insurrection conservatrice menée par Ronald Reagan menace d'entraîner le Grand Old Party dans une rigidité idéologique. En consolidant les alliances progressistes du Parti Républicain et en nommant des modérés à des postes judiciaires et fédéraux clés, Rockefeller cimente la suprématie de l'aile modérée sur la direction du parti."
 ROCKEFELLER76_Comprehensive_Crime_Control_Act:0 "Loi sur la lutte globale contre la criminalité"
 ROCKEFELLER76_Comprehensive_Crime_Control_Act_desc:0 "La modernisation du Code criminel fédéral nécessite un équilibre entre des peines fermes et une réforme systémique. Cette législation réforme les lois fédérales sur la libération sous caution, étend la protection des témoins et équipe les forces de l'ordre d'outils anti-racket sophistiqués."
 ROCKEFELLER76_Combat_Unemployment:0 "Combattre le chômage structurel"
 ROCKEFELLER76_Combat_Unemployment_desc:0 "L'évolution de la dynamique industrielle a laissé les centres de fabrication de la Rust Belt vulnérables. Un programme fédéral ciblé de reconversion professionnelle et d'apprentissage comble le fossé entre les secteurs émergents de haute technologie et les travailleurs industriels au chômage."
 ROCKEFELLER76_Commercial_Space_Launch_Act:0 "Loi sur le lancement d'espaces commerciaux"
 ROCKEFELLER76_Commercial_Space_Launch_Act_desc:0 "La conquête spatiale ne doit pas rester le domaine exclusif des agences fédérales. En établissant un cadre de licences de lancement commercial, nous permettons aux entreprises aérospatiales américaines d'être pionnières dans le déploiement de satellites privés et de fusées commerciales."

 # USA Connally 1980 Focus Tree
 USA_CONNALLY_The_Connally_Administration:0 "L'administration Connally"
 USA_CONNALLY_The_Connally_Administration_desc:0 "John Connally apporte au Bureau Ovale l'audace texane, un sens aigu de l'exécutif et une philosophie de gouvernance résolument affirmée. En promettant une politique étrangère musclée et un leadership intérieur décisif, le président Connally entreprend de restaurer la confiance en soi des États-Unis."
 USA_CONNALLY_Executive_Order_12333:0 "Décret exécutif 12333"
 USA_CONNALLY_Executive_Order_12333_desc:0 "Le président Connally publie le décret 12333, supprimant les restrictions imposées aux agences de renseignement américaines après le Watergate. Autorisant une collecte renforcée de renseignements étrangers et des opérations secrètes, l'ordonnance réaffirme l'autorité présidentielle en matière de défense nationale."
 USA_CONNALLY_Escalate_the_War_on_Drugs:0 "Intensifier la guerre contre la drogue"
 USA_CONNALLY_Escalate_the_War_on_Drugs_desc:0 "Les cartels internationaux des stupéfiants constituent une menace existentielle pour la santé publique américaine et la sécurité des frontières. Mobilisant les forces de l'ordre fédérales, la Garde côtière et la surveillance radar militaire, Connally lance une offensive agressive contre les réseaux de trafic de drogue."
 USA_CONNALLY_Sanction_Japanese_Manufacturers:0 "Sanctionner les fabricants japonais"
 USA_CONNALLY_Sanction_Japanese_Manufacturers_desc:0 "La concurrence déloyale, les subventions prédatrices et la manipulation monétaire par les conglomérats industriels japonais ont mis à mal l'industrie sidérurgique et automobile américaine. Connally impose des sanctions commerciales en représailles ciblées pour protéger l'industrie lourde nationale."
 USA_CONNALLY_Slash_Enviromental_Regulations_and_Funding:0 "Réduire les réglementations et le financement environnementaux"
 USA_CONNALLY_Slash_Enviromental_Regulations_and_Funding_desc:0 "Les mandats trop zélés de l'Agence de protection de l'environnement ont paralysé le développement et la fabrication énergétiques. L'élimination des formalités administratives et la réduction des budgets d'application de l'EPA libèrent les producteurs d'énergie nationaux et l'industrie lourde."
 USA_CONNALLY_Agriculture_and_Food_Act_of_1981:0 "Loi sur l'agriculture et l'alimentation de 1981"
 USA_CONNALLY_Agriculture_and_Food_Act_of_1981_desc:0 "Les exploitations familiales américaines sont confrontées à une grave crise du crédit et à la volatilité des prix mondiaux des matières premières. Cette législation omnibus restructure les programmes fédéraux de soutien aux cultures, les garanties de crédit à l'exportation et les mécanismes de stabilisation des prix des produits laitiers."
 USA_CONNALLY_Automanufacturing_Domestic_Content_Bill:0 "Loi sur le contenu national sur l'automobile"
 USA_CONNALLY_Automanufacturing_Domestic_Content_Bill_desc:0 "Pour stopper la fuite des emplois d'assemblage automobile à l'étranger, cette mesure exige que les automobiles vendues aux États-Unis contiennent un pourcentage élevé de pièces produites dans le pays et de main-d'oeuvre syndicale, revitalisant ainsi les chaînes d'assemblage de Détroit."
 USA_CONNALLY_Reinstate_the_Pay_Board_and_Price_Commission:0 "Rétablir le Conseil des salaires et la Commission des prix"
 USA_CONNALLY_Reinstate_the_Pay_Board_and_Price_Commission_desc:0 "S'appuyant sur son expérience en tant que secrétaire au Trésor lors des chocs Nixon, Connally relance les organismes fédéraux de surveillance des salaires et des prix pour mettre un terme à une inflation galopante poussée par les coûts et restaurer la stabilité des négociations collectives industrielles."
 USA_CONNALLY_Encourage_Southern_Democratic_Defections:0 "Encourager les défections démocratiques du Sud"
 USA_CONNALLY_Encourage_Southern_Democratic_Defections_desc:0 "En tant qu'ancien gouverneur démocrate du Texas qui a traversé les lignes partisanes, Connally entretient des relations uniques avec les démocrates conservateurs du Sud. Cultiver des alliances avec les « charançons de la capsule » fracture la majorité démocrate au Congrès et construit une coalition gouvernementale conservatrice dominante."
 USA_CONNALLY_Expand_the_National_Library_Fund:0 "Élargir le Fonds de la Bibliothèque nationale"
 USA_CONNALLY_Expand_the_National_Library_Fund_desc:0 "Une république prospère nécessite des citoyens informés. L'expansion des subventions fédérales aux réseaux de bibliothèques publiques, aux archives de recherche et aux collections universitaires préserve le patrimoine culturel américain et enrichit les ressources éducatives régionales."
 USA_CONNALLY_Tourism_Development_Incentive_Act:0 "Loi d'incitation au développement du tourisme"
 USA_CONNALLY_Tourism_Development_Incentive_Act_desc:0 "Le tourisme et l'hôtellerie représentent des secteurs en croissance rapide capables de revitaliser les économies nationales et locales. Cette législation offre des crédits d'impôt et un soutien promotionnel fédéral pour encourager les voyages intérieurs, le tourisme dans les parcs nationaux et les visites internationales."
 USA_CONNALLY_Garn_St_Germain_Depository_Institutions_Act:0 "Garn-St. Loi sur les institutions de dépôt Germain"
 USA_CONNALLY_Garn_St_Germain_Depository_Institutions_Act_desc:0 "Pour sauver les institutions d'épargne et les banques commerciales confrontées à une inflation élevée et à une fuite des dépôts, cette législation déréglemente le secteur de l'épargne et du crédit, permettant aux prêteurs de proposer des prêts hypothécaires à taux variable et des prêts commerciaux diversifiés."
 USA_CONNALLY_Tax_Equity_and_Fiscal_Responsibility_Act_of_1982:0 "Loi sur l'équité fiscale et la responsabilité financière"
 USA_CONNALLY_Tax_Equity_and_Fiscal_Responsibility_Act_of_1982_desc:0 "La spirale des déficits fédéraux nécessite une discipline budgétaire. TEFRA comble les lacunes des entreprises, renforce l'application de la conformité fiscale et annule certaines annulations d'amortissement tout en préservant les incitations essentielles à la formation de capital."
 USA_CONNALLY_Social_Security_Amendments_of_1983:0 "Modifications de la sécurité sociale de 1983"
 USA_CONNALLY_Social_Security_Amendments_of_1983_desc:0 "L'insolvabilité projetée du Fonds fiduciaire d'assurance-vieillesse et survivants exige une résolution bipartite. En ajustant progressivement les seuils d'âge de la retraite et en restructurant les barèmes des charges sociales, nous garantissons la solvabilité de la Sécurité sociale pour les générations futures."
 USA_CONNALLY_Hike_Domestic_Works_Funding:0 "Augmenter le financement des travaux domestiques"
 USA_CONNALLY_Hike_Domestic_Works_Funding_desc:0 "La reconstruction des ports, des voies navigables et des infrastructures énergétiques améliore directement la sécurité nationale et la production industrielle. L'augmentation du financement des projets fédéraux de travaux de génie civil injecte de la vitalité dans les corridors industriels stratégiques du Sud et du Midwest."
 USA_CONNALLY_Comprehensive_Crime_Control_Act:0 "Loi sur la lutte globale contre la criminalité"
 USA_CONNALLY_Comprehensive_Crime_Control_Act_desc:0 "Renforçant les normes fédérales de justice pénale, ce projet de loi global établit des lignes directrices fédérales en matière de détermination des peines, élimine la libération conditionnelle dans le système fédéral et étend la confiscation d'actifs contre les entreprises criminelles organisées."
 USA_CONNALLY_Propose_Temporary_10_Percent_Tarriff_Increase:0 "Proposer une majoration tarifaire temporaire de 10 %"
 USA_CONNALLY_Propose_Temporary_10_Percent_Tarriff_Increase_desc:0 "Faisant écho à la surtaxe historique à l'importation de 1971, Connally propose un droit de douane d'urgence de 10 pour cent sur les importations de produits manufacturés étrangers pour protéger les travailleurs américains et forcer les concurrents étrangers à ouvrir leurs marchés intérieurs fermés aux exportations américaines."
 USA_CONNALLY_What_to_do_about_AIDS:0 "Faire face à la crise sanitaire émergente"
 USA_CONNALLY_What_to_do_about_AIDS_desc:0 "Un syndrome d'immunodéficience mystérieux et mortel a commencé à se propager à travers le pays. L'administration doit déterminer la réponse fédérale en matière de santé publique, en équilibrant le financement de la recherche épidémiologique avec des avertissements prudents en matière de santé publique."
 USA_CONNALLY_National_Minimum_Drinking_Age_Act:0 "Loi nationale sur l'âge minimum pour boire de l'alcool"
 USA_CONNALLY_National_Minimum_Drinking_Age_Act_desc:0 "Les décès de jeunes automobilistes en état d'ébriété au volant ont atteint des proportions tragiques. En liant le financement fédéral de la construction d'autoroutes à l'adoption d'un âge minimum légal pour boire de l'alcool fixé à 21 ans, nous protégeons des vies sur les routes américaines."
 USA_CONNALLY_Deficit_Reduction_Act_of_1984:0 "Loi sur la réduction du déficit de 1984"
 USA_CONNALLY_Deficit_Reduction_Act_of_1984_desc:0 "Équilibrer le grand livre fédéral nécessite une action législative décisive. Ce plan budgétaire global freine les dépenses discrétionnaires, modernise la collecte des droits d'accise et réduit l'inflation des coûts sociaux afin de réduire le fardeau de la dette nationale."
 USA_CONNALLY_Push_to_Strip_the_Courts_of_Jurdistriction_Over_School_Prayer_and_Abortion:0 "Supprimer la compétence judiciaire sur les questions sociales"
 USA_CONNALLY_Push_to_Strip_the_Courts_of_Jurdistriction_Over_School_Prayer_and_Abortion_desc:0 "Frustré par les décisions militantes de la Cour fédérale sur la prière scolaire et la politique sociale, Connally défend l'autorité du Congrès en vertu de l'article III de la Constitution pour restreindre la compétence d'appel sur les questions morales et étatiques controversées."

 # Connally Act Idea and Tooltip
 Tourism_Development_Incentive_Act_idea:0 "Loi d'incitation au développement du tourisme"
 Tourism_Development_Incentive_Act_idea_desc:0 "Les incitations fiscales fédérales et le développement des infrastructures pour les parcs nationaux et le tourisme régional stimulent la diversification économique et l'emploi dans les services."
 Tourism_Development_Incentive_Act_Vote_TT:0 "§YPermettre le vote§! sur la loi d'incitation au développement touristique §C§!"

 # Foreign Policy 1984 Article V
 USA_FP84_Invoke_Article_V:0 "Invoquer l'article V"
 USA_FP84_Invoke_Article_V_desc:0 "L'escalade de l'agression libyenne contre nos forces et nos partenaires régionaux ne peut plus être combattue par une dissuasion passive. En invoquant l'article V du Traité de l'Atlantique Nord, nous appelons nos alliés européens à s'unir dans une défense collective contre le terrorisme parrainé par l'État, cimentant ainsi la détermination de l'OTAN à travers la Méditerranée."

 # Agnew 1980 EO 12333
 USA_AGNEW80_Executive_Order_12333:0 "Décret exécutif 12333"
 USA_AGNEW80_Executive_Order_12333_desc:0 "Le président Agnew publie le décret 12333, établissant des directives juridiques claires pour les activités de renseignement des États-Unis tout en habilitant la CIA et les forces de l'ordre fédérales à prendre des mesures proactives en matière de contre-espionnage et de défense nationale contre les éléments subversifs."

 # Pierre Du Pont 1988 CIA Oversight
 USA_DUPONT88_Reign_in_CIA_Excesses:0 "Maîtriser les excès de la CIA"
 USA_DUPONT88_Reign_in_CIA_Excesses_desc:0 "Des décennies d'opérations secrètes incontrôlées et d'atteintes géopolitiques excessives ont terni le prestige américain et érodé la confiance du Congrès. L'administration Du Pont décide de rétablir une surveillance stricte, en réorientant Langley vers une collecte objective de renseignements étrangers plutôt que vers des intrigues étrangères non autorisées."

 # Patrick Lucey 1988 Higher Education
 USA_LUCEY88_Higher_Education_Funding_Reform_Act:0 "Loi sur la réforme du financement de l'enseignement supérieur"
 USA_LUCEY88_Higher_Education_Funding_Reform_Act_desc:0 "L'accès à l'enseignement supérieur est le principal moteur de la mobilité sociale et de la productivité économique. En remaniant les bourses fédérales de scolarité, en élargissant les prêts étudiants basés sur les besoins et en encourageant les dotations en recherche universitaire, cette loi garantit que les collèges américains restent de classe mondiale et accessibles aux familles de travailleurs."

 # 1950s WW3 Partisan Warfare
 USAw_Intensify_German_Partisan_Movement:0 "Intensifier le mouvement partisan allemand"
 USAw_Intensify_German_Partisan_Movement_desc:0 "Derrière la ligne de front dans une Allemagne divisée, des réseaux de résistance clandestins et des cellules paramilitaires restent prêtes. En acheminant des armes, du matériel de sabotage et des postes de radio vers le territoire allemand occupé, nous transformerons chaque route, carrefour ferroviaire et forêt en un cauchemar pour la logistique soviétique de l'arrière-plan."
 USAw_Initiate_Uprisings_in_Eastern_Europe:0 "Initier des soulèvements en Europe de l'Est"
 USAw_Initiate_Uprisings_in_Eastern_Europe_desc:0 "Les nations captives d'Europe de l'Est nourrissent un profond ressentiment contre la domination soviétique. Grâce à des largages de renseignements coordonnés et à des réseaux de résistance armée, nous déclencherons des insurrections partisanes généralisées à travers la Pologne, la Tchécoslovaquie, la Hongrie, la Roumanie et la Bulgarie, obligeant l'Armée rouge à détourner les divisions critiques de la ligne de front vers des tâches de pacification."
 USAw_Contact_Russian_White_Emigres:0 "Contacter les émigrés blancs russes"
 USAw_Contact_Russian_White_Emigres_desc:0 "La communauté des émigrés russes de Paris, Munich et New York entretient de profonds réseaux clandestins dans le pays soviétique. En faisant appel aux organisations de la diaspora anti-bolchevique, nous acquérons des talents linguistiques inestimables, des itinéraires de messagerie secrets et une connaissance opérationnelle du coeur de l'URSS."
 USAw_Establish_the_Committee_for_the_Liberation_of_the_Peoples_of_Russia:0 "Comité pour la libération des peuples de Russie"
 USAw_Establish_the_Committee_for_the_Liberation_of_the_Peoples_of_Russia_desc:0 "La guerre politique est aussi essentielle que les armes conventionnelles dans une guerre totale. En soutenant un conseil de libération antisoviétique unifié composé d'éminents dissidents russes et de minorités nationales, nous remettons en question la légitimité intérieure du Kremlin et diffusons des promesses d'une véritable autodétermination sur les ondes soviétiques."
 USAw_Liquidate_Western_Communist_Leadership:0 "Liquider les dirigeants communistes occidentaux"
 USAw_Liquidate_Western_Communist_Leadership_desc:0 "Dans une guerre totale contre l'Union Soviétique, la subversion sur le front intérieur ne peut être tolérée. Les partis communistes occidentaux, les agents secrets et les saboteurs travaillant activement en tant que cinquième colonnes doivent être démantelés de manière agressive, détenus et privés de leur capacité opérationnelle pour protéger le commandement et les centres logistiques alliés."
 USAw_Launch_Scorched_Earth_Campaign:0 "Lancez la campagne Terre brûlée"
 USAw_Launch_Scorched_Earth_Campaign_desc:0 "Si les forces de l'OTAN doivent procéder à un retrait des combats, rien de ce qui a une valeur militaire ne peut être cédé intact au Pacte de Varsovie. Les ponts, les dépôts pétroliers, les gares de triage ferroviaire et les infrastructures de communication doivent être complètement démolis pour priver le fer de lance soviétique du carburant et des moyens de transport nécessaires pour soutenir une offensive."
 USAw_Launch_Psychological_Warfare_Campaign:0 "Lancer une campagne de guerre psychologique"
 USAw_Launch_Psychological_Warfare_Campaign_desc:0 "La vérité est notre arme la plus puissante derrière le rideau de fer. En utilisant des émetteurs de grande puissance, des ballons et une propagande noire ciblée, nous démantelons le moral des Soviétiques, semons la division parmi les conscrits du Pacte de Varsovie et encourageons la non-coopération civile dans toute l'Europe de l'Est."
 USAw_Operation_Reaper:0 "Opération Faucheuse"
 USAw_Operation_Reaper_desc:0 "L'offensive soviétique menace toute l'alliance atlantique. L'opération Reaper coordonnera les commandements américains, britanniques et continentaux en un seul plan d'urgence visant à contenir l'attaque et à préserver les moyens de riposte."
 USAw_The_Final_Crusade:0 "La croisade finale"
 USAw_The_Final_Crusade_desc:0 "Cette guerre déterminera si l'Europe restera libre ou si elle tombera sous la domination soviétique totale. Les États-Unis doivent mobiliser toutes les ressources militaires, industrielles et diplomatiques disponibles pour la lutte à venir."
 USAw_Protect_Allied_Shipping:0 "Protéger la navigation alliée"
 USAw_Protect_Allied_Shipping_desc:0 "La bouée de sauvetage de l'Atlantique doit rester ouverte. Des escortes supplémentaires, des avions de patrouille et une coordination des convois protégeront le flux constant de troupes et de matériel vers nos alliés."
 USAw_Hunt_Soviet_Submarines:0 "Chasser les sous-marins soviétiques"
 USAw_Hunt_Soviet_Submarines_desc:0 "Les sous-marins soviétiques ne peuvent pas être autorisés à couper les routes de renfort à travers l'Atlantique. Les groupes aéronavals et les avions de patrouille terrestres mèneront une campagne anti-sous-marine agressive."
 USAw_Fortify_Suez_and_Gibraltir:0 "Fortifier Suez et Gibraltar"
 USAw_Fortify_Suez_and_Gibraltir_desc:0 "Suez et Gibraltar contrôlent les approches maritimes de la Méditerranée. Le renforcement des deux positions priverait l'ennemi d'une route facile vers l'Atlantique ou l'océan Indien."
 USAw_The_Tigris_Line:0 "La ligne du Tigre"
 USAw_The_Tigris_Line_desc:0 "Si le front du Moyen-Orient s'effondre, le Tigre offrira la barrière défensive la plus solide disponible. Les ingénieurs et formations alliées prépareront une ligne capable de retarder une avancée soviétique vers le Golfe."
 USAw_Fallback_to_the_Pyrenees:0 "Retour aux Pyrénées"
 USAw_Fallback_to_the_Pyrenees_desc:0 "La position continentale est devenue intenable. Un retrait ordonné vers les Pyrénées préservera les formations survivantes et établira une barrière défendable protégeant la péninsule ibérique."
 USAw_Prepare_for_the_Battle_of_Britain:0 "Préparez-vous à la bataille d'Angleterre"
 USAw_Prepare_for_the_Battle_of_Britain_desc:0 "À l'approche des combats outre-Manche, la Grande-Bretagne pourrait redevenir le bastion avancé de l'alliance. Les aérodromes, les stations radar, les ports et les défenses côtières doivent être préparés à un assaut direct."
 USAw_Reorganize_European_Forces:0 "Réorganiser les forces européennes"
 USAw_Reorganize_European_Forces_desc:0 "Les commandements dispersés et les formations battues doivent être consolidés. Une réorganisation unifiée rétablira la cohérence des fronts, regroupera les unités en sous-effectif et améliorera l'allocation des réserves alliées."
 USAw_Force_Ireland_to_Join:0 "Forcer l'Irlande à adhérer"
 USAw_Force_Ireland_to_Join_desc:0 "La neutralité irlandaise menace désormais la défense des approches atlantiques. Dublin doit accorder à l'alliance l'accès à ses ports et aérodromes ou faire face à une pression diplomatique et militaire écrasante."
 USAw_Attrition_Soviet_Forces:0 "Forces soviétiques d'attrition"
 USAw_Attrition_Soviet_Forces_desc:0 "Même là où une contre-attaque décisive est impossible, des défenses préparées et une puissance de feu concentrée peuvent saigner l'avancée soviétique jusqu'à épuiser son élan opérationnel."
 USAw_Bomb_Soviet_Naval_Bases:0 "Bombarder les bases navales soviétiques"
 USAw_Bomb_Soviet_Naval_Bases_desc:0 "Les frappes contre les parcs à sous-marins, les chantiers de réparation, les entrepôts de carburant et les aérodromes navals réduiront la pression sur les navires alliés et confineront la flotte soviétique au port."
 USAw_Target_Soviet_Logistics:0 "Cibler la logistique soviétique"
 USAw_Target_Soviet_Logistics_desc:0 "L'Armée rouge dépend des gares ferroviaires, des ponts, des dépôts et des colonnes de carburant répartis à travers l'Europe occupée. Une interdiction systématique ralentira sa progression et isolera ses fers de lance."
 USAw_The_Rhine_Alps_Piave_Line_Holds:0 "La ligne Rhin-Alpes-Piave tient bon"
 USAw_The_Rhine_Alps_Piave_Line_Holds_desc:0 "Les formations alliées ont stabilisé le front le long du Rhin, des abords alpins et de la Piave. La marge de manoeuvre doit être utilisée pour renforcer la ligne et préparer la prochaine phase de la guerre."
 USAw_Fortify_the_Lines:0 "Fortifiez les lignes"
 USAw_Fortify_the_Lines_desc:0 "Les travaux sur le terrain, les obstacles, les positions de réserve et les points de ravitaillement renforcés transformeront le front stabilisé en une défense capable de résister à une autre offensive soviétique majeure."
 USAw_Outreach_to_Sweden_and_Finland:0 "Sensibilisation en Suède et en Finlande"
 USAw_Outreach_to_Sweden_and_Finland_desc:0 "Les États nordiques occupent une position décisive sur le flanc soviétique. Les garanties de sécurité et le soutien matériel pourraient persuader Stockholm et Helsinki de soutenir l'effort de guerre allié."
 USAw_Intensify_Industrial_Bombing:0 "Intensifier les bombardements industriels"
 USAw_Intensify_Industrial_Bombing_desc:0 "Un effort de bombardement stratégique plus important attaquera les usines, les réseaux électriques et les centres de transport qui soutiennent la production de guerre soviétique et le remplacement des lignes de front."
 USAw_Intensify_the_Air_War_Over_Europe:0 "Intensifier la guerre aérienne au-dessus de l'Europe"
 USAw_Intensify_the_Air_War_Over_Europe_desc:0 "La supériorité aérienne est essentielle à tout plan défensif et offensif. Davantage de ratissages de chasseurs, de sorties d'appui aérien rapproché et de missions d'interdiction contesteront le contrôle soviétique du ciel européen."
 USAw_Initiate_Fallback_Operations:0 "Lancer des opérations de secours"
 USAw_Initiate_Fallback_Operations_desc:0 "Les commandants recevront des itinéraires de retrait préparés, des calendriers de démolition et des points de ralliement afin que les formations menacées puissent battre en retraite sans se dissoudre dans la déroute."
 USAw_Fortify_the_Aleutian_Islands:0 "Fortifier les îles Aléoutiennes"
 USAw_Fortify_the_Aleutian_Islands_desc:0 "Les Aléoutiennes gardent les approches nord du Pacifique vers l'Alaska. Les aérodromes, la couverture radar, les défenses côtières et les dépôts de ravitaillement feront de la chaîne d'îles une formidable barrière."
 USAw_Implement_War_Time_Powers:0 "Mettre en oeuvre les pouvoirs de guerre"
 USAw_Implement_War_Time_Powers_desc:0 "L'ampleur de l'urgence nécessite une autorité fédérale élargie sur la production, le transport, les matériaux stratégiques et la protection civile pendant toute la durée du conflit."
 USAw_Encourage_War_Bonds:0 "Encourager les obligations de guerre"
 USAw_Encourage_War_Bonds_desc:0 "Une campagne d'obligations nationales permettra aux citoyens de financer directement la victoire tout en absorbant la demande excédentaire et en supportant les coûts extraordinaires de la mobilisation."
 USAw_Round_Up_Suspected_Soviet_Agents:0 "Rassemblement d'agents soviétiques présumés"
 USAw_Round_Up_Suspected_Soviet_Agents_desc:0 "Les agences fédérales de contre-espionnage arrêteront les agents soviétiques présumés et démanteleront les réseaux soupçonnés de cibler l'industrie militaire, les communications et les plans de mobilisation."
 USAw_Ramp_Up_the_Red_Scare:0 "Intensifiez la peur rouge"
 USAw_Ramp_Up_the_Red_Scare_desc:0 "L'administration mettra en garde le public contre l'espionnage et la subversion, en utilisant l'état d'urgence nationale pour renforcer la vigilance contre les organisations liées à Moscou."
 USAw_Unleash_Hoover_on_Leftists:0 "Libérez Hoover contre les gauchistes"
 USAw_Unleash_Hoover_on_Leftists_desc:0 "J. Edgar Hoover recevra de larges pouvoirs pour enquêter sur les partis communistes, les organisations de façade et les groupes radicaux soupçonnés d'entraver l'effort de guerre."
 USAw_Activate_the_National_Guard:0 "Activer la Garde Nationale"
 USAw_Activate_the_National_Guard_desc:0 "Les formations de la Garde nationale entreront au service fédéral pour protéger les infrastructures critiques, renforcer les défenses côtières et libérer des unités régulières pour un déploiement à l'étranger."
 USAw_China_at_War_Once_More:0 "La Chine à nouveau en guerre"
 USAw_China_at_War_Once_More_desc:0 "Le conflit mondial a relancé la lutte pour l'Asie de l'Est. La planification américaine doit tenir compte des forces chinoises, des alliés régionaux et du danger d'un deuxième vaste front terrestre."
 USAw_Safeguarding_Southeast_Asia_from_Mao:0 "Protéger l'Asie du Sud-Est de Mao"
 USAw_Safeguarding_Southeast_Asia_from_Mao_desc:0 "L'assistance militaire, les conseillers et la coordination régionale renforceront les gouvernements d'Asie du Sud-Est contre la pression chinoise et les offensives communistes."
 USAw_Militarize_Japan:0 "Militariser le Japon"
 USAw_Militarize_Japan_desc:0 "La capacité industrielle et la position stratégique du Japon ne peuvent plus rester en dehors du système de défense allié. Les restrictions sur le réarmement seront levées pour créer un partenaire compétent dans le Pacifique."
 USAw_Withdraw_from_Hokkaido:0 "Se retirer d'Hokkaido"
 USAw_Withdraw_from_Hokkaido_desc:0 "La position nord-japonaise ne peut être maintenue à un coût acceptable. L'évacuation d'Hokkaido permettra de préserver le personnel et les équipements nécessaires à la défense des îles principales."
 USAw_Evaluate_Korea:0 "Évaluer la Corée"
 USAw_Evaluate_Korea_desc:0 "La péninsule coréenne peut constituer soit une position avancée vitale, soit un handicap exposé. Les chefs d'état-major détermineront si le renforcement ou le retrait sert le mieux la guerre du Pacifique au sens large."
 USAw_Withdraw_from_Korea:0 "Se retirer de Corée"
 USAw_Withdraw_from_Korea_desc:0 "La position coréenne est devenue stratégiquement intenable. Une évacuation organisée sauvera les forces alliées pour la défense du Japon et du Pacifique occidental."
 USAw_Compel_Franco:0 "Contraindre Franco"
 USAw_Compel_Franco_desc:0 "La géographie de l'Espagne est indispensable à la défense de la Méditerranée occidentale et des Pyrénées. Franco doit ouvrir les bases et le territoire espagnols aux forces alliées."
 USAw_Establish_New_Defensive_Lines:0 "Établir de nouvelles lignes défensives"
 USAw_Establish_New_Defensive_Lines_desc:0 "Les ingénieurs étudieront et prépareront les positions successives derrière le front actuel afin que toute retraite ultérieure reste délibérée, approvisionnée et militairement cohérente."
 USAw_Outreach_to_Yugoslavia:0 "Sensibilisation en Yougoslavie"
 USAw_Outreach_to_Yugoslavia_desc:0 "L'indépendance de Belgrade vis-à-vis de Moscou offre une opportunité. Les armes, les garanties et la coordination opérationnelle pourraient amener la Yougoslavie à participer à la défense commune contre l'expansion soviétique."
 USAw_Seize_Control_of_the_United_Nations:0 "Prendre le contrôle des Nations Unies"
 USAw_Seize_Control_of_the_United_Nations_desc:0 "L'ONU ne doit pas rester paralysée alors qu'une guerre mondiale se déroule. Washington organisera l'adhésion non soviétique en un instrument diplomatique de résistance collective."
 USAw_Fortify_Honshu:0 "Fortifier Honshu"
 USAw_Fortify_Honshu_desc:0 "Honshu est le centre politique et industriel du Japon. Des défenses superposées autour de ses ports, aérodromes, villes et approches montagneuses prépareront l'île à une bataille décisive."
 USAw_The_Counteroffensive:0 "La contre-offensive"
 USAw_The_Counteroffensive_desc:0 "L'avancée soviétique a atteint son point culminant. Les armées alliées reconstituées vont désormais reprendre l'initiative avec des attaques coordonnées destinées à rompre le front ennemi et à libérer le territoire occupé."
 USAw_On_to_Moscow:0 "En route pour Moscou"
 USAw_On_to_Moscow_desc:0 "L'ennemi bat en retraite et le centre politique du pouvoir soviétique se trouve devant lui. Le commandement allié préparera l'effort final destiné à mettre fin à la guerre dans des conditions décisives."
 USAw_The_War_Stalls:0 "Les stands de guerre"
 USAw_The_War_Stalls_desc:0 "Aucune des deux coalitions ne peut assurer une percée décisive. Les pertes croissantes et l'épuisement de la logistique ont transformé le conflit en une impasse stratégique coûteuse."
 USAw_Offer_Conditional_Terms:0 "Conditions conditionnelles de l'offre"
 USAw_Offer_Conditional_Terms_desc:0 "Un règlement négocié peut préserver l'alliance et éviter de nouvelles dévastations, mais toute offre doit contenir des garanties de sécurité exécutoires et empêcher une nouvelle agression soviétique."
