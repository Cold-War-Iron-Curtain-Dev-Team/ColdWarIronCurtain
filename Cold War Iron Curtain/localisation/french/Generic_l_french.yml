 gen60_infrastructure_interstate_desc:0 "Notre pays est mal desservi par les transports. Nous devons construire une autoroute pour relier nos pays entre eux."
 gen60_infrastructure_railway:0 "Construire une artère ferroviaire"
 gen60_infrastructure_railway_desc:0 "Maintenant que nous avons une nouvelle autoroute, nous devrions envisager de construire l'Arterial Railway dont notre ministre des Finances parle sans arrêt."
 gen60_infrastructure_urban:0 "Développer l'infrastructure urbaine"
 gen60_infrastructure_urban_desc:0 "Nous devrions envisager d'étendre les infrastructures urbaines dans nos villes pour accroître la productivité."
 gen60_infrastructure_revise_planning:0 "Réviser la planification urbaine"
 gen60_infrastructure_revise_planning_desc:0 "Nous devons revoir la façon dont nous menons la planification urbaine pour mieux répondre aux futures expansions et croissances des infrastructures urbaines."
 gen60_mil_naval_bases:0 "Construire des bases navales"
 gen60_mil_naval_bases_desc:0 "Nous avons considérablement élargi notre infrastructure terrestre. Cependant, le moment est venu d'étendre notre infrastructure navale et de construire des ports et des havres pour nos villes."
 gen60_civilian_rust_belt:0 "Raviver la ceinture de rouille"
 gen60_civilian_industrialize:0 "Industrialiser"
 gen60_civilian_urban_renewal:0 "Renouvellement urbain"
 gen60_civilian_urban_services:0 "Services urbains"
 gen60_civilian_rust_belt_desc:0 "La ceinture de rouille industrielle de notre pays, autrefois un centre industriel emblématique et fier, n'est rien d'autre que des usines rouillées. Il faut le faire revivre pour lui redonner son ancienne gloire."
 gen60_civilian_industrialize_desc:0 "Il y a de nombreuses régions de notre pays non industrialisées et pleines de chômage, nous devrions créer un plan de relance pour sauver ces régions."
 gen60_civilian_urban_renewal_desc:0 "Nous souffrons de graves souffrances urbaines. Les zones à forte criminalité et à faible revenu sont trop courantes et causent des problèmes à ceux qui y vivent et à l'extérieur. Il faut redonner vie à ces lieux."
 gen60_civilian_urban_services_desc:0 "Les gouvernements municipaux de la ville doivent commencer à étendre leurs infrastructures civiles"
 gen60_mil_air_bases:0 "Construire des bases aériennes"
 gen60_mil_air_bases_desc:0 "Afin de défendre notre pays, notre force aérienne va avoir besoin de plus de bases aériennes pour protéger le ciel comme nos anges gardiens."
 gen60_military_industrial_complex:0 "Complexe militaro-industriel"
 gen60_military_industrial_complex_desc:0 "Notre industrie militaire fait défaut. Nous devons commencer à l'étendre."
 gen60_military_naval_expansion:0 "Expansion navale"
 gen60_military_naval_expansion_desc:0 "Notre marine est trop faible. Nous devons commencer à construire des chantiers navals."
 gen60_military_revise_plans:0 "Réviser les plans"
 gen60_military_revise_plans_desc:0 "Nous devons repenser notre planification de défense et envisager d'élargir notre armée."
 gen60_military_increase_spending:0 "Augmenter les dépenses militaires"
 gen60_military_increase_spending_desc:0 "Nous devrions augmenter le montant que nous dépensons pour notre défense."
 gen60_mil_radar:0 "Projet Radar"
 gen60_mil_radar_desc:0 "Le radar est crucial dans le combat moderne. Nous devrions essayer de rechercher de meilleures technologies radar."
 
 gen70_civil_defense:0 "Créer le Bureau de la protection civile"
 gen70_civil_defense_desc:0 "À une époque marquée par l'augmentation des stocks nucléaires, les progrès terrifiants des armes chimiques, les armes aveugles et la montée du radicalisme, nous devons créer un bureau pour combattre le terrorisme, défendre la population, planifier la défense civile et espionner les dissidents."
 gen70_maritime_guard:0 "J'ai trouvé la Garde Maritime"
 gen70_maritime_guard_desc:0 "Des contrebandiers, des terroristes, des cartels et d'innombrables autres criminels ont transporté du matériel illicite dans notre pays et semé la discorde. La Garde maritime sera une sous-branche de la marine et protégera régulièrement nos côtes contre les activités criminelles et terroristes."
 gen70_found_mpf_branch:0 "Corps de garde municipal"
 gen70_found_mpf_branch_desc:0 "Branche spécialisée de la Garde maritime, la Garde municipale protégera les ports des villes et tentera d'endiguer directement la contrebande et la criminalité dans les villes. En outre, ces forces fouilleront les chantiers à conteneurs et les navires à la recherche de matières illicites."
 gen70_mpf_autonomy:0 "Militarisation de la Garde municipale"
 gen70_mpf_autonomy_desc:0 "En élargissant la Garde maritime, nous allouerons des fonds supplémentaires aux équipes d'intervention spéciales et aux véhicules blindés pour la garde municipale afin de répondre aux attaques terroristes et de fortifier les chantiers navals."
 gen70_navy_patrols_coast:0 "Focus antiterroriste"
 gen70_navy_patrols_coast_desc:0 "Notre Garde maritime doit se concentrer sur la lutte contre le terrorisme et la criminalité plutôt que sur la préparation à la guerre. Les matières illégales et la protection civile sont notre priorité."
 gen70_navy_patrols_deep:0 "Focus sur l'eau bleue"
 gen70_navy_patrols_deep_desc:0 "Notre Garde maritime doit se concentrer sur la défense civile et la sécurité nationale plutôt que sur la protection civile. La défense de notre nation contre les envahisseurs étrangers est notre principale préoccupation."
 gen70_patrol_in_being:0 "Patrouille en devenir"
 gen70_patrol_in_being_desc:0 "Nous maintiendrons un plus grand niveau de sécurité en créant un centre de répartition doté de bateaux d'intervention pour maintenir un plus grand niveau de sécurité et enquêter sur tout navire suspect."
 gen70_naval_optics:0 "Optique navale"
 gen70_naval_optics_desc:0 "Nos modules maritimes sont insuffisants pour protéger nos côtes, nous allouerons des fonds spéciaux pour développer de meilleurs modules maritimes pour nos flottes."
 gen70_naval_airforce:0 "Patrouilles aéronautiques"
 gen70_naval_airforce_desc:0 "Bien que les navires de patrouille soient utiles, les avions de patrouille peuvent recueillir beaucoup plus d'informations, couvrir plus de terrain et voir davantage depuis le ciel. Nous créerons des ailes de patrouille aérospatiale maritime pour traquer les criminels. "
 gen70_monitor:0 "Surveiller la flotte"
 gen70_monitor_desc:0 "Les patrouilles fluviales constituent également une préoccupation notable. La création de navires de patrouille pour surveiller les rivières entravera grandement les activités criminelles."
 gen70_mairtime_emergency:0 "gen70_mairtime_emergency"
 gen70_maritime_emergency:0 "Unités de lutte contre la piraterie"
 gen70_maritime_emergency_desc:0 "La création d'unités navales de lutte contre la piraterie composées de marines lourdement armés est primordiale pour la défense de notre nation. La menace des pirates armés ne peut être sous-estimée et ces unités tenteront de reprendre le contrôle des navires marchands détournés."
 gen70_naval_helo:0 "Unités d'hélicoptères"
 gen70_naval_helo_desc:0 "Nous devons créer une flotte d'hélicoptères navals et marins pour que notre Garde maritime puisse répondre avec toutes ses forces aux menaces et mener une guerre ASW contre les menaces étrangères."
 gen70_remote_posts:0 "Messages d'écoute à distance"
 gen70_remote_posts_desc:0 "Un réseau de postes d'écoute à distance nous avertira des attaques navales ennemies ou de la présence de sous-marins pour éviter des attaques surprises."
 gen70_naval_bombers:0 "Défense Aéronautique"
 gen70_naval_bombers_desc:0 "Nous ajouterons des bombardiers navals et un corps de soutien aéronautique à notre garde maritime pour bombarder les flottes ennemies qui se trouvent à portée de notre pays ou même les frapper de manière préventive dans leurs propres ports."
 gen70_nat_militia:0 "J'ai fondé la milice nationale"
 gen70_nat_militia_desc:0 "La Milice nationale servira d'organisation paramilitaire ayant des objectifs à la fois en temps de paix et en temps de guerre. Cela tamponnera nos armées et fournira une garnison de sécurité générale pour protéger notre nation."
 gen70_militia_urban:0 "Focus sur la protection civile"
 gen70_militia_urban_desc:0 "Notre milice nationale doit se concentrer principalement sur la protection civile et les opérations défensives."
 gen70_militia_rural:0 "Focus sur le réseau militaire"
 gen70_militia_rural_desc:0 "La milice nationale se concentrera principalement sur le soutien du réseau militaire global et sur la protection de notre machine de guerre."
 gen70_metro:0 "Garnisons"
 gen70_metro_desc:0 "Les garnisons de la Milice nationale aideront non seulement nos troupes à défendre nos villes, mais développeront également des tactiques de combat urbain à utiliser en temps de guerre."
 gen70_nbc_civilian_safety:0 "NBC Sécurité Civile"
 gen70_nbc_civilian_safety_desc:0 "Nous vivons à une époque de menaces nucléaires, biologiques et chimiques. Les conséquences de la guerre nucléaire, le flot d'infestations biologiques et les turbulences de la pollution chimique ne peuvent être sous-estimés. Notre milice nationale prendra le contrôle de l'initiative de défense civile et commencera à construire des abris et des systèmes défensifs pour atténuer les effets de ces armes."
 gen70_militia_patrols:0 "Patrouilles de milice"
 gen70_militia_patrols_desc:0 "Afin de mieux protéger notre pays, nous établirons des patrouilles de milice pour alléger le fardeau de nos troupes régulières en matière de protection intérieure."
 gen70_helo_patrols:0 "Patrouilles en hélicoptère"
 gen70_helo_patrols_desc:0 "Le financement de corps d'hélicoptères pour notre milice nationale est l'option la plus coûteuse, mais la plus efficace, pour contrer les menaces intérieures. À ce titre, nous utiliserons un nombre d'hélicoptères supérieur à la normale pour nos patrouilles de la Milice nationale par rapport à nos patrouilles au sol."
 gen70_motor_patrols:0 "Patrouilles motorisées"
 gen70_motor_patrols_desc:0 "Même si les hélicoptères seraient une meilleure option, pour chaque hélicoptère que nous achetons, nous pourrions acheter plus de 10 véhicules de patrouille. Les hélicoptères joueront un rôle mineur et nous nous concentrerons fortement sur les patrouilles au sol."
 gen70_mps:0 "Forteresses du métro"
 gen70_mps_desc:0 "Nous fortifierons nos garnisons et mènerons des recherches approfondies pour améliorer la rentabilité de nos batteries défensives afin de protéger notre nation."
 gen70_mobs:0 "Établir des réseaux MOB"
 gen70_mobs_desc:0 "La première étape dans la création de notre réseau de milice nationale consiste à établir des MOB qui soutiendront les FOB à l'avenir."
 gen70_fobs:0 "Construire des FOB"
 gen70_fobs_desc:0 "Objectif principal de notre réseau de milice nationale, les FOB constitueront des atouts logistiques et militaires cruciaux."
 gen70_logistic_corp:0 "Corps logistique de la milice nationale"
 gen70_logistic_corp_desc:0 "Une armée se bat avec les ressources dont elle dispose. La logistique n'a pas le même mandat en matière de discipline et de force de combat que les forces de première ligne, donc reléguer la majorité de nos forces de milice nationale à la logistique est la meilleure option."
 gen70_mil_hospitals:0 "Hôpitaux militaires"
 gen70_mil_hospitals_desc:0 "Les pertes militaires constituent une menace énorme pour toute nation, non seulement en raison de la perte d'une population adéquate, mais aussi en raison de la perte d'anciens combattants, d'autant plus que les armées ont des mandats de plus en plus grands en matière de professionnalisme et de compétence."
 gen70_cbd_rad:0 "Commandement de l'espace aérien"
 gen70_cbd_rad_desc:0 "L'expansion de la CDB pour fournir un réseau de commandement aérospatial sur notre pays est un élément nécessaire de la guerre et du contrôle modernes. Être capable de mettre en réseau nos systèmes pour lutter contre les attaques aériennes ennemies est vital."
 gen70_network_centric:0 "Force aérienne centrée sur le réseau"
 gen70_network_centric_desc:0 "Au-delà d'un simple système centralisé pour organiser notre défense de l'espace aérien, nous créerons un système de commandement central entièrement en réseau afin que notre force aérienne puisse travailler en parfaite coordination."
 gen70_defense_focus:0 "Commandement de l'espace aérien localisé"
 gen70_defense_focus_desc:0 "Plutôt qu'un système totalement centré sur le réseau, nous déléguerons des ressources locales de commandement et de contrôle pour traiter des problèmes spécifiques à certaines zones et allouerons des ressources à ces régions en fonction de leur importance stratégique."
 gen70_interceptor:0 "Réseau d'intercepteurs"
 gen70_interceptor_desc:0 "Nous créerons des réseaux d'intercepteurs qui couvriront des régions spécifiques et créerons des réseaux d'intercepteurs très efficaces qui réduiront le coût global de fonctionnement des intercepteurs."
 gen70_particularist:0 "Filet de défense particulier"
 gen70_particularist_desc:0 "Même si un réseau d'intercepteurs serait un outil exceptionnellement puissant, il est également très coûteux et nous ne pouvons pas constituer un réseau d'intercepteurs efficace. Au lieu de cela, nos ressources seraient mieux affectées au contrôle des dommages et aux systèmes de défense des parcs industriels."
 gen70_adhoc_inter:0 "Programme de recherche sur les intercepteurs"
 gen70_adhoc_inter_desc:0 "Nous financerons la création d'un nouveau modèle d'intercepteur et allouerons des ressources politiques à ce nouvel avion afin de renforcer notre capacité d'interception."
 gen70_adhoc_multi:0 "Programme de recherche multirôle"
 gen70_adhoc_multi_desc:0 "Nous n'avons pas les ressources nécessaires pour les intercepteurs, et même si nous recherchons une conception d'intercepteur plus performante, cela reste beaucoup trop coûteux pour que nous puissions le construire en masse. Au lieu de cela, des rôles multirôles pouvant servir à plusieurs objectifs seraient beaucoup plus rentables et raisonnables."
 gen70_adhoc_radar:0 "Programme de recherche radar"
 gen70_adhoc_radar_desc:0 "Les régions critiques clés ont une couverture radar insuffisante, nous investirons dans un meilleur système radar pour améliorer nos réseaux existants dans la région."
 gen70_adhoc_sam:0 "Projet de recherche SAM"
 gen70_adhoc_sam_desc:0 "Nos SAM sont obsolètes et à une époque où les avions à réaction deviennent de plus en plus meurtriers et puissants, nous aurons besoin d'une meilleure protection AA."
 gen70_net_expansion:0 "Développez le réseau de radars"
 gen70_net_expansion_desc:0 "Nous pouvons allouer des ressources politiques à l'expansion de notre réseau de défense de l'espace aérien et à mieux protéger notre pays contre les envahisseurs."
 gen70_military_research:0 "Centre de recherche militaire sur la défense civile"
 gen70_military_research_desc:0 "La simple complexité du système de protection civile que nous avons actuellement mis en place a mis à rude épreuve nos ressources de développement existantes. Les innombrables réseaux de protection civile, de lutte contre le terrorisme et de défense moderne nécessiteront une installation dédiée à leur gestion et à leur amélioration."
 gen70_industrial_philosophy:0 "Direction Industrielle"
 gen70_industrial_philosophy_desc:0 "Le moment est venu de choisir une philosophie industrielle et une orientation pour l'économie de notre pays."
 gen70_industrialism:0 "Industrialisme"
 gen70_industrialism_desc:0 "Notre secteur industriel se concentre mieux sur la transformation des ressources que sur la transformation des ressources brutes. Notre pays manque de ressources naturelles pour s'appuyer sur les RGO."
 gen70_hybridization:0 "Hybridation"
 gen70_hybridization_desc:0 "Notre pays dispose de ressources abondantes, mais nous devons nous concentrer principalement sur l'équilibre de notre économie et la gestion d'une chaîne d'approvisionnement verticale."
 gen70_rentierization:0 "Rentiérisation"
 gen70_rentierization_desc:0 "Les ressources économiques vastes et riches de notre pays sont prêtes à être exploitées et exportées, nous devrions concentrer nos efforts sur ce qui est le plus rentable ; collecte et traitement!"
 gen70_con_goods:0 "Économie de la consommation"
 gen70_con_goods_desc:0 "L'économie de consommation de notre pays pourrait se renforcer et produire des produits destinés à la consommation intérieure."
 gen70_housing_construction_industry:0 "Industrie du logement"
 gen70_housing_construction_industry_desc:0 "Nos vastes étendues de terrain constituent des biens immobiliers parfaits pour le logement et nous disposons de toute l'industrie nécessaire pour soutenir un secteur immobilier en plein essor. De la réhabilitation de logements à la nouvelle construction, notre pays peut facilement prospérer grâce à la construction résidentielle nationale."
 gen70_intermediates:0 "Fabrication de biens intermédiaires"
 gen70_intermediates_desc:0 "La production de biens intermédiaires tels que des pièces détachées, des matériaux de construction et des produits non finis est une entreprise rentable."
 gen70_industrial_goods_factories:0 "Usines de biens industriels"
 gen70_industrial_goods_factories_desc:0 "Pourquoi importer des machines alors que nous pourrions produire nous-mêmes des machines et des véhicules ? Les usines de biens industriels peuvent également consommer les biens intermédiaires produits localement."
 gen70_construct_mines:0 "Construire des mines"
 gen70_construct_mines_desc:0 "Le sol de notre pays recèle de vastes richesses et nous devrions chercher à les exploiter dans un but lucratif !"
 gen70_lumber_stone_energy:0 "Bois Pierre Énergie"
 gen70_lumber_stone_energy_desc:0 "Bois, pierre, énergie, tout ce dont vous avez besoin. Lancer un projet énergétique abordable et le combiner avec des OGR de ressources organiques est parfait pour la prospérité de notre pays."
 gen70_oil_sources:0 "Oléoduc"
 gen70_oil_sources_desc:0 "Il est préférable d'utiliser nos ressources pour construire un oléoduc à l'intérieur de notre pays pour l'extraction et le traitement du pétrole."
 gen70_oil_refineries:0 "Logistique des raffineries"
 gen70_oil_refineries_desc:0 "Doter la logistique des raffineries et donner la priorité à l'utilisation des infrastructures par les raffineries est le moyen idéal pour renforcer notre économie de collecte de ressources naturelles."
 gen70_bureau_of_industry:0 "Bureau de l'Industrie"
 gen70_bureau_of_industry_desc:0 "Fonder un Bureau de l'Industrie pour répondre aux besoins de nos nouvelles usines émergentes et de notre économie productive est vital pour leur santé future !"
 gen70_vertical:0 "Économie verticale"
 gen70_vertical_desc:0 "L'autosuffisance, la réduction des licenciements, l'absence d'intermédiaires, une économie verticale est le meilleur résultat possible et une économie verticale a d'innombrables façons de rapporter."
 gen70_rgo_economy:0 "Économie RGO"
 gen70_rgo_economy_desc:0 "Notre économie industrielle dispose désormais d'un secteur RGO en plein essor et nous bénéficierons énormément du faible coût de la collecte et de la vente des ressources naturelles !"
 gen70_commercial_philosophy:0 "Philosophie commerciale"
 gen70_commercial_philosophy_desc:0 "Les revenus de notre pays ont désespérément besoin d'une aubaine. Si nous voulons financer des politiques et maintenir une scène compétitive dans le monde, nous devons choisir la voie qui nous permettra d'obtenir des revenus."
 gen70_artisan:0 "Commerce artisanal"
 gen70_artisan_desc:0 "Les services de marketing improductifs, les banquiers et autres innombrables postes inutiles devraient être réduits au minimum dans notre pays. Une entreprise commerciale productive est la clé du succès."
 gen70_commercial_hybrid:0 "Commerce équilibré"
 gen70_commercial_hybrid_desc:0 "Le commerce financier constitue une aubaine fantastique pour les revenus et la logistique économique de toute nation, mais s'il n'est pas soutenu, il reste instable et peu fiable. Une logistique commerciale équilibrée et bien soutenue garantira une croissance forte de notre économie !"
 gen70_financial:0 "Commerce Financier"
 gen70_financial_desc:0 "Banquiers, employés, bureaux, magasins et loisirs. Avoir un centre commercial robuste et prospère et une solide épine dorsale financière fera monter en flèche nos revenus et notre croissance économique !"
 gen70_office_zoning:0 "Zonage des bureaux"
 gen70_office_zoning_desc:0 "Nous devons commencer à nous préparer à créer des quartiers de bureaux dans notre ville, à proximité des habitations. Ils atténuent la pollution sonore du commerce et apportent des avantages incroyables au commerce et au développement lui-même."
 gen70_office_priority:0 "Zonage spécial"
 gen70_office_priority_desc:0 "Nous pouvons encore améliorer notre force commerciale en introduisant des zones urbaines plus soigneusement planifiées et plus spécialisées. En exigeant que le commerce à proximité ou dans les quartiers résidentiels soit organique, autosuffisant et peu polluant, les zones résidentielles resteront calmes tout en ayant le commerce à portée des maisons. Avoir des quartiers de loisirs de l'autre côté des bureaux pour divertir les gens améliorera la qualité de vie. Enfin, réserver au tourisme les zones ayant la plus grande valeur foncière ou proches des attractions améliorera considérablement les revenus touristiques."
 gen70_banking_it:0 "Banque et technologies de l'information"
 gen70_banking_it_desc:0 "La dernière partie de notre plan consiste à créer 2 zones de bureaux spécialisées supplémentaires. Informatique et finance. Garantir de l'espace à ces précieux quartiers et leur fournir des services prioritaires et sans impôt foncier permettra de générer d'énormes richesses et de générer d'importantes recettes fiscales ailleurs."
 gen70_agrarian_growth:0 "Droits fonciers agraires"
 gen70_agrarian_growth_desc:0 "L'un des meilleurs moyens d'assurer une économie stable consiste à recourir aux cultures commerciales et à l'agriculture. Accorder des droits fonciers et réduire les impôts sur les secteurs agricoles garantira un secteur agricole robuste et stable et, par conséquent, une économie stable."
 gen70_agrarian_prospects:0 "Perspectives et bourses de développement"
 gen70_agrarian_prospects_desc:0 "L'octroi de subventions de développement et l'affectation de vastes étendues de terres au secteur agricole pour y cultiver des cultures de rente amélioreront la croissance agricole et garantiront davantage la stabilité économique et l'autosuffisance régionale afin d'éviter que des problèmes liés aux problèmes économiques mondiaux ne surviennent."
 gen70_cash_crops:0 "Cultures commerciales"
 gen70_cash_crops_desc:0 "Il existe de nombreux produits agricoles de valeur très demandés sur le marché et, grâce à une analyse, une planification et une sensibilisation minutieuses, nous pouvons en tirer profit et générer de gros revenus tout en étant en mesure de les utiliser pour notre propre croissance économique et nos bénéfices futurs."
 gen70_city_logistics:0 "Logistique du comté"
 gen70_city_logistics_desc:0 "De la ferme à la table, nous expérimenterons la logistique agro-industrielle dans des régions en manque de développement et tenterons d'apprendre de ce que nous créons."
 gen70_export_agencies:0 "Agences d'exportation"
 gen70_export_agencies_desc:0 "Le moment est venu de créer des agences d'exportation et de capitaliser sur les aléas du marché mondial. Nous serons en mesure de répondre à nos propres besoins tout en bénéficiant d'avantages grâce à la hausse du marché."
 gen70_warehousing_districts:0 "Districts d'entreposage"
 gen70_warehousing_districts_desc:0 "Avec notre économie équilibrée, nous devrions développer des districts d'entreposage à proximité des pôles ferroviaires, entre les zones commerciales et industrielles, afin de maintenir l'approvisionnement du commerce en produits relativement stables et rentables. système."
 gen70_commercial_zoning:0 "Plus de zones commerciales"
 gen70_commercial_zoning_desc:0 "Nous disposons de nombreux terrains inexploités de grande valeur dans certaines de nos villes. Immobilier de premier ordre pour le développement commercial, même si cela signifie un peu de domaine éminent."
 gen70_commercial_logistics:0 "Logistique commerciale"
 gen70_commercial_logistics_desc:0 "Certains quartiers commerciaux sont en désordre total et doivent acheminer le trafic vers des routes peu efficaces et peu approvisionnées ou simplement rester sans stocks pendant de longues périodes. Partout où cela se produit, nous devrions envisager de réviser notre planification municipale pour mieux tenir compte de la logistique commerciale."
 gen70_militia_brigade:0 "Brigade de milice Levy"
 gen70_militia_brigade_desc:0 "Nous devrions prendre le temps de créer une brigade de milice et jeter les bases des organisations de milices nationales en développant un format standardisé"
 gen70_cooperative_counterterrorism:0 "Force coopérative de lutte contre le terrorisme"
 gen70_cooperative_counterterrorism_desc:0 "Nous devons établir une force antiterroriste coopérative avec nos alliés afin de mieux se protéger mutuellement et d'extrader les terroristes connus ou présumés"
 gen70_infrastructure_interstate:0 "Construire une autoroute"
 gen70_infrastructure_interstate_desc:0 "Notre pays est mal desservi par les transports. Nous devons construire une autoroute pour relier nos pays entre eux."
 gen70_infrastructure_railway:0 "Construire une artère ferroviaire"
 gen70_infrastructure_railway_desc:0 "Maintenant que nous avons une nouvelle autoroute, nous devrions envisager de construire l'Arterial Railway dont notre ministre des Finances parle sans arrêt."
 gen70_infrastructure_urban:0 "Développer l'infrastructure urbaine"
 gen70_infrastructure_urban_desc:0 "Nous devrions envisager d'étendre les infrastructures urbaines dans nos villes pour accroître la productivité."
 gen70_infrastructure_revise_planning:0 "Réviser la planification urbaine"
 gen70_infrastructure_revise_planning_desc:0 "Nous devons revoir la façon dont nous menons la planification urbaine pour mieux répondre aux futures expansions et croissances des infrastructures urbaines."
 gen70_mil_naval_bases:0 "Construire des bases navales"
 gen70_mil_naval_bases_desc:0 "Nous avons considérablement élargi notre infrastructure terrestre. Cependant, le moment est venu d'étendre notre infrastructure navale et de construire des ports et des havres pour nos villes."
 gen70_civilian_rust_belt:0 "Raviver la ceinture de rouille"
 gen70_civilian_industrialize:0 "Industrialiser"
 gen70_civilian_urban_renewal:0 "Renouvellement urbain"
 gen70_civilian_urban_services:0 "Services urbains"
 gen70_civilian_rust_belt_desc:0 "La ceinture de rouille industrielle de notre pays, autrefois un centre industriel emblématique et fier, n'est rien d'autre que des usines rouillées. Il faut le faire revivre pour lui redonner son ancienne gloire."
 gen70_civilian_industrialize_desc:0 "Il y a de nombreuses régions de notre pays non industrialisées et pleines de chômage, nous devrions créer un plan de relance pour sauver ces régions."
 gen70_civilian_urban_renewal_desc:0 "Nous souffrons de graves souffrances urbaines. Les zones à forte criminalité et à faible revenu sont trop courantes et causent des problèmes à ceux qui y vivent et à l'extérieur. Il faut redonner vie à ces lieux."
 gen70_civilian_urban_services_desc:0 "Les gouvernements municipaux de la ville doivent commencer à étendre leurs infrastructures civiles"
 gen70_mil_air_bases:0 "Construire des bases aériennes"
 gen70_mil_air_bases_desc:0 "Afin de défendre notre pays, notre force aérienne va avoir besoin de plus de bases aériennes pour protéger le ciel comme nos anges gardiens."
 gen70_military_industrial_complex:0 "Complexe militaro-industriel"
 gen70_military_industrial_complex_desc:0 "Notre industrie militaire fait défaut. Nous devons commencer à l'étendre."
 gen70_military_naval_expansion:0 "Expansion navale"
 gen70_military_naval_expansion_desc:0 "Notre marine est trop faible. Nous devons commencer à construire des chantiers navals."
 gen70_military_revise_plans:0 "Réviser les plans"
 gen70_military_revise_plans_desc:0 "Nous devons repenser notre planification de défense et envisager d'élargir notre armée."
 gen70_military_increase_spending:0 "Augmenter les dépenses militaires"
 gen70_military_increase_spending_desc:0 "Nous devrions augmenter le montant que nous dépensons pour notre défense."
 gen70_mil_radar:0 "Projet Radar"
 gen70_mil_radar_desc:0 "Le radar est crucial dans le combat moderne. Nous devrions essayer de rechercher de meilleures technologies radar."
 
 
