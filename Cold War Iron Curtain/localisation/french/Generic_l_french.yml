 gen60_as_it:0 "Comme il se doit"
 wp.1.d:0 "Durant notre bombardement au phosphore blanc, plusieurs obus ont été tirés avec des coordonnées erronées, touchant une ville voisine. Une fois les incendies éteints, notre équipe de reconnaissance est allée évaluer les dégâts. Plusieurs bâtiments ont été détruits et de nombreux civils sont morts. Cet incident réduira sûrement le soutien à cette guerre."
