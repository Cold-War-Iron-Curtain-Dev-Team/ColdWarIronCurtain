 ic_generic60_events.1.t:0 "La question sociale"
 ic_generic60_events.1.d:0 "Avec la fin de la guerre, les réparations effectuées et le monde prospère, les questions sociales sont à nouveau au premier plan de la politique mondiale. Les droits des travailleurs, les perspectives environnementales, les droits des minorités et du sexe opposé, la SAGA, le mondialisme et même le militarisme et la politique étrangère sont débattus. Ces débats ont déchiré le pays et les laisser sans réponse menacerait la stabilité même du pays. "
 ic_generic60_events.2.t:0 "[GetNewspaperHeader]Débats sur les droits des travailleurs"
 ic_generic60_events.2.d:0 "Les débats sur les droits des travailleurs au cours des derniers mois ont été intenses. Les émeutes, les grèves générales et le lobbying ont fait l'actualité.\nLes groupes pro-employeurs affirment que la liberté et la libre association du travail corrigeront les conditions de travail et garantiront l'emploi sans ingérence du gouvernement, et que la croissance économique résultant de la liberté économique apportera de meilleures conditions que n'importe quelle loi ne pourrait jamais le faire.\nLes groupes pro-syndicaux affirment que les droits des travailleurs sont vitaux puisqu'il n'y a pas suffisamment d'emplois disponibles pour assurer la libre circulation de la main-d'oeuvre. À ce titre, ils déclarent que les syndicats doivent être renforcés et qu'une Déclaration des droits des travailleurs doit être rédigée pour garantir un salaire décent, la sécurité sur le lieu de travail et de bonnes conditions de travail.\nLes pragmatiques travaillistes modérés affirment que choisir l'un ou l'autre camp mènera le pays à la ruine. Ils soutiennent que les syndicats doivent être suffisamment forts pour protéger leurs travailleurs, mais ne doivent pas détenir un pouvoir absolu, car des revendications excessives freineraient la croissance économique. Ils concluent qu'avoir des syndicats moyennement puissants, des normes acceptables imposées par la loi et des niveaux raisonnables de liberté économique garantira un équilibre entre croissance et bénéfices."
 ic_generic60_events.3.t:0 "[GetNewspaperHeader]Débats sur les perspectives environnementales"
 ic_generic60_events.3.d:0 "Les matérialistes croient que le réchauffement climatique est un mythe, que la nature trouvera toujours un moyen, que la vie est inutile lorsqu'elle est vécue dans l'austérité et que les bénéfices d'une croissance industrielle rapide dépassent toujours les conséquences de la non-durabilité.\nLes environnementalistes sont des individus extrêmement soucieux de l'environnement et ouverts sur le monde, qui se contentent de quelques biens de consommation fiables. Ils souhaitent la durabilité, la protection de l'environnement et une longue durée de vie. Ils croient que le réchauffement climatique constitue une menace existentielle, que des produits durables sont nécessaires à la survie continue de l'humanité et que l'écosystème doit être préservé.\nLes écologistes centristes estiment qu'il suffit de prendre des mesures extrêmes pour préserver l'environnement, en réduisant simplement le gaspillage et en empêchant la déforestation et l'extinction des espèces animales. Ils estiment que les matérialistes sont excessivement gaspilleurs et les écologistes trop austères. En tant que tels, ils souhaitent une nation qui prend uniquement les mesures nécessaires pour réduire la consommation excessive et protéger l'environnement."
 ic_generic60_events.4.t:0 "[GetNewspaperHeader]Débats sur le genre et les droits des minorités"
 ic_generic60_events.4.d:0 "Parmi les sujets les plus controversés et les plus importants, les droits des femmes et des minorités touchent une grande partie de la population et dictent ce que ces groupes peuvent accomplir.\nLe premier groupe, les réactionnaires, croient que le groupe majoritaire est supérieur et que toute autre chose entraînerait l'éclatement de la cellule familiale, l'introversion des enfants, voire l'influence des minorités elles-mêmes.\nLe deuxième groupe, les progressistes, croit en une action positive pour promouvoir l'égalité des sexes et des minorités dans tout le pays. Cela signifie un effort massif pour encourager l'acceptation et l'effondrement des normes et traditions culturelles. Ils estiment que la seule façon de garantir l'égalité est d'encourager les membres des groupes marginalisés à réaliser leur plein potentiel et à surmonter les préjugés de la société.\nLe troisième groupe, les conservateurs, estime que les minorités et les deux sexes doivent être égaux. Les conservateurs estiment que l'action positive est à la fois inutile et contre nature et qu'il suffit d'être égaux devant la loi et les perspectives sociales."
 ic_generic60_events.5.t:0 "[GetNewspaperHeader]Débats sur la sexualité et l'acceptation du genre"
 ic_generic60_events.5.d:0 "Le premier groupe, les traditionalistes, soutiennent que le mariage est sacré et qu'il n'existe qu'un nombre historique prédéfini de genres et que le reste n'est que des illusions. Les traditionalistes souhaitent maintenir la répression des sexualités alternatives et renforcer les identités de genre traditionnelles.\nLe deuxième groupe, les progressistes, estiment qu'une action positive permettra de faire progresser rapidement l'acceptation des groupes LGBT+. Les progressistes soutiennent que les personnes LGBT+ doivent être traitées sur un pied d'égalité et que des mesures doivent être prises pour les protéger dans la société contre la discrimination.\nEnfin, les libéraux estiment que les groupes LGBT+ ne devraient pas être discriminés et devraient être considérés comme des membres égaux de la société. Les libéraux estiment que les membres LGBT+ sont égaux et doivent être traités comme tels."
 ic_generic60_events.6.t:0 "[GetNewspaperHeader]Débats politiques militaristes"
 ic_generic60_events.6.d:0 "La question du militarisme touche à la survie même de l'humanité et aucun groupe ne peut s'entendre complètement sur la meilleure politique pour le monde.\nLes pacifistes estiment que le conflit comme moyen d'atteindre une fin est un concept ridicule. Ils affirment qu'en tant qu'êtres civilisés, la fin de tous les conflits armés devrait être notre principale préoccupation. Ils croient que la guerre est une impasse, aussi futile que inutile. Les jingoïstes croient que les seules vraies vertus sont le courage et la discipline, et qu'en les canalisant correctement, elles peuvent surmonter n'importe quel obstacle. Ils soutiennent que la capacité de projeter la force est le seul moyen de préserver notre mode de vie et de garantir que tout le monde le partage, volontairement ou non.\nIl existe cependant un autre groupe qui adopte une position équilibrée sur la question de la guerre et de l'armée. Ils estiment que la guerre devrait être un dernier recours et ne devrait être menée que lorsqu'il existe une menace légitime pour la nation et que toutes les autres options ont été épuisées. Ce groupe de centristes estime que le gouvernement devrait maintenir une armée robuste pour défendre la nation et qu'elle ne devrait être utilisée que si cela est nécessaire."
 ic_generic60_events.7.t:0 "[GetNewspaperHeader]Débats sur la mondialisation"
 ic_generic60_events.7.d:0 "Avec l'essor des technologies de l'information et des transports modernes, le monde devient de plus en plus interconnecté et interdépendant. Cela a déclenché un nouveau débat sur la manière dont le monde devrait réagir à la mondialisation économique.\nLes nationalistes économiques croient que nous devrions être autosuffisants et ne pas avoir à nous soucier des marées de l'économie mondiale. Ils affirment que les investisseurs étrangers prendront les revenus produits par nos travailleurs et les dépenseront ailleurs, paralysant l'économie nationale, et que le pays sera touché par une économie mondialisée.\nLes mondialistes économiques prétendent que le monde est un jeu à somme positive et que seul le bien peut venir de la collaboration de différents pays. Ils contestent les nationalistes économiques en les accusant d'être des mercantilistes et en affirmant que leurs politiques ont été essayées et ont échoué. Ils croient que l'interdépendance mondiale et une économie ouverte aux investisseurs et aux travailleurs mondiaux nous apporteront un niveau élevé de richesse et garantiront à la nation la prospérité pour les années à venir.\nIl existe également un groupe centriste qui soutient que l'interdépendance économique et l'autarcie nationale sont deux concepts destructeurs."
 ic_generic60_events.8.t:0 "Sortie du réseau de télévision national"
 ic_generic60_events.8.d:0 "Après plusieurs mois, la construction de l'infrastructure du réseau de télévision national est terminée. La demande nationale de téléviseurs a grimpé en flèche alors qu'un nombre massif de foyers à travers le pays se bousculent pour acheter un téléviseur maintenant que la nouvelle infrastructure a rendu la télévision largement disponible. Une nouvelle industrie a déjà vu le jour avec des lots de films et des producteurs de spectacles qui tentent de réussir dans le pays. De tout, des chaînes d'information aux émissions éducatives en passant par les programmes de divertissement, tout a surgi sur la formidable dizaine de chaînes du pays."
 ic_generic60_events.9.t:0 "[GetNewspaperHeader]NOUVEAU PRÉTENDANT À LA COURSE À L'ESPACE"
 ic_generic60_events.9.d:0 "[From.owner.GetName] a déclaré qu'ils participeraient également à la course à l'espace. Au départ, cela était considéré comme une plaisanterie par la plupart des pays ou peut-être comme l'ego d'un dictateur du tiers monde. Cependant, lorsque [Root.GetLeader] a révélé au monde la fusée de son pays, tout le monde a compris qu'ils étaient sérieux. Beaucoup de gens pensent que ce pays aléatoire ne pourra jamais rivaliser avec les superpuissances, mais d'autres pensent qu'ils ont peut-être encore une chance. À tout le moins, cela signifie que le monde verra un nouveau concurrent dans la course à l'espace et davantage d'innovations dans l'exploration spatiale.\nL'administration spatiale de [From.owner.GetName]a déjà commencé à travailler sur son prochain prototype qu'elle espère utiliser pour éclipser le reste du monde."
 ic_generic60_events.10.t:0 "[GetNewspaperHeader]Ouverture de la communauté nationale des producteurs de films"
 ic_generic60_events.10.d:0 "Avec l'augmentation massive de la demande de téléviseurs et la nouvelle infrastructure de télévision mise en place, ce n'était qu'une question de temps avant que de nouveaux entrepreneurs et des stars en herbe ambitieuses commencent à créer leurs propres programmes et longs métrages pour tenter de réussir sur le grand écran. En conséquence, une communauté nationale de producteurs de films a été ouverte en [Root.Capital.GetName]. Cette communauté possède une industrie fortement basée sur l'industrie cinématographique et partagera des ateliers, des techniques, du personnel et des talents pour produire des films emblématiques qui seront projetés dans tout le pays."
 ic_generic60_events.11.t:0 "Nation adopte les programmes de dessins animés"
 ic_generic60_events.11.d:0 "[From.owner.GetName] a commencé à adopter culturellement les dessins animés. Déjà, la plupart des programmes de divertissement à la télévision comportent des comédies animées et sont appréciées par les fans, jeunes et moins jeunes. L'essor massif de la programmation animée a conduit [From.owner.GetName] à créer son propre style d'animation unique.\nDe nombreuses émissions produites dans le pays peuvent déjà être appréciées à l'échelle internationale, car elles ont gagné du terrain dans les pays voisins."
 ic_generic60_events.12.t:0 "[GetNewspaperHeader]Nation adopte des longs métrages et des programmes dramatiques"
 ic_generic60_events.12.d:0 "[From.owner.GetName] a commencé à adopter culturellement les longs métrages et les programmes dramatiques. Des feuilletons aux films sérieux, le contexte du pays a déjà commencé à façonner son divertissement et vice versa. Allant de la tranche de vie à la romance, ces programmes sérieux ont leurs propres impacts uniques qu'ils laissent sur leur public.\nDe nombreuses émissions produites dans le pays peuvent déjà être appréciées à l'échelle internationale, car elles ont gagné du terrain dans les pays voisins."
 ic_generic60_events.13.t:0 "L'humour à sourcils bas se popularise"
 ic_generic60_events.13.d:0 "[From.owner.GetName] on assiste à une vague de comédiens et d'artistes burlesques qui font rire tout le pays. De nombreux citoyens de [From.owner.GetName] apprécient cette forme de divertissement comme une forme d'évasion de leur vie. Déjà, des clubs d'improvisation et des émissions d'humour ont commencé à se développer dans tout le pays et certains diffusent même au-delà de nos frontières."
 ic_generic60_events.14.t:0 "[GetNewspaperHeader]Le grand gibier diffusé à l'échelle nationale"
 ic_generic60_events.14.d:0 "Pour la première fois dans l'histoire de [From.owner.GetName], un match de sport est diffusé à la télévision. Mais pas n'importe quel match, il s'agit de la [From.owner.GetName] cup, le championnat triennal. Le pays tout entier a semblé s'arrêter pendant une heure et écouter attentivement. Outre les implications du jeu lui-même, il a également montré à quel point la nation a progressé économiquement et à quel point elle s'est développée."
 ic_generic60_events.15.t:0 "[GetNewspaperHeader]Les beaux-arts se popularisent"
 ic_generic60_events.15.d:0 "Les beaux-arts, la musique classique et bien d'autres formes d'expression supérieure sont devenus populaires dans le pays. De nombreuses personnes ont commencé à apprécier les beaux-arts et à s'adonner à des passe-temps artistiques à travers le pays pour s'exprimer.\nEn raison de cette popularité croissante, des musées surgissent dans tout le pays pour exposer et préserver des oeuvres d'art historiques et contemporaines."
 ic_generic60_events.16.t:0 "[GetNewspaperHeader]Réseau national de radio en ligne"
 ic_generic60_events.16.d:0 "L'expansion du réseau radio national a fourni un réseau radio normalisé et relié qui couvre entièrement toutes les régions du pays, même les zones rurales et isolées du pays en dehors du réseau de télévision peuvent y accéder. Ce réseau radio facilitera grandement la communication et connectera le pays via un média permettant à chacun d'accéder aux chaînes d'information et de divertissement."
 ic_generic60_events.17.t:0 "[GetNewspaperHeader]Le pays crée un réseau d'information militaire (MNN)"
 ic_generic60_events.17.d:0 "[From.owner.GetName] a créé le Réseau d'information militaire, qui nomme des militaires chargés de fournir des informations au public par l'intermédiaire du Réseau radio national. MNN diffusera des événements d'actualité et des informations qui, selon [Root.GetLeader], seront \"complètement neutres, factuelles et responsables, contrairement aux marées des médias d'intérêt privé\". Les chaînes d'information et les journalistes du MNN s'installent déjà dans tout le pays pour recueillir et rapporter des informations. Des rumeurs se sont également répandues selon lesquelles les législateurs du pays envisageraient de demander à des journalistes militaires d'examiner les sources médiatiques indépendantes et de rendre compte de leur exactitude."
 ic_generic60_events.18.t:0 "Le pays réaffirme les journalistes indépendants"
 ic_generic60_events.18.d:0 "[From.owner.GetName] a réaffirmé la position et l'importance des journalistes indépendants ainsi que leurs droits. Citant que les médias indépendants constituent une partie importante de tout pays fonctionnel, [Root.GetLeader] a assuré aux journalistes que leurs positions et leurs activités sont importantes pour le pays et le tiennent informé. De nombreux journalistes indépendants en [From.owner.GetName] sont soulagés de savoir qu'ils seront à l'abri de poursuites et pourront continuer leur travail. De plus, cette action réjouit de nombreux citoyens libéraux car le gouvernement ne tentera pas de fausser les points de vue nationaux en créant des journalistes militaires."
