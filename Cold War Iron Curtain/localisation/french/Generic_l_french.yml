 cbd_rad_desc:0 "Cette nation a fondé un Bureau de défense civile en réponse aux préoccupations croissantes concernant la défense civile et le terrorisme. Le Bureau de la protection civile a mis en place un réseau de défense aérospatiale."
 cbd_rad_net_desc:0 "Cette nation a fondé un Bureau de défense civile en réponse aux préoccupations croissantes concernant la défense civile et le terrorisme. Le Bureau de la protection civile a mis en place un réseau de défense aérospatiale axé sur les réseaux."
 cbd_rad_def_desc:0 "Cette nation a fondé un Bureau de défense civile en réponse aux préoccupations croissantes concernant la défense civile et le terrorisme. Le Bureau de la protection civile a établi un réseau de défense aérospatiale axé sur la protection civile."
 cbd_rad_net_inter_desc:0 "Cette nation a fondé un Bureau de défense civile en réponse aux préoccupations croissantes concernant la défense civile et le terrorisme. Le Bureau de la protection civile a mis en place un réseau de défense aérospatiale axé sur le réseau et doté d'un réseau d'interception."
 cbd_rad_def_inter_desc:0 "Cette nation a fondé un Bureau de défense civile en réponse aux préoccupations croissantes concernant la défense civile et le terrorisme. Le Bureau de la protection civile a mis en place un réseau de défense aérospatiale axé sur la protection civile, doté d'un réseau d'interception."
 cbd_rad_net_pdn_desc:0 "Cette nation a fondé un Bureau de défense civile en réponse aux préoccupations croissantes concernant la défense civile et le terrorisme. Le Bureau de la protection civile a mis en place un réseau de défense aérospatiale axé sur le réseau et doté d'un réseau anti-aérien."
 cbd_rad_def_pdn_desc:0 "Cette nation a fondé un Bureau de défense civile en réponse aux préoccupations croissantes concernant la défense civile et le terrorisme. Le Bureau de la défense civile a établi un réseau de défense aérospatiale axé sur la protection civile et doté d'un réseau anti-aérien."
 
