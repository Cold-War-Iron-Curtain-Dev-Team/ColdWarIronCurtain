l_french:
 THIRD_BALKAN_WAR_TIMER:0 "Troisième minuterie de guerre des Balkans"
 CIA_Expansion:0 "Expansion de la CIA"
 import_restrictions:0 "Restrictions à l'importation"
 generic_military_hq:0 "Établir un QG militaire"
 generic_military_hq_desc:0 "Notre armée est désorganisée et en proie à l'adhocratie. Afin d'avoir une chance dans le monde et de survivre, nous devons établir un quartier général militaire et organiser notre structure militaire."
 high_grade_army:0 "Armée de haut niveau"
 high_grade_army_desc:0 "Il est clair, avec notre vaste population laborieuse, que nous devons établir une armée fondée sur les principes de qualité. Nous créerons de grandes divisions très coûteuses afin d'écraser nos ennemis avec notre puissance technologique et industrielle."
 armor_exercises:0 "Exercices d'armure"
 armor_exercises_desc:0 "Afin de mieux comprendre le fonctionnement du blindage au combat, nous devons organiser une large série d'exercices de tir réel."
 mechanized_exercises:0 "Exercices mécanisés"
 mechanized_exercises_desc:0 "Nous devons réaliser une série d'exercices avec des armes simulées telles que des pistolets airsoft afin de repenser le fonctionnement de nos forces mécanisées."
 special_forces_expansion:0 "Expansion des forces spéciales"
 special_forces_expansion_desc:0 "Élément essentiel de toute armée d'élite, les forces spéciales sélectionnent des recrues parmi les meilleures de l'armée et leur font accomplir des tâches spéciales. Il est indispensable d'élargir notre programme de forces spéciales."
 modernize_army:0 "Moderniser l'armée"
 modernize_army_desc:0 "Nos exercices étant enfin terminés, nous pouvons désormais envisager de créer une armée moderne. Pour y parvenir, nous devons commencer à mettre à jour notre technologie militaire."
 nuclear_weapons_program:0 "Programme d'armes nucléaires"
 nuclear_weapons_program_desc:0 "Nous pouvons obtenir des financements étrangers pour notre programme d'armes nucléaires en prétendant les investir dans l'énergie nucléaire. Nous demanderons des sommes excédentaires pour développer une énergie nucléaire de faible qualité, puis dépenserons le reste dans des bombes nucléaires."
 tank_research_perm:0 "Centre de recherche sur les blindés"
 tank_research_perm_desc:0 "Afin de garantir que nos réservoirs sont les meilleurs au monde, nous établirons une équipe de recherche dédiée au sein de notre centre de recherche."
 mech_research_perm:0 "Installation de recherche mécanisée"
 mech_research_perm_desc:0 "Nous allons agrandir notre centre de recherche nouvellement créé pour ajouter une équipe mécanisée."
 black_berets:0 "Programme des Bérets noirs"
 black_berets_desc:0 "Les menaces contre nous sont vastes. Les Bérets noirs seront la lance emblématique de notre nation."
 airborne_cavalry:0 "Corps de cavalerie aéroportée"
 airborne_cavalry_desc:0 "Le corps de cavalerie aéroportée constitue une force très mobile composée de nos forces aéroportées. Ils veilleront à ce que nous puissions réagir à n'importe quelle situation de combat et repousser les avancées, aussi fortes ou fréquentes soient-elles."
 mech_optimization:0 "Optimiser la production mécanisée"
 mech_optimization_desc:0 "Afin de garantir que nous pouvons produire en masse suffisamment de forces mécanisées pour notre armée, nous élargirons notre équipe de recherche mécanisée avec des optimiseurs pour simplifier les pièces."
 psych_training:0 "Améliorer la formation au béret noir"
 psych_training_desc:0 "Afin de garantir que nos Bérets noirs soient les plus élitistes, nous devons créer un programme d'entraînement extrême pour garantir qu'ils soient les plus courageux du monde."
 army_intelligence:0 "Commission du renseignement de l'armée"
 army_intelligence_desc:0 "Afin de protéger notre pays des menaces et des influences étrangères, nous devons créer une commission du renseignement militaire dédiée à la protection de nos informations et à l'espionnage de nos ennemis."
 low_cost_army:0 "Armée à bas prix"
 low_cost_army_desc:0 "Notre peuple est fort et courageux. Nous n'avons pas besoin d'équipements ni d'armes coûteux pour protéger notre pays. Il suffit simplement d'augmenter leur nombre sur le terrain."
 infantry_exercises:0 "Exercices d'infanterie"
 infantry_exercises_desc:0 "Nous devons organiser une série d'exercices et de wargames avec notre infanterie afin de mieux comprendre les techniques et tactiques nécessaires sur le champ de bataille."
 light_armor_exercises:0 "Exercices d'armure légère"
 light_armor_exercises_desc:0 "Nous devons organiser des exercices avec nos chars légers afin de mieux comprendre comment ils peuvent combattre."
 motor_exercises:0 "Exercices moteurs"
 motor_execises_desc:0 "Pour mieux comprendre les capacités de nos moteurs, nous devons effectuer une série de tests avec nos camions dans différents environnements pour voir comment ils se comportent."
 reorganize_army:0 "Réorganiser l'armée"
 reorganize_army_desc:0 "Après avoir tiré des enseignements importants de nos tests et exercices, nous comprenons désormais comment réorganiser notre armée et mieux la préparer au combat."
 adhoc_infantry_equipment:0 "Équipes ad hoc de conception d'équipement d'infanterie"
 adhoc_infantry_equipment_desc:0 "Nous rencontrons de graves problèmes avec notre équipement d'infanterie obsolète. Nous devons moderniser notre équipement pour que notre infanterie puisse écraser nos ennemis."
 light_armor_manufacturing:0 "Réduction des coûts des armures légères"
 light_armor_manufacturing_desc:0 "En établissant une équipe dédiée de mécaniciens visionnaires pour optimiser nos chars légers, nous pouvons produire encore plus qu'avant et noyer nos ennemis dans leur puissance."
 motor_manufacturing:0 "Réduction des coûts du moteur"
 motor_manufacturing_desc:0 "Nos camions coûtent trop cher. Nous devons mettre en place une équipe de mécaniciens dont le seul objectif est de trouver des moyens d'économiser de l'argent et de simplifier le processus de fabrication."
 infantry_manufacturing:0 "Réduction des coûts de l'infanterie"
 infantry_manufacturing_desc:0 "Pour aller encore plus loin, nous avons besoin d'une équipe d'ingénieurs dans notre centre de recherche qui se consacrent à simplifier les pièces et à améliorer la fiabilité de nos armes."
 airborne_cavalry_light:0 "Corps de cavalerie aéroportée"
 airborne_cavalry_light_desc:0 "Le corps de cavalerie aéroportée constitue une force très mobile composée de nos forces aéroportées. Ils veilleront à ce que nous puissions réagir à n'importe quelle situation de combat et repousser les avancées, aussi fortes ou fréquentes soient-elles."
 motor_design:0 "Équipe d'ingénierie automobile"
 motor_design_desc:0 "Nous devons élargir notre équipe d'optimisation des moteurs avec des ingénieurs qui nous aideront à concevoir de nouveaux véhicules pour notre armée."
 submarine_focus:0 "Installation secrète de conception de sous-marins"
 submarine_focus_desc:0 "Il y a une très belle enclave que nous avons trouvée au large de la côte. Nous pouvons commencer à y réfléchir pour créer un centre de recherche sous-marin top secret."
 navy_exercise:0 "Exercice naval"
 navy_exercise_desc:0 "Nous devons organiser un exercice naval massif afin de mieux comprendre le fonctionnement du combat naval."
 submarine_manufacturing:0 "Département des Raiders du Commerce"
 submarine_manufacturing_desc:0 "La haute mer est criblée de convois ennemis transportant du ravitaillement. Nous devons créer un corps de pillards commerciaux dédié pour améliorer l'efficacité de notre chasse aux transports."
 escort_focus:0 "Département de logistique navale"
 escort_focus_desc:0 "Notre développement d'un Commerce Raider Corps nous a laissé un sentiment de vulnérabilité face aux attaques ennemies. Si nos ennemis font ce que nous faisons, nous pourrions être en danger. Nous devons organiser notre corps logistique et établir des protocoles de garde formalisés pour nos flottes."
 shore_bombardment_focus:0 "Département d'artillerie"
 shore_bombardment_focus_desc:0 "Notre marine doit être plus polyvalente que jamais. Nous devons créer des canons d'artillerie navale à longue portée dans notre centre de recherche pour aider nos armées sur terre."
 naval_air_research_foc:0 "Ministère conjoint de l'APN"
 naval_air_research_foc_desc:0 "Nous devons créer un département de recherche conjoint entre l'armée de l'air et la marine dans notre centre de recherche enclavé secret."
 navy_air_production:0 "Corps aérien interarmées"
 navy_air_production_desc:0 "Dans le cadre d'une fraternité suscitée par le département de recherche de notre enclave, notre marine et notre force aérienne souhaitent établir un corps aérien commun où l'armée de l'air forme les pilotes navals puis les remet. Cela ne peut que bien se passer."
 naval_recovery:0 "Département des Conforts Navals"
 naval_recovery_desc:0 "Curieusement, l'administrateur du centre de recherche de l'Enclave a consacré un nouveau département à l'amélioration des conditions de vie de notre marine. Nous devrions investir dans cela pour inspirer le moral de la marine."
 naval_repair:0 "Département de réparation navale"
 naval_repair_desc:0 "La construction des navires navals prend beaucoup de temps. Leur réparation prend beaucoup de temps. Nous devons créer un département dans notre centre de recherche Enclave spécialisé dans la conception de nouvelles façons d'améliorer le taux de réparation de nos navires."
 stronk_navy:0 "Marine puissante"
 stronk_navy_desc:0 "Sous-marins. Transporteurs. Force aérienne navale. Aucun de ces éléments n'est à la hauteur de la véritable puissance navale traditionnelle. Notre force réside dans nos flottes."
 screen_focus:0 "Installation de conception d'écrans secrets"
 screen_focus_desc:0 "Il y a une très belle enclave que nous avons trouvée au large de la côte. Nous pouvons commencer à nous y intéresser pour créer un centre de recherche top secret sur les vaisseaux écrans."
 capital_focus:0 "Installation de conception de capitaux secrets"
 capital_focus_desc:0 "Il y a une très belle enclave que nous avons trouvée au large de la côte. Nous pouvons commencer à y réfléchir pour créer un centre de recherche top secret sur les vaisseaux capitaux."
 navy_exercise_0:0 "Exercice naval"
 navy_exercise_0_desc:0 "Nous devons organiser un exercice naval massif afin de mieux comprendre le fonctionnement du combat naval."
 screen_capital_manufacturing:0 "Département de réduction des coûts"
 screen_capital_manufacturing_desc:0 "La seule réponse à un ennemi qui est plus puissant que nous dans un combat naval est de le surpasser. Nous devons créer un département dans nos installations de l'Enclave qui se consacre à l'optimisation des coûts de nos navires."
 naval_organization:0 "Département de l'équipage naval"
 naval_organization_desc:0 "Les équipages navals s'organisent naturellement avec les navires militaires eux-mêmes. Au fur et à mesure que des systèmes sont ajoutés, de nouveaux équipages sont désignés. Si nous créons un département dédié à l'amélioration de l'équipement et de l'organisation de ces équipages, nos marines pourront fonctionner plus efficacement."
 marine_focus:0 "Département maritime"
 marine_focus_desc:0 "Les Marines sont un élément crucial de toute armée. Bien qu'ils ne soient pas des forces d'élite comme les forces spéciales, ils sont plus forts que les réguliers. Un département maritime spécialisé dans la recherche d'armes et d'équipements marins nous permettra de tirer le meilleur parti de ces soldats."
 screen_attack:0 "Département des armes expérimentales"
 screen_attack_desc:0 "Il existe de nombreuses idées et théories non testées sur les armes navales. Nous devrions construire un département dans l'installation Enclave pour la recherche exploratoire."
 capital_attack:0 "Département des blindés marins"
 capital_attack_desc:0 "Nous devrions envisager de fabriquer des navires plus bien blindés et plus résistants, dotés de meilleurs systèmes de contrôle de tir et d'un meilleur blindage. Un département principal de recherche sur les blindés devrait faire l'affaire."
 guardian_angels:0 "Anges gardiens"
 guardian_angels_desc:0 "Les bombardiers ne sont rien si nous ne pouvons pas contrôler le ciel. Nos avions seront les anges gardiens de nos militaires."
 light_aircraft_research:0 "Installation de recherche sur les avions légers"
 light_aircraft_research_desc:0 "Nous devons construire une installation de recherche aéronautique dans un endroit éloigné pour mener des recherches."
 air_shows:0 "Spectacles aériens annuels"
 air_shows_desc:0 "Pour inspirer une tradition et une culture qui valorisent notre puissance aérienne, nous devons organiser une exposition annuelle à la vue de tous."
 air_shows_0:0 "Spectacles aériens annuels"
 air_shows_0_desc:0 "Pour inspirer une tradition et une culture qui valorisent notre puissance aérienne, nous devons organiser une exposition annuelle à la vue de tous."
 light_aircraft_manufacturing:0 "Centre d'optimisation de la lumière"
 light_aircraft_manufacturing_desc:0 "Nous devrions étendre nos installations de recherche aéronautique pour inclure un centre d'optimisation afin de réduire les coûts."
 air_safety_focus:0 "Centre de fiabilité"
 air_safety_focus_desc:0 "Nous devrions inclure un centre de développement pour aider à rendre notre vaisseau fiable."
 sabaton_firestorm:0 "Tempête de feu"
 sabaton_firestorm_desc:0 "L'armée de l'air est inutile si elle ne peut pas détruire ce qui se trouve au sol. Nos avions déclencheront une tempête de feu sur nos ennemis."
 bomber_research:0 "Installation de recherche sur les avions lourds"
 bomber_research_desc:0 "Nous devons construire une installation de recherche aéronautique dans un endroit éloigné pour mener des recherches."
 heavy_aircraft_manufacturing:0 "Centre d'optimisation lourde"
 heavy_aircraft_manufacturing_desc:0 "Nous devrions étendre nos installations de recherche aéronautique pour inclure un centre d'optimisation afin de réduire les coûts."
 heavy_reliability:0 "Centre de fiabilité"
 heavy_reliability_desc:0 "Nous devrions inclure un centre de développement pour aider à rendre notre vaisseau fiable."
 light_aircraft_research_0:0 "Programme de développement de la lumière"
 light_aircraft_research_0_desc:0 "Nous devrions tester de nouvelles installations et les doter de suffisamment de fonds pour un nouveau grand projet aérien."
 heavy_aircraft_research_0:0 "Programme de développement lourd"
 heavy_aircraft_research_0_desc:0 "Nous devrions tester notre nouvelle installation et la doter de suffisamment de fonds pour un nouveau projet aérien majeur."
 overpowered_missile_research:0 "Centre de fusées"
 overpowered_missile_research_desc:0 "Même si les avions à réaction et les avions eux-mêmes sont tous très bien, notre centre de recherche devrait inclure un centre dédié aux fusées elles-mêmes pour donner à ces avions plus de puissance de feu."
 area_69:0 "Centre de recherche top secret"
 area_69_desc:0 "Nous avons investi des sommes considérables dans notre armée. Nous disposons de trois installations de recherche dotées chacune de nombreux départements. Le moment est désormais venu de créer une nouvelle installation capable de mener des projets ciblés et de soutenir nos projets militaires."
 finance_minister:0 "Nommer le ministre des Finances"
 finance_minister_desc:0 "Le moment est venu de nommer un ministre des Finances pour présider le Trésor."
 mil_naval_bases:0 "Construire des bases navales"
 mil_naval_bases_desc:0 "Nous avons considérablement élargi notre infrastructure terrestre. Cependant, le moment est venu d'étendre notre infrastructure navale et de construire des ports et des havres pour nos villes."
 finance_welfare_warrior_1:0 "Créer un filet de sécurité substantiel"
 finance_welfare_warrior_1_desc:0 "Notre nouveau ministre des Finances a proposé que nous créions un filet de sécurité substantiel pour aider les pauvres."
 finance_welfare_warrior_2:0 "État providence"
 finance_welfare_warrior_2_desc:0 "Notre ministre des Finances a créé un plan visant à redistribuer la richesse par le haut pour aider ceux d'en bas."
 finance_subsidizer_1:0 "Augmenter les subventions"
 finance_subsidizer_1_desc:0 "Notre nouveau ministre des Finances a présenté un plan visant à verser des subventions aux industries qui manquent à notre pays afin de les rendre plus compétitives."
 finance_subsidizer_2:0 "Subventionner les compagnies ferroviaires"
 finance_subsidizer_2_desc:0 "Notre ministre des Finances a recommandé que nous accordions de l'argent gratuitement pour récompenser les compagnies ferroviaires qui les aident, car la majeure partie de la richesse créée par les chemins de fer est externe."
 finance_finance_hawk_1:0 "Réduire les impôts"
 finance_finance_hawk_1_desc:0 "Notre nouveau ministre des Finances a fait irruption dans votre bureau. Ils ont apporté un gros livre de 500 pages rempli de suggestions sur de petites réductions et réductions qui totalisent beaucoup."
 finance_finance_hawk_2:0 "Réduire les retraites de l'État"
 finance_finance_hawk_2_desc:0 "Notre ministre des Finances a recommandé que nous réduisions les retraites de l'État et que nous obligeions chacun à rechercher une pension privée pour sa retraite."
 infrastructure_interstate:0 "Construire une autoroute"
 infrastructure_interstate_desc:0 "Notre pays est mal desservi par les transports. Nous devons construire une autoroute pour relier nos pays entre eux."
 infrastructure_railway:0 "Construire une artère ferroviaire"
 infrastructure_railway_desc:0 "Maintenant que nous avons une nouvelle autoroute, nous devrions envisager de construire l'Arterial Railway dont notre ministre des Finances parle sans arrêt."
 health_minister:0 "Nommer le ministre de la Santé"
 health_minister_desc:0 "La situation sanitaire de notre pays se détériore de seconde en seconde. Nous devons nommer un nouveau ministre de la Santé visionnaire pour nous remettre en forme."
 health_socialist_1:0 "Soins de santé socialisés"
 health_socialist_1_desc:0 "Notre nouveau ministre de la Santé a recommandé que nous lancions un programme de soins de santé universel afin de mieux soigner notre population."
 health_socialist_2:0 "Programmes de santé communautaire"
 health_socialist_2_desc:0 "Notre ministre de la Santé a présenté une série de plans visant à améliorer les programmes de santé pour notre population."
 health_technocrat_1:0 "Centre de recherche médicale"
 health_technocrat_1_desc:0 "Notre nouveau ministre de la Santé a fait valoir de solides arguments selon lesquels la seule façon d'obtenir les soins de santé dont nous avons besoin est de mener des recherches approfondies."
 health_technocrat_2:0 "Laboratoires hospitaliers"
 health_technocrat_2_desc:0 "Notre ministre de la Santé nous a recommandé de créer une série de laboratoires indépendants dans nos hôpitaux pour mener des recherches et expérimenter de nouvelles procédures."
 health_finance_hawk_1:0 "Réduisez les coûts"
 health_finance_hawk_1_desc:0 "Notre ministre de la Santé a déclaré que notre système de santé coûte trop cher à notre pays et que des mesures doivent être prises pour réduire ce coût."
 health_finance_hawk_2:0 "Privatiser les soins de santé"
 health_finance_hawk_2_desc:0 "Notre ministre de la Santé a recommandé que nous passions à un système de santé entièrement privatisé et que nous accordions des bons d'exonération d'impôts aux personnes qui n'ont pas les moyens de bénéficier de soins de santé privés."
 infrastructure_urban:0 "Développer l'infrastructure urbaine"
 infrastructure_urban_desc:0 "Nous devrions envisager d'étendre les infrastructures urbaines dans nos villes pour accroître la productivité."
 infrastructure_revise_planning:0 "Réviser la planification urbaine"
 infrastructure_revise_planning_desc:0 "Nous devons revoir la façon dont nous menons la planification urbaine pour mieux répondre aux futures expansions et croissances des infrastructures urbaines."
 reshuffle_cabinet:0 "Remaniement ministériel"
 reshuffle_cabinet_desc:0 "L'ancien cabinet est incompétent et incapable de faire son travail correctement. Il est temps pour eux de prendre leur retraite et de nommer de nouveaux membres du cabinet."
 finance_minister.d:0 "Choisir un ministre des Finances pour gérer les finances du pays et administrer le Trésor"
 finance_minister.t:0 "Nommer le ministre des Finances"
 finalize_research_facility_high:0 "Finaliser l'installation de recherche"
 finalize_research_facility_high_desc:0 "Notre nouvelle installation est maintenant terminée. Il est temps d'organiser nos documents."
 finalize_research_facility_low:0 "Installation de guerre populaire"
 finalize_research_facility_low_desc:0 "Les installations de recherche de notre glorieux armée populaire sont terminées. Maintenant, agrafez les documents."
 finalize_naval_facility_flexible:0 "Installation navale flexible"
 finalize_naval_facility_flexible_desc:0 "Notre enclave de recherche navale est prête à être finalisée. Il suffit de mettre tous les papiers dans un seul dossier."
 finalize_naval_facility_stronk:0 "Installation de planification de grandes flottes"
 finalize_naval_facility_stronk_desc:0 "Nous avons terminé notre installation de recherche sur l'enclave navale et pouvons désormais noter tout ce que nous avons sur une seule liste."
 high_grade_facility:0 "Centre de recherche militaire inachevé"
