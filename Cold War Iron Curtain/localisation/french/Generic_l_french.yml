 commercial_philosophy_balanced:0 "Un secteur commercial robuste"
 commercial_philosophy_hybridization_desc:0 "Ce pays dispose d'un secteur commercial bien soutenu et moins susceptible de connaître des krachs"
 commercial_philosophy_balanced_desc:0 "Ce pays dispose d'un secteur commercial bien soutenu et moins susceptible de connaître des krachs. Il a également créé des districts d'entreposage pour améliorer la logistique financière et bénéficier à plusieurs secteurs."
 commercial_philosophy_financial:0 "Secteur Financier"
 commercial_philosophy_financial_office_zoning:0 "Secteur Financier"
 commercial_philosophy_financial_office_priority:0 "Secteur Financier"
 commercial_philosophy_financial_banking_it:0 "Secteur Financier"
 commercial_philosophy_financial_desc:0 "Ce pays dispose d'un vaste secteur financier qui renforce ses revenus"
 commercial_philosophy_financial_office_zoning_desc:0 "Ce pays dispose d'un vaste secteur financier qui renforce ses revenus. Le pays utilise également de vastes zones de zonage de bureaux pour contenir la pollution sonore commerciale et soutenir le commerce."
 commercial_philosophy_financial_office_priority_desc:0 "Ce pays dispose d'un vaste secteur financier qui renforce ses revenus. Le pays utilise également de vastes zones de zonage de bureaux pour contenir la pollution sonore commerciale et soutenir un large éventail de spécialisations commerciales."
 commercial_philosophy_financial_banking_it_desc:0 "Ce pays dispose d'un important secteur financier et informatique qui renforce ses revenus. Le pays utilise également de vastes zones de bureaux et de zones bancaires pour contenir la pollution sonore commerciale et soutenir un large éventail de spécialisations commerciales."
 commercial_philosophy_artisan:0 "Secteur Commercial Artisan"
 commercial_philosophy_artisan_agrarian:0 "Secteur Commercial Artisan"
 commercial_philosophy_artisan_agrarian_plus:0 "Secteur Commercial Artisan"
 commercial_philosophy_artisan_export:0 "Secteur Commercial Artisan"
 commercial_philosophy_artisan_desc:0 "Ce pays possède un secteur commercial ferme et productif qui est moins susceptible de connaître des fluctuations"
 commercial_philosophy_artisan_agrarian_desc:0 "Ce pays possède un secteur commercial solide et productif qui est moins susceptible de connaître des fluctuations. Il a accordé des droits fonciers au secteur agricole pour renforcer la stabilité commerciale."
 commercial_philosophy_artisan_agrarian_plus_desc:0 "Ce pays possède un secteur commercial solide et productif qui est moins susceptible de connaître des fluctuations. Il a accordé des droits fonciers, des perspectives et des subventions de développement au secteur agricole pour renforcer la stabilité commerciale."
 commercial_philosophy_artisan_export_desc:0 "Ce pays possède un secteur commercial solide et productif qui est moins susceptible de connaître des fluctuations. Il a accordé des droits fonciers, des perspectives, des subventions de développement et a créé une agence d'exportation pour le secteur agricole afin de renforcer la stabilité commerciale."
