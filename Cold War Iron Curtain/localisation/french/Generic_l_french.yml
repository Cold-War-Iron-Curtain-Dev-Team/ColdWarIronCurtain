 industry_minister:0 "Nommer le ministre de l'Industrie"
 industry_minister_desc:0 "Le moment est venu de nommer un nouveau ministre de l'Industrie."
 industry_communist_1:0 "Plan quinquennal"
 industry_communist_1_desc:0 "Notre nouveau ministre a recommandé que nous entamions un plan quinquennal pour l'économie"
 industry_communist_2:0 "Investissement industriel de l'État"
 industry_communist_2_desc:0 "Notre ministre a recommandé que nous commencions par saisir les moyens et commencer à construire des usines d'État"
 industry_rural_1:0 "Projet de développement rural"
 industry_rural_1_desc:0 "Notre nouveau ministre s'est mis au travail pour développer les zones rurales"
 industry_rural_2_desc:0 "Notre ministre a créé une Agence de protection de l'environnement"
 industry_rural_2:0 "Agence de protection de l'environnement"
 industry_capitalist_1:0 "Adoptez le libre-échange et le capitalisme"
 industry_capitalist_1_desc:0 "Notre nouveau ministre a recommandé que nous nous tournions vers une économie de lasseiz-faire pour améliorer notre pays"
 industry_capitalist_2:0 "Déréglementation"
 industry_capitalist_2_desc:0 "Notre ministre a commencé à rédiger un projet de loi visant à supprimer les réglementations inutiles"
 civilian_rust_belt:0 "Raviver la ceinture de rouille"
 civilian_industrialize:0 "Industrialiser"
 civilian_urban_renewal:0 "Renouvellement urbain"
 civilian_urban_services:0 "Services urbains"
 civilian_rust_belt_desc:0 "La ceinture de rouille industrielle de notre pays, autrefois un centre industriel emblématique et fier, n'est rien d'autre que des usines rouillées. Il faut le faire revivre pour lui redonner son ancienne gloire."
 civilian_industrialize_desc:0 "Il y a de nombreuses régions de notre pays non industrialisées et pleines de chômage, nous devrions créer un plan de relance pour sauver ces régions."
 civilian_urban_renewal_desc:0 "Nous souffrons de graves souffrances urbaines. Les zones à forte criminalité et à faible revenu sont trop courantes et causent des problèmes à ceux qui y vivent et à l'extérieur. Il faut redonner vie à ces lieux."
 civilian_urban_services_desc:0 "Les gouvernements municipaux de la ville doivent commencer à étendre leurs infrastructures civiles"
 mil_air_bases:0 "Construire des bases aériennes"
 mil_air_bases_desc:0 "Afin de défendre notre pays, notre force aérienne va avoir besoin de plus de bases aériennes pour protéger le ciel comme nos anges gardiens."
 safety_net:0 "Un filet de sécurité substantiel"
 safety_net_desc:0 "Ce pays possède un filet de sécurité substantiel pour réduire la pauvreté."
 welfare_state:0 "État providence"
 welfare_state_desc:0 "Ce pays investit des sommes importantes dans la protection sociale"
 subsidies_basic:0 "Des subventions importantes"
 subsidies_basic_desc:0 "Ce pays fausse considérablement son économie en sa faveur avec des subventions"
 subsidy_economy:0 "Économie de subvention"
 subsidy_economy_desc:0 "Ce pays influence fortement son secteur privé avec des subventions et des taxes"
 save_money:0 "Bureaucratie efficace"
 save_money_desc:0 "Le système gouvernemental de ce pays est efficace pour économiser de l'argent"
 save_more_money:0 "Des banques solides"
 save_more_money_desc:0 "Ce pays a un secteur financier privé très sain"
 socialism_healthcare:0 "Soins de santé universels"
 socialism_healthcare_desc:0 "Ce pays tente de fournir des soins de santé pour tous en les faisant payer les impôts."
 communism_healthcare:0 "Soins de santé universels avancés"
 communism_healthcare_desc:0 "Ce pays tente de fournir des soins de santé pour tous en les faisant payer les impôts et gère un programme de santé communautaire"
 medical_science:0 "Installations de recherche médicale"
 medical_science_desc:0 "Ce pays possède un centre de recherche médicale"
 medical_apotheosis:0 "Laboratoires hospitaliers"
 medical_apotheosis_desc:0 "Ce pays dispose d'au moins un petit laboratoire ou d'un effort d'étude dans chaque établissement médical. Il peut également ou non effectuer des tests illégaux sur ses citoyens. Peut être."
 reduce_medical_bills:0 "Soins de santé à faible coût"
 reduce_medical_bills_desc:0 "Ce pays tente de réduire les coûts des soins de santé"
 privatized_healthcare:0 "Soins de santé privés"
 privatized_healthcare_desc:0 "Les soins de santé dans ce pays sont privatisés"

 liberalized_communism:0 "Communisme libéralisé"
 socialist_state_unions:0 "Unions d'État socialistes"
 activate_communism:0 "Forfaits sur 5 ans"
 activate_communism_desc:0 "Ce pays mène des plans économiques quinquennaux"


 communism_intensifies:0 "Économie planifiée"
 communism_intensifies_desc:0 "Le gouvernement de ce pays contrôle la plupart des industries privées"
 rural_development_spirit:0 "Projets de développement rural"
 rural_development_spirit_desc:0 "§G+10%§! §YProduction de ressources§!\nCe pays tente de développer les économies rurales en les parrainant avec des investissements dans les infrastructures et les infrastructures civiles"
 have_furries_control_government:0 "Agence de protection de l'environnement"
 have_furries_control_government_desc:0 "Ce pays protège son environnement avec une réglementation stricte."
 activate_capitalism:0 "Économie capitaliste"
 activate_capitalism_desc:0 "Ce pays a embrassé le capitalisme"
 capitalism_intensifies:0 "Économie du laissez-faire"
 capitalism_intensifies_desc:0 "L'État de ce pays tente d'éviter d'intervenir dans son économie. Hormis d'autres esprits et politiques, il n'existe pratiquement aucune réglementation générale."
 education_minister:0 "Nommer le ministre de l'Éducation et de la Recherche"
 education_minister_desc:0 "Le moment est venu de choisir un ministre de l'éducation et de la recherche"
 education_progressive_1:0 "Éducation créative"
 education_progressive_1_desc:0 "Notre nouveau ministre de l'Éducation affirme que le « système éducatif en usine » est dépassé et que l'éducation doit être fondée sur la créativité"
 education_progressive_2:0 "Recherche de fonds"
 education_progressive_2_desc:0 "Notre ministre de l'Éducation, sans demander l'approbation préalable, a rédigé et présenté un projet de loi prévoyant des sommes considérables pour la recherche"
 education_conservative_1:0 "Construire des écoles"
 education_conservative_1_desc:0 "Notre nouveau ministre de l'Éducation dit que nous avons besoin de construire davantage d'écoles"
 education_conservative_2:0 "Enseignement public"
 education_conservative_2_desc:0 "Notre ministre de l'Éducation dit que nous devons enseigner les valeurs familiales et le patriotisme dans les écoles"
 education_militarist_1:0 "Jeunesse militaire"
 education_militarist_1_desc:0 "Notre ministre de l'Éducation a proposé une politique visant à créer un programme pour les jeunes militaires afin d'accroître le patriotisme et d'encourager le sentiment culturel pro-militaire."
 education_militarist_2:0 "Collèges militaires"
 education_militarist_2_desc:0 "Notre nouveau ministre de l'Éducation dit que pour obtenir une éducation collégiale, il faut servir au moins 4 ans dans l'armée, puis être entièrement payé. Ils ont insisté sur le fait que ce devrait être la seule solution."
 interior_minister:0 "Nommer le ministre de l'Intérieur"
 interior_minister_desc:0 "Le moment est venu de choisir un ministre de l'Intérieur"
 interior_civil_1:0 "PURGER LES TRAÎTRES"
 interior_civil_1_desc:0 "Quelques semaines après la nomination de notre nouveau ministre, des milliers de personnes ont disparu. Notre ministre de l'Intérieur a revendiqué la responsabilité et déclaré avoir trouvé des preuves qu'il s'agissait de criminels et de traîtres qui ont été purgés à juste titre."
 interior_civil_2:0 "État policier"
 interior_civil_2_desc:0 "Notre ministre a explosé le financement fédéral de toutes les forces de sécurité intérieures"
 interior_internal_1:0 "Audits internes"
 interior_internal_1_desc:0 "Notre nouveau ministre a lancé des enquêtes et des audits massifs dans notre pays pour éliminer toute personne susceptible de devenir corrompue."
 interior_internal_2:0 "Chasser les espions"
 interior_internal_2_desc:0 "Notre ministre a pris des mesures sérieuses pour éliminer les espions et les informateurs d'autres pays"
 interior_external_1:0 "Développer le réseau Intel"
 interior_external_1_desc:0 "Notre nouveau ministre s'est déjà mis au travail pour établir des réseaux d'informateurs confidentiels rémunérés dans d'autres pays"
 interior_external_2:0 "Projet FANTÔME"
 interior_external_2_desc:0 "Notre ministre a retiré de grandes sommes d'argent du Trésor et ne nous dit pas où cet argent est dépensé. Elle affirme que cela sera payant."
 defense_minister:0 "Nommer le ministre de la Défense"
 defense_minister_desc:0 "Le moment est venu de nommer un nouveau ministre de la Défense"
 defense_quartermaster_1:0 "Anciens Combattants"
 defense_quartermaster_1_desc:0 "Notre nouveau ministre exige que nous augmentions les dépenses consacrées aux anciens combattants"
 defense_quartermaster_2:0 "Fonds de secours de guerre"
 defense_quartermaster_2_desc:0 "Notre ministre a recommandé que nous créions un fonds de secours de guerre pour atténuer l'épuisement"
 defense_reformer_1:0 "Développer l'état-major général"
 defense_reformer_1_desc:0 "Notre nouveau ministre a exposé ses suggestions pour une nouvelle structure d'état-major. Cela nous oblige à tripler notre QG militaire."
 defense_reformer_2:0 "Développer l'état-major tactique"
 defense_reformer_2_desc:0 "Notre ministre a déclaré que nous avons besoin de plus de planificateurs pour faciliter le processus de planification militaire"
 defense_finance_hawk_1:0 "Réduisez les coûts"
 defense_finance_hawk_1_desc:0 "Notre nouveau ministre a dressé une longue liste de moyens possibles d'économiser de l'argent sur nos militaires"
 defense_finance_hawk_2:0 "Programme d'efficacité"
 defense_finance_hawk_2_desc:0 "Notre ministre a présenté un vaste système de rentabilité permettant aux militaires de réduire davantage leurs coûts."
 military_industrial_complex:0 "Complexe militaro-industriel"
 military_industrial_complex_desc:0 "Notre industrie militaire fait défaut. Nous devons commencer à l'étendre."
 military_naval_expansion:0 "Expansion navale"
 military_naval_expansion_desc:0 "Notre marine est trop faible. Nous devons commencer à construire des chantiers navals."
 military_revise_plans:0 "Réviser les plans"
 military_revise_plans_desc:0 "Nous devons repenser notre planification de défense et envisager d'élargir notre armée."
 military_increase_spending:0 "Augmenter les dépenses militaires"
 military_increase_spending_desc:0 "Nous devrions augmenter le montant que nous dépensons pour notre défense."
 mil_radar:0 "Projet Radar"
 mil_radar_desc:0 "Le radar est crucial dans le combat moderne. Nous devrions essayer de rechercher de meilleures technologies radar."
 ic_generic_events.1.t:0 "Candidats aux ministres des Finances"
 ic_generic_events.1.d:0 "Notre pays a besoin d'un nouveau ministre des Finances. Il y a actuellement 3 candidats parmi lesquels choisir. Le premier est un défenseur de l'aide sociale de gauche. Ils souhaitent accroître l'aide financière et le bien-être. Le second est un interventionniste qui veut diriger l'économie avec des subventions. Le troisième est un faucon de la finance de droite qui veut réduire les impôts, les coûts et renforcer les institutions financières."
 begin_selection:0 "Confirmer les candidats"
 police_state:0 "État policier"
 police_state_desc:0 "Ce pays a une police extrêmement bien financée et un environnement social restrictif"
 internal_audits:0 "Audits internes"
 internal_audits_desc:0 "Ce pays mène des audits réguliers au sein de son gouvernement"
 intel_network:0 "Réseau Intel"
 intel_network_desc:0 "Starfoth, veuillez ajouter des détails avant la mise à jour. Ne gâchez plus ça."
 thicc_intel_network:0 "Agence centrale de renseignement"
 thicc_intel_network_desc:0 "Ce pays a une agence de renseignement"
 ic_generic_events.4.t:0 "Candidats au ministère de l'Éducation"
 ic_generic_events.3.t:0 "Candidats ministres de l'Industrie"
 ic_generic_events.2.t:0 "Candidats ministres de la Santé"
 ic_generic_events.5.t:0 "Candidats au ministre de l'Intérieur"
 ic_generic_events.6.t:0 "Candidats au ministre de la Défense"
 ic_generic_events.4.d:0 "Nous avons décidé de nommer un nouveau ministre de la recherche et de l'éducation. Il y a un progressiste qui veut augmenter le financement, un conservateur qui veut enseigner le patriotisme et un militariste culturel qui veut militariser la société qui rivalisent pour ce poste."
 ic_generic_events.3.d:0 "Notre pays a besoin d'un bon ministre de l'Industrie. Il y a un communiste, un capitaliste et un écologiste qui sont tous de bons choix qualifiés pour ce poste."
 ic_generic_events.2.d:0 "La situation sanitaire dans notre pays est désastreuse. Nous devons choisir avec soin un bon ministre de la Santé. Nous pouvons choisir un défenseur des soins de santé universels, un technocrate et un faucon de la finance qui réduit les coûts à ce poste pour essayer d'améliorer les choses."
 ic_generic_events.5.d:0 "Le ministre de l'Intérieur gère notre espionnage et nos affaires intérieures. Choisissez judicieusement. Nous pouvons nommer un radical d'extrême gauche qui souhaite voir tous les traîtres de ce pays arrêtés, quelqu'un qui nous protégera intérieurement, ou un ancien banquier qui souhaite étendre les opérations de renseignement."
 ic_generic_events.6.d:0 "Potentiellement le plus important, le ministre de la Défense gérera la protection de notre pays en temps de guerre. Nous pouvons choisir quelqu'un qui souhaite voir la guerre moins violente, un réformateur qui sait comment repenser notre structure de commandement ou un faucon de la finance qui estime que nous devons réduire les coûts."
 soviet_alignment_general:0 "Alignement soviétique"
 soviet_alignment_general_desc:0 "Nous choisissons de nous ranger du côté de nos alliés communistes contre la marée rampante du capitalisme. Capitalisme? Plutôt du CRAPITALISME."
 independance_alignment_general:0 "Auto-alignement"
 independance_alignment_general_desc:0 "Les Soviétiques et l'Occident sont à la fois des ordures et un fléau sur cette Terre. Nous devrions nous y opposer et choisir de nous renforcer."
 Western_Alignment:0 "Alignement occidental"
 Western_Alignment_desc:0 "Nous choisissons de défendre la démocratie et de ne pas être les marionnettes des maîtres communistes. Communisme? Plutôt du SCUMMUNISME."
 communist_gun_nuts:0 "Aide militaire soviétique"
 communist_gun_nuts_desc:0 "Les Soviétiques ont choisi de nous donner des armes gratuites. Nous ne les laisserons pas tomber."
 comecon_aids:0 "Aide économique du COMECON"
 comecon_aids_desc:0 "Le COMECON a choisi de nous envoyer une aide économique pour nous aider à construire."
 communist_spy_hubs:0 "Ambassades soviétiques"
 communist_spy_hubs_desc:0 "Nous devons établir une ambassade auprès de nos alliés soviétiques."
 kgb_conspirators:0 "Connexions du KGB"
 kgb_conspirators_desc:0 "Le KGB aimerait que nous coopérions avec eux et leur permettions d'établir des bases ici. Qu'est-ce qui pourrait mal se passer ?"
 foreign_investments_desc:0 "Un grand nombre d'investisseurs étrangers viennent dans notre pays pour construire des usines et des magasins orientés vers l'ouest."
 foreign_investments:0 "Investissements étrangers"
 military_aids:0 "Aide à la sécurité américaine"
 military_aids_desc:0 "Les États-Unis nous envoient des armes, des fonds et des formations pour équiper notre armée."
 western_cia_agencies:0 "Ambassades occidentales"
 western_cia_agencies_desc:0 "Il serait prudent d'établir des ambassades dans les pays occidentaux."
 cia_conspirators:0 "Connexions de la CIA"
 cia_conspirators_desc:0 "La CIA aimerait établir des sites secrets dans notre pays. Quel est le pire qui pourrait ressortir de cela ?"
 strengthen_sphere:0 "Renforcer la sphère locale"
 strengthen_sphere_desc:0 "Nous devons renforcer notre propre sphère d'influence, resserrer notre emprise sur nos subordonnés et accroître nos relations avec nos alliés."
 self_sufficiency_general:0 "Autosuffisance"
 self_sufficiency_general_desc:0 "Nous ne pouvons compter sur aucune grande puissance pour assurer notre force économique. Nous devons compter sur nous-mêmes."
 real_ass_politik:0 "Realpolitique"
 real_ass_politik_desc:0 "Nous sommes les puissances légitimes de notre région et devons intervenir là où bon nous semble."
 patriotic_neutral:0 "Patriotisme"
 patriotic_neutral_desc:0 "Nous ne sommes les marionnettes de personne. Nous sommes nos propres maîtres. Nous sommes nous-mêmes des patriotes."
 radical_centrism:0 "Non aligné"
 radical_centrism_desc:0 "Ce pays a affirmé sa position face aux puissances étrangères et tente de renforcer ses liens locaux et sa propre sphère"
 radical_centrism_0:0 "Non aligné"
 radical_centrism_0_desc:0 "Ce pays a affirmé sa position face aux puissances étrangères et tente de renforcer ses liens locaux et sa propre sphère"
 radical_centrism_1:0 "Non aligné"
 radical_centrism_1_desc:0 "Ce pays a affirmé sa position face aux puissances étrangères et tente de renforcer ses liens locaux et sa propre sphère"
 radical_centrism_2:0 "Non aligné"
 radical_centrism_2_desc:0 "Ce pays a affirmé sa position face aux puissances étrangères et tente de renforcer ses liens locaux et sa propre sphère"
 alignment_boner:0 "Bureaux commerciaux"
 alignment_boner_desc:0 "Ce pays a établi des ambassades auprès de puissances étrangères et dispose désormais de bureaux commerciaux dans d'autres pays, facilitant ainsi les échanges commerciaux."
 infrastructure_boost_general:0 "Développement d'infrastructures"
 infrastructure_boost_general_desc:0 "Ce pays construit des infrastructures"
 civilian_boost_general:0 "Développement de l'industrie"
 civilian_boost_general_desc:0 "Ce pays construit son industrie"
 military_boost_general:0 "Renforcement militaire"
 military_boost_general_desc:0 "Ce pays construit son armée"
 navy_boost_general:0 "Accumulation de la marine"
 navy_boost_general_desc:0 "Ce pays construit sa marine"
 basic_welfare_state:0 "État-providence de base"
 reformed_welfare_state:0 "État-providence réformé"
 welfare_state_plus:0 "État providence"
 budget_cuts:0 "Coupes budgétaires"
 welfare_state_plus_desc:0 "Ce pays investit énormément dans les programmes de protection sociale"
 gen60_warrant_officer_comission:0 "Commission des adjudants"
 gen60_warrant_officer_comission_desc:0 "Établir un corps d'adjudants formalisé pour nos armées"
 gen60_support_corps:0 "Corps de soutien"
 gen60_support_corps_desc:0 "Créer un corps de soutien formalisé pour mieux aider nos divisions"
 gen60_new_officers:0 "Aux côtés des nouveaux officiers"
 gen60_new_officers_desc:0 "Les Nouveaux Officiers, jeunes et aux yeux étoilés, souhaitent créer une armée inspirée des bandes dessinées, où l'armée est aéromobile et où les héros d'élite sont nombreux."
 gen60_army_academy:0 "J'ai trouvé l'Académie de l'Armée"
 gen60_army_academy_desc:0 "Nous devons créer une académie militaire pour notre pays et la rendre grandiose ! L'académie formera nos officiers pour qu'ils soient les meilleurs et nous guidera vers la victoire !"
 gen60_side_with_old_guard_desc:0 "Desséchée et distinguée, la Vieille Garde souhaite créer une armée soutenue par une puissance de feu et dirigée par des blindés plutôt que par quoi que ce soit basé sur des films ou des fictions populaires."
 gen60_airmobile_army:0 "Armée aéromobile"
 gen60_airmobile_army_desc:0 "Les nouveaux officiers créent un corps spécial pour former des équipes de soldats aéroportés et développer des technologies d'hélicoptères."
 gen60_research_helicopters:0 "Projet de recherche sur les hélicoptères"
 gen60_research_helicopters_desc:0 "L'Académie militaire a financé un projet massif visant à développer la technologie des hélicoptères."
 gen60_wmd_dev:0 "Armes chimiques"
 gen60_wmd_dev_desc:0 "Armes nucléaires, chimiques, biologiques, toutes des armes horribles mais passionnantes qui, selon les nouveaux officiers, ne devraient jamais être utilisées dans un combat réel. Cependant, ils craignent également une invasion extraterrestre et souhaitent donc conserver un avantage contre tout ennemi potentiellement supérieur."
 gen60_finalize_army_academy:0 "Guerre terrestre 3D"
 gen60_finalize_army_academy_desc:0 "L'Académie de l'Armée est terminée et a réalisé les visions du nouvel officier"
 gen60_side_with_old_guard:0 "Aux côtés de la vieille garde"
 gen60_new_traditions:0 "Jetez les vieilles traditions"
 gen60_new_traditions_desc:0 "Il est temps d'abandonner les vieilles traditions et de fonder une nouvelle armée qui n'a pas encore fait ses preuves."
 gen60_old_traditions:0 "Adoptez les vieilles traditions"
 gen60_old_traditions_desc:0 "Peu importe qui nous avons pris parti dans la création de l'Académie de l'Armée, nous devons financer des projets de recherche que nous connaissons et auxquels nous pouvons faire confiance."
 gen60_special_forces_corps:0 "Corps des forces spéciales"
 gen60_special_forces_corps_desc:0 "Les forces spéciales se sont toujours révélées utiles dans la guerre et, à ce titre, doivent faire l'objet de recherches."
 newfocus_12:0 "Commission d'officier de fil profond"
 gen60_deep_wire_officers_desc:0 "Nos forces spéciales doivent disposer d'un leadership fort, notamment loin derrière les lignes ennemies."
 gen60_deep_wire_officers:0 "Commission d'officier de fil profond"
 gen60_ground_army:0 "Armée terrestre"
 gen60_ground_army_desc:0 "Notre infanterie constitue la base de notre armée. Ils ne sont peut-être pas le fer de lance, mais ils constituent au moins le long et solide axe de la capacité de pénétration de notre armée."
 gen60_mech_research:0 "Projet de recherche mécanisée"
 gen60_mech_research_desc:0 "Pour que notre armée puisse maintenir sa force, notre infanterie doit être mobile et bien protégée jusqu'à ce qu'elle se mette en position."
 gen60_conventional_missiles_1:0 "Missiles conventionnels"
 gen60_conventional_missiles_1_desc:0 "Nous devons disposer d'une solide base de roquettes dans notre armée pour détruire nos ennemis à distance."
 gen60_finalize_old_guard_academy:0 "Projet d'armes d'infanterie"
 gen60_finalize_old_guard_academy_desc:0 "Nous devrions réviser notre structure de commandement et le fonctionnement de notre armée afin qu'elles puissent mieux se soutenir mutuellement."
 gen60_navy_living_conditions:0 "Améliorer les conditions de vie"
 gen60_navy_living_conditions_desc:0 "Vous ne pouvez pas vous attendre à ce que de courageux aventuriers navals vivent dans une misère exiguë, n'est-ce pas ? Non. Améliorez tellement les conditions de vie sur le pont que la mer leur manquera !"
 gen60_light_armor_research:0 "Projet d'armure légère"
 gen60_light_armor_research_desc:0 "Financer un projet de blindage léger hautement mobile"
 gen60_more_fucking_choppers:0 "Projet d'hélicoptère"
 gen60_more_fucking_choppers_desc:0 "Investissez dans un plus grand projet d'hélicoptères pour soutenir nos armées"
 gen60_missile_research:0 "Projet de missile"
 gen60_missile_research_desc:0 "Financer un projet de recherche sur les missiles"
 gen60_heavy_armor_research:0 "Projet de recherche MBT"
 gen60_heavy_armor_research_desc:0 "Nous devrions financer un nouveau projet MBT pour aiguiser le fer de lance de notre armée"
 gen60_doctrine_up:0 "Réviser les tactiques modernes"
 gen60_doctrine_up_desc:0 "Nous devons réviser et affiner nos tactiques"
 gen60_art_of_hillary_clinton:0 "Projet de recherche sur l'artillerie"
 gen60_art_of_hillary_clinton_desc:0 "L'artillerie est un excellent moyen d'améliorer la puissance de feu de votre armée. Nous devrions améliorer le nôtre."
 gen60_airforce_academy:0 "J'ai trouvé l'Académie de l'Air Force"
 gen60_airforce_academy_desc:0 "Nous devons créer une académie de l'armée de l'air pour former nos officiers de l'air à la nouvelle ère."
 gen60_asup_0:0 "Traditions de soutien de la Force aérienne"
 gen60_asup_0_desc:0 "Notre force aérienne existe pour soutenir l'armée et c'est pour cette raison que nos traditions sont façonnées de cette façon."
 gen60_asuper_0:0 "Traditions de supériorité de la Force aérienne"
 gen60_asuper_0_desc:0 "Notre force aérienne existe pour dominer et nos traditions le reflètent."
 gen60_asup_1:0 "Agents de liaison de la SCA"
 gen60_asup_1_desc:0 "Nous avons besoin de liaisons d'appui aérien rapproché pour guider nos frappes et protéger nos armées"
 gen60_asup_2:0 "Champ de formation des Interdicteurs"
 gen60_asup_2_desc:0 "Nous devons établir un terrain de formation interdit pour notre académie"
 gen60_asup_3:0 "Corps de logistique aérienne"
 gen60_asup_3_desc:0 "Nous avons besoin d'un corps de logistique aérienne pour soutenir nos armées"
 gen60_asuper_1:0 "Supériorité sur appel"
 gen60_asuper_1_desc:0 "Nos chasseurs aériens doivent être capables d'arriver sur place et d'établir leur domination dans le ciel !"
 gen60_asuper_2:0 "Terrain d'entraînement des bombardiers"
 gen60_asuper_2_desc:0 "Nous devons entraîner nos bombardiers stratégiques pour faire pleuvoir la destruction tactique sur nos ennemis !"
 gen60_asuper_3:0 "Écoles de bombardiers navals"
 gen60_asuper_3_desc:0 "Notre force aérienne doit affirmer sa supériorité sur tout. Y compris la marine ennemie !"
 gen60_air_doctrine_up:0 "Réviser les doctrines aériennes modernes"
 gen60_air_doctrine_up_desc:0 "De nombreux théoriciens militaires pensent qu'à l'avenir, le ciel sera dominé par la vitesse et l'agilité à longue portée plutôt que par les combats aériens. Cela semble ridicule, mais ils soulèvent le fait que les temps changent et que nous devons nous y adapter."
 gen60_area_69:0 "Développez les académies !"
 gen60_area_69_desc:0 "Nos académies sont peut-être terminées, mais nous devons augmenter considérablement leur capacité de recrutement afin que nos officiers puissent créer de nouvelles armes pour l'avenir !"
 gen60_naval_fuel_efficiency:0 "Efficacité énergétique"
 gen60_naval_fuel_efficiency_desc:0 "Disposer de navires économes en carburant leur permettra de rester en service plus longtemps et d'avoir une plus grande autonomie que jamais !"
 gen60_navy_adventure:0 "Aventuriers aux yeux étoilés"
 gen60_navy_adventure_desc:0 "De manière irrégulière, nous avons décidé de nommer des idéalistes aux yeux étoilés pour diriger notre Académie navale"
 gen60_hardy_semen:0 "Des marins robustes"
 gen60_hardy_semen_desc:0 "Nous avons fait le choix manifestement supérieur de nommer nos officiers de marine les plus expérimentés pour diriger notre académie."
 gen60_navy_aa:0 "Polyvalence du navire"
 gen60_navy_aa_desc:0 "Nos courageux aventuriers ont désespérément besoin de pouvoir se défendre seuls sans aucun soutien et nous devrions donc améliorer la capacité AA navale de nos navires !"
 gen60_spam_fleet:0 "Flotte de plusieurs"
 gen60_spam_fleet_desc:0 "Le nombre fait la force et nous devons l'adopter dans nos marines."
 gen60_naval_academy:0 "J'ai trouvé l'Académie navale"
 gen60_naval_academy_desc:0 "L'Académie navale formera nos officiers de marine et défendra notre pays par mer !"
 gen60_naval_research:0 "Flotte bien prise en charge"
 gen60_naval_research_desc:0 "Nous avons besoin d'une flotte bien soutenue par chacune de ses parties"
 gen60_naval_armor:0 "Armure maritime"
 gen60_naval_armor_desc:0 "Nos navires doivent avoir un blindage lourd pour résister aux attaques ennemies"
 gen60_navy_org:0 "Amirauté distinguée"
 gen60_navy_org_desc:0 "Suivant une tradition de mérite et de réussite maritime, nous veillerons à ce que nos amiraux soient les meilleurs au monde !"
 gen60_fleet_of_few:0 "Flotte de quelques personnes"
 gen60_fleet_of_few_desc:0 "Nous devons avoir une flotte plus petite et plus forte plutôt que de minuscules canonnières attendant d'être abattues."
 gen60_naval_research_general_boost:0 "Modernisation navale"
 gen60_naval_research_general_boost_desc:0 "Nous devons moderniser notre marine avec un projet massif qui y consacrera autant de ressources que possible. (REMARQUE|:| alors que la limite d'un jour peut sembler insignifiante, le bonus de temps naval est appliqué dès que vous démarrez le projet de recherche)"
 gen60_screen_research:0 "Projet d'écran"
 gen60_screen_research_desc:0 "Nous devrions rechercher de petits navires en grande quantité"
 gen60_sub_project:0 "Projet sous-marin"
 gen60_sub_project_desc:0 "Lorsque vous manquez de place à la surface de l'eau, remplissez également le sous-marin."
 gen60_capital_research:0 "Projet d'investissement"
 gen60_capital_research_desc:0 "Notre flotte a cruellement besoin d'un nouveau vaisseau capital pour écraser nos ennemis. Il faut investir là-dedans !"
 gen60_carrier_research:0 "Projet transporteur"
 gen60_carrier_research_desc:0 "En fait, un aérodrome flottant, le porte-avions fait partie intégrante de la guerre navale moderne."
 gen60_wr_pe_1:0 "Pro-Employeur"
 gen60_wr_pe_1_desc:0 "L'employeur dirige l'entreprise, prend le risque et les ouvriers sont là de leur propre gré. S'ils ne l'aiment pas, nous ne pouvons pas forcer les employeurs à faire ce qu'ils ne veulent pas ou ne peuvent pas faire."
 gen60_wr_b_1:0 "Équilibré"
 gen60_wr_b_1_desc:0 "Les deux côtés soulèvent de bons points et nous ne pouvons pas négliger les droits des travailleurs, mais nous ne pouvons pas non plus sacrifier l'industrie pour ce faire."
 gen60_wr_pu_1:0 "Pro-Union"
 gen60_wr_pu_1_desc:0 "A quoi sert l'employeur ? Lessivage sur le dos des travailleurs ? Leadership et gestion ? Capital? Quoi qu'il en soit, les travailleurs sont le véritable épicentre et nous devons les protéger."
 gen60_wr_pe_2:0 "Abroger les lois sur les heures de travail et le salaire minimum"
 gen60_wr_pe_2_desc:0 "C'est décidé. La meilleure façon d'aider les travailleurs est de faire croître l'économie. Nous devons abroger toutes les lois qui empêchent cela."
 gen60_wr_b_2:0 "Solutions pragmatiques"
 gen60_wr_b_2_desc:0 "Nous devons être pragmatiques et trouver une solution mutuellement avantageuse."
 gen60_wr_pu_2:0 "Déclaration des droits des travailleurs"
 gen60_wr_pu_2_desc:0 "Notre pays doit rédiger une déclaration des droits des travailleurs ! 6 heures de travail par jour ! Sécurité maximale ! Méritocratie et démocratisation du travail !"
 gen60_e:0 "Débats sur l'environnementalisme"
 gen60_e_desc:0 "Les débats écologistes s'intensifient dans le pays. Qui peut gagner ?"
 gen60_e_p_1:0 "Perspectives consuméristes"
 gen60_e_p_1_desc:0 "Quel est l'intérêt de prendre soin de l'environnement si nous sommes misérables ? Nous devons consommer autant que nous le souhaitons et nous adapter à l'avenir quand il se présente !"
 gen60_e_b_1:0 "Perspectives équilibrées"
 gen60_e_b_1_desc:0 "Et si nous n'abandonnions pas nos produits de consommation mais ne détruisions pas notre seule planète, oui ?"
 gen60_e_e_1:0 "Perspectives vertes"
 gen60_e_e_1_desc:0 "Nous devrions rechercher les plaisirs matériels et trouver le bonheur dans l'harmonie et la durabilité environnementale !"
 gen60_e_e_2:0 "Culte de Terra"
 gen60_e_e_2_desc:0 "Nous devons protéger notre Terre Mère à tout prix. Nous pouvons trouver du réconfort dans les jardins, la méditation, les biens de consommation fiables et durables, etc. Sans oublier que de telles choses nous rapprochent de la Terre elle-même."
 gen60_e_b_2:0 "Tempérance"
 gen60_e_b_2_desc:0 "Nous devons être modérés. Faites des sacrifices là où nous en avons besoin et ne consommez pas trop. Mais nous devrions quand même nous réjouir et nous amuser."
 gen60_e_p_2:0 "Matérialisme"
 gen60_e_p_2_desc:0 "Qui se soucie de demain quand on peut s'amuser aujourd'hui ?"
 gen60_gmr:0 "Débats sur le genre et les droits des minorités"
 gen60_gmr_desc:0 "Les débats sur l'égalité des sexes et les droits des minorités s'intensifient !"
 gen60_gmr_archy_1:0 "Patri/Matriarcat"
 gen60_gmr_archy_1_desc:0 "Notre culture (Agnatique/Enatique) a toujours fonctionné telle quelle et devrait rester la même !"
 gen60_gmr_archy_2:0 "Règle de la majorité"
 gen60_gmr_archy_2_desc:0 "C'est notre pays, pas le leur. C'est nous qui dirigeons ici, pas eux !"
 gen60_gmr_b_1:0 "Tradition culturelle"
 gen60_gmr_b_1_desc:0 "Notre culture (Agnatique/Énatique)-Cognatique a toujours fonctionné. Personne ne devrait être limité par la loi, mais il est indéniable que les hommes et les femmes étaient censés être des femmes au foyer, de par leur conception biologique."
 gen60_gmr_b_2:0 "Tolérance envers les minorités"
 gen60_gmr_b_2_desc:0 "Nous n'allons pas lancer des campagnes d'action positive massives, mais en même temps nous devons reconnaître l'égalité des minorités."
 gen60_gmr_e_1:0 "Égalité totale"
 gen60_gmr_e_1_desc:0 "Nous sommes absolument cognatiques. L'égalité positive dans la culture et dans le droit doit être appliquée !"
 gen60_gmr_e_2:0 "Action positive des minorités"
 gen60_gmr_e_2_desc:0 "Nous ne sommes pas responsables des actes de nos ancêtres. Nous ne devons pas ce que nous n'avons pas pris. Cela ne veut pas dire que nous ne devons pas réparer les torts du passé. Même si le monde entier se méprisait autrefois, nous chercherons à nous tourner vers l'avenir."
 gen60_lgbt:0 "SAGA"
 gen60_lgbt_desc:0 "Débats sur la sexualité et l'acceptation du genre"
 gen60_lgbt_t_2:0 "Normes de genre"
 gen60_lgbt_t_2_desc:0 "Il n'y a que (l'historique des genres de votre culture ici) des genres. Obtenez des libtards possédés !"
 gen60_lgbt_t_1:0 "Normes sexuelles traditionnelles"
 gen60_lgbt_t_1_desc:0 "C'est ?p???? et moi??? pas ?p ???? et moi ?!"
 gen60_lgbt_b_1:0 "Légalisation LGB+"
 gen60_lgbt_b_1_desc:0 "Il ne devrait y avoir aucune loi qui impose la sexualité. Allez les gars, c'est les années 60."
 gen60_lgbt_b_2:0 "Acceptation du genre"
 gen60_lgbt_b_2_desc:0 "Sexe et genre et 2 choses différentes. Nous accepterons l'identité des gens à un niveau modéré, mais ne me le mettez pas au visage, s'il vous plaît."
 gen60_lgbt_e_1:0 "Action positive LGBT+"
 gen60_lgbt_e_1_desc:0 "Nous devons protéger les personnes LGB+ de la discrimination et être progressistes."
 gen60_lgbt_e_2:0 "Action transgenre positive"
 gen60_lgbt_e_2_desc:0 "Notre culture reflétera notre progressivité. Soyez qui vous voulez être. Faites ce que vous voulez et tant que vous ne faites de mal à personne, tout va bien."
 gen60_m:0 "Débats sur le militarisme culturel"
 gen60_m_desc:0 "Les débats s'intensifient sur l'action militaire."
 gen60_m_j_1:0 "Le jingoïsme"
 gen60_m_j_1_desc:0 "À LA GUERRE ! PAR JINGO! AU DIABLE LES LÂCHES, ILS NE CHANGENT JAMAIS DE SOUS-VÊTEMENTS ET ENCORE MOINS CE MISÉRABLE MONDE !"
 gen60_m_j_2:0 "Hawkisme de guerre"
 gen60_m_j_2_desc:0 "La guerre est destructrice par nature, mais de cette destruction, de nouveaux mondes peuvent renaître de leurs cendres. Saisissons l'ère moderne et veillons à ce que ce soit nous qui définissions ce qui naît de ses cendres."
 gen60_m_b_1:0 "Pro-militaire"
 gen60_m_b_1_desc:0 "Soutenez nos courageuses troupes !"
 gen60_m_b_2:0 "Augmenter les salaires des militaires"
 gen60_m_b_2_desc:0 "Nous devrions augmenter le montant que nous payons à nos militaires."
 gen60_m_p_1:0 "Pacifisme"
 gen60_m_p_1_desc:0 "La guerre ? Hein? A quoi ça sert ? Absolument rien ! C'est intrinsèquement destructeur et ne fait que nuire à notre monde."
 gen60_m_p_2:0 "Réduire les dépenses militaires"
 gen60_m_p_2_desc:0 "Et si nous réduisions les dépenses militaires et utilisions l'argent pour des choses dont nous avons VRAIMENT besoin."
 gen60_g:0 "Débats mondialisme contre nationalisme"
 gen60_g_desc:0 "Ces débats façonneront l'avenir de notre nation."
 gen60_g_g_1:0 "Mondialisme"
 gen60_g_g_1_desc:0 "Medieval_Total_War_Soundtrack_we_are_all_one.mp3"
 gen60_g_g_2:0 "Fonds de développement international"
 gen60_g_g_2_desc:0 "Une petite partie de la richesse de notre pays devrait être versée à ceux qui en ont besoin et contribuer au développement international."
 gen60_g_b_1:0 "Vues équilibrées"
 gen60_g_b_1_desc:0 "Nous devrions nous soucier des autres nations, mais nous ne devons rien à personne. Notre pays passe avant tout !"
 gen60_g_b_2:0 "Investisseurs étrangers"
 gen60_g_b_2_desc:0 "Nous devrions rechercher des investisseurs étrangers et le commerce international pour gagner de l'argent."
 gen60_g_n_1:0 "Nationalisme"
 gen60_g_n_1_desc:0 "Notre pays est supérieur et nos intérêts devraient être la seule chose à laquelle nous prêtons attention."
 gen60_g_n_2:0 "Protectionnisme"
 gen60_g_n_2_desc:0 "Notre pays a besoin d'un protectionnisme économique résolu pour conjurer l'influence étrangère et renforcer son indépendance nationale."
 gen60_wr:0 "Débats sur les droits des travailleurs"
 gen60_wr_desc:0 "Les débats sur les droits des travailleurs sont désormais au premier plan de l'attention nationale."
 gen60_social_question:0 "La question sociale"
 gen60_social_question_desc:0 "Une fois de plus, les questions sociales sont au premier plan de notre politique. Nous devrions les régler pour ne pas avoir à nous occuper de drames et de BS dans une année future comme je ne sais pas, peut-être la fin des années 2010 ou quelque chose du genre."
 gen60_nat_tv:0 "Créer un réseau de télévision national"
 gen60_nat_tv_desc:0 "Notre pays a cruellement besoin de médias et de divertissement. Nous devons construire un grand réseau de télévision !"
 gen60_big_game:0 "Le grand jeu"
 gen60_big_game_desc:0 "Notre sport national préféré sera diffusé pour la première fois dans tout le pays. C'est très excitant !"
 gen60_darkwoods:0 "Producteurs de films de Darkwoods"
 gen60_darkwoods_desc:0 "Juste à l'extérieur des célèbres Darkwoods de notre pays, un grand nombre de studios et de producteurs de films s'installent !"
 gen60_cartoons:0 "Dessins animés et BD !"
 gen60_cartoons_desc:0 "Notre nation aime les dessins animés, les bandes dessinées et les héros !"
 gen60_drama:0 "Caractéristiques et drame !"
 gen60_drama_desc:0 "Notre nation est très connue pour ses longs métrages et ses actes dramatiques !"
 gen60_huh_huh_he_got_hit_in_the_nuts_huh_huh:0 "Humour à sourcils bas"
 gen60_huh_huh_he_got_hit_in_the_nuts_huh_huh_desc:0 "Notre nation aime la comédie. Aussi grossier que cela puisse paraître aux autres."
 gen60_realart:0 "Beaux-Arts"
 gen60_realart_desc:0 "Notre pays est supérieur aux autres et accorde la plus haute estime aux beaux-arts et à la musique."
 gen60_radio:0 "Développer le réseau radio"
 gen60_radio_desc:0 "Notre nation a cruellement besoin d'une amélioration de nos réseaux radio."
 gen60_fakenews:0 "Médias indépendants"
 gen60_fakenews_desc:0 "Les médias indépendants de notre pays bénéficient de l'expansion des réseaux."
 gen60_realnews:0 "Journalistes militaires"
 gen60_realnews_desc:0 "Nos rapports militaires peuvent désormais atteindre plus de personnes que jamais !"
 gen60_space_race:0 "Nouveau concurrent de la course spatiale"
 gen60_space_race_desc:0 "(Pas encore terminé. Veuillez attendre la refonte de la course à l'espace) Nous sommes riches. Nous sommes puissants. Il est maintenant temps de briller et de rejoindre la course à l'espace !"
 gen60_natreporters:0 "Interdire les agences d'information étrangères"
 gen60_interreporters:0 "Autoriser les journalistes internationaux"
 gen60_interreporters_desc:0 "Nous devrions inviter des journalistes internationaux de notre pays à nous représenter."
 gen60_natreporters_desc:0 "Nous ne pouvons faire confiance qu'aux agences de presse internes pour rapporter au monde les informations concernant notre pays."
 newfocus_121:0 "newfocus_121"
 gen60_sports_stadiums:0 "Construire des stades sportifs"
 gen60_sports_stadiums_desc:0 "Notre pays aime le sport et nous devrions construire plus de stades"
 gen60_parks_and_rec:0 "Construire des parcs"
 gen60_parks_and_rec_desc:0 "Même si les stades peuvent être passionnants, nous devrions plutôt tenter d'investir dans les parcs et les loisirs"
 gen60_build_a_factory:0 "Construisez simplement une usine"
 gen60_build_a_factory_desc:0 "Pour"
 gen60_endow_commerce:0 "Doter l'expansion commerciale"
 gen60_endow_commerce_desc:0 "Nous devrions envisager d'agrandir les quartiers commerciaux afin qu'ils puissent divertir les masses plutôt que de compter sur des parcs ou des stades"
 gen60_proclaim:0 "Proclamez la victoire de la course spatiale !"
 gen60_proclaim_desc:0 "Nous avons déclaré notre victoire dans la course à l'espace !"
 gen60_world_conquest:0 "Exigez un contrôle mondial"
 gen60_world_conquest_desc:0 "Notre ascendant technologique est insondable ! Nous devons maintenant annexer le monde entier sous notre contrôle et guider l'humanité vers les étoiles !"
 gen60_late_socialist:0 "Groupe d'intérêt socialiste"
 gen60_late_socialist_desc:0 "Les groupes d'intérêt socialistes souhaitent changer ou modifier nos politiques nationales"
 gen60_late_centrist:0 "Groupe d'intérêt centriste"
 gen60_late_centrist_desc:0 "Les groupes d'intérêt centristes souhaitent changer ou modifier nos politiques nationales existantes"
 gen60_late_capitalist:0 "Groupe d'intérêt capitaliste"
 gen60_late_capitalist_desc:0 "Les groupes d'intérêt capitalistes souhaitent changer ou ajouter des politiques capitalistes à notre pays"
 gen60_healthcare_1:0 "Soins de santé universels"
 gen60_healthcare_1_desc:0 "Les groupes d'intérêt socialistes souhaitent abroger toute loi contradictoire sur la santé et ajouter la CSU à notre pays. (Niveau 1)"
 gen60_subsidies:0 "Subventions"
 gen60_subsidies_desc:0 "Les groupes d'intérêt centristes estiment que nous devrions abroger les anciennes lois financières et instaurer une économie de subventions. (Niveau 1)"
 gen60_welfare:0 "Un filet de sécurité substantiel"
 gen60_welfare_desc:0 "Les groupes d'intérêts sociaux de notre pays souhaitent instituer un filet de sécurité conséquent (Niveau 1)"
 gen60_stronk_banks:0 "Réforme financière"
 gen60_stronk_banks_desc:0 "Les capitalistes de notre pays souhaitent abolir les retraites publiques et réduire les coûts. (Niveau 2)"
 gen60_techno_healthcare:0 "Laboratoires hospitaliers"
 gen60_techno_healthcare_desc:0 "Les centristes de notre pays souhaitent créer des laboratoires hospitaliers pour améliorer la recherche médicale. (Niveau 2)"
 gen60_schools:0 "Développer le système scolaire"
 gen60_schools_desc:0 "Les centristes de notre pays veulent que nous construisions plus d'écoles (Niveau 1)"
 gen60_5_year_plan:0 "Forfaits sur 5 ans"
 gen60_5_year_plan_desc:0 "Les groupes d'intérêts sociaux souhaitent que nous établissions une économie étatique forte. (Niveau 2)"
 gen60_cut_military:0 "Réduire les dépenses militaires"
 gen60_cut_military_desc:0 "Les capitalistes de notre pays veulent que nous réduisions les coûts de notre armée (Niveau 2)"
 gen60_reduce_med_costs:0 "Réduire les frais médicaux"
 gen60_reduce_med_costs_desc:0 "Les capitalistes de notre pays veulent réduire les coûts médicaux. (Niveau 1)"
 gen_army_academy:0 "Académie militaire de base"
 gen_army_academy_desc:0 "Ce pays possède une académie militaire pour former ses officiers"
 gen_airforce_academy:0 "Académie de base de la Force aérienne"
 gen_airforce_academy_desc:0 "Ce pays possède une académie de l'armée de l'air pour former ses officiers"
 gen_navy_academy:0 "Académie navale de base"
 gen_navy_academy_desc:0 "Ce pays possède une académie de marine pour former ses officiers"
