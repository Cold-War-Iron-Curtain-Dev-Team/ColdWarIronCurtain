### Iceland

 ICE_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 ICE_infantry_equipment_0_short:0 "SMLE n°4"
 ICE_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 ICE_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 ICE_infantry_equipment_1_short:0 "FN FAL"
 ICE_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."
 
 ICE_infantry_equipment_2:0 "Heckler & Koch G3"
 ICE_infantry_equipment_2_short:0 "G3"
 
 ICE_infantry_equipment_3:0 "Kongsberg Våpenfabrikk AG-3"
 ICE_infantry_equipment_3_short:0 "AG-3"
 
 ICE_infantry_equipment_4:0 "Diemaco C8"
 ICE_infantry_equipment_4_short:0 "C8"
 ICE_infantry_equipment_4_desc:0 "La gamme de carabines Diemaco C8 sont des variantes de carabines de la famille C7 et sont mécaniquement et esthétiquement très similaires au Colt 653. Colt a fabriqué les premiers C8 pour les Forces canadiennes sous le nom de Colt modèle 725. Le C8 a un canon de profil A1 de 368 mm (14,5 po) comme la carabine Colt modèle 653 M16A1"

