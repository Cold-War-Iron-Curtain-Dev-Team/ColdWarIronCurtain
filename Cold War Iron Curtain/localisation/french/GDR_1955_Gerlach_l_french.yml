l_french: 

 GDR_Prime_Minister_Gerlach: "Premier ministre Gerlach"
 GDR_Prime_Minister_Gerlach_desc: "Manfred Gerlach a acquis la direction de la RDA ; il est temps de le reconnaître officiellement comme notre nouveau Premier ministre."
 GDR_A_Trip_to_Moscow_Gerlach: "Un voyage à Moscou"
 GDR_A_Trip_to_Moscow_Gerlach_desc: "Une visite d'État à Moscou contribuera à légitimer la nouvelle administration et à apaiser les craintes soviétiques quant à tout changement radical dans notre politique étrangère."
 GDR_Establish_a_Commission_for_Legal_Reform: "Créer une commission pour la réforme juridique"
 GDR_Establish_a_Commission_for_Legal_Reform_desc: "Nous ne pouvons plus nier la nécessité d'une réforme. Une commission d'État sera créée pour enquêter et proposer une nouvelle législation qui aidera la RDA à aller de l'avant."
 GDR_Reform_the_Education_System: "Réformer le système éducatif"
 GDR_Reform_the_Education_System_desc: "Notre système éducatif fait l'objet d'une propagande excessive et est inefficace ; nos écoles sont destinées à l'éducation et non à l'endoctrinement."
 GDR_Seek_to_Undercut_NDPD_Middle_Class_Support: "Chercher à saper le soutien du NDPD"
 GDR_Seek_to_Undercut_NDPD_Middle_Class_Support_desc: "Le NDPD est très populaire parmi la classe moyenne. Si nous parvenons à convaincre leurs partisans, le parti risque de s'effondrer."
 GDR_Reaffirm_Freedom_of_Religion: "Réaffirmer la liberté de religion"
 GDR_Reaffirm_Freedom_of_Religion_desc: "Tout État moderne, socialiste ou non, doit garantir la liberté de ses citoyens de pratiquer leur culte comme bon leur semble. Nous ne serons pas différents."
 GDR_Guarantee_Press_Freedoms: "Garantir la liberté de la presse"
 GDR_Guarantee_Press_Freedoms_desc: "La presse doit pouvoir s'exprimer et circuler librement. Empêcher cela est à la fois antidémocratique et antisocialiste."
 GDR_Allow_Independent_Labor_Unions: "Autoriser les syndicats indépendants"
 GDR_Allow_Independent_Labor_Unions_desc: "Nous permettrons aux syndicats d'opérer en dehors du contrôle du gouvernement. Nous n'avons pas besoin de surveiller chaque détail de l'organisation ouvrière."
 GDR_Propose_Revised_COMECON_Trade_Deals: "Proposer des accords commerciaux révisés avec le COMECON"
 GDR_Propose_Revised_COMECON_Trade_Deals_desc: "La plupart de nos accords avec le COMECON sont injustement unilatéraux. Si nous voulons commercer, cela doit se faire sur un pied d'égalité."
 GDR_Support_Neutralist_West_German_Organizations: "Soutenir les organisations neutralistes ouest-allemandes"
 GDR_Support_Neutralist_West_German_Organizations_desc: "Il existe en Allemagne de l'Ouest des factions qui recherchent une vision étrangère neutre et sans engagement. Peut-être pourrions-nous trouver un terrain d'entente avec eux ?"
 GDR_Outreach_to_the_FDP: "Sensibilisation au FDP"
 GDR_Outreach_to_the_FDP_desc: "Il y a certains membres du Parti libéral-démocrate dont les idées correspondent aux nôtres, peut-être pourrions-nous former une coalition avec eux ?"
 GDR_A_New_Economic_Reality: "Une nouvelle réalité économique"
 GDR_A_New_Economic_Reality_desc: "Nos réformes ont conduit à une augmentation constante de la productivité, veillons à ce que la tendance se poursuive dans la bonne direction."
 GDR_Break_Up_Handelsorganisation: "Rompre l'organisation Handels"
 GDR_Break_Up_Handelsorganisation_desc: "L'Organisation commerciale est devenue trop grande, détenant presque le monopole de tous les biens que le consommateur allemand peut acheter. Il faut le briser."
 GDR_Allow_Private_Financial_Institutions: "Autoriser les institutions financières privées"
 GDR_Allow_Private_Financial_Institutions_desc: "La prochaine étape de nos réformes financières est l'introduction d'institutions financières privées. Les partisans de la ligne dure seront indignés, mais cela est nécessaire pour garantir la continuité de notre prospérité."
 GDR_A_New_Dawn_for_the_Republic: "Une nouvelle aube pour la République"
 GDR_A_New_Dawn_for_the_Republic_desc: "Nos réformes ont prouvé que le libre marché peut fonctionner dans un pays socialiste. C'est une nouvelle aube pour notre République et bien sûr pour le monde socialiste."
 GDR_Privitize_the_Volkseigener_Betrieb: "Privatisez le Volkseigener Betrieb"
 GDR_Privitize_the_Volkseigener_Betrieb_desc: "Les entreprises publiques sont limitées dans leur capacité à favoriser le développement économique de l'Allemagne. Les privatiser devrait atténuer ce problème."
 GDR_Increase_Support_for_Displaced_Farmers: "Augmenter le soutien aux agriculteurs déplacés"
 GDR_Increase_Support_for_Displaced_Farmers_desc: "Une grande partie de notre population rurale a été déplacée et sans emploi après la guerre et l'industrialisation rapide de notre pays dans les années qui ont suivi. Nous devons renforcer leur aide."
 GDR_Slash_Taxes: "Réduire les impôts"
 GDR_Slash_Taxes_desc: "Le fardeau fiscal élevé laisse à notre population très peu d'argent de poche. Nous devrions réduire le taux d'imposition afin qu'ils puissent profiter des avantages de la libéralisation de notre marché."
