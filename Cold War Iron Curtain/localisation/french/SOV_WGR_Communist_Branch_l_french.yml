 # ============================================================================
 #  A RED BONN - 1949 West German election side branch (SOV / Stalin tree)
 #  Revealed only when the KPD wins WGRElection.1 option c.
 # ============================================================================

 # ---- Events ----
 sov_german_question.2.t:0 "Un Bonn Rouge"
 sov_german_question.2.d:0 "Les retours de la République fédérale ne sont pas une erreur. Max Reimann a prêté serment en tant que Bundeskanzler et, pour la première fois depuis 1933, un communiste gouverne depuis le sol allemand à l'ouest de l'Elbe.\n\nLa résidence MGB à Berlin est jubilatoire. Le ministère des Affaires étrangères ne l'est pas. Un Bonn communiste est un atout et un handicap sans précédent : un gouvernement socialiste assis à l'intérieur des zones d'occupation occidentales, entouré de garnisons américaines, britanniques et françaises, dépendant du charbon de la Ruhr qu'il ne contrôle pas et d'une monnaie imprimée à Francfort.\n\nLe camarade Reimann ne survivra pas grâce à son enthousiasme. Il survivra grâce à ce que Moscou est prêt à lui envoyer et à la rapidité avec laquelle nous pourrons sortir la République fédérale de l'orbite occidentale pour la faire entrer dans la nôtre."
 sov_german_question.2.a:0 "Alors nous ne le laisserons pas pendre."

 sov_german_question.3.t:0 "Les communistes prennent Bonn"
 sov_german_question.3.d:0 "Dans un résultat qu'aucune capitale occidentale ne croyait possible, le Kommunistische Partei Deutschlands est sorti des premières élections au Bundestag comme le plus grand parti et Max Reimann a formé un gouvernement.\n\nWashington a rappelé son haut-commissaire pour consultations. À Londres, le résultat est décrit comme le revers le plus grave du règlement d'après-guerre. À Paris, où la perspective d'un gouvernement allemand reste impopulaire, la réaction est plus proche de la panique.\n\nLa République fédérale a été créée pour ancrer l'Allemagne occidentale à l'Atlantique. Quatre ans après la guerre, elle a permis à l'Union soviétique de prendre pied sur le Rhin."
 sov_german_question.3.a:0 "La carte de l'Europe vient d'être redessinée."

 sov_german_question.4.t:0 "Moscou reconnaît le gouvernement Reimann"
 sov_german_question.4.d:0 "L'Union soviétique a accordé sa pleine reconnaissance diplomatique au gouvernement de la République fédérale d'Allemagne et un ambassadeur est en route pour Bonn.\n\nLe geste n'est pas simplement cérémonial. La reconnaissance de Moscou donne à Reimann quelque chose que les hauts commissaires occidentaux ont pris soin de lui refuser : le statut de chef de gouvernement légitime plutôt qu'un accident électoral à gérer jusqu'à son effondrement."
 sov_german_question.4.a:0 "Bonn n'est plus seule."

 sov_german_question.5.t:0 "Deux États, une route"
 sov_german_question.5.d:0 "Pour la première fois, la République démocratique allemande et la République fédérale ont publié un communiqué commun.\n\nIl n'annonce pas l'unification : ni Ulbricht ni Reimann n'ont intérêt à être absorbés par l'autre, et Moscou n'a aucun intérêt à ce qu'un seul État allemand soit suffisamment grand pour avoir ses propres opinions. Ce qu'il annonce, c'est une coordination : des objectifs de planification partagés, des frontières ouvertes pour les cadres du parti, une reconnaissance mutuelle des qualifications et des documents de voyage.\n\nLa nation allemande reste divisée. La route allemande, pour l'instant, ne le fait pas."
 sov_german_question.5.a:0 "Divisés, mais marchant au pas."

 sov_german_question.6.t:0 "L'Atlantique recule"
 sov_german_question.6.d:0 "Les conséquences d'un Bonn communiste se propagent à l'extérieur de l'Europe occidentale plus rapidement que quiconque à Washington ne l'avait prévu.\n\nEn France et en Italie, les partis communistes, exclus du gouvernement depuis 1947, pointent du doigt le Rhin et se demandent pourquoi les urnes étaient légitimes à Bonn mais pas à Paris ou à Rome. Les députés socialistes qui ont défendu pendant deux ans l'intégration atlantique ont du mal à faire valoir leurs arguments.\n\nL'alliance n'est pas rompue. Mais l'hypothèse sur laquelle elle a été construite - selon laquelle l'avenir de l'Europe occidentale était réglé et réglé vers l'ouest - n'est plus valable."
 sov_german_question.6.a:0 "Laissez-les l'expliquer à leurs propres travailleurs."

 # ---- Focuses ----
 SOV_wge_a_red_bonn:0 "Un Bonn Rouge"
 SOV_wge_a_red_bonn_desc:0 "Le Kommunistische Partei Deutschlands a remporté les élections au Bundestag et Max Reimann dirige la République fédérale. Personne à Moscou n'avait prévu un tel résultat, et encore moins ceux qui ont autorisé l'opération qui l'a produit.\n\nUn gouvernement communiste à Bonn n'est pas un satellite. Elle se situe à l'intérieur des zones d'occupation occidentales, son économie liée à la Ruhr et à une réforme monétaire imposée depuis Francfort, sa capitale entourée de garnisons qui répondent à Washington. On peut l'étrangler à loisir si on ne fait rien.\n\nCe qui peut également être, s'il est géré correctement, la première fissure dans le règlement atlantique."
 SOV_wge_a_red_bonn_tt:0 "Débloque la branche §YA Red Bonn§!. La projection de puissance étrangère soviétique §Yaugmente§!."

 SOV_wge_recognize_the_reimann_government:0 "Reconnaître le gouvernement Reimann"
 SOV_wge_recognize_the_reimann_government_desc:0 "Les hauts-commissaires occidentaux n'ont pas encore décidé s'ils considéreraient les élections comme valides. Leur hésitation est notre opportunité.\n\nEn reconnaissant Reimann immédiatement et inconditionnellement, nous transformons un résultat ambigu en un fait accompli. Chaque jour où la République fédérale fonctionne comme un Etat normal avec un chancelier communiste est un jour où l'argument en faveur de l'annulation des élections devient plus difficile à faire valoir en public."
 SOV_wge_recognize_the_reimann_government_tt:0 "§YL'influence soviétique§! en Allemagne de l'Ouest augmente fortement aux dépens des Américains.\n§YL'approbation du KPD§! augmente."

 SOV_wge_bonn_into_the_sphere:0 "Bonn dans la sphère"
 SOV_wge_bonn_into_the_sphere_desc:0 "La reconnaissance achète la légitimité de Reimann. Cela ne lui assure pas la sécurité.\n\nLa République fédérale doit être formellement intégrée à la sphère soviétique - garanties de sécurité, partage de renseignements, liaison avec les partis et, si Bonn le souhaite, adhésion à notre système d'alliance. C'est cette mesure que les puissances occidentales interpréteront comme une déclaration selon laquelle l'Allemagne est perdue pour elles, et elles n'auront pas tort."
 SOV_wge_bonn_into_the_sphere_tt:0 "L'Allemagne de l'Ouest rejoint la sphère soviétique §Y§! et, si nous dirigeons une faction, elle est invitée à la rejoindre.\n§YLe contrôle de l'État du KPD§! et §Yl'influence communiste§! en Allemagne de l'Ouest augmentent."

 SOV_wge_arm_the_west_german_workers:0 "Armer les travailleurs ouest-allemands"
 SOV_wge_arm_the_west_german_workers_desc:0 "La Bundesgrenzschutz a été créée pour surveiller la frontière orientale. Sous Reimann, c'est la seule force armée de la République fédérale qui répond à Bonn plutôt qu'à une autorité d'occupation, et elle est mal équipée pour la tâche qui lui est désormais demandée.\n\nCe que nous enverrons arrivera sous forme de matériel de police. Ce n'est pas pour cela qu'il s'agit d'un travail de police."
 SOV_wge_arm_the_west_german_workers_tt:0 "L'Allemagne de l'Ouest reçoit §Yd'infanterie soviétique et du matériel de soutien§!.\n§YPerformances BGS§! et §YContrôle de l'état KPD§! augmentation."

 SOV_wge_comecon_for_the_ruhr:0 "COMECON pour la Ruhr"
 SOV_wge_comecon_for_the_ruhr_desc:0 "L'industrie de la République fédérale fonctionne grâce au charbon de la Ruhr, et la Ruhr fonctionne grâce aux crédits du Plan Marshall que Washington peut retirer à tout moment. Le gouvernement de Reimann sera brisé par un blocus économique bien avant de l'être par une armée.\n\nLa réponse est de remplacer le crédit avant qu'il ne soit retiré - commandes soviétiques et est-européennes, matières premières soviétiques et accès aux marchés des économies socialistes à des conditions que Bonn ne peut obtenir de personne d'autre."
 SOV_wge_comecon_for_the_ruhr_tt:0 "Accès mutuel au marché §Y§! avec l'Allemagne de l'Ouest.\nLe Trésor soviétique finance l'arrangement et le Wirtschaftswunder ouest-allemand §Y§! accélère."

 SOV_wge_the_ruhr_arsenal:0 "L'Arsenal de la Ruhr"
 SOV_wge_the_ruhr_arsenal_desc:0 "L'acier de la Ruhr a construit les armées qui ont incendié Kiev et affamé Leningrad. Il y a une certaine justice dans ce que nous entendons en faire maintenant.\n\nDes accords de production conjointe lieront l'industrie lourde ouest-allemande aux commandes militaires soviétiques - ainsi qu'aux conceptions soviétiques, à l'outillage soviétique et aux normes soviétiques. Bonn obtient le travail. Nous obtenons un deuxième arsenal et une République fédérale qui ne peut se rééquiper pour personne d'autre."
 SOV_wge_the_ruhr_arsenal_tt:0 "Gain budgétaire important et nouvelle construction §Yindustrie de l'armement§!."

 SOV_wge_two_states_one_road:0 "Deux États, une route"
 SOV_wge_two_states_one_road_desc:0 "Deux États allemands, tous deux gouvernés par des communistes, prétendant tous deux parler au nom de la nation allemande, sans vouloir se dissoudre dans l'autre. Ulbricht considère Bonn comme un parvenu. Reimann considère Berlin comme une garnison.\n\nNous ne tenterons pas l'unification : un État allemand unique de quatre-vingts millions d'habitants, aussi rouge soit-il, n'est pas quelque chose que Moscou devrait souhaiter voir exister. Ce que nous ferons, c'est les coordonner : plans partagés, mouvement des cadres ouvert, une ligne sur la question allemande. Divisés et marchant au pas."
 SOV_wge_two_states_one_road_tt:0 "Les relations entre la §YRDA§! et la §YRépublique fédérale§! s'améliorent considérablement.\nLe pouvoir du parti SED §Y§! et la légitimité §Y§! augmentent et le mécontentement du public diminue."

 SOV_wge_the_atlantic_recoils:0 "L'Atlantique recule"
 SOV_wge_the_atlantic_recoils_desc:0 "L'exemple vaut plus que l'atout.\n\nLes partis communistes occidentaux ont passé deux ans à se faire dire qu'ils étaient exclus du gouvernement pour le bien de la démocratie. Bonn a rendu cet argument intenable. Tous les communistes français et italiens peuvent désormais pointer du doigt un parlement d'Europe occidentale où les urnes ont produit un chancelier communiste et où le ciel ne leur est pas tombé sur la tête.\n\nNous veillerons à ce que ce point ne soit perdu pour personne."
 SOV_wge_the_atlantic_recoils_tt:0 "§YLa popularité communiste§! et §Yl'influence soviétique§! augmentent fortement en France et en Italie.\nLa projection de puissance étrangère soviétique §Yaugmente§!."

 SOV_wge_atlantic_recoils_threat:0 "Une Bonn communiste"
