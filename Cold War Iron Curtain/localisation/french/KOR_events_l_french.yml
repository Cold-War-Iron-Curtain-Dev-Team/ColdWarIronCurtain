 KOR_korean_war_victory.1.d:0 "Nous venons de gagner la guerre. Personne n'aurait pu deviner ce qui se passerait si nous perdions. Maintenant, nous devons gouverner correctement la région nord de notre pays."
 
 #Secretary of Defense question event
 #KOR_Secretary_of_Defense.1.d:0 "The former Secretary of Defense Lee Beom-seok has requested that his resignation be accepted. His role as Prime Minister will remain, but if he resigns as Secretary of Defense, a new figure will have to sit there and take charge of the military. What should we do?"
 #KOR_Secretary_of_Defense.2.d:0 "Shin Sung-mo became the new defense minister. He was a former naval officer and served in the military with the rank of lieutenant general, but recently returned to Korea to assist Rhee Syng-man. He has no actual experience and is considered "military incompetent" by many people, but it may be quite helpful for President Syngman Rhee himself. As soon as he was appointed as Minister of Defense, he is strongly advocating the theory of Korean unification by force."
 #KOR_Secretary_of_Defense.3.d:0 "Admiral Shin Sung-mo demanded the highest rank of navy in exchange for taking the position of defense minister from him. What should we do?"
 #50s Diplomacy
 KOR_diplo50s.1.d:0 "Après que les États-Unis d'Amérique ont organisé des conversations entre les hommes politiques de la République de Corée et du Japon, une conférence diplomatique officielle nippo-coréenne devrait avoir lieu entre les deux parties. Ils discuteront des conflits historiques, des conflits territoriaux et de la question de la relocalisation des Japonais-Coréens en Corée du Nord."
 #Kim Koo assassination
 KOR_Kim_Koo_assasination.0.d:0 "Nous devons nous préparer pour l'événement à venir. Comment ça va marcher ?"
 KOR_Kim_Koo_assasination.1.d:0 "Les espoirs d'une réunification coréenne et d'un nationalisme revigoré en République de Corée ont pris fin aujourd'hui, puisque son éminent défenseur, Kim Koo, a été assassiné aujourd'hui. Selon la police, Ahn Doo-hee, un lieutenant de l'armée de la République de Corée, a fait irruption dans la résidence de Kim Koo et lui a tiré dessus à quatre reprises. Selon Ahn, il affirme qu'il est seul responsable de l'assassinat, affirmant qu'il a été commis de sa propre initiative et qu'aucune autre partie n'a joué de rôle dans l'assassinat de Kim Koo. Il a également déclaré que Kim Koo serait un collaborateur de l'Union soviétique et que sa présence en République de Corée constitue un terrain fertile pour la rébellion et l'insurrection. Cependant, les observateurs pensent le contraire et spéculent que la tentative d'assassinat a en fait été orchestrée par l'administration Rhee elle-même dans le but de consolider le pouvoir et l'influence dans toute la République. Néanmoins, cet assassinat entachera la réputation de l'administration Rhee."
 KOR_Kim_Koo_assasination.2.d:0 "Les espoirs d'une réunification coréenne et d'un nationalisme revigoré en République de Corée ont presque pris fin aujourd'hui, alors que son éminent défenseur, Kim Koo, a été sur le point d'être assassiné aujourd'hui. Ahn Doo-hee, un lieutenant de l'armée de la République de Corée, a fait irruption dans la résidence de Kim Koo et a failli lui tirer dessus, mais juste avant cela, Kim Koo lui a sauté dessus et lui a crié à l'aide. À ce moment-là, les gardes des résidents se sont précipités dans la maison et ont maîtrisé le suspect. Plus tard dans la matinée, Kim Koo a déclaré que le tueur qui avait été envoyé chez lui était « clairement un membre des gens du président Syngman Rhee ». Kim Koo n'a pas été blessé et cette tentative d'assassinat sera une tache sombre sur la réputation de l'administration Rhee."
 KOR_kimseongsu.2.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque Kim Seong-su, propriétaire d'un journal coréen renommé et homme politique de premier plan, est décédé des suites d'une maladie à Séoul. Pendant la période d'occupation japonaise, Kim Seong-su a dirigé diverses organisations allant d'une entreprise de presse à des entreprises textiles et des écoles, et a contribué à la modernisation culturelle de la Corée. Comme beaucoup d'autres propriétaires de journaux coréens de son époque, Kim Seong-su a soutenu l'effort de guerre japonais dans plusieurs articles. Après la libération de la Corée, Kim Seong-su a ouvertement réfléchi à ses activités passées et est devenu le deuxième vice-président de la République de Corée. Il a cependant démissionné pour protester contre le comportement dictatorial du président Syngman Rhee. Il a continué à prôner la démocratie jusqu'à sa mort récente."
 KOR_yisiyeong.2.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque Yi Si-yeong, célèbre militant indépendantiste coréen et homme politique de premier plan, est décédé de causes naturelles à Busan. Yi Si-yeong et les membres de sa famille ont consacré toute leur vie au mouvement indépendantiste coréen, dépensant une grande partie de leur richesse pour les mouvements indépendantistes tant au pays qu'à l'étranger. Après la libération de la Corée du joug colonial japonais, Yi Si-yeong a été élu premier vice-président de la République de Corée grâce à sa grande réputation. Ses funérailles auront lieu près de Busan."
 #Syngman Rhee 1948
 KOR_SYNGMANRHEE48.1.d:0 "L'activité officielle de la Commission spéciale d'enquête sur les actes de trahison a été suspendue de manière inattendue en raison d'une perquisition dans son immeuble de bureaux. Le coupable de ce raid s'est avéré être la police de l'administration Syngman Rhee. Syngman Rhee critique depuis longtemps l'enquête du comité sur les anciens collaborateurs japonais dans les domaines politique, économique et culturel de la République de Corée, en particulier dans les forces de police. Suite à la dissolution du comité, l'administration de Syngman Rhee a arrêté des législateurs opposants, accusés d'être des espions du Parti des travailleurs de la République de Corée. Les législateurs arrêtés, dont le vice-président de l'Assemblée nationale, ont joué un rôle majeur dans l'organisation de la commission."
 KOR_SYNGMANRHEE48.2.d:0 "Cet après-midi, la ligue Bodo a été créée. La création de cette organisation s'inspire de Daehwasuk, un groupe de conversion pro-japonais de l'époque coloniale japonaise, et est liée à la loi sur la sécurité nationale, entrée en vigueur en décembre 1948, et il est analysé que le gouvernement coréen avait besoin d'une institution pour protéger, gérer et surveiller systématiquement les convertis. Le procureur Sunwoo Jong-won et Oh Je-do ont dirigé le processus de formation."
 KOR_SYNGMANRHEE48.3.d:0 "Ce matin, la campagne d'éradication à Jeju vient de se terminer. La Première République de Corée, dirigée par le président Syngman Rhee, a intensifié la répression du soulèvement à partir d'août 1948, en déclarant la loi martiale en novembre et en lançant une « campagne d'éradication » contre les forces rebelles dans les zones rurales de Jeju en mars 1949, les battant en deux mois. La situation à Jeju ne semble pas bonne."
 KOR_SYNGMANRHEE48.4.d:0 "Après l'indépendance le 15 août 1945, il y avait plusieurs partis de gauche en République de Corée, mais les activités du Parti communiste coréen étaient presque au point mort, de sorte que les trois partis (le Parti communiste de Corée, le Parti populaire de Corée et le Nouveau Parti démocratique de la République de Corée) ont fusionné pour former le « Parti des travailleurs de la République de Corée ». Heo Heon a été élu premier président et le vice-président Park Hon-yong a été élu. Cette semaine, le président Syng-man Rhee de la Première République a promulgué la loi sur la sécurité nationale, chassant ainsi toutes les forces communistes de la République de Corée en utilisant le pouvoir public en vertu de la loi sur la sécurité nationale."
 KOR_SYNGMANRHEE48.5.d:0 "Le lendemain de la déclaration de la loi martiale à Busan, 50 législateurs ont été arrêtés et emmenés par la police militaire alors qu'ils se rendaient en bus à leur lieu de travail. L'administration de Syngman Rhee les a accusés d'être membres du « Parti communiste international » et de conspirer contre le gouvernement de la République de Corée. Les législateurs ont été interrogés et détenus pendant 27 heures. De nombreux membres de l'Assemblée nationale, y compris les législateurs arrêtés, se sont prononcés contre la proposition de Syngman Rhee visant à modifier la constitution et à prolonger la durée du mandat présidentiel. Le vice-président Kim Seong-su a démissionné en signe de protestation et la Commission des Nations Unies en Corée a critiqué le comportement violent du gouvernement de Syngman Rhee."
 #Syngman Rhee 1952
 KOR_SYNGMANRHEE52.1.d:0 "Aujourd'hui, le premier amendement constitutionnel de la République de Corée a été adopté. Après un mois de loi martiale, l'amendement constitutionnel visant à prolonger la durée du mandat présidentiel a été adopté par 163 voix contre 3. Les législateurs précédemment arrêtés ont été libérés la veille du vote afin de participer au vote sur l'amendement constitutionnel. Le vote de l'amendement constitutionnel s'est fait à main levée. La nouvelle constitution prévoit des systèmes d'élection directe pour les élections présidentielles et vice-présidentielles, ainsi que la nomination et la révocation des membres du cabinet à la demande du Premier ministre."
 KOR_SYNGMANRHEE52.2.d:0 "Le deuxième amendement constitutionnel de la République de Corée visant à supprimer les limites de mandat pour son premier président avait déjà été rejeté parce que le vote n'avait pas permis d'obtenir les deux tiers des sièges parlementaires. Cependant, le résultat du vote a été réinterprété comme étant adopté, le gouvernement de Syngman Rhee et le parti au pouvoir ayant conclu que le quorum pour l'amendement constitutionnel était inexact. Les représentants du gouvernement ont souligné que 135 voix et un tiers, ce qui est le minimum requis pour un amendement constitutionnel, équivaut à 135 voix. Les législateurs des partis non gouvernementaux ont quitté le bâtiment de l'Assemblée nationale pour protester contre l'adoption inattendue du nouvel amendement constitutionnel."
 #Syngman Rhee 1956
 KOR_SYNGMANRHEE56.1.d:0 "Chang Myon, vice-président sortant de la République de Corée et figure éminente du parti non gouvernemental, a reçu une balle dans la main gauche alors qu'il assistait à la conférence du parti démocrate. L'assassin a été pris en flagrant délit peu après la tentative. Bien que l'assassin ait affirmé avoir reçu l'ordre d'un autre membre du Parti démocrate d'assassiner Chang Myon, nombreux sont ceux qui pensent que le parti au pouvoir et le président de l'Assemblée nationale, Lee Ki-poong, sont les véritables coupables de cet incident. En raison du grand âge du président Syngman Rhee, de nombreux membres du Parti libéral craignent depuis longtemps la possibilité d'une succession à la présidence de Chang Myon."
 KOR_SYNGMANRHEE56.2.d:0 "Aujourd'hui, de nombreux hommes politiques éminents opposés à la dictature de Syngman Rhee se sont réunis au parc Jangchungdan pour prononcer leurs discours sur la situation politique actuelle de la République de Corée. Environ 200 000 citoyens de Séoul sont venus écouter leur discours. Cependant, alors que Cho Pyung-ok était sur le point de prononcer un discours, des gangsters armés d'armes contondantes sont apparus sur les lieux et ont interrompu son discours. En raison de leur agression et de leur incendie criminel, les hommes politiques ont été contraints d'annuler l'événement peu de temps après. Cho Pyung-ok et Chang Taek-sang ont fermement dénoncé le gouvernement de Syngman Rhee, soupçonné d'avoir organisé le sabotage du discours."
 KOR_SYNGMANRHEE56.3.d:0 "Cho Bong-am, l'ancien candidat du Parti progressiste, a été reconnu coupable de trahison et d'espionnage et condamné à mort. Après que son premier procès n'ait pas permis d'accumuler suffisamment de preuves pour le condamner il y a plusieurs mois, des dizaines de gangs anticommunistes ont fait irruption dans le tribunal et ont critiqué Cho Bong-am et le juge. Malgré de nombreux arguments et efforts pour le sauver de l'exécution, un procès plus récent a conclu que Cho Bong-am avait tenté de contacter des espions nord-coréens et de détruire la République de Corée. La situation aggravée a conduit à une prise de conscience accrue dans le pays et à un financement supplémentaire des systèmes d'audit."
 KOR_SYNGMANRHEE56.4.d:0 "Des cas de corruption électorale et d'abus de pouvoir à grande échelle sont soupçonnés d'avoir eu lieu lors des élections présidentielles et vice-présidentielles de la République de Corée. Selon plusieurs rapports, des employés de l'État et des gangs politiques associés au Parti libéral ont soudoyé ou menacé les électeurs, et ont même truqué les votes. Selon les résultats officiels, le candidat à la vice-présidence Lee Ki-poong a remporté une victoire écrasante contre son candidat rival, Chang Myon. Cependant, le Parti démocrate a accusé les autorités de fraude électorale et de nombreuses personnes ont manifesté contre les autorités dans les rues de Gwangju et Masan. Finalement, les forces de police et les bandes politiques ont violemment réprimé ces manifestations."
 