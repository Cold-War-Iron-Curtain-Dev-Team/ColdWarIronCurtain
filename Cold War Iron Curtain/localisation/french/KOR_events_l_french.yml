 #Samoan Porposal Events
 Samoan_Proposal.1.d:0 "Le Pentagone a récemment présenté une nouvelle proposition pour faire face à la crise des réfugiés coréens. Jeju est très vulnérable à l'agression communiste, toute tentative de renforcer un gouvernement en exil pourrait entraîner une reprise du conflit avec nous, en notre défaveur. Le Pentagone souhaite faire des Samoa la base principale d'un gouvernement coréen démocratique en exil. Les réfugiés coréens peuvent également y être réinstallés. Les Samoa offrent une base sûre, dans le Pacifique, à partir de laquelle une future campagne de libération peut être menée."
 Samoan_Proposal.2.d:0 "Les États-Unis souhaitent relocaliser notre gouvernement en exil et nos réfugiés aux Samoa. Ils nous promettent une grande autonomie. Les Samoa se trouvent dans le Pacifique et sont à l'abri des forces communistes. Nos experts militaires et politiques notent que nous pouvons reconstruire nos forces et bâtir notre légitimité sans craindre l'ingérence communiste. La réalité de notre situation signifie que même si nous n'aimons pas la proposition, il est intelligent d'accepter cette proposition..."
 Samoan_Proposal.4.d:0 "La situation sur l'île de Jeju est plus terrible que prévu. Le gouvernement coréen n'a pas réussi à contrôler les habitants de Jeju et il semble qu'il ne puisse plus tenir le coup. Si nous étions intervenus un peu, nous aurions pu leur fournir du soutien et des fournitures et peut-être donner l'île au Japon ou nous aurions pu l'occuper nous-mêmes. Cependant, il est déjà tard. Désormais, le contrôle de l'île est effectivement pris par la Corée du Nord. Nous ne pouvons rien choisir. Nous devons juste décider. Et nous sommes pressés."
 Samoan_Proposal.9.d:0 "La marine américaine a confirmé que des milliers de réfugiés coréens fuyant l'occupation communiste étaient actuellement transportés vers les Samoa. Il s'agit de la première vague alors que le gouvernement américain envisage de déplacer le plus de réfugiés possible. Les principaux dirigeants civils et militaires survivants de la République de Corée se trouvent déjà à Samoa. Ils mettent en place un gouvernement d'exil et une structure administrative pour superviser l'arrivée des réfugiés. Les Coréens et les autres alliés américains craignent que le nouveau gouvernement des Samoa ne soit trop éloigné ou isolé pour apporter des changements en Corée. Cependant, les États-Unis insistent sur le fait qu'une base aux Samoa offre le meilleur accès tout en préservant la sécurité des forces démocratiques coréennes."
 Samoan_Proposal.10.d:0 "La République de Corée a ouvert la première session d'une nouvelle Assemblée nationale à Samoa. Inaugurant le début de son nouveau gouvernement en exil suite à la prise de pouvoir communiste de la République de Corée. Au cours de la session, les principaux dirigeants militaires et civils ont promis d'aider à installer les réfugiés aux Samoa et de commencer à préparer une campagne de libération nationale. De nombreux remerciements ont été adressés aux États-Unis pour avoir facilité la création d'une capitale aux Samoa. Même si les alliés américains n'ont pas tardé à féliciter le gouvernement coréen, la nouvelle est largement ridiculisée dans les États socialistes. Le gouvernement communiste coréen a condamné le régime des Samoa, le qualifiant de marionnettes américaines sans aucune compréhension de la réalité."
 #Bad End Events
 KOR_Bad_End.1.d:0 "USA... Ils font pression dessus. Nous n'avons pas le choix."
 KOR_Bad_End.2.d:0 "Lee Ki Poong est mort. Qui aurait pu le deviner ? Depuis 1957, Lee souffre déjà de névralgie angulaire et d'angine de poitrine."
 KOR_Bad_End.3.d:0 "Shin Sung-mo est mort. La cause du décès était une hémorragie cérébrale."
 KOR_Bad_End.4.d:0 "Syngman Rhee est mort. La cause du décès était une hémorragie gastro-intestinale aiguë."
 KOR_Bad_End.5.d:0 "Chang Myon est mort. La cause du décès était une hépatite."
 KOR_Bad_End.6.d:0 "Dieu d'amour, reste là. N'essayez pas de nous sauver."
 KOR_Bad_End.7.d:0 "Lee Beom-seok est mort. La cause du décès était un infarctus du myocarde."
 KOR_Bad_End.8.d:0 "Hong Jin-ki est mort. La cause du décès était un accident vasculaire cérébral."
 KOR_Bad_End.9.d:0 "Dieu d'amour, reste là. N'essayez pas de nous sauver."
 KOR_Bad_End.10.d:0 "Dieu d'amour, reste là. N'essayez pas de nous sauver."
 
