l_french: 

 GDR_First_Secretary_Dahlem: "Premier secrétaire Dahlem"
 GDR_First_Secretary_Dahlem_desc: "Franz Dahlem a réussi à arracher la direction du SED à Walter Ulbricht, il est temps de le reconnaître officiellement comme notre nouveau secrétaire général."
 GDR_Announce_an_End_to_the_Work_Quota_Increase: "Mettre fin aux augmentations des quotas de travail"
 GDR_Announce_an_End_to_the_Work_Quota_Increase_desc: "L'augmentation constante des quotas de travailleurs est préjudiciable à notre économie et au bien-être de nos travailleurs, elle doit cesser."
 GDR_Establishing_a_National_Founding_Myth: "Établir un mythe fondateur national"
 GDR_Establishing_a_National_Founding_Myth_desc: "La libération de l'Allemagne par les Soviétiques de la tyrannie nazie a marqué la naissance de la véritable liberté en Allemagne. Cela devrait être inscrit dans notre histoire pour que toutes les générations futures s'en souviennent !"
 GDR_Promote_German_Socialist_Heroes: "Promouvoir les héros socialistes allemands"
 GDR_Promote_German_Socialist_Heroes_desc: "Dans les derniers jours du Reich, de courageux camarades ont risqué leur vie pour contribuer à la destruction de la dictature fasciste de Hitler. Puissent-ils vivre à jamais dans notre mémoire !"
 GDR_Promote_Spanish_Civil_War_Veterans_within_the_SED: "Promouvoir les vétérans de la guerre civile espagnole au sein du SED"
 GDR_Promote_Spanish_Civil_War_Veterans_within_the_SED_desc: "Ceux qui ont répondu à l'appel de la révolution en Espagne devraient être récompensés pour leur courage et promus au sein de notre gouvernement."
 GDR_Empower_the_Committee_of_Anti_Fascist_Resistance_Fighters: "Renforcer le Comité des résistants antifascistes"
 GDR_Empower_the_Committee_of_Anti_Fascist_Resistance_Fighters_desc: "L'Association des persécutés du régime nazi sera dissoute et réorganisée en Comité des résistants antifascistes. Cela nous aidera à garantir qu'aucun de ses membres n'est en fait des agents de l'homologue ouest-allemand de l'Association."
 GDR_Expand_Military_Training_Programs: "Élargir les programmes de formation militaire"
 GDR_Expand_Military_Training_Programs_desc: "Ce n'est un secret pour personne que l'Occident cherche à nous détruire, par la force si nécessaire. Au cas où le pire se produirait, nos militaires doivent être prêts."
 GDR_The_Cult_of_the_Spanish_Civil_War: "Faire sensation sur la guerre civile espagnole"
 GDR_The_Cult_of_the_Spanish_Civil_War_desc: "Même si le fascisme règne en Espagne, il ne faut jamais oublier les héros et les vétérans de la guerre civile espagnole qui se sont battus pour la République plutôt que contre elle. Nous ne pouvons pas oublier jusqu'où les fascistes iront pour réprimer les travailleurs !"
 GDR_Launch_the_Ulbricht_Show_Trials: "Lancez les essais du spectacle d'Ulbricht"
 GDR_Launch_the_Ulbricht_Show_Trials_desc: "Pour légitimer la succession de Dahlem au poste de secrétaire général, des procès-spectacles seront organisés détaillant les crimes contre-révolutionnaires du gouvernement d'Ulbricht."
 GDR_Relax_Stasi_Repression: "Détendre la répression de la Stasi"
 GDR_Relax_Stasi_Repression_desc: "La Stasi est devenue pléthorique et trop zélée, il vaudrait mieux que nous atténuions son influence sur le peuple et le gouvernement."
 GDR_Revitalizing_the_West_Commission: "Revitaliser la Commission Ouest"
 GDR_Revitalizing_the_West_Commission_desc: "La Commission Ouest fait du bon travail en diffusant le socialisme auprès de nos homologues capitalistes. Il devrait être élargi et modernisé pour mieux répondre à cet objectif."
 GDR_Expand_KPD_Funding: "Élargir le financement du KPD"
 GDR_Expand_KPD_Funding_desc: "Si le Parti communiste veut revitaliser l'Allemagne et ouvrir la voie à la réunification, nous aurons besoin de cette ressource de base ; argent."
 GDR_Reject_Fascist_Collaboration: "Rejeter la collaboration fasciste"
 GDR_Reject_Fascist_Collaboration_desc: "Les gouvernements occidentaux sont plus qu'heureux d'ignorer les crimes du régime fasciste en échange de leurs secrets technologiques. C'est une pratique odieuse que nous refusons de suivre !"
 GDR_Outreach_to_the_Deutsche_Reichspartei: "Sensibilisation au Deutsche Reichspartei"
 GDR_Outreach_to_the_Deutsche_Reichspartei_desc: "La situation en Allemagne de l'Ouest n'est pas aussi stable qu'on voudrait nous le faire croire. Si nous aidions discrètement les éléments extrémistes du gouvernement ouest-allemand, cela pourrait conduire à une grave déstabilisation de leur régime."
 GDR_Start_an_Arms_Race_Against_Bonn: "Lancer une course aux armements contre Bonn"
 GDR_Start_an_Arms_Race_Against_Bonn_desc: "Si l'occasion se présente, l'Occident n'hésitera pas à recourir à la force contre nous. Nous devons revitaliser notre industrie militaire pour nous défendre contre le gouvernement réactionnaire !"
 GDR_Reinstate_Purged_Volkspolizei: "Réintégrer la Volkspolizei purgée"
 GDR_Reinstate_Purged_Volkspolizei_desc: "Les membres de la police populaire qui ont été injustement purgés seront réhabilités et réintégrés pour aider à maintenir l'ordre dans notre État florissant."
 GDR_Rely_on_Soviet_Imports_and_Transfers: "Compter sur les importations et les transferts soviétiques"
 GDR_Rely_on_Soviet_Imports_and_Transfers_desc: "La guerre d'Hitler a laissé l'Allemagne dans un état de ruine. Tant que nos industries ne renaîtront pas de leurs cendres, nous devrons compter sur le soutien de nos camarades soviétiques."
 GDR_Begin_Rebuilding_the_German_Arms_Industry: "Commencer à reconstruire l'industrie de l'armement allemande"
 GDR_Begin_Rebuilding_the_German_Arms_Industry_desc: "L'industrie allemande est tristement célèbre pour sa production de machines de guerre hautement destructrices. Mais cette fois, ces armes seront utilisées pour servir le peuple plutôt que pour l'opprimer !"
 GDR_The_New_International_Brigades: "Les nouvelles Brigades internationales"
 GDR_The_New_International_Brigades_desc: "Partout sur Terre, de courageux camarades se sont levés pour se débarrasser des chaînes de l'oppression capitaliste et impérialiste. Nous devons faire notre part pour assurer leur succès !"
 GDR_Request_Further_Soviet_Military_Aid: "Demander une aide militaire soviétique supplémentaire"
 GDR_Request_Further_Soviet_Military_Aid_desc: "Même si cela rendra certainement nerveux beaucoup de gens à Moscou, nous devons néanmoins essayer d'obtenir une certaine aide militaire des Soviétiques si nous voulons repousser les impérialistes occidentaux."
 GDR_Reevaluating_Church_Policy: "Réévaluer la politique de l'Église"
 GDR_Reevaluating_Church_Policy_desc: "Notre position actuelle sur la religion cause plus de mal que de bien, et les gens ne sont pas contents. Peut-être serait-il prudent de réévaluer nos politiques ?"
 GDR_Provide_Incentives_for_Recruits: "Offrir des incitations aux recrues"
 GDR_Provide_Incentives_for_Recruits_desc: "Nous comprenons, surtout après les événements de la décennie précédente, pourquoi l'Armée de terre n'est pas un choix de carrière attrayant. Cependant, si nous offrions des incitations généreuses, nous pourrions assister à une augmentation du recrutement."
