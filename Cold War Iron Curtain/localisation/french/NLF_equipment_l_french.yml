 ##Infantry Equipment
 NLF_infantry_equipment_0:0 "Mosin wz. 91/30"
 NLF_infantry_equipment_0_short:0 "Mosine"
 NLF_infantry_equipment_0_desc:0 "Le Mosin-Nagant est un fusil à verrou impérial russe utilisé par l'Empire russe et basé sur un modèle importé de France. En 1889, le GAU (Ministère de la Défense de l'Empire russe) acquiert le Lebel-1886 auprès de la France et cherche à améliorer sa conception. Divers scientifiques et ingénieurs russes ont été embauchés par le ministère et dirigés par le capitaine Sergei Mosin et Leon Nagant pour l'améliorer et ont produit le Mosin Nagant après une longue série d'essais et de prototypes. En 1891, le système à verrou de conception de Mosin fut mis en production. Le fusil a un temps de démontage long mais se distingue par sa grande précision. Il a été largement utilisé lors de la guerre russo-japonaise, de la Première Guerre mondiale, de la guerre civile au sein de l'Empire russe qui a conduit à la formation de l'Union soviétique, de la Seconde Guerre mondiale et de nombreux conflits mondiaux."

 NLF_infantry_equipment_1:0 "Avtomat Kalachnikova 1947"
 NLF_infantry_equipment_1_short:0 "AK-47"
 NLF_infantry_equipment_1_desc:0 "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 NLF_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 NLF_infantry_equipment_2_short:0 "AKM"
 NLF_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

 NLF_infantry_equipment_3:0 "Avtomat Kalachnikova 1974"
 NLF_infantry_equipment_3_short:0 "AK-74"
 NLF_infantry_equipment_3_desc:0 "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un alésage chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été repensés pour contenir un canal bas installé à 90 degrés de l'axe de l'alésage afin de réduire le cisaillement des balles au niveau de la cale bâbord. De plus, son développement s'est accompagné d'une variété d'accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec des précisions moyennes plus élevées. Il a été utilisé de manière coûteuse pendant le conflit en Afghanistan, où la CIA a payé une grosse somme d'argent aux moudjahidines pour récupérer un AK74 capturé."

 NLF_infantry_equipment_4:0 "Z111 Usine STL-1A"
 NLF_infantry_equipment_4_short:0 "STL-1A"
 NLF_infantry_equipment_4_desc:0 "En 2015, l'usine Z111 a annoncé qu'elle produirait le nouveau fusil STL-1A. Cela se ferait principalement par la conversion et la mise à niveau des anciens AKM sous le nouveau nom, mais ils produiraient également des fusils STL-1A entièrement nouveaux. Le fusil mis à jour comprenait de nouveaux protège-mains en polymère, une crosse pliable, une nouvelle poignée pistolet ergonomique et un frein de bouche mis à jour similaire à ceux trouvés sur l'AK-74. Un changement notable est qu'il autorise également l'utilisation de lance-grenades M203 également produits au Vietnam, remplaçant les lance-grenades GP-25/GP-34 sur les AKM d'origine. Cependant, le fusil utilise toujours le support latéral en queue d'aronde pour fixer les viseurs. Dans l'ensemble, le fusil ressemble beaucoup à un AK-103."

 ##Vietnamese Peoples Army Armored Vehicles
 NLF_lt_equipment_1:0 "T-60"
 NLF_lt_equipment_1_short:0 "T-60"
 NLF_lt_equipment_1_desc:0 "Le T60 était un char léger fabriqué pour remplacer le T-38 dans son rôle de reconnaissance. Il a été conçu en 1941 par Nicholas Astrov et 6 300 exemplaires ont été produits au cours des 2 années de production. Le véhicule était un char à 2 équipages avec un moteur 6 cylindres et atteint jusqu'à 44 km/h avec un canon principal de 20 mm. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 NLF_lt_equipment_2:0 "T-70"
 NLF_lt_equipment_2_short:0 "T-70"
 NLF_lt_equipment_2_desc:0 "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et l'a terminé en 1942. Au cours des deux années de fabrication, 8 300 exemplaires ont été produits. Le char avait un canon beaucoup plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 NLF_lt_equipment_3:0 "PT-76"
 NLF_lt_equipment_3_short:0 "PT-76"
 NLF_lt_equipment_3_desc:0 "Le PT76 est un char léger amphibie soviétique et a été largement exporté dans le monde entier. Il a été conçu par N Shashmyrin et Zh Kotin en 1951 et environ 12 000 unités ont été fabriquées. Il nécessite un équipage de 3 hommes et un moteur V6 six cylindres en ligne avec une vitesse de 44 km/h et peut nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique et à tendance soviétique et, en tant que tel, a joué un rôle de reconnaissance dans pratiquement tous les conflits des nations de la sphère soviétique. Cependant, il est encore utilisé aujourd'hui dans de nombreux pays en raison de sa célèbre fiabilité et de sa facilité d'entretien."
 NLF_lt_equipment_4:0 "Char léger K-62 (Type 62 PRC)"
 NLF_lt_equipment_4_short:0 "K-62"
 #NLF_lt_equipment_4_desc:0 ""
 NLF_lt_equipment_5:0 "K-63 (Type 63 RPC)"
 NLF_lt_equipment_5_short:0 "K-63"
 #NLF_lt_equipment_5_desc:0 ""
 #NLF_lt_equipment_6:0 "2S25 Sprut-SD(LT)"
 #NLF_lt_equipment_6_short:0 "2S25 Sprut-SD(LT)"
 #NLF_lt_equipment_6_desc:0 "The 2525 SPRUT-SD is a Russian amphibious light tank designed created by the Volgograd Tractor Plant. The 125mm smoothbore main gun is built to engage enemy tanks and fire AP rounds. It has a 510 horsepower diesel engine and can operate at speeds up to 70 km/h and swims at 10 km/h. It also features Hydropneumatic suspension with variable height controls allowing it to adapt to many different environments and not lose too much speed. In extremely rough terrain, it can move at speeds up to 45 km/h, giving it versatility in different rough environments. It is deployed by the Russians but as not seen any known combat."

