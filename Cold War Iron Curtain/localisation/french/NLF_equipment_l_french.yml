 NLF_manpats_1:0 "Bom Ba Cang"
 NLF_manpats_1_short:0 "Bom Ba Cang"
 NLF_manpats_1_desc:0 "Bom Ba Cang, traduit par bombe à trois points, est une arme antichar vietnamienne fabriquée à partir de restes de bombes japonaises."
 NLF_manpats_2:0 "RPG B40 (RPG-2)"
 NLF_manpats_2_short:0 "JEU DE RÔLE B40"
 NLF_manpats_2_desc:0 "B40, une variante du RPG-2 produite localement par les forces du PAVN. B-40 toujours en service avec le PAVN aujourd'hui"
 NLF_manpats_3:0 "RPG B-41 (RPG-7)"
 NLF_manpats_3_short:0 "B-41 RPG"
 NLF_manpats_3_desc:0 "Le B-41 est la variante produite localement du RPG-7. B-41 toujours en service avec le PAVN aujourd'hui"
 NLF_manpats_4:0 "RPG-29"
 NLF_manpats_4_short:0 "RPG-29"
 NLF_manpats_4_desc:0 "Le RPG-29 est un RPG antichar rechargeable développé par Bazalt à la fin des années 1980. Il a été développé pour fournir une variante moderne et améliorée du RPG-7 et est rechargeable contrairement au RPG-18. Il tire des roquettes à une portée effective d'environ 600 mètres et n'est pas limité par une ogive chronométrée. Il est bien plus capable de pénétrer l'armure que le RPG-7, même s'il n'a pas complètement dissuadé le RPG-7 ou le RPG-18 en raison de son coût plus élevé. Le RPG-29 n'a pas non plus de charge propulsive initiale pour protéger les opérateurs lorsque la fusée s'enflamme afin de réduire le poids et de donner une valeur de poids plus précieuse qui peut être utilisée pour plus de carburant de fusée. Cela signifie qu'il n'est pas aussi simple à utiliser et nécessite un niveau de protection pour son utilisateur mais le rend plus efficace. Le RPG-29 a été utilisé dans la guerre en Irak, dans la guerre civile syrienne et dans la guerre du Liban en 2006."
 NLF_manpats_5:0 "RPG-32"
 NLF_manpats_5_short:0 "RPG-32"
 NLF_manpats_5_desc:0 "Le RPG-32 est une arme d'infanterie antichar russe moderne développée par Bazalt en 2005. L'arme a une portée effective d'environ 350 m avec une portée maximale de 700 m. Le lanceur est livré avec 2 ogives différentes de 72 ou 105 mm, thermobariques ou HEAT. Il a une capacité de perforation de blindage bien plus grande que n'importe lequel de ses prédécesseurs. Il n'a pas encore été déployé ni accepté par l'armée russe en raison de son coût élevé, bien que plusieurs pays du Moyen-Orient l'importent de Russie, principalement pour l'utiliser dans les bataillons haut de gamme de leur armée. Il est actuellement utilisé dans la guerre civile irakienne et la guerre civile yéménite."

 NLF_hmg_1: "DShKM"
 NLF_hmg_1_short: "DShKM"
 NLF_hmg_1_desc: "La mitrailleuse lourde DShK est une HMG à clapet fonctionnant au gaz développée en 1938 par Vasily Degtyaryov. L'arme elle-même a été utilisée à la fois comme HMG et parfois comme petite arme anti-aérienne par l'infanterie pendant la Seconde Guerre mondiale. Plus d'un million d'exemplaires ont été fabriqués aujourd'hui et, en raison de leur faible coût et de leur facilité de fabrication, ils continuent d'être fabriqués par de nombreux pays sous-développés à travers le monde avec un succès notable."
 NLF_manpads_1: "Strela-2"
 NLF_manpads_1_short: "Strela-2"
 NLF_manpads_1_desc: "Le Strela-2 est un lanceur de missiles antiaériens portable d'infanterie MANPAD qui était une arme de base de la sphère soviétique. Conçue par KBM en 1964, l'arme comportait un fusible à détonation à impact sans retard, une ogive explosive HE et un système de guidage de missile à logique de navigation proportionnelle. Il s'est avéré relativement peu coûteux à fabriquer en série. Cependant, le haut commandement soviétique a rapidement remarqué que le Strela-2 fonctionnait mal et bien en deçà de ce à quoi il s'attendait. Il a été témoin de conflits lors de la guerre soviéto-afghane, de nombreuses révolutions communistes différentes, ainsi que d'une utilisation intensive dans les conflits du Moyen-Orient. "
 NLF_manpads_2: "Strela-3"
 NLF_manpads_2_short: "Strela-3"
 NLF_manpads_2_desc: "L'Union soviétique a rapidement commencé à développer le Strela-3 après avoir constaté que le Strela-2 avait été inefficace au combat. KBM a terminé le développement du Strela-3 en 1974 et il s'est avéré bien plus performant. Au lieu d'une logique de navigation proportionnelle, le Strela-3 a utilisé le guidage infrarouge pour atteindre des cibles bien au-delà de la portée effective du Strela-2. De plus, il était livré avec un refroidisseur d'élément détecteur dans le missile lui-même, ce qui lui permet d'être moins facilement trompé par les fusées éclairantes et de rechercher plus précisément les véritables cibles. Malgré cela, les ajouts ont rendu le missile plus lourd et nécessitent un carburant de propulsion plus cher, rendant chaque tir plus cher. Le Strela-3 a été utilisé dans de nombreux conflits au Moyen-Orient, tels que la guerre Irak-Iran, mais n'a pas connu beaucoup de combats au sein même de la sphère soviétique."
 NLF_manpads_3: "Igla"
 NLF_manpads_3_short: "Igla"
 NLF_manpads_3_desc: "L'Igla est un système MANPAD amélioré développé par KBM en 1981. L'Igla utilise un système de guidage infrarouge à double bande d'ondes et dispose d'un système de détonation de fusible magnétique à impact retardé. Le missile était également équipé d'un aérospike pour réduire la traînée et améliorer les performances. L'arme a été témoin de nombreux conflits généraux au Moyen-Orient mais aussi des guerres de Yougoslavie."
 NLF_manpads_4: "Verbe"
 NLF_manpads_4_short: "Verbe"
 NLF_manpads_4_desc: "Le Verba est un système MANPAD russe moderne créé en 2011. Il utilise un système de guidage optique à 3 canaux avec un plafond de vol exceptionnel de 5 km et une très longue portée. L'arme est également livrée avec une ogive moderne et plus puissante. L'arme elle-même est très difficile à tromper avec les systèmes de contre-mesures en raison des 3 canaux qu'elle possède dans chaque missile nécessitant l'utilisation de contre-mesures de haute qualité. Le Verba est utilisé par les Arméniens, les Russes et les Syriens mais n'a jusqu'à présent été combattu qu'en Syrie."

 NLF_specialist_1: "Lunette Mosin Nagant PU"
 NLF_specialist_1_short: "Mosin Nagant PU"
 NLF_specialist_1_desc: ""
 NLF_specialist_2: "Fusil de précision Dragunov (SR)"
 NLF_specialist_2_short: "Dragounov"
 NLF_specialist_2_desc: "Le fusil de précision Dragunov est un DMR semi-automatique qui chambre la cartouche Mosin 7,62x54R. Le Dragunov a été développé en 1963 par Yevgeny Dragunov. L'arme elle-même est connue pour sa grande précision et sa fiabilité exceptionnelle et a été utilisée encore aujourd'hui par les armées du monde entier. Des munitions peu coûteuses, un entretien facile et une grande fiabilité ont permis à cette arme de rester en service même dans certaines des armées les plus pauvres du monde, tout en parvenant à s'imposer dans les combats modernes. Il a été témoin d'un nombre inquantifiable de combats dans plus de 40 guerres à travers le monde."
 NLF_specialist_3: "CONTRE (SR)"
 NLF_specialist_3_short: "VSS"
 NLF_specialist_3_desc: "Le fusil de précision VSS est un fusil de précision spécialisé développé en 1980 par Serdjukov et Krasnikov. Le fusil de précision VSS est doté d'un canon supprimé intégré et utilise des munitions subsoniques ou AP. Le fusil lui-même est principalement utilisé par les unités des forces spéciales telles que Spetsnaz pour sa capacité clandestine et son système intégré de suppression du son et des flashs. Il a été témoin de combats lors de la guerre en Afghanistan, mais très rarement en dehors de celle-ci."
