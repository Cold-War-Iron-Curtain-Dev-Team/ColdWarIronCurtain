 NLF_mr_stealth_fighter_equipment_1:0 "Soukhoï Su-30MK2V"
 NLF_mr_stealth_fighter_equipment_1_short:0 "Su-30MK2V "
 NLF_mr_stealth_fighter_equipment_1_desc:0 "Le Sukhoi Su-30 est une conception fortement améliorée du Su-27. Les mises à niveau comprennent une suite de capteurs mise à jour, permettant une capacité multirôle et une cellule entièrement repensée. Le cockpit a également été modernisé avec 2 écrans multifonctions (MFD) et un nouveau HUD."

