#Ukraine naval aviation
 UKR_cv_CAS_equipment_1:0 "Polikarpov R-5T"
 UKR_cv_CAS_equipment_1_short:0 "R-5T"
 UKR_cv_CAS_equipment_1_desc:0 "Bombardier torpilleur monoplace avec train d'atterrissage divisé pour permettre de transporter une torpille ou une bombe de 250 à 500 kg sous le fuselage. Volé en 1934, une série de 50 exemplaires construits en 1935. Équipage de deux hommes pour les tâches de reconnaissance."
 UKR_cv_CAS_equipment_2:0 "Iliouchine Il-2T Sturmovik"
 UKR_cv_CAS_equipment_2_short:0 "Il-2T Sturmovik"
 UKR_cv_CAS_equipment_2_desc:0 "L'Il-2T est une variante bombardier-torpilleur du célèbre avion d'attaque au sol Il-2 Sturmovik. Afin de gagner du poids pour lui permettre de voler, les deux canons VYa-23 de 23 mm sur les ailes ont été retirés. En tant que tel, il pourrait être équipé d'une seule torpille de 45 cm (18 pouces). Bien que la conception n'ait jamais été mise sur le terrain, les Sturmoviks équipés de torpilles n'étaient pas une idée inconnue, car les Il-2M3 ont été modifiés pour transporter des porte-torpilles pendant les campagnes de Crimée et du Caucase de la Seconde Guerre mondiale."
 UKR_cv_CAS_equipment_3:0 "Iliouchine Il-10T"
 UKR_cv_CAS_equipment_3_short:0 "Il-10T"
 UKR_cv_CAS_equipment_3_desc:0 "Cette variante bombardier-torpilleur de l'Il-10 a été développée après la fin des hostilités en Europe et en Mandchourie, contrairement à l'Il-10 à partir duquel elle est issue. En dehors d'un bref soutien à la Corée du Nord pendant la guerre de Corée, l'Il-10T a eu une existence relativement paisible, étant retiré en 1953 au profit de chasseurs-bombardiers à réaction basés à terre comme le Su-7 Fitter."

 UKR_cv_jet_CAS_equipment_1:0 "Iliouchine Il-10MT"
 UKR_cv_jet_CAS_equipment_1_short:0 "Il-10MT"
 UKR_cv_jet_CAS_equipment_1_desc:0 "Variante améliorée de la variante du bombardier-torpilleur Ilyushin IL-10T. L'Il-10 a été développé après la fin des hostilités en Europe et en Mandchourie, contrairement à l'Il-10 à partir duquel il est issu. En dehors d'un bref soutien à la Corée du Nord pendant la guerre de Corée, l'Il-10T a eu une existence relativement paisible, étant retiré en 1953 au profit de chasseurs-bombardiers à réaction basés à terre comme le Su-7 Fitter."
 UKR_cv_jet_CAS_equipment_2:0 "Iliouchine Il-20"
 UKR_cv_jet_CAS_equipment_2_short:0 "Il-20"
 UKR_cv_jet_CAS_equipment_2_desc:0 "L'Ilyushin Il-20 était un prototype soviétique d'avion d'attaque au sol lourdement blindé destiné à remplacer l'Ilyushin Il-10. Il présentait un certain nombre de concepts innovants, notamment un cockpit monté sur le moteur, directement derrière l'hélice, et un canon automatique monté sur l'aile qui pouvait être réglé au sol au niveau de tir ou abaissé de 23° pour permettre à l'avion de mitrailler des cibles au sol tout en restant en vol en palier. Cependant, il était plus lent que l'Il-10 et son moteur M-47 posait problème lors des essais en vol en 1948-1949. Il n'a pas été mis en production. Les pilotes d'essai ont appelé l'avion le Gorbach (Bossu)."
 UKR_cv_jet_CAS_equipment_3:0 "Iliouchine Il-40T"
 UKR_cv_jet_CAS_equipment_3_short:0 "Il-40T"
 UKR_cv_jet_CAS_equipment_3_desc:0 "L'Ilyushin Il-40 (nom de l'OTAN Brawny) était un avion blindé d'attaque au sol soviétique biplace à moteur à réaction. Le premier prototype a volé en 1953 et a connu un grand succès, sauf lorsqu'il a tiré avec ses canons, car les gaz de combustion perturbaient le flux d'air dans les moteurs et provoquaient leur extinction ou leur hoquet."
 UKR_cv_jet_CAS_equipment_4:0 "Tupolev Tu-91"
 UKR_cv_jet_CAS_equipment_4_short:0 "Tu-91"
 UKR_cv_jet_CAS_equipment_4_desc:0 "Le Tupolev Tu-91 (nom de l'OTAN Boot) était un avion d'attaque embarqué soviétique. Les consoles sont équipées de deux canons fixes de 23 mm avec 200 cartouches par canon, d'une installation de canon arrière télécommandée DK-15 avec un canon AM-23 ; armement de bombes - 1 x FAB-1500 ou 3 x FAB-500 ou 6 x FAB-250 ou 12 x FAB-100 ; bombes anti-sous-marines d'un calibre de 500 kg ou 100 kg."
 UKR_cv_jet_CAS_equipment_5:0 "Tupolev Tu-91M"
 UKR_cv_jet_CAS_equipment_5_short:0 "Tu-91M"
 UKR_cv_jet_CAS_equipment_5_desc:0 "Variante améliorée du Tupolev Tu-91. Un avion d'attaque embarqué soviétique. Les consoles sont équipées de deux canons fixes de 23 mm avec 200 cartouches par canon, d'une installation de canon arrière télécommandée DK-15 avec un canon AM-23 ; armement de bombes - 1 x FAB-1500 ou 3 x FAB-500 ou 6 x FAB-250 ou 12 x FAB-100 ; bombes anti-sous-marines d'un calibre de 500 kg ou 100 kg."
 UKR_cv_jet_CAS_equipment_6:0 "Soukhoï Su-7K"
 UKR_cv_jet_CAS_equipment_6_short:0 "Su-7K"
 UKR_cv_jet_CAS_equipment_6_desc:0 "Variante embarquée du vénérable chasseur-bombardier Sukhoi Su-7 destinée à être utilisée dans l'aviation navale soviétique."
 UKR_cv_jet_CAS_equipment_7:0 "Sukhoï Su-17MKG"
 UKR_cv_jet_CAS_equipment_7_short:0 "Su-17MKG"
 UKR_cv_jet_CAS_equipment_7_desc:0 "Variante du Sukhoi Su-17M pour l'aviation navale soviétique. Il a servi de banc d'essai pour les missiles Kh-25 (AS-10 « Karen ») et Kh-29 (AS-14 « Kedge »)."
 UKR_cv_jet_CAS_equipment_8:0 "Mikoyan-Gourevitch MiG-23AB"
 UKR_cv_jet_CAS_equipment_8_short:0 "MiG-23AB"
 UKR_cv_jet_CAS_equipment_8_desc:0 "Variante multirôle basée sur le MiG-23K, il était prévu pour trois sous-variantes, le MiG-23AI (chasseur), le MiG-23AB (attaque au sol) et le MiG-23AR (reconnaissance). La variante a été annulée pour la même raison que le MiG-23K."
 UKR_cv_jet_CAS_equipment_9:0 "Mikoyan-Gourevitch MiG-27K"
 UKR_cv_jet_CAS_equipment_9_short:0 "MiG-27K"
 UKR_cv_jet_CAS_equipment_9_desc:0 "Le MiG-27K était la variante soviétique la plus avancée, avec un désignateur laser et une compatibilité avec les armes électro-optiques guidées par télévision. Il transportait le canon GSh-6-30. Officiellement, il ne portait pas de variante basée sur un porte-avions, mais avec son aile en flèche, il aurait pu être adapté pour un tel rôle."
 UKR_cv_jet_CAS_equipment_10:0 "Sukhoï Su-25UTG"
 UKR_cv_jet_CAS_equipment_10_short:0 "Su-25UTG"
 UKR_cv_jet_CAS_equipment_10_desc:0 "Le Su-25UTG (Uchebno-Trenirovochnyy s Gakom) est une variante du Su-25UB conçue pour former les pilotes au décollage et à l'atterrissage sur un pont porteur simulé terrestre, avec une section de tremplin à ski en pente et des câbles d'arrêt. Le premier a volé en septembre 1988 et environ 10 exemplaires ont été produits. Environ la moitié est restée au service russe après 1991 ; ils ont été utilisés sur le seul porte-avions russe, l'amiral Kuznetsov. Ce petit nombre d'avions était insuffisant pour répondre aux besoins de formation du groupe aérien russe, c'est pourquoi un certain nombre de Su-25UB ont été convertis en Su-25UTG."

 UKR_cv_fighter_equipment_1:0 "Morska Aviatsia"
 UKR_cv_fighter_equipment_1_short:0 "MA"
 UKR_cv_fighter_equipment_1_desc:0 "L'aviation navale ukrainienne est une composante de la marine ukrainienne. Lors de l'éclatement de l'Union soviétique, une partie importante de l'aviation navale soviétique était basée en Ukraine, destinée à soutenir la flotte de la mer Noire. Ces forces comprenaient la 2e division d'aviation de missiles maritimes de la Garde (Gvardeyskoye, oblast de Crimée), avec trois régiments d'attaque maritime Tu-22M2 (5e, 124e à Gvardeskoye, oblast de Crimée et le 943e à Oktyabrskoye), et le 30e régiment d'aviation de reconnaissance maritime indépendant (Saki-Novofedorovka, oblast de Crimée) de Tu-22Ps."
 UKR_cv_fighter_equipment_2:0 "Yakovlev Yak-7UTI"
 UKR_cv_fighter_equipment_2_short:0 "Yak-7UTI"
 UKR_cv_fighter_equipment_2_desc:0 "Le Yak-7UTI a été initialement développé comme un avion d'entraînement biplace destiné à former les futurs pilotes soviétiques. Mais ce type pourrait être bien adapté aux opérations des transporteurs, en utilisant le système de double commande pour garantir que si un pilote était fatigué, l'autre pourrait tout aussi bien fonctionner. Ce type pourrait servir de transporteur aérien de défense contre les avions allemands nazis et plus tard américains."
 UKR_cv_fighter_equipment_3:0 "Yakovlev Yak-9UT"
 UKR_cv_fighter_equipment_3_short:0 "Yak-9UT"
 UKR_cv_fighter_equipment_3_desc:0 " Yak-9U (VK-107) armé de 1 canon Nudelman N-37 de 37 mm (1,5 po) avec 30 cartouches et de 2 canons Berezin B-20 de 20 mm (0,79 po) avec 120 cartouches chacun, ce qui donne une masse totale d'éclatement en une seconde de 6 kg (13 lb). De la même manière que le Yak-9TK, il pourrait être converti pour remplacer le N-37 par un B-20 de 20 mm (0,79 po), un NS-23 de 23 mm (0,91 po) ou un N-45 de 45 mm (1,8 po). Les avions de production transportaient le NS-23 au lieu du canon N-37 comme armement par défaut."

 UKR_cv_jet_multirole_equipment_1:0 "Yakovlev Yak-15"
 UKR_cv_jet_multirole_equipment_1_short:0 "Yak-15"
 UKR_cv_jet_multirole_equipment_1_desc:0 "Le Yakovlev Yak-15 était un chasseur à turboréacteur soviétique de première génération développé par le bureau d'études Yakovlev (OKB) immédiatement après la Seconde Guerre mondiale. Le fuselage principal était celui du chasseur à moteur à pistons Yakovlev Yak-3 modifié pour monter un moteur Junkers Jumo 004 allemand de rétro-ingénierie."
 UKR_cv_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15K"
 UKR_cv_jet_multirole_equipment_2_short:0 "MiG-15K"
 UKR_cv_jet_multirole_equipment_2_desc:0 "Version navalisée de l'avion de combat MiG-15 de deuxième génération pour l'aviation navale soviétique."
 UKR_cv_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17K"
 UKR_cv_jet_multirole_equipment_3_short:0 "MiG-17K"
 UKR_cv_jet_multirole_equipment_3_desc:0 "Variante embarquée proposée du MiG-17."
 UKR_cv_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19K"
 UKR_cv_jet_multirole_equipment_4_short:0 "MiG-19K"
 UKR_cv_jet_multirole_equipment_4_desc:0 "Chasseur de pont proposé par la marine de l'URSS. L'armement des roquettes et des bombes comprenait quatre supports de poutre BD-3-56, sur lesquels pouvaient être suspendues deux bombes de 250 kg. Plus près du fuselage, derrière les niches du châssis, des pylônes pour blocs ORO-57K équipés d'ARS-57 NURS de 57 mm ont été montés."
 UKR_cv_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-19SK"
 UKR_cv_jet_multirole_equipment_5_short:0 "MiG-19SK"
 UKR_cv_jet_multirole_equipment_5_desc:0 "Avion de combat MiG-19K amélioré avec une nouvelle avionique et des performances moteur améliorées."
 UKR_cv_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21K"
 UKR_cv_jet_multirole_equipment_6_short:0 "MiG-21K"
 UKR_cv_jet_multirole_equipment_6_desc:0 "Variante embarquée proposée du MiG-21."
 UKR_cv_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23K"
 UKR_cv_jet_multirole_equipment_7_short:0 "MiG-23K"
 UKR_cv_jet_multirole_equipment_7_desc:0 "MiG-23A \"Lightning\" - la version pont du chasseur MiG-23 a été développée à l'A.I. Bureau de conception Mikoyan. Le chasseur embarqué était censé différer du MiG-23M de série par un nouveau vitrage du cockpit avec un siège de pilote surélevé pour une meilleure vue, ainsi qu'une tige non rétractable pour le ravitaillement en vol. Pour assurer l'atterrissage sur le pont, l'avion recevrait un train d'atterrissage renforcé et un crochet de frein dans la partie arrière - ce dernier nécessitait le remplacement d'une grande arête ventrale par deux petites, ainsi qu'une augmentation de la surface de la quille."
 UKR_cv_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23AI"
 UKR_cv_jet_multirole_equipment_8_short:0 "MiG-23AI"
 UKR_cv_jet_multirole_equipment_8_desc:0 "Variante multirôle basée sur le MiG-23K, il était prévu pour trois sous-variantes le MiG-23AI (chasseur), le MiG-23AB (attaque au sol) et le MiG-23AR (reconnaissance). La variante a été annulée pour la même raison que le MiG-23K."
 UKR_cv_jet_multirole_equipment_9:0 "Soukhoï Su-27K"
 UKR_cv_jet_multirole_equipment_9_short:0 "Su-27K"
 UKR_cv_jet_multirole_equipment_9_desc:0 "Le Sukhoi Su-33 est un chasseur de supériorité aérienne bimoteur tout temps basé sur un porte-avions conçu par Sukhoi et fabriqué par la Komsomolsk-on-Amur Aircraft Production Association, dérivé du Su-27 et initialement connu sous le nom de Su-27K. Comparé au Su-27, le Su-33 possède un train d'atterrissage et une structure renforcés, des ailes et des stabilisateurs repliables, le tout destiné aux opérations de transport. Le Su-33 a des canards et ses ailes sont plus grandes que celles du Su-27 pour une portance accrue. Le Su-33 est doté de moteurs améliorés et d'une double roue avant, et peut être ravitaillé en carburant."
 UKR_cv_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29K"
 UKR_cv_jet_multirole_equipment_10_short:0 "MiG-29K"
 UKR_cv_jet_multirole_equipment_10_desc:0 "Le programme MiG-29K a été relancé en réponse à la décision de la marine indienne d'acquérir l'ancien porte-avions de la marine soviétique, l'amiral Gorshkov en 2004. Lorsque l'amiral Gorshkov faisait partie de la flotte soviétique, il s'agissait d'un porte-avions/croiseur hybride utilisant des avions à décollage vertical (V/STOL) ; ainsi le pont a été remis à neuf avec une rampe de décollage et des câbles d'arrêt pour faire fonctionner les MiG-29K. L'avion possède une aile agrandie et repliable, un crochet d'arrêt et un fuselage renforcé protégé contre la corrosion."

 UKR_cv_mr_stealth_fighter_equipment_1:0 "Su-27KM"
 UKR_cv_mr_stealth_fighter_equipment_1_short:0 "Su-27KM"
 UKR_cv_mr_stealth_fighter_equipment_1_desc:0 "En 2010, Sukhoi a développé une version améliorée du Su-27 ; les essais en vol ont commencé en octobre 2010. Ce Su-27 modernisé devait concurrencer une potentielle version chinoise du Su-33 original, le Shenyang J-15, et encourager les commandes de la marine russe. Les améliorations majeures apportées à l'avion comprenaient des moteurs AL-31-F-M1 plus puissants et un chariot d'armes plus grand. Selon l'auteur militaire Richard Fisher, il a été supposé que d'autres modifications apportées à un nouveau lot de production incluraient un radar à réseau phasé, des tuyères à poussée vectorielle et des missiles antinavires à longue portée."

