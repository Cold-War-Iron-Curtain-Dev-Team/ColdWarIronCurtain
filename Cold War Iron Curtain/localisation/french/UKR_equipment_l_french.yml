 ## Infantry Equipment Ukraine

### Soviet Union

 UKR_infantry_equipment_0:0 "Mosin wz. 91/30"
 UKR_infantry_equipment_0_short:0 "Mosine"
 UKR_infantry_equipment_0_desc:0 "Le Mosin-Nagant est un fusil à verrou impérial russe utilisé par l'Empire russe et basé sur un modèle importé de France. En 1889, le GAU (Ministère de la Défense de l'Empire russe) acquiert le Lebel-1886 auprès de la France et cherche à améliorer sa conception. Divers scientifiques et ingénieurs russes ont été embauchés par le ministère et dirigés par le capitaine Sergei Mosin et Leon Nagant pour l'améliorer et ont produit le Mosin Nagant après une longue série d'essais et de prototypes. En 1891, le système à verrou de conception de Mosin fut mis en production. Le fusil a un temps de démontage long mais se distingue par sa grande précision. Il a été largement utilisé lors de la guerre russo-japonaise, de la Première Guerre mondiale, de la guerre civile au sein de l'Empire russe qui a conduit à la formation de l'Union soviétique, de la Seconde Guerre mondiale et de nombreux conflits mondiaux."

 UKR_infantry_equipment_1:0 "Avtomat Kalachnikova 1947"
 UKR_infantry_equipment_1_short:0 "AK-47"
 UKR_infantry_equipment_1_desc:0 "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 UKR_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 UKR_infantry_equipment_2_short:0 "AKM"
 UKR_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

 UKR_infantry_equipment_3:0 "Avtomat Kalachnikova 1974"
 UKR_infantry_equipment_3_short:0 "AK-74"
 UKR_infantry_equipment_3_desc:0 "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un alésage chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été repensés pour contenir un canal bas installé à 90 degrés de l'axe de l'alésage afin de réduire le cisaillement des balles au niveau de la cale bâbord. De plus, son développement s'est accompagné d'une variété d'accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec des précisions moyennes plus élevées. Il a été utilisé de manière coûteuse pendant le conflit en Afghanistan, où la CIA a payé une grosse somme d'argent aux moudjahidines pour récupérer un AK74 capturé."

 UKR_infantry_equipment_4:0 "Avtomat Kalachnikova 1974 modernizirovanniy"
 UKR_infantry_equipment_4_short:0 "AK-74M"
 UKR_infantry_equipment_4_desc:0 "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé pour incorporer de nouveaux matériaux et des avancées de fabrication afin de créer une arme améliorée. Il comporte un boulon et un support allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide chargé de verre pouvant tenir latéralement, une bouche améliorée, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également livré avec un rail pour le montage des optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant de pouvoir être envisagée. Cependant, il a été adopté par la Fédération de Russie."


########## NEW UKR ARMOR

 UKR_lt_equipment_1:0 "T-60"
 UKR_lt_equipment_1_short:0 "T-60"
 UKR_lt_equipment_1_desc:0 "Le T60 était un char léger fabriqué pour remplacer le T-38 dans son rôle de reconnaissance. Il a été conçu en 1941 par Nicholas Astrov et 6 300 exemplaires ont été produits au cours des 2 années de production. Le véhicule était un char à 2 équipages avec un moteur 6 cylindres et atteint jusqu'à 44 km/h avec un canon principal de 20 mm. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 UKR_lt_equipment_2:0 "T-70"
 UKR_lt_equipment_2_short:0 "T-70"
 UKR_lt_equipment_2_desc:0 "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et l'a terminé en 1942. Au cours des deux années de fabrication, 8 300 exemplaires ont été produits. Le char avait un canon beaucoup plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 UKR_lt_equipment_3:0 "PT-76"
 UKR_lt_equipment_3_short:0 "PT-76"
 UKR_lt_equipment_3_desc:0 "Le PT76 est un char léger amphibie soviétique et a été largement exporté dans le monde entier. Il a été conçu par N Shashmyrin et Zh Kotin en 1951 et environ 12 000 unités ont été fabriquées. Il nécessite un équipage de 3 hommes et un moteur V6 six cylindres en ligne avec une vitesse de 44 km/h et peut nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique et à tendance soviétique et, en tant que tel, a joué un rôle de reconnaissance dans pratiquement tous les conflits des nations de la sphère soviétique. Cependant, il est encore utilisé aujourd'hui dans de nombreux pays en raison de sa célèbre fiabilité et de sa facilité d'entretien."
 UKR_lt_equipment_4:0 "PT-76B modèle 4"
 UKR_lt_equipment_4_short:0 "PT-76B"
 UKR_lt_equipment_4_desc:0 "PT-76 armé du canon de char rayé D-56TS de 76,2 mm (frein de bouche à double chicane, éjecteur de cartouche, extracteur de fumée et système de stabilisation à 2 axes STP-2P 'Zarya'), du système de protection NBC PAZ (protivo-atomnaya zashchita), d'un système d'extinction automatique d'incendie, d'un viseur TShK-2-66 amélioré, d'un système de filtration-ventilation, de dispositifs d'observation améliorés, d'un système électrique amélioré. équipement, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1 800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."
 UKR_lt_equipment_5:0 "BRM-1K"
 UKR_lt_equipment_5_short:0 "BRM-1K"
 UKR_lt_equipment_5_desc:0 "Le BRM-1K est un véhicule de reconnaissance d'origine soviétique de la fin de la Guerre froide. Il a été développé pour soutenir les formations blindées et mécanisées employées par les forces soviétiques. Le BRM-1K devait repérer les itinéraires et détecter les formations ennemies."
 UKR_lt_equipment_6:0 "BRM-3K"
 UKR_lt_equipment_6_short:0 "BRM-3K"
 UKR_lt_equipment_6_desc:0 "Le BRM-3K Rys a été développé au début des années 1990. Il était destiné à compléter et remplacer le véhicule de reconnaissance BRM-1K. Il est basé sur le châssis du véhicule de combat d'infanterie BMP-3. Bien que le BRM-3K ait été officiellement accepté par l'armée russe en 1995, il est encore en production à faible cadence."

 UKR_ht_equipment_1:0 "IS-2"
 UKR_ht_equipment_1_short:0 "IS-2"
 UKR_ht_equipment_2:0 "IS-3"
 UKR_ht_equipment_2_short:0 "IS-3"
 UKR_ht_equipment_3:0 "IS-4"
