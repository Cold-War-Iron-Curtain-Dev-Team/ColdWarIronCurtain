 UKR_ht_equipment_4:0 "T-10"
 UKR_ht_equipment_4_short:0 "T-10"
 UKR_ht_equipment_5:0 "T-10M"
 UKR_ht_equipment_5_short:0 "T-10M"

 UKR_mbt_equipment_0:0 "T-34-85"
 UKR_mbt_equipment_0_short:0 "T-34-85"
 UKR_mbt_equipment_0_desc:0 "Le T-34 est un char moyen soviétique qui a révolutionné le domaine de la conception des chars et est bien connu pour sa fiabilité. Le T-34 a été conçu en 1940 par le KMBD en Union soviétique. Dans le but de réduire les coûts, le blindage incliné a été introduit dans la conception du char. Cependant, cela a également permis au réservoir lui-même de devenir bien mieux protégé et moins coûteux avec une surface plus petite. L'arme elle-même est un canon de 76,2 mm et avait une capacité de transport de munitions nominale. Cependant, les viseurs et les dispositifs de vision étaient particulièrement médiocres, ce qui rendait difficile le fonctionnement des commandants de char et leur faible capacité de coordination réduisait de nombreux avantages offerts par le char lui-même. Le T-34 est devenu le deuxième char le plus produit au monde mais l'un des plus importants de la Seconde Guerre mondiale. Les T-34 sont encore utilisés aujourd'hui par les insurgés et les pays les plus pauvres."
 UKR_mbt_equipment_1:0 "T-44"
 UKR_mbt_equipment_1_short:0 "T-44"
 UKR_mbt_equipment_1_desc:0 "Le T-44 est un char moyen soviétique fabriqué vers la fin de la Seconde Guerre mondiale. Il offrait une mobilité améliorée et un blindage plus important avec un canon principal plus lourd de 85 mm. Il a été conçu par AA Morozov en 1944, mais peu ont été construits car le char était considéré comme trop cher pour les avantages qu'il offrait. Seulement 2 000 exemplaires furent construits avant que la production ne revienne au T-34."
 UKR_mbt_equipment_2:0 "T-54"
 UKR_mbt_equipment_2_short:0 "T-54"
 UKR_mbt_equipment_2_desc:0 "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
 UKR_mbt_equipment_3:0 "T-55"
 UKR_mbt_equipment_3_short:0 "T-55"
 UKR_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "
 UKR_mbt_equipment_4:0 "T-62"
 UKR_mbt_equipment_4_short:0 "T-62"
 UKR_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "
 UKR_mbt_equipment_5:0 "T-64A"
 UKR_mbt_equipment_5_short:0 "T-64A"
 UKR_mbt_equipment_5_desc:0 "Le T-64 est un char soviétique qui a introduit de nombreuses modernisations par rapport au T-62 et peut être considéré comme une continuation des améliorations apportées du T-55 au T-62. Il comprend un moteur plus compact, un blindage composite, des auxiliaires de moteur améliorés et un canon principal de 125 mm avec chargeur automatique. Conçu en 1962 par KMBD, le char lui-même présentait de nombreuses améliorations par rapport à son prédécesseur, mais à des coûts nettement plus élevés. Le moteur était un moteur diesel 5TDF à 5 cylindres qui permettait une plus grande autonomie opérationnelle et des vitesses plus élevées. Il était destiné à être mis au rebut, mais sa production a été maintenue grâce à l'influence politique de son concepteur en chef. Alexandre Morozov, le concepteur en chef, a fait valoir que malgré son coût, c'était une conception nettement plus grande qui en valait la peine. Cela n'a pas été le cas lors de la guerre dans le Donbass et de la guerre en Transnistrie. Il a été remplacé par le T-72, beaucoup plus rentable. "
 UKR_mbt_equipment_6:0 "T-72"
 UKR_mbt_equipment_6_short:0 "T-72"
 UKR_mbt_equipment_6_desc:0 "Le T-72 est un CCP soviétique créé comme une nouvelle génération de chars, principalement pour remplacer le T-62 et son homologue coûteux, le T-64. Il coûtait presque la moitié du prix du T-64 et comportait de vastes améliorations. Sa conception a été achevée en 1973 par Leonid Venediktov et a montré des capacités incroyables. Le canon et le blindage étaient toujours respectivement de 125 mm et composites, mais avec une conception beaucoup plus économique et plus facile à produire. Le moteur est un V-12 de 780 ch qui pourrait être ultérieurement réaménagé avec une conception de 1 130 ch. Le char pouvait atteindre une mobilité incroyable, atteignant des vitesses de 80 km/h et pouvait mieux s'adapter aux terrains plus difficiles que le T-64. Il a été utilisé dans tous les conflits de la sphère soviétique, contrairement au T-64, et y a également fait preuve d'incroyables capacités. Le char a également été largement utilisé dans des conflits hors de la sphère africaine, au Moyen-Orient et en Indochine."
 UKR_mbt_equipment_7:0 "T-64BV"
 UKR_mbt_equipment_7_short:0 "T-64BV"
 UKR_mbt_equipment_7_desc:0 "Comprend un blindage réactif « Kontakt-1 » et des lance-grenades fumigènes « Tucha » de 81 mm sur la gauche de la tourelle."
 UKR_mbt_equipment_8:0 "T-64BM Boulat"
 UKR_mbt_equipment_8_short:0 "T-64BM Boulat"
 UKR_mbt_equipment_8_desc:0 "Dans les années 2000, l'usine de Kharkiv Malyshev a modernisé dix chars T-64B (produits à l'origine à Kharkiv en 1980) au standard T-64BM Bulat, et dix-neuf autres ont été livrés en 2011. Ces vingt-neuf chars sont en cours de modernisation dans le cadre d'un contrat de 200 millions de dollars (25,1 millions de dollars) signé en avril 2009. Depuis octobre 2011, l'armée ukrainienne a 76 T-64BM Bulat en service. Selon Konstantin Isyak, ingénieur en chef de l'usine Malyshev, le T-64BM Bulat est blindé au niveau des chars modernes."
 UKR_mbt_equipment_9:0 "T-84 Oplot"
 UKR_mbt_equipment_9_short:0 "T-84 Oplot"
 UKR_mbt_equipment_9_desc:0 "Le T-84 est un char de combat principal (MBT) ukrainien, un développement du char de combat principal soviétique T-80 introduit en 1976. Le T-84 a été construit pour la première fois en 1994 et est entré en service dans les forces armées ukrainiennes en 1999. Le T-84 est basé sur la version T-80 à moteur diesel, le T-80UD. Son moteur à pistons opposés haute performance en fait l'un des CCP les plus rapides au monde, avec un rapport puissance/poids d'environ 26 chevaux par tonne (19 kW/t)."

