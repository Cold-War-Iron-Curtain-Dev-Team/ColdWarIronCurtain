l_french:
 flavor80.1.t:0 "[GetNewspaperHeader]Mont St. Helens"
 flavor80.1.d:0 "La face nord de la montagne s'est effondrée. Les cendres tombent sur l'État de Washington et l'explosion a rasé la forêt sur des kilomètres."
 flavor80.1.a:0 "La montagne a disparu."
 flavor80.1.b:0 "Une terrible éruption."
 flavor80.2.t:0 "[GetNewspaperHeader]Tir de John Lennon"
 flavor80.2.d:0 "John Lennon a été abattu devant son domicile à New York. Les informations ont paralysé la ville et les radios n'ont plus grand-chose d'autre à diffuser."
 flavor80.2.a:0 "La musique s'est arrêtée."
 flavor80.3.t:0 "[GetNewspaperHeader]Le massacre de Bologne"
 flavor80.3.d:0 "Une bombe a ravagé la salle d'attente de Bologne Centrale. Les morts sont des navetteurs. Les années d'avance de l'Italie ont atteint la gare."
 flavor80.3.a:0 "Trouvez qui a fait ça."
 flavor80.3.b:0 "Un massacre à Bologne."
 flavor80.4.t:0 "[GetNewspaperHeader]Les Cortes tenues"
 flavor80.4.d:0 "Les gardes civils ont pris d'assaut le parlement espagnol et ont tenu les députés sous la menace de leurs armes. Au matin, la tentative a échoué et le roi a respecté la constitution."
 flavor80.4.a:0 "Les Cortès tinrent."
 flavor80.4.b:0 "Le coup d'État a échoué."
 flavor80.5.t:0 "[GetNewspaperHeader]La grève des mineurs"
 flavor80.5.d:0 "Les mineurs de charbon britanniques ont débrayé. Des piquets de grève sont organisés, la police est sur les routes et le gouvernement et le syndicat sont prêts à se lancer dans un long combat."
 flavor80.5.a:0 "Les stands sont sortis."
 flavor80.5.b:0 "La Grande-Bretagne est en grève."
 flavor80.6.t:0 "[GetNewspaperHeader]Aide en direct"
 flavor80.6.d:0 "Wembley et Philadelphie sont à l'antenne le même jour et jouent pour lutter contre la famine. Les concerts seront regardés par une bonne partie du monde."
 flavor80.6.a:0 "Wembley est plein."
 flavor80.6.b:0 "Philadelphie est à l'antenne."
 flavor80.6.c:0 "Ils ont amassé une fortune."
 flavor80.7.t:0 "[GetNewspaperHeader]Le désastre du Challenger"
 flavor80.7.d:0 "La navette Challenger s'est brisée juste après son lancement. L'équipage est perdu et le programme de vol s'arrête avec eux."
 flavor80.7.a:0 "Nous continuerons."
 flavor80.7.b:0 "Une perte épouvantable."
 flavor80.8.t:0 "[GetNewspaperHeader]Lundi noir"
 flavor80.8.d:0 "Wall Street a chuté plus durement en un jour qu'elle ne l'a fait depuis des années. Les ventes se sont propagées au-delà de New York avant la cloche de clôture."
 flavor80.8.a:0 "Le sol est cassé."
 flavor80.8.b:0 "Wall Street est en chute libre."
