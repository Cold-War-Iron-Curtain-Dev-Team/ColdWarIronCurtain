 McDonald84.0.d: "Aujourd'hui à Washington, le président McDonald a signé le décret 12334, intitulé « Activités de renseignement des États-Unis ». Cet ordre, définissant le champ d'action des services de renseignement et autorisant plus de liberté dans la collecte de renseignements, ordonne également au Conseil de sécurité nationale et à toutes les agences subordonnées d'incorporer la Western Goals Foundation, une agence de renseignement intérieure anticommuniste privée, dans leurs opérations. Pour les observateurs occasionnels, cela signale un changement radical dans les opérations de renseignement américaines et un assouplissement rapide de toute autorité de régulation dont disposaient les agences dans le passé, entraînant des attitudes plus agressives et radicalement anticommunistes, et créant peut-être un dangereux précédent dans le domaine de la sécurité nationale américaine dans son ensemble."
 McDonald84.1.d: "Le monde a été choqué aujourd'hui lorsque l'ambassadrice des États-Unis auprès des Nations Unies, Jeane Kirkpatrick, a annoncé la suspension des activités de sa délégation auprès de l'ONU, sur ordre du président McDonald. En tant que membre permanent du Conseil de sécurité, membre fondateur et membre le plus influent de l'ONU autre que l'Union soviétique, cela change fondamentalement les opérations de travail de l'ONU pour une durée indéterminée, et alors que la délégation américaine s'éloignait, un convoi à destination de Washington, le Secrétariat se leva, choqué."
 McDonald84.2.d: "Après avoir été dissous en janvier 1975, le Comité de la Chambre sur la sécurité intérieure, connu dans les années 1950 sous le nom de Comité de la Chambre sur les activités anti-américaines, a été reformé sur les conseils du président McDonald, du Conseil de sécurité nationale et de la Western Goals Foundation. Créé pour enquêter sur les « subversifs » non seulement aux États-Unis mais aussi dans les gouvernements fédéral et étatiques, le HCIS constitue un pas radical dans une nouvelle direction, et certains experts l'ont qualifié de résurrection des idéaux maccarthystes, en particulier au Congrès américain."
 McDonald88.0.d: "Avec la création du Comité de la Chambre sur la sécurité intérieure et la signature du décret 12334, la Western Goals Foundation continue de s'élever et de s'infiltrer jusqu'aux échelons les plus profonds du gouvernement fédéral des États-Unis. Fondé en 1979 par le major général John Singlaub, l'éditeur John Rees et le président McDonald, le WGF a été créé pour « émousser la subversion, le terrorisme et le communisme » et a agi comme une agence de renseignement privée, conservant des dossiers de police et d'enquête sur des « subversifs » connus depuis le début des années 1980. Grâce à ses activités de renseignement, le WGF a pu fournir aux forces de l'ordre fédérales et étatiques des informations cruciales sur les subversifs politiques, en particulier les communistes présumés. Avec le président Larry McDonald au pouvoir, il est clair pour la plupart des analystes politiques que le WGF continuera de croître en portée et en influence dans les années à venir."
 McDonald88.1.d: "Dans un discours public télévisé sans précédent adressé ce soir au peuple américain, le président Larry McDonald a donné son interprétation du déclin moral de la nation. Terminant son discours enflammé par des expressions telles que \"féminisme militant et terroriste\", \"monstres radicaux pro-avortement tueurs de bébés\" et \"déviants sexuels enragés, obsédés par la pornographie\", décrivant selon lui une grande partie de la population américaine, McDonald a appelé à un retour aux \"valeurs chrétiennes américaines normales, une famille nucléaire, sans dégénérescence\". Bien que ce ne soit pas le cas d'un président américain, cela n'est pas sans précédent pour McDonald, qui a fait campagne sur un principe similaire lors de sa route vers la présidence."
 McDonald88.2.d: "Le Capitole et la Maison Blanche ont été envahis de journalistes aujourd'hui alors que des rapports simultanés apparaissaient selon lesquels un amendement constitutionnel visant à annuler l'Amendement sur l'égalité des droits était présenté dans les deux chambres du Congrès sous la forme d'une résolution commune. Les deux porte-parole ont dit la même chose ; qu'il s'agissait d'une priorité législative pour le président McDonald et que « l'Amendement sur l'égalité des droits est un affront aux valeurs familiales fondamentales qui existent dans ce pays depuis sa fondation » ainsi que « ouvrant la porte à encore plus de déviance sexuelle de la part des homosexuels et autres ». Bien que cela ne soit pas totalement choquant de la part de cette administration, les partisans de l'ERA se préparent à riposter à cette annonce avec une série de campagnes tant au niveau fédéral qu'au niveau des États pour voter contre cet amendement."
 McDonald88.3.d: "Le président Larry McDonald a officiellement approuvé ce matin l'introduction d'un amendement d'annulation de la Constitution des États-Unis sous forme de résolution commune. Initialement problématique au début des années 1830, lorsque l'État de Caroline du Sud a tenté d'annuler les tarifs fédéraux, l'annulation est une théorie selon laquelle les 50 États ont le droit d'annuler ou de déclarer nulle toute loi ou décision fédérale. Plus récemment, l'annulation a été utilisée pour justifier la résistance contre l'intégration scolaire ainsi que contre d'autres réformes des droits civiques. Cet amendement n'est pas surprenant, mais il reste à savoir s'il sera ratifié."
 McDonald88.4.d: "Sans surprise, le cabinet du président McDonald a lancé l'idée d'interdire le Socialist Workers' Party aux États-Unis. Formé en 1938 après s'être séparé du Parti Socialiste d'Amérique, le SWP a été confronté à des difficultés pendant la Seconde Guerre mondiale et la Peur rouge des années 1950. De tendance majoritairement trotskiste et bénéficiant d'un large soutien au Cuba de Castro, ils représentent une certaine menace pour l'administration McDonald, et leur interdiction serait généralement conforme aux priorités de son administration."
 McDonald88.5.d: "Aujourd'hui, une importante opération d'expulsion a été conclue par le US Immigration and Naturalization Service, l'agence américaine des douanes et du contrôle des frontières. Annoncée par décret du président McDonald, l'opération INS a expulsé environ 100 000 immigrants illégaux, la plupart dans les zones frontalières des États de Californie, d'Arizona, du Nouveau-Mexique et du Texas. Impliquant l'assistance de la Garde nationale, ainsi que l'utilisation d'hélicoptères et de véhicules blindés, l'opération a été un succès, quoique quelque peu controversée."
 McDonald88.6.d: "Le cabinet du président McDonald's se réunissait aujourd'hui sur une question importante, qui pourrait fondamentalement affecter tous les Américains. Le secrétaire au Trésor George Hansen a pris la parole le premier, brisant le silence.\n\n \"Eh bien, je suis sûr que vous savez tous pourquoi vous êtes ici. Nous devrions discuter de l'impôt sur le revenu.\"\n\nDes murmures de « vol » ont été entendus, avant que McDonald ne prenne la parole. \"Je veux abolir l'impôt sur le revenu. C'est une perte de temps et de ressources pour le gouvernement, et cela sera extrêmement utile pour libérer l'Américain moyen d'un gouvernement autoritaire.\"\n\nDes applaudissements ont éclaté dans la salle tandis que les membres du cabinet acquiesçaient, mais une silhouette est restée silencieuse avant de prendre la parole.\n\n \"Monsieur le Président, je suis opposé à la suppression de l'impôt sur le revenu. D'une part, pourquoi ne pas simplement réformer les problèmes actuels au lieu de s'en débarrasser complètement ? Nos recettes fiscales fournissent la majeure partie de nos fonds budgétaires pour le fonctionnement de ce gouvernement.\" Reuben Askew était très compétent dans son travail, étant l'actuel représentant commercial des États-Unis et ancien gouverneur de Floride.\n\nMcDonald fit une pause avant de répondre : « Même si je suis plutôt d'accord, je pense que l'impôt sur le revenu a survécu assez longtemps et que nous pouvons gagner des revenus à partir d'autres sources, tout en réduisant nos dépenses. Par conséquent, je pense que nous devrions... »"

 McDonald88.7.d: "Dans une annonce sans précédent faite aujourd'hui par la Maison Blanche, le président Larry McDonald a proposé la possible suppression de l'impôt sur le revenu aux États-Unis. Faisant une déclaration avant une conférence de presse régulière, McDonald a qualifié l'impôt sur le revenu de « fardeau inutile pour l'Américain moyen » et que l'abolition de l'impôt sur le revenu « libérerait des millions d'Américains de l'esclavage pour dettes envers leur gouvernement ». Naturellement, la plupart des membres du Parti démocrate de McDonald's expriment leur indignation face à cette annonce, émettant des condamnations immédiates et souhaitant que \"le président McDonald's repense sa stratégie fiscale\". Il n'est pas certain que cette proposition aboutisse réellement, mais ses conséquences sont déjà présentes."
 McDonald88.8.d: "Lors d'une réunion du Conseil national de sécurité, d'importantes discussions ont commencé sur la politique en matière de drogue. Étaient réunis le président McDonald, le secrétaire à la Défense John Singlaub, le procureur général américain Roy Cohn et le directeur du renseignement central William Casey.\n\nSur la base des discussions qu'ils ont eues plus tôt à ce sujet, Singlaub a pris la parole. \"Monsieur le Président, nous savons tous que le problème de la drogue dans ce pays est l'une de vos principales priorités. Je suis sûr que nous sommes tous d'accord sur le fait qu'il faut faire quelque chose à ce sujet, et j'ai une proposition.\" Il s'arrêta un instant. \"Nous devrions étendre nos opérations antidrogue au-delà du ministère de la Justice.\" Il fit un signe de tête à Cohn. \"Les troupes de la Garde nationale et les agents de la Central Intelligence Agency devraient être utilisés. Nous devons utiliser l'État profond et tous nos moyens de renseignement pour contrer ce problème par tous les moyens nécessaires.\"\n\nDes hochements de tête de tous traversèrent la pièce tandis que le directeur Casey se levait pour parler. \"Je me fais l'écho de cela, nous devrions compter sur davantage de soutien de la part de la Western Goals Foundation pour atteindre cet objectif au niveau national.\"\n\nLe président McDonald hocha la tête. \"Ravi de voir que nous sommes tous d'accord. John, informez le chef du bureau de la Garde nationale du déploiement et dites-lui d'élaborer un plan. Roy, votre département doit fournir un bouclier pour cela, inventer une justification légale. Directeur Casey, commencez à travailler sur des plans pour infiltrer des agents de la CIA dans des gangs de drogue nationaux. Finissons-en.\""
 McDonaldHess.0.d: "Dans une déclaration publique, le président McDonald a appelé au retour de Rudolf Hess, membre dirigeant du parti nazi pendant la Seconde Guerre mondiale et adjoint du Führer, qui a fui l'Allemagne en 1941 pour se réfugier en Grande-Bretagne dans le but d'assurer la paix. Ayant été jugé et reconnu coupable de crimes contre la paix lors du procès de Nuremberg en 1946, Hess est actuellement inhumé seul dans la prison de Spandau en Allemagne de l'Ouest. La pression pour la libération de Hess est active depuis la fin des années 1960 sous le commandement de son fils, Wolf Rudiger Hess, et a recueilli le soutien de personnalités telles que Geoffery Lawrence, le juge britannique lors du procès de Nuremberg, et Willy Brandt, ancien maire de Berlin-Ouest et chancelier de l'Allemagne de l'Ouest. Cependant, toutes les tentatives jusqu'à présent ont été refusées par les Soviétiques, car la prison est administrée par les quatre puissances alliées. Cette tentative de McDonald, historiquement extrêmement anticommuniste, pourrait cependant s'avérer différente."
 McDonaldHess.1.d: "C'était une journée nuageuse lorsque le président McDonald a rencontré ses principaux conseillers juridiques, dont le procureur général Roy Cohn et l'avocat de la Maison Blanche Arthur Culvahouse Jr., au sujet des aspects juridiques de sa déclaration publique concernant le retour de Rudolf Hess.\n\nCommença Cohn. \"Monsieur le Président, après avoir examiné cette proposition de transfert de Rudolf Hess aux États-Unis, mon opinion professionnelle est que cela est légalement possible, mais pourrait attirer une attention indésirable.\"\n\nCulvahouse acquiesça. \"Oui. De toute évidence, les Britanniques et les Français doivent être consultés à ce sujet, mais cela sera présenté comme une libération d'un criminel de guerre, et c'est une chose à laquelle mon bureau devra être prêt lorsque cela se produira inévitablement.\"\n\nMcDonald hocha la tête. \"Très bien. Nous allons poursuivre ce plan. Contactez les ambassadeurs britannique et français, dites-leur d'informer leurs gouvernements et de se préparer à une réponse soviétique. Appelez le fils de Hess, faites-lui savoir ce que nous voulons faire. Maintenant, nous attendons.\""
 McDonaldHess.2.d: "« Dans un rare tournant vers l'Occident, le secrétaire général soviétique [SOV.GetLeader] a autorisé le Conseil de contrôle allié à libérer Rudolf Hess de la prison de Spandau. Considéré au départ comme une démarche risquée, le dernier criminel de guerre nazi partira dans quelques semaines.\n\nLe titre du Washington Post présentait ceci ainsi qu'une grande impression du visage de Hess. McDonald et Cohn se tenaient dans le bureau ovale, souriants. Ils avaient gagné. Il était désormais temps de régler l'extradition avec les responsables alliés et de commencer la logistique pour amener Hess aux États-Unis, ainsi que de faire face à l'inévitable retour de flamme de son propre parti."
 McDonaldHess.3.d: "« Sans surprise, la dernière tentative visant à libérer le criminel de guerre nazi Rudolf Hess, sous l'impulsion du président américain Larry McDonald, a été stoppée par l'influence soviétique. Inhumé dans la prison de Spandau à Berlin-Ouest, administrée par le Conseil de contrôle allié, le représentant soviétique a opposé son veto à toute tentative visant à libérer Hess, qui est le seul occupant de la prison.\n\nRien de plus qu'un texte de présentation à la page 4 du Washington Post, ce qui était embarrassant pour la Maison Blanche et le président McDonald, qui, après avoir lu ceci, fulminaient en silence. Maudits Soviétiques."
 McDonaldHess.4.d: "Dans un rare tournant vers l'Occident, le secrétaire général soviétique [SOV.GetLeader] a autorisé le Conseil de contrôle allié à libérer Rudolf Hess de la prison de Spandau à Berlin-Ouest. Considéré au départ comme une démarche risquée, le dernier criminel de guerre nazi partira dans quelques semaines."
 McDonaldHess.5.d: "Sans surprise, la dernière tentative visant à libérer le criminel de guerre nazi Rudolf Hess, sous l'impulsion du président américain Larry McDonald, a été stoppée par l'influence soviétique. Inhumé dans la prison de Spandau à Berlin-Ouest, administrée par le Conseil de contrôle allié, le représentant soviétique a opposé son veto à toutes les tentatives visant à libérer Hess, qui est le seul occupant de la prison."  
 McDonaldHess.6.d: "Un Boeing 727 assez quelconque portant les inscriptions du Département d'État a atterri ce soir à l'aéroport international de Washington Dulles sous le couvert de l'obscurité, avec un seul passager important ; Rudolf Hess. Sans tambour ni trompette, Hess a été mis dans une Chevrolet Suburban noire et s'est enfui, vraisemblablement pour vivre en paix aux États-Unis."
 McDonaldHess.10.d: "Nous avons reçu des informations du commandant du Groupe des forces soviétiques d'Allemagne (GSFG) ainsi que du Conseil de contrôle allié indiquant qu'un appel est en cours pour libérer le criminel de guerre nazi Rudolf Hess de la prison de Spandau à Berlin-Ouest et l'envoyer vivre aux États-Unis. Auparavant, notre gouvernement avait rejeté toute demande, mais suite à un appel du président américain Larry McDonald, cette décision a fait la une des journaux internationaux, notamment parce que Hess est malade et est le seul occupant de la prison de Spandau, dont l'entretien est extrêmement coûteux. Quelle sera notre décision ?"

 McDonald88.10.d: "Il y a eu un choc considérable aux États-Unis aujourd'hui lorsqu'un amendement constitutionnel annulant l'Amendement sur l'égalité des droits a été ratifié par le corps législatif de l'État de l'Alabama, marquant la majorité des deux tiers requise pour le mettre en loi. Garantissant à l'origine l'égalité des droits de tous, notamment contre la discrimination fondée sur le sexe ou l'orientation sexuelle, l'administration de Larry McDonald l'a décrié comme étant contraire aux valeurs familiales américaines traditionnelles."
 McDonald88.11.d: "Un soulagement considérable s'est répandu aujourd'hui à travers les États-Unis alors qu'une session conjointe du Sénat et de la Chambre des représentants a voté fermement contre un projet d'amendement constitutionnel qui aurait annulé l'Amendement sur l'égalité des droits. Proposée par le président Larry McDonald, qui a fait campagne sur la rhétorique homophobe, la communauté gay en plein essor aux États-Unis est aujourd'hui ravie de la victoire assurée."
 McDonald88.12.d: "Les experts juridiques ont assisté aujourd'hui avec émerveillement à la ratification d'un amendement constitutionnel codifiant l'annulation par la législature de l'État de Virginie, marquant la majorité des deux tiers requise pour le mettre en loi. Initialement présentée lors de la crise d'annulation des années 1830, cette théorie juridique, plus récemment appliquée à la lutte pour la déségrégation, stipule que les États peuvent annuler la législation fédérale s'ils ne sont pas d'accord. Ce précédent, désormais inscrit dans la Constitution, présente une situation juridique confuse aux États-Unis."
 McDonald88.13.d: "Un soulagement considérable s'est répandu aujourd'hui à travers les États-Unis alors qu'une session conjointe du Sénat et de la Chambre des représentants a voté fermement contre un projet d'amendement constitutionnel qui aurait codifié l'annulation par les États. Proposé par le président Larry McDonald, l'amendement aurait permis aux États d'ignorer la loi fédérale s'ils ne l'approuvaient pas, ce qui aurait conduit à des problèmes juridiques confus."

 Rockefeller75.0.d: "Aujourd'hui à Washington, le président Nelson Rockefeller a annoncé l'un de ses premiers objectifs politiques majeurs : la création d'un groupe de travail axé sur le contrôle des armes à feu. Dans un décret signé aujourd'hui, le nouveau Conseil présidentiel sur le contrôle des armes à feu sera composé de responsables de toutes les grandes villes américaines ainsi que du FBI et d'autres responsables de l'application des lois. Attendus à se heurter à la résistance des fabricants d'armes à feu ainsi que de la National Rifle Association, de nombreux républicains et démocrates modérés saluent cette mesure comme la première étape vers une réduction de la criminalité et de la violence armée aux États-Unis."
 Rockefeller75.1.d: "Lors d'une importante conférence de presse aujourd'hui, le président américain Nelson Rockefeller a présenté la politique de son administration, connue sous le nom de programme « Fair Society ». Composé principalement de politiques fédérales tirées de l'époque où il était gouverneur de New York, le programme Fair Society consistera en une poussée vers davantage de logements sociaux, des lois sur les drogues axées sur la réhabilitation plutôt que sur l'emprisonnement, une législation élargie sur les droits civiques, des programmes Medicare et Medicaid étendus et un système de développement des transports élargi. Attendu qu'il plaira à la fois à la base libérale républicaine de Rockefeller ainsi qu'à la plupart des démocrates, le projet pourrait se heurter à une certaine résistance au sein du propre parti républicain de Rockefeller, en particulier de la part des soi-disant « faucons de la dette » du Congrès à la Chambre."
 Rockefeller76.1.d: "Ce n'est pas une surprise aujourd'hui que la Maison Blanche, lors d'une conférence de presse officielle, ait annoncé le limogeage du secrétaire à la Défense Donald Rumsfeld et du chef d'état-major de la Maison Blanche Dick Cheney. Tous deux survivants de l'administration du président Ford, les deux hommes sont restés sous Rockefeller après l'assassinat de Ford en septembre 1975. En raison de leurs positions idéologiques de conservateurs plus radicaux, en contraste frappant avec l'aile libérale du GOP de Rockefeller, Rumsfeld et Cheney ont été licenciés et devraient rester dans le Parti républicain, s'alignant principalement sur l'aile Reagan/Bush du parti."
 Rockefeller76.2.d: "Le président américain Nelson Rockefeller a présenté aujourd'hui au Congrès américain une proposition visant à amender la Constitution afin de mettre fin à ce que l'on appelle la clause des « citoyens nés de naissance » ; qui stipule que seuls les citoyens américains nés sur le sol américain peuvent se présenter à la présidence. Bien que la Constitution ne définisse pas explicitement ce que signifie « citoyen de naissance », cette clause a été largement interprétée comme empêchant les citoyens étrangers d'exercer des fonctions aux États-Unis. Plusieurs amendements constitutionnels ont été introduits sur cette question, le plus récent datant de 1974 lorsque le représentant Jonathan Brewster Bingham de New York a présenté un amendement similaire dans le but de permettre au secrétaire d'État Henry Kissinger de prendre sa place dans la ligne de succession présidentielle.\n\nOn ne sait pas exactement quelle est l'opinion publique sur cette question, mais l'amendement doit d'abord être adopté par le Congrès avant que les législatures des États puissent le ratifier."
 Rockefeller76.3.d: "De manière quelque peu choquante, une proposition d'amendement constitutionnel visant à mettre fin à la clause des « citoyens nés » de la Constitution américaine a été approuvée par une session conjointe du Sénat américain et de la Chambre des représentants et a été ratifiée avec succès par la majorité des deux tiers des États, avec l'adoption de la législature de l'État du New Jersey. Cela devrait constituer un changement majeur dans l'éligibilité à la présidence, car cela permettra au secrétaire d'État Henry Kissinger de figurer dans la ligne de succession présidentielle. Bien que l'opinion publique ait tendance à être quelque peu apathique, le groupe démographique le plus bruyant est la communauté d'immigrants américains en plein essor, qui se sentent désormais validés et capables de faire partie du processus démocratique même s'ils ne sont pas nés aux États-Unis."
 Rockefeller76.4.d: "Il n'est pas surprenant qu'une session conjointe du Sénat et de la Chambre des représentants des États-Unis ait une fois de plus rejeté catégoriquement une proposition d'amendement constitutionnel supprimant la clause des « citoyens de naissance », conservant ainsi le statu quo et ne permettant pas aux citoyens étrangers d'être éligibles à la présidence ou à une autre fonction fédérale. Bien que cela ne soit pas totalement inattendu, la pression en faveur de l'éligibilité a été forte au cours de la période récente, mais elle s'est heurtée à l'opposition générale et à l'apathie de la part des Américains moyens ainsi que des Républicains radicaux du Congrès."
 Rockefeller76.5.d: "Avec le récent limogeage de Donald Rumsfeld et de Dick Cheney, l'administration Rockefeller et le Parti républicain ont effectivement écarté la faction reaganienne dure et néoconservatrice du parti, parfois connue sous le nom de « majorité morale », de tout poste important au sein du pouvoir exécutif. Garantissant la quasi-hégémonie de l'aile libérale du Parti républicain, connue sous le nom de « Républicains responsables », l'administration Rockefeller est assurée de l'absence de résistance interne à sa politique, du moins à la Maison Blanche."
 Rockefeller76.6.d: "C'était une journée ensoleillée à Washington alors que le président Rockefeller se tenait devant le bâtiment du ministère de l'Intérieur, flanqué du secrétaire d'État à l'Intérieur Thomas Kleppe, d'autres responsables du ministère de l'Intérieur et de membres de la police des parcs et du service des parcs nationaux des États-Unis. Debout sur le podium, Rockefeller commença à parler.\n\n \"Bonjour. La conservation est une question extrêmement importante dans notre pays, car nos terres constituent la partie la plus importante de l'Amérique. En tant que gouverneur de New York, j'ai étendu le système des parcs de New York, interdit le DDT et protégé les Adirondacks. En tant que président, j'espère faire de même pour notre système de service des parcs nationaux. \""

 Dole80.0.d: "L'Amérique sous le président Robert Dole a véritablement été « plus juste et plus libre ». En 4 ans de son administration, le président Dole a atteint de nombreux objectifs politiques, notamment la signature de l'Americans with Disabilities Act (ADA), la législation la plus vaste et la plus complète sur les droits des personnes handicapées à ce jour ; signer plusieurs lois sur le budget, les finances et la réforme fiscale ; adopter des révisions massives du code pénal américain et intensifier la guerre contre la drogue ; interdisant l'action positive dans certains programmes fédéraux et, se détournant de ses collègues conservateurs, exhortant à l'acceptation de Roe comme loi établie. Sur le front de la politique étrangère, le président Dole s'est particulièrement concentré sur les liens économiques et commerciaux avec l'Amérique latine, permettant un afflux de blagues télévisées en fin de soirée comparant le président Dole à la Dole Fruit Company et aux soi-disant « républiques bananières » d'Amérique centrale.\n\nEn fin de compte, le conservatisme unique de Dole, avec ses clins d'oeil à certaines politiques libérales, a abouti à une nouvelle Amérique pour les années 1980."
 Dole80.1.d: "Lors d'une conférence de presse aujourd'hui, le président Robert Dole a choqué ses collègues conservateurs en appelant à l'acceptation à l'échelle nationale des résultats de l'affaire Roe contre Wade comme étant une loi établie.\n\nFace aux questions des journalistes concernant son précédent vote sur l'avortement, Dole a répondu que \"c'est l'une de ces questions très personnelles et délicates que la plupart d'entre nous essaient de ne pas aborder\" mais que \"j'ai un bilan sans faille en matière de protection de l'enfant à naître\". Confronté à ces problèmes, Dole a tenté de faire marche arrière, déclarant en outre que \"Cependant, nous devrions respecter la décision de la Cour suprême de 1973 - ils ont décidé, et c'est pratiquement une loi établie à ce stade\".\n\nApparaissant pour la plupart des membres du Parti républicain comme une énigme sur l'avortement, Dole est désormais contesté par des forces au sein de son parti qui s'opposent fermement aux résultats de Roe et continuent de faire pression pour une interdiction nationale de l'avortement."
 Dole80.2.d: "Dans un décret signé aujourd'hui dans le Bureau ovale, le président Dole a créé la Commission présidentielle sur la réforme de la réglementation. Proposée par les anciennes administrations conservatrices, cette nouvelle commission a pour mission « d'évaluer l'impact des réglementations fédérales sur les Américains individuels, de travailler à l'amélioration des réglementations et des procédures, et de recommander les présidents et les membres des douze agences fédérales de réglementation, notamment la Federal Trade Commission, la Securities and Exchange Commission, le National Labor Relations Board et la Consumer Product Safety Commission ».\n\nLargement saluée par les Républicains et les Démocrates comme un mécanisme de réforme destiné à supprimer les réglementations désuètes et, espérons-le, à améliorer la bureaucratie gouvernementale, cette commission devrait se former et se réunir dès que possible pour commencer à émettre des directives."
 Dole80.3.d: "Dans un décret signé aujourd'hui, le président Dole a officiellement interdit la politique « d'action positive » utilisée pour les programmes fédéraux, ainsi que le définancement de la Commission pour l'égalité des chances en matière d'emploi. Créés à l'origine comme une forme de non-discrimination dans les pratiques d'embauche, les mouvements pour les droits civiques et les droits des femmes ont contraint les administrations précédentes à étendre leurs politiques d'action positive à la discrimination fondée sur la race et le sexe.\n\nActuellement, l'action positive est étendue aux pratiques d'embauche au sein du gouvernement fédéral, aux entrepreneurs et sous-traitants fédéraux, aux logements fournis par le gouvernement fédéral et à de nombreuses pratiques d'admission dans les collèges et universités financés par l'État aux États-Unis.\n\nDes groupes de défense des droits civiques, dont l'American Civil Liberties Union, ont dénoncé ce décret comme un arrêt du progrès, tandis que les partisans de Reagan et de Dole au sein du Parti républicain soutiennent fortement cette mesure."
 Dole80.4.d: "Peu après la réunion d'information du Département d'État d'aujourd'hui, la Maison Blanche a tenu une conférence de presse au cours de laquelle le président Dole a annoncé de nouvelles initiatives commerciales avec l'Amérique latine. Tentant à la fois de rectifier l'implication passée secrète des États-Unis dans les affaires intérieures de l'Amérique latine et d'élargir les relations commerciales et économiques américaines dans les Amériques, le président a annoncé une nouvelle série de programmes d'aide étrangère, d'accords bilatéraux et de missions commerciales, coordonnés avec le Département d'État et le représentant américain au commerce, ainsi qu'à travers les mécanismes de l'Organisation des États américains.\n\nLes réactions des deux côtés ont été généralement positives, non sans une certaine opposition de la part des conservateurs radicaux et des éléments de gauche, qui condamnent tous deux l'ingérence continue des États-Unis en Amérique latine."
 Dole84.1.d: "Lors d'une petite cérémonie avec peu de journalistes aujourd'hui, le président Dole a déclaré que « les États-Unis reconnaissent formellement que la déportation et le massacre des Arméniens de souche par l'Empire Ottoman pendant la Première Guerre mondiale constituent un génocide selon le droit international ». Entouré de survivants du génocide ; comprenant le Dr Hampar Kelikian, un orthopédiste de Chicago qui a aidé à soigner Dole suite à ses blessures pendant la Seconde Guerre mondiale, la cérémonie visait principalement à présenter et à se souvenir des immigrants arméno-américains et des survivants du génocide, qui approchait de son 70e anniversaire.\n\nLes réactions à cette reconnaissance ont été généralisées, avec des condamnations et des réfutations compréhensibles de la part de la République de Turquie, ainsi que des démocrates et des républicains des deux côtés, qui soutiennent que la reconnaissance formelle est une perte de temps et que les États-Unis ne devraient pas risquer de s'aliéner un allié de l'OTAN à cause d'événements historiques."
 Dole84.2.d: "Des informations sont parvenues de notre ministère des Affaires étrangères selon lesquelles les États-Unis, sous la présidence de Robert Dole, ont reconnu la déportation massive légitime de nationalistes et de terroristes de souche arménienne de notre territoire comme un soi-disant « génocide » selon le droit international. En tant que membre principal de l'OTAN, cette reconnaissance par les États-Unis est absurde, traître et va à l'encontre de l'intérêt national de la République sous toutes ses formes. Nous avons déjà envoyé des messages fermes à l'ambassade américaine à Ankara ainsi que des communiqués à notre corps diplomatique pour déposer une protestation diplomatique formelle contre cette action. Ce ne sera pas la dernière fois que les Américains entendront parler de nous."
 Dole88.1.d: "Depuis le premier mandat du président Robert Dole, le paysage américain a complètement changé. Plus important encore, quatre départements ministériels ont été complètement dissous par l'administration Dole : le commerce, l'énergie, l'éducation, et le logement et le développement urbain. Dole a également opposé son veto au Civil Rights Act de 1990, citant des quotas basés sur la race, et a modifié le Clean Air Act pour fournir une plus grande réglementation du gouvernement fédéral.\n\nSur le front de la défense, Dole a fait pression pour l'expansion de l'Initiative de défense stratégique, ainsi que pour l'élargissement de la réglementation des armes biologiques et des armes de destruction massive (ADM) ; et tristement célèbre, il a déployé la Garde nationale américaine dans la guerre contre la drogue.\n\nSur le plan économique, Dole a fait pression pour une plus grande application du budget, ainsi que pour la signature de l'Accord de libre-échange nord-américain afin de garantir des avantages économiques mutuels en Amérique du Nord. Connue sous le nom de « Renaissance américaine » par de nombreux experts conservateurs, l'administration Dole continuera à laisser un héritage pour les décennies à venir."
 Dole88.2.d: "Aujourd'hui, lors d'une conférence de presse avec les dirigeants du Congrès, le président Dole a demandé une fois de plus qu'un amendement à l'équilibre budgétaire soit présenté lors d'une session conjointe du Congrès. Consistant en un amendement constitutionnel stipulant que les États-Unis ne peuvent pas dépenser plus que leurs revenus annuels, des propositions d'amendements à ce sujet ont déjà été faites, en particulier à la fin des années 1960 et dans les années 1970, lorsque les dépenses déficitaires du gouvernement fédéral sont réapparues.\n\nCependant, avec les récentes mesures prises par l'administration Dole pour réduire les dépenses publiques inutiles et plusieurs mesures législatives de réforme budgétaire ayant déjà été adoptées, le Congrès américain pourrait avoir plus de motivation pour adopter cet amendement constitutionnel."

 NAFTA.1.d: "Lors d'une conférence de presse télévisée depuis la Maison Blanche aujourd'hui, le président [USA.GetLeader], accompagné de son secrétaire d'État, a annoncé son intention d'accélérer les négociations d'un accord de libre-échange nord-américain. Envisagées comme un accord de libre-échange entre les États-Unis, le Canada et le Mexique, les premières négociations ont commencé, mais n'ont pas donné beaucoup de progrès. On estime qu'avec des négociations appropriées et une opinion publique suffisante, l'accord finira par aboutir."
 NAFTA.2.d: "Aux États-Unis, l'annonce par le président de son intention de conclure un accord de libre-échange nord-américain avec le Canada et le Mexique a récemment suscité à la fois soutien et opposition. De nombreux partisans parlent de la nécessité d'un plus grand libre-échange dans un monde qui se modernise rapidement et se développe technologiquement ; en particulier avec les voisins directs des États-Unis au nord et au sud. Cependant, de nombreux opposants, en particulier les conservateurs budgétaires, font valoir les problèmes inhérents, tels que la réduction des recettes douanières, les problèmes liés aux réglementations commerciales et douanières complexes, citant la propagation des drogues aux États-Unis et mettant l'accent sur la délocalisation des emplois vers le Mexique et le Canada, ce qui entraîne un ralentissement économique.\n\nL'opinion publique américaine, interrogée, semble plutôt divisée sur cette question, mais les négociations semblent se poursuivre sur l'ALENA."
 NAFTA.3.d: "Le Premier ministre [CAN.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Ottawa, délivrant un message du président [USA.GetLeader] concernant la possible formation d'un accord de libre-échange nord-américain entre les États-Unis, le Canada et le Mexique.\n\nBien que notre gouvernement soit généralement en faveur de cette proposition, la population canadienne s'oppose fermement à un plus grand libre-échange, en particulier lors des dernières élections de 1988 et de l'accord de libre-échange plutôt controversé entre le Canada et les États-Unis signé en 1987. Les conseillers économiques et les ministres de notre gouvernement ont déterminé que, sans équivoque, le pays pourrait bénéficier d'un accord de libre-échange comme celui-ci, mais nous devons garder en perspective la volonté du peuple ainsi que notre souveraineté nationale et nos intérêts nationaux. Comment devons-nous réagir ?"
 NAFTA.4.d: "Nous avons reçu un message du bureau du premier ministre à Ottawa et de l'ambassade du Canada à Washington selon lequel le gouvernement canadien a accepté nos offres initiales de négocier un accord de libre-échange nord-américain, avec la signature d'un cadre de base qui sera déterminé prochainement. Le Premier ministre [CAN.GetLeader] s'est entretenu par téléphone avec le Président [USA.GetLeader] et lui a exprimé ses meilleurs voeux pour les futures négociations autour de cet accord."
 NAFTA.5.d: "Malheureusement, l'ambassadeur du Canada à Washington a fait savoir au premier ministre [CAN.GetLeader] à Ottawa que le gouvernement canadien ne participerait pas aux négociations sur un accord de libre-échange nord-américain. L'ambassadeur américain à Ottawa a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous rétablirons."
 NAFTA.6.d: "Le président [MEX.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Mexico, délivrant un message du président américain [USA.GetLeader] sur la possible formation d'un accord de libre-échange nord-américain entre les États-Unis, le Canada et le Mexique.\n\nNotre gouvernement est désireux d'attirer davantage d'investissements étrangers, notamment en provenance des États-Unis, à la suite de la crise de la dette latino-américaine du début des années 1980, mais il devrait veiller à ne pas lier trop étroitement son économie à celle des États-Unis, si jamais nous devenions dépendants de leur économie. De plus, notre intérêt national, notre souveraineté et la volonté du peuple doivent être pris en compte dans cette décision. Comment allons-nous réagir ?"
 NAFTA.7.d: "Nous avons reçu des informations du bureau du président à Mexico et de l'ambassade du Mexique à Washington selon lesquelles le gouvernement mexicain a accepté nos offres initiales de négocier un accord de libre-échange nord-américain, avec la signature d'un cadre de base qui sera bientôt déterminé. Le président mexicain [MEX.GetLeader] s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs voeux pour les négociations futures autour de cet accord."
 NAFTA.8.d: "Malheureusement, l'ambassadeur du Mexique à Washington a fait savoir au président mexicain [MEX.GetLeader] à Mexico que le gouvernement mexicain ne participerait pas aux négociations sur un accord de libre-échange nord-américain. L'ambassadeur américain à Mexico a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous rétablirons."
 NAFTA.9.d: "Aujourd'hui, un cadre de base pour négocier un accord de libre-échange nord-américain a été signé simultanément à Washington, Ottawa et Mexico, respectivement par le président américain [USA.GetLeader], le premier ministre canadien [CAN.GetLeader] et le président mexicain [MEX.GetLeader]. Salué comme un objectif majeur de la politique étrangère des États-Unis, ce cadre ouvrira la voie aux futures négociations entre les trois gouvernements sur les détails du commerce, des douanes, des tarifs et d'autres sujets d'intérêt économique. Les partisans de l'ALENA se réjouissent en espérant des avantages économiques, tandis que ceux qui s'opposent au futur plan continuent de se plaindre de la perte d'emplois au profit des pays étrangers et de la complexité des réglementations commerciales."
 NAFTA.10.d: "Sans surprise, des sources internes issues des négociations de l'ALENA font état d'une détérioration rapide des négociations et des progrès entre les trois parties sur tout futur accord de libre-échange nord-américain. Les trois partis ; les États-Unis, le Canada et le Mexique semblent insatisfaits les uns des autres sur les détails concernant les douanes, les voyages transfrontaliers, la circulation des emplois et l'échange de l'élimination des droits de douane.\n\nEn particulier, le chapitre 11 proposé de l'ALENA permet aux entreprises de poursuivre n'importe lequel des trois pays pour obtenir une compensation lorsqu'ils violent le droit international ; particulièrement dénoncée par des groupes au Canada et aux États-Unis.\n\nLes membres de la délégation mexicaine s'inquiètent également beaucoup du fait que certains articles de la Constitution mexicaine traitant des terres autochtones et de la privatisation pourraient devoir être abrogés afin de parvenir à un accord.\n\nIl n'est pas prévu que les négociations se poursuivent, car chaque délégation se retire dans sa capitale pour consulter son gouvernement sur cette question."
 NAFTA.100.d: "Alors que de nombreux décideurs politiques aux États-Unis ont exprimé un grand soutien à l'idée du projet d'Association de libre-échange nord-américaine (ALENA). Cependant, le président [USA.GetLeader] a annoncé sa totale opposition à la proposition. Le président a cité les préoccupations des syndicats, en particulier les Travailleurs unis de l'automobile (UAW), ainsi que les problèmes potentiels en matière d'environnement et de droits de l'homme liés au Mexique.\n\nLes réactions à l'annonce ont été mitigées, les syndicats ont salué cette décision comme défendant les travailleurs américains, tandis que les groupes d'intérêt du monde des affaires et d'éminents politiciens et économistes pro-libre-échange ont critiqué cette décision comme une complicité envers les syndicats en échange de votes. Il convient également de noter que l'éminent milliardaire Ross Perot a également salué cette décision car elle défend les intérêts économiques américains et a mis fin aux spéculations sur une éventuelle candidature à l'élection présidentielle de 1992."

 AEFTA.1.d: "Aujourd'hui, lors d'une conférence de presse avec le secrétaire d'État et le secrétaire au Commerce, le président [USA.GetLeader] a annoncé le début de ce qui devrait durer des mois de négociations sur le libre-échange entre les États-Unis et les membres de l'Association européenne de libre-échange (AELE), qui comprend l'Autriche, la Finlande, l'Islande, la Norvège, la Suède et la Suisse. Considérée comme un pas supplémentaire vers les relations économiques avec l'Europe, une négociation réussie avec l'AELE entraînerait la suppression des barrières commerciales et des tarifs douaniers entre les pays membres qui ont entre eux des accords de libre-échange. Au niveau national, il semble que cette évolution bénéficie d'un large soutien parmi la plupart des Américains qui en sont conscients, la grande majorité étant généralement apathique quant aux implications futures."
 AEFTA.2.d: "Le Premier ministre [ICE.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Reykjavik, transmettant un message du président américain [USA.GetLeader]sur la possible formation ou l'expansion d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. L'Islande étant fière d'en être membre depuis 1970, il serait dans notre intérêt d'accepter l'offre américaine, d'autant plus que notre économie est largement liée à l'AELE et à la Communauté économique européenne. Cependant, certains membres de l'aile gauche de notre gouvernement estiment que nous ne devrions pas encore nous lier volontairement à la sphère d'influence américaine. Comment allons-nous réagir ?"
 AEFTA.3.d: "Nous avons reçu des informations du bureau du Premier ministre à Reykjavik et de l'ambassade d'Islande à Washington indiquant que le gouvernement islandais avait accepté nos offres initiales de négocier un accord de libre-échange américano-européen, avec la signature d'un cadre de base qui sera bientôt déterminé. Le Premier ministre islandais [ICE.GetLeader] s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs voeux pour les futures négociations autour de cet accord."
 AEFTA.4.d: "Malheureusement, l'ambassadeur d'Islande à Washington a fait savoir au Premier ministre islandais [ICE.GetLeader] à Reykjavik que le gouvernement islandais ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur américain à Reykjavik a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous rétablirons."
 AEFTA.5.d: "Le Premier ministre [NOR.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Oslo, transmettant un message du président américain [USA.GetLeader]sur la possible formation ou l'élargissement d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. En tant que fier membre fondateur de l'AELE et de l'OTAN, la Norvège entretient des relations particulièrement étroites avec l'Europe et les États-Unis et, n'ayant pas réussi à ratifier son adhésion à la Communauté économique européenne, elle est confrontée à une nouvelle direction à suivre dans le paysage économique émergent. Cependant, certains au sein de notre gouvernement mettent en garde contre un ancrage encore plus important dans le système économique américain et un éloignement encore plus important de l'Europe. Comment allons-nous réagir ?"
 AEFTA.6.d: "Nous avons reçu des informations du bureau du Premier ministre à Oslo et de l'ambassade de Norvège à Washington indiquant que le gouvernement norvégien avait accepté nos offres initiales de négocier un accord de libre-échange américano-européen, avec la signature d'un cadre de base qui sera bientôt déterminé. Le Premier ministre norvégien [NOR.GetLeader] s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs voeux pour les négociations futures autour de cet accord."
 AEFTA.7.d: "Malheureusement, l'ambassadeur de Norvège à Washington a fait savoir au Premier ministre norvégien [NOR.GetLeader] à Oslo que le gouvernement norvégien ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur américain à Oslo a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous rétablirons."
 AEFTA.8.d: "Le président du Conseil fédéral suisse a reçu une proposition de l'ambassadeur des États-Unis à Berne, lui transmettant un message du président américain [USA.GetLeader], concernant l'éventuelle formation ou l'élargissement d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. Même si la Suisse entretient généralement de bonnes relations avec les États-Unis, elle reste généralement en dehors de l'ordre international libéral normal, car elle n'est pas membre de l'ONU mais héberge le siège de nombreuses agences de l'ONU. La Suisse est membre fondateur de l'AELE, mais ses relations avec les autres pays européens et l'Occident ont été globalement bénéfiques, non sans quelques contretemps dus à notre politique de neutralité. Beaucoup au sein du gouvernement saluent ce nouvel accord proposé comme une nouvelle forme de développement économique, tandis que d'autres, plus traditionalistes, insistent sur le maintien d'un rôle dans des relations européennes justes et sur les dangers de s'attacher au système économique américain. Comment allons-nous réagir ?"
 AEFTA.9.d: "Nous avons reçu des informations de la Chancellerie fédérale à Berne et de l'ambassade de Suisse à Washington selon lesquelles le gouvernement suisse a accepté nos offres initiales de négocier un accord de libre-échange américano-européen, avec la signature d'un cadre de base qui sera bientôt déterminé. Plusieurs membres du Conseil fédéral suisse se sont entretenus par téléphone avec le président américain [USA.Get Leader] et lui ont exprimé leurs meilleurs voeux pour les négociations futures autour de cet accord."
 AEFTA.10.d: "Malheureusement, l'ambassadeur de Suisse à Washington a fait savoir depuis le Conseil fédéral suisse à Berne que le gouvernement suisse ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur américain à Berne a tenté en vain de modifier sa position sur la question. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous rétablirons."
 AEFTA.11.d: "Le Premier ministre [FIN.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Helsinki, transmettant un message du président américain [USA.GetLeader]sur la possible formation ou l'élargissement d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. La Finlande, étant un ajout relativement récent à l'AELE et au paysage européen dans son ensemble, en raison de sa situation géographique à côté de l'Union soviétique, a récemment exploré une politique d'orientation occidentale, mais certains hommes politiques indépendants et de gauche au sein de notre gouvernement ont exprimé leurs inquiétudes quant à l'expansion des liens avec les États-Unis ; notamment en raison de la proximité de l'Union soviétique ainsi que de la peur de l'asservissement économique. Comment allons-nous réagir ?"
 AEFTA.12.d: "Nous avons reçu des informations du bureau du Premier ministre à Helsinki et de l'ambassade de Finlande à Washington indiquant que le gouvernement finlandais avait accepté nos offres initiales de négocier un accord de libre-échange américano-européen, avec la signature d'un cadre de base qui sera bientôt déterminé. Le Premier ministre finlandais FIN.GetLeader] s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs voeux pour les négociations futures autour de cet accord."
 AEFTA.13.d: "Malheureusement, l'ambassadeur de Finlande à Washington a fait savoir au Premier ministre finlandais [FIN.GetLeader] à Helsinki que le gouvernement finlandais ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur américain à Helsinki a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous rétablirons."
 AEFTA.14.d: "La chancelière fédérale [AUS.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Vienne, transmettant un message du président américain [USA.GetLeader]concernant la possible formation ou l'élargissement d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. L'Autriche est restée globalement neutre, jouant en marge de la guerre froide, et est restée globalement pro-occidentale, étant occupée par les puissances occidentales dans les années d'après-guerre et frontalière de l'Allemagne de l'Ouest. Cependant, certains au sein du gouvernement protestent contre une éventuelle entrée dans un accord de libre-échange avec les États-Unis, soulignant l'importance de la neutralité dans cet environnement sécuritaire émergent. Comment allons-nous réagir ?"
 AEFTA.15.d: "Nous avons reçu des informations de la Chancellerie fédérale à Vienne et de l'ambassade d'Autriche à Washington selon lesquelles le gouvernement autrichien a accepté nos offres initiales de négocier un accord de libre-échange américano-européen, avec la signature d'un cadre de base qui sera bientôt déterminé. Le chancelier autrichien [AUS.GetLeader] s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs voeux pour les négociations futures autour de cet accord."
 AEFTA.16.d: "Malheureusement, l'ambassadeur d'Autriche à Washington a fait savoir au chancelier autrichien [AUS.GetLeader] à Vienne que le gouvernement autrichien ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur américain à Vienne a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous rétablirons."
 AEFTA.17.d: "Le Premier ministre [SWE.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Stockholm, transmettant un message du président américain [USA.GetLeader]sur la possible formation ou l'élargissement d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. Les relations entre la Suède et les États-Unis ont été tendues ces dernières années avec le déclenchement de la guerre du Vietnam, mais se sont progressivement réchauffées au cours des années 1980. Comme dans de nombreux autres pays nordiques, il existe au sein du gouvernement des éléments démographiques importants qui sont favorables à la conclusion de cet accord commercial, ou à la neutralité à cet égard et à une implication limitée dans les affaires occidentales. Comment allons-nous réagir ?"
 AEFTA.18.d: "Nous avons reçu des informations du bureau du Premier ministre à Stockholm et de l'ambassade de Suède à Washington selon lesquelles le gouvernement suédois a accepté nos offres initiales de négocier un accord de libre-échange américano-européen, avec la signature d'un cadre de base qui sera bientôt déterminé. Le Premier ministre suédois [SWE.GetLeader] s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs voeux pour les négociations futures autour de cet accord."
 AEFTA.19.d: "Malheureusement, l'ambassadeur de Suède à Washington a fait savoir au Premier ministre suédois [SWE.GetLeader] à Stockholm que le gouvernement suédois ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur américain à Stockholm a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous rétablirons."
 AEFTA.20.d: "Aujourd'hui, à Washington, les délégués de tous les pays membres de l'AELE ont signé l'Accord de libre-échange américano-européen. Largement célébré par le président américain [USA.GetLeader] comme une réalisation marquante du libre-échange entre les États-Unis et l'Europe, cela a suscité une certaine inquiétude et consternation de la part des membres européens de la CEE, ainsi que du bloc de l'Est dans son ensemble, qui craignent une influence occidentale et américaine continue en Europe."

 Robertson88.3.t: "[GetNewspaperHeader]Le président Robertson annonce la purge de la bureaucratie « libérale »"
 Robertson88.0.d: "Depuis l'investiture du président Pat Robertson le 20 janvier 1989, beaucoup a été fait en Amérique au cours de ces quatre années. D'une part, trois directions exécutives ; L'État, l'Éducation et l'Énergie ont été purgés ou dissous afin d'éliminer la « bureaucratie libérale » ; plusieurs lois importantes du Congrès ont fait l'objet d'un veto, notamment l'Americans With Disabilities Act, le Civil Rights Act de 1990 et un projet de loi de financement de la lutte contre le SIDA ; mais certaines ont été adoptées, comme l'interdiction de la pornographie, la Loi sur la portée excessive de la Cour fédérale, la Loi sur la modernisation de la défense et une proposition d'amendement au droit à la vie. Robertson a également réintroduit la prière dans les écoles publiques, tout en autorisant des bons pour les écoles religieuses privées. Dans le domaine de la défense, l'administration de Robertson a intensifié la guerre contre la drogue, adopté la loi antiterroriste sur les armes biologiques et intensifié la militarisation de la police. De nombreux experts et historiens considèrent désormais le mandat de Robertson comme l'ère de « l'Amérique morale », et l'avenir est incertain pour les États-Unis après ce président."
 Robertson88.1.d: "Dans une annonce sans précédent à la Maison Blanche aujourd'hui, le président Pat Robertson a annoncé la signature d'un décret prévoyant une « rationalisation efficace du Département d'État » en supprimant effectivement entre 40 et 50 % du personnel du département, y compris les membres du service extérieur américain, mais principalement le personnel bureaucratique basé à Washington ainsi que le personnel non essentiel à l'étranger.\n\nDécriée par les deux côtés comme une décision irresponsable de la politique étrangère américaine, en particulier pendant la période de tension de la guerre froide, l'administration du président Robertson est restée largement silencieuse sur les commentaires, à l'exception d'une déclaration dans laquelle Robertson a fait remarquer que « notre corps diplomatique est important, inefficace, inutile et pourri jusqu'à la moelle avec des libéraux, des communistes et d'autres sympathisants anti-américains qui cherchent à nous saper »."
 Robertson88.2.d: "Lors d'une conférence de presse aujourd'hui à la Maison Blanche, le président Pat Robertson a annoncé le soutien de son administration à un amendement « droit à la vie » à la Constitution des États-Unis. Constituant le coeur des propositions politiques pro-vie suite au résultat de l'affaire Roe contre Wade en 1973 et également connu sous le nom d'« Amendement sur la vie humaine », cet amendement codifierait la définition juridique de la vie humaine comme commençant dès la conception et interdirait explicitement l'avortement en vertu de la Constitution.\n\nFace aux critiques sévères et aux pressions des démocrates et des partisans du droit au choix, Robertson les a qualifiés de « tueurs de bébés communistes » et a exprimé son plein soutien au vote d'un amendement, qui devrait avoir lieu dans un avenir proche au Congrès."
 Robertson88.3.d: "Lors d'une cérémonie télévisée aujourd'hui depuis le Bureau ovale, le président Pat Robertson a signé un décret exigeant « un mécanisme d'efficacité immédiat au sein de la bureaucratie fédérale » en supprimant, dans les 30 jours, 45 % des emplois de bureau au sein du gouvernement fédéral, principalement à Washington D.C. et dans les succursales d'agences sélectionnées à travers les États-Unis.\n\nQualifié par les groupes libéraux de « purge » contre les institutions bureaucratiques nécessaires, telles que l'Internal Revenue Service et l'Environmental Protection Agency, les conservateurs et les partisans de Robertson saluent cela comme une étape majeure pour empêcher les excès du gouvernement et rationaliser les postes et fonctions nécessaires au sein du gouvernement fédéral. Cependant, près d'un million de chômeurs fédéraux ont tendance à ne pas être d'accord, alors qu'ils trouvent un nouvel emploi dans une Amérique post-Robertson."
 Robertson88.5.d: "DE : Bureau exécutif du président\nÀ : avocat de la Maison Blanche ; procureur général, ministère de la Justice des États-Unis ; Directeur, Bureau fédéral d'enquête\n\nOBJET : Lancement d'enquêtes sur les groupes féministes et libéraux\n\nÀ tous les concernés,\n\nLa menace des forces féministes, libérales, communistes, socialistes et anarchistes dans notre pays est particulièrement dangereuse, dans cette nouvelle ère d'une « Amérique morale » où la famille nucléaire américaine et ses valeurs chrétiennes traditionnelles risquent d'être exploitées.\n\nJ'ordonne à toutes les parties, mais en particulier au Federal Bureau of Investigation et à toutes les autres agences fédérales d'application de la loi et de renseignement, d'entamer des enquêtes et une surveillance approfondies sur les groupes suivants :\n\nUnion américaine des libertés civiles (ACLU)\nOrganisation nationale pour les femmes (MAINTENANT)\nLigue des électrices (LWV)\nCentre de droit de la pauvreté du Sud (SPLC)\nMaison de la Liberté\nOrganisation Socialiste Internationale (ISO)\nComité National Démocratique (DNC)\n\n Une surveillance et des enquêtes secrètes doivent être menées sur ces organisations et tous les documents, enregistrements et autres médias sont par la présente classés en vertu de la loi sur l'espionnage et resteront sous la garde du ministère de la Justice et de toutes les agences fédérales compétentes.\n\nSIGNÉ\nPrésident Pat Robertson"
 Robertson88.6.d: "Des rapports récents émanant de personnalités des principaux mouvements féministes américains, notamment de l'Organisation nationale des femmes et de la Ligue des électrices, révèlent d'énormes problèmes internes et de cohésion. Une présence légèrement plus importante des forces de l'ordre autour des réunions du NOW et du LWV, en particulier celles des membres de haut niveau, a été notée par certains membres et responsables au sein des organisations ; et certains membres du personnel de maintenance ont remarqué de légers dommages aux cadres de fenêtres, aux systèmes informatiques et aux téléphones dans les bureaux nationaux. On ne sait pas exactement ce qui cause ces divisions et ces problèmes, mais quelque chose de très suspect se produit dans le mouvement féministe."
 Robertson88.7.d: "Aux dernières nouvelles d'aujourd'hui, une fuite soudaine d'un employé du ministère de la Justice auprès du procureur général a révélé une campagne gouvernementale d'espionnage contre des organisations féministes et libérales aux États-Unis. Approuvé par le président Robertson et dirigé par le FBI et le ministère de la Justice, un mémo divulgué discutait de « la menace des forces féministes, libérales, communistes, socialistes et anarchistes dans notre pays » et précisait la surveillance et le contrôle d'organisations telles que l'Organisation nationale pour les femmes (NOW) et la Convention nationale démocrate. Publiée initialement dans le New York Times, d'autres grands journaux nationaux et internationaux ont repris cette histoire, dans un silence de mort de la Maison Blanche ou du ministère de la Justice."
 Robertson88.8.d: "Quelques jours après les premières allégations d'espionnage gouvernemental contre des organisations libérales et féministes aux États-Unis, de nouvelles questions ont été soulevées quant à ce que savait réellement le président Pat Robertson concernant les détails de l'opération. Le mémo initial divulgué était signé par lui, confirmant l'autorisation présidentielle pour l'espionnage, mais de nombreux conservateurs et partisans continuent de se demander si Robertson en était réellement informé ou si cette campagne était une décision unilatérale du procureur général et du directeur du FBI. Pour l'instant, rien n'a été révélé, mais la cote de popularité du président a chuté cette semaine de 5 points, reflétant la nette déception du peuple américain face à cette nouvelle."

 Reagan_VRA.1.d: "Dans une annonce inattendue aujourd'hui, le président Ronald Reagan a appelé à autoriser l'expiration de la loi sur les droits de vote de 1965. Pièce législative monumentale importante pour le mouvement des droits civiques dans les années 1960 et interdisant l'utilisation de « tests ou dispositifs » pour contrôler qui vote, la loi a été réautorisée en 1975 et devrait expirer à nouveau cette année en 1982. L'administration de Reagan est restée largement silencieuse sur cette question jusqu'à présent, mais la présence d'amendements à la VRA à la Chambre a attiré l'attention de la Maison Blanche. Il est clair que la plupart des groupes de défense des droits civiques, notamment la NAACP et la Leadership Conference on Civil Rights, émettront des condamnations, mais la plupart des experts conviennent que cette saga ne fait que commencer."
 Reagan_VRA.2.d: "Suite à l'annonce de la Maison Blanche selon laquelle l'administration Reagan ne soutenait pas une réautorisation du Voting Rights Act de 1965, la réaction du public a été importante, avec des condamnations de la part du Comité national démocrate, de l'Association nationale pour l'avancement des personnes de couleur, de l'Union américaine des libertés civiles, de la Ligue des électrices et de l'Organisation nationale des femmes, ainsi que de nombreuses autres organisations de défense des droits civiques. Aucun commentaire n'a encore été obtenu de la part de la Maison Blanche, qui, après l'annonce de Reagan, reste plutôt silencieuse, demandant aux journalistes d'adresser leurs questions à la Colline. Cependant, de nombreux responsables proches du président ont des idées et des opinions divergentes sur ce qui devrait se passer, certains estimant que la réautorisation devrait faire l'objet d'un veto, tandis que d'autres exhortent le président à signer et à céder à la pression politique du Congrès. Comment Reagan va-t-il choisir ?"
 Reagan_VRA.3.d: "Dans un geste inattendu aujourd'hui de la part de la Maison Blanche, le président Ronald Reagan a renoncé à son combat pour faire tomber le Voting Rights Act de 1965, signant plutôt une nouvelle autorisation pour 10 ans supplémentaires. Vraisemblablement sous la forte pression publique des organisations de défense des droits civiques et des droits de vote, Reagan a accédé à leur volonté et à celle du Congrès en signant la réautorisation de la VRA."
 Reagan_VRA.4.d: "Ignorant la volonté du public et sans surprise pour la plupart des experts politiques, le président Ronald Reagan a poursuivi sa croisade contre le Voting Rights Act de 1965 en opposant son veto au projet de loi de réautorisation de dix ans et aux amendements qui lui ont été présentés. Suscitant encore davantage de condamnations de la part des organisations de défense des droits civiques et du droit de vote, Reagan fait face à une pression écrasante, non seulement de la part du public mais aussi de la part des membres du Congrès et de ceux de son propre parti, qui, malgré leurs idéologies politiques différentes, souhaitent que la loi sur le droit de vote soit maintenue."
 Reagan_VRA.5.d: "En réponse au veto du président Reagan sur la réautorisation de la loi sur les droits de vote de 1965, le Congrès a lancé une dérogation au veto conformément à l'article I, section VII de la Constitution, dans le but de faire de la loi de réautorisation une loi sans passer par la Maison Blanche. Il est trop tôt pour déterminer les marges de vote définitives, mais avec suffisamment de soutien, la VRA pourrait survivre un autre jour."
 Reagan_VRA.6.d: "Il semble qu'après un vote final au Sénat américain, la loi réautorisant le Voting Rights Act de 1965 à prolonger ses dispositions pour 10 ans supplémentaires a été adoptée avec plus des 2/3 des voix des deux chambres du Congrès. Après le veto initial du président Ronald Reagan sur le projet de loi, celui-ci est revenu sur la Colline où son veto a été annulé par le Congrès. Combiné avec un tollé général important à l'égard de la Maison Blanche, cela sert d'avertissement à l'administration Reagan selon laquelle les autres branches du gouvernement ne doivent pas être gênées."
 Reagan_VRA.7.d: "Malheureusement, une tentative de contournement du veto sur une réautorisation de la loi sur les droits de vote de 1965 a échoué aujourd'hui au Congrès, obtenant moins que la majorité des 2/3 requise. Suite au veto rapide du président Ronald Reagan sur le projet de loi, le Congrès a tenté de réagir en l'adoptant quand même, mais n'a pas obtenu les votes requis. Le tollé général a été généralisé, visant à la fois la Maison Blanche et le Capitole, car plusieurs branches du gouvernement ont été accusées de la mort certaine du Voting Rights Act, dont les dispositions expirent dans quelques mois."

 Gingrich88.1.d: "Dans une déclaration officielle de la Maison Blanche aujourd'hui, le président Newt Gingrich a annoncé une proposition d'amendement à la Constitution américaine qui imposerait une limitation du nombre de mandats au Congrès. Ancien représentant républicain du 3e district de Géorgie à la Chambre des représentants, l'influence de Gingrich sur Capitol Hill est toujours importante malgré le transfert de son bureau à la Maison Blanche. Par la suite, des rapports de la Colline confirment qu'une résolution de la Chambre a été présentée, fixant spécifiquement la limite des mandats à deux mandats pour les membres du Sénat et à six mandats pour les membres de la Chambre, tous deux totalisant douze années de service maximum. Le mouvement de « limitation du mandat » aux États-Unis est relativement nouveau, et comme cet amendement doit être adopté lors d'une session conjointe du Congrès, il n'est pas clair si de nombreux sénateurs et représentants élus seraient en faveur de cet amendement, car il pourrait entraîner la perte de leurs fonctions pour certains d'entre eux. Les premiers sondages auprès du public suggèrent cependant que de nombreux Américains moyens sont satisfaits de cette annonce."
 Gingrich88.2.d: "Dans une annonce sans précédent à la Maison Blanche aujourd'hui, le président Newt Gingrich a annoncé la signature d'un décret prévoyant une « rationalisation efficace du Département d'État » en supprimant effectivement entre 40 et 50 % du personnel du département, y compris les membres du service extérieur américain, mais principalement le personnel bureaucratique basé à Washington ainsi que le personnel non essentiel à l'étranger.\n\nDécriée par les deux camps comme une décision irresponsable de la politique étrangère américaine, en particulier pendant la période de tension de la guerre froide, l'administration du président Gingrich est restée largement silencieuse sur ses commentaires. On sait que le président, surtout lorsqu'il était au Congrès, n'aimait pas la politique étrangère en général, mais les experts en sont généralement surpris, ainsi que les milliers d'employés du gouvernement fédéral à qui on a annoncé aujourd'hui qu'ils seraient licenciés."
 Gingrich88.3.d: "Dans une déclaration officielle de la Maison Blanche aujourd'hui, le président Newt Gingrich a annoncé une proposition d'amendement à la constitution américaine qui abolirait le collège électoral. Simultanément présenté à la Chambre des représentants des États-Unis, l'amendement de Gingrich appelle à l'utilisation d'un plan similaire à celui de la France, dans lequel le seuil requis pour remporter la présidence est de 40 % du vote populaire et si aucun candidat n'est en mesure de remporter 40 %, un second tour aurait lieu. Cela modifierait radicalement la structure et le fonctionnement du système politique américain, d'autant plus qu'il permet à plus de deux partis de s'affronter lors d'une élection. Un amendement similaire avait été proposé lors de la session 1969-1970 du Congrès, mais avait été rejeté par les États du Sud qui craignaient que leur influence ne soit retirée. On ne sait pas vraiment si cette attitude a changé au sein du Congrès, mais les premiers sondages auprès du public révèlent des sentiments mitigés, la plupart soutenant l'idée."
 Gingrich88.4.d: "Une proposition inhabituelle a été présentée aujourd'hui à la Maison Blanche alors que le président Newt Gingrich révèle une nouvelle arme dans sa lutte contre le crime : les miroirs orbitaux. Avec l'aide plutôt timide du Bureau de la politique scientifique et technologique et de l'administrateur de la NASA, Gingrich a publié une proposition décrivant le déploiement de milliers de miroirs en orbite, conçus pour être manoeuvrés pour exploiter les sources de lumière du Soleil, afin de fournir une lumière ambiante au-dessus des villes américaines la nuit. En approfondissant ce sujet, la proposition de Gingrich avance l'argument selon lequel moins de crimes seraient commis si les zones métropolitaines et les autoroutes étaient constamment éclairées. Les médias et le grand public se sont emparés de cet exemple supplémentaire de dépenses irresponsables, et ce sera certainement un sujet de réflexion pour les prochaines semaines. Dans un communiqué officiel, la Maison Blanche ne plaisante pas, affirmant qu'avec l'approbation du Congrès, elle espère faire avancer ce plan avec toute sa force."

 Kemp88.1.d: "Aujourd'hui, lors d'une conférence de presse à la Maison Blanche, le président Jack Kemp a appelé à un amendement à la Constitution américaine exigeant que le budget fédéral soit équilibré. Ancien membre de la Chambre des représentants pour le district de Buffalo et de ses environs, Kemp a souligné à plusieurs reprises sa politique fiscale, en particulier lors de sa campagne, et, grâce à son influence parmi les républicains à la Chambre, il semble avoir une certaine chance que cet amendement se concrétise. La réaction du public à cette annonce a été généralement positive, des organisations telles que l'Union nationale des contribuables soutenant la proposition de Kemp. Il n'est toutefois pas clair si et quand une résolution d'amendement sera présentée au Congrès, mais sous la pression de la Maison Blanche, cela pourrait être très bientôt."
 Kemp88.2.d: "Aujourd'hui, depuis le Bureau Ovale, flanqué de ses secrétaires d'État et du Commerce, le président Jack Kemp a annoncé aux journalistes son intention d'établir une zone de libre-échange dans le Pacifique, composée des États-Unis et de sept autres pays, dont le Japon, la Corée du Sud, l'Australie et la Nouvelle-Zélande. Bien que jamais réalisé auparavant, il s'agit d'une évolution sans précédent, en particulier dans le contexte d'une croissance économique croissante en Asie. L'opinion publique sur la question est mitigée, la plupart des Américains moyens restant généralement apathiques sur le sujet, la plus grande préoccupation étant l'offre d'emplois et de produits. De nombreux internationalistes libéraux, en particulier ceux de la région Asie-Pacifique, accueillent cette évolution comme un nouveau pas dans la bonne direction pour le commerce extérieur et le développement économique."
 Kemp88.3.d: "Kemp était assis dans le bureau ovale, feuilletant ses briefings quotidiens, lorsque son secrétaire d'État, Benjamin Gilman, est intervenu. Autre ancien membre de la Chambre de New York et membre de longue date de la commission des affaires étrangères de la Chambre, Gilman était un excellent choix pour le poste de secrétaire d'État, ayant travaillé aux Nations Unies et ayant participé aux efforts visant à libérer les prisonniers de guerre américains à l'étranger.\n\nJetant deux dossiers en papier cartonné sur le bureau Resolute, Gilman serra la main de Kemp, lui demandant comment allait la Première Dame Joanne Kemp. En baissant les yeux, Kemp vit les dossiers, leva les yeux et demanda : « Qu'est-ce que c'est, Ben ?\n\n \"Monsieur, ce sont des propositions de libre-échange avec l'Europe, soit avec la CEE, soit avec l'AELE. Le secrétaire au Commerce et le représentant américain au Commerce ont également inclus leurs opinions.\"\n\n \"Excellent. Parlons-en. Quels sont les coûts et les avantages ?\"\n\n « Eh bien, monsieur, travailler avec la Communauté économique européenne serait l'option la plus évidente, car cela ouvrirait le commerce avec l'Allemagne, la France, le Royaume-Uni et l'Europe du Sud, mais cela ferait face à beaucoup de pression et d'opposition de la part des groupes de gauche au sein des gouvernements qui considèrent nos politiques commerciales comme un impérialisme économique supplémentaire. »\n\nLes deux hommes se moquèrent presque simultanément. Gilman a continué.\n\n \"Cependant, nous pourrions nous tourner vers les outsiders. L'Association européenne de libre-échange est composée de pays européens plus neutres, dont les pays nordiques et la Suisse, qui ont des pratiques commerciales plus libérales. Nous pourrions exploiter des marchés plus petits et les soutenir, avec la promesse implicite qu'ils auraient un meilleur accès aux produits américains que le reste de la CEE.\"\n\nKemp s'appuya contre le dossier de sa chaise, réfléchissant. \"Ben, je vais être honnête avec toi, c'est une décision difficile, mais je pense que nous devons y aller..."
 Kemp88.4.d: "L'attaché de presse de la Maison Blanche ainsi que le porte-parole du Département d'État ont confirmé aujourd'hui que l'administration Kemp, en coopération avec les départements d'État, du Commerce et le représentant américain au Commerce, avait l'intention d'entamer des négociations avec la Communauté économique européenne, ou CEE, sur un accord de libre-échange. Initialement connu sous le nom d'accord de libre-échange entre les États-Unis et la CEE, cet accord proposé éliminerait toutes les restrictions commerciales entre les États-Unis et les membres de la CEE, y compris les puissances de l'Allemagne de l'Ouest, de la France, du Royaume-Uni, de l'Italie et des pays du Benelux. Lorsqu'on lui a demandé une déclaration, le bureau du président de la Commission européenne, Jacques Delors, a donné une réponse positive, indiquant sa volonté d'entamer des négociations malgré les pressions intérieures des partis de gauche dans certains pays membres. L'opinion publique américaine est élevée, la plupart des experts en politique étrangère qualifiant cela de développement significatif dans les affaires américano-européennes modernes."
 Kemp88.5.d: "L'attaché de presse de la Maison Blanche ainsi que le porte-parole du Département d'État ont confirmé aujourd'hui que l'administration Kemp, en coopération avec les départements d'État, du Commerce et le représentant américain au Commerce, avait l'intention d'entamer des négociations avec l'Association européenne de libre-échange, ou AELE, sur un accord de libre-échange. Initialement connu sous le nom d'accord de libre-échange entre les États-Unis et l'AELE, cet accord proposé éliminerait toutes les restrictions commerciales entre les États-Unis et les membres de l'AELE, y compris de nombreux pays neutres comme la Suisse et l'Autriche, ainsi que de nombreux pays nordiques comme la Suède. Lorsqu'on lui a demandé une déclaration, le secrétaire général de l'AELE, Georg Reisch, a répondu positivement, indiquant sa surprise mais une certaine volonté de poursuivre les négociations, malgré la neutralité annoncée de nombreux membres de l'AELE. L'opinion publique américaine est mitigée, nombreux sont ceux qui se demandent pourquoi le président a choisi des pays européens plus petits plutôt que la CEE, plus puissante. De nombreux experts en politique étrangère voient cependant encore de grands avantages dans ces négociations et dans l'avenir du libre-échange américain à venir."

 Dole84.2.t: "L'Amérique a reconnu le soi-disant « génocide arménien »"  

 Nuclear_Freeze.0.d: "Aujourd'hui, les États-Unis ont annoncé qu'ils s'engageraient à geler toute production, essai et déploiement d'armes nucléaires. Cela a surpris nombre de nos analystes, qui s'attendaient presque tous à ce que les États-Unis s'en tiennent au déploiement nucléaire en tant qu'élément clé de leurs forces armées. Il existe désormais une pression internationale importante sur nous pour que nous prenions le même engagement, sous prétexte que cela réduirait les tensions entre nos nations et pourrait éventuellement instaurer un monde de coexistence pacifique. Cependant, certains de nos conseillers les plus radicaux sont méfiants, doutant de l'engagement total des États-Unis en faveur d'un gel nucléaire, soulignant que les États-Unis pourraient encore disposer d'un seul sous-marin chargé de suffisamment de missiles pour détruire toutes nos grandes villes."
 Nuclear_Freeze.1.d: "Aujourd'hui, le président [USA.GetLeader] a annoncé que les États-Unis s'étaient engagés à geler tous leurs essais, leur production et leur déploiement d'armes nucléaires. Cette annonce a surpris de nombreuses personnes dans le pays et apparemment même le Kremlin lui-même, car les États-Unis se retrouveraient désormais dans une situation stratégique désavantageuse par rapport à l'Union soviétique. Les conservateurs et de nombreux politiciens bellicistes ont critiqué cette annonce, la qualifiant de préjudiciable à la sécurité nationale. Certains membres opposants au Congrès se sont également engagés à adopter un projet de loi exigeant le déploiement d'armes nucléaires sur le sol américain. Le président a également déclaré qu'il espérait que l'Union soviétique s'alignerait également sur l'offre américaine, qualifiant cela de grande chance de mettre de côté notre peur mutuelle et notre méfiance les uns envers les autres, tout en rendant le monde plus sûr"
 Nuclear_Freeze.2.d: "Le Kremlin nous a annoncé que l'Union soviétique avait accepté un gel nucléaire, comme le nôtre. Une grande partie du pays se réjouit de cette annonce, un nombre record d'Américains interrogés déclarant qu'ils estiment que le risque de guerre nucléaire est inexistant ou faible. La communauté internationale a également réagi positivement, reconnaissant nos deux nations pour avoir rendu le monde plus sûr. Alors que la plupart des membres de notre cabinet sont satisfaits de la situation actuelle, le conseiller à la sécurité nationale [GetCurrentNatSecAdv] a proposé d'armer un ou deux sous-marins individuels avec des ogives nucléaires, pour agir comme moyen de dissuasion d'urgence en cas de première frappe surprise soviétique. Bien que cette politique ne soit pas active actuellement, nous avons établi un ensemble de conditions qui permettraient de lancer un réarmement limité si la situation l'exigeait."
 Nuclear_Freeze.3.d: "Le Kremlin n'a pas respecté son engagement en faveur d'un gel nucléaire, ce qui laisse notre action actuelle paraître faible aux yeux du Congrès. Des appels ont déjà été lancés en faveur d'un déploiement d'armes nucléaires mandaté par le Congrès, et la majorité du pays s'inquiète actuellement de la vulnérabilité des États-Unis face à une première frappe soviétique. Même si nous ne pensons pas que nous devrions abandonner cette politique, le ministère de la Défense a produit une nouvelle directive sur les conditions, stipulant que tout cas où les forces armées américaines seraient placées sur DEFCON 3 ou inférieur devrait entraîner un réarmement nucléaire limité dans les zones touchées. Malheureusement, un monde sans nucléaire semble encore au-delà de nos horizons. "
 Nuclear_Freeze.5.d: "Aujourd'hui, le Kremlin a annoncé qu'il allait déclarer l'arrêt de tout déploiement, essai et production d'armes nucléaires, ce qui correspond à l'annonce précédente faite par le président américain il y a [USA.GetLeader] semaines. Les Nations Unies ont félicité les deux pays pour leur rapprochement sur cette question importante, le Secrétaire général déclarant qu'un nouvel ordre mondial pacifique se profilait à l'horizon. Le Bulletin of the Atomic Scientist a également annoncé leur soutien aux actions des deux pays, annonçant que l'horloge de la fin du monde sera réglée à minuit moins 25 minutes, le plus loin de l'anéantissement total depuis la création de l'agence en 1947. Les États-Unis ont également été plutôt réceptifs à la nouvelle, le président [USA.GetLeader] remerciant le secrétaire général soviétique et déclarant qu'un nouvel avenir non nucléaire est en ligne de mire"
 Nuclear_Freeze.6.d: "Aujourd'hui, le Kremlin a annoncé qu'il ne s'engagerait pas à geler le déploiement, les essais et la production de missiles nucléaires. Le secrétaire général soviétique a condamné la proposition comme étant irrationnelle et laissant l'Union soviétique sans défense contre une première frappe secrète des États-Unis. Le président [USA.GetLeader] a exprimé sa déception face à l'annonce du Kremlin, affirmant que les Soviétiques manquaient une excellente opportunité de paix dans ce nouvel ordre mondial. Le secrétaire à la Défense [GetCurrentSecDef] a également déclaré aujourd'hui que les États-Unis pourraient devoir réévaluer leur position actuelle, en raison du rejet du gel par l'URSS. De nombreux membres du Congrès ont critiqué le président, affirmant que si les États-Unis ne revenaient pas sur leur politique actuelle, le président exposerait des millions d'Américains au risque d'anéantissement nucléaire."
 Nuclear_Freeze.10.d: "Le président Askew a annoncé aujourd'hui son projet de redéploiement des armes nucléaires et sa demande au Congrès d'autoriser le financement d'une nouvelle classe d'armes nucléaires pour remplacer notre arsenal vieillissant. Le président dit qu'il a pris sa décision sur le conseil des chefs d'état-major, de son secrétaire à la Défense et du directeur de la CIA Anthony Lake, qui pensaient que les Soviétiques restaient toujours une menace puissante pour nous et que le réarmement nucléaire ramènerait la couverture de sécurité de l'Amérique. Certains libéraux ont condamné aujourd'hui le président Askew, affirmant qu'il est un fauteur de guerre et qu'il ruine des années de travail visant à dénucléariser la nation. La plupart des politiciens et membres du Congrès conservateurs se sont prononcés en faveur d'Askew, affirmant qu'il restaure un élément clé de la défense de notre nation et que ces nouvelles armes nucléaires nous donneront un net avantage sur les Soviétiques. Le Kremlin a condamné la déclaration du président, affirmant qu'il s'agit d'une action provocatrice qui ne fera que nuire aux espoirs de paix mondiale des deux nations. Les Nations Unies et l'Atomic Bulletin of Scientists ont condamné cette mesure, affirmant que le président Askew laisse la peur irrationnelle ramener le monde au bord de l'anéantissement nucléaire."
 Nuclear_Freeze.11.d: "Aujourd'hui, nous avons appris que les États-Unis ont levé le gel nucléaire que nos deux pays s'étaient engagés à suivre et qu'ils ont commencé à redéployer leurs armes nucléaires dans le monde entier. La plupart des membres du parti sont totalement indignés par la trahison américaine et nous ont appelé à laisser nos propres obligations à cet engagement et à commencer nos propres tests et déploiements. Lorsque nous avons insisté auprès de l'ambassadeur américain au sujet du réarmement, il a affirmé que les Soviétiques eux-mêmes avaient trompé leur engagement et que l'Amérique avait besoin d'armes nucléaires pour sa propre protection. Même si le maintien du gel nous placerait dans une position clairement désavantageuse si les États-Unis devaient frapper les premiers, un nouvel engagement en faveur du gel nous donnerait une victoire morale et internationale majeure sur les États-Unis, ce qui pourrait provoquer des frictions au sein de l'OTAN et d'autres alliances américaines."
 Nuclear_Freeze.12.d: "Aujourd'hui, l'URSS a annoncé qu'elle lèverait le gel actuel de tous les essais, de la production et du déploiement d'armes nucléaires, après que le président américain [USA.GetLeader] a annoncé le redéploiement de l'arsenal nucléaire américain. L'Atomic Bulletin of Scientists a annoncé sa déception à l'égard des deux nations, affirmant que les deux dirigeants avaient laissé la méfiance et la peur ruiner la paix dans le nouveau monde. De nombreux membres du Congrès ont imputé la responsabilité des nouvelles tensions qui ont embrasé les deux pays lorsque le président a levé notre propre gel nucléaire quelques semaines plus tôt. La Maison Blanche a répondu à ces accusations en affirmant que les Soviétiques déployaient déjà secrètement des missiles à tête nucléaire dans leurs sous-marins et certains silos IRBM."
 Nuclear_Freeze.13.d: "L'Union soviétique a surpris le monde aujourd'hui en poursuivant le gel actuel des essais, de la production et du déploiement nucléaires, après que les États-Unis ont choisi de reprendre les essais nucléaires et de réapprovisionner leurs silos et leurs sous-marins en ogives nucléaires. La Maison Blanche n'a fait aucun commentaire sur la poursuite de cette politique par l'URSS, affirmant que la politique nucléaire de l'Union soviétique la regardait. Les Nations Unies et l'Atomic Bulletin of Scientists ont applaudi la politique de l'Union soviétique et ont exigé que les États-Unis reviennent au gel de leur réarmement actuel. Les stratèges militaires de groupes de réflexion tels que RAND sont perplexes face à cette décision, car elle laisse les Soviétiques dans une situation militaire clairement désavantageuse si les États-Unis tentaient une première frappe. Quelles que soient les raisons du Kremlin, le vent du soutien international souffle avec lui, alors que les condamnations de la renucléarisation américaine commencent à s'accentuer."

