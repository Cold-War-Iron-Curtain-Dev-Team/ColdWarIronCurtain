 Dem_1980_Primary.1.d: "À la grande joie de nombreux démocrates, le sénateur Ted Kennedy a annoncé qu'il défierait le président Jimmy Carter lors des primaires démocrates pour représenter le parti aux prochaines élections présidentielles. La décision de contester le président sortant a certainement peu d'équivalents dans l'histoire politique américaine. Le sénateur a pris cette décision après avoir consulté sa famille. Les analystes notent que Kennedy pense que son héritage familial et son mystère l'emporteront de manière décisive sur l'avantage actuel du président Carter. Une source proche de Kennedy a souligné que le sénateur n'avait aucune confiance dans la manière dont le président Carter gouvernait, soulignant sa faible cote de popularité."
 Dem_1980_Primary.2.d: "Le sénateur Ted Kennedy et ses principaux conseillers discutent de la manière d'approcher les médias. Tous reconnaissent qu'il sera difficile de vaincre le président sortant. Le premier défi est une interview à venir avec le journaliste politique respecté de CBS, Ted Mudd. L'entretien aura lieu trois jours avant la candidature. Tous conviennent que le sénateur doit continuer à susciter l'anticipation afin de maximiser l'enthousiasme des démocrates avant l'annonce officielle. Le sénateur et les principaux membres du personnel sont enclins à utiliser l'interview comme un moyen de taquiner l'électorat, préparant ainsi la nation à l'annonce officielle. Cependant, d'autres conseillers suggèrent que le sénateur profite de l'entretien pour exposer son programme et son point de vue, afin de démontrer l'esprit de décision présidentiel. Cependant, cela pourrait affaiblir l'impact historique de l'annonce officielle. Après d'intenses discussions, une décision a été prise..."
 Dem_1980_Primary.3.d: "L'interview du sénateur Ted Kennedy par le journaliste respecté de CBS, Ted Mudd, s'est avérée un désastre pour le candidat à la présidentielle. Lorsque le journaliste a insisté auprès du sénateur pour lui expliquer pourquoi il souhaitait devenir président, Ted Kennedy a semblé mal à l'aise et répétitif. Le sénateur n'a pas non plus semblé préparé lorsqu'on l'a interrogé sur le fameux incident de Chappaquiddick. Les critiques ont noté que le sénateur Kennedy avait répondu aux questions de manière plutôt vague. Les sondages réalisés après l'interview montrent une forte baisse de popularité du sénateur, car de nombreux Américains ne le reconnaissent pas comme un véritable héritier de la mystique Kennedy. En privé, les conseillers du sénateur admettent que l'entretien ne s'est pas déroulé comme prévu et que les efforts visant à utiliser l'entretien pour susciter l'anticipation de l'annonce officielle n'ont pas été traduits auprès du public."
 Dem_1980_Primary.4.d: "L'interview du sénateur Ted Kennedy par le journaliste respecté de CBS, Ted Mudd, s'est soldée par un succès retentissant pour le candidat à la présidentielle. Lorsque le journaliste a insisté sur les raisons pour lesquelles il souhaitait devenir président, Ted Kennedy a fait preuve de détermination, exposant ses critiques à l'égard du président Carter et ses propres qualifications pour la plus haute fonction du pays. Malgré quelques difficultés lorsqu'on les interroge sur le fameux incident de Chappaquiddick, les critiques notent que Kennedy parle comme un Kennedy. Les sondages réalisés après l'interview montrent un coup de pouce en faveur du sénateur et les analystes estiment que le président Jimmy Carter fait face à une campagne primaire intimidante. L'annonce officielle du sénateur Kennedy devrait avoir lieu dans les prochains jours."
 Dem_1980_Primary.5.d: "Le président Jimmy Carter a lancé la campagne des primaires démocrates de 1980 avec une victoire éclatante dans les caucus de l'Iowa. Cette victoire est un coup dur pour le sénateur Ted Kennedy, qui fait face à la lourde tâche de vaincre un président en exercice. Les analystes notent que la victoire donne au président une légitimité et un élan avant la prochaine série de primaires. Les analystes notent que le sénateur Kennedy a eu du mal à captiver l'imagination des électeurs démocrates, en raison de son apparence terne. De nombreux démocrates de l'establishment se sont également montrés enclins à soutenir le président Carter, estimant que le parti ne peut pas perdre l'avantage du président sortant. Malgré ce revers, le sénateur Kennedy est resté provocant, affirmant que sa campagne ne ferait que se renforcer dans les semaines à venir. Il est clair que les deux camps continueront à mener une campagne agressive l'un contre l'autre."
 Dem_1980_Primary.6.d: "Le sénateur Ted Kennedy a été annoncé vainqueur des caucus de l'Iowa, démarrant la campagne des primaires démocrates par une victoire d'ouverture. La défaite du président Carter ébranlera son soutien, en particulier parmi les démocrates de l'establishment, car son statut de titulaire n'a pas réussi à contrer le défi du fougueux sénateur du Massachusetts. Le président Jimmy Carter n'a pas exprimé d'inquiétude, soulignant que la compétition était serrée et confiant qu'en fin de compte, le peuple américain se rallierait à lui. Le sénateur Kennedy, en liesse, a remercié ses partisans, promettant d'utiliser l'élan acquis dans l'Iowa pour remporter une victoire historique. Il est clair que les deux camps continueront à mener une campagne agressive l'un contre l'autre."
 Dem_1980_Primary.7.d: "Le président Jimmy Carter a remporté la primaire du New Hampshire. Le président, en liesse, a déclaré que le résultat était une indication claire de son mandat. Les analystes notent que la victoire augmentera le soutien au président parmi les démocrates de l'establishment, car la victoire s'est produite en Nouvelle-Angleterre, la base principale de la dynastie Kennedy. Le challenger, le sénateur Ted Kennedy, est resté confiant, constatant que les résultats étaient serrés et il a promis de ne pas abandonner le combat. Quoi qu'il en soit, la campagne des primaires démocrates continuera d'être une compétition âpre et âprement disputée d'un État à l'autre."
 Dem_1980_Primary.8.d: "Le sénateur Ted Kennedy a remporté la primaire du New Hampshire. Le sénateur est apparu aux anges en remerciant abondamment son personnel et ses partisans. Il a continué en soulignant que le peuple américain était sur la voie d'un changement historique visant à restaurer la confiance dans le Parti démocrate. Le président Jimmy Carter est resté calme et confiant, déclarant que la campagne primaire venait tout juste de commencer et qu'une fois que tous les démocrates auraient été entendus, les résultats seraient en sa faveur. Malgré la confiance du public, des proches du président ont exprimé leur inquiétude quant au fait que ce revers pourrait affaiblir le soutien des démocrates de l'establishment, dont le soutien sera crucial."
 Dem_1980_Primary.9.d: "Alors que les dirigeants et les délégués du Parti démocrate arriveront à New York pour la Convention nationale démocrate, les yeux de la nation seront rivés sur eux. La convention devrait être contestée avec le président sortant Jimmy Carter et le sénateur challenger Ted Kennedy se battant pour l'investiture présidentielle. Le sénateur Kennedy a lancé une campagne agressive au cours de la saison primaire, conduisant à une campagne acharnée entre lui et le président Carter. De nombreux dirigeants démocrates seraient déçus par cette campagne âpre, beaucoup estimant qu'elle a érodé le capital politique des deux candidats potentiels. Alors que la convention commence, les partisans des deux candidats s'entretiendront avec les délégués et les personnes influentes pour garantir la nomination."
 Dem_1980_Primary.10.d: "Les nouvelles du Madison Square Garden confirment que le président Jimmy Carter a remporté la nomination du Parti démocrate à la présidence des États-Unis. Cela met fin à une campagne primaire difficile au cours de laquelle le président sortant a dû faire face à un défi fougueux de la part du sénateur Ted Kennedy. On ne sait pas encore si le sénateur a félicité le président. Les dirigeants du Parti démocrate espèrent désormais que le parti pourra se rallier derrière le président Carter alors qu'ils attendent avec impatience ce qui sera sans aucun doute une campagne âpre contre le candidat républicain. Le président a remercié les délégués et a exhorté les partisans du parti à se rassembler désormais."
 Dem_1980_Primary.11.d: "Le sénateur Ted Kennedy a prononcé son discours de concession devant la Convention nationale démocrate au Madison Square Garden. Il est perçu comme le plus grand discours de sa carrière. Kennedy a défendu sans vergogne et nostalgique le libéralisme et les programmes gouvernementaux d'après-guerre et a appelé à un programme national d'assurance maladie. Même si les programmes étaient inefficaces, « l'idéal d'équité perdure toujours ». Il a critiqué la vision républicaine et a félicité le président Jimmy Carter. Il a conclu son discours en citant un poème adoré de ses frères et soeurs aînés vénérés, se terminant par la phrase mémorable : « le rêve ne mourra jamais ». La foule a été interrompue par des applaudissements à plus de cinquante reprises. Malgré ce discours percutant, les critiques ont noté que le sénateur Kennedy n'avait pas fortement soutenu le président Carter et avait implicitement critiqué ses opinions modérées. Il semble que le Parti démocrate restera en conflit sur la profondeur avec laquelle il adhère à ses valeurs libérales."
 Dem_1980_Primary.12.d: "Malgré la force historique des dirigeants démocrates sortants et de l'establishment, le sénateur Ted Kennedy a réussi à vaincre le président Jimmy Carter et à être nommé président du Parti démocrate. Au cours de la difficile campagne primaire, Kennedy a réussi à rallier le soutien des démocrates grâce à son adhésion aux valeurs libérales. Les experts politiques voient la victoire de Kennedy comme la défaite du pouvoir démocrate modéré sur le parti. Le président Carter, a gracieusement admis, bien qu'en privé, ses proches conseillers se disent stupéfaits par la défaite. Les dirigeants démocrates utilisent désormais la convention pour établir un front uni en préparation de la campagne nationale. Il est clair que les élections de 1980 seront une bataille culturelle entre libéralisme et conservatisme."
 Dem_1980_Primary.13.d: "Le sénateur Ted Kennedy a prononcé son discours d'acceptation à la Convention nationale démocrate au Madison Square Garden. Il est considéré jusqu'à présent comme le plus grand discours de sa carrière. Kennedy a défendu sans vergogne et nostalgique le libéralisme et les programmes gouvernementaux d'après-guerre et a appelé à un programme national d'assurance maladie. Même si les programmes étaient inefficaces, « l'idéal d'équité perdure toujours ». Il a critiqué la vision républicaine et a promis de ne jamais faire de compromis sur une vision libérale de la nation. Il a félicité le président Jimmy Carter pour sa gracieuse concession. Pour conclure, il a cité un poème adoré de ses frères et soeurs aînés vénérés, se terminant par la phrase mémorable : « le rêve ne mourra jamais ». La foule a été interrompue par des applaudissements à plus de cinquante reprises. La victoire du sénateur Kennedy indique que l'aile libérale du Parti démocrate a désormais supplanté l'establishment modéré."

