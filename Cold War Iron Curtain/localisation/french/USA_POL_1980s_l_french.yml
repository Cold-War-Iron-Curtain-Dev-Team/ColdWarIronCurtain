 NLRB_Packing.1.d: "Les syndicats jouissent depuis assez longtemps d'un trop grand pouvoir dans ce pays. La nation américaine a été fondée sur la libre entreprise, mais les syndicats, dont beaucoup sont devenus corrompus ou même servent de façades aux activités de la mafia, ne peuvent plus prétendre représenter les travailleurs et tenir l'économie en otage. Même s'il se croit invincible, le Conseil national des relations du travail dispose d'un pouvoir immense sur les relations entre travailleurs et entreprises. Tout ce dont nous avons besoin, ce sont quelques bons hommes au conseil d'administration, et le pouvoir des syndicats corrompus et tyranniques sera brisé à jamais."
 NLRB_Packing.2.d: "Les syndicats sont l'épée et le bouclier des travailleurs américains, garantissant que les entreprises américaines ne travaillent pas seulement pour quelques élites, mais qu'elles paient leur dû aux Américains qui travaillent dur et qui font la grandeur de ce pays. La concurrence internationale et la libéralisation économique ont affaibli le pouvoir des syndicats au profit des intérêts des riches. Même s'il se croit invincible, le Conseil national des relations du travail dispose d'un pouvoir immense sur les relations entre travailleurs et entreprises. Tout ce dont nous avons besoin, ce sont quelques bons hommes au conseil d'administration, et le pouvoir des syndicats demeurera pour toujours."
 NLRB_Packing.3.d: "Les récentes tentatives de l'administration présidentielle actuelle de charger le NLRB de laquais favorables aux entreprises menacent l'existence toute entière de l'institution. Si cela ne sert que les riches, pourquoi s'embêter avec le conseil d'administration en premier lieu ? Même si la marionnette du patronat dans le Bureau Ovale a peut-être fait le premier pas, les syndicats ont toujours des alliés au Sénat. Un effort concerté pour bloquer les nominations antisyndicales et forcer l'administration à nommer des membres de conseils d'administration plus favorables aux syndicats pourrait être ce dont nous avons besoin pour inverser le déclin des syndicats dans ce pays."
 NLRB_Packing.4.d: "Le président Udall prend une gorgée de café fort. Les réunions qui ont suivi ces derniers jours avec des dirigeants syndicaux et économiques l'ont laissé à moitié mort. Tant de promesses faites, tant de poignées de main et si peu à tenir. La politique est une mauvaise affaire et le président se sent comme la victime n°1.\n\n\"Monsieur le Président, votre briefing du matin, Monsieur.\"\n\nLes yeux d'Udall se tournent vers la jeune assistante alors qu'elle dépose la pile de papiers et de dossiers manille.\n\n\"Merci gentiment. Oh, et sois gentil et dis à la cuisine que j'aime ce nouveau café. C'est du Costa Rica, non ?\"\n\nMettant ses lunettes de lecture, Udall plisse les yeux de son seul oeil valide lors du briefing quotidien, parcourant jusqu'à ce que \"NLRB VACANCY\" attire son attention. Nommés par le président pour un mandat de cinq ans, les choix de l'administration précédente devaient bientôt quitter leurs fonctions, ce qui a laissé une énigme. Durant son mandat au Congrès, il était connu comme un ami du parti travailliste et a obtenu son poste actuel en grande partie grâce aux nombreuses contributions et soutiens de ses relations avec les dirigeants syndicaux.\n\nD'un autre côté, une faction de plus en plus importante des démocrates avait adopté des vues plus favorables aux entreprises et ne cachait pas son hostilité à l'égard des syndicats. Peut-être qu'ils avaient raison. Les syndicats avaient bien entendu de nobles intentions et de nombreux travailleurs avaient donné leur vie dans le passé pour les privilèges dont jouissent aujourd'hui les travailleurs américains. Mais l'économie américaine stagnait ces derniers temps, embourbée dans la bureaucratie, les impôts élevés et un mouvement ouvrier empoisonné par les machinations de la Mafia. Examinant la liste des candidats, Udall prend une profonde inspiration et prend sa décision."
 
 AbortionModGOP.1.d: "La décision historique de la Cour suprême, Roe v. Wade, a établi l'avortement comme un droit légal partout aux États-Unis. Cela a provoqué des troubles dans les deux partis étant donné l'écart important dans les positions de politique sociale des deux partis. En ce qui concerne notre propre parti, les conservateurs les plus radicaux ont fait pression pour des mesures drastiques visant à restreindre ou interdire l'avortement, dont plusieurs nuiraient sûrement à l'intégrité du tribunal. Dans le même temps, notre propre base politique est généralement modérément pro-choix. Cela soulève plusieurs questions sur la manière de procéder sur cette question. Nos conseillers politiques ont conseillé de rechercher une forme de compromis avec les démocrates partageant les mêmes idées et de codifier l'avortement dans la loi fédérale en échange de certaines concessions."
 AbortionModGOP.2.d: "Suite à l'impasse au Congrès concernant nos efforts en faveur d'un compromis concernant la codification du droit à l'avortement, le président a annoncé plus tôt dans la journée son soutien à la Womens' Health Choice Funding Act. Les forces conservatrices du Congrès ont déclaré leur opposition totale au projet de loi et ont annoncé leur intention de lancer une obstruction systématique au Sénat pour empêcher que le projet de loi soit voté au Sénat. En dehors des salles du Congrès, les réponses ont été mitigées, les sondages ont montré qu'une faible majorité d'Américains soutiennent la législation et que la législation a été approuvée par diverses organisations pro-choix. Cependant, la majorité morale et d'autres groupes évangéliques ont dénoncé cette législation, la qualifiant de trahison des valeurs américaines par le président, et font activement pression sur les membres du Congrès pour qu'ils votent contre la législation proposée."
 AbortionModGOP.3.d: "Suite à l'impasse au Congrès concernant nos efforts en faveur d'un compromis concernant la codification du droit à l'avortement, le président a annoncé plus tôt dans la journée son soutien à la loi sur la réduction de l'avortement, les garanties et le soutien prénatal. Lors d'un récent sondage, une forte majorité d'Américains approuvent la législation. Cependant, les organisations pro-choix ont critiqué la proposition pour les limitations de l'accès à l'avortement et les organisations évangéliques, y compris la majorité morale, ont qualifié cette décision de trahison des valeurs américaines de la part de l'administration. Cependant, il n'a pas été question de lancer une obstruction systématique contre la législation et, en privé, plusieurs sénateurs conservateurs ont fait part de leur opposition à la législation, mais ont signalé qu'ils n'insisteraient pas trop sur la question étant donné les concessions faites par le lobby pro-choix au Congrès."
 AbortionModGOP.4.d: "L'introduction d'un cadre pour codifier l'avortement au niveau fédéral n'a jamais été considérée comme une tâche facile.\nLa loi sur le financement des choix en matière de santé des femmes renforcerait enfin le droit des femmes de choisir dans ce pays, mais l'octroi d'un financement public pour ce droit a mis tous les politiciens mal à l'aise, à l'exception des plus progressistes, craignant que les électeurs qui pourraient autrement soutenir le droit à l'avortement ne veuillent pas réélire quelqu'un qui leur a fait payer la facture.\nLa loi sur la réduction de l'avortement, les garanties et le soutien prénatal codifierait l'avortement légal, mais pour beaucoup dans le camp pro-choix, elle sert simplement à interdire l'avortement au strict minimum que les tribunaux peuvent tolérer, alors que même ses propres auteurs en ont fait un secret de polichinelle, ils y voient un compromis difficile qui n'apaise en aucun cas leur base évangélique.\n\nAvec débat après débat et obstruction systématique après obstruction menaçant de mettre fin à ce projet de loi avant sa naissance, [USA.GetLeader] est confronté au choix de guider le GOP en faveur du projet de loi ou de conserver ses faveurs politiques pour un autre jour. Le projet de loi vivra ou mourra selon toute vraisemblance entre les mains du président, sauf toute supercherie législative que le destin pourrait généreusement fournir. Le choix se situe en fin de compte dans le Bureau Ovale, à un seul coup de fil de l'histoire ou de sa rupture."

 CAAA_Veto.1.d: "La Maison Blanche a annoncé aujourd'hui que le président [USA.GetLeader] opposerait son veto à la loi anti-apartheid globale adoptée par le Congrès il y a quelques jours. Cela a surpris une grande partie du pays en raison de la popularité généralisée du projet de loi, et les analystes politiques ont souligné comment le Congrès a adopté le projet de loi avec plus des ⅔ de majorité dans chaque chambre. Le président a affirmé que sa politique actuelle d'« engagement constructif » serait plus efficace pour mettre fin à l'apartheid en Afrique du Sud, qualifiant le projet de loi de « destructeur pour nos efforts dans une nation divisée ». On pense actuellement que le Congrès sera en mesure de contourner avec succès le veto du président [USA.GetLeader], en raison du grand nombre de voix que la Maison Blanche devrait renverser."
 CAAA_Veto.3.d: "L'annulation de la loi anti-apartheid globale a été adoptée aujourd'hui, infligeant une défaite considérable à la Maison Blanche et au président [USA.GetLeader]. Le président n'a réussi à rassembler qu'une poignée de sénateurs pour s'opposer à cette dérogation, et les représentants de la Chambre ont perdu plus de 40 voix par rapport à ce dont ils avaient besoin. Apparemment, le président [USA.GetLeader] a tenté de rassembler une coalition de membres du Congrès opposés à la CAAA en raison de son impact économique, et d'anciens membres pro-ségrégationnistes qui s'opposaient toujours fermement aux droits civiques. L'Afrique du Sud a condamné le projet de loi, affirmant qu'il ne ferait que nuire aux relations fragiles entre les noirs et les blancs dans le pays. La figure anti-apartheid Nelson Mandela a salué le projet de loi, remerciant le Congrès de lutter contre la discrimination en Afrique du Sud."
 CAAA_Veto.4.d: "L'annulation de la loi anti-apartheid globale n'a pas été adoptée aujourd'hui, offrant à la Maison Blanche et au président une victoire surprenante [USA.GetLeader]. Le président a rassemblé une coalition d'anciens membres du Congrès ségrégationnistes et de personnalités du libre-échange qui s'opposaient au projet de loi sur les intérêts économiques. De nombreux libéraux ont condamné aujourd'hui cette décision, la NAACP déclarant que l'Amérique contribue à maintenir le racisme et la discrimination systémiques dans le monde et que le président [USA.GetLeader] trahit les valeurs américaines de liberté et de liberté pour tous. Le gouvernement sud-africain a envoyé ses remerciements à la Maison Blanche, déclarant qu'une réponse lente et mesurée à l'apartheid serait la meilleure pour toutes les nations impliquées, tandis que le leader anti-apartheid Nelson Mandela a attaqué le président, le qualifiant d'esprit fermé et de force destructrice en Afrique du Sud."
 CAAA_Veto.2.d: "Aujourd'hui, le Congrès a entamé le processus visant à annuler notre veto sur la loi anti-apartheid globale, et actuellement les chiffres sont contre nous. Nous ne pourrons renverser aucun membre libéral de l'un ou l'autre parti, et de nombreux modérés ont été confrontés à d'intenses pressions pour voter en faveur de cette dérogation. Nous pensons cependant que nous pouvons siphonner une coalition de membres du Congrès du libre-échange qui s'opposent au projet de loi pour des raisons économiques, et d'anciennes personnalités pro-ségrégation qui restent toujours au Congrès. Il existe également la possibilité de faire pression sur les dirigeants de nos partis, en menaçant éventuellement de suspendre le financement supplémentaire de la campagne et le soutien aux membres du Congrès qui votent pour la dérogation, mais une telle option pourrait se retourner contre nous et conduire à l'échec d'autres projets de loi que nous souhaitons adopter."


 CUBUSA80s.1.d: "Aujourd'hui, le Président [USA.GetLeader] a annoncé la signature de la Loi de rapprochement cubain, qui mettrait fin à l'embargo actuel contre Cuba et ouvrirait la voie au rétablissement des relations avec l'île. Alors que Cuba et les États-Unis ont été dans des camps opposés pendant la majeure partie de la guerre froide, les tensions entre les nations se sont considérablement apaisées depuis la crise d'il y a 62 ans. Le président a déclaré qu'il était temps de dépasser les anciens conflits, soulignant l'opposition de l'ONU à l'embargo et le rôle de Cuba dans le Mouvement des non-alignés comme preuve qu'il n'est pas une simple marionnette soviétique. Cette annonce a rencontré une grande hostilité de la part des faucons de guerre du Congrès, affirmant que l'embargo maintenait Cuba faible et isolé et que le président nuisait de manière flagrante aux intérêts américains dans le monde entier. Un groupe particulièrement restreint de faucons extrémistes du pays a appelé à la démission ou à la destitution du président [USA.GetLeader] pour avoir trahi les États-Unis. "
 CUBUSA80s.2.d: "Nous avons reçu aujourd'hui un appel du secrétaire d'État américain [GetCurrentSecState], nous informant des projets du pays pour mettre fin à l'embargo et rétablir les relations avec notre République. Plusieurs de nos conseillers considèrent qu'il s'agit d'une occasion en or de développer l'économie et d'acquérir une plus grande reconnaissance sur la scène mondiale. Cependant, certains partisans de la ligne dure y voient une ouverture de notre économie au capitalisme de copinage, et l'Amérique ne fait cette offre que dans le but de déstabiliser Cuba par la supercherie économique. Des relations normalisées pourraient également conduire à une nouvelle crise d'immigration pour notre pays, aggravant ainsi la fuite des cerveaux. Cependant, les vivres et les médicaments qui vont désormais entrer dans le pays nous aideront grandement et nous libéreront peut-être d'une telle dépendance à l'égard de l'Union soviétique."

 USDP.1.d: "Le président [USA.GetLeader] a annoncé aujourd'hui un moratoire national sur toutes les exécutions fédérales, justifiant sa décision en affirmant que la peine de mort est une manière barbare d'appliquer la loi et que le système actuel est très inefficace, de nombreux prisonniers passant des décennies à attendre leur date d'exécution et épuisant leurs recours. Le président a critiqué les responsables politiques de « l'ordre public », soulignant que les délinquants les plus pervers du pays finissent par être placés dans de grandes cellules de meilleure qualité avec des droits de visite bien plus étendus, faisant ironiquement de la peine de mort une meilleure expérience pour le prisonnier qu'une peine à perpétuité. Le Président a également appelé les États qui recourent encore à la peine de mort à mettre également un terme à ce processus. Les membres du Congrès conservateur ont attaqué aujourd'hui l'annonce du président, le qualifiant de laxiste à l'égard de la criminalité et affirmant qu'il essayait seulement de se plier au « vote en prison »."

 War_on_Drugs80s.1.d: "Malgré l'adoption de la loi sur les substances contrôlées en 1970 et diverses autres campagnes anti-drogue, les États-Unis continuent de constater une augmentation de l'abus de drogues et des décès dans tout le pays. Le crack, une forme de cocaïne à fumer beaucoup moins chère, s'est répandu dans les communautés afro-américaines. De nouvelles drogues encore légales, comme la MDMA, ont également gagné en popularité sur de nombreuses scènes musicales underground, causant un grand préjudice à notre nation. Aujourd'hui, le président [USA.GetLeader]a annoncé de nouvelles politiques visant à intensifier la guerre contre la drogue. Ces mesures comprennent une réforme significative de nos lois actuelles sur les drogues, l'établissement de lois pénales en trois coups pour possession de drogue, la possibilité pour les familles qui ont perdu leurs proches à cause de l'abus de drogue de poursuivre les trafiquants de drogue à l'origine de la vente pour dommages et intérêts, et un programme complet d'éducation sur les drogues qui sera créé et mis en oeuvre dans nos écoles. Le Congrès a généralement été réceptif à cette politique, bien que certains démocrates libéraux et membres libertaires aient exprimé leur opposition, qualifiant la guerre contre la drogue de gaspillage d'argent et de violation des droits personnels du peuple américain."
 War_on_Drugs80s.2.d: "Aujourd'hui, le président [USA.GetLeader] a annoncé une nouvelle campagne pour la guerre contre la drogue, mais menée davantage par l'éducation et la science, plutôt que par des mesures d'ordre public et sévères supplémentaires. Il s'agit notamment du réexamen d'une grande partie des drogues des tableaux I/II actuellement répertoriées, quelques experts médicaux déclarant que les drogues telles que la marijuana devraient être traitées davantage comme de l'alcool que comme de l'héroïne et d'autres « substances dures ». Le président a également annoncé qu'il mettrait l'accent sur un élargissement considérable de l'éducation sur les drogues dans les écoles, affirmant qu'enseigner à la nouvelle génération la vérité sur ces substances serait la clé pour mettre fin à la guerre contre la drogue. Le président a reçu des réticences de la part de nombreux politiciens conservateurs et de groupes chargés de l'application des lois, qui affirment que la marijuana reste une drogue très nocive, car elle agit comme une porte d'entrée vers de nombreuses autres substances. Il semblerait également que le président puisse opposer son veto à tout projet de loi adopté par le Congrès augmentant les peines pour possession simple de drogue."
 War_on_Drugs80s.10.d: "Aujourd'hui, le secrétaire à la Défense [GetCurrentSecDef] a annoncé une forte augmentation de la coordination avec la Drug Enforcement Agency (DEA) dans le but de réprimer la crise croissante de la drogue aux États-Unis. En outre, le secrétaire a également annoncé que le président [USA.GetLeader] avait approuvé le recours à la Garde nationale pour aider à réprimer les fermes et les laboratoires de drogue illégaux présents dans tout le pays. La Garde nationale exécutera spécifiquement des raids contre les cartels et les réseaux de drogue dans le pays en utilisant les renseignements de la DEA, fournira une formation supplémentaire aux forces de l'ordre locales et étatiques pour mener avec succès des raids anti-drogue, et mènera également un programme éducatif dans les régions où elle opèrera. Ces programmes éducatifs comprendront l'organisation d'une campagne de sensibilisation du public et la visite des écoles locales pour donner des conférences supplémentaires. Ce nouveau programme a suscité une réaction importante de la part de l'ACLU et de nombreux membres du Congrès libéraux, qui affirment que la militarisation de la police a un effet dissuasif sur le pays et pourrait potentiellement porter atteinte aux droits de nombreuses personnes accusées de crimes liés à la drogue. Dans le même temps, les forces de l'ordre se sont montrées très réceptives à l'idée d'effectifs supplémentaires, les qualifiant de poids nécessaire pour faire pencher la balance dans la guerre contre la drogue."
 
 AIDSGOP.1.d: "Le syndrome d'immunodéficience acquise (SIDA), provoqué par une infection par le virus VIH, a connu une augmentation constante des cas depuis la fin des années 70 dans le pays. Cette maladie, qui se transmet principalement par contact sexuel, est incurable et généralement mortelle. Récemment, nous avons également remarqué des cas d'Américains innocents infectés par transfusion sanguine. Le CDC a recommandé l'interdiction à vie du don de sang aux consommateurs de drogues et aux personnes de même sexe, en raison de leur risque élevé de contracter le virus. En outre, de nombreux États ont commencé à adopter des lois criminalisant la transmission intentionnelle du VIH dans le pays, dans le but de ralentir la montée du VIH. L'organisation religieuse et politique Moral Majority a condamné le sida comme une punition divine envoyée par Dieu pour punir l'Amérique pour son acceptation croissante de l'homosexualité et de l'avortement dans le pays."
 AIDSGOP.5.d: "Le gouvernement fédéral a annoncé aujourd'hui qu'il serait interdit de financer de nouveaux financements pour la recherche sur le sida et le virus VIH. Le président a déclaré que des fonds supplémentaires ne seraient pas nécessaires pour lutter contre l'épidémie. Cela a été condamné par de nombreux médecins à travers le pays et par certaines personnalités de gauche, affirmant que le gouvernement investit dans la vie des Américains en paralysant les efforts de recherche sur le VIH. Jerry Falwell, leader de la Moral Majority, a affirmé qu'il ne servait à rien de financer la recherche sur le sida, car il s'agit d'une maladie causée exclusivement par les hommes homosexuels et que c'était le châtiment ordonné par Dieu pour leurs péchés."
 AIDSGOP.10.d: "Aujourd'hui, le chirurgien général des États-Unis a publié un rapport sur la crise du sida en Amérique. Il a recommandé une vaste campagne d'éducation sur le SIDA, car les mythes répandus se sont propagés comme une traînée de poudre, comme la transmission du SIDA par les moustiques ou simplement par simple contact peau à peau. Il a également fait pression pour que l'utilisation de la contraception masculine se généralise. Ces propositions en matière d'éducation sexuelle et de contraception ont reçu une certaine réticence de la part des conservateurs sociaux, qui préfèrent une éducation sexuelle plus limitée et axée uniquement sur l'abstinence. Jerry Falwell, leader de la Moral Majority, s'est prononcé contre le rapport du Surgeon General, affirmant qu'un financement supplémentaire et une tolérance envers les personnes infectées par le SIDA ne feraient que gaspiller l'argent des contribuables. Falwell a plutôt recommandé de ramener Dieu à l'école et dans le tissu social américain, ce qui, selon lui, \"limiterait la propagation de l'homosexualité, vecteur de la maladie du sida\"." 
 AIDSLib.1.d: "Le syndrome d'immunodéficience acquise (SIDA), provoqué par une infection par le virus VIH, a connu une augmentation constante des cas depuis la fin des années 70 dans le pays. Le CDC demande des fonds supplémentaires pour poursuivre la recherche sur la maladie, dans l'espoir de trouver un remède ou de fournir un traitement plus adéquat. Le ministère de l'Éducation a également commencé à s'associer avec le HHS et le CDC pour créer et financer des programmes éducatifs sur le sida, dans l'espoir de réduire les transmissions et de dissiper les mythes néfastes sur la maladie. Cette mesure a suscité une forte opposition de la part des sociaux-conservateurs du pays, qui prétendent que le gouvernement détourne l'argent des contribuables pour financer une maladie causée par des déviants homosexuels. Jerry Falwell, de la Moral Majority, s'est engagé à soutenir les primaires contre tout politicien républicain qui soutiendrait les mesures du gouvernement contre le SIDA."

 USA_Nuclear_Energy.4.d: "À la suite de plusieurs catastrophes nucléaires majeures aux États-Unis et en Union soviétique, notamment respectivement à Three Mile Island et à Tchernobyl, le président [USA.GetLeader] a annoncé le gel de nouvelles centrales nucléaires et a rendu obligatoire un examen strict de la sécurité et de la conformité de toutes les centrales nucléaires opérationnelles aux États-Unis. Cela fait suite à la position ferme du président [USA.GetLeader] en faveur de la non-prolifération nucléaire et à sa méfiance à l'égard de l'énergie nucléaire. Les environnementalistes et autres partisans de l'énergie nucléaire ont salué cette décision, mais ont été attaqués par les électeurs pro-énergie nucléaire et le secteur de l'énergie. D'autres préoccupations ont été soulevées quant à l'impact que cela aura sur les prix de l'énergie, en particulier dans les zones utilisant fortement l'énergie nucléaire. Le président a également appelé d'autres pays à se joindre à nous en suspendant et en révisant leurs propres programmes d'énergie nucléaire. Comment d'autres nations, notamment l'Union Soviétique, ont réagi suite à la récente catastrophe de Tchernobyl."
 USA_Nuclear_Energy.5.d: "Le dirigeant soviétique [SOV.GetLeader] a annoncé un gel des installations d'énergie nucléaire pour confirmer le respect de la réglementation et la mise en oeuvre complète des mesures de sécurité. [SOV.GetLeader] a également indiqué qu'ils étaient ouverts à la reprise des négociations sur la non-prolifération nucléaire avec les États-Unis. Cela fait suite à l'annonce récente par le président [USA.GetLeader]d'un gel de l'énergie nucléaire pour évaluer la sécurité des centrales et enquêter sur les mesures réglementaires et de sécurité actuelles. Ces deux décisions interviennent après que des accidents nucléaires notables se soient produits dans les deux pays, provoquant un tollé international important. Le mouvement international environnemental et de non-prolifération a célébré cette annonce comme une victoire majeure et appelle les autres pays à suivre. Cependant, d'autres ont souligné les risques d'un arrêt arbitraire de l'énergie nucléaire qui, selon eux, pourrait provoquer une pénurie d'électricité, une augmentation des prix de l'électricité et une augmentation des prix en aval tout au long du processus de logistique et de production des biens."

 ADA_Veto.1.d: "Lors d'une cérémonie à la Maison Blanche aujourd'hui, le président [USA.GetLeader] a opposé son veto à l'Americans with Disabilities Act (ADA), un projet de loi bipartisan qui aurait considérablement élargi les droits et les réglementations concernant les Américains handicapés. Le projet de loi bénéficie d'un large soutien de la part du public américain et le fait d'opposer son veto à un projet de loi aussi populaire entraînera sûrement une réaction négative de l'opinion publique. Les dirigeants du Congrès se sont engagés à tenter un vote outrepassant leur veto dans les prochains jours. L'opposition à l'ADA vient en grande partie de deux domaines. Le premier concerne les intérêts commerciaux qui ont affirmé que le projet de loi obligerait les entreprises à augmenter considérablement les coûts pour les entreprises et nécessiterait la rénovation des bâtiments existants. Une autre source d'opposition au projet de loi, et probablement plus pertinente pour le raisonnement réel du veto, a été l'indignation des dirigeants évangéliques face au projet de loi étendant la protection aux victimes de la pandémie actuelle du SIDA."
 ADA_Veto.2.d: "Comme promis par une coalition bipartite au Congrès, un vote d'annulation du veto a commencé dans les deux chambres du Congrès concernant l'Americans with Disabilities Act (ADA). Malheureusement, étant donné la grande marge laissée initialement par l'ADA, nos efforts pour maintenir le veto seront incroyablement difficiles. Notre meilleure chance sera de tirer parti des préoccupations de nos entreprises donatrices et de faire pression sur les autres voix conservatrices du Sénat et de la Chambre pour qu'elles votent en faveur du maintien du veto. Cependant, étant donné que ce vote est très médiatisé, que le projet de loi est très favorable et que l'on vote contre les droits des personnes handicapées, cela sera probablement insuffisant pour déplacer suffisamment de votes en notre faveur. Quoi qu'il en soit, notre décision initiale de voter pour l'ADA plaira sûrement à notre base de donateurs et sera, espérons-le, oubliée par l'électeur moyen d'ici 1992."
 ADA_Veto.3.d: "La Chambre et le Sénat des États-Unis ont annulé le veto de l'Americans with Disabilities Act. Il s'agit d'une défaite majeure pour le président [USA.GetLeader] qui est resté fermement opposé à la législation en raison de ses impacts potentiels sur les entreprises et de l'inclusion des patients atteints du SIDA en tant que handicap. Les groupes d'intérêts commerciaux et les groupes de défense politique évangéliques se sont engagés à poursuivre la lutte contre l'ADA et ont indiqué qu'ils chercheraient à contester la constitutionnalité de la loi devant les tribunaux. Les experts juridiques ont exprimé des doutes quant à la légitimité des contestations judiciaires de la loi. L'opinion publique américaine a largement approuvé l'annulation du veto et l'opposition constante du président à la loi a eu des conséquences néfastes sur sa cote de popularité. Il s'agit d'une victoire majeure pour les droits des personnes handicapées aux États-Unis et pourrait établir une nouvelle norme mondiale en matière de droits des personnes handicapées."
 ADA_Veto.4.d: "Alors que l'annulation du veto du président sur l'Americans with Disabilities Act (ADA) a facilement franchi le seuil d'une dérogation au veto à la Chambre des représentants, le consensus général était que le Sénat emboîterait rapidement le pas. À la surprise de beaucoup, le Sénat n'a pas réussi aujourd'hui à franchir le seuil des deux tiers pour l'annulation du veto. Cela survient alors que plusieurs sénateurs du parti présidentiel ont initialement abandonné leur soutien au projet de loi pour voter contre la dérogation. Les dirigeants évangéliques et les milieux d'affaires ont salué le courage de ces sénateurs qui ont pris position contre les efforts de sensibilisation du gouvernement. Cependant, le grand public désapprouve fortement cette action et une réaction générale contre ces sénateurs et le président [USA.GetLeader] est de plus en plus probable."

 USA_Monetary.1.d: "La crise de stagflation qui sévit dans le pays depuis les années 1970 a conduit la Réserve fédérale, avec le soutien du président, à relever les taux d'intérêt pour resserrer l'offre monétaire. Au cours du cycle électoral de 1980, le président a mené une campagne intensive sur la nécessité de réduire l'inflation en resserrant la politique monétaire. Cette décision permettra, à terme, de freiner les taux d'inflation. Cependant, en resserrant l'offre monétaire, le taux de chômage augmentera sûrement avec le temps et d'autres problèmes socio-économiques pourraient s'exacerber. Quoi qu'il en soit, le président de la Réserve fédérale nous a assuré que les mesures drastiques prises permettront, à terme, de mettre un terme à l'ère d'inflation et de troubles économiques des années 1970."
 USA_Monetary.2.d: "Excellente nouvelle, le taux d'inflation a baissé à plusieurs reprises depuis plusieurs mois au cours de l'année dernière. Avec un taux d'inflation désormais inférieur à 9 %, la Réserve fédérale estime désormais qu'avec le maintien de taux d'intérêt élevés et une politique de « dollar fort », l'inflation pourra revenir à des valeurs normales au cours de la prochaine année. Cela dit, les inquiétudes se sont accrues quant aux conséquences économiques des taux d'intérêt élevés sur le Midwest industriel, des rapports économiques récents ont indiqué que les taux de chômage ont commencé à augmenter parmi les travailleurs de l'automobile et que les taux de chômage parmi les minorités ont également commencé à monter en flèche. Le président de la Réserve fédérale a rassuré sur le fait que cette situation, bien qu'inquiétante, soit la conséquence naturelle d'une baisse du taux d'inflation et que cela se résoudra tout seul dans les années à venir."
 USA_Monetary.3.d: "Une autre année, une autre année de problèmes économiques. Techniquement, le pays est entré en récession en 1980, mais il est resté relativement calme étant donné la hausse limitée du taux de chômage. Malheureusement, de plus en plus d'indicateurs économiques commencent à indiquer l'imminence d'une récession majeure. La Réserve fédérale est restée inébranlable dans son soutien au maintien de taux d'intérêt élevés pour pousser l'inflation encore plus bas, tout en maintenant une stratégie de « dollar fort » pour renforcer la situation financière américaine sur d'autres marchés. Cela nous laisse deux options : nous pourrions suivre les conseils de la Réserve fédérale ou exercer une pression politique pour amener la Réserve fédérale à assouplir les taux d'intérêt afin d'éviter les pires effets de la récession. La détérioration de l'économie dans une profonde récession pourrait avoir des conséquences politiques désastreuses si elle n'est pas résolue d'ici les prochaines élections et dévastera sûrement le coeur industriel et agricole des États-Unis qui a déjà été ravagé par des taux d'intérêt élevés. Comment devons-nous procéder ?"
 USA_Monetary.4.d: "L'économie est maintenant entrée dans une profonde récession et notre gestion de l'économie est mise en doute, et l'approbation de la Réserve fédérale est actuellement en train de s'effondrer. Les agriculteurs ont commencé à protester contre le gouvernement et les concessionnaires automobiles ont attiré l'attention des médias après que plusieurs d'entre eux aient envoyé au président de la Réserve fédérale les clés de leurs véhicules invendus dans des cercueils. Les taux d'intérêt élevés, combinés à la récession, ont complètement ravagé les mineurs, les agriculteurs et les fabricants américains, tous des secteurs qui dépendent de taux d'intérêt bas. Cela a gravement porté atteinte à notre popularité dans la région agricole, dans les Appalaches et dans les villes industrielles du Midwest.\n\nCela dit, le taux d'inflation est tombé en dessous de 3 % et nos économistes estiment que cette récession sera de courte durée et qu'une reprise est en vue. Cependant, si l'économie ne commence pas à rebondir rapidement, les élections de 1984 pourraient s'avérer désastreuses pour notre parti."
 USA_Monetary.5.d: "Notre campagne de pression privée sur le président de la Réserve fédérale a conduit à une baisse des taux d'intérêt à des niveaux plus raisonnables et à l'atténuation rapide du pire de la récession. Malheureusement, cela a entraîné une baisse du taux d'inflation plus lente que ce que de nombreux économistes et conseillers politiques avaient espéré. Heureusement, l'atténuation du ralentissement économique a entraîné un regain de soutien à notre administration, en particulier parmi les électeurs du Midwest et des Appalaches. Moins heureusement, notre décision a atténué notre soutien à New York, en Californie et dans d'autres régions plus favorables au libre-échange, centres de commerce ou non dépendantes de l'industrie manufacturière ou des exportations économiques. Des taux d'intérêt plus bas et des taux d'inflation légèrement plus élevés ont semé la consternation parmi les titans financiers américains. Des problèmes subsistent et les impacts à long terme du ralentissement économique se feront encore sentir dans les années à venir."
 USA_Monetary.10.d: "La Réserve fédérale a annoncé plus tôt dans la journée une baisse importante des taux d'intérêt pour stimuler l'économie. Avec un taux d'inflation désormais inférieur à 3 %, la stagflation des années 1970 est véritablement révolue. Malheureusement, notre solution à ce problème a conduit à une profonde récession économique, mais la Réserve fédérale et d'autres économistes de l'administration estiment désormais qu'avec la réduction des taux d'intérêt, l'économie peut éventuellement rebondir à temps pour les prochaines élections. Idéalement, cela nous permettra de mener une campagne positive centrée sur notre réussite à sortir le pays de la stagflation et de la récession. Ce sera un exercice d'équilibre prudent et nos actions antérieures pourraient avoir causé des dommages politiques à long terme dans certaines parties du pays, en particulier parmi les agriculteurs et les mineurs."

 Reaganomics.1.d: "Notre gouvernement a été élu sur la base de son programme visant à réduire les dépenses fédérales globales tout en augmentant les dépenses militaires, en réduisant les impôts et en équilibrant le budget, tout en renversant les excès du libéralisme social de ces dernières années. Dans cette mesure, la loi omnibus de réconciliation budgétaire de 1981 réduirait le budget fédéral de 36 milliards de dollars au cours de l'exercice 1982 et d'un montant cumulé de 140 milliards de dollars, y compris les années 1983 et 1984, et augmenterait les dépenses militaires de 176 milliards de dollars au cours de l'exercice 1981 à 221 milliards de dollars au cours de l'exercice 1982. En outre, cette mesure viserait également à réduire les impôts et à abroger la loi controversée sur les systèmes de santé mentale, parmi un large éventail d'autres changements de moindre importance. Normalement, un projet de loi aussi massif serait difficile à adopter et pourrait faire l'objet d'une obstruction systématique du Sénat. Cependant, étant donné que l'ensemble de ce paquet a été regroupé dans le cadre de la réconciliation budgétaire, le vote ne nécessitera qu'une majorité simple et ne sera pas soumis à une éventuelle obstruction systématique. Ceci, combiné à la loi sur la taxe de relance économique, qui sera adoptée au cours de l'année, contribuerait grandement à consacrer plusieurs de nos promesses électorales dans la loi."
 Reaganomics.10.d: "Le Groupe de travail du Président sur les marchés financiers a été créé aujourd'hui par le décret 12631. Cela fait suite au krach boursier de 1987. Les causes de la crise de 1987 ne sont pas encore pleinement comprises, mais ce qui a commencé comme une appréhension face au ralentissement de la croissance économique a conduit à plusieurs jours de chute des cours boursiers menant au « Lundi noir » où l'indice Dow Jones Industrial Average a plongé de plus de 500 points, perdant plus de 22 % de sa valeur marchande totale. Le nouveau groupe de travail établi par le président créera un groupe consultatif informé mais informel sur les marchés pour le président et les régulateurs et sera composé du secrétaire au Trésor, du président de la Réserve fédérale, du président de la Securities and Exchange Commission et du président de la Commodity Futures Trading Commission. Tout en rencontrant le soutien du grand public, certains acteurs politiques marginaux ont affirmé qu'il s'agissait simplement d'un autre cas de capitalisme de copinage et que le gouvernement choisissait les gagnants et les perdants de l'économie."
 Reaganomics.5.d: "La dernière décennie n'a pas été pour le moins tendre envers les agriculteurs américains. Entre la hausse des taux d'intérêt, l'inflation, les prix du pétrole, la chute des prix des terres et les conflits mondiaux entraînant une réduction des exportations, les saisies agricoles et les pertes des banques agricoles atteignent un niveau record depuis la Grande Dépression. Cela a non seulement eu un impact sur les agriculteurs, mais également sur les fabricants de machines agricoles dans tout le Midwest. Alors que la situation continue de se détériorer, les appels du public à l'intervention du gouvernement se sont multipliés et il faudra y répondre. Le président est depuis longtemps un ardent défenseur de l'abolition totale des subventions agricoles. Même si l'administration pourrait encore poursuivre dans cette voie, les chances qu'elle soit adoptée par le Congrès dans le contexte de crise actuelle sont peu probables et l'accueil du public à travers la Farm Belt serait assurément négatif. Cela dit, cela apaiserait les conservateurs budgétaires et les principaux partisans du président. Alternativement, l'administration pourrait rechercher un compromis avec les démocrates du Congrès en soutenant la « loi sur la sécurité alimentaire » bipartite qui vise à réformer les subventions agricoles, à améliorer les crédits d'impôt liés à l'agriculture et à établir divers nouveaux programmes de conservation. Comment devons-nous procéder ?"

 SSPurge.60: "Au cours d'une conférence de presse aujourd'hui, le président Bill Clinton a annoncé qu'il chargerait le secrétaire à la Santé et aux Services sociaux d'enquêter sur la purge des listes de sécurité sociale par les administrations précédentes. Tout en se gardant de dénoncer l'épuration en elle-même, le président Clinton a noté que les procédures appropriées n'étaient pas suivies et que les cas devraient être examinés au niveau individuel. Dans le même ordre d'idées, le président Clinton a appelé le Congrès à adopter une législation visant à codifier le processus d'examen de l'éligibilité aux prestations d'invalidité de la sécurité sociale afin d'éviter de futurs abus du système. Les dirigeants du Congrès ont manifesté leur soutien à la législation et la plupart des observateurs s'attendent à ce qu'elle soit adoptée relativement simplement étant donné la nature non controversée de la réforme. Les progressistes ont salué cette annonce, mais ont noté que le président devait tenir parole lors de la campagne précédente et réintégrer ceux qui ont été injustement évincés lors des purges."
 SSPurge.61: "L'une des actions les plus controversées de la présidence Reagan a été la purge des listes d'invalidité de la sécurité sociale. De 1981 à 1984, l'administration de la sécurité sociale a modifié un processus d'examen établi des personnes bénéficiant de prestations d'invalidité de la sécurité sociale, ce qui a abouti à des avis de suppression pour près d'un demi-million de bénéficiaires, dont un grand nombre souffraient de maladies mentales. La plupart de ceux dont les prestations ont été supprimées étaient clairement éligibles et avaient besoin d'aide. Alors que l'action du Congrès a mis fin à de nouvelles purges des listes, des milliers d'Américains handicapés susceptibles d'être éligibles ont été retirés de la sécurité sociale. Maintenant que notre administration a annoncé une révision des purges, nous avons deux options claires, la réponse que notre base attend est de réintégrer les membres purgés, mais cela serait coûteux et pourrait détourner l'attention d'autres priorités budgétaires. Notre autre option serait de supprimer discrètement la revue et de chercher à maintenir les purges en vigueur. Cependant, cela entraînerait presque certainement une réaction violente de la part de l'aile progressiste du parti."
 SSPurge.62: "La résilience de notre gouvernement face à la purge de la sécurité sociale menée par l'administration précédente a déclenché une réaction violente de la part de l'aile progressiste du parti. Si la purge elle-même n'a pas constitué un problème majeur pour les électeurs, ce n'est pas le cas de la base démocrate. Compte tenu de l'histoire de Clinton et de ses origines dans un État du Sud, les progressistes avaient déjà des soupçons sur les politiques économiques et sociales du président. Cette décision a confirmé dans l'aile gauche du parti que le président Clinton n'est guère meilleur que Reagan en matière de protection sociale et qu'elle entraînera sûrement des complications lors de l'adoption de futures lois avec leur soutien. Des rumeurs ont également commencé concernant un éventuel défi de la gauche lors de la prochaine primaire, probablement de la part de Jesse Jackson."

 Fairness_Doctrine.1.d: "La doctrine de l'équité de la Federal Communications Commission (FCC) des États-Unis, introduite en 1949, était une politique qui obligeait les titulaires de licences de diffusion à la fois à présenter des questions controversées d'importance publique et à le faire d'une manière qui reflète équitablement les différents points de vue. Cependant, la doctrine est controversée depuis sa création et est fréquemment la cible de la colère des conservateurs. Aujourd'hui, la FCC a officiellement voté l'abolition de la doctrine de l'équité par 4 voix contre 0. Le président de la FCC, Dennis Patrick, a annoncé à l'issue du vote que « Nous cherchons à étendre à la presse électronique les mêmes garanties du Premier Amendement dont bénéficient les médias imprimés depuis la création de notre pays. » Les démocrates du Congrès se sont engagés à soumettre une législation visant à rétablir la doctrine, mais le consensus général est que cette législation ne bénéficiera pas d'un soutien suffisant pour surmonter un veto présidentiel. Le temps nous dira quels effets cela aura sur la nation et sur les médias électroniques dans leur ensemble."
 ERA_Extension.1.d: "Le président [USA.GetLeader] a signé aujourd'hui une mesure du Congrès visant à modifier la date limite de l'amendement sur l'égalité des droits (ERA). Plusieurs États qui ont déjà ratifié l'amendement ont indiqué qu'ils contesteraient l'administration devant les tribunaux sur la légalité d'une nouvelle prolongation du délai de ratification de l'ERA. D'autres questions juridiques ont également été soulevées concernant l'ERA. Plusieurs constitutionnalistes ont soutenu que le délai lui-même était inconstitutionnel et cet argument est actuellement testé devant les tribunaux. Une autre question juridique est de savoir si les États peuvent annuler leur ratification des amendements et, si tel est le cas, quelle est la procédure juridique pour ce faire. Quoi qu'il en soit, cette question restera un bourbier juridique dans un avenir prévisible et l'EER continuera d'être une question politique controversée."
 ERA80s.2.d: "Dans un discours prononcé aujourd'hui à l'échelle nationale, le président américain [USA.GetLeader] a appelé le Congrès à prolonger le délai fixé pour l'amendement sur l'égalité des droits (ERA). L'Amendement sur l'égalité des droits est unique dans le sens où le Congrès a fixé une date limite à laquelle les États devraient ratifier l'amendement pour qu'il soit considéré comme valide. Alors que l'ERA devait expirer en 1979, le Congrès a prolongé ce délai jusqu'en 1981. Cependant, la légalité de l'ensemble de cette entreprise a été discutable et constitue une question juridique très controversée. Le président [USA.GetLeader] a appelé aujourd'hui à prolonger indéfiniment le délai afin de mettre fin complètement au problème et d'établir un calendrier ouvert pour une éventuelle ratification de l'amendement. Toutefois, cela ne résout pas l'autre question juridique concernant l'ERA. La question est de savoir si les États peuvent annuler la ratification après avoir ratifié l'amendement. Quoi qu'il en soit, cette question restera un bourbier juridique dans un avenir prévisible."

 SSPurge.1.d: "L'administration Reagan a confirmé qu'elle avait demandé à l'administration de la sécurité sociale de réévaluer le statut d'éligibilité des personnes bénéficiant des prestations d'invalidité de la sécurité sociale. Cela a été accompli en modifiant le processus d'examen établi des bénéficiaires des prestations. Le président Reagan et les partisans de l'administration ont allégué que la sécurité sociale est surchargée de personnes qui ne méritent pas de participer au programme et que cela contribuera à éliminer la fraude du programme et à combattre le problème des « reines de l'aide sociale ». Les critiques et les avocats militants ont quant à eux affirmé qu'il ne s'agissait là que d'une tentative de l'administration de combler le déficit fédéral aux dépens des Américains handicapés. L'accueil réservé à cette proposition a été en grande partie celui de l'apathie et de l'indifférence, mais a attisé encore davantage la colère progressiste contre le président Reagan."
 SSPurge.50.d: "Le président américain [USA.GetLeader] a annoncé aujourd'hui que son administration chercherait à réintégrer les personnes exclues des fonctions d'invalidité de la sécurité sociale en vertu des décisions de l'administration précédente. Les purges des fonctions de la Sécurité sociale ont été un incident source de discorde et ont suscité la colère des militants progressistes pendant des années. Le président appelle également à des mesures supplémentaires pour codifier dans la loi le processus approprié de détermination de l'éligibilité à la sécurité sociale afin d'éviter qu'une telle action ne se reproduise à l'avenir. Les conservateurs budgétaires du Parti républicain ont critiqué cette décision, la qualifiant d'autorisant davantage ceux qui abusent du système de protection sociale à leurs propres fins, et s'engagent à bloquer la codification proposée du processus de révision. Cela dit, la mesure a rencontré une large approbation du public et le soutien à la codification d'un processus approprié et clair pour déterminer l'éligibilité est susceptible d'être adopté par le Congrès compte tenu de l'effondrement partisan actuel."

 FedReserve80s.1.d: "Alors que le mandat actuel du président de la Réserve fédérale, Paul Volcker, touche à sa fin, il est temps de décider qui sera nommé pour confirmation par le Sénat. Le président actuel, Paul Volcker, est prêt à être reconduit, mais son mandat controversé depuis 1979 pourrait constituer un problème pour certains électeurs, en particulier les agriculteurs qui ont viscéralement condamné sa politique de taux d'intérêt au début de la décennie. Alan Greenspan, ancien président du Conseil des conseillers économiques au milieu des années 1970, est un fervent partisan de la déréglementation et est connu pour avoir été un ami proche du controversé Ayn Rand et a été décrit comme un objectiviste. Même si Greenspan susciterait probablement la colère des libéraux, il serait presque universellement soutenu par les conservateurs du Sénat. Une autre option serait Felix Rohatyn. Rohatyn, l'architecte de la reprise budgétaire à New York dans les années 1970 et un partisan reconnu du développement des infrastructures et de la réglementation budgétaire, serait fortement soutenu par les critiques de gauche de Volcker, mais s'attirerait la colère des conservateurs. Comment devons-nous procéder ?"
 FedReserve80s.5.d: "Felix Rohatyn, financier qui a piloté le sauvetage budgétaire de New York dans les années 1970, a été nommé par le président [USA.GetLeader] président de la Réserve fédérale. Rohatyn, un immigrant venu d'une Europe ravagée par la guerre au lendemain de la Seconde Guerre mondiale, est un éminent défenseur de la reconstruction des infrastructures américaines et est soutenu par des critiques plus à gauche du mandat de Volcker. Cela intervient alors que le deuxième mandat du président actuel, Paul Volcker, touche à sa fin. Volcker, bien qu'il ait réussi à sortir l'Amérique de la stagflation des années 1970, a été critiqué des deux côtés de l'allée politique pour sa préservation de taux d'intérêt plus élevés et son opposition à la déréglementation financière, respectivement. Étant donné que l'opposition de Rohatyn à la déréglementation est largement considérée comme plus forte que celle de Volcker, les conservateurs tenteront probablement de bloquer la nomination. Cependant, les analystes politiques estiment généralement que Rohatyn devrait facilement être confirmé au Sénat dans les semaines à venir."
 FedReserve80s.6.d: "Le président [USA.GetLeader] a annoncé aujourd'hui qu'il nommerait Paul Volcker pour un troisième mandat à la présidence de la Réserve fédérale. Le président a félicité Volcker pour avoir guidé l'Amérique à travers la stagflation économique de la fin des années 1970 et du début des années 1980. Cependant, les critiques de Volcker ont attaqué cette annonce. Les conservateurs budgétaires ont été irrités par l'opposition de Volcker à une déréglementation financière plus poussée, tandis que les intérêts agricoles et industriels ont protégé les mesures de Volcker visant à maintenir des taux d'intérêt plus élevés tout au long des années 1980, ce qui, selon certains, a encore aggravé la crise agricole actuelle. Cela dit, on s'attend toujours à ce que Volcker soit facilement confirmé une fois de plus par le Sénat et que les efforts de lobbying des opposants à Volcker, tant à gauche qu'à droite, n'ont pas réussi à dissuader la confiance du président en Volcker."
 FedReserve80s.7.d: "Dans un geste surprenant, le président [USA.GetLeader] a annoncé qu'Alan Greenspan serait son candidat au poste de prochain président de la Réserve fédérale. Cela intervient alors que le deuxième mandat du président actuel, Paul Volcker, touche à sa fin. Volcker lui-même et ses proches étaient ouverts à un troisième mandat, mais le président [USA.GetLeader] a décidé d'aller dans une nouvelle direction. Les rumeurs abondent selon lesquelles le président et Volcker se seraient disputés à cause de l'opposition de Volcker à de nouveaux efforts de déréglementation. De plus, le mandat controversé de Volcker en tant que président a certainement également joué un rôle dans cette décision, étant donné les nombreuses protestations contre lui au début des années 1980 à cause de l'augmentation des taux d'intérêt et de la récession de 1982. Greenspan est l'ancien président du Conseil des conseillers économiques au milieu des années 1970. Greenspan est un fervent partisan de la déréglementation et est connu pour avoir été un ami proche du controversé Ayn Rand et a été décrit comme un objectiviste."

 Savings_and_Loan_Collapse: "Effondrement du secteur de l'épargne et du crédit"
 Savings_and_Loan_Bailout: "Renfloué le secteur de l'épargne et du crédit"

 Savings_and_Loan_Crisis.10.d: "La déréglementation du secteur financier au début des années 1980 était une mesure nécessaire pour contribuer à réduire la stagflation qui frappait l'économie américaine à cette époque. Toutefois, les réformes de déréglementation ont permis à ces associations d'offrir une gamme plus large de produits d'épargne, notamment des prêts hypothécaires à taux variable, mais elles ont également considérablement élargi leur pouvoir de prêt et réduit la surveillance réglementaire. Ceci, combiné à l'augmentation des taux d'intérêt depuis 1979 ainsi qu'à une croissance rapide des actifs due aux investissements dans des investissements risqués, a conduit à un potentiel d'effondrement massif de ces associations. Les estimations des économistes internes prédisent que jusqu'à la moitié de toutes ces associations financières pourraient disparaître sans intervention fédérale. Cela laisse à notre administration deux choix pour faire face à cette crise imminente. Notre première option serait de solliciter l'intervention du gouvernement fédéral et de renflouer ces associations, puis de restaurer un semblant de réglementation du secteur. Alternativement, nous pourrions laisser le marché corriger sa trajectoire et permettre l'échec massif de ces associations. Comment devrions-nous procéder ?"
 Savings_and_Loan_Crisis.11.d: "Le président [USA.GetLeader] a annoncé aujourd'hui qu'il avait ordonné au département du Trésor de renflouer le secteur de l'épargne et du crédit afin d'éviter une éventuelle faillite massive des organisations financières. Le Président a également appelé au rétablissement de la réglementation sur les associations d'épargne et de crédit afin d'éviter que ce type de crise ne se reproduise à l'avenir. La démarche visant à stabiliser la situation a empêché une ruée générale contre les associations d'épargne et de crédit, mais a été critiquée pour avoir renfloué les sociétés financières avec l'argent des contribuables américains. Les critiques des deux côtés de l'éventail politique se sont concentrées sur ce point, tandis que d'autres se sont concentrés sur les critiques contre le président de la Réserve fédérale et la déréglementation financière adoptée par le Congrès au début de la décennie. Cela dit, la situation continue de se stabiliser et la plupart des électeurs approuvent les actions du président [USA.GetLeader] pour intervenir dans la crise et empêcher un nouveau chaos économique."
 Savings_and_Loan_Crisis.12.d: "Ces dernières semaines, un flot d'associations d'épargne et de crédit ont fermé leurs portes. Heureusement, presque tous les totaux des dépôts étaient couverts par la Federal Deposit Insurance Corporation (FDIC). Interrogé sur la crise, le président [USA.GetLeader] a déclaré que même si la situation constituait une préoccupation majeure, les fondamentaux économiques étaient solides et que le marché allait se corriger dans les mois à venir. Le président a également noté que presque tous les dépôts étaient assurés par le gouvernement et seraient accessibles aux déposants. Cependant, le président a été critiqué pour ne pas être intervenu dans la crise et pour n'avoir pas renfloué le secteur de l'épargne et du crédit. Depuis le début de la crise, plus de 30 % des associations d'épargne et de crédit du pays ont fait faillite et d'autres devraient s'ensuivre dans les semaines à venir."

 OilCrisis80s.1.d: "Le président [USA.GetLeader] a annoncé que le moment était venu pour le gouvernement américain de mettre fin au contrôle des prix du pétrole et de lever les contrôles sur les allocations de pétrole. Le président a fait valoir que le pire de la crise pétrolière était passé et que de telles mesures faisaient désormais plus de mal que de bien à l'économie. La réponse du public a été mitigée à cette annonce, les intérêts économiques et les conservateurs ont salué cette décision comme une étape vers la restauration du marché libre à la lumière des turbulences des années 1970, tandis que les militants des consommateurs ont critiqué cette décision comme vendant les Américains ordinaires aux sociétés pétrolières. Certains démocrates progressistes ont également rétorqué que cette décision, bien que nécessaire, était arrivée trop tôt et que le moment n'était pas venu de supprimer le contrôle des prix du pétrole et que cette décision aggraverait davantage les taux d'inflation compte tenu des effets potentiels sur la chaîne d'approvisionnement."
 DoVA.1.d: "Le programme américain moderne d'avantages sociaux pour anciens combattants existe depuis la Première Guerre mondiale. Dans les années 1920, les différentes prestations étaient administrées par trois agences fédérales différentes : le Bureau des anciens combattants, le Bureau des pensions et le National Home for Disabled Volunteer Soldiers. La création de l'Administration des anciens combattants a eu lieu en 1930, lorsque le Congrès a autorisé le président à « consolider et coordonner les activités gouvernementales affectant les anciens combattants ». Les trois agences composantes sont devenues des bureaux au sein de l'Administration des anciens combattants. Ce statu quo a été largement conservé jusqu'à nos jours. Cependant, la complexité des prestations et des soins offerts aux anciens combattants s'est considérablement accrue et la nécessité d'une réforme est devenue un sujet de préoccupation depuis plusieurs années. Heureusement, le Congrès a adopté la loi sur le Département des Anciens Combattants qui fera de l'Administration des Anciens Combattants un département au niveau du cabinet visant à promouvoir la réforme et la surveillance ainsi qu'à accroître la qualité du service aux anciens combattants américains."
 EnvironmentUSA.1.d: "L'un des exemples les plus flagrants de dépassement fédéral de ces dernières années est celui de l'Agence de Protection de l'Environnement (EPA) et de l'augmentation massive des réglementations liées à l'environnement. Le nouvel ordre réglementaire a gravement gêné les entreprises et les Américains ordinaires dans leur vie quotidienne. Même si nous ne pouvons pas éliminer l'EPA pour le moment, nous pouvons sûrement réaffecter les fonds du ministère et chercher à provoquer des licenciements et une plus grande impasse dans l'organisation. Dans le cadre de cet effort, le chef d'état-major a déjà ordonné une diminution de 11 % du budget de l'EPA cette année seulement et, d'ici la fin de notre mandat actuel, cela devrait équivaloir à une diminution de 40 % du budget par rapport à 1980. Un autre changement nécessaire vers lequel notre administration devrait s'efforcer est d'ouvrir davantage de terres fédérales à l'exploitation pétrolière. Si la décennie précédente a appris quelque chose à la nation, plus nous pouvons réduire notre dépendance à l'égard du pétrole étranger, mieux c'est. Cela dit, ces mesures ne manqueront pas d'exciter davantage les forces progressistes contre notre administration."
 DEM88.1.d: "L'une des principales priorités démocrates des dernières décennies a été celle de la réforme des soins de santé. Compte tenu de notre force actuelle au Congrès et de notre récente victoire électorale, le moment est peut-être venu de parvenir enfin à une action décisive en matière de soins de santé. À ce stade, il existe actuellement trois propositions majeures de réforme des soins de santé au sein du parti. Le premier est le plus ambitieux, qui consiste à établir des soins de santé universels à payeur unique via une expansion massive du système Medicare. Cette option bénéficierait d'un fort soutien de la part de l'aile progressiste du parti, mais pourrait rencontrer des difficultés avec les factions les plus modérées et conservatrices du parti et n'obtiendrait probablement aucun soutien de la part des Républicains. L'option suivante est la proposition de loi sur la réduction des coûts et l'accès aux soins de santé, qui viserait à élargir l'accès à l'assurance maladie et à réduire les coûts en augmentant le contrôle des prix par le gouvernement et en favorisant les subventions et les réformes de l'enseignement médical, tout en offrant davantage d'options aux individus pour souscrire une assurance maladie. Il s'agit d'une action plus modérée qui plaira tout de même aux progressistes tout en apparaissant aux modérés du parti. La dernière action Loi sur l'accès à des soins de santé responsables, de qualité et abordables est similaire à celle proposée sous les administrations précédentes et établirait des marchés d'assurance maladie subventionnés pour acheter une assurance tout en obligeant tous les individus à avoir une assurance maladie sous peine de sanctions. Cette loi élargirait également l'accès à Medicaid, cette loi plairait au plus grand nombre dans le parti mais subirait une certaine réticence de la part des progressistes pour ne pas aller assez loin. Comment devons-nous procéder ?"

 IRCA_Veto.1.d: "Lors d'une cérémonie télévisée à la Maison Blanche aujourd'hui, le président Jackson a opposé son veto à la loi sur la réforme et le contrôle de l'immigration. Le président Jackson a souligné, bien qu'il soit favorable à l'application des lois existantes sur l'immigration, que le projet de loi est trop punitif envers les soi-disant « étrangers illégaux » et qu'un projet de loi plus humain devrait être présenté à la place. Le président a également exprimé son opposition aux sanctions imposées aux employeurs concernant l'embauche de personnes résidant illégalement dans le pays et a appelé à l'adoption du projet de loi sur l'immigration par le représentant Ed Roybal (D-CA). Royabal, le projet de loi alternatif d'un allié réputé de Jackson, chercherait plutôt à appliquer les lois du travail étatiques et fédérales existantes sur les travailleurs sans papiers. Jackson a une fois de plus été critiqué par les conservateurs, tant au sein de son parti que du Parti républicain, pour ses opinions en matière d'immigration et libérales sur la question, et a appelé à annuler le veto dans les prochains jours."
 IRCA_Veto.2.d: "Comme promis, les dirigeants conservateurs du Sénat et de la Chambre ont lancé des votes pour annuler notre veto sur la loi sur la réforme et le contrôle de l'immigration. Pour repousser la dérogation au veto, nous devrons rassembler les législateurs démocrates pour qu'ils votent contre cette dérogation. Cela impliquera probablement de convaincre ceux qui ont voté en premier lieu pour la loi sur la réforme et le contrôle de l'immigration de voter contre cette dérogation. Ce sera une tâche difficile, mais si nous parvenons à vaincre cette dérogation, cela prouvera que notre administration ne sera pas renversée par les forces réactionnaires du Congrès. De plus, nous devrions contrer le discours conservateur en continuant à faire pression en faveur d'une législation sur l'immigration du représentant Ed Roybal (Démocrate-CA) afin de réduire les mauvais traitements infligés aux travailleurs migrants. Malheureusement, la force des forces conservatrices au Congrès pourrait offrir trop de choses à surmonter, en particulier avec les démocrates du Sud largement favorables à la loi."
 IRCA_Veto.3.d: "À la grande déception du président Jackson et des progressistes à l'échelle nationale, l'annulation du veto sur la loi sur la réforme et le contrôle de l'immigration a réussi à recueillir suffisamment de voix pour être adoptée au Sénat et à la Chambre. Le président Jackson s'est engagé à poursuivre sa lutte contre les dispositions de la loi et à rechercher des amendements au projet de loi dans un avenir proche. Alors que les sénateurs démocrates auraient dû en théorie avoir suffisamment de membres pour bloquer une telle dérogation, un nombre notable de démocrates du Sud ont fait défection lors du vote et ont permis le succès de la dérogation. Il s'agit d'une victoire majeure de la coalition conservatrice des deux partis contre la politique progressiste du président Jackson. Cela dit, une majorité du public a exprimé son soutien à la loi sur la réforme et le contrôle de l'immigration."
 IRCA_Veto.4.d: "À la grande déception des conservateurs à l'échelle nationale, le vote prioritaire du veto du président Jackson sur la loi sur la réforme et le contrôle de l'immigration a échoué aujourd'hui au Sénat. Même si l'adoption initiale du projet de loi indiquait un soutien suffisant en faveur d'une dérogation, le président Jackson et ses partisans ont réussi à convaincre suffisamment de sénateurs démocrates de voter contre la dérogation, la vouant ainsi à l'échec. Malheureusement pour le président, le projet de loi sur l'immigration du représentant Ed Roybal (Démocrate-CA) que Jackson a défendu est bloqué à la Chambre et il est peu probable qu'il soit adopté non plus. Cela dit, il s'agit toujours d'une défaite majeure pour les forces conservatrices des deux partis qui tentent d'appliquer une politique conservatrice contre la volonté du président Jackson. Alors que le débat fait rage, une chose est sûre : l'immigration jouera sûrement un rôle notable dans les élections de 1988."

 CRRA_Veto.1.d: "Aujourd'hui, le président [USA.GetLeader] a opposé son veto au Civil Rights Restoration Act de 1987. Le Civil Rights Restoration Act préciserait que les entités recevant des fonds fédéraux doivent se conformer à la législation sur les droits civiques dans toutes leurs opérations, et pas seulement dans le programme ou l'activité qui a reçu le financement. Ceci fait suite à la décision de la Cour suprême de 1984, Grove City College c. Bell, selon laquelle seul le programme particulier d'un établissement d'enseignement bénéficiant d'une aide financière fédérale était tenu de se conformer aux dispositions anti-discrimination du titre IX. Cela a créé une échappatoire, notamment pour les établissements d'enseignement privés, qui leur permettent de poursuivre leurs politiques discriminatoires à l'égard des minorités et des femmes. Le président a défendu son veto en affirmant que la loi allait trop loin et \"diminuerait considérablement la liberté et l'indépendance des institutions religieuses dans notre société\". Les dirigeants du Congrès se sont engagés à annuler le veto dans les prochains jours."
 CRRA_Veto.2.d: "Comme promis par les dirigeants démocrates du Congrès, un vote d'annulation du veto a commencé dans les deux chambres du Congrès concernant la loi sur la restauration des droits civils. Malheureusement, étant donné la grande marge laissée initialement par la loi sur la restauration des droits civils, nos efforts pour maintenir le veto seront incroyablement difficiles. Cela dit, nous avons plusieurs voies à suivre pour maintenir notre veto. Les intérêts évangéliques et commerciaux sont fortement opposés au Civil Rights Restoration Act, et c'est dans cet esprit que nous devrions faire appel aux législateurs évangéliques sympathiques pour qu'ils recherchent leur soutien dans son maintien. Il est intéressant de noter que plusieurs groupes pro-choix se sont également prononcés contre le projet de loi en raison de son ton « neutre en matière d'avortement ». Si nos agents parviennent à éliminer un certain nombre de législateurs progressistes suite à cette dénonciation des causes féministes, les chances de succès du vote de soutien augmenteront considérablement."
 CRRA_Veto.3.d: "Lors d'un vote décisif dans les deux chambres du Congrès, la loi de 1987 sur la restauration des droits civiques est devenue loi aujourd'hui, le seuil permettant de passer outre le veto du président [USA.GetLeader]sur la loi ayant été franchi. Il s'agit d'une victoire majeure pour les militants des droits civiques et c'est la première fois depuis la Reconstruction qu'il faut contourner le veto pour vaincre un veto présidentiel concernant la législation sur les droits civiques. Le président [USA.GetLeader] a condamné une fois de plus cette dérogation, car elle annule la décision antérieure du tribunal dans l'arrêt Grove City et consacre effectivement la discrimination contre les institutions religieuses. Divers établissements d'enseignement privés, en particulier ceux liés à des religions spécifiques, devront désormais réévaluer leurs politiques ou éviter complètement l'aide financière fédérale. Cela dit, la législation a été critiquée par l'Organisation nationale pour les femmes pour avoir compromis un amendement du sénateur John Danforth (R-MO) qui établissait que les institutions privées n'auraient pas besoin de payer pour les services d'avortement des inscrites et qu'elle interdisait la discrimination à l'égard des femmes qui utilisent ou recherchent des services d'avortement."
 CRRA_Veto.4.d: "Dans une défaite surprise, le Congrès n'a pas réussi à annuler le veto du Civil Rights Restoration Act de 1987. Il s'agit d'une défaite majeure pour la cause des droits civiques et d'une perte majeure pour les progressistes et les sociaux-libéraux qui ont défendu le projet de loi en réponse à la décision de Grove City de 1984 qui a établi une faille dans les dispositions anti-discrimination du Titre IX. Les dirigeants évangéliques ont salué les décisions audacieuses prises par les législateurs républicains qui ont fait défection pour maintenir leur veto face à l'intrusion potentielle de cette législation dans les universités évangéliques. À l'opposé du spectre de l'opposition, diverses organisations pro-choix, en particulier l'Organisation nationale pour les femmes, ont fait l'éloge des transfuges libéraux qui ont voté pour maintenir le veto au motif que l'amendement « neutre en matière d'avortement » inclus dans la loi par le sénateur du Missouri John Danforth sapait l'esprit du Titre IX. Cette coalition bizarre a infligé le premier échec de contournement de la législation sur les droits civiques depuis la Reconstruction."
 
 CRA90_Veto.1.d: "La loi sur les droits civiques de 1990 constitue depuis un certain temps la priorité législative des militants des droits civiques. Initialement présenté par le représentant Augustus Hawkins (Démocrate-CA), le projet de loi modifierait la loi antérieure sur les droits civils « pour restaurer et renforcer les lois sur les droits civils qui interdisent la discrimination dans l'emploi et à d'autres fins ». Cependant, le projet de loi a été critiqué par la Société fédéraliste et d'autres fondations juridiques conservatrices. Ces critiques ont allégué que le projet de loi obligerait en fait les entreprises à adopter des quotas raciaux lors de l'embauche et qu'il était trop vague en termes de langage. Utilisant une rhétorique similaire aujourd'hui, le président [USA.GetLeader] a opposé son veto au projet de loi, affirmant qu'il \"utilise un labyrinthe de langage hautement légaliste pour introduire la force destructrice des quotas dans notre système national d'emploi\". Les démocrates du Congrès se sont engagés à tenter de contourner le veto dans les prochains jours."
 CRA90_Veto.2.d: "Comme promis par les dirigeants démocrates du Congrès, un vote annulant le veto a commencé dans les deux chambres du Congrès, en ce qui concerne la loi sur les droits civils de 1990. Malheureusement, étant donné la grande marge adoptée par la loi sur les droits civils de 1990, nos efforts pour maintenir le veto seront incroyablement difficiles. Cela dit, nous avons plusieurs voies à suivre pour maintenir notre veto. Les intérêts évangéliques et commerciaux sont fortement opposés à la loi sur les droits civiques de 1990, c'est pourquoi nous devrions faire appel aux législateurs évangéliques sympathiques pour qu'ils recherchent leur soutien dans son soutien. Il est intéressant de noter que plusieurs groupes pro-choix se sont également prononcés contre le projet de loi en raison de son ton « neutre en matière d'avortement ». Si nos agents parviennent à éliminer un certain nombre de législateurs progressistes suite à cette dénonciation des causes féministes, les chances de succès du vote de soutien augmenteront considérablement."
 CRA90_Veto.3.d: "Les efforts déployés par les démocrates du Congrès ont porté leurs fruits aujourd'hui, puisque les deux chambres du Congrès ont finalisé leur vote en faveur de l'annulation du veto du président sur la loi sur les droits civils de 1990. Avant le vote d'annulation, les analystes politiques s'attendaient à ce que la mesure échoue compte tenu du nombre de démocrates conservateurs qui hésiteraient probablement à outrepasser le président sur ce sujet. Cependant, les défections ont été limitées à un nombre raisonnable et plusieurs républicains libéraux se sont joints aux démocrates pour réussir à contourner le veto. Le président [USA.GetLeader] a condamné cette décision mais a admis que la mesure était désormais une loi et que son administration la respecterait et ne chercherait pas à l'annuler par l'intermédiaire des tribunaux. Les intérêts évangéliques et commerciaux opposés se sont engagés à combattre la loi devant les tribunaux et à chercher à renverser la nouvelle loi à la fois par les urnes et par le marteau."
 CRA90_Veto.4.d: "Les efforts déployés par les dirigeants démocrates du Congrès n'ont pas porté leurs fruits aujourd'hui puisque le Sénat a rejeté une mesure visant à annuler le veto du président sur la loi sur les droits civils de 1990. Avant le vote d'annulation, les analystes politiques s'attendaient à ce que la mesure échoue compte tenu du nombre de démocrates conservateurs qui hésiteraient probablement à outrepasser le président sur ce sujet. Comme prévu, les défections démocrates ont condamné la mesure à l'échec, surtout compte tenu de l'opposition républicaine unie à la mesure. Les milieux évangéliques, les milieux d'affaires et les partisans du président ont félicité les transfuges pour avoir adopté une « position courageuse » en faveur de ce qui est juste, tandis que les militants des droits civiques ont appelé à de nouvelles contestations primaires contre les démocrates conservateurs qui ont voté contre cette dérogation. Le président a toutefois indiqué qu'il serait ouvert à un compromis avec les démocrates sur une législation plus limitée en matière de droits civiques, susceptible d'apaiser ses inquiétudes concernant les quotas."

 USENT.1.d: "Lors d'une visite à l'étranger au Royaume-Uni plus tôt dans la journée, le président [USA.GetLeader] a annoncé son soutien à un accord de libre-échange américano-anglo. Le Premier ministre [ENG.GetLeader] n'a pas annoncé publiquement s'il était pour ou contre la proposition, mais des sources proches du Premier ministre ont déclaré qu'elles pensaient que la proposition bénéficiait d'un large soutien au sein du gouvernement britannique. Le soutien du gouvernement britannique à l'accord est largement motivé par l'idée de diversifier davantage les opportunités d'exportation britanniques afin d'être moins dépendant de l'Europe tout en établissant un accord commercial qui ne risquera probablement pas de nuire davantage au secteur industriel national britannique. Cependant, les critiques des deux côtés de l'Atlantique ont critiqué la proposition, la qualifiant de bradage de la souveraineté de leurs pays respectifs, tandis que d'autres, en particulier les dirigeants syndicaux, ont critiqué la proposition comme une nouvelle attaque contre les syndicats du monde développé."
 USENT.2.d: "La proposition d'accord de libre-échange anglo-américain (AAFTA) est une question controversée depuis sa proposition par le président [USA.GetLeader]. Même si nous avons décidé d'aller de l'avant avec la proposition, nous devons également prêter attention au soutien et à l'opposition nationaux à l'accord proposé. Pour commencer par le problème au sein des partis, les syndicats s'opposent presque à l'AAFTA par crainte de la concurrence étrangère. Les sondages montrent que le Midwest industriel, en particulier l'Ohio et le Michigan, est fortement opposé au projet d'accord en raison de sentiments protectionnistes. De l'autre côté de la question, les États qui dépendent de l'agriculture ou d'autres exportations soutiennent largement la proposition, en particulier l'establishment démocrate de Californie et du Sud. Notre rôle de fer de lance de l'AAFTA ne suscitera probablement pas suffisamment de colère à lui seul pour conduire à un défi majeur en 1992, mais rester conscient des factions persistantes au sein du parti et tenter d'équilibrer les intérêts sera une nécessité dans les mois à venir."
 USENT.3.d: "Le président [USA.GetLeader]est depuis longtemps un partisan du libre-échange. Depuis son entrée en fonction, le président américain a signalé son intention de nouer des liens plus étroits avec l'anglosphère, notamment en ce qui concerne la Grande-Bretagne. Cet arrangement pourrait être une aubaine pour notre économie et permettre à notre nation de conquérir une plus grande part du marché américain. En outre, cela pourrait également permettre à notre économie de se diversifier et de s'éloigner d'une dépendance excessive à l'égard du commerce avec l'Europe. D'un autre côté, un tel accord attiserait sûrement les tensions avec nos syndicats. En outre, des préoccupations sociopolitiques ont été soulevées concernant le manque de protection des travailleurs et de l'environnement dans le projet de traité actuel. Enfin, nous devrions également nous demander si nous souhaitons ou non nous ancrer davantage dans l'orbite américaine. Comment devons-nous procéder ?"
 USENT.4.d: "Notre ambassadeur à Londres a fait savoir au Département d'État que la Grande-Bretagne avait accepté d'aller de l'avant avec le projet d'accord de libre-échange. Le gouvernement britannique a notamment souligné sa volonté d'élargir les exportations britanniques vers les États-Unis dans le but de diversifier ses partenaires commerciaux et de réduire leur dépendance à l'égard de l'Europe. L'engagement de la Grande-Bretagne envers nos relations approfondira davantage nos liens économiques et géopolitiques. En outre, cela atténuera davantage les barrières commerciales avec la nation insulaire et renforcera les liens économiques. Cela dit, la Grande-Bretagne a exprimé son souhait que la protection des travailleurs soit renforcée lors des futures négociations. Dans l'ensemble, il s'agit d'une excellente nouvelle et d'une victoire supplémentaire pour la politique commerciale de notre administration et d'une étape vers l'établissement d'un héritage durable pour le président."
 USENT.5.d: "Le gouvernement britannique a informé aujourd'hui le Département d'État qu'il s'opposerait à la conclusion d'un accord de libre-échange à l'heure actuelle. Diverses raisons ont été avancées, mais il convient de noter en particulier les inquiétudes concernant le déclin de leur secteur manufacturier, les protestations probables des syndicats et les inquiétudes concernant la protection de l'environnement et des travailleurs aux États-Unis. Bien que cela ne soit pas dit, nos contacts au sein du gouvernement britannique ont noté que Londres envisageait également une perte potentielle de souveraineté et qu'en concluant un tel accord commercial, cela endetterait davantage la Grande-Bretagne auprès des États-Unis et serait utilisé comme un outil pour façonner leur politique étrangère."
 USENT.6.d: "Lors d'une cérémonie de signature aujourd'hui à Washington, le président [USA.GetLeader] et le Premier ministre [ENG.GetLeader] ont officiellement signé un accord de libre-échange américano-anglo. Les deux dirigeants ont félicité leurs gouvernements respectifs pour avoir adopté l'accord et souligné comment l'accord bénéficierait aux deux pays et élargirait les opportunités de marché pour l'Amérique et la Grande-Bretagne. Les intérêts commerciaux et les partisans du libre-échange ont salué cette décision, en particulier dans la ceinture agricole américaine. Cependant, les syndicats des deux pays ont fait part de leurs inquiétudes sur des problèmes potentiels, tout comme les groupes environnementaux qui protestent également contre l'accord. En outre, les entreprises d'Europe continentale ont critiqué cette décision, la qualifiant de détournement du Royaume-Uni du marché européen vers les États-Unis. Le temps nous dira quel sera l'impact de cet accord sur les relations américaines et anglo-saxonnes ainsi que sur l'avenir du fédéralisme européen."
 USENT.7.d: "La proposition du président [USA.GetLeader]d'un accord commercial anglo-américain s'est soldée par un échec majeur pour les objectifs de politique étrangère de son administration. Même si le Premier ministre [ENG.GetLeader] s'est montré réceptif à l'accord, les critiques formulées à son sujet par les syndicats, les militants écologistes et les forces d'intégration pro-européennes étaient trop difficiles à surmonter. De plus, les préoccupations intérieures aux États-Unis ont également entraîné une diminution du soutien à l'accord parmi les Américains en raison d'une réaction négative des éléments protectionnistes, en particulier des syndicats, ainsi que de la forte opposition des Américains d'origine irlandaise. Dans l'ensemble, cela représente une défaite notable pour le président, mais il est peu probable qu'elle ait des conséquences politiques majeures lors des prochaines élections étant donné l'apathie du public à l'égard de cette proposition."

