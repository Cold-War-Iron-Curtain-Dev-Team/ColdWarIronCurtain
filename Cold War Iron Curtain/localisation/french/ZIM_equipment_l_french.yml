 #Zimbabwe/Rhodesia ZIM
 ZIM_infantry_equipment_0: "Fusil Lee-Enfield, n ° 5 Mk I, carabine Jungle"
 ZIM_infantry_equipment_0_short: "Fusil n°5 Mk I"
 ZIM_infantry_equipment_0_desc: "Le fusil n° 5 Mk I était un dérivé du britannique Lee-Enfield n° 4 Mk I. Suite à l'expérience des combats dans la jungle pendant la guerre du Pacifique, les Britanniques sont arrivés à la conclusion qu'un fusil plus court et plus léger que le modèle standard, le fusil à verrou.303 cal n° 4 était nécessaire. Cependant, son utilisation opérationnelle a eu lieu dans les campagnes coloniales d'après-guerre telles que l'urgence malaise, où il a gagné son surnom commun de Jungle Carbine."

 ZIM_infantry_equipment_1: "Fusil à chargement automatique L1A1"
 ZIM_infantry_equipment_1_short: "L1A1"
 ZIM_infantry_equipment_1_desc: "Le L1A1 est une version britannique du fusil de combat belge FN FAL. Il a été produit sous licence et a été utilisé dans de nombreux pays du Commonwealth. Le Royaume-Uni a produit sa propre variante du FN FAL intégrant les modifications développées par l'Allied Rifle Committee, le désignant le L1A1 Self Loading Rifle (SLR). Les armes ont été fabriquées par la Royal Small Arms Factory Enfield, Birmingham Small Arms, la Royal Ordnance Factory et le ROF Fazakerley. Après l'arrêt de la production, des composants de remplacement ont été fabriqués par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à 1994 environ, remplacé par le L85A1 à partir de 1985."

 ZIM_infantry_equipment_2: "Polymère de fusil à chargement automatique L1A1"
 ZIM_infantry_equipment_2_short: "L1A1(p)"
 ZIM_infantry_equipment_2_desc: "Version améliorée du C1." 
 
