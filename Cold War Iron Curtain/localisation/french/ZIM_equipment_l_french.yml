 ZIM_mechanized_equipment_5:0 "Véhicule de sécurité Leopard d'IWM Ltd."
 ZIM_mechanized_equipment_5_short:0 "Leopard"
 ZIM_mechanized_equipment_5_desc:0 "Le Leopard Security Vehicle est un véhicule blindé de transport de troupes (VBTT) protégé contre les mines, atypique, utilisé par le gouvernement rhodésien et la population civile durant la guerre du Bush rhodésien (1964-1979). Sa coque en V lui conférait une protection rudimentaire mais indispensable contre les attaques de mines."
