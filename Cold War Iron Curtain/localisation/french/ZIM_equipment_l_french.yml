 ZIM_infantry_equipment_0:0 "Lee-Enfield Rifle, No. 5 Mk I, Jungle Carbine"
 ZIM_infantry_equipment_0_short:0 "Fusil No. 5 Mk I"
 ZIM_infantry_equipment_0_desc:0 "Le fusil n° 5 Mk I était dérivé du Lee-Enfield n° 4 Mk I britannique. Suite à l'expérience des combats en jungle durant la guerre du Pacifique, les Britanniques conclurent qu'un fusil plus court et plus léger que le fusil standard n° 4 à verrou de calibre .303 était nécessaire. Cependant, son utilisation opérationnelle se limita aux campagnes coloniales d'après-guerre, comme l'insurrection malaise, où il gagna son surnom de « carabine de la jungle »."
 ZIM_infantry_equipment_1:0 "Fusil semi-automatique L1A1"
 ZIM_infantry_equipment_1_short:0 "L1A1"
 ZIM_infantry_equipment_1_desc:0 "Le L1A1 est une version britannique du fusil de combat belge FN FAL. Produit sous licence, il a été utilisé par de nombreux pays du Commonwealth. Le Royaume-Uni a développé sa propre variante du FN FAL, intégrant les modifications mises au point par l'Allied Rifle Committee, et l'a désignée fusil semi-automatique L1A1 (SLR). Ces armes ont été fabriquées par la Royal Small Arms Factory d'Enfield, la Birmingham Small Arms Factory, la Royal Ordnance Factory et la ROF de Fazakerley. Après l'arrêt de la production, les pièces de rechange ont été fabriquées par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à environ 1994, avant d'être remplacé par le L85A1 à partir de 1985."
 ZIM_infantry_equipment_2:0 "Fusil semi-automatique L1A1 en polymère"
 ZIM_infantry_equipment_2_short:0 "L1A1(p)"
 ZIM_infantry_equipment_2_desc:0 "Version améliorée du C1."
