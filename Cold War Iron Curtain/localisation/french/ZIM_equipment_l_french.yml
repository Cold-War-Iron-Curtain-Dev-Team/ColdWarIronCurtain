 ZIM_mbt_equipment_3: "T-55"
 ZIM_mbt_equipment_3_short: "T-55"
 ZIM_mbt_equipment_3_desc: "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "
 ZIM_mbt_equipment_4: "T-55LD"
 ZIM_mbt_equipment_4_short: "T-55LD"
 ZIM_mbt_equipment_4_desc: "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "

