 ZIM_transport_plane_equipment_2_desc:0 "Le Canadair North Star est un appareil canadien des années 1940, développé pour Trans-Canada Air Lines (TCA), à partir du Douglas DC-4. Au lieu des moteurs à pistons radiaux utilisés par Douglas, Canadair a opté pour des moteurs Rolls-Royce Merlin V12 afin d'atteindre une vitesse de croisière plus élevée de 523 km/h (325 mph). Il a été mis en service en 1946."
