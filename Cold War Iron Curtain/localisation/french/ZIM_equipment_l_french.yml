 ZIM_mechanized_equipment_5_short: "Léopard"
 ZIM_mechanized_equipment_5_desc: "Le véhicule de sécurité Leopard est un APC inhabituel protégé contre les mines terrestres et utilisé par le gouvernement rhodésien et la population civile pendant la guerre de Bush en Rhodésie de 1964 à 1979. Il offrait une protection basique mais nécessaire contre les attaques de mines grâce à l'utilisation d'une coque en V."
