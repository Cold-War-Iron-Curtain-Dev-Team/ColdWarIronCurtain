 #macau
 macau.4.d:0 "Les habitants de Macao ressentent aujourd'hui une vague d'incertitude, alors que le gouvernement portugais et les communistes chinois ont conclu une série de négociations qui placent la ville sous le quasi-contrôle de Pékin. Dès début décembre, des manifestants anticoloniaux ont manifesté dans les rues de la ville sous contrôle portugais. Ces mesures ont conduit les autorités coloniales portugaises à réprimer les manifestants, provoquant l'indignation au sein du gouvernement chinois. Après un mois tendu de négociations et une déclaration d'excuses, le Portugal a pratiquement cédé le contrôle de la ville à la République populaire. Bien que la ville reste techniquement sous l'autorité coloniale du Portugal, la plupart des analystes s'accordent sur le fait que ce n'est qu'une question de temps avant que Macao ne passe pleinement sous le contrôle du gouvernement chinois."