 ########### KPA
 
 KPA_fighter_equipment_0:0 "Force aérienne et anti-aérienne de l'Armée populaire coréenne"
 KPA_fighter_equipment_0_short:0 "KPAAF"
 KPA_fighter_equipment_0_desc:0 "La Force aérienne et anti-aérienne de l'Armée populaire coréenne est la force aérienne militaire unifiée de la Corée du Nord. Il s'agit de la deuxième plus grande branche de l'Armée populaire coréenne, comprenant environ 110 000 membres. Elle possède environ 950 avions de différents types, pour la plupart d'origine soviétique et chinoise vieille de plusieurs décennies. Sa tâche principale est de défendre l'espace aérien nord-coréen."

 #Fighter

 KPA_fighter_equipment_1:0 "Yakolev Yak-3"
 KPA_fighter_equipment_1_short:0 "Yak-3"
 KPA_fighter_equipment_1_desc:0 "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur et monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié tant des pilotes que du personnel au sol. L'un des chasseurs de combat les plus petits et les plus légers déployés par tous les combattants pendant la guerre, son rapport puissance/poids élevé lui a conféré d'excellentes performances et il s'est avéré être un formidable chasseur de chiens."
 KPA_fighter_equipment_2:0 "Lavotchkine La-7"
 KPA_fighter_equipment_2_short:0 "La-7"
 KPA_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de combat soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau de conception de Lavochkin. Il s'agissait d'un développement et d'un perfectionnement du Lavochkin La-5, et du dernier d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 KPA_fighter_equipment_3:0 "Lavotchkine La-9"
 KPA_fighter_equipment_3_short:0 "La-9"
 KPA_fighter_equipment_3_desc:0 "La-9 représente un développement ultérieur du prototype Lavochkin La-126. Le premier prototype, désigné La-130, fut achevé en 1946. La similitude avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur avait une construction entièrement métallique et une aile à flux laminaire. Les économies de poids dues à l'élimination du bois de la cellule ont permis d'améliorer considérablement la capacité de carburant et l'armement à quatre canons. Des combats simulés ont démontré que le La-130 était à égalité avec le La-7 mais qu'il était inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, entra en production en août 1946. Au total, 1 559 avions furent construits à la fin de la production en 1948."
 
