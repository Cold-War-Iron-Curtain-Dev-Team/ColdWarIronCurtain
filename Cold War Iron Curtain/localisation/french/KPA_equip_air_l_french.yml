 #fighter

 KPA_heavy_fighter_equipment_1:0 "Yakovlev Yak-9"
 KPA_heavy_fighter_equipment_1_short:0 "Yak-9"
 KPA_heavy_fighter_equipment_1_desc:0 "Le Yak-9 avait un fuselage arrière réduit avec une verrière de vision panoramique. Sa structure métallique plus légère permettait une charge de carburant et un armement accrus par rapport aux modèles précédents construits en bois. Le Yak-9 était maniable à grande vitesse à basse et moyenne altitude et facile à contrôler, ce qui en faisait l'un des chasseurs soviétiques les plus produits de la Seconde Guerre mondiale."
 #KPA_heavy_fighter_equipment_2:0 ""
 #KPA_heavy_fighter_equipment_2_short:0 ""
 #KPA_heavy_fighter_equipment_2_desc:0 ""
 KPA_heavy_fighter_equipment_3:0 "Lavotchkine La-11"
 KPA_heavy_fighter_equipment_3_short:0 "La-11"
 KPA_heavy_fighter_equipment_3_desc:0 "Développé en 1947, après la fin de la Seconde Guerre mondiale, le La-11 était une évolution du La-9 « Fritz » pour créer un chasseur d'escorte à longue portée. L'avion était équipé de pneus plus gros pour s'adapter à l'augmentation du poids et aux commodités pour les longs vols, comme un rembourrage accru du siège, des accoudoirs et un urinoir. De plus, une suite complète de radionavigation a été installée. Sans surprise, les performances de combat avec une pleine charge de carburant en ont souffert. Cependant, à mesure que la charge de carburant se rapprochait de celle du La-9, les performances augmentaient également. Les pilotes de La-11 en service soviétique et plus tard chinois serviraient dans la défense aérienne, abattant des Mustangs et des avions d'attaque de construction américaine pendant la guerre de Corée. Son nom de rapport à l'OTAN est Fang."

