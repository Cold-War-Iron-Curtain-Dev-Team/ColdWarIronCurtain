 CUM_cv_nav_bomber_equipment_1:0 "Iliouchine Il-4 Palubniy"
 CUM_cv_nav_bomber_equipment_1_short:0 "Il-4P Bob"
 CUM_cv_nav_bomber_equipment_1_desc:0 "<FICTIONNEL> L'Il-4 Palubniy est une version modifiée de l'Il-4 destinée à être utilisée depuis les ponts des porte-avions soviétiques. Exploité par l'aviation navale soviétique, l'Il-4 fonctionnait comme une torpille de fortune et un bombardier en piqué, bien qu'il soit pour la plupart inefficace dans ce dernier cas en raison de sa grande envergure (il était plus probable que les ailes se déchirent une fois une vitesse élevée atteinte.) Malgré cela, l'Il-4P a bien réussi à tenir à distance les marines de l'Axe du mieux qu'il pouvait pendant les campagnes en mer Noire. Comme sa variante terrestre, son nom de rapport OTAN est Bob."
 CUM_cv_nav_bomber_equipment_2:0 "Tupolev Tu-2T Palubniy"
 CUM_cv_nav_bomber_equipment_2_short:0 "Batte Tu-2TP"
 CUM_cv_nav_bomber_equipment_2_desc:0 "<FICTIONNEL> Le Tu-2T Palubniy est la version porte-avions du bombardier-torpilleur Tu-2T. Comme ses variantes terrestres, le Tu-2TP a été distribué aux pilotes de l'aviation navale soviétique au début de 1945 et a été principalement utilisé dans les attaques côtières sur la côte allemande alors que les troupes soviétiques se rapprochaient de Berlin. En raison de sa maniabilité, le Tu-2TP a également servi de chasseur lourd de basse altitude pendant le conflit. Son reporting OTAN est Bat, tout comme la variante terrestre."
 CUM_cv_nav_bomber_equipment_3:0 "Iliouchine Il-6 Palubniy"
 CUM_cv_nav_bomber_equipment_3_short:0 "Il-6P"
 CUM_cv_nav_bomber_equipment_3_desc:0 "<FICTIONNEL> L'Il-6 Palubniy est un développement ultérieur de l'Il-6, qui s'est poursuivi après l'annulation de la variante terrestre en 1944. Contrairement à la version terrestre, l'Il-6P avait un moteur différent, car le besoin d'une longue portée était largement annulé du fait qu'il était sur un porte-avions. En conséquence, les performances se sont largement améliorées pour atteindre un niveau comparable à celui de l'Il-4 sur lequel il était initialement basé. Cependant, sa durée de vie serait également courte, car le développement d'avions à long rayon d'action basés à terre éliminait effectivement le besoin de ce type."

 CUM_cv_CAS_equipment_1:0 "Polikarpov I-180 Palubniy"
 CUM_cv_CAS_equipment_1_short:0 "I-180P"
 CUM_cv_CAS_equipment_1_desc:0 "<FICTIONNEL> Développé comme une version navale de l'avion I-180, le I-180P a été converti pour le rôle d'un avion d'attaque léger et d'appui aérien rapproché. Cependant, à ce titre, l'I-180 a sous-performé, car il n'était ni assez durable ni doté de la puissance de feu nécessaire pour effectuer les tâches CAS à partir de porte-avions stationnés en mer du Nord. Ce type serait rapidement remplacé par les Il-2T et Il-10T dès sa mise en service."
 CUM_cv_CAS_equipment_2:0 "Iliouchine Il-2T Sturmovik"
 CUM_cv_CAS_equipment_2_short:0 "Il-2T Sturmovik"
 CUM_cv_CAS_equipment_2_desc:0 "L'Il-2T est une variante bombardier-torpilleur du célèbre avion d'attaque au sol Il-2 Sturmovik. Afin de gagner du poids pour lui permettre de voler, les deux canons VYa-23 de 23 mm sur les ailes ont été retirés. En tant que tel, il pourrait être équipé d'une seule torpille de 45 cm (18 pouces). Bien que la conception n'ait jamais été mise sur le terrain, les Sturmoviks équipés de torpilles n'étaient pas une idée inconnue, car les Il-2M3 ont été modifiés pour transporter des porte-torpilles pendant les campagnes de Crimée et du Caucase de la Seconde Guerre mondiale."
 CUM_cv_CAS_equipment_3:0 "Iliouchine Il-10T"
 CUM_cv_CAS_equipment_3_short:0 "Il-10T"
 CUM_cv_CAS_equipment_3_desc:0 "<FICTIONNEL> Cette variante bombardier-torpilleur de l'Il-10 a été développée après la fin des hostilités en Europe et en Mandchourie, contrairement à l'Il-10 à partir duquel elle a été développée. En dehors d'un bref soutien à la Corée du Nord pendant la guerre de Corée, l'Il-10T a eu une existence relativement paisible, étant retiré en 1953 au profit de chasseurs-bombardiers à réaction basés à terre comme le Su-7 Fitter."

 CUM_cv_fighter_equipment_0:0 "Polikarpov I-153 Tchaïka"
 CUM_cv_fighter_equipment_0_short:0 "I-153 Tchaïka"
 CUM_cv_fighter_equipment_0_desc:0 "Le I-153 est une version modifiée du chasseur biplan I-15. Équipé d'un train d'atterrissage rétractable, le I-153 était destiné (mais sans succès) à améliorer les performances du biplan. Malgré une courte durée de vie, le type s'est bien comporté lors de la bataille de Khalkin Gol contre les forces japonaises, où il a montré des performances égales avec le Type 97 japonais (la version IJA du Ki-27 « Nate »). La I-153 partage son surnom avec la I-15, Chaika, qui signifie mouette."
 CUM_cv_fighter_equipment_1:0 "Polikarpov I-153UD Tchaïka"
 CUM_cv_fighter_equipment_1_short:0 "I-153UD Tchaïka"
 CUM_cv_fighter_equipment_1_desc:0 "Le I-153UD est un I-153 Chaika redessiné qui remplace le cadre en bois et en acier recouvert de tissu par un cadre entièrement en bois à l'arrière du fuselage. Ceux-ci étaient équipés de réservoirs d'huile internes plus grands et raccordés pour accepter des réservoirs de carburant externes sous les ailes, ce qui doublait la portée de combat."
 CUM_cv_fighter_equipment_2:0 "Yakovlev Yak-1M"
 CUM_cv_fighter_equipment_2_short:0 "Yak-1M"
 CUM_cv_fighter_equipment_2_desc:0 "Le Yak-1M est une version modifiée des chasseurs Yakovlev Yak-1 et Yak-3. Il possède une surface d'aile beaucoup plus petite, un système d'admission de refroidissement révisé et un moteur mis à jour tout en réduisant le poids global, ce qui l'aurait rendu parfait pour les opérations de transport, sans sacrifier les performances pour lesquelles le Yak-1 était connu."
 CUM_cv_fighter_equipment_3:0 "Yakovlev Yak-7UTI"
 CUM_cv_fighter_equipment_3_short:0 "Yak-7UTI"
 CUM_cv_fighter_equipment_3_desc:0 "Le Yak-7UTI a été initialement développé comme un avion d'entraînement biplace destiné à former les futurs pilotes soviétiques. Mais ce type pourrait être bien adapté aux opérations des transporteurs, en utilisant le système de double commande pour garantir que si un pilote était fatigué, l'autre pourrait tout aussi bien fonctionner. Ce type pourrait servir de transporteur aérien de défense contre les avions allemands nazis et plus tard américains."

 CUM_fighter_equipment_0:0 "Polikarpov I-15 Tchaïka"
 CUM_fighter_equipment_0_short:0 "I-15 Tchaïka"
 CUM_fighter_equipment_0_desc:0 "Avion de combat biplan, le I-15 (nom de développement TsKB-3) était connu pour son aile de mouette distinctive, qui lui a valu le surnom de Chaika. (en russe pour Seagull) Il était exploité en grand nombre par l'armée de l'air soviétique et était l'un des deux chasseurs standard utilisés par l'armée de l'air républicaine espagnole pendant la guerre civile espagnole."
 CUM_fighter_equipment_1:0 "Yakolev Yak-3"
 CUM_fighter_equipment_1_short:0 "Yak-3"
 CUM_fighter_equipment_1_desc:0 "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur et monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié tant des pilotes que du personnel au sol. L'un des chasseurs de combat les plus petits et les plus légers déployés par tous les combattants pendant la guerre, son rapport puissance/poids élevé lui a conféré d'excellentes performances et il s'est avéré être un formidable chasseur de chiens."
 CUM_fighter_equipment_2:0 "Lavotchkine La-7"
 CUM_fighter_equipment_2_short:0 "La-7"
 CUM_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de combat soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau de conception de Lavochkin. Il s'agissait d'un développement et d'un perfectionnement du Lavochkin La-5, et du dernier d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 CUM_fighter_equipment_3:0 "Lavotchkine La-9"
 CUM_fighter_equipment_3_short:0 "La-9"
 CUM_fighter_equipment_3_desc:0 "La-9 représente un développement ultérieur du prototype Lavochkin La-126. Le premier prototype, désigné La-130, fut achevé en 1946. La similitude avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur avait une construction entièrement métallique et une aile à flux laminaire. Les économies de poids dues à l'élimination du bois de la cellule ont permis d'améliorer considérablement la capacité de carburant et l'armement à quatre canons. Des combats simulés ont démontré que le La-130 était à égalité avec le La-7 mais qu'il était inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, entra en production en août 1946. Au total, 1 559 avions furent construits à la fin de la production en 1948."

 CUM_jet_multirole_equipment_1:0 "Mikoyan-Gourevitch MiG-9"
 CUM_jet_multirole_equipment_1_desc:0 "Le MiG-9 Fargo a été le premier avion à réaction conçu par Mikoyan après la Seconde Guerre mondiale. Introduit en 1948. Il a été utilisé de manière limitée au combat et à l'entraînement pendant la guerre civile chinoise et la guerre de Corée. Au total, 610 avions furent produits, uniquement par l'URSS. Les derniers MiG 9 furent mis hors service par la RPC en 1951."
 CUM_jet_multirole_equipment_1_short:0 "MiG-9"
 CUM_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 CUM_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 CUM_jet_multirole_equipment_2_short:0 "MiG-15"
 CUM_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 CUM_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 CUM_jet_multirole_equipment_3_short:0 "MiG-17"
 CUM_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 CUM_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 CUM_jet_multirole_equipment_4_short:0 "MiG-19"
 CUM_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 CUM_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 CUM_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 CUM_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 CUM_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 CUM_jet_multirole_equipment_6_short:0 "MiG-21PF"
 CUM_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23M"
 CUM_jet_multirole_equipment_7_desc:0 "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
 CUM_jet_multirole_equipment_7_short:0 "MiG-23M"
 CUM_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23ML"
 CUM_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
 CUM_jet_multirole_equipment_8_short:0 "MiG-23ML"
 CUM_jet_multirole_equipment_9:0 "Mikoyan-Gourevitch MiG-23MLD"
 CUM_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
 CUM_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 CUM_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29A"
 CUM_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
 CUM_jet_multirole_equipment_10_short:0 "MiG-29A"

 CUM_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 CUM_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 CUM_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une révision du MiG-29 de base. Il a acquis une capacité multirôle plus robuste grâce à une utilisation améliorée d'armes air-air et air-sol de haute précision. Il présentait également une portée de combat considérablement accrue, grâce à une augmentation de sa capacité de carburant interne.[5]Quelques changements ont eu lieu au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger aluminium-lithium pour augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été révisée, les persiennes d'admission supérieures ont été supprimées pour laisser la place à plus de carburant dans les LERX, des tamis à mailles ont été introduits pour éviter les dommages causés par des corps étrangers (FOD) et les dimensions d'entrée ont été agrandies pour un débit d'air plus élevé."
 
 CUM_jet_light_equipment_1:0 "Mikoyan-Gourevitch MiG-9UTI"
 CUM_jet_light_equipment_1_short:0 "MiG-9UTI"
 CUM_jet_light_equipment_1_desc:0 "Pour assurer la préparation du personnel navigant de l'unité de combat des chasseurs à réaction de l'Armée de l'Air, l'équipe OKB-155, dirigée par A.I. Mikoyan, s'est vu confier le développement d'une modification biplace de l'avion MiG-9. Les travaux sur une nouvelle modification du MiG-9 en OKB-155 ont commencé en juillet 1946. La conception préliminaire du « jumeau » était prête fin octobre et conformément au calendrier de conception et de construction de l'avion, approuvé par Mikoyan le 26 août, le premier prototype a été déployé sur l'aérodrome. Prévu pour le 20 décembre 1946."
 CUM_jet_light_equipment_2:0 "Mikoyan-Gourevitch MiG-15UTI"
 CUM_jet_light_equipment_2_short:0 "MiG-15UTI"
 CUM_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 CUM_jet_light_equipment_3:0 "L-29 Delfin"
 CUM_jet_light_equipment_3_short:0 "L-29 Delfin"
 CUM_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (anglais : Dolphin, nom OTAN : Maya) est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 CUM_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 CUM_jet_light_equipment_4_short:0 "L-39 Albatros"
 CUM_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
 CUM_jet_light_equipment_5:0 "Aéro L-39ZA Albatros"
 CUM_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 CUM_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et les attaques légères, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un canon à double canon GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un chargeur de 150 cartouches dans la cellule."
 
 
 CUM_heavy_fighter_equipment_1:0 "Yakovlev Yak-9"
 CUM_heavy_fighter_equipment_1_short:0 "Yak-9"
 CUM_heavy_fighter_equipment_1_desc:0 "Le Yak-9 avait un fuselage arrière réduit avec une verrière de vision panoramique. Sa structure métallique plus légère permettait une charge de carburant et un armement accrus par rapport aux modèles précédents construits en bois. Le Yak-9 était maniable à grande vitesse à basse et moyenne altitude et facile à contrôler, ce qui en faisait l'un des chasseurs soviétiques les plus produits de la Seconde Guerre mondiale."
 CUM_heavy_fighter_equipment_2:0 "Petliakov Pe-3"
 CUM_heavy_fighter_equipment_2_short:0 "Pe-3"
 CUM_heavy_fighter_equipment_2_desc:0 "Développement ultérieur du Pe-2, le Pe-3 était un avion de combat de nuit dédié lors de son introduction en 1941, la même année que son homologue, le Pe-2. Sa conception et son utilisation ont suivi un chemin comparable à ceux empruntés par la Luftwaffe allemande avec le Junkers Ju 88 et la Royal Air Force britannique avec le De Havilland Mosquito. Utilisé avec distinction pendant la bataille de Moscou, et bien que la seule usine responsable de la construction de ce type ait été évacuée à la suite de la bataille, le Pe-3 a été utilisé tout au long du conflit, les séries de production ultérieures étant consacrées à la construction de variantes de reconnaissance de ce type."
 CUM_heavy_fighter_equipment_3:0 "Lavotchkine La-11"
 CUM_heavy_fighter_equipment_3_short:0 "La-11"
 CUM_heavy_fighter_equipment_3_desc:0 "Développé en 1947, après la fin de la Seconde Guerre mondiale, le La-11 était une évolution du La-9 « Fritz » pour créer un chasseur d'escorte à longue portée. L'avion était équipé de pneus plus gros pour s'adapter à l'augmentation du poids et aux commodités pour les longs vols, comme un rembourrage accru du siège, des accoudoirs et un urinoir. De plus, une suite complète de radionavigation a été installée. Sans surprise, les performances de combat avec une pleine charge de carburant en ont souffert. Cependant, à mesure que la charge de carburant se rapprochait de celle du La-9, les performances augmentaient également. Les pilotes de La-11 en service soviétique et plus tard chinois serviraient dans la défense aérienne, abattant des Mustangs et des avions d'attaque de construction américaine pendant la guerre de Corée. Son nom de rapport à l'OTAN est Fang."

 CUM_jet_interceptor_equipment_1:0 "Yakovlev Yak-17"
 CUM_jet_interceptor_equipment_1_desc:0 "Le Yak-17 a été exposé publiquement pour la première fois lors de la Journée de l'aviation soviétique de 1949, à l'aérodrome de Touchino. En fonctionnement, le Yak-17 présentait la plupart des mêmes défauts que son prédécesseur, notamment une vitesse et une autonomie relativement faibles, et un moteur peu fiable (toujours basé sur le Junkers Jumo 004 allemand) avec une procédure de démarrage compliquée. D'un autre côté, sa manipulation était très simple et similaire à celle des chasseurs à hélices populaires tels que le Yak-3 et le Yak-9. Cela en faisait une excellente machine de transition vers les chasseurs à réaction."
 CUM_jet_interceptor_equipment_1_short:0 "Yak-17"
 CUM_jet_interceptor_equipment_2:0 "Lavotchkine La-15"
 CUM_jet_interceptor_equipment_2_desc:0 "Le Lavochkin La-15 Fantail a été introduit dans l'armée de l'air soviétique en 1949. Bien que technologiquement l'avion soit supérieur au MiG-15, le coût de fabrication inférieur du MiG-15 signifiait qu'il était favorisé. L'avion n'a jamais participé à des combats et n'a eu qu'un déploiement limité. Les 235 avions fabriqués ont été mis hors service en 1953. Ils ont été démontés de leurs moteurs et utilisés pour des essais d'armes nucléaires."
 CUM_jet_interceptor_equipment_2_short:0 "La-15"
 CUM_jet_interceptor_equipment_3:0 "Mikoyan-Gourevitch MiG-17PF"
 CUM_jet_interceptor_equipment_3_desc:0 "Version chasseur-intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"
 CUM_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 CUM_jet_interceptor_equipment_4:0 "Soukhoï Su-9"
 CUM_jet_interceptor_equipment_4_desc:0 "Le Sukhoi Su-9 Fishpot était un intercepteur soviétique tout temps à ailes delta développé dans les années 1950. Le Su-9 a effectué son premier vol complet le 24 juin 1956 et est entré en service trois ans plus tard, en 1959. L'avion était exclusivement exploité par le 894e régiment d'aviation de chasse de l'armée de l'air soviétique et n'a jamais participé à des combats actifs. Le dernier des 1 150 avions fabriqués a quitté le service en 1979"
 CUM_jet_interceptor_equipment_4_short:0 "Su-9"
 CUM_jet_interceptor_equipment_5:0 "Soukhoï Su-11"
 CUM_jet_interceptor_equipment_5_desc:0 "Le Su-11 était une version améliorée de l'intercepteur Sukhoi Su-9 (« Fishpot »), qui avait été développé en parallèle avec le chasseur-bombardier Su-7 à ailes en flèche de l'OKB. Conscient des limites fondamentales du Su-9, Sukhoi commença à travailler sur le Su-11."
 CUM_jet_interceptor_equipment_5_short:0 "Su-11"
 CUM_jet_interceptor_equipment_6:0 "Soukhoï Su-15"
 CUM_jet_interceptor_equipment_6_desc:0 "Le Sukhoi Su-15 Flagon A était un intercepteur biréacteur développé par l'Union soviétique dans les années 1960. L'avion a effectué son premier vol au milieu de l'année 1962 et, trois ans plus tard, il est entré en service dans l'armée de l'air soviétique en 1965. De 1965 à 1979, 1 290 avions ont été produits. L'avion a également servi dans l'armée de l'air ukrainienne et a servi dans un service d'urgence limité dans l'armée de l'air russe. Il a été officiellement retiré du service en 1996."
 CUM_jet_interceptor_equipment_6_short:0 "Su-15"
 CUM_jet_interceptor_equipment_7:0 "Mikoyan-Gourevitch MiG-25P"
 CUM_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de 1964 et est officiellement entré en service en 1970. Tout au long de sa vie, plus de 1 150 avions ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. L'avion a été conçu pour intercepter rapidement des avions à très haute altitude comme le U-2 et le B-58 à une vitesse fulgurante. L'avion a donné à l'Union soviétique un contrôle bien supérieur sur son propre espace aérien éloigné que jamais auparavant. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."
 CUM_jet_interceptor_equipment_7_short:0 "MiG-25P"
 CUM_jet_interceptor_equipment_8:0 "Mikoyan-Gourevitch MiG-31"
 CUM_jet_interceptor_equipment_8_desc:0 "Le MiG-31 Foxhound est le successeur direct du MiG-25 et a été conçu comme un remplacement complet. L'avion partage la plupart des éléments de conception avec le MiG-25, présentant principalement des modifications internes. Le MiG-31 dispose de 2 sièges et de capteurs et moteurs supérieurs, le cockpit a également été modernisé pour prendre en charge un affichage tête haute et des systèmes de missiles air-air plus récents. De 1975 à 1994, 519 MiG-31 ont été produits. Il reste en service dans l'armée de l'air russe et l'armée de l'air du Kazakhstan. C'est l'un des avions de combat les plus rapides en service aujourd'hui."
 CUM_jet_interceptor_equipment_8_short:0 "MiG-31"
 CUM_jet_interceptor_equipment_9:0 "Sukhoï Su-27S"
 CUM_jet_interceptor_equipment_9_desc:0 "Le Su-27S Flanker B est la variante de production initiale du chasseur Sukhoi Su-27 de conception soviétique. L'avion était destiné à être le concurrent direct du F-14 Tomcat et du F-15 Eagle. Après avoir effectué son vol inaugural en 1977, il est entré en service plus tard en 1985. Son rôle principal était la défense aérienne à longue portée contre les bombardiers américains B-1 et B-52, ainsi que l'escorte à longue portée des bombardiers stratégiques intercontinentaux soviétiques. Jusqu'à présent, 809 avions ont été produits, qui sont toujours en service dans l'armée de l'air russe. Les autres opérateurs comprennent : l'Indonésie, l'Ukraine, le Vietnam et la Chine (désigné J-11), entre autres. L'avion restera en service dans un avenir prévisible."
 CUM_jet_interceptor_equipment_9_short:0 "Su-27S"

 CUM_stealth_fighter_equipment_1:0 "Soukhoï Su-57"
 CUM_stealth_fighter_equipment_1_desc:0 "Le Su-57 a été créé sur la base des plans du PAK-FA (acronyme signifiant Perspektivny Aviatsionny Kompleks Frontovoy Aviatsii, en russe pour « Prospective Airborne Complex of Frontline Aviation »). Il possède des capacités furtives très élevées et représente le point culminant de la technologie de l'armée de l'air russe. Doté d'une maniabilité remarquable grâce à une tuyère à vecteur de poussée et d'une excellente furtivité contre les radars, il possède des capacités de combat aérien de premier ordre."
 CUM_stealth_fighter_equipment_1_short:0 "Su-57"

 CUM_high_mach_jet_interceptor_equipment_1:0 "Yakolev Yak-25"
 CUM_high_mach_jet_interceptor_equipment_1_short:0 "Yak-25"
 CUM_high_mach_jet_interceptor_equipment_1_desc:0 ""
 CUM_high_mach_jet_interceptor_equipment_2:0 "Yakolev Yak-28P"
 CUM_high_mach_jet_interceptor_equipment_2_short:0 "Yak-28P"
 CUM_high_mach_jet_interceptor_equipment_2_desc:0 "En 1960, sur la base des Yak-27K et Yak-28, un nouvel intercepteur supersonique biplace Yak-28P a été créé. Il était destiné à combattre des cibles aériennes à basse et moyenne altitude dans une large gamme de vitesses, de jour comme de nuit, par tous les temps. L'avion était équipé du complexe d'armement K-8M-1, composé de deux missiles R-8M-1 avec imagerie thermique et radars semi-actifs et d'une station radar Orel-D. Aucune arme n'a été installée."
 CUM_high_mach_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich E-152A"
 CUM_high_mach_jet_interceptor_equipment_3_short:0 "E-152A"
 CUM_high_mach_jet_interceptor_equipment_3_desc:0 "L'intercepteur tous temps E-152A a été construit à la fin des années 1950. Il disposait d'une centrale électrique composée de 2 moteurs de série R11F-300 d'une poussée maximale de 3 880 kg chacun et d'une postcombustion de 5 740 kg. L'armement consistait en un système d'interception \"Uragan-5\", composé du radar \"TsP-1\" et du missile K-9. Sur l'avion E-152A, le calculateur SRP et le pilote automatique étaient couplés au radar TsP."
 CUM_high_mach_jet_interceptor_equipment_4:0 "Mikoyan-Gourevitch E-152M"
 CUM_high_mach_jet_interceptor_equipment_4_short:0 "E-152M"
 CUM_high_mach_jet_interceptor_equipment_4_desc:0 "La clôture du programme d'essais du missile K-9 a entraîné l'arrêt du vol sur l'E-152-2. Il a été décidé de convertir l'avion en une nouvelle version de l'E-152M en 1961. L'avion a été conçu pour l'installation d'un seul moteur R15B-300 avec une poussée sans postcombustion de 6 480 kg et une postcombustion de 10 210 kg."
 #CUM_high_mach_jet_interceptor_equipment_4:0 "Tupolev Tu-148" #By years and technology should be tier 5 - Tu-128 must be in the same year what Tu-28
 #CUM_high_mach_jet_interceptor_equipment_4_short:0 "Tu-148"
 #CUM_high_mach_jet_interceptor_equipment_4_desc:0 ""
 
 CUM_CAS_equipment_1:0 "Kochyerigin LBSh Sturmovik"
 CUM_CAS_equipment_1_short:0 "LBSh Sturmovik"
 CUM_CAS_equipment_1_desc:0 "Le Kochyerigin LBSh était un monoplan à ailes basses de construction mixte en bois et en métal développé en 1939 par Sergueï Alexandrovitch Kochyerigin. Malgré son manque de puissance, cet avion CAS affichait une puissance de feu impressionnante pour l'époque, avec 2 canons de 20 mm montés sur les ailes, 2 HMG de 7,62 mm montés sur les ailes et une charge de bombe de 600 kg (1 300 lb), avec un HMG de 7,62 mm orienté vers l'arrière pour la défense. Bien qu'initialement accepté par l'armée de l'air soviétique pour être mis en production, cette décision fut bientôt annulée et la production se tourna vers les chasseurs I-28 et Yak-1. Ce fut le premier avion CAS soviétique à recevoir le nom de Sturmovik, ce qui signifie chasseur d'attaque au sol."
 CUM_CAS_equipment_2:0 "Iliouchine Il-2 Sturmovik"
 CUM_CAS_equipment_2_short:0 "Il-2 Sturmovik"
 CUM_CAS_equipment_2_desc:0 "Illyusha, Bossu, le Flying Tank, le Flying Infantryman, tels sont quelques-uns des nombreux surnoms donnés à l'Il-2, en fait le visage de l'armée de l'air soviétique de la Seconde Guerre mondiale. Introduit en 1941, l'Il-2 était un avion d'attaque au sol qui, combiné avec son successeur, l'Il-10, était l'avion de combat le plus produit de l'histoire de l'aviation, l'Il-2 ayant produit à lui seul 36 183 unités. L'avion Il-2 a joué un rôle crucial sur le front de l'Est. Bien qu'il soit imprécis dans ses bombardements et ses attaques à la roquette, sa durabilité globale le rendait extrêmement efficace pour dévier tous les canons antiaériens de gros calibre, sauf les gros canons antiaériens, ce qui lui a valu son nom de Flying Tank. Connu sous le nom de Sturmovik, ce qui signifie avion d'attaque au sol, son nom ultérieur pour l'OTAN est Bark."
 CUM_CAS_equipment_3:0 "Iliouchine Il-10"
 CUM_CAS_equipment_3_short:0 "Il-10"
 CUM_CAS_equipment_3_desc:0 "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à de nombreux défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 participa à certaines des dernières opérations de combat en Europe, ainsi qu'à la brève intervention soviétique dans la guerre du Pacifique. Au moment où l'Il-10 a pris sa retraite du service soviétique en 1956, l'armée de l'air a délaissé les avions purement CAS et d'attaque au sol pour se tourner vers les chasseurs-bombardiers. Son nom de rapport à l'OTAN est Beast."
 CUM_CAS_equipment_4:0 "Iliouchine Il-16"
 CUM_CAS_equipment_4_short:0 "Il-16"
 CUM_CAS_equipment_4_desc:0 "L'Ilyushin Il-16 est le dernier développement de l'avion d'attaque au sol Sturmovik. Il s'agissait essentiellement d'une version réduite de l'Ilyushin Il-10, mais elle était équipée d'un moteur Mikulin AM-43NV nouvellement développé dans l'espoir qu'il serait plus rapide et plus maniable que son prédécesseur. Trois avions ont été construits à des fins d'essais, mais en raison de problèmes moteur imprévus qui n'ont pas pu être résolus, le projet a été annulé."
 
 CUM_jet_CAS_equipment_1:0 "Iliouchine IL-10M"
 CUM_jet_CAS_equipment_1_desc:0 "Le Yakovlev Yak-23 Flora était un avion d'attaque au sol de conception soviétique introduit en 1949. L'avion était un développement du chasseur à réaction Yak-15. Le Yak-23 était principalement exporté vers les pays du pacte de Varsovie, où il resta en service jusqu'à la fin des années 1950."
 CUM_jet_CAS_equipment_1_short:0 "IL-10M"
 CUM_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 CUM_jet_CAS_equipment_2_desc:0 "Conversion de chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 CUM_jet_CAS_equipment_2_short:0 "MiG-17bis"
 CUM_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 CUM_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue en dalle entièrement mobile. Equipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il y avait des dispositions pour un pack de fusées non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957 modifié pour permettre le transport de quatre nacelles de fusée."
 CUM_jet_CAS_equipment_3_short:0 "MiG-19S"
 CUM_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 CUM_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 CUM_jet_CAS_equipment_4_short:0 "Su-7B"
 CUM_jet_CAS_equipment_5:0 "Sukhoï Su-7BKL"
 CUM_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 CUM_jet_CAS_equipment_5_short:0 "Su-7BKL"
 CUM_jet_CAS_equipment_6:0 "Soukhoï Su-17M"
 CUM_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 CUM_jet_CAS_equipment_6_short:0 "Su-17M"
 CUM_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-27M"
 CUM_jet_CAS_equipment_7_desc:0 "Le MiG-27 Flogger est un avion d'attaque au sol soviétique à ailes en flèche variable. L'avion est basé sur le MiG-23 mais optimisé pour l'attaque au sol. Contrairement au MiG-23, le MiG-27 n'a pas été largement utilisé en dehors de l'URSS. De 1970 à 1986, 1 075 avions ont été produits. Le MiG-27 a été utilisé au cours des dernières étapes des guerres soviéto-afghanes et de Kargil. L'avion reste en service limité avec l'Inde et le Kazakhstan."
 CUM_jet_CAS_equipment_7_short:0 "MiG-27M"
 CUM_jet_CAS_equipment_8:0 "Soukhoï Su-25"
 CUM_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. L'avion a effectué son vol inaugural en 1975 et a été introduit en 1981. Depuis 1978, plus de 1 000 avions ont été produits. C'était un avion particulièrement populaire à l'étranger, vendu dans 29 pays. Pour cette raison, le Su-25 a été impliqué dans plusieurs conflits, notamment la guerre soviétique en Afghanistan, l'Iran-Irak et la guerre du Golfe. L'avion reste aujourd'hui en service dans tous les pays d'exportation."
 CUM_jet_CAS_equipment_8_short:0 "Su-25"

 CUM_cas_stealth_equipment_1:0 "Sukhoï Su-25SM"
 CUM_cas_stealth_equipment_1_short:0 "Su-25SM"
 CUM_cas_stealth_equipment_1_desc:0 "Le Su-25SM (Stroyevoy Modernizirovannyi) est un programme de mise à niveau « abordable » pour le Su-25, conçu par l'armée de l'air russe en 2000. Le programme découle des tentatives de mise à niveau du Su-25T et du Su-25TM, qui ont été évaluées et qualifiées de trop sophistiquées et coûteuses. La mise à niveau SM intègre des améliorations de l'avionique et une remise à neuf de la cellule pour prolonger la durée de vie du Frogfoot jusqu'à 500 heures de vol ou 5 ans. La toute nouvelle suite de navigation/attaque PRnK-25SM « Bars » du Su-25SM est construite autour du système informatique numérique BTsVM-90, initialement prévu pour le programme de mise à niveau du Su-25TM. La précision de navigation et d'attaque fournie par la nouvelle suite est trois fois supérieure à celle du Su-25 de base et se situerait à moins de 15 m en utilisant la correction satellite et à 200 m sans celle-ci."

 CUM_nav_bomber_equipment_1:0 "Iliouchine Il-4T"
 CUM_nav_bomber_equipment_1_short:0 "Il-4T"
 CUM_nav_bomber_equipment_1_desc:0 "Initialement connu sous le nom de DB-3F, l'Il-4 était un bombardier moyen performant, doté de la portée nécessaire pour effectuer même des missions de bombardement stratégiques. Cette version modifiée du DB-3 comportait de nouveaux moteurs et une tourelle dorsale améliorée (le HMG ShKAS de 7,62 mm a été remplacé par un HMG UBT de 12,7 mm). Certaines séries avaient des ailes extérieures et des fuselages avant en bois pour conserver les métaux, et tout au long de la production, les moteurs et les réservoirs de carburant ont été améliorés pour améliorer les performances tout en conservant la même autonomie. Cependant, en raison du poids supplémentaire, les moteurs ne se sont pas révélés assez puissants et étaient donc plus lents que leurs prédécesseurs immédiats. Son nom de rapport à l'OTAN est Bob"
 CUM_nav_bomber_equipment_2:0 "Tupolev Tu-2T"
 CUM_nav_bomber_equipment_2_short:0 "Tu-2T"
 CUM_nav_bomber_equipment_2_desc:0 "Le Tu-2T (version prototype ANT-62T) était la variante bombardier-torpilleur du Tu-2, développée à partir de la variante Tu-2D. La décision d'utiliser la plate-forme pour ce rôle est probablement due à la préférence de l'équipage pour le Tu-2, bien qu'il s'agisse du deuxième bombardier le plus important de l'armée de l'air soviétique pendant la Seconde Guerre mondiale (le premier étant le Pe-2). Cette variante servirait avec les pilotes de l'aviation navale soviétique au crépuscule de la Seconde Guerre mondiale et servirait pendant une grande partie de la période d'après-guerre. Comme son cousin de l'Air Force, son nom de rapport à l'OTAN est « Bat »."
 CUM_nav_bomber_equipment_3:0 "Iliouchine Il-6"
 CUM_nav_bomber_equipment_3_short:0 "Il-6"
 CUM_nav_bomber_equipment_3_desc:0 "L'Il-6 est un développement ultérieur du bombardier/bombardier torpilleur à longue portée Il-4 Bob. Initialement destiné à remplacer l'Il-4, l'Il-6 était équipé de moteurs diesel à autonomie beaucoup plus longue et économes en carburant. Il devait être doté d'un armement défensif composé de cinq canons de 20 mm. Cependant, les essais en vol ont montré que le type était difficile à contrôler à des poids élevés et à faibles vitesses, ce qui rendait l'atterrissage difficile. De plus, les moteurs étaient incapables de démarrer à basse température et réagissaient lentement aux mouvements de l'accélérateur. Malgré diverses tentatives d'amélioration, le développement fut interrompu en 1944."
 CUM_nav_bomber_equipment_4:0 "Beriev Be-6"
 CUM_nav_bomber_equipment_4_short:0 "Être-6"
 CUM_nav_bomber_equipment_4_desc:0 "Le Be-6 était un hydravion produit par le bureau de conception de Beriev, dont le premier vol a eu lieu en 1949. Il était capable d'accomplir une grande variété de missions. En plus de son rôle principal de patrouille maritime et de reconnaissance maritime, le Be-6 a également été utilisé dans les patrouilles côtières et sur les lignes de ravitaillement, dans le pose de mines, dans les bombardiers torpilleurs, les bombardiers moyens et dans les transports. Son nom de rapport USAF/OTAN est Type 34, tandis que le nom de code OTAN était Madge."
 CUM_nav_bomber_equipment_5:0 "Beriev Be-10"
 CUM_nav_bomber_equipment_5_short:0 "Être-10"
 CUM_nav_bomber_equipment_5_desc:0 "Le Be-10, également connu sous le nom d'Izdelye M, était un hydravion à turboréacteur développé par l'Union soviétique en 1956. Conçu comme un bombardier de patrouille, le Be-10 était notoirement difficile à piloter et souffrait de fatigue du métal due aux contraintes de la cellule lors des décollages et atterrissages à grande vitesse ainsi qu'à la corrosion. En tant que tel, le type a été rapidement remplacé en service par le dernier Be-12 Mail. Connu en Occident sous le nom de Mallow, une sous-variante civile modifiée, le M-10 était connu pour avoir établi 12 records du monde par la Fédération aéronautique internationale (Fédération mondiale des sports aériens) en 1961."
 CUM_nav_bomber_equipment_6:0 "Beriev Be-12N Tchaïka"
 CUM_nav_bomber_equipment_6_short:0 "Be-12N Tchaïka"
 CUM_nav_bomber_equipment_6_desc:0 "Le Be-12 a été développé en 1960 pour succéder et remplacer le Be-6 Madge et le Be-10 Mallow, et a été développé comme avion de patrouille anti-sous-marin et maritime. Contrairement à son prédécesseur immédiat, propulsé par un turboréacteur, le Be-12 était un avion propulsé par un turbopropulseur et doté également d'un train d'atterrissage rétractable, ce qui donnait à l'engin une capacité d'atterrissage amphibie. La variante N améliorée était équipée de nouveaux capteurs, d'une avionique, d'un système de recherche et d'attaque Nartsiss et d'un capteur de détecteur d'anomalies magnétiques (MAD). Connu localement sous le nom de Chayka, qui signifie mouette, son nom de rapport OTAN est Mail."
 CUM_nav_bomber_equipment_7:0 "Tupolev Tu-142"
 CUM_nav_bomber_equipment_7_short:0 "Tu-142"
 CUM_nav_bomber_equipment_7_desc:0 "Le Tupolev Tu-142 est un avion soviéto-russe de reconnaissance maritime et de guerre anti-sous-marine (ASW) dérivé du bombardier stratégique à turbopropulseur Tu-95. Une variante de communication spécialisée, désignée Tu-142MR, était chargée de communications à longue portée avec les sous-marins lance-missiles balistiques soviétiques. Le Tu-142 a été conçu par le bureau d'études Tupolev et fabriqué par les usines de machines Kuibyshev Aviation et Taganrog de 1968 à 1994. Anciennement exploité par la marine soviétique et l'armée de l'air ukrainienne, le Tu-142 sert actuellement dans la marine russe."
 CUM_nav_bomber_equipment_8:0 "Iliouchine IL-38N"
 CUM_nav_bomber_equipment_8_short:0 "IL-38N"
 CUM_nav_bomber_equipment_8_desc:0 "L'Il-38 est une adaptation du quadrimoteur à turbopropulseur Ilyushin Il-18 destiné à être utilisé comme avion de patrouille maritime pour la marine soviétique. Il répondait à une exigence visant à contrer les sous-marins américains lance-missiles balistiques. L'IL-38N est une version moderne parfois appelée Il-38SD pour Sea Dragon, qui est un nouveau système de recherche et de suivi. La version de la marine russe est équipée du système Novella P-38. Le Novella P-38 est capable de trouver des cibles aériennes à des distances allant jusqu'à 90 kilomètres et de suivre des objets de surface dans un rayon de 320 kilomètres, et peut suivre simultanément 32 cibles aériennes et sous-marines."
 CUM_aerosub_0:0 "Sous-marin volant Ouchakov LPL"
 CUM_aerosub_0_short:0 "LPL Aérosub"
 CUM_aerosub_0_Desc:0 "Dans l'entre-deux-guerres, l'Union soviétique a commencé à explorer des concepts navals et à mener de nombreuses expériences pour tenter de révolutionner le combat naval. Juste avant la Seconde Guerre mondiale, Boris Ouchakov, de l'Académie des ingénieurs navals de Dzerjinski, a proposé le concept d'un sous-marin volant, un bombardier naval qui pourrait être submergé ou réapparaître à volonté pour mener des opérations de bombardement naval. Le projet a été évoqué à plusieurs reprises par Ouchakov au cours des années suivantes et finalement, en 1938, il a été exploré de manière légèrement sérieuse. La complexité substantielle de la conception était prohibitive et le projet fut finalement annulé en 1939. Cependant, en 1943, Lavrentiy Beria relança le projet et en 1947, le premier test fut effectué. En 1953, le projet fut finalement annulé par Khrouchtchev en raison de son caractère peu pratique et du fait que les progrès étaient pratiquement inexistants car il ne pouvait même pas voler correctement."
 
 CUM_tac_bomber_equipment_0:0 "Iliouchine DB-3"
 CUM_tac_bomber_equipment_0_short:0 "DB-3"
 CUM_tac_bomber_equipment_0_desc:0 "Le DB-3 était un bombardier bimoteur à ailes basses entré en service dans l'armée de l'air soviétique en 1936. Malgré une carrière plutôt calme dans l'armée soviétique, le type a servi en Chine, au sein de l'armée de l'air nationaliste chinoise pendant la Seconde Guerre sino-japonaise. C'était également le premier bombardier soviétique à lancer un raid sur la capitale allemande, Berlin, au cours des premiers mois du front de l'Est de la Seconde Guerre mondiale. La désignation DB est un raccourci pour Dalniy Bombardirovschik, signifiant bombardier à longue portée."
 CUM_tac_bomber_equipment_1:0 "Iliouchine DB-3M"
 CUM_tac_bomber_equipment_1_short:0 "DB-3M"
 CUM_tac_bomber_equipment_1_desc:0 "Première mise à niveau majeure du DB-3."
 CUM_tac_bomber_equipment_2:0 "Petliakov Pe-2B"
 CUM_tac_bomber_equipment_2_short:0 "Pe-2B"
 CUM_tac_bomber_equipment_2_desc:0 "Le Petlyakov Pe-2 (russe : Петляков Пе-2) était un bombardier en piqué bimoteur soviétique utilisé pendant la Seconde Guerre mondiale. L'un des avions d'attaque tactique les plus remarquables de la guerre, il s'est également révélé efficace comme chasseur lourd, comme chasseur de nuit (variante Pe-3) et comme avion de reconnaissance. À bien des égards, il ressemblait au britannique en bois De Havilland Mosquito. Le Pe-2 était, numériquement, le bombardier soviétique le plus important de la Seconde Guerre mondiale, représentant à son apogée 75 % de la force de bombardiers bimoteurs soviétiques."
 CUM_tac_bomber_equipment_3:0 "Tupolev Tu-2"
 CUM_tac_bomber_equipment_3_short:0 "Ma-2"
 CUM_tac_bomber_equipment_3_desc:0 "Le Tu-2 était un bombardier de jour bimoteur à grande vitesse développé en 1941. Il a été conçu pour être la réponse soviétique au bombardier moyen Junkers Ju-88, conçu pour répondre aux exigences d'un bombardier à grande vitesse ou d'un bombardier en piqué, avec une grande charge de bombes interne et une vitesse similaire à celle d'un chasseur monoplace. Il s'est avéré suffisamment performant pour relever le défi, et des variantes de bombardiers torpilleurs, de reconnaissance et de chasseurs lourds existaient, jouant un rôle clé dans les offensives finales soviétiques de la Seconde Guerre mondiale. Son nom de rapport de l'OTAN d'après-guerre est Bat."

 CUM_jet_tac_bomber_equipment_1:0 "Iliouchine Il-22"
 CUM_jet_tac_bomber_equipment_1_short:0 "Il-22"
 CUM_jet_tac_bomber_equipment_1_desc:0 "L'Ilyushin Il-22 fut le premier bombardier soviétique à réaction à voler. Il utilisait quatre turboréacteurs Lyulka TR-1 transportés sur de courts pylônes horizontaux devant et sous l'aile. Les moteurs n'atteignaient pas leurs valeurs de poussée nominales et leur consommation de carburant était plus élevée que prévue. Ces problèmes signifiaient que l'avion ne pouvait pas atteindre les performances requises et il fut annulé le 22 septembre 1947."
 CUM_jet_tac_bomber_equipment_2:0 "Iliouchine Il-28"
 CUM_jet_tac_bomber_equipment_2_short:0 "Il-28"
 CUM_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à entrer en production à grande échelle, l'Il-28, lors de son introduction en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été progressivement retirés du service soviétique dans les années 1980, de nombreux avions de ce type sont encore en service aujourd'hui. Le nom de rapport USAF/DoD est Type 27, tandis que le nom de code OTAN est Beagle."
 CUM_jet_tac_bomber_equipment_3:0 "Yakovlev Yak-28B"
 CUM_jet_tac_bomber_equipment_3_short:0 "Yak-28B"
 CUM_jet_tac_bomber_equipment_3_desc:0 "Le Yak-28 a été développé comme un avion de combat à ailes en flèche introduit en 1960. Les variantes du bombardier Yak-28, connues sous leur nom de code OTAN Brewer, avaient des moteurs montés sur une nacelle, similaires à la lampe de poche Yak-25 à partir de laquelle il a été développé. Avec cela et l'aile en flèche, c'était un avion hautement subsonique, capable d'atteindre des vitesses transsoniques à haute altitude. Il a servi de principal bombardier léger de l'armée de l'air soviétique et a été largement utilisé par la Russie, la Biélorussie et le Turkménistan après la chute de l'Union soviétique, tous étant retirés en 1992."
 CUM_jet_tac_bomber_equipment_4:0 "Yakovlev Yak-28I"
 CUM_jet_tac_bomber_equipment_4_short:0 "Yak-28I"
 CUM_jet_tac_bomber_equipment_4_desc:0 "Version améliorée avec le système de ciblage interne \"Initsiativa-2\" Radar de cartographie au sol à 360 degrés ainsi qu'un système de ciblage contrôlé au sol utilisant la triangulation à partir de sites émetteurs au sol"
 CUM_jet_tac_bomber_equipment_5:0 "Mikoyan-Guérivitch MiG-25RBT"
 CUM_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 CUM_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBS est un bombardier de reconnaissance monoplace dérivé du MiG-25R, équipé de systèmes de reconnaissance améliorés et d'un système de bombardement automatique Peleng. L'avion peut transporter une charge de huit bombes de 500 kg (1 102 lb)."
 CUM_jet_tac_bomber_equipment_6:0 "Soukhoï Su-24"
 CUM_jet_tac_bomber_equipment_6_short:0 "Su-24"
 CUM_jet_tac_bomber_equipment_6_desc:0 "Un gros chasseur-bombardier développé par l'Union soviétique dans les années 1960 et toujours utilisé aujourd'hui. Les caractéristiques incluent ses ailes variables et son corps pointu. Il peut équiper jusqu'à 8 000 kg d'armes et est capable de lancer différents types de missiles air-sol tout en conservant une vitesse stable. Cet avion est connu sous son nom de code OTAN « Fencer ». Avec son successeur, le Su-34, il est actuellement actif comme chasseur-bombardier pour les anciens pays du camp de l'Est."
 CUM_jet_tac_bomber_equipment_7:0 "Soukhoï Su-24"
 CUM_jet_tac_bomber_equipment_7_short:0 "Su-24M"
 CUM_jet_tac_bomber_equipment_7_desc:0 "Entré en service en 1983, le Su-24M était un développement ultérieur du Su-24 à partir du moment où le type initial est entré en service. L'une des principales caractéristiques du Su-24M est l'inclusion d'une capacité de ravitaillement en vol avec une sonde de ravitaillement rétractable, un nouveau système de navigation interne et le désignateur laser Kaira-24, permettant au type d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."
 CUM_jet_tac_bomber_equipment_8:0 "Soukhoï Su-34"
 CUM_jet_tac_bomber_equipment_8_short:0 "Su-34"
 CUM_jet_tac_bomber_equipment_8_desc:0 "Un attaquant développé sur la base du Su-27 avec un cockpit en tandem. Il fait preuve d'une maniabilité de première classe pour un attaquant, avec ses mouvements agiles rivalisant de manière agressive avec les combattants de la même classe. Une armure plus épaisse augmente également son taux de survie. Le nom de code OTAN est « Fullback ». En supposant des missions d'attaque sur une période prolongée, la partie arrière des sièges pilotes dispose d'un lavabo et d'une cuisine simple."
 
 CUM_strat_bomber_equipment_1:0 "Petliakov Pe-8"
 CUM_strat_bomber_equipment_1_short:0 "Pe-8"
 CUM_strat_bomber_equipment_1_desc:0 "Bombardier lourd soviétique conçu avant la Seconde Guerre mondiale, le Pe-8 (à l'origine TB-7 jusqu'à ce que le nom change pour honorer Vladimir Petlyakov à sa mort en 1942) était le seul bombardier quadrimoteur développé pendant la guerre. Produit en nombre limité, il fut utilisé pour bombarder Berlin en août 1941. Il fut également utilisé pour des « raids de moral » destinés à remonter le moral du peuple soviétique en exposant les vulnérabilités de l'Axe. Sa mission principale, cependant, était d'attaquer de nuit les aérodromes, les gares de triage et autres installations arrière allemandes. Parce que ces avions remontaient le moral, la Luftwaffe allemande les a souvent ciblés, et un grand nombre d'entre eux ont été détruits au cours de la Grande Guerre patriotique. Après la guerre, ils servirent essentiellement de moyens de transport jusqu'à la fin des années 1950."
 CUM_strat_bomber_equipment_2:0 "Iliouchine Il-4"
 CUM_strat_bomber_equipment_2_short:0 "Il-4"
 CUM_strat_bomber_equipment_2_desc:0 "Bien que l'Il-4 ne soit qu'un bombardier moyen, il avait la portée nécessaire pour être utilisé dans des missions stratégiques. L'utilisation des bombardiers dans ce rôle n'était pas une priorité pour le VVS, mais l'Il-4 fut néanmoins utilisé lors de plusieurs raids de bombardement à longue portée contre Berlin en 1941. La plupart seraient utilisés sur des missions à plus courte portée, ajoutant souvent 1 000 kg (2 204 lb) supplémentaires de bombes sous les ailes, en plus des 2 500 kg (5 512 lb) internes."
 CUM_strat_bomber_equipment_3:0 "Tupolev Tu-4"
 CUM_strat_bomber_equipment_3_short:0 "Tu-4"
 CUM_strat_bomber_equipment_3_desc:0 "Le Tu-4 est une conception d'ingénierie inverse basée sur le B-29 Superfortress américain, développé pour répondre au besoin de Joseph Staline de disposer d'un bombardier stratégique doté de capacités similaires à celles du bombardier américain vainqueur de la guerre. Malgré le refus des États-Unis de prêter-louer le B-29, quatre B-29 se sont écrasés sur le territoire soviétique, ce qui a suffi pour lancer le processus de rétro-ingénierie. Malgré de nombreuses difficultés (obtention de pièces équivalentes ou supérieures aux pièces développées aux États-Unis, conversion du système impérial au système métrique, etc.), le premier vol et la mise en service du Tu-4 ont suffi à paniquer les États-Unis et la Grande-Bretagne, le premier d'une longue série pendant la guerre froide. Il aura cependant une courte durée de vie, remplacé par des bombardiers à réaction au milieu des années 1960. Son nom de rapport OTAN est Bull."

 CUM_jet_strat_bomber_equipment_1:0 "Tupolev Tu-16"
 CUM_jet_strat_bomber_equipment_1_short:0 "Tu-16"
 CUM_jet_strat_bomber_equipment_1_desc:0 "Le Tu-16 était un bombardier stratégique bimoteur développé en 1952 et l'un des premiers bombardiers stratégiques à réaction à entrer en service dans l'armée de l'air soviétique. Il avait une configuration à ailes en flèche et était propulsé par deux turboréacteurs Mikulin AM-3 sur les emplantures des ailes. Il pouvait transporter jusqu'à 9 000 kg (20 000 lb) de munitions, y compris des armes nucléaires et la FAB-9000, une bombe de 9 000 kg avec un rendement similaire à la bombe britannique du Grand Chelem. Connu en Occident sous le nom de Badger, ce type a servi tout au long de la guerre froide et a pris sa retraite en 1993. La variante chinoise construite sous licence, le H-6, reste en service en tant que bombardier stratégique de première ligne de la PLAAF."
 CUM_jet_strat_bomber_equipment_2:0 "Myasishchev Mya-3M Molot"
 CUM_jet_strat_bomber_equipment_2_short:0 "M-3M Molot"
 CUM_jet_strat_bomber_equipment_2_desc:0 "Le Mya-4 (ou M-4, désignation Myasishchev 2M) est un bombardier stratégique quadrimoteur entré en service en 1956. Ce bombardier était capable de longue portée, capable de frapper des cibles directement sur le continent américain à partir de bases russes, bien qu'il s'agisse d'un aller simple. Malgré cela, ainsi que d'autres tactiques de désinformation sélectives, les politiciens occidentaux et les agences de renseignement ont paniqué et ont conduit à la construction de nouveaux B-47 Stratojets et du B-52 Stratofortress récemment introduit. Les Russes l'ont officiellement surnommé Molot, ce qui signifie Marteau, tandis que l'OTAN lui a donné le nom de code Bison et que l'US Air Force l'a désigné Type 37."
 CUM_jet_strat_bomber_equipment_3:0 "Tupolev Tu-95M"
 CUM_jet_strat_bomber_equipment_3_short:0 "Tu-95M"
 CUM_jet_strat_bomber_equipment_3_desc:0 "S'il y avait jamais un bombardier qui pouvait être décrit comme le visage de la force de bombardement soviétique, ce serait bien le Tu-95. Introduit en 1956, le Tu-95 est le seul bombardier stratégique à hélice encore en service à ce jour. C'est l'un des avions militaires les plus bruyants en raison des pointes des pales de l'hélice qui se déplacent plus rapidement que la vitesse du son. Tout comme le B-52 Stratofortress américain, le bombardier Tu-95 est souvent comparé. Le Tu-95 devrait rester en service dans l'aérospatiale russe jusque dans les années 2040. Pour l'Occident, il est normal que l'avion synonyme de l'Empire soviétique reçoive le nom de code Bear"
 CUM_jet_strat_bomber_equipment_4:0 "Tupolev Tu-95KD"
 CUM_jet_strat_bomber_equipment_4_short:0 "Tu-95KD"
 CUM_jet_strat_bomber_equipment_4_desc:0 "Cette version du Tu-95 a reçu une mise à niveau avionique conçue pour transporter des missiles guidés tels que le missile air-sol Kh-20."
 CUM_jet_strat_bomber_equipment_5:0 "Myassichtchev M-20"
 CUM_jet_strat_bomber_equipment_5_short:0 "M-20"
 CUM_jet_strat_bomber_equipment_5_desc:0 "Le bombardier lourd a été développé pour répondre aux exigences de l'Air Force en matière de bombardier lourd supersonique à haute altitude, introduit en 1967, dans plusieurs configurations utilisant des solutions techniques avancées. L'avion était censé avoir une autonomie de 11 000 à 13 000 km lorsqu'il volait à une vitesse subsonique à basse altitude ; la même autonomie en vol à une vitesse de 2200-2500 km/h à une altitude de plus de 18 000 m. Le poids total de l'équipement, des armes et du chargement devait être de 24 à 25 tonnes."

 CUM_mach2stratbomber_equipment_1:0 "Tupolev Tu-22"
 CUM_mach2stratbomber_equipment_1_short:0 "Tu-22"
 CUM_mach2stratbomber_equipment_1_desc:0 "Premier bombardier supersonique à entrer en production en Union soviétique, le Tu-22 est entré en service dans l'armée de l'air soviétique en 1962. Produit en petit nombre (311 exemplaires ont été construits), ce type s'est avéré décevant, car il lui manquait la portée intercontinentale attendue d'un tel bombardier. Malgré cela, le Tu-22 a été modernisé tout au long de sa durée de vie, étant utilisé comme plate-forme de lancement pour le missile antinavire à longue portée Kh-22 (nom OTAN : AS-4 Kitchen). Son nom de code OTAN est Blinder."
 CUM_mach2stratbomber_equipment_2:0 "Tupolev Tu-22M2"
 CUM_mach2stratbomber_equipment_2_short:0 "Tu-22M2"
 CUM_mach2stratbomber_equipment_2_desc:0 "Le Tu-22M2 est un développement ultérieur du Tu-22 Blinder. Initialement désigné Tu-26, le Tu-22M était utilisé à la fois par les forces aériennes soviétiques (comme bombardier stratégique, remplaçant le Tu-22 Blinder) et par l'aviation navale soviétique (comme avion de patrouille maritime). Sa découverte par les forces américaines a provoqué un choc en Occident, d'autant plus que le premier ministre Khrouchtchev aurait déclaré que les ICBM rendraient les bombardiers obsolètes. La variante Tu-22M2 en question était la première variante majeure de production, avec des moteurs et des admissions de style F-4 Phantom qui donnaient à l'engin une vitesse de pointe de Mach 1,65. Depuis 2014, plus de 100 Tu-22M2 Blinder-B sont en service dans l'armée de l'air russe."
 CUM_mach2stratbomber_equipment_3:0 "Tupolev Tu-22M3"
 CUM_mach2stratbomber_equipment_3_short:0 "Tu-22M3"
 CUM_mach2stratbomber_equipment_3_desc:0 "Le dernier Tu-22M3, qui a volé pour la première fois en 1977, a été mis en service en 1983 et est officiellement entré en service en 1989, était équipé de nouveaux moteurs NK-25 avec beaucoup plus de puissance, de rampes d'admission en forme de coin similaires à celles du MiG-25, d'ailes avec une plus grande flèche maximale et d'un nez remodelé abritant un nouveau radar de navigation/attaque Almaz PNA (Planeta Nositel, izdeliye 030A) et un NK-45. système de navigation/attaque, qui permet un vol à basse altitude considérablement amélioré."
 CUM_mach3stratbomber_equipment_1:0 "Soukhoï T-4M Sotka"
 CUM_mach3stratbomber_equipment_1_short:0 "T-4M Sotka"
 CUM_mach3stratbomber_equipment_1_desc:0 "Le T-4M était une autre maquette du T-4 original, conçu sur la base du XB-70 Valkyrie américain. Le T-4M a été conçu avec des ailes à géométrie variable et des avant-plans canard agrandis, tout en conservant la structure du fuselage et du moteur du T-4. On pense que la vitesse maximale du T-4M serait de Mach 3, avec une vitesse de croisière de Mach 2,8."
 CUM_mach6stratbomber_equipment_1:0 "Kholod"
 CUM_mach6stratbomber_equipment_1_short:0 "Kholod"
 CUM_mach6stratbomber_equipment_1_desc:0 "Projet développé en Russie, le Kholod utilisait un moteur scramjet pour propulser un engin jusqu'à une vitesse supérieure à Mach 5,75. On sait peu de choses sur le système et on pense généralement qu'il s'agit d'un projet visant à lancer des satellites dans l'espace."
 
 CUM_nuclearstratbomber_equipment_1:0 "Tupolev Tu-119"
 CUM_nuclearstratbomber_equipment_1_short:0 "Tu-119"
 CUM_nuclearstratbomber_equipment_1_desc:0 "Le Tu-119 était le développement d'un bombardier stratégique à propulsion nucléaire dérivé du Tu-95 après avoir utilisé un avion de recherche (Tu-95LML). Le type aurait été propulsé par deux moteurs nucléaires à l'intérieur (utilisant l'énergie provenant de la chaleur générée par un réacteur nucléaire embarqué) et deux turbopropulseurs alimentés au kérosène à l'extérieur."
 CUM_nuclearstratbomber_equipment_2:0 "Myassichtchev M-60"
 CUM_nuclearstratbomber_equipment_2_short:0 "M-60"
 CUM_nuclearstratbomber_equipment_2_desc:0 "Le M-60 était la conception de Myasishchev pour un bombardier stratégique à propulsion nucléaire, lui-même basé sur la conception du bombardier stratégique M-50 Bounder. Il aurait été propulsé par quatre turboréacteurs sans postcombustion dans une configuration similaire à celle du Tu-119, deux moteurs in-bord propulsés par un réacteur nucléaire et deux moteurs hors-bord alimentés au kérosène. En raison des craintes de dommages environnementaux dus à des incidents ou à des accidents et à des dépassements de coûts, le projet serait abandonné."
 
 CUM_cv_jet_CAS_equipment_1:0 "IL-10TM"
 CUM_cv_jet_CAS_equipment_1_short:0 "IL-10TM"
 CUM_cv_jet_CAS_equipment_1_desc:0 "IL-10T amélioré"
 CUM_cv_jet_CAS_equipment_2:0 "I-216"
 CUM_cv_jet_CAS_equipment_2_short:0 "I-216"
 CUM_cv_jet_CAS_equipment_2_desc:0 "L'avion d'attaque embarqué était un avion à aile basse entièrement métallique avec une aile droite. Le support est un train d'atterrissage avec une roue avant. Armement : 6 canons NR-23 de 23 mm."
 CUM_cv_jet_CAS_equipment_3:0 "Tupolev Tu-91"
 CUM_cv_jet_CAS_equipment_3_short:0 "Tu-91"
 CUM_cv_jet_CAS_equipment_3_desc:0 "Le Tupolev Tu-91 (nom de l'OTAN Boot) était un avion d'attaque embarqué soviétique. Les consoles sont équipées de deux canons fixes de 23 mm avec 200 cartouches par canon, d'une installation de canon arrière télécommandée DK-15 avec un canon AM-23 ; armement de bombes - 1 x FAB-1500 ou 3 x FAB-500 ou 6 x FAB-250 ou 12 x FAB-100 ; bombes anti-sous-marines d'un calibre de 500 kg ou 100 kg."
 CUM_cv_jet_CAS_equipment_4:0 "Mikoyan-Gourevitch MiG-19SM-30"
 CUM_cv_jet_CAS_equipment_4_short:0 "MiG-19SM-30"
 CUM_cv_jet_CAS_equipment_4_desc:0 ""
 CUM_cv_jet_CAS_equipment_5:0 "Yak-35"
 CUM_cv_jet_CAS_equipment_5_short:0 "Yak-35"
 CUM_cv_jet_CAS_equipment_5_desc:0 "Chasseur d'attaque soviétique basé sur un porte-avions Yak-35."
 CUM_cv_jet_CAS_equipment_6:0 "Soukhoï Su-7K"
 CUM_cv_jet_CAS_equipment_6_short:0 "Su-7K"
 CUM_cv_jet_CAS_equipment_6_desc:0 ""
 CUM_cv_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-23KU"
 CUM_cv_jet_CAS_equipment_7_short:0 "MiG-23KU"
 CUM_cv_jet_CAS_equipment_7_desc:0 ""
 CUM_cv_jet_CAS_equipment_8:0 "Mikoyan-Gourevitch MiG-23KM"
 CUM_cv_jet_CAS_equipment_8_short:0 "MiG-23KM"
 CUM_cv_jet_CAS_equipment_8_desc:0 ""
 CUM_cv_jet_CAS_equipment_9:0 "Mikoyan-Gourevitch MiG-27K"
 CUM_cv_jet_CAS_equipment_9_short:0 "MiG-27K"
 CUM_cv_jet_CAS_equipment_9_desc:0 "Le MiG-27LL a été utilisé pour tester les technologies conventionnelles de décollage et d'atterrissage au cours du programme de développement du porte-avions soviétique CTOL. Le MiG-27K aurait été la version définitive."
 CUM_cv_jet_CAS_equipment_10:0 "Sukhoï Su-25UTG"
 CUM_cv_jet_CAS_equipment_10_short:0 "Su-25UTG"
 CUM_cv_jet_CAS_equipment_10_desc:0 "Le Su-25UTG est une variante du Su-25 conçue pour entraîner les pilotes à atterrir sur des porte-avions à partir d'un pont de porte-avions simulé doté de câbles d'arrêt. Introduits en 1988, ces appareils ont été conservés après la chute de l'Union soviétique lorsqu'il a été décidé que le gouvernement russe conserverait le porte-avions Admiral Kuznetsov. Ces avions pourraient être développés pour avoir une capacité de frappe similaire à celle des Su-25 basés au sol, un atout mortel pour les opérations des porte-avions."

 CUM_cv_jet_multirole_equipment_1:0 "La-15 KOR-1"
 CUM_cv_jet_multirole_equipment_1_short:0 "La-15 KOR-1"
 CUM_cv_jet_multirole_equipment_1_desc:0 ""
 CUM_cv_jet_multirole_equipment_2:0 "La-15 KOR-2"
 CUM_cv_jet_multirole_equipment_2_short:0 "La-15 KOR-2"
 CUM_cv_jet_multirole_equipment_2_desc:0 ""
 CUM_cv_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17K"
 CUM_cv_jet_multirole_equipment_3_short:0 "MiG-17K"
 CUM_cv_jet_multirole_equipment_3_desc:0 "Variante Carrierborne proposée du MiG-17."
 CUM_cv_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19K"
 CUM_cv_jet_multirole_equipment_4_short:0 "MiG-19K"
 CUM_cv_jet_multirole_equipment_4_desc:0 "Chasseur de pont proposé par la marine de l'URSS. L'armement des roquettes et des bombes comprenait quatre supports de poutre BD-3-56, sur lesquels pouvaient être suspendues deux bombes de 250 kg. Plus près du fuselage, derrière les niches du châssis, des pylônes pour blocs ORO-57K équipés d'ARS-57 NURS de 57 mm ont été montés."
 CUM_cv_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-19SK"
 CUM_cv_jet_multirole_equipment_5_short:0 "MiG-19SK"
 CUM_cv_jet_multirole_equipment_5_desc:0 "MiG-19K amélioré"
 CUM_cv_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21K"
 CUM_cv_jet_multirole_equipment_6_short:0 "MiG-21K"
 CUM_cv_jet_multirole_equipment_6_desc:0 "Variante Carrierborne proposée du MiG-21"
 CUM_cv_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23A"
 CUM_cv_jet_multirole_equipment_7_short:0 "MiG-23A"
 CUM_cv_jet_multirole_equipment_7_desc:0 "MiG-23A \"Lightning\" - la version pont du chasseur MiG-23 a été développée à l'A.I. Bureau de conception Mikoyan. Le chasseur embarqué était censé différer du MiG-23M de série par un nouveau vitrage du cockpit avec un siège de pilote surélevé pour une meilleure vue, ainsi qu'une tige non rétractable pour le ravitaillement en vol. Pour assurer l'atterrissage sur le pont, l'avion recevrait un train d'atterrissage renforcé et un crochet de frein dans la partie arrière - ce dernier nécessitait le remplacement d'une grande arête ventrale par deux petites, ainsi qu'une augmentation de la surface de la quille."
 CUM_cv_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23AI"
 CUM_cv_jet_multirole_equipment_8_short:0 "MiG-23AI"
 CUM_cv_jet_multirole_equipment_8_desc:0 "Mise à niveau proposée du MiG-23A axée sur les capacités A2A."
 CUM_cv_jet_multirole_equipment_9:0 "Mikoyan-Gourevitch MiG-23K"
 CUM_cv_jet_multirole_equipment_9_short:0 "MiG-23K"
 CUM_cv_jet_multirole_equipment_9_desc:0 "MiG-23K \"Whirlwind\" - une innovation importante du MiG-23K devait être un nouveau moteur R-100 - un moteur à deux circuits, il offrait une consommation de carburant nettement inférieure par rapport aux moteurs à circuit unique de toutes les versions précédentes de cet avion, ce qui permettait d'augmenter son autonomie."
 CUM_cv_jet_multirole_equipment_10:0 "Soukhoï Su-33"
 CUM_cv_jet_multirole_equipment_10_short:0 "Su-33"
 CUM_cv_jet_multirole_equipment_10_desc:0 "Utilisant le Su-27 comme base, cet avion embarqué a été développé pour une utilisation pratique par la marine russe. Sa capacité de vitesse est légèrement inférieure à celle des autres avions de combat de la même génération, mais il offre d'excellentes performances de virage. Son nom de code OTAN est « Flanker-D ». Les ailes principale et arrière peuvent être repliées pour s'adapter à l'espace de stockage disponible sur un porte-avions."
 
 CUM_cv_mr_stealth_fighter_equipment_1:0 "Mikoyan-Gourevitch MiG-29K"
 CUM_cv_mr_stealth_fighter_equipment_1_short:0 "MiG-29K"
 CUM_cv_mr_stealth_fighter_equipment_1_desc:0 "Le MiG-29K n'a pas été commandé en production et seuls deux prototypes ont été construits à l'origine parce que la marine russe préférait le Su-27K (plus tard rebaptisé Su-33) au début des années 1990. Mikoyan n'a pas arrêté ses travaux sur l'avion MiG-29K malgré le manque de financement depuis 1992. Le programme a été stimulé à la fin des années 1990 pour répondre à un besoin indien d'un chasseur embarqué suite à l'achat d'un ancien porte-avions soviétique, et le MiG-29K a été reçu pour la première fois par l'armée aéronavale indienne en 2009. La marine russe, dont les Su-33 approchent de la fin de leur durée de vie en 2010, a également commandé le MiG-29K en remplacement. Les MiG-29K standard de production diffèrent des prototypes par des fonctionnalités telles qu'un radar multifonction et plusieurs nouveaux écrans de cockpit ; l'adoption des contrôles HOTAS ; l'intégration de missiles air-air R-77, ainsi que de missiles pour les opérations antinavires et antiradar ; et plusieurs armes à guidage de précision au sol/frappe."
 
 CUM_stealth_tactical_bomber_equipment_1:0 "Mikoyan-Gurevich MiG-37 Furet"
 CUM_stealth_tactical_bomber_equipment_1_short:0 "Furet MiG-37"
 CUM_stealth_tactical_bomber_equipment_1_desc:0 "<FICTIONNEL> Le MiG-37 est un avion d'interdiction furtif conçu dans le but de lancer des attaques guidées avec précision sur des cibles ennemies sans être détecté par les forces d'opposition. Il s'agissait d'un projet noir développé une fois que des informations ont été révélées concernant le F-117 Nighthawk, et le développement ultérieur du MiG-37 a été réalisé à la suite de l'abattage d'un F-117 pendant la guerre du Kosovo. Son nom de rapport OTAN est Ferret."
 CUM_stealth_tactical_bomber_equipment_2:0 "Soukhoï Su-24BM"
 CUM_stealth_tactical_bomber_equipment_2_short:0 "Su-24BM"
 CUM_stealth_tactical_bomber_equipment_2_desc:0 "En 1979, V Sarov a commencé à travailler sur un développement beaucoup plus vaste du Su-24M, doté d'une baie d'armes interne pouvant contenir la plupart des armes destinées à être utilisées par le nouvel avion. Connu au sein de l'OKB sous le nom de T-6BM (Bolshaya Modifikatsiya ou grande modification) et au sein du W S sous le nom de Su-24BM, il s'agissait d'un avion beaucoup plus gros mais plus furtif que le Su-24."
 
 CUM_stealth_strategic_bomber_equipment_1:0 "Tupolev Tu-160"
 CUM_stealth_strategic_bomber_equipment_1_short:0 "Tu-160"
 CUM_stealth_strategic_bomber_equipment_1_desc:0 "Le Tupolev Tu-160 (nom OTAN : Blackjack) est un bombardier stratégique lourd supersonique à ailes à balayage variable conçu par le bureau de conception de Tupolev en Union soviétique dans les années 1970. Il s'agit de l'avion militaire supersonique Mach 2+ le plus grand et le plus lourd jamais construit et se situe à côté de l'expérimental XB-70 Valkyrie en termes de longueur totale. En 2021, il s'agit de l'avion de combat le plus grand et le plus lourd, du bombardier le plus rapide utilisé et de l'avion à voilure variable le plus grand et le plus lourd jamais piloté."
 CUM_stealth_strategic_bomber_equipment_2:0 "Tupolev PAK-DA"
 CUM_stealth_strategic_bomber_equipment_2_short:0 "PAK-DA"
 CUM_stealth_strategic_bomber_equipment_2_desc:0 "Le PAK-DA (acronyme signifiant Perspektivnyi Aviatsionnyi Kompleks Dal'ney Aviatsii, ou futur complexe aéronautique pour l'aviation à long rayon d'action) est un bombardier stratégique russe de nouvelle génération proposé en cours de développement pour l'armée de l'air russe. Bombardier stratégique furtif, le PAK DA devrait entrer en service entre 2025 et 2030, le premier avion étant livré entre 2020 et 2023, dans le but de remplacer les bombardiers Tu-95 « Bear » et Tu-160 « Blackjack »."


 CUM_jump_jet_equipment_1:0 "Yakovlev Yak-36"
 CUM_jump_jet_equipment_1_desc:0 "Le Yak-36 (également connu sous le nom d'Izdeliye V) fut la première tentative soviétique d'avion de combat à décollage et atterrissage verticaux (VTOL). Quatre démonstrateurs technologiques de pré-production ont été construits. Le premier vol a eu lieu en septembre 1963 et, au début de 1966, l'avion a effectué son premier vol complet, du décollage vertical à l'atterrissage vertical. L'avion a été présenté au public à l'occasion du 50e anniversaire de la Révolution d'Octobre. Après l'obtention de résultats prometteurs dans le programme Yak-36, la prochaine étape de développement, le Yak-38, a reçu le feu vert. Connu sous son nom de rapport OTAN Freehand."
 CUM_jump_jet_equipment_1_short:0 "Yak-36"
 CUM_jump_jet_equipment_2:0 "Yakovlev Yak-38"
 CUM_jump_jet_equipment_2_desc:0 "Le Yak-38 a été développé à partir du Yak-36 (et a donc été initialement désigné Yak-36M), bien que les deux avions aient peu de points communs. Il s'agissait du seul avion de combat VTOL opérationnel de l'aviation navale soviétique et de son premier avion embarqué à voilure fixe. Le Yak-38 a servi presque exclusivement sur le porte-avions de classe Kiev, entrant en service en 1976. L'avion n'a été utilisé aucunement au combat, mais a une fois intercepté des avions américains de l'USS Enterprise au-dessus de la mer d'Oman. Son nom de code OTAN est Forger-A"
 CUM_jump_jet_equipment_2_short:0 "Yak-38"
 CUM_jump_jet_equipment_3:0 "Yakovlev Yak-38M"
 CUM_jump_jet_equipment_3_desc:0 "Le Yak-38M était une version améliorée du Yak-38, bénéficiant d'une masse maximale au décollage de 1 000 kg (2 200 lb) supplémentaire et d'un renfort de pylône sous les ailes pour transporter 2 000 lb (910 kg) d'armes. Le Yak-38M est entré en service dans l'aviation navale soviétique. Malgré les améliorations apportées à la conception, le Forger était toujours sous-alimenté et s'est finalement révélé décevant. Ce type sera retiré lors de l'effondrement de l'Union soviétique en 1991."
 CUM_jump_jet_equipment_3_short:0 "Yak-38M"
 CUM_jump_jet_equipment_4:0 "Yakovlev Yak-141"
 CUM_jump_jet_equipment_4_desc:0 "Le Yakovlev Yak-141 Freestyle est un avion supersonique soviétique VTOL. L'avion était destiné à remplacer complètement le Yak-38 Forger et était capable d'effectuer un vol supersonique soutenu et d'être à parité avec les chasseurs terrestres soviétiques. L'avion a effectué son premier vol au début de 1987, avec le premier vol stationnaire en 1989. En 1991, le premier atterrissage naval vertical naval a été réalisé avec succès. Malgré ses promesses, le programme Freestyle a été annulé en août 1991 en raison d'un manque de financement."
 CUM_jump_jet_equipment_4_short:0 "Yak-141"

 CUM_jump_stealth_equipment_1:0 "Yakovlev Yak-43 LFI"
 CUM_jump_stealth_equipment_1_short:0 "Yak-43 LFI"
 CUM_jump_stealth_equipment_1_desc:0 "Le Yak-43 était un chasseur soviétique VTOL (décollage et atterrissage vertical) développé sous le Lyogkiy Frontovoy Istrebitel (Light Frontline Fighter/LFI) conçu comme la version au sol du malheureux Yakovlev Yak-141 Freestyle, qui n'a pas réussi à atteindre la production à la suite de l'effondrement de l'Union soviétique. Comme le Yak-141, le Yak-43 n'aurait eu qu'un seul moteur principal, ainsi que deux moteurs à levage vertical dédiés. Malheureusement, comme le Yak-141, il n'a jamais été produit, notamment à cause de l'effondrement de l'Union soviétique."
 
 CUM_recon_equipment_0:0 "Tupolev Tu-2R"
 CUM_recon_equipment_0_short:0 "Tu-2R"
 CUM_recon_equipment_0_desc:0 "Version de reconnaissance du Tu-2."
 CUM_jet_recon_equipment_0:0 "Mikoyan-Gourevitch MiG-15Rbis"
 CUM_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 CUM_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé le développement d'une variante de reconnaissance de première ligne du MiG-15 avec une caméra AFA-BA/40, qui fournit une largeur de levé en bande de 0,9 à 4,5 km avec une longueur de route de photographie de 90 à 450 km à des altitudes de 2 000 à 10 000 m. Un seul canon NR-23 a été installé sur l'avion. Pour augmenter la portée du scout, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur \"Barium-M\" et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur la machine."
 CUM_jet_recon_equipment_1:0 "Mikoyan-Gourevitch MiG-25RB"
 CUM_jet_recon_equipment_1_short:0 "MiG-25RB"
 CUM_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les tests ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. Le matériel photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station d'interférence radio active SPS-141"
 CUM_jet_recon_equipment_2:0 "Sukhoï Su-24MR"
 CUM_jet_recon_equipment_2_short:0 "Su-24MR"
 CUM_jet_recon_equipment_2_desc:0 "Variante de reconnaissance tactique dédiée. Le Su-24MR conserve une grande partie de la suite de navigation du Su-24M, y compris le radar de suivi de terrain, mais supprime le radar d'attaque Orion-A, le système laser/TV et le canon au profit de deux installations de caméras panoramiques, la caméra TV « Aist-M » (« Cigogne »), le radar aéroporté latéral (SLAR) RDS-BO « Shtik » (« Baïonnette ») et l'infrarouge « Zima » (« Hiver »). Système de reconnaissance. D'autres capteurs sont transportés sous forme de pod."
 
 CUM_naval_helicopter_equipment_1:0 "Kamov Ka-15 Poule"
 CUM_naval_helicopter_equipment_1_short:0 "Poule Ka-15"
 CUM_naval_helicopter_equipment_2:0 "Harpe Kamov Ka-20"
 CUM_naval_helicopter_equipment_2_short:0 "Harpe Ka-20"
 CUM_naval_helicopter_equipment_3:0 "Kamov Ka-25BSh Hormone-A"
 CUM_naval_helicopter_equipment_3_short:0 "Hormone Ka-25BSh-A"
 CUM_naval_helicopter_equipment_4:0 "Kamov Ka-25K Hormone-B"
 CUM_naval_helicopter_equipment_4_short:0 "Ka-25K Hormone-B"
 CUM_naval_helicopter_equipment_5:0 "Mil Mi-14PL Haze-A"
 CUM_naval_helicopter_equipment_5_short:0 "Mi-14PL Haze-A"
 CUM_naval_helicopter_equipment_6:0 "Kamov Ka-27PL Hélix-A"
 CUM_naval_helicopter_equipment_6_short:0 "Ka-27PL Helix-A"
 CUM_naval_helicopter_equipment_7:0 "Kamov Ka-27M Hélice"
 CUM_naval_helicopter_equipment_7_short:0 "Hélice Ka-27M"
 
 CUM_slbm_equipment_1:0 "R-11FM Scud"
 CUM_slbm_equipment_1_short:0 "R-11FM Scud"
 CUM_slbm_equipment_1_desc:0 "Le R-11FM est la variante navale du R-11 Zemlya, désignation OTAN Scud-A. Il a été testé pour la première fois sur une rampe de lancement à Kapustin Yar en 1955, et a été lancé à partir d'un sous-marin du projet 611 (classe Zulu) plus tard cette année-là. Le missile a été désigné opérationnel en 1959, connu sous le nom de système de lancement D-1, et a été le premier SLBM au monde. Il a été lancé 77 fois en service au total, dont 59 avec succès. Il a été complètement supprimé en 1963. "
 CUM_slbm_equipment_2:0 "R-13 Sercq"
 CUM_slbm_equipment_2_short:0 "R-13 Sercq"
 CUM_slbm_equipment_2_desc:0 "Le R-13 remplaçait le R-11FM, son développement ayant été autorisé par le Makayev Rocket Design Bureau en 1955. Les spécifications techniques finales furent approuvées au début de 1956 et le R-13 entra en service en 1961. Le Sark fut le premier SLBM soviétique à utiliser des propulseurs à vernier pour changer de cap en plus des ailerons arrière, ce qui augmenta la stabilité, l'aérodynamisme et la portée. Le R-13 pouvait parcourir 600 km et transporter jusqu'à une ogive de 2 mégatonnes. Il a été retiré du service en 1975."
 CUM_slbm_equipment_3:0 "R-21 Serbe"
 CUM_slbm_equipment_3_short:0 "R-21 Serbe"
 CUM_slbm_equipment_3_desc:0 "Le R-21 était le premier missile soviétique pouvant être lancé depuis un sous-marin immergé. Son développement a commencé en 1958, avec des vols réussis deux ans plus tard. Le R-21 avait une portée plus de deux fois supérieure à celle de ses prédécesseurs, soit 1 650 km, et pouvait transporter une ogive de 800 kt. Introduit pour la première fois en 1963, il a été retiré en 1987"
 CUM_slbm_equipment_4:0 "R-27 Serbe"
 CUM_slbm_equipment_4_short:0 "R-27 Serbe"
 CUM_slbm_equipment_4_desc:0 "Le R-27 était très similaire au R-21 en termes de conception et d'objectif. Entré en service seulement 5 ans après le R-21 en 1968, il bénéficiait d'améliorations significatives en termes de performances et de capacités, avec une portée opérationnelle de 2 400 km et une ogive de 1 mégatonne. 1 800 missiles furent finalement fabriqués et ils furent retirés du service en 1990."
 CUM_slbm_equipment_5:0 "Mouche à scie R-29"
 CUM_slbm_equipment_5_short:0 "Mouche à scie R-29"
 CUM_slbm_equipment_5_desc:0 "Le R-29 fut le premier SLBM moderne à être introduit dans la marine soviétique. Il a été déployé en 1974, avec une portée plus de 3 fois supérieure à celle du R-27, à 7 700 km, et pouvait transporter une ogive plus grande, la poussant à plus de 1 mégatonne. Il est toujours utilisé aujourd'hui et un nombre inconnu se trouve actuellement à bord des sous-marins russes."
 CUM_slbm_equipment_6:0 "Skiff R-29RM"
 CUM_slbm_equipment_6_short:0 "Skiff R-29RM"
 CUM_slbm_equipment_6_desc:0 "Le R-29RM a été conçu après le R-29, mais avec un objectif différent en tête. Bien qu'il ait une charge utile beaucoup plus petite, avec 4 ogives de 100 kt dans un MIRV, il avait une portée plus longue de 8 800 km, et davantage pouvait être installé dans 1 sous-marin. Cependant, contrairement au R-29, il a été retiré du service en 2010. "
 CUM_slbm_equipment_7:0 "Esturgeon R-39"
 CUM_slbm_equipment_7_short:0 "Esturgeon R-39"
 CUM_slbm_equipment_7_desc:0 "Le développement du R-39 a commencé au début des années 1970, avec des tests initiaux en 1979 et un déploiement en 1983. Au déploiement complet, 120 missiles étaient en service, chacun transportant 10 ogives de 150 kt et ayant une portée de 8 300 km. Dans le cadre des accords START I et II, leur destruction a commencé progressivement à partir de 1996, et le dernier R-39 a été mis hors service en 2004."
 
 CUM_irbm_equipment_1:0 "R-5 Pobéda"
 CUM_irbm_equipment_1_short:0 "R-5 Pobéda"
 CUM_irbm_equipment_1_desc:0 "Le R-5 fut la première tentative soviétique de fabrication d'un missile balistique de théâtre, ou IRBM. La variante du R-5 réellement produite était le R-5M, qui fut le premier missile nucléaire déployé par l'URSS. Il avait une portée de 1 200 km et pouvait transporter une ogive thermonucléaire jusqu'à 1 mégatonne. Il a été distribué pour la première fois en mai 1956 et installé dans les bases aériennes de l'Allemagne de l'Est à la fin de 1959. Au total, 48 lanceurs et 200 missiles ont été produits au moment de son retrait en 1967."
 CUM_irbm_equipment_2:0 "R-12 Dvina"
 CUM_irbm_equipment_2_short:0 "R-12 Dvina"
 CUM_irbm_equipment_2_desc:0 "Le R-12, successeur du R-5, était l'une des fusées soviétiques les plus produites de la guerre froide, avec 2 335 exemplaires fabriqués, et constituait l'essentiel de la menace des missiles offensifs soviétiques contre l'Europe occidentale. Le R-12 a été produit pour la première fois en octobre 1958 et mis en service en 1959. Il avait une portée maximale de 2 080 km et pouvait transporter jusqu'à une ogive thermonucléaire de 2,3 mégatonnes. Le placement des R-12 à Cuba a déclenché la crise des missiles cubains en 1963."
 CUM_irbm_equipment_3:0 "R-14 Tchousovaïa"
 CUM_irbm_equipment_3_short:0 "R-14 Tchousovaïa"
 CUM_irbm_equipment_3_desc:0 "Le Premier ministre de l'URSS a autorisé le développement du R-14 le 2 juillet 1958 et les essais en vol ont été achevés à la fin de 1961. La version lancée par Silo a été autorisée en mai 1960 et a été testée au début de 1962. Le Chusovaya avait une portée de 4 500 km et pouvait transporter une ogive allant jusqu'à 2,3 mégatonnes. Il fut mis en service en avril 1961 et les 6 derniers furent démolis en 1989 suite à un traité avec les États-Unis."
 CUM_irbm_equipment_4:0 "Coquin RT-15"
 CUM_irbm_equipment_4_desc:0 "Le RT-15 était une des premières tentatives soviétiques visant à créer un IRBM plus mobile et a été conçu pour être lancé à partir d'un châssis T-10. Il était censé être un système de lancement rapide avec une portée maximale de 2 500 km et capable de transporter une ogive de 1 Mt. Cependant, il n'a jamais été accepté dans le service général, avec un seul bataillon qui l'a utilisé, en raison d'une électronique défectueuse et d'un système d'aide au lancement faible."
 CUM_irbm_equipment_4_short:0 "Coquin RT-15"
 CUM_irbm_equipment_5:0 "Pionnier RSD-10"
 CUM_irbm_equipment_5_short:0 "Pionnier RSD-10"
 CUM_irbm_equipment_5_desc:0 "Le RSD-10 a été développé en 1966 et la conception initiale a été approuvée en 1968. Destiné à remplacer ou à augmenter les R-12 et R-14, il a été déployé pour la première fois en 1976 et distribué dans tout le Pacte de Varsovie, car le RSD-10 était le premier missile soviétique capable de frapper chirurgicalement des cibles plus petites. Plus de 650 exemplaires furent finalement produits, chacun ayant une portée de 5 500 km et capable de transporter jusqu'à 1,6 Mt d'ogive, et plus tard, un MIRV. Tous ont été détruits conformément au Traité sur les forces nucléaires à portée intermédiaire de 1991."
 CUM_irbm_equipment_6:0 "RT-21M Température 2S"
 CUM_irbm_equipment_6_short:0 "RT-21M Température 2S "
 CUM_irbm_equipment_6_desc:0 "Bien que techniquement classé par l'OTAN comme ICBM, le RT-21M avait une portée plus petite que la plupart, ainsi qu'une petite ogive, plafonnant à un maximum de 1 mégatonne. Il reposait sur un lanceur mobile et a été conçu et développé à peu près en même temps que le RSD-10. Cependant, en raison de tous les traités impliquant les armes nucléaires à la fin du 20ème siècle, le programme n'a jamais vraiment démarré et au milieu des années 1980, l'ensemble du projet a été abandonné."
 CUM_irbm_equipment_7:0 "RSD-10 Pionnier 3"
 CUM_irbm_equipment_7_short:0 "RSD-10 Pionnier 3"
 CUM_irbm_equipment_7_desc:0 "Le RSD-10 Pioneer 3 est une variante améliorée du RSD-10 original. L'avancée la plus importante concerne la portée maximale du RSD-10 3, puisqu'il a augmenté de 2 000 km, passant de 5 500 à 7 500. Développé à la fin des années 1970, il a été introduit pour la première fois dans l'armée soviétique en 1980 et transportait une triple ogive nucléaire MIRV, pouvant atteindre 50 kt chacune. Le Pioneer 3 a connu un sort similaire à l'original à la suite du Traité sur les forces nucléaires à portée intermédiaire."
 
 CUM_srbm_equipment_1:0 "R-1 Scunner"
 CUM_srbm_equipment_1_short:0 "R-1 Scunner"
 CUM_srbm_equipment_1_desc:0 "Le R-1 Scunner n'était rien de plus qu'un V-2 Rocket glorifié. Il a été produit et conçu par les mêmes scientifiques allemands qui ont créé le V-2, car ils avaient été capturés par les Soviétiques lorsque l'Armée rouge a pris la principale usine de fabrication du V-2. La raison pour laquelle les Soviétiques voulaient une copie du V-2 était davantage pour apprendre les techniques et les processus impliqués dans la construction de fusées que pour la valeur tactique réelle du R-1. La production fut personnellement autorisée par Staline (comme tous les autres missiles à l'époque) en 1947 et le Scunner entra en service en novembre 1950."
 CUM_srbm_equipment_2:0 "R-2 Frère/Soeur"
 CUM_srbm_equipment_2_short:0 "R-2 Frère/Soeur"
 CUM_srbm_equipment_2_desc:0 "Le R-2 était une amélioration majeure par rapport au R-1. Premièrement, l'autonomie a plus que doublé, passant à 600 km. Il avait également une coque plus solide, moins de problèmes de vibrations dus à un cône arrière en acier et, bien qu'il soit presque deux fois plus lourd que le R-1, il était tout aussi précis, grâce aux progrès du contrôle radio. Le premier test a eu lieu fin 1949 et il a été accepté pour le service en 1951, mais n'a été distribué à grande échelle que deux ans plus tard. Le R-2 était la dernière contrefaçon allemande directe, car les Soviétiques avaient désormais suffisamment d'expérience pour créer leurs propres modèles. "
 CUM_srbm_equipment_3:0 "R-11 Scud A"
 CUM_srbm_equipment_3_short:0 "R-11 Scud A"
 CUM_srbm_equipment_3_desc:0 "Le R-11 a été conçu sur la base de la variante Wasserfall (anti-aérienne) du V-2, mais n'était pas une imitation directe. En juillet 1955, la première version du R-11 fut acceptée dans l'armée soviétique. Cependant, le R-11M, variante définitive du R-11 et capable d'emporter une tête nucléaire, fut accepté 3 ans plus tard en 1958. Lorsqu'il était chargé d'une tête nucléaire, il avait une portée maximale de 170 km. En conséquence, il a été principalement lancé à partir de plates-formes de frappe mobiles (châssis IS-2 modifié)."
 CUM_srbm_equipment_4:0 "R-17 Scud B"
 CUM_srbm_equipment_4_short:0 "R-17 Scud B"
 CUM_srbm_equipment_4_desc:0 "Le Scud B était le missile le plus lancé - et l'un des plus produits, avec plus de 7 000 exemplaires - de la guerre froide. Conçu pour la première fois en 1959, il est entré en service en 1964. Il s'agissait d'une grande amélioration par rapport au précédent R-11, et pouvait aller plus loin, à 300 km, et transporter n'importe quoi, depuis une ogive nucléaire jusqu'à un char VX, en passant par une bombe HE. Le R-17 a été largement utilisé au Moyen-Orient, notamment lors de la guerre du Yom Kippour et de la guerre Iran-Irak. Il a été retiré du service soviétique/russe depuis un certain temps, mais certains, comme la Corée du Nord, l'utilisent encore. "
 CUM_srbm_equipment_5:0 "OTR-22 Temp S"
 CUM_srbm_equipment_5_short:0 "OTR-22 Temp S"
 CUM_srbm_equipment_5_desc:0 "L'OTR-22 Temp S était une variante améliorée du TR-1 Temp. Son concept était similaire au Scud-B et utilisait le même lanceur, mais n'était pas largement produit. Il est entré en service en 1968 et avait une portée maximale de 900 km et une seule ogive de 500 kt. Il a été retiré du service en 1989."
 CUM_srbm_equipment_6:0 "OTR-21 Tochka A"
 CUM_srbm_equipment_6_short:0 "OTR-21 Tochka A"
 CUM_srbm_equipment_6_desc:0 "L'OTR-21 était un système de lancement mobile, conçu pour être utilisé aux côtés d'une division d'infanterie régulière pour lancer des frappes précises sur des emplacements ennemis importants, comme des ponts ou des centres de commandement, ce qui le différenciait des SRBM précédents. Il avait une portée maximale de 70 km, avec une ogive de 100 kt qui pouvait être échangée contre une arme chimique, HE ou à fragmentation ; ces deux facteurs démontrent très clairement son objectif tactique. Il est entré en service en 1975 et ses trois variantes sont encore utilisées aujourd'hui. "
 CUM_srbm_equipment_7:0 "OTR-23 Ok"
 CUM_srbm_equipment_7_short:0 "OTR-23 Ok"
 CUM_srbm_equipment_7_desc:0 "L'OTR-23 a été conçu pour remplacer le Scud-B, alors obsolète, vers la fin de la guerre froide. Il a été développé au milieu des années 70 et est entré en service en 1979. Sa portée opérationnelle était de 500 km, ce qui était plus court que celui du Scud, mais il était beaucoup plus précis et transportait une ogive plus grande. Il a été interdit par le Traité sur les forces nucléaires à portée intermédiaire de 1991."
 CUM_srbm_equipment_8:0 "OTR-21 Tochka B"
 CUM_srbm_equipment_8_short:0 "OTR-21 Tochka B"
 CUM_srbm_equipment_8_short_desc:0 "L'OTR-21 Tochka-B était une version améliorée du Tochka-A. Développé pour la première fois en 1986, il est entré en service en 1989. Un propulseur amélioré a poussé sa portée maximale jusqu'à 120 km, mais il transportait la même ogive et servait par ailleurs le même objectif que le Tochka-A. Il est toujours en service aujourd'hui."
 CUM_srbm_equipment_9:0 "9K720 Iskander"
 CUM_srbm_equipment_9_short:0 "9K720 Iskander"
 CUM_srbm_equipment_9_desc:0 "Le 9K720 a été conçu pour remplacer les OTR-21 au début de 2020. Les travaux de développement ont commencé en 1986 et se sont poursuivis sans être affectés par l'effondrement de l'Union soviétique, puisque les premiers lancements ont eu lieu en 1996. La version la plus récente, l'Iskander-M, a une portée de 500 km et peut transporter tout type d'ogive, nucléaire ou autre, jusqu'à 700 kg. La plupart de l'armée russe utilise désormais le 9K720, mais certains anciens systèmes Tochka-B subsistent. "
 
 CUM_icbm_equipment_1:0 "R-9 Desna"
 CUM_icbm_equipment_1_short:0 "R-9 Desna"
 CUM_icbm_equipment_1_desc:0 "Le R-9 Desna était un ICBM à deux étages, conçu en 1959 et testé pour la première fois en 1961. Le missile, capable de transporter une charge utile de 1 600 kg/une ogive de 5 Mt sur environ 11 000 km, était non seulement très précis, mais était également beaucoup plus utile sur le plan tactique pour l'Union soviétique, car il pouvait être ravitaillé et prêt à être lancé en moins de 20 minutes. Il a été introduit en service actif pour la première fois en 1964 et a été utilisé par 3 régiments terrestres et 1 régiment de silos. En 1976, tous les R-9 étaient mis hors service."
 CUM_icbm_equipment_2:0 "RT-2 sauvage"
 CUM_icbm_equipment_2_short:0 "RT-2 sauvage"
 CUM_icbm_equipment_2_desc:0 "Le RT-2 Savage était un ICBM à trois étages comparable au Minuteman américain. Il a terminé ses essais en vol au début de 1966 et est entré en service en 1968. Il avait une portée opérationnelle de 10 186 km et était équipé d'une seule ogive de 600 kt. Environ 100 exemplaires ont été construits et le RT-2 a été retiré du service en 1976 avec les R-9 restants."
 CUM_icbm_equipment_3:0 "R-36M Satan"
 CUM_icbm_equipment_3_short:0 "R-36M Satan"
 CUM_icbm_equipment_3_desc:0 "Le R-36M était une version bien améliorée et bien plus meurtrière du R-36. Un ICBM à deux étages capable de parcourir 16 000 km, il pouvait transporter un nombre inégalé de 10 ogives ou plus et, grâce à sa conception, son temps de rechargement rapide et son grand nombre de véhicules de rentrée, il donnait aux Soviétiques un avantage en matière de capacités de première frappe. Le développement du R-36M a commencé à la fin des années 1970 et, à la chute de l'URSS, il existait 308 silos de lancement pour le missile, chacun pouvant en contenir au moins deux. Certains R-36M sont encore en service aujourd'hui."
 CUM_icbm_equipment_4:0 "RT-23 Molodets"
 CUM_icbm_equipment_4_short:0 "RT-23 Molodets"
 CUM_icbm_equipment_4_desc:0 "Le RT-23 a été conçu pour être un système d'armes à plate-forme de lancement multiple, capable de tirer depuis un silo et un wagon. Il a été testé au début des années 80 et déployé en 1987. La portée opérationnelle du RT-23 était de 11 000 km et il pouvait transporter 10 MIRV de 550 kt. En septembre 1991, environ 90 exemplaires ont été déployés et, lorsque l'Union soviétique s'est effondrée, l'usine de production a été fermée."
 CUM_icbm_equipment_5:0 "RT-2PM2 Topol-M"
 CUM_icbm_equipment_5_short:0 "RT-2PM2 Topol-M"
 CUM_icbm_equipment_5_desc:0 "Le RT-2PM2 est l'un des derniers modèles d'ICBM en service en Russie et a été la première fusée russe produite après la chute de l'Union soviétique. Développé à la fin des années 1980 en réponse à l'Initiative de défense stratégique américaine, il est finalement entré en service en 1998. Arme à 3 étages, le RT-2PM2 a une portée maximale de 11 500 km et une ogive de 1 mégatonne. Actuellement, environ 90 sont déployés."
 
 CUM_cruisemissile_equipment_0:0 "Chelomey 14Kh"
 CUM_cruisemissile_equipment_0_short:0 "Chelomey 14Kh"
 CUM_cruisemissile_equipment_0_desc:0 "En octobre 1944, piqué par les fusées V-1 et V-2, Staline chargea Vladimir Chelomey de rechercher et de concevoir une arme similaire. La première tentative de Chelomey était un V-1 d'ingénierie inverse appelé 10kh, propulsé par le même moteur qu'un V-1. Le 14kh était une version révisée et améliorée, avec des stabilisateurs et des ailes, ainsi qu'une meilleure conception structurelle globale et une plus grande portée opérationnelle."
 CUM_cruisemissile_equipment_1:0 "Chelomey 18Kh"
 CUM_cruisemissile_equipment_1_short:0 "Chelomey 18Kh"
 CUM_cruisemissile_equipment_1_desc:0 "Le 18Kh fut plus tard sur la ligne de développement des missiles de Chelomey. Lors de sa production, il présentait des améliorations similaires au 14Kh que le 14Kh avait sur le 10Kh. Il pouvait aller plus loin, avait une ogive plus grosse, était plus stable et disposait d'un moteur Chelomey D-6 plus puissant. Il s'agissait cependant encore d'une conception très précoce et rudimentaire dans le domaine des missiles de croisière."
 CUM_cruisemissile_equipment_2:0 "La-350 Bouria"
 CUM_cruisemissile_equipment_2_short:0 "La-350 Bouria"
 CUM_cruisemissile_equipment_2_desc:0 "Le Burya était un missile de croisière intercontinental supersonique développé pour la première fois en 1954. Il pouvait parcourir 6 000 km à mach 3 avec une petite ogive de la taille d'une bombe, fonctionnant sur un moteur à deux étages composé d'un propulseur de fusée et d'un statoréacteur. Cependant, le projet a été annulé en 1960 en raison des avantages des IR et des ICBM, à savoir une plus grande simplicité et une relative invulnérabilité à l'interception, que le La-350 ne possédait pas."
 CUM_cruisemissile_equipment_3:0 "RSS-40 Bourane"
 CUM_cruisemissile_equipment_3_short:0 "RSS-40 Bourane"
 CUM_cruisemissile_equipment_3_desc:0 "Le Buran était un missile de croisière intercontinental similaire dans son concept au La-350, et a en fait été développé parallèlement au Burya, recevant l'autorisation des semaines après le La-350. Il avait une plus grande portée, une vitesse de pointe plus élevée et pouvait transporter une ogive plus grande, mais connut le même sort que le La-350 lorsqu'il fut annulé en novembre 1957."
 CUM_cruisemissile_equipment_4:0 "Radouga RK-55"
 CUM_cruisemissile_equipment_4_short:0 "Radouga RK-55"
 CUM_cruisemissile_equipment_4_desc:0 "Le RK-55 était un missile de croisière lancé à la fois par terre et par sous-marin, capable de transporter une ogive nucléaire. Développé pour la première fois à la fin des années 1960, le RK-55 a subi des vols d'essai en 1976. Alors qu'il était sur le point d'entrer en service en 1987, il a été interdit en vertu des directives établies par le Traité sur les forces nucléaires à portée intermédiaire. Des rapports provenant de sources contemporaines indiquent qu'il a été converti en arme conventionnelle et qu'il est encore utilisé aujourd'hui par les sous-marins."
 CUM_cruisemissile_equipment_5:0 "Calibre 3M-54"
 CUM_cruisemissile_equipment_5_short:0 "Calibre 3M-54"
 CUM_cruisemissile_equipment_5_desc:0 "Le 3M-54 est un missile de croisière supersonique extrêmement polyvalent et touche-à-tout. Capable d'être lancé depuis le sol, les airs, ainsi que depuis des navires de surface et des sous-marins, il est aujourd'hui largement utilisé par l'armée russe. Développé pour la première fois à la fin des années 1980, le 3M-54 est entré en service en 1994. Il a une portée de 660 km et peut transporter jusqu'à 500 kg d'arme nucléaire ou conventionnelle."
 CUM_cruisemissile_equipment_6:0 "3M22Zircon"
 CUM_cruisemissile_equipment_6_short:0 "3M22Zircon"
 CUM_cruisemissile_equipment_6_desc:0 "Le 3M22 est un missile de croisière hypersonique anti-navire propulsé par scramjet actuellement en cours de test en Russie. Les prototypes ont été lancés pour la première fois en 2012 à partir d'un Tu-22M3, puis à partir d'une plateforme au sol en 2016. En 2019, Vladimir Poutine a annoncé qu'il était capable d'atteindre Mach 9. Il aurait une portée d'environ 500 km et serait capable d'emporter jusqu'à 400 kg d'ogive."
 
