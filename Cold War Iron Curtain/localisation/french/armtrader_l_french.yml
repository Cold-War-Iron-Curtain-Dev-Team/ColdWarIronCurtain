 CAP_fighter_equipment_1:0 "Curtiss P-40 Warhawk"
 CAP_fighter_equipment_1_short:0 "Faucon de guerre P-40"
 CAP_fighter_equipment_1_desc:0 "Le P-40 était un avion de combat monomoteur entièrement métallique développé en 1938 et était une version modifiée du P-36 Hawk. Ce type serait utilisé par un nombre important de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il soit inférieur aux derniers P-47 et P-51, il servirait en première ligne jusqu'à la fin de la guerre. 200 pilotes alliés de 7 pays différents, des États-Unis aux pays du Commonwealth britannique en passant par l'Union soviétique, sont devenus des as du P-40. Malgré les désignations différentes pour le service du Commonwealth et le service soviétique, le surnom officiel du service américain est « Warhawk »."
 CAP_fighter_equipment_2:0 "République F-47 Thunderbolt"
 CAP_fighter_equipment_2_short:0 "F-47 Tonnerre"
 CAP_fighter_equipment_2_desc:0 "Le P-47 était le développement ultérieur des avions Seversky (le prédécesseur de Republic) P-35 et Republic P-43 Lancer. Bien qu'il ait été conçu à l'origine comme un chasseur de supériorité aérienne. La renommée du P-47 était sa capacité à transporter une lourde charge de bombes, marquant ainsi le début de l'héritage de l'entreprise en matière de développement d'avions d'appui aérien rapproché (CAS). Ce type a été utilisé dans une myriade de nations alliées pendant la Seconde Guerre mondiale et a continué à fonctionner ainsi après la guerre, certains affirmant que ce type, et non le P-51 Mustang, aurait dû être utilisé en Corée. Son surnom est « Thunderbolt », le premier dans les conventions de dénomination modernes de Republic. A été rebaptisé F-47 en 1948."
 CAP_fighter_equipment_3:0 "F-51D Mustang nord-américain"
 CAP_fighter_equipment_3_short:0 "F-51D Mustang"
 CAP_fighter_equipment_3_desc:0 "Le P-51 est considéré comme l'un des meilleurs chasseurs jamais produits dans l'histoire de l'aviation. Développé par North American Aviation. Le type est entré en service en 1942. Initialement utilisé comme avion de reconnaissance tactique, le type allait, avec l'introduction de la variante « D », devenir célèbre comme le premier chasseur à domination aérienne au monde, assurant l'escorte des bombardiers américains et alliés lors des campagnes de bombardement les plus célèbres du théâtre européen, détruisant près de 5 000 avions pendant la guerre. Plus tard désigné F-51, il servira avec distinction comme avion CAS pendant la guerre de Corée, et le « Mustang », le cheval de trait de l'USAAAF, continuera son service jusqu'en 1968."

 CAP_heavy_fighter_equipment_1:0 "Lockheed P-38 Foudre"
 CAP_heavy_fighter_equipment_1_short:0 "Foudre P-38"
 CAP_heavy_fighter_equipment_1_desc:0 "Un avion à double moteur à pistons conçu en mettant l'accent sur la vitesse et les armements lourds. Pendant la Seconde Guerre mondiale, sa vitesse a été utilisée dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme particulière lui a valu le nom de « der Gabelschwanz-Teufel » ou « le diable à queue fourchue » en Allemagne et de « Ni hikouki, ippairotto » ou « deux avions, un pilote » au Japon. Il est également connu sous le nom de « Foudre »."
 CAP_heavy_fighter_equipment_2:0 "Northrop F-61 Veuve Noire"
 CAP_heavy_fighter_equipment_2_short:0 "F-61 Veuve Noire"
 CAP_heavy_fighter_equipment_2_desc:0 "Le P-61, comme le P-38 avant lui, est un avion à double flèche conçu en 1944. C'était le premier chasseur de nuit américain, équipé d'un radar (une autre première) pour suivre les bombardiers et autres cibles et les intercepter la nuit et dans des conditions météorologiques défavorables. Associé à ses quatre canons Hispano de 20 mm, le P-61 (plus tard F-61), surnommé la « Veuve noire » d'après la célèbre araignée américaine, est aussi mortel que son nom l'indique."
 CAP_heavy_fighter_equipment_3:0 "F-82 Twin Mustang nord-américain"
 CAP_heavy_fighter_equipment_3_short:0 "F-82 Twin Mustang"
 CAP_heavy_fighter_equipment_3_desc:0 "Développé à l'origine comme chasseur d'escorte à longue portée pour la Seconde Guerre mondiale, le P-82 a été introduit en 1946, trop tard pour servir dans le conflit. Développé à partir du vénéré P-51, le P-82 (plus tard F-82) a été utilisé en remplacement du P-61 Black Widow et a été équipé d'un radar pour soutenir le Commandement stratégique aérien. Parce que la cellule ressemble à 2 P-51 en kit, elle a reçu le surnom de « Twin Mustang »."

 CAP_strat_bomber_equipment_1:0 "Forteresse volante Boeing B-17"
 CAP_strat_bomber_equipment_1_short:0 "Forteresse volante B-17"
 CAP_strat_bomber_equipment_1_desc:0 "Le B-17 est un bombardier stratégique quadrimoteur développé au milieu des années 1930 pour l'US Army Air Corps. C'était le troisième bombardier le plus produit pendant la Seconde Guerre mondiale et il a servi avec distinction sur le théâtre européen du conflit, responsable des campagnes de bombardement en Allemagne à partir de bases du sud de l'Angleterre et de l'Italie. Son armement défensif hérissé convient parfaitement à un avion surnommé la « Forteresse volante »."
 CAP_strat_bomber_equipment_2:0 "Libérateur B-24 consolidé"
 CAP_strat_bomber_equipment_2_short:0 "Libérateur B-24"
 CAP_strat_bomber_equipment_2_desc:0 "Le B-24 a été conçu en 1941 comme bombardier lourd à long rayon d'action pour l'US Army Air Force. Malgré sa capacité à transporter une lourde charge de bombes associée à une vitesse de croisière élevée, il était relativement difficile de voler à basse altitude et avait un plafond de service inférieur à celui du B-17. Pourtant, le « Liberator » a été préféré par l'état-major américain et a été le bombardier le plus produit pendant la Seconde Guerre mondiale. Comme le B-17, il a bien servi sur le théâtre européen lors de la campagne de bombardement de l'Allemagne, mais a également servi avec distinction sur le théâtre du Pacifique."
 CAP_strat_bomber_equipment_3:0 "Boeing B-29 Superforteresse"
 CAP_strat_bomber_equipment_3_short:0 "Superforteresse B-29"
 CAP_strat_bomber_equipment_3_desc:0 "Le B-29 était un bombardier quadrimoteur à hélices introduit en 1944. Il s'agissait du projet d'armement le plus coûteux jamais réalisé pendant la guerre, dépassant même le coût du programme d'armes nucléaires des États-Unis à l'époque. Conçu comme un bombardier stratégique à haute altitude, il a été utilisé comme bombardier incendiaire nocturne à basse altitude, lançant des raids à la bombe incendiaire sur le Japon. Mais la renommée de la « Superforteresse » réside dans le largage des bombes atomiques sur Hiroshima et Nagasaki, qui ont contribué à la fin de la guerre. Les variantes mises à jour (y compris le B-50 redésigné) continueraient à servir de bombardier stratégique pendant la guerre de Corée avant de prendre leur retraite au début des années 1950."

 CAP_tac_bomber_equipment_0:0 "Douglas B-18 Bolo"
 CAP_tac_bomber_equipment_0_short:0 "B-18 Bolo"
 CAP_tac_bomber_equipment_0_desc:0 "Le B-18, introduit en 1936, était un bombardier moyen développé pour remplacer le précédent Martin B-10. Bien que décent au moment de son introduction. Il fut rapidement rendu obsolète en 1940, et relégué aux avions de guerre anti-sous-marine et de transport. Malgré cela, le « Bolo» allait devenir le premier avion américain à couler un sous-marin allemand pendant la Seconde Guerre mondiale."
 CAP_tac_bomber_equipment_1:0 "Douglas B-23 Dragon"
 CAP_tac_bomber_equipment_1_short:0 "Dragon B-23"
 CAP_tac_bomber_equipment_1_desc:0 "Développé comme successeur raffiné du B-18 Bolo, le B-23 était plus rapide et transportait une charge de bombes et un armement défensif plus lourds. Cependant, le « Dragon » s'est avéré inférieur à ses contemporains, les B-25 et B-26, et a été largement relégué au rang d'avion d'entraînement pendant la Seconde Guerre mondiale."
 CAP_tac_bomber_equipment_2:0 "B-25 Mitchell nord-américain"
 CAP_tac_bomber_equipment_2_short:0 "B-25 Mitchell"
 CAP_tac_bomber_equipment_2_desc:0 "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres impliquant des avions pendant la guerre, l'utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardement aérien réussie sur le continent japonais pendant la guerre. Son surnom est « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
 CAP_tac_bomber_equipment_3:0 "Martin B-26 Maraudeur"
 CAP_tac_bomber_equipment_3_short:0 "Maraudeur B-26"
 CAP_tac_bomber_equipment_3_desc:0 "Le B-26 a été développé en 1941 comme bombardier moyen parallèlement au B-25. Un avion difficile à piloter au départ, il a été étiqueté comme « Widowmaker » en raison du nombre de fois où les pilotes formés à ce type se sont écrasés et sont morts. Après que des modifications aient été apportées et que les pilotes soient correctement formés, il s'est avéré être un bombardier tactique performant, servant en Europe occidentale ainsi que sur les théâtres du Pacifique et de la Méditerranée pendant la Seconde Guerre mondiale. Surnommé « Marauder », le type prendra sa retraite en 1947, avant que l'armée de l'air ne soit séparée par l'armée (et c'est la raison pour laquelle l'A-26 Invader a été brièvement nommé B-26.)"

 CAP_nav_bomber_equipment_1:0 "Douglas XTBD-1"
 CAP_nav_bomber_equipment_1_short:0 "XTBD-1"
 CAP_nav_bomber_equipment_1_desc:0 "Le prototype XTBD-1 a été développé en 1935 et était considéré, au moment de son premier vol, comme le bombardier torpilleur le plus avancé au monde. Propulsé par un seul moteur de 800 ch et équipé d'une soute à bombes pour transporter une seule torpille ou une grosse bombe, l'avenir du XTBD-1 était considéré comme prometteur."
 CAP_nav_bomber_equipment_2:1 "Grumman TBF Vengeur"
 CAP_nav_bomber_equipment_2_short:1 "Vengeur TBF"
 CAP_nav_bomber_equipment_2_desc:0 "Introduit en 1941 et servi à temps pour la bataille de Midway (où, comme son prédécesseur, il eut de mauvais résultats), le TBF allait devenir l'un des bombardiers-torpilleurs les plus remarquables de la Seconde Guerre mondiale, infligeant des défaites aux adversaires navals japonais et faisant honneur à son surnom d'« Avenger ». Ce type sera amélioré après la guerre et servira dans la marine américaine jusque dans les années 1960."
 CAP_nav_bomber_equipment_3:0 "Corsaire consolidé PB4Y-2"
 CAP_nav_bomber_equipment_3_short:0 "Corsaire PB4Y-2"
 CAP_nav_bomber_equipment_3_desc:0 "Le Consolidated PB4Y-2 Privateer est un bombardier de patrouille américain de la Seconde Guerre mondiale et de la guerre de Corée dérivé du Consolidated B-24 Liberator."

 CAP_cv_CAS_equipment_1:0 "Northrop BT"
 CAP_cv_CAS_equipment_1_short:0 "Northrop BT"
 CAP_cv_CAS_equipment_1_desc:0 "Le Northrop BT a été développé en 1935 alors que Northrop était une filiale de Douglas Aircraft Corporation. Premier avion doté d'un train d'atterrissage tricycle fixe à atterrir sur un porte-avions, ce type sera développé plus tard par Douglas pour devenir le bombardier en piqué SBD Dauntless."
 CAP_CAS_equipment_2:0 "Douglas A-20 Ravage"
 CAP_CAS_equipment_2_short:0 "A-20 ravages"
 CAP_CAS_equipment_2_desc:0 "L'A-20, surnommé « Havoc », a été introduit en 1941 comme bombardier léger et avion d'attaque au sol. En service aux États-Unis et dans le Commonwealth, sa renommée est venue de son service dans l'armée de l'air et la marine de l'Union soviétique, qui ont reçu les deux tiers de la variante A-20B et de nombreux modèles G&H. Modifiés avec des mitrailleuses de 7,62 mm à tir plus rapide et un canon à tir vers l'avant, ces types ont servi avec distinction sur le front de l'Est contre les chars allemands et ont été les bombardiers de fabrication étrangère les plus nombreux utilisés par l'armée de l'air soviétique pendant la Seconde Guerre mondiale. Les variantes de chasseurs étaient également appelées P-70."
 CAP_CAS_equipment_3:0 "A-36 Apache nord-américain"
 CAP_CAS_equipment_3_short:0 "A-36 Apache"
 CAP_CAS_equipment_3_desc:0 "L'A-36 a été développé comme une variante d'attaque au sol du célèbre P-51 Mustang. Bombardier en piqué, il s'est bien comporté en Afrique du Nord, en Méditerranée, en Italie et sur les théâtres Chine-Birmanie-Inde de la Seconde Guerre mondiale. Connu pour ses aérofreins rectangulaires distinctifs au bout des ailes. L'« Apache », du nom de la tribu amérindienne, s'est révélé mortel au cours de sa courte carrière, servant de 1942 jusqu'à sa retraite à la fin de la guerre en 1945."

 CAP_CAS_equipment_4:0 "Douglas A-26C Envahisseur"
 CAP_CAS_equipment_4_short:0 "Envahisseur A-26C"
 CAP_CAS_equipment_4_desc:0 "L'A-26 est un avion d'attaque rapide bimoteur développé et destiné à remplacer l'A-20 Havoc. Introduit en 1943, l'Invader a servi dans l'armée de l'air américaine pendant la Seconde Guerre mondiale, attaquant les positions japonaises dans les Indes néerlandaises et aux Philippines, ainsi qu'en Europe lors de campagnes dans la vallée du Pô, dans le nord de l'Italie. Ils ont continué leur service en Corée, participant à des missions de bombardement contre la Corée, et ont été les premiers avions à lancer une sortie dans ce conflit. L'« Invader » a poursuivi sa carrière au Vietnam, soutenant les opérations de la CIA au Laos contre les forces vietcongs. Avec une riche carrière au cours de trois guerres, l'« Invader » a fait ses preuves et a montré de quoi un avion CAS était capable."
 CAP_cv_CAS_equipment_4:0 "Douglas AD Skyraider"
 CAP_cv_CAS_equipment_4_short:0 "Douglas AD Skyraider"
 CAP_cv_CAS_equipment_4_desc:0 "Le Douglas AD est un engin d'attaque rapide fiable basé sur un porte-avions. Conçu à l'origine comme un bombardier torpilleur et en piqué, l'AD (à l'origine le BT2D) est entré en service en 1946 et se comportera avec une grande distinction pendant la guerre de Corée, devenant ainsi le principal avion d'attaque au sol des forces de l'US Navy et du Marine Corp. Même si la plupart des avions à hélices seraient retirés du service après le conflit coréen, le nouveau A-1 resta en service et joua un rôle clé en tant qu'avion d'appui aérien rapproché, et le « Skyraider » servira avec distinction jusqu'à la fin de l'implication américaine au Vietnam."

 CAP_cv_nav_bomber_equipment_1:0 "Douglas À déterminer Dévastateur"
 CAP_cv_nav_bomber_equipment_1_short:0 "Dévastateur à déterminer"
 CAP_cv_nav_bomber_equipment_1_desc:0 "Lorsque le TBD est entré en service en 1937, il était encore largement considéré comme l'un des meilleurs bombardiers torpilleurs lors de son introduction. Cependant, malgré quelques succès au début de la guerre, au moment de l'attaque japonaise sur Pearl Harbor, le « Devastator » était malheureusement obsolète, et cela s'est avéré tel au moment de la bataille de Midway, lorsque presque toute la force des Devastators utilisés dans la bataille a été anéantie. Bien que attribué plus tard à une mauvaise couverture aérienne et à des défauts de la torpille qu'il transportait normalement. Le TBD a été progressivement retiré du service actif immédiatement après la bataille et complètement retiré du service en 1944."
 CAP_cv_nav_bomber_equipment_2:0 "Grumman TBF-1C Vengeur"
 CAP_cv_nav_bomber_equipment_2_short:0 "Vengeur TBF-1C"
 CAP_cv_nav_bomber_equipment_2_desc:0 "La variante TBF-1C de l'Avenger a amélioré la conception originale du TBF-1 en prévoyant deux mitrailleuses de 12,7 mm (calibre.50) montées sur les ailes et des réservoirs de carburant montés sur les ailes qui ont doublé la portée et la puissance d'attaque vers l'avant de l'avion."
 CAP_cv_nav_bomber_equipment_3:0 "Corsaire consolidé PB4Y-2"
 CAP_cv_nav_bomber_equipment_3_short:0 "Corsaire PB4Y-2"
 CAP_cv_nav_bomber_equipment_3_desc:0 "Le Consolidated PB4Y-2 Privateer est un bombardier de patrouille américain de la Seconde Guerre mondiale et de la guerre de Corée dérivé du Consolidated B-24 Liberator."

 CAP_CAS_equipment_1:0 "Northrop A-17"
 CAP_CAS_equipment_1_short:0 "A-17"
 CAP_CAS_equipment_1_desc:0 "L'A-17 était un avion d'attaque monoplan biplace et monomoteur développé en 1935 et dérivé du Northrop Gamma 2F. Un avion fiable et populaire. Ce type servirait d'avion de patrouille côtière pour les unités ennemies qui pourraient traverser le canal de Panama au cours des premières étapes de la Seconde Guerre mondiale après Pearl Harbor, et serait utilisé à titre utilitaire jusqu'à sa retraite en 1944."
 CAP_cv_CAS_equipment_2:0 "Douglas SBD-2 Intrépide"
 CAP_cv_CAS_equipment_2_short:0 "SBD-2 Intrépide"
 CAP_cv_CAS_equipment_2_desc:0 "Le SBD-2 a été conçu comme avion de reconnaissance et bombardier en piqué en 1940 et était le principal avion de ce type pour la marine américaine. Le « Dauntless », déjà un bombardier en piqué performant, a été amélioré avec la variante -2 avec un armement différent et une capacité de carburant accrue, n'était qu'un pis-aller mineur par rapport aux modèles ultérieurs. Les variantes de l'USAAF l'appelaient l'A-24 Banshee."
 CAP_cv_CAS_equipment_3:0 "Curtiss SB2C-1 Helldiver"
 CAP_cv_CAS_equipment_3_short:0 "SB2C-1 Helldiver"
 CAP_cv_CAS_equipment_3_desc:0 "Remplaçant le SBD Dauntless, le SB2C, introduit en 1942, était bien plus rapide que le SBD qu'il remplaçait, mais c'était un avion difficile à piloter, ce qui lui valut le surnom désobligeant de « SOB, 2e classe ». Malgré cela et un rapport cinglant qui gâchera à jamais l'héritage de la Curtiss Aircraft Company, le « Helldiver » eut un excellent bilan de combat tout au long de la guerre du Pacifique. La variante de l'USAAF l'appelait A-25 Shrike."

 CAP_cv_fighter_equipment_0:0 "Grumman FF 'Fifi'"
 CAP_cv_fighter_equipment_0_short:0 "FF 'Fifi'"
 CAP_cv_fighter_equipment_0_desc:0 "Introduit en 1933, le Grumman FF fut le premier modèle complet de l'entreprise destiné à la marine américaine. Surnommé de manière informelle « Fifi » (d'après la désignation de FF), le Grumman FF a bien servi comme l'un des premiers biplans capables de transporter des avions tout au long des années 30 avant de prendre sa retraite en 1940."
 CAP_cv_fighter_equipment_1:0 "Grumman F3F"
 CAP_cv_fighter_equipment_1_short:0 "F3F"
 CAP_cv_fighter_equipment_1_desc:0 "Le Grumman F3F, lors de son introduction en 1936, était le dernier avion de combat biplan livré à la marine américaine et à toute branche de l'armée américaine en général. Malgré son bref service (retiré du service de première ligne en 1941 et du service en général en 1943), il s'agissait toujours d'un avion assez performant, le dernier d'une époque d'avions monoplans qui constitueraient l'avenir du combat de combat."
 CAP_cv_fighter_equipment_2:0 "Vought F4U-5 Corsaire"
 CAP_cv_fighter_equipment_2_short:0 "Corsaire F4U-5"
 CAP_cv_fighter_equipment_2_desc:0 "Le Vought F4U Corsair est un avion de combat américain qui a servi principalement pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair fut bientôt très demandé ; des contrats de production supplémentaires furent accordés à Goodyear, dont les Corsairs furent désignés FG, et Brewster, désignés F3A. Le Corsair fut conçu et exploité comme un avion embarqué et entra en service en grand nombre dans la marine américaine à la fin de 1944 et au début de 1945. Il devint rapidement l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 CAP_cv_fighter_equipment_3:0 "Grumman F8F Bearcat"
 CAP_cv_fighter_equipment_3_short:0 "F8F Ourscat"
 CAP_cv_fighter_equipment_3_desc:0 "Le Grumman F8F Bearcat est un avion de combat monomoteur américain embarqué à la fin de la Seconde Guerre mondiale. Il a servi au milieu du XXe siècle dans la marine américaine, le corps des Marines des États-Unis et les forces aériennes d'autres pays. C'était le dernier avion de combat à moteur à pistons de Grumman Aircraft."
 
 ############USA Cold War

 CAP_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 CAP_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Foudre II"
 CAP_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour le déploiement de porte-avions. Le développement du programme F-35 a commencé en 1992, et la variante C était dans les airs dès 2010 et était opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses frères et soeurs, la variante C présente des ailes plus grandes avec des sections de bout d'aile pliables."
 
 CAP_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 CAP_jump_stealth_equipment_1_short:0 "F-35B Foudre II"
 CAP_jump_stealth_equipment_1_desc:0 "Un chasseur polyvalent produit à l'aide d'une conception JSF (Joint Strike Fighter). Bien qu'il soit capable d'utiliser une variété d'armes dans les combats air-air et sol-sol, le coût d'acquisition de ce chasseur furtif est plus gérable que celui du F-22A. Conformément à son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 
 CAP_cas_stealth_equipment_1:0 "Fairchild République A-10C Thunderbolt II"
 CAP_cas_stealth_equipment_1_short:0 "A-10C Thunderbolt II"
 CAP_cas_stealth_equipment_1_desc:0 "La variante C de l'A-10 « Thunderbolt II » a été développée en 2005 à la suite du programme de mise à niveau Precision Engagement. Tirant les leçons du prototype YA-10B, l'A-10C est doté d'un système de contrôle de tir modernisé, d'une suite ECM et de capacités de ciblage intelligent des bombes. Le module d'identification ami ou ennemi et la suite de communications ont également été mis à jour et modernisés. En partie en raison de ses performances dans l'histoire récente et de la pression politique, l'A-10 continuera probablement à servir dans une capacité de combat pour l'US Air Force dans un avenir proche."

 #CAP_cas_stealth_equipment_1:0 "General Atomics Predator-C Avenger"
 #CAP_cas_stealth_equipment_1_short:0 "Predator-C Avenger"
 #CAP_cas_stealth_equipment_1_desc:0 "The General Atomics Avenger is an unmanned combat air vehicle designed with stealth features and the same weapons capabilities as the older MQ-9 Reaper. The Avenger's first flight was in 2009, with carrier and extended range variants introduced in 2010 and 2016 respectively. Unlike the previous Predator and Reaper UAVs, the Avenger is powered by a turbofan engine."
 
 CAP_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 CAP_mr_stealth_fighter_equipment_1_short:0 "F-35A Foudre II"
 CAP_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnel (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le développement du programme F-35 a commencé en 1992, la variante A prenant son envol fin 2006 et larguant ses premières bombes moins de six ans plus tard. La variante A est la variante la plus petite et la plus légère du F-35 et est principalement destinée à remplacer le F-16 Fighting Falcon."
 
 CAP_jet_multirole_equipment_1:0 "Étoile filante Lockheed F-80A"
 CAP_jet_multirole_equipment_1_short:0 "Étoile filante F-80A"
 CAP_jet_multirole_equipment_1_desc:0 "Le premier chasseur à réaction exploité par l'US Army Air Force (plus tard l'US Air Force). C'était le premier et le seul avion à réaction américain opérationnel pendant les derniers jours de la Seconde Guerre mondiale. Ce type marquerait le début de l'ère des avions à réaction pour les États-Unis, car sa conception à aile droite servait largement de chasseur de jour et de chasseur-bombardier pendant la guerre de Corée sous le nom de F-80. Surnommé « l'étoile filante », le F-80 représentait le premier summum de l'aviation américaine."
 CAP_jet_multirole_equipment_2:0 "Sabre nord-américain F-86A"
 CAP_jet_multirole_equipment_2_short:0 "Sabre F-86A"
 CAP_jet_multirole_equipment_2_desc:0 "Le F-86 est un chasseur à réaction à ailes en flèche développé et introduit à la fin des années 1940 à partir de recherches capturées par les Allemands. La conception de l'avion le rendait capable d'atteindre des vitesses transsoniques et une grande maniabilité, caractéristiques qui le rendaient capable de gérer son célèbre rival, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, aux côtés de ses variantes canadiennes et australiennes réunies, en ferait l'avion de combat occidental le plus produit de l'histoire de l'aviation."
 CAP_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 CAP_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 CAP_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 CAP_jet_multirole_equipment_4:0 "Super Sabre nord-américain F-100"
 CAP_jet_multirole_equipment_4_short:0 "F-100 Super Sabre"
 CAP_jet_multirole_equipment_4_desc:0 "Premier chasseur à réaction capable d'atteindre une vitesse supersonique en vol en palier, le F-100 était un avion multirôle capable conçu pour affronter l'ennemi face à face. Développé à partir du F-86 Sabre, le F-100 adoptera le surnom de « Super Sabre », mais recevra également le surnom de « Hun » en raison de sa désignation dans l'USAF à l'époque. Ce type servirait au Vietnam comme chasseur-bombardier et fut le premier à être utilisé dans le rôle de suppression de la défense aérienne ennemie, connu sous le nom de Wild Weasel."
 CAP_jet_multirole_equipment_5:0 "McDonnell Douglas F-4C Phantom II"
 CAP_jet_multirole_equipment_5_short:0 "F-4C Fantôme II"
 CAP_jet_multirole_equipment_5_desc:0 "Le programme F-4 est l'un des modèles de chasseurs les plus réussis à ce jour. Le succès fut tel que l'US Air Force a choisi de faire voler ce type en remplacement du F-106 Delta Dart. Chasseur tactique biplace tout temps, version d'attaque au sol pour l'US Air Force ; a pris en charge un large éventail d'armes, notamment l'AIM-4 Falcon, l'AGM-12 Bullpup et les armes nucléaires ; des pneus de roue principale plus larges entraînaient des renflements distinctifs des ailes ; Moteurs J79-GE-15 avec possibilité de démarrage par cartouche ; le ravitaillement en carburant par perche au lieu du ravitaillement en carburant par sonde et en drogue de la Marine ; Radar AN/APQ-100 ; commandes de vol dupliquées dans le cockpit arrière."
 CAP_jet_multirole_equipment_6:0 "McDonnell Douglas F-4D Phantom II"
 CAP_jet_multirole_equipment_6_short:0 "F-4D Fantôme II"
 CAP_jet_multirole_equipment_6_desc:0 "F-4C avec avionique mise à jour et radar AN/APQ-109."
 CAP_jet_multirole_equipment_7:0 "McDonnell Douglas F-4E Phantom II"
 CAP_jet_multirole_equipment_7_short:0 "F-4E Fantôme II"
 CAP_jet_multirole_equipment_7_desc:0 "Version USAF avec un canon M61 Vulcan intégré dans le nez allongé du RF-4C, un radar AN/APQ-120 avec une section plus petite pour accueillir le canon, des moteurs J79-GE-17 avec 17 900 lbf (79,379 kN) de poussée de postcombustion chacun. Avions de dernière série équipés de lattes de pointe pour améliorer la maniabilité au détriment de la vitesse de pointe dans le cadre du programme Agile Eagle. À partir du bloc 53, les avions ont ajouté la capacité AGM-65 Maverick et les moteurs sans fumée J79-GE-17C ou -17E. Premier vol le 1er août 1965. La variante Phantom la plus nombreuse ; 1 370 construits."
 CAP_jet_multirole_equipment_8:0 "Faucon de combat F-16A de General Dynamics"
 CAP_jet_multirole_equipment_8_short:0 "Faucon de combat F-16A"
 CAP_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger avec une maniabilité et une stabilité bien équilibrées. Il possède un corps d'aile mixte exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Appelé « Fighting Falcon », son coût relativement faible et sa puissance élevée sont la raison pour laquelle il a été adapté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle best-seller ont été fabriqués."
 CAP_jet_multirole_equipment_9:0 "Faucon de combat F-16A Block 15 de General Dynamics"
 CAP_jet_multirole_equipment_9_short:0 "F-16A Bloc 15"
 CAP_jet_multirole_equipment_9_desc:0 "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 CAP_jet_multirole_equipment_10:0 "General Dynamics F-16C Block 25 Faucon de combat"
 CAP_jet_multirole_equipment_10_short:0 "F-16C Bloc 25"
 CAP_jet_multirole_equipment_10_desc:0 "Première sous-variante du F-16C, un nouveau radar a été installé et un système de contrôle de tir amélioré, ainsi que des systèmes de données intégrés pour une capacité d'attaque de nuit améliorée. Introduite en 1984, la variante F-16C B25 servira de grande capacité pendant la guerre du Golfe Persique."
 #CAP_jet_multirole_equipment_10:0 "General Dynamics F-16C Block 40/42 Fighting Falcon"
 #CAP_jet_multirole_equipment_10_short:0 "F-16C Block 40/42"
 #CAP_jet_multirole_equipment_10_desc:0 "The Block 40/42 sub-variant was the first to utilize the Low Altitude Navigation and Targeting Infrared for Night pod, also known as LANTIRN. In addition, the undercarriage was strengthened and slightly lengthened to accommodate this new avionics package. The Block 40/42 would also be capable of using Precision-Guided Bombs and Stand-Off Dispensers. As a result, the aircraft was unofficially designated as F-16CG and given the unofficial nickname of 'Night Falcon.'"
 
 CAP_jet_interceptor_equipment_1:0 "Lockheed F-94 Starfire"
 CAP_jet_interceptor_equipment_1_short:0 "F-94 Starfire"
 CAP_jet_interceptor_equipment_1_desc:0 "Développé à partir du F-80 Shooting Star, le F-94 a été conçu pour remplacer les F-61 Black Widow et les F-82 Twin Mustang Heavy Night Fighters à hélices. Initialement équipé d'un armement de canons (quatre, puis huit mitrailleuses de 12,7 mm), son armement de canons serait remplacé par un composant entièrement de fusée, lancé depuis ses baies internes. « Surnommé Starfire », ce serait le premier intercepteur à réaction majeur de l'histoire de l'USAF."
 CAP_jet_interceptor_equipment_2:0 "Chien Sabre F-86D nord-américain"
 CAP_jet_interceptor_equipment_2_short:0 "Chien sabre F-86D"
 CAP_jet_interceptor_equipment_2_desc:0 "Développé comme un intercepteur tous temps, le F-86D (initialement désigné F-95) a repris les performances impressionnantes du F-86 Sabrejet et les a améliorées, en ajoutant un radar (donnant à la variante son radôme avant distinctif), un fuselage plus long et un moteur de postcombustion plus gros. Équipé à l'origine d'une baie de lancement de fusée interne pour l'interception des bombardiers, les variantes ultérieures du « Sabre Dog » seraient équipées de canons."
 CAP_jet_interceptor_equipment_3:0 "Northrop F-89 Scorpion"
 CAP_jet_interceptor_equipment_3_short:0 "F-89 Scorpion"
 CAP_jet_interceptor_equipment_3_desc:0 "Le F-89 (à l'origine P-89) est un intercepteur tout temps conçu dès l'origine pour ce rôle lors de son entrée en service en 1954. Initialement équipé d'un armement à canon, celui-ci sera progressivement abandonné dans la version de production au profit d'un armement de fusée. Plus tard, le « Scorpion » recevra un coup supplémentaire avec l'introduction d'un armement de missiles, le premier avion à réaction à utiliser un tel armement."
 CAP_jet_interceptor_equipment_4:0 "Poignard Convair F-102A Delta"
 CAP_jet_interceptor_equipment_4_short:0 "Dague Delta F-102A"
 CAP_jet_interceptor_equipment_4_desc:0 "Premier chasseur à réaction à ailes delta des États-Unis, le F-102 a été le premier chasseur supersonique utilisé par l'US Air Force, capable d'atteindre des vitesses de Mach 1. Il a été conçu comme un intercepteur et un tueur de bombardiers, remplaçant le F-89 Scorpion, et était capable d'abattre des avions ennemis avec des roquettes et des missiles embarqués depuis sa baie interne, le premier avion de combat à présenter cette conception. Le « Delta Dagger » servirait pendant les premières périodes de la guerre du Vietnam comme avion d'escorte de bombardiers et d'attaque au sol."
 CAP_jet_interceptor_equipment_5:0 "McDonnell F-101B Voodoo"
 CAP_jet_interceptor_equipment_5_short:0 "F-101B Vaudou"
 CAP_jet_interceptor_equipment_5_desc:0 "Le F-101, introduit en 1957, a été initialement conçu comme un bombardier d'escorte à longue portée ou un chasseur de pénétration pour le Commandement aérien stratégique de l'USAF. (SAC) Cela changerait lorsqu'il deviendrait un chasseur-bombardier à capacité nucléaire pour le Commandement aérien tactique (TAC). Le « Voodoo » avait une grande portée. Depuis ses bases en Allemagne de l'Ouest, il pourrait frapper n'importe quel pays du Pacte de Varsovie et pénétrer directement jusqu'à 800 km de profondeur en territoire soviétique."
 CAP_jet_interceptor_equipment_6:0 "Convair F-106A Delta Fléchette"
 CAP_jet_interceptor_equipment_6_short:0 "F-106A Delta Fléchette"
 CAP_jet_interceptor_equipment_6_desc:0 "Le F-106 était un développement ultérieur du F-102 Delta Dagger. Introduit en 1959, le F-106, comme son prédécesseur, n'était pas équipé de canon embarqué et s'appuyait donc sur des missiles pour engager les bombardiers ennemis. Il était équipé du missile infrarouge AIM-4 et d'un AIM-26 à pointe nucléaire. Surnommé « Ultimate Interceptor », le « Delta Dart » transporterait ses armes dans une baie interne, une caractéristique de conception qui ne serait pas utilisée sur les avions de combat avant la 5e génération d'avions de combat à réaction."
 CAP_jet_interceptor_equipment_7:0 "F-106A nord-américain « Six Shooter »"
 CAP_jet_interceptor_equipment_7_short:0 "F-106A « Six tireurs »"
 CAP_jet_interceptor_equipment_7_desc:0 "Après son introduction, le F-106 a été progressivement mis à jour en service, avec une avionique améliorée, une aile modifiée présentant une cambrure conique notable, un système de recherche et de suivi infrarouge, des réservoirs d'aile supersoniques rationalisés qui n'apportaient pratiquement aucune dégradation aux performances globales de l'avion, une meilleure instrumentation et des fonctionnalités telles qu'un réceptacle de ravitaillement en vol et un crochet d'arrêt pour les urgences à l'atterrissage. Project Six Shooter a ajouté une disposition pour un canon M61 Vulcan et un viseur optique."
 CAP_jet_interceptor_equipment_8:0 "McDonnell Douglas F-15A Aigle"
 CAP_jet_interceptor_equipment_8_short:0 "F-15A Aigle"
 CAP_jet_interceptor_equipment_8_desc:0 "Un chasseur de supériorité aérienne avancé doté de points d'attache pour une multitude de systèmes d'armes et d'une avionique avancée capable d'affronter les chasseurs ennemis les plus avancés. Un chasseur à grande échelle tout temps. Bénéficiant d'une vitesse maximale phénoménale, même parmi les combattants, il embarque une abondance de munitions à son bord. Baptisé « Eagle », il possède un tel niveau de stabilité qu'il détient le record de récupération après avoir perdu une aile au combat."
 CAP_jet_interceptor_equipment_9:0 "McDonnell Douglas F-15C Aigle"
 CAP_jet_interceptor_equipment_9_short:0 "F-15C Aigle"
 CAP_jet_interceptor_equipment_9_desc:0 "Version améliorée de la plate-forme F-15 de supériorité aérienne tous temps, la variante « C » est livrée avec un radar amélioré qui peut suivre jusqu'à une douzaine d'avions ennemis à tout moment, tout en étant capable d'en engager simultanément la moitié à la fois. Ce type a été utilisé dans une myriade de pays en dehors des États-Unis, de l'Arabie Saoudite à Israël, et constitue la variante la plus courante de l'« Eagle » en service, conservant son excellent record de tirs."

 CAP_high_mach_jet_interceptor_equipment_1:0 "Convair XF-92"
 CAP_high_mach_jet_interceptor_equipment_1_short:0 "XF-92"
 CAP_high_mach_jet_interceptor_equipment_1_desc:0 "Le XF-92 était un concept conçu par Convair pour un intercepteur de défense ponctuelle à grande vitesse. Capable de dépasser Mach 1, il aurait pu suivre le rythme du bombardier encore à hélices qui aurait été sa proie à l'époque. C'était également la première incursion de l'entreprise et donc de l'Amérique dans la conception des ailes delta. Malgré son annulation, le XF-92 conduira plus tard au développement du F-102 Delta Dagger et du F-106 Delta Dart."
 CAP_high_mach_jet_interceptor_equipment_2:0 "Chasseur stellaire Lockheed F-104"
 CAP_high_mach_jet_interceptor_equipment_2_short:0 "Chasseur F-104"
 CAP_high_mach_jet_interceptor_equipment_2_desc:0 "Le F-104 a été conçu pour répondre au désir du pilote de disposer d'un avion simple, petit et offrant d'excellentes performances. Le résultat serait cet avion, qui était l'un des premiers avions intercepteurs capables de Mach 2 en service dans l'armée américaine. Le « Starfighter » établira de nombreux records de vitesse et d'altitude, mais il fut entaché par une controverse politique et une faible capacité de survie, ce dernier lui donnant un autre surnom, celui de « Widowmaker »."
 CAP_high_mach_jet_interceptor_equipment_3:0 "Rapière nord-américaine F-108"
 CAP_high_mach_jet_interceptor_equipment_3_short:0 "Rapière F-108"
 CAP_high_mach_jet_interceptor_equipment_3_desc:0 "Le F-108 est un intercepteur à grande vitesse et serait le premier avion de ce type à être équipé du missile à longue portée AIM-47 Falcon. Capable d'atteindre des vitesses de Mach 3, la « Rapier » serait la pointe des forces de dissuasion d'interception américaines jusqu'à l'introduction du F-12 Blackbird."
 CAP_high_mach_jet_interceptor_equipment_4:0 "Lockheed F-12B Merle"
 CAP_high_mach_jet_interceptor_equipment_4_short:0 "F-12B Merle"
 CAP_high_mach_jet_interceptor_equipment_4_desc:0 "Le F-12 est un avion intercepteur stratosphérique supersonique conçu pour intercepter les bombardiers qui se trouvent à haute altitude ou à grande vitesse avec une relative facilité. L'unité est équipée de trois missiles air-air à longue portée AIM-47 Falcon pour garantir qu'elle puisse marquer ses cibles avant que les bombardiers ennemis ne puissent larguer sa charge utile. Son cadre noir et sa capacité de mission donnent du crédit à son surnom de « Blackbird ». Ce type donnera plus tard naissance au plus célèbre avion de reconnaissance stratégique, le SR-71."
 
 CAP_jet_CAS_equipment_1:0 "République F-84E Thunderjet"
 CAP_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 CAP_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 CAP_jet_CAS_equipment_2:0 "République F-84G Thunderjet"
 CAP_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 CAP_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 CAP_jet_CAS_equipment_3:0 "République F-84F Thunderstreak"
 CAP_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 CAP_jet_CAS_equipment_3_desc:0 "Développé à partir du précédent F-84 Thunderjet, le F-84F était une variante à ailes en flèche du chasseur-bombardier conçue pour rapprocher ce type des performances du tant vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances de décollage tout en ayant une stabilité et un contrôle médiocres. Le type servirait dans une capacité limitée tout au long de sa vie, jusqu'en 1971. Son surnom est « Thunderstreak »."
 CAP_jet_CAS_equipment_4:0 "République F-105D Thunderchief"
 CAP_jet_CAS_equipment_4_short:0 "F-105D Thunderchief"
 CAP_jet_CAS_equipment_4_desc:0 "Utilisé exclusivement par l'US Air Force, le F-105 est un chasseur-bombardier supersonique à ailes en flèche conçu à l'origine comme un avion d'attaque à capacité nucléaire. Il s'agissait du plus grand avion de combat monomoteur et monoplace de l'histoire au moment de son introduction en 1955. Servant pendant la guerre du Vietnam comme principal avion d'attaque de l'USAF, plus de 20 000 sorties ont été effectuées, à la fois en tant que variante d'attaque monoplace et en tant que rôle de suppression de la défense aérienne ennemie à deux places. Conformément aux conventions de dénomination de Republic Aviation, son surnom est « Thunderchief »."
 CAP_jet_CAS_equipment_5:0 "Republic F-105D Thunderchief « se ressemble »"
 CAP_jet_CAS_equipment_5_short:0 "Le F-105D « se ressemble »"
 CAP_jet_CAS_equipment_5_desc:0 "Les améliorations Look Alike ont augmenté la capacité de l'avion de quatre à seize bombes conventionnelles de 750 livres (340 kg) sur les points d'attache sous l'aile et au centre du fuselage et ont ajouté l'équipement nécessaire pour lancer des missiles air-sol AGM-12 Bullpup."
 CAP_jet_CAS_equipment_6:0 "LTV A-7D Corsaire II"
 CAP_jet_CAS_equipment_6_short:0 "A-7D Corsaire II"
 CAP_jet_CAS_equipment_6_desc:0 "Version construite pour l'USAF, avec un turboréacteur Allison TF41-A-1 et un seul canon rotatif M61 Vulcan de 20 mm ; Le radar de navigation AN/APN-153 des modèles précédents est remplacé par le radar de navigation AN/APN-185, le radar de suivi de terrain AN/APQ-116 du précédent A-7B/C est remplacé par le radar de suivi de terrain AN/APQ-126."
 CAP_jet_CAS_equipment_7:0 "République Fairchild A-10A Thunderbolt II"
 CAP_jet_CAS_equipment_7_short:0 "A-10A Thunderbolt II"
 CAP_jet_CAS_equipment_7_desc:0 "Un attaquant lourdement armé qui offre un soutien au sol à courte portée en utilisant une puissance de feu et une endurance écrasantes. Doté d'un large choix d'armes, notamment des mitrailleuses de 30 mm, des bombes et des roquettes, offrant d'excellentes capacités d'attaque air-sol. Très stable à basse vitesse, il se spécialise dans le nettoyage du sol étendu et précis en une seule attaque. Connu sous le nom de « Thunderbolt II » (et nommé d'après le P-47 Thunderbolt), il se caractérise par une aile droite qui est solide à basse vitesse, et son moteur placé en hauteur et son blindage renforcé le protègent contre les contre-attaques depuis le sol."
 CAP_jet_CAS_equipment_8:0 "Fairchild Republic A-10A Thunderbolt II 'LASTE'"
 CAP_jet_CAS_equipment_8_short:0 "A-10A Thunderbolt II 'LASTE'"
 CAP_jet_CAS_equipment_8_desc:0 "Au début de sa vie, l'A-10 a commencé à recevoir la mise à niveau LASTE (Low-Altitude Safety and Targeting Enhancement), qui fournissait un équipement informatisé de pointage d'armes, un pilote automatique et un système d'avertissement de collision au sol. Le système LASTE a ensuite été mis à niveau avec un ordinateur de contrôle de vol et de tir intégré."

 #LIGHT JETS
 
 CAP_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 CAP_jet_light_equipment_1_short:0 "Étoile filante T-33"
 CAP_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 
 CAP_jet_light_equipment_2:0 "FJ-2 Fury nord-américain"
 CAP_jet_light_equipment_2_short:0 "FJ-2 Fureur"
 CAP_jet_light_equipment_2_desc:0 "Les FJ-2 et FJ-3 Fury nord-américains sont une série de chasseurs à ailes en flèche capables de porter un porte-avions pour la marine et le corps des marines des États-Unis. Le FJ-2 est le résultat d'un effort visant à navaliser le F-86 Sabre de l'US Air Force. Ces avions sont dotés d'ailes repliables et d'une jambe d'atterrissage avant plus longue conçue pour augmenter l'angle d'attaque au lancement et pour accueillir un oléo plus long afin d'absorber le choc des atterrissages durs sur le pont d'un porte-avions."

 CAP_jet_light_equipment_3:0 "Chasseur de la liberté Northtrop F-5A"
 CAP_jet_light_equipment_3_short:0 "Chasseur de la liberté F-5A"
 CAP_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de combat léger destiné principalement à l'exportation. Il est plus léger et moins cher à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour remplacer les escadrons de chasseurs à courte portée. Malgré cela, ce type s'est avéré assez agile et était l'avion le plus proche pour rivaliser avec le MiG-21 « Fishbed » soviétique. Parce qu'il a été utilisé par la majorité des alliés de l'Amérique au plus fort de la guerre froide, il a été appelé à juste titre « Freedom Fighter »."

 CAP_jet_light_equipment_4:0 "Rockwell OV-10A Bronco nord-américain"
 CAP_jet_light_equipment_4_short:0 "OV-10A Bronco"
 CAP_jet_light_equipment_4_desc:0 "Le North American Rockwell OV-10 Bronco est un avion d'attaque et d'observation léger bi-turbopropulseur américain. Il a été développé dans les années 1960 comme avion spécial pour le combat contre-insurrectionnel (COIN), et l'une de ses principales missions était d'être un avion de contrôle aérien avancé (FAC). Il peut transporter jusqu'à 3 200 livres de munitions externes, des charges internes telles que des parachutistes ou des civières, et flâner pendant trois heures ou plus."

 CAP_jet_light_equipment_5:0 "Rockwell OV-10D Bronco nord-américain"
 CAP_jet_light_equipment_5_short:0 "OV-10D Bronco"
 CAP_jet_light_equipment_5_desc:0 "Bronco de deuxième génération développé dans le cadre du programme NOGS. Le modèle D était une cellule OV-10A largement modifiée, ajoutant un système de vision nocturne infrarouge tourné vers l'avant avec une caméra montée sur la tourelle sous un nez allongé, visuellement distinct du nez court et arrondi du modèle A. Le D possède également des moteurs plus gros et des hélices en fibre de verre plus grandes. D'autres différences externes notables sont les distributeurs de paillettes installés à mi-chemin des flèches et les cheminées d'échappement suppressives des infrarouges (qui mélangent les gaz d'échappement avec de l'air plus froid pour réduire la signature thermique de l'avion)."





 CAP_nav_bomber_equipment_4:0 "Lockheed P2V-2 Neptune"
 CAP_nav_bomber_equipment_4_short:0 "P2V-2 Neptune"
 CAP_nav_bomber_equipment_4_desc:0 "Le P2V était un avion de patrouille maritime et anti-sous-marin développé pour remplacer le PV-1 Ventura et le PV-2 Harpoon de la Seconde Guerre mondiale. Introduit en 1947 pour l'US Navy, il s'agissait en fait d'un avion basé à terre, et le P2V, plus tard désigné P-2 après 1962, n'a jamais effectué d'atterrissage sur un porte-avions, mais un petit nombre a été converti et déployé à partir de porte-avions comme bombardiers nucléaires provisoires qui devraient atterrir sur le rivage ou dans un fossé, à l'instar des bombardiers utilisés lors du raid de Doolittle pendant la Seconde Guerre mondiale. Son surnom est « Neptune », du nom du dieu romain de la mer."
 CAP_nav_bomber_equipment_5:0 "Lockheed P2V-7 Neptune"
 CAP_nav_bomber_equipment_5_short:0 "P2V-7 Neptune"
 CAP_nav_bomber_equipment_5_desc:0 "Dernière variante du Neptune produite par Lockheed, propulsée par des moteurs R-3350-32W et J-34. Équipé de réservoirs à bout d'aile à traînée inférieure, d'un radar de recherche AN/APS-20 dans un radôme révisé et d'une verrière de cockpit bombée. Les premiers avions étaient équipés de tourelles défensives, mais celles-ci furent supprimées comme pour le P2V-5."
 CAP_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 CAP_nav_bomber_equipment_6_short:0 "P-3A Orion"
 CAP_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le rôle de patrouille maritime et de guerre anti-sous-marine terrestre (ASW). Il dispose d'une soute à bombes interne pour les torpilles aériennes, avec des pylônes sous les ailes pour une myriade d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des charges sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques sur sa queue pour détecter les sous-marins utilisant le champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à jouer un rôle depuis son introduction en 1962, il est tout à fait approprié que l'avion soit surnommé « Orion ». Le chasseur de navires ennemis."
 CAP_nav_bomber_equipment_7:0 "Lockheed P-3C Orion"
 CAP_nav_bomber_equipment_7_short:0 "P-3C Orion"
 CAP_nav_bomber_equipment_7_desc:0 "Le P-3C disposait d'une nouvelle suite ASW et d'un ordinateur de mission avec une disposition interne révisée. À l'extérieur, le P-3C comportait une échelle d'entrée à commande électrique ; petite antenne à aileron ; chutes de bouées sonores ventrales chargées extérieurement ; et trois petites fenêtres sur le côté arrière droit (une fenêtre à l'avant de la sortie de secours au-dessus de l'aile et deux bien à l'arrière). Les avions de production initiaux avaient un nez de caméra situé sur la partie inférieure du radôme. Les avions de production ultérieurs avaient une tourelle IRDS rétractable à la place de la caméra nasale. À partir du début des années 1980, les nez de caméra existants ont été équipés de tourelles IRDS. Les premiers modèles étaient également connus sous le nom d'avion P-3C « Baseline » ou Non-Update (NUD). Tous les avions ont ensuite été équipés de deux systèmes de navigation inertielle LTN-72."
 CAP_nav_bomber_equipment_8:0 "Boeing P-8 Poséidon"
 CAP_nav_bomber_equipment_8_short:0 "P-8 Poséidon"
 CAP_nav_bomber_equipment_8_desc:0 "Initialement connu sous le nom d'avion maritime multimission (MMA), le P-8 a été conçu pour remplacer le vénérable P-3 Orion. Développé à partir de l'avion de ligne Boeing 737 Next Generation, le P-8 a été conçu pour le rôle de guerre anti-sous-marine et de patrouille maritime. De plus, il peut jouer le rôle de support électronique (ESM) grâce à l'utilisation de sa capacité d'autoprotection d'alerte précoce (EWSP). Avec des variantes en service aux États-Unis, au Royaume-Uni, en Inde et en Australie depuis son introduction en 2013, le « Poséidon » deviendra le nouveau roi des mers."
 
 CAP_cv_nav_bomber_equipment_4:0 "Martin AM Mauler"
 CAP_cv_nav_bomber_equipment_4_short:0 "AM Mauler"
 CAP_cv_nav_bomber_equipment_4_desc:0 "Initialement désigné BTM, l'AM était un bombardier torpilleur monoplace, le premier du genre dans l'histoire de l'aviation. Le Mauler est plus rapide et plus léger que les bombardiers contemporains de l'époque et nécessitait 1/3 de membres d'équipage par rapport au bombardier torpilleur typique de son époque. Avec une charge de bombes de plus de 10 500 lb (4 800 kg), il pouvait transporter plus de munitions que nombre de ses prédécesseurs et contemporains. Cependant, l'AM, surnommé le « Mauler », était probablement trop stable, étant décrit comme « maniable » et difficile à atterrir sur un porte-avions. En conséquence, il ne disposait que d'un transporteur à service court, opérant sur les unités de première ligne dans l'Atlantique pendant deux ans avant d'être remplacé par l'AD-1 Skyraider."
 CAP_cv_nav_bomber_equipment_5:0 "Gardien Grumman AF"
 CAP_cv_nav_bomber_equipment_5_short:0 "Gardien AF"
 CAP_cv_nav_bomber_equipment_5_desc:0 "L'AF « Guardian » (initialement désigné TB3F) est le premier avion de guerre anti-sous-marine spécialement conçu à entrer en service dans la marine américaine. Parce qu'il a été conçu à l'origine comme un bombardier torpilleur et ne pouvait donc pas intégrer tous ses équipements ASW dans le cadre, deux variantes ont été développées, l'AF-2W qui était équipé d'un radar de recherche, et l'AF-2S, qui transportait diverses armes telles que des torpilles, des grenades sous-marines, des bombes ou des roquettes."
 CAP_cv_nav_bomber_equipment_6:0 "Traqueur Grumman S-2"
 CAP_cv_nav_bomber_equipment_6_short:0 "Traqueur S-2"
 CAP_cv_nav_bomber_equipment_6_desc:0 "Le S-2 (anciennement S2J) a tiré les leçons du Guardian et les a appliquées à une seule cellule dotée de deux turbopropulseurs et d'ailes pliables. Introduit pour la première fois en 1952, le « Tracker », aux côtés de sa variante EW, le E-1 Tracer et le vaisseau de transport, le C-1 Trader, a servi dans la marine américaine dans les années 1970 et 1980."
 CAP_cv_nav_bomber_equipment_7:0 "Lockheed S-3 Viking"
 CAP_cv_nav_bomber_equipment_7_short:0 "S-3 Vikings"
 CAP_cv_nav_bomber_equipment_7_desc:0 "Le S-3 était le successeur et le remplaçant du précédent S-2 Tracker dans le rôle de guerre anti-sous-marine. Entré en service en 1974, ce type a été l'un des premiers à introduire un degré plus élevé d'intégration de systèmes, que l'on ne retrouve ni dans son prédécesseur, ni dans le P-3 Orion terrestre. En conséquence, l'avion pouvait utiliser un équipage de quatre personnes, contre 12 pour l'Orion. De plus, il fut l'un des premiers avions à utiliser un groupe motopropulseur auxiliaire, permettant à l'engin de démarrer relativement sans assistance. Surnommé le « Viking », le S-3 a constitué un pilier de la guerre anti-surface embarquée pendant sa période de service."
 CAP_cv_nav_bomber_equipment_8:0 "Boeing F/A-18F Super Hornet"
 CAP_cv_nav_bomber_equipment_8_short:0 "F/A-18F Super Hornet"
 CAP_cv_nav_bomber_equipment_8_desc:0 "Un chasseur polyvalent embarqué capable de fournir un soutien aux avions, aux forces terrestres et aux navires. Avec une meilleure maniabilité à vitesse moyenne que les chasseurs à grande vitesse, il est efficace lors des raids aériens. Surnommé « Super Hornet », l'engin est un F-Type amélioré."
 
 CAP_jet_tac_bomber_equipment_1:0 "Tornado nord-américain B-45"
 CAP_jet_tac_bomber_equipment_1_short:0 "Tornade B-45"
 CAP_jet_tac_bomber_equipment_1_desc:0 "Premier bombardier à réaction opérationnel de l'USAF, le « Tornado » est un bombardier à réaction de taille moyenne qui peut fournir un soutien sur le champ de bataille ainsi qu'une reconnaissance à longue portée. Il jouera un rôle important dans la dissuasion nucléaire américaine pendant plusieurs années avant d'être remplacé par le B-47 Stratojet."
 CAP_jet_tac_bomber_equipment_2:0 "Martin B-57 Canberra"
 CAP_jet_tac_bomber_equipment_2_short:0 "B-57 Canberra"
 CAP_jet_tac_bomber_equipment_2_desc:0 "Le « Canberra » est une version américaine du bombardier électrique anglais du même nom. Il est idéal pour les frappes tactiques et la reconnaissance. Son retrait dans les années 1980 marquerait la fin de l'ère des bombardiers tactiques."
 CAP_jet_tac_bomber_equipment_3:0 "Destroyer Douglas B-66"
 CAP_jet_tac_bomber_equipment_3_short:0 "Destructeur B-66"
 CAP_jet_tac_bomber_equipment_3_desc:0 "Basé sur l'A-3 Skywarrior de l'US Navy, le « Destroyer » a servi de bombardier léger pour remplacer l'A-26 Invader. Parmi les changements par rapport à son homologue de la Marine, il y a l'ajout de sièges éjectables. Comme son homologue de la Marine, il servait également de rôle de reconnaissance et de guerre électronique."
 CAP_jet_tac_bomber_equipment_4:0 "General Dynamics F-111A Oryctérope"
 CAP_jet_tac_bomber_equipment_4_short:0 "F-111A Oryctérope"
 CAP_jet_tac_bomber_equipment_4_desc:0 "L'Aardvark est un avion d'interdiction supersonique doté d'un radar épousant le terrain, de turboréacteurs à postcombustion avancés et d'ailes à flèche variable. Cela permet des frappes à grande vitesse et à basse altitude en profondeur en territoire ennemi."
 CAP_jet_tac_bomber_equipment_5:0 "General Dynamics F-111E Oryctérope"
 CAP_jet_tac_bomber_equipment_5_short:0 "F-111E Oryctérope"
 CAP_jet_tac_bomber_equipment_5_desc:0 "Conçue comme une solution provisoire pour le F-111D, la variante E est la dernière mise à niveau de la plate-forme « Aardvark » et comprend des prises d'air avancées et une suite avionique améliorée."
 CAP_jet_tac_bomber_equipment_6:0 "General Dynamics F-111F Oryctérope"
 CAP_jet_tac_bomber_equipment_6_short:0 "F-111F Oryctérope"
 CAP_jet_tac_bomber_equipment_6_desc:0 "Considérée comme la variante ultime de l'Aardvark, la variante F présente des améliorations des prises d'air et de l'avionique, ainsi qu'une technologie avancée de désignation FLIR et laser et un dôme radar moins cher. Ces ajouts de variantes ont rendu l'avion capable d'utiliser des munitions à guidage de précision."
 CAP_jet_tac_bomber_equipment_7:0 "McDonnell Douglas F-15E Strike Eagle"
 CAP_jet_tac_bomber_equipment_7_short:0 "Aigle de frappe F-15E"
 CAP_jet_tac_bomber_equipment_7_desc:0 "Un chasseur-bombardier doté de la capacité de combat air-air du F-15C et de capacités air-sol supplémentaires. Capable d'être équipé d'un large éventail d'armements, notamment anti-aériens, d'attaque au sol, de missiles multi-verrouillage et de bombes aériennes, il est capable de faire face à une variété de situations. Appelé « Strike Eagle », son extérieur est presque identique à celui du F-15C, il offre diverses améliorations en matière d'attaque au sol."
 CAP_jet_tac_bomber_equipment_8:0 "Boeing F-15E Aigle Avancé"
 CAP_jet_tac_bomber_equipment_8_short:0 "F-15E Aigle Avancé"
 CAP_jet_tac_bomber_equipment_8_desc:0 "La variante F-15 Advanced Eagle est une mise à niveau par rapport aux modèles précédents dans la mesure où elle comprend deux points d'attache supplémentaires pour les armes sous les ailes (augmentant le nombre de neuf à onze) ; l'option d'un cockpit d'affichage de grande surface ; commandes de vol électriques ; le radar à réseau actif à balayage électronique (AESA) Raytheon AN/APG-82(V)1 ou AN/APG-63(V)3 ; Moteurs General Electric General Electric F110-129 ; systèmes de repérage numériques communs montés sur casque dans les deux cockpits ; et un système de guerre électronique numérique, entre autres améliorations."
 
 CAP_jet_strat_bomber_equipment_1:0 "Convair B-36 pacificateur"
 CAP_jet_strat_bomber_equipment_1_short:0 "B-36 Pacificateur"
 CAP_jet_strat_bomber_equipment_1_desc:0 "Le B-36 était le plus gros bombardier à hélice jamais entré en service lorsqu'il l'a fait en 1948. Sa taille signifiait que, sans modifications du châssis ou de la bombe, il pouvait transporter n'importe quelle bombe nucléaire que les États-Unis avaient dans leur arsenal à l'époque. Cependant, l'avènement des avions à réaction dans la guerre signifiait que ce type serait rapidement remplacé par le B-47 et le B-52. Contrairement à l'opinion populaire, le B-36 n'a pas de surnom officiel, mais la société et nombre de ses pilotes qui appréciaient ce type l'appelaient « Peacemaker »."
 CAP_jet_strat_bomber_equipment_2:0 "Boeing B-47 Stratojet"
 CAP_jet_strat_bomber_equipment_2_short:0 "B-47 Stratojet"
 CAP_jet_strat_bomber_equipment_2_desc:0 "Le B-47, baptisé « Stratojet », est un bombardier subsonique à haute altitude à six moteurs qui vole à haute altitude pour éviter les intercepteurs ennemis. Avec ses moteurs transportés dans des nacelles sous l'aile en flèche, le B-47 constituait une innovation majeure dans la conception des avions de combat de l'après-Seconde Guerre mondiale et contribuait au développement d'avions de ligne modernes."
 CAP_jet_strat_bomber_equipment_3:0 "Boeing B-52D Stratoforteresse"
 CAP_jet_strat_bomber_equipment_3_short:0 "B-52D Stratoforteresse"
 CAP_jet_strat_bomber_equipment_3_desc:0 "Le B-52 est un gros bombardier subsonique à longue portée capable d'effectuer de longues missions au-dessus du territoire ennemi. Grâce à ses performances supérieures à des vitesses subsoniques élevées et à ses coûts d'exploitation relativement faibles, le « Stratofortress » est resté en service malgré l'avènement d'avions ultérieurs plus avancés"
 CAP_jet_strat_bomber_equipment_4:0 "Boeing B-52G Stratoforteresse"
 CAP_jet_strat_bomber_equipment_4_short:0 "B-52G Stratoforteresse"
 CAP_jet_strat_bomber_equipment_4_desc:0 "La variante G du B-52 est dotée d'une électronique et d'une avionique améliorées ainsi que d'une charge utile plus importante. Cette variante présente également une autonomie plus longue grâce à une refonte du cadre pour une capacité de carburant accrue. Avec cette refonte et d'autres, la « Stratofortress » sert de plate-forme de bombardier de premier plan jusque dans les années 2050."
 CAP_jet_strat_bomber_equipment_5:0 "Boeing-B-52H"
 CAP_jet_strat_bomber_equipment_5_short:0 "B-52H Stratoforteresse"
 CAP_jet_strat_bomber_equipment_5_desc:0 "Le B-52H présentait les mêmes changements d'équipage et de structure que le B-52G. L'amélioration la plus importante a été le passage aux turboréacteurs à double flux TF33-P-3 qui, malgré les problèmes de fiabilité initiaux (corrigés en 1964 dans le cadre du programme Hot Fan), offraient des performances et une économie de carburant considérablement meilleures que les turboréacteurs J57. L'ECM et l'avionique ont été mis à jour, un nouveau système de conduite de tir a été installé et l'armement défensif arrière est passé de mitrailleuses à un canon Vulcan M61 de 20 mm."
 
 CAP_mach2stratbomber_equipment_1:0 "Convair B-58 Hustler"
 CAP_mach2stratbomber_equipment_1_short:0 "B-58 Hustler"
 CAP_mach2stratbomber_equipment_1_desc:0 "Le Hustler est un bombardier supersonique à ailes delta. Bien qu'il ne puisse pas égaler la charge utile des bombardiers plus gros, il compense cela par sa vitesse."
 CAP_mach2stratbomber_equipment_2:0 "Rockwell B-1A Lancer"
 CAP_mach2stratbomber_equipment_2_short:0 "Lancier B-1A"
 CAP_mach2stratbomber_equipment_2_desc:0 "Le B-1 a été envisagé pour la première fois dans les années 1960 comme une plate-forme qui combinerait la vitesse de Mach 2 du B-58 Hustler avec la portée et la charge utile du B-52, et devait à terme remplacer les deux bombardiers. Après une longue série d'études, Rockwell International (qui fait désormais partie de Boeing) a remporté le concours de conception de ce qui est devenu le B-1A. Cette version avait une vitesse de pointe de Mach 2,2 à haute altitude et la capacité de voler sur de longues distances à Mach 0,85 à très basse altitude."
 CAP_mach2stratbomber_equipment_3:0 "Rockwell B-1B Lancer"
 CAP_mach2stratbomber_equipment_3_short:0 "Lancier B-1B"
 CAP_mach2stratbomber_equipment_3_desc:0 "Bien qu'il soit plus lent que le précédent A, le B-1B « Lancer » avait une plus grande capacité de carburant et une plus grande capacité pour un chargement de bombes externe en plus de sa soute à bombes interne. De plus, le B-1B dispose d'une suite de guerre électronique améliorée et a été repensé avec une section efficace radar réduite, permettant ainsi d'être plus difficile à détecter, malgré la diminution de la vitesse."
 CAP_mach3stratbomber_equipment_1:0 "B-70 Valkyrie nord-américain"
 CAP_mach3stratbomber_equipment_1_short:0 "B-70 Valkyrie"
 CAP_mach3stratbomber_equipment_1_desc:0 "Le B-70 est un bombardier stratégique capable de Mach 3 conçu pour les frappes nucléaires à pénétration profonde. Conçu dans les années 1950, le B-70 a été conçu pour remplacer le B-52 et a été conçu pour effectuer une super-croisière à Mach 3, une technique qui ne sera reproduite que pour le F-22 près d'un demi-siècle plus tard. Surnommé « Valkyrie », le B-70 serait le catalyseur des futurs bombardiers supersoniques."
 CAP_mach6stratbomber_equipment_1:0 "Lockheed Martin SR-72"
 CAP_mach6stratbomber_equipment_1_short:0 "SR-72"
 CAP_mach6stratbomber_equipment_1_desc:0 "Bombardier stratégique à grande vitesse, le SR-72 a été conçu à l'origine pour remplacer l'avion de reconnaissance stratégique SR-71 Blackbird. Contrairement au Blackbird, le SR-72 est extrêmement maniable pour un avion à grande vitesse et est capable de transporter un grand nombre de munitions."

 CAP_nuclearstratbomber_equipment_1:0 "Convair NB-36H croisé"
 CAP_nuclearstratbomber_equipment_1_short:0 "Croisé NB-36H"
 CAP_nuclearstratbomber_equipment_1_desc:0 "Développé dans le cadre du programme Aircraft Nuclear Propulsion (ANP), le NB-36H a été le premier bombardier stratégique à propulsion nucléaire développé pour l'US Air Force. Les modifications apportées au B-36 Peacemaker comprenaient une nouvelle section de cabine pilote recouverte de plomb et de caoutchouc, ainsi que de verre au plomb pour éviter la contamination des pilotes. L'avion était équipé d'un réacteur refroidi par air de 1 mégawatt, pesant 35 000 livres (16 000 kg), suspendu à un crochet dans la soute à bombes centrale pour faciliter le chargement et le déchargement lorsqu'il n'était pas en vol. Malgré son annulation en 1961 pour des raisons de sécurité, le « Crusader » a fourni à la NASA un aperçu des méthodes de manipulation des métaux liquides et des sels fondus, contribuant ainsi au développement de générateurs et de réacteurs nucléaires."
 CAP_nuclearstratbomber_equipment_2:0 "ConvairWS-125"
 CAP_nuclearstratbomber_equipment_2_short:0 "WS-125"
 CAP_nuclearstratbomber_equipment_2_desc:0 "La désignation par la société d'un bombardier stratégique nucléaire à très longue portée (il devait être désigné B-72), le WS-125, est une conception hypothétique basée sur ce qui se passerait si le programme ANP se poursuivait. Il a été émis l'hypothèse que le WS-125/B-72 aurait été basé sur le Convair B-60, une version à réaction du B-36 qui a perdu sa concurrence face au célèbre B-52 Stratofortress. Il devait être propulsé par 4 turboréacteurs à propulsion nucléaire et 4 turboréacteurs conventionnels pour fournir une alimentation de secours."

 CAP_cv_jet_CAS_equipment_1:0 "Douglas AD-1 Skyraider"
 CAP_cv_jet_CAS_equipment_1_short:0 "AD-1 Skyraider"
 CAP_cv_jet_CAS_equipment_1_desc:0 "Le Douglas A-1 Skyraider (anciennement AD Skyraider) est un avion d'attaque monoplace américain qui a été utilisé entre la fin des années 40 et le début des années 80. Le Skyraider a eu une carrière remarquablement longue et fructueuse ; il est devenu un anachronisme propulsé par un piston et une hélice à l'ère des avions à réaction, et a été surnommé « Spad »."
 CAP_cv_jet_CAS_equipment_2:0 "Douglas AD-4 Skyraider"
 CAP_cv_jet_CAS_equipment_2_short:0 "AD-4 Skyraider"
 CAP_cv_jet_CAS_equipment_2_desc:0 "Train d'atterrissage renforcé, radar amélioré, compas G-2, combinaisons anti-G, quatre canons de 20 mm (0,79 po) et 14 lance-roquettes Aero, capables de transporter jusqu'à 50 lb (23 kg) de bombes"
 CAP_cv_jet_CAS_equipment_3:0 "Douglas A-3B Skywarrior"
 CAP_cv_jet_CAS_equipment_3_short:0 "A-3B Guerrier du Ciel"
 CAP_cv_jet_CAS_equipment_3_desc:0 "Version bombardier de production définitive, avec une cellule plus solide, des moteurs plus puissants, une surface d'aile légèrement plus grande (812 pi²/75 m² contre 779 pi²/72 m²), une possibilité d'enrouleur de ravitaillement en vol pour le rôle de ravitailleur. Les 21 derniers exemplaires construits avaient un nouveau système de bombardement AN/ASB-7 et un nez remodelé ; tourelle de queue supprimée au profit de l'installation de guerre électronique."
 CAP_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 CAP_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 CAP_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un engin d'attaque léger monomoteur capable de transporter la même charge de bombes qu'un B-17 malgré son châssis plus petit. Servant dans plusieurs forces aériennes et aéronavales depuis son introduction en 1954, il a connu de nombreuses modifications et modernisations au cours de ses plus de 60 années de service et continue de servir dans de nombreux pays jusqu'à ce jour. Son surnom est « Skyhawk »."
 CAP_cv_jet_CAS_equipment_5:0 "Douglas A-4E Skyhawk"
 CAP_cv_jet_CAS_equipment_5_short:0 "A-4E Skyhawk"
 CAP_cv_jet_CAS_equipment_5_desc:0 "Mise à niveau majeure, comprenant un nouveau moteur Pratt & Whitney J52-P-6A avec une poussée de 8 400 lbf (37 kN), une cellule renforcée avec deux pylônes d'armes supplémentaires (pour un total de cinq), une avionique améliorée, avec TACAN, un radar de navigation Doppler, un altimètre radar, un ordinateur de bombardement par lancer et un système de bombardement à basse altitude AJB-3A. Beaucoup ont ensuite été mis à niveau avec le moteur J52-P-8 produisant 9 300 lbf (41 kN) de poussée"
 CAP_cv_jet_CAS_equipment_6:0 "Intrus Grumman A-6A"
 CAP_cv_jet_CAS_equipment_6_short:0 "A-6A Intrus"
 CAP_cv_jet_CAS_equipment_6_desc:0 "Un avion embarqué tout temps doté de systèmes électroniques hautement perfectionnés pour l'époque. Il a été développé dans le but de lui permettre de voler à basse altitude en territoire ennemi et d'utiliser une sélection d'armes pour porter un coup critique. Son surnom est « Intrus ». Il a également eu une variété d'autres surnoms provenant de sa grande partie avant et de sa partie arrière élancée, notamment « Tadpole » et « Dog Ship »."
 CAP_cv_jet_CAS_equipment_7:0 "LTV A-7 Corsaire II"
 CAP_cv_jet_CAS_equipment_7_short:0 "A-7 Corsaire II"
 CAP_cv_jet_CAS_equipment_7_desc:0 "Développé à partir du F-8 Crusader, le « Corsair II » (du nom du F4U Corsair) est un avion d'attaque léger monoplace, subsonique et embarqué, avec une charge utile et une portée plus grandes que l'A-4 Skyhawk qu'il a remplacé. Il servira plus tard dans l'US Air Force, remplaçant les vénérables A-1 Skyraider et F-100 Super Sabre, devenant ainsi l'un des rares avions d'attaque au sol à servir à la fois dans la Marine et dans l'Air Force."
 CAP_cv_jet_CAS_equipment_8:0 "Intrus Grumman A-6E"
 CAP_cv_jet_CAS_equipment_8_short:0 "Intrus A-6E"
 CAP_cv_jet_CAS_equipment_8_desc:0 "La version d'attaque définitive de l'Intruder avec des systèmes de navigation et d'attaque considérablement améliorés. Les anciens radars séparés de recherche et de poursuite (contrôle de tir) de l'A-6A/B/C ont été remplacés par un seul radar multimode Norden AN/APQ-148 et des ordinateurs de bord dotés d'un système plus sophistiqué et plus fiable."
 CAP_cv_jet_CAS_equipment_9:0 "Grumman A-6E Intrus WCSI"
 CAP_cv_jet_CAS_equipment_9_short:0 "A-6E Intrus WCSI"
 CAP_cv_jet_CAS_equipment_9_desc:0 "Dans les années 1980, les avions A-6E Intruder ont été convertis en version A-6E WCSI (Weapons Control System Improvement) pour ajouter des capacités d'armes supplémentaires. Cela a ajouté la possibilité de transporter et de cibler certaines des armes à guidage de précision de première génération, comme le missile AGM-84 Harpoon et l'AGM-123 Skipper. L'avion WCSI a finalement été modifié pour avoir une capacité limitée d'utiliser le missile d'attaque terrestre à impasse AGM-84E SLAM. Étant donné que les missiles Harpoon et SLAM avaient des interfaces de communication communes, les avions WCSI pouvaient transporter et tirer des missiles SLAM, mais avaient besoin d'un SWIP A-6E à proximité pour les guider vers la cible."
 CAP_cv_jet_CAS_equipment_10:0 "McDonnell Douglas F/A-18B Hornet"
 CAP_cv_jet_CAS_equipment_10_short:0 "F/A-18B Hornet"
 CAP_cv_jet_CAS_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les nouvelles avancées des technologies informatiques avec une vitesse et une agilité élevées pour créer des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut contenir, le « Hornet » basé sur un porte-avions a été conçu comme un avion multirôle pour gérer à la fois des missions air-air et air-sol. Le B est une version d'attaque au sol biplace."
 #CAP_cv_jet_CAS_equipment_9:0 "A heavily upgraded A-6, sharing the Pratt & Whitney J52 turbojets with the F/A-18C Hornet. Upgrades also include avionics improvements, MFDs, the AN/APQ-173 RADAR and ability to equip the AIM-120 AMRAAM AA missile."
 #CAP_cv_jet_CAS_equipment_9_short:0 "A-6F Intruder II"
 #CAP_cv_jet_CAS_equipment_9_desc:0 "Grumman A-6F Intruder II"
 #CAP_cv_jet_CAS_equipment_10:0 "McDonnell Douglas F/A-18C Hornet"
 #CAP_cv_jet_CAS_equipment_10_short:0 "F/A-18C Hornet"
 #CAP_cv_jet_CAS_equipment_10_desc:0 "The single-seat C variant of the 'Hornet' came as a result of a block upgrade in 1987. This upgrade came in the form of a new synthetic aperture ground mapping radar system for tracking targets in low-visibility conditions. New avionics, such as a thermal navigation pod, forward looking infrared array (FLIR), night-vision goggles and two full-color multi-function displays (MFD) allow the aircraft to perform superbly in nighttime attacks. It also was capable of carrying newer types of ordinance, including the AMRAAM Medium-Range Air-to-Air Missile, and Precision Guided Bombs."

 CAP_cv_jet_multirole_equipment_1:0 "McDonnell Douglas F2H Banshee"
 CAP_cv_jet_multirole_equipment_1_short:0 "F2H Banshee"
 CAP_cv_jet_multirole_equipment_1_desc:0 "Le McDonnell F2H Banshee était un avion de combat à réaction monoplace embarqué par la Marine américaine et le Corps des Marines des États-Unis de 1948 à 1961. C'était l'un des principaux chasseurs américains utilisés pendant la guerre de Corée et le seul chasseur à réaction déployé par la Marine royale canadienne."
 CAP_cv_jet_multirole_equipment_2:0 "Grumman F9F Panthère"
 CAP_cv_jet_multirole_equipment_2_short:0 "Panthère F9F"
 CAP_cv_jet_multirole_equipment_2_desc:0 "Le F9F a été conçu à l'origine comme un avion à réaction à aile droite introduit en 1949. L'un des premiers avions à réaction capables de porter un porte-avions utilisé dans la marine américaine, il était le principal avion d'attaque au sol de l'USN et de l'USMC pendant la guerre de Corée, effectuant 78 000 sorties, et a été crédité de la première destruction aérienne d'un chasseur de la marine américaine pendant la guerre. Son châssis robuste permettait à l'engin de soutenir des opérations d'attaque au sol, même face aux tirs des AA. Le F9F (plus tard rebaptisé F-9) servira également avec les Blue Angels, devenant ainsi le premier avion à réaction utilisé par l'équipe. Suivant la tradition de Grumman consistant à donner aux avions le nom de grands félins, l'avion est connu sous le nom de « Panthère »."
 CAP_cv_jet_multirole_equipment_3:0 "Démon McDonnell F3H"
 CAP_cv_jet_multirole_equipment_3_short:0 "Démon F3H"
 CAP_cv_jet_multirole_equipment_3_desc:0 "Le F3H était un chasseur subsonique à ailes en flèche qui a été en proie à des difficultés tout au long de sa carrière. Initialement destiné au moteur J40, des problèmes avec la conception du prototype ont conduit à l'annulation du moteur et le F3H recevrait en remplacement un moteur à faible puissance. Malgré ses problèmes, le Démon était un intercepteur performant par tous les temps, avec une bonne visibilité pour l'époque. Initialement armée uniquement de quatre canons de 20 mm, une variante ultérieure serait équipée des premiers modèles de ce qui allait devenir le missile infrarouge AIM-9 Sidewinder et le missile air-air semi-actif AAM-N-2 (plus tard AIM-7) Sparrow. Conformément aux conventions de dénomination de McDonnell, son surnom officiel est le « Démon »."
 CAP_cv_jet_multirole_equipment_4:0 "Vought F-8 croisé"
 CAP_cv_jet_multirole_equipment_4_short:0 "Croisé F-8"
 CAP_cv_jet_multirole_equipment_4_desc:0 "Chasseur monomoteur supersonique de supériorité aérienne, le F-8 (à l'origine connu sous le nom de F8U) a été conçu pour la défense aérienne rapprochée de la flotte. L'avion transporte une charge utile de munitions plus importante que le F11F Tiger ou le F7U Cutlass (ce dernier qu'il a remplacé), ainsi que la capacité de fonctionner comme une plate-forme de reconnaissance photographique rapide. Surnommé le « Croisé », il était l'un des chasseurs de supériorité aérienne à conserver son armement interne au moment de la guerre du Vietnam, lui donnant ainsi un autre surnom, « Le dernier Gunfighter »."
 CAP_cv_jet_multirole_equipment_5:0 "McDonnell Douglas F-4B Phantom II"
 CAP_cv_jet_multirole_equipment_5_short:0 "F-4B Fantôme II"
 CAP_cv_jet_multirole_equipment_5_desc:0 "Avion de combat et d'attaque au sol biplace tous temps basé sur un porte-avions pour l'US Navy et le Marine Corps. Moteurs J79-GE-8A ou -8B avec 16 950 lbf (75,4 kN) de poussée de postcombustion chacun. Appelé « Phantom II » (et nommé d'après le FH Phantom), le F-4 Phantom II fut le premier avion partagé par trois branches des forces armées américaines : la Marine, les Marines et l'Armée de l'Air."
 CAP_cv_jet_multirole_equipment_6:0 "McDonnell Douglas F-4J Phantom II"
 CAP_cv_jet_multirole_equipment_6_short:0 "F-4J Fantôme II"
 CAP_cv_jet_multirole_equipment_6_desc:0 "Version améliorée du F-4B pour l'US Navy et le Corps des Marines, avec un accent sur l'amélioration des capacités de combat air-air, qui comprend : des moteurs J79-GE-10 avec une poussée de postcombustion de 17 844 lbf (79,374 kN) chacun, un radar Doppler à impulsions AN/APG-59 couplé au système de contrôle de tir AN/AWG-10 pour une capacité d'abattage avec vue vers le bas, des roues de train d'atterrissage principal plus grandes résultant en des renflements d'ailes similaires à ceux du F-4C, empennage à lattes, ailerons tombés de 16,5° lorsque le train d'atterrissage et les volets étaient déployés pour diminuer la vitesse d'atterrissage, sièges éjectables zéro-zéro, capacité d'attaque au sol étendue, pas de capteur IRST sous le nez."
 CAP_cv_jet_multirole_equipment_7:0 "McDonnell Douglas F-4N Phantom II"
 CAP_cv_jet_multirole_equipment_7_short:0 "F-4N Fantôme II"
 CAP_cv_jet_multirole_equipment_7_desc:0 "F-4B modernisé dans le cadre du projet Bee Line, les mêmes améliorations aérodynamiques que le F-4J, des moteurs sans fumée et une cellule renforcée."
 CAP_cv_jet_multirole_equipment_8:0 "Grumman F-14A Tomcat"
 CAP_cv_jet_multirole_equipment_8_short:0 "F-14A Tomcat"
 CAP_cv_jet_multirole_equipment_8_desc:0 "Un grand chasseur embarqué destiné à succéder au F-4 comme principal système de défense aérienne de la flotte. Il possède des ailes variables qui peuvent changer automatiquement d'angle même pendant le vol, permettant à la fois des capacités de vitesse élevée dans les plages de vitesse élevées et une grande maniabilité dans les plages de vitesse faible. Il est également équipé de missiles à longue portée capables d'abattre les ennemis sur une distance considérable. Connu sous le nom de « Tomcat »."
 CAP_cv_jet_multirole_equipment_9:0 "Grumman F-14B Tomcat"
 CAP_cv_jet_multirole_equipment_9_short:0 "F-14B Tomcat"
 CAP_cv_jet_multirole_equipment_9_desc:0 "Une variante du chasseur F-14A embarqué, créée via une mise à niveau majeure qui comprend la coupure du moteur. Les principales améliorations comprennent la résolution des problèmes de moteur, une propulsion accrue et une avionique révisée. D'autres modifications ont été apportées dans les années 90, destinées à prolonger la durée de vie de l'avion et à fournir davantage de capacités d'attaque air-sol. Ce F-14 modifié est également utilisé pour des attaques tactiques à grande vitesse et à longue distance. Il est connu sous le nom de « Tomcat », le même que le type A. Lorsqu'il est modifié pour le bombardement, le F-14 est également connu officieusement sous le nom de « Bombcat »."
 CAP_cv_jet_multirole_equipment_10:0 "McDonnell Douglas F/A-18A Hornet"
 CAP_cv_jet_multirole_equipment_10_short:0 "F/A-18A Hornet"
 CAP_cv_jet_multirole_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les nouvelles avancées des technologies informatiques avec une vitesse et une agilité élevées pour créer des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut contenir, le « Hornet » basé sur un porte-avions a été conçu comme un avion multirôle pour gérer à la fois des missions air-air et air-sol."
 #CAP_cv_jet_multirole_equipment_9:0 "Grumman F-14D Super Tomcat"
 #CAP_cv_jet_multirole_equipment_9_short:0 "F-14D Super Tomcat"
 #CAP_cv_jet_multirole_equipment_9_desc:0 "A revision of the F-14, which has come to characterize carrier-based fighters, known as the 'Super Tomcat'. While maintaining the stable maneuverability offered by the digitally controlled variable sweep wing and the capability to neutralize multiple incoming targets at long range, it is also outfitted with a new onboard radar and engine."
 #CAP_cv_jet_multirole_equipment_10:0 "Boeing F/A-18E Super Hornet"
 #CAP_cv_jet_multirole_equipment_10_short:0 "F/A-18E Super Hornet"
 #CAP_cv_jet_multirole_equipment_10_desc:0 "Whether it's air-to-air or air-to-ground, this carrier-based fighter is capable of handling a wide variety of missions. An easy-to-handle aircraft that boasts stable maneuverability at any speed. Equipped with long-range attack weapons, it's well-suited for preemptive attacks. Nicknamed the 'Super Hornet'."
 
 
 CAP_stealth_tactical_bomber_equipment_1:0 "Lockheed F-117A Nighthawk"
 CAP_stealth_tactical_bomber_equipment_1_short:0 "F-117A Nighthawk"
 CAP_stealth_tactical_bomber_equipment_1_desc:0 "Le tout premier attaquant furtif, spécialisé dans les bombardements secrets. Comme la conception est entièrement axée sur les capacités furtives, l'avion manque de vitesse et de maniabilité. D'un autre côté, cependant, rester hors du radar ennemi lui permet d'utiliser des bombes guidées pour effectuer des frappes précises. Il a une forme unique composée de surfaces planes et d'un travail de peinture spécial afin de réfléchir et d'absorber les ondes radar. Connu sous le nom de « Nighthawk », il a été reconnu pendant la guerre du Golfe de 1991 pour avoir effectué plus de 1 200 sorties sans qu'un seul des avions ne soit abattu."
 CAP_stealth_tactical_bomber_equipment_2:0 "Lockheed Martin FB-22 Strike Raptor"
 CAP_stealth_tactical_bomber_equipment_2_short:0 "Raptor de frappe FB-22"
 CAP_stealth_tactical_bomber_equipment_2_desc:0 "Le Lockheed Martin FB-22 était un bombardier furtif proposé destiné à entrer en service dans l'armée de l'air américaine. Sa conception est dérivée du F-22 Raptor. Le FB-22 a été annulé à la suite de l'examen quadriennal de la défense de 2006. L'autonomie a été presque triplée, passant de 600 milles (970 km) à plus de 1 600 milles (2 600 km), qui aurait pu être étendue par des réservoirs de carburant externes. Cela plaçait l'avion dans la catégorie des bombardiers régionaux, comparable à celle du F-111."

 CAP_stealth_strategic_bomber_equipment_1:0 "Northrop Grumman B-2 Esprit"
 CAP_stealth_strategic_bomber_equipment_1_short:0 "B-2 Esprit"
 CAP_stealth_strategic_bomber_equipment_1_desc:0 "Un bombardier stratégique furtif capable de pénétrer en territoire ennemi sans être détecté par le radar et d'effectuer des bombardements à grande échelle. Il s'agit d'un avion à ailes volantes qui n'a pas de queue, ce qui le rend plus difficile à détecter par le radar. Ses performances de manoeuvre ont été remplacées par des performances furtives accrues, afin qu'il puisse pénétrer les filets radar avec plus de sécurité. Le nombre d'avions fabriqués est extrêmement faible, c'est pourquoi chaque avion reçoit un nom unique composé du surnom « Esprit » et du nom d'un territoire géographique."
 CAP_stealth_strategic_bomber_equipment_2:0 "Northrop Grumman B-21 Raider"
 CAP_stealth_strategic_bomber_equipment_2_short:0 "B-21 Raider"
 CAP_stealth_strategic_bomber_equipment_2_desc:0 "Développé à partir des enseignements tirés du B-2 Spirit, le B-21, dans le cadre du programme Long Range Strike Bomber (LRS-B), doit être un bombardier stratégique furtif à très longue portée pour l'US Air Force, capable d'emporter des armes conventionnelles ou thermonucléaires. Comme son prédécesseur, le « Raider » est un bombardier à ailes volantes, qui augmente les performances furtives pour pénétrer les filets radar de manière plus sûre."

 CAP_stealth_fighter_equipment_1:0 "Lockheed Martin F-22A Raptor"
 CAP_stealth_fighter_equipment_1_short:0 "F-22A Raptor"
 CAP_stealth_fighter_equipment_1_desc:0 "Ce chasseur furtif ultime fait la fierté des forces armées américaines. Outre ses performances de vol, il offre des performances d'accélération de premier ordre et une tuyère de déflexion de poussée bidimensionnelle qui lui confère également une maniabilité exceptionnelle. Sa puissance de frappe préventive, appelée « premier regard, premier tir, premier meurtre », convient parfaitement à un avion portant le nom de « Raptor », le maître du ciel."
 CAP_cv_stealth_fighter_equipment_1:0 "Lockheed Martin F-22N Sea Raptor"
 CAP_cv_stealth_fighter_equipment_1_short:0 "Raptor marin F-22N"
 CAP_cv_stealth_fighter_equipment_1_desc:0 "Nommé « Sea Raptor », le F-22N est la variante embarquée du Raptor et possède bon nombre des mêmes capacités que le F-22A terrestre. Développé pour l'US Navy, le F-22N possède une capacité de décollage court qui lui permet d'être utilisé pour des opérations sur porte-avions. En plus d'être capables de distribuer des munitions, les missiles hautes performances lui permettent d'attaquer hors de portée des avions ennemis. Parfaitement adapté aux missions de combat aérien et à la défense aérienne de la flotte, le F-22N est un puissant chasseur préemptif."
 
 CAP_jump_jet_equipment_1:0 "Hawker Siddeley AV-8A Harrier"
 CAP_jump_jet_equipment_1_short:0 "Harrier AV-8A"
 CAP_jump_jet_equipment_1_desc:0 "Cet attaquant a été développé pour faire du VTOL (décollage et atterrissage verticaux) une réalité. Il présente une conception unique comprenant des ailes montées en hauteur et quatre buses rotatives. Cela permet d'opérer dans des espaces limités tels que les porte-avions légers et les petits aérodromes. L'avion est communément connu sous le nom de « Harrier ». Développé en Grande-Bretagne, l'AV-8A est connu en Grande-Bretagne sous le nom de Harrier Mk. 50 et fonctionnait de manière similaire aux Harrier GR.1 de la Royal Air Force."
 CAP_jump_jet_equipment_2:0 "Hawker Siddeley AV-8C Harrier"
 CAP_jump_jet_equipment_2_short:0 "Harrier AV-8C"
 CAP_jump_jet_equipment_2_desc:0 "La variante « C » est une version améliorée de l'AV-8A et fonctionne avec des systèmes similaires au Harrier GR.3, avec un nouvel équipement ECM et un système de navigation inertielle."
 CAP_jump_jet_equipment_3:0 "McDonnell Douglas AV-8B Harrier II"
 CAP_jump_jet_equipment_3_short:0 "AV-8B Harrier II"
 CAP_jump_jet_equipment_3_desc:0 "Le Harrier II est un projet anglo-américain conjoint conçu par McDonnell Douglas avec British Aerospace. Au service du Corps des Marines des États-Unis depuis 1985, le « Harrier II » était considéré comme un outil important dans de nombreux conflits américains de mémoire récente."
 CAP_jump_jet_equipment_4:0 "McDonnell Douglas AV-8B Harrier II Plus"
 CAP_jump_jet_equipment_4_short:0 "AV-8B Harrier II Plus"
 CAP_jump_jet_equipment_4_desc:0 "Mise à niveau à mi-vie de l'AV-8B, l'AV-8B Plus intègre un moteur amélioré, un système radar et une caméra infrarouge, ce qui en fait un avion d'attaque de nuit très efficace."

 CAP_recon_equipment_0:0 "Stinson L-5 Sentinelle"
 CAP_recon_equipment_0_short:0 "Sentinelle L-5"
 CAP_recon_equipment_0_desc:0 "Le Stinson L-5 Sentinel était un avion de liaison de la Seconde Guerre mondiale utilisé par toutes les branches de l'armée américaine et par la Royal Air Force britannique. Il a été produit par la Stinson Aircraft Company. Avec le Stinson L-1 Vigilant, le L-5 était le seul autre avion de liaison américain de la Seconde Guerre mondiale spécialement construit pour un usage militaire et n'avait pas d'équivalent civil. Tous les autres avions de liaison militaire adoptés pendant la Seconde Guerre mondiale étaient des modèles civils « prêts à l'emploi » légèrement modifiés."
 CAP_jet_recon_equipment_0:0 "Sabre nord-américain RF-86"
 CAP_jet_recon_equipment_0_short:0 "Sabre RF-86"
 CAP_jet_recon_equipment_0_desc:0 "Conversions F-86 avec trois caméras pour la reconnaissance"
 CAP_jet_recon_equipment_1:0 "McDonnell Douglas RF-4C Phantom II"
 CAP_jet_recon_equipment_1_short:0 "RF-4C Fantôme II"
 CAP_jet_recon_equipment_1_desc:0 "Version de reconnaissance tactique tous temps pour le radar de l'US Air Force, AN/APQ-99 (plus tard AN/APQ-172). Équipé de manière similaire au RF-4B mais avec un plus grand choix d'appareils photo, y compris un module central pour le gigantesque appareil photo HIAC-1 LOROP (Long Range Oblique Photography), capable de prendre des images haute résolution d'objets situés à 100 miles (160 km). De nombreux avions ont été réaménagés avec un nez profilé, bombé et plus spacieux."
 CAP_jet_recon_equipment_2:0 "Lockheed Martin F-16C Block 30/32 Reco"
 CAP_jet_recon_equipment_2_short:0 "F-16C Bloc 30/32 Reco"
 CAP_jet_recon_equipment_2_desc:0 "La première variante de reconnaissance était un F-16D de l'USAF configuré expérimentalement en 1986 avec une nacelle de style baignoire multi-capteurs sur la ligne centrale. L'USAF a décidé en 1988 de remplacer la flotte vieillissante des RF-4C Phantom par des F-16C Block 30 équipés du pod central du système de reconnaissance aéroporté tactique avancé (ATARS) de Control Data Corporation, qui pouvait transporter une variété de capteurs. Des problèmes avec le programme ATARS ont cependant conduit au départ de l'USAF en juin 1993. Au milieu des années 1990, l'US Air Force a expérimenté une série de modèles de modules de reconnaissance sur la ligne centrale, en commençant par un prototype de module, le module Electro-Optical 1 (EO-1). Le premier vol du F-16 avec un prototype TARS a eu lieu le 26 août 1995 et le 27 septembre 1996, l'USAF a passé sa première commande de production de nacelles."
 
 CAP_transport_plane_equipment_1:0 "Train aérien Douglas C-47"
 CAP_transport_plane_equipment_1_short:0 "Train aérien C-47"
 CAP_transport_plane_equipment_1_desc:0 "Développé à partir de l'avion de ligne Douglas DC-3 lors de son premier vol en 1941, le C-47 était l'avion de transport par excellence utilisé par les Alliés. Pendant la Seconde Guerre mondiale, les forces armées de nombreux pays ont utilisé le C-47 et des DC-3 modifiés pour le transport de troupes, de marchandises et de blessés. Plus de 10 000 unités, à la fois le C-47 et la variante navale R4D (plus tard C-117) ont été construites pour la guerre, et de nombreux « Skytrains » ont été utilisés non seulement pour le transport de troupes et de marchandises, mais aussi pour la recherche et le sauvetage et, pendant la guerre du Vietnam, comme premiers hélicoptères de combat."
 CAP_transport_plane_equipment_2:0 "Douglas C-54 Skymaster"
 CAP_transport_plane_equipment_2_short:0 "C-54 Skymaster"
 CAP_transport_plane_equipment_2_desc:0 "Tout comme le C-47 avant lui, le C-54 a été développé à partir d'un avion de ligne Douglas, cette fois-ci étant le DC-4. Introduit en 1942, le C-54 servait au transport de fret, mais transportait également d'importants VIP, étant l'un des premiers avions à transporter le président des États-Unis (mais pas le premier avion à être désigné Air Force One.). La renommée du « Skymaster » venait cependant du fait qu'il était le type majoritaire utilisé pour transporter du charbon et des vivres vers Berlin-Ouest, pendant le célèbre pont aérien de Berlin. Les variantes de la marine étaient connues sous le nom de R5D."
 CAP_transport_plane_equipment_3:0 "Douglas C-124 Globemaster II"
 CAP_transport_plane_equipment_3_short:0 "C-124 Globemaster II"
 CAP_transport_plane_equipment_3_desc:0 "Le C-124 était le principal moyen de transport lourd du service de transport aérien militaire (MATS) de l'armée de l'air américaine au cours des années 1950 et au début des années 1960, jusqu'à ce que le Lockheed C-141 Starlifter entre en service. Il a servi dans les unités de la Réserve de la Force aérienne et de la Garde nationale aérienne acquises par le MATS, puis par le Military Airlift Command (MAC), jusqu'en 1974."
 CAP_transport_plane_equipment_4:0 "Lockheed C-130 Hercules"
 CAP_transport_plane_equipment_4_short:0 "C-130 Hercules"
 CAP_transport_plane_equipment_4_desc:0 "Développé en 1954, le C-130 est un moyen de transport capable d'utiliser des pistes non préparées pour les décollages et les atterrissages, ce qui en fait un cadre pratique pour le transport de troupes et de marchandises ainsi que pour les évacuations médicales. Mais ce qui rend l'avion digne de son surnom de « Hercules », c'est qu'il y avait plusieurs sous-variantes développées pour une variété de rôles, allant du Gunship (AC-130 Spooky & Spectre), au contrôle de drones (DC-130), au Jammer et aux PSYOPS (EC-130 Compass Call) et à la reconnaissance météorologique (WC-130), entre autres. Vraiment une machine polyvalente qui mérite son surnom."
 CAP_transport_plane_equipment_5:0 "Lockheed C-141 Starlifter"
 CAP_transport_plane_equipment_5_short:0 "Avion de transport stellaire C-141"
 CAP_transport_plane_equipment_5_desc:0 "Conçu pour remplacer les C-124 Globemaster II et C-133 Cargomaster, le C-141 est entré en service en 1965 auprès du Military Air Transport Service (MATS), de son successeur, le Military Airlift Command (MAC), et enfin de l'Air Mobility Command (AMC) de l'US Air Force. Au cours de ses plus de 40 années de service, il a participé à de nombreuses opérations américaines à travers le monde, servant dans des zones de guerre au Vietnam et en Israël."
 CAP_transport_plane_equipment_6:0 "McDonnell Douglas C-5A Galaxy"
 CAP_transport_plane_equipment_6_short:0 "Galaxie C-5A"
 CAP_transport_plane_equipment_6_desc:0 "Le Lockheed C-5 Galaxy est un gros avion de transport militaire conçu et construit à l'origine par Lockheed, et maintenant entretenu et amélioré par son successeur, Lockheed Martin. Il fournit à l'US Air Force (USAF) une capacité de transport aérien stratégique à portée intercontinentale lourde, capable de transporter des charges surdimensionnées et surdimensionnées, y compris toutes les marchandises certifiées aériennes. Le Galaxy présente de nombreuses similitudes avec le plus petit Lockheed C-141 Starlifter et le dernier Boeing C-17 Globemaster III. Le C-5 fait partie des plus gros avions militaires au monde."
 CAP_transport_plane_equipment_7:0 "McDonnell Douglas C-5B Galaxy"
 CAP_transport_plane_equipment_7_short:0 "Galaxie C-5B"
 CAP_transport_plane_equipment_7_desc:0 "Le C-5B est une version améliorée du C-5A. Il incorporait toutes les modifications et améliorations apportées au C-5A avec des ailes améliorées, un train d'atterrissage simplifié, des turboréacteurs à double flux TF-39-GE-1C améliorés et une avionique mise à jour."
 CAP_transport_plane_equipment_8:0 "Boeing C-17A Globemaster III"
 CAP_transport_plane_equipment_8_short:0 "C-17A Globemaster III"
 CAP_transport_plane_equipment_8_desc:0 "Introduit en 1995, le C-17 était le troisième avion de sa famille à porter le nom de « Globemaster ». Servissant à la fois dans le rôle de transport aérien stratégique et tactique, le C-17 remplacerait le C-141 et libérerait de nombreuses tâches accomplies par le C-5 (déléguant le type au rôle de transport de fret hors taille). En service dans 8 pays, le « Globemaster III » continuera de répondre aux besoins de l'armée américaine dans les années à venir."
 CAP_transport_plane_equipment_9:0 "Boeing C-17A Globemaster III Bloc 21"
 CAP_transport_plane_equipment_9_short:0 "C-17A Bloc 21"
 CAP_transport_plane_equipment_9_desc:0 "Cette mise à niveau logicielle/matérielle constituait une amélioration majeure du système embarqué de génération de gaz inerte amélioré (OBIGGS II), d'un nouveau radar météorologique, d'un système de jambe de force stabilisatrice amélioré et d'autres éléments avioniques."
 CAP_transport_plane_equipment_10:0 "Boeing C-17A Globemaster III"
 CAP_transport_plane_equipment_10_short:0 "C-17A Bloc 21"
 CAP_transport_plane_equipment_10_desc:0 "Cette mise à niveau logicielle/matérielle constituait une amélioration majeure du système embarqué de génération de gaz inerte amélioré (OBIGGS II), d'un nouveau radar météorologique, d'un système de jambe de force stabilisatrice amélioré et d'autres éléments avioniques."

 #Missiles

 CAP_slbm_equipment_1:0 "UGM-19 Jupiter S"
 CAP_slbm_equipment_1_short:0 "Jupiter S"
 CAP_slbm_equipment_1_desc:0 "L'UGM-19 est la variante lancée par un sous-marin du missile PGM-19 utilisé par l'armée américaine. En raison de sa forme courte et trapue, le « Jupiter S » pourrait facilement être installé sur des navires de surface et des sous-marins."
 CAP_slbm_equipment_2:0 "UGM-27A Polaris"
 CAP_slbm_equipment_2_short:0 "Polaris A"
 CAP_slbm_equipment_2_desc:0 "Introduit en 1961, l'UGM-27A remplaçait le missile Jupiter en tant que SLBM. Missile à deux étages à pointe nucléaire, le « Polaris » a été conçu pour être utilisé comme contre-valeur de seconde frappe (puisque le CEP n'était pas assez bon pour contre-force de première frappe) dans le cadre de la contribution de la Marine à l'arsenal d'armes nucléaires des États-Unis, en remplacement du missile de croisière SSM-N-8 Regulus."
 CAP_slbm_equipment_3:0 "UGM-27B Polaris"
 CAP_slbm_equipment_3_short:0 "Polaris B"
 CAP_slbm_equipment_3_desc:0 "Également connue sous le nom de « Polaris A-2 », cette variante améliorée de l'UGB-27 était équipée d'une nouvelle ogive nucléaire, la W-47, qui augmentait le rendement de l'explosion. Cependant, des problèmes d'armement mécanique et de sécurité ont conduit à une durée de vie rapide car il a été rapidement remplacé par l'UGM-27C."
 CAP_slbm_equipment_4:0 "UGM-27C Polaris"
 CAP_slbm_equipment_4_short:0 "Polaris C"
 CAP_slbm_equipment_4_desc:0 "Également connue sous le nom de « Polaris A-3 », cette version a remplacé l'ancien W-47 par le W-58, une ogive nucléaire qui fonctionne comme un véhicule à rentrée multiple, divisée en trois ogives distinctes pouvant délivrer chacune une charge utile de 200 kt, ou pouvant être conservées ensemble pour un rendement théorique de 1 mégatonne. Un durcissement limité a été appliqué pour protéger les systèmes électroniques des missiles des effets des impulsions électromagnétiques nucléaires pendant la phase de propulsion."
 CAP_slbm_equipment_5:0 "UGM-73 Poséidon"
 CAP_slbm_equipment_5_short:0 "Poséidon"
 CAP_slbm_equipment_5_desc:0 "L'UGM-73 est un SLBM à deux étages propulsé par fusée à combustible solide qui a remplacé le précédent Polaris à partir de 1971-72. Équipé d'une ogive W-68 d'une puissance de 10-14 40-50 kt, le « Poséidon » était un missile compatible MIRV avec une charge utile plus élevée et une précision améliorée par rapport à son prédécesseur immédiat, et était l'unité la plus équipée sur les sous-marins nucléaires américains à missiles balistiques tout au long des années 70 et 80."
 CAP_slbm_equipment_6:0 "UGM-96 Trident I"
 CAP_slbm_equipment_6_short:0 "Trident I"
 CAP_slbm_equipment_6_desc:0 "L'UGM-96 a été développé en 1979 pour succéder au Poséidon SLBM. Il s'agit d'un missile propulsé par une fusée à combustible solide à trois étages équipé de huit ogives nucléaires W-76, chacune délivrant une puissance d'environ 100 kt, soit cinq fois supérieure à la bombe Fat Man qui a dévasté Nagasaki. Le « Trident I » est resté en service jusqu'à ce que toutes les unités soient complètement retirées en 2005."
 CAP_slbm_equipment_7:0 "UGM-133 TridentII"
 CAP_slbm_equipment_7_short:0 "Trident II"
 CAP_slbm_equipment_7_desc:0 "L'UGM-133, missile actuellement conçu et utilisé par les sous-marins de la marine américaine, est une arme puissante avec laquelle il faut compter. Avec une autonomie de plus de 7 500 milles (12 000 km) et étant équipé de 8 à 14 exemplaires soit du W-76 utilisé sur son prédécesseur, soit du W-88, plus dévastateur, avec une puissance nucléaire de 425 kt, le « Trident II » restera un formidable moyen de dissuasion pour les États-Unis dans un avenir prévisible."
 
 CAP_irbm_equipment_1:0 "PGM-17 Thor"
 CAP_irbm_equipment_1_short:0 "Thor"
 CAP_irbm_equipment_1_desc:0 "Premier missile balistique opérationnel utilisé par l'US Air Force, le PGM-17 (désignation originale - SM-75) a été développé en 1956 par crainte du développement soviétique de missiles à longue portée. Les ogives typiques avaient une puissance de 1,44 mégatonne, ce qui en faisait une arme très puissante. Bien qu'ils aient été retirés du service en 1963, les « Thor » pouvaient être réactivés à tout moment, pour frapper des cibles comme un éclair."
 CAP_irbm_equipment_2:0 "PGM-19 Jupiter A"
 CAP_irbm_equipment_2_short:0 "Jupiter A"
 CAP_irbm_equipment_2_desc:0 "Le PGM-19 a été le premier missile balistique à moyenne portée à pointe nucléaire utilisé par l'US Air Force. Développé à l'origine pour l'armée et la marine américaines, le missile a conservé une forme trapue pour être utilisé dans les sous-marins, bien que la marine ait finalement choisi de développer le missile Polaris. Le « Jupiter », du nom du roi romain des dieux, serait équipé d'une ogive nucléaire d'une puissance de 1,1 mégatonne."
 CAP_irbm_equipment_3:0 "PGM-19 Jupiter C"
 CAP_irbm_equipment_3_short:0 "Jupiter C"
 CAP_irbm_equipment_3_desc:0 "Introduit en 1958 en tant que mise à niveau du PGM-19A, le « Jupiter-C » a été développé avec un fuselage allongé pour permettre l'utilisation de plusieurs fusées à combustible solide. Bien qu'il ait été utilisé pour tester la rentrée de fusées usagées, il a été reconverti en IRBM."
 CAP_irbm_equipment_4_short:0 "Junon Ier"
 CAP_irbm_equipment_4_desc:0 "Développé à partir du Jupiter-C, le « Juno » (du nom de la reine romaine des dieux) a pris le modèle Jupiter-C et a incorporé un quatrième étage, qui a été monté au-dessus de la « baignoire » du troisième étage, et a tiré après l'épuisement du troisième étage pour augmenter la charge utile. Ce système a été incorporé pour le lancement de satellites et a été le système de livraison qui a lancé le premier satellite américain, « Explorer 1 », dans l'espace. En tant qu'ICBM, le quatrième étage inclus aurait augmenté la portée d'une charge nucléaire (qui aurait probablement été la même que celle du Jupiter précédent) à environ 2 000 km ou ~ 1 250 mi)"
 CAP_irbm_equipment_5:0 "PGM-19E Junon II"
 CAP_irbm_equipment_5_short:0 "Junon II"
 CAP_irbm_equipment_5_desc:0 "Le Juno II est un développement ultérieur du Juno I, bien que contrairement à son prédécesseur, il s'inspire du modèle Jupiter-A, dont le Juno II utilise les fusées du premier pour son premier étage. Pour ses deuxième, troisième et quatrième étages, il utilise une plateforme de fusée dérivée du système de missile MGM-29 Redstone. Utilisé comme plates-formes de lancement pour les derniers satellites Explorer ainsi que pour Pioneer 4 (le premier satellite américain à s'échapper de l'orbite terrestre et la première sonde lunaire réussie), une version hypothétique d'un missile balistique pourrait avoir une portée allant jusqu'à ~ 2 500 km (~ 1 550 km)"
 CAP_irbm_equipment_6:0 "MGM-31C Pershing II"
 CAP_irbm_equipment_6_short:0 "Pershing II"
 CAP_irbm_equipment_6_desc:0 "Entré en service en 1983, le MGM-31C a été développé comme une mise à niveau des missiles Pershing I et Pershing Ia, ce qui explique sa désignation « Pershing II » (Pershing étant nommé d'après John J. Pershing, l'un des deux hommes ayant le grade de « général des armées » ou général six étoiles). Il était équipé d'une ogive capable de passer d'une puissance de 5 kt à 80 kt."
 CAP_irbm_equipment_7:0 "MGM-31D Pershing III"
 CAP_irbm_equipment_7_short:0 "Pershing III"
 CAP_irbm_equipment_7_desc:0 "Développé dans le prolongement du système Pershing, le « Pershing III » était une version à quatre étages de 25 000 livres (11 000 kg) qui remplacerait le LGM-118 Peacekeeper. En raison des limitations des traités de réduction des armements stratégiques. Il devait être lancé à partir de lanceurs M1003 modifiés, la troisième modification du troisième type de missile « Pershing »."
 CAP_irbm_equipment_8:0 "MGM-31E Pershing II Portée réduite"
 CAP_irbm_equipment_8_short:0 "Pershing IIRR"
 CAP_irbm_equipment_8_desc:0 "Version modifiée du précédent MGM-31C, la variante « E » a été développée dans un souci de portée plus courte afin de se conformer au Traité sur les forces nucléaires à portée intermédiaire (INF). Comparé aux Pershing II et III, le Pershing à autonomie réduite aurait eu une autonomie opérationnelle d'environ 1 200 km (745 mi), inférieure aux 1 770 km (1 100 mi) de l'original."
 
 CAP_srbm_equipment_1:0 "Hermès B-1"
 CAP_srbm_equipment_1_short:0 "Hermès"
 CAP_srbm_equipment_1_desc:0 "Développé en réponse aux attaques de roquettes de l'Allemagne nazie en Europe, l'Hermes a été conçu comme un projet d'essai qui deviendrait finalement l'ancêtre du programme de missiles américain. Nommée d'après le dieu messager grec, la variante B « Hermes » était un missile de croisière propulsé par un statoréacteur Mach 4. Il serait désigné SSM-G-9 et SSM-A-9."
 CAP_srbm_equipment_2:0 "Caporal MGM-5"
 CAP_srbm_equipment_2_short:0 "Caporal"
 CAP_srbm_equipment_2_desc:0 "Le MGM-5 a été le premier missile guidé américain autorisé à transporter une tête nucléaire. Missile balistique tactique, le « Caporal » était un missile balistique à courte portée d'une portée de 75 milles marins (140 km). En plus d'une pointe nucléaire (qui sera introduite plus tard dans sa carrière), il peut également être équipé d'un missile conventionnel hautement explosif (HE)."
 CAP_srbm_equipment_3:0 "Pierre rouge PGM-11"
 CAP_srbm_equipment_3_short:0 "Pierre rouge"
 CAP_srbm_equipment_3_desc:0 "Le premier missile balistique opérationnel utilisé par l'armée américaine, le PGM-11 (à l'origine SSM-G-14 en 1950, SSM-A-14 en 1951 et M8 et M9 en 1955) était un descendant direct de la fusée nazie V-2, développée par des ingénieurs de fusées allemands amenés aux États-Unis à la suite de l'opération Paperclip. Le « Redstone », du nom de l'arsenal éponyme de Huntsville, en Alabama, où il a été développé, était un missile à courte portée qui a servi à la défense active de l'Europe occidentale pendant la guerre froide. C'était également le premier missile à être équipé d'une tête nucléaire."
 CAP_srbm_equipment_4:0 "Crosse MGM-18"
 CAP_srbm_equipment_4_short:0 "Crosse"
 CAP_srbm_equipment_4_desc:0 "Arme balistique tactique à courte portée destinée au soutien rapproché des troupes au sol, le MGM-18 a été introduit en 1959 alors que le missile était encore en phase de développement. Bien qu'il puisse être équipé d'une ogive nucléaire HE ou de 1,5 à 10 kilotonnes, des problèmes de fiabilité et des difficultés avec le système de guidage et sa sensibilité à l'ECM ont conduit au retrait du « Lacrosse » quelques années plus tard."
 CAP_srbm_equipment_5:0 "Sergent MGM-29"
 CAP_srbm_equipment_5_short:0 "Sergent"
 CAP_srbm_equipment_5_desc:0 "Autre produit de Redstone Arsenal, le MGM-29 a été introduit en 1962 en remplacement du MGM-5 Corporal. Surnommé le « Sergent », c'était le dernier missile de ce type nommé d'après les conventions de classement des enrôlés de l'armée américaine. Outre une ogive nucléaire de 200 kilotonnes, le MGM-29 peut également être équipé d'ogives hautement explosives, biologiques et chimiques."
 CAP_srbm_equipment_6:0 "MGM-31A Pershing1"
 CAP_srbm_equipment_6_short:0 "Pershing 1"
 CAP_srbm_equipment_6_desc:0 "Le MGM-31 était le premier de ce qui allait être la série continue de missiles balistiques de longue durée en service par l'armée américaine. Déployé en 1963, le MGM-31A a été développé pour succéder au missile Redstone et a été initialement désigné sous le nom de « Redstone-S » avant de choisir la désignation « Pershing I ». Il était équipé d'une ogive nucléaire de 60 à 400 kilotonnes."
 CAP_srbm_equipment_7:0 "Lance MGM-52"
 CAP_srbm_equipment_7_short:0 "Lance"
 CAP_srbm_equipment_7_desc:0 "Déployé en 1972, le MGM-52 constituait une amélioration par rapport au MGM-29 Sergeant qu'il remplaçait, avec une précision et une mobilité accrues. Sa charge utile était soit l'ogive nucléaire W70 (d'une puissance de 1 à 100 kilotonnes), une ogive hautement explosive à charge creuse pour détruire les bunkers, soit l'ogive M251 avec des sous-munitions explosives pour le rôle de distributeur à distance. Avec des ogives aussi polyvalentes à sa disposition, la « Lance » est sûre de pénétrer les défenses ennemies et d'ouvrir la voie aux troupes pour avancer."
 CAP_srbm_equipment_8:0 "MGM-140A ATACMS Bloc I"
 CAP_srbm_equipment_8_short:0 "ATACMS Bloc I"
 CAP_srbm_equipment_8_desc:0 "Le MGM-140 (à l'origine M39) a été introduit en 1991 en remplacement de l'ancienne Lance MGM-52 dans le rôle conventionnel de SRBM. Capable d'être lancé à partir du système M270 MLRS, le MGM-140A contient une ogive pouvant transporter jusqu'à 950 sous-munitions explosives d'une portée de 80 miles (128 km). Officiellement connu sous le nom d'ATACMS, abréviation de « Army TACtical Missile System »."
 CAP_srbm_equipment_9:0 "MGM-164 ATACMS Bloc II"
 CAP_srbm_equipment_9_short:0 "ATACMS Bloc II"
 CAP_srbm_equipment_9_desc:0 "Initialement désigné M39A3 et plus tard MGM-140C, le MGM-164 est la désignation de la deuxième génération de missiles ATACMS. Développé au cours de la seconde moitié des années 1990 et au début des années 2000, le missile devait être équipé des sous-munitions antichar Brilliant, conférant à l'arme une puissance mortelle contre les chars de la guerre froide utilisés dans l'après-guerre froide."
 
 CAP_icbm_equipment_1:0 "LGM-30A Minuteman I"
 CAP_icbm_equipment_1_short:0 "Minuteman I"
 CAP_icbm_equipment_1_desc:0 "Le LGM-30A (anciennement SM-80) a été introduit en 1962 pour jouer un rôle de dissuasion nucléaire, menaçant les Soviétiques d'une puissante contre-attaque de représailles si les États-Unis étaient attaqués en premier. Cependant, grâce au missile Polaris de la Marine, l'US Air Force a été autorisée à développer davantage le missile, améliorant ainsi la précision. Son surnom « Minuteman » a été donné parce que, tout comme l'infanterie légère titulaire de la guerre d'indépendance américaine, le missile a été conçu pour être lancé à tout moment."
 CAP_icbm_equipment_2:0 "LGM-30G Minuteman III"
 CAP_icbm_equipment_2_short:0 "Minuteman III"
 CAP_icbm_equipment_2_desc:0 "Le LGM-30G était le développement final de la plate-forme Minuteman ICBM. Lors de sa mise en service en 1972, il s'agissait de la première plate-forme de missile à utiliser une ogive MIRV. Son ogive était composée de trois ogives nucléaires W62, chacune d'une puissance de 170 kT, par rapport au W56 de son prédécesseur avec 1,2 MT. Depuis 2019, le « Minuteman III » est le seul ICBM terrestre actuellement en service aux États-Unis."
 CAP_icbm_equipment_3:0 "LGM-70B Minuteman IV"
 CAP_icbm_equipment_3_short:0 "Minuteman IV"
 CAP_icbm_equipment_3_desc:0 "Le LGM-70B était un développement ultérieur des plates-formes Minuteman II. Ces missiles sont modifiés avec des émetteurs radio améliorés, un héritage du système de communication de fusée d'urgence (ERCS) utilisé sur les LEM-70A de désignation similaire. Le missile serait à son tour utilisé comme avant-garde d'une attaque de première frappe ou de représailles, donnant le feu vert aux autres unités du SAC au cours de son déplacement, permettant ainsi de lancer d'autres missiles en succession rapide."
 CAP_icbm_equipment_4:0 "LGM-118A Gardien de la paix"
 CAP_icbm_equipment_4_short:0 "Gardien de la paix"
 CAP_icbm_equipment_4_desc:0 "Introduit en 1986 dans le cadre du projet « Star Wars » du président Reagan, le LGM-118A (également connu sous le nom de missile MX) a été développé pour permettre aux États-Unis de résister à une attaque sournoise de la flotte ICBM soviétique, puis de lancer une contre-attaque. Il s'agissait d'un missile MIRV pouvant transporter 10 ogives nucléaires W87 de 300 kT dans son véhicule de rentrée. Cependant, en raison du traité START II (bien que les États-Unis n'aient jamais ratifié ledit traité) et de la possibilité pour le Minuteman de déployer des ogives uniques pour beaucoup moins cher, le « Peacekeeper » serait retiré du service. Ses composants seraient utilisés par une entreprise privée pour développer un système de lancement civil consommable, le « Minotaur IV »."
 CAP_icbm_equipment_5:0 "MGM-134 Nain"
 CAP_icbm_equipment_5_short:0 "Nain"
 CAP_icbm_equipment_5_desc:0 "Développé en 1991 au crépuscule de la guerre froide, le MGM-134 a été développé pour répondre au besoin d'un petit ICBM pouvant être lancé à partir de véhicules routiers, face à la menace croissante des sous-marins soviétiques qui pourraient lancer des ICBM depuis la côte et priver les États-Unis d'une capacité de frappe de représailles. Equipé d'une ogive nucléaire de 475 kT, le « Midgetman » serait lancé depuis le Hard Mobile Launcher, capable d'être protégé des radiations."

 CAP_cruisemissile_equipment_0:0 "JB-2 Huard"
 CAP_cruisemissile_equipment_0_short:0 "JB-2 Huard"
 CAP_cruisemissile_equipment_0_desc:0 "Le JB-2 était une copie américaine de la bombe volante allemande V-1. Développé en 1944, il était initialement destiné à être utilisé lors de l'opération Downfall, l'invasion alliée du Japon. Mais en raison de l'utilisation d'armes atomiques, le « Loon » n'a jamais été utilisé au combat. Malgré cela, le JB-2 jouerait un rôle important dans le développement des systèmes de missiles tactiques sol-sol."
 CAP_cruisemissile_equipment_1:0 "Matador MGM-1"
 CAP_cruisemissile_equipment_1_short:0 "Matador MGM-1"
 CAP_cruisemissile_equipment_1_desc:0 "Le MGM-1 (à l'origine SSM-A-1 en 1949, le bombardier B-61 sous la désignation de l'US Air Force et le TM-61 en 1955) fut le premier missile de croisière développé aux États-Unis, mis en service en 1952. Bien que similaire dans son concept à son prédécesseur, le JB-2 Loon, et au V-1 allemand, il comprenait une commande radio qui permettait des corrections de trajectoire en vol, permettant ainsi de maintenir la précision pendant des distances plus grandes que les missiles balistiques. Il peut être équipé d'une puissance nucléaire allant de 1 à 120 kilotonnes, mais il existe des variantes d'ogives hautement explosives. Son surnom est « Matador »."
 CAP_cruisemissile_equipment_2:0 "SM-62 Snark"
 CAP_cruisemissile_equipment_2_short:0 "SM-62 Snark"
 CAP_cruisemissile_equipment_2_desc:0 "Missile de croisière à portée intercontinentale, le SM-62 (à l'origine SSM-A-3 et B-62) était un missile à réaction d'une portée de 5 500 milles marins (10 200 km), le missile de croisière à plus longue portée jamais déployé par les États-Unis. Développé comme moyen de dissuasion provisoire pendant le développement des ICBM, le « Snark » (du nom d'un animal fictif dans « La chasse au Snark » de Lewis Carroll) serait retiré une fois que les ICBM seraient correctement déployés."
 CAP_cruisemissile_equipment_3:0 "Masse MGM-13"
 CAP_cruisemissile_equipment_3_short:0 "Masse MGM-13"
 CAP_cruisemissile_equipment_3_desc:0 "Développé en 1956 comme amélioration et successeur du MGM-1, le MGM-13 (à l'origine le TM-76) pouvait atteindre des vitesses transsoniques avec une portée allant de 540 à 1 300 milles selon l'altitude du missile. Un système de correspondance de cartes radar a été intégré à ses systèmes, permettant une correction de cap si le terrain ne correspondait pas au film du terrain à cibler. Surnommé « Mace », le MGM-13 servirait de missile de dissuasion et de croisière jusqu'à ce qu'il soit remplacé respectivement par le MGM-31 Pershing et le BGM-109."
 CAP_cruisemissile_equipment_4:0 "Griffon BGM-109G"
 CAP_cruisemissile_equipment_4_short:0 "Griffon BGM-109G"
 CAP_cruisemissile_equipment_4_desc:0 "Le BGM-109G remplaçait le précédent missile Mace et a été développé à partir du missile Tomahawk lancé par un navire. Introduit en 1983, le BGM-109G a été développé pour contrer le Sabre mobile SS-20 utilisé par l'Union soviétique. Equipé d'une ogive nucléaire W84 à rendement variable (avec des rendements compris entre 0,2 et 150 kt), le missile, aux côtés de la gamme Pershing d'IRBM et de SRBM, a conduit l'Union soviétique à être plus disposée à signer le Traité sur les forces nucléaires à portée intermédiaire (traité INF). Bien qu'il soit également connu sous le nom de missile de croisière lancé au sol (GLCM), sa désignation officielle et son surnom sont BGM-109G « Gryphon »."
 CAP_cruisemissile_equipment_5:0 "AGM-129 ACM"
 CAP_cruisemissile_equipment_5_short:0 "ACM"
 CAP_cruisemissile_equipment_5_desc:0 "Introduit en 1990, l'AGM-129 ACM (abréviation de Advanced Cruise Missile) était un missile de croisière à lancement aérien à faible visibilité transporté exclusivement par les bombardiers stratégiques B-52H Stratofortress de l'US Air Force. Il a été développé par crainte que l'AGM-86 ait des difficultés à pénétrer les futurs systèmes de défense aérienne. Bien que capable de transporter une ogive nucléaire W80 (comme celle utilisée dans son prédécesseur, avec une puissance de 5 à 150 kt), la variante « C » de ce missile possède une ogive hautement explosive conventionnelle."
 CAP_cruisemissile_equipment_6:0 "AGM-158 JASSM"
 CAP_cruisemissile_equipment_6_short:0 "JASMIN"
 CAP_cruisemissile_equipment_6_desc:0 "L'AGM-158 représente le summum de la technologie des missiles de croisière. Reprendre le besoin de l'AGM-129 d'un missile à lancement aérien à faible distance observable. L'AGM-158, introduit en 2009, peut être lancé à partir d'une variété d'avions de combat modernes, allant des chasseurs comme le F-35 et le F-15E aux bombardiers comme le B-52H et le B-1B. Désigné JASSM (Joint Air-to-Surface Standoff Missile), l'AGM-158 se distingue de la plupart des missiles de croisière en ce sens qu'il n'a pas de capacité nucléaire, étant strictement un missile de croisière à ogive conventionnelle."

 CAP_coastalmissile_equipment_3:0 "Harpon BGM-84A"
 CAP_coastalmissile_equipment_3_short:0 "Harpon BGM-84A"
 CAP_coastalmissile_equipment_4:0 "Harpon BGM-84C"
 CAP_coastalmissile_equipment_4_short:0 "Harpon BGM-84C"
 CAP_coastalmissile_equipment_5:0 "BGM-109B TASM"
 CAP_coastalmissile_equipment_5_short:0 "BGM-109B TASM"
 
 #Helicopter

 CAP_naval_helicopter_equipment_1:0 "Bell HTL-4 Sioux"
 CAP_naval_helicopter_equipment_1_short:0 "HTL-4 Sioux"
 CAP_naval_helicopter_equipment_1_desc:0 "Le HTL était un hélicoptère léger monomoteur à rotor unique dérivé du Bell 47A civil. Acquis par l'US Navy en 1947, le HTL-4 (la variante désignée par la Navy) se distinguait de ceux utilisés par les autres branches par le retrait du revêtement en tissu sur la poutre de queue. Sinon, il conserve bon nombre de ses caractéristiques, y compris la verrière distinctive en forme de « bulle de savon » offrant au pilote une large vue. Plus tard désigné TH-13L. Son surnom, qui vient du nom des hélicoptères des tribus amérindiennes, est « Sioux »."
 CAP_naval_helicopter_equipment_2:0 "Sikorsky HSS-1 Seabat"
 CAP_naval_helicopter_equipment_2_short:0 "Bat-marin HSS-1"
 CAP_naval_helicopter_equipment_2_desc:0 "Le HSS est la variante anti-sous-marine du S-58 de Sikorsky, une version améliorée du S-55 (et du H-19 Chickasaw militaire). Il avait un nez plus petit, mais avec un fuselage arrière et un train d'atterrissage à traîneau de queue, plutôt que le modèle à queue haute et à 4 montants de son prédécesseur. Plus tard rebaptisé SH-34G, les variantes anti-sous-marins de cet hélicoptère ont reçu le surnom officiel de « Seabat »."
 CAP_naval_helicopter_equipment_3:0 "Kaman SH-2D Seasprite"
 CAP_naval_helicopter_equipment_3_short:0 "SH-2D Seasprite"
 CAP_naval_helicopter_equipment_3_desc:0 "Introduit au début des années 1960 en remplacement du SH-34 Seabat, le SH-2 (initialement désigné HU2K) fut le premier hélicoptère anti-sous-marin capable d'être déployé sur des navires américains en plus des porte-avions. Cette portabilité a prolongé la carrière du « Seasprite » et des variantes améliorées ont existé. La variante représentée dans le jeu est la variante « D », la variante anti-sous-marine initiale."
 CAP_naval_helicopter_equipment_4:0 "Sikorsky SH-3A Sea King"
 CAP_naval_helicopter_equipment_4_short:0 "SH-3A Sea King"
 CAP_naval_helicopter_equipment_4_desc:0 "Développé à partir du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère ASW bimoteur. Il s'agissait du premier hélicoptère amphibie au monde, capable de décoller à la fois depuis la terre et depuis la mer. Il fut également, aux côtés de son contemporain le Seasprite, l'un des premiers hélicoptères ASW à utiliser des turbomoteurs. En plus des fonctions ASW, le SH-3 a également joué des rôles de recherche et de sauvetage (SAR), de transport, d'évacuation sanitaire et d'alerte précoce aéroportée (AEW), un certain nombre d'hélicoptères étant utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pour cette raison qu'il a gagné le surnom de « Sea King », l'hélicoptère le plus polyvalent au monde."
 CAP_naval_helicopter_equipment_5:0 "Sikorsky SH-60B Seahawk"
 CAP_naval_helicopter_equipment_5_short:0 "SH-60B Seahawk"
 CAP_naval_helicopter_equipment_5_desc:0 "Le SH-60 est la variante de l'hélicoptère UH-60 Blackhawk de l'armée américaine. (lui-même une variante militaire du Sikorsky S-70) Bien qu'il ait remplacé le précédent Sea King, le SH-60 n'a pas de capacité d'atterrissage amphibie, mais il conserve la capacité du SH-2 à atterrir sur n'importe quel navire américain capable d'héberger des hélicoptères. Capable de remplir bon nombre des mêmes rôles que le SH-3, le « Sea Hawk » représente l'avenir de l'aviation des hélicoptères de la marine américaine."
 CAP_naval_helicopter_equipment_6:0 "Sikorsky SH-60F Seahawk"
 CAP_naval_helicopter_equipment_6_short:0 "SH-60F Seahawk"
 CAP_naval_helicopter_equipment_6_desc:0 "Le SH-60F servait principalement de principal avion de guerre anti-sous-marine (ASW) du groupement tactique aéronaval. L'hélicoptère chassait les sous-marins avec son sonar plongeant AQS-13F et transportait un lanceur de bouées sonores à 6 tubes. Le SH-60F est officieusement nommé « Oceanhawk ». Le SH-60F peut transporter des torpilles Mk 46, Mk 50 ou Mk 54 pour ses armes offensives, et il dispose d'un choix de mitrailleuses montées sur le fuselage, notamment les M60D, M240D et GAU-16 (calibre.50) pour l'autodéfense."
 CAP_naval_helicopter_equipment_7:0 "Sikorsky MH-60R Seahawk"
 CAP_naval_helicopter_equipment_7_short:0 "MH-60R Seahawk"
 CAP_naval_helicopter_equipment_7_desc:0 "Le MH-60R Seahawk est une version améliorée du SH-60 Seahawk. Développé en 1993, le MH-60R a été conçu pour combiner les fonctionnalités des précédents SH-60B et SH-60F. Ses capteurs comprennent le package ASE, MTS-FLIR, l'interrogateur radar/IFF multimode AN/APS-147, une liaison de données de flotte aéroportée avancée et un sonar actif aéroporté plus avancé. Ceci, associé à un système d'armes amélioré (lui permettant de transporter la torpille avancée Mk 54 et les missiles AGM-114 Hellfire), confère au « Seahawk » une plus grande flexibilité dans les opérations d'assaut anti-navire et amphibie."

 CAP_attack_helicopter_equipment_1: "Cloche AH-1G Cobra"
 CAP_attack_helicopter_equipment_1_short: "AH-1G Cobra"
 CAP_attack_helicopter_equipment_1_desc:0 "Initialement introduit en 1966 comme hélicoptère d'attaque provisoire, l'AH-1 (développé avec une certaine compatibilité à partir de l'UH-1 Huey Iroquois) a été utilisé dans les mêmes rôles que l'AH-56 était destiné au cours de son cycle de développement. Il était souvent déployé dans des formations de chasseurs-tueurs, du rôle de « tueur » au rôle de « chasseur » assuré par l'OH-6 Cayuse, qui ont tous deux servi avec une grande distinction pendant la guerre du Vietnam. Bien qu'officiellement surnommé « Cobra », d'autres surnoms existent, notamment « HueyCobra » et « Snake »."
 CAP_attack_helicopter_equipment_2: "Bell AH-1S Cobra"
 CAP_attack_helicopter_equipment_2_short: "AH-1S Cobra"
 CAP_attack_helicopter_equipment_2_desc:0 "L'AH-1S de base est un AH-1Q amélioré avec un turbomoteur T53-L-703 de 1 800 shp (1 300 kW). L'AH-1S est équipé du sous-système de missile M65 TOW/Cobra, de l'unité de visée télescopique (TSU) M65 et du viseur Reflex M73."
 CAP_attack_helicopter_equipment_3: "Hughes AH-64A Apache"
 CAP_attack_helicopter_equipment_3_short: "AH-64A Apache"
 CAP_attack_helicopter_equipment_3_desc:0 "Introduit en 1986 pour remplacer l'AH-1 dans l'armée américaine, l'AH-64 est l'un des hélicoptères d'attaque les plus connus au monde. Il comprend une suite de capteurs montés sur le nez pour les systèmes d'acquisition de cibles et de vision nocturne. Un équipement de mission typique (et célèbre) est connu pour être son canon à chaîne de 30 mm transporté entre le train d'atterrissage et quatre points d'attache d'aile tronquée pour un mélange de nacelles de fusée Hydra et de missiles antichar AGM-114 Hellfire. Surnommé « Apache », l'AH-64 représente le summum de l'aviation par hélicoptère."
 CAP_attack_helicopter_equipment_4: "Arc long Apache McDonnell Douglas AH-64D"
 CAP_attack_helicopter_equipment_4_short: "AH-64D Apache à arc long"
 CAP_attack_helicopter_equipment_4_desc:0 "Fierté de l'armée américaine, en plus de sa superbe maniabilité, le radar Longbow fixé au-dessus du rotor principal améliore sa capacité à utiliser des missiles dans toutes sortes de conditions météorologiques. En raison du radar susmentionné, on lui donne le surnom d'« Apache Longbow »."
 CAP_attack_helicopter_equipment_5: "McDonnell Douglas AH-64E Gardien"
 CAP_attack_helicopter_equipment_5_short: "Gardien AH-64E"
 CAP_attack_helicopter_equipment_5_desc:0 "L'AH-64E est doté d'une connectivité numérique améliorée, du système de distribution d'informations tactiques interarmées, de moteurs T700-GE-701D plus puissants avec une transmission par train frontal améliorée pour accueillir plus de puissance, d'une capacité de contrôle de véhicules aériens sans pilote (UAV), d'une capacité IFR complète et d'un train d'atterrissage amélioré. Les nouvelles pales de rotor composites, testées avec succès en 2004, augmentent la vitesse de croisière, le taux de montée et la capacité de charge utile."
 
 CAP_scout_helicopter_equipment_1: "Hughes OH-6 Cayuse"
 CAP_scout_helicopter_equipment_1_short: "OH-6 Cayuse"
 CAP_scout_helicopter_equipment_1_desc:0 "Développé en 1960, l'OH-6 a été conçu dans le cadre du projet Light Observation Helicopter (LOH), à des fins d'observation, d'évacuation des blessés, de transport de personnel et d'attaque légère. Le design de Hughes serait celui qui réussirait parmi onze autres designs concurrents. Il remplacerait l'O-1 Bird Dog dans le rôle d'observation lorsque le département américain de la Défense ordonnait à l'armée américaine de transférer tous les avions à voilure fixe à l'US Air Force. Servi avec distinction pendant la guerre du Vietnam, l'OH-6 avait montré la valeur des hélicoptères d'observation comme support aux hélicoptères d'attaque comme l'AH-1 ou aux forces terrestres pour engager les ennemis. Officiellement connu sous le nom de « Cayuse » (d'après la tribu amérindienne du nord-ouest du Pacifique), les pilotes lui ont donné le surnom de « Loach » en hommage au programme qui l'a engendré."
 CAP_scout_helicopter_equipment_2: "Bell OH-58A Kiowa"
 CAP_scout_helicopter_equipment_2_short: "OH-58A Kiowa"
 CAP_scout_helicopter_equipment_2_desc:0 "Introduit en 1969, au plus fort de la guerre du Vietnam, l'OH-58 était un hélicoptère à 4 places dont la particularité remarquable était que, malgré la présence de 2 pilotes, les commandes du pilote sur le siège gauche pouvaient être retirées pour transporter un passager à l'avant. Pendant la guerre du Vietnam, son armement était un seul minigun M134 ou un lance-grenades M129. Après la guerre, l'OH-58 recevra de nombreuses modifications, avec une mise à niveau du moteur (le mettant au niveau du dernier OH-58C), un système d'imagerie thermique, un ensemble de communications pour les forces de l'ordre, un équipement de navigation amélioré et un équipement de dérapage élevé. Ces variantes améliorées du « Kiowa » (du nom d'une tribu amérindienne originaire du Montana et du Colorado) participeraient aux opérations antidrogue RAID de la Garde nationale militaire."
 CAP_scout_helicopter_equipment_3: "Bell OH-58D Kiowa"
 CAP_scout_helicopter_equipment_3_short: "OH-58D Kiowa"
 CAP_scout_helicopter_equipment_3_desc:0 "La variante « D » améliorée du Kiowa était le résultat du programme d'amélioration des hélicoptères de l'armée (AHIP). Il était doté de fonctionnalités telles qu'une transmission et un moteur améliorés pour les vols en sieste de terre (niveau extrêmement bas) de l'hélicoptère, ainsi qu'une configuration unique de rotor principal à quatre pales qui lui permettait d'être beaucoup plus silencieux que les autres hélicoptères, plus encore ses prédécesseurs. L'OH-58D a introduit le viseur distinctif monté sur mât (MMS) au-dessus du système de rotor et un cockpit en verre mixte, avec des instruments traditionnels identifiés comme « en veille » pour une utilisation d'urgence."
 CAP_scout_helicopter_equipment_4: "Bell OH-58D Kiowa Guerrier"
 CAP_scout_helicopter_equipment_4_short: "OH-58D Kiowa Guerrier"
 CAP_scout_helicopter_equipment_4_desc:0 "Le Kiowa Warrior, parfois désigné par son acronyme KW, est la version armée du OH-58D Kiowa. La principale différence qui distingue le Kiowa Warrior de l'avion AHIP d'origine est un pylône d'armes universel monté des deux côtés de l'avion. La mise à niveau du Kiowa Warrior comprend également des améliorations de la puissance disponible, de la navigation, de la communication et de la capacité de survie, ainsi que des modifications visant à améliorer la déployabilité de l'avion."
 CAP_scout_helicopter_equipment_5:0 "Eurocopter UH-72 Lakota"
 CAP_scout_helicopter_equipment_5_short:0 "UH-72 Lakota"
 CAP_scout_helicopter_equipment_5_desc:0 "L'UH-72 est conçu pour assumer une gamme de missions, du soutien général et de l'évacuation médicale (MEDEVAC) à la récupération du personnel et aux opérations de lutte contre les stupéfiants. Il est prévu qu'ils remplacent les UH-1 et OH-58A/C, qui sont des hélicoptères utilitaires légers plus anciens, et supplantent d'autres types à usage domestique, principalement ceux du service de la Garde nationale de l'armée. L'UH-72 est acheté en tant que produit commercial standard (COTS), ce qui simplifie le support logistique de la flotte."

 CAP_utility_helicopter_equipment_1:0 "Sikorsky H-34 Choctaw"
 CAP_utility_helicopter_equipment_1_short:0 "H-34 Choctaw"
 CAP_utility_helicopter_equipment_1_desc:0 "Le Sikorsky H-34 (désignation de la société S-58, désignation de la Marine HUS) est un hélicoptère militaire à moteur à pistons conçu à l'origine comme guerre anti-sous-marine (ASW), mais a ensuite été reconverti en transport moyen. Il deviendrait le dernier hélicoptère à moteur à pistons exploité par le Corps des Marines des États-Unis, car depuis lors, tous les hélicoptères utilisaient des moteurs à turbine. Dans la Marine (sous le nom d'UH-34), il est connu sous le nom de « Seahorse », tandis que les variantes de l'Armée (sous le nom de CH-34) ont pris le nom de « Choctaw »."
 CAP_utility_helicopter_equipment_2:0 "Bell UH-1A Iroquois"
 CAP_utility_helicopter_equipment_2_short:0 "UH-1A Iroquois"
 CAP_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."
 CAP_utility_helicopter_equipment_3:0 "Bell UH-1D Iroquois"
 CAP_utility_helicopter_equipment_3_short:0 "UH-1D Iroquois"
 CAP_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 CAP_utility_helicopter_equipment_4:0 "Bell UH-1N Twin Huey"
 CAP_utility_helicopter_equipment_4_short:0 "UH-1N Twin Huey"
 CAP_utility_helicopter_equipment_4_desc:0 "Introduit pour la première fois en 1970, l'UH-1N était un autre membre de la famille élargie « Huey », cette fois développé à partir de l'UH-1H, bien que contrairement à l'UH-1A et à l'UH-1D, la variante « N » serait celle qui donnerait naissance à sa version civile, le Bell 212. Le rotor principal est propulsé par deux turbomoteurs qui entraînent un seul arbre de sortie. En cas de panne d'un moteur, le moteur restant peut fournir 671 kW (900 shp) pendant 30 minutes ou 571 kW (765 shp), permettant à l'UH-1N de maintenir ses performances de croisière au poids maximum. C'était également l'une des rares variantes « iroquoises » à ne pas être utilisée par l'armée américaine, étant plutôt le porte-drapeau des Marines. Sa configuration bimoteur lui a valu le surnom informel de « Twin Huey »."
 CAP_utility_helicopter_equipment_5:0 "Sikorsky UH-60A Faucon Noir"
 CAP_utility_helicopter_equipment_5_short:0 "UH-60A Faucon Noir"
 CAP_utility_helicopter_equipment_5_desc:0 "Entré en service en 1979, l'UH-60A a succédé à l'UH-1 en tant que plate-forme d'hélicoptère utilitaire de l'armée américaine. Développé à partir du S-70 civil, l'UH-60A pouvait transporter jusqu'à 15 personnes (4 membres d'équipage et jusqu'à 11 soldats équipés). Nommé d'après un chef de tribu amérindienne Sauk, le « Blackhawk » a servi au combat lors de conflits à la Grenade, au Panama, en Irak, en Somalie, dans les Balkans, en Afghanistan et dans d'autres régions du Moyen-Orient."
 CAP_utility_helicopter_equipment_6:0 "Sikorsky UH-60L Faucon Noir"
 CAP_utility_helicopter_equipment_6_short:0 "UH-60L Faucon Noir"
 CAP_utility_helicopter_equipment_6_desc:0 "Une mise à niveau de l'UH-60A, la variante « L » du « Blackhawk » comprend des moteurs améliorés, une boîte de vitesses à durabilité améliorée et un système de commandes de vol mis à jour. Introduit en 1990, l'UH-60L est la principale variante de la variante utilitaire du H-60 actuellement en service dans l'armée américaine, avec des considérations sur le type utilisé pour remplacer l'UH-1N dans l'US Air Force."
 CAP_utility_helicopter_equipment_7:0 "Sikorsky UH-60M Faucon Noir"
 CAP_utility_helicopter_equipment_7_short:0 "UH-60M Faucon Noir"
 CAP_utility_helicopter_equipment_7_desc:0 "Pales de rotor à large corde de conception améliorée, moteurs T700-GE-701D (max 2 000 shp ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur du système de gestion intégré de la santé du véhicule (IVHMS) et nouveau cockpit en verre."

 CAP_cargo_helicopter_equipment_1:0 "Boeing CH-47A Chinook"
 CAP_cargo_helicopter_equipment_1_short:0 "CH-47A Chinook"
 CAP_cargo_helicopter_equipment_1_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à rotor tandem qui compte parmi les hélicoptères de transport les plus lourds de l'Ouest. Remplaçant le CH-37 Mojave, le CH-47 possède plusieurs moyens de chargement de diverses marchandises, notamment plusieurs portes à travers le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. C'était également l'hélicoptère le plus rapide parmi ses contemporains lors de son introduction en 1962, et il est toujours considéré actuellement comme l'un des hélicoptères les plus rapides de l'arsenal de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État de Washington actuel."
 CAP_cargo_helicopter_equipment_2:0 "Étalon de mer Sikorsky CH-53A"
 CAP_cargo_helicopter_equipment_2_short:0 "Étalon de mer CH-53A"
 CAP_cargo_helicopter_equipment_2_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à rotor tandem qui compte parmi les hélicoptères de transport les plus lourds de l'Ouest. Remplaçant le CH-37 Mojave, le CH-47 possède plusieurs moyens de chargement de diverses marchandises, notamment plusieurs portes à travers le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. C'était également l'hélicoptère le plus rapide parmi ses contemporains lors de son introduction en 1962, et il est toujours considéré actuellement comme l'un des hélicoptères les plus rapides de l'arsenal de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État de Washington actuel."
 CAP_cargo_helicopter_equipment_3:0 "Boeing CH-47D Chinook"
 CAP_cargo_helicopter_equipment_3_short:0 "CH-47D Chinook"
 CAP_cargo_helicopter_equipment_3_desc:0 "Le CH-47D partage la même cellule que les modèles précédents, la principale différence étant l'adoption de moteurs plus puissants. Les premiers CH-47D étaient à l'origine propulsés par deux moteurs T55-L-712, le moteur le plus courant étant le dernier T55-GA-714A. Grâce à son système de chargement à triple crochet, le CH-47D peut transporter de lourdes charges utiles à l'intérieur et jusqu'à 26 000 lb (12 000 kg) (comme des conteneurs de 40 pieds ou de 12 mètres) à l'extérieur. Il a été mis en service pour la première fois en 1979. Dans les opérations d'assaut aérien, il sert souvent de moteur principal à l'obusier M198 de 155 mm, accompagnant 30 cartouches et un équipage de 11 hommes."
 CAP_cargo_helicopter_equipment_4:0 "Sikorsky CH-53E Super Étalon"
 CAP_cargo_helicopter_equipment_4_short:0 "CH-53E Super Étalon"
 CAP_cargo_helicopter_equipment_4_desc:0 "En octobre 1967, le Corps des Marines des États-Unis a émis un besoin en matière d'hélicoptère d'une capacité de levage 1,8 fois supérieure à celle du CH-53D, qui pourrait être installé sur des navires de guerre amphibie. L'US Navy et l'US Army recherchaient également à l'époque des hélicoptères similaires. Avant l'émission de l'exigence, Sikorsky travaillait sur une amélioration du CH-53D, sous la désignation d'entreprise « S-80 », comprenant un troisième turbomoteur et un système de rotor plus puissant. Sikorsky a proposé la conception du S-80 aux Marines en 1968. Les Marines ont apprécié l'idée, car elle promettait de fournir rapidement une bonne solution et ont financé le développement d'un hélicoptère de banc d'essai pour évaluation. Le contrat de production initial a été attribué en 1978 et le lancement du service a suivi en février 1981."
 CAP_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Bloc II"
 CAP_cargo_helicopter_equipment_5_short:0 "CH-47D Bloc II"
 CAP_cargo_helicopter_equipment_5_desc:0 "CH-47D mis à niveau avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les Chinook plus anciens ont été mis à niveau vers cette norme."
 CAP_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 CAP_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 CAP_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, un CH-47D amélioré, a effectué son vol inaugural ; le premier modèle de production a été déployé le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les mises à niveau comprennent des moteurs Honeywell de 4 868 chevaux (3 630 kW) et la cellule dotée d'une plus grande construction monobloc pour réduire les besoins de maintenance. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion pour augmenter la durée de vie."
 
 
 #EAST ARM Trader
 CUM_infantry_equipment_0:0 "Mosin wz. 91/30"
 CUM_infantry_equipment_0_short:0 "Mosine"
 CUM_infantry_equipment_0_desc:0 "Le Mosin-Nagant est un fusil à verrou impérial russe utilisé par l'Empire russe et basé sur un modèle importé de France. En 1889, le GAU (Ministère de la Défense de l'Empire russe) acquiert le Lebel-1886 auprès de la France et cherche à améliorer sa conception. Divers scientifiques et ingénieurs russes ont été embauchés par le ministère et dirigés par le capitaine Sergei Mosin et Leon Nagant pour l'améliorer et ont produit le Mosin Nagant après une longue série d'essais et de prototypes. En 1891, le système à verrou de conception de Mosin fut mis en production. Le fusil a un temps de démontage long mais se distingue par sa grande précision. Il a été largement utilisé lors de la guerre russo-japonaise, de la Première Guerre mondiale, de la guerre civile au sein de l'Empire russe qui a conduit à la formation de l'Union soviétique, de la Seconde Guerre mondiale et de nombreux conflits mondiaux."

 CUM_infantry_equipment_1:0 "Avtomat Kalachnikova 1947"
 CUM_infantry_equipment_1_short:0 "AK-47"
 CUM_infantry_equipment_1_desc:0 "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 CUM_infantry_equipment_2:0 "AKM"
 CUM_infantry_equipment_2_short:0 "AKM"
 CUM_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

 CUM_infantry_equipment_3:0 "AK-74"
 CUM_infantry_equipment_3_short:0 "AK-74"
 CUM_infantry_equipment_3_desc:0 "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un alésage chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été repensés pour contenir un canal bas installé à 90 degrés de l'axe de l'alésage afin de réduire le cisaillement des balles au niveau de la cale bâbord. De plus, son développement s'est accompagné d'une variété d'accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec des précisions moyennes plus élevées. Il a été utilisé de manière coûteuse pendant le conflit en Afghanistan, où la CIA a payé une grosse somme d'argent aux moudjahidines pour récupérer un AK74 capturé."

 CUM_infantry_equipment_4:0 "AK-74M"
 CUM_infantry_equipment_4_short:0 "AK-74M"
 CUM_infantry_equipment_4_desc:0 "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé pour incorporer de nouveaux matériaux et des avancées de fabrication afin de créer une arme améliorée. Il comporte un boulon et un support allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide chargé de verre pouvant tenir latéralement, une bouche améliorée, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également livré avec un rail pour le montage des optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant de pouvoir être envisagée. Cependant, il a été adopté par la Fédération de Russie."

 
 CUM_lt_equipment_1:0 "T-60"
 CUM_lt_equipment_1_short:0 "T-60"
 CUM_lt_equipment_1_desc:0 "Le T60 était un char léger fabriqué pour remplacer le T-38 dans son rôle de reconnaissance. Il a été conçu en 1941 par Nicholas Astrov et 6 300 exemplaires ont été produits au cours des 2 années de production. Le véhicule était un char à 2 équipages avec un moteur 6 cylindres et atteint jusqu'à 44 km/h avec un canon principal de 20 mm. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 CUM_lt_equipment_2:0 "T-70"
 CUM_lt_equipment_2_short:0 "T-70"
 CUM_lt_equipment_2_desc:0 "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et l'a terminé en 1942. Au cours des deux années de fabrication, 8 300 exemplaires ont été produits. Le char avait un canon beaucoup plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 CUM_lt_equipment_3:0 "PT-76"
 CUM_lt_equipment_3_short:0 "PT-76"
 CUM_lt_equipment_3_desc:0 "Le PT76 est un char léger amphibie soviétique et a été largement exporté dans le monde entier. Il a été conçu par N Shashmyrin et Zh Kotin en 1951 et environ 12 000 unités ont été fabriquées. Il nécessite un équipage de 3 hommes et un moteur V6 six cylindres en ligne avec une vitesse de 44 km/h et peut nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique et à tendance soviétique et, en tant que tel, a joué un rôle de reconnaissance dans pratiquement tous les conflits des nations de la sphère soviétique. Cependant, il est encore utilisé aujourd'hui dans de nombreux pays en raison de sa célèbre fiabilité et de sa facilité d'entretien."
 CUM_lt_equipment_4:0 "PT-76B modèle 4"
 CUM_lt_equipment_4_short:0 "PT-76B"
 CUM_lt_equipment_4_desc:0 "PT-76 armé du canon de char rayé D-56TS de 76,2 mm (frein de bouche à double chicane, éjecteur de cartouche, extracteur de fumée et système de stabilisation à 2 axes STP-2P 'Zarya'),[4] le système de protection NBC PAZ (protivo-atomnaya zashchita), un système d'extinction automatique d'incendie, un viseur TShK-2-66 amélioré, une filtration-ventilation système, des dispositifs d'observation améliorés, un équipement électrique amélioré, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1 800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."
 CUM_lt_equipment_5:0 "BRM-1K"
 CUM_lt_equipment_5_short:0 "BRM-1K"
 CUM_lt_equipment_5_desc:0 "Le BRM-1K est un véhicule de reconnaissance d'origine soviétique de la fin de la Guerre froide. Il a été développé pour soutenir les formations blindées et mécanisées employées par les forces soviétiques. Le BRM-1K devait repérer les itinéraires et détecter les formations ennemies."
 CUM_lt_equipment_6:0 "BRM-3K"
 CUM_lt_equipment_6_short:0 "BRM-3K"
 CUM_lt_equipment_6_desc:0 "Le BRM-3K Rys a été développé au début des années 1990. Il était destiné à compléter et remplacer le véhicule de reconnaissance BRM-1K. Il est basé sur le châssis du véhicule de combat d'infanterie BMP-3. Bien que le BRM-3K ait été officiellement accepté par l'armée russe en 1995, il est encore en production à faible cadence."

 CUM_ht_equipment_1:0 "IS-2"
 CUM_ht_equipment_1_short:0 "IS-2"
 CUM_ht_equipment_2:0 "IS-3"
 CUM_ht_equipment_2_short:0 "IS-3"
 CUM_ht_equipment_3:0 "IS-4"
 CUM_ht_equipment_3_short:0 "IS-4"
 CUM_ht_equipment_4:0 "T-10"
 CUM_ht_equipment_4_short:0 "T-10"
 CUM_ht_equipment_5:0 "T-10M"
 CUM_ht_equipment_5_short:0 "T-10M"

 CUM_mbt_equipment_0:0 "T-34-85"
 CUM_mbt_equipment_0_short:0 "T-34-85"
 CUM_mbt_equipment_0_desc:0 "Le T-34 est un char moyen soviétique qui a révolutionné le domaine de la conception des chars et est bien connu pour sa fiabilité. Le T-34 a été conçu en 1940 par le KMBD en Union soviétique. Dans le but de réduire les coûts, le blindage incliné a été introduit dans la conception du char. Cependant, cela a également permis au réservoir lui-même de devenir bien mieux protégé et moins coûteux avec une surface plus petite. L'arme elle-même est un canon de 76,2 mm et avait une capacité de transport de munitions nominale. Cependant, les viseurs et les dispositifs de vision étaient particulièrement médiocres, ce qui rendait difficile le fonctionnement des commandants de char et leur faible capacité de coordination réduisait de nombreux avantages offerts par le char lui-même. Le T-34 est devenu le deuxième char le plus produit au monde mais l'un des plus importants de la Seconde Guerre mondiale. Les T-34 sont encore utilisés aujourd'hui par les insurgés et les pays les plus pauvres."
 CUM_mbt_equipment_1:0 "T-44"
 CUM_mbt_equipment_1_short:0 "T-44"
 CUM_mbt_equipment_1_desc:0 "Le T-44 est un char moyen soviétique fabriqué vers la fin de la Seconde Guerre mondiale. Il offrait une mobilité améliorée et un blindage plus important avec un canon principal plus lourd de 85 mm. Il a été conçu par AA Morozov en 1944, mais peu ont été construits car le char était considéré comme trop cher pour les avantages qu'il offrait. Seulement 2 000 exemplaires furent construits avant que la production ne revienne au T-34."
 CUM_mbt_equipment_2:0 "T-54"
 CUM_mbt_equipment_2_short:0 "T-54"
 CUM_mbt_equipment_2_desc:0 "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
 CUM_mbt_equipment_3:0 "T-55"
 CUM_mbt_equipment_3_short:0 "T-55"
 CUM_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "
 CUM_mbt_equipment_4:0 "T-62"
 CUM_mbt_equipment_4_short:0 "T-62"
 CUM_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "
 CUM_mbt_equipment_5:0 "T-64A"
 CUM_mbt_equipment_5_short:0 "T-64A"
 CUM_mbt_equipment_5_desc:0 "Le T-64 est un char soviétique qui a introduit de nombreuses modernisations par rapport au T-62 et peut être considéré comme une continuation des améliorations apportées du T-55 au T-62. Il comprend un moteur plus compact, un blindage composite, des auxiliaires de moteur améliorés et un canon principal de 125 mm avec chargeur automatique. Conçu en 1962 par KMBD, le char lui-même présentait de nombreuses améliorations par rapport à son prédécesseur, mais à des coûts nettement plus élevés. Le moteur était un moteur diesel 5TDF à 5 cylindres qui permettait une plus grande autonomie opérationnelle et des vitesses plus élevées. Il était destiné à être mis au rebut, mais sa production a été maintenue grâce à l'influence politique de son concepteur en chef. Alexandre Morozov, le concepteur en chef, a fait valoir que malgré son coût, c'était une conception nettement plus grande qui en valait la peine. Cela n'a pas été le cas lors de la guerre dans le Donbass et de la guerre en Transnistrie. Il a été remplacé par le T-72, beaucoup plus rentable. "
 CUM_mbt_equipment_6:0 "T-72"
 CUM_mbt_equipment_6_short:0 "T-72"
 CUM_mbt_equipment_6_desc:0 "Le T-72 est un CCP soviétique créé comme une nouvelle génération de chars, principalement pour remplacer le T-62 et son homologue coûteux, le T-64. Il coûtait presque la moitié du prix du T-64 et comportait de vastes améliorations. Sa conception a été achevée en 1973 par Leonid Venediktov et a montré des capacités incroyables. Le canon et le blindage étaient toujours respectivement de 125 mm et composites, mais avec une conception beaucoup plus économique et plus facile à produire. Le moteur est un V-12 de 780 ch qui pourrait être ultérieurement réaménagé avec une conception de 1 130 ch. Le char pouvait atteindre une mobilité incroyable, atteignant des vitesses de 80 km/h et pouvait mieux s'adapter aux terrains plus difficiles que le T-64. Il a été utilisé dans tous les conflits de la sphère soviétique, contrairement au T-64, et y a également fait preuve d'incroyables capacités. Le char a également été largement utilisé dans des conflits hors de la sphère africaine, au Moyen-Orient et en Indochine."
 CUM_mbt_equipment_7:0 "T-80U"
 CUM_mbt_equipment_7_short:0 "T-80U"
 CUM_mbt_equipment_7_desc:0 "Le T-80 est un CCP soviétique conçu suivant la doctrine de haute mobilité du set T-72. Le KMBD a commencé sa conception en 1964 et l'a achevée en 1975 après 11 ans de travaux. La coque elle-même est constituée d'un blindage composite amélioré et épaissi et est livrée avec un canon à âme lisse amélioré. Il peut également être équipé d'un armement de fusée pour une puissance de feu améliorée. Il a une autonomie plus petite que le T-72 et des vitesses légèrement plus lentes malgré une transmission et un moteur à turbine à gaz plus avancés. Il a connu des conflits lors des guerres de Tchétchénie et de la guerre dans le Donbass, mais n'a pas été autant utilisé que le T-72."
 CUM_mbt_equipment_8:0 "T-90"
 CUM_mbt_equipment_8_short:0 "T-90"
 CUM_mbt_equipment_8_desc:0 "Après que le T-80 n'ait pas réussi à remplacer le T-72 ou à afficher des capacités nettement supérieures, Kartsev-Venediktov a cherché à améliorer encore le char et à introduire de meilleures capacités que le T-80. La conception a été achevée vers 1990. Le moteur a été remplacé par un moteur diesel 12 cylindres et était même plus lent que le T-80, mais avait une puissance de feu beaucoup plus élevée. Le canon a été amélioré, le système de conduite de tir a été amélioré, le blindage a été considérablement épaissi et de nombreux autres auxiliaires ont été ajoutés, notamment un brouilleur ATGM et des lance-fumées. Il a connu des combats au Daghestan et dans le Donbass. "
 CUM_mbt_equipment_9:0 "T-84N"
 CUM_mbt_equipment_9_short:0 "T-84N"
 CUM_mbt_equipment_9_desc:0 "Les travaux de modernisation du char T-80UD ont commencé en 1992. Le T-84N comprend une nouvelle jupe latérale blindée, une nouvelle tourelle soudée avec un chargeur automatique dans la niche arrière, un nouveau blindage réactif, une unité de puissance auxiliaire (APU), un viseur à imagerie thermique, une navigation par satellite, un télémètre laser pour le commandant et d'autres améliorations"

