l_french:
 
 ##### CAP - Western Private Manufacturers #####
 ###Sprites###
 CAP_infantry_equipment_0:0 "Fusil américain, calibre.30, M1"
 CAP_infantry_equipment_0_short:0 "M1 Garand"
 CAP_infantry_equipment_0_desc:0 "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 CAP_infantry_equipment_1:0 "Fusil à chargement automatique L1A1"
 CAP_infantry_equipment_1_short:0 "L1A1 REFLEX"
 CAP_infantry_equipment_1_desc:0 "Le L1A1 SLR est une version britannique du fusil de combat belge FN FAL. Il a été produit sous licence et a été utilisé dans de nombreux pays du Commonwealth. Le Royaume-Uni a produit sa propre variante du FN FAL intégrant les modifications développées par l'Allied Rifle Committee, le désignant le L1A1 Self Loading Rifle (SLR). Les armes ont été fabriquées par la Royal Small Arms Factory Enfield, Birmingham Small Arms, la Royal Ordnance Factory et le ROF Fazakerley. Après l'arrêt de la production, des composants de remplacement ont été fabriqués par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à 1994 environ, remplacé par le L85A1 à partir de 1985."

 CAP_infantry_equipment_2:0 "Fusil américain, calibre 5,56 mm, M16"
 CAP_infantry_equipment_2_short:0 "M16"
 CAP_infantry_equipment_2_desc:0 "Les responsables militaires américains ont noté que la carabine M2 était largement surclassée par l'AK47 et le StG44 allemand et, en 1956, le développement du M16 a commencé. En 1959, l'arme fut achevée par Eugene Stoner et James Sullivan. Il affichait des capacités exceptionnelles et surclassait l'AK47 et l'AKM. Plus particulièrement, l'arme a beaucoup plus de puissance de feu que la carabine M2 et était plus précise que l'AK47 et transportait des munitions plus légères avec une perte de compétence minimale. Cependant, bien qu'il ait surclassé l'AK47 dans les tests généraux, il présentait une faible fiabilité qui pouvait l'empêcher d'être considéré comme son égal. Surtout au Vietnam, où les échecs étaient très fréquents."

 CAP_infantry_equipment_3:0 "Fusil américain, 5,56 mm, M16A2"
 CAP_infantry_equipment_3_short:0 "M16A2"
 CAP_infantry_equipment_3_desc:0 "Après le manque de fiabilité fréquent de l'arme dans les jungles du Vietnam, le corps des marines américains a demandé une refonte de l'arme. En 1982, la refonte et les améliorations ont été apportées. L'arme comportait un récepteur renforcé, de nouvelles rayures, un boîtier renforcé, un meilleur refroidissement grâce à différents matériaux, un support amélioré pour les éléments attachables et un mécanisme interne repensé qui lui conférait un haut niveau de fiabilité. Il a été témoin de combats au Liban, en Libye, en Égypte et dans tous les autres conflits dans lesquels les États-Unis ont participé depuis leur création."

 CAP_infantry_equipment_4:0 "Carabine, calibre 5,56 mm, M4 "
 CAP_infantry_equipment_4_short:0 "Carabine M4"
 CAP_infantry_equipment_4_desc:0 "La carabine M4 est une nouvelle amélioration par rapport au M16A2. Il a été initialement commandé pour être conçu par une grande équipe ad hoc de concepteurs en 1984 et le développement s'est terminé en 1993. Après 9 ans de développement, j'espère que cela aurait valu la peine d'attendre. Il présente un plus grand niveau de fiabilité et est beaucoup plus léger et plus court. Principalement grâce à des matériaux améliorés, il est plus précis que le M16A2. Sa taille compacte le rend plus polyvalent et plus facile à utiliser que le M16A2. La carabine M4 a été utilisée lors de la guerre américaine en Afghanistan, de la guerre en Irak et de la guerre contre l'Etat islamique."
 
 CAP_lt_equipment_1:0 "M5 Stuart"
 CAP_lt_equipment_1_short:0 "M5 Stuart"
 CAP_lt_equipment_1_desc:0 "Le M5 Stuart est un petit char développé par le Département des munitions de l'armée américaine en 1941 pour servir de char léger. Il est doté d'un blindage fin de 63,5 mm et d'un canon principal de 37 mm avec 3 armements secondaires Browning de 7,62 mm. Il utilise un double moteur Cadillac V8 qui peut atteindre des vitesses allant jusqu'à 36 mph en tout-terrain et a une autonomie opérationnelle de 100 miles. Il a été largement prêté et loué tout au long de la Seconde Guerre mondiale, même lorsque les États-Unis sont entrés en guerre. "
 CAP_lt_equipment_2:0 "M24 Chaffee"
 CAP_lt_equipment_2_short:0 "M24 Chaffee"
 CAP_lt_equipment_2_desc:0 "Le M24 Chaffee est un char léger développé par le Département des munitions de l'armée américaine en 1944, vers la fin de la Seconde Guerre mondiale, le Boogaloo électrique. Le M24 possède un blindage de 38 mm et un canon principal de 75 mm. Le moteur est un V8 Twin Cadillac avec une transmission Hydramatic qui peut se déplacer à peu près de la même manière que le M5 Stuart. Au combat, le petit canon du M5 Stuart s'est avéré être une lacune importante, notamment lors de la campagne d'Afrique du Nord. C'est peu de temps après que le M24 Chaffee fut développé dans le but de lui donner plus de puissance de feu pour mieux remplir son rôle."
 CAP_lt_equipment_3:0 "Char de combat à chenilles complètes : canon de 76 mm, M41"
 CAP_lt_equipment_3_short:0 "M41 Walker Bulldog"
 CAP_lt_equipment_3_desc:0 "Le M41 est un char de reconnaissance léger développé par Cadillac en 1949. Il a combattu au Vietnam, dans la Baie des Cochons, au Liban et en Somalie. Son blindage varie de 19 mm à 31,7 mm. Il est armé d'un canon principal de 76 mm, d'une mitrailleuse coaxiale de calibre.30 et d'un canon de toit de calibre.50. Il utilise un moteur essence Continental 6 cylindres et fonctionne jusqu'à 45 mph avec une autonomie opérationnelle de 100 miles. Le développement du M41 progressait lentement avec peu de financement, mais lorsque la guerre de Corée a éclaté, l'armée américaine a commencé à précipiter le programme. La précipitation a causé un grand nombre de problèmes dans le programme et des problèmes de taille excessive. Le M41, en raison de graves problèmes liés à la précipitation du programme, a été produit pendant très peu de temps et n'a pas été utilisé pendant la guerre de Corée. En fait, la production n'a démarré qu'en 1951 et n'a duré que 3 ans."
 CAP_lt_equipment_4:0 "Véhicule d'assaut aéroporté : Full Tracked, 152 mm, M551"
 CAP_lt_equipment_4_short:0 "M551 Sheridan"
 CAP_lt_equipment_4_desc:0 "Le M551 Sheridan est un char de reconnaissance aéroporté amphibie conçu par Cadillac en 1966. Il a été utilisé au Vietnam, dans l'Opération Just Cause juste parce que et dans Desert Storm. Le M551 Sheridan possède un canon principal de 152 mm et 2 canons secondaires. Le réservoir est équipé d'un moteur diesel turbocompressé à 6 cylindres 6V53T et d'une vitesse allant jusqu'à 43 mph et d'une vitesse de nage de 3,6 mph. Le blindage est une coque en aluminium avec une tourelle en acier. Il fut immédiatement mis en service au Vietnam en raison de sa mobilité et de sa polyvalence, où il joua un rôle exceptionnel. Le canon principal de 152 mm peut respectivement lancer un ATGM ou des munitions conventionnelles. Le M551 a été critiqué par nombre de ses opérateurs en raison de la difficulté d'utilisation en combat direct, mais il a quand même rempli efficacement son rôle malgré sa mauvaise réputation."
 CAP_lt_equipment_5:0 "M3 Bradley"
 CAP_lt_equipment_5_short:0 "M3 Bradley"
 CAP_lt_equipment_5_desc:0 "Le M3 Bradley CFV est très similaire au M2 Bradley IFV (Infantry Fighting Vehicle) et est équipé de la même tourelle Bushmaster Cannon pour deux hommes de 25 mm avec une mitrailleuse coaxiale M240C de 7,62 mm. Il ne diffère du M2 que de quelques manières subtiles et selon les rôles. Le M3 est classé comme véhicule blindé de reconnaissance et de reconnaissance et supprime les ports de tir de la série M2. Le M3 transporte également plus de missiles TOW ainsi que plus de munitions pour ses canons de 25 mm et 7,62 mm."
 CAP_lt_equipment_6:0 "M3A2 Bradley ODS"
 CAP_lt_equipment_6_short:0 "M3A2 Bradley ODS"
 CAP_lt_equipment_6_desc:0 "Le M3A2 incorporait des améliorations de blindage améliorées, telles que la possibilité de monter un blindage réactif explosif, du M2A2 Bradley. Après les essais de tir réel, la disposition des sièges et du rangement des munitions a également été modifiée, les observateurs étant déplacés vers un banc sur le côté gauche du véhicule et le rangement du missile réorganisé pour améliorer la sécurité."

 CAP_ht_equipment_1:0 "M4A3E2 Sherman Jumbo"
 CAP_ht_equipment_1_short:0 "M4A3E2 géant"
 CAP_ht_equipment_1_desc:0 "Blindage supplémentaire (dont 1 pouce à l'avant), tourelle à côtés verticaux, mais environ 3-4 mph plus lente. Construit avec un canon de 75 mm mais fréquemment réarmé par les unités utilisant des canons de 76 mm. Connecteurs d'extrémité allongés (CEE) de style « bec de canard » installés sur le bord extérieur des voies."
 CAP_ht_equipment_2:0 "T26E4 Super Pershing"
 CAP_ht_equipment_2_short:0 "T26E4 Super Pershing"
 CAP_ht_equipment_2_desc:0 "Le Super Pershing était une variante plus lourde du M26 de base. Un blindage plus lourd était attaché au char et le canon T15E1 plus long remplaçait le canon M3 dans le but d'égaler la puissance de feu du King Tiger."
 CAP_ht_equipment_3:0 "T32"
 CAP_ht_equipment_3_short:0 "T32"
 CAP_ht_equipment_3_desc:0 "Les travaux commencèrent au début de 1945 pour développer une variante nettement plus lourde du M26 Pershing. En utilisant les données collectées dans le cadre du projet T29 Heavy Tank et en incorporant un canon principal expérimental de 90 mm tirant des munitions rigides composites perforantes ainsi qu'une transmission plus avancée, le premier char T32 a été produit. Le canon T15E2 monté sur ce char était beaucoup plus puissant que celui monté sur le Pershing, et comme le T26E4 Super Pershing qui utilisait un canon expérimental similaire de 90 mm, le contrepoids à l'arrière de la tourelle a été considérablement agrandi pour compenser le poids du canon d'épaule."
 CAP_ht_equipment_4:0 "char de combat M103 de 120 mm"
 CAP_ht_equipment_4_short:0 "M103"
 CAP_ht_equipment_4_desc:0 "Le M103 était un char lourd créé en 1957 par Chrysler. 100 unités ont été construites et déployées mais n'ont pas réellement participé au combat. Il comportait un blindage de 127 à 254 mm et un canon principal de 120 mm avec 3 MG secondaires. Il avait une vitesse maximale de 21 mph et une autonomie opérationnelle de 80 utilisant 280 gallons pendant cette période. Le moteur était un moteur à essence AV1790 12 cylindres. Le char lui-même a servi dans le corps des marines, mais n'a pas participé au combat, car les unités dans lesquelles il a été déployé n'ont jamais pu l'utiliser."
 CAP_ht_equipment_5:0 "char de combat avec canon de 120 mm M103A2"
 CAP_ht_equipment_5_short:0 "M103A2"
 CAP_ht_equipment_5_desc:0 "Le M103A2 est une amélioration du M103 fabriqué dans les années 60 par Chrysler. 200 unités ont été créées mais elles n'ont pas vu le combat. Il a remplacé le moteur du M103 par un moteur AVDS1790-2 V12 biturbo, lui conférant des avantages significatifs par rapport au M103. Le moteur amélioré pouvait parcourir 295 miles à 23 mph et avait une mobilité significative en utilisant le même carburant que le M103. D'autres améliorations mineures ont également été apportées aux pièces du M103, comme un modèle de transmission légèrement différent, mais qui était finalement le même. Le M103A2 fut le dernier char lourd créé par les États-Unis, car les chars de combat principaux supplantaient le besoin de chars lourds et pouvaient transporter plus de puissance de feu avec moins de poids et plus de mobilité."

 CAP_sht_equipment_1_:0 "T95 GMC"
 CAP_sht_equipment_1_short:0 "Chariot de moteur de pistolet T95"
 CAP_sht_equipment_1_desc:0 "Le T95 Gun Motor Carriage est un destroyer de bunker super lourd développé en 1945 par Pacific Car and Foundry. Il n'a jamais vu de combat et seuls 2 prototypes ont été créés. Il pèse 95 tonnes et mesure 36 x 14 x 9 pieds et nécessite un équipage de 4 personnes. Le blindage a 1 pied d'épaisseur dans chaque partie et utilise un moteur GAF V-8. Le char utilise 2 chenilles et une suspension à ressorts à volute horizontale. Le T95 est équipé d'un canon principal de 105 mm et dispose d'un armement secondaire M2 Browning. Il a été initialement conçu pour percer les défenses allemandes, puis a été envisagé pour l'invasion du continent japonais. La production était déjà prévue mais le largage des 2 bombes atomiques mit fin à la guerre et le projet fut annulé avant qu'une unité puisse être fabriquée."
 CAP_sht_equipment_2_short:0 "Chrysler K"
 CAP_sht_equipment_2_desc:0 "Le Chrysler K est un char super lourd conçu par Chrysler en 1946 par Chrysler. Seuls 2 prototypes ont été créés. Le poids, le moteur et les dimensions exactes du char sont inconnus. La Chrysler K était équipée d'un canon principal de 105 mm avec 2 MG secondaires. Contrairement au T95, la Chrysler K n'avait qu'un seul jeu de chenilles ultra-larges. La Chrysler K a finalement été annulée car le projet dépassait le budget."
 CAP_sht_equipment_3_short:0 "R-32"
 CAP_sht_equipment_3_desc:0 "Le R32 est un char nucléaire super-lourd expérimental conçu par Chrysler dans les années 50. Le R32 n'a jamais atteint la phase de prototype mais certaines pièces ont été fabriquées. Le R32 a été conçu pour transporter un moteur électrique à propulsion nucléaire et un canon principal de 120 mm avec 3 MG secondaires. On a estimé que le moteur nucléaire lui donnait une vitesse de 40 mph et une autonomie presque illimitée, car l'énergie nucléaire était sa source de combustible. Le blindage a été conçu pour avoir une épaisseur de 127 à 254 mm. Le projet a été annulé rapidement après son lancement en raison d'un grand nombre de blocages liés au manque de technologie nécessaire pour créer la conception et au scepticisme de la part de l'état-major américain en charge du financement du projet."

 CAP_mbt_equipment_0:0 "M4 Sherman"
 CAP_mbt_equipment_0_short:0 "M4 Sherman"
 CAP_mbt_equipment_0_desc:0 "Le M4 Sherman est un char moyen conçu par l'US Army Ordnance Department en 1940 pour la Seconde Guerre mondiale. Il a été prêté et loué à de nombreux pays à partir de 1940. Le Sherman peut manier un canon principal de 75 mm, 76 mm ou 105 mm et disposait généralement d'un canon secondaire Browning. Il est propulsé par un moteur à essence radial C4 9 cylindres capable de transporter le véhicule à une vitesse de 22 à 30 mph sur 100 à 150 miles avant de devoir faire le plein. C'était fiable, peu coûteux à produire et un rêve humide pour tout logicien. Il était très compact et facile à transporter en grand nombre, ce qui rendait l'expédition du véhicule à travers l'Atlantique extrêmement facile. Le M4 était également très polyvalent et capable de fonctionner dans une grande variété de conditions."
 CAP_mbt_equipment_1:0 "M26"
 CAP_mbt_equipment_1_short:0 "M26 Pershing"
 CAP_mbt_equipment_1_desc:0 "Le M26 Pershing est un char moyen conçu par le Département des munitions de l'armée américaine en 1944. Il a combattu pendant la Seconde Guerre mondiale et la guerre de Corée. Le M26 Pershing est particulièrement lourd pour un char moyen avec une vitesse tout-terrain exceptionnellement faible. Son moteur Ford GAF 8 cylindres pourrait le transporter jusqu'à 100 miles à 30 mph sur route, mais en tout-terrain, il atteint 5,25 mph. Son canon principal est un canon de 90 mm et peut utiliser un browning M2. Cependant, pendant la guerre de Corée, le M2 browning de calibre.50 a été remplacé par 2 canons M1919.30-06 en raison de la grande quantité de cibles souples sur le terrain et de la nécessité de transporter 9 fois plus de munitions plutôt que plus de puissance de feu. Le M26 était peut-être un char moyen, mais il est extrêmement lourd et peut être considéré comme un char hybride moyen/lourd."
 CAP_mbt_equipment_2:0 "M46 Patton"
 CAP_mbt_equipment_2_short:0 "M46 Patton"
 CAP_mbt_equipment_2_desc:0 "Le M46 Patton est un char moyen conçu par le Département des munitions de l'armée américaine en 1949. Il a combattu pendant la guerre de Corée et a été conçu pour remplacer le M26 Pershing en raison de son poids excessif. Il dispose d'un canon principal de 90 mm et d'un blindage de 102 mm. Il peut être équipé d'un seul Browning M2 ou de deux Browning M1919. Le M46 Patton utilise un moteur V12 biturbo qui atteint une vitesse de 15 à 30 mph et a une autonomie opérationnelle de 30 à 80 miles. Il a été produit en grande série dans le but de remplacer les anciens modèles. Il était à la pointe des conceptions et des armes modernes et ne souffrait pas d'un poids élevé."
 CAP_mbt_equipment_3:0 "Char de combat à chenilles complète : canon de 90 mm, M47"
 CAP_mbt_equipment_3_short:0 "M47 Patton"
 CAP_mbt_equipment_3_desc:0 "Le M47 Patton est l'un des premiers chars de combat principaux et a été conçu par le département des munitions de l'armée américaine en 1951. Il est très similaire au M46 Patton mais avec une tourelle de canon mise à jour avec un mécanisme interne amélioré et une transmission améliorée. Il a connu des combats lors de la crise de Suez, de la guerre des 6 jours et des guerres yougoslaves."
 CAP_mbt_equipment_4:0 "Char de combat à chenilles complète : canon de 90 mm, M48"
 CAP_mbt_equipment_4_short:0 "M48 Patton"
 CAP_mbt_equipment_4_desc:0 "Le M48 Patton est un CCP conçu par le Département des munitions de l'armée américaine en 1953. Le M48 est doté d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Le moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents avec un système d'injection de carburant léger et est suralimenté. Il a une autonomie de fonctionnement hors route de 160 milles et de 300 milles sur route. Il peut rouler sur route à 30 mph, mais atteint 20 mph hors route grâce au moteur, à la transmission et aux chenilles améliorés. Il a servi de char principal pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton mais il s'agit d'un tout nouveau design avec de nouveaux mécanismes internes. Il est utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la Garde nationale exploitaient et entretenaient encore des M48 jusqu'à la fin des années 80."
 CAP_mbt_equipment_5:0 "Char de combat à chenilles complète : canon de 105 mm, M60"
 CAP_mbt_equipment_5_short:0 "M60 Patton"
 CAP_mbt_equipment_5_desc:0 "Le M60 Patton est un CCP conçu par le département des munitions de l'armée américaine en 1960. Il a été utilisé lors de la guerre du Yom Kippour, de l'invasion de la Grenade, du Yémen et du Liban. Il possède un blindage d'environ 220 mm et porte un canon principal de 105 mm. Il utilisait généralement la mitrailleuse M73 de 7,62 x 51 mm comme armement secondaire. Le moteur est un moteur V12 biturbo amélioré qui peut se déplacer à peu près à la même vitesse que le M48. Cependant, malgré un poids légèrement supérieur à celui du M48, le M60 peut se déplacer à peu près à la même vitesse et sur la même différence. Le M60 a subi de nombreuses modifications mineures tout au long de sa vie et compte ainsi environ 4 variantes. Cela signifiait une augmentation du blindage, du poids et une amélioration de la fiabilité."
 CAP_mbt_equipment_6:0 "Char de combat à chenilles complètes : canon de 105 mm, M1"
 CAP_mbt_equipment_6_short:0 "M1 Abrams"
 CAP_mbt_equipment_6_desc:0 "Le M1 Abrams est un MBT conçu par General Dynamics Land Systems en 1979. Après l'annulation du projet MBT-70, le M1 Abrams a pris le relais. Le M1 utilise un blindage composite de 350 mm. Son canon principal est un canon principal de 105 mm avec des canons secondaires de calibre 1,50 ou 2,7,62. Le moteur est un moteur à turbine multicarburant et il peut se déplacer à 45 mph sur route et 30 mph hors route. Il a une portée opérationnelle d'environ 265 milles sur route ou 200 milles hors route. Il n'utilise pas la suspension du MBT70 mais plutôt une suspension à barre de torsion avec amortisseurs. Elle a démontré une efficacité considérable dans tous les conflits américains depuis son début. Le M1 Abrams est devenu emblématique en raison de sa robustesse, de sa mobilité et de sa puissance de feu considérables. Une grande partie de ses améliorations proviennent des leçons tirées du projet MBT-70, dans lequel les fonctionnalités utiles ont été conservées mais les plus gênantes ont été abandonnées."
 CAP_mbt_equipment_7:0 "Char de combat à chenilles complète : canon de 120 mm, M1A1"
 CAP_mbt_equipment_7_short:0 "M1A1 Abrams"
 CAP_mbt_equipment_7_desc:0 "Le char de combat principal M1A1 Abrams a été développé par General Dynamics. Il s'agit d'un développement ultérieur du M1 Abrams. Le M1A1 a été dévoilé en 1985 et la production a débuté la même année. Le M1A1 dispose d'une protection de blindage de tourelle améliorée par rapport à son prédécesseur. L'une des améliorations les plus importantes par rapport au M1 est le canon à âme lisse M256 de 120 mm, initialement développé par Rheinmetall et produit sous licence aux États-Unis."
 CAP_mbt_equipment_8:0 "Char de combat à chenilles complètes : canon de 120 mm, M1A2"
 CAP_mbt_equipment_8_short:0 "M1A2 Abrams"
 CAP_mbt_equipment_8_desc:0 "Le M1A2 Abrams est une amélioration apportée au M1 par GDLS au début des années 80. Le char utilise un blindage composite renforcé de mailles d'uranium appauvri mesurant environ 600 mm. Les chars sont également livrés avec des ajouts optionnels tels qu'un blindage réactif, un kit de survie urbaine et un système d'armes télécommandé. Il dispose d'un canon principal à âme lisse de 120 mm et surpasse la plupart des autres chars. Il dispose également d'une électronique améliorée, de contre-mesures ATGM et d'un système de lutte contre les incendies. Cependant, aucune amélioration n'a été apportée à la transmission, à la suspension ou au moteur et, en tant que tel, il est plus près du sol et pèse beaucoup plus. Il peut se déplacer sur route à 42 mph ou hors route à 25 mph avec une portée opérationnelle plus courte. Il a été utilisé en Afghanistan, dans le Golfe et en Irak, où il a démontré une capacité de survie inégalée contre la plupart des armes antichar utilisées par ses adversaires."
 CAP_mbt_equipment_9:0 "Char de combat à chenilles complète : canon de 120 mm, M1A2 (SEP)"
 CAP_mbt_equipment_9_short:0 "M1A2 Abrams SEP"
 CAP_mbt_equipment_9_desc:0 "Le M1A2 System Enhancement Package (SEP) est le successeur du M1A2. Il s'agit également d'un package de mise à niveau pour les anciens chars Abrams. Il présente une protection blindée améliorée, des composants système améliorés, des composants informatiques améliorés et quelques autres améliorations. Le premier char amélioré a été livré en 1999."

 CAP_mechanized_equipment_1:0 "Demi-piste M2"
 CAP_mechanized_equipment_1_short:0 "Demi-piste M2"
 CAP_mechanized_equipment_1_desc:0 "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 CAP_mechanized_equipment_2:0 "Demi-piste M3"
 CAP_mechanized_equipment_2_short:0 "Demi-piste M3"
 CAP_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 CAP_mechanized_equipment_3:0 "Demi-piste M3A1"
 CAP_mechanized_equipment_3_short:0 "Demi-piste M3A1"
 CAP_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
 CAP_mechanized_equipment_4:0 "Transporteur, personnel, entièrement chenillé, blindé, M59"
 CAP_mechanized_equipment_4_short:0 "M59"
 CAP_mechanized_equipment_4_desc:0 "Le M59 est un APC développé par la société FMC en 1951. Il a été utilisé au Vietnam et au Liban. Le M75 était équipé de 2 moteurs essence 6 cylindres en ligne, d'une transmission Hydramatic 301MG et d'une suspension à barre de torsion. Il peut se déplacer jusqu'à 32 mph sur 120 miles. Le M59 a rapidement remplacé le M75 car il était amphibie, plus petit et beaucoup moins cher à produire. Le M59 était également utilisé comme porteur de mortier et comme véhicule de soutien."
 CAP_mechanized_equipment_5:0 "Transporteur, personnel, entièrement chenillé, blindé, M113"
 CAP_mechanized_equipment_5_short:0 "M113"
 CAP_mechanized_equipment_5_desc:0 "Les APC américains les plus reconnaissables depuis les années 60. Il est largement utilisé et, grâce à des années de recherche, il en a fait un véritable véhicule blindé de transport de troupes, en utilisant sa hauteur, son angle de blindage et son épaisseur. Et plus tard, introduisant de plus en plus de variantes, s'armant d'un M2 Browning.50 Cal avec quelques milliers de tours de liberté. Se vante vraiment d'être un bon APC. Des dizaines de variantes provenaient de la gamme du M113, toujours utilisée par l'armée américaine à ce jour."
 CAP_mechanized_equipment_6:0 "Transporteur, personnel, entièrement chenillé, blindé, M113A1"
 CAP_mechanized_equipment_6_short:0 "M113A1"
 CAP_mechanized_equipment_6_desc:0 "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), pour profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
 CAP_mechanized_equipment_7:0 "Transporteur, personnel, entièrement chenillé, blindé, M113A2"
 CAP_mechanized_equipment_7_short:0 "M113A2"
 CAP_mechanized_equipment_7_desc:0 "Le M113A2 est une variante améliorée du M113 fabriquée par Food Machinery Corporation à la fin des années 70. Il a vu des combats partout où le M113 est présent. Dans l'A1, le moteur a été remplacé par le 6V-53. Dans l'A2, le refroidissement du moteur a été amélioré, des barres de torsion plus résistantes ont été introduites pour augmenter la garde au sol, des amortisseurs ont été ajoutés à la suspension, les réservoirs de carburant ont été blindés et des lance-fumées ont été ajoutés."
 CAP_mechanized_equipment_8:0 "Transporteur, personnel, entièrement chenillé, blindé, M113A3"
 CAP_mechanized_equipment_8_short:0 "M113A3"
 CAP_mechanized_equipment_8_desc:0 "En 1987, d'autres améliorations pour une « survie améliorée (sur le champ de bataille) » ont été introduites. Cela comprenait un joug pour la direction au lieu des latéraux, un moteur plus puissant (le Detroit Diesel turbocompressé 6V-53T), des réservoirs de carburant externes et des revêtements internes anti-éclats pour une protection améliorée. Le suffixe A3 est utilisé sur toutes les variantes pour indiquer la mise à niveau vers la norme A3."
 CAP_mechanized_equipment_9:0 "Véhicule de combat d'infanterie M1126 Stryker"
 CAP_mechanized_equipment_9_short:0 "M1126 Stryker ICV"
 CAP_mechanized_equipment_9_desc:0 "Le STRYKER est un APC développé par General Dynamics en 1999. Il a été utilisé pendant la guerre en Afghanistan. Le Stryker utilise un moteur C7 Caterpillar avec une suspension 8x8. Il peut se déplacer jusqu'à 60 mph sur 310 miles. Avec près d'un an et demi de retard, l'équipe General Motors-General Dynamics a remporté le contrat de 8 milliards de dollars en novembre 2000 pour produire 2 131 véhicules d'une variante du LAV III canadien destiné à équiper six équipes de combat de brigade à déploiement rapide d'ici 2008."
 CAP_mechanized_equipment_10:0 "M1296 Dragon"
 CAP_mechanized_equipment_10_short:0 "M1296 Dragon"
 CAP_mechanized_equipment_10_desc:0 "L'armée américaine cherchait à améliorer la puissance de feu du véhicule de transport d'infanterie de base M1126 Stryker. Sa mitrailleuse lourde de 12,7 mm n'était pas particulièrement efficace contre les véhicules blindés modernes. À ce titre, l'armée américaine a approuvé une amélioration de la létalité en équipant un total de 81 Strykers de tourelles légères sans pilote de 30 mm. Cela a considérablement augmenté la puissance de feu du Stryker tout en préservant la mobilité du véhicule."

 CAP_mechanized_heavy_equipment_1:0 "M44"
 CAP_mechanized_heavy_equipment_1_short:0 "M44"
 CAP_mechanized_heavy_equipment_1_desc:0 "Le M44 est un APC super-lourd développé par le département des munitions de l'armée américaine en 1951. Le M44 est équipé d'un moteur AOS-895-3 et d'une suspension à barre de torsion. Il peut se déplacer à 15 mph hors route avec une portée opérationnelle de 60 miles. Le projet M44 a été annulé et seuls 6 prototypes ont été créés. Malgré cela, certains prototypes ont été testés sur le terrain et combattus pendant la guerre de Corée. Même s'il était extrêmement blindé et pouvait transporter 24 passagers, il était très lent et constituait une cible de grande taille."
 CAP_mechanized_heavy_equipment_2:0 "Transporteur, personnel, entièrement chenillé, blindé, M75"
 CAP_mechanized_heavy_equipment_2_short:0 "M75"
 CAP_mechanized_heavy_equipment_2_desc:0 "Le M75 est un APC lourd développé par l'International Harvester Corporation au début des années 1950. Le M75 a été largement utilisé pendant la guerre de Corée, mais a ensuite été abandonné très rapidement. Le M75 est équipé d'un moteur à essence 6 cylindres AO-895-4 et d'une suspension à barre de torsion. Il peut se déplacer à 43 mph avec une autonomie de 115 miles. Après que le projet M44 ait été annulé en raison de sa taille excessive, le développement d'un autre PC lourd entièrement fermé a commencé. Le projet M75 a abouti à un châssis beaucoup plus petit, bien plus rapide que le M44. Cependant, il était toujours considéré comme trop important et le projet M95 a continué à bénéficier de financements"
 CAP_mechanized_heavy_equipment_3:0 "Transporteur, personnel, entièrement chenillé, blindé, M113 ACAV"
 CAP_mechanized_heavy_equipment_3_short:0 "M113 ACAV"
 CAP_mechanized_heavy_equipment_3_desc:0 "le M113 ACAV, également connu sous le nom de M150, est un véhicule blindé d'assaut de cavalerie, qui est une des premières formes de l'IFV. Le M113 ACAV a été développé dans les années 60 par la Food Machinery Corporation. Le M113 ACAV est similaire au M113 dans la plupart des aspects. La variante ACAV du M113 embarque un lanceur TOW et peut potentiellement être équipée d'une tourelle armée d'un lance-flammes comme on le voit au Vietnam. Le M113 ACAV a été utilisé partout où le M113 était utilisé."
 CAP_mechanized_heavy_equipment_4:0 "Transporteur, personnel, entièrement chenillé, blindé, M113A1 ACAV"
 CAP_mechanized_heavy_equipment_4_short:0 "M113A1 ACAV"
 CAP_mechanized_heavy_equipment_4_desc:0 "Version M113A1 ACAV avec des armes supplémentaires telles qu'un fusil sans recul."
 CAP_mechanized_heavy_equipment_5:0 "M2 Bradley"
 CAP_mechanized_heavy_equipment_5_short:0 "M2 Bradley"
 CAP_mechanized_heavy_equipment_5_desc:0 "Le M2 Bradley est un IFV amphibie développé par BAE Systems Land & Armaments en 1981. Le M2 Bradley a participé à tous les conflits américains depuis sa création, y compris Desert Storm. Le projet M2 Bradley visait à créer une nouvelle génération de PC pour l'ère moderne, dotés d'une protection NBC. Le projet a débuté à la fin des années 60 et a connu de nombreux prototypes pour arriver là où il est aujourd'hui. Le Bradley utilise un moteur 8 cylindres VTA-903T et est doté d'une suspension à barre de torsion. Le Bradley est armé d'un canon automatique de 25 mm et d'un accessoire TOW antichar. BAE a été chargé de créer un transport d'infanterie qui était bae. S'inspirant des prototypes du projet MICV, le Bradley est capable de reconnaissance et de soutien à l'infanterie qu'il transporte. Bien qu'il soit doté d'un blindage en aluminium, sa puissance de feu et sa mobilité sont utilisées pour se protéger sur le terrain."
 CAP_mechanized_heavy_equipment_6:0 "M2A2 Bradley"
 CAP_mechanized_heavy_equipment_6_short:0 "M2A2 Bradley"
 CAP_mechanized_heavy_equipment_6_desc:0 "Introduit en 1988, l'A2 a reçu un moteur amélioré de 600 chevaux (447 kW) avec une transmission hydromécanique HMPT-500-3 et un blindage amélioré (à la fois passif et capable de monter un blindage réactif explosif). Le nouveau blindage protège le Bradley contre les obus APDS de 30 mm et les RPG (ou armes anti-blindage similaires). Le nouveau blindage éliminait également la girouette qui rendait le Bradley amphibie et recouvrait les ports de tir latéraux."
 CAP_mechanized_heavy_equipment_7:0 "M2A2 Bradley ODS"
 CAP_mechanized_heavy_equipment_7_short:0 "M2A2 Bradley ODS"
 CAP_mechanized_heavy_equipment_7_desc:0 "Le M2 ODS Bradley est une variante améliorée du Bradley développé par BAE Systems en 1991. L'ODS présentait un intérieur optimisé, un blindage réactif explosif et une transmission hydromécanique. Bien que l'armure réactive ait eu un coût et a empêché le Bradley de nager. L'ODS a également ajouté un meilleur télémètre, un système de navigation, une contre-mesure de missile et un système d'imagerie thermique. De plus, un très petit chauffe-aliments et une station de confort ont été ajoutés, ce qui est considéré par certains comme la meilleure innovation."
 CAP_mechanized_heavy_equipment_8:0 "M2A3 Bradley"
 CAP_mechanized_heavy_equipment_8_short:0 "M2A3 Bradley"
 CAP_mechanized_heavy_equipment_8_desc:0 "Le M2A3 Bradley est une nouvelle amélioration du Bradley développé par BAE Systems en 2000. L'A3 a rendu le Bradley entièrement numérique et a rendu tout ce qui se trouvait dans le véhicule contrôlable à distance. De nombreuses améliorations du blindage ont également été ajoutées pour rendre le véhicule plus résistant. De plus, la boîte à outils NBC du Bradley, qui comprend une radioprotection supplémentaire, des filtres à air et une résistance chimique, a été ajoutée. "

 CAP_mechanized_marine_equipment_1:0 "Buffle d'eau LVT-4"
 CAP_mechanized_marine_equipment_1_short:0 "LVT-4"
 CAP_mechanized_marine_equipment_1_desc:0 "Le LVTP-4 est un véhicule d'atterrissage amphibie conçu par Ford Machinery Corporation au début des années 40. Le LVTP-4 a été utilisé pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Il utilise un moteur radial à 7 cylindres W-670-9A et peut parcourir jusqu'à 75 miles dans l'eau à 7 mph. Evolution du LVTP-1, le LVTP-4 est capable de parcourir des distances incroyables, bien qu'à des vitesses lentes. Si vous devez traverser 70 milles d'eau et disposer d'environ 10 heures pour le faire, le LVTP-4 est votre véhicule de choix. Il est capable de transporter des troupes ou des véhicules. "
 CAP_mechanized_marine_equipment_2:0 "LVTP-5"
 CAP_mechanized_marine_equipment_2_short:0 "LVTP-5"
 CAP_mechanized_marine_equipment_2_desc:0 "Le LVTP-5 est un APC amphibie conçu par la Food Machinery Corporation en 1956. Il a combattu au Vietnam. Le LVTP-5 utilise un moteur V12 LV-1790-1 et peut parcourir jusqu'à 57 miles dans l'eau à 7 mph. Il s'agit d'une évolution du LVTP-4 et est beaucoup plus résistant et fiable que son prédécesseur. De plus, des variantes ont été créées pour permettre à son châssis d'être utilisé dans des véhicules d'appui-feu tels qu'un obusier de 105 mm. Une variante AA a été prototype mais n'est jamais entrée en fabrication."
 CAP_mechanized_marine_equipment_3:0 "LVTP-7"
 CAP_mechanized_marine_equipment_3_short:0 "LVTP-7"
 CAP_mechanized_marine_equipment_3_desc:0 "Le LVTP-7 est un APC amphibie conçu en 1972 par la Food Machinery Corporation. Des conflits ont eu lieu aux Malouines, à la Grenade, dans le Golfe, en Syrie et en Irak. Le LVTP-7 utilise un moteur 8V-53T et peut parcourir 23 miles à 8,2 mph dans l'eau. Plus particulièrement, le LVTP-7 est capable de voyager dans un état de mer 5, qui est classé comme « agité » avec un gonflement de mer moyen à élevé, ce qui le rend excellent pour faire face à des conditions météorologiques difficiles que le LVTP-5. De plus, il est bien plus blindé que le LVTP-5. Parce qu'il peut voyager de manière impressionnante dans un état de mer 5 et qu'il est mieux protégé, il a remplacé le LVTP-5. Il comporte également des disperseurs de fumée."
 CAP_mechanized_marine_equipment_4:0 "LVTP-7A1"
 CAP_mechanized_marine_equipment_4_short:0 "LVTP-7A1"
 CAP_mechanized_marine_equipment_4_desc:0 "Le LVTP-7A1 est un APC amphibie conçu en 1984 par la Food Machinery Corporation. Elle a connu des combats dans le Golfe, en Syrie et en Irak. Le LVTP-7A1 utilise un moteur VTAC RAM-RS de 525 ch et peut voyager à peu près de la même manière que le LVTP-7. Il dispose d'un moteur, d'une transmission et d'un système d'armes améliorés et est plus facile à entretenir que le LVTP-7. Il comporte également un certain nombre d'améliorations en matière de sécurité pour réduire les effets des coups. "
 CAP_mechanized_marine_equipment_5:0 "Véhicule d'assaut amphibie avancé EFVP-1"
 CAP_mechanized_marine_equipment_5_short:0 "EFVP-1 AAAV"
 CAP_mechanized_marine_equipment_5_desc:0 "L'EFVP-1 AAAV est un projet IFV amphibie conçu par General Dynamics qui a été annulé. L'EFVP-1 utilisait un moteur MT 883 ka, même s'il était probable qu'il utiliserait un moteur différent au fur et à mesure de la production. Il est capable de parcourir 75 miles dans l'eau à une vitesse de nage impressionnante de 28,6 mph. Le véhicule aurait également comporté une tourelle de style IFV pour un appui-feu supplémentaire. Les armements exacts sont inconnus, mais il pourrait potentiellement contenir n'importe quoi, des canons automatiques aux ATGM. Le projet a coûté 3 milliards de dollars à développer, mais a finalement été annulé car il a été estimé qu'il en coûterait 12 milliards supplémentaires pour créer le reste de ce que le véhicule souhaitait faire. Il a assisté à un combat dans la piscine du terrain d'essai lorsqu'un morceau s'est détaché pendant les tests et l'un des concepteurs, en colère qu'il ait recommencé, lui a donné un coup de pied assez fort pour se casser le pied. "

 CAP_motorized_equipment_1:0 "GMC CCKW"
 CAP_motorized_equipment_1_short:0 "GMC CCKW"
 CAP_motorized_equipment_1_desc:0 "Le GMC CCKW est un camion 6x6 de 2,5 tonnes conçu par General Motors en 1941. Il a été largement utilisé pendant la Seconde Guerre mondiale et la guerre de Corée. Le CCKW utilise un moteur GMC270, une transmission à 5 vitesses/2 gammes et un essieu à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer jusqu'à 45 mph sur 300 miles et atteint 7,5 mi/gal. Le CCKW a été développé pour l'armée américaine en tant que camion de transport et de ravitaillement de troupes. Le camion, en plus d'être utilisé pour le ravitaillement et le transport, pourrait également monter une carrosserie de fourgon pour servir de véhicule de confort/soutien sur le terrain et peut également monter des armes remorquées sur son plateau pour créer des armes SP bon marché."
 CAP_motorized_equipment_2:0 "M35"
 CAP_motorized_equipment_2_short:0 "M35"
 CAP_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 CAP_motorized_equipment_3:0 "M809"
 CAP_motorized_equipment_3_short:0 "M809"
 CAP_motorized_equipment_3_desc:0 "Le M809 est un camion 6x6 de 5 tonnes conçu par AM General en 1970. Il a été utilisé dans tous les conflits américains de 1970 à 1982. Le M809 utilise un moteur NH250, une transmission à 5 vitesses/2 gammes et des essieux à poutre dynamique sur ressorts à lames. Il peut transporter une charge de 5 000 lb. Il a une vitesse de 52 mph sur 350 miles et obtient 10 mi/gal. En plus d'être utilisé pour le transport et le fret, le véhicule est très solide et peut supporter des composants utilitaires sur son plateau. Ceux-ci incluent la possibilité de monter des kits de dépanneuse, des bennes, des remorques, de grandes fourgonnettes pour le soutien/confort, des équipements de pontage et quelques autres. Le M809 peut également traverser des rivières peu profondes grâce à sa garde au sol élevée et est très efficace sur route ou hors route grâce à sa suspension. "
 CAP_motorized_equipment_4:0 "M939"
 CAP_motorized_equipment_4_short:0 "M939"
 CAP_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 utilise un moteur 6CTA8.3, une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Le véhicule est capable de transporter une charge de 10 000 lb. Il peut se déplacer à 6,3 mph sur 350 miles et obtient 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et convient bien aux intempéries. Le M939 a permis une nouvelle génération de camions, de moteurs principaux et de véhicules de dépannage et a fait l'objet d'une fabrication intensive. Il est plus fiable et plus résistant que les véhicules précédents et a complètement supplanté les contrats de production antérieurs. "
 CAP_motorized_equipment_5:0 "MTVR"
 CAP_motorized_equipment_5_short:0 "MTVR"
 CAP_motorized_equipment_5_desc:0 "Le MTVR est un camion 6x6 de 7 tonnes conçu par Oshkosh Defense en 1996. Il a été utilisé dans tous les conflits de la sphère occidentale depuis 2001. Le MTVR utilise un moteur Caterpillar C-12, une transmission automatique 4070P à 7 vitesses avec blocage de différentiel et une suspension à ressorts hélicoïdaux TAK-4 avec anti-roulis. Le véhicule est capable de transporter 7 000 livres. Il peut se déplacer à 65 mph sur 300 miles et obtient 4 mi/gal. Le MTVR n'a pas la capacité de charge du M939 et est moins économe en carburant, il ne l'a donc pas supplanté, mais il est toujours plus fiable et performant dans des conditions difficiles. De plus, le MTVR est plus résistant et plus capable de faire face à des situations potentiellement dangereuses, offrant une meilleure protection contre les armes légères que le M939."

