 #Tooltips
 fin_nokia:0 "Fusionnez Suomen Kumitehdas, Nokia Osakeyhtiö et Suomen Kaapelitehdas, débloquant ainsi Oy Nokia Ab en tant qu'entreprise industrielle."
 estonia_friendship:0 "Visite d'État estonienne"
