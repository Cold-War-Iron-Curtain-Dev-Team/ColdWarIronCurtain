 FIN_60s_regulate_violent_tv_desc:0 "L'expansion rapide de la télévision dans les foyers finlandais a déclenché un vif débat public sur le sensationnalisme et les divertissements importés. En donnant aux commissions d'examen de l'audiovisuel le pouvoir d'établir des normes contre la violence gratuite à l'écran, nous protégeons les valeurs familiales et la décence civique sur toutes les ondes."
 FIN_60s_approve_french_desc:0 "Préserver une véritable neutralité nécessite de diversifier les achats de défense et de ne plus dépendre exclusivement des équipements britanniques ou soviétiques. Autoriser l'acquisition d'avions à réaction et d'avioniques français modernes démontre l'engagement d'Helsinki en faveur d'une diplomatie équilibrée tout en fournissant à l'armée de l'air une technologie continentale de premier ordre."
 FIN_60s_reduce_soviet_desc:0 "Des décennies d'influence rampante du Kremlin et de pressions diplomatiques informelles ont limité la politique intérieure finlandaise. En renforçant la surveillance du contre-espionnage et la souveraineté parlementaire contre les interférences indirectes, nous affirmons une véritable indépendance constitutionnelle sans violer nos traités."
 FIN_60s_honka_blcoked_desc:0 "Reconnaissant que les ultimatums diplomatiques soviétiques pendant la crise de la Note menacent de briser la neutralité finlandaise et de déclencher une confrontation internationale catastrophique, Olavi Honka retire officiellement sa candidature à la présidentielle, dissipant ainsi les tensions régionales et sauvegardant la fragile souveraineté de la nation."
 FIN_60s_frigates_desc:0 "Les capacités de défense côtière de la marine finlandaise ont été sévèrement limitées depuis la Seconde Guerre mondiale. En finalisant un accord avec Moscou pour l'achat de deux frégates d'escorte de classe Riga, nous rétablissons une présence crédible d'escorte en eaux bleues dans la Baltique et fournissons une formation radar moderne à nos cadres navals."
 FIN_60s_expand_harbours_desc:0 "L'accueil d'importants navires de combat de surface dans notre flotte nécessite des installations logistiques et de réparation améliorées. L'agrandissement des quais en eau profonde, du stockage de carburant et des cales sèches à Turku et Upinniemi garantit à nos unités navales de maintenir une préparation opérationnelle élevée le long de nos côtes archipélagiques stratégiques."
 FIN_60s_jet_program_desc:0 "Alors que les cellules à pistons de première génération et les premiers avions à réaction atteignent la fin de leur durée de vie opérationnelle, une commission parlementaire mixte de la défense doit évaluer les options d'intercepteurs étrangers, établir des installations de maintenance nationales et conclure des accords de licence de production pour les chasseurs supersoniques."
 FIN_60s_promise_reform_desc:0 "L'activisme croissant des jeunes, l'urbanisation et les conflits sociaux exigent une réponse gouvernementale proactive. S'engager à réformer globalement l'accès à l'enseignement supérieur, le logement et la sécurité sociale rassure les familles qui travaillent et canalise l'énergie populaire vers des voies démocratiques constructives."
 FIN_60s_decaler_1970_pro_desc:0 "Les vastes forêts boréales et les archipels vierges de Finlande constituent notre plus grand patrimoine national. En désignant 1970 Année de la nature nordique, nous établissons des lignes directrices en matière de conservation, limitons la pollution industrielle dans les bassins hydrographiques vierges et inaugurons une ère de gestion écologique moderne."
 FIN_60s_kansanterveyslaki_desc:0 "L'accès aux soins médicaux ne doit pas être déterminé par la richesse personnelle ou la géographie. La loi historique sur la santé publique de 1972 réorganise les soins de santé municipaux, en établissant un réseau national de centres de santé communautaires qui fournissent des examens préventifs gratuits, des cliniques maternelles et des soins médicaux de base à chaque citoyen."
 FIN_60s_healtcare_desc:0 "En réponse aux taux alarmants de mortalité cardiovasculaire dans l'est de la Finlande, le projet Carélie du Nord est un pionnier de l'éducation alimentaire à l'échelle communautaire, de la surveillance du cholestérol et du dépistage de la tension artérielle, créant ainsi un modèle de médecine préventive de renommée internationale."
 FIN_60s_nordek_desc:0 "Proposé comme une union économique nordique globale, Nordek cherche à approfondir la coopération douanière, la coordination industrielle et la mobilité de la main-d'oeuvre entre le Danemark, la Norvège, la Suède et la Finlande, liant les démocraties nordiques en un bloc économique résilient."
 FIN_60s_reduce_Swedish_desc:0 "L'émigration massive de jeunes travailleurs qualifiés vers les usines automobiles et manufacturières suédoises menace la Finlande d'un déclin démographique et d'une pénurie de main-d'oeuvre. L'expansion des subventions au développement régional, des prêts au logement abordables et des programmes d'emploi locaux offre aux jeunes Finlandais un avenir viable chez eux."
 FIN_60s_criticize_soviets_desc:0 "L'invasion de la Tchécoslovaquie par le Pacte de Varsovie menée par les Soviétiques a indigné la société démocratique finlandaise. La majorité réformiste du Parti communiste finlandais rompt ouvertement avec l'orthodoxie moscovite, condamnant l'intervention comme une violation de la souveraineté nationale et des principes socialistes."
 FIN_60s_promote_peaceful_desc:0 "Rejetant le dogme révolutionnaire et l'avant-garde étrangère, les socialistes démocrates finlandais et les communistes réformistes considèrent la démocratie parlementaire, la mobilisation civique pacifique et les larges coalitions populaires comme la seule voie légitime vers une société juste."
 FIN_60s_purge_hardliners_desc:0 "La faction intransigeante et dogmatique redevable aux conseils étrangers représente une menace permanente pour la cohésion du parti et la crédibilité démocratique. En dépouilleant les personnalités radicales de leurs positions éditoriales et exécutives, le parti s'exprime d'une seule voix souveraine et modérée."
