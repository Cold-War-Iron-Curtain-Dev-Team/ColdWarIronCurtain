l_french:
 FIN_tax_reform_60s:0 "Réforme fiscale de 1960"
 FIN_tax_reform_60s_desc:0 "Depuis 1927, nous travaillons à la réforme du système fiscal. Maintenant, nous pouvons enfin le terminer et le mettre en oeuvre."
 FIN_new_provinces_60s:0 "Loi sur la nouvelle province"
 FIN_new_provinces_60s_desc:0 "Dans le cadre de la réforme provinciale, nous avons créé deux nouvelles provinces : la Finlande centrale et la Carélie du Nord. Ces provinces nous aideront à réorganiser notre structure interne et à tirer divers avantages de leur potentiel industriel, éducatif, culturel et stratégique."
 FIN_new_markka_60s:0 "Réforme Markka"
 FIN_new_markka_60s_desc:0 "La valeur du Markka a diminué depuis la Seconde Guerre mondiale. Après quelques préparatifs, nous sommes maintenant prêts à lancer la réforme du Markka."
 FIN_new_highways_60s:0 "Terminer les autoroutes du sud"
 FIN_new_highways_60s_desc:0 "Après de nombreuses années de construction, nous sommes prêts à ouvrir nos premières autoroutes dans le sud de la Finlande. Ces autoroutes font partie des principales autoroutes qui rayonnent depuis Helsinki et Turku et relient les principales villes et régions de notre pays. Ils amélioreront nos infrastructures, nos transports et notre mobilité et stimuleront notre économie et notre sécurité."
 FIN_the_note_crisi:0 "Noottikriisi"
 FIN_industrialisation_60s:0 "Des champs dégagés en faveur des usines"
 FIN_industrialisation_60s_desc:0 "Notre industrie a besoin de plus d'espace et de ressources pour développer et diversifier sa production et ses exportations. Nous devons défricher certaines de nos forêts et de nos champs et utiliser la terre et le bois pour construire de nouvelles usines et centrales électriques. Cela augmentera notre capacité et notre production industrielles, mais cela aura également des impacts environnementaux et sociaux."
 FIN_invest_in_industrial_60s:0 "Investir dans la modernisation industrielle"
 FIN_invest_in_industrial_60s_desc:0 "Notre industrie s'est développée et a diversifié sa production et ses exportations. Cependant, nous sommes encore confrontés à de nombreux défis et à la concurrence d'autres pays. Nous devons investir dans la modernisation de notre industrie et dans l'adoption de nouvelles technologies et méthodes. Cela augmentera notre efficacité, notre qualité et notre innovation et nous rendra plus compétitifs et plus prospères."
