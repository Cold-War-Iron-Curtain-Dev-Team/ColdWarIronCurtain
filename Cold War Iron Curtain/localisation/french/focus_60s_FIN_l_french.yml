 FIN_60s_parade:0 "50Ème anniversaire des Forces de Défense"
 FIN_60s_regulate_violent_tv:0 "Réguler les émissions de télévision violentes"
 FIN_60s_keskiolutlaki:0 "Keskiolutlaki"
 FIN_60s_saab_valmet:0 "Fondation d'Oy Saab-Valmet Ab"
 FIN_60s_saab_valmet_desc:0 "Nous avons créé une coentreprise avec le constructeur automobile suédois Saab pour produire leurs voitures en Finlande. La nouvelle société, Oy Saab Valmet Ab, exploitera notre usine automobile à Uusikaupunki et fabriquera des modèles Saab pour les marchés nationaux et d'exportation. Cela renforcera notre coopération industrielle avec la Suède et créera de nouveaux emplois et revenus pour notre pays."
 FIN_60s_yel_myel:0 "Créer YEL et MYEL"
 FIN_60s_control-excess:0 "Contrôler la production agricole excessive"
 FIN_60s_control-excess_desc:0 "Nous avons un problème avec trop de nourriture et pas assez d'argent dans nos fermes. Nous devons faire quelque chose pour réduire les excédents et rendre nos exploitations agricoles plus efficaces. Nous avons élaboré un plan visant à payer les agriculteurs pour qu'ils remballent leurs champs et abattent leurs vaches. Cela nous aidera à utiliser la terre pour d'autres choses, comme des forêts ou des parcs. Mais cela modifiera également le mode de vie et la culture des campagnes et nous rendra plus dépendants des aliments importés. Nous devons bien réfléchir aux avantages et aux inconvénients de ce changement."
 FIN_60s_propose_eu_secuirty:0 "Proposer une conférence paneuropéenne sur la sécurité"
 FIN_60s_lower_voting_age:0 "Abaisser l'âge de vote à 18 ans"
 FIN_60s_state_visit_to_uk:0 "Visite d'État au Royaume-Uni"
 FIN_60s_postpone_nordek:0 "Reporter le plan Nordek"
 FIN_60s_postpone_nordek_desc:0 "Nordek (en suédois : Organisationen för nordiskt ekonomiskt samarbete. En danois et norvégien : Nordøk pour Nordisk økonomi. En finnois : Pohjoismaiden talousalue) était une organisation planifiée pour la coopération économique nordique similaire à la Communauté économique européenne (CEE), basée sur une proposition en 1968 du Premier ministre danois Hilmar Baunsgaard. Un traité a été négocié pour créer la nouvelle organisation, dont le siège est à Malmö, en Suède. Malheureusement, nous ne pouvons pas le ratifier pour le moment."
 FIN_60s_decaler_1970_pro:0 "Déclarons 1970 année de la nature nordique"
 FIN_60s_ukk_agreement:0 "Accord UKK"
 FIN_60s_crimilazie_racsism:0 "Criminaliser la discrimination raciale"
 FIN_60s_tax_goods:0 "Taxe de points"
 FIN_60s_tax_goods_desc:0 "La récession mondiale nous a durement touchés, créant un déficit budgétaire et un déséquilibre commercial. Nous devons faire de notre mieux pour surmonter cela, et pour y parvenir, nous avons un plan : introduire une taxe de 15 % sur les biens de consommation durables, tels que les voitures, les appareils électroménagers et l'électronique. Cet impôt, appelé « impôt ponctuel », est conçu pour stimuler la production et la consommation intérieures, ainsi que pour générer des revenus destinés à la protection sociale. Nous pensons que cette décision bénéficiera au pays à long terme, en créant des emplois, en réduisant les importations et en améliorant le niveau de vie. Nous espérons que le public et le secteur des affaires comprendront et soutiendront cette décision, car elle est nécessaire à la reprise économique et à la stabilité de la Finlande."
 FIN_60s_state_visti_to_turkey:0 "Visite d'État en Turquie"
 FIN_60s_Kemira:0 "Créer Kemira Oy"
 FIN_60s_Kemira_desc:0 "En tant que petit pays aux ressources limitées, la Finlande doit développer sa propre industrie chimique pour soutenir son économie et sa défense. En fusionnant deux entreprises publiques, Rikkihappo Oy et Typpi Oy, nous pouvons créer une nouvelle entité qui produira des produits chimiques industriels pour divers secteurs, tels que l'industrie du papier et de la pâte à papier, le traitement de l'eau et l'industrie pétrolière et minière."
