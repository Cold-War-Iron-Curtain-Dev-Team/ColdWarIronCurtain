 FIN_60s_criticcue_kekkonen:0 "Critique de Kekkonen"
 FIN_60s_ignore_kekkonen:0 "Ignorez les conseils de Kekkonen"
 FIN_60s_ignore_kekkonen_desc:0 "Nous n'avons pas besoin des conseils de quelqu'un comme Kekkonen sur la manière de diriger ce pays."
 FIN_60s_do_what_told:0 "Suivez les conseils de Kekkonen"
 FIN_60s_do_what_told_desc:0 "\"Quelques lignes à gauche et derrière Kekkonen\"."
 FIN_60s_open_economy:0 "Ouvrir l'économie"
 FIN_60s_nordek:0 "Négocier sur Nordek"
 FIN_60s_clean_the_party:0 "Expulser l'Asevelisosialistit du parti"
 FIN_60s_clean_the_party_desc:0 "Les Asevelisosialistit (Frères d'armes socialistes) sont un groupe influent de sociaux-démocrates finlandais de droite qui ont été actifs au sein du Suomen Aseveljien Liitto pendant les années de guerre. "
 FIN_60s_enmvirokmemt:0 "Protéger l'environnement"
 FIN_60s_condem_czechiosloa:0 "Condamner l'invasion tchécoslovaque"
 FIN_60s_free_alcohol:0 "Assouplir les lois sur l'alcool"
 FIN_60s_housing:0 "Copier le programme suédois Miljon"
 FIN_60s_housing_desc:0 "Pour résoudre la pénurie de logements et améliorer le niveau de vie de millions de Finlandais, le gouvernement dirigé par le SDP a lancé un vaste programme de logements sociaux inspiré du programme suédois Million. Le programme vise à construire un million de nouveaux logements en dix ans, en se concentrant sur les groupes à faibles et moyens revenus. Le programme démolira également des bâtiments anciens et inutilisables et créera des emplois et une croissance économique. Le SDP espère que le programme réduira les inégalités sociales et créera une politique de logement moderne et durable pour la Finlande."
 FIN_60s_lower_voting_age2:0 "Abaisser l'âge de vote à 18 ans"
 FIN_60s_gov_Bordels:0 "Frontières gouvernementales ouvertes"
 FIN_60s_form_sorsa:0 "Cabinet Forme Sorsa I"
 FIN_60s_form_sorsa_desc:0 "Aujourd'hui, le nouveau gouvernement, dirigé par Kalevi Sorsa, parti en plein essor, prête serment."
 FIN_60s_reduce_Swedish:0 "Tentative de réduction de l'émigration vers la Suède"
 FIN_60s_minorities:0 "Améliorer les droits des minorités"
 FIN_60s_us_companies:0 "Inviter des entreprises américaines"
 FIN_60s_student_uprising:0 "Démonstrations étudiantes"
 FIN_60s_student_uprising_desc:0 "Le mouvement étudiant en Finlande est devenu de plus en plus radicalisé et s'est fait entendre dans ses revendications de réformes sociales et politiques. Ils ont organisé des manifestations, des sit-in et des grèves dans tout le pays, contestant l'autorité du gouvernement et le statu quo. Certains d'entre eux ont même exprimé leur sympathie pour l'Union soviétique et son idéologie, suscitant l'inquiétude des factions conservatrices et nationalistes."
 FIN_60s_resign:0 "Paasio démissionne"
 FIN_60s_resign_desc:0 "Les manifestations étudiantes ont ébranlé la stabilité politique, alors que des milliers de jeunes sont descendus dans la rue pour exiger plus de démocratie, de justice sociale et de paix. Le président Rafael Paasio a été critiqué tant par la gauche que par la droite pour sa gestion de la situation. Paasio a donc décidé de démissionner de son poste, invoquant des raisons de santé et de fatigue personnelle. Il remettra ses pouvoirs au Premier ministre Mauno Koivisto."
 FIN_60s_send_police:0 "Envoyez la police aux manifestations"
 FIN_60s_send_police_desc:0 "Les manifestations étudiantes sont devenues une menace sérieuse pour l'ordre public et la sécurité nationale de la Finlande. Ils ont perturbé le fonctionnement normal de la société et de l'économie et provoqué de violents affrontements avec les groupes loyalistes et patriotes. Certains d'entre eux ont même eu recours au vandalisme et au sabotage. Le gouvernement a autorisé la police à utiliser tous les moyens nécessaires pour arrêter les manifestations. La police peut arrêter, détenir et interroger tout suspect et confisquer tout matériel illégal ou dangereux. Nous avons de grands espoirs que cela rétablira la paix et la stabilité en Finlande et empêchera toute nouvelle escalade du conflit."
 FIN_60s_soviet_pressure:0 "Répondre à la pression soviétique"
 FIN_60s_soviet_pressure_desc:0 "L'Union soviétique a accru sa pression sur la Finlande, exigeant davantage de concessions et de coopération en échange du maintien du statu quo. Le Kremlin n'est pas satisfait des tentatives de la Finlande de diversifier son commerce et sa diplomatie et veut s'assurer que la Finlande reste fermement dans sa sphère d'influence."
 FIN_60s_restrict_media:0 "Adopter des restrictions sur les médias"
 FIN_60s_restrict_media_desc:0 "Les manifestations étudiantes ont révélé l'influence néfaste de la propagande communiste et socialiste dans les médias finlandais. Certains journaux et magazines ont ouvertement soutenu les revendications radicales des manifestants et ont diffusé des informations fausses et trompeuses sur le gouvernement et sa politique. Ils ont également tenté de saper les relations de la Finlande avec ses alliés occidentaux et de promouvoir l'agenda soviétique."
 FIN_60s_prepare_for_elections:0 "Préparez-vous aux élections extraordinaires"
 FIN_60s_prepare_for_elections_desc:0 "Après la démission du président Rafael Paasio, la Finlande doit élire un nouveau chef d'État lors d'une élection présidentielle extraordinaire."
 FIN_60s_virkamieshallitus:0 "Nouveau gouvernement dirigé par..."
