 FIN_60s_alv:0 "Liikevaihtoverolaki "
 FIN_60s_language_law:0 "Affirmer les droits linguistiques du suédois"
 FIN_60s_language_law_desc:0 "Avec cette loi"
 FIN_60s_pension_prgram:0 " Työeläkejärjestelmä"
 FIN_60s_investigate_lapland:0 "Enquêter sur les problèmes de la Laponie"
 FIN_60s_investigate_lapland_desc:0 "Les problèmes sociaux de la Laponie ont commencé à apparaître. Les ressources naturelles de la Laponie sont principalement utilisées pour la prospérité du Sud. De nombreux Lapons émigrent vers la Norvège ou la Suède en raison de la pauvreté, du chômage, du manque de médecins, des faibles possibilités d'éducation et du manque d'autonomie. Les problèmes du peuple Saami sont également mis en avant. Les Sâmes ont le sentiment qu'ils ont été considérés comme une minorité finlandaise parmi d'autres et que leur statut de peuple autochtone n'a pas été pris en compte, contrairement à la Norvège et à la Suède."
 FIN_60s_nuorisofestarit:0 "Augmenter le financement du 8ème Festival mondial de la jeunesse et des étudiants"
 FIN_60s_nuorisofestarit_desc:0 "Soutenu par la Ligue démocratique du peuple finlandais, le Parti communiste finlandais et l'Union sociale-démocrate des travailleurs et des petits exploitants, notre gouvernement décide d'augmenter le financement du 8e Festival mondial de la jeunesse et des étudiants. Cet investissement stratégique symbolise notre engagement à favoriser la solidarité et la paix internationales et à promouvoir les échanges culturels et idéologiques. Il s'agit d'une étape importante dans le renforcement de la présence diplomatique de la Finlande sur la scène mondiale."
 FIN_army_rewiev:0 "Revue Les Forces de Défense"
 FIN_60s_aquire_missiles:0 "Demander une autorisation pour les missiles"
 FIN_60s_aquire_missiles_desc:0 "Le traité de paix de Paris de 1947 nous interdit de posséder tout type de missiles. Cependant, avec l'évolution politique des années 1960, nous pourrons peut-être le modifier."
 FIN_60s_frigates:0 "Acheter la Classe Riga"
 FIN_60s_condem_aparthaid:0 "Condamner l'aparhaïd"
 FIN_60s_condem_aparthaid_desc:0 "Avec d'autres dirigeants nordiques, nous condamnons le système de l'aparhaid en Afrique du Sud."
 FIN_60s_propose_nuclear_free_nordic:0 "Proposer des pays nordiques sans armes nucléaires"
 FIN_60s_mp_training:0 "Ouvrir le centre de formation des députés de Santahamina"
 FIN_60s_state_visit_toestonia:0 "Visite d'État en Estonie"
 FIN_60s_expand_yle:0 "Développer Yleisradio"
 FIN_60s_expand_yle_desc:0 "Yleisradio a racheté TES-TV et l'a rebaptisée TV2, tandis que la chaîne Suomen Televisio a été rebaptisée TV1."
 FIN_60s_settle_soviet_sea_border:0 "Régler la frontière maritime soviétique"
 FIN_60s_settle_soviet_sea_border_desc:0 "La frontière maritime entre nous et l'Union soviétique est une source de discorde et d'incertitude depuis des décennies. Les deux parties ont des revendications différentes basées sur des traités historiques et des intérêts stratégiques. Une solution diplomatique est nécessaire pour éviter une nouvelle escalade et garantir notre accès aux eaux internationales. C'est pourquoi nous avons élaboré un accord avec l'Union soviétique. L'accord suivra le principe de la ligne médiane du golfe de Finlande, qui divise les eaux à parts égales entre les deux pays. Nous gagnerons quelques bases navales et provinces côtières dans la partie orientale du golfe, tout en en perdrons dans la partie ouest. Il faut espérer que cet accord améliorera les relations avec l'Union soviétique et réduira le risque de guerre."
 FIN_60s_start_railway_electrification:0 "Commencer l'électrification des chemins de fer"
 FIN_60s_start_railway_electrification_desc:0 "Il est temps pour la Finlande de rejoindre enfin le reste de l'Europe en électrifiant ses chemins de fer. Nous avons choisi la route Helsinki-Kirkkonummi comme première étape de ce projet ambitieux et nous avons confié à Valmet la tâche de construire de nouveaux trains électriques pour cette ligne. L'électrification de nos chemins de fer nous apportera de multiples avantages : nous augmenterons notre vitesse et notre efficacité, réduirons nos émissions et notre consommation de carburant, et renforcerons notre sécurité nationale en réduisant notre dépendance à l'égard du pétrole et du charbon étrangers."
 FIN_60s_open_porvoo_oil:0 "Ouvrir la raffinerie de pétrole de Porvoo"
 FIN_60s_open_porvoo_oil_desc:0 "Au début des années 1960, la seule raffinerie de pétrole de Finlande, la raffinerie de Naantali, était incapable de répondre à la demande toujours croissante de produits pétroliers. Pour maintenir les compagnies pétrolières étrangères à l'écart du secteur du raffinage du pétrole brut, Neste Oy a dû poursuivre une expansion agressive sur le marché pétrolier national. Porvoo a été choisi comme site pour la nouvelle raffinerie de pétrole en raison de sa proximité avec le centre de consommation d'Helsinki et de ses bonnes liaisons maritimes. Le projet de Neste Oy est d'approvisionner directement la raffinerie en pétrole brut importé de l'étranger par gros pétrolier."
 FIN_60s_form_nokia:0 "Formulaire Nokia Oy"
 FIN_60s_form_nokia_desc:0 "La Finlande a une longue tradition d'innovation industrielle et d'entrepreneuriat, notamment dans les domaines du caoutchouc, des câbles et de l'électronique. Aujourd'hui, trois sociétés, Suomen Kumitehdas, Nokia Osakeyhtiö et Suomen Kaapelitehdas, ont décidé de fusionner leurs opérations et de créer une nouvelle entité qui combinera leur expertise et leurs ressources. Les sociétés étaient détenues conjointement depuis 1922, mais elles opèreront désormais sous une marque et une vision uniques. La nouvelle société, Oy Nokia Ab, constituera une force puissante sur le marché mondial, offrant des produits et services de haute qualité à divers secteurs et clients."
 FIN_60s_peruskoulu:0 "Péruskoululaki"
 FIN_60s_peruskoulu_desc:0 "Péruskoululaki"
 FIN_60s_relax_law_onhomo:0 "Assouplir les lois concernant l'homosexualité"
 FIN_60s_relax_law_onhomo2:0 "Assouplir les lois sur l'homosexualité"
 FIN_60s_osterbohnia_speech:0 "Le discours d'Ostrobotnie"
 FIN_60s_state_visit_to_belgfium:0 "Visite d'État en Belgique"
 FIN_60s_markka_devalutaion:0 "Dévaluation du Markka"
 FIN_60s_markka_devalutaion_desc:0 "L'économie finlandaise a besoin d'un coup de pouce pour accroître ses exportations et freiner son inflation. Nous avons décidé de dévaluer le mark d'environ un tiers, comme nous l'avions fait en 1957. Cela rendra nos produits plus compétitifs et stimulera notre marché intérieur. Cependant, cela augmentera également nos coûts d'importation et réduira notre pouvoir d'achat. Nous espérons qu'il s'agira d'une mesure temporaire destinée à s'adapter à l'évolution du système monétaire mondial."
 FIN_60s-university:0 "Programme universitaire"
 FIN_60s_increase_fuel_and_car_tax:0 "Augmenter les taxes sur les voitures et les carburants"
 FIN_60s_soc:0 "Créer le Centre d'Opérations Sectorielles"
 FIN_60s_soc_desc:0 "Pääjohtokeskus (PääJoke) est une unité de l'armée de l'air finlandaise et fait partie des groupes de préparation de l'armée de l'air. Elle est chargée du contrôle de l'espace aérien de sa zone d'opérations et du commandement des avions de chasse effectuant des vols de reconnaissance. Trois d'entre eux seront créés : 5. Pääjohtokeskus, 7. Pääjohtokeskus et 3. Pääjohtokeskus."
