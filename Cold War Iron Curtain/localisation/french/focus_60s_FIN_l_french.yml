 FIN_60s_police_funding:0 "Allouer plus de fonds à la police"
 FIN_60s_police_funding_desc:0 "Corps"
 FIN_60s_linkkitorni:0 "Ouvrir la tour radio de Soppeenmäki"
 FIN_60s_linkkitorni_desc:0 "La tour de radio et de télévision Soppeenmäki est une tour de liaison située à Soppeenmäki, Ylöjärvi. La hauteur de la partie en béton est de 67,5 mètres et la hauteur du mât métallique qu'elle supporte est de 150 mètres. Le mât est à 388 mètres d'altitude. Il est prévu qu'elle devienne la principale station de radiodiffusion d'Yle à Pirkanmaa."
