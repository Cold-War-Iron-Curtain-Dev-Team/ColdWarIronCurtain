 NICC_western_aligment:0 "Soutenir les démocraties occidentales"
 NICC_reduce_rural_radicalism:0 "Réduire le radicalisme rural"
 NICC_helicopters:0 "Étudier la guerre des hélicoptères"
 NICC_vehicles:0 "Importer des véhicules du bloc de l'Est"
 NICC_army_academy:0 "Académie de l'Armée de Léon"
 NICC_army_academy_desc:0 "L'Académie militaire de Léon, officiellement Academia del Ejército de León \"Karl Marx\", sera une école moderne pour former nos officiers, financée par l'Union soviétique."
 NICC_artillery:0 "Fábrica de Armas Pesadas Nicaragaun \"Casimiro Sotelo\""
 NICC_organize_more:0 "Contrôle plus strict des forces de guérilla"
 NICC_license_chinese:0 "Fabrique d'armement du Nicaragua"
 NICC_control_Chaos:0 "Contrôler les gens"
 NICC_control_Chaos_desc:0 "Personne ne part. Et coupez les lignes téléphoniques. Contenir la propagation de la désinformation. C'est ainsi que l'on empêche le peuple de saper les fruits de son propre travail."
 NICC_sponsor_our_brothers:0 "Parrainez les guérillas Hoxhaist en Amérique du Sud"
 NICC_sponsor_our_brothers_desc:0 "Notre glorieux leader Juan Alberto Henríquez nous a montré la vraie voie du socialisme, la seule qui puisse résister à l'agression impérialiste des États-Unis, de l'URSS, de la Chine et de la Yougoslavie. Nous ne devons pas laisser sa sagesse et son courage se perdre, mais les partager avec nos frères et soeurs opprimés d'Amérique du Sud. Nous avons établi des contacts avec diverses guérillas hoxhaistes de la région, qui luttent contre les régimes réactionnaires et leurs soutiens étrangers. En leur apportant un soutien matériel et idéologique, nous pouvons les aider à libérer leur pays et à nous rejoindre dans le camp socialiste."
 NICC_rename_leon_to_engels:0 "Renommer Léon en "
 NICC_cultural_revolution_desc:0 "Renommer les états et les villes"
 NICC_condemn_north_korea:0 "Déclarez révisionniste la Corée du Nord"
 NICC_our_hoxha:0 "Déclarer Juan Alberto Un Camarada Supérieur"
 NICC_our_hoxha_desc:0 "Juan Alberto Henríquez n'est pas seulement notre leader, mais aussi notre professeur, notre guide et notre inspiration. Il nous a montré la voie à suivre pour construire une société socialiste basée sur les principes du hoxhaïsme. Il a défendu notre nation contre les menaces de l'impérialisme, du révisionnisme et de la réaction. Il a consacré sa vie à la cause des travailleurs et des opprimés. Nous devons l'honorer ainsi que ses réalisations en diffusant ses enseignements, en célébrant ses actes et en suivant son exemple. Nous devons lui témoigner notre gratitude et notre loyauté en faisant de lui le symbole de notre révolution."
 NICC_purge_clergy:0 "Purger le reste du clergé"
 NICC_train_african_guerillas:0 "Aidez à former des révolutionnaires africains"
 NICC_train_african_guerillas_desc:0 "Tout comme notre modèle Che Guevara, nous devons soutenir les mouvements socialistes et communistes africains sous forme d'armes et d'entraînement."
 NICC_side_with_chinese:0 "Purger l'aile Hoxhaist"
 NICC_side_with_chinese_desc:0 "Nous devons éliminer Juan Alberto Henríquez et ses partisans hoxhaistes. Ils représentent un grave danger pour notre autorité."
 NICC_turn_into_dprk_desc:0 "Parti communiste du Nicaragua 67"
 NICC_purge_clergy_desc:0 "Nous devrions suivre l'exemple de notre ami Hoxha et mettre fin à l'Église dans notre pays. Cela implique la fermeture de toutes les églises restantes et la déportation du clergé restant. Cette action est nécessaire pour maintenir l'intégrité de nos croyances et garantir que notre société soit libre de l'influence de la religion. En franchissant cette étape, nous poursuivons l'héritage de notre ami frère et nous dirigeons vers une société plus laïque."
 NICC_fund_raf:0 "Envoyer des fonds à la RAF"
 NICC_fund_raf_desc:0 "La Rote Armee Fraktion pourrait utiliser des fonds pour soutenir ses opérations."
 NICC_deploy_guards_to_miskito:0 "Déployer l'armée sur la côte Miskito"
 NICC_deploy_guards_to_miskito_desc:0 "La côte Miskito est une région du Nicaragua qui a une histoire et une culture distinctes du reste du pays. C'est une source de tensions et de conflits depuis des décennies, la population locale se sentant négligée et opprimée par le gouvernement central. Récemment, la situation s'est aggravée après l'assassinat de Casimiro Sotelo, un haut responsable du parti, par des agresseurs inconnus. Nous devons envoyer notre armée dans la région pour apaiser les troubles et rétablir l'ordre, avant qu'ils ne deviennent incontrôlables."
 NICC_demonstrations_miskito:0 "Visite de Sotelos à Miskito"
 NICC_demonstrations_miskito_desc:0 "Casimiro Sotelo, l'un de nos dirigeants les plus respectés et charismatiques, a décidé de visiter la côte Miskito, une région négligée et exploitée par le régime Somoza depuis des décennies. Il espère établir un dialogue avec la population locale et répondre à ses doléances et revendications. Il veut aussi leur montrer que la RFA n'est pas un ennemi, mais un ami et un allié du peuple Miskito. Il estime que cette visite contribuera à apaiser les tensions et à favoriser un esprit de coopération et de solidarité entre la révolution et les communautés indigènes."
 NICC_schools_more:0 "Mettre l'accent sur l'éducation"
 NICC_schools_more_desc:0 "L'éducation est un facteur clé pour le progrès et le bien-être de tout pays. Le Nicaragua est confronté à de nombreux défis dans ce domaine, tels que de faibles taux de scolarisation, des niveaux élevés d'analphabétisme et des ressources insuffisantes. Pour améliorer la qualité et l'accessibilité de l'éducation, nous devons allouer davantage de fonds, former davantage d'enseignants et élargir les programmes."
 NICC_rock_music:0 "Sponsoriser la création de Socialist Rock"
 NICC_rock_music_desc:0 "Beatles mais communistes."
 NICC_sponsor_sports:0 "Organisation de la jeunesse sportive socialiste"
 NICC_sponsor_sports_desc:0 "L'exercice est bon pour l'esprit et le corps. Pour faire progresser davantage l'exercice physique chez les jeunes, nous créerons l'Organisation de la jeunesse sportive socialiste."
 NICC_Agracultural_labour:0 "Formation du travail agricole"
 NICC_Agracultural_labour_desc:0 "L'agriculture est l'un des principaux piliers de notre économie, mais nous sommes confrontés à de nombreuses difficultés dans ce secteur, telles que de faibles rendements, des méthodes obsolètes et des infrastructures médiocres. Pour surmonter ces obstacles, nous devons mettre en oeuvre un programme complet de formation de la main-d'oeuvre agricole qui informera nos agriculteurs sur les dernières innovations et pratiques agricoles. Avec l'aide généreuse de nos amis cubains, qui ont proposé d'envoyer certains de leurs professeurs qualifiés pour nous aider dans la mise en oeuvre du programme, nous améliorerons nos performances agricoles et notre prospérité."
 NICC_put_to_work:0 "Organisation révolutionnaire du travail"
 NICC_put_to_work_desc:0 "En suivant l'exemple des unités militaires cubaines d'aide à la production, nous créerons notre propre Organisation révolutionnaire du travail pour stimuler le développement industriel et la productivité économique. Les camps ORT nécessiteront une discipline stricte, une planification centralisée et des investissements dans les infrastructures. Ils serviront également à contraindre les Nicaraguayens inaptes au service militaire en raison de leurs croyances religieuses, de leur orientation sexuelle, de leur opposition politique ou de leur objection de conscience à travailler pour notre régime."
 NICC_appint_borge:0 "Nommer Tomas Borge à la tête du SdI"
 NICC_appint_borge_desc:0 "Tomás Borge est l'un des membres fondateurs du FSLN et un vétéran de la lutte contre la dictature de Somoza. Il a prouvé sa loyauté et son efficacité en tant que chef de la milice de défense nationale, qui a réussi à rétablir l'ordre sur la côte Miskito après l'assassinat de Casimiro Sotelo. Nous devrions le nommer à la tête de notre agence de renseignement, le Servicio de Inteligencia, et lui donner les ressources et l'autorité nécessaires pour protéger notre révolution des ennemis internes et externes."
 NICC_take_costa_Rica:0 "Le pari costaricain"
 NICC_honduras_takeover:0 "Aidez José Napoléon Duarte pour l'Union"
 NICC_spy_on_chinese_nuclear:0 "Espionner la technologie nucléaire chinoise"
 NICC_spy_on_chinese_nuclear_desc:0 "La Chine est l'une des puissances nucléaires émergentes au monde. La politique de la Chine est de développer des armes nucléaires et de poursuivre son autonomie en matière de technologie nucléaire. Nous devrions envoyer nos espions infiltrer leurs installations nucléaires et voler leurs secrets, ce qui pourrait nous aider à faire avancer nos propres ambitions nucléaires et à contrer la menace de l'impérialisme."
