l_french:
 NIC_60s_transformation:0 "Commencer La Gran Transformación"
 NIC_60s_transformation_desc:0 "Nous nous sommes emparés d'une nation coincée dans le passé et il est de notre devoir de la porter vers l'avenir."
 NICC_60s_sandinista_support:0 "Promouvoir l'héritage d'Augusto César Sandino"
 NICC_60s_sandinista_support_desc:0 "Augusto César Sandino a commencé cette révolution. Pour cela, on se souviendra de lui."
 NICC_socialist_realism:0 "Adoptez le réalisme socialiste"
 NICC_deal_with_fun:0 "Accord avec le Front Unitario Nicaragüense"
 NIC_integrate_miskito:0 "Réintégrer les moustiques"
 NICC_Mosquitia_problem:0 "Le problème des moustiques"
 NICC_Mosquitia_problem_desc:0 "NICC_Mosquitia_problem_desc"
 NICC_deal_with_fun_desc:0 "engendrer Mosquitia, puis guerre civile"
 NIC_deal_with_somoza:0 "Sort de Luis Somoza Debayle"
 NIC_deal_with_somoza_desc:0 "Nous devons décider de ce qui arrive à Luis Somoza."
 NICC_maoist_struggle:0 "La Lucha de los Pueblos"
 NICC_student:0 "Solidifier la règle de Borge"
 NICC_secure_the_capital:0 "Sécurisez Managua"
 NICC_pioneers:0 "Création du Movimiento Juventud Patriótica Nicaragüense"
 NICC_pioneers_desc:0 "MJPN sera notre pionnier. Ils seront bien formés et dotés des compétences nécessaires pour servir notre pays."
 NIC_execute_former_somoza_assists:0 "Faire face aux alliés de Somozas"
 NIC_execute_former_somoza_assists_desc:0 "Somozas avait de nombreux alliés au Nicaragua. Il est de notre devoir de les condamner, mais nous devons faire attention aux personnes que nous arrêtons."
 NIC_free_polticial_allies:0 "Libérer les alliés injustement condamnés"
 NIC_free_polticial_allies_desc:0 "Nous devons libérer les personnes injustement condamnées par le régime Somoza."
 NIC_establish_sdi:0 "Créer un Servicio de Inteligencia"
 NIC_establish_sdi_desc:0 "Nous avons besoin d'une agence de renseignement pour assurer notre emprise sur le pays."
 NICC_distribute_somozas_Possessions:0 "Distribuer la propriété Somozas à..."
 NICC_distribute_somozas_Possessions_desc:0 "Somozas a laissé derrière lui beaucoup de biens. Les plus importantes seront prises en charge par l'État, mais la question est de savoir que faire des choses les plus mineures. Nous pourrions les donner aux gens. Ou nous pouvons le donner aux membres du groupe qui travaillent dur."
 NICC_embrace_radio:0 "Créer un récepteur du village"
 NICC_embrace_radio_desc:0 "Nous devons fabriquer une radio bon marché afin que chaque foyer puisse en posséder une."
 NICC_red_churches:0 "Convertir les églises en socialisme"
 NICC_red_churches_desc:0 "La religion est importante pour beaucoup de nos concitoyens et pourrait résister aux tentatives visant à la réprimer complètement. Ainsi, nous transformerons nos églises en églises socialistes."
 NICC_red_academies:0 "Adoptez l'éducation socialiste"
 NICC_red_academies_desc:0 "Pour transformer notre société, nous avons besoin que nos citoyens soient éduqués."
 NICC_bright_futurte:0 "Regardez vers un avenir radieux"
 NICC_bright_futurte_desc:0 "À l'avenir radieux de la société communiste, à la prospérité universelle et à une paix durable."
 NICC_unify_country:0 "Service de renseignement"
 NICC_Mosquitia:0 "Mosquitia sécessionniste"
 NICC_Mosquitia_desc:0 "Pendant la révolution, le peuple Miskito et ses alliés Somoza ont décidé de proclamer une Côte des Moustiques indépendante. Nous devons les ramener dans notre giron d'une manière ou d'une autre."
 NICC_fun:0 "...Et les insurgés"
 NICC_negotations:0 "Négociations ouvertes"
 NICC_negotations_desc:0 "Nous devons ouvrir des négociations avec eux. Ce sera à nos frais, mais cela améliorera grandement nos chances."
 NICC_part_of_us:0 "Pousser pour l'intégration"
 NICC_part_of_us_desc:0 "Il est temps d'exiger leur soumission. Nous espérons qu'ils seront sensés et accepteront, mais il est probable qu'ils exigeront quelque chose en retour."
 NICC_forceful_integration:0 "Intégrer avec force"
 NICC_forceful_integration_desc:0 "Ce ne sont pas eux qui établissent les règles ici, c'est nous. Comme ils ne nous écoutent pas, il est clair que nous devons lancer une invasion contre eux."
 NICC_autonomic_area:0 "Autoriser une autonomie limitée"
 NICC_autonomic_area_desc:0 "Il n'est pas nécessaire de rendre les choses difficiles, puisque leurs demandes sont raisonnables. Au lieu d'une réintégration complète, ils seront intégrés en tant que république socialiste soviétique."
 NICC_inflitrate_gov:0 "Infiltrer leur gouvernement"
 NICC_inflitrate_gov_desc:0 "Nous devons mettre des gens qui nous sympathisent dans leur gouvernement."
 NICC_secure_our_rule:0 "Contrôle sécurisé dans les villes"
 NICC_secure_our_rule_desc:0 "Nous devons sécuriser les grandes villes pour consolider notre domination."
 NICC_contact_mao:0 "Établir des relations avec Mao"
 NICC_guerilla_warfare:0 "Créer une milice de défense nationale"
 NICC_guerilla_warfare_desc:0 "Milicia de défense nationale"
 NICC_establish_spa:0 "Armée populaire sandiniste"
 NICC_establish_spa_desc:0 "L'Armée populaire sandiniste nous défendra."
 NICC_chinese_advisors:0 "Rechercher des conseillers chinois"
 NICC_guevarist_constitution:0 "Créer une Constitution guévariste"
 NICC_departure_of_che:0 "Un remplaçant pour le Che"
 NICC_foco_idea:0 "Adoptez Foco Doctorine"
 NICC_chairman_Mayorga:0 "Président Silvio Mayorga"
 NICC_chairman_Mayorga_desc:0 "Il est temps pour Guevara de partir pour de nouvelles révolutions."
 NICC_albania:0 "Délégation en Albanie"
 NICC_maos_red_book:0 "Distribuer le livre rouge de Mao"
 NICC_marxistr_Humanism:0 "Début de l'humanisme marxiste"
 NICC_expell_banana_companies:0 "Expulser les entreprises de fruits"
 NICC_expell_banana_companies_desc:0 "Nous devons saisir leurs biens et expulser les associés impérialistes américains."
 NICC_chinese_jet_deal:0 "Accord sur les avions chinois"
 NICC_land_toguards:0 "Terrain "
 NICC_fight_us_influence:0 ""
 NICC_five_year_plan:0 "1er plan quinquennal"
 NICC_heavy_industry:0 "Développer des centres industriels pour le progrès économique"
 NICC_heavy_industry_desc:0 "Nous entreprendrons un effort stratégique pour créer des centres industriels spécialisés, visant à favoriser le progrès économique et le développement industriel au Nicaragua. En concentrant les usines et les installations de fabrication dans ces pôles urbains dédiés, nous visons à améliorer la productivité et à stimuler une croissance durable."
 NICC_agraculutural_revoltuion:0 "Révolution agricole"
 NICC_agraculutural_revoltuion_desc:0 "Nous devons révolutionner notre agriculture avec des études et des équipements."
 NICC_modern_indutrial_tools:0 "Importer des outils industriels modernes"
 NICC_el_pueblo:0 "Créer le journal El Pueblo"
 NICC_el_pueblo_desc:0 "El Pueblo sera le journal officiel de notre parti. Il devrait être publié quotidiennement et plaire aux ouvriers des usines et aux étudiants universitaires. La publication sera réalisée par une coopérative."
 NICC_arm_every_man:0 "Armez chaque homme et chaque femme"
 NICC_religion_is_opium:0 "Opio del Pueblo"
 NICC_religion_is_opium_desc:0 "La religion est l'opinion du peuple"
 NICC_soviet_meeting:0 "Rencontre avec les Soviétiques"
 NICC_frente_obreito:0 "Créer le Front Obrero"
 NICC_frente_obreito_desc:0 "Syndicat"
 NICC_hoxhaist_revolution:0 "Révolution Hoxhaist"
 NICC_antier_revisionism:0 "Rachat de Hoxhaist"
 NICC_defend_che:0 "Défendre l'État guévariste"
 NICC_radical_revolutioin:0 "Assassinat de Silvio Mayorga"
 NICC_radical_revolutioin_desc:0 "Hasta Siempre, commandant"
 NICC_educate_peasents:0 "Éduquer les paysans"
 NICC_export_the_revolution:0 "Exporter la révolution"
 NICC_export_the_revolution_desc:0 "Nous devons soutenir les révolutionnaires en Amérique centrale."
 NICC_experimental_workers_councils:0 "Soviétique des travailleurs expérimentaux"
 NICC_equality:0 "Égalité pour les femmes"
 NICC_collectivization:0 "Adoptez la collectivisation"
 NICC_self_sacrifice:0 "Encouragez le sacrifice de soi"
 NICC_self_sacrifice_desc:0 "Notre peuple doit repousser ses limites pour le bien de la révolution."
 NICC_albanian_bunkers:0 "Programme de bunkerisation"
 NICC_albanian_bunkers_desc:0 "Inspirés par notre voyage en Albanie, nos militaires ont préparé un programme de construction de bunkers pour défendre notre pays."
 NICC_political_comissars:0 "Surveillance de l'armée par le SdI"
 NICC_purge_fonseca:0 "Purger Carlos Fonseca"
 NICC_mining_in_mountains:0 "Développer l'exploitation minière dans les hauts plateaux du centre"
 NICC_air_doctorine:0 "Importer des avions d'entraînement"
 NICC_dprk_relations:0 "Établir des relations avec la RPDC"
 NICC_dprk_relations_desc:0 "Nos diplomates rencontreront la délégation de la RPDC à Pyongyang. Cette mission vise à renforcer nos relations diplomatiques avec eux, ce qui pourrait conduire à une coopération et un soutien accrus dans divers domaines, notamment militaire, économique et idéologique. Nous espérons que cette mission approfondira notre amitié et apportera des bénéfices mutuels à nos deux nations."
 NICC_spirit_of_revolutioin:0 "L'esprit de la révolution"
 NICC_spirit_of_revolutioin_desc:0 "Notre peuple doit repousser ses limites pour le bien de la révolution."
 NICC_placate_urban_elite:0 "Bénéficiez du soutien des étudiants urbains"
 NICC_hardline_countryside:0 "Faire taire les instruits"
 NICC_north_vietnam:0 "Rencontre avec Ho Chi"
 NICC_north_vietnam_desc:0 "Nos diplomates ont obtenu une rencontre à Hanoï avec Hô Chi Minh."
 NICC_promote_ortega:0 "Promouvoir Juan Alberto au poste de vice-président"
 NICC_Altamirano:0 "Promouvoir Elí Altamirano au poste de vice-président"
 NICC_promote_gonzales:0 "Promouvoir Álvaro Ramírez González au poste de vice-président"
 NICC_second_man:0 "Organisez un vote pour le vice-président"
 NICC_second_man_desc:0 "Le poste de Vice-Président doit être pourvu. Pour cela, le Politburo procédera à un vote."
 NICC_tolerate_homos:0 "Tolérer l'homosexualité"
 NICC_rename_managua:0 "Renommer Managua"
 NICC_rename_managua_desc:0 "Certains membres du parti ont proposé de renommer notre capitale en l'honneur des réalisations socialistes."
 NICC_turn_into_dprk:0 "Création du PCdeN"
 NICC_criticize_soviet_union:0 "Autoriser le matériel critique soviétique"
 NICC_trade_union_Support:0 "Récompenser les syndicats pour leur soutien"
 NICC_trade_union_Support_desc:0 "Les syndicats ont joué un rôle déterminant dans notre lutte contre les forces impérialistes et la bourgeoisie réactionnaire. Ils ont mobilisé les travailleurs, organisé des grèves et défendu nos acquis révolutionnaires. Nous devons les récompenser pour leur loyauté et leur dévouement à la cause Hoxhaist. En leur accordant plus d'autonomie, de représentation et de ressources, nous renforcerons notre alliance et garantirons leur soutien continu à notre gouvernement."
 NICC_purge_bourgeois:0 "Qualifier l'opposition de bourgeoise"
 NICC_break_soviet_relations:0 "Expulser les diplomates soviétiques"
 NICC_hoxha_alberto:0 "Marx, Hoxha, Alberto"
 NICC_hoxha_alberto_desc:0 "Marx, Hoxha, Alberto.. Trois grands hommes qui nous inspirent."
 NICC_break_soviet_relations_desc:0 "En raison de la différence de vision du communisme entre nous et les Soviétiques, il est nécessaire que nous coupions toute communication avec eux. Nos idéologies sont incompatibles et continuer à s'engager avec elles ne serait pas fructueux. Il est donc impératif que nous prenions cette mesure pour maintenir l'intégrité de nos croyances. Nous devons nous concentrer sur la poursuite de nos objectifs avec ceux qui partagent nos idéaux."

 NICC_reform_the_party:0 "Réformer la ligne du parti"
 NICC_reform_the_party_desc:0 "Afin de nous aligner sur notre nouvelle idéologie hoxhaiste, il est impératif que nous procédions à certains changements au sein du parti. Ces changements garantiront que le parti soit en phase avec notre nouvelle orientation politique."
 NICC_copy_Tirana:0 "Ton Tiranen"
 NICC_copy_Tirana_desc:0 "La décision de modeler Ciudad de Lénine sur Tirana reflète l'admiration de notre pays pour le gouvernement socialiste d'Albanie dirigé par Enver Hoxha et représente une étape naturelle dans notre quête d'une société véritablement socialiste. Malgré les critiques potentielles, nous pensons que cette évolution servira d'inspiration à d'autres pays socialistes à travers le monde."
 NICC_statues_for_all:0 "Formation des milices pour la révolution"
 NICC_statues_for_all_desc:0 "Nous devons armer nos citoyens pour se défendre contre les menaces de la révolution."
 NICC_hoxhaist_network:0 "Créer des AHAS"
 NICC_hoxhaist_network_desc:0 "Alianza Hoxista de l'Amérique du Sud"
 NICC_albanian_language:0 "Leçons volontaires de langue albanaise"
 NICC_purge_guevara:0 "Adoptez l'anti-guévarisme"
 NICC_cultural_revolution:0 "Grande révolution culturelle"
 NICC_neutrality_in_sino_soviet:0 "Neutralité face à la scission sino-soviétique"
 NICC_limit_trade:0 "Limiter le commerce international"
 NICC_consolidate_power:0 "Sécurisez le pouvoir d'Altamirano"
 NICC_close_american_embassies:0 "Fermer les ambassades américaines"
 NICC_close_american_embassies_desc:0 "Il est clair que les Américains complotent contre nous. Nous devons leur refuser toute possibilité de faire quoi que ce soit. La fermeture de leurs ambassades leur fait perdre du terrain."
 NICC_protest_us_panama:0 "Protestation contre l'occupation américaine du canal de Panama"
 NICC_protest_us_panama_desc:0 "Pourquoi les impérialistes américains devraient-ils contrôler le canal au lieu des Panaméens ?"
 NICC_soviet_training:0 "Envoyer des officiers étudier à Moscou"
 NICC_soviet_training_desc:0 "En envoyant nos officiers étudier à Moscou, ils apprendront à diriger notre armée de manière plus efficace."
 NICC_cuban_comrades:0 "Déclarons l'amitié Cuba-Nicaragua"
 NICC_support_ira:0 "Établir des contacts avec l'IRA provisoire"
 NICC_support_ira_desc:0 "Nous devrions établir le contact avec l'IRA. Pour y parvenir, nous leur envoyons des cadeaux."
 NICC_federation_of_central:0 ""
 NICC_guarantee_soviet_support:0 "Visite à Moscou"
 NICC_central_federatioin:0 "Fédérations soviétiques d'Amérique centrale"
 NICC_FSLN:0 "Renommer la fête en l'honneur de Sandino"
 NICC_FSLN_desc:0 "Pour honorer davantage Sandino, certains membres du parti ont suggéré de le renommer en son honneur."
 NICC_czech_arms:0 "Importer un modèle AK tchèque"
 NICC_czech_arms_desc:0 "Nous avons conclu un accord pour 10 000 Sa vz tchèques. 58 fusils à modèle."
 NICC_control_information:0 "Renforcer la censure"
 NICC_revolutionary_education:0 "Encourager l'éducation pour tous"
 NICC_revolutionary_education_desc:0 "L'éducation des masses était au coeur de l'idéologie sandiniste. Nous devons mettre en oeuvre cela pour améliorer la vie des gens."
 NICC_partisan_guards:0 "Consejo de Defensa Sandinista"
 NICC_partisan_guards_desc:0 "Le Consejo de Defensa Sandinista est un réseau de comités de quartier à travers le Nicaragua. Ces organisations, décrites comme « les yeux et les oreilles de la révolution », existent pour aider à soutenir les communautés locales et rendre compte des activités contre-révolutionnaires."
 NICC_mig_15:0 "Importer des MIG-15"
 NICC_mig_15_desc:0 "Pour entrer dans l'ère des avions à réaction, nous avons réussi à acheter des avions de combat MIG-15."
 NICC_t_54:0 "Accord pour les T-54"
 NICC_t_54_desc:0 "Les Soviétiques ont décidé de nous faire don de quelques T-54."
 NICC_arm_opas:0 "Formation militaire pour le MJPN"
 NICC_arm_opas_desc:0 "Nous devons former nos pionniers au maniement des armes afin qu'ils puissent défendre le pays avant de rejoindre l'armée."
 NICC_pressure_church:0 "Espionner les églises"
 NICC_pressure_church_desc:0 "Ne vous y trompez pas, les Églises tenteront d'agir contre nous. Pour contrer cela, nous lancerons une opération intense contre eux."
 NICC_soviet_cars:0 "Licence de voitures soviétiques"
 NICC_crosscountry_electrics:0 "Développez l'INE à travers le pays"
 NICC_crosscountry_electrics_desc:0 "Institut nicaraguayen de l'énergie"
 NICC_automation:0 "Aide soviétique pour l'électricité"
 NICC_currency_reform:0 "Réforme Cordoue"
 NICC_east_german_ties:0 "Commencer le commerce est-allemand"
 NICC_protect_minorities:0 "Rédiger des lois sur la protection des minorités"
 NICC_extraordenary_meeting:0 "Réunion extraordinaire du Parti"
 NICC_extraordenary_meeting_desc:0 "Pour une raison extraordinaire, la fête devrait se réunir dès que possible."
 NICC_miskito_resttlement:0 "Transfert de la Grande Oriente"
 NICC_miskito_resttlement_desc:0 "Réinstaller les Miskito loin de l'est"
 NICC_reject_cult_of_personality:0 "Rejeter le culte de la personnalité"
 NICC_rehabiltaive_prisons:0 "SPRDM"
 NICC_rehabiltaive_prisons_desc:0 "Le Sistema penitenciario rehabilitador para delitos menores, système pénitentiaire de réhabilitation pour les délits mineurs, sera un programme expérimental visant à offrir aux criminels mineurs une chance de réinsertion."
 NICC_mafia_Remants:0 "NICC_mafia_Remants"
 NICC_february_holiday:0 "Déclarer le 21 février férié"
 NICC_february_holiday_desc:0 "Pour commémorer la mort d'Augusto César Sandino, le 21 février deviendra un jour férié."
 NICC_womens_rights:0 "Promouvoir les droits des femmes"
 NICC_womens_rights_desc:0 "Les femmes jouent un rôle déterminant dans la révolution."
 NICC_nationlism_healthy:0 "Promouvoir un nationalisme sain"
 NICC_student_funding:0 "Augmenter le financement de l'éducation"
 NICC_experimental_farming:0 "Révolutionner l'agriculture"
 NICC_send_Fonseca_away:0 "Nommer Fonseca à l'ambassade de Mongolie"
 NICC_send_Fonseca_away_desc:0 "Borge a prévu le plan de Fonseca et a préparé sa contre-attaque. Il s'était assuré la fidélité de la plupart des membres du Comité central. Il avait également renforcé son contrôle sur l'armée et le Servicio de Inteligencia, et avait secrètement armé le Consejo de Defensa Sandinista. Il a révélé que le complot de Fonseca était une tentative de coup d'État perfide et a ordonné son arrestation immédiate. Fonseca et ses alliés étaient en infériorité numérique et en armes par les forces de Borge, qui les encerclèrent et les forcèrent à se rendre. Borge prononce ensuite un discours dans lequel il se proclame seul dirigeant du parti et de la révolution. Il dénonça Fonseca comme un renégat, un révisionniste et un agent des impérialistes. Il a annoncé qu'il l'expulserait du Politburo, lui retirerait tous ses titres et honneurs et l'enverrait en Mongolie comme ambassadeur, en guise de honte pour sa déloyauté. Il a également juré d'éliminer tous ceux qui s'opposeraient à lui ou à sa politique."
 NICC_borge_steps_down:0 "Retraite de Borge"
 NICC_borge_steps_down_desc:0 "Après des heures d'intenses discussions, Fonseca parvient à convaincre la majorité des membres du Comité central de voter pour la destitution de Borge. Borge se rend compte qu'il a perdu son emprise sur le parti et accepte à contrecoeur de démissionner. Il annonce sa démission dans un discours dans lequel il exprime son espoir que le parti restera uni et fidèle à la cause socialiste. Fonseca est élu nouveau secrétaire général et s'engage à réformer le parti et le pays selon sa vision du marxisme-léninisme. Il promet également d'améliorer les relations avec la Chine et les autres pays non alignés, et de résister à toute ingérence ou agression étrangère."
 NICC_cia_coup:0 "Opération Tour de Garde"
 NICC_cia_coup_desc:0 "Et ce n'est pas notre destin\n\nAlors arrêtons de parler faussement maintenant\n\nL'heure se fait tard, hé"
 NICC_defence_minister:0 "Nommer le ministre de la Défense"
 NICC_mexican_comrades:0 "Soutenez les communistes mexicains"
 NICC_shuffle_politbyro:0 "Remaniement du Politbyro"
 NICC_encourage_urb:0 "Encourager la croissance urbaine"
 NICC_martial_law:0 "Adopter la loi martiale"
 NICC_secure_miskito:0 "Contrôle sécurisé à Miskito"
 NICC_follow_cia_advice:0 "Suivez les conseils de la CIA"
 NICC_propaganda_campaign:0 "Répandre la propagande à travers le pays"
 NICC_propaganda_campaign_desc:0 "Il est évident que nous devons sécuriser le reste du pays. Pour commencer, nous devons diffuser notre message dans les zones belliqueuses."
 NICC_establish_united_front:0 "Créer un Front Démocratique"
 NICC_new_somoza:0 "Un nouveau Somoza ?"
 NICC_new_somoza_desc:0 "Pour sauver le Nicaragua de la menace rouge, nous ne pouvons nous permettre de faibles compromis. Avec l'aide de la CIA, nous pouvons établir une nouvelle junte amie de Washington."
 NICC_enlist_cia_Help:0 "Manuel de la CIA"
 NICC_free_media:0 "Autoriser les médias gratuits"
 NICC_close_churches:0 "Démolir certaines églises"
 NICC_close_churches_desc:0 "SdI a identifié certaines églises antigouvernementales de premier plan. Nous devons les fermer immédiatement."
 NICC_homosexuality_legal:0 "Tolérer l'homosexualité"
 NICC_make_people_happy:0 "Augmenter l'abordabilité des biens de consommation"
 NICC_invite_soviet_leader:0 "Inviter [SOV.GetLeader] pour une visite"
 NICC_ban_Miskito:0 "Interdire l'utilisation du Miskito"
 NICC_anti_corruption:0 "Créer un département anti-corruption"
 NICC_prepare_for_final_assault:0 "Formulaire Batallón 1501"
 NICC_prepare_for_final_assault_desc:0 "Le Batallón 1501 sera un bataillon spécialement formé pour nous aider à combattre les rebelles communistes. Ils disposent d'une grande liberté pour éliminer les communistes."
 NICC_assault_mountains:0 "Frappez les restes"
 NICC_allow_women_vote:0 "Permettre aux femmes de voter"
 NICC_execute_former_communists:0 "Exécuter d'anciens sandistes"
 NICC_execute_former_communists_desc:0 "Nous devons exécuter les sandinistes les plus haut placés pour garantir qu'ils ne reviennent pas."
 NICC_south_african_ties:0 "Se faire des amis en Afrique du Sud"
 NICC_privatization:0 "Privatiser les entreprises publiques"
 NICC_invite_un_obervers:0 "Inviter des observateurs de l'ONU"
 NICC_the_election:0 "Élections présidentielles"
 NICC_police_funding:0 "Réorganiser le financement de la police"
 NICC_police_funding_desc:0 "Il est clair que les fonds actuellement alloués à la police ne sont pas utilisés comme ils le devraient. Un petit ajustement budgétaire s'impose."
 NICC_limited_elections:0 "Introduire des élections de bas niveau"
 NICC_modern_caudillo:0 "Caudillo moderne"
 NICC_denaunce_mao:0 "Condamner le maoïsme"
 NICC_east_german_electronics:0 "Créer IMS/SMI"
