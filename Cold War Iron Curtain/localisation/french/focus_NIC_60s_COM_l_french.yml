Augusto_sandinista_cult:0 "Culte d'Augusto César Sandino"
nicc_hoxhaist_takeover:0 "Remplace le Politburo par Hoxhaist"
 NICC_albanian_language_desc:0 "Nous sommes fiers d'annoncer l'introduction de cours volontaires de langue et de culture albanaises dans le programme national, en hommage à Enver Hoxha et à ses réalisations socialistes en Albanie. Cette décision vise à inciter les étudiants à poursuivre de nouvelles voies d'apprentissage et à renforcer les liens entre le Nicaragua et l'Albanie."
 NICC_purge_guevara_desc:0 "L'épuration de l'aile guévariste et l'adoption de l'idéologie anti-guévariste sont une étape nécessaire pour protéger l'expérience socialiste des éléments contre-révolutionnaires qui infiltrent le parti. Bien que certains puissent critiquer cette décision, il s'agit d'une décision pragmatique qui garantira le succès continu de la révolution."
 NICC_air_doctorine_desc:0 "Sans formation, tous les nouveaux avions sont inutiles. Heureusement pour nous, la Chine a accepté d'envoyer des avions d'entraînement supplémentaires, ainsi que des pilotes expérimentés, pour former nos pilotes."

 NICC_purge_fonseca_desc:0 "Fonseca est une épine à nos côtés. Il doit quitter la fête."
 NICC_arm_every_man_desc:0 "Pour s'assurer que nous puissions armer toutes les personnes nécessaires en cas d'invasion, la Chine a accepté de nous faire don de fusils SKS."
 NICC_foco_idea_desc:0 "Dans les années 1960, le révolutionnaire marxiste Che Guevara a développé la théorie de la révolution foco, basée sur ses expériences lors de la Révolution cubaine de 1959. Son principe central est que l'avant-garde des cadres de petits groupes paramilitaires rapides peut fournir un foyer de mécontentement populaire contre un régime en place et ainsi conduire une insurrection générale."
 NICC_political_comissars_desc:0 "Pour garantir que l'armée reste fidèle aux principes de la révolution, nous confierons à la SdI des responsabilités de surveillance. Le SdI travaillera en étroite collaboration avec les commandants militaires pour garantir que les actions de l'armée s'alignent sur les objectifs du gouvernement révolutionnaire. De cette façon, nous renforcerons le contrôle du gouvernement sur l'armée et veillerons à ce qu'elle reste une force puissante et fidèle à nous."
NIC_alberto:0 "Juan Alberto a été élu vice-président"
NIC_hoxhaist_alliancet:0 "Création de l'Alianza Hoxista de América del Sur"
NIC_gonzales:0 "Álvaro Ramírez González a été élu vice-président"
NIC_Altamirano:0 "Élu Eli Altamirano Pérez au poste de Vice-Président"
nic_ort:0 "Organisation révolutionnaire du travail"
NIC_tomas_borge_intelligence_chief:0 "Chef de l'Intelligence : §YTomás Borge§!"
NIC_tomas_borge_intelligence_chief_desc:0 "Tomás Borge est le chef de notre agence de renseignement, le Servicio de Inteligencia. C'est un leader loyal et efficace qui protège notre révolution des ennemis internes et externes."
