 NICC_fight_drug_use:0 "Permettre plus de liberté de la presse"
 NICC_fight_drug_use_desc:0 "Afin d'apaiser certains dissidents et critiques de notre régime, nous devrions permettre un certain degré de liberté de la presse dans notre pays. L'État aura toujours le pouvoir de censurer et de contrôler les médias, mais il exercera ce pouvoir avec plus de parcimonie et de sélectivité."
