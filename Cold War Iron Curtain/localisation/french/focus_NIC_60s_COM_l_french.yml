 NICC_party_unity:0 "Assurer la loyauté du parti"
 NICC_anit_Yugoslavism:0 "Anti-Yougoslavisme"
 NICC_anit_Yugoslavism_desc:0 "La soi-disant Yougoslavie socialiste est une imposture et une fraude, une marionnette des puissances impérialistes qui cherche à saper la véritable révolution socialiste dans le monde. [YUG.GetLeader] et ses partisans ont trahi l'héritage de Staline et de Lénine et ont adopté une ligne révisionniste et opportuniste qui sert les intérêts de la bourgeoisie et des propriétaires fonciers."
 NICC_meeting_with_pot_pol:0 "Organiser une réunion avec Pol Pot"
 NICC_personality_cult_grand:0 "Créer un culte massif de la personnalité"
 NICC_declare_year_Zero:0 "Déclarer l'année zéro"
 NICC_declare_year_Zero_desc:0 "Toutes les cultures et traditions au sein d'une société doivent être complètement détruites ou abandonnées et une nouvelle culture révolutionnaire doit les remplacer en partant de zéro."
 NICC_ensure_exportrs_to_iusa:0 "Assurer les exportations vers les États-Unis"
 NICC_ensure_exportrs_to_iusa_desc:0 "Syndicats subujagte"
 NICC_return_to_traditonalism:0 "Retour à la culture traditionnelle"
 NICC_smuggle_Cuba_refugees:0 "Faire passer clandestinement des réfugiés cubains"
 NICC_smuggle_Cuba_refugees_desc:0 "La CIA nous a conseillé de les aider à faire sortir clandestinement des dissidents cubains de Cuba. Pourquoi pas?"
 NICC_somoza_legfacy:0 "Immortaliser la famille Somoza"
 NICC_somoza_legfacy_desc:0 "Les Somozas seront les martyrs de la nation entière. Calero portera leur esprit vers l'avant."
 NICC_arrest_trouble_makers:0 "Arrêter la plupart des révolutionnaires radicaux"
