 SWE_1958_Elections_desc:0 "Élections"
 SWE_Seek_Norwegian_Heavy_Water_desc:0 "Ratifier le Traité de non-agression soviétique-afghan"
 SWE_Seperate_the_Church_and_State_desc:0 "\"Presque n'importe quelle secte, culte ou religion légifèrera sur son credo si elle acquiert le pouvoir politique pour le faire.\"\n-Robert A. Heinlein"
 SWE_The_Strong_Society_desc:0 "_"

 SWE_monarchchange.1.d:0 "Après une période de santé dégradée suite à son 90ème anniversaire ; Gustave V, roi de Suède, est décédé des suites d'une bronchite aiguë. Pendant que nous sommes occupés à pleurer et à nous préparer à envoyer le défunt roi vers sa dernière demeure, son fils Gustaf Adolf montera sur le trône sous le nom de Gustaf VI."
 SWE_monarchchange.2.d:0 "Oscar Gustaf Adolf, roi de Suède depuis 1907, est décédé aujourd'hui à Stockholm. Le début du règne de Gustaf a vu la montée du régime parlementaire en Suède, bien que la période précédant la Première Guerre mondiale ait conduit à son limogeage du Premier ministre libéral Karl Staaff en 1914, le remplaçant par sa propre figure de proue Hjalmar Hammarskjöld pendant la majeure partie de la guerre. Cependant, après que les libéraux et les sociaux-démocrates ont obtenu une majorité parlementaire sous la direction du successeur de Staaff, Nils Edén, il a permis à Edén de former un nouveau gouvernement qui a de facto dépouillé la monarchie de tous les pouvoirs virtuels et a instauré le suffrage universel et égal, y compris pour les femmes, en 1919. S'inclinant pleinement aux principes de la démocratie parlementaire, il est resté une figure de proue populaire pendant les 31 années restantes de son règne, bien qu'il ne soit pas complètement sans influence - pendant la Seconde Guerre mondiale, il aurait exhorté Per Albin Le gouvernement de coalition de Hansson a accepté les demandes de soutien logistique de l'Allemagne nazie, refusant ce qui aurait pu provoquer une invasion. Il fut le premier roi suédois depuis le Haut Moyen Âge à ne pas avoir de couronnement et donc à ne jamais porter de couronne.\nSon fils aîné, Gustaf Adolf, lui succédera à 67 ans."
 SWE_monarchchange.3.d:0 "Gustav V décède de vieillesse."
 #SWE_monarchchange.4.d:0 "Carl XVI Gustaf ascends to the throne."
 SWE_NUKES.1.d:0 "Le débat fait rage au sein du cabinet suédois concernant une recommandation du ministère de la Défense selon laquelle la Suède doit acquérir des armes nucléaires pour préserver sa neutralité et son indépendance. Le ministre estime que la détérioration de la situation internationale et l'expansion rapide des arsenaux nucléaires de l'Union soviétique et des États-Unis font des armes nucléaires un moyen de dissuasion essentiel. Cependant, un partenaire de la coalition, la Fédération des femmes sociales-démocrates (SSKF), s'oppose fermement à cette recommandation. Ils affirment que de telles armes militariseraient la Suède et augmenteraient le risque de conflit et ont protesté contre la décision du cabinet de garder ces discussions hors du public. Le gouvernement doit décider soit de risquer l'opposition et les réactions négatives de l'opinion publique en optant pour le nucléaire, soit de laisser la Suède sans défense face au chantage nucléaire et de céder au SSKF."
 SWE_NATO.1.d:0 "Le gouvernement suédois a présenté une proposition concernant sa position actuelle de neutralité. La Suède a proposé de rejoindre l'OTAN en échange du droit d'acheter des armes nucléaires aux États-Unis. L'adhésion de la Suède à l'OTAN pourrait ajouter un nouvel État de première ligne moderne et militairement puissant contre l'Union soviétique. Nous obtiendrons également de plus grandes capacités pour contrer les menaces soviétiques dans la Baltique. Cependant, certains au sein du Département d'État et du Pentagone expriment des réserves quant à cette proposition, affirmant que la diffusion de la technologie et des armes nucléaires réduit ainsi le contrôle international et met en fin de compte les intérêts américains. La Maison Blanche doit décider si elle acceptera la prolifération des armes nucléaires de la Suède pour son alliance ou si elle adoptera une position ferme de non-prolifération."
 SWE_NATO.2.d:0 "Le gouvernement des États-Unis a accepté notre proposition d'adhérer à l'OTAN en échange d'armes nucléaires américaines. Le ministère de la Défense et l'armée sont ravis de cette nouvelle. Le programme nucléaire actuel dépend largement de la coopération américaine et leur soutien total permettra de créer une dissuasion nucléaire robuste. Même si la Suède a finalement atteint son objectif de dissuasion, cela se fait au détriment de la neutralité. De nombreux Suédois seront probablement inquiets et s'opposeront à notre décision. Nous surveillerons de près la réaction de l'Union soviétique ; ses dirigeants ont averti depuis longtemps que toute expansion de l'OTAN à la Suède entraînerait une réponse majeure."
 SWE_NATO.3.d:0 "Le gouvernement américain a décliné notre proposition d'adhésion à l'OTAN en échange d'armes nucléaires américaines. Il s'agit d'une déception majeure pour le ministère de la Défense et les militaires qui prônent depuis longtemps l'acquisition d'une dissuasion nucléaire. Cependant, il semble que les États-Unis soient engagés en faveur de la non-prolifération, même au prix de la perte d'alliés militaires potentiels. Même si aucun accord n'a été trouvé, certains membres du gouvernement se réjouiront du maintien de la neutralité suédoise."
 SWE_NATO.4.d:0 "L'ambassadeur à Stockholm a confirmé les informations selon lesquelles la Suède envisageait d'adhérer à l'OTAN. Il s'agit d'un changement inacceptable dans l'équilibre européen. La Suède est frontalière avec l'Union soviétique, ce qui permet à l'alliance américaine d'intercepter les navires soviétiques et de frapper profondément sur le territoire soviétique. L'OTAN aura également accès à l'industrie de défense et à la puissance militaire de la Suède, modifiant ainsi l'équilibre des pouvoirs. Pour rétablir cet équilibre, il est proposé de s'emparer de l'île stratégique du Svalbard, administrée par la Norvège mais abritant une importante population soviétique et des mines. Le contrôler serait essentiel pour garantir que l'OTAN ne puisse pas facilement bloquer nos transports maritimes. Nous devons décider s'il faut lancer ce plan, au risque d'une escalade avec l'OTAN, ou simplement se concentrer sur des condamnations diplomatiques."
 SWE.5.d:0 "Depuis les années 1930, le gouvernement suédois a cherché à mettre en oeuvre le concept politique de « La Maison du Peuple ». La croyance fondamentale est que la société devrait fonctionner comme une cellule familiale, dont les membres contribuent et prennent soin les uns des autres. Il propose une approche équilibrée entre capitalisme et socialisme. La nationalisation ou la privatisation totale n'existe pas ; le gouvernement s'appuie plutôt sur des réglementations pour contrôler directement l'économie. La lutte des classes est remplacée par la collaboration des classes pour le bien national. Le gouvernement suédois a annoncé son intention de lancer de nouveaux programmes sociaux et d'étendre les programmes existants afin de mieux servir la population."
 SWE_NUCLEAR.5.d:0  "Le gouvernement suédois soutient pleinement l'initiative Atomes pour la paix. La technologie nucléaire offre à la Suède une opportunité majeure de répondre à ses besoins énergétiques et d'alimenter sa croissance économique. L'initiative des États-Unis offre à toutes les nations la possibilité de récolter les fruits de la technologie nucléaire et montre les intentions pacifiques des États-Unis. Les chercheurs nucléaires suédois attendent avec impatience l'opportunité de dialoguer directement avec des experts américains pour apporter rapidement l'énergie nucléaire à la population."
 SWE_NUCLEAR.1.d:0 "Le gouvernement suédois a envoyé une demande visant à renforcer la coopération dans le domaine de l'énergie nucléaire. L'État suédois a commencé à mener des recherches nucléaires dès 1946. Avec notre aide, il espère utiliser l'énergie nucléaire pour alimenter le développement économique et l'indépendance énergétique. Sur le papier, un tel accord donnerait probablement un coup de pouce à notre propre recherche, car la Suède compte des chercheurs de premier ordre. Cependant, les rapports des services de renseignement indiquent que de nombreux responsables suédois croient en la dissuasion nucléaire et que les connaissances qu'ils acquièrent grâce à nous pourraient accélérer un programme d'armement clandestin. Nous pouvons soit accepter l'accord et espérer que les Suédois resteront engagés dans le développement énergétique, soit le rejeter parce que les risques sont trop élevés."
 SWE_NUCLEAR.2.d:0 "Les États-Unis ont accepté notre proposition de coopération renforcée dans le domaine de l'énergie nucléaire. Cela apportera une richesse d'informations et, plus important encore, l'accès aux plans et aux matériaux essentiels pour un programme d'énergie nucléaire. Des liens scientifiques accrus peuvent également permettre à nos scientifiques d'affiner et de tester leurs propres théories sur le développement d'une telle technologie. Le gouvernement espère une expansion plus rapide de l'énergie nucléaire dans le pays. En privé, certains responsables de la sécurité pensent que l'expansion de ces installations pourrait offrir des avantages à long terme pour le développement d'armes nucléaires, si nécessaire."
 SWE_NUCLEAR.3.d:0 "Les États-Unis ont rejeté notre proposition de coopération renforcée dans le domaine de l'énergie nucléaire. Il s'agit d'un revers majeur pour nos projets visant à amener rapidement l'énergie nucléaire en Suède. Nous estimons que l'énergie nucléaire représente la possibilité de répondre à la demande énergétique et de soutenir la croissance économique. Le gouvernement américain a déclaré qu'il ne pouvait pas conclure un tel accord en raison de ses engagements actuels. Cependant, il semble que les États-Unis craignent que l'échange de connaissances et de matériaux ne soit utilisé pour un programme d'armes nucléaires, et ce malgré notre insistance sur le fait que nous souhaitons simplement travailler avec eux au développement de l'énergie nucléaire."
 SWE_NUCLEAR.20.d:0 "Les plus grands chercheurs et planificateurs nucléaires ont envoyé un rapport au gouvernement sur les étapes nécessaires à un cycle du combustible nucléaire national. Cela explique comment acquérir les matériaux nécessaires, quelles installations doivent être créées et quelles mesures doivent être prises pour que la Suède puisse produire sa propre énergie à partir de la technologie nucléaire. Ce plan ambitieux nécessite la coopération de plusieurs ministères, entreprises et experts. De plus, le gouvernement doit consacrer du temps et de l'argent pour assurer le succès. Le contrôle du cycle du combustible nucléaire préserve la sécurité énergétique de notre nation et empêche tout autre État de pouvoir arrêter le processus de production d'énergie nucléaire."
 SWE_USA_NUK.1.d:0 "Le gouvernement suédois a proposé de nous acheter des armes nucléaires. Les Suédois évoquent la menace soviétique croissante à leur frontière et la nécessité de se défendre contre le chantage nucléaire à l'avenir. Le Pentagone et le Département d'État notent qu'une hypothétique perte de la Suède en raison d'une invasion soviétique exposerait le flanc nord de la NATIO et risquerait de donner l'avantage aux Soviétiques. Les armes nucléaires assureraient probablement une dissuasion à la Suède et il y a peu de risques que le pays tombe dans l'orbite soviétique. Cependant, les responsables préviennent que la vente de ces armes rendrait sans objet les efforts futurs visant à promouvoir la non-prolifération."
 SWE_USA_NUK.2.d:0 "Les États-Unis ont accepté de nous fournir des armes nucléaires. Il s'agit d'une réalisation historique pour le gouvernement qui garantit une dissuasion nucléaire à la nation. Nos propres experts prédisaient que de telles capacités seraient réalisées avant des années. Nos propres systèmes, en particulier les systèmes de livraison, sont déjà basés sur la technologie américaine, de sorte que la mise en place de mécanismes de livraison robustes ne semble pas trop difficile. Le ministère de la Défense et les dirigeants militaires prévoient de se réunir prochainement pour planifier le déploiement et la maintenance des armes."
 SWE_USA_NUK.3.d:0 "Les États-Unis ont refusé de nous fournir des armes nucléaires. Il semble qu'ils ne pouvaient pas accepter un tel accord car il allait à l'encontre de leur position internationale sur la prolifération et la responsabilité nucléaires. Même si l'accord restait secret, sa découverte exposerait les Américains aux niveaux national et international. Malgré leur rejet, les États-Unis ont exprimé leur compréhension des défis auxquels la nation suédoise est confrontée. Le gouvernement doit réfléchir à ses options, notamment accélérer notre programme national afin de parvenir à une nucléarisation rapide."
 SWE_ELECTIONS.1.d:0 "Les Suédois se rendent aux bureaux de vote pour voter aux élections générales de 1952. Le Parti social-démocrate suédois cherchera à rester au pouvoir. Il espère que la vision d'une collaboration de classe pour le bien national et sa volonté de poursuivre la voie médiane entre le socialisme et le capitalisme resteront attrayantes pour les électeurs. Plusieurs partis de centre-droit et conservateurs se disputent également des sièges. Ils espèrent obtenir suffisamment de voix pour former une coalition et faire progresser la Suède vers une économie de marché libre et plus proche de l'ouest. L'élection devrait être très disputée."
 SWE_ELECTIONS.2.d:0 "Des élections ont lieu dans toute la Suède pour les élections générales de 1956. Le Parti social-démocrate suédois (SAP) espère que sa vision visant à faire de la Suède la « maison du peuple » trouvera un écho auprès des électeurs, tout comme son plaidoyer en faveur de la collaboration de classe. Les partis de centre-droit et de droite espèrent persuader les Suédois d'adopter une économie de marché plus libre, avertissant que le SAP encourage des taxes et des réglementations qui paralysent la croissance économique. Les analystes ne savent pas exactement quel parti est susceptible de l'emporter."
 SWE_ELECTIONS.3.d:0 "Il règne une atmosphère enthousiaste dans toute la Suède alors que des millions de personnes se rendent aux urnes pour voter aux élections générales de 1958. Le Parti social-démocrate suédois (SAP) espère que sa vision visant à faire de la Suède la « maison du peuple » trouvera un écho auprès des électeurs, tout comme son plaidoyer en faveur de la collaboration de classe. Cependant, il doit maintenir l'unité entre sa faction la plus à gauche et la faction modérée au sein du parti. Les partis de centre-droit et de droite espèrent persuader les Suédois d'adopter une économie de marché plus libre, avertissant que le SAP encourage des taxes et des réglementations qui paralysent la croissance économique. Les deux camps chercheront à obtenir une victoire électorale dominante pour mettre en oeuvre efficacement leur programme législatif."
 SWE_NATO.5.d:0 "L'OTAN a annoncé l'admission de la Suède comme nouveau membre. Il s'agit d'un gain majeur pour l'organisation compte tenu de la valeur économique, militaire et stratégique de l'État. Le gouvernement suédois a publié une déclaration exprimant sa joie de travailler avec des nations profondément attachées aux idéaux démocratiques et à la coopération. Une délégation de hauts responsables suédois de l'économie et de la défense devrait rencontrer les dirigeants de l'OTAN dans les semaines à venir. Cette annonce a suscité de l'inquiétude en Europe quant à la réaction possible de l'Union soviétique. Les Soviétiques avaient souvent averti que le changement de neutralité suédoise nécessiterait une réponse."
 SWE_NATO.6.d:0 "Les membres de l'OTAN se réunissent lors d'un sommet d'urgence suite à l'annonce de la prise de contrôle par les forces soviétiques de l'île norvégienne de Svalbard. L'île stratégique, qui abrite principalement des colons soviétiques qui travaillent dans les mines, est depuis longtemps une zone de conflit entre l'Union soviétique et la Norvège. Les Soviétiques affirment qu'ils se sont emparés de l'île pour empêcher l'OTAN de l'occuper ou de la militariser, en violation de l'interprétation soviétique du Traité du Svalbard. Le traité étant violé, les Soviétiques ont fait valoir qu'ils devaient agir. Beaucoup associent l'action soviétique à l'adhésion de la Suède à l'OTAN. Les Soviétiques estiment qu'une Suède hostile et une présence de l'OTAN au Svalbard mettraient la navigation soviétique dans un danger inacceptable."
 SWE_Non_Prolif.1.d:0 "Le gouvernement suédois a appelé toutes les nations à adopter la non-prolifération nucléaire et le désarmement nucléaire. Dans un communiqué, le gouvernement suédois a souligné que la prolifération des armes nucléaires représente un défi fondamental pour la sécurité mondiale et pour l'avenir de l'humanité elle-même. La Suède s'efforcera désormais de soutenir les efforts visant à réduire et à éliminer les armes nucléaires et la prolifération de ces armes à travers le monde."
 SWE_Nukes.201.d:0 "Le débat sur un programme d'armement nucléaire s'est terminé par la décision du gouvernement suédois de mettre fin aux efforts visant à acquérir des armes nucléaires. Il semble que la pression exercée par les pacifistes au sein du gouvernement ait eu raison. En outre, les coûts estimés d'un programme nucléaire s'avéraient trop élevés et de nombreux membres du gouvernement estimaient que ces fonds pourraient être mieux utilisés pour soutenir des programmes sociaux ou pour répondre à d'autres besoins de défense plus urgents. Même si la Suède ne poursuivra plus de programme d'armes nucléaires, les efforts visant à exploiter l'énergie nucléaire devraient se poursuivre."
 OB_54.1.d:0 "Un débat public a émergé suite à la publication d'un rapport intitulé OB-54 du général Nils Swedlund, commandant de toutes les forces suédoises. Le rapport indique que la seule façon de garantir la sécurité et l'indépendance de la Suède était l'acquisition d'armes nucléaires. Presque tous les partis politiques prennent position sur la question, avec des factions pro et anti-nucléaires se formant au sein des grands partis. Ceux qui soutiennent le rapport notent que la Suède est en première ligne des puissances nucléaires mondiales et que le fait de ne pas disposer de telles armes expose la nation à un risque extraordinaire. Les opposants craignent que les armes nucléaires ne fassent qu'attirer davantage de menaces étrangères et donner trop de pouvoir à l'armée. Quoi qu'il en soit, il semble que l'armée ait fait connaître sa position sur le sujet."
 SWE_NUCLEAR.10.d:0 "La Suède a récemment créé le Département de physique nucléaire pour étudier les questions liées au développement de l'énergie nucléaire. Cependant, il ressort clairement des récents débats politiques et des projets nationaux menés que le département pourrait également mener des recherches sur un programme d'armes nucléaires pour le pays. L'opinion publique s'élève de plus en plus contre l'acquisition de telles armes, mais l'armée continue d'insister sur le fait que ces armes sont le seul moyen de sauver la Suède. Le gouvernement pourrait profiter de cette occasion pour ne pas adopter de programme nucléaire et établir fermement que les développements récents sont favorables à un programme d'énergie nucléaire."
 SWE_Nukes.100.d:0 "La Suède a déclaré son intention de poursuivre son programme d'armes nucléaires malgré la colère croissante du public à l'égard de ce programme. Les opposants affirment que ces armes vont à l'encontre de la nature pacifiste de la Suède et renforcent considérablement l'armée. Le gouvernement note qu'il serait heureux de ne pas disposer non plus d'un tel programme ni d'une armée importante, mais la situation internationale exige que la Suède acquière la bombe. Au contraire, la dernière guerre et son impact sur l'Europe montrent qu'aucune nation ne peut faire preuve de complaisance. Les États-Unis et l'Union soviétique ont tous deux exprimé leur inquiétude face à ces récents développements."
 SWE_Nukes.200.d:0 "Le gouvernement suédois a annoncé qu'il ne poursuivrait plus de programme d'armes nucléaires et qu'il démantelait ce programme. Tous les éléments pertinents pour le développement pacifique de l'énergie nucléaire seront transférés. Il s'agit d'une victoire majeure pour les partisans de la dénucléarisation, notamment la Fédération nationale des femmes sociales-démocrates de Suède, qui a pris la tête du débat sur cette question et a sensibilisé davantage l'opinion publique au débat. Les militaires et les éléments plus conservateurs seront probablement déçus par ce résultat."
 SWE_USA_NUK.4.d:0 "Les États-Unis ont confirmé la vente et le transfert d'armes nucléaires à la Suède. Les États-Unis ont souligné que la Suède était un État de première ligne confronté à des menaces considérables pour son indépendance et sa souveraineté. Les armes fournies assureront à la Suède une dissuasion sûre et garantiront la liberté de sa population. Le gouvernement suédois a également souligné que ces armes protégeraient la population et réduiraient la menace d'un conflit ouvert. L'Union soviétique et même ses alliés ont réagi négativement à cette nouvelle, affirmant que les Américains soutenaient la prolifération des armes nucléaires au niveau international."
 SWE_ELECTIONS.10.d:0 "Le Parti social-démocrate suédois (SAP) a poursuivi son succès électoral en remportant le plus grand nombre de sièges lors des récentes élections. Il devrait former une coalition avec d'autres partis de gauche, dont la Ligue des agriculteurs. Le parti associe sa victoire à la confirmation que les Suédois adhèrent à la vision d'une nation comme « la maison du peuple » dont tous les citoyens travaillent ensemble à sa croissance. Le SAP a dominé les élections générales depuis les années 1920 et sa victoire n'a pas été un choc total, même si l'opposition a réussi à gagner quelques sièges supplémentaires."
 SWE_ELECTIONS.11.d:0 "Le Parti social-démocrate suédois (SAP) a remporté le plus grand nombre de sièges lors des dernières élections. Il devrait former une coalition avec d'autres partis de gauche, dont la Ligue centriste des agriculteurs. Le parti associe sa victoire à la confirmation que les Suédois adhèrent à la vision d'une nation comme « la maison du peuple » dont tous les citoyens travaillent ensemble à sa croissance. La victoire du SAP est l'une des nombreuses victoires remportées par le parti depuis les années 1920. Bien que la coalition semble stable, certains partenaires seraient préoccupés par certains des nouveaux programmes sociaux proposés."
 SWE_ELECTIONS.12.d:0 "Le Parti social-démocrate suédois (SAP) a remporté une victoire majeure lors des récentes élections en remportant le plus grand nombre de sièges. Il devrait former une coalition avec d'autres partis de gauche, y compris potentiellement la Ligue centriste des agriculteurs. Le parti associe sa victoire à la confirmation que les Suédois adhèrent à la vision d'une nation comme « la maison du peuple » dont tous les citoyens travaillent ensemble à sa croissance. La victoire du SAP est l'une des nombreuses victoires remportées par le parti depuis les années 1920. Les dirigeants du parti ont souligné que sa victoire montre le désir des Suédois de vivre dans la paix et l'unité, et non dans des conflits idéologiques."
 SWE_ELECTIONS.13.d:0 "Une coalition de partis de droite, dont le Parti conservateur et le Parti populaire libéral, a formé un nouveau gouvernement en Suède. Cela met fin à des décennies de domination politique du Parti social-démocrate suédois (SAP). Cette coalition est qualifiée de coalition des bourgeois. La nouvelle coalition au pouvoir n'a pas tardé à affirmer sa victoire, ce qui reflète le désir des Suédois qui souhaitent une croissance économique rapide grâce à des politiques de libre marché. La coalition promet également de renforcer l'armée et d'aligner plus étroitement la Suède sur l'Occident."
 SWE_ELECTIONS.14.d:0 "Une coalition de partis de droite, dont le Parti conservateur et le Parti populaire libéral, a formé un nouveau gouvernement en Suède. C'est un coup dur pour le Parti social-démocrate suédois (SAP), qui connaît une longue histoire de succès électoraux depuis les années 1920. Cette coalition est qualifiée de coalition des bourgeois. La nouvelle coalition au pouvoir affirme que sa victoire reflète le désir des Suédois qui souhaitent une croissance économique rapide grâce à des politiques de libre marché. La coalition promet également de renforcer l'armée et d'aligner plus étroitement la Suède sur l'Occident."
 SWE_ELECTIONS.15.d:0 "Une coalition de partis de droite, dont le Parti conservateur et le Parti populaire libéral, a formé un nouveau gouvernement en Suède. C'est un coup dur pour le Parti social-démocrate suédois (SAP), qui connaît une longue histoire de succès électoraux depuis les années 1920. Cette coalition est qualifiée de coalition des bourgeois. La nouvelle coalition au pouvoir affirme que sa victoire reflète le désir des Suédois qui souhaitent une croissance économique rapide grâce à des politiques de libre marché. La coalition promet également de renforcer l'armée et d'aligner plus étroitement la Suède sur l'Occident. Les analystes estiment que l'inquiétude suscitée par les menaces soviétiques a donné un élan majeur aux partis de droite, qui prônent tous une défense forte."
