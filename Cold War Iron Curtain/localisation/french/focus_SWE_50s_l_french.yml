 SWE_The_Forsvarsmakten_desc:0 "Notre défense est assurée par le Försvarsmakten, littéralement « la force de défense ». Elle se compose de l'armée de terre, de l'armée de l'air et de la marine, ainsi que d'une force de réserve militaire, la Home Guard."
 SWE_The_Svenska_Marinen_desc:0 "C'est la marine."
 SWE_The_Peoples_Home_Concept_desc:0 "Folkhemmet, traduit par Maison du peuple, est un concept fortement lié à la Socialdemokraterna et à l'État-providence suédois. Parfois appelé « la voie du milieu suédois », le folkhemmet était considéré comme à mi-chemin entre le capitalisme et le socialisme. La base de la vision folkhem est que la société dans son ensemble doit être comme une famille, où chacun contribue, mais où chacun prend également soin les uns des autres."
 SWE_Expand_NATO_Cooperation_desc:0 "Nous devons rechercher la neutralité dans ce monde nouveau et changeant. Officiellement, du moins. Officieusement, nous nous alignons cependant sur l'Occident et l'OTAN, en collaborant secrètement avec eux."
 SWE_Expand_Military_Funding_desc:0 "Dans ce monde, vous devez être capable de vous défendre."
 SWE_The_Hajen_Class_Submarine_desc:0 "À la fin de la Seconde Guerre mondiale, la marine suédoise a constaté que la conception des sous-marins du pays était à la traîne et devenait obsolète avec les nouveaux sous-marins, notamment les types XXI et XXIII, introduits par la Kriegsmarine à la fin de la guerre. Les alliés victorieux protégeaient jalousement les informations sous-marines qu'ils avaient obtenues, et la Suède neutre n'avait donc pas accès aux nouvelles innovations. Heureusement, à la fin de la guerre, le 8 mai 1945, le nouveau sous-marin allemand de type XXI U-3503 fut submergé dans les eaux territoriales suédoises au large de Göteborg, donnant ainsi aux Suédois l'occasion d'étudier la nouvelle technologie."
 SWE_The_Svenska_Armen_Desc:0 "L'armée suédoise est la branche des forces armées suédoises chargée de la guerre terrestre."
 SWE_Bofors_Expansion_desc:0 "Développez Bofors."
 SWE_Import_British_Centurions_desc:0 "Le Royaume-Uni a accepté de nous vendre 200 chars Centurion pour un prix modique."
 SWE_The_Volvo_L3314_desc:0 "Au début des années 1950, Volvo reçut une commande pour un nouveau véhicule utilitaire militaire destiné à l'armée suédoise. Ils développèrent le L3314, qui fut adopté par l'armée suédoise en 1959 sous le nom de Personlastterrängbil 903."
 SWE_Produce_Heavy_Water_in_Ljungaverk_desc:0 "Pendant la Seconde Guerre mondiale, Fosfatbolaget a produit de l'eau lourde dans la région pour l'Allemagne et l'Amérique. Maintenant, il pourrait le produire pour nous."
 SWE_Den_Svenska_Linjen_desc:0 "La ligne suédoise fait référence à un rapport de 1956 de l'enquête sur l'énergie atomique de 1955 sur le développement de la technologie nucléaire civile en Suède pour une longue période à venir. Les lignes directrices stipulaient que la Suède deviendrait autosuffisante dans ce domaine en investissant dans un cycle suédois complet du combustible nucléaire basé sur des réacteurs nationaux à l'uranium et à l'eau lourde, et que la majeure partie de cet investissement serait sous le contrôle de l'État dans le cadre du programme d'armes nucléaires suédois."
 SWE_Expand_Funding_for_AB_Atomenergi_desc:0 "Financement nucléaire tel que souligné par Den Svenska Linjen."
 SWE_Attract_Nordic_Refugees_desc:0 "Après avoir combattu pendant la guerre, de nombreuses personnes se retrouvent sans abri et sans emploi dans nos pays voisins. Nous pourrions tenter d'en attirer certains à venir ici."
 SWE_Combat_Communist_Influence_in_the_Labor_Unions_desc:0 "Allmänna säkerhetstjänsten, ou service général de sécurité, nous a informés de plusieurs tentatives de communistes d'influencer les syndicats. Nous devons mettre un terme à cela."
 SWE_1952_Elections_desc:0 "Élections"
