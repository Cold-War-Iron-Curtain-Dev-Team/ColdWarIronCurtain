 FIN_banking_regulations_idea:0 "Règlement sur la surveillance bancaire"
 FIN_banking_regulations_idea_desc:0 "Des taux de réserves stricts et une surveillance du crédit par la Banque de Finlande freinent les prêts spéculatifs et stabilisent les marchés financiers nationaux."
 FIN_kemira_fertilizer_push:0 "Expansion industrielle de Kemira"
 FIN_kemira_fertilizer_push_desc:0 "L'expansion à grande échelle de la production publique de produits chimiques et d'engrais améliore l'autosuffisance agricole et la production chimique industrielle."
 FIN_kansanterveyslaki_idea:0 "Système de santé publique de Kansanterveyslaki"
 FIN_kansanterveyslaki_idea_desc:0 "Un réseau municipal décentralisé de centres de santé publics garantit des soins de santé préventifs et primaires gratuits ou abordables à tous les citoyens."
 FIN_nordek_economic_ties:0 "Coopération économique nordique"
 FIN_nordek_economic_ties_desc:0 "Des partenariats commerciaux approfondis et une harmonisation des réglementations dans les pays nordiques stimulent la production manufacturière d'exportation et la solidarité économique."
 FIN_curb_emigration_idea:0 "Incitations au développement régional"
 FIN_curb_emigration_idea_desc:0 "Des investissements ciblés dans les infrastructures régionales et des incitations au logement freinent la fuite des cerveaux et retiennent la main-d'oeuvre industrielle nationale."
 FIN_digital_literacy_boom:0 "Boom de la littératie numérique"
 FIN_digital_literacy_boom_desc:0 "La prolifération rapide des micro-ordinateurs domestiques, des périodiques spécialisés et des clubs de programmation pour les jeunes a créé une génération profondément instruite sur le numérique, accélérant l'innovation technologique."
