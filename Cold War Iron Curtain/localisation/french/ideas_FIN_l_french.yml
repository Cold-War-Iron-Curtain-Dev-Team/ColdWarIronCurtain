 Valmet_Lentokoneteollisuus:0 "Valmet Lentokoneteollisuus"
 Valmet_Lentokoneteollisuus_desc:0 "L'industrie aéronautique Valmet est la partie publique finlandaise de Valmet qui fabrique et entretient des avions militaires. La désignation n'est pas tout à fait correcte car le nom utilisé a varié au fil du temps."
 sako:0 "Oy Sako Ab"
 sako_desc:0 "SAKO, Limited (finlandais : Suojeluskuntain Ase- ja Konepaja Oy, lit « Civil Guard Gun and Machining Works Ltd ») est un fabricant finlandais d'armes à feu et de munitions situé à Riihimäki, Tavastia Proper, dans le sud de la Finlande."
