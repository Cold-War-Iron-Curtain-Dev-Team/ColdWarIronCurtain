 wartsila:0 "Oy Wärtsilä Ab"
 wartsila_desc:0 "Wärtsilä est la plus grande entreprise de construction navale de Finlande."
 kansainhuolto:0 "Kansanhuoltoministeriö"
 kansainhuolto_desc:0 "La tâche du Kansanhuoltoministeriö (ministère du Service populaire) n'est pas de tout repos. Son objectif est de garantir les moyens de subsistance des populations dans les états d'urgence en contrôlant l'économie et en rationnant. Depuis sa création en 1939, le rationnement est en vigueur et concerne des produits comme le sucre et le café. Il n'est donc pas surprenant que peu de gens les aiment. Les consommateurs se plaignent des maigres sommes que leur donnent les cartes de rationnement et les producteurs se plaignent du fait qu'on leur enlève trop."
 paris_paris_treaty_FIN:0 "Traité de paix de Paris de 1947"
 paris_paris_treaty_FIN_desc:0 "L'état de guerre a pris fin en 1947 en Finlande avec le traité de paix de Paris et le départ de l'organisme de supervision allié, Liittoutuneiden valvontakomissio. Le traité déclare que l'armistice de Moscou est légitime et affirme les pertes territoriales de la Finlande. Il impose également des limites militaires, comme l'interdiction de tous les missiles, sous-marins et marines. Il limite l'armée de l'air à un maximum de 60 avions de combat et à aucun bombardier. Enfin, le traité interdit à la Finlande de posséder des armes nucléaires."
 heroin_epidemic:0 "Épidémie d'héroïne"
 heroin_epidemic_desc:0 "Depuis les années 1930, ce sont les Finlandais qui consomment le plus d'héroïne au monde. Utilisés à outrance au cours des deux guerres, de nombreux anciens combattants sont rentrés chez eux avec une grave dépendance. Même jusqu'au siège de l'ONU à New York, on se demandait comment il était possible que la Finlande - un pays de quatre millions d'habitants - puisse consommer autant d'héroïne en un an à la fin des années 40 que d'autres pays en consommaient en moyenne en un quart de siècle. En 1946, par exemple, 99 kg. D'héroïne sur ordonnance a été consommée en Finlande. La réponse, quelque peu froide, a simplement été qu'il fallait davantage d'héroïne pour des raisons de santé publique. Cependant, les mentalités changent et bientôt, cette petite nation devra faire quelque chose contre l'épidémie qui la sévit."
