l_french:
 truman_speech_category:0 "Discours du président Truman à la nation"
 truman_speech_category_desc:0 "Après la défaite du fascisme, une autre menace existe : l'expansion du communisme. Le président Truman défend les nations libres pour défendre la liberté et lutter contre l'agression communiste."
 truman_address_korean_war:0 "Aborder la guerre de Corée"
 truman_address_korean_war_desc:0 "Le dimanche 25 juin, les forces communistes ont attaqué la République de Corée. Cette attaque a montré clairement, sans aucun doute, que le mouvement communiste international est prêt à recourir à l'invasion armée pour conquérir des nations indépendantes. Un acte d'agression comme celui-ci crée un danger très réel pour la sécurité de toutes les nations libres. L'invasion communiste a été lancée en force, avec des avions, des chars et de l'artillerie. L'ampleur de l'attaque et la rapidité avec laquelle elle a été menée montrent clairement qu'elle avait été planifiée longtemps à l'avance. Cinquante-deux des 59 pays membres des Nations Unies ont apporté leur soutien à l'action entreprise par le Conseil de sécurité pour rétablir la paix en Corée. Sous le drapeau des Nations Unies, un commandement unifié a été établi pour toutes les forces des membres des Nations Unies combattant en Corée. Le général Douglas MacArthur est le commandant de cette force combinée. L'action rapide des Nations Unies pour réprimer les agressions illégales, et la réponse rapide à cette action par les peuples libres du monde entier, constitueront un jalon dans la longue quête de l'humanité pour un Etat de droit entre les nations. En outre, le fait que les forces communistes ont envahi la Corée constitue un avertissement quant à la possibilité que des actes d'agression similaires se produisent dans d'autres parties du monde. Les nations libres doivent être plus que jamais sur leurs gardes contre ce genre d'attaque sournoise."
 truman_dismiss_macarthur:0 "Annoncer le motif du licenciement de Douglas MacArthur"
 truman_dissmiss_macarthur_desc:0 "Je crois que nous devons essayer de limiter la guerre à la Corée pour ces raisons vitales : pour nous assurer que les précieuses vies de nos combattants ne soient pas gaspillées ; veiller à ce que la sécurité de notre pays et du monde libre ne soit pas inutilement compromise ; et pour empêcher une troisième guerre mondiale. Un certain nombre d'événements ont montré clairement que le général MacArthur n'était pas d'accord avec cette politique. J'ai donc jugé essentiel de relever le général MacArthur afin qu'il n'y ait aucun doute ni confusion quant au but réel de notre politique. C'est avec un profond regret personnel que je me suis vu contraint de prendre cette mesure. Le général MacArthur est l'un de nos plus grands commandants militaires. Mais la cause de la paix mondiale est bien plus importante que n'importe quel individu. Le changement de commandement en Extrême-Orient ne signifie aucun changement dans la politique des États-Unis. Nous poursuivrons le combat en Corée avec vigueur et détermination afin de mener la guerre à une conclusion rapide et fructueuse. Le nouveau commandant, le lieutenant-général Matthew Ridgway, a déjà démontré qu'il possède les grandes qualités de leadership militaire nécessaires pour cette tâche. Cette guerre peut avoir lieu si les dirigeants communistes le souhaitent. Mais cette Nation et ses alliés ne seront pas responsables de sa venue. Nous ne voulons pas élargir le conflit. Nous ferons tout notre possible pour éviter ce désastre. Et ce faisant, nous savons que nous suivons les grands principes de paix, de liberté et de justice."
 truman_against_communism:0 "Parlez contre l'agression communiste"
 truman_against_communism_desc:0 "Le monde libre doit avoir la force armée, le monde libre doit l'avoir maintenant ! Pas en réserve, pas plus tard mais maintenant ! En tant que président, je vous dis que les dangers dans d'autres parties du monde sont tout aussi grands qu'en Corée. Chaque jour, des rapports arrivent à mon bureau sur les préparatifs militaires soviétiques dans le monde. Si l'un d'entre vous peut consulter ces rapports et recevoir les mêmes informations, il renoncera à penser que le danger est écarté. Nous ne pouvons pas laisser tomber notre conscience, peu importe ce qui se passe en Corée. Nous devons avoir des hommes, des navires, des avions, des chars et des bombes prêts à faire face à toute urgence et si nous les avons, nous devrons les utiliser !"
 truman_speech_congress:0 "Parlez au Congrès"
 cancel_berlin_airlift:0 "Annuler le pont aérien de Berlin"
 cancel_berlin_airlift_desc:0 "Le pont aérien de Berlin s'est révélé coûteux et inefficace. Les Soviétiques ne céderont pas d'un pouce puisque cela ne les affectera pas autant que le gouvernement allemand légitime ! Mettons un terme à cela."
 truman_speech_congress_desc:0 "Notre objectif est la paix, non pas la paix à tout prix, mais une paix fondée sur la liberté et la justice. Cette année 1952 est une année critique pour l'effort de défense de l'ensemble du monde libre. Si nous échouons, nous risquons de perdre tous les gains que nous avons réalisés. La menace d'une guerre mondiale est toujours bien réelle. Nous avons eu un Pearl Harbor, ne nous laissons pas encore prendre au dépourvu. Notre type de gouvernement, plus que tout autre, ne peut tolérer la malhonnêteté parmi les fonctionnaires. J'ai l'intention de veiller à ce que les employés fédéraux coupables de mauvaise conduite soient punis pour cela. Allons de l'avant en faisant confiance au Dieu de paix pour atteindre l'objectif que nous cherchons."
 cancel_berlin_blockade:0 "Annuler le blocus de Berlin"
 annex_west_berlin:0 "Annexe Berlin Ouest"
 maintain_airlift:0 "Maintien du pont aérien de Berlin"
 suspend_deutsche_mark:0 "Deutsche Mark occidental récemment suspendu"
 annex_west_berlin_desc:0 "Maintenant que Berlin est une Ville libre, il serait judicieux de l'incorporer à la RDA !"
 cancel_berlin_blockade_desc:0 "Le camarade Staline a jugé sage de mettre fin au blocus de Berlin ! Nous espérons que ces efforts vers la paix et la compréhension seront considérés comme des signes de paix venant de l'Union soviétique !"
