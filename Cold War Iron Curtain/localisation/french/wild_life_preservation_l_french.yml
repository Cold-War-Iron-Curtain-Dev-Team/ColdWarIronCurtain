l_french:
 kenyan_national_parks:0 "Parcs nationaux et réserves naturelles du Kenya"
 kenyan_national_parks_desc:0 "Dès le début du XXe siècle,\nl'importance des écosystèmes diversifiés et uniques de l'Afrique est apparue \nclairement comme un élément essentiel et magnifique des \nbiosphères et de la géographie mondiales. À mesure que les nations africaines \naccèdent à l'indépendance, les peuples autochtones \ndu continent considèrent la \nfaune et la flore uniques comme des symboles nationaux dont ils sont très fiers.\n\nIl existe donc une demande croissante, tant du côté des gouvernements que des \npopulations, pour la création de \nréserves naturelles publiques et de parcs nationaux afin de protéger ces régions de ce \nmagnifique continent.\n\nLes parcs nationaux et les réserves naturelles peuvent constituer une \nsource de revenus importante."
