l_french:
#kenya
 kenyan_national_parks: "Parcs nationaux et réserves naturelles du Kenya"
 kenyan_national_parks_desc: "À partir du XXe siècle, l'importance de \nles écosystèmes diversifiés et uniques de l'Afrique sont devenus \nfacilement apparents comme des aspects significatifs et beaux \ndes biosphères et de la géographie du monde. En tant qu'Africain \nles nations accèdent à l'indépendance, les peuples autochtones \ndu continent, venez voir les animaux uniques et \nfaune, comme symboles nationaux à voir avec une grande fierté. \n\nIl existe donc une demande de la part du gouvernement et \nles gens à créer des réserves naturelles publiques et \nparcs nationaux pour protéger ces zones de cette belle \ncontinent. \n\nLes parcs nationaux et les réserves naturelles peuvent servir de \nune puissante source de revenus."
