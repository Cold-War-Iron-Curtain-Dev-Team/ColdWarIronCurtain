 ## India Infantry Equipment
 RAJ_infantry_equipment_0:0 "Lee-Enfield n°1 Mk III"
 RAJ_infantry_equipment_0_short:0 "Lee-Enfield n°1 Mk III"
 RAJ_infantry_equipment_0_desc:0 "Le SMLE Mk III* (rebaptisé Rifle No.1 Mk III* en 1926) a connu un service intensif tout au long de la Seconde Guerre mondiale, notamment sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit, et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950. L'usine d'armes légères de Lithgow a finalement cessé la production du SMLE Mk III* en 1953."

 RAJ_infantry_equipment_1:0 "Fusil, 7,62 mm 1A1"
 RAJ_infantry_equipment_1_short:0 "Ishapore 1A1"
 RAJ_infantry_equipment_1_desc:0 "Le fusil 7,62 mm 1A1, également connu sous le nom d'Ishapore 1A1, est une copie du fusil à chargement automatique L1A1. Il est produit à l'Ordnance Factory Tiruchirappalli de l'Ordnance Factories Board. Il diffère du SLR britannique en ce que la crosse en bois utilise la plaque de couche du Lee-Enfield avec un piège pour la bouteille d'huile et un passage de nettoyage."

 RAJ_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 RAJ_infantry_equipment_2_short:0 "AKM"
 RAJ_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

 RAJ_infantry_equipment_3:0 "Fusil standard INSAS"
 RAJ_infantry_equipment_3_short:0 "INSASS"
 RAJ_infantry_equipment_3_desc:0 "INSAS (abréviation de INdian Small Arms System) est une famille d'armes d'infanterie composée d'un fusil d'assaut et d'une mitrailleuse légère (LMG). Il est fabriqué par l'Ordnance Factories Board de l'Ordnance Factory Tiruchirappalli, de Small Arms Factory Kanpur et d'Ishapore Arsenal. Le fusil d'assaut INSAS était l'arme d'infanterie standard des forces armées indiennes au début des années 2000."

 RAJ_infantry_equipment_4:0 "Fusil standard 1B1 INSAS"
 RAJ_infantry_equipment_4_short:0 "1B1 INSAS"
 RAJ_infantry_equipment_4_desc:0 "Pendant la guerre de Kargil en 1999, les fusils ont été utilisés dans les hautes altitudes de l'Himalaya. Il y a eu des plaintes concernant des bourrages, des fissures du chargeur à cause du froid et le passage du fusil en mode automatique lorsqu'il était réglé pour des rafales de trois coups. Il y avait également un problème de projection d'huile dans les yeux de l'opérateur. La variante 1B1 a été introduite pour résoudre des problèmes concernant la fiabilité du fusil lors de la guerre de Kargil, mais elle a ouvert d'autres problèmes tels que des chargeurs cassés."
 
 ####Squad Weapons
 RAJ_squad_weapons_3:0 "Pistolet-mitrailleur 7,62 mm IA"
 RAJ_squad_weapons_3_short:0 "Pistolet-mitrailleur 7,62 mm IA"
 
 RAJ_squad_weapons_5:0 "Mitrailleuse légère INSAS"
 RAJ_squad_weapons_5_short:0 "INSAS LMG"
 
 #### Specialist Weapons
 RAJ_specialist_5:0 "Vidhwansak"
 RAJ_specialist_5_short:0 "Vidhwansak"
  
 #### Grenades
 RAJ_ammo_explosives_4:0 "Grenade Shivalik"
 RAJ_ammo_explosives_4_short:0 "Grenade Shivalik"

 ########## NEW RAJ/India ARMOR
 RAJ_lt_equipment_1:0 "M3A1 Stuart"
 RAJ_lt_equipment_1_short:0 "M3A1 Stuart"
 RAJ_lt_equipment_1_desc:0 "Le M3 Stuart, officiellement Light Tank, M3, était un char léger américain de la Seconde Guerre mondiale. Une version améliorée est entrée en service sous le nom de M5. Il a été fourni aux forces britanniques et à d'autres forces du Commonwealth dans le cadre d'un prêt-bail avant l'entrée en guerre des États-Unis. Par la suite, il fut utilisé par les forces américaines et alliées jusqu'à la fin de la guerre."
 RAJ_lt_equipment_2:0 "T17E1 Chien de cerf"
 RAJ_lt_equipment_2_short:0 "T17E1 Chien de cerf"
 RAJ_lt_equipment_2_desc:0 "Les premières voitures blindées équipées de canons provenaient du stock britannique. Le Staghound a été utilisé lors de l'annexion d'Hyderabad par des unités de cavalerie de véhicules blindés des forces de l'État d'Hyderabad, en particulier les lanciers de Huderabad, et plus tard lors de l'annexion de Goa, Daman et Diu en 1961."
 RAJ_lt_equipment_3:0 "PT-76"
 RAJ_lt_equipment_3_short:0 "PT-76"
 RAJ_lt_equipment_3_desc:0 "Le PT-76 est un char léger amphibie soviétique introduit au début des années 1950 et qui est rapidement devenu le char de reconnaissance standard de l'armée soviétique et des autres forces armées du Pacte de Varsovie. Il a été largement exporté vers d'autres États amis, comme l'Inde, l'Irak, la Syrie, la Corée du Nord et le Nord-Vietnam. Au total, quelque 25 pays ont utilisé le PT-76."
 RAJ_lt_equipment_4:0 "AMX-13/75"
 RAJ_lt_equipment_4_short:0 "AMX-13/75"
 RAJ_lt_equipment_4_desc:0 "L'AMX-13 est un char léger français produit de 1952 à 1987. Il a servi dans l'armée française, sous le nom de Char 13t-75 Modèle 51, et a été exporté vers plus de 25 autres pays, dont l'Inde. Nommé d'après son poids initial de 13 tonnes et doté d'un châssis robuste et fiable"
 RAJ_lt_equipment_5:0 "Char léger DRDO"
 RAJ_lt_equipment_5_short:0 "Char léger DRDO"
 RAJ_lt_equipment_5_desc:0 "Le char léger DRDO est un char léger amphibie à chenilles développé en Inde par DRDO. Il est basé sur le châssis \"Sarath\", une variante sous licence du BMP, construit par l'Ordnance Factory Medak avec une tourelle française GIAT TS-90 et un canon de 105 mm. Ce véhicule est conçu pour transporter des armes de gros calibre sans sacrifier la mobilité."
 RAJ_lt_equipment_6:0 "Véhicule blindé de reconnaissance du génie Medak d'Ordnance Factory"
 RAJ_lt_equipment_6_short:0 "AERV"
 RAJ_lt_equipment_6_desc:0 "Le véhicule blindé de reconnaissance du génie (AERV) est un véhicule de génie militaire indien développé par l'établissement de recherche et de développement de véhicules d'Ahmednagar conjointement avec l'établissement de recherche et de développement de Pune, en coordination avec le C-TEC, conformément aux QR de l'armée indienne pour permettre aux ingénieurs de combat de mener des opérations de reconnaissance. Il est fabriqué par Ordnance Factory Medak."

 RAJ_mbt_equipment_0:0 "Bourse M3"
 RAJ_mbt_equipment_0_short:0 "Bourse M3"
 RAJ_mbt_equipment_0_desc:0 "Après que les forces du Commonwealth britannique en Europe et en Méditerranée ont commencé à recevoir des M4 Sherman, environ 900 M3 Lees/Grants commandés par les Britanniques ont été expédiés à l'armée indienne. Certains d'entre eux ont été utilisés contre les troupes et les chars japonais lors de la campagne de Birmanie de la Seconde Guerre mondiale."
 RAJ_mbt_equipment_1:0 "M4A4 Sherman V"
 RAJ_mbt_equipment_1_short:0 "M4A4 Sherman V"
 RAJ_mbt_equipment_1_desc:0 "Le M4 Sherman, officiellement Medium Tank, M4, était le char moyen le plus utilisé par les États-Unis et les Alliés occidentaux pendant la Seconde Guerre mondiale. Le M4 Sherman s'est avéré fiable, relativement bon marché à produire et disponible en grand nombre. C'était également la base de plusieurs chasseurs de chars à succès, tels que le M10, le 17pdr SP Achilles et le M36. Des dizaines de milliers de dollars ont été distribués dans le cadre du programme de prêt-bail au Commonwealth britannique et à l'Union soviétique."
 RAJ_mbt_equipment_2:0 "Sherman VD-56T"
 RAJ_mbt_equipment_2_short:0 "Sherman VD-56T"
 RAJ_mbt_equipment_2_desc:0 "Après que l'Inde ait hérité de la flotte de Sherman envoyée au Raj britannique en 1947, l'armée indienne possédait des Sherman M4A3 et M4A4 qui furent ensuite améliorés avec les canons français CN 75-50 de 75 mm (FL-10) et le canon soviétique D-56T."
 RAJ_mbt_equipment_3:0 "Centurion Mk.7"
 RAJ_mbt_equipment_3_short:0 "Centurion Mk.7"
 RAJ_mbt_equipment_3_desc:0 "Le Centurion était le principal char de combat principal de l'armée britannique de l'après-Seconde Guerre mondiale. Introduit en 1945, il est largement considéré comme l'un des modèles de chars d'après-guerre les plus réussis, restant en production jusque dans les années 1960 et combattant sur les lignes de front dans les années 1980. Le châssis a également été adapté à plusieurs autres rôles. Il faisait partie des bataillons de chars indiens."
 RAJ_mbt_equipment_4:0 "HVF Vijayanta Mk.1"
 RAJ_mbt_equipment_4_short:0 "Vijayanta Mk.1"
 RAJ_mbt_equipment_4_desc:0 "Le Vijayanta (en. \"Victorious\") était un char de combat principal construit en Inde sur la base d'une conception sous licence du Vickers Mk.1. Le Vijayanta fut le premier char indigène de l'armée indienne. Le prototype fut achevé en 1963 et le char entra en service le 29 décembre 1965. Les 90 premiers véhicules furent construits par Vickers au Royaume-Uni. La production s'est poursuivie à l'usine de véhicules lourds d'Avadi jusqu'en 1983, avec 2 200 exemplaires en cours de construction."
 RAJ_mbt_equipment_5:0 "HVF T-55A Gulmohar"
 RAJ_mbt_equipment_5_short:0 "T-55A Gulmohar"
 RAJ_mbt_equipment_5_desc:0 "Version indienne améliorée du vénérable T-55 armé d'un canon principal L7 de 105 mm du char 'Vijayanta' qui possédait de véritables extracteurs de fumée. Equipés à l'origine de tubes en tôle d'acier placés sur les canons pour imiter les extracteurs de fumées lors de la guerre indo-pakistanaise de 1971 afin de les distinguer des Type 59 pakistanais."
 RAJ_mbt_equipment_6:0 "HVF T-72 Ajeya Mk.1"
 RAJ_mbt_equipment_6_short:0 "T-72 Ajeya Mk.1"
 RAJ_mbt_equipment_6_desc:0 "Version du T-72M1. Parallèlement à l'achat de divers T-72M disponibles dans le commerce auprès de l'Union soviétique, l'Inde a également lancé sa production nationale à l'usine de véhicules lourds. À la fin des années 1970, le QG de l'armée indienne avait décidé d'acquérir des remplacements de nouvelle génération pour sa flotte d'origine britannique de CCP Centurion et Vijayanta construits par les Royal Ordnance Factories, qui sont basés sur la production sous licence du Vickers MBT, et par conséquent, des évaluations sur papier concernant la puissance de feu et les caractéristiques de mobilité des deux principaux concurrents sont proposées pour une production complète dans le pays. 1 des Royal Ordnance Factories ont été menés par l'armée indienne."
 RAJ_mbt_equipment_7:0 "HVF T-72 Ajeya Mk.2"
 RAJ_mbt_equipment_7_short:0 "T-72 Ajeya Mk.2"
 RAJ_mbt_equipment_7_desc:0 "Version du T-72M1 avec ERA et bancs de 6 lance-grenades fumigènes de chaque côté. À la fin des années 1970, le QG de l'armée indienne avait décidé d'acquérir des remplacements de nouvelle génération pour sa flotte d'origine britannique de CCP Centurion et Vijayanta construits par les Royal Ordnance Factories, qui sont basés sur la production sous licence du Vickers MBT, et par conséquent, des évaluations sur papier concernant la puissance de feu et les caractéristiques de mobilité des deux principaux concurrents sont proposées pour une production complète dans le pays. 1 des Royal Ordnance Factories ont été menés par l'armée indienne."
 RAJ_mbt_equipment_8:0 "DRDO Arjun Mk.1"
 RAJ_mbt_equipment_8_short:0 "Arjun Mk.1"
 RAJ_mbt_equipment_8_desc:0 "L'Arjun est un char de combat principal de troisième génération développé par l'Organisation indienne de recherche et de développement pour la défense (DRDO), pour l'armée indienne. Le char porte le nom d'Arjun, le prince archer qui est le principal protagoniste de l'épopée indienne Mahabharata. L'Arjun est équipé d'un canon rayé principal de 120 mm avec des munitions à sabot anti-blindage stabilisées par ailerons développées localement, d'une mitrailleuse coaxiale PKT de 7,62 mm et d'une mitrailleuse NSVT de 12,7 mm. Il est propulsé par un seul moteur diesel multicarburant MTU d'une puissance de 1 400 ch et peut atteindre une vitesse maximale de 67 km/h (42 mph) et une vitesse de cross-country de 40 km/h (25 mph)."
 RAJ_mbt_equipment_9:0 "HVF T-90S Bhishma"
 RAJ_mbt_equipment_9_short:0 "T-90S Bhishma"
 RAJ_mbt_equipment_9_desc:0 "Désigné T-90S (Object 188S), équipé des nouvelles tourelles soudées et du moteur V-92S2, générant 1 000 ch (735 kW). Officiellement appelé Bhishma, il sera complété en Inde à partir de kits fournis par la Russie, puis progressivement remplacé par des pièces fabriquées dans le pays."

 RAJ_mechanized_equipment_1:0 "Véhicule blindé à roues, modèle indien"
 RAJ_mechanized_equipment_1_short:0 "ACV-IP"
 RAJ_mechanized_equipment_1_desc:0 "Armored Carrier, Wheeled, Indian Pattern (ACV-IP), connu également sous le nom de Indian Pattern Carrier ou d'autres noms similaires, était une voiture blindée produite en Inde pendant la Seconde Guerre mondiale. Il était généralement armé d'une mitrailleuse légère Bren. Ceux produits par Tata Locomotives étaient appelés « Tatanagars » d'après l'emplacement des travaux."
 RAJ_mechanized_equipment_2:0 "Bren Carrier Mk.II"
 RAJ_mechanized_equipment_2_short:0 "Bren Carrier Mk.II"
 RAJ_mechanized_equipment_2_desc:0 "L'Universal Carrier, également connu sous le nom de Bren Gun Carrier et parfois simplement de Bren Carrier de l'armement de mitrailleuses légères, est un nom commun décrivant une famille de véhicules blindés légers à chenilles construits par Vickers-Armstrongs et d'autres sociétés. "
 RAJ_mechanized_equipment_3:0 "Louis Carrier"
 RAJ_mechanized_equipment_3_short:0 "Louis Carrier"
 RAJ_mechanized_equipment_3_desc:0 "Le Loyd Carrier était l'un des nombreux petits véhicules à chenilles utilisés par les forces britanniques et du Commonwealth pendant la Seconde Guerre mondiale pour transporter du matériel et des hommes sur le champ de bataille. Aux côtés des Bren, Scout et Machine Gun Carriers, ils ont également déplacé des armes de soutien d'infanterie. "
 RAJ_mechanized_equipment_4:0 "BTR-152"
 RAJ_mechanized_equipment_4_short:0 "BTR-152"
 RAJ_mechanized_equipment_4_desc:0 "Le BTR-152 (également connu sous le nom de BTR-140) était un véhicule blindé de transport de troupes soviétique à six roues, construit sur le châssis et la transmission d'un camion utilitaire ZiS-151. Il est entré en service dans un certain nombre d'États membres du Pacte de Varsovie à partir de 1950 et a constitué le pilier des bataillons de fusiliers motorisés soviétiques jusqu'à l'avènement de la série amphibie BTR-60 dans les années 1960. Les BTR-152 étaient disponibles en plusieurs marques et ont été fabriqués en grand nombre pour l'armée soviétique et l'exportation. Les modèles de production récents utilisaient des composants automobiles du camion ZIL-157, plus fiable."
 RAJ_mechanized_equipment_5:0 "BTR-60"
 RAJ_mechanized_equipment_5_short:0 "BTR-60"
 RAJ_mechanized_equipment_5_desc:0 "Le BTR-60 est le premier véhicule d'une série de véhicules blindés de transport de troupes (APC) soviétiques à huit roues. Il a été développé à la fin des années 1950 pour remplacer le BTR-152 et a été vu en public pour la première fois en 1961"
 RAJ_mechanized_equipment_6:0 "BTR-60PB"
 RAJ_mechanized_equipment_6_short:0 "BTR-60PB"
 RAJ_mechanized_equipment_6_desc:0 "Système de visée amélioré pour mitrailleuse lourde KPVT de 14,5 mm et moteur GAZ-49B amélioré. La tourelle a été modifiée pour inclure un nouveau viseur télescopique, la mitrailleuse lourde KPVT de 14,5 mm et la mitrailleuse légère coaxiale PKT de 7,62 mm ont été déplacées vers la droite, tandis que le viseur télescopique a été monté coaxialement vers la gauche. La protection du blindage a également été améliorée."
 RAJ_mechanized_equipment_7:0 "OT-64B"
 RAJ_mechanized_equipment_7_short:0 "OT-64B"
 RAJ_mechanized_equipment_7_desc:0 "L'OT-64 était destiné à remplacer le half-track OT-810, qui était presque identique au Sd.Kfz allemand. 251 de la Seconde Guerre mondiale. Le premier prototype a été construit en 1959. En 1961, la première série d'échantillons a été construite et à partir d'octobre 1963, les véhicules ont été produits à Lublin, en Pologne, par Fabryka Samochodów Ciezarowych."
 RAJ_mechanized_equipment_8:0 "BTR-80"
 RAJ_mechanized_equipment_8_short:0 "BTR-80"
 RAJ_mechanized_equipment_8_desc:0 "Les Soviétiques ont basé le BTR-80 sur le BTR-70 APC. Il est équipé d'un seul moteur diesel V8 turbocompressé refroidi par eau de 260 ch, une amélioration par rapport aux moteurs à essence jumeaux installés dans les véhicules BTR-60 et BTR-70. La partie arrière reconfigurée de la coque accueille le nouveau moteur unique. Les Soviétiques ont retiré les chanfreins du toit du BTR-70 modifié, ont surélevé l'arrière et ont égalisé le compartiment moteur incliné vers l'arrière."
 RAJ_mechanized_equipment_9:0 "Vickers OMC Casspir Mk.3"
 RAJ_mechanized_equipment_9_short:0 "Casspir Mk.3"
 RAJ_mechanized_equipment_9_desc:0 "Le Casspir est un véhicule protégé contre les embuscades et résistant aux mines, utilisé en Afrique du Sud depuis les années 1980. Il s'agit d'un véhicule à quatre roues motrices, utilisé pour le transport de troupes. Il peut accueillir un équipage de deux personnes, plus 12 soldats supplémentaires et l'équipement associé."
 RAJ_mechanized_equipment_10:0 "Tata Crécerelle"
 RAJ_mechanized_equipment_10_short:0 "Crécerelle"
 RAJ_mechanized_equipment_10_desc:0 "Le TATA Kestrel est un véhicule blindé de transport de troupes moderne développé par Tata Motors et l'Organisation de recherche et de développement pour la défense (DRDO). Il est conçu et fabriqué à la manière de diverses conceptions occidentales d'APC. Il a été développé dans le but de remplacer les anciens BMP et APC de l'ère soviétique en service dans l'armée indienne."

 RAJ_mechanized_heavy_equipment_3_short:0 "BTR-50P"
 RAJ_mechanized_heavy_equipment_3:0 "BTR-50P"
 RAJ_mechanized_heavy_equipment_3_desc:0 "Le BTR-50 est un transport de troupes blindé amphibie soviétique basé sur le char léger PT-76. Le BTR-50 est à chenilles, contrairement à la plupart des modèles de la série BTR, qui sont à roues."
 RAJ_mechanized_heavy_equipment_4:0 "BMP-1"
 RAJ_mechanized_heavy_equipment_4_short:0 "BMP-1"
 RAJ_mechanized_heavy_equipment_4_desc:0 "Le BMP-1 est un véhicule de combat d'infanterie amphibie soviétique à chenilles. Le BMP-1 fut le premier véhicule de combat d'infanterie (IFV) produit en série par l'Union soviétique. Il a été appelé M-1967, BMP et BMP-76PB par l'OTAN avant que sa désignation correcte ne soit connue."
 RAJ_mechanized_heavy_equipment_5:0 "BMP-1P"
 RAJ_mechanized_heavy_equipment_5_short:0 "BMP-1P"
 RAJ_mechanized_heavy_equipment_5_desc:0 "Plusieurs équipes techniques soviétiques furent envoyées en Syrie au lendemain de la guerre pour recueillir des informations. Ces leçons, combinées aux observations des développements des AFV occidentaux, ont abouti à un programme de remplacement du BMP d'origine en 1974. Le premier produit de ce programme était la mise à niveau du BMP-1P, qui était conçue comme un pis-aller pour résoudre les problèmes les plus graves de la conception existante."
 RAJ_mechanized_heavy_equipment_6:0 "BMP-2 "
 RAJ_mechanized_heavy_equipment_6_short:0 "BMP-2"
 RAJ_mechanized_heavy_equipment_6_desc:0 "Le BMP-2 est un véhicule de combat d'infanterie amphibie de deuxième génération introduit dans les années 1980 en Union soviétique, faisant suite au BMP-1 des années 1960."
 RAJ_mechanized_heavy_equipment_7:0 "DRDO Abhay ICV"
 RAJ_mechanized_heavy_equipment_7_short:0 "Abhay ICV"
 RAJ_mechanized_heavy_equipment_7_desc:0 "Abhay (sanskrit, « Fearless ») est un véhicule de combat d'infanterie (ICV) développé en Inde par l'Organisation de recherche et de développement pour la défense (DRDO). Abhay est développé comme démonstrateur technologique pour remplacer les BMP-2 de l'armée indienne. À l'heure actuelle, divers systèmes de ce véhicule sont à un stade avancé de développement."
 RAJ_mechanized_heavy_equipment_8:0 "Usine de munitions Medak BMP-II Sarath"
 RAJ_mechanized_heavy_equipment_8_short:0 "BMP-II Sarath"
 RAJ_mechanized_heavy_equipment_8_desc:0 "BMP-2 \"Sarath (Chariot de la Victoire), également connu sous le nom de BMP-II - variante du BMP-2 produite sous licence indienne, construite par Ordnance Factory Medak. Le premier véhicule, assemblé à partir de composants fournis par KBP, était prêt en 1987. En 1999, environ 90 % du véhicule complet et de ses systèmes associés étaient produits en Inde. On estimait qu'en 2007, 1 250 véhicules avaient été construits. En février 2020, environ 2 500 Saraths ont été réalisés."
 
 RAJ_motorized_equipment_1:0 "Camion 4x4 Dodge T-234 \"Birmanie\""
 RAJ_motorized_equipment_1_short:0 "T-234 \"Birmanie\" 4x4"
 RAJ_motorized_equipment_1_desc:0 "Les camions de modèle militaire canadien (CMP) étaient des gammes mutuellement cohérentes de camions militaires, fabriqués en grand nombre, dans plusieurs classes et de nombreuses versions, par les succursales canadiennes des « trois grands » constructeurs automobiles américains pendant la Seconde Guerre mondiale, conformes aux spécifications de l'armée britannique, principalement destinés à être utilisés dans les armées des alliés du Commonwealth britannique, mais servant également dans d'autres unités de l'Empire britannique. "
 RAJ_motorized_equipment_2:0 "Nissan 1 tonne 4W73 4x4"
 RAJ_motorized_equipment_2_short:0"4W73 1-t 4x4"
 RAJ_motorized_equipment_2_desc:0 "Le Nissan 4W73, également connu sous le nom de Nissan 1 tonne, a été largement inspiré du camion 4x4 Dodge M37, introduit en 1951 et qui s'est avéré être l'un des véhicules militaires les plus performants utilisés par les forces armées des États-Unis."
 RAJ_motorized_equipment_3:0 "VFJ Shaktiman 4X4"
 RAJ_motorized_equipment_3_short:0 "Shaktiman 4X4"
 RAJ_motorized_equipment_3_desc:0 "Le Shaktiman est une version du MAN 415 construite sous licence. Les camions Shaktiman étaient les camions de capacité moyenne les plus utilisés par les forces armées indiennes. Ils ont été fabriqués entre 1959 et 1996 par la Vehicle Factory Jabalpur (VFJ) de l'Indian Ordnance Factories Board."
 RAJ_motorized_equipment_4:0 "Tata 1210 SD 4x4"
 RAJ_motorized_equipment_4_short:0 "Tata 1210 SD 4x4"
 RAJ_motorized_equipment_4_desc:0 "Le Tata 1210 SD est un camion militaire à 4 roues motrices construit par Tata. Il a la capacité de transporter une charge utile de 4 tonnes à travers le pays ou sur les routes."
 RAJ_motorized_equipment_5:0 "Tata LPTA 713 Transporteur de troupes 4x4"
 RAJ_motorized_equipment_5_short:0 "Ashok Leyland Étalon 4x4"
 RAJ_motorized_equipment_5_desc:0 "La gamme de camions Stallion est produite par Vehicle Factory Jabalpur (VFJ) de l'Ordnance Factory Board pour les forces armées indiennes. L'étalon constitue l'épine dorsale logistique des forces armées indiennes, avec plus de 60 000 étalons utilisés par l'armée indienne et plusieurs milliers sont utilisés par l'ITBP. Les étalons dans un large éventail de configurations étaient en service actif dans l'armée indienne à partir de 2010. Les étalons ont remplacé les anciens chevaux de trait des forces armées, les camions Shaktiman, qui sont désormais progressivement supprimés."

 ########### Artillery
 RAJ_auto_cannon_equipment_1:0 "QF 40 mm Mk. 1"
 RAJ_auto_cannon_equipment_1_short:0 "QF 40 mm Mk. 1"
