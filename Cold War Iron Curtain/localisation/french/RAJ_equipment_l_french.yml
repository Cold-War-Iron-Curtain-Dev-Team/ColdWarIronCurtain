 RAJ_cv_jet_CAS_equipment_10_short:0 "Tejas Mark 1 Marine"
 RAJ_cv_jet_CAS_equipment_10_desc:0 "Variante navale basée sur HAL Tejas Mark 1 propulsée par un moteur F404."