 RAJ_auto_cannon_equipment_2_short:0 "L/70 Bofors"
 RAJ_auto_cannon_equipment_3:0 "Pistolet à tir rapide Bofors 60L/70G"
 RAJ_auto_cannon_equipment_3_short:0 "Bofors 60L/70G"
 RAJ_auto_cannon_equipment_4:0 "Pistolet à tir rapide Bofors 60L/70G avec radar HSA L4/5"
 RAJ_auto_cannon_equipment_4_short:0 "60L/70G avec L4/5"
 RAJ_auto_cannon_equipment_5:0 "CIWS de Sudarshan"
 RAJ_auto_cannon_equipment_5_short:0 "CIWS de Sudarshan"
 
 RAJ_spaag_equipment_1:0 "Morris-Commercial C9/B Bofors automoteurs de 40 mm"
 RAJ_spaag_equipment_1_short:0 "Morris C9/B Bofors automoteurs de 40 mm"
 RAJ_spaag_equipment_1_desc:0 "Le canon Bofors de 40 mm, souvent appelé simplement canon Bofors, est un canon automatique anti-aérien conçu dans les années 1930 par le fabricant d'armes suédois AB Bofors. C'était l'un des systèmes anti-aériens de poids moyen les plus populaires pendant la Seconde Guerre mondiale, utilisé par la plupart des Alliés occidentaux ainsi que par certains systèmes capturés utilisés par les puissances de l'Axe. Un petit nombre de ces armes sont toujours en service à ce jour et ont été utilisées jusqu'à la guerre du Golfe Persique."
 #RAJ_spaag_equipment_2:0 ""
 #RAJ_spaag_equipment_2_short:0 ""
 #RAJ_spaag_equipment_2_desc:0 ""
 RAJ_spaag_equipment_3:0 "ZSU-23-4 Chilka"
 RAJ_spaag_equipment_3_short:0 "ZSU-23-4 Chilka"
 RAJ_spaag_equipment_3_desc:0 "Le SPAAG ZSU-23-4 \"Shilka\" guidé par radar, avec ses quatre canons automatiques de 23 mm (0,90\"), était un SPAAG révolutionnaire, se révélant être une arme extrêmement efficace contre les avions et hélicoptères d'attaque ennemis dans toutes les conditions météorologiques et de luminosité. Le ZSU-23-4 a une densité, une cadence et une précision de tir très élevées, ainsi que la capacité pour chacun des quatre canons automatiques de tirer son propre type de projectile à partir de ceintures séparées. Bien qu'il soit techniquement possible que chaque canon tire un type de munition différent, il y en avait deux types couramment utilisés à la fin des années 1970, l'OFZT à fragmentation incendiaire et le traceur perforant BZT, qui devaient être chargés dans un rapport de 3 : 1 : trois OFZT, puis un BZT, tous les 10 obus BZT équipés de ce que l'on appelle un « dissolvant de cuivre » et marqués. Il était fortement déconseillé aux opérateurs de tirer avec un seul canon."
 RAJ_spaag_equipment_4:0 "ZSU-23-4M Shilka"
 RAJ_spaag_equipment_4_short:0 "ZSU-23-4M Shilka"
 RAJ_spaag_equipment_4_desc:0 "Le SPAAG ZSU-23-4 \"Shilka\" guidé par radar, avec ses quatre canons automatiques de 23 mm (0,90\"), était un SPAAG révolutionnaire, se révélant être une arme extrêmement efficace contre les avions et hélicoptères d'attaque ennemis dans toutes les conditions météorologiques et de luminosité. Le ZSU-23-4 a une densité, une cadence et une précision de tir très élevées, ainsi que la capacité pour chacun des quatre canons automatiques de tirer son propre type de projectile à partir de ceintures séparées. Bien qu'il soit techniquement possible que chaque canon tire un type de munition différent, il y en avait deux types couramment utilisés à la fin des années 1970, l'OFZT à fragmentation incendiaire et le traceur perforant BZT, qui devaient être chargés dans un rapport de 3 : 1 : trois OFZT, puis un BZT, tous les 10 obus BZT équipés de ce que l'on appelle un « dissolvant de cuivre » et marqués. Il était fortement déconseillé aux opérateurs de tirer avec un seul canon."
 RAJ_spaag_equipment_5:0 "2K22M Toungouska"
 RAJ_spaag_equipment_5_short:0 "2K22M Toungouska"
 RAJ_spaag_equipment_5_desc:0 "Le 2K22M Tunguska est une arme antiaérienne automotrice à chenilles russe armée d'un canon sol-air et d'un système de missiles. Il est conçu pour assurer une protection de jour et de nuit aux régiments d'infanterie et de chars contre les avions volant à basse altitude, les hélicoptères et les missiles de croisière dans toutes les conditions météorologiques. Son nom de rapport OTAN est SA-19 « Grison »."
 
 RAJ_artillery_equipment_1:0 "Pistolet BL 5,5 pouces"
 RAJ_artillery_equipment_1_short:0 "Pistolet BL 5,5 pouces"
 RAJ_artillery_equipment_2:0 "Canon BL 5,5 pouces Mk.2"
 RAJ_artillery_equipment_2_short:0 "Canon BL 5,5 pouces Mk.2"

 RAJ_light_artillery_equipment_1:0 "Ordnance QF 18 livres Mk.II"
 RAJ_light_artillery_equipment_1_short:0 "QF 18 livres Mk.II"
 RAJ_light_artillery_equipment_1_desc:0 "L'Ordnance QF 18 livres, ou simplement canon de 18 livres, était le canon de campagne standard de l'Empire britannique de la Première Guerre mondiale. Il constitua l'épine dorsale de la Royal Field Artillery pendant la guerre et fut produit en grand nombre. Il fut utilisé par les forces britanniques sur tous les principaux théâtres d'opérations, ainsi que par les troupes britanniques en Russie en 1919."
 RAJ_light_artillery_equipment_2:0 "Ordnance QF 25 livres Mk.IV"
 RAJ_light_artillery_equipment_2_short:0 "QF 25 livres Mk.IV"
 RAJ_light_artillery_equipment_3:0 "canon de campagne indien de 105 mm Mk.1"
 RAJ_light_artillery_equipment_3_short:0 "canon de campagne indien de 105 mm Mk.1"
 RAJ_light_artillery_equipment_3_desc:0 "Le canon de campagne indien de 105 mm a été conçu par l'établissement de recherche et de développement de l'armement, ou ARDE, en 1972. Il s'agit d'une variante remorquée de l'obusier britannique L13 de 105 mm monté sur le FV433 Abbot."
 RAJ_light_artillery_equipment_4:0 "canon de campagne indien de 105 mm Mk.2"
 RAJ_light_artillery_equipment_4_short:0 "canon de campagne indien de 105 mm Mk.2"
 RAJ_light_artillery_equipment_4_desc:0 "Le canon de campagne indien de 105 mm a été conçu par l'établissement de recherche et de développement de l'armement, ou ARDE, en 1972. Il s'agit d'une variante remorquée de l'obusier britannique L13 de 105 mm monté sur le FV433 Abbot."
 RAJ_light_artillery_equipment_5:0 "canon de campagne indien de 105 mm Mk.3"
 RAJ_light_artillery_equipment_5_short:0 "canon de campagne indien de 105 mm Mk.3"
 RAJ_light_artillery_equipment_5_desc:0 "Le canon de campagne indien de 105 mm a été conçu par l'établissement de recherche et de développement de l'armement, ou ARDE, en 1972. Il s'agit d'une variante remorquée de l'obusier britannique L13 de 105 mm monté sur le FV433 Abbot."

 RAJ_light_sp_artillery_equipment_1:0 "25pdr SP, suivi, Sexton"
 RAJ_light_sp_artillery_equipment_1_short:0 "Sexton"
 RAJ_light_sp_artillery_equipment_2:0 "FV433 Abbé"
 RAJ_light_sp_artillery_equipment_2_short:0 "FV433 Abbé"
 RAJ_light_sp_artillery_equipment_3:0 "FV433 Abbé Mk.2"
 RAJ_light_sp_artillery_equipment_3_short:0 "FV433 Abbé Mk.2"
 RAJ_light_sp_artillery_equipment_4:0 "Véhicule à chenilles à mortier porteur BMP-2"
 RAJ_light_sp_artillery_equipment_4_short:0 "Véhicule à chenilles à mortier porteur BMP-2"
 RAJ_light_sp_artillery_equipment_4_desc:0 "Cette version sans tourelle dispose d'un mortier de 81 mm monté dans le compartiment des troupes modifié. Le mortier est tiré à travers une ouverture dans le toit de la coque dotée de deux portes battantes. Il a un maximum. Portée de 5 000 m et une cadence de tir normale de 6 à 8 coups/min. Il existe également une version longue portée du mortier."
 RAJ_light_sp_artillery_equipment_5:0 "Tata LPTA-713 avec pistolet ultra léger Garuda 105 mm"
 RAJ_light_sp_artillery_equipment_5_short:0 "Tata LPTA-71 avec Garuda 105 mm"
 RAJ_light_sp_artillery_equipment_5_desc:0 "Le canon léger Kalyani Garuda 105 basé sur le Mandus Hawkeye. Le véhicule et le canon sont de OFB, seul le système de recul est de Kalyani. Il n'est pas encore introduit dans les formations montagneuses. Ils ont été bien testés et, étant montés sur des camionnettes, ils sont parfaits pour le tir et le scooter, ne laissant pas le temps aux tirs adverses de se concentrer."

 RAJ_artillery_equipment_1_desc:0 "En janvier 1939, une spécification fut publiée pour un canon destiné à remplacer les obusiers de 6 pouces et 26 cwt utilisés avec la plupart des batteries moyennes. Les premières unités furent équipées au Royaume-Uni à l'été 1941 et en Afrique du Nord un an plus tard, 20 canons équipèrent les batteries britanniques et françaises libres à El Alamein. Par la suite, il équipera également des régiments canadiens, australiens, sud-africains, polonais et indiens, et après la guerre, il sera également utilisé par la Nouvelle-Zélande. Durant la Seconde Guerre mondiale, l'organisation normale était un régiment de 16 canons organisé en deux batteries. Le 5.5 fut maintenu en service après la guerre. Il a été utilisé par la Royal Artillery lors d'opérations en Corée, en Arabie du Sud et à Bornéo. Il a probablement été utilisé par l'armée indienne dans les guerres contre le Pakistan, et a été utilisé par l'armée pakistanaise contre l'Inde dans les montagnes du Cachemire pendant la guerre de Kargil en 1999."
 RAJ_artillery_equipment_2_desc:0 "Le M-46 a été développé à partir du canon naval M-36 de 130 mm utilisé sur les navires et pour la défense côtière. C'est un véritable canon, incapable de tirer bien au-dessus de 45° et possédant un canon long et une seule charge propulsive. En revanche, la plupart des canons de campagne occidentaux de cette période avaient une double capacité de tir à angle élevé et faible, un obusier. Il est doté d'un canon de calibre 39 avec une brèche à bloc coulissant horizontal à mâchoire liée et un frein de bouche « pepperpot ». Ce dernier n'est pas particulièrement efficace, mais des rapports subjectifs suggèrent qu'il est assez efficace pour réduire les éclairs de bouche. Le système de recul hydropneumatique comprend un tampon sous le canon et un récupérateur au dessus du canon. Le canon long permet une charge propulsive substantielle en fournissant plus de longueur pour obtenir un espace d'accélération « entièrement brûlé » et donc du projectile et ainsi atteindre sa vitesse initiale de 930 m/s."
 RAJ_artillery_equipment_3:0 "D-30A"
 RAJ_artillery_equipment_3_short:0 "D-30A"
 RAJ_artillery_equipment_3_desc:0 "L'obusier de 122 mm D-30 (indice GRAU 2A18) est un obusier soviétique entré en service pour la première fois en 1960. Il s'agit d'une pièce robuste qui se concentre sur les caractéristiques essentielles d'un canon de campagne remorqué adapté à toutes les conditions. Le D-30 a une portée maximale de 15,4 kilomètres, soit plus de 21 km avec les munitions RAP. Grâce à son superbe support à trois pieds, le D-30 peut être rapidement traversé à 360 degrés. Bien qu'il ne soit plus fabriqué dans les pays de l'ex-Union soviétique, le D-30 est toujours fabriqué à l'échelle internationale et est en service dans les forces armées de plus de 60 pays."
 RAJ_artillery_equipment_4:0 "Obusier Fälthaubits 77 de 155 mm"
 RAJ_artillery_equipment_4_short:0 "Obusier FH-77 de 155 mm"
 RAJ_artillery_equipment_4_desc:0 "Le Fälthaubits 77 (« Field Howitzer 77 » suédois) ou FH77 est un obusier suédois de 155 mm. Il a été développé et fabriqué par Bofors. Il était disponible en deux versions, l'original (parfois appelé Haubits 77 A) avec un canon de calibre 38 et un mécanisme à bloc coulissant, et la dernière version d'exportation FH77 B avec un canon de calibre 39 et une culasse à vis interrompue. "
 RAJ_artillery_equipment_5:0 "Obusier M777 de 155 mm"
 RAJ_artillery_equipment_5_short:0 "Obusier M777 de 155 mm"
 RAJ_artillery_equipment_5_desc:0 "L'obusier M777 est une pièce d'artillerie remorquée de 155 mm. Il a succédé à l'obusier M198 dans le Corps des Marines des États-Unis et l'Armée américaine en 2005. Le M777 est également utilisé par les forces terrestres d'Australie, du Canada, de l'Inde et de l'Arabie saoudite. Il a fait ses débuts au combat lors de la guerre en Afghanistan. Le M777 est fabriqué par la division Global Combat Systems de BAE Systems."

 RAJ_sp_artillery_equipment_3:0 "Catapulte M-46"
 RAJ_sp_artillery_equipment_3_short:0 "Catapulte M-46"
 RAJ_sp_artillery_equipment_3_desc:0 "La Catapulte M-46 est un canon automoteur développé en Inde par l'établissement de recherche et développement de véhicules de combat de l'Organisation de recherche et développement pour la défense. Il est basé sur la conversion de la coque vieillissante du char britannique/indien Vijayanta montée avec un canon de campagne russe M-46 de 130 mm."
 RAJ_sp_artillery_equipment_4:0 "Obusier automoteur Tata 155 T5-52"
 RAJ_sp_artillery_equipment_4_short:0 "155 mm T5-52 SPH"
 RAJ_sp_artillery_equipment_4_desc:0 "Qualifié d'indigène à 55 % par son contenu, cet obusier motorisé a été développé conjointement par TATA Power SED et la société sud-africaine DENEL Land Systems, société inscrite sur la liste noire du gouvernement indien pour corruption. Essentiellement, une version repensée de l'obusier motorisé T5-52 de DENEL (qui a été présenté lors de DEFEXPO 2002 avec l'ATMOS de SOLTAM Systems, les deux utilisant à l'époque un camion 8x8 personnalisé provient de TATA Motors."
 RAJ_sp_artillery_equipment_5:0 "K9 Vajra-T"
 RAJ_sp_artillery_equipment_5_short:0 "K9 Vajra-T"
 RAJ_sp_artillery_equipment_5_desc:0 "Hanwha Techwin s'est associé au conglomérat indien Larsen et Toubro Limited pour fournir 100 canons K9-T (connus en Inde sous le nom de K-9 Vajra) pour le concours d'obusiers de l'armée indienne. En septembre 2015, Larsen et Toubro sont devenus finalistes pour un contrat de 800 millions de dollars américains visant à fournir 100 obusiers automoteurs à l'armée indienne. Le véhicule est le K9 VAJRA-T, une variante du K9 spécialement conçue pour fonctionner dans les zones désertiques. En janvier 2020, plus de la moitié des canons K-9 Vajra avaient déjà été livrés à l'armée indienne plus tôt que prévu."
 
 RAJ_direct_fire_gun_equipment_1:0 "Ordnance QF 17 livres"
 RAJ_direct_fire_gun_equipment_1_short:0 "QF 17 livres"
 RAJ_direct_fire_gun_equipment_2:0 "canon antichar de 85 mm D-48"
 RAJ_direct_fire_gun_equipment_2_short:0 "85 mm D-48"
 RAJ_direct_fire_gun_equipment_2_desc:0 "Le canon antichar de 85 mm D-48 était un canon antichar soviétique de calibre 85 mm utilisé après la Seconde Guerre mondiale. Il a été conçu pour remplacer le canon de campagne de 100 mm M1944 (BS-3). Les caractéristiques distinctives du D-48 incluent un canon très long et un frein de bouche en poivrière. Le D-48 fut lui-même remplacé dans les années 1960 par le canon antichar T-12."
 RAJ_direct_fire_gun_equipment_3:0 "Fusil sans recul M40"
 RAJ_direct_fire_gun_equipment_3_short:0 "Fusil sans recul M40"

 RAJ_motorized_rocket_equipment_1:0 "Matelas terrestre"
 RAJ_motorized_rocket_equipment_1_short:0 "Matelas terrestre"
 RAJ_motorized_rocket_equipment_1_desc:0 ""
 #RAJ_motorized_rocket_equipment_2:0 ""
 #RAJ_motorized_rocket_equipment_2_short:0 ""
 #RAJ_motorized_rocket_equipment_2_desc:0 ""
 RAJ_motorized_rocket_equipment_3:0 "Diplômé BM-21"
 RAJ_motorized_rocket_equipment_3_short:0 "Diplômé BM-21"
 RAJ_motorized_rocket_equipment_3_desc:0 "Le BM-21 \"Grad\" est un lance-roquettes multiple de 122 mm monté sur camion soviétique. Le système d'armes et la fusée M-21OF ont été développés pour la première fois au début des années 1960 et ont été utilisés pour la première fois au combat en mars 1969, lors du conflit frontalier sino-soviétique. BM signifie boyevaya mashina, et le surnom grad signifie « grêle ». Le système complet comprenant le lanceur BM-21 et la fusée M-21OF est désigné sous le nom de système de fusée de campagne M-21. Le système complet est plus communément connu sous le nom de système de lance-roquettes multiples Grad. Dans les pays de l'OTAN, le système (soit le système complet, soit le lanceur uniquement) était initialement connu sous le nom de M1964. Plusieurs autres pays ont copié le Grad ou ont développé des systèmes similaires."
 RAJ_motorized_rocket_equipment_4:0 "Lance-roquettes multi-canons Pinaka"
 RAJ_motorized_rocket_equipment_4_short:0 "Lance-roquettes Pinaka"
 RAJ_motorized_rocket_equipment_4_desc:0 "L'armée indienne exploite les lanceurs russes BM-21 « Grad ». En 1981, en réponse au besoin de l'armée indienne d'un système d'artillerie à longue portée, le ministère indien de la Défense a approuvé deux projets de renforcement de la confiance. En juillet 1983, l'armée a formulé ses exigences qualitatives d'état-major général (GSQR) pour le système, avec l'intronisation prévue d'un régiment par an à partir de 1994. Ce système finirait par remplacer les Grads. Le développement a commencé en décembre 1986, avec un budget approuvé de 26,47 crores ₹. Le développement devait être achevé en décembre 1992. L'établissement de recherche et de développement d'armement, un laboratoire DRDO basé à Pune, a dirigé le développement du système."
 RAJ_motorized_rocket_equipment_5:0 "BM-30 Smerch"
 RAJ_motorized_rocket_equipment_5_short:0 "BM-30 Smerch"
 RAJ_motorized_rocket_equipment_5_desc:0 " 42 Systèmes 9A52-2T en service. Les lanceurs des systèmes de lancement de roquettes multiples (MRL) 9K58 Smerch de 300 mm de l'armée indienne seront montés sur 81 véhicules à haute mobilité 10 × 10 de conception indienne fournis par le fabricant de défense indien du secteur privé Ashok Leyland. Le véhicule, équipé d'une grue hydraulique pour recharger le système, complétera et remplacera à terme les lanceurs 9A52-2 basés sur le châssis du camion MAZ-543M 8×8. L'IA exploite plusieurs variantes de lanceurs pour le système Smerch, dont environ 62 batteries 9K58 Smerch, chacune dotée de six lanceurs. Depuis 2012, l'Ordnance Factory Board, une entreprise publique indienne, a produit plusieurs variantes de fusées pour le système, ayant une portée de frappe de 70 ou 90 km."
 
 ########### Rocketry
 RAJ_atgm_equipment_1:0 "9M17 Fleyta"
 RAJ_atgm_equipment_1_short:0 "9M17 Fleyta"
 RAJ_atgm_equipment_1_desc:0 "Le missile a été développé par le bureau d'études Nudelman OKB-16. Il a été développé à peu près en même temps que l'AT-1 Snapper en tant qu'ATGM lourd destiné à être utilisé à la fois sur des lanceurs au sol et sur des hélicoptères. Il résolvait certains des problèmes de l'AT-1 ; il était beaucoup plus rapide et avait une portée légèrement plus longue. Ces améliorations ont été obtenues en envoyant des commandes via une liaison radio au lieu d'un fil de guidage traînant, ce qui a permis au missile de se déplacer plus rapidement. Cependant, cela le rendait vulnérable au brouillage. Le système de missile a été présenté au Premier ministre soviétique Nikita Khrouchtchev en septembre 1964 et accepté pour le service peu de temps après."
 RAJ_atgm_equipment_2:0 "9M113 Konkurs"
 RAJ_atgm_equipment_2_short:0 "9M113 Konkurs"
 RAJ_atgm_equipment_2_desc:0 "Le missile est conçu pour être tiré depuis des véhicules, bien qu'il puisse également être tiré depuis les derniers modèles de lanceurs 9M111. Il fait partie intégrante des véhicules BMP-2, BMD-2 et BRDM-2. Le missile est stocké et transporté dans un conteneur/tube de lancement en fibre de verre. Le système utilise un générateur de gaz pour pousser le missile hors du tube de lancement. Le gaz sort également par l'arrière du tube de lancement de la même manière qu'un fusil sans recul. Le missile quitte le tube de lancement à une vitesse de 80 mètres par seconde et est rapidement accéléré jusqu'à 200 mètres par seconde grâce à son moteur à combustible solide. Cette vitesse initiale élevée réduit la zone morte du missile, puisqu'il peut être lancé directement sur la cible, plutôt que selon un arc ascendant. En vol, le missile tourne entre cinq et sept tours par seconde. Le lanceur suit la position d'une ampoule infrarouge à incandescence située à l'arrière du missile par rapport à la cible et transmet les commandes appropriées au missile via un mince fil qui traîne derrière le missile. Le système dispose d'une alarme qui s'active lorsqu'il détecte un brouillage provenant d'un système comme Shtora. L'opérateur peut alors prendre le contrôle manuel, réduisant le missile en MCLOS. Le système de guidage SACLOS présente de nombreux avantages par rapport au MCLOS. La précision du système est citée dans certaines sources comme étant de 90 %, bien que ses performances soient probablement comparables à celles du BGM-71 TOW ou des versions ultérieures SACLOS du 9K11 Malyutka."
 RAJ_atgm_equipment_3:0 "9M120 Ataka"
 RAJ_atgm_equipment_3_short:0 "9M120 Ataka"
 RAJ_atgm_equipment_3_desc:0 "Le 9M120 Ataka est un missile guidé antichar (ATGM) originaire de l'Union soviétique. Le nom OTAN du missile 9M120 est AT-9 Spiral-2. Il s'agit de la prochaine génération majeure de la famille 9K114 Shturm (AT-6 Spiral). Le missile est doté d'un guidage par radiocommande et est également un Beam Riding SACLOS. La variante principale de ce missile a été conçue pour vaincre les chars dotés d'un blindage composite et d'un blindage réactif explosif. Le système 9M120 Ataka est souvent confondu avec le système 9K121 Vikhr, bien qu'il s'agisse de systèmes d'armes différents développés par différentes sociétés. Le premier a été conçu par le bureau d'études en construction mécanique KBM et fabriqué par l'usine de Degtyarev. Selon l'Institut international de recherche sur la paix de Stockholm, la Russie a exporté l'Ataka ATGM vers l'Iran, le Kazakhstan et la Slovénie."
 RAJ_atgm_equipment_4:0 "9M133 Kornet"
 RAJ_atgm_equipment_4_short:0 "9M133 Kornet"
 RAJ_atgm_equipment_4_desc:0 "Le 9M133 Kornet est un missile guidé antichar (ATGM) portable russe moderne destiné à être utilisé contre les chars de combat principaux. Il a été mis en service pour la première fois dans l'armée russe en 1998. Le Kornet fait partie des ATGM russes les plus performants. Il n'est pas destiné à remplacer complètement les systèmes précédents, en raison de son coût élevé. Le Kornet est disponible en variantes avec des ogives thermobariques destinées à être utilisées contre des cibles souples. Il a ensuite été développé pour devenir le 9M133 Kornet-EM, doté d'une portée accrue, d'une capacité de tir et d'oubli et d'une ogive améliorée. Le Kornet a été largement exporté et est produit sous licence dans plusieurs pays. Il a été utilisé pour la première fois au combat en 2003 et a depuis été utilisé dans de nombreux conflits."
 RAJ_atgm_equipment_5:0 "Amogha-III"
 RAJ_atgm_equipment_5_short:0 "Amogha-III"
 RAJ_atgm_equipment_5_desc:0 "Le MPATGM est un missile cylindrique long et léger doté d'un groupe de quatre ailerons autour de sa section médiane. Il est équipé d'une ogive antichar hautement explosive (HEAT). Le missile a une longueur d'environ 1 300 mm et un diamètre d'environ 120 mm avec un tube de lancement en aluminium et fibre de carbone et un trépied pliable pour gagner du poids. Il pèse 14,5 kg, avec son unité de lancement de commande (CLU) pesant 14,25 kg qui combine un désignateur laser avec un viseur numérique tout temps. Sa portée est d'environ 2,5 km. Le MPATGM est équipé d'un capteur infrarouge d'imagerie avancé (IIR) et d'une avionique intégrée. Le missile a une capacité d'attaque maximale. Il partagerait de nombreuses similitudes avec des systèmes tels que FGM-148 Javelin et Spike (ATGM)."
 
 RAJ_atgm_carrier_equipment_1:0 "Land Rover avec MILAN"
 RAJ_atgm_carrier_equipment_1_short:0 "Land Rover avec MILAN"
 RAJ_atgm_carrier_equipment_2:0 "9P148 Konkurs"
 RAJ_atgm_carrier_equipment_2_short:0 "9P148 Konkurs"
 RAJ_atgm_carrier_equipment_3:0 "Windy 505 avec MILAN 2T"
 RAJ_atgm_carrier_equipment_3_short:0 "Windy 505 avec MILAN 2T"
 RAJ_atgm_carrier_equipment_4:0 "Porte-missile BMP-2 Nag "
 RAJ_atgm_carrier_equipment_4_short:0 " BMP-2 NAMICA"
 RAJ_atgm_carrier_equipment_4_desc:0 "Le NAMICA (Nag Missile Carrier) est un BMP-2 allongé construit sous licence avec des roues supplémentaires, surnommé « Sarath » en Inde. Il est classé comme chasseur de chars. Il est équipé de divers systèmes électro-optiques dont un imageur thermique (TI) et un télémètre laser (LRF) pour l'acquisition de cibles. Le NAMICA transporte un total de douze missiles, dont huit en mode prêt à tirer et quatre en stockage. Il dispose d'un groupe auxiliaire de puissance (APU) compact pour un fonctionnement de surveillance silencieux, d'un système de détection et d'extinction d'incendie (FDSS) et d'un système de protection nucléaire, biologique et chimique (NBCPS). Le transporteur pèse 14,5 tonnes en pleine charge de combat et est capable de se déplacer à 7 km/h dans l'eau. Le transporteur a été soumis à des essais de transport, parcourant 155 km au cours des essais de l'été 2008. Il dispose de différents modes de tir, notamment le mode attaque supérieure et le mode attaque indirecte. Il dispose d'un système de verrouillage avant le lancement, où la cible est identifiée et désignée avant le lancement. La portée d'attaque est limitée en raison de son système de ciblage basé sur l'identification visuelle."
 
 RAJ_sam_carrier_equipment_1:0 "S-25 Berkut"
 RAJ_sam_carrier_equipment_1_short:0 "S-25 Berkut"
 RAJ_sam_carrier_equipment_1_desc:0 "Le S-25 Berkut (en russe ; С-25 « Беркут » ; « Berkut » signifie aigle royal en anglais) est un missile guidé sol-air, le premier système SAM opérationnel en Union soviétique. "
 RAJ_sam_carrier_equipment_2:0 "2K12 Koub"
 RAJ_sam_carrier_equipment_2_short:0 "2K12 Koub"
 RAJ_sam_carrier_equipment_2_desc:0 "Chaque batterie 2K12 se compose d'un certain nombre de véhicules à chenilles similaires, dont l'un porte le radar 1S91 (véhicule SURN, désignation OTAN « Straight Flush ») de 25 kW en bande G/H (avec une portée de 75 km (47 mi)) équipé d'un illuminateur à ondes continues, en plus d'un viseur optique. La batterie comprend généralement également quatre lanceurs-érecteurs de missiles triples (TEL) et quatre camions, chacun transportant trois missiles de rechange et une grue. Le TEL est basé sur un châssis GM-578, tandis que le véhicule radar 1S91 est basé sur un châssis GM-568, tous développés et produits par MMZ."
 
 RAJ_sam_carrier_equipment_5:0 "Véhicule de combat Trishul"
 RAJ_sam_carrier_equipment_5_short:0 "Véhicule de combat Trishul"
 RAJ_sam_carrier_equipment_5_desc:0 "Trishul est un missile sol-air à courte portée développé en Inde. Il a été développé par l'Organisation de recherche et de développement pour la défense dans le cadre du programme de développement de missiles guidés intégrés. Il peut également être utilisé comme écumeur anti-mer depuis un navire contre des missiles d'attaque volant à basse altitude."
 RAJ_sam_carrier_equipment_6:0 "Akash"
 RAJ_sam_carrier_equipment_6_short:0 "Akash"
 RAJ_sam_carrier_equipment_6_desc:0 "Akash est un système de missile sol-air mobile (SAM) à moyenne portée développé par l'Organisation de recherche et de développement pour la défense (DRDO) et produit par Bharat Dynamics Limited (BDL). Le radar de surveillance et de contrôle de tir, le centre de contrôle et de commandement tactique et le lanceur de missiles sont développés par Bharat Electronics (BEL), la division d'ingénierie stratégique de Tata Power et Larsen & Toubro."
 
 RAJ_sam_long_range_0:0 "S-75 Desna"
 RAJ_sam_long_range_1:0 "S-200V Véga"
 RAJ_sam_long_range_2:0 "S-300PM"
 RAJ_sam_long_range_3:0 "S-300PMU"
 RAJ_sam_long_range_4:0 "Barak 8"
  
 ##Helicopters
 
 #Scout Helicopter
 RAJ_scout_helicopter_equipment_1:0 "Aérospatiale SA-315B Lama"
 RAJ_scout_helicopter_equipment_1_short:0 "SA-315B Lama"
 RAJ_scout_helicopter_equipment_1_desc:0 "L'Aérospatiale SA 315B Lama est un hélicoptère monomoteur français développé pour répondre aux besoins opérationnels chauds et élevés des forces armées indiennes. Il combine la cellule plus légère de l'Aérospatiale Alouette II avec les composants et le groupe motopropulseur de l'Alouette III. Le Lama possède des performances exceptionnelles en haute altitude. "
 RAJ_scout_helicopter_equipment_2:0 "HAL Guépard"
 RAJ_scout_helicopter_equipment_2_desc:0 "Un nombre important de Lamas SA315B ont été fabriqués sous licence en Inde par Hindustan Aeronautics Limited (HAL), sous le nom de Cheetah. Plus de trois décennies après le début de la production en Inde, HAL recevait toujours des commandes d'exportation pour le Cheetah original."
 RAJ_scout_helicopter_equipment_2_short:0 "Guépard"
 RAJ_scout_helicopter_equipment_3:0 "HAL Lancer"
 RAJ_scout_helicopter_equipment_3_desc:0 "Variante de combat armé modifiée. Les changements incluent un blindage composite, du verre trempé et des viseurs pour armes à feu. Les armements comprennent deux modules d'armes largables, chacun contenant une seule mitrailleuse de 12,7 mm et jusqu'à trois roquettes de 70 mm."
 RAJ_scout_helicopter_equipment_3_short:0 "Lancier"
 RAJ_scout_helicopter_equipment_4:0 "HAL Cheétal"
 RAJ_scout_helicopter_equipment_4_short:0 "Chetal"
 RAJ_scout_helicopter_equipment_4_desc:0 "Cheetal est la version remotorisée de l'hélicoptère Cheetah. Le projet a débuté en 2002 et visait à améliorer les capacités opérationnelles et la maintenabilité à haute altitude ainsi qu'à fournir une mise à niveau à mi-vie pour des opérations sûres et fiables.  "
 RAJ_scout_helicopter_equipment_5:0 "HAL Rudra"
 RAJ_scout_helicopter_equipment_5_short:0 "Rudra"
 RAJ_scout_helicopter_equipment_5_desc:0 "Le HAL Rudra, également connu sous le nom d'ALH-WSI, est une version armée du HAL Dhruv conçue et fabriquée par Hindustan Aeronautics Limited (HAL). Rudra est équipé d'une interface de visée infrarouge (FLIR) et d'imagerie thermique, d'un canon à tourelle de 20 mm, de nacelles de fusée de 70 mm, de missiles guidés antichar et de missiles air-air."

 #Attack Helicopter
 #RAJ_attack_helicopter_equipment_1:0 "Aérospatiale SA-315B Lama Gunship"
 #RAJ_attack_helicopter_equipment_1_short:0 "SA-315B Lama Gunship"
 #RAJ_attack_helicopter_equipment_1_desc:0 "Gunship variant of the SA-315B Lama. (GFX Only.)"
 RAJ_attack_helicopter_equipment_2:0 "Mil Mi-24V"
 RAJ_attack_helicopter_equipment_2_short:0 "Mil Mi-24V"
 RAJ_attack_helicopter_equipment_2_desc:0 "Développement ultérieur qui est entré en production en 1976. Il était armé du 9M114 Shturm (AT-6 Spiral) plus avancé. Huit de ces missiles sont montés sur quatre pylônes extérieurs des ailes. Il s'agit de la version la plus produite avec plus de 1 500 exemplaires. En service polonais, cet avion est désigné Mi-24W. Un Mi-24V a été appelé Mi-24T pour des raisons inconnues."
 RAJ_attack_helicopter_equipment_3:0 "Mil Mi-25"
 RAJ_attack_helicopter_equipment_3_short:0 "Mil Mi-25"
 RAJ_attack_helicopter_equipment_3_desc:0 "La version d'exportation du Mi-24D. (Hind-D) Le Mi-24D a été conçu pour être un vaisseau de combat plus pur que les variantes précédentes. Il est entré en production en 1973. Le Mi-24D possède un fuselage avant redessiné, avec deux cockpits séparés pour le pilote et le tireur. Il est armé d'une seule mitrailleuse Yak-B à quatre canons de 12,7 mm sous le nez. Il peut également transporter quatre nacelles de roquettes de 57 mm, quatre missiles antichar SACLOS 9M17 Phalanga (une amélioration significative par rapport au système MCLOS du Mi-24A), ainsi que des bombes et d'autres armes."
 RAJ_attack_helicopter_equipment_4:0 "Mi-35E Akbar"
 RAJ_attack_helicopter_equipment_4_short:0 "Mi-35E Akbar"
 RAJ_attack_helicopter_equipment_4_desc:0 "Basé sur le Mi-24 Hind, l'hélicoptère militaire Mi-35M intègre plusieurs améliorations, notamment des ailes tronquées raccourcies, un nouveau système de rotor, une avionique moderne, des turbomoteurs améliorés et un système hydraulique. Le cockpit et les composants vitaux de l'hélicoptère sont lourdement blindés."
 RAJ_attack_helicopter_equipment_5:0 "Hélicoptère de combat léger HAL"
 RAJ_attack_helicopter_equipment_5_short:0 "LCH"
 RAJ_attack_helicopter_equipment_5_desc:0 "Le HAL Light Combat Helicopter (LCH) est un hélicoptère d'attaque multirôle indien conçu et fabriqué par Hindustan Aeronautics Limited (HAL). Il s'agit de l'hélicoptère d'attaque moderne le plus léger au monde et son plafond de vol est le plus élevé de tous les hélicoptères d'attaque. Il a été commandé pour l'armée de l'air indienne et l'armée indienne. Le type est également destiné à être vendu sur le marché d'exportation ; depuis 2015, HAL recherche d'autres clients pour le LCH."
 
 #Utility Helicopter
 RAJ_utility_helicopter_equipment_1:0 "Mésange Sikorsky S-55C"
 RAJ_utility_helicopter_equipment_1_short:0 "Mésange S-55C"
 RAJ_utility_helicopter_equipment_2:0 "Aérospatiale SA316 Alouette III"
 RAJ_utility_helicopter_equipment_2_short:0 "SA316 Alouette III"
 RAJ_utility_helicopter_equipment_3:0 "Mil Mi-8T"
 RAJ_utility_helicopter_equipment_3_short:0 "Mi-8T"
 RAJ_utility_helicopter_equipment_4:0 "Mil Mi-17"
 RAJ_utility_helicopter_equipment_4_short:0 "Mi-17"
 RAJ_utility_helicopter_equipment_5:0 "HAL Chetak"
 RAJ_utility_helicopter_equipment_5_short:0 "Chetak"
 RAJ_utility_helicopter_equipment_5_desc:0 "Dans le cadre d'un accord de licence entre Aérospatiale et l'avionneur indien Hindustan Aeronautics Limited (HAL), l'Alouette III a été construite sous licence par HAL en Inde. Connu localement sous la désignation HAL Chetak, plus de 300 giravions ont été fabriqués à ce jour ; la majorité d'entre eux ont été acquis à des fins militaires auprès des forces armées indiennes, qui les ont utilisés pour remplir divers rôles de mission, notamment la formation, le transport, le CASEVAC (évacuation des blessés), les communications et les rôles de liaison."
 RAJ_utility_helicopter_equipment_6:0 "HAL Dhruv Mk.1"
 RAJ_utility_helicopter_equipment_6_short:0 "Dhruv Mk.1"
 RAJ_utility_helicopter_equipment_6_desc:0 "Le HAL Dhruv est un hélicoptère utilitaire conçu et développé par Hindustan Aeronautics Limited (HAL). Le développement du Dhruv a été annoncé en novembre 1984, puis conçu avec l'aide de MBB en Allemagne. L'hélicoptère a volé pour la première fois en 1992 ; cependant, son développement a été prolongé en raison de multiples facteurs, notamment les exigences de l'armée indienne en matière de modifications de conception, les restrictions budgétaires et les sanctions imposées à l'Inde à la suite des essais nucléaires Pokhran-II de 1998. Il doit son nom à un personnage mythologique indien, Dhruv, qui signifie en sanscrit « inébranlable »."
 RAJ_utility_helicopter_equipment_7:0 "Hélicoptère utilitaire léger HAL"
 RAJ_utility_helicopter_equipment_7_short:0 "LUH"
 RAJ_utility_helicopter_equipment_7_desc:0 "L'hélicoptère utilitaire léger HAL (LUH) ainsi que son dérivé hélicoptère d'observation léger (LOH) ont été conçus et développés par le Rotary Wing Research and Design Center (RWR&DC), l'une des sections R&D de Hindustan Aeronautics Limited (HAL) pour des applications civiles et militaires. Ceux-ci sont destinés à remplacer les versions construites sous licence de l'Aérospatiale SA 315B Lama (désigné Cheetah) et de l'Aérospatiale Alouette III (désigné Chetak) en service dans l'armée indienne et l'armée de l'air indienne."

 #Cargo Helicopter
 RAJ_cargo_helicopter_equipment_3:0 "Mil Mi-26"
 RAJ_cargo_helicopter_equipment_3_short:0 "Mi-26"
 RAJ_cargo_helicopter_equipment_4:0 "Mil Mi-26M"
 RAJ_cargo_helicopter_equipment_4_short:0 "Mi-26M"
 RAJ_cargo_helicopter_equipment_5:0 "Mil Mi-26T2"
 RAJ_cargo_helicopter_equipment_5_short:0 "Mi-26T2"
 RAJ_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 RAJ_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 RAJ_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, un CH-47D amélioré, a effectué son vol inaugural ; le premier modèle de production a été déployé le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les mises à niveau comprennent des moteurs Honeywell de 4 868 chevaux (3 630 kW) et la cellule dotée d'une plus grande construction monobloc pour réduire les besoins de maintenance. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion pour augmenter la durée de vie."
 
 #Naval Helicopter
 #RAJ_naval_helicopter_equipment_1:0 ""
 #RAJ_naval_helicopter_equipment_1_short:0 ""
 #RAJ_naval_helicopter_equipment_1_desc:0 ""
 #RAJ_naval_helicopter_equipment_2:0 ""
 #RAJ_naval_helicopter_equipment_2_short:0 ""
 #RAJ_naval_helicopter_equipment_2_desc:0 ""
 RAJ_naval_helicopter_equipment_3:0 "Kamov Ka-25BSh"
 RAJ_naval_helicopter_equipment_3_short:0 "Ka-25BSh"
 RAJ_naval_helicopter_equipment_4_desc:0 "Nom de rapport OTAN « Hormone-A ». Des variantes sont utilisées dans le rôle de guerre anti-sous-marine, équipées d'un radar, d'un sonar plongeant et d'un MAD remorqué et armées de torpilles et de grenades sous-marines nucléaires ou conventionnelles."
 RAJ_naval_helicopter_equipment_4:0 "Sea King Westland Mk.42A"
 RAJ_naval_helicopter_equipment_4_short:0 "Sea King Mk.42A"
 RAJ_naval_helicopter_equipment_5:0 "Sea King Westland Mk.42B"
 RAJ_naval_helicopter_equipment_5_short:0 "Sea King Mk.42B"
 RAJ_naval_helicopter_equipment_5_desc:0 "Version polyvalente pour la marine indienne, équipée pour la guerre anti-sous-marine, avec sonar plongeant et avionique avancée, et les opérations anti-navires, avec deux missiles Sea Eagle."
 RAJ_naval_helicopter_equipment_6:0 "Kamov Ka-27PL Hélix-A"
 RAJ_naval_helicopter_equipment_6_short:0 "Ka-27PL Helix-A"
 RAJ_naval_helicopter_equipment_6_desc:0 "Le Kamov Ka-27 (nom OTAN « Helix ») est un hélicoptère militaire développé pour la marine soviétique et actuellement en service dans divers pays, dont la Russie, l'Ukraine, le Vietnam, la Chine, la Corée du Sud et l'Inde. L'hélicoptère a été développé pour le convoyage et la guerre anti-sous-marine."
 RAJ_naval_helicopter_equipment_7:0 "HAL Dhruv Mk.3"
 RAJ_naval_helicopter_equipment_7_short:0 "Dhruv Mk.3"
 RAJ_naval_helicopter_equipment_7_desc:0 "Variante navalisée du HAL Dhruv, le Mk.3 a été mis à la disposition de la marine indienne pour des tâches de patrouille et anti-sous-marines."

 #### Indian Air Force ####

 ### Multirole
 RAJ_fighter_equipment_0:0 "Westland Wapiti Mk.IIA"
 RAJ_fighter_equipment_0_short:0 "Westland Wapiti Mk.IIA"
 RAJ_fighter_equipment_0_desc:0 "Le Westland Wapiti était un biplan militaire monomoteur britannique biplace des années 1920. Il a été conçu et construit par Westland Aircraft Works pour remplacer l'Airco DH.9A dans le service de la Royal Air Force."
 RAJ_fighter_equipment_1:0 "Hawker Hurricane Mk.I"
 RAJ_fighter_equipment_1_short:0 "Hawker Hurricane Mk.I"
 RAJ_fighter_equipment_2:0 "Hawker Hurricane Mk.IIB"
 RAJ_fighter_equipment_2_short:0 "Hawker Hurricane Mk.IIB"
 RAJ_fighter_equipment_2_desc:0 "le Hawker Hurricane est un avion de combat monoplace britannique des années 1930 à 1940, conçu et principalement construit par Hawker Aircraft Ltd. pour servir dans la Royal Air Force (RAF)."
 RAJ_fighter_equipment_3:0 "Supermarine Spitfire F Mk.XIV"
 RAJ_fighter_equipment_3_short:0 "Spitfire F Mk.XIV"
 RAJ_fighter_equipment_3_desc:0 "Les premiers Spitfire propulsés par Griffon souffraient de mauvaises performances à haute altitude en raison du fait qu'ils n'avaient qu'un seul moteur suralimenté à un étage. En 1943, les ingénieurs de Rolls-Royce avaient développé un nouveau moteur Griffon, la série 61, doté d'un compresseur à deux étages. En fin de compte, c'est un moteur légèrement modifié, la série 65, qui fut utilisé dans le Mk XIV. L'avion résultant a fourni une augmentation substantielle des performances par rapport au Mk IX."

 RAJ_jet_multirole_equipment_1:0 "De Havilland Vampire F.3"
 RAJ_jet_multirole_equipment_1_short:0 "Vampire F.3"
 RAJ_jet_multirole_equipment_1_desc:0 "Le 7e Escadron de l'Indian Air Force (IAF) a reçu des Vampires en janvier 1949. Le 17e Escadron de l'IAF a également exploité ce type. Le 37e Escadron de l'IAF a effectué un certain nombre de missions de reconnaissance nocturne Vampire NF54 au-dessus de Goa lors de l'annexion de Goa à la domination portugaise en 1961, parfois sous le feu anti-aérien."
 RAJ_jet_multirole_equipment_2:0 "De Havilland Vampire F.52"
 RAJ_jet_multirole_equipment_2_short:0 "Vampire F.52"
 RAJ_jet_multirole_equipment_2_desc:0 "Le 1er septembre 1965, pendant la guerre indo-pakistanaise, le 45e Escadron de l'IAF a répondu à une demande de frappe contre une contre-attaque de l'armée pakistanaise (Opération Grand Slam), et douze chasseurs-bombardiers Vampire Mk 52 ont réussi à ralentir l'avancée pakistanaise."
 RAJ_jet_multirole_equipment_3:0 "Dassault MD.450B Toofani"
 RAJ_jet_multirole_equipment_3_short:0 "MD.450B Toofani"
 RAJ_jet_multirole_equipment_4:0 "Hawker Chasseur F.1"
 RAJ_jet_multirole_equipment_4_short:0 "Chasseur F.1"
 RAJ_jet_multirole_equipment_4_desc:0 "Première version de production, moteur Avon 113, premier vol le 16 mai 1953, 139 construits, 113 construits par Hawker Aircraft à Kingston-upon-Thames et 26 autres à Blackpool. Premier avion de production volé le 16 mai 1953 (WT555, Dunsfold), le dernier livré en janvier 1955. Utilisé dans deux bases de première ligne (Odiham, 54 et 247 escadrons) et Leuchars (43 et 222 escadrons) ; à 229 OCU, Chivenor, 233 OCU (Pembrey), CFE (West Raynham) et en petit nombre ailleurs."
 RAJ_jet_multirole_equipment_5:0 "Hawker Hunter F.56"
 RAJ_jet_multirole_equipment_5_short:0 "Chasseur F.56"
 RAJ_jet_multirole_equipment_5_desc:0 "Version export du chasseur Hunter F.6 pour l'Inde, 160 exemplaires construits. Parachute de frein ajouté et possibilité de transporter des bombes de 500 lb (227 kg), modifications mineures des systèmes avioniques, y compris la suppression de l'installation radio UHF."
 RAJ_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 RAJ_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 RAJ_jet_multirole_equipment_6_short:0 "MiG-21PF"
 RAJ_jet_multirole_equipment_7:0 "HAL/Mikoyan-Gurevich MiG-21bis"
 RAJ_jet_multirole_equipment_7_short:0 "MiG-21bis"
 RAJ_jet_multirole_equipment_7_desc:0 "La dernière variante produite par HAL était le MiG-21bis. Au total, 75 exemplaires ont été construits en 1977 à partir de kits CKD, et 220 autres ont été construits à partir de zéro en 1984. Malgré une série d'accidents au cours des années 1990, l'armée de l'air indienne a décidé de mettre à niveau environ 125 des MiG-21bis de son inventaire au standard MiG-21 « Bison ». Ceux-ci peuvent servir jusqu'en 2025. Le MIG-21 FL d'origine (MIG-21 PF ou Type 77) a été retiré en décembre 2013 ; Les avions MIG-21M restants (Type 88) devraient être retirés d'ici 2015."
 RAJ_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23MF"
 RAJ_jet_multirole_equipment_8_short:0 "MiG-23MF"
 RAJ_jet_multirole_equipment_8_desc:0 "(\"Flogger-B\") Il s'agissait d'un dérivé d'exportation du MiG-23M initialement destiné à être exporté vers les pays du Pacte de Varsovie, mais il a également été vendu à de nombreux autres alliés et clients, car la plupart des clients exportateurs n'étaient pas satisfaits du MiG-23MS plutôt primitif. En fait, il était disponible en deux versions. Le premier a été vendu aux alliés du Pacte de Varsovie et il était essentiellement identique au MiG-23M soviétique, avec de légères modifications dans les transpondeurs et les équipements de communication « identifier ami ou ennemi » (IFF). La deuxième variante a été vendue en dehors de l'Europe de l'Est et avait une suite IFF et de communication différente (généralement avec la liaison de données supprimée) et un radar dégradé, qui manquait des fonctionnalités et des modes de contre-contre-mesure électronique (ECCM) de la ligne de base \"High Lark\". Cette variante était plus populaire à l'étranger que le MiG-23MS et un nombre considérable d'entre eux furent exportés, notamment au Moyen-Orient."
 RAJ_jet_multirole_equipment_9:0 "Dassault Mirage 2000H"
 RAJ_jet_multirole_equipment_9_short:0 "Mirage2000H"
 RAJ_jet_multirole_equipment_9_desc:0 "En 1980, l'Indian Air Force (IAF) a appris que le Pakistan avait réussi cette année-là à acheter des chasseurs F-16A/B, dont la livraison devait commencer en 1982. À la fin des années 1980, l'IAF avait rapidement convaincu le gouvernement indien d'acheter un avion tout aussi puissant, car sa flotte de MiG-21 et de MiG-23 était inférieure à celle du F-16. Lors de l'évaluation du Mirage F-1 plus tôt, ils ont pris connaissance d'un prototype haute performance du Mirage 2000 en phase d'essais en vol. Il n'y avait aucun autre avion de ce potentiel dans l'offre. Une évaluation interne du Mirage 2000 a été réalisée et le gouvernement indien a estimé que l'avion français était plus avancé et répondait mieux aux F-16 que les États-Unis devaient fournir au Pakistan et a approché la France pour 150 Mirage 2000. En octobre 1982, le pays passa une commande à Dassault de 36 Mirage 2000H monoplaces et de 4 Mirage 2000TH biplaces (avec H signifiant « Hindustan ») avec la possibilité d'un achat ultérieur de neuf avions (huit monoplaces et un biplace) comme réserve de guerre, de maintenance et d'usure. L'achat de 150 avions aurait très bien pu ouvrir la voie à une production conjointe avec Hindustan Aeronautics Limited (HAL), mais le nombre d'avions commandés (40+9) était trop faible pour un tel arrangement. L'Inde avait néanmoins la possibilité de produire un certain nombre de Mirage 2000 sous licence, qui a ensuite été abandonnée en raison des relations étroites du pays avec l'Union soviétique. Cela a conduit à l'intronisation du MiG-29 à la place, dépassant les réserves exprimées par l'IAF."
 RAJ_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG 29"
 RAJ_jet_multirole_equipment_10_short:0 "MiG-29"
 RAJ_jet_multirole_equipment_10_desc:0 "L'Inde a été le premier client international du MiG-29. L'Indian Air Force (IAF) a passé une commande de plus de 66 MiG-29 en 1980, alors que l'avion était encore dans sa phase initiale de développement. Depuis son introduction dans l'IAF en 1985, l'avion a subi une série de modifications avec l'ajout d'une nouvelle avionique, de sous-systèmes, de turboréacteurs à double flux et de radars. Les MiG-29 indiens ont été largement utilisés pendant la guerre de Kargil au Cachemire en 1999 par l'armée de l'air indienne pour fournir une escorte de chasseurs aux Mirage 2000 attaquant des cibles avec des bombes à guidage laser."

 RAJ_mr_stealth_fighter_equipment_1:0 "HAL Su-30MKI"
 RAJ_mr_stealth_fighter_equipment_1_short:0 "Su-30MKI"
 RAJ_mr_stealth_fighter_equipment_1_desc:0 "Le Su-30MKI a été conçu par la société russe Sukhoi Corporation à partir de 1995 et construit sous licence par la société indienne Hindustan Aeronautics Limited (HAL). Le Su-30MKI est dérivé du Sukhoi Su-27 et fusionne la technologie du démonstrateur Su-37 et du programme Su-30, étant plus avancé que le Su-30MK et le Su-30MKK/MK2 chinois. Le ministère russe de la Défense a été impressionné par les performances de ce type et a commandé 30 Su-30SM, un Su-30MKI localisé, pour l'armée de l'air russe. Il comprend une avionique de pointe développée par la Russie, l'Inde et Israël pour l'affichage, la navigation, le ciblage et la guerre électronique ; La France et l'Afrique du Sud ont fourni d'autres avioniques."
 
 
 ### CAS
 RAJ_CAS_equipment_1:0 "Hawker Hind"
 RAJ_CAS_equipment_1_short:0 "Postérieur"
 RAJ_CAS_equipment_2:0 "Vultée A-31 Vengeance"
 RAJ_CAS_equipment_2_short:0 "A-31 Vengeance"
 RAJ_CAS_equipment_3:0 "Hawker Tempête Mk.V"
 RAJ_CAS_equipment_3_short:0 "Tempête Mk.V"
 RAJ_CAS_equipment_4:0 "Hawker Tempête Mk.II"
 RAJ_CAS_equipment_4_short:0 "Tempête Mk.II"

 RAJ_jet_CAS_equipment_1:0 "de Havilland Vampire FB.5"
 RAJ_jet_CAS_equipment_1_short:0 "Vampire FB.5"
 RAJ_jet_CAS_equipment_2:0 "de Havilland Vampire FB.52"
 RAJ_jet_CAS_equipment_2_short:0 "Vampire FB.52"
 RAJ_jet_CAS_equipment_3:0 "de Haviland/HAL Vampire FB.52"
 RAJ_jet_CAS_equipment_3_short:0 "HAL Vampire FB.52"
 RAJ_jet_CAS_equipment_3_desc:0 "HAL a produit une variante du De Havilland Vampire FB.52."
 RAJ_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 RAJ_jet_CAS_equipment_4_short:0 "Su-7B"
 RAJ_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 RAJ_jet_CAS_equipment_5:0 "HAL HF-24 Marut Mark.1"
 RAJ_jet_CAS_equipment_5_short:0 "HF-24 Marut"
 RAJ_jet_CAS_equipment_5_desc:0 "Le HAL HF-24 Marut (« Esprit de la tempête ») était un chasseur-bombardier indien des années 1960. Développé par Hindustan Aircraft Limited (HAL), avec Kurt Tank comme concepteur principal. Il s'agit du premier avion à réaction développé en Inde et du premier chasseur à réaction asiatique (en dehors de la Russie et de l'Union soviétique) à dépasser la phase de test et à entrer en production et en service actif avec succès. Le 17 juin 1961, le type effectua son vol inaugural ; le 1er avril 1967, le premier Marut de production fut officiellement livré à l'IAF."
 RAJ_jet_CAS_equipment_6:0 "SEPECAT Jaguar GR.1"
 RAJ_jet_CAS_equipment_6_short:0 "Jaguar GR.1"
 RAJ_jet_CAS_equipment_6_desc:0 "Les Jaguars indiennes étaient très différentes de celles de la RAF. Les moteurs Adour Mk 811 furent bientôt adoptés dans la chaîne de production HAL (les précédentes Jaguar fabriquées au Royaume-Uni avaient le Mk 804 antérieur), donnant 8 400 lbf chacun. Il y avait des R-550 Magic 1 ou 2 dans les rails au-dessus des ailes. Mais plus important encore, le NAWASS, même s'il était de conception très moderne, a été remplacé car jugé peu fiable."
 RAJ_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-23BN"
 RAJ_jet_CAS_equipment_7_short:0 "MiG-23BN"
 RAJ_jet_CAS_equipment_7_desc:0 "(\"Flogger-H\") Produit depuis 1973, le MiG-23BN était basé sur le MiG-23B, mais avait le même moteur R-29-300 que les variantes de chasseurs contemporains. Ils étaient également équipés d'ailes de « type 3 ». Il y a eu d'autres changements mineurs dans l'électronique et l'équipement, et certains changements ont été apportés au cours de sa longue production. La production en série a duré jusqu'en 1985, avec 624 exemplaires construits. La plupart d'entre eux ont été exportés, car les Soviétiques l'ont toujours considéré comme un type intérimaire et seul un petit nombre a servi dans les régiments de l'aviation frontale. Comme d'habitude, une version dégradée a été vendue aux clients du tiers monde. Cette variante s'est avérée assez populaire et efficace. La caractéristique d'identification la plus distinctive entre le MiG-23B et le MiG-23BN était que le premier avait la tête diélectrique juste au-dessus du pylône, qui a été retirée du MiG-23BN. En Inde, les derniers MiG-23BN ont été pilotés par le 221e Escadron (Valiants) de l'Indian Air Force et ont été mis hors service le 6 mars 2009. Le commandant de bord Tapas Ranjan Sahu a été le dernier pilote à faire atterrir le MiG-23BN ce jour-là"
 RAJ_jet_CAS_equipment_8:0 "HAL MiG-27M Bahadur"
 RAJ_jet_CAS_equipment_8_short:0 "MiG-27M Bahadur"
 RAJ_jet_CAS_equipment_8_desc:0 "Une variante d'exportation du MiG-27M fournie en 1986 à l'Inde sous forme de kits démontables pour assemblage sous licence. C'était le même que le MiG-27M, sauf que le carénage inférieur du capteur infrarouge de recherche et de suivi (IRST) avait une seule fenêtre au lieu de plusieurs, comme celle du MiG-27M d'origine. Au total, 150 exemplaires ont été assemblés par l'Inde. L'Inde appelle ce modèle MiG-27M Bahadur, tandis que MiG-27L est la désignation d'exportation Mikoyan."
 
 RAJ_cas_stealth_equipment_1:0 "HAL Jaguar EST"
 RAJ_cas_stealth_equipment_1_short:0 "Jaguar EST"
 RAJ_cas_stealth_equipment_1_desc:0 "Hindustan Aeronautics Limited-developed single-seat all-weather tactical strike, ground-attack fighter for the Indian Air Force".

 #Interceptor
 RAJ_jet_interceptor_equipment_1:0 "de Havilland Vampire NF.10"
 RAJ_jet_interceptor_equipment_1_short:0 "Vampire NF.10"
 RAJ_jet_interceptor_equipment_1_desc:0 "Version de chasseur de nuit biplace propulsé par Goblin pour la RAF ; 81 exemplaires construits dont 3 prototypes."
 RAJ_jet_interceptor_equipment_2:0 "de Havilland Vampire NF.54"
 RAJ_jet_interceptor_equipment_2_short:0 "Vampire NF.54"
 RAJ_jet_interceptor_equipment_2_desc:0 "Exporter NF.10. L'armée de l'air italienne en a acheté 14 et l'Inde a acheté 30 NF.10 remis à neuf."
 #RAJ_jet_interceptor_equipment_3:0 ""
 #RAJ_jet_interceptor_equipment_3_short:0 ""
 #RAJ_jet_interceptor_equipment_3_desc:0 ""
 #RAJ_jet_interceptor_equipment_4:0 ""
 #RAJ_jet_interceptor_equipment_4_short:0 ""
 #RAJ_jet_interceptor_equipment_4_desc:0 ""
 #RAJ_jet_interceptor_equipment_5:0 ""
 #RAJ_jet_interceptor_equipment_5_short:0 ""
 #RAJ_jet_interceptor_equipment_5_desc:0 ""
 RAJ_jet_interceptor_equipment_6:0 "HAL/Mikoyan-Gurevich MiG-21FL Type 77"
 RAJ_jet_interceptor_equipment_6_short:0 "MiG-21FL Type 77"
 RAJ_jet_interceptor_equipment_6_desc:0 "L'Inde est le plus grand opérateur de MiG-21. En 1961, l'Indian Air Force (IAF) a choisi d'acheter le MiG-21 plutôt que plusieurs autres concurrents occidentaux. Dans le cadre de cet accord, l'Union soviétique offrait à l'Inde un transfert complet de technologie et de droits d'assemblage local. En 1964, le MiG-21 est devenu le premier avion de combat supersonique à entrer en service dans l'IAF. En raison du nombre limité d'intronisés et du manque de formation des pilotes, le MiG-21 de l'IAF a joué un rôle limité dans la guerre indo-pakistanaise de 1965. Cependant, l'IAF a acquis une expérience précieuse en utilisant le MiG-21 pour des sorties défensives pendant la guerre. Les réactions positives des pilotes de l'IAF pendant la guerre de 1965 ont incité l'Inde à passer davantage de commandes d'avions de combat et à investir massivement dans la construction de l'infrastructure de maintenance et des programmes de formation des pilotes du MiG-21."
 RAJ_jet_interceptor_equipment_7:0 "Mikoyan-Gourevitch MiG-21M"
 RAJ_jet_interceptor_equipment_7_short:0 "MiG-21M"
 RAJ_jet_interceptor_equipment_7_desc:0 "Variante d'exportation du MiG-21S avec deux différences majeures, le radar RP-22 du MiG-21S a été remplacé par l'ancien radar RP-21MA et comportait un canon GSh-23L intégré au lieu d'une nacelle de canon. Dans le rôle air-air, il ne pouvait transporter que l'AAM à recherche IR R-3S sur ses quatre pylônes, car la variante SARH, le R-3R, n'était pas autorisée à l'exportation. Le type a également été construit sous licence en Inde, le premier exemplaire construit en Inde étant livré en février 1973."
 RAJ_jet_interceptor_equipment_8:0 "HAL MiG-21MF Type 96"
 RAJ_jet_interceptor_equipment_8_short:0 "MiG-21MF Type 96"
 RAJ_jet_interceptor_equipment_8_desc:0 "La production sous licence d'une variante améliorée unique à l'Inde, désignée MiG-21MF (Type 96), a commencé en 1973 et a duré jusqu'en 1981 - un total de 158 exemplaires ont été construits. Le HAL MiG-21MF (Type 96) n'est pas le même que le MiG-21MF (izdeliye 96) fabriqué en URSS pour être exporté vers d'autres pays."
 RAJ_jet_interceptor_equipment_9:0 "HAL MiG-21 Bisons"
 RAJ_jet_interceptor_equipment_9_short:0 "MiG-21 Bisons"
 RAJ_jet_interceptor_equipment_9_desc:0 "La dernière variante produite par HAL était le MiG-21bis. Au total, 75 exemplaires ont été construits en 1977 à partir de kits CKD, et 220 autres ont été construits à partir de zéro en 1984. Malgré une série d'accidents au cours des années 1990, l'armée de l'air indienne a décidé de mettre à niveau environ 125 des MiG-21bis de son inventaire au standard MiG-21 « Bison ». Ceux-ci peuvent servir jusqu'en 2025. Le MIG-21 FL d'origine (MIG-21 PF ou Type 77) a été retiré en décembre 2013 ; Les avions MIG-21M restants (Type 88) devraient être retirés d'ici 2015."

 #RAJ_stealth_fighter_equipment_1:0 "HAL Advanced Medium Combat Aircraft (AMCA)"
 #RAJ_stealth_fighter_equipment_1_short:0 "HAL AMCA"
 #RAJ_stealth_fighter_equipment_1_desc:0 "The HAL-DRDO Advanced Medium Combat Aircraft (AMCA) is an Indian programme to develop fifth and sixth-generation fighter aircrafts. It is expected to be produced by a public-private joint venture between the Defence Research and Development Organisation, Hindustan Aeronautics Limited, and an Indian private company."
 
 #Jet light
 RAJ_jet_light_equipment_1:0 "HAL HT-2"
 RAJ_jet_light_equipment_1_short:0 "HT-2"
 RAJ_jet_light_equipment_1_desc:0 "Le HAL HT-2 est un avion d'entraînement primaire indien biplace conçu et construit par Hindustan Aeronautics Limited (HAL). Le HT-2 a été le premier modèle de l'entreprise à entrer en production en 1953 pour l'armée de l'air et la marine indiennes, où il a remplacé le de Havilland Tiger Moth. Le HT-2 est un monoplan cantilever à ailes basses avec un train d'atterrissage à roue arrière fixe. Propulsé par un moteur à pistons Cirrus Major III de 155 ch (116 kW), l'avion dispose de cockpits tandem fermés avec deux commandes. Outre son utilisation militaire, l'avion était également utilisé par les écoles de pilotage indiennes."
 RAJ_jet_light_equipment_2:0 "de Haviland/HAL Vampire T.55"
 RAJ_jet_light_equipment_2_short:0 "HAL Vampire T.55"
 RAJ_jet_light_equipment_2_desc:0 "Entraîneur d'exportation du de Havilland Vampire, 322 construits dont 30 en Suisse, 60 en Inde par HAL et six convertis à partir de T.11"
 RAJ_jet_light_equipment_3:0 "Folland Moucheron F.1"
 RAJ_jet_light_equipment_3_short:0 "Moucheron F.1"
 RAJ_jet_light_equipment_3_desc:0 "Chasseur léger monoplace exporté vers la Finlande, l'Inde et la Yougoslavie, 50 exemplaires construits par Folland à Hamble. Celui-ci a également été construit en Inde sous licence sous le nom de HAL Gnat."
 RAJ_jet_light_equipment_4:0 "HAL Ajeet Mk.1"
 RAJ_jet_light_equipment_4_short:0 "Ajeet Mk.1"
 RAJ_jet_light_equipment_4_desc:0 "L'Ajeet est un dérivé du chasseur léger britannique Folland Gnat. Le Gnat, qui avait été acheté en grand nombre pour l'IAF et produit sous licence par HAL, s'était acquitté favorablement de son service en Inde, notamment dans des rôles de combat actifs lors de multiples conflits avec le Pakistan, notamment la guerre indo-pakistanaise de 1965 et la guerre indo-pakistanaise de 1971."
 RAJ_jet_light_equipment_5:0 "HAL Tejas Marque 1"
 RAJ_jet_light_equipment_5_short:0 "Tejas Marque 1"
 RAJ_jet_light_equipment_5_desc:0 "Le HAL Tejas est un chasseur léger multirôle monomoteur indien de quatrième génération conçu par l'Agence de développement aéronautique (ADA) en collaboration avec le Centre de recherche et de conception d'aéronefs (ARDC) de Hindustan Aeronautics Limited (HAL) pour l'armée de l'air indienne et la marine indienne. Il est issu du programme Light Combat Aircraft (LCA), lancé dans les années 1980 pour remplacer les chasseurs vieillissants MiG-21 indiens. En 2003, la LCA a été officiellement nommée Tejas."
 
 #Transport
 RAJ_transport_plane_equipment_1:0 "Douglas C-47 Dakota"
 RAJ_transport_plane_equipment_1_short:0 "C-47Dakota"
 RAJ_transport_plane_equipment_1_desc:0 "Le Dakota revêt une importance considérable dans l'histoire de l'Inde car il fut le premier des principaux avions de transport à être intégré à l'IAF. L'avion entra dans l'escadron n°12 de l'IAF en 1946."
 RAJ_transport_plane_equipment_2:0 "Wagon couvert volant Fairchild C-119G"
 RAJ_transport_plane_equipment_2_short:0 "Wagon couvert volant C-119G"
 RAJ_transport_plane_equipment_2_desc:0 "Le Fairchild C-119 Flying Boxcar (désignation R4Q de la Marine et du Corps des Marines) était un avion de transport militaire américain développé à partir du Fairchild C-82 Packet de la Seconde Guerre mondiale, conçu pour transporter des marchandises, du personnel, des patients et du matériel mécanisé, et pour larguer des marchandises et des troupes en parachute."
 RAJ_transport_plane_equipment_3:0 "HAL-748"
 RAJ_transport_plane_equipment_3_short:0 "HAL-748"
 RAJ_transport_plane_equipment_3_desc:0 "Version de production sous licence du Hawker Siddeley HS 748 par Hindustan Aeronautics Limited à Bangalore en Inde. Les avions indiens ont ensuite été modifiés pour une variété de rôles, y compris un avion d'essai pour une version aéroportée d'alerte précoce équipée d'un grand radôme, connue sous le nom de plate-forme de surveillance aéroportée (ASP)."
 RAJ_transport_plane_equipment_4:0 "Antonov An-12"
 RAJ_transport_plane_equipment_4_short:0 "An-12"
 RAJ_transport_plane_equipment_4_desc:0 "L'Indian Air Force a intronisé le premier de ces avions en 1961, lorsqu'elle a levé le 44e Escadron « The Himalayan Geese ». Six de ces appareils participèrent bientôt au transport aérien des renforts de l'armée vers le Ladakh pendant la guerre sino-indienne de 1962. L'An-12 fut ensuite utilisé pour lever le 25e Escadron. Les An-12 ont également été utilisés comme bombardiers lourds pendant la guerre indo-pakistanaise de 1971."
 RAJ_transport_plane_equipment_5:0 "De Havilland Canada DHC-4 Caribou"
 RAJ_transport_plane_equipment_5_short:0 "Caribou DHC-4"
 RAJ_transport_plane_equipment_5_desc:0 "Le de Havilland Canada DHC-4 Caribou est un avion de transport utilitaire à turbopropulseur à décollage et atterrissage courts (STOL) développé à partir du précédent DHC-4 Caribou à pistons. L'avion a des performances STOL extraordinaires et est capable de décoller sur des distances beaucoup plus courtes que ce que même la plupart des avions légers peuvent gérer. "
 RAJ_transport_plane_equipment_6:0 "Antonov AN-32"
 RAJ_transport_plane_equipment_6_short:0 "AN-32"
 RAJ_transport_plane_equipment_6_desc:0 "L'An-32 est essentiellement un An-26 remotorisé. Il est conçu pour mieux résister aux conditions météorologiques défavorables que l'An-26 standard. Annoncé au Salon du Bourget de mai 1977, l'An-32 se distingue de son prédécesseur par des moteurs surélevés de 1,5 m au-dessus de l'aile afin d'éviter les dommages causés par des corps étrangers sur des pistes d'atterrissage accidentées et non préparées. "
 RAJ_transport_plane_equipment_7:0 "Antonov AN-32RE"
 RAJ_transport_plane_equipment_7_short:0 "AN-32RE"
 RAJ_transport_plane_equipment_7_desc:0 "Version modernisée de l'An-32B. La MTOW a augmenté à 28,5 tonnes, la charge utile a été augmentée à 7,5 tonnes et une nouvelle avionique plus moderne."
 RAJ_transport_plane_equipment_8:0 "Iliouchine Il-78MKI"
 RAJ_transport_plane_equipment_8_short:0 "Il-78MKI"
 RAJ_transport_plane_equipment_8_desc:0 "Il-78MKI - variante personnalisée de l'Il-78ME pour l'Indian Air Force. Les avions ont été livrés par la Russie, construits en Ouzbékistan et équipés de systèmes de transfert de carburant israéliens capables de ravitailler 6 à 8 Sukhoi Su-30MKI en une seule mission. Cet Il-78MKI est exploité par le No.78 Mid-Air-Refuelling Squadron \"Valorous MARS\" (alias \"Battle-cry\") IAF, depuis l'AFS Agra."
 RAJ_transport_plane_equipment_10:0 "C-17 Globemaster III"
 RAJ_transport_plane_equipment_10_short:0 "C-17 Globemaster III"
  
 #Recon Plane
 RAJ_recon_equipment_0:0 "Auster AOP. Marc 9"
 RAJ_recon_equipment_0_short:0 "Auster AOP. Marc 9"
 RAJ_recon_equipment_0_desc:0 "L'Auster AOP.9 était un avion d'observation aérienne militaire britannique (« Air Observation Post ») produit par Auster Aircraft Limited pour remplacer l'Auster AOP.6. "
 RAJ_jet_recon_equipment_0:0 "HAL HAOP-27 Krishak"
 RAJ_jet_recon_equipment_0_short:0 "HAOP-27 Krishak"
 RAJ_jet_recon_equipment_0_desc:0 "Le HAL HAOP-27 Krishak était un avion d'observation militaire produit en Inde dans les années 1960. Il a été initialement développé par Hindustan Aeronautics comme une version agrandie à quatre places de l'avion léger HAL Pushpak. "
 RAJ_jet_recon_equipment_1:0 "Mikoyan-Gurevich Mig-25RB 'Garuda'"
 RAJ_jet_recon_equipment_1_short:0 "MiG-25RB 'Garuda'"
 RAJ_jet_recon_equipment_1_desc:0 "Le MiG-25 était gardé secret en Inde, désigné Garuda du nom du grand oiseau mythique de Dieu Vishnu des écritures hindoues. Il a été largement utilisé lors de la guerre de Kargil et de l'opération Parakram, effectuant des sorties de reconnaissance aérienne au-dessus du Pakistan. En mai 1997, un avion de reconnaissance Mikoyan MiG-25RB de l'armée de l'air indienne a fait sensation lorsque le pilote a survolé le territoire pakistanais à une vitesse supérieure à Mach 3 à la suite d'une mission de reconnaissance dans l'espace aérien pakistanais. Le MiG-25 a franchi le mur du son alors qu'il volait à une altitude d'environ 20 000 m (65 000 pieds), sinon la mission serait restée secrète, du moins pour le grand public. Le gouvernement pakistanais a soutenu que le franchissement du mur du son était une tentative délibérée de faire valoir que l'armée de l'air pakistanaise (PAF) n'avait dans son inventaire aucun avion pouvant s'approcher de l'altitude de croisière du MiG-25 (jusqu'à 23 000 mètres (74 000 pieds)). L'Inde a nié l'incident, mais le ministre pakistanais des Affaires étrangères, Gohar Ayub Khan, a estimé que le Foxbat avait photographié des installations stratégiques près de la capitale, Islamabad."
 RAJ_jet_recon_equipment_2:0 "HAL/SEPACAT Jaguar EST Reco"
 RAJ_jet_recon_equipment_2_short:0 "Jaguar IS Reco"
 RAJ_jet_recon_equipment_2_desc:0 "Combattant d'attaque au sol monoplace tout temps pour l'Indian Air Force, 35 construits par BAe et 89 construits par HAL (Shamser). Cette version dispose d'un module de reconnaissance monté pour les missions de reconnaissance photographique derrière les lignes ennemies."
  
 #Naval Bomber
 RAJ_nav_bomber_equipment_1:0 "Supermarine Stranraer"
 RAJ_nav_bomber_equipment_1_short:0 "Straner"
 RAJ_nav_bomber_equipment_1_desc:0 "Le Supermarine Stranraer était un hydravion conçu et construit par la société britannique Supermarine Aviation Works. Il a été développé dans les années 1930 pour le compte de son principal opérateur, la Royal Air Force."
 RAJ_nav_bomber_equipment_2:0 "Sunderland court"
 RAJ_nav_bomber_equipment_2_short:0 "Sunderland"
 RAJ_nav_bomber_equipment_2_desc:0 "Le Short S.25 Sunderland était un bombardier de patrouille britannique avec hydravion, développé et construit par Short Brothers pour la Royal Air Force (RAF). L'avion tire son nom de service de la ville (plus tard, ville) et du port de Sunderland, dans le nord-est de l'Angleterre. "

 RAJ_nav_bomber_equipment_5:0 "Avion de patrouille maritime Lockheed L-1049 Super Constellation"
 RAJ_nav_bomber_equipment_5_short:0 "AMP Super Constellation"
 RAJ_nav_bomber_equipment_5_desc:0 "En 1976, l'armée de l'air indienne a remis l'avion Super Constellation au No.312 Albatross Squadron à Dabolim, Goa. A l'époque, ces appareils étant assez anciens, ils furent retirés du service actif en 1983. Pour les remplacer dans le rôle de patrouille maritime, des avions soviétiques furent acquis. L'escadron n°315 Winged Stallions a été mis en service en 1977 avec l'avion Ilyushin Il-38"
 RAJ_nav_bomber_equipment_6:0 "Iliouchine Il-38SD"
 RAJ_nav_bomber_equipment_6_short:0 "Il-38SD"
 RAJ_nav_bomber_equipment_6_desc:0 "L'Ilyushin Il-38 « Dolphin » (nom de l'OTAN ; mai) est un avion de patrouille maritime et un avion de guerre anti-sous-marine conçu en Union soviétique. Il s'agissait d'un développement du transport à turbopropulseur Ilyushin Il-18."
 RAJ_nav_bomber_equipment_7:0 "Tupolev Tu-142ME"
 RAJ_nav_bomber_equipment_7_short:0 "Tu-142ME"
 RAJ_nav_bomber_equipment_7_desc:0 "Le Tupolev Tu-142 est un avion soviéto-russe de reconnaissance maritime et de guerre anti-sous-marine (ASW) dérivé du bombardier stratégique à turbopropulseur Tu-95. Une variante de communication spécialisée, désignée Tu-142MR, était chargée de communications à longue portée avec les sous-marins lance-missiles balistiques soviétiques. Le Tu-142 a été conçu par le bureau d'études Tupolev et fabriqué par les usines de machines Kuibyshev Aviation et Taganrog de 1968 à 1994. Anciennement exploité par la marine soviétique et l'armée de l'air ukrainienne, le Tu-142 sert actuellement dans la marine russe."
 RAJ_nav_bomber_equipment_8:0 "Boeing P-8I Poséidon"
 RAJ_nav_bomber_equipment_8_short:0 "P-8I Poséidon"
 RAJ_nav_bomber_equipment_8_desc:0 "En janvier 2008, Boeing a proposé le P-8I, une variante d'exportation personnalisée du P-8A, à la marine indienne. Il comprend deux composants principaux non installés sur le P-8A, un radar arrière Telephonics APS-143 OceanEye et un détecteur d'anomalies magnétiques (MAD)."
 
 #Tactical Bomber
 RAJ_tac_bomber_equipment_0:0 "Armstrong WhitworthWhitley"
 RAJ_tac_bomber_equipment_0_short:0 "Whitley"
 RAJ_tac_bomber_equipment_1:0 "Vickers Wellington"
 RAJ_tac_bomber_equipment_1_short:0 "Wellington"
 RAJ_tac_bomber_equipment_2:0 "Bristol-Beaufort"
 RAJ_tac_bomber_equipment_2_short:0 "Beaufort"
 RAJ_tac_bomber_equipment_3:0 "de Havilland Mosquito B"
 RAJ_tac_bomber_equipment_3_short:0 "Moustique B"

 RAJ_jet_tac_bomber_equipment_1:0 "Canberra électrique anglais B.2"
 RAJ_jet_tac_bomber_equipment_1_short:0 "Canberra B.2"
 RAJ_jet_tac_bomber_equipment_2:0 "Canberra électrique anglais B.6"
 RAJ_jet_tac_bomber_equipment_2_short:0 "Canberra B.6"
 #RAJ_jet_tac_bomber_equipment_3:0 "Antonov An-12(B)"
 #RAJ_jet_tac_bomber_equipment_3_short:0 "An-12(B)"
 #RAJ_jet_tac_bomber_equipment_3_desc:0 "AN-12 transport aircraft in Indian Air Force service that where converted for dropping bombs from its cargobay. at high altitude during the Indo-pakistani war of 1971. Both sides lacked propper SAM systems to shoot these aircraft down at high altitude. Pakistan responded by using C-130 Hercules aircraft on similar bombing missions."
 RAJ_jet_tac_bomber_equipment_3:0 "Canberra B(I).58"
 RAJ_jet_tac_bomber_equipment_3_short:0 "Canberra B(I).58"
 RAJ_jet_tac_bomber_equipment_3_desc:0 "L'Inde était le plus gros client d'exportation du Canberra et a utilisé le bombardier à bon escient lors des guerres de 1965 et 1971, avec des raids notables sur la base aérienne de Peshawar, les réservoirs de pétrole de Karachi et un certain nombre d'autres cibles militaires dans tout le Pakistan. L'IAF avait plusieurs variantes de Canberra, l'interdicteur B(I)58 étant la plus nombreuse."
 RAJ_jet_tac_bomber_equipment_4:0 "Canberra B(I).66"
 RAJ_jet_tac_bomber_equipment_4_short:0 "Canberra B(I).66"
 RAJ_jet_tac_bomber_equipment_4_desc:0 "L'Inde était le plus gros client d'exportation du Canberra et a utilisé le bombardier à bon escient lors des guerres de 1965 et 1971, avec des raids notables sur la base aérienne de Peshawar, les réservoirs de pétrole de Karachi et un certain nombre d'autres cibles militaires dans tout le Pakistan. L'IAF avait plusieurs variantes de Canberra, l'interdicteur B(I)58 étant la plus nombreuse."
 RAJ_jet_tac_bomber_equipment_5:0 "Mikoyan-Gourevitch MiG-25RBK"
 RAJ_jet_tac_bomber_equipment_5_short:0 "MiG-25RBK"
 RAJ_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBK est un bombardier de reconnaissance monoplace dérivé du MiG-25R, son rôle principal est celui d'un avion ELINT, avec le système Kub-3K ELINT. La capacité de bombardement a cependant été conservée et les caméras n'ont pas été installées. Nom de code OTAN Foxbat-D."

 #Strategic Bomber
 RAJ_strat_bomber_equipment_1:0 "Handley Page Halifax"
 RAJ_strat_bomber_equipment_1_short:0 "Halifax"
 RAJ_strat_bomber_equipment_2:0 "Libérateur B-24L consolidé"
 RAJ_strat_bomber_equipment_2_short:0 "Libérateur B-24L"
 RAJ_strat_bomber_equipment_2_desc:0 "Le B-24 a été conçu en 1941 comme bombardier lourd à long rayon d'action pour l'US Army Air Force. Malgré sa capacité à transporter une lourde charge de bombes associée à une vitesse de croisière élevée, il était relativement difficile de voler à basse altitude et avait un plafond de service inférieur à celui du B-17. Pourtant, le « Liberator » a été préféré par l'état-major américain et a été le bombardier le plus produit pendant la Seconde Guerre mondiale. Comme le B-17, il a bien servi sur le théâtre européen lors de la campagne de bombardement de l'Allemagne, mais a également servi avec distinction sur le théâtre du Pacifique."
 RAJ_strat_bomber_equipment_3:0 "Libérateur B-24J consolidé"
 RAJ_strat_bomber_equipment_3_short:0 "Libérateur B-24J"
 RAJ_strat_bomber_equipment_3_desc:0 "Lorsque l'Inde a obtenu son indépendance en 1947, entre 37 et 42 Liberator ont été ressuscités par HAL et ont servi dans les escadrons n°5, n°6 et n°16. Jusqu'à leur retraite en 1968. C'est à l'Indian Air Force que la majorité des B-24 restants doivent leur existence."

 #VTOL
 RAJ_jump_jet_equipment_3:0 "BAe Sea Harrier FRS Mk.51"
 RAJ_jump_jet_equipment_3_short:0 "Sea Harrier FRS Mk.51"
 RAJ_jump_jet_equipment_3_desc:0 "L'introduction du Sea Harrier a permis le retrait de l'ancien avion de combat indien, le Hawker Sea Hawk, ainsi que le porte-avions de la Marine, INS Vikrant, qui a été considérablement modernisé entre 1987 et 1989. L'Inde a exploité des Sea Harriers à partir des porte-avions INS Vikrant et INS Viraat."
 RAJ_jump_jet_equipment_4:0 "Programme de prolongation de la durée de vie du BAe Sea Harrier FRS Mk.51"
 RAJ_jump_jet_equipment_4_short:0 "Sea Harrier FRS Mk.51 SLEP"
 RAJ_jump_jet_equipment_4_desc:0 "En 2006, la marine indienne a commencé à moderniser jusqu'à 15 Sea Harrier, en installant le radar Elta EL/M-2032 et le missile air-air à moyenne portée Rafael « Derby » BVR. Cela a permis au Sea Harrier de rester en service en Inde au-delà de 2012. En 2009, des accidents avaient réduit la flotte indienne à 12 (contre 30 d'origine)."
  
 #CV Multirole
 RAJ_cv_fighter_equipment_1:0 "Gladiateur des mers Gloster"
 RAJ_cv_fighter_equipment_1_short:0 "Gladiateur des mers"
 RAJ_cv_fighter_equipment_2:0 "Supermarine Seafire Mk.IIc"
 RAJ_cv_fighter_equipment_2_short:0 "Seafire Mk.IIc"
 RAJ_cv_fighter_equipment_3:0 "Supermarine Seafire Mk.XVII"
 RAJ_cv_fighter_equipment_3_short:0 "Seafire Mk.XVII"

 RAJ_cv_jet_multirole_equipment_1:0 "Supermarine Seafire F Mk.47"
 RAJ_cv_jet_multirole_equipment_1_short:0 "Seafire F Mk.47"
 RAJ_cv_jet_multirole_equipment_2:0 "de Havilland Sea Vampire F.20"
 RAJ_cv_jet_multirole_equipment_2_short:0 "Vampire des Mers F.20"
 RAJ_cv_jet_multirole_equipment_3:0 "Hawker Sea Hawk F.3"
 RAJ_cv_jet_multirole_equipment_3_short:0 "Faucon de mer F.3"
 RAJ_cv_jet_multirole_equipment_3_desc:0 "Au service de la marine indienne (à partir de 1960), les Sea Hawks ont été utilisés à bord du porte-avions INS Vikrant, ex-HMS Hercules et ont servi pendant la guerre indo-pakistanaise de 1965 et la guerre indo-pakistanaise de 1971. Au cours de cette dernière guerre, les avions Sea Hawk ont coulé environ une douzaine de navires."
 RAJ_cv_jet_multirole_equipment_4:0 "Hawker Sea Hawk FGA.6"
 RAJ_cv_jet_multirole_equipment_4_short:0 "Sea Hawk FGA.6"
 RAJ_cv_jet_multirole_equipment_4_desc:0 "Au service de la marine indienne (à partir de 1960), les Sea Hawks ont été utilisés à bord du porte-avions INS Vikrant, ex-HMS Hercules et ont servi pendant la guerre indo-pakistanaise de 1965 et la guerre indo-pakistanaise de 1971. Au cours de cette dernière guerre, les avions Sea Hawk ont coulé environ une douzaine de navires."

 RAJ_cv_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29K"
 RAJ_cv_jet_multirole_equipment_10_short:0 "MiG-29K"
 RAJ_cv_jet_multirole_equipment_10_desc:0 "Le programme MiG-29K a été relancé en réponse à la décision de la marine indienne d'acquérir l'ancien porte-avions de la marine soviétique, l'amiral Gorshkov en 2004. Lorsque l'amiral Gorshkov faisait partie de la flotte soviétique, il s'agissait d'un porte-avions/croiseur hybride utilisant des avions à décollage vertical (V/STOL) ; ainsi le pont a été remis à neuf avec une rampe de décollage et des câbles d'arrêt pour faire fonctionner les MiG-29K. L'avion possède une aile agrandie et repliable, un crochet d'arrêt et un fuselage renforcé protégé contre la corrosion."
 
 #RAJ_cv_mr_stealth_fighter_equipment_1:0 "HAL Twin Engine Deck-Based Fighter"
 #RAJ_cv_mr_stealth_fighter_equipment_1_short:0 "TEDBF"
 #RAJ_cv_mr_stealth_fighter_equipment_1_desc:0 "The HAL Twin Engine Deck Based Fighter (TEDBF) is a canard delta wing, twin-engine, carrier based, multirole combat aircraft currently under development for the Indian Navy. The TEDBF is designed and developed by the Aeronautical Development Agency (ADA) and will be manufactured by Hindustan Aeronautics Limited (HAL)."
 
