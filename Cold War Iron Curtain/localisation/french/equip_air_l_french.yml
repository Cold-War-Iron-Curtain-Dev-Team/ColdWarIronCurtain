 #SOUTH VIETNAM#
 VIE_fighter_equipment_0:0 "Force aérienne de la République du Vietnam"
 VIE_fighter_equipment_0_short:0 "RVNAF"
 VIE_fighter_equipment_0_desc:0 "L'armée de l'air du Sud-Vietnam, officiellement l'armée de l'air de la République du Vietnam (RVNAF). FAVN, parfois appelée Force aérienne du Vietnam ou VNAF, était la branche aérienne des forces militaires de la République du Vietnam, l'armée officielle de la République du Vietnam (Sud-Vietnam) de 1955 à 1975."

 VIE_fighter_equipment_1:0 "Curtiss P-40 Warhawk"
 VIE_fighter_equipment_1_short:0 "Faucon de guerre P-40"
 VIE_fighter_equipment_1_desc:0 "Le P-40 était un avion de combat monomoteur entièrement métallique développé en 1938 et était une version modifiée du P-36 Hawk. Ce type serait utilisé par un nombre important de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il soit inférieur aux derniers P-47 et P-51, il servirait en première ligne jusqu'à la fin de la guerre. 200 pilotes alliés de 7 pays différents, des États-Unis aux pays du Commonwealth britannique en passant par l'Union soviétique, sont devenus des as du P-40. Malgré les désignations différentes pour le service du Commonwealth et le service soviétique, le surnom officiel du service américain est « Warhawk »."
 VIE_fighter_equipment_2:0 "République F-47 Thunderbolt"
 VIE_fighter_equipment_2_short:0 "F-47 Tonnerre"
 VIE_fighter_equipment_2_desc:0 "Le P-47 était le développement ultérieur des avions Seversky (le prédécesseur de Republic) P-35 et Republic P-43 Lancer. Bien qu'il ait été conçu à l'origine comme un chasseur de supériorité aérienne. La renommée du P-47 était sa capacité à transporter une lourde charge de bombes, marquant ainsi le début de l'héritage de l'entreprise en matière de développement d'avions d'appui aérien rapproché (CAS). Ce type a été utilisé dans une myriade de nations alliées pendant la Seconde Guerre mondiale et a continué à fonctionner ainsi après la guerre, certains affirmant que ce type, et non le P-51 Mustang, aurait dû être utilisé en Corée. Son surnom est « Thunderbolt », le premier dans les conventions de dénomination modernes de Republic. A été rebaptisé F-47 en 1948."
 VIE_fighter_equipment_3:0 "F-51D Mustang nord-américain"
 VIE_fighter_equipment_3_short:0 "F-51D Mustang"
 VIE_fighter_equipment_3_desc:0 "Le P-51 est considéré comme l'un des meilleurs chasseurs jamais produits dans l'histoire de l'aviation. Développé par North American Aviation. Le type est entré en service en 1942. Initialement utilisé comme avion de reconnaissance tactique, le type allait, avec l'introduction de la variante « D », devenir célèbre comme le premier chasseur à domination aérienne au monde, assurant l'escorte des bombardiers américains et alliés lors des campagnes de bombardement les plus célèbres du théâtre européen, détruisant près de 5 000 avions pendant la guerre. Plus tard désigné F-51, il servira avec distinction comme avion CAS pendant la guerre de Corée, et le « Mustang », le cheval de trait de l'USAAAF, continuera son service jusqu'en 1968."

 VIE_heavy_fighter_equipment_1:0 "Lockheed P-38 Foudre"
 VIE_heavy_fighter_equipment_1_short:0 "Foudre P-38"
 VIE_heavy_fighter_equipment_1_desc:0 "Un avion à double moteur à pistons conçu en mettant l'accent sur la vitesse et les armements lourds. Pendant la Seconde Guerre mondiale, sa vitesse a été utilisée dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme particulière lui a valu le nom de « der Gabelschwanz-Teufel » ou « le diable à queue fourchue » en Allemagne et de « Ni hikouki, ippairotto » ou « deux avions, un pilote » au Japon. Il est également connu sous le nom de « Foudre »."
 VIE_heavy_fighter_equipment_2:0 "Northrop F-61 Veuve Noire"
 VIE_heavy_fighter_equipment_2_short:0 "F-61 Veuve Noire"
 VIE_heavy_fighter_equipment_2_desc:0 "Le P-61, comme le P-38 avant lui, est un avion à double flèche conçu en 1944. C'était le premier chasseur de nuit américain, équipé d'un radar (une autre première) pour suivre les bombardiers et autres cibles et les intercepter la nuit et dans des conditions météorologiques défavorables. Associé à ses quatre canons Hispano de 20 mm, le P-61 (plus tard F-61), surnommé la « Veuve noire » d'après la célèbre araignée américaine, est aussi mortel que son nom l'indique."
 VIE_heavy_fighter_equipment_3:0 "F-82 Twin Mustang nord-américain"
 VIE_heavy_fighter_equipment_3_short:0 "F-82 Twin Mustang"
 VIE_heavy_fighter_equipment_3_desc:0 "Développé à l'origine comme chasseur d'escorte à longue portée pour la Seconde Guerre mondiale, le P-82 a été introduit en 1946, trop tard pour servir dans le conflit. Développé à partir du vénéré P-51, le P-82 (plus tard F-82) a été utilisé en remplacement du P-61 Black Widow et a été équipé d'un radar pour soutenir le Commandement stratégique aérien. Parce que la cellule ressemble à 2 P-51 en kit, elle a reçu le surnom de « Twin Mustang »."

 VIE_strat_bomber_equipment_1:0 "Forteresse volante Boeing B-17"
 VIE_strat_bomber_equipment_1_short:0 "Forteresse volante B-17"
 VIE_strat_bomber_equipment_1_desc:0 "Le B-17 est un bombardier stratégique quadrimoteur développé au milieu des années 1930 pour l'US Army Air Corps. C'était le troisième bombardier le plus produit pendant la Seconde Guerre mondiale et il a servi avec distinction sur le théâtre européen du conflit, responsable des campagnes de bombardement en Allemagne à partir de bases du sud de l'Angleterre et de l'Italie. Son armement défensif hérissé convient parfaitement à un avion surnommé la « Forteresse volante »."
 VIE_strat_bomber_equipment_2:0 "Libérateur B-24 consolidé"
 VIE_strat_bomber_equipment_2_short:0 "Libérateur B-24"
 VIE_strat_bomber_equipment_2_desc:0 "Le B-24 a été conçu en 1941 comme bombardier lourd à long rayon d'action pour l'US Army Air Force. Malgré sa capacité à transporter une lourde charge de bombes associée à une vitesse de croisière élevée, il était relativement difficile de voler à basse altitude et avait un plafond de service inférieur à celui du B-17. Pourtant, le « Liberator » a été préféré par l'état-major américain et a été le bombardier le plus produit pendant la Seconde Guerre mondiale. Comme le B-17, il a bien servi sur le théâtre européen lors de la campagne de bombardement de l'Allemagne, mais a également servi avec distinction sur le théâtre du Pacifique."
 VIE_strat_bomber_equipment_3:0 "Boeing B-29 Superforteresse"
 VIE_strat_bomber_equipment_3_short:0 "Superforteresse B-29"
 VIE_strat_bomber_equipment_3_desc:0 "Le B-29 était un bombardier quadrimoteur à hélices introduit en 1944. Il s'agissait du projet d'armement le plus coûteux jamais réalisé pendant la guerre, dépassant même le coût du programme d'armes nucléaires des États-Unis à l'époque. Conçu comme un bombardier stratégique à haute altitude, il a été utilisé comme bombardier incendiaire nocturne à basse altitude, lançant des raids à la bombe incendiaire sur le Japon. Mais la renommée de la « Superforteresse » réside dans le largage des bombes atomiques sur Hiroshima et Nagasaki, qui ont contribué à la fin de la guerre. Les variantes mises à jour (y compris le B-50 redésigné) continueraient à servir de bombardier stratégique pendant la guerre de Corée avant de prendre leur retraite au début des années 1950."

 VIE_tac_bomber_equipment_0:0 "Douglas B-18 Bolo"
 VIE_tac_bomber_equipment_0_short:0 "B-18 Bolo"
 VIE_tac_bomber_equipment_0_desc:0 "Le B-18, introduit en 1936, était un bombardier moyen développé pour remplacer le précédent Martin B-10. Bien que décent au moment de son introduction. Il fut rapidement rendu obsolète en 1940, et relégué aux avions de guerre anti-sous-marine et de transport. Malgré cela, le « Bolo» allait devenir le premier avion américain à couler un sous-marin allemand pendant la Seconde Guerre mondiale."
 VIE_tac_bomber_equipment_1:0 "Douglas B-23 Dragon"
 VIE_tac_bomber_equipment_1_short:0 "Dragon B-23"
 VIE_tac_bomber_equipment_1_desc:0 "Développé comme successeur raffiné du B-18 Bolo, le B-23 était plus rapide et transportait une charge de bombes et un armement défensif plus lourds. Cependant, le « Dragon » s'est avéré inférieur à ses contemporains, les B-25 et B-26, et a été largement relégué au rang d'avion d'entraînement pendant la Seconde Guerre mondiale."
 VIE_tac_bomber_equipment_2:0 "B-25 Mitchell nord-américain"
 VIE_tac_bomber_equipment_2_short:0 "B-25 Mitchell"
 VIE_tac_bomber_equipment_2_desc:0 "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres impliquant des avions pendant la guerre, l'utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardement aérien réussie sur le continent japonais pendant la guerre. Son surnom est « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
 VIE_tac_bomber_equipment_3:0 "Martin B-26C Envahisseur"
 VIE_tac_bomber_equipment_3_short:0 "Envahisseur B-26C"
 VIE_tac_bomber_equipment_3_desc:0 "Le B-26 a été développé en 1941 comme bombardier moyen parallèlement au B-25. Un avion difficile à piloter au départ, il a été étiqueté comme « Widowmaker » en raison du nombre de fois où les pilotes formés à ce type se sont écrasés et sont morts. Après que des modifications aient été apportées et que les pilotes soient correctement formés, il s'est avéré être un bombardier tactique performant, servant en Europe occidentale ainsi que sur les théâtres du Pacifique et de la Méditerranée pendant la Seconde Guerre mondiale. Surnommé « Marauder », le type prendra sa retraite en 1947, avant que l'armée de l'air ne soit séparée par l'armée (et c'est la raison pour laquelle l'A-26 Invader a été brièvement nommé B-26.)"

 VIE_nav_bomber_equipment_1:0 "PBY-1 Catalina consolidé"
 VIE_nav_bomber_equipment_1_short:0 "PBY-1"
 VIE_nav_bomber_equipment_1_desc:0 "Variante de production initiale avec deux moteurs R-1830-64 de 900 ch. Le Consolidated PBY Catalina est un hydravion et un avion amphibie produits dans les années 1930 et 1940. En service au Canada, il était connu sous le nom de Canso. C'était l'un des hydravions les plus utilisés de la Seconde Guerre mondiale. Catalinas a servi dans toutes les branches des forces armées des États-Unis ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont servi jusque dans les années 1980. En 2021, 86 ans après son premier vol, l'avion continue de voler comme bombardier à eau (ou avion-citerne) dans le cadre d'opérations aériennes de lutte contre les incendies dans certaines régions du monde. Aucun ne reste au service militaire. "
 VIE_nav_bomber_equipment_2:1 "PBY-5 Catalina consolidé"
 VIE_nav_bomber_equipment_2_short:1 "PBY-5"
 VIE_nav_bomber_equipment_2_desc:0 "Le Consolidated PBY Catalina est un hydravion et un avion amphibie produits dans les années 1930 et 1940. En service au Canada, il était connu sous le nom de Canso. C'était l'un des hydravions les plus utilisés de la Seconde Guerre mondiale. Catalinas a servi dans toutes les branches des forces armées des États-Unis ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont servi jusque dans les années 1980. En 2021, 86 ans après son premier vol, l'avion continue de voler comme bombardier à eau (ou avion-citerne) dans le cadre d'opérations aériennes de lutte contre les incendies dans certaines régions du monde. Aucun ne reste au service militaire. "
 VIE_nav_bomber_equipment_3:0 "Corsaire consolidé PB4Y-2"
 VIE_nav_bomber_equipment_3_short:0 "Corsaire PB4Y-2"
 VIE_nav_bomber_equipment_3_desc:0 "Le Consolidated PB4Y-2 Privateer est un bombardier de patrouille américain de la Seconde Guerre mondiale et de la guerre de Corée dérivé du Consolidated B-24 Liberator."

 VIE_CAS_equipment_2:0 "Douglas A-20 Ravage"
 VIE_CAS_equipment_2_short:0 "A-20 ravages"
 VIE_CAS_equipment_2_desc:0 "L'A-20, surnommé « Havoc », a été introduit en 1941 comme bombardier léger et avion d'attaque au sol. En service aux États-Unis et dans le Commonwealth, sa renommée est venue de son service dans l'armée de l'air et la marine de l'Union soviétique, qui ont reçu les deux tiers de la variante A-20B et de nombreux modèles G&H. Modifiés avec des mitrailleuses de 7,62 mm à tir plus rapide et un canon à tir vers l'avant, ces types ont servi avec distinction sur le front de l'Est contre les chars allemands et ont été les bombardiers de fabrication étrangère les plus nombreux utilisés par l'armée de l'air soviétique pendant la Seconde Guerre mondiale. Les variantes de chasseurs étaient également appelées P-70."
 VIE_CAS_equipment_3:0 "A-36 Apache nord-américain"
 VIE_CAS_equipment_3_short:0 "A-36 Apache"
 VIE_CAS_equipment_3_desc:0 "L'A-36 a été développé comme une variante d'attaque au sol du célèbre P-51 Mustang. Bombardier en piqué, il s'est bien comporté en Afrique du Nord, en Méditerranée, en Italie et sur les théâtres Chine-Birmanie-Inde de la Seconde Guerre mondiale. Connu pour ses aérofreins rectangulaires distinctifs au bout des ailes. L'« Apache », du nom de la tribu amérindienne, s'est révélé mortel au cours de sa courte carrière, servant de 1942 jusqu'à sa retraite à la fin de la guerre en 1945."

 VIE_CAS_equipment_4:0 "Douglas A-26C Envahisseur"
 VIE_CAS_equipment_4_short:0 "Envahisseur A-26C"
 VIE_CAS_equipment_4_desc:0 "L'A-26 est un avion d'attaque rapide bimoteur développé et destiné à remplacer l'A-20 Havoc. Introduit en 1943, l'Invader a servi dans l'armée de l'air américaine pendant la Seconde Guerre mondiale, attaquant les positions japonaises dans les Indes néerlandaises et aux Philippines, ainsi qu'en Europe lors de campagnes dans la vallée du Pô, dans le nord de l'Italie. Ils ont continué leur service en Corée, participant à des missions de bombardement contre la Corée, et ont été les premiers avions à lancer une sortie dans ce conflit. L'« Invader » a poursuivi sa carrière au Vietnam, soutenant les opérations de la CIA au Laos contre les forces vietcongs. Avec une riche carrière au cours de trois guerres, l'« Invader » a fait ses preuves et a montré de quoi un avion CAS était capable."

 VIE_cv_CAS_equipment_4:0 "Douglas AD Skyraider"
 VIE_cv_CAS_equipment_4_short:0 "Douglas AD Skyraider"
 VIE_cv_CAS_equipment_4_desc:0 "Le Douglas AD est un engin d'attaque rapide fiable basé sur un porte-avions. Conçu à l'origine comme un bombardier torpilleur et en piqué, l'AD (à l'origine le BT2D) est entré en service en 1946 et se comportera avec une grande distinction pendant la guerre de Corée, devenant ainsi le principal avion d'attaque au sol des forces de l'US Navy et du Marine Corp. Même si la plupart des avions à hélices seraient retirés du service après le conflit coréen, le nouveau A-1 resta en service et joua un rôle clé en tant qu'avion d'appui aérien rapproché, et le « Skyraider » servira avec distinction jusqu'à la fin de l'implication américaine au Vietnam."

 VIE_cv_nav_bomber_equipment_1:0 "Douglas À déterminer Dévastateur"
 VIE_cv_nav_bomber_equipment_1_short:0 "Dévastateur à déterminer"
 VIE_cv_nav_bomber_equipment_1_desc:0 "Lorsque le TBD est entré en service en 1937, il était encore largement considéré comme l'un des meilleurs bombardiers torpilleurs lors de son introduction. Cependant, malgré quelques succès au début de la guerre, au moment de l'attaque japonaise sur Pearl Harbor, le « Devastator » était malheureusement obsolète, et cela s'est avéré tel au moment de la bataille de Midway, lorsque presque toute la force des Devastators utilisés dans la bataille a été anéantie. Bien que attribué plus tard à une mauvaise couverture aérienne et à des défauts de la torpille qu'il transportait normalement. Le TBD a été progressivement retiré du service actif immédiatement après la bataille et complètement retiré du service en 1944."
 VIE_cv_nav_bomber_equipment_2:0 "Grumman TBF-1C Vengeur"
 VIE_cv_nav_bomber_equipment_2_short:0 "Vengeur TBF-1C"
 VIE_cv_nav_bomber_equipment_2_desc:0 "La variante TBF-1C de l'Avenger a amélioré la conception originale du TBF-1 en prévoyant deux mitrailleuses de 12,7 mm (calibre.50) montées sur les ailes et des réservoirs de carburant montés sur les ailes qui ont doublé la portée et la puissance d'attaque vers l'avant de l'avion."
 VIE_cv_nav_bomber_equipment_3:0 "Corsaire consolidé PB4Y-2"
 VIE_cv_nav_bomber_equipment_3_short:0 "Corsaire PB4Y-2"
 VIE_cv_nav_bomber_equipment_3_desc:0 "Le Consolidated PB4Y-2 Privateer est un bombardier de patrouille américain de la Seconde Guerre mondiale et de la guerre de Corée dérivé du Consolidated B-24 Liberator."

 VIE_CAS_equipment_1:0 "Northrop A-17"
 VIE_CAS_equipment_1_short:0 "A-17"
 VIE_CAS_equipment_1_desc:0 "L'A-17 était un avion d'attaque monoplan biplace et monomoteur développé en 1935 et dérivé du Northrop Gamma 2F. Un avion fiable et populaire. Ce type servirait d'avion de patrouille côtière pour les unités ennemies qui pourraient traverser le canal de Panama au cours des premières étapes de la Seconde Guerre mondiale après Pearl Harbor, et serait utilisé à titre utilitaire jusqu'à sa retraite en 1944."
 VIE_cv_CAS_equipment_2:0 "Douglas SBD-2 Intrépide"
 VIE_cv_CAS_equipment_2_short:0 "SBD-2 Intrépide"
 VIE_cv_CAS_equipment_2_desc:0 "Le SBD-2 a été conçu comme avion de reconnaissance et bombardier en piqué en 1940 et était le principal avion de ce type pour la marine américaine. Le « Dauntless », déjà un bombardier en piqué performant, a été amélioré avec la variante -2 avec un armement différent et une capacité de carburant accrue, n'était qu'un pis-aller mineur par rapport aux modèles ultérieurs. Les variantes de l'USAAF l'appelaient l'A-24 Banshee."
 VIE_cv_CAS_equipment_3:0 "Curtiss SB2C-1 Helldiver"
 VIE_cv_CAS_equipment_3_short:0 "SB2C-1 Helldiver"
 VIE_cv_CAS_equipment_3_desc:0 "Remplaçant le SBD Dauntless, le SB2C, introduit en 1942, était bien plus rapide que le SBD qu'il remplaçait, mais c'était un avion difficile à piloter, ce qui lui valut le surnom désobligeant de « SOB, 2e classe ». Malgré cela et un rapport cinglant qui gâchera à jamais l'héritage de la Curtiss Aircraft Company, le « Helldiver » eut un excellent bilan de combat tout au long de la guerre du Pacifique. La variante de l'USAAF l'appelait A-25 Shrike."

 VIE_cv_fighter_equipment_0:0 "Grumman FF 'Fifi'"
 VIE_cv_fighter_equipment_0_short:0 "FF 'Fifi'"
 VIE_cv_fighter_equipment_0_desc:0 "Introduit en 1933, le Grumman FF fut le premier modèle complet de l'entreprise destiné à la marine américaine. Surnommé de manière informelle « Fifi » (d'après la désignation de FF), le Grumman FF a bien servi comme l'un des premiers biplans capables de transporter des avions tout au long des années 30 avant de prendre sa retraite en 1940."
 VIE_cv_fighter_equipment_1:0 "Grumman F3F"
 VIE_cv_fighter_equipment_1_short:0 "F3F"
 VIE_cv_fighter_equipment_1_desc:0 "Le Grumman F3F, lors de son introduction en 1936, était le dernier avion de combat biplan livré à la marine américaine et à toute branche de l'armée américaine en général. Malgré son bref service (retiré du service de première ligne en 1941 et du service en général en 1943), il s'agissait toujours d'un avion assez performant, le dernier d'une époque d'avions monoplans qui constitueraient l'avenir du combat de combat."
 VIE_cv_fighter_equipment_2:0 "Vought F4U-5 Corsaire"
 VIE_cv_fighter_equipment_2_short:0 "Corsaire F4U-5"
 VIE_cv_fighter_equipment_2_desc:0 "Le Vought F4U Corsair est un avion de combat américain qui a servi principalement pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair fut bientôt très demandé ; des contrats de production supplémentaires furent accordés à Goodyear, dont les Corsairs furent désignés FG, et Brewster, désignés F3A. Le Corsair fut conçu et exploité comme un avion embarqué et entra en service en grand nombre dans la marine américaine à la fin de 1944 et au début de 1945. Il devint rapidement l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 VIE_cv_fighter_equipment_3:0 "Grumman F8F Bearcat"
 VIE_cv_fighter_equipment_3_short:0 "F8F Ourscat"
 VIE_cv_fighter_equipment_3_desc:0 "Le Grumman F8F Bearcat est un avion de combat monomoteur américain embarqué à la fin de la Seconde Guerre mondiale. Il a servi au milieu du XXe siècle dans la marine américaine, le corps des Marines des États-Unis et les forces aériennes d'autres pays. C'était le dernier avion de combat à moteur à pistons de Grumman Aircraft."
 
 VIE_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 VIE_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Foudre II"
 VIE_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour le déploiement de porte-avions. Le développement du programme F-35 a commencé en 1992, et la variante C était dans les airs dès 2010 et était opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses frères et soeurs, la variante C présente des ailes plus grandes avec des sections de bout d'aile pliables."
 
 VIE_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 VIE_jump_stealth_equipment_1_short:0 "F-35B Foudre II"
 VIE_jump_stealth_equipment_1_desc:0 "Un chasseur polyvalent produit à l'aide d'une conception JSF (Joint Strike Fighter). Bien qu'il soit capable d'utiliser une variété d'armes dans les combats air-air et sol-sol, le coût d'acquisition de ce chasseur furtif est plus gérable que celui du F-22A. Conformément à son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 
 VIE_cas_stealth_equipment_1:0 "Fairchild République A-10C Thunderbolt II"
 VIE_cas_stealth_equipment_1_short:0 "A-10C Thunderbolt II"
 VIE_cas_stealth_equipment_1_desc:0 "La variante C de l'A-10 « Thunderbolt II » a été développée en 2005 à la suite du programme de mise à niveau Precision Engagement. Tirant les leçons du prototype YA-10B, l'A-10C est doté d'un système de contrôle de tir modernisé, d'une suite ECM et de capacités de ciblage intelligent des bombes. Le module d'identification ami ou ennemi et la suite de communications ont également été mis à jour et modernisés. En partie en raison de ses performances dans l'histoire récente et de la pression politique, l'A-10 continuera probablement à servir dans une capacité de combat pour l'US Air Force dans un avenir proche."

 VIE_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 VIE_mr_stealth_fighter_equipment_1_short:0 "F-35A Foudre II"
 VIE_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnel (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le développement du programme F-35 a commencé en 1992, la variante A prenant son envol fin 2006 et larguant ses premières bombes moins de six ans plus tard. La variante A est la variante la plus petite et la plus légère du F-35 et est principalement destinée à remplacer le F-16 Fighting Falcon."
 
 VIE_jet_multirole_equipment_1:0 "Grumman F8F-1(D)B Bearcat"
 VIE_jet_multirole_equipment_1_short:0 "F8F-1(D)B Bearcat"
 VIE_jet_multirole_equipment_1_desc:0 "Le Grumman F8F Bearcat est un avion de combat monomoteur américain embarqué à la fin de la Seconde Guerre mondiale. Il a servi au milieu du XXe siècle dans la marine américaine, le corps des Marines des États-Unis et les forces aériennes d'autres pays. C'était le dernier avion de combat à moteur à pistons de Grumman Aircraft."
 VIE_jet_multirole_equipment_2:0 "Sabre nord-américain F-86A"
 VIE_jet_multirole_equipment_2_short:0 "Sabre F-86A"
 VIE_jet_multirole_equipment_2_desc:0 "Le F-86 est un chasseur à réaction à ailes en flèche développé et introduit à la fin des années 1940 à partir de recherches capturées par les Allemands. La conception de l'avion le rendait capable d'atteindre des vitesses transsoniques et une grande maniabilité, caractéristiques qui le rendaient capable de gérer son célèbre rival, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, aux côtés de ses variantes canadiennes et australiennes réunies, en ferait l'avion de combat occidental le plus produit de l'histoire de l'aviation."
 VIE_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 VIE_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 VIE_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 VIE_jet_multirole_equipment_4:0 "Super Sabre nord-américain F-100"
 VIE_jet_multirole_equipment_4_short:0 "F-100 Super Sabre"
 VIE_jet_multirole_equipment_4_desc:0 "Premier chasseur à réaction capable d'atteindre une vitesse supersonique en vol en palier, le F-100 était un avion multirôle capable conçu pour affronter l'ennemi face à face. Développé à partir du F-86 Sabre, le F-100 adoptera le surnom de « Super Sabre », mais recevra également le surnom de « Hun » en raison de sa désignation dans l'USAF à l'époque. Ce type servirait au Vietnam comme chasseur-bombardier et fut le premier à être utilisé dans le rôle de suppression de la défense aérienne ennemie, connu sous le nom de Wild Weasel."
 VIE_jet_multirole_equipment_5:0 "Northrop F-5C Skoshi Tigre"
 VIE_jet_multirole_equipment_5_short:0 "F-5C Skoshi Tigre"
 VIE_jet_multirole_equipment_5_desc:0 "Douze F-5A Freedom Fighters ont été testés par l'US Air Force pendant quatre mois et demi au Vietnam. Modifié à l'usine de Palmdale en ajoutant une sonde de ravitaillement en vol amovible et non rétractable sur le côté gauche, 90 lb de plaques de blindage externes sous le cockpit et le moteur, et des pylônes de stockage largables."
 VIE_jet_multirole_equipment_6:0 "McDonnell Douglas F-4D Phantom II"
 VIE_jet_multirole_equipment_6_short:0 "F-4D Fantôme II"
 VIE_jet_multirole_equipment_6_desc:0 "F-4C avec avionique mise à jour et radar AN/APQ-109."
 VIE_jet_multirole_equipment_7:0 "McDonnell Douglas F-4E Phantom II"
 VIE_jet_multirole_equipment_7_short:0 "F-4E Fantôme II"
 VIE_jet_multirole_equipment_7_desc:0 "Version USAF avec un canon M61 Vulcan intégré dans le nez allongé du RF-4C, un radar AN/APQ-120 avec une section plus petite pour accueillir le canon, des moteurs J79-GE-17 avec 17 900 lbf (79,379 kN) de poussée de postcombustion chacun. Avions de dernière série équipés de lattes de pointe pour améliorer la maniabilité au détriment de la vitesse de pointe dans le cadre du programme Agile Eagle. À partir du bloc 53, les avions ont ajouté la capacité AGM-65 Maverick et les moteurs sans fumée J79-GE-17C ou -17E. Premier vol le 1er août 1965. La variante Phantom la plus nombreuse ; 1 370 construits."
 VIE_jet_multirole_equipment_8:0 "Northrop F-5E Tigre II"
 VIE_jet_multirole_equipment_8_short:0 "F-5E Tigre II"
 VIE_jet_multirole_equipment_9:0 "Northrop F-5E Tigre III"
 VIE_jet_multirole_equipment_9_short:0 "F-5E Tigre III"
 VIE_jet_multirole_equipment_10:0 "Projet de modernisation incrémentielle du McDonnell Douglas F/A-18 Hornet, phase I"
 VIE_jet_multirole_equipment_10_short:0 "F/A-18 Hornet IMP Phase I"
 VIE_jet_multirole_equipment_10_desc:0 "L'armée de l'air sud-vietnamienne était un grand fan des séries d'avions Northrop F-5 Freedom Fighter et Tiger II. Le YF-17 étant l'héritier de ce programme mais s'avérant finalement infructueux. Et si le Sud-Vietnam avait survécu ? Et si le Sud-Vietnam était celui qui réunirait les deux Vietnams ? Aurait-elle cherché à se procurer des F/A-18 ?"

 VIE_jet_interceptor_equipment_1:0 "Lockheed F-94 Starfire"
 VIE_jet_interceptor_equipment_1_short:0 "F-94 Starfire"
 VIE_jet_interceptor_equipment_1_desc:0 "Développé à partir du F-80 Shooting Star, le F-94 a été conçu pour remplacer les F-61 Black Widow et les F-82 Twin Mustang Heavy Night Fighters à hélices. Initialement équipé d'un armement de canons (quatre, puis huit mitrailleuses de 12,7 mm), son armement de canons serait remplacé par un composant entièrement de fusée, lancé depuis ses baies internes. « Surnommé Starfire », ce serait le premier intercepteur à réaction majeur de l'histoire de l'USAF."
 VIE_jet_interceptor_equipment_2:0 "Chien Sabre F-86D nord-américain"
 VIE_jet_interceptor_equipment_2_short:0 "Chien sabre F-86D"
 VIE_jet_interceptor_equipment_2_desc:0 "Développé comme un intercepteur tous temps, le F-86D (initialement désigné F-95) a repris les performances impressionnantes du F-86 Sabrejet et les a améliorées, en ajoutant un radar (donnant à la variante son radôme avant distinctif), un fuselage plus long et un moteur de postcombustion plus gros. Équipé à l'origine d'une baie de lancement de fusée interne pour l'interception des bombardiers, les variantes ultérieures du « Sabre Dog » seraient équipées de canons."
 VIE_jet_interceptor_equipment_3:0 "Northrop F-89 Scorpion"
 VIE_jet_interceptor_equipment_3_short:0 "F-89 Scorpion"
 VIE_jet_interceptor_equipment_3_desc:0 "Le F-89 (à l'origine P-89) est un intercepteur tout temps conçu dès l'origine pour ce rôle lors de son entrée en service en 1954. Initialement équipé d'un armement à canon, celui-ci sera progressivement abandonné dans la version de production au profit d'un armement de fusée. Plus tard, le « Scorpion » recevra un coup supplémentaire avec l'introduction d'un armement de missiles, le premier avion à réaction à utiliser un tel armement."
 VIE_jet_interceptor_equipment_4:0 "Poignard Convair F-102A Delta"
 VIE_jet_interceptor_equipment_4_short:0 "Dague Delta F-102A"
 VIE_jet_interceptor_equipment_4_desc:0 "Premier chasseur à réaction à ailes delta des États-Unis, le F-102 a été le premier chasseur supersonique utilisé par l'US Air Force, capable d'atteindre des vitesses de Mach 1. Il a été conçu comme un intercepteur et un tueur de bombardiers, remplaçant le F-89 Scorpion, et était capable d'abattre des avions ennemis avec des roquettes et des missiles embarqués depuis sa baie interne, le premier avion de combat à présenter cette conception. Le « Delta Dagger » servirait pendant les premières périodes de la guerre du Vietnam comme avion d'escorte de bombardiers et d'attaque au sol."
 VIE_jet_interceptor_equipment_5:0 "McDonnell F-101B Voodoo"
 VIE_jet_interceptor_equipment_5_short:0 "F-101B Vaudou"
 VIE_jet_interceptor_equipment_5_desc:0 "Le F-101, introduit en 1957, a été initialement conçu comme un bombardier d'escorte à longue portée ou un chasseur de pénétration pour le Commandement aérien stratégique de l'USAF. (SAC) Cela changerait lorsqu'il deviendrait un chasseur-bombardier à capacité nucléaire pour le Commandement aérien tactique (TAC). Le « Voodoo » avait une grande portée. Depuis ses bases en Allemagne de l'Ouest, il pourrait frapper n'importe quel pays du Pacte de Varsovie et pénétrer directement jusqu'à 800 km de profondeur en territoire soviétique."
 VIE_jet_interceptor_equipment_6:0 "Convair F-106A Delta Fléchette"
 VIE_jet_interceptor_equipment_6_short:0 "F-106A Delta Fléchette"
 VIE_jet_interceptor_equipment_6_desc:0 "Le F-106 était un développement ultérieur du F-102 Delta Dagger. Introduit en 1959, le F-106, comme son prédécesseur, n'était pas équipé de canon embarqué et s'appuyait donc sur des missiles pour engager les bombardiers ennemis. Il était équipé du missile infrarouge AIM-4 et d'un AIM-26 à pointe nucléaire. Surnommé « Ultimate Interceptor », le « Delta Dart » transporterait ses armes dans une baie interne, une caractéristique de conception qui ne serait pas utilisée sur les avions de combat avant la 5e génération d'avions de combat à réaction."
 VIE_jet_interceptor_equipment_7:0 "F-106A nord-américain « Six Shooter »"
 VIE_jet_interceptor_equipment_7_short:0 "F-106A « Six tireurs »"
 VIE_jet_interceptor_equipment_7_desc:0 "Après son introduction, le F-106 a été progressivement mis à jour en service, avec une avionique améliorée, une aile modifiée présentant une cambrure conique notable, un système de recherche et de suivi infrarouge, des réservoirs d'aile supersoniques rationalisés qui n'apportaient pratiquement aucune dégradation aux performances globales de l'avion, une meilleure instrumentation et des fonctionnalités telles qu'un réceptacle de ravitaillement en vol et un crochet d'arrêt pour les urgences à l'atterrissage. Project Six Shooter a ajouté une disposition pour un canon M61 Vulcan et un viseur optique."
 #VIE_jet_interceptor_equipment_8:0 "McDonnell Douglas F-15A Eagle"
 #VIE_jet_interceptor_equipment_8_short:0 "F-15A Eagle"
 #VIE_jet_interceptor_equipment_8_desc:0 "An advanced Air Superiority fighter featuring hardpoints for a multitude of weapons systems and advanced avionics able to go toe to toe with the most advanced enemy fighters. An all-weather, large scale fighter. Boasting a phenomenal maximum speed even among fighters, it has an abundance of ordnance loaded on board. Named the 'Eagle', it has such a high level of stability performance that it holds the record for recovering after losing a wing in battle."
 #VIE_jet_interceptor_equipment_9:0 "McDonnell Douglas F-15C Eagle"
 #VIE_jet_interceptor_equipment_9_short:0 "F-15C Eagle"
 #VIE_jet_interceptor_equipment_9_desc:0 "An upgraded version of the all weather, air superiority F-15 platform, the 'C' variant comes with a improved radar that can track up to a dozen enemy aircraft at any one time, as well as being able to simultaneously engage half of these at once. The type has seen service in a myriad of countries outside of the United States, from Saudi Arabia to Israel, and is the more common variant of the 'Eagle' in service, retaining its stellar kill record."

 #VIE_high_mach_jet_interceptor_equipment_1:0 "Convair XF-92"
 #VIE_high_mach_jet_interceptor_equipment_1_short:0 "XF-92"
 #VIE_high_mach_jet_interceptor_equipment_1_desc:0 "The XF-92 was a design concept conceived by Convair for a high speed point defense interceptor. Capable of going past Mach 1, it would have been able to keep up with the still prop-driven bomber aircraft that would have been its prey at the time. It was also the company's and thus America's first foray into the delta-wing design. Despite its cancellation, the XF-92 would later lead to the development of the F-102 Delta Dagger and F-106 Delta Dart."
 VIE_high_mach_jet_interceptor_equipment_2:0 "Chasseur stellaire Lockheed F-104A"
 VIE_high_mach_jet_interceptor_equipment_2_short:0 "Chasseur F-104A"
 VIE_high_mach_jet_interceptor_equipment_2_desc:0 "Le F-104 a été conçu pour répondre au désir du pilote de disposer d'un avion simple, petit et offrant d'excellentes performances. Le résultat serait cet avion, qui était l'un des premiers avions intercepteurs capables de Mach 2 en service dans l'armée américaine. Le « Starfighter » établira de nombreux records de vitesse et d'altitude, mais il fut entaché par une controverse politique et une faible capacité de survie, ce dernier lui donnant un autre surnom, celui de « Widowmaker »."
 VIE_high_mach_jet_interceptor_equipment_3:0 "Rapière nord-américaine F-108"

 #CAS COIN focused

 VIE_jet_CAS_equipment_1:0 "Douglas A-1E Skyraider"
 VIE_jet_CAS_equipment_1_short:0 "A-1E Skyraider"
 VIE_jet_CAS_equipment_1_desc:0 "Sièges côte à côte pour pilote et copilote, sans freins de plongée"
 VIE_jet_CAS_equipment_2:0 "Douglas A-1H Skyraider"
 VIE_jet_CAS_equipment_2_short:0 "A-1H Skyraider"
 VIE_jet_CAS_equipment_2_desc:0 "Avion d'attaque monoplace avec trois freins en piqué, station centrale sollicitée pour 3 500 lb (1 600 kg) de munitions, 30 po (760 mm) de diamètre, combinaison d'un éjecteur de bombe de 14 po (360 mm) et de 30 po (760 mm) et d'un directeur de bombe basse/haute altitude."
 VIE_jet_CAS_equipment_3:0 "Douglas A-1J Skyraider"
 VIE_jet_CAS_equipment_3_short:0 "A-1J Skyraider"
 VIE_jet_CAS_equipment_3_desc:0 "Le modèle de production final, propulsé par un moteur R-3350-26WB, avec des améliorations structurelles pour augmenter la durée de vie en fatigue des ailes."
 VIE_jet_CAS_equipment_4:0 "Douglas AC-47D Effrayant"
 VIE_jet_CAS_equipment_4_short:0 "AC-47D Effrayant"
 VIE_jet_CAS_equipment_4_desc:0 "le Douglas AC-47 Spooky (également surnommé « Puff, the Magic Dragon ») fut le premier d'une série d'hélicoptères de combat à voilure fixe développés par l'US Air Force pendant la guerre du Vietnam. Il a été conçu pour fournir plus de puissance de feu que les avions d'attaque au sol légers et moyens dans certaines situations où les forces terrestres faisaient appel à un appui aérien rapproché."
 VIE_jet_CAS_equipment_5:0 "Fairchild AC-119G Ombre"
 VIE_jet_CAS_equipment_5_short:0 "AC-119G Ombre"
 VIE_jet_CAS_equipment_5_desc:0 "Le Fairchild AC-119G Shadow et l'AC-119K Stinger étaient des hélicoptères de combat bimoteurs à pistons développés par les États-Unis pendant la guerre du Vietnam. Ils ont remplacé le Douglas AC-47 Spooky et ont opéré aux côtés des premières versions du vaisseau de combat AC-130 Spectre."
 VIE_jet_CAS_equipment_6:0 "Fairchild AC-119K Stinger"
 VIE_jet_CAS_equipment_6_short:0 "AC-119K Stinger"
 VIE_jet_CAS_equipment_6_desc:0 "Le Fairchild AC-119G Shadow et l'AC-119K Stinger étaient des hélicoptères de combat bimoteurs à pistons développés par les États-Unis pendant la guerre du Vietnam. Ils ont remplacé le Douglas AC-47 Spooky et ont opéré aux côtés des premières versions du vaisseau de combat AC-130 Spectre."
 VIE_jet_CAS_equipment_7:0 "Spectre Lockheed AC-130A"
 VIE_jet_CAS_equipment_7_short:0 "Spectre AC-130A"
 VIE_jet_CAS_equipment_7_desc:0 "En 1967, le JC-130A 54-1626 a été sélectionné pour être converti en prototype de vaisseau de combat AC-130A (Project Gunship II). Les modifications ont été effectuées à la base aérienne Wright-Patterson par la division des systèmes aéronautiques. Un télescope de vision nocturne à vue directe a été installé dans la porte avant, un premier dispositif infrarouge orienté vers l'avant a été placé dans la partie avant du passage de roue gauche, avec des miniguns et des canons rotatifs fixés face vers le bas et vers l'arrière le long du côté gauche."
 VIE_jet_CAS_equipment_8:0 "Lockheed AC-130E Spectre"
 VIE_jet_CAS_equipment_8_short:0 "Spectre AC-130E"
 VIE_jet_CAS_equipment_8_desc:0 "Sept autres avions de combat ont été convertis en configuration \"Plain Jane\" comme le prototype AC-130 en 1968, et un avion a reçu le \"Surprise Package\" en 1969. La mise à niveau du Surprise Package comprenait les derniers canons automatiques rotatifs de 20 mm et le canon Bofors de 40 mm, mais pas d'armement d'appui rapproché de 7,62 mm. La configuration Surprise Package a servi de banc d'essai pour les systèmes avioniques et l'armement de l'AC-130E."

 #Light Jets
 
 VIE_jet_light_equipment_1:0 "Cheval de Troie T-28 de l'aviation nord-américaine"
 VIE_jet_light_equipment_1_short:0 "Cheval de Troie T-28"
 VIE_jet_light_equipment_1_desc:0 "Le North American Aviation T-28 Trojan est un avion d'entraînement militaire à moteur radial utilisé par l'armée de l'air américaine et la marine américaine à partir des années 1950. Outre son utilisation comme avion d'entraînement, le T-28 a été utilisé avec succès comme avion de contre-insurrection, principalement pendant la guerre du Vietnam. Il a continué à être utilisé par des civils en tant qu'interprète de voltige aérienne et de warbird."
 VIE_jet_light_equipment_2:0 "Cessna O-2 Skymaster"
 VIE_jet_light_equipment_2_short:0 "Maître du ciel O-2"
 VIE_jet_light_equipment_2_desc:0 "Le Cessna O-2 Skymaster (surnommé « Oscar Deuce ») est une version militaire du Cessna 337 Super Skymaster, utilisé pour le contrôle aérien avancé (FAC) et les opérations psychologiques (PSYOPS) par l'armée américaine entre 1967 et 2010."
 VIE_jet_light_equipment_3:0 "Chasseur de la liberté Northtrop F-5A"
 VIE_jet_light_equipment_3_short:0 "Chasseur de la liberté F-5A"
 VIE_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de combat léger destiné principalement à l'exportation. Il est plus léger et moins cher à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour remplacer les escadrons de chasseurs à courte portée. Malgré cela, ce type s'est avéré assez agile et était l'avion le plus proche pour rivaliser avec le MiG-21 « Fishbed » soviétique. Parce qu'il a été utilisé par la majorité des alliés de l'Amérique au plus fort de la guerre froide, il a été appelé à juste titre « Freedom Fighter »."
 VIE_jet_light_equipment_4:0 "Cessna OA-37B Libellule"
 VIE_jet_light_equipment_4_short:0 "Libellule OA-37B"
 VIE_jet_light_equipment_4_desc:0 "Le Cessna A-37 Dragonfly, ou Super Tweet, est un avion d'attaque léger américain développé à partir de l'avion d'entraînement de base T-37 Tweet dans les années 1960 et 1970 par Cessna de Wichita, Kansas. L'A-37 a été introduit pendant la guerre du Vietnam et est resté en service en temps de paix par la suite."
 VIE_jet_light_equipment_5:0 "Rockwell OV-10D Bronco nord-américain"
 VIE_jet_light_equipment_5_short:0 "OV-10D Bronco"
 VIE_jet_light_equipment_5_desc:0 "Bronco de deuxième génération développé dans le cadre du programme NOGS. Le modèle D était une cellule OV-10A largement modifiée, ajoutant un système de vision nocturne infrarouge tourné vers l'avant avec une caméra montée sur la tourelle sous un nez allongé, visuellement distinct du nez court et arrondi du modèle A. Le D possède également des moteurs plus gros et des hélices en fibre de verre plus grandes. D'autres différences externes notables sont les distributeurs de paillettes installés à mi-chemin des flèches et les cheminées d'échappement suppressives des infrarouges (qui mélangent les gaz d'échappement avec de l'air plus froid pour réduire la signature thermique de l'avion)."

#Naval bombers

 VIE_nav_bomber_equipment_4:0 "Lockheed P2V-2 Neptune"
 VIE_nav_bomber_equipment_4_short:0 "P2V-2 Neptune"
 VIE_nav_bomber_equipment_4_desc:0 "Le P2V était un avion de patrouille maritime et anti-sous-marin développé pour remplacer le PV-1 Ventura et le PV-2 Harpoon de la Seconde Guerre mondiale. Introduit en 1947 pour l'US Navy, il s'agissait en fait d'un avion basé à terre, et le P2V, plus tard désigné P-2 après 1962, n'a jamais effectué d'atterrissage sur un porte-avions, mais un petit nombre a été converti et déployé à partir de porte-avions comme bombardiers nucléaires provisoires qui devraient atterrir sur le rivage ou dans un fossé, à l'instar des bombardiers utilisés lors du raid de Doolittle pendant la Seconde Guerre mondiale. Son surnom est « Neptune », du nom du dieu romain de la mer."
 VIE_nav_bomber_equipment_5:0 "Lockheed P2V-7 Neptune"
 VIE_nav_bomber_equipment_5_short:0 "P2V-7 Neptune"
 VIE_nav_bomber_equipment_5_desc:0 "Dernière variante du Neptune produite par Lockheed, propulsée par des moteurs R-3350-32W et J-34. Équipé de réservoirs à bout d'aile à traînée inférieure, d'un radar de recherche AN/APS-20 dans un radôme révisé et d'une verrière de cockpit bombée. Les premiers avions étaient équipés de tourelles défensives, mais celles-ci furent supprimées comme pour le P2V-5."
 VIE_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 VIE_nav_bomber_equipment_6_short:0 "P-3A Orion"
 VIE_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le rôle de patrouille maritime et de guerre anti-sous-marine terrestre (ASW). Il dispose d'une soute à bombes interne pour les torpilles aériennes, avec des pylônes sous les ailes pour une myriade d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des charges sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques sur sa queue pour détecter les sous-marins utilisant le champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à jouer un rôle depuis son introduction en 1962, il est tout à fait approprié que l'avion soit surnommé « Orion ». Le chasseur de navires ennemis."
 VIE_nav_bomber_equipment_7:0 "Lockheed P-3C Orion"
 VIE_nav_bomber_equipment_7_short:0 "P-3C Orion"
 VIE_nav_bomber_equipment_7_desc:0 "Le P-3C disposait d'une nouvelle suite ASW et d'un ordinateur de mission avec une disposition interne révisée. À l'extérieur, le P-3C comportait une échelle d'entrée à commande électrique ; petite antenne à aileron ; chutes de bouées sonores ventrales chargées extérieurement ; et trois petites fenêtres sur le côté arrière droit (une fenêtre à l'avant de la sortie de secours au-dessus de l'aile et deux bien à l'arrière). Les avions de production initiaux avaient un nez de caméra situé sur la partie inférieure du radôme. Les avions de production ultérieurs avaient une tourelle IRDS rétractable à la place de la caméra nasale. À partir du début des années 1980, les nez de caméra existants ont été équipés de tourelles IRDS. Les premiers modèles étaient également connus sous le nom d'avion P-3C « Baseline » ou Non-Update (NUD). Tous les avions ont ensuite été équipés de deux systèmes de navigation inertielle LTN-72."
 VIE_nav_bomber_equipment_8:0 "Boeing P-8 Poséidon"
 VIE_nav_bomber_equipment_8_short:0 "P-8 Poséidon"
 VIE_nav_bomber_equipment_8_desc:0 "Initialement connu sous le nom d'avion maritime multimission (MMA), le P-8 a été conçu pour remplacer le vénérable P-3 Orion. Développé à partir de l'avion de ligne Boeing 737 Next Generation, le P-8 a été conçu pour le rôle de guerre anti-sous-marine et de patrouille maritime. De plus, il peut jouer le rôle de support électronique (ESM) grâce à l'utilisation de sa capacité d'autoprotection d'alerte précoce (EWSP). Avec des variantes en service aux États-Unis, au Royaume-Uni, en Inde et en Australie depuis son introduction en 2013, le « Poséidon » deviendra le nouveau roi des mers."

#Tactical bombers

 VIE_jet_tac_bomber_equipment_1:0 "Douglas B-26K contre-envahisseur"
 VIE_jet_tac_bomber_equipment_1_short:0 "Contre-envahisseur B-26K"
 VIE_jet_tac_bomber_equipment_1_desc:0 "Sur Mark Engineering, conversions de 40 B-26B ou TB-26B avec deux B-26C et un seul JB-26C ; les changements comprenaient l'installation de moteurs R-2800-52W de 2 500 ch (1 900 kW) sans hélices et la suppression des six canons à ailes. Au cours des opérations au Vietnam, en mai 1966, l'avion reçut l'ancienne désignation d'attaque A-26A. Les A-26A ont été retirés du service en 1969 après avoir atteint les limites de sécurité du temps de vol alloué."
 VIE_jet_tac_bomber_equipment_2:0 "Martin B-57A Canberra"
 VIE_jet_tac_bomber_equipment_2_short:0 "B-57A Canberra"
 VIE_jet_tac_bomber_equipment_2_desc:0 "Le « Canberra » est une version américaine du bombardier électrique anglais du même nom. Il est idéal pour les frappes tactiques et la reconnaissance. Son retrait dans les années 1980 marquerait la fin de l'ère des bombardiers tactiques."
 VIE_jet_tac_bomber_equipment_3:0 "Martin B-57B Canberra"
 VIE_jet_tac_bomber_equipment_3_short:0 "B-57B Canberra"
 VIE_jet_tac_bomber_equipment_3_desc:0 "le B-57B définitif, qui introduisait de nombreuses améliorations, effectua son premier vol le 18 juin 1954. L'avion souffrit initialement des mêmes dysfonctionnements moteur que les RB-57A et plusieurs furent perdus lors d'opérations à basse vitesse à grande vitesse en raison d'un actionneur d'empennage défectueux qui fit plonger l'avion dans le sol. L'USAF en est venue à considérer le B-57B comme étant inadéquat pour le rôle d'intrus nocturne et Martin a donc soumis tous les avions à une vaste mise à niveau avionique en réponse."
 VIE_jet_tac_bomber_equipment_4:0 "Martin B-57C Canberra"
 VIE_jet_tac_bomber_equipment_4_short:0 "B-57C Canberra"
 VIE_jet_tac_bomber_equipment_4_desc:0 "Variante à double commande. Le « Canberra » est une version américaine du bombardier électrique anglais du même nom. Il est idéal pour les frappes tactiques et la reconnaissance. Son retrait dans les années 1980 marquerait la fin de l'ère des bombardiers tactiques."
 VIE_jet_tac_bomber_equipment_5:0 "Martin B-57E 'Patricia Lynn' Canberra"
 VIE_jet_tac_bomber_equipment_5_short:0 "B-57E « Patricia Lynn »"
 VIE_jet_tac_bomber_equipment_5_desc:0 "Bien que conçus comme bombardiers et jamais déployés auparavant par l'USAF dans une zone de combat, les premiers B-57 déployés au Sud-Vietnam n'ont pas été utilisés dans un rôle offensif. Le besoin de moyens de reconnaissance supplémentaires, en particulier ceux capables d'opérer de nuit, a conduit au déploiement de deux avions RB-57E le 15 avril 1963. L'USAF avait attribué à General Dynamics un contrat pour modifier deux B-57E Canberras (55-4243, 55-4245) en tant qu'avions de reconnaissance stratégique tous temps à haute altitude. Dans le cadre du projet Patricia Lynn, ces avions ont fourni une couverture infrarouge à l'aide de leurs caméras Reconofax VI."
 VIE_jet_tac_bomber_equipment_6:0 "Martin B-57G 'Tropic Moon III' Canberra"
 VIE_jet_tac_bomber_equipment_6_short:0 "B-57G « Tropic Moon III »"
 VIE_jet_tac_bomber_equipment_6_desc:0 "Les B-57 sont revenus en Asie du Sud-Est sous la forme du Tropic Moon III B-57G, déployé en Thaïlande à l'automne 1970. Destinés à être des intrus nocturnes pour faciliter les mouvements de combat le long de la piste Ho Chi Minh, ces avions étaient équipés d'une variété de nouveaux capteurs et autres équipements, et étaient capables de larguer des munitions à guidage laser."
 VIE_jet_tac_bomber_equipment_7:0 "General Dynamics F-111G-AUP Oryctérope"
 VIE_jet_tac_bomber_equipment_7_short:0 "F-111G-AUP Oryctérope"
 VIE_jet_tac_bomber_equipment_7_desc:0 "Dans les années 1990, les avions F-111C ont subi une mise à niveau complète de l'avionique numérique (connue sous le nom d'AUP) qui a introduit de nouveaux systèmes de navigation/attaque (système de ciblage laser/infrarouge PAVE TACK) et des ordinateurs de commandes de vol."
 VIE_jet_tac_bomber_equipment_8:0 "Boeing F-15E Aigle Avancé"
 VIE_jet_tac_bomber_equipment_8_short:0 "F-15E Aigle Avancé"
 VIE_jet_tac_bomber_equipment_8_desc:0 "La variante F-15 Advanced Eagle est une mise à niveau par rapport aux modèles précédents dans la mesure où elle comprend deux points d'attache supplémentaires pour les armes sous les ailes (augmentant le nombre de neuf à onze) ; l'option d'un cockpit d'affichage de grande surface ; commandes de vol électriques ; le radar à réseau actif à balayage électronique (AESA) Raytheon AN/APG-82(V)1 ou AN/APG-63(V)3 ; Moteurs General Electric General Electric F110-129 ; systèmes de repérage numériques communs montés sur casque dans les deux cockpits ; et un système de guerre électronique numérique, entre autres améliorations."
 
#Strat bombers

 VIE_jet_strat_bomber_equipment_1:0 "Convair B-36 pacificateur"
 VIE_jet_strat_bomber_equipment_1_short:0 "B-36 Pacificateur"
 VIE_jet_strat_bomber_equipment_1_desc:0 "Le B-36 était le plus gros bombardier à hélice jamais entré en service lorsqu'il l'a fait en 1948. Sa taille signifiait que, sans modifications du châssis ou de la bombe, il pouvait transporter n'importe quelle bombe nucléaire que les États-Unis avaient dans leur arsenal à l'époque. Cependant, l'avènement des avions à réaction dans la guerre signifiait que ce type serait rapidement remplacé par le B-47 et le B-52. Contrairement à l'opinion populaire, le B-36 n'a pas de surnom officiel, mais la société et nombre de ses pilotes qui appréciaient ce type l'appelaient « Peacemaker »."
 VIE_jet_strat_bomber_equipment_2:0 "Boeing B-47 Stratojet"
 VIE_jet_strat_bomber_equipment_2_short:0 "B-47 Stratojet"
 VIE_jet_strat_bomber_equipment_2_desc:0 "Le B-47, baptisé « Stratojet », est un bombardier subsonique à haute altitude à six moteurs qui vole à haute altitude pour éviter les intercepteurs ennemis. Avec ses moteurs transportés dans des nacelles sous l'aile en flèche, le B-47 constituait une innovation majeure dans la conception des avions de combat de l'après-Seconde Guerre mondiale et contribuait au développement d'avions de ligne modernes."
 VIE_jet_strat_bomber_equipment_3:0 "Boeing B-52D Stratoforteresse"
 VIE_jet_strat_bomber_equipment_3_short:0 "B-52D Stratoforteresse"
 VIE_jet_strat_bomber_equipment_3_desc:0 "Le B-52 est un gros bombardier subsonique à longue portée capable d'effectuer de longues missions au-dessus du territoire ennemi. Grâce à ses performances supérieures à des vitesses subsoniques élevées et à ses coûts d'exploitation relativement faibles, le « Stratofortress » est resté en service malgré l'avènement d'avions ultérieurs plus avancés"
 VIE_jet_strat_bomber_equipment_4:0 "Boeing B-52G Stratoforteresse"
 VIE_jet_strat_bomber_equipment_4_short:0 "B-52G Stratoforteresse"
 VIE_jet_strat_bomber_equipment_4_desc:0 "La variante G du B-52 est dotée d'une électronique et d'une avionique améliorées ainsi que d'une charge utile plus importante. Cette variante présente également une autonomie plus longue grâce à une refonte du cadre pour une capacité de carburant accrue. Avec cette refonte et d'autres, la « Stratofortress » sert de plate-forme de bombardier de premier plan jusque dans les années 2050."
 VIE_jet_strat_bomber_equipment_5:0 "Boeing-B-52H"
 VIE_jet_strat_bomber_equipment_5_short:0 "B-52H Stratoforteresse"
 VIE_jet_strat_bomber_equipment_5_desc:0 "Le B-52H présentait les mêmes changements d'équipage et de structure que le B-52G. L'amélioration la plus importante a été le passage aux turboréacteurs à double flux TF33-P-3 qui, malgré les problèmes de fiabilité initiaux (corrigés en 1964 dans le cadre du programme Hot Fan), offraient des performances et une économie de carburant considérablement meilleures que les turboréacteurs J57. L'ECM et l'avionique ont été mis à jour, un nouveau système de conduite de tir a été installé et l'armement défensif arrière est passé de mitrailleuses à un canon Vulcan M61 de 20 mm."

#CV CAS

 VIE_cv_CAS_equipment_1:0 "Northrop BT"
 VIE_cv_CAS_equipment_1_short:0 "Northrop BT"
 VIE_cv_CAS_equipment_1_desc:0 "Le Northrop BT a été développé en 1935 alors que Northrop était une filiale de Douglas Aircraft Corporation. Premier avion doté d'un train d'atterrissage tricycle fixe à atterrir sur un porte-avions, ce type sera développé plus tard par Douglas pour devenir le bombardier en piqué SBD Dauntless."
 
 VIE_cv_jet_CAS_equipment_1:0 "Douglas AD-1 Skyraider"
 VIE_cv_jet_CAS_equipment_1_short:0 "AD-1 Skyraider"
 VIE_cv_jet_CAS_equipment_1_desc:0 "Le Douglas A-1 Skyraider (anciennement AD Skyraider) est un avion d'attaque monoplace américain qui a été utilisé entre la fin des années 40 et le début des années 80. Le Skyraider a eu une carrière remarquablement longue et fructueuse ; il est devenu un anachronisme propulsé par un piston et une hélice à l'ère des avions à réaction, et a été surnommé « Spad »."
 VIE_cv_jet_CAS_equipment_2:0 "Douglas AD-4 Skyraider"
 VIE_cv_jet_CAS_equipment_2_short:0 "AD-4 Skyraider"
 VIE_cv_jet_CAS_equipment_2_desc:0 "Train d'atterrissage renforcé, radar amélioré, compas G-2, combinaisons anti-G, quatre canons de 20 mm (0,79 po) et 14 lance-roquettes Aero, capables de transporter jusqu'à 50 lb (23 kg) de bombes"
 VIE_cv_jet_CAS_equipment_3:0 "Douglas A-3B Skywarrior"
 VIE_cv_jet_CAS_equipment_3_short:0 "A-3B Guerrier du Ciel"
 VIE_cv_jet_CAS_equipment_3_desc:0 "Version bombardier de production définitive, avec une cellule plus solide, des moteurs plus puissants, une surface d'aile légèrement plus grande (812 pi²/75 m² contre 779 pi²/72 m²), une possibilité d'enrouleur de ravitaillement en vol pour le rôle de ravitailleur. Les 21 derniers exemplaires construits avaient un nouveau système de bombardement AN/ASB-7 et un nez remodelé ; tourelle de queue supprimée au profit de l'installation de guerre électronique."
 VIE_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 VIE_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 VIE_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un engin d'attaque léger monomoteur capable de transporter la même charge de bombes qu'un B-17 malgré son châssis plus petit. Servant dans plusieurs forces aériennes et aéronavales depuis son introduction en 1954, il a connu de nombreuses modifications et modernisations au cours de ses plus de 60 années de service et continue de servir dans de nombreux pays jusqu'à ce jour. Son surnom est « Skyhawk »."
 VIE_cv_jet_CAS_equipment_5:0 "Douglas A-4E Skyhawk"
 VIE_cv_jet_CAS_equipment_5_short:0 "A-4E Skyhawk"
 VIE_cv_jet_CAS_equipment_5_desc:0 "Mise à niveau majeure, comprenant un nouveau moteur Pratt & Whitney J52-P-6A avec une poussée de 8 400 lbf (37 kN), une cellule renforcée avec deux pylônes d'armes supplémentaires (pour un total de cinq), une avionique améliorée, avec TACAN, un radar de navigation Doppler, un altimètre radar, un ordinateur de bombardement par lancer et un système de bombardement à basse altitude AJB-3A. Beaucoup ont ensuite été mis à niveau avec le moteur J52-P-8 produisant 9 300 lbf (41 kN) de poussée"
 VIE_cv_jet_CAS_equipment_6:0 "Douglas A-4F Skyhawk"
 VIE_cv_jet_CAS_equipment_6_short:0 "A-4F Skyhawk"
 VIE_cv_jet_CAS_equipment_6_desc:0 "Raffinement de l'A-4E avec une avionique supplémentaire logée dans une bosse sur la colonne vertébrale du fuselage (cette fonctionnalité a ensuite été installée sur les A-4E et certains A-4C), des spoilers supérieurs d'aile pour réduire le déroulement à l'atterrissage, une direction de la roue avant et un moteur J52-P-8A plus puissant avec 9 300 lbf (41 kN) de poussée, mis à niveau plus tard en service vers le J52-P-408 avec 11 200 lbf (50 kN)."
 VIE_cv_jet_CAS_equipment_7:0 "LTV A-7A Corsaire II"
 VIE_cv_jet_CAS_equipment_7_short:0 "A-7A Corsaire II"
 VIE_cv_jet_CAS_equipment_7_desc:0 "Développé à partir du F-8 Crusader, le « Corsair II » (du nom du F4U Corsair) est un avion d'attaque léger monoplace, subsonique et embarqué, avec une charge utile et une portée plus grandes que l'A-4 Skyhawk qu'il a remplacé. Il servira plus tard dans l'US Air Force, remplaçant les vénérables A-1 Skyraider et F-100 Super Sabre, devenant ainsi l'un des rares avions d'attaque au sol à servir à la fois dans la Marine et dans l'Air Force."
 VIE_cv_jet_CAS_equipment_8:0 "LTV A-7B Corsaire II"
 VIE_cv_jet_CAS_equipment_8_short:0 "A-7B Corsaire II"
 VIE_cv_jet_CAS_equipment_8_desc:0 "Moteur TF30-P-8 amélioré avec 12 190 lbf (54,2 kN) de poussée. En 1971, les A-7B survivants ont été améliorés en TF30-P-408 avec 13 390 lbf (59,6 kN) de poussée ; Le radar de suivi de terrain AN/APQ-115 dans l'ancien A-7A est remplacé par le radar de suivi de terrain AN/APQ-116."
 VIE_cv_jet_CAS_equipment_9:0 "LTV A-7E Corsaire II"
 VIE_cv_jet_CAS_equipment_9_short:0 "A-7E Corsaire II"
 VIE_cv_jet_CAS_equipment_9_desc:0 "En fait, un A-7D modifié pour les opérations navales ; avec le même canon rotatif Allison TF41-A-1 et M61 Vulcan de 20 mm et un radar de navigation AN/APN-190 encore amélioré et un radar de suivi de terrain AN/APQ-128 en plus d'un équipement d'arrêt et d'ailes repliables pour permettre les opérations du transporteur."
 VIE_cv_jet_CAS_equipment_10:0 "McDonnell Douglas F/A-18B Hornet"
 VIE_cv_jet_CAS_equipment_10_short:0 "F/A-18B Hornet"
 VIE_cv_jet_CAS_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les nouvelles avancées des technologies informatiques avec une vitesse et une agilité élevées pour créer des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut contenir, le « Hornet » basé sur un porte-avions a été conçu comme un avion multirôle pour gérer à la fois des missions air-air et air-sol. Le B est une version d'attaque au sol biplace."

#CV Multirole

 VIE_cv_jet_multirole_equipment_1:0 "McDonnell Douglas F2H Banshee"
 VIE_cv_jet_multirole_equipment_1_short:0 "F2H Banshee"
 VIE_cv_jet_multirole_equipment_1_desc:0 "Le McDonnell F2H Banshee était un avion de combat à réaction monoplace embarqué par la Marine américaine et le Corps des Marines des États-Unis de 1948 à 1961. C'était l'un des principaux chasseurs américains utilisés pendant la guerre de Corée et le seul chasseur à réaction déployé par la Marine royale canadienne."
 VIE_cv_jet_multirole_equipment_2:0 "Grumman F9F Panthère"
 VIE_cv_jet_multirole_equipment_2_short:0 "Panthère F9F"
 VIE_cv_jet_multirole_equipment_2_desc:0 "Le F9F a été conçu à l'origine comme un avion à réaction à aile droite introduit en 1949. L'un des premiers avions à réaction capables de porter un porte-avions utilisé dans la marine américaine, il était le principal avion d'attaque au sol de l'USN et de l'USMC pendant la guerre de Corée, effectuant 78 000 sorties, et a été crédité de la première destruction aérienne d'un chasseur de la marine américaine pendant la guerre. Son châssis robuste permettait à l'engin de soutenir des opérations d'attaque au sol, même face aux tirs des AA. Le F9F (plus tard rebaptisé F-9) servira également avec les Blue Angels, devenant ainsi le premier avion à réaction utilisé par l'équipe. Suivant la tradition de Grumman consistant à donner aux avions le nom de grands félins, l'avion est connu sous le nom de « Panthère »."
 VIE_cv_jet_multirole_equipment_3:0 "Démon McDonnell F3H"
 VIE_cv_jet_multirole_equipment_3_short:0 "Démon F3H"
 VIE_cv_jet_multirole_equipment_3_desc:0 "Le F3H était un chasseur subsonique à ailes en flèche qui a été en proie à des difficultés tout au long de sa carrière. Initialement destiné au moteur J40, des problèmes avec la conception du prototype ont conduit à l'annulation du moteur et le F3H recevrait en remplacement un moteur à faible puissance. Malgré ses problèmes, le Démon était un intercepteur performant par tous les temps, avec une bonne visibilité pour l'époque. Initialement armée uniquement de quatre canons de 20 mm, une variante ultérieure serait équipée des premiers modèles de ce qui allait devenir le missile infrarouge AIM-9 Sidewinder et le missile air-air semi-actif AAM-N-2 (plus tard AIM-7) Sparrow. Conformément aux conventions de dénomination de McDonnell, son surnom officiel est le « Démon »."
 VIE_cv_jet_multirole_equipment_4:0 "Vought F-8 croisé"
 VIE_cv_jet_multirole_equipment_4_short:0 "Croisé F-8"
 VIE_cv_jet_multirole_equipment_4_desc:0 "Chasseur monomoteur supersonique de supériorité aérienne, le F-8 (à l'origine connu sous le nom de F8U) a été conçu pour la défense aérienne rapprochée de la flotte. L'avion transporte une charge utile de munitions plus importante que le F11F Tiger ou le F7U Cutlass (ce dernier qu'il a remplacé), ainsi que la capacité de fonctionner comme une plate-forme de reconnaissance photographique rapide. Surnommé le « Croisé », il était l'un des chasseurs de supériorité aérienne à conserver son armement interne au moment de la guerre du Vietnam, lui donnant ainsi un autre surnom, « Le dernier Gunfighter »."
 VIE_cv_jet_multirole_equipment_5:0 "McDonnell Douglas F-4B Phantom II"
 VIE_cv_jet_multirole_equipment_5_short:0 "F-4B Fantôme II"
 VIE_cv_jet_multirole_equipment_5_desc:0 "Avion de combat et d'attaque au sol biplace tous temps basé sur un porte-avions pour l'US Navy et le Marine Corps. Moteurs J79-GE-8A ou -8B avec 16 950 lbf (75,4 kN) de poussée de postcombustion chacun. Appelé « Phantom II » (et nommé d'après le FH Phantom), le F-4 Phantom II a été le premier avion partagé par trois branches des forces armées américaines, la Marine, les Marines et l'Armée de l'Air."
 VIE_cv_jet_multirole_equipment_6:0 "McDonnell Douglas F-4J Phantom II"
 VIE_cv_jet_multirole_equipment_6_short:0 "F-4J Fantôme II"
 VIE_cv_jet_multirole_equipment_6_desc:0 "Version améliorée du F-4B pour l'US Navy et le Marine Corps, en mettant l'accent sur l'amélioration des capacités de combat air-air, notamment : Moteurs J79-GE-10 avec 17 844 lbf (79,374 kN) de poussée de postcombustion chacun, radar Doppler à impulsions AN/APG-59 couplé au système de contrôle de tir AN/AWG-10 pour une capacité d'abattage avec vue vers le bas, roues de train d'atterrissage principal plus grandes résultant en des renflements d'ailes similaires à ceux du F-4C, empennage à lattes, ailerons tombés de 16,5° lorsque le train d'atterrissage et les volets étaient déployés pour diminution de la vitesse d'atterrissage, sièges éjectables zéro-zéro, capacité d'attaque au sol étendue, pas de capteur IRST sous le nez."
 VIE_cv_jet_multirole_equipment_7:0 "McDonnell Douglas F-4N Phantom II"
 VIE_cv_jet_multirole_equipment_7_short:0 "F-4N Fantôme II"
 VIE_cv_jet_multirole_equipment_7_desc:0 "F-4B modernisé dans le cadre du projet Bee Line, les mêmes améliorations aérodynamiques que le F-4J, des moteurs sans fumée et une cellule renforcée."
 VIE_cv_jet_multirole_equipment_8:0 "McDonnell Douglas F-4S Phantom II"
 VIE_cv_jet_multirole_equipment_8_short:0 "F-4S Fantôme II"
 VIE_cv_jet_multirole_equipment_8_desc:0 "F-4J modernisé avec des moteurs sans fumée, une cellule renforcée et des lattes de pointe pour une maniabilité améliorée. Premier vol juillet 1977"
 #VIE_cv_jet_multirole_equipment_9:0 "Northrop F/A-17 Cobra"
 #VIE_cv_jet_multirole_equipment_9_short:0 "F/A-17 Cobra"
 #VIE_cv_jet_multirole_equipment_9_desc:0 "The Northrop YF-17 (nicknamed "Cobra") is a prototype lightweight fighter aircraft designed by Northrop aviation for the United States Air Force's Lightweight Fighter (LWF) technology evaluation program. The LWF was initiated because many in the fighter community believed that aircraft like the F-15 Eagle were too large and expensive for many combat roles. The YF-17 was the culmination of a long line of Northrop designs, beginning with the N-102 Fang in 1956, continuing through the F-5 family."
 VIE_cv_jet_multirole_equipment_10:0 "McDonnell Douglas F/A-18A Hornet"
 VIE_cv_jet_multirole_equipment_10_short:0 "F/A-18A Hornet"
 VIE_cv_jet_multirole_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les nouvelles avancées des technologies informatiques avec une vitesse et une agilité élevées pour créer des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut contenir, le « Hornet » basé sur un porte-avions a été conçu comme un avion multirôle pour gérer à la fois des missions air-air et air-sol."

#Jump jet

 VIE_jump_jet_equipment_1:0 "Hawker Siddeley AV-8A Harrier"
 VIE_jump_jet_equipment_1_short:0 "Harrier AV-8A"
 VIE_jump_jet_equipment_1_desc:0 "Cet attaquant a été développé pour faire du VTOL (décollage et atterrissage verticaux) une réalité. Il présente une conception unique comprenant des ailes montées en hauteur et quatre buses rotatives. Cela permet d'opérer dans des espaces limités tels que les porte-avions légers et les petits aérodromes. L'avion est communément connu sous le nom de « Harrier ». Développé en Grande-Bretagne, l'AV-8A est connu en Grande-Bretagne sous le nom de Harrier Mk. 50 et fonctionnait de manière similaire aux Harrier GR.1 de la Royal Air Force."
 VIE_jump_jet_equipment_2:0 "Hawker Siddeley AV-8C Harrier"
 VIE_jump_jet_equipment_2_short:0 "Harrier AV-8C"
 VIE_jump_jet_equipment_2_desc:0 "La variante « C » est une version améliorée de l'AV-8A et fonctionne avec des systèmes similaires au Harrier GR.3, avec un nouvel équipement ECM et un système de navigation inertielle."
 VIE_jump_jet_equipment_3:0 "McDonnell Douglas AV-8B Harrier II"
 VIE_jump_jet_equipment_3_short:0 "AV-8B Harrier II"
 VIE_jump_jet_equipment_3_desc:0 "Le Harrier II est un projet anglo-américain conjoint conçu par McDonnell Douglas avec British Aerospace. Au service du Corps des Marines des États-Unis depuis 1985, le « Harrier II » était considéré comme un outil important dans de nombreux conflits américains de mémoire récente."
 VIE_jump_jet_equipment_4:0 "McDonnell Douglas AV-8B Harrier II Plus"
 VIE_jump_jet_equipment_4_short:0 "AV-8B Harrier II Plus"
 VIE_jump_jet_equipment_4_desc:0 "Mise à niveau à mi-vie de l'AV-8B, l'AV-8B Plus intègre un moteur amélioré, un système radar et une caméra infrarouge, ce qui en fait un avion d'attaque de nuit très efficace."

#Recon

 VIE_recon_equipment_0:0 "Criquet Morane 500"
 VIE_recon_equipment_0_short:0 "Criquet"
 VIE_recon_equipment_0_desc:0 "Immédiatement après la libération de la France en 1944, la production du Fi 156 à l'usine Morane-Saulnier se poursuit à la demande de l'Armée de l'Air et est désignée MS 500 pour le lot d'avions produits avec le stock restant de moteurs V8 inversés Argus refroidis par air. D'autres modifications et utilisations de différents moteurs (en ligne et radiaux) sont connues sous différents numéros de type."
 VIE_jet_recon_equipment_0:0 "Cessna O-1 Chien d'oiseau"
 VIE_jet_recon_equipment_0_short:0 "O-1 Chien Oiseau"
 VIE_jet_recon_equipment_0_desc:0 "Le Cessna L-19/O-1 Bird Dog est un avion de liaison et d'observation. Il s'agissait du premier avion à voilure fixe entièrement métallique commandé pour et par l'armée américaine après la séparation de l'armée de l'air en 1947. Le Bird Dog a eu une longue carrière dans l'armée américaine, ainsi que dans d'autres pays. "
 VIE_jet_recon_equipment_1:0 "Northrop RF-5A"
 VIE_jet_recon_equipment_1_short:0 "RF-5A"
 VIE_jet_recon_equipment_1_desc:0 "Version de reconnaissance monoplace du chasseur F-5A."
 VIE_jet_recon_equipment_2:0 "Boeing EA-18G Growler"
 VIE_jet_recon_equipment_2_short:0 "EA-18G Grogneur"
 VIE_jet_recon_equipment_2_desc:0 "Le Boeing EA-18G Growler est un avion de guerre électronique américain embarqué, une version spécialisée du F/A-18F Super Hornet biplace."

#Transport

 VIE_transport_plane_equipment_1:0 "Train aérien Douglas C-47"
 VIE_transport_plane_equipment_1_short:0 "Train aérien C-47"
 VIE_transport_plane_equipment_1_desc:0 "Développé à partir de l'avion de ligne Douglas DC-3 lors de son premier vol en 1941, le C-47 était l'avion de transport par excellence utilisé par les Alliés. Pendant la Seconde Guerre mondiale, les forces armées de nombreux pays ont utilisé le C-47 et des DC-3 modifiés pour le transport de troupes, de marchandises et de blessés. Plus de 10 000 unités, à la fois le C-47 et la variante navale R4D (plus tard C-117) ont été construites pour la guerre, et de nombreux « Skytrains » ont été utilisés non seulement pour le transport de troupes et de marchandises, mais aussi pour la recherche et le sauvetage et, pendant la guerre du Vietnam, comme premiers hélicoptères de combat."
 VIE_transport_plane_equipment_2:0 "Wagon couvert volant Fairchild C-119"
 VIE_transport_plane_equipment_2_short:0 "Wagon couvert volant C-119"
 VIE_transport_plane_equipment_2_desc:0 "Le Fairchild C-119 Flying Boxcar (désignation R4Q de la Marine et du Corps des Marines) était un avion de transport militaire américain développé à partir du Fairchild C-82 Packet de la Seconde Guerre mondiale, conçu pour transporter des marchandises, du personnel, des patients et du matériel mécanisé, et pour larguer des marchandises et des troupes en parachute."
 VIE_transport_plane_equipment_3:0 "Wagon couvert volant Fairchild C-119G"
 VIE_transport_plane_equipment_3_short:0 "Wagon couvert volant C-119G"
 VIE_transport_plane_equipment_3_desc:0 "En tant que C-119F avec différentes hélices, 480 exemplaires ont été construits, certains convertis à partir du C-119F construit par Fairchild ou Kaiser. Le Fairchild C-119 Flying Boxcar (désignation Navy et Marine Corps R4Q) était un avion de transport militaire américain développé à partir du Fairchild C-82 Packet de la Seconde Guerre mondiale, conçu pour transporter des marchandises, du personnel, des patients et des équipements mécanisés, et pour larguer des marchandises et des troupes en parachute."
 VIE_transport_plane_equipment_4:0 "Lockheed C-130A Hercules"
 VIE_transport_plane_equipment_4_short:0 "C-130A Hercules"
 VIE_transport_plane_equipment_4_desc:0 "Développé en 1954, le C-130 est un moyen de transport capable d'utiliser des pistes non préparées pour les décollages et les atterrissages, ce qui en fait un cadre pratique pour le transport de troupes et de marchandises ainsi que pour les évacuations médicales. Mais ce qui rend l'avion digne de son surnom de « Hercules », c'est qu'il y avait plusieurs sous-variantes développées pour une variété de rôles, allant du Gunship (AC-130 Spooky & Spectre), au contrôle de drones (DC-130), au Jammer et aux PSYOPS (EC-130 Compass Call) et à la reconnaissance météorologique (WC-130), entre autres. Vraiment une machine polyvalente qui mérite son surnom."
 VIE_transport_plane_equipment_5:0 "De Havilland Canada C-7A Caribou"
 VIE_transport_plane_equipment_5_short:0 "Caribou C-7A"
 VIE_transport_plane_equipment_5_desc:0 "Semblable au DHC-4, mais cette version avait une masse au décollage accrue."
 VIE_transport_plane_equipment_6:0 "Lockheed C-130E Hercules"
 VIE_transport_plane_equipment_6_short:0 "C-130E Hercules"
 VIE_transport_plane_equipment_7:0 "Lockheed C-130H Hercules"
 VIE_transport_plane_equipment_7_short:0 "C-130H Hercules"
 VIE_transport_plane_equipment_8:0 "Lockheed C-130H-30 Hercules"
 VIE_transport_plane_equipment_8_short:0 "C-130H-30 Hercules"
 VIE_transport_plane_equipment_10:0 "Lockheed C-130J Hercules"
 VIE_transport_plane_equipment_10_short:0 "C-130J Hercules"

 #Helicopter

 VIE_naval_helicopter_equipment_1:0 "Bell HTL-4 Sioux"
 VIE_naval_helicopter_equipment_1_short:0 "HTL-4 Sioux"
 VIE_naval_helicopter_equipment_1_desc:0 "Le HTL était un hélicoptère léger monomoteur à rotor unique dérivé du Bell 47A civil. Acquis par l'US Navy en 1947, le HTL-4 (la variante désignée par la Navy) se distinguait de ceux utilisés par les autres branches par le retrait du revêtement en tissu sur la poutre de queue. Sinon, il conserve bon nombre de ses caractéristiques, y compris la verrière distinctive en forme de « bulle de savon » offrant au pilote une large vue. Plus tard désigné TH-13L. Son surnom, qui vient du nom des hélicoptères des tribus amérindiennes, est « Sioux »."
 VIE_naval_helicopter_equipment_2:0 "Sikorsky HSS-1 Seabat"
 VIE_naval_helicopter_equipment_2_short:0 "Bat-marin HSS-1"
 VIE_naval_helicopter_equipment_2_desc:0 "Le HSS est la variante anti-sous-marine du S-58 de Sikorsky, une version améliorée du S-55 (et du H-19 Chickasaw militaire). Il avait un nez plus petit, mais avec un fuselage arrière et un train d'atterrissage à traîneau de queue, plutôt que le modèle à queue haute et à 4 montants de son prédécesseur. Plus tard rebaptisé SH-34G, les variantes anti-sous-marins de cet hélicoptère ont reçu le surnom officiel de « Seabat »."
 VIE_naval_helicopter_equipment_3:0 "Kaman SH-2D Seasprite"
 VIE_naval_helicopter_equipment_3_short:0 "SH-2D Seasprite"
 VIE_naval_helicopter_equipment_3_desc:0 "Introduit au début des années 1960 en remplacement du SH-34 Seabat, le SH-2 (initialement désigné HU2K) fut le premier hélicoptère anti-sous-marin capable d'être déployé sur des navires américains en plus des porte-avions. Cette portabilité a prolongé la carrière du « Seasprite » et des variantes améliorées ont existé. La variante représentée dans le jeu est la variante « D », la variante anti-sous-marine initiale."
 VIE_naval_helicopter_equipment_4:0 "Sikorsky SH-3A Sea King"
 VIE_naval_helicopter_equipment_4_short:0 "SH-3A Sea King"
 VIE_naval_helicopter_equipment_4_desc:0 "Développé à partir du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère ASW bimoteur. Il s'agissait du premier hélicoptère amphibie au monde, capable de décoller à la fois depuis la terre et depuis la mer. Il fut également, aux côtés de son contemporain le Seasprite, l'un des premiers hélicoptères ASW à utiliser des turbomoteurs. En plus des fonctions ASW, le SH-3 a également joué des rôles de recherche et de sauvetage (SAR), de transport, d'évacuation sanitaire et d'alerte précoce aéroportée (AEW), un certain nombre d'hélicoptères étant utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pour cette raison qu'il a gagné le surnom de « Sea King », l'hélicoptère le plus polyvalent au monde."
 VIE_naval_helicopter_equipment_5:0 "Sikorsky SH-3D Sea King"
 VIE_naval_helicopter_equipment_5_short:0 "Roi des Mers SH-3D"
 VIE_naval_helicopter_equipment_5_desc:0 "Développé à partir du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère ASW bimoteur. Il s'agissait du premier hélicoptère amphibie au monde, capable de décoller à la fois depuis la terre et depuis la mer. Il fut également, aux côtés de son contemporain le Seasprite, l'un des premiers hélicoptères ASW à utiliser des turbomoteurs. En plus des fonctions ASW, le SH-3 a également joué des rôles de recherche et de sauvetage (SAR), de transport, d'évacuation sanitaire et d'alerte précoce aéroportée (AEW), un certain nombre d'hélicoptères étant utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pour cette raison qu'il a gagné le surnom de « Sea King », l'hélicoptère le plus polyvalent au monde."
 VIE_naval_helicopter_equipment_6:0 "Sikorsky SH-60F Seahawk"
 VIE_naval_helicopter_equipment_6_short:0 "SH-60F Seahawk"
 VIE_naval_helicopter_equipment_6_desc:0 "Le SH-60F servait principalement de principal avion de guerre anti-sous-marine (ASW) du groupement tactique aéronaval. L'hélicoptère chassait les sous-marins avec son sonar plongeant AQS-13F et transportait un lanceur de bouées sonores à 6 tubes. Le SH-60F est officieusement nommé « Oceanhawk ». Le SH-60F peut transporter des torpilles Mk 46, Mk 50 ou Mk 54 pour ses armes offensives, et il dispose d'un choix de mitrailleuses montées sur le fuselage, notamment les M60D, M240D et GAU-16 (calibre.50) pour l'autodéfense."
 VIE_naval_helicopter_equipment_7:0 "Sikorsky MH-60R Seahawk"
 VIE_naval_helicopter_equipment_7_short:0 "MH-60R Seahawk"
 VIE_naval_helicopter_equipment_7_desc:0 "Le MH-60R Seahawk est une version améliorée du SH-60 Seahawk. Développé en 1993, le MH-60R a été conçu pour combiner les fonctionnalités des précédents SH-60B et SH-60F. Ses capteurs comprennent le package ASE, MTS-FLIR, l'interrogateur radar/IFF multimode AN/APS-147, une liaison de données de flotte aéroportée avancée et un sonar actif aéroporté plus avancé. Ceci, associé à un système d'armes amélioré (lui permettant de transporter la torpille avancée Mk 54 et les missiles AGM-114 Hellfire), confère au « Seahawk » une plus grande flexibilité dans les opérations d'assaut anti-navire et amphibie."

 VIE_attack_helicopter_equipment_1:0 "Navire de combat Bell UH-1C"
 VIE_attack_helicopter_equipment_1_short:0 "Navire de combat UH-1C"
 VIE_attack_helicopter_equipment_1_desc:0 "Au cours de la guerre, l'UH-1 a subi plusieurs améliorations. Les modèles UH-1A, B et C (fuselage court, Bell 204) et les modèles UH-1D et H (fuselage étiré, Bell 205) avaient chacun des performances et des capacités de charge améliorées. Les UH-1B et C ont effectué des missions de combat et certaines des fonctions de transport au cours des premières années de la guerre du Vietnam."
 VIE_attack_helicopter_equipment_2:0 "Navire de combat Bell UH-1H"
 VIE_attack_helicopter_equipment_2_short:0 "Navire de combat UH-1H"
 VIE_attack_helicopter_equipment_2_desc:0 "Au cours de la guerre, l'UH-1 a subi plusieurs améliorations. Les modèles UH-1A, B et C (fuselage court, Bell 204) et les modèles UH-1D et H (fuselage étiré, Bell 205) avaient chacun des performances et des capacités de charge améliorées. Les UH-1B et C ont effectué des missions de combat et certaines des fonctions de transport au cours des premières années de la guerre du Vietnam."
 VIE_attack_helicopter_equipment_3:0 "Bell AH-1F Cobra"
 VIE_attack_helicopter_equipment_3_short:0 "AH-1F Cobra"
 VIE_attack_helicopter_equipment_3_desc:0 "L'AH-1F intègre toutes les mises à niveau des étapes 1 et 2 de l'AH-1S. Il comportait également des mises à niveau de l'étape 3 ; un affichage tête haute, un télémètre laser, un brouilleur infrarouge monté au-dessus de l'échappement du moteur, un système d'échappement du moteur à suppression infrarouge et le sous-système de données aériennes M143 (ADS). L'AH-1F est également appelé « AH-1S modernisé », « AH-1S Modernized Cobra » ou « AH-1S(MC) » avant 1988."
 VIE_attack_helicopter_equipment_4:0 "Bell AH-1W SuperCobra"
 VIE_attack_helicopter_equipment_4_short:0 "AH-1W SuperCobra"
 VIE_attack_helicopter_equipment_4_desc:0 "Le Bell AH-1 SuperCobra est un hélicoptère d'attaque bimoteur basé sur le monomoteur AH-1 Cobra de l'armée américaine. La famille jumelle Cobra, elle-même partie de la plus grande famille Huey, comprend l'AH-1J SeaCobra, l'AH-1T Upgraded SeaCobra et l'AH-1W SuperCobra."
 VIE_attack_helicopter_equipment_5:0 "Bell AH-1Z Vipère"
 VIE_attack_helicopter_equipment_5_short:0 "Vipère AH-1Z"
 VIE_attack_helicopter_equipment_5_desc:0 "Le Bell AH-1Z Viper est un hélicoptère d'attaque bimoteur américain, basé sur l'AH-1W SuperCobra, développé pour le Corps des Marines des États-Unis dans le cadre du programme de mise à niveau H-1. L'AH-1Z est doté d'un système de rotor principal composite à quatre pales sans roulement, d'une transmission améliorée et d'un nouveau système de visée de cible."

 VIE_scout_helicopter_equipment_1:0 "Hughes OH-6 Cayuse"
 VIE_scout_helicopter_equipment_1_short:0 "OH-6 Cayuse"
 VIE_scout_helicopter_equipment_1_desc:0 "Développé en 1960, l'OH-6 a été conçu dans le cadre du projet Light Observation Helicopter (LOH), à des fins d'observation, d'évacuation des blessés, de transport de personnel et d'attaque légère. Le design de Hughes serait celui qui réussirait parmi onze autres designs concurrents. Il remplacerait l'O-1 Bird Dog dans le rôle d'observation lorsque le département américain de la Défense ordonnait à l'armée américaine de transférer tous les avions à voilure fixe à l'US Air Force. Servi avec distinction pendant la guerre du Vietnam, l'OH-6 avait montré la valeur des hélicoptères d'observation comme support aux hélicoptères d'attaque comme l'AH-1 ou aux forces terrestres pour engager les ennemis. Officiellement connu sous le nom de « Cayuse » (d'après la tribu amérindienne du nord-ouest du Pacifique), les pilotes lui ont donné le surnom de « Loach » en hommage au programme qui l'a engendré."
 VIE_scout_helicopter_equipment_2:0 "Bell OH-58A Kiowa"
 VIE_scout_helicopter_equipment_2_short:0 "OH-58A Kiowa"
 VIE_scout_helicopter_equipment_2_desc:0 "Introduit en 1969, au plus fort de la guerre du Vietnam, l'OH-58 était un hélicoptère à 4 places dont la particularité remarquable était que, malgré la présence de 2 pilotes, les commandes du pilote sur le siège gauche pouvaient être retirées pour transporter un passager à l'avant. Pendant la guerre du Vietnam, son armement était un seul minigun M134 ou un lance-grenades M129. Après la guerre, l'OH-58 recevra de nombreuses modifications, avec une mise à niveau du moteur (le mettant au niveau du dernier OH-58C), un système d'imagerie thermique, un ensemble de communications pour les forces de l'ordre, un équipement de navigation amélioré et un équipement de dérapage élevé. Ces variantes améliorées du « Kiowa » (du nom d'une tribu amérindienne originaire du Montana et du Colorado) participeraient aux opérations antidrogue RAID de la Garde nationale militaire."
 VIE_scout_helicopter_equipment_3:0 "Bell OH-58D Kiowa"
 VIE_scout_helicopter_equipment_3_short:0 "OH-58D Kiowa"
 VIE_scout_helicopter_equipment_3_desc:0 "La variante « D » améliorée du Kiowa était le résultat du programme d'amélioration des hélicoptères de l'armée (AHIP). Il était doté de fonctionnalités telles qu'une transmission et un moteur améliorés pour les vols en sieste de terre (niveau extrêmement bas) de l'hélicoptère, ainsi qu'une configuration unique de rotor principal à quatre pales qui lui permettait d'être beaucoup plus silencieux que les autres hélicoptères, plus encore ses prédécesseurs. L'OH-58D a introduit le viseur distinctif monté sur mât (MMS) au-dessus du système de rotor et un cockpit en verre mixte, avec des instruments traditionnels identifiés comme « en veille » pour une utilisation d'urgence."
 VIE_scout_helicopter_equipment_4:0 "MD Helicopters AH-6J Petit Oiseau"
 VIE_scout_helicopter_equipment_4_short:0 "AH-6J Petit Oiseau"
 VIE_scout_helicopter_equipment_4_desc:0 "Le MH-6 Little Bird (surnommé Killer Egg) et sa variante d'attaque, l'AH-6, sont des hélicoptères légers utilisés pour les opérations spéciales de l'armée américaine. Initialement basé sur un OH-6A modifié, il fut ensuite basé sur le MD 500E, avec un seul rotor principal à cinq pales. La version la plus récente, le MH-6M, est basée sur le MD 530F et possède un rotor principal unique à six pales et un rotor de queue à quatre pales."
 VIE_scout_helicopter_equipment_5:0 "Bell OH-58F Kiowa Guerrier"
 VIE_scout_helicopter_equipment_5_short:0 "OH-58F Kiowa Guerrier"
 VIE_scout_helicopter_equipment_5_desc:0 "L'OH-58F est la désignation d'une mise à niveau de l'OH-58D. Le programme de mise à niveau du cockpit et des capteurs (CASUP) comprend un système de ciblage et de surveillance monté sur le nez en plus du capteur monté sur le mât de l'OH-58D. La charge utile du capteur commun (CSP) AAS-53 comprend une caméra infrarouge avancée, une caméra électro-optique couleur et un intensificateur d'image ; il devrait améliorer les performances de vol de 1 à 2 % grâce à des réductions de poids et de traînée."

 VIE_utility_helicopter_equipment_1:0 "Sikorsky H-34 Choctaw"
 VIE_utility_helicopter_equipment_1_short:0 "H-34 Choctaw"
 VIE_utility_helicopter_equipment_1_desc:0 "Le Sikorsky H-34 (désignation de la société S-58, désignation de la Marine HUS) est un hélicoptère militaire à moteur à pistons conçu à l'origine comme guerre anti-sous-marine (ASW), mais a ensuite été reconverti en transport moyen. Il deviendrait le dernier hélicoptère à moteur à pistons exploité par le Corps des Marines des États-Unis, car depuis lors, tous les hélicoptères utilisaient des moteurs à turbine. Dans la Marine (sous le nom d'UH-34), il est connu sous le nom de « Seahorse », tandis que les variantes de l'Armée (sous le nom de CH-34) ont pris le nom de « Choctaw »."
 VIE_utility_helicopter_equipment_2:0 "Bell UH-1A Iroquois"
 VIE_utility_helicopter_equipment_2_short:0 "UH-1A Iroquois"
 VIE_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."
 VIE_utility_helicopter_equipment_3:0 "Bell UH-1D Iroquois"
 VIE_utility_helicopter_equipment_3_short:0 "UH-1D Iroquois"
 VIE_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 VIE_utility_helicopter_equipment_4:0 "Bell UH-1H Huey"
 VIE_utility_helicopter_equipment_4_short:0 "UH-1H Huey"
 VIE_utility_helicopter_equipment_4_desc:0 "En 1966, Bell a installé le moteur Lycoming T53-L-13 de 1 400 shp (1 000 kW) pour fournir plus de puissance à l'avion. Le tube de Pitot a été déplacé du nez vers le toit du cockpit, pour éviter tout dommage lors de l'atterrissage. Les modèles de production dans cette configuration ont été désignés sous le nom d'UH-1H."
 VIE_utility_helicopter_equipment_5:0 "Bell UH-1H-II Huey"
 VIE_utility_helicopter_equipment_5_short:0 "UH-1H-II Huey"
 VIE_utility_helicopter_equipment_5_desc:0 "Un UH-1H modifié et remotorisé, les améliorations étaient un turbomoteur Allison T53-L-703 fournissant 1 343 kW (1 800 shp), un système de réduction des vibrations, des contre-mesures infrarouges et un cockpit compatible avec des lunettes de vision nocturne (NVG). Cela améliore considérablement les performances et la rentabilité."
 VIE_utility_helicopter_equipment_6:0 "Bell UH-1L Huey"
 VIE_utility_helicopter_equipment_6_short:0 "UH-1L Huey"
 VIE_utility_helicopter_equipment_6_desc:0 "Variante utilitaire de la variante TH-1L qui elle-même est un entraîneur de vol pour hélicoptère basé sur le HH-1K pour la marine américaine."
 VIE_utility_helicopter_equipment_7:0 "Bell UH-1Y Venin"
 VIE_utility_helicopter_equipment_7_short:0 "Venin UH-1Y"
 VIE_utility_helicopter_equipment_7_desc:0 "Le Bell UH-1Y Venom (également appelé Super Huey) est un hélicoptère utilitaire bimoteur de taille moyenne, construit par Bell Helicopter dans le cadre du programme de mise à niveau H-1 du Corps des Marines des États-Unis. L'un des derniers membres de la nombreuse famille Huey, l'UH-1Y est également appelé « Yankee », basé sur la prononciation de l'alphabet phonétique OTAN de sa variante de lettre."

 VIE_cargo_helicopter_equipment_1:0 "Boeing CH-47A Chinook"
 VIE_cargo_helicopter_equipment_1_short:0 "CH-47A Chinook"
 VIE_cargo_helicopter_equipment_1_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à rotor tandem qui compte parmi les hélicoptères de transport les plus lourds de l'Ouest. Remplaçant le CH-37 Mojave, le CH-47 possède plusieurs moyens de chargement de diverses marchandises, notamment plusieurs portes à travers le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. C'était également l'hélicoptère le plus rapide parmi ses contemporains lors de son introduction en 1962, et il est toujours considéré actuellement comme l'un des hélicoptères les plus rapides de l'arsenal de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État de Washington actuel."
 VIE_cargo_helicopter_equipment_2:0 "Boeing CH-47B Chinook"
 VIE_cargo_helicopter_equipment_2_short:0 "CH-47B Chinook"
 VIE_cargo_helicopter_equipment_2_desc:0 "Le CH-47B était une solution provisoire pendant que Boeing travaillait sur un CH-47C plus considérablement amélioré. Le CH-47B était propulsé par deux moteurs Lycoming T55-L-7C de 2 850 ch (2 130 kW). Il comportait un pylône de rotor arrière émoussé, des pales de rotor asymétriques redessinées et des virures le long de la rampe arrière et du fuselage pour améliorer les caractéristiques de vol."
 VIE_cargo_helicopter_equipment_3:0 "Boeing CH-47D Chinook"
 VIE_cargo_helicopter_equipment_3_short:0 "CH-47D Chinook"
 VIE_cargo_helicopter_equipment_3_desc:0 "Le CH-47D partage la même cellule que les modèles précédents, la principale différence étant l'adoption de moteurs plus puissants. Les premiers CH-47D étaient à l'origine propulsés par deux moteurs T55-L-712, le moteur le plus courant étant le dernier T55-GA-714A. Grâce à son système de chargement à triple crochet, le CH-47D peut transporter de lourdes charges utiles à l'intérieur et jusqu'à 26 000 lb (12 000 kg) (comme des conteneurs de 40 pieds ou de 12 mètres) à l'extérieur. Il a été mis en service pour la première fois en 1979. Dans les opérations d'assaut aérien, il sert souvent de moteur principal à l'obusier M198 de 155 mm, accompagnant 30 cartouches et un équipage de 11 hommes."
 VIE_cargo_helicopter_equipment_4:0 "Sikorsky CH-53E Super Étalon"
 VIE_cargo_helicopter_equipment_4_short:0 "CH-53E Super Étalon"
 VIE_cargo_helicopter_equipment_4_desc:0 "En octobre 1967, le Corps des Marines des États-Unis a émis un besoin en matière d'hélicoptère d'une capacité de levage 1,8 fois supérieure à celle du CH-53D, qui pourrait être installé sur des navires de guerre amphibie. L'US Navy et l'US Army recherchaient également à l'époque des hélicoptères similaires. Avant l'émission de l'exigence, Sikorsky travaillait sur une amélioration du CH-53D, sous la désignation d'entreprise « S-80 », comprenant un troisième turbomoteur et un système de rotor plus puissant. Sikorsky a proposé la conception du S-80 aux Marines en 1968. Les Marines ont apprécié l'idée, car elle promettait de fournir rapidement une bonne solution et ont financé le développement d'un hélicoptère de banc d'essai pour évaluation. Le contrat de production initial a été attribué en 1978 et le lancement du service a suivi en février 1981."
 VIE_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Bloc II"
 VIE_cargo_helicopter_equipment_5_short:0 "CH-47D Bloc II"
 VIE_cargo_helicopter_equipment_5_desc:0 "CH-47D mis à niveau avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les Chinook plus anciens ont été mis à niveau vers cette norme."
 VIE_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 VIE_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 VIE_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, un CH-47D amélioré, a effectué son vol inaugural ; le premier modèle de production a été déployé le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les mises à niveau comprennent des moteurs Honeywell de 4 868 chevaux (3 630 kW) et la cellule dotée d'une plus grande construction monobloc pour réduire les besoins de maintenance. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion pour augmenter la durée de vie."
