 PRC_irbm_equipment_4:0 "Dong Feng-3"
 PRC_irbm_equipment_4_short:0 "DF-3"
 PRC_irbm_equipment_4_desc:0 "Le DF-3 est souvent considéré comme le premier missile balistique à portée intermédiaire (IRBM) « domestique » de Chine. La conception commune des ICBM a été grandement influencée par le missile soviétique R-14 Chusovaya et le moteur du premier étage lui-même était une copie directe du moteur d'appoint С.2.1100/С.2.1150 La-350 développé par Aleksei Isaev à l'OKB-2 (NII-88)."
 PRC_irbm_equipment_5:0 "Dong Feng-4"
 PRC_irbm_equipment_5_short:0 "DF-4"
 PRC_irbm_equipment_5_desc:0 "Le Dong Feng 4 ou DF-4 est un missile balistique intercontinental chinois à deux étages de première génération à combustible liquide."
 # PRC_irbm_equipment_6:0 ""
 # PRC_irbm_equipment_6_short:0 ""
 # PRC_irbm_equipment_6_desc:0 ""
 PRC_irbm_equipment_7:0 "DF-16"
 PRC_irbm_equipment_7_short:0 "DF-16"
 PRC_irbm_equipment_7_desc:0 "Le DF-16 est un nouveau modèle de missile qui a une portée plus longue que le DF-15 (entre 800 et 1 000 km (500 et 620 mi))."
 PRC_irbm_equipment_8:0 "DF-25"
 PRC_irbm_equipment_8_short:0 "DF-25"
 PRC_irbm_equipment_8_desc:0 "Le DF-25 était un IRBM à combustible solide à deux étages à lancement mobile avec une portée de 3 200 kilomètres (2 000 mi). Le développement aurait été annulé en 1996. Le ministère américain de la Défense, dans son rapport de 2013 au Congrès sur les développements militaires de la Chine, n'a fait aucune mention du DF-25 comme missile en service."

