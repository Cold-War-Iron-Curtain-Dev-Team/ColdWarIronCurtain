 #Cruise Missile
 cruisemissile_equipment_0:0 "Missile de croisière d'attaque terrestre I"
 cruisemissile_equipment_0_short:0 "Missile de croisière I"
 cruisemissile_equipment_0_desc:0 "Un LACM ou missile de croisière d'attaque terrestre de première génération basé sur des conceptions allemandes de la Seconde Guerre mondiale."
