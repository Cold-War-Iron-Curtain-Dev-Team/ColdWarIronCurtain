 #Man-portable UAV
 SOV_mp_uav_1:0 "ENICS T10E Eléron-1"
 SOV_mp_uav_1_short:0 "Éléron-1"
 SOV_mp_uav_1_desc:0 "Le système de surveillance à distance T10 Eleron-1 est conçu pour la surveillance à distance depuis les airs d'objets, notamment des structures, des routes, des ponts, des véhicules, des oléoducs et gazoducs, des lignes électriques, des individus et des groupes de personnes."
 SOV_mp_uav_2:0 "ENICS T23E Eléron-3"
 SOV_mp_uav_2_short:0 "Eléron-3"
 SOV_mp_uav_2_desc:0 "Le système d'observation à distance T23E « Eleron-3 » est destiné à surveiller les situations au sol. Le système est autonome et peut être utilisé sur des sites non préparés en termes d'ingénierie dans des conditions météorologiques simples, avec des vitesses de vent allant jusqu'à 10 m/s, pendant la journée, à des températures de moins 20 à plus 40 degrés et une humidité de 98 %."

 #UAV CAS
 SOV_cas_uav_equipment_1:0 "Tupolev Tu-300 'Korshun-U'"
 SOV_cas_uav_equipment_1_short:0 "Tu-300"
 SOV_cas_uav_equipment_1_desc:0 "Le développement a commencé en 1982, le bureau Tupolev a conçu l'engin en utilisant des éléments de drones de reconnaissance de la génération précédente."
 SOV_cas_uav_equipment_2:0 "Tranzas Dozor-3"
 SOV_cas_uav_equipment_2_short:0 "Bouteur"
 SOV_cas_uav_equipment_2_desc:0 "Le système Dozor-3 appartient à la classe des drones lourds à moyenne altitude avec une longue durée de vol, utilisés pour patrouiller les frontières terrestres et maritimes et effectuer des reconassains, surveiller des objets et des zones."
 SOV_cas_uav_equipment_3:0 "Mikoyan Skat"
 SOV_cas_uav_equipment_3_short:0 "Patinage"
 SOV_cas_uav_equipment_3_desc:0 "Mikoyan Skat (qui signifie patin en russe) est un véhicule aérien sans pilote de reconnaissance et d'attaque. L'accent a été mis sur la faible observabilité et le drone a donc été conçu dans une configuration d'aile volante, en forme de triangle, avec utilisation de matériaux composites et avec un armement caché dans deux baies d'armes internes."
 
 #Naval CAS
 SOV_naval_uav_equipment_1:0 "Yakovlev Pchela-1T"
 SOV_naval_uav_equipment_1_short:0 "Pchéla-1T"
 SOV_naval_uav_equipment_1_desc:0 "Le Yakovlev Pchela-1T est un véhicule aérien sans pilote (UAV) fabriqué par le bureau de conception russe Yakovlev. Premier vol où en 1990 Son utilisation principale est la surveillance et l'observation dans des environnements de champ de bataille avec vidéo en liaison descendante. Cela fait partie du complexe d'observation \"Stroy-P\". D'autres mises en oeuvre et utilisations incluent la désignation de cible et comme cible de formation. Le Pchela est lancé à l'aide de l'assistance de fusée par deux moteurs-fusées d'appoint à propergol solide, et il est récupéré par parachute."
 SOV_naval_uav_equipment_2:0 "Yakovlev Pchela-1M"
 SOV_naval_uav_equipment_2_short:0 "Pchéla-1M"
 SOV_naval_uav_equipment_2_desc:0 "Une version modifiée du drone \"Pchela-1T\", avec une nouvelle avionique, pour le complexe \"Stroy-PM\"."
 SOV_naval_uav_equipment_3:0 "Yakovlev Pchela-1K"
 SOV_naval_uav_equipment_3_short:0 "Pchéla-1K"
 SOV_naval_uav_equipment_3_desc:0 "Modification du \"Pchela-1M\", avec l'installation d'un moteur à haute altitude et des équipements embarqués améliorés pour travailler dans des conditions de faible luminosité."

