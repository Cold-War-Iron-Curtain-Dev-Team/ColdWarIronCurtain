 CAN_jet_multirole_equipment_1:0 "De Havilland Vampire F.3"
 CAN_jet_multirole_equipment_1_short:0 "Vampire F.3"
 CAN_jet_multirole_equipment_1_desc:0 "Le Vampire avait pour fonction d'initier les pilotes de chasse canadiens non seulement à la propulsion à réaction, mais également à d'autres commodités telles que la pressurisation du poste de pilotage et la disposition du train d'atterrissage tricycle. Il s'est avéré être un avion populaire, facile à piloter et souvent considéré comme un « hot rod ». Au service canadien, le Vampire a servi dans les unités opérationnelles et de la réserve aérienne (400, 401, 402, 411, 438 et 442 escadrons)."
 CAN_jet_multirole_equipment_2:0 "Canadair CL-13 Sabre Mark 4"
 CAN_jet_multirole_equipment_2_short:0 "Sabre Mk.4"
 CAN_jet_multirole_equipment_2_desc:0 " le premier Sabre Mk.4 a volé avec le moteur Orenda 10, ce qui lui a donné un net avantage en termes de taux de montée et de plafond par rapport aux variantes précédentes. D'autres améliorations du Mk 5 comprenaient un nouveau système d'oxygène et une maniabilité améliorée et des caractéristiques à basse vitesse obtenues en augmentant la corde de l'aile de six pouces (15,2 cm) à l'emplanture et de trois pouces (7,2 cm) au bout de l'aile ainsi qu'en installant une petite clôture d'aile verticale."
 CAN_jet_multirole_equipment_3:0 "Canadair CL-13 Sabre Mark 5"
 CAN_jet_multirole_equipment_3_short:0 "Sabre Mk.5"
 CAN_jet_multirole_equipment_3_desc:0 "Le Canadair Sabre Mk.5 était la dernière variante finale. Il était équipé d'un moteur Orenda à deux étages développant 7 275 lb (3 302 kg) de poussée statique. Ses performances en altitude et son taux de montée ont été améliorés par rapport au Mk 5 et le rétablissement des lamelles du bord d'attaque de l'aile lui a conféré d'excellentes caractéristiques à basse vitesse."
 CAN_jet_multirole_equipment_4_short:0 "Sabre Mk.6"
 CAN_jet_multirole_equipment_4_desc:0 "Le Canadair Sabre Mk.6 était une variante équipée d'un sidewinder et est la dernière variante. Il était considéré comme la « meilleure » Sabre de production jamais construite. Avec points d'attache de montage pour les AIM-9B Sidewinders."
 CAN_jet_multirole_equipment_5:0 "Chasseur stellaire Canadair CF-104"
 CAN_jet_multirole_equipment_5_short:0 "Chasseur stellaire CF-104"
 CAN_jet_multirole_equipment_5_desc:0 "Le Canadair CF-104 Starfighter (CF-111, CL-90) est une version modifiée du chasseur supersonique Lockheed F-104 Starfighter construit au Canada par Canadair sous licence. Il était principalement utilisé comme avion d'attaque au sol, bien qu'il ait été conçu comme intercepteur. Il a servi dans l'Aviation royale canadienne (ARC) et plus tard dans les Forces armées canadiennes (FAC)."
 CAN_jet_multirole_equipment_6:0 "Canadair CF-104 Starfighter RU"
 CAN_jet_multirole_equipment_6_short:0 "CF-104 Starfighter RU"
 CAN_jet_multirole_equipment_6_desc:0 "Amélioration de la fiabilité des premiers Starfighters"
 CAN_jet_multirole_equipment_7:0 "Performances améliorées du Canadair CF-104 Starfighter"
 CAN_jet_multirole_equipment_7_short:0 "CF-104 Starfighter IP"
 CAN_jet_multirole_equipment_7_desc:0 "Mise à niveau de l'avionique de l'ancien Starfighter pour permettre le montage d'armes modernes telles que l'AGM-65"
 CAN_jet_multirole_equipment_8:0 "Mise à jour de mi-vie du chasseur CF-104 Starfighter de Canadair"
 CAN_jet_multirole_equipment_8_short:0 "CF-104 Starfighter MLU"
 CAN_jet_multirole_equipment_8_desc:0 "Mise à jour à mi-vie de la flotte de F-104"
 CAN_jet_multirole_equipment_9:0 "McDonnell Douglas CF-18 Hornet"
 CAN_jet_multirole_equipment_9_short:0 "CF-18 Hornet"
 CAN_jet_multirole_equipment_9_desc:0 "Le McDonnell Douglas CF-18 Hornet (désignation militaire officielle CF-188) est une variante de l'Aviation royale canadienne (ARC) de l'avion de combat américain McDonnell Douglas F/A-18 Hornet. "
 CAN_jet_multirole_equipment_10:0 "Projet de modernisation progressive du CF-18 Hornet de McDonnell Douglas, phase I"
 CAN_jet_multirole_equipment_10_short:0 "CF-18 Hornet IMP Phase I"
 CAN_jet_multirole_equipment_10_desc:0 "Le McDonnell Douglas CF-18 Hornet (désignation militaire officielle CF-188) est une variante de l'Aviation royale canadienne (ARC) de l'avion de combat américain McDonnell Douglas F/A-18 Hornet. "
 
 CAN_mr_stealth_fighter_equipment_1:0 "Lockheed Martin CF-35A Lightning II"
 CAN_mr_stealth_fighter_equipment_1_short:0 "CF-35A Foudre II"
 CAN_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnel (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le développement du programme F-35 a commencé en 1992, la variante A prenant son envol fin 2006 et larguant ses premières bombes moins de six ans plus tard. La variante A est la variante la plus petite et la plus légère du F-35 et est principalement destinée à remplacer le F-16 Fighting Falcon."
 
 CAN_jet_light_equipment_1:0 "Canadair CT-133 Silver Star"
 CAN_jet_light_equipment_1_short:0 "Étoile d'argent CT-133"
 CAN_jet_light_equipment_1_desc:0 "Le Canadair CT-133 Silver Star (numéro de modèle d'entreprise CL-30) est la version canadienne construite sous licence de l'avion d'entraînement à réaction Lockheed T-33, en service des années 1950 à 2005. La version canadienne était propulsée par le turboréacteur Rolls-Royce Nene 10, tandis que la production de Lockheed utilisait l'Allison J33."
 CAN_jet_light_equipment_2:0 "Canadair CT-114 Tuteur"
 CAN_jet_light_equipment_2_short:0 "CT-114 Tuteur"
 CAN_jet_light_equipment_2_desc:0 "Les débuts du CL-41 Tutor remontent à la décision du constructeur aéronautique canadien Canadair de développer son propre avion d'entraînement local en tant qu'entreprise privée. La conception elle-même était le produit du service de conception préliminaire interne de l'entreprise. En août 1957, la configuration de base de la conception était terminée, il s'agissait d'un avion à turboréacteur à ailes basses, doté d'un train d'atterrissage tricycle et d'un cockpit côte à côte. Dès le début du développement, l'avion était destiné à être un avion d'entraînement spécialement conçu pour fournir une formation élémentaire au vol à réaction, ainsi qu'une formation supplémentaire jusqu'à un niveau avancé."
 CAN_jet_light_equipment_3:0 "Chasseur de la Liberté Canadair CF-5A"
 CAN_jet_light_equipment_3_short:0 "Chasseur de la liberté CF-5A"
 CAN_jet_light_equipment_3_desc:0 "Le Canadair CF-5/CF-116 est la version sous licence Canadair de l'avion de chasse américain Northrop F-5 Freedom Fighter, principalement destiné aux Forces canadiennes sous le nom de CF-5 et à l'Aviation royale néerlandaise sous le nom de NF-5"
 CAN_jet_light_equipment_4:0 "Chasseur de la liberté Canadair CF-5D"
 CAN_jet_light_equipment_4_short:0 "Chasseur de la liberté CF-5D"
 CAN_jet_light_equipment_4_desc:0 "Le Canadair CF-5/CF-116 est la version sous licence Canadair de l'avion de chasse américain Northrop F-5 Freedom Fighter, principalement destiné aux Forces canadiennes sous le nom de CF-5 et à l'Aviation royale néerlandaise sous le nom de NF-5"
 CAN_jet_light_equipment_5:0 "Hawker Siddeley CT-155 Faucon"
 CAN_jet_light_equipment_5_short:0 "Faucon CT-155"
 CAN_jet_light_equipment_5_desc:0 "Version d'exportation du Hawker Siddeley Hawk pour les Forces armées canadiennes, désigné CT-155 Hawk en service au Canada. Il comprend des points d'attache pour les gunpods, les missiles Sidewinder et jusqu'à 6 800 livres de bombes."

 CAN_jet_interceptor_equipment_1:0 "Canadair Météore F.4"
 CAN_jet_interceptor_equipment_1_short:0 "Météore F.4"
 CAN_jet_interceptor_equipment_1_desc:0 "Un Canadien a acquis le Meteor F.4 pour des fonctions d'interception."
 CAN_jet_interceptor_equipment_2:0 "Avro Canada CF-100 Canuck Mk.1"
 CAN_jet_interceptor_equipment_2_short:0 "CF-100 Canuck Mk.1"
 CAN_jet_interceptor_equipment_2_desc:0 "l'Avro Canada CF-100 Canuck (affectueusement connu sous le nom de « Clunk ») est un intercepteur/chasseur biréacteur canadien conçu et produit par l'avionneur Avro Canada. Il a la particularité d'être le seul chasseur de conception canadienne à entrer en production de masse."
 CAN_jet_interceptor_equipment_3:0 "Avro Canada CF-100 Canuck Mk.3"
 CAN_jet_interceptor_equipment_3_short:0 "CF-100 Canuck Mk.3"
 CAN_jet_interceptor_equipment_3_desc:0 "L'Avro Canada CF-100 Canuck (affectueusement connu sous le nom de « Clunk ») est un intercepteur/chasseur biréacteur canadien conçu et produit par l'avionneur Avro Canada. Il a la particularité d'être le seul chasseur de conception canadienne à entrer en production de masse."
 CAN_jet_interceptor_equipment_4:0 "Avro Canada CF-100 Canuck Mk.5"
 CAN_jet_interceptor_equipment_4_short:0 "CF-100 Canuck Mk.5"
 CAN_jet_interceptor_equipment_4_desc:0 "L'Avro Canada CF-100 Canuck (affectueusement connu sous le nom de « Clunk ») est un intercepteur/chasseur biréacteur canadien conçu et produit par l'avionneur Avro Canada. Il a la particularité d'être le seul chasseur de conception canadienne à entrer en production de masse. "
 CAN_jet_interceptor_equipment_5:0 "McDonnell CF-101B Voodoo"
 CAN_jet_interceptor_equipment_5_short:0 "CF-101B Vaudou"
 CAN_jet_interceptor_equipment_5_desc:0 "Le McDonnell F-101 Voodoo est un chasseur à réaction supersonique qui a servi l'US Air Force (USAF) et l'Aviation royale canadienne (ARC). 112 F-101B ont été transférés à l'Aviation royale canadienne et renommés CF-101B en service dans l'ARC."
 CAN_jet_interceptor_equipment_6:0 "McDonnell CF-101C Voodoo"
 CAN_jet_interceptor_equipment_6_short:0 "CF-101C Vaudou"
 CAN_jet_interceptor_equipment_6_desc:0 "Mise à niveau théorique portant le CF-101B au standard C."
 CAN_jet_interceptor_equipment_7:0 "Flèche longue portée Avro Canada CF-105"
 CAN_jet_interceptor_equipment_7_short:0 "Flèche longue portée CF-105"
 CAN_jet_interceptor_equipment_7_desc:0 "L'avant-dernière version de l'industrie aérospatiale canadienne en difficulté. Au début de 1957, des études ont commencé sur la façon dont l'Arrow Mk.2 pourrait être développé en une « flèche à longue portée » pour répondre aux exigences du programme expérimental d'intercepteur à longue portée (LRIX) de l'USAF. On a pensé que cela convenait aux termes de divers accords, déclarations et promesses faites aux pays alliés et en particulier aux pays du Commonwealth."

 CAN_high_mach_jet_interceptor_equipment_1:0 "Avro Canada CF-103"
 CAN_high_mach_jet_interceptor_equipment_1_short:0 "CF-103"
 CAN_high_mach_jet_interceptor_equipment_1_desc:0 "l'Avro Canada CF-103 était un projet d'intercepteur canadien, conçu par Avro Canada au début des années 1950 comme un développement et un remplacement possible du CF-100 Canuck de l'entreprise, qui entrait à l'époque en service dans l'Aviation royale canadienne (ARC). Bien que destiné à voler à des vitesses transsoniques, le CF-103 n'offrait qu'une augmentation modérée de ses performances et de ses capacités par rapport au CF-100."
 CAN_high_mach_jet_interceptor_equipment_2:0 "Chasseur avancé Avro Canada C-104"
 CAN_high_mach_jet_interceptor_equipment_2_short:0 "C-104"
 CAN_high_mach_jet_interceptor_equipment_2_desc:0 "Après la mise en conserve du CF-103 et alors que les demandes canadiennes pour un nouvel intercepteur n'étaient toujours pas satisfaites, une étude de conception finirait par conduire à un projet C-104 plus avancé. Deux versions d'une conception de chasseur à ailes delta connue sous le nom de C104 furent soumises à l'ARC. Le monomoteur C104/4 et le bimoteur C104/2. Les conceptions étaient par ailleurs similaires, utilisant une aile delta montée sur basse ; les principaux avantages du C104/2 étaient une taille globale plus grande qui offrait une soute à armes interne beaucoup plus grande et donnait la fiabilité d'un bimoteur. "
 CAN_high_mach_jet_interceptor_equipment_3:0 "Avro Canada CF-105 Flèche"
 CAN_high_mach_jet_interceptor_equipment_3_short:0 "Flèche CF-105"
 CAN_high_mach_jet_interceptor_equipment_3_desc:0 "L'Arrow était le point culminant d'une série d'études de conception commencées en 1953 qui examinaient des versions améliorées de l'Avro Canada CF-100 Canuck. Après des études approfondies, l'ARC a choisi un modèle considérablement plus puissant, et le développement sérieux a commencé en mars 1955. L'avion était destiné à être construit directement à partir de la chaîne de production, sautant la phase traditionnelle de prototype construit à la main. Le premier Arrow Mk. 1, RL-201, a été rendu public le 4 octobre 1957, le même jour que le lancement de Spoutnik I. "
 CAN_high_mach_jet_interceptor_equipment_4:0 "Avro Canada CF-105 Flèche Mk.2"
 CAN_high_mach_jet_interceptor_equipment_4_short:0 "CF-105 Flèche Mk.2"
 CAN_high_mach_jet_interceptor_equipment_4_desc:0 "La version Mk 2 devait être équipée des moteurs Orenda PS-13 Iroquois et serait évaluée par les pilotes d'acceptation de l'ARC ainsi que par les pilotes d'essai de l'Avro. Les nouveaux moteurs PS-13S ont été conçus pour produire 30 000 lbf (130 kN) chacun. Le système de contrôle de tir Astra/Sparrow avait été supprimé par le gouvernement en septembre 1958 et tous les avions devaient utiliser la combinaison Hughes/Falcon. Au moment de l'annulation de l'ensemble du programme, le premier Arrow Mk 2, le RL-206, était prêt pour les essais de roulage. Avro s'attendait à ce qu'il batte le record du monde de vitesse,"

 CAN_recon_equipment_0:0 "Taylorcraft Auster AOP6"
 CAN_recon_equipment_0_short:0 "Auster AOP6"
 CAN_recon_equipment_0_desc:0 "Le Taylorcraft Auster était un avion de liaison et d'observation militaire britannique produit par la société Taylorcraft Airplanes (England) Limited pendant la Seconde Guerre mondiale. "
 CAN_jet_recon_equipment_0:0 "Avro Canada CF-100 Mk1P "
 CAN_jet_recon_equipment_0_short:0 "CF-100 Mk 1P "
 CAN_jet_recon_equipment_0_desc:0 "Version de reconnaissance photographique proposée du CF-100 Canuck produit par Avro Canada."
 CAN_jet_recon_equipment_1:0 "Chasseur Freedom CF-5A(R) de Canadair"
 CAN_jet_recon_equipment_1_short:0 "Chasseur de la liberté CF-5A(R)"
 CAN_jet_recon_equipment_1_desc:0 "Version de reconnaissance monoplace pour les Forces canadiennes. Construit en petit nombre. Désignation des Forces canadiennes CF-116A(R)."
 CAN_jet_recon_equipment_2:0 "McDonnell EF-101B Vaudou électrique"
 CAN_jet_recon_equipment_2_short:0 "Vaudou électrique EF-101B"
 CAN_jet_recon_equipment_2_desc:0 "L'EF-101B était une conversion d'un F-101B ordinaire, incorporant la suite de brouillage électronique d'un EB-57E Canberra. Un seul avion a été converti avant l'annulation du programme et ce seul exemplaire a été loué au Canada. Les deux derniers Voodoos ont continué à voler jusqu'en avril 1987, date à laquelle ils ont finalement été mis à la retraite."

 CAN_nav_bomber_equipment_1:0 "Supermarine Stranraer"
 CAN_nav_bomber_equipment_1_short:0 "Straner"
 CAN_nav_bomber_equipment_1_desc:0 "Le Supermarine Stranraer était un hydravion conçu et construit par la société britannique Supermarine Aviation Works. Il a été développé dans les années 1930 pour le compte de son principal opérateur, la Royal Air Force."
 CAN_nav_bomber_equipment_2:0 "Sunderland court"
 CAN_nav_bomber_equipment_2_short:0 "Sunderland"
 CAN_nav_bomber_equipment_2_desc:0 "Le Short S.25 Sunderland était un bombardier de patrouille britannique avec hydravion, développé et construit par Short Brothers pour la Royal Air Force (RAF). L'avion tire son nom de service de la ville (plus tard, ville) et du port de Sunderland, dans le nord-est de l'Angleterre. "
 CAN_nav_bomber_equipment_3:0 "Lockheed PV-2 Ventura GR.5"
 CAN_nav_bomber_equipment_3_short:0 "PV-2 Ventura GR.5"
 CAN_nav_bomber_equipment_3_desc:0 "Au total, 157 Ventura G.R. Marc. Les V ont été utilisés opérationnellement par l'ARC du 16 juin 1942 au 18 avril 1947 dans le rôle de patrouille côtière de défense intérieure dans le Commandement aérien de l'Est et de l'Ouest. "
 CAN_nav_bomber_equipment_4:0 "Canadair CL-29 North Star ASW"
 CAN_nav_bomber_equipment_4_short:0 "CL-29 North Star ASW"
 CAN_nav_bomber_equipment_4_desc:0 "proposition d'avion de patrouille maritime de 1949 faite en prévision des besoins de l'ARC, avec un fuselage étiré et remotorisé avec trois options de moteurs. Les spécifications finales de l'ARC de 1952 prévoyaient un avion beaucoup plus performant et le Bristol Britannia serait plutôt utilisé comme base."
 CAN_nav_bomber_equipment_5:0 "Lockheed CP-122 Neptune"
 CAN_nav_bomber_equipment_5_short:0 "CP-122 Neptune"
 CAN_nav_bomber_equipment_5_desc:0 "La désignation de l'Aviation royale canadienne du pod P2V-7.Jet n'était pas initialement installée sur 25 avions P2V-7 livrés à l'ARC, mais a ensuite été modernisée pour les avoir de toute façon."
 CAN_nav_bomber_equipment_6:0 "Canadair CP-107 Argus"
 CAN_nav_bomber_equipment_6_short:0 "CP-107 Argus"
 CAN_nav_bomber_equipment_6_desc:0 "Le Canadair CP-107 Argus est un avion de patrouille maritime conçu et fabriqué par Canadair pour l'Aviation royale canadienne (ARC). Dans ses premières années, l'Argus était réputé être le meilleur bombardier de patrouille anti-sous-marin au monde."
 CAN_nav_bomber_equipment_7:0 "Lockheed CP-140A Aurore"
 CAN_nav_bomber_equipment_7_short:0 "CP-140A Aurore"
 CAN_nav_bomber_equipment_7_desc:0 "Le Lockheed CP-140 Aurora est un avion de patrouille maritime exploité par l'Aviation royale canadienne. L'avion est basé sur la cellule Lockheed P-3 Orion, mais monte la suite électronique du Lockheed S-3 Viking. \"Aurora\" fait référence à la déesse romaine de l'aube qui vole chaque matin dans le ciel devant le soleil."
 CAN_nav_bomber_equipment_8:0 "Lockheed CP-140M Aurore"
 CAN_nav_bomber_equipment_8_short:0 "CP-140M Aurore"
 CAN_nav_bomber_equipment_8_desc:0 "Version modernisée du CP-140A Aurora pour utilisation comme avion anti-sous-marin et de patrouille avec l'Aviation royale canadienne. Armé de capteurs avancés, de bouées sonar et de torpilles modernes."
 
 CAN_transport_plane_equipment_1:0 "Train aérien Douglas CC-129"
 CAN_transport_plane_equipment_1_short:0 "Train aérien CC-129"
 CAN_transport_plane_equipment_1_desc:0 "Désignation des Forces canadiennes pour le C-47."
 CAN_transport_plane_equipment_2:0 "Canadair C-5 Étoile du Nord"
 CAN_transport_plane_equipment_2_short:0 "C-5 Étoile du Nord"
 CAN_transport_plane_equipment_2_desc:0 "Les North Stars de l'ARC n'étaient pas pressurisés et étaient utilisés pour diverses tâches de transport. Les North Stars ont également été employés par le 412e Escadron de l'ARC pour diverses tâches de transport de personnalités et, dans l'ensemble, les avions ont fourni des services de transport à longue distance précieux et fiables à l'ARC."
 CAN_transport_plane_equipment_3:0 "Bristol Type 170 Cargo"
 CAN_transport_plane_equipment_3_short:0 "Cargo"
 CAN_transport_plane_equipment_3_desc:0 "Le Bristol Type 170 Freighter est un avion bimoteur britannique conçu et construit par la Bristol Airplane Company à la fois comme avion de fret et de ligne. Son utilisation la plus connue était celle de ferry aérien pour transporter des voitures et leurs passagers sur des distances relativement courtes. Une version réservée aux passagers a également été produite, connue sous le nom de Wayfarer."
 CAN_transport_plane_equipment_4:0 "Canadair CC-109 Cosmopolite"
 CAN_transport_plane_equipment_4_short:0 "CC-109 Cosmopolite"
 CAN_transport_plane_equipment_4_desc:0 "Le CC-109 Cosmopolitan ou « Cosmo » en service dans l'ARC est devenu l'avion VIP standard et a remplacé le Douglas Dakota et le North American B-25 Mitchell dans les tâches de transport léger. Les avions Cosmopolitan ont également été déployés en Europe pour le soutien du contingent canadien de l'OTAN ainsi qu'aux États-Unis pour soutenir les opérations canadiennes du NORAD. "
 CAN_transport_plane_equipment_5:0 "De Havilland Canada CC-115 Buffalo"
 CAN_transport_plane_equipment_5_short:0 "CC-115 Buffle"
 CAN_transport_plane_equipment_5_desc:0 "Le de Havilland Canada DHC-5 Buffalo est un avion de transport utilitaire à turbopropulseur à décollage et atterrissage courts (STOL) développé à partir du précédent DHC-4 Caribou à pistons. L'avion a des performances STOL extraordinaires et est capable de décoller sur des distances beaucoup plus courtes que ce que même la plupart des avions légers peuvent gérer. "
 CAN_transport_plane_equipment_6:0 "Canadair CC-106 Yukon"
 CAN_transport_plane_equipment_6_short:0 "CC-106Yukon"
 CAN_transport_plane_equipment_6_desc:0 "Initialement, le CL-44-6 a été produit pour l'ARC sous le nom de CC-106 Yukon. Une fois les problèmes initiaux résolus, le Yukon s'est bien comporté au service de l'ARC et, en décembre 1961, un Yukon a établi un record du monde pour sa classe en parcourant 6 750 mi (10 860 km) de Tokyo à la station de l'ARC de Trenton, en Ontario, en 17 heures et trois minutes à une vitesse moyenne de 400 mph."
 CAN_transport_plane_equipment_7:0 "de Havilland Canada CC-132 Dash 7"
 CAN_transport_plane_equipment_7_short:0 "CC-132 Tiret 7"
 CAN_transport_plane_equipment_7_desc:0 "Désignation militaire canadienne pour la série 102/103. Populairement connu sous le nom de Dash 7, est un avion de ligne régional à turbopropulseur doté de performances de décollage et d'atterrissage courts (STOL). Il a volé pour la première fois en 1975 et est resté en production jusqu'en 1988."
 CAN_transport_plane_equipment_8:0 "Lockheed CC-130H-30 Super Hercules"
 CAN_transport_plane_equipment_8_short:0 "CC-130H-30"
 CAN_transport_plane_equipment_8_desc:0 "Désignation pour les avions Hercules des Forces armées canadiennes/Aviation royale canadienne. L'US Air Force a utilisé la désignation CC-130H pour différencier la variante standard C-130H de la désignation « étendue » de l'entreprise C-130H, C-130H-30."
 CAN_transport_plane_equipment_10:0 "Boeing CC-177 Globemaster III"
 CAN_transport_plane_equipment_10_short:0 "CC-177 Globemaster III"
 CAN_transport_plane_equipment_10_desc:0 "Variante canadienne du vénérable et variante améliorée du C-17 Globemaster III. Cette mise à niveau logicielle/matérielle constituait une amélioration majeure du système embarqué de génération de gaz inerte amélioré (OBIGGS II), d'un nouveau radar météorologique, d'un système de jambe de force stabilisatrice amélioré et d'autres éléments avioniques."

 CAN_jet_strat_bomber_equipment_1:0 "Avro Lincoln II"
 CAN_jet_strat_bomber_equipment_1_short:0 "Lincoln II"
 CAN_jet_strat_bomber_equipment_2:0 "Canadair B-47 Stratojet"
 CAN_jet_strat_bomber_equipment_2_short:0 "B-47 Stratojet"
 CAN_jet_strat_bomber_equipment_2_desc:0 "B-47B prêté au Canada et converti par Canadair sous la désignation CL-52 pour tester les moteurs Orenda du CF-105 Avro Arrow en 1956. Même s'il a été renvoyé aux États-Unis et mis au rebut seulement un an plus tard, que se passerait-il s'il était réellement acheté comme bombardier ?"

#CV
 
 CAN_cv_CAS_equipment_1:0 "Marine royale canadienne"
 CAN_cv_CAS_equipment_1_short:0 "MRC"
 CAN_cv_CAS_equipment_1_desc:0 "La Marine royale canadienne (Marine royale canadienne) est la force navale du Canada. La MRC est l'un des trois commandements environnementaux des Forces armées canadiennes."

 CAN_cv_CAS_equipment_2:0 "Labbe de Blackburn"
 CAN_cv_CAS_equipment_2_short:0 "Labbe"
 CAN_cv_CAS_equipment_3:0 "Fairey Firefly Mk.1"
 CAN_cv_CAS_equipment_3_short:0 "Luciole Mk.1"
 CAN_cv_CAS_equipment_3_desc:0 "Le Canada a choisi d'acquérir le Firefly malgré l'opposition qui préconisait plutôt l'achat d'avions américains. En guise de mesure provisoire, des Fireflies de la Royal Navy ont été prêtés tandis que des avions spécialement conçus plus avancés étaient en cours de construction."
 CAN_cv_jet_CAS_equipment_1:0 "Fairey Firefly AS Mk.5"
 CAN_cv_jet_CAS_equipment_1_short:0 "Luciole AS Mk.5"
 CAN_cv_jet_CAS_equipment_1_desc:0 "La Marine canadienne employait 65 lucioles AS Mk.5 sur ses porte-avions. Le dernier Firefly AS.Mk 5 était un avion anti-sous-marin, qui transportait des bouées sonores et du matériel américains."
 CAN_cv_jet_CAS_equipment_2:0 "Hawker Sea Fury FB.11"
 CAN_cv_jet_CAS_equipment_2_short:0 "Fureur marine FB.11"
 CAN_cv_jet_CAS_equipment_2_desc:0 "Chasseur-bombardier monoplace pour la Royal Navy, la Royal Australian Navy, la Royal Canadian Navy et la Royal Dutch Navy, 615 construits, dont 31 pour la RAN et 53 pour la MRC."

 CAN_cv_fighter_equipment_1:0 "Gladiateur des mers Gloster"
 CAN_cv_fighter_equipment_1_short:0 "Gladiateur des mers"
 CAN_cv_fighter_equipment_1_desc:0 "Un Mk II modifié, le Sea Gladiator, a été développé pour la Fleet Air Arm (FAA), avec un crochet d'arrêt, des points de fixation de catapulte, une cellule renforcée et un carénage inférieur pour un canot de sauvetage, le tout pour les opérations à bord de porte-avions."
 CAN_cv_fighter_equipment_2:0 "Supermarine Seafire F Mk.17"
 CAN_cv_fighter_equipment_2_short:0 "Seafire F Mk.17"
 CAN_cv_fighter_equipment_2_desc:0 "Le Supermarine Seafire est une version navale du Supermarine Spitfire adaptée pour être utilisée à partir de porte-avions. Son concept était analogue au Hawker Sea Hurricane, une version navalisée du compagnon d'écurie du Spitfire, le Hawker Hurricane. Le nom Seafire est dérivé de l'abréviation du nom plus long Sea Spitfire"
 CAN_cv_fighter_equipment_3:0 "Supermarine Seafire FR 47"
 CAN_cv_fighter_equipment_3_short:0 "Feu de mer FR.47"
 CAN_cv_fighter_equipment_3_desc:0 "La version finale du Seafire était le Seafire F Mk 47 et le FR Mk 47. Il n'y avait pas de véritable prototype. En tant que Seafire « définitif » basé sur un porte-avions, le Mk 47 a incorporé plusieurs améliorations par rapport aux variantes précédentes. Tous les Mk 47 ont adopté les hélices contrarotatives Rotol."
 CAN_cv_jet_multirole_equipment_1:0 "Hawker Sea Fury F.11"
 CAN_cv_jet_multirole_equipment_1_short:0 "Fureur marine F.11"
 CAN_cv_jet_multirole_equipment_1_desc:0 "Chasseur-bombardier monoplace pour la Royal Navy, la Royal Australian Navy, la Royal Canadian Navy et la Royal Dutch Navy, 615 construits, dont 31 pour la RAN et 53 pour la MRC."
 CAN_cv_jet_multirole_equipment_2:0 "McDonnell Douglas F2H-3 Banshee"
 CAN_cv_jet_multirole_equipment_2_short:0 "F2H-3 Banshee"
 CAN_cv_jet_multirole_equipment_2_desc:0 "Le McDonnell F2H Banshee était un avion de combat à réaction monoplace embarqué par la Marine américaine et le Corps des Marines des États-Unis de 1948 à 1961. C'était l'un des principaux chasseurs américains utilisés pendant la guerre de Corée et le seul chasseur à réaction déployé par la Marine royale canadienne."

