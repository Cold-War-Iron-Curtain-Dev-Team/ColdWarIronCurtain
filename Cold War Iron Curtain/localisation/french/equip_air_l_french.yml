 POR_jet_light_equipment_4:0 "Fiat G.91R/4"
 POR_jet_light_equipment_4_short:0 "G.91R/4"
 POR_jet_light_equipment_5:0 "Dornier Alpha Jet A"
 POR_jet_light_equipment_5_short:0 "Alpha Jet A"
 POR_jet_light_equipment_5_desc:0 "La Luftwaffe a décidé d'utiliser l'Alpha Jet principalement dans le rôle de frappe légère, préférant poursuivre la formation au pilotage dans le sud-ouest des États-Unis sur des types d'entraîneurs américains au lieu d'effectuer une formation en Allemagne, bien que l'Allemagne ait également utilisé des Alpha Jets basés à Beja, au Portugal, pour l'entraînement aux armes."

 POR_recon_equipment_0:0 "Westland Lysandre IIIA"
