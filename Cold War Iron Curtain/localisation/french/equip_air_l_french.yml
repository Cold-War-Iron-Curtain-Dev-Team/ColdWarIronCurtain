 ISR_stealth_tactical_bomber_equipment_2_desc:0 "Le F-15IA (Israel Advanced) est une variante proposée pour l'armée de l'air israélienne basée sur le F-15EX et l'Advanced Eagle."

 ISR_strat_bomber_equipment_1:0 "Forteresse volante Boeing B-17"
 ISR_strat_bomber_equipment_1_short:0 "Forteresse volante B-17"
 ISR_strat_bomber_equipment_1_desc:0 "Le B-17 est un bombardier stratégique quadrimoteur développé au milieu des années 1930 pour l'US Army Air Corps. C'était le troisième bombardier le plus produit pendant la Seconde Guerre mondiale et il a servi avec distinction sur le théâtre européen du conflit, responsable des campagnes de bombardement en Allemagne à partir de bases du sud de l'Angleterre et de l'Italie. Son armement défensif hérissé convient parfaitement à un avion surnommé la « Forteresse volante »."

 ISR_nav_bomber_equipment_1:0 "PBY-1 Catalina consolidé"
 ISR_nav_bomber_equipment_1_short:0 "PBY-1"
 ISR_nav_bomber_equipment_1_desc:0 "Variante de production initiale avec deux moteurs R-1830-64 de 900 ch. Le Consolidated PBY Catalina est un hydravion et un avion amphibie produits dans les années 1930 et 1940. En service au Canada, il était connu sous le nom de Canso. C'était l'un des hydravions les plus utilisés de la Seconde Guerre mondiale. Catalinas a servi dans toutes les branches des forces armées des États-Unis ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont servi jusque dans les années 1980. En 2021, 86 ans après son premier vol, l'avion continue de voler comme bombardier à eau (ou avion-citerne) dans le cadre d'opérations aériennes de lutte contre les incendies dans certaines régions du monde. Aucun ne reste au service militaire. "
 ISR_nav_bomber_equipment_2:1 "PBY-5 Catalina consolidé"
 ISR_nav_bomber_equipment_2_short:1 "PBY-5"
 ISR_nav_bomber_equipment_2_desc:0 "Le Consolidated PBY Catalina est un hydravion et un avion amphibie produits dans les années 1930 et 1940. En service au Canada, il était connu sous le nom de Canso. C'était l'un des hydravions les plus utilisés de la Seconde Guerre mondiale. Catalinas a servi dans toutes les branches des forces armées des États-Unis ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont servi jusque dans les années 1980. En 2021, 86 ans après son premier vol, l'avion continue de voler comme bombardier à eau (ou avion-citerne) dans le cadre d'opérations aériennes de lutte contre les incendies dans certaines régions du monde. Aucun ne reste au service militaire. "

