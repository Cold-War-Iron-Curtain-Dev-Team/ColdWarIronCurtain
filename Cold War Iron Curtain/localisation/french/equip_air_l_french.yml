 JAP_transport_plane_equipment_1:0 "Douglas R4D Manazuru"
 JAP_transport_plane_equipment_1_short:0 "R4D Manazuru"
 JAP_transport_plane_equipment_1_desc:0 "Développé à partir de l'avion de ligne Douglas DC-3 lors de son premier vol en 1941, le C-47 était l'avion de transport par excellence utilisé par les Alliés. Pendant la Seconde Guerre mondiale, les forces armées de nombreux pays ont utilisé le C-47 et des DC-3 modifiés pour le transport de troupes, de marchandises et de blessés. Plus de 10 000 unités, à la fois le C-47 et la variante navale R4D (plus tard C-117) ont été construites pour la guerre, et de nombreux « Skytrains » ont été utilisés non seulement pour le transport de troupes et de marchandises, mais aussi pour la recherche et le sauvetage et, pendant la guerre du Vietnam, comme premiers hélicoptères de combat."
 JAP_transport_plane_equipment_2:0 "Curtiss C-46A Commando"
 JAP_transport_plane_equipment_2_short:0 "Commando C-46A"
 JAP_transport_plane_equipment_2_desc:0 "La Japan Air Self-Defense Force a utilisé le Commando au moins jusqu'en 1966, date à laquelle elle a commencé le développement du Kawasaki C-1."
 JAP_transport_plane_equipment_3:0 "Curtiss C-46J Commando"
 JAP_transport_plane_equipment_3_short:0 "Commando C-46J"
 JAP_transport_plane_equipment_3_desc:0 "La Japan Air Self-Defense Force a utilisé le Commando au moins jusqu'en 1966, date à laquelle elle a commencé le développement du Kawasaki C-1."
 JAP_transport_plane_equipment_4:0 "Lockheed C-130 Hercules"
 JAP_transport_plane_equipment_4_short:0 "C-130 Hercules"
 JAP_transport_plane_equipment_4_desc:0 "Développé en 1954, le C-130 est un moyen de transport capable d'utiliser des pistes non préparées pour les décollages et les atterrissages, ce qui en fait un cadre pratique pour le transport de troupes et de marchandises ainsi que pour les évacuations médicales. Mais ce qui rend l'avion digne de son surnom de « Hercules », c'est qu'il y avait plusieurs sous-variantes développées pour une variété de rôles, allant du Gunship (AC-130 Spooky & Spectre), au contrôle de drones (DC-130), au Jammer et aux PSYOPS (EC-130 Compass Call) et à la reconnaissance météorologique (WC-130), entre autres. Vraiment une machine polyvalente qui mérite son surnom."
 JAP_transport_plane_equipment_5:0 "NMC YS-11"
 JAP_transport_plane_equipment_5_short:0 "YS-11"
 JAP_transport_plane_equipment_5_desc:0 "Le NAMC YS-11 est un avion de ligne à turbopropulseur conçu et construit par Nihon Aircraft Manufacturing Corporation (NAMC), un consortium japonais. C'était le seul avion de ligne d'après-guerre entièrement conçu et fabriqué au Japon jusqu'au développement du Mitsubishi SpaceJet dans les années 2010, environ 50 ans plus tard."
 JAP_transport_plane_equipment_6:0 "Kawasaki C-1"
 JAP_transport_plane_equipment_6_short:0 "C-1"
 JAP_transport_plane_equipment_6_desc:0 "Le Kawasaki C-1 (川崎 C-1) est un avion de transport militaire bimoteur à courte portée développé et fabriqué par le conglomérat japonais Kawasaki Heavy Industries. Il est uniquement utilisé par la Japan Air Self-Defense Force (JASDF). "
 JAP_transport_plane_equipment_7:0 "Lockheed C-130H Hercules"
 JAP_transport_plane_equipment_7_short:0 "C-130H Hercules"
 #JAP_transport_plane_equipment_7_desc:0 ""
 JAP_transport_plane_equipment_8:0 "Lockheed C-130H-30 Hercules"
 JAP_transport_plane_equipment_8_short:0 "Lockheed C-130H-30 Hercules"
 #JAP_transport_plane_equipment_8_desc:0 ""
 #JAP_transport_plane_equipment_9:0 "Boeing C-17A Globemaster III Block 21"
 #JAP_transport_plane_equipment_9_short:0 "C-17A Block 21"
 #JAP_transport_plane_equipment_9_desc:0 "This software/hardware upgrade was a major improvement of the improved Onboard Inert Gas-Generating System (OBIGGS II), a new weather radar, an improved stabilizer strut system and other avionics."
 JAP_transport_plane_equipment_10:0 "KawasakiC-2"
 JAP_transport_plane_equipment_10_short:0 "C-2"
 JAP_transport_plane_equipment_10_desc:0 "Le Kawasaki C-2 (anciennement XC-2 et C-X) est un avion de transport militaire à double turboréacteur de taille moyenne, à longue portée et à grande vitesse, développé et fabriqué par Kawasaki Aerospace Company. En juin 2016, le C-2 est officiellement entré en service au sein de la Japan Air Self-Defense Force (JASDF)."

 #JASDF Helicopters
 JAP_naval_helicopter_equipment_1:0 "Sikorsky H-5"
 JAP_naval_helicopter_equipment_1_short:0 "H-5"
 #JAP_naval_helicopter_equipment_1_desc:0 "The Kawasaki KH-4 was a light utility helicopter produced in Japan in the 1960s as a development of the Bell 47 that Kawasaki had been building under licence since 1952. The most visible difference between the KH-4 and its forerunner was its new and enlarged cabin."
 JAP_naval_helicopter_equipment_2:0 "Sikorsky HSS-1N Umitsubame"
 JAP_naval_helicopter_equipment_2_short:0 "HSS-1N Umitsubame"
 JAP_naval_helicopter_equipment_2_desc:0 "Le HSS est la variante anti-sous-marine du S-58 de Sikorsky, une version améliorée du S-55 (et du H-19 Chickasaw militaire). Il avait un nez plus petit, mais avec un fuselage arrière et un train d'atterrissage à traîneau de queue, plutôt que le modèle à queue haute et à 4 montants de son prédécesseur. Plus tard rebaptisé SH-34G, les variantes anti-sous-marins de cet hélicoptère ont reçu le surnom officiel de « Seabat »."
 JAP_naval_helicopter_equipment_3:0 "Mitsubishi HSS-2 Chidori"
 JAP_naval_helicopter_equipment_3_short:0 "HSS-2 Chidori"
 #JAP_naval_helicopter_equipment_3_desc:0 "Introduced in the early 1960s as a replacement for the SH-34 Seabat, the SH-2 (originally designated HU2K) was the first anti-submarine helicopter capable of being deployed on U.S. vessels besides Aircraft Carriers. This portability prolonged the career of the 'Seasprite' and upgraded variants existed. The variant depicted in game is the 'D' variant, the initial anti-submarine variant."
 JAP_naval_helicopter_equipment_4:0 "Mitsubishi HSS-2A Chidori"
 JAP_naval_helicopter_equipment_4_short:0 "HSS-2A Chidori"
 JAP_naval_helicopter_equipment_4_desc:0 "Développé à partir du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère ASW bimoteur. Il s'agissait du premier hélicoptère amphibie au monde, capable de décoller à la fois depuis la terre et depuis la mer. Il fut également, aux côtés de son contemporain le Seasprite, l'un des premiers hélicoptères ASW à utiliser des turbomoteurs. En plus des fonctions ASW, le SH-3 a également joué des rôles de recherche et de sauvetage (SAR), de transport, d'évacuation sanitaire et d'alerte précoce aéroportée (AEW), un certain nombre d'hélicoptères étant utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pour cette raison qu'il a gagné le surnom de « Sea King », l'hélicoptère le plus polyvalent au monde."
 JAP_naval_helicopter_equipment_5:0 "Mitsubishi HSS-2B Chidori"
 JAP_naval_helicopter_equipment_5_short:0 "HSS-2B Chidori"
 #JAP_naval_helicopter_equipment_5_desc:0 "The Mitsubishi H-60 series is twin-turboshaft engine helicopter based on the Sikorsky S-70 helicopter family for use by the Japan Self-Defense Forces (JSDF). The SH-60J/K are anti-submarine patrol versions for the Japan Maritime Self-Defense Force (JMSDF)."
 JAP_naval_helicopter_equipment_6:0 "Mitsubishi SH-60J Seahawk"
 JAP_naval_helicopter_equipment_6_short:0 "SH-60J Seahawk"
 JAP_naval_helicopter_equipment_6_desc:0 "La série Mitsubishi H-60 est un hélicoptère à double turbomoteur basé sur la famille d'hélicoptères Sikorsky S-70 destiné à être utilisé par les Forces d'autodéfense japonaises (JSDF). Les SH-60J/K sont des versions de patrouille anti-sous-marine pour la Force maritime d'autodéfense japonaise (JMSDF)."
 JAP_naval_helicopter_equipment_7:0 "Mitsubishi SH-60K Seahawk"
 JAP_naval_helicopter_equipment_7_short:0 "SH-60K Seahawk"
 JAP_naval_helicopter_equipment_7_desc:0 "Le SH-60K est une version améliorée du SH-60J. L'hélicoptère anti-sous-marin SH-60K qui a renforcé les performances et la polyvalence de la JMSDF. Mitsubishi a commencé le développement en 1997. Le SH-60K était auparavant connu sous le nom de SH-60Kai."

 JAP_attack_helicopter_equipment_1:0 "Bell UH-1B Huey Gunship"
 JAP_attack_helicopter_equipment_1_short:0 "Navire de combat UH-1B"
 JAP_attack_helicopter_equipment_1_desc:0 "Variante de canonnière du Bell UH-1B armée de nacelles de fusée FFAR des Forces d'autodéfense japonaises (JSDF)."
 JAP_attack_helicopter_equipment_2:0 "Bell AH-1S Cobra"
 JAP_attack_helicopter_equipment_2_short:0 "AH-1S Cobra"
 JAP_attack_helicopter_equipment_2_desc:0 "L'AH-1S de base est un AH-1Q amélioré avec un turbomoteur T53-L-703 de 1 800 shp (1 300 kW). L'AH-1S est équipé du sous-système de missile M65 TOW/Cobra, de l'unité de visée télescopique (TSU) M65 et du viseur Reflex M73. Le Japon a fabriqué 89 AH-1S Cobra sous licence de Fuji Heavy Industries de 1984 à 2000. Ce type est utilisé par la Force d'autodéfense terrestre japonaise et est un modèle Step 3, qui est à peu près l'équivalent des AH-1F de l'armée américaine."
 JAP_attack_helicopter_equipment_3:0 "Bell AH-1S Cobra Étape 3"
 JAP_attack_helicopter_equipment_3_short:0 "AH-1S Cobra Étape 3"
 #JAP_attack_helicopter_equipment_3_desc:0 ""
 JAP_attack_helicopter_equipment_4:0 "Fuji Heavy Industries AH-64DJP Apache"
 JAP_attack_helicopter_equipment_4_short:0 "AH-64DJPApache"
 JAP_attack_helicopter_equipment_4_desc:0 "Fierté de l'armée américaine, en plus de sa superbe maniabilité, le radar Longbow fixé au-dessus du rotor principal améliore sa capacité à utiliser des missiles dans toutes sortes de conditions météorologiques. En raison du radar susmentionné, on lui donne le surnom d'« Apache Longbow »."
 JAP_attack_helicopter_equipment_5:0 "Fuji Heavy Industries AH-64EJP Gardien"
 JAP_attack_helicopter_equipment_5_short:0 "Gardien AH-64EJP"
 JAP_attack_helicopter_equipment_5_desc:0 "L'AH-64E est doté d'une connectivité numérique améliorée, du système de distribution d'informations tactiques interarmées, de moteurs T700-GE-701D plus puissants avec une transmission par train frontal améliorée pour accueillir plus de puissance, d'une capacité de contrôle de véhicules aériens sans pilote (UAV), d'une capacité IFR complète et d'un train d'atterrissage amélioré. Les nouvelles pales de rotor composites, testées avec succès en 2004, augmentent la vitesse de croisière, le taux de montée et la capacité de charge utile."
 
 JAP_scout_helicopter_equipment_1:0 "Kawasaki OH-6J Cayuse"
 JAP_scout_helicopter_equipment_1_short:0 "OH-6J Cayuse"
 JAP_scout_helicopter_equipment_1_desc:0 "Hélicoptère léger d'observation basé sur l'OH-6A Cayuse pour la JGSDF. Construit par Kawasaki Heavy Industries sous licence au Japon."
 JAP_scout_helicopter_equipment_2:0 "Kawasaki OH-6D Loach"
 JAP_scout_helicopter_equipment_2_short:0 "Loach OH-6D"
 JAP_scout_helicopter_equipment_2_desc:0 "Hélicoptère léger d'observation et de reconnaissance basé sur le Hughes Model 500D pour le JGSDF. Construit par Kawasaki Heavy Industries sous licence au Japon."
 JAP_scout_helicopter_equipment_3:0 "Kawasaki OH-6DA Loach"
 JAP_scout_helicopter_equipment_3_short:0 "Loach OH-6DA"
 JAP_scout_helicopter_equipment_3_desc:0 "Au lieu des OH-6D abandonnés, JMSDF a acheté des MD 500E, nommés OH-6DA, notamment à des fins de formation."
 JAP_scout_helicopter_equipment_4:0 "MBB/Kawasaki BK117"
 JAP_scout_helicopter_equipment_4_short:0 "BK117"
 JAP_scout_helicopter_equipment_4_desc:0 "Le MBB/Kawasaki BK 117 est un hélicoptère utilitaire-de transport moyen bimoteur. Il a été développé et fabriqué conjointement par Messerschmitt-Bölkow-Blohm (MBB) d'Allemagne et Kawasaki du Japon. MBB a ensuite été racheté par Daimler-Benz et est finalement devenu une partie d'Eurocopter, qui a ensuite été rebaptisé Airbus Helicopters. "
 JAP_scout_helicopter_equipment_5:0 "Kawasaki OH-1 « Ninja »"
 JAP_scout_helicopter_equipment_5_short:0 "OH-1 « Ninja »"
 JAP_scout_helicopter_equipment_5_desc:0 "Le Kawasaki OH-1 (surnommé « Ninja ») est un hélicoptère militaire de reconnaissance et d'observation développé et fabriqué par la société Kawasaki Aerospace. Le principal opérateur est la Force terrestre d'autodéfense japonaise (JGSDF), qui a initialement acheté l'OH-1 en tant que successeur de sa flotte d'OH-6D Loach, produite dans le pays."

 JAP_utility_helicopter_equipment_1:0 "Sikorsky S-55"
 JAP_utility_helicopter_equipment_1_short:0 "S-55"
 JAP_utility_helicopter_equipment_1_desc:0 "Le Sikorsky H-19 Chickasaw (numéro de modèle S-55) était un hélicoptère polyvalent utilisé par l'armée américaine et l'armée de l'air américaine. Il a également été construit sous licence par Westland Aircraft sous le nom de Westland Whirlwind au Royaume-Uni."
 JAP_utility_helicopter_equipment_2:0 "Bell UH-1B Hiyodori"
 JAP_utility_helicopter_equipment_2_short:0 "UH-1B Hiyodori"
 JAP_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."
 JAP_utility_helicopter_equipment_3:0 "Bell UH-1H Hiyodori"
 JAP_utility_helicopter_equipment_3_short:0 "UH-1H Hiyodori"
 JAP_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 JAP_utility_helicopter_equipment_4:0 "Bell UH-1J Hiyodori"
 JAP_utility_helicopter_equipment_4_short:0 "UH-1J Hiyodori"
 JAP_utility_helicopter_equipment_4_desc:0 "Version améliorée de l'UH-1H Huey au service des Forces d'autodéfense japonaises."
 JAP_utility_helicopter_equipment_5:0 "Mitsubishi UH-60J"
 JAP_utility_helicopter_equipment_5_short:0 "UH-60J"
 JAP_utility_helicopter_equipment_5_desc:0 "Entré en service en 1979, l'UH-60A a succédé à l'UH-1 en tant que plate-forme d'hélicoptère utilitaire de l'armée américaine. Développé à partir du S-70 civil, l'UH-60A pouvait transporter jusqu'à 15 personnes (4 membres d'équipage et jusqu'à 11 soldats équipés). Nommé d'après un chef de tribu amérindienne Sauk, le « Blackhawk » a servi au combat lors de conflits à la Grenade, au Panama, en Irak, en Somalie, dans les Balkans, en Afghanistan et dans d'autres régions du Moyen-Orient."
 JAP_utility_helicopter_equipment_6:0 "Mitsubishi UH-60JA "
 JAP_utility_helicopter_equipment_6_short:0 "EUH-60JA"
 JAP_utility_helicopter_equipment_6_desc:0 "Une mise à niveau de l'UH-60A, la variante « L » du « Blackhawk » comprend des moteurs améliorés, une boîte de vitesses à durabilité améliorée et un système de commandes de vol mis à jour. Introduit en 1990, l'UH-60L est la principale variante de la variante utilitaire du H-60 actuellement en service dans l'armée américaine, avec des considérations sur le type utilisé pour remplacer l'UH-1N dans l'US Air Force."
 JAP_utility_helicopter_equipment_7:0 "Mitsubishi USH-60K"
 JAP_utility_helicopter_equipment_7_short:0 "USH-60K"
 JAP_utility_helicopter_equipment_7_desc:0 "Pales de rotor à large corde de conception améliorée, moteurs T700-GE-701D (max 2 000 shp ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur du système de gestion intégré de la santé du véhicule (IVHMS) et nouveau cockpit en verre."

 JAP_cargo_helicopter_equipment_1:0 "Piasecki CH-21C"
 JAP_cargo_helicopter_equipment_1_short:0 "CH-21C"
 #JAP_cargo_helicopter_equipment_1_desc:0 "The CH-47 (originally HC-1B) is a twin-engine, tandem-rotor helicopter that is among the heaviest lifting helicopters of the West. Replacing the CH-37 Mojave, the CH-47 possesses several means of loading various cargo, including multiple doors across the fuselage, a wide loading ramp located at the rear of the fuselage, and a total of three external ventral cargo hooks to carry underslung loads. It was also the fastest helicopter among its contemporaries when introduced in 1962, and is still considered one of the fastest choppers in the U.S. Army's arsenal currently. Its name, 'Chinook', is from the Native American Chinook people of modern-day Washington state."
 JAP_cargo_helicopter_equipment_2:0 "Kawasaki KV-107II-1"
 JAP_cargo_helicopter_equipment_2_short:0 "KV-107"
 JAP_cargo_helicopter_equipment_2_desc:0 "La variante commerciale, le BV 107-II, a été commandée pour la première fois par New York Airways en 1960. En juillet 1962, ils ont pris livraison de leurs trois premiers avions, configurés pour accueillir jusqu'à 25 passagers. En 1965, Boeing Vertol vend les droits de fabrication du 107 au conglomérat japonais Kawasaki Heavy Industries. Dans le cadre de cet arrangement, tous les avions civils et militaires modèle 107 construits au Japon étaient désignés par la désignation KV 107."
 JAP_cargo_helicopter_equipment_3:0 "Kawasaki CH-47J Chinook"
 JAP_cargo_helicopter_equipment_3_short:0 "CH-47J Chinook"
 JAP_cargo_helicopter_equipment_3_desc:0 "Le CH-47D partage la même cellule que les modèles précédents, la principale différence étant l'adoption de moteurs plus puissants. Les premiers CH-47D étaient à l'origine propulsés par deux moteurs T55-L-712, le moteur le plus courant étant le dernier T55-GA-714A. Grâce à son système de chargement à triple crochet, le CH-47D peut transporter de lourdes charges utiles à l'intérieur et jusqu'à 26 000 lb (12 000 kg) (comme des conteneurs de 40 pieds ou de 12 mètres) à l'extérieur. Il a été mis en service pour la première fois en 1979. Dans les opérations d'assaut aérien, il sert souvent de moteur principal à l'obusier M198 de 155 mm, accompagnant 30 cartouches et un équipage de 11 hommes."
 JAP_cargo_helicopter_equipment_4:0 "Kawasaki KV-107IIA-4"
 JAP_cargo_helicopter_equipment_4_short:0 "KV-107A"
 JAP_cargo_helicopter_equipment_4_desc:0 "Version améliorée destinée au transport d'assaut et utilitaire construite pour la Force terrestre d'autodéfense japonaise (JGSDF)."
 JAP_cargo_helicopter_equipment_5:0 "Kawasaki CH-47JA Chinook"
 JAP_cargo_helicopter_equipment_5_short:0 "CH-47JA Chinook"
 JAP_cargo_helicopter_equipment_5_desc:0 "CH-47D mis à niveau avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les Chinook plus anciens ont été mis à niveau vers cette norme."
 JAP_cargo_helicopter_equipment_6:0 "Boeing CH-47FJ Chinook"
 JAP_cargo_helicopter_equipment_6_short:0 "CH-47FJ Chinook"
 JAP_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, un CH-47D amélioré, a effectué son vol inaugural ; le premier modèle de production a été déployé le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les mises à niveau comprennent des moteurs Honeywell de 4 868 chevaux (3 630 kW) et la cellule dotée d'une plus grande construction monobloc pour réduire les besoins de maintenance. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion pour augmenter la durée de vie."


 ######## CHI
 CHI_fighter_equipment_0:0 "Force aérienne de la République de Chine"
 CHI_fighter_equipment_0_short:0 "ROCAF"
 CHI_fighter_equipment_0_desc:0 "La Force aérienne de la République de Chine (ROCAF) a été officiellement créée par le Kuomintang (KMT) après la création du ministère de l'Aviation en 1920. Alors que les tensions montaient entre la Chine et le Japon impérial dans les années 1930, les unités aériennes des seigneurs de guerre chinois, y compris celles de l'armée de l'air provinciale du Guangdong, et les aviateurs chinois d'outre-mer, furent intégrées au commandement centralisé de la ROCAF, nominalement sous le nom de Force aérienne nationaliste de Chine, et se coordonnèrent avec le Deuxième Front uni pour contrer l'invasion et l'occupation impériale japonaise."
 CHI_fighter_equipment_1:0 "Curtiss-Wright CW-21"
 CHI_fighter_equipment_1_short:0 "CW-21"
 CHI_fighter_equipment_2:0 "AFAMF XP-0 Chu"
 CHI_fighter_equipment_2_short:0 "XP-0 Chu"
 CHI_fighter_equipment_3_desc:0 "Le Chu XP-0, également connu sous le nom de Chu (AFAMF) XP-0, était un prototype de chasseur chinois de la Seconde Guerre mondiale."
 CHI_fighter_equipment_3:0 "F-51D Mustang nord-américain"
 CHI_fighter_equipment_3_short:0 "F-51D Mustang"
 
 CHI_jet_multirole_equipment_1:0 "F-47N Thunderbolt nord-américain"
 CHI_jet_multirole_equipment_1_short:0 "F-47N Coup de tonnerre"
 CHI_jet_multirole_equipment_2:0 "Sabre nord-américain F-86A"
 CHI_jet_multirole_equipment_2_short:0 "Sabre F-86A"
 CHI_jet_multirole_equipment_2_desc:0 "Le F-86 est un chasseur à réaction à ailes en flèche développé et introduit à la fin des années 1940 à partir de recherches capturées par les Allemands. La conception de l'avion le rendait capable d'atteindre des vitesses transsoniques et une grande maniabilité, caractéristiques qui le rendaient capable de gérer son célèbre rival, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, aux côtés de ses variantes canadiennes et australiennes réunies, en ferait l'avion de combat occidental le plus produit de l'histoire de l'aviation."
 CHI_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 CHI_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 CHI_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 CHI_jet_multirole_equipment_4:0 "Super Sabre nord-américain F-100"
 CHI_jet_multirole_equipment_4_short:0 "F-100 Super Sabre"
