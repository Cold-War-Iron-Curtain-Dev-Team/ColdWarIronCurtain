 ########### YUGOSLAVIA
 
 YUG_fighter_equipment_0:0 "Force aérienne yougoslave et défense aérienne"
 YUG_fighter_equipment_0_short:0 "RV et PVO"
 YUG_fighter_equipment_0_desc:0 "L'armée de l'air et la défense aérienne étaient l'une des trois branches de l'armée populaire yougoslave, l'armée yougoslave. Communément appelée Force aérienne yougoslave, à son apogée, elle était parmi les plus grandes d'Europe."

 YUG_fighter_equipment_1:0 "Ikarus IK-2"
 YUG_fighter_equipment_1_short:0 "IK-2"
 YUG_fighter_equipment_2:0 "Supermarine Spitfire F Mk.V"
 YUG_fighter_equipment_2_short:0 "Spitfire F Mk.V"
 YUG_fighter_equipment_3:0 "République F-47D-40 Thunderbolt"
 YUG_fighter_equipment_3_short:0 "F-47D-40 Coup de tonnerre"
 
 YUG_jet_multirole_equipment_1:0 "Ikarus S-49"
 YUG_jet_multirole_equipment_1_short:0 "S-49"
 YUG_jet_multirole_equipment_1_desc:0 "L'Ikarus S-49 était un avion de combat monoplace et monomoteur yougoslave construit pour l'armée de l'air yougoslave peu après la Seconde Guerre mondiale. À la suite de la scission Tito-Staline en 1948, le RV i PVO s'est retrouvé avec un inventaire d'avions composé principalement d'avions soviétiques. Incapable d'acquérir de nouveaux avions ou des pièces de rechange pour sa flotte existante, le RV i PVO s'est tourné vers son industrie aéronautique nationale afin de créer une conception indigène pour répondre au besoin d'avions supplémentaires."
 YUG_jet_multirole_equipment_2:0 "Sabre nord-américain F-86A"
 YUG_jet_multirole_equipment_2_short:0 "Sabre F-86A"
 YUG_jet_multirole_equipment_3:0 "Sabre nord-américain F-86E"
 YUG_jet_multirole_equipment_3_short:0 "Sabre F-86E"
 YUG_jet_multirole_equipment_4:0 "Sabre nord-américain F-86H"
 YUG_jet_multirole_equipment_4_short:0 "Sabre F-86H"
 YUG_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 YUG_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 YUG_jet_multirole_equipment_5_short:0 "L-12"
 YUG_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PFM"
 YUG_jet_multirole_equipment_6_desc:0 "MiG-21 de conception est-allemande mis à jour avec des radars RP-21."
 YUG_jet_multirole_equipment_6_short:0 "L-14"
 YUG_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-21M "
 YUG_jet_multirole_equipment_7_desc:0 "Variante d'exportation du MiG-21S avec deux différences majeures : le radar RP-22 du MiG-21S a été remplacé par l'ancien radar RP-21MA et comportait un canon GSh-23L intégré au lieu d'une nacelle de canon. Dans le rôle air-air, il ne pouvait transporter que l'AAM à recherche IR R-3S sur ses quatre pylônes, car la variante SARH, le R-3R, n'était pas autorisée à l'exportation."
 YUG_jet_multirole_equipment_7_short:0 "L-15"
 YUG_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-21bis"
 YUG_jet_multirole_equipment_8_desc:0 "Le développement ultime du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et d'un grand nombre d'autres avancées par rapport aux types précédents. Ces MiG-21bis destinés à la PVO (Force de défense aérienne) soviétique étaient équipés du système Lazur GCI, tandis que ceux destinés à l'armée de l'air soviétique étaient équipés du système Polyot ILS."
 YUG_jet_multirole_equipment_8_short:0 "L-17"
 YUG_jet_multirole_equipment_9:0 "Mikoyan-Gourevitch MiG-21bis-K"
 #YUG_jet_multirole_equipment_9_desc:0 ""
 YUG_jet_multirole_equipment_9_short:0 "L-17K"
 YUG_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29"
 YUG_jet_multirole_equipment_10_desc:0 "La Yougoslavie a été le premier pays européen en dehors de l'Union soviétique à exploiter le MiG-29"
 YUG_jet_multirole_equipment_10_short:0 "L-18"
 
 YUG_mr_stealth_fighter_equipment_1:0 "SOKO L-19 Novi Avion"
 YUG_mr_stealth_fighter_equipment_1_short:0 "L-19"
 YUG_mr_stealth_fighter_equipment_1_desc:0 "Le Novi Avion (nouvel avion) était un programme d'avion de combat multirôle de quatrième génération qui devait être construit par l'avionneur yougoslave SOKO. L'Avion présentait une configuration delta-canard recadrée et devait être capable d'atteindre des vitesses supersoniques dans une configuration de combat. L'Avion partageait plusieurs points communs avec l'avion de combat Rafale de la société française Dassault Aviation ; La France avait fourni une assistance technique considérable à la Yougoslavie au cours du programme Avion."

