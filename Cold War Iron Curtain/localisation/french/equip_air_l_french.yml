 #ICBM
 icbm_equipment_1:0 "ICBM JE"
 icbm_equipment_1_short:0 "ICBM JE"
 icbm_equipment_1_desc:0 "Les ICBM sont des missiles balistiques à portée intercontinentale. Cette variante de base qui pourrait même faire mouche."
 icbm_equipment_2:0 "ICBM II"
 icbm_equipment_2_short:0 "ICBM II"
 icbm_equipment_2_desc:0 "Les ICBM sont des missiles balistiques à portée intercontinentale. Cette variante a été considérablement améliorée."
 icbm_equipment_3:0 "ICBM III"
 icbm_equipment_3_short:0 "ICBM III"
 icbm_equipment_3_desc:0 "Les ICBM sont des missiles balistiques à portée intercontinentale. Cette variante a une portée et des performances supérieures à la précédente."
 icbm_equipment_4:0 "IBM IV"
 icbm_equipment_4_short:0 "IBM IV"
 icbm_equipment_4_desc:0 "Les ICBM sont des missiles balistiques à portée intercontinentale. Cette variante a une charge utile importante et est capable d'employer des manoeuvres de base évasives lors de la phase d'impact terminal."
 icbm_equipment_5:0 "ICBM V"
 icbm_equipment_5_short:0 "ICBM V"
 icbm_equipment_5_desc:0 "Les ICBM sont des missiles balistiques à portée intercontinentale. Cette variante à longue portée a une charge utile importante et est capable d'employer des manoeuvres d'évasion avancées lors de la phase d'impact terminal."

 ###Helicopter###

 #Attack Helicopter
 attack_helicopter_equipment_1:0 "Hélicoptère d'attaque I"
 attack_helicopter_equipment_1_short:0 "Hélicoptère d'attaque I"
 attack_helicopter_equipment_1_desc:0 "Les premiers hélicoptères ou hélicoptères de combat d'attaque dotés d'un équipement de base composé de mitrailleuses, de canons d'avion ou de roquettes constituent une capacité inégalée dans sa capacité à planer et son excellente endurance sur un champ de bataille."
 attack_helicopter_equipment_2:0 "Hélicoptère d'attaque II"
 attack_helicopter_equipment_2_short:0 "Hélicoptère d'attaque II"
 attack_helicopter_equipment_2_desc:0 "Une conception d'hélicoptère plus aboutie, armée d'un canon à chaîne et d'ailettes spécialement conçus et construits pour loger des nacelles de fusée, des réservoirs de carburant ou des armes supplémentaires. Peut-être même que les missiles antichar seront inclus ?"
 attack_helicopter_equipment_3:0 "Hélicoptère d'attaque III"
 attack_helicopter_equipment_3_short:0 "Hélicoptère d'attaque III"
 attack_helicopter_equipment_3_desc:0 "Une conception améliorée des hélicoptères abritant plusieurs moteurs en cas de panne moteur et lui donnant de meilleures performances que ses prédécesseurs. Désormais armés d'une variété de munitions telles que des missiles et des roquettes, les canons sont tous disponibles pour être montés."
 attack_helicopter_equipment_4:0 "Hélicoptère d'attaque VI"
 attack_helicopter_equipment_4_short:0 "Hélicoptère d'attaque VI"
 attack_helicopter_equipment_4_desc:0 "Une conception avancée d'hélicoptère avec de nouveaux affichages tête haute, un cockpit semi-numérique et armé de radars de contrôle de tir pour détecter les forces adverses. Sa capacité de tir contextuel lui permet même de tirer avec son ensemble d'armes mortelles à couvert."
 attack_helicopter_equipment_5:0 "Hélicoptère d'attaque V"
 attack_helicopter_equipment_5_short:0 "Hélicoptère d'attaque V"
 attack_helicopter_equipment_5_desc:0 "Un hélicoptère moderne, entièrement numérique et en réseau, doté d'affichages et de systèmes de communication avancés, permet à cet hélicoptère de surpasser tous ceux qui l'ont précédé. Il dispose de systèmes d'armes avancés. Les missiles à guidage laser et sa capacité de mise en réseau lui permettent de s'intégrer de manière transparente aux forces terrestres amies ou à d'autres systèmes d'armes."

 #Scout Helicopter
 scout_helicopter_equipment_1:0 "Scout/Attaque légère I"
 scout_helicopter_equipment_1_short:0 "Hélicoptère éclaireur/d'attaque léger I"
 scout_helicopter_equipment_1_desc:0 "Un hélicoptère de reconnaissance léger et agile pour rechercher et repérer les positions ennemies."
 scout_helicopter_equipment_2:0 "Scout/Attaque légère II"
 scout_helicopter_equipment_2_short:0 "Hélicoptère éclaireur/d'attaque léger II"
 scout_helicopter_equipment_2_desc:0 "Un hélicoptère de reconnaissance léger et agile pour rechercher et repérer les positions ennemies. Avec son armement léger il est capable de se défendre."
 scout_helicopter_equipment_3:0 "Scout/Attaque légère III"
 scout_helicopter_equipment_3_short:0 "Hélicoptère éclaireur/d'attaque léger III"
 scout_helicopter_equipment_3_desc:0 "Un hélicoptère de reconnaissance léger et agile, armé de missiles, de roquettes ou de canons, peut assurer une reconnaissance en force des forces terrestres amies."
 scout_helicopter_equipment_4:0 "Scout/Attaque légère VI"
 scout_helicopter_equipment_4_short:0 "Hélicoptère éclaireur/d'attaque léger VI"
 scout_helicopter_equipment_4_desc:0 "Un hélicoptère de reconnaissance avancé armé d'un assortiment d'armes et d'instruments numériques peut survoler un champ de bataille et utiliser ses écrans et ses caméras FLIR pour trouver les positions ennemies de plus en plus rapidement qu'auparavant."
 scout_helicopter_equipment_5:0 "Scout/Attaque légère V"
 scout_helicopter_equipment_5_short:0 "Hélicoptère éclaireur/d'attaque léger V"
 scout_helicopter_equipment_5_desc:0 "Un excellent hélicoptère de reconnaissance moderne, armé jusqu'aux dents d'un assortiment d'armes mortelles et équipé d'écrans FLIR et de systèmes radar pour repérer une force ennemie avant même qu'elle ne sache que l'hélicoptère de reconnaissance est là."

 #Naval Helicopter
 naval_helicopter_equipment:0 "Hélicoptère naval ASW"
 naval_helicopter_equipment_1:0 "Hélicoptère naval ASW I"
 naval_helicopter_equipment_1_short:0 "Hélicoptère ASW I"
 naval_helicopter_equipment_1_desc:0 "Un des premiers hélicoptères de guerre anti-sous-marine doté d'un système de sonar plongeant installé pour détecter les sous-marins."
 naval_helicopter_equipment_2:0 "Hélicoptère naval ASW II"
 naval_helicopter_equipment_2_short:0 "Hélicoptère ASW II"
 naval_helicopter_equipment_2_desc:0 "Un premier hélicoptère de guerre anti-sous-marine amélioré doté d'un système de sonar plongeant installé pour trouver les sous-marins et la capacité de les engager avec des torpilles."
 naval_helicopter_equipment_3:0 "Hélicoptère naval ASW III"
 naval_helicopter_equipment_3_short:0 "Hélicoptère ASW III"
 naval_helicopter_equipment_3_desc:0 "Un hélicoptère de guerre anti-sous-marine amélioré avec un temps de flânage plus long, un système de sonar plongeant installé pour trouver les sous-marins et la capacité de les engager avec des torpilles."
 naval_helicopter_equipment_4:0 "Hélicoptère ASM naval IV"
 naval_helicopter_equipment_4_short:0 "Hélicoptère ASW IV"
 naval_helicopter_equipment_4_desc:0 "Un gros hélicoptère de guerre anti-sous-marine avec un temps de flânage plus long, un système de sonar plongeant installé pour trouver les sous-marins et la capacité de les engager avec des torpilles."
 naval_helicopter_equipment_5:0 "Hélicoptère ASM naval V"
 naval_helicopter_equipment_5_short:0 "Hélicoptère ASW V"
 naval_helicopter_equipment_5_desc:0 "Un grand hélicoptère de guerre anti-sous-marine amélioré avec un temps de flânage plus long, un système de sonar plongeant installé pour trouver les sous-marins et la capacité de les engager avec des torpilles."
 naval_helicopter_equipment_6:0 "Hélicoptère ASM naval VI"
 naval_helicopter_equipment_6_short:0 "Hélicoptère ASW VI"
 naval_helicopter_equipment_6_desc:0 "Un hélicoptère de guerre anti-sous-marine moderne avec de longues périodes de flânerie, un système de sonar plongeant amélioré installé pour trouver les sous-marins et la capacité de les engager avec des torpilles."
 naval_helicopter_equipment_7:0 "Hélicoptère naval ASW VII"
 naval_helicopter_equipment_7_short:0 "Hélicoptère ASW VII"
 naval_helicopter_equipment_7_desc:0 "Un hélicoptère de guerre anti-sous-marine moderne avec de longues périodes d'errance, un système de sonar plongeant avancé installé pour trouver les sous-marins et la capacité de les engager avec des torpilles."
 
 ###UAV###

 uav:0 "Véhicule aérien sans pilote"
 uav_short:0 "Véhicule aérien sans pilote"
 uav_desc:0 "Même si l'utilisation de drones n'est pas nouvelle, cette première génération de véhicules aériens sans pilote, dotés de temps de vol plus longs et de meilleurs capteurs, constitue la première plate-forme de surveillance et d'armement véritablement performante à être déployée à grande échelle. Ouvrir la porte à d'autres choses à venir."

