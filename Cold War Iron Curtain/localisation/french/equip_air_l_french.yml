 #ATGM
 atgm_equipment_0:0 "Missile guidé antichar I"
 atgm_equipment_0_short:0 "ATGM JE"
 atgm_equipment_0_desc:0 "Un des premiers missiles guidés antichar à guidage optique vers la cible."
 atgm_equipment_1:0 "Missile guidé antichar II"
 atgm_equipment_1_short:0 "ATGM II"
 atgm_equipment_1_desc:0 "Un missile guidé antichar amélioré, guidé optiquement vers une cible dotée d'une ogive plus grande."
 atgm_equipment_2:0 "Missile guidé antichar III"
 atgm_equipment_2_short:0 "ATGM III"
 atgm_equipment_2_desc:0 "Un missile guidé antichar doté d'un système de guidage plus avancé qui est guidé optiquement vers la cible équipée d'une ogive plus avancée."
 atgm_equipment_3:0 "Missile guidé antichar IV"
 atgm_equipment_3_short:0 "ATGM IV"
 atgm_equipment_3_desc:0 "Un système de missile antichar électro-optique ou filoguidé amélioré avec une grande ogive."
