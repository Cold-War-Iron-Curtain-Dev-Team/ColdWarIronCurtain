 SPR_heavy_fighter_equipment_1:0 "Fokker G.1 Mercure"
 SPR_heavy_fighter_equipment_1_short:0 "Fokker G.1M"
 SPR_heavy_fighter_equipment_1_desc:0 "Le Fokker G.IM est un avion de combat lourd bimoteur néerlandais propulsé par des moteurs Bristol Mercury VIII, l'intercepteur principal des Néerlandais pendant leur brève lutte des jours de mai."
 SPR_heavy_fighter_equipment_2:0 "Guêpe Fokker G.1"
 SPR_heavy_fighter_equipment_2_short:0 "Fokker G.1W"
 SPR_heavy_fighter_equipment_2_desc:0 "Le Fokker G.IW est un chasseur lourd bimoteur néerlandais de 2 places créé à des fins d'exportation. L'avion est propulsé par des moteurs Pratt & Whitney SB4-G Twin Wasp Junior. Les exportations ne se sont jamais concrétisées lorsque les Pays-Bas ont été envahis."
 SPR_heavy_fighter_equipment_3:0 "Lockheed P-38L Foudre"
 SPR_heavy_fighter_equipment_3_short:0 "Foudre P-38L"
 SPR_heavy_fighter_equipment_3_desc:0 "Un avion à double moteur à pistons conçu en mettant l'accent sur la vitesse et les armements lourds. Pendant la Seconde Guerre mondiale, sa vitesse a été utilisée dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme particulière lui a valu le nom de « der Gabelschwanz-Teufel » ou « le diable à queue fourchue » en Allemagne et de « Ni hikouki, ippairotto » ou « deux avions, un pilote » au Japon. Il est également connu sous le nom de « Foudre »."

 SPR_jet_multirole_equipment_1:0 "Hispano Aviación HA-1112-M1L Buchon"
 SPR_jet_multirole_equipment_1_short:0 "HA-1112-M1L Buchon"
 SPR_jet_multirole_equipment_2:0 "Sabre nord-américain F-86A"
 SPR_jet_multirole_equipment_2_short:0 "Sabre F-86A"
 SPR_jet_multirole_equipment_2_desc:0 "Le F-86 est un chasseur à réaction à ailes en flèche développé et introduit à la fin des années 1940 à partir de recherches capturées par les Allemands. La conception de l'avion le rendait capable d'atteindre des vitesses transsoniques et une grande maniabilité, caractéristiques qui le rendaient capable de gérer son célèbre rival, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, aux côtés de ses variantes canadiennes et australiennes réunies, en ferait l'avion de combat occidental le plus produit de l'histoire de l'aviation."
 SPR_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 SPR_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 SPR_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 SPR_jet_multirole_equipment_4:0 "Sabre nord-américain F-86F-30"
 SPR_jet_multirole_equipment_4_short:0 "Sabre F-86F-30"
 SPR_jet_multirole_equipment_4_desc:0 "D'autres améliorations du sabre F-86F pour le rendre plus efficace au combat contre les nouveaux avions équipés de postcombustion en les armant de points d'emport et de rails pour lancer des missiles AIM-9B Sidewinders."
 SPR_jet_multirole_equipment_5:0 "Chasseur stellaire Lockheed F-104G"
 SPR_jet_multirole_equipment_5_short:0 "Chasseur stellaire F-104G"
 SPR_jet_multirole_equipment_6:0 "McDonnel Douglas F-4C Phantom II"
 SPR_jet_multirole_equipment_6_short:0 "F-4C Fantôme II"
 SPR_jet_multirole_equipment_7:0 "Dassault Mirage F1CE"
 SPR_jet_multirole_equipment_7_short:0 "Mirage F1CE"
 SPR_jet_multirole_equipment_8:0 "Dassault Mirage F1EE"
 SPR_jet_multirole_equipment_8_short:0 "Mirage F1EE"
 SPR_jet_multirole_equipment_9:0 "McDonnell Douglas F/A-18 Hornet"
 SPR_jet_multirole_equipment_9_short:0 "F/A-18 Hornet"
 SPR_jet_multirole_equipment_9_desc:0 "Le McDonnell Douglas F/A-18 Hornet est un avion de combat bimoteur, supersonique, tous temps, capable de porter un porte-avions et multirôle, conçu à la fois comme avion de combat et d'attaque (d'où la désignation F/A). Conçu par McDonnell Douglas (qui fait maintenant partie de Boeing) et Northrop (qui fait maintenant partie de Northrop Grumman), le F/A-18 est dérivé du YF-17 de ce dernier dans les années 1970 pour être utilisé par la Marine et le Corps des Marines des États-Unis. Le Hornet est également utilisé par les forces aériennes de plusieurs autres pays, et autrefois par l'escadron de démonstration en vol de la marine américaine, les Blue Angels. "
 SPR_jet_multirole_equipment_10:0 "McDonnell Douglas EF-18 Hornet"
 SPR_jet_multirole_equipment_10_short:0 "EF-18 frelon"
 SPR_jet_multirole_equipment_10_desc:0 "Les Frelons espagnols fonctionnent comme intercepteurs tous temps 60 % du temps et comme avions d'attaque jour/nuit tous temps pour le reste. En cas de guerre, chacun des escadrons de première ligne jouerait un rôle primordial : 121 est chargé de l'appui aérien tactique et des opérations maritimes ; 151 et 122 sont affectés à des rôles d'interception tous temps et de combat aérien ; et 152 se voit confier la mission SEAD."

 SPR_mr_stealth_fighter_equipment_1:0 "Eurofighter EF-2000 Typhoon"
 SPR_mr_stealth_fighter_equipment_1_short:0 "Typhon EF-2000"

 SPR_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 SPR_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Foudre II"
 SPR_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour le déploiement de porte-avions. Le développement du programme F-35 a commencé en 1992, et la variante C était dans les airs dès 2010 et était opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses frères et soeurs, la variante C présente des ailes plus grandes avec des sections de bout d'aile pliables."
 
 SPR_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 SPR_jump_stealth_equipment_1_short:0 "F-35B Foudre II"
 SPR_jump_stealth_equipment_1_desc:0 "Un chasseur polyvalent produit à l'aide d'une conception JSF (Joint Strike Fighter). Bien qu'il soit capable d'utiliser une variété d'armes dans les combats air-air et sol-sol, le coût d'acquisition de ce chasseur furtif est plus gérable que celui du F-22A. Conformément à son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 
