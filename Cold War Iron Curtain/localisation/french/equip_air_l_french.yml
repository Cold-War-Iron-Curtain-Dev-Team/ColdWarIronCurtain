 AST_jet_multirole_equipment_9:0 "GAF/McDonnell Douglas F-18A Hornet"
 AST_jet_multirole_equipment_9_short:0 "F-18A Hornet"
 AST_jet_multirole_equipment_9_desc:0 "La Royal Australian Air Force (RAAF) exploite des avions de combat McDonnell Douglas F/A-18 Hornet depuis 1984. Le gouvernement australien a acheté 75 variantes A et B du F/A-18 en 1981 pour remplacer les chasseurs Dassault Mirage III de la RAAF. "
 AST_jet_multirole_equipment_10:0 "GAF/McDonnell Douglas F/A-18A Hornet HUG (Programme de mise à niveau du Hornet)"
 AST_jet_multirole_equipment_10_short:0 "F/A-18A Hornet HUG"
 AST_jet_multirole_equipment_10_desc:0 "Le programme de mise à niveau du Hornet (HUG) a débuté en 1999 et s'est déroulé en trois phases principales. Au cours de la phase 1, qui s'est déroulée du milieu de l'année 2000 à 2002, les systèmes informatiques, le système de navigation et la radio des Hornets ont été remplacés. Les avions ont également été équipés pour faire fonctionner le missile air-air ASRAAM ; ces armes ont remplacé l'AIM-9 Sidewinder."

 AST_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 AST_mr_stealth_fighter_equipment_1_short:0 "F-35A Foudre II"
 AST_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnel (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le développement du programme F-35 a commencé en 1992, la variante A prenant son envol fin 2006 et larguant ses premières bombes moins de six ans plus tard. La variante A est la variante la plus petite et la plus légère du F-35 et est principalement destinée à remplacer le F-16 Fighting Falcon."

 AST_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 AST_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Foudre II"
 AST_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour le déploiement de porte-avions. Le développement du programme F-35 a commencé en 1992, et la variante C était dans les airs dès 2010 et était opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses frères et soeurs, la variante C présente des ailes plus grandes avec des sections de bout d'aile pliables."
 
 AST_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 AST_jump_stealth_equipment_1_short:0 "F-35B Foudre II"
 AST_jump_stealth_equipment_1_desc:0 "Un chasseur polyvalent produit à l'aide d'une conception JSF (Joint Strike Fighter). Bien qu'il soit capable d'utiliser une variété d'armes dans les combats air-air et sol-sol, le coût d'acquisition de ce chasseur furtif est plus gérable que celui du F-22A. Conformément à son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 
 AST_CAS_equipment_1:0 "CAC CA-1 Wirraway"
 AST_CAS_equipment_1_short:0 "CA-1 Wirraway"
 AST_CAS_equipment_2:0 "CAC CA-11 Woomera"
 AST_CAS_equipment_2_short:0 "CA-11 Woomera"
 AST_CAS_equipment_3:0 "Curtiss P-40N Kittyhawk Mk VI"
 AST_CAS_equipment_3_short:0 "P-40N Kittyhawk Mk VI"
 AST_CAS_equipment_3_desc:0 "Le P-40 était un avion de combat monomoteur entièrement métallique développé en 1938 et était une version modifiée du P-36 Hawk. Ce type serait utilisé par un nombre important de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il soit inférieur aux derniers P-47 et P-51, il servirait en première ligne jusqu'à la fin de la guerre. 200 pilotes alliés de 7 pays différents, des États-Unis aux pays du Commonwealth britannique en passant par l'Union soviétique, sont devenus des as du P-40. Malgré les désignations différentes pour le service du Commonwealth et le service soviétique, le surnom officiel du service américain est « Warhawk »."
