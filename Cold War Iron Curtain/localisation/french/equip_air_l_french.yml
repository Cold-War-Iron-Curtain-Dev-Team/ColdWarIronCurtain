 BEL_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 BEL_jet_light_equipment_1_short:0 "Étoile filante T-33"
 BEL_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
