 BEL_recon_equipment_0_short:0 "Spitfire FR Mk.. XIVe"
 BEL_recon_equipment_0_desc:0 "Variante de reconnaissance photographique du vénérable Supermarine Spitfire armé de caméras."
 BEL_jet_recon_equipment_0:0 "Piper L-21 Super Cub"
 BEL_jet_recon_equipment_0_short:0 "L-21 Super-Cub"
 BEL_jet_recon_equipment_0_desc:0 "Le Piper L-21 Super Cub est un monoplan biplace monomoteur. Introduit en 1949 par Piper Aircraft, il a été développé à partir du Piper PA-11."
 BEL_jet_recon_equipment_1:0 "Chasseur stellaire SABCA RF-104G"
 BEL_jet_recon_equipment_1_short:0 "Chasseur stellaire RF-104G"
 BEL_jet_recon_equipment_1_desc:0 "Le RF-104G était un modèle de reconnaissance tactique basé sur le F-104G, généralement équipé de trois caméras KS-67A montées à l'avant du fuselage à la place du canon interne. La plupart des 189 exemplaires construits ont ensuite été reconfigurés selon la norme F-104G"
 BEL_jet_recon_equipment_2:0 "SABCA Mirage 5BR"
 BEL_jet_recon_equipment_2_short:0 "Mirage 5BR"
 BEL_jet_recon_equipment_2_desc:0 "Version de reconnaissance photographique du Mirage 5B de la Royal Belgian Air Force, armé de caméras au lieu de munitions d'attaque au sol."
 
