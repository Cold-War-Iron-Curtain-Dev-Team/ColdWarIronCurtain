 WGR_fighter_equipment_0:0 "Luftwaffe"
 WGR_fighter_equipment_0_short:0 "Luftwaffe"
 WGR_fighter_equipment_0_desc:0 "L'armée de l'air allemande est la branche de guerre aérienne de la Bundeswehr, les forces armées allemandes. L'armée de l'air allemande (faisant partie de la Bundeswehr) a été fondée en 1956, à l'époque de la guerre froide, en tant que branche de guerre aérienne des forces armées de l'Allemagne de l'Ouest de l'époque."

