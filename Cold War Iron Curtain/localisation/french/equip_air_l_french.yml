 HOL_utility_helicopter_equipment_1:0 "Sikorsky S-58 Choctaw"
 HOL_utility_helicopter_equipment_1_short:0 "S-58 Choctaw"
 HOL_utility_helicopter_equipment_2:0 "Agusta Bel AB-204"
 HOL_utility_helicopter_equipment_2_short:0 "AB-204"
 HOL_utility_helicopter_equipment_3:0 "Agusta Bel AB-205"
 HOL_utility_helicopter_equipment_3_short:0 "AB-205"
 HOL_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 HOL_utility_helicopter_equipment_4:0 "Westland Lynx UH-14A"
 HOL_utility_helicopter_equipment_4_short:0 "Lynx UH-14A"
 HOL_utility_helicopter_equipment_5:0 "Aérospatiale AS532 Cougar UL"
 HOL_utility_helicopter_equipment_5_short:0 "AS532 Cougar UL"
 HOL_utility_helicopter_equipment_6:0 "Aérospatiale AS532 Cougar U2"
 HOL_utility_helicopter_equipment_6_short:0 "AS532 Cougar U2"
 HOL_utility_helicopter_equipment_7:0 "Aérospatiale AS532 Cougar U2 NLD"
 HOL_utility_helicopter_equipment_7_short:0 "AS532 Cougar U2 NLD"

 HOL_cargo_helicopter_equipment_4:0 "Boeing CH-147C Chinook"
 HOL_cargo_helicopter_equipment_4_short:0 "CH-147C Chinook"
 HOL_cargo_helicopter_equipment_4_desc:0 "Désignation canadienne du CH-47. Les CH-47 modifiés canadiens ont été acceptés dans la RNLAF dans les années 1990, mais auraient pu les recevoir plus tôt."
 HOL_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Bloc II"
 HOL_cargo_helicopter_equipment_5_short:0 "CH-47D Bloc II"
 HOL_cargo_helicopter_equipment_5_desc:0 "CH-47D mis à niveau avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les Chinook plus anciens ont été mis à niveau vers cette norme."
 HOL_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 HOL_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 HOL_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, un CH-47D amélioré, a effectué son vol inaugural ; le premier modèle de production a été déployé le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les mises à niveau comprennent des moteurs Honeywell de 4 868 chevaux (3 630 kW) et la cellule dotée d'une plus grande construction monobloc pour réduire les besoins de maintenance. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion pour augmenter la durée de vie."

