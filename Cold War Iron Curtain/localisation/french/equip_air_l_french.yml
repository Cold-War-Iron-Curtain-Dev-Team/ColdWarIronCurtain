 #Missiles

 USA_slbm_equipment_1:0 "UGM-19 Jupiter S"
 USA_slbm_equipment_1_short:0 "Jupiter S"
 USA_slbm_equipment_1_desc:0 "L'UGM-19 est la variante lancée par un sous-marin du missile PGM-19 utilisé par l'armée américaine. En raison de sa forme courte et trapue, le « Jupiter S » pourrait facilement être installé sur des navires de surface et des sous-marins."
 USA_slbm_equipment_2:0 "UGM-27A Polaris"
 USA_slbm_equipment_2_short:0 "Polaris A"
 USA_slbm_equipment_2_desc:0 "Introduit en 1961, l'UGM-27A remplaçait le missile Jupiter en tant que SLBM. Missile à deux étages à pointe nucléaire, le « Polaris » a été conçu pour être utilisé comme contre-valeur de seconde frappe (puisque le CEP n'était pas assez bon pour contre-force de première frappe) dans le cadre de la contribution de la Marine à l'arsenal d'armes nucléaires des États-Unis, en remplacement du missile de croisière SSM-N-8 Regulus."
 USA_slbm_equipment_3:0 "UGM-27B Polaris"
 USA_slbm_equipment_3_short:0 "Polaris B"
 USA_slbm_equipment_3_desc:0 "Également connue sous le nom de « Polaris A-2 », cette variante améliorée de l'UGB-27 était équipée d'une nouvelle ogive nucléaire, la W-47, qui augmentait le rendement de l'explosion. Cependant, des problèmes d'armement mécanique et de sécurité ont conduit à une durée de vie rapide car il a été rapidement remplacé par l'UGM-27C."
 USA_slbm_equipment_4:0 "UGM-27C Polaris"
 USA_slbm_equipment_4_short:0 "Polaris C"
 USA_slbm_equipment_4_desc:0 "Également connue sous le nom de « Polaris A-3 », cette version a remplacé l'ancien W-47 par le W-58, une ogive nucléaire qui fonctionne comme un véhicule à rentrée multiple, divisée en trois ogives distinctes pouvant délivrer chacune une charge utile de 200 kt, ou pouvant être conservées ensemble pour un rendement théorique de 1 mégatonne. Un durcissement limité a été appliqué pour protéger les systèmes électroniques des missiles des effets des impulsions électromagnétiques nucléaires pendant la phase de propulsion."
 USA_slbm_equipment_5:0 "UGM-73 Poséidon"
 USA_slbm_equipment_5_short:0 "Poséidon"
 USA_slbm_equipment_5_desc:0 "L'UGM-73 est un SLBM à deux étages propulsé par fusée à combustible solide qui a remplacé le précédent Polaris à partir de 1971-72. Équipé d'une ogive W-68 d'une puissance de 10-14 40-50 kt, le « Poséidon » était un missile compatible MIRV avec une charge utile plus élevée et une précision améliorée par rapport à son prédécesseur immédiat, et était l'unité la plus équipée sur les sous-marins nucléaires américains à missiles balistiques tout au long des années 70 et 80."
 USA_slbm_equipment_6:0 "UGM-96 Trident I"
 USA_slbm_equipment_6_short:0 "Trident I"
 USA_slbm_equipment_6_desc:0 "L'UGM-96 a été développé en 1979 pour succéder au Poséidon SLBM. Il s'agit d'un missile propulsé par une fusée à combustible solide à trois étages équipé de huit ogives nucléaires W-76, chacune délivrant une puissance d'environ 100 kt, soit cinq fois supérieure à la bombe Fat Man qui a dévasté Nagasaki. Le « Trident I » est resté en service jusqu'à ce que toutes les unités soient complètement retirées en 2005."
 USA_slbm_equipment_7:0 "UGM-133 TridentII"
 USA_slbm_equipment_7_short:0 "Trident II"
 USA_slbm_equipment_7_desc:0 "L'UGM-133, missile actuellement conçu et utilisé par les sous-marins de la marine américaine, est une arme puissante avec laquelle il faut compter. Avec une autonomie de plus de 7 500 milles (12 000 km) et étant équipé de 8 à 14 exemplaires soit du W-76 utilisé sur son prédécesseur, soit du W-88, plus dévastateur, avec une puissance nucléaire de 425 kt, le « Trident II » restera un formidable moyen de dissuasion pour les États-Unis dans un avenir prévisible."
 
 USA_irbm_equipment_1:0 "PGM-17 Thor"
 USA_irbm_equipment_1_short:0 "Thor"
 USA_irbm_equipment_1_desc:0 "Premier missile balistique opérationnel utilisé par l'US Air Force, le PGM-17 (désignation originale - SM-75) a été développé en 1956 par crainte du développement soviétique de missiles à longue portée. Les ogives typiques avaient une puissance de 1,44 mégatonne, ce qui en faisait une arme très puissante. Bien qu'ils aient été retirés du service en 1963, les « Thor » pouvaient être réactivés à tout moment, pour frapper des cibles comme un éclair."
 USA_irbm_equipment_2:0 "PGM-19 Jupiter A"
 USA_irbm_equipment_2_short:0 "Jupiter A"
 USA_irbm_equipment_2_desc:0 "Le PGM-19 a été le premier missile balistique à moyenne portée à pointe nucléaire utilisé par l'US Air Force. Développé à l'origine pour l'armée et la marine américaines, le missile a conservé une forme trapue pour être utilisé dans les sous-marins, bien que la marine ait finalement choisi de développer le missile Polaris. Le « Jupiter », du nom du roi romain des dieux, serait équipé d'une ogive nucléaire d'une puissance de 1,1 mégatonne."
 USA_irbm_equipment_3:0 "PGM-19 Jupiter C"
 USA_irbm_equipment_3_short:0 "Jupiter C"
 USA_irbm_equipment_3_desc:0 "Introduit en 1958 en tant que mise à niveau du PGM-19A, le « Jupiter-C » a été développé avec un fuselage allongé pour permettre l'utilisation de plusieurs fusées à combustible solide. Bien qu'il ait été utilisé pour tester la rentrée de fusées usagées, il a été reconverti en IRBM."
 USA_irbm_equipment_4_short:0 "Junon Ier"
 USA_irbm_equipment_4_desc:0 "Développé à partir du Jupiter-C, le « Juno » (du nom de la reine romaine des dieux) a pris le modèle Jupiter-C et a incorporé un quatrième étage, qui a été monté au-dessus de la « baignoire » du troisième étage, et a tiré après l'épuisement du troisième étage pour augmenter la charge utile. Ce système a été incorporé pour le lancement de satellites et a été le système de livraison qui a lancé le premier satellite américain, « Explorer 1 », dans l'espace. En tant qu'ICBM, le quatrième étage inclus aurait augmenté la portée d'une charge nucléaire (qui aurait probablement été la même que celle du Jupiter précédent) à environ 2 000 km ou ~ 1 250 mi)"
 USA_irbm_equipment_5:0 "PGM-19E Junon II"
 USA_irbm_equipment_5_short:0 "Junon II"
 USA_irbm_equipment_5_desc:0 "Le Juno II est un développement ultérieur du Juno I, bien que contrairement à son prédécesseur, il s'inspire du modèle Jupiter-A, dont le Juno II utilise les fusées du premier pour son premier étage. Pour ses deuxième, troisième et quatrième étages, il utilise une plateforme de fusée dérivée du système de missile MGM-29 Redstone. Utilisé comme plates-formes de lancement pour les derniers satellites Explorer ainsi que pour Pioneer 4 (le premier satellite américain à s'échapper de l'orbite terrestre et la première sonde lunaire réussie), une version hypothétique d'un missile balistique pourrait avoir une portée allant jusqu'à ~ 2 500 km (~ 1 550 km)"
 USA_irbm_equipment_6:0 "MGM-31C Pershing II"
 USA_irbm_equipment_6_short:0 "Pershing II"
 USA_irbm_equipment_6_desc:0 "Entré en service en 1983, le MGM-31C a été développé comme une mise à niveau des missiles Pershing I et Pershing Ia, ce qui explique sa désignation « Pershing II » (Pershing étant nommé d'après John J. Pershing, l'un des deux hommes ayant le grade de « général des armées » ou général six étoiles). Il était équipé d'une ogive capable de passer d'une puissance de 5 kt à 80 kt."
 USA_irbm_equipment_7:0 "MGM-31D Pershing III"
 USA_irbm_equipment_7_short:0 "Pershing III"
 USA_irbm_equipment_7_desc:0 "Développé dans le prolongement du système Pershing, le « Pershing III » était une version à quatre étages de 25 000 livres (11 000 kg) qui remplacerait le LGM-118 Peacekeeper. En raison des limitations des traités de réduction des armements stratégiques. Il devait être lancé à partir de lanceurs M1003 modifiés, la troisième modification du troisième type de missile « Pershing »."
 USA_irbm_equipment_8:0 "MGM-31E Pershing II Portée réduite"
 USA_irbm_equipment_8_short:0 "Pershing IIRR"
 USA_irbm_equipment_8_desc:0 "Version modifiée du précédent MGM-31C, la variante « E » a été développée dans un souci de portée plus courte afin de se conformer au Traité sur les forces nucléaires à portée intermédiaire (INF). Comparé aux Pershing II et III, le Pershing à autonomie réduite aurait eu une autonomie opérationnelle d'environ 1 200 km (745 mi), inférieure aux 1 770 km (1 100 mi) de l'original."
 
 USA_srbm_equipment_1:0 "Hermès B-1"
 USA_srbm_equipment_1_short:0 "Hermès"
 USA_srbm_equipment_1_desc:0 "Développé en réponse aux attaques de roquettes de l'Allemagne nazie en Europe, l'Hermes a été conçu comme un projet d'essai qui deviendrait finalement l'ancêtre du programme de missiles américain. Nommée d'après le dieu messager grec, la variante B « Hermes » était un missile de croisière propulsé par un statoréacteur Mach 4. Il serait désigné SSM-G-9 et SSM-A-9."
 USA_srbm_equipment_2:0 "Caporal MGM-5"
 USA_srbm_equipment_2_short:0 "Caporal"
 USA_srbm_equipment_2_desc:0 "Le MGM-5 a été le premier missile guidé américain autorisé à transporter une tête nucléaire. Missile balistique tactique, le « Caporal » était un missile balistique à courte portée d'une portée de 75 milles marins (140 km). En plus d'une pointe nucléaire (qui sera introduite plus tard dans sa carrière), il peut également être équipé d'un missile conventionnel hautement explosif (HE)."
 USA_srbm_equipment_3:0 "Pierre rouge PGM-11"
 USA_srbm_equipment_3_short:0 "Pierre rouge"
 USA_srbm_equipment_3_desc:0 "Le premier missile balistique opérationnel utilisé par l'armée américaine, le PGM-11 (à l'origine SSM-G-14 en 1950, SSM-A-14 en 1951 et M8 et M9 en 1955) était un descendant direct de la fusée nazie V-2, développée par des ingénieurs de fusées allemands amenés aux États-Unis à la suite de l'opération Paperclip. Le « Redstone », du nom de l'arsenal éponyme de Huntsville, en Alabama, où il a été développé, était un missile à courte portée qui a servi à la défense active de l'Europe occidentale pendant la guerre froide. C'était également le premier missile à être équipé d'une tête nucléaire."
 USA_srbm_equipment_4:0 "Crosse MGM-18"
 USA_srbm_equipment_4_short:0 "Crosse"
 USA_srbm_equipment_4_desc:0 "Arme balistique tactique à courte portée destinée au soutien rapproché des troupes au sol, le MGM-18 a été introduit en 1959 alors que le missile était encore en phase de développement. Bien qu'il puisse être équipé d'une ogive nucléaire HE ou de 1,5 à 10 kilotonnes, des problèmes de fiabilité et des difficultés avec le système de guidage et sa sensibilité à l'ECM ont conduit au retrait du « Lacrosse » quelques années plus tard."
 USA_srbm_equipment_5:0 "Sergent MGM-29"
 USA_srbm_equipment_5_short:0 "Sergent"
 USA_srbm_equipment_5_desc:0 "Autre produit de Redstone Arsenal, le MGM-29 a été introduit en 1962 en remplacement du MGM-5 Corporal. Surnommé le « Sergent », c'était le dernier missile de ce type nommé d'après les conventions de classement des enrôlés de l'armée américaine. Outre une ogive nucléaire de 200 kilotonnes, le MGM-29 peut également être équipé d'ogives hautement explosives, biologiques et chimiques."
 USA_srbm_equipment_6:0 "MGM-31A Pershing1"
 USA_srbm_equipment_6_short:0 "Pershing 1"
 USA_srbm_equipment_6_desc:0 "Le MGM-31 était le premier de ce qui allait être la série continue de missiles balistiques de longue durée en service par l'armée américaine. Déployé en 1963, le MGM-31A a été développé pour succéder au missile Redstone et a été initialement désigné sous le nom de « Redstone-S » avant de choisir la désignation « Pershing I ». Il était équipé d'une ogive nucléaire de 60 à 400 kilotonnes."
 USA_srbm_equipment_7:0 "Lance MGM-52"
 USA_srbm_equipment_7_short:0 "Lance"
 USA_srbm_equipment_7_desc:0 "Déployé en 1972, le MGM-52 constituait une amélioration par rapport au MGM-29 Sergeant qu'il remplaçait, avec une précision et une mobilité accrues. Sa charge utile était soit l'ogive nucléaire W70 (d'une puissance de 1 à 100 kilotonnes), une ogive hautement explosive à charge creuse pour détruire les bunkers, soit l'ogive M251 avec des sous-munitions explosives pour le rôle de distributeur à distance. Avec des ogives aussi polyvalentes à sa disposition, la « Lance » est sûre de pénétrer les défenses ennemies et d'ouvrir la voie aux troupes pour avancer."
 USA_srbm_equipment_8:0 "MGM-140A ATACMS Bloc I"
 USA_srbm_equipment_8_short:0 "ATACMS Bloc I"
 USA_srbm_equipment_8_desc:0 "Le MGM-140 (à l'origine M39) a été introduit en 1991 en remplacement de l'ancienne Lance MGM-52 dans le rôle conventionnel de SRBM. Capable d'être lancé à partir du système M270 MLRS, le MGM-140A contient une ogive pouvant transporter jusqu'à 950 sous-munitions explosives d'une portée de 80 miles (128 km). Officiellement connu sous le nom d'ATACMS, abréviation de « Army TACtical Missile System »."
 USA_srbm_equipment_9:0 "MGM-164 ATACMS Bloc II"
 USA_srbm_equipment_9_short:0 "ATACMS Bloc II"
 USA_srbm_equipment_9_desc:0 "Initialement désigné M39A3 et plus tard MGM-140C, le MGM-164 est la désignation de la deuxième génération de missiles ATACMS. Développé au cours de la seconde moitié des années 1990 et au début des années 2000, le missile devait être équipé des sous-munitions antichar Brilliant, conférant à l'arme une puissance mortelle contre les chars de la guerre froide utilisés dans l'après-guerre froide."
 
 USA_icbm_equipment_1:0 "LGM-30A Minuteman I"
 USA_icbm_equipment_1_short:0 "Minuteman I"
 USA_icbm_equipment_1_desc:0 "Le LGM-30A (anciennement SM-80) a été introduit en 1962 pour jouer un rôle de dissuasion nucléaire, menaçant les Soviétiques d'une puissante contre-attaque de représailles si les États-Unis étaient attaqués en premier. Cependant, grâce au missile Polaris de la Marine, l'US Air Force a été autorisée à développer davantage le missile, améliorant ainsi la précision. Son surnom « Minuteman » a été donné parce que, tout comme l'infanterie légère titulaire de la guerre d'indépendance américaine, le missile a été conçu pour être lancé à tout moment."
 USA_icbm_equipment_2:0 "LGM-30G Minuteman III"
 USA_icbm_equipment_2_short:0 "Minuteman III"
 USA_icbm_equipment_2_desc:0 "Le LGM-30G était le développement final de la plate-forme Minuteman ICBM. Lors de sa mise en service en 1972, il s'agissait de la première plate-forme de missile à utiliser une ogive MIRV. Son ogive était composée de trois ogives nucléaires W62, chacune d'une puissance de 170 kT, par rapport au W56 de son prédécesseur avec 1,2 MT. Depuis 2019, le « Minuteman III » est le seul ICBM terrestre actuellement en service aux États-Unis."
 USA_icbm_equipment_3:0 "LGM-70B Minuteman IV"
 USA_icbm_equipment_3_short:0 "Minuteman IV"
 USA_icbm_equipment_3_desc:0 "Le LGM-70B était un développement ultérieur des plates-formes Minuteman II. Ces missiles sont modifiés avec des émetteurs radio améliorés, un héritage du système de communication de fusée d'urgence (ERCS) utilisé sur les LEM-70A de désignation similaire. Le missile serait à son tour utilisé comme avant-garde d'une attaque de première frappe ou de représailles, donnant le feu vert aux autres unités du SAC au cours de son déplacement, permettant ainsi de lancer d'autres missiles en succession rapide."
 USA_icbm_equipment_4:0 "LGM-118A Gardien de la paix"
 USA_icbm_equipment_4_short:0 "Gardien de la paix"
 USA_icbm_equipment_4_desc:0 "Introduit en 1986 dans le cadre du projet « Star Wars » du président Reagan, le LGM-118A (également connu sous le nom de missile MX) a été développé pour permettre aux États-Unis de résister à une attaque sournoise de la flotte ICBM soviétique, puis de lancer une contre-attaque. Il s'agissait d'un missile MIRV pouvant transporter 10 ogives nucléaires W87 de 300 kT dans son véhicule de rentrée. Cependant, en raison du traité START II (bien que les États-Unis n'aient jamais ratifié ledit traité) et de la possibilité pour le Minuteman de déployer des ogives uniques pour beaucoup moins cher, le « Peacekeeper » serait retiré du service. Ses composants seraient utilisés par une entreprise privée pour développer un système de lancement civil consommable, le « Minotaur IV »."
 USA_icbm_equipment_5:0 "MGM-134 Nain"
 USA_icbm_equipment_5_short:0 "Nain"
 USA_icbm_equipment_5_desc:0 "Développé en 1991 au crépuscule de la guerre froide, le MGM-134 a été développé pour répondre au besoin d'un petit ICBM pouvant être lancé à partir de véhicules routiers, face à la menace croissante des sous-marins soviétiques qui pourraient lancer des ICBM depuis la côte et priver les États-Unis d'une capacité de frappe de représailles. Equipé d'une ogive nucléaire de 475 kT, le « Midgetman » serait lancé depuis le Hard Mobile Launcher, capable d'être protégé des radiations."

 USA_cruisemissile_equipment_0:0 "JB-2 Huard"
 USA_cruisemissile_equipment_0_short:0 "JB-2 Huard"
 USA_cruisemissile_equipment_0_desc:0 "Le JB-2 était une copie américaine de la bombe volante allemande V-1. Développé en 1944, il était initialement destiné à être utilisé lors de l'opération Downfall, l'invasion alliée du Japon. Mais en raison de l'utilisation d'armes atomiques, le « Loon » n'a jamais été utilisé au combat. Malgré cela, le JB-2 jouerait un rôle important dans le développement des systèmes de missiles tactiques sol-sol."
 USA_cruisemissile_equipment_1:0 "Matador MGM-1"
 USA_cruisemissile_equipment_1_short:0 "Matador MGM-1"
 USA_cruisemissile_equipment_1_desc:0 "Le MGM-1 (à l'origine SSM-A-1 en 1949, le bombardier B-61 sous la désignation de l'US Air Force et le TM-61 en 1955) fut le premier missile de croisière développé aux États-Unis, mis en service en 1952. Bien que similaire dans son concept à son prédécesseur, le JB-2 Loon, et au V-1 allemand, il comprenait une commande radio qui permettait des corrections de trajectoire en vol, permettant ainsi de maintenir la précision pendant des distances plus grandes que les missiles balistiques. Il peut être équipé d'une puissance nucléaire allant de 1 à 120 kilotonnes, mais il existe des variantes d'ogives hautement explosives. Son surnom est « Matador »."
 USA_cruisemissile_equipment_2:0 "SM-62 Snark"
 USA_cruisemissile_equipment_2_short:0 "SM-62 Snark"
 USA_cruisemissile_equipment_2_desc:0 "Missile de croisière à portée intercontinentale, le SM-62 (à l'origine SSM-A-3 et B-62) était un missile à réaction d'une portée de 5 500 milles marins (10 200 km), le missile de croisière à plus longue portée jamais déployé par les États-Unis. Développé comme moyen de dissuasion provisoire pendant le développement des ICBM, le « Snark » (du nom d'un animal fictif dans « La chasse au Snark » de Lewis Carroll) serait retiré une fois que les ICBM seraient correctement déployés."
 USA_cruisemissile_equipment_3:0 "Masse MGM-13"
 USA_cruisemissile_equipment_3_short:0 "Masse MGM-13"
 USA_cruisemissile_equipment_3_desc:0 "Développé en 1956 comme amélioration et successeur du MGM-1, le MGM-13 (à l'origine le TM-76) pouvait atteindre des vitesses transsoniques avec une portée allant de 540 à 1 300 milles selon l'altitude du missile. Un système de correspondance de cartes radar a été intégré à ses systèmes, permettant une correction de cap si le terrain ne correspondait pas au film du terrain à cibler. Surnommé « Mace », le MGM-13 servirait de missile de dissuasion et de croisière jusqu'à ce qu'il soit remplacé respectivement par le MGM-31 Pershing et le BGM-109."
 USA_cruisemissile_equipment_4:0 "Griffon BGM-109G"
 USA_cruisemissile_equipment_4_short:0 "Griffon BGM-109G"
 USA_cruisemissile_equipment_4_desc:0 "Le BGM-109G remplaçait le précédent missile Mace et a été développé à partir du missile Tomahawk lancé par un navire. Introduit en 1983, le BGM-109G a été développé pour contrer le Sabre mobile SS-20 utilisé par l'Union soviétique. Equipé d'une ogive nucléaire W84 à rendement variable (avec des rendements compris entre 0,2 et 150 kt), le missile, aux côtés de la gamme Pershing d'IRBM et de SRBM, a conduit l'Union soviétique à être plus disposée à signer le Traité sur les forces nucléaires à portée intermédiaire (traité INF). Bien qu'il soit également connu sous le nom de missile de croisière lancé au sol (GLCM), sa désignation officielle et son surnom sont BGM-109G « Gryphon »."
 USA_cruisemissile_equipment_5:0 "AGM-129 ACM"
 USA_cruisemissile_equipment_5_short:0 "ACM"
 USA_cruisemissile_equipment_5_desc:0 "Introduit en 1990, l'AGM-129 ACM (abréviation de Advanced Cruise Missile) était un missile de croisière à lancement aérien à faible visibilité transporté exclusivement par les bombardiers stratégiques B-52H Stratofortress de l'US Air Force. Il a été développé par crainte que l'AGM-86 ait des difficultés à pénétrer les futurs systèmes de défense aérienne. Bien que capable de transporter une ogive nucléaire W80 (comme celle utilisée dans son prédécesseur, avec une puissance de 5 à 150 kt), la variante « C » de ce missile possède une ogive hautement explosive conventionnelle."
 USA_cruisemissile_equipment_6:0 "AGM-158 JASSM"
 USA_cruisemissile_equipment_6_short:0 "JASMIN"
 USA_cruisemissile_equipment_6_desc:0 "L'AGM-158 représente le summum de la technologie des missiles de croisière. Reprendre le besoin de l'AGM-129 d'un missile à lancement aérien à faible distance observable. L'AGM-158, introduit en 2009, peut être lancé à partir d'une variété d'avions de combat modernes, allant des chasseurs comme le F-35 et le F-15E aux bombardiers comme le B-52H et le B-1B. Désigné JASSM (Joint Air-to-Surface Standoff Missile), l'AGM-158 se distingue de la plupart des missiles de croisière en ce sens qu'il n'a pas de capacité nucléaire, étant strictement un missile de croisière à ogive conventionnelle."

 USA_coastalmissile_equipment_3:0 "Harpon BGM-84A"
 USA_coastalmissile_equipment_3_short:0 "Harpon BGM-84A"
 USA_coastalmissile_equipment_4:0 "Harpon BGM-84C"
 USA_coastalmissile_equipment_4_short:0 "Harpon BGM-84C"
 USA_coastalmissile_equipment_5:0 "BGM-109B TASM"
 USA_coastalmissile_equipment_5_short:0 "BGM-109B TASM"
 
 #Helicopter

 USA_naval_helicopter_equipment_1:0 "Piasecki HUP-2S Récupérateur"
 USA_naval_helicopter_equipment_1_short:0 "Récupérateur HUP-2S"
 USA_naval_helicopter_equipment_1_desc:0 "Version de guerre anti-sous-marine du HUP-2 équipée d'un sonar immergé. Le Piasecki HUP Retriever/H-25 Army Mule est un hélicoptère utilitaire compact à moteur radial unique et à double rotor tandem superposé développé par Piasecki Helicopter Corporation de Morton, en Pennsylvanie. Conçu selon les spécifications de la marine américaine, l'hélicoptère a été produit de 1949 à 1954 et a également été utilisé par l'armée américaine et les marines étrangères."
 USA_naval_helicopter_equipment_2:0 "Sikorsky HSS-1 Seabat"
 USA_naval_helicopter_equipment_2_short:0 "Bat-marin HSS-1"
 USA_naval_helicopter_equipment_2_desc:0 "Le HSS est la variante anti-sous-marine du S-58 de Sikorsky, une version améliorée du S-55 (et du H-19 Chickasaw militaire). Il avait un nez plus petit, mais avec un fuselage arrière et un train d'atterrissage à traîneau de queue, plutôt que le modèle à queue haute et à 4 montants de son prédécesseur. Plus tard rebaptisé SH-34G, les variantes anti-sous-marins de cet hélicoptère ont reçu le surnom officiel de « Seabat »."
 USA_naval_helicopter_equipment_3:0 "Kaman SH-2D Seasprite"
 USA_naval_helicopter_equipment_3_short:0 "SH-2D Seasprite"
 USA_naval_helicopter_equipment_3_desc:0 "Introduit au début des années 1960 en remplacement du SH-34 Seabat, le SH-2 (initialement désigné HU2K) fut le premier hélicoptère anti-sous-marin capable d'être déployé sur des navires américains en plus des porte-avions. Cette portabilité a prolongé la carrière du « Seasprite » et des variantes améliorées ont existé. La variante représentée dans le jeu est la variante « D », la variante anti-sous-marine initiale."
 USA_naval_helicopter_equipment_4:0 "Sikorsky SH-3A Sea King"
 USA_naval_helicopter_equipment_4_short:0 "SH-3A Sea King"
 USA_naval_helicopter_equipment_4_desc:0 "Développé à partir du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère ASW bimoteur. Il s'agissait du premier hélicoptère amphibie au monde, capable de décoller à la fois depuis la terre et depuis la mer. Il fut également, aux côtés de son contemporain le Seasprite, l'un des premiers hélicoptères ASW à utiliser des turbomoteurs. En plus des fonctions ASW, le SH-3 a également joué des rôles de recherche et de sauvetage (SAR), de transport, d'évacuation sanitaire et d'alerte précoce aéroportée (AEW), un certain nombre d'hélicoptères étant utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pour cette raison qu'il a gagné le surnom de « Sea King », l'hélicoptère le plus polyvalent au monde."
 USA_naval_helicopter_equipment_5:0 "Sikorsky SH-60B Seahawk"
 USA_naval_helicopter_equipment_5_short:0 "SH-60B Seahawk"
 USA_naval_helicopter_equipment_5_desc:0 "Le SH-60 est la variante de l'hélicoptère UH-60 Blackhawk de l'armée américaine. (lui-même une variante militaire du Sikorsky S-70) Bien qu'il ait remplacé le précédent Sea King, le SH-60 n'a pas de capacité d'atterrissage amphibie, mais il conserve la capacité du SH-2 à atterrir sur n'importe quel navire américain capable d'héberger des hélicoptères. Capable de remplir bon nombre des mêmes rôles que le SH-3, le « Sea Hawk » représente l'avenir de l'aviation des hélicoptères de la marine américaine."
 USA_naval_helicopter_equipment_6:0 "Sikorsky SH-60F Seahawk"
 USA_naval_helicopter_equipment_6_short:0 "SH-60F Seahawk"
 USA_naval_helicopter_equipment_6_desc:0 "Le SH-60F servait principalement de principal avion de guerre anti-sous-marine (ASW) du groupement tactique aéronaval. L'hélicoptère chassait les sous-marins avec son sonar plongeant AQS-13F et transportait un lanceur de bouées sonores à 6 tubes. Le SH-60F est officieusement nommé « Oceanhawk ». Le SH-60F peut transporter des torpilles Mk 46, Mk 50 ou Mk 54 pour ses armes offensives, et il dispose d'un choix de mitrailleuses montées sur le fuselage, notamment les M60D, M240D et GAU-16 (calibre.50) pour l'autodéfense."
 USA_naval_helicopter_equipment_7:0 "Sikorsky MH-60R Seahawk"
 USA_naval_helicopter_equipment_7_short:0 "MH-60R Seahawk"
 USA_naval_helicopter_equipment_7_desc:0 "Le MH-60R Seahawk est une version améliorée du SH-60 Seahawk. Développé en 1993, le MH-60R a été conçu pour combiner les fonctionnalités des précédents SH-60B et SH-60F. Ses capteurs comprennent le package ASE, MTS-FLIR, l'interrogateur radar/IFF multimode AN/APS-147, une liaison de données de flotte aéroportée avancée et un sonar actif aéroporté plus avancé. Ceci, associé à un système d'armes amélioré (lui permettant de transporter la torpille avancée Mk 54 et les missiles AGM-114 Hellfire), confère au « Seahawk » une plus grande flexibilité dans les opérations d'assaut anti-navire et amphibie."

 USA_attack_helicopter_equipment_1:0 "Cloche AH-1G Cobra"
 USA_attack_helicopter_equipment_1_short:0 "AH-1G Cobra"
 USA_attack_helicopter_equipment_1_desc:0 "Initialement introduit en 1966 comme hélicoptère d'attaque provisoire, l'AH-1 (développé avec une certaine compatibilité à partir de l'UH-1 Huey Iroquois) a été utilisé dans les mêmes rôles que l'AH-56 était destiné au cours de son cycle de développement. Il était souvent déployé dans des formations de chasseurs-tueurs, du rôle de « tueur » au rôle de « chasseur » assuré par l'OH-6 Cayuse, qui ont tous deux servi avec une grande distinction pendant la guerre du Vietnam. Bien qu'officiellement surnommé « Cobra », d'autres surnoms existent, notamment « HueyCobra » et « Snake »."
 USA_attack_helicopter_equipment_2:0 "Bell AH-1S Cobra"
 USA_attack_helicopter_equipment_2_short:0 "AH-1S Cobra"
 USA_attack_helicopter_equipment_2_desc:0 "L'AH-1S de base est un AH-1Q amélioré avec un turbomoteur T53-L-703 de 1 800 shp (1 300 kW). L'AH-1S est équipé du sous-système de missile M65 TOW/Cobra, de l'unité de visée télescopique (TSU) M65 et du viseur Reflex M73."
 USA_attack_helicopter_equipment_3:0 "Hughes AH-64A Apache"
 USA_attack_helicopter_equipment_3_short:0 "AH-64A Apache"
 USA_attack_helicopter_equipment_3_desc:0 "Introduit en 1986 pour remplacer l'AH-1 dans l'armée américaine, l'AH-64 est l'un des hélicoptères d'attaque les plus connus au monde. Il comprend une suite de capteurs montés sur le nez pour les systèmes d'acquisition de cibles et de vision nocturne. Un équipement de mission typique (et célèbre) est connu pour être son canon à chaîne de 30 mm transporté entre le train d'atterrissage et quatre points d'attache d'aile tronquée pour un mélange de nacelles de fusée Hydra et de missiles antichar AGM-114 Hellfire. Surnommé « Apache », l'AH-64 représente le summum de l'aviation par hélicoptère."
 USA_attack_helicopter_equipment_4:0 "Arc long Apache McDonnell Douglas AH-64D"
 USA_attack_helicopter_equipment_4_short:0 "Arc long Apache AH-64D"
 USA_attack_helicopter_equipment_4_desc:0 "Fierté de l'armée américaine, en plus de sa superbe maniabilité, le radar Longbow fixé au-dessus du rotor principal améliore sa capacité à utiliser des missiles dans toutes sortes de conditions météorologiques. En raison du radar susmentionné, on lui donne le surnom d'« Apache Longbow »."
 USA_attack_helicopter_equipment_5:0 "McDonnell Douglas AH-64E Apache Guardian"
 USA_attack_helicopter_equipment_5_short:0 "Gardien Apache AH-64E"
 USA_attack_helicopter_equipment_5_desc:0 "L'AH-64E est doté d'une connectivité numérique améliorée, du système de distribution d'informations tactiques interarmées, de moteurs T700-GE-701D plus puissants avec une transmission par train frontal améliorée pour accueillir plus de puissance, d'une capacité de contrôle de véhicules aériens sans pilote (UAV), d'une capacité IFR complète et d'un train d'atterrissage amélioré. Les nouvelles pales de rotor composites, testées avec succès en 2004, augmentent la vitesse de croisière, le taux de montée et la capacité de charge utile."
 
 USA_scout_helicopter_equipment_1:0 "Hughes OH-6 Cayuse"
 USA_scout_helicopter_equipment_1_short:0 "OH-6 Cayuse"
 USA_scout_helicopter_equipment_1_desc:0 "Développé en 1960, l'OH-6 a été conçu dans le cadre du projet Light Observation Helicopter (LOH), à des fins d'observation, d'évacuation des blessés, de transport de personnel et d'attaque légère. Le design de Hughes serait celui qui réussirait parmi onze autres designs concurrents. Il remplacerait l'O-1 Bird Dog dans le rôle d'observation lorsque le département américain de la Défense ordonnait à l'armée américaine de transférer tous les avions à voilure fixe à l'US Air Force. Servi avec distinction pendant la guerre du Vietnam, l'OH-6 avait montré la valeur des hélicoptères d'observation comme support aux hélicoptères d'attaque comme l'AH-1 ou aux forces terrestres pour engager les ennemis. Officiellement connu sous le nom de « Cayuse » (d'après la tribu amérindienne du nord-ouest du Pacifique), les pilotes lui ont donné le surnom de « Loach » en hommage au programme qui l'a engendré."
 USA_scout_helicopter_equipment_2:0 "Bell OH-58A Kiowa"
 USA_scout_helicopter_equipment_2_short:0 "OH-58A Kiowa"
 USA_scout_helicopter_equipment_2_desc:0 "Introduit en 1969, au plus fort de la guerre du Vietnam, l'OH-58 était un hélicoptère à 4 places dont la particularité remarquable était que, malgré la présence de 2 pilotes, les commandes du pilote sur le siège gauche pouvaient être retirées pour transporter un passager à l'avant. Pendant la guerre du Vietnam, son armement était un seul minigun M134 ou un lance-grenades M129. Après la guerre, l'OH-58 recevra de nombreuses modifications, avec une mise à niveau du moteur (le mettant au niveau du dernier OH-58C), un système d'imagerie thermique, un ensemble de communications pour les forces de l'ordre, un équipement de navigation amélioré et un équipement de dérapage élevé. Ces variantes améliorées du « Kiowa » (du nom d'une tribu amérindienne originaire du Montana et du Colorado) participeraient aux opérations antidrogue RAID de la Garde nationale militaire."
 USA_scout_helicopter_equipment_3:0 "Bell OH-58D Kiowa"
 USA_scout_helicopter_equipment_3_short:0 "OH-58D Kiowa"
 USA_scout_helicopter_equipment_3_desc:0 "La variante « D » améliorée du Kiowa était le résultat du programme d'amélioration des hélicoptères de l'armée (AHIP). Il était doté de fonctionnalités telles qu'une transmission et un moteur améliorés pour les vols en sieste de terre (niveau extrêmement bas) de l'hélicoptère, ainsi qu'une configuration unique de rotor principal à quatre pales qui lui permettait d'être beaucoup plus silencieux que les autres hélicoptères, plus encore ses prédécesseurs. L'OH-58D a introduit le viseur distinctif monté sur mât (MMS) au-dessus du système de rotor et un cockpit en verre mixte, avec des instruments traditionnels identifiés comme « en veille » pour une utilisation d'urgence."
 USA_scout_helicopter_equipment_4:0 "MD Helicopters AH-6J Petit Oiseau"
 USA_scout_helicopter_equipment_4_short:0 "AH-6J Petit Oiseau"
 USA_scout_helicopter_equipment_4_desc:0 "Le MH-6 Little Bird (surnommé Killer Egg) et sa variante d'attaque, l'AH-6, sont des hélicoptères légers utilisés pour les opérations spéciales de l'armée américaine. Initialement basé sur un OH-6A modifié, il fut ensuite basé sur le MD 500E, avec un seul rotor principal à cinq pales. La version la plus récente, le MH-6M, est basée sur le MD 530F et possède un rotor principal unique à six pales et un rotor de queue à quatre pales."
 USA_scout_helicopter_equipment_5:0 "Eurocopter UH-72 Lakota"
 USA_scout_helicopter_equipment_5_short:0 "UH-72 Lakota"
 USA_scout_helicopter_equipment_5_desc:0 "L'UH-72 est conçu pour assumer une gamme de missions, du soutien général et de l'évacuation médicale (MEDEVAC) à la récupération du personnel et aux opérations de lutte contre les stupéfiants. Il est prévu qu'ils remplacent les UH-1 et OH-58A/C, qui sont des hélicoptères utilitaires légers plus anciens, et supplantent d'autres types à usage domestique, principalement ceux du service de la Garde nationale de l'armée. L'UH-72 est acheté en tant que produit commercial standard (COTS), ce qui simplifie le support logistique de la flotte."

 USA_utility_helicopter_equipment_1:0 "Sikorsky H-34 Choctaw"
 USA_utility_helicopter_equipment_1_short:0 "H-34 Choctaw"
 USA_utility_helicopter_equipment_1_desc:0 "Le Sikorsky H-34 (désignation de la société S-58, désignation de la Marine HUS) est un hélicoptère militaire à moteur à pistons conçu à l'origine comme guerre anti-sous-marine (ASW), mais a ensuite été reconverti en transport moyen. Il deviendrait le dernier hélicoptère à moteur à pistons exploité par le Corps des Marines des États-Unis, car depuis lors, tous les hélicoptères utilisaient des moteurs à turbine. Dans la Marine (sous le nom d'UH-34), il est connu sous le nom de « Seahorse », tandis que les variantes de l'Armée (sous le nom de CH-34) ont pris le nom de « Choctaw »."
 USA_utility_helicopter_equipment_2:0 "Bell UH-1A Iroquois"
 USA_utility_helicopter_equipment_2_short:0 "UH-1A Iroquois"
 USA_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."
 USA_utility_helicopter_equipment_3:0 "Bell UH-1D Iroquois"
 USA_utility_helicopter_equipment_3_short:0 "UH-1D Iroquois"
 USA_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 USA_utility_helicopter_equipment_4:0 "Bell UH-1N Twin Huey"
 USA_utility_helicopter_equipment_4_short:0 "UH-1N Twin Huey"
 USA_utility_helicopter_equipment_4_desc:0 "Introduit pour la première fois en 1970, l'UH-1N était un autre membre de la famille élargie « Huey », cette fois développé à partir de l'UH-1H, bien que contrairement à l'UH-1A et à l'UH-1D, la variante « N » serait celle qui donnerait naissance à sa version civile, le Bell 212. Le rotor principal est propulsé par deux turbomoteurs qui entraînent un seul arbre de sortie. En cas de panne d'un moteur, le moteur restant peut fournir 671 kW (900 shp) pendant 30 minutes ou 571 kW (765 shp), permettant à l'UH-1N de maintenir ses performances de croisière au poids maximum. C'était également l'une des rares variantes « iroquoises » à ne pas être utilisée par l'armée américaine, étant plutôt le porte-drapeau des Marines. Sa configuration bimoteur lui a valu le surnom informel de « Twin Huey »."
 USA_utility_helicopter_equipment_5:0 "Sikorsky UH-60A Faucon Noir"
 USA_utility_helicopter_equipment_5_short:0 "UH-60A Faucon Noir"
 USA_utility_helicopter_equipment_5_desc:0 "Entré en service en 1979, l'UH-60A a succédé à l'UH-1 en tant que plate-forme d'hélicoptère utilitaire de l'armée américaine. Développé à partir du S-70 civil, l'UH-60A pouvait transporter jusqu'à 15 personnes (4 membres d'équipage et jusqu'à 11 soldats équipés). Nommé d'après un chef de tribu amérindienne Sauk, le « Blackhawk » a servi au combat lors de conflits à la Grenade, au Panama, en Irak, en Somalie, dans les Balkans, en Afghanistan et dans d'autres régions du Moyen-Orient."
 USA_utility_helicopter_equipment_6:0 "Sikorsky UH-60L Faucon Noir"
 USA_utility_helicopter_equipment_6_short:0 "UH-60L Faucon Noir"
 USA_utility_helicopter_equipment_6_desc:0 "Une mise à niveau de l'UH-60A, la variante « L » du « Blackhawk » comprend des moteurs améliorés, une boîte de vitesses à durabilité améliorée et un système de commandes de vol mis à jour. Introduit en 1990, l'UH-60L est la principale variante de la variante utilitaire du H-60 actuellement en service dans l'armée américaine, avec des considérations sur le type utilisé pour remplacer l'UH-1N dans l'US Air Force."
 USA_utility_helicopter_equipment_7:0 "Sikorsky UH-60M Faucon Noir"
 USA_utility_helicopter_equipment_7_short:0 "UH-60M Faucon Noir"
 USA_utility_helicopter_equipment_7_desc:0 "Pales de rotor à large corde de conception améliorée, moteurs T700-GE-701D (max 2 000 shp ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur du système de gestion intégré de la santé du véhicule (IVHMS) et nouveau cockpit en verre."

 USA_cargo_helicopter_equipment_1:0 "Boeing CH-47A Chinook"
 USA_cargo_helicopter_equipment_1_short:0 "CH-47A Chinook"
 USA_cargo_helicopter_equipment_1_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à rotor tandem qui compte parmi les hélicoptères de transport les plus lourds de l'Ouest. Remplaçant le CH-37 Mojave, le CH-47 possède plusieurs moyens de chargement de diverses marchandises, notamment plusieurs portes à travers le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. C'était également l'hélicoptère le plus rapide parmi ses contemporains lors de son introduction en 1962, et il est toujours considéré actuellement comme l'un des hélicoptères les plus rapides de l'arsenal de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État de Washington actuel."
 USA_cargo_helicopter_equipment_2:0 "Étalon de mer Sikorsky CH-53A"
 USA_cargo_helicopter_equipment_2_short:0 "Étalon de mer CH-53A"
 USA_cargo_helicopter_equipment_2_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à rotor tandem qui compte parmi les hélicoptères de transport les plus lourds de l'Ouest. Remplaçant le CH-37 Mojave, le CH-47 possède plusieurs moyens de chargement de diverses marchandises, notamment plusieurs portes à travers le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. C'était également l'hélicoptère le plus rapide parmi ses contemporains lors de son introduction en 1962, et il est toujours considéré actuellement comme l'un des hélicoptères les plus rapides de l'arsenal de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État de Washington actuel."
 USA_cargo_helicopter_equipment_3:0 "Boeing CH-47D Chinook"
 USA_cargo_helicopter_equipment_3_short:0 "CH-47D Chinook"
 USA_cargo_helicopter_equipment_3_desc:0 "Le CH-47D partage la même cellule que les modèles précédents, la principale différence étant l'adoption de moteurs plus puissants. Les premiers CH-47D étaient à l'origine propulsés par deux moteurs T55-L-712, le moteur le plus courant étant le dernier T55-GA-714A. Grâce à son système de chargement à triple crochet, le CH-47D peut transporter de lourdes charges utiles à l'intérieur et jusqu'à 26 000 lb (12 000 kg) (comme des conteneurs de 40 pieds ou de 12 mètres) à l'extérieur. Il a été mis en service pour la première fois en 1979. Dans les opérations d'assaut aérien, il sert souvent de moteur principal à l'obusier M198 de 155 mm, accompagnant 30 cartouches et un équipage de 11 hommes."
 USA_cargo_helicopter_equipment_4:0 "Sikorsky CH-53E Super Étalon"
 USA_cargo_helicopter_equipment_4_short:0 "CH-53E Super Étalon"
 USA_cargo_helicopter_equipment_4_desc:0 "En octobre 1967, le Corps des Marines des États-Unis a émis un besoin en matière d'hélicoptère d'une capacité de levage 1,8 fois supérieure à celle du CH-53D, qui pourrait être installé sur des navires de guerre amphibie. L'US Navy et l'US Army recherchaient également à l'époque des hélicoptères similaires. Avant l'émission de l'exigence, Sikorsky travaillait sur une amélioration du CH-53D, sous la désignation d'entreprise « S-80 », comprenant un troisième turbomoteur et un système de rotor plus puissant. Sikorsky a proposé la conception du S-80 aux Marines en 1968. Les Marines ont apprécié l'idée, car elle promettait de fournir rapidement une bonne solution et ont financé le développement d'un hélicoptère de banc d'essai pour évaluation. Le contrat de production initial a été attribué en 1978 et le lancement du service a suivi en février 1981."
 USA_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Bloc II"
 USA_cargo_helicopter_equipment_5_short:0 "CH-47D Bloc II"
 USA_cargo_helicopter_equipment_5_desc:0 "CH-47D mis à niveau avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les Chinook plus anciens ont été mis à niveau vers cette norme."
 USA_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 USA_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 USA_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, un CH-47D amélioré, a effectué son vol inaugural ; le premier modèle de production a été déployé le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les mises à niveau comprennent des moteurs Honeywell de 4 868 chevaux (3 630 kW) et la cellule dotée d'une plus grande construction monobloc pour réduire les besoins de maintenance. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion pour augmenter la durée de vie."

 ########### SOV
 SOV_fighter_equipment_0:0 "Voyenno-Vozdushnyye Sily"
 SOV_fighter_equipment_0_short:0 "VVS"
 SOV_fighter_equipment_0_desc:0 "Les forces aériennes soviétiques étaient l'une des forces aériennes de l'Union soviétique. L'autre était les Forces de défense aérienne soviétiques. Les forces aériennes ont été formées à partir de composants du service aérien impérial russe en 1917 et ont fait face à leur plus grande épreuve pendant la Seconde Guerre mondiale. Les groupes ont également été impliqués dans la guerre de Corée et se sont dissous avec l'Union soviétique elle-même en 1991-1992. Les moyens des anciennes forces aériennes soviétiques ont ensuite été divisés en plusieurs forces aériennes des anciennes républiques soviétiques, dont la nouvelle force aérienne russe. \"La Marche des Pilotes\" était sa chanson. "

 SOV_fighter_equipment_1:0 "Yakolev Yak-3"
 SOV_fighter_equipment_1_short:0 "Yak-3"
 SOV_fighter_equipment_1_desc:0 "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur et monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié tant des pilotes que du personnel au sol. L'un des chasseurs de combat les plus petits et les plus légers déployés par tous les combattants pendant la guerre, son rapport puissance/poids élevé lui a conféré d'excellentes performances et il s'est avéré être un formidable chasseur de chiens."
 SOV_fighter_equipment_2:0 "Lavotchkine La-7"
 SOV_fighter_equipment_2_short:0 "La-7"
 SOV_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de combat soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau de conception de Lavochkin. Il s'agissait d'un développement et d'un perfectionnement du Lavochkin La-5, et du dernier d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 SOV_fighter_equipment_3:0 "Lavotchkine La-9"
 SOV_fighter_equipment_3_short:0 "La-9"
 SOV_fighter_equipment_3_desc:0 "La-9 représente un développement ultérieur du prototype Lavochkin La-126. Le premier prototype, désigné La-130, fut achevé en 1946. La similitude avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur avait une construction entièrement métallique et une aile à flux laminaire. Les économies de poids dues à l'élimination du bois de la cellule ont permis d'améliorer considérablement la capacité de carburant et l'armement à quatre canons. Des combats simulés ont démontré que le La-130 était à égalité avec le La-7 mais qu'il était inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, entra en production en août 1946. Au total, 1 559 avions furent construits à la fin de la production en 1948."

 SOV_jet_multirole_equipment_1:0 "Mikoyan-Gourevitch MiG-9"
 SOV_jet_multirole_equipment_1_desc:0 "Le MiG-9 Fargo a été le premier avion à réaction conçu par Mikoyan après la Seconde Guerre mondiale. Introduit en 1948. Il a été utilisé de manière limitée au combat et à l'entraînement pendant la guerre civile chinoise et la guerre de Corée. Au total, 610 avions furent produits, uniquement par l'URSS. Les derniers MiG 9 furent mis hors service par la RPC en 1951."
 SOV_jet_multirole_equipment_1_short:0 "MiG-9"
 SOV_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 SOV_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 SOV_jet_multirole_equipment_2_short:0 "MiG-15"
 SOV_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 SOV_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 SOV_jet_multirole_equipment_3_short:0 "MiG-17"
 SOV_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 SOV_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 SOV_jet_multirole_equipment_4_short:0 "MiG-19"
 SOV_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 SOV_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 SOV_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 SOV_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 SOV_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 SOV_jet_multirole_equipment_6_short:0 "MiG-21PF"
 SOV_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23M"
 SOV_jet_multirole_equipment_7_desc:0 "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
 SOV_jet_multirole_equipment_7_short:0 "MiG-23M"
 SOV_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23ML"
 SOV_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
 SOV_jet_multirole_equipment_8_short:0 "MiG-23ML"
 SOV_jet_multirole_equipment_9:0 "Mikoyan-Gourevitch MiG-23MLD"
 SOV_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
 SOV_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 SOV_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29A"
 SOV_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
 SOV_jet_multirole_equipment_10_short:0 "MiG-29A"

 SOV_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 SOV_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 SOV_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une révision du MiG-29 de base. Il a acquis une capacité multirôle plus robuste grâce à une utilisation améliorée d'armes air-air et air-sol de haute précision. Il présentait également une portée de combat considérablement accrue, grâce à une augmentation de sa capacité de carburant interne. Quelques changements ont eu lieu au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger aluminium-lithium pour augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été révisée, les persiennes d'admission supérieures ont été supprimées pour laisser la place à plus de carburant dans les LERX, des tamis à mailles ont été introduits pour éviter les dommages causés par des corps étrangers (FOD) et les dimensions d'entrée ont été agrandies pour un débit d'air plus élevé."
 
 SOV_jet_light_equipment_1:0 "Mikoyan-Gourevitch MiG-9UTI"
 SOV_jet_light_equipment_1_short:0 "MiG-9UTI"
 SOV_jet_light_equipment_1_desc:0 "Pour assurer la préparation du personnel navigant de l'unité de combat des chasseurs à réaction de l'Armée de l'Air, l'équipe OKB-155, dirigée par A.I. Mikoyan, s'est vu confier le développement d'une modification biplace de l'avion MiG-9. Les travaux sur une nouvelle modification du MiG-9 en OKB-155 ont commencé en juillet 1946. La conception préliminaire du « jumeau » était prête fin octobre et conformément au calendrier de conception et de construction de l'avion, approuvé par Mikoyan le 26 août, le premier prototype a été déployé sur l'aérodrome. Prévu pour le 20 décembre 1946."
 SOV_jet_light_equipment_2:0 "Mikoyan-Gourevitch MiG-15UTI"
 SOV_jet_light_equipment_2_short:0 "MiG-15UTI"
 SOV_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 SOV_jet_light_equipment_3:0 "L-29 Delfin"
 SOV_jet_light_equipment_3_short:0 "L-29 Delfin"
 SOV_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 SOV_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 SOV_jet_light_equipment_4_short:0 "L-39 Albatros"
 SOV_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
 SOV_jet_light_equipment_5:0 "Aéro L-39ZA Albatros"
 SOV_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 SOV_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et les attaques légères, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un canon à double canon GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un chargeur de 150 cartouches dans la cellule."

 SOV_recon_equipment_0:0 "Tupolev Tu-2R"
 SOV_recon_equipment_0_short:0 "Tu-2R"
 SOV_recon_equipment_0_desc:0 "Version de reconnaissance du Tu-2."
 SOV_jet_recon_equipment_0:0 "Mikoyan-Gourevitch MiG-15Rbis"
 SOV_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 SOV_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé le développement d'une variante de reconnaissance de première ligne du MiG-15 avec une caméra AFA-BA/40, qui fournit une largeur de levé en bande de 0,9 à 4,5 km avec une longueur de route de photographie de 90 à 450 km à des altitudes de 2 000 à 10 000 m. Un seul canon NR-23 a été installé sur l'avion. Pour augmenter la portée du scout, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur \"Barium-M\" et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur la machine."
 SOV_jet_recon_equipment_1:0 "Mikoyan-Gourevitch MiG-25RB"
 SOV_jet_recon_equipment_1_short:0 "MiG-25RB"
 SOV_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les tests ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. Le matériel photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station d'interférence radio active SPS-141"
 SOV_jet_recon_equipment_2:0 "Sukhoï Su-24MR"
 SOV_jet_recon_equipment_2_short:0 "Su-24MR"
 SOV_jet_recon_equipment_2_desc:0 "Variante de reconnaissance tactique dédiée. Le Su-24MR conserve une grande partie de la suite de navigation du Su-24M, y compris le radar de suivi de terrain, mais supprime le radar d'attaque Orion-A, le système laser/TV et le canon au profit de deux installations de caméras panoramiques, la caméra TV « Aist-M » (« Cigogne »), le radar aéroporté latéral (SLAR) RDS-BO « Shtik » (« Baïonnette ») et l'infrarouge « Zima » (« Hiver »). Système de reconnaissance. D'autres capteurs sont transportés sous forme de pod."
 
 SOV_heavy_fighter_equipment_1:0 "Yakovlev Yak-9"
 SOV_heavy_fighter_equipment_1_short:0 "Yak-9"
 SOV_heavy_fighter_equipment_1_desc:0 "Le Yak-9 avait un fuselage arrière réduit avec une verrière de vision panoramique. Sa structure métallique plus légère permettait une charge de carburant et un armement accrus par rapport aux modèles précédents construits en bois. Le Yak-9 était maniable à grande vitesse à basse et moyenne altitude et facile à contrôler, ce qui en faisait l'un des chasseurs soviétiques les plus produits de la Seconde Guerre mondiale."
 SOV_heavy_fighter_equipment_2:0 "Petliakov Pe-3"
 SOV_heavy_fighter_equipment_2_short:0 "Pe-3"
 SOV_heavy_fighter_equipment_2_desc:0 "Développement ultérieur du Pe-2, le Pe-3 était un avion de combat de nuit dédié lors de son introduction en 1941, la même année que son homologue, le Pe-2. Sa conception et son utilisation ont suivi un chemin comparable à ceux empruntés par la Luftwaffe allemande avec le Junkers Ju 88 et la Royal Air Force britannique avec le De Havilland Mosquito. Utilisé avec distinction pendant la bataille de Moscou, et bien que la seule usine responsable de la construction de ce type ait été évacuée à la suite de la bataille, le Pe-3 a été utilisé tout au long du conflit, les séries de production ultérieures étant consacrées à la construction de variantes de reconnaissance de ce type."
 SOV_heavy_fighter_equipment_3:0 "Lavotchkine La-11"
 SOV_heavy_fighter_equipment_3_short:0 "La-11"
 SOV_heavy_fighter_equipment_3_desc:0 "Développé en 1947, après la fin de la Seconde Guerre mondiale, le La-11 était une évolution du La-9 « Fritz » pour créer un chasseur d'escorte à longue portée. L'avion était équipé de pneus plus gros pour s'adapter à l'augmentation du poids et aux commodités pour les longs vols, comme un rembourrage accru du siège, des accoudoirs et un urinoir. De plus, une suite complète de radionavigation a été installée. Sans surprise, les performances de combat avec une pleine charge de carburant en ont souffert. Cependant, à mesure que la charge de carburant se rapprochait de celle du La-9, les performances augmentaient également. Les pilotes de La-11 en service soviétique et plus tard chinois serviraient dans la défense aérienne, abattant des Mustangs et des avions d'attaque de construction américaine pendant la guerre de Corée. Son nom de rapport à l'OTAN est Fang."

 SOV_jet_interceptor_equipment_1:0 "Yakovlev Yak-17"
 SOV_jet_interceptor_equipment_1_desc:0 "Le Yak-17 a été exposé publiquement pour la première fois lors de la Journée de l'aviation soviétique de 1949, à l'aérodrome de Touchino. En fonctionnement, le Yak-17 présentait la plupart des mêmes défauts que son prédécesseur, notamment une vitesse et une autonomie relativement faibles, et un moteur peu fiable (toujours basé sur le Junkers Jumo 004 allemand) avec une procédure de démarrage compliquée. D'un autre côté, sa manipulation était très simple et similaire à celle des chasseurs à hélices populaires tels que le Yak-3 et le Yak-9. Cela en faisait une excellente machine de transition vers les chasseurs à réaction."
 SOV_jet_interceptor_equipment_1_short:0 "Yak-17"
 SOV_jet_interceptor_equipment_2:0 "Lavotchkine La-15"
 SOV_jet_interceptor_equipment_2_desc:0 "Le Lavochkin La-15 Fantail a été introduit dans l'armée de l'air soviétique en 1949. Bien que technologiquement l'avion soit supérieur au MiG-15, le coût de fabrication inférieur du MiG-15 signifiait qu'il était favorisé. L'avion n'a jamais participé à des combats et n'a eu qu'un déploiement limité. Les 235 avions fabriqués ont été mis hors service en 1953. Ils ont été démontés de leurs moteurs et utilisés pour des essais d'armes nucléaires."
 SOV_jet_interceptor_equipment_2_short:0 "La-15"
 SOV_jet_interceptor_equipment_3:0 "Mikoyan-Gourevitch MiG-17PF"
 SOV_jet_interceptor_equipment_3_desc:0 "Version chasseur-intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"
 SOV_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 SOV_jet_interceptor_equipment_4:0 "Soukhoï Su-9"
 SOV_jet_interceptor_equipment_4_desc:0 "Le Sukhoi Su-9 Fishpot était un intercepteur soviétique tout temps à ailes delta développé dans les années 1950. Le Su-9 a effectué son premier vol complet le 24 juin 1956 et est entré en service trois ans plus tard, en 1959. L'avion était exclusivement exploité par le 894e régiment d'aviation de chasse de l'armée de l'air soviétique et n'a jamais participé à des combats actifs. Le dernier des 1 150 avions fabriqués a quitté le service en 1979"
 SOV_jet_interceptor_equipment_4_short:0 "Su-9"
 SOV_jet_interceptor_equipment_5:0 "Soukhoï Su-11"
 SOV_jet_interceptor_equipment_5_desc:0 "Le Su-11 était une version améliorée de l'intercepteur Sukhoi Su-9 (« Fishpot »), qui avait été développé en parallèle avec le chasseur-bombardier Su-7 à ailes en flèche de l'OKB. Conscient des limites fondamentales du Su-9, Sukhoi commença à travailler sur le Su-11."
 SOV_jet_interceptor_equipment_5_short:0 "Su-11"
 SOV_jet_interceptor_equipment_6:0 "Soukhoï Su-15"
 SOV_jet_interceptor_equipment_6_desc:0 "Le Sukhoi Su-15 Flagon A était un intercepteur biréacteur développé par l'Union soviétique dans les années 1960. L'avion a effectué son premier vol au milieu de l'année 1962 et, trois ans plus tard, il est entré en service dans l'armée de l'air soviétique en 1965. De 1965 à 1979, 1 290 avions ont été produits. L'avion a également servi dans l'armée de l'air ukrainienne et a servi dans un service d'urgence limité dans l'armée de l'air russe. Il a été officiellement retiré du service en 1996."
 SOV_jet_interceptor_equipment_6_short:0 "Su-15"
 SOV_jet_interceptor_equipment_7:0 "Mikoyan-Gourevitch MiG-25P"
 SOV_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de 1964 et est officiellement entré en service en 1970. Tout au long de sa vie, plus de 1 150 avions ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. L'avion a été conçu pour intercepter rapidement des avions à très haute altitude comme le U-2 et le B-58 à une vitesse fulgurante. L'avion a donné à l'Union soviétique un contrôle bien supérieur sur son propre espace aérien éloigné que jamais auparavant. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."
 SOV_jet_interceptor_equipment_7_short:0 "MiG-25P"
 SOV_jet_interceptor_equipment_8:0 "Mikoyan-Gourevitch MiG-31"
 SOV_jet_interceptor_equipment_8_desc:0 "Le MiG-31 Foxhound est le successeur direct du MiG-25 et a été conçu comme un remplacement complet. L'avion partage la plupart des éléments de conception avec le MiG-25, présentant principalement des modifications internes. Le MiG-31 dispose de 2 sièges et de capteurs et moteurs supérieurs, le cockpit a également été modernisé pour prendre en charge un affichage tête haute et des systèmes de missiles air-air plus récents. De 1975 à 1994, 519 MiG-31 ont été produits. Il reste en service dans l'armée de l'air russe et l'armée de l'air du Kazakhstan. C'est l'un des avions de combat les plus rapides en service aujourd'hui."
 SOV_jet_interceptor_equipment_8_short:0 "MiG-31"
 SOV_jet_interceptor_equipment_9:0 "Sukhoï Su-27S"
 SOV_jet_interceptor_equipment_9_desc:0 "Le Su-27S Flanker B est la variante de production initiale du chasseur Sukhoi Su-27 de conception soviétique. L'avion était destiné à être le concurrent direct du F-14 Tomcat et du F-15 Eagle. Après avoir effectué son vol inaugural en 1977, il est entré en service plus tard en 1985. Son rôle principal était la défense aérienne à longue portée contre les bombardiers américains B-1 et B-52, ainsi que l'escorte à longue portée des bombardiers stratégiques intercontinentaux soviétiques. Jusqu'à présent, 809 avions ont été produits, qui sont toujours en service dans l'armée de l'air russe. Les autres opérateurs incluent : Indonésie, Ukraine, Vietnam et Chine (désigné J-11), entre autres. L'avion restera en service dans un avenir prévisible."
 SOV_jet_interceptor_equipment_9_short:0 "Su-27S"

 #SOV_stealth_fighter_equipment_1:0 "Sukhoi Su-57"
 #SOV_stealth_fighter_equipment_1_desc:0 "The Su-57 was created based on the plans for the PAK-FA (The acronym meaning Perspektivny Aviatsionny Kompleks Frontovoy Aviatsii, Russian for "Prospective Airborne Complex of Frontline Aviation"). It has very high stealth capabilities, and represents the culmination of Russian Air Force technology. Featuring prominent maneuverability due to a thrust vectoring nozzle and excellent stealth against radar, it boasts top class aerial combat capabilities."
 #SOV_stealth_fighter_equipment_1_short:0 "Su-57"
 SOV_stealth_fighter_equipment_1:0 "Mikoyan-Gourevitch MiG 1.44"
 SOV_stealth_fighter_equipment_1_desc:0 "Le projet Mikoyan 1.44/1.42(N 1) était un démonstrateur technologique de chasseur multirôle développé par le bureau d'études Mikoyan. Il a été conçu pour le projet MFI (Mnogofunksionalni Frontovoy Istrebitel, \"MultiFunctional Frontline Fighter\") de l'Union soviétique pour le programme I-90 (\"Combattant des années 1990\"), la réponse à l'Advanced Tactical Fighter (ATF) des États-Unis. Le MFI devait intégrer de nombreuses caractéristiques des chasseurs à réaction de cinquième génération telles que la supermanoeuvrabilité, la super-croisière et l'avionique avancée, ainsi qu'un certain degré de réduction de la signature radar."
 SOV_stealth_fighter_equipment_1_short:0 "MiG 1.44"

 SOV_high_mach_jet_interceptor_equipment_1:0 "Yakolev Yak-25"
 SOV_high_mach_jet_interceptor_equipment_1_short:0 "Yak-25"
 SOV_high_mach_jet_interceptor_equipment_1_desc:0 ""
 SOV_high_mach_jet_interceptor_equipment_2:0 "Yakolev Yak-28P"
 SOV_high_mach_jet_interceptor_equipment_2_short:0 "Yak-28P"
 SOV_high_mach_jet_interceptor_equipment_2_desc:0 "En 1960, sur la base des Yak-27K et Yak-28, un nouvel intercepteur supersonique biplace Yak-28P a été créé. Il était destiné à combattre des cibles aériennes à basse et moyenne altitude dans une large gamme de vitesses, de jour comme de nuit, par tous les temps. L'avion était équipé du complexe d'armement K-8M-1, composé de deux missiles R-8M-1 avec imagerie thermique et radars semi-actifs et d'une station radar Orel-D. Aucune arme n'a été installée."
 SOV_high_mach_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich E-152A"
 SOV_high_mach_jet_interceptor_equipment_3_short:0 "E-152A"
 SOV_high_mach_jet_interceptor_equipment_3_desc:0 "L'intercepteur tous temps E-152A a été construit à la fin des années 1950. Il disposait d'une centrale électrique composée de 2 moteurs de série R11F-300 d'une poussée maximale de 3 880 kg chacun et d'une postcombustion de 5 740 kg. L'armement consistait en un système d'interception \"Uragan-5\", composé du radar \"TsP-1\" et du missile K-9. Sur l'avion E-152A, le calculateur SRP et le pilote automatique étaient couplés au radar TsP."
 SOV_high_mach_jet_interceptor_equipment_4:0 "Mikoyan-Gourevitch E-152M"
 SOV_high_mach_jet_interceptor_equipment_4_short:0 "E-152M"
 SOV_high_mach_jet_interceptor_equipment_4_desc:0 "La clôture du programme d'essais du missile K-9 a entraîné l'arrêt du vol sur l'E-152-2. Il a été décidé de convertir l'avion en une nouvelle version de l'E-152M en 1961. L'avion a été conçu pour l'installation d'un seul moteur R15B-300 avec une poussée sans postcombustion de 6 480 kg et une postcombustion de 10 210 kg."
 #SOV_high_mach_jet_interceptor_equipment_4:0 "Tupolev Tu-148" #By years and technology should be tier 5 - Tu-128 must be in the same year what Tu-28
 #SOV_high_mach_jet_interceptor_equipment_4_short:0 "Tu-148"
 #SOV_high_mach_jet_interceptor_equipment_4_desc:0 ""
 
 SOV_CAS_equipment_1:0 "Kochyerigin LBSh Sturmovik"
 SOV_CAS_equipment_1_short:0 "LBSh Sturmovik"
 SOV_CAS_equipment_1_desc:0 "Le Kochyerigin LBSh était un monoplan à ailes basses de construction mixte en bois et en métal développé en 1939 par Sergueï Alexandrovitch Kochyerigin. Malgré son manque de puissance, cet avion CAS affichait une puissance de feu impressionnante pour l'époque, avec 2 canons de 20 mm montés sur les ailes, 2 HMG de 7,62 mm montés sur les ailes et une charge de bombe de 600 kg (1 300 lb), avec un HMG de 7,62 mm orienté vers l'arrière pour la défense. Bien qu'initialement accepté par l'armée de l'air soviétique pour être mis en production, cette décision fut bientôt annulée et la production se tourna vers les chasseurs I-28 et Yak-1. Ce fut le premier avion CAS soviétique à recevoir le nom de Sturmovik, ce qui signifie chasseur d'attaque au sol."
 SOV_CAS_equipment_2:0 "Iliouchine Il-2 Sturmovik"
 SOV_CAS_equipment_2_short:0 "Il-2 Sturmovik"
 SOV_CAS_equipment_2_desc:0 "Illyusha, Bossu, le Flying Tank, le Flying Infantryman, tels sont quelques-uns des nombreux surnoms donnés à l'Il-2, en fait le visage de l'armée de l'air soviétique de la Seconde Guerre mondiale. Introduit en 1941, l'Il-2 était un avion d'attaque au sol qui, combiné avec son successeur, l'Il-10, était l'avion de combat le plus produit de l'histoire de l'aviation, l'Il-2 ayant produit à lui seul 36 183 unités. L'avion Il-2 a joué un rôle crucial sur le front de l'Est. Bien qu'il soit imprécis dans ses bombardements et ses attaques à la roquette, sa durabilité globale le rendait extrêmement efficace pour dévier tous les canons antiaériens de gros calibre, sauf les gros canons antiaériens, ce qui lui a valu son nom de Flying Tank. Connu sous le nom de Sturmovik, ce qui signifie avion d'attaque au sol, son nom ultérieur pour l'OTAN est Bark."
 SOV_CAS_equipment_3:0 "Iliouchine Il-10"
 SOV_CAS_equipment_3_short:0 "Il-10"
 SOV_CAS_equipment_3_desc:0 "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à de nombreux défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 participa à certaines des dernières opérations de combat en Europe, ainsi qu'à la brève intervention soviétique dans la guerre du Pacifique. Au moment où l'Il-10 a pris sa retraite du service soviétique en 1956, l'armée de l'air a délaissé les avions purement CAS et d'attaque au sol pour se tourner vers les chasseurs-bombardiers. Son nom de rapport à l'OTAN est Beast."
 SOV_CAS_equipment_4:0 "Iliouchine Il-16"
 SOV_CAS_equipment_4_short:0 "Il-16"
 SOV_CAS_equipment_4_desc:0 "L'Ilyushin Il-16 est le dernier développement de l'avion d'attaque au sol Sturmovik. Il s'agissait essentiellement d'une version réduite de l'Ilyushin Il-10, mais elle était équipée d'un moteur Mikulin AM-43NV nouvellement développé dans l'espoir qu'il serait plus rapide et plus maniable que son prédécesseur. Trois avions ont été construits à des fins d'essais, mais en raison de problèmes moteur imprévus qui n'ont pas pu être résolus, le projet a été annulé."
 
 SOV_jet_CAS_equipment_1:0 "Iliouchine IL-10M"
 #SOV_jet_CAS_equipment_1_desc:0 "The Yakovlev Yak-23 Flora was a Soviet designed ground attack aircraft introduced in 1949. The aircraft was a development of the Yak-15 jet fighter. The Yak-23 was primarily exported to Warsaw pact nations, where it remained in service until the late 1950's."
 SOV_jet_CAS_equipment_1_short:0 "IL-10M"
 SOV_jet_CAS_equipment_2:0 "Mikoyan-Gourevitch MiG-17bis"
 SOV_jet_CAS_equipment_2_desc:0 "Conversion de chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 SOV_jet_CAS_equipment_2_short:0 "MiG-17bis"
 SOV_jet_CAS_equipment_3:0 "Mikoyan-Gourevitch MiG-19S"
 SOV_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue en dalle entièrement mobile. Equipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il y avait des dispositions pour un pack de fusées non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957 modifié pour permettre le transport de quatre nacelles de fusée."
 SOV_jet_CAS_equipment_3_short:0 "MiG-19S"
 SOV_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 SOV_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 SOV_jet_CAS_equipment_4_short:0 "Su-7B"
 SOV_jet_CAS_equipment_5:0 "Sukhoï Su-7BKL"
 SOV_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 SOV_jet_CAS_equipment_5_short:0 "Su-7BKL"
 SOV_jet_CAS_equipment_6:0 "Soukhoï Su-17M"
 SOV_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 SOV_jet_CAS_equipment_6_short:0 "Su-17M"
 SOV_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-27M"
 SOV_jet_CAS_equipment_7_desc:0 "Le MiG-27 Flogger est un avion d'attaque au sol soviétique à ailes en flèche variable. L'avion est basé sur le MiG-23 mais optimisé pour l'attaque au sol. Contrairement au MiG-23, le MiG-27 n'a pas été largement utilisé en dehors de l'URSS. De 1970 à 1986, 1 075 avions ont été produits. Le MiG-27 a été utilisé au cours des dernières étapes des guerres soviéto-afghanes et de Kargil. L'avion reste en service limité avec l'Inde et le Kazakhstan."
 SOV_jet_CAS_equipment_7_short:0 "MiG-27M"
 SOV_jet_CAS_equipment_8:0 "Soukhoï Su-25"
 SOV_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. L'avion a effectué son vol inaugural en 1975 et a été introduit en 1981. Depuis 1978, plus de 1 000 avions ont été produits. C'était un avion particulièrement populaire à l'étranger, vendu dans 29 pays. Pour cette raison, le Su-25 a été impliqué dans plusieurs conflits, notamment la guerre soviétique en Afghanistan, l'Iran-Irak et la guerre du Golfe. L'avion reste aujourd'hui en service dans tous les pays d'exportation."
 SOV_jet_CAS_equipment_8_short:0 "Su-25"

 #SOV_cas_stealth_equipment_1:0 "Sukhoi Su-25SM"
 #SOV_cas_stealth_equipment_1_short:0 "Su-25SM"
 #SOV_cas_stealth_equipment_1_desc:0 "The Su-25SM (Stroyevoy Modernizirovannyi) is an "affordable" upgrade programme for the Su-25, conceived by the Russian Air Force in 2000. The programme stems from the attempted Su-25T and Su-25TM upgrades, which were evaluated and labeled as over-sophisticated and expensive. The SM upgrade incorporates avionics enhancements and airframe refurbishment to extend the Frogfoot's service life by up to 500 flight hours or 5 years. The Su-25SM's all-new PRnK-25SM "Bars" navigation/attack suite is built around the BTsVM-90 digital computer system, originally planned for the Su-25TM upgrade programme. Navigation and attack precision provided by the new suite is three times better of the baseline Su-25 and is reported to be within 15m using satellite correction and 200m without it."
 SOV_cas_stealth_equipment_1:0 "Soukhoï Su-39"
 SOV_cas_stealth_equipment_1_short:0 "Su-39"
 SOV_cas_stealth_equipment_1_desc:0 "Un Su-25T de deuxième génération, le Su-25TM (également désigné Su-39), a été développé avec des systèmes de navigation et d'attaque améliorés et une meilleure capacité de survie. Tout en conservant le Shkval intégré du Su-25T, il peut transporter un radar Kopyo (rus. \"Spear\") dans le conteneur sous le fuselage, qui est utilisé pour engager des cibles aériennes (avec des missiles RVV-AE/R-77) ainsi que des navires (avec des missiles antinavires Kh-31 et Kh-35)."


 SOV_nav_bomber_equipment_1:0 "Iliouchine Il-4T"
 SOV_nav_bomber_equipment_1_short:0 "Il-4T"
 SOV_nav_bomber_equipment_1_desc:0 "Initialement connu sous le nom de DB-3F, l'Il-4 était un bombardier moyen performant, doté de la portée nécessaire pour effectuer même des missions de bombardement stratégiques. Cette version modifiée du DB-3 comportait de nouveaux moteurs et une tourelle dorsale améliorée (le HMG ShKAS de 7,62 mm a été remplacé par un HMG UBT de 12,7 mm). Certaines séries avaient des ailes extérieures et des fuselages avant en bois pour conserver les métaux, et tout au long de la production, les moteurs et les réservoirs de carburant ont été améliorés pour améliorer les performances tout en conservant la même autonomie. Cependant, en raison du poids supplémentaire, les moteurs ne se sont pas révélés assez puissants et étaient donc plus lents que leurs prédécesseurs immédiats. Son nom de rapport à l'OTAN est Bob"
 SOV_nav_bomber_equipment_2:0 "Tupolev Tu-2T"
 SOV_nav_bomber_equipment_2_short:0 "Tu-2T"
 SOV_nav_bomber_equipment_2_desc:0 "Le Tu-2T (version prototype ANT-62T) était la variante bombardier-torpilleur du Tu-2, développée à partir de la variante Tu-2D. La décision d'utiliser la plate-forme pour ce rôle est probablement due à la préférence de l'équipage pour le Tu-2, bien qu'il s'agisse du deuxième bombardier le plus important de l'armée de l'air soviétique pendant la Seconde Guerre mondiale (le premier étant le Pe-2). Cette variante servirait avec les pilotes de l'aviation navale soviétique au crépuscule de la Seconde Guerre mondiale et servirait pendant une grande partie de la période d'après-guerre. Comme son cousin de l'Air Force, son nom de rapport à l'OTAN est « Bat »."
 SOV_nav_bomber_equipment_3:0 "Iliouchine Il-6"
 SOV_nav_bomber_equipment_3_short:0 "Il-6"
 SOV_nav_bomber_equipment_3_desc:0 "L'Il-6 est un développement ultérieur du bombardier/bombardier torpilleur à longue portée Il-4 Bob. Initialement destiné à remplacer l'Il-4, l'Il-6 était équipé de moteurs diesel à autonomie beaucoup plus longue et économes en carburant. Il devait être doté d'un armement défensif composé de cinq canons de 20 mm. Cependant, les essais en vol ont montré que le type était difficile à contrôler à des poids élevés et à faibles vitesses, ce qui rendait l'atterrissage difficile. De plus, les moteurs étaient incapables de démarrer à basse température et réagissaient lentement aux mouvements de l'accélérateur. Malgré diverses tentatives d'amélioration, le développement fut interrompu en 1944."
 SOV_nav_bomber_equipment_4:0 "Beriev Be-6"
 SOV_nav_bomber_equipment_4_short:0 "Être-6"
 SOV_nav_bomber_equipment_4_desc:0 "Le Be-6 était un hydravion produit par le bureau de conception de Beriev, dont le premier vol a eu lieu en 1949. Il était capable d'accomplir une grande variété de missions. En plus de son rôle principal de patrouille maritime et de reconnaissance maritime, le Be-6 a également été utilisé dans les patrouilles côtières et sur les lignes de ravitaillement, dans le pose de mines, dans les bombardiers torpilleurs, les bombardiers moyens et dans les transports. Son nom de rapport USAF/OTAN est Type 34, tandis que le nom de code OTAN était Madge."
 SOV_nav_bomber_equipment_5:0 "Beriev Be-10"
 SOV_nav_bomber_equipment_5_short:0 "Être-10"
 SOV_nav_bomber_equipment_5_desc:0 "Le Be-10, également connu sous le nom d'Izdelye M, était un hydravion à turboréacteur développé par l'Union soviétique en 1956. Conçu comme un bombardier de patrouille, le Be-10 était notoirement difficile à piloter et souffrait de fatigue du métal due aux contraintes de la cellule lors des décollages et atterrissages à grande vitesse ainsi qu'à la corrosion. En tant que tel, le type a été rapidement remplacé en service par le dernier Be-12 Mail. Connu en Occident sous le nom de Mallow, une sous-variante civile modifiée, le M-10 était connu pour avoir établi 12 records du monde par la Fédération aéronautique internationale (Fédération mondiale des sports aériens) en 1961."
 SOV_nav_bomber_equipment_6:0 "Beriev Be-12N Tchaïka"
 SOV_nav_bomber_equipment_6_short:0 "Be-12N Tchaïka"
 SOV_nav_bomber_equipment_6_desc:0 "Le Be-12 a été développé en 1960 pour succéder et remplacer le Be-6 Madge et le Be-10 Mallow, et a été développé comme avion de patrouille anti-sous-marin et maritime. Contrairement à son prédécesseur immédiat, propulsé par un turboréacteur, le Be-12 était un avion propulsé par un turbopropulseur et doté également d'un train d'atterrissage rétractable, ce qui donnait à l'engin une capacité d'atterrissage amphibie. La variante N améliorée était équipée de nouveaux capteurs, d'une avionique, d'un système de recherche et d'attaque Nartsiss et d'un capteur de détecteur d'anomalies magnétiques (MAD). Connu localement sous le nom de Chayka, qui signifie mouette, son nom de rapport OTAN est Mail."
 SOV_nav_bomber_equipment_7:0 "Tupolev Tu-142"
 SOV_nav_bomber_equipment_7_short:0 "Tu-142"
 SOV_nav_bomber_equipment_7_desc:0 "Le Tupolev Tu-142 est un avion soviéto-russe de reconnaissance maritime et de guerre anti-sous-marine (ASW) dérivé du bombardier stratégique à turbopropulseur Tu-95. Une variante de communication spécialisée, désignée Tu-142MR, était chargée de communications à longue portée avec les sous-marins lance-missiles balistiques soviétiques. Le Tu-142 a été conçu par le bureau d'études Tupolev et fabriqué par les usines de machines Kuibyshev Aviation et Taganrog de 1968 à 1994. Anciennement exploité par la marine soviétique et l'armée de l'air ukrainienne, le Tu-142 sert actuellement dans la marine russe."
 SOV_nav_bomber_equipment_8:0 "Iliouchine IL-38N"
 SOV_nav_bomber_equipment_8_short:0 "IL-38N"
 SOV_nav_bomber_equipment_8_desc:0 "L'Il-38 est une adaptation du quadrimoteur à turbopropulseur Ilyushin Il-18 destiné à être utilisé comme avion de patrouille maritime pour la marine soviétique. Il répondait à une exigence visant à contrer les sous-marins américains lance-missiles balistiques. L'IL-38N est une version moderne parfois appelée Il-38SD pour Sea Dragon, qui est un nouveau système de recherche et de suivi. La version de la marine russe est équipée du système Novella P-38. Le Novella P-38 est capable de trouver des cibles aériennes à des distances allant jusqu'à 90 kilomètres et de suivre des objets de surface dans un rayon de 320 kilomètres, et peut suivre simultanément 32 cibles aériennes et sous-marines."

 SOV_aerosub_0:0 "Sous-marin volant Ouchakov LPL"
 SOV_aerosub_0_short:0 "LPL Aérosub"
 SOV_aerosub_0_Desc:0 "Dans l'entre-deux-guerres, l'Union soviétique a commencé à explorer des concepts navals et à mener de nombreuses expériences pour tenter de révolutionner le combat naval. Juste avant la Seconde Guerre mondiale, Boris Ouchakov, de l'Académie des ingénieurs navals de Dzerjinski, a proposé le concept d'un sous-marin volant, un bombardier naval qui pourrait être submergé ou réapparaître à volonté pour mener des opérations de bombardement naval. Le projet a été évoqué à plusieurs reprises par Ouchakov au cours des années suivantes et finalement, en 1938, il a été exploré de manière légèrement sérieuse. La complexité substantielle de la conception était prohibitive et le projet fut finalement annulé en 1939. Cependant, en 1943, Lavrentiy Beria relança le projet et en 1947, le premier test fut effectué. En 1953, le projet fut finalement annulé par Khrouchtchev en raison de son caractère peu pratique et du fait que les progrès étaient pratiquement inexistants car il ne pouvait même pas voler correctement."
 
 SOV_tac_bomber_equipment_0:0 "Iliouchine DB-3"
 SOV_tac_bomber_equipment_0_short:0 "DB-3"
 SOV_tac_bomber_equipment_0_desc:0 "Le DB-3 était un bombardier bimoteur à ailes basses entré en service dans l'armée de l'air soviétique en 1936. Malgré une carrière plutôt calme dans l'armée soviétique, le type a servi en Chine, au sein de l'armée de l'air nationaliste chinoise pendant la Seconde Guerre sino-japonaise. C'était également le premier bombardier soviétique à lancer un raid sur la capitale allemande, Berlin, au cours des premiers mois du front de l'Est de la Seconde Guerre mondiale. La désignation DB est un raccourci pour Dalniy Bombardirovschik, signifiant bombardier à longue portée."
 SOV_tac_bomber_equipment_1:0 "Iliouchine DB-3M"
 SOV_tac_bomber_equipment_1_short:0 "DB-3M"
 SOV_tac_bomber_equipment_1_desc:0 "Première mise à niveau majeure du DB-3."
 SOV_tac_bomber_equipment_2:0 "Petliakov Pe-2B"
 SOV_tac_bomber_equipment_2_short:0 "Pe-2B"
 SOV_tac_bomber_equipment_2_desc:0 "Le Petlyakov Pe-2 était un bombardier en piqué bimoteur soviétique utilisé pendant la Seconde Guerre mondiale. L'un des avions d'attaque tactique les plus remarquables de la guerre, il s'est également révélé efficace comme chasseur lourd, comme chasseur de nuit (variante Pe-3) et comme avion de reconnaissance. À bien des égards, il ressemblait au britannique en bois De Havilland Mosquito. Le Pe-2 était, numériquement, le bombardier soviétique le plus important de la Seconde Guerre mondiale, représentant à son apogée 75 % de la force de bombardiers bimoteurs soviétiques."
 SOV_tac_bomber_equipment_3:0 "Tupolev Tu-2"
 SOV_tac_bomber_equipment_3_short:0 "Ma-2"
 SOV_tac_bomber_equipment_3_desc:0 "Le Tu-2 était un bombardier de jour bimoteur à grande vitesse développé en 1941. Il a été conçu pour être la réponse soviétique au bombardier moyen Junkers Ju-88, conçu pour répondre aux exigences d'un bombardier à grande vitesse ou d'un bombardier en piqué, avec une grande charge de bombes interne et une vitesse similaire à celle d'un chasseur monoplace. Il s'est avéré suffisamment performant pour relever le défi, et des variantes de bombardiers torpilleurs, de reconnaissance et de chasseurs lourds existaient, jouant un rôle clé dans les offensives finales soviétiques de la Seconde Guerre mondiale. Son nom de rapport de l'OTAN d'après-guerre est Bat."

 SOV_jet_tac_bomber_equipment_1:0 "Iliouchine Il-22"
 SOV_jet_tac_bomber_equipment_1_short:0 "Il-22"
 SOV_jet_tac_bomber_equipment_1_desc:0 "L'Ilyushin Il-22 fut le premier bombardier soviétique à réaction à voler. Il utilisait quatre turboréacteurs Lyulka TR-1 transportés sur de courts pylônes horizontaux devant et sous l'aile. Les moteurs n'atteignaient pas leurs valeurs de poussée nominales et leur consommation de carburant était plus élevée que prévue. Ces problèmes signifiaient que l'avion ne pouvait pas atteindre les performances requises et il fut annulé le 22 septembre 1947."
 SOV_jet_tac_bomber_equipment_2:0 "Iliouchine Il-28"
 SOV_jet_tac_bomber_equipment_2_short:0 "Il-28"
 SOV_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à entrer en production à grande échelle, l'Il-28, lors de son introduction en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été progressivement retirés du service soviétique dans les années 1980, de nombreux avions de ce type sont encore en service aujourd'hui. Le nom de rapport USAF/DoD est Type 27, tandis que le nom de code OTAN est Beagle."
 SOV_jet_tac_bomber_equipment_3:0 "Yakovlev Yak-28B"
 SOV_jet_tac_bomber_equipment_3_short:0 "Yak-28B"
 SOV_jet_tac_bomber_equipment_3_desc:0 "Le Yak-28 a été développé comme un avion de combat à ailes en flèche introduit en 1960. Les variantes du bombardier Yak-28, connues sous leur nom de code OTAN Brewer, avaient des moteurs montés sur une nacelle, similaires à la lampe de poche Yak-25 à partir de laquelle il a été développé. Avec cela et l'aile en flèche, c'était un avion hautement subsonique, capable d'atteindre des vitesses transsoniques à haute altitude. Il a servi de principal bombardier léger de l'armée de l'air soviétique et a été largement utilisé par la Russie, la Biélorussie et le Turkménistan après la chute de l'Union soviétique, tous étant retirés en 1992."
 SOV_jet_tac_bomber_equipment_4:0 "Yakovlev Yak-28I"
 SOV_jet_tac_bomber_equipment_4_short:0 "Yak-28I"
 SOV_jet_tac_bomber_equipment_4_desc:0 "Version améliorée avec le système de ciblage interne \"Initsiativa-2\" Radar de cartographie au sol à 360 degrés ainsi qu'un système de ciblage contrôlé au sol utilisant la triangulation à partir de sites émetteurs au sol"
 SOV_jet_tac_bomber_equipment_5:0 "Mikoyan-Guérivitch MiG-25RBT"
 SOV_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 SOV_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBS est un bombardier de reconnaissance monoplace dérivé du MiG-25R, équipé de systèmes de reconnaissance améliorés et d'un système de bombardement automatique Peleng. L'avion peut transporter une charge de huit bombes de 500 kg (1 102 lb)."
 SOV_jet_tac_bomber_equipment_6:0 "Soukhoï Su-24"
 SOV_jet_tac_bomber_equipment_6_short:0 "Su-24"
 SOV_jet_tac_bomber_equipment_6_desc:0 "Un gros chasseur-bombardier développé par l'Union soviétique dans les années 1960 et toujours utilisé aujourd'hui. Les caractéristiques incluent ses ailes variables et son corps pointu. Il peut équiper jusqu'à 8 000 kg d'armes et est capable de lancer différents types de missiles air-sol tout en conservant une vitesse stable. Cet avion est connu sous son nom de code OTAN « Fencer ». Avec son successeur, le Su-34, il est actuellement actif comme chasseur-bombardier pour les anciens pays du camp de l'Est."
 SOV_jet_tac_bomber_equipment_7:0 "Soukhoï Su-24M"
 SOV_jet_tac_bomber_equipment_7_short:0 "Su-24M"
 SOV_jet_tac_bomber_equipment_7_desc:0 "Entré en service en 1983, le Su-24M était un développement ultérieur du Su-24 à partir du moment où le type initial est entré en service. L'une des principales caractéristiques du Su-24M est l'inclusion d'une capacité de ravitaillement en vol avec une sonde de ravitaillement rétractable, un nouveau système de navigation interne et le désignateur laser Kaira-24, permettant au type d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."
 SOV_jet_tac_bomber_equipment_8:0 "Soukhoï Su-34"
 SOV_jet_tac_bomber_equipment_8_short:0 "Su-34"
 SOV_jet_tac_bomber_equipment_8_desc:0 "Un attaquant développé sur la base du Su-27 avec un cockpit en tandem. Il fait preuve d'une maniabilité de première classe pour un attaquant, avec ses mouvements agiles rivalisant de manière agressive avec les combattants de la même classe. Une armure plus épaisse augmente également son taux de survie. Le nom de code OTAN est « Fullback ». En supposant des missions d'attaque sur une période prolongée, la partie arrière des sièges pilotes dispose d'un lavabo et d'une cuisine simple."
 
 SOV_strat_bomber_equipment_1:0 "Petliakov Pe-8"
 SOV_strat_bomber_equipment_1_short:0 "Pe-8"
 SOV_strat_bomber_equipment_1_desc:0 "Bombardier lourd soviétique conçu avant la Seconde Guerre mondiale, le Pe-8 (à l'origine TB-7 jusqu'à ce que le nom change pour honorer Vladimir Petlyakov à sa mort en 1942) était le seul bombardier quadrimoteur développé pendant la guerre. Produit en nombre limité, il fut utilisé pour bombarder Berlin en août 1941. Il fut également utilisé pour des « raids de moral » destinés à remonter le moral du peuple soviétique en exposant les vulnérabilités de l'Axe. Sa mission principale, cependant, était d'attaquer de nuit les aérodromes, les gares de triage et autres installations arrière allemandes. Parce que ces avions remontaient le moral, la Luftwaffe allemande les a souvent ciblés, et un grand nombre d'entre eux ont été détruits au cours de la Grande Guerre patriotique. Après la guerre, ils servirent essentiellement de moyens de transport jusqu'à la fin des années 1950."
 SOV_strat_bomber_equipment_2:0 "Iliouchine Il-4"
 SOV_strat_bomber_equipment_2_short:0 "Il-4"
 SOV_strat_bomber_equipment_2_desc:0 "Bien que l'Il-4 ne soit qu'un bombardier moyen, il avait la portée nécessaire pour être utilisé dans des missions stratégiques. L'utilisation des bombardiers dans ce rôle n'était pas une priorité pour le VVS, mais l'Il-4 fut néanmoins utilisé lors de plusieurs raids de bombardement à longue portée contre Berlin en 1941. La plupart seraient utilisés sur des missions à plus courte portée, ajoutant souvent 1 000 kg (2 204 lb) supplémentaires de bombes sous les ailes, en plus des 2 500 kg (5 512 lb) internes."
 SOV_strat_bomber_equipment_3:0 "Tupolev Tu-4"
 SOV_strat_bomber_equipment_3_short:0 "Tu-4"
 SOV_strat_bomber_equipment_3_desc:0 "Le Tu-4 est une conception d'ingénierie inverse basée sur le B-29 Superfortress américain, développé pour répondre au besoin de Joseph Staline de disposer d'un bombardier stratégique doté de capacités similaires à celles du bombardier américain vainqueur de la guerre. Malgré le refus des États-Unis de prêter-louer le B-29, quatre B-29 se sont écrasés sur le territoire soviétique, ce qui a suffi pour lancer le processus de rétro-ingénierie. Malgré de nombreuses difficultés (obtention de pièces équivalentes ou supérieures aux pièces développées aux États-Unis, conversion du système impérial au système métrique, etc.), le premier vol et la mise en service du Tu-4 ont suffi à paniquer les États-Unis et la Grande-Bretagne, le premier d'une longue série pendant la guerre froide. Il aura cependant une courte durée de vie, remplacé par des bombardiers à réaction au milieu des années 1960. Son nom de rapport OTAN est Bull."

 SOV_jet_strat_bomber_equipment_1:0 "Tupolev Tu-16"
 SOV_jet_strat_bomber_equipment_1_short:0 "Tu-16"
 SOV_jet_strat_bomber_equipment_1_desc:0 "Le Tu-16 était un bombardier stratégique bimoteur développé en 1952 et l'un des premiers bombardiers stratégiques à réaction à entrer en service dans l'armée de l'air soviétique. Il avait une configuration à ailes en flèche et était propulsé par deux turboréacteurs Mikulin AM-3 sur les emplantures des ailes. Il pouvait transporter jusqu'à 9 000 kg (20 000 lb) de munitions, y compris des armes nucléaires et la FAB-9000, une bombe de 9 000 kg avec un rendement similaire à la bombe britannique du Grand Chelem. Connu en Occident sous le nom de Badger, ce type a servi tout au long de la guerre froide et a pris sa retraite en 1993. La variante chinoise construite sous licence, le H-6, reste en service en tant que bombardier stratégique de première ligne de la PLAAF."
 SOV_jet_strat_bomber_equipment_2:0 "Myasishchev Mya-3M Molot"
 SOV_jet_strat_bomber_equipment_2_short:0 "M-3M Molot"
 SOV_jet_strat_bomber_equipment_2_desc:0 "Le Mya-4 (ou M-4, désignation Myasishchev 2M) est un bombardier stratégique quadrimoteur entré en service en 1956. Ce bombardier était capable de longue portée, capable de frapper des cibles directement sur le continent américain à partir de bases russes, bien qu'il s'agisse d'un aller simple. Malgré cela, ainsi que d'autres tactiques de désinformation sélectives, les politiciens occidentaux et les agences de renseignement ont paniqué et ont conduit à la construction de nouveaux B-47 Stratojets et du B-52 Stratofortress récemment introduit. Les Russes l'ont officiellement surnommé Molot, ce qui signifie Marteau, tandis que l'OTAN lui a donné le nom de code Bison et que l'US Air Force l'a désigné Type 37."
 SOV_jet_strat_bomber_equipment_3:0 "Tupolev Tu-95M"
 SOV_jet_strat_bomber_equipment_3_short:0 "Tu-95M"
 SOV_jet_strat_bomber_equipment_3_desc:0 "S'il y avait jamais un bombardier qui pouvait être décrit comme le visage de la force de bombardement soviétique, ce serait bien le Tu-95. Introduit en 1956, le Tu-95 est le seul bombardier stratégique à hélice encore en service à ce jour. C'est l'un des avions militaires les plus bruyants en raison des pointes des pales de l'hélice qui se déplacent plus rapidement que la vitesse du son. Tout comme le B-52 Stratofortress américain, le bombardier Tu-95 est souvent comparé. Le Tu-95 devrait rester en service dans l'aérospatiale russe jusque dans les années 2040. Pour l'Occident, il est normal que l'avion synonyme de l'Empire soviétique reçoive le nom de code Bear"
 SOV_jet_strat_bomber_equipment_4:0 "Tupolev Tu-95KD"
 SOV_jet_strat_bomber_equipment_4_short:0 "Tu-95KD"
 SOV_jet_strat_bomber_equipment_4_desc:0 "Cette version du Tu-95 a reçu une mise à niveau avionique conçue pour transporter des missiles guidés tels que le missile air-sol Kh-20."
 SOV_jet_strat_bomber_equipment_5:0 "Tupolev Tu-95MS"
 SOV_jet_strat_bomber_equipment_5_short:0 "Tu-95MS"
 SOV_jet_strat_bomber_equipment_5_desc:0 "Une toute nouvelle plate-forme de porte-missiles de croisière basée sur la cellule Tu-142. Cette variante est devenue la plate-forme de lancement du missile de croisière Raduga Kh-55 et a été produite en série en 1981. Connue par l'OTAN sous le nom de Bear-H, elle a été désignée par l'armée américaine sous le nom de Tu-142 pendant un certain temps dans les années 1980 avant que sa véritable désignation ne soit connue."

 SOV_mach2stratbomber_equipment_1:0 "Tupolev Tu-22"
 SOV_mach2stratbomber_equipment_1_short:0 "Tu-22"
 SOV_mach2stratbomber_equipment_1_desc:0 "Premier bombardier supersonique à entrer en production en Union soviétique, le Tu-22 est entré en service dans l'armée de l'air soviétique en 1962. Produit en petit nombre (311 exemplaires ont été construits), ce type s'est avéré décevant, car il lui manquait la portée intercontinentale attendue d'un tel bombardier. Malgré cela, le Tu-22 a été modernisé tout au long de sa durée de vie, étant utilisé comme plate-forme de lancement pour le missile antinavire à longue portée Kh-22. Son nom de code OTAN est Blinder."
 SOV_mach2stratbomber_equipment_2:0 "Tupolev Tu-22M2"
 SOV_mach2stratbomber_equipment_2_short:0 "Tu-22M2"
 SOV_mach2stratbomber_equipment_2_desc:0 "Le Tu-22M2 est un développement ultérieur du Tu-22 Blinder. Initialement désigné Tu-26, le Tu-22M était utilisé à la fois par les forces aériennes soviétiques (comme bombardier stratégique, remplaçant le Tu-22 Blinder) et par l'aviation navale soviétique (comme avion de patrouille maritime). Sa découverte par les forces américaines a provoqué un choc en Occident, d'autant plus que le premier ministre Khrouchtchev aurait déclaré que les ICBM rendraient les bombardiers obsolètes. La variante Tu-22M2 en question était la première variante majeure de production, avec des moteurs et des admissions de style F-4 Phantom qui donnaient à l'engin une vitesse de pointe de Mach 1,65. Depuis 2014, plus de 100 Tu-22M2 Blinder-B sont en service dans l'armée de l'air russe."
 SOV_mach2stratbomber_equipment_3:0 "Tupolev Tu-22M3"
 SOV_mach2stratbomber_equipment_3_short:0 "Tu-22M3"
 SOV_mach2stratbomber_equipment_3_desc:0 "Le dernier Tu-22M3, qui a volé pour la première fois en 1977, a été mis en service en 1983 et est officiellement entré en service en 1989, était équipé de nouveaux moteurs NK-25 avec beaucoup plus de puissance, de rampes d'admission en forme de coin similaires à celles du MiG-25, d'ailes avec une plus grande flèche maximale et d'un nez remodelé abritant un nouveau radar de navigation/attaque Almaz PNA (Planeta Nositel, izdeliye 030A) et un NK-45. système de navigation/attaque, qui permet un vol à basse altitude considérablement amélioré."
 SOV_mach3stratbomber_equipment_1:0 "Soukhoï T-4M Sotka"
 SOV_mach3stratbomber_equipment_1_short:0 "T-4M Sotka"
 SOV_mach3stratbomber_equipment_1_desc:0 "Le T-4M était une autre maquette du T-4 original, conçu sur la base du XB-70 Valkyrie américain. Le T-4M a été conçu avec des ailes à géométrie variable et des avant-plans canard agrandis, tout en conservant la structure du fuselage et du moteur du T-4. On pense que la vitesse maximale du T-4M serait de Mach 3, avec une vitesse de croisière de Mach 2,8."
 SOV_mach6stratbomber_equipment_1:0 "Soukhoï T-4MS"
 SOV_mach6stratbomber_equipment_1_short:0 "T-4MS"
 SOV_mach6stratbomber_equipment_1_desc:0 "Une refonte complète et totale du bombardier stratégique à haute vitesse T-4M. Le Sukhoi Design Bureau a commencé le développement d'un tout nouvel avion stratégique bimode, le T-4MS, basé sur les expériences acquises avec le T-4 Sotka. Il était prévu d'installer les mêmes groupes motopropulseurs à bord des systèmes et des équipements."

 SOV_nuclearstratbomber_equipment_1:0 "Tupolev Tu-119"
 SOV_nuclearstratbomber_equipment_1_short:0 "Tu-119"
 SOV_nuclearstratbomber_equipment_1_desc:0 "Le Tu-119 était le développement d'un bombardier stratégique à propulsion nucléaire dérivé du Tu-95 après avoir utilisé un avion de recherche (Tu-95LML). Le type aurait été propulsé par deux moteurs nucléaires à l'intérieur (utilisant l'énergie provenant de la chaleur générée par un réacteur nucléaire embarqué) et deux turbopropulseurs alimentés au kérosène à l'extérieur."
 SOV_nuclearstratbomber_equipment_2:0 "Myassichtchev M-60"
 SOV_nuclearstratbomber_equipment_2_short:0 "M-60"
 SOV_nuclearstratbomber_equipment_2_desc:0 "Le M-60 était la conception de Myasishchev pour un bombardier stratégique à propulsion nucléaire, lui-même basé sur la conception du bombardier stratégique M-50 Bounder. Il aurait été propulsé par quatre turboréacteurs sans postcombustion dans une configuration similaire à celle du Tu-119, deux moteurs in-bord propulsés par un réacteur nucléaire et deux moteurs hors-bord alimentés au kérosène. En raison des craintes de dommages environnementaux dus à des incidents ou à des accidents et à des dépassements de coûts, le projet serait abandonné."
 
 SOV_stealth_tactical_bomber_equipment_1:0 "Soukhoï Su-24BM"
 SOV_stealth_tactical_bomber_equipment_1_short:0 "Su-24BM"
 SOV_stealth_tactical_bomber_equipment_1_desc:0 "En 1979, V Sarov a commencé à travailler sur un développement beaucoup plus vaste du Su-24M, doté d'une baie d'armes interne pouvant contenir la plupart des armes destinées à être utilisées par le nouvel avion. Connu au sein de l'OKB sous le nom de T-6BM (Bolshaya Modifikatsiya ou grande modification) et au sein du W S sous le nom de Su-24BM, il s'agissait d'un avion beaucoup plus gros mais plus furtif que le Su-24."
 #SOV_stealth_tactical_bomber_equipment_2:0 "Sukhoi Su-34M"
 #SOV_stealth_tactical_bomber_equipment_2_short:0 "Su-34M"
 #SOV_stealth_tactical_bomber_equipment_2_desc:0 "Modernized version Su-34. According to reports, this upgrade will seriously affect almost all of the aircraft's avionics. The radar, sight, communication system will be improved. The range of "smart" bombs and missiles that the bomber can use will be significantly expanded. EW capabilities will also be expanded with introduction of new hardpoints."

 SOV_stealth_strategic_bomber_equipment_1:0 "Tupolev Tu-160"
 SOV_stealth_strategic_bomber_equipment_1_short:0 "Tu-160"
 SOV_stealth_strategic_bomber_equipment_1_desc:0 "Le Tupolev Tu-160 est un bombardier stratégique lourd supersonique à ailes à flèche variable conçu par le bureau de conception de Tupolev en Union soviétique dans les années 1970. Il s'agit de l'avion militaire supersonique Mach 2+ le plus grand et le plus lourd jamais construit et se situe à côté de l'expérimental XB-70 Valkyrie en termes de longueur totale. En 2021, il s'agit de l'avion de combat le plus grand et le plus lourd, du bombardier le plus rapide utilisé et de l'avion à voilure variable le plus grand et le plus lourd jamais piloté."
 #SOV_stealth_strategic_bomber_equipment_2:0 "Tupolev Tu-160M2"
 #SOV_stealth_strategic_bomber_equipment_2_short:0 "Tu-160M2"
 #SOV_stealth_strategic_bomber_equipment_2_desc:0 "Highly upgraded version featuring low observable coatings, new more powerful and efficient engines giving it greater operational range, new avionics, electronics, glass cockpit, communications and control systems, and a number of weapons, as well as improved thrust and unrefueled range. It will also have a new defensive system protecting it from missiles."
 SOV_stealth_strategic_bomber_equipment_2:0 "Tupolev PAKDA"
 SOV_stealth_strategic_bomber_equipment_2_short:0 "PAK DA"
 SOV_stealth_strategic_bomber_equipment_2_desc:0 "Le PAK-DA (acronyme signifiant Perspektivnyi Aviatsionnyi Kompleks Dal'ney Aviatsii, ou futur complexe aéronautique pour l'aviation à long rayon d'action) est un bombardier stratégique russe de nouvelle génération proposé en cours de développement pour l'armée de l'air russe. Bombardier stratégique furtif, le PAK DA devrait entrer en service entre 2025 et 2030, le premier avion étant livré entre 2020 et 2023, dans le but de remplacer les bombardiers Tu-95 « Bear » et Tu-160 « Blackjack »."

 SOV_transport_plane_equipment_1:0 "Douglas DC-3"
 SOV_transport_plane_equipment_1_short:0 "DC-3"
 SOV_transport_plane_equipment_2:0 "Lisunov Li-2T"
 SOV_transport_plane_equipment_2_short:0 "Li-2T"
 SOV_transport_plane_equipment_3:0 "Iliouchine Il-12D"
 SOV_transport_plane_equipment_3_short:0 "Il-12D"
 SOV_transport_plane_equipment_4:0 "Antonov An-12"
 SOV_transport_plane_equipment_4_short:0 "An-12"
 SOV_transport_plane_equipment_5:0 "Antonov An-22"
 SOV_transport_plane_equipment_5_short:0 "An-22"
 SOV_transport_plane_equipment_6:0 "Iliouchine Il-76D"
 SOV_transport_plane_equipment_6_short:0 "Il-76D"
 SOV_transport_plane_equipment_7:0 "Antonov An-124"
 SOV_transport_plane_equipment_7_short:0 "An-124"
 SOV_transport_plane_equipment_8:0 "Antonov An-225"
 SOV_transport_plane_equipment_8_short:0 "An-225"
 SOV_transport_plane_equipment_10:0 "Iliouchine Il-76MD-M"
 SOV_transport_plane_equipment_10_short:0 "Il-76MD-M"

#Soviet naval aviation
 SOV_cv_CAS_equipment_1:0 "Polikarpov R-5T"
 SOV_cv_CAS_equipment_1_short:0 "R-5T"
 SOV_cv_CAS_equipment_1_desc:0 "Bombardier torpilleur monoplace avec train d'atterrissage divisé pour permettre de transporter une torpille ou une bombe de 250 à 500 kg sous le fuselage. Volé en 1934, une série de 50 exemplaires construits en 1935. Équipage de deux hommes pour les tâches de reconnaissance."
 SOV_cv_CAS_equipment_2:0 "Iliouchine Il-2T Sturmovik"
 SOV_cv_CAS_equipment_2_short:0 "Il-2T Sturmovik"
 SOV_cv_CAS_equipment_2_desc:0 "L'Il-2T est une variante bombardier-torpilleur du célèbre avion d'attaque au sol Il-2 Sturmovik. Afin de gagner du poids pour lui permettre de voler, les deux canons VYa-23 de 23 mm sur les ailes ont été retirés. En tant que tel, il pourrait être équipé d'une seule torpille de 45 cm (18 pouces). Bien que la conception n'ait jamais été mise sur le terrain, les Sturmoviks équipés de torpilles n'étaient pas une idée inconnue, car les Il-2M3 ont été modifiés pour transporter des porte-torpilles pendant les campagnes de Crimée et du Caucase de la Seconde Guerre mondiale."
 SOV_cv_CAS_equipment_3:0 "Iliouchine Il-10T"
 SOV_cv_CAS_equipment_3_short:0 "Il-10T"
 SOV_cv_CAS_equipment_3_desc:0 "Cette variante bombardier-torpilleur de l'Il-10 a été développée après la fin des hostilités en Europe et en Mandchourie, contrairement à l'Il-10 à partir duquel elle est issue. En dehors d'un bref soutien à la Corée du Nord pendant la guerre de Corée, l'Il-10T a eu une existence relativement paisible, étant retiré en 1953 au profit de chasseurs-bombardiers à réaction basés à terre comme le Su-7 Fitter."

 SOV_cv_jet_CAS_equipment_1:0 "Iliouchine Il-10MT"
 SOV_cv_jet_CAS_equipment_1_short:0 "Il-10MT"
 SOV_cv_jet_CAS_equipment_1_desc:0 "Variante améliorée de la variante du bombardier-torpilleur Ilyushin IL-10T. L'Il-10 a été développé après la fin des hostilités en Europe et en Mandchourie, contrairement à l'Il-10 à partir duquel il est issu. En dehors d'un bref soutien à la Corée du Nord pendant la guerre de Corée, l'Il-10T a eu une existence relativement paisible, étant retiré en 1953 au profit de chasseurs-bombardiers à réaction basés à terre comme le Su-7 Fitter."
 SOV_cv_jet_CAS_equipment_2:0 "Iliouchine Il-20"
 SOV_cv_jet_CAS_equipment_2_short:0 "Il-20"
 SOV_cv_jet_CAS_equipment_2_desc:0 "L'Ilyushin Il-20 était un prototype soviétique d'avion d'attaque au sol lourdement blindé destiné à remplacer l'Ilyushin Il-10. Il présentait un certain nombre de concepts innovants, notamment un cockpit monté sur le moteur, directement derrière l'hélice, et un canon automatique monté sur l'aile qui pouvait être réglé au sol au niveau de tir ou abaissé de 23° pour permettre à l'avion de mitrailler des cibles au sol tout en restant en vol en palier. Cependant, il était plus lent que l'Il-10 et son moteur M-47 posait problème lors des essais en vol en 1948-1949. Il n'a pas été mis en production. Les pilotes d'essai ont appelé l'avion le Gorbach (Bossu)."
 SOV_cv_jet_CAS_equipment_3:0 "Iliouchine Il-40T"
 SOV_cv_jet_CAS_equipment_3_short:0 "Il-40T"
 SOV_cv_jet_CAS_equipment_3_desc:0 "L'Ilyushin Il-40 (nom de l'OTAN Brawny) était un avion blindé d'attaque au sol soviétique biplace à moteur à réaction. Le premier prototype a volé en 1953 et a connu un grand succès, sauf lorsqu'il a tiré avec ses canons, car les gaz de combustion perturbaient le flux d'air dans les moteurs et provoquaient leur extinction ou leur hoquet."
 SOV_cv_jet_CAS_equipment_4:0 "Tupolev Tu-91"
 SOV_cv_jet_CAS_equipment_4_short:0 "Tu-91"
 SOV_cv_jet_CAS_equipment_4_desc:0 "Le Tupolev Tu-91 (nom de l'OTAN Boot) était un avion d'attaque embarqué soviétique. Les consoles sont équipées de deux canons fixes de 23 mm avec 200 cartouches par canon, d'une installation de canon arrière télécommandée DK-15 avec un canon AM-23 ; armement de bombes - 1 x FAB-1500 ou 3 x FAB-500 ou 6 x FAB-250 ou 12 x FAB-100 ; bombes anti-sous-marines d'un calibre de 500 kg ou 100 kg."
 SOV_cv_jet_CAS_equipment_5:0 "Tupolev Tu-91M"
 SOV_cv_jet_CAS_equipment_5_short:0 "Tu-91M"
 SOV_cv_jet_CAS_equipment_5_desc:0 "Variante améliorée du Tupolev Tu-91. Un avion d'attaque embarqué soviétique. Les consoles sont équipées de deux canons fixes de 23 mm avec 200 cartouches par canon, d'une installation de canon arrière télécommandée DK-15 avec un canon AM-23 ; armement de bombes - 1 x FAB-1500 ou 3 x FAB-500 ou 6 x FAB-250 ou 12 x FAB-100 ; bombes anti-sous-marines d'un calibre de 500 kg ou 100 kg."
 SOV_cv_jet_CAS_equipment_6:0 "Soukhoï Su-7K"
 SOV_cv_jet_CAS_equipment_6_short:0 "Su-7K"
 SOV_cv_jet_CAS_equipment_6_desc:0 "Variante embarquée du vénérable chasseur-bombardier Sukhoi Su-7 destinée à être utilisée dans l'aviation navale soviétique."
 SOV_cv_jet_CAS_equipment_7:0 "Sukhoï Su-17MKG"
 SOV_cv_jet_CAS_equipment_7_short:0 "Su-17MKG"
 SOV_cv_jet_CAS_equipment_7_desc:0 "Variante du Sukhoi Su-17M pour l'aviation navale soviétique. Il a servi de banc d'essai pour les missiles Kh-25 (AS-10 « Karen ») et Kh-29 (AS-14 « Kedge »)."
 SOV_cv_jet_CAS_equipment_8:0 "Mikoyan-Gourevitch MiG-23AB"
 SOV_cv_jet_CAS_equipment_8_short:0 "MiG-23AB"
 SOV_cv_jet_CAS_equipment_8_desc:0 "Variante multirôle basée sur le MiG-23K, il était prévu pour trois sous-variantes, le MiG-23AI (chasseur), le MiG-23AB (attaque au sol) et le MiG-23AR (reconnaissance). La variante a été annulée pour la même raison que le MiG-23K."
 SOV_cv_jet_CAS_equipment_9:0 "Mikoyan-Gourevitch MiG-27K"
 SOV_cv_jet_CAS_equipment_9_short:0 "MiG-27K"
 SOV_cv_jet_CAS_equipment_9_desc:0 "Le MiG-27K était la variante soviétique la plus avancée, avec un désignateur laser et une compatibilité avec les armes électro-optiques guidées par télévision. Il transportait le canon GSh-6-30. Officiellement, il ne portait pas de variante basée sur un porte-avions, mais avec son aile en flèche, il aurait pu être adapté pour un tel rôle."
 SOV_cv_jet_CAS_equipment_10:0 "Sukhoï Su-25UTG"
 SOV_cv_jet_CAS_equipment_10_short:0 "Su-25UTG"
 SOV_cv_jet_CAS_equipment_10_desc:0 "Le Su-25UTG (Uchebno-Trenirovochnyy s Gakom) est une variante du Su-25UB conçue pour former les pilotes au décollage et à l'atterrissage sur un pont porteur simulé terrestre, avec une section de tremplin à ski en pente et des câbles d'arrêt. Le premier a volé en septembre 1988 et environ 10 exemplaires ont été produits. Environ la moitié est restée au service russe après 1991 ; ils ont été utilisés sur le seul porte-avions russe, l'amiral Kuznetsov. Ce petit nombre d'avions était insuffisant pour répondre aux besoins de formation du groupe aérien russe, c'est pourquoi un certain nombre de Su-25UB ont été convertis en Su-25UTG."

 SOV_cv_fighter_equipment_1:0 "Aviatsiya Voyenno-Morskogo Flota"
 SOV_cv_fighter_equipment_1_short:0 "AV-MF"
 SOV_cv_fighter_equipment_1_desc:0 "L'aviation navale soviétique (AV-MF ou Aviatsiya voyenno-morskogo flota, littéralement « aviation de la flotte maritime militaire ») est la branche aéronavale de la marine soviétique. La Morskaya Aviatsiya (Aviation navale) était le service aérien de la marine soviétique pendant la Seconde Guerre mondiale. Ces unités aériennes ont fourni un soutien aérien à la flottille Voyenno-Morskoy SSSR (marine soviétique) sur les théâtres d'opérations des mers de Barents, de la Baltique et de la mer Noire, ainsi qu'au détachement naval soviétique dans la mer d'Okhotsk."
 SOV_cv_fighter_equipment_2:0 "Yakovlev Yak-7UTI"
 SOV_cv_fighter_equipment_2_short:0 "Yak-7UTI"
 SOV_cv_fighter_equipment_2_desc:0 "Le Yak-7UTI a été initialement développé comme un avion d'entraînement biplace destiné à former les futurs pilotes soviétiques. Mais ce type pourrait être bien adapté aux opérations des transporteurs, en utilisant le système de double commande pour garantir que si un pilote était fatigué, l'autre pourrait tout aussi bien fonctionner. Ce type pourrait servir de transporteur aérien de défense contre les avions allemands nazis et plus tard américains."
 SOV_cv_fighter_equipment_3:0 "Yakovlev Yak-9UT"
 SOV_cv_fighter_equipment_3_short:0 "Yak-9UT"
 SOV_cv_fighter_equipment_3_desc:0 " Yak-9U (VK-107) armé de 1 canon Nudelman N-37 de 37 mm (1,5 po) avec 30 cartouches et de 2 canons Berezin B-20 de 20 mm (0,79 po) avec 120 cartouches chacun, ce qui donne une masse totale d'éclatement en une seconde de 6 kg (13 lb). De la même manière que le Yak-9TK, il pourrait être converti pour remplacer le N-37 par un B-20 de 20 mm (0,79 po), un NS-23 de 23 mm (0,91 po) ou un N-45 de 45 mm (1,8 po). Les avions de production transportaient le NS-23 au lieu du canon N-37 comme armement par défaut."

 SOV_cv_jet_multirole_equipment_1:0 "Yakovlev Yak-15"
 SOV_cv_jet_multirole_equipment_1_short:0 "Yak-15"
 SOV_cv_jet_multirole_equipment_1_desc:0 "Le Yakovlev Yak-15 était un chasseur à turboréacteur soviétique de première génération développé par le bureau d'études Yakovlev (OKB) immédiatement après la Seconde Guerre mondiale. Le fuselage principal était celui du chasseur à moteur à pistons Yakovlev Yak-3 modifié pour monter un moteur Junkers Jumo 004 allemand de rétro-ingénierie."
 SOV_cv_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15K"
 SOV_cv_jet_multirole_equipment_2_short:0 "MiG-15K"
 SOV_cv_jet_multirole_equipment_2_desc:0 "Version navalisée de l'avion de combat MiG-15 de deuxième génération pour l'aviation navale soviétique."
 SOV_cv_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17K"
 SOV_cv_jet_multirole_equipment_3_short:0 "MiG-17K"
 SOV_cv_jet_multirole_equipment_3_desc:0 "Variante embarquée proposée du MiG-17."
 SOV_cv_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19K"
 SOV_cv_jet_multirole_equipment_4_short:0 "MiG-19K"
 SOV_cv_jet_multirole_equipment_4_desc:0 "Chasseur de pont proposé par la marine de l'URSS. L'armement des roquettes et des bombes comprenait quatre supports de poutre BD-3-56, sur lesquels pouvaient être suspendues deux bombes de 250 kg. Plus près du fuselage, derrière les niches du châssis, des pylônes pour blocs ORO-57K équipés d'ARS-57 NURS de 57 mm ont été montés."
 SOV_cv_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-19SK"
 SOV_cv_jet_multirole_equipment_5_short:0 "MiG-19SK"
 SOV_cv_jet_multirole_equipment_5_desc:0 "Avion de combat MiG-19K amélioré avec une nouvelle avionique et des performances moteur améliorées."
 SOV_cv_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21K"
 SOV_cv_jet_multirole_equipment_6_short:0 "MiG-21K"
 SOV_cv_jet_multirole_equipment_6_desc:0 "Variante embarquée proposée du MiG-21."
 SOV_cv_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23K"
 SOV_cv_jet_multirole_equipment_7_short:0 "MiG-23K"
 SOV_cv_jet_multirole_equipment_7_desc:0 "MiG-23A \"Lightning\" - la version pont du chasseur MiG-23 a été développée à l'A.I. Bureau de conception Mikoyan. Le chasseur embarqué était censé différer du MiG-23M de série par un nouveau vitrage du cockpit avec un siège de pilote surélevé pour une meilleure vue, ainsi qu'une tige non rétractable pour le ravitaillement en vol. Pour assurer l'atterrissage sur le pont, l'avion recevrait un train d'atterrissage renforcé et un crochet de frein dans la partie arrière - ce dernier nécessitait le remplacement d'une grande arête ventrale par deux petites, ainsi qu'une augmentation de la surface de la quille."
 SOV_cv_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23AI"
 SOV_cv_jet_multirole_equipment_8_short:0 "MiG-23AI"
 SOV_cv_jet_multirole_equipment_8_desc:0 "Variante multirôle basée sur le MiG-23K, il était prévu pour trois sous-variantes le MiG-23AI (chasseur), le MiG-23AB (attaque au sol) et le MiG-23AR (reconnaissance). La variante a été annulée pour la même raison que le MiG-23K."
 SOV_cv_jet_multirole_equipment_9:0 "Soukhoï Su-27K"
 SOV_cv_jet_multirole_equipment_9_short:0 "Su-27K"
 SOV_cv_jet_multirole_equipment_9_desc:0 "Le Sukhoi Su-33 est un chasseur de supériorité aérienne bimoteur tout temps basé sur un porte-avions conçu par Sukhoi et fabriqué par la Komsomolsk-on-Amur Aircraft Production Association, dérivé du Su-27 et initialement connu sous le nom de Su-27K. Comparé au Su-27, le Su-33 possède un train d'atterrissage et une structure renforcés, des ailes et des stabilisateurs repliables, le tout destiné aux opérations de transport. Le Su-33 a des canards et ses ailes sont plus grandes que celles du Su-27 pour une portance accrue. Le Su-33 est doté de moteurs améliorés et d'une double roue avant, et peut être ravitaillé en carburant."
 SOV_cv_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29K"
 SOV_cv_jet_multirole_equipment_10_short:0 "MiG-29K"
 SOV_cv_jet_multirole_equipment_10_desc:0 "Le programme MiG-29K a été relancé en réponse à la décision de la marine indienne d'acquérir l'ancien porte-avions de la marine soviétique, l'amiral Gorshkov en 2004. Lorsque l'amiral Gorshkov faisait partie de la flotte soviétique, il s'agissait d'un porte-avions/croiseur hybride utilisant des avions à décollage vertical (V/STOL) ; ainsi le pont a été remis à neuf avec une rampe de décollage et des câbles d'arrêt pour faire fonctionner les MiG-29K. L'avion possède une aile agrandie et repliable, un crochet d'arrêt et un fuselage renforcé protégé contre la corrosion."

 SOV_cv_mr_stealth_fighter_equipment_1:0 "Su-27KM"
 SOV_cv_mr_stealth_fighter_equipment_1_short:0 "Su-27KM"
 SOV_cv_mr_stealth_fighter_equipment_1_desc:0 " En 1988, la conception préliminaire du prometteur chasseur Su-27KM (« Navire modernisé ») a été préparée. Il était basé sur le projet C.32, mais était positionné différemment. Afin de ne pas embarrasser le client avec une nouveauté excessive, il a été proposé une modernisation en profondeur du Su-27K existant (futur Su-33)."

 SOV_jump_jet_equipment_1:0 "Yakovlev Yak-36"
 SOV_jump_jet_equipment_1_short:0 "Yak-36"
 SOV_jump_jet_equipment_1_desc:0 "Le Yak-36 (également connu sous le nom d'Izdeliye V) fut la première tentative soviétique d'avion de combat à décollage et atterrissage verticaux (VTOL). Quatre démonstrateurs technologiques de pré-production ont été construits. Le premier vol a eu lieu en septembre 1963 et, au début de 1966, l'avion a effectué son premier vol complet, du décollage vertical à l'atterrissage vertical. L'avion a été présenté au public à l'occasion du 50e anniversaire de la Révolution d'Octobre. Après l'obtention de résultats prometteurs dans le programme Yak-36, la prochaine étape de développement, le Yak-38, a reçu le feu vert. Connu sous son nom de rapport OTAN Freehand."
 SOV_jump_jet_equipment_2:0 "Yakovlev Yak-38"
 SOV_jump_jet_equipment_2_short:0 "Yak-38"
 SOV_jump_jet_equipment_2_desc:0 "Le Yak-38 a été développé à partir du Yak-36 (et a donc été initialement désigné Yak-36M), bien que les deux avions aient peu de points communs. Il s'agissait du seul avion de combat VTOL opérationnel de l'aviation navale soviétique et de son premier avion embarqué à voilure fixe. Le Yak-38 a servi presque exclusivement sur le porte-avions de classe Kiev, entrant en service en 1976. L'avion n'a été utilisé aucunement au combat, mais a une fois intercepté des avions américains de l'USS Enterprise au-dessus de la mer d'Oman. Son nom de code OTAN est Forger-A"
 SOV_jump_jet_equipment_3:0 "Yakovlev Yak-38M"
 SOV_jump_jet_equipment_3_short:0 "Yak-38M"
 SOV_jump_jet_equipment_3_desc:0 "Le Yak-38M était une version améliorée du Yak-38, bénéficiant d'une masse maximale au décollage de 1 000 kg (2 200 lb) supplémentaire et d'un renfort de pylône sous les ailes pour transporter 2 000 lb (910 kg) d'armes. Le Yak-38M est entré en service dans l'aviation navale soviétique. Malgré les améliorations apportées à la conception, le Forger était toujours sous-alimenté et s'est finalement révélé décevant. Ce type sera retiré lors de l'effondrement de l'Union soviétique en 1991."
 SOV_jump_jet_equipment_4:0 "Yakovlev Yak-41"
 SOV_jump_jet_equipment_4_short:0 "Yak-41"
 SOV_jump_jet_equipment_4_desc:0 "Le Yakovlev Yak-141, également connu sous le nom de Yak-41, est un avion de combat supersonique soviétique à décollage/atterrissage vertical (VTOL) conçu par Yakovlev. L'avion était destiné à remplacer complètement le Yak-38 Forger et était capable d'un vol supersonique soutenu et d'une parité avec les chasseurs terrestres soviétiques. L'avion a effectué son premier vol au début de 1987, avec le premier vol stationnaire en 1989. En 1991, le premier atterrissage naval vertical naval a été réalisé avec succès. Malgré ses promesses, le programme Freestyle a été annulé en août 1991 en raison d'un manque de financement."

 SOV_jump_stealth_equipment_1:0 "Yakovlev Yak-43"
 SOV_jump_stealth_equipment_1_short:0 "Yak-43"
 SOV_jump_stealth_equipment_1_desc:0 "Le Yak-43 était un chasseur soviétique VTOL (décollage et atterrissage vertical) développé sous le Lyogkiy Frontovoy Istrebitel (Light Frontline Fighter/LFI) conçu comme la version au sol du malheureux Yakovlev Yak-141 Freestyle, qui n'a pas réussi à atteindre la production à la suite de l'effondrement de l'Union soviétique. Comme le Yak-141, le Yak-43 n'aurait eu qu'un seul moteur principal, ainsi que deux moteurs à levage vertical dédiés. Malheureusement, comme le Yak-141, il n'a jamais été produit, notamment à cause de l'effondrement de l'Union soviétique."
 
