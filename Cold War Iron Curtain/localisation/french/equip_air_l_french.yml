 CHI_utility_helicopter_equipment_7:0 "Sikorsky UH-60M Faucon Noir"
 CHI_utility_helicopter_equipment_7_short:0 "UH-60M Faucon Noir"
 CHI_utility_helicopter_equipment_7_desc:0 "Pales de rotor à large corde de conception améliorée, moteurs T700-GE-701D (max 2 000 shp ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur du système de gestion intégré de la santé du véhicule (IVHMS) et nouveau cockpit en verre."

 CHI_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Bloc II"
 CHI_cargo_helicopter_equipment_5_short:0 "CH-47D Bloc II"
 CHI_cargo_helicopter_equipment_6:0 "Boeing CH-47SD Chinook"
 CHI_cargo_helicopter_equipment_6_short:0 "CH-47SD Chinook"

 CHI_attack_helicopter_equipment_4:0 "Bell AH-1W SuperCobra"
 CHI_attack_helicopter_equipment_4_short:0 "AH-1W SuperCobra"
 CHI_attack_helicopter_equipment_4_desc:0 "Le Bell AH-1 SuperCobra est un hélicoptère d'attaque bimoteur basé sur le monomoteur AH-1 Cobra de l'armée américaine. La famille jumelle Cobra, elle-même partie de la plus grande famille Huey, comprend l'AH-1J SeaCobra, l'AH-1T Upgraded SeaCobra et l'AH-1W SuperCobra."
 CHI_attack_helicopter_equipment_5:0 "McDonnell Douglas AH-64E Gardien"
 CHI_attack_helicopter_equipment_5_short:0 "Gardien AH-64E"
 CHI_attack_helicopter_equipment_5_desc:0 "L'AH-64E est doté d'une connectivité numérique améliorée, du système de distribution d'informations tactiques interarmées, de moteurs T700-GE-701D plus puissants avec une transmission par train frontal améliorée pour accueillir plus de puissance, d'une capacité de contrôle de véhicules aériens sans pilote (UAV), d'une capacité IFR complète et d'un train d'atterrissage amélioré. Les nouvelles pales de rotor composites, testées avec succès en 2004, augmentent la vitesse de croisière, le taux de montée et la capacité de charge utile."

 CHI_scout_helicopter_equipment_2:0 "Bell 206 Jet Ranger"
 CHI_scout_helicopter_equipment_2_short:0 "Cloche 206"
 CHI_scout_helicopter_equipment_3:0 "Bell OH-58D Kiowa"
 CHI_scout_helicopter_equipment_3_short:0 "OH-58D Kiowa"
 CHI_scout_helicopter_equipment_3_desc:0 "La variante « D » améliorée du Kiowa était le résultat du programme d'amélioration des hélicoptères de l'armée (AHIP). Il était doté de fonctionnalités telles qu'une transmission et un moteur améliorés pour les vols en sieste de terre (niveau extrêmement bas) de l'hélicoptère, ainsi qu'une configuration unique de rotor principal à quatre pales qui lui permettait d'être beaucoup plus silencieux que les autres hélicoptères, plus encore ses prédécesseurs. L'OH-58D a introduit le viseur distinctif monté sur mât (MMS) au-dessus du système de rotor et un cockpit en verre mixte, avec des instruments traditionnels identifiés comme « en veille » pour une utilisation d'urgence."
 CHI_scout_helicopter_equipment_4:0 "Bell OH-58D Kiowa Guerrier"
 CHI_scout_helicopter_equipment_4_short:0 "OH-58D Kiowa Guerrier"
 CHI_scout_helicopter_equipment_4_desc:0 "Le Kiowa Warrior, parfois désigné par son acronyme KW, est la version armée du OH-58D Kiowa. La principale différence qui distingue le Kiowa Warrior de l'avion AHIP d'origine est un pylône d'armes universel monté des deux côtés de l'avion. La mise à niveau du Kiowa Warrior comprend également des améliorations de la puissance disponible, de la navigation, de la communication et de la capacité de survie, ainsi que des modifications visant à améliorer la déployabilité de l'avion."

 CHI_naval_helicopter_equipment_7:0 "Sikorsky MH-60T Seahawk"
 CHI_naval_helicopter_equipment_7_short:0 "MH-60R Seahawk"
 CHI_naval_helicopter_equipment_7_desc:0 "Le MH-60R Seahawk est une version améliorée du SH-60 Seahawk. Développé en 1993, le MH-60R a été conçu pour combiner les fonctionnalités des précédents SH-60B et SH-60F. Ses capteurs comprennent le package ASE, MTS-FLIR, l'interrogateur radar/IFF multimode AN/APS-147, une liaison de données de flotte aéroportée avancée et un sonar actif aéroporté plus avancé. Ceci, associé à un système d'armes amélioré (lui permettant de transporter la torpille avancée Mk 54 et les missiles AGM-114 Hellfire), confère au « Seahawk » une plus grande flexibilité dans les opérations d'assaut anti-navire et amphibie."

