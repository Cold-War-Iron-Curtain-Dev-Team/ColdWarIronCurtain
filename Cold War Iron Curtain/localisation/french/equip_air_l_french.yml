 NOR_jet_multirole_equipment_1:0 "De Havilland Vampire F.3"
 NOR_jet_multirole_equipment_1_short:0 "Vampire F.3"
 NOR_jet_multirole_equipment_1_desc:0 "Le Vampire avait pour fonction d'initier les pilotes de chasse canadiens non seulement à la propulsion à réaction, mais également à d'autres commodités telles que la pressurisation du poste de pilotage et la disposition du train d'atterrissage tricycle. Il s'est avéré être un avion populaire, facile à piloter et souvent considéré comme un « hot rod ». Au service canadien, le Vampire a servi dans les unités opérationnelles et de la réserve aérienne (400, 401, 402, 411, 438 et 442 escadrons)."
 NOR_jet_multirole_equipment_2:0 "Sabre nord-américain F-86A"
 NOR_jet_multirole_equipment_2_short:0 "Sabre F-86A"
 NOR_jet_multirole_equipment_2_desc:0 "Le F-86 est un chasseur à réaction à ailes en flèche développé et introduit à la fin des années 1940 à partir de recherches capturées par les Allemands. La conception de l'avion le rendait capable d'atteindre des vitesses transsoniques et une grande maniabilité, caractéristiques qui le rendaient capable de gérer son célèbre rival, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, aux côtés de ses variantes canadiennes et australiennes réunies, en ferait l'avion de combat occidental le plus produit de l'histoire de l'aviation."
 NOR_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 NOR_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 NOR_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 NOR_jet_multirole_equipment_4:0 "Sabre nord-américain F-86F-30-NA"
 NOR_jet_multirole_equipment_4_short:0 "Sabre F-86F-30-NA"
 NOR_jet_multirole_equipment_4_desc:0 "D'autres améliorations du sabre F-86F pour le rendre plus efficace au combat contre les nouveaux avions équipés de postcombustion en les armant de points d'emport et de rails pour lancer des missiles AIM-9B Sidewinders."
 NOR_jet_multirole_equipment_5:0 "Chasseur stellaire Canadair F-104G"
 NOR_jet_multirole_equipment_5_short:0 "Chasseur stellaire F-104G"
 NOR_jet_multirole_equipment_5_desc:0 "Le Canadair CF-104 Starfighter (CF-111, CL-90) est une version modifiée du chasseur supersonique Lockheed F-104 Starfighter construit au Canada par Canadair sous licence. Il était principalement utilisé comme avion d'attaque au sol, bien qu'il ait été conçu comme intercepteur. Il a servi dans l'Aviation royale canadienne (ARC) et plus tard dans les Forces armées canadiennes (FAC)."
 NOR_jet_multirole_equipment_8:0 "Fokker F-16A Faucon de combat"
 NOR_jet_multirole_equipment_8_short:0 "Faucon de combat F-16A"
 NOR_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger avec une maniabilité et une stabilité bien équilibrées. Il possède un corps d'aile mixte exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Appelé « Fighting Falcon », son coût relativement faible et sa puissance élevée sont la raison pour laquelle il a été adapté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle best-seller ont été fabriqués."
 NOR_jet_multirole_equipment_9:0 "Fokker F-16A Block 15 OCU (améliorations des capacités opérationnelles) Fighting Falcon"
 NOR_jet_multirole_equipment_9_short:0 "F-16A Bloc 15 OCU"
 NOR_jet_multirole_equipment_9_desc:0 "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 NOR_jet_multirole_equipment_10:0 "Fokker F-16AM Block 15 MLU (mise à jour à mi-vie) Fighting Falcon"
 NOR_jet_multirole_equipment_10_short:0 "F-16AM Bloc 15 MLU"
 NOR_jet_multirole_equipment_10_desc:0 "Le package MLU (Mid-Life Update) du F-16 qui en résulte a été conçu pour mettre à niveau le cockpit et l'avionique à l'équivalent de ceux du F-16C/D Block 50/52 ; ajouter la possibilité d'utiliser des missiles air-air guidés par radar ; et d'une manière générale, améliorer les performances opérationnelles et améliorer la fiabilité, la capacité de soutien et la maintenabilité de l'avion."

 NOR_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 NOR_mr_stealth_fighter_equipment_1_short:0 "F-35A Foudre II"
 NOR_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnel (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le développement du programme F-35 a commencé en 1992, la variante A prenant son envol fin 2006 et larguant ses premières bombes moins de six ans plus tard. La variante A est la variante la plus petite et la plus légère du F-35 et est principalement destinée à remplacer le F-16 Fighting Falcon."
 
 NOR_heavy_fighter_equipment_1:0 "Bristol-Blenheim"
 NOR_heavy_fighter_equipment_1_short:0 "Blenheim"
 NOR_heavy_fighter_equipment_2:0 "Bristol Beaufighter"
 NOR_heavy_fighter_equipment_2_short:0 "Beaufighter"
 NOR_heavy_fighter_equipment_3:0 "de Havilland Mosquito F Mk.II"
 NOR_heavy_fighter_equipment_3_short:0 "Mosquito F Mk.II"
 NOR_jet_interceptor_equipment_1:0 "Météore Gloster F.4"
 NOR_jet_interceptor_equipment_1_short:0 "Météore F.4"
 NOR_jet_interceptor_equipment_2:0 "Sabre nord-américain F-86K"
 NOR_jet_interceptor_equipment_2_short:0 "Sabre F-86K"

 NOR_CAS_equipment_1:0 "de Havilland DH.82 Tiger Moth"
 NOR_CAS_equipment_1_short:0 "DH.82 Tiger Moth"
 NOR_CAS_equipment_2:0 "Caproni Ca.310"
 NOR_CAS_equipment_2_short:0 "Vers 310"
 NOR_CAS_equipment_3:0 "Hawker Typhoon Mk.Ib/Tardif"
 NOR_CAS_equipment_3_short:0 "Typhon Mk.Ib/Tardif"
 NOR_CAS_equipment_3_desc:0 "Le Hawker Typhoon était un chasseur-bombardier britannique principalement utilisé par la Royal Air Force (RAF) pendant la Seconde Guerre mondiale. Le Typhoon Mk.Ib/Late était un dérivé amélioré des précédents Hawker Typhoons, doté d'un nouveau auvent à bulles."
 NOR_CAS_equipment_4:0 "Hawker Tempête Mk.II"
 NOR_CAS_equipment_4_short:0 "Tempête Mk.II"
 NOR_jet_CAS_equipment_1:0 "République F-84E Thunderjet"
 NOR_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 NOR_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 NOR_jet_CAS_equipment_2:0 "République F-84G Thunderjet"
 NOR_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 NOR_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 NOR_jet_CAS_equipment_3:0 "République F-84F Thunderstreak"
 NOR_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 NOR_jet_CAS_equipment_3_desc:0 "Développé à partir du précédent F-84 Thunderjet, le F-84F était une variante à ailes en flèche du chasseur-bombardier conçue pour rapprocher ce type des performances du tant vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances de décollage tout en ayant une stabilité et un contrôle médiocres. Le type servirait dans une capacité limitée tout au long de sa vie, jusqu'en 1971. Son surnom est « Thunderstreak »."

 NOR_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 NOR_jet_light_equipment_1_short:0 "Étoile filante T-33"
 NOR_jet_light_equipment_2:0 "de Havilland Vampire FB.6"
 NOR_jet_light_equipment_2_short:0 "Vampire FB.6"
 NOR_jet_light_equipment_2_desc:0 ""
 NOR_jet_light_equipment_3:0 "Chasseur de la liberté Northrop F-5A"
 NOR_jet_light_equipment_3_short:0 "Chasseur de la liberté F-5A"
 NOR_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de combat léger destiné principalement à l'exportation. Il est plus léger et moins cher à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour remplacer les escadrons de chasseurs à courte portée. Malgré cela, ce type s'est avéré assez agile et était l'avion le plus proche pour rivaliser avec le MiG-21 « Fishbed » soviétique. Parce qu'il a été utilisé par la majorité des alliés de l'Amérique au plus fort de la guerre froide, il a été appelé à juste titre « Freedom Fighter »."
 NOR_jet_light_equipment_4:0 "Chasseur de la liberté Northrop F-5B"
 NOR_jet_light_equipment_4_short:0 "Chasseur de la liberté F-5B"
 NOR_jet_light_equipment_4_desc:0 "L'avion américain Northrop F-5B Freedom Fighter utilisé par la Royal Norwegian Airforco. Principalement utilisé comme entraîneur d'introduction pour d'autres avions à réaction multirôles, il disposait de points d'attache pour les ordonnances."
 NOR_jet_light_equipment_5:0 "Northrop F-5A Freedom Fighter PUFF"
 NOR_jet_light_equipment_5_short:0 "F-5A BOUFFÉE"
 NOR_jet_light_equipment_5_desc:0 "Les F-5A norvégiens ont reçu une série de mises à niveau dans l'ensemble de leur service, notamment la compatibilité avec les missiles air-sol guidés (tels que Maverick et Shrike), l'installation de systèmes ECM et des améliorations de l'avionique. Le F-5A PUFF est une variante compatible SEAD."

 NOR_recon_equipment_0:0 "Supermarine Spitfire PR.XI"
 NOR_recon_equipment_0_short:0 "Spitfire PR.XI"
