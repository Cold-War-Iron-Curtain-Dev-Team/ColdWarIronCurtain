 PRC_fighter_equipment_0:0 "Force aérienne de l'Armée populaire de libération"
 PRC_fighter_equipment_0_short:0 "PLAAF"
 PRC_fighter_equipment_0_desc:0 "L'armée de l'air de l'Armée populaire de libération, également connue sous le nom de Force aérienne chinoise ou Force aérienne du peuple, est une branche des services aériens de l'Armée populaire de libération, les forces armées régulières de la République populaire de Chine. La PLAAF a été officiellement créée le 11 novembre 1949 et est composée de 5 branches : l'aviation, l'artillerie anti-aérienne, les missiles sol-air (SAM), le radar et le corps aéroporté."

 PRC_fighter_equipment_1:0 "Nakajima Ki-43 Hayabusa"
 PRC_fighter_equipment_1_short:0 "Ki-43 Hayabusa"
 PRC_fighter_equipment_2:0 "Lavotchkine La-7"
 PRC_fighter_equipment_2_short:0 "La-7"
 PRC_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de combat soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau de conception de Lavochkin. Il s'agissait d'un développement et d'un perfectionnement du Lavochkin La-5, et du dernier d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 PRC_fighter_equipment_3:0 "Lavotchkine La-9"
 PRC_fighter_equipment_3_short:0 "La-9"
 PRC_fighter_equipment_3_desc:0 "La-9 représente un développement ultérieur du prototype Lavochkin La-126. Le premier prototype, désigné La-130, fut achevé en 1946. La similitude avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur avait une construction entièrement métallique et une aile à flux laminaire. Les économies de poids dues à l'élimination du bois de la cellule ont permis d'améliorer considérablement la capacité de carburant et l'armement à quatre canons. Des combats simulés ont démontré que le La-130 était à égalité avec le La-7 mais qu'il était inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, entra en production en août 1946. Au total, 1 559 avions furent construits à la fin de la production en 1948."

