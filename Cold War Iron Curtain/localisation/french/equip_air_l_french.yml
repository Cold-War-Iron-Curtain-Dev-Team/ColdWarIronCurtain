 JAP_jet_interceptor_equipment_6:0 "Mitsubishi F-104J Kai Starfighter"
 JAP_jet_interceptor_equipment_6_short:0 "F-104J Kai Starfighter"
 JAP_jet_interceptor_equipment_6_desc:0 "Le F-104J Ryu est un chasseur monoplace et monomoteur à queue en T. Il s'agit de la variante japonaise du F-104, initialement sélectionnée pour répondre aux besoins de supériorité aérienne du Japon en novembre 1960. Construit très tôt par Lockheed, puis repris par Mitsubishi Heavy Industries, les livraisons du F-104J ont commencé en 1961 et se sont achevées en 1966. Le F-104J transporte un canon Vulcan M61A1 de 20 mm et jusqu'à quatre missiles AIM-9 Sidewinder."
 JAP_jet_interceptor_equipment_7:0 "Mitsubishi F-4EJ Phantom II"
 JAP_jet_interceptor_equipment_7_short:0 "F-4EJ Phantom II début"
 JAP_jet_interceptor_equipment_7_desc:0 "La première version du F-4EJ n'avait pas la capacité d'effectuer des missions air-sol."
 JAP_jet_interceptor_equipment_8:0 "Mitsubishi F-15J Aigle"
 JAP_jet_interceptor_equipment_8_short:0 "F-15J Aigle"
 JAP_jet_interceptor_equipment_8_desc:0 "Les F-15J/DJ sont identiques aux F-15C/D à l'exception de l'ECM, du système d'alerte radar et de l'équipement nucléaire. Le système de contre-mesures internes AN/ALQ-135 est remplacé par le J/ALQ-8 indigène et le récepteur d'avertissement radar AN/ALR-56 est remplacé par le J/APR-4."
 JAP_jet_interceptor_equipment_9:0 "Mitsubishi F-15J Kai Aigle"
 JAP_jet_interceptor_equipment_9_short:0 "F-15J Aigle MSIP"
 JAP_jet_interceptor_equipment_9_desc:0 "Programme d'amélioration en plusieurs étapes du F-15J de Mitsubishi."

 JAP_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 JAP_mr_stealth_fighter_equipment_1_short:0 "F-35A Foudre II"
 JAP_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnel (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le développement du programme F-35 a commencé en 1992, la variante A prenant son envol fin 2006 et larguant ses premières bombes moins de six ans plus tard. La variante A est la variante la plus petite et la plus légère du F-35 et est principalement destinée à remplacer le F-16 Fighting Falcon."

 JAP_stealth_fighter_equipment_1:0 "Mitsubishi F-2 Viper Zéro"
 JAP_stealth_fighter_equipment_1_short:0 "F-2 Viper Zéro"

 JAP_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 JAP_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Foudre II"
 JAP_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour le déploiement de porte-avions. Le développement du programme F-35 a commencé en 1992, et la variante C était dans les airs dès 2010 et était opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses frères et soeurs, la variante C présente des ailes plus grandes avec des sections de bout d'aile pliables."
 
 JAP_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 JAP_jump_stealth_equipment_1_short:0 "F-35B Foudre II"
 JAP_jump_stealth_equipment_1_desc:0 "Un chasseur polyvalent produit à l'aide d'une conception JSF (Joint Strike Fighter). Bien qu'il soit capable d'utiliser une variété d'armes dans les combats air-air et sol-sol, le coût d'acquisition de ce chasseur furtif est plus gérable que celui du F-22A. Conformément à son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."

 JAP_recon_equipment_0:0 "Stinson L-5 Sentinelle"
 JAP_recon_equipment_0_short:0 "Sentinelle L-5"
 JAP_recon_equipment_0_desc:0 "Le Stinson L-5 Sentinel était un avion de liaison et de reconnaissance photographique de la Seconde Guerre mondiale utilisé par toutes les branches de l'armée américaine et par la Royal Air Force britannique. Il a été produit par la Stinson Aircraft Company."
 JAP_jet_recon_equipment_0:0 "Sabre nord-américain RF-86F"
 JAP_jet_recon_equipment_0_short:0 "Sabre RF-86F"
 JAP_jet_recon_equipment_0_desc:0 "Conversions F-86 avec trois caméras pour la reconnaissance"
 JAP_jet_recon_equipment_1:0 "McDonnell Douglas RF-4E Phantom II"
 JAP_jet_recon_equipment_1_short:0 "RF-4E Fantôme II"
 JAP_jet_recon_equipment_1_desc:0 "Le Japon a choisi le F-4 Phantom II comme nouveau chasseur à la fin des années 1960. Le 1er novembre 1968, ce choix fut rendu public et le Japon devint l'un des rares pays à produire cet avion sous licence. Le Nihon Koku Jietai (Japan Air Self-Defense Force, JASDF) a reçu un total de 154 F-4EJ et RF-4E. Alors que les F-4EJ ont été construits presque entièrement par Mitsubishi Heavy Industries, les RF-4E ont été achetés directement auprès de McDonnell-Douglas"
 JAP_jet_recon_equipment_2:0 "Mitsubishi RF-4EJ Kai Phantom II"
 JAP_jet_recon_equipment_2_short:0 "RF-4EJ Kai Fantôme II"
 JAP_jet_recon_equipment_2_desc:0 "Le Japon a choisi le F-4 Phantom II comme nouveau chasseur à la fin des années 1960. Le 1er novembre 1968, ce choix fut rendu public et le Japon devint l'un des rares pays à produire cet avion sous licence. Le Nihon Koku Jietai (Japan Air Self-Defense Force, JASDF) a reçu un total de 154 F-4EJ et RF-4E. Alors que les F-4EJ ont été construits presque entièrement par Mitsubishi Heavy Industries, les RF-4E ont été achetés directement auprès de McDonnell-Douglas"

 JAP_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 JAP_jet_light_equipment_1_short:0 "Étoile filante T-33"
 JAP_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 JAP_jet_light_equipment_2:0 "Kawasaki T-33A Wakataka"
 JAP_jet_light_equipment_2_short:0 "T-33A Wakataka"
 JAP_jet_light_equipment_2_desc:0 "La JASDF a reçu un total de 68 Lockheed T-33A de l'USAF et les a rapidement désignés Wakataka. Il a également été décidé qu'une entreprise locale prendrait une licence pour la production du T-33A. Kawasaki s'est montré à la hauteur de la tâche et a d'abord assemblé 20 kits démontables produits par Lockheed. Le premier T-33A purement japonais est sorti des chaînes de production et a été remis à la JASDF le 22 novembre 1956. Au total, 210 T-33A construits par Kawasaki ont été produits à la fin de sa production en 1959."
 JAP_jet_light_equipment_3:0 "Fuji T-1"
 JAP_jet_light_equipment_3_short:0 "T-1"
 JAP_jet_light_equipment_3_desc:0 "Le T-1 a été le premier avion à réaction de conception japonaise à être développé depuis la Seconde Guerre mondiale. Il s'agissait du premier avion à réaction produit en série au Japon et du premier avion doté d'une aile en flèche."
 JAP_jet_light_equipment_4:0 "Mitsubishi T-2"
 JAP_jet_light_equipment_4_short:0 "T-2"
 JAP_jet_light_equipment_4_desc:0 "le Mitsubishi T-2 était un avion d'entraînement à réaction supersonique utilisé par la Japan Air Self-Defense Force. Introduit en 1975, il fut le premier avion de conception japonaise à franchir le mur du son. C'était la base de l'avion militaire Mitsubishi F-1."
 JAP_jet_light_equipment_5:0 "Kawasaki T-4"
 JAP_jet_light_equipment_5_short:0 "T-4"
 JAP_jet_light_equipment_5_desc:0 "le Kawasaki T-4 est un avion d'entraînement à réaction intermédiaire subsonique japonais développé et fabriqué par le conglomérat commercial Kawasaki Heavy Industries. Son seul opérateur est la Force aérienne japonaise d'autodéfense (JASDF), en partie à cause des restrictions historiques sur l'exportation de matériel militaire."

