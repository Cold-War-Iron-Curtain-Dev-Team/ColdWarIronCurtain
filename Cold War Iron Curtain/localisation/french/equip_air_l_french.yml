 DEN_CAS_equipment_1:0 "de Havilland DH.82 Tiger Moth"
 DEN_CAS_equipment_1_short:0 "DH.82 Tiger Moth"
 DEN_CAS_equipment_2:0 "SAAB-B17C"
 DEN_CAS_equipment_2_short:0 "B17C"
 DEN_CAS_equipment_3:0 "Hawker Typhoon Mk.Ib/Tardif"
 DEN_CAS_equipment_3_short:0 "Typhon Mk.Ib/Tardif"
 DEN_CAS_equipment_3_desc:0 "Le Hawker Typhoon était un chasseur-bombardier britannique principalement utilisé par la Royal Air Force (RAF) pendant la Seconde Guerre mondiale. Le Typhoon Mk.Ib/Late était un dérivé amélioré des précédents Hawker Typhoons, doté d'un nouveau auvent à bulles."
 DEN_CAS_equipment_4:0 "Hawker Tempête Mk.II"
 DEN_CAS_equipment_4_short:0 "Tempête Mk.II"
 DEN_jet_CAS_equipment_1:0 "République F-84E Thunderjet"
 DEN_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 DEN_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 DEN_jet_CAS_equipment_2:0 "République F-84G Thunderjet"
 DEN_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 DEN_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 DEN_jet_CAS_equipment_3:0 "République F-84F Thunderstreak"
 DEN_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 DEN_jet_CAS_equipment_3_desc:0 "Développé à partir du précédent F-84 Thunderjet, le F-84F était une variante à ailes en flèche du chasseur-bombardier conçue pour rapprocher ce type des performances du tant vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances de décollage tout en ayant une stabilité et un contrôle médiocres. Le type servirait dans une capacité limitée tout au long de sa vie, jusqu'en 1971. Son surnom est « Thunderstreak »."
 DEN_jet_CAS_equipment_4:0 "Super Sabre nord-américain F-100D"
 DEN_jet_CAS_equipment_4_short:0 "Super Sabre F-100D"
 DEN_jet_CAS_equipment_4_desc:0 "Chasseur-bombardier monoplace, avionique plus avancée, aile et dérive plus grandes, volets d'atterrissage. Le F-100 a remplacé le F-84G Thunderjet en tant que chasseur d'attaque de la Royal Danish Air Force."
 DEN_jet_CAS_equipment_6:0 "SAAB A-35XD Drake"
 DEN_jet_CAS_equipment_6_short:0 "A-35XD Draken"
 DEN_jet_CAS_equipment_6_desc:0 "Lorsque l'armée de l'air danoise (Flyvevåbnet) a dû choisir un avion pour compléter le F-100D au milieu des années 1960, on a tenté de trouver un type de base pouvant être adapté à la fois à la défense aérienne, à l'attaque au sol et à la reconnaissance. En conséquence, le Danemark s'est tourné vers Saab et a demandé un chasseur-bombardier basé sur le J-35F. La nouvelle variante s'appelait initialement 35X, mais après avoir reçu les spécifications danoises, qui comprenaient des pylônes supplémentaires sur l'aile intérieure et extérieure, ce qui lui donnait 9 pylônes au total, Saab a nommé l'avion A35XD"

