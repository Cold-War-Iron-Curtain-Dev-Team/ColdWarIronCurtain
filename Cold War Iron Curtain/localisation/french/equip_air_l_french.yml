 PRC_slbm_equipment_6:0 "Ju Lang-1"
 PRC_slbm_equipment_6_short:0 "JL-1"
 PRC_slbm_equipment_6_desc:0 "Le Julang-1 était le missile balistique chinois lancé depuis un sous-marin nucléaire (SLBM) de première génération. Selon un rapport du ministère américain de la Défense de 2011, l'état opérationnel du JL-1 était discutable."
 PRC_slbm_equipment_7:0 "Ju lang-2"
 PRC_slbm_equipment_7_short:0 "JL-2"
 PRC_slbm_equipment_7_desc:0 "Le JL-2 est un missile balistique chinois de deuxième génération à portée intercontinentale lancé par un sous-marin (SLBM) déployé sur les sous-marins de type 094 de la marine de l'Armée populaire de libération (PLAN)."

