 CHI_jet_CAS_equipment_1:0 "République F-84E Thunderjet"
 CHI_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 CHI_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 CHI_jet_CAS_equipment_2:0 "République F-84G Thunderjet"
 CHI_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 CHI_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 CHI_jet_CAS_equipment_3:0 "République F-84F Thunderstreak"
 CHI_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 CHI_jet_CAS_equipment_3_desc:0 "Développé à partir du précédent F-84 Thunderjet, le F-84F était une variante à ailes en flèche du chasseur-bombardier conçue pour rapprocher ce type des performances du tant vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances de décollage tout en ayant une stabilité et un contrôle médiocres. Le type servirait dans une capacité limitée tout au long de sa vie, jusqu'en 1971. Son surnom est « Thunderstreak »."

 CHI_jet_CAS_equipment_8:0 "AIDC XA-3 Lui Meng"
 CHI_jet_CAS_equipment_8_short:0 "XA-3 Lui Meng"
 CHI_jet_CAS_equipment_8_desc:0 "Version prototype XA-3 qui a été annulée en raison de la concentration sur le F-CK-1 Ching Kuo. Conçu pour l'attaque au sol, monoplace. Comprend un canon automatique de 30 mm, des supports d'armes supplémentaires et une capacité de transport et pourrait également être équipé de missiles antinavires Hsiung-feng II."

 CHI_heavy_fighter_equipment_1:0 "République P-43A-1 Lancer"
 CHI_heavy_fighter_equipment_1_short:0 "Lancier P-43A-1"
 CHI_heavy_fighter_equipment_2:0 "Lockheed P-38J Foudre"
 CHI_heavy_fighter_equipment_2_short:0 "P-38J Foudre"
 CHI_heavy_fighter_equipment_2_desc:0 "Un avion à double moteur à pistons conçu en mettant l'accent sur la vitesse et les armements lourds. Pendant la Seconde Guerre mondiale, sa vitesse a été utilisée dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme particulière lui a valu le nom de « der Gabelschwanz-Teufel » ou « le diable à queue fourchue » en Allemagne et de « Ni hikouki, ippairotto » ou « deux avions, un pilote » au Japon. Il est également connu sous le nom de « Foudre »."
 CHI_heavy_fighter_equipment_3:0 "Lockheed P-38L Foudre"
 CHI_heavy_fighter_equipment_3_short:0 "Foudre P-38L"
 CHI_heavy_fighter_equipment_3_desc:0 "Un avion à double moteur à pistons conçu en mettant l'accent sur la vitesse et les armements lourds. Pendant la Seconde Guerre mondiale, sa vitesse a été utilisée dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme particulière lui a valu le nom de « der Gabelschwanz-Teufel » ou « le diable à queue fourchue » en Allemagne et de « Ni hikouki, ippairotto » ou « deux avions, un pilote » au Japon. Il est également connu sous le nom de « Foudre »."

