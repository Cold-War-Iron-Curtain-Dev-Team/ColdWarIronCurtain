 SPR_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Bloc II"
 SPR_cargo_helicopter_equipment_5_short:0 "CH-47D Bloc II"
 SPR_cargo_helicopter_equipment_5_desc:0 "CH-47D mis à niveau avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les Chinook plus anciens ont été mis à niveau vers cette norme."
 SPR_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 SPR_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 SPR_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, un CH-47D amélioré, a effectué son vol inaugural ; le premier modèle de production a été déployé le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les mises à niveau comprennent des moteurs Honeywell de 4 868 chevaux (3 630 kW) et la cellule dotée d'une plus grande construction monobloc pour réduire les besoins de maintenance. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion pour augmenter la durée de vie."

 ##POR
 POR_heavy_fighter_equipment_1:0 "Bristol Blenheim Mk.IV"
 POR_heavy_fighter_equipment_1_short:0 "Blenheim Mk.IV"
 POR_heavy_fighter_equipment_2:0 "FIV Bristol Blenheim Mk.V"
 POR_heavy_fighter_equipment_2_short:0 "FIV Blenheim Mk.V"
 POR_heavy_fighter_equipment_3:0 "Lockheed P-38L Foudre"
 POR_heavy_fighter_equipment_3_short:0 "Foudre P-38L"
 POR_heavy_fighter_equipment_3_desc:0 "Un avion à double moteur à pistons conçu en mettant l'accent sur la vitesse et les armements lourds. Pendant la Seconde Guerre mondiale, sa vitesse a été utilisée dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme particulière lui a valu le nom de « der Gabelschwanz-Teufel » ou « le diable à queue fourchue » en Allemagne et de « Ni hikouki, ippairotto » ou « deux avions, un pilote » au Japon. Il est également connu sous le nom de « Foudre »."

