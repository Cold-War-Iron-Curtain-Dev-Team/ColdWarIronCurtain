 BEL_jet_multirole_equipment_5:0 "Chasseur stellaire SABCA F-104G"
 BEL_jet_multirole_equipment_5_short:0 "Chasseur stellaire F-104G"
 BEL_jet_multirole_equipment_5_desc:0 "Pour remplacer les chasseurs SABCA vieillissants, l'Armée de l'Air Royale Belge a exploité des chasseurs Lockheed F-104G Starfighter. Le F-104G a été utilisé dans une capacité multirôle en tant qu'intercepteur ainsi qu'avion d'attaque au sol."
 BEL_jet_multirole_equipment_8:0 "SABCA F-16A Faucon de combat"
 BEL_jet_multirole_equipment_8_short:0 "Faucon de combat F-16A"
 BEL_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger avec une maniabilité et une stabilité bien équilibrées. Il possède un corps d'aile mixte exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Appelé « Fighting Falcon », son coût relativement faible et sa puissance élevée sont la raison pour laquelle il a été adapté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle best-seller ont été fabriqués."
 BEL_jet_multirole_equipment_9:0 "SABCA F-16A Block 15 OCU (améliorations des capacités opérationnelles) Fighting Falcon"
 BEL_jet_multirole_equipment_9_short:0 "F-16A Bloc 15 OCU"
 BEL_jet_multirole_equipment_9_desc:0 "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 BEL_jet_multirole_equipment_10:0 "SABCA F-16AM Block 15 MLU (mise à jour à mi-vie) Fighting Falcon"
 BEL_jet_multirole_equipment_10_short:0 "F-16AM Bloc 15 MLU"
 BEL_jet_multirole_equipment_10_desc:0 "Le package MLU (Mid-Life Update) du F-16 qui en résulte a été conçu pour mettre à niveau le cockpit et l'avionique à l'équivalent de ceux du F-16C/D Block 50/52 ; ajouter la possibilité d'utiliser des missiles air-air guidés par radar ; et d'une manière générale, améliorer les performances opérationnelles et améliorer la fiabilité, la capacité de soutien et la maintenabilité de l'avion."

 BEL_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 BEL_mr_stealth_fighter_equipment_1_short:0 "F-35A Foudre II"
 BEL_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnel (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le développement du programme F-35 a commencé en 1992, la variante A prenant son envol fin 2006 et larguant ses premières bombes moins de six ans plus tard. La variante A est la variante la plus petite et la plus légère du F-35 et est principalement destinée à remplacer le F-16 Fighting Falcon."

 BEL_heavy_fighter_equipment_1:0 "Bristol-Blenheim"
 BEL_heavy_fighter_equipment_1_short:0 "Blenheim"
 BEL_heavy_fighter_equipment_2:0 "Bristol Beaufighter"
 BEL_heavy_fighter_equipment_2_short:0 "Beaufighter"
 BEL_heavy_fighter_equipment_3:0 "de Havilland Mosquito F Mk.II"
 BEL_heavy_fighter_equipment_3_short:0 "Mosquito F Mk.II"

 BEL_jet_interceptor_equipment_1:0 "SABCA Météore F.4"
 BEL_jet_interceptor_equipment_1_short:0 "Météore F.4"
 BEL_jet_interceptor_equipment_2:0 "SABCA Météore F.8"
 BEL_jet_interceptor_equipment_2_short:0 "Météore F.8"
 BEL_jet_interceptor_equipment_3:0 "SABCA CF-100 Canuck Mk.3"
 BEL_jet_interceptor_equipment_3_short:0 "CF-100 Canuck Mk.3"
 BEL_jet_interceptor_equipment_3_desc:0 "La SABCA belge a produit une variante de l'intercepteur Avro Canada CF-100 Canuck pour l'Armée de l'Air royale belge."
 BEL_jet_interceptor_equipment_4:0 "SABCA CF-100 Canuck Mk.5"
 BEL_jet_interceptor_equipment_4_short:0 "CF-100 Canuck Mk.5"
 BEL_jet_interceptor_equipment_4_desc:0 "La SABCA belge améliorée a produit une variante de l'intercepteur Avro Canada CF-100 Canuck pour l'Armée de l'Air royale belge."

 BEL_CAS_equipment_1:0 "Avions Fairey Battle"
 BEL_CAS_equipment_1_short:0 "Bataille"
 BEL_CAS_equipment_2:0 "SABCA S.47"
 BEL_CAS_equipment_2_short:0 "Article 47"
 BEL_CAS_equipment_3:0 "Hawker Typhoon Mk.Ib/Tardif"
 BEL_CAS_equipment_3_short:0 "Typhon Mk.Ib/Tardif"
 BEL_CAS_equipment_3_desc:0 "Le Hawker Typhoon était un chasseur-bombardier britannique principalement utilisé par la Royal Air Force (RAF) pendant la Seconde Guerre mondiale. Le Typhoon Mk.Ib/Late était un dérivé amélioré des précédents Hawker Typhoons, doté d'un nouveau auvent à bulles."
 BEL_CAS_equipment_4:0 "Hawker Tempête Mk.II"
 BEL_CAS_equipment_4_short:0 "Tempête Mk.II"
 BEL_jet_CAS_equipment_1:0 "SABCA F-84E Thunderjet"
 BEL_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 BEL_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 BEL_jet_CAS_equipment_2:0 "SABCA F-84G Thunderjet"
 BEL_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 BEL_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 BEL_jet_CAS_equipment_3:0 "SABCA F-84F Thunderstreak"
 BEL_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 BEL_jet_CAS_equipment_3_desc:0 "Développé à partir du précédent F-84 Thunderjet, le F-84F était une variante à ailes en flèche du chasseur-bombardier conçue pour rapprocher ce type des performances du tant vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances de décollage tout en ayant une stabilité et un contrôle médiocres. Le type servirait dans une capacité limitée tout au long de sa vie, jusqu'en 1971. Son surnom est « Thunderstreak »."
 BEL_jet_CAS_equipment_6:0 "SABCA Mirage 5BA"
 BEL_jet_CAS_equipment_6_short:0 "Mirage 5BA"
 BEL_jet_CAS_equipment_6_desc:0 "le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France et dans plusieurs autres pays sous licence. Il est dérivé du populaire chasseur Mirage III de Dassault."
 
