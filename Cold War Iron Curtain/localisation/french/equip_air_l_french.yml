 slbm_equipment_6_short:0 "SLBM VI"
 slbm_equipment_6_desc:0 "Les SLBM sont des missiles balistiques lancés par des sous-marins. Un missile balistique capable d'être lancé depuis des sous-marins. Les variantes modernes fournissent généralement plusieurs véhicules de rentrée (MIRV) pouvant être ciblés indépendamment, chacun transportant une ogive nucléaire et permettant à un seul missile lancé de frapper plusieurs cibles. Les missiles balistiques lancés par des sous-marins fonctionnent différemment des missiles de croisière lancés par des sous-marins."
 slbm_equipment_7:0 "SLBM VII"
 slbm_equipment_7_short:0 "SLBM VII"
 slbm_equipment_7_desc:0 "Les SLBM sont des missiles balistiques lancés par des sous-marins. Un missile balistique capable d'être lancé depuis des sous-marins. Les variantes modernes fournissent généralement plusieurs véhicules de rentrée (MIRV) pouvant être ciblés indépendamment, chacun transportant une ogive nucléaire et permettant à un seul missile lancé de frapper plusieurs cibles. Les missiles balistiques lancés par des sous-marins fonctionnent différemment des missiles de croisière lancés par des sous-marins."
 slbm_equipment_8:0 "SLBM VIII"
 slbm_equipment_8_short:0 "SLBM VIII"
 slbm_equipment_8_desc:0 "Les SLBM sont des missiles balistiques lancés par des sous-marins. Un missile balistique capable d'être lancé depuis des sous-marins. Les variantes modernes fournissent généralement plusieurs véhicules de rentrée (MIRV) pouvant être ciblés indépendamment, chacun transportant une ogive nucléaire et permettant à un seul missile lancé de frapper plusieurs cibles. Les missiles balistiques lancés par des sous-marins fonctionnent différemment des missiles de croisière lancés par des sous-marins."
 slbm_equipment_9:0 "SLBM IX"
 slbm_equipment_9_short:0 "SLBM IX"
 slbm_equipment_9_desc:0 "Les SLBM sont des missiles balistiques lancés par des sous-marins. Un missile balistique capable d'être lancé depuis des sous-marins. Les variantes modernes fournissent généralement plusieurs véhicules de rentrée (MIRV) pouvant être ciblés indépendamment, chacun transportant une ogive nucléaire et permettant à un seul missile lancé de frapper plusieurs cibles. Les missiles balistiques lancés par des sous-marins fonctionnent différemment des missiles de croisière lancés par des sous-marins."

