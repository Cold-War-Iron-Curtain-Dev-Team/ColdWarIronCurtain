 #POR_recon_equipment_0_desc:0 ""
 POR_jet_recon_equipment_0:0 "Étoile filante Lockheed RT-33A"
 POR_jet_recon_equipment_0_short:0 "Étoile filante RT-33A"
 POR_jet_recon_equipment_0_desc:0 "RT-33A modifié avant la livraison en tant que variante de reconnaissance monoplace ; 85 construits, principalement pour l'exportation dans le cadre du programme d'assistance militaire."
 #POR_jet_recon_equipment_1:0 ""
 #POR_jet_recon_equipment_1_short:0 ""
 #POR_jet_recon_equipment_1_desc:0 ""
 POR_jet_recon_equipment_2:0 "Faucon de combat RF-16AM de General Dynamics"
 POR_jet_recon_equipment_2_short:0 "Faucon de combat RF-16AM"
 POR_jet_recon_equipment_2_desc:0 "La désignation RF-16A est cependant utilisée par la Royal Danish Air Force. Début 1994, 10 F-16A danois ont été renommés avions de reconnaissance tactique RF-16A, remplaçant les RF-35 Drakens retirés fin 1993. À titre temporaire, ils étaient à l'origine équipés des caméras optiques et des capteurs électro-optiques (E-O) des Drakens reconditionnés dans un module de reconnaissance Per Udsen « Red Baron », qui ont été remplacés quelques années plus tard par le module de reconnaissance modulaire (MRP) de Per Udsen."

 POR_CAS_equipment_1:0 "Bréda Ba.65bis"
 POR_CAS_equipment_1_short:0 "Ba.65bis"
 POR_CAS_equipment_2:0 "AT-6C Texan nord-américain"
 POR_CAS_equipment_2_short:0 "AT-6C Texan"
 POR_CAS_equipment_3:0 "Bell P-39L Airacobra"
 POR_CAS_equipment_3_short:0 "P-39L Airacobra"
 POR_CAS_equipment_4:0 "Douglas A-26C Envahisseur"
