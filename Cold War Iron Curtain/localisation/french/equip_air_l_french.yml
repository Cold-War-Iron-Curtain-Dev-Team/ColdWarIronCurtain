 FRA_jet_strat_bomber_equipment_3:0 "Sud Aviation Super Vautour"
 FRA_jet_strat_bomber_equipment_3_short:0 "Super Vautour"
 FRA_jet_strat_bomber_equipment_3_desc:0 "Alors que les nouvelles exigences en matière de bombardiers aboutiraient finalement à la sélection, au développement et à la fabrication du bombardier Dassault Mirage IV ; Sud Aviation avait également choisi de répondre à cette exigence en produisant sa propre proposition pour la production d'un Super Vautour envisagé. Selon l'auteur de l'aviation Bill Gunston, la variante Super Vautour « étirée » non construite aurait présenté un rayon de combat accru de 1 700 milles ainsi que la capacité d'atteindre au moins Mach 0,9."

