 WGR_jet_multirole_equipment_1:0 "Messerschmitt Me 262A-1a 'Schwalbe'"
 WGR_jet_multirole_equipment_1_short:0 "Moi 262A-1a 'Schwalbe'"
 WGR_jet_multirole_equipment_2:0 "Canadair CL-13 Sabre Mark 4"
 WGR_jet_multirole_equipment_2_short:0 "Sabre Mk.4"
 WGR_jet_multirole_equipment_2_desc:0 " le premier Sabre Mk.4 a volé avec le moteur Orenda 10, ce qui lui a donné un net avantage en termes de taux de montée et de plafond par rapport aux variantes précédentes. D'autres améliorations du Mk 5 comprenaient un nouveau système d'oxygène et une maniabilité améliorée et des caractéristiques à basse vitesse obtenues en augmentant la corde de l'aile de six pouces (15,2 cm) à l'emplanture et de trois pouces (7,2 cm) au bout de l'aile ainsi qu'en installant une petite clôture d'aile verticale."
 WGR_jet_multirole_equipment_3:0 "Canadair CL-13 Sabre Mark 5"
 WGR_jet_multirole_equipment_3_short:0 "Sabre Mk.5"
 WGR_jet_multirole_equipment_3_desc:0 "Le Canadair Sabre Mk.5, l'avant-dernière variante. Il était équipé d'un moteur Orenda à deux étages développant 7 275 lb (3 302 kg) de poussée statique. Ses performances en altitude et son taux de montée ont été améliorés par rapport au Mk 5 et le rétablissement des lamelles du bord d'attaque de l'aile lui a conféré d'excellentes caractéristiques à basse vitesse."
 WGR_jet_multirole_equipment_4:0 "Canadair CL-13 Sabre Mark 6"
 WGR_jet_multirole_equipment_4_short:0 "Sabre Mk.6"
 WGR_jet_multirole_equipment_4_desc:0 "Le Canadair Sabre Mk.6 est considéré comme le « meilleur » Sabre de production jamais construit. Avec points d'attache de montage pour les AIM-9B Sidewinders."
 WGR_jet_multirole_equipment_5:0 "Chasseur stellaire Lockheed F-104G"
 WGR_jet_multirole_equipment_5_short:0 "Chasseur stellaire F-104G"
 WGR_jet_multirole_equipment_6:0 "Lockheed F-104G Starfighter (ZU)"
 WGR_jet_multirole_equipment_6_short:0 "Chasseur stellaire F-104G (ZU)"
 WGR_jet_multirole_equipment_6_desc:0 "Le « Zuverlässigkeits-Upgrade » ou « Mise à niveau de la fiabilité » a été lancé en 1966, lorsque l'ensemble de la flotte de F-104 a été immobilisée au sol en raison d'accidents. Les ailes ont été renforcées parallèlement à une mise à niveau avionique avant que la flotte de F-104 puisse à nouveau voler."
 WGR_jet_multirole_equipment_7:0 "McDonnell Douglas F-4F Phantom II (début) "
 WGR_jet_multirole_equipment_7_short:0 "F-4F Phantom II (début)"
 WGR_jet_multirole_equipment_7_desc:0 "Pour remplacer le F-104G vieillissant pour la supériorité aérienne, la Luftwaffe commanda 175 F-4F Phantom dans le cadre du programme Peace Rhine en 1968. Les premiers d'entre eux furent livrés en septembre 1973. Les F-4F Phantom initiaux subirent de nombreuses modifications par rapport au F-4E Phantom dont la suppression de nombreux composants jugés inutiles, le but étant d'alléger la cellule. Le F4F n'avait pas de capacité Sparrow."
 WGR_jet_multirole_equipment_8:0 "McDonnell Douglas F-4F Phantom II"
 WGR_jet_multirole_equipment_8_short:0 "F-4F Fantôme II"
 WGR_jet_multirole_equipment_8_desc:0 "Package de mise à jour fourni par MBB (Messerschmitt-Bölkow-Blohm). Des dispositions permettant de transporter de meilleures armes ainsi qu'une révision du moteur et une nouvelle avionique faisaient partie de la mise à niveau."
 WGR_jet_multirole_equipment_9:0 "McDonnell Douglas F-4F Phantom II Paix Rhin"
 WGR_jet_multirole_equipment_9_short:0 "F-4F Phantom II PR"
 WGR_jet_multirole_equipment_9_desc:0 "La Luftwaffe s'est rapidement rendu compte que la réduction des capacités avait été beaucoup trop drastique avec le F-4F d'origine et a pris des mesures pour résoudre le problème. Le premier F-4F Phantom amélioré a été rendu à la Luftwaffe en 1980 et le dernier en 1983. Ces améliorations comprenaient : Restauration de la capacité de ravitaillement en vol. Capacités de transporter des armes guidées telles que l'AGM-65 Maverick. Électronique pour transporter et tirer l'AIM-9L ; Les premiers F-4F étaient limités à la licence produite AIM-9B. AN/ALQ-131 Jammer pod et ajout de distributeurs de paillettes."
 WGR_jet_multirole_equipment_10:0 "McDonnell Douglas F-4F Phantom II KWS"
 WGR_jet_multirole_equipment_10_short:0 "F-4F Phantom II KWS"
 WGR_jet_multirole_equipment_10_desc:0 "Le F-4F ICE (Improved Combat Effectiveness) ou KWS (KampfWertSteigerung) a vu le jour au début des années 1990. Le dernier avion a été modernisé en 1998. Le programme KWS impliquait le transport de l'AIM-120 AMRAAM ainsi que le remplacement de l'ancien radar Hughes AN/APQ-120 par le radar à impulsions-doppler Hughes AN/APG-65GY. L'AN/APG-65 avait été initialement développé pour le F/A-18 Hornet et était nécessaire pour utiliser l'AMRAAM. La mise à niveau comprenait également, sans toutefois s'y limiter, une nouvelle avionique, telle qu'un écran de cockpit moderne, un nouvel IFF et, plus tard, un AN/ALR-68 RWR amélioré."

 WGR_mr_stealth_fighter_equipment_1:0 "Eurofighter Typhoon"
 WGR_mr_stealth_fighter_equipment_1_short:0 "Typhon"
 
