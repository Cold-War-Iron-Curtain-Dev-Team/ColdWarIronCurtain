 SPR_jet_light_equipment_1:0 "Hispano HA-100"
 SPR_jet_light_equipment_1_short:0 "HA-100 Triana"
 SPR_jet_light_equipment_1_desc:0 "L'Hispano HA-100 Triana (du nom du quartier de Séville où se trouvait l'usine Hispano Aviación) était un avion d'entraînement militaire développé en Espagne dans les années 1950. Premier avion conçu par Willy Messerschmitt après la Seconde Guerre mondiale, il s'agissait d'un monoplan cantilever conventionnel à ailes basses avec train d'atterrissage tricycle rétractable"
 SPR_jet_light_equipment_2:0 "Hispano HA-200"
 SPR_jet_light_equipment_2_short:0 "HA-200"
 SPR_jet_light_equipment_2_desc:0 "L'Hispano HA-200 Saeta était un avion d'entraînement avancé biplace conçu et produit par l'avionneur espagnol Hispano Aviación. Il a la particularité d'être le premier avion espagnol à exploiter la propulsion à réaction."
 SPR_jet_light_equipment_3:0 "Combattant de la liberté CASA SF-5A"
 SPR_jet_light_equipment_3_short:0 "Chasseur de la liberté SF-5A"
 SPR_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de combat léger destiné principalement à l'exportation. Il est plus léger et moins cher à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour remplacer les escadrons de chasseurs à courte portée. Malgré cela, ce type s'est avéré assez agile et était l'avion le plus proche pour rivaliser avec le MiG-21 « Fishbed » soviétique. Parce qu'il a été utilisé par la majorité des alliés de l'Amérique au plus fort de la guerre froide, il a été appelé à juste titre « Freedom Fighter »."
 SPR_jet_light_equipment_4:0 "Combattant de la liberté CASA SF-5B"
 SPR_jet_light_equipment_4_short:0 "Chasseur de la liberté SF-5B"
 SPR_jet_light_equipment_4_desc:0 "L'avion américain Northrop F-5B Freedom Fighter utilisé par la Royal Norwegian Airforco. Principalement utilisé comme entraîneur d'introduction pour d'autres avions à réaction multirôles, il disposait de points d'attache pour les ordonnances."
 SPR_jet_light_equipment_5:0 "CASA C-101 Aviojet"
 SPR_jet_light_equipment_5_short:0 "C-101 Aviojet"
 SPR_jet_light_equipment_5_desc:0 "Le CASA C-101 Aviojet est un avion d'entraînement avancé et d'attaque léger monomoteur à réaction à aile basse conçu et fabriqué par la compagnie aéronautique espagnole Construcciones Aeronáuticas SA (CASA). "

