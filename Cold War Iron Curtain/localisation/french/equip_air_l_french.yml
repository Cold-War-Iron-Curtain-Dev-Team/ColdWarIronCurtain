 #Helicopters HOL

 HOL_naval_helicopter_equipment_1:0 "Sikorsky S-51 ASW"
 HOL_naval_helicopter_equipment_1_short:0 "Sikorsky S-51 ASW"
 HOL_naval_helicopter_equipment_1_desc:0 "Le HTL était un hélicoptère léger monomoteur à rotor unique dérivé du Bell 47A civil. Acquis par l'US Navy en 1947, le HTL-4 (la variante désignée par la Navy) se distinguait de ceux utilisés par les autres branches par le retrait du revêtement en tissu sur la poutre de queue. Sinon, il conserve bon nombre de ses caractéristiques, y compris la verrière distinctive en forme de « bulle de savon » offrant au pilote une large vue. Plus tard désigné TH-13L. Son surnom, qui vient du nom des hélicoptères des tribus amérindiennes, est « Sioux »."
 HOL_naval_helicopter_equipment_2:0 "Sikorsky SH-34G Seabat"
 HOL_naval_helicopter_equipment_2_short:0 "SH-34G Bat-marin"
