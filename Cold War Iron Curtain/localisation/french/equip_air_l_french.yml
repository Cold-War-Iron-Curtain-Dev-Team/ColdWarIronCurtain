 CAN_utility_helicopter_equipment_1:0 "Sikorsky CH-126 Choctaw"
 CAN_utility_helicopter_equipment_1_short:0 "CH-126"
 CAN_utility_helicopter_equipment_2:0 "Bell CUH-1A Iroquois"
 CAN_utility_helicopter_equipment_2_short:0 "CUH-1A Iroquois"
 CAN_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."
 CAN_utility_helicopter_equipment_3:0 "Bell CUH-1D Iroquois"
 CAN_utility_helicopter_equipment_3_short:0 "CUH-1D Iroquois"
 CAN_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 CAN_utility_helicopter_equipment_4:0 "Bell CH-118 Huey"
 CAN_utility_helicopter_equipment_4_short:0 "CH-118"
 CAN_utility_helicopter_equipment_4_desc:0 "fr ont été vendus au Canada pour être utilisés sous la désignation CUH-1H, le premier étant livré le 6 mars 1968. Ils ont été évalués par les Forces canadiennes et jugés impropres à une utilisation tactique canadienne, ce qui a conduit le gouvernement canadien à parrainer le développement de la version bimoteur de « l'Hôtel », l'UH-1N Twin Huey. Les dix CUH-1H ont été rééquipés pour la recherche et le sauvetage, rebaptisés CH-118."
 CAN_utility_helicopter_equipment_5:0 "Bell CH-135 Twin Huey"
 CAN_utility_helicopter_equipment_5_short:0 "CH-135"
 CAN_utility_helicopter_equipment_5_desc:0 "Le Bell UH-1N Twin Huey est un hélicoptère militaire moyen conçu et produit par le constructeur aérospatial américain Bell Helicopter. Il fait partie de la vaste famille Huey, la version initiale était le CUH-1N Twin Huey (plus tard CH-135 Twin Huey), qui a été commandé pour la première fois par les Forces canadiennes en 1968."
 CAN_utility_helicopter_equipment_6:0 "Bell CH-146 Griffon UTTH"
 CAN_utility_helicopter_equipment_6_short:0 "CH-146 Griffon UTTH"
 CAN_utility_helicopter_equipment_6_desc:0 "Le Bell CH-146 Griffon est un hélicoptère utilitaire polyvalent conçu par Bell Helicopter Textron comme une variante du Bell 412EP pour les Forces armées canadiennes. Le CH-146 est utilisé dans une grande variété de rôles, notamment en matière de puissance de feu aérienne, de reconnaissance, de recherche et de sauvetage et d'aéromobilité."
 CAN_utility_helicopter_equipment_7:0 "Mise à jour de mi-vie du Bell CH-146 Griffon"
 CAN_utility_helicopter_equipment_7_short:0 "CH-146 Griffon MLU"
 CAN_utility_helicopter_equipment_7_desc:0 "Le Bell CH-146 Griffon est un hélicoptère utilitaire polyvalent conçu par Bell Helicopter Textron comme une variante du Bell 412EP pour les Forces armées canadiennes. Le CH-146 est utilisé dans une grande variété de rôles, notamment en matière de puissance de feu aérienne, de reconnaissance, de recherche et de sauvetage et d'aéromobilité."

 CAN_cargo_helicopter_equipment_1:0 "Piasecki CH-127"
 CAN_cargo_helicopter_equipment_1_short:0 "CH-127"
 CAN_cargo_helicopter_equipment_2:0 "Vertol CH-113A Voyageur"
 CAN_cargo_helicopter_equipment_2_short:0 "CH-113A"
 #CAN_cargo_helicopter_equipment_3:0 ""
