 POR_jet_CAS_equipment_1:0 "AT-16 Harvard Mk. Nord-américain. III"
 POR_jet_CAS_equipment_1_short:0 "AT-16 Harvard Mk.. III"
 POR_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 POR_jet_CAS_equipment_2:0 "République F-84G Thunderjet"
 POR_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 POR_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."

 POR_jet_CAS_equipment_6:0 "LTV A-7D Corsaire II"
 POR_jet_CAS_equipment_6_short:0 "A-7D Corsaire II"
 POR_jet_CAS_equipment_6_desc:0 "Version construite pour l'USAF, avec un turboréacteur Allison TF41-A-1 et un seul canon rotatif M61 Vulcan de 20 mm ; Le radar de navigation AN/APN-153 des modèles précédents est remplacé par le radar de navigation AN/APN-185, le radar de suivi de terrain AN/APQ-116 du précédent A-7B/C est remplacé par le radar de suivi de terrain AN/APQ-126."
 POR_jet_CAS_equipment_7:0 "LTV A-7P Corsaire II"
 POR_jet_CAS_equipment_7_short:0 "A-7P Corsaire II"
 POR_jet_CAS_equipment_7_desc:0 "Version spécialement construite pour le FAP portugais, avec un turboréacteur Allison TF41-A-1 et un seul canon rotatif M61 Vulcan de 20 mm ; Le radar de navigation AN/APN-153 des modèles précédents est remplacé par le radar de navigation AN/APN-185, le radar de suivi de terrain AN/APQ-116 du précédent A-7B/C est remplacé par le radar de suivi de terrain AN/APQ-126."

