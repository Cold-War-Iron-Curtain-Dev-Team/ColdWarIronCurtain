 cruisemissile_equipment_3_desc:0 "Un LACM ou missile de croisière d'attaque terrestre de quatrième génération avec une vitesse élevée, une bonne charge utile et une capacité à reconnaître une cible en mouvement."
 cruisemissile_equipment_4:0 "Missile de croisière d'attaque terrestre V"
 cruisemissile_equipment_4_short:0 "Missile de croisière V"
