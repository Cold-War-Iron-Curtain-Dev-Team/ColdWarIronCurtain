 #CAS
 jet_cas:0 "Jet CAS"
 jet_CAS_equipment:0 "Appui aérien rapproché Jet"
 jet_CAS_equipment_1:0 "Appui aérien rapproché I"
 jet_CAS_equipment_1_short:0 "Jet CAS I"
 jet_CAS_equipment_1_desc:0 "Avion d'attaque léger doté de munitions air-sol avec une mission spécifique d'appui aérien rapproché pour les troupes au sol."
 jet_CAS_equipment_2:0 "Appui aérien rapproché II"
 jet_CAS_equipment_2_short:0 "Jet CAS II"
 jet_CAS_equipment_2_desc:0 "Un avion d'attaque léger mis à jour avec des munitions air-sol avec une mission spécifique d'appui aérien rapproché pour les troupes au sol."
 jet_CAS_equipment_3:0 "Appui aérien rapproché Jet III"
 jet_CAS_equipment_3_short:0 "Jet CAS III"
 jet_CAS_equipment_3_desc:0 "Un avion d'appui aérien rapproché de deuxième génération doté de capacités air-sol dédiées."
 jet_CAS_equipment_4:0 "Appui aérien rapproché Jet IV"
 jet_CAS_equipment_4_short:0 "Jet CAS IV"
 jet_CAS_equipment_4_desc:0 "Un avion d'appui aérien rapproché de troisième génération doté de capacités air-sol étendues et de systèmes de navigation et d'attaque de base."
 jet_CAS_equipment_5:0 "Appui aérien rapproché Jet V"
 jet_CAS_equipment_5_short:0 "Jet CAS V"
 jet_CAS_equipment_5_desc:0 "Un avion d'appui aérien rapproché de troisième génération doté de capacités air-sol étendues, de systèmes de navigation par bus de données et d'acquisition de cibles mis à jour."
 jet_CAS_equipment_6:0 "Appui aérien rapproché Jet VI"
 jet_CAS_equipment_6_short:0 "Jet CAS VI"
 jet_CAS_equipment_6_desc:0 "Un avion d'appui aérien rapproché de troisième génération doté de capacités air-sol avancées, de systèmes de navigation et d'acquisition de cibles, notamment des désignateurs FLIR et laser de base."
 jet_CAS_equipment_7:0 "Appui aérien rapproché VII"
 jet_CAS_equipment_7_short:0 "Jet CAS VII"
 jet_CAS_equipment_7_desc:0 "Un avion d'appui aérien rapproché de quatrième génération doté de capacités étendues, notamment des désignateurs laser, des systèmes de localisation GPS et des commandes de vol électriques."
 jet_CAS_equipment_8:0 "Appui aérien rapproché à réaction VIII"
 jet_CAS_equipment_8_short:0 "Jet CAS VIII"
 jet_CAS_equipment_8_desc:0 "Un avion d'appui aérien rapproché de quatrième génération doté d'armements étendus et de capacités accrues, notamment des désignateurs laser, des systèmes de localisation GPS, des commandes de vol électriques et des équipements FLIR et de vol de nuit avancés."

 cas_stealth_equipment_1:0 "Appui aérien rapproché furtif"
 cas_stealth_equipment_1_short:0 "CAS furtif"
 cas_stealth_equipment_1_desc:0 "Un avion d'appui aérien rapproché de cinquième ou cinquième génération intégrant des composants furtifs pour une visibilité et une section transversale réduites."

 #Light Jet
 jet_light_equipment_1:0 "Jet léger de génération 1"
 jet_light_equipment_1_short:0 "Jet léger de génération 1"
 jet_light_equipment_1_desc:0 "Une première génération d'avions légers, souvent proches des avions d'entraînement, destinés à des missions de frappe légère ou de défense aérienne."
 jet_light_equipment_2:0 "Jet léger de génération 2"
 jet_light_equipment_2_short:0 "Jet léger de génération 2"
 jet_light_equipment_2_desc:0 "Une deuxième génération d'avions légers, souvent étroitement liés aux avions d'entraînement, destinés à des missions de frappe légère ou de défense aérienne."
 jet_light_equipment_3:0 "Jet léger de génération 3"
 jet_light_equipment_3_short:0 "Jet léger de génération 3"
 jet_light_equipment_3_desc:0 "Une troisième génération d'avions tactiques légers, peu coûteux à produire mais dotés d'armes légères pour les missions air-air et air-sol."
 jet_light_equipment_4:0 "Jet léger de génération 3++"
 jet_light_equipment_4_short:0 "Jet léger Gen 3++"
 jet_light_equipment_4_desc:0 "Une troisième génération d'avions tactiques légers, peu coûteux à produire mais dotés d'armes légères pour les missions air-air et air-sol."
 jet_light_equipment_5:0 "Jet léger de génération 4+"
 jet_light_equipment_5_short:0 "Jet léger génération 4+"
 jet_light_equipment_5_desc:0 "Une quatrième génération d'avions légers dotés de capteurs et d'un radar performants et armés d'armes légères pour les missions air-air et air-sol."

 #Multirole
 jet_multirole_equipment:0 "Jet multirôle"
 jet_multirole_equipment_1:0 "Chasseur multirôle de génération 1"
 jet_multirole_equipment_1_short:0 "Génération 1 multirôle"
 jet_multirole_equipment_1_desc:0 "Les augmentations de vitesse précédentes ne sont rien en comparaison avec l'introduction des premiers chasseurs à réaction. Bien que nous n'ayons pas encore appris comment construire au mieux des avions équipés de ces moteurs, les avions de combat réguliers ne peuvent pas rivaliser."
 jet_multirole_equipment_2:0 "Combattant multirôle de génération 1+"
 jet_multirole_equipment_2_short:0 "Génération 1+ Multirôle"
 jet_multirole_equipment_2_desc:0 "L'introduction de l'aile en flèche permet d'atteindre des vitesses transsoniques, mais la contrôlabilité est encore souvent limitée à de telles vitesses. Ces avions visaient généralement un rôle de supériorité aérienne."
 jet_multirole_equipment_3:0 "Chasseur multirôle de génération 2"
 jet_multirole_equipment_3_short:0 "Multirôle Gen 2"
 jet_multirole_equipment_3_desc:0 "La guerre de Corée de 1950-1953 a obligé à repenser profondément la situation. Les canons se sont révélés inadaptés à des vitesses aussi élevées, tandis que la nécessité d'une capacité multirôle en soutien sur le champ de bataille a été redécouverte. Les types d'intercepteurs apparus après la guerre utilisaient des moteurs à postcombustion pour donner des performances à Mach 2, tandis que les missiles radar et infrarouges amélioraient considérablement leur précision et leur puissance de feu."
 jet_multirole_equipment_4:0 "Combattant multirôle de génération 2+"
 jet_multirole_equipment_4_short:0 "Génération 2+ multirôle"
 jet_multirole_equipment_4_desc:0 "Une nouvelle expansion des capacités serait nécessaire pour les avions de deuxième génération nécessitant une approche plus polyvalente. Points d'attache supplémentaires, affûtage des ailes et première introduction de conceptions d'ailes delta."
 jet_multirole_equipment_5:0 "Chasseur multirôle de génération 3"
 jet_multirole_equipment_5_short:0 "Multirôle Gen 3"
 jet_multirole_equipment_5_desc:0 "La prochaine génération de chasseurs a été conçue dès le départ pour être multirôle. Ils devaient transporter une large gamme d'armes et d'autres munitions telles que des missiles air-sol et des bombes à guidage laser, tout en étant également capables de procéder à des interceptions air-air au-delà de la portée visuelle. Leur avionique de soutien comprenait un radar à impulsions Doppler, des systèmes de ciblage hors vue et d'avertissement de terrain."
 jet_multirole_equipment_6:0 "Combattant multirôle de génération 3+"
 jet_multirole_equipment_6_short:0 "Génération 3+ multirôle"
 jet_multirole_equipment_6_desc:0 "L'avènement de turboréacteurs à double flux plus économiques a entraîné une autonomie et des temps de sortie étendus, tandis qu'une poussée accrue ne pouvait que partiellement offrir de meilleures performances et une meilleure maniabilité sur toute la plage de vitesse. Certains concepteurs ont eu recours à la géométrie variable ou à la poussée vectorielle pour tenter de concilier ces opposés."
 jet_multirole_equipment_7:0 "Combattant multirôle de génération 3++"
 jet_multirole_equipment_7_short:0 "Génération 3++ Multirôle"
 jet_multirole_equipment_7_desc:0 "Poursuite de l'expansion des ailes à géométrie variable, de nouvelles extensions de portée et des radars et contrôles de tir améliorés afin de suivre les progrès technologiques rapides vers la 4e génération d'avions de combat."
 jet_multirole_equipment_8:0 "Chasseur multirôle de génération 4"
 jet_multirole_equipment_8_short:0 "Génération 4 multirôle"
 jet_multirole_equipment_8_desc:0 "Suite aux succès mitigés de la génération multirôle, des technologies avancées ont été développées, telles que le vol électrique, les matériaux composites, les rapports poussée/poids supérieurs à l'unité, l'hypermanoeuvrabilité, l'avionique numérique avancée et les capteurs tels que le radar synthétique et la recherche et le suivi infrarouge, et la furtivité."
 jet_multirole_equipment_9:0 "Combattant multirôle de génération 4+"
 jet_multirole_equipment_9_short:0 "Génération 4+ multirôle"
 jet_multirole_equipment_9_desc:0 "Alors que la génération précédente apparaissait fragmentaire, les concepteurs sont revenus avant tout au chasseur, mais avec des rôles de soutien définis au fur et à mesure des développements anticipés. Une maniabilité encore plus extrême avec respectivement des tuyères d'échappement renforcées pour le viffing (vectorisation en vol avant) et le contrôle des manoeuvres aux angles d'attaque élevés."
 jet_multirole_equipment_10:0 "Combattant multirôle de génération 4++"
 jet_multirole_equipment_10_short:0 "Génération 4++ Multirôle"
 jet_multirole_equipment_10_desc:0 "Les variantes ultérieures de ces avions et d'autres ont progressivement amélioré leurs technologies caractéristiques et incorporé de plus en plus des aspects les uns des autres, tout en adoptant certaines technologies émergentes de cinquième génération telles que les communications numériques à haute capacité. Ces chasseurs sont aussi proches que possible d'un avion entièrement numérique et avancé sans caractéristiques furtives avancées."
 
 mr_stealth_fighter_equipment_1:0 "Chasseur multirôle de génération 5"
 mr_stealth_fighter_equipment_1_short:0 "Génération 5 multirôle"
 mr_stealth_fighter_equipment_1_desc:0 "La génération émergente d'avions de combat avancés au cours des premières décennies du 21e siècle est désormais connue sous le nom de cinquième génération. Les caractéristiques déterminantes d'un tel chasseur de cinquième génération ne sont pas universellement acceptées et tous les types de cinquième génération ne les possèdent pas nécessairement toutes. Certains décomptes de générations incluent plus de cinq menant à la nouvelle génération émergente."

 #Interceptor
 jet_interceptor:0 "Chasseur de supériorité aérienne"
 jet_interceptor_equipment:0 "Chasseur de supériorité aérienne"
 jet_interceptor_equipment_1:0 "Chasseur de supériorité aérienne de génération 1"
 jet_interceptor_equipment_1_short:0 "FSA de 1ère génération"
 jet_interceptor_equipment_1_desc:0 "Les augmentations de vitesse précédentes ne sont rien en comparaison avec l'introduction des intercepteurs. Bien que nous n'ayons pas encore appris comment construire au mieux des avions équipés de ces moteurs, les intercepteurs classiques ne peuvent pas rivaliser."
 jet_interceptor_equipment_2:0 "Chasseur de supériorité aérienne de génération 1+"
 jet_interceptor_equipment_2_short:0 "PPA de génération 1+"
 jet_interceptor_equipment_2_desc:0 "L'introduction de l'aile en flèche permet d'atteindre des vitesses transsoniques, mais la contrôlabilité est encore souvent limitée à de telles vitesses. Ces avions visaient généralement un rôle de supériorité aérienne."
 jet_interceptor_equipment_3:0 "Chasseur de supériorité aérienne de génération 2"
 jet_interceptor_equipment_3_short:0 "FSA de génération 2"
 jet_interceptor_equipment_3_desc:0 "La guerre de Corée de 1950-1953 a obligé à repenser profondément la situation. Les canons se sont révélés inadaptés à des vitesses aussi élevées, tandis que la nécessité d'une capacité multirôle en soutien sur le champ de bataille a été redécouverte. Les types d'intercepteurs apparus après la guerre utilisaient des moteurs à postcombustion pour donner des performances à Mach 2, tandis que les missiles radar et infrarouges amélioraient considérablement leur précision et leur puissance de feu."
 jet_interceptor_equipment_4:0 "Chasseur de supériorité aérienne de génération 2+"
 jet_interceptor_equipment_4_short:0 "PPA de génération 2+"
 jet_interceptor_equipment_4_desc:0 "Une nouvelle expansion des capacités serait nécessaire pour les avions de deuxième génération. Des points d'attache supplémentaires, l'affûtage des ailes et la première introduction de conceptions d'ailes delta commencent à devenir la norme."
 jet_interceptor_equipment_5:0 "Chasseur de supériorité aérienne de génération 3"
 jet_interceptor_equipment_5_short:0 "FSA de génération 3"
 jet_interceptor_equipment_5_desc:0 "La prochaine génération d'intercepteurs à longue portée. Ils devaient transporter une large gamme d'armes et d'autres munitions telles que des missiles air-air, ainsi qu'une capacité de ciblage au-delà de la portée visuelle. Leur avionique de soutien comprenait un radar à impulsions Doppler, des systèmes de ciblage hors vue et d'avertissement de terrain."
 jet_interceptor_equipment_6:0 "Chasseur de supériorité aérienne de génération 3+"
 jet_interceptor_equipment_6_short:0 "PPA de génération 3+"
 jet_interceptor_equipment_6_desc:0 "L'avènement de turboréacteurs à double flux plus économiques a entraîné une autonomie et des temps de sortie étendus, tandis qu'une poussée accrue ne pouvait que partiellement offrir de meilleures performances et une meilleure maniabilité sur toute la plage de vitesse. Certains concepteurs ont eu recours à la géométrie variable ou à la poussée vectorielle pour tenter de concilier ces opposés."
 jet_interceptor_equipment_7:0 "Chasseur de supériorité aérienne de génération 3++"
 jet_interceptor_equipment_7_short:0 "ASF de génération 3++"
 jet_interceptor_equipment_7_desc:0 "Poursuite de l'expansion des ailes à géométrie variable, de nouvelles extensions de portée et des radars et contrôles de tir améliorés afin de suivre les progrès technologiques rapides vers la 4e génération d'avions de combat."
 jet_interceptor_equipment_8:0 "Chasseur de supériorité aérienne de génération 4"
 jet_interceptor_equipment_8_short:0 "FSA de génération 4"
 jet_interceptor_equipment_8_desc:0 "Suite aux succès mitigés de la génération précédente d'intercepteurs, des technologies avancées ont été développées, telles que le vol électrique, les matériaux composites, les rapports poussée/poids supérieurs à l'unité, l'hypermanoeuvrabilité, l'avionique numérique avancée et les capteurs tels que le radar synthétique et la recherche et la poursuite infrarouge, et la furtivité."
 jet_interceptor_equipment_9:0 "Chasseur de supériorité aérienne de génération 4+"
 jet_interceptor_equipment_9_short:0 "PPA de génération 4+"
 jet_interceptor_equipment_9_desc:0 "Alors que la génération précédente apparaissait fragmentaire, les concepteurs sont revenus avant tout au chasseur, mais avec des rôles de soutien définis au fur et à mesure des développements anticipés. Une maniabilité encore plus extrême avec respectivement des tuyères d'échappement renforcées pour le viffing (vectorisation en vol avant) et le contrôle des manoeuvres aux angles d'attaque élevés."

 stealth_fighter_equipment_1:0 "Chasseur de supériorité aérienne de génération 5"
 stealth_fighter_equipment_1_short:0 "FSA de génération 5"
 stealth_fighter_equipment_1_desc:0 "La génération émergente d'avions intercepteurs avancés au cours des premières décennies du 21e siècle est désormais connue sous le nom de cinquième génération. Les caractéristiques déterminantes de ces intercepteurs de cinquième génération ne sont pas universellement acceptées et tous les types de cinquième génération ne les possèdent pas nécessairement toutes. Certains décomptes de générations incluent plus de cinq menant à la nouvelle génération émergente."
 
 #High-Mach Interceptor
 high_mach_jet_interceptor_equipment_1:0 "Intercepteur à réaction à grande vitesse I"
 high_mach_jet_interceptor_equipment_1_short:0 "Intercepteur HS I"
 high_mach_jet_interceptor_equipment_1_desc:0 "Capable de Mach 2, les bombardiers ennemis choisissant de voler de plus en plus haut afin de livrer des munitions, un nouveau type d'avion intercepteur est nécessaire pour voler plus haut et plus vite qu'auparavant."
 high_mach_jet_interceptor_equipment_2:0 "Intercepteur à réaction à grande vitesse II"
 high_mach_jet_interceptor_equipment_2_short:0 "Intercepteur HS II"
 high_mach_jet_interceptor_equipment_2_desc:0 "Capable de Mach 2+, un intercepteur à haute altitude encore plus rapide, conçu spécifiquement pour se prémunir contre les bombardiers à longue portée et volant à haute altitude."
 high_mach_jet_interceptor_equipment_3:0 "Intercepteur à réaction à grande vitesse III"
 high_mach_jet_interceptor_equipment_3_short:0 "Intercepteur HS III"
 high_mach_jet_interceptor_equipment_3_desc:0 "Intercepteur à haute altitude capable de Mach 3. Conçu spécifiquement pour le rôle d'interception défensive contre un avion ennemi attaquant, en particulier les bombardiers et les avions de reconnaissance. Les avions de ce type sont parfois appelés intercepteurs à grande vitesse."
 high_mach_jet_interceptor_equipment_4:0 "Intercepteur à réaction à grande vitesse IV"
 high_mach_jet_interceptor_equipment_4_short:0 "Intercepteur HS IV"
 high_mach_jet_interceptor_equipment_4_desc:0 "Intercepteur à haute altitude capable de Mach 3+. Conçu spécifiquement pour le rôle d'interception défensive contre un avion ennemi attaquant, en particulier les bombardiers et les avions de reconnaissance. Les avions de ce type sont parfois appelés intercepteurs avancés à grande vitesse."

 #Recon Plane
 recon_equipment_0:0 "Avion de reconnaissance I"
 recon_equipment_0_short:0 "Avion de reconnaissance I"
 recon_equipment_0_desc:0 "Être capable d'observer un champ de bataille depuis les airs est une capacité clé qui a déjà pris son envol pendant la Première Guerre mondiale. La Seconde Guerre mondiale allait s'étendre sur cette capacité avec des avions légers dédiés capables d'observer un champ de bataille pendant de longues périodes."
 jet_recon_equipment_0:0 "Avion de reconnaissance II"
 jet_recon_equipment_0_short:0 "Avion de reconnaissance II"
 jet_recon_equipment_0_desc:0 "Alors que les avions de reconnaissance rejoignent l'ère des avions à réaction, des performances plus élevées, des temps de flânerie plus longs et une meilleure visibilité sont nécessaires."
 jet_recon_equipment_1:0 "Avion de reconnaissance III"
 jet_recon_equipment_1_short:0 "Avion de reconnaissance III"
 jet_recon_equipment_1_desc:0 "Conçus pour les opérations à grande vitesse et à basse altitude, les avions de ce type sont équipés de caméras montées sur le nez, capables de cartographier rapidement une zone."
 jet_recon_equipment_2:0 "Avion de reconnaissance IV"
 jet_recon_equipment_2_short:0 "Avion de reconnaissance IV"
 jet_recon_equipment_2_desc:0 "Partageant des pièces avec les avions multirôles de leur époque, ces avions sont conçus avec des caméras intégrées montées sur le nez ou capables de monter une nacelle de reconnaissance capable de cartographier une zone."

 #CV Multirole
 cv_jet_multirole_equipment:0 "CV Combattant multirôle"
 cv_jet_multirole_equipment_1:0 "Chasseur multirôle Carrier Generation 1"
 cv_jet_multirole_equipment_1_short:0 "CV Gen 1 Multirôle"
 cv_jet_multirole_equipment_1_desc:0 "Les augmentations de vitesse précédentes ne sont rien en comparaison avec l'introduction des premiers chasseurs à réaction navals. Bien que nous n'ayons pas encore appris comment construire au mieux des avions équipés de ces moteurs, les avions de combat réguliers ne peuvent pas rivaliser."
 cv_jet_multirole_equipment_2:0 "Chasseur multirôle Carrier Generation 1+"
 cv_jet_multirole_equipment_2_short:0 "CV Gen 1+ Multirôle"
 cv_jet_multirole_equipment_2_desc:0 "L'introduction de l'aile en flèche permet d'atteindre des vitesses transsoniques, mais la contrôlabilité est encore souvent limitée à de telles vitesses. Ces avions visaient généralement un rôle de supériorité aérienne."
 cv_jet_multirole_equipment_3:0 "Chasseur multirôle Carrier Generation 2"
 cv_jet_multirole_equipment_3_short:0 "CV Gen 2 Multirôle"
 cv_jet_multirole_equipment_3_desc:0 "La guerre de Corée de 1950-1953 a obligé à repenser profondément la situation. Les canons se sont révélés inadaptés à des vitesses aussi élevées, tandis que la nécessité d'une capacité multirôle en soutien sur le champ de bataille a été redécouverte. Les types d'intercepteurs apparus après la guerre utilisaient des moteurs à postcombustion pour donner des performances à Mach 2, tandis que les missiles radar et infrarouges amélioraient considérablement leur précision et leur puissance de feu."
 cv_jet_multirole_equipment_4:0 "Chasseur multirôle Carrier Generation 2+"
 cv_jet_multirole_equipment_4_short:0 "CV Gen 2+ Multirôle"
 cv_jet_multirole_equipment_4_desc:0 "Une nouvelle expansion des capacités serait nécessaire pour les avions navals de deuxième génération, exigeant une approche plus polyvalente. Points d'attache supplémentaires, affûtage des ailes et première introduction de conceptions d'ailes delta."
 cv_jet_multirole_equipment_5:0 "Chasseur multirôle Carrier Generation 3"
 cv_jet_multirole_equipment_5_short:0 "CV Gen 3 Multirôle"
 cv_jet_multirole_equipment_5_desc:0 "La prochaine génération d'intercepteurs à longue portée. Ils devaient transporter une large gamme d'armes et d'autres munitions telles que des missiles air-air, ainsi qu'une capacité de ciblage au-delà de la portée visuelle. Leur avionique de soutien comprenait un radar à impulsions Doppler, des systèmes de ciblage hors vue et d'avertissement de terrain."
 cv_jet_multirole_equipment_6:0 "Chasseur multirôle Carrier Generation 3+"
 cv_jet_multirole_equipment_6_short:0 "CV Gen 3+ Multirôle"
 cv_jet_multirole_equipment_6_desc:0 "L'avènement de turboréacteurs à double flux plus économiques a entraîné une autonomie et des temps de sortie étendus, tandis qu'une poussée accrue ne pouvait que partiellement offrir de meilleures performances et une meilleure maniabilité sur toute la plage de vitesse. Certains concepteurs ont eu recours à la géométrie variable ou à la poussée vectorielle pour tenter de concilier ces opposés."
 cv_jet_multirole_equipment_7:0 "Chasseur multirôle Carrier Generation 3++"
 cv_jet_multirole_equipment_7_short:0 "CV Gen 3++ Multirôle"
 cv_jet_multirole_equipment_7_desc:0 "Poursuite de l'expansion des ailes à géométrie variable, de nouvelles extensions de portée et des radars et contrôles de tir améliorés afin de suivre le rythme des progrès technologiques rapides vers la 4e génération d'avions de combat navals."
 cv_jet_multirole_equipment_8:0 "Chasseur multirôle Carrier Generation 4"
 cv_jet_multirole_equipment_8_short:0 "CV Gen 4 Multirôle"
 cv_jet_multirole_equipment_8_desc:0 "Suite aux succès mitigés de la génération précédente d'intercepteurs, des technologies avancées ont été développées, telles que le vol électrique, les matériaux composites, les rapports poussée/poids supérieurs à l'unité, l'hypermanoeuvrabilité, l'avionique numérique avancée et les capteurs tels que le radar synthétique et la recherche et la poursuite infrarouge, et la furtivité."
 cv_jet_multirole_equipment_9:0 "Chasseur multirôle Carrier Generation 4+"
 cv_jet_multirole_equipment_9_short:0 "CV Gen 4+ Multirôle"
 cv_jet_multirole_equipment_9_desc:0 "Alors que la génération précédente apparaissait fragmentaire, les concepteurs sont revenus avant tout au chasseur, mais avec des rôles de soutien définis au fur et à mesure des développements anticipés. Une maniabilité encore plus extrême avec respectivement des tuyères d'échappement renforcées pour le viffing (vectorisation en vol avant) et le contrôle des manoeuvres aux angles d'attaque élevés."
 cv_jet_multirole_equipment_10:0 "Chasseur multirôle Carrier Generation 4++"
 cv_jet_multirole_equipment_10_short:0 "CV Gen 4++ Multirôle"
 cv_jet_multirole_equipment_10_desc:0 "Les variantes ultérieures de ces avions et d'autres ont progressivement amélioré leurs technologies caractéristiques et incorporé de plus en plus des aspects les uns des autres, tout en adoptant certaines technologies émergentes de cinquième génération telles que les communications numériques à haute capacité. Ces chasseurs sont aussi proches que possible d'un avion entièrement numérique et avancé sans caractéristiques furtives avancées."
 
 cv_mr_stealth_fighter_equipment_1:0 "Chasseur multirôle Carrier Generation 5"
 cv_mr_stealth_fighter_equipment_1_short:0 "CV Gen 5 Multirôle"
 cv_mr_stealth_fighter_equipment_1__desc:0 "La génération émergente d'avions embarqués avancés au cours des premières décennies du 21e siècle est connue sous le nom de cinquième génération. Les caractéristiques déterminantes de ces intercepteurs de cinquième génération ne sont pas universellement acceptées et tous les types de cinquième génération ne les possèdent pas nécessairement toutes. Certains décomptes de générations incluent plus de cinq menant à la nouvelle génération émergente."


 #CV CAS
 cv_jet_CAS_equipment_1:0 "Carrier Jet Appui aérien rapproché I"
 cv_jet_CAS_equipment_1_short:0 "CV Jet CAS II"
 cv_jet_CAS_equipment_1_desc:0 "Avion d'attaque léger navalisé doté de munitions air-sol avec une mission spécifique d'appui aérien rapproché pour les troupes au sol et les capacités air-navire."
 cv_jet_CAS_equipment_2:0 "Support aérien rapproché des avions porteurs II"
 cv_jet_CAS_equipment_2_short:0 "CV Jet CAS II"
 cv_jet_CAS_equipment_2_desc:0 "Un avion d'attaque léger navalisé mis à jour, doté de munitions air-sol, avec une mission spécifique d'appui aérien rapproché pour les troupes au sol et les capacités air-navire."
 cv_jet_CAS_equipment_3:0 "Appui aérien rapproché des avions porteurs III"
 cv_jet_CAS_equipment_3_short:0 "CV Jet CAS III"
 cv_jet_CAS_equipment_3_desc:0 "Une deuxième génération d'avions d'appui aérien rapproché naval doté de capacités air-sol et air-navire dédiées."
 cv_jet_CAS_equipment_4:0 "Appui aérien rapproché des avions porteurs IV"
 cv_jet_CAS_equipment_4_short:0 "CV Jet CAS IV"
 cv_jet_CAS_equipment_4_desc:0 "Une deuxième génération d'avions d'appui aérien rapproché naval dotés de capacités air-sol et air-navire dédiées et d'une mécanique de vol mise à jour."
 cv_jet_CAS_equipment_5:0 "Support aérien rapproché des avions porteurs V"
 cv_jet_CAS_equipment_5_short:0 "CV Jet CAS V"
 cv_jet_CAS_equipment_5_desc:0 "Un avion d'appui aérien rapproché de troisième génération doté de capacités air-sol et air-navire étendues, ainsi que de systèmes de navigation et d'attaque de base."
 cv_jet_CAS_equipment_6:0 "Support aérien rapproché des avions porteurs VI"
 cv_jet_CAS_equipment_6_short:0 "CV Jet CAS VI"
 cv_jet_CAS_equipment_6_desc:0 "Une troisième génération d'avions d'appui aérien rapproché naval doté de capacités air-sol et air-navire étendues, d'un bus de données mis à jour, de systèmes de navigation et d'acquisition de cibles."
 cv_jet_CAS_equipment_7:0 "Appui aérien rapproché des avions porteurs VII"
 cv_jet_CAS_equipment_7_short:0 "CV Jet CAS VII"
 cv_jet_CAS_equipment_7_desc:0 "Une troisième génération d'avions d'appui aérien rapproché naval dotés de capacités air-sol et air-navire avancées, de systèmes de navigation et d'acquisition de cibles comprenant des désignateurs FLIR et laser de base."
 cv_jet_CAS_equipment_8:0 "Appui aérien rapproché des avions porteurs VIII"
 cv_jet_CAS_equipment_8_short:0 "CV Jet CAS VIII"
 cv_jet_CAS_equipment_8_desc:0 "Une quatrième génération d'avions d'appui aérien rapproché naval doté de capacités étendues, notamment des désignateurs laser, des systèmes de localisation GPS et des commandes de vol électriques."
 cv_jet_CAS_equipment_9:0 "Appui aérien rapproché des avions porteurs IX"
 cv_jet_CAS_equipment_9_short:0 "CV Jet CAS IX"
 cv_jet_CAS_equipment_9_desc:0 "Un avion d'appui aérien rapproché de quatrième génération doté d'armements étendus et de capacités accrues, notamment des désignateurs laser, des systèmes de localisation GPS, des commandes de vol électriques et des équipements FLIR et de vol de nuit avancés."
 cv_jet_CAS_equipment_10:0 "Carrier Jet Close Air Support X"
 cv_jet_CAS_equipment_10_short:0 "CV Jet CAS X"
 cv_jet_CAS_equipment_10_desc:0 "Un avion d'appui aérien rapproché navalisé de quatrième génération avec des armements encore plus étendus et des capacités accrues, notamment des désignateurs laser, des systèmes de localisation GPS, des commandes de vol électriques et une furtivité de base."

 #VTOL Jet
 jump_jet_equipment_1:0 "Combattant VTOL I"
 jump_jet_equipment_1_short:0 "Combattant VTOL I"
 jump_jet_equipment_1_desc:0 "Présentation d'une nouvelle forme d'avion, un avion à décollage et atterrissage verticaux (VTOL) est un avion qui peut planer, décoller et atterrir verticalement sans dépendre d'une piste."
 jump_jet_equipment_2:0 "Combattant VTOL II"
 jump_jet_equipment_2_short:0 "Combattant VTOL II"
 jump_jet_equipment_2_desc:0 "Un avion à décollage et atterrissage vertical mis à jour avec des pièces plus standardisées, capable de devenir un pilier de l'aviation navale et même du soutien au sol."
 jump_jet_equipment_3:0 "Combattant VTOL III"
 jump_jet_equipment_3_short:0 "Combattant VTOL III"
 jump_jet_equipment_3_desc:0 "Avion à décollage et atterrissage vertical de deuxième génération. Voler avec un chargement d'armes plus important et une plus grande capacité de carburant."
 jump_jet_equipment_4:0 "Combattant VTOL IV"
 jump_jet_equipment_4_short:0 "Combattant VTOL IV"
 jump_jet_equipment_4_desc:0 "Une deuxième génération plus d'avions à décollage et atterrissage vertical avec une avionique plus avancée."
  
 jump_stealth_equipment_1:0 "Jet de saut furtif"
 jump_stealth_equipment_1_short:0 "Jet de saut furtif"
 jump_stealth_equipment_1_desc:0 "Un avion à décollage et atterrissage verticaux équipé de composants furtifs réduisant sa section efficace radar et pouvant être équipé d'un armement plus lourd grâce à sa conception de moteur plus avancée."

 ###HEAVY AIRCRAFT###

 #Naval Bomber
 nav_bomber_equipment_4:0 "Bombardier naval IV"
 nav_bomber_equipment_4_short:0 "Bombardier naval IV"
 nav_bomber_equipment_4_desc:0 "Un bombardier de patrouille navale d'après-guerre, équipé pour trouver et engager des sous-marins et des navires équipés de torpilles."
 nav_bomber_equipment_5:0 "Bombardier naval V"
 nav_bomber_equipment_5_short:0 "Bombardier naval V"
 nav_bomber_equipment_5_desc:0 "Un bombardier de patrouille navale amélioré, équipé pour trouver et engager des sous-marins et des navires équipés de torpilles."
 nav_bomber_equipment_6:0 "Bombardier naval VI"
 nav_bomber_equipment_6_short:0 "Bombardier naval VI"
 nav_bomber_equipment_6_desc:0 "Un bombardier de patrouille navale amélioré doté d'excellents systèmes sonar et radar, équipé pour trouver et engager des sous-marins et des navires équipés de torpilles et de missiles air-sol."
 nav_bomber_equipment_7:0 "Bombardier naval VII"
 nav_bomber_equipment_7_short:0 "Bombardier naval VII"
 nav_bomber_equipment_8:0 "Bombardier naval VIII"
 nav_bomber_equipment_8_short:0 "Bombardier naval VIII"
 nav_bomber_equipment_8_desc:0 "Un bombardier de patrouille navale moderne doté de systèmes sonar et radar avancés, équipé pour trouver et engager des sous-marins et des navires équipés de torpilles et de missiles air-sol avancés."

 #Tactical Bomber
 jet_tac_bomber_equipment_1:0 "Bombardier tactique à réaction I"
 jet_tac_bomber_equipment_1_short:0 "Bombardier Jet Tac I"
 jet_tac_bomber_equipment_1_desc:0 "Un bombardier tactique à réaction de première génération permet des vitesses accrues et des charges de bombes plus élevées."
 jet_tac_bomber_equipment_2:0 "Bombardier tactique à réaction II"
 jet_tac_bomber_equipment_2_short:0 "Bombardier Jet Tac II"
 jet_tac_bomber_equipment_2_desc:0 "Un bombardier tactique à réaction de deuxième génération avec une conception à ailes en flèche augmentant encore plus la vitesse."
 jet_tac_bomber_equipment_3:0 "Bombardier tactique à réaction III"
 jet_tac_bomber_equipment_3_short:0 "Bombardier Jet Tac III"
 jet_tac_bomber_equipment_3_desc:0 "Un bombardier tactique à réaction de troisième génération doté d'une aile en flèche, d'une plus grande capacité de munitions et d'instruments de navigation améliorés."
 jet_tac_bomber_equipment_4:0 "Interdicteur I"
 jet_tac_bomber_equipment_4_short:0 "Interdicteur I"
 jet_tac_bomber_equipment_4_desc:0 "Un intercepteur est un type d'avion d'attaque qui opère loin derrière les lignes ennemies, avec l'intention expresse d'interdire les cibles militaires ennemies, notamment celles impliquées dans la logistique. Volant souvent à grande vitesse et au ras du sol."
 jet_tac_bomber_equipment_5:0 "Interdicteur II"
 jet_tac_bomber_equipment_5_short:0 "Interdicteur II"
 jet_tac_bomber_equipment_5_desc:0 "Un intercepteur amélioré avec une conception à ailes en flèche permettant des vitesses plus élevées à basse altitude, capable de transporter une grande variété de munitions."
 jet_tac_bomber_equipment_6:0 "Interdicteur III"
 jet_tac_bomber_equipment_6_short:0 "Interdicteur III"
 jet_tac_bomber_equipment_6_desc:0 "Un autre intercepteur avancé avec une conception à ailes en flèche permettant des vitesses plus élevées à basse altitude, capable de transporter une grande variété de munitions."
 jet_tac_bomber_equipment_7:0 "Interdicteur IV"
 jet_tac_bomber_equipment_7_short:0 "Interdicteur IV"
 jet_tac_bomber_equipment_7_desc:0 "Partageant souvent des pièces ou des points communs avec des chasseurs multi-rôles ou des intercepteurs intercepteurs de l'ère moderne, ils peuvent ressembler à un avion de combat ordinaire, mais ont une quantité incroyable de points d'appui pour leur mission de frappe."
 jet_tac_bomber_equipment_8:0 "Interdicteur V"
 jet_tac_bomber_equipment_8_short:0 "Interdicteur V"
 jet_tac_bomber_equipment_8_desc:0 "Interdicteur moderne doté de cockpits modernes de vol électrique et numérique mettant en oeuvre une faible section efficace radar et un grand nombre de points d'attache afin d'accomplir leurs missions."

 #Stealth Tactical Bomber
 stealth_tactical_bomber_equipment_1:0 "Interdicteur furtif I"
 stealth_tactical_bomber_equipment_1_short:0 "Interdicteur furtif I"
 stealth_tactical_bomber_equipment_1_desc:0 "Un intercepteur furtif de première génération doté de bonnes mesures de réduction radar et d'une soute à bombes interne peut engager une cible sans être repéré."
 stealth_tactical_bomber_equipment_2:0 "Interdicteur furtif II"
 stealth_tactical_bomber_equipment_2_short:0 "Interdicteur furtif II"
 stealth_tactical_bomber_equipment_2_desc:0 "Un intercepteur furtif de deuxième génération avec un revêtement furtif moderne, une section efficace radar extrêmement faible et une capacité interne étendue pour les munitions."

 #Strategic Bomber
 jet_strat_bomber_equipment_1:0 "Bombardier stratégique à réaction I"
 jet_strat_bomber_equipment_1_short:0 "Bombardier Jet Strat I"
 jet_strat_bomber_equipment_1_desc:0 "Première génération de bombardiers stratégiques à réaction ou à turbopropulseur à ailes droites, armés de bombes conventionnelles ou de munitions nucléaires."
 jet_strat_bomber_equipment_2:0 "Bombardier stratégique à réaction II"
 jet_strat_bomber_equipment_2_short:0 "Bombardier Jet Strat II"
 jet_strat_bomber_equipment_2_desc:0 "La première génération de bombardiers stratégiques à réaction ou à turbopropulseur à ailes en flèche avec une vitesse accrue et une capacité de bombes plus élevée pour les munitions conventionnelles ou nucléaires."
 jet_strat_bomber_equipment_3:0 "Bombardier stratégique à réaction III"
 jet_strat_bomber_equipment_3_short:0 "Bombardier Jet Strat III"
 jet_strat_bomber_equipment_3_desc:0 "La deuxième génération de bombardiers stratégiques à réaction ou à turbopropulseur à ailes en flèche volant sur des distances plus élevées et plus longues que ceux qui l'ont précédé."
 jet_strat_bomber_equipment_4:0 "Bombardier stratégique à réaction IV"
 jet_strat_bomber_equipment_4_short:0 "Bombardier Jet Strat IV"
 jet_strat_bomber_equipment_4_desc:0 "La troisième génération de bombardiers stratégiques à réaction ou à turbopropulseur, armés de missiles conventionnels à chute libre ou de premiers missiles de croisière et des systèmes de guidage associés requis."
 jet_strat_bomber_equipment_5:0 "Bombardier stratégique à réaction V"
 jet_strat_bomber_equipment_5_short:0 "Bombardier Jet Strat V"
 jet_strat_bomber_equipment_5_desc:0 "Une quatrième génération de bombardiers stratégiques à réaction dotés des premiers systèmes de vol électrique, de systèmes de guidage renouvelés et d'une capacité de missile de croisière plus avancée."
 
 #Mach 2 Strategic Bomber
 mach2stratbomber_equipment_1:0 "Bombardier stratégique Mach 2"
 mach2stratbomber_equipment_1_short:0 "Bombardier stratégique M.2"
 mach2stratbomber_equipment_1_desc:0 "Avec l'avènement d'intercepteurs de haut vol et très performants et de capacités de base en matière de missiles sol-air, les bombardiers doivent non seulement voler plus haut, mais aussi plus vite qu'auparavant."
 mach2stratbomber_equipment_2:0 "Bombardier stratégique Mach 2 II"
 mach2stratbomber_equipment_2_short:0 "Bombardier M.2 Strat II"
 mach2stratbomber_equipment_2_desc:0 "Bombardier stratégique capable de Mach 2+, capable de voler encore plus vite grâce à de nouvelles instruments de navigation permettant de voler à toute vitesse pour lancer ses munitions mortelles sur la cible."
 mach2stratbomber_equipment_3:0 "Bombardier stratégique Mach 2 III"
 mach2stratbomber_equipment_3_short:0 "Bombardier M.2 Strat III"
 mach2stratbomber_equipment_3_desc:0 "Bombardier stratégique capable de Mach 2+, capable de voler encore plus vite grâce à une instrumentation moderne basée sur le GPS permettant de voler à la surface de la terre, le vol électrique garantissant la réactivité."
 
 #Mach 3 Strategic Bomber
 mach3stratbomber_equipment_1:0 "Bombardier stratégique Mach 3"
 mach3stratbomber_equipment_1_short:0 "Bombardier stratégique M.3"
 mach3stratbomber_equipment_1_desc:0 "Un bombardier stratégique capable de Mach 3 volant encore plus vite que ses cousins capables de Mach 2, mais nécessitant une technologie de pointe et des ressources coûteuses pour sa construction."

 #Mach 6 Strategic Bomber
 mach6stratbomber_equipment_1:0 "Bombardier stratégique Mach 6"
 mach6stratbomber_equipment_1_short:0 "Bombardier stratégique M.6"
 mach6stratbomber_equipment_1_desc:0 "Un bombardier stratégique capable de Mach 6 volant presque sous-orbital afin de réduire les frictions. Ce vaisseau proche de l'espace, dans sa conception, est incroyablement technologique de pointe et incroyablement coûteux à construire et à entretenir."
 
 #Nuclear-Powered Strategic Bomber
 nuclearstratbomber_equipment_1:0 "Bombardier stratégique à propulsion nucléaire I"
 nuclearstratbomber_equipment_1_short:0 "Nucl. Bombardier Strat I"
 nuclearstratbomber_equipment_1_desc:0 "Un avion à propulsion nucléaire est un concept d'avion destiné à être propulsé par l'énergie nucléaire. L'intention était de produire un moteur à réaction qui chaufferait l'air comprimé avec la chaleur de la fission, au lieu de la chaleur provenant de la combustion du carburant. Pendant la guerre froide, les États-Unis et l'Union soviétique ont étudié les bombardiers à propulsion nucléaire, plus endurants."
 nuclearstratbomber_equipment_2:0 "Bombardier stratégique II à propulsion nucléaire"
 nuclearstratbomber_equipment_2_short:0 "Nucl. Bombardier stratégique II"
 nuclearstratbomber_equipment_2_desc:0 "Une tentative moderne d'avion à propulsion nucléaire avec l'intention de voler en permanence. En raison de tout le blindage du réacteur requis, des avions comme celui-ci sont incroyablement coûteux à exploiter."

 #Stealth Strategic Bomber
 stealth_strategic_bomber_equipment:0 "Bombardier furtif"
 stealth_strategic_bomber_equipment_1:0 "Bombardier furtif stratégique I"
 stealth_strategic_bomber_equipment_1_short:0 "Bombardier furtif I"
 stealth_strategic_bomber_equipment_1_desc:0 "Un bombardier furtif stratégique de première génération doté d'une conception avancée et d'un revêtement furtif afin de pouvoir pénétrer profondément en territoire ennemi sans être détecté."
 stealth_strategic_bomber_equipment_2:0 "Bombardier furtif stratégique II"
 stealth_strategic_bomber_equipment_2_short:0 "Bombardier furtif II"
 stealth_strategic_bomber_equipment_2_desc:0 "Un bombardier furtif stratégique de deuxième génération doté d'une conception avancée et d'un revêtement furtif afin de pouvoir pénétrer profondément en territoire ennemi sans être détecté."

 #Transport Plane
 transport_plane_equipment_2:0 "Avion de transport II"
 transport_plane_equipment_2_short:0 "Transports II"
 transport_plane_equipment_2_desc:0 "Alors que la Seconde Guerre mondiale s'étendait vers le milieu des années 1940, la demande d'avions de transport de plus grande capacité conduirait à la création d'avions plus gros, capables de transporter plus de troupes et d'équipement."
 transport_plane_equipment_3:0 "Avion de transport III"
 transport_plane_equipment_3_short:0 "Transports III"
 transport_plane_equipment_3_desc:0 "La conception des avions de transport après la Seconde Guerre mondiale permettrait d'utiliser des moteurs plus puissants, permettant ainsi aux avions du début des années 1950 de transporter encore plus de fret, d'équipement et de troupes."
 transport_plane_equipment_4:0 "Avion de transport IV"
 transport_plane_equipment_4_short:0 "Transports IV"
 transport_plane_equipment_4_desc:0 "L'après-guerre de Corée a accéléré la conception des avions, permettant aux avions à turbopropulseurs de vraiment s'imposer en tant que gros transporteurs de marchandises et d'équipements."
 transport_plane_equipment_5:0 "Avion de transport V"
 transport_plane_equipment_5_short:0 "Transports V"
 transport_plane_equipment_5_desc:0 "Le milieu des années 1960 voit l'introduction des avions de transport à réaction et l'augmentation du rayon d'action des gros transporteurs de marchandises. Le ciel est littéralement la limite."
 transport_plane_equipment_6:0 "Avion de transport VI"
 transport_plane_equipment_6_short:0 "Transports VI"
 transport_plane_equipment_6_desc:0 "Une plus grande disponibilité de gros moteurs commerciaux permettrait aux gros transporteurs de marchandises de devenir encore plus gros. En outre, de nouveaux éléments de conception innovants sont inclus dans ces appareils de levage lourds."
 transport_plane_equipment_7:0 "Avion de transport VII"
 transport_plane_equipment_7_short:0 "Transports VII"
 transport_plane_equipment_7_desc:0 "L'adoption à grande échelle des systèmes de vol électrique, l'ajout de réservoirs de carburant plus grands et la possibilité d'utiliser des sondes de ravitaillement en vol par ces gros transporteurs de fret, leur portée devient pratiquement illimitée."
 transport_plane_equipment_8:0 "Avion de transport VIII"
 transport_plane_equipment_8_short:0 "Transports VIII"
 transport_plane_equipment_8_desc:0 "Des moteurs encore plus gros pour les gros avions de transport signifient que la mobilité aérienne atteint son apogée. Des brigades entières peuvent être déplacées par seulement une poignée d'avions cargo de cette époque."
 transport_plane_equipment_9:0 "Avion de transport IX"
 transport_plane_equipment_9_short:0 "Transports IX"
 transport_plane_equipment_9_desc:0 "Les cockpits entièrement numériques deviennent la norme pour ces gros transporteurs de marchandises. Les systèmes de vol électrique ont mûri à une échelle telle que les déplacements sur de grandes distances pour ces avions, ainsi que leur manoeuvrabilité croissante, sont devenus un jeu d'enfant."
 transport_plane_equipment_10:0 "Avion de transport X"
 transport_plane_equipment_10_short:0 "Transport X"
 transport_plane_equipment_10_desc:0 "Le transport aérien moderne, doté d'une grande capacité de chargement, d'une grande vitesse, d'une capacité de ravitaillement en vol et de la capacité de voler à haute altitude, met le monde entier à la portée de ces avions de transport modernes."

