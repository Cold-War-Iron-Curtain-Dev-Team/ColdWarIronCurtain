 HOL_naval_helicopter_equipment_5:0 "Westland Lynx SH-14B"
 HOL_naval_helicopter_equipment_5_short:0 "Lynx SH-14B"
 HOL_naval_helicopter_equipment_6:0 "Westland Lynx SH-14D"
 HOL_naval_helicopter_equipment_6_short:0 "Lynx SH-14D"
 HOL_naval_helicopter_equipment_7:0 "NHIndustries NH90 NFH"
 HOL_naval_helicopter_equipment_7_short:0 "NH90 NFH"

 HOL_attack_helicopter_equipment_3:0 "Hughes AH-64A Apache"
 HOL_attack_helicopter_equipment_3_short:0 "AH-64A Apache"
 HOL_attack_helicopter_equipment_3_desc:0 "Introduit en 1986 pour remplacer l'AH-1 dans l'armée américaine, l'AH-64 est l'un des hélicoptères d'attaque les plus connus au monde. Il comprend une suite de capteurs montés sur le nez pour les systèmes d'acquisition de cibles et de vision nocturne. Un équipement de mission typique (et célèbre) est connu pour être son canon à chaîne de 30 mm transporté entre le train d'atterrissage et quatre points d'attache d'aile tronquée pour un mélange de nacelles de fusée Hydra et de missiles antichar AGM-114 Hellfire. Surnommé « Apache », l'AH-64 représente le summum de l'aviation par hélicoptère."
 HOL_attack_helicopter_equipment_4:0 "Arc long Apache McDonnell Douglas AH-64D"
 HOL_attack_helicopter_equipment_4_short:0 "AH-64D Apache"
 HOL_attack_helicopter_equipment_4_desc:0 "Fierté de l'armée américaine, en plus de sa superbe maniabilité, cette variante est livrée sans le radar Longbow, mais elle pourrait être appelée « Longbowless Delta » et n'est pas connue sous le nom d'« Apache Longbow ». Même s'il est livré sans ce système radar, il s'agit toujours d'une variante entièrement améliorée."
 HOL_attack_helicopter_equipment_5:0 "McDonnell Douglas AH-64E Gardien"
 HOL_attack_helicopter_equipment_5_short:0 "Gardien AH-64E"
 HOL_attack_helicopter_equipment_5_desc:0 "L'AH-64E est doté d'une connectivité numérique améliorée, du système de distribution d'informations tactiques interarmées, de moteurs T700-GE-701D plus puissants avec une transmission par train frontal améliorée pour accueillir plus de puissance, d'une capacité de contrôle de véhicules aériens sans pilote (UAV), d'une capacité IFR complète et d'un train d'atterrissage amélioré. Les nouvelles pales de rotor composites, testées avec succès en 2004, augmentent la vitesse de croisière, le taux de montée et la capacité de charge utile."

 HOL_scout_helicopter_equipment_1:0 "Aérospatiale SA 313B Alouette II"
