 HOL_cv_CAS_equipment_1:0 "Hawker Sea Hurricane Mk.IB"
 HOL_cv_CAS_equipment_1_short:0 "Ouragan Mk.IB"
 HOL_cv_CAS_equipment_2:0 "Fairey Firefly FR.1"
