 #PRC_strat_bomber_equipment_1:0 "Soviet GFX"
 #PRC_strat_bomber_equipment_1_short:0 ""
 PRC_strat_bomber_equipment_2:0 "Libérateur B-24A consolidé"
 PRC_strat_bomber_equipment_2_short:0 "Libérateur B-24A"
 PRC_strat_bomber_equipment_3:0 "Tupolev Tu-4"
 PRC_strat_bomber_equipment_3_short:0 "Tu-4"
 PRC_strat_bomber_equipment_3_desc:0 "Le Tu-4 est une conception d'ingénierie inverse basée sur le B-29 Superfortress américain, développé pour répondre au besoin de Joseph Staline de disposer d'un bombardier stratégique doté de capacités similaires à celles du bombardier américain vainqueur de la guerre. Malgré le refus des États-Unis de prêter-louer le B-29, quatre B-29 se sont écrasés sur le territoire soviétique, ce qui a suffi pour lancer le processus de rétro-ingénierie. Malgré de nombreuses difficultés (obtention de pièces équivalentes ou supérieures aux pièces développées aux États-Unis, conversion du système impérial au système métrique, etc.), le premier vol et la mise en service du Tu-4 ont suffi à paniquer les États-Unis et la Grande-Bretagne, le premier d'une longue série pendant la guerre froide. Il aura cependant une courte durée de vie, remplacé par des bombardiers à réaction au milieu des années 1960. Son nom de rapport OTAN est Bull."
 
