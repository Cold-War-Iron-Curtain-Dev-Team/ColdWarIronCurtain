 #IRBM
 irbm_equipment_1:0 "IRBM JE"
 irbm_equipment_1_short:0 "IRBM JE"
 irbm_equipment_1_desc:0 "Les IRBM sont des missiles balistiques à portée intermédiaire d'une portée de 3 000 à 5 500 km, entre un missile balistique à moyenne portée (MRBM) et un missile balistique intercontinental (ICBM). La classification des missiles balistiques par portée est effectuée principalement pour des raisons de commodité ; en principe, il y a très peu de différence entre un ICBM à faible performance et un IRBM à haute performance, car la diminution de la masse de la charge utile peut augmenter la portée au-delà du seuil de l'ICBM."
