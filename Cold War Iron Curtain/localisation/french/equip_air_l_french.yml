 DEN_jet_multirole_equipment_3:0 "Hawker Chasseur F.1"
 DEN_jet_multirole_equipment_3_short:0 "Chasseur F.1"
 DEN_jet_multirole_equipment_4:0 "Hawker Hunter F.51"
 DEN_jet_multirole_equipment_4_short:0 "Chasseur F.51"
 DEN_jet_multirole_equipment_4_desc:0 "le North American F-100 Super Sabre est un avion de combat supersonique américain utilisé dans le Flyvevåbnet danois de 1959 à 1961 dans le cadre du programme Mutual Defense Assistance Act visant à fournir aux membres européens de l'OTAN des capacités de puissance aérienne plus modernes."
 DEN_jet_multirole_equipment_5:0 "Chasseur stellaire Lockheed F-104G"
 DEN_jet_multirole_equipment_5_short:0 "Chasseur stellaire F-104G"
 DEN_jet_multirole_equipment_5_desc:0 "Le Danemark a initialement reçu 25 F-104G et quatre TF-104G en vertu de la loi sur l'assistance mutuelle en matière de défense. Au total, 51 Starfighter étaient exploités par le Danemark avant leur retraite en 1986."
 DEN_jet_multirole_equipment_7:0 "Saab F-35 Drake"
 DEN_jet_multirole_equipment_7_short:0 "F-35 Draken"
 DEN_jet_multirole_equipment_7_desc:0 "Lorsque l'armée de l'air danoise (Flyvevåbnet) a dû choisir un avion pour compléter le F-100D au milieu des années 1960, on a tenté de trouver un type de base pouvant être adapté à la fois à la défense aérienne, à l'attaque au sol et à la reconnaissance. La Royal Danish Air Force a décidé d'utiliser la désignation F-35 (F = Fighter)"
 DEN_jet_multirole_equipment_8:0 "Fokker F-16A Faucon de combat"
 DEN_jet_multirole_equipment_8_short:0 "Faucon de combat F-16A"
 DEN_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger avec une maniabilité et une stabilité bien équilibrées. Il possède un corps d'aile mixte exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Appelé « Fighting Falcon », son coût relativement faible et sa puissance élevée sont la raison pour laquelle il a été adapté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle best-seller ont été fabriqués."
 DEN_jet_multirole_equipment_9:0 "Fokker F-16A Block 15 OCU (améliorations des capacités opérationnelles) Fighting Falcon"
 DEN_jet_multirole_equipment_9_short:0 "F-16A Bloc 15 OCU"
 DEN_jet_multirole_equipment_9_desc:0 "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 DEN_jet_multirole_equipment_10:0 "Fokker F-16AM Block 15 MLU (mise à jour à mi-vie) Fighting Falcon"
 DEN_jet_multirole_equipment_10_short:0 "F-16AM Bloc 15 MLU"
 DEN_jet_multirole_equipment_10_desc:0 "Le package MLU (Mid-Life Update) du F-16 qui en résulte a été conçu pour mettre à niveau le cockpit et l'avionique à l'équivalent de ceux du F-16C/D Block 50/52 ; ajouter la possibilité d'utiliser des missiles air-air guidés par radar ; et d'une manière générale, améliorer les performances opérationnelles et améliorer la fiabilité, la capacité de soutien et la maintenabilité de l'avion."

