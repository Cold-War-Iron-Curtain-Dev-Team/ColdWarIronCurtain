 FRA_high_mach_jet_interceptor_equipment_1:0 "Sud-Ouest SO.6020 Espadon"
 FRA_high_mach_jet_interceptor_equipment_1_short:0 "SO.6020 Espadon"
 FRA_high_mach_jet_interceptor_equipment_1_desc:0 "Le Sud-Ouest SO.6020 Espadon (Swordfish) était un prototype d'intercepteur français d'après-guerre conçu et construit par la SNCASO à la fin des années 1940. L'Armée de l'Air française a jugé la conception un échec malgré certains records établis et a annulé les projets de mise en service en 1951. Seuls quatre avions ont été construits et ils ont ensuite été modifiés pour servir de bancs d'essai pour le programme SNCASO SO.9000 Trident, propulsé par des fusées et des turboréacteurs mixtes."
 FRA_high_mach_jet_interceptor_equipment_2:0 "SNCASO SO.9000 Trident"
 FRA_high_mach_jet_interceptor_equipment_2_short:0 "SO.9000Trident"
 FRA_high_mach_jet_interceptor_equipment_2_desc:0 "Le SNCASO SO.9000 Trident était un avion intercepteur français à puissance mixte construit par l'avionneur SNCASO dans les années 1950. Dans le cadre d'un effort plus large visant à reconstruire la puissance militaire française à la fin des années 1940 et à fournir à la France de nouveaux modèles avancés et produits dans le pays, une demande pour un avion intercepteur de défense ponctuelle supersonique pour équiper l'armée de l'air française a été adressée à la SNCASO."
 FRA_high_mach_jet_interceptor_equipment_3:0 "Nord 1500 Griffon"
 FRA_high_mach_jet_interceptor_equipment_3_short:0 "N.1500 Griffon"
 FRA_high_mach_jet_interceptor_equipment_3_desc:0 "Le Nord 1500 Griffon était un avion intercepteur expérimental à statoréacteur conçu et construit par l'avionneur public français Nord Aviation. Le Griffon a été développé comme un Mach 2 faisant suite à l'avion de recherche supersonique Nord Gerfaut. Le développement de l'avion a véritablement commencé après la réception d'une lettre d'intention en 1953 pour une paire d'avions de recherche non armés. La conception comportait une configuration innovante turboréacteur-statoréacteur à double propulsion ; le premier étant utilisé pour décoller et atteindre une vitesse suffisante pour démarrer le second."
 #FRA_high_mach_jet_interceptor_equipment_4:0 "Dassault Mirage G8"
 #FRA_high_mach_jet_interceptor_equipment_4_short:0 "Mirage G8"
 #FRA_high_mach_jet_interceptor_equipment_4_desc:0 "The Dassault Mirage G was a French two-seat twinjet variable-geometry prototype fighter, built by Dassault Aviation in the late 1960s. The G8 was built as a dedicated interceptor. The type was further developed into the twin-engine Mirage G4 and G8 variants as a multi-role jet fighter capable of both interception and nuclear strike missions. Although Dassault built and flew prototypes, the entire programme was terminated in the 1970s without the aircraft entering production."

