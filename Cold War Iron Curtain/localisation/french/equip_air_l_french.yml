 PRC_mr_stealth_fighter_equipment_1:0 "Chengdu J-10A"
 PRC_mr_stealth_fighter_equipment_1_short:0 "J-10A"
 PRC_mr_stealth_fighter_equipment_1_desc:0 "Le Chengdu J-10 est un avion de combat monomoteur multirôle de poids moyen, capable d'opérations par tous temps, configuré avec une conception à aile delta et canard, avec des commandes de vol électriques, et produit conjointement par la Chengdu Aircraft Corporation (CAC) pour l'armée de l'air de l'Armée populaire de libération (PLAAF) et l'armée de l'air pakistanaise (PAF). Le J-10 est principalement conçu pour le combat air-air, mais peut également effectuer des missions de frappe."

