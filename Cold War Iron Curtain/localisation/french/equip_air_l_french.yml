 cruisemissile_equipment_6:0 "Missile de croisière d'attaque terrestre VI"
 cruisemissile_equipment_6_short:0 "Missile de croisière VI"
 cruisemissile_equipment_6_desc:0 "Un LACM ou missile de croisière d'attaque terrestre moderne avec radar de suivi du terrain, capacité à échapper aux tirs entrants et précision de précision."

 #SLBM
 slbm_equipment_1:0 "SLBM JE"
 slbm_equipment_1_short:0 "SLBM JE"
 slbm_equipment_1_desc:0 "Les premiers systèmes de missiles balistiques lancés par des sous-marins étaient basés sur des expériences menées peu après la fin de la Seconde Guerre mondiale."
 slbm_equipment_2:0 "SLBM II"
 slbm_equipment_2_short:0 "SLBM II"
 slbm_equipment_2_desc:0 "Les SLBM sont des missiles balistiques lancés par des sous-marins. Un missile balistique capable d'être lancé depuis des sous-marins. Les variantes modernes fournissent généralement plusieurs véhicules de rentrée (MIRV) pouvant être ciblés indépendamment, chacun transportant une ogive nucléaire et permettant à un seul missile lancé de frapper plusieurs cibles. Les missiles balistiques lancés par des sous-marins fonctionnent différemment des missiles de croisière lancés par des sous-marins."
 slbm_equipment_3:0 "SLBM III"
 slbm_equipment_3_short:0 "SLBM III"
 slbm_equipment_3_desc:0 "Les SLBM sont des missiles balistiques lancés par des sous-marins. Un missile balistique capable d'être lancé depuis des sous-marins. Les variantes modernes fournissent généralement plusieurs véhicules de rentrée (MIRV) pouvant être ciblés indépendamment, chacun transportant une ogive nucléaire et permettant à un seul missile lancé de frapper plusieurs cibles. Les missiles balistiques lancés par des sous-marins fonctionnent différemment des missiles de croisière lancés par des sous-marins."
 slbm_equipment_4:0 "SLBM IV"
 slbm_equipment_4_short:0 "SLBM IV"
 slbm_equipment_4_desc:0 "Les SLBM sont des missiles balistiques lancés par des sous-marins. Un missile balistique capable d'être lancé depuis des sous-marins. Les variantes modernes fournissent généralement plusieurs véhicules de rentrée (MIRV) pouvant être ciblés indépendamment, chacun transportant une ogive nucléaire et permettant à un seul missile lancé de frapper plusieurs cibles. Les missiles balistiques lancés par des sous-marins fonctionnent différemment des missiles de croisière lancés par des sous-marins."
 slbm_equipment_5:0 "SLBM V"
 slbm_equipment_5_short:0 "SLBM V"
 slbm_equipment_5_desc:0 "Les SLBM sont des missiles balistiques lancés par des sous-marins. Un missile balistique capable d'être lancé depuis des sous-marins. Les variantes modernes fournissent généralement plusieurs véhicules de rentrée (MIRV) pouvant être ciblés indépendamment, chacun transportant une ogive nucléaire et permettant à un seul missile lancé de frapper plusieurs cibles. Les missiles balistiques lancés par des sous-marins fonctionnent différemment des missiles de croisière lancés par des sous-marins."
