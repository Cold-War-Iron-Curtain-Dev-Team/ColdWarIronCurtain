 WGR_jump_jet_equipment_1:0 "Hawker Siddeley Crécerelle FGA.1"
 WGR_jump_jet_equipment_1_short:0 "Crécerelle FGA.1"
 WGR_jump_jet_equipment_1_desc:0 "Cet attaquant a été développé pour faire du VTOL (décollage et atterrissage verticaux) une réalité. Il présente une conception unique comprenant des ailes montées en hauteur et quatre buses rotatives. Cela permet d'opérer dans des espaces limités tels que les porte-avions légers et les petits aérodromes. L'avion est communément connu sous le nom de « Kestrel », précurseur du Harrier mais suivi par la Luftwaffe ouest-allemande."
 WGR_jump_jet_equipment_2:0 "VFW VAK 191B"
 WGR_jump_jet_equipment_2_short:0 "VAK 191B"
 WGR_jump_jet_equipment_2_desc:0 "Le VFW VAK 191B était un chasseur d'attaque expérimental allemand à décollage et atterrissage vertical (VTOL) du début des années 1970. VAK était l'abréviation de Vertikalstartendes Aufklärungs- und Kampfflugzeug (avion de reconnaissance et d'attaque à décollage vertical)."

