 SPR_nav_bomber_equipment_2:0 "Dornier Do 24"
 SPR_nav_bomber_equipment_2_short:0 "Faire 24"
 SPR_nav_bomber_equipment_3:0 "PBY-5A Catalina consolidé"
 SPR_nav_bomber_equipment_3_short:0 "PBY-5A Catalina"
 SPR_nav_bomber_equipment_4:0 "Albatros Grumman SHU-16B"
 SPR_nav_bomber_equipment_4_short:0 "Albatros SHU-16B"
 SPR_nav_bomber_equipment_5:0 "Albatros Grumman SHU-16D"
 SPR_nav_bomber_equipment_5_short:0 "Albatros SHU-16D"
 SPR_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 SPR_nav_bomber_equipment_6_short:0 "P-3A Orion"
 SPR_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le rôle de patrouille maritime et de guerre anti-sous-marine terrestre (ASW). Il dispose d'une soute à bombes interne pour les torpilles aériennes, avec des pylônes sous les ailes pour une myriade d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des charges sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques sur sa queue pour détecter les sous-marins utilisant le champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à jouer un rôle depuis son introduction en 1962, il est tout à fait approprié que l'avion soit surnommé « Orion ». Le chasseur de navires ennemis."
 SPR_nav_bomber_equipment_7:0 "MAISON CN-235 MPA"
 SPR_nav_bomber_equipment_7_short:0 "CN-235 MPA"
 SPR_nav_bomber_equipment_8:0 "MAISON C-295 MPA"
 SPR_nav_bomber_equipment_8_short:0 "C-295 MPA"

 SPR_jump_jet_equipment_1:0 "Hawker Siddeley AV-8A Harrier"
 SPR_jump_jet_equipment_1_short:0 "Harrier AV-8A"
 SPR_jump_jet_equipment_1_desc:0 "Cet attaquant a été développé pour faire du VTOL (décollage et atterrissage verticaux) une réalité. Il présente une conception unique comprenant des ailes montées en hauteur et quatre buses rotatives. Cela permet d'opérer dans des espaces limités tels que les porte-avions légers et les petits aérodromes. L'avion est communément connu sous le nom de « Harrier ». Développé en Grande-Bretagne, l'AV-8A est connu en Grande-Bretagne sous le nom de Harrier Mk. 50 et fonctionnait de manière similaire aux Harrier GR.1 de la Royal Air Force."
 SPR_jump_jet_equipment_2:0 "Hawker Siddeley AV-8S Matador"
 SPR_jump_jet_equipment_2_short:0 "AV-8S Matador"
 SPR_jump_jet_equipment_2_desc:0 "La variante « C » est une version améliorée de l'AV-8A et fonctionne avec des systèmes similaires au Harrier GR.3, avec un nouvel équipement ECM et un système de navigation inertielle."
 SPR_jump_jet_equipment_3:0 "McDonnell Douglas AV-8B Harrier II"
 SPR_jump_jet_equipment_3_short:0 "AV-8B Harrier II"
 SPR_jump_jet_equipment_3_desc:0 "Le Harrier II est un projet anglo-américain conjoint conçu par McDonnell Douglas avec British Aerospace. Au service du Corps des Marines des États-Unis depuis 1985, le « Harrier II » était considéré comme un outil important dans de nombreux conflits américains de mémoire récente."
 SPR_jump_jet_equipment_4:0 "McDonnell Douglas AV-8B Harrier II Plus"
 SPR_jump_jet_equipment_4_short:0 "AV-8B Harrier II Plus"
 SPR_jump_jet_equipment_4_desc:0 "Mise à niveau à mi-vie de l'AV-8B, l'AV-8B Plus intègre un moteur amélioré, un système radar et une caméra infrarouge, ce qui en fait un avion d'attaque de nuit très efficace."

### Spain Helicopters
 SPR_naval_helicopter_equipment_1:0 "Sikorsky SH-19 Chickasaw ASW"
 SPR_naval_helicopter_equipment_1_short:0 "SH-19 ASW"
 SPR_naval_helicopter_equipment_2:0 "Bell UH-1B Iroquois ASW"
 SPR_naval_helicopter_equipment_2_short:0 "EUH-1B ASW"
 SPR_naval_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."

 SPR_naval_helicopter_equipment_4:0 "Sikorsky SH-3H Sea King"
 SPR_naval_helicopter_equipment_4_short:0 "SH-3H Sea King"
 SPR_naval_helicopter_equipment_4_desc:0 "Développé à partir du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère ASW bimoteur. Il s'agissait du premier hélicoptère amphibie au monde, capable de décoller à la fois depuis la terre et depuis la mer. Il fut également, aux côtés de son contemporain le Seasprite, l'un des premiers hélicoptères ASW à utiliser des turbomoteurs. En plus des fonctions ASW, le SH-3 a également joué des rôles de recherche et de sauvetage (SAR), de transport, d'évacuation sanitaire et d'alerte précoce aéroportée (AEW), un certain nombre d'hélicoptères étant utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pour cette raison qu'il a gagné le surnom de « Sea King », l'hélicoptère le plus polyvalent au monde."
 SPR_naval_helicopter_equipment_5:0 "Agusta Bell SH-212A"
 SPR_naval_helicopter_equipment_5_short:0 "SH-212A"
 SPR_naval_helicopter_equipment_5_desc:0 "Le SH-60 est la variante de l'hélicoptère UH-60 Blackhawk de l'armée américaine. (lui-même une variante militaire du Sikorsky S-70) Bien qu'il ait remplacé le précédent Sea King, le SH-60 n'a pas de capacité d'atterrissage amphibie, mais il conserve la capacité du SH-2 à atterrir sur n'importe quel navire américain capable d'héberger des hélicoptères. Capable de remplir bon nombre des mêmes rôles que le SH-3, le « Sea Hawk » représente l'avenir de l'aviation des hélicoptères de la marine américaine."
 SPR_naval_helicopter_equipment_6:0 "Sikorsky SH-60F Seahawk"
 SPR_naval_helicopter_equipment_6_short:0 "SH-60F Seahawk"
 SPR_naval_helicopter_equipment_6_desc:0 "Le SH-60F servait principalement de principal avion de guerre anti-sous-marine (ASW) du groupement tactique aéronaval. L'hélicoptère chassait les sous-marins avec son sonar plongeant AQS-13F et transportait un lanceur de bouées sonores à 6 tubes. Le SH-60F est officieusement nommé « Oceanhawk ». Le SH-60F peut transporter des torpilles Mk 46, Mk 50 ou Mk 54 pour ses armes offensives, et il dispose d'un choix de mitrailleuses montées sur le fuselage, notamment les M60D, M240D et GAU-16 (calibre.50) pour l'autodéfense."
 SPR_naval_helicopter_equipment_7:0 "NHIndustries NH90 NFH"
 SPR_naval_helicopter_equipment_7_short:0 "NH90 NFH"

 SPR_attack_helicopter_equipment_1:0 "Cloche AH-1G Cobra"
 SPR_attack_helicopter_equipment_1_short:0 "AH-1G Cobra"
 SPR_attack_helicopter_equipment_1_desc:0 "Initialement introduit en 1966 comme hélicoptère d'attaque provisoire, l'AH-1 (développé avec une certaine compatibilité à partir de l'UH-1 Huey Iroquois) a été utilisé dans les mêmes rôles que l'AH-56 était destiné au cours de son cycle de développement. Il était souvent déployé dans des formations de chasseurs-tueurs, du rôle de « tueur » au rôle de « chasseur » assuré par l'OH-6 Cayuse, qui ont tous deux servi avec une grande distinction pendant la guerre du Vietnam. Bien qu'officiellement surnommé « Cobra », d'autres surnoms existent, notamment « HueyCobra » et « Snake »."
 SPR_attack_helicopter_equipment_2:0 "Agusta-Bell AB-212 Gunship"
 SPR_attack_helicopter_equipment_2_short:0 "AB-212 Gunship"
 SPR_attack_helicopter_equipment_5:0 "Eurocopter Tigre UHT"
 SPR_attack_helicopter_equipment_5_short:0 "Tigre UHT"

 SPR_scout_helicopter_equipment_1:0 "Hughes OH-6 Cayuse"
 SPR_scout_helicopter_equipment_1_short:0 "OH-6 Cayuse"
 SPR_scout_helicopter_equipment_1_desc:0 "Développé en 1960, l'OH-6 a été conçu dans le cadre du projet Light Observation Helicopter (LOH), à des fins d'observation, d'évacuation des blessés, de transport de personnel et d'attaque légère. Le design de Hughes serait celui qui réussirait parmi onze autres designs concurrents. Il remplacerait l'O-1 Bird Dog dans le rôle d'observation lorsque le département américain de la Défense ordonnait à l'armée américaine de transférer tous les avions à voilure fixe à l'US Air Force. Servi avec distinction pendant la guerre du Vietnam, l'OH-6 avait montré la valeur des hélicoptères d'observation comme support aux hélicoptères d'attaque comme l'AH-1 ou aux forces terrestres pour engager les ennemis. Officiellement connu sous le nom de « Cayuse » (d'après la tribu amérindienne du nord-ouest du Pacifique), les pilotes lui ont donné le surnom de « Loach » en hommage au programme qui l'a engendré."
