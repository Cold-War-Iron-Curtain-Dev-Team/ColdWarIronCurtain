l_french:
 
 fighter_equipment_0:0 "Combattant de l'entre-deux-guerres"
 fighter_equipment_0_short:0 "Combattant"
 fighter_equipment_0_desc:0 "Alors que les avions de combat ont subi de nombreuses modifications au cours de la Grande Guerre et depuis, la conception biplan devient obsolète. Nous devons commencer à traduire les avancées technologiques civiles en applications militaires."
 fighter_equipment_1:0 "Combattant I"
 fighter_equipment_1_short:0 "Combattant I"
 fighter_equipment_1_desc:0 "Les cellules légères ont été révolutionnées avec l'introduction des moteurs radiaux, des conceptions monoplans et de la construction entièrement métallique. Cette conception est notre tentative de créer notre premier avion de combat moderne."
 fighter_equipment_2:0 "Combattant II"
 fighter_equipment_2_short:0 "Combattant II"
 fighter_equipment_2_desc:0 "Le rythme des progrès des chasseurs est stupéfiant et, à ce titre, nous devons continuer à intégrer la technologie et à améliorer les concepts existants. Notre nouveau modèle de chasseur doit être capable d'atteindre une vitesse élevée, des performances élevées en altitude et la meilleure portée possible. De plus, il doit être très bien armé."
 fighter_equipment_3:0 "Combattant III"
 fighter_equipment_3_short:0 "Combattant III"
 fighter_equipment_3_desc:0 "Bien que nos générations précédentes d'avions de combat se soient révélées utiles, tout avantage découlant d'une meilleure conception devrait être exploité. Cet avion sera la plate-forme suprême des chasseurs à moteur à pistons qui disposera d'une excellente puissance, d'une grande agilité, d'un armement mortel et d'une bonne portée."
 heavy_fighter_equipment_1:0 "Chasseur lourd I"
 heavy_fighter_equipment_1_short:0 "Chasseur lourd I"
 heavy_fighter_equipment_1_desc:0 "Notre force de bombardiers a besoin d'une protection d'escorte contre les chasseurs ennemis jusqu'à leurs cibles et retour. Afin de fournir cette escorte, nous devons concevoir des avions de combat dotés d'une portée de bombardier. Par nécessité, ces avions sont plus gros, plus lents et moins agiles que les chasseurs légers, bien qu'ils puissent transporter un armement important."
 heavy_fighter_equipment_2:0 "Chasseur lourd II"
 heavy_fighter_equipment_2_short:0 "Chasseur lourd II"
 heavy_fighter_equipment_2_desc:0 "La guerre nous a appris que notre conception de chasseur lourd est vulnérable aux chasseurs plus agiles, mais assez efficace pour intercepter les bombardiers ennemis grâce à son armement lourd. Cette prochaine conception se concentrera sur une capacité d'attaque accrue contre les avions ennemis et même contre des cibles au sol. Sa vitesse et sa portée seront également améliorées."
 heavy_fighter_equipment_3:0 "Chasseur lourd III"
 heavy_fighter_equipment_3_short:0 "Chasseur lourd III"
 heavy_fighter_equipment_3_desc:0 "Bien que notre force de chasseurs lourds ait démontré son aptitude à remplir divers rôles, nous devons envisager une nouvelle conception qui améliorera ses capacités par rapport aux chasseurs ennemis, tout en lui permettant de continuer à intercepter des bombardiers ennemis de plus en plus rapides et mieux défendus."
 strat_bomber_equipment_1:0 "Bombardier stratégique I"
 strat_bomber_equipment_1_short:0 "Bombardier Strat I"
 strat_bomber_equipment_1_desc:0 "Les expériences de la Grande Guerre et les études réalisées depuis montrent que le bombardement des cibles militaires et des grandes villes de l'ennemi permettra de gagner la prochaine guerre. Nous devons au moins disposer d'un bombardier capable de provoquer de telles destructions. Il devra voler haut et à bonne vitesse, et transporter une charge utile importante. Cela nécessitera une grande cellule équipée de plusieurs moteurs. Il aura également une certaine capacité défensive."
 strat_bomber_equipment_2:0 "Bombardier stratégique II"
 strat_bomber_equipment_2_short:0 "Bombardier stratégique II"
 strat_bomber_equipment_2_desc:0 "Les bombardements se sont révélés efficaces pour réduire la capacité de l'ennemi à faire la guerre. Un armement plus défensif et une vitesse accrue permettront à une nouvelle conception d'éviter la destruction, tandis qu'une augmentation de la charge utile et de la portée le rendra plus efficace."
 strat_bomber_equipment_3:0 "Bombardier stratégique III"
 strat_bomber_equipment_3_short:0 "Bombardier stratégique III"
 strat_bomber_equipment_3_desc:0 "Pour éviter les pertes face aux chasseurs ennemis et aux tirs au sol, notre prochain modèle volera à grande altitude. Il sera plus grand pour transporter à la fois une énorme charge utile et plus de carburant, pour augmenter l'autonomie."
 tac_bomber_equipment_0:0 "Bombardier de l'entre-deux-guerres"
 tac_bomber_equipment_0_short:0 "Bombardier"
 tac_bomber_equipment_0_desc:0 "Il est largement admis que la prochaine guerre sera entièrement gagnée en bombardant l'ennemi jusqu'à son extinction. Il est impératif que nous commencions à concevoir notre propre bombardier capable de transporter de lourdes charges utiles à une vitesse adéquate."
 tac_bomber_equipment_1:0 "Bombardier tactique I"
 tac_bomber_equipment_1_short:0 "Bombardier tactique I"
 tac_bomber_equipment_1_desc:0 "Les bombardiers moyens doivent être polyvalents et rapides, capables de remplir toute une série de rôles. Une conception bimoteur, restant relativement légère, peut continuer à être utilisée pendant de nombreuses années."
 tac_bomber_equipment_2:0 "Bombardier tactique II"
 tac_bomber_equipment_2_short:0 "Bombardier tactique II"
 tac_bomber_equipment_2_desc:0 "Les conceptions plus lourdes des bombardiers tactiques peuvent étendre la portée, la charge utile et la vitesse tout en conservant la capacité des avions à effectuer une grande variété de missions."
 tac_bomber_equipment_3:0 "Bombardier tactique III"
 tac_bomber_equipment_3_short:0 "Bombardier tactique III"
 tac_bomber_equipment_3_desc:0 "S'inspirant des progrès réalisés dans le domaine des avions de combat, les matériaux et les formes non conventionnels peuvent faire de nouveaux modèles des avions bimoteurs parmi les plus rapides et les plus performants jamais construits."
 transport_plane_equipment_1:0 "Avion de transport I"
 transport_plane_equipment_1_short:0 "Transports"
 transport_plane_equipment_1_desc:0 "§LAvions utilisés pour transporter des troupes lors de missions de parachutage.§!"
 cv_nav_bomber_equipment:0 "CV Bombardier Naval"
 nav_bomber_equipment_1:0 "Bombardier naval I"
 nav_bomber_equipment_1_short:0 "JE NAVIGUE"
 nav_bomber_equipment_1_desc:0 "L'aviation navale sera vitale au cours de la décennie à venir pour faire face aux nouveaux développements de la guerre navale, comme l'importance croissante des sous-marins. Des hydravions capables de fonctionner comme bombardiers en piqué et comme véhicules de reconnaissance seront utiles."
 nav_bomber_equipment_2:0 "Bombardier naval II"
 nav_bomber_equipment_2_short:0 "NAVIGATION II"
 nav_bomber_equipment_2_desc:0 "La nouvelle technologie des moteurs et les conceptions aérodynamiques raffinées augmenteront considérablement la vitesse et la capacité d'attaque en plongée des avions navals."
 nav_bomber_equipment_3:0 "Bombardier naval III"
 nav_bomber_equipment_3_short:0 "NAVIGATION III"
 nav_bomber_equipment_3_desc:0 "Les conceptions entièrement métalliques et les aérofreins puissants permettent une aéronautique navale plus complexe. Les avions du futur nécessiteront toutefois un équipage plus important pour faire fonctionner ces systèmes avancés."
 aerosub_0:0 "Sous-marin volant prototype"
 aerosub_0_short:0 "AÉROSUB JE"
 aerosub_0_desc:0 "Le sous-marin volant est un bombardier naval amphibie capable de s'immerger pour échapper aux tirs anti-aériens ennemis et améliorer la furtivité. Utilisant une couverture aérienne ou maritime, le sous-marin volant est plus défendable à un coût et un compromis en termes de performances substantiels.\nImaginé à l'origine par des officiers supérieurs britanniques anonymes et rapporté dans le journal commercial britannique « Flying », le sous-marin volant, ou « aerosub », a rarement été pris au sérieux. Entre la fin des années 30 et le milieu des années 50, l'Union soviétique a pris des mesures sérieuses pour tenter de créer un aérosub, mais le projet a lamentablement échoué. Il ne sera exploré à nouveau qu'au début des années 60, lorsque Donald Reid concevra un avion submersible amphibie monoplace dont le concept était beaucoup plus simple que celui de l'aérosub recherché par l'Union soviétique. Cependant, en 2008, l'agence américaine DARPA a annoncé qu'elle commencerait à réexplorer le concept d'aérosub."
 aerosub_equipment_0:0 "AÉROSUB JE"
 CAS_equipment_1:0 "Appui aérien rapproché I"
 CAS_equipment_1_short:0 "CAS OÙ JE"
 CAS_equipment_1_desc:0 "Notre doctrine CAS exige un avion capable d'attaquer avec précision la surface. Bien que ces avions transportent une charge utile moindre par rapport à nos plus gros bombardiers tactiques, ils sont capables d'attaquer et de détruire de petites cibles d'opportunité par mitraillage et bombardement en piqué."
 CAS_equipment_2:0 "Appui aérien rapproché II"
 CAS_equipment_2_short:0 "CAS II"
 CAS_equipment_2_desc:0 "Les premières expériences de guerre ont montré qu'une vitesse, un blindage et une maniabilité accrus sont nécessaires à la capacité de survie des avions CAS contre les chasseurs ennemis et les tirs au sol. Cette nouvelle génération d'avions d'attaque au sol utilisera également des bombes, des canons et des mitrailleuses plus grosses pour infliger davantage de dégâts à leurs cibles."
 CAS_equipment_3:0 "Appui aérien rapproché III"
 CAS_equipment_3_short:0 "CAS III"
 CAS_equipment_3_desc:0 "La capacité toujours croissante des cibles AA et des intercepteurs ennemis nécessite une évolution ultérieure de nos avions CAS. La nouvelle conception intègre une puissance moteur accrue, des améliorations de la cellule pour une capacité de plongée et une protection accrues, ainsi que des charges utiles encore plus importantes."
 CAS_equipment_4:0 "Appui aérien rapproché IV"
 CAS_equipment_4_short:0 "CAS IV"
 CAS_equipment_4_desc:0 ""

 drone_equipment:0 "Drone"
 drone_equipment_1:0 "Drone I"
 drone_equipment_2:0 "Drone II"
 drone_equipment_3:0 "Drone III"
 drone_equipment_1_short:0 "Drone I"
 drone_equipment_2_short:0 "Drone II"
 drone_equipment_3_short:0 "Drone III"
 drone_equipment_1_desc:0 "Drone I"
 drone_equipment_2_desc:0 "Drone II"
 drone_equipment_3_desc:0 "Drone III"
 cv_nav_bomber_equipment_1:0 "Bombardier naval transporteur I"
 cv_nav_bomber_equipment_1_short:0 "CV Bombardier Naval I"
 cv_nav_bomber_equipment_1_desc:0 "Un des premiers bombardiers navals modifiés pour lancer et atterrir sur des porte-avions."
 cv_nav_bomber_equipment_2:0 "Bombardier naval porte-avions II"
 cv_nav_bomber_equipment_2_short:0 "CV Bombardier Naval II"
 cv_nav_bomber_equipment_2_desc:0 "Un bombardier naval amélioré modifié pour lancer et atterrir sur des porte-avions."
 cv_nav_bomber_equipment_3:0 "Bombardier naval porte-avions III"
 cv_nav_bomber_equipment_3_short:0 "CV Bombardier Naval III"
 cv_nav_bomber_equipment_3_desc:0 "Un bombardier naval avancé modifié pour lancer et atterrir sur des porte-avions."
 cv_CAS_equipment_1:0 "Appui aérien rapproché I"
 cv_CAS_equipment_1_short:0 "CV CAS-JE"
 cv_CAS_equipment_1_desc:0 "Un des premiers avions d'appui aérien rapproché modifié pour décoller et atterrir sur des porte-avions."
 cv_CAS_equipment_2:0 "Appui aérien rapproché II"
 cv_CAS_equipment_2_short:0 "CV CAS II"
 cv_CAS_equipment_2_desc:0 "Un avion d'appui aérien rapproché amélioré modifié pour décoller et atterrir sur des porte-avions."
 cv_CAS_equipment_3:0 "Appui aérien rapproché III"
 cv_CAS_equipment_3_short:0 "CV CAS III"
 cv_CAS_equipment_3_desc:0 "Un avion d'appui aérien rapproché avancé modifié pour décoller et atterrir sur des porte-avions."
 cv_CAS_equipment_4:0 "Appui aérien rapproché IV"
 cv_CAS_equipment_4_short:0 "CV CAS IV"
 cv_CAS_equipment_4_desc:0 ""
 cv_fighter_equipment_0:0 "Chasseur porteur IW"
 cv_fighter_equipment_0_short:0 "Combattant IW CV"
 cv_fighter_equipment_0_desc:0 "Un des premiers chasseurs modifiés pour décoller et atterrir sur des porte-avions."
 cv_fighter_equipment_1:0 "Chasseur aéronaval I"
 cv_fighter_equipment_1_short:0 "CV Combattant I"
 cv_fighter_equipment_1_desc:0 "Un des premiers chasseurs modifiés pour décoller et atterrir sur des porte-avions."
 cv_fighter_equipment_2:0 "Chasseur porteur II"
 cv_fighter_equipment_2_short:0 "Combattant CV II"
 cv_fighter_equipment_2_desc:0 "Un chasseur amélioré modifié pour lancer et atterrir sur des porte-avions."
 cv_fighter_equipment_3:0 "Chasseur porteur III"
 cv_fighter_equipment_3_short:0 "Combattant CV III"
 cv_fighter_equipment_3_desc:0 "Un chasseur avancé modifié pour décoller et atterrir sur des porte-avions."
 rocket_interceptor_equipment_1:0 "Intercepteur de fusée I"
 rocket_interceptor_equipment_1_desc:0 "Intercepteur expérimental à courte portée propulsé par un moteur-fusée chimique peu fiable."
 rocket_interceptor_equipment_1_short:0 "Intercepteur de fusée I"
 rocket_interceptor_equipment_2:0 "Intercepteur de fusée II"
 rocket_interceptor_equipment_2_desc:0 "Intercepteur à courte portée propulsé par un moteur-fusée chimique légèrement plus fiable."
 rocket_interceptor_equipment_2_short:0 "Intercepteur de fusée II"
 rocket_interceptor_equipment_3:0 "Intercepteur de fusée III"
 rocket_interceptor_equipment_3_desc:0 "Nous avons finalement résolu la plupart des problèmes liés aux moteurs de fusée et le Rocket Interceptor est désormais un solide défenseur des installations à courte portée."
 rocket_interceptor_equipment_3_short:0 "Intercepteur de fusée III"
 rocket_suicide_equipment_1:0 "Artisanat de grève suicide"
 rocket_suicide_equipment_1_short:0 "Artisanat suicidaire"
 rocket_suicide_equipment_1_desc:0 "Préparez-vous à une balade cahoteuse."
