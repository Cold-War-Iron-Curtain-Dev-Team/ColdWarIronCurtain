 HOL_fighter_equipment_0:0 "Koninklijke Luchtmacht"
 HOL_fighter_equipment_0_short:0 "Klu"
 HOL_fighter_equipment_0_desc:0 "La Royal Dutch Air Force est la branche de l'aviation militaire des forces armées néerlandaises. Elle a été créée en 1953 ; son ancêtre, le Luchtvaartafdeling (département de l'aviation) de l'armée néerlandaise, a été fondé en 1913."

 HOL_heavy_fighter_equipment_1:0 "Fokker G.1 Mercure"
 HOL_heavy_fighter_equipment_1_short:0 "Fokker G.1M"
 HOL_heavy_fighter_equipment_1_desc:0 "Le Fokker G.IM est un avion de combat lourd bimoteur néerlandais propulsé par des moteurs Bristol Mercury VIII, l'intercepteur principal des Néerlandais pendant leur brève lutte des jours de mai."
 HOL_heavy_fighter_equipment_2:0 "Guêpe Fokker G.1"
 HOL_heavy_fighter_equipment_2_short:0 "Fokker G.1W"
 HOL_heavy_fighter_equipment_2_desc:0 "Le Fokker G.IW est un chasseur lourd bimoteur néerlandais de 2 places créé à des fins d'exportation. L'avion est propulsé par des moteurs Pratt & Whitney SB4-G Twin Wasp Junior. Les exportations ne se sont jamais concrétisées lorsque les Pays-Bas ont été envahis."
 HOL_heavy_fighter_equipment_3:0 "de Havilland Mosquito F Mk.II"
 HOL_heavy_fighter_equipment_3_short:0 "Mosquito F Mk.II"

 HOL_jet_interceptor_equipment_1:0 "Fokker Aviolanda Météore F.3"
 HOL_jet_interceptor_equipment_1_short:0 "Météore F.3"
 HOL_jet_interceptor_equipment_2:0 "Sabre nord-américain F-86K 'Kaasjager'"
 HOL_jet_interceptor_equipment_2_short:0 "Sabre F-86K"
 HOL_jet_interceptor_equipment_3:0 "Sabre nord-américain F-86L 'Kaasjager'"
 HOL_jet_interceptor_equipment_3_short:0 "Sabre F-86L"
 HOL_jet_interceptor_equipment_4:0 "Hawker Chasseur F.4"
 HOL_jet_interceptor_equipment_4_short:0 "Chasseur F.4"

 HOL_high_mach_jet_interceptor_equipment_2:0 "Chasseur stellaire Lockheed F-104A"
 HOL_high_mach_jet_interceptor_equipment_2_short:0 "Chasseur F-104A"

 HOL_CAS_equipment_1:0 "Fokker C.X série I"
 HOL_CAS_equipment_1_short:0 "Fokker C.X"
 HOL_CAS_equipment_1_desc:0 "Le Fokker C.X a été conçu à l'origine pour l'armée royale néerlandaise des Indes orientales, afin de remplacer le Fokker C.V. Comme tous les avions Fokker de cette époque, il était de construction mixte, avec des structures d'ailes en bois et un châssis en tube d'acier soudé recouvert de plaques d'aluminium à l'avant de l'avion et de tissu à l'arrière. Le prototype a été construit en 1934 avec un moteur Rolls-Royce Kestrel V. "
 HOL_CAS_equipment_2:0 "Douglas DB-8A/3"
 HOL_CAS_equipment_2_short:0 "DB-8A"
 HOL_CAS_equipment_2_desc:0 "Les Pays-Bas, ayant un besoin urgent d'avions de combat modernes, passèrent une commande de 18 modèles 8A-3N en 1939, la version d'exportation du Douglas A-17, tous livrés à la fin de l'année."
 HOL_CAS_equipment_3:0 "Curtiss P-40N Kittyhawk"
 HOL_CAS_equipment_3_short:0 "P-40N Kittyhawk"
 HOL_CAS_equipment_3_desc:0 "Le P-40 était un avion de combat monomoteur entièrement métallique développé en 1938 et était une version modifiée du P-36 Hawk. Ce type serait utilisé par un nombre important de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il soit inférieur aux derniers P-47 et P-51, il servirait en première ligne jusqu'à la fin de la guerre. 200 pilotes alliés de 7 pays différents, des États-Unis aux pays du Commonwealth britannique en passant par l'Union soviétique, sont devenus des as du P-40. Malgré les désignations différentes pour le service du Commonwealth et le service soviétique, le surnom officiel du service américain est « Warhawk »."
 HOL_CAS_equipment_4:0 "Douglas A-26C Envahisseur"
 HOL_CAS_equipment_4_short:0 "Envahisseur A-26C"
 HOL_CAS_equipment_4_desc:0 "Le Douglas A-26 Invader est un bombardier léger bimoteur américain et un avion d'attaque au sol. Construit par Douglas Aircraft Company pendant la Seconde Guerre mondiale, l'Invader a également servi lors de plusieurs conflits majeurs de la guerre froide."

 HOL_jet_CAS_equipment_1:0 "République F-84E Thunderjet"
 HOL_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 HOL_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 HOL_jet_CAS_equipment_2:0 "République F-84G Thunderjet"
 HOL_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 HOL_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 HOL_jet_CAS_equipment_3:0 "République F-84F Thunderstreak"
 HOL_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 HOL_jet_CAS_equipment_3_desc:0 "Développé à partir du précédent F-84 Thunderjet, le F-84F était une variante à ailes en flèche du chasseur-bombardier conçue pour rapprocher ce type des performances du tant vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances de décollage tout en ayant une stabilité et un contrôle médiocres. Le type servirait dans une capacité limitée tout au long de sa vie, jusqu'en 1971. Son surnom est « Thunderstreak »."

