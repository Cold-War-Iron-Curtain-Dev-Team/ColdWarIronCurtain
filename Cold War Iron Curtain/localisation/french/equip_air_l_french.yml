 PRC_CAS_equipment_3:0 "Iliouchine Il-10"
 PRC_CAS_equipment_3_short:0 "Il-10"
 PRC_CAS_equipment_3_desc:0 "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à de nombreux défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 participa à certaines des dernières opérations de combat en Europe, ainsi qu'à la brève intervention soviétique dans la guerre du Pacifique. Au moment où l'Il-10 a pris sa retraite du service soviétique en 1956, l'armée de l'air a délaissé les avions purement CAS et d'attaque au sol pour se tourner vers les chasseurs-bombardiers. Son nom de rapport à l'OTAN est Beast."
 #PRC_CAS_equipment_4:0 "Ilyushin Il-16"
 #PRC_CAS_equipment_4_short:0 "Il-16"
 #PRC_CAS_equipment_4_desc:0 "The Ilyushin Il-16 is the final development of the Sturmovik ground-attack aircraft. It was in essence a scaled-down version of the Ilyushin Il-10, but was fitted with a newly developed Mikulin AM-43NV engine with the expectation that it would be faster and more maneuverable than its predecessor. Three aircraft were built for testing, but due to unforeseen engine troubles that could not be rectified, the project was cancelled."
 
 PRC_jet_CAS_equipment_1:0 "Iliouchine IL-10M"
 PRC_jet_CAS_equipment_1_short:0 "IL-10M"
 PRC_jet_CAS_equipment_1_desc:0 "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à de nombreux défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 participa à certaines des dernières opérations de combat en Europe, ainsi qu'à la brève intervention soviétique dans la guerre du Pacifique. Au moment où l'Il-10 a pris sa retraite du service soviétique en 1956, l'armée de l'air a délaissé les avions purement CAS et d'attaque au sol pour se tourner vers les chasseurs-bombardiers. Son nom de rapport à l'OTAN est Beast."
 
 PRC_jet_CAS_equipment_6:0 "Nanchang Q-5"
 PRC_jet_CAS_equipment_6_short:0 "Q-5"
 PRC_jet_CAS_equipment_7:0 "Nanchang Q-5A"
 PRC_jet_CAS_equipment_7_short:0 "Q-5A"
 PRC_jet_CAS_equipment_8:0 "Nanchang Q-5B"
 PRC_jet_CAS_equipment_8_short:0 "Q-5B"

 PRC_cas_stealth_equipment_1:0 "Nanchang JQ-5J"
 PRC_cas_stealth_equipment_1_short:0 "JQ-5J"
 PRC_cas_stealth_equipment_1_desc:0 "Tandem biplace de Q-5. Le fabricant a affirmé qu'il pouvait être utilisé comme contrôle aérien avancé comme l'OA-10A et fournir des informations de ciblage via des liaisons de données. La banquette arrière est 286 millimètres plus haute que la banquette avant, permet au pilote assis à l'arrière d'avoir un champ de vision de 5 degrés et la verrière s'ouvre vers la droite. Lorsqu'elle est utilisée comme entraîneur, la commande du cockpit arrière peut remplacer celle du cockpit avant."

 PRC_jet_light_equipment_1:0 "Mikoyan-Gourevitch MiG-9UTI"
 PRC_jet_light_equipment_1_short:0 "MiG-9UTI"
 PRC_jet_light_equipment_1_desc:0 "Pour assurer la préparation du personnel navigant de l'unité de combat des chasseurs à réaction de l'Armée de l'Air, l'équipe OKB-155, dirigée par A.I. Mikoyan, s'est vu confier le développement d'une modification biplace de l'avion MiG-9. Les travaux sur une nouvelle modification du MiG-9 en OKB-155 ont commencé en juillet 1946. La conception préliminaire du « jumeau » était prête fin octobre et conformément au calendrier de conception et de construction de l'avion, approuvé par Mikoyan le 26 août, le premier prototype a été déployé sur l'aérodrome. Prévu pour le 20 décembre 1946."
 PRC_jet_light_equipment_2:0 "Shenyang JJ-2"
 PRC_jet_light_equipment_2_short:0 "JJ-2"
 PRC_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 PRC_jet_light_equipment_3:0 "L-29 Delfin"
 PRC_jet_light_equipment_3_short:0 "L-29 Delfin"
 PRC_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (anglais ; Dolphin, nom de rapport OTAN ; Maya) est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 PRC_jet_light_equipment_4:0 "Chengdu JJ-7"
 PRC_jet_light_equipment_4_short:0 "JJ-7"
 PRC_jet_light_equipment_4_desc:0 "Les variantes d'entraîneur J-7 sont des versions d'entraînement développées en Chine pour des utilisations nationales en Chine, et cette série est fournie à la fois à la PLAAF et à la PLANAF. Basé sur le J-7II mais différent de 40 % du J-7II, équipé d'un siège éjectable domestique HTY-2, d'un radar télémétrique de type 226 et d'autres systèmes nationaux chinois. Les canons sont supprimés mais le pylône ventral peut transporter un canon jumelé semi-enterré de 23 mm."
 PRC_jet_light_equipment_5:0 "Hongdu JL-8"
 PRC_jet_light_equipment_5_short:0 "JL-8"
 PRC_jet_light_equipment_5_desc:0 "Le Hongdu JL-8, également connu sous le nom de Karakorum-8 ou K-8 en abrégé, est un avion d'entraînement à réaction intermédiaire biplace et un avion d'attaque léger conçu en République populaire de Chine par China Nanchang Aircraft Manufacturing Corporation. Le maître d'oeuvre est la Hongdu Aviation Industry Corporation."

 PRC_recon_equipment_0:0 "Tupolev Tu-2R"
 PRC_recon_equipment_0_short:0 "Tu-2R"
 PRC_recon_equipment_0_desc:0 "Version de reconnaissance du Tu-2."
 PRC_jet_recon_equipment_0:0 "ShenyangJZ-2"
 PRC_jet_recon_equipment_0_short:0 "JZ-2"
 PRC_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé le développement d'une variante de reconnaissance de première ligne du MiG-15 avec une caméra AFA-BA/40, qui fournit une largeur de levé en bande de 0,9 à 4,5 km avec une longueur de route de photographie de 90 à 450 km à des altitudes de 2 000 à 10 000 m. Un seul canon NR-23 a été installé sur l'avion. Pour augmenter la portée du scout, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur \"Barium-M\" et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur la machine."
 PRC_jet_recon_equipment_1:0 "ChengduJZ-8"
 PRC_jet_recon_equipment_1_short:0 "JZ-8"
 PRC_jet_recon_equipment_1_desc:0 "Version reconnaissance. Également signalé sous les noms de J-8E, J-8R et J-8V. Pense être converti du J-8A ; au moins 6 connus. Conserve l'armement des armes à feu ; capteur sous le nez similaire à celui des variantes Su-17/20/22 ; Nacelle centrale d'apparence similaire à celle portée par le Mig-21R, intégrant une grande fenêtre de caméra rectangulaire ou une antenne SLAR, en service dans la PLA Air Force."
 PRC_jet_recon_equipment_2:0 "ShenyangJ-11D"
 PRC_jet_recon_equipment_2_short:0 "J-11D"
 PRC_jet_recon_equipment_2_desc:0 "Variante du Shenyang J-11, équipée d'un radar fixe à balayage électronique, d'un IRST et d'une capacité de tir de missiles air-air à imagerie/infrarouge (IIR) plus lourds. La cellule utilise davantage de matériaux composites, en particulier dans les entrées d'air des moteurs, pour une observabilité radar moindre. Les ailes ont chacune trois points d'attache. Des rapports non confirmés affirment qu'il dispose d'un nouveau système de commande de vol électrique, d'un cockpit en verre, de systèmes de guerre électronique améliorés et d'une version améliorée du moteur WS-10A."

 PRC_tac_bomber_equipment_0:0 "Tupolev SB2M-100"
 PRC_tac_bomber_equipment_0_short:0 "SB2M-100"
 PRC_tac_bomber_equipment_0_desc:0 "Le Tupolev ANT-40, également connu sous son nom de service Tupolev SB et son co-nom de développement TsAGI-40, était un bombardier monoplan bimoteur à trois places à grande vitesse, dont le premier vol a eu lieu en 1934. La conception du Tupolev était avancée mais manquait de raffinement, au grand désarroi des équipages, du personnel de maintenance et de Staline, qui a souligné qu '\"il n'y a pas de banalités dans l'aviation\"."

 PRC_tac_bomber_equipment_1:0 "Kawasaki Ki-48"
 PRC_tac_bomber_equipment_1_short:0 "Ki-48"
 PRC_tac_bomber_equipment_1_desc:0 "Le Kawasaki Ki-48 était un bombardier léger bimoteur japonais utilisé pendant la Seconde Guerre mondiale. Son nom de rapport allié était Lily."
 PRC_tac_bomber_equipment_2:0 "Petliakov Pe-2B"
 PRC_tac_bomber_equipment_2_short:0 "Pe-2B"
 PRC_tac_bomber_equipment_2_desc:0 "Le Petlyakov Pe-2 était un bombardier en piqué bimoteur soviétique utilisé pendant la Seconde Guerre mondiale. L'un des avions d'attaque tactique les plus remarquables de la guerre, il s'est également révélé efficace comme chasseur lourd, comme chasseur de nuit (variante Pe-3) et comme avion de reconnaissance. À bien des égards, il ressemblait au britannique en bois De Havilland Mosquito. Le Pe-2 était, numériquement, le bombardier soviétique le plus important de la Seconde Guerre mondiale, représentant à son apogée 75 % de la force de bombardiers bimoteurs soviétiques."
 PRC_tac_bomber_equipment_3:0 "Tupolev Tu-2"
 PRC_tac_bomber_equipment_3_short:0 "Ma-2"
 PRC_tac_bomber_equipment_3_desc:0 "Le Tu-2 était un bombardier de jour bimoteur à grande vitesse développé en 1941. Il a été conçu pour être la réponse soviétique au bombardier moyen Junkers Ju-88, conçu pour répondre aux exigences d'un bombardier à grande vitesse ou d'un bombardier en piqué, avec une grande charge de bombes interne et une vitesse similaire à celle d'un chasseur monoplace. Il s'est avéré suffisamment performant pour relever le défi, et des variantes de bombardiers torpilleurs, de reconnaissance et de chasseurs lourds existaient, jouant un rôle clé dans les offensives finales soviétiques de la Seconde Guerre mondiale. Son nom de rapport de l'OTAN d'après-guerre est Bat."

