 FRA_cv_mr_stealth_fighter_equipment_1:0 "Dassault Rafale M variante F3-R"
 FRA_cv_mr_stealth_fighter_equipment_1_short:0 "Rafale M"
 FRA_cv_mr_stealth_fighter_equipment_1_desc:0 "Identique au Rafale C F3-R mais version embarquée pour l'aviation navale française, entrée en service en 2001. Pour les opérations sur porte-avions, le modèle M a une cellule renforcée, un train avant plus long pour offrir une assiette plus cabrée, un crochet de queue plus grand entre les moteurs et une échelle d'embarquement intégrée. Par conséquent, le Rafale M pèse environ 500 kg (1 100 lb) de plus que le Rafale C. C'est le seul type de chasseur non américain autorisé à opérer depuis les ponts des porte-avions américains, en utilisant des catapultes et leurs dispositifs d'arrêt, comme l'a démontré en 2008 lorsque six Rafale de la Flottille 12F ont été intégrés à l'exercice d'interopérabilité de l'USS Theodore Roosevelt Carrier Air Wing."
 
