 AST_jet_tac_bomber_equipment_4_desc:0 "L'Aardvark est un avion d'interdiction supersonique doté d'un radar épousant le terrain, de turboréacteurs à postcombustion avancés et d'ailes à flèche variable. Cela permet des frappes à grande vitesse et à basse altitude en profondeur en territoire ennemi."
