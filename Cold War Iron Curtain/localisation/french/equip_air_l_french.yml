#Soviet Missile Forces

 SOV_slbm_equipment_1:0 "R-11FM Scud"
 SOV_slbm_equipment_1_short:0 "R-11FM Scud"
 SOV_slbm_equipment_1_desc:0 "Le R-11FM est la variante navale du R-11 Zemlya, désignation OTAN Scud-A. Il a été testé pour la première fois sur une rampe de lancement à Kapustin Yar en 1955, et a été lancé à partir d'un sous-marin du projet 611 (classe Zulu) plus tard cette année-là. Le missile a été désigné opérationnel en 1959, connu sous le nom de système de lancement D-1, et a été le premier SLBM au monde. Il a été lancé 77 fois en service au total, dont 59 avec succès. Il a été complètement supprimé en 1963. "
 SOV_slbm_equipment_2:0 "R-13 Sercq"
 SOV_slbm_equipment_2_short:0 "R-13 Sercq"
 SOV_slbm_equipment_2_desc:0 "Le R-13 remplaçait le R-11FM, son développement ayant été autorisé par le Makayev Rocket Design Bureau en 1955. Les spécifications techniques finales furent approuvées au début de 1956 et le R-13 entra en service en 1961. Le Sark fut le premier SLBM soviétique à utiliser des propulseurs à vernier pour changer de cap en plus des ailerons arrière, ce qui augmenta la stabilité, l'aérodynamisme et la portée. Le R-13 pouvait parcourir 600 km et transporter jusqu'à une ogive de 2 mégatonnes. Il a été retiré du service en 1975."
 SOV_slbm_equipment_3:0 "R-21 Serbe"
 SOV_slbm_equipment_3_short:0 "R-21 Serbe"
 SOV_slbm_equipment_3_desc:0 "Le R-21 était le premier missile soviétique pouvant être lancé depuis un sous-marin immergé. Son développement a commencé en 1958, avec des vols réussis deux ans plus tard. Le R-21 avait une portée plus de deux fois supérieure à celle de ses prédécesseurs, soit 1 650 km, et pouvait transporter une ogive de 800 kt. Introduit pour la première fois en 1963, il a été retiré en 1987"
 SOV_slbm_equipment_4:0 "R-27 Serbe"
 SOV_slbm_equipment_4_short:0 "R-27 Serbe"
 SOV_slbm_equipment_4_desc:0 "Le R-27 était très similaire au R-21 en termes de conception et d'objectif. Entré en service seulement 5 ans après le R-21 en 1968, il bénéficiait d'améliorations significatives en termes de performances et de capacités, avec une portée opérationnelle de 2 400 km et une ogive de 1 mégatonne. 1 800 missiles furent finalement fabriqués et ils furent retirés du service en 1990."
 SOV_slbm_equipment_5:0 "Mouche à scie R-29"
 SOV_slbm_equipment_5_short:0 "Mouche à scie R-29"
 SOV_slbm_equipment_5_desc:0 "Le R-29 fut le premier SLBM moderne à être introduit dans la marine soviétique. Il a été déployé en 1974, avec une portée plus de 3 fois supérieure à celle du R-27, à 7 700 km, et pouvait transporter une ogive plus grande, la poussant à plus de 1 mégatonne. Il est toujours utilisé aujourd'hui et un nombre inconnu se trouve actuellement à bord des sous-marins russes."
 SOV_slbm_equipment_6:0 "Skiff R-29RM"
 SOV_slbm_equipment_6_short:0 "Skiff R-29RM"
 SOV_slbm_equipment_6_desc:0 "Le R-29RM a été conçu après le R-29, mais avec un objectif différent en tête. Bien qu'il ait une charge utile beaucoup plus petite, avec 4 ogives de 100 kt dans un MIRV, il avait une portée plus longue de 8 800 km, et davantage pouvait être installé dans 1 sous-marin. Cependant, contrairement au R-29, il a été retiré du service en 2010. "
 SOV_slbm_equipment_7:0 "Esturgeon R-39"
 SOV_slbm_equipment_7_short:0 "Esturgeon R-39"
 SOV_slbm_equipment_7_desc:0 "Le développement du R-39 a commencé au début des années 1970, avec des tests initiaux en 1979 et un déploiement en 1983. Au déploiement complet, 120 missiles étaient en service, chacun transportant 10 ogives de 150 kt et ayant une portée de 8 300 km. Dans le cadre des accords START I et II, leur destruction a commencé progressivement à partir de 1996, et le dernier R-39 a été mis hors service en 2004."
 
 SOV_irbm_equipment_1:0 "R-5 Pobéda"
 SOV_irbm_equipment_1_short:0 "R-5 Pobéda"
 SOV_irbm_equipment_1_desc:0 "Le R-5 fut la première tentative soviétique de fabrication d'un missile balistique de théâtre, ou IRBM. La variante du R-5 réellement produite était le R-5M, qui fut le premier missile nucléaire déployé par l'URSS. Il avait une portée de 1 200 km et pouvait transporter une ogive thermonucléaire jusqu'à 1 mégatonne. Il a été distribué pour la première fois en mai 1956 et installé dans les bases aériennes de l'Allemagne de l'Est à la fin de 1959. Au total, 48 lanceurs et 200 missiles ont été produits au moment de son retrait en 1967."
 SOV_irbm_equipment_2:0 "R-12 Dvina"
 SOV_irbm_equipment_2_short:0 "R-12 Dvina"
 SOV_irbm_equipment_2_desc:0 "Le R-12, successeur du R-5, était l'une des fusées soviétiques les plus produites de la guerre froide, avec 2 335 exemplaires fabriqués, et constituait l'essentiel de la menace des missiles offensifs soviétiques contre l'Europe occidentale. Le R-12 a été produit pour la première fois en octobre 1958 et mis en service en 1959. Il avait une portée maximale de 2 080 km et pouvait transporter jusqu'à une ogive thermonucléaire de 2,3 mégatonnes. Le placement des R-12 à Cuba a déclenché la crise des missiles cubains en 1963."
 SOV_irbm_equipment_3:0 "R-14 Tchousovaïa"
 SOV_irbm_equipment_3_short:0 "R-14 Tchousovaïa"
 SOV_irbm_equipment_3_desc:0 "Le Premier ministre de l'URSS a autorisé le développement du R-14 le 2 juillet 1958 et les essais en vol ont été achevés à la fin de 1961. La version lancée par Silo a été autorisée en mai 1960 et a été testée au début de 1962. Le Chusovaya avait une portée de 4 500 km et pouvait transporter une ogive allant jusqu'à 2,3 mégatonnes. Il fut mis en service en avril 1961 et les 6 derniers furent démolis en 1989 suite à un traité avec les États-Unis."
 SOV_irbm_equipment_4:0 "Coquin RT-15"
 SOV_irbm_equipment_4_desc:0 "Le RT-15 était une des premières tentatives soviétiques visant à créer un IRBM plus mobile et a été conçu pour être lancé à partir d'un châssis T-10. Il était censé être un système de lancement rapide avec une portée maximale de 2 500 km et capable de transporter une ogive de 1 Mt. Cependant, il n'a jamais été accepté dans le service général, avec un seul bataillon qui l'a utilisé, en raison d'une électronique défectueuse et d'un système d'aide au lancement faible."
 SOV_irbm_equipment_4_short:0 "Coquin RT-15"
 SOV_irbm_equipment_5:0 "Pionnier RSD-10"
 SOV_irbm_equipment_5_short:0 "Pionnier RSD-10"
 SOV_irbm_equipment_5_desc:0 "Le RSD-10 a été développé en 1966 et la conception initiale a été approuvée en 1968. Destiné à remplacer ou à augmenter les R-12 et R-14, il a été déployé pour la première fois en 1976 et distribué dans tout le Pacte de Varsovie, car le RSD-10 était le premier missile soviétique capable de frapper chirurgicalement des cibles plus petites. Plus de 650 exemplaires furent finalement produits, chacun ayant une portée de 5 500 km et capable de transporter jusqu'à 1,6 Mt d'ogive, et plus tard, un MIRV. Tous ont été détruits conformément au Traité sur les forces nucléaires à portée intermédiaire de 1991."
 SOV_irbm_equipment_6:0 "RT-21M Température 2S"
 SOV_irbm_equipment_6_short:0 "RT-21M Température 2S "
 SOV_irbm_equipment_6_desc:0 "Bien que techniquement classé par l'OTAN comme ICBM, le RT-21M avait une portée plus petite que la plupart, ainsi qu'une petite ogive, plafonnant à un maximum de 1 mégatonne. Il reposait sur un lanceur mobile et a été conçu et développé à peu près en même temps que le RSD-10. Cependant, en raison de tous les traités impliquant les armes nucléaires à la fin du 20ème siècle, le programme n'a jamais vraiment démarré et au milieu des années 1980, l'ensemble du projet a été abandonné."
 SOV_irbm_equipment_7:0 "RSD-10 Pionnier 3"
 SOV_irbm_equipment_7_short:0 "RSD-10 Pionnier 3"
 SOV_irbm_equipment_7_desc:0 "Le RSD-10 Pioneer 3 est une variante améliorée du RSD-10 original. L'avancée la plus importante concerne la portée maximale du RSD-10 3, puisqu'il a augmenté de 2 000 km, passant de 5 500 à 7 500. Développé à la fin des années 1970, il a été introduit pour la première fois dans l'armée soviétique en 1980 et transportait une triple ogive nucléaire MIRV, pouvant atteindre 50 kt chacune. Le Pioneer 3 a connu un sort similaire à l'original à la suite du Traité sur les forces nucléaires à portée intermédiaire."
 
 SOV_srbm_equipment_1:0 "R-1 Scunner"
 SOV_srbm_equipment_1_short:0 "R-1 Scunner"
 SOV_srbm_equipment_1_desc:0 "Le R-1 Scunner n'était rien de plus qu'un V-2 Rocket glorifié. Il a été produit et conçu par les mêmes scientifiques allemands qui ont créé le V-2, car ils avaient été capturés par les Soviétiques lorsque l'Armée rouge a pris la principale usine de fabrication du V-2. La raison pour laquelle les Soviétiques voulaient une copie du V-2 était davantage pour apprendre les techniques et les processus impliqués dans la construction de fusées que pour la valeur tactique réelle du R-1. La production fut personnellement autorisée par Staline (comme tous les autres missiles à l'époque) en 1947 et le Scunner entra en service en novembre 1950."
 SOV_srbm_equipment_2:0 "R-2 Frère/Soeur"
 SOV_srbm_equipment_2_short:0 "R-2 Frère/Soeur"
 SOV_srbm_equipment_2_desc:0 "Le R-2 était une amélioration majeure par rapport au R-1. Premièrement, l'autonomie a plus que doublé, passant à 600 km. Il avait également une coque plus solide, moins de problèmes de vibrations dus à un cône arrière en acier et, bien qu'il soit presque deux fois plus lourd que le R-1, il était tout aussi précis, grâce aux progrès du contrôle radio. Le premier test a eu lieu fin 1949 et il a été accepté pour le service en 1951, mais n'a été distribué à grande échelle que deux ans plus tard. Le R-2 était la dernière contrefaçon allemande directe, car les Soviétiques avaient désormais suffisamment d'expérience pour créer leurs propres modèles. "
 SOV_srbm_equipment_3:0 "R-11 Scud A"
 SOV_srbm_equipment_3_short:0 "R-11 Scud A"
 SOV_srbm_equipment_3_desc:0 "Le R-11 a été conçu sur la base de la variante Wasserfall (anti-aérienne) du V-2, mais n'était pas une imitation directe. En juillet 1955, la première version du R-11 fut acceptée dans l'armée soviétique. Cependant, le R-11M, variante définitive du R-11 et capable d'emporter une tête nucléaire, fut accepté 3 ans plus tard en 1958. Lorsqu'il était chargé d'une tête nucléaire, il avait une portée maximale de 170 km. En conséquence, il a été principalement lancé à partir de plates-formes de frappe mobiles (châssis IS-2 modifié)."
 SOV_srbm_equipment_4:0 "R-17 Scud B"
 SOV_srbm_equipment_4_short:0 "R-17 Scud B"
 SOV_srbm_equipment_4_desc:0 "Le Scud B était le missile le plus lancé - et l'un des plus produits, avec plus de 7 000 exemplaires - de la guerre froide. Conçu pour la première fois en 1959, il est entré en service en 1964. Il s'agissait d'une grande amélioration par rapport au précédent R-11, et pouvait aller plus loin, à 300 km, et transporter n'importe quoi, depuis une ogive nucléaire jusqu'à un char VX, en passant par une bombe HE. Le R-17 a été largement utilisé au Moyen-Orient, notamment lors de la guerre du Yom Kippour et de la guerre Iran-Irak. Il a été retiré du service soviétique/russe depuis un certain temps, mais certains, comme la Corée du Nord, l'utilisent encore. "
 SOV_srbm_equipment_5:0 "OTR-22 Temp S"
 SOV_srbm_equipment_5_short:0 "OTR-22 Temp S"
 SOV_srbm_equipment_5_desc:0 "L'OTR-22 Temp S était une variante améliorée du TR-1 Temp. Son concept était similaire au Scud-B et utilisait le même lanceur, mais n'était pas largement produit. Il est entré en service en 1968 et avait une portée maximale de 900 km et une seule ogive de 500 kt. Il a été retiré du service en 1989."
 SOV_srbm_equipment_6:0 "OTR-21 Tochka A"
 SOV_srbm_equipment_6_short:0 "OTR-21 Tochka A"
 SOV_srbm_equipment_6_desc:0 "L'OTR-21 était un système de lancement mobile, conçu pour être utilisé aux côtés d'une division d'infanterie régulière pour lancer des frappes précises sur des emplacements ennemis importants, comme des ponts ou des centres de commandement, ce qui le différenciait des SRBM précédents. Il avait une portée maximale de 70 km, avec une ogive de 100 kt qui pouvait être échangée contre une arme chimique, HE ou à fragmentation ; ces deux facteurs démontrent très clairement son objectif tactique. Il est entré en service en 1975 et ses trois variantes sont encore utilisées aujourd'hui. "
 SOV_srbm_equipment_7:0 "OTR-23 Ok"
 SOV_srbm_equipment_7_short:0 "OTR-23 Ok"
 SOV_srbm_equipment_7_desc:0 "L'OTR-23 a été conçu pour remplacer le Scud-B, alors obsolète, vers la fin de la guerre froide. Il a été développé au milieu des années 70 et est entré en service en 1979. Sa portée opérationnelle était de 500 km, ce qui était plus court que celui du Scud, mais il était beaucoup plus précis et transportait une ogive plus grande. Il a été interdit par le Traité sur les forces nucléaires à portée intermédiaire de 1991."
 SOV_srbm_equipment_8:0 "OTR-21 Tochka B"
 SOV_srbm_equipment_8_short:0 "OTR-21 Tochka B"
 SOV_srbm_equipment_8_short_desc:0 "L'OTR-21 Tochka-B était une version améliorée du Tochka-A. Développé pour la première fois en 1986, il est entré en service en 1989. Un propulseur amélioré a poussé sa portée maximale jusqu'à 120 km, mais il transportait la même ogive et servait par ailleurs le même objectif que le Tochka-A. Il est toujours en service aujourd'hui."
 SOV_srbm_equipment_9:0 "9K720 Iskander"
 SOV_srbm_equipment_9_short:0 "9K720 Iskander"
 SOV_srbm_equipment_9_desc:0 "Le 9K720 a été conçu pour remplacer les OTR-21 au début de 2020. Les travaux de développement ont commencé en 1986 et se sont poursuivis sans être affectés par l'effondrement de l'Union soviétique, puisque les premiers lancements ont eu lieu en 1996. La version la plus récente, l'Iskander-M, a une portée de 500 km et peut transporter tout type d'ogive, nucléaire ou autre, jusqu'à 700 kg. La plupart de l'armée russe utilise désormais le 9K720, mais certains anciens systèmes Tochka-B subsistent. "
 
 SOV_icbm_equipment_1:0 "R-9 Desna"
 SOV_icbm_equipment_1_short:0 "R-9 Desna"
 SOV_icbm_equipment_1_desc:0 "Le R-9 Desna était un ICBM à deux étages, conçu en 1959 et testé pour la première fois en 1961. Le missile, capable de transporter une charge utile de 1 600 kg/une ogive de 5 Mt sur environ 11 000 km, était non seulement très précis, mais était également beaucoup plus utile sur le plan tactique pour l'Union soviétique, car il pouvait être ravitaillé et prêt à être lancé en moins de 20 minutes. Il a été introduit en service actif pour la première fois en 1964 et a été utilisé par 3 régiments terrestres et 1 régiment de silos. En 1976, tous les R-9 étaient mis hors service."
 SOV_icbm_equipment_2:0 "RT-2 sauvage"
 SOV_icbm_equipment_2_short:0 "RT-2 sauvage"
 SOV_icbm_equipment_2_desc:0 "Le RT-2 Savage était un ICBM à trois étages comparable au Minuteman américain. Il a terminé ses essais en vol au début de 1966 et est entré en service en 1968. Il avait une portée opérationnelle de 10 186 km et était équipé d'une seule ogive de 600 kt. Environ 100 exemplaires ont été construits et le RT-2 a été retiré du service en 1976 avec les R-9 restants."
 SOV_icbm_equipment_3:0 "R-36M Satan"
 SOV_icbm_equipment_3_short:0 "R-36M Satan"
 SOV_icbm_equipment_3_desc:0 "Le R-36M était une version bien améliorée et bien plus meurtrière du R-36. Un ICBM à deux étages capable de parcourir 16 000 km, il pouvait transporter un nombre inégalé de 10 ogives ou plus et, grâce à sa conception, son temps de rechargement rapide et son grand nombre de véhicules de rentrée, il donnait aux Soviétiques un avantage en matière de capacités de première frappe. Le développement du R-36M a commencé à la fin des années 1970 et, à la chute de l'URSS, il existait 308 silos de lancement pour le missile, chacun pouvant en contenir au moins deux. Certains R-36M sont encore en service aujourd'hui."
 SOV_icbm_equipment_4:0 "RT-23 Molodets"
 SOV_icbm_equipment_4_short:0 "RT-23 Molodets"
 SOV_icbm_equipment_4_desc:0 "Le RT-23 a été conçu pour être un système d'armes à plate-forme de lancement multiple, capable de tirer depuis un silo et un wagon. Il a été testé au début des années 80 et déployé en 1987. La portée opérationnelle du RT-23 était de 11 000 km et il pouvait transporter 10 MIRV de 550 kt. En septembre 1991, environ 90 exemplaires ont été déployés et, lorsque l'Union soviétique s'est effondrée, l'usine de production a été fermée."
 SOV_icbm_equipment_5:0 "RT-2PM2 Topol-M"
 SOV_icbm_equipment_5_short:0 "RT-2PM2 Topol-M"
 SOV_icbm_equipment_5_desc:0 "Le RT-2PM2 est l'un des derniers modèles d'ICBM en service en Russie et a été la première fusée russe produite après la chute de l'Union soviétique. Développé à la fin des années 1980 en réponse à l'Initiative de défense stratégique américaine, il est finalement entré en service en 1998. Arme à 3 étages, le RT-2PM2 a une portée maximale de 11 500 km et une ogive de 1 mégatonne. Actuellement, environ 90 sont déployés."
 
 SOV_cruisemissile_equipment_0:0 "Chelomey 14Kh"
 SOV_cruisemissile_equipment_0_short:0 "Chelomey 14Kh"
 SOV_cruisemissile_equipment_0_desc:0 "En octobre 1944, piqué par les fusées V-1 et V-2, Staline chargea Vladimir Chelomey de rechercher et de concevoir une arme similaire. La première tentative de Chelomey était un V-1 d'ingénierie inverse appelé 10kh, propulsé par le même moteur qu'un V-1. Le 14kh était une version révisée et améliorée, avec des stabilisateurs et des ailes, ainsi qu'une meilleure conception structurelle globale et une plus grande portée opérationnelle."
 SOV_cruisemissile_equipment_1:0 "Chelomey 18Kh"
 SOV_cruisemissile_equipment_1_short:0 "Chelomey 18Kh"
 SOV_cruisemissile_equipment_1_desc:0 "Le 18Kh fut plus tard sur la ligne de développement des missiles de Chelomey. Lors de sa production, il présentait des améliorations similaires au 14Kh que le 14Kh avait sur le 10Kh. Il pouvait aller plus loin, avait une ogive plus grosse, était plus stable et disposait d'un moteur Chelomey D-6 plus puissant. Il s'agissait cependant encore d'une conception très précoce et rudimentaire dans le domaine des missiles de croisière."
 SOV_cruisemissile_equipment_2:0 "La-350 Bouria"
 SOV_cruisemissile_equipment_2_short:0 "La-350 Bouria"
 SOV_cruisemissile_equipment_2_desc:0 "Le Burya était un missile de croisière intercontinental supersonique développé pour la première fois en 1954. Il pouvait parcourir 6 000 km à mach 3 avec une petite ogive de la taille d'une bombe, fonctionnant sur un moteur à deux étages composé d'un propulseur de fusée et d'un statoréacteur. Cependant, le projet a été annulé en 1960 en raison des avantages des IR et des ICBM, à savoir une plus grande simplicité et une relative invulnérabilité à l'interception, que le La-350 ne possédait pas."
 SOV_cruisemissile_equipment_3:0 "RSS-40 Bourane"
 SOV_cruisemissile_equipment_3_short:0 "RSS-40 Bourane"
 SOV_cruisemissile_equipment_3_desc:0 "Le Buran était un missile de croisière intercontinental similaire dans son concept au La-350, et a en fait été développé parallèlement au Burya, recevant l'autorisation des semaines après le La-350. Il avait une plus grande portée, une vitesse de pointe plus élevée et pouvait transporter une ogive plus grande, mais connut le même sort que le La-350 lorsqu'il fut annulé en novembre 1957."
 SOV_cruisemissile_equipment_4:0 "Radouga RK-55"
 SOV_cruisemissile_equipment_4_short:0 "Radouga RK-55"
 SOV_cruisemissile_equipment_4_desc:0 "Le RK-55 était un missile de croisière lancé à la fois par terre et par sous-marin, capable de transporter une ogive nucléaire. Développé pour la première fois à la fin des années 1960, le RK-55 a subi des vols d'essai en 1976. Alors qu'il était sur le point d'entrer en service en 1987, il a été interdit en vertu des directives établies par le Traité sur les forces nucléaires à portée intermédiaire. Des rapports provenant de sources contemporaines indiquent qu'il a été converti en arme conventionnelle et qu'il est encore utilisé aujourd'hui par les sous-marins."
 SOV_cruisemissile_equipment_5:0 "Calibre 3M-54"
 SOV_cruisemissile_equipment_5_short:0 "Calibre 3M-54"
 SOV_cruisemissile_equipment_5_desc:0 "Le 3M-54 est un missile de croisière supersonique extrêmement polyvalent et touche-à-tout. Capable d'être lancé depuis le sol, les airs, ainsi que depuis des navires de surface et des sous-marins, il est aujourd'hui largement utilisé par l'armée russe. Développé pour la première fois à la fin des années 1980, le 3M-54 est entré en service en 1994. Il a une portée de 660 km et peut transporter jusqu'à 500 kg d'arme nucléaire ou conventionnelle."
 SOV_cruisemissile_equipment_6:0 "3M22Zircon"
 SOV_cruisemissile_equipment_6_short:0 "3M22Zircon"
 SOV_cruisemissile_equipment_6_desc:0 "Le 3M22 est un missile de croisière hypersonique anti-navire propulsé par scramjet actuellement en cours de test en Russie. Les prototypes ont été lancés pour la première fois en 2012 à partir d'un Tu-22M3, puis à partir d'une plateforme au sol en 2016. En 2019, Vladimir Poutine a annoncé qu'il était capable d'atteindre Mach 9. Il aurait une portée d'environ 500 km et serait capable d'emporter jusqu'à 400 kg d'ogive."
 
