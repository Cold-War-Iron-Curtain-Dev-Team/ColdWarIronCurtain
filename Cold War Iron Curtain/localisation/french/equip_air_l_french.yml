 POR_jet_multirole_equipment_8:0 "Faucon de combat F-16A de General Dynamics"
 POR_jet_multirole_equipment_8_short:0 "Faucon de combat F-16A"
 POR_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger avec une maniabilité et une stabilité bien équilibrées. Il possède un corps d'aile mixte exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Appelé « Fighting Falcon », son coût relativement faible et sa puissance élevée sont la raison pour laquelle il a été adapté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle best-seller ont été fabriqués."
 POR_jet_multirole_equipment_9:0 "General Dynamics F-16A Block 15 OCU (mises à niveau des capacités opérationnelles) Fighting Falcon"
 POR_jet_multirole_equipment_9_short:0 "F-16A Bloc 15 OCU"
 POR_jet_multirole_equipment_9_desc:0 "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 POR_jet_multirole_equipment_10:0 "General Dynamics F-16AM Block 15 MLU (Mise à jour à mi-vie) Fighting Falcon"
 POR_jet_multirole_equipment_10_short:0 "F-16AM Bloc 15 MLU"
 POR_jet_multirole_equipment_10_desc:0 "Le package MLU (Mid-Life Update) du F-16 qui en résulte a été conçu pour mettre à niveau le cockpit et l'avionique à l'équivalent de ceux du F-16C/D Block 50/52 ; ajouter la possibilité d'utiliser des missiles air-air guidés par radar ; et d'une manière générale, améliorer les performances opérationnelles et améliorer la fiabilité, la capacité de soutien et la maintenabilité de l'avion."

 POR_jet_light_equipment_1:0 "Étoile filante Lockheed T-33A"
 POR_jet_light_equipment_1_short:0 "Étoile filante T-33A"
 POR_jet_light_equipment_2:0 "Reims Cessna FTB-337G Skymaster"
