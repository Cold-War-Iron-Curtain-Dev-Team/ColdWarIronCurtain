 ISR_mr_stealth_fighter_equipment_1_short:0 "F-35I Adir"
 ISR_mr_stealth_fighter_equipment_1_desc:0 "Le F-35I Adir signifiant « Génial » ou « Mighty One » est un F-35A avec des modifications israéliennes uniques. Les États-Unis ont d'abord refusé d'autoriser de tels changements avant d'autoriser Israël à intégrer ses propres systèmes de guerre électronique, notamment des capteurs et des contre-mesures. L'ordinateur principal dispose d'une fonction plug-and-play pour les systèmes complémentaires ; les propositions incluent une nacelle de brouillage externe et de nouveaux missiles air-air israéliens et des bombes guidées dans les baies d'armes internes."

