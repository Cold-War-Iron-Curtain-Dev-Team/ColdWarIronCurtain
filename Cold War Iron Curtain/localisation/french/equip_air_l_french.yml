 POR_jet_multirole_equipment_1:0 "République F-47D-30-RA Thunderbolt"
 POR_jet_multirole_equipment_1_short:0 "F-47D-30-RA Coup de tonnerre"
 POR_jet_multirole_equipment_2:0 "Sabre nord-américain F-86A"
 POR_jet_multirole_equipment_2_short:0 "Sabre F-86A"
 POR_jet_multirole_equipment_2_desc:0 "Le F-86 est un chasseur à réaction à ailes en flèche développé et introduit à la fin des années 1940 à partir de recherches capturées par les Allemands. La conception de l'avion le rendait capable d'atteindre des vitesses transsoniques et une grande maniabilité, caractéristiques qui le rendaient capable de gérer son célèbre rival, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, aux côtés de ses variantes canadiennes et australiennes réunies, en ferait l'avion de combat occidental le plus produit de l'histoire de l'aviation."
 POR_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 POR_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 POR_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 POR_jet_multirole_equipment_4:0 "Sabre nord-américain F-86F-30-NA"
 POR_jet_multirole_equipment_4_short:0 "Sabre F-86F-30-NA"
 POR_jet_multirole_equipment_4_desc:0 "D'autres améliorations du sabre F-86F pour le rendre plus efficace au combat contre les nouveaux avions équipés de postcombustion en les armant de points d'emport et de rails pour lancer des missiles AIM-9B Sidewinders."
