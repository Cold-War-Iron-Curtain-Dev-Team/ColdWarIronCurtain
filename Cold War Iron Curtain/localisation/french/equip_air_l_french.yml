 PRC_cv_mr_stealth_fighter_equipment_1_desc:0 "Le Shenyang FC-31 Gyrfalcon, également connu sous le nom de J-31 ou J-35, est un prototype chinois d'avion de combat biréacteur de taille moyenne de 5e génération développé par Shenyang Aircraft Corporation (SAC). Le surnom officiel publié par SAC est \"Gyrfalcon\", bien qu'il ait également été appelé \"F-60\" ou \"J-21 Snowy Owl\" dans certains médias, ou \"Falcon Hawk\" par certains passionnés militaires."

