 #UAV CAS
 cas_uav_equipment_1:0 "Véhicule aérien de combat sans pilote I"
 cas_uav_equipment_1_short:0 "UCAV JE"
 cas_uav_equipment_1_desc:0 "Véhicule aérien de combat sans pilote de première génération. Cette génération comprend des capteurs performants et des armements limités."
 cas_uav_equipment_2:0 "Véhicule aérien de combat sans pilote II"
 cas_uav_equipment_2_short:0 "UCAV II"
 cas_uav_equipment_2_desc:0 "Véhicule aérien de combat sans pilote de deuxième génération. Cette génération comprend encore plus de capteurs et d'armements performants."
 cas_uav_equipment_3:0 "Véhicule aérien de combat sans pilote III"
 cas_uav_equipment_3_short:0 "UCAV III"
 cas_uav_equipment_3_desc:0 "Véhicule aérien de combat sans pilote de troisième génération. Cette génération comprend encore plus de capteurs, un équipement d'armes important et des capacités de guerre électronique."
 
 #Naval CAS
 naval_uav_equipment_1:0 "Véhicule aérien sans pilote naval I"
 naval_uav_equipment_1_short:0 "Drone naval I"
 naval_uav_equipment_1_desc:0 "Véhicule aérien sans pilote navalisé de première génération."
 naval_uav_equipment_2:0 "Véhicule aérien sans pilote naval II"
 naval_uav_equipment_2_short:0 "Drone naval II"
 naval_uav_equipment_2_desc:0 "Véhicule aérien sans pilote navalisé de deuxième génération."
 naval_uav_equipment_3:0 "Véhicule aérien sans pilote naval III"
 naval_uav_equipment_3_short:0 "Drone naval III"
 naval_uav_equipment_3_desc:0 "Véhicule aérien sans pilote navalisé de troisième génération."

 ############USA - WW2
 
 USA_fighter_equipment_1:0 "Curtiss P-40 Warhawk"
 USA_fighter_equipment_1_short:0 "Faucon de guerre P-40"
 USA_fighter_equipment_1_desc:0 "Le P-40 était un avion de combat monomoteur entièrement métallique développé en 1938 et était une version modifiée du P-36 Hawk. Ce type serait utilisé par un nombre important de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il soit inférieur aux derniers P-47 et P-51, il servirait en première ligne jusqu'à la fin de la guerre. 200 pilotes alliés de 7 pays différents, des États-Unis aux pays du Commonwealth britannique en passant par l'Union soviétique, sont devenus des as du P-40. Malgré les désignations différentes pour le service du Commonwealth et le service soviétique, le surnom officiel du service américain est « Warhawk »."
 USA_fighter_equipment_2:0 "République F-47 Thunderbolt"
 USA_fighter_equipment_2_short:0 "F-47 Tonnerre"
 USA_fighter_equipment_2_desc:0 "Le P-47 était le développement ultérieur des avions Seversky (le prédécesseur de Republic) P-35 et Republic P-43 Lancer. Bien qu'il ait été conçu à l'origine comme un chasseur de supériorité aérienne. La renommée du P-47 était sa capacité à transporter une lourde charge de bombes, marquant ainsi le début de l'héritage de l'entreprise en matière de développement d'avions d'appui aérien rapproché (CAS). Ce type a été utilisé dans une myriade de nations alliées pendant la Seconde Guerre mondiale et a continué à fonctionner ainsi après la guerre, certains affirmant que ce type, et non le P-51 Mustang, aurait dû être utilisé en Corée. Son surnom est « Thunderbolt », le premier dans les conventions de dénomination modernes de Republic. A été rebaptisé F-47 en 1948."
 USA_fighter_equipment_3:0 "F-51D Mustang nord-américain"
 USA_fighter_equipment_3_short:0 "F-51D Mustang"
 USA_fighter_equipment_3_desc:0 "Le P-51 est considéré comme l'un des meilleurs chasseurs jamais produits dans l'histoire de l'aviation. Développé par North American Aviation. Le type est entré en service en 1942. Initialement utilisé comme avion de reconnaissance tactique, le type allait, avec l'introduction de la variante « D », devenir célèbre comme le premier chasseur à domination aérienne au monde, assurant l'escorte des bombardiers américains et alliés lors des campagnes de bombardement les plus célèbres du théâtre européen, détruisant près de 5 000 avions pendant la guerre. Plus tard désigné F-51, il servira avec distinction comme avion CAS pendant la guerre de Corée, et le « Mustang », le cheval de trait de l'USAAAF, continuera son service jusqu'en 1968."

 USA_heavy_fighter_equipment_1:0 "Lockheed P-38 Foudre"
 USA_heavy_fighter_equipment_1_short:0 "Foudre P-38"
 USA_heavy_fighter_equipment_1_desc:0 "Un avion à double moteur à pistons conçu en mettant l'accent sur la vitesse et les armements lourds. Pendant la Seconde Guerre mondiale, sa vitesse a été utilisée dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme particulière lui a valu le nom de « der Gabelschwanz-Teufel » ou « le diable à queue fourchue » en Allemagne et de « Ni hikouki, ippairotto » ou « deux avions, un pilote » au Japon. Il est également connu sous le nom de « Foudre »."
 USA_heavy_fighter_equipment_2:0 "Northrop F-61 Veuve Noire"
 USA_heavy_fighter_equipment_2_short:0 "F-61 Veuve Noire"
 USA_heavy_fighter_equipment_2_desc:0 "Le P-61, comme le P-38 avant lui, est un avion à double flèche conçu en 1944. C'était le premier chasseur de nuit américain, équipé d'un radar (une autre première) pour suivre les bombardiers et autres cibles et les intercepter la nuit et dans des conditions météorologiques défavorables. Associé à ses quatre canons Hispano de 20 mm, le P-61 (plus tard F-61), surnommé la « Veuve noire » d'après la célèbre araignée américaine, est aussi mortel que son nom l'indique."
 USA_heavy_fighter_equipment_3:0 "F-82 Twin Mustang nord-américain"
 USA_heavy_fighter_equipment_3_short:0 "F-82 Twin Mustang"
 USA_heavy_fighter_equipment_3_desc:0 "Développé à l'origine comme chasseur d'escorte à longue portée pour la Seconde Guerre mondiale, le P-82 a été introduit en 1946, trop tard pour servir dans le conflit. Développé à partir du vénéré P-51, le P-82 (plus tard F-82) a été utilisé en remplacement du P-61 Black Widow et a été équipé d'un radar pour soutenir le Commandement stratégique aérien. Parce que la cellule ressemble à 2 P-51 en kit, elle a reçu le surnom de « Twin Mustang »."

 USA_strat_bomber_equipment_1:0 "Forteresse volante Boeing B-17"
 USA_strat_bomber_equipment_1_short:0 "Forteresse volante B-17"
 USA_strat_bomber_equipment_1_desc:0 "Le B-17 est un bombardier stratégique quadrimoteur développé au milieu des années 1930 pour l'US Army Air Corps. C'était le troisième bombardier le plus produit pendant la Seconde Guerre mondiale et il a servi avec distinction sur le théâtre européen du conflit, responsable des campagnes de bombardement en Allemagne à partir de bases du sud de l'Angleterre et de l'Italie. Son armement défensif hérissé convient parfaitement à un avion surnommé la « Forteresse volante »."
 USA_strat_bomber_equipment_2:0 "Libérateur B-24 consolidé"
 USA_strat_bomber_equipment_2_short:0 "Libérateur B-24"
 USA_strat_bomber_equipment_2_desc:0 "Le B-24 a été conçu en 1941 comme bombardier lourd à long rayon d'action pour l'US Army Air Force. Malgré sa capacité à transporter une lourde charge de bombes associée à une vitesse de croisière élevée, il était relativement difficile de voler à basse altitude et avait un plafond de service inférieur à celui du B-17. Pourtant, le « Liberator » a été préféré par l'état-major américain et a été le bombardier le plus produit pendant la Seconde Guerre mondiale. Comme le B-17, il a bien servi sur le théâtre européen lors de la campagne de bombardement de l'Allemagne, mais a également servi avec distinction sur le théâtre du Pacifique."
 USA_strat_bomber_equipment_3:0 "Boeing B-29 Superforteresse"
 USA_strat_bomber_equipment_3_short:0 "Superforteresse B-29"
 USA_strat_bomber_equipment_3_desc:0 "Le B-29 était un bombardier quadrimoteur à hélices introduit en 1944. Il s'agissait du projet d'armement le plus coûteux jamais réalisé pendant la guerre, dépassant même le coût du programme d'armes nucléaires des États-Unis à l'époque. Conçu comme un bombardier stratégique à haute altitude, il a été utilisé comme bombardier incendiaire nocturne à basse altitude, lançant des raids à la bombe incendiaire sur le Japon. Mais la renommée de la « Superforteresse » réside dans le largage des bombes atomiques sur Hiroshima et Nagasaki, qui ont contribué à la fin de la guerre. Les variantes mises à jour (y compris le B-50 redésigné) continueraient à servir de bombardier stratégique pendant la guerre de Corée avant de prendre leur retraite au début des années 1950."

 USA_tac_bomber_equipment_0:0 "Douglas B-18 Bolo"
 USA_tac_bomber_equipment_0_short:0 "B-18 Bolo"
 USA_tac_bomber_equipment_0_desc:0 "Le B-18, introduit en 1936, était un bombardier moyen développé pour remplacer le précédent Martin B-10. Bien que décent au moment de son introduction. Il fut rapidement rendu obsolète en 1940, et relégué aux avions de guerre anti-sous-marine et de transport. Malgré cela, le « Bolo» allait devenir le premier avion américain à couler un sous-marin allemand pendant la Seconde Guerre mondiale."
 USA_tac_bomber_equipment_1:0 "Douglas B-23 Dragon"
 USA_tac_bomber_equipment_1_short:0 "Dragon B-23"
 USA_tac_bomber_equipment_1_desc:0 "Développé comme successeur raffiné du B-18 Bolo, le B-23 était plus rapide et transportait une charge de bombes et un armement défensif plus lourds. Cependant, le « Dragon » s'est avéré inférieur à ses contemporains, les B-25 et B-26, et a été largement relégué au rang d'avion d'entraînement pendant la Seconde Guerre mondiale."
 USA_tac_bomber_equipment_2:0 "B-25 Mitchell nord-américain"
 USA_tac_bomber_equipment_2_short:0 "B-25 Mitchell"
 USA_tac_bomber_equipment_2_desc:0 "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres impliquant des avions pendant la guerre, l'utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardement aérien réussie sur le continent japonais pendant la guerre. Son surnom est « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
 USA_tac_bomber_equipment_3:0 "Martin B-26 Maraudeur"
 USA_tac_bomber_equipment_3_short:0 "Maraudeur B-26"
 USA_tac_bomber_equipment_3_desc:0 "Le B-26 a été développé en 1941 comme bombardier moyen parallèlement au B-25. Un avion difficile à piloter au départ, il a été étiqueté comme « Widowmaker » en raison du nombre de fois où les pilotes formés à ce type se sont écrasés et sont morts. Après que des modifications aient été apportées et que les pilotes soient correctement formés, il s'est avéré être un bombardier tactique performant, servant en Europe occidentale ainsi que sur les théâtres du Pacifique et de la Méditerranée pendant la Seconde Guerre mondiale. Surnommé « Marauder », le type prendra sa retraite en 1947, avant que l'armée de l'air ne soit séparée par l'armée (et c'est la raison pour laquelle l'A-26 Invader a été brièvement nommé B-26.)"

 USA_nav_bomber_equipment_1:0 "PBY-1 Catalina consolidé"
 USA_nav_bomber_equipment_1_short:0 "PBY-1"
 USA_nav_bomber_equipment_1_desc:0 "Variante de production initiale avec deux moteurs R-1830-64 de 900 ch. Le Consolidated PBY Catalina est un hydravion et un avion amphibie produits dans les années 1930 et 1940. En service au Canada, il était connu sous le nom de Canso. C'était l'un des hydravions les plus utilisés de la Seconde Guerre mondiale. Catalinas a servi dans toutes les branches des forces armées des États-Unis ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont servi jusque dans les années 1980. En 2021, 86 ans après son premier vol, l'avion continue de voler comme bombardier à eau (ou avion-citerne) dans le cadre d'opérations aériennes de lutte contre les incendies dans certaines régions du monde. Aucun ne reste au service militaire. "
 USA_nav_bomber_equipment_2:1 "PBY-5 Catalina consolidé"
 USA_nav_bomber_equipment_2_short:1 "PBY-5"
 USA_nav_bomber_equipment_2_desc:0 "Le Consolidated PBY Catalina est un hydravion et un avion amphibie produits dans les années 1930 et 1940. En service au Canada, il était connu sous le nom de Canso. C'était l'un des hydravions les plus utilisés de la Seconde Guerre mondiale. Catalinas a servi dans toutes les branches des forces armées des États-Unis ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont servi jusque dans les années 1980. En 2021, 86 ans après son premier vol, l'avion continue de voler comme bombardier à eau (ou avion-citerne) dans le cadre d'opérations aériennes de lutte contre les incendies dans certaines régions du monde. Aucun ne reste au service militaire. "
 USA_nav_bomber_equipment_3:0 "Corsaire consolidé PB4Y-2"
 USA_nav_bomber_equipment_3_short:0 "Corsaire PB4Y-2"
 USA_nav_bomber_equipment_3_desc:0 "Le Consolidated PB4Y-2 Privateer est un bombardier de patrouille américain de la Seconde Guerre mondiale et de la guerre de Corée dérivé du Consolidated B-24 Liberator."

 USA_cv_CAS_equipment_1:0 "Northrop BT"
 USA_cv_CAS_equipment_1_short:0 "Northrop BT"
 USA_cv_CAS_equipment_1_desc:0 "Le Northrop BT a été développé en 1935 alors que Northrop était une filiale de Douglas Aircraft Corporation. Premier avion doté d'un train d'atterrissage tricycle fixe à atterrir sur un porte-avions, ce type sera développé plus tard par Douglas pour devenir le bombardier en piqué SBD Dauntless."
 USA_CAS_equipment_2:0 "Douglas A-20 Ravage"
 USA_CAS_equipment_2_short:0 "A-20 ravages"
 USA_CAS_equipment_2_desc:0 "L'A-20, surnommé « Havoc », a été introduit en 1941 comme bombardier léger et avion d'attaque au sol. En service aux États-Unis et dans le Commonwealth, sa renommée est venue de son service dans l'armée de l'air et la marine de l'Union soviétique, qui ont reçu les deux tiers de la variante A-20B et de nombreux modèles G&H. Modifiés avec des mitrailleuses de 7,62 mm à tir plus rapide et un canon à tir vers l'avant, ces types ont servi avec distinction sur le front de l'Est contre les chars allemands et ont été les bombardiers de fabrication étrangère les plus nombreux utilisés par l'armée de l'air soviétique pendant la Seconde Guerre mondiale. Les variantes de chasseurs étaient également appelées P-70."
 USA_CAS_equipment_3:0 "A-36 Apache nord-américain"
 USA_CAS_equipment_3_short:0 "A-36 Apache"
 USA_CAS_equipment_3_desc:0 "L'A-36 a été développé comme une variante d'attaque au sol du célèbre P-51 Mustang. Bombardier en piqué, il s'est bien comporté en Afrique du Nord, en Méditerranée, en Italie et sur les théâtres Chine-Birmanie-Inde de la Seconde Guerre mondiale. Connu pour ses aérofreins rectangulaires distinctifs au bout des ailes. L'« Apache », du nom de la tribu amérindienne, s'est révélé mortel au cours de sa courte carrière, servant de 1942 jusqu'à sa retraite à la fin de la guerre en 1945."

 USA_CAS_equipment_4:0 "Douglas A-26C Envahisseur"
 USA_CAS_equipment_4_short:0 "Envahisseur A-26C"
 USA_CAS_equipment_4_desc:0 "L'A-26 est un avion d'attaque rapide bimoteur développé et destiné à remplacer l'A-20 Havoc. Introduit en 1943, l'Invader a servi dans l'armée de l'air américaine pendant la Seconde Guerre mondiale, attaquant les positions japonaises dans les Indes néerlandaises et aux Philippines, ainsi qu'en Europe lors de campagnes dans la vallée du Pô, dans le nord de l'Italie. Ils ont continué leur service en Corée, participant à des missions de bombardement contre la Corée, et ont été les premiers avions à lancer une sortie dans ce conflit. L'« Invader » a poursuivi sa carrière au Vietnam, soutenant les opérations de la CIA au Laos contre les forces vietcongs. Avec une riche carrière au cours de trois guerres, l'« Invader » a fait ses preuves et a montré de quoi un avion CAS était capable."
 USA_cv_CAS_equipment_4:0 "Douglas AD Skyraider"
 USA_cv_CAS_equipment_4_short:0 "Douglas AD Skyraider"
 USA_cv_CAS_equipment_4_desc:0 "Le Douglas AD est un engin d'attaque rapide fiable basé sur un porte-avions. Conçu à l'origine comme un bombardier torpilleur et en piqué, l'AD (à l'origine le BT2D) est entré en service en 1946 et se comportera avec une grande distinction pendant la guerre de Corée, devenant ainsi le principal avion d'attaque au sol des forces de l'US Navy et du Marine Corp. Même si la plupart des avions à hélices seraient retirés du service après le conflit coréen, le nouveau A-1 resta en service et joua un rôle clé en tant qu'avion d'appui aérien rapproché, et le « Skyraider » servira avec distinction jusqu'à la fin de l'implication américaine au Vietnam."

 #USA_cv_nav_bomber_equipment_1:0 "Douglas TBD Devastator"
 #USA_cv_nav_bomber_equipment_1_short:0 "TBD Devastator"
 #USA_cv_nav_bomber_equipment_1_desc:0 "When the TBD entered service in 1937, it was still largely considered one of the best torpedo bombers when introduced. However despite enjoying some successes in the early war, by the time of the Japanese attack on Pearl Harbor, the 'Devastator' was woefully obsolete, and was proven as such by the time of the Battle of Midway, when nearly the entire force of Devastators used in the battle was wiped out. Although later attributed to poor air cover and defects in the torpedo it normally carried. The TBD was phased out of active duty immediately after the battle, and withdrawn from service outright by 1944."
 #USA_cv_nav_bomber_equipment_2:0 "Grumman TBF-1C Avenger"
 #USA_cv_nav_bomber_equipment_2_short:0 "TBF-1C Avenger"
 #USA_cv_nav_bomber_equipment_2_desc:0 "The TBF-1C variant of the 'Avenger' improved on the original TBF-1 design by making provisions for two wing-mounted 12.7mm (.50 cal) Machine Guns and wing-mounted fuel tanks which doubled the aircraft's range and forward attack power."
 #USA_cv_nav_bomber_equipment_3:0 "Consolidated PB4Y-2 Privateer"
 #USA_cv_nav_bomber_equipment_3_short:0 "PB4Y-2 Privateer"
 #USA_cv_nav_bomber_equipment_3_desc:0 "The Consolidated PB4Y-2 Privateer is an American World War II and Korean War era patrol bomber of the United States Navy derived from the Consolidated B-24 Liberator."

 USA_CAS_equipment_1:0 "Northrop A-17"
 USA_CAS_equipment_1_short:0 "A-17"
 USA_CAS_equipment_1_desc:0 "L'A-17 était un avion d'attaque monoplan biplace et monomoteur développé en 1935 et dérivé du Northrop Gamma 2F. Un avion fiable et populaire. Ce type servirait d'avion de patrouille côtière pour les unités ennemies qui pourraient traverser le canal de Panama au cours des premières étapes de la Seconde Guerre mondiale après Pearl Harbor, et serait utilisé à titre utilitaire jusqu'à sa retraite en 1944."
 USA_cv_CAS_equipment_2:0 "Douglas SBD-2 Intrépide"
 USA_cv_CAS_equipment_2_short:0 "SBD-2 Intrépide"
 USA_cv_CAS_equipment_2_desc:0 "Le SBD-2 a été conçu comme avion de reconnaissance et bombardier en piqué en 1940 et était le principal avion de ce type pour la marine américaine. Le « Dauntless », déjà un bombardier en piqué performant, a été amélioré avec la variante -2 avec un armement différent et une capacité de carburant accrue, n'était qu'un pis-aller mineur par rapport aux modèles ultérieurs. Les variantes de l'USAAF l'appelaient l'A-24 Banshee."
 USA_cv_CAS_equipment_3:0 "Curtiss SB2C-1 Helldiver"
 USA_cv_CAS_equipment_3_short:0 "SB2C-1 Helldiver"
 USA_cv_CAS_equipment_3_desc:0 "Remplaçant le SBD Dauntless, le SB2C, introduit en 1942, était bien plus rapide que le SBD qu'il remplaçait, mais c'était un avion difficile à piloter, ce qui lui valut le surnom désobligeant de « SOB, 2e classe ». Malgré cela et un rapport cinglant qui gâchera à jamais l'héritage de la Curtiss Aircraft Company, le « Helldiver » eut un excellent bilan de combat tout au long de la guerre du Pacifique. La variante de l'USAAF l'appelait A-25 Shrike."

 USA_cv_fighter_equipment_0:0 "Grumman FF 'Fifi'"
 USA_cv_fighter_equipment_0_short:0 "FF 'Fifi'"
 USA_cv_fighter_equipment_0_desc:0 "Introduit en 1933, le Grumman FF fut le premier modèle complet de l'entreprise destiné à la marine américaine. Surnommé de manière informelle « Fifi » (d'après la désignation de FF), le Grumman FF a bien servi comme l'un des premiers biplans capables de transporter des avions tout au long des années 30 avant de prendre sa retraite en 1940."
 USA_cv_fighter_equipment_1:0 "Grumman F3F"
 USA_cv_fighter_equipment_1_short:0 "F3F"
 USA_cv_fighter_equipment_1_desc:0 "Le Grumman F3F, lors de son introduction en 1936, était le dernier avion de combat biplan livré à la marine américaine et à toute branche de l'armée américaine en général. Malgré son bref service (retiré du service de première ligne en 1941 et du service en général en 1943), il s'agissait toujours d'un avion assez performant, le dernier d'une époque d'avions monoplans qui constitueraient l'avenir du combat de combat."
 USA_cv_fighter_equipment_2:0 "Vought F4U-5 Corsaire"
 USA_cv_fighter_equipment_2_short:0 "Corsaire F4U-5"
 USA_cv_fighter_equipment_2_desc:0 "Le Vought F4U Corsair est un avion de combat américain qui a servi principalement pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair fut bientôt très demandé ; des contrats de production supplémentaires furent accordés à Goodyear, dont les Corsairs furent désignés FG, et Brewster, désignés F3A. Le Corsair fut conçu et exploité comme un avion embarqué et entra en service en grand nombre dans la marine américaine à la fin de 1944 et au début de 1945. Il devint rapidement l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 USA_cv_fighter_equipment_3:0 "Grumman F8F Bearcat"
 USA_cv_fighter_equipment_3_short:0 "F8F Ourscat"
 USA_cv_fighter_equipment_3_desc:0 "Le Grumman F8F Bearcat est un avion de combat monomoteur américain embarqué à la fin de la Seconde Guerre mondiale. Il a servi au milieu du XXe siècle dans la marine américaine, le corps des Marines des États-Unis et les forces aériennes d'autres pays. C'était le dernier avion de combat à moteur à pistons de Grumman Aircraft."
 
 ############USA Cold War

 USA_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 USA_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Foudre II"
 USA_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour le déploiement de porte-avions. Le développement du programme F-35 a commencé en 1992, et la variante C était dans les airs dès 2010 et était opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses frères et soeurs, la variante C présente des ailes plus grandes avec des sections de bout d'aile pliables."
 
 USA_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 USA_jump_stealth_equipment_1_short:0 "F-35B Foudre II"
 USA_jump_stealth_equipment_1_desc:0 "Un chasseur polyvalent produit à l'aide d'une conception JSF (Joint Strike Fighter). Bien qu'il soit capable d'utiliser une variété d'armes dans les combats air-air et sol-sol, le coût d'acquisition de ce chasseur furtif est plus gérable que celui du F-22A. Conformément à son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 
 USA_cas_stealth_equipment_1:0 "Fairchild République A-10C Thunderbolt II"
 USA_cas_stealth_equipment_1_short:0 "A-10C Thunderbolt II"
 USA_cas_stealth_equipment_1_desc:0 "La variante C de l'A-10 « Thunderbolt II » a été développée en 2005 à la suite du programme de mise à niveau Precision Engagement. Tirant les leçons du prototype YA-10B, l'A-10C est doté d'un système de contrôle de tir modernisé, d'une suite ECM et de capacités de ciblage intelligent des bombes. Le module d'identification ami ou ennemi et la suite de communications ont également été mis à jour et modernisés. En partie en raison de ses performances dans l'histoire récente et de la pression politique, l'A-10 continuera probablement à servir dans une capacité de combat pour l'US Air Force dans un avenir proche."

 #USA_cas_stealth_equipment_1:0 "General Atomics Predator-C Avenger"
 #USA_cas_stealth_equipment_1_short:0 "Predator-C Avenger"
 #USA_cas_stealth_equipment_1_desc:0 "The General Atomics Avenger is an unmanned combat air vehicle designed with stealth features and the same weapons capabilities as the older MQ-9 Reaper. The Avenger's first flight was in 2009, with carrier and extended range variants introduced in 2010 and 2016 respectively. Unlike the previous Predator and Reaper UAVs, the Avenger is powered by a turbofan engine."
 
 USA_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 USA_mr_stealth_fighter_equipment_1_short:0 "F-35A Foudre II"
 USA_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnel (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le développement du programme F-35 a commencé en 1992, la variante A prenant son envol fin 2006 et larguant ses premières bombes moins de six ans plus tard. La variante A est la variante la plus petite et la plus légère du F-35 et est principalement destinée à remplacer le F-16 Fighting Falcon."
 
 USA_jet_multirole_equipment_1:0 "Étoile filante Lockheed F-80A"
 USA_jet_multirole_equipment_1_short:0 "Étoile filante F-80A"
 USA_jet_multirole_equipment_1_desc:0 "Le premier chasseur à réaction exploité par l'US Army Air Force (plus tard l'US Air Force). C'était le premier et le seul avion à réaction américain opérationnel pendant les derniers jours de la Seconde Guerre mondiale. Ce type marquerait le début de l'ère des avions à réaction pour les États-Unis, car sa conception à aile droite servait largement de chasseur de jour et de chasseur-bombardier pendant la guerre de Corée sous le nom de F-80. Surnommé « l'étoile filante », le F-80 représentait le premier summum de l'aviation américaine."
 USA_jet_multirole_equipment_2:0 "Sabre nord-américain F-86A"
 USA_jet_multirole_equipment_2_short:0 "Sabre F-86A"
 USA_jet_multirole_equipment_2_desc:0 "Le F-86 est un chasseur à réaction à ailes en flèche développé et introduit à la fin des années 1940 à partir de recherches capturées par les Allemands. La conception de l'avion le rendait capable d'atteindre des vitesses transsoniques et une grande maniabilité, caractéristiques qui le rendaient capable de gérer son célèbre rival, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, aux côtés de ses variantes canadiennes et australiennes réunies, en ferait l'avion de combat occidental le plus produit de l'histoire de l'aviation."
 USA_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 USA_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 USA_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 USA_jet_multirole_equipment_4:0 "Super Sabre nord-américain F-100"
 USA_jet_multirole_equipment_4_short:0 "F-100 Super Sabre"
 USA_jet_multirole_equipment_4_desc:0 "Premier chasseur à réaction capable d'atteindre une vitesse supersonique en vol en palier, le F-100 était un avion multirôle capable conçu pour affronter l'ennemi face à face. Développé à partir du F-86 Sabre, le F-100 adoptera le surnom de « Super Sabre », mais recevra également le surnom de « Hun » en raison de sa désignation dans l'USAF à l'époque. Ce type servirait au Vietnam comme chasseur-bombardier et fut le premier à être utilisé dans le rôle de suppression de la défense aérienne ennemie, connu sous le nom de Wild Weasel."
 USA_jet_multirole_equipment_5:0 "McDonnell Douglas F-4C Phantom II"
 USA_jet_multirole_equipment_5_short:0 "F-4C Fantôme II"
 USA_jet_multirole_equipment_5_desc:0 "Le programme F-4 est l'un des modèles de chasseurs les plus réussis à ce jour. Le succès fut tel que l'US Air Force a choisi de faire voler ce type en remplacement du F-106 Delta Dart. Chasseur tactique biplace tout temps, version d'attaque au sol pour l'US Air Force ; a pris en charge un large éventail d'armes, notamment l'AIM-4 Falcon, l'AGM-12 Bullpup et les armes nucléaires ; des pneus de roue principale plus larges entraînaient des renflements distinctifs des ailes ; Moteurs J79-GE-15 avec possibilité de démarrage par cartouche ; le ravitaillement en carburant par perche au lieu du ravitaillement en carburant par sonde et en drogue de la Marine ; Radar AN/APQ-100 ; commandes de vol dupliquées dans le cockpit arrière."
 USA_jet_multirole_equipment_6:0 "McDonnell Douglas F-4D Phantom II"
 USA_jet_multirole_equipment_6_short:0 "F-4D Fantôme II"
 USA_jet_multirole_equipment_6_desc:0 "F-4C avec avionique mise à jour et radar AN/APQ-109."
 USA_jet_multirole_equipment_7:0 "McDonnell Douglas F-4E Phantom II"
 USA_jet_multirole_equipment_7_short:0 "F-4E Fantôme II"
 USA_jet_multirole_equipment_7_desc:0 "Version USAF avec un canon M61 Vulcan intégré dans le nez allongé du RF-4C, un radar AN/APQ-120 avec une section plus petite pour accueillir le canon, des moteurs J79-GE-17 avec 17 900 lbf (79,379 kN) de poussée de postcombustion chacun. Avions de dernière série équipés de lattes de pointe pour améliorer la maniabilité au détriment de la vitesse de pointe dans le cadre du programme Agile Eagle. À partir du bloc 53, les avions ont ajouté la capacité AGM-65 Maverick et les moteurs sans fumée J79-GE-17C ou -17E. Premier vol le 1er août 1965. La variante Phantom la plus nombreuse ; 1 370 construits."
 USA_jet_multirole_equipment_8:0 "Faucon de combat F-16A de General Dynamics"
 USA_jet_multirole_equipment_8_short:0 "Faucon de combat F-16A"
 USA_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger avec une maniabilité et une stabilité bien équilibrées. Il possède un corps d'aile mixte exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Appelé « Fighting Falcon », son coût relativement faible et sa puissance élevée sont la raison pour laquelle il a été adapté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle best-seller ont été fabriqués."
 USA_jet_multirole_equipment_9:0 "Faucon de combat F-16A Block 15 de General Dynamics"
 USA_jet_multirole_equipment_9_short:0 "F-16A Bloc 15"
 USA_jet_multirole_equipment_9_desc:0 "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 USA_jet_multirole_equipment_10:0 "General Dynamics F-16C Block 25 Faucon de combat"
 USA_jet_multirole_equipment_10_short:0 "F-16C Bloc 25"
 USA_jet_multirole_equipment_10_desc:0 "Première sous-variante du F-16C, un nouveau radar a été installé et un système de contrôle de tir amélioré, ainsi que des systèmes de données intégrés pour une capacité d'attaque de nuit améliorée. Introduite en 1984, la variante F-16C B25 servira de grande capacité pendant la guerre du Golfe Persique."
 #USA_jet_multirole_equipment_10:0 "General Dynamics F-16C Block 40/42 Fighting Falcon"
 #USA_jet_multirole_equipment_10_short:0 "F-16C Block 40/42"
 #USA_jet_multirole_equipment_10_desc:0 "The Block 40/42 sub-variant was the first to utilize the Low Altitude Navigation and Targeting Infrared for Night pod, also known as LANTIRN. In addition, the undercarriage was strengthened and slightly lengthened to accommodate this new avionics package. The Block 40/42 would also be capable of using Precision-Guided Bombs and Stand-Off Dispensers. As a result, the aircraft was unofficially designated as F-16CG and given the unofficial nickname of 'Night Falcon.'"
 
 USA_jet_interceptor_equipment_1:0 "Lockheed F-94 Starfire"
 USA_jet_interceptor_equipment_1_short:0 "F-94 Starfire"
 USA_jet_interceptor_equipment_1_desc:0 "Développé à partir du F-80 Shooting Star, le F-94 a été conçu pour remplacer les F-61 Black Widow et les F-82 Twin Mustang Heavy Night Fighters à hélices. Initialement équipé d'un armement de canons (quatre, puis huit mitrailleuses de 12,7 mm), son armement de canons serait remplacé par un composant entièrement de fusée, lancé depuis ses baies internes. « Surnommé Starfire », ce serait le premier intercepteur à réaction majeur de l'histoire de l'USAF."
 USA_jet_interceptor_equipment_2:0 "Chien Sabre F-86D nord-américain"
 USA_jet_interceptor_equipment_2_short:0 "Chien sabre F-86D"
 USA_jet_interceptor_equipment_2_desc:0 "Développé comme un intercepteur tous temps, le F-86D (initialement désigné F-95) a repris les performances impressionnantes du F-86 Sabrejet et les a améliorées, en ajoutant un radar (donnant à la variante son radôme avant distinctif), un fuselage plus long et un moteur de postcombustion plus gros. Équipé à l'origine d'une baie de lancement de fusée interne pour l'interception des bombardiers, les variantes ultérieures du « Sabre Dog » seraient équipées de canons."
 USA_jet_interceptor_equipment_3:0 "Northrop F-89 Scorpion"
 USA_jet_interceptor_equipment_3_short:0 "F-89 Scorpion"
 USA_jet_interceptor_equipment_3_desc:0 "Le F-89 (à l'origine P-89) est un intercepteur tout temps conçu dès l'origine pour ce rôle lors de son entrée en service en 1954. Initialement équipé d'un armement à canon, celui-ci sera progressivement abandonné dans la version de production au profit d'un armement de fusée. Plus tard, le « Scorpion » recevra un coup supplémentaire avec l'introduction d'un armement de missiles, le premier avion à réaction à utiliser un tel armement."
 USA_jet_interceptor_equipment_4:0 "Poignard Convair F-102A Delta"
 USA_jet_interceptor_equipment_4_short:0 "Dague Delta F-102A"
 USA_jet_interceptor_equipment_4_desc:0 "Premier chasseur à réaction à ailes delta des États-Unis, le F-102 a été le premier chasseur supersonique utilisé par l'US Air Force, capable d'atteindre des vitesses de Mach 1. Il a été conçu comme un intercepteur et un tueur de bombardiers, remplaçant le F-89 Scorpion, et était capable d'abattre des avions ennemis avec des roquettes et des missiles embarqués depuis sa baie interne, le premier avion de combat à présenter cette conception. Le « Delta Dagger » servirait pendant les premières périodes de la guerre du Vietnam comme avion d'escorte de bombardiers et d'attaque au sol."
 USA_jet_interceptor_equipment_5:0 "McDonnell F-101B Voodoo"
 USA_jet_interceptor_equipment_5_short:0 "F-101B Vaudou"
 USA_jet_interceptor_equipment_5_desc:0 "Le F-101, introduit en 1957, a été initialement conçu comme un bombardier d'escorte à longue portée ou un chasseur de pénétration pour le Commandement aérien stratégique de l'USAF. (SAC) Cela changerait lorsqu'il deviendrait un chasseur-bombardier à capacité nucléaire pour le Commandement aérien tactique (TAC). Le « Voodoo » avait une grande portée. Depuis ses bases en Allemagne de l'Ouest, il pourrait frapper n'importe quel pays du Pacte de Varsovie et pénétrer directement jusqu'à 800 km de profondeur en territoire soviétique."
 USA_jet_interceptor_equipment_6:0 "Convair F-106A Delta Fléchette"
 USA_jet_interceptor_equipment_6_short:0 "F-106A Delta Fléchette"
 USA_jet_interceptor_equipment_6_desc:0 "Le F-106 était un développement ultérieur du F-102 Delta Dagger. Introduit en 1959, le F-106, comme son prédécesseur, n'était pas équipé de canon embarqué et s'appuyait donc sur des missiles pour engager les bombardiers ennemis. Il était équipé du missile infrarouge AIM-4 et d'un AIM-26 à pointe nucléaire. Surnommé « Ultimate Interceptor », le « Delta Dart » transporterait ses armes dans une baie interne, une caractéristique de conception qui ne serait pas utilisée sur les avions de combat avant la 5e génération d'avions de combat à réaction."
 USA_jet_interceptor_equipment_7:0 "F-106A nord-américain « Six Shooter »"
 USA_jet_interceptor_equipment_7_short:0 "F-106A « Six tireurs »"
 USA_jet_interceptor_equipment_7_desc:0 "Après son introduction, le F-106 a été progressivement mis à jour en service, avec une avionique améliorée, une aile modifiée présentant une cambrure conique notable, un système de recherche et de suivi infrarouge, des réservoirs d'aile supersoniques rationalisés qui n'apportaient pratiquement aucune dégradation aux performances globales de l'avion, une meilleure instrumentation et des fonctionnalités telles qu'un réceptacle de ravitaillement en vol et un crochet d'arrêt pour les urgences à l'atterrissage. Project Six Shooter a ajouté une disposition pour un canon M61 Vulcan et un viseur optique."
 USA_jet_interceptor_equipment_8:0 "McDonnell Douglas F-15A Aigle"
 USA_jet_interceptor_equipment_8_short:0 "F-15A Aigle"
 USA_jet_interceptor_equipment_8_desc:0 "Un chasseur de supériorité aérienne avancé doté de points d'attache pour une multitude de systèmes d'armes et d'une avionique avancée capable d'affronter les chasseurs ennemis les plus avancés. Un chasseur à grande échelle tout temps. Bénéficiant d'une vitesse maximale phénoménale, même parmi les combattants, il embarque une abondance de munitions à son bord. Baptisé « Eagle », il possède un tel niveau de stabilité qu'il détient le record de récupération après avoir perdu une aile au combat."
 USA_jet_interceptor_equipment_9:0 "McDonnell Douglas F-15C Aigle"
 USA_jet_interceptor_equipment_9_short:0 "F-15C Aigle"
 USA_jet_interceptor_equipment_9_desc:0 "Version améliorée de la plate-forme F-15 de supériorité aérienne tous temps, la variante « C » est livrée avec un radar amélioré qui peut suivre jusqu'à une douzaine d'avions ennemis à tout moment, tout en étant capable d'en engager simultanément la moitié à la fois. Ce type a été utilisé dans une myriade de pays en dehors des États-Unis, de l'Arabie Saoudite à Israël, et constitue la variante la plus courante de l'« Eagle » en service, conservant son excellent record de tirs."

 USA_high_mach_jet_interceptor_equipment_1:0 "Lockheed F-90"
 USA_high_mach_jet_interceptor_equipment_1_short:0 "F-90"
 USA_high_mach_jet_interceptor_equipment_1_desc:0 "Le Lockheed XF-90 a été construit en réponse à un besoin de l'armée de l'air américaine concernant un chasseur de pénétration à longue portée et un bombardier d'escorte. La même exigence a donné naissance au McDonnell XF-88 Voodoo. Lockheed a reçu un contrat pour deux prototypes XP-90 (rebaptisés XF-90 en 1948)."
 USA_high_mach_jet_interceptor_equipment_2:0 "Chasseur stellaire Lockheed F-104"
 USA_high_mach_jet_interceptor_equipment_2_short:0 "Chasseur F-104"
 USA_high_mach_jet_interceptor_equipment_2_desc:0 "Le F-104 a été conçu pour répondre au désir du pilote de disposer d'un avion simple, petit et offrant d'excellentes performances. Le résultat serait cet avion, qui était l'un des premiers avions intercepteurs capables de Mach 2 en service dans l'armée américaine. Le « Starfighter » établira de nombreux records de vitesse et d'altitude, mais il fut entaché par une controverse politique et une faible capacité de survie, ce dernier lui donnant un autre surnom, celui de « Widowmaker »."
 USA_high_mach_jet_interceptor_equipment_3:0 "Rapière nord-américaine F-108"
 USA_high_mach_jet_interceptor_equipment_3_short:0 "Rapière F-108"
 USA_high_mach_jet_interceptor_equipment_3_desc:0 "Le F-108 est un intercepteur à grande vitesse et serait le premier avion de ce type à être équipé du missile à longue portée AIM-47 Falcon. Capable d'atteindre des vitesses de Mach 3, la « Rapier » serait la pointe des forces de dissuasion d'interception américaines jusqu'à l'introduction du F-12 Blackbird."
 USA_high_mach_jet_interceptor_equipment_4:0 "Lockheed F-12B Merle"
 USA_high_mach_jet_interceptor_equipment_4_short:0 "F-12B Merle"
 USA_high_mach_jet_interceptor_equipment_4_desc:0 "Le F-12 est un avion intercepteur stratosphérique supersonique conçu pour intercepter les bombardiers qui se trouvent à haute altitude ou à grande vitesse avec une relative facilité. L'unité est équipée de trois missiles air-air à longue portée AIM-47 Falcon pour garantir qu'elle puisse marquer ses cibles avant que les bombardiers ennemis ne puissent larguer sa charge utile. Son cadre noir et sa capacité de mission donnent du crédit à son surnom de « Blackbird ». Ce type donnera plus tard naissance au plus célèbre avion de reconnaissance stratégique, le SR-71."
 
 USA_jet_CAS_equipment_1:0 "République F-84E Thunderjet"
 USA_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 USA_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 USA_jet_CAS_equipment_2:0 "République F-84G Thunderjet"
 USA_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 USA_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 USA_jet_CAS_equipment_3:0 "République F-84F Thunderstreak"
 USA_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 USA_jet_CAS_equipment_3_desc:0 "Développé à partir du précédent F-84 Thunderjet, le F-84F était une variante à ailes en flèche du chasseur-bombardier conçue pour rapprocher ce type des performances du tant vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances de décollage tout en ayant une stabilité et un contrôle médiocres. Le type servirait dans une capacité limitée tout au long de sa vie, jusqu'en 1971. Son surnom est « Thunderstreak »."
 USA_jet_CAS_equipment_4:0 "République F-105D Thunderchief"
 USA_jet_CAS_equipment_4_short:0 "F-105D Thunderchief"
 USA_jet_CAS_equipment_4_desc:0 "Utilisé exclusivement par l'US Air Force, le F-105 est un chasseur-bombardier supersonique à ailes en flèche conçu à l'origine comme un avion d'attaque à capacité nucléaire. Il s'agissait du plus grand avion de combat monomoteur et monoplace de l'histoire au moment de son introduction en 1955. Servant pendant la guerre du Vietnam comme principal avion d'attaque de l'USAF, plus de 20 000 sorties ont été effectuées, à la fois en tant que variante d'attaque monoplace et en tant que rôle de suppression de la défense aérienne ennemie à deux places. Conformément aux conventions de dénomination de Republic Aviation, son surnom est « Thunderchief »."
 USA_jet_CAS_equipment_5:0 "Republic F-105D Thunderchief « se ressemble »"
 USA_jet_CAS_equipment_5_short:0 "Le F-105D « se ressemble »"
 USA_jet_CAS_equipment_5_desc:0 "Les améliorations Look Alike ont augmenté la capacité de l'avion de quatre à seize bombes conventionnelles de 750 livres (340 kg) sur les points d'attache sous l'aile et au centre du fuselage et ont ajouté l'équipement nécessaire pour lancer des missiles air-sol AGM-12 Bullpup."
 USA_jet_CAS_equipment_6:0 "LTV A-7D Corsaire II"
 USA_jet_CAS_equipment_6_short:0 "A-7D Corsaire II"
 USA_jet_CAS_equipment_6_desc:0 "Version construite pour l'USAF, avec un turboréacteur Allison TF41-A-1 et un seul canon rotatif M61 Vulcan de 20 mm ; Le radar de navigation AN/APN-153 des modèles précédents est remplacé par le radar de navigation AN/APN-185, le radar de suivi de terrain AN/APQ-116 du précédent A-7B/C est remplacé par le radar de suivi de terrain AN/APQ-126."
 USA_jet_CAS_equipment_7:0 "République Fairchild A-10A Thunderbolt II"
 USA_jet_CAS_equipment_7_short:0 "A-10A Thunderbolt II"
 USA_jet_CAS_equipment_7_desc:0 "Un attaquant lourdement armé qui offre un soutien au sol à courte portée en utilisant une puissance de feu et une endurance écrasantes. Doté d'un large choix d'armes, notamment des mitrailleuses de 30 mm, des bombes et des roquettes, offrant d'excellentes capacités d'attaque air-sol. Très stable à basse vitesse, il se spécialise dans le nettoyage du sol étendu et précis en une seule attaque. Connu sous le nom de « Thunderbolt II » (et nommé d'après le P-47 Thunderbolt), il se caractérise par une aile droite qui est solide à basse vitesse, et son moteur placé en hauteur et son blindage renforcé le protègent contre les contre-attaques depuis le sol."
 USA_jet_CAS_equipment_8:0 "Fairchild Republic A-10A Thunderbolt II 'LASTE'"
 USA_jet_CAS_equipment_8_short:0 "A-10A Thunderbolt II 'LASTE'"
 USA_jet_CAS_equipment_8_desc:0 "Au début de sa vie, l'A-10 a commencé à recevoir la mise à niveau LASTE (Low-Altitude Safety and Targeting Enhancement), qui fournissait un équipement informatisé de pointage d'armes, un pilote automatique et un système d'avertissement de collision au sol. Le système LASTE a ensuite été mis à niveau avec un ordinateur de contrôle de vol et de tir intégré."

 #LIGHT JETS
 
 USA_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 USA_jet_light_equipment_1_short:0 "Étoile filante T-33"
 USA_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 
 USA_jet_light_equipment_2:0 "FJ-2 Fury nord-américain"
 USA_jet_light_equipment_2_short:0 "FJ-2 Fureur"
 USA_jet_light_equipment_2_desc:0 "Les FJ-2 et FJ-3 Fury nord-américains sont une série de chasseurs à ailes en flèche capables de porter un porte-avions pour la marine et le corps des marines des États-Unis. Le FJ-2 est le résultat d'un effort visant à navaliser le F-86 Sabre de l'US Air Force. Ces avions sont dotés d'ailes repliables et d'une jambe d'atterrissage avant plus longue conçue pour augmenter l'angle d'attaque au lancement et pour accueillir un oléo plus long afin d'absorber le choc des atterrissages durs sur le pont d'un porte-avions."

 USA_jet_light_equipment_3:0 "Chasseur de la liberté Northtrop F-5A"
 USA_jet_light_equipment_3_short:0 "Chasseur de la liberté F-5A"
 USA_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de combat léger destiné principalement à l'exportation. Il est plus léger et moins cher à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour remplacer les escadrons de chasseurs à courte portée. Malgré cela, ce type s'est avéré assez agile et était l'avion le plus proche pour rivaliser avec le MiG-21 « Fishbed » soviétique. Parce qu'il a été utilisé par la majorité des alliés de l'Amérique au plus fort de la guerre froide, il a été appelé à juste titre « Freedom Fighter »."

 USA_jet_light_equipment_4:0 "Rockwell OV-10A Bronco nord-américain"
 USA_jet_light_equipment_4_short:0 "OV-10A Bronco"
 USA_jet_light_equipment_4_desc:0 "Le North American Rockwell OV-10 Bronco est un avion d'attaque et d'observation léger bi-turbopropulseur américain. Il a été développé dans les années 1960 comme avion spécial pour le combat contre-insurrectionnel (COIN), et l'une de ses principales missions était d'être un avion de contrôle aérien avancé (FAC). Il peut transporter jusqu'à 3 200 livres de munitions externes, des charges internes telles que des parachutistes ou des civières, et flâner pendant trois heures ou plus."

 USA_jet_light_equipment_5:0 "Rockwell OV-10D Bronco nord-américain"
 USA_jet_light_equipment_5_short:0 "OV-10D Bronco"
 USA_jet_light_equipment_5_desc:0 "Bronco de deuxième génération développé dans le cadre du programme NOGS. Le modèle D était une cellule OV-10A largement modifiée, ajoutant un système de vision nocturne infrarouge tourné vers l'avant avec une caméra montée sur la tourelle sous un nez allongé, visuellement distinct du nez court et arrondi du modèle A. Le D possède également des moteurs plus gros et des hélices en fibre de verre plus grandes. D'autres différences externes notables sont les distributeurs de paillettes installés à mi-chemin des flèches et les cheminées d'échappement suppressives des infrarouges (qui mélangent les gaz d'échappement avec de l'air plus froid pour réduire la signature thermique de l'avion)."

###Bombers

 USA_nav_bomber_equipment_4:0 "Lockheed P2V-2 Neptune"
 USA_nav_bomber_equipment_4_short:0 "P2V-2 Neptune"
 USA_nav_bomber_equipment_4_desc:0 "Le P2V était un avion de patrouille maritime et anti-sous-marin développé pour remplacer le PV-1 Ventura et le PV-2 Harpoon de la Seconde Guerre mondiale. Introduit en 1947 pour l'US Navy, il s'agissait en fait d'un avion basé à terre, et le P2V, plus tard désigné P-2 après 1962, n'a jamais effectué d'atterrissage sur un porte-avions, mais un petit nombre a été converti et déployé à partir de porte-avions comme bombardiers nucléaires provisoires qui devraient atterrir sur le rivage ou dans un fossé, à l'instar des bombardiers utilisés lors du raid de Doolittle pendant la Seconde Guerre mondiale. Son surnom est « Neptune », du nom du dieu romain de la mer."
 USA_nav_bomber_equipment_5:0 "Lockheed P2V-7 Neptune"
 USA_nav_bomber_equipment_5_short:0 "P2V-7 Neptune"
 USA_nav_bomber_equipment_5_desc:0 "Dernière variante du Neptune produite par Lockheed, propulsée par des moteurs R-3350-32W et J-34. Équipé de réservoirs à bout d'aile à traînée inférieure, d'un radar de recherche AN/APS-20 dans un radôme révisé et d'une verrière de cockpit bombée. Les premiers avions étaient équipés de tourelles défensives, mais celles-ci furent supprimées comme pour le P2V-5."
 USA_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 USA_nav_bomber_equipment_6_short:0 "P-3A Orion"
 USA_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le rôle de patrouille maritime et de guerre anti-sous-marine terrestre (ASW). Il dispose d'une soute à bombes interne pour les torpilles aériennes, avec des pylônes sous les ailes pour une myriade d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des charges sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques sur sa queue pour détecter les sous-marins utilisant le champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à jouer un rôle depuis son introduction en 1962, il est tout à fait approprié que l'avion soit surnommé « Orion ». Le chasseur de navires ennemis."
 USA_nav_bomber_equipment_7:0 "Lockheed P-3C Orion"
 USA_nav_bomber_equipment_7_short:0 "P-3C Orion"
 USA_nav_bomber_equipment_7_desc:0 "Le P-3C disposait d'une nouvelle suite ASW et d'un ordinateur de mission avec une disposition interne révisée. À l'extérieur, le P-3C comportait une échelle d'entrée à commande électrique ; petite antenne à aileron ; chutes de bouées sonores ventrales chargées extérieurement ; et trois petites fenêtres sur le côté arrière droit (une fenêtre à l'avant de la sortie de secours au-dessus de l'aile et deux bien à l'arrière). Les avions de production initiaux avaient un nez de caméra situé sur la partie inférieure du radôme. Les avions de production ultérieurs avaient une tourelle IRDS rétractable à la place de la caméra nasale. À partir du début des années 1980, les nez de caméra existants ont été équipés de tourelles IRDS. Les premiers modèles étaient également connus sous le nom d'avion P-3C « Baseline » ou Non-Update (NUD). Tous les avions ont ensuite été équipés de deux systèmes de navigation inertielle LTN-72."
 USA_nav_bomber_equipment_8:0 "Boeing P-8 Poséidon"
 USA_nav_bomber_equipment_8_short:0 "P-8 Poséidon"
 USA_nav_bomber_equipment_8_desc:0 "Initialement connu sous le nom d'avion maritime multimission (MMA), le P-8 a été conçu pour remplacer le vénérable P-3 Orion. Développé à partir de l'avion de ligne Boeing 737 Next Generation, le P-8 a été conçu pour le rôle de guerre anti-sous-marine et de patrouille maritime. De plus, il peut jouer le rôle de support électronique (ESM) grâce à l'utilisation de sa capacité d'autoprotection d'alerte précoce (EWSP). Avec des variantes en service aux États-Unis, au Royaume-Uni, en Inde et en Australie depuis son introduction en 2013, le « Poséidon » deviendra le nouveau roi des mers."
 
 #USA_cv_nav_bomber_equipment_4:0 "Martin AM Mauler"
 #USA_cv_nav_bomber_equipment_4_short:0 "AM Mauler"
 #USA_cv_nav_bomber_equipment_4_desc:0 "Originally designated the BTM, the AM was a single-seat torpedo bomber, the first of its kind in aviation history. The Mauler is faster and lighter than contemporary bombers at the time and needed 1/3 of the crew members than the typical torpedo bomber of its day. With a bomb load of over 10,500 lbs (4800 kg), it could carry more ordinance than many of its predecessors and contemporaries alike. However, the AM, nicknamed the 'Mauler' was probably overly stable, being described as 'heavy handling' and difficult to land on an aircraft carrier. As a result, it only had a short service carrier, operating on frontline units in the Atlantic for two years before being replaced with the AD-1 Skyraider."
 #USA_cv_nav_bomber_equipment_5:0 "Grumman AF Guardian"
 #USA_cv_nav_bomber_equipment_5_short:0 "AF Guardian"
 #USA_cv_nav_bomber_equipment_5_desc:0 "The AF 'Guardian' (originally designated TB3F) is the first purpose-built Anti-Submarine Warfare aircraft to enter service with the U.S. Navy. Because it was originally designed as a Torpedo Bomber and thus could not fit all its ASW equipment into the frame, two variants were developed, the AF-2W which was equipped with a search radar, and the AF-2S, which carried various weapons such as torpedoes, depth charges, bombs or rockets."
 #USA_cv_nav_bomber_equipment_6:0 "Grumman S-2 Tracker"
 #USA_cv_nav_bomber_equipment_6_short:0 "S-2 Tracker"
 #USA_cv_nav_bomber_equipment_6_desc:0 "The S-2 (formerly S2J) took the lessons learned from the Guardian and applied them to a single airframe with two turboprop engines and foldable wings. Introduced first in 1952, the 'Tracker', alongside it's EW variant, the E-1 Tracer and Transport craft, the C-1 Trader, served in the U.S. Navy into the 1970s and 80s."
 #USA_cv_nav_bomber_equipment_7:0 "Lockheed S-3 Viking"
 #USA_cv_nav_bomber_equipment_7_short:0 "S-3 Viking"
 #USA_cv_nav_bomber_equipment_7_desc:0 "The S-3 was the successor and replacement for the earlier S-2 Tracker in the role of Anti-Submarine Warfare. Entering service in 1974, the type was one of the first to introduce a higher degree of systems integration, not seen in either it's predecessor, nor the land-based P-3 Orion. As a result, the aircraft could utilize a crew of four compared to the Orion's 12. In addition, it was one of the first aircraft to utilize an auxiliary power unit, allowing the craft to start relatively unassisted. Nicknamed the 'Viking,' The S-3 provided a mainstay in carrier-based Anti-Surface Warfare during its time in service."
 #USA_cv_nav_bomber_equipment_8:0 "Boeing F/A-18F Super Hornet"
 #USA_cv_nav_bomber_equipment_8_short:0 "F/A-18F Super Hornet"
 #USA_cv_nav_bomber_equipment_8_desc:0 "A versatile carrier-based fighter capable of providing support for aircraft, ground forces, and ships. With better maneuverability at medium speeds than high-speed fighters, it is effective in air raids. Nicknamed 'Super Hornet,' the craft is an improved F-Type."
 
 USA_jet_tac_bomber_equipment_1:0 "Tornado nord-américain B-45"
 USA_jet_tac_bomber_equipment_1_short:0 "Tornade B-45"
 USA_jet_tac_bomber_equipment_1_desc:0 "Premier bombardier à réaction opérationnel de l'USAF, le « Tornado » est un bombardier à réaction de taille moyenne qui peut fournir un soutien sur le champ de bataille ainsi qu'une reconnaissance à longue portée. Il jouera un rôle important dans la dissuasion nucléaire américaine pendant plusieurs années avant d'être remplacé par le B-47 Stratojet."
 USA_jet_tac_bomber_equipment_2:0 "Martin B-57 Canberra"
 USA_jet_tac_bomber_equipment_2_short:0 "B-57 Canberra"
 USA_jet_tac_bomber_equipment_2_desc:0 "Le « Canberra » est une version américaine du bombardier électrique anglais du même nom. Il est idéal pour les frappes tactiques et la reconnaissance. Son retrait dans les années 1980 marquerait la fin de l'ère des bombardiers tactiques."
 USA_jet_tac_bomber_equipment_3:0 "Destroyer Douglas B-66"
 USA_jet_tac_bomber_equipment_3_short:0 "Destructeur B-66"
 USA_jet_tac_bomber_equipment_3_desc:0 "Basé sur l'A-3 Skywarrior de l'US Navy, le « Destroyer » a servi de bombardier léger pour remplacer l'A-26 Invader. Parmi les changements par rapport à son homologue de la Marine, il y a l'ajout de sièges éjectables. Comme son homologue de la Marine, il servait également de rôle de reconnaissance et de guerre électronique."
 USA_jet_tac_bomber_equipment_4:0 "General Dynamics F-111A Oryctérope"
 USA_jet_tac_bomber_equipment_4_short:0 "F-111A Oryctérope"
 USA_jet_tac_bomber_equipment_4_desc:0 "L'Aardvark est un avion d'interdiction supersonique doté d'un radar épousant le terrain, de turboréacteurs à postcombustion avancés et d'ailes à flèche variable. Cela permet des frappes à grande vitesse et à basse altitude en profondeur en territoire ennemi."
 USA_jet_tac_bomber_equipment_5:0 "General Dynamics F-111E Oryctérope"
 USA_jet_tac_bomber_equipment_5_short:0 "F-111E Oryctérope"
 USA_jet_tac_bomber_equipment_5_desc:0 "Conçue comme une solution provisoire pour le F-111D, la variante E est la dernière mise à niveau de la plate-forme « Aardvark » et comprend des prises d'air avancées et une suite avionique améliorée."
 USA_jet_tac_bomber_equipment_6:0 "General Dynamics F-111F Oryctérope"
 USA_jet_tac_bomber_equipment_6_short:0 "F-111F Oryctérope"
 USA_jet_tac_bomber_equipment_6_desc:0 "Considérée comme la variante ultime de l'Aardvark, la variante F présente des améliorations des prises d'air et de l'avionique, ainsi qu'une technologie avancée de désignation FLIR et laser et un dôme radar moins cher. Ces ajouts de variantes ont rendu l'avion capable d'utiliser des munitions à guidage de précision."
 USA_jet_tac_bomber_equipment_7:0 "McDonnell Douglas F-15E Strike Eagle"
 USA_jet_tac_bomber_equipment_7_short:0 "Aigle de frappe F-15E"
 USA_jet_tac_bomber_equipment_7_desc:0 "Un chasseur-bombardier doté de la capacité de combat air-air du F-15C et de capacités air-sol supplémentaires. Capable d'être équipé d'un large éventail d'armements, notamment anti-aériens, d'attaque au sol, de missiles multi-verrouillage et de bombes aériennes, il est capable de faire face à une variété de situations. Appelé « Strike Eagle », son extérieur est presque identique à celui du F-15C, il offre diverses améliorations en matière d'attaque au sol."
 USA_jet_tac_bomber_equipment_8:0 "Boeing F-15E Aigle Avancé"
 USA_jet_tac_bomber_equipment_8_short:0 "F-15E Aigle Avancé"
 USA_jet_tac_bomber_equipment_8_desc:0 "La variante F-15 Advanced Eagle est une mise à niveau par rapport aux modèles précédents dans la mesure où elle comprend deux points d'attache supplémentaires pour les armes sous les ailes (augmentant le nombre de neuf à onze) ; l'option d'un cockpit d'affichage de grande surface ; commandes de vol électriques ; le radar à réseau actif à balayage électronique (AESA) Raytheon AN/APG-82(V)1 ou AN/APG-63(V)3 ; Moteurs General Electric General Electric F110-129 ; systèmes de repérage numériques communs montés sur casque dans les deux cockpits ; et un système de guerre électronique numérique, entre autres améliorations."
 
 USA_jet_strat_bomber_equipment_1:0 "Convair B-36 pacificateur"
 USA_jet_strat_bomber_equipment_1_short:0 "B-36 Pacificateur"
 USA_jet_strat_bomber_equipment_1_desc:0 "Le B-36 était le plus gros bombardier à hélice jamais entré en service lorsqu'il l'a fait en 1948. Sa taille signifiait que, sans modifications du châssis ou de la bombe, il pouvait transporter n'importe quelle bombe nucléaire que les États-Unis avaient dans leur arsenal à l'époque. Cependant, l'avènement des avions à réaction dans la guerre signifiait que ce type serait rapidement remplacé par le B-47 et le B-52. Contrairement à l'opinion populaire, le B-36 n'a pas de surnom officiel, mais la société et nombre de ses pilotes qui appréciaient ce type l'appelaient « Peacemaker »."
 USA_jet_strat_bomber_equipment_2:0 "Boeing B-47 Stratojet"
 USA_jet_strat_bomber_equipment_2_short:0 "B-47 Stratojet"
 USA_jet_strat_bomber_equipment_2_desc:0 "Le B-47, baptisé « Stratojet », est un bombardier subsonique à haute altitude à six moteurs qui vole à haute altitude pour éviter les intercepteurs ennemis. Avec ses moteurs transportés dans des nacelles sous l'aile en flèche, le B-47 constituait une innovation majeure dans la conception des avions de combat de l'après-Seconde Guerre mondiale et contribuait au développement d'avions de ligne modernes."
 USA_jet_strat_bomber_equipment_3:0 "Boeing B-52D Stratoforteresse"
 USA_jet_strat_bomber_equipment_3_short:0 "B-52D Stratoforteresse"
 USA_jet_strat_bomber_equipment_3_desc:0 "Le B-52 est un gros bombardier subsonique à longue portée capable d'effectuer de longues missions au-dessus du territoire ennemi. Grâce à ses performances supérieures à des vitesses subsoniques élevées et à ses coûts d'exploitation relativement faibles, le « Stratofortress » est resté en service malgré l'avènement d'avions ultérieurs plus avancés"
 USA_jet_strat_bomber_equipment_4:0 "Boeing B-52G Stratoforteresse"
 USA_jet_strat_bomber_equipment_4_short:0 "B-52G Stratoforteresse"
 USA_jet_strat_bomber_equipment_4_desc:0 "La variante G du B-52 est dotée d'une électronique et d'une avionique améliorées ainsi que d'une charge utile plus importante. Cette variante présente également une autonomie plus longue grâce à une refonte du cadre pour une capacité de carburant accrue. Avec cette refonte et d'autres, la « Stratofortress » sert de plate-forme de bombardier de premier plan jusque dans les années 2050."
 USA_jet_strat_bomber_equipment_5:0 "Boeing-B-52H"
 USA_jet_strat_bomber_equipment_5_short:0 "B-52H Stratoforteresse"
 USA_jet_strat_bomber_equipment_5_desc:0 "Le B-52H présentait les mêmes changements d'équipage et de structure que le B-52G. L'amélioration la plus importante a été le passage aux turboréacteurs à double flux TF33-P-3 qui, malgré les problèmes de fiabilité initiaux (corrigés en 1964 dans le cadre du programme Hot Fan), offraient des performances et une économie de carburant considérablement meilleures que les turboréacteurs J57. L'ECM et l'avionique ont été mis à jour, un nouveau système de conduite de tir a été installé et l'armement défensif arrière est passé de mitrailleuses à un canon Vulcan M61 de 20 mm."
 
 USA_mach2stratbomber_equipment_1:0 "Convair B-58 Hustler"
 USA_mach2stratbomber_equipment_1_short:0 "B-58 Hustler"
 USA_mach2stratbomber_equipment_1_desc:0 "Le Hustler est un bombardier supersonique à ailes delta. Bien qu'il ne puisse pas égaler la charge utile des bombardiers plus gros, il compense cela par sa vitesse."
 USA_mach2stratbomber_equipment_2:0 "Rockwell B-1A Lancer"
 USA_mach2stratbomber_equipment_2_short:0 "Lancier B-1A"
 USA_mach2stratbomber_equipment_2_desc:0 "Le B-1 a été envisagé pour la première fois dans les années 1960 comme une plate-forme qui combinerait la vitesse de Mach 2 du B-58 Hustler avec la portée et la charge utile du B-52, et devait à terme remplacer les deux bombardiers. Après une longue série d'études, Rockwell International (qui fait désormais partie de Boeing) a remporté le concours de conception de ce qui est devenu le B-1A. Cette version avait une vitesse de pointe de Mach 2,2 à haute altitude et la capacité de voler sur de longues distances à Mach 0,85 à très basse altitude."
 USA_mach2stratbomber_equipment_3:0 "Rockwell B-1B Lancer"
 USA_mach2stratbomber_equipment_3_short:0 "Lancier B-1B"
 USA_mach2stratbomber_equipment_3_desc:0 "Bien qu'il soit plus lent que le précédent A, le B-1B « Lancer » avait une plus grande capacité de carburant et une plus grande capacité pour un chargement de bombes externe en plus de sa soute à bombes interne. De plus, le B-1B dispose d'une suite de guerre électronique améliorée et a été repensé avec une section efficace radar réduite, permettant ainsi d'être plus difficile à détecter, malgré la diminution de la vitesse."
 USA_mach3stratbomber_equipment_1:0 "B-70 Valkyrie nord-américain"
 USA_mach3stratbomber_equipment_1_short:0 "B-70 Valkyrie"
 USA_mach3stratbomber_equipment_1_desc:0 "Le B-70 est un bombardier stratégique capable de Mach 3 conçu pour les frappes nucléaires à pénétration profonde. Conçu dans les années 1950, le B-70 a été conçu pour remplacer le B-52 et a été conçu pour effectuer une super-croisière à Mach 3, une technique qui ne sera reproduite que pour le F-22 près d'un demi-siècle plus tard. Surnommé « Valkyrie », le B-70 serait le catalyseur des futurs bombardiers supersoniques."
 USA_mach6stratbomber_equipment_1:0 "Lockheed Martin SR-72"
 USA_mach6stratbomber_equipment_1_short:0 "SR-72"
 USA_mach6stratbomber_equipment_1_desc:0 "Bombardier stratégique à grande vitesse, le SR-72 a été conçu à l'origine pour remplacer l'avion de reconnaissance stratégique SR-71 Blackbird. Contrairement au Blackbird, le SR-72 est extrêmement maniable pour un avion à grande vitesse et est capable de transporter un grand nombre de munitions."

 USA_nuclearstratbomber_equipment_1:0 "Convair NB-36H croisé"
 USA_nuclearstratbomber_equipment_1_short:0 "Croisé NB-36H"
 USA_nuclearstratbomber_equipment_1_desc:0 "Développé dans le cadre du programme Aircraft Nuclear Propulsion (ANP), le NB-36H a été le premier bombardier stratégique à propulsion nucléaire développé pour l'US Air Force. Les modifications apportées au B-36 Peacemaker comprenaient une nouvelle section de cabine pilote recouverte de plomb et de caoutchouc, ainsi que de verre au plomb pour éviter la contamination des pilotes. L'avion était équipé d'un réacteur refroidi par air de 1 mégawatt, pesant 35 000 livres (16 000 kg), suspendu à un crochet dans la soute à bombes centrale pour faciliter le chargement et le déchargement lorsqu'il n'était pas en vol. Malgré son annulation en 1961 pour des raisons de sécurité, le « Crusader » a fourni à la NASA un aperçu des méthodes de manipulation des métaux liquides et des sels fondus, contribuant ainsi au développement de générateurs et de réacteurs nucléaires."
 USA_nuclearstratbomber_equipment_2:0 "Boeing XB-37B"
 USA_nuclearstratbomber_equipment_2_short:0 "XB-37B"
 USA_nuclearstratbomber_equipment_2_desc:0 "Variante modifiée du véhicule d'essai orbital X-37B (OTV). Un vaisseau spatial orbital robotique réutilisable et réutilisable. Cet engin autonome possède une capacité interne pour lancer des missiles de croisière ou des bombes à partir d'une baie d'armes interne rotative. Cette variante dispose d'un moteur nucléaire lui offrant un temps de vol presque illimité."

 USA_cv_jet_CAS_equipment_1:0 "Douglas AD-1 Skyraider"
 USA_cv_jet_CAS_equipment_1_short:0 "AD-1 Skyraider"
 USA_cv_jet_CAS_equipment_1_desc:0 "Le Douglas A-1 Skyraider (anciennement AD Skyraider) est un avion d'attaque monoplace américain qui a été utilisé entre la fin des années 40 et le début des années 80. Le Skyraider a eu une carrière remarquablement longue et fructueuse ; il est devenu un anachronisme propulsé par un piston et une hélice à l'ère des avions à réaction, et a été surnommé « Spad »."
 USA_cv_jet_CAS_equipment_2:0 "Douglas AD-4 Skyraider"
 USA_cv_jet_CAS_equipment_2_short:0 "AD-4 Skyraider"
 USA_cv_jet_CAS_equipment_2_desc:0 "Train d'atterrissage renforcé, radar amélioré, compas G-2, combinaisons anti-G, quatre canons de 20 mm (0,79 po) et 14 lance-roquettes Aero, capables de transporter jusqu'à 50 lb (23 kg) de bombes"
 USA_cv_jet_CAS_equipment_3:0 "Douglas A-3B Skywarrior"
 USA_cv_jet_CAS_equipment_3_short:0 "A-3B Guerrier du Ciel"
 USA_cv_jet_CAS_equipment_3_desc:0 "Version bombardier de production définitive, avec une cellule plus solide, des moteurs plus puissants, une surface d'aile légèrement plus grande (812 pi²/75 m² contre 779 pi²/72 m²), une possibilité d'enrouleur de ravitaillement en vol pour le rôle de ravitailleur. Les 21 derniers exemplaires construits avaient un nouveau système de bombardement AN/ASB-7 et un nez remodelé ; tourelle de queue supprimée au profit de l'installation de guerre électronique."
 USA_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 USA_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 USA_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un engin d'attaque léger monomoteur capable de transporter la même charge de bombes qu'un B-17 malgré son châssis plus petit. Servant dans plusieurs forces aériennes et aéronavales depuis son introduction en 1954, il a connu de nombreuses modifications et modernisations au cours de ses plus de 60 années de service et continue de servir dans de nombreux pays jusqu'à ce jour. Son surnom est « Skyhawk »."
 USA_cv_jet_CAS_equipment_5:0 "Douglas A-4E Skyhawk"
 USA_cv_jet_CAS_equipment_5_short:0 "A-4E Skyhawk"
 USA_cv_jet_CAS_equipment_5_desc:0 "Mise à niveau majeure, comprenant un nouveau moteur Pratt & Whitney J52-P-6A avec une poussée de 8 400 lbf (37 kN), une cellule renforcée avec deux pylônes d'armes supplémentaires (pour un total de cinq), une avionique améliorée, avec TACAN, un radar de navigation Doppler, un altimètre radar, un ordinateur de bombardement par lancer et un système de bombardement à basse altitude AJB-3A. Beaucoup ont ensuite été mis à niveau avec le moteur J52-P-8 produisant 9 300 lbf (41 kN) de poussée"
 USA_cv_jet_CAS_equipment_6:0 "Intrus Grumman A-6A"
 USA_cv_jet_CAS_equipment_6_short:0 "A-6A Intrus"
 USA_cv_jet_CAS_equipment_6_desc:0 "Un avion embarqué tout temps doté de systèmes électroniques hautement perfectionnés pour l'époque. Il a été développé dans le but de lui permettre de voler à basse altitude en territoire ennemi et d'utiliser une sélection d'armes pour porter un coup critique. Son surnom est « Intrus ». Il a également eu une variété d'autres surnoms provenant de sa grande partie avant et de sa partie arrière élancée, notamment « Tadpole » et « Dog Ship »."
 USA_cv_jet_CAS_equipment_7:0 "LTV A-7 Corsaire II"
 USA_cv_jet_CAS_equipment_7_short:0 "A-7 Corsaire II"
 USA_cv_jet_CAS_equipment_7_desc:0 "Développé à partir du F-8 Crusader, le « Corsair II » (du nom du F4U Corsair) est un avion d'attaque léger monoplace, subsonique et embarqué, avec une charge utile et une portée plus grandes que l'A-4 Skyhawk qu'il a remplacé. Il servira plus tard dans l'US Air Force, remplaçant les vénérables A-1 Skyraider et F-100 Super Sabre, devenant ainsi l'un des rares avions d'attaque au sol à servir à la fois dans la Marine et dans l'Air Force."
 USA_cv_jet_CAS_equipment_8:0 "Intrus Grumman A-6E"
 USA_cv_jet_CAS_equipment_8_short:0 "Intrus A-6E"
 USA_cv_jet_CAS_equipment_8_desc:0 "La version d'attaque définitive de l'Intruder avec des systèmes de navigation et d'attaque considérablement améliorés. Les anciens radars séparés de recherche et de poursuite (contrôle de tir) de l'A-6A/B/C ont été remplacés par un seul radar multimode Norden AN/APQ-148 et des ordinateurs de bord dotés d'un système plus sophistiqué et plus fiable."
 USA_cv_jet_CAS_equipment_9:0 "Grumman A-6E Intrus WCSI"
 USA_cv_jet_CAS_equipment_9_short:0 "A-6E Intrus WCSI"
 USA_cv_jet_CAS_equipment_9_desc:0 "Dans les années 1980, les avions A-6E Intruder ont été convertis en version A-6E WCSI (Weapons Control System Improvement) pour ajouter des capacités d'armes supplémentaires. Cela a ajouté la possibilité de transporter et de cibler certaines des armes à guidage de précision de première génération, comme le missile AGM-84 Harpoon et l'AGM-123 Skipper. L'avion WCSI a finalement été modifié pour avoir une capacité limitée d'utiliser le missile d'attaque terrestre à impasse AGM-84E SLAM. Étant donné que les missiles Harpoon et SLAM avaient des interfaces de communication communes, les avions WCSI pouvaient transporter et tirer des missiles SLAM, mais avaient besoin d'un SWIP A-6E à proximité pour les guider vers la cible."
 USA_cv_jet_CAS_equipment_10:0 "McDonnell Douglas F/A-18B Hornet"
 USA_cv_jet_CAS_equipment_10_short:0 "F/A-18B Hornet"
 USA_cv_jet_CAS_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les nouvelles avancées des technologies informatiques avec une vitesse et une agilité élevées pour créer des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut contenir, le « Hornet » basé sur un porte-avions a été conçu comme un avion multirôle pour gérer à la fois des missions air-air et air-sol. Le B est une version d'attaque au sol biplace."
 #USA_cv_jet_CAS_equipment_9:0 "A heavily upgraded A-6, sharing the Pratt & Whitney J52 turbojets with the F/A-18C Hornet. Upgrades also include avionics improvements, MFDs, the AN/APQ-173 RADAR and ability to equip the AIM-120 AMRAAM AA missile."
 #USA_cv_jet_CAS_equipment_9_short:0 "A-6F Intruder II"
 #USA_cv_jet_CAS_equipment_9_desc:0 "Grumman A-6F Intruder II"
 #USA_cv_jet_CAS_equipment_10:0 "McDonnell Douglas F/A-18C Hornet"
 #USA_cv_jet_CAS_equipment_10_short:0 "F/A-18C Hornet"
 #USA_cv_jet_CAS_equipment_10_desc:0 "The single-seat C variant of the 'Hornet' came as a result of a block upgrade in 1987. This upgrade came in the form of a new synthetic aperture ground mapping radar system for tracking targets in low-visibility conditions. New avionics, such as a thermal navigation pod, forward looking infrared array (FLIR), night-vision goggles and two full-color multi-function displays (MFD) allow the aircraft to perform superbly in nighttime attacks. It also was capable of carrying newer types of ordinance, including the AMRAAM Medium-Range Air-to-Air Missile, and Precision Guided Bombs."

 USA_cv_jet_multirole_equipment_1:0 "McDonnell Douglas F2H Banshee"
 USA_cv_jet_multirole_equipment_1_short:0 "F2H Banshee"
 USA_cv_jet_multirole_equipment_1_desc:0 "Le McDonnell F2H Banshee était un avion de combat à réaction monoplace embarqué par la Marine américaine et le Corps des Marines des États-Unis de 1948 à 1961. C'était l'un des principaux chasseurs américains utilisés pendant la guerre de Corée et le seul chasseur à réaction déployé par la Marine royale canadienne."
 USA_cv_jet_multirole_equipment_2:0 "Grumman F9F Panthère"
 USA_cv_jet_multirole_equipment_2_short:0 "Panthère F9F"
 USA_cv_jet_multirole_equipment_2_desc:0 "Le F9F a été conçu à l'origine comme un avion à réaction à aile droite introduit en 1949. L'un des premiers avions à réaction capables de porter un porte-avions utilisé dans la marine américaine, il était le principal avion d'attaque au sol de l'USN et de l'USMC pendant la guerre de Corée, effectuant 78 000 sorties, et a été crédité de la première destruction aérienne d'un chasseur de la marine américaine pendant la guerre. Son châssis robuste permettait à l'engin de soutenir des opérations d'attaque au sol, même face aux tirs des AA. Le F9F (plus tard rebaptisé F-9) servira également avec les Blue Angels, devenant ainsi le premier avion à réaction utilisé par l'équipe. Suivant la tradition de Grumman consistant à donner aux avions le nom de grands félins, l'avion est connu sous le nom de « Panthère »."
 USA_cv_jet_multirole_equipment_3:0 "Démon McDonnell F3H"
 USA_cv_jet_multirole_equipment_3_short:0 "Démon F3H"
 USA_cv_jet_multirole_equipment_3_desc:0 "Le F3H était un chasseur subsonique à ailes en flèche qui a été en proie à des difficultés tout au long de sa carrière. Initialement destiné au moteur J40, des problèmes avec la conception du prototype ont conduit à l'annulation du moteur et le F3H recevrait en remplacement un moteur à faible puissance. Malgré ses problèmes, le Démon était un intercepteur performant par tous les temps, avec une bonne visibilité pour l'époque. Initialement armée uniquement de quatre canons de 20 mm, une variante ultérieure serait équipée des premiers modèles de ce qui allait devenir le missile infrarouge AIM-9 Sidewinder et le missile air-air semi-actif AAM-N-2 (plus tard AIM-7) Sparrow. Conformément aux conventions de dénomination de McDonnell, son surnom officiel est le « Démon »."
 USA_cv_jet_multirole_equipment_4:0 "Vought F-8 croisé"
 USA_cv_jet_multirole_equipment_4_short:0 "Croisé F-8"
 USA_cv_jet_multirole_equipment_4_desc:0 "Chasseur monomoteur supersonique de supériorité aérienne, le F-8 (à l'origine connu sous le nom de F8U) a été conçu pour la défense aérienne rapprochée de la flotte. L'avion transporte une charge utile de munitions plus importante que le F11F Tiger ou le F7U Cutlass (ce dernier qu'il a remplacé), ainsi que la capacité de fonctionner comme une plate-forme de reconnaissance photographique rapide. Surnommé le « Croisé », il était l'un des chasseurs de supériorité aérienne à conserver son armement interne au moment de la guerre du Vietnam, lui donnant ainsi un autre surnom, « Le dernier Gunfighter »."
 USA_cv_jet_multirole_equipment_5:0 "McDonnell Douglas F-4B Phantom II"
 USA_cv_jet_multirole_equipment_5_short:0 "F-4B Fantôme II"
 USA_cv_jet_multirole_equipment_5_desc:0 "Avion de combat et d'attaque au sol biplace tous temps basé sur un porte-avions pour l'US Navy et le Marine Corps. Moteurs J79-GE-8A ou -8B avec 16 950 lbf (75,4 kN) de poussée de postcombustion chacun. Appelé « Phantom II » (et nommé d'après le FH Phantom), le F-4 Phantom II a été le premier avion partagé par trois branches des forces armées américaines, la Marine, les Marines et l'Armée de l'Air."
 USA_cv_jet_multirole_equipment_6:0 "McDonnell Douglas F-4J Phantom II"
 USA_cv_jet_multirole_equipment_6_short:0 "F-4J Fantôme II"
 USA_cv_jet_multirole_equipment_6_desc:0 "Version améliorée du F-4B pour l'US Navy et le Marine Corps, en mettant l'accent sur l'amélioration des capacités de combat air-air, notamment : Moteurs J79-GE-10 avec 17 844 lbf (79,374 kN) de poussée de postcombustion chacun, radar Doppler à impulsions AN/APG-59 couplé au système de contrôle de tir AN/AWG-10 pour une capacité d'abattage avec vue vers le bas, roues de train d'atterrissage principal plus grandes résultant en des renflements d'ailes similaires à ceux du F-4C, empennage à lattes, ailerons tombés de 16,5° lorsque le train d'atterrissage et les volets étaient déployés pour diminution de la vitesse d'atterrissage, sièges éjectables zéro-zéro, capacité d'attaque au sol étendue, pas de capteur IRST sous le nez."
 USA_cv_jet_multirole_equipment_7:0 "McDonnell Douglas F-4N Phantom II"
 USA_cv_jet_multirole_equipment_7_short:0 "F-4N Fantôme II"
 USA_cv_jet_multirole_equipment_7_desc:0 "F-4B modernisé dans le cadre du projet Bee Line, les mêmes améliorations aérodynamiques que le F-4J, des moteurs sans fumée et une cellule renforcée."
 USA_cv_jet_multirole_equipment_8:0 "Grumman F-14A Tomcat"
 USA_cv_jet_multirole_equipment_8_short:0 "F-14A Tomcat"
 USA_cv_jet_multirole_equipment_8_desc:0 "Un grand chasseur embarqué destiné à succéder au F-4 comme principal système de défense aérienne de la flotte. Il possède des ailes variables qui peuvent changer automatiquement d'angle même pendant le vol, permettant à la fois des capacités de vitesse élevée dans les plages de vitesse élevées et une grande maniabilité dans les plages de vitesse faible. Il est également équipé de missiles à longue portée capables d'abattre les ennemis sur une distance considérable. Connu sous le nom de « Tomcat »."
 USA_cv_jet_multirole_equipment_9:0 "Grumman F-14B Tomcat"
 USA_cv_jet_multirole_equipment_9_short:0 "F-14B Tomcat"
 USA_cv_jet_multirole_equipment_9_desc:0 "Une variante du chasseur F-14A embarqué, créée via une mise à niveau majeure qui comprend la coupure du moteur. Les principales améliorations comprennent la résolution des problèmes de moteur, une propulsion accrue et une avionique révisée. D'autres modifications ont été apportées dans les années 90, destinées à prolonger la durée de vie de l'avion et à fournir davantage de capacités d'attaque air-sol. Ce F-14 modifié est également utilisé pour des attaques tactiques à grande vitesse et à longue distance. Il est connu sous le nom de « Tomcat », le même que le type A. Lorsqu'il est modifié pour le bombardement, le F-14 est également connu officieusement sous le nom de « Bombcat »."
 USA_cv_jet_multirole_equipment_10:0 "McDonnell Douglas F/A-18A Hornet"
 USA_cv_jet_multirole_equipment_10_short:0 "F/A-18A Hornet"
 USA_cv_jet_multirole_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les nouvelles avancées des technologies informatiques avec une vitesse et une agilité élevées pour créer des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut contenir, le « Hornet » basé sur un porte-avions a été conçu comme un avion multirôle pour gérer à la fois des missions air-air et air-sol."
 #USA_cv_jet_multirole_equipment_9:0 "Grumman F-14D Super Tomcat"
 #USA_cv_jet_multirole_equipment_9_short:0 "F-14D Super Tomcat"
 #USA_cv_jet_multirole_equipment_9_desc:0 "A revision of the F-14, which has come to characterize carrier-based fighters, known as the 'Super Tomcat'. While maintaining the stable maneuverability offered by the digitally controlled variable sweep wing and the capability to neutralize multiple incoming targets at long range, it is also outfitted with a new onboard radar and engine."
 #USA_cv_jet_multirole_equipment_10:0 "Boeing F/A-18E Super Hornet"
 #USA_cv_jet_multirole_equipment_10_short:0 "F/A-18E Super Hornet"
 #USA_cv_jet_multirole_equipment_10_desc:0 "Whether it's air-to-air or air-to-ground, this carrier-based fighter is capable of handling a wide variety of missions. An easy-to-handle aircraft that boasts stable maneuverability at any speed. Equipped with long-range attack weapons, it's well-suited for preemptive attacks. Nicknamed the 'Super Hornet'."
  
 USA_stealth_tactical_bomber_equipment_1:0 "Lockheed F-117A Nighthawk"
 USA_stealth_tactical_bomber_equipment_1_short:0 "F-117A Nighthawk"
 USA_stealth_tactical_bomber_equipment_1_desc:0 "Le tout premier attaquant furtif, spécialisé dans les bombardements secrets. Comme la conception est entièrement axée sur les capacités furtives, l'avion manque de vitesse et de maniabilité. D'un autre côté, cependant, rester hors du radar ennemi lui permet d'utiliser des bombes guidées pour effectuer des frappes précises. Il a une forme unique composée de surfaces planes et d'un travail de peinture spécial afin de réfléchir et d'absorber les ondes radar. Connu sous le nom de « Nighthawk », il a été reconnu pendant la guerre du Golfe de 1991 pour avoir effectué plus de 1 200 sorties sans qu'un seul des avions ne soit abattu."
 USA_stealth_tactical_bomber_equipment_2:0 "Lockheed Martin FB-22 Strike Raptor"
 USA_stealth_tactical_bomber_equipment_2_short:0 "Raptor de frappe FB-22"
 USA_stealth_tactical_bomber_equipment_2_desc:0 "Le Lockheed Martin FB-22 était un bombardier furtif proposé destiné à entrer en service dans l'armée de l'air américaine. Sa conception est dérivée du F-22 Raptor. Le FB-22 a été annulé à la suite de l'examen quadriennal de la défense de 2006. L'autonomie a été presque triplée, passant de 600 milles (970 km) à plus de 1 600 milles (2 600 km), qui aurait pu être étendue par des réservoirs de carburant externes. Cela plaçait l'avion dans la catégorie des bombardiers régionaux, comparable à celle du F-111."

 USA_stealth_strategic_bomber_equipment_1:0 "Northrop Grumman B-2 Esprit"
 USA_stealth_strategic_bomber_equipment_1_short:0 "B-2 Esprit"
 USA_stealth_strategic_bomber_equipment_1_desc:0 "Un bombardier stratégique furtif capable de pénétrer en territoire ennemi sans être détecté par le radar et d'effectuer des bombardements à grande échelle. Il s'agit d'un avion à ailes volantes qui n'a pas de queue, ce qui le rend plus difficile à détecter par le radar. Ses performances de manoeuvre ont été remplacées par des performances furtives accrues, afin qu'il puisse pénétrer les filets radar avec plus de sécurité. Le nombre d'avions fabriqués est extrêmement faible, c'est pourquoi chaque avion reçoit un nom unique composé du surnom « Esprit » et du nom d'un territoire géographique."
 USA_stealth_strategic_bomber_equipment_2:0 "Northrop Grumman B-21 Raider"
 USA_stealth_strategic_bomber_equipment_2_short:0 "B-21 Raider"
 USA_stealth_strategic_bomber_equipment_2_desc:0 "Développé à partir des enseignements tirés du B-2 Spirit, le B-21, dans le cadre du programme Long Range Strike Bomber (LRS-B), doit être un bombardier stratégique furtif à très longue portée pour l'US Air Force, capable d'emporter des armes conventionnelles ou thermonucléaires. Comme son prédécesseur, le « Raider » est un bombardier à ailes volantes, qui augmente les performances furtives pour pénétrer les filets radar de manière plus sûre."

 USA_stealth_fighter_equipment_1:0 "Lockheed Martin F-22A Raptor"
 USA_stealth_fighter_equipment_1_short:0 "F-22A Raptor"
 USA_stealth_fighter_equipment_1_desc:0 "Ce chasseur furtif ultime fait la fierté des forces armées américaines. Outre ses performances de vol, il offre des performances d'accélération de premier ordre et une tuyère de déflexion de poussée bidimensionnelle qui lui confère également une maniabilité exceptionnelle. Sa puissance de frappe préventive, appelée « premier regard, premier tir, premier meurtre », convient parfaitement à un avion portant le nom de « Raptor », le maître du ciel."
 USA_cv_stealth_fighter_equipment_1:0 "Lockheed Martin F-22N Sea Raptor"
 USA_cv_stealth_fighter_equipment_1_short:0 "Raptor marin F-22N"
 USA_cv_stealth_fighter_equipment_1_desc:0 "Nommé « Sea Raptor », le F-22N est la variante embarquée du Raptor et possède bon nombre des mêmes capacités que le F-22A terrestre. Développé pour l'US Navy, le F-22N possède une capacité de décollage court qui lui permet d'être utilisé pour des opérations sur porte-avions. En plus d'être capables de distribuer des munitions, les missiles hautes performances lui permettent d'attaquer hors de portée des avions ennemis. Parfaitement adapté aux missions de combat aérien et à la défense aérienne de la flotte, le F-22N est un puissant chasseur préemptif."
 
 USA_jump_jet_equipment_1:0 "Hawker Siddeley AV-8A Harrier"
 USA_jump_jet_equipment_1_short:0 "Harrier AV-8A"
 USA_jump_jet_equipment_1_desc:0 "Cet attaquant a été développé pour faire du VTOL (décollage et atterrissage verticaux) une réalité. Il présente une conception unique comprenant des ailes montées en hauteur et quatre buses rotatives. Cela permet d'opérer dans des espaces limités tels que les porte-avions légers et les petits aérodromes. L'avion est communément connu sous le nom de « Harrier ». Développé en Grande-Bretagne, l'AV-8A est connu en Grande-Bretagne sous le nom de Harrier Mk. 50 et fonctionnait de manière similaire aux Harrier GR.1 de la Royal Air Force."
 USA_jump_jet_equipment_2:0 "Hawker Siddeley AV-8C Harrier"
 USA_jump_jet_equipment_2_short:0 "Harrier AV-8C"
 USA_jump_jet_equipment_2_desc:0 "La variante « C » est une version améliorée de l'AV-8A et fonctionne avec des systèmes similaires au Harrier GR.3, avec un nouvel équipement ECM et un système de navigation inertielle."
 USA_jump_jet_equipment_3:0 "McDonnell Douglas AV-8B Harrier II"
 USA_jump_jet_equipment_3_short:0 "AV-8B Harrier II"
 USA_jump_jet_equipment_3_desc:0 "Le Harrier II est un projet anglo-américain conjoint conçu par McDonnell Douglas avec British Aerospace. Au service du Corps des Marines des États-Unis depuis 1985, le « Harrier II » était considéré comme un outil important dans de nombreux conflits américains de mémoire récente."
 USA_jump_jet_equipment_4:0 "McDonnell Douglas AV-8B Harrier II Plus"
 USA_jump_jet_equipment_4_short:0 "AV-8B Harrier II Plus"
 USA_jump_jet_equipment_4_desc:0 "Mise à niveau à mi-vie de l'AV-8B, l'AV-8B Plus intègre un moteur amélioré, un système radar et une caméra infrarouge, ce qui en fait un avion d'attaque de nuit très efficace."

 USA_recon_equipment_0:0 "Stinson L-5 Sentinelle"
 USA_recon_equipment_0_short:0 "Sentinelle L-5"
 USA_recon_equipment_0_desc:0 "Le Stinson L-5 Sentinel était un avion de liaison de la Seconde Guerre mondiale utilisé par toutes les branches de l'armée américaine et par la Royal Air Force britannique. Il a été produit par la Stinson Aircraft Company. Avec le Stinson L-1 Vigilant, le L-5 était le seul autre avion de liaison américain de la Seconde Guerre mondiale spécialement construit pour un usage militaire et n'avait pas d'équivalent civil. Tous les autres avions de liaison militaire adoptés pendant la Seconde Guerre mondiale étaient des modèles civils « prêts à l'emploi » légèrement modifiés."
 USA_jet_recon_equipment_0:0 "Sabre nord-américain RF-86"
 USA_jet_recon_equipment_0_short:0 "Sabre RF-86"
 USA_jet_recon_equipment_0_desc:0 "Conversions F-86 avec trois caméras pour la reconnaissance"
 USA_jet_recon_equipment_1:0 "McDonnell Douglas RF-4C Phantom II"
 USA_jet_recon_equipment_1_short:0 "RF-4C Fantôme II"
 USA_jet_recon_equipment_1_desc:0 "Version de reconnaissance tactique tous temps pour le radar de l'US Air Force, AN/APQ-99 (plus tard AN/APQ-172). Équipé de manière similaire au RF-4B mais avec un plus grand choix d'appareils photo, y compris un module central pour le gigantesque appareil photo HIAC-1 LOROP (Long Range Oblique Photography), capable de prendre des images haute résolution d'objets situés à 100 miles (160 km). De nombreux avions ont été réaménagés avec un nez profilé, bombé et plus spacieux."
 USA_jet_recon_equipment_2:0 "Lockheed Martin F-16C Block 30 Reco"
 USA_jet_recon_equipment_2_short:0 "F-16C Bloc 30 Reconnaissance"
 USA_jet_recon_equipment_2_desc:0 "La première variante de reconnaissance était un F-16D de l'USAF configuré expérimentalement en 1986 avec une nacelle de style baignoire multi-capteurs sur la ligne centrale. L'USAF a décidé en 1988 de remplacer la flotte vieillissante des RF-4C Phantom par des F-16C Block 30 équipés du pod central du système de reconnaissance aéroporté tactique avancé (ATARS) de Control Data Corporation, qui pouvait transporter une variété de capteurs. Des problèmes avec le programme ATARS ont cependant conduit au départ de l'USAF en juin 1993. Au milieu des années 1990, l'US Air Force a expérimenté une série de modèles de modules de reconnaissance sur la ligne centrale, en commençant par un prototype de module, le module Electro-Optical 1 (EO-1). Le premier vol du F-16 avec un prototype TARS a eu lieu le 26 août 1995 et le 27 septembre 1996, l'USAF a passé sa première commande de production de nacelles."
 
 USA_transport_plane_equipment_1:0 "Train aérien Douglas C-47"
 USA_transport_plane_equipment_1_short:0 "Train aérien C-47"
 USA_transport_plane_equipment_1_desc:0 "Développé à partir de l'avion de ligne Douglas DC-3 lors de son premier vol en 1941, le C-47 était l'avion de transport par excellence utilisé par les Alliés. Pendant la Seconde Guerre mondiale, les forces armées de nombreux pays ont utilisé le C-47 et des DC-3 modifiés pour le transport de troupes, de marchandises et de blessés. Plus de 10 000 unités, à la fois le C-47 et la variante navale R4D (plus tard C-117) ont été construites pour la guerre, et de nombreux « Skytrains » ont été utilisés non seulement pour le transport de troupes et de marchandises, mais aussi pour la recherche et le sauvetage et, pendant la guerre du Vietnam, comme premiers hélicoptères de combat."
 USA_transport_plane_equipment_2:0 "Douglas C-54 Skymaster"
 USA_transport_plane_equipment_2_short:0 "C-54 Skymaster"
 USA_transport_plane_equipment_2_desc:0 "Tout comme le C-47 avant lui, le C-54 a été développé à partir d'un avion de ligne Douglas, cette fois-ci étant le DC-4. Introduit en 1942, le C-54 servait au transport de fret, mais transportait également d'importants VIP, étant l'un des premiers avions à transporter le président des États-Unis (mais pas le premier avion à être désigné Air Force One.). La renommée du « Skymaster » venait cependant du fait qu'il était le type majoritaire utilisé pour transporter du charbon et des vivres vers Berlin-Ouest, pendant le célèbre pont aérien de Berlin. Les variantes de la marine étaient connues sous le nom de R5D."
 USA_transport_plane_equipment_3:0 "Douglas C-124 Globemaster II"
 USA_transport_plane_equipment_3_short:0 "C-124 Globemaster II"
 USA_transport_plane_equipment_3_desc:0 "Le C-124 était le principal moyen de transport lourd du service de transport aérien militaire (MATS) de l'armée de l'air américaine au cours des années 1950 et au début des années 1960, jusqu'à ce que le Lockheed C-141 Starlifter entre en service. Il a servi dans les unités de la Réserve de la Force aérienne et de la Garde nationale aérienne acquises par le MATS, puis par le Military Airlift Command (MAC), jusqu'en 1974."
 USA_transport_plane_equipment_4:0 "Lockheed C-130 Hercules"
 USA_transport_plane_equipment_4_short:0 "C-130 Hercules"
 USA_transport_plane_equipment_4_desc:0 "Développé en 1954, le C-130 est un moyen de transport capable d'utiliser des pistes non préparées pour les décollages et les atterrissages, ce qui en fait un cadre pratique pour le transport de troupes et de marchandises ainsi que pour les évacuations médicales. Mais ce qui rend l'avion digne de son surnom de « Hercules », c'est qu'il y avait plusieurs sous-variantes développées pour une variété de rôles, allant du Gunship (AC-130 Spooky & Spectre), au contrôle de drones (DC-130), au Jammer et aux PSYOPS (EC-130 Compass Call) et à la reconnaissance météorologique (WC-130), entre autres. Vraiment une machine polyvalente qui mérite son surnom."
 USA_transport_plane_equipment_5:0 "Lockheed C-141 Starlifter"
 USA_transport_plane_equipment_5_short:0 "Avion de transport stellaire C-141"
 USA_transport_plane_equipment_5_desc:0 "Conçu pour remplacer les C-124 Globemaster II et C-133 Cargomaster, le C-141 est entré en service en 1965 auprès du Military Air Transport Service (MATS), de son successeur, le Military Airlift Command (MAC), et enfin de l'Air Mobility Command (AMC) de l'US Air Force. Au cours de ses plus de 40 années de service, il a participé à de nombreuses opérations américaines à travers le monde, servant dans des zones de guerre au Vietnam et en Israël."
 USA_transport_plane_equipment_6:0 "McDonnell Douglas C-5A Galaxy"
 USA_transport_plane_equipment_6_short:0 "Galaxie C-5A"
 USA_transport_plane_equipment_6_desc:0 "Le Lockheed C-5 Galaxy est un gros avion de transport militaire conçu et construit à l'origine par Lockheed, et maintenant entretenu et amélioré par son successeur, Lockheed Martin. Il fournit à l'US Air Force (USAF) une capacité de transport aérien stratégique à portée intercontinentale lourde, capable de transporter des charges surdimensionnées et surdimensionnées, y compris toutes les marchandises certifiées aériennes. Le Galaxy présente de nombreuses similitudes avec le plus petit Lockheed C-141 Starlifter et le dernier Boeing C-17 Globemaster III. Le C-5 fait partie des plus gros avions militaires au monde."
 USA_transport_plane_equipment_7:0 "McDonnell Douglas C-5B Galaxy"
 USA_transport_plane_equipment_7_short:0 "Galaxie C-5B"
 USA_transport_plane_equipment_7_desc:0 "Le C-5B est une version améliorée du C-5A. Il incorporait toutes les modifications et améliorations apportées au C-5A avec des ailes améliorées, un train d'atterrissage simplifié, des turboréacteurs à double flux TF-39-GE-1C améliorés et une avionique mise à jour."
 USA_transport_plane_equipment_8:0 "Boeing C-17A Globemaster III"
 USA_transport_plane_equipment_8_short:0 "C-17A Globemaster III"
 USA_transport_plane_equipment_8_desc:0 "Introduit en 1995, le C-17 était le troisième avion de sa famille à porter le nom de « Globemaster ». Servissant à la fois dans le rôle de transport aérien stratégique et tactique, le C-17 remplacerait le C-141 et libérerait de nombreuses tâches accomplies par le C-5 (déléguant le type au rôle de transport de fret hors taille). En service dans 8 pays, le « Globemaster III » continuera de répondre aux besoins de l'armée américaine dans les années à venir."
 USA_transport_plane_equipment_9:0 "Boeing C-17A Globemaster III Bloc 21"
 USA_transport_plane_equipment_9_short:0 "C-17A Bloc 21"
 USA_transport_plane_equipment_9_desc:0 "Cette mise à niveau logicielle/matérielle constituait une amélioration majeure du système embarqué de génération de gaz inerte amélioré (OBIGGS II), d'un nouveau radar météorologique, d'un système de jambe de force stabilisatrice amélioré et d'autres éléments avioniques."
 USA_transport_plane_equipment_10:0 "Boeing C-17A Globemaster III"
 USA_transport_plane_equipment_10_short:0 "C-17A Bloc 21"
 USA_transport_plane_equipment_10_desc:0 "Cette mise à niveau logicielle/matérielle constituait une amélioration majeure du système embarqué de génération de gaz inerte amélioré (OBIGGS II), d'un nouveau radar météorologique, d'un système de jambe de force stabilisatrice amélioré et d'autres éléments avioniques."

