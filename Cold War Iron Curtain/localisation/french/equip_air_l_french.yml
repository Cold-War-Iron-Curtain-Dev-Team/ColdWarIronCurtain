 POR_tac_bomber_equipment_0_short:0 "Ju 86"
 POR_tac_bomber_equipment_1:0 "Lockheed Hudson Mk.III"
 POR_tac_bomber_equipment_1_short:0 "Hudson Mk.III"
 POR_tac_bomber_equipment_2:0 "Lockheed B-34"
