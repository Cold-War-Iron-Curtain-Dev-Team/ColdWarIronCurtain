 CHI_jet_multirole_equipment_7:0 "Mise à jour de mi-vie du Lockheed F-104G Starfighter"
 CHI_jet_multirole_equipment_7_short:0 "F-104G MLU"
 CHI_jet_multirole_equipment_8:0 "Faucon de combat F-16A de General Dynamics"
 CHI_jet_multirole_equipment_8_short:0 "Faucon de combat F-16A"
 CHI_jet_multirole_equipment_9:0 "Dassault Mirage 2000-5EI"
 CHI_jet_multirole_equipment_9_short:0 "Mirage 2000-5EI"
 CHI_jet_multirole_equipment_10:0 "AIDC F-CK-1A Ching-kuo"
 CHI_jet_multirole_equipment_10_short:0 "F-CK-1A Ching-kuo"
 CHI_jet_multirole_equipment_10_desc:0 "L'AIDC F-CK-1 Ching-Kuo, communément connu sous le nom d'Indigenous Defence Fighter (IDF), est un avion de combat multirôle nommé en l'honneur de Chiang Ching-kuo, l'ancien président de la République de Chine. L'avion a effectué son premier vol en 1989. Il a été livré à l'armée de l'air de la République de Chine (Taïwan) en janvier 1994 et est entré en service en 1997."

 CHI_mr_stealth_fighter_equipment_1:0 "AIDC F-CK-1C Hsiang Sheng"
 CHI_mr_stealth_fighter_equipment_1_short:0 "F-CK-1C Hsiang Sheng"
 CHI_mr_stealth_fighter_equipment_1_desc:0 "En 2001, il a été annoncé que le développement d'une nouvelle variante « furtive » dotée de moteurs plus puissants et d'un système de contrôle de tir amélioré commencerait cette année-là. Dans une interview accordée en 2006 au Jane's Defence Weekly, l'ancien président de l'AIDC, Sun Tao-Yu, a déclaré que deux nouveaux prototypes avaient été fabriqués. La mise à niveau permettrait à Tsahal de transporter 771 kg supplémentaires de carburant. En outre, il comprend une suite avionique améliorée, des capacités de guerre électronique modernisées et de nouveaux systèmes d'armes. Le train d'atterrissage a été renforcé pour accueillir la charge utile et le carburant supplémentaires."

 CHI_recon_equipment_0:0 "Stinson L-5 Sentinelle"
 CHI_recon_equipment_0_short:0 "Sentinelle L-5"
 CHI_recon_equipment_0_desc:0 "Le Stinson L-5 Sentinel était un avion de liaison et de reconnaissance photographique de la Seconde Guerre mondiale utilisé par toutes les branches de l'armée américaine et par la Royal Air Force britannique. Il a été produit par la Stinson Aircraft Company."
 CHI_jet_recon_equipment_0:0 "Sabre nord-américain RF-86F"
 CHI_jet_recon_equipment_0_short:0 "Sabre RF-86F"
 CHI_jet_recon_equipment_0_desc:0 "Conversions F-86 avec trois caméras pour la reconnaissance"
