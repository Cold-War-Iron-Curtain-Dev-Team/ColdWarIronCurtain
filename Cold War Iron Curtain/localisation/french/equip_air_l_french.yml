 HOL_jet_multirole_equipment_1:0 "P-51K Mustang nord-américain"
 HOL_jet_multirole_equipment_1_short:0 "P-51K Mustang"
 HOL_jet_multirole_equipment_2:0 "Fokker Aviolanda Meteor FB.8 avec HVAR"
 HOL_jet_multirole_equipment_2_short:0 "Météore FB.8"
 HOL_jet_multirole_equipment_3:0 "Hawker Chasseur F.1"
 HOL_jet_multirole_equipment_3_short:0 "Chasseur F.1"
 HOL_jet_multirole_equipment_4:0 "Hawker Chasseur F.6"
 HOL_jet_multirole_equipment_4_short:0 "Chasseur F.6"
 HOL_jet_multirole_equipment_5:0 "Chasseur Fokker F-104G"
 HOL_jet_multirole_equipment_5_short:0 "Chasseur stellaire F-104G"
 HOL_jet_multirole_equipment_5_desc:0 "Pour remplacer les Hawker Hunters vieillissants, la Royal Dutch Air Force, exploitée par Fokker, a construit des Lockheed F-104G Starfighter après que Lockheed ait versé des pots-de-vin à de hauts responsables du gouvernement néerlandais, notamment au mari de la reine, le prince Bernard. Mis à part les scandales, le F104G a été utilisé dans une capacité multirôle en tant qu'intercepteur ainsi qu'avion d'attaque au sol."
 HOL_jet_multirole_equipment_6:0 "Mise à niveau de fiabilité du Fokker F-104G Starfighter"
 HOL_jet_multirole_equipment_6_short:0 "F-104G Starfighter RU"
 HOL_jet_multirole_equipment_7:0 "Mise à jour de mi-vie du Fokker F-104G Starfighter"
 HOL_jet_multirole_equipment_7_short:0 "F-104G MLU"
 HOL_jet_multirole_equipment_8:0 "Fokker F-16A Faucon de combat"
 HOL_jet_multirole_equipment_8_short:0 "Faucon de combat F-16A"
 HOL_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger avec une maniabilité et une stabilité bien équilibrées. Il possède un corps d'aile mixte exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Appelé « Fighting Falcon », son coût relativement faible et sa puissance élevée sont la raison pour laquelle il a été adapté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle best-seller ont été fabriqués."
 HOL_jet_multirole_equipment_9:0 "Fokker F-16A Block 15 OCU (améliorations des capacités opérationnelles) Fighting Falcon"
 HOL_jet_multirole_equipment_9_short:0 "F-16A Bloc 15 OCU"
 HOL_jet_multirole_equipment_9_desc:0 "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 HOL_jet_multirole_equipment_10:0 "Fokker F-16AM Block 15 MLU (mise à jour à mi-vie) Fighting Falcon"
 HOL_jet_multirole_equipment_10_short:0 "F-16AM Bloc 15 MLU"
 HOL_jet_multirole_equipment_10_desc:0 "Le package MLU (Mid-Life Update) du F-16 qui en résulte a été conçu pour mettre à niveau le cockpit et l'avionique à l'équivalent de ceux du F-16C/D Block 50/52 ; ajouter la possibilité d'utiliser des missiles air-air guidés par radar ; et d'une manière générale, améliorer les performances opérationnelles et améliorer la fiabilité, la capacité de soutien et la maintenabilité de l'avion."
 HOL_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 HOL_mr_stealth_fighter_equipment_1_short:0 "F-35A Foudre II"
 HOL_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnel (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le développement du programme F-35 a commencé en 1992, la variante A prenant son envol fin 2006 et larguant ses premières bombes moins de six ans plus tard. La variante A est la variante la plus petite et la plus légère du F-35 et est principalement destinée à remplacer le F-16 Fighting Falcon."
 
 HOL_tac_bomber_equipment_0:0 "Fokker C.V D/E"
 HOL_tac_bomber_equipment_0_short:0 "Fokker C.V D/E"
 HOL_tac_bomber_equipment_1:0 "Fokker TV"
 HOL_tac_bomber_equipment_1_short:0 "Fokker TV"
 HOL_tac_bomber_equipment_2:0 "Fokker T.IX"
 HOL_tac_bomber_equipment_2_short:0 "Fokker T.IX"
 HOL_tac_bomber_equipment_3:0 "B-25J Mitchell nord-américain"
 HOL_tac_bomber_equipment_3_short:0 "B-25J Mitchell"

 HOL_jet_light_equipment_1:0 "Instructeur Fokker S.11"
 HOL_jet_light_equipment_1_short:0 "S.11 Instructeur"
 HOL_jet_light_equipment_1_desc:0 "Le Fokker S.11 Instructor est un avion d'entraînement militaire biplace néerlandais conçu et fabriqué par Fokker pour la Royal Dutch Air Force immédiatement après la Seconde Guerre mondiale."
 HOL_jet_light_equipment_2:0 "Machtrainer Fokker S.14"
 HOL_jet_light_equipment_2_short:0 "S.14 Machtrainer"
 HOL_jet_light_equipment_2_desc:0 "Le Fokker S.14 Machtrainer est un avion d'entraînement militaire biplace néerlandais conçu et fabriqué par Fokker pour la Royal Dutch Air Force. Il a la particularité d'être l'un des premiers avions d'entraînement à réaction dédiés à être produit dans le monde et pourrait être armé de bombes non guidées et avait même un gunpod en cours de développement"
 HOL_jet_light_equipment_3:0 "Chasseur de la liberté Canadair NF-5A"
 HOL_jet_light_equipment_3_short:0 "Chasseur de la liberté NF-5A"
 HOL_jet_light_equipment_3_desc:0 "Le Canadair CF-5/CF-116 est la version sous licence Canadair de l'avion de chasse américain Northrop F-5 Freedom Fighter, principalement destiné aux Forces canadiennes sous le nom de CF-5 et à l'Aviation royale néerlandaise sous le nom de NF-5"
 HOL_jet_light_equipment_4:0 "Chasseur de la liberté Canadair NF-5B"
 HOL_jet_light_equipment_4_short:0 "Chasseur de la liberté NF-5B"
 HOL_jet_light_equipment_4_desc:0 "Le Canadair CF-5/CF-116 est la version sous licence Canadair de l'avion de chasse américain Northrop F-5 Freedom Fighter, principalement destiné aux Forces canadiennes sous le nom de CF-5 et à l'Aviation royale néerlandaise sous le nom de NF-5"
 HOL_jet_light_equipment_5:0 "Canadair NF-5A Freedom Fighter PUFF"
 HOL_jet_light_equipment_5_short:0 "NF-5A BOUFFÉE"
 HOL_jet_light_equipment_5_desc:0 "Le Canadair CF-5/CF-116 est la version construite sous licence Canadair du Northrop F-5 Freedom Fighter américain. Le programme PUFF visait à augmenter la capacité de survie du F-5 dans un espace aérien de plus en plus controversé en matière de systèmes anti-aériens et peut également être considéré comme une mise à niveau à mi-vie."

 HOL_recon_equipment_0:0 "Taylorcraft Auster"
 HOL_recon_equipment_0_short:0 "Auster"
 HOL_recon_equipment_0_desc:0 "Le Taylorcraft Auster était un avion de liaison et d'observation militaire britannique produit par la société Taylorcraft Airplanes (England) Limited pendant la Seconde Guerre mondiale. "
 HOL_jet_recon_equipment_0:0 "Piper L-18 Super Cub"
 HOL_jet_recon_equipment_0_short:0 "L-18 Super-Cub"
 HOL_jet_recon_equipment_0_desc:0 "Le Piper PA-18 Super Cub est un monoplan biplace monomoteur. Introduit en 1949 par Piper Aircraft, il a été développé à partir du Piper PA-11"
 HOL_jet_recon_equipment_1:0 "Chasseur stellaire Lockheed RF-104G"
 HOL_jet_recon_equipment_1_short:0 "Chasseur stellaire RF-104G"
 HOL_jet_recon_equipment_1_desc:0 "Le RF-104G était un modèle de reconnaissance tactique basé sur le F-104G, généralement équipé de trois caméras KS-67A montées à l'avant du fuselage à la place du canon interne. La plupart des 189 exemplaires construits ont ensuite été reconfigurés selon la norme F-104G"
 HOL_jet_recon_equipment_2:0 "Fokker verrouillé Martin F-16A(R) Fighting Falcon"
 HOL_jet_recon_equipment_2_short:0 "F-16A(R) Faucon de combat"
 HOL_jet_recon_equipment_2_desc:0 "Environ deux douzaines de F-16A de la Royal Dutch Air Force (RNLAF) ont été fournis avec des pods de reconnaissance tactique à basse altitude Oude Delft Orpheus indigènes transférés de son RF-104G à la retraite. Désigné F-16A(R)"

