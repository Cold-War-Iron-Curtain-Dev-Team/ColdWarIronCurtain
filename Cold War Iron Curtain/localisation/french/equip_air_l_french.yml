 ENG_fighter_equipment_0:0 "Force aérienne royale"
 ENG_fighter_equipment_0_short:0 "RAF"
 ENG_fighter_equipment_0_desc:0 "La Royal Air Force (RAF) est la force aérienne et spatiale du Royaume-Uni. Elle a été créée vers la fin de la Première Guerre mondiale, le 1er avril 1918, devenant ainsi la première force aérienne indépendante au monde, en regroupant le Royal Flying Corps (RFC) et le Royal Naval Air Service (RNAS). Après la victoire des Alliés sur les puissances centrales en 1918, la RAF est devenue à l'époque la plus grande force aérienne du monde. Depuis sa création, la RAF a joué un rôle important dans l'histoire militaire britannique. Elle a notamment joué un rôle important dans la Seconde Guerre mondiale, où elle a mené sa campagne la plus célèbre, la bataille d'Angleterre."

