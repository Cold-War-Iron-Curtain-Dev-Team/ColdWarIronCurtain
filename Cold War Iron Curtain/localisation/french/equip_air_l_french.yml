 AST_nav_bomber_equipment_4_desc:0 "Le P2V était un avion de patrouille maritime et anti-sous-marin développé pour remplacer le PV-1 Ventura et le PV-2 Harpoon de la Seconde Guerre mondiale. Introduit en 1947 pour l'US Navy, il s'agissait en fait d'un avion basé à terre, et le P2V, plus tard désigné P-2 après 1962, n'a jamais effectué d'atterrissage sur un porte-avions, mais un petit nombre a été converti et déployé à partir de porte-avions comme bombardiers nucléaires provisoires qui devraient atterrir sur le rivage ou dans un fossé, à l'instar des bombardiers utilisés lors du raid de Doolittle pendant la Seconde Guerre mondiale. Son surnom est « Neptune », du nom du dieu romain de la mer."
 AST_nav_bomber_equipment_5:0 "Lockheed P2V-7 Neptune"
 AST_nav_bomber_equipment_5_short:0 "P2V-7 Neptune"
 AST_nav_bomber_equipment_5_desc:0 "Dernière variante du Neptune produite par Lockheed, propulsée par des moteurs R-3350-32W et J-34. Équipé de réservoirs à bout d'aile à traînée inférieure, d'un radar de recherche AN/APS-20 dans un radôme révisé et d'une verrière de cockpit bombée. Les premiers avions étaient équipés de tourelles défensives, mais celles-ci furent supprimées comme pour le P2V-5."
 AST_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 AST_nav_bomber_equipment_6_short:0 "P-3A Orion"
 AST_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le rôle de patrouille maritime et de guerre anti-sous-marine terrestre (ASW). Il dispose d'une soute à bombes interne pour les torpilles aériennes, avec des pylônes sous les ailes pour une myriade d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des charges sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques sur sa queue pour détecter les sous-marins utilisant le champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à jouer un rôle depuis son introduction en 1962, il est tout à fait approprié que l'avion soit surnommé « Orion ». Le chasseur de navires ennemis."
 AST_nav_bomber_equipment_7:0 "Lockheed P-3C Orion"
 AST_nav_bomber_equipment_7_short:0 "P-3C Orion"
 AST_nav_bomber_equipment_7_desc:0 "Le P-3C disposait d'une nouvelle suite ASW et d'un ordinateur de mission avec une disposition interne révisée. À l'extérieur, le P-3C comportait une échelle d'entrée à commande électrique ; petite antenne à aileron ; chutes de bouées sonores ventrales chargées extérieurement ; et trois petites fenêtres sur le côté arrière droit (une fenêtre à l'avant de la sortie de secours au-dessus de l'aile et deux bien à l'arrière). Les avions de production initiaux avaient un nez de caméra situé sur la partie inférieure du radôme. Les avions de production ultérieurs avaient une tourelle IRDS rétractable à la place de la caméra nasale. À partir du début des années 1980, les nez de caméra existants ont été équipés de tourelles IRDS. Les premiers modèles étaient également connus sous le nom d'avion P-3C « Baseline » ou Non-Update (NUD). Tous les avions ont ensuite été équipés de deux systèmes de navigation inertielle LTN-72."
 AST_nav_bomber_equipment_8:0 "Boeing P-8 Poséidon"
 AST_nav_bomber_equipment_8_short:0 "P-8 Poséidon"
 AST_nav_bomber_equipment_8_desc:0 "Initialement connu sous le nom d'avion maritime multimission (MMA), le P-8 a été conçu pour remplacer le vénérable P-3 Orion. Développé à partir de l'avion de ligne Boeing 737 Next Generation, le P-8 a été conçu pour le rôle de guerre anti-sous-marine et de patrouille maritime. De plus, il peut jouer le rôle de support électronique (ESM) grâce à l'utilisation de sa capacité d'autoprotection d'alerte précoce (EWSP). Avec des variantes en service aux États-Unis, au Royaume-Uni, en Inde et en Australie depuis son introduction en 2013, le « Poséidon » deviendra le nouveau roi des mers."
 
 AST_cv_CAS_equipment_2:0 "Labbe de Blackburn"
 AST_cv_CAS_equipment_2_short:0 "Labbe"
 AST_cv_CAS_equipment_3:0 "Fairey Firefly Mk.1"
 AST_cv_CAS_equipment_3_short:0 "Luciole Mk.1"
 AST_cv_CAS_equipment_3_desc:0 "Le Canada a choisi d'acquérir le Firefly malgré l'opposition qui préconisait plutôt l'achat d'avions américains. En guise de mesure provisoire, des Fireflies de la Royal Navy ont été prêtés tandis que des avions spécialement conçus plus avancés étaient en cours de construction."
 AST_cv_jet_CAS_equipment_1:0 "Fairey Firefly AS Mk.5"
 AST_cv_jet_CAS_equipment_1_short:0 "Luciole AS Mk.5"
 AST_cv_jet_CAS_equipment_1_desc:0 "La Marine canadienne employait 65 lucioles AS Mk.5 sur ses porte-avions. Le dernier Firefly AS.Mk 5 était un avion anti-sous-marin, qui transportait des bouées sonores et du matériel américains."
 AST_cv_jet_CAS_equipment_2:0 "Hawker Sea Fury FB.11"
 AST_cv_jet_CAS_equipment_2_short:0 "Fureur marine FB.11"
 AST_cv_jet_CAS_equipment_3:0 "Hawker Sea Fury FB.20"
 AST_cv_jet_CAS_equipment_3_short:0 "Fureur marine FB.20"
 AST_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 AST_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 AST_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un engin d'attaque léger monomoteur capable de transporter la même charge de bombes qu'un B-17 malgré son châssis plus petit. Servant dans plusieurs forces aériennes et aéronavales depuis son introduction en 1954, il a connu de nombreuses modifications et modernisations au cours de ses plus de 60 années de service et continue de servir dans de nombreux pays jusqu'à ce jour. Son surnom est « Skyhawk »."
