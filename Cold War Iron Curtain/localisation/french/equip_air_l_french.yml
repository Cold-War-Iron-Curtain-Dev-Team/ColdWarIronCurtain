 POR_tac_bomber_equipment_3:0 "Douglas B-26B Envahisseur"
 POR_tac_bomber_equipment_3_short:0 "Envahisseur B-26B"

 POR_cv_CAS_equipment_3:0 "Curtiss SB2C-1 Helldiver"
 POR_cv_CAS_equipment_3_short:0 "SB2C-1 Helldiver"
 POR_cv_CAS_equipment_3_desc:0 "Remplaçant le SBD Dauntless, le SB2C, introduit en 1942, était bien plus rapide que le SBD qu'il remplaçait, mais c'était un avion difficile à piloter, ce qui lui valut le surnom désobligeant de « SOB, 2e classe ». Malgré cela et un rapport cinglant qui gâchera à jamais l'héritage de la Curtiss Aircraft Company, le « Helldiver » eut un excellent bilan de combat tout au long de la guerre du Pacifique. La variante de l'USAAF l'appelait A-25 Shrike."
 POR_cv_jet_CAS_equipment_1:0 "Curtiss SB2C-5 Helldiver"
 POR_cv_jet_CAS_equipment_1_short:0 "SB2C-5 Helldiver"
 POR_cv_jet_CAS_equipment_1_desc:0 "Remplaçant le SBD Dauntless, le SB2C, introduit en 1942, était bien plus rapide que le SBD qu'il remplaçait, mais c'était un avion difficile à piloter, ce qui lui valut le surnom désobligeant de « SOB, 2e classe ». Malgré cela et un rapport cinglant qui gâchera à jamais l'héritage de la Curtiss Aircraft Company, le « Helldiver » eut un excellent bilan de combat tout au long de la guerre du Pacifique. La variante de l'USAAF l'appelait A-25 Shrike."
 
