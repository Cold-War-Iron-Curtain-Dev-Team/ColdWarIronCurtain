 VIN_Push_for_Negotiations_Regroupment_tt:0 "Les §Ydu Sud Viet Minh§! reçoivent l'ordre de se retirer. Après §Y90 jours§! ils signent un cessez-le-feu avec l'Etat du Vietnam et §Yse regroupent au nord§!: le sud passe à l'Etat du Vietnam, et les cadres rejoignent notre armée. La conférence de Genève s'ouvrira une fois que les deux Vietnams seront en paix."
 VIN_South_Regroupment_tt:0 "On gagne §G20 000§! d'effectifs et §G2§! régiments de regroupement si les unités sud étaient encore sur le terrain."
 VIN_South.10.t:0 "Le regroupement des cadres du Sud"
 VIN_South.10.d:0 "Les quatre-vingt-dix jours de l'ordre de démission sont écoulés. Le commandement sud a signé son cessez-le-feu avec l'État du Vietnam, a cédé les zones qu'il détenait et a fait marcher ses régiments vers le nord vers les zones de regroupement. Nam Bo n'est plus une façade. Ce que deviendra le Sud sera désormais décidé à la table de conférence."
 VIN_South.10.a:0 "Ils rentrent chez eux pour se battre un autre jour."
 VIN_South.11.t:0 "Le Viet Minh quitte le Sud"
 VIN_South.11.d:0 "Sur ordre de Hanoï, les Viet Minh du sud ont accepté un cessez-le-feu et retirent leurs unités régulières vers le nord. Leurs anciennes zones sont remises à notre administration. Combien de cadres sont restés sur place et ce qu'ils feront est une question pour plus tard."
 VIN_South.11.a:0 "Reprenez les zones."
 VIN_Post_DBP_NLF_Regrouped:0 "Les Viet Minh du sud se sont regroupés au nord"
