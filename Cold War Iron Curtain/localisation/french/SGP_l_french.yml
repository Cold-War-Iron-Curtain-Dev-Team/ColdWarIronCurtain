l_french:
 SGP_entrepot_economy:0 "Commerce en entrepôt"
 SGP_entrepot_economy_desc:0 "Les entrepôts situés le long du front de mer de Singapour traitent des marchandises provenant de toute la région. Les routes maritimes établies et les connexions marchandes permettent aux fabricants locaux d'accéder à des matériaux importés que l'île ne peut pas fournir elle-même."
 SGP_edb_idea:0 "Conseil de développement économique"
 SGP_edb_idea_desc:0 "Le Conseil de développement économique aide les fabricants à trouver des locaux, à organiser des financements et à obtenir des machines. Ses dirigeants encouragent la production d'articles ménagers pour créer des emplois dans les usines au-delà des quais et des maisons de commerce."
 SGP_pioneer_industries_idea:0 "Fabrication pionnière"
 SGP_pioneer_industries_idea_desc:0 "Des entreprises pionnières établissent des chaînes d'assemblage électronique avec des machines et des composants obtenus à l'étranger. Les allègements fiscaux contribuent à attirer les investissements vers des usines capables de fournir des clients étrangers sans dépendre d'un vaste marché intérieur."
 SGP_establish_edb:0 "Créer le conseil de développement"
 SGP_establish_edb_desc:0 "Créer un Conseil de développement économique pour aider les fabricants en matière de financement et de sites d'usines. Une agence dédiée peut transformer les propositions d'investissement en entreprises opérationnelles, y compris en entreprises fabriquant des biens pour la maison."
 SGP_jurong_estate:0 "Développer la zone industrielle de Jurong"
 SGP_jurong_estate_desc:0 "Préparer Jurong à l'investissement industriel avec des sites viabilisés et des locaux pour les travaux techniques et commerciaux. Les fabricants qui envisagent Singapour ont besoin d'un endroit où installer leurs opérations au-delà du front de mer bondé."
 SGP_pioneer_industries:0 "Encourager les industries pionnières"
 SGP_pioneer_industries_desc:0 "Utiliser des allégements fiscaux pionniers pour attirer les entreprises produisant pour les marchés étrangers. Avec Jurong préparé et le Conseil de développement en place, l'assemblage électronique peut générer de nouvelles commandes et des emplois en usine à Singapour."
