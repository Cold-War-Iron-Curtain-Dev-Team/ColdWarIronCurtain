l_french:
 # Sri Lankan Civil War
 CIA_SRL.0.d:0 "INSURRECTION SRI LANKAISE : EN BREF\nBureau d'analyse du Proche-Orient et de l'Asie du Sud, Direction du renseignement\n\nSECRET/NOFORN\n\nCes dernières années, les tensions entre le gouvernement sri-lankais, dominé par le groupe ethnique cinghalais, et le groupe ethnique tamoul, situé dans le nord du pays, ont dégénéré en violence. Les Tamouls ont allégué une discrimination systémique à leur encontre en matière d'emploi, d'éducation et de langue, notamment en ce qui concerne la politique de normalisation des années 1970 qui empêchait systématiquement les étudiants tamouls d'accéder aux universités. (U/OU)\n\nL'opposition tamoule à la politique gouvernementale existe sous la forme du Front uni de libération tamoul (TULF), agissant comme opposition politique légitime depuis 1976 ; tandis que des groupes militants, tels que les Tigres de libération de l'Eelam tamoul (LTTE), ont été formés sous la direction de Velupillai Prabhakaran. Les deux groupes, bien que différents dans leurs méthodes, souhaitent la création d'un État laïc et socialiste de « l'Eelam tamoul », situé dans le nord du pays à majorité tamoule. (S)\n\nLes récentes émeutes et manifestations anti-tamouls, dont une en 1977 qui a fait 125 morts, et l'incendie de la bibliothèque publique de Jaffna en 1981 par une foule cinghalaise, n'ont cessé d'accroître les tensions vers une guerre civile totale. Aujourd'hui, en 1983, le feu a commencé à prendre de l'ampleur, en particulier après qu'une patrouille de l'armée sri lankaise, connue sous le nom de « Four Four Bravo », soit tombée dans une embuscade, entraînant la mort de 13 soldats. La période connue sous le nom de « Juillet noir » a donné lieu à de multiples pogroms anti-tamouls, à des massacres de prisonniers et à des centaines de morts. (S)\n\nOn estime que les LTTE et d'autres groupes militants tamouls continueront de harceler et de combattre carrément les unités de l'armée sri-lankaise. Cependant, la situation n'est pas claire en dehors du Sri Lanka ; l'influence de l'Inde dans le conflit est inconnue, bien que la présence d'une importante population tamoule dans le sud de l'Inde puisse constituer un obstacle au gouvernement sri-lankais dans la répression de ce soulèvement. (S)"
 CIA_SRL.1.d:0 "POSITION DE L'INDE SUR LE SRI LANKA : RECOMMANDATIONS D'ACTION\nBureau d'analyse du Proche-Orient et de l'Asie du Sud, Direction du renseignement\n\nSECRET/NOFORN\n\nLa position géopolitique relative de l'Inde par rapport au Sri Lanka a posé des problèmes importants au gouvernement sri-lankais dans sa tentative de contrer l'insurrection des Tigres de libération de l'Eelam tamoul (LTTE). Étant donné que le Sri Lanka et l'Inde ne sont distants que de 35 milles l'un de l'autre à leurs points les plus proches et que l'on constate l'apparition d'une importante population tamoule dans le sud de l'Inde, nous estimons que le gouvernement indien tentera de s'impliquer dans le conflit, probablement aux côtés des insurgés tamouls. (S)\n\nLes groupes tamouls, tant au Sri Lanka que dans l'État du Tamil Nadu, au sud de l'Inde, ont développé des relations et une coopération solides. Plus précisément, les LTTE ont développé des relations avec des responsables du Mouvement pur tamoul et du Congrès de Kamaraj, ainsi qu'avec le Ministre en chef du Tamil Nadu, M.G. Ramachandran, un éminent fonctionnaire de l'État. (S)\n\nLes États-Unis sont confrontés au défi de répondre à ce conflit et à l'implication indienne qui en résulte. Il est clair qu'il est essentiel de limiter l'influence indienne dans la région pour garantir que le gouvernement sri-lankais puisse poursuivre ses opérations anti-insurrectionnelles sans relâche. Les recommandations suivantes peuvent être prises pour déstabiliser l'influence indienne dans la région et soulager la pression sur le Sri Lanka :\n\n1. Utiliser les ressources du Fonds monétaire international et d'autres organisations économiques pour mettre fin à l'accès aux prêts du gouvernement indien\n\n2. Organiser des groupes d'émigrés à majorité tamoule sur le continent indien, dans le but de former des organisations militantes similaires aux LTTE au Sri Lanka.\n\n3. Utiliser les voies diplomatiques pour faire pression sur le Pakistan afin qu'il cesse son aide au gouvernement sri-lankais et qu'il commence à livrer des armes aux groupes militants tamouls indiens.\n\nNous espérons que cette analyse et ces recommandations mettront effectivement fin à l'influence indienne dans la région, détourneront l'attention de New Delhi de son île voisine et permettront le maintien du statu quo dans la région."
 CIA_SRL.2.d:0 "Alors que le secrétaire au Trésor entrait dans le siège du Fonds monétaire international, il était heureux que celui-ci soit si proche. À seulement quelques minutes en voiture des immeubles de bureaux du Trésor, dans le quartier Foggy Bottom de Washington, il rendait les visites comme celle-ci simples et faciles, ne nécessitant pas de vol et, plus important encore, de presse.\n\nAprès seulement quelques escaliers et un ascenseur, le secrétaire était assis dans le bureau du directeur général, le Français Jacques de Larosière, l'homme le plus puissant du FMI. En tant que représentant des États-Unis au Conseil des gouverneurs, le secrétaire savait qu'il avait une grande influence sur les opérations du FMI à l'échelle mondiale. Après avoir réfléchi au contenu du rapport de la CIA qu'il avait lu plus tôt, il savait ce qu'il fallait faire maintenant.\n\n\"Bonjour, Monsieur le Secrétaire. Que puis-je faire pour vous ?\" De Larosière se pencha en arrière, posant une tasse de café sur une soucoupe à son bureau, avec une vue sur les toits de DC derrière lui.\n\n\"Jacques, vous et moi nous connaissons depuis longtemps. Votre leadership au Trésor français, et maintenant au FMI, a été excellent. J'ai besoin d'une faveur de votre part.\" Le secrétaire s'ajusta tout en continuant.\n\n\"Je suis sûr que vous avez vu les informations ou lu les briefings de votre gouvernement. L'Inde s'implique de plus en plus dans la guerre civile au Sri Lanka, finançant les rebelles communistes tamouls dans le nord. Ils sabotent intentionnellement le conflit et coûtent des millions de vies. Nous recommandons que le FMI prenne des mesures pour sanctionner l'Inde pour ses actions et la forcer à relâcher la pression sur le Sri Lanka.\"\n\n\"Monsieur le Secrétaire. Que nous propose exactement votre gouvernement ? L'Inde est également un membre consentant du FMI. Je ne vois pas pourquoi nous devrions nous impliquer dans cette question.\" Jacques.\"\n\nde Larosière s'arrêta. \"Très bien, Monsieur le Secrétaire. Je vais voir ce que nous pouvons faire pour mettre fin à l'accès aux prêts, mais aucune promesse. Le FMI ne veut pas de retour de bâton."
 CIA_SRL.3.d:0 "Nous avons reçu une notification du Fonds monétaire international nous informant que notre accès aux prêts du FMI a été révoqué, sur la base du « non-respect de certains critères pour les membres cherchant des prêts ». Tout en représentant un défi considérable pour notre situation financière et économique internationale, le gouvernement soupçonne qu'il s'agit là d'une mesure du FMI et du bloc occidental dans son ensemble visant à sanctionner nos actions au Sri Lanka.\n\nOn ne sait pas exactement comment réagir, à part condamner catégoriquement cette action et demander au FMI de revenir sur sa décision. Certaines personnalités de notre gouvernement ont suggéré de réduire les actions au Sri Lanka, comme moyen d'apaiser l'Occident, mais d'autres ont maintenu la nécessité de l'autodétermination sur des questions telles que celles-ci."
 CIA_SRL.4.d:0 "Alors que Jayamravi était assis dans le petit restaurant, il regardait autour de lui, entre la porte et sa table, vers la cuisine, puis vice-versa. Alors qu'il déposait le journal en langue tamoule qu'il lisait, il vit les deux hommes s'approcher de sa table, hochant la tête en s'asseyant. Jayamravi s'est lancé directement.\n\n\"Je suppose que vous êtes ici tous les deux parce que vous êtes intéressés par l'unité Tigre locale ?\" Il parla à voix basse. Les deux acquiescèrent.\n\nRegardant autour de lui, Jayamravi se leva, ramassa son journal, laissa quelques roupies sur la table et sortit dans les rues poussiéreuses et bondées de Madurai, puis se tourna brusquement dans une ruelle, se dirigea vers une autre ruelle et s'arrêta devant une porte où se tenait un homme. Jayamravi hocha la tête, fit signe aux deux hommes de le suivre et les guida à l'intérieur, où un centre de commandement et une armurerie de fortune semblaient avoir été installés.\n\n\"Bienvenue dans la cellule locale des Tigres de libération du Tamil Nadu, messieurs. Nos combattants ont effectué des contrôles sur vous et ont déterminé que vous êtes en sécurité. Bienvenue à l'étranger. Nous sommes heureux de vous avoir.\" Jayamravi sourit, désignant les tables, couvertes de cartes, de journaux, d'un bureau au fond avec des gilets, des explosifs sur le point d'y être attachés. Jayamravi dégaina un pistolet et vérifia la culasse. \"J'espère que vous savez dans quoi vous vous embarquez.\"\n\nCe que personne, mais un seul, n'a réalisé, c'est que \"Jayamravi\" était en réalité une couverture élaborée. Shekar, agent de la CIA, sourit. Sa maison, une magnifique banlieue à l'extérieur de McLean, en Virginie, lui manquait, mais cette mission était bien plus importante. Il restait encore beaucoup à faire."
 CIA_SRL.5.d:0 "RAPPORT DE RENSEIGNEMENT DE SÉCURITÉ\nCONFIDENTIEL\n\nL'activité militante parmi les groupes nationalistes et militants tamouls n'a cessé d'augmenter dans l'État du Tamil Nadu, notamment dans les grandes villes de Chennai, Pondichéry et Madurai. Le plus important a probablement été les Tigres de libération du Tamil Nadu (LTTN), un groupe militant presque identique aux Tigres de libération du Tamil Eelam (LTTE) basés au Sri Lanka.\n\nOn ignore actuellement le lien entre les LTTE basés au Sri Lanka et le LTTN ; cependant, on peut supposer que des connexions ont eu lieu. Le LTTN fonctionne principalement comme une filiale indienne des Tigres tamouls, conçue pour opérer dans les zones à majorité tamoule dans le but de détourner le soutien populaire de l'aide actuelle du gouvernement aux LTTE.\n\nLa recommandation actuelle de ce rapport est d'aller de l'avant avec des opérations anti-insurrectionnelles de base et des opérations de police plus lourdes pour empêcher les cellules LTTN de commettre des incursions ou d'autres attaques terroristes sur le sol indien souverain. L'État du Tamil Nadu devrait recevoir tous les financements et ressources nécessaires pour accomplir cette tâche."
 CIA_SRL.6.d:0 "ACTIONS DIPLOMATIQUES ENVERS L'INDE\nBureau d'analyse du Proche-Orient et de l'Asie du Sud, Direction du renseignement\n\nSECRET/NOFORN\n\nSur la base de nos évaluations précédentes, ce Bureau a indiqué qu'au lieu de nouvelles opérations de déstabilisation envers l'Inde, un changement de stratégie est nécessaire, vers des actions diplomatiques secrètes. Ce bureau formule les recommandations suivantes, avec la coopération de l'ambassade des États-Unis à New Delhi : et le Bureau des affaires d'Asie du Sud et d'Asie centrale, Département d'État :\n\n1. Pressions secrètes et menace de suspendre l'aide, y compris l'aide militaire sous la forme d'éventuelles ventes d'armes et de transferts de technologie, ainsi que l'aide économique directe.\n\n2. Faire pression sur les entreprises américaines opérant en Inde, telles que Union Carbide India Limited, pour qu'elles formulent des demandes similaires, en partant du principe que l'Inde devrait cesser ses actions au Sri Lanka si elle souhaite continuer à maintenir la coopération économique et la croissance avec les entreprises américaines et occidentales.\n\n3. Travailler avec le Bureau de contrôle des avoirs étrangers (OFAC) du Département du Trésor pour envisager d'imposer des sanctions et de saisir les avoirs d'éminents responsables indiens, notamment des responsables du Cabinet, des membres de l'état-major de la Défense et du personnel du ministère indien des Affaires étrangères, sur une base similaire à celle indiquée ci-dessus.\n\n4. Application de toutes les sanctions et menaces ci-dessus, ainsi que garantie du soutien des alliés et des autres pays occidentaux pour faire pression sur le gouvernement indien.\n\nLe Bureau espère que ces recommandations auront un poids diplomatique suffisant pour persuader l'Inde de cesser ses opérations et son ingérence au Sri Lanka."
 CIA_SRL.7.d:0 "Le chef de station de la CIA à Islamabad s'est adressé à notre ministère des Affaires étrangères, ainsi qu'à celui du renseignement interservices, pour demander que nous mettions fin à notre aide au gouvernement sri-lankais dans sa lutte contre les Tigres de libération de l'Eelam tamoul (LTTE) communistes et soutenus par l'Inde.\n\nLes responsables américains semblent apparemment déterminés à mettre fin à l'influence indienne dans la région, en particulier autour du Sri Lanka, et sont venus nous voir, conscients de nos sentiments à l'égard de l'Inde, et nous ont demandé de poursuivre une implication plus directe, afin peut-être de détourner l'attention des Indiens de l'île au sud.\n\nLes membres du gouvernement ne sont pas sûrs de pouvoir arrêter les livraisons d'armes au gouvernement sri-lankais, et certains ont soutenu que nous pouvons faire les deux. Cependant, nous dépendons des ventes d'armes et d'autres aides américaines, et écouter leurs demandes pourrait nous aider à long terme."
 CIA_SRL.8.d:0 "Le chef de station de la CIA à Islamabad a informé Langley et le Département d'État que le gouvernement pakistanais, y compris les services de renseignement inter-services, avait l'intention de poursuivre son aide au gouvernement sri-lankais sous la forme de ventes d'armes et de formation de personnel militaire.\n\nBien que ce ne soit pas ce que nous avons demandé aux Pakistanais de faire, et même si cela suscite une colère considérable à Langley, le financement continu du gouvernement sri-lankais par le Pakistan représente toujours une opportunité bénéfique de renverser l'influence indienne par procuration. Nous ne pouvons qu'espérer que leur discours à l'égard de l'Inde se durcisse à l'avenir."
 CIA_SRL.9.d:0 "Le chef de station de la CIA à Islamabad a informé Langley qu'après des discussions confidentielles, le gouvernement pakistanais, sous les auspices de l'Inter-Service Intelligence, a accepté de mettre fin à l'aide militaire secrète au gouvernement sri-lankais dans ses opérations contre-insurrectionnelles contre les rebelles tamouls.\n\nSuite à une demande de Langley, les Pakistanais n'ont pas repris leurs livraisons militaires physiques, mais les ont arrêtées à l'avenir. Le ministère pakistanais des Affaires étrangères est prêt à faire face aux conséquences négatives du gouvernement sri-lankais, avec notre soutien.\n\nNous espérons qu'avec cette évolution, nous pourrons persuader davantage les Pakistanais de recentrer leur attention sur leur frontière avec l'Inde et d'attiser les tensions dans la région du Cachemire, afin de détourner l'attention des Indiens du Sri Lanka et de la ramener vers leur ennemi juré, le Pakistan."
 CIA_SRL.10.d:0 "TAMIL NADU : POSSIBILITÉS D'OPÉRATIONS\nChef de station, New Delhi ; Bureau d'analyse du Proche-Orient et de l'Asie du Sud\n\nSECRET/NOFORN\n\nDans le cadre des efforts déployés par les États-Unis pour aider le Sri Lanka dans sa guerre civile en cours, il est devenu nécessaire d'entreprendre davantage d'actions d'escalade afin d'empêcher l'Inde de s'impliquer davantage aux côtés des rebelles tamouls.\n\nLe personnel de la CIA à New Delhi et à Colombo a proposé d'étendre ses opérations dans l'État du Tamil Nadu, dans le sud de l'Inde, qui est l'État le plus proche du Sri Lanka et abrite une population majoritairement tamoule. Ce bureau estime que la répartition démographique constitue un facteur essentiel dans la perpétration d'attaques là-bas, car elle éloignera les Indiens tamouls de la guerre et retournera l'opinion publique régionale contre les rebelles des LTTE soutenus par l'Inde.\n\nCommettre des attaques dans les principales villes du Tamil Nadu, dont Chennai et Madurai, en utilisant les ressources des Tigres de libération du Tamil Nadu (LTTN), contre des cibles particulières telles que :\n\n-Membres pro-guerre de Lok Sahka,\n-Responsables de l'État du Tamil Nadu,\n-Le ministre en chef du Tamil Nadu\n-Dirigeants sociaux et religieux éminents de l'État\n\nCela attirera effectivement l'attention du gouvernement central indien, détournera l'attention des forces de l'ordre et des forces de sécurité et créera des divisions sociales entre les membres de la majorité tamoule."
 CIA_SRL.11.d:0 "RAPPORT DE SÉCURITÉ AU TAMIL NADU\n\nCabinet du Premier ministre\n\nLa situation sécuritaire dans l'État du Tamil Nadu, dans le sud du pays, a été controversée ces dernières semaines. Plusieurs attaques des Tigres de libération du Tamil Nadu (LTTN), un groupe militant nationaliste tamoul fortement associé aux LTTE sri lankais, ont été perpétrées dans les principales zones métropolitaines de Chennai et de Madurai.\n\nBien qu'aucun responsable majeur de l'État ou du gouvernement central n'ait été tué ou blessé, les principales cibles ont été les responsables municipaux locaux, ainsi que la police locale et les membres de la police du Tamil Nadu. Cependant, des sources de renseignement indiquent que des attaques contre Lok Sakha et des représentants de l'État pourraient avoir lieu si le gouvernement n'agit pas pour mettre un terme à leurs actions.\n\nLes attaques du LTTN, tout comme leurs camarades du Sri Lanka, se sont concentrées sur des attentats-suicide utilisant des bombes, ainsi que sur quelques tirs limités. De nombreuses attaques semblent être planifiées à l'avance, ce qui indique que les cellules LTTN ont une certaine connaissance des opérations gouvernementales et policières avant qu'elles ne se produisent.\n\nCertains responsables du gouvernement ont exprimé leur inquiétude face à cette situation, notamment en ce qui concerne notre engagement au Sri Lanka. Certains murmures ont fait écho au sujet du retrait de l'aide indienne aux LTTE, au motif que leur organisation affiliée mène des attaques sur le continent."
 CIA_SRL.12.d:0 "ASSISTANCE AU SRI LANKA : RÉSUMÉ\nBureau d'analyse du Proche-Orient et de l'Asie du Sud, Direction du renseignement\n\nSECRET/NOFORN\n\nLa décision des États-Unis de soutenir le gouvernement sri-lankais dans son conflit civil en cours contre le groupe militant tamoul des Tigres de libération de l'Eelam tamoul (LTTE, ou « Tigres tamouls ») a entraîné des coûts et des avantages importants pour les deux parties. Ce Bureau recommande les actions suivantes en plus des actions diplomatiques régulières, comme moyen de renforcer la capacité et l'efficacité militaires du Sri Lanka, ainsi que de mettre fin à l'implication indienne dans le conflit aux côtés des LTTE.\n\n1. La mise en oeuvre immédiate du partage de renseignements avec l'armée sri-lankaise, notamment l'armée, la marine et l'armée de l'air, en plus de la police sri-lankaise et d'autres forces de sécurité. Cela garantira un ciblage plus précis et une prévention, dans l'espoir, de nouvelles attaques terroristes et incursions des LTTE et d'autres groupes militants tamouls.\n\n2. Coordination du soutien secret (létal et non létal) avec le Pakistan, qui a également aidé activement le gouvernement sri-lankais\n\n 3. Envisager un soutien supplémentaire en matière d'aide meurtrière au gouvernement sri lankais, y compris la formation du régiment des forces spéciales sri lankaises, et une aide meurtrière aux groupes paramilitaires soutenus par le gouvernement, y compris la Home Guard musulmane.\n\nNous espérons qu'une combinaison de cette aide renforcera les forces militaires et de sécurité sri lankaises en difficulté à l'heure actuelle et augmentera leurs capacités de contre-insurrection alors qu'elles continuent de repousser les attaques et les offensives des LTTE."
 CIA_SRL.13.d:0 "Alors que le major de l'armée sri lankaise était assis au quartier général de commandement, à l'extérieur de Colombo, il transpirait, à la fois à cause de la chaleur et de la nervosité qu'il ressentait. Chargé de commander les services de sécurité de ce quartier général de division, il regarda autour de lui, dans la nuit moite. C'était calme, trop calme. En sortant de la tente, il aperçut les barbelés, le portail d'entrée, les tours de garde flanquées de jeunes soldats, armés de leurs mitrailleuses. Ils avaient été terrorisés par les attentats-suicides des Tigres, ce que le major n'avait jamais vu auparavant. La sécurité était stricte, mais jamais assez pour eux, pensa-t-il.\n\nEn rentrant dans la tente, il a examiné les derniers rapports émanant des officiers du renseignement militaire de l'armée locale. Ils étaient remarquablement courts et inutiles, fournissant peu ou pas de détails sur les activités des Tigres, hormis le fait qu'ils existent et continuent de commettre des attaques. Il soupira, se demandant à quoi servait le corps du renseignement militaire. Ils devaient sûrement être intelligents, non ? Apparemment non.\n\nUn de ses lieutenants, arrivé à toute vitesse à moto, s'y est précipité, portant dans un dossier une liasse de papiers. Saluant d'un air désordonné, il poussa épuisé les papiers vers le major, qui ouvrit le dossier et commença à le feuilleter, essayant de déchiffrer l'horrible traduction en cinghalais.\n\n\"Monsieur, l'agent américain intégré au Corps de renseignement militaire a un rapport sur les mouvements des Tigres ici. Il prévient d'une attaque ce soir, à l'aide d'un camion.\" Le major regarda autour de lui, puis redescendit, lisant le rapport.\n\n\"D'accord. Augmentez le niveau d'alerte. Doublez les gardes. Élevez les barrières de la porte. Dites aux troupes de se préparer à un incident-\" Il fut interrompu par le soudain éclatement de tirs d'armes automatiques, apparemment venant du périmètre extérieur, suivis de cris alors que les troupes se dirigeaient vers l'escarmouche. Le major a regardé un camion, s'est arrêté, des soldats lui ont tiré dessus, puis a avancé, les coups de feu se sont arrêtés, le conducteur est mort. Il regarda son lieutenant, puis la liasse de papiers. \"Putain de merde.\""
 CIA_SRL.14.d:0 "\"Monsieur le Président, nous avons un nouvel allié possible dans la lutte pour le Sri Lanka. Le Pakistan.\" Le directeur de la CIA [GetCurrentCIADir] se tenait dans l'Ovale, entouré du secrétaire d'État [GetCurrentSecState], du secrétaire à la Défense [GetCurrentSecDef]et du conseiller à la sécurité nationale [GetCurrentNatSecAdv].\n\nLe président [USA.GetLeader] était assis au Resolute Desk et écoutait. \"Allez, directeur.\"\n\n\"Eh bien, Monsieur le Président, les Pakistanais financent secrètement le gouvernement sri-lankais depuis le début de la guerre civile en juillet 1983. Comme nos rapports l'indiquent, les Indiens financent les Tigres de libération de l'Eelam tamoul, les rebelles tamouls que combat le gouvernement de Colombo. Les Pakistanais sont depuis longtemps des ennemis de l'Inde et utilisent ce conflit comme une opportunité d'exercer une influence dans la région afin de renverser les objectifs indiens.\"\n\n\" Plus précisément, les Pakistanais ont fourni aux Sri Lankais des armes légères, des explosifs et des véhicules de patrouille légers. Leur service de renseignement interservices a fourni des renseignements limités, mais nous pensons que combiner les transferts d'armes de notre part et le partage de renseignements bénéficierait grandement aux Sri Lankais dans leur combat. \"\n\nLe président regarda autour de lui. \"Je ne vois aucun problème à cela. Quelles sont les chances que les Indiens le découvrent ?\"\n\nLe secrétaire d'État a répondu. \"Notre ambassade à New Delhi, ainsi que le chef de bureau de la CIA sur place, se sont renseignés discrètement. Les Indiens n'en ont aucune idée et sont préoccupés par les tensions au Cachemire ainsi que par le financement des Tigres au Sri Lanka.\"\n\nLe président hocha la tête. \"Excellent. Faites en sorte que cela se réalise, messieurs. Tendez la main aux Pakistanais.\" Les hommes hochèrent la tête, se serrèrent la main, écrivirent quelques notes et quittèrent la pièce pour passer des appels."
 CIA_SRL.15.d:0 "Le chef de station de la CIA à Islamabad a informé nos agents de l'Inter-Services Intelligence que les États-Unis se préparent à coordonner un soutien secret au Sri Lanka, sous la forme d'envois d'armes secrets, de partage de renseignements, de photos de reconnaissance et d'actions diplomatiques.\n\nAlors que les États-Unis ont remarqué notre aide au gouvernement sri-lankais dans sa lutte contre les rebelles tamouls soutenus par l'Inde, ils ont décidé de consolider leur aide secrète pour maintenir un front uni et élargir la coopération entre les États-Unis et le Pakistan. Les responsables militaires américains et de la CIA devraient rencontrer des officiers de l'ISI et de l'armée de l'air dans les prochains jours pour régler les détails d'un réseau conjoint d'expédition d'armes entre les États-Unis et le Pakistan, via des largages aériens ainsi que des transferts maritimes par bateau.\n\nOn espère que cette entreprise sera couronnée de succès, avec l'espoir que les Indiens ne découvriront pas notre partenariat avec les Américains."
 CIA_SRL.16.d:0 "LES FAUX DRAPEAUX AU SRI LANKA : EN BREF\nBureau d'analyse du Proche-Orient et de l'Asie du Sud, Direction du renseignement\n\nSECRET/NOFORN\n\nMalgré la guerre civile sri-lankaise en cours, le personnel intégré de la CIA et le personnel de l'armée sri-lankaise signalent une baisse significative de l'efficacité au combat des forces gouvernementales au cours des dernières semaines, en raison d'un manque de moral et d'un manque d'initiative parmi les commandants de combat, ainsi que des attaques continues des LTTE contre les installations gouvernementales et les bâtiments publics. Cette baisse de moral se traduit par un manque persistant d'initiative et, par conséquent, par une baisse encore plus importante du moral.\n\nCe Bureau propose les recommandations suivantes pour atténuer ce problème et en particulier, d'une manière qui n'implique pas de conseiller davantage les forces armées sri-lankaises, en raison du manque d'efficacité de cette stratégie :\n\n1. Commencer un soutien secret aux cellules isolées du Tigre et à d'autres groupes rebelles sri lankais, avec pour mission spécifique de commettre des attaques contre les forces gouvernementales sri lankaises, selon des paramètres spécifiques déterminés par les agents de la CIA sur le terrain.\n\n2. Financer ou soutenir d'une autre manière d'éventuelles attaques contre des bâtiments gouvernementaux importants à Colombo, ainsi que contre les résidences du président sri lankais, du Premier ministre sri lankais, des membres du Parlement sri lankais et de personnalités religieuses ou sociales importantes.\n\n3. Encourager par ailleurs les attaques de type « sous faux drapeau » afin de fournir au gouvernement sri-lankais une justification adéquate pour intensifier ses opérations contre les forces des LTTE au nord de l'île.\n\nBien qu'aucune opération spécifique n'ait été proposée par ce Bureau, laissant cette décision être prise par les agents sur le terrain, celles-ci devraient fournir une structure de base pour élaborer des plans spécifiques."
 CIA_SRL.17.d:0 "Alors que le camion de 2 tonnes grondait et rebondissait sur la route, les deux conducteurs continuaient de regarder autour d'eux, anxieux, vérifiant la route, les côtés, l'arrière, à la recherche de silhouettes sortant des sous-bois de la jungle.\n\nLe camion portait une croix rouge indiquant qu'il s'agissait de travailleurs humanitaires, tout comme leurs papiers, mais les chauffeurs savaient qu'il s'agissait de travailleurs humanitaires. Vraisemblablement, cette route vers Mullaitivu, une ville de la province du Nord du Sri Lanka, serait relativement sûre, mais les « travailleurs humanitaires » portaient toujours des pistolets dissimulés, juste au cas où. On ne peut jamais être trop prudent.\n\nRebondissant, le camion s'est arrêté à ce qui semblait être un point de contrôle Tigre. Mullaitivu était un bastion du gouvernement, mais l'itinéraire qu'ils empruntaient était toujours contesté, et cela semblait clair lorsqu'ils descendirent du camion, les mains en l'air, fouillés par les gardes, qui les fouillaient tandis que d'autres les attendaient avec des fusils de type 56. Apparemment satisfaits de leurs papiers, ils ont ouvert le checkpoint de fortune et le camion a continué, vers Mullaitivu, quelques roupies de moins.\n\nArrivés en ville, les agents ont salué les soldats sri-lankais, qui les ont regardés avec méfiance. En arrivant à la mosquée locale, le camion s'est arrêté, les deux hommes sont descendus et se sont étirés un moment avant d'ouvrir l'arrière du camion. Il s'agissait certainement de « fournitures d'aide » si l'on considérait l'aide comme plusieurs centaines de fusils et des milliers de cartouches. Les hommes ont hoché la tête alors que des membres de la communauté arrivaient, et l'un d'eux a parlé au chef, apparemment de la « Garde intérieure musulmane », qui a commencé à distribuer les armes. L'autre homme est remonté dans le camion et a heurté la radio.\n\n\"Eagle One au QG. Les oisillons ont été nourris. Nous distribuons les \"graines pour oiseaux\" maintenant.\""
 CIA_SRL.18.d:0 "Une dépêche des commandants de l'armée locale à Mullaitivu, un bastion gouvernemental dans la province du Nord sur la ligne de front, a indiqué que des agents américains, se faisant passer pour des travailleurs humanitaires de la Croix-Rouge, armaient la Muslim Home Guard, un groupe paramilitaire pro-gouvernemental, en leur fournissant des fusils et des munitions.\n\nNotre programme visant à former davantage de groupes paramilitaires et de défense intérieure dans les municipalités locales s'est heurté à une certaine opposition, d'autant plus qu'il est difficile de recruter des civils disposés à défendre leurs villes, le taux d'attrition des civils dans ce conflit étant particulièrement élevé.\n\nCependant, cette décision de la CIA indique que les États-Unis ont l'intention de continuer à fournir à la fois les forces gouvernementales et les paramilitaires affiliés, ce qui, espérons-le, augmentera les performances et la capacité à chasser les rebelles tamouls traîtres dans le nord."

 # LATAM War on Drugs (Route A)
 ## Colombia
 CIA_LATAM.0.d:0 "LES AFFAIRES LATINO-AMÉRICAINES EN BREF\nBureau d'analyse latino-américaine, Direction du renseignement\n\nSECRET/NOFORN\n\nLa région géopolitique connue sous le nom d'Amérique latine, généralement considérée comme s'étendant de la frontière des États-Unis avec le Mexique, en passant par l'Amérique centrale et du Sud jusqu'à la pointe sud de la Patagonie, a connu d'intenses crises et conflits internes et externes depuis la fin de la Seconde Guerre mondiale, et en particulier jusqu'à la fin des années 1970 et dans les années 1980. (U/OU)\n\nContrairement à d'autres opérations de renseignement et d'analyse dans le monde, la région latino-américaine présente un défi unique pour les décideurs politiques américains en raison de sa situation géographique et de la forte influence américaine actuelle dans la région. En particulier, plusieurs questions dominent, notamment les conflits internes en Colombie, en Argentine, au Pérou, au Nicaragua et dans d'autres. Ce Bureau a formulé quelques recommandations pour des stratégies globales dans la région. (S)\n\n1. Maintenir la politique actuelle des États-Unis de position strictement anticommuniste dans la région. Cela pourrait impliquer la poursuite des contacts et des opérations de soutien aux cartels de drogue anticommunistes et aux réseaux de trafic de cocaïne dans la région, y compris le MAS, ainsi qu'au gouvernement panaméen dirigé par le général Manuel Noreiga.\n\n2. Intensifier l'initiative politique déclarée connue sous le nom de Guerre contre la drogue, principalement en s'impliquant dans le conflit interne en Colombie, ainsi qu'en augmentant les opérations de la CIA à la frontière sud et au Mexique. Cela impliquera davantage d'opérations irrégulières, ainsi que des opérations de soutien aux forces gouvernementales anticommunistes et anti-cartels dans ces régions sélectionnées.\n\n3. Une approche moins radicale et moins violente, consistant à plaider en faveur d'initiatives d'autodétermination dans la région latino-américaine. Cela impliquerait de museler subtilement la dissidence communiste, ainsi que de mettre fin à tout soutien aux mouvements de drogue et de lancer des opérations contre l'influence des entreprises dans la région.\n\nCe Bureau soutient fermement les trois stratégies décrites ci-dessus et est impatient de commencer son travail crucial visant à garantir les intérêts américains dans la région cruciale située au sud."
 CIA_LATAMa.0.d:0 "C'était une matinée pluvieuse dans le Bureau Ovale alors que le Président [USA.GetLeader] était assis dans l'Ovale, entouré du directeur de la CIA [GetCurrentCIADir], du conseiller à la sécurité nationale [GetCurrentNatSecAdv], du directeur du FBI et de plusieurs assistants et responsables de chaque bureau et agence, qui étaient occupés à installer une affiche sur un stand face au bureau et aux canapés.\n\n« Monsieur le Président, notre décision d'intensifier la campagne actuelle de guerre contre la drogue en Amérique latine s'est accompagnée de certains défis et d'avantages. Cependant, notre analyse a mis en évidence deux grands domaines d'intervention : la Colombie et le Mexique.\n\n\"La Colombie est actuellement au milieu d'un conflit interne qui a commencé depuis le milieu des années 1960. Les deux plus grandes parties, le gouvernement colombien et les Forces armées révolutionnaires de Colombie (FARC), ont dévasté une grande partie du pays et ont provoqué l'apparition de cartels régionaux de la drogue, tels que le cartel de Cali et le cartel de Medellin, dans les zones rurales et ont commencé leur production à grande échelle de cocaïne, qu'ils transportent vers le nord vers les États-Unis. Les opérations dans cette zone, qui pourraient consistent en des interventions secrètes ou manifestes, peuvent interrompre la crise de la cocaïne à sa source. »\n\nLe président hocha la tête. \"Je vois. Maintenant, parle-moi du Mexique.\"\n\n\"La situation au Mexique est quelque peu similaire, et la proximité relative de la situation permet une plus grande flexibilité dans les opérations. Le Mexique est devenu un point d'étape privilégié pour le mouvement de la cocaïne depuis ses points de fabrication en Colombie, et en particulier depuis celui du cartel de Guadalajara, qui est passé du trafic via la Floride au trafic transfrontalier via des points au Texas, en Arizona, au Nouveau-Mexique et en Californie.\"\n\nLe directeur du FBI a pris la parole. \"Je peux dire au nom du Bureau et de la Drug Enforcement Administration que nous sommes très impatients de nous engager dans des opérations de trafic de drogue à la frontière et d'aider la CIA dans toute opération qu'elle envisage pour traiter de ce terrible problème.\"\n\nLe président a pris la parole. \"Excellent, messieurs. Je suis impatient de voir où cela mène. Vous savez tous qu'il faut me tenir au courant, et plus précisément, si je dois approuver des opérations, j'attends des rapports quotidiennement.\" Les hommes hochèrent la tête tandis que l'affiche disparaissait avec eux, laissant le président feuilleter le briefing laissé sur son bureau."
 CIA_LATAMa.1.d:0 "LE CONFLIT COLOMBIEN : EN BREF\nBureau d'analyse latino-américaine, Direction du renseignement\n\nSECRET/NOFORN\n\nEn cours depuis 1964, le conflit colombien a ses racines dans une période de répression connue sous le nom de La Violencia, qui s'est déroulée de 1948 à 1964, où les groupes de gauche et de droite se sont constamment affrontés. Aujourd'hui, dans les années 1980, le conflit colombien a atteint de nouveaux sommets, avec l'implication de plusieurs belligérants et de cartels de la drogue et d'autres groupes paramilitaires. (S)\n\nLes principaux acteurs du conflit comprennent le gouvernement anticommuniste de Colombie, y compris la police et l'armée, qui est soutenu par les pays anticommunistes les plus amis d'Amérique latine ainsi que par les États-Unis. Les principaux groupes insurgés comprennent les Forces armées révolutionnaires communistes de l'Armée populaire colombienne (FARC), l'Armée de libération nationale (ELN), le Mouvement urbain du 19 avril (M-19), dont la plupart sont des groupes de gauche soutenus et assistés par l'Union soviétique, Cuba, le Venezuela et d'autres pays socialistes. (S)\n\nLe conflit a été encore compliqué par l'importante capacité de production et de distribution de cocaïne colombienne qui, au milieu de cette guerre civile, a été récupérée par des cartels de la drogue puissants et bien armés ; les plus tristement célèbres étant le cartel de Medellin, le cartel de Cali et le MAS. Ces groupes sont généralement anticommunistes, mais restent idéologiquement neutres, se concentrant plutôt sur les profits et empêchant le gouvernement d'appliquer la loi. (S)\n\nC'est dans ce contexte que les États-Unis sont appelés à réagir. Ce Bureau recommande par la présente des propositions d'opérations à la fois secrètes et ouvertes, reconnaissant que les premières peuvent garantir un déni plausible, mais que les secondes peuvent accroître l'efficacité des opérations antidrogue dans leur ensemble."
 CIA_LATAMa.2.d:0 "OPÉRATIONS EN COLOMBIE : PROPOSITION ET RECOMMANDATIONS\nBureau Colombie, Bureau des opérations latino-américaines, Direction des opérations\n\nSECRET/NOFORN\n\nS'il est clair que les États-Unis devraient s'allier avec le gouvernement colombien dans le conflit en cours, l'expansion des opérations contre les groupes de guérilla communistes ainsi que contre les cartels de la drogue, tels que le cartel de Medellin, garantirait le maintien de l'influence américaine en Colombie et détruirait toute capacité de production et de trafic de cocaïne vers les États-Unis.\n\n1. Les opérations offensives devraient être menées en priorité contre les Forces armées révolutionnaires de Colombie, connues sous le nom de FARC. Formées en 1964 à la suite des attaques du gouvernement contre les milices communistes, les FARC sont le plus grand groupe paramilitaire communiste en Colombie et se sont répandues dans les zones principalement rurales en cellules à travers le pays. Ce bureau recommande d'intégrer des cellules locales des FARC et de commettre des attaques contre les unités des FARC sous forme d'attentats à la bombe et d'assassinats ciblés de responsables, afin d'alimenter la dissidence interne et d'empêcher l'organisation d'atteindre son objectif d'unification pour présenter une menace conventionnelle aux forces régulières colombiennes.\n\n2. Des opérations de soutien supplémentaires devraient être dirigées vers l'Alianza Americana Anticomunista (Alliance anticommuniste américaine, ou AAA), qui est un groupe paramilitaire de droite anticommuniste associé aux renseignements militaires colombiens. Opérant en soutien aux forces régulières de l'Armée nationale colombienne, l'AAA a été impliquée dans un attentat à la bombe en 1978 contre le siège du Parti communiste colombien, ainsi que son journal. L'assistance de la CIA impliquerait des expéditions d'armes légères, des conseillers et un éventuel partage de renseignements.\n\n3. Enfin, la destruction des champs de coca doit également être réalisée. Cette stratégie consiste notamment à brûler des champs, à couper des usines ou à pulvériser des parcelles depuis un avion à l'aide de produits chimiques. Les forces de la CIA, complétées par des unités de la Force aérienne colombienne, devraient être en mesure de mener à bien ces opérations, qui visent à éliminer les opérations des cartels de la drogue en Colombie et à empêcher le financement des FARC et d'autres milices communistes.\n\nLes propositions spécifiques pour chaque opération doivent être déléguées au Bureau Colombie, au Bureau Amérique Latine, Direction des Opérations, et doivent être approuvées par la Direction de l'Analyse et le Directeur avant d'être transmises à la Division des Activités Spéciales."
 CIA_LATAMa.3.d:0 "\"Monsieur le Président, le directeur de la CIA a des nouvelles de la Colombie.\"\n\"Envoyez-le et merci.\"\n\nLe président [USA.GetLeader] a souri, serrant la main de [GetCurrentCIADir] alors qu'ils s'asseyaient au bureau de Resolute, le directeur sortant un dossier de sa mallette et le déposant sur la table.\n\n\"Monsieur le Président, avec votre approbation, la CIA aimerait lancer des opérations étendues contre les FARC en Colombie.\"\n\n\"Très bien. Donnez-moi encore une fois des informations sur qui sont les FARC.\"\n\n\"Monsieur le Président, les FARC sont les Forces armées révolutionnaires de Colombie. Il s'agit d'un groupe de guérilla communiste qui combat actuellement le gouvernement colombien, que nous soutenons. Nous avons l'intention d'étendre les opérations offensives contre eux en fournissant davantage de financement et de soutien au gouvernement colombien, ainsi qu'en intensifiant les actions secrètes telles que l'intégration d'agents dans les cellules des FARC et la conduite d'assassinats ciblés de dirigeants et de personnalités éminentes des FARC pour susciter la dissidence au sein du mouvement.\"\n\n\"Très bien. Quelle est la prédiction de la CIA quant au succès de ces opérations ?\"\n\n\"Très élevé, Monsieur le Président. Nous espérons qu'en particulier avec les assassinats, les FARC connaîtront des divisions internes et pourraient se diviser en factions belligérantes que le gouvernement colombien sera mieux équipé pour gérer. De plus, la CIA prévoit de coopérer avec le gouvernement dans le cadre d'une campagne anti-FARC à l'échelle nationale afin de montrer les dommages et les destructions qu'elles ont causés au peuple colombien.\"\n\n\"Bien, Directeur. Ceci est approuvé. Veuillez me tenir au courant de tous les événements.\" Le Président signa un morceau de papier tandis que le Directeur souriait, replaçant son dossier dans sa mallette et se préparant à partir. \"Merci, Monsieur le Président.\""
 CIA_LATAMa.4.d:0 "Alors que Jimmy inclinait légèrement l'Air Tractor AT-301, il bâilla, se frottant les yeux tout en vérifiant la boussole et la carte posée sur ses genoux pour confirmer son cap. Il venait de survoler la petite ville de Pasto, dans le sud-ouest du département de Narino en Colombie, et alors que son turbopropulseur survolait les montagnes à 10 000 pieds d'altitude, il se sentait seul.\n\nIl était environ deux heures du matin, heure de Bogota, et tandis que Jimmy continuait à voler, il vérifia à nouveau l'indicateur de son réservoir, s'assurant que le réservoir était plein d'herbicide glyphosate, et baissa également d'altitude pour s'approcher de sa série de cibles ; trois champs de coca, espacés d'environ un ou deux kilomètres, dans la vallée de Patia.\n\nPlissant les yeux pour distinguer le premier, Jimmy sourit en voyant une lumière clignotante, désignant son équipe de contrôleurs aériens avancés, nom de code \"AGUILA\", qui était chargée de distraire les hommes du cartel et de signaler l'avion pulvérisateur. Jimmy a entendu des tirs d'armes automatiques alors qu'il commençait sa passe, ne sachant pas s'il s'agissait d'AGUILA ou des hommes de Medellin. Il a souri et fait signe à personne alors qu'il tombait à 200 pieds, appuyant sur le bouton « drop » pour laisser échapper quelque 100 gallons d'herbicide dans une fine brume au-dessus des plants de coca, avant de remonter à une altitude sûre, pour le faire encore deux fois.\n\nAlors qu'il terminait sa dernière course, tirant à nouveau à 10 000 pieds, Jimmy se souvint de ses premiers jours en tant qu'épandeur dans le Midwest, effectuant des missions de pulvérisation de routine, lorsqu'il fut arrêté par un recruteur de la CIA. « Est-ce que tu aimerais travailler pour nous dans le sud, mon fils ? »"
 CIA_LATAMa.5.d:0 "Alors que le président [USA.GetLeader] retournait dans l'Ovale après une courte pause entre les réunions, il fut néanmoins surpris de voir d'autres tableaux installés sur des trépieds près de son bureau, et des assistants s'agiter, distribuant des dossiers et des paquets.\n\n\"Monsieur le Président, nous pensons que la situation dans le conflit colombien s'est détériorée à un tel point qu'une intervention américaine est nécessaire pour soutenir nos objectifs et ceux du gouvernement colombien.\" Le conseiller à la sécurité nationale [GetCurrentNatSecAdv] a pris la parole en premier, brisant le silence dans la salle.\n\nLe directeur de la CIA [GetCurrentCIADir] a ensuite pris la parole. \"Monsieur, nos agents intégrés ont fortement encouragé des opérations plus offensives. Le gouvernement colombien tâtonne et lutte pour contenir à la fois les FARC et les autres milices communistes, ainsi que les multiples cartels de la drogue qui se disputent l'influence et la capacité de distribuer de la cocaïne. Nos opérations peuvent aider, mais elles ne peuvent aller que jusqu'à présent.\"\n\nLe secrétaire à la Défense [GetCurrentSecDef] hocha la tête. \"Nous avons commencé à mettre en oeuvre et à ajuster des opérations de contingence pour la Colombie. L'État peut vous en dire plus, mais le Pentagone a chargé le commandement sud des États-Unis de prendre le contrôle principal des opérations militaires. Les recommandations préliminaires incluent le recours aux frappes aériennes et au partage de renseignements contre les forces des FARC, afin de permettre aux forces colombiennes d'engager des groupes du cartel.\"\n\nLe président a enfin trouvé l'occasion de s'exprimer. \"Donnez-moi l'angle diplomatique avant d'autoriser toute action militaire. Cette situation est déjà assez compliquée comme elle l'est.\"\n\nLe secrétaire d'État [GetCurrentSecState] est intervenu. \"Nos relations diplomatiques avec les Colombiens ont été cordiales et efficaces. Notre ambassadeur à Bogota rapporte que l'assistance militaire et politique américaine à la Colombie a été couronnée de succès jusqu'à présent, mais que l'armée est confrontée à un important problème de corruption. Il recommande de résoudre ce problème en mettant fin à une certaine aide en échange de réformes.\"\n\nLe président hocha la tête. \"Très bien. Merci à tous, les amis. Tenez-moi au courant, et je veux des rapports et des plans régulièrement mis à jour de la part du Pentagone et des chefs d'état-major. Rien d'orienté militaire ne se produit sans mon accord.\""
 CIA_LATAMa.6.d:0 "Sur la base d'une demande plutôt menaçante de l'ambassadeur américain, nos généraux supérieurs ont lancé une initiative anti-corruption au sein des forces militaires colombiennes. Vraisemblablement dans le cadre des pressions initiées par les Américains, qui ont fourni des millions de dollars d'aide et de conseils, les hauts commandants militaires ont créé une \"unité anti-corruption\" qui enquêtera sur la petite et la grande corruption, en particulier parmi les officiers et sous-officiers.\n\nOn espère que cela aboutira à quelque chose, car les commandants subissent des pressions pour la maintenir et accorder à l'unité une certaine autonomie, car elle rendra compte à la fois à l'état-major colombien et au président, et émettra également des rapports limités à l'ambassade américaine à Bogota."
 CIA_LATAMa.7.d:0 "\"Bonjour?\"\n\"Secrétaire, ici l'ambassade de Bogota. L'ambassadeur aimerait vous dire un mot.\" Le téléphone a cliqué et la ligne est passée à l'ambassadeur des États-Unis en Colombie. \"Secrétaire, j'espère que vous allez bien ce matin.\"\n\"Oui, Ambassadeur, je le suis. De quoi s'agit-il ?\"\n\"Les Colombiens ont demandé que nous nous impliquions davantage dans le conflit, en plus de notre politique actuelle consistant à fournir une assistance militaire manifeste sous la forme de ressources et de conseillers. J'hésite à appeler le Pentagone car notre attaché de défense souhaite vraiment qu'il déploie des troupes et je ne veux pas d'escalade.\"\n\"Très bien, Ambassadeur, merci. Que suggérons-nous à l'État de faire en attendant, afin d'éventuellement retenir le Pentagone et l'USSOUTHCOM ?\"\n\n\"Secrétaire, je pense que nous devrions désigner les FARC comme organisation terroriste étrangère ; vous avez le pouvoir de désigner des groupes en vertu de la loi sur l'immigration et la nationalité de 1965. Nous faisons ensuite plusieurs déclarations ; je fais une, vous en faites une, le Pentagone en fait une. Il semble que nous ayons un front uni, nous n'avons pas nécessairement besoin de l'autorisation du Président, mais nous pouvons le lire. Ce serait déclarer \"symboliquement\" la guerre aux FARC sans la faire passer par le Bureau ovale ou la Colline.\"\n\n« Et les Colombiens ? Le secrétaire fronça les sourcils dans le téléphone.\n\"Ils ne feront pas la différence. Tout ce qu'ils entendront, c'est \"déclarer la guerre\" et le prendre au pied de la lettre, et alors le Pentagone pourra commencer à déployer un petit nombre de troupes en Colombie depuis le Panama ou la Floride.\"\n\"D'accord. Merci Ambassadeur, j'apprécie votre franchise. Je consulterai le personnel et nous agirons sur cette question dès que possible. Merci encore. Au revoir.\"\n\nIl raccrocha, soupirant mais pensant à ce qu'il venait d'entendre. Une idée géniale."
 CIA_LATAMa.8.d:0 "Sans surprise, des déclarations simultanées de Foggy Bottom et du Pentagone ont été publiées aujourd'hui, alors que le secrétaire d'État des États-Unis a officiellement inscrit les Fuerzas Armadas Revolucionarias de Colombia, connues sous le nom de Forces armées révolutionnaires de Colombie (FARC), comme organisation terroriste étrangère en vertu de l'article 219 de la loi sur l'immigration et la nationalité de 1965. Parallèlement, le Pentagone a annoncé une aide défensive supplémentaire au gouvernement colombien dans sa lutte contre les FARC, ainsi que l'envoi de moyens supplémentaires, des conseillers et des unités du Commandement Sud des États-Unis en mission en Colombie. Face aux éloges habituels de l'Ouest et aux critiques de l'Est, la Colombie a accueilli cette annonce comme une implication tacite des États-Unis dans le conflit."
 CIA_LATAMa.9.d:0 "OPÉRATIONS AÉRIENNES ANTI-CARTEL : OPLAN\nQuartier général du Commandement Sud des États-Unis\n\nVous trouverez ci-dessous les ordres des unités subordonnées du Commandement Sud des États-Unis concernant les opérations en Colombie, axés sur le ciblage des positions du cartel dans le pays afin de réduire les capacités, de soutenir les unités de l'armée de l'air colombienne et de protéger les intérêts américains dans la région.\n\n1. Les unités et détachements de la 24e Escadre composite, basés à la base aérienne Howard au Panama, sont autorisés à engager toutes les installations et tous les quartiers généraux des cartels de Medellín et de Cali dans le sud-ouest de la Colombie. Le commandant de la 24e Escadre composite est autorisé à utiliser tous les avions disponibles, y compris, mais sans s'y limiter, les hélicoptères A-7 Corsairs, C-130 Hercules, O-2 Skymasters et UH-1 Huey.\n\n2. Unités de la United States Navy Carrier Air Wing Two (CVW-2), basées sur l'USS Ranger (CV-61) ; y compris les escadrons de chasse 1 et 2, les escadrons d'attaque 25, 113 et 145 armés d'intrus A-6E et de F-14 Tomcats, sont autorisés pour des frappes similaires sur les installations des cartels de Medellin et de Cali sur la côte ouest de la Colombie, en coopération avec les vols de l'armée de l'air.\n\n3. Les unités de soutien de la Force opérationnelle interarmées Bravo, stationnées à la base aérienne de Soto Cano, au Honduras, ainsi que toutes les autres unités de soutien de la Division aérienne sud de l'USAF et de la Carrier Air Wing Two, sont autorisées à assurer la maintenance des aérodromes et des aéronefs, le maniement des armes, la vérification des cibles et d'autres services de soutien.\n\nTous les commandants de l'USN et de l'USAF sélectionneront et vérifieront indépendamment les listes de cibles sur la base des rapports de renseignement de la CIA et de la DIA et du personnel intégré. Toutes les listes de cibles doivent être promulguées via le Commandement Sud des États-Unis et la Maison Blanche avant le début des opérations.\n\nSIGNÉ\nCommandant du Commandement Sud des États-Unis"
 CIA_LATAMa.10.d:0 "Aujourd'hui, un porte-parole du ministère de la Défense au Pentagone a annoncé l'expansion officielle des opérations aériennes américaines en Colombie contre les principaux cartels de la drogue de la région. Désignant le Commandement Sud des États-Unis, basé à Doral, en Floride, comme commandement principal de ces opérations, le Pentagone a déclaré que la raison de ces frappes était de « protéger les intérêts et les partenaires américains en Amérique latine, d'assurer la fin du trafic de cocaïne dans la région et d'aider les forces militaires colombiennes dans leur mission anti-insurrectionnelle en cours ».\n\nSelon d'autres informations fournies par les porte-parole du Commandement Sud des États-Unis, les unités impliquées comprennent la 24e Escadre composite de l'armée de l'air américaine basée au Panama, ainsi que des escadrons basés sur le groupe de porte-avions USS Ranger, qui a l'intention d'opérer au large des côtes colombiennes. Les réactions ont été mitigées, mais le message a été principalement d'aide au gouvernement colombien et d'opérations de lutte contre la drogue qui servent à aider toutes les parties, quelle que soit leur idéologie."
 CIA_LATAMa.11.d:0 "RAPPORT DE RENSEIGNEMENT DES FARC FNSJBFB-NN\n[GetDateText]\n\nLes derniers renseignements de nos cellules, répartis dans tout le pays, ont indiqué les informations suivantes, en particulier sur l'expansion des opérations aériennes américaines contre nos cibles et les cibles du cartel.\n\nLes cellules ont signalé avoir repéré plusieurs types d'avions américains, notamment des A-6 Intruders, des A-7 Corsairs, des avions cargo C-130 et de nombreux hélicoptères de combat et hélicoptères utilitaires UH-1 Huey. La présence d'avions de combat A-6, capables de transporter des avions, suggère que les Américains mènent certaines opérations à partir d'un groupe de porte-avions au large des côtes colombiennes. Les autres avions semblent être soit basés quelque part au Panama, soit des avions locaux stationnés dans des bases militaires colombiennes.\n\nLes installations et camps des FARC et des milices amies n'ont généralement pas été ciblés par les forces américaines, même si quelques cellules ont été touchées par des dommages collatéraux ou ont perdu des caches d'armes et des véhicules. Les Américains semblent attaquer les positions du cartel, en se concentrant sur les cartels de Medellin et de Cali qui opèrent dans l'ouest et le sud de la Colombie, car leur objectif semble être les opérations de lutte contre la drogue, par opposition aux opérations anti-insurrectionnelles classiques, contre une force comme la nôtre.\n\nCertains dirigeants régionaux ont exprimé leur inquiétude quant au fait que les opérations américaines en cours permettraient aux forces régulières colombiennes de se concentrer sur les unités des FARC, tout en privant notre organisation des fonds essentiels nécessaires à la poursuite du combat. Cependant, nos capacités restent élevées et nous persévérerons malgré les bombardements impérialistes sur notre pays."
 CIA_LATAMa.12.d:0 "Les analystes étaient assis autour de la table, sirotant un café et attendant que le directeur de la CIA [GetCurrentCIADir] entre, à seulement quelques pas de son bureau au 7ème étage du bâtiment du siège d'origine, à Langley.\n\n\"Bonjour, messieurs.\" Le directeur sourit et ferma la porte. \"Allons droit au but. Dites-moi tout ce que vous savez sur Pablo Escobar.\"\n\n\"Oui, directeur. Son nom complet est Pablo Emilio Escobar Gaviria. Né en décembre 1949, a grandi dans la ville de Medellin, dans le nord-ouest de la Colombie. Fortement impliqué dans des entreprises criminelles depuis son adolescence, notamment dans le vol de voitures et l'enlèvement d'hommes d'affaires. Arrêté pour la première fois en 1976 par les services de sécurité colombiens pour trafic de cocaïne en provenance d'Équateur. Escobar a commencé à affirmer son influence, se tournant vers la corruption et l'assassinat de fonctionnaires, en embauchant des hommes armés et en trafiquant des quantités toujours croissantes de cocaïne hors de Colombie et vers le nord jusqu'aux États-Unis, initialement via Miami et les Bahamas.\n\n\"Le boom de la cocaïne correspondant au début de cette décennie n'a fait qu'augmenter la demande de cocaïne en provenance de Colombie et a accru la concurrence entre le cartel de Medellin d'Escobar et leur rival, le cartel de Cali. Cependant, Escobar et ses hommes semblent être pris entre deux feux. Ils s'opposent à la fois au gouvernement colombien qui veut restaurer la sécurité, tout en s'opposant également aux FARC et en restant opposés à l'ingérence communiste. Selon Ops, la CIA a tenté de contacter Escobar pour rechercher une coopération, mais n'a jusqu'à présent pas réussi à le faire. A échoué. L'Agence doit prendre une décision sur ce qu'elle va faire de lui, et rapidement. »\n\n\" Merci, messieurs. Je vois. Proposez-vous que nous éliminions Escobar et ses lieutenants ? \"\n\"Oui, monsieur. La DEA, c'est compréhensible, et le FBI sont tous d'accord avec cette idée ; mais ils n'ont pas les ressources ni l'influence nécessaires pour la faire fonctionner eux-mêmes. Ils savent que la CIA a l'influence et le financement, et que nous avons commis des assassinats avec succès dans le passé.\"\n\"Alors, quel est le plan ?\"\n\n\"Les Ops ont proposé de suivre les mouvements d'Escobar au cours des prochaines semaines afin d'établir un modèle d'analyse quant à l'endroit où lui et ses lieutenants vont ; en alternant entre sa ville natale de Medellin et diverses maisons qu'il possède à Carthagène, en Colombie, et une à Miami. Il se peut qu'il baisse suffisamment sa garde pour prendre un week-end de congé et c'est à ce moment-là que nous ferons grève. Des agents de la CIA, de la DEA, du MACV-SOG, et cetera, organiseront une option de proposition de grève, probablement à son domicile. Propriété à Carthagène, où nous emmènerons Escobar, de préférence vivant, mais mort fera aussi l'affaire.\n\n\"Très bien. Nous ne lirons pas le président à ce sujet, sauf en cas d'absolue nécessité.\""
 CIA_LATAMa.13.d:0 "RECOURS AUX CARTELS ANTICOMMUNISTES EN COLOMBIE\nBureau Colombie, Bureau Amérique Latine, Direction de l'Analyse\nSECRET/NOFORN\n\nLa situation des cartels du trafic de drogue en Colombie présente une situation inhabituelle pour toutes les parties impliquées, y compris les États-Unis, dans la protection des intérêts américains. Alors que la plupart des cartels entretiennent une idéologie anticommuniste dans le cadre de l'augmentation des marges bénéficiaires de leurs opérations de trafic de cocaïne, ils doivent également faire face à des ingérences et des attaques continuelles de la part du gouvernement colombien, et partagent certains idéaux pratiques avec les milices communistes et d'autres groupes.\n\nCe bureau est d'avis que certains grands groupes cartels non communistes, tels que le cartel de Medellin dirigé par Pablo Escobar, devraient être cooptés et intégrés dans une alliance anticommuniste générale dirigée par le gouvernement. Ce bureau estime que les cartels disposent déjà de l'argent, des réseaux de distribution et des armes nécessaires pour combattre les FARC et d'autres milices communistes, et que si nous sommes en mesure de conclure des accords avec les principaux cartels (sur des questions telles que la distribution de cocaïne et/ou l'immunité contre les poursuites), nous pourrons peut-être recevoir une aide supplémentaire du cartel et réduire le nombre de belligérants dans le conflit. La consolidation doit être la clé."
 ## Mexico
 CIA_LATAMa.14.d:0 "POINT SUR LA SITUATION : BUREAU DU MEXIQUE\nBureau Mexique, Bureau Amérique Latine, Direction de l'Analyse\nSECRET/NOFORN\n\nMalgré d'autres conflits et tumultes survenant dans la majorité du monde latino-américain, le voisin du sud des États-Unis, le Mexique, est également confronté à une situation unique. Tout en entretenant des relations plutôt cordiales avec les États-Unis, le Mexique est à lui seul responsable du transbordement de plus de 50 % des importations américaines de marijuana et d'héroïne, deux substances contrôlées de l'Annexe I en vertu de la Loi sur les substances contrôlées.\n\nLe gouvernement mexicain, dirigé par le président [MEX.GetLeader], est confronté aux mêmes problèmes de contrôle des drogues que les pays plus au sud, comme la Colombie. Le recours à la pulvérisation d'herbicides et l'implication des forces armées mexicaines dans les opérations de lutte contre la drogue se sont révélés inefficaces, car le pays reste un point central à la fois pour la production de marijuana et d'héroïne, ainsi qu'un point d'étape pour le trafic de cocaïne en provenance d'autres États, dont la Colombie. Cependant, il convient de noter que contrairement aux autres États latino-américains producteurs de drogue, la population mexicaine consomme très peu des drogues qu'elle produit et trafique.\n\nJusqu'à présent, la politique des États-Unis a consisté à exercer des pressions diplomatiques sur le gouvernement mexicain pour qu'il adopte des mesures de contrôle plus strictes, ce qu'ils ont fait la plupart du temps, avec des degrés d'efficacité variables. Ce bureau, ainsi que d'autres bureaux et bureaux de la communauté du renseignement et du Département d'État axés sur le Mexique, ont proposé deux changements possibles de stratégie pour aider le Mexique à résoudre son problème de drogue persistant et pour faire progresser les intérêts américains dans la région.\n\n1. Les États-Unis pourraient entamer une approche secrète auprès du Mexique, en vue d'engager des cartels à l'insu du gouvernement mexicain. Cela pourrait être préférable plutôt que de tenter de faire pression diplomatiquement sur les Mexicains, et les opérations potentielles pourraient inclure la formation de milices anti-cartel, des assauts secrets contre les bases et installations du cartel et une augmentation des opérations et du financement de la DEA.\n\n2. Les décideurs américains pourraient également envisager une éventuelle intervention au Mexique afin de stabiliser la situation par la force. On espère qu'il s'agira d'une intervention internationale pouvant impliquer un processus des Nations Unies. Il est impératif que le gouvernement mexicain soit consulté à ce sujet, afin de maintenir des relations amicales avec le Mexique et d'éviter toute mauvaise volonté. Si le Mexique est prêt à accepter des observateurs et une aide internationale, il sera mieux équipé pour gérer le problème de la drogue.\n\nLe Bureau espère que l'une des deux stratégies permettra aux États-Unis de s'engager sur la voie d'une bonne répression des drogues et de stabiliser de manière adéquate la situation de la drogue en Amérique latine et centrale."
 CIA_LATAMa.15.d:0 "APPROCHES SECRÈTES AU MEXIQUE\nBureau Mexique, Bureau Amérique Latine, Direction de l'Analyse, Direction des Opérations\nSECRET/NOFORN\n\nAlors que les relations entre les États-Unis et le Mexique se sont détériorées, la communauté du renseignement américain et le Département d'État ont déterminé qu'une stratégie secrète dans la guerre contre la drogue en cours était la prochaine étape de la politique américaine concernant le Mexique et les opérations de lutte contre la drogue. Ce Bureau recommande ce qui suit :\n\n1. Former des unités de milice anti-cartel, également connues sous le nom d'unités autonomes, dans les municipalités et les villes, en particulier là où l'activité du cartel est connue pour être élevée. L'objectif est de former les citoyens mexicains locaux à défendre leurs communautés et de garantir une autonomie locale dans les opérations anti-cartel, en déléguant l'autorité aux gouvernements locaux.\n\n2. Mener des raids des forces spéciales sur les bases et installations du cartel ; en utilisant les ressources de la CIA, de la DIA, de la Delta Force et des SEAL, pour attaquer, attaquer, arrêter et tuer stratégiquement les dirigeants et lieutenants du cartel, ainsi que les chauffeurs-livreurs et les convois, afin d'interdire et d'envoyer un message aux cartels que les États-Unis sont sérieux.\n\n3. Expansion du financement frontalier de la DEA, ainsi que des ressources de la patrouille frontalière. Ce financement, tiré du financement déjà alloué par la CIA, fournirait des ressources à la DEA et à la Border Patrol pour continuer à interdire et arrêter les membres du cartel et le trafic de drogue à travers la frontière et les points d'entrée américains, ainsi qu'à approuver des pouvoirs juridictionnels supplémentaires pour que ces agences puissent poursuivre leurs opérations.\n\nLe Bureau espère que de nouvelles opérations secrètes et une coopération avec les agences et responsables américains et mexicains concernés interdiront efficacement la fabrication et le trafic de drogue au Mexique, stoppant ainsi le flux de drogues vers le sud des États-Unis et protégeant notre sécurité au pays et à l'étranger."
 CIA_LATAMa.17.d:0 "C'était le crépuscule dans le désert et, à mesure que le soleil disparaissait sous l'horizon, les températures chaudes commençaient rapidement à se refroidir. Dieu merci pour ça, pensa Mason en sirotant une bouteille d'eau, attendant qu'il fasse plus sombre. Il était assis dans une Ford Econovan, avec des plaques mexicaines bien sûr.\n\n\"Hey Gene, comment ça se passe là-bas ?\"\n\nGene, son partenaire, hocha la tête. « Ça a l'air bien, patron ! Il vérifia à nouveau l'équipement de surveillance équipé à la hâte, avant de charger la dernière balle dans son pistolet SIG Sauer P220, faisant glisser l'autre chargée sur le sol jusqu'à Pickett.\n\nLa radio crépita à nouveau, indiquant la présence proche de l'équipe d'assaut. \"Overwatch, ici Dog One. Dog One, approchant de LZ. Rapport de situation, allez!\"\n\nGene a repris. \"Dog One, ici Overwatch. La cible Alpha est dégagée. Autorisé à prendre d'assaut. Tempête, tempête, tempête. »\n\nJuste au moment où il avait terminé, trois hélicoptères Hughes 500D ont survolé la camionnette, à environ 50 pieds au-dessus d'eux, et ont atterri dans la cour de l'enceinte du cartel. Cinq soldats, accrochés à chaque hélicoptère, ont sauté, prenant des positions tactiques, tandis que les hélicoptères décollaient, fournissant un tir de couverture depuis les airs.\n\nGene et Mason quittèrent également leur position, alors que la camionnette s'avançait de sa position cachée et s'arrêtait, en queue de poisson devant l'entrée. Les deux agents de la CIA, se précipitant vers la cour, se frayèrent un chemin jusqu'à l'équipe d'assaut de la DEA, qui était occupée à arrêter le feu, à arrêter les membres du cartel qui se rendaient et à inspecter les corps de la poignée qu'ils avaient tués en chemin.\n\n\"On dirait que nous avons frappé au moment idéal.\" » dit Mason, prenant une seconde pour recharger son pistolet avant de se déplacer pour dégager une autre pièce."
 CIA_LATAMa.18.d:0 "C'était une matinée nuageuse à Washington lorsque l'administrateur de la Drug Enforcement Agency entra dans le bâtiment du siège de la DEA, situé au 1405 I Street, à seulement quelques pâtés de maisons de la Maison Blanche et du National Mall. Alors qu'il montait, au dernier étage, entrant dans son bureau, il y avait une note sur son bureau de sa secrétaire, quelque chose concernant un appel à son bureau depuis un numéro inconnu, demandant à lui parler. La plupart des appels ont été filtrés, mais ceux-ci provenaient d'un téléphone gouvernemental.\n\nAlors que nous travaillions sur certains rapports, le téléphone a sonné environ 20 minutes plus tard. Il décrocha, s'attendant à ce qu'il y ait un certain nombre de personnes à l'autre bout du fil ; sa femme, un subordonné, et cetera.\n\n\"Bonjour?\"\n\"Est-ce l'administrateur de la DEA ?\"\n\"Oui, à qui je parle ?\"\n\"C'est Langley. Vérifiez vos comptes de budget de fonctionnement. Il devrait y avoir de nouveaux fonds là-dedans, aux alentours de 20 millions de dollars. De rien.\"\n\"Quoi?\"\nCliquez.\n\nL'administrateur de la DEA a juste regardé autour de lui avant de poser le récepteur. Bon sang, pensa-t-il. Plus d'argent pour mettre en oeuvre des programmes de lutte contre la drogue, je suppose, pensa-t-il une seconde plus tard."
 CIA_LATAMa.19.d:0 "\"Monsieur le Président, nous avons une proposition sur une solution à la question mexicaine.\"\n\nLe président [USA.GetLeader] s'est arrêté sur les affaires auxquelles il s'était occupé auparavant, sûrement quelque chose de moins important que ce qui allait sortir de la bouche du directeur de la CIA [GetCurrentCIADir]. Le secrétaire d'État [GetCurrentSecState] se tenait derrière lui, donc ça devait vouloir dire quelque chose.\n\n\"Allez, directeur.\"\n\n\"Eh bien, monsieur, la CIA a analysé la situation au Mexique et la politique américaine, et elle a trouvé une alternative à ce que nous faisons actuellement. Nous proposons une intervention internationale, dirigée par les États-Unis ou les Nations Unies, au Mexique, afin de stabiliser la situation intérieure et de fournir des capacités opérationnelles cruciales de lutte contre la drogue et d'interdiction.\"\n\n\"Je vois. Prévoyons-nous d'informer les Mexicains à ce sujet, secrétaire ?\"\n\nLe secrétaire d'État acquiesça. \"Oui, monsieur. Nous prévoyons de faire une annonce ainsi qu'une enquête par l'intermédiaire de l'ambassadeur des États-Unis à Mexico, leurs options étant que nous leur fournirons une aide et une formation, ou s'ils refusent, nous tenterons de trouver un consensus international via les Nations Unies et l'Organisation des États américains.\"\n\n\"Je vois. Considérez ceci comme signé, messieurs. Je suppose que l'autre alternative était de poursuivre les opérations secrètes au Mexique ?\"\n\"Oui, monsieur. Nous y avions réfléchi, mais étant donné que nos relations avec les Mexicains semblent bonnes en ce moment, l'option diplomatique pourrait être préférable.\"\n\"Très bien. Merci, messieurs.\"\n\n\"Merci, Monsieur le Président.\" Les deux hommes sortirent de l'Ovale et, se regardant, restèrent debout dans le couloir pendant une minute. \"Secrétaire, j'espère que vous savez dans quoi vous vous embarquez. Vous voudrez peut-être obtenir un soutien international maintenant pendant que vous le pouvez.\""
 CIA_LATAMa.20.d:0 "L'ambassadeur des États-Unis au Mexique s'est adressé à notre Secrétariat des Affaires étrangères et à notre Secrétariat de la Défense avec une proposition visant à lutter contre notre problème persistant de lutte contre la drogue dans le pays.\n\nLa Maison Blanche, apparemment préoccupée par notre inefficacité dans la lutte contre les opérations de production et de trafic de drogue du cartel au Mexique, a proposé une intervention internationale au Mexique afin de stabiliser la situation et de permettre au gouvernement d'aider à améliorer la répression.\n\nLes Américains ont proposé une aide internationale aux forces de l'ordre sous forme de financement ainsi qu'une coopération transfrontalière en matière d'interdiction, mais certains responsables au sein du gouvernement craignent que permettre aux Américains de dicter la politique en matière de drogue dans leur propre pays soit intrusif et contre-productif par rapport aux objectifs politiques. Cependant, l'ambassadeur américain a clairement indiqué que, dans l'ensemble, les États-Unis s'impliqueraient, qu'on le veuille ou non. Une décision cruciale doit être prise : solliciter leur aide ou rester ferme contre la domination yankee sur nos affaires."
 CIA_LATAMa.21.d:0 "Après une courte conférence avec des responsables diplomatiques et de la sécurité nationale mexicains, l'ambassadeur des États-Unis à Mexico a fait rapport à Washington, indiquant que le gouvernement mexicain était ouvert à l'aide américaine dans les opérations de lutte contre la drogue.\n\nApparemment considérée comme un sujet assez controversé dans certains coins de la vie politique mexicaine, la question a été considérée comme un bénéfice net, et déjà, la DEA américaine et la police fédérale mexicaine se sont rencontrées pour discuter de la coopération frontalière et des opérations possibles. Le partage de renseignements devrait également avoir lieu, et le Pentagone a déjà envisagé de déployer des conseillers militaires et du personnel de sécurité pour aider le Secrétariat mexicain à la Défense.\n\nLes analystes latino-américains ont exprimé leur optimisme pour l'avenir, espérant qu'une coopération plus poussée entre les États-Unis et le Mexique empêchera les principaux cartels de continuer à exercer leur influence sur la politique mexicaine et mettra un terme au problème de la drogue qui prend rapidement de l'ampleur aux États-Unis."
 CIA_LATAMa.22.d:0 "Après une brève réunion avec des responsables diplomatiques et de sécurité nationale mexicains, l'ambassadeur des États-Unis à Mexico a rapporté à Washington que les Mexicains étaient fermement opposés à une intervention ou à une aide américaine dans leur pays, au motif qu'une influence américaine accrue dans leur pays continuerait à éroder la situation politique et sociale et à perpétuer le problème de la drogue.\n\nLe Secrétariat mexicain des Affaires étrangères a inclus une déclaration publique révélant le plan, condamnant sévèrement la demande comme « une tactique bien conçue de l'impérialisme américain en Amérique latine », et affirmant que « le Mexique ne sera pas coopté pour les intérêts américains plus au sud. Nous pouvons résoudre nous-mêmes le problème actuel du trafic de drogue sans ingérence américaine ou internationale ».\n\nLes responsables des communautés du renseignement et de la défense auraient été furieux, et le président [USA.GetLeader] aurait été informé des développements en cours. Il est clair que si les Mexicains ne s'y conforment pas, nous les y obligerons par tous les moyens nécessaires ; quitte à se tourner vers la communauté internationale."
 CIA_LATAMa.23.d:0 "Aujourd'hui, à Mexico, un porte-parole du Secrétariat mexicain aux Affaires étrangères a confirmé des informations jusqu'alors infondées selon lesquelles les États-Unis cherchaient à intervenir au Mexique pour lutter contre la crise actuelle des cartels de la drogue. Les responsables mexicains ont condamné sans équivoque toute intervention possible en la qualifiant de « impérialisme américain en Amérique latine, comme on en a déjà vu au Brésil, au Guatemala et à Cuba ».\n\nLes responsables américains seraient déçus par cette évolution, mais se sont engagés à poursuivre une éventuelle intervention. Certains experts ont avancé que les Nations Unies ou l'Organisation des États américains pourraient être contactées, mais le temps nous le dira."
 CIA_LATAMa.24.d:0 "C'était une journée ensoleillée alors que le président [USA.GetLeader] se réunissait avec son personnel et ses subordonnés pour une cérémonie petite mais formelle. Étaient réunis le secrétaire d'État [GetCurrentSecState], le directeur de la CIA [GetCurrentCIADir], le conseiller à la sécurité nationale [GetCurrentNatSecAdv], le directeur du FBI, l'administrateur de la DEA et le chef de la patrouille frontalière.\n\nIls étaient tous rassemblés là, pas encore de presse, car le Président signait un document important, quoique quelque peu archaïque et traditionnel ; une proclamation présidentielle. Mais ce n'était pas une proclamation ordinaire ; une résolution qui serait également accompagnée d'une résolution commune du Congrès confirmant son contenu ; une proclamation présidentielle déclarant les États-Unis du Mexique État du narcotrafic, un pays opérant autour de la production et du trafic de drogues.\n\n\"Par l'autorité qui m'est conférée en tant que président des États-Unis d'Amérique, je proclame ce qui suit :\nDevenir de plus en plus préoccupé par l'augmentation des flux de marijuana et d'héroïne vers les États-Unis via la frontière avec le Mexique ;\nPréoccupé par le fait que les forces de l'ordre et les unités militaires mexicaines ne sont ni efficaces ni capables de s'engager seules dans les cartels ;\nReconnaissant le rôle essentiel que joue la corruption, en particulier l'influence du cartel, dans le système politique mexicain dans l'efficacité des forces de l'ordre dans les opérations de répression des drogues ;\nEn tant que président des États-Unis d'Amérique, je déclare et proclame que les États-Unis du Mexique sont désormais considérés comme un narco-État au vu des faits ci-dessus, et je lance tous les avertissements aux civils, via des sources compétentes, telles que le Département d'État, des dangers de voyager au Mexique pour leur propre sécurité.\n\nLe président soupira en signant la proclamation, sachant très bien que ce ne serait que le début de ce qui allait sûrement être une situation intéressante pour son administration."
 CIA_LATAMa.25.d:0 "Alors que le secrétaire d'État [GetCurrentSecState] était assis dans son bureau, il a vérifié son emploi du temps, avant d'entendre un bourdonnement de son secrétaire extérieur.\n\"Secrétaire, vous recevez des appels des ambassadeurs et du bureau d'Amérique latine sur les lignes un à quatre.\"\n\nDécrochant le téléphone, il appuya sur « LIGNE 1 ».\n\n\"Bonjour Ambassadeur, comment allez-vous ? Quelle est la situation à Londres ?\"\n\"Monsieur le Secrétaire d'État, les Britanniques semblent ambivalents quant à leur soutien à une mission internationale de lutte antidrogue. Ils ont peu d'influence ou de raisons de s'impliquer au Mexique, mais le Ministre des Affaires étrangères n'a pas indiqué qu'ils voteraient contre.\"\n\n\"Très bien, merci Ambassadeur. Bonne journée.\" Le secrétaire murmura au revoir avant d'appuyer sur « LIGNE 2 ».\n\"Ambassadeur, comment ça se passe à Paris ?\"\n\"Monsieur le Secrétaire d'État, les Français souhaitent contribuer à une mission de surveillance des drogues. Ils ont dit qu'ils ne voteraient pas contre au Conseil de sécurité.\"\n\"Très bien, merci.\" Le secrétaire passa laconiquement à la « LIGNE 3 ».\n\n\"Secrétaire, je sais ce que vous allez demander. Les Brésiliens, les Argentins et les Chiliens soutiennent tous votre programme. Les Colombiens le sont peut-être, mais comme vous le savez, ils sont enlisés en ce moment. La majeure partie de l'Amérique centrale est également favorable, à l'exception du Nicaragua, bien sûr.\"\n\n\"Merci, Bureau Amérique Latine. Continuez vos analyses. Bonne journée.\" Le secrétaire s'est senti mal mais il a dû rester bref, passant à son dernier appel, « LIGNE 4 », l'ambassadeur auprès des Nations Unies.\n\n\"Monsieur l'Ambassadeur, comment se passe votre travail à New York ?\"\n\n\"Secrétaire, les choses ont été mitigées. La Mission et moi avons travaillé 24 heures sur 24 pour contacter les autres missions ici et les rallier, en particulier les membres du Conseil de sécurité et le bloc de l'Est, mais très peu de chance jusqu'à présent. De nombreux membres en dehors de l'Amérique latine s'en moquent ou considèrent cela comme un renforcement de l'impérialisme américain. Nous faisons de notre mieux, Secrétaire, et travaillons actuellement sur le texte d'un projet de résolution. \"\n\n\"Merci, Monsieur l'Ambassadeur. Continuez votre bon travail et continuez à produire des rapports. Si vous avez besoin d'un appel de ma part, envoyez-le via mon bureau. Le Président veut que cela se produise et bon sang, je vais essayer de faire en sorte que cela fonctionne.\""
 CIA_LATAMa.26.d:0 "C'était la réunion ordinaire du Conseil de sécurité des Nations Unies, et lorsque les membres entrèrent dans la salle de réunion du Conseil à New York, ils commencèrent à soupçonner un piège. Le représentant américain, déjà arrivé, examinait les papiers, ses assistants se tenant à proximité. Ils levèrent les yeux tandis que les représentants soviétiques, chinois, britanniques, français et non permanents s'asseyaient et étaient mis à l'ordre par le président. En règle générale, l'ambassadeur américain se levait le premier et commençait immédiatement son discours.\n\n\"Mesdames et messieurs du Conseil de sécurité, j'ai convoqué aujourd'hui une réunion pour discuter d'une question que les Nations Unies ont déjà traitée. Notre voisin du sud, le Mexique, a un problème continu de lutte contre la drogue, avec plusieurs grands cartels produisant et trafiquant de la marijuana et de l'héroïne à travers la frontière vers les États-Unis. Cela affecte notre jeunesse, causant des centaines de morts et de dépendance des deux côtés de la frontière, et fournissant au crime organisé des millions de dollars pour ses propres usages.\"\n\n\"Le gouvernement mexicain a tenté d'utiliser ses forces de l'ordre et ses forces militaires pour contrer ces cartels, mais il s'est montré inefficace dans cet objectif. Les États-Unis ont essayé de demander de l'aide, mais le gouvernement mexicain a résisté à nos avancées à chaque instant. C'est un problème qui nous affecte non seulement, mais aussi la région latino-américaine toute entière, voire le monde entier. La guerre contre la drogue est une question internationale et que nous, en tant que leader mondial, voulons résoudre avec l'aide de l'ONU.\"\n\n\"En tant que représentant américain au Conseil de sécurité des Nations Unies, je mets par la présente sur la table la résolution suivante, pour condamner la crise de la drogue au Mexique, autoriser une mission de surveillance et de répression des Nations Unies au Mexique et autoriser les États-Unis à prendre des mesures pour restaurer l'État de droit au Mexique et éliminer les opérations de trafic de drogue.\"\n\nEn se rasseyant, la pièce entière éclata dans un murmure sourd. Alors que la délégation américaine était assise dans son coin de la salle, elle savait que ce ne serait qu'un début."
 CIA_LATAMa.27.d:0 "La surprise est survenue aujourd'hui aux Nations Unies à New York lorsque le Représentant permanent des États-Unis au Conseil de sécurité s'est approché de l'organisme et a soumis un projet de résolution concernant la crise de la drogue en cours dans la région.\n\nSoumis quelques jours après que le gouvernement mexicain a rejeté une offre d'intervention pour prévenir le trafic de drogue, et après que le président américain [USA.GetLeader] a déclaré le Mexique comme narco-État dans une proclamation présidentielle, le projet de résolution du Conseil de sécurité de l'ONU condamne fermement la crise actuelle de la drogue et l'incapacité du Mexique à l'arrêter, autorisant une mission de surveillance et d'application des lois des Nations Unies au Mexique et plaçant cette mission sous la direction des États-Unis pour restaurer l'État de droit au Mexique et lutter contre le trafic de drogue.\n\nLargement considéré comme un exemple international de la politique actuelle de « guerre contre la drogue » des États-Unis, le Conseil de sécurité est largement divisé sur ce point ; la délégation soviétique et d'autres condamnant des messages aussi flagrants mais n'indiquant aucun veto. Une grande partie des États latino-américains non communistes semblent favorables à cette proposition, à l'exception évidente du Mexique."
 CIA_LATAMa.28.d:0 "De bonnes nouvelles sont arrivées aujourd'hui de notre Représentant permanent auprès des Nations Unies, car ils ont confirmé que le Conseil de sécurité a approuvé notre projet de résolution sur la question du Mexique.\n\nAprès consultation du secrétaire d'État et du secrétaire à la Défense, la résolution de l'ONU stipule la formation d'une mission de surveillance et d'application des Nations Unies au Mexique, gérée sous le commandement des États-Unis et d'autres pays participants. La résolution condamne également fermement le gouvernement mexicain pour son inefficacité jusqu'à présent dans la prévention du trafic de drogue.\n\nLes responsables de Foggy Bottom, du Pentagone et de New York se coordonnent rapidement pour établir un groupe de pays participants, ainsi que pour prépositionner des moyens militaires près de la frontière mexicaine pour commencer l'opération une fois qu'elle sera formée par l'ONU."
 CIA_LATAMa.29.d:0 "Une malheureuse nouvelle est arrivée du siège des Nations Unies à New York, alors que le Conseil de sécurité des Nations Unies, agissant sous l'influence et l'emprise des États-Unis, a adopté une résolution autorisant la formation d'une mission de surveillance et de répression des Nations Unies au Mexique.\n\nApparemment mécontente de l'efficacité de notre gouvernement jusqu'à présent dans la lutte contre la crise de la drogue, l'ONU a accordé aux forces américaines la permission de diriger la mission, avec le personnel international et le soutien de la région et du monde entier.\n\nDe nombreux membres du gouvernement, y compris le président [MEX.GetLeader], sont très mécontents et appellent tous à résister aux forces de l'ONU et des États-Unis. Le temps nous dira ce que fait la Mission, comment elle fonctionne face à cette crise et comment nous y répondrons"
 CIA_LATAMa.30.d:0 "Une autre surprise est venue du siège des Nations Unies à New York lorsque le Conseil de sécurité des Nations Unies, dirigé par les États-Unis, a approuvé un projet de résolution autorisant une mission de surveillance et de répression des Nations Unies au Mexique. Reconnaissant apparemment la nécessité d'un contrôle et d'une répression internationaux des drogues, les cinq membres permanents du Conseil de sécurité se sont mis d'accord sur la question, sans veto, même de la part de l'Union soviétique.\n\nEn plaçant les États-Unis comme principaux responsables de la mission, les opérations au Mexique devraient commencer sous peu. Un soutien international, tant au sein du Conseil de sécurité qu'à l'Assemblée générale, sera nécessaire pour recevoir davantage de volontaires et de personnel chargé de l'application des lois. Le Mexique, même s'il n'a pas fait de commentaires officiels, a vu d'importants responsables gouvernementaux exprimer une extrême désapprobation, et on s'attend à ce que le gouvernement mexicain intervienne dans les opérations de la Mission sur presque toutes les questions."
 CIA_LATAMa.31.d:0 "Une malheureuse nouvelle est arrivée aujourd'hui du siège de l'ONU à New York, notre ambassadeur auprès des Nations Unies appelant la Maison Blanche et informant [USA.GetLeader] que la résolution du Conseil de sécurité concernant le Mexique a échoué, avec un veto de l'Union soviétique, mettant ainsi fin à toutes les propositions significatives des États-Unis.\n\nLes responsables du Département d'État et du Département de la Défense seraient furieux, les membres de la délégation de l'ONU à New York tentant de gagner du terrain auprès de l'Assemblée générale en faveur d'un projet de résolution. Cependant, toute chance d'une mission de surveillance de l'ONU au Mexique a échoué, en raison de l'ingérence et de l'influence du bloc de l'Est."
 CIA_LATAMa.32.d:0 "De bonnes nouvelles sont arrivées de la Mission permanente du Mexique auprès des Nations Unies, à savoir qu'un projet de résolution proposé au Conseil de sécurité créant une mission de surveillance des Nations Unies dans notre pays a échoué, en raison du veto de l'Union soviétique, l'un des cinq membres permanents du Conseil.\n\nDe hauts responsables gouvernementaux seraient satisfaits, tandis que des sources diplomatiques aux États-Unis rapportent que de nombreux responsables du Département d'État et de la Maison Blanche sont furieux et pourraient se tourner vers des imprévus pour atteindre leurs objectifs. On ne sait toujours pas ce que feront les États-Unis pour poursuivre ce dossier, mais nous pouvons au moins être à l'abri d'une intervention internationale pour le moment."
 CIA_LATAMa.33.d:0 "D'autres nouvelles sont arrivées aujourd'hui du siège de l'ONU à New York alors que le Conseil de sécurité des Nations Unies a rejeté une résolution rédigée par les États-Unis visant à former une force internationale de surveillance et d'application au Mexique pour contrôler la crise de la drogue en cours dans ce pays. Selon des responsables de l'ONU, la résolution a échoué en raison du veto de l'Union soviétique, l'un des cinq membres permanents du Conseil.\n\nAlors que les responsables mexicains semblent soulagés par cette évolution, les responsables américains sont furieux, en particulier après avoir lancé une campagne de soutien international aux opérations de lutte antidrogue. Il n'est pas encore clair si les États-Unis agiront seuls pour résoudre le problème, mais seul le temps nous le dira."

 # LATAM Anti-Communist Priority (Route B)
 CIA_LATAMb.0.d:0 "C'était un lundi matin pluvieux dans le Bureau Ovale, et alors que le Président s'installait avec sa tasse de café, il se préparait pour un autre briefing passionnant de son groupe principal de personnel de sécurité nationale ; Directeur de la CIA [GetCurrentCIADir], conseiller à la sécurité nationale [GetCurrentNatSecAdv]et secrétaire d'État [GetCurrentSecState], ainsi qu'une rafale d'assistants.\n\n\"Monsieur le Président, je suis sûr que vous conviendrez qu'à l'heure actuelle, notre meilleure ligne de conduite est de maintenir une priorité anticommuniste dans la région latino-américaine. Se concentrer sur les cartels ne nous mènera nulle part dans la région, car les États-Unis et leurs alliés se concentreraient sur les groupes combattants des deux côtés. Bien que les cartels soient dangereux, les guérillas communistes en Amérique centrale et latine sont encore plus dangereuses et ont la capacité institutionnelle de renverser les gouvernements soutenus par les États-Unis. Cela devrait être la priorité numéro un dans la région. » Le conseiller à la sécurité nationale s'est ouvert.\n\n\"Très bien alors. Directeur, que propose la CIA pour soutenir les efforts de renseignement dans le cadre de ce plan ?\"\n\nLe directeur de la CIA a parcouru quelques notes puis a pris la parole. \"Monsieur le Président, la CIA a principalement concentré ses propositions et ses analyses sur le Panama. Le dirigeant de ce pays, le général Manuel Noriega, a été formé à l'École des Amériques, est un anticommuniste fervent et a précédemment servi comme chef des renseignements pour le Panama avant de devenir chef. Nous pensons que lui et son gouvernement seront un atout crucial dans la région. De plus, notre attention sur le trafic de drogue s'est principalement concentrée sur la cocaïne, et éventuellement sur son trafic pour financer de nouvelles opérations contre les communistes.\"\n\nLe secrétaire d'État est intervenu avant que le président ait pu répondre. \"Monsieur le Président, l'État a également étudié la possibilité d'élargir ses relations avec les États anticommunistes d'Amérique centrale tels que le Honduras, le Guatemala et le Salvador. L'État a déterminé que les incitations possibles pourraient être la vente d'armes, l'aide économique, la normalisation des relations commerciales, et cetera, s'ils continuent à soutenir l'intervention contre les guérilleros communistes.\"\n\nLe président hocha la tête et posa sa tasse. \"Cela ressemble à un bon plan, bien coordonné. Ma seule préoccupation est de savoir jusqu'à quel point nous devons le rendre public. Les opérations de la CIA doivent rester secrètes, tandis que les actions diplomatiques restent publiques. Nous n'informons pas le Congrès à ce sujet à moins qu'il ne le demande, compris ?\"\n\n\"Oui, Monsieur le Président.\""
 CIA_LATAMb.1.d:0 "\"Comment s'appelle déjà ce général ?\"\n\"Général Manuel Noriega, directeur adjoint.\"\n\nLes deux analystes, après avoir passé des jours à préparer des rapports sur l'Amérique latine, bouillonnaient d'émotion à l'idée de devoir simplifier chaque élément d'information pour le directeur adjoint des opérations de la CIA, alors qu'ils étaient assis dans une salle de conférence quelque part à Langley.\n\n\"D'accord. Noriega. Et lui ? Qu'est-ce que le Bureau Amérique Latine a sur lui ?\"\n\n\"Né en 1934, il a rejoint la Garde nationale panaméenne dans les années 1960, a fait ses études à l'École des Amériques en 1966, a été affecté aux opérations antisyndicales de la United Fruit Company. Noriega a gravi les échelons de l'armée panaméenne, soutenant la prétention au pouvoir de Torrijos et est devenu son chef des renseignements. Pendant ce temps, il a exilé plus d'un millier de Panaméens qu'il considérait comme des dissidents et s'est impliqué dans le trafic de stupéfiants ; américain Les forces de l'ordre s'en sont rendu compte dans les années 1970, mais ont laissé tomber. En 1971, les relations entre le Panama et les États-Unis, en particulier dans le domaine du renseignement, étaient devenues suffisamment étroites pour que la CIA ait placé Noriega sur la liste des salariés, et depuis lors, la CIA lui a versé entre 100 000 et près de 200 000 dollars par an, en fonction de l'administration et des priorités budgétaires. 1981.\"\n\n\"Excellent, merci.\" Le DDO s'arrêta une minute pour réfléchir. \"La DCI et le président m'ont fait part de leurs éventuelles inquiétudes quant au maintien de Noreiga sur la liste de paie de la CIA, en particulier compte tenu de la surveillance accrue du Congrès et de ses relations passées avec le trafic de drogue. Cela vaut-il la peine de le garder sur la liste de paie, messieurs ?\"\n\nLes analystes se regardèrent les uns les autres, puis leurs notes, puis en avant. \"Oui, monsieur. Nous pensons que Noriega occupe une position unique en tant que leader du Panama et a la capacité d'acheminer des armes et des renseignements vers les forces Contra au Nicaragua, et sa situation près du canal lui confère un avantage stratégique important. Son passé en matière de trafic de drogue pourrait peut-être être rectifié grâce à des incitations de notre part ou de l'État, et certaines troupes sont toujours stationnées près de la zone du canal. L'application de la loi est tout à fait possible. \"\n\nLe DDO hocha la tête. \"Je vois. Très bien, nous allons le garder sur la liste de paie pour l'instant. Merci, messieurs.\""
 CIA_LATAMb.2.d:0 "Répondant à certaines inquiétudes de la Maison Blanche et du Capitole quant à l'utilité de maintenir des relations avec le régime de Noreiga, les États-Unis ont aujourd'hui, via leur ambassade à Panama City et en secret, communiqué un soutien supplémentaire au général Manuel Noriega et à son gouvernement.\n\nBien que cela ne soit pas précis sur ce qu'impliquerait ce soutien, on s'attend à ce que les États-Unis fournissent une aide économique, des relations commerciales et une aide militaire, en échange du soutien du gouvernement de Noriega aux opérations anticommunistes. Le chef de la station de la CIA à Panama City a exprimé en privé son soutien à la poursuite des opérations américaines dans le pays et en Amérique centrale dans son ensemble."
 CIA_LATAMb.3.d:0 "L'ANTICOMMUNISME EN AMÉRIQUE CENTRALE : EN BREF\nBureau d'analyse latino-américaine, Direction du renseignement\nSECRET/NOFORN\n\nDans leur lutte pour chasser l'influence communiste d'Amérique centrale et latine, les États-Unis se sont fortement appuyés sur les régimes anticommunistes et les États amis pour maintenir l'État de droit et l'ordre contre les mouvements de guérilla radicaux. Soutenir les dirigeants et partis anticommunistes au Guatemala, au Honduras, au Salvador et au Panama constituera une stratégie responsable pour maintenir l'influence des manières suivantes :\n\n1. Fournir un soutien diplomatique garantira à ces pays une légitimité adéquate et le soutien d'une superpuissance, ainsi que la capacité de recevoir une aide économique et un soutien international supplémentaire au sein d'organisations telles que l'ONU. Cela renforcera les liens commerciaux et garantira le succès continu de ces pays.\n\n2. Le soutien du Pentagone en matière de défense garantira que ces pays recevront des équipements dans le cadre du Programme d'assistance militaire (MAP), conformément aux autres États anticommunistes. Notre analyse a conclu que leurs capacités militaires ont encore des années de retard sur celles de nombreuses armées européennes, mais que les équipements destinés aux opérations anti-insurrectionnelles leur seront utiles.\n\n3. Enfin, un soutien secret sous forme de partage de renseignements, d'intégration d'agents de la CIA, de formation et d'accords de base permettra à nos agents et aux agents du renseignement de ces pays de coordonner correctement leurs ressources et leurs opérations afin de déterminer les emplacements des cellules communistes et les méthodes d'attaque.\n\nLe Bureau espère sincèrement que ces trois volets serviront de stratégie de défense principale pour maintenir l'influence américaine et empêcher l'influence soviétique et cubaine dans la région latino-américaine."
 CIA_LATAMb.4.d:0 "Apparemment, dans le cadre d'une nouvelle pression du gouvernement américain pour maintenir son influence dans la région et chasser les incursions communistes et les groupes rebelles, les États-Unis ont annoncé un programme de soutien élargi aux pays anticommunistes d'Amérique centrale, notamment le Guatemala, le Honduras, le Salvador et le Panama.\n\nCe soutien, réitéré par les ambassades américaines dans chaque pays et par Foggy Bottom, consiste principalement en un soutien à la défense sous la forme de ventes d'armes et de formation de troupes dans le cadre du Programme d'assistance militaire (MAP). En outre, les relations diplomatiques devraient être renforcées et une aide économique et au développement sera envoyée à chacun des pays.\n\nLes réactions à cette annonce ont été mitigées, la plupart des responsables gouvernementaux étant heureux que leurs suzerains américains continuent de les soutenir quelles que soient leurs actions"
 CIA_LATAMb.5.d:0 "UTILISATIONS POSSIBLES DES CARTELS DE LA DROGUE : EN BREF\nBureau d'analyse latino-américaine, Direction du renseignement ; Bureau des Affaires Drogues, Direction des Opérations\nSECRET/NOFORN\n\nLa présence et l'influence des cartels de la drogue, des syndicats du crime organisé axés sur le trafic de drogues telles que la marijuana, l'héroïne et la cocaïne, en Amérique latine et centrale s'avèrent un défi dans la situation géopolitique multipolaire de la région. Les organisations de cartels, telles que le cartel de Medellin en Colombie, les cartels de Guadalajara et du Golfe au Mexique, ainsi que d'autres organisations plus petites dans toute la région, disposent d'un pouvoir et d'une influence immenses, ainsi que de financements et d'armes.\n\nNotre analyse a déterminé que ces cartels semblent être de nature anticommuniste, bien qu'ils soient politiquement et idéologiquement malléables ; la première priorité de ces organisations est de produire et de trafiquer de la drogue, quelle que soit l'affiliation politique de leurs acheteurs. Certains analystes ont émis l'hypothèse que de nombreux membres du cartel, aux échelons inférieurs, pourraient être d'anciens guérilleros mécontents qui souhaitent un changement dans leur vie et plus d'argent.\n\nCe Bureau estime que les cartels mentionnés ci-dessus se trouvent dans une position financière et idéologique leur permettant d'être utilisés au profit politique des États-Unis et de leurs intérêts en Amérique latine. Cela pourrait prendre la forme suivante :\n\n1. Les actifs américains pourraient contribuer à la contrebande et à d'autres opérations de trafic de stupéfiants dans la région, en mettant particulièrement l'accent sur l'aide aux grands cartels au Mexique et en Colombie. Cela rapporterait davantage de revenus aux cartels, garantirait que leurs livraisons ne soient pas interdites et donnerait la légitimité au fait qu'ils sont soutenus par une puissance majeure.\n\n2. Des moyens américains pourraient également aider l'organisation connue sous le nom de Muerte a Secuestradores (MAS), un paramilitaire colombien connu pour être déjà financé par les cartels et qui a mené de nombreuses opérations de contre-insurrection contre les mouvements communistes FARC et M-19 en Colombie.\n\n3. Le personnel du renseignement américain pourrait également envisager certaines opérations intérieures limitées, notamment l'obstruction ou l'interférence de toute autre manière dans les enquêtes du FBI et de la DEA sur le trafic de drogue, en particulier si elles ciblent les membres du cartel soutenus par les États-Unis."
 CIA_LATAMb.6.d:0 "Steve Wilkins se penchait sur son camion de deux tonnes et demie, fumant une cigarette tout en regardant les hommes, à moins de 100 pieds de lui, décharger un petit Cessna 182 Skylane qui venait d'être éteint et garé. Il regarda autour de lui, dans la jungle nicaraguayenne, à plus d'une douzaine de kilomètres de n'importe où, puis remarqua les trois rebelles armés, rien ne les distinguant davantage que les fusils de combat FN FAL qu'ils portaient.\n\nTout en continuant à fumer, il a vu les Contras décharger l'avion déplacer des briques et des briques de cocaïne, de la « neige », dans son camion, les cachant au fond ou dans des caisses d'autres marchandises marquées comme « aide humanitaire ». Il fit un signe de tête aux hommes, qui hochèrent la tête en retour ; confus quant à ce qu'ils faisaient, ils le verraient bien assez tôt lorsque l'argent commencerait à affluer.\n\nAlors qu'ils terminaient, il sourit, se tournant vers le commandant en chef de l'unité Contra locale, lui glissant quelques cordobas avant de monter dans le camion et de commencer son voyage, quoique court, mais plutôt dangereux, vers la côte.\n\nUn peu plus d'une heure après son départ, Wilkins, nom de code « SKI LIFT » avait atteint son point de rendez-vous ; un petit village de pêcheurs, dont il n'a jamais appris le nom, sur la côte atlantique du pays. Là, il aperçut ce qui semblait être un petit crevettier, rouillé, camouflé dans la végétation proche de l'eau. S'approchant, il en descendit, prenant une gorgée d'eau avant d'en allumer une autre, en attendant que le pilote du bateau vienne à terre.\n\nIl ne connaissait pas le nom du pilote et n'aurait probablement pas voulu le savoir si la situation s'était présentée. Serrant la main de l'homme à la peau considérablement bronzée, ils commencèrent à charger les briques dans le bateau, trois ou quatre à la fois. Il a fallu quelques voyages, il s'agissait d'une cargaison plus importante, mais les deux ont réussi et se sont rapidement rallumés, se serrant la main, avant que le pilote ne monte dans son bateau, ne le démarre et ne commence à se diriger vers Miami.\n\nSteve restait debout, regardant, écrasant le mégot de sa cigarette. Cela avait été un long déploiement, mais tout ce que Langley voulait, il l'a obtenu. Au moins, c'était une mission assez routinière."
 CIA_LATAMb.7.d:0 "Nos efforts pour introduire clandestinement de plus en plus grandes quantités de cocaïne aux États-Unis et dans toute la région ont été aidés aujourd'hui par l'aide d'agents américains de la CIA, qui ont été déployés dans nos bastions du Nicaragua pour aider au transport de la drogue à travers les frontières, ainsi qu'à la production de cocaïne et à la protection des installations contre les incursions du FSLN et les actions de lutte contre la drogue.\n\nIl semble que les Américains nous aident avant tout pour que nous puissions obtenir nous-mêmes des financements pour nos armes et nos opérations, au lieu de dépendre d'eux pour des financements secrets. Leurs opérations se déroulent bien, mais on ne sait pas combien de temps cela va durer, en particulier parce que l'aide qui nous est apportée, notamment en matière de médicaments, est considérée comme impopulaire parmi les responsables du Congrès et de l'administration."
 CIA_LATAMb.8.d:0 "Oscar Danilo Blandon était assis dans sa camionnette, dans le centre-sud de Los Angeles, attendant. C'était une journée d'été calme et, alors qu'il était assis, il réfléchissait à la distance parcourue par sa cargaison depuis son lieu de fabrication. Cultivé et raffiné en Colombie, introduit en contrebande par avion vers le nord du Nicaragua par Contra Connections, transporté à travers le pays, sur un crevettier, expédié à Miami et acheminé via une camionnette banalisée vers une camionnette banalisée jusqu'à Los Angeles, où il l'a récupéré.\n\nIl attendait son partenaire, Ricky Ross. Noir originaire de ce quartier particulier de Los Angeles, Blandon avait appris que Ross était le seul trafiquant de drogue de la ville à avoir contacté les Colombiens. C'était génial. Blandon a dû compter à nouveau, mais il a estimé qu'il y avait quelques millions de dollars de cocaïne dans le dos. Une jolie petite somme pour aider ses camarades du Nicaragua, qui combattent les salauds de communistes.\n\nRoss s'est approché et a serré la main de Blandon alors qu'il sortait de la camionnette. Ils étaient assis devant un parc, qui était vide pour le moment ; Dieu merci pour cela, pensèrent-ils tous les deux. Blandon ouvrit l'arrière de la camionnette et tous deux montèrent en fermant la porte. Ils ont dû faire vite, avant qu'une voiture de patrouille \"noir et blanc\" du LAPD n'arrive.\n\n\"Putain de merde, mec !\" » murmura Ross en voyant les briques et les briques de cocaïne. Blandon hocha la tête. \"C'est deux ou trois millions de dollars là-bas, si je devais deviner. Le Cartel a fait un plus gros lot cette fois.\"\n\nRoss sourit. \" Bien, mec, bien. Allons rapporter ça chez moi, j'appellerai mes revendeurs et nous pourrons y aller. Je suis vraiment excité par ça, et je pense que tous mes acheteurs trouveront ça génial. Au fait, où va l'argent ? Retour au Cartel ? \"\n\nBlandon baissa les yeux sur les briques puis se releva. \"Si je vous le dis, est-ce que cela affectera notre accord ?\"\nRoss regarda autour de lui. \"Non ? Les drogues sont des drogues. J'étais juste curieux.\"\n\"Les Contras. Des combattants de la liberté au Nicaragua, luttant contre le régime communiste tyrannique. L'argent leur va pour les armes et les opérations.\"\n\nRoss hocha la tête. \"Bien.\""
 CIA_LATAMb.9.d:0 "\"C'est quoi ce bordel, ce mémo ?\" La secrétaire devant le bureau du DDO grimaça en entendant son patron crier. Bien que ce ne soit pas un spectacle rare, elle a rassemblé son courage et est entrée.\n\n\"Monsieur, ce mémo vient de la DDI et du Bureau Amérique Latine. Apparemment, ils trouvent prudent d'envisager la distribution de drogue ici, afin de financer les Contras.\"\n\n\"Donnez-moi le DDI au téléphone maintenant ! Putain !\"\n\n\"Oui Monsieur.\" Elle ne l'avait jamais vu aussi furieux, mais elle a réussi à joindre le bureau du DDI, qui se trouvait à proximité mais pas à proximité du DDO, au septième étage de Langley.\n\n« Bureau du directeur adjoint du renseignement. Qui est-ce ?\n\"TU SAIS TRÈS BIEN QUI C'EST !! METS TON PATRON EN LIGNE !\"\n\"Oui Monsieur.\" Il y a eu un déclic, puis la DDI a décroché. \"Oui?\"\n\"C'est quoi ce putain de mémo que je suis en train de lire ?\"\n\"Eh bien, voilà à quoi cela ressemble. Nos analystes ont examiné la situation et sont arrivés à la conclusion qu'aider les Contras à distribuer leur cocaïne aux États-Unis et dans d'autres États leur rapportera suffisamment de financement et d'influence pour devenir plus autosuffisants qu'ils ne le sont actuellement.\"\n\"Es-tu foutu, putain ? Tu sais que si jamais ça sort, la DEA va me foutre en l'air, le FBI va me baiser, moi et la Colline ? Ils nous crucifieraient ! Vous m'entendez ?!\"\n\n\"Le Congrès pourrait y réfléchir à deux fois lorsque les Contras reprendront leur pays aux sandinistes.\"\n\n\"Assez. Les opérations ne donnent pas le feu vert. Mettez-y fin. Nous avons terminé ici.\"\nCliquez.\n\nLa secrétaire se tourna lentement, essayant d'évaluer l'humeur du DDO. Il semblait toujours en colère, mais la pièce était étrangement calme."
 CIA_LATAMb.10.d:0 "Alors que les membres du bureau Amérique latine se réunissaient pour leur réunion hebdomadaire, ils s'installaient avec du café et des pâtisseries, en prenant soin de ne pas tacher les dossiers qu'ils avaient sur la table de conférence.\n\n\"Eh bien, j'ai étudié un nouveau groupe qui circule en Colombie\", a déclaré Jim, l'analyste spécialisé dans le conflit colombien. \"Ils s'appellent Muerte a Secuestradores, ou \"Mort aux ravisseurs\". Le directeur du bureau hocha la tête, le laissant continuer.\n\n\"Le MAS semble avoir été formé et fondé par les principaux cartels de la drogue en Colombie, y compris le grand cartel de Medellín dirigé par Pablo Escobar. Leur mission principale n'est pas offensive, mais de nature défensive, protégeant les biens du cartel et des grands propriétaires terriens ainsi que empêchant les tentatives d'enlèvement par d'autres paramilitaires. D'autres bailleurs de fonds majeurs semblent être l'armée colombienne et, curieusement, Texaco, basée ici aux États-Unis. »\n\nLe directeur du bureau hocha la tête. \"Je vois. Donc ce MAS. Quelle place occupent-ils dans notre politique ? »\n\n\"Eh bien, monsieur, MAS présente l'opportunité idéale de s'impliquer en Colombie sans engager trop de ressources. Ce sont des anticommunistes convaincus, ayant mené des opérations contre les FARC et le M-19, les principaux groupes de guérilla communiste en Colombie ; ils sont liés aux cartels de la drogue, en particulier au cartel de Medellín, ce qui permet aux actifs américains de contacter directement le cartel et de lancer d'autres opérations. »\n\n\"Intéressant, Jim. Donnez-moi votre rapport et je le transmettrai à toute la chaîne, nous envisagerons de soutenir MAS. Cela devrait être assez facile."
 CIA_LATAMb.11.d:0 "Des sources au sein de l'armée et des services de renseignement colombiens rapportent que les États-Unis ont commencé à soutenir secrètement le groupe paramilitaire fondé par le cartel et connu sous le nom de Muerte a Secuestradores (MAS), ou « Mort aux ravisseurs ». Fondé par le cartel de Medellin et assisté par certaines unités de l'armée colombienne, le MAS a été formé pour protéger le cartel et les propriétés des propriétaires fonciers en tant que groupe de défense ainsi que pour empêcher les enlèvements de membres du cartel.\n\nLes Américains ne nous ont pas informés de cette évolution, peut-être parce qu'ils soupçonnaient que nous avions l'intention de poursuivre les cartels. L'ambassadeur américain à Bogota n'a fait aucun commentaire, mais nous avons demandé au chef de station de la CIA de se présenter pour informer nos responsables du renseignement. Il n'est pas clair si cela se produira réellement."
 CIA_LATAMb.12.d:0 "Alors que Bob était assis à l'arrière d'une Chevrolet Caprice indéfinissable, traversant des routes rurales, une jeep devant, il réfléchissait à ce dans quoi il s'embarquait. Après ce qui semblait être des semaines de recherches et d'enquêtes via des agents et des informateurs, le chef de station de la CIA à Bogota l'avait chargé de rencontrer le chef du cartel de Medellín, nul autre que le tristement célèbre Pablo Escobar, dans l'une de ses villas de la campagne colombienne.\n\nIl était nerveux mais savait que rien de grave ne se produirait probablement. Lui et Escobar savaient déjà ce qui allait se passer, et le Cartel ne lui ferait sûrement rien, à moins qu'ils ne veuillent inviter une grande puissance de feu américaine et le démantèlement de leur organisation.\n\nArrivé à la villa d'Escobar, il est sorti de la voiture et a été immédiatement fouillé (à nouveau) par deux des lieutenants d'Escobar, tandis que quelques autres regardaient à différentes distances, portant des fusils automatiques. Bob n'était bien sûr pas armé, mais ils devaient vérifier encore et encore.\n\n\"Bonsoir, Senor Escobar\", dit Bob après avoir été fouillé et escorté dans la villa, où Pablo était assis avec quelques lieutenants et d'autres personnalités du cartel.\n\n\"Bienvenue dans la vraie Colombie...\" Escobar tendit la main et fit une pause.\n\n\"C'est Bob, Senor Escobar. Très heureux de pouvoir enfin vous rencontrer. Je suis sûr que vous savez de quoi il s'agit.\" Ils se serrèrent la main.\n\n\"Oui, Bob. Certains de mes lieutenants m'ont dit que votre CIA souhaitait élargir sa collaboration avec nous et contribuer à la lutte contre le trafic. Je suis intéressé mais réticent ; comment pouvez-vous nous aider ?\n\n\"Eh bien, Senor Escobar, nous proposons d'aider aux opérations de trafic du cartel, principalement en le dirigeant via Miami et à travers la frontière mexicaine vers les États-Unis. Il y a beaucoup de villes américaines qui découvrent tout juste votre cocaïne et c'est un grand marché, en particulier à Los Angeles. Les fonds que vous gagnerez retourneront ici pour soutenir votre cartel et le conflit en cours en Colombie, ainsi que des fonds pour les Contras au Nicaragua, qui font la même chose.\"\n\n\"Je vois.\" Escobar fit une pause, prenant un moment de réflexion avant de verser deux verres d'aguardiente, une liqueur locale. \"Je devrai en discuter davantage avec mes trafiquants, mais j'aime cette idée. Je pense que nous avons des idées et des objectifs similaires et, si votre CIA parvient à me débarrasser du gouvernement colombien, nous sommes en affaires.\"\n\n\"Oui, je crois que nous pouvons le faire.\" Bob, voyant qu'Escobar faisait de même, prit un verre et le fit tinter devant celui de Pablo pendant qu'ils portaient un toast, marquant ainsi l'affaire comme conclue. \"Pour plus d'argent pour la cause !"
 CIA_LATAMb.13.d:0 "OPÉRATION JUNGLE NEIGE : OPLAN\nQuartier général du Commandement Sud des États-Unis\n\nVous trouverez ci-dessous les ordres des unités subordonnées ou rattachées au Commandement Sud des États-Unis en ce qui concerne les opérations en Colombie, en se concentrant spécifiquement sur le ciblage des dirigeants du cartel dans le pays.\n\n1. Les 1er et 2e bataillons du 7e groupe de forces spéciales des forces spéciales de l'armée américaine, basés à Fort Gulick, au Panama, doivent se déployer en Colombie, en particulier à Bogota et dans la ville de Medellin, et sont autorisés à mener des frappes contre les biens et les individus associés au cartel de Medellin, au cartel de Cali et à d'autres cartels en Colombie. En particulier, les unités ci-dessus sont autorisées et ordonnées de cibler Pablo Escobar, le chef du cartel de Medellín, dans leurs opérations.\n\n2. Les unités du 210e bataillon d'aviation de combat de l'armée américaine, basées à Fort Kobbe, au Panama, doivent être déployées en Colombie avec les 1er et 2e BN et sont autorisées à fournir des services de transport, de frappe et d'interdiction à l'aide d'hélicoptères UH-1 Huey et CH-47 Chinook aux unités au sol.\n\n3. Les agents de la Central Intelligence Agency, situés à [REDACTED], doivent aider à fournir des renseignements et un soutien au ciblage des unités du 7e Groupe SF et du 210e Avn BN. Tous les ordres de ciblage doivent être autorisés individuellement par le commandant opérationnel, qui sera le commandant de la 193e brigade d'infanterie (Panama).\n\nL'USSOUTHCOM maintiendra sa préparation opérationnelle au cas où la situation s'aggraverait, attendra des rapports quotidiens du commandant opérationnel et la plus grande coopération avec la CIA et les autres officiers de soutien du renseignement.\n\nSIGNÉ\nCommandant du Commandement Sud des États-Unis"
 CIA_LATAMb.14.d:0 "MANUEL NORIEGA ET NOS RELATIONS : LE POINT\nBureau Panama, Bureau d'analyse de l'Amérique latine, Direction du renseignement\nSECRET/NOFORN\n\nDepuis que les États-Unis ont continué à soutenir le général Manuel Noriega, les circonstances ont changé et la communauté du renseignement américain pourrait reconsidérer l'utilité de Noreiga pour maintenir l'influence américaine en Amérique centrale et latine.\n\nMême si le général Noriega a grandement contribué à la politique de sécurité américaine en Amérique latine, son comportement constitue indéniablement un handicap pour l'influence américaine dans la région. En particulier, les liens possibles de Noriega avec le crime organisé, les cartels et le trafic de drogue et de cocaïne constituent une préoccupation et un développement important pour les futures relations entre les États-Unis et le Panama.\n\nSelon les agents et les forces de l'ordre qui ont suivi les activités de Noriega, celui-ci est impliqué dans le trafic de cocaïne depuis le début de la décennie, utilisant des réseaux de transport secrets également utilisés par la CIA pour envoyer des fonds et des armes aux mouvements anticommunistes de la région. Le réseau de Noreiga s'étend principalement de Miami, où il s'étend ensuite au reste des États-Unis. Le personnel du FBI et de la DEA le confirment mais sont incapables de prendre des mesures punitives contre Noriega et son gouvernement.\n\nEn outre, la CIA confirme que des personnalités de l'opposition au Panama, telles que Hugo Spadafora et le colonel Roberto Diaz Herrera, ont également connaissance des opérations de trafic de drogue de Noriega et ont tenté de les découvrir dans les médias populaires panaméens. Le gouvernement de Noriega n'a pas apprécié cette situation et Spadafora est sans nouvelles depuis plusieurs jours, ce qui indique qu'il pourrait avoir été tué ou arrêté. Aucun des deux hommes n'a été considéré auparavant comme une menace pour l'État et n'est pas d'idéologie politique de gauche ; en fait, tous deux ont servi sous le gouvernement de Torrijos.\n\nCe Bureau recommande par la présente une évaluation sérieuse de l'utilité de Noriega pour les intérêts américains en Amérique latine ; Si les allégations de trafic de drogue sont vraies, ce qui semble étayé, il est fortement encouragé que les États-Unis rompent leurs liens avec Noriega et envisagent de prendre des mesures punitives à l'égard du Panama, notamment en gelant tous les programmes d'aide, les expéditions d'armes, les transferts secrets, l'assistance et en renforçant les opérations d'interdiction des drogues jusqu'à ce que le régime puisse être stabilisé."
 CIA_LATAMb.15.d:0 "C'était un lundi matin ensoleillé dans l'Ovale, alors que le directeur de la CIA [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] entraient dans la salle pour leur briefing quotidien. Aujourd'hui, ce serait juste un briefing ordinaire, mais avec un nouveau point à l'ordre du jour : le général Manuel Noriega du Panama.\n\n\"Bonjour, messieurs. J'espère que nous allons bien à Langley ?\" Le président [USA.GetLeader] leva les yeux en souriant.\n\n\"Oui, monsieur, tout va bien là-bas. Voici votre brief quotidien pour aujourd'hui.\" Le conseiller à la sécurité nationale a déposé le PDB sur le bureau.\n\n\"Super. Quelle est la première chose à l'ordre du jour ?\"\n\n\"Panama, monsieur. La CIA a reconsidéré l'efficacité et l'utilité de maintenir le général Manuel Noriega dans notre sphère d'influence et d'aider son régime. Il y a des allégations selon lesquelles il mènerait des opérations de trafic de drogue au Panama et transporterait de la cocaïne entre la Colombie et Miami. Il aurait également persécuté d'anciens alliés qui avaient tenté de découvrir les opérations de trafic de drogue, et Langley s'inquiète des effets possibles que cela pourrait avoir.\"\n\n\"Je vois, qu'est-ce que tu veux dire?\" Le président hocha la tête, réfléchissant.\n\"Le Congrès pourrait prendre du vent, et ce n'est jamais bon. Nous risquons de perdre le soutien international dans d'autres endroits si nous ne réagissons pas rapidement.\"\n\n\"Qui se soucie du Congrès ? Je dis que nous devons garder Noriega à nos côtés.\" Le président avait passé les dernières minutes à lire le mémoire devant lui, qui mettait en évidence l'aide de Noriega dans les questions de sécurité en Amérique latine.\n\n\"Considérez ceci, messieurs. Nous soutenons Noriega depuis des années, il a été très amical avec nous ; nous lui avons fourni, ainsi qu'à ses militaires, des armes d'une valeur de plusieurs millions de dollars dans leur lutte contre les forces communistes dans leur nord ; et Directeur, depuis combien de temps ce trafic dure-t-il ?\"\n\n\"Depuis des années, monsieur. Du moins depuis qu'il a officiellement pris ses fonctions.\"\n\n\"Alors pourquoi tout cela est-il révélé maintenant ? Je ne vois aucune raison pour laquelle nous devons couper le cordon maintenant. Faire cela ne ferait qu'aggraver notre situation en Amérique latine. Il est un atout.\"\n\n\"Oui Monsieur.\" Les deux hommes ont répondu. Le directeur leva les yeux. \"Monsieur, nous pouvons faire une déclaration confidentielle aux Panaméens via leur armée ou la CIA, pour les rassurer sur notre soutien continu.\"\n\nLe président hocha la tête. \"Oui, ça a l'air bien.\" Il regarda autour de lui. \"Quelle est la prochaine étape à l'ordre du jour ?\""
 CIA_LATAMb.16.d:0 "Selon des rapports non officiels provenant de responsables diplomatiques à Washington, ainsi que de sources au sein de l'ambassade américaine à Panama City, les États-Unis continueront à soutenir le gouvernement de Manuel Noriega, malgré une opposition plutôt virulente qui remettait en question son utilité dans la politique étrangère américaine, en raison de son passé en matière de trafic de drogue illicite, ainsi que d'autres allégations.\n\nDepuis des semaines, de hauts responsables du renseignement américain se demandent s'il faut ou non maintenir son soutien à Noriega, d'autant plus que les conflits en Colombie et au Nicaragua continuent de faire rage. Notre gouvernement n'a pas encore réagi, même si la seule réponse publique devrait être une réponse d'optimisme et de soutien continu. Mais dans l'ombre, il est impératif de contacter les Américains et de leur demander les raisons de leurs réticences."
 CIA_LATAMb.17.d:0 "C'était un lundi matin ensoleillé dans l'Ovale, alors que le directeur de la CIA [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] entraient dans la salle pour leur briefing quotidien. Aujourd'hui, ce serait juste un briefing ordinaire, mais avec un nouveau point à l'ordre du jour : le général Manuel Noriega du Panama.\n\n\"Bonjour, messieurs. J'espère que nous allons bien à Langley ?\" Le président [USA.GetLeader] leva les yeux en souriant.\n\n\"Oui, monsieur, tout va bien là-bas. Voici votre brief quotidien pour aujourd'hui.\" Le conseiller à la sécurité nationale a déposé le PDB sur le bureau.\n\n\"Super. Quelle est la première chose à l'ordre du jour ?\"\n\n\"Panama, monsieur. La CIA a reconsidéré l'efficacité et l'utilité de maintenir le général Manuel Noriega dans notre sphère d'influence et d'aider son régime. Il y a des allégations selon lesquelles il mènerait des opérations de trafic de drogue au Panama et transporterait de la cocaïne entre la Colombie et Miami. Il aurait également persécuté d'anciens alliés qui avaient tenté de découvrir les opérations de trafic de drogue, et Langley s'inquiète des effets possibles que cela pourrait avoir.\"\n\n\"Je vois, qu'est-ce que tu veux dire?\" Le président hocha la tête, réfléchissant.\n\n\"Le Congrès pourrait prendre du vent, et ce n'est jamais bon. Nous risquons de perdre le soutien international dans d'autres endroits si nous ne réagissons pas rapidement.\"\n\n\"Très bien. J'en suis convaincu. Il est temps de le retirer de la masse salariale. Appelez le secrétaire d'État, je veux que l'ambassadeur à Panama City téléphone également bientôt. Appelez le NSC. Directeur, je veux que vous démarriez des opérations à Langley pour mettre fin à l'aide et retirer nos agents, ceux qui l'assistent, de là. Nous devons être rapides à ce sujet, faire comme si nous n'étions jamais là. \"\n\n\"Oui, Monsieur le Président.\" Le directeur de la CIA et le conseiller à la sécurité nationale hochèrent la tête et allèrent passer quelques appels. Ce serait une longue journée et une nuit encore plus longue."
 CIA_LATAMb.18.d:0 "La ville de Panama a été choquée aujourd'hui lorsque des sources confidentielles de l'ambassade américaine ont rapporté que les États-Unis retiraient leur soutien au gouvernement de Manuel Noriega. Selon de hauts responsables diplomatiques et du renseignement, Washington était de plus en plus préoccupé par l'utilité de Noriega pour la politique étrangère américaine, ainsi que par son comportement erratique et ses allégations d'implication dans le trafic de drogue illicite entre l'Amérique du Sud et les États-Unis.\n\nNoriega lui-même n'a pas fait de déclaration, car il n'a pas encore été informé de la question ; on s'attend à ce qu'il ne soit pas content. De hauts responsables de la défense et de la diplomatie à Panama City, qui ont déjà été informés, ont indiqué qu'ils prévoyaient d'accélérer le retrait progressif des troupes américaines de la zone du canal, ainsi que d'autres mesures punitives, comme éventuellement déclarer les responsables de l'ambassade comme « persona non grata » et les forcer à partir. On ne sait pas exactement quelle devrait être notre réponse, mais ce n'est pas une bonne chose."
 CIA_LATAMb.19.d:0 "C'était le crépuscule alors qu'un petit convoi discret de fourgonnettes, de camions lourds et de berlines s'approchait du point de contrôle frontalier sur le pont international Paso del Norte, reliant El Paso, au Texas, à Ciudad Juarez, au Mexique. Il y avait peu de circulation et alors que la voiture de tête, une Ford Granada grise et banalisée, s'arrêtait pour inspection, ils remarquèrent qu'il y avait un peu plus de présence policière que d'habitude ; pas du côté américain, mais du côté mexicain. En plus des habituels agents des douanes et des frontières, se trouvaient des Federales, de garde.\n\nLe convoi s'est déplacé sans problème, sans problème, même avec les camions marqués « Arizona Helicopters Inc. » et « Pacific Corporation ». Les gardes-frontières n'ont pas pris la peine d'inspecter la cargaison et n'auraient pas aimé ce qu'ils ont vu. Des centaines de fusils automatiques, des milliers de cartouches, des lance-roquettes antichar M72, quelques Stinger ; ils devraient former les hommes à ce sujet, mais pas de problème. Les plus gros camions contenaient quelques hélicoptères utilitaires, complètement démontés, avec leurs supports de canons prêts à l'action. L'un des agents avait déclaré qu'il y avait un Cessna quelque part, apparemment caché.\n\nAprès quelques heures de route au sud de Ciudad Juarez, le convoi s'est approché de sa destination ; l'une des bases centrales du cartel de Guadalajara, dans l'État de Chihuahua. Ils dispenseraient la formation ici, puis le Cartel distribuerait l'équipement sur tout leur territoire.\n\nL'agent est sorti de la voiture de tête, allumant une cigarette tout en regardant passer les camions, menant au parking principal de l'enceinte. Ce serait une longue période de déploiement, et tous ses agents le savaient. Le cartel serait formé parce qu'il était important pour le gouvernement américain, mais savoir s'il serait coopératif était une autre histoire. Après tout, ce sont des criminels aux yeux des gens normaux. Mais personne ici n'était une personne normale."
 CIA_LATAMb.20.d:0 "Les rapports de la Direction fédérale de la sécurité et du Secrétariat de l'intérieur semblent indiquer que les principaux dirigeants des cartels au Mexique, y compris les dirigeants des cartels de Guadalajara et du Golfe, semblent avoir reçu de nouvelles armes et équipements de protection de marque et de modèle américains. Les agents du DFS ont surveillé les propriétés du cartel avec l'aide d'unités de l'armée mexicaine et de la police fédérale et ont déterminé que de nouveaux équipements fabriqués aux États-Unis, apparemment reçus d'une société américaine appelée « Arizona Helicopters Inc. » a été livré aux unités du cartel ; y compris des armes légères, des mitrailleuses lourdes, des camionnettes blindées et quelques anciens hélicoptères UH-1 Huey et avions Cessna.\n\nLe président [MEX.GetLeader] serait furieux de cette évolution, en particulier face aux relations mitigées qu'entretiennent le Mexique et les États-Unis. Certains hauts responsables du gouvernement s'étonnent de la raison pour laquelle les cartels seraient protégés, en particulier contre les opérations de répression menées par le Mexique, un allié des États-Unis, apparemment. On ne sait pas exactement pourquoi et l'ambassade américaine à Mexico n'a été en mesure de répondre à aucune question à ce sujet. Le temps nous le dira."
 CIA_LATAMb.21.d:0 "Alors que le groupe de travail conjoint FBI-DEA s'asseyait pour leur réunion, un matin ensoleillé à El Paso, au Texas, ils avaient l'air extrêmement sérieux. Ce n'était pas la première réunion ; juste un point de situation régulier pour les deux agences.\n\nLes agents de la DEA ont commencé par leur présentation. \"Notre enquête sur les activités locales du cartel a donné des résultats significatifs. La connexion transfrontalière entre El Paso et Ciudad Juarez est plutôt importante ; bien que les transferts de drogue du Mexique vers le Texas soient de nature à petite échelle ; généralement de petites quantités, quelques livres ou deux, via des véhicules personnels. La DEA et l'ELPD n'ont pas vu de grandes quantités de drogue de plus de 5 livres. L'activité du cartel à El Paso a été quelque peu limitée ; nous savons qu'il y a des membres qui sont des ressortissants américains du côté américain de la frontière qui opèrent en tant que chefs régionaux et intermédiaires ; cependant, nous n'avons pas encore réussi à les connecter. »\n\nLes agents du FBI acquiescèrent. \"Très bien. Nous savons qu'il y a de grandes quantités de cocaïne provenant des villes frontalières, notamment d'El Paso, ainsi que d'Albuquerque, de San Diego et de Laredo. Le FBI a identifié deux trafiquants à Los Angeles qui reçoivent d'importantes expéditions de cocaïne des cartels colombiens, mais nous ne savons pas vraiment où. Nous pourrions envisager de déposer des mandats fédéraux pour écoute et autres opérations de surveillance. \"\n\nAvant qu'il puisse continuer, une secrétaire entra. \"Agent spécial, il y a un appel pour vous.\"\n\nIl sortit de la salle de conférence et se dirigea vers son bureau pour prendre l'appel.\n\"Bonjour?\"\n\"Est-ce l'agent spécial Jack Smith ?\"\n\"Oui, qui est-ce ?\"\n\n\"Ce n'est pas important. Tout ce que vous devez savoir, c'est que nous, à Langley, sommes au courant de votre enquête sur les cartels colombiens. Nous connaissons les juges à qui vous devez parler. Nous savons qui vous enquêtez, et cela doit cesser maintenant. Continuez et vous apprendrez à vos dépens à ne pas jouer avec les cartels. \"\nCliquez."
 CIA_LATAMb.22.d:0 "Sous la pluie de New York, Vincent Gigante regardait les toits de Manhattan. Il y avait un autre homme assis dans son bureau ; Des origines italiennes, certes, mais pas « d'ici ». Il avait l'air et se comportait comme un de ces fédéraux pourris. Chef de la famille Genovese, l'une des cinq grandes familles mafieuses de New York, il avait reçu la visite de cet homme avec une proposition : la grande tragédie du Nicaragua et comment sa famille pourrait en profiter. Il y avait sûrement beaucoup d'émigrés nicaraguayens à New York, n'est-ce pas ?\n\nÀ des milliers de kilomètres au sud, sous le soleil de Miami, en Floride, Jose Miguel Battle Sr. Avait été approché par trois hommes similaires. Ses collègues, tous anciens soldats de la Brigade 2506, ayant survécu à l'invasion avortée de la Baie des Cochons, sont tous ici pour la même raison. La Corporation, comme on l'appelait à Miami, la Mafia cubaine, comme on l'appelait également, pouvait avoir une grande solidarité avec ce groupe anticommuniste du Nicaragua connu sous le nom de Contras. Ou c'est du moins ce qu'ils prétendaient.\n\nToujours dans un endroit réputé pour son soleil, le sud de la Californie, des membres de la mafia mexicaine ont été contactés. Certains étaient en prison, d'autres non, mais cela n'avait pas d'importance. Les hommes en noir de Langley avaient leur manière de faire. La Californie était un excellent point de transbordement pour la cocaïne, tout comme Miami, et la mafia mexicaine avait une grande influence là-bas et de l'autre côté de la frontière, à Tijuana.\n\n Les hommes de Langley avaient tous un but. Les organisations criminelles jouissaient d'une grande influence aux États-Unis, en particulier dans les zones urbaines où le trafic de drogue et la criminalité étaient élevés. Ils devaient sûrement avoir l'argent, les armes et les ressources à envoyer à leurs frères d'armes au Nicaragua, n'est-ce pas ?"
 CIA_LATAMb.23.d:0 "D'autres nouvelles sont venues des agents de la CIA qui nous assistent ; Langley a apparemment demandé à ses agents de rallier le soutien à la cause Contra parmi les groupes du crime organisé aux États-Unis. Bien que cela ne soit pas précis, la CIA nous a informés que la communauté criminelle cubaine exilée à Miami, centrée autour de Jose Miguel Battle Sr, un vétéran de la Baie des Cochons lui-même, s'est engagée à nous soutenir ; ainsi que la mafia mexicaine, située autour de la frontière américano-mexicaine ainsi qu'en Californie du Sud. De plus, deux des cinq familles mafieuses éminentes de la ville de New York ont également promis leur soutien à notre cause et sont prêtes à transférer des fonds, certains membres de la mafia et des armes aux Contras pour soutenir notre mission.\n\nBeaucoup au sein de notre organisation sont heureux d'entendre cette évolution, en particulier le soutien de la mafia cubaine. D'autres semblent réticents à l'égard de cette évolution, s'inquiétant du manque de légitimité de ces groupes criminels par rapport à un État souverain comme les États-Unis."

 # LATAM Fight for Self-Determination (Route C)
 CIA_LATAMc.0.d:0 "C'était une matinée couverte et brumeuse dans le bureau ovale alors que le président [USA.GetLeader] était assis, regardant son secrétaire d'État [GetCurrentSecState], le directeur du renseignement central [GetCurrentCIADir], le conseiller à la sécurité nationale [GetCurrentNatSecAdv] et leur rafale d'assistants entrer dans la pièce, avec des dossiers et des papiers apparemment volant partout. Le président a attendu que le chaos se calme avant d'ouvrir la salle. \"Messieurs, pourquoi sommes-nous ici aujourd'hui ?\"\n\n» Commença le secrétaire d'État. \"Eh bien, Monsieur le Président, l'État a eu plusieurs réunions avec des responsables de la CIA et de la défense au sujet de l'avenir de la politique américaine en Amérique centrale et en Amérique du Sud. Dans le passé, les États-Unis ont fait un mauvais pas dans cette région, et nous cherchons à changer cela.\"\n\n\"Allez, Monsieur le Secrétaire. Je suppose que cela signifie une stratégie plus pacifique comme je l'ai mentionné dans mes positions en matière de politique étrangère.\"\n\n\"Oui, monsieur. Nous pensons que les États-Unis ont inutilement favorisé des régimes autoritaires de droite en Amérique centrale et en Amérique du Sud dans le cadre d'une tentative malavisée de lutter contre la propagation du communisme dans la région. Bien que cela ait été peu efficace, cela a eu pour effet secondaire malheureux de créer des États militarisés contrôlés par des officiers qui ont des ambitions personnelles, créant ainsi encore plus d'instabilité.\"\n\nLe directeur de la CIA l'interrompit. \" Sans oublier, Monsieur le Président, que cette région est confrontée à un défi majeur en matière de trafic de drogue, quelque chose que notre Agence n'a jamais vu à une telle échelle auparavant. D'importantes expéditions de cocaïne, d'héroïne et de marijuana se déplacent vers le nord depuis la Colombie, expédiées par des cartels et généralement soutenues par des gouvernements de droite. Je sais que votre administration a fait campagne pour mettre fin à la guerre contre la drogue, mais c'est une question internationale à laquelle nous devons prendre part. \"\n\n\"Il est essentiel, Monsieur le Président, de garantir l'autodétermination et l'état de droit en Amérique centrale. Les sociétés démocratiques garantissent une plus grande responsabilité envers toutes les parties impliquées. En particulier, nous aimerions étendre les initiatives de paix au Nicaragua, ainsi que décider de réduire les programmes d'aide en Amérique centrale et de réexaminer notre coopération avec le général Noriega au Panama.\n\n\"Excellent, messieurs. Je fais confiance à vous tous pour faire cela avec le plus haut degré de professionnalisme et me faire rapport de tous les changements. Je m'attends à lire au moins une fois par semaine sur ce sujet.\"\n\n\"Merci, Monsieur le Président.\" Les hommes et leurs assistants hochèrent la tête en signe d'approbation alors qu'ils quittaient la pièce, juste au moment où le soleil commençait à se montrer derrière les nuages, illuminant la pièce."
 CIA_LATAMc.1.d:0 "C'était une nuit chaude dans l'État d'Oaxaca alors que la jeep dévalait la rue poussiéreuse de Tehauntepec. Le conducteur savait exactement où il allait, mais le passager, Ruben Ocampo, n'en était pas si sûr. Tout ce qu'il savait, c'est qu'il devait rencontrer des responsables locaux, comme le disait son mémoire, chez eux ce soir.\n\nOcampo regarda autour de lui, remarquant le quartier qu'il traversait. Ce n'était rien d'extraordinaire, à la périphérie de la ville, malheureusement ce à quoi on s'attend dans ce quartier, avec ces gens. C'était dommage ce qu'on leur avait fait, mais c'était pour ça qu'il était là.\n\nEn sortant de la voiture, le « journaliste d'investigation » a marché dans l'allée, regardant la jeep rouler. Il tenait un cahier à la main, agissant normalement comme toujours. Frappant une fois à la porte, il a été introduit dans la maison, s'asseyant dans la salle à manger, où étaient assis trois hommes et une femme, en costume traditionnel Tehuana. Ces personnes étaient des indigènes zapotèques, dont la plupart vivaient dans la région, mais ils étaient d'importants organisateurs politiques, quoique presque clandestins en raison de l'influence du PRI.\n\nCe qui a été dit n'était pas nécessaire, mais Ocampo les a interrogés sur leur activisme et leur organisation et sur la manière dont les autorités gouvernementales locales les avaient ignorés. Il leur a demandé ce qu'ils pensaient des cartels dans leur région ; ce qu'ils pensaient du mouvement zapatiste grandissant dans leur région et où en étaient eux et leur organisation. Ocampo souriait, hochait la tête et plaisantait ; pour autant qu'ils savaient, il était journaliste d'investigation à La Prensa, un journal de Mexico. Leur conversation n'a pas été longue, mais pas courte et productive.\n\nAlors qu'Ocampo était ramené hors de la maison, chez son chauffeur et de retour à Mexico, il a examiné les notes. Ce serait un long rapport à rédiger, un rapport que, espérons-le, son chef de station à Mexico apprécierait. Les groupes indigènes semblaient anti-gouvernementaux, anti-cartels et pro-communistes. Des trucs intéressants, pensa-t-il."
 CIA_LATAMc.2.d:0 "RÉFORMES POLITIQUES EN AMÉRIQUE CENTRALE\nBureau d'analyse latino-américaine, Direction du renseignement\nSECRET/NOFORN\n\nLa région géopolitique connue sous le nom d'Amérique centrale (qui comprend le Guatemala, le Honduras, le Salvador, le Nicaragua et le Panama) est en proie à des crises politiques continuelles depuis le début de l'après-guerre. Des tentatives de réforme politique ont été proposées et certaines mises en oeuvre, mais la plupart ont échoué en raison de l'ingérence américaine ou communiste. Par conséquent, ce Bureau propose les réformes politiques générales suivantes afin d'améliorer le régime démocratique et le niveau de vie dans la région :\n\n1. Réforme de l'exécutif, sous la forme d'une éventuelle limitation des pouvoirs présidentiels, notamment le pouvoir de déclarer la guerre, de déclarer l'état d'urgence et les pouvoirs relatifs au commandement des unités militaires. Cela nécessiterait très probablement une révision constitutionnelle dans la plupart des États d'Amérique centrale, ce qui nécessiterait la persuasion du corps législatif national.\n\n2. Réforme judiciaire et juridique, sous la forme d'un renforcement des cours suprêmes et des branches judiciaires nationales. Cela peut être accompli en consacrant le contrôle judiciaire des actions constitutionnelles et législatives conçues pour assurer un équilibre entre les actions exécutives et législatives dans ces pays.\n\n3. Enfin, une réforme militaire, sous la forme de l'introduction de contrôles supplémentaires contre les coups d'État militaires, tels que la fourniture d'une direction civile de l'armée, l'interdiction aux officiers militaires de se présenter aux élections et la restriction de l'aide aux militaires centraméricains qui ne respectent pas les réglementations américaines.\n\nCe bureau, ainsi que les ambassades américaines concernées et le Département d'État, estiment que le fait d'encourager ces réformes garantira un style de gouvernement adéquat et l'autodétermination de cette région, sans pouvoirs présidentiels excessifs ni harcèlement de la part des forces communistes."
 CIA_LATAMc.3.d:0 "Une campagne conjointe du Département d'État américain et de la CIA a eu lieu dans notre région, encourageant un vaste programme de réformes politiques dans nos pays. Apparemment, dans le but d'orienter les États d'Amérique centrale vers un modèle de gouvernement américain caractérisé par une démocratie représentative et un républicanisme, l'ambassade américaine a préconisé une réforme des pouvoirs exécutif et judiciaire ainsi que de l'armée ; notamment en limitant le pouvoir du Président de déclarer l'état d'urgence et de combattre les insurrections, ainsi qu'en prévoyant d'éventuels mécanismes de contrôle judiciaire. Enfin, les États-Unis ont proposé des réformes militaires, qui ont suscité la colère de certains membres de notre gouvernement, et qui ont été « conçues pour empêcher de nouveaux coups d'État » qui, en réalité, affaibliront l'influence et la capacité des forces armées à l'avenir si nous choisissons de les accepter.\n\nOn ne sait pas exactement comment notre gouvernement devrait réagir à cette situation. Des réformes sont nécessaires, disent certains, pour démocratiser davantage le pays ; mais d'autres soutiennent que les réformes donneraient plus d'influence aux radicaux des deux ailes à l'intérieur du pays. On craint également, à juste titre, que les réformes militaires n'entraînent une diminution des capacités. Beaucoup soutiennent que les réformes, notamment dictées par les États-Unis, ne sont pas nécessaires, mais peut-être qu'accéder aux exigences de Washington s'avérera bénéfique à long terme. Comment devrions-nous avancer ?"
 CIA_LATAMc.4.d:0 "Des nouvelles sont arrivées de nos ambassades en Amérique centrale selon lesquelles les gouvernements du Salvador, du Nicaragua, du Honduras, du Guatemala et du Panama ont tous accepté, en principe, les réformes politiques suggérées par les chefs de poste, les agents et les responsables du Département d'État de la CIA.\n\nCertaines des réformes politiques, proposées par un groupe de travail conjoint de conseillers politiques de la CIA et de l'État, ont inclus des réformes exécutives afin de réduire la portée excessive du président, une réforme judiciaire sous la forme d'un contrôle judiciaire et de systèmes juridiques à l'américaine, et une réforme militaire sous la forme d'un contrôle civil de l'armée, d'une élimination de la corruption et d'une menace de mettre fin à l'aide du MAP à ces pays.\n\nLangley et Foggy Bottom sont tous deux plutôt surpris que ces pays aient accepté si facilement de telles réformes, mais ils font des progrès immédiats en déterminant des régimes d'application pour garantir que toutes les parties adhèrent aux réformes qu'elles ont promis de mettre en oeuvre."
 CIA_LATAMc.5.d:0 "Malheureusement, nos ambassades en Amérique centrale ont appris que les gouvernements du Salvador, du Nicaragua, du Honduras, du Guatemala et du Panama ont tous rejeté les réformes politiques proposées par les chefs de poste, les agents et les responsables du Département d'État de la CIA.\n\nCertaines des réformes politiques malheureuses, y compris les propositions visant à limiter la portée présidentielle excessive, à introduire un contrôle judiciaire et des systèmes juridiques américains, et à prévoir un contrôle civil de l'armée, ont toutes été fermement rejetées par chaque gouvernement, avec l'accusation de « nouvelles tentatives d'impérialisme de Washington dans nos affaires intérieures ».\n\nLangley et Foggy Bottom sont naturellement furieux de cette évolution, en particulier de la réputation qui perdurera une fois que la presse internationale aura vent de ces développements. Des plans de contrôle des dégâts sont en place, mais ni l'agence, ni le président ne seront satisfaits de cette évolution."
 CIA_LATAMc.6.d:0 "GÉRER LES IDÉOLOGUES COMMUNISTES EN AMÉRIQUE CENTRALE\nBureau d'analyse latino-américaine, Direction du renseignement\nSECRET/NOFORN\n\nDans notre nouveau plan visant à promouvoir les idéaux de démocratie et d'autodétermination en Amérique latine, le problème des partis communistes et des idéologues dans tous ces États constitue un obstacle à notre développement. Même si les États-Unis restent fondamentalement opposés au communisme, nous ne pouvons pas interférer dans les processus démocratiques, en particulier ceux impliquant la gauche. Les idéologues représentent cependant une menace fondamentale pour l'influence et l'autodétermination américaines et doivent être mis à l'écart.\n\n1. La coercition pourrait être utilisée pour faire chanter ou extorquer les idéologues communistes soit à renoncer à leur idéologie, soit à la changer en une social-démocratie qui ne sera pas aussi radicale politiquement que le communisme.\n\n2. Les paiements en devises et autres allocations liées au coût de la vie peuvent également être envisagés comme un moyen de marginaliser les idéologues et les responsables du Parti communiste en Amérique latine, bien que cette stratégie ne soit pas recommandée principalement parce qu'elle augmenterait la dépendance à l'égard de paiements supplémentaires en espèces.\n\n3. Enfin, faire appel à l'ego des idéologues et des dirigeants peut également être bénéfique pour les mettre à l'écart. Ignorer ou combattre directement les dirigeants communistes ne sera pas efficace, mais les mettre à l'écart tout en leur donnant le sentiment de réussir sera efficace pour les garder sous contrôle pendant que nous faisons avancer notre plan.\n\nCe Bureau estime qu'en écartant les communistes en secret, on maintiendra des apparences de valeurs démocratiques et d'autodétermination sans s'impliquer ouvertement dans la région et sans affecter les autres partis de gauche."
 CIA_LATAMc.7.d:0 "Messieurs,\n\nLes États-Unis ont apprécié votre travail et votre coopération jusqu'à présent avec nous pour empêcher la propagation du communisme dans toute la région latino-américaine. Il est toutefois temps pour nous de mettre un terme à cette relation.\n\nVos activités autour du trafic de marijuana et de cocaïne ont suscité de vives inquiétudes auprès de l'administration actuelle. Les administrations et présidents précédents ont peut-être toléré ce type de comportement, mais il est dans le meilleur intérêt national et international des États-Unis de ne pas collaborer avec des éléments du crime organisé, en particulier ceux d'autres États souverains, et en particulier ceux qui sont responsables du trafic de stupéfiants dangereux.\n\nCette lettre constitue l'avis final du gouvernement des États-Unis indiquant que nous ne poursuivrons pas notre coopération avec votre entreprise criminelle et que nous soutiendrons avec enthousiasme toute tentative des forces de l'ordre visant à mettre fin à vos opérations.\n\nCordialement,\nPrésident [USA.GetLeader]\nDirecteur de la CIA [GetCurrentCIADir]"
 CIA_LATAMc.8.d:0 "C'était une réunion ordinaire à Langley, et alors que le DDO et ses assistants entraient dans la salle de conférence, il vit le chef du Bureau des opérations latino-américaines assis avec son équipe examinant certains rapports, encerclant les informations et fronçant les sourcils.\n\n\"Je suppose que nous sommes à cause de Noriega, n'est-ce pas ?\" \"Oui, monsieur. L'officier de surveillance pour l'Amérique latine a rapporté hier soir qu'un groupe de travail conjoint PD-DEA de Miami avait saisi un cargo battant pavillon panaméen avec des centaines de livres de crack cachés à bord.\"\n\n\"Merde.\" Le DDO se prit la tête entre les mains.\n\n\"Oui, monsieur. Noriega a nié toute responsabilité mais nous savons qu'il l'a fait, il ne fait même plus attention.\" L'officier des opérations haussa les épaules.\n\nLe DDO se redressa à nouveau. \"Très bien. C'est fait. Nous y mettons fin.\" Il désigna les deux hommes de l'autre côté de la table. \"Reste ici. Je reçois au téléphone le directeur et le conseiller à la sécurité nationale. Nous interrompons Noriega. Assez.\"\n\nEn quelques minutes, l'officier des opérations est resté assis dans un silence choqué lorsque le directeur central du renseignement [GetCurrentCIADir] est entré en ligne, en plus du conseiller à la sécurité nationale [GetCurrentNatSecAdv]. Les deux autres hommes ont accepté et un appel a été lancé au président, via la DCI. L'officier des opérations et son adjoint étaient assis, attendant un ordre. Il était sûr qu'il faudrait également appeler le chef de station, mais cela allait très vite, pensa-t-il."
 CIA_LATAMc.9.d:0 "Le choc et la confusion règnent aujourd'hui au Palacio de Las Garzas alors que l'ambassadeur des États-Unis au Panama a annoncé la révocation de toute nouvelle aide américaine au Panama. Précipités par les inquiétudes de longue date concernant la campagne de trafic de drogue du président Noreiga, ainsi que son bilan en matière de droits humains, les États-Unis en ont assez et ont suspendu toute aide politique, économique et militaire.\n\nNoriega s'en prend, accusant la CIA américaine d'interférer dans le développement des affaires panaméennes et l'administration actuelle de la Maison Blanche de perdre un autre allié. Les sources américaines, en particulier l'ambassade de Panama City ainsi que Foggy Bottom, ne sont pas d'accord."
 CIA_LATAMc.10.d:0 "Le groupe de travail conjoint FBI-DEA d'El Paso s'est réuni pour ce qui serait probablement une réunion courte, improductive et inutile. Le groupe de travail avait été conçu dans le but de mettre en commun les ressources et de contribuer à la poursuite du problème de la drogue dans la région d'El Paso-Juarez, mais il s'est avéré jusqu'à présent un échec retentissant. L'agent spécial du FBI Smith était à son point de rupture, le groupe de travail étant gêné par des chiffres inconnus, des problèmes de juridiction et des tas et des piles de paperasse mystérieuse.\n\n\"Bonjour, messieurs.\" Il fit un signe de tête avec lassitude aux agents de la DEA entrant dans la salle de conférence, qui hochèrent la tête en retour et s'assirent. Ils étaient tous sortis la nuit dernière, en laisse, pour chercher autour d'eux, mais ils n'avaient rien trouvé. « Votre bureau a-t-il eu d'autres développements ?\n\nSmith secoua la tête. \"Non. Les trafiquants sont capables de passer la frontière sans être détectés. Nous pensons qu'ils sont aidés par quelqu'un mais nous ne savons pas qui. C'est horrible.\" Il fut interrompu par une secrétaire faisant irruption. \"Jack, appelle-toi.\"\n\nIl sortit, s'attendant vraiment à quelque chose, n'importe quoi. \"Bonjour?\"\n\"Nous aimerions vous aider dans votre affaire de drogue à El Paso, agent Smith.\"\n\"A qui est-ce que je parle ?\"\n\n\"Ce n'est pas important. Sachez simplement que Langley veut aider nos courageux garçons du Bureau. Nous ne distribuons pas souvent de telles faveurs, alors prenez ce que vous pouvez obtenir. Votre bureau recevra plus tard un fax avec des photos et des index de documents. Un coursier viendra plus tard avec des boîtes de matériel physique. Vos patrons reçoivent un appel similaire en ce moment. Ne vous inquiétez pas pour eux. \"\n\n\"Quoi ? Langley ? C'est la putain de CIA ?\"\n\nCliquez."
 CIA_LATAMc.11.d:0 "UN COMPROMIS AVEC LE NICARAGUA ?\nBureau d'analyse latino-américaine, Direction du renseignement ; Ambassade des États-Unis, Managua\nSECRET/NOFORN\n\nAprès des années de soutien aux forces anticommunistes « Contra » au Nicaragua, actuellement dirigé par un gouvernement marxiste sandiniste connu sous le nom de FSLN, les États-Unis pourraient désormais se trouver face à une nouvelle opportunité de renverser le cours du conflit. Au lieu de soutenir continuellement les Contras et de forcer un conflit gelé qui se terminerait par une impasse, ce Bureau recommande un compromis avec le régime sandiniste pour assurer la parité entre les deux parties et mettre fin au conflit.\n\n1. Un cessez-le-feu immédiat et la fin des hostilités pendant que les négociations commencent. Cela se produira des deux côtés, les États-Unis cherchant à empêcher les Contras de commettre des violences ou des attaques contre les forces sandinistes.\n\n2. La formation d'un gouvernement de coalition temporaire, composé à parts égales de partis sandinistes (FSLN), Contra et démocrates. Cela permettra une structure gouvernementale stable et le maintien des cessez-le-feu, pendant que de nouvelles réformes démocratiques seront mises en place.\n\n3. Une fois le gouvernement de coalition formé, les élections auront lieu à une date convenue. Ces élections devraient être observées et appliquées par des observateurs internationaux, tant des États-Unis que d'autres pays d'Amérique centrale, ainsi que par des équipes des Nations Unies et de l'Organisation des États américains ; pour garantir qu'aucun parti ne truque les élections ou ne contraint la population à des élections injustes.\n\n4. Enfin, une convention constitutionnelle sera convoquée avec la coopération des Sandinistes et des Contras pour déterminer une nouvelle constitution pluraliste, multipartite et démocratique, conçue pour garantir et consacrer un gouvernement plus permanent et démocratique, ainsi que la coopération (ou la compétition amicale) des Contras et des Sandinistes. De nouvelles réformes devraient favoriser la démobilisation, la réforme militaire et d'autres changements destinés à éliminer de nouvelles flambées de violence dans le pays."
 CIA_LATAMc.12.d:0 "L'ambassadeur des États-Unis au Nicaragua s'est présenté au bureau du président du Nicaragua [NIC.GetLeader] avec un compromis dans nos efforts pour écraser les rebelles anticommunistes Contra soutenus par les États-Unis.\n\nLes Américains, vraisemblablement dans le but de se sortir de leur guerre par procuration contre nous, ont proposé un cessez-le-feu, la formation d'un gouvernement de coalition entre notre FSLN et les rebelles Contra ; la programmation d'élections libres et équitables et une réécriture constitutionnelle pour garantir la pluralité et la démocratie multipartite.\n\nLes personnalités de notre gouvernement ont eu des réactions mitigées face à cette évolution. Depuis le départ et le retour de l'ambassadeur, plusieurs ministres ont exprimé leur soutien ou leur mécontentement à l'égard de l'accord. Certains pensent que ce serait une bonne idée pour mettre un terme au conflit et peut-être inciter les États-Unis à avoir une meilleure perception du régime ; mais beaucoup d'autres, idéologiquement engagés, sont restés contre, convaincus que l'accord ne profite pas au Nicaragua et que se soumettre à l'hégémonie américaine n'est pas la bonne façon de résoudre le problème ; au lieu de cela, l'écrasement des Contras devrait continuer.\n\nIl s'agit d'une question difficile et nuancée, mais le président souhaite répondre prochainement à Washington. Comment devons-nous réagir ?"
 CIA_LATAMc.13.d:0 "Des nouvelles surprenantes sont arrivées de notre ambassade à Managua selon lesquelles le gouvernement du Nicaragua, dirigé par le marxiste FSLN, également connu sous le nom de sandinistes, a accepté notre proposition de compromis pour régler le conflit entre eux et les groupes de guérilla anticommunistes Contra soutenus par les États-Unis.\n\nNotre proposition, consistant en un cessez-le-feu, la formation d'un gouvernement de coalition, une nouvelle constitution et des élections libres et observées, a été acceptée aujourd'hui à contrecoeur par les sandinistes à Managua, un porte-parole du gouvernement déclarant que \"des concessions sont nécessaires pour assurer à nouveau la paix et la stabilité au Nicaragua\".\n\nFoggy Bottom et Langley vont de l'avant pour mettre en oeuvre un programme en deux volets pour lancer le plan de paix, la CIA contactant les personnalités de Contra pour entamer un cessez-le-feu entre les deux parties, et le Département d'État travaillant à partir de l'ambassade pour maintenir les contacts avec le gouvernement sandiniste ainsi que pour obtenir le soutien international via l'ONU et l'OEA pour l'application du plan de paix."
 CIA_LATAMc.14.d:0 "Des nouvelles malheureuses sont arrivées de notre ambassade à Managua selon lesquelles le gouvernement du Nicaragua, dominé par le marxiste FSLN, également connu sous le nom de Sandinistes, a rejeté notre proposition de compromis pour régler le conflit nicaraguayen entre eux et les Contras anticommunistes soutenus par les États-Unis.\n\nNotre proposition, consistant en un cessez-le-feu, un gouvernement de coalition, une nouvelle constitution et des élections libres, a été catégoriquement rejetée par les sandinistes comme « une nouvelle tentative d'hégémonie et d'impérialisme américain dans nos affaires intérieures » et « un affaiblissement de la sécurité de l'État nicaraguayen en introduisant des éléments subversifs et terroristes dans le gouvernement ».\n\nFoggy Bottom et Langley sont furieux de ces développements, mais se rendant compte que les négociations pacifiques se sont révélées infructueuses, ils vont sans aucun doute redoubler d'efforts pour soutenir et armer les Contras afin de garantir une victoire militaire."
 CIA_LATAMc.15.d:0 "Des nouvelles surprenantes sont arrivées d'Amérique centrale, alors que le gouvernement nicaraguayen, dirigé par le Front marxiste sandiniste de libération nationale (FSLN), a annoncé une réconciliation avec le conflit nicaraguayen en cours. Le FSLN, acceptant à contrecoeur un cessez-le-feu et un accord de paix négocié par les États-Unis, s'est engagé à former un gouvernement de coalition avec les Contras, la guérilla anticommuniste soutenue par Washington, ainsi qu'avec d'autres partis démocrates.\n\nLe plan de paix, approuvé par l'Organisation des États américains et les Nations Unies, comprend un cessez-le-feu déjà mis en oeuvre et, outre le gouvernement de coalition, comprendra des élections libres et équitables avec surveillance, ainsi qu'une nouvelle constitution garantissant la démocratie multipartite et le pluralisme. De nombreux pays d'Amérique centrale ainsi que la communauté internationale considèrent cette réussite comme la fin d'un autre conflit par procuration dans la guerre froide."
 CIA_LATAMc.16.d:0 "L'AVENIR DE LA DISTRIBUTION DE L'AIDE EN AMÉRIQUE CENTRALE\nBureau d'analyse latino-américaine, Direction du renseignement ; Bureau des opérations latino-américaines, Direction des opérations.\nSECRET/NOFORN\n\nDirecteur,\n\nIl a été porté à notre attention, tant au sein de la Direction des opérations que du renseignement, que les régimes centraméricains abusent largement de leur pouvoir et de leur influence, soutenus par notre Agence et par les États-Unis dans leur ensemble, pour commettre des violations drastiques des droits de l'homme et déclencher des conflits dans la région.\n\n1. L'aide militaire aux régimes d'Amérique centrale, notamment au Honduras, au Salvador et au Guatemala, destinée à renforcer leurs services de sécurité, a été utilisée à mauvais escient, selon le Bureau d'analyse de l'Amérique latine, au lieu d'être utilisée pour des opérations de contre-insurrection internes, notamment des exécutions extrajudiciaires, des passages à tabac et la destruction de biens civils. Les chefs militaires de tous les États concernés ont fait preuve de peu de responsabilité.\n\n2. L'aide économique aux régimes d'Amérique centrale, destinée à accroître leurs capacités agricoles et manufacturières ainsi qu'à améliorer les infrastructures et les systèmes de communication, a été massivement utilisée à mauvais escient par chacun des gouvernements ; au lieu de cela, ils sont détournés vers les coffres d'éminents responsables gouvernementaux, utilisés comme pots-de-vin ou placés dans le budget de l'armée et d'autres services de sécurité. Il n'y a pas d'application des réformes économiques, ni d'initiatives de construction de la part des États-Unis.\n\n3. L'aide secrète, sous forme d'interventions et d'assistance opérationnelle dans la lutte contre les mouvements communistes et les cartels de la drogue, est entravée par de hauts fonctionnaires occupant des postes gouvernementaux. Des agents de la Direction des opérations ont signalé que leurs opérations et leurs ordres venant d'en haut ont été bloqués par des membres des services de sécurité peu coopératifs, exigeant parfois des pots-de-vin et d'autres formes de coercition pour atteindre les objectifs de la mission.\n\nLes deux Bureaux, et donc aussi bien la Direction du Renseignement que la Direction des Opérations, estiment que toute forme d'aide aux régimes centraméricains doit être stoppée à moins que les États-Unis ne parviennent à négocier un plan d'application avec les pays bénéficiaires de l'aide, et qu'ils ne s'engagent à se soumettre à des contrôles supplémentaires."
 CIA_LATAMc.17.d:0 "L'ambassadeur des États-Unis a annoncé aujourd'hui une nouvelle étonnante : les États-Unis ont annoncé simultanément qu'ils cesseraient toute aide à notre pays et aux autres pays de la région si nous ne prenions pas davantage de mesures pour garantir que cette aide ne soit pas utilisée à mauvais escient.\n\nInvoquant des inquiétudes concernant la mauvaise gestion et la corruption au sein de notre gouvernement et dans la région dans son ensemble, les États-Unis ont déclaré qu'ils mettraient fin à toute aide et assistance militaire, économique et secrète qui nous était fournie à moins que nous n'acceptions de négocier une application plus stricte des dépenses et de l'utilisation de l'aide sous leur oeil vigilant.\n\nLes membres de notre gouvernement sont divisés sur la question ; D'éminents responsables politiques et militaires soutiennent que nous pouvons simplement chercher un autre bienfaiteur plus agréable, tandis que des officiers et des bureaucrates de niveau inférieur soutiennent que l'adhésion à une application plus stricte constituera une meilleure option à long terme sous l'influence américaine. Comment devons-nous réagir ?"
 CIA_LATAMc.18.d:0 "Les appels des ambassades américaines en Amérique centrale ont afflué aujourd'hui, tous avec à peu près le même message : les gouvernements du Salvador, du Guatemala et du Honduras ont tous accédé aux menaces américaines de retirer leur aide, sur la base d'accusations de corruption et de mauvaise gestion.\n\nLes responsables de chaque gouvernement ont promis par écrit à l'ambassadeur des États-Unis dans leur pays que des réformes seraient mises en oeuvre pour gérer la réception de l'aide et garantir que l'aide désignée et réservée serait utilisée à des fins spécifiques établies par le Département d'État et la CIA. En particulier, l'accent a été mis sur la garantie que l'aide sera utilisée pour l'amélioration de l'économie et des infrastructures, par opposition à l'utilisation actuelle qui est destinée aux responsables militaires, aux opérations de contre-insurrection et aux pots-de-vin versés à d'éminents responsables gouvernementaux.\n\nFoggy Bottom est satisfait de cette évolution et espère informer le président et d'autres responsables diplomatiques et de sécurité d'ici la fin de la journée."
 CIA_LATAMc.19.d:0 "Des appels malheureux sont venus des ambassades américaines de toute l'Amérique centrale ce matin, tous avec à peu près le même message : les gouvernements du Salvador, du Guatemala et du Honduras ont tous rejeté les menaces américaines de retirer leur aide sur la base d'accusations de corruption et de mauvaise gestion.\n\nLes responsables de chaque gouvernement, qui ont tous tenu des conférences de presse, ont condamné les menaces américaines, les qualifiant de « tentatives américaines continues d'influencer tous les aspects de nos affaires intérieures » et « la réduction de l'aide militaire condamnera vos alliances avec nous et garantira l'effondrement de la sécurité dans la région ».\n\nLes décideurs politiques de Langley et Foggy Bottom ainsi que plusieurs ambassades et agences sont furieux. Le président n'a pas encore été lu mais la DCI et le secrétaire d'État ont été informés. Il n'est pas clair si l'aide sera réellement réduite, mais nous supposons que le président [USA.GetLeader] mettra fin à l'aide immédiatement après cette évolution."
 CIA_LATAMc.20.d:0 "OPÉRATION BLIZZARD BURN : PLAN OPÉRATIONNEL\nQuartier général du Commandement Sud des États-Unis ; Bureau fédéral d'enquête ; Agence de lutte contre la drogue ; Force conjointe de lutte contre la drogue, Central Intelligence Agency\nSECRET/NOFORN\n\nCi-dessous se trouvent les ordres donnés aux unités de l'USSOUTHCOM, du FBI, de la DEA et de la CIA d'interdire et d'attaquer les principaux bastions du cartel au Mexique, en Amérique centrale et en Colombie. Ces raids devraient être de nature secrète mais impliquer la coopération du gouvernement local et de ses services de sécurité.\n\n1. Les forces de l'USSOUTHCOM, basées au Panama, se concentreront principalement sur le maintien de lignes de communication ouvertes, de surveillance et d'appui-feu de secours pour les agents de terrain du FBI et de la DEA. L'USSOUTHCOM fournira également des services de transport aérien et tout autre service de transport affilié, et maintiendra des contacts avec d'autres services de sécurité et militaires de la région.\n\n2. Les agents du FBI et de la DEA, travaillant au sein d'une Force opérationnelle conjointe de contrôle des drogues (JCDTF), mèneront les principales opérations d'interdiction, après avoir reçu l'autorisation d'opérer des autorités supérieures et du Conseil national de sécurité. Cela se fera principalement via des équipes de frappe conjointes désignées, qui utiliseront les ressources de la force opérationnelle, ainsi que les ressources de l'USSOUTHCOM, pour attaquer les bastions du cartel et arrêter ou tuer les dirigeants et lieutenants du cartel.\n\n3. Les agents de la CIA se concentreront principalement sur la fourniture d'un soutien en matière de renseignement, de surveillance, de « marquage » des membres du cartel et de leurs emplacements, et généralement sur la fourniture de données de ciblage et de soutien aux équipes de frappe conjointes et à la force opérationnelle. La CIA devra également fournir du personnel pour aider aux interrogatoires et aux forces de frappe afin d'améliorer l'interdiction globale et l'efficacité opérationnelle.\n\nToutes les agences et commandements disposent d'un certain degré d'autonomie, mais toutes les opérations et responsabilités doivent être réglées avec la Force opérationnelle interarmées basée au Panama avant que quoi que ce soit ne se produise.\n\nSIGNÉ\nCommandant du Commandement Sud des États-Unis ; Commandant du détachement de l'USSOUTHCOM, Groupe de travail conjoint sur le contrôle des drogues"
 CIA_LATAMc.21.d:0 "UNE NOUVELLE POLITIQUE LATINO-AMÉRICAINE\nBureau d'analyse latino-américaine, Direction du renseignement\nSECRET/NOFORN\n\nComme en témoignent nos changements tumultueux dans la politique entourant la région latino-américaine, il est temps pour les États-Unis d'envisager pleinement une nouvelle politique latino-américaine, combinant les idéaux d'autodétermination et de démocratie multipartite et corrigeant les erreurs du passé avec une plus grande assistance et des opérations de lutte contre la drogue, sans outrepasser notre rôle.\n\n1. Comme l'ont prouvé les administrations précédentes, il est primordial de préserver notre réputation auprès des pays d'Amérique latine. Dans le passé, nous les avons traités comme des navires d'exploitation, pour en tirer un bénéfice économique ; par notre gouvernement ou par des sociétés américaines. Toutefois, les États-Unis ne devraient pas tomber dans le piège consistant à installer des gouvernements de droite afin de conserver un visage amical. Le maintien des initiatives d'autodétermination dans la région devrait être la priorité absolue, car les États-Unis ont toujours influencé les élections dans le passé.\n\n2. Les opérations de lutte contre la drogue devraient également être soulignées comme une préoccupation majeure de la coopération entre les États-Unis et l'Amérique centrale, en plus des initiatives d'aide militaire et de formation proposées par le Pentagone. En particulier, les États-Unis souhaitent promouvoir un effort international combiné via l'Organisation des États américains pour mettre fin au trafic de cocaïne et de marijuana par le biais d'actions militaires et policières.\n\nCe Bureau estime que ce plan politique à deux volets stabilisera la région sans céder aux intérêts radicaux des deux côtés du spectre politique et maintiendra effectivement l'influence américaine avec peu ou pas de belligérance."
 CIA_LATAMc.22.d:0 "Alors que le directeur du renseignement central [GetCurrentCIADir] entrait dans la grande salle de conférence, un silence tomba sur la salle, parmi les dirigeants d'entreprise et les vice-présidents seniors assis là. Aucun d'entre eux ne savait pourquoi ils avaient été appelés ici, juste que leurs secrétaires avaient été effrayées par de mystérieux appels téléphoniques ordonnant à leurs patrons de venir immédiatement à Langley.\n\n\"Messieurs, bienvenue à Langley. Je suis sûr que vous vous demandez tous pourquoi nous vous avons appelé ici.\" La plupart des dirigeants acquiescèrent. \"Certains d'entre vous pensent probablement que nous allons vous demander de faire des missions secrètes d'espionnage, mais ce n'est pas pour cela que nous sommes ici.\" Cela provoqua un petit rire, dont la DCI se réjouit, car il s'apprêtait à aborder un sujet plus sérieux.\n\n\"Vous êtes ici parce que vos entreprises et sociétés ont une grande influence en Amérique latine. De Chiquita à Cargill en passant par Freeport-McMoRan, l'industrie est diversifiée et je suis sûr que vos actionnaires et les économies locales de la région l'apprécient.\"\n\n\"Cependant, ici à l'Agence, ainsi que dans tout le Potomac à Washington, nous sommes devenus préoccupés par certaines de vos actions. De nombreux responsables politiques de l'État et du Commerce pensent que vos pratiques commerciales déstabilisent intrinsèquement la région et que votre influence contribue à soutenir les régimes de droite et néofascistes dans la région.\" La pièce fut soudainement remplie d'un silence de confusion, conduisant à un volume de fanfaronnades plus fort.\n\n\"Maintenant, j'admets que notre gouvernement dans le passé n'a pas fait mieux, mais nous avons changé nos habitudes et nous sommes déterminés à contribuer aux réformes dans la région. Vous savez tous aussi bien que moi que vos entreprises ont autant, sinon plus d'influence dans les gouvernements d'Amérique centrale et d'Amérique du Sud ; elles sont tellement dépendantes économiquement que si vous les obligez à réformer, elles y donneront suite.\"\n\nLes dirigeants se regardèrent les uns les autres, puis se tournèrent vers la DCI. \"Etes-vous réel ?\", a demandé un vice-président senior de Cargill.\n\n\"Oui, oui, je le suis. Vous auriez toujours des avantages économiques, mais vous offririez également aux gens une meilleure qualité de vie. Vous les payez, vous savez.\"\n\nLes dirigeants soupirèrent. \"D'accord. Nous allons en reparler avec nos conseils d'administration, je suppose, du moins je le ferai. Je ne sais pas comment cela va se passer, directeur.\""
 CIA_LATAMc.23.d:0 "C'était une nuit chaude dans le sud-est du Guatemala, près de San Marcos, alors qu'un employé de Chiquita, anciennement United Fruit Company, roulait sur la route poussiéreuse dans sa nouvelle berline Ford en mauvais état. Il ne s'agissait pas d'un employé local, mais d'un cadre intermédiaire américain, envoyé pour superviser la production bananière de la région. Ses patrons ne se souciaient pas d'où il venait, il savait juste assez d'espagnol pour crier après les ouvriers, et assez de bon sens pour savoir comment soudoyer le conseil local et les soldats.\n\nIl continua de conduire, essuyant la sueur de son front. S'arrêtant à un poste de contrôle à l'extérieur de la ville de San Marcos, il a sorti ses papiers et quelques quetzals pour les soldats ; il savait qu'ils avaient besoin d'argent, de toute façon.\n\n\"Buenas noches, messieurs\", dit le directeur en étendant ses papiers alors que la fenêtre finissait de s'abaisser. Les soldats souriaient, prenaient l'argent mais le feuilletaient, puis frappaient à la porte pour en demander davantage. Le directeur haussa les épaules. \"C'est tout ce que j'ai, les gars.\" Les soldats hochèrent la tête, ouvrant la porte et le laissant passer.\n\nDix secondes plus tard, la voiture explosait dans une pluie de tirs automatiques, des dizaines de balles brisant la vitre et laissant le gérant dans un état de désordre sanglant. L'un des soldats, se dirigeant vers la voiture, a brisé le reste de la vitre, envoyant l'homme s'assurer qu'il était bien mort.\n\nUn autre homme à moto, venant dans l'autre sens, s'est arrêté, comme s'il savait ce qui se passait. Il descendit en faisant signe aux hommes qui baissaient leurs armes. \"Voici votre salaire, les hommes.\" Les deux sourirent, partageant les billets et les mettant dans leurs poches tout en vérifiant à nouveau leurs fusils. Un autre homme banane mort, pensaient-ils. Tout ce qu'il fallait pour le plus offrant."
 CIA_LATAMc.24.d:0 "Marcus Greene était fatigué par la chaleur de la journée, mais ils venaient de prendre une nouvelle avance. Dans le cadre d'un nouveau programme avec la police nationale du Nicaragua, Greene avait été intégré en tant que conseiller, bien qu'avec des rôles limités. Le gouvernement nicaraguayen s'était méfié de l'empressement de la CIA à aider, mais lorsqu'ils ont évoqué la prévention du trafic de drogue Contra, les sandinistes ont accepté à contrecoeur.\n\nLes policiers qui l'accompagnaient n'étaient pas des flics ordinaires ; ils avaient été formés dans une certaine mesure à la lutte antidrogue, mais avaient été cooptés par les communistes lors de leur accession au pouvoir. La politique n'avait pas vraiment d'importance ici, loin de Managua, car ils partageaient un objectif commun.\n\nGreene et son équipe se trouvaient dans un port, quoique petit, où la police savait que les trafiquants de cocaïne venaient. Ils avaient vu une douzaine de petits bateaux de pêche et de crevettières et les avaient tous fouillés, mais en vain ; cependant, un officier avait parlé à un homme local qui a déclaré avoir vu un homme blanc aider à décharger quelque chose d'un camion et sur un bateau. Cela valait la peine d'enquêter, d'autant plus que les Contras étaient connus pour opérer de manière intensive ici.\n\nEn sortant dans des eaux plus profondes à bord d'un canot, Greene a montré le bateau que l'homme avait identifié. C'était un bateau rouillé, long de 20 pieds, à peine navigable, battant pavillon panaméen ; pas trop suspect, mais typiquement ce qui serait utilisé pour le trafic de drogue. Il y avait un homme dessus, un type à l'air nerveux ; Greene a deviné qu'il était le propriétaire du bateau. Les Nicaraguayens l'ont interrogé brièvement, avant qu'il ne tente de les repousser, en vain. Une brève bagarre a éclaté, mais l'homme a été plaqué et poussé contre un mur, où les policiers nicaraguayens l'ont frappé avant de le menotter.\n\nGreene regardait l'eau, se demandant combien d'autres petits bateaux ils n'avaient pas pu attraper aujourd'hui. Au moins, ils en ont un. Son sergent s'approcha de lui, semblant lui indiquer qu'ils avaient capturé là-bas des centaines de briques de cocaïne. Je suppose que les Contras manqueraient ça, pensa-t-il."

 # CIA Contras
 CIA_CONTRA80.0.d:0 "LES CONTRAS AU NICARAGUA : EN BREF\nDétachement du Nicaragua, Bureau d'analyse latino-américaine, Direction du renseignement\nSECRET/NOFORN\n\nDans la guerre civile nicaraguayenne en cours, les États-Unis se sont particulièrement intéressés à une organisation de guérilla lâche connue sous le nom de « Contras » (abréviation de « la contrarrevolución » ou « la contre-révolution », composée de trois grands groupes au Nicaragua axés sur l'anticommunisme et se rebellent contre le gouvernement d'alignement marxiste au pouvoir connu sous le nom de Sandinistas ou FSLN. La Force démocratique nicaraguayenne (FDN) est le plus grand groupe Contra, dirigé par Adolfo Calero, composé d'anciens nicaraguayens. Les gardes nationaux et la Légion du 15 septembre comptent parmi les autres groupes pro-Contra des Nicaraguayens qui soutenaient la révolution anti-Somoza mais désapprouvaient le régime sandiniste actuel, notamment les Milicias Populares Anti-Sandinistas (MILPAS) et d'autres milices paysannes.\n\nLes États-Unis sont confrontés au défi de décider s'ils soutiennent ou non les Contras. Le soutien actuel des États-Unis, consistant principalement en un soutien politique via des exilés et des livraisons limitées d'armes, n'a pas suscité beaucoup d'approbation au Congrès. Ce bureau recommande une nouvelle augmentation des expéditions d'armes et d'autres opérations secrètes au Nicaragua, car cela fera progresser les intérêts américains dans la région et renforcera la capacité de combat des Contras. L'opinion publique et celle du Congrès doivent être très préoccupées, car la persistance des troubles pourrait nécessiter la fin des opérations."
 CIA_CONTRA80.1.d:0 "Alors que le matin tombait sur Washington, trois des hommes les plus importants du monde et leurs collaborateurs se réunissaient tôt dans l'aile ouest.\n\n\"... Et donc, la Colline veut que nous réduisions notre soutien aux Contras, et le président est d'accord, nous devrions donc aller de l'avant et y mettre fin.\" Le conseiller à la sécurité nationale [GetCurrentNatSecAdv] soupira.\n\nLe directeur du renseignement central [GetCurrentCIADir] regarda autour de lui. \"Je suppose. Faites simplement savoir qu'il y a des individus au sein de l'Agence qui ne soutiennent pas cela et qui soutiennent l'augmentation des expéditions d'aide.\"\n\nLe DDO est intervenu. \"Le Congrès ne sait rien du Nicaragua, et pourtant ils continuent de nous ordonner de mettre fin à quelque chose qu'ils ne connaissent pas. Y a-t-il un moyen de garder cela sous silence sans avoir à lire le président ou le Congrès?\"\n\nLe conseiller à la sécurité nationale secoua la tête. \"Pas question. Nous ne pouvons pas nous permettre de ne pas en informer le président, et on ne peut pas non plus mentir au Congrès à une telle échelle.\"\n\n\"Une opinion inhabituelle de votre part, là, patron\", a déclaré le DDO, \"mais je vous l'accorde, vous avez raison. Cette situation, opérationnellement, est devenue trop compliquée et encore une connerie et elle sera entre les mains de la presse. Mieux vaut y mettre un terme maintenant avant de perdre encore plus de crédibilité.\" Les deux autres acquiescèrent. \"DCI, vous commencez à appeler le Watch Center et Langley. Je vais aller lire le président tout de suite et lui dire que nous mettons fin aux livraisons d'armes, mais que nous continuerons à soutenir de manière limitée le public en faveur des contras en termes de rhétorique. Ça a l'air bien ?\" Le conseiller à la sécurité nationale s'est levé.\n\n\"Finissons-en.\" Les hommes hochèrent la tête, puis tous sortirent de la pièce."
 CIA_CONTRA80.2.d:0 "C'était en début de soirée, juste après le coucher du soleil, lorsque le capitaine Thomas Glenn et son copilote, aux commandes d'un tout nouveau Lockheed L-100 Hercules, ont roulé sur la piste 12 de l'aéroport international de Miami. C'était son quatrième ou cinquième vol pour cette petite entreprise de fret appelée Southern Air Transport, qui exploitait des vols cargo entre les États-Unis et l'Amérique centrale. Plus précisément, Glenn et son copilote ont été chargés de piloter cette version civile d'un Hercules C-130 jusqu'à la base aérienne de Soto Cano au Honduras. Son plan de vol indiquait PLA, comme à Planadas, en Colombie, mais personne n'avait besoin de connaître l'incohérence là-bas.\n\nDécollant quelques minutes plus tard, Glenn soupira alors qu'il se préparait pour le vol généralement droit et facile de deux heures vers le centre du Honduras. Son copilote, également officieusement arrimeur, est revenu de la soute en annonçant « tout va bien, patron ».\n\nGlenn a répondu : « Ai-je au moins l'autorisation de savoir ce qu'il y a là-bas ? Ils ont ri, avant que le copilote ne réponde : \"Juste des boîtes et des boîtes d'AK-47, quelques boîtes de Makarov, quelques TOW, je suppose que les Contras en ont besoin maintenant.\" Glenn hocha la tête, retournant vers la zone de contrôle pour ajuster légèrement leur cap. \"Oui, monsieur. Je me fiche de ce que je transporte tant que ça paie les factures, vous voyez ce que je veux dire!\" Ils ont ri et ont continué à parler pendant que le vol se poursuivait.\n\n90 minutes plus tard, le L-100 atterrissait à Soto Cano au crépuscule, juste au moment où les pilotes étaient partis. Après un atterrissage plutôt cahoteux, Glenn était heureux de voir les véhicules cargo et les soldats américains debout près du hangar, alors que l'avion était ramené en arrière et garé pour décharger secrètement. Il aurait juste le temps de se dégourdir les jambes et de prendre un café, avant de ravitailler l'oiseau et de retourner à Miami, avec un peu de chance vers 2 ou 3 heures du matin, heure de l'Est. Puis un jour de congé, Dieu merci.\n\nIl se demandait où irait sa cargaison et comment elle serait utilisée ; il savait que cela allait au Nicaragua, mais pourquoi les armes soviétiques, se demanda-t-il ? Ce sont eux qui combattaient les communistes. Glenn n'était pas suffisamment informé pour savoir d'où venaient les armes, mais il avait fait son travail et il était temps de rentrer chez lui."
 CIA_CONTRA80.3.d:0 "L'AMENDEMENT BOLAND ET L'AVENIR DU NICARAGUA\nBureau du Nicaragua, Bureau d'analyse de l'Amérique latine, Direction du renseignement ; Bureau des affaires du Congrès, CIA\nSECRET/NOFORN\n\nUn amendement au plus récent Defence Appropriations Act rédigé par le représentant Edward Boland (D-MA) a suscité de grandes inquiétudes parmi les membres de la communauté du renseignement américain et de l'administration actuelle. Ayant été adopté à une large majorité par la Chambre, l'\"Amendement Boland\", comme on l'appelle, stipule ce qui suit :\n\n\"Au cours de l'exercice [GetYear], aucun fonds disponible pour la Central Intelligence Agency, le ministère de la Défense ou toute autre agence ou entité des États-Unis impliquée dans des activités de renseignement ne peut être engagé ou dépensé dans le but ou qui aurait pour effet de soutenir, directement ou indirectement, des opérations militaires ou paramilitaires au Nicaragua par une nation, un groupe, une organisation, un mouvement ou un individu. \"\n\nEn bref, cet amendement restreint effectivement non seulement la Central Intelligence Agency, mais tout organisme gouvernemental américain, de soutenir financièrement les Contras au Nicaragua. Cette décision du Congrès n'a pas surpris de nombreux responsables des Affaires du Congrès, car l'attitude du Capitole a été fermement opposée au soutien de l'administration aux mouvements anticommunistes au Nicaragua, et en particulier en utilisant les fonds autorisés par eux à d'autres fins.\n\nNous sommes confrontés à diverses options à cet égard. Il s'agirait simplement de suivre le texte de l'amendement tel que stipulé par le Congrès, de peur que la CIA ne perde son financement au cours des exercices ultérieurs. Cela a été présenté par des membres haut placés de l'Agence et du Bureau des Affaires du Congrès comme un moyen pour la CIA de sauver la face et de se retirer du Nicaragua.\n\nCependant, l'avocat général de la CIA et la direction des opérations ont informé l'Agence que l'amendement a une formulation suffisamment vague et que l'aide aux Contras pourrait être poursuivie secrètement tout en restant techniquement dans les limites des stipulations du Congrès. Cela plairait aux personnalités du Congrès, tout en maintenant les priorités opérationnelles au Nicaragua et en soutenant les Contras financièrement et militairement."
 CIA_CONTRA80.4.d:0 "\"... Monsieur le Président, nous aimerions faire pression de manière informelle sur la Colline pour qu'elle abroge l'amendement Boland via une autre résolution de la Chambre.\" Le chef de cabinet de la Maison Blanche [GetCurrentCoS] a fait signe à un mémo qui avait été placé sur le bureau Resolute, où était assis le président [USA.GetLeader].\n\nLe directeur du renseignement central [GetCurrentCIADir] hocha la tête. \"Nous l'avons lancé à Langley et avons décidé que c'était la meilleure option pour faire face à notre opposition majeure aux Contras au Congrès.\"\n\n\"Je vois.\" » Déclara le président en regardant les deux hommes. \"Le seul problème réside dans la personne que nous pouvons contacter et qui serait prête à en rédiger et à le parrainer. Le vote pour l'amendement Boland a été de 411 contre 0, soit presque à l'unanimité. Les chances ne sont pas en notre faveur, messieurs.\"\n\nLes deux hommes hochèrent la tête. \"Nous y avons pensé, Monsieur le Président.\" Le chef de cabinet a commencé. \"Il y a quelques membres qui seraient disposés à parrainer une résolution de la Chambre, y compris le député Newt Gingrich, de Géorgie, qui a été réceptif à des propositions similaires dans le passé.\"\n\n\"Excellent travail, les hommes. Contactez son bureau et dites-lui que nous avons besoin de son aide. Il a déjà soutenu certains de nos problèmes, donc je pense qu'il sera aimable cette fois-ci.\" Ils acquiescèrent à nouveau. \"Oui, Monsieur le Président.\""
 CIA_CONTRA80.5.d:0 "Des nouvelles malheureuses sont venues de la Colline, puisque nos partisans, y compris le membre du Congrès Newt Gingrich de Géorgie, ont rapporté que la Chambre des Représentants avait essentiellement ignoré une demande de la Maison Blanche d'abroger l'Amendement Boland, le laissant mourir au sein d'un comité contrôlé par des membres anti-Contra.\n\nLa tentative de la Maison Blanche, essayant de respecter l'amendement controversé mais aussi de le faire échouer, n'est que l'un des nombreux échecs de l'administration visant à maintenir son emprise sur le Nicaragua sans s'attirer la colère du Congrès. Pour sa part, la Central Intelligence Agency a fait une rare déclaration dans laquelle elle a condamné le Congrès pour avoir « refusé injustement et sans motif toute assistance aux combattants anticommunistes de la liberté au Nicaragua ».\n\nAvec cette évolution, on ne sait pas exactement comment l'administration va procéder. Certaines sources ont indiqué que la CIA poursuivrait ses opérations secrètes au Nicaragua en violation de l'Amendement Boland, tandis que d'autres ont déclaré qu'elles pourraient simplement y mettre un terme."
 CIA_CONTRA80.6.d:0 "ALTERNATIVES AU SOUTIEN NICARAGUAYEN\nBureau du Nicaragua, Bureau des opérations latino-américaines, Direction des opérations\nSECRET/NOFORN\n\nAvec l'approbation ultérieure de l'Amendement Boland par la Chambre des Représentants, limitant de fait la CIA de dépenser des fonds ou de mener des opérations au Nicaragua pour soutenir les Contras, l'Agence a eu du mal à trouver des alternatives potentielles pour continuer à soutenir les objectifs opérationnels et stratégiques au Nicaragua et dans la région environnante. Vous trouverez ci-dessous plusieurs propositions de formes alternatives de maintien des opérations :\n\n1. Créer des organisations écrans ou « écrans », des sociétés factices ou de fausses sociétés, afin d'acheminer l'aide et les armes vers les Contras, sans réellement dépenser les fonds réservés à la CIA. Cela pourrait prendre la forme d'entreprises de transport aérien, maritime ou logistique, ainsi que d'organisations humanitaires et/ou culturelles.\n\n2. Coopérer avec la Western Goals Foundation, qui est une agence de renseignement privée et non gouvernementale active avec des objectifs et des idéaux anticommunistes très similaires. La Fondation, fondée par le major-général John Singlaub, bénéficie également du soutien du député Larry McDonald, un fervent partisan de notre cause. Ceci est presque garanti pour permettre à la CIA de maintenir ses opérations tout en imputant la responsabilité principale aux objectifs occidentaux.\n\n3. Une dernière alternative serait de vendre discrètement des armes à l'Iran. Ce faisant, les États-Unis libéreraient les otages pris par les Iraniens et établiraient une relation stratégique plus solide avec l'Iran. Même si cela n'a aucun rapport avec les intérêts immédiats, la vente d'armes à l'Iran donnera à la CIA des fonds qui pourront être utilisés pour acheter des armes du bloc de l'Est sur un marché disponible, qui seront ensuite utilisées pour fournir des munitions aux Contras. Cela normalisera sur le plan opérationnel les armes utilisées dans le conflit et garantira que les Contras seront mieux protégés car ils n'utilisent pas d'armes occidentales.\n\nUne combinaison de ces propositions garantira que les Contras nicaraguayens ne soient pas coupés du soutien et de l'aide américains ; et bien qu'ils violent techniquement l'Amendement Boland, le Congrès a peu de pouvoir d'application à cet égard et ne remarquera probablement pas d'activité secrète à moins que cela ne leur soit clairement indiqué."
 CIA_CONTRA80.7.d:0 "Dans un entrepôt à l'extérieur de Newport, dans le Delaware, une nouvelle entreprise emménageait dans ses bureaux. L'encre était à peine sèche sur leur accord de constitution dans l'État du Delaware, un État réputé favorable aux entreprises et doté de lois simples pour la création de sociétés ; un panneau de taille moyenne, quelque peu visible, indiquant « INTER-AMERICA TRANSPORT CORPORATION » était accroché à la porte. Il y avait des tas et des tas de cartons de déménagement, de cartons de transport, de cartons de banquiers, tous cachés dans les bureaux et dans l'entrepôt. Une fois le bureau installé, ils inscrivaient le numéro de téléphone de la société dans l'annuaire téléphonique pour ne pas attirer les soupçons, mais le numéro parvenait simplement à un centre d'appels au Kansas, où il était abandonné. Ce n'était pas une entreprise ordinaire.\n\nÀ la sortie de l'Interstate 95, un petit convoi sans prétention de berlines, toutes noires avec des vitres teintées, garé sur le parking devant l'entrepôt. Le trajet avait été long depuis Langley, mais ils étaient heureux de ne pas avoir à prendre l'avion. Sortant des voitures, ils se dirigèrent vers l'entrepôt, regardant plusieurs palettes empilées remplies de marchandises que la Société gérait : au lieu de services de fret généraux, cette « Société de Transport Interaméricaine » faisait de la contrebande d'armes. Les hommes ont regardé un chariot élévateur passer devant eux, transportant une palette de fusils AK-47 dans des caisses, la déposant dans la baie marquée \"TO CONTRAS\".\n\nCe modeste entrepôt, situé à proximité d'une usine chimique et dans une zone industrielle du nord du Delaware, allait bientôt devenir l'un des plus grands points de transfert d'armes de tout l'hémisphère occidental. De là, les armes américaines seraient expédiées en Iran par bateau, échangées contre des prisonniers libérés publiquement et payées en dollars américains qui seraient ensuite utilisés pour se procurer des armes du bloc de l'Est auprès de revendeurs réputés derrière le rideau et en Afrique. Ces armes seraient renvoyées au Delaware, où elles monteraient bientôt à bord d'un avion L-100 ou d'un petit bateau pour être envoyées au Nicaragua pour aider les combattants de la liberté du monde entier. Et le meilleur ? Tout cela était confidentiel, sauf pour les plus hauts fonctionnaires et le personnel navigant, le tout sous le regard vigilant et ignorant du Congrès."
 CIA_CONTRA80.8.d:0 "LA FONDATION ET LA COOPÉRATION DES OBJECTIFS OCCIDENTAUX\nBureau du Nicaragua, Bureau des opérations latino-américaines, Direction des opérations\nSECRET/NOFORN\n\nLa Western Goals Foundation (WGF), un groupe de réflexion anticommuniste et sur la sécurité intérieure et le renseignement, a été particulièrement active ces dernières années et a attiré l'attention des hauts responsables de la CIA comme étant potentiellement utile dans certaines opérations, notamment, mais sans s'y limiter, en Iran et au Nicaragua. Vous trouverez ci-dessous d'éminents responsables et fondateurs du WGF, ainsi que des propositions de collaboration avec la communauté du renseignement des États-Unis.\n\n1. Le fondateur du WGF, le major-général John Singlaub, est connu de la CIA en tant que membre fondateur de l'Agence, ainsi que vétéran décoré de la Seconde Guerre mondiale qui a travaillé avec des groupes de la Résistance française pendant et après le jour J. Singlaub a brièvement servi comme chef d'état-major des forces américaines en Corée, avant de prendre sa retraite et de former la Western Goals Foundation avec le membre du Congrès Larry McDonald (voir ci-dessous). Singlaub exerce une grande influence dans les cercles du renseignement américain et est membre du Conseil des États-Unis pour la liberté mondiale, une organisation anticommuniste aux identités similaires.\n\n2. Le membre du Congrès Lawrence (Larry) McDonald (démocrate, 7e district de Géorgie) est également l'un des principaux fondateurs et bienfaiteurs du WGF. McDonald est membre de la Chambre des représentants des États-Unis depuis les élections au Congrès de 1974 et a jusqu'à présent conservé l'un des records de vote les plus conservateurs et anticommunistes au sein de cette instance. McDonald a fortement soutenu les activités de la CIA dans le passé et son soutien continuera probablement, tout en maintenant une ligne d'accès au Congrès pour faire avancer les intérêts du renseignement.\n\nNous pensons qu'avec l'aide de ces deux personnalités, la coopération entre la CIA et Western Goals permettra une forme plus « légitime » d'envoi d'aide aux forces Contra nicaraguayennes, par opposition à d'autres alternatives. Western Goals est composé d'anciens responsables militaires et du renseignement, qui comprennent tous la complexité de la situation actuelle. La coopération devrait commencer immédiatement."
 CIA_CONTRA80.9.d:0 "C'était une nuit froide dans la ville de Dogubeyazit, en Turquie, alors qu'un convoi de camions traversait la route nationale turque D.100, en direction de l'est, après avoir complètement traversé le pays depuis la ville occidentale d'Izmir, plus précisément la base aérienne de Cigli.\n\nTandis qu'ils avançaient en trombe vers la frontière iranienne, les camions se sont arrêtés au village de Gurbulak, dernier arrêt avant la frontière. Ils n'allaient jamais traverser et, assis sur un terrain vague juste à l'extérieur du village, les chauffeurs attendaient qu'un groupe de camions presque identiques, également banalisés, s'approche du point de rendez-vous.\n\nLangley avait suggéré qu'ils se réunissent dans un endroit plus peuplé afin de faire aboutir l'accord, mais le chef de station à Ankara avait suggéré que la Turquie rurale se trouve près de la frontière la nuit afin de ne pas attirer davantage l'attention. Les agents, tous des chauffeurs, avaient décidé d'aller jusqu'au bout et, alors qu'ils étaient assis, ils ont vu six camions lourds s'approcher du poste de contrôle frontalier iranien, avec un véhicule d'état-major devant eux. En les voyant approcher, les agents sont sortis, allumant des cigarettes et commençant à baisser les hayons et à ouvrir les portes de leurs camions. Quelques-uns se tenaient là avec des fusils pour protéger la zone, tandis que les autres se préparaient.\n\nIl y avait peu de discussions, voire rien ; la plupart des détails avaient été planifiés à l'avance par les hauts responsables des deux parties. En échange de 20 missiles antichar BGM-71 TOW, les Iraniens paieraient environ 500 000 dollars en espèces, en dollars américains. Les agents ne savaient pas d'où ils tenaient cela, mais ils obtiendraient les missiles. Pendant qu'ils regardaient, un officier iranien, sans uniforme, a posé par terre deux porte-documents remplis d'argent et, pendant qu'ils l'examinaient, les missiles, dans leurs caisses, ont commencé à être déchargés et acheminés vers les camions iraniens.\n\nC'était vraiment aussi simple que cela. L'agent principal, le conducteur principal, a demandé si les Iraniens savaient comment faire fonctionner les missiles TOW. L'officier a dit oui, et c'est tout. Les agents avaient leur argent, et le chef de station à Ankara aurait une autre dépêche cryptée à envoyer à Langley dans la matinée ; avec l'argent liquide dans une valise diplomatique, bien sûr."
 CIA_CONTRA80.10.d:0 "LES OTAGES POUR LE PROBLÈME DES ARMES: PROPOSITION\nBureaux Iran et Liban, Bureau d'analyse du Proche-Orient, Direction du renseignement ; Direction des Opérations\nSECRET/NOFORN\n\nAu milieu de la crise libanaise et de la guerre civile qui ont suivi, les États-Unis ont été entraînés à tenter de jouer un rôle de médiateur dans une crise qui leur est propre dans la région ; sept Américains, sur un total estimé d'une centaine d'otages, capturés par le groupe terroriste Hezbollah au Liban. Les services de renseignement américains ont déterminé que le Hezbollah continue d'être soutenu politiquement et financièrement par la nouvelle République islamique fondamentaliste d'Iran, elle-même impliquée dans un conflit sanglant avec son voisin du sud de l'Irak.\n\nLes bureaux Iran et Liban, avec des conseils extérieurs, ont proposé un plan visant à maintenir l'Iran dans la sphère d'influence occidentale tout en libérant les otages américains dans le processus. Avec l'aide de Manucher Ghorbanifar, un ancien marchand d'armes iranien, les États-Unis proposeront des ventes d'armes à l'Iran pour réaliser les objectifs suivants :\n\n1. La vente des missiles antichar et sol-air TOW et HAWK générera des bénéfices qui, en dehors des restrictions budgétaires stipulées par l'amendement Boland, pourront être utilisés pour financer les Contras nicaraguayens et d'autres groupes que les États-Unis aimeraient soutenir mais se heurtent à l'opposition du public ou du Congrès.\n\n2. En échange de la fourniture des missiles, l'Iran sera obligé de garantir que les otages seront libérés par le Hezbollah, car ils disposent d'une influence et d'un soutien suffisamment importants pour lancer le feu sur les opérations du Hezbollah, en particulier si elles dépendent des ventes d'armes américaines.\n\n3. Enfin, fournir des armes aux Iraniens leur permettra de devenir militairement plus dépendants de nous, empêchera le gouvernement iranien de vendre des armes au bloc soviétique et leur donnera un avantage tactique mineur dans la guerre Iran-Irak qui s'ensuivra.\n\nNous pensons que cette proposition, menée de manière extrêmement secrète, apportera des avantages à presque toutes les parties concernées : les États-Unis bénéficieront d'une plus grande influence et du retour des otages, ce qui sera un avantage pour l'administration actuelle ; L'Iran recevra les armes dont il a besoin pour renforcer ses capacités ; et les Contras recevront un financement provenant des bénéfices des ventes d'armes à l'Iran."
 CIA_CONTRA80.11.d:0 "Par des canaux secrets, des agents de la Central Intelligence Agency des États-Unis ont fait une offre cruciale à notre gouvernement. Actuellement, sept Américains sont retenus en otages au Liban par le Hezbollah, un groupe que nous soutenons politiquement, militairement et financièrement. La Maison Blanche, dans sa tentative de se remettre du désastre qu'elle a connu lors de la révolution iranienne de 1979, tente de récupérer ces otages et de sauver la face au niveau national comme international.\n\nDes agents de la CIA ont proposé de fournir des armes à l'Iran, telles que des missiles antichar BGM-71 TOW et des missiles sol-air HAWK, si nous pouvons garantir et faciliter la libération des sept Américains.\n\nLes membres de notre gouvernement et du Corps des Gardiens de la révolution restent divisés sur la question. Garder les otages pourrait fournir une plus grande influence à l'avenir, tandis que la préoccupation immédiate, sur le plan militaire, est d'augmenter nos capacités au milieu de notre guerre contre l'Irak, et que l'utilisation d'équipements américains fournirait un avantage tactique par rapport à la réception d'armes et d'aide du bloc soviétique. Comment devrions-nous choisir ?"
 CIA_CONTRA80.12.d:0 "Des sources de Téhéran ont répondu à nos agents en acceptant que l'Iran libérerait les sept otages américains après avoir reçu un « nombre suffisant » de missiles TOW et HAWK. Bien que les chiffres restent à déterminer et qu'il s'agisse d'une opération secrète, qui ne doit pas être vue aux yeux du public ou du Congrès, cela représente une victoire majeure pour les États-Unis dans leurs relations avec le nouveau régime islamiste iranien.\n\nLe directeur du renseignement central [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] ont été informés et prévoient d'informer prochainement le président [USA.GetLeader] des développements."
 CIA_CONTRA80.13.d:0 "Des sources de Téhéran ont répondu à nos agents en rejetant explicitement toute offre « d'armes contre des otages » de la part des États-Unis. Bien qu'ils n'aient pas fait de déclaration publique comme on pourrait s'y attendre de la part du régime iranien fondamentaliste islamiste anti-américain, les Iraniens ont rejeté toute offre de ce type, semblant déterminés à garder les sept otages américains pour avoir plus de poids sur les questions ultérieures. Malgré le besoin évident d'armes à la suite de la guerre Iran-Irak, il est curieux que les Iraniens rejettent de tels missiles de haute technologie au moment où ils en ont besoin.\n\nLe directeur du renseignement central [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] ont été informés et prévoient d'informer prochainement le président [USA.GetLeader] des développements."
 CIA_CONTRA80.15.d:0 "UN ACCORD STRATÉGIQUE AVEC L'IRAN ?\nBureau Iran, Bureau d'analyse du Proche-Orient, Direction du renseignement\nSECRET/NOFORN\n\nLes interactions plus récentes des États-Unis avec le nouveau gouvernement iranien après la révolution iranienne de 1979 donnent à penser qu'une nouvelle compréhension stratégique pourrait être souhaitée afin de consolider l'Iran en tant que pays étroitement allié aux objectifs américains au Moyen-Orient.\n\nLe régime islamiste fondamentaliste, depuis 1979, a du mal à réinventer son image et sa réputation sur la scène mondiale et, selon des analyses récentes, il menace gravement d'être absorbé dans la sphère d'influence soviétique. Leur conflit actuel avec leur voisin du sud, l'Irak, menace également de déstabiliser davantage l'Iran et de rester déstabilisateur dans la majeure partie de la région du Moyen-Orient. Ayant accepté de dialoguer avec des agents et des responsables américains sur la question des otages libanais et les ventes d'armes proposées, ce bureau estime que proposer un projet d'accord stratégique avec le régime iranien entraînera un réchauffement des relations américano-iraniennes et protégera le pays d'une absorption par l'influence soviétique. L'entente devrait inclure les éléments suivants :\n\n1. Les États-Unis envisageront de reconnaître diplomatiquement la République islamique d'Iran si le gouvernement accepte de restituer tous les otages étrangers, s'excuse officiellement pour ses actions contre les responsables de l'ambassade américaine en 1979 et émet des protestations diplomatiques contre le personnel diplomatique soviétique et du bloc de l'Est.\n\n2. Les États-Unis, en plus de reconnaître la République islamique d'Iran, envisageront alors une aide humanitaire, économique et militaire limitée pour renforcer la production économique et la capacité militaire iraniennes, ainsi que pour subvenir aux besoins du peuple iranien, si le gouvernement iranien accepte d'envisager des négociations avec des responsables du gouvernement irakien, ainsi que des réformes intérieures avec des orientations religieuses moins strictes.\n\n3. Si la République islamique d'Iran refuse de restituer les otages, d'expulser diplomatiquement les responsables soviétiques, de négocier avec l'Irak ou d'envisager des réformes intérieures, les États-Unis n'accorderont aucune reconnaissance ni aide sous quelque forme que ce soit, à commencer par des livraisons d'armes.\n\nNous appelons instamment à la coopération du Département d'État à cet égard, mais recommandons que toutes les négociations sur cet accord stratégique se déroulent pour le moment en secret afin d'éviter tout retour de bâton politique suite à d'éventuels échecs."
 CIA_CONTRA80.16.d:0 "Les responsables américains, sous le couvert de la Central Intelligence Agency, ont contacté certains de nos diplomates et hauts responsables du gouvernement pour proposer un nouveau changement dans les relations américano-iraniennes, qualifié d'« entente stratégique ».\n\nLes Américains ont proposé de reconnaître diplomatiquement notre gouvernement et de rétablir des relations diplomatiques limitées si notre gouvernement acceptait de libérer tous les otages étrangers, de s'excuser pour le siège de l'ambassade américaine en 1979 et de lancer des protestations diplomatiques contre le personnel de l'ambassade soviétique, dont ils craignent qu'il tente d'influencer notre gouvernement.\n\nLes Américains offrent également une aide, principalement militaire et humanitaire, si notre gouvernement accepte d'entamer des négociations avec l'Irak, avec lequel nous sommes en conflit acharné, et envisage des réformes intérieures visant à supprimer les règles religieuses strictes dans notre société. Les Américains ont clairement fait savoir que si nous n'adhérons pas, aucune aide ne sera fournie, ni aucune reconnaissance diplomatique.\n\nLes personnalités de notre gouvernement restent divisées sur la question. Les membres les plus radicaux de notre gouvernement affirment continuellement qu'adhérer aux Américains irait à l'encontre de l'objectif même de la Révolution et que le « Grand Satan » régnerait à nouveau sur nous. Cependant, certains modérés ont fait valoir que ce que les États-Unis proposent est acceptable et contribuera à reconstruire une partie de l'image du pays. Comment allons-nous choisir ?"
 CIA_CONTRA80.17.d:0 "Téhéran a répondu que les partisans de la ligne dure du gouvernement iranien avaient rejeté toute tentative de réorientation stratégique avec les États-Unis.\n\nMalgré nos promesses assez lourdes de reconnaissance diplomatique et d'aide en matière d'armement, les Iraniens n'ont pas bien accueilli les demandes de libération des otages, de négociation avec l'Irak et de poursuite des réformes intérieures. Plutôt que de lancer une démarche privée, les Iraniens ont publié une déclaration condamnant nos actions comme « une nouvelle tentative du Grand Satan, les États-Unis d'Amérique, d'interférer dans nos affaires intérieures et de placer toute la région du Moyen-Orient sous son hégémonie ». Il semble que les Iraniens se dirigent vers le bloc d'influence soviétique, même si les informations à ce sujet ne sont pas entièrement connues.\n\nLe directeur du renseignement central [GetCurrentCIADir], le conseiller à la sécurité nationale [GetCurrentNatSecAdv]et le chef d'état-major de la Maison Blanche [GetCurrentCoS] ont tous été informés et se préparent avec colère à informer le président [USA.GetLeader] et le vice-président [GetCurrentVP] en ce moment même."
 CIA_CONTRA80.18.d:0 "Téhéran a répondu que les modérés du gouvernement iranien avaient accepté la proposition américaine de « réorientation stratégique » entre les États-Unis et l'Iran.\n\nConfirmé par le chef de station à Bagdad, étant le responsable le plus proche de l'Iran, les Iraniens ont apparemment accepté au moins une libération d'otages et quelques protestations et expulsions de responsables soviétiques et du bloc de l'Est. En échange, les États-Unis ont accepté de reconnaître diplomatiquement la République islamique, amorçant au moins un véritable réchauffement des relations diplomatiques.\n\nLe secrétaire d'État [GetCurrentSecState], le directeur du renseignement central [GetCurrentCIADir]et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] ont été informés des développements et prévoient d'informer le président et le vice-président dès que possible."
 CIA_CONTRA80.19.d:0 "A Miami, le L-100 a de nouveau atterri. Glenn se frotta les yeux pendant qu'il roulait, vérifiant sa montre. Il était deux heures du matin et il revenait tout juste du Honduras. Il était prêt à se coucher et à prendre quelques jours de congé. Bon sang.\n\nÀ des milliers de kilomètres de là et quelques heures plus tard, le soleil se levait sur la fenêtre du bureau du chef de cabinet de la Maison Blanche. Non seulement [GetCurrentCoS] était assis là, en sirotant un café, mais le DCI [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv]aussi. Leur conversation était parfaitement ordinaire. Chaque fois qu'un vol cargo revenait, on le leur disait. Juste au bout du couloir, dans l'Ovale, étaient assis le président et le vice-président, examinant leur agenda de la journée. Parfaitement ordinaire, comme tout devrait l'être.\n\nÀ seulement quelques heures de route de l'Interstate 95, l'entrepôt de Newport, dans le Delaware, était tout aussi animé. Des semi-remorques du Nord-Est venaient d'arriver, remplis d'AK-47 nouvellement achetés et d'autres armes du bloc soviétique ; et en moins d'une heure, ces mêmes camions, désormais remplis de M-16 et de missiles TOW, reprenaient la route vers différents ports, cette fois dans le Sud. Différents camions viendraient plus tard pour transporter les armes soviétiques à Miami, où elles seraient acheminées par avion.\n\nÀ des milliers de kilomètres au sud, une unité Contra venait tout juste de se réveiller après avoir dormi quelques heures après des opérations nocturnes. En chargeant, ils se trouvaient à proximité d'un quartier général de commandement supérieur et ont donc décidé de s'enregistrer. À leur grande surprise, ils ont vu de nouvelles caisses qui devaient avoir été apportées par les Honduriens. En saisissant les nouvelles armes et munitions, le commandant savait que son équipe en serait ravie.\n\nIl s'agissait d'un système massif et vaste, mais qui restait secret."
 CIA_CONTRA80.20.d:0 "\"PUTAIN!\" Le DCI, criant [GetCurrentCIADir] dans le grand air de son bureau, regardant à la fois les briefings sur son bureau et le journal ouvert devant lui, s'est tourné vers un grand article sur « LE TRAFIC D'ARMES DANS LE DELAWARE RÉVÉLÉ ».\n\nDécrochant le téléphone, il appela le bureau du conseiller à la sécurité nationale, qui fut immédiatement connecté. [GetCurrentNatSecAdv] décroché. \"Bonjour?\"\n\n\"Avez-vous LU le Washington Post ce matin ? Nous sommes tellement foutus. Ils ont trouvé l'entrepôt dans le Delaware. Bientôt, ils vont découvrir les itinéraires des avions et des navires, toute la documentation là-bas mentionne les navires.\"\n\n\"Putain. Nous devons essayer de limiter les dégâts. Appelez l'État, nous commencerons à publier des déclarations sur notre engagement en faveur du contrôle des armes ainsi que sur les Contras et commencerons une enquête du FBI. Dites à tout le monde à Southern Air Transport qu'ils seront peut-être les prochains. Arrêtez les vols jusqu'à ce que ça explose. Dites à quelqu'un de mettre les Iraniens au courant, et nous devons le dire aux Contras pour qu'ils ne soient pas en colère. \"\n\n\"D'accord. Putain, mec, c'est mauvais. Tu dois briefer le président maintenant. Assure-toi qu'il n'empire pas les choses. Bon Dieu, ça va être une longue journée.\""
 CIA_CONTRA80.21.d:0 "Nos contacts au Capitole, y compris le représentant Newt Gingrich, ont réussi à faire pression, à rédiger et à adopter une résolution de la Chambre abrogeant l'amendement Boland, qui a été adopté par la Chambre il y a plusieurs mois.\n\nL'Amendement Boland, qui avait été adopté à l'origine pour mettre fin à l'implication des services de renseignement de la CIA et au financement des activités au Nicaragua visant à soutenir les Contras nicaraguayens anticommunistes, a grandement irrité de nombreuses personnalités de la Maison Blanche, de la communauté du renseignement et du réseau de défense, car il allait à l'encontre des objectifs stratégiques américains en Amérique latine. L'abrogation de l'amendement permettra à la CIA, ainsi qu'à d'autres agences et départements de renseignement, de poursuivre leurs opérations de soutien aux forces Contra pour faire avancer les intérêts américains.\n\nLe représentant Gingrich, qui a dirigé l'abrogation à la Chambre, a reçu les félicitations et les remerciements du président [USA.GetLeader] pour son travail, et devrait être utilisé à l'avenir par les responsables de l'administration pour faire avancer d'autres textes législatifs ou abroger."
 CIA_CONTRA80.22.d:0 "Alors que le L-100 atterrissait à Soto Cano pour la première fois depuis plus de quelques semaines, le capitaine Thomas Glenn soupira, déplaçant le manche de commande pour rouler jusqu'à son hangar habituel, hors de vue. Il était heureux d'être de retour après de longues vacances (et non payées), mais ce vol était très courant pour lui à ce stade.\n\nAprès avoir garé l'avion, Glenn est sorti, regardant son copilote, l'arrimeur, sortir par la rampe arrière, un presse-papiers à la main, parlant aux soldats américains et honduriens qui se tenaient là, vérifiant. Glenn s'est approché, faisant un signe de tête aux hommes, les passant pour voir si l'officier exécutif (XO) du détachement américain était dans son petit coin d'un « bureau ».\n\nLe XO était un major, commandant adjoint de donner ou prendre, une centaine d'hommes affectés à la base pour assurer la sécurité, la liaison avec les Honduriens et la manutention des avions. Il y avait bien plus que cette compagnie, en fait, un centre d'entraînement spécial à la guerre à Soto Cano qui soutenait la Force opérationnelle interarmées Bravo, le commandement supérieur ici au Honduras. Il sirota un café tout en continuant à feuilleter certains rapports tandis que Glenn entrait dans son bureau.\n\n\"Bonjour, Major.\" Glenn esquissa un sourire, \"saluant\" avec deux doigts sa vieille casquette de baseball des Orioles de Baltimore. \"Comment se passe la fête à Soto Cano ? Tu sais que je ne suis pas venu ici depuis quelques semaines.\"\n\n\"Cela a été pour le moins chaotique. Des Contras de haut rang sont arrivés pour réclamer des armes et mes hommes ont dû les renvoyer parce que les idiots de Washington ont arrêté les livraisons à l'improviste.\"\n\nGlenn hocha la tête. \"Ouais, je sais, ces connards du Congrès m'ont mis au chômage pendant quelques semaines. Je ne peux pas dire que Southern Air Transport ne prend pas soin de lui-même. J'ai réussi à tenir le coup.\" Il déposa le manifeste de chargement. \"Voici votre premier envoi. Je suppose que nous devons faire demi-tour et sortir d'ici dans, disons, 3 heures ?\n\n\"Ouais, Tom.\" Le major baissa les yeux sur le manifeste. \"Waouh, sympa. Beaucoup d'AK-47, quelques RPG, quelques mines antipersonnel. Je suppose que les plus gros vaisseaux arriveront bientôt avec des véhicules ? C'est ce que les cuivres m'ont indiqué. »\n\nGlenn haussa les épaules. \"Je n'en ai aucune idée. SAT est structuré de manière très indépendante. Je suppose qu'ils ne veulent même pas que je sache ce que je transporte moi-même, et encore moins ce que les autres vols apportent. »\n\nLe major fronça les sourcils. \"D'accord. Eh bien, bon retour. Procurez-vous une tasse de café et une collation et l'avion sera déchargé dans l'heure. » Il sourit et hocha la tête tandis que Glenn lui faisait signe et quittait le bureau, voyant les soldats décharger les caisses d'armes."
 CIA_CONTRA80.23.d:0 "Il était tôt le matin alors que le cargo battant pavillon danois MS Erria s'amarrait lentement à un quai du port de Puerto Cortés, sur la côte nord des Caraïbes du Honduras, tout juste après un long voyage depuis le port de Cherbourg, en France.\n\nSon équipage était fatigué ; la plupart d'entre eux étaient des marins marchands danois, mais quelques-uns étaient des Américains, vraisemblablement servant de liaison, mais payés par Langley. L'Erria ne mesurait qu'environ 150 pieds de long et les mers de l'Atlantique n'avaient pas été tendres avec lui. Ils étaient heureux d'être enfin arrêtés.\n\nLeur destination finale, du moins pour ce voyage, devait être Wilmington, en Caroline du Nord, mais ils s'y sont arrêtés pour une autre raison. Le manifeste indiquait qu'ils transportaient des bananes et d'autres produits agricoles vers les États-Unis, mais la cargaison qu'ils déchargeaient n'était pas claire. Dans la cale du cargo, ainsi que dans de petits conteneurs d'expédition, se trouvaient ce qu'ils pensaient être des véhicules. Aucun membre de l'équipage ne le savait, et ils ne le sauraient probablement jamais. Même le capitaine ne le savait pas.\n\nDes soldats honduriens sont apparus, visiblement un petit détachement de la patrouille portuaire. Après avoir inspecté le cargo et fouillé les conteneurs, ils allèrent parler au second, un des Américains à l'air suspect qui les accompagnait depuis des mois.\n\nAprès une brève conversation, les soldats ont commencé à diriger les Danois, leur demandant de soulever ce qu'ils pouvaient transporter ou d'utiliser des chariots élévateurs pour retirer les caisses du navire et les placer sur un quai de chargement. Bientôt, un camion viendrait le transporter jusqu'à une base militaire voisine où les caisses seraient déballées et assemblées.\n\nL'un des marins, prenant un moment après avoir utilisé intensivement le chariot élévateur, s'est arrêté pour jeter un nouveau coup d'oeil au manifeste d'expédition. La cargaison à destination de Puerto Cortés indiquait « RENAULT AUTOMOBILE », mais il savait que ce n'était pas ce qu'il y avait dans ces conteneurs.\n\nAprès le chargement, les soldats ont de nouveau rencontré l'Américain, lui ont serré la main et ont signé un nouveau morceau de papier, que les Danois n'avaient jamais vu auparavant. Alors que les marins s'affairaient à nouveau à recharger le navire en bananes, ils remarquèrent qu'une des caisses était ouverte par une escouade de soldats honduriens. À l'intérieur se trouvait une jeep. Il y avait aussi des caisses plus petites, pleines d'objets ressemblant à des tubes, marquées STINGER sur le côté. Curieux."
 CIA_CONTRA80.24.d:0 "Dans un centre de commandement éloigné, quelque part dans la jungle nicaraguayenne, était assis un commandant supérieur de la Contra. Une opération majeure était sur le point d'avoir lieu et alors qu'il vérifiait sa montre, ses hommes commencèrent à suivre leurs ordres.\n\nÀ une heure cinq minutes, presque dans tout le pays, les choses ont commencé à exploser. Quelques tronçons du réseau routier nicaraguayen, certains contenant des bus bondés, se sont effondrés. Les quais des ports de San Juan del Sur et de Puerto Cabezas se sont enlisés dans la mer. Les quelques trains restants sur le réseau ferroviaire nicaraguayen, à peine utilisé, ont ralenti jusqu'à l'arrêt lorsque leurs ingénieurs ont remarqué que les rails avaient été réduits en morceaux devant eux. Divers bâtiments gouvernementaux à Managua, notamment le quartier général de l'armée nicaraguayenne, ont également été bombardés.\n\nEt juste comme ça, les saboteurs ont disparu dans la nuit, dans la jungle, pour n'être vus que par les autres Contras et leurs agents de la CIA. Le commandant était assis dans son bunker, branché sur Radio Sandino, contrôlée par le FSLN, et écoutait les nouvelles. Le pays et le gouvernement paniquaient désormais. Excellent."
 CIA_CONTRA80.25.d:0 "Le ministre de l'Intérieur, ainsi que le chef d'état-major de l'armée nicaraguayenne, ont confirmé qu'une récente série d'efforts de sabotage contre nos infrastructures et nos capacités militaires ont été perpétrés par l'intermédiaire des Contras et, dans certains cas, directement par les États-Unis.\n\nDes rapports provenant de tout le pays indiquent que les États-Unis et leurs combattants par procuration, qui sont des traîtres à notre régime, ont intensifié leur campagne de sabotage ; ciblant les routes, les autoroutes nationales, les voies ferrées, nos ports, nos aérodromes et certains bâtiments gouvernementaux à Managua.\n\nNous devons être toujours vigilants pour surveiller nos infrastructures critiques et nos déploiements militaires afin de maintenir la préparation opérationnelle et la sécurité nationale afin de protéger le peuple nicaraguayen du terrorisme des Contras et de leurs bienfaiteurs américains."

 # CIA Condor - Dirty War
 CIA_CONDOR.0.d:0 "OPÉRATION CONDOR : RÉSUMÉ OPÉRATIONNEL\nBureau des opérations latino-américaines, Direction des opérations, CIA\nSECRET/NOFORN\n\nL'Opération Condor, également connue sous le nom de Plan Condor, est en bref un effort de coopération des services de renseignement et de sécurité de plusieurs pays d'Amérique du Sud pour lutter contre le terrorisme et la subversion à l'échelle régionale.\n\nComposé principalement d'Argentine, du Chili, du Brésil, du Paraguay, de l'Uruguay et de la Bolivie, Condor a pour objectif déclaré des opérations de contre-insurrection à l'échelle transnationale, notamment avec la coopération en matière de renseignement de la Secretaría de Informaciones de Estado (SIDE) argentine et de la Direction de Inteligencia Nacional (DINA) chilienne. Condor a reçu par le passé le soutien de la CIA et de la DIA, ainsi que le soutien militaire de l'USSOUTHCOM dans sa composante militaire, qui implique des services de liaison et de communication entre les régimes militaires.\n\nCondor a été initialement créée au début des années 1970 et officialisée en 1975 à Santiago, au Chili ; et a commencé des opérations secrètes plus tard cette année-là. Certaines opérations, qui nous ont été signalées par des membres du Condor, incluent la surveillance de dissidents chiliens et uruguayens, l'assassinat du général chilien pro-Allende Carlos Prats et de son épouse, ainsi que du leader chrétien-démocrate chilien Bernardo Leighton. Les chefs de station de la CIA à Santiago, Brasilia et Montevideo ont joué un rôle déterminant dans la fourniture de services de liaison, de formation et de conseil aux agences de renseignement, aux services militaires et aux agences de police du Condor.\n\nLa politique américaine déclarée par Foggy Bottom et Langley a toujours été d'agir avec Condor dans le cadre d'une formation et de conseils limités, mais de ne pas s'engager directement dans des opérations secrètes, laissant cela aux membres de Condor. Les États-Unis ont maintenu et continueront de maintenir un déni plausible en ce qui concerne leur implication dans les opérations du Condor et l'utilisation des installations américaines pour soutenir les membres du Condor, par exemple en matière de formation et de soutien aux communications."
 CIA_CONDOR.1.d:0 "OPÉRATIONS ANTI-INSURRECTIONNELLES EN ARGENTINE\nBureau Argentine, Bureau des opérations latino-américaines, Direction des opérations, CIA ; AMBASSADE DE BUENOS AIRES\nSECRET/NOFORN\n\nDepuis le milieu de l'année 1974, sous l'ancien gouvernement d'Isabel Peron, veuve du défunt président Juan Peron, les opérations anti-insurrectionnelles en Argentine se poursuivent au moment de la rédaction de ce rapport. Malgré le coup d'État de 1976 mené par l'armée argentine, qui a instauré le processus de réorganisation nationale, les opérations se poursuivent et semblent légèrement plus efficaces que les années précédentes.\n\nLutter principalement contre les guérilleros de gauche, notamment l'Armée populaire révolutionnaire (ERP), les péronistes Monteneros, les mouvements syndicalistes et les exilés chiliens pro-Allende ; la « sale guerre », comme l'appelle l'armée argentine, implique presque tous les services de sécurité ; y compris l'armée, la police fédérale, la Secretaría de Informaciones de Estado (SIDE) et un paramilitaire pro-junte connu sous le nom d'Alianza Anticomunista Argentina (AAA).\n\nLa politique américaine actuelle dicte le soutien au processus de réorganisation nationale dans le cadre d'une politique anticommuniste de grande envergure en Amérique latine. Cependant, certains responsables de Langley et de Foggy Bottom ont exprimé leur inquiétude quant au soutien excessif apporté à l'armée argentine, notamment en raison de sa participation à l'opération Condor avec d'autres pays d'Amérique du Sud. Un changement de politique pourrait s'avérer nécessaire pour modérer à l'avenir les intérêts et les désirs américains en Amérique du Sud."
 CIA_CONDOR.2.d:0 "Dans une tournure surprenante des événements, un porte-parole du Département d'État a confirmé aujourd'hui que les États-Unis allaient, à compter d'aujourd'hui, « mettre fin à tout soutien au processus de réorganisation nationale argentine » dans son intégralité, citant de nombreuses violations des droits de l'homme commises par la junte militaire argentine au pouvoir.\n\nCitant des meurtres transnationaux illégaux et d'autres atrocités commises contre leurs propres citoyens dans le cadre d'une prétendue opération connue sous le nom d'« Opération Condor », les États-Unis ont pris un brusque volte-face dans leur politique dans la région. On ne sait pas si des condamnations similaires seront appliquées au Chili, au Brésil, à l'Uruguay et à d'autres dictatures militaires sud-américaines, mais cette évolution reste particulièrement significative, notamment à Buenos Aires."
 CIA_CONDOR.3.d:0 "Une malheureuse nouvelle est parvenue de l'ambassade des États-Unis en Argentine selon laquelle la Maison Blanche et le Pentagone ont convenu conjointement de mettre fin au soutien aux paramilitaires que nous avons utilisés dans notre lutte contre la menace de gauche et communiste. Dans sa déclaration, l'ambassade a mentionné « ses inquiétudes concernant l'utilisation de l'Alianza Anticomunista Argentina dans des opérations militaires » ainsi que diverses allégations de violations des droits de l'homme par l'armée, l'AAA et d'autres paramilitaires pro-junte.\n\nIl s'agit d'une évolution totalement inattendue de la part de Washington, qui dans le passé a poussé à davantage d'activités anticommunistes de contre-insurrection et a secrètement fourni une assistance via les services de renseignement et les liaisons militaires ainsi que via le système Condor."
 CIA_CONDOR.4.d:0 "Une malheureuse nouvelle est parvenue de l'ambassade des États-Unis au Chili selon laquelle la Maison Blanche et le Pentagone ont convenu conjointement de mettre fin au soutien aux paramilitaires que nous avons utilisés dans notre lutte contre les guérilleros pro-Allende et communistes de gauche dans le pays. Dans sa déclaration, l'ambassade a mentionné « ses inquiétudes concernant l'utilisation de groupes paramilitaires de droite dans des opérations militaires » ainsi que diverses allégations de violations des droits de l'homme par le régime militaire au pouvoir et les groupes paramilitaires qu'il soutient.\n\nIl s'agit d'une évolution totalement inattendue de la part de Washington, qui dans le passé a poussé à davantage d'activités anticommunistes de contre-insurrection et a secrètement fourni une assistance via les services de renseignement et les liaisons militaires ainsi que via le système Condor."
 CIA_CONDOR.5.d:0 "Aujourd'hui, dans une déclaration surprenante, le secrétaire d'État américain [GetCurrentSecState] et le procureur général [GetCurrentAG] ont annoncé conjointement leurs efforts combinés pour traduire en justice les criminels de guerre nazis cachés en Amérique du Sud, via un groupe de travail interinstitutions, qui sera chargé de rechercher, de négocier et d'arrêter les responsables nazis résidant en Argentine, au Brésil, au Chili et dans d'autres pays d'Amérique du Sud ; y compris des personnages tristement célèbres comme Klaus Barbie, Sandor Kepiro, Erich Priebke et Dinko Sakic.\n\nIl n'y a pas encore eu de réaction de la part des régimes militaires d'Argentine, du Brésil et du Chili, mais on s'attend à ce que les Américains se heurtent à une forte résistance, car les gouvernements militaires ont accepté de cacher et de protéger les anciens nazis. On s'attend à ce que la Maison Blanche cherche à extrader des individus, soit pour les juger aux États-Unis, soit devant un tribunal international."
 CIA_CONDOR.6.d:0 "COLLABORATION AVEC D'ANCIENS RESPONSABLES NAZIS EN AMÉRIQUE DU SUD\nBureau Argentine, Bureau des opérations latino-américaines, Direction des opérations ; Attaché de défense américain, AMBASSADE DE BUENOS AIRES\nSECRET/NOFORN\n\nAlors que l'accent mis sur les opérations anti-insurrectionnelles dans le Cône Sud a été souligné ces dernières années comme la plus haute priorité de la politique américaine en Amérique du Sud, des discussions ont eu lieu dans les cercles de renseignement américains et dans les agences des membres sud-américains du Condor (SIDE argentin, DINA chilienne) sur d'éventuelles opportunités de cooptation et de coopération d'anciens responsables nazis vivant en Amérique du Sud.\n\nPar conséquent, le Bureau Argentine, avec le soutien de l'Ambassade de Buenos Aires et du Bureau de l'Attaché de Défense, soumet les propositions suivantes aux responsables nazis éminents du Cône Sud qui pourraient être contactés et utilisés à des fins opérationnelles :\n\n1. Klaus Barbie, surnommé le « Boucher de Lyon », lourd responsable des atrocités commises contre la Résistance française pendant la Seconde Guerre mondiale ; a été brièvement membre du contre-espionnage de l'armée américaine, qui l'a aidé à s'échapper en Bolivie. Il est actuellement employé par les services de renseignement ouest-allemands (BND) et est fortement impliqué dans le gouvernement militaire bolivien au pouvoir. Dans ce rôle, Barbie aurait participé à la traque de Che Guevara. Son influence au sein du gouvernement bolivien et son expérience en matière de contre-insurrection en font un candidat de choix pour la coopération.\n\n2. Erich Priebke, commandant de police SS de niveau intermédiaire pendant la Seconde Guerre mondiale, responsable du massacre de Rome en mars 1944 qui a fait 335 morts parmi les civils italiens. Priebke devait être jugé mais a réussi à s'échapper d'un camp de prisonniers britannique en Italie et vit actuellement à Bariloche, en Argentine, sous un nom d'emprunt. Priebke était communément connu comme un commandant compétent et pouvait être utilisé par les forces alliées pour soutenir les activités de police dans la région.\n\n3. Dinko Sakic, un responsable croate d'Ustase, qui était le commandant du camp de concentration de Jasenovac en Yougoslavie occupée, était un collaborateur déclaré des nazis et s'est enfui en Argentine, puis au Paraguay à la fin des années 1940. Il est un ami connu du général Alfredo Stroessner, dirigeant paraguayen, et est devenu l'un des dirigeants de la petite communauté émigrée croate du Paraguay et de la région. Son expérience des camps d'internement, ainsi que sa forte orientation anticommuniste, en font un candidat idéal pour la coopération, notamment au Paraguay.\n\nL'ambassade à Buenos Aires et ce bureau estiment que ces trois hommes, correctement trouvés et contactés, devraient apporter des bénéfices supplémentaires à l'engagement américain en Amérique du Sud, ainsi qu'au système Condor dans le Cône Sud."
 CIA_CONDOR.7.d:0 "De terribles nouvelles sont venues de l'ambassadeur des États-Unis, qui est arrivé aujourd'hui avec une équipe à La Casa Rosada pour informer le gouvernement militaire argentin que les États-Unis mettraient fin, avec effet immédiat, à tout soutien à la République argentine. Des inquiétudes ont apparemment été soulevées à Washington et ont circulé à la Maison Blanche, à Foggy Bottom et à Langley, quant à la portée et à la profondeur de la coopération américaine avec notre gouvernement, en particulier en ce qui concerne le soutien secret et le soutien contre-insurrectionnel dans nos opérations anticommunistes en cours.\n\nCela a suscité de vives réactions de la part d'éminents responsables de notre gouvernement, qui affirment que le processus de réorganisation nationale est allé trop loin dans ses opérations internes ainsi que dans sa participation à Condor. De nombreux officiers, même ceux qui ont reçu une formation et une scolarité militaires aux États-Unis, ont condamné Washington pour son insolence dans cette affaire et ont exhorté l'ambassade à reconsidérer sa déclaration. Cependant, il semble que les forces armées argentines ne recevront plus le soutien américain, à moins que nous ne parvenions à convaincre les Américains de nous reprendre."
 CIA_CONDOR.8.d:0 "Dans une déclaration sans surprise faite aujourd'hui à Washington, le secrétaire d'État américain [GetCurrentSecState], accompagné du conseiller à la sécurité nationale [GetCurrentNatSecAdv], a réaffirmé son engagement à soutenir le gouvernement militaire argentin, officiellement connu sous le nom de processus de réorganisation nationale.\n\nRéitérant « l'engagement des États-Unis à aider l'Argentine à combattre l'insurrection et les défis de sécurité transnationaux », le secrétaire d'État a confirmé au monde entier l'implication ouverte des États-Unis dans les affaires sud-américaines, donnant pratiquement un chèque en blanc à la junte argentine pour poursuivre sa brutale campagne de contre-insurrection."
 CIA_CONDOR.9.d:0 "Une heureuse nouvelle est arrivée de Washington aujourd'hui, puisque le secrétaire d'État américain [GetCurrentSecState] a confirmé publiquement le soutien continu des États-Unis au gouvernement militaire argentin. Une déclaration supplémentaire et un appel téléphonique de l'ambassade des États-Unis à Buenos Aires à La Casa Rosada ont réitéré ce fait, l'ambassadeur américain lui adressant ses plus chaleureuses salutations et déclarant que l'attaché de défense serait heureux d'avoir de nouveaux contacts avec ses collègues de l'armée, de la marine et de l'air argentines.\n\nLes membres de notre gouvernement se réjouissent de cette annonce, mais certains se demandent pourquoi les États-Unis ont dû revoir leurs positions politiques en la matière ? Certains officiers du renseignement militaire au sein de notre gouvernement, en particulier ceux du SIDE, ont émis l'hypothèse que la Maison Blanche aurait pu envisager de retirer son soutien, mais qu'elle avait été convaincue par des membres de la CIA, du ministère de la Défense et d'autres agences de sécurité nationale influentes. Quoi qu'il en soit, nous acceptons cette évolution à bras ouverts."

 # CIA Peru
 CIA_PERU.0.d:0 "INSURRECTION AU PÉROU : LA VOIE BRILLANTE\nBureau du Pérou, Bureau d'analyse de l'Amérique latine, Direction du renseignement, CIA ; Attaché de Défense, AMBASSADE DE LIMA\nSECRET/NOFORN\n\nDepuis 1980, le Pérou, pays du nord-est de l'Amérique du Sud, est terrorisé par une insurrection continue dans les zones rurales qui a impliqué le déploiement complet des forces armées péruviennes. Connue sous le nom de Sandero Luminoso, ou « Sentier lumineux », l'insurrection est principalement composée de guérilleros maoïstes indépendantes du Parti communiste du Pérou, qui est d'orientation marxiste-léniniste.\n\nFondé en 1969 par Abimael Guzman, connu de la population péruvienne sous le nom de « Président Gonzalo », le Sentier lumineux a commencé sa campagne de terreur lors des élections de 1980, incendiant les urnes, puis dégénérant en violence et en terreur à grande échelle, principalement concentrées dans les provinces andines des hauts plateaux d'Ayacucho, Apurimac et Huancavelica.\n\nLa réponse du gouvernement péruvien à l'insurrection a commencé de manière moyenne, mais des zones d'urgence ont été créées ces dernières années, donnant aux forces armées un contrôle quasi total sur la gouvernance locale et le pouvoir de détention arbitraire. Toutefois, ces actions n'ont pas suffi. Le Sentier lumineux a mené plusieurs opérations de sabotage sur des infrastructures de haut niveau, notamment en coupant l'électricité dans la capitale Lima et en plaçant des bombes à proximité des bâtiments gouvernementaux. D'éminents hommes politiques et militaires péruviens ont également été assassinés, notamment le président du Conseil national électoral, ainsi que des personnalités de gauche et marxistes opposées au Sentier lumineux.\n\nLes responsables américains au Pérou ont exprimé leur profonde inquiétude quant à la réponse du gouvernement péruvien et ont fait pression pour obtenir un soutien américain plus important. Langley a identifié plusieurs possibilités, notamment l'augmentation de l'assistance en matière de sécurité pour les forces armées péruviennes ainsi que la réduction directe du soutien populaire au Sentier lumineux dans les zones rurales andines."
 CIA_PERU.1.d:0 "L'ARMÉE PÉRUVIENNE : CAPACITÉS ET POTENTIEL DE MODERNISATION\nBureau du Pérou, Bureau d'analyse de l'Amérique latine, CIA ; Attaché de Défense, AMBASSADE DE LIMA\nSECRET/NOFORN\n\nLes forces armées péruviennes, ces dernières années, se sont révélées être l'une des armées tactiquement les plus supérieures dans la région andine, voire dans l'ensemble de la région sud-américaine. Cependant, la dépendance passée du Pérou à l'armement et à l'aide soviétiques a considérablement affaibli ses efforts de modernisation, en particulier avec sa campagne contre-insurrectionnelle en cours contre le groupe de guérilla communiste du « Sentier lumineux ». L'attaché de défense et l'ambassade de Lima voient dans cette affaire une opportunité possible de commencer à soutenir davantage les États-Unis, car les Péruviens sont vulnérables et ouverts à des équipements plus modernes en provenance de l'Occident.\n\n1. L'armée péruvienne est fortement intéressée à recevoir davantage d'aide militaire américaine, principalement en raison de son mécontentement à l'égard de la logistique soviétique et de la supériorité technologique occidentale perçue. Les accords actuels incluent un accord de 110 millions de dollars pour que l'armée reçoive 15 hélicoptères d'assaut/de transport UH-60 Blackhawk, qui remplaceraient les hélicoptères Mi-8 vieillissants. Les officiers de l'armée ont également manifesté leur intérêt pour l'achat de jusqu'à 50 chars de combat principaux M60A3, dans le cadre d'un contrepoids aux achats chiliens de chars auprès de la France et d'Israël. Jusqu'à 200 véhicules blindés de transport de troupes M113 ont également été envisagés pour la vente.\n\n2. La marine péruvienne dispose d'une capacité impressionnante pour les marines sud-américaines, mais a récemment souffert de la vétusté de ses navires, du manque de systèmes de missiles et de peu ou pas de capacités aériennes. La Marine est en train d'acquérir auprès d'Italie des frégates de classe Lupo, ainsi que plusieurs hélicoptères maritimes SH-3 ; mais recherche davantage de moyens aériens, notamment des avions de patrouille maritime et des missiles S-2, ainsi que des modèles LST plus anciens pour soutenir les opérations amphibies maritimes.\n\n3. L'armée de l'air péruvienne dispose d'une variété d'avions de combat et a la particularité d'être la troisième plus grande force aérienne d'Amérique du Sud, mais cherche à étendre ses capacités de contre-insurrection, d'appui aérien rapproché et de transport en acquérant des hélicoptères Bell 214T, des avions de transport L-100-30 de marque civile (C-130) et éventuellement le plus récent avion A-10 Thunderbolt CAS.\n\nEn conclusion, toutes les branches des forces armées péruviennes ont manifesté leur désir de disposer d'armes occidentales, voire exclusivement américaines. Ayant de l'expérience en matière de contre-insurrection, nous devons fournir des armes et un soutien au Pérou pour qu'il puisse atteindre ses objectifs."
 CIA_PERU.2.d:0 "LOIS SUR LES ARMES À FEU AU PÉROU : RECOMMANDATIONS POUR LA RÉFORME\nBureau du Pérou, Bureau d'analyse de l'Amérique latine, Direction du renseignement, CIA ; Attaché de Défense, AMBASSADE DE LIMA\nSECRET/NOFORN\n\nL'intensification récente des activités insurrectionnelles, tant du côté du « Sentier lumineux » maoïste (Sandero Luminoso) que du Mouvement révolutionnaire Tupac Amaru (MRTA), a presque épuisé les capacités militaires conventionnelles du gouvernement péruvien. Les services de renseignement ont indiqué que la région de Valle de los Rios Apurimac, Ene et Mantaro (VRAEM), avec une population à majorité autochtone, bénéficie d'un large soutien au Sentier lumineux, toute résistance étant entravée par des lois répressives sur les armes à feu.\n\nLes lois sur les armes à feu au Pérou sont conservatrices depuis la période coloniale espagnole, ciblant en particulier les peuples autochtones incas, dont les Espagnols craignaient qu'ils ne résistent à leurs ambitions coloniales. Cependant, la loi est restée, empêchant essentiellement les communautés rurales, pour la plupart indigènes, de se défendre contre les menaces communistes.\n\nL'ambassade de Lima et l'attaché de défense ont proposé de faire pression sur le gouvernement péruvien pour qu'il abroge sa loi sur les armes à feu, au motif qu'elle permettrait aux communautés indigènes de former des milices anticommunistes ou anti-Sandero Luminoso et des organisations de défense autonomes (connues localement sous le nom de « rondes campesinas » ou « rondes paysannes »). Ces organisations bénéficieraient grandement aux forces gouvernementales péruviennes dans leur campagne contre-insurrectionnelle en cours, dans la mesure où les unités locales semblent être légèrement plus efficaces, comme le montrent d'autres conflits.\n\nDes renseignements préliminaires provenant de sources au sein du gouvernement péruvien indiquent que l'abrogation des lois sur les armes à feu bénéficie d'un large soutien tant au sein du corps législatif que de l'armée ; Les renseignements sur la communauté autochtone ont également indiqué un certain degré de volonté de contribuer aux opérations anti-insurrectionnelles, mais sur la base de nouvelles réformes visant à soutenir les populations autochtones."
 CIA_PERU.3.d:0 "SOUTIEN DE SANDERO LUMINOSO DANS LES ZONES RURALES DU PÉROU : OPPORTUNITÉS ET ANALYSE\nBureau du Pérou, Bureau d'analyse de l'Amérique latine, Direction du renseignement, CIA ; Attaché de Défense, AMBASSADE DE LIMA\nSECRET/NOFORN\n\nAu milieu de l'insurrection en cours au Pérou, les sources du renseignement ont accordé une attention particulière à la région rurale de Valle de los Rios Apurimac, Ene et Mantaro, dans les Andes, comme lieu sur lequel se concentrer dans la lutte contre le mouvement de guérilla maoïste Sandero Luminoso (Sentier lumineux, ou SL). Le soutien à SL a été élevé dans cette région, qui abrite une forte population indigène inca et quechua qui a été largement ignorée et marginalisée par le gouvernement central de Lima.\n\nL'ambassade de Lima et l'attaché de défense estiment que réduire le soutien du SL dans cette région, en faisant pression sur le gouvernement péruvien pour qu'il procède à des réformes et à des changements systématiques dans les tactiques de contre-insurrection, déplacera l'élan du soutien au SL vers le gouvernement péruvien.\n\n1. Les réformes juridiques peuvent être préférables à la population indigène, dans la mesure où les Incas, les Quechua et les autres « Amérindiens » sont légalement séparés des autres groupes ethniques et ont donc des droits légaux différents. Les réformes juridiques peuvent également inclure une autonomie accrue du gouvernement local et une législation linguistique pour permettre plus de flexibilité dans les langues autochtones.\n\n2. Les réformes foncières rurales constituent une recommandation sans équivoque au gouvernement péruvien pour obtenir le soutien des groupes autochtones. Les niveaux actuels de soutien du SL existent en raison de la rhétorique sur l'exploitation des terres autochtones et du fait que le gouvernement central est déconnecté des besoins autochtones. La réforme agraire pourrait inclure des initiatives de décentralisation supplémentaires, des coopératives autochtones locales comme cela a été fait auparavant et des subventions à l'agriculture.\n\n3. Sur le plan militaire, il est extrêmement nécessaire de faire pression sur les forces armées péruviennes pour qu'elles obtiennent des règles d'engagement plus complètes. Une grande partie du soutien du SL provient également des actions du gouvernement péruvien qui ont entraîné la mort de civils, principalement des meurtres par vengeance et d'autres atrocités, en raison de l'absence de règles d'engagement dans les opérations anti-insurrectionnelles. L'attaché de défense recommande de faire pression davantage sur les généraux péruviens en les menaçant de suspendre leur aide pour atteindre cet objectif.\n\nEn communiquant efficacement ces désirs au gouvernement péruvien et en lançant une campagne d'action civile auprès de la population indigène, la vague de l'opinion publique devrait commencer à se retourner contre les guérilleros de Sandero Luminoso et assurer une plus grande opérabilité des forces gouvernementales péruviennes."
 CIA_PERU.4.d:0 "L'attaché juridique de l'ambassade des États-Unis à Lima nous est parvenu par l'intermédiaire du ministre de la Justice avec une proposition urgente sur les réformes juridiques que notre gouvernement peut mettre en oeuvre dans les départements andins à majorité autochtone. Selon le bureau de l'Attaché, ces propositions incluent l'extension d'une plus grande autonomie aux groupes autochtones pour le gouvernement local, la modification des définitions juridiques et des droits des peuples Inca et Quechua et l'extension des protections linguistiques dans ces régions.\n\nCertains membres de notre gouvernement ont exprimé leur soutien, arguant que l'adhésion à la communauté indigène, dont la plupart constituent l'essentiel du soutien de Sandero Luminoso (SL), les amènerait à se retourner contre le SL et vers notre gouvernement. Cependant, certains officiers militaires conservateurs et d'autres responsables gouvernementaux restent sceptiques, affirmant que ce n'est pas le moment d'étendre les réformes à une région du pays violente et anarchique où se déroulent les opérations. Comment réagirons-nous ?"
 CIA_PERU.5.d:0 "L'attaché juridique de l'ambassade des États-Unis à Lima a indiqué que le gouvernement péruvien avait accédé à sa proposition de réformes juridiques globales axées sur la communauté indigène. Le ministre péruvien de la Justice, lors d'un appel téléphonique avec l'ambassadeur et l'attaché juridique, a confirmé cela et leur a dit qu'ils allaient restaurer le gouvernement local autonome des communautés incas et quechua par le biais d'un décret exécutif, mais que la législation concernant la langue et d'autres droits légaux prendrait du temps au Congrès de la République.\n\nL'attitude du gouvernement péruvien semble ainsi positive, avec l'espoir que la communauté indigène commencera à se tourner vers le gouvernement central et contre la guérilla Sandero Luminoso (Sentier lumineux). Les attitudes à Langley et à Foggy Bottom sont également positives, avec l'espoir que les réformes envisagées aboutiront réellement comme proposé."
 CIA_PERU.6.d:0 "Malheureusement, l'attaché juridique de l'ambassade des États-Unis à Lima a signalé que le gouvernement péruvien avait rejeté sa proposition de réforme juridique de la communauté indigène des hautes terres andines. Initialement proposées comme un moyen d'influencer les peuples indigènes pour qu'ils soutiennent le gouvernement central de Lima au lieu de Sandero Luminoso, les réformes ont été rapidement rejetées comme étant \"ni opportunes ni nécessaires face à une urgence nationale provoquée par les terroristes communistes\", selon le ministre péruvien de la Justice dans un communiqué.\n\nLes responsables du Département d'État et de la CIA, ainsi que les responsables de l'ambassade, ne sont pas satisfaits de cette évolution, considérant qu'il s'agit d'une perte pour le gouvernement péruvien ainsi que d'une perte en termes de projection de l'influence américaine dans le pays."
 CIA_PERU.7.d:0 "Un responsable de l'ambassade des États-Unis à Lima nous est parvenu, par l'intermédiaire du ministre de l'Agriculture, avec une proposition urgente sur les réformes agraires rurales que notre gouvernement peut mettre en oeuvre dans les départements andins à majorité autochtone. Selon le responsable agricole, ces propositions comprennent la formation de coopératives foncières indigènes locales, de nouvelles mesures de décentralisation de la part du gouvernement central de Lima et le début de subventions et autres aides aux exploitations agricoles et aux coopératives.\n\nCes propositions ont suscité de nombreuses controverses au sein de notre gouvernement, la plupart des politiciens et officiers militaires conservateurs les dénonçant comme étant inappropriées et trop à gauche, ressemblant à la propagande de Sandero Luminoso diffusée dans ces domaines. Cependant, de nombreux officiers et politiciens de tendance libérale affirment que ces réformes, bien que limitées, pourraient apporter un soutien à notre cause, en particulier parmi les populations autochtones qui se sentent négligées ou discriminées en matière de politiques foncières ; et pour cette raison, ils se tournent vers le SL pour atteindre leurs objectifs. Comment allons-nous choisir ?"
 CIA_PERU.8.d:0 "Un responsable agricole attaché à l'ambassade américaine à Lima a rapporté que le gouvernement péruvien, par l'intermédiaire du ministre de l'Agriculture, avait accepté une proposition américaine de réforme rurale dans les hauts plateaux andins. Initialement proposée comme un moyen d'attirer davantage de soutien gouvernemental parmi les populations autochtones, qui se sentent marginalisées et constituent l'essentiel du soutien du Sentier lumineux (Sandero Luminoso), la réforme comprend la formation de coopératives foncières autochtones, des initiatives de décentralisation et des subventions aux agriculteurs.\n\nLargement attendu comme un échec au sein du gouvernement fortement conservateur et anticommuniste du Pérou, le programme de réformes devrait être approuvé prochainement, selon le ministre péruvien de l'Agriculture. Les responsables du Département d'État et de la CIA sont satisfaits de cette évolution, et le président espère en être informé prochainement."
 CIA_PERU.9.d:0 "Malheureusement, l'ambassade américaine à Lima rapporte que le gouvernement péruvien a rejeté sans équivoque toutes les propositions de réforme rurale dans la région des hauts plateaux andins du pays. Proposé comme une stratégie visant à attirer un soutien indigène crucial dans la campagne anti-insurrectionnelle en cours contre le Sentier lumineux, le ministre péruvien de l'Agriculture l'a décrié dans un communiqué comme « faisant le jeu de Guzman et de ses terroristes maoïstes » et « affaiblissant le pouvoir de la République à un moment crucial où la sécurité est primordiale ».\n\nLes responsables du Département d'État et de la CIA seraient frustrés par cette évolution, car il semble que l'avancée américaine au Pérou s'amenuise. Le président était censé être informé de ces développements, mais les hauts responsables ont décidé de ne pas lui en parler pour le moment."
 CIA_PERU.10.d:0 "L'Attaché de Défense à l'Ambassade des États-Unis à Lima nous a adressé, par l'intermédiaire du Ministre de la Défense, une proposition urgente sur les règles d'engagement des unités et du personnel des Forces armées péruviennes dans leur campagne anti-insurrectionnelle en cours contre la guérilla maoïste Sandero Luminoso. L'Attaché a suggéré plusieurs exemples de règles d'engagement plus complètes, comprenant l'application d'opérations d'action civile, des rapports d'incidents et une structure de commandement plus rigide ainsi que des inspecteurs généraux militaires indépendants dans chaque unité.\n\nLes généraux supérieurs des forces armées se sont fermement opposés à cette proposition, la considérant comme contraire à ce qui a été une campagne relativement réussie jusqu'à présent, les troupes gouvernementales opérant dans une impunité quasi totale. Ils soutiennent que des règles d'engagement rigides feraient le jeu des communistes, garantiraient la perte de l'intégrité opérationnelle et élimineraient toute tactique de surprise de la part des forces gouvernementales. Les partisans soutiennent cependant que de telles règles tempéreront l'ampleur des atrocités futures et légitimeront davantage l'armée en tant que pouvoir d'application de l'État. Comment allons-nous choisir ?"
 CIA_PERU.11.d:0 "L'attaché de défense auprès de l'ambassade des États-Unis à Lima a rapporté que le gouvernement péruvien avait accepté à contrecoeur une proposition de règles d'engagement pour les forces armées dans leur campagne contre-insurrectionnelle en cours contre le groupe de guérilla maoïste Sandero Luminoso (Sentier lumineux). Proposées comme un moyen de mettre en place des garde-fous contre les forces gouvernementales et de prévenir de nouvelles atrocités commises par l'armée, les règles d'engagement comprennent des chaînes de commandement plus strictes, un inspecteur général indépendant et des mesures plus punitives pour les soldats accusés.\n\nLes officiers du Département d'État et de la CIA sont satisfaits de cette évolution, mais restent quelque peu préoccupés par le fait que les forces armées péruviennes pourraient ne pas tenir leurs promesses. Des mesures supplémentaires seront nécessaires pour garantir que le Pérou respecte sa part du marché."
 CIA_PERU.12.d:0 "Malheureusement, l'attaché de défense de l'ambassade américaine à Lima a rapporté que le gouvernement et les forces armées péruviennes ont totalement rejeté nos propositions de règles d'engagement plus complètes dans leur campagne contre-insurrectionnelle en cours contre la guérilla communiste Sandero Luminoso. Un porte-parole du ministère péruvien de la Défense a condamné la proposition comme une « tentative de contrôler les affaires intérieures du Pérou » et que « les soi-disant atrocités sont des tentatives des terroristes communistes pour rejeter la responsabilité de leurs propres crimes ».\n\nLes responsables du Département d'État et de la CIA ne sont pas satisfaits de cette évolution, mais pas totalement surpris. Les États-Unis devront envisager d'autres possibilités quant à leur éventuelle implication au Pérou à l'avenir."
 CIA_PERU.13.d:0 "C'était tôt le matin dans la salle de crise, lorsque le président [USA.GetLeader] est entré, à moitié habillé, après avoir été réveillé à peine 15 minutes auparavant. La pièce était en effervescence, mais le silence se fit brusquement lorsqu'il entra, la pièce entière se levant, puis se rasseyant avec un signe de la main.\n\n\"Quelle est la situation ? Directeur, partez.\"\n\nLe directeur du renseignement central, [GetCurrentCIADir], se leva. \"Monsieur le Président, il y a environ deux heures, nous avons reçu des informations d'agents toujours infiltrés au Pérou selon lesquels la capitale, Lima, est officiellement tombée aux mains des insurgés communistes, dirigés par le groupe de guérilla maoïste Sandero Luminoso, ou Sentier lumineux.\"\n\nLe secrétaire d'État [GetCurrentSecState] est intervenu. \"Comme vous le savez, M. Monsieur le Président, l'ambassade de Lima a été évacuée il y a quelques jours et le personnel a été transporté par avion vers le Brésil. Officiellement, il n'y a plus aucun membre du gouvernement américain sur le terrain. Nous ne sommes pas sûrs du nombre de citoyens américains ou de tout membre du renseignement intégré encore dans le pays, mais nous faisons de notre mieux pour communiquer avec l'Équateur et le Chili voisins afin de déterminer où ils se trouvent. De plus, des réunions d'urgence du Conseil de sécurité des Nations Unies et de l'Organisation des États américains ont été convoquées plus tard ce matin à New York et ici à Washington. L'État aura des ambassadeurs qui se rendront dans les deux pays et nous ferons un lobbying agressif pour quelle que soit la solution qui sortira de cette salle ce soir. »\n\nLe conseiller à la sécurité nationale [GetCurrentNatSecAdv] s'est alors levé. \"Monsieur le Président, la plupart des responsables présents ce soir se sont mis d'accord sur au moins deux lignes d'action possibles. Nous ne pouvons pas laisser cette action du Sentier lumineux rester sans réponse, en particulier compte tenu de notre engagement continu en Amérique du Sud et en particulier de notre aide au gouvernement péruvien, désormais démis de ses fonctions. Nous avons donc deux options : suivre la voie diplomatique et condamner et sanctionner, en utilisant les pouvoirs de l'ONU et de l'OEA ainsi que d'autres organismes régionaux ; ou emprunter la voie plus interventionniste, qui impliquerait à la fois les militaires américains et probablement régionaux, formant une coalition et reconquérir des zones peuplées.\n\nPlusieurs officiers militaires, dont le commandant du Commandement Sud des États-Unis, ont pris la parole. \"Monsieur le Président, le Commandement Sud des États-Unis a surveillé l'évolution de la situation et a retiré du pays tout le personnel américain et les plus hauts responsables militaires péruviens. Nous préparons d'éventuels plans opérationnels, y compris des opérations multinationales, mais on ne sait pas quelle sera l'efficacité d'une intervention, en particulier contre une force de guérilla coriace et expérimentée.\"\n\n\"Très bien.\" Le président soupira en regardant autour de lui. \"Secrétaire, demandez-moi d'éventuelles sanctions et solutions diplomatiques. Je veux toutes les options militaires et avant de faire quoi que ce soit, nous avons besoin d'assurances diplomatiques. Passez quelques appels et nous nous retrouverons dans quelques heures.\""
 CIA_PERU.14.d:0 "AVIS DU RÈGLEMENT SUR LES SANCTIONS AU PÉROU\nBureau du contrôle des avoirs étrangers, Département du Trésor des États-Unis\n\nLes États-Unis, en application des résolutions du Conseil de sécurité des Nations Unies et de l'Organisation des États américains, imposent les sanctions économiques suivantes aux individus et industries suivants au sein de la République du Pérou.\n\n1. Abimael Guzman, nationalité péruvienne, né le 3 décembre 1934; communément appelé « Président Gonzalo », président du Parti communiste du Pérou, fondateur du Sentier lumineux en 1969 et dirigeant provisoire du Pérou après la prise de contrôle du pays par le Sentier lumineux ;\n\n2. Augusta Deyanira La Torre Carrasco, nationalité péruvienne, née le 29 août 1946; communément connue sous le nom de « Camarade Norah », reconnue comme commandant en second du Sentier lumineux et épouse de Guzman.\n\n3. Florindo Eleuterio Flores Hala, nationalité péruvienne, né le 8 septembre 1961; communément appelé « Camarade Artemio », commandant en chef de l'Armée populaire de guérilla, la principale force combattante du Sentier lumineux.\n\n4. Oscar Ramírez Durán, nationalité péruvienne, né le 16 mars 1953 ; communément connu sous le nom de « camarade Feliciano », haut dirigeant du Sentier lumineux et communément considéré comme le troisième commandant de Guzman et son possible successeur.\n\n5. Osman Morote Barrionuevo, nationalité péruvienne, né le 15 avril 1945; communément appelé « Camarade Nicolas », haut dirigeant du Sentier lumineux et communément considéré comme l'un des hauts commandants et successeurs de Guzman.\n\n6. Les industries péruviennes d'extraction du cuivre et de l'argent, y compris toutes les mines, les sociétés minières appartenant à des particuliers péruviens et les sociétés d'import-export.\n\n7. L'industrie péruvienne du bois d'oeuvre, y compris toutes les entreprises d'exploitation forestière, les entreprises appartenant à des particuliers péruviens et les entreprises d'import-export.\n\nCes sanctions prennent effet immédiatement.\n\nSIGNÉ\nSecrétaire au Trésor des États-Unis"
 CIA_PERU.15.d:0 "À la suite de la prise de pouvoir communiste au Pérou par le mouvement insurgé maoïste du Sentier lumineux, le gouvernement des États-Unis a officiellement imposé des sanctions au Pérou, à la fois axées sur des individus spécifiques et des dirigeants de Sandero Luminoso, ainsi que sur les principales industries d'exportation du Pérou. Selon un communiqué du Bureau de contrôle des avoirs étrangers du Département du Trésor américain, « des sanctions ont été imposées à Abimael Guzman, chef du groupe du Sentier lumineux, ainsi qu'à sa famille, ses amis, ses hauts dirigeants et d'autres hauts commandants du Parti communiste du Pérou ».\n\nOn ne sait pas comment l'économie péruvienne sera directement affectée par ces sanctions, alors que le pays est en transition rapide vers un régime communiste. Les observateurs internationaux ont commenté les sanctions comme étant une gifle diplomatique et contrairement à la politique américaine passée, tandis que les alliés sud-américains se sont plaints que cette politique n'était pas suffisante."
 CIA_PERU.16.d:0 "OPÉRATION COPPER EAGLE : PLAN OPÉRATIONNEL\nQuartier général du Commandement Sud des États-Unis ; Quartier général des Forces armées équatoriennes ; Quartier général des forces armées chiliennes\nSECRET/NOFORN\n\nEn violation des résolutions du Conseil de sécurité des Nations Unies et de l'Organisation des États américains exigeant que le gouvernement légitime du Pérou soit reconduit dans ses fonctions, le groupe de guérilla du Sentier lumineux et sa force armée, l'Armée populaire de guérilla, ont violé le droit international et les principes de paix et de sécurité. Avec l'approbation de la communauté internationale, les États-Unis ont formé une coalition avec les États voisins, l'Équateur et le Chili, pour faciliter une opération multinationale rapide et indolore visant à rétablir l'ordre démocratique au Pérou.\n\n1. Unités du Commandement Sud des États-Unis (USSOUTHCOM), dont la Force opérationnelle interarmées Bravo basée à Palmerola, au Honduras ; la 193e brigade d'infanterie basée au Panama ; et toutes les unités associées de la marine et de l'air des États-Unis seront responsables de l'organisation d'une saisie aéroportée/amphibie de la capitale Lima, au Pérou.\n\n2. Les unités des forces armées équatoriennes, y compris l'armée et l'armée de l'air équatoriennes, seront responsables d'une avancée vers le sud depuis la frontière péruvienne jusqu'à la ville de Trujillo, au Pérou, où elles rencontreront les forces américaines et associées au gouvernement.\n\n3. Les unités des forces armées chiliennes, y compris l'armée et la force aérienne chiliennes, seront responsables d'une étroite avancée vers le nord depuis la frontière péruvienne vers les villes d'Arequipa et de Cuzco.\n\n4. Les unités de l'ancien gouvernement du Pérou et des forces armées péruviennes joueront des rôles de liaison et de soutien, agissant comme guides de contre-insurrection, navigateurs, interprètes et jouant des rôles d'action civique. Des règles d'engagement par toutes les parties, formées par l'USSOUTHCOM, seront promulguées pour réduire les pertes civiles.\n\nLe commandement opérationnel de l'opération Copper Eagle sera délégué au commandant du US Southern Command ; le chef d'état-major général des forces armées équatoriennes et chiliennes ayant la possibilité de sélectionner un adjoint. Toutes les opérations de commandement, jusqu'à ce que Lima soit sécurisée, seront situées à Panama City, au Panama ; Quito, Équateur ; ou Santiago, Chili.\n\nSIGNÉ\nCommandant du Commandement Sud des États-Unis"
 CIA_PERU.17.d:0 "Le choc et la crainte se sont manifestés aujourd'hui en Amérique du Sud lorsque les États-Unis, soutenus par l'Équateur et le Chili, ont lancé l'opération Copper Eagle, une invasion multinationale du Pérou, pour « restaurer l'ordre démocratique » dans le pays, récemment repris par la guérilla communiste connue sous le nom de Sentier lumineux (Sandero Luminoso). Soutenues par les forces équatoriennes au nord et les forces chiliennes au sud, les unités américaines de la 193e brigade d'infanterie et de la force opérationnelle interarmées Bravo, ainsi que le soutien aérien de la marine et de l'armée de l'air des États-Unis, ont débarqué à l'extérieur de la capitale Lima et ont commencé à établir une position forte.\nBien qu'on ne sache pas quel sera le succès contre les forces du Sentier lumineux, en raison de la sécurité opérationnelle assurée par la coalition américaine, on ne s'attend pas à ce que ce conflit soit de courte durée, en raison de la relative robustesse des forces communistes. Les pays soviétiques et du bloc de l'Est, ainsi que Cuba, ont fermement condamné l'intervention, la qualifiant de renforcement de l'impérialisme américain."

 # CIA Chiapas
 CIA_CHIAPAS.0.d:0 "INSURRECTION ZAPATISTE AU CHIAPAS : RÉSUMÉ\nBureau du Mexique, Bureau d'analyse de l'Amérique latine, Direction du renseignement\nSECRET/NOFORN\n\nRécemment, l'État mexicain du Chiapas, le plus au sud, a été secoué par un nouveau mouvement insurrectionnel, se faisant appeler l'Armée zapatiste de libération nationale (Ejercito Zapatista de Liberación Nacional, ou EZLN). Composé principalement d'indigènes et d'agriculteurs locaux, l'EZLN a résisté à l'oppression du gouvernement de l'État du Chiapas et du gouvernement fédéral de Mexico via une série d'attaques et d'enlèvements d'éminents et d'anciens responsables de l'État.\n\nÉpousant une idéologie connue sous le nom de « néozapatisme », l'EZLN, ou zapatistes, tire son nom d'Emiliano Zapata, un leader de la révolution mexicaine de 1910, et se compose principalement de culture indigène traditionnelle maya de gauche, de théologie catholique de la libération et de marxisme. Les zapatistes sont de fervents défenseurs des droits fonciers communaux, en particulier auprès de la population indigène mexicaine, et s'opposent à la mondialisation économique au motif qu'elle oppresse les populations locales et affecte négativement la vie de la classe paysanne.\n\nCes dernières semaines, l'EZLN a déclenché un soulèvement dans l'État du Chiapas, où il opère principalement ; attaquant des centres civiques et des bâtiments gouvernementaux dans les villes de San Cristobal de las Casas, Altamirano, Las Margaritas, Ocosingo et Chanal. Ils ont été accueillis par les forces gouvernementales dans la plupart des cas, faisant des ravages avant de retourner dans la jungle Lacandone, où le groupe opère principalement.\n\nOn ne sait pas vraiment comment nous devrions réagir à cela. D'une part, il s'agit d'une question interne au Mexique ; cependant, la volonté de soutenir les zapatistes est forte et irait à l'encontre de la politique établie."
 CIA_CHIAPAS.1.d:0 "AUTONOMIE AU CHIAPAS : POSSIBILITÉS D'AVENIR\nBureau du Mexique, Bureau d'analyse de l'Amérique latine, Direction du renseignement\nSECRET/NOFORN\n\nLa récente opposition et insurrection indigène dans l'État du Chiapas, au sud du Mexique, a galvanisé les appels à une plus grande autonomie de l'État. L'incapacité des forces fédérales mexicaines à contrôler adéquatement la situation, et basée sur les mauvais traitements infligés par Mexico, a amené les responsables de la CIA et du Département d'État dans la région à y prêter une attention particulière. Les pressions en faveur de l'autonomie des représentants de l'État du Chiapas et des membres de l'EZLN en ont pris note, et le statut potentiel d'autonomie du Chiapas pourrait avoir les objectifs et les effets suivants :\n\n1. Les forces de l'EZLN ont déjà un contrôle adéquat sur le gouvernement de l'État du Chiapas, et toute nouvelle tentative du gouvernement fédéral mexicain pourrait entraîner un conflit plus large dans le pays, car les groupes antigouvernementaux et indigènes sont répandus partout, en particulier après l'approbation de l'Accord de libre-échange nord-américain (ALENA).\n\n2. Les responsables mexicains nous ont poussés à obtenir une aide militaire supplémentaire. Toutefois, nous sommes favorables à une solution pacifique dans cette affaire, car un conflit plus large affecterait nos relations économiques et l'économie du Mexique.\n\n3. La communauté du renseignement n'est pas favorable à une aide secrète à l'une ou l'autre des parties. La coordination des négociations sur un État séparé pour le Chiapas, ou une plus grande autonomie au sein du gouvernement fédéral mexicain, donnera une plus grande légitimité aux États-Unis, à l'EZLN et aux autres parties intéressées."
 CIA_CHIAPAS.2.d:0 "L'ambassadeur des États-Unis à Mexico a contacté notre gouvernement avec une proposition d'autonomie dans l'État méridional du Chiapas. Même si notre campagne contre-insurrectionnelle contre les forces séparatistes et zapatistes de gauche (EZLN) a connu un succès marginal, la proposition d'autonomie a recueilli l'approbation, tant de la communauté internationale que de l'État du Chiapas et du gouvernement fédéral. Ces propositions incluent la délégation d'une plus grande autorité économique et budgétaire au gouvernement du Chiapas, l'interdiction aux forces militaires et de sécurité fédérales de mener des opérations dans l'État et l'octroi de plus grands droits linguistiques ethniques et de droits de propriété foncière aux peuples indigènes du Chiapas, dont la plupart composent le mouvement EZLN.\n\nLes membres progressistes de notre gouvernement soutiennent les avantages possibles d'accorder l'autonomie au Chiapas, dans le sens où leur rébellion pourrait s'apaiser et où l'EZLN pourrait être en mesure de négocier de bonne foi sur la base de préoccupations et de demandes légitimes, tout en restant sous le contrôle général du gouvernement fédéral et en ne devenant pas un État souverain séparé. Les membres les plus conservateurs de notre gouvernement ont continuellement fait valoir les inconvénients d'accorder l'autonomie au Chiapas, affirmant qu'ils feraient le jeu de l'EZLN et que d'autres États mexicains envisageraient également d'exiger l'autonomie du gouvernement fédéral, décentralisant ainsi davantage le contrôle que Mexico exerce sur les États. Comment devrions-nous choisir dans cette proposition ?"
 CIA_CHIAPAS.3.d:0 "L'ambassade des États-Unis à Mexico a annoncé que le gouvernement fédéral mexicain avait approuvé un projet de proposition visant à accorder l'autonomie et à poursuivre les réformes dans l'État du Chiapas, le plus méridional, à la frontière avec le Guatemala. Face à un mouvement séparatiste et réformateur indigène et de gauche connu sous le nom de Zapatistes ou EZLN, le secrétaire de l'Intérieur mexicain a déclaré dans sa déclaration qu'« en raison de circonstances atténuantes, l'État du Chiapas bénéficiera de ressources supplémentaires pour soutenir ses activités économiques et son autonomie gouvernementale », y compris une restriction des activités militaires fédérales dans l'État, une déréglementation des politiques fiscales et financières envers l'État et une extension des pouvoirs du gouverneur du Chiapas.\n\nBien qu'ils ne soient pas ouvertement impliqués dans la question zapatiste, les décideurs politiques mexicains et latino-américains à Washington se réjouissent de cette évolution, qui permet une plus grande autonomie gouvernementale et une moindre implication des fonctionnaires fédéraux dans la population indigène locale, qui a été confrontée à la répression politique et économique dans le passé."
 CIA_CHIAPAS.4.d:0 "L'ambassade des États-Unis à Mexico a rapporté que le gouvernement fédéral mexicain avait rejeté un projet de proposition visant à accorder l'autonomie et à poursuivre les réformes dans l'État du Chiapas, le plus méridional, à la frontière avec le Guatemala. Face à un mouvement séparatiste et réformateur indigène et de gauche connu sous le nom de Zapatistes ou EZLN, le secrétaire mexicain de l'Intérieur a réitéré dans une déclaration que « les préoccupations légitimes peuvent être traitées par d'autres moyens » et que « le terrorisme des forces de l'EZLN contre des civils innocents au Chiapas ne peut être récompensé en leur donnant plus de pouvoir et d'influence ». Le secrétaire d'État a ensuite annoncé une nouvelle mission de répression et d'application de la loi contre l'EZLN par les forces militaires et policières mexicaines, garantissant que l'autonomie de l'État ne passerait pas par Mexico.\n\nBien qu'ils ne soient pas ouvertement impliqués dans la question zapatiste, les décideurs politiques mexicains et latino-américains sont découragés par cette évolution, certains craignant le déclenchement d'un conflit plus large en raison de la colère de l'EZLN face à cette annonce."
 CIA_CHIAPAS.5.d:0 "AVANTAGES DU SOUTIEN AUX REBELLES ZAPATISTES/FORCES DE L'EZLN\nBureau du Mexique, Bureau d'analyse de l'Amérique latine, Direction du renseignement ; AMBASSADE DES ÉTATS-UNIS À MEXICO\nSECRET/NOFORN\n\nConscient que le conflit entre les zapatistes de l'État du Chiapas et le gouvernement fédéral mexicain s'est aggravé, le chef de la station de la CIA à Mexico joint les recommandations suivantes pour une plus grande implication et un plus grand soutien des États-Unis à l'Ejército Zapatista de Liberación Nacional (EZLN, ou Zapatistes) dans le but de garantir l'autonomie gouvernementale et les droits indigènes dans la région.\n\n1. Les forces mexicaines, composées à la fois de forces militaires et de police locale, ont tenté de mener des opérations contre-insurrectionnelles contre les forces de l'EZLN, mais n'ont pas réussi en raison des positions et du quartier général de l'EZLN situés dans la jungle lacandone, qui traverse la frontière mexico-guatémaltèque et est extrêmement difficile à parcourir sans être un local. Les forces américaines sont adeptes de la guerre dans la jungle et des tactiques d'insurrection, et un soutien militaire contre une force militairement incompétente s'avérerait généralement efficace.\n\n2. Le soutien à l'EZLN a diminué en dehors du Chiapas. Le soutien américain pourrait inclure des programmes de propagande et d'action civique dans d'autres provinces mexicaines de l'idéologie zapatiste, dans le but d'attiser davantage de ressentiment et de permettre que des mesures contre le gouvernement mexicain soient prises en plus grand nombre.\n\n3. Les initiatives de soutien secret pourraient inclure des transferts d'armes légères, de mitrailleuses, de petits véhicules, d'explosifs, de certains équipements électroniques et de communication, un soutien aérien limité et d'autres équipements de soutien. Des formations pourraient également être dispensées par les forces de l'USSOUTHCOM ou par les moyens de la CIA, en se concentrant notamment sur les attaques contre les points faibles et l'expansion du réseau insurrectionnel.\n\nCe qui précède repose sur l'hypothèse que la CIA et la Maison Blanche voudront réellement soutenir l'EZLN. L'opinion du chef de station [REDACTED]de la CIA ne représente pas l'opinion de tous les responsables de la CIA."
 CIA_CHIAPAS.6.d:0 "MODÉRER LE MOUVEMENT ZAPATISTE LOIN DU MARXISME\nBureau du Mexique, Bureau d'analyse de l'Amérique latine, Direction du renseignement ; AMBASSADE DES ÉTATS-UNIS À MEXICO\nSECRET/NOFORN\n\nLe mouvement zapatiste, également connu sous le nom d'Ejército Zapatista de Liberación Nacional (EZLN), principalement situé dans l'État mexicain du Chiapas, le plus au sud, est devenu connu pour ses positions de gauche, indigènes et pro-réforme agraire, s'inspirant de son idéologie et des conseils du défunt révolutionnaire mexicain Emilio Zapata. Alors que les États-Unis se sont engagés à soutenir l'EZLN dans sa campagne contre le gouvernement fédéral mexicain, le chef de station de la CIA à Mexico a exprimé son inquiétude quant aux tendances pro-marxistes du mouvement et a joint les suggestions suivantes pour une modération politique des cellules zapatistes.\n\n1. Réitérer l'importance de la réforme agraire et des droits autochtones sans idées explicitement marxistes. La réforme agraire peut être réalisée et a été réalisée par d'autres régimes politiques qui ne sont pas explicitement marxistes, et l'idéologie marxiste n'est pas nécessairement nécessaire pour atteindre leurs objectifs.\n\n2. Les négociations avec le gouvernement fédéral mexicain et le gouvernement de l'État du Chiapas restent un moyen d'atteindre les objectifs de l'EZLN. Le mouvement devrait être suffisamment modéré si les hauts responsables de l'EZLN sont convaincus des options pacifiques et ne se limitent pas à des attaques offensives.\n\n3. Les attaques offensives, bien que de portée limitée, devraient avoir des objectifs politiques spécifiques et être limitées pour éviter autant que possible de faire des victimes civiles. De telles restrictions et règles d'engagement devraient empêcher de manière adéquate des personnalités plus radicales au sein de l'EZLN de commettre des attaques inutiles qui entraîneraient une nouvelle intervention des forces fédérales mexicaines.\n\nOn espère que ces recommandations du chef de station de la CIA [REDACTED], dont les opinions ne représentent pas nécessairement celles de tous ceux de la CIA, permettront aux décideurs politiques de modérer suffisamment le mouvement, les éloignant d'une orientation marxiste et permettant un soutien américain supplémentaire."
 CIA_CHIAPAS.7.d:0 "C'était une nuit fraîche au-dessus du nord du Guatemala alors que le C-130 volait à basse altitude au-dessus de la jungle. Le pilote, un lieutenant de l'US Air Force, bâilla en s'inclinant légèrement vers la gauche, vérifiant sur sa carte et sa boussole la frontière mexicaine, qui était pratiquement invisible depuis cette altitude.\n\nDerrière lui étaient assis six hommes, vêtus de tenues de combat pratiquement impossibles à distinguer de la police mexicaine, armés de pistolets dans des étuis et de M-16 alors qu'ils étaient assis accrochés à l'avion, leur sac à dos entre les jambes. Ils vérifièrent leurs lumières, leurs chargeurs, attachèrent d'autres sacs tandis que la rampe s'abaissait, le pilote voyant un flash venant du sol indiquant le point de largage.\n\nUne lumière rouge a clignoté et une sonnerie a retenti tandis que les hommes saluaient l'arrimeur dans la zone de chargement, tombant de l'avion un par un, ouvrant les parachutes et descendant dans la jungle Lacandone en dessous d'eux. Le C-130 a continué, car il était sous couverture dans le cadre d'\"opérations électroniques et de surveillance\" au-dessus du Mexique depuis la base aérienne de Palmerola au Honduras. Les hommes, cependant, allaient atterrir dans la jungle, être accueillis par les guérilleros de l'EZLN et insérés dans la structure de commandement pour commencer la formation pour le mouvement indigène antigouvernemental axé sur la réforme agraire dans l'État du Chiapas, dans le sud du pays. Tout cela représente une journée de travail pour ces hommes de Langley."

 # CIA Cambodia
 CIA_CAM80.0.d:0 "LA SITUATION AU CAMBODGE : POSSIBILITÉS POUR NOUS DE PARTICIPER\nBureau du Cambodge, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\n\nDepuis la fin de l'implication américaine dans le conflit vietnamien, la situation géopolitique et interne du Cambodge voisin est devenue compliquée. Après avoir renversé Norodom Sihanouk du pouvoir lors d'un coup d'État en 1970, le régime soutenu par les États-Unis a été confronté à l'insurrection des Khmers rouges communistes, qui ont finalement pris le contrôle de Phnom Penh, la capitale, en 1975.\n\nAu pouvoir sous un règne de terreur pendant trois ans, le régime khmer rouge a tué jusqu'à deux millions de Cambodgiens, avant d'être renversé en 1978 par une invasion vietnamienne venant de l'est. Le pays est actuellement dirigé par le Parti révolutionnaire populaire du Kampuchea, pro-soviétique et anti-Khmer rouge, soutenu par les Vietnamiens, sous le nom de République populaire du Kampuchéa.\n\nLes services de renseignement ont indiqué qu'un gouvernement en exil pourrait être formé. Connu sous le nom de Gouvernement de coalition du Kampuchéa démocratique, il est soutenu par la République populaire de Chine sous le régime [PRC.GetLeader] et est composé des restes du régime des Khmers rouges, du Front de libération nationale du peuple khmer rouge (KPNLF) anti-Khmer rouge et du Front national uni royaliste dirigé par Sihanouk pour un Cambodge indépendant, neutre, pacifique et coopératif (FUNCINPEC).\n\nLes États-Unis ont une occasion unique de changer leur politique dans cette région. Une fois remis de nos actions au Vietnam, Washington pourrait envisager d'aider à organiser ce gouvernement de coalition du Kampuchea démocratique, en lui accordant une reconnaissance internationale clé qui lui permettrait d'usurper le régime de Phnom Penh soutenu par Hanoï. Cependant, compte tenu de la participation des Khmers rouges au gouvernement de coalition, il serait peut-être judicieux de s'en tenir pour le moment. Permettre à KR d'exercer une influence pourrait entraîner d'autres problèmes à l'avenir."
 CIA_CAM80.1.d:0 "Dans une tournure surprenante des événements, le secrétaire d'État américain [GetCurrentSecState] a annoncé aujourd'hui que les États-Unis ne soutiendraient pas un projet de gouvernement de coalition du Kampuchéa démocratique, un groupe d'opposition à la République populaire du Kampuchéa au pouvoir, un État fantoche soutenu par les Vietnamiens. Composé d'éléments khmers rouges, du Front de libération nationale du peuple khmer anti-KR et du parti royaliste FUNCINPEC, le gouvernement de coalition a reçu le soutien de la Chine communiste pour se protéger du Vietnam.\n\nRéitérant que « les États-Unis ne soutiennent aucun gouvernement de coalition comprenant des éléments khmers rouges », le secrétaire d'État a essentiellement mis fin à toute chance pour un gouvernement de coalition d'opposition en exil d'obtenir une reconnaissance internationale."
 CIA_CAM80.2.d:0 "PROPOSITION DE PARTAGE DE RENSEIGNEMENTS ENTRE L'ASEAN ET LE CAMBODGE\nBureau du Cambodge, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\n\nFormée en 1967 entre l'Indonésie, la Malaisie, les Philippines, Singapour et la Thaïlande, l'Association des nations de l'Asie du Sud-Est (ASEAN) a pour objectif principal d'accélérer la collaboration régionale, de contenir le communisme et d'assurer une croissance économique et culturelle stable. Ces dernières années, avec la propagation du communisme dans la région et le conflit vietnamien, l'ASEAN est devenue plus importante pour les intérêts de sécurité des États-Unis, notamment en ce qui concerne la Thaïlande, le Laos et le Cambodge.\n\nSur la base de la décision de la communauté du renseignement américaine, du Département d'État et de la Maison Blanche de ne pas soutenir le gouvernement de coalition proposé du Kampuchéa démocratique ; Le bureau du Cambodge, ainsi que l'ambassade de Bangkok, recommandent une coopération américaine plus étroite avec l'ASEAN comme moyen de participation indirecte aux affaires cambodgiennes et régionales, en se concentrant sur la défense, la coopération en matière de sécurité et le partage de renseignements avec tous les pays membres.\n\n1. Partage de renseignements avec les services des pays membres, notamment l'Agence nationale de renseignement thaïlandaise (NIA), l'Agence indonésienne de coordination du renseignement (BAKIN), l'Organisation malaisienne de renseignement extérieur (MEIO) et l'Autorité nationale philippine de renseignement et de sécurité (NISA). Ce partage de renseignements, en particulier avec la NIA et la NISA, garantira des renseignements en temps opportun et un soutien aux alliés régionaux dans la surveillance des activités cambodgiennes.\n\n2. D'autres formes de coopération en matière de sécurité peuvent également être envisagées, notamment les ventes militaires à l'étranger (FMS) du ministère de la Défense et les initiatives de formation. Des agents de la CIA et de la DIA pourraient également envisager de mener des formations sur le terrain, notamment en matière de surveillance et de tactiques insurrectionnelles à la frontière entre la Thaïlande et le Cambodge.\n\n3. Un aspect clé devrait être de garantir un réseau adéquat de reporting et de vérification des renseignements pour garder un oeil sur Phnom Penh, d'autant plus que le régime actuel est pro-Hanoï et est essentiellement un État croupion."
 CIA_CAM80.3.d:0 "Le chef de station de la CIA à Bangkok nous a informés que les États-Unis commenceraient à partager des informations classifiées sur le gouvernement cambodgien avec notre National Intelligence Agency (NIA). Composée principalement de rapports de contact, de transcriptions d'émissions d'information et d'estimations classifiées du renseignement national sur le Cambodge, la CIA a commencé à envoyer des tonnes et des tonnes de documents papier à travers Bangkok aux bureaux de la NIA, avec la promesse d'une formation plus poussée en matière de renseignement et d'une coopération dans les efforts de surveillance du Cambodge.\n\nDans le cadre d'un effort concerté visant à étendre le partage de renseignements en Asie du Sud-Est entre les membres de l'ASEAN, la Thaïlande représente le point central des efforts américains pour garder un oeil sur l'État croupion cambodgien soutenu par le Vietnam. D'éminents responsables militaires et du renseignement thaïlandais sont satisfaits de cette évolution et enthousiastes à l'idée de collaborer davantage avec les services de renseignement américains, comme ils l'ont fait de la même manière lors du conflit du Vietnam."
 CIA_CAM80.4.d:0 "POSSIBLE NEUTRALITÉ AU CAMBODGE ?\nBureau du Cambodge, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement ; AMBASSADE DE BANGKOK\nSECRET/NOFORN\n\nSur la base de la décision de l'administration actuelle de ne pas soutenir le gouvernement de coalition d'opposition cambodgienne du Kampuchea démocratique ; L'ambassade américaine à Bangkok, les responsables de la CIA et d'autres responsables de la communauté du renseignement et du ministère de la Défense ont déterminé qu'une stricte neutralité dans les affaires cambodgiennes est impérative pour faire avancer les intérêts américains dans la région.\n\nAprès avoir discuté de cette question avec les membres de l'ASEAN, dont la Thaïlande et l'Indonésie, il a été déterminé que la neutralité était la meilleure option en raison du manque d'options pour un gouvernement responsable au Cambodge. Les États-Unis refusent de reconnaître ni de soutenir l'actuelle République populaire du Kampuchea, soutenue par les Vietnamiens, malgré leurs tendances anti-Khmers rouges.\n\nEn outre, le gouvernement de coalition du Kampuchea démocratique peut sembler être une meilleure option, mais il est également en proie à des problèmes internes. D'une part, la coalition est composée d'anciens restes des Khmers rouges, dont la découverte entraînerait des problèmes internationaux pour les États-Unis ; ainsi que des éléments royalistes sous Norodom Sihanouk qui ont été évincés par les Khmers rouges et des éléments anti-Khmers rouges. Il est clair que nous ne devons apporter notre soutien à aucune des deux parties et rester ainsi neutres dans la région.\n\nIl est toutefois impératif de maintenir le soutien à l'ASEAN et aux autres alliés du monde libre dans la région. Des mesures doivent être prises contre Hanoï et son fantoche à Phnom Penh, mais pas contre celles qui soutiennent le gouvernement de coalition dans sa forme actuelle."
 CIA_CAM80.6.d:0 "Il était midi dans le Bureau Ovale lorsque le Président [USA.GetLeader] s'assit pour déjeuner ; un jambon au seigle et une petite salade César feraient très bien l'affaire. Alors qu'il commençait à manger et à feuilleter des papiers, quelques assistants entrèrent dans l'Ovale ; Secrétaire d'État [GetCurrentSecState], conseiller à la sécurité nationale [GetCurrentNatSecAdv]et directeur du renseignement central [GetCurrentCIADir].\n\n\"Monsieur, nous devons parler de nos relations avec le Cambodge. Depuis que nous avons décidé de soutenir le gouvernement de coalition du Kampuchea démocratique, l'État et le NSC ont discuté de la manière de l'organiser. Je suppose que vous avez lu notre mémoire sur la coalition ?\"\n\nLe président leva les yeux vers les trois fonctionnaires. \"Oui, mais mets-moi au courant.\"\n\n\"Oui Monsieur.\" La DCI hocha la tête. \"Le gouvernement de coalition est composé de la plupart des groupes d'opposition à la République populaire du Kampuchéa soutenue par Hanoï ; y compris d'anciens éléments khmers rouges, des membres du Front populaire de libération nationale khmer, qui est anti-Khmer rouge, et le FUNCINPEC royaliste, dirigé par Sihanouk.\"\n\nLe conseiller à la sécurité nationale l'interrompit. \"Notre préoccupation réside dans la manière d'organiser et de gérer le gouvernement afin d'éviter des conflits internes entre les trois factions, qui sont historiquement opposées les unes aux autres. L'État a déjà contacté secrètement les pays membres de l'ASEAN et chacun des groupes pour former officiellement un gouvernement avec notre soutien. Nous leur avons également proposé de prendre le siège de l'ONU à New York.\"\n\n\"Ça a l'air bien, messieurs. J'attends bientôt un mémoire conjoint plus complet à ce sujet. J'ai du travail à faire, mais merci.\" Il hocha la tête, finissant son déjeuner alors que les trois hommes partaient. Un autre régime soutenu par les Américains est établi."
 CIA_CAM80.7.d:0 "\"Bonjour. À compter de ce matin, j'ai le plaisir d'annoncer que les États-Unis d'Amérique reconnaîtront officiellement diplomatiquement le gouvernement de coalition du Kampuchéa démocratique comme le seul gouvernement souverain du Cambodge, également appelé Kampuchéa.\"\n\n\"Les États-Unis ne reconnaissent pas la République populaire illégitime du Kampuchea contrôlée par les Vietnamiens comme représentant du peuple cambodgien et accorderont des relations diplomatiques complètes au gouvernement de coalition du Kampuchea démocratique, y compris une représentation diplomatique auprès de leur gouvernement en exil à Pékin, en République populaire de Chine.\"\n\n\"Nous exhortons tous les partenaires et alliés de la communauté internationale à reconnaître rapidement le gouvernement de coalition du Kampuchea démocratique comme le gouvernement cambodgien légitime, et je suis fier d'annoncer que l'ambassadeur des États-Unis auprès des Nations Unies rédigera une résolution pour donner au gouvernement de coalition le siège cambodgien qu'il occupait auparavant. Merci et nous ne répondrons pas aux questions pour le moment.\"\n\nSouriant à la presse et aux diplomates rassemblés, le secrétaire d'État [GetCurrentSecState] a hoché la tête avant de s'éloigner du podium, les caméras clignotant. Un autre pays reconnu."
 CIA_CAM80.8.d:0 "D'excellentes nouvelles sont arrivées aujourd'hui de Washington, indiquant que les États-Unis ont reconnu notre projet de gouvernement de coalition du Kampuchéa démocratique. Dans un communiqué, le secrétaire d'État américain [GetCurrentSecState] a réitéré le soutien américain et s'est engagé à envoyer un envoyé au gouvernement en exil à Pékin.\n\nLes représentants du Front populaire de libération nationale khmer et du FUNCINPEC se sont montrés optimistes face à cette évolution, tandis que les représentants des éléments khmers rouges semblent s'y opposer pour des raisons idéologiques. Le président Sihanouk espère recevoir très prochainement un envoyé américain à Pékin."
 CIA_CAM80.9.d:0 "SOUTIEN AMÉRICAIN AUX MEMBRES DE LA COALITION CAMBODGIENNE : RECOMMANDATIONS\nBureau du Cambodge, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\n\nDepuis que les États-Unis ont officiellement reconnu diplomatiquement le gouvernement de coalition du Kampuchéa démocratique, notre objectif principal a été non seulement de maintenir des relations amicales avec le gouvernement en exil à Pékin, mais également de maintenir l'unité interne entre les trois principales factions. Le Bureau du Cambodge, l'Ambassade de Bangkok et l'Ambassade de Pékin estiment qu'un soutien devrait être apporté aux trois factions du gouvernement, mais avec prudence, en raison de leurs positions parfois opposées à l'égard des intérêts et des relations américaines entre elles.\n\nLes restes des Khmers rouges, officiellement connus sous le nom de Parti du Kampuchéa démocratique, représentent le groupe le plus dominant au sein du gouvernement de coalition. Après avoir été évincés par l'invasion vietnamienne et la formation ultérieure de la République populaire du Kampuchéa soutenue par Hanoï, les Khmers rouges ont été mis à l'écart, contraints de faire des compromis avec d'autres partis anti-vietnamiens pour atteindre leurs objectifs. Cette faction a été le principal sujet de préoccupation du bureau du Cambodge, de l'ambassade de Pékin et des responsables de Langley en raison de leur influence et de leur désir de renverser militairement la PRK.\n\nLe Front de libération nationale du peuple khmer (KPNLF), formé en 1979 en tant que coalition de mouvements de guérilla anti-vietnamiens et anti-PRK, est avant tout de nature anticommuniste. Contrairement aux Khmers rouges, le KPNLF est de nature militarisée, dépourvu des aspects politiques dont un nouveau gouvernement a désespérément besoin, ce qui explique son manque d'influence par rapport aux Khmers rouges. Cependant, les soutenir au maximum est primordial pour les intérêts de sécurité américains, car ils sont les plus étroitement alignés sur Washington.\n\nEnfin, le parti royaliste FUNCINPEC est le dernier membre majeur de la Coalition, ayant été formé par l'ancien Premier ministre Norodom Sihanouk en 1981 ; elle est très influente et impliquée auprès du gouvernement chinois, partageant un objectif commun : évincer la PRK du Cambodge ; envisageant même de s'allier avec les Khmers rouges pour atteindre leurs objectifs. Bien qu'il ne soit pas très influent, le gouvernement de coalition est dirigé par Sihanouk, choisi comme candidat de compromis.\n\n Soutenir ouvertement les trois partis est essentiel pour maintenir le soutien global des États-Unis et l'unité interne du CGDK ; le KPNLF est la faction la plus alignée sur les États-Unis et nous devrions envisager davantage d'aide et de soutien à ces forces sans pour autant les exclure."
 CIA_CAM80.10.d:0 "D'excellentes nouvelles sont venues de notre envoyé à l'ambassade américaine à Pékin, nous informant officieusement que les États-Unis ont promis de soutenir tous les membres de notre gouvernement, y compris les éléments du KPNLF et des Khmers rouges.\n\nLe président Sihanouk, du mouvement FUNCINPEC, se serait réjoui de cette évolution, après s'être inquiété du fait que les États-Unis soutiendraient injustement une faction au détriment des autres. Les dirigeants éminents des Khmers rouges et du KPNLF sont également satisfaits, et l'unité interne au sein de notre gouvernement atteint un nouveau sommet. Nous espérons que notre gouvernement à Pékin recevra bientôt une aide et un soutien supplémentaire."
 CIA_CAM80.11.d:0 "SOUTENIR LES FORCES D'OPPOSITION ANTICOMMUNISTES AU CAMBODGE\nBureau du Cambodge, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\n\nDepuis que les États-Unis ont officiellement reconnu diplomatiquement le gouvernement de coalition du Kampuchéa démocratique, notre objectif principal a été non seulement de maintenir des relations amicales avec le gouvernement en exil à Pékin, mais également de maintenir l'unité interne entre les trois principales factions. Le Bureau du Cambodge, l'Ambassade de Bangkok et l'Ambassade de Pékin sont d'avis que le soutien ne devrait être accordé qu'aux éléments anticommunistes du gouvernement de coalition, en raison de leur nécessité stratégique pour les intérêts américains.\n\nLe Front de libération nationale du peuple khmer (KPNLF), formé en 1979 en tant que coalition de mouvements de guérilla anti-vietnamiens et anti-PRK, est avant tout de nature anticommuniste. Contrairement aux Khmers rouges, le KPNLF est de nature militarisée, dépourvu des aspects politiques dont un nouveau gouvernement a désespérément besoin, ce qui explique son manque d'influence par rapport aux Khmers rouges. Cependant, les soutenir au maximum est primordial pour les intérêts de sécurité américains, car ils sont les plus étroitement alignés sur Washington.\n\nLe parti royaliste FUNCINPEC est le dernier membre majeur de la Coalition, formé par l'ancien Premier ministre Norodom Sihanouk en 1981 ; elle est très influente et impliquée auprès du gouvernement chinois, partageant un objectif commun : évincer la PRK du Cambodge ; envisageant même de s'allier avec les Khmers rouges pour atteindre leurs objectifs. Bien qu'il ne soit pas très influent, le gouvernement de coalition est dirigé par Sihanouk, choisi comme candidat de compromis.\n\nL'autre faction restante, composée des anciens Khmers rouges regroupés au sein du Parti du Kampuchea démocratique, représente la faction la plus influente mais aussi la plus menaçante pour l'unité interne et les intérêts des États-Unis. Ne pas les soutenir serait préférable pour préserver les intérêts de sécurité, même si le soutien aux deux autres devra rester secret pour garantir une unité interne adéquate."
 CIA_CAM80.12.d:0 "L'envoyé temporaire des États-Unis auprès de notre gouvernement à Pékin a secrètement informé notre gouvernement, via le président Sihanouk, que les États-Unis avaient donné la priorité au soutien uniquement aux partis KPNLF et FUNCINPEC, qui sont tous deux anticommunistes. Dans une déclaration à notre gouvernement, le chef de station de la CIA à Pékin a mentionné « le manque de confiance des anciens éléments khmers rouges et la crainte à Washington que leur influence cause plus de problèmes qu'il n'en vaut la peine pour toutes les parties ».\n\nLes représentants du KPNLF et du FUNCINPEC ont été informés que l'aide leur parviendrait clandestinement via la frontière thaïlandaise et par d'autres moyens. Les représentants de la faction khmère rouge ne seront pas informés pour des raisons d'unité interne. Nous saluons cette évolution, mais sommes préoccupés par les problèmes d'unité et de confiance entre chacun des trois partis du gouvernement, qui pourraient s'aggraver à l'avenir."
 CIA_CAM80.13.d:0 "Aujourd'hui, dans une annonce matinale, un porte-parole du Département américain de la Défense à Washington a confirmé la vente officielle d'équipements lourds au gouvernement de coalition du Kampuchéa, considéré comme le gouvernement légitime du Cambodge par les États-Unis.\n\nPrévue pour inclure des chars et des véhicules blindés d'anciens modèles, la vente comprendra également quelques hélicoptères d'anciens modèles, similaires à ceux utilisés dans le conflit du Vietnam. Les réactions internationales ont été mitigées, mais la plupart des alliés américains restent favorables, en particulier dans la mesure où ils seront utilisés pour combattre les forces fantoches du Vietnam et de la PRK dans la région."
 CIA_CAM80.14.d:0 "L'attaché de défense temporaire faisant partie de notre représentation américaine à Pékin nous a informés que les États-Unis commenceraient immédiatement à livrer des armes lourdes au CGDK. Composé de chars de combat principaux d'anciens modèles, de véhicules de combat d'infanterie, de dragueurs de mines, ainsi que de plusieurs hélicoptères UH-1 Huey, le programme d'aide est conçu pour donner à nos forces l'initiative de combattre les forces de la PRK et du Vietnam à la frontière entre la Thaïlande et le Cambodge.\n\nDes personnalités au sein de notre gouvernement sont largement satisfaites de cette évolution ; outre l'aide de la Chine, cette assistance fera plaisir aux forces du KPNLF et du FUNCINPEC, dont beaucoup forment les troupes de combat de première ligne au sein du gouvernement de coalition."
 CIA_CAM80.15.d:0 "L'envoyé américain qui dirige notre représentation américaine à Pékin nous a informés que les États-Unis limiteraient les programmes d'aide proposés à l'aide humanitaire. Malgré les appels de notre gouvernement en faveur d'armes et d'opportunités de formation pour renforcer notre capacité à combattre la PRK et les forces vietnamiennes, Washington a décidé de nos priorités à notre place.\n\nSelon l'envoyé, l'aide se limitera à des « fournitures humanitaires », notamment des rations alimentaires, des réserves d'eau, des vêtements, des fournitures médicales, des équipements de construction et d'autres articles utilisés pour améliorer la qualité de vie des membres du CGDK et du territoire que nous détenons. Malheureusement, nous détenons peu de territoire et aurions préféré d'abord une aide militaire.\n\nLes membres de notre gouvernement, en particulier le KPNLF, sont furieux de cette évolution et souhaitent une aide supplémentaire en matière d'armement, car c'est la priorité du gouvernement."
 CIA_CAM80.16.d:0 "Aujourd'hui à Washington, le secrétaire d'État américain [GetCurrentSecState] a annoncé que les États-Unis poursuivraient leur soutien au changement de régime au Cambodge. Actuellement dominé par le Front uni du Cambodge pour le salut national, le gouvernement cambodgien est effectivement contrôlé par ses envahisseurs vietnamiens, qui soutiennent une ligne pro-soviétique.\n\nLargement attendue comme un moyen de légitimer un changement de régime en faveur du gouvernement de coalition du Kampuchéa démocratique soutenu par les États-Unis, cette annonce a été fermement condamnée par le gouvernement cambodgien, le gouvernement vietnamien, les Soviétiques et le reste du bloc de l'Est."
 CIA_CAM80.17.d:0 "L'envoyé américain qui dirige notre représentation américaine à Pékin nous a informés que les États-Unis font activement et publiquement pression en faveur d'un changement de régime en notre faveur au Cambodge. Dans une annonce publique de Washington, le secrétaire d'État [GetCurrentSecState]a annoncé son soutien public à notre gouvernement et a exhorté les alliés internationaux à soutenir notre cause.\n\nTous les partis du gouvernement de coalition se réjouissent de cette annonce, y compris les forces khmères rouges. D'autant plus que du matériel lourd a été livré, cela garantira nos capacités et notre victoire contre le régime soutenu par Hanoï !"

 # CIA Afghan Civil War
 AFG_CW.0.desc:0 "Après le retrait des forces soviétiques d'Afghanistan, la situation en Afghanistan n'a fait que se détériorer davantage et une guerre civile à grande échelle a éclaté. Alors que la grande majorité des factions d'opposition se sont regroupées sous la bannière du gouvernement intérimaire afghan, l'unité de la coalition est pour le moins extrêmement suspecte. Comme il est peu probable que le gouvernement central soit en mesure de contenir indéfiniment les forces d'opposition plus ou moins unifiées, les chances pour l'opposition de former un gouvernement stable sont estimées quasi inexistantes. Pour compliquer encore les choses, le Hezb-e Islami Gulbuddin, la faction dirigée par Gulbuddin Hekmatyar, s'est retirée du gouvernement intérimaire afghan et s'est emparée de son propre territoire près du Pakistan. Étant donné l'essentiel de l'aide de l'Arabie Saoudite et du Pakistan destinée aux forces d'Hekmatayar, on peut se demander si cela à lui seul a déjà réduit à néant les faibles chances d'une résolution pacifique entre les factions rebelles. Notre administration doit maintenant déterminer comment procéder, si nous allons de l'avant dans ce conflit naissant."
 AFG_CW.1.desc:0 "Après d'intenses débats au sein de la Central Intelligence Agency (CIA) et du National Security Council (NSC), le gouvernement a décidé d'autoriser un financement supplémentaire pour les forces de résistance afghanes dans ce pays assiégé d'Asie centrale. Cependant, la décision de savoir qui soutenir est encore largement débattue au sein de l'appareil de renseignement. Jusqu'à présent, la plupart de nos alliés, dans leurs efforts pour soutenir les forces de résistance dans la région, ont fourni le Hezb-e Islami Gulbuddin de Gulbuddin Hekmatyar. Cependant, ses forces n'ont pas encore remporté de victoire militaire clé et se sont récemment heurtées aux forces générales. L'autre faction majeure que nous pourrions soutenir serait le Jamat-e Isliami, dirigé par le célèbre résistant Ahmad Shah Massoud. En plus d'être tous deux anticommunistes, il convient de noter qu'étant donné la diversité ethnique de l'Afghanistan, Massoud et ses forces représentent largement les intérêts tadjiks tandis qu'Hekmatyar représente largement les intérêts pachtounes. L'un ou l'autre choix peut avoir des conséquences à long terme. "
 AFG_CW.2.desc:0 "Après de nouveaux débats, le Conseil de sécurité nationale a décidé de soutenir le Jamat-e Isliami plutôt que le Hezb-e Islami Gulbuddin. La plupart de nos principaux alliés régionaux, en particulier le Pakistan et l'Arabie saoudite, ont consacré l'essentiel de leur financement et de leur soutien au Hezb-e Islami Gulbuddin et à d'autres groupes affiliés. Cependant, ce groupe n'a remporté aucune victoire militaire notable depuis sa création, que ce soit pendant la guerre soviéto-afghane ou jusqu'à présent pendant la guerre civile. De plus, Gulbuddin Hekmatyar, le chef du Hezb-e Islami, Gulbuddin s'est révélé politiquement peu fiable, un exemple clé en étant son récent retrait des forces de la coalition contre le gouvernement central. De plus, des inquiétudes ont été soulevées quant au tempérament et à l'idéologie d'Hekmatyar, notamment en ce qui concerne sa représentation des intérêts pachtounes, ses liens avec des éléments plus radicaux et son stockage d'armes plus lourdes tout en restant à l'écart de la guerre civile en cours. À l'inverse, Massoud semble être une figure unificatrice et un leader notable au cours de la dernière décennie et pourrait fournir le leader dont l'Afghanistan aura besoin une fois la guerre terminée. "
 AFG_CW.3.desc:0 "Heureusement, les États-Unis ont décidé de nous soutenir dans un avenir proche en nous fournissant des armes et une aide financière. Cela fait suite à plusieurs réunions avec des agents du renseignement américain dans le nord de l'Afghanistan, à la lumière des divisions au sein de la coalition d'opposition contre le gouvernement central communiste et pour garantir que nous sommes capables de mettre fin au gouvernement central. Malheureusement, une fois que nous aurons inévitablement vaincu le gouvernement de Kaboul, nous devrons faire face aux différents seigneurs de guerre et autres factions de la guerre en cours. Le plus inquiétant est le Hezb-e Islami Gulbuddin, qui s'est séparé de notre coalition et s'est retiré dans ses bastions pachtounes près du Pakistan. Dans le pire des cas, Hekmatyar pourrait attendre que nous prenions Kaboul avant de lancer sa propre offensive pour s'emparer de notre prise."
 AFG_CW.4.desc:0 "Même s'il n'est peut-être pas la faction la plus célèbre de la guerre afghano-soviétique, le Hezb-e Islami Gulbuddin et son chef Gulbuddin Hekmatyar ont été des alliés indéfectibles de nos partenaires de sécurité régionaux tout en étant potentiellement utiles dans un Afghanistan réunifié en tant que représentants du peuple pachtoune. Cependant, Hekmatyar a conduit son organisation à se retirer des combats en cours entre le gouvernement intérimaire et le gouvernement central communiste et s'est retirée dans ses redoutes peuplées de Pachtounes. Bien que malheureux, cela offre une occasion unique d'attendre que les deux camps se saignent mutuellement, puis de fournir à Hekmatyar une aide suffisante pour prendre le contrôle de Kaboul au moment opportun. Cela dit, plusieurs analystes du renseignement ont été en désaccord avec cette décision, arguant qu'Hekmatyar n'est rien de plus qu'un opportuniste qui se retournera contre ses maîtres dès que cela lui sera bénéfique."
 AFG_CW.5.desc:0 "Excellente nouvelle, Washington a décidé de redoubler son soutien à notre cause et a décidé d'intensifier son soutien à notre cause aux dépens des autres factions afghanes. Plus prometteur encore est le soutien américain à nos intentions de prendre Kaboul une fois que les autres factions se seront saignées dans la guerre civile en cours. Avec le soutien américain et une coordination accrue entre Washington, Riyad et Islamabad, nos forces auront beaucoup plus de chances de réussir à s'emparer de Kaboul et d'autres zones critiques du pays lorsque nous déciderons de frapper. En revanche, cette décision conduira sûrement à une plus grande dépendance de notre mouvement à l'égard des États-Unis et nous amènera probablement à céder aux intérêts américains dans un avenir prévisible. Cependant, c'est un petit prix à payer pour le soutien continu d'une puissance mondiale."
 AFG_CW.6.desc:0 "Au cours de la dernière décennie, nos principaux alliés régionaux, en particulier le Pakistan et l'Arabie saoudite, ont soutenu la faction militante Hezb-e Islami Gulbuddin de Gulbuddin Hekmatyar. Cependant, au fil du temps, il est devenu clair qu'Hekmatayar n'a déployé que peu d'efforts pour combattre réellement ses ennemis déclarés et qu'il a même abandonné la coalition contre le gouvernement central de Kaboul pour se retirer dans ses redoutes pachtounes. Cela pourrait légèrement aliéner certains de nos alliés, en particulier le Pakistan, mais nous ne devrions pas être le facteur déterminant de notre politique en Afghanistan. Une analyse plus approfondie réalisée par la Central Intelligence Agency a réaffirmé la conviction du Conseil de sécurité nationale selon laquelle Hekmatyar est avant tout un opportuniste et cherchera probablement à semer le chaos et la discorde plus tard dans le conflit en cours. À l'inverse, certains analystes ont également fait valoir qu'en retirant son soutien à Hekmatyar, une figure majeure de la communauté pachtoune, cela pourrait conduire à une radicalisation accrue de la population pachtoune d'Afghanistan."
 AFG_CW.7.desc:0 "Malheureusement, les Américains ont décidé de cesser de soutenir notre cause. Même si nos autres fournisseurs étrangers nous ont rassurés sur le fait qu'ils ne nous abandonnaient pas, leurs affirmations sont pour le moins suspectes. Cependant, nous avons stocké un armement important pour lancer une attaque sur Kaboul une fois que les forces du gouvernement intérimaire afghan et du gouvernement central communiste se seront mutuellement exsangues. Malheureusement, d'autres ne réalisent pas que nous devons suivre notre propre voie et prendre le pouvoir par nous-mêmes pour empêcher une nouvelle oppression du peuple pachtoune. La présence hazara et tadjike dans la coalition intérimaire s'unirait sûrement pour diriger le pays aux dépens de notre peuple, car pour l'instant nous devons attendre et nous préparer à notre éventuelle attaque contre Kaboul.\n\nPeut-être devrions-nous envisager d'approfondir les liens avec les religieux locaux pour rallier des soutiens en territoire ami ?"
 
 # CIA Pakistan Nukes
 CIA_PAKn.0.desc:0 "La Central Intelligence Agency (CIA) a récemment pris connaissance d'avancées significatives dans le programme nucléaire pakistanais. Compte tenu de l'instabilité générale au Pakistan et du conflit de longue date avec l'Inde, cela constitue une source de préoccupation majeure. D'un autre côté, le Pakistan est un soutien majeur de nos activités en Afghanistan, activement anticommuniste et l'un de nos principaux alliés dans la région. Cela nous laisse face à deux véritables options : la première option, de loin la plus simple, serait d'ignorer l'existence du programme et, dans le cas d'une révélation publique, de chercher à bloquer les sanctions contre le Pakistan au Conseil de sécurité des Nations Unies. Cela permettrait au Pakistan de poursuivre son programme et de nuire davantage à la non-prolifération nucléaire, mais cela servirait nos intérêts dans la région. La deuxième option serait de sanctionner le Pakistan et de chercher à forcer la fin du programme en confirmant publiquement son existence et en soutenant les efforts de sanctions aux Nations Unies. Cependant, cela nous coûterait presque certainement notre alliance avec le Pakistan et mettrait en danger nos opérations dans la région. Comment devons-nous procéder ?"
 CIA_PAKn.1.desc:0 "Le président américain [USA.GetLeader] a confirmé qu'il avait demandé au département du Trésor d'appliquer des sanctions contre le Pakistan en ce qui concerne le programme actif d'armes nucléaires du pays. Les sanctions visent le programme nucléaire lui-même ainsi que les dirigeants politiques et militaires du Pakistan. Même si le programme nucléaire pakistanais n'a pas été confirmé avec certitude auparavant, cela ne surprend pas autant la communauté internationale. Ce qui est surprenant cependant, c'est que les États-Unis aient décidé d'agir sur ce sujet. Ces dernières années, Washington a resserré ses liens avec le Pakistan en raison d'objectifs stratégiques communs et d'ennemis dans la région. Surtout avec le conflit en cours en Afghanistan, où les États-Unis et le Pakistan soutiennent tous deux les forces anticommunistes contre le gouvernement central. Cette mesure jette le doute sur l'avenir des relations et de la coopération américano-pakistanaise dans la région."
 CIA_PAKn.2.desc:0 "Des nouvelles de Washington. L'Amérique a imposé un large éventail de sanctions contre notre gouvernement, notre armée et en particulier notre programme nucléaire. Compte tenu de notre dépendance à l'égard du soutien militaire et économique américain pour nos efforts à l'étranger et pour stabiliser notre domination, cette situation est catastrophique. Non seulement l'Amérique nous impose des sanctions, mais des signaux ont été émis selon lesquels les États-Unis feront pression en faveur de sanctions contre nous au Conseil de sécurité des Nations Unies. Cet ensemble d'actions déstabilisera sûrement davantage notre régime et mettra en danger le soutien continu aux moudjahidines en Afghanistan. Cependant, nous n'avons guère d'autre choix que de poursuivre notre programme nucléaire étant donné que l'Inde possède des armes nucléaires. Nous ne serons jamais en sécurité tant que l'Inde disposera d'armes nucléaires et que nous n'aurons pas de contre-attaque pour empêcher une nouvelle agression indienne contre nos droits légitimes "
 CIA_PAKn.3.desc:0 "Même si le dévoilement de notre programme nucléaire a constitué un coup dur pour notre nation et a conduit à des sanctions de la part de plusieurs pays, les États-Unis sont restés fidèles à leur soutien à notre gouvernement. L'ambassadeur américain a souligné que même si Washington n'approuve pas notre programme nucléaire, celui-ci ne constitue qu'un fléau mineur à nos relations continues et est largement éclipsé par la nécessité d'une coopération continue dans la lutte contre le communisme dans la région. L'accent a été particulièrement mis sur la poursuite de la coordination en Afghanistan afin de renverser le gouvernement communiste afghan et d'empêcher une nouvelle expansion du communisme dans la région. Même si cela empêchera certainement de nombreux pays d'appliquer des sanctions, notre économie sera quand même touchée par cette épreuve, même si le pire des cas a été évité."

 # CIA Mozambique

 MZB_CIA80.0.desc:0 "Le départ des Portugais d'Afrique à la suite de la Révolution des oeillets a conduit à des guerres civiles en Angola et au Mozambique. Même si le Mozambique n'est pas tombé instantanément dans la guerre civile comme l'Angola, les tensions entre les différentes factions, les partis et les conflits ethniques sont tous des facteurs qui y contribuent. La guerre entre le Front communiste de libération du Mozambique (FRELIMO) et la Résistance nationale mozambicaine nationaliste (RENAMO). Pendant la guerre d'indépendance au Mozambique, le FRELIMO était en fait la seule faction à lutter contre la domination portugaise. La RENAMO a été créée l'année suivant le départ du Portugal par d'anciens membres de la branche armée du FRELIMO, des hommes politiques anticommunistes et d'anciens Flechas portugais. Les Flechas étaient les unités paramilitaires d'élite de la police secrète portugaise pendant la guerre d'indépendance et étaient composées de membres de tribus locales et de transfuges rebelles.\n\nBien que moins connue du grand public, la Rhodésie a joué un rôle important dans la formation et la création de la RENAMO comme moyen de déstabiliser le Mozambique. Après la fin de la Rhodésie, d'anciens membres de l'armée rhodésienne ont rejoint la RENAMO. La guerre civile nous offre une opportunité intéressante. Nous pourrions nous contenter de fournir une aide humanitaire ou chercher à négocier une solution diplomatique. Cependant, cela ne nous apporterait que peu d'avantages géopolitiques. Une stratégie plus ambitieuse consisterait à collaborer avec l'Afrique du Sud pour soutenir la RENAMO et chercher à justifier une plus grande intervention dans le conflit."
 MZB_CIA80.1.desc:0 "La guerre civile et les conséquences de la guerre d'indépendance contre le Portugal ont laissé le Mozambique dans le dénuement et le risque de famine. L'utilisation intensive de mines terrestres a également conduit à une crise médicale avec un grand nombre d'amputés. Pour aider à atténuer ce problème, le président a autorisé un plan d'action visant à fournir une aide humanitaire au Mozambique par l'intermédiaire de tiers et à traiter avec des représentants des deux parties au conflit armé pour permettre l'envoi de l'aide dans leurs territoires contrôlés respectifs. Espérons que de telles négociations pourraient conduire à de nouveaux contacts et à la construction de ponts pour permettre à la diplomatie de prévaloir et de mettre un terme à l'amiable à la guerre civile. Contrairement à l'Angola ou à l'Éthiopie, la guerre civile mozambicaine a connu assez peu d'interventions extérieures ces dernières années, alors que l'Afrique du Sud et auparavant la Rhodésie s'étaient impliquées dans le conflit, il n'y a eu aucune présence majeure soviétique, cubaine ou autre bloc de l'Est au Mozambique."
 MZB_CIA80.2.desc:0 "Nos contacts avec la Central Intelligence Agency nous ont récemment fait savoir que nous devrons assister aux négociations avec le gouvernement du Front de libération du Mozambique (FRELIMO) si le FRELIMO accepte les négociations proposées par Washington pour mettre fin à la guerre civile. Les conditions que Washington nous a informés qu'il envisageait de présenter représenteraient dans une certaine mesure un dépôt des armes de notre côté et l'acceptation de positions au sein d'un gouvernement d'unité avant des élections libres. Les principaux membres du parti au courant de la proposition ont exprimé de graves inquiétudes quant à la possibilité que le FRELIMO annule les termes de l'accord après avoir été désarmés, tandis que d'autres ont exprimé leur volonté de négocier pour mettre fin à une guerre civile de plus en plus dévastatrice. Une autre préoccupation encore plus pressante a été soulevée : si nous choisissons de refuser, Washington va-t-il simplement nous forcer la main en menaçant de suspendre l'aide et en faisant pression sur le Malawi et l'Afrique du Sud pour qu'ils mettent un terme à leur aide matérielle ?"
 MZB_CIA80.3.desc:0 "Sans surprise, la Résistance nationale mozambicaine (RENAMO) a fait part de son acceptation de notre proposition de négociation et a annoncé en interne son soutien à la mesure. Même si nous n'avions aucun doute sur le fait que la RENAMO finirait par venir à la table des négociations, la décision d'accepter immédiatement les conditions est un spectacle bienvenu pour notre administration. Des inquiétudes ont été exprimées quant au fait que les membres les plus radicaux de la RENAMO, en particulier ceux qui avaient déjà combattu pour la Rhodésie et le Portugal, chercheraient à saper d'éventuelles négociations. Cependant, l'opposition interne ne s'est pas matérialisée et la plupart des membres de la RENAMO ont exprimé le désir de mettre fin à la guerre civile si des conditions équitables pouvaient être conclues et appliquées par un tiers pour garantir le respect de ces conditions. Nous attendons maintenant la réponse du gouvernement mozambicain à notre proposition de négociation."
 MZB_CIA80.4.desc:0 "Étonnamment, la Résistance nationale mozambicaine (RENAMO) nous a informés qu'elle n'avait aucune envie d'engager des négociations avec le Front de libération du Mozambique (FRELIMO). Nos analystes trouvent hilarant de penser avoir le choix dans cette affaire. Nos agents travaillant comme gestionnaires au sein de la RENAMO se sont déjà mis au travail pour faire pression sur les membres les plus hauts placés pour qu'ils reconsidèrent, et plusieurs autres membres hostiles ont été liquidés. Nous nous attendons à ce que la RENAMO change d'avis dans les prochains jours après avoir exprimé davantage notre mécontentement en menaçant de suspendre l'aide et en l'informant que nous envisageons de faire pression sur Pretoria pour qu'elle arrête ses propres expéditions d'aide vers les bases de la RENAMO au Mozambique et au Malawi. Alors que la RENAMO continue de subir des pressions, nous devrions poursuivre nos discussions avec le FRELIMO pour tenter de remettre les négociations sur les rails."
 MZB_CIA80.5.desc:0 "Une proposition intéressante est arrivée récemment. Des diplomates américains ont contacté notre ministère des Affaires étrangères et ont proposé de mener des négociations entre nous et la Résistance nationale mozambicaine (RENAMO) dans le but de mettre un terme à la guerre civile. D'une part, accepter cette décision, qu'elle réussisse ou non, aurait une image positive de notre gouvernement et démontrerait notre volonté de mettre fin pacifiquement à la guerre civile. Cependant, une telle démarche conduirait sûrement à une légitimation de la RENAMO et si les négociations aboutissaient, cela conduirait inévitablement à un affaiblissement de notre contrôle sur l'appareil d'État et les concessions probables incluraient une modération de notre politique étrangère ainsi que la garantie d'élections libres dans un avenir proche, élections que nous pourrions très bien perdre. De plus, accepter cette offre aliénerait probablement nos alliés étrangers et affaiblirait le soutien des nations socialistes à notre gouvernement. Comment devons-nous procéder ?"
 MZB_CIA80.6.desc:0 "Étonnamment, le Front de libération du Mozambique (FRELIMO) a accepté de participer aux négociations que nous avions demandées. Bien qu'inattendue, c'est une excellente nouvelle et pourrait être l'occasion de mettre fin à la guerre civile sanglante au Mozambique et d'obtenir des concessions du FRELIMO en formant un nouveau gouvernement d'unité qui pourrait prendre ses distances avec Moscou et rechercher une ligne d'action plus conciliante concernant Pretoria. Le Département d'État a été autorisé à imposer des concessions significatives à la Résistance nationale mozambicaine (RENAMO) pour garantir un cycle de négociations productif et mettre fin à la guerre civile dans des conditions favorables à l'ouest. La proposition envisagée établirait un gouvernement unifié, dont le chef serait issu du FRELIMO, la RENAMO obtenant divers postes au sein du gouvernement et la garantie d'élections libres d'ici quelques années qui seraient honorées par les deux parties. Cela devrait être acceptable pour les deux parties et chercher à modérer le gouvernement mozambicain. "
 MZB_CIA80.7.desc:0 "Malheureusement, le Front de libération du Mozambique (FRELIMO). A rejeté nos propositions de négociations et les a dénoncées comme étant une tactique dilatoire visant à armer la Résistance nationale mozambicaine anticommuniste (RENAMO). En réalité, c'est une occasion manquée de leur côté, nous étions disposés à parvenir à une fin pacifique dans des conditions équitables pour les deux parties et prévoyions de faire pression pour des élections pacifiques dans un avenir proche. La RENAMO a réagi de manière largement positive à cette évolution, compte tenu de sa résilience initiale à accepter les négociations. Notre administration peut désormais soit admettre ses efforts pour mettre fin à la guerre civile, soit envisager des propositions plus extrêmes circulant au sein de la Central Intelligence Agency et soutenues par des membres plus militants du Conseil national de sécurité. Quoi qu'il en soit, si rien d'autre n'est assuré, l'avenir du Mozambique, alors que la guerre civile continue de s'intensifier, est pour le moins sombre."
 MZB_CIA80.9.desc:0 "Les négociations ont progressé, même si nous n'avons pas obtenu autant de concessions que nous le souhaitions, nous avons signé un accord avec le gouvernement pour mettre fin à la guerre civile et former un gouvernement d'union nationale. L'accord fournira à notre leadership plusieurs ministères importants au sein du gouvernement, légalisera nos partis politiques et conduira à une nouvelle constitution qui doit être ratifiée par les deux partis et à un accord pour organiser des élections libres l'année prochaine avec des observateurs internationaux présents dans tout le pays. Cela met néanmoins un terme à notre lutte armée, du moins pour le moment, mais cela nous donne l'occasion de participer à des élections libres et de mettre le Mozambique sur la voie d'un avenir meilleur pour tous. On ne sait pas exactement comment les futures négociations sur la nouvelle constitution et comment le Front de libération du Mozambique (FRELIMO) honorera ses accords. Nos contacts avec Washington sont optimistes quant à la situation."
 MZB_CIA80.10.desc:0 "Les négociations sont terminées et finalisées. À la surprise de beaucoup, nos négociateurs ont réussi à parvenir à un accord acceptable pour les deux parties, et la fin de la guerre civile a été officiellement signée par les dirigeants de notre gouvernement et de la Résistance nationale mozambicaine (RENAMO). Même si des problèmes subsistaient, nous avions finalement plus à gagner qu'à perdre en signant l'accord selon lequel nous avons concédé plusieurs ministères à la RENAMO et que nous devrons organiser des élections libres dans les années à venir. Notre parti a gardé le contrôle de la présidence et pourra prendre une position clé dans la rédaction de la nouvelle constitution. Les concessions faites à la RENAMO diminuent certes notre influence au sein du gouvernement, mais ne paralyseront pas notre capacité à remporter les élections qui suivront. Les dirigeants restent convaincus que la majeure partie du soutien public reste fidèle au FRELIMO, compte tenu de notre rôle dans la libération de la nation du Portugal. Nous devons néanmoins rester prudents quant aux intentions de la RENAMO, de Pretoria et de Lilongwe d'influencer les élections et assurer la démilitarisation des forces de la RENAMO dans tout le pays ou rechercher de nouveaux compromis sur l'intégration de leurs soldats dans l'armée."
 MZB_CIA80.11.desc:0 "Faire reculer le communisme en Afrique australe est devenu un objectif stratégique majeur de l'administration. Une fois cette décision politique prise, l'une des principales cibles du recul sera le Mozambique. Le conflit est similaire à la guerre civile angolaise, mais il a reçu beaucoup moins d'attention et sans aucune loi ou amendement du Congrès interdisant à notre administration d'investir dans les rebelles anticommunistes au Mozambique, nous pouvons commencer des opérations visant à saper le gouvernement mozambicain sans risquer de sanctions pénales. Dans cette mesure, la Central Intelligence Agency a ordonné à nos agents d'élargir leurs liens avec la Résistance nationale mozambicaine (RENAMO) afin de fournir une aide matérielle limitée et une formation à leurs forces. D'autres équipes ont également été envoyées pour organiser des réseaux à Cabo Delgado et dans d'autres régions islamiques du nord du Mozambique afin de travailler à la constitution d'une force de guérilla islamique afin de drainer davantage les ressources du gouvernement. Des inquiétudes ont été soulevées quant au risque que cette stratégie ne dégénère en violence sectaire, mais le président estime que, étant donné que la minorité musulmane du Mozambique est largement présente dans le nord, en particulier autour de Cabo Delgado, toute violence religieuse serait de portée limitée."
 MZB_CIA80.12.desc:0 "L'Afrique du Sud soutient depuis longtemps les rebelles anticommunistes au Mozambique. Pour nous aider dans nos efforts de renforcement de la Résistance nationale mozambicaine (RENAMO), le président a autorisé la Central Intelligence Agency à commencer à partager des renseignements sur le Mozambique avec ses homologues de Pretoria dans le but de renforcer le soutien sud-africain à la RENAMO. Bien que cela soit peut-être de mauvais goût, nos agents ont également donné à l'Afrique du Sud des informations détaillées sur les itinéraires et les bases du Congrès national africain à l'intérieur du Mozambique. Grâce à cela, le gouvernement sud-africain intensifiera sûrement sa guerre et poursuivra son soutien à la RENAMO. Des inquiétudes ont toutefois été soulevées par certains membres du Conseil national de sécurité quant à la coopération avec les Sud-Africains, mais le président a décidé que, bien que désagréable, il s'agissait d'une mesure nécessaire pour détourner davantage le gouvernement mozambicain de notre implication dans la guerre civile."
 MZB_CIA80.13.desc:0 "Même si le renversement du gouvernement mozambicain reste un objectif stratégique de l'administration, la décision a été prise que les vies américaines ne seront pas mises en danger dans le conflit et qu'une nouvelle escalade avec les Soviétiques devrait être évitée. Cela sera accompli en continuant à fournir secrètement une aide militaire aux forces rebelles tout en niant toute implication dans la guerre civile en cours au Mozambique. Compte tenu du manque général d'équipement militaire standardisé, nos agents seront en mesure de fournir rapidement aux rebelles des armes à feu modernes, des mines terrestres et d'autres systèmes moins complexes qui devraient néanmoins être capables d'endommager lourdement les forces gouvernementales. Même si cela ne suffira peut-être pas pour le moment à renverser le gouvernement communiste, cela fera de la Résistance nationale mozambicaine (RENAMO) une menace plus crédible contre le gouvernement et le détournera sûrement de toute implication future en Afrique du Sud."
 MZB_CIA80.14.desc:0 "Jusqu'à présent, nos efforts ont commencé à porter leurs fruits, mais si nous voulons réellement commencer à éradiquer le communisme d'Afrique australe, nous devons commencer à jeter les bases d'une intervention américaine dans la région. À cet effet, nos agents sur le terrain ont collecté des photos, des témoignages et d'autres informations auprès d'habitants locaux montrant les horreurs de la guerre, tandis que nous allons bien sûr manipuler et vérifier ces informations. Les images déchirantes d'enfants dépourvus de membres en raison de l'utilisation intensive de mines terrestres toucheront sûrement le coeur des Américains ordinaires et contribueront à faire pression sur le Congrès pour qu'il fournisse des fonds supplémentaires pour nos efforts en Afrique. Pendant que les médias racontent cela, notre ambassadeur auprès des Nations Unies présentera les preuves aux Nations Unies et appellera à une mesure pour faire respecter un cessez-le-feu au Mozambique. Cette mesure sera vouée à l'échec mais démontrera à l'opinion publique notre volonté de mettre un terme au conflit et montrera comment les forces communistes refusent de négocier ou de faire leur part pour mettre fin à l'effusion de sang."
 MZB_CIA80.15.desc:0 "Pour poursuivre notre objectif de justifier une invasion du Mozambique, le secrétaire d'État a lancé un ultimatum demandant au gouvernement du Mozambique d'accepter de négocier avec la Résistance nationale mozambicaine (RENAMO). Nous nous attendons par tous les moyens à ce que le gouvernement mozambicain rejette notre ultimatum, ce qui nous justifiera comme une intervention armée pour renverser le gouvernement et installer un gouvernement pro-occidental sous la direction de la RENAMO. Bien que l'opinion publique soit encore largement divisée sur la question, de récents sondages publics ont montré une augmentation du soutien à l'action au Mozambique, à la lumière de notre vaste campagne médiatique montrant les actions du gouvernement mozambicain contre la population du Mozambique. Néanmoins, si nous sommes contraints d'envahir le Mozambique, nous devons assurer une victoire rapide et ne pas rappeler au public les bourbiers passés en Asie au cours des dernières décennies."
 MZB_CIA80.16.desc:0 "Une récente missive de Washington a provoqué une onde de choc aux plus hauts échelons de notre gouvernement. Les États-Unis menacent de lancer une invasion de notre nation pour renverser notre gouvernement à moins que nous n'acceptions d'entamer des négociations avec les rebelles pour mettre fin à la guerre civile. Compte tenu du ton des revendications, toutes les négociations que nous entamerons seront intrinsèquement truquées contre nous, mais contrairement à l'Éthiopie ou à l'Angola, il y a effectivement très peu de volontaires étrangers qui nous aident dans notre lutte et les Américains et leurs alliés seraient probablement en mesure de paralyser notre armée en quelques jours, si cela nous rendait incapables de contrôler la capitale et de vastes étendues du pays. Pourtant, pourrions-nous accepter la proposition et faire pression pour un gouvernement d'unité et mettre notre confiance dans la démocratie ? Comment devons-nous procéder ?"
 MZB_CIA80.18.desc:0 "Le gouvernement mozambicain a rejeté notre ultimatum pour les négociations et, grâce à cette annonce, nous disposons enfin d'une justification complète pour lancer notre campagne armée contre le Mozambique. C'est dans cet esprit que les planificateurs militaires du ministère de la Défense ont élaboré des plans visant à envoyer un groupe aéronaval dans la région et à faire en sorte que nos moyens aériens paralysent rapidement les forces armées mozambicaines pour permettre aux forces d'opposition de lancer une offensive générale. Une fois les forces gouvernementales réprimées par notre puissance aérienne, nos forces chercheront à lancer un assaut sur Maputo, la capitale du Mozambique, avec le soutien secret de l'Afrique du Sud voisine. Bien que des problèmes puissent survenir, nos analystes ne pensent pas que l'établissement du contrôle sur la capitale et d'autres zones urbaines constituera un problème majeur. Toutefois, il sera important de veiller à ce qu'une insurrection communiste ne paralyse pas le nouveau gouvernement et cela représentera une menace potentielle majeure pour un gouvernement pro-occidental."
 MZB_CIA80.20.desc:0 "Étonnamment, le gouvernement mozambicain a entendu raison et a accepté de négocier la fin de la guerre civile. Ce n'était pas notre intention lorsque nous avons envoyé l'ultimatum, mais nous pouvons utiliser cela comme une opportunité pour imposer un gouvernement d'unité dominé par la Résistance nationale mozambicaine (RENAMO) et chercher à garantir une constitution plus démocratique au Mozambique. Une condition essentielle pour mettre fin à la guerre civile sera d'expulser du pays toutes les forces et tous les membres du Congrès national africain (ANC) et de fusionner les forces armées des deux camps, la préférence étant donnée aux officiers de la RENAMO. Il s'agit globalement d'une victoire majeure pour notre administration et représente la première étape pour inverser les avancées du communisme en Afrique australe. Il reste néanmoins du travail à faire et nous devons veiller au bon déroulement des négociations et éviter de trop susciter la colère de Moscou et du Congrès."
 MZB_CIA80.22.desc:0 "L'échec de la diplomatie dans la résolution de la guerre civile mozambicaine ne nous laisse d'autre choix que d'intervenir directement dans le conflit. Malgré leur refus potentiel de négocier, l'objectif de l'opération sera de vaincre militairement le gouvernement du Front de libération du Mozambique (FRELIMO) et d'instituer un gouvernement dirigé par la Résistance nationale mozambicaine (RENAMO). Cet objectif stratégique représenterait le recul du communisme en Afrique australe et réduirait la pression sur l'Afrique du Sud en coupant l'une des routes logistiques d'approvisionnement du Congrès national africain (ANC) et d'autres mouvements insurgés en Afrique du Sud. Cela dit, nous devrons soigneusement équilibrer nos priorités pour éviter toute réaction publique à l'égard de l'Afrique du Sud. Publiquement, nos motivations pour cette intervention sont de mettre rapidement fin à la guerre civile sanglante et d'établir un gouvernement capitaliste techniquement démocratique qui sera ouvert aux négociations avec Pretoria."
 MZB_CIA80.24.desc:0 "Excellente nouvelle, les États-Unis ont enfin lancé leur intervention au Mozambique pour mettre fin au régime communiste qui sévit dans notre pays. Nos contacts à la Central Intelligence Agency nous ont assuré qu'une fois le gouvernement communiste renversé, nous formerions le nouveau gouvernement. Cela dit, le moment est venu pour nous de redoubler d'efforts pour nous emparer de territoires et expulser les communistes de notre terre légitime. La sauvegarde des zones rurales sera essentielle dans les temps à venir pour empêcher une nouvelle insurrection communiste dans tout le pays. Nous devrons également commencer à concevoir une politique étrangère qui équilibre nos dettes envers Pretoria, Washington et le Malawi tout en renforçant le soutien populaire à notre gouvernement. Le Malawi, en particulier, devra être traité avec précaution étant donné son fort soutien à notre mouvement tout en revendiquant subtilement une grande partie de notre nation. Notre gouvernement devra également déterminer comment gérer la gestion des forces du Congrès national africain (ANC) et des passeurs à l'intérieur du pays. Pourtant, c'est le début d'un moment historique de l'histoire africaine, montrant que la marée communiste en Afrique peut être inversée."
 MZB_CIA80.25.desc:0 "Nouvelle intéressante, les États-Unis ont lancé une intervention à grande échelle au Mozambique pour écraser le gouvernement communiste. Même si notre implication manifeste n'a pas été sollicitée, nous avons fourni à Washington des renseignements importants sur les forces gouvernementales et leurs milices alliées. Nos forces spéciales ont été autorisées à attaquer les bases du Congrès national africain (ANC) de l'autre côté de la frontière pour endommager leurs infrastructures, alors que le Mozambique est dans le chaos. Dans l'ensemble, c'est une excellente nouvelle pour nos problèmes actuels, étant donné notre soutien à la Résistance nationale mozambicaine (RENAMO), le nouveau gouvernement devrait être favorable à nos intérêts et au moins réprimer la présence de l'ANC au Mozambique et sera probablement ouvert à une collaboration économique avec nous ainsi qu'avec notre allié le Malawi qui a également été un bienfaiteur majeur de la RENAMO. Même si les problèmes persistent, notamment en Afrique du Nord-Ouest et en Angola, cela devrait gravement nuire aux opérations de l'ANC dans l'est de notre pays et nous permettra de redéployer nos forces pour combattre davantage les forces communistes dans le nord-ouest."
 MZB_CIA80.26.desc:0 "Les Américains ont lancé une invasion pour renverser notre gouvernement. Cela survient après l'échec de la tentative américaine de mettre fin à la guerre civile. Les troupes américaines ont commencé à débarquer sur nos côtes et des bombardements massifs contre nos installations militaires ont commencé. Les combattants de l'opposition ont également été enhardis et apparemment mieux armés et ont également commencé à semer le chaos derrière nos lignes. Malheureusement pour nous, contrairement à l'Angola ou à l'Éthiopie, la présence cubaine est en réalité minime et il est extrêmement improbable que des renforts puissent arriver à temps pour sauver notre situation. La situation actuelle est sombre et ne fera probablement que s'aggraver à mesure que l'invasion s'intensifiera. Nous devrons déterminer si tenter une capitulation conditionnelle ou combattre jusqu'au bout est la meilleure option pour aller de l'avant."
 MZB_CIA80.17.desc:0 "Dans une escalade majeure, le président [USA.GetLeader] a annoncé un ultimatum à la Résistance nationale mozambicaine (RENAMO) et au Front de libération du Mozambique (FRELIMO) pour qu'ils cessent les hostilités et s'engagent dans des pourparlers diplomatiques de paix sous peine de subir des conséquences désastreuses. Les dirigeants de la RENAMO ont déjà annoncé leur soutien au processus et ont approuvé l'idée de pourparlers de paix dans les heures qui ont suivi cette annonce. Cependant, le FRELIMO n'a pas encore commenté cet ultimatum. Cuba a fermement condamné l'ultimatum et s'est engagé à soutenir le FRELIMO dans une confrontation armée avec les États-Unis. Alors que plusieurs autres pays socialistes et africains ont condamné l'ultimatum, la majorité de la communauté internationale est restée tièdement apathique face à la situation au Mozambique. Pendant ce temps, Pretoria a annoncé son ferme soutien à la RENAMO et sa volonté de stabiliser la région."
 MZB_CIA80.19.desc:0 "Le Front de libération du Mozambique (FRELIMO) a annoncé son opposition aux négociations de paix avec la Résistance nationale mozambicaine (RENAMO) visant à mettre fin pacifiquement à la guerre civile du pays. Cela vient en réponse à l'ultimatum du président américain [USA.GetLeader]aux deux parties en conflit pour qu'elles acceptent des négociations de paix sous peine de subir des conséquences importantes. Dans un discours de défi, {MZB.GetLeader], le leader du FRELIMO a prononcé un discours enflammé déclarant que le FRELIMO luttera jusqu'au bout contre les impérialistes américains et leurs chiens de compagnie de la RENAMO. Des inquiétudes ont été soulevées aux Nations Unies concernant une éventuelle invasion américaine à la lumière de l'échec de l'ultimatum. Bien que le président [USA.GetLeader] n'ait pas encore commenté l'évolution de la situation, le Pentagone a publié une déclaration indiquant que toutes les options étaient sur la table."
 MZB_CIA80.21.desc:0 "Un accord de paix négocié par les États-Unis a officiellement mis fin à 15 ans de guerre civile au Mozambique, qui a coûté la vie à près d'un million de personnes et déplacé des millions de personnes. L'accord, signé par le gouvernement mozambicain et les rebelles de la RENAMO, marque une avancée décisive dans les efforts diplomatiques visant à ramener la paix dans le pays.\n\nLa guerre, qui a commencé peu après l'indépendance du Mozambique du Portugal, a dévasté le pays. Le conflit a gravement endommagé l'économie et causé de nombreuses souffrances, le gouvernement et la RENAMO étant engagés dans une lutte brutale pour le contrôle.\n\nL'accord de paix, facilité par des diplomates américains et soutenu par les Nations Unies, comprend des dispositions sur le désarmement des combattants de la RENAMO, la représentation politique et les futures élections. Une clause d'amnistie a également été convenue pour promouvoir la réconciliation.\n\nLes dirigeants internationaux ont salué l'accord, le secrétaire d'État américain le qualifiant de « victoire pour la diplomatie ». Le Mozambique est désormais confronté au défi de la reconstruction, mais cet accord laisse espérer une paix et un redressement durables."
 MZB_CIA80.23.desc:0 "Suite au rejet par le Front de libération du Mozambique (FRELIMO) des pourparlers de paix concernant la guerre civile en cours, les États-Unis ont lancé une invasion au Mozambique. Les Forces de la Résistance nationale mozambicaine (RENAMO) ont également lancé une nouvelle offensive majeure contre les positions du FRELIMO dans tout le pays, désormais soutenues par la puissance aérienne américaine. L'invasion a été largement condamnée par un grand nombre de nations, notamment par l'Union soviétique et l'Allemagne de l'Est. Cuba s'est engagé à fournir des conseillers militaires et du matériel au FRELIMO, mais n'a pas encore décidé de s'impliquer davantage, en particulier étant donné que Cuba participe déjà aux conflits en Angola et en Éthiopie. Les critiques nationaux ont fait valoir que cela pourrait se transformer en un autre Vietnam, mais les organisations anticommunistes et les partisans de la RENAMO ont soutenu que la situation est complètement différente et que l'armée américaine est aujourd'hui plus adaptée à de telles opérations."

 CIA_RUS.0.desc:0 "Au grand choc de la majeure partie du monde et de notre propre gouvernement, le « rideau de fer » est effectivement tombé et les gouvernements communistes derrière ce rideau implosent maintenant rapidement. Cela crée une opportunité intéressante pour l'Agence. La désintégration rapide du bloc de l'Est et de l'Union soviétique nous offre l'opportunité de nous mêler activement des affaires des États nouvellement indépendants d'Europe de l'Est et d'Asie centrale, mais cela attirerait sûrement la colère de la Russie et pourrait nuire irrémédiablement aux chances de construire une relation constructive avec Moscou. En outre, d'autres analystes estiment qu'une intervention active dans l'ancien bloc soviétique ne servirait qu'à déstabiliser la région et à provoquer de nouveaux conflits. D'un autre côté, l'établissement actif de régimes proaméricains dans l'ancien bloc de l'Est renforcerait sûrement notre position géopolitique dans le monde et consoliderait potentiellement l'Amérique en tant qu'unique hyperpuissance mondiale. D'autres propositions incluent le financement des séparatistes en Russie, notamment en Tchétchénie, au Tatarstan et en Kalmoukie. Comment devons-nous procéder ?"
 CIA_RUS.1.desc:0 "Après un examen attentif et de longues discussions entre le conseiller à la sécurité nationale, le directeur de la Central Intelligence Agency et le président, [USA.GetLeader] a choisi de s'abstenir de toute opération de renseignement majeure dans l'ancienne sphère d'influence soviétique. Même si plusieurs membres de l'administration ont critiqué cette décision, estimant qu'elle manquait une opportunité cruciale, le sentiment général est que l'établissement d'une relation constructive avec Moscou devrait être une priorité plutôt que l'expansion des opérations secrètes américaines et de l'influence directe dans l'ex-Union soviétique. En outre, des inquiétudes ont été soulevées quant à la proposition visant à promouvoir activement des éléments sécessionnistes et islamistes en Russie et dans d'autres anciennes républiques soviétiques, car elle pourrait avoir des répercussions et permettre le terrorisme dans le monde entier, tout en provoquant inutilement de nouveaux troubles en Eurasie. Le temps nous dira s'il s'agissait vraiment d'une sage décision conduisant à des liens cordiaux avec Moscou ou d'une occasion perdue de paralyser définitivement un adversaire."
 CIA_RUS.2.desc:0 "Après un examen attentif et de longs entretiens entre le conseiller à la sécurité nationale, le directeur de la Central Intelligence Agency et le président, [USA.GetLeader] a choisi de se lancer à fond dans la proposition d'ingérence dans l'ancienne sphère d'influence soviétique. Des plans sont déjà en cours d'élaboration pour contrer les éventuelles invasions russes des républiques voisines, notamment de la Géorgie, ainsi que des rapports analytiques sur la guerre du Karabakh en cours. Une question controversée au sein de l'appareil de renseignement est celle de la position que notre administration devrait adopter à l'égard des différents mouvements islamistes au sein de l'ex-Union soviétique. En particulier sur la manière dont nous devrions traiter la Tchétchénie et la guerre civile en cours au Tadjikistan. Une faction souhaite rechercher une collaboration avec les anciens États soviétiques pour lutter contre le terrorisme islamiste radical, tandis qu'une autre souhaite utiliser les organisations islamistes de la région pour déstabiliser les régimes anti-américains. L'une ou l'autre option aura certainement des conséquences à long terme non seulement pour la région mais peut-être pour le monde entier."
 CIA_RUS.3.desc:0 "Alors que les révolutions de 1989 et la dissolution définitive de l'Union soviétique touchent à leur fin, beaucoup ont qualifié l'Amérique de vainqueur de la « Guerre froide ». Cela dit, de nombreux analystes du Département d'État et d'instituts politiques associés ont appelé à la retenue pendant cette période, le président américain [USA.GetLeader] a signalé son intention d'intensifier rapidement les activités clandestines et manifestes au-delà de l'ancien rideau de fer. Dans un discours public aujourd'hui, le président [USA.GetLeader] a déclaré le début d'une nouvelle ère, celle d'une Pax Americana où l'Amérique sera la seule hyperpuissance mondiale et cherchera à diffuser les valeurs américaines dans l'ancien bloc soviétique. Des inquiétudes et des critiques ont été soulevées par divers critiques nationaux et internationaux à l'égard de l'administration. Cependant, avec l'effondrement de l'Union soviétique, le désir d'interventionnisme de l'opinion publique américaine s'est rapidement accru et la cote de popularité du président atteint actuellement un niveau record."

 CIA_WER.0.desc:0 "Depuis la fin de la Seconde Guerre mondiale et l'établissement d'un ordre de sécurité d'après-guerre via l'Organisation du Traité de l'Atlantique Nord (OTAN), l'Europe occidentale a dans l'ensemble évité d'élire un gouvernement communiste, soit grâce à ses propres efforts, soit avec l'aide de nos propres agences de renseignement. Cependant, alors que le conflit avec le communisme s'intensifie une fois de plus, nous devons veiller à continuer de soutenir les partis qui soutiennent l'OTAN dans toute la région et à garder un oeil sur les mouvements et partis à venir qui pourraient mettre en danger les gouvernements alliés. De grands succès ont été obtenus au cours des décennies précédentes en renforçant le régime conservateur au Japon tout en mettant à l'écart les forces de gauche. Des stratégies similaires devraient être envisagées dans toute l'Europe occidentale, en particulier les idées consistant à exporter des stratèges politiques américains, à financer des partis conservateurs et à semer des divisions entre les partis de gauche qui menacent l'hégémonie de l'OTAN dans la région."
 CIA_WER.1.desc:0 "Le Royaume-Uni est depuis longtemps l'un de nos plus proches alliés et un membre clé de l'Organisation du Traité de l'Atlantique Nord (OTAN). Malheureusement, l'aile gauche du Parti travailliste a depuis longtemps des tendances inquiétantes qui remontent aux années 1950 concernant le conflit mondial en cours. Ces dernières années, cependant, cette situation a atteint des niveaux encore plus extrêmes avec la faction de la « tendance militante » qui a pris de l'importance à Liverpool et a réussi à élire plusieurs députés au parlement alors qu'elle faisait partie du Parti travailliste. La tendance militante est une faction politique entréeniste décrite idéologiquement comme marxiste-léniniste et trotskiste. Un tel groupe parvenant à exercer davantage d'influence sur l'un des deux principaux partis politiques britanniques serait sûrement un désastre pour les relations anglo-américaines et pour l'OTAN dans son ensemble. Bien que l'influence actuelle de la faction soit limitée et peu susceptible de s'étendre, garder un oeil sur leurs dirigeants tels que Ted Grant nous permettra d'intervenir si le besoin s'en fait sentir."

 CIA80_SPR.9.desc:0 "Depuis la mort du dictateur fasciste espagnol Francisco Franco, l'Espagne est sur la voie de la démocratie, même si elle est assiégée par des troubles et des violences de la part des éléments d'extrême gauche et d'extrême droite. Les troubles et les turbulences en Espagne, ainsi que les élections démocratiques libres, font courir le risque d'un gouvernement anti-américain qui pourrait donner à l'Union soviétique un pied dans la péninsule ibérique et perturber nos opérations de renseignement en Espagne. Nos agents de l'armée espagnole ont rapporté que le lieutenant-colonel Antonio Tejero envisageait de tenter un coup d'État contre le gouvernement pour restaurer le régime franquiste. Cela nous donne l'occasion de ramener l'Espagne dans des relations plus étroites avec les États-Unis, mais cela soulève le risque de tendre les liens avec Madrid en cas d'échec. Une proposition a été élaborée pour soutenir Tejero en lui fournissant des renseignements et en utilisant des éléments Gladio en Espagne pour renforcer ses chances de succès. Comment devrions-nous procéder ?"
 CIA80_SPR.1.desc:0 "Après un examen attentif par le Conseil national de sécurité, le président [USA.GetLeader] a décidé de donner son feu vert au soutien aux putschistes espagnols. À cette fin, des agents ont été déployés pour garantir que le roi d'Espagne ne s'immisce pas dans les plans en faisant du chantage à cause de ses nombreux échecs personnels et transactions financières. En plus de cela, nos agents Gladio et nos équipes dormantes sont activés pour contraindre d'autres éléments de l'armée espagnole à se joindre au plan de putsch afin d'augmenter les chances de succès. On pense que ces mesures, ainsi que le fait de contraindre d'autres hommes politiques et chefs militaires à s'aligner, ont presque assuré le succès du coup d'État dans les prochains jours, alors que bien sûr il reste une chance d'échec, nos agences de renseignement croient que l'Espagne reviendra au régime franquiste tout en minimisant la perception du public quant à notre soutien au complot."

 CIA_BLOC80.o:0 "Alors que nous entrons dans une nouvelle décennie de conflit avec l'Union soviétique, il est impératif de revoir nos options en matière d'opérations clandestines au-delà du rideau de fer. Compte tenu des États de sécurité efficaces établis dans plusieurs États du bloc de l'Est, en particulier en Allemagne de l'Est, il est peu probable que les opérations directes réussissent, mais d'autres options, plus subtiles, persistent. La principale option serait d'étendre les émissions de radio ciblant le bloc de l'Est, en particulier l'Allemagne de l'Est, afin de saper le soutien au gouvernement. Cependant, la cible potentielle la plus intrigante est la Pologne. Les troubles ouvriers qui ont frappé la Pologne ces dernières années ont fait de la nation communiste une cible privilégiée pour encourager un soutien supplémentaire et potentiellement apporter un soutien au mouvement syndical Solidarité. Cela dit, nous devons également veiller à ce que nos opérations ne franchissent pas la frontière et atténuer le risque d'escalade avec l'Union soviétique afin d'éviter une nouvelle guerre mondiale."
 CIA_BLOC80.1:0 "Les troubles en Pologne continuent de s'étendre et de s'intensifier, et pour accroître la pression sur la Pologne et sur le Pacte de Varsovie dans son ensemble, la Central Intelligence Agency a donné son feu vert à un plan visant à commencer à financer Solidarité et à soutenir leur mouvement avec d'autres aides financières et mineures de propagande. En plus de fournir une aide financière au mouvement et de favoriser davantage le mouvement vers l'Occident, l'Agence a également contacté le Vatican pour fournir davantage de soutien à Solidarité afin de rallier davantage la population en grande partie catholique à Solidarité. Cela contribuerait également à accroître les tensions entre l'Église catholique et le gouvernement polonais, déstabilisant davantage le gouvernement et érodant leur soutien public. En fin de compte, quel que soit le sort de Solidarité, la situation est favorable à notre gouvernement. Dans un cas, les Soviétiques et d'autres devront intervenir pour sauver le gouvernement communiste en Pologne ou permettre la chute du gouvernement polonais."
 CIA_BLOC80.2:0 "Alors que les troubles continuent de s'étendre en Pologne et que le mouvement Solidarité se renforce, il est temps d'envisager de nouvelles actions pour soutenir le mouvement. Notre administration a déjà commencé à fournir un financement secret à Solidarité, mais nos agents peuvent faire plus que le simple financement. Selon la nouvelle proposition adoptée, nos agents vont désormais commencer à fournir un soutien et une aide techniques, tels que des presses à imprimer, des équipements électroniques et d'autres moyens pour produire de la propagande pour leur mouvement. Cependant, nous avons veillé à ce qu'aucune aide meurtrière ne soit fournie afin d'éviter de contrarier davantage l'Union soviétique et de fournir un prétexte supplémentaire pour réprimer la population polonaise. Cependant, certains membres du Conseil de sécurité nationale estiment qu'il s'agit d'une occasion manquée de déstabiliser davantage la Pologne et, par conséquent, le bloc de l'Est dans son ensemble, en n'incitant pas à un soulèvement violent qui déclencherait probablement une invasion soviétique de la Pologne."
 CIA_BLOC80.3:0 "Avec la répression gouvernementale contre les dissidents, Solidarité et même les anciens dirigeants du gouvernement, le moment est clairement venu de commencer à lancer secrètement un projet de changement de régime en Pologne. Alors que nous avons commencé à fournir un soutien technique et une aide conventionnelle à Solidarité, nos agents ont récemment reçu le feu vert pour commencer à envoyer une aide mortelle, principalement des armes légères et d'autres armes conventionnelles, aux militants partisans de Solidarité dans le but d'envenimer davantage la situation en Pologne. Cela augmente considérablement les chances d'une intervention soviétique en Pologne, ce qui constituerait un coup de propagande majeur pour la vaste lutte anticommuniste. Cependant, des voix dissidentes au sein du Conseil national de sécurité et des agences de renseignement ont fait valoir que ce changement de politique sème trop la discorde et augmente les chances de découverte du complot par les Soviétiques. En outre, les dissidents ont fait valoir que cela ne servirait qu'à déstabiliser l'Europe et pourrait conduire à des situations plus instables en Europe, augmentant les risques d'une nouvelle guerre mondiale."
 CIA_BLOC80.4:0 "Alors que le système soviétique continue de montrer des fissures majeures, plusieurs chefs de stations ont proposé de commencer à dialoguer avec les dirigeants potentiels de l'Europe de l'Est post-soviétique, notamment en Pologne. Lorsqu'elles entament un dialogue avec des dirigeants non communistes potentiels en Europe de l'Est, nos agences doivent se rappeler de ne pas trop contrarier les autorités soviétiques et autres autorités communistes afin d'éviter le risque d'une nouvelle escalade et d'éviter des incidents internationaux. Cela dit, le principal candidat avec lequel engager le dialogue est Lech Walesa. Walesa, le leader charismatique du mouvement social indépendant et anti-autoritaire, deviendra probablement le principal dirigeant non communiste d'une Pologne post-communiste. S'engager avec des dirigeants tels que Walesa permettra à notre gouvernement de concevoir davantage de plans et de stratégies de politique étrangère potentielles dans le cas d'un effondrement soviétique, tout en poussant potentiellement à l'avenir à une expansion de l'Organisation du Traité de l'Atlantique Nord."

 CIA_CT.0.desc:0 "Alors que la guerre soviéto-afghane faisait rage et que l'Union soviétique commençait à se déstabiliser rapidement, les mouvements islamistes se sont rapidement développés dans les régions islamiques de l'ex-Union soviétique. Notamment au Tadjikistan, en Tchétchénie et au Daghestan. Bien que ce ne soit pas la seule cause, notre soutien aux combattants et aux organisations islamistes en Afghanistan et notre soutien à des causes similaires au Pakistan ont notamment été un facteur déterminant dans ce problème croissant de radicalisation. En supposant que l'appareil de renseignement ne choisisse pas d'ignorer la question, nous avons deux véritables choix. Notre première option consiste à soutenir secrètement les forces islamistes qui déstabilisent la région et à chercher à établir des gouvernements islamistes en Asie centrale qui seraient peut-être plus disposés à accepter l'influence américaine. Cependant, cette décision détruirait sûrement toute chance d'établir et de maintenir des liens cordiaux avec Moscou. Notre autre option serait d'identifier la menace croissante non seulement comme un problème pour la région mais aussi comme une menace à la sécurité nationale pour l'Occident et de chercher à collaborer avec la Russie et le Tadjikistan pour contrer la menace terroriste islamiste croissante. Comment devons-nous procéder ?"
 CIA_CT.1.desc:0 "Suite à la décision du Conseil de sécurité nationale (NSC) de jouer un rôle proactif face à la menace islamiste croissante en Asie centrale, une nouvelle proposition approuvée par le NSC autorise le partage de renseignements sur la province séparatiste de Tchétchénie avec le gouvernement russe pour l'aider dans sa lutte contre les rebelles islamistes. Cette décision devrait contribuer à nos efforts visant à construire une nouvelle relation avec Moscou et, en outre, démontrer davantage notre engagement à lutter contre la menace du terrorisme islamiste radical. Malheureusement, cela devra rester confidentiel dans un avenir indéfini en raison des préoccupations politiques nationales. La gestion du conflit par la Russie a suscité des critiques internationales et être perçu comme facilitant certaines actions entreprises par l'armée russe nuirait à notre position dans le pays et à l'étranger."
 CIA_CT.2.desc:0 "Un conflit clé dans la région impliquant des mouvements islamistes radicaux est celui de la guerre civile au Tadjikistan. Après des discussions au sein du Conseil national de sécurité, notre administration a décidé d'offrir son soutien au gouvernement du Tadjikistan. Même si le gouvernement tadjik est soutenu par la Russie, la victoire de l'opposition serait trop déstabilisatrice pour la région et pourrait créer un nouveau point chaud de radicalisation et de soutien aux organisations terroristes. Les analystes ont également noté que cela pourrait être l'occasion de tenter d'améliorer les relations avec Moscou, d'autant plus qu'il est dans nos deux intérêts d'empêcher la propagation du terrorisme islamiste à travers l'Asie centrale et du Sud. Notre ambassadeur à Douchanbé sera chargé dans les prochains jours de fournir un aperçu des types de soutien que nous offrirons à leur gouvernement et l'ambassadeur de Russie sera informé des mesures que nous envisageons pour ne pas contrarier la Russie à cause de son ingérence dans sa région."
 CIA_CT.3.desc:0 "Après un débat controversé au sein du Conseil national de sécurité (NSC), le président a approuvé une nouvelle ligne d'action concernant l'instabilité en Asie centrale. La nouvelle stratégie appelle à fournir un soutien secret aux organisations islamistes lorsqu'il y a un avantage stratégique à les renforcer. Cette nouvelle stratégie sera testée au Tadjikistan où nous avons décidé de commencer à armer le mouvement rebelle avec l'aide de l'Arabie Saoudite contre le gouvernement pro-russe. Le renversement dudit gouvernement nous donnerait l'occasion d'établir une plus grande présence en Asie centrale et affaiblirait l'emprise de la Russie sur les anciennes républiques soviétiques de la région. Cela dit, des dissidents au sein de l'administration ont exprimé leur opposition à cette décision, arguant qu'elle violait les principes moraux et conduirait à armer des terroristes susceptibles d'utiliser ces armes contre nos propres alliés et intérêts."
 CIA_CT.4.desc:0 "Alors que nous poursuivons nos efforts pour soutenir les causes islamistes dans la région afin de déstabiliser davantage la Russie et ses États mandataires, la situation en Tchétchénie pourrait constituer la clé pour paralyser la puissance militaire russe à moyen terme. Des voix dissidentes au sein du Conseil national de sécurité (NSC) ont souligné qu'en soutenant les Tchétchènes, nous armons également efficacement les différents volontaires et djihadistes qui se rendent en Tchétchénie pour combattre la Russie et constitueront probablement une menace pour la sécurité après la guerre. D'autres ont souligné que notre opération similaire en Afghanistan une décennie auparavant, bien que réussie, avait eu des conséquences imprévues majeures et avait grandement contribué à l'instabilité actuelle en Asie centrale. À partir des semaines à venir, nos agents dans la région commenceront à acheminer des livraisons d'armes vers la Tchétchénie, en utilisant des tactiques similaires à celles de l'Opération Cyclone. Espérons que cette décision dégradera encore davantage la capacité de la Russie à faire la guerre."
 CIA_CT.5.desc:0 "Dans une nouvelle vraiment terrible, les récents renseignements partagés par la Russie ont montré que les États-Unis se rangent du côté des forces rebelles islamistes dans notre guerre civile en cours et ont maintenant commencé à leur fournir ouvertement des armes. Il ne s'agit pas seulement d'un coup dur porté à nos forces et cela augmentera assurément le bilan sanglant de la guerre en cours, mais cela risque également d'inverser nos progrès et de mettre même en danger la survie de notre gouvernement. La seule véritable voie qui nous reste est de nous aligner davantage sur la Russie et de demander davantage d'aide. Malheureusement, étant donné la triste situation de la Russie depuis la chute de l'Union Soviétique, cela pourrait ne pas apporter grand bénéfice à notre cause. Peut-être que les allégations de longue date selon lesquelles la Central Intelligence Agency financerait et parrainerait des organisations islamistes dans notre pays et dans toute l'Asie centrale étaient après tout fondées ?"
 CIA_CT.6.desc:0 "Une excellente nouvelle est arrivée, les États-Unis nous ont informés que nous bénéficierions désormais d'un soutien financier et matériel militaire. Même si Washington ne soutiendra pas ouvertement notre mouvement ni ne nous reconnaîtra formellement pour le moment, ils ont accepté de bloquer toute mesure visant à nous sanctionner ou à nous censurer aux Nations Unies et travaillent en collaboration avec l'Arabie Saoudite et d'autres pour nous fournir des fonds, des armes et des volontaires supplémentaires. Les nouveaux programmes d'aide qui devraient arriver par des canaux secrets via l'Afghanistan pourraient fournir à nos forces un avantage clé pour prendre le dessus dans le conflit en cours. Cela dit, qu'est-ce que cela nous coûtera à long terme si nous parvenons à renverser le gouvernement actuel ? Les Américains voudront sûrement utiliser notre nation comme un tremplin vers le reste de l'Asie centrale pour étendre davantage leur influence, mais tel est le prix à payer pour gagner une guerre."
 CIA_CT.7.desc:0 "Alors que l'influence russe continue d'imploser dans l'ensemble de l'ancien bloc soviétique, une nouvelle opportunité se présente pour déstabiliser davantage la Russie et paralyser ses efforts à long terme visant à restaurer son influence dans la région. La proposition présentée au Conseil de sécurité nationale est de commencer à financer et, dans certains cas, à fournir des armes aux mouvements sécessionnistes à l'intérieur même de la Russie. Alors que la Tchétchénie est déjà en révolte, des troubles sont présents dans diverses régions ethniques de Russie, notamment au Daghestan, en Kalmoukie et au Tatarstan. Tous trois sont majoritairement non russes et mènent des mouvements actifs soit en faveur de l'autonomie, soit en faveur de la séparation. Le nouveau plan approuvé chercherait à établir des contacts avec ces mouvements et les dirigeants locaux qui pourraient être enclins à le faire, puis à commencer à fournir des armes et des financements à ceux qui sont prêts à s'opposer activement à la Russie. La prochaine étape consisterait à contraindre les forces militaires et paramilitaires locales à faire défection et, idéalement, à déclencher une chaîne d'événements similaires à ce qui s'est produit en Tchétchénie."
 CIA_CT.8.desc:0 "Ces dernières semaines, une recrudescence notable d'assassinats ciblés et d'autres attaques terroristes a eu lieu au Daghestan, au Tatarstan et en Kalmoukie. Les troubles ont suscité l'inquiétude des services de sécurité, surtout à la lumière de la guerre en cours avec la Tchétchénie. On a également constaté que le soutien aux mouvements islamistes radicaux augmentait rapidement dans nos régions islamiques, la recrudescence des activités terroristes djihadistes au Daghestan étant particulièrement préoccupante. Plus tôt dans la semaine, plusieurs commissariats de police et installations gouvernementales ont été bombardés ou pris d'assaut par des filiales locales d'Al-Qaïda. Les attaques ciblées contre des hommes politiques progouvernementaux et des civils russes se sont également multipliées dans les trois régions. Le ministère de la Sécurité suggère d'accroître la surveillance dans les trois régions et de chercher à identifier les dirigeants potentiels de ces mouvements, tout en tentant de déterminer s'il s'agit d'un problème purement national ou s'il existe des soutiens étrangers."
 CIA_CT.9.desc:0 "La récente montée du terrorisme islamique en Asie centrale et dans les anciennes républiques soviétiques a clairement démontré que les tactiques militaires et policières traditionnelles sont inefficaces contre les terroristes idéologiques. Pour lutter contre cela, une proposition a été soumise au Conseil de sécurité nationale (NSC) visant à investir dans la formation d'un nouveau groupe de travail qui superviserait la création de nouvelles escouades antiterroristes pour un déploiement national et international, respectivement soumises soit au Federal Bureau of Investigation (FBI), soit à la Central Intelligence Agency (CIA). Tandis que les services de sécurité continuent de débattre de la question de savoir qui supervisera et gérera le groupe de travail, nous devons continuer à surveiller les menaces terroristes à venir, en particulier dans le contexte d'instabilité croissante au Moyen-Orient et en Asie centrale. Les conséquences de la guerre du Golfe et notre soutien aux Moudjahidines en Afghanistan semblent avoir grandement enhardi les terroristes islamistes extrémistes et les discussions des services de renseignement indiquent que nous sommes une cible potentielle aux côtés de la Russie, d'Israël et de divers pays européens."

 CIA_IRQ80.0.desc:0 "L'instabilité croissante du dictateur irakien Saddam Hussein devient un problème de plus en plus alarmant pour notre politique étrangère dans la région. Entre les conséquences de la guerre Iran-Irak et la rhétorique revanchiste de Bagdad, notamment à l'égard du Koweït, le Conseil de sécurité nationale, avec l'approbation du président, a signé une proposition visant à commencer à planifier un coup d'État contre Saddam et le gouvernement baasiste. Ce sera certainement une tâche difficile et nécessitera une planification, une vérification et un recrutement intensifs d'agents au sein du gouvernement, de l'armée et de la diaspora irakiens. Même si le plan est approuvé, la communauté du renseignement n'a pas encore décidé des dirigeants potentiels d'un coup d'État, et encore moins de celui qui gouvernerait un gouvernement irakien post-baasiste. Une attention particulière a cependant été accordée à la recherche de dirigeants potentiels parmi les officiers efficaces pendant la guerre Iran-Irak, en particulier ceux qui ont depuis été mis à l'écart en raison de soupçons d'être des rivaux potentiels de Saddam et d'autres responsables baasistes loyaux."
 CIA_IRQ80.1.desc:0 "Le gouvernement baasiste d'Irak, dirigé par Saddam Hussein, s'est révélé être l'un des dirigeants les plus chaotiques et déstabilisateurs d'une puissance régionale au Moyen-Orient de mémoire récente. Non seulement ils ont déclenché des guerres majeures, mais ils ont également lancé des campagnes brutales contre leur propre population selon des critères ethniques et religieux. C'est dans cet esprit que le président a autorisé le début d'un plan visant à lancer un coup d'État contre Hussein et à rechercher un gouvernement plus pro-occidental pour restaurer la stabilité dans la région. Les vastes réserves pétrolières de l'Irak rendent le maintien au pouvoir d'un dirigeant aussi chaotique et imprévisible intenable pour nos objectifs stratégiques dans toute la région. De plus, les mesures visant à prévenir une nouvelle crise pétrolière sont une priorité majeure de notre administration et garantir l'accès au pétrole irakien contribuerait grandement à garantir que nous disposions d'un approvisionnement constant et stable en pétrole."
 CIA_IRQ80.2.desc:0 "L'une de nos questions actuelles dans la formulation d'un coup d'État est de savoir qui désignera le chef du coup d'État et qui dirigera le gouvernement post-coup d'État en Irak. L'ancien général de la Garde républicaine Mohammed Abdullah al-Shahwani semble être un candidat de choix pour ce poste. Le général al-Shahwani est un héros de guerre remarquable de la récente guerre Iran-Irak et a été purgé parce qu'il était considéré comme une menace pour Saddam Hussein. Durant la guerre Iran-Irak, il a notamment dirigé une attaque aérienne pour reprendre la montagne Kardamand, au Kurdistan irakien, aux mains de plusieurs milliers d'Iraniens retranchés. De plus, il était responsable de l'école des forces spéciales irakiennes et avait été formé à l'école des Rangers de l'armée américaine. Avec ses nombreuses relations, son expérience, sa réputation et sa volonté de travailler avec nos services de renseignement, il constitue le premier choix potentiel. Le général al-Shahwani a déjà contacté nos agents pour leur fournir des informations supplémentaires sur le gouvernement irakien et devrait accepter volontiers son rôle dans le plan de coup d'État."
 CIA_IRQ80.3.desc:0 "Maintenant que nous avons un leader crédible pour notre plan de coup d'État, nous devons gagner plus de partisans au sein de l'armée irakienne actuelle. Pour y parvenir, nos agents en Irak ont été autorisés à offrir des pots-de-vin, des concessions et d'autres incitations aux officiers ciblés afin qu'ils soient disposés à prendre des mesures contre le gouvernement baathiste à l'avenir. Nos analystes estiment que viser une plus grande infiltration du corps des officiers sera actuellement la voie la plus efficace pour renverser le gouvernement baasiste. Nous devons néanmoins nous efforcer d'être discrets pour éviter d'alerter le gouvernement ou de laisser des rumeurs se propager au sein de l'opinion publique irakienne. La répression qui dure depuis des années contre d'autres partis et mouvements politiques en Irak a fait que l'opposition politique notable ne partage en grande partie pas nos intérêts. Après tout, nous ne voudrions pas remplacer un Irak baathiste par une autre théocratie chiite qui chercherait à exporter davantage la révolution chez ses voisins."
 CIA_IRQ80.4.desc:0 "Plusieurs officiers de l'armée irakienne ont accepté nos pots-de-vin et ont promis leur soutien à notre projet de coup d'État visant à renverser Saddam Hussein. Il s'agit d'une étape notable dans notre projet de renverser le gouvernement baasiste. Alors que de nombreux membres de la communauté du renseignement avaient protesté contre nos opérations visant à renverser le gouvernement irakien, les qualifiant d'irréalistes et de gaspillage d'argent, cette étape majeure démontre clairement qu'il existe un moyen de placer potentiellement avec succès un dirigeant pro-occidental à la tête de l'État irakien. Il reste néanmoins beaucoup de travail à faire et nous devons maintenant chercher à élargir davantage notre réseau de soutien au complot en Irak, en particulier au sein de la communauté des renseignements irakiens, des Gardiens de la révolution irakiens et des partis politiques potentiellement anti-baathistes en Irak et au sein de la diaspora. La proposition de contacter la Garde républicaine et l'opposition politique a créé une tempête interne au sein des agences de renseignement, craignant de compromettre la mission. Nous devrons équilibrer ces préoccupations et déterminer notre plan d'action dans les semaines à venir."
 CIA_IRQ80.5.desc:0 "Malheureusement, notre tentative de corruption a largement échoué. La plupart des officiers ont nié les pots-de-vin en raison de la surveillance exercée par les services de sécurité irakiens et une tentative a même fini par être une opération locale de corruption, ce qui a conduit notre agent à se retirer précipitamment. Heureusement, aucun de nos agents n'a été capturé lors de cette opération ratée. Cela dit, sans le soutien d'un plus grand nombre de soldats irakiens, il est difficile d'imaginer qu'un coup d'État réussisse à l'heure actuelle.\n\nNous devrons maintenant également délibérer si nous devons même continuer à avancer avec ce complot. Bien que nous n'ayons aucune confirmation que le gouvernement irakien est au courant de ce plan, les chances sont désormais non négligeables et de nouveaux investissements dans cette entreprise pourraient simplement être un gaspillage d'argent qui aurait été mieux dépensé pour soutenir d'autres opérations. Il ne s'agit cependant pas d'une position universelle et un large bloc au sein de la communauté du renseignement fait pression pour aller de l'avant avec ce plan, notant l'instabilité générale du gouvernement baasiste et la nécessité de sécuriser le pétrole irakien."
 CIA_IRQ80.6.desc:0 "Poursuivant nos tentatives visant à soudoyer davantage d'officiers irakiens pour qu'ils se joignent à notre complot, l'étape suivante consistait à chercher à compromettre les services de renseignement irakiens. Maintenant qu'ils ont été considérablement compromis, nos chances de succès seront grandement améliorées. Le mécontentement au sein des services de renseignement irakiens s'est accru depuis des années après diverses purges internes et aventures étrangères ratées. Heureusement, ce climat a permis à nos agents de recruter avec succès des membres au sein des services de renseignement irakiens pour soutenir notre prochain coup d'État visant à renverser le gouvernement baathiste. Même si cela ne garantira pas à lui seul le succès de l'opération, cela représente un pas en avant significatif pour notre opération et pourrait renforcer les chances de maintenir la sécurité opérationnelle du coup d'État prévu. Des inquiétudes ont toutefois été soulevées quant au risque de recrutement d'agents doubles qui pourraient en réalité être fidèles au gouvernement baasiste."
 CIA_IRQ80.7.desc:0 "Comme nous avons déjà établi quelques liens au sein de l'armée normale, nous avons maintenant commencé à entretenir des contacts au sein de la Garde républicaine irakienne. Jusqu'à présent, cette démarche a connu un succès mitigé. Dans l'ensemble, nos agents ont réussi à entretenir des contacts au sein de la Garde républicaine irakienne et ont, de manière surprenante, recruté plusieurs officiers de la Garde républicaine pour participer au complot suite au mécontentement croissant des gouvernements baathistes et à leurs nombreux échecs ces dernières années. Notre chef de file du prochain coup d'État, ancien général et chef d'une unité d'hélicoptères de la Garde républicaine et héros de guerre réputé de la guerre précédente avec l'Iran, s'est avéré être un choix fructueux compte tenu de sa popularité au sein de la Garde républicaine. Cela dit, la majorité de la Garde républicaine reste fidèle au gouvernement baathiste et cherchera probablement à reprendre le contrôle de la nation immédiatement après le coup d'État. Si un nombre important de membres font défaut, les chances de réussite d'un contre-coup d'État devraient considérablement diminuer."
 CIA_IRQ80.8.desc:0 "Alors que le plan était initialement conçu pour fonctionner uniquement par l'intermédiaire de l'armée irakienne et des services associés, le Conseil national de sécurité a décidé d'essayer d'incorporer les forces d'opposition irakiennes dans ce plan. À cet effet, la Central Intelligence Agency a ordonné à nos agents locaux de demander à leurs collaborateurs en Irak de contacter les organisations antigouvernementales pour organiser des efforts en conjonction avec le plan de coup d'État. Si tout se passe comme prévu, les manifestations publiques coïncideront avec le début du coup d'État, affaiblissant encore davantage la réponse baathiste au coup d'État, donnant à nos co-conspirateurs plus de temps pour prendre le contrôle de l'appareil d'État et éliminer les principaux responsables. Des inquiétudes ont toutefois été soulevées quant aux différents objectifs stratégiques à long terme de l'opposition irakienne et à nos propres objectifs pour la région, ainsi qu'à la possibilité que ce plan conduise à des pertes civiles massives si le coup d'État ne se déroule pas comme prévu."
 CIA_IRQ80.9.desc:0 "Bien que l'idée d'impliquer les forces d'opposition irakiennes dans le plan aurait pu être bénéfique, la décision a été prise de s'en tenir au contact des officiers militaires et éventuellement des Gardiens de la révolution irakiens afin de minimiser les risques de fuite du plan vers les dirigeants irakiens. Même si plusieurs membres de la communauté du renseignement ont protesté contre cette décision, le consensus général était que cette proposition aurait non seulement risqué d'exposer le plan au gouvernement baathiste, mais aurait également présenté un risque élevé que le complot de coup d'État déraille en un massacre de civils dans tout l'Irak ou se dégrade davantage en une guerre civile où des factions plus radicales pourraient prendre le pouvoir au détriment de nos objectifs stratégiques régionaux. Des inquiétudes ont en outre été exprimées quant au fait qu'une guerre civile pourrait permettre à l'Iran de chercher à installer un gouvernement fantoche à Bagdad, une issue qui serait pratiquement intolérable pour nos alliés du Moyen-Orient et pour notre propre influence dans la région."
 CIA_IRQ80.10.desc:0 "Malheureusement, notre complot a été révélé et le gouvernement irakien a rapidement pris des mesures pour empêcher un éventuel coup d'État. De nouvelles purges militaires et de renseignement ont réussi à capturer un grand nombre de nos collaborateurs. Heureusement, de nombreux autres probablement fidèles au régime ont également été impliqués dans les purges, affaiblissant globalement l'efficacité de l'armée et des services de renseignement irakiens. Cela signifie cependant que nos liens déjà faibles avec le gouvernement irakien vont encore se détériorer et que nos chances de renverser le gouvernement baasiste sont pratiquement inexistantes dans un avenir immédiat. Des inquiétudes ont également émergé quant à la possibilité que l'Irak tente de déclencher une nouvelle crise pétrolière, mais les rapports d'analyse des menaces et des risques les plus récents indiquent que cela est incroyablement improbable compte tenu de notre projection de forces dans la région et de la sécurité générale des autres pays exportateurs de pétrole, sans compter le fait que l'Irak dépend des exportations de pétrole pour financer son gouvernement."
 CIA_IRQ80.11.desc:0 "Après plusieurs semaines de préparation, nous approchons du lancement de l'opération. Jusqu'à présent, nos sources insistent sur le fait que la sécurité opérationnelle a été maintenue et que les services de sécurité baathistes ignorent toujours le complot en cours. Avec la sécurité opérationnelle maintenue et notre liste de co-conspirateurs finalisée, il ne reste plus qu'à finaliser les détails restants du complot et fixer la date du lancement du coup d'État. Plusieurs préoccupations ont encore été soulevées, mais nous sommes allés trop loin pour faire marche arrière maintenant et devons préparer des éventualités à la fois pour le succès et l'échec de l'opération à venir. Notamment, nos analystes ont publié une nouvelle analyse de la menace, affirmant que si la mission échoue et que le gouvernement irakien nous lie au complot, le gouvernement irakien pourrait chercher à interférer avec l'approvisionnement en pétrole provenant non seulement de l'Irak mais aussi du reste du golfe Persique, ce qui pourrait potentiellement menacer une nouvelle crise pétrolière."
 CIA_IRQ80.12.desc:0 "Le moment est venu de lancer le coup d'État. Tous les préparatifs sont finalisés et devraient commencer dans les prochains jours, une fois identifié le moment idéal pour lancer le premier assassinat contre Saddam Hussein. Comme indiqué, l'opération débutera par la décapitation du régime irakien avec l'assassinat de Saddam Hussein. Après la confirmation de sa mort, les officiers participant au coup d'État rassembleront leurs soldats pour s'emparer des principales installations gouvernementales et arrêter les dirigeants du parti Baas socialiste arabe. Bien que tout soit désormais programmé et préparé, rien de tout cela ne garantit le succès, mais il subsiste plusieurs risques et incertitudes majeurs concernant ce plan, notamment l'efficacité de la première étape lors du lancement de l'assassinat de Saddam et ensuite la question de savoir si les officiers fidèles au coup d'État pourront ou non rallier efficacement leurs subordonnés. Le temps de la planification est néanmoins terminé, maintenant nous attendons."
 CIA_IRQ80.13.desc:0 "Malheureusement, alors que l'opération commençait à être prometteuse, les premiers assassins n'ont pas réussi à tuer Saddam, sans que les dirigeants du régime ne soient décapités. Des officiers loyalistes ont pu rallier l'armée pour arrêter les conspirateurs qui sont actuellement condamnés à être exécutés pour leurs crimes contre l'État. On s'attendait toujours à ce que la mission soit de longue haleine. Les médias d'État irakiens ont publié une déclaration alléguant notre participation à la tentative de coup d'État. Heureusement, aucun de nos propres agents n'a été capturé par le gouvernement irakien, ce qui nous a permis de nier rapidement ces allégations. Bien que décevante, cette décision a encore davantage déstabilisé l'Irak et nous a finalement coûté peu en termes d'actifs. Néanmoins, cela jette encore plus de doutes et d'incertitudes sur les perspectives à long terme du marché pétrolier et pourrait entraîner des problèmes économiques à long terme si les événements conspiraient pour créer une nouvelle crise pétrolière."
 CIA_IRQ80.14.desc:0 "L'opération a rapidement permis de localiser Saddam et d'assassiner le tristement célèbre dictateur irakien. Heureusement, les événements ne sont pas devenus incontrôlables à ce stade. Les officiers militaires participant à l'opération ont pu rallier leurs soldats pour prendre le contrôle des principaux centres gouvernementaux et arrêter les loyalistes du régime. Ancien général et héros de guerre, Mohammed Abdullah al-Shahwani est sorti d'exil et devrait s'adresser à la nation sur les événements en cours plus tard dans la soirée. Notre implication, bien que fortement spéculée dans certains coins, a été largement tenue à l'écart des projecteurs, mais si le nouveau gouvernement parvient à restaurer la stabilité en Irak, notre position dans la région sera stabilisée et les vastes réserves de pétrole irakien seront disponibles pour nos marchés, garantissant ainsi davantage l'accès au pétrole pour éviter une répétition des crises pétrolières des années 1970."
 CIA_IRQ80.15.desc:0 "Le coup d'État anti-baasiste mené par le général Mohammed Abdullah al-Shahwani et d'autres éléments de l'armée irakienne a été un choc majeur pour le monde. Compte tenu de la résilience du régime baathiste au cours de la dernière décennie face à diverses crises ainsi qu'à la guerre désastreuse avec l'Iran, nombreux étaient ceux qui s'attendaient à ce que le régime ne tombe pas sans intervention étrangère ou guerre civile. Cependant, la prise rapide de Bagdad et l'arrestation ainsi que l'exécution de divers hauts responsables baasistes ont rapidement étouffé la dissidence et un conflit armé potentiel avec les loyalistes et les milices baasistes. Même si des conflits mineurs ont fait rage dans certaines régions à majorité sunnite, la nation a été largement pacifiée. Aujourd'hui, le président américain [USA.GetLeader] a annoncé que son administration reconnaissait et soutenait pleinement les actions et la légitimité du nouveau gouvernement irakien et attendait sa coopération sur une multitude de questions géopolitiques, économiques et de sécurité dans les mois à venir."

 IRQ_CIA.100.desc:0 "Après la fin de la guerre du Golfe, un soulèvement massif a éclaté dans le sud de l'Irak contre le régime de Saddam Hussein. Le soulèvement, stimulé par la défaite écrasante de l'Irak dans la guerre et par les tensions politiques, religieuses et ethniques persistantes à travers le pays, s'est rapidement intensifié et s'est désormais étendu également au Kurdistan irakien. Même si Saddam est clairement un acteur hostile à l'égard de notre politique étrangère, il n'est pas certain que les rebelles soient plus favorables à nos intérêts. La cause rebelle varie idéologiquement entre les transfuges du régime de Saddam, les communistes irakiens, les sympathisants chiites iraniens, les peshmergas kurdes et les rebelles chiites, mécontents du traitement que leur réserve le régime. La rébellion a le potentiel de renverser le régime, mais cela ne se produira probablement pas sans une participation étrangère. Un plan d'action a été envoyé au président sur la manière de faire avancer la situation. Si nous choisissons d'intervenir, nous ne pouvons garantir que le nouveau gouvernement sera amical avec Washington. Il est tout à fait possible que le renversement de Saddam conduise à ce que l'Irak ne devienne guère plus qu'une marionnette iranienne. Comment devons-nous procéder ?"
 IRQ_CIA.101.desc:0 "Alors que le soulèvement irakien continue de se dérouler, l'administration a décidé de mettre en place une zone d'exclusion aérienne sur tout l'Irak. Le but de cette mesure est de priver le gouvernement irakien de la capacité d'écraser les forces d'opposition via sa puissance aérienne et d'atténuer le potentiel de représailles civiles. Nous avons également approuvé des règles d'engagement prévoyant l'abattage d'avions irakiens et le bombardement d'installations antiaériennes afin d'assurer un passage sûr au-dessus du pays. Le gouvernement irakien a condamné cette décision, la qualifiant de tentative de changement de régime, ce qui, même si nous le nions publiquement, constitue en réalité l'un des objectifs de cette opération. Supprimer [IRQ.GetLeader] du pouvoir serait un pas vers un Moyen-Orient plus stable et plus sûr et éliminerait du pouvoir un dictateur brutal."
 IRQ_CIA.102.desc:0 "Terrible nouvelle, les États-Unis ont annoncé la mise en place d'une « zone d'exclusion aérienne » au-dessus des régions du sud actuellement en rébellion contre notre gouvernement. Une fois cela établi, notre capacité à lancer des frappes aériennes et à recourir à la guerre chimique via la puissance aérienne sera effectivement bloquée. Plusieurs incidents ont déjà été signalés dans le sud de notre pays. Sans puissance aérienne, nos forces qui résistent dans le sud seront sûrement en retrait et devront peut-être se reconsolider autour de nouvelles lignes défensives. Cet événement représente également un grand boost pour le moral de l'opposition et pourrait inciter davantage de défections des forces armées vers les rebelles. La situation reste néanmoins potentiellement récupérable tant que nos ennemis étrangers ne bombardent pas directement nos soldats ou ne lancent pas d'intervention directe. Nos forces sont largement supérieures en nombre aux rebelles, mais la double menace des rebelles du sud et des peshmergas kurdes au nord restreint nos mouvements et notre capacité à nous redéployer rapidement vers l'une ou l'autre région pour remporter une victoire décisive."
 IRQ_CIA.103.desc:0 "Excellente nouvelle, les États-Unis ont annoncé la mise en place d'une « zone d'exclusion aérienne » au-dessus des régions du sud où nos forces luttent activement contre le gouvernement. Avec cette zone d'exclusion aérienne en place, la capacité du gouvernement à mener des frappes aériennes et à recourir à la guerre chimique depuis le ciel sera effectivement neutralisée. Déjà, des rapports font état de plusieurs opérations réussies dans les territoires du sud, ce qui constitue pour nous une victoire significative. Sans puissance aérienne, les forces gouvernementales stationnées dans le sud seront gravement désavantagées et seront probablement contraintes de battre en retraite lorsque leurs positions deviendront insoutenables. Cette évolution constitue un formidable boost moral pour notre cause, et nous pouvons nous attendre à de nouvelles défections dans leurs rangs à mesure que leurs soldats perdent confiance. La situation penche désormais largement en notre faveur, surtout si les puissances étrangères s'abstiennent d'intervenir directement ou de bombarder nos forces. Même si les forces gouvernementales sont encore plus nombreuses que les nôtres, la pression combinée de notre part au sud et des peshmergas kurdes au nord met à rude épreuve leur armée, limitant leur capacité à déplacer rapidement des ressources et à obtenir un avantage décisif."
 IRQ_CIA.104.desc:0 "Alors que le soulèvement en Irak continue de se transformer en une lutte sanglante entre le gouvernement baasiste et un large éventail d'oppositions antigouvernementales, des appels ont été lancés pour que la communauté internationale se rallie au gouvernement du [IRQ.GetLeader]. Le président américain [USA.GetLeader] a annoncé aujourd'hui le début d'une opération militaire américaine visant à établir une zone d'exclusion aérienne dans tout l'Irak afin de priver l'armée irakienne de sa puissance aérienne pendant le conflit en cours. Cette décision a été largement saluée par un large éventail de dirigeants, en particulier par les pays d'Europe occidentale, l'Arabie saoudite, la Jordanie et, étonnamment, l'Iran, qui soutient également le soulèvement. Cependant, plusieurs autres États et organisations ont condamné la reprise de la campagne, notamment le Yémen, la Yougoslavie et l'Organisation de libération de la Palestine. Cependant, il est peu probable que cela à lui seul fasse pencher définitivement le conflit en faveur des rebelles ; la question d'une nouvelle intervention des États-Unis, de l'Iran et d'autres puissances régionales reste de la plus haute importance."
 IRQ_CIA.105.desc:0 "Malgré les appels répétés et les encouragements en faveur d'un soulèvement en Irak contre les dirigeants du [IRQ.GetLeader], l'Amérique a montré peu d'intérêt à s'impliquer dans le soulèvement en cours. Alors que le président et le Département d'État ont refusé de publier des commentaires ou des interviews sur la crise actuelle en Irak, des notes de service divulguées indiquent que l'administration est fortement préoccupée par la composition des forces rebelles. En particulier, la forte présence du parti Dawa et d'autres chiites radicaux alignés et soutenus par l'Iran sont considérées comme une menace pour la stabilité régionale et une cinquième colonne pour une prise de contrôle iranienne de l'Irak. Les spéculations ont également été alimentées par les inquiétudes quant à la possibilité qu'un Irak encore plus déstabilisé provoque des fluctuations des prix du pétrole qui seraient préjudiciables à l'économie mondiale."
 IRQ_CIA.106.desc:0 "Les Américains n'ont fait qu'intensifier leurs tentatives pour mettre fin à notre glorieux règne. Des officiers loyalistes des Gardiens de la révolution nous ont informés que des cargaisons d'aide matérielle ont commencé à affluer vers le territoire tenu par les rebelles et ont un effet considérable sur notre capacité à mener des opérations offensives pour reprendre le territoire perdu. Les armes plus lourdes, en particulier celles capables de paralyser nos forces blindées, constitueront un problème majeur pour nos forces ; des rapports font déjà état de nouvelles défections des forces armées vers les rebelles dans toutes les régions du sud. La situation continue de se déstabiliser et des mesures plus drastiques pourraient devoir être envisagées pour sauver le régime. Les murs se referment peut-être, mais nous devons continuer à lutter à tout prix pour éviter que la nation ne tombe entre les mains des communistes, des chiites, des Kurdes et des traîtres."
 IRQ_CIA.107.desc:0 "Nos contacts avec les rebelles du Sud nous ont appris que les États-Unis avaient également commencé à armer leur mouvement. Cela profitera sûrement à notre propre cause étant donné que le gouvernement irakien devra probablement rediriger ses forces hors de notre zone pour combattre la menace la plus pressante dans le sud. Nos contacts nous ont également assuré que nos forces recevront également davantage de fournitures et d'armes dans les prochains jours, aux côtés des rebelles du sud, et qu'elles sont encouragées à prendre des mesures plus audacieuses contre les forces baathistes pour empêcher tout redéploiement rapide et organisé vers le sud de l'Irak, susceptible de paralyser davantage l'armée irakienne. Les murs semblent se refermer sur le gouvernement baasiste, mais le régime a réussi à survivre à d'autres crises et on ne sait toujours pas si le gouvernement de Bagdad pourra reprendre l'initiative ou s'il est voué aux poubelles de l'histoire."
 IRQ_CIA.108.desc:0 "L'armée de l'air américaine a lancé plus tôt dans la journée des frappes aériennes sur les positions de la Garde républicaine irakienne dans tout le sud de l'Irak, selon un porte-parole du Pentagone. Il s'agit d'une escalade majeure : auparavant, les États-Unis avaient annoncé l'imposition d'une zone d'exclusion aérienne au-dessus de l'Irak afin de priver l'armée irakienne de sa puissance aérienne contre les représailles civiles et les attaques contre les forces rebelles. Des rapports font déjà état de pertes importantes de l'armée irakienne et de nouvelles défections du gouvernement au profit du mouvement rebelle. Alors que les chances du gouvernement baasiste continuent de décliner, des questions se posent désormais sur ce à quoi ressemblerait un Irak post-baasiste. La coalition contre Saddam comprend des transfuges du gouvernement, des baathistes pro-syriens, des communistes et des partis chiites pro-iraniens tels que le parti Dawa. Cette coalition disparate sera-t-elle capable de se rassembler pour former un nouvel Irak ou est-ce que ce sera le début d'une nouvelle ère d'instabilité et de conflits internes ?"
 IRQ_CIA.109.desc:0 "Les nouvelles deviennent de plus en plus sombres de jour en jour, de nouveaux rapports arrivent selon lesquels l'armée de l'air américaine a commencé à bombarder les positions des Gardiens de la Révolution dans tout le sud. Cela est susceptible de paralyser le moral de nos forces ; en dehors des Gardiens de la Révolution, les défections étaient devenues monnaie courante parmi les forces rebelles dans tout le pays. Avec une campagne de bombardements organisée qui supprime nos forces contre les Kurdes et contre les rebelles du sud, les services de sécurité s'attendent à de nouvelles défections généralisées et à la perte de pans de territoire, tant au Kurdistan irakien que dans le sud de l'Irak. De plus, nos installations anti-aériennes, déjà endommagées par les conflits passés, étaient totalement insuffisantes pour empêcher les Américains de bombarder nos forces, nos défenses aériennes ont déjà été complètement paralysées et irréparables et nos bases aériennes ont également subi de lourds bombardements aériens. Il sera peut-être bientôt temps d'envisager des plans de sortie pour assurer la sécurité personnelle des principaux responsables gouvernementaux."
 IRQ_CIA.110.desc:0 "Même si nous avons eu des différends avec l'Iran au cours de la dernière décennie, la situation actuelle en Irak offre une opportunité de reconstruire les relations avec le gouvernement iranien. Renverser le gouvernement irakien est dans l'intérêt à la fois de Téhéran et de Washington, surtout après la longue guerre Iran-Irak. Pourtant, cela serait une décision controversée, en particulier auprès de la population générale des États-Unis et de l'Iran. Nos diplomates du Département d'État ont commencé à rédiger une proposition qui comprend des dispositions visant à commencer une levée progressive des sanctions contre l'Iran ainsi que des garanties pour la légalisation des partis pro-iraniens dans un Irak post-baathiste. Si l'Iran acceptait, cela sonnerait effectivement le glas du régime baasiste et éliminerait du pouvoir l'un des dictateurs les plus dangereux au monde, tout en contribuant également au rétablissement des liens américano-iraniens. Cependant, il n'est pas clair si Téhéran aura le moindre désir de coopérer avec nous sur cette question, ou s'il cherchera à intervenir seul pour venger la précédente guerre Iran-Irak."
 IRQ_CIA.111.desc:0 "Une proposition intéressante est venue de Washington. Les Américains proposent de nous apporter leur soutien et de reconstruire les relations diplomatiques en échange de l'intervention de nos forces dans les troubles en Irak et du renversement du gouvernement irakien. La proposition implique également plusieurs concessions de la part des deux parties : les États-Unis ont signalé leur intention de commencer à lever les sanctions et soutiendraient la légalisation des partis pro-iraniens dans un Irak post-baathiste. Cependant, nous devrions également soutenir une constitution démocratique en Irak, tout en promettant de respecter l'autonomie kurde en Irak, jusqu'à inclure un éventuel référendum sur l'indépendance kurde. Accepter cette offre apaiserait sûrement les tensions avec l'Occident et aboutirait probablement à la chute du gouvernement baathiste qui a déclenché la guerre passée, mais cela pourrait être une occasion manquée si nous souhaitons attirer directement l'Irak dans notre sphère d'influence. Nous pourrions plutôt rester complètement en dehors du conflit, ou commencer à armer et soutenir les rebelles irakiens, ou même lancer notre propre intervention pour exporter la révolution. Comment devons-nous procéder ?"
 IRQ_CIA.112.desc:0 "Le gouvernement iranien a répondu positivement à notre proposition et a accepté de coopérer concernant l'Irak. Plusieurs stipulations ont été convenues en échange d'un soutien mutuel, parmi lesquelles la levée partielle des sanctions américaines contre l'Iran, une garantie de l'autonomie kurde dans un Irak post-baathiste et une constitution démocratique générale pour le nouvel État. En échange, nous veillerons à ce que les partis pro-iraniens ne soient pas interdits ou réprimés par nos agents et alliés dans la région. Dans les prochains jours, les agents des Gardiens de la révolution iraniens entameront une coordination plus approfondie avec les rebelles et commenceront à fournir des armes, provenant à la fois des stocks iraniens et américains. Une fois que les contacts auront été plus approfondis, notre armée de l'air lancera une campagne contre les forces irakiennes."
 IRQ_CIA.113.desc:0 "Malheureusement, le gouvernement iranien a décliné notre offre de coopération pour renverser le gouvernement irakien. Bien qu'aucune raison n'ait été précisée, nos analystes estiment que l'Iran est tout simplement trop las de la guerre après la récente conclusion de la guerre Iran-Irak et ne souhaite pas être impliqué si tôt dans une autre guerre avec son voisin. Une autre suggestion, peut-être plus alarmante, est que l'Iran envisage d'intervenir seul, de renverser le gouvernement irakien et d'exporter la révolution iranienne en Irak. Compte tenu du grand nombre de chiites parmi les rebelles, cette initiative pourrait avoir de grandes chances de succès. Un Irak théocratique dans l'orbite iranienne constituerait un véritable danger pour la stabilité régionale et mettrait sûrement en danger les approvisionnements mondiaux en pétrole. Cela permettrait également à l'Iran d'avoir un meilleur accès à des alliés potentiels et à des populations chiites amies dans tout le Levant et le golfe Persique. La Central Intelligence Agency devra suivre de près l'évolution de la situation dans la région dans les jours et les semaines à venir."
 IRQ_CIA.114.desc:0 "Dans le cadre d'une escalade majeure, les troupes iraniennes ont de nouveau traversé la frontière irakienne, alors que le soulèvement dans le sud de l'Irak continue de s'intensifier. Le soulèvement, mené principalement par la population chiite et des soldats mécontents, a rapidement réussi à s'emparer de plusieurs petites villes du sud de l'Irak et conteste actuellement la ville de Bassorah. Deux des principales factions du soulèvement dans le sud sont le Conseil suprême islamique d'Irak et le Parti islamique Dawa, qui seraient tous deux soutenus par l'Iran et auraient fait l'éloge de la révolution iranienne. Les spéculations vont bon train sur ce à quoi ressemblerait un Irak post-Saddam ; l'intervention iranienne pourrait laisser entrevoir le potentiel d'une République islamique en Irak similaire à celle de l'Iran. Cela dit, le soulèvement dans le sud est également soutenu par le Parti communiste irakien, les déserteurs militaires et les baathistes pro-syriens opposés au baasisme de Saddam. Le temps nous dira si cette intervention pourra mettre un terme à la violence ou constituera simplement un retour à la guerre Iran-Irak."

 CIA_KUR80.0.desc:0 "Les dernières décennies ont démontré que la grande majorité de nos alliés arabes sont amis du beau temps, même dans le meilleur des cas. L'instabilité des différents régimes arabes a été jusqu'à présent un problème majeur pour plusieurs administrations. La population kurde opprimée du nord de l'Irak est depuis longtemps plus encline à accepter le soutien américain. Compte tenu de nos problèmes persistants avec les gouvernements syrien et irakien, le Conseil de sécurité nationale a autorisé une ligne d'action visant à rechercher l'établissement d'un État kurde indépendant dans le nord de l'Irak. Cette démarche aliénera sûrement la Turquie et nous devrons équilibrer cette opération avec ses préoccupations et le potentiel d'un nouveau mouvement indépendantiste kurde dégénérant en un conflit ethnique régional plus large. En fin de compte, l'administration a décidé que cette ligne de conduite était la meilleure option pour établir un nouvel État aligné sur les États-Unis dans la région tout en déstabilisant et en affaiblissant les éléments régionaux hostiles en Irak et en Syrie."
 CIA_KUR80.1.desc:0 "Avant d'étendre notre influence et d'intensifier le conflit, l'administration a décidé d'agir pour faire connaître la lutte de la minorité irakienne, des populations non arabes, contre le gouvernement baasiste oppressif. Non seulement le gouvernement irakien a commis des actions génocidaires contre la population kurde en Irak, mais les efforts visant à assécher les marais mésopotamiens ont effectivement conduit au nettoyage ethnique de la population arabe indigène des marais. Si nous souhaitons obtenir un soutien pour de nouvelles actions contre le régime irakien, le Département d'État publiera une attaque cinglante contre les actions récentes du gouvernement irakien et son historique de persécution de ses minorités ethniques. Nos contacts dans les médias recevront des informations documentant l'ampleur des atrocités et des actions du gouvernement irakien visant à enflammer davantage l'opinion publique contre le gouvernement irakien et à renforcer le soutien à l'armement des rebelles ethniques dans la région."
 CIA_KUR80.2.desc:0 "Alors que nous poursuivons nos projets pour un Kurdistan indépendant, nous devons établir des contacts avec les principales personnalités du mouvement indépendantiste kurde. A savoir les dirigeants du Parti démocratique kurde (PDK) et de l'Union patriotique du Kurdistan (UPK). Les mouvements, dirigés respectivement par Masoud Barzani et Jalal Talabani, entretiennent une rivalité féroce, née de la scission de l'UPK du PDK sous Talabani, un ancien membre du PDK au milieu des années 1970 à cause de luttes intestines entre factions au sein du PDK entre des traditionalistes plus conservateurs sous Barzani et des nationalistes et intellectuels plus de gauche sous Talabani. Nos agents devront veiller à ce que les tensions entre les deux organisations ne dégénèrent pas en conflit ouvert ou ne les empêchent pas de travailler avec nous. Pour ce faire, nous devons nous rapprocher des dirigeants des deux partis et rechercher des liens cordiaux et, à partir de là, chercher à construire un consensus entre les deux partis sur la manière dont le pouvoir serait partagé à l'amiable dans un cadre indépendant"
 CIA_KUR80.3.desc:0 "Suite à la récente décision du Conseil national de sécurité, la Central Intelligence Agency a commencé à déployer des agents au Kurdistan irakien dans le but de cultiver des liens avec les forces peshmergas locales. La nature rurale du mouvement d'opposition et l'opposition de la Turquie à nos efforts ont compliqué les choses. Cependant, nos agents ont réussi à établir le contact et ont entamé des négociations avec des représentants du Parti démocratique kurde (PDK). Des rumeurs circulaient auparavant dans des rapports faisant état d'atrocités commises par les forces baathistes contre la population kurde, nos agents ont relayé des confirmations et des preuves documentées de ces crimes. Les analystes de la Central Intelligence Agency envisagent de fournir ces informations aux médias afin de provoquer davantage de protestations internationales contre le gouvernement irakien. Heureusement, contrairement aux mouvements kurdes de Syrie et de Turquie, les Peshmergas irakiens ne sont en grande partie pas communistes et sont davantage liés à la population rurale. Dans cette optique, on s'attend à ce que les négociations aboutissent rapidement et que les opérations d'expansion des Peshmergas commencent prochainement."
 CIA_KUR80.4.desc:0 "L'un des principaux problèmes rencontrés par les combattants peshmergas au cours de la dernière décennie concerne les différentes milices Jash. Les Jash sont des milices kurdes bien armées et fidèles au régime de Saddam. Ceux-ci étaient constitués en grande partie d'opposants à la direction Barzani du Parti démocratique du Kurdistan (PDK) et de la population kurde urbaine qui soutient davantage le gouvernement que les Kurdes ruraux. Les estimations de la taille totale des milices Jash se situent actuellement entre 250 000 et 300 000 combattants. Pour faire avancer nos projets au Kurdistan irakien, nous devrons résoudre ce problème. Le plan d'opérations récemment approuvé consiste à commencer à offrir des pots-de-vin à divers officiers du Jash afin de saper le soutien au régime de Saddam et de jeter les bases d'un soulèvement plus réussi à l'avenir."
 CIA_KUR80.5.desc:0 "L'Irak est une nation multiculturelle ; outre la population arabe et kurde, il existe d'importantes populations yézidies, assyriennes et turkmènes, toutes ayant une relation complexe entre les autres groupes ethniques et le gouvernement irakien. La Central Intelligence Agency a donné l'ordre à nos agents sur le terrain de rencontrer des représentants de ces communautés pour solliciter leur aide dans nos projets visant à établir un État non arabe dans la région. Ce ne sera malheureusement pas une tâche simple. Des problèmes de longue date existent entre ces différents groupes ethniques. Pour contourner ce problème, nous avons veillé à ce que les forces kurdes acceptent une proposition visant à permettre à ces groupes de créer des États indépendants. Garantir un État turkmène indépendant pourrait également apaiser les inquiétudes de la Turquie concernant notre projet kurde, mais en forçant un tel règlement, on risquera probablement d'intensifier les tensions entre les Turkmènes et les Kurdes en raison de leurs populations et de leurs revendications territoriales qui se chevauchent."
 CIA_KUR80.6.desc:0 "Nos contacts en Irak nous ont rapporté que leurs discussions avec les dirigeants turkmènes, assyriens et yézidis ont porté leurs fruits et que des accords ont été conclus pour que ces populations s'organisent contre le gouvernement une fois que la situation sécuritaire dans le pays se détériorera. Nos alliés kurdes sont encore quelque peu agacés par notre décision de nous rapprocher de ce groupe mais ont accédé aux propositions. Compte tenu du conflit de longue date entre tous ces groupes, cet accord devrait servir à apaiser les inquiétudes de la diaspora et à délégitimer davantage les revendications du gouvernement irakien. La Turquie s'est également engagée à soutenir les Turkmènes dans leur quête de liberté, tout en refusant de commenter les autres groupes et reste toujours méfiante à l'égard du projet kurde dans son ensemble. Cela représente néanmoins un progrès notable lorsqu'il s'agit de traiter avec notre ancien allié sur cette question."
 CIA_KUR80.7.desc:0 "Malheureusement, nos contacts en Irak nous ont fait savoir que les différents autres groupes ethniques d'Irak souhaitaient travailler en collaboration avec les Peshmergas. La principale raison en est, selon nos contacts, l'histoire entre ces groupes et les Peshmergas, en particulier les conflits ethniques passés, les massacres et, plus récemment, le non-respect des accords entre les deux parties. Pour aggraver les choses, les représentants turkmènes ont divulgué les communications au gouvernement turc, tendant ainsi davantage les liens avec la Turquie et renforçant leur opposition à notre objectif stratégique plus large actuellement au Moyen-Orient en ce qui concerne un État kurde indépendant. Pourtant, cela ne représente pas un coup dur pour nos plans et était largement attendu par nos agents locaux étant donné les tensions historiques entre ces groupes ethniques et les politiques conciliantes du gouvernement visant à jouer sur ces divisions pour empêcher des troubles plus larges dans le nord de l'Irak."
 CIA_KUR80.8.desc:0 "Après un long débat au sein du Conseil national de sécurité, le président a autorisé le lancement d'une campagne aérienne contre les forces irakiennes. La frappe aérienne sera limitée au nord de l'Irak, l'objectif étant de démanteler les fortifications irakiennes dans la région, de paralyser leur capacité à se redéployer rapidement et de cibler les sites utilisés pour le programme de guerre chimique irakien. Une fois ces étapes franchies, les Peshmergas devraient être en mesure de lancer une offensive générale pour prendre le contrôle de pans de territoire. Pendant que cet effort se poursuit, nos forces fourniront une couverture aérienne pour leur avancée et chercheront à démanteler tout ce qui reste de l'armée de l'air irakienne et à atténuer les risques de futures atrocités irakiennes contre la population kurde. Si l'Irak commet des actions d'escalade plus poussées, une campagne de bombardements plus large pourrait commencer à frapper ses actifs plus profondément à l'intérieur du pays."
 CIA_KUR80.9.desc:0 "Pendant des décennies, les Kurdes irakiens, en particulier les Kurdes ruraux, se sont révoltés à plusieurs reprises en faveur de la création d'un État kurde indépendant. Cependant, la campagne Anfal menée par le gouvernement irakien, qui a activement cherché à mettre fin au conflit en génocidant les centres de population ruraux kurdes ainsi qu'en recourant massivement à la guerre chimique, a indigné la communauté internationale et provoqué une résistance accrue de la population kurde contre le régime irakien. Le président américain [USA.GetLeader] a annoncé que l'armée américaine lançait des frappes aériennes contre des cibles militaires irakiennes dans tout le Kurdistan irakien et établissait une zone d'exclusion aérienne au-dessus du nord de l'Irak. Cela représente une escalade majeure dans la crise kurde en cours, mais cette décision a été largement saluée par la plupart des nations internationales, à l'exclusion d'autres États comptant d'importantes populations kurdes craignant des révoltes sur leurs propres terres."
 CIA_KUR80.10.desc:0 "Pour aider davantage les Peshmergas à lutter contre le gouvernement baathiste, la décision a été prise de viser à déstabiliser le gouvernement irakien. En particulier, d'autres groupes de résistance dans le sud de l'Irak recevront des armes limitées pour lancer des attaques contre les forces irakiennes. De plus, nos agents dans le pays, en collaboration avec nos collaborateurs locaux, chercheront à éliminer des cibles de premier plan au sein du gouvernement tout en lançant des attaques sur des sites d'infrastructures notables à travers Bagdad. Pourtant, ces actions à elles seules ne suffisent pas : nos responsables commerciaux ont cherché à réprimer le flux d'argent vers l'Irak en renforçant les sanctions contre l'économie irakienne et les responsables gouvernementaux, tout en faisant pression sur nos alliés du Golfe pour qu'ils déstabilisent davantage l'économie irakienne en relation avec la dette considérable que l'Irak leur doit. Toutes ces actions devraient contribuer à délégitimer le pouvoir du gouvernement, à affaiblir l'économie irakienne et à éroder la structure du pouvoir de l'État irakien."
 CIA_KUR80.11.desc:0 "L'ambassadeur américain a relayé une offre intéressante. Le président [USA.GetLeader] s'est engagé dans une démarche visant à établir un Kurdistan indépendant dans la région afin de servir d'allié régional pour l'Amérique et potentiellement pour nous-mêmes. Bien que ce plan présente des avantages certains, il comporte également des risques associés. En supposant que ce plan réussisse, nous aurons sûrement encore plus endommagé nos liens avec le monde arabe. Dans le même temps, la force de la Syrie serait certainement fortement réduite et nous aurions un nouvel allié pour contrebalancer les menaces qui pèsent sur notre nord. De plus, retirer le gouvernement syrien du conseil d'administration faciliterait nos efforts au Liban et pourrait offrir des opportunités d'établir d'autres États clients dans la région, ce qui stabiliserait davantage la situation à nos frontières. Cela dit, nous devrions également réfléchir à l'impact que cela aurait sur nos relations avec la Turquie, compte tenu de ses propres problèmes avec sa minorité kurde. Comment devons-nous procéder ?"
 CIA_KUR80.12.desc:0 "Une nouvelle sans surprise, mais bienvenue, est arrivée. Le gouvernement israélien a accepté notre proposition de collaborer aux efforts visant à renforcer le séparatisme kurde dans toute la région. La réponse israélienne a également demandé notre aide supplémentaire au Liban et notre soutien potentiel aux actions israéliennes visant à établir des États clients chrétiens et druzes dans la région pour contrebalancer l'hostilité arabe envers l'État israélien. Bien que nous n'ayons pas accepté ces conditions en détail, elles s'alignent globalement sur nos propres objectifs stratégiques. Avec le soutien israélien, notre réseau de logistique et de renseignement sera considérablement étendu et nos inquiétudes concernant le manque d'alliés régionaux dans ce programme seront désormais apaisées. Même si la Turquie restera un sujet de préoccupation et généralement opposée à celle-ci, le soutien israélien nous offre une alternative viable pour la contrebande d'armes et les activités clandestines, en particulier pour les actions à entreprendre contre la Syrie."
 CIA_KUR80.13.desc:0 "Étonnamment, le gouvernement israélien a rejeté notre offre de collaborer au soutien du mouvement indépendantiste kurde. Le gouvernement israélien a reconnu que le plan présentait des avantages, mais a fait valoir qu'une telle action pourrait mettre en danger ses autres opérations en cours en Syrie et au Liban. En outre, des inquiétudes ont été exprimées quant à l'impact d'une telle décision sur les États arabes avec lesquels ils tentent de normaliser leurs relations. La question de la Turquie a également été soulevée, en particulier avec les inquiétudes quant à la réaction du gouvernement turc à la création d'un État kurde, compte tenu de ses propres problèmes avec sa population kurde. Le gouvernement israélien a reconnu son désir de coopérer davantage dans la région à d'autres égards, notamment en ce qui concerne la situation actuelle au Liban. C'est plutôt décevant, mais nos propres agents sont capables de continuer à oeuvrer pour atteindre notre objectif stratégique dans la région sans soutien étranger."
 CIA_KUR80.14.desc:0 "L'ambassadeur américain nous a fait le point sur les efforts américains à l'égard des Kurdes. Cette question est depuis longtemps une question controversée dans les relations américano-turques depuis que le président américain a décidé de soutenir les Peshmergas chez nos voisins du sud. Dans le cadre de leurs efforts visant à apaiser nos inquiétudes, les Américains ont accepté de nous fournir davantage de renseignements sur les positions et l'adhésion du Parti des travailleurs du Kurdistan (PKK). Un nouvel objectif du projet américain est de réduire l'influence communiste dans le mouvement kurde. Dans ce cadre, ils demandent à nos forces de prendre des mesures décisives contre le PKK et visent à fermer notre frontière avec l'Irak et la Syrie pour empêcher les forces du PKK de se mêler davantage aux autres forces kurdes dans notre sud. Accepter cela contribuerait sûrement à réprimer le PKK, mais en participant à ce projet, nous reconnaîtrions tacitement le projet de créer un État kurde dans notre sud à partir de terres appartenant autrefois à la Syrie et à l'Irak. Comment devons-nous procéder ?"
 CIA_KUR80.15.desc:0 "Malheureusement, nos efforts pour désengager les organisations kurdes syriennes du Parti communiste des travailleurs du Kurdistan (PKK). Suite au refus turc de collaborer à la lutte contre le PKK, les liens entre le PKK communiste et nos alliés locaux ont continué à se développer et à se renforcer. Bien que l'idéologie des organisations kurdes irakiennes et syriennes n'ait pas particulièrement changé, leur influence a généré davantage de méfiance et de colère à l'égard du gouvernement turc, et une partie de nos armes fournies se trouve en Turquie. Tout cela a encore plus alarmé la Turquie, l'incitant à sévir plus durement contre la population kurde dans son propre pays, attisant encore davantage les tensions entre les Kurdes et nuisant aux relations avec l'Occident, indigné par ses récentes violations des droits de l'homme."
 CIA_KUR80.16.desc:0 "Heureusement, nos efforts pour discréditer le Parti des travailleurs du Kurdistan (PKK) ont porté leurs fruits et les nouveaux mouvements kurdes organisés émergents en Syrie évitent toute affiliation directe avec le PKK et adoptent une ligne anticommuniste. Le fait que le gouvernement turc ait accepté notre proposition et coordonné ses efforts pour diminuer le PKK en Turquie et couper les liens entre les organisations a été une étape cruciale dans la réduction de leur influence. La collaboration avec la Turquie sur son propre problème kurde a également contribué à apaiser les inquiétudes turques concernant les objectifs stratégiques plus larges du programme et a affaibli l'ensemble du mouvement communiste en Turquie, un allié régional majeur. Il s'agit d'une aubaine majeure pour notre plan à long terme dans la région et pourrait nous aider dans nos projets à venir visant à lancer le soulèvement armé parmi la population kurde dans les États arabes."
 CIA_KUR80.17.desc:0 "Les troubles dans le nord de l'Irak ont finalement atteint un crescendo aujourd'hui alors que les villes à majorité kurde du Kurdistan irakien ont explosé dans la violence. Les rebelles kurdes ont rapidement pris le contrôle de pans entiers des grandes villes de Kirkouk et de Mossoul. Cela fait suite à l'imposition par les États-Unis d'une zone d'exclusion aérienne et au lancement d'une campagne de bombardements contre l'armée irakienne en représailles à la campagne Anfal. Cela représente un tournant majeur dans le conflit kurde irakien. Historiquement, la population kurde urbaine était la plus ambivalente et la plus ouverte à la collaboration avec le gouvernement central irakien. Les atrocités commises contre leur population et la fragilité renouvelée du gouvernement central ont conduit cette relation à finalement se transformer en révolte ouverte. Les recrutements au sein de l'Union patriotique du Kurdistan (UPK), du Parti démocratique du Kurdistan (PDK) et du Parti des travailleurs du Kurdistan (PKK) ont explosé ces derniers jours. Le potentiel d'un Kurdistan indépendant étant désormais possible, il faut se demander si les organisations idéologiquement dispersées seront capables de construire un consensus commun et un gouvernement stable."
 CIA_KUR80.18.desc:0 "Malheureusement, notre longue histoire d'oppression de la population kurde n'a pas réussi à dissuader un autre soulèvement kurde. Plus tôt dans la journée, des rapports sur le terrain dans le nord de l'Irak ont fait état d'attaques rapides et de la capture de divers points de contrôle ruraux. Dans les zones kurdes plus urbaines, des rapports faisant état d'émeutes raciales ont également éclaté à Mossoul. La nouvelle la plus alarmante de toutes est peut-être que la ville d'Erbil est rapidement tombée aux mains des forces peshmergas et que les rumeurs abondent sur une avancée vers Kirkouk et Mossoul. Les loyalistes restants qui ont réussi à s'échapper d'Erbil assez rapidement ont rapporté que la journée avait commencé normalement jusqu'à ce que les milices de Jash commencent à ouvrir le feu sur les forces gouvernementales et que les guérilleros prennent rapidement d'assaut les prisons locales et les commissariats de police alors que les traîtres réduisaient nos forces dans leurs casernes. Ceci, combiné à la pression américaine, pourrait rendre le contrôle de la majeure partie du Kurdistan irakien difficile, au mieux, et au pire, presque impossible, à moyen et long terme."
 CIA_KUR80.19.desc:0 "Pendant des années, il y a eu peu de conflits entre notre gouvernement et la population kurde dans le nord de nos nations. Même si des problèmes locaux occasionnels sont apparus ces dernières années, l'appareil de sécurité n'a généralement guère suscité d'inquiétudes. Les événements ont débuté dans les villes du nord, en particulier à Qamishli et à Hassaké, où des manifestants kurdes ont initialement déclenché une émeute raciale et attaqué la population arabe locale, tout en prenant d'assaut la police locale et les infrastructures du parti. La situation s'est encore détériorée avec l'arrivée soudaine d'unités de guérilla peshmergas qui ont réussi à s'emparer rapidement des deux villes. Peut-être plus alarmant est l'absence de rapports en provenance de Kobani, dont les services de renseignements pensent qu'elle est due à une perte totale de contrôle sur la ville. Des escarmouches ont également été signalées à la périphérie de Deir-ez-Zor. Compte tenu du soutien américain au mouvement kurde et de notre allié le plus probable, l'Irak, confronté à des problèmes similaires, nous devrons réfléchir attentivement à nos choix stratégiques."
 CIA_KUR80.21.desc:0 "Le soulèvement kurde en cours dans notre propre pays et en Syrie devient de jour en jour plus sombre. Des informations sont arrivées du front selon lesquelles des avions américains, en collaboration potentielle avec Israël, ont commencé à bombarder nos forces et nos aérodromes à proximité des lignes de front et répriment activement nos tentatives de transporter des forces militaires pour aider à réprimer la rébellion. Des rapports en provenance de la Syrie voisine ont relayé des informations similaires avec des frappes américaines majeures sur des aérodromes syriens et ciblant des installations de défense aérienne dans tout le pays. En dehors d'une Syrie déjà assiégée, nous avons peu ou pas d'alliés vers lesquels nous tourner. Même si l'Iran et la Turquie sont favorables à l'idée de réprimer le séparatisme kurde, ni l'un ni l'autre ne lèvera le petit doigt pour soutenir notre gouvernement étant donné leur profond dégoût pour notre propre régime."
 CIA_KUR80.22.desc:0 "Le soulèvement kurde en cours dans notre propre pays et en Irak devient de jour en jour plus sombre. Des nouvelles sont arrivées du front selon lesquelles des avions américains, potentiellement en collaboration avec Israël. Pour aggraver les choses, le soutien aérien semble également avoir été utilisé pour affaiblir notre emprise sur la nation face à la résurgence des Frères musulmans qui tentent de prendre le contrôle de pans de territoire autour d'Alep. Nos sources à Bagdad ont également rapporté que des actions similaires ont été prises contre leurs forces, alors que nous avons désespérément lancé des appels au soutien, jusqu'à présent aucune offre d'aide substantielle n'a été reçue. Pire encore, nos principaux alliés potentiels contre les Kurdes ne sont pas disposés à prendre les armes contre les États-Unis, en particulier contre la Turquie, compte tenu de leur statut de membre de l'OTAN. Il est peut-être temps d'envisager un retrait vers nos principaux territoires loyalistes autour de Damas et de Lattaquié si la situation se détériore encore."
 CIA_KUR80.23.desc:0 "Nos efforts pour étendre le conflit kurde à la Syrie ont jusqu'à présent été couronnés de succès. Maintenant qu'une rébellion est déclenchée, nous devons faire notre part et intervenir activement dans le conflit. Cela dit, nous ne pouvons pas immédiatement nous lancer ouvertement dans le conflit. Plusieurs propositions ont été soumises par nos analystes au sein de la Central Intelligence Agency pour nous aider à préparer notre intervention armée ouverte ainsi que des moyens plus secrets pour affaiblir l'État syrien et rallier la population à l'intervention. Plus particulièrement, même si l'opposition kurde devrait être en mesure de conserver des territoires sans trop d'aide pour le moment, il doit y avoir d'autres distractions pour garantir que l'armée syrienne ne puisse pas converger toutes vers le Kurdistan syrien. Dans cet effort, il est proposé de commencer à chercher d'autres forces d'opposition en Syrie pour les soutenir et les armer afin de provoquer davantage de chaos. Bien entendu, nous devrons également veiller à ce que les médias couvrent avec sympathie la lutte kurde et diaboliser le gouvernement syrien afin de renforcer le soutien, tant au niveau national qu'international, en faveur d'une intervention."
 CIA_KUR80.24.desc:0 "Dans nos efforts continus pour établir un État kurde au Moyen-Orient afin de nous fournir un allié crédible au Moyen-Orient en plus d'Israël, la déstabilisation de la Syrie est une étape importante. La principale stratégie proposée par la Central Intelligence Agency est d'armer l'opposition islamiste en Syrie, principalement les Frères islamiques. Le gouvernement syrien a brutalement réprimé un soulèvement des Frères musulmans au cours de la décennie, mais la colère de la population arabe sunnite envers le gouvernement à prédominance alaouite est toujours latente et peut être exploitée. À cette fin, le président a autorisé l'envoi d'armes aux Frères musulmans et aux forces associées en Syrie afin de déstabiliser davantage la Syrie et de jeter les bases d'une intervention armée en Syrie de nos militaires et d'autres parties alliées. Des inquiétudes ont été exprimées quant à la manière dont cette décision pourrait conduire à une augmentation de la radicalisation religieuse dans toute la région, mais le Conseil de sécurité nationale a décidé qu'il s'agissait d'un risque acceptable de renversement du gouvernement syrien."
 CIA_KUR80.25.desc:0 "Avant de prendre de nouvelles mesures contre le gouvernement syrien, nous devons rallier la communauté internationale, en particulier nos alliés de l'OTAN, contre le régime. Pour commencer, nos agents dans les médias ont reçu l'ordre d'amplifier la couverture de la violence politique et de la répression brutale contre les Frères musulmans et de couvrir la manière dont une minorité religieuse marginale alignée sur le terrorisme dans la région opprime la population syrienne et exerce une emprise sur le gouvernement et l'armée. Compte tenu de la force de nos contacts médiatiques, cela ne devrait pas être une tâche difficile. De plus, les conflits entre la Syrie et Israël et la participation syrienne à la guerre civile libanaise devraient être utilisés pour diaboliser davantage le régime syrien en tant qu'acteur instable semant la tourmente et le chaos à travers le Moyen-Orient tout en opprimant sa propre population. Nos représentants aux Nations Unies ont également été chargés de rédiger et de proposer de nouvelles sanctions contre le gouvernement syrien en raison de ses violations des droits de l'homme, afin d'encourager davantage le tollé."
 CIA_KUR80.26.desc:0 "Alors que le conflit kurde dans le nord de l'Irak a explosé, les braises de la rébellion se sont rapidement propagées également au Kurdistan syrien. Les troubles initiaux ont été brutalement affrontés par le régime [SYR.GetLeader], notamment en recourant à des armes chimiques et à d'autres violations brutales des règles de la guerre. Le président américain [USA.GetLeader] a annoncé aujourd'hui que les États-Unis interviendraient en Syrie pour renverser le régime barbare de [SYR.GetLeader] ainsi que pour libérer les Kurdes du nord de la Syrie. Cette décision fait également suite au récent soutien militaire américain aux Kurdes irakiens et soulève d'autres questions quant à savoir si un Kurdistan indépendant est enfin en vue. Des questions demeurent, d'autant plus que des inquiétudes sont exprimées à Ankara et à Téhéran concernant d'éventuels troubles dans leurs propres régions à majorité kurde. Les États arabes ainsi que l'Union soviétique ont condamné cette décision, la qualifiant de manque de respect flagrant des normes internationales, tandis que la plupart des membres de l'OTAN ont exprimé leur soutien à cette décision, à l'exception notable de la Turquie."
 CIA_KUR80.27.desc:0 "Les forces américaines ont lancé une intervention terrestre majeure dans notre pays avec le soutien d'Israël et d'autres alliés américains régionaux. De plus, les forces des Frères musulmans ont lancé des attaques simultanées contre les forces gouvernementales et les forces peshmergas ont intensifié leurs tentatives pour consolider leur contrôle sur le nord-est de la Syrie. Nos forces armées doivent déterminer rapidement de nouvelles lignes défensives et sécuriser nos bases de soutien à Lattaquié et Damas, où nous pouvons compter sur la population locale pour soutenir le gouvernement et les forces armées. Nous devrons peut-être envisager de céder certaines régions à l'opposition et aux Américains pour ne pas trop nous étendre et essayer de réduire les risques de bombardements en utilisant les zones urbaines denses comme champ de bataille de prédilection. Malheureusement, notre manque d'alliés régionaux revient nous hanter, et des inquiétudes ont été soulevées quant à une éventuelle incursion israélienne à travers le plateau du Golan."
 CIA_KUR80.28.desc:0 "L'accord Sykes-Picot définit depuis la fin de la Première Guerre mondiale les frontières du Moyen-Orient. Les critiques affirment depuis des décennies que les lignes tracées pour déterminer les frontières du Moyen-Orient étaient arbitraires et préjudiciables aux intérêts des groupes ethniques non arabes dans toute la région. Le groupe le plus méprisé est peut-être celui des Kurdes d'Irak et de Syrie. Cependant, suite au succès de la lutte kurde pour l'indépendance en Irak et à l'intervention américaine en Syrie, un Kurdistan nouvellement indépendant a émergé, brisant les frontières établies au lendemain de la Première Guerre mondiale. Cela dit, l'avenir du reste de la Syrie est toujours en débat, car des propositions ont été présentées, allant de la préservation de l'intégrité territoriale restante de la Syrie à une balkanisation accrue de la nation sur des bases ethniques. Le temps nous dira comment ces changements se répercuteront dans toute la région."
 CIA_KUR80.29.desc:0 "Le soulèvement kurde en cours devient de jour en jour plus sombre. Des milices autrefois loyalistes ont fait défection au profit des Peshmergas, un conflit ethnique a éclaté dans les zones urbaines et des troubles généraux se sont propagés à travers le pays. Pour aggraver encore les choses, des nouvelles sont arrivées du front selon lesquelles des avions américains, en collaboration potentielle avec Israël, ont commencé à bombarder nos forces et nos aérodromes à proximité des lignes de front et répriment activement nos tentatives de transport de forces militaires pour aider à réprimer la rébellion. En dehors d'une Syrie déjà assiégée, nous avons peu ou pas d'alliés vers lesquels nous tourner. Même si l'Iran et la Turquie sont favorables à l'idée de réprimer le séparatisme kurde, ni l'un ni l'autre ne lèvera le petit doigt pour soutenir notre gouvernement étant donné leur profond dégoût pour notre propre régime. Nous devrons peut-être envisager de prendre des mesures encore plus drastiques contre la population kurde dans les prochains jours."

 Gladio80.0.desc:0 "Peu après la fin de la Seconde Guerre mondiale, nous avons organisé un large éventail d'unités et d'organisations de repli organisées dans toute l'Europe continentale. Ce réseau, nommé « Gladio », est présent dans tous les pays non soviétiques et non communistes d'Europe continentale ainsi que dans tous les membres de l'OTAN, à l'exception de l'Islande, du Canada et de la Grande-Bretagne. La mission principale des organisations de repli est de préparer la Troisième Guerre mondiale et de lancer des opérations de résistance contre les occupants soviétiques si les forces soviétiques parviennent à occuper leurs territoires d'origine. Malheureusement, bon nombre de nos principaux agents du programme sont liés à des officiers d'extrême droite et souvent à d'anciens officiers nazis pendant la Seconde Guerre mondiale. Cependant, de nombreux pays dans lesquels nous avons ces cellules ignorent nos activités ou ne sont pas conscients de la véritable ampleur de l'opération. De plus, les agents de Gladio ou liés à Gladio ont été des participants majeurs aux coups d'État grecs et turcs ainsi qu'à la violence politique qui a eu lieu en Italie ces derniers temps.\n\nNous devons maintenant décider s'il faut intensifier le programme actuel ou chercher à exclure les éléments d'extrême droite et à divulguer nos activités avec nos partenaires de sécurité."
 Gladio80.1.desc:0 "Après d'intenses débats au sein du Conseil national de sécurité (NSC), le président [USA.GetLeader[a décidé que l'administration devait réévaluer notre conduite dans le cadre de l'opération Gladio. Le NSC a notamment décidé que les agents d'extrême droite et les réseaux locaux constituaient un handicap global pour l'opération et qu'il fallait s'en occuper à court terme. D'autres inquiétudes ont également été exprimées quant à la sécurité et à l'intégrité de nos vastes caches d'armes cachées dans toute l'Europe, en particulier à la lumière d'informations selon lesquelles des éléments du crime organisé auraient découvert certains stocks et auraient commencé à utiliser les armes qu'ils contenaient. Le plus controversé au sein du NSC et de la communauté du renseignement au sens large est l'accord selon lequel les États membres de l'OTAN devraient être informés dans une certaine mesure de l'opération Gladio une fois que nos réformes auront été mises en oeuvre, afin de rassurer nos alliés et d'apaiser les inquiétudes concernant divers événements liés au terrorisme et au crime organisé survenus ces dernières années et liés à nos réseaux opérationnels de renseignement."
 Gladio80.2.desc:0 "L'une de nos principales préoccupations soulignées lors du débat au Conseil de sécurité nationale est la révélation récente selon laquelle des éléments du crime organisé ont découvert des caches d'armes cachées et les ont utilisées à leur propre profit illicite. Même si le public et les gouvernements résidents ne sont pas nécessairement conscients de l'origine des armes, il n'en demeure pas moins que nos caches d'armes ont été compromises et sont utilisées pour nuire à nos alliés. À cet effet, le directeur de la CIA a ordonné aux agents d'enquêter sur l'état de toutes les caches d'armes notables, en dehors de l'opération Gladio. Une fois cet audit terminé, le directeur a décidé que l'administration devrait déterminer la manière de procéder en ce qui concerne les nouveaux protocoles de stockage et l'avenir des caches d'armes cachées en Europe occidentale, en particulier dans les zones urbaines où la plupart des découvertes ont eu lieu jusqu'à présent."
 Gladio80.3.desc:0 "Bien que controversés au sein de l'administration, nombre de nos agents secrets en Eurasie sont d'anciens nazis avec souvent une histoire personnelle très désagréable. Cependant, ces agents tels que Ruzi Nazar, l'un des principaux dirigeants de la Légion du Turkestan qui a combattu pour l'Allemagne pendant la Seconde Guerre mondiale, se sont révélés d'une valeur inestimable dans l'organisation des cellules, la collecte de renseignements et le recrutement. Malheureusement, d'autres éléments d'extrême droite, notamment en Italie et en France, ont été impliqués dans de nombreuses attaques terroristes non autorisées contre leurs opposants politiques nationaux. Cependant, cette décision a été une erreur depuis le début et trahit nos valeurs nationales et a conduit à divers incidents chez nos alliés. Le Conseil national de sécurité a décidé de lancer dans un avenir proche une purge complète des militants d'extrême droite, en particulier de ceux ayant des liens néo-nazis. Avant que la purge ne commence complètement. Notre appareil de renseignement devra veiller à ce que tous les détails soient résolus et que l'opération globale ou les incidents passés qui y sont liés deviennent publics."
 Gladio80.4.desc:0 "Conformément à nos nouveaux changements de politique concernant l'opération Gladio, les ministres fiables des États de l'OTAN où nous disposons de réseaux stay-behind actifs ont été informés des réseaux et des mesures que nous avons prises récemment pour accroître la sécurité et la crédibilité de l'opération. Dans l'ensemble, l'accueil a été mitigé, l'appréciation suscitée par la divulgation des opérations, mais l'inquiétude quant à la durée pendant laquelle ces réseaux ont existé sans divulgation. Malheureusement, cette décision a ouvert davantage d'opportunités pour que notre opération soit divulguée au public et pourrait la rendre plus vulnérable à la subversion soviétique. Cependant, les avantages de cette décision l'emporteront probablement sur les inconvénients étant donné que nous pouvons désormais établir activement des liens plus solides en matière de renseignement avec nos alliés et améliorer les plans visant à établir des gouvernements en exil et à mener des opérations de repli dans leurs pays respectifs."
 Gladio80.5.desc:0 "Après un examen attentif, le Conseil national de sécurité a décidé de maintenir le cap sur l'opération Gladio. Même si certains aspects de l'opération feront l'objet d'un examen plus approfondi, notamment en ce qui concerne les personnes recrutées et ciblées pour le programme, ainsi que l'éventuelle expansion de la collaboration avec d'autres États membres de l'OTAN, la mission globale de Gladio est trop impérative pour être mise en danger par des réformes drastiques. Bien qu'il y ait eu des incidents au cours desquels des agents liés à Gladio ont utilisé nos actifs sans consentement pour se livrer à des actes terroristes et que certaines caches ont été découvertes et saisies par des éléments du crime organisé, le programme dans son ensemble est globalement solide et a déjà montré son utilité dans la prévention de la propagation du communisme en Grèce et en Turquie au cours des dernières années. Ceci dit, nous devons veiller à ce que le public reste ignorant du programme pour le moment et idéalement indéfiniment étant donné les liens de Gladio avec des éléments peu recommandables, en particulier les liens entre nos services de renseignement et les nazis non réformés."
 Gladio80.6.desc:0 "Pendant trop longtemps, notre réseau opérationnel a été dans une certaine mesure déconnecté des services de renseignement du pays cible. À cet effet, les agents de la CIA seront utilisés pour nouer de nouvelles relations au sein des services de renseignement de divers pays et commencer à recruter davantage parmi eux pour l'opération Gladio. Au-delà des avantages d'élargir notre préparation à une autre guerre mondiale, cela nous permettrait également d'exercer une plus grande influence sur les gouvernements de nos alliés et de garantir qu'ils ne tombent pas dans le camp du communisme. Depuis des décennies, nous entretenons des liens étroits avec les services de renseignement de certains pays, notamment en Grèce et en Turquie, où nous encourageons les interventions lorsque le pays semble au bord du chaos ou se tourne vers le communisme. Dans l'ensemble, l'extension de cette capacité à d'autres pays européens revêt une importance capitale et devrait constituer un objectif stratégique pour les années à venir."
 Gladio80.7.desc:0 "Après de longues discussions au sein de l'OTAN, les États membres ont convenu d'étendre les capacités de partage de renseignements et de coordonner davantage les opérations de renseignement. Il s'agit d'une victoire définitive pour la stratégie de renseignement du président [USA.GetLeader]ainsi que d'une victoire pour le renforcement de l'unité de l'OTAN. Cela dit, certains États membres ont exprimé des inquiétudes quant au traitement réservé à leur souveraineté nationale, compte tenu des événements récents et de l'histoire des opérations visant à renverser les gouvernements de certains pays au cours des années précédentes. Notre administration a apaisé ces inquiétudes en soulignant notre implication limitée et qu'il existait clairement un danger actuel que ladite nation tombe dans le communisme ou risque une guerre civile désastreuse et que de telles opérations sont une méthode de dernier recours. Cette décision devrait également nous permettre d'ancrer davantage nos agents et nos réseaux de repli dans les réseaux de renseignement de nos alliés et dans ceux de notre pays, tout en élargissant notre bassin de recrues potentielles. "
 Gladio80.8.desc:0 "Malheureusement, après avoir proposé d'accroître le partage de renseignements et la collaboration entre les membres de l'OTAN, l'organisation a voté contre cette proposition. Des préoccupations ont été exprimées par les pays concernant les problèmes de confidentialité et les informations faisant état d'une augmentation du terrorisme d'extrême droite ainsi que du crime organisé découvrant des caches d'armes « inconnues » dans la région. Bien que malheureuse, cette décision ne dissuadera en rien nos opérations de continuer à étendre et à développer notre réseau de cellules de repli dans toute l'Europe continentale. Étant donné que l'objectif secondaire de Gladio est d'empêcher une prise de contrôle communiste des pays d'Europe occidentale, nous devrions peut-être envisager d'examiner plus en détail les gouvernements qui ont voté contre la proposition. Cela dit, cette décision suscitera une certaine réticence parmi nos alliés, en particulier ceux qui ont voté contre en raison de préoccupations liées à la souveraineté nationale, et constitue un léger embarras chez nous."
 Gladio80.9.desc:0 "Bien que controversés au sein de l'administration, nombre de nos agents secrets en Eurasie sont d'anciens nazis avec souvent une histoire personnelle très désagréable. Cependant, ces agents tels que Ruzi Nazar, l'un des principaux dirigeants de la Légion du Turkestan qui a combattu pour l'Allemagne pendant la Seconde Guerre mondiale, se sont révélés d'une valeur inestimable dans l'organisation des cellules, la collecte de renseignements et le recrutement. Malheureusement, d'autres éléments d'extrême droite, notamment en Italie et en France, ont été impliqués dans de nombreuses attaques terroristes non autorisées contre leurs opposants politiques nationaux. Cela remet en question notre utilisation de l'extrême droite militante pour le recrutement principal de Gladio. Dans cette optique, le Conseil national de sécurité a approuvé un plan visant à accroître davantage le recrutement dans les cercles d'extrême droite à travers l'Europe afin d'utiliser leurs compétences et leurs relations uniques pour élargir davantage notre préparation au pire."
 Gladio80.10.desc:0 "Bien que controversés au sein de l'administration, nombre de nos agents secrets en Eurasie sont d'anciens nazis avec souvent une histoire personnelle très désagréable. Cependant, ces agents tels que Ruzi Nazar, l'un des principaux dirigeants de la Légion du Turkestan qui a combattu pour l'Allemagne pendant la Seconde Guerre mondiale, se sont révélés d'une valeur inestimable dans l'organisation des cellules, la collecte de renseignements et le recrutement. Malheureusement, d'autres éléments d'extrême droite, notamment en Italie et en France, ont été impliqués dans de nombreuses attaques terroristes non autorisées contre leurs opposants politiques nationaux. Cela remet en question notre utilisation de l'extrême droite militante pour le recrutement principal de Gladio. Dans cette mesure, le Conseil national de sécurité a décidé de revoir nos réseaux opérationnels actuels et de garantir des normes de contrôle appropriées pour les futurs membres des cellules et en particulier leurs dirigeants. Toutefois, en mettant à l'écart les éléments d'extrême droite, nous devrons veiller à ce qu'ils ne divulguent pas d'informations aux médias en représailles."

 CIA_Karabach.0.desc:0 "Depuis des millénaires, la région du Karabakh est un théâtre de conflits entre les Arméniens et divers peuples turcs musulmans. L'Union soviétique a tenté de résoudre le problème par des transferts de population et d'autres mesures, mais à mesure que l'Union soviétique commençait à s'effondrer, les tensions dans la région ont explosé. L'Arménie et l'Azerbaïdjan sont désormais en guerre pour la région contestée, la population arménienne du Karabakh déclarant son propre État indépendant, qui est en réalité un mandataire d'Erevan.\n\nCela dit, nous avons actuellement une influence minime dans le Caucus et le conflit offre une opportunité à notre gouvernement de commencer à exercer une influence dans la région. Cependant, pour y parvenir, nous devrons soutenir soit l'Azerbaïdjan, soit l'Arménie, et saper l'influence russe dans le pays que nous déciderons de soutenir. De plus, choisir l'un ou l'autre pourrait entraîner des répercussions géopolitiques ou nationales. Soutenir l'Arménie susciterait sûrement la colère de la Turquie, tandis que soutenir l'Azerbaïdjan susciterait des protestations de la part de la diaspora arménienne aux États-Unis."
 CIA_Karabach.1.desc:0 "Après plusieurs jours de débats et de discussions, le Conseil de sécurité nationale a pris la décision de contacter le gouvernement arménien au sujet de la guerre du Karabakh en cours. Notre ambassadeur en Arménie rencontrera secrètement le ministre arménien des Affaires étrangères pour lui proposer une aide et des conseillers. L'offre devra être faite avec le moins de risques de fuite possible étant donné la nature géopolitique délicate du conflit, notamment en ce qui concerne le soutien de la Turquie à l'Azerbaïdjan et le déni continu du génocide arménien. Même si nos experts en politique étrangère pensent que l'Arménie acceptera l'offre, il convient de noter que les éléments pro-russes au sein du gouvernement et de la population russes pourraient conduire Erevan à rejeter l'offre par crainte de s'aliéner ses alliés russes."
 CIA_Karabach.2.desc:0 "Une proposition intéressante est venue de Washington : les États-Unis proposent de nous envoyer une aide militaire et des conseillers pour soutenir notre conflit en cours avec l'Azerbaïdjan. Bien qu'aucune condition ne soit directement attachée, il s'agit clairement d'un jeu de pouvoir contre l'influence russe dans notre nation et doit être soigneusement examiné avant de l'accepter. Accepter l'accord conduirait probablement à s'aliéner le gouvernement russe et susciterait l'opposition des oligarques pro-russes et du bloc électoral davantage pro-russe. Cependant, l'accepter conduirait probablement à un renforcement des liens avec les puissances occidentales, à une aide militaire majeure et à l'opportunité d'une modernisation indispensable de notre armée ainsi qu'à une aide pour légitimer notre intention de s'emparer du Karabakh. Comment devons-nous procéder ?"
 CIA_Karabach.3.desc:0 "Le gouvernement arménien a répondu aujourd'hui à notre offre et a accepté notre offre d'aide matérielle et d'envoi de conseillers. C'est une excellente nouvelle pour nos projets continus visant à renforcer notre influence dans les Caucus. Des expéditions d'aide et des conseillers seront redéployés des bases de l'OTAN en Europe occidentale vers l'Arménie dans les prochains jours pour soutenir leur conflit avec l'Azerbaïdjan. La nouvelle de l'acceptation s'est malheureusement répandue plus tôt que nous l'aurions souhaité, ce qui a conduit la Turquie à condamner l'accord et à promettre un soutien supplémentaire aux Azéris. Heureusement, la réponse nationale a été largement positive et notre administration a reçu un soutien accru dans les États abritant une importante diaspora arménienne, en particulier en Californie."
 CIA_Karabach.4.desc:0 "Bizarrement, le gouvernement arménien a décliné notre initiative visant à leur fournir une assistance militaire et technique. Les Arméniens ont souligné qu'ils resteraient fidèles à leurs alliés russes et estimaient qu'ils étaient déjà en mesure de vaincre activement leurs opposants azerbaïdjanais. Il s'agit d'un événement décevant, mais ce n'est pas en soi un désastre. Toutefois, si cette offre était divulguée à la Turquie, cela pourrait rapidement se transformer en un tourbillon politique. Pour l'instant, l'influence américaine restera probablement minime dans la région du Caucase, mais nous pouvons toujours nous tourner vers l'avenir et vers d'autres conflits régionaux pour exercer ou renforcer notre influence dans la région, notamment en Géorgie ou par l'intermédiaire de nos alliés turcs."
 CIA_Karabach.5.desc:0 "Alors que nos efforts continuent de renforcer notre influence dans le Caucase, nous devons désormais nous attaquer au problème des oligarques pro-russes. La Central Intelligence Agency, en collaboration avec des agents internationaux chargés de l'application des lois, a secrètement exécuté divers raids contre des éléments pro-russes en Arménie. Plusieurs oligarques pro-russes ont été arrêtés sur la base d'une série d'accusations, et divers agents russes de niveau inférieur ont été liquidés ou capturés. Alors que le sentiment pro-américain continue de croître en Arménie grâce à notre aide dans la guerre en cours, le soutien des partis politiques pro-russes continuera de diminuer et nous aurons enfin une base d'opérations dans la région. Cela dit, il faudra s'efforcer de trouver une solution diplomatique entre Ankara et Erevan."
 CIA_Karabach.6.desc:0 "Alors que le soutien américain continue de faire tourner la guerre en notre faveur, le soutien de notre population à l'Amérique s'est rapidement accru. Cela a permis à notre gouvernement de prendre des mesures contre divers agents russes dans le pays et, en collaboration avec Washington, d'arrêter ou de compromettre d'une autre manière plusieurs oligarques pro-russes de premier plan. Cela a considérablement réduit l'influence russe dans notre pays et a conduit à un approfondissement des liens entre Washington et Erevan. Alors que la Turquie reste un barrage routier, d'autres pays européens, en particulier la France, ont exprimé leur soutien et ont également contribué à notre effort de guerre depuis la révélation de l'aide américaine. Par conséquent, nos relations avec la Russie atteignent leur plus bas niveau et la Russie s'est depuis orientée vers un soutien à l'Azerbaïdjan."
 CIA_Karabach.7.desc:0 "Alors que nous poursuivons nos projets visant à renforcer notre influence en Arménie, une voie majeure pour accroître notre soutien serait de renforcer secrètement l'effort de guerre arménien contre l'Azerbaïdjan. Une façon d'y parvenir serait de fournir des renseignements sur la position et la force des unités militaires azéries dans toute la région du Karabakh et ses environs immédiats. Cela permettrait à l'Arménie de mieux utiliser sa capacité militaire limitée tout en continuant à devoir le gouvernement arménien et l'establishment militaire envers notre gouvernement. Après la conclusion de la réunion actuelle du Conseil de sécurité nationale, nos avions de reconnaissance intensifieront leurs enquêtes dans le Caucase pour commencer à collecter les informations nécessaires à fournir à l'armée arménienne. Cela dit, nous devrons veiller à ce que nos actions ne servent pas à déstabiliser excessivement la région ou à provoquer une transformation du conflit en une guerre régionale plus large, et à empêcher une nouvelle détérioration des liens avec la Turquie."
 CIA_Karabach.8.desc:0 "Excellente nouvelle, les Américains ont commencé à nous fournir des renseignements en temps réel sur les positions militaires azéries dans toute la zone de conflit. Cela fait suite à notre accord de nous aligner davantage sur Washington après avoir accepté une aide militaire. Depuis lors, nos liens avec la Russie se sont considérablement détériorés, cette décision démontre une fois de plus l'engagement de Washington envers notre cause et s'avérera utile dans nos opérations visant à sécuriser les terres arméniennes légitimes. Les politiciens pro-russes et leurs partisans sont également de plus en plus alarmés par nos nouveaux liens avec les États-Unis et pourraient s'avérer problématiques dans un avenir proche et au moins être un sujet à surveiller pendant que nous poursuivons l'effort de guerre."
 CIA_Karabach.10.desc:0 "Après plusieurs jours de débats et de discussions, le Conseil de sécurité nationale a pris la décision de contacter le gouvernement azerbaïdjanais au sujet de la guerre du Karabakh en cours. Les facteurs décisifs dans le choix de l'Azerbaïdjan sont les vastes réserves pétrolières du pays et le fort soutien de la Turquie à la cause azérie. S'engager dans cette voie pourrait aliéner la diaspora arménienne et provoquer certaines tensions avec certains partenaires européens, mais cela profiterait à notre économie ainsi qu'au renforcement de nos liens avec la Turquie et à la lutte contre l'influence iranienne et russe dans la région. Dans les prochains jours, notre ambassadeur en Azerbaïdjan recevra des instructions sur la manière de cultiver des relations plus profondes avec Bakou et d'éviter une nouvelle escalade avec la Russie, étant donné que la nation est historiquement dans sa sphère d'influence."
 CIA_Karabach.11.desc:0 "Une proposition récente lors d'une réunion du Conseil de sécurité nationale est de vendre des armes à prix réduit à l'Azerbaïdjan. Notre ambassadeur à Bakou a été chargé de rencontrer le dirigeant azéri [AZR.GetLeader] pour discuter des conditions de vente potentielles et d'autres moyens par lesquels nous pourrions soutenir l'État azerbaïdjanais. Cela dit, nous devrions chercher à minimiser la publicité de l'événement par crainte de réactions négatives de la part du pays et de l'étranger, en particulier de la part de la communauté de la diaspora arménienne. Déplacer l'Azerbaïdjan vers l'influence occidentale nous fournirait non seulement une base d'opérations dans une région historiquement hostile, mais ouvrirait également la production pétrolière de l'Azerbaïdjan aux marchés occidentaux. En outre, la Turquie a exprimé en privé son fort soutien à cette décision et a indiqué qu'elle pourrait également commencer à fournir une aide supplémentaire."
 CIA_Karabach.12.desc:0 "Comme prévu, le gouvernement azerbaïdjanais a accepté notre offre de vente d'armes à prix réduit. Dans les semaines à venir, des livraisons d'armes lourdes commenceront à arriver à Bakou en provenance de nos centres d'approvisionnement d'Europe occidentale. Les livraisons d'armes devraient permettre à l'armée azerbaïdjanaise de se réformer rapidement et de faire des efforts pour reconquérir le territoire perdu. Même si nous devrons faire connaître cette décision dans une certaine mesure étant donné que l'armement lourd rendra notre implication évidente, nous pouvons nous attendre à ce que le grand public n'accorde probablement pas beaucoup d'importance au conflit. Cependant, la communauté arménienne de la diaspora, principalement en Californie, votera sûrement en masse pour celui à qui elle s'opposera lors des prochaines élections."
 CIA_Karabach.13.desc:0 "Bizarrement, le gouvernement azerbaïdjanais a rejeté notre offre d'achat d'armes à bas prix. Bakou a souligné que, bien que appréciée, cette offre était inutile et que le gouvernement ne souhaitait pas s'endetter davantage, financièrement ou politiquement, auprès de puissances étrangères. Pire encore, des individus pro-russes au sein du gouvernement azerbaïdjanais ont divulgué l'accord proposé à la presse internationale, ce qui a embarrassé notre gouvernement et a également tendu davantage nos liens avec l'Arménie. Nos résultats dans les sondages en Californie en subiront sûrement également un coup. Heureusement, en dehors de la communauté de la diaspora arménienne, le grand public reste largement ambivalent face au conflit."
 CIA_Karabach.14.desc:0 "L'un des aspects de la guerre en cours entre l'Azerbaïdjan et l'Arménie est le conflit ethnique et religieux de longue date dans la région. Compte tenu de notre succès dans la mobilisation de recrues en Afghanistan et dans d'autres régions islamiques, le Conseil national de sécurité (NSC) a autorisé la création d'un programme de recrutement de volontaires étrangers d'autres régions islamiques et turques pour combattre au nom de l'Azerbaïdjan afin de renforcer leurs effectifs dans leur campagne en cours. Compte tenu de nos liens historiques étroits avec les groupes panturanistes en Turquie et ailleurs, les dirigeants et agents locaux de la CIA sont convaincus que des recrues peuvent être rapidement trouvées et transportées en Azerbaïdjan dans les jours et semaines à venir. Des opposants ont toutefois exprimé des inquiétudes quant au fait que cette décision risquerait d'enhardir et d'étendre l'influence des organisations terroristes radicales touranistes et islamistes et pourrait conduire à des complications imprévues à l'avenir."
 CIA_Karabach.15.desc:0 "Excellente nouvelle, les États-Unis ont commencé à utiliser leurs relations parmi les combattants islamistes ainsi que leurs relations en Turquie pour rallier des volontaires étrangers pour qu'ils combattent en notre nom et viennent en Azerbaïdjan. Alors que nous luttons dans notre guerre pour reconquérir nos terres souveraines, c'est un pas bienvenu dans la bonne direction. Cela dit, étant donné notre orientation plus laïque, nous devrons veiller à ce que les nouvelles recrues ne continuent pas à poser des problèmes après la fin de la guerre. En outre, nos forces de sécurité ont exprimé des inquiétudes quant à la possibilité que des agents iraniens infiltrent notre armée et tentent de saper notre gouvernement afin de propager la révolution iranienne ici, en particulier compte tenu des revendications irrédentistes iraniennes sur notre territoire."
 CIA_Karabach.17.desc:0 "Alors que nous poursuivons nos efforts pour renforcer les forces azéries dans la guerre du Karabakh en cours, nous avons intensifié notre campagne visant à saper l'influence russe en Azerbaïdjan dans son ensemble. Au moment où ce mémo est rédigé, les services de sécurité azerbaïdjanais mettent en détention divers oligarques et hommes politiques pro-russes pour diverses accusations basées sur les informations que nous avons fournies à Bakou. Cette décision paralysera effectivement le bloc pro-russe dans l'économie et le gouvernement azerbaïdjanais et nous permettra enfin de prendre véritablement pied dans le Caucase. Alors que diverses fuites médiatiques ont laissé entendre que notre gouvernement soutenait l'Azerbaïdjan dans le conflit en cours, les coûts politiques nationaux ont été minimes et principalement localisés dans des poches de la diaspora arménienne, principalement en Californie."
 CIA_Karabach.18.desc:0 "Garder un oeil sur l'évolution politique à Bakou est une tâche essentielle pour nos services de renseignement compte tenu de la guerre en cours avec l'Azerbaïdjan. Récemment, nous avons reçu des informations selon lesquelles divers hommes d'affaires et hommes politiques pro-russes ont été arrêtés et accusés de toute une série d'accusations. De toute évidence, il semblerait qu'une campagne majeure contre l'influence russe en Azerbaïdjan soit en cours. Cela indique sûrement une nouvelle agression azérie contre notre État et réaffirme notre nécessité de nous lier davantage à la Russie pour protéger notre intégrité territoriale. Même s'il n'existe aucune preuve solide, il existe des preuves circonstancielles que les États-Unis ont commencé à soutenir activement l'Azerbaïdjan, mais cela pourrait être le signe de changements majeurs à venir dans la région à l'avenir."
 CIA_Karabach.16.desc:0 "Au début du conflit en cours dans le Caucase entre l'Arménie et l'Azerbaïdjan, l'administration de {USA.GetLeader] a adopté une position résolument pro-azérie. De nouveaux rapports ont mis en lumière un projet de la Central Intelligence Agency visant à recruter et à déployer des volontaires étrangers en Azerbaïdjan pour lutter contre les forces arméniennes dans la région contestée du Karabakh. Les volontaires sont recrutés à la fois dans des milieux militants islamistes et auprès de sources nationalistes turques, notamment les controversés Loups gris de Turquie. L'Arménie et la Russie ont condamné cette décision, la qualifiant d'attaque contre le christianisme et de trahison des soi-disant « valeurs occidentales ». Les critiques nationales du président ont formulé des critiques similaires et ont souligné la nature autocratique du dirigeant azerbaïdjanais [AZR.GetLeader], mais le président a souligné que l'Arménie est l'agresseur dans le conflit et que l'Azerbaïdjan essaie simplement de préserver son intégrité territoriale."

 CIA_GEO.0.desc:0 "Lors des élections de 1990, la population géorgienne a clairement voté pour un dissident antisoviétique de renom, Zviad Gamsakhourdia, qui l'a remporté avec une large marge. Malheureusement, les troubles se sont rapidement répandus dans tout le pays, en particulier dans l'ancienne nomenklatura soviétique et dans les régions où vivent des minorités ethniques. Alors que la situation continuait à évoluer, les chefs de guerre pro-russes ont lancé un coup d'État, prenant le contrôle de la capitale Tbilissi, ce qui a conduit Gamsakhourdia et ses forces à se réimplanter dans l'ouest du pays. Entre-temps, les séparatistes soutenus par la Russie se sont également soulevés et la région d'Adjarie a effectivement déclaré sa neutralité armée dans le conflit en cours. La situation est encore compliquée par le fait que la région russe séparatiste de Tchétchénie a soutenu les forces de Gamsakhourdia. En ce qui concerne le conflit, Gamsakhourdia serait le plus ouvert à notre influence. Une proposition actuellement examinée par le Conseil national de sécurité implique un soutien potentiel aux forces de Gamsakhourdia, cherchant à l'aider dans sa quête pour restaurer son pouvoir sur la nation. Comment devons-nous procéder ?"
 CIA_GEO.1.desc:0 "Après un long débat au Conseil de sécurité nationale, le président a opté pour la neutralité dans le conflit en cours en Géorgie. Même si l'idéal était d'établir un gouvernement résolument pro-occidental en Géorgie, les risques liés à cette entreprise ont été jugés trop grands pour être risqués. L'accent a été particulièrement mis sur l'instabilité générale en Géorgie, étant donné que les différentes factions s'affrontant les unes contre les autres ainsi que l'ingérence russe dans le conflit pourrait conduire à un conflit ouvert entre Washington et Moscou et condamnerait sûrement toute tentative d'établir des liens cordiaux entre l'Amérique et la Russie. Certains membres du Conseil de sécurité nationale ont néanmoins critiqué cette décision, la considérant comme une trahison des forces libérales dans le Caucase et comme une occasion manquée d'affaiblir l'influence russe dans la région."
 CIA_GEO.2.desc:0 "Le président Gamsakhourdia, président légitime de la Géorgie, est un célèbre militant des droits de l'homme, dissident soviétique et professeur d'anglais. Il est actuellement impliqué dans une lutte contre des séparatistes pro-russes, soutenus par la Russie et des éléments déloyaux au sein de l'armée géorgienne. Même si certains diront que sa cause est pratiquement vouée à l'échec, nos agents du renseignement dans la région ont récemment plaidé avec force en faveur d'une intervention américaine dans le conflit pour soutenir les forces fidèles au président Gamsakhourdia. Plus tôt dans la journée, le président a signé la proposition et l'aide américaine sera rapidement fournie, accompagnée d'une augmentation notable du nombre d'officiers de renseignement déployés dans la région et du déploiement de conseillers militaires en Géorgie. Bien qu'aucune annonce officielle de notre soutien n'ait encore été annoncée, des éléments politiques plus conciliants du pays ont condamné tout soutien potentiel à Gamsakhourdia, le qualifiant de trop intensificateur envers Moscou."
 CIA_GEO.3.desc:0 "Dans une tournure surprenante des événements, de bonnes nouvelles sont arrivées de Washington. Les États-Unis ont décidé de soutenir pleinement nos forces loyalistes dans notre quête pour restaurer la démocratie et l'intégrité territoriale de notre nation. Les livraisons d'armes indispensables arriveront dans les semaines à venir et le déploiement de conseillers militaires américains est également en cours. Compte tenu du soutien russe à nos ennemis, cela pourrait potentiellement inverser notre récente série de pertes et de revers et nous mettre sur la bonne voie pour une contre-offensive contre les marionnettes russes. Depuis que l'annonce a été rendue publique, Moscou et ses courtisans locaux ont qualifié cette décision d'escalade et prétendent que nous ne sommes devenus guère plus qu'une marionnette américaine. Nous devons néanmoins continuer à nouer des liens avec les forces tchétchènes au nord dans notre cause commune contre la présence russe dans le Caucase."
 CIA_GEO.4.desc:0 "Aslan Abashidze est le chef de la République autonome d'Adjarie, une région stratégiquement critique de la Géorgie, située à la frontière de la Turquie, dans le sud-ouest de la Géorgie. Le Traité de Kars, signé en 1921 par la Turquie et l'Union soviétique, garantissait les droits de la population musulmane dans l'autonomie de l'Adjarie ; les gouvernements des États successeurs de l'Union soviétique ont également ratifié cet accord, ce qui a permis le maintien d'une partie fortement autonome de la Géorgie. Jusqu'à présent, Abashidze est resté fermement neutre dans le conflit en cours, et s'impliquer au nom de l'une ou l'autre des parties pourrait être essentiel pour faire pencher la balance de la guerre civile d'un côté ou de l'autre. Nos agents de renseignement dans la région ont élaboré deux propositions pour remédier à la situation. Le premier plan d'action présenté consiste à offrir à Abashidze un pot-de-vin important pour s'impliquer dans le conflit, le deuxième plan consiste à organiser un assassinat contre Abashidze et à l'imputer aux éléments pro-russes d'Adjarie. Comment devons-nous procéder ?"
 CIA_GEO.7.desc:0 "Une offre intéressante est arrivée plus tôt dans la journée, sans révéler ouvertement leurs liens, l'agent était clairement affilié à la Central Intelligence Agency. L'offre fournie par l'agent indiquait que les États-Unis verseraient personnellement une somme d'argent importante à notre dirigeant ainsi qu'une aide au développement d'Ajara en échange de l'entrée dans la guerre civile en cours au nom des loyalistes de Gamsakhourdia. Jusqu'à présent, notre région est restée neutre dans la guerre civile en cours, mais cette offre bénéficierait considérablement à nos dirigeants et à notre région. D'un autre côté, l'opposition à Gamsakhourdia est soutenue par la Russie et entrer dans la guerre civile susciterait sûrement leur colère. Dans cet esprit, comment devrions-nous procéder ?"
 CIA_GEO.8.desc:0 "Excellente nouvelle, Aslan Abashidze a accepté le pot-de-vin proposé et a annoncé son soutien à Gamsakhourdia. Alors que les Russes et l'opposition alignée sur la Russie ont condamné cette décision comme un cas flagrant de corruption, cette décision donne un élan significatif aux forces loyalistes de Gamsakhourdia et pourrait contribuer à renforcer leurs effectifs à temps pour une future contre-offensive visant à chasser les rebelles et les séparatistes pro-russes qui sévissent dans le pays. Cependant, des inquiétudes ont été exprimées quant aux violences ethniques et religieuses potentielles qui pourraient être infligées à la région si les forces alignées sur la Russie parvenaient à y pénétrer et nous devrions établir des plans pour éviter une situation embarrassante pour l'administration si le pire devait arriver."
 CIA_GEO.9.desc:0 "Malheureusement, Aslan Abashidze a rejeté notre proposition. Bien que l'offre soit restée confidentielle, Abashidze a rétorqué qu'entrer dans le conflit serait trop risqué pour lui-même et pour l'Adjarie dans son ensemble. Il a noté que des violences ethniques et religieuses pourraient être perpétrées contre son peuple si Gamsakhourdia ne parvenait finalement pas à consolider son contrôle sur la Géorgie et que l'autonomie accordée à la région pourrait prendre fin, ce qui pourrait conduire à une escalade encore plus grande de la part de la Turquie en cas de rupture du Traité de Kars. Bien que malheureuse, cette réaction n'est pas inattendue, mais faire entendre raison à Abashidze a toujours été un long chemin et, au moins, la région restera neutre de toute évidence dans un avenir prévisible. Nous devrons chercher d'autres moyens de renforcer les forces loyalistes de Gamsakhourdia pour garantir que la Russie ne contrôlera pas à nouveau totalement le Caucase."
 CIA_GEO.10.desc:0 "Excellente nouvelle, la République autonome d'Adjarie a mis fin à sa politique de neutralité dans notre guerre civile en cours et a annoncé son soutien à notre cause. Bien qu'elle ne soit pas la région la plus grande ni la plus peuplée, ce changement de soutien nous confère un degré important de légitimité et sera toujours en mesure de nous fournir une quantité décente de main-d'oeuvre. Peut-être plus important encore, cette décision nous accordera un point d'accès incontesté à la Turquie, ce qui nous fournirait un point d'accès clair pour une aide occidentale supplémentaire. Pourtant, le combat continue et nous devrons également veiller à ce que les forces d'opposition ne tentent pas de prendre le contrôle de l'Adjarie et devront rendre des comptes à Abashidze dans une Géorgie d'après-guerre."
 CIA_GEO.12.desc:0 "Depuis la chute de l'Union soviétique, des troubles notables ont éclaté dans les républiques ethniques de Russie. Dans cet esprit, le Conseil de sécurité nationale a approuvé un plan d'action proposé par la CIA pour commencer à financer des mouvements anti-russes en Kalmoukie. La Kalmoukie est unique en ce sens que, contrairement au reste de la Russie, elle est majoritairement bouddhiste et mongole, avec une population descendant des Mongols Oirat qui ont émigré dans la région des siècles auparavant. Compte tenu de l'emplacement de la région près du Caucase et le long de la mer Caspienne, nos agents devraient être en mesure d'infiltrer facilement la région et de contacter les mouvements locaux pour trouver des organisations à soutenir ou, dans le pire des cas, trouver des locaux anti-russes avec lesquels créer des organisations. Nos agents approcheront également la petite communauté de la diaspora pour rechercher davantage de figures de proue potentielles d'un mouvement indépendantiste pour la région. "
 CIA_GEO.13.desc:0 "Afin d'affaiblir davantage l'influence russe dans la région et de siphonner une plus grande partie de son armée, la décision a été prise d'accroître notre soutien aux mouvements islamistes tchétchènes et daghestanais en Russie. Étant donné le conflit en cours dans ces régions, toute aide meurtrière supplémentaire aux rebelles nuirait clairement directement à la Russie et nécessiterait probablement une présence militaire russe plus importante s'ils souhaitent empêcher le Daghestan de suivre pleinement les traces de la Tchétchénie voisine. Cela dit, cela n'a pas été décidé sans son lot de détracteurs. Nos contacts avec les États arabes rechercheront également des bailleurs de fonds potentiels pour permettre aux mouvements islamistes de ces régions de solliciter une aide financière et armée supplémentaire. Les critiques au sein de l'administration ont fait valoir que cette décision était trop escalade et qu'en soutenant ces mouvements, nous armions effectivement des terroristes qui pourraient se retourner contre nous à l'avenir. Mais pour l'instant, les islamistes du Daghestan et de Tchétchénie sont nos alliés de commodité, des combattants de la liberté contre la tyrannie russe."
 CIA_GEO.14.desc:0 "Malgré tous nos efforts, la guerre civile géorgienne est au point mort et la Géorgie a été divisée de plusieurs manières. L'Ossétie du Sud et l'Abkhazie ont déclaré leur indépendance, les forces fidèles à Zviad Gamsakhourdia détiennent une partie importante du territoire du pays, une autre partie de la Géorgie est détenue par l'opposition pro-russe, puis l'Ajara, autrefois neutre, a également déclaré son indépendance suite à l'incapacité des deux camps à mettre fin de manière décisive à la guerre civile. Bien que malheureuse, cette situation reste pour nous plus avantageuse que la victoire pure et simple de l'opposition pro-russe dans la guerre civile. Le chaos dans la région a contribué à affaiblir les opérations russes en Tchétchénie et a contribué à la détérioration de la situation de la Russie au Daghestan. Personne ne peut deviner comment cette situation évoluera dans les années à venir."
 CIA_GEO.15.desc:0 "À la surprise de la communauté internationale, les forces loyalistes de Zviad Gamsakhourdia ont réussi à triompher de la guerre civile en cours, réussissant même à vaincre les forces sécessionnistes en Ossétie du Sud et en Abkhazie. Il s'agit d'une victoire majeure pour notre administration et d'une défaite catastrophique pour la Russie, surtout compte tenu de l'instabilité croissante au Daghestan et en Kalmoukie et de l'incapacité persistante des forces russes à reprendre la Tchétchénie. Alors que la Russie continue de condamner nos actions en Géorgie et de prétendre que nous soutenons les sécessionnistes qui tourmentent la Russie dans le Caucase en ce moment, il semble que la Russie ne puisse pas faire grand-chose pour riposter pour le moment et un soutien supplémentaire à ces causes contribuera sûrement à paralyser la capacité de la Russie à faire la guerre et à projeter son influence. Des débats devront avoir lieu prochainement sur le rôle que nous jouerons dans la reconstruction de la Géorgie et sur l'éventuelle expansion de l'OTAN dans le Caucase."
 CIA_GEO.16.desc:0 "Avec la victoire des forces alignées sur Gamsakhourdia dans la guerre civile géorgienne, nous disposons désormais d'une nation potentiellement fiable pour baser nos opérations dans le Caucase. Aujourd'hui, le débat au Conseil de sécurité nationale est de savoir si nous devrions ou non élargir drastiquement notre offre d'aide militaire à la Géorgie, en particulier si nous devrions lui permettre d'acquérir des avions de fabrication américaine et des armes plus lourdes, comme des chars et de l'artillerie. En outre, des propositions ont été avancées pour fournir une aide économique afin de contribuer à stabiliser la Géorgie au lendemain de la brutale guerre civile. Malheureusement, il est peu probable que le Congrès soit satisfait des nouvelles demandes de dépenses, même si le projet de loi finirait par être adopté, fournir une aide importante coûterait sûrement à notre administration une certaine quantité de capital politique, comment devrions-nous procéder ?"
 CIA_GEO.17.desc:0 "Après la victoire des forces occidentales sous Gamsakhourdia, nous avons, après mûre réflexion avec nos principaux partenaires de l'OTAN, décidé d'inviter la Géorgie à l'OTAN. Alors que la Russie et les courtisans pro-russes de toute l'Europe dénonceront cette décision comme une violation de la souveraineté russe et des accords informels préalables à l'expansion de l'OTAN, l'intervention russe en Géorgie et la lutte pour une Géorgie démocratique ont clairement démontré la nécessité de l'implication de l'OTAN dans l'ex-Union soviétique pour préserver les gouvernements démocratiques de la tyrannie russe. Même si le vote sur leur ascension n'a pas encore commencé, le Département d'État ne pense pas qu'il existe actuellement une opposition sérieuse de la part des autres membres de l'OTAN. Des inquiétudes ont été exprimées quant à une éventuelle escalade russe sur d'autres théâtres suite à cette décision, mais nos responsables de l'État et de la Défense ne croient pas que la Russie ait la pleine capacité d'une escalade appropriée étant donné les troubles en Russie et la guerre en Tchétchénie en cours."
 CIA_GEO.5.desc:0 "Aslan Abashidze, le dirigeant de la République autonome d'Adjarie dans l'ouest de la Géorgie, a été assassiné plus tôt dans la journée. L'agresseur, qui a été arrêté, serait un Russe vivant en Adjarie, mécontent de la position de neutralité d'Abashidze dans la guerre civile géorgienne en cours entre le gouvernement militaire de Tbilissi et les forces fidèles au président récemment déchu, Zviad Gamsakhourdia. Les analystes estiment que cette décision obligera l'Ajara à finalement s'impliquer dans la guerre civile du pays et à se ranger du côté des zviadistes. Cela pourrait représenter un changement de pouvoir majeur dans la guerre civile en cours et serait une aubaine pour la cause zviadiste. Pendant ce temps, des personnalités pro-russes ont affirmé qu'elles n'avaient aucune part à l'assassinat et ont accusé la Central Intelligence Agency (CIA) d'avoir orchestré le complot. Ces affirmations ont été largement ridiculisées dans tout l'Occident, y compris dans un sketch diffusé dans l'émission américaine de sketchs humoristiques de fin de soirée, Saturday Night Live."
 CIA_GEO.6.desc:0 "Plus tôt dans la journée, un assassin potentiel a tenté de tuer Aslan Abashidze, le chef de la République autonome d'Adjarie dans l'ouest de la Géorgie. L'agresseur a été rapidement capturé et ses motivations n'ont pas encore été pleinement établies. Cependant, un représentant d'Abashidze a imputé cette action à la Central Intelligence Agency et aux forces de Gamsakhourdia et s'est engagé à reconsidérer la position d'Ajara dans la guerre civile en cours. Jusqu'à présent, la région d'Ajaran sous Abashidze a maintenu les forces du gouvernement militaire pro-russe et du gouvernement en exil de Gamsakhourdia hors d'Ajara, mais la région autonome pourrait rassembler suffisamment de forces pour potentiellement faire pencher la balance de la guerre en faveur de l'un ou l'autre camp. Washington et Gamsakhourdia ont nié toute implication dans l'attaque et ont affirmé que le tireur était un Russe de souche allié à l'opposition. Le temps nous dira si cela entraînera la chute des forces de Gamsakhourdia ou si cela maintiendra simplement le statu quo actuel dans la région."
 CIA_GEO.11.desc:0 "Dans un geste surprenant, Aslan Abashidze, le chef de la République autonome d'Adjarie dans l'ouest de la Géorgie, a annoncé son intention de rompre la neutralité de l'Adjarie et de se prononcer en faveur du gouvernement en exil. Cela constitue une surprise majeure étant donné les efforts de longue date d'Abashidze pour maintenir l'Adjarie à l'écart de la guerre civile. La guerre civile géorgienne en cours a été remarquée pour sa brutalité entre les forces du gouvernement de Tbilissi et celles de l'opposition soutenue par la Russie. Des effectifs supplémentaires et le soutien de l'Adjarie pourraient inverser le cours du conflit en faveur du gouvernement et représenter un revers majeur pour les forces d'opposition. Les critiques d'Abashidze affirment que la Central Intelligence Agency a soudoyé Abashidze, soulignant de nombreux vols américains récents vers Batoumi. Cependant, les États-Unis ont nié ces affirmations et ont souligné que les transports fournissaient simplement une aide militaire et humanitaire indispensable à la région pauvre de Géorgie."
 
 CIA_ETH.0.desc:0 "Depuis la chute de la monarchie éthiopienne en 1974, l'Éthiopie est en proie à la violence et à une guerre civile aux multiples facettes. La violence, la famine qui en a résulté et le conflit en cours en Érythrée ont coûté des centaines de milliers de vies et déplacé des millions de personnes. La guerre civile continue de faire rage, désormais entre la junte militaire communiste au pouvoir, le Front populaire de libération du Tigré (TPLF) communiste et leurs alliés et une poignée de groupes militants sécessionnistes et autres idéologiques. Aucune des deux principales factions n'est favorable à nos intérêts, en particulier le gouvernement actuel soutenu par Moscou et La Havane. Cela nous laisse plusieurs options : premièrement, nous pourrions simplement continuer à observer la situation et envisager des actions plus tard, une deuxième option serait de rechercher le dialogue avec le TPLF et de voir si des avancées pourraient être faites pour l'orienter vers une orientation plus pro-occidentale. Une autre option, principalement évoquée par ceux liés à la Heritage Foundation, consiste à trouver des personnes disposées dans la diaspora ou dans l'ancienne noblesse à rallier les éléments conservateurs de la nation à un nouveau camp dans le conflit."
 CIA_ETH.1.desc:0 "Malheureusement, les forces conservatrices en Éthiopie ont largement faibli et sont devenues de moins en moins pertinentes ces dernières années. Entre cela et les principales factions de la guerre civile en cours qui sont toutes deux idéologiquement marxistes, le Conseil de sécurité nationale a décidé de limiter nos activités à la seule collecte de renseignements dans un avenir prévisible, à moins de changements notables dans la Corne de l'Afrique. Tout en évitant de nous impliquer dans l'une des factions de la guerre civile éthiopienne ou de la lutte pour l'indépendance de l'Érythrée, une proposition a été lancée visant à continuer d'intensifier notre soutien à la Somalie et à tenter d'utiliser la Somalie comme mandataire dans la région pour déstabiliser davantage l'Éthiopie. Malheureusement, cette décision de limiter nos activités a été critiquée par certains médias, notamment ceux affiliés à la Heritage Foundation et d'autres qui prônent une action plus décisive pour chasser le communisme de la Corne de l'Afrique."
 CIA_ETH.2.desc:0 "La Heritage Foundation, parmi d'autres organisations politiques anticommunistes, plaide depuis longtemps en faveur d'une action plus ferme dans la Corne de l'Afrique pour faire reculer le communisme. L'échec des forces contre-révolutionnaires à la fin des années 1970 a porté préjudice à la poursuite des actions dans la région. Cependant, les organisations anticommunistes sont répandues au sein de la diaspora, notamment l'Alliance démocratique du peuple éthiopien (EPDA) dirigée par les frères Deressa. La Heritage Foundation et d'autres partisans de la ligne dure ont fait pression pour que l'administration commence à investir dans ce groupe en vue d'ouvrir une nouvelle lutte anticommuniste dans la Corne de l'Afrique. Alors que les élus continuent d'annoncer leur soutien et de faire pression auprès de nous en faveur de ces « Contras éthiopiens ». D'un autre côté, les critiques ont affirmé que ce projet avait peu de preuves d'un quelconque soutien populaire en Éthiopie et a été décrit comme trop optimiste."
 CIA_ETH.3.desc:0 "Après le renversement de l'empereur Hailé Sélassié, le prince héritier Asfaw Wossen et plusieurs autres membres de la cour et de la maison impériale ont fui à l'étranger, principalement à Londres et à Washington DC. Ras Mengesha Seyoum, prince héréditaire du Tigré et chef d'une branche cadette de la dynastie, leader de l'Union démocratique éthiopienne (EDU) et possible prétendant au trône éthiopien, s'est lui aussi récemment exilé suite aux échecs militaires de l'EDU. Pour gagner en légitimité nos nouveaux projets éthiopiens, nous devons nous rapprocher du prince héritier Asfaw et de Ras Mengesha Seyoum et gagner leurs faveurs. Idéalement, nous devons dialoguer avec les deux factions monarchistes avant de tenter d'obtenir le soutien des éléments conservateurs résidant toujours en Éthiopie. Une fois que nous aurons finalisé les accords avec la maison impériale, la CIA commencera à insérer des agents chevronnés ainsi que des agents recrutés parmi la diaspora."
 CIA_ETH.4.desc:0 "Avec le soutien de la maison impériale et de diverses organisations de la diaspora, la Central Intelligence Agency a commencé à insérer des agents et des agents dans les régions rurales des hauts plateaux éthiopiens. Nos agents, tous deux officiers du renseignement de carrière, et plusieurs recrutés dans la diaspora, prendront contact avec des personnalités locales de premier plan, telles que des propriétaires terriens, le clergé et les autorités traditionnelles des villages, pour chercher à recruter des collaborateurs et des membres potentiels pour la branche armée de l'Alliance démocratique du peuple éthiopien. Une attention particulière a été accordée à éviter tout contact avec des groupes ethniques plus hostiles ainsi qu'à éviter complètement l'Érythrée, étant donné la guerre d'indépendance en cours dans ce pays contre le gouvernement central et, avant cela, contre la monarchie. Des camps d'entraînement ont également été établis au Soudan voisin parmi la population réfugiée afin de recruter davantage de combattants potentiels et de servir de base d'intervention."
 CIA_ETH.5.desc:0 "L'Église orthodoxe éthiopienne Tewahedo, la plus ancienne Église continue d'Afrique subsaharienne, fondée au début des années 300, constitue un aspect majeur de la vie éthiopienne et autrefois un pilier majeur de soutien à la monarchie éthiopienne. Alors que le Derg s'est efforcé de retirer d'éminents anticommunistes des postes dirigeants du clergé, de nombreux religieux conservateurs pratiquent toujours librement, en particulier dans les zones rurales d'Éthiopie. Nos agents rallieront le clergé en révélant tous les détails de la mort d'Abuna Theophilos, le deuxième patriarche de l'Église, qui a été secrètement exécuté pendant son emprisonnement à la fin de 1979. Nos agents, à l'intérieur et à l'extérieur de l'Éthiopie, lanceront également une campagne de propagande sur sa mort pour délégitimer davantage le gouvernement du Derg, tout en déstabilisant les dirigeants nommés par le Derg actuellement en charge de l'Église."
 CIA_ETH.6.desc:0 "Les forces réactionnaires de notre pays sont restées largement silencieuses depuis l'échec de l'offensive de l'Union démocratique éthiopienne (EDU) contre Gondar à la fin des années 1970. Malheureusement, cela ne semble plus être le cas. Nos agents de renseignement nous ont récemment informés d'une dissidence croissante notable de la population à l'égard de notre régime, sous l'impulsion du clergé dans toutes nos zones centrales. Alors que l'EDU a été en grande partie poussée à l'exil et que d'autres groupes réactionnaires marginaux ont une présence limitée en ce moment de notre guerre civile, il existe des indicateurs croissants d'un enthousiasme renouvelé pour une restauration de la monarchie et d'un ressentiment rural envers notre gouvernement. Bien qu'alarmante, cette évolution présente des avantages. Des troubles similaires ont été observés dans les territoires contrôlés par le Front populaire de libération du Tigré (TPLF). Un mécontentement et une dissidence accrus au sein des rangs de l'opposition pourraient nous donner un avantage dans la guerre civile en cours si les mesures appropriées sont prises."
 CIA_ETH.7.desc:0 "Avec le soutien de la maison impériale officiellement établie, nos agents sur le terrain ont commencé à travailler à l'intégration des restes de l'Union démocratique éthiopienne (EDU) monarchiste dans l'Alliance démocratique du peuple éthiopien (EPDA). Une fois cette opération terminée, nous commencerons à organiser des unités paramilitaires formelles, tant en Éthiopie qu'au Soudan, parmi la population réfugiée. Cela se déroulera en préparation d'une nouvelle incursion des forces conservatrices contre le Front populaire de libération du Tigré et le gouvernement du Derg dans le but de s'emparer de Gondar, la capitale de la province de Begmender et officiellement une zone de soutien à l'EDU étant donné le nombre de loyalistes à Ras Mengesha Seyoum dans la province. Malheureusement, le Derg et l'opposition communiste ont pris conscience de notre présence renouvelée dans la région et ont peut-être commencé à préparer une future incursion contre leurs forces. Heureusement, les deux parties ne montrent aucune avancée vers la réconciliation, bien qu'elles soient toutes deux communistes."
 CIA_ETH.8.desc:0 "Les dernières années n'ont pas été favorables à notre cause. Même si nous avons obtenu des gains initiaux contre la junte, notre échec à sécuriser un quelconque centre urbain majeur a conduit à un déclin rapide de nos effectifs et de nos forces combattantes. Cependant, la direction de Ras Mengesha Seyoum continue de conférer à notre groupe une légitimité générale. De plus, l'opposition marxiste au DERG a contribué à repousser nos forces hors de la majeure partie de l'Éthiopie. Cependant, les États-Unis ont contacté nos dirigeants en exil et ont décidé de contribuer à notre réorganisation en collaboration avec l'Alliance démocratique du peuple éthiopien dirigée par les frères Deressa. Cette réorganisation établira fermement une doctrine politique formelle pour le mouvement démocratique réformé en Éthiopie et sera fortement soutenue, tant politiquement que militairement, par Washington. Même si cela nécessitera un compromis avec les sociétés étrangères et les intérêts américains, c'est de loin notre meilleure chance de mettre fin au régime communiste en Éthiopie et de permettre à nos forces de retourner en Éthiopie."
 CIA_ETH.9.desc:0 "Sans surprise pour beaucoup, les récents troubles croissants au sein des éléments les plus conservateurs de notre société et la recrudescence de la violence dans les zones rurales des hautes terres ont été suivis d'une incursion formelle de l'Alliance démocratique du peuple éthiopien (EPDA), qui constitue désormais également les restes de l'Union démocratique éthiopienne et le soutien de la communauté de la diaspora et certainement de Washington. Pire encore, les États-Unis ont lancé une campagne de bombardements contre nos forces militaires, ainsi que contre les forces du Front démocratique révolutionnaire du peuple éthiopien (EPDRF). Cela a encore plongé la guerre civile en cours dans un chaos total, alors que le conflit se transforme désormais en une lutte multiforme entre notre gouvernement, l'EPRDF, d'autres sécessionnistes ethniques et maintenant les forces réactionnaires revitalisées. Pourtant, même si l'EPDA a réussi à s'implanter en Éthiopie, on ne sait pas exactement quel est le soutien public dont bénéficie le mouvement ni comment il va affronter les autres factions de la guerre civile."
 CIA_ETH.11.desc:0 "Plus tôt dans la journée, nos contacts au sein de l'Alliance démocratique du peuple éthiopien (EPDA) ont rapporté qu'Addis-Abeba était finalement tombée aux mains des forces anti-régime. La chute du Derg représente un moment décisif pour notre politique de retour en arrière. Finalement, un État communiste est tombé aux mains des rebelles soutenus par l'Occident en Afrique. L'EPDA s'est fermement engagée en faveur de la restauration de la monarchie éthiopienne, mais le demandeur exact de cette restauration étant donné la direction de l'Union démocratique éthiopienne et l'exil de divers membres de la famille impériale n'a pas encore été déterminé. De plus, la manière dont le pouvoir sera réparti entre l'Église, la monarchie et le nouveau gouvernement civil devra également être délibérée, tout comme l'élimination des autres groupes marxistes en Éthiopie. Cela dit, il s'agit d'une justification massive de la politique de notre administration et cela se reflétera sûrement dans les sondages à venir."
 CIA_ETH.12.desc:0 "Le Front démocratique révolutionnaire du peuple éthiopien (EPRDF) est la principale force d'opposition au gouvernement du Derg en Éthiopie. L'EPRDF est une alliance de quatre partis, le Front populaire de libération du Tigré (TPLF). Mouvement démocratique du peuple éthiopien du sud (SEPDM), Organisation démocratique du peuple oromo (OPDO) et Mouvement démocratique national Amhara (ANDM). Bien qu'ils soient d'orientation marxiste, ils combattent le gouvernement communiste, soutenu par Moscou et La Havane. Compte tenu de leur opposition à un gouvernement soutenu par Moscou, le président a autorisé la Central Intelligence Agency à chercher à établir des contacts avec l'EPRDF, à établir des liens formels avec l'organisation et à présenter une liste de concessions qui pourraient être acceptées en échange de notre soutien dans leur guerre en cours contre le gouvernement. Cela nécessiterait bien sûr que l'EPRDF fasse preuve de modération politique et fasse diverses concessions sur ce à quoi ressemblera un État éthiopien d'après-guerre, mais cela leur fournirait assurément une aide matérielle et humanitaire importante."
 CIA_ETH.13.desc:0 "Étonnamment, nous avons été approchés par les Américains. L'agent, qui appartiendrait apparemment à la Central Intelligence Agency, nous a informés que Washington était ouvert à discuter des conditions de soutien à notre mouvement en échange de concessions. En échange de concessions, nous recevrions une aide humanitaire considérable ainsi qu'une aide militaire, pouvant aller jusqu'à des armes lourdes et même une campagne aérienne contre le gouvernement central. Cependant, nous serions tenus de faire preuve de modération politique et de nous engager à dialoguer avec des éléments plus conservateurs en Éthiopie. Nous serions également obligés de nous aligner sur l'Occident et de réévaluer notre position à l'égard de l'Érythrée une fois le Derg renversé. Cela dit, nous avons été informés que nos intentions pour une Éthiopie plus fédérale sont conformes aux attentes américaines. L'accepter freinerait sûrement notre flanc et nos objectifs les plus à gauche, mais pourrait mettre un terme plus rapide aux souffrances de notre peuple et mettre fin au gouvernement Derg. Comment devons-nous procéder ?"
 CIA_ETH.14.desc:0 "Malheureusement, le Front démocratique révolutionnaire du peuple éthiopien (EPRDF) a rejeté nos conditions et nos efforts de sensibilisation. Avec cette décision, nos efforts en Éthiopie prennent effectivement fin. Il n'y a aucune autre faction majeure dans la guerre, les forces conservatrices et monarchistes ont été militairement vaincues depuis longtemps et il y a peu de marge pour créer une nouvelle force armée étant donné la situation actuelle sur le terrain. Bien que malheureux, l'EPRDF ne semble pas croire qu'il a besoin de notre soutien conditionnel pour vaincre le Derg et que toute concession qui nous serait faite serait préjudiciable à son avenir dans une Éthiopie d'après-guerre. Il est peut-être temps de redoubler d'efforts pour sécuriser la Somalie. Alternativement, certains membres du Conseil national de sécurité ont proposé de tendre la main aux rebelles érythréens ou de nouer des liens plus profonds avec le Soudan, même si notre politique actuelle en faveur de l'Éthiopie s'est soldée par un échec complet."
 CIA_ETH.15.desc:0 "Le Front démocratique révolutionnaire du peuple éthiopien (EPRDF) a accepté de faire des concessions en échange de notre soutien. C'est une excellente nouvelle pour les récents changements de politique de notre administration à l'égard de la Corne de l'Afrique. Avec un accord en main, nous pouvons désormais commencer à fournir une aide humanitaire et des livraisons limitées d'armes. Le ministère de la Défense va maintenant commencer à préparer des propositions pour des programmes d'aide plus importants dans un avenir proche qui seront débattus au sein du Conseil de sécurité nationale. Alors que les Soviétiques et Cuba soutiennent toujours le Derg, nous pouvons désormais ouvrir un nouveau front par procuration contre Moscou via l'Éthiopie, drainant ainsi davantage les ressources communistes dans la région. Même si la victoire est loin d'être assurée, l'instabilité du gouvernement central et la montée des troubles publics en Éthiopie, ainsi que la guerre en Érythrée, contribueront sûrement à affaiblir le Derg et, à terme, à conduire à son effondrement."
 CIA_ETH.16.desc:0 "Une excellente nouvelle est arrivée : suite à notre accord avec Washington, des armes lourdes ont maintenant commencé à arriver pour nos combattants. Cela s'ajoute à l'aide militaire et humanitaire initiale fournie précédemment. En particulier, l'artillerie, les armes légères modernes, les munitions et les armes antichar et antiaériennes sont toutes arrivées récemment et déployées sur le front. Nous espérons que cette augmentation des équipements modernes permettra à nos forces de contrer l'aviation et les chars fournis par les Soviétiques à l'Éthiopie et d'infliger des pertes plus importantes aux forces gouvernementales. Bien que les chars et autres équipements mécanisés ne soient pas encore arrivés, les Américains ont noté le potentiel que cela se produise également à l'avenir en fonction de l'efficacité avec laquelle nos forces peuvent utiliser ce qui a été envoyé jusqu'à présent."
 CIA_ETH.18.desc:0 "Maintenant que la guerre touche à sa fin, nous devons décider de la manière dont nous allons avancer dans la reconstruction de l'Éthiopie. Depuis le premier coup d'État au début des années 1970, l'Éthiopie a connu une invasion étrangère, une lutte pour l'indépendance avec l'Érythrée, une longue guerre civile et une famine importante qui ont dévasté la nation. En gardant cela à l'esprit, nous avons la possibilité de fournir une aide économique significative au nouveau régime, mais cela serait assez coûteux à réaliser dans son intégralité et pourrait s'avérer difficile à convaincre au Congrès. Alternativement, nous pourrions utiliser nos nouvelles relations au sein du gouvernement éthiopien pour encourager les investissements des entreprises dans le pays, ce qui minimiserait nos coûts initiaux et renforcerait notre soutien des entreprises lors des prochaines élections. Cela dit, cette décision pourrait détériorer la bonne volonté que nous avons créée en Éthiopie en mettant fin à la guerre civile. Comment devons-nous procéder ?"
 CIA_ETH.19.desc:0 "Excellente nouvelle, les Américains ont tenu parole et ont entamé des efforts importants pour stabiliser notre nouveau gouvernement. L'aide humanitaire a augmenté de façon exponentielle, atténuant les pires symptômes de la famine du début de la décennie. Des conseillers techniques sont également arrivés, aidant à établir des contrats avec des entreprises occidentales pour des projets d'infrastructures, notamment des barrages et des canaux pour renforcer notre secteur agricole, mais aussi pour contribuer à des projets de prospection minière et d'industrialisation. Une grande attention a également été accordée aux projets de barrages hydroélectriques sur le Nil, alors que dans le passé cela aurait été impossible en raison des pressions étrangères de l'Égypte et du Soudan, de notre alignement avec les États-Unis et des investisseurs occidentaux qui ont rendu cela potentiellement possible. Dans l'ensemble, alors que l'influence des entreprises américaines va se faire sentir dans les années à venir, la nation commence à guérir, et la voie vers une Éthiopie stable et prospère, quelque chose d'impossible à imaginer il y a quelques années, pourrait bientôt être en route."
 CIA_ETH.20.desc:0 "Maintenant que nous avons pleinement établi des relations avec l'opposition et que nous sommes parvenus à un accord sur le soutien et le cadre d'un futur gouvernement d'après-guerre, le moment est venu d'agir contre le gouvernement central. Le ministère de la Défense a élaboré un plan pour lancer des frappes aériennes contre les forces gouvernementales à partir de nos bases dans la région et du groupe aéronaval qui les accompagne. L'objectif est de paralyser les équipements blindés et mécanisés, les dépôts de carburant, les moyens aériens et les forces d'élite du gouvernement. Compte tenu de la pression croissante exercée sur les forces gouvernementales, l'objectif est de paralyser leur capacité à mener des actions militaires conventionnelles soutenues, ainsi que de dégrader les défenses devant les principales villes tenues par le gouvernement, en particulier la capitale Addis-Abeba. Compte tenu de la durée de la guerre et des problèmes croissants d'équipement de l'armée éthiopienne, le risque pour nos pilotes et les autres forces participantes est minime."
 
 CIA_ERITREA.0.desc:0 "Avec la chute du Derg et notre soutien au camp victorieux, nous devons maintenant déterminer comment procéder dans les autres conflits en Éthiopie. Le principal problème à ce stade est le mouvement indépendantiste en cours en Érythrée. Le conflit en Érythrée précède la montée du Derg et la guerre civile en Éthiopie. Cependant, la guerre civile et l'instabilité des années Derg ont permis au Front populaire de libération de l'Érythrée (EPLF) de mener une guerre d'usure plus vaste et de prendre le contrôle de vastes étendues des hauts plateaux érythréens. Alors qu'au départ les rebelles contre le Derg coopéraient tacitement avec le FPLE, maintenant que le Derg est tombé, des tensions sont montées sur la question de savoir si le nouveau gouvernement doit ou non accepter l'indépendance de l'Érythrée ou mener une nouvelle guerre pour conserver l'Érythrée.\n\nSe ranger du côté de l'Éthiopie renforcerait sûrement davantage nos liens diplomatiques avec le nouveau gouvernement éthiopien, mais exigerait également que notre gouvernement augmente son soutien matériel et financier à Addis-Abeba afin qu'une telle guerre puisse être menée. Alternativement, nous pourrions faire pression sur le nouveau gouvernement pour qu'il accepte la souveraineté érythréenne. Cette démarche contribuerait à montrer notre détermination en faveur de la cause de l'autodétermination, mais pourrait affaiblir le nouveau gouvernement et permettre une influence soviétique renouvelée en mer Rouge. Comment devons-nous procéder ?"
 CIA_ERITREA.1.desc:0 "Après d'importants débats au sein du National Security Council (NSC), le président a décidé de soutenir l'Ethiopie si elle souhaite reprendre le contrôle de l'Erythrée. Le Front populaire de libération de l'Érythrée (EPLF) communiste et ses précurseurs mènent une guerre d'indépendance contre Addis-Abeba depuis des décennies, avant même la montée du Derg dans les années 1970. Cependant, l'instabilité due à la guerre civile et à la terreur rouge a permis au FLPE de contester la majeure partie de l'Érythrée et de consolider son contrôle sur de vastes pans de cette province séparatiste. Les dissidents au sein du NSC ont fait valoir que restaurer le contrôle éthiopien sur la région coûterait trop cher pour en valoir la peine pour notre gouvernement et risquait également de provoquer une crise humanitaire plus grave dans la région. Cependant, le président a décidé que les avantages d'une Éthiopie unifiée et d'une suppression totale de l'influence soviétique de la rive africaine de la mer Rouge en valaient la peine. Dans les prochains jours, notre ambassadeur en Éthiopie rencontrera le gouvernement intérimaire pour exposer notre position sur le sort de l'Érythrée."
 CIA_ERITREA.2.desc:0 "Après d'importants débats au sein du Conseil national de sécurité, le président a décidé de faire pression sur l'Éthiopie pour qu'elle permette à l'Érythrée de se libérer. Même si la préservation de l'intégrité territoriale de l'Éthiopie, surtout si elle est dirigée par un gouvernement pro-occidental, serait idéale, la réalité sur le terrain est que l'Éthiopie manque actuellement de main-d'oeuvre et de capacités pour rétablir le contrôle du gouvernement sur l'Érythrée. Les dissidents au sein de la communauté du renseignement ont rétorqué que notre gouvernement pourrait approvisionner massivement l'Éthiopie au point où il serait possible de rétablir le contrôle. Cependant, la préoccupation du président quant à la création d'un désastre humanitaire encore plus dévastateur dans la région l'a emporté. Dans les prochains jours, notre ambassadeur en Éthiopie rencontrera le gouvernement intérimaire pour exposer notre position sur le sort de l'Érythrée."
 CIA_ERITREA.3.desc:0 "Alors que nous continuons à établir notre gouvernement, le problème de l'Érythrée est devenu le problème le plus urgent. L'ambassadeur américain récemment nommé nous a informés aujourd'hui que les États-Unis allaient reconnaître l'indépendance de l'Érythrée. L'ambassadeur américain nous a insisté sur le fait que c'était le mieux pour toutes les parties et a souligné que l'Éthiopie n'avait pas la capacité de démanteler le Front populaire de libération de l'Érythrée (EPLF) et qu'une nouvelle offensive en Érythrée pourrait condamner la stabilité du nouveau gouvernement. Nous n'aurons guère d'autre choix que d'accéder à la demande américaine. Bien que cela puisse s'avérer controversé au sein de certaines sections de notre gouvernement, sans le soutien américain, nous n'aurons pas assez de ressources pour prendre l'Érythrée sans nous coûter énormément et sans créer un désastre humanitaire encore plus important."
 CIA_ERITREA.4.desc:0 "Alors que nous continuons à établir notre gouvernement, le problème de l'Érythrée est devenu le problème le plus urgent. L'ambassadeur américain récemment nommé nous a informés aujourd'hui que les États-Unis reconnaîtraient que l'Érythrée fait légitimement partie de l'Éthiopie. L'ambassadeur a également noté que Washington serait prêt à accroître son aide militaire et financière dans la lutte à venir contre le Front populaire de libération de l'Érythrée (EPLF). Alors que notre gouvernement débattait de sa politique à l'égard de l'Érythrée, cela nous offre une occasion unique de préserver l'intégrité territoriale de l'Éthiopie. À un moment donné, cela aurait été considéré comme impossible, mais avec le soutien américain, il devrait être possible de repousser le FPLE hors des zones centrales de l'Érythrée. Cela dit, certains de nos partenaires gouvernementaux étaient auparavant alignés sur le FLPE et chercher à restaurer le pouvoir sur l'Érythrée pourrait déstabiliser notre gouvernement. Comment devons-nous procéder ?"
 
 CIA_ETH.10.desc:0 "Suite au soutien américain accru aux forces conservatrices dans la guerre civile éthiopienne en cours, les États-Unis ont lancé une vaste campagne aérienne contre le gouvernement du Derg et les rebelles du Front populaire de libération du Tigré (TPLF). La guerre civile éthiopienne en cours est un conflit plutôt unique à l'heure actuelle étant donné que plusieurs factions impliquées dans la guerre, dont le TPLF, le gouvernement et le Front populaire de libération de l'Érythrée (EPLF), qui s'opposent toutes les unes aux autres, sont toutes officiellement marxistes-léninistes. Avant la révolution éthiopienne de 1974, l'Éthiopie était un allié régional clé des États-Unis. Selon de nombreux analystes et groupes de défense, la guerre civile a donné à l'Amérique un moyen de retrouver son influence dans la région. Au cours de l'année dernière, le Congrès et l'administration ont soutenu et renforcé l'Alliance démocratique du peuple éthiopien (EPDA). L'EPDA, surnommé les « Contras éthiopiens » par la Heritage Foundation, s'est rapidement développé et a absorbé d'autres groupes conservateurs et monarchistes plus petits et détient désormais activement des territoires dans certaines régions du pays. La campagne aérienne en cours pourrait s'avérer décisive pour éliminer le quasi-monopole du TPLF et des forces gouvernementales sur les armes lourdes et compliquer leur logistique."
 CIA_ETH.17.desc:0 "Sans surprise, les États-Unis ont reconnu le nouveau gouvernement éthiopien dirigé par Dereje Deressa, secrétaire général de l'Alliance démocratique du peuple éthiopien (EPDA). Cela marque un tournant majeur pour l'Amérique dans la Corne de l'Afrique et une montée rapide au pouvoir pour les frères Deresse qui dirigent l'EPDA et ont réussi à solliciter le soutien américain alors que d'autres ont échoué. Même si les restes du Front populaire de libération du Tigré (TPLF) restent un sujet de préoccupation pour le nouveau gouvernement, le TPLF a rapidement perdu du terrain en raison des défections et de l'intensification des combats avec le Front populaire de libération de l'Érythrée (EPLF). Cela dit, le nouveau gouvernement a désormais la tâche difficile de soumettre les rebelles restants, de régler le problème de l'Érythrée et enfin de restaurer la stabilité et de résoudre les crises humanitaires auxquelles l'Éthiopie est confrontée. Cela dit, le président [USA.GetLeader] s'est engagé à fournir une aide militaire, économique et humanitaire importante au nouveau gouvernement dans les semaines à venir."
 
 CIA_SOM.0.desc:0 "Les conséquences de la guerre de l'Ogaden ont été largement déstabilisatrices pour la Somalie. Cependant, cette déstabilisation et la rupture des liens entre Moscou et Mogadiscio ont contribué à une détérioration rapide de la situation politique en Somalie. Peu après la guerre, le Front démocratique du salut somalien a été fondé avec le soutien de l'Éthiopie, du Yémen du Sud et de la Libye pour chasser Siad Barre du pouvoir et est plus ouvert à l'idéologie de gauche et est dominé par le clan Majeerteen. À peu près à la même époque, des membres de la communauté de la diaspora et des officiers exilés ont également fondé le Mouvement national somalien à Riyad, en Arabie saoudite, avec une base de soutien parmi le clan Isaaq, qui constitue la population dominante du nord de la Somalie et est politiquement fortement anticommuniste. Le gouvernement somalien n'a fait qu'intensifier la situation en punissant collectivement des clans entiers pour les actions présumées d'individus et en lançant des purges claniques au sein du corps des officiers. Même si le soutien au Front démocratique du salut somalien n'est certainement pas envisageable, nous pourrions envisager de soutenir le Mouvement national somalien, poursuivre notre soutien à Barre ou rechercher une voie plus neutre en Somalie."
 CIA_SOM.1.desc:0 "La Somalie a été ces dernières années un allié de commodité, mais la détérioration continue de la situation en Somalie, suivie par la répression brutale du gouvernement, a conduit à une réévaluation de notre soutien au gouvernement de Siad Barre. La décision a été prise par le Président de limiter notre aide au gouvernement Barre à la seule aide humanitaire. Alors que certaines factions de l'opposition sont davantage alignées sur Moscou, le régime Barre est devenu trop oppressif et instable pour continuer à le soutenir militairement. La Central Intelligence Agency a été chargée d'établir secrètement des contacts avec le Mouvement national somalien dans ses bureaux de Londres ou de Riyad afin de mieux comprendre ses objectifs, ses buts et sa volonté de travailler avec nous. Pour le moment, le Front démocratique du salut somalien, soutenu par l'Éthiopie, reste notre principal adversaire en Somalie, mais le soutien continu à Barre ne fait que couler de l'argent et des armes dans un navire en perdition."
 CIA_SOM.2.desc:0 "Le gouvernement de Siad Barre en Somalie est devenu notre principal allié dans la Corne de l'Afrique après la guerre de l'Ogaden et la rupture des relations entre la Somalie et l'Union soviétique. Même si Barre s'est dans une certaine mesure aligné sur nous et que nous lui avons rendu la pareille avec un soutien limité, la situation en Somalie est désastreuse. Le principal mouvement d'opposition, le Front démocratique du salut somalien, est soutenu par l'Éthiopie communiste et le Yémen du Sud, ainsi que par la direction compromettante de l'ancien attaché militaire auprès de l'Union soviétique. C'est dans cette optique que le président a décidé d'augmenter considérablement l'aide militaire à Mogadiscio. La pression diplomatique sera également exercée sur Barre en privé pour tenter de freiner les instincts les plus vicieux de son régime en représailles qui ne font qu'aggraver la situation. Bien que cela soit de mauvais goût, nous ne pouvons pas permettre que la Corne de l'Afrique tout entière tombe sous le joug du communisme."
 CIA_SOM.3.desc:0 "Une proposition intéressante a été relayée depuis Washington. Les Américains ont proposé de nous fournir un soutien technique et militaire étendu en échange du lancement d'une nouvelle offensive dans l'Ogaden. Notre précédente tentative de prise de l'Ogaden avait échoué en raison de l'intervention massive des forces soviétiques et cubaines. Cependant, maintenant que les forces du Derg, soviétiques et cubaines sont en Éthiopie, coincées aux prises avec la guerre civile, et en Érythrée, nous avons une nouvelle opportunité d'essayer une fois de plus. En outre, les États-Unis proposent de fournir une aide matérielle importante si nous acceptons cet effort afin d'éviter une répétition de la guerre précédente1. Alors que les troubles internes se propagent à l'intérieur de nos propres frontières, une victoire décisive sur l'Éthiopie atténuerait sûrement les inquiétudes de l'opinion publique et unifierait la nation. Cependant, si nous échouions une fois de plus, les conséquences seraient pour le moins désastreuses."
 CIA_SOM.4.desc:0 "Heureusement, le gouvernement somalien a accepté notre proposition de lancer à nouveau une offensive dans l'Ogaden. Le but de l'offensive est de libérer le peuple somalien en Éthiopie et d'annexer les parties à majorité somalienne de la Somalie à l'Éthiopie. Alors que la précédente guerre de l'Ogaden s'est soldée par un échec en raison du soutien massif de l'Union soviétique et de Cuba, l'âpre guerre civile en Éthiopie devrait atténuer ce potentiel compte tenu de l'état affaibli de l'armée éthiopienne. Si nos forces sont suffisamment compétentes, notamment avec le soutien occidental, les Somaliens pourraient porter un coup fatal au gouvernement éthiopien actuel, ce qui pourrait conduire à un État paralysé, incapable de lancer une contre-offensive dans l'Ogaden dans un avenir proche. Quoi qu'il en soit, cette décision déstabilisera davantage l'influence soviétique dans la Corne de l'Afrique et répondra à nos objectifs stratégiques dans la région."
 CIA_SOM.5.desc:0 "Malheureusement, le gouvernement somalien nous a fait savoir qu'il était actuellement opposé à toute intervention dans la région de l'Ogaden. Alors que le gouvernement somalien a souligné son désir de libérer la région de l'Éthiopie, il a souligné que la situation intérieure en Somalie était trop mauvaise pour permettre une quelconque action militaire majeure contre une puissance étrangère, même si elle se trouvait dans une situation aussi désastreuse que celle que connaît actuellement l'Éthiopie. Le gouvernement somalien a fait valoir que les révoltes en cours contre son gouvernement, en particulier dans la région du Somaliland, étaient prioritaires, ainsi que les inquiétudes concernant l'état de l'armée somalienne depuis la fin de la guerre de l'Ogaden. Selon nos analystes spécialisés dans la Corne de l'Afrique, l'armée somalienne ne s'est pas encore remise de sa défaite décisive contre l'Éthiopie lors de la guerre précédente, et le gouvernement n'a pas non plus été en mesure de rétablir l'ordre ou la légitimité publique depuis une perte aussi importante."
 CIA_SOM.7.desc:0 "Excellente nouvelle, les Américains ont vu la valeur de notre cause et ont indiqué à nos bureaux de la diaspora qu'ils commenceraient à nous envoyer des fonds et une aide matérielle. Même si nous sommes parvenus à réaliser des progrès limités dans les zones rurales, nous avons été jusqu'à présent incapables de pénétrer correctement dans le conflit plus vaste. Avec une source fiable d'armes et de financement, nous devrions être en mesure de déployer une force de combat beaucoup plus forte et plus importante contre le gouvernement et serons désormais en mesure de rompre complètement avec la coalition dirigée par le Front populaire de libération du Tigré (TPLF) contre le Derg. Bien que nous soyons actuellement alignés sur le TPLF, les tensions s'effilochent depuis des années en raison de nos divergences d'idées sur ce que devrait impliquer l'avenir de l'Éthiopie. Cela n'a fait que s'amplifier à mesure que le TPLF s'oriente vers la préservation de l'État éthiopien. L'Amérique a conditionné son soutien à cela, mais étant donné qu'une telle démarche était déjà prévue, cela ne fait qu'accélérer l'inévitable."
 CIA_SOM.8.desc:0 "Avec l'annonce de la finalisation de la capture de l'Ogaden par les forces somaliennes et les récentes avancées de l'Armée de libération oromo, la fin d'une Éthiopie unifiée est clairement en vue. Les factions communistes du centre de l'Éthiopie continueront sûrement à se battre, mais avec la perte des régions Somali et Oromo et les pertes croissantes en Érythrée, la fin d'une Éthiopie unifiée est clairement proche. Même s'il s'agit peut-être d'une fin malheureuse pour un État autrefois glorieux, la prise de contrôle de l'Éthiopie par les communistes dans les années 1970 a nécessité la fracture de l'Éthiopie pour garantir que l'ensemble de la Corne de l'Afrique ne succombe pas aux caprices de Moscou. Il nous faudra désormais développer et entretenir nos relations avec les Oromo et continuer à chercher à stabiliser la situation en Somalie. Espérons que la récente victoire de la Somalie stabilisera la situation interne dans ce pays et entraînera une diminution du soutien à l'opposition."
 CIA_SOM.10.desc:0 "Excellente nouvelle, les États-Unis ont informé notre bureau à Londres qu'ils avaient rompu leurs liens avec le gouvernement de Siad Barre et qu'ils commenceraient à travailler avec notre mouvement. Le soutien dont nous bénéficions est à la traîne par rapport à celui du Front démocratique du salut somalien, soutenu par l'Éthiopie, la Libye et le Yémen du Sud. Washington a indiqué que notre engagement en faveur de l'anticommunisme et l'instauration de la loi religieuse ont largement contribué à leur décision de soutenir notre mouvement. Même si les détails exacts doivent encore être précisés, les financements américains et saoudiens commenceront sous peu, tandis que d'éventuelles expéditions d'armes pourraient être possibles dans un avenir proche. Ces nouvelles ressources permettront à nos forces en Somalie de se développer considérablement et d'acquérir des armes modernes au lieu de compter sur du matériel récupéré et capturé localement. Malheureusement, cela ne fait rien pour mettre fin aux souffrances de notre peuple alors que le régime tente d'anéantir notre clan au Somaliland."
 CIA_SOM.11.desc:0 "Les traîtres Américains nous ont tourné le dos et se sont rangés du côté des rebelles. Nos agents nous ont informés que des agents du renseignement américain avaient récemment rencontré les dirigeants du Mouvement national somalien à Londres et à Riyad et que les Américains ont désormais rompu leurs relations diplomatiques avec notre gouvernement. C'est un désastre total et nous coupe de notre principal bailleur de fonds ces dernières années. Le seul point positif est que cette décision pourrait diviser davantage l'opposition étant donné les différences idéologiques entre le Mouvement national somalien et le Front démocratique du salut somalien (SSDF), en particulier le SSDF étant soutenu par les régimes communistes et ayant une idéologie socialiste. Nous n'avons plus d'autre choix que de nous battre jusqu'au bout, la défaite conduira sûrement au massacre massif de notre propre clan en représailles à nos propres actions de ces dernières années."
 CIA_SOM.12.desc:0 "Suite à notre réévaluation de notre politique somalienne et à notre orientation vers un soutien au Mouvement national somalien (SNM), la décision a été prise de commencer à armer le SNM. L'Arabie saoudite sera utilisée comme principale plaque tournante de transit pour la livraison des armes. Cela est facilité par le fait que le SNM a été initialement fondé à Riyad et y occupe toujours des bureaux. Compte tenu du soutien du Yémen du Sud et de l'Éthiopie au Front démocratique du salut somalien (SSDF), nous devrons nous assurer que nos agents et marchands d'armes comprennent les limites actuelles du conflit et ne livrent pas par erreur des armes aux mauvaises factions. Néanmoins, cette décision devrait faire pression encore davantage sur le régime Barre, d'autant plus que le SNM et d'autres mouvements d'opposition ont réussi à réaliser des gains malgré d'importants déficits d'armement. Des inquiétudes ont été exprimées quant au fait que cette décision pourrait attiser davantage les tensions claniques en Somalie et que le SNM et d'autres factions anti-Barre pourraient chercher à exercer des représailles contre les clans soutenant Barre. Nous devrons chercher à freiner ces impulsions si nous souhaitons un jour voir une Somalie stable."
 CIA_SOM.13.desc:0 "Avant de décider d'un plan d'action à long terme plus ferme pour la Somalie, le président a autorisé un plan visant à rallier un soutien international à la Somalie, cherchant à lever des fonds pour les problèmes humanitaires qui affligent le pays tout en intensifiant l'indignation du public contre les actions du régime de Siad Barre. Pour faire avancer ce plan, la Central Intelligence Agency a établi des contacts au sein de la communauté de la diaspora somalienne et diffusera les récits de leurs souffrances et des violations des droits humains commises par le régime de Barre auprès des principaux conglomérats médiatiques américains pour qu'ils les publient. Cependant, la présence d'une faction soutenue par les communistes dans le conflit contre Barre rend la tâche plus difficile. Nous devrons également présenter un jugement négatif sur le Front démocratique du salut somalien tout en glorifiant les luttes du Mouvement national somalien. Une fois que le soutien du public aura été attisé contre Barre, l'administration pourra continuer à débattre et finaliser nos objectifs stratégiques et nos stratégies de changement de régime en Somalie."
 CIA_SOM.14.desc:0 "Après un long débat interne, le président a décidé d'accorder une aide limitée au Mouvement national somalien, ce qui évitera d'envoyer des troupes américaines sur le terrain en Somalie. L'objectif stratégique sera de fournir une aide militaire meurtrière limitée ainsi qu'une aide humanitaire généreuse à nos alliés en Somalie. Étant donné que l'équipement des rebelles se limite à des armes primitives et à des armes capturées par le gouvernement, même une aide létale de base peut faire une différence majeure dans le conflit et l'aide humanitaire peut être utilisée pour réduire les souffrances et fournir une raison à certains de quitter le gouvernement pour rejoindre la cause rebelle dans les régions touchées par la famine."
 CIA_SOM.15.desc:0 "Suite à notre campagne publique contre le gouvernement somalien, la décision a été prise d'appeler à une intervention américaine en Somalie. Notre campagne médiatique sera renforcée à un degré plus élevé en faisant appel à des journalistes conciliants pour couvrir davantage les atrocités commises par le gouvernement somalien. Les organisations anticommunistes subiront des pressions pour soutenir cette démarche en soulignant la possibilité que l'opposition de gauche renverse le régime de Barre au lieu du Mouvement national somalien anticommuniste. En outre, nous devrons négocier massivement avec des membres clés du Congrès pour que cette mesure soit adoptée par le Congrès. Enfin, nous devrons composer avec le public américain. Même si le soutien aux rebelles est une chose, de nombreux Américains sont encore traumatisés par les interventions précédentes des dernières décennies. Nous devrons être ouverts et clairs sur nos objectifs et sur les progrès réalisés pour les atteindre si nous souhaitons maintenir le soutien du public."
 CIA_SOM.17.desc:0 "Les préparatifs sont finalisés et les premières troupes américaines devraient actuellement débarquer au Somaliland. Notre première incursion au Somaliland devrait être couronnée de succès étant donné que nos alliés du Mouvement national somalien (SNM) contrôlent actuellement la grande majorité du Somaliland. Cependant, progresser en dehors du Somaliland sera une tâche difficile étant donné la présence du Front démocratique du salut somalien (SSDF) de gauche dans le Puntland voisin et des loyalistes de Barre dans le sud et d'autres seigneurs de guerre à l'intérieur de la Somalie. L'armée de l'air, basée sur les bases aériennes des pays alliés à proximité et les avions d'un groupe aéronaval voisin, ont lancé une campagne de bombardement majeure, ciblant Mogadiscio et les forces gouvernementales dans tout le pays, tout en larguant également de l'aide et de petites bandes d'agents pour les intégrer aux forces alliées à l'intérieur de la Somalie."
 CIA_SOM.19.desc:0 "Les Américains ont enfin lancé leur campagne d'intervention tant attendue en faveur de notre cause. En ce moment, les troupes américaines ont commencé à débarquer dans nos zones de contrôle au Somaliland et une campagne de bombardement contre les forces de Barre a commencé. Même si nous sommes préoccupés par d'autres factions militantes, notamment le Front démocratique du salut somalien (SSDF) au Puntland, nos officiers estiment que les forces alliées devraient être en mesure d'avancer rapidement et de renverser le gouvernement de Barre. Des inquiétudes ont été soulevées quant à la possibilité que les différentes factions militantes composant à la fois les loyalistes de Barre et l'opposition se fragmentent à la suite de la chute du gouvernement, conduisant potentiellement à un état d'anarchie encore pire dans tout le pays. Nous devrons veiller à ce qu'un gouvernement compétent et légitime soit en place dès que possible pour éviter ce scénario et chercher rapidement à rétablir l'ordre dans toute la Somalie."
 CIA_SOM.20.desc:0 "La situation est devenue désespérée, les États-Unis ont débarqué des troupes sur nos côtes, cherchant à mettre fin à notre régime pour nos prétendues « violations des droits de l'homme ». Une campagne de bombardement majeure contre notre gouvernement et nos forces a également commencé, ce qui a déjà dévasté notre capacité militaire limitée et a gravement endommagé nos défenses à l'approche de Mogadiscio. Mais nous devons persévérer et poursuivre le combat à tout prix. L'opposition a montré son vrai visage et si nous tombons ou capitulons, notre peuple sera massacré jusqu'au bout en représailles à nos punitions collectives du début de la décennie des clans ennemis. Notre meilleure chance est d'essayer de tenir Mogadiscio et les régions bénéficiant du soutien populaire à Barre et de chercher à exploiter les tensions au sein de l'opposition et d'espérer que le pays sombrera dans une anarchie dont nous pourrons nous remettre après l'échec de l'intervention."
 CIA_SOM.21.desc:0 "Étonnamment, les choses se sont largement déroulées comme prévu. L'intervention américaine a pu rapidement prendre le contrôle des principaux centres de population de la Somalie et nos forces ont été capables d'extirper les différents seigneurs de guerre et les loyalistes de Barre dans tout l'arrière-pays rural. L'aide humanitaire de l'Occident et des principaux partenaires arabes a pu rapidement mettre un terme à la famine qui couvait dans tout le pays. Même si des poches de résistance perdurent dans les zones reculées, la situation s'est largement stabilisée. Les États-Unis ont joué un rôle central à cet égard. Non seulement les troupes américaines ont été le facteur clé pour briser le contrôle de Barre sur le sud de la Somalie, mais l'aide militaire et technique américaine a permis à nos forces de se moderniser rapidement, ce qui a conduit à nos propres succès militaires. Même si des problèmes économiques et humanitaires demeurent, Washington et Riyad ont promis des investissements importants pour améliorer notre situation et, pour la première fois depuis des décennies, l'avenir de la Somalie s'annonce prometteur."
 CIA_SOM.22.desc:0 "L'intervention menée par les États-Unis n'ayant pas réussi à stabiliser l'ensemble de la Somalie, les forces de la coalition se sont retirées au Somaliland. Suite à cela, les Américains ont reconnu notre gouvernement au Somaliland comme un État indépendant suite à notre propre déclaration d'indépendance. La reconnaissance de notre nouvel État par d'autres nations a également afflué. Cependant, il n'est pas clair quand les Nations Unies reconnaîtront formellement notre État ou non, ou si la Russie, la Chine ou un autre membre du Conseil de sécurité cherchera à opposer son veto à notre entrée. Même s'il est globalement regrettable que nous n'ayons pas réussi à rétablir l'ordre dans l'ensemble de la Somalie, nous avons pu sauver notre propre peuple du chaos actuel qui sévit dans le reste de la Somalie et pouvons désormais avancer dans le travail de redressement après deux dernières décennies de mauvaise gestion. Washington s'est également engagé à nous fournir un financement important destiné à l'aide humanitaire et économique dans une Somalie post-intervention."
 CIA_SOM.25.desc:0 "Lors de la prochaine session des Nations Unies, les États-Unis ont annoncé qu'ils proposeraient une intervention en Somalie. Cela fait suite à la détérioration rapide de la situation en Somalie. La guerre civile brutale a pris une tournure plus sinistre alors que le régime de Barre a lancé une campagne de massacre généralisé des clans soutenant les factions de l'opposition. Plus particulièrement, le récent génocide du clan Isaaq, qui a fait plus de cent mille morts, a rallié la communauté internationale et la diaspora somalienne contre Barre. Dans le même ordre d'idées, les États-Unis, anciens partisans de Barre après sa rupture avec Moscou à la fin des années 1970, proposent désormais une intervention des Nations Unies en Somalie dans le but de renverser le gouvernement actuel et d'installer un gouvernement de coalition démocratique composé de divers groupes d'opposition. Compte tenu du manque de soutien international au gouvernement somalien, la mesure devrait largement être adoptée. Cependant, des questions demeurent quant à savoir quel groupe d'opposition sera élevé, compte tenu de leurs différentes idéologies et de leurs soutiens étrangers."
 
 CIA_SOM.6.desc:0 "Alors que le régime de Siad Barre est en difficulté depuis l'échec de la première guerre de l'Ogaden, le fort soutien américain depuis le début de la décennie a renversé la fortune de son gouvernement. Alors que l'Éthiopie continue de sombrer dans une guerre civile multiforme, la Somalie a lancé une nouvelle invasion de l'Éthiopie pour s'emparer du territoire contesté de l'Ogaden. Le Département d'État a annoncé plus tôt dans la journée que l'Amérique soutenait pleinement l'invasion et a décrit cette décision comme une campagne visant à libérer la population somalienne d'Éthiopie d'un régime communiste oppressif. D'autres sources ont également indiqué qu'une récente aide militaire américaine supplémentaire à Mogadiscio pourrait contribuer à la guerre en cours. Le temps nous dira si cette invasion réussira et si elle pourra restaurer la confiance du public dans le régime de Barre.\n\nDans le même ordre d'idées, La Havane et Moscou ont qualifié cette décision de nouvel accaparement de terres impérialistes en Afrique et ont promis leur soutien à l'Éthiopie."
 CIA_SOM.9.desc:0 "Le début de la guerre de l'Ogaden dans les années 1970 a entraîné un réalignement de la Somalie, de Moscou vers Washington. Cependant, la situation en Somalie s'est rapidement détériorée dans les années qui ont suivi la guerre de l'Ogaden, avec un mécontentement généralisé et des tensions claniques éclatant dans tout le pays, en particulier dans le nord de la Somalie. Plus tôt dans la journée, le président [USA.GetLeader] a annoncé un nouveau changement de politique qui mettrait fin au soutien au gouvernement somalien et réorienterait son soutien vers le Mouvement national somalien (SNM). En particulier, le président a noté que l'un des principaux moteurs de cette décision était les récentes mesures prises par le régime Barre pour génocider la population Isaaq et l'encouragement à des violations flagrantes des droits de l'homme dans toute la Somalie. En outre, le président a salué l'engagement du Mouvement national somalien en faveur de l'anticommunisme et a comparé positivement le mouvement aux moudjahidines luttant contre l'occupation soviétique de l'Afghanistan. Cette décision a été accueillie globalement positivement par la communauté internationale compte tenu de la détérioration des relations entre la Somalie et la plupart des pays, à l'exception de la Libye."
 CIA_SOM.16.desc:0 "Lors d'une interview accordée à 60 Minutes diffusée dimanche soir sur CBS, le président [USA.GetLeader] a annoncé son soutien à l'intervention américaine dans le conflit en cours en Somalie. [USA.GetLeader] a fait valoir que même si les États-Unis ont soutenu dans le passé le gouvernement somalien actuel, leurs actions récentes, en particulier leur génocide en cours contre le peuple Isaaq, sont hors de propos et doivent être arrêtées. En outre, le président a fait valoir que le Mouvement national somalien, la principale faction d'opposition, établirait un véritable gouvernement anticommuniste en Somalie qui serait un bastion de la liberté dans une région en proie au communisme et au chaos. Les réactions à cette annonce ont été mitigées, voire positives. Les partisans du président ont souligné que l'établissement d'un gouvernement pro-américain dans la Corne de l'Afrique pourrait être une aubaine pour les intérêts américains. De l'autre côté, les critiques ont affirmé qu'envahir la Somalie pourrait rapidement se transformer en débâcle compte tenu de l'état actuel de la nation."
 CIA_SOM.18.desc:0 "À la suite d'un débat important au Congrès et au ministère de la Défense, les États-Unis ont officiellement lancé une intervention armée en Somalie. L'objectif affiché de l'opération est multiple. Le premier objectif est de renverser le gouvernement de Mogadiscio et d'établir le contrôle des principales zones urbaines du sud de la Somalie, tout en se coordonnant avec le Mouvement national somalien (SNM) dans le nord de la Somalie. Le deuxième objectif est de maîtriser les différentes factions armées à travers le pays et d'établir un gouvernement de coalition dirigé par le SNM avant les prochaines élections. Les forces américaines sont déjà arrivées dans le nord de la Somalie, dans les territoires contrôlés par le SNM, et assiègent Mogadiscio dans le cadre d'une opération amphibie majeure. Cela dit, la taille et la nature fragmentée de la Somalie rendront certainement cette tâche ardue et difficile. Le temps nous dira s'il s'agit d'un tournant dans cette nation africaine assiégée ou d'une nouvelle étape dans la fragmentation permanente de la Somalie."
 CIA_SOM.23.desc:0 "Au cours de la dernière décennie, la situation en Somalie s'est rapidement détériorée. L'un des aspects clés de la situation actuelle est le génocide du clan Isaaq par le régime Barre. Pour cette raison et pour une myriade d'autres raisons, les représentants des clans Isaaq, Dhulbahante, Issa, Gadabursi, Warsangali, ainsi que le Mouvement national somalien, ont créé un Somaliland indépendant comprenant les territoires de l'ancien protectorat du Somaliland. Le Département d'État américain a publié une déclaration soulignant que l'Amérique reconnaîtrait désormais l'indépendance du Somaliland et chercherait à établir des liens avec Hargeisa. Cette décision a été vivement critiquée par le gouvernement de Mogadiscio ainsi que par le dirigeant libyen [LBA.GetLeader]. Cette décision consacre effectivement ce qui était déjà évident pour beaucoup, à savoir que l'idée d'une grande Somalie unie, sans parler d'une Somalie unifiée, est désormais morte dans l'eau."
 CIA_SOM.24.desc:0 "Alors que la situation en Somalie continue de se détériorer, les appels internationaux à une intervention pour mettre fin au génocide en cours du peuple Isaaq se sont multipliés. Lors d'une réunion au Conseil de sécurité des Nations Unies (CSNU), l'ambassadeur des États-Unis auprès des Nations Unies a proposé que les Nations Unies interviennent en Somalie pour établir un gouvernement provisoire avant les élections. Aucune opposition sérieuse n'a été soulevée contre la proposition, mais de nombreux défis pratiques subsistent. En particulier, alors que la situation en Somalie continue de se détériorer, de plus en plus de factions armées continuent d'émerger à mesure que l'autorité centrale s'effondre au-delà des frontières politiques et tribales. Des inquiétudes ont également été soulevées quant à la manière dont une telle intervention affecterait la stabilité régionale, en particulier dans le contexte de la guerre civile et de la crise humanitaire déjà en cours en Éthiopie voisine. Cela dit, sans intervention internationale, l'avenir de la Somalie semble pour le moins désastreux."
 
 #Angola
 CIA_ANG.0.desc:0 "De tous les conflits en cours en Afrique, la guerre civile angolaise est peut-être le conflit le plus notable et le plus important sur le plan stratégique. Après le retrait du Portugal de ses colonies d'outre-mer, les factions belligérantes concurrentes en Angola se sont rapidement retournées les unes contre les autres, suivant un schéma similaire tout au long de la guerre d'indépendance. Après une brève lutte dans la capitale, le Mouvement populaire pour la libération de l'Angola (MPLA) a réussi à prendre le contrôle de la capitale Luanda, conduisant à une intervention cubaine majeure dans le conflit pour préserver le nouveau gouvernement central communiste. Notre principal mandataire dans ce conflit était auparavant le Front national de libération de l'Angola (FNLA). Malheureusement, le FNLA a largement cessé d'exister en dehors du Zaïre en raison de plusieurs revers majeurs et de problèmes de corruption liés au gouvernement zaïrois. Cela dit, l'Union nationale pour l'indépendance totale de l'Angola (UNITA) de Jonas Savimbi a rejeté sa position maoïste antérieure et est devenue le chouchou de la droite mondiale. Malheureusement, le Congrès a bloqué nos efforts pour armer Savimbi avec l'adoption de l'Amendement Clark. Avant de poursuivre les discussions sur la question angolaise, l'administration doit décider si elle doit ou non pousser le Congrès à abroger l'Amendement Clark, ou simplement accepter que la volonté des électeurs se reflète dans la restriction de l'aide du Congrès."
 CIA_ANG.1.desc:0 "Après plusieurs conversations entre le président et le directeur de la Central Intelligence Agency, le président a décidé de respecter les termes de l'amendement Clark. Même s'il est regrettable que nous ne soyons pas en mesure de soutenir les rebelles anticommunistes en Angola, le respect de l'Amendement Clark constitue en fin de compte la loi et nous manquons du capital politique nécessaire pour faire bouger le Congrès dans son opposition à l'abrogation de l'amendement. C'est néanmoins plutôt regrettable et notre manque de soutien aux guérilleros anticommunistes sera perçu comme une insulte aux organisations anticommunistes et aux groupes de défense et potentiellement comme un signe de faiblesse de la part de Moscou. Plusieurs représentants d'entreprises ont également exprimé leur mécontentement face à cette décision, compte tenu des vastes ressources naturelles présentes en Angola. D'un autre côté, le grand public était et est toujours opposé à toute implication dans le conflit en Angola et notre orientation vers les affaires économiques jouera probablement bien auprès de l'électeur médian."
 CIA_ANG.2.desc:0 "Après avoir consulté ses alliés du Congrès, le président a décidé de faire pression pour l'abrogation complète de l'amendement Clark. Ce sera une entreprise difficile étant donné l'opposition générale à nos projets pour l'Angola et le malaise général de l'Amérique face à nos récentes mésaventures en politique étrangère. Pourtant, la lutte contre le communisme en Angola est essentielle pour nos intérêts à long terme en Afrique, pour endiguer la vague du communisme en Afrique ainsi que pour protéger une autre source potentielle de pétrole et d'autres matières premières importantes. Le chef de cabinet et d'autres conseillers politiques clés seront déployés au Capitole pour négocier avec les principaux législateurs afin de faire avancer nos plans, mais nous devrons probablement proposer des concessions politiques pour faire bouger les choses sur cette question.\n\nSi, malgré tous nos efforts, le Congrès refuse de bouger, nous devrons nous demander s'il est temps ou non d'abandonner nos efforts en Angola ou de chercher des moyens de contourner l'interdiction du Congrès de fournir de l'aide."
 CIA_ANG.3.desc:0 "Dans un rebondissement surprenant de l'intrigue du Congrès, une loi visant à abroger l'Amendement Clark a été adoptée par les deux chambres du Congrès et apparaîtra sur le bureau du Président. Avec cette adoption, notre administration n'est plus empêchée d'utiliser ouvertement des fonds pour soutenir nos alliés en Angola et dispose désormais d'un éventail beaucoup plus large d'options pour approvisionner l'Union nationale pour l'indépendance totale de l'Angola (UNITA) de Jonas Savimbi. Il s'agit d'une victoire politique majeure pour l'administration, l'abrogation de l'Amendement Clark ayant été prédite comme étant morte dès son arrivée par les médias et les analystes politiques. Maintenant que nous avons l'élan de notre côté, nous devons réfléchir à nos objectifs stratégiques à long terme en Angola et à la manière dont nous prévoyons de les atteindre afin de pouvoir les vendre au public américain avant d'entreprendre des actions plus drastiques."
 CIA_ANG.4.desc:0 "Sans surprise, nos efforts pour abroger l'Amendement Clark n'ont pas porté leurs fruits et ont été un échec total. Comme indiqué lors de la réunion précédente, de nombreuses inquiétudes ont été soulevées quant à savoir si le président avait suffisamment d'influence politique pour faire bouger le Congrès sur cette question. Maintenant qu'il est devenu évident que le Congrès n'abrogera pas l'Amendement Clark, l'administration doit décider quelle ligne d'action prendre ensuite. Il reste deux options : la première serait de se conformer aux souhaits du Congrès et de rester à l'écart du conflit en cours en Angola. Cependant, cela nuirait à nos objectifs stratégiques en Afrique et pourrait mettre en danger la sécurité de nos autres alliés régionaux, et reviendrait à concéder les ressources naturelles de l'Angola aux communistes. Une solution alternative qui a été proposée consiste à réorienter les fonds discrétionnaires du budget vers le financement de nos opérations en Angola. Cela nous permettrait de fournir une aide aux forces anticommunistes en Angola, mais cela est pour le moins douteux sur le plan juridique. Comment devons-nous procéder ?"
 CIA_ANG.5.desc:0 "Bien que regrettable, le Congrès a clairement exprimé son opposition à notre volonté de soutenir les combattants anticommunistes en Angola. Nous pourrions chercher d'autres moyens de contourner le Congrès, mais après un long débat au sein du Conseil de sécurité nationale et les arguments du conseiller juridique de la Maison Blanche, la décision a été prise de simplement se conformer au Congrès et d'arrêter nos efforts en Angola. Cette décision sera très controversée et suscitera la colère des partisans de la ligne dure au sein et à l'extérieur de l'administration. Cela est particulièrement vrai pour la Heritage Foundation et d'autres groupes de réflexion connexes ainsi que pour les politiciens et experts associés. La principale préoccupation qui a conduit le président à prendre cette décision était l'avis du conseil selon lequel contourner le Congrès serait sûrement un délit passible de destitution et ternirait l'héritage du président. Des discussions ont eu lieu sur la possibilité de demander à d'autres partenaires de sécurité régionaux d'augmenter leur soutien à la cause anticommuniste en Angola, mais il est peu probable qu'un État puisse égaler notre financement et notre soutien."
 CIA_ANG.6.desc:0 "Il existe de multiples options stratégiques à considérer en Angola. D'un côté, l'idéal serait de faire reculer complètement le communisme en Angola, mais cela s'avérera une entreprise coûteuse et difficile. Par ailleurs, la grande majorité du pétrole angolais se trouve dans l'enclave de Cabinda, qui abrite un mouvement séparatiste actif déjà soutenu par la France et peut-être par le Zaïre. En résumé, nous avons trois pistes d'action principales à considérer. Notre ligne de conduite avant l'adoption de l'Amendement Clark consistait à fournir des armes et d'autres formes de soutien à l'Union nationale pour l'indépendance totale de l'Angola (UNITA) de Jonas Savimbi, mais en évitant de mettre les troupes américaines sur le terrain. Une deuxième option possible, si nous obtenons le soutien du Congrès, serait de nous engager effectivement dans une intervention armée en Angola pour sauvegarder le pétrole du pays. Cela pourrait être fait dans une mesure limitée, en limitant nos actions à l'enclave riche en pétrole de Cabinda, ou en cherchant à chasser le communisme d'Angola entièrement avec le soutien de nos alliés régionaux. Quoi qu'il en soit, notre prochaine étape alors que nous continuons à délibérer sur notre plan d'action est de tendre la main à la fois à l'UNITA et au Front de libération de l'enclave de Cabinda (FLEC) ainsi qu'à nos autres partenaires stratégiques impliqués dans la région."
 CIA_ANG.7.desc:0 "Après un débat animé sur les propositions concurrentes au sein du Conseil national de sécurité, la décision a été prise de viser la sauvegarde du pétrole en Angola plutôt que de se concentrer sur un changement de régime. Une fois cette décision prise, nous devrons décider si nous limitons ou non nos actions au Cabinda ou cherchons à éliminer totalement l'influence communiste de l'Angola. Ces deux options présentent des coûts et des avantages importants. L'option Cabinda serait la voie la plus simple, les forces communistes ne sont pas fortement enracinées au sein de la population en général et la faible densité de population et la majorité du pétrole angolais se trouvant dans cette enclave en feraient une cible idéale. Cependant, cette décision montrerait clairement que nous avons plus envie de contrôler le pétrole angolais que de faire reculer le communisme. D'un autre côté, s'engager dans une intervention visant à renverser entièrement le gouvernement communiste serait un engagement majeur et risquerait de voir le conflit se transformer en un nouveau bourbier vietnamien."
 CIA_ANG.8.desc:0 "L'Union nationale pour l'indépendance totale de l'Angola (UNITA) de Jonas Savimbi s'est imposée comme la principale opposition au gouvernement communiste issu du chaos provoqué par le retrait portugais d'Angola. Nous avons demandé à nos contacts avec Savimbi de solliciter son avis sur la meilleure manière de faire avancer nos projets visant à renverser les communistes résidant à Luanda. Alors que l'administration penche vers une intervention armée en Angola, il est essentiel d'obtenir la pleine coopération de Savimbi pour garantir que nous ayons un pied stable et une organisation capable d'établir rapidement un nouveau gouvernement crédible pour restaurer la stabilité en Angola. Quoi qu'il en soit, nos contacts nous ont assuré que Savimbi réagirait positivement à cette évolution et soutiendrait avec enthousiasme une intervention américaine en Angola et serait probablement ouvert à faire des concessions économiques majeures dans un Angola post-communiste en échange de cette intervention."
 CIA_ANG.9.desc:0 "Après avoir utilisé nos contacts au sein des services de sécurité français, nos agents ont réussi à prendre contact avec la direction du Front de Libération de l'Enclave du Cabinda (FLEC). Henrique N'zita Tiago, le leader de facto du FLEC, a été controversé au sein du mouvement sécessionniste en raison de sa position dure consistant à s'opposer armée au gouvernement communiste. Bien que controversés au sein du mouvement, ses objectifs correspondent parfaitement à nos intérêts et sont également soutenus par le gouvernement et les entreprises françaises. Dans les prochains jours, nos agents dans la région chercheront à approcher Tiago avec l'aide de nos amis du Zaïre et de la France et détermineront si le FLEC est la meilleure option pour ce plan d'action et leur volonté de coopérer avec notre gouvernement en termes d'action militaire et d'établissement de l'influence américaine au Cabinda une fois l'indépendance obtenue."
 CIA_ANG.10.desc:0 "Outre l'Afrique du Sud, notre autre partenaire régional clé est le Zaïre. Le Zaïre a des revendications historiques sur le Cabinda et accueillerait probablement favorablement tout effort visant à séparer le Cabinda de l'Angola. Cependant, le Zaïre pourrait ultérieurement souhaiter attirer le Cabinda dans sa sphère d'orbite, voire annexer purement et simplement le territoire. Quoi qu'il en soit, le Zaïre participera à l'une ou l'autre voie que nous déciderons finalement étant donné que nous maintenons actuellement le gouvernement actuel à flot et que nous fournissons à son armée presque tous ses armements. La principale préoccupation exprimée au sein du Conseil national de sécurité est que si le Zaïre s'engage dans cette action, le gouvernement redoublera probablement d'opposition aux réformes, ce qui pourrait mettre davantage en danger la stabilité interne du Zaïre. Quoi qu'il en soit, la décision appartient désormais au gouvernement zaréen."
 CIA_ANG.11.desc:0 "L'ambassadeur américain a relayé une proposition de collaboration pour renforcer le Front de libération de l'enclave du Cabinda (FLEC). Nous cherchons depuis longtemps à amener le Cabinda sur notre orbite, mais nous devons nous demander si nous sommes capables de mener une telle action sans mettre en danger notre propre stabilité intérieure et sans risquer d'éloigner les troupes de la frontière angolaise étant donné les efforts passés pour envahir notre propre nation par ladite frontière. En réalité cependant, nous n'avons pas d'autre choix que d'accepter la proposition américaine, la survie de notre propre régime est intrinsèquement liée à Washington, le rejet des propositions américaines de cette envergure entraînera sûrement des ramifications en termes de soutien économique et militaire à notre propre gouvernement. Pourtant, même avec cette simple illusion de choix, prendre le Cabinda aux communistes privera les communistes du contrôle des vastes réserves de pétrole qui s'y trouvent et nous pourrions un jour tenter d'affirmer notre propre contrôle sur le Cabinda."
 CIA_ANG.12.desc:0 "L'ambassadeur américain a relayé une proposition de collaboration pour renforcer le Front de libération de l'enclave du Cabinda (FLEC). Nous cherchons depuis longtemps à soutenir le FLEC et la cause de l'indépendance du Cabinda. Les vastes réserves pétrolières du Cabinda pourraient constituer une aubaine considérable si nous parvenons à garantir à nos sociétés le droit de développer des projets pétroliers. Aujourd'hui, Washington cherche à faire de même et nous a proposé des conditions pour que nous collaborions au soutien de l'indépendance du Cabinda. Les Américains ont manifesté leur ouverture à diviser les droits pétroliers entre les conglomérats français et américains, mais cela céderait en réalité l'avenir politique du Cabinda à Washington. De plus, les Américains proposent une intervention militaire ouverte au Cabinda, une décision qui serait sûrement impopulaire et controversée parmi une partie de l'électorat. Comment devons-nous procéder ?"
 CIA_ANG.13.desc:0 "Le gouvernement français a répondu positivement à notre projet de parvenir à un Cabinda indépendant. Étant donné que la France apportait déjà un soutien limité aux séparatistes de la région, ce soutien n'est guère surprenant. Leur volonté de s'aligner sur nos objectifs témoigne d'un renforcement de notre partenariat et d'un engagement commun à promouvoir l'autodétermination du peuple du Cabinda. \n\nCette collaboration nous offre une opportunité précieuse de renforcer nos efforts dans la région, en tirant parti des ressources et de l'influence françaises pour soutenir le mouvement séparatiste. Avec la France à nos côtés, nous pouvons étendre nos initiatives, notamment le soutien militaire, le plaidoyer diplomatique et l'aide humanitaire, pour assurer le succès du mouvement indépendantiste. \n\nNous devrions profiter de cet élan pour engager davantage d'autres alliés potentiels, en faisant de la quête de l'indépendance du Cabinda non seulement une lutte locale mais aussi une question vitale pour la stabilité régionale. En solidifiant le soutien international, nous pouvons renforcer notre position et accroître la pression sur le MPLA, ouvrant ainsi la voie à un résultat positif à Cabinda."
 CIA_ANG.14.desc:0 "Étonnamment, le gouvernement français a décliné notre proposition de coopérer pour renforcer les forces sécessionnistes au Cabinda. Cette décision est décourageante, surtout compte tenu de l'importance stratégique du Cabinda dans nos efforts pour contrer le MPLA et renforcer notre position dans la région. \n\nLe refus de la France de s'engager soulève des questions sur son engagement à soutenir les mouvements de libération en Afrique et peut indiquer une volonté de maintenir une position neutre dans le conflit en cours. Leur retrait de ce partenariat potentiel limite nos options et complique notre stratégie au Cabinda, où le soutien local est crucial pour toute initiative réussie. \n\nÀ la lumière de ce revers, nous devons réévaluer notre approche et explorer d'autres voies de soutien. S'engager avec d'autres alliés potentiels et réévaluer nos ressources seront essentiels pour garantir la viabilité des forces sécessionnistes. Nous devrions également travailler à communiquer l'importance de l'autonomie du Cabinda à la communauté internationale, en la présentant comme une question vitale d'autodétermination qui mérite attention et soutien."
 CIA_ANG.15.desc:0 "L'ambassadeur américain a transmis une proposition importante concernant la guerre civile en cours en Angola. Les États-Unis sont désireux de coordonner leurs efforts avec notre gouvernement pour lutter contre l'influence croissante des forces communistes dans le pays et renforcer la position militaire et politique de Jonas Savimbi et de sa faction, l'Union nationale pour l'indépendance totale de l'Angola (UNITA). \n\nCette initiative met en évidence la nécessité d'une stratégie unifiée qui aligne nos ressources et nos renseignements pour contrer efficacement le MPLA et ses alliés. En soutenant l'UNITA, nous pouvons contribuer à établir un front plus fort contre l'approche communiste à nos frontières, favorisant ainsi un équilibre des pouvoirs plus favorable dans la région. \n\nLa proposition décrit également un cadre de dialogue et d'assistance continus, comprenant une formation militaire et un soutien logistique pour les forces de Savimbi. Prendre des mesures décisives maintenant pourrait non seulement contribuer à contrecarrer le communisme en Angola, mais également ouvrir la voie à un avenir plus stable et plus démocratique pour le peuple angolais."
 CIA_ANG.16.desc:0 "Notre ambassadeur en Afrique du Sud a rapporté que Pretoria avait accepté de collaborer à nos plans de coordination des actions en Angola. Ce partenariat constitue un développement important, car il souligne un engagement commun à contrer l'influence des forces communistes dans la région. \n\nEn alignant nos stratégies, nous pouvons renforcer nos efforts pour soutenir Jonas Savimbi et sa faction, l'Union nationale pour l'indépendance totale de l'Angola (UNITA). Cette collaboration nous permettra de mettre en commun nos ressources et nos renseignements, renforçant ainsi notre efficacité opérationnelle sur le terrain. \n\nLa participation de l'Afrique du Sud est cruciale pour établir un front uni contre le MPLA et ses alliés. Ensemble, nous pouvons mettre en oeuvre une approche globale qui non seulement renforce les efforts militaires, mais jette également les bases de la stabilité politique en Angola. Cette alliance représente une étape cruciale vers la réalisation d'un avenir plus sûr et démocratique pour le peuple angolais, en alignant nos intérêts mutuels sur la sécurité et la stabilité régionales."
 CIA_ANG.17.desc:0 "Notre ambassadeur en Afrique du Sud a communiqué que Pretoria avait poliment décliné notre offre d'assistance pour les opérations en Angola. Cette réponse indique une approche prudente de leur part, reflétant leurs propres priorités stratégiques et préoccupations concernant leur implication dans le conflit en cours. \n\nMême si cette décision est décevante, elle met en lumière la complexité de la situation dans la région. L'Afrique du Sud évalue peut-être les risques potentiels associés à un engagement plus profond en Angola, en particulier à la lumière de la guerre civile en cours et du délicat équilibre des pouvoirs. \n\nÀ l'avenir, nous devrons réévaluer notre stratégie et explorer d'autres voies de soutien. Cela peut impliquer de renforcer nos propres efforts pour soutenir Jonas Savimbi et l'UNITA de manière indépendante ou de rechercher des partenariats avec d'autres pays partageant nos objectifs. Il reste crucial de maintenir des lignes de communication ouvertes avec l'Afrique du Sud, car son point de vue et son influence dans la région seront précieux alors que nous naviguons dans ce paysage difficile."
 CIA_ANG.18.desc:0 "Les différentes parties actives en Angola nous ont offert une occasion unique au milieu du chaos du conflit. Conscients de la nécessité d'un soutien aérien efficace, nous avons mobilisé nos fidèles pilotes cubains en exil pour mener des opérations de bombardement depuis les bases aériennes zaïroises. Cette initiative renforce non seulement notre capacité à combattre les communistes en Angola, mais nous positionne également stratégiquement pour influencer l'issue du conflit. \n\nEn utilisant ces pilotes qualifiés, nous pouvons lancer des frappes aériennes ciblées contre les forces du MPLA, soutenant ainsi nos alliés, notamment l'UNITA de Jonas Savimbi. Cette approche nous permet de maintenir un déni plausible tout en augmentant simultanément la pression sur les factions communistes. \n\nDe plus, ces opérations servent à démontrer notre engagement à lutter contre le communisme dans la région, mobilisant potentiellement un soutien supplémentaire de la part des alliés locaux et internationaux. Alors que nous continuons à naviguer dans ce paysage complexe, tirer parti de cette opportunité sera crucial pour façonner l'avenir de l'Angola et renforcer nos intérêts stratégiques en Afrique australe."
 CIA_ANG.19.desc:0 "Récemment, il est apparu que plusieurs frappes aériennes affectant nos forces sur les lignes de front et sur les centres logistiques critiques ont probablement été menées par la Central Intelligence Agency (CIA), en utilisant des sociétés écrans opérant depuis le Zaïre. Cette révélation souligne jusqu'où les forces extérieures sont prêtes à aller pour saper notre gouvernement et perturber nos opérations. \n\nCes actions secrètes mettent non seulement en péril la sécurité de nos troupes, mais menacent également la stabilité que nous nous efforçons de maintenir en Angola. L'implication de la CIA met en lumière la lutte géopolitique plus large en jeu, alors que les puissances impérialistes cherchent à imposer leur volonté sur notre souveraineté et à faire dérailler nos efforts révolutionnaires. \n\nAlors que nous évaluons les implications de ces frappes aériennes, il est essentiel de renforcer nos défenses et de renforcer nos mesures de contre-espionnage. Nous devons également oeuvrer pour dénoncer ces tactiques à la communauté internationale, les présentant comme des violations de la souveraineté et un mépris flagrant des principes d'autodétermination. Ce faisant, nous pouvons rallier des soutiens à notre cause et renforcer notre engagement à résister aux agressions extérieures."
 CIA_ANG.20.desc:0 "Dans nos tentatives visant à renforcer les forces anticommunistes en Angola, l'une des nations les plus impliquées est l'Afrique du Sud. Compte tenu de sa proximité géographique et de ses liens historiques avec la région, l'Afrique du Sud joue un rôle central en soutenant l'Union nationale pour l'indépendance totale de l'Angola (UNITA) et d'autres factions opposées au MPLA. \n\nLes capacités militaires et logistiques de l'Afrique du Sud peuvent améliorer considérablement l'efficacité de nos efforts. La collaboration avec les forces sud-africaines permet des opérations coordonnées qui peuvent mieux perturber les lignes d'approvisionnement du MPLA et renforcer la détermination des groupes anticommunistes locaux. De plus, l'implication de l'Afrique du Sud confère de la crédibilité à notre cause, démontrant un front uni contre l'expansion communiste en Afrique australe. \n\nToutefois, nous devons également être conscients des préoccupations liées à l'apartheid qui accompagnent notre partenariat. Les politiques intérieures de l'Afrique du Sud et le traitement qu'elle réserve à sa propre population noire pourraient provoquer des réactions négatives tant au niveau national qu'international. Soutenir un programme anticommuniste pourrait, par inadvertance, attirer des critiques sur notre implication dans un régime souvent considéré comme oppressif. Il est essentiel de répondre à ces préoccupations pour maintenir notre crédibilité et garantir que nos actions en Angola ne ternissent pas par inadvertance notre réputation sur la scène mondiale. \n\nEn fin de compte, le renforcement de notre alliance avec l'Afrique du Sud est essentiel pour faire avancer avec succès nos objectifs anticommunistes en Angola. En favorisant cette coopération, nous pouvons accroître notre impact dans la région et oeuvrer en faveur d'un avenir plus stable et démocratique pour l'Angola tout en étant conscients des implications plus larges de notre partenariat."
 CIA_ANG.21.desc:0 "L'ambassadeur américain a relayé une missive de Washington, exprimant la volonté américaine que nous lancions une nouvelle intervention terrestre en Angola pour combattre les forces communistes présentes. Cette demande nous rappelle notre implication précédente dans l'Opération Savannah, où nous cherchions à contrer l'influence du MPLA mais avons été confrontés à des défis importants et à des résultats mitigés. \n\nMême si soutenir les efforts américains contre le communisme pourrait renforcer notre alliance et accroître notre influence régionale, nous devons examiner attentivement les implications d'une nouvelle campagne militaire. L'Opération Savannah nous a appris de précieuses leçons sur la complexité de l'intervention, notamment les risques de conflit prolongé et les réactions négatives potentielles de la part des populations locales et des pays voisins. \n\nDe plus, le climat politique intérieur doit être pris en compte dans notre décision. Le soutien du public aux interventions militaires peut fluctuer, et nous devons veiller à ce que nos actions répondent aux préoccupations et aux aspirations de nos électeurs. S'engager dans une autre opération pourrait conduire à un examen minutieux et à un débat accrus sur nos priorités en matière de politique étrangère. \n\nAlors que nous délibérons sur cette demande, il est crucial d'évaluer à la fois les avantages stratégiques et les répercussions potentielles d'un engagement renouvelé en Angola. Notre décision doit donner la priorité à la stabilité et à la sécurité en Afrique australe, tout en tirant les leçons des expériences de l'opération Savannah pour guider nos actions futures."
 CIA_ANG.22.desc:0 "Notre ambassadeur à Pretoria a informé le secrétaire d'État que l'Afrique du Sud avait facilement accepté nos plans d'intervention proposés en Angola. Cette réponse enthousiaste constitue une évolution significative dans nos efforts visant à renforcer les forces anticommunistes dans la région. \n\nL'engagement de l'Afrique du Sud en faveur de nos plans d'intervention renforce non seulement nos capacités militaires, mais renforce également notre alliance stratégique. Leur soutien nous fournira des ressources logistiques essentielles et des renseignements locaux, rendant nos opérations plus efficaces pour contrer le MPLA et ses alliés cubains. \n\nDe plus, cette collaboration témoigne d'un front uni contre le communisme, susceptible de galvaniser d'autres partenaires régionaux à rejoindre notre cause. Cependant, nous devons rester conscients des implications intérieures de notre partenariat avec l'Afrique du Sud, en particulier en ce qui concerne sa politique d'apartheid, car cela pourrait attirer un examen international. \n\nDans l'ensemble, cet accord pose une base solide pour notre intervention, nous permettant d'avancer avec plus de confiance et un objectif commun de stabilisation de l'Angola et de réduction de l'influence communiste en Afrique australe."
 CIA_ANG.23.desc:0 "Notre ambassadeur à Pretoria a fait savoir au secrétaire d'État que l'Afrique du Sud avait décliné à contrecoeur notre offre de collaboration pour le lancement d'une intervention en Angola. Cette réponse est décevante, dans la mesure où l'implication de l'Afrique du Sud était considérée comme cruciale pour renforcer les efforts anticommunistes dans la région. \n\nLa réticence de Pretoria peut provenir de diverses pressions internes et externes, notamment des inquiétudes concernant les retombées potentielles d'une telle intervention et de l'examen minutieux de leurs politiques intérieures. Même si l'Afrique du Sud a toujours soutenu les initiatives anticommunistes, les complexités du conflit angolais l'ont peut-être incitée à faire preuve de prudence cette fois-ci. \n\nCe déclin nous oblige à réévaluer notre stratégie pour l'avenir. Nous devons explorer d'autres partenariats et rechercher d'autres alliés régionaux qui pourraient être disposés à s'engager pour soutenir nos objectifs. En outre, nous devons rester attentifs à l'évolution du paysage politique en Afrique du Sud, car des dynamiques changeantes pourraient ouvrir de nouvelles opportunités de collaboration à l'avenir. \n\nDans l'ensemble, même si ce revers est important, il nous offre également l'occasion d'adapter notre approche et de continuer à oeuvrer à la stabilisation de l'Angola sans compromettre nos intérêts stratégiques plus larges."
 CIA_ANG.25.desc:0 "Des preuves ont émergé de la part de nos alliés locaux et de l'Afrique du Sud, alléguant que Cuba a eu recours à la guerre chimique pour soutenir le Mouvement populaire pour la libération de l'Angola (MPLA) contre l'Union nationale anticommuniste pour l'indépendance totale de l'Angola (UNITA) de Jonas Savimbi. Cette évolution nous offre une puissante opportunité d'utiliser ces allégations comme propagande pour saper la crédibilité de Cuba et du MPLA sur la scène mondiale. \n\nEn soulignant ces accusations, nous pouvons attirer l'attention sur les tactiques contraires à l'éthique employées par Cuba, les présentant comme une menace non seulement pour l'Angola mais aussi pour les valeurs humanitaires. Ce discours peut galvaniser l'indignation internationale et susciter un plus grand soutien à l'UNITA, en présentant sa lutte comme une lutte contre un régime prêt à recourir à des méthodes inhumaines. \n\nNous devrions nous efforcer de diffuser largement ces informations, en utilisant les canaux médiatiques et les voies diplomatiques pour garantir qu'elles parviennent aux principales parties prenantes et au public. En définissant le conflit sous cet angle, nous pouvons renforcer notre position contre l'influence communiste dans la région et rallier le soutien à nos alliés, renforçant ainsi nos objectifs géopolitiques plus larges."
 CIA_ANG.26.desc:0 "Alors que nous préparons le terrain pour une intervention en Angola, nous demandons actuellement à Cuba de retirer ses forces afin d'atténuer le risque d'une nouvelle escalade avec l'Union soviétique. La présence continue de troupes cubaines soutenant le MPLA constitue un défi direct à nos objectifs stratégiques et accroît le risque d'affrontement direct. \n\nPour garantir l'efficacité de cette demande, nous devons adopter une stratégie globale combinant pression diplomatique et incitations économiques. S'engager avec les alliés et les pays qui exercent une influence sur Cuba sera essentiel pour renforcer notre position. Nous pouvons également tirer parti des plateformes internationales pour mettre en évidence les implications de l'implication de Cuba, en augmentant la surveillance et en favorisant l'isolement diplomatique. \n\nEn outre, nous devrions envisager de mettre en oeuvre des mesures économiques, telles que des sanctions ciblées, qui pourraient avoir un impact sur les intérêts de Cuba et encourager le respect de nos exigences. En présentant leur présence militaire en Angola comme une menace à la stabilité régionale, nous pouvons renforcer nos arguments en faveur de leur retrait et réduire la probabilité d'un conflit plus large avec les forces soviétiques. Il est essentiel d'agir rapidement et de manière décisive pour protéger nos intérêts stratégiques en Afrique australe."
 CIA_ANG.27.desc:0 "Le gouvernement américain a publié une déclaration publique exigeant notre retrait inconditionnel d'Angola. Cette demande agressive nous place à un carrefour critique. Nous devons peser soigneusement nos options, en tenant compte à la fois des implications du respect des règles et des conséquences potentielles d'un refus. \n\nD'une part, accéder à cette demande pourrait conduire à un retrait d'une région où nous avons investi des ressources et un soutien importants en faveur du MPLA. Cela signalerait à nos alliés que nous sommes facilement influencés par les pressions extérieures, sapant ainsi notre crédibilité et notre influence dans la région. \n\nD'un autre côté, le maintien de notre présence en Angola réaffirme notre engagement à soutenir le gouvernement légitime confronté à l'agression. Cela nous permet de poursuivre nos efforts pour contrer l'influence américaine et faire respecter les principes de souveraineté et d'autodétermination. \n\nEn fin de compte, nous devons décider si nous devons résister fermement à ces pressions ou rechercher une solution diplomatique qui protège nos intérêts tout en répondant aux préoccupations de la communauté internationale. Ce choix définira notre rôle en Angola et façonnera nos futures relations dans la région."
 CIA_ANG.28.desc:0 "Excellente nouvelle : les forces cubaines ont entamé un retrait général d'Angola. Cette évolution marque un tournant important dans le conflit et ouvre de nouvelles possibilités de stabilisation de la région. Ce retrait témoigne de l'efficacité de nos efforts diplomatiques et de la pression croissante que nous avons exercée tant en public qu'en privé. \n\nAvec le retrait des troupes cubaines, on peut s'attendre à un changement dans l'équilibre des pouvoirs qui pourrait favoriser l'opposition du MPLA. Cela nous donne l'occasion de renforcer notre soutien aux forces locales, en particulier à l'UNITA de Jonas Savimbi, et de consolider nos intérêts stratégiques en Angola. \n\nNous devons tirer parti de cet élan en nous coordonnant avec nos alliés et en veillant à ce que nos ressources soient alignées pour maximiser l'impact de ce changement. À mesure que nous avançons, il sera crucial de suivre de près la situation et d'adapter nos stratégies pour maintenir la stabilité et prévenir toute résurgence du conflit. Ce retrait pourrait être le premier pas vers un avenir plus pacifique et démocratique pour l'Angola."
 CIA_ANG.29.desc:0 "Malgré nos demandes publiques et privées, ainsi que nos menaces, La Havane est restée provocante dans son refus de retirer ses troupes d'Angola. Cette position inébranlable complique non seulement nos objectifs stratégiques, mais exacerbe également les tensions dans la région. \n\nLa présence militaire continue de Cuba constitue un défi direct à notre influence et sape nos efforts de soutien à l'opposition du MPLA. Leur refus d'obtempérer révèle un mépris pour la pression internationale croissante et met en évidence leur détermination à maintenir un pied en Angola. \n\nEn réponse, nous devons réévaluer nos tactiques. Il pourrait être nécessaire d'intensifier les efforts diplomatiques avec les alliés et de tirer parti des sanctions économiques pour contraindre Cuba à changer de position. En outre, nous devrions nous concentrer sur la mobilisation du soutien international pour isoler La Havane, en présentant leurs actions comme une violation de la souveraineté angolaise. Ce défi ne peut rester sans réponse, et une réponse unifiée sera cruciale pour sauvegarder nos intérêts et promouvoir la stabilité dans la région."
 CIA_ANG.33.desc:0 "Le moment est venu de lancer l'Opération Liberté Angolaise. Nos forces ont été stratégiquement positionnées aux côtés de nos partenaires régionaux pour lancer une offensive concertée visant à s'emparer de Luanda et d'autres zones côtières critiques. Cette opération vise à porter un coup décisif au Mouvement populaire communiste pour la libération de l'Angola (MPLA) et à renforcer nos alliés de l'Union nationale pour l'indépendance totale de l'Angola (UNITA) de Jonas Savimbi. \n\nAlors que nous nous lançons dans cette mission, il est essentiel d'en reconnaître les enjeux. Sécuriser Luanda perturbera non seulement la structure de commandement du MPLA, mais renforcera également l'UNITA, lui donnant l'élan nécessaire pour galvaniser le soutien de la population angolaise. Nos efforts coordonnés visent à créer un front uni contre le communisme, renforçant ainsi notre engagement en faveur de la démocratie et de la stabilité dans la région. \n\nAu niveau national, le lancement de cette opération nécessitera une communication claire auprès du public américain et du Congrès sur nos objectifs et l'importance de cette intervention. L'exécution réussie de l'Opération Angolan Freedom peut servir à renforcer notre position en Afrique australe et à affirmer notre rôle de leader dans la lutte mondiale contre le communisme. À mesure que nous progressons, une planification et une exécution minutieuses seront cruciales pour atteindre nos objectifs et assurer un avenir meilleur à l'Angola."
 CIA_ANG.35.desc:0 "Lorsque les Américains ont menacé d'envahir l'Angola et exigé notre retrait, nous avons conclu qu'il s'agissait simplement d'un bluff visant à nous forcer à abandonner notre soutien au MPLA. Malheureusement, nous nous sommes trompés ; le lancement de « l'Opération Liberté Angolaise » a prouvé que leur détermination est authentique. \n\nCette intervention militaire constitue une escalade significative qui menace directement non seulement notre présence en Angola mais aussi la souveraineté du peuple angolais. Les États-Unis tentent de réduire à néant les progrès que nous avons réalisés en soutenant le MPLA, et il est crucial que nous réagissions de manière décisive. \n\nNous devons rallier nos alliés et renforcer notre soutien au gouvernement angolais pour contrer cette agression. Les enjeux sont élevés ; L'inaction pourrait encourager de nouvelles interventions américaines dans la région et compromettre nos efforts visant à soutenir les mouvements révolutionnaires. Ce moment exige unité et détermination alors que nous défendons l'Angola contre les forces impérialistes extérieures cherchant à imposer leur volonté."
 CIA_ANG.36.desc:0 "Nos efforts en Angola se sont rapidement transformés en un échec embarrassant, mettant en lumière les défis de notre intervention. Malgré nos attentes initiales, nous n'avons absolument pas réussi à renverser le gouvernement communiste du Mouvement populaire pour la libération de l'Angola (MPLA), qui continue de maintenir son emprise sur le pouvoir. \n\nL'incapacité d'atteindre nos objectifs stratégiques a non seulement diminué notre crédibilité dans la région, mais a également soulevé de sérieuses questions sur notre approche du conflit. La résilience du MPLA face à nos efforts lui a permis de se regrouper et de contrer efficacement nos avancées, compliquant encore davantage la situation. \n\nAu niveau national, cet échec pourrait avoir des conséquences politiques importantes. L'opinion publique va probablement s'opposer à la poursuite de l'implication militaire, ce qui entraînera une pression accrue de la part du Congrès pour qu'il reconsidère nos stratégies de politique étrangère. Les législateurs peuvent exiger des comptes, remettre en question les décisions qui ont conduit à cette intervention et exiger la transparence quant à nos objectifs. Alors que les dirigeants politiques font l'objet d'une surveillance croissante, l'administration doit relever ces défis avec prudence afin de maintenir le soutien du public et sa crédibilité sur la scène internationale. En fin de compte, la nécessité d'une réponse globale et efficace n'a jamais été aussi urgente."
 CIA_ANG.37.desc:0 "L'Opération Liberté a été un succès retentissant, marquant un tournant important dans le conflit en cours. La chute rapide de Luanda et d'autres zones urbaines clés a gravement paralysé la capacité du gouvernement MPLA à mobiliser ses forces et à contrer efficacement notre avancée ou celle des troupes de Jonas Savimbi dans le sud de l'Angola. \n\nCette prise de pouvoir rapide a non seulement perturbé le commandement et le contrôle du gouvernement, mais a également créé un vide de pouvoir que les forces de Savimbi sont prêtes à exploiter. L'élan donné par ces victoires cruciales a remonté le moral de nos alliés et de l'UNITA, favorisant une plus grande coopération et coordination sur le terrain. \n\nAlors que nous évaluons les implications de ce succès, il est essentiel de consolider nos acquis et de veiller à ce que la transition dans ces domaines favorise la stabilité et la gouvernance à long terme. La poursuite de la collaboration avec Savimbi et sa faction sera vitale pour obtenir une issue favorable et jeter les bases d'un avenir plus démocratique et plus prospère pour l'Angola."
 CIA_ANG.38.desc:0 "Avec la défaite du communisme en Angola, les questions difficiles commencent maintenant, notamment sur la manière dont nous devrions aider à la reconstruction du pays. Même si la victoire contre le MPLA marque une étape importante, la voie à suivre nécessite un examen attentif et une planification stratégique pour garantir une reprise durable. \n\nL'un des principaux défis consistera à déterminer les meilleures méthodes pour fournir une assistance, que ce soit par le biais d'une aide financière, de la reconstruction des infrastructures ou du soutien aux réformes de gouvernance. Il sera crucial de collaborer avec les dirigeants et les communautés locales pour comprendre leurs besoins et garantir que nos efforts sont à la fois efficaces et bien accueillis. \n\nDe plus, nous devons considérer les implications géopolitiques de notre implication. La manière dont nous abordons la reconstruction pourrait influencer nos relations avec les pays voisins et avoir un impact sur la stabilité de la région. Au niveau national, l'administration devra communiquer l'importance de cet investissement au Congrès et au public américain, en soulignant qu'aider au redressement de l'Angola est essentiel pour la sécurité à long terme et pour contrer toute résurgence de l'influence communiste. En fin de compte, les décisions prises aujourd'hui façonneront l'avenir de l'Angola et notre rôle dans la promotion de la paix et de la stabilité en Afrique australe."
 CIA_ANG.39.desc:0 "La chute du communisme en Angola constitue un moment décisif dans notre lutte contre l'expansion communiste. Ce renversement significatif d'une révolution communiste majeure non seulement stoppe la propagation du communisme en Afrique australe, mais inverse activement la tendance en notre faveur. Le renversement réussi du gouvernement du MPLA renforce notre position dans la région et allège la pression sur l'Afrique du Sud, qui fait face à des menaces constantes de la part des mouvements communistes. \n\nCette évolution a des implications considérables pour notre politique étrangère et nos stratégies de sécurité. Un front uni contre le communisme en Angola renforce notre crédibilité auprès de nos alliés et souligne notre engagement à soutenir les mouvements démocratiques. Cela pourrait également inspirer des soulèvements similaires dans les pays voisins, déstabilisant ainsi davantage l'influence communiste dans la région. \n\nAu niveau national, cette victoire pourrait renforcer le soutien aux initiatives de politique étrangère du gouvernement et redynamiser la confiance du public dans notre rôle de leader mondial contre le communisme. Alors que nous célébrons cette réussite, il est essentiel de tirer parti de cet élan pour garantir une stabilité et une sécurité durables en Afrique australe."
 CIA_ANG.40.desc:0 "Bien qu'il y ait eu des indications d'utilisation de la guerre chimique dans d'autres régions de l'Angola, il n'y a eu aucune confirmation ni même de véritables rumeurs concernant leur utilisation au Cabinda. Il nous faut cependant susciter la polémique pour justifier notre prochaine intervention au Cabinda. Des rapports ont circulé selon lesquels les forces cubaines ou celles du Mouvement populaire pour la libération de l'Angola (MPLA) auraient eu recours à la guerre chimique contre les rebelles anticommunistes dans le sud de l'Angola. Dans cet esprit, nos spécialistes de la propagande et des médias de la CIA ont été chargés de prendre ces histoires et de trouver des éléments s'y rapportant pour expliquer comment le MPLA utilise des actions barbares pour réprimer sa propre population, attisant encore davantage la colère du public contre les communistes et établissant un casus belli pour lancer une intervention visant à libérer la population du Cabinda et, plus important encore, à sécuriser les vastes réserves de pétrole au large de la côte du Cabinda."
 CIA_ANG.42.desc:0 "En prélude à notre intervention, nous devons assouplir les fortifications de l'enclave. Heureusement, les forces gouvernementales ont mis du temps à déployer massivement ou à fortifier la région et il y a un manque généralisé d'installations anti-aériennes au Cabinda. C'est dans cet esprit que la Central Intelligence Agency (CIA) a déployé au Zaïre plusieurs escadrons d'avions plus anciens utilisant des sociétés écrans, qui seront pilotés par des pilotes cubains en exil. Ces escadrons non officiels chercheront à détruire les positions gouvernementales et à livrer du matériel aux forces du Front de libération de l'enclave du Cabinda (FLEC) opérant dans la région. Le gouvernement zaïrois a approuvé l'opération et, compte tenu de la série d'événements et de tensions en cours entre le Zaïre et l'Angola, nous offre un déni plausible concernant ces frappes. Cet argument est d'autant plus renforcé compte tenu du grand nombre de mercenaires employés par l'État zaïrois."
 CIA_ANG.43.desc:0 "Une étrange série d'événements a récemment commencé dans l'enclave de Cabinda. Bien que les attaques sporadiques des guérilleros contre les garnisons soient relativement normales, plusieurs frappes aériennes ont récemment eu lieu contre nos installations et nos positions éloignées. Des rumeurs ont également circulé sur une activité accrue des services de renseignement étrangers dans la région. Nos agents au Zaïre ont signalé que ce sont des exilés cubains engagés par une partie inconnue, avec la permission du Zaïre, qui lancent les grèves au Cabinda. Notre capacité limitée à défendre la zone contre les attaques aériennes est de plus en plus préoccupante compte tenu de ces activités. Pourtant, même si la réorientation des forces pour garantir le maintien de l'ordre au Cabinda serait idéale, une telle décision allégerait la pression sur l'UNITA et pourrait conduire à une détérioration rapide du front, tout en donnant à l'Afrique du Sud une opportunité d'agir. Pour l'instant, nous devons faire preuve de prudence et surveiller la région à la recherche d'autres actions hostiles des impérialistes."
 CIA_ANG.44.desc:0 "Maintenant que les préparatifs sont finalisés, nos forces ont lancé l'opération Cabindan Freedom. Étant donné que le Cabinda est isolé du reste de l'Angola et dispose d'une garnison limitée avec un soutien étranger minimal, on s'attend à ce que cette opération aboutisse rapidement. Dans les heures à venir, nos forces lanceront un assaut sur plusieurs fronts contre la région, en collaboration avec nos alliés locaux au sein du mouvement indépendantiste Cabindais et avec le soutien du Zaïre et d'autres alliés régionaux. Des rapports limités ont indiqué un potentiel récent renforcement des forces gouvernementales et de leurs soutiens étrangers dans l'enclave, ce qui pourrait compliquer l'opération. Quoi qu'il en soit, grâce à notre suprématie navale et aérienne, nous devrions être en mesure de décimer toute résistance soutenue et de couper toutes les routes logistiques utilisées par les communistes."
 CIA_ANG.45.desc:0 "Les Américains et d'autres alliés ont lancé une intervention appelée « Opération Cabindan Freedom » pour libérer l'enclave de Cabinda du gouvernement communiste de l'Angola. Comme indiqué précédemment, nos forces se sont également engagées et ont commencé à sécuriser l'intérieur du Cabinda et devraient actuellement déborder les gardes-frontières gouvernementaux dans toute l'enclave. Compte tenu de notre soutien de longue date aux séparatistes du Cabinda, le succès potentiel de cette opération pourrait être une aubaine pour notre nation, à la fois en termes d'expansion de notre propre sphère d'influence, d'offre de davantage de débouchés économiques et, surtout, d'affaiblissement de nos ennemis communistes en Angola. Nous devons néanmoins rester vigilants et veiller à ce que les communistes ne cherchent pas à organiser une nouvelle invasion au Katanga ou dans d'autres régions de notre pays, d'autant plus qu'un si grand nombre de nos troupes sont actuellement engagées dans l'opération Cabindan."
 CIA_ANG.47.desc:0 "Au grand désarroi du grand public, notre intervention au Cabinda a été un véritable désastre. Dans une brève déclaration aujourd'hui, le ministère de la Défense a reconnu le retrait des forces américaines de l'enclave. Ce désastre entraînera sûrement une baisse importante de notre taux d'approbation et mettra en danger les futurs succès électoraux de notre parti lors des cycles électoraux à venir. Pourtant, cela aurait pu être pire, surtout si nous nous étions engagés à évincer complètement le communisme de l'Angola. Au moins, nous disposons désormais d'informations détaillées sur les domaines dans lesquels l'armée doit s'améliorer et sur la manière dont nos partenaires stratégiques dans la région doivent procéder à des réformes significatives de leurs appareils de renseignement et militaires pour éviter que de telles erreurs ne se reproduisent à l'avenir.\n\nPar ailleurs, la Fondation Heritage et d'autres groupes de réflexion anticommunistes ont lancé un défi majeur aux partisans de notre administration suite à notre échec à terminer le travail au Cabinda."
 CIA_ANG.48.desc:0 "La victoire rapide de nos forces au Cabinda a été une victoire majeure en matière de relations avec la presse et a entraîné une augmentation notable de notre cote de popularité. Maintenant que la victoire est proche, le moment est venu d'établir officiellement un nouveau gouvernement au Cabinda. Henrique N'zita Tiago a été désigné président du Cabinda, alors que Tiago est resté controversé, notre soutien à sa faction du FLEC lui a cependant donné de la crédibilité. Nos analystes de la CIA et du Département d'État s'attendent désormais à ce que la cause séparatiste se fracture enfin complètement et que de nouveaux partis politiques soient créés. Bien que ce scénario puisse alarmer certains, la tendance anticommuniste de la grande cause séparatiste et leur opposition antérieure au gouvernement communiste devraient garantir qu'aucun des nouveaux partis politiques majeurs ne sera de nature communiste ou ne constituera une menace générale pour notre influence au Cabinda."
 CIA_ANG.50.desc:0 "L'Union Nationale pour l'Indépendance Totale de l'Angola (UNITA) de Jonas Savimbi a peut-être commencé avec une idéologie maoïste, mais le parti s'est rapidement modéré dans le but d'attirer l'attention internationale et a réussi à rallier l'importante population Ovimbundu à sa cause contre le gouvernement communiste. Si nous souhaitons sécuriser les vastes réserves de ressources naturelles de l'Angola, notamment des quantités incalculables de pétrole, de diamants et d'autres minéraux, l'UNITA serait la meilleure option. Avec la chute du Front de libération nationale de l'Angola (FNLA) et les schismes au sein du mouvement sécessionniste Cabindais, les forces de Savimbi sont devenues notre seule véritable alternative dans la lutte contre le gouvernement communiste de l'Angola. Du côté positif, Savimbi s'est révélé être un personnage très charismatique, parvenant à rallier une grande partie de la population angolaise à sa cause tout en faisant preuve de compétence dans la gestion des médias occidentaux."
 CIA_ANG.51.desc:0 "L'un des outils à notre disposition que nous n'avons pas encore fourni en quantités significatives à nos alliés en Angola est celui des mines terrestres, tant antichars qu'antipersonnelles. Les mines terrestres, en particulier les mines antipersonnel, sont une arme plutôt controversée et leur fourniture aux organisations que nous soutenons peut être une question plutôt sensible pour le grand public américain. Cependant, l'utilisation de mines terrestres dans les diverses guerres de brousse en Afrique australe a montré leur efficacité incroyable contre les ennemis dotés d'armes plus lourdes. Cela a été particulièrement démontré dans le Sud-Ouest africain, dans le conflit en cours entre le gouvernement sud-africain et la South West Africa People's Organisation (SWAPO). Après un long examen par nos analystes du Département de la Défense et de la Central Intelligence Agency, la décision a été prise par le Président de commencer à expédier de grandes quantités de mines terrestres aux forces de l'UNITA en Angola. L'Afrique du Sud a notamment protesté contre cette décision et a fait part de ses inquiétudes quant aux mines potentiellement données ou capturées par les forces de la SWAPO, compte tenu des relations plutôt complexes entre la SWAPO, l'UNITA et le gouvernement MPLA d'Angola."
 CIA_ANG.52.desc:0 "Récemment, nos officiers ont commencé à remarquer une tendance selon laquelle l'ennemi utilise massivement des mines. Plusieurs patrouilles et plusieurs véhicules se sont heurtés à des mines tout en poursuivant des bases ennemies dans des zones reculées. Après une inspection plus approfondie ainsi que les rapports de nos agents de renseignement, il a été prouvé que les mines touchées n'étaient pas simplement des mines placées par erreur par nos propres forces, mais des mines terrestres fournies par l'Occident à l'UNITA. Il s'agit d'une complication majeure pour nos voies d'attaque prévues et nos efforts visant à sécuriser les zones rurales fidèles à Savimbi en dehors des principales terres détenues par l'UNITA. Compte tenu du manque d'infrastructures et de l'éloignement des forces et des bastions rebelles, nos avancées vers ces zones risquent d'être inondées de mines antipersonnel et antivéhicules. Nos propres forces et celles de nos alliés en Namibie ont utilisé des tactiques similaires pour harceler les forces sud-africaines ; aujourd'hui, la même tactique est utilisée contre nos propres forces."
 CIA_ANG.53.desc:0 "Alors que la population et le Congrès restent pour le moins ambivalents à l'égard du conflit angolais, nos conseillers politiques ont eu l'idée d'inviter le chef de l'opposition Jonas Savimbi à la Maison Blanche pour rencontrer officiellement le président et consulter les dirigeants et alliés du Congrès. Nous profiterons de cette réunion pour réaffirmer notre soutien public et privé à la lutte contre le communisme en Angola et pour faire pression davantage sur le Congrès afin qu'il agisse pour soutenir les rebelles anticommunistes en Angola et appeler au retrait des forces communistes étrangères d'Angola. Alors que nous continuons à débattre de nos objectifs stratégiques en Angola, nous devrions également vérifier l'intention du Dr Savimbi, à savoir si son objectif s'est déplacé vers une réconciliation nationale et des élections libres entre son propre parti et le Mouvement populaire communiste pour la libération de l'Angola (MPLA) ou si l'objectif reste de prendre le contrôle de la nation par la force et d'expulser l'influence communiste de l'Angola."
 CIA_ANG.54.desc:0 "Les Américains intensifient leurs efforts pour convaincre leur population de soutenir notre cause et cherchent à accroître le soutien du Congrès en notre faveur. Dans l'esprit de cet effort, le président américain [USA.GetLeader] a invité Jonas Savimbi à la Maison Blanche et pourrait éventuellement s'adresser au Congrès américain. Bien entendu, nous accepterons cette proposition. Il s'agit d'une occasion exceptionnelle de vendre notre cause au public américain et de rallier un soutien international à notre cause. Nous devons utiliser tous les moyens possibles au cours de cette visite pour construire des liens plus profonds avec les principaux dirigeants américains et chercher à nous adresser aux groupes d'influence anticommunistes afin d'encourager une plus grande sanction officielle américaine afin de fournir à nos forces des armes plus nombreuses et plus lourdes afin que nous puissions continuer à combattre les usurpateurs communistes à Luanda. "
 CIA_ANG.56.desc:0 "Plus tôt dans la journée, nos contacts à la CIA nous ont informés que Washington souhaitait que nous participions aux pourparlers de paix qui seraient organisés par l'Amérique. Alors que l'intérêt du public pour notre lutte diminue, nous devons reconnaître la nature critique de ce moment pour façonner notre stratégie future. Même si engager un dialogue pourrait fournir une plateforme pour défendre notre vision d'un Angola démocratique, nous devons peser les risques et les avantages potentiels.\n\nParticiper à ces pourparlers soulève des questions importantes sur notre engagement en faveur d'une véritable réconciliation nationale par rapport à notre détermination à éliminer l'influence communiste par des moyens plus forts. Nous devons évaluer si ces discussions feraient réellement progresser nos objectifs ou serviraient simplement à légitimer la position du MPLA. En fin de compte, notre décision doit refléter notre détermination à parvenir à un Angola stable et démocratique, tout en restant résolu face aux pressions extérieures qui pourraient compromettre nos objectifs et compromettre notre mission."
 CIA_ANG.57.desc:0 "Fait notable, l'UNITA a indiqué qu'elle était prête à s'engager dans des pourparlers de paix soutenus par les États-Unis concernant le conflit en cours en Angola. Ce changement intervient à un moment crucial où l'intérêt du public pour le conflit angolais diminue, et notre administration reconnaît l'importance de saisir ce moment pour réaffirmer notre engagement à combattre le communisme dans la région. S'engager avec l'UNITA offre une opportunité stratégique non seulement de soutenir les forces anticommunistes, mais également de recueillir des renseignements sur les intentions à long terme de Jonas Savimbi pour le paysage politique angolais.\n\nCet engagement nous permettra de plaider en faveur d'une résolution qui favorise la paix et la stabilité en Angola, en alignant nos efforts sur des objectifs géopolitiques plus larges. En renforçant notre soutien politique à l'UNITA, nous pouvons renforcer notre position dans la région tout en faisant pression pour des politiques qui garantissent que nos intérêts stratégiques soient effectivement priorisés et promus."
 CIA_ANG.58.desc:0 "Fait notable, l'UNITA a signalé son rejet des pourparlers de paix soutenus par les États-Unis concernant le conflit en cours en Angola. Cette décision intervient à un moment crucial où l'intérêt du public pour le conflit angolais diminue, ce qui incite notre administration à réévaluer notre stratégie dans la région. Le refus de l'UNITA de s'engager limite notre capacité à soutenir les forces anticommunistes et sape nos efforts visant à promouvoir la stabilité en Angola.\n\nCe revers soulève des questions sur les intentions à long terme de Jonas Savimbi concernant le paysage politique angolais et complique notre approche politique dans la région. Sans dialogue, nous sommes confrontés à des difficultés accrues pour rallier le soutien du Congrès aux initiatives visant à favoriser la paix et à contrer l'influence communiste. Alors que nous évoluons dans cette évolution, il devient impératif d'explorer des stratégies alternatives qui correspondent à nos objectifs géopolitiques, en veillant à ce que notre engagement à promouvoir la démocratie et la stabilité en Angola reste une priorité au milieu de ces complexités."
 CIA_ANG.59.desc:0 "Alors que la guerre en Angola continue de dégénérer en une impasse sanglante, les appels se multiplient en faveur d'un cessez-le-feu et d'un règlement négocié du conflit négocié par les grandes puissances. Ce sujet a été abordé entre le chef de l'UNITA, Jonas Savimbi, et le président lors de la récente visite de Savimbi à la Maison Blanche pour rallier le soutien du public à sa cause. Après de nouvelles discussions, Savimbi s'est montré ouvert à négocier avec le Mouvement populaire pour la libération de l'Angola (MPLA). Cependant, on ne sait pas vraiment si les dirigeants du MPLA ont ou non un soutien en faveur d'un cessez-le-feu, et encore moins ce que La Havane et Moscou, les partisans du MPLA, pensent des négociations potentielles étant donné le soutien et la main d'oeuvre importants que Cuba a envoyés en Angola pour soutenir le MPLA. Nous attendons maintenant une réponse de Luanada et voyons si les négociations débuteront sérieusement ou non."
 CIA_ANG.60.desc:0 "Le gouvernement communiste de l'Angola, le Mouvement populaire pour la libération de l'Angola (MPLA), a accepté nos appels à des pourparlers de paix avec l'Union nationale pour l'indépendance totale de l'Angola (UNITA) de Jonas Savimbi. Cette décision marque un tournant important dans le conflit prolongé qui ravage le pays, signalant une volonté potentielle d'explorer des solutions diplomatiques dans un contexte de pressions continues tant au niveau national qu'international.\n\n Reconnaissant le besoin urgent de stabilité et les coûts croissants de la poursuite de la guerre, le MPLA cherche à engager des discussions qui pourraient ouvrir la voie à un cessez-le-feu et ouvrir la voie à la réconciliation. Cette initiative correspond à nos intérêts stratégiques dans la région, car favoriser le dialogue peut contribuer à atténuer l'influence des acteurs extérieurs et à prévenir une nouvelle escalade de la violence.\n\nAlors que le MPLA entre dans ces pourparlers, nous surveillerons de près son engagement en faveur de véritables négociations. Le succès de ce dialogue dépendra de la capacité du MPLA à répondre aux demandes de l'UNITA pour une plus grande représentation politique et un engagement en faveur des processus démocratiques. En soutenant cette initiative, nous espérons promouvoir une résolution pacifique qui honore les aspirations du peuple angolais tout en préservant nos objectifs anticommunistes dans la région."
 CIA_ANG.61.desc:0 "Le gouvernement communiste de l'Angola, le Mouvement populaire pour la libération de l'Angola (MPLA), a rejeté les appels à des pourparlers de paix avec l'Union nationale pour l'indépendance totale de l'Angola (UNITA) de Jonas Savimbi. Cette décision reflète la détermination du MPLA à maintenir sa position face à ce qu'il considère comme une opposition fragmentée et une menace pour sa gouvernance. \n\nEn refusant d'engager le dialogue, le MPLA montre son engagement à poursuivre les efforts militaires pour consolider son contrôle sur le pays. Les dirigeants estiment que les négociations avec l'UNITA pourraient saper leur autorité et enhardir les forces rebelles, compliquant ainsi les efforts visant à restaurer la stabilité en Angola. \n\nAlors que les tensions persistent, le MPLA est prêt à résister à la fois aux dissidences nationales et aux pressions internationales, donnant la priorité à son programme plutôt qu'à d'éventuels compromis. Cette position souligne non seulement la complexité du conflit, mais soulève également des inquiétudes quant à l'impact humanitaire actuel sur la population angolaise, alors que la perspective d'une résolution pacifique continue de s'estomper."
 CIA_ANG.63.desc:0 "Le gouvernement communiste de l'Angola, le Mouvement populaire pour la libération de l'Angola (MPLA), a officiellement entamé des pourparlers de paix avec l'Union nationale pour l'indépendance totale de l'Angola (UNITA) de Jonas Savimbi. Cette évolution marque un moment crucial dans le conflit prolongé, alors que les deux parties se réunissent dans le but de trouver un terrain d'entente. \n\nPour le MPLA, s'engager dans ces négociations reflète une reconnaissance du besoin urgent de stabilité et des avantages potentiels de la diplomatie par rapport à la poursuite de la guerre. Les pourparlers offrent l'occasion d'aborder des questions clés, notamment un éventuel cessez-le-feu et les réformes politiques nécessaires qui pourraient renforcer la gouvernance et la confiance du public. \n\nL'UNITA, pour sa part, y voit une opportunité vitale de défendre ses aspirations politiques et d'assurer une plus grande représentation. Au fur et à mesure que les discussions progressent, les deux parties devront gérer leurs différences tout en travaillant à une solution collaborative. Le succès de cette initiative dépendra en fin de compte de leur volonté de faire des compromis et de parvenir à une solution pacifique qui réponde aux espoirs du peuple angolais."
 CIA_ANG.64.desc:0 "Alors que le conflit en Angola est dans l'impasse et qu'aucune des parties n'a réalisé de progrès significatifs ces derniers mois, nos principaux diplomates ont conclu qu'une approche pratique était nécessaire pour aller de l'avant. À la lumière de l'impasse, il devient de plus en plus clair qu'un cessez-le-feu est essentiel pour éviter de nouvelles dévastations et de nouvelles pertes en vies humaines. Après mûre réflexion, nos diplomates recommandent la création d'un gouvernement de coalition dirigé par le Mouvement populaire de libération de l'Angola (MPLA). \n\nCette proposition vise à créer un cadre politique plus inclusif qui reconnaît la dynamique complexe en jeu en Angola. En permettant au MPLA de prendre les devants, nous pouvons faciliter une transition qui favorise la stabilité tout en incorporant des représentants des factions opposées, dont l'UNITA. Cette coalition pourrait ouvrir la voie à des réformes essentielles et rétablir la confiance au sein de la population, favorisant ainsi un environnement propice à la paix et au redressement à long terme en Angola."
 CIA_ANG.65.desc:0 "Avec les récentes avancées réussies des forces de Savimbi qui ont conduit au cessez-le-feu nouvellement déclaré, nos négociateurs du Département d'État ont lancé des plans pour plaider en faveur d'un gouvernement de coalition d'unité. Cette coalition devrait être dirigée par Jonas Savimbi, aux côtés d'autres membres éminents de l'Union nationale pour l'indépendance totale de l'Angola (UNITA). \n\nConsciente de l'évolution de l'équilibre des pouvoirs, notre équipe estime que positionner Savimbi à la tête de cette coalition pourrait favoriser un paysage politique plus inclusif et faciliter une paix durable en Angola. L'élaboration de ces plans vise à capitaliser sur l'élan créé par les récents progrès de l'UNITA, en soulignant l'importance d'une approche collaborative incluant diverses voix politiques. \n\nSi les négociations progressent vers une résolution pacifique, cette coalition pourrait servir de base à des réformes cruciales et à la stabilité, répondant en fin de compte aux aspirations du peuple angolais et jetant les bases d'un avenir meilleur."
 CIA_ANG.68.desc:0 "Alors que le soutien à l'Union nationale pour l'indépendance totale de l'Angola (UNITA) augmente, le moment est venu de pousser les forces de Savimbi à lancer une nouvelle offensive vers Luanda et à lancer des actions offensives. Nos agents en Angola informeront le commandement de l'UNITA et Jonas Savimbi de notre besoin de voir des progrès crédibles dans la lutte contre le renversement du gouvernement communiste de Luanda pour justifier notre soutien accru et continu à leur organisation. La CIA a également reçu pour instruction d'accroître la présence de nos forces secrètes dans le pays afin de dégrader davantage les capacités arrière des forces du Mouvement populaire pour la libération de l'Angola (MPLA) et de dégrader leurs réseaux logistiques dans la campagne angolaise. Une opération réussie serait une aubaine pour nos références en matière de politique étrangère et justifierait auprès du public américain nos politiques plus incisives en matière de lutte contre la menace du communisme international."
 CIA_ANG.69.desc:0 "Avec le soutien de l'armement lourd américain et le soutien d'autres puissances régionales, le moment est désormais venu, selon la Central Intelligence Agency, de lancer une offensive sur Luanda. Ce sera une bataille âprement menée, mais l'assistance militaire et les conseillers américains accrus ont conduit à une augmentation majeure de nos capacités de combat et les autres alliés du MPLA ont subi de lourdes pertes avec notre nouvel armement lourd. Si nous parvenons à franchir la ligne de front, nous devrions être en mesure de réaliser des progrès rapides dans tout le pays. Le but final de cette offensive est de prendre Luanda. Cela dit, nos responsables de la CIA ont noté que le simple fait d'empiéter sur Luanda ou de l'assiéger ainsi que d'autres zones urbaines majeures suffirait pour être considéré comme un succès et conduirait à une aide militaire américaine supplémentaire pour consolider nos nouvelles positions et continuer à faire pression sur le gouvernement communiste."
 CIA_ANG.70.desc:0 "Maintenant que l'Angola est stabilisé et que l'influence communiste a été éradiquée, le moment est venu de récolter les fruits d'une terre aussi riche en ressources naturelles. Le nouveau gouvernement a accordé des permis et des droits sur les ressources à diverses sociétés américaines. Les économistes estiment déjà que cela entraînera des gains importants pour les sociétés américaines et contribuera à long terme à stabiliser les prix du pétrole dans l'ouest, compte tenu des projets de développement en cours visant à développer l'énorme potentiel de l'Angola en matière d'industrie pétrochimique. Les critiques ont affirmé que nous agissons simplement comme une puissance néocoloniale, remplaçant la domination portugaise et sud-africaine par celle de nos propres marionnettes, alors que le développement rapide de l'Angola entraînera sûrement une augmentation du niveau de vie et fournira des opportunités d'emploi aux masses."
 CIA_ANG.71.desc:0 "Eh bien, maintenant que nous avons réussi à éliminer l'influence communiste et à stabiliser la nation, une ruée d'investissements étrangers est arrivée dans le pays sous la forme de sociétés américaines cherchant à établir de nouvelles opérations, notamment en ce qui concerne l'exploitation minière et le raffinage du pétrole. Compte tenu des vastes destructions que le pays a subies tout au long de l'indépendance et de la guerre civile qui a suivi, cet investissement est indispensable et bienvenu. Cet investissement nécessitera également des investissements majeurs dans notre infrastructure nationale. Ces mesures sont susceptibles de renforcer notre soutien populaire et d'éroder davantage tout soutien restant aux communistes en marge de la société.\n\nCela dit, nous devons veiller à éviter de tomber dans le piège de la malédiction des ressources et chercher à moderniser d'autres aspects de notre nation et, à terme, à diversifier notre économie en l'éloignant de la simple extraction de ressources. Pour l'instant, il s'agit d'une énorme aubaine pour notre nation récemment réunifiée."
 CIA_ANG.72.desc:0 "Nos relations secrètes avec l'Afrique du Sud sont connues depuis longtemps de Washington. C'est dans cette optique que l'ambassadeur américain nous a présenté une proposition. L'essentiel de l'offre est que nous agirions comme intermédiaire pour que les armes américaines parviennent aux forces des rebelles anticommunistes en Angola en échange d'une assistance militaire supplémentaire et de la gratitude américaine. L'opposition au soutien des rebelles anticommunistes en Angola a entravé le programme du président visant à lutter contre l'expansion du communisme en Afrique. Cette offre comporte peu de coûts et de risques pour notre nation. Nous avons déjà des liens secrets avec plusieurs groupes anticommunistes en Afrique australe et nous entretenons des relations amicales avec Pretoria. Toutefois, si jamais la nouvelle arrivait, cela pourrait nuire aux relations avec les futures administrations américaines. Comment devons-nous procéder ?"
 CIA_ANG.73.desc:0 "Notre ambassadeur en Israël a indiqué qu'Israël avait accepté notre proposition selon laquelle Israël agirait comme intermédiaire pour transférer les armes américaines aux forces anticommunistes en Angola. C'est une excellente nouvelle et cela nous offre enfin une voie alternative pour commencer à lutter contre le communisme en Angola. Bientôt, des armes seront rapidement distribuées aux forces de Savimbi et à d'autres milices alliées en Angola et dans les environs. En outre, Israël a également noté sa volonté de coordonner davantage ses efforts concernant l'Afrique du Sud et de mener ultérieurement des négociations dans la région. Néanmoins, nous devons veiller à ce que le Congrès et le grand public restent ignorants de cet arrangement étant donné la légalité douteuse de l'ensemble de ce projet."
 CIA_ANG.74.desc:0 "Notre ambassadeur en Israël a répondu qu'Israël avait confirmé qu'il n'avait pas l'intention de transporter des armes américaines en Angola pour contourner nos propres lois. Ceci est plutôt surprenant étant donné les liens étroits entre Israël et l'Afrique du Sud et leur volonté générale de servir de mandataire pour nos campagnes d'armement dans d'autres pays. Néanmoins, le conseiller juridique en chef de la Maison Blanche a exprimé son soulagement face au rejet de l'affaire, affirmant que la proposition était toujours probablement illégale au départ et constituait une violation flagrante de l'amendement Clark. Malheureusement, cela signifie que soit le Congrès doit agir sur l'Amendement Clark, soit que nous envisageons d'autres stratégies, certainement illégales, pour soutenir les forces anticommunistes en Angola."
 CIA_ANG.75.desc:0 "Nos opérations de combat contre le Mouvement populaire pour la libération de l'Angola (MPLA) et leurs alliés cubains se sont révélées très coûteuses en matériel. Heureusement, des livraisons d'armes américaines ont récemment commencé à arriver via les services de renseignement israéliens. Alors que le Congrès américain avait empêché le Président de soutenir directement notre cause par une aide matérielle, il semblerait que Washington ait trouvé une autre voie pour acheminer du matériel à nos combattants. Avec un soutien renouvelé, nous devrions certainement avoir la capacité de conserver notre territoire actuel et de commencer à élaborer des plans de contre-offensives à l'avenir. Espérons que des actions militaires décisives de notre part susciteront un plus grand soutien aux États-Unis et conduiront éventuellement à une aide encore plus meurtrière, notamment en termes d'équipements lourds qui pourraient être utilisés pour contrer les forces cubaines."
 
 CIA_ANG.24.desc:0 "Suite aux tensions croissantes entre les différentes parties impliquées dans la guerre civile angolaise, l'Afrique du Sud a de nouveau lancé une intervention armée en Angola. Plus tôt dans le conflit, Pretoria a lancé une tentative ratée de s'emparer de Luanda en coordination avec le Zaïre et les forces rebelles alignées sur le Zaïre. Cuba a fermement condamné cette décision, la qualifiant de nouvelle escalade d'une puissance raciste et impérialiste qui doit être reléguée dans les cendres de l'histoire. Une rhétorique similaire a été reprise par d'autres dirigeants et mouvements de gauche africains. La communauté internationale au sens large et le mouvement anti-apartheid ont également critiqué Pretoria pour sa nouvelle intervention armée en Angola et ses appels répétés aux deux parties pour qu'elles se désengagent et recherchent la diplomatie. De l'autre côté, les États-Unis ont refusé de commenter l'opération en cours, déclenchant des rumeurs de collaboration américaine avec l'Afrique du Sud sur l'intervention."
 CIA_ANG.30.desc:0 "Le dirigeant cubain [CUB.GetLeader], dans un discours enflammé à La Havane aujourd'hui, a dénoncé les demandes américaines visant à ce que Cuba retire ses forces d'Angola. [CUB.GetLeader] a doublé sa rhétorique antérieure selon laquelle les États-Unis agissent simplement dans l'intérêt des puissances commerciales cherchant à prendre le pétrole de l'Angola au profit des puissances impérialistes. Depuis le début de la guerre civile angolaise, Cuba a envoyé des dizaines de milliers de soldats en Angola dans le but de soutenir le gouvernement du Mouvement populaire pour la libération de l'Angola (MPLA) contre celui de ses rivaux armés, en particulier l'Union nationale pour l'indépendance totale de l'Angola (UNITA), dirigée par l'éminent chef de la guérilla Jonas Savimbi. Compte tenu de la probabilité croissante d'une intervention américaine ouverte en Angola, il faut maintenant se demander quel impact cette décision de Cuba aura sur une éventuelle intervention américaine ou entraînera une escalade de la part de La Havane et de Moscou."
 CIA_ANG.31.desc:0 "Dans un geste surprenant, le dirigeant cubain [CUB.GetLeader] a annoncé le retrait des forces cubaines d'Angola. Cela s'inscrit dans le contexte des demandes américaines visant à ce que les forces cubaines quittent le pays sous peine de subir des conséquences désastreuses en Angola et à Cuba. Avant la fin de la guerre d'indépendance angolaise et le début de la guerre civile angolaise, le Mouvement populaire communiste pour la libération de l'Angola (MPLA) se trouvait dans une situation précaire et assiégé de toutes parts par des ennemis nationaux et étrangers. L'intervention des forces cubaines a été décisive pour permettre au MPLA de s'emparer de la capitale Luanda et de s'établir comme gouvernement légitime, ainsi que d'empêcher une campagne conjointe de l'Afrique du Sud et du Zaïre de prendre le contrôle de la nation. Le départ des forces cubaines d'Angola constitue un coup dur pour le MPLA et affaiblira sûrement son emprise sur le pouvoir dans tout le pays, en prévision d'une éventuelle intervention américaine."
 CIA_ANG.32.desc:0 "Suite à une série d'efforts diplomatiques américains pour influencer le conflit en cours en Angola, le président américain [USA.GetLeader] a annoncé aujourd'hui la formation d'une « Coalition des volontaires » pour intervenir en Angola. Tandis que plusieurs alliés américains dans la région, notamment le Zaïre et l'Afrique du Sud, ont fait écho aux affirmations américaines selon lesquelles les forces cubaines et gouvernementales en Angola auraient utilisé des armes chimiques contre les forces du mouvement rebelle de l'Union nationale pour l'indépendance totale de l'Angola, mais ont été démenties par Cuba et l'Union soviétique. Le dirigeant angolais [ANG.GetLeader] a également rejeté ces affirmations, mais n'a pas encore permis aux observateurs internationaux d'évaluer ces affirmations. Plus près de chez nous, le public américain a réagi favorablement à cette annonce, mais a été scruté de près par de vastes pans de la communauté internationale. Le temps nous dira si l'un des alliés américains de l'OTAN se joindra à la prochaine opération en Angola, ce qui signifie que les jours d'un Angola communiste pourraient très bien être limités."
 CIA_ANG.34.desc:0 "Le Pentagone a annoncé le lancement de l'opération Angolan Freedom. Alors que les États-Unis mènent l'opération, divers alliés régionaux américains ont déclaré leur soutien et leur participation à l'opération en soutien à l'Union nationale pour l'indépendance totale de l'Angola (UNITA) de Jonas Savimbi. Cela dit, la condamnation internationale est venue de l'Union soviétique, de l'Allemagne de l'Est, du Mouvement des non-alignés et, plus clairement, du leader cubain [CUB.GetLeader]. Bien qu'elle ne soit pas directement impliquée dans l'opération, l'Afrique du Sud a salué cette décision comme un retour à la raison et une décision décisive pour contenir l'influence communiste en Afrique australe. Le temps nous dira dans quelle mesure cette décision affecte la stabilité dans toute la région, ainsi que son impact sur la guerre frontalière sud-africaine entre l'Afrique du Sud et la South West Africa People's Organisation (SWAPO), qui est en grande partie basée dans le sud de l'Angola."
 CIA_ANG.41.desc:0 "Lors d'une conférence de presse controversée aujourd'hui, le président américain [USA.GetLeader] a affirmé que le Mouvement populaire pour la libération de l'Angola (MPLA) et les forces cubaines en Angola avaient utilisé des armes chimiques contre les forces séparatistes du Cabinda dans l'enclave pétrolière de l'Angola. Les gouvernements MPLA d'Angola, de Cuba et de l'Union Soviétique ont tous dénoncé cette annonce comme étant une propagande colonialiste tandis que l'Afrique du Sud, le Zaïre et d'autres gouvernements africains amis de l'Occident ont publié des déclarations soutenant ces affirmations. Tout cela survient alors que les États-Unis auraient étendu leurs opérations de renseignement en Angola et qu'il y aurait une augmentation notable des appels à l'indépendance du Cabinda de la part de divers groupes activistes internationaux. Cet ensemble d'actions a également soulevé de sérieuses questions quant à savoir si une action militaire sera ou non entreprise au Cabinda par les États-Unis ou d'autres alliés régionaux américains dans la région, en particulier le Zaïre."
 CIA_ANG.46.desc:0 "Le Pentagone a annoncé le début de l'opération Cabindan Freedom. L'objectif de l'opération, selon un porte-parole du Pentagone, est d'établir un gouvernement indépendant dans l'enclave et de transférer le leadership politique à la population opprimée locale. Luis Ranque Franque, leader du Front séparatiste pour la libération de l'enclave de Cabinda (FLEC), a annoncé le soutien et la coopération ferme de son organisation à l'intervention américaine. Des rapports font déjà état d'une déroute des forces cubaines et angolaises de l'enclave ainsi que de la prise de contrôle par le FLEC de plusieurs villages à l'intérieur du Cabinda. L'Union soviétique a condamné cette décision, la considérant comme un nouvel exemple du colonialisme américain, mais n'a montré aucun intérêt pour des représailles ouvertes à l'intervention."
 CIA_ANG.49.desc:0 "Le président américain [USA.GetLeader] lors d'une visite dans la capitale du Cabinda nouvellement indépendant, Cabinda a rencontré le leader du Front de libération de l'enclave du Cabinda (FLEC), Luis Ranque Franque, où les deux hommes ont annoncé la création officielle de la République de Cabinda avec Franque comme président de la république nouvellement reconnue. Alors que les nationalistes cabindais avaient déjà déclaré leur indépendance avec Franque comme président, c'est la première fois qu'une puissance internationale légitime formellement son règne sur le petit État africain. La France, l'Afrique du Sud et le Zaïre ont également envoyé des dignitaires au Cabinda pour établir des relations diplomatiques ainsi que d'éventuels liens commerciaux. Les rumeurs circulent déjà selon lesquelles des sociétés pétrolières américaines et françaises chercheraient à s'implanter au Cabinda."
 CIA_ANG.55.desc:0 "Suite à une invitation du Président [USA.GetLeader], Jonas Savimbi, leader de l'Union Nationale pour l'Indépendance Totale de l'Angola (UNITA) et célèbre chef rebelle en Angola, est arrivé à Washington DC. La visite de Savimb dans la capitale américaine et sa rencontre avec le président visent à accroître la légitimité et le soutien à l'UNITA alors que la guerre civile continue de faire rage en Angola. L'UNITA contrôle une grande partie de l'Angola, en particulier dans la partie sud-est de ce pays africain assiégé. L'UNITA est aux prises avec le Mouvement populaire pour la libération de l'Angola (MPLA) au pouvoir et ses alliés cubains depuis la fin de la guerre d'indépendance de l'Angola contre le Portugal au début des années 1970. Le président [USA.GetLeader] a été un fervent partisan de l'UNITA de Savimbi et a appelé le Congrès à augmenter l'aide militaire à la guérilla et la réunion avec Savimbi vise clairement à faire pression sur le Congrès pour qu'il augmente son financement."
 CIA_ANG.62.desc:0 "Suite à d'intenses campagnes de pression internationale et à la coercition de Washington, le Mouvement populaire pour la libération de l'Angola (MPLA) et l'Union nationale pour l'indépendance totale de l'Angola (UNITA), dirigée par le célèbre guérillero Jonas Savimbi, ont accepté des pourparlers de paix pour mettre fin à la guerre civile angolaise. C'est une victoire majeure pour la diplomatie et pour la politique étrangère du Président [USA.GetLeader]. L'acceptation par l'UNITA de pourparlers de paix n'était pas une décision surprenante étant donné le soutien de Wasington au groupe. Cependant, l'accord du MPLA constitue une surprise majeure non seulement pour la communauté internationale dans son ensemble, mais aussi pour le fidèle allié du MPLA, Cuba, qui n'a apparemment pas été informé à l'avance de l'accord de cessation des hostilités. Cela dit, l'avenir de l'Angola reste incertain et il reste à voir si cela deviendra un moment charnière pour le processus de paix en Afrique australe ou simplement un cessez-le-feu temporaire dans un conflit qui dure depuis des décennies."
 CIA_ANG.66.desc:0 "À la suite de longs pourparlers de paix entre le Mouvement populaire pour la libération de l'Angola (MPLA) et l'Union nationale pour l'indépendance totale de l'Angola (UNITA), ainsi que d'élections nationales, il a été convenu que le MPLA dirigerait un gouvernement de coalition nationale au cours des prochaines années, le temps que la nation établisse une nouvelle constitution et un nouveau système électoral. Grâce à cela, le MPLA a enfin formellement établi une légitimité internationale et devrait dissuader tout soutien supplémentaire au conflit armé dans le pays. Cependant, le chef de l'UNITA, Jonas Savimbi, n'a pas encore commenté officiellement le nouveau gouvernement dirigé par le MPLA. Reste à savoir si cela représente un véritable début de démocratie angolaise ou un retour au conflit armé ou à l'autocratie."
 CIA_ANG.67.desc:0 "À la suite de longs pourparlers de paix entre le Mouvement populaire pour la libération de l'Angola (MPLA) et l'Union nationale pour l'indépendance totale de l'Angola (UNITA), ainsi que d'élections nationales, il a été convenu que l'UNITA dirigerait un gouvernement de coalition nationale au cours des prochaines années, le temps que la nation établisse une nouvelle constitution et un nouveau système électoral. La longue quête de pouvoir de Jonas Savimbi en Angola a ainsi abouti à une conclusion étonnamment réussie. Le nouveau gouvernement a ordonné aux forces cubaines présentes dans le pays ainsi qu'aux conseillers de l'Allemagne de l'Est et de l'Union soviétique d'évacuer immédiatement le pays. Reste à savoir si cela et les membres les plus radicaux du MPLA accepteront le nouveau gouvernement de coalition dirigé par l'UNITA. Cela dit, cela pourrait enfin mettre un terme au conflit qui dure depuis des décennies en Angola."
 
 #South Africa Route A
 CIA_SAF80.0.desc:0 "L'Afrique du Sud est depuis longtemps notre partenaire stratégique clé dans la lutte contre le communisme en Afrique australe. Malheureusement, leur pratique continue de l'apartheid a rendu notre soutien à l'Afrique du Sud difficile et controversé, c'est le moins qu'on puisse dire. Pire encore, cette politique a provoqué une résistance généralisée contre le gouvernement sud-africain. Comme si cela ne suffisait pas, l'opposition en Afrique du Sud est fortement influencée par les communistes, notamment au sein du Congrès national africain (ANC) et de leurs alliés au sein du Parti communiste sud-africain (SACP). Il reste essentiel pour notre cause que l'Afrique du Sud reste une puissance anticommuniste influente dans la région et puisse contrecarrer la vague montante du communisme en Afrique australe. Cependant, nous devons également équilibrer les préoccupations chez nous et parmi nos alliés quant au potentiel de réforme de l'Afrique du Sud, tout en trouvant une voie à suivre sur l'autre question controversée, moins connue, de l'Afrique du Sud, son vaste programme d'armes de destruction massive."
 CIA_SAF80.1.desc:0 "Alors que notre appareil de renseignement adopte une position plus prudente à l'égard de l'Afrique du Sud, notre administration a décidé qu'il fallait accorder davantage d'attention au suivi du programme sud-africain d'armes de destruction massive. Nos sources ont indiqué que l'Afrique du Sud, outre son programme secret d'armes nucléaires, possède également d'importants stocks d'armes chimiques et éventuellement biologiques. Compte tenu de la nature du gouvernement et de l'instabilité croissante, voire du désespoir du gouvernement, nous devons nous assurer de connaître l'emplacement des installations et du stockage afin de garantir que, dans le pire des cas, nous ayons la capacité de sécuriser les sites avant leur capture par l'opposition ou leur utilisation par le gouvernement dans certains scénarios. Permettre à l'Afrique du Sud de déployer des armes nucléaires, même dans un environnement plus contrôlé, serait préjudiciable à la stabilité régionale et doit faire l'objet d'une enquête plus approfondie."
 CIA_SAF80.2.desc:0 "L'amendement Boland constitue depuis longtemps un obstacle majeur aux objectifs de politique étrangère du gouvernement. Notre administration cherche des voies alternatives pour financer les Contras, d'autant plus que le Congrès refuse de céder à nos appels à l'abrogation de l'Amendement Boland. Une nouvelle proposition, défendue par certains au sein des agences de renseignement, consiste à demander à l'Afrique du Sud d'aider à former et à équiper les Contras en échange de notre soutien continu à leur régime malgré le tollé international en cours et les efforts de sanctions contre l'apartheid. Des préoccupations juridiques ont été soulevées à propos de cette proposition, tandis que d'autres ont souligné des préoccupations morales quant à l'approfondissement de nos liens avec Pretoria et, en substance, à leur donner un moyen de pression sur notre gouvernement. Cependant, cela pourrait être un moyen efficace d'apporter un soutien aux Contras, si l'Afrique du Sud l'accepte tout en respectant techniquement l'amendement Boland. Cela dit, le public n'apprécierait pas cet accord s'il était révélé. Comment devons-nous procéder pour envoyer l'offre ?"
 CIA_SAF80.3.desc:0 "Une proposition intéressante a retenu notre attention plus tôt dans la journée de la part de l'ambassadeur américain. L'ambassadeur a noté que le soutien à l'Afrique du Sud était controversé aux niveaux national et international pour les États-Unis, mais que ce n'était pas la seule cause controversée. La discussion a évolué vers une comparaison de notre lutte contre le communisme aux Contras du Nicaragua. En fin de compte, la proposition est qu'en échange de notre aide à l'approvisionnement et à la formation des combattants Contra, les États-Unis chercheraient à saper davantage l'embargo en vigueur contre nous et intensifieraient leurs tentatives aux Nations Unies pour défendre notre régime et fourniraient secrètement les munitions, le carburant et les équipements à double usage nécessaires. Le plan est censé être légal, même si cela nous préoccupe peu, les caprices du public américain le sont. En acceptant cette proposition, nous céderions sûrement peu en échange d'un soutien. Toutefois, si l'administration actuelle tombait et que ce projet était révélé, cela entraînerait probablement des sanctions plus sévères contre notre économie. Comment devons-nous procéder ?"
 CIA_SAF80.4.desc:0 "L'Afrique du Sud a accepté notre proposition de coopération accrue en échange de son soutien, de la formation et de l'armement des Contras. Tout en exprimant son inquiétude quant à la manière dont une telle décision sera prise par la communauté internationale lorsqu'elle sera inévitablement révélée, Pretoria a exprimé sa gratitude pour cette opportunité et a noté qu'elle commencerait immédiatement à élaborer des plans sur la manière d'exfiltrer, d'infiltrer et de former correctement les unités Contra aux tactiques d'insurrection. Compte tenu de l'histoire impressionnante de l'Afrique du Sud en matière de guerre contre-insurrectionnelle, cela devrait fournir aux Contras des formateurs crédibles ainsi qu'une voie logistique directe pour les armes et le soutien, et l'alignement idéologique des deux contribuera à garantir que cette relation ne se rompe pas dans un avenir imminent. Nous devons maintenant respecter notre part du marché et travailler à affaiblir les efforts de sanctions sud-africains et fournir à l'Afrique du Sud une assistance militaire supplémentaire."
 CIA_SAF80.5.desc:0 "Malheureusement, l'Afrique du Sud a rejeté notre proposition Contra. Même si les Sud-Africains ont indiqué qu'ils appréciaient l'offre, ils estimaient qu'elle serait trop controversée si elle était dévoilée au public américain et qu'elle mettrait davantage en danger le soutien à leur gouvernement par les futures administrations américaines. Des inquiétudes ont également été exprimées quant à la légalité de cette décision, compte tenu de la loi américaine et, étant donné les liens étroits actuels entre Pretoria et Washington, des inquiétudes ont été exprimées quant à de nouvelles tensions dans les relations. Dans l'ensemble, ce projet dans son ensemble était en fait un projet de longue haleine, nous devrons soit envisager d'abandonner le soutien aux Contras, soit rechercher d'autres programmes de financement alternatifs. Une proposition récente a effectivement évoqué la possibilité de vendre des armes à l'Iran et d'utiliser ensuite ces fonds pour équiper les Contras. C'est peut-être aussi une piste qui mérite d'être explorée dans un avenir proche."
 CIA_SAF80.6.desc:0 "Suite à l'accord sud-africain visant à renforcer les Contras, l'administration a commencé à réfléchir aux moyens de saper davantage l'embargo sud-africain. Pour y parvenir, nous cherchons activement à faire pression sur les groupes sanctionnant et boycottant par le biais de la procédure judiciaire, même s'il est peu probable qu'un projet de loi soit adopté par le Congrès à ce sujet, l'administration a tiré parti de nos relations avec divers législateurs d'État pour pénaliser les groupes réclamant de telles mesures. En outre, nous avons pris des mesures pour encourager les investissements des entreprises en Afrique du Sud et lancerons une campagne de pression contre les pays européens ciblant l'économie sud-africaine. Nos alliés au Congrès prévoient également de modifier les prochains projets de loi agricoles et de crédits afin d'inclure un financement et une exemption pour les efforts visant à établir des liens commerciaux plus solides avec l'Afrique du Sud. Toutes ces mesures devraient servir à saper l'embargo sud-africain et le mouvement mondial de sanctions tout en évitant d'enfreindre les lois américaines ou de trop perturber le Congrès."
 CIA_SAF80.7.desc:0 "Les États-Unis ont respecté leur part du marché et ont lancé des efforts pour contourner l'embargo international à notre encontre. Diverses mesures ont été prises. L'administration a notamment pris des mesures drastiques contre les dissidents nationaux qui ciblent notre État, en demandant même d'interdire l'organisation des efforts de boycott et d'encourager les entreprises américaines à investir dans nous. Alors que la portée de l'Amérique pour influencer les autres pays appliquant des embargos est limitée, Washington a lancé une campagne douce contre cet effort et cherche des alliés avec lesquels travailler sur cette question. Pourtant, l'affaiblissement des efforts privés américains visant à instaurer des sanctions et des boycotts a déjà entraîné un léger choc économique et nos économistes prédisent que cela, ainsi que l'aide promise dans la législation à venir, contribueront à revitaliser notre économie en proie aux sanctions."
 CIA_SAF80.9.desc:0 "Suite aux réactions négatives du public face à notre soutien à l'Afrique du Sud lors de son intervention en Angola au début des années 1970 et à la question persistante de l'apartheid, les transferts manifestes d'équipement militaire vers l'Afrique du Sud ne sont pas possibles à l'heure actuelle. Cependant, l'administration a décidé de fournir à l'Afrique du Sud des modèles d'équipements plus anciens par l'intermédiaire d'intermédiaires à des prix réduits. Bien que cela soit juridiquement douteux, nous utiliserons des militaires et des services de renseignement à la retraite qui sont alignés sur l'administration pour travailler comme intermédiaires avec les Sud-Africains et chercher à rediriger les bénéfices vers d'autres causes auxquelles le Congrès refuse de financer malgré nos demandes répétées. Cela dit, nous devons nous efforcer de garder cela aussi secret que possible, compte tenu non seulement des préoccupations intérieures, mais aussi des réactions géopolitiques qu'une telle révélation provoquerait."
 CIA_SAF80.10.desc:0 "Alors que notre soutien à l'Afrique du Sud devient de plus en plus controversé, il est plus important que jamais de garder un oeil sur le mouvement anti-apartheid et d'envisager de le supprimer, en particulier en Europe. Pour y parvenir, la Central Intelligence Agency, en collaboration avec nos partisans en Europe occidentale, cherchera à collecter des informations incriminantes et à intimider les principaux militants pour qu'ils se conforment et cherchera à diffuser de la désinformation à travers le mouvement pour provoquer des luttes intestines. Compte tenu de l'intersectionnalité du mouvement avec d'autres causes de gauche, l'accentuation des différences idéologiques et l'escalade des tensions sur les questions de genre et de sexualité pourraient également s'avérer fructueuses. Il est préoccupant de constater que non seulement le grand public de ces pays est contre l'Afrique du Sud, mais qu'il soutient également le Congrès national africain (ANC), souvent également financièrement, notamment en Suède, qui est un leader clé du mouvement anti-apartheid, dont le gouvernement finance ouvertement l'ANC."
 CIA_SAF80.11.desc:0 "Olof Palme, le Premier ministre suédois, est depuis longtemps une épine dans notre pied en ce qui concerne nos objectifs stratégiques en Afrique du Sud. Compte tenu de sa popularité incontestée en Suède, il est peu probable que Palme quitte ses fonctions de si tôt. Pire encore que les discours publics de Palme contre l'apartheid et notre politique à l'égard de l'Afrique du Sud, la Suède, sous Palme, est devenue l'un des principaux financiers du Congrès national africain (ANC). Compte tenu du préjudice qu'il a causé à nos objectifs stratégiques en Afrique, la décision a été prise de retirer Palme du conseil d'administration. Nos collaborateurs locaux surveilleront Palme lors de sa prochaine sortie sans sécurité et l'abattrons tout en s'exfiltrant rapidement de la situation pour éviter toute trace de notre implication. Heureusement, les services de sécurité de Palme sont incroyablement laxistes et sortent régulièrement avec sa femme sans la présence de gardes du corps. "
 CIA_SAF80.12.desc:0 "Nos efforts pour trouver des financements pour l'Afrique du Sud, les Contras et d'autres causes controversées que le Congrès refuse de financer ont conduit notre administration dans des situations douteuses. Personne ne s'attendait probablement, sous cette administration, à ce que la Central Intelligence Agency (CIA) vende du crack et d'autres drogues dans les zones minoritaires pour financer l'Afrique du Sud et les Contras, et pourtant nous y sommes. Heureusement, les médias n'ont pas eu la moindre idée de ce qui se passait, en dehors des affirmations marginales des théoriciens du complot selon lesquelles nous vendons du crack qui alimente la crise de la drogue dans les centres-villes. Notre dernière levée de fonds servira à financer les efforts de l'armée sud-africaine visant à rétablir l'ordre en Afrique du Sud-Ouest, également connue sous le nom de Namibie, et à repousser les insurgés angolais, cubains et namibiens qui occupent certaines parties de la région. Nos récents efforts en matière de drogue se sont révélés encore plus rentables depuis que l'Afrique du Sud a aidé à soutenir les Contras. Le fait que les Contras deviennent une force plus forte a conduit à une augmentation du trafic de drogue entre le Nicaragua et les États-Unis, ce qui a permis de poursuivre nos objectifs de financement. Cela dit, la Drug Enforcement Agency (DEA) est à bout de nerfs face à l'afflux de drogues après plusieurs appels rapprochés entre des agents de la DEA enquêtant sur des agents déguisés de la CIA faisant du trafic de drogue."
 CIA_SAF80.13.desc:0 "Depuis des années, nous collaborons secrètement avec l'Afrique du Sud, notamment dans le domaine du renseignement. Compte tenu de la fiabilité de Pretoria ces dernières années dans sa collaboration avec notre gouvernement pour contenir le communisme en Afrique subsaharienne, la décision a été prise d'intensifier la collaboration en matière de renseignement avec l'Afrique du Sud. Pendant des années, nous avons caché des informations sur divers dissidents et certaines personnalités régionales, des détails et d'autres renseignements selon lesquels les administrations précédentes s'inquiétaient de la manière dont l'Afrique du Sud utiliserait ces données. Compte tenu de la menace croissante du communisme dans la région et des relations de travail plus étroites entre l'Afrique du Sud et nous, cela n'est plus considéré comme une raison justifiée pour retenir des informations de renseignement. Un programme de formation conjoint pour aider au perfectionnement des forces d'opérations noires d'élite d'Afrique du Sud a également été autorisé dans le but de renforcer les efforts sud-africains en Afrique du Sud-Ouest et en Angola dans la lutte contre le Mouvement populaire pour la libération de l'Angola (MPLA) et l'Organisation populaire de l'Afrique du Sud-Ouest (SWAPO)."
 CIA_SAF80.14.desc:0 "Bien que pour le moins peu recommandable, le gouvernement sud-africain représente le dernier bastion de l'anticommunisme en Afrique australe. La décision du gouvernement sud-africain d'approfondir sa collaboration avec son soutien aux Contras a représenté une étape majeure dans nos relations avec Pretoria. L'alignement plus complet de l'Afrique du Sud sur nos intérêts a conduit notre administration à redoubler d'efforts pour soutenir l'Afrique du Sud, en fournissant une assistance économique et militaire étendue au gouvernement assiégé internationalement. Bien que politiquement controversée, la décision de renforcer Pretoria a porté ses fruits en termes de progrès dans la réalisation de nos objectifs stratégiques en Afrique et en Amérique latine. Cela dit, des problèmes demeurent, en particulier sur la manière de traiter le programme nucléaire sud-africain ainsi que la lutte contre le mouvement international anti-apartheid. Le spectre du communisme plane toujours sur l'Afrique du Sud et davantage d'aide sera nécessaire pour assurer la survie du régime."
 CIA_SAF80.15.desc:0 "Depuis des années, nous savons que Pretoria dispose d'un programme d'armes de destruction massive étonnamment bien développé, comprenant une composante nucléaire bien financée. Bien que cela préoccupe beaucoup, le président a décidé d'aider l'Afrique du Sud avec ce programme. Alors que beaucoup hésiteraient normalement à une telle décision, le Conseil national de sécurité a finalement convenu que la capacité de surveiller et de dissuader les aspects les plus préoccupants des programmes de guerre chimique et biologique sud-africains, ainsi que de garantir que les dispositifs et matières nucléaires sont correctement manipulés, l'emportaient sur les risques du programme lui-même. Cela dit, la proposition a été placée sous le plus haut niveau de confidentialité. Si le public en était informé, les conséquences seraient catastrophiques, c'est un euphémisme. Si l'Afrique du Sud accepte, nous aiderons Pretoria à affiner son programme nucléaire, en échange nous lui dicterons de démanteler certains aspects de ses programmes de guerre chimique et biologique et d'établir nos propres personnalités de sécurité sur leurs sites nucléaires."
 CIA_SAF80.16.desc:0 "Une autre offre intéressante est venue des Américains. Cette fois, l'ambassadeur américain a indiqué que Washington était au courant de notre programme de guerre nucléaire, biologique et chimique et, tout en exprimant une inquiétude limitée quant aux éléments biologiques et chimiques, il était plus ou moins d'accord avec le programme nucléaire et offrait son aide dans nos efforts. En particulier, les États-Unis proposent de renforcer notre programme nucléaire en partageant des quantités limitées d'informations techniques et de recherche, ainsi qu'en aidant à sécuriser les sites nucléaires afin d'éviter toute action terroriste visant ces sites. Cependant, ce faisant, nous serions soumis à la surveillance américaine de notre programme d'armement et abandonnerions l'essentiel de notre pouvoir discrétionnaire quant aux programmes développés et dans lesquels nous investissons et nous serions probablement obligés de démanteler certains de nos programmes d'armes biologiques les plus drastiques qui étaient prévus dans le pire des cas. "
 CIA_SAF80.17.desc:0 "Le gouvernement sud-africain a informé notre ambassadeur qu'il accepterait notre proposition concernant son programme d'armes de destruction massive. Bien qu'ils aient hésité à accepter les concessions proposées, notamment en ce qui concerne le démantèlement de certaines parties du programme de guerre chimique et biologique, l'aide technique et sécuritaire liée au programme nucléaire et l'aide visant à maintenir l'existence du programme hors de la lumière du public ont été considérées comme valant les concessions. Vient maintenant la partie la plus difficile : s'assurer que l'Afrique du Sud tienne parole et fournir suffisamment d'aide technique pour maintenir l'Afrique du Sud dans le cap tout en évitant une sérieuse escalade de son programme nucléaire. Ce sera certainement une tâche difficile et devra également être maintenue au niveau le plus confidentiel étant donné la délicatesse politique inhérente à cet accord. Cela représente néanmoins une victoire stratégique pour notre politique sud-africaine visant à rapprocher Pretoria de notre orbite."
 CIA_SAF80.18.desc:0 "Le gouvernement sud-africain a informé notre ambassadeur qu'il rejetterait notre proposition concernant son programme d'armes de destruction massive. La réponse indiquait que même s'ils trouvaient la proposition intrigante et qu'ils appréciaient le vaste soutien que notre administration avait apporté à l'Afrique du Sud, ils ne considéraient pas que les concessions valaient la coopération sur le programme nucléaire. Nos analystes estiment également que cette décision a été en partie alimentée par le désir du gouvernement sud-africain d'éviter de devenir encore plus dépendant de notre soutien et par la possibilité pour nous d'utiliser la coopération comme levier pour imposer de futures concessions à son gouvernement. Même si c'est regrettable, nous devons maintenant aller de l'avant et veiller à ce que les traces de cette offre soient correctement écartées et envisager d'autres options pour gérer le programme nucléaire sud-africain tout en maintenant nos objectifs stratégiques globaux dans la région."
 CIA_SAF80.19.desc:0 "Notre administration a considérablement élargi son soutien à l'Afrique du Sud. Cela dit, certaines mesures prises par Pretoria sont allées trop loin et doivent être maîtrisées en conséquence. Les rapports indiquent que l'Afrique du Sud a probablement déjà la capacité de créer des dispositifs nucléaires fonctionnels et en a probablement fabriqué une poignée. En outre, les programmes de guerre chimique et biologique de l'Afrique du Sud sont étendus et représentent une menace pour la stabilité régionale et mondiale, compte tenu notamment des tensions et de l'instabilité générales en Afrique du Sud. Le président, en accord avec le Conseil de sécurité nationale, a décidé de faire pression sur l'Afrique du Sud pour qu'elle abandonne ses ambitions nucléaires et utilise notre soutien à son gouvernement ces dernières années comme levier pour faire avancer la question. Cependant, si nous bluffons, nous n'aurons que peu d'options réelles pour donner suite à nos menaces, étant donné le rôle crucial de l'Afrique du Sud dans nos buts et objectifs stratégiques régionaux."
 CIA_SAF80.20.desc:0 "Les Américains en ont apparemment appris davantage sur notre programme d'armes nucléaires que nous l'avions initialement prévu. Même si nous savions qu'ils en étaient au courant, nous ignorions qu'ils connaissaient toute l'étendue de nos capacités. L'ambassadeur américain a relayé aujourd'hui une demande de Washington d'abandonner nos activités nucléaires et de démanteler notre stock actuel de dispositifs nucléaires. L'ambassadeur a également fait part de ses inquiétudes selon lesquelles la poursuite du programme nucléaire pourrait conduire à une rupture complète des liens entre Washington et Pretoria si le Congrès apprenait l'existence du programme. Cela met notre gouvernement dans une situation difficile. D'une part, nous avons investi des ressources considérables dans le programme et le considérons comme l'un des outils ultimes pour dissuader une potentielle guerre civile ou une invasion étrangère. D'un autre côté, la perte du soutien américain pourrait condamner notre gouvernement et notre peuple. Comment devons-nous procéder ?"
 CIA_SAF80.21.desc:0 "Heureusement, notre ambassadeur à Pretoria nous a informés que le gouvernement sud-africain a accepté de suspendre son programme d'armes nucléaires. Il s'agit d'une victoire majeure pour la politique sud-africaine de notre administration. Même si le grand public ne sera pas informé de l'existence ou de l'arrêt du programme nucléaire sud-africain, nous pouvons être assurés que notre politique d'engagement constructif avec Pretoria porte ses fruits. Malheureusement, si le public était au courant du programme nucléaire sud-africain, nous serions encore plus poussés à sévir contre l'Afrique du Sud et à rompre tous les liens. Comme cela reste inacceptable pour nos objectifs stratégiques dans la région, nous devons veiller à ce que toutes les traces liées au programme soient correctement couvertes et cachées au public et aux journalistes."
 CIA_SAF80.22.desc:0 "Malheureusement, notre ambassadeur à Pretoria nous a informés que le gouvernement sud-africain a refusé de suspendre son programme d'armes nucléaires. C'est une nouvelle désastreuse pour la politique étrangère de l'administration et nous place désormais dans une situation encore pire en ce qui concerne l'Afrique du Sud. La chute du régime actuel de Pretoria entraînerait probablement au moins un gouvernement pro-soviétique en Afrique du Sud, ce qui représenterait la chute totale de l'Afrique australe dans le communisme et la compromission potentielle d'une route maritime internationale clé autour du Cap de Bonne-Espérance. La manière de procéder ici sera un choix difficile. Deux grandes écoles de pensée ont émergé au sein du Conseil national de sécurité. Une faction a préconisé de faire pression davantage sur Pretoria en menaçant de divulguer l'existence du programme aux médias, tandis qu'une autre a préconisé de laisser le programme tranquille et de poursuivre notre politique actuelle à l'égard de l'Afrique du Sud."
 CIA_SAF80.23.desc:0 "L'Afrique du Sud est riche d'une variété de ressources naturelles, notamment de métaux précieux, d'uranium et autres. Cependant, l'Afrique du Sud dépend fortement des importations de pétrole. Les sanctions ont eu un impact négatif sur l'économie sud-africaine, mais les ressources disponibles en Afrique du Sud ont réussi à atténuer certains des pires effets potentiels. Cependant, la réduction des importations de pétrole due aux sanctions a constitué un défi à la fois pour l'économie sud-africaine et, plus critique encore, pour l'armée sud-africaine. Pour contrer ce problème, le président a autorisé la libération partielle de nos réserves stratégiques de pétrole ainsi que la coopération avec des régimes et des sociétés producteurs de pétrole amis pour échapper aux sanctions contre l'Afrique du Sud et fournir à Pretoria un flux constant de pétrole et de gaz naturel."
 CIA_SAF80.24.desc:0 "Une excellente nouvelle est arrivée de Washington. Le président [USA.GetLeader] a décidé que le renforcement de notre économie à la lumière des sanctions mondiales était une priorité élevée. À la lumière de ce changement stratégique, nous avons été informés que les États-Unis garantiraient secrètement notre accès continu aux importations de pétrole via des intermédiaires. Le manque de pétrole et de gaz est devenu de plus en plus l'une des principales préoccupations de notre économie à la lumière des sanctions mondiales et de la détérioration des liens avec le monde arabe. Même s'il ne s'agit peut-être pas d'une solution permanente, cela donne à notre gouvernement plus de temps pour trouver une voie à suivre et protège davantage notre économie contre de nouvelles mesures de sanctions. Cependant, nous devons nous rappeler que cette politique est liée aux caprices du gouvernement américain et que tout changement dans la politique américaine pourrait mettre un terme à ce programme."
 CIA_SAF80.100.desc:0 "L'Afrique du Sud est depuis longtemps une question controversée étant donné que sa politique d'apartheid est géopolitiquement toxique et qu'elle est également le dernier grand gouvernement anticommuniste d'Afrique australe. Après un débat controversé, le président a décidé, pour le moment du moins, que l'appareil de sécurité devrait s'abstenir d'aggraver davantage la situation ou de montrer une nette préférence pour l'une ou l'autre des parties en Afrique du Sud. Cependant, le président a autorisé la poursuite des activités de surveillance des communistes, en particulier des dirigeants du Parti communiste sud-africain (SACP) et des agents présumés soviétiques et cubains en Afrique du Sud. Les membres les plus radicaux des services de renseignement se sont particulièrement irrités face à cette annonce et ont fait valoir que cela ne fait que permettre une plus grande influence communiste en Afrique australe."
 
 #South Africa Route B
 CIA_SAF80b.1.desc:0 "Alors que les administrations précédentes ont aidé et encouragé le régime sud-africain actuel, la nouvelle administration de [USA.GetLeader] a décidé d'une nouvelle ligne de conduite pour restaurer la moralité dans la politique étrangère américaine. Le nouvel objectif de la politique étrangère américaine envers l'Afrique du Sud sera double. Premièrement, nous allons maintenant chercher à mettre fin au système d'apartheid en Afrique du Sud, ce qui impliquera notamment de mettre un terme aux efforts du gouvernement pour échapper aux sanctions et de chercher à soutenir le mouvement international anti-apartheid en empêchant les acteurs hostiles de prendre des mesures contre le mouvement. Cependant, l'administration a également noté qu'il était important d'empêcher une prise de contrôle de l'Afrique du Sud par les communistes. À cet effet, le président a noté leur soutien à un plan visant à mettre à l'écart les membres de gauche les plus militants du Congrès national africain (ANC) tout en recherchant d'autres organisations en Afrique du Sud qui s'opposeront au communisme mais au système de l'apartheid."
 CIA_SAF80b.2.desc:0 "Depuis trop longtemps, l'appareil de renseignement est utilisé pour harceler les mouvements progressistes aux États-Unis et en Europe occidentale. La Central Intelligence Agency (CIA) a désormais pour mission de donner la priorité à la sécurité des militants anti-apartheid non communistes et d'éviter toute coopération avec des éléments d'extrême droite cherchant à nuire au mouvement, tout en réduisant la surveillance et le harcèlement sud-africains du mouvement anti-apartheid. Certains agents de la CIA auraient été déplacés suite à ce changement de tactique et devraient être surveillés pour s'assurer qu'ils suivent correctement les ordres. Cela dit, nos analystes estiment que cette décision comporte un risque minime et pourrait contribuer à renforcer la bonne volonté future auprès des dirigeants militants. En plus de cela, il a également été demandé à la CIA de chercher à lutter contre l'assassinat potentiel de tout dirigeant occidental qui se distingue par son opposition à l'Afrique du Sud. "
 CIA_SAF80b.3.desc:0 "L'un des problèmes majeurs avec le gouvernement sud-africain est sa campagne avancée d'armes de destruction massive. Bien qu'au mieux ce ne soient que des rumeurs au niveau international, l'Afrique du Sud dispose en réalité d'un programme d'armes nucléaires fonctionnel et nos analystes pensent qu'il est très possible que l'Afrique du Sud dispose soit d'un dispositif nucléaire fonctionnel, soit de la capacité d'en assembler un rapidement. Afin d'affaiblir davantage la position internationale de Pretoria, le Conseil de sécurité nationale a accepté une proposition visant à divulguer à la presse toute l'étendue des programmes de guerre nucléaire et biologique sud-africains. Un officier désigné de la CIA ayant des relations avec les médias sera chargé de divulguer en toute confiance les informations au New York Times, puis à partir de ce moment-là, nous attendrons que l'histoire suive son cours avant d'approuver formellement le reportage et de vérifier son contenu. Des inquiétudes ont été exprimées quant au fait que cela pourrait pousser Pretoria encore plus dans une impasse et compromettre toute chance diplomatique de mettre fin à l'apartheid."
 CIA_SAF80b.4.desc:0 "Terrible nouvelle, les médias internationaux ont eu vent de notre programme d'armes de destruction massive. Même si le début de la tempête médiatique n'est pas directement lié au gouvernement américain, il est clair que le gouvernement américain a divulgué l'existence du programme au New York Times et à d'autres institutions médiatiques. C'est un désastre total. Les alliés et partisans internationaux qui nous restaient nous abandonnent rapidement alors que défendre notre cause est devenu encore plus toxique politiquement. Des inquiétudes ont été soulevées quant à ce qui va sûrement se produire, à savoir de nouvelles sanctions économiques, désormais également imposées par les États-Unis, qui auront des effets désastreux non seulement sur notre économie mais aussi sur notre capacité à faire la guerre. Même aujourd'hui, nos ennemis, tant nationaux qu'étrangers, préparent notre disparition et des actions de plus en plus audacieuses et désespérées pourraient s'avérer nécessaires à l'avenir pour éviter le pire."
 CIA_SAF80b.6.desc:0 "L'existence continue et l'expansion du programme d'armes nucléaires sud-africain est une préoccupation pour la sécurité mondiale. Malheureusement, paralyser le programme nucléaire sud-africain est plus difficile que la plupart des autres, étant donné que l'Afrique du Sud possède de riches réserves d'uranium et d'autres ressources nécessaires à l'armement nucléaire. Si le programme se poursuit, il pourrait fournir à Pretoria le levier ultime pour tenter d'empêcher la fin de l'apartheid. Pour saboter le programme, une proposition a été approuvée par le Conseil national de sécurité visant à kidnapper des scientifiques nucléaires sud-africains. Même s'il s'agit peut-être d'une mesure drastique, cet effort pourrait contribuer à retarder la progression du programme nucléaire sud-africain tout en atténuant le risque d'escalade ou d'alarme dans l'opinion publique. Cependant, des inquiétudes ont été exprimées quant aux conséquences si l'opération échoue ou entraîne des complications en cas d'enlèvement de scientifiques nucléaires."
 CIA_SAF80b.7.desc:0 "Excellente nouvelle, notre récente campagne contre le programme nucléaire sud-africain a été un grand succès. Plusieurs scientifiques nucléaires sud-africains notables ont été enlevés par nos agents et exfiltrés avec succès vers les États-Unis. Même si les scientifiques ne sont pas des leaders mondiaux dans leur domaine, ils restent des universitaires remarquables et seront convaincus, peut-être avec force, de coopérer au développement de nos renseignements sur le programme sud-africain et de trouver ensuite un emploi dans un domaine connexe au niveau national, sous observation bien sûr. Le gouvernement sud-africain n'a rien annoncé officiellement pour le moment, mais selon nos sources, il est conscient de notre culpabilité dans les enlèvements et a exprimé ses inquiétudes quant à sa propre sécurité personnelle. Il est alarmant de constater que nos nouvelles sources d'information ont conduit nos analystes à réaliser qu'ils avaient peut-être sous-estimé la progression du programme nucléaire sud-africain."
 CIA_SAF80b.8.desc:0 "Malheureusement, nos tentatives de saboter le programme nucléaire sud-africain en enlevant des scientifiques sud-africains se sont transformées en fiasco. Alors que les choses ont commencé normalement, nos agents se sont vite rendu compte que les cibles ne se trouvaient généralement pas chez elles et avaient été transférées dans des installations gouvernementales. Pour compliquer encore davantage les choses, les forces spéciales sud-africaines ont engagé nos agents alors qu'ils s'exfiltraient du pays. Heureusement, nos agents ont réussi à s'échapper, malgré quelques blessés. Le gouvernement sud-africain a annoncé avoir déjoué notre opération et a fustigé notre opération comme une violation de sa souveraineté. Il s'agit certainement d'un coup dur porté à l'administration, et peut-être plus inquiétant encore, cela n'a pas réussi à causer de dommages significatifs au programme nucléaire sud-africain tout en embarrassant également notre administration et nos services de sécurité."
 CIA_SAF80b.9.desc:0 "Depuis des décennies, nous sommes un fervent partisan du gouvernement sud-africain. Cela se produit bien que leur politique d'apartheid soit controversée aux États-Unis et politiquement toxique à l'étranger. Cependant, le président [USA.GetLeader] a décidé de renverser cette approche. Pour continuer sur cette voie, le président a autorisé l'envoi d'une proposition au chef du Congrès national africain (ANC), Nelson Mandela, l'invitant à accepter le soutien américain en échange de la mise à l'écart des membres du Parti communiste sud-africain (SACP) au sein du mouvement plus large, en particulier en ce qui concerne les membres dirigeants de l'uMkhonto we Sizwe, la branche armée de l'ANC qui est fortement composée de membres du SACP. Si Mandela acceptait la proposition, nous aurions le véhicule idéal pour influencer le mouvement anti-apartheid en Afrique du Sud tout en garantissant le maintien de l'influence américaine en Afrique du Sud dans une Afrique du Sud post-apartheid. Cependant, cette décision a également été critiquée par certains au sein du Conseil de sécurité nationale (NSC) car elle pourrait potentiellement déstabiliser davantage l'Afrique du Sud."
 CIA_SAF80b.10.desc:0 "Notre action auprès de Nelson Mandela a porté ses fruits. Le leader du Congrès national africain (ANC) a informé nos agents qu'il avait accepté notre proposition. Mandela a noté que même s'il avait des réserves quant à la mise à l'écart des membres les plus éminents du Parti communiste sud-africain (SACP), cela était pour le bien de l'Afrique du Sud et pourrait donner l'élan nécessaire pour enfin mettre fin à l'apartheid. Même si, bien entendu, cet accord restera privé entre les échelons supérieurs de notre administration et les plus hauts dirigeants de l'ANC, il s'agit d'une victoire majeure pour notre administration et d'une justification de notre nouvelle stratégie à l'égard de l'Afrique du Sud. Espérons que cela marque le début de la fin du régime de l'apartheid à Pretoria et pousse le gouvernement à la table des négociations pour éviter un futur bain de sang."
 CIA_SAF80b.11.desc:0 "A l'issue d'un débat controversé, le président a autorisé l'armement de l'uMkhonto we Sizwe, la branche armée de l'African National Congress (ANC). Cela se produit malgré le fait que l'UMkhonto we Sizwe est effectivement dirigé par la direction du Parti communiste sud-africain (SACP). Alors que les membres les plus radicaux de l'appareil de renseignement et de l'establishment de la politique étrangère ont vivement critiqué cette décision, le président estime que les contacts avec l'ANC permettront à notre gouvernement d'exercer une plus grande influence dans une Afrique du Sud post-apartheid et potentiellement d'aliéner les membres du SACP. Même si Mandela et d'autres dirigeants de l'ANC ont répondu positivement à nos efforts de sensibilisation et à notre proposition visant à minimiser l'implication du SACP dans une Afrique du Sud post-apartheid, des doutes subsistent quant à la volonté de l'ANC dans son ensemble de donner suite à l'accord. Un autre contingent a également exprimé son inquiétude face à cette décision qui conduit à une plus grande tension raciale en Afrique du Sud et augmente les risques d'une violente guerre civile au Cap."
 CIA_SAF80b.12.desc:0 "L'un des problèmes majeurs que nos services de renseignement ont rencontré avec le mouvement anti-apartheid en Afrique du Sud au fil des années est le nombre élevé de communistes éminents au sein du Congrès national africain ainsi que leur alliance avec le Parti communiste sud-africain (SACP). Cela est particulièrement vrai avec la présence massive de dirigeants et de cadres du SACP dans la branche armée du mouvement, Umkhonto we Sizwe. L'ANC a accepté de prendre des mesures de conciliation pour réduire l'influence communiste au sein du mouvement ANC. Les dirigeants communistes de l'Umkhonto we Sizwe, en particulier Joe Siovo, le commandant général de l'Umkhonto we Sizwe et président du SACP, Chris Hani, le chef d'état-major de l'Umkhonto we Sizwe et d'autres membres éminents du SACP du mouvement armé tels que Thenjiwe Mtintso seront mis à l'écart d'autres rôles au sein de l'organisation plus large et seront remplacés par des personnalités plus modérées de l'ANC."
 CIA_SAF80b.13.desc:0 "Les Zoulous représentent l'un des groupes ethniques les plus importants d'Afrique du Sud. Même si elle ne dispose pas d'un bantoustan formel, l'aristocratie zouloue locale dispose toujours d'un pouvoir étendu sur ses terres traditionnelles. Le Mouvement national de libération culturelle Inkatha (INCLM), dirigé par le neveu du futur roi zoulou, pourrait être un atout essentiel dans nos efforts en cours. Bien qu'initialement aligné sur le Congrès national africain (ANC), l'INCLM s'est de plus en plus éloigné de l'ANC pour diverses raisons, et une partie de la noblesse zouloue s'est montrée de plus en plus amicale avec le gouvernement sud-africain. Le président a approuvé un plan visant à contacter le prince Mangosuthu Gatsha Buthelezi, le chef de l'INCLM, et à proposer à l'INCLM de se distancier du gouvernement sud-africain et de se préparer à un éventuel soulèvement armé contre l'État en échange d'une aide financière et militaire américaine ainsi que de la reconnaissance et du soutien d'un État zoulou indépendant au lendemain de la chute future du gouvernement de l'apartheid."
 CIA_SAF80b.14.desc:0 "Heureusement, la direction du Mouvement national de libération culturelle de l'Inkatha (INCLM) a accepté notre proposition. Les représentants du prince Mangosuthu Gatsha Buthelezi, le chef de l'INCLM, organisent actuellement les lieux de livraison et déterminent la logistique pour l'expansion de notre réseau local et les livraisons d'armes qui devraient commencer dans les semaines à venir. Nos analystes sont convaincus que notre soutien à un État zoulou indépendant sous une structure gouvernementale traditionnelle était le principal argument de vente de l'INCLM. Il s'agit d'un grand pas vers notre objectif de mettre fin à l'apartheid en Afrique du Sud, mais cela ouvre également de nouveaux défis. Nous devrons désormais également équilibrer les intérêts concurrents de l'INCLM et du Congrès national africain (ANC). Les tensions entre les deux organisations se sont accrues ces dernières années, et l'ANC sera sûrement mécontent du nouvel objectif de l'INCLM et de notre acceptation d'un État zoulou indépendant."
 CIA_SAF80b.15.desc:0 "Malheureusement, la direction du Mouvement national de libération culturelle de l'Inkatha (INCLM) a rejeté notre offre d'aller à l'encontre du gouvernement de Pretoria. L'INCLM, tout en appréciant cette offre, a noté qu'à ce moment-là, ils se sentaient plus à l'aise de s'associer au gouvernement de Pretoria, étant donné le radicalisme croissant au sein du Congrès national africain (ANC) et d'autres forces alliées. Bien que cela ne soit pas déclaré ouvertement, nos analystes et agents locaux estiment que l'aristocratie zouloue est menacée par des courants politiques plus à gauche au sein du mouvement anti-apartheid qui, bien qu'ils ne soient pas communistes, mettraient certainement fin à la structure de pouvoir traditionnelle au KwaZulu. Bien que malheureuse, cette réponse n'est pas totalement inattendue, les rapports des services de renseignement locaux ont noté une proximité croissante entre d'éminents dirigeants zoulous et le gouvernement sud-africain, en particulier à la lumière des conflits croissants entre l'INCLM et l'ANC."
 CIA_SAF80b.16.desc:0 "Le moment est venu, après diverses négociations avec les factions anti-apartheid en Afrique du Sud et la fourniture d'armes et d'entraînements suffisants, de déclencher le début d'un soulèvement armé contre le gouvernement sud-africain. Nos agents intégrés au sein de l'uMkhonto we Sizwe nous ont informés que la branche armée du Congrès national africain envisageait de commencer sa grande opération contre le gouvernement par un premier raid sur diverses cibles gouvernementales plus petites et plus inoffensives, avant de se tourner vers l'attaque de complexes pénitentiaires majeurs et de tenter de lancer des coups d'État contre les gouvernements collaborationnistes des Bantoustans. Alors que nous attendons des nouvelles de nos contacts sur le succès des premières étapes du soulèvement, des inquiétudes ont été soulevées en interne au sein de l'administration concernant d'éventuels crimes contre des civils blancs et des éléments collaborationnistes, ainsi que des analyses contradictoires sur la manière dont le gouvernement sud-africain réagira au soulèvement. Idéalement, le soulèvement amènerait le gouvernement pro-apartheid à la table des négociations, mais l'opinion désormais prédominante des agences de renseignement est que cela mènera probablement à une guerre civile sanglante et augmentera le risque que le gouvernement sud-africain prenne des mesures drastiques."
 CIA_SAF80b.17.desc:0 "De terribles nouvelles ont commencé à affluer dans tout le pays. Tard hier soir, de nombreux rapports faisant état d'attaques contre des installations militaires et des forces de l'ordre ont commencé à arriver. Même si les attaques isolées contre ce type d'installations n'étaient pas alarmantes au début, la situation est rapidement devenue incontrôlable. Plusieurs prisons importantes ont été perquisitionnées et les branches armées du Congrès national africain et du Parti de la liberté Inkatha ont lancé un soulèvement armé général contre notre gouvernement, prenant déjà le contrôle de plusieurs zones urbaines. Des conflits ont également été signalés dans les bantoustans entre les forces fidèles à notre gouvernement et celles alignées sur les forces anti-apartheid. Nous ne pouvons pas hésiter maintenant, toutes les forces paramilitaires et militaires doivent être activées alors que la nation sombre dans une guerre civile. Ne pas sauver notre gouvernement mènera sûrement au génocide de la population blanche d'Afrique du Sud ; peut-être que des mesures plus extrêmes seront nécessaires pour sauver la situation dans les prochains jours."
 
 CIA_SAF80b.5.desc:0 "Lors d'une séance sur la non-prolifération nucléaire aux Nations Unies plus tôt dans la journée, l'ambassadeur américain auprès des Nations Unies a révélé l'existence du programme sud-africain d'armes de destruction massive. Ce programme comprend non seulement des armes nucléaires, mais aussi des agents prétendument chimiques et biologiques. L'ambassadeur a poursuivi en annonçant le soutien des États-Unis pour exiger que l'Afrique du Sud démantèle son programme d'armement ainsi que son soutien aux sanctions si cette demande n'est pas satisfaite. Compte tenu des relations de longue date entre Washington et Pretoria, la décision de dévoiler et de soutenir les sanctions sur le programme constitue une surprise majeure pour la communauté internationale. Les sondages ont montré qu'une forte majorité d'Américains soutiennent l'idée de contraindre l'Afrique du Sud à abandonner son programme d'armement. Cependant, les organisations anticommunistes qui soutiennent l'Afrique du Sud dans sa lutte contre l'expansion du communisme en Afrique australe ont condamné cette décision comme une trahison d'un allié américain."
 CIA_SAF80b.18.desc:0 "À la suite des élections sud-africaines controversées de 1948, le parti Nasionale a rapidement établi un État d'apartheid pour donner plus de pouvoir à la population boer que sur la population noire africaine, compromettant ainsi la majorité de la population du pays, mais également pour établir un système politique visant à pousser les modérés et les libéraux blancs à la marge politique. Au fil des décennies, les condamnations et les dissensions internes et étrangères à propos de l'apartheid n'ont cessé de croître. Suite au retrait du soutien américain ces dernières années, la situation sécuritaire à Pretoria s'est considérablement détériorée. Cependant, le mouvement international anti-apartheid gardait l'espoir d'une transition essentiellement pacifique loin de l'apartheid. Malheureusement, cet optimisme a connu une mort douloureuse à la suite d'affrontements à travers le pays entre l'armée et l'uMkhonto we Sizwe, la branche armée du Congrès national africain (ANC). Cela fait suite à une nouvelle répression gouvernementale contre l'opposition politique, et alors que tout espoir de transition pacifique est en lambeaux, la communauté internationale devra maintenant décider de la manière de procéder."

 CIA_SOM.30.desc:0 "La Somalie a lancé une deuxième guerre de l'Ogaden au milieu de l'escalade du conflit de la guerre civile éthiopienne. Les forces somaliennes, aux côtés du West Somali Liberation Front et du Somali Abo Liberation Front - un groupe d'origine oromo cherchant à rejoindre la Somalie - ont lancé des opérations militaires agressives dans les régions frontalières contestées. Ce conflit renouvelé rouvre des questions territoriales récemment rouvertes lors de la guerre de l'Ogaden dans les années 1970, intensifiant les rivalités régionales de longue date. Dans le cadre d'une démarche stratégique importante, les États-Unis ont fourni un soutien secret à la campagne somalienne, visant à contrer l'influence soviétique et à stabiliser la Corne de l'Afrique, instable. Le soutien américain souligne son intérêt à façonner la dynamique de sécurité régionale, même si les observateurs internationaux mettent en garde contre le risque d'un conflit plus large. À mesure que les tensions montent, l'interaction complexe de facteurs ethniques, politiques et stratégiques continue de menacer une instabilité accrue, laissant les États voisins et la communauté mondiale profondément préoccupés par les implications à long terme."
 CIA_SOM.31.desc:0 "La Somalie est sortie victorieuse de la deuxième guerre de l'Ogaden, remportant une victoire décisive sur fond de guerre civile éthiopienne. Les forces somaliennes, aidées par le Front de libération de la Somalie occidentale et le Front de libération Somali Abo, ont réussi à s'emparer de territoires clés de la région de l'Ogaden, surmontant la farouche résistance éthiopienne. Le soutien secret des États-Unis a joué un rôle crucial pour faire pencher la balance, en fournissant une aide militaire essentielle qui a contribué au succès stratégique de la Somalie. La victoire résout des conflits territoriaux de longue date remontant au XIXe siècle tout en modifiant également la dynamique du pouvoir régional. Le triomphe de la Somalie renforce la fierté nationale et positionne le pays comme une force dominante dans la Corne de l'Afrique. Cette victoire renforce l'influence de la Somalie, créant des opportunités pour remodeler les alliances politiques et la sécurité régionale. Les observateurs internationaux surveillent de près les conséquences, car cette victoire risque de modifier les tensions géopolitiques dans la Corne de l'Afrique."
 CIA_SOM.32.desc:0 "Les forces somaliennes n'ont pas réussi à remporter la victoire lors de la seconde guerre de l'Ogaden et ont connu des revers importants dans leur campagne militaire. Malgré les avancées initiales aux côtés du West Somali Liberation Front et du Somali Abo Liberation Front, l'armée somalienne s'est heurtée à une résistance farouche de la part des troupes éthiopiennes retranchées dans la région contestée de l'Ogaden. Les conditions difficiles de la guerre civile éthiopienne en cours ont encore compliqué la situation. Malgré le soutien secret des États-Unis, les forces somaliennes n'ont pas réussi à maintenir leur élan et ont été repoussées, incapables de sécuriser des territoires clés. Cette défaite laisse la Somalie confrontée à des conflits territoriaux non résolus issus de la guerre de l'Ogaden dans les années 1970. Ce revers suscite des inquiétudes quant à l'avenir des ambitions territoriales et des objectifs stratégiques de la Somalie dans la Corne de l'Afrique. Les observateurs internationaux s'interrogent désormais sur la durabilité des alliances somaliennes et sur les implications de cet échec sur la stabilité à long terme de la région et sur l'équilibre des pouvoirs en Afrique de l'Est."

 CIA_SOM.33.desc:0 "Les forces soutenues par les États-Unis et alignées sur le Mouvement national somalien ont remporté une victoire décisive dans la guerre civile somalienne en cours, renversant ainsi le régime de Siad Barre. Selon des sources militaires, le soutien secret américain - fournissant des renseignements, une assistance logistique et des armements avancés - a permis au Mouvement national somalien de s'emparer de territoires stratégiques clés, forçant les loyalistes de Barre à une retraite rapide. Cette intervention est désormais largement considérée comme un tournant dans le conflit, suscitant l'espoir d'une transition vers une Somalie plus démocratique et plus stable. Les experts régionaux notent que l'opération souligne le rôle croissant des puissances extérieures dans l'élaboration des affaires somaliennes. Alors que certains analystes saluent cette décision pour son potentiel à réduire l'instabilité à long terme dans la région, d'autres préviennent que les implications plus larges restent incertaines et que parvenir à une paix durable pourrait nécessiter des efforts diplomatiques et économiques supplémentaires. Les observateurs internationaux continuent de suivre de près l'évolution de la situation alors que la Somalie est confrontée à un nouveau chapitre de sa guerre civile prolongée."
 CIA_SOM.34.desc:0 "Après un revers important dans la guerre civile somalienne, les forces soutenues par les États-Unis et le Mouvement national somalien (SNM) ont été contraints de se retirer dans l'État indépendant autoproclamé du Somaliland. Malgré les gains initiaux, le soutien américain et les avancées du SNM n'ont pas permis de vaincre la résistance déterminée des forces de Siad Barre et des factions rivales. Ce retrait marque un changement radical dans le conflit, alors que les espoirs initiaux d'étendre les zones contrôlées par le SNM à travers la Somalie ont rapidement diminué. L'assistance militaire des États-Unis, qui comprenait des renseignements et un soutien logistique, n'a pas suffi à assurer et à maintenir le contrôle sur les régions contestées. Malgré cela, le Somaliland, qui a déclaré son indépendance au début des années 1990, reste fermement sous le contrôle du SNM. Les observateurs internationaux ont exprimé leur inquiétude face à l'échec de la stratégie, soulignant que la situation pourrait déstabiliser davantage la région et compliquer les efforts en cours pour la réconciliation nationale somalienne. L'avenir de l'implication américaine dans le conflit reste incertain."

 CIA_CYCLONE.0.desc:0 "Bureau de l'Afghanistan, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\nDepuis la révolution d'avril 1978 en Afghanistan, qui a donné naissance au gouvernement pro-soviétique de la République démocratique d'Afghanistan dirigé par Nur Muhummad Taraki, les décideurs politiques du monde occidental et anticommuniste ont été troublés par l'apparition d'un penchant soviétique vers l'Asie centrale et le Moyen-Orient. Cependant, les récentes révoltes antigouvernementales en Afghanistan par des groupes militants islamistes « moudjahidines » ont attiré l'attention à Washington ; ainsi que l'augmentation de l'intervention militaire soviétique dans la région, pour soutenir le régime actuel dirigé par Babrak Karmal, qui a remplacé l'ancien dirigeant, Hafizullah Amin, qui a été tué par les Soviétiques avant leur intervention.\nCi-après connus sous le nom de Résistance afghane, plusieurs groupes sont apparus comme une menace crédible pour le régime pro-soviétique de Kaboul, notamment une faction connue sous le nom de « Peshawar Seven », composée de sept groupes politiques islamistes et traditionalistes afghans financés par le Pakistan et l'Arabie saoudite ; et les « Huit de Téhéran », une faction plus petite de huit groupes militants chiites soutenus par l'Iran. \nIl est d'une grande importance stratégique et tactique dans la région de soutenir ces groupes, en commençant par des activités secrètes. Ce bureau, en coordination avec le personnel technique concerné, recommande les premières expéditions secrètes d'armes légères, de munitions, de missiles antichar et antiaériens et d'explosifs supplémentaires ; ainsi que des premiers contacts avec ces groupes et des contacts avec des personnalités pakistanaises, saoudiennes et afghanes pour faciliter les conseils et la formation sur le terrain. Avec cette approbation, le vent pourrait peut-être se retourner contre la domination soviétique en Afghanistan et en Asie centrale."
 CIA_CYCLONE.1.desc:0 "MESSAGE PRIORITAIRE\nDE : AMBASSADE AMÉRICAINE À ISLAMABAD\nÀ : BUREAU SEASIA, D/OPÉRATIONS, LANGLEY; NSC, APNSA\nSECRET/NOFORN\nLES OPÉRATIONS EN AFGHANISTAN ONT ÉCHOUÉ. LES LIVRAISONS D'ARMES N'ARRIVENT PAS AUX MILICES. LES CONFLITS INTRA-FACTIONS AUGMENTENT AU LIEU DE SE CONCENTRER SUR LA MENACE SOVIÉTIQUE. L'ÉQUIPE DE LA CIA DANS LE PAYS RECOMMANDE LA PAUSE/ANNULATION DES OPÉRATIONS ET DE L'ASSISTANCE. DEMANDER UNE RÉPONSE IMMÉDIATE. FIN.\nLe directeur du renseignement central [GetCurrentCIADir] fronça les sourcils lorsque le câble fut déposé sur son bureau par sa secrétaire. Les efforts de Langley pour inverser la tendance en Afghanistan ont échoué ; la liste des raisons pour lesquelles cela était long d'un kilomètre. Il ne pouvait qu'imaginer la frustration des agents maintenant, essayant de gérer un combat perdu d'avance.\nEn tapant le « 1 » sur son téléphone sécurisé, il a obtenu le standard de la Maison Blanche en quelques secondes. \"Je dois parler au Président s'il vous plaît. C'est urgent.\"\nQuelques secondes plus tard, la voix du président [USA.GetLeader]est apparue au téléphone. \"Qu'est-ce qu'il y a, Monsieur le Directeur.\"\n\"Monsieur, nous devons convoquer le Conseil de sécurité nationale immédiatement. Il s'agit de l'Afghanistan. Nous devons retirer nos opérations.\"\n\"J'avais peur que vous disiez cela, Monsieur le Directeur. Malheureusement, je suis d'accord. Pas besoin de convoquer le NSC aujourd'hui. Vous avez le pouvoir de mettre fin aux opérations maintenant et nous informerons le NSC lors de notre réunion hebdomadaire.\"\n\"Oui, Monsieur le Président. Merci monsieur. Au revoir.\" La DCI a raccroché, puis a directement contacté le bureau voisin, le directeur adjoint des opérations. \"DDO, nous arrêtons l'opération en Afghanistan. Faites ce qu'il faut pour sortir nos garçons de là.\""
 CIA_CYCLONE.2.desc:0 "MESSAGE PRIORITAIRE\nDE : BUREAU SEASIA, D/OPÉRATIONS, LANGLEY\nÀ : L'AMBASSADE D'ISLAMABAD ; ÉQUIPE ALPHA AIGLE  \nSECRET/NOFORN\nPOTUS A ÉTÉ INFORMÉ DU RAPPORT DE SITUATION AFGHAN. WH ET LANGLEY ONT DÉCIDÉ DE SUSPENDRE LES OPÉRATIONS ET DE RETOURNER DÈS QUE POSSIBLE À L'AMBASSADE D'ISLAMABAD POUR ATTENDRE DES INSTRUCTIONS SUPPLÉMENTAIRES. RETOURNERA PROBABLEMENT AU CÔNE. FIN.\nAttendant une minute pour confirmer que le télex avait bien été envoyé, le DDO soupira, marquant la fin d'une autre tentative d'intervention américaine. C'était vraiment dommage cette fois-ci ; Entre la pression politique et l'inefficacité du Pentagone, des opérations à l'échelle de celle de l'Afghanistan n'étaient pas une tâche facile.\nIl a appuyé sur le buzzer inter-bureaux, appelant son secrétaire pour trouver les chefs du bureau de l'Asie du Sud-Est, la division dont dépendait l'Afghanistan. En moins de cinq minutes, les deux chefs de bureau, l'un de l'Analyse/Renseignement et l'autre des Opérations, apparurent dans son bureau."
 CIA_CYCLONE.4.desc:0 "Le chef de station à Riyad a contacté la Maison des Saoud pour lui demander de l'aide. Dans le cadre de la nouvelle opération secrète menée par les États-Unis pour soutenir les groupes militants islamistes anticommunistes dans l'Afghanistan communiste, connue officieusement sous le nom d'Opération Cyclone, Washington a décidé de solliciter notre aide, étant donné qu'il s'agit d'un allié clé ayant une influence régionale.\nLes responsables de la CIA ont demandé une contrepartie équivalente à l'aide secrète américaine fournie aux moudjahidines, soulignant que notre gouvernement a déjà soutenu des groupes islamistes et qu'il serait dans notre intérêt stratégique de les aider. Certains responsables de notre gouvernement considèrent qu'il s'agit d'une perte de temps et de ressources, tandis que d'autres affirment que l'heure est désormais à la projection de puissance et que nous disposons de suffisamment de fonds pour y contribuer. Comment allons-nous choisir ?"
 CIA_CYCLONE.5.desc:0 "Le chef de station de la CIA à Riyad a rapporté à Langley que le gouvernement saoudien avait accepté notre demande de verser, dollar pour dollar, des fonds destinés à aider les moudjahidines en Afghanistan. Notre contact au sein de la Maison des Saoud a rapporté que les membres de la famille royale saoudienne étaient réticents, mais ont finalement décidé d'accepter en raison de l'immense richesse dont ils disposaient et du potentiel d'influence géopolitique saoudienne future.\nLa réponse à Langley et à Washington a été bonne. Les agents en Afghanistan seront bientôt informés, pour leur plus grand plaisir. Désormais, davantage d'argent sera versé aux combattants de la liberté de la résistance afghane."
 CIA_CYCLONE.6.desc:0 "Malheureusement, le chef de station de la CIA à Riyad a rapporté à Langley que le gouvernement saoudien avait rejeté nos demandes répétées de financement à hauteur d'un dollar pour l'aide et d'armes destinées aux moudjahidines en Afghanistan. Notre contact au sein de la Maison des Saoud a également rapporté que la famille royale saoudienne semblait réticente et a finalement refusé en raison de sa réputation et du fait que cela pourrait être une perte de temps et de ressources précieuses.\nLa réponse à Washington est restée discrète. Même si le président et le Conseil de sécurité nationale seront informés, il est préférable de laisser les agents sur le terrain en Afghanistan dans l'ignorance à ce sujet, car leur fournir davantage de mauvaises nouvelles à ce moment-là ne servira pas à aider la résistance afghane que nous soutenons."
 CIA_CYCLONE.7.desc:0 "Bureau de l'Afghanistan, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\n\nContexte : Dans le but de renforcer la détermination idéologique des moudjahidines afghans, des agents de la CIA ont proposé une campagne secrète visant à distribuer des manuels scolaires militants aux groupes de résistance. Ces manuels, conçus pour promouvoir les idéologies anticommunistes et pro-islamistes, visent à renforcer les fondements idéologiques des combattants moudjahidines, en particulier parmi les jeunes recrues.\n\nAnalyse : La distribution de ces manuels scolaires pourrait renforcer la cohésion et la motivation des moudjahidines, notamment dans les zones rurales où l'éducation est limitée. Cependant, il existe un risque que ces documents soient considérés comme de la propagande étrangère, susceptible de s'aliéner les populations locales ou les factions de la résistance.\n\nRecommandations : Ce bureau recommande de procéder à la distribution des manuels scolaires, mais avec une surveillance attentive pour garantir que le matériel est conforme aux valeurs culturelles et religieuses locales. La coordination avec les services de renseignement pakistanais (ISI) et les dirigeants moudjahidines locaux sera essentielle au succès de cette opération."
 CIA_CYCLONE.8.desc:0 "Bureau de l'Afghanistan, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\n\nContexte : Des rapports récents des services de renseignement indiquent que certaines factions au sein des moudjahidines afghans diffusent de la propagande fondamentaliste qui promeut des idéologies extrémistes. Cela représente un risque pour les intérêts américains, car cela pourrait conduire à la montée de groupes radicaux qui pourraient éventuellement se retourner contre les États-Unis et leurs alliés.\n\nAnalyse : Même si l'objectif immédiat est de vaincre les forces soviétiques, les implications à long terme du soutien aux groupes fondamentalistes pourraient être préjudiciables. Ce bureau recommande de prendre des mesures pour atténuer la propagation de la propagande extrémiste, en particulier parmi les factions bénéficiant du soutien des États-Unis.\n\nRecommandations : Les agents de la CIA devraient travailler avec les dirigeants moudjahidines modérés pour contrer l'influence de la propagande fondamentaliste. Cela pourrait inclure la distribution de matériels alternatifs promouvant une interprétation plus modérée de l'islam et de l'anticommunisme."
 CIA_CYCLONE.9.desc:0 "Bureau de l'Afghanistan, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\nDes renseignements et des analyses récents sur le mouvement émergent des moudjahidines afghans ont révélé une étoile montante au sein du groupe de sept groupes disparates connus sous le nom de Peshawar Seven : un commandant supérieur nommé Ahmad Shah Massoud. Ce Bureau recommande de soutenir Massoud et ses forces, en raison de sa popularité et de ses compétences tactiques contre les forces soviétiques et pro-soviétiques sur le champ de bataille.\nDevenu initialement influent dans le monde politique islamiste au début des années 1970 alors qu'il était à l'Université de Kaboul, Massoud est devenu militairement connu après avoir participé à la rébellion du Panjshir en 1975, qui, bien que globalement infructueuse, a permis à Massoud de se faire un nom au sein du mouvement islamiste, qui commençait un schisme entre des modérés comme Massoud et des groupes plus fondamentalistes tels que le Hezb-e Islami dirigé par Gulbuddin Hekmaytar.\nDepuis la révolution Saur et plus tard, l'invasion soviétique, Massoud a exercé une influence en tant que commandant sur le terrain, menant une guerre asymétrique et attaquant des convois soviétiques dans le col de Salang. Au début de la campagne, Massoud a réussi à maintenir les forces soviétiques sous contrôle tandis que d'autres forces moudjahidines s'engageaient dans d'autres régions du pays.\nNos atouts sur le terrain et ce bureau estiment que Massoud est la meilleure option pour que des groupes moudjahidines importants puissent le soutenir, car son groupe Jamiat-i Islami est plus efficace militairement et moins fondamentaliste que le groupe Hezb-e Islami dirigé par Hekmaytar, qui, tout en étant sous le même parapluie que Massoud, reste un de ses puissants ennemis factionnels."
 CIA_CYCLONE.10.desc:0 "Des nouvelles sont venues de Washington, via nos contacts sur le terrain et via l'ISI à Islamabad, que la CIA américaine a décidé de soutenir notre faction de combattants moudjahidines du parti Jamiat-i Islam. C'est une excellente nouvelle, car nous avons remarqué que Langley, ignorant largement l'opposition des Pakistanais à nos forces, nous surveille depuis un certain temps, car les Américains ressentent le besoin d'intervenir contre les efforts d'expansion soviétiques, notamment en Asie."
 CIA_CYCLONE.11.desc:0 "AFGHANISTAN : ALIGNEMENT STRATÉGIQUE AVEC LES ALLIÉS RÉGIONAUX\nBureau de l'Afghanistan, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\nContexte : Les États-Unis sont confrontés à une décision cruciale en Afghanistan : s'aligner plus étroitement sur le Pakistan et sa faction moudjahidine préférée, le Hezb-e Islami de Gulbuddin Hekmatyar, ou soutenir la faction plus modérée Jamiat-i Islami d'Ahmad Shah Massoud, favorisée par les alliés occidentaux. L'Inter-Services Intelligence (ISI) du Pakistan est un partenaire clé dans la région, mais l'idéologie fondamentaliste d'Hekmatyar présente des risques à long terme. Massoud, bien que moins aligné sur le Pakistan, représente une alternative plus modérée et potentiellement stable.\nAnalyse : L'alignement sur le Pakistan et Hekmatyar renforcerait les liens avec un allié régional essentiel et garantirait un soutien logistique continu aux opérations des moudjahidines. Toutefois, les tendances extrémistes d'Hekmatyar pourraient conduire à une instabilité future. En revanche, soutenir Massoud est conforme aux valeurs occidentales et pourrait favoriser un Afghanistan post-soviétique plus stable, mais risque d'aliéner le Pakistan et de compliquer la logistique régionale.\nRecommandations : Ce bureau recommande un exercice d'équilibre prudent. Tout en maintenant leur coopération avec le Pakistan, les États-Unis devraient progressivement déplacer leur soutien vers la faction de Massoud, en s'appuyant sur leurs alliés occidentaux pour atténuer les risques d'aliénation d'Islamabad."
 CIA_CYCLONE.12.desc:0 "Bureau de l'Afghanistan, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\nLes récents renseignements et la coopération avec l'Inter-Services Intelligence (ISI) du Pakistan ont révélé l'arrivée d'un nouvel acteur dans le groupe de sept groupes disparates connus sous le nom de Peshawar Seven dans la résistance des moudjahidines afghans : le commandant supérieur et leader fondamentaliste Gulbuddin Hekmatyar. Ce bureau, après avoir entendu les rapports du personnel sur le terrain et de l'ISI, recommande de soutenir Hekmatyar en raison de ses capacités, de sa position stratégique et de ses liens amicaux avec d'autres pays alliés anticommunistes de la région, notamment le Pakistan.\nHekmatyar a commencé son incursion dans la communauté islamiste afghane à la fin des années 1960 lorsqu'il a fréquenté l'Université de Kaboul en tant qu'étudiant en ingénierie, devenant proche, puis devenant ennemi, d'Ahmad Shah Massoud, plus réformateur, qui commande également une faction de moudjahidines dans les Sept de Peshawar. Devenu plus radical, Hekmatyar a fondé le Hezb-e Islami à partir d'une partie de la jeunesse musulmane en 1975 après une scission idéologique. \nVivant et s'entraînant au Pakistan depuis quelques années, Hekmatyar et ses forces bénéficient du soutien massif du gouvernement et des services de sécurité pakistanais, qui ont établi des camps pour les entraîner. Avant l'invasion soviétique, les forces d'Hekmatyar avaient leur quartier général dans trois camps de réfugiés au Pakistan, où elles se trouvent actuellement.\nHekmatyar est un commandant de combat efficace, et son penchant idéologique islamique a attiré la part du lion de l'aide d'Islamabad, mais en termes de capacités à l'avenir, le seul soutien du Pakistan ne suffira pas à une solution à long terme en Afghanistan. Soutenir Hekmatyar, notamment avec des armes, permettra de prendre pied en Afghanistan et de repousser efficacement les forces soviétiques."
 CIA_CYCLONE.13.desc:0 "Des nouvelles sont venues de Washington via Islamabad selon lesquelles les Américains ont décidé de nous soutenir militairement et financièrement via leurs agents de la CIA. Hekmatyar est ravi, tout comme les hauts responsables de son parti politique, le Hezb-e Islami. Dans un message de Langley, les Américains ont déclaré qu'ils « souhaitent que nos forces prennent pied en Afghanistan » et que « des expéditions d'armes supplémentaires en provenance des États-Unis devraient contribuer à cet objectif ». La réaction de nos contacts au sein des services de sécurité pakistanais a également été positive, soulignant que leurs efforts pour nous attirer les bonnes grâces des Américains ont porté leurs fruits jusqu'à présent."
 CIA_CYCLONE.14.desc:0 "\"Donc, si nous voulons aider les moudjahidines, mais que nous ne voulons pas nous impliquer avec les Pakistanais, que faisons-nous ?\" Un analyste principal de l'Afghanistan s'est adossé à son fauteuil, où les analystes du Bureau d'analyse de l'Asie du Sud-Est tenaient une réunion matinale, avec la participation de certains officiers des opérations.\n\"Eh bien\", a lancé un autre analyste, \"je pense que nous avons établi que l'ISI soutient davantage d'éléments radicaux au sein des moudjahidines, avec lesquels nous ne sommes pas d'accord. Il y a moins d'éléments fondamentalistes, mais les armer directement peut être difficile, surtout si nous ne travaillons pas avec les Pakistanais.\" Il fit signe aux officiers des opérations assis à l'autre bout de la table. « Vous avez des idées ? »\nLes officiers des opérations hochèrent la tête, regardant quelques notes. « Nous pourrons peut-être établir de nouvelles routes de contrebande par l'intermédiaire d'Ahmad Shah Massoud, un commandant moudjahidin moins fondamentaliste qui contrôle le territoire dans la partie nord du pays, loin de la frontière pakistanaise. Nous pourrons peut-être organiser des opérations de contrebande via le nord du Pakistan, ou via le Cachemire, permettant à sa faction, qui reste opposée à celle de Hekmaytar soutenue par l'ISI, d'être soutenue de manière adéquate.\nLe chef du Bureau, un ancien officier sur le terrain des décennies auparavant, a hoché la tête. \"Allons de l'avant. J'informerai la DCI et le Conseil de sécurité nationale une fois que nous aurons un plan. Faites passer le message à nos hommes sur le terrain. Merci à tous.\""
 CIA_CYCLONE.15.desc:0 "Bureau de l'Afghanistan et Bureau du Pakistan, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\nLes relations des États-Unis avec l'Inter-Services Intelligence (ISI) du Pakistan ont été difficiles, notamment en raison de leur implication dans le soutien aux moudjahidines afghans, en particulier à une faction fondamentaliste dirigée par Gulbuddin Hekmatyar. Cependant, les liens étroits de l'ISI avec la faction d'Hekmaytar, connue sous le nom de Hezb-e Islami, se sont révélés efficaces sur le plan militaire pour repousser les avancées soviétiques dans la zone de contrôle d'Hekmatyar, située principalement au nord-ouest de la capitale Kaboul. \nMême si la faction d'Hekmatyar semble plus fondamentaliste que les autres factions islamistes composant le mouvement moudjahidine afghan dans son ensemble, leur coopération et leur armement augmenteront l'efficacité au combat des forces d'Hekmaytar, tout en améliorant la coopération entre la CIA et l'ISI et la planification d'opérations spécifiques.\nIl existe une préoccupation majeure au sein de l'Agence selon laquelle soutenir l'ISI et Hekmatyar pourrait être dangereux en raison du fondamentalisme idéologique de sa faction, contrairement à d'autres commandants moudjahidines tels qu'Ahmad Shah Massoud. Ce bureau recommande de soutenir les opérations actuelles de l'ISI pour aider Hekmatyar, car cela semble le plus avantageux dans la situation actuelle pour les États-Unis."
 CIA_CYCLONE.16.desc:0 "\"Pourquoi ne pas déplacer nos opérations de trafic vers l'Iran ?\" » a demandé l'un des analystes du bureau Afghanistan, en regardant un officier des opérations assis en face de lui à la table de la salle de conférence. \"Quoi?\" L'officier des opérations leva les yeux de ses notes, avec un air incrédule sur le visage. \"Etes-vous sérieux ? Par l'intermédiaire de l'Iran ?\" \"C'est logique. Qui contacterait les Iraniens ? Nous avons besoin d'un contact qui soit directement avec le CGRI, et une grande partie de leur logistique serait nécessaire pour déplacer les armes vers Hazarajat, où se trouvent les chiites.\" L'analyste fronça les sourcils. \"Nous devrons y réfléchir davantage, notamment en ce qui concerne les canaux de communication, mais il y a sûrement des personnalités au sein du CGRI et à Téhéran qui approuveraient une aide secrète américaine, juste pour une fois. C'est difficile à garantir, surtout depuis 1979, mais nous pourrons peut-être le faire fonctionner.\" Le chef du Bureau d'analyse de l'Asie du Sud-Est sourit. \"Écrivez-le, vous deux. Je veux bientôt une ébauche de proposition, et que vous contactiez tous nos hommes et les informiez du nouveau plan possible. Merci.\""
 CIA_CYCLONE.17.desc:0 "Bureau de l'Afghanistan, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement ; Direction des Opérations\nSECRET/NOFORN\nDe récentes évaluations des dégâts et des combats entreprises par la Defense Intelligence Agency et le National Reconnaissance Office ont montré l'efficacité des combattants moudjahidines afghans dans leurs opérations contre les forces soviétiques et afghanes pro-régime, et des rapports du personnel sur le terrain en Afghanistan indiquent que les moudjahidines, bien que bien équipés, manquent d'armes et d'autres équipements de combat. Les décideurs politiques de l'administration [USA.GetLeader] ont exprimé le désir d'augmenter les expéditions d'armes, mais sont divisés sur le type d'équipement. \nCertains partisans de l'envoi d'équipements plus anciens, tels que les obusiers soviétiques D-20 et les fusils d'assaut AK-74, soutiennent que, bien que tactiquement inférieures, ces armes offrent un déni plausible et sont capables de se cacher à la vue des forces d'occupation soviétiques. D'autres analystes et personnels sur le terrain ont fait pression pour des équipements plus modernes, notamment la nouvelle carabine M-4, l'obusier M-198 et le missile sol-air à lancement à l'épaule Stinger. Fournir cet équipement aux moudjahidines garantirait une plus grande efficacité au combat mais réduirait le déni plausible et pourrait être considéré comme une escalade par les Soviétiques et la communauté internationale. De leur côté, les Pakistanais semblent neutres mais penchent pour fournir aux combattants des équipements de type soviétique.\nL'une ou l'autre décision augmenterait considérablement la capacité de combat des moudjahidines, mais pas nécessairement leur efficacité au combat. Les partisans de l'équipement moderne ont fait valoir que fournir aux combattants des Stingers leur permettrait d'abattre les hélicoptères de combat soviétiques, qui représentaient jusqu'à présent la menace la plus sérieuse pour la survie des moudjahidines. Une décision doit être prise à ce sujet, et rapidement."
 CIA_CYCLONE.18.desc:0 "Bureau de l'Afghanistan, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\nDepuis l'invasion soviétique en Afghanistan, de nombreux débats ont eu lieu à Langley sur la composition des forces de résistance afghanes « moudjahidines », y compris leur idéologie et leur efficacité au combat, et sur l'opportunité de les soutenir. D'une manière générale, le personnel sur le terrain et les analystes aux États-Unis s'accordent sur le fait que le principal groupe de moudjahidines, les Sept de Peshawar, mérite le plus d'être soutenu. Cependant, un nouveau groupe de résistance aux Soviétiques a émergé, de l'autre côté du spectre idéologique : l'Afghanistan Mujahideen Freedom Fighters Front, ou AMFF, composé de quatre factions paramilitaires maoïstes et islamistes modérées ; le Mouvement de la révolution islamique, l'Organisation de libération de l'Afghanistan, l'Organisation de libération du peuple afghan et le Front de libération nationale de l'Afghanistan.\nBien qu'antisoviétique, l'AMFF reste pro-Pékin, adhérant principalement à l'idéologie maoïste tout en intégrant également des éléments de l'idéologie islamiste modérée. Même s'ils restent opposés au régime actuel du PDPA et aux forces d'occupation soviétiques, ils représentent toujours une menace pour les intérêts américains, en particulier s'ils acquièrent une influence supplémentaire dans tout règlement islamiste post-PDPA.\nCe Bureau recommande officiellement de restreindre les transferts d'armes vers l'AMFF, au motif qu'ils ne sont pas dans l'intérêt des États-Unis et que leur fournir des armes serait contre-productif par rapport aux objectifs américains dans la région. Au lieu de cela, continuer à soutenir d'autres groupes de résistance islamiste tels que les Sept de Peshawar reste l'option la plus viable."
 CIA_CYCLONE.19.desc:0 "Bureau de l'Afghanistan, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\nDepuis l'invasion soviétique en Afghanistan, de nombreux débats ont eu lieu à Langley sur la composition des forces de résistance afghanes « moudjahidines », y compris leur idéologie et leur efficacité au combat, et sur l'opportunité de les soutenir. D'une manière générale, le personnel sur le terrain et les analystes aux États-Unis s'accordent sur le fait que le principal groupe de moudjahidines, les Sept de Peshawar, mérite le plus d'être soutenu. Cependant, un nouveau groupe de résistance aux Soviétiques a émergé, de l'autre côté du spectre idéologique : l'Afghanistan Mujahideen Freedom Fighters Front, ou AMFF, composé de quatre factions paramilitaires maoïstes et islamistes modérées ; le Mouvement de la révolution islamique, l'Organisation de libération de l'Afghanistan, l'Organisation de libération du peuple afghan et le Front de libération nationale de l'Afghanistan. \nIdéologiquement plus à gauche que le PDPA pro-soviétique au pouvoir, et combiné à des idéologies pro-Pékin qui ne sont pas acceptées par le régime actuel, l'AMFF est apparu comme un choix intéressant à soutenir. Sans consulter nos alliés pakistanais, le personnel sur le terrain et les analystes de Langley, y compris ce bureau, recommandent d'autoriser les expéditions d'armes à l'AMFF, principalement des armes anciennes et obsolètes de style soviétique, notamment des fusils d'assaut AK-74 et des obusiers D-20.\nBien qu'il soit possible d'invoquer la colère de la droite nationale ici aux États-Unis, cette décision d'autoriser les livraisons d'armes est la bonne, d'autant plus qu'elle aidera toutes les forces antisoviétiques à atteindre leurs objectifs et mettra fin à la domination communiste en Asie centrale."
 CIA_CYCLONE.20.desc:0 "Nous avons reçu un message d'un contact américain selon lequel la Central Intelligence Agency des États-Unis, avec la permission du président [USA.GetLeader], a autorisé les expéditions d'armes de nos forces. Dans un bref message adressé à nos dirigeants, l'agent américain de la CIA nous a informé que \"vous recevrez des stocks de fusils d'assaut AK-74 et d'obusiers D-20 à utiliser contre les forces pro-PDPA soviétiques et afghanes\". Les Américains souhaitent cependant garder cela secret, selon notre source, car ils craignent que soutenir les mouvements communistes ne soit contre-productif pour leur message public. Nos dirigeants sont satisfaits de cette évolution et attendent avec impatience plus d'informations sur la logistique des transferts de la part de notre nouvelle liaison avec la CIA."
 CIA_CYCLONE.21.desc:0 "Bureau RSS d'Asie centrale, Bureau d'analyse soviétique, Direction du renseignement\nSECRET/NOFORN\nPuisque les États-Unis ont déterminé que nos programmes en Afghanistan et au Pakistan ont donné des premiers succès en augmentant le sentiment militariste antisoviétique parmi les populations, la prochaine étape logique consiste à s'adresser aux républiques socialistes soviétiques de la région d'Asie centrale, y compris les RSS turkmène, ouzbèke et tadjike, pour accroître le militarisme antisoviétique parmi ces populations, en particulier dans les zones rurales, et étendre le mouvement en Union soviétique.\nLes organisations musulmanes, telles que l'Administration spirituelle des musulmans d'Asie centrale et du Kazakhstan (SADUM), qui coordonnent largement les activités musulmanes dans la région sous les auspices de l'État, constituent un canal utile pour les populations de cette région. Obtenir des informations initiales sur la population par ces moyens, et peut-être orienter nos opérations vers l'infiltration des religieux et des imams locaux, peut s'avérer particulièrement utile pour diffuser le message.\nIl est également important de s'appuyer sur les alliés pakistanais et afghans existants, qui peuvent avoir des liens au-delà de la frontière soviétique. S'il est impératif que les agents maintiennent la sécurité opérationnelle dans leurs contacts avec leurs alliés et partenaires, afin de ne pas attirer l'attention du KGB, il est également encouragé de laisser circuler les rumeurs, afin de créer un sentiment de mystique et de paranoïa à l'égard du mouvement antisoviétique.\nLangley et le président souhaitent des résultats dès que possible. Nous dépendons de vous."
 CIA_CYCLONE.22.desc:0 "Bill restait occupé à l'ambassade ce matin alors qu'il était rattrapé par certaines formalités administratives de routine, les rapports du chargé d'affaires et d'autres responsables politiques travaillant ici à Islamabad. Finissant sa deuxième tasse de café depuis qu'il était au bureau ce matin, il se pencha en arrière, poussant un soupir de soulagement d'être de nouveau derrière un bureau. Les « vacances » qu'il avait prises, les expéditions jusqu'à la frontière afghane, lui avaient pris beaucoup de temps, et devoir assurer cette couverture était épuisant.\nUn coup frappé à l'encadrement de la porte le sortit de sa rêverie alors qu'il regardait un jeune officier de la Marine, fraîchement sorti du centre de communications, avec un télex. \"Message pour vous, monsieur. Il est crypté.\"\n\"Merci, caporal suppléant. Bonne soirée.\" Alors que le Marine commençait à partir, il attrapa un bloc-notes jetable et commença à décoder le télex codé.\nDE : BUREAU SEASIA, D/OPÉRATIONS, LANGLEY\nÀ : AMBASSADE D'ISLAMABAD\nSECRET/NOFORN\nLANGLEY VEUT EXPLORER LA POSSIBILITÉ DE SE CONNECTER AVEC UN GPS MUSULMAN SOV. LES GPS DISSIDENTS PEUVENT SOUTENIR LES OPÉRATIONS DES MOUDJAHIDINES. RAPPORT AVEC RÉPONSE DU GPS. FIN.\n\"Condamner.\" Je suppose qu'il devrait prendre de nouvelles « vacances » et revoir ses collègues. Il pourrait cependant passer quelques appels d'ici. Il existe peut-être quelques groupes d'expatriés ici au Pakistan, et il existe certainement de petites cellules dans les RSS d'Asie centrale qui pourraient s'avérer utiles."
 CIA_CYCLONE.23.desc:0 "MESSAGE PRIORITAIRE\nDE : AMBASSADE AMÉRICAINE À ISLAMABAD\nÀ : BUREAU SEASIA, D/OPÉRATIONS, LANGLEY\nSECRET/NOFORN\nLES ACTIFS DE PESHAWAR FONT ÉTAT DE TENSIONS CROISSANTES ENTRE LES FACTIONS FONDAMENTALISTES. DES TENSIONS APPAREMMENT SUR L'IDÉOLOGIE ET LES PERSPECTIVES STRATÉGIQUES CONTRE LES SOVS. RECOMMANDATION DE RESTER EN DEHORS DES CONFLITS OU DE RECHERCHER DES EFFORTS DE CONCILIATION. LES FACTIONS PEUVENT TRAVAILLER ENSEMBLE SI DES MENACES D'ARRÊT DES LIVRAISONS D'ARMES SONT FORMULÉES. DEMANDER UNE RÉPONSE IMMÉDIATE SUR D'AUTRES OPÉRATIONS. FIN.\nLâchant le câble sur le bureau, l'officier de surveillance du Bureau de l'Asie du Sud-Est gémit. Au moins, c'était le milieu de la journée ici. Il a décroché le téléphone interne et, en moins de deux minutes, tous ses collègues, analystes et responsables des opérations, étaient rassemblés dans son petit bureau."
 CIA_CYCLONE.24.desc:0 "Monsieur le Président, je suis ici ce matin avec un rapport sur l'Afghanistan. Langley a été occupé à analyser la dynamique interne des groupes moudjahidines les uns avec les autres et à utiliser les rapports du terrain, nous avons une proposition pour vous.\nLe président [USA.GetLeader] s'est penché en arrière du bureau Resolute, levant les yeux vers le directeur central du renseignement [GetCurrentCIADir] entrant dans l'Ovale, flanqué du conseiller à la sécurité nationale [GetCurrentNatSecAdv]. Le président se frotta les yeux, imaginant le sommeil qu'il allait bientôt perdre à cause de cela. Il a lu la première phrase du rapport : « Nous recommandons la formation d'une coalition unifiée de moudjahidines soutenue par les États-Unis et composée des factions suivantes : les forces de Massoud, les forces d'Hekmatyar, le Front des combattants de la liberté des moudjahidines d'Afghanistan et les milices chiites. »\n\"C'est certainement quelque chose\", dit-il en regardant à nouveau la DCI et en jetant le rapport sur le bureau. Le DCI, baissant les yeux, s'éclaircit la gorge. \"Monsieur, cela peut sembler impossible, mais nos agents au Pakistan et en Afghanistan nous ont assuré que cela pourrait être possible.\"\n\"Es-tu sûr? Je me souviens avoir reçu de temps en temps des briefings indiquant que les factions, en particulier Massoud et Hekmatyar, semblaient avoir des problèmes internes ; et pensons-nous vraiment qu'ils vont travailler avec les chiites ? Pour l'amour de Dieu, en quoi tout cela est-il réaliste ?\n[GetCurrentNatSecAdv] a pris la parole. \"Monsieur le Président, la meilleure chose que nous puissions faire est de tendre la main à chaque faction et de proposer une réunion pour former cette coalition. Le pire des cas serait un retour au statu quo, car chaque faction n'a pas la capacité de s'attaquer sans s'exposer aux attaques des Soviétiques ; et nous pouvons continuer à soutenir n'importe quelle faction. \"\n\"Très bien, messieurs. Vous avez ma permission d'ordonner aux agents d'organiser une réunion, de préférence au Pakistan, pour chercher à former une coalition. Je veux des rapports quotidiens à ce sujet.\" Le président hocha la tête.\n\"Oui Monsieur.\" Les deux hommes hochèrent la tête avant de quitter la pièce. Le président soupira à voix haute dans sa chambre vide, avant de se remettre à lire le rapport."
 CIA_CYCLONE.25.desc:0 "Nos contacts américains à la CIA ont contacté nos dirigeants avec une proposition nouvelle et audacieuse : former une coalition anticommuniste et antisoviétique unifiée de combattants de la résistance afghane. \nNos dirigeants, choqués par cette évolution, ont été assurés par leurs responsables à Islamabad et à Washington que malgré des différences fortes et parfois violentes entre les factions moudjahidines, toutes les factions devraient travailler ensemble dans le cadre d'un accord commun pour mettre de côté les divergences en faveur de la défaite des autorités d'occupation soviétiques et du régime PDPA à Kaboul.\nCertains membres de notre faction ont des préoccupations, telles que des divergences idéologiques et des préoccupations concernant la coordination et le commandement, qui n'ont pas été clarifiées par les Américains ou les Pakistanais. C'est un sujet de préoccupation considérable et cela pourrait nous empêcher de rejoindre cette coalition. Comment devrions-nous choisir ?"
 CIA_CYCLONE.26.desc:0 "Selon nos contacts en Afghanistan, les quatre principales factions moudjahidines, y compris les forces de Massoud, les forces d'Hekmatyar, le Front maoïste des combattants de la liberté des moudjahidines d'Afghanistan et les milices chiites financées par Téhéran, ont convenu de former une coalition unifiée dirigée par des agents américains et financée par les États-Unis, le Pakistan, l'Arabie saoudite et la Grande-Bretagne. \nCela représente un développement stratégique massif dans le conflit contre les forces d'occupation soviétiques et signifie que les factions belligérantes ont convenu de mettre temporairement fin à leurs divergences pour combattre les forces soviétiques stationnées dans le pays. Langley se prépare à informer le président et à publier une déclaration conjointe avec le Département d'État dans les prochains jours."
 CIA_CYCLONE.27.desc:0 "Malheureusement, selon nos contacts en Afghanistan, plusieurs des principales factions moudjahidines, notamment les forces de Massoud, les forces d'Hekmatyar, le Front maoïste des combattants de la liberté des moudjahidines d'Afghanistan et les milices chiites financées par Téhéran, ont rejeté nos propositions d'une coalition anticommuniste et antisoviétique unifiée. En faisant état de « préoccupations concernant la coordination » et en exprimant des différences idéologiques et personnelles entre les factions, tout espoir d'unification contre les forces soviétiques actuellement stationnées dans le pays est probablement perdu, et chaque faction continuera à se battre seule.\nLe président a été informé et reste déçu de cette évolution, ainsi que le reste du Conseil national de sécurité. La guerre en Afghanistan continue."
 CIA_CYCLONE.29.desc:0 "Alors que le président se présentait à la réunion hebdomadaire du Conseil de sécurité nationale, il a fait signe aux hommes de se rasseoir alors qu'il prenait également place. \"Bonjour messieurs. Commençons par les points à l'ordre du jour.\"\nLe conseiller à la sécurité nationale [GetCurrentNatSecAdv] a commencé. \"Vous l'avez compris, Monsieur le Président. Il y a d'abord l'Afghanistan. L'État a une proposition qui a été examinée par la Défense qui propose de reconnaître un groupe de factions connues sous le nom des Sept de Peshawar ; elles sont de tendance islamiste fondamentaliste, mais sont plus grandes et mieux équipées que les plus petites milices chiites soutenues par l'Iran, et ont eu plus de succès contre les Soviétiques. Des réflexions, messieurs ?\"\nLe secrétaire d'État [GetCurrentSecState] s'est levé et a lissé sa cravate. \"Étant donné que cela vient de nous, je serai bref : reconnaître diplomatiquement les Sept de Peshawar comme le gouvernement légitime de l'Afghanistan nous ouvrira de nombreuses portes, notamment en rendant la communication et les relations plus légitimes.\" Il regarda vaguement DCI [GetCurrentCIADir] avant de continuer. \"Le Pentagone est d'accord, cela facilitera les livraisons d'armes, d'autant plus que nous n'aurons pas à le faire en secret. Ils fonctionneraient simplement comme un gouvernement en exil au Pakistan, où ils se trouvent actuellement.\"\nLe président hocha la tête. Le DCI s'est alors levé en secouant la tête. \"Les reconnaître serait une pure folie. Bien que notre coopération avec les moudjahidines soit bonne à l'heure actuelle, il n'y a aucune certitude qu'ils seront disposés à travailler avec nous à l'avenir, surtout si nous les reconnaissons ; ils peuvent simplement se tourner vers d'autres bienfaiteurs. De plus, légitimer les livraisons d'armes ouvre la porte à des implications plus dangereuses, cela serait considéré comme une provocation contre les Soviétiques, que, même si j'aimerais beaucoup, nous devons maintenir secrète pour avoir un déni plausible. Cela ne peut tout simplement pas fonctionner à l'heure actuelle. »\nHochant à nouveau la tête, le Président arrêta le murmure dans la pièce tandis que le DCI s'asseyait. \"Maintenant que j'ai entendu les deux côtés et que tous les membres ici présents ont délibéré, je pense avoir pris une décision. L'État et la CIA publieront demain une déclaration commune de la Maison Blanche annonçant notre reconnaissance des Sept. Insistez sur le fait que cela vise à contrer l'agression soviétique et qu'il existe des garde-fous clairs pour empêcher la corruption et les abus de la part des moudjahidines, et lançons les opérations via le Pentagone et l'USAID pour démarrer l'aide. Merci à tous.\""
 CIA_CYCLONE.31.desc:0 "Alors que le président se présentait à la réunion hebdomadaire du Conseil de sécurité nationale, il a fait signe aux hommes de se rasseoir alors qu'il prenait également place. \"Bonjour messieurs. Commençons par les points à l'ordre du jour.\"\nLe conseiller à la sécurité nationale [GetCurrentNatSecAdv] a commencé. \"Vous l'avez compris, Monsieur le Président. Il y a d'abord l'Afghanistan. L'État a une proposition qui a été examinée par la Défense et qui propose de reconnaître un groupe de factions connu sous le nom des Huit de Téhéran.\" Principalement soutenues par les Iraniens, ce sont des milices chiites plus petites et moins dominantes qui opèrent dans la région stratégique de Hazara. L'État pense qu'après notre rapprochement initial avec Téhéran, cette démarche contribuerait encore davantage à améliorer les relations avec eux.\"\nDCI [GetCurrentCIADir] acquiesça. \"Langley pense que les reconnaître contribuerait à un déni plausible et éviterait le soutien américain à des forces plus importantes mais plus fondamentalistes à Peshawar, ce qui pourrait mal se terminer à l'avenir.\"\nLe président hocha la tête. \"Je vois. Et je suppose que les Pakistanais ne se joindront pas à nous dans cette démarche ? »\nLe secrétaire d'État [GetCurrentSecState] secoua la tête. « Le Pakistan continuera probablement à soutenir les groupes les plus traditionnels, c'est lui qui les a fondés ; Je ne pense pas qu'il en sortira quoi que ce soit, Monsieur le Président.\"\nLe président des Joint Chiefs, qui n'était pas du genre à apporter une grande contribution, se leva et secoua la tête. \"Monsieur, je sais que cela n'implique pas de troupes en service actif, mais je m'inquiète directement de la façon dont le fait de fournir des milices plus petites générera de réels gains contre les Soviétiques, alors qu'il existe des groupes plus importants que nous pourrions plus facilement soutenir.\"\nLa DCI hocha de nouveau la tête. \"L'idée de Langley est que si nous obtenons un soutien combiné américano-iranien, leurs capacités tactiques et stratégiques seront accrues par rapport à ce qu'elles sont actuellement.\"\nLe président hocha de nouveau la tête. \"Très bien alors. État, DCI, vous préparerez tous les deux une déclaration commune de reconnaissance. Défense, demandez au Pentagone de commencer à travailler sur l'assistance et la communication avec eux. "
 
 CIA_CYCLONE.28.desc:0 "Dans une déclaration conjointe de la Maison Blanche, du Conseil de sécurité nationale et de la Central Intelligence Agency, les États-Unis ont annoncé aujourd'hui la formation d'une « coalition anticommuniste et antisoviétique de combattants de la liberté en Afghanistan », composée de forces dirigées par Ahmad Shah Massoud et Gulbuddin Hekmaytar, ainsi que de milices maoïstes et chiites. \nCela représente une évolution stratégique dans la guérilla de faible intensité en Afghanistan depuis l'invasion soviétique ; le premier commentaire de l'ambassadeur soviétique aux États-Unis fut un commentaire de choc, puis de colère. On ne sait pas exactement quelle sera la réponse soviétique, ni si le conflit va s'intensifier en dehors de la région."
 CIA_CYCLONE.30.desc:0 "Dans une déclaration conjointe de Washington, le secrétaire d'État américain [GetCurrentSecState] et le directeur du renseignement central [GetCurrentCIADir] ont annoncé la reconnaissance par les États-Unis d'une alliance lâche de sept groupes de moudjahidines afghans connue sous le nom de Peshawar Seven. Basés dans la ville pakistanaise de Peshawar, ces groupes islamistes sont dirigés par les commandants Ahmad Shah Massoud et Gulbuddin Hekmatyar, tous deux guérilleros chevronnés dans le conflit actuel contre les forces d'occupation soviétiques et le régime PDPA au pouvoir à Kaboul.\nLa réaction internationale à cette annonce a été mitigée ; L'implication dans le conflit afghan s'est jusqu'à présent limitée aux États-Unis, au Pakistan et à l'Arabie saoudite, qui ont tous fourni une aide militaire et financière. On suppose que le Kremlin, tout comme ses marionnettes, ne réagiront pas bien à cette situation. "
 CIA_CYCLONE.32.desc:0 "Dans une déclaration conjointe de Washington, le secrétaire d'État américain [GetCurrentSecState] et le directeur du renseignement central [GetCurrentCIADir] ont annoncé la reconnaissance par les États-Unis d'une alliance lâche de huit milices moudjahidines afghanes connue sous le nom de Téhéran Huit. Financé et soutenu par l'Iran, et presque entièrement musulman chiite par rapport aux plus grandes milices sunnites afghanes, ce soutien reste un point de contact dans les relations américano-iraniennes, en particulier dans le récent rapprochement du début de la décennie.\nLa réaction internationale à cette annonce a été mitigée ; Les réactions en Afghanistan ont été négatives, préférant que les États-Unis reconnaissent les grands groupes moudjahidines. On ne sait pas exactement comment les Soviétiques réagiront, mais cela ne peut pas se passer bien, tout comme leurs marionnettes."



