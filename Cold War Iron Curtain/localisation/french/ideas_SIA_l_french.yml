l_french:
 the_lagacy_of_khana_ratsadon:0 "L'héritage de Khana Ratsadon"
 the_lagacy_of_khana_ratsadon_desc:0 "La révolution de 1932 s'est avérée être un tournant dans la politique thaïlandaise. Cela s'est terminé avec le règne absolu du pouvoir monarchiste, qui a duré près de 600 ans et a donné à la Thaïlande sa première Constitution. Mais ça ne s'est pas bien terminé. Elle fut suivie d'une courte guerre civile en 1933. Jusqu'à présent, la Thaïlande reste dans une instabilité politique et une lutte pour le pouvoir entre Plaek Phibunsongkhram et Pridi Banomyong, tous deux anciens membres du Khana Ratsadon."
