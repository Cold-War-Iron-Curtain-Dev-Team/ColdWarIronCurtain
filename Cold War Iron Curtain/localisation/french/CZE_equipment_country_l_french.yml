 ## Recon Plane ##
 CZE_recon_equipment_0:0 "Casquette Mráz K-65"
 CZE_recon_equipment_0_short:0 "Casquette K-65"
 CZE_recon_equipment_0_desc:0 "Le Fieseler Fi 156 \"Storch\" a été produit sous licence en Tchécoslovaquie pendant et après la Seconde Guerre mondiale (sous le nom de K-65 Cap), et que cet avion était destiné à remplacer."
 CZE_jet_recon_equipment_0:0 "Aéro L-60 Brigadyr"
 CZE_jet_recon_equipment_0_short:0 "L-60 Brigadyr"
 CZE_jet_recon_equipment_0_desc:0 "L'Aero L-60 Brigadur était un petit avion utilitaire tchécoslovaque STOL à ailes hautes et à hélice développé pour un usage civil et militaire. Un prototype, désigné XL-60, équipé d'un moteur Argus As 10C, effectua son premier vol le 24 décembre 1953, mais sans succès. L'avion fut entièrement repensé et le deuxième prototype amélioré, équipé d'un moteur six cylindres à plat M-208B, vola le 8 juin 1954."
