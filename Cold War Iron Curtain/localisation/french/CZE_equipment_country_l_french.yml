### Infantry Equipment

 CZE_infantry_equipment_0:0 "SA vz. 24"
 CZE_infantry_equipment_0_short:0 "vz. 24"
 CZE_infantry_equipment_0_desc:0 "Le vz. 24 est une carabine à verrou conçue et produite en Tchécoslovaquie de 1924 à 1942. Elle a été développée à partir de la gamme allemande Mauser Gewehr 98 et présente une conception de boulon très similaire. Le fusil a été conçu en Tchécoslovaquie peu après la Première Guerre mondiale pour remplacer le Vz. 98/22, également un dérivé de conception tchèque du Gewehr 98."

 CZE_infantry_equipment_1:0 "SA vz. 52"
 CZE_infantry_equipment_1_short:0 "vz. 52"
 CZE_infantry_equipment_1_desc:0 "Le vz. Le fusil 52 est un fusil à chargement automatique développé peu après la Seconde Guerre mondiale en Tchécoslovaquie. Son nom complet est 7,62 mm samonabíjecí puska vzor 52. Vz. 52 est l'abréviation de vzor 52, signifiant « modèle 52 ». Il tire la cartouche unique de 7,62 × 45 mm. Il est considéré comme fiable et précis."

 CZE_infantry_equipment_2:0 "SA vz. 58"
 CZE_infantry_equipment_2_short:0 "vz. 58"
 CZE_infantry_equipment_2_desc:0 "Le vz. 58 (ou Sa vz. 58) est un fusil d'assaut de 7,62 × 39 mm conçu et fabriqué en Tchécoslovaquie et mis en service à la fin des années 1950 sous le nom de samopal vzor 58 de 7,62 mm, remplaçant le vz. 52 et les mitraillettes Tokarev Sa 24 et Sa 26 de 7,62 × 25 mm."
 
 CZE_infantry_equipment_3:0 "Sa vz. 58 Pi"
 CZE_infantry_equipment_3_short:0 "vz. 58 Pi"
 CZE_infantry_equipment_3_desc:0 "Dispose d'une interface de montage pour un viseur infrarouge NSP-2 à vision nocturne, d'une crosse fixe, d'un cache-flash conique et d'un bipied pliable."
 
 CZE_infantry_equipment_4:0 "SA vz. 58 V"
 CZE_infantry_equipment_4_short:0 "vz. 58 V"
 CZE_infantry_equipment_4_desc:0 "Version crosse pliable en métal pour l'équipage du véhicule et les unités aéroportées. (appelée avec désinvolture « kosa » (faux) par les soldats tchèques), cette variante a été spécialement améliorée avec un garde-main à rail pour le montage d'optiques ou de fixations de rail."

