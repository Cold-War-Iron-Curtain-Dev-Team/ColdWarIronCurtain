 ## Multirole ##

 CZE_jet_multirole_equipment_1:0 "Yakovlev Yak-23"
 CZE_jet_multirole_equipment_1_short:0 "S-101"
 CZE_jet_multirole_equipment_1_desc:0 "Le Yakovlev Yak-23 était un des premiers chasseurs à réaction soviétiques doté d'une aile droite. Il a été développé à partir du Yak-17 à la fin des années 1940 et utilisait une copie d'ingénierie inverse d'un moteur britannique. Il n'a pas été construit en grand nombre car ses performances étaient inférieures à celles du Mikoyan-Gurevich MiG-15 à ailes en flèche. De nombreux Yak-23 ont été exportés vers les pays du Pacte de Varsovie et sont restés en service pendant la majeure partie des années 1950, même si certains étaient encore utilisés une décennie plus tard."
 CZE_jet_multirole_equipment_2:0 "Aéro S-102"
 CZE_jet_multirole_equipment_2_short:0 "S-102"
 CZE_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 CZE_jet_multirole_equipment_3:0 "Aéro S-103"
 CZE_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 CZE_jet_multirole_equipment_3_short:0 "S-103"
 CZE_jet_multirole_equipment_4:0 "Mikoyan-Gurevich/Aero MiG-19"
 CZE_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 CZE_jet_multirole_equipment_4_short:0 "MiG-19"
 CZE_jet_multirole_equipment_5:0 "Mikoyan-Gurevich/Aero MiG-21F-13"
 CZE_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 CZE_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 CZE_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 CZE_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 CZE_jet_multirole_equipment_6_short:0 "MiG-21PF"
 CZE_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23M"
 CZE_jet_multirole_equipment_7_desc:0 "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
 CZE_jet_multirole_equipment_7_short:0 "MiG-23M"
 CZE_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23ML"
 CZE_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
 CZE_jet_multirole_equipment_8_short:0 "MiG-23ML"
 CZE_jet_multirole_equipment_9:0 "Mikoyan-Gourevitch MiG-23MLD"
 CZE_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
 CZE_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 CZE_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29A"
 CZE_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
 CZE_jet_multirole_equipment_10_short:0 "MiG-29A"

 CZE_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 CZE_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 CZE_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une révision du MiG-29 de base. Il a acquis une capacité multirôle plus robuste grâce à une utilisation améliorée d'armes air-air et air-sol de haute précision. Il présentait également une autonomie de combat considérablement accrue, grâce à une augmentation de sa capacité de carburant interne. Quelques changements ont eu lieu au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger aluminium-lithium pour augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été révisée, les persiennes d'admission supérieures ont été supprimées pour laisser la place à plus de carburant dans les LERX, des tamis à mailles ont été introduits pour éviter les dommages causés par des corps étrangers (FOD) et les dimensions d'entrée ont été agrandies pour un débit d'air plus élevé."
 
 ## Interceptor plane ##

 CZE_jet_interceptor_equipment_1:0 "Avion S-92"
 CZE_jet_interceptor_equipment_1_short:0 "S-92"
 CZE_jet_interceptor_equipment_1_desc:0 "La version tchèque du Messerschmitt Me 262 allemand de la Seconde Guerre mondiale, surnommée Schwalbe dans les versions chasseur, ou Sturmvogel dans les versions chasseur-bombardier, est un avion de combat et un chasseur-bombardier qui fut le premier avion de combat opérationnel à réaction au monde."
 #CZE_jet_interceptor_equipment_2:0 "Avia S-92"
 #CZE_jet_interceptor_equipment_2_short:0 "S-92"
 #CZE_jet_interceptor_equipment_2_desc:0 "The Czech built version of the World War 2 German Messerschmitt Me 262, nicknamed Schwalbe in fighter versions, or Sturmvogel in fighter-bomber versions, is a fighter aircraft and fighter-bomber that was the world's first operational jet-powered fighter aircraft."
 CZE_jet_interceptor_equipment_3:0 "Mikoyan-Gourevitch MiG-17PF"
 CZE_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 CZE_jet_interceptor_equipment_3_desc:0 "Version chasseur-intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"

 ## CAS ##
 CZE_CAS_equipment_3:0 "Iliouchine Il-10"
 CZE_CAS_equipment_3_short:0 "Il-10"
 CZE_CAS_equipment_3_desc:0 "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à de nombreux défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 participa à certaines des dernières opérations de combat en Europe, ainsi qu'à la brève intervention soviétique dans la guerre du Pacifique. Au moment où l'Il-10 a pris sa retraite du service soviétique en 1956, l'armée de l'air a délaissé les avions purement CAS et d'attaque au sol pour se tourner vers les chasseurs-bombardiers. Son nom de rapport à l'OTAN est Beast."
 CZE_CAS_equipment_4:0 "Avion B-33"
 CZE_CAS_equipment_4_short:0 "B-33"
 CZE_CAS_equipment_4_desc:0 "Variante de construction tchèque du vénérable Il-10. Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à de nombreux défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 participa à certaines des dernières opérations de combat en Europe, ainsi qu'à la brève intervention soviétique dans la guerre du Pacifique. Au moment où l'Il-10 a pris sa retraite du service soviétique en 1956, l'armée de l'air a délaissé les avions purement CAS et d'attaque au sol pour se tourner vers les chasseurs-bombardiers. Son nom de rapport à l'OTAN est Beast."

 CZE_jet_CAS_equipment_1:0 "Avion B-33M"
 CZE_jet_CAS_equipment_1_short:0 "B-33M"
 CZE_jet_CAS_equipment_1_desc:0 "Variante de construction tchèque du vénérable Il-10M. Développé à partir de l'Il-2 Sturmovik, l'Il-10M a été conçu dans le but de remédier à de nombreux défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 participa à certaines des dernières opérations de combat en Europe, ainsi qu'à la brève intervention soviétique dans la guerre du Pacifique. Au moment où l'Il-10 a pris sa retraite du service soviétique en 1956, l'armée de l'air a délaissé les avions purement CAS et d'attaque au sol pour se tourner vers les chasseurs-bombardiers. Son nom de rapport à l'OTAN est Beast."
 CZE_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 CZE_jet_CAS_equipment_2_short:0 "MiG-17bis"
 CZE_jet_CAS_equipment_2_desc:0 "Conversion de chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 CZE_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 CZE_jet_CAS_equipment_3_short:0 "MiG-19S"
 CZE_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue en dalle entièrement mobile. Equipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il y avait des dispositions pour un pack de fusées non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957 modifié pour permettre le transport de quatre nacelles de fusée."
 CZE_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 CZE_jet_CAS_equipment_4_short:0 "Su-7B"
 CZE_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 CZE_jet_CAS_equipment_5:0 "Sukhoï Su-7BKL"
 CZE_jet_CAS_equipment_5_short:0 "Su-7BKL"
 CZE_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 CZE_jet_CAS_equipment_6:0 "Soukhoï Su-20"
 CZE_jet_CAS_equipment_6_short:0 "Su-20"
 CZE_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 CZE_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-23BN"
 CZE_jet_CAS_equipment_7_desc:0 "(\"Flogger-H\") Version améliorée du MiG-23B, le MiG-23BN se distinguait par le fait qu'il était équipé des ailes Edition 3 et du moteur R-29 des variantes de chasseurs contemporaines, ainsi que de mises à jour mineures de l'électronique et de l'équipement. L'autre différence majeure était la suppression de la tête diélectrique présente sur le MiG-23B. Produits de 1973 à 1985, un total de 624 MiG-23BN ont été construits, bien que seul un petit nombre ait servi dans des unités VVS, le reste étant exporté."
 CZE_jet_CAS_equipment_7_short:0 "MiG-23BN"
 CZE_jet_CAS_equipment_8:0 "Soukhoï Su-25K"
 CZE_jet_CAS_equipment_8_short:0 "Su-25K"
 CZE_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. L'avion a effectué son vol inaugural en 1975 et a été introduit en 1981. Depuis 1978, plus de 1 000 avions ont été produits. C'était un avion particulièrement populaire à l'étranger, vendu dans 29 pays. Pour cette raison, le Su-25 a été impliqué dans plusieurs conflits, notamment la guerre soviétique en Afghanistan, l'Iran-Irak et la guerre du Golfe. L'avion reste aujourd'hui en service dans tous les pays d'exportation."

