 CZE_fighter_equipment_0:0 "Ceskoslovenske Letectvo"
 CZE_fighter_equipment_0_short:0 "CSLA-L"
 CZE_fighter_equipment_0_desc:0 "L'armée de l'air tchécoslovaque (Ceskoslovenské letectvo) ou Force aérienne de l'armée tchécoslovaque (Ceskoslovenské vojenské letectvo) était la branche de l'armée de l'air tchécoslovaque formée en octobre 1918."

