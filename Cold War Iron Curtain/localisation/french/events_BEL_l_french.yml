l_french:
  BEL49.1.d:0 "Pendant l'occupation allemande de la Belgique, de nombreux citoyens se sont tournés vers l'aide à leurs ravisseurs plutôt que de résister, créant ainsi des partis et des groupes politiques rivaux tels que le VNV flamand, DeVlag et le parti Rex. 15 000 Belges servirent dans deux divisions SS distinctes, dont la 28e Division SS « Wallonienne », composée majoritairement de fascistes francophones. Maintenant que la guerre est terminée et que la Belgique n'est plus sous la botte allemande, nous devons nous dépêcher de poursuivre et de condamner les quelque 53 000 Belges qui travaillaient pour nos occupants."
  BEL49.2.d:0 "En plus de nos efforts continus pour poursuivre et condamner tous les anciens collaborateurs allemands à l'intérieur de nos frontières, nous continuerons à réprimer toutes sortes d'activités de droite, limitant les libertés et les droits de ceux soupçonnés de travailler pour les Allemands. Ils seront qualifiés de traîtres, comme ils devraient l'être, pour avoir intimidé les oppresseurs et les meurtriers de notre peuple. Aucun collaborateur ne sera plus jamais le même, il devra donc vivre avec ce qu'il a fait."
  BEL49.3.d:0 "La Koningskwestie, ou « Question royale », est une crise politique majeure, entourant la légitimité du roi des Belges, Léopold III. Lors de l'invasion allemande de la Belgique en 1940, le roi et son gouvernement sont entrés en conflit, Léopold prenant le contrôle de l'armée et faisant preuve de tendances extrêmement autoritaires, étant assigné à résidence alors qu'il était sous occupation allemande, et finalement déporté en Allemagne en 1944. Après la guerre, Léopold fut contraint de se tourner vers la Suisse pour s'exiler. Le peuple reste fermement en conflit sur la question de savoir si le roi doit être autorisé à revenir et reprendre ses fonctions, ou s'il doit rester en exil."
  BEL49.4.d:0 "Sans aucune concertation ni semblant d'autorité démocratique, le Parti chrétien-social, dirigé par Gaston Eyskens, a décidé d'autoriser Léopold III, roi des Belges, à revenir d'exil en Suisse à Bruxelles. On ne sait pas ce qui a motivé cette décision, mais le roi devrait arriver d'ici quelques jours. Cela provoquera sans doute de fortes tensions, notamment en Wallonie, mais le CSP semble en avoir tenu compte dans sa décision."
  BEL49.5.d:0 "Après une victoire réussie de ses partisans au référendum royal, le roi est de retour à Bruxelles et atterrit à l'aéroport de Bruxelles devant une foule de sujets aimants. On s'attend à des centaines de manifestations en Wallonie et à Bruxelles, provoquées par la coalition anti-royaliste, dénonçant l'arrivée du soi-disant autoritaire et ancien roi collaborateur. Cela suscitera sans aucun doute des tensions politiques persistantes, mais Léopold devrait prononcer un discours dans le centre-ville de Bruxelles et reprendre rapidement ses fonctions de roi."
  BEL49.6.d:0 "Avec la fin du référendum et la victoire de la coalition antiroyaliste dirigée par le Parti socialiste belge, le gouvernement belge a officiellement nié au roi toutes ses fonctions constitutionnelles antérieures, celles qu'il avait complètement perdues en 1940 avec l'invasion allemande. Cela empêche le roi Léopold d'avoir une quelconque autorité ou fonction au sein du gouvernement et constitue une grande victoire pour les partisans anti-royalistes. Des célébrations ont lieu dans tout le pays, notamment en Wallonie, d'où provient la majorité des voix, même si de petites contre-manifestations sont attendues dans les prochains jours."
  BEL49.7.d:0 "Avec une large majorité de soutien de gauche au Sénat et la victoire du BSP, le rôle du plus grand syndicat belge, la FGTB-ABVV, devient encore plus important. Formée en 1945 entre la Confédération belge des syndicats, l'Association communiste belge des syndicats de l'unité et divers autres syndicats et syndicats, l'Algemeen Belgisch Vakverbond ou Fédération Générale du Travail de Belgique a fait preuve de force tout au long de ses 5 années d'existence. La volonté du gouvernement de responsabiliser la FGTB-ABVV représente une meilleure communication entre l'État et sa base économique."
  BEL50.1.d:0 "N'ayant pas correctement réglé la question royale et sentant le niveau particulier de mécontentement de la population, le Sénat belge a décidé d'entamer un vote de censure à l'encontre du Premier ministre Jean Duvieusart. N'ayant reçu qu'une opposition minime de la part de plusieurs partisans de la ligne dure du CSP, la motion présentée par plusieurs législateurs du BSP a été adoptée avec une majorité écrasante, déclenchant la destitution de Duvieusart et la recherche d'un nouveau Premier ministre."
  BEL50.2.d:0 "Avec la domination du CSP au sein du gouvernement et le retour de Léopold III en Belgique, il semble approprié que le roi reprenne ses fonctions telles que consacrées par la constitution de 1831 et comme le prévoit la loi. Après une brève cérémonie de serment, l'Institut national de radiodiffusion, la radio nationale, a diffusé le discours du roi à l'ensemble de la nation."
  BEL50.3.d:0 "Désespéré de trouver un remplaçant après avoir démis Jean Duvieusart de son poste de Premier ministre, le CSP a nommé Joseph Pholien. Vétéran de la Première Guerre mondiale, ainsi que ministre de la Justice en 1939 avant l'invasion allemande, Pholien est capable d'un leadership puissant. Ce qui devrait être confirmé dans les prochains jours, Pholien sera Premier ministre, espérons-le plus longtemps que son prédécesseur."
  BEL50.4.d:0 "Sous l'énorme pression du précédent gouvernement Duvieusart, Léopold a annoncé le 1er août qu'il abdiquerait, laissant son règne à la place de son fils Baudouin. On soupçonne que cela a été fait pour apaiser les tensions en Wallonie et dans tout le pays suite à son retour en Belgique et à son héritage quelque peu infâme pendant la Seconde Guerre mondiale. Cela fera peut-être plaisir à certains, mais il va aussi nous manquer."
  BEL50.5.d:0 "Après l'abdication de son père en août, le prince héritier Baudouin Ier de Belgique a pris la couronne de roi des Belges, ainsi que tous les pouvoirs constitutionnels qui y sont associés. Son père Léopold ayant signé la veille son abdication, des foules se sont rassemblées à Bruxelles pour assister au couronnement et au discours qui a suivi, où le nouveau roi s'est engagé à respecter le gouvernement ainsi que les lois et la volonté du peuple belge. Il était toutefois important de mentionner les nombreuses perturbations survenues lors de son discours, dont celle provoquée par le leader communiste Julien Lahaut, connu pour ses convictions révolutionnaires. Les célébrations se poursuivent ce soir dans toute la Belgique après cette journée des plus excitantes."
  BEL50.6.d:0 "Avec la question royale réglée, un nouveau roi et un nouveau premier ministre, la répression doit être relâchée. Le traitement sévère des collaborateurs ne peut pas être complètement arrêté pour notre sécurité nationale et l'héritage de la guerre perdure, mais des mesures barbares telles que les condamnations à mort et l'humiliation publique doivent être progressivement retirées de la culture."
  BEL50.7.d:0 "Avec le départ soudain de Joseph Pholien comme Premier ministre après seulement un an et demi, le Parti chrétien-social a nommé Jean Marie Joseph, baron van Houtte, ancien professeur de droit à l'Université de Gand et ministre des Finances sous les gouvernements de Jean Duvieusart et Joseph Pholien. Devrait être confirmé dans les prochains jours, van Houtte devrait servir plus longtemps que ses deux prédécesseurs, offrant ainsi un leadership fort à la Belgique."
  BEL50.8.d:0 "Sentant l'esprit de coopération d'après-guerre avec nos alliés et le besoin d'assistance mutuelle et de sécurité de l'Europe occidentale, l'état-major belge a autorisé une vaste révision de la défense, visant à évaluer l'efficacité des forces armées belges et à fixer des objectifs majeurs pour l'avenir. Après des mois d'étude, les auteurs du rapport ont conclu que la principale menace résidait dans les actions de l'Union soviétique et de ses États satellites dans la région de l'Europe occidentale, et ont fixé des objectifs pour une expansion de l'armée, à trois divisions actives, deux divisions de réserve, 400 avions et quinze navires, ainsi que de nombreuses unités de défense anti-aérienne, radars et systèmes de commandement."
  BEL50.9.d:0 "Le traitement de nos citoyens accusés d'être des collaborateurs allemands doit cesser. Le gouvernement continuera de poursuivre et de condamner les collaborateurs, mais la tradition culturelle consiste à humilier publiquement ces personnes, notamment en leur rasant la tête et en les enfermant dans des zoos et des stocks de fortune. Les stigmates associés à ces citoyens doivent cesser, même s'ils seront poursuivis en conséquence pour leurs crimes."
  BEL50.10.d:0 "Notre politique de libéralisation à l'égard des collaborateurs s'est révélée inefficace tant pour régner le mécontentement public que pour permettre le libre passage de la justice aux anciens collaborateurs allemands. La Répressie, comme on l'appelle, doit être renforcée, ne serait-ce que légèrement, pour achever de nettoyer le gâchis des anciens criminels de guerre allemands dans notre pays."
  BEL50.11.d:0 "En réponse à la Question royale, et au milieu des tensions politiques latentes à Bruxelles au sein du gouvernement, plusieurs grands syndicats wallons, dont la FGTB, ont organisé des grèves et des manifestations de masse contre le retour du roi, ainsi que contre l'absence de réformes du travail dans l'industrie. Ces grèves n'ont aucune issue probable et il appartient au gouvernement de trouver comment y faire face avant que les choses ne deviennent excessivement violentes."
  BEL50.12.d:0 "En réponse aux manifestations socialistes et antiroyalistes en Wallonie, le gouvernement local a dépêché la gendarmerie pour s'assurer que les manifestations soient pacifiques. Enfilant des tenues anti-émeute et des boucliers, la police a pris position sur les principales places de Liège, Charleroi et Bruxelles, regardant les manifestants avancer et les contrer. Certaines manifestations sont devenues violentes et quelques policiers et manifestants ont été blessés lors de diverses échauffourées. En général, la situation politique a été plutôt non-violente, mais le mépris des socialistes à l'égard du gouvernement s'est accru."
  BEL50.13.d:0 "Curieusement, le gouvernement récemment élu, dirigé par le Parti socialiste belge, n'a offert que peu de résistance aux grèves et manifestations massives qui ont lieu principalement en Wallonie, à Bruxelles et à Liège. Cet événement a laissé les politologues et les spectateurs stupéfaits, et l'opinion publique à l'égard du gouvernement a augmenté, un représentant du gouvernement parlant de négociations de travail à venir dans les prochains jours. Il a été conseillé à la police locale de surveiller les manifestations afin de prévenir de nouvelles violences, mais on s'attend à peu de choses, hormis une certaine résistance monarchiste."
  BEL50.14.d:0 "Les efforts des gendarmeries locales pour prévenir les violences ont échoué. Le gouvernement dirigé par le CSP, soucieux de contrôler les émeutes avant qu'un nouveau conflit n'éclate, a demandé à l'état-major belge de déployer plusieurs divisions de la composante terrestre belge dans les grandes villes. Toutes les unités sont composées de militaires réguliers et de conscrits, et comprennent la 2e Division d'infanterie, déployée à Liège, et la 6e Division d'infanterie, déployée à Bruxelles. Les réserves ne seront pas appelées, mais les soldats déployés seront chargés du maintien de l'ordre et de la loi martiale, si le gouvernement la déploie."
  BEL50.15.d:0 "Au milieu des manifestations et des grèves socialistes pacifiques, les contre-manifestants monarchistes ont perturbé et porté atteinte au peuple et à ses revendications. Le gouvernement BSP a déclaré que \"tous les manifestants monarchistes qui interféreraient dans la protestation pacifique des travailleurs seront arrêtés\". Déjà, plusieurs centaines de monarchistes ont été arrêtés et détenus, soit par la police locale, soit par des manifestants faisant justice eux-mêmes."
  BEL50.16.d:0 "Le tristement célèbre leader communiste Julien Lahaut a été assassiné devant sa résidence dans la ville de Seraing par deux hommes armés inconnus. Cela a peut-être été précipité par la régence du prince Baudouin, qui, alors qu'il prêtait serment de régence, a été interrompu par un député communiste qui a crié « Vive la république ! ». On pensait que le député était Lahaut, dont les actions lors de la question royale ont suscité la colère des monarchistes. La mort de Lahaut a été imputée aux monarchistes, et des funérailles massives devraient avoir lieu prochainement, attirant jusqu'à 300 000 personnes. D'autres grèves sont prévues, alors que la gauche devient de plus en plus en colère en cette période de violence politique généralisée."
  BEL54.1.d:0 "Le Diamant flamand est la référence flamande d'un réseau de quatre zones métropolitaines en Belgique, dont Bruxelles, Gand, Anvers et Louvain. Cette zone est la plus industrialisée et urbanisée de Belgique, comparable à la vallée de la Ruhr ou à Randstad aux Pays-Bas. S'étendant sur environ 80 kilomètres, le Diamant abrite également de nombreux instituts d'enseignement supérieur, tels que l'Université d'Hasselt et l'Université de Gand."
  BEL54.2.d:0 "La production de bière belge s'est considérablement améliorée et prend de l'ampleur sur la scène mondiale. L'industrie brassicole nationale brasse de nombreux styles de bière différents, notamment des bières trappistes, des bières d'abbaye, des Pils, des bières blanches et des bières rouges flamandes. Plus de 80 % de la bière belge est importée et produite par des entreprises telles que Stella Artois, Hoegaarden et Leffe. Des festivals sont organisés dans toute la Belgique, notamment le Week-end des bières belges et le Festival Karakterbieren."
  BEL54.3.d:0 "Henri Moreau de Melen, célèbre vétéran de la guerre de Corée et commandant du bataillon belge du Commandement des Nations Unies, a été récompensé par le ministre belge de la Défense. Le colonel de Melen, avant son engagement en Corée, a servi pendant la Seconde Guerre mondiale, devenant prisonnier de guerre, puis sénateur puis ministre de la Justice de 1948 à 1949. Sous le gouvernement de Joseph Pholien, de Melen a été ministre de la Défense, prenant la décision de déployer des troupes en Corée. Désillusionné au milieu de la question royale, de Melen démissionna de son poste et s'enrôla dans le bataillon, devenant ainsi son commandant. Il a servi dignement et sera salué comme un héros dans toute la Belgique."
  BEL54.4.d:0 "La deuxième loi de Taeye, du nom du ministre de la Santé et ministre de la Famille, Alfred de Taeye, a été promulguée. Cette loi accorde une compensation aux villes et aux municipalités pour les permis de démolition, ce qui permet aux gouvernements locaux d'acheter des terrains et d'y détruire les bâtiments, tout en étant autorisés à vendre les décombres pour réaliser un profit. Cette loi a fait l'objet de nombreuses protestations parce qu'elle donne trop de pouvoir aux gouvernements et permet la destruction des logements sociaux, mais ses partisans soutiennent que les villes bénéficieront d'avantages économiques et de bénéfices, aboutissant à une réduction des impôts pour tous."
  BEL54.5.d:0 "Une catastrophe minière majeure a eu lieu dans la mine de charbon du Bois du Cazier à Marcinelle, dans la province du Hainaut en Wallonie. Causés par une défaillance d'un mécanisme de levage et un incendie souterrain qui a suivi, 262 mineurs sont morts d'un empoisonnement au monoxyde de carbone. Les opérations de sauvetage se sont poursuivies jusqu'au 23 août, avec seulement 12 survivants. Une grande majorité des morts étaient des travailleurs immigrés italiens, outre 95 Belges et divers autres Européens. L'Italie a immédiatement demandé de meilleures conditions de travail et la direction de la mine fera l'objet d'une enquête pour négligence."
  BEL54.6.d:0 "En réponse au maintien de l'école catholique séparée par le Parti chrétien-social, le Parti socialiste belge et le Parti libéral ont organisé des manifestations de masse dans les grandes villes, en réponse à une annonce du gouvernement. Ces manifestations ont lieu principalement à Bruxelles, ainsi qu'à Liège, Anvers et Gand, et se concentrent sur l'éducation strictement laïque, certains manifestants faisant des pancartes et d'autres tenant leurs jeunes enfants en l'air. Certains étudiants ont également assisté aux manifestations, racontant leurs expériences dans les écoles catholiques et exhortant le gouvernement à adopter des mesures laïques. On ne sait pas si cela aura un effet sur la décision actuelle, mais le temps nous le dira."
  BEL54.7.d:0 "Les lois sur l'éducation mises en place par le ministre de l'Éducation Pierre Harmel sous le mandat de Joseph Pholien ont été abrogées par le gouvernement majoritaire BSP ! Cela permettra une scolarité laïque, ainsi qu'une séparation majeure entre l'Église et l'État dans le système scolaire. On ne sait pas si ni quand les lois Harmel sur l'éducation seront remplacées, mais les rues débordent de joie. De nombreux membres du CSP et catholiques s'inquiètent de ces développements et des manifestations sont évoquées dans les prochains jours, tant dans les cercles laïcs que religieux. Cela pourrait à nouveau se transformer en un nouveau cycle de violence politique."
  BEL54.8.d:0 "Même si les lois Harmel sur l'éducation ont été abrogées, les protestations se poursuivent dans tout le pays, même de la part des socialistes qui soutiennent que l'inexistence d'une loi sur l'éducation ne profite qu'aux écoles catholiques. Les manifestations se poursuivent, notamment à Bruxelles, où les manifestants du BSP affrontent les contre-manifestants du CSP, donnant lieu à quelques échauffourées et arrestations par des policiers armés. Le gouvernement est d'avis que les manifestations socialistes et libérales devraient cesser, et la police a été appelée pour disperser les foules et instaurer un couvre-feu le cas échéant."
  BEL54.9.d:0 "Même si les lois Harmel sur l'éducation ont été abrogées, les protestations se poursuivent dans tout le pays, même de la part des catholiques qui contestent la constitutionnalité de la limitation des écoles privées et religieuses. Les protestations se poursuivent, notamment à Bruxelles, où les manifestants du CSP s'affrontent avec les contre-manifestants du BSP, entraînant quelques échauffourées et arrestations par des policiers armés. Le gouvernement est d'avis que les manifestations catholiques et conservatrices devraient cesser, et la police a été appelée pour disperser les foules et instaurer un couvre-feu le cas échéant."
  BEL54.10.d:0 "La loi Collard, du nom de l'actuel ministre de l'Éducation et membre du BSP, Leo Collard, prévoit des réductions des subventions au réseau éducatif belge et supprime environ 110 intermédiaires catholiques du système, ainsi qu'une augmentation des salaires des enseignants et des dispositions pour les écoles techniques et la liberté de choix. Beaucoup y voient une alternative appropriée aux lois Harmel sur l'éducation, aujourd'hui disparues, qui accordaient injustement un avantage aux écoles catholiques. Cette loi suscitera de nombreuses protestations mais offrira selon toute vraisemblance un avenir meilleur aux écoliers belges."
  BEL58.1.d:0 "Avec la transition de la Communauté européenne du charbon et de l'acier à la nouvelle Communauté économique européenne, le prix global du charbon devient moins cher avec l'augmentation des transports entre les pays. Notre industrie charbonnière doit rester constante et le gouvernement se sent obligé de baisser les prix afin de rester compétitif par rapport aux autres marchés. Notre industrie amorce un déclin, mais en attendant, elle doit perdurer."
  BEL58.2.d:0 "Le Pacte scolaire, l'accord résolvant la Seconde Guerre scolaire, est le résultat des travaux menés en septembre 1958 par la Commission scolaire nationale et des négociations entre le BSP, le CSP et les partis libéraux. Il s'agit d'un contrat résolvant les problèmes de l'éducation en Belgique et qui stipule la liberté de choix dans les écoles, la distinction claire entre les écoles publiques et privées et l'interdiction des activités politiques dans les écoles."
  BEL58.3.d:0 "Le gouvernement a été alerté de troubles civils qui éclatent dans la capitale du Congo belge, Léopoldville. Les émeutes ont commencé après que des membres de l'ABAKO, ou le parti politique Alliance des Bakongo, n'aient pas été autorisés à se rassembler pour protester contre les atrocités belges au Congo. La violence commence à frapper les gens ordinaires, certaines parties de la ville étant pillées et incendiées. Une réponse est nécessaire dans les plus brefs délais."
  BEL58.4.d:0 "La Force Publique, la gendarmerie et la police du Congo belge, a été déployée pour répondre aux émeutes de masse à Léopoldville. Dirigé par le général Emille Janssens, le 13e bataillon FP est autorisé à recourir à la force meurtrière afin de réprimer les protestations, les assauts et les pillages. Cela ne devrait être qu'une mesure temporaire afin de mettre un terme à de nouvelles manifestations et violences."
  BEL58.5.d:0 "À la suite des émeutes de Léopoldville, sentant le mécontentement général à l'égard du régime colonial belge, et suivant l'exemple d'autres puissances coloniales, la Chambre des représentants belge s'est réunie pour tenir des audiences publiques sur le ministère des Colonies et ses actions récentes, y compris d'éventuelles atrocités. Il faut également penser à l'indépendance du Congo dans un avenir très proche. Nous espérons que ces auditions découvriront la vérité."
  BELFA.1.d:0 "Le 5 novembre 1955, le Parlement Benelux est créé en collaboration avec l'Union économique Benelux. Conçu comme un groupe consultatif uniquement sans pouvoir de décision pour promulguer des lois, le Parlement est composé de 49 membres ; 21 représentants de Belgique et des Pays-Bas, ainsi que 7 représentants du Luxembourg. La présidence alterne entre les trois pays tous les deux ans, en commençant à Bruxelles avec Frans van Cauelwart comme premier président de l'assemblée."
  BELFA.2.d:0 "Dans le prolongement de l'accord douanier actualisé de 1944 et 1947 entre la Belgique, les Pays-Bas et le Luxembourg, les trois pays ont signé la création de l'Union économique Benelux. Utilisant le Parlement Benelux comme organe consultatif, le syndicat s'est engagé en faveur de la libre circulation des personnes, des biens et des services entre les trois pays."
  BELFA.3.d:0 "Lors de la Conférence intergouvernementale sur le Marché commun et l'Euratom de 1956, qui s'est tenue ici même en Belgique, des discussions ont eu lieu sur une communauté européenne de l'énergie nucléaire. Avec la signature du Traité Euratom lors des Traités de Rome en 1957, la Communauté européenne de l'énergie atomique, connue sous le nom d'Euratom, a été créée pour créer un marché commun unique de l'énergie nucléaire."
  BELFA.4.d:0 "Avec le début de la guerre dans la péninsule coréenne et l'adoption de la résolution 84 du Conseil de sécurité des Nations Unies, autorisant la formation d'un commandement unifié, la Belgique juge opportun de contribuer autant d'hommes que possible à l'action policière en cours. Jusqu'à 2 000 hommes éligibles sont arrivés à Bourg-Léopold pour rejoindre le commandement, et ils doivent être inspectés et formés. Dès 1951, le BUNC pourra se déployer en Corée."
  BELFA.5.d:0 "L'invasion injuste et non autorisée de la Corée du Sud par l'Armée populaire nord-coréenne soutenue par les Soviétiques est inacceptable. Le gouvernement belge souhaite exprimer sa condamnation du conflit, a déclaré un porte-parole lors d'une conférence de presse sur la situation. Le ministère belge de la Défense n'envisage pas pour le moment d'envoyer des troupes pour aider aux opérations des Nations Unies, a également déclaré le porte-parole."
  BELFA.6.d:0 "Étant donné que les Pays-Bas ont subi bien plus de dégâts lors de la crue de la mer du Nord de 1953 qu'en Belgique, nous ferons de notre mieux pour soutenir nos frères néerlandais du nord. Des soldats ont été envoyés pour aider aux sauvetages, ainsi qu'à la création d'un fonds national de secours. Tous les fonds de la Croix-Rouge belge seront destinés à la reconstruction nationale et néerlandaise suite aux inondations."
  BELFA.7.d:0 "La ville de Bruxelles est fière d'accueillir l'Exposition universelle de 1958, connue officieusement sous le nom d'« Expo 58 ». Première grande exposition internationale organisée après la Seconde Guerre mondiale, l'Expo était surtout connue pour le grand Atomium, ainsi que pour le pavillon du Congo belge et les pavillons de divers pays tels que les États-Unis, l'Union soviétique, l'Allemagne et la Tchécoslovaquie. Plus de 41 millions de visiteurs y ont assisté pendant six mois, ce qui en fait une exposition universelle assez impressionnante."
  BELFA.8.d:0 "En prévision de l'Exposition universelle de Bruxelles qui aura lieu prochainement, le gouvernement belge a commandé la construction d'un nouveau bâtiment, nommé l'Atomium, en forme de cellule de cristal de fer. Avec ses sphères métalliques emblématiques reliées par différents escaliers, l'Atomium deviendra un monument pour la ville de Bruxelles, même s'il ne devrait pas survivre après la fin de l'Exposition universelle."
  BELColonial.1.d:0 "L'histoire coloniale de la Belgique a été pleine de cruauté et de controverses. Parmi les trois colonies et trois concessions que possède ou possédait la Belgique, le Congo belge et le Ruanda-Urundi sont les plus tristement célèbres. Ayant d'abord appartenu exclusivement au roi Léopold II dans les années 1880, le Congo a été restitué à la Belgique en 1908, après des années de violence de la part des autorités de l'État indépendant du Congo, qui ont eu recours au travail forcé, au meurtre et à la mutilation pour maintenir le contrôle et le flux de caoutchouc et d'uranium en provenance des colonies. La participation des Congolais à la Seconde Guerre mondiale a grandement contribué à la campagne d'Afrique de l'Est. La colonie du Ruanda-Urundi est également importante, acquise en 1922 après la Première Guerre mondiale et devenue désormais un territoire sous tutelle de l'ONU administré par la Belgique. Maintenir ce petit mais puissant empire colonial est un défi, et si l'on considère les puissances coloniales voisines, comme la France, maintenir la stabilité et la modernisation de nos colonies sera certainement un exploit d'homme."
  BELColonial.2.d:0 "Après la Seconde Guerre mondiale, il est clair que le Congo a besoin d'un nouveau plan économique, et rapidement, pour accélérer le nouveau potentiel économique moderne. À partir de 1949, un plan décennal a été établi, pour se concentrer sur des investissements rapides et la construction d'infrastructures de transport, afin de remplacer les systèmes vieillissants. Une « Société de Développement Colonial » sera créée au sein de la colonie pour coordonner les objectifs stratégiques, et avec l'introduction de nouveaux procédés de fabrication, le taux de production industrielle dans les colonies ne fera qu'augmenter, contribuant ainsi à approvisionner les pays du monde entier."
  BELColonial.3.d:0 "La Banque centrale du Congo belge et du Ruanda-Urundi, ou CBBCRU, a constitué le 1er juillet 1952 une banque centrale coloniale et un avenir financier plus stable dans les colonies. Avant cela, la Banque d'Angleterre avait assumé la responsabilité de l'émission des billets de banque, en raison de l'histoire ténue de l'occupation allemande par la Belgique, en particulier pendant la Seconde Guerre mondiale. Cela placera enfin la monnaie entre les mains du peuple, et non d'une puissance étrangère, et unifiera les colonies africaines, facilitant ainsi l'obtention de prêts ou d'obligations, quel que soit le lieu."
  BELColonial.4.d:0 "La politique autochtone belge évolue en ce qui concerne les libertés politiques et économiques de nos sujets coloniaux au Congo et au Ruanda-Urundi. Le nouveau décret royal du 14 juillet 1952 autorise une plus grande liberté politique dans l'ensemble des colonies, y compris la création d'un grand nombre d'institutions politiques, telles que des représentants autochtones provinciaux, de district et municipaux, jusqu'à un Haut Conseil, toutes conçues pour plus d'autonomie parmi les peuples autochtones et moins d'ingérence étrangère du gouvernement colonial, même si certains vestiges doivent subsister pour la sécurité et le bien-être du territoire. Le roi espère que ce décret ne sera pas abusé, mais utilisé librement pour promouvoir les idéaux démocratiques."
  BELColonial.5.d:0 "Sa première grande entreprise en tant que royal, le roi Baudouin a effectué une visite d'État au Congo belge, visitant de grandes villes telles que Léopoldville, Stanleyville et Albertville. Lors de sa visite, il semblait enthousiaste, et d'innombrables foules l'acclamaient alors qu'il parcourait les rues. Dans un discours prononcé dans la capitale Léopoldville, le roi a rappelé les idées du gouverneur général sur une \"communauté belgo-congolaise\". Les observateurs étrangers remarquent que tout semble normal lors de la visite, même si, dans l'ombre, des grondements sur les droits syndicaux, les différences linguistiques et l'éducation - des questions qui affectent la Belgique au niveau national ; commencent à frapper les colonies."
  BELColonial.6.d:0 "Les discussions sur les écarts salariaux entre les Européens blancs et les travailleurs indigènes noirs ont touché le coeur même du gouvernement colonial. Cela est dû à l'afflux de Congolais instruits, qui réclament l'égalité de salaire pour tous et ont formé le Syndicat des Fonctionnaires Auxiliaires, ou APIC, pour résoudre ce problème. De plus, la question des salaires, qui touche la plupart des Congolais d'origine, s'entremêle à un mouvement d'émancipation populaire, qui constitue une menace pour la sécurité du gouvernement colonial. Des négociations ont été immédiatement engagées entre le bureau du gouverneur général et l'APIC pour discuter de l'écart salarial et, espérons-le, alléger un peu la pression au sein de la population."
  BELRec.1.d:0 "Depuis la fin de la Seconde Guerre mondiale, la Belgique a fait de grands progrès pour récupérer ses pertes lors de l'invasion et de l'occupation allemandes de 1940 à 1944. À notre libération, des réformes sociales ont été introduites, ainsi qu'une demande pour nos exportations les plus populaires, notamment le charbon, l'acier et les textiles. Des programmes tels que la « Bataille pour le charbon » et le plan Gutt ont respectivement augmenté la production de charbon et réduit la masse monétaire. La pénurie de main-d'oeuvre en Belgique reste un problème majeur et il reste encore beaucoup à faire. Notre économie s'améliore, mais elle pourrait être meilleure, et nous devons continuer à oeuvrer pour atteindre ce noble objectif."
  BELRec.2.d:0 "La Belgique a envoyé un contingent diplomatique pour signer le Traité de Paris, qui devrait former la Communauté européenne du charbon et de l'acier, le premier organisme gouvernemental intereuropéen et un marché économique ouvert. Le Français Jean Monnet devrait être le premier président de la Haute Autorité de la CECA, la Belgique étant représentée par Paul Finet, ancien secrétaire général du syndicat ABVV et homme politique. Nous espérons que ce partenariat aidera grandement notre économie, car nos importations de charbon et d'acier sont nécessaires sur tout le continent."
  BELRec.3.d:0 "Dans le cadre du plan d'assistance mutuelle proposé par les États-Unis, connu sous le nom de Plan Marshall, la Belgique devrait recevoir une aide totale d'environ 777 millions de dollars, qui sera utilisée pour améliorer les infrastructures, l'amélioration des processus industriels et de fabrication, ainsi que pour maintenir notre système de protection sociale, notre montant en devises et nos exportations."
  BELRec.4.d:0 "Développé par nul autre que Paul-Henri Spaak, le Traité de Rome a été signé aujourd'hui à Rome, en présence de représentants de l'Allemagne de l'Ouest, de la France, de l'Italie, des Pays-Bas et du Luxembourg. Il s'agit d'un document fondateur essentiel pour la coopération européenne, car il décrit la structure de base d'un organisme connu sous le nom d'« Union européenne ». Nous espérons que ce traité ne fera qu'élargir la CECA et permettra une plus grande liberté économique entre alliés dans toute l'Europe."
  BELRec.5.d:0 "Nous avons persévéré malgré le pire de la reprise et nous nous améliorons désormais considérablement. Notre économie est devenue la plus forte de son histoire, et avec l'aide de la CECA et maintenant de la CEE, la signature du Traité de Rome et l'éventuelle intégration dans cette Union européenne, nous nous sommes rétablis. Il reste encore beaucoup à faire dans le futur, avec des temps qui changent."
  BELFlavor.1.d:0 "Georges Prosper Rémi, plus communément appelé Hergé, est un dessinateur belge surtout connu pour sa série de bandes dessinées, les Aventures de Tintin ; considérée comme l'une des bandes dessinées européennes les plus populaires du XXe siècle. Né à Bruxelles, Hergé a fait ses débuts dans le dessin animé en illustrant le magazine scout belge Le Boy-Scout Belge en 1926. Tournant autour des voyages du journaliste Tintin et de son chien Milou, ainsi que d'autres personnages divers, Tintin a été utilisé comme propagande conservatrice auprès des enfants, utilisant les voyages en Union soviétique comme propagande antisocialiste et présentant les Congolais natifs du Congo belge comme des idiots enfantins. Après l'invasion allemande de la Belgique en 1940, Hergé travailla pour un journal collaborationniste et fut critiqué après la guerre pour son soutien aux Allemands. En 1950, les Studios Hergé ont été fondés pour faciliter la production des bandes dessinées Tintin, notamment la coloration."
  BELFlavor.2.d:0 "Après la Seconde Guerre mondiale, la scène belge de la bande dessinée s'est divisée en deux grands groupes, le néerlandais flamand et le français wallon, ce dernier étant massivement plus populaire dans des séries telles que Tintin et Spirou dans les principaux magazines. Parmi les autres concurrents figurent les bandes dessinées des quotidiens flamands et les suppléments papier en langue française. C'est ce que l'on appelle communément l'âge d'or de la bande dessinée belge, caractérisé par une période de croissance et d'expansion constante."
  BELFlavor.3.d:0 "Même si elle n'est pas aussi populaire que ses homologues francophones, la petite scène flamande de la bande dessinée reste importante en Belgique. Aucun magazine local ne pourra égaler le succès de Tintin ou de Spirou, mais certains deviennent indépendants, comme 't Kapoentje ou Jommeke, qui débute en 1955. Certains créateurs flamands, suivant les traces de Berck, se tournent plutôt vers des magazines francophones."
  BELFlavor.4.d:0 "La télévision belge existe depuis 1953, sous la tutelle de l'Institut national belge de radiodiffusion (INR) ou Institut national belge de radiodiffusion. Créée par la loi en juin 1930, l'INR était responsable de la radio belge jusqu'à l'invasion allemande, où elle fut contrainte d'arrêter ses émissions. Cependant, certains membres du personnel ont réussi à s'échapper et ont créé Radio Belgique en Angleterre sous l'Office de Radiodiffusion Nationale Belge, ou RNB. Après la guerre, l'INR et le RNB ont existé ensemble jusqu'à leur fusion par décret royal en 1945 sous le nom d'INR. Depuis lors, l'INR a contribué à la fondation de l'Union européenne de radiodiffusion en 1950 et a commencé à diffuser des émissions de télévision en 1953, avec deux heures de programmes par jour."
  BELFlavor.5.d:0 "Les premiers projets de métro à Bruxelles sont apparus dès les années 1890. Après la fin de la Seconde Guerre mondiale, le soutien à la construction de lignes ferroviaires souterraines s'est accru, car davantage d'espace était disponible pour le trafic automobile en surface. En raison du nombre toujours croissant d'embouteillages entre voitures et tramways, la Société des Transports Intercommunaux de Bruxelles / Maatschappij voor het Intercommunaal Vervoer te Brussel (STIB/MIVB) a été créée en 1954 pour exploiter les réseaux de tramway, de bus et de métro à Bruxelles."
  BELFlavor.6.d:0 "Le pavillon des États-Unis d'Amérique à l'Expo 58 est assez spacieux et a été conçu par l'architecte Edward Durell Stone. Doté d'une salle de concert pour l'Orchestre Symphonique de la Septième Armée et le Fanfare de l'Université de Californie ainsi que d'une attraction cinématographique à 360 degrés connue sous le nom de Circarama, le pavillon présentait de nombreuses fonctionnalités. En 1959, ce pavillon réapparaîtra à l'Exposition nationale américaine de Moscou avant de retourner aux États-Unis à Disneyland à Anaheim en Californie."
  BELFlavor.7.d:0 "Contrairement au pavillon américain, le pavillon de l'Union soviétique est un bâtiment tout aussi grand et impressionnant, qui a été replié et restitué à la Russie à la fin de l'exposition. Les caractéristiques comprenaient un modèle du brise-glace nucléaire Lénine et des automobiles soviétiques GAZ-13 Chaika et un camion GAZ-53. Récompensé par un Grand Prix, le pavillon abritait également une maquette du satellite Spoutnik qui a mystérieusement disparu, ce qui a conduit à des accusations de vol par les États-Unis."
  BELFlavor.8.d:0 "La visite du roi Baudouin au Congo en 1959 contrastait fortement avec sa précédente visite quatre ans auparavant, en 1955. Après avoir prononcé son discours du 13 janvier promettant l'indépendance du Congo, le roi fut bombardé de pierres à son arrivée à Léopoldville par des citoyens noirs en colère contre l'emprisonnement de Patrice Lumumba. Lors de ses visites dans d'autres villes, son accueil fut meilleur mais le monarque fut toujours confronté aux cris d'« Indépendance immédiate ! Nous ne pouvons qu'espérer que cette crise dans nos colonies pourra être corrigée au plus vite."
  BELFlavor.9.d:0 "Le 2 juillet 1959, le prince Albert de Liège et l'Italienne Donna Paola Ruffo di Calabria se sont mariés dans la cathédrale Saint-Goedele de Bruxelles. Les deux hommes se sont rencontrés pour la première fois en 1958 après le couronnement du pape Jean XXIII à Rome, lors d'une réception à l'ambassade de Belgique. Leurs fiançailles furent annoncées au château de Laeken en 1959 et ils se marièrent en juillet et eurent trois enfants."

  csp_wins:0 "Le Parti chrétien-social a remporté les élections législatives."
  bsp_wins:0 "Le Parti Socialiste belge a remporté les élections législatives."