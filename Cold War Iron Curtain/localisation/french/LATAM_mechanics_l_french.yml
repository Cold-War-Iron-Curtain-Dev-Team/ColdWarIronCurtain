 LATAM_SFC_DESC:0 "La §YStandard Fruit Company§! est très présente en Amérique centrale. Créée en 1924 par les frères Vaccaro à la Nouvelle-Orléans, l'entreprise a joué un rôle majeur dans l'évolution des perspectives économiques de la région. Ses vastes opérations dans les plantations de bananes et les réseaux de transport ont facilité la croissance économique et les opportunités d'emploi. Cependant, la domination de l'entreprise a suscité des inquiétudes quant à la répartition inégale des richesses et à la dépendance à l'égard des entités étrangères. Les pays d'Amérique centrale sont confrontés au défi d'équilibrer leurs propres intérêts avec ceux de la Standard Fruit Company, que certains perçoivent comme un symbole de contrôle étranger. Depuis 1949, l'entreprise continue d'exercer une influence sur l'économie et la politique de la région, contribuant ainsi à une relation complexe avec l'Amérique centrale."
 LATAM_UFC_DESC:0 "La §YUnited Fruit Company§! est une présence controversée en Amérique centrale. Initialement fondée en 1899, l'entreprise a établi de vastes plantations de bananes dans toute la région, acquérant ainsi une richesse et un pouvoir politique importants. Leur contrôle sur les réseaux de transport lui permettait de dicter ses conditions aux gouvernements locaux et de restreindre la concurrence des producteurs nationaux. Les opérations de l'entreprise sont souvent considérées comme exploitantes, avec des allégations d'abus en matière de travail, de dégradation de l'environnement et de répartition inégale des richesses. L'influence de la United Fruit Company se fait sentir dans toute la société centraméricaine, beaucoup la considérant comme un symbole d'exploitation étrangère. Au début de la guerre froide, la United Fruit Company a établi une relation complexe avec l'Amérique latine, qui reste controversée à ce jour."
 DOMESTIC_GROWER_DESC:0 "Cela représente le contrôle que le gouvernement, les propriétaires fonciers locaux et les entreprises nationales contrôlent sur les infrastructures et les terres du pays par rapport à celui contrôlé par les sociétés internationales."
 BELIZE_ESTATE_DESC:0 "La YBelize Estate Company§! joue un rôle important dans l'histoire de notre nation depuis sa création jusqu'à nos jours. Fondée en 1875 en Grande-Bretagne, l'entreprise a joué un rôle moteur dans le développement des secteurs agricole, infrastructurel et forestier du Belize. Les vastes plantations et les réseaux de transport de l'entreprise ont créé des opportunités d'emploi et contribué à la croissance de notre économie, tout en empêchant United Fruit Company et Standard Fruit Company d'étendre pleinement leurs opérations au Belize. Cependant, des inquiétudes ont été soulevées sur des questions telles que les conditions de travail et la répartition équitable des richesses. Dans l'ensemble, la Belize Estate Company reste un acteur crucial dans le cheminement de notre pays vers le développement et continue de façonner l'avenir du Belize. En outre, la Belize Estate Company est clairement un instrument colonial établi en Grande-Bretagne et représente une menace pour la souveraineté future de notre nation."

