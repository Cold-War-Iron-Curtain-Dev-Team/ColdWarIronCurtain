###Ideas###

ICE_anti_militarist_protests:0 "Manifestations antimilitaristes"

###Events###

ICE_elections.1.d:0 "Avec l'approche des élections, la coalition qui dirigeait le pays avant et depuis la fin de la guerre se dissout définitivement. Alors que le souvenir des émeutes anti-OTAN est encore présent à l'esprit, la question de la remilitarisation et de l'implication dans la guerre froide, entre autres questions telles que la détérioration de l'économie et des droits de pêche, devrait être des facteurs décisifs pour la population. Les sièges parlementaires seront disputés par les 4 principaux partis :\n\nLe Parti libéral-conservateur de l'Indépendance. Le plus grand parti au parlement et successeur des partis politiques de la période du royaume.\n\nLe Parti progressiste agraire. Représentant la population rurale et se positionnant au centre, ils sont de proches partisans du Parti de l'indépendance.\n\nLe Parti populaire social-démocrate. Populaires parmi la population urbaine pour leurs politiques favorables aux travailleurs et à l'aide sociale, ils offrent une alternative plus occidentale aux socialistes. Ils ont dirigé la coalition au cours de ses dernières années.\n\nLe Parti socialiste de l'unité populaire - Parti socialiste. Formé après la fusion du Parti communiste d'Islande avec les éléments radicaux du Parti populaire ; ils sont fermement opposés à la participation de l'OTAN et à la présence américaine sur l'île, préférant promouvoir des relations plus chaleureuses avec le bloc de l'Est."
ICE_elections.2.d:0 "L'élection présidentielle, qui se tient habituellement après les élections parlementaires, aurait lieu aujourd'hui si un candidat opposé était déclaré contre le président sortant Sveinn Björnsson.\n\nAncien régent de l'ère du Royaume, Björnsson occupe le siège de la présidence depuis qu'il a déclaré l'indépendance du pays du Danemark il y a 5 ans. Cela le rend sans aucun doute populaire auprès des citoyens islandais tout en suscitant le ressentiment du roi du Danemark.\n\nEn tant que président, Björnsson s'est révélé être un homme sévère et formel et profondément impliqué dans les politiques gouvernementales. Avec lui à la barre, on s'attend à ce que tout gouvernement formé lui plaise."
ICE_elections.3.d:0 "La Nation est en deuil aujourd'hui alors que nous faisons nos adieux à Son Excellence, Président et Père de la République. Bien que sa mort soudaine ait été un choc pour beaucoup ; en réalité, la santé du défunt président n'a cessé de se détériorer depuis 1947, son troisième mandat ne cessant de l'aggraver.\n\nDes funérailles nationales officielles auront lieu pour le défunt président à Reykjavík, où son cercueil sera transporté à travers les rues enneigées jusqu'au Parlement, puis de là jusqu'à sa dernière demeure.\n\nMême si son père est disparu, la République perdure. L'élection du prochain président aura lieu dans cinq mois."
ICE_elections.4.d:0 "Le moment est venu pour le peuple islandais d'élire le successeur de feu Björnsson. Puisque le président est responsable de la nomination du Premier ministre selon son jugement personnel, cette élection est aussi importante politiquement que spirituellement.\n\nLe candidat soutenu par les partis de gauche est l'ancien Premier ministre Ásgeir Ásgeirsson. Homme diplomatique, il s'est montré intéressé à améliorer la place de l'Islande parmi ses voisins maritimes. D'autres observateurs affirment qu'il poursuivrait la politique de son prédécesseur consistant à s'impliquer profondément dans le gouvernement, en veillant à ce que les partis de gauche aient toujours leur mot à dire au sein du gouvernement.\n\nEn revanche, les soutiens parmi les candidats de droite sont divisés. Tandis que la majorité des membres du parti et la presse soutiennent le révérend Bjarni Jónsson, ministre de la cathédrale de Reykjavík ; un troisième candidat a déclaré son intention de se présenter à la course, le président du Parlement Gísli Sveinsson. En tant que président ; Jónsson adopterait une approche non interventionniste du fonctionnement du gouvernement, se concentrant plutôt sur le contact avec la population et sur l'amélioration de la vie des gens ordinaires.\n\nS'il peut obtenir l'aval de Sveinsson, bien entendu."
ICE_elections.5.d:0 "A seulement trois mois des élections, un certain nombre de membres des partis progressiste, socialiste et populaire se sont réunis pour annoncer la création de leur nouveau parti politique. Se nommant Parti de la Défense nationale, le groupe est dirigé par le duo Bergur Sigurbjörnsson et Gils Guðmundsson et s'adresse à un public social-libéral mécontent du paysage politique actuel.\n\nLe principal programme du Parti semble être un rejet absolu de toute implication militaire avec des puissances étrangères, soutenant plutôt une politique étrangère neutre, la défense du pays étant laissée aux mains des Islandais. Ceci, ajouté à leurs opinions plus libérales sur le plan économique, en fait un danger potentiel pour le pouvoir uni des partis de gauche. Ou s'ils décident de coopérer avec eux, ils pourraient devenir un allié clé pour briser la majorité parlementaire du Parti de l'indépendance."
ICE_liberals.0.d:0 ""
ICE_liberals.1.d:0 "Malgré des mois de travail pour réformer et affiner notre économie nationale, les principaux problèmes résolus ne montrent pas encore d'amélioration. Parce que nous n'avons pas réussi à établir un budget sans déficit en plus de l'aide monétaire que nous recevons des États-Unis, l'inflation a maintenant grimpé à des niveaux que nous n'avions pas prévus lorsque nous avons formé notre gouvernement pour la première fois. Les subventions et les augmentations de salaire que nous avons introduites précédemment ont aplani les choses pendant un certain temps, mais avec la hausse de l'inflation, nous risquons de faire face à une menace pour la vie quotidienne des Islandais.\n\nNos partisans parlementaires, le Parti progressiste, ont déjà ouvert le dialogue avec les autres groupes pour trouver une solution entre eux."
ICE_liberals.2.d:0 "Comme on s'y attendait après les déclarations des dernières semaines contre la politique gouvernementale, une motion de censure a été officiellement demandée par le chef du Parti progressiste. Conformément à la demande du Président, un débat parlementaire en deux tours aura lieu, chaque parti bénéficiant de 30 minutes de discours pour le premier et de 15 minutes pour le deuxième tour.\n\nÉtant donné que le débat se déroulera en direct à la radio, les débatteurs ne s'adresseront pas seulement à leurs collègues mais aussi à leurs compatriotes, ce qui en fait une occasion importante pour les gens ordinaires d'apprendre ce qui se passe réellement dans le pays.\n\nLe premier à prononcer son discours fut Hermann Jónsson, chef du Parti progressiste. Son discours peut être décrit comme imputant les difficultés actuelles au gouvernement actuel et au gouvernement précédent et affirmant avoir averti les autres partis des conséquences, en vain."
ICE_socialists.1.d:0 "Les récentes victoires électorales des socialistes ont sans doute enhardi les partisans de la neutralité qui sont une fois de plus descendus dans les rues de Reykjavík. Comme en mars de cette année, des gens se sont rassemblés devant le Parlement pour protester et exiger la fin de la présence militaire américaine sur l'île et un retrait immédiat de l'OTAN. Entre eux et le Parlement se trouvent les partisans du gouvernement actuel, qui entendent une fois de plus le défendre.\n\nFinalement, la police locale est intervenue et la foule a été violemment dispersée. Le nombre d'émeutiers était cependant nettement plus important que la dernière fois, et de petites escarmouches entre groupes opposés se sont poursuivies jusqu'à la nuit.\n\nLa police sera mise en état d'alerte pour le reste du mois, mais étant donné la situation actuelle, une émeute à l'échelle de la ville pourrait bientôt survenir."
ICE_socialists.2.d:0 ""

