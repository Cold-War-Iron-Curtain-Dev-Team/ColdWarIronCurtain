l_french:

###Focuses###

ICE_Icelands_Place_In_Cold_War:0 "La place de l'Islande dans la guerre froide"
ICE_Icelands_Place_In_Cold_War_desc:0 "Même si notre alignement officiel sur les États-Unis et leur alliance militaire s'est avéré une décision de division dans notre pays, le coup d'État communiste en Tchécoslovaquie nous a montré qu'il n'y a aucune garantie que les grandes puissances respecteront notre position mondiale neutre. Pour protéger nos libertés démocratiques, la protection américaine doit rester étroite, mais autoriser la servitude aux étoiles et aux rayures ne sera pas mieux. Nous devons réfléchir attentivement à notre avenir et agir en conséquence."
ICE_Market_Town_Land_Reform:0 "Utiliser les terres cultivables dans les bourgs"
ICE_Market_Town_Land_Reform_desc:0 "Notre pays dispose d'un espace limité pouvant être alloué à l'agriculture, ce qui nécessite que l'espace agricole soit utilisé à son plein potentiel. Une nouvelle loi signée par le Premier ministre permettra au gouvernement central d'attribuer des terres arables dans les zones les plus peuplées à l'agriculture et à d'autres domaines jugés nécessaires."
ICE_Fruits_Of_Inflation_Control:0 "Les fruits d'un contrôle ciblé de l'inflation"
ICE_Fruits_Of_Inflation_Control_desc:0 "Malgré la stagnation de notre économie depuis la fin de la guerre, la planification économique minutieuse du gouvernement de coalition a réussi à nous maintenir à flot. Dirigée par le Parti populaire, cette comptabilité soigneusement vérifiée ainsi que le soutien financier fourni par le Plan Marshall nous ont permis d'avoir une capacité économique plus grande que celle que nous aurions normalement eue."
ICE_1949_Elections:0 "Les élections parlementaires de 1949"
ICE_1949_Elections_desc:0 "Les élections de 1949 s'annoncent mouvementées. La coalition des trois partis est sur le point de s'effondrer, car tous ont des idées et des politiques différentes pour stimuler notre économie. Avec seulement 35 sièges à conquérir, peu importe qui arrive en tête, il faudra faire des concessions et former une nouvelle coalition !"
ICE_Independence_Progressive_Coalition:0 "Parti de l'indépendance avec un soutien progressiste"
ICE_Independence_Progressive_Coalition_desc:0 "Comme prévu ; le Parti de l'indépendance a réussi à protéger sa avance parlementaire et le président du parti, Ólafur Thors, a été chargé par le président de former le nouveau gouvernement. Même s'il nous manque encore une majorité absolue pour former nous-mêmes un gouvernement en toute sécurité ; un peu de dialogue avec nos amis du Parti progressiste nous fera gagner leur appui, sans qu'il soit nécessaire de former une coalition. Après tout, c'est soit nous, soit les socialistes..."
ICE_Leftist_Coalition:0 "Une coalition de gauche"
ICE_Leftist_Coalition_desc:0 "À la surprise de beaucoup, les partis de gauche réunis occupent désormais avec une petite marge la majorité des sièges au Parlement. Cela montre que même si beaucoup soutenaient auparavant les partis traditionnels, l'implication de l'OTAN et les politiques libérales sont des problèmes trop importants pour ne pas changer de cap. Le Président de la République étant un antisocialiste notoire ; le rôle de former un nouveau gouvernement incombe une fois de plus au Parti populaire social-démocrate, malgré son caractère minoritaire."
ICE_Build_New_Herring_Factories:0 "Utilisation du bouillon de hareng"
ICE_Build_New_Herring_Factories_desc:0 "La pêche et l'agriculture sont la bouée de sauvetage de notre économie. Si nous voulons briser cette spirale descendante, nous devons utiliser au maximum nos atouts. Le projet de loi sur la construction d'une usine pour l'utilisation du bouillon de hareng, en vigueur immédiatement, permettra au gouvernement de construire librement des usines de transformation qui fonctionneront en tandem avec les usines de hareng existantes pour maximiser la production en fournissant directement les substances nécessaires en conséquence."
ICE_Economic_Restructuring:0 "Restructuration économique"
ICE_Economic_Restructuring_desc:0 "Stimuler l'économie sans provoquer un chômage de masse nécessite que nous adoptions successivement les lois prévues au Parlement. Il faut discuter des taux de change, modifier les salaires, fixer les impôts fonciers et les charges de production... Le nouveau modèle économique placera la Banque nationale et ses institutions à l'avant-garde et contribuera à ramener une croissance stable dans le pays."
ICE_Pursue_Free_Trade:0 "Poursuivre le libre-échange"
ICE_Pursue_Free_Trade_desc:0 "Notre récente entrée dans la sphère des puissances occidentales devrait naturellement s'accompagner de l'intégration de leurs valeurs économiques ainsi que de leurs valeurs démocratiques. Les pourparlers officiels menés avec le Dr Benjamín Eiríksson, qui est lui-même conseiller économique au Conseil d'administration du FMI, confirment davantage notre nécessité d'ouvrir davantage notre pays au commerce et aux investissements."
ICE_Progressive_Led_Coalition:0 "Coalition dirigée par les progressistes"
ICE_Progressive_Led_Coalition_desc:0 "Alors que nous arrivons à la conclusion du vote de censure, les choses semblent sombres pour le gouvernement Thors. Nos projets visant à maintenir un régime minoritaire à parti unique sont peut-être terminés pour de bon, mais tout n'est pas terminé pour nous. Grâce à l'intervention du président Björnsson, qui nous soutient résolument, nous pouvons convaincre le Parti progressiste de former avec nous un nouveau gouvernement. Nous devrons abandonner une grande partie de nos postes, notamment celui de Premier ministre, qui sera repris par le président du parlement Steingrímur Steinþórsson. Nous pourrions devenir le partenaire mineur de la coalition, mais cela dépasse certainement le risque d'avoir les communistes au gouvernement."
ICE_Continue_Devaluing_Krona:0 "Enregistrement du taux de change"
ICE_Continue_Devaluing_Krona_desc:0 "Avec le retour au pouvoir d'un gouvernement confiant, notre première priorité devrait être de sauver le commerce d'exportation. Les partis d'opposition et même la Confédération islandaise des syndicats ont clairement indiqué que l'ouverture de nouveaux marchés et de nouvelles industries serait dans le meilleur intérêt de la classe ouvrière ; nous ne sommes pas en mesure de répondre à toutes leurs revendications. La poursuite de la politique précédente de dévaluation pourrait être une épine dans le pied des travailleurs, mais elle nous permettra d'augmenter nos exportations et d'apporter une puissance monétaire indispensable à notre nation."
ICE_Lower_Income_Tax_Reduction:0 "Allégements fiscaux pour les ménages à faible revenu"
ICE_Lower_Income_Tax_Reduction_desc:0 "La dévaluation de la monnaie a commencé à faire des ravages sur la classe inférieure, comme prévu, et les progressistes ont décidé de leur prêter main forte. Un nouveau projet de loi proposé par le Premier ministre Steinþórsson promet à tout foyer dont le revenu annuel net est inférieur à 20 000 couronnes (24 000 à la demande du Président) une réduction d'impôt sur le revenu de 33 %. Selon nos conseillers financiers, le projet de loi entraînera une perte fiscale potentielle estimée à deux millions et demi pour le Trésor. Espérons que l'augmentation des échanges commerciaux nous permettra de compenser la perte de revenus."
ICE_Assit_Construct_Resident_Building:0 "Aide Publique Pour La Construction De Bâtiments Résidentiels"
ICE_Assit_Construct_Resident_Building_desc:0 ""
ICE_Improve_Rural_Livelihood:0 "Améliorations des moyens de subsistance en milieu rural"
ICE_Improve_Rural_Livelihood_desc:0 ""
ICE_An_Update_To_Social_Security:0 "Rattraper son retard en matière de sécurité sociale"
ICE_An_Update_To_Social_Security_desc:0 ""
ICE_Funding_To_Universities_Students:0 "Concentrer le financement sur l'enseignement supérieur"
ICE_Funding_To_Universities_Students_desc:0 ""
ICE_Appease_Anti_NATO_Crowd:0 "Apaiser la foule anti-OTAN"
ICE_Appease_Anti_NATO_Crowd_desc:0 "Chaque jour qui passe, la situation dans la capitale et dans le reste de l'île s'aggrave. Nous n'avons pas l'intention d'abandonner nos alliés après avoir atteint ce stade, mais les préoccupations de la population doivent être prises en compte avant le prochain grand tumulte. En demandant moins d'aide au gouvernement américain et en promettant aux gens ce qu'ils veulent entendre, nous pouvons gagner un temps précieux sans détruire nos relations fructueuses avec l'Occident."
ICE_Open_Trade_With_East_Bloc:0 "Ouvrir le commerce avec le bloc de l'Est"
ICE_Open_Trade_With_East_Bloc_desc:0 ""
ICE_Focus_On_Nordic_Relations:0 "Déplacer l'attention diplomatique vers les pays nordiques"
ICE_Focus_On_Nordic_Relations_desc:0 ""
ICE_Trawlers_Fisher_Wages:0 "Le projet de loi sur le soutien aux pêcheurs du pays"
ICE_Trawlers_Fisher_Wages_desc:0 ""
