ICE_Minks_Silver_Foxes_desc:0 ""
ICE_Korean_War:0 "Guerre en Corée"
ICE_Korean_War_desc:0 ""
ICE_Strike_A_Policy_Of_Balance:0 "Adopter une politique d'équilibre"
ICE_Strike_A_Policy_Of_Balance_desc:0 ""
ICE_Increase_Commitments_To_West:0 "Augmenter les engagements envers l'Ouest"
ICE_Increase_Commitments_To_West_desc:0 ""
ICE_Nordic_Council_Involvement:0 "Implication du Conseil nordique"
ICE_Nordic_Council_Involvement_desc:0 ""
ICE_Support_Faroese_Independence:0 "Soutenez l'indépendance des îles Féroé"
ICE_Support_Faroese_Independence_desc:0 "Les Féroïens sont depuis longtemps des sujets de la couronne danoise, tout comme nous l'étions jusqu'à récemment. Bien qu'ils aient organisé avec succès leur propre référendum sur l'indépendance après la guerre, le roi y a répondu en le déclarant nul et en dissolvant le parlement féroïen. En raison de nos circonstances similaires, les Féroïens et nous avons développé une culture et une langue communes très différentes de celles de nos frères du continent. Si nous voulons réellement promouvoir une paix et une coopération durables entre les pays nordiques, notre priorité doit être de voir les voeux de nos frères du Sud se réaliser."
ICE_Defense_Of_Iceland:0 "Défense de l'Islande"
ICE_Defense_Of_Iceland_desc:0 "L'Islande n'a pas eu d'armée permanente au cours des 80 dernières années. Les dernières tentatives remontent à la guerre, lorsque nous avons tenté d'organiser la police nationale en force militaire, mais l'invasion britannique et la période d'occupation ont mis fin à cet effort. Notre peuple a depuis longtemps renoncé à la guerre et fait preuve de dédain à l'égard de toute forme de militarisation au-delà de ce qui est nécessaire, comme l'ont montré les émeutes qui ont suivi notre signature du Traité de l'Atlantique Nord. Mais les temps changent, nous devrons décider d'une solution permanente en matière de défense nationale avant que la prochaine guerre ne survienne."
ICE_Defense_Of_Iceland_Agreement:0 "L'accord de défense de l'Islande"
ICE_Defense_Of_Iceland_Agreement_desc:0 ""
ICE_Renovate_Keflavik_Military_Structures:0 "Rénover les structures militaires de Keflavik"
ICE_Renovate_Keflavik_Military_Structures_desc:0 ""
ICE_Renovate_Keflavik_Civillian_Structures:0 "Rénover les structures civiles de Keflavik"
ICE_Renovate_Keflavik_Civillian_Structures_desc:0 "La base aérienne de Keflavik n'est pas seulement une station radar militaire, elle abrite également le plus grand aéroport de l'île et constitue notre principale connexion avec le monde extérieur. La rénovation des installations aéroportuaires civiles pour les vols internationaux relève de notre responsabilité conformément à l'accord. L'Islande est un endroit aux nombreuses beautés naturelles, et permettre aux gens de venir la voir par eux-mêmes nous permettra de démarrer une petite industrie touristique."
ICE_Incorporate_Radar_Systems:0 "Incorporer des systèmes de radar américains"
ICE_Incorporate_Radar_Systems_desc:0 ""
ICE_Increased_Presence_Of_US_Interceptors:0 "Augmenter la présence des intercepteurs américains"
ICE_Increased_Presence_Of_US_Interceptors_desc:0 ""
ICE_Icelandic_Defense_Force:0 "La Force de défense islandaise"
ICE_Icelandic_Defense_Force_desc:0 "Nous ne pouvons pas compter sur des puissances extérieures pour superviser notre sécurité à notre place. Les valeurs et les dirigeants changent avec le temps, les amis d'aujourd'hui peuvent être les ennemis de demain. Seule une force véritablement islandaise peut garantir la loyauté jusqu'au bout. Au lieu de nous enchaîner aux Américains, nous les considérerons sur un pied d'égalité, comme le reste des pays de l'OTAN. Et nous serons maîtres de notre destin !"
