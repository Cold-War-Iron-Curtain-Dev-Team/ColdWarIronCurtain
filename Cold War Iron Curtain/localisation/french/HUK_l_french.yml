 huk_chinese_advisors_desc:0 "Représentés par la branche chinoise du PKP, ces conseillers du continent nous ont beaucoup aidés pendant et après l'invasion japonaise. Même si leur influence sur le commandement de l'armée a certainement diminué depuis la fin de la guerre, nous pouvons toujours compter sur eux pour prendre l'avantage sur l'ennemi."
 huk_stalin_university:0 "L'Université Staline"
 huk_stalin_university_desc:0 "Située au pied de la chaîne de montagnes de la Sierra Madre, l'Université Staline est un institut d'enseignement semi-permanent où les recrues prometteuses apprennent toutes les manières de se battre et où les gens sont éduqués dans le système marxiste. Étant un camp mobile, l'institution peut être déplacée en cas de raids gouvernementaux pour s'assurer qu'elle ne cesse jamais de fonctionner."
