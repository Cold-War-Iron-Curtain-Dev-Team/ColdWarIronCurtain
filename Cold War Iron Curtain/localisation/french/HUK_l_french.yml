###Events###
 HUK_prp.1.t:0 "Le sixième congrès du parti Hukbalahap"
 HUK_prp.1.d: "Notre Parti communiste des Philippines a convoqué le sixième congrès du parti, proclamé premier congrès révolutionnaire véritablement libre du peuple philippin depuis l'époque d'Andres Bonifacio et du Katipunan. Tenu sous l'autorité de notre nouveau gouvernement populaire, le congrès a marqué la transition formelle de la révolution armée à la construction d'un État socialiste.\n\nLes délégués des armées paysannes, des syndicats ouvriers et des quartiers libérés se sont réunis pour définir les fondements de la nouvelle société. Au centre du Congrès se trouvaient des résolutions sur la déshaciendanisation et la réforme agraire radicale, déclarant l'abolition des domaines fonciers et la redistribution et la collectivisation des terres comme la revendication historique de la paysannerie. Tous les principaux moyens de production et possessions capitalistes accumulées ont été déclarés soumis à la propriété sociale dans le cadre de l'État populaire.\n\nLe Congrès a également souligné l'éradication de l'analphabétisme comme un devoir révolutionnaire, liant l'éducation de masse à la conscience politique et à la libération nationale. La réforme culturelle et le démantèlement des anciennes institutions d'élite ont été présentés comme des étapes essentielles pour briser l'héritage du colonialisme et du capitalisme féodal.\n\nEn conclusion du Congrès, c'est maintenant au bureau politique de choisir entre deux dirigeants : Luis Turac, notre leader actuel, et un socialiste-démocrate-chrétien ; ou encore Guillermo Capadocia, figure éminente du parti et communiste orthodoxe. Alors que les votes sont comptés un par un, le bureau politique était toujours aussi tendu. Enfin, la décision du congrès sera..."
 HUK_prp.1.a:0 "Le Congrès conserve Luis Taruc."
 HUK_prp.1.b:0 "Le Congrès élit Guillermo Capadocia."
 HUK_prp.2.t: "Dénonciation de l'État croupion du Sud"
 HUK_prp.2.d: "Alors que la glorieuse révolution triomphe dans une grande partie de Luçon, notre gouvernement populaire dirigé par le camarade [HUK.GetLeader] et le Département des communications et de la propagande de notre Parti communiste ont formellement dénoncé le soi-disant « État des Philippines du Sud » comme un vestige illégitime de l'impérialisme. Notre Président a déclaré que l'ancienne République des Philippines s'est effondrée, son autorité réduite à une clique de fonctionnaires et de généraux en fuite qui ont fui vers Mindanao sous protection étrangère.\n\nL'administration du Sud ne représente rien de plus qu'un refuge soutenu par les États-Unis pour les méchants réactionnaires, les propriétaires fonciers et les commandants militaires vaincus qui ne veulent pas accepter la volonté du peuple philippin. Notre Parti a condamné ces forces pour avoir tenté de diviser la nation et de prolonger la guerre civile au service des intérêts américains.\n\nL'Armée populaire a également pris note des déploiements navals américains depuis les Palaos, les décrivant comme un acte clair d'intimidation visant à contenir la révolution. Les porte-parole révolutionnaires ont averti que l'ingérence étrangère ne ferait que renforcer la résistance populaire et accélérer la libération des îles du sud.\n\nNotre Parti communiste a appelé les habitants de Mindanao et des Visayas à rejeter l'État croupion, à se soulever contre le régime réactionnaire et à achever la phase finale de la Révolution nationale pour des Philippines unies, indépendantes et socialistes."
 HUK_prp.2.a: "Nous devons être unis sur la terre et unis dans la pensée."
 HUK_prp.3.t: "Le culte du camarade Andrés Bonifacio"
 HUK_prp.3.d: "Notre gouvernement populaire et le Parti communiste ont officiellement proclamé le culte du camarade Andrés Bonifacio, l'élevant comme l'ancêtre révolutionnaire suprême des masses philippines et un « bolchevique avant la lettre », un révolutionnaire qui incarnait la lutte prolétarienne avant l'arrivée du marxisme dans l'archipel. La déclaration présentait Bonifacio non seulement comme un héros national, mais aussi comme l'ancêtre spirituel et idéologique de l'actuelle révolution socialiste.\n\nNos théoriciens du Parti ont souligné que Bonifacio puisait sa force dans la résistance armée du Katipunan et dans les idéaux universels de liberté, d'égalité et de fraternité nés des vieilles révolutions démocratiques bourgeoises, notamment celle de France. Inspiré par les critiques anticoloniales trouvées dans les romans de José Rizal, Bonifacio rejette néanmoins les limites du réformisme et des « appels » aux maîtres coloniaux, reconnaissant la lutte armée comme la seule voie vers une véritable libération.\n\nLe Katipunan, fondé le 7 juillet 1892, a été célébré comme la première organisation à unir les travailleurs et les paysans de Luçon, des Visayas et de Mindanao sous une seule bannière de libération nationale. Grâce à une organisation clandestine et à une participation massive, il a transformé des siècles de révoltes éparses en un mouvement révolutionnaire unifié. Le déclenchement de la Révolution de 1896 et l'exécution de Rizal ont été présentés comme des moments décisifs prouvant la nécessité d'une résistance armée contre la domination coloniale.\n\nLe congrès déclara en outre que la dépendance du Katipunan aux bolos et au sacrifice des masses travailleuses symbolisait le caractère révolutionnaire authentique de la lutte de Bonifacio, une lutte qui se poursuivait à travers la résistance contre la domination américaine."
 HUK_prp.3.a: "C'est le moment où la lumière de la vérité fait surface."
 HUK_prp.4.t: "Commencer le processus de dé-catholicisation"
 HUK_prp.4.d: "Notre gouvernement populaire, sous la direction du président [HUK.GetLeader] et du Parti communiste, a annoncé une campagne nationale de dé-catholicisation dans le cadre de la transformation culturelle et idéologique plus large des Philippines révolutionnaires. La déclaration affirmait que le christianisme, tel qu'imposé et pratiqué sous la domination espagnole puis bourgeoise, avait été systématiquement déformé et utilisé comme arme par les élites coloniales pour préserver la hiérarchie de classes, la domination raciale et la passivité sociale.\n\nLes résolutions du parti déclaraient que le message originel attribué à Jésus-Christ - la vie communautaire, le rejet de la richesse et la solidarité avec les pauvres - avait été détourné par les administrateurs coloniaux, les élites terriennes et la bourgeoisie compradore. Par le biais de conversions forcées, de dîmes et d'autorité cléricale, le catholicisme était décrit comme un mécanisme qui disciplinait les masses, sanctifiait les inégalités et légitimait la domination étrangère tout en érodant les cultures et les systèmes de croyance autochtones.\n\nNotre société révolutionnaire ne pouvait plus s'appuyer sur des institutions qui justifiaient l'obéissance féodale, l'exploitation de classe et l'ordre colonial racialisé. Les églises furent dépossédées de leur autorité politique, l'éducation religieuse fut supprimée des institutions publiques et les privilèges cléricaux furent abolis."
 HUK_prp.4.a: "La raison nous apprend à ne pas perdre de temps à espérer la prospérité promise qui ne viendra jamais et ne se matérialisera jamais."
 HUK_prp.5.t: "La question capitale"
 HUK_prp.5.d: "Suite à la consolidation du pouvoir par notre gouvernement révolutionnaire, le statut de la capitale nationale est apparu comme un enjeu politique et économique majeur. Quezon City, proclamée capitale en 1948 par l'ancien régime fantoche de Quirino, a été officiellement dénoncée par notre Parti comme un projet vaniteux bourgeois - mal planifié, inachevé et financièrement compromis. Des audits révolutionnaires ont révélé qu'un grand nombre de conseillers, d'entrepreneurs et d'intermédiaires politiques étrangers avaient fui le pays lors de l'effondrement de l'ancienne république, emportant avec eux les millions de pesos alloués à la construction de la ville.\n\nLe Parti communiste et la direction de Hukbalahap ont critiqué Quezon City comme un symbole de la corruption des élites : une capitale artificielle imposée alors que Manille elle-même souffrait de graves pénuries de logements, d'une expansion des bidonvilles, de crises sanitaires et d'une congestion chronique dans des quartiers tels que Tondo, Binondo, Quiapo et Intramuros. \n\nUne nouvelle proposition appelait à déplacer la capitale à Baguio, citant son altitude plus élevée, sa vulnérabilité réduite aux typhons, sa position stratégique dans le centre de Luçon et ses vastes zones non développées adaptées à l'expansion urbaine socialiste planifiée."
 HUK_prp.5.a: "Retour temporaire à Manille"
 HUK_prp.5.b: "Achèvement de la ville de Quezon"
 HUK_prp.5.c: "Déménagement à Baguio"
 HUK_prp.6.t: "Unification du mouvement ouvrier sous le KAP"
 HUK_prp.6.d: "Après la victoire de notre révolution populaire, le gouvernement Hukbalahap et le Parti communiste ont proclamé la fusion totale de tous les syndicats et organisations de travailleurs indépendantes en une seule fédération nationale : le Katipunan ng mga Anak-Pawis sa Pilipinas (KAP), officiellement désigné comme le Syndicat unifié des travailleurs des Philippines.\n\nLe nouvel État a déclaré que le mouvement ouvrier fragmenté de l'ancienne république avait été délibérément affaibli par les autorités coloniales, les dirigeants réformistes et les élites compradores. Des syndicats rivaux, des fonctionnaires corrompus et des contraintes légalistes auraient divisé les travailleurs selon des critères sectoriels, régionaux et ethniques, empêchant ainsi une action de classe unifiée. La consolidation des organisations syndicales a été présentée comme une correction historique, rétablissant la continuité révolutionnaire du mouvement ouvrier remontant au Katipunan original et aux premières luttes prolétariennes des années 1920 et 1930.\n\nS'appuyant sur l'héritage de Crisanto Evangelista, Guillermo Capadocia, Luis Taruc et du Mouvement ouvrier collectif d'avant-guerre, le KAP s'est reconstitué comme l'unique représentant du prolétariat dans les usines, les plantations, les ports et les réseaux de transport. Tous les syndicats existants ont reçu l'ordre de se dissoudre et de se réenregistrer auprès des structures du KAP, alignant ainsi l'organisation du lieu de travail directement sur la direction du Parti et de l'État révolutionnaire."
 HUK_prp.6.a: "La diligence dans votre travail quotidien pour gagner votre vie est la véritable expression de l'amour et de l'affection."
 HUK_prp.7.t: "Le sort du culte de Quezon"
 HUK_prp.7.d: "Avec la consolidation de notre gouvernement révolutionnaire, notre Parti et le Conseil populaire provisoire ont été contraints de faire face à l'héritage du président Manuel L. Quezon et au culte de la personnalité qui s'était développé autour de lui pendant l'ère du Commonwealth.\n\nQuezon occupait une position particulièrement contradictoire dans le discours révolutionnaire. En tant que nationaliste bourgeois et chef du Commonwealth soutenu par les États-Unis, il était indéniablement lié aux structures impériales américaines. Pourtant, on se souvient également de lui comme d'un champion de l'indépendance nationale, de la justice sociale, de la langue nationale et du bien-être des paysans. Son mépris de l'occupation japonaise, de la direction du gouvernement en exil et du sauvetage humanitaire des Juifs européens ont encore compliqué les tentatives de simple condamnation.\n\nLuis Taruc lui-même a exprimé un respect personnel. Bien qu'il appartienne à des camps idéologiques opposés, Taruc respectait la sincérité de Quezon envers la paysannerie, tandis que Quezon avait reconnu en privé Taruc comme un véritable leader de masse plutôt que comme un agitateur criminel. Taruc a également rappelé ses liens de longue date avec la famille Quezon, notant leur refus de croire à la propagande hostile contre lui, même après la tragique embuscade de 1949 qui a tué Aurora Quezon.\n\nIl reste deux options à ce sujet :"
 HUK_prp.7.a: "Donnez-lui une réinterprétation révolutionnaire."
 HUK_prp.7.b: "Démystifiez-le totalement."
 HUK_prp.8.t: "Changement de nom de la province de Quezon"
 HUK_prp.8.d: "À la suite d'une consultation populaire nationale organisée par notre gouvernement révolutionnaire, la province de Quezon a été officiellement rebaptisée province Evangelista, en hommage à Crisanto Abaño Evangelista, fondateur du Partido Komunista ng Pilipinas, leader syndical et martyr de la lutte anti-impérialiste.\n\nLe vote a été présenté comme une rupture symbolique avec le nationalisme libéral bourgeois et une réaffirmation des racines prolétariennes de la révolution philippine. L'héritage d'Evangelista en tant qu'organisateur des syndicats d'ouvriers, de paysans et d'imprimeurs a été souligné comme étant plus représentatif des masses que les figures d'élite du Commonwealth.\n\nCependant, la question de Quezon City reste en suspens. Malgré la pression des cadres du Parti pour prolonger la campagne de changement de nom, un fort attachement populaire à Manuel L. Quezon persiste parmi les citadins, les fonctionnaires et les nationalistes modérés. " 
 HUK_prp.8.a: "Quel amour peut être plus pur et plus grand que l'amour du pays ?"
 
