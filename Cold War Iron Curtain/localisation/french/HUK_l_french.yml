 huks_attack_manila:0 "Assaut de Manille"
 huks_attack_manila_desc:0 "Nos combattants se sont entraînés, la base de notre parti a été renforcée et nos partisans se comptent par millions. Le moment est venu de lancer notre marche vers le capital national et de faire tomber le système bourgeois une fois pour toutes !"
 huks_attack_hacienda_luisita:0 "Préparez une attaque contre l'Hacienda Luisita"
 huks_attack_hacienda_luisita_desc:0 "L'Hacienda Luisita est une plantation sucrière de 6,4 mille hectares située au coeur de la ville de Tarlac. Malgré l'existence d'une inimitié naturelle entre nous, nos relations avec la plantation n'ont pas été toutes mauvaises. À l'exception de quelques incidents au fil des années, les dirigeants ont autorisé nos soldats Huk à utiliser leurs installations et ont même permis de recruter des travailleurs locaux pour notre cause. Ces relations sympas ne sont bien sûr pas sans inconvénients. La plantation constitue le plus grand obstacle à notre expansion dans les régions au-delà.\n\nFaire des plantations un ennemi déclaré les poussera sûrement à soutenir les forces gouvernementales pour nous éradiquer, et nous pouvons tout simplement les ignorer jusqu'à ce que la révolution soit accomplie. Mais si nous voulons atteindre les habitants de l'ouest de Luçon, il est indispensable de libérer la plantation."
