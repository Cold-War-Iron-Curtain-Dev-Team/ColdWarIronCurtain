 HUK_insurgency.1.t:0 "La défense de Manille"
 HUK_insurgency.1.d:0 "La marée rouge a été stoppée aux portes de la capitale. Après des jours de combats urbains brutaux à Quezon City et à San Juan, l'offensive Hukbalahap a été repoussée par une force combinée de soldats loyalistes, de milices volontaires et de renforts de dernière minute venus des provinces du sud.\n\nMalgré les premiers gains des insurgés, les positions fortifiées du gouvernement le long de la rivière Pasig et le dernier combat héroïque à Fort Bonifacio ont brisé les reins de l'offensive de Huk. Manille reste aux mains des loyalistes.\n\nLa ville porte de profondes cicatrices : des centaines de bâtiments sont en ruines et les victimes civiles se comptent par milliers. Mais alors que la fumée se dissipe, le drapeau philippin flotte toujours au-dessus du palais de Malacañang. Une victoire qui remonte le moral et pourrait inverser le cours de la guerre."
 HUK_insurgency.1.a:0 "La République perdure !"
 HUK_insurgency.2.t:0 "La chute de Manille"
 HUK_insurgency.2.d:0 "Un chapitre sombre s'abat sur la République. Après des semaines de combats de rue et l'effondrement de plusieurs lignes défensives, les forces de Hukbalahap ont pris le contrôle de Manille. Les troupes gouvernementales ont été mises en déroute ou contraintes de se retirer dans les provinces du sud.\n\nLes transmissions radio depuis la capitale capturée diffusent désormais des slogans communistes et des proclamations de « République populaire ». Les bâtiments gouvernementaux sont détruits et le Congrès philippin a fui ou est resté silencieux. Le palais présidentiel aurait été pillé et transformé en siège du Conseil révolutionnaire.\n\nLa perte de Manille est plus que symbolique : elle porte un coup dur au moral national et sape notre légitimité sur la scène mondiale. À moins que des renforts immédiats ne soient mobilisés, la survie de la République philippine elle-même est en jeu."
 HUK_insurgency.2.a:0 "Nous récupérerons chaque centimètre carré de cette terre."
 HUK_insurgency.3.t:0 "Le drapeau du peuple se lève sur Manille !"
 HUK_insurgency.3.d:0 "Camarades, réjouissez-vous ! L'ancien régime corrompu est tombé ! Après de féroces combats urbains et le sacrifice héroïque de milliers de guérilleros, Manille arbore désormais la bannière du gouvernement populaire. Les restes de l'élite compradore et les marionnettes américaines ont fui ou se sont rendus.\n\nLa population est descendue dans la rue, démantelant les vieilles statues coloniales, brûlant les registres fonciers et prenant d'assaut les armureries du gouvernement. Le Conseil populaire révolutionnaire a déclaré la formation d'un gouvernement révolutionnaire provisoire pour représenter les ouvriers, les paysans et les soldats.\n\nDans un discours prononcé devant les ruines du palais de Malacañang, le camarade suprême Luis Taruc a déclaré : « Des cendres de la tyrannie est née une nouvelle démocratie populaire ! Manille est libre ! Luçon sera libre ! L'archipel sera libre !\n\nLa révolution n'est plus un rêve. C'est le coeur battant de notre nouvelle réalité."
 HUK_insurgency.3.a:0 "En avant vers la libération totale !"
 HUK_insurgency.4.t:0 "Assaut raté contre Manille"
 HUK_insurgency.4.d:0 "Il était presque à portée de main : le drapeau du peuple hissé sur Malacañang. Mais la tentative finale a échoué. L'offensive de Manille, autrefois saluée comme une frappe de libération qui allait écraser le régime bourgeois, a été repoussée par des tirs d'artillerie concentrés, des troupes loyalistes massives et des renforts inattendus en provenance des Visayas.\n\nLes unités de guérilla ont été contraintes de se retirer des banlieues après avoir subi de lourdes pertes. À Tondo et Makati, les soulèvements populaires ne se sont pas concrétisés et les sympathisants présumés ont été arrêtés par les forces gouvernementales.\n\nLe Supremo Luis Taruc s'est adressé au Comité central : \"Ce n'est qu'un revers. Les masses restent avec nous. Nous reculons aujourd'hui pour avancer demain. La révolution est longue et amère\", appelant à la discipline et à la résilience.\n\nMême si le moral en a pris un coup, la vision d'une République populaire reste vivante. La réorganisation et la consolidation rurale seront désormais prioritaires."
 HUK_insurgency.4.a:0 "Camarades, nous avons perdu une bataille mais pas la guerre."
 HUK_insurgency.5.t:0 "Le gouvernement philippin demande une aide supplémentaire"
 HUK_insurgency.6.t:0 "Magsaysay revient de Washington"
 HUK_insurgency.7.t:0 "Les propriétaires de plantations s'engagent à soutenir"
 HUK_insurgency.7.d:0 "Une attaque dévastatrice menée par les guérilleros de Hukbalahap contre l'Hacienda Luisita, l'une des plus grandes plantations sucrières de Tarlac, a choqué l'élite terrienne de Luçon. Plusieurs ouvriers et membres du personnel de sécurité ont été tués, du matériel incendié et des entrepôts pillés. L'attaque, justifiée par les rebelles comme une « grève contre la féodalité », a suscité l'indignation des propriétaires de plantations et des intérêts commerciaux.\n\nEn réponse, les principaux propriétaires fonciers de Tarlac, Pampanga et Negros ont publié un communiqué commun dans lequel ils promettent leur plein soutien financier et logistique à la campagne anti-insurrectionnelle du gouvernement. Les dons de camions, de radios et d'argent liquide affluent déjà vers les dépôts militaires, et certains sont allés jusqu'à recruter des auxiliaires de sécurité privés sous la supervision du gouvernement.\n\nMême si l'attaque a accru les tensions dans les campagnes, le gouvernement se retrouve désormais face à un nouveau bloc de partisans puissants - et aux ressources correspondantes."
 HUK_insurgency.7.a:0 "Leur richesse financera notre victoire."
 HUK_insurgency.8.t:0 "Ramon Magsaysay : le nouveau visage de l'oppression"
 HUK_insurgency.9.t:0 "La coopération politico-militaire est sur le point de s'effondrer"
 HUK_insurgency.10.t:0 "[GetNewspaperHeader]Luis Taruc déclare la République populaire des Philippines"
 HUK_insurgency.10.d:0 "Dans une tournure étonnante des événements, les forces de Hukbalahap dirigées par le président Luis Taruc ont pris le contrôle de Manille, déclarant la victoire finale de la révolution philippine et l'expulsion du colonialisme américain et de ses collaborateurs de la République philippine. S'exprimant depuis le palais de Malacañang, Taruc a proclamé la création de la République populaire des Philippines, déclarant que la révolution déclenchée pour la première fois par Andres Bonifacio était désormais accomplie puisque la révolution Huk était la véritable et légitime continuation de la lutte inachevée de Bonifacio et que le peuple philippin s'était enfin libéré de la domination impérialiste.\n\nAvec la chute de la capitale, les restes du gouvernement de la République des Philippines, notamment des hauts fonctionnaires et des commandants militaires, ont fui vers le sud, vers Mindanao, dans l'espoir de se regrouper et de poursuivre leur lutte contre les forces communistes. L'administration autrefois dominante se retrouve désormais en plein désarroi, cherchant désespérément à maintenir son emprise sur les îles du sud.\n\nEn réponse à l'avancée rapide du Hukbalahap, le Commandement indo-pacifique des États-Unis (INDOPACOM) a mobilisé des forces navales depuis les Palaos, déployant des navires de guerre pour bloquer toute nouvelle expansion des rebelles et empêcher la révolution de s'étendre au-delà de Luçon."
 HUK_insurgency.10.a:0 "Une autre division en Asie."
 HUK_insurgency.11.t:0 "Incursion d'État expulsée"
 HUK_insurgency.12.t:0 "Contrôle de l'État perdu"
 HUK_insurgency.13.t:0 "Forces ennemies expulsées"
 HUK_insurgency.14.t:0 "Incursion ratée"
 HUK_insurgency.15.t:0 "Raid du gouvernement contre le Politburo du PKP"
 HUK_insurgency.16.t:0 "Le général Ramos relevé de ses fonctions par Magsaysay"
 HUK_insurgency.16.d:0 "Suite à une série d'opérations ratées à Nueva Ecija et à l'embuscade désastreuse près du mont Arayat, la confiance de l'opinion publique dans les dirigeants de l'armée a été ébranlée. Les critiques de l'incapacité du général Fidel Ramos à sécuriser les régions infestées de rebelles se sont multipliées non seulement de la part des dirigeants civils mais aussi au sein de l'armée elle-même.\n\nLe secrétaire à la Défense Ramón Magsaysay, une étoile montante dans les cercles anticommunistes, a agi de manière décisive en relevant le général Ramos de son commandement. À sa place, une nouvelle génération de jeunes officiers formés aux États-Unis assumera des rôles de leadership, promettant des tactiques modernes, une meilleure coordination et une coopération plus étroite avec les réseaux de renseignement au niveau des villages.\n\nCe remaniement audacieux a ébranlé les officiers supérieurs, mais il envoie un signal clair : l'incompétence ne sera pas tolérée dans la lutte contre l'insurrection."
 HUK_insurgency.16.a:0 "C'est une guerre que nous ne pouvons pas nous permettre de perdre ou de mal gérer."
 HUK_insurgency.17.t:0 "Signaux de danger en provenance de Manille"
 HUK_insurgency.17.d:0 "Depuis la mort de Vicente Lava en 1947, le Parti s'est largement appuyé sur la direction de José Lava, qui a assumé le poste de secrétaire général du Comité central du Partido Komunista ng Pilipinas (PKP) en mai 1948. Membre chevronné du bureau politique et ancien chef du comité des finances du Parti, Lava a centralisé une grande partie de la prise de décision stratégique du Parti à Manille, estimant qu'un contrôle politique ferme sur la clandestinité urbaine était essentiel pour guider le parti. Lutte armée dans les campagnes.\n\nCependant, des rapports alarmants des services de renseignement suggèrent désormais que cette centralisation pourrait être devenue une faiblesse fatale. Les passeurs du parti signalent une activité de surveillance inhabituelle, des refuges compromis et la disparition soudaine de plusieurs intermédiaires de confiance. Plus inquiétant encore, des informateurs au sein de la police affirment que les lieux du Parti ont été divulgués, soit par l'intermédiaire d'informateurs, de détenus torturés ou de communications interceptées.\n\nLa situation politique s'est rapidement détériorée depuis septembre 1950, lorsque l'ancien chef de la guérilla de l'USAFFE, Ramon Magsaysay, a été nommé ministre de la Défense nationale sur les conseils de responsables américains. Contrairement à ses prédécesseurs, Magsaysay a poussé à des mesures anti-insurrectionnelles agressives et a exhorté le président Elpidio Quirino à suspendre l'ordonnance d'habeas corpus pour la durée de la campagne de Huk.\n\nSi l'État agit maintenant contre nous, il ne ciblera pas seulement les combattants sur le terrain : il visera à décapiter le Parti lui-même."
 HUK_insurgency.17.a:0 "Ces rapports sont exagérés - maintenez les opérations normales."
 HUK_insurgency.17.b:0 "Augmentez la sécurité, limitez les communications et préparez les itinéraires d'évacuation."
 HUK_insurgency.18.t:0 "Opération contre le Secrétariat Rouge"
 HUK_insurgency.18.d:0 "Les rumeurs étaient vraies. Aux premières heures du 18 octobre 1950, les forces de sécurité gouvernementales lancèrent une opération coordonnée à travers Manille. Agissant sous les ordres directs du ministre de la Défense Ramon Magsaysay, les unités de la police ont frappé avec une rapidité et une précision rarement vues auparavant.\n\nL'arrestation antérieure de plusieurs membres du Politburo avait déjà affaibli les défenses du Parti. Désormais, grâce aux renseignements recueillis grâce à ces captures, les forces gouvernementales ont agi de manière décisive contre les dirigeants restants. Les refuges ont été encerclés simultanément, les communications coupées et les voies de fuite bloquées.\n\nL'objectif était clair : le Secrétariat du Comité central lui-même.\nL'enjeu n'est rien de moins que la survie de la direction nationale du PKP, y compris du secrétaire général José Lava.\n\nC'est le moment de la décision. Ou bien le Parti disparaît dans la clandestinité, ou bien il est entraîné dans la lumière."
 HUK_insurgency.18.a:0 "Activez le plan d'évacuation - dispersez le Comité central."
 HUK_insurgency.18.b:0 "Tenir le poste - faire confiance au secret et à la discipline."
 HUK_insurgency.19.t:0 "Le parti survit au Net"
 HUK_insurgency.19.d:0 "Grâce à une combinaison de discipline, de chance et de soutien populaire, l'évacuation réussit. Sous le couvert de l'obscurité et avec l'aide des réseaux ruraux contrôlés par Huk, le secrétaire général José Lava et les autres membres du Comité central s'échappent de Manille avant que les forces de sécurité ne puissent complètement boucler la ville.\n\nLe raid porte néanmoins un coup dur : les refuges sont perdus, les coursiers arrêtés et les infrastructures du Parti dans la capitale sont gravement endommagées. Pourtant, le coeur du mouvement survit. L'échec de l'État à s'emparer du Secrétariat devient un symbole puissant parmi les cadres et les combattants : la révolution ne peut pas être détruite aussi facilement.\n\nAu sein de l'Armée populaire de libération, la confiance grandit. Parmi les paysans, des histoires se sont répandues sur la façon dont le Parti avait déjoué les forces soutenues par les États-Unis au dernier moment. La leçon est dure mais précieuse : l'underground urbain ne doit plus jamais faire preuve de complaisance."
 HUK_insurgency.19.a:0 "Survie grâce à la discipline, au secret et au soutien de masse."
 HUK_insurgency.20.t:0 "L'arrestation du Comité central"
 HUK_insurgency.20.d:0 "Le coup tombe avec une force dévastatrice. Le 18 octobre 1950, les forces gouvernementales arrêtent tout le Secrétariat du Comité central du PKP, y compris le secrétaire général José Lava. L'opération fait suite à la capture antérieure du Politburo et représente la répression la plus sévère à laquelle le Parti ait jamais été confronté.\n\nJosé Lava, qui dirigeait le Parti depuis 1948 et supervisait à la fois son appareil politique et financier, est placé en détention aux côtés de ses plus proches camarades. La presse bourgeoise annonce triomphalement la « fin de la rébellion de Huk », tandis que le ministre de la Défense Ramon Magsaysay est salué comme l'architecte de la répression.\n\nEn réalité, la lutte continue, mais blessée. La perte du Secrétariat jette le Parti dans la confusion. Les liens de commandement entre la direction politique et l'Armée populaire de libération se fracturent, et le moral des cadres s'effondre.\n\nEn février 1951, la direction de ce qui reste du Comité central passe au frère de José, Jesús Lava. Pourtant, le mal est déjà fait. Le PKP et l'Armée populaire de libération subissent des pertes catastrophiques dans les mois qui suivent, alors que les forces de l'État exploitent la désorganisation provoquée par les arrestations."
 HUK_insurgency.20.a:0 "Putain..."
 HUK_insurgency.21.t:0 "Crise sécuritaire dans la capitale"
 HUK_insurgency.21.d:0 "La situation sécuritaire intérieure de la République a atteint un stade critique. La rébellion de Hukbalahap continue de s'étendre dans les campagnes, tandis que le Parti communiste des Philippines (PKP) entretient un vaste réseau clandestin au sein même de Manille. Les rapports des services de renseignement confirment que le Comité central et le Secrétariat du Parti, sous la direction du secrétaire général José Lava, opèrent depuis la capitale, coordonnant la direction politique, les finances et la propagande de l'insurrection armée.\n\nDepuis qu'il a pris ses fonctions de ministre de la Défense nationale en septembre 1950, l'ancien chef de la guérilla de l'USAFFE, Ramon Magsaysay, a soutenu que l'approche précédente de l'État avait été trop passive. Agissant sur les conseils des conseillers militaires américains, Magsaysay a averti le président Elpidio Quirino qu'à moins que des mesures décisives ne soient prises, le mouvement Huk pourrait évoluer vers une menace révolutionnaire à grande échelle.\n\nLes communications interceptées, les témoignages d'informateurs et les arrestations récentes suggèrent que l'emplacement des dirigeants du PKP pourrait désormais être connu. Cela représente une opportunité rare : une opération unique et bien coordonnée pourrait paralyser l'insurrection dans ses fondements."
 HUK_insurgency.21.a:0 "Autoriser une surveillance élargie et une préparation du renseignement."
 HUK_insurgency.21.b:0 "Concentrez-vous pour l'instant sur l'effacement de leurs présences dans les campagnes..."
 HUK_insurgency.22.t:0 "Suspension de l'Habeas Corpus"
 HUK_insurgency.22.d:0 "Le ministre Magsaysay demande officiellement des pouvoirs extraordinaires pour faire face à l'insurrection croissante. Il affirme que les contraintes juridiques imposées par l'ordonnance d'habeas corpus empêchent les forces de sécurité d'agir rapidement contre les réseaux communistes clandestins. Selon lui, tout retard risque de permettre à la direction du PKP de s'échapper ou de se disperser.\n\nLe président Quirino se trouve désormais confronté à un choix décisif. La suspension du mandat donnerait aux forces de sécurité le pouvoir de procéder à des arrestations, des perquisitions et des détentions massives sans contrôle judiciaire immédiat. Cependant, de telles mesures comportent des risques politiques et peuvent susciter des critiques de la part des défenseurs des libertés civiles et des politiciens de l'opposition.\n\nAvec l'intensification de la campagne de Huk et la pression américaine croissante, le gouvernement doit décider si la sécurité nationale justifie des mesures extraordinaires."
 HUK_insurgency.22.a:0 "Suspendre l'ordonnance d'habeas corpus pour la durée de la campagne de Huk."
 HUK_insurgency.23.t:0 "L'opération anticommuniste de Manille"
 HUK_insurgency.23.d:0 "Le 18 octobre 1950, les forces de sécurité lancent une opération coordonnée à Manille. S'appuyant sur les renseignements recueillis auprès d'informateurs et sur les arrestations antérieures de membres du Politburo du PKP, les unités de la police frappent simultanément des refuges présumés et des installations du Parti.\n\nSous la supervision directe du ministre Magsaysay, l'opération vise le secrétariat du Comité central du PKP lui-même. Les communications sont coupées, les issues de secours fermées et des patrouilles armées parcourent les quartiers populaires connus pour abriter des cellules communistes.\n\nLes résultats de l'opération façonneront l'avenir de la République. Soit la direction politique de l'insurrection sera neutralisée, soit l'État se retrouvera dans un sérieux embarras."
 HUK_insurgency.23.a:0 "Répression totale - pas de quartier pour les dirigeants communistes."
 HUK_insurgency.23.b:0 "Fonctionnement limité - évitez une force excessive."
 HUK_insurgency.24.t:0 "La capture de José Lava et le Secrétariat du PKP"
 HUK_insurgency.24.d:0 "L'opération est un succès décisif. Les forces gouvernementales arrêtent l'ensemble du Secrétariat du Comité central du Parti communiste des Philippines, y compris le secrétaire général José Lava. Ces arrestations font suite à la capture antérieure de membres du Politburo et représentent le coup le plus important jamais porté contre la rébellion de Huk.\n\nJosé Lava, qui a pris la direction du PKP en 1948 après le décès de son frère Vicente Lava, avait été à la fois stratège politique en chef et chef de l'appareil financier du parti. Sa destitution décapite effectivement les dirigeants communistes.\n\nLes arrestations sont largement médiatisées. La presse salue le ministre Ramon Magsaysay comme l'architecte d'une nouvelle stratégie anti-insurrectionnelle efficace. Sur le plan international, l'opération rassure les alliés américains sur le fait que les Philippines restent déterminées à résister à l'expansion communiste en Asie du Sud-Est.\n\nAlors que les restes du Hukbalahap et de l'Armée populaire de libération continuent de résister dans les zones rurales, la perte du leadership centralisé plonge l'insurrection dans le désarroi. Dans les mois à venir, le mouvement subira de lourdes pertes alors que les forces de sécurité exploiteront sa coordination affaiblie."
 HUK_insurgency.24.a:0 "Échec et mat, coco."
 HUK_insurgency.25.t:0 "Troubles dans l'archipel du Sud"
 HUK_insurgency.25.d:0 "Des rapports en provenance du sud des Philippines indiquent l'émergence d'un nouveau mouvement insurrectionnel inquiétant dans l'archipel de Sulu. Dirigé par un Tausug datu connu sous le nom de Hadji Kamlon. De récentes évaluations des services de renseignement suggèrent désormais que la situation évolue vers une rébellion politiquement et culturellement motivée qui pourrait menacer l'autorité de la République à Mindanao et dans la région de Sulu.\n\nHadji Kamlon était autrefois considéré comme un agriculteur pacifique avant la Seconde Guerre mondiale. Au lendemain chaotique de l'occupation japonaise et de l'effondrement de l'ordre de guerre, il se tourna vers l'activité armée, s'appuyant sur des griefs persistants concernant la propriété foncière, la négligence d'après-guerre et l'érosion de l'autorité traditionnelle des Tausug. En 1948, sous la présidence d'Elpidio Quirino, Kamlon organisa un petit groupe armé d'environ 25 partisans, opérant dans les jungles et les collines de Sulu.\n\nLes objectifs déclarés de Kamlon vont bien au-delà des activités criminelles. Il prétend lutter pour la réforme agraire, le renversement du gouvernement philippin et la renaissance de l'indépendance du sultanat de Sulu, y compris les revendications historiques sur le nord de Bornéo. Ces revendications remettent directement en cause la souveraineté de la République et suscitent des inquiétudes quant à la propagation du séparatisme parmi la population musulmane des îles du sud.\n\nMalgré un nombre limité, les forces de Kamlon sont bien armées. Tirant parti des stocks de guerre, leur confiance opérationnelle croissante a alarmé les planificateurs militaires, en particulier à la suite d'informations selon lesquelles les combattants de Kamlon ont anéanti des éléments du 7e bataillon d'infanterie.\n\nLe moment choisi pour cette rébellion est particulièrement dangereux. La République est déjà mise à rude épreuve par l'insurrection communiste Hukbalahap en cours à Luçon, et l'ouverture d'un deuxième front intérieur dans le sud risque de mettre à rude épreuve les ressources militaires et politiques."
 HUK_insurgency.25.a:0 "Quoi d'autre?"

