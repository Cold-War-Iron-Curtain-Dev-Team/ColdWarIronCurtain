###Focus Tree###
 HUK_Condemn_Quezon_Raid:0 "Condamner le raid contre la famille Quezon"
 HUK_Condemn_Quezon_Raid_desc:0 "L'attaque contre le convoi d'Aurora Quezon, ancienne Première dame et chef de la Croix-Rouge philippine, a été une erreur désastreuse. Alors que des éléments radicaux au sein du mouvement y voyaient une grève contre l'élite dirigeante, le meurtre de Quezon et de sa fille a horrifié l'opinion publique et nous a coûté un soutien précieux. La direction centrale du Parti doit agir rapidement pour condamner cet acte irresponsable, se distancier des responsables et réaffirmer son engagement dans la lutte populaire. Si nous ne parvenons pas à contrôler nos propres rangs, nous risquons de perdre ceux-là mêmes que nous cherchons à libérer."
 HUK_Make_Village_Contacts:0 "Établir des contacts avec les quartiers"
 HUK_Make_Village_Contacts_desc:0 "La force de la révolution réside dans les masses. En envoyant nos cadres au coeur des campagnes, nous pouvons établir des liens avec les communautés paysannes, garantir de la nourriture et un abri à nos combattants et commencer à former l'infrastructure gouvernementale pour notre éventuelle prise de pouvoir. Jusqu'à 15 membres de chaque quartier seront armés pour coordonner les communications entre le parti et le peuple. Les propriétaires fonciers et leurs alliés réactionnaires ne parviendront pas à briser notre réseau de soutien grandissant."
 HUK_Disrupt_Enemy_Convoys:0 "Perturber les routes des convois ennemis"
 HUK_Disrupt_Enemy_Convoys_desc:0 "Le gouvernement s'appuie sur les lignes d'approvisionnement de l'époque coloniale pour maintenir le contrôle sur les campagnes. Avec quelques coups au bon moment sur les routes principales et en disparaissant dans la jungle avant qu'ils ne puissent répondre, nous pouvons affaiblir leur capacité à soutenir les opérations et les forcer à se mettre sur la défensive. Chaque balle et chaque ration que nous reprenons au nom du peuple nous rapproche de la victoire."
 HUK_Capture_Enemy_Equipment:0 "Utiliser l'équipement de l'ennemi"
 HUK_Capture_Enemy_Equipment_desc:0 "Un obstacle majeur auquel notre mouvement est confronté est le manque d'armements et de moyens de communication suffisants. Jusqu'à présent, le peu d'équipement dont nous disposons a été obtenu grâce au marché noir de Manille ainsi qu'au lendemain de batailles particulièrement longues. Pour armer confortablement nos troupes, nous devons organiser des raids sur les avant-postes gouvernementaux et recruter des combattants armés chaque fois que cela est possible. Cela armera non seulement nos rangs croissants, mais privera également l'ennemi de ressources indispensables."
 HUK_Declare_Election_Fraud:0 "Dénoncer les élections de 1949 comme étant frauduleuses"
 HUK_Declare_Election_Fraud_desc:0 "La soi-disant démocratie de la « république » n'est qu'une farce. Les élections de 1949 ont été volées par l'intimidation, la corruption et la fraude afin de maintenir le régime colonial des propriétaires terriens réactionnaires et des marionnettes américaines ; tuant plusieurs centaines de nos frères dans le processus. Nous dénoncerons ces crimes contre le peuple philippin et montrerons que le véritable changement ne peut pas venir de scrutins truqués mais de la révolution. Des balles, pas des bulletins de vote !"
 HUK_Declare_Revolutionary_Situation:0 "Déclarer l'existence d'une situation révolutionnaire"
 HUK_Declare_Revolutionary_Situation_desc:0 "Le temps d'attendre est révolu : la révolution est maintenant ! La Conférence du Politburo élargi de Laguna a officiellement déclaré une situation révolutionnaire en réponse à la répression généralisée et à la fraude électorale commise par le régime fantoche. Le moment est venu pour nous d'intensifier nos activités militaires, d'expansion politique et de mobilisation de masse. Avec une base de soutien estimée à plus de deux millions, notre prise de contrôle du gouvernement sera réalisée par un grand soulèvement avant la fin de l'année prochaine !"
 HUK_Ideological_Purity:0 "Briser les rangs avec l'aile politique"
 HUK_Ignore_China_Branch:0 "Ignorer les conseils de la succursale chinoise"
 HUK_Mountain_Homes:0 "Faire des maisons de montagnes"
 HUK_Focus_On_Production_Bases:0 "Développer le recours aux bases de production"
 HUK_Villager_Intel:0 "Réseaux d'information rurale"
 HUK_Discipline_Remaining_Army:0 "Augmenter la discipline dans l'Armée de Libération"
 HUK_Mend_Schism:0 "Réparer le schisme idéologique"
 HUK_Mend_Schism_desc:0 "Les tensions entre les ailes politique et militaire menacent l'intégrité de nos réseaux de renseignements, et donc toute la révolution. Agir indépendamment ou, pire encore, l'un contre l'autre réduit l'efficacité des deux groupes et ne fera que faire le jeu de l'ennemi. En l'absence de compromis apparent, la meilleure chose à faire est d'accepter le leadership politique du RPC pendant que nous concentrons nous-mêmes nos efforts sur le travail de terrain."
 HUK_Rebuild_Credibility:0 "Reconstruire notre crédibilité internationale"
 HUK_Rebuild_Credibility_desc:0 "La tache laissée sur nous par l'assassinat de Mme Quezon est pour nous une source constante de problèmes. La communauté internationale au sens large nous considère toujours comme un groupe de milices anarchiques exécutant quiconque est considéré comme un ennemi, soldat ou civil. Nous devrions accroître notre présence urbaine et politique pour montrer au monde et à nos partisans potentiels que nous sommes la voix du peuple et la solution à ce système corrompu !"
 HUK_Assure_People:0 "Promesses d'indépendance totale"
 HUK_Assure_People_desc:0 "Certains semblent croire que nous luttons simplement pour remplacer l'hégémonie coloniale américaine par une hégémonie soviétique. Il est vrai que nous suivons la direction soviétique, mais nous le faisons dans la fraternité socialiste et non dans la servitude ! Pour faciliter notre libération de la nation, ce genre de peurs doit être apaisé et les gens doivent être assurés que nous luttons pour l'indépendance complète de ce pays !"
