###Huks Insurgency Legacy Decisions###
 
 Huks_Insurgency_Decisions_legacy:0 "Décisions de l'insurrection de Hukbalahap"
 Huks_Insurgency_Decisions_legacy_desc:0 "Pendant la Seconde Guerre mondiale, des militants socialistes et communistes ont formé une armée de guérilla paysanne appelée Hukbalahap ou Huks pour combattre les forces d'occupation japonaises. Bien qu'il ait levé de nombreux combattants et joué un rôle dans la libération des Philippines, le gouvernement philippin a activement cherché à désarmer de force les Huks, à arrêter ses membres et à refuser d'accepter leurs candidats élus au gouvernement. Citant le refus persistant du gouvernement de mettre fin à sa répression ou de répondre aux préoccupations des paysans, les escadrons Huks se sont réactivés pour mener une guérilla révolutionnaire contre le gouvernement.\n\nForce de Hukbalahap : [?ROOT.huks_insurgency]%"

 HUK_insurgency_options.1.d:0 "Depuis que les Huks ont lancé leur campagne contre le gouvernement, ils ont lancé de violentes attaques contre les villageois et les responsables pro-gouvernementaux. Les attaques terroristes en particulier ont dressé de nombreuses personnes contre eux, y compris parmi les paysans pour lesquels les Huks prétendent se battre. Nos agents de renseignement ont récemment recruté un petit réseau de sympathisants paysans dans une région qui nous ont fourni les noms d'éminents villageois soutenant l'ennemi ainsi que l'emplacement des escadrons Huk dans la région. Grâce à ces informations, nous avons pu déployer une équipe de combat du bataillon pour éliminer les rebelles, arrêter leurs partisans et occuper les villages pro-rebelles. D'autres opérations comme celle-ci garantiront la fin de ces rebelles."
 HUK_insurgency_options.2.d:0 "Depuis que les Huks ont lancé leur campagne contre le gouvernement, ils ont lancé de violentes attaques contre les villageois et les responsables pro-gouvernementaux. Les attaques terroristes en particulier ont dressé de nombreuses personnes contre eux, y compris parmi les paysans pour lesquels les Huks prétendent se battre. Nos agents de renseignement ont récemment recruté un petit réseau de sympathisants paysans dans une région qui nous ont fourni les noms d'éminents villageois soutenant l'ennemi ainsi que l'emplacement des escadrons Huk dans la région. Forte de ces informations, une équipe de combat du bataillon s'est déplacée pour cibler les rebelles, capturer leurs partisans et occuper les villages ennemis. Cependant, nos forces ont été confrontées à des embuscades face aux rebelles et les paysans détenus se sont révélés soit pro-gouvernementaux, soit neutres. Plus important encore, les villages occupés étaient également neutres. Il semble que les informateurs travaillaient pour les Huks et que l'opération n'a fait que renforcer le soutien des Huks dans la région."
 HUK_insurgency_options.3.d:0 "Une équipe de combat du bataillon (BCT) a identifié les rebelles Huk ciblant les villages de la région. Les troupes ont pu identifier le village servant de base. Une fois la zone correctement explorée, le commandant a mis les troupes en position. Lorsque l'ordre fut donné, le village fut pris d'assaut. L'escadron Huk a été facilement déraciné et détruit. Les structures villageoises utilisées par les rebelles ont également été détruites pour punir leurs partisans. En outre, la BCT a saisi des armes, des documents et des fournitures ennemis. Le commandant du BCT a fait un excellent travail en utilisant son unité pour neutraliser les forces ennemies. La stratégie consistant à utiliser ces unités de plus petite taille porte définitivement ses fruits."
 HUK_insurgency_options.4.d:0 "Une équipe de combat de bataillon (BCT) opérant dans une zone où opèrent plusieurs escadrons Huk a tenté de lancer une opération de ratissage pour éliminer les combattants rebelles. Cependant, le commandant répartit un peu ses forces pour couvrir plus de terrain et les rebelles, adeptes de la guérilla en raison de leurs expériences contre les Japonais, en profitèrent. Nous n'avons pas réussi à détruire toute présence rebelle et certains hommes trop isolés sont tombés dans des embuscades ennemies. La force BCT est retournée à sa base mais l'échec de l'opération a mis à mal le moral et ébranlé la confiance des soldats dans leurs officiers. Plus important encore, les combattants Huk présents dans la région opèrent plus ouvertement qu'auparavant."
 HUK_insurgency_options.5.d:0 "Notre Force aérienne est impatiente de démontrer ses capacités après les réformes lancées après la fin de la Seconde Guerre mondiale et l'occupation japonaise. Un centre de commandement rebelle Huk a été récemment identifié dans un village local. L'armée de l'air a dépêché plusieurs chasseurs qui ont mené une frappe aérienne rapprochée, ciblant les combattants rebelles autour du village et du centre de commandement lui-même. Les communications interceptées confirment que nous avons détruit le centre, y compris un haut dirigeant rebelle. Les combattants rebelles du village ont également subi des pertes, nous espérons que cela empêchera cet escadron de continuer à opérer contre nos forces. Ce fut un succès majeur pour l'Armée de l'Air."
 HUK_insurgency_options.6.d:0 "Notre Force aérienne est impatiente de démontrer ses capacités après les réformes lancées après la fin de la Seconde Guerre mondiale et l'occupation japonaise. Un escadron rebelle Huk a été identifié opérant près d'un village. L'armée de l'air a dépêché plusieurs combattants qui ont frappé le village et les zones environnantes où se trouvaient des combattants présumés. Cependant, bien que les frappes aient été un succès, il semble que les combattants Huk n'étaient pas dans la zone à ce moment-là. Au lieu de cela, les avions ont fini par frapper le village et ont accidentellement pris pour cible les villageois. La nouvelle de la grève a aliéné les villages de la région et a aidé la propagande ennemie selon laquelle nous ne nous soucions pas des paysans. Cela sera sans aucun doute un coup de pouce pour les Huks qui gagneront désormais davantage de soutien public et de recrues."

 HUK_insurgency_options.10.d:0 "Les Huks ont révélé leur véritable identité de bandits et de voyous avec leurs violents assauts contre des villages non armés et leurs assassinats terroristes. Ces opérations ont commencé à retourner contre eux les gens, et plus important encore, les paysans parmi lesquels ils se cachaient. Nos propres forces ont d'abord commis plusieurs erreurs dans leur approche, mais au fil du temps, les équipes de combat du bataillon ont adapté leurs tactiques et ont de plus en plus évité de s'aliéner la population. Nous avons commencé à détruire de nombreux escadrons Huks et à les éloigner des paysans, les poussant dans des jungles isolées. Finalement, nous avons pu organiser une offensive majeure contre les forces Huk restantes, les vaincre petit à petit et capturer leurs hauts dirigeants. À l'heure actuelle, les Huks ne constituent plus une force cohérente et les hauts dirigeants que nous avons capturés ont accepté de se rendre à nos forces. Il s'agit d'une grande victoire pour le gouvernement et le peuple philippins."
 HUK_insurgency_options.11.d:0 "Pendant la Seconde Guerre mondiale, les Hukbalahap constituaient l'une des plus grandes forces de guérilla anti-japonaise du pays. Malgré leurs services, le gouvernement, avec le soutien américain, a décidé de désarmer de force les Huks, ce qui les a amenés à déclarer la guerre au gouvernement pour les droits des paysans. Les efforts du gouvernement pour écraser les rebelles par une action militaire ont fini par échouer car les escadrons Huk se sont montrés très habiles à combattre les tactiques conventionnelles. En outre, certaines actions brutales des troupes gouvernementales n'ont fait qu'aliéner les paysans qui devenaient de plus en plus sympathiques à la cause de Huk. Au fil du temps, à mesure que le soutien du public augmentait, les rangs des Huks se sont élargis et les protestations villageoises ont considérablement affaibli les forces gouvernementales. Alors que les habitants de la ville se joignaient aux manifestations, la position du gouvernement s'est avérée intenable et ils ont récemment annoncé qu'ils capitulaient face au Hukbalahap et à leurs revendications en faveur des droits des paysans."

