l_french:
 
 YUG_ww_capitals: "Kumbor"
 YUG_ww_capitals_short: "Kumbor"
 YUG_ww_capitals_desc: "Cuirassé de défense côtière de type \"Kronprinz Erzherzog Rudolf\"."

 YUG_battle_hull_light_0: "Croiseur type \"Gazelle\""
 YUG_battle_hull_light_0_short: "Croiseur type \"Gazelle\""
 YUG_battle_hull_light_0_desc: "Petit croiseur allemand (Kleiner Kreuzer) \"Niobe\". Le 22 décembre 1943, il fut endommagé par deux torpilles et abandonné par l'équipage, bientôt le corps fut capturé par les partisans yougoslaves, mais en raison de l'impossibilité de salut, il fut abandonné, en 1947 il commença par le démantèlement pour le métal, en 1952 il fut finalement démantelé pour le métal par la société yougoslave de transport de navires \"Brodospas\"."
 
 YUG_battle_hull_light_4: "Tapez \"Kotor\""
 YUG_battle_hull_light_4_short: "Tapez \"Kotor\""
 YUG_battle_hull_light_4_desc: "Grands navires de patrouille (Veliki Patrolni Brodovi) de type \"Kotor\". Le navire est armé de quatre missiles, de navire à navire P-21 ou P-22 (code OTAN SS-N-2 Styx). Le poids des missiles est de 2607 kg, l'ogive pèse 480 kg, avec une portée de 8 à 80 km d'altitude volant à 25 ou 50 mètres, à une vitesse de Mach 0,9. Ils disposent de systèmes d'autoguidage infrarouge (P-22) ou de guidage radar actif (P-21)."
 
 YUG_screen_hull_heavy_0: "Tapez \"Tb 74T\""
 YUG_screen_hull_heavy_0_short: "Tapez \"Tb 74T\""
 YUG_screen_hull_heavy_0_desc: "Le T1 a été commandé par la marine yougoslave après la guerre sous le nom de Golesnica. Elle a été réarmée avec deux canons de 40 mm (1,6 po) sur des supports simples et quatre canons de 20 mm (0,79 po), et ses tubes lance-torpilles ont été retirés. Elle a continué au service yougoslave sous ce nom jusqu'en octobre 1959. Le T5 a également été commandé par la marine yougoslave après la guerre et rebaptisé Cer. Elle était équipée de deux canons de 40 mm (1,6 po) sur supports simples et d'un canon de 20 mm (0,79 po), et ses tubes lance-torpilles ont également été retirés. Elle a servi jusqu'en 1962, date à laquelle elle a été démantelée."
 YUG_screen_hull_heavy_1: "Diviser"
 YUG_screen_hull_heavy_1_short: "Diviser"
 YUG_screen_hull_heavy_1_desc: "L'armement principal du Split se composait de quatre canons de 5 pouces (13 cm) de calibre 38 dans des supports simples, une paire de super-tirs à l'avant et à l'arrière de la superstructure. Son armement anti-aérien se composait de quatre canons jumelés et de quatre supports simples pour canons Bofors AA de 40 mm construits sous licence. Le navire transportait un quintuple jeu de tubes lance-torpilles de 21 pouces et conservait sa capacité de 40 mines. Pour le combat anti-sous-marin, Split était équipé de deux mortiers à broche Hedgehog, de six lanceurs de grenades sous-marines et de deux râteliers de grenades sous-marines. Le navire était équipé d'un directeur de conduite de tir Mk 37 pour les canons de 5 pouces et d'un directeur Mk 51 pour les canons AA."
 YUG_screen_hull_heavy_2: "Classe W"
 YUG_screen_hull_heavy_2_short: "Classe W"
 YUG_screen_hull_heavy_2_desc: "Répétitions des destroyers précédents de classe U et V, avec des structures de directeur modifiées. La classe Z était armée de canons de 4,5 pouces."
 YUG_screen_hull_heavy_3: "Tapez « Animoso »"
 YUG_screen_hull_heavy_3_short: "Tapez « Animoso »"
 YUG_screen_hull_heavy_3_desc: "Par rapport à la classe Spica à partir de laquelle elle a été développée, la classe Ariete avait perdu l'un des trois canons à double usage de calibre 100 mm (4 po)/47, tandis que l'armement torpille était passé de quatre à six tubes lance-torpilles de 450 mm (18 po), dans deux supports triples sur la ligne médiane du navire. La suite anti-aérienne comprenait dix canons de 20 mm."
 YUG_screen_hull_heavy_4: "Projet 1159"
 YUG_screen_hull_heavy_4_short: "Projet 1159"
 YUG_screen_hull_heavy_4_desc: "L'armement se composait de deux supports de canon AK726 jumelés de 76 mm et de deux canons AA jumelés de 30 mm, 4 lanceurs de missiles antinavires SSN-2 étaient installés sur certains navires, des grenades sous-marines et des râteliers de mines étaient installés à l'arrière."
 
 YUG_screen_hull_medium_0: "Tapez \"Tb 82F"
 YUG_screen_hull_medium_0_short: "Tapez \"Tb 82F"
 YUG_screen_hull_medium_0_desc: "Torpilleurs (Torpiljarke) type \"Tb 82F\", transférés en 1945 à la marine yougoslave et introduits comme navire de patrouille (Patrolni brod) T 5 (à partir du 18 mai 1949 PBR 92 \"Cer\" (PBR 92 \"Cer\") planche n° 92), exclus en 1962, transférés en 1963 pour démontage en métal."
 YUG_screen_hull_medium_1: "Tapez \"Dubrovnik\""
 YUG_screen_hull_medium_1_short: "Tapez \"Dubrovnik\""
 YUG_screen_hull_medium_1_desc: "Destroyer yougoslave Dubrovnik."
 YUG_screen_hull_medium_2: "Tapez \"Beograd\""
 YUG_screen_hull_medium_2_short: "Tapez \"Beograd\""
 YUG_screen_hull_medium_2_desc: "Destroyers de type \"Beograd\""
 YUG_screen_hull_medium_3: "Tapez \"Ariete\""
 YUG_screen_hull_medium_3_short: "Tapez \"Ariete\""
 YUG_screen_hull_medium_3_desc: "Destroyers d'escorte (Razaraci eskortni) type \"Ariete\"."
 YUG_screen_hull_medium_4: "Triglav"
 YUG_screen_hull_medium_4_short: "Triglav"
 YUG_screen_hull_medium_4_desc: "Triglav est un patrouilleur de classe Svetlyak"
 
 
 
 # Submarine Hulls #
 
 YUG_sub_hull_ww: "Classe Hrabri"
 YUG_sub_hull_ww_short: "Classe Hrabri"
 YUG_sub_hull_ww_desc: "Pour la navigation en surface, les bateaux de la classe Hrabri étaient propulsés par deux moteurs diesel d'une puissance de freinage de 2 400 chevaux (1 800 kW) qui entraînaient deux arbres d'hélice. Une fois immergées, les hélices étaient entraînées par deux moteurs électriques générant 1 600 chevaux-vapeur (1 200 kW). Ils pouvaient atteindre une vitesse de pointe de 15,7 noeuds (29,1 km/h ; 18,1 mph) en surface et de 10 noeuds (19 km/h ; 12 mph) sur leurs moteurs électriques lorsqu'ils étaient immergés. Étaient armés de six tubes lance-torpilles de 533 mm (21 po) montés sur l'arc et transportaient douze torpilles."


 YUG_sub_hull_small_single_3: "Una-classe"
 YUG_sub_hull_small_single_3_short: "Una-classe"
 YUG_sub_hull_small_single_3_desc: "Le sous-marin de classe Una (également connu sous le nom de Type 911) était une classe de six sous-marins de poche construits pour la marine yougoslave à Brodogradiliste specijalnih objekata dans les années 1980. Ils ont été conçus dans le but de poser de petits champs de mines et de transporter des forces spéciales navales, avec ou sans leurs submersibles, dans des eaux peu profondes inaccessibles aux sous-marins plus gros. En raison de leur profil de mission qui exigeait une petite conception ainsi que de la nécessité de rester indétectables, ils manquaient d'armement de torpilles et d'un générateur pour recharger la batterie."
 

 YUG_sub_hull_large_single_0: "Tapez \"Flutto\""
 YUG_sub_hull_large_single_0_short: "Tapez \"Flutto\""
 YUG_sub_hull_large_single_0_desc: "Introduit dans la marine yougoslave le 10 septembre 1953, modernisé, expulsé en 1968."
 
 YUG_sub_hull_large_single_1: "Projet \"B-81/1\""
 YUG_sub_hull_large_single_1_short: "Projet \"B-81/1\""
 YUG_sub_hull_large_single_1_desc: "La classe Sutjeska était une classe de deux sous-marins diesel-électriques construits pour la marine yougoslave à la fin des années 1950 et au début des années 1960. Construit par le chantier naval Uljanik à Pula."
 
 YUG_sub_hull_large_single_2: "Projet \"B-81/2\""
 YUG_sub_hull_large_single_2_short: "Projet \"B-81/2\""
 YUG_sub_hull_large_single_2_desc: "La classe Sutjeska était une classe de deux sous-marins diesel-électriques construits pour la marine yougoslave à la fin des années 1950 et au début des années 1960. Construit par le chantier naval Uljanik à Pula."
 
 YUG_sub_hull_large_single_3: "Classe Heroj"
 YUG_sub_hull_large_single_3_short: "Classe Heroj"
 YUG_sub_hull_large_single_3_desc: "La classe Heroj était une classe de sous-marins d'attaque diesel-électriques construits pour la marine yougoslave dans les années 1960. L'armement de la classe se composait de quatre tubes lance-torpilles de 533 mm (1 pi 9,0 po) utilisés pour lancer jusqu'à six torpilles à tête chercheuse active/passive SET-65E ou pour déployer jusqu'à douze mines navales à la place. La suite de capteurs du bateau comprenait un récepteur d'avertissement radar « Stop Light », un radar de recherche de surface « Snoop Group » et un sonar monté sur coque Thomson Sintra Eledone."
 
 YUG_sub_hull_large_single_4: "Classe Sava"
 YUG_sub_hull_large_single_4_short: "Classe Sava"
 YUG_sub_hull_large_single_4_desc: "La classe Sava était une classe de sous-marins d'attaque diesel-électriques construits pour la marine yougoslave à la fin des années 1970 et au début des années 1980. L'armement se composait de six tubes lance-torpilles orientés vers l'avant de 533 mm (21,0 pouces) utilisés pour lancer un complément de dix torpilles TEST-71ME avec une portée maximale de 10,8 nmi (20 km; 12 mi) ou jusqu'à vingt mines navales si elles sont utilisées pour des opérations de pose de mines. Les capteurs comprennent un système d'avertissement radar « Stop Light » et un radar de recherche de surface « Snoop Group ». Les sources sont quelque peu contradictoires concernant l'équipement sonar installé."
 
 
 YUG_sub_hull_large_double_0: "Tapez \"Smeli\""
 YUG_sub_hull_large_double_0_short: "Tapez \"Smeli\""
 YUG_sub_hull_large_double_0_desc: "Sous-marin diesel-électrique yougoslave."

 
