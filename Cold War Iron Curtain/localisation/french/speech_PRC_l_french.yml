l_french:
 mao_speech_category:0 "Discours du président Mao au peuple"
 mao_speech_category_desc:0 "Notre président Mao a fait beaucoup pour nos Chinois \npeuple et protège le peuple chinois de \nréactionnaires et impérialistes. \n\nNous croyons fermement que nous devrions lutter contre \nimpérialistes jusqu'à la victoire finale et jusqu'à la \nla révolution mondiale a libéré le prolétariat de \nle monde."
 mao_speech_korea:0 "Le président Mao s'exprime contre les États-Unis à propos de la guerre de Corée"
 mao_speech_korea_desc:0 "Combien de temps va durer cette guerre ? Ne décidons pas. Laissons Truman et Eisenhower, ou le futur président, décider. Nous nous battrons aussi longtemps qu'ils le voudront, jusqu'à ce que la victoire totale soit remportée."
 mao_speech_form_prc:0 "Déclarer la République populaire de Chine"
 mao_speech_form_prc_desc:0 "La République populaire de Chine et le gouvernement populaire central sont établis aujourd'hui ! Notre gouvernement est le seul gouvernement légitime du peuple dans tout le pays. Tout gouvernement étranger disposé à se conformer aux principes d'égalité, à regrouper les avantages et à respecter la souveraineté territoriale. Notre gouvernement est prêt à établir des relations diplomatiques."
