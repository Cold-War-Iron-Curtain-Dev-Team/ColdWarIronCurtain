 POR_MIL.5.t:0 "Création de l'armée de l'air portugaise"
 POR_MIL.5.d:0 "À la fin des années 1940, l'aviation militaire portugaise restait divisée entre l'Aeronáutica Militar (armée) et l'Aviação Naval (marine), limitant la coordination et la modernisation. Cherchant à suivre la tendance des autres pays occidentaux et à améliorer les capacités aériennes stratégiques du pays, Lisbonne a décidé de réorganiser ses forces armées.\n\nPar le décret-loi 37909, le gouvernement portugais a été réorganisé et a commencé à inclure le rôle de ministre de la Défense nationale et, en vertu de celui-ci, le rôle de sous-secrétaire d'État à l'aéronautique (Subsecretário de Estado da Aeronáutica ou SEA) qui ne sera pourvu qu'après la réorganisation des forces aériennes. Le statut du membre gouvernemental responsable de l'armée de l'air était cependant inférieur à celui des responsables de la Marine et de l'Armée, qui conservaient le rang de ministres.\n\nEn plus de prévoir déjà l'existence d'une force aérienne indépendante, cet acte a créé de facto les forces armées portugaises en tant qu'organisation intégrée englobant la marine, l'armée et la troisième branche prévue, établissant une chaîne de commandement unifiée pour toutes les branches sous la coordination militaire du chef d'état-major général des forces armées.\n\nLe [DAY.MONTH.YEAR], la Força Aérea Portuguesa (FAP) a été officiellement créée en tant que branche indépendante. Il a absorbé tous les moyens aéronautiques de l'armée et de la marine, ouvrant ainsi un nouveau chapitre pour l'aviation militaire portugaise."
 POR_MIL.5.a:0 "Ex Mero Motu"
 
 POR_MIL.6.t:0 "La marine portugaise"
 POR_MIL.6.d:0 "Les innovations portugaises comprenaient la caravelle, des caraques plus sophistiquées pour les voyages interocéaniques et le galion océanique. Ces navires ont permis à des explorateurs tels que Bartolomeu Dias, qui a contourné le cap de Bonne-Espérance, et Vasco da Gama, qui a atteint l'Inde, de relier pour la première fois l'Europe et l'Asie par voie maritime. Des expéditions comme celle de Pedro Álvares Cabral ont également abouti à la découverte du Brésil et facilité des voyages reliant l'Europe, l'Afrique, le Nouveau Monde et l'Asie en une seule expédition.\n\nLes compétences et l'expertise en navigation des marins portugais ont influencé d'autres puissances européennes, comme en témoigne le premier tour du monde de Ferdinand Magellan, auquel plusieurs capitaines, pilotes et marins portugais ont participé. De la fin du XVe à la fin du XVIe siècle, la marine portugaise figurait parmi les forces maritimes les plus puissantes de la planète. Au milieu des années 1950, alors que la stratégie maritime de l'OTAN pendant la guerre froide prenait forme, la marine portugaise entreprit l'Operação Consoada Azul (« Opération Noël bleu »), un exercice majeur de préparation de la flotte et de logistique organisé dans les archipels des Açores et de Madère. Mené en décembre 1955, il s'agissait du plus grand déploiement naval portugais depuis la Seconde Guerre mondiale. Le but de l'exercice était de tester la capacité de la Marine à sécuriser les voies maritimes médio-atlantiques qui reliaient l'Europe continentale, l'Amérique du Nord et les possessions coloniales d'Afrique et d'Asie.\n\nL'opération impliquait le cruzador ligeiro (croiseur léger) NRP Almirante Cervera, plusieurs contratorpedeiros (destroyers) des classes Vouga et Tejo et une flottille de corvetas de construction britannique nouvellement acquises. La couverture aérienne a été coordonnée avec l'armée de l'air portugaise, à l'aide de F-84G Thunderjets opérant depuis le champ de Lajes aux Açores. Les unités de l'aéronavale ont testé de nouvelles tactiques de guerre anti-sous-marine (ASW) à l'aide de vedettes de patrouille équipées de sonars, tandis que des essais de ravitaillement en mer ont été effectués avec des navires de soutien pour étendre la portée opérationnelle."
 POR_MIL.6.a:0 "Honrai a Patria que a Patria vos contempla" 
 
 POR_MIL.7.t:0 "Réorganisation de l'armée portugaise"
 POR_MIL.7.d:0 "Avec ses origines remontant au XIIe siècle, l'armée portugaise est l'une des plus anciennes armées actives au monde. Ses racines remontent aux forces militaires du comté du Portugal, qui, sous Afonso Henriques, obtint son indépendance du royaume de León au XIIe siècle. Des victoires telles que la bataille de São Mamede (1128) et le triomphe décisif d'Ourique (1139) jetèrent les bases du royaume portugais, formellement reconnu dans le traité de Zamora (1143). La longue Reconquista s'est terminée en 1249 avec la conquête de l'Algarve, marquant l'achèvement de l'unification territoriale médiévale du Portugal.\n\nAu milieu du XXe siècle, l'armée connaissait l'une des transformations les plus importantes de son histoire. En 1949, le Portugal est devenu membre fondateur de l'OTAN, s'engageant dans la défense collective de l'alliance occidentale pendant les tensions croissantes de la guerre froide. Tout au long des années 1950, l'armée s'est concentrée sur la préparation à une guerre nucléaire conventionnelle et potentielle en Europe, en adoptant les doctrines, l'organisation, les normes de formation et les modèles d'équipement militaires américains.\n\nLe tournant intervient le 1er août 1950, avec le décret-loi réorganisant les Forces armées en un seul corps intégré. Cette réforme a introduit le poste de ministre de la Défense nationale et établi le chef d'état-major général des forces armées, centralisant le commandement de l'armée, de la marine et de la nouvelle force aérienne. Les forces militaires coloniales ont fusionné avec l'armée métropolitaine, créant une seule force unifiée servant à la fois au Portugal européen et dans les territoires d'outre-mer. Ce nouveau cadre reflétait la détermination de Lisbonne à moderniser son armée tout en maintenant le contrôle de son vaste empire dans un ordre mondial de plus en plus instable."
 POR_MIL.7.a:0 "Em périgos e guerras esforcados" 