 Islamabad.1.d:0 "Karachi est la capitale du Pakistan depuis 1947. Cependant, dans les années qui ont suivi, la ville a connu un afflux majeur de réfugiés et de citoyens, passant rapidement d'une ville portuaire endormie à une métropole. Il est de plus en plus difficile pour le gouvernement de trouver suffisamment d'espace pour répondre à ses besoins ou loger les bureaucrates nécessaires au fonctionnement de l'État. Karachi, la principale plaque tournante commerciale du pays, place également les politiciens très proches des intérêts commerciaux, ce qui peut devenir perturbateur au fil du temps. Le temps à Karachi est également rigoureux, surtout en été lorsque les températures atteignent des sommets torrides. Son éloignement du GHQ à Rawalpindi et les inquiétudes quant à sa défendabilité sont également préoccupantes. Après un examen attentif, une commission d'experts de haut niveau a été chargée de parcourir le Pakistan afin de trouver un emplacement approprié pour une nouvelle capitale."
 Islamabad.2.d:0 "La commission récemment créée, chargée de trouver une zone pour construire une nouvelle capitale du pays, a publié son rapport. Elle a identifié une parcelle de terrain au nord-est de Rawalpindi. L'emplacement est facilement accessible, non aménagé et dans des conditions météorologiques idéales. Hormis une poignée de villages, la région est mûre pour un développement rapide et des constructions essentielles à la construction d'une capitale. Il est géographiquement protégé des incursions hostiles et sa localisation à proximité du GHQ renforcera la coopération civilo-militaire. Faire de ce territoire une capitale fédérale prendra du temps et des plans sont en cours pour déplacer temporairement le gouvernement à Rawalpindi avant qu'il ne s'implante dans la nouvelle capitale, qui s'appellera Islamabad. Bien que le gouvernement prétende que le nouvel emplacement le rendra facilement accessible à tous les Pakistanais, certains se plaignent que la nouvelle capitale favorise largement les Pakistanais du nord et l'armée."
 Islamabad.3.d:0 "Aujourd'hui, à l'occasion du vingtième anniversaire de l'indépendance, le gouvernement pakistanais a officiellement emménagé dans sa nouvelle capitale, Islamabad. Le gouvernement a confié à un cabinet d'architectes grec le contrat pour concevoir la capitale, la construction étant supervisée par de hauts responsables fédéraux et militaires. De nombreux observateurs notent l'agréable plan en quadrillage avec les superbes collines de Margalla comme sommet. Les responsables pakistanais louent avec effusion la propreté et l'organisation de la nouvelle ville. Les experts estiment que la ville attirera rapidement de nombreux Pakistanais avides de nouvelles opportunités. Outre son ouverture et son climat tempéré, la ville est étroitement liée à Rawalpindi, qui abrite le GHQ. Même si les citoyens sont très fiers, certains craignent que la nouvelle capitale ne profite massivement aux militaires et aux communautés dans lesquelles elles recrutent en grande partie."
