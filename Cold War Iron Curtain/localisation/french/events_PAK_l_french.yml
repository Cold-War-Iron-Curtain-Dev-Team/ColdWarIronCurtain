 Nazimuddin.1.d:0 "Khawaja Nazimuddin a accepté de devenir le deuxième Premier ministre du Pakistan. L'ancien gouverneur général était considéré par beaucoup comme le choix le moins controversé en raison de son bilan. En tant que gouverneur général, il a exercé une neutralité politique en politique. Le fait que Muhammad Ali Jinnah et Liaquat Ali Khan l'aient ouvertement soutenu avant leur mort a également fait de Nazimuddin le candidat idéal pour devenir Premier ministre. Le Premier ministre Nazimuddin est originaire de Dacca et sera le premier chef de gouvernement bengali au Pakistan. L'un de ses premiers actes fut de faire de Malik Ghulam le nouveau gouverneur général. Il arrive au pouvoir dans un contexte de mécontentement politique croissant de la part des nationalistes provinciaux et a déclaré qu'il poursuivrait l'approche conservatrice de son prédécesseur. Une nouvelle ère politique pakistanaise a commencé. Cependant, les critiques soulignent déjà son origine aristocratique et les réactions négatives politiques suscitées par son rapport sur les principes fondamentaux ne présagent rien de bon pour lui."
 Language_Debate.1.d:0 "Le Premier ministre Khawaja Nazimuddin a déclenché la controverse suite à ses remarques à Dacca le mois dernier. Il a déclaré que Jinnah avait raison de dire que pour l'unité nationale, l'ourdou devait être la seule langue du Pakistan. Bien qu'il soit bengali, Nazimuddin reste fermement attaché au Pakistan envisagé par Jinnah et son passé d'aristocrate parlant ourdou a obscurci sa compréhension de la sensibilité du peuple bengali sur la question linguistique. Cette annonce a conduit à la formation de comités linguistiques exigeant la reconnaissance du bengali comme langue nationale. Aujourd'hui, des manifestants linguistiques sont descendus massivement dans les rues de Dacca, malgré l'interdiction gouvernementale de tout rassemblement illégal. Les manifestants, pour la plupart des étudiants, se sont réunis à l'université et se rassemblent en grand nombre. La police et les autorités du Pakistan oriental sont prêtes à agir."
 Language_Debate.2.d:0 "À l'université de Dacca, où les étudiants manifestaient pour des raisons linguistiques, la police a réussi à boucler certaines zones et à utiliser des gaz lacrymogènes pour disperser les manifestants. Alors que les étudiants s'enfuyaient, certains ont été arrêtés pour avoir violé les ordres du gouvernement, ce qui a apparemment provoqué la colère de la foule. Cette foule s'est déplacée vers le bâtiment de l'Assemblée du Pakistan oriental pour exiger que ses doléances soient entendues et alors qu'elle semblait faire irruption dans le bâtiment, la police a ouvert le feu, tuant au moins six étudiants, mais probablement davantage. La nouvelle de la fusillade a poussé les citoyens de Dacca à déclencher une grève générale. Au cours des deux jours suivants, de nouveaux manifestants sont descendus dans la rue et les tirs de la police se sont multipliés. Le soutien au gouvernement diminue parmi les Bengalis à mesure qu'ils se tournent de plus en plus vers les partis de gauche. Les gauchistes promettent de soutenir la volonté du peuple et s'engagent à soutenir le mouvement linguistique."

 PAK_Military.0.d:0 "Un certain nombre d'officiers militaires britanniques ont été retenus après la partition pour combler les lacunes et préparer les officiers à occuper des postes importants au sein du commandement militaire. Au cours de la récente guerre du Cachemire, les officiers britanniques ont désobéi aux ordres du gouvernement de déployer des troupes pakistanaises sur le front, entravant ainsi grandement l'effort de guerre. Le gouvernement estime que le retrait de ces agents est essentiel pour la sécurité nationale. Pour y parvenir, le gouvernement a récemment annoncé qu'il n'offrirait aux officiers britanniques servant dans l'armée pakistanaise qu'une prolongation d'un an de leur contrat actuel, qui expirera prochainement. Cela a vu pratiquement tous les officiers britanniques refuser la prolongation et, en réponse, le gouvernement a annoncé que le Pakistan verrait la nationalisation de l'armée dans quelques mois. L'Air Force et la Navy conserveront cependant de nombreux officiers britanniques par nécessité, mais ils seront progressivement supprimés dans les années suivantes. La presse a grandement salué cet effort de nationalisation des militaires. Les officiers de l'armée pakistanaise sont également enthousiasmés par la perspective de promotions rapides pour combler les nouvelles lacunes."
 PAK_Military.1.d:0 "Le gouvernement du Pakistan a annoncé que le général Ayub Khan a assumé les responsabilités de chef de l'armée pakistanaise. Il est le premier chef de service autochtone et sa promotion a fait grand bruit dans la presse. Le grand officier Pathan est le fils d'un responsable des chemins de fer coloniaux et a été l'un des premiers Indiens à être nommé dans l'armée indienne britannique après avoir obtenu son diplôme du Collège militaire royal de Sandhurst. Il a servi comme colonel pendant la Seconde Guerre mondiale, dirigeant les opérations en Birmanie. Après la guerre, il a occupé des postes de commandement supérieurs au Pakistan occidental et oriental. Lors de sa prise de fonction, le général a promis la loyauté de l'armée envers le Pakistan et a promis qu'il dirigerait les efforts visant à commencer à intégrer les groupes ethniques longtemps exclus de l'armée par l'État colonial et à construire une véritable force nationale pour la nation. Ses commentaires ont été bien accueillis par la presse."

 Bogra_PM.1.d:0 "Le Premier ministre Khawaja Nazimuddin a été démis de ses fonctions par le gouverneur général Ghulam Malik qui a invoqué les pouvoirs spéciaux de la loi de 1935 sur le gouvernement indien. Certains saluent cette décision car Nazimuddin s'est révélé inefficace lors du débat linguistique, des émeutes à Lahore et pour freiner la popularité croissante des partis de gauche dans le pays. Cependant, d'autres s'inquiètent du fait que le gouverneur général utilise les pouvoirs mis en place par le régime colonial pour s'assurer qu'il contrôle la gouvernance de l'Inde. Pour remplacer Nazimuddin, le gouverneur général a rappelé l'ambassadeur relativement inconnu aux États-Unis, Mohammad Ali Bogra, et l'a convaincu d'être le nouveau Premier ministre. La nomination d'un diplomate de carrière a surpris la nation et nombreux sont ceux qui se demandent s'il sera capable de gérer un paysage politique de plus en plus divisé. Cependant, un Bengali de la classe moyenne espère pouvoir apaiser les tensions au Pakistan oriental. Populaires à Washington, les États-Unis seraient enthousiasmés par le nouveau Premier ministre."
 Bogra_PM.2.d:0 "Le Premier ministre Ali Bogra, lors de l'Assemblée constituante, a exposé ce que l'on appelle la formule Bogra. Le Premier ministre qualifie ses propositions de compromis politique pour les deux ailes du pays ; il envisage une Assemblée nationale basée sur la représentation proportionnelle et un Sénat avec une représentation égale des quatre provinces du Pakistan occidental, mettant essentiellement fin à une unité. Il a également proposé une formule de sièges réservés qui conduirait finalement à un parlement dans lequel le Pakistan oriental aurait plus de sièges, mais grâce au système réservé, les représentants du Pakistan occidental s'équilibreraient. Les problèmes entre les chambres seraient résolus lors d'une session conjointe et le poste de gouverneur général perdrait de nombreux pouvoirs et le titre deviendrait celui de président. Le compromis est largement salué dans tout le pays. Cependant, la limitation des pouvoirs et le transfert du pouvoir vers le pouvoir législatif rendraient nerveux le gouverneur général, les chefs militaires et les officiers de la fonction publique."
 Bogra_PM.3.d:0 "Bien que le Premier ministre Ali Bogra ait travaillé très dur pour finaliser une constitution, l'unité unique et sa formule Bogra ont stagné pour faciliter une constitution finale. L'Assemblée constituante a récemment conclu que le gouverneur général Ghulam Malik entravait les efforts visant à parvenir à un compromis politique dans le pays. Dans un effort pour reprendre le contrôle de la situation, le Premier ministre a autorisé l'Assemblée constituante à discuter de lois qui restreindraient les pouvoirs du gouverneur général et l'empêcheraient de limoger le gouvernement actuel comme il l'avait fait avec son prédécesseur. Ghulam Malik a répondu en limogeant l'Assemblée constituante, bien qu'il n'ait pas renversé le gouvernement Bogra. Les membres de l'assemblée ont poursuivi le gouverneur général en justice pour son action et, au milieu de ces luttes politiques internes, le gouverneur général a demandé un congé de maladie. Ghulam Malik a quitté le pays pour se faire soigner à l'étranger et le ministre de l'Intérieur, Iskander Mirza, fonctionnaire de carrière, a été nommé gouverneur général par intérim."
 Bogra_PM.4.d:0 "Iskandar Mirza, le gouverneur général par intérim, a immédiatement commencé à entrer en conflit avec le Premier ministre Ali Bogra. Il pensait que Bogra et ses projets de compromis constitutionnel allaient accroître considérablement la disparité du pouvoir entre les provinces et conduire le pays à la ruine. Le Premier ministre Ali Bogra a insisté sur le fait qu'il souhaitait doter le pays d'une constitution et a commencé à discuter avec ses alliés politiques de projets visant à restreindre les pouvoirs du gouverneur général lorsqu'une nouvelle assemblée est arrivée. Cependant, Mirza a agi le premier, il a annoncé la démission du Premier ministre Ali Bogra et a informé le gouverneur général qu'il avait remplacé, Ghulam Malik, qu'il avait également été démis de ses fonctions. Bien qu'Ali Bogra ait officiellement démissionné, nombreux sont ceux qui pensent que le gouverneur général l'a forcé à démissionner. L'ancien Premier ministre a retrouvé son ancien poste d'ambassadeur aux États-Unis. Alors qu'une nouvelle assemblée législative commence à prendre forme, nombreux sont ceux qui pensent que le nouveau gouverneur général choisira la faction politique qui garantira son pouvoir."
 
 Bohla_Cyclone.1.d:0 "Alors que les conséquences de la tempête tropicale Nora se déplaçaient vers le golfe du Bengale, elle s'est lentement transformée en un cyclone appelé Bohla. La tempête dévastatrice a frappé directement le Pakistan oriental, se déplaçant vers le nord avant de se terminer dans l'Assam. La tempête a fait de nombreuses victimes, le nombre de morts se chiffrant en dizaines de milliers. Le Département météorologique du Pakistan n'a pas réussi à prédire ni à avertir la population de la tempête, ce qui a entraîné encore plus de pertes. Bien que l'armée pakistanaise ait déployé des avions, des navires et des troupes au Pakistan oriental pour apporter des secours, de nombreux Bengalis sont furieux contre le gouvernement. Le gouvernement fédéral n'a pas réussi à coordonner sa réponse et nombreux sont ceux qui se plaignent d'une pénurie massive de fournitures de secours. Pour de nombreux Bengalis, la réponse perçue comme terne est considérée comme une confirmation du statut de seconde classe que le gouvernement fédéral considère comme le Pakistan oriental."
 Bohla_Cyclone.2.d:0 "Un cyclone stationnaire s'est rapidement accéléré au nord de la baie du Bengale et a touché terre au Pakistan oriental dans la soirée, près de Chittagong. Le Département météorologique du Pakistan a effectivement émis une alerte, mais de nombreux habitants ne savaient pas exactement ce que cela impliquait. Vents de 144 km/h, avec une marée de tempête culminant à 4 mètres. L'impact a été dévastateur. Les autorités locales rapportent que des villages entiers et des populations insulaires ont été anéantis par la tempête. Dans les zones touchées par la tempête, les habitants affirment que près de 90 % des structures ont été détruites. Des millions de personnes sont touchées et les victimes se chiffreraient en centaines de milliers. Le gouvernement prétend fournir autant de soutien que possible, mais les médias et la population locale critiquent cette réponse. Les dégâts estimés sont immenses et une aide internationale se prépare."


 COMPAK_Kashmir.1.d:0 "Armé des armes soviétiques et imprégné de confiance par ses conseillers soviétiques, le général Akbar Khan a lancé un ultimatum au Parti. Le général a noté que les officiers comme lui qui ont soutenu le coup d'État l'ont fait parce qu'ils pensaient qu'une action était nécessaire au Cachemire avant que l'Inde ne devienne trop puissante. Akbar Khan a désormais déclaré que le moment était venu d'agir pour résoudre le Cachemire avec succès. Les hauts dirigeants du Parti ont lu cette demande d'action et estiment que le pays n'est pas prêt à une telle action alors que la révolution se poursuit. Cependant, ils estiment qu'il existe deux options. La première consiste à donner le feu vert à Akbar Khan pour lancer une escarmouche à la frontière avec l'Inde, cela devrait assouvir l'appétit des militaires pendant un certain temps. L'autre option est de supprimer Akbar Khan et de le remplacer par quelqu'un de plus calme comme le général Musa Khan"
 COMPAK_Kashmir.2.d:0 "Le récent conflit s'est soldé par une victoire de nos forces. Grâce à la ferveur révolutionnaire et à l'habileté de nos forces, nous avons triomphé de notre ennemi. Ils manquent de motivation pour résister à nos forces. La nation a été galvanisée par notre succès et ceux qui ont participé aux opérations ont été largement salués dans les médias. Le haut commandement militaire doute désormais d'être très satisfait des résultats et sera pour l'instant satisfait. Les dirigeants politiques sont également satisfaits du résultat car ils l'utilisent pour justifier la nécessité de la révolution. La portée limitée de l'opération était suffisante pour satisfaire nos objectifs et pas une escalade suffisante pour pousser les Indiens à étendre leurs opérations. Forts de ce succès, nous continuerons à renforcer notre armée et à nous préparer à une future résolution finale de notre différend avec les Indiens. Les médias indiens minimisent les événements récents en les qualifiant d'escarmouches mineures à la frontière sans résultat clair."
 COMPAK_Kashmir.3.d:0 "Malgré les efforts vaillants et courageux de nos forces armées à la frontière, les récents combats ne se sont pas déroulés comme nous l'espérions. L'ennemi s'est révélé bien plus coriace que prévu. Nos médias décrivent les batailles comme un effort héroïque couronné de succès, même si au sein de l'armée, la vérité est largement connue et le moral a été touché par ce revers. Certains officiers prétendent même que les récentes purges et les nouvelles orientations sont à l'origine de cet échec. Les agents que nous avons identifiés seront traités. Malgré cet échec, les résultats ont refroidi certains des dirigeants les plus bellicistes de l'armée. Cela renforcera considérablement les mains de notre parti et de nos dirigeants politiques. Nous pouvons nous concentrer sur la transformation du pays et sur le renforcement des capacités et de la ferveur révolutionnaire de nos militaires. Le moment venu, nous porterons le coup qui libérera non seulement le peuple du Cachemire mais aussi tous les travailleurs en Inde."

 Bangladesh_Independence.1.d:0 "La nouvelle de l'accession à la présidence d'Ayub Khan a envoyé des foules massives à travers le Pakistan oriental, en particulier à Dacca. La population du Pakistan oriental s'est longtemps sentie négligée par le centre et ce nouveau développement semble avoir confirmé ses soupçons selon lesquels le coup d'État était un complot de l'armée dominée par le Pakistan occidental visant à s'emparer du pays pour elle-même, d'autant plus qu'elle avait maintenant chassé Iskandar Mirza, un Bengali. Les foules croissantes à Dacca ont défilé sans aucune contestation, la police locale ne semblant pas disposée à intervenir. Le petit nombre de soldats de la 14e division qui gardaient l'Assemblée du Pakistan oriental ont été contraints de se frayer un chemin jusqu'à la zone de cantonnement, entraînant de lourdes pertes civiles et militaires. Le cantonnement est désormais virtuellement assiégé et les bataillons de East Pakistan Rifles, levés localement à travers le Pakistan oriental, font défection en masse vers la population. La quasi-totalité de leurs compatriotes du Pakistan occidental sont désormais sous garde armée."
 Bangladesh_Independence.2.d:0 "Depuis l'indépendance, le gouvernement pakistanais a maintenu une petite garnison au Pakistan oriental composée de la 14e division. Cette force est basée dans le cantonnement de Dacca mais est actuellement assiégée par des émeutes bengalis protestataires opposés au coup d'État lancé par l'armée. Au Pakistan occidental, l'armée a calculé que ses options étaient limitées car un transport aérien de renforts n'était pas réalisable. Les rebelles de Dacca se sont emparés de l'Assemblée du Pakistan oriental et proclament leur succession au Pakistan, revendiquant l'indépendance du Bangladesh. Les seules autres forces sont des East Pakistan Rifles, élevés localement, qui ont en grande partie fait défection et ont fait prisonniers leurs collègues du Pakistan occidental. Les forces rebelles ont déclaré qu'elles autoriseraient tout le personnel militaire pakistanais à quitter le pays si le gouvernement promettait de ne pas s'engager dans un conflit armé. Le commandant du 14e indique que ses forces manquent cruellement d'équipement mais qu'elles combattront si le gouvernement l'ordonne, même si leurs familles sont avec eux dans le cantonnement."
 Bangladesh_Independence.3.d:0 "Le gouvernement pakistanais a annoncé qu'il ne risquerait pas la vie de ses soldats dans une démonstration désespérée ni la perte de civils innocents qui seraient pris entre deux feux. Le président Ayub Khan a noté qu'un pont aérien était déjà en cours, avec des avions de plusieurs États amis arrivant à Dacca pour aider au transport de la 14e division, du personnel militaire du Pakistan occidental avec les East Pakistan Rifles et des fidèles employés du gouvernement vers le Pakistan occidental. Il a déclaré que le gouvernement considérait le Bangladesh comme un territoire rebelle, mais qu'il chercherait à négocier à l'avenir pour éventuellement réunifier le pays. De nombreuses personnes au Pakistan occidental sont heureuses de voir la violence cesser et les troupes revenir, mais un profond sentiment de colère gronde. Beaucoup affirment qu'un Bangladesh indépendant menace les fondements de l'existence du Pakistan et beaucoup, à gauche, soulignent que cette transformation dramatique ne se serait pas produite si l'armée était restée dans ses casernes."
 Bangladesh_Independence.4.d:0 "Le gouvernement pakistanais a ordonné à la 14e division de tenir jusqu'au bout pour l'honneur de son pays, puis a rejeté les exigences du soi-disant gouvernement bangladais. En quelques heures, les combattants rebelles, soutenus par l'arrivée d'unités pakistanaises en défection, se sont engagés dans des combats de rue autour du cantonnement. Les forces pakistanaises ont tenu bon plusieurs jours avant de manquer de munitions et ont été rapidement submergées. Les deux camps ont subi de lourdes pertes militaires, mais aussi des pertes civiles, les zones résidentielles étant devenues des champs de bataille. Dans le chaos, les familles des militaires vivant dans les cantonnements ont également subi des pertes dues aux combats et à leurs conséquences. Les militaires survivants et les familles des militaires sont détenus. Le gouvernement bangladais a adopté une résolution honorant les sacrifices héroïques de son peuple contre l'État pakistanais et a noté que le Pakistan envoyait des milliers de personnes au combat sans aucun but raisonnable. Au niveau international, l'action pakistanaise est fermement condamnée, mais au niveau national, le peuple se rallie derrière le gouvernement et ses martyrs."

 PAK_ECON.1.d:0 "À l'indépendance, le Pakistan a hérité de l'une des plus grandes régions productrices de jute au monde, au Pakistan oriental, et d'importantes zones de production de coton au Pakistan occidental. Le gouvernement dispose de fonds de développement et doit décider s'il utilisera ces fonds pour construire des installations de transformation du coton au Pakistan occidental ou des installations de transformation du jute au Pakistan oriental. Certains responsables estiment qu'un tel investissement contribuera à rendre le coton pakistanais plus compétitif sur le marché mondial. Tandis que d'autres affirment que l'industrie du jute a un grand potentiel, la partition a laissé bon nombre de leurs installations de transformation au Bengale indien. L'installation de ces installations au Pakistan oriental contribuera à restaurer l'industrie du jute et lui permettra de prospérer."
 PAK_ECON.2.d:0 "L'un des problèmes urgents auxquels le Pakistan était confronté au moment de l'indépendance était le manque de banques et de financements disponibles pour la nouvelle nation. La création de la Banque nationale du Pakistan a contribué à atténuer la demande de services bancaires commerciaux. Elle a ouvert sa première succursale au Pakistan oriental pour aider l'industrie du jute. La banque cherche désormais à s'agrandir et à ouvrir de nouvelles succursales. Un groupe de responsables estime que la banque devrait ouvrir davantage de succursales à Karachi, la capitale du pays en croissance rapide. D'autres soutiennent que le succès obtenu au Pakistan oriental devrait être étendu et que davantage de succursales entraîneraient une plus grande croissance pour la province."
 PAK_ECON.4.d:0 "Les colons britanniques avaient longtemps négligé la NWFP de la province de la frontière du Nord-Ouest en raison de ses conditions difficiles et de son rôle dans les guerres anglo-afghanes. Le budget fédéral dispose de liquidités excédentaires supplémentaires qui peuvent être dépensées pour améliorer les routes de la province. Cependant, une option alternative existe au Pakistan oriental, où à l'intérieur du pays, il y a également un manque de routes et d'améliorations des infrastructures. Même si ce qui est aujourd'hui le Pakistan oriental a fourni d'importantes matières premières pendant la période coloniale, une grande partie des investissements dans les infrastructures a été dirigée vers ce qui est aujourd'hui le Bengale indien. Utiliser cet excédent pour améliorer les infrastructures au Pakistan oriental est peut-être plus utile que d'investir dans les PFNL."
 PAK_ECON.3.d:0 "Le ministre des Finances nous informe que deux sociétés en croissance souhaitent recevoir des crédits importants de la banque nationale pour soutenir leur expansion sur le marché de la fabrication d'acier. L'une d'elles est la société Mughal Traders, basée à Lahore. Ils étaient à l'origine importateurs de fer et d'acier, mais souhaitent créer leurs propres installations de production. L'autre société qui a demandé une extension est BSRM. Cette entreprise possède déjà une petite aciérie mais doit agrandir et moderniser ses équipements pour augmenter la production. Les deux sociétés ont des propositions solides, mais nous ne pouvons nous permettre de soutenir l'expansion que d'une seule d'entre elles."
 PAK_ECON.5.d:0 "Depuis l'indépendance, Karachi et Chittagong ont pris de l'importance. Tous deux sont des ports vitaux pour le pays. En outre, les deux pays ont vu un afflux de réfugiés essayant de trouver une nouvelle vie au Pakistan. Le cabinet a récemment reçu des demandes de financement de développement de la part des deux villes. Tous deux souhaitent agrandir leurs ports et encourager le développement industriel pour offrir des emplois aux résidents nouvellement arrivés. Comme notre pays continue de croître et ne dispose pas d'immenses richesses, c'est au gouvernement de décider à qui bénéficiera ce développement. Les partisans de Chittagong soutiennent que Chittagong mérite davantage de développement, car Dacca récolte le plus de ressources. Les partisans de Karachi notent que puisque la ville est la capitale fédérale, le gouvernement devrait soutenir les efforts visant à la rendre plus développée et plus attrayante non seulement pour la population mais aussi pour les visiteurs internationaux."

 INDIA_PAK_COM.1.d:0 "Le Parti communiste du Pakistan (CPP) s'est formé quelques mois après l'indépendance lors de la 2e conférence pan-indienne du Parti communiste indien. Au cours des prochaines semaines, à Dacca, le CPP au pouvoir organisera sa première conférence pan-indienne avec des représentants du Parti communiste indien. Les deux partis ont déjà annoncé qu'ils travailleraient en étroite collaboration et renouvelleraient leur histoire commune. Cependant, la conférence abordera également trois questions majeures. La première est de savoir si le Pakistan devrait commencer à devenir une base pour l'exportation de la révolution vers l'Inde ou ses voisins. La deuxième est de savoir si le Pakistan ouvrira ses frontières et permettra aux militants et travailleurs communistes indiens de venir aider le pays. Enfin, la question du nationalisme et du Bengale sera également tranchée."
 Bengal_Question.1.d:0 "Les délégués bengalis du Parti communiste indien et du Parti communiste du Pakistan (CPP) s'assoient ensemble et votent souvent ensemble tout au long de la conférence. Ce puissant bloc électoral a introduit dans le débat l'idée du respect de la souveraineté nationale et affirme que la révolution peut être mise en oeuvre plus efficacement si le Pakistan oriental bénéficie d'une autonomie totale. Une République socialiste du Bangladesh serait capable de mobiliser directement les ouvriers et les paysans car ils sont plus avancés dans leur conscience de classe qu'au Pakistan occidental. Enfin, ils pourraient également contribuer à parler et à mobiliser la classe ouvrière indienne bengali. Les dirigeants du RPC ont soigneusement examiné cette proposition et celle-ci bénéficie d'un large soutien. Cependant, nombreux sont ceux qui craignent que la division du pays n'aliène les classes réactionnaires et anti-révolutionnaires du Pakistan, qui tenteront d'exploiter une telle décision comme un signe de faiblesse. Ce sera le dernier sujet sur lequel la conférence se prononcera."

 Ayub_Khan.1.d:0 "Le général Ayub Khan, l'administrateur en chef de la loi martiale, a annoncé qu'Iskander Mirza avait démissionné de ses fonctions et lui avait transféré ses pouvoirs. Le général a annoncé qu'il prendrait le titre de président, se promouvrait au rang de maréchal et quitterait son poste de chef de l'armée. Le nouveau chef de l'armée sera le général Muhammad Musa. Le président Ayub Khan a promis que l'intervention militaire ne durerait que jusqu'à ce que la nation dispose d'un système de gouvernement qui agira dans l'intérêt de tous les citoyens et ne sera pas vulnérable à la corruption et aux sales politiques de la dernière décennie. Beaucoup au Pakistan applaudissent le nouveau président car ils considèrent Mirza comme faisant partie de l'ancienne classe politique. Sa démission et sa fuite vers Londres sont considérées par les observateurs comme la preuve qu'Ayub Khan a gagné la lutte pour le leadership au Pakistan."
 Ayub_Khan.2.d:0 "Le président Ayub Khan a tenu ces dernières semaines des réunions avec de hauts fonctionnaires, des fonctionnaires de la fonction publique et des responsables judiciaires. Il a noté que depuis l'indépendance, ce sont eux et l'armée qui ont permis à l'État pakistanais de fonctionner, alors que les politiciens se disputaient constamment et travaillaient pour se renverser, conduisant à l'inefficacité du leadership politique. Le président a appelé ces groupes à travailler avec lui et à garantir que le peuple pakistanais dispose d'un gouvernement plus efficace et que l'administration du pays ne soit pas affectée négativement par le régime de la loi martiale. Il a souligné que les militaires ont peu de connaissances en matière de gouvernance et que leur soutien sera vital. Ces hauts fonctionnaires se sont montrés très réceptifs à l'égard du président et il semble qu'une alliance entre l'armée et la fonction publique soit en train de se former pour diriger le pays."
 
 Gilgit.1.d:0 "Le gouvernement du Pakistan a confirmé qu'il avait pris en charge l'administration directe du Gilgit-Balistan et le gouvernement de l'Azad Cachemire a accepté de céder l'administration. La raison en est que le Gilgit-Balistan est que la région la plus peuplée de Gilgit n'est pas directement liée à l'Azad Cachemire. Plus important encore, pendant la guerre du Cachemire, ce sont les Gilgit Scouts, dirigés par le major William Brown, et les habitants de la région qui se sont libérés du gouvernement cachemirien. Ils ont promis leur loyauté non pas à un nouveau Cachemire indépendant mais au Pakistan. Le gouvernement indien a condamné cette annonce et affirme que nous annexons le Gilgit-Balistan au Cachemire historique pour garantir que, dans un futur accord de paix, nous ne risquons pas de perdre ces terres. Notre gouvernement a rejeté la suggestion indienne, la qualifiant de ridicule."
 USA_PAK.1.d:0 "Le Premier ministre du Pakistan a récemment achevé une longue visite d'État aux États-Unis. Ce voyage de grande envergure a vu le Premier ministre arriver accompagné de hauts ministres. Au cours du voyage, les ministres ont rencontré leurs homologues tandis que le Premier ministre a eu des entretiens approfondis avec le Président. Le Premier ministre s'est également adressé au Congrès, l'informant des aspirations et des premiers combats du Pakistan. Il a visité des monuments majeurs et, au Pentagone, il a souligné son désir de voir le Pakistan armé pour faire face à toute menace, en particulier le communisme. La visite s'est terminée par un dîner d'État glamour et avant le départ du Premier ministre, il a invité le président américain à se rendre prochainement au Pakistan. Les médias américains ont été très impressionnés par le Premier ministre tandis que les médias pakistanais ont souligné, avec fierté, le protocole impressionnant offert à leur leader. Le président américain a promis d'aider à remédier aux pénuries agricoles auxquelles le Pakistan est confronté."
 
 Rawalpindi.1.d:0 "Le Premier ministre a récemment appris l'existence d'un complot contre le gouvernement impliquant des officiers militaires et des hauts gradés de gauche, organisé par le chef de l'armée. L'information provient de l'un des conspirateurs présumés qui a déclaré avoir assisté à une fête au cours de laquelle il avait vu d'éminents gauchistes présents avec au moins un général de haut rang. Il a déclaré qu'ils avaient fait des déclarations dénigrant les dirigeants actuels pour ne pas avoir mobilisé la population et envahir le Cachemire dès que possible. L'officier a ajouté qu'il pensait qu'ils discutaient de la manière dont il serait positif pour l'armée d'établir un nouveau gouvernement de gauche, mais a déclaré qu'il n'avait entendu aucune planification concrète. Le chef de l'armée a demandé au Premier ministre s'il souhaitait agir et arrêter les conspirateurs ou les laisser tranquilles. Bien que l'arrestation des conspirateurs éliminerait la menace, certains conseillers suggèrent que les informations reçues sont rares et que les arrestations pourraient finir par donner l'impression que le gouvernement est faible et embarrasser l'armée."
 Rawalpindi.2.d:0 "La nation a été stupéfaite aujourd'hui lorsque les journaux ont publié un communiqué de presse du Premier ministre dans lequel il révélait l'arrestation de quinze officiers militaires et d'éminents militants de gauche, dont des membres du Parti communiste du Pakistan, pour un complot visant à renverser le gouvernement. Le communiqué souligne que le général Akbar Khan a cherché à renverser violemment le gouvernement et à installer un régime communiste afin de lancer une campagne de répression interne et de guerre. Parmi les officiers arrêtés figurent plusieurs colonels et majors, tandis que le célèbre poète Faiz Ahmed Faiz faisait partie des gauchistes arrêtés. Tous les conspirateurs seront rapidement jugés et traduits en justice. Beaucoup au Pakistan applaudissent l'action rapide du Premier ministre pour balayer cette conspiration de Rawalpindi. Cependant, les critiques soulignent le manque de preuves présentées dans la déclaration et certains suggèrent que l'armée elle-même n'est peut-être pas digne de confiance."
 Rawalpindi.3.d:0 "Des cadres communistes hautement organisés à Dacca et Karachi ont simultanément pris d'assaut les bâtiments gouvernementaux ce matin. Ils ont pris en otage de nombreux hommes politiques et responsables et lorsque le Premier ministre a appelé le quartier général militaire pour exiger une action. Cependant, après avoir appelé, il a découvert que la plupart des commandants supérieurs étaient détenus et que des officiers supérieurs sympathisants communistes avaient pris le contrôle du GHQ. Avec le GHQ sous leur contrôle, les putschistes ont ordonné aux unités militaires locales de ne pas intervenir contre les cadres communistes et bientôt le gouvernement a capitulé devant le coup d'État mené par le général Akbar Khan. Au cours des années précédentes, une conspiration impliquant des officiers militaires et des dirigeants de gauche a vu des officiers sympathisants être déplacés vers des positions stratégiques et la mobilisation de cadres communistes pour agir au bon moment. Le général Akbar Khan a jusqu'à présent minimisé la possibilité d'un contre-coup d'État en arrêtant les généraux supérieurs et en s'appuyant sur sa réputation de célèbre commandant des combattants de la liberté pendant la guerre du Cachemire."
 Rawalpindi.4.d:0 "Le récent coup d'État a vu une alliance de militants de gauche, d'officiers militaires mécontents et du Parti communiste du Pakistan (CPP) agir en coordination pour prendre le pouvoir. Lors d'une récente réunion du parti, le CPP a annoncé la nomination du célèbre poète Faiz Ahmed Faiz comme nouveau dirigeant du Pakistan. Il a de nombreux partisans et des références de gauche en raison de sa poésie, tandis que son expérience d'ancien officier militaire le rend acceptable pour de nombreux officiers de gauche. Il coordonnera les efforts du parti pour unir les factions et lancer le processus de transformation du Pakistan et de fin des inégalités. Le général Akbar Khan, qui dirigeait les officiers militaires, et Sajjad Zaheer, l'ancien chef du CPP, reconnaissent tous deux qu'ils n'ont pas l'attrait national de Faiz Ahmed Faiz, mais ils sont censés gouverner en étroite collaboration avec lui et se sont vu attribuer des postes de direction."

 PAK_ASSASIN.2.d:0 "Dans une tragédie stupéfiante, le bien-aimé Premier ministre pakistanais Liaquat Ali Khan a été abattu aujourd'hui à Rawalpindi. Il s'adressait aux citoyens dans un parc lorsque le tireur a frappé. Les policiers ont immédiatement riposté, tuant l'assassin. L'assassin a été identifié comme étant Said Khan, un ressortissant afghan. Le gouvernement enquête actuellement sur ses motivations, mais il semble qu'il s'agisse de l'acte d'un individu perturbé et non d'un complot, même si de nombreuses personnes dans le pays soupçonnent un complot afghan. La nation serait déjà en deuil grâce aux messages de sympathie arrivant des États voisins et des principaux hommes politiques du Pakistan et de l'Inde. Le Premier ministre Liaquat Ali Khan laisse derrière lui une femme et trois enfants."
 PAK_ASSASIN.1.d:0 "L'assassinat de Liaquat Ali Khan a plongé le Pakistan dans le deuil mais aussi dans un sentiment palpable d'incertitude. Le Premier ministre Ali Khan a guidé le Pakistan au cours des premières années difficiles de l'indépendance, et il était considéré comme le seul dirigeant capable de guider l'Assemblée constituante dans sa difficile mission de créer une constitution. Pour la Ligue musulmane, la perte de Liaquat Ali Khan a ravivé les craintes que le parti ne s'effondre. Ali Khan a magistralement maintenu l'unité des nombreux groupes attachés au parti et il reste à voir si le parti perdurera sans lui. Le poste de Premier ministre a désormais besoin d'un nouveau leader et les membres de l'Assemblée constituante ont du mal à trouver un leader doté d'une légitimité nationale. Beaucoup demandent au gouverneur général de se retirer et de prendre le relais, car aucun membre de l'Assemblée ne semble capable. Pour le peuple pakistanais, Liaquat Ali Khan est devenu le Shaheed-e-Millat, le martyr de la nation."

 PAK_Constitution.0.d:0 "Le Premier ministre Liaquat Ali Khan a chargé Khawaja Nazimuddin de créer un comité chargé de déterminer les principes sous-jacents qui détermineraient la future constitution. Le rapport a été récemment publié. Le rapport affirmait que seul l'ourdou serait la langue nationale et proposait une législature partageant les sièges à parts égales entre le Pakistan occidental et oriental. Il a également appelé à la création d'un conseil des oulémas chargé d'étudier toutes les lois et de confirmer qu'elles sont conformes à l'Islam. Le rapport a suscité une énorme réaction dans la presse, en particulier de la part des minorités et des Bengalis du Pakistan oriental. Les minorités trouvent le conseil des oulémas problématique. Les Bengalis ont critiqué la disposition linguistique et l'égalité des sièges, soulignant qu'égaliser la représentation des deux ailes était antidémocratique et ignorait le fait que le Pakistan oriental avait une population plus importante. En entendant cette réaction négative, le Premier ministre Liaquat Ali Khan a demandé au comité de se réunir à nouveau et de soumettre à nouveau le formulaire plus tard."
 PAK_Constitution.1.d:0 "L'Assemblée constituante a officiellement approuvé la première constitution du Pakistan. Le gouvernement a déclaré la fin de toutes les lois et réglementations de l'époque coloniale qui régissaient le pays alors qu'il travaillait à l'élaboration de la constitution. La nouvelle constitution met fin au statut de dominion et déclare que l'État s'appellera la République islamique du Pakistan. Ce serait un système parlementaire avec une seule chambre, appelée l'Assemblée nationale. Le Pakistan oriental et occidental auront chacun un nombre égal de représentants. Le président sera cérémonial mais possédera des pouvoirs d'urgence si nécessaire et les langues nationales seront l'ourdou, l'anglais et le bengali. Le gouvernement est félicité pour ses efforts, car il a travaillé en étroite collaboration avec l'opposition pour finaliser le document. Le gouverneur général Iskandar Mirza deviendra président. Bien que la constitution soit bien accueillie, certaines inquiétudes subsistent quant aux pouvoirs d'urgence présidentiels et aux dispositions donnant au Centre toute latitude pour s'immiscer dans les affaires du gouvernement provincial."
 PAK_Constitution.2.d:0 "L'Assemblée constituante a officiellement approuvé la première constitution du Pakistan. La nouvelle constitution met fin au statut de dominion et déclare que l'État s'appellera la République islamique du Pakistan, mettant ainsi fin aux derniers visages du colonialisme. Ce serait un système parlementaire, avec deux chambres. Bien que les sièges soient divisés proportionnellement à la population, donnant ainsi plus de sièges au Pakistan oriental, la constitution contient des dispositions sur les sièges réservés qui, une fois additionnés, créent la parité. La constitution est très similaire à la formule de Bogra et souligne l'importance d'un pouvoir judiciaire indépendant. Le pays aura trois langues nationales, le bengali, l'ourdou et l'anglais, et les droits provinciaux seront garantis par le parlement. Cependant, le président, bien que largement cérémonial, dispose de certains pouvoirs d'urgence pour destituer les gouvernements provinciaux et fédéral. On pense que cela a été ajouté pour garantir que le gouverneur général et futur président Iskandar Mirza approuve le document."
 PAK_Constitution.3.d:0 "L'Assemblée constituante a officiellement approuvé la première constitution du Pakistan. La nouvelle constitution met fin au statut de dominion et déclare que l'État s'appellera la nation islamique du Pakistan. La nouvelle constitution envisage un parlement à deux chambres, dont une composée exclusivement d'hommes de caractère musulmans. L'autre étant composé d'ulémas de tout le pays. La constitution définit les musulmans comme ceux qui croient en la finalité du prophète et déclare que le tribunal de la charia est le plus haut tribunal du pays. Le chef de l'État sera le Sadar-e-Mumlikat signifiant chef de l'État et cette fonction sera occupée par l'actuel gouverneur général, Iskandar Mirza. À l'avenir, ce poste sera élu par les deux chambres parmi ses membres. Ce poste possède également des pouvoirs d'urgence, ce qui, selon certains, était le coût exigé par Mirza avant d'approuver la constitution. La réaction parmi les élites, les minorités et ceux qui sont liés au gouvernement a été une pure horreur face à la nouvelle constitution."

 PAEC.1.d:0 "Le gouvernement a confirmé la création de la Commission pakistanaise de l'énergie atomique (PAEC). C'est le point culminant de la décision du Pakistan de s'engager dans le programme Atomes pour la paix des États-Unis. Cet organisme indépendant rassemble les principaux scientifiques nucléaires et physiques d'origine pakistanaise qui travailleront au développement de l'énergie nucléaire comme solution à la demande croissante d'énergie. Le premier président sera le très respecté physicien expérimental, le Dr Nazir Ahmed. Le PAEC a annoncé qu'il n'avait pas l'intention de s'engager dans la recherche sur les armes et qu'il espérait utiliser cette nouvelle technologie au profit du peuple pakistanais. Les États-Unis notent que le Pakistan a manifesté dès le début un vif intérêt pour cette technologie énergétique et espère aider le pays à répondre à ses besoins énergétiques. Des bourses et des financements destinés aux jeunes scientifiques pakistanais seront distribués par le PAEC afin de constituer la base de connaissances nécessaire à un programme nucléaire pacifique."
 PAK_INDIA.10.d:0 "Le gouvernement indien a récemment proposé un pacte de non-guerre avec le Pakistan. Comme le suppose le gouvernement pakistanais, cela visait à les embarrasser au niveau international et à tenter de présenter le Pakistan comme une nation avide de guerre. En réponse à leur offre, le Pakistan a donné une conférence de presse et a noté qu'il \"n'aimerait rien de plus que d'avoir des relations pacifiques avec l'Inde et rêverait que les deux nations travaillent côte à côte pour la sécurité de l'Asie du Sud\". Cependant, ils affirment \"que l'Inde est bien consciente qu'un accord sur ce traité ne pourra pas être conclu tant que la blessure purulente du Cachemire demeure\". Ils ont poursuivi en disant que « si le gouvernement indien met en oeuvre les résolutions de l'ONU et s'efforce de résoudre le problème d'une manière qui reconnaît les souhaits des Cachemiriens, alors un pacte de non-guerre serait certainement raisonnable, mais étant donné les circonstances actuelles, un tel pacte est impossible à envisager sérieusement »."
 Afghan_PAK.20.d:0 "Depuis l'indépendance du Pakistan, l'Afghanistan n'a cessé de nous mettre au défi sur la scène internationale. L'Afghanistan a voté contre notre entrée aux Nations Unies et tenterait, dit-on, de susciter des soulèvements tribaux contre notre gouvernement. Cela remonte à la période britannique, lorsque l'Afghanistan prétendait que les Pathans résidant sur nos terres leur appartenaient. Aujourd'hui, les Afghans prétendent que leurs traités avec les Britanniques ne s'appliquent plus et ils revendiquent nos territoires occidentaux avec des populations pathanes. Compte tenu des tensions avec l'Inde, de nombreux membres du gouvernement estiment que la poursuite du conflit avec l'Afghanistan ne fait que nous nuire. Cependant, d'autres suggèrent qu'une approche dure et dure à l'égard des Afghans garantira qu'ils n'essaieront pas de nous poignarder dans le dos. Nous contrôlons leur accès aux biens internationaux, nous pouvons les menacer à ce sujet."
 Gwadar.1.d:0 "Le port de Gwadar est depuis longtemps sous l'administration du sultan omanais. Ses prétentions sur le port étaient garanties par des accords avec les Britanniques et l'État princier voisin de Makran, qui contrôlait auparavant le port. Après l'indépendance du Pakistan, Makran a rejoint le pays mais Gwadar est resté sous la domination omanaise. Récemment, le gouvernement pakistanais a contacté le gouvernement omanais et après des négociations amicales, les Omanais ont accepté de restituer Gwadar au Pakistan dans le cadre d'une vente-achat. L'accord montre comment les frères musulmans peuvent travailler ensemble pour oeuvrer dans l'intérêt du peuple et contraste avec les Indiens qui utilisent souvent la force brute lorsqu'ils traitent des revendications territoriales. Gwadar étant désormais sécurisé, le Pakistan occidental dispose désormais d'un deuxième port en eau profonde qu'il peut développer à l'avenir."
 Khan_PAK.1.d:0 "Le ministre pakistanais des Affaires étrangères, Zafarullah Khan, s'est révélé être un atout formidable pour notre gouvernement. Depuis l'indépendance, il a non seulement défendu notre gouvernement avec éloquence, mais il a également contribué à faire adopter des résolutions clés de l'ONU sur le Cachemire exigeant la préservation de leur droit à l'autodétermination. Lors de ces premiers débats sur le Cachemire, il a constamment déjoué ses adversaires indiens et s'est assuré qu'aucun pouvoir n'opposait son veto aux résolutions adoptées. Il a également joué un rôle majeur en aidant les discussions de l'ONU pendant la partition de la Palestine et a renforcé nos liens avec les États-Unis en condamnant ouvertement l'agression communiste au niveau international. Il reste une épine dans le pied de la propagande indienne sur le Cachemire et est considéré comme un grand porte-parole du Cachemire dans son pays et un homme d'État estimé à l'étranger."

 Lahore_Riots.1.d:0 "Le Premier ministre Khawaja Nazimuddin a reçu un ultimatum d'une alliance d'ulémas appelée Majlis-i-Amal. L'ultimatum appelle au retrait des Ahmadis des bureaux gouvernementaux et à la déclaration selon laquelle les Ahmadis sont non musulmans. Le conflit porte sur la conviction de nombreuses communautés musulmanes dominantes que les Ahmadis, qui prétendent être une secte musulmane, ne sont pas musulmans car ils ne croient pas à la finalité du prophète. Bien que le Premier ministre soit un conservateur doté de fortes convictions religieuses, il est un constitutionnaliste strict et a rejeté l'ultimatum. Malheureusement, cette décision a conduit à des émeutes à Lahore où les partisans du Majlis-i-Amal saccagent, pillent et détruisent les maisons, les entreprises et les lieux de culte des Ahmadis qui y vivent. La police se joindrait aux émeutiers et le Premier ministre doit maintenant décréter la loi martiale et déployer les troupes."
 Lahore_Riots.2.d:0 "Les émeutes anti-Ahmadi qui ont ravagé la ville quelques semaines plus tôt ont en grande partie pris fin. Après que le Premier ministre ait déployé l'armée pakistanaise pour rétablir l'ordre et appliquer la loi martiale, les citoyens du pays ont été enthousiasmés par la rapidité avec laquelle l'armée a réussi. Quelques heures après leur entrée dans la ville, la violence a commencé à diminuer alors que les troupes imposaient strictement un couvre-feu. Contrairement à la police, la discipline militaire a tenu et aucun n'a rejoint les manifestants. La loi martiale reste en vigueur mais la vie dans la ville revient à la normale. Les principaux imams impliqués dans les manifestations ont été condamnés à mort par des tribunaux militaires, même si beaucoup soupçonnent que ces peines seront commuées en peines à perpétuité. Les habitants de Lahore font état d'interactions amicales avec l'armée. Un programme d'embellissement lancé par l'armée fait plaisanter certains habitants en disant que l'armée quitte Lahore plus agréable qu'avant les émeutes. Certains au Pakistan se demandent désormais si les garçons en kaki offrent plus de stabilité que les politiciens de Karachi."
 PAK_1955.1.d:0 "L'Assemblée constituante s'est réunie de nouveau après sa révocation par le gouverneur général. La nouvelle assemblée est composée de trois factions, la Triple Alliance, qui regroupe la faction conservatrice divisée qui gouverne le pays depuis la partition. Le Front uni a également des partisans à l'Assemblée, ils sont composés de gauchistes, dont beaucoup viennent du Pakistan oriental, qui ont été récemment galvanisés par le débat linguistique. Ils profitent également de la perception selon laquelle les Pakistanais de l'Est sont affaiblis par l'establishment. Il y a enfin le Jamaat-i-Islami, le principal parti islamiste du pays. Le Jamaat continue de lutter politiquement en raison de son opposition à la création du Pakistan, mais dispose toujours d'un impressionnant réseau de réseaux de base à travers le pays. Le gouverneur général doit décider s'il doit maintenir la Triple Alliance au pouvoir, s'associer au populaire mais dangereux Front uni, ou laisser le Jamaat-i-Islami prendre le pouvoir."
 Ahmedi.1.d:0 "Le Parlement a récemment adopté un nouveau projet de loi qui, selon lui, résout définitivement la question ahmadie. Le projet de loi déclare les Ahmadis non musulmans car ils ne satisfont pas aux exigences constitutionnelles de ce qu'est un musulman et libère toutes les personnes reconnues coupables d'implication dans les récentes émeutes de Lahore. Le projet de loi note que les musulmans qui ont participé étaient motivés par la passion et le désir de protéger la foi et ne peuvent être punis pour avoir fait la volonté de Dieu. Le projet de loi interdit aux Ahmadis d'être enterrés dans les cimetières musulmans ou de qualifier leurs lieux de culte de mosquées. L'annonce de ce projet de loi a déjà entraîné la fermeture de nombreuses entreprises ahmadis et la vente de maisons. Les ambassades occidentales sont bombardées de demandes d'asile et l'une des plus grandes communautés d'affaires de Lahore semble quitter le pays en masse."
 PAK_REl.1.d:0 "Le gouvernement Jamaat-i-Islami a annoncé qu'il augmenterait le nombre d'imams dans les bases et au sein des unités militaires. En outre, il a noté que le Corps des aumôniers sera rebaptisé Corps de l'Imam, car ils prévoient d'annoncer le retrait des non-musulmans des forces armées dans les prochaines années. L'augmentation du nombre d'imams vise à améliorer le moral des combattants et les imams auront un rang plus élevé qu'auparavant. Ils observeront et veilleront également au respect des règles de la foi. Bien que l'armée n'ait pas répondu à cette annonce, nombreux sont ceux qui pensent qu'elle est furieuse de cette ingérence dans sa structure et sa discipline. De nombreux officiers soulignent que leurs forces sont déjà motivées par le patriotisme et la ferveur religieuse pour défendre le pays et que le gouvernement ne leur fait clairement pas confiance."

 PAK_Afghan_Relations.1.d:0 "L'Afghanistan a toujours menacé l'unité de notre nation. Depuis l'indépendance, ils attisent constamment le nationalisme pathan à travers leur campagne au Pachtounistan. De plus, ils ont constamment refusé de reconnaître notre frontière le long de la ligne Durand. Au fil des années, nous soupçonnons qu'ils n'ont pas seulement diffusé de la propagande, mais qu'ils se sont également engagés dans des efforts clandestins et manifestes pour susciter un soulèvement armé. Jusqu'à présent, nos forces sont restées vigilantes face à la menace. Toutefois, le statu quo n'est plus acceptable, d'autant plus que nous avons d'autres problèmes de sécurité à régler. Nous avons deux options concernant l'Afghanistan. Nous pouvons soit ouvrir un dialogue et renforcer les relations bilatérales, soit répondre à l'agression afghane par notre propre ligne dure et les forcer à s'asseoir à la table de la paix."
 PAK_Afghan_Relations.2.d:0 "Le gouvernement pakistanais nous a invités à des entretiens à Peshawar. D'après les reportages des médias et les discussions avec leurs ambassadeurs, il est clair que les Pakistanais cherchent à nous tendre un rameau d'olivier. Bien que certains partisans de la ligne dure préconisent de rejeter les pourparlers tant que le Pachtounistan n'est pas à l'ordre du jour, cela risquerait de s'aliéner les dirigeants non-Pouchtounes du pays. Ils critiquent de plus en plus notre gouvernement pour ce qu'il appelle une obsession pour le Pachtounistan, qui a coûté cher à la nation en termes de commerce. Nous enverrons une délégation dont le membre le plus haut placé sera le ministre des Affaires étrangères, de cette façon nous pourrons satisfaire à la fois les extrémistes et les modérés. Les partisans de la ligne dure apprécieront l'idée de ne pas envoyer davantage de hauts fonctionnaires, tandis que les modérés accueilleront favorablement la possibilité de pourparlers de paix. Les pourparlers auront lieu dans une semaine."
 PAK_Afghan_Relations.3.d:0 "Le ministre afghan des Affaires étrangères est arrivé à Peshawar pour s'entretenir avec de hauts dirigeants pakistanais sur les questions en suspens entre les deux États. Le gouvernement pakistanais a réservé un grand accueil aux Afghans en visite et a organisé des visites guidées pendant les premiers jours, notamment une visite du célèbre fort de Bala Hissar. Cette visite a donné lieu à une petite gaffe puisque les médias afghans ont critiqué le ministre des Affaires étrangères pour avoir visité l'ancienne résidence royale de la monarchie afghane, qui est aujourd'hui le quartier général de ce que l'Afghanistan appelle une force militaire d'occupation. Malgré ces problèmes mineurs, les négociations ont désormais commencé et le gouvernement pakistanais ne cache pas son espoir de parvenir à une avancée décisive."
 PAK_Afghan_Relations.4.d:0 "Le gouvernement pakistanais a indiqué qu'il considère la ligne Durand comme la frontière officielle des deux nations, malgré les critiques adressées à l'Afghanistan. Cependant, il a également noté qu'à l'indépendance, le Pakistan s'était fait un devoir de retirer les avant-postes militaires permanents des zones tribales afin de respecter l'autonomie de ses tribus. Les Pakistanais affirment que cela démontre leur désir de paix dans la région et de respect pour les peuples vivant à la frontière. En fait, les Pakistanais ont proposé d'assouplir davantage les restrictions frontalières afin de permettre aux familles afghanes et pakistanaises séparées à la frontière de se rendre plus facilement les unes aux autres. À première vue, la proposition semble très judicieuse et profiterait aux familles afghanes. La signature de l'accord semble très bénéfique, surtout si nous voulons finalement la paix. Cependant, certains à Kaboul craignent que cette proposition ne soit un tremplin pour les Pakistanais afin d'apaiser l'Afghanistan et de nous faire finalement accepter la ligne Durand."
 PAK_Afghan_Relations.5.d:0 "Le ministre des Affaires étrangères de l'Afghanistan a informé le gouvernement pakistanais que la proposition visant à assouplir les frontières était inacceptable. Le ministre insiste sur le fait que la seule solution à la crise est le retrait des forces pakistanaises du Pachtounistan et un référendum permettant au peuple de décider. Sans aucun progrès en vue, les pourparlers ont été rapidement conclus. De nombreuses personnes au Pakistan sont déçues de l'échec des négociations, certains dirigeants de l'opposition critiquant ouvertement le président pour son échec à résoudre les tensions avec l'Afghanistan. Quoi qu'il en soit, le gouvernement estime qu'il doit essayer et espère qu'avec le temps, le gouvernement afghan retrouvera la raison. À Kaboul, les partisans de la ligne dure ont félicité le gouvernement pour sa position ferme, tandis que les modérés ont critiqué le manque de flexibilité manifesté lors des négociations."
 PAK_Afghan_Relations.6.d:0 "À Peshawar, des représentants des gouvernements pakistanais et afghan ont signé un accord visant à assouplir les restrictions aux frontières afin de faciliter les déplacements entre les familles séparées par la frontière. Pour l'Afghanistan, l'accord apportera un soulagement à nombre de ses citoyens qui critiquent amèrement les restrictions aux frontières depuis des années. Au Pakistan, l'accord est considéré comme un acte de maturité politique de la part du gouvernement et une indication de sa volonté d'entretenir des relations apaisées avec l'Afghanistan. Cependant, cet accord suscite certaines critiques. Les partisans de la ligne dure à Kaboul accusent le gouvernement de trahir l'engagement sacré en faveur du Pachtounistan, tandis qu'au Pakistan, certains ont exprimé leur inquiétude quant au fait que des frontières plus ouvertes pourraient conduire à une infiltration afghane dans le pays. Quoi qu'il en soit, la majorité des citoyens des deux pays semblent satisfaits de l'accord."
 PAK_Afghan_Relations.100.d:0 "Suite à notre accord réussi avec l'Afghanistan sur des frontières plus souples, les relations sont positives et nous sommes en bonne position diplomatique. Certains responsables estiment que le moment est venu de proposer un référendum sur le Pachtounistan pour les habitants des zones tribales, et non pour la province frontalière du Nord-Ouest ou les régions du Baloutchistan. Bien que les Afghans soutiennent que le référendum devrait être organisé par une partie neutre, nous pouvons simplement dire que comme aucun avant-poste militaire n'est présent dans les zones tribales, il ne peut y avoir aucune crainte d'intimidation. Nous proposerons même de signer un accord contraignant avec l'Afghanistan pour en respecter les résultats. À tout le moins, l'Afghanistan appréciera ce geste, et s'il l'accepte, nous sommes convaincus que les zones tribales resteront au Pakistan."
 PAK_Afghan_Relations.7.d:0 "Dans une proposition extraordinaire, le gouvernement pakistanais a proposé d'organiser un référendum sur le Pachtounistan. Il y a cependant quelques réserves, ils se limitent aux zones tribales et administreront eux-mêmes le référendum. Cette proposition témoigne à tout le moins d'une volonté d'écoute de la part des Pakistanais et peut être appréciée. En effet, les modérés et certains partisans de la ligne dure au sein du gouvernement nous exhortent à accepter cette proposition. Si les zones tribales votent en faveur de l'adhésion à l'Afghanistan, cela pourrait très bien conduire à une pression publique au Pakistan pour étendre le référendum au NWFP et au Baloutchistan. De nombreux partisans de la ligne dure et certains modérés ne sont cependant pas d'accord. Ils considèrent cette offre comme peu génésique et comme un stratagème visant à affaiblir notre position sur la question. Ils insistent sur le fait que le Pakistan n'accepterait pas le vote s'il ne savait pas qu'il pourrait gagner. Au lieu de cela, ils soutiennent que nous devrions au moins accepter le geste de bonne foi, mais le refuser car il ne couvre pas l'ensemble du Pachtounistan."
 PAK_Afghan_Relations.8.d:0 "Kaboul a informé notre ministre des Affaires étrangères qu'elle avait accepté l'offre d'organiser un référendum sur le Pachtounistan dans les zones tribales. Nous avons déjà annoncé le vote qui aura lieu dans environ 90 jours. La réaction en Afghanistan est mitigée, certains la qualifiant de premier pas vers la libération tandis que d'autres affirmaient qu'il s'agissait d'un stratagème pakistanais. Les préparatifs commencent déjà puisque nous avons envoyé des instructions aux agents politiques dans les zones tribales pour mobiliser le soutien des chefs tribaux. En outre, des ressources de renseignement sont également envoyées pour surveiller la façon dont les gens envisagent de voter et garantir une augmentation du nombre de pro-pakistanais."
 PAK_Afghan_Relations.9.d:0 "Le gouvernement afghan nous a informé qu'il n'approuvait pas la proposition d'organiser un référendum sur le Pachtounistan dans les zones tribales. L'Afghanistan souhaiterait qu'un tel vote englobe l'ensemble du Pachtounistan et soit idéalement mené par l'intermédiaire d'un tiers neutre. Quoi qu'il en soit, l'Afghanistan a indiqué qu'il appréciait ce geste comme un mouvement positif et espérait que nous accepterions bientôt la nécessité d'un référendum global à l'avenir. Bien que notre proposition ait été rejetée, nous avons amélioré nos relations car notre offre a provoqué de nouvelles divisions au sein de la faction dure à Kaboul, ce qui ne fait que renforcer la position de ceux qui prônent la paix."
 PAK_Afghan_Relations.10.d:0 "Les résultats tant attendus d'un récent référendum dans les zones tribales du Pakistan sur la question de savoir si leur population souhaitait rejoindre l'Afghanistan dans le cadre du Pachtounistan ou rester au Pakistan sont arrivés hier. Le peuple a voté pour rester au Pakistan. Le gouvernement pakistanais a félicité les populations tribales pour leur dévouement et leur dévouement envers la nation. Ce résultat intervient au milieu d'accusations selon lesquelles les autorités pakistanaises auraient offert des incitations aux chefs tribaux pour qu'ils approuvent le vote pour le Pakistan et d'informations selon lesquelles les résidents qui voyageaient entre le Pakistan et l'Afghanistan étaient considérés comme inéligibles pour voter. La plus grande critique a peut-être été l'arrivée de nombreux bulletins de vote de Pathans dans les forces armées qui prétendaient provenir des zones tribales. Le Pakistan est satisfait du vote et son gouvernement affirme n'avoir jamais douté de la loyauté de son peuple. La réaction de l'Afghanistan ne saurait tarder."
 PAK_Afghan_Relations.11.d:0 "Kaboul a publié une déclaration cinglante condamnant le récent référendum organisé dans les zones tribales du Pakistan sur la question de savoir si les habitants souhaitaient rester au Pakistan ou rejoindre l'Afghanistan pour le Pachtounistan. Une large majorité a voté pour le maintien au Pakistan. Cependant, le gouvernement afghan affirme que des manipulations électorales généralisées ont eu lieu dans les semaines précédant le vote. En outre, les Pakistanais ont refusé de compter les votes de ceux qui traversaient régulièrement la frontière, affirmant qu'on ne savait pas s'ils étaient des résidents permanents des zones tribales pakistanaises. Face à ces problèmes, le gouvernement afghan insiste sur le fait que les résultats étaient illégitimes et qu'il ne cesserait de défendre la cause du Pachtounistan pour les millions de Pathans qui luttent sous l'occupation pakistanaise."
 PAK_Afghan_Relations.12.d:0 "Le gouvernement pakistanais, dans une déclaration inhabituellement cinglante, a dénoncé le gouvernement afghan pour son ingérence constante dans les affaires pakistanaises. Ils accusent les Afghans de chercher à déclencher des soulèvements armés et de diffuser de fausses déclarations afin d'empoisonner les relations du Pakistan avec ses citoyens le long de la frontière. Le gouvernement a souligné qu'il disposait de ses propres capacités et que si les Afghans ne cédaient pas, le Pakistan devrait bientôt les mettre au pas pour leur donner une leçon. Il est clair que le Pakistan approche d'un point de rupture avec l'Afghanistan."
 PAK_Afghan_Relations.13.d:0 "Poursuivant son récent virage vers l'hostilité, le gouvernement pakistanais a demandé à l'Afghanistan de reconnaître la ligne Durand comme frontière officielle entre les deux nations. Les Pakistanais ont insisté pour que les Afghans cessent de vivre dans un monde fantaisiste et acceptent la réalité du terrain. Il a noté que l'Afghanistan avait accepté la frontière sous le Raj et que, comme le Pakistan avait hérité de ces terres, il devait respecter la frontière. Il s'agit d'une initiative agressive de la part du Pakistan et certains craignent qu'il envisage des options militaires. Certains membres du gouvernement suggèrent d'assurer en privé aux Pakistanais que nous n'avons aucune ambition pour leur territoire, mais que nous ne pouvons pas reconnaître publiquement la frontière pour le moment. Les partisans de la ligne dure au sein du gouvernement insistent pour que nous dénoncions le gouvernement pakistanais pour ses intimidations et réaffirmons notre position."
 PAK_Afghan_Relations.14.d:0 "Le gouvernement afghan a envoyé un intermédiaire pour informer notre gouvernement que l'Afghanistan avait entendu nos avertissements. L'intermédiaire a insisté sur le fait que l'Afghanistan n'a actuellement aucun complot ni aucune volonté de modifier le statu quo le long de la frontière. Ils ont également promis d'atténuer une partie de la propagande du Pachtounistan et s'efforceront de maintenir des relations aussi cordiales que possible. En échange, ils nous ont demandé de réprimer les commentaires hostiles et de maintenir les canaux ouverts. Notre gouvernement acceptera cette déclaration et atténuera bientôt sa rhétorique. Nous avons atteint notre objectif d'utiliser une posture forte pour pousser les Afghans vers la paix."
 PAK_Afghan_Relations.15.d:0 "Le gouvernement afghan a condamné avec défiance nos récentes déclarations et a réitéré ses revendications envers le Pachtounistan. Le gouvernement afghan insiste sur le fait qu'il s'agit d'une mission pure et noble et qu'il ne se laissera intimider par aucune puissance étrangère. Il semble que notre ligne dure n'ait pas conduit les Afghans à réaliser que leur hostilité constante ne profite à personne. En effet, les relations n'ont fait que se dégrader et il faut rester vigilant à la frontière occidentale. L'armée pakistanaise a cependant une proposition sur la façon de montrer fermement à l'Afghanistan le sérieux de notre position et de sauver la situation en notre faveur."
 PAK_Afghan_Relations_Border_War:0 "Déclencher une guerre frontalière avec l'Afghanistan"
 PAK_Afghan_Relations_Border_War_desc.d:0 "Le gouvernement afghan continue de mettre en avant le Pachtounistan et menace la stabilité du Pakistan. Un plan audacieux du GHQ appelle nos forces à s'engager dans un conflit frontalier avec les Afghans. Une fois que nous aurons vaincu les forces afghanes à la frontière, leur gouvernement prendra conscience de la gravité de la situation et reviendra à la raison."
 PAK_Afghan_Relations.16.d:0 "La récente guerre frontalière entre le Pakistan et l'Afghanistan s'est soldée par une victoire des forces pakistanaises. Les forces pakistanaises ont récemment lancé des opérations contre les forces afghanes à la frontière. De nombreux analystes pensaient que les Pakistanais auraient le dessus dans le conflit et ils ont eu raison. La nouvelle de la défaite militaire à la frontière a semé la panique à Kaboul, certains craignant que les forces pakistanaises ne s'enfoncent plus profondément dans le pays. Cependant, le gouvernement pakistanais a plutôt fait marche arrière, affirmant que ses forces avaient apporté une réponse appropriée à des années de harcèlement afghan. Des sources à Kaboul indiquent que les Pakistanais ont réussi à obtenir du gouvernement afghan une promesse de non-agression pendant au moins cinq ans. L'armée pakistanaise organise des manifestations publiques en son honneur dans les principales villes pakistanaises pour remercier ses opérations réussies."
 PAK_Afghan_Relations.17.d:0 "La récente guerre frontalière entre le Pakistan et l'Afghanistan s'est soldée par une victoire de l'armée afghane. Les forces pakistanaises avaient commencé les combats après avoir lancé des attaques contre les troupes afghanes à la frontière. De nombreux analystes pensaient que les Pakistanais auraient le dessus, mais cette hypothèse s'est avérée erronée. Les détails ne sont pas clairs, mais il semble que l'armée pakistanaise ait sous-estimé les Afghans ou se soit surestimée. Les forces afghanes ont non seulement repoussé les Pakistanais, mais occupent actuellement une partie du territoire situé au-delà de la frontière, le qualifiant de terre libérée du Pachtounistan. Avec les avertissements de Delhi, le gouvernement pakistanais est incapable d'étendre le conflit et doit vivre avec les conséquences cuisantes de cette campagne ratée. Il règne à Kaboul un sentiment de joie et d'optimisme, car le rêve du Pachtounistan est loin d'être un fantasme."
 PAK_Afghan_Relations_Alt.1.d:0 "L'ambassadeur du Pakistan a remis un message du président Ayub Khan invitant une délégation à tenir des pourparlers au Pakistan. Le message était amical et il semble que les Pakistanais cherchent à renouer les liens. Cependant, nous ne pouvons pas les laisser nous endormir dans une position où nous abandonnons nos frères de l'autre côté de la frontière. Certains conseillers nous suggèrent de rejeter l'invitation car les mots ne peuvent pas résoudre nos problèmes. Cependant, d'autres soutiennent que nous devrions accepter l'invitation, pour au moins connaître leur position et peut-être améliorer les conditions à la frontière à notre avantage."
 PAK_Afghan_Relations_Alt.2.d:0 "Nos efforts pour tendre la main à l'Afghanistan ont porté leurs fruits, car ils ont accepté d'envoyer une délégation de haut niveau pour s'entretenir avec nous. Nous pouvons nous attendre à leur arrivée prochainement et devons réfléchir à l'approche que nous souhaitons adopter pour les négociations. Le président Ayub, d'origine Pathan, souhaite vivement stabiliser les liens avec l'Afghanistan et prévenir les troubles au sein de la population pakistanaise Pathan. Si un tel scénario se produisait, il pourrait s'avérer désastreux, notamment en ce qui concerne les relations avec l'Inde. Nous pouvons adopter une approche conciliante et signer des accords pour renforcer les liens et les échanges culturels. Ou nous pouvons adopter une ligne dure et appeler l'Afghanistan à accepter la ligne Durand comme frontière permanente."
 PAK_Afghan_Relations_Alt.3.d:0 "Lors des entretiens avec les Pakistanais, ils ont proposé une série de mesures, notamment des échanges culturels, destinées à améliorer les liens. L'offre pakistanaise vise sans aucun doute à normaliser les liens entre nos États. Le renforcement des liens culturels nous permettrait d'acquérir davantage d'intelligence et réduirait une partie des tensions à Kaboul. Cependant, accepter cette initiative pourrait semer la confusion chez notre propre peuple et réduire sa ferveur pour la cause du Pachtounistan. Nous devons décider quelle serait la meilleure décision."
 PAK_Afghan_Relations_Alt.4.d:0 "Lors d'une rencontre bouleversante avec les Pakistanais, ils ont exprimé leur désir que nous acceptions la ligne Durand comme frontière permanente. Comme cela va à l'encontre du pilier essentiel de notre politique étrangère, notre délégation a immédiatement refusé. Il semblait que les négociations étaient sur le point de se terminer brusquement, mais les Pakistanais ont proposé un compromis. Ils ont déclaré que si nous pouvions donner des assurances privées que nous pouvons accepter la ligne Durand, cela leur suffirait. Nous pouvons accepter ce compromis, ou le rejeter catégoriquement et mettre fin aux négociations."
 PAK_Afghan_Relations_Alt.5.d:0 "Le président Ayub a appris que le gouvernement afghan avait repoussé notre invitation à des pourparlers. Il s'agit d'une évolution inquiétante qui indique qu'ils sont déterminés à essayer de changer le statu quo. Les Afghans nourrissent sans aucun doute des desseins dangereux et nous devons rester vigilants à la frontière. Quoi qu'il en soit, l'armée insiste sur le fait que la menace afghane est minime et peut être facilement surveillée ou contenue. Le président Ayub devra reconnaître que cet effort a échoué."
 PAK_Afghan_Relations_Alt.6.d:0 "Les Afghans se sont montrés très réceptifs à nos propositions de normalisation des relations et ont accepté. Ils n'ont demandé que des ajustements mineurs destinés à améliorer les voyages des Afghans ayant des proches au Pakistan. Le président Ayub a signé les accords avec enthousiasme et a publié une déclaration célébrant ce qu'il appelle les relations fraternelles entre le Pakistan et l'Afghanistan. Le gouvernement afghan a publié sa propre déclaration, plus discrète, approuvant l'accord, affirmant qu'il contribuerait à faciliter les retrouvailles des Afghans avec leurs familles de l'autre côté de la frontière."
 PAK_Afghan_Relations_Alt.7.d:0 "La délégation afghane a déclaré qu'elle ne pouvait pas, en toute connaissance de cause, accepter nos généreuses propositions de normalisation des relations. Ils ont insisté sur le fait que tant que nous continuerions à refuser aux Pathans le droit au Pachtounistan, ils ne pourraient pas tenter de rétablir les liens. Nous les avons informés qu'il n'y avait alors plus rien à discuter. Les pourparlers se sont ainsi conclus et les Afghans sont rentrés à Kaboul. Nous avons publié une déclaration exprimant notre déception face à l'incapacité de réaliser une percée. Les Afghans ont publié leur propre déclaration nous accusant d'utiliser les pourparlers comme un moyen d'obtenir une victoire de propagande. Le président Ayub est amèrement déçu du résultat."
 PAK_Afghan_Relations_Alt.8.d:0 "La délégation afghane a réitéré que la ligne Durand n'était pas sur la table. Ils ont ajouté qu'il ne restait apparemment plus rien à discuter et ont brusquement mis fin aux pourparlers pour rentrer chez eux. Pour le président Ayub Khan, cela marque un revers majeur dans ses efforts visant à établir une frontière occidentale calme. Le gouvernement pakistanais a publié une déclaration regrettant que les négociations n'aient pas abouti à une avancée significative. Le gouvernement afghan a publié sa propre déclaration laconique accusant le Pakistan d'utiliser les pourparlers comme moyen de nier définitivement les droits du Pachtounistan au peuple pathan."
 PAK_Afghan_Relations_Alt.9.d:0 "La délégation afghane est revenue et a déclaré qu'elle était prête à donner des assurances privées concernant la ligne Durand. Ils ont déclaré qu'ils n'évoqueraient pas la ligne Durand dans un avenir proche et n'en feraient pas un point de friction majeur. Le président Ayub est très satisfait de cette évolution. La délégation afghane est rapidement rentrée à Kaboul. Le gouvernement pakistanais a publié une déclaration qualifiant les négociations de pas positif et qui, espérons-le, mèneront à un avenir de relations positives. Le gouvernement afghan a publié sa propre déclaration se disant satisfait des résultats des pourparlers."


 PAK_Dissolve_One_Unit_desc:0 "La One Unit a créé une structure gouvernementale artificielle et vaste. Cela a également effacé les identités individuelles de notre population diversifiée. Cette politique s'est révélée impopulaire, en particulier auprès des fonctionnaires qui étaient en poste dans des zones éloignées de leur domicile. Les quatre provinces d'origine du Pakistan occidental sont désormais restaurées."
 PAK_Expand_Provincial_Bureaucracy_desc:0 "Le régime précédent centralisait à l'excès le pouvoir entre les mains du président et des services fédéraux. Cette centralisation excessive a ralenti le développement et une gouvernance efficace au niveau local. Avec le rétablissement des provinces, les fonctionnaires provinciaux seront nommés en nombre beaucoup plus important."
 PAK_Reduce_Federal_Authority_desc:0 "Le gouvernement a annoncé une nouvelle initiative qui restreint la participation fédérale ou s'immisce dans les affaires provinciales des provinces. Le peuple pakistanais doit faire confiance à ses autorités locales et agir sans craindre aucune intervention fédérale."
 PAK_Launch_Anti_Pashtunistan_Campaign_desc:0 "Le gouvernement afghan plaide depuis des décennies en faveur de la formation du Pachtounistan. Ils utilisent cette cause pour susciter des troubles au sein de notre propre population pathane et pour rallier le soutien populaire en Afghanistan. En collaboration avec les autorités locales, une campagne anti-Pachtounistan sera lancée. Nous utiliserons les médias et les émissions de radio pour combattre la propagande afghane."
 PAK_Afghan_Indian_Relations_desc:0 "La présidente Fatima Jinnah a vivement critiqué Ayub Khan pour sa trop grande indulgence avec l'Inde. Elle a également accepté de permettre à l'armée de prendre l'initiative sur les questions régionales. Elle prévoit de défier diplomatiquement l'Inde et de permettre à l'armée d'adopter une ligne dure avec l'Afghanistan."
 PAK_Denounce_Indian_Stubborness_desc:0 "Lors d'une conférence de presse avec la presse internationale, la présidente Fatima Jinnah a condamné le gouvernement indien pour son refus de s'engager dans un dialogue significatif. Elle a insisté sur le fait que l'Inde reste le seul obstacle à la paix en Asie du Sud."
 PAK_Military_Insists_On_Hardline_desc:0 "L'armée pakistanaise signale que la situation sécuritaire régionale reste très tendue. Les Indiens continuent d'augmenter la présence de leurs troupes à la frontière. L'Afghanistan reste une menace puissante. Son gouvernement continue d'enflammer sa population avec son appel ridicule en faveur du Pachtounistan. Le Pakistan doit se préparer au pire."
 PAK_Express_Solidarity_With_Kashmir_At_UN_desc:0 "Le gouvernement pakistanais a lancé une grande campagne diplomatique auprès des Nations Unies. Ils soutiennent que le peuple cachemirien reste victime des jeux politiques indiens. Cet effort a trouvé le soutien des puissances sympathisantes, et le représentant permanent du Pakistan a noté que la simple sensibilisation est une victoire majeure."
 PAK_New_Afghan_Border_Posts_desc:0 "L'armée pakistanaise a annoncé la création de nouveaux postes frontières et le déploiement de davantage de forces paramilitaires patrouillant dans la zone. Les tribus transfrontalières, qui se déplacent régulièrement depuis la frontière, seront fortement limitées par ce mouvement. Le gouvernement afghan a vivement critiqué cette action."
 PAK_Adopt_Universal_Suffrage_desc:0 "Après un bref débat, l'Assemblée nationale a adopté plusieurs amendements constitutionnels instaurant le suffrage universel. L'ancien système d'élections indirectes, organisé par les démocrates de base, a été aboli. Les nouveaux amendements sont largement salués, car de nombreux Pakistanais saluent le retour aux droits démocratiques."
 PAK_Transform_To_Parliamentary_System_desc:0 "L'Assemblée nationale a finalement adopté une série d'amendements faisant du Pakistan un système parlementaire. La présidente Fatima Jinnah a salué cette nouvelle, la qualifiant de retour à la norme historique. Il s'agit d'un succès fédérateur pour la coalition au pouvoir."

 PAK_1965_Election.1.d:0 "Le gouvernement a annoncé que les élections présidentielles auraient lieu dans trois mois et qu'il y aurait un mois de campagne pour les candidats. Les 80 000 démocrates de base feront office de collège électoral pour l'élection indirecte, sélectionnant le candidat. Neuf réunions de projection doivent être organisées au cours desquelles chaque candidat pourra exposer directement sa vision du Pakistan aux électeurs. Ces réunions ne seront pas ouvertes au public ni aux médias. Le président Ayub Khan est presque assuré d'être le candidat de la Ligue musulmane de la Convention, une faction pro-Ayub du parti de la Ligue musulmane du Pakistan. Les dirigeants de l'opposition condamnent la courte période de campagne ainsi que les élections indirectes. Ils prétendent que tout favorise le président Ayub Khan. Un porte-parole du gouvernement nie cette affirmation, affirmant que ces élections représentent une nouvelle ère de démocratie pour le Pakistan."
 PAK_1965_Election.2.d:0 "Les principaux partis d'opposition ont annoncé la nomination de Fatima Jinnah à la présidence. Les cinq partis ont formé une coalition appelée Parti d'opposition combinée afin de mettre en commun leurs ressources pour détrôner le régime d'Ayub Khan. Fatima Jinnah, soeur de Mohammad Ali Jinnah, défunt fondateur du Pakistan, est très populaire parmi le peuple, affectueusement surnommée la Mère de la Nation. La nouvelle coalition a publié un programme en neuf points. Parmi ses objectifs figure la restauration de la démocratie parlementaire et du suffrage universel, ainsi que le démantèlement du système électoral indirect actuel. Fatima Jinnah a publié une déclaration appelant le peuple pakistanais à s'unir pour la démocratie et à mettre fin à la dictature d'Ayub Khan."
 PAK_1965_Election.3.d:0 "Fatima Jinnah, la soeur bien-aimée du vénéré fondateur du Pakistan Muhammad Ali Jinnah, fait campagne à travers le Pakistan pour la présidence. Elle est candidate du Parti d'opposition combinée et s'oppose au président en exercice, Ayub Khan. Les journaux publient des photos et rapportent des foules massives venues voir Jinnah. Dans ses discours, Jinnah condamne le régime d'Ayub Khan, trop indulgent avec l'Inde, laïc et antidémocratique. Elle souhaite restaurer la démocratie, mettre fin au système actuel d'élections indirectes et intégrer plus ouvertement l'islam dans l'État. Comme elle est restée largement hors de vue du public depuis le début des années 1950, de nombreux Pakistanais viennent voir sa campagne et voyager, beaucoup espérant simplement avoir un aperçu d'une femme considérée comme une grande combattante de la liberté pour l'indépendance et connue dans tout le pays sous le nom de Mader-e Millat (mère de la nation)."
 PAK_1965_Election.4.d:0 "Au cours des dernières semaines, un certain nombre de partisans du président Ayub Khan et de membres des médias ont publié des articles et des éditoriaux cinglants contre Fatima Jinnah. En outre, les autorités locales ont autorisé des partis très conservateurs à organiser des manifestations condamnant l'idée d'une femme dirigeante pour le Pakistan. Ceci malgré le fait que Jinnah bénéficie du soutien du plus grand parti religieux, le Jamaat-i-Islami. Cependant, cette campagne visant à discréditer Jinnah s'est retournée contre lui. Des intellectuels, des politiciens et des militants de tout le pays se sont ralliés à son soutien. Des foules de Pakistanais condamnent également le gouvernement pour avoir offensé la réputation d'une femme largement considérée comme la Mader-e Millat (mère de la nation). La réaction négative a un impact direct sur la popularité d'Ayub Khan."
 PAK_1965_Election.5.d:0 "La saison électorale a débuté avec quatre candidats en lice pour les 80 000 électeurs démocrates de base. Il s'agit de la première grande élection indirecte de franchise dans l'histoire du Pakistan. Le président sortant, Ayub Khan, est le grand favori, ayant établi le système électoral actuel. Les cinq principaux partis d'opposition se sont organisés au sein d'une coalition appelée Parti d'opposition combinée et ont nommé la très populaire Fatima Jinnah. Les deux autres candidats sont issus de milieux obscurs et ne devraient pas jouer un rôle majeur. Le président Ayub Khan devrait faire campagne avec pour programme la poursuite de ses réformes économiques et le rétablissement de la stabilité politique. Fatima Jinnah fera campagne sur un programme appelant au rétablissement d'un système parlementaire et d'un suffrage universel pour les futures élections."
 PAK_1965_Election.6.d:0 "Fatima Jinnah a récemment terminé une tournée de campagne dans les principales villes du Pakistan oriental et occidental. À chaque arrêt, elle rencontrait une foule massive et très enthousiaste. Les foules du Pakistan oriental étaient particulièrement enthousiastes pour la femme surnommée la Mère de la Nation. Elle a également condamné Ayub Khan pour sa position faible à l'égard de l'Inde et son soutien au peuple cachemirien. Les militants pro-Ayub ont diffusé des commentaires désobligeants à l'égard de Fatima Jinnah, mais ces efforts visant à salir son nom ont largement aliéné les Pakistanais qui respectent encore largement la soeur du bien-aimé Mohammad Ali Jinnah. Le président Ayub Khan a concentré sa campagne sur les zones rurales, où ses réformes ont connu le plus de succès. Étant donné que la plupart des 80 000 démocrates de base sont originaires de ces régions, beaucoup pensent qu'il s'agit d'une stratégie judicieuse. Malgré la démonstration de soutien populaire, Ayub Khan devrait toujours gagner."
 PAK_1965_Election.7.d:0 "Un haut fonctionnaire a contacté en privé Fatima Jinnah, lui demandant de se rendre à une réunion secrète de hauts responsables militaires et gouvernementaux. Ces fonctionnaires viennent d'horizons divers. Certains la respectent avec respect en raison de sa proximité avec Mohammad Ali Jinnah et de son rôle dans la fondation de la nation. D'autres, pragmatiques, notent qu'elle est la candidate la plus populaire mais qu'elle manque du soutien des démocrates de base. Si Jinnah accepte, elle pourrait y voir une opportunité de surmonter le système électoral actuel. Cependant, pour y parvenir, elle devra peut-être faire des compromis majeurs. Elle doit décider d'y assister ou non."
 PAK_1965_Election.8.d:0 "Sous la plus grande sécurité, de hauts responsables gouvernementaux et militaires, dont beaucoup étaient représentés par des alliés de confiance, ont rencontré Fatima Jinnah. Lors de la réunion, elle a insisté sur son engagement à restaurer la démocratie parlementaire et à mettre fin au système d'élections indirectes. Elle a également noté qu'Ayub Khan retenait la nation et faisait preuve de faiblesse envers l'Inde. Les responsables présents ont exprimé leur soutien à sa position, mais ont déclaré qu'ils ne la soutiendraient que si elle acceptait plusieurs demandes. Ils ont déclaré qu'elle devrait s'abstenir de qualifier Ayub Khan de dictateur et lui permettre de prendre une retraite paisible si elle gagne. Ils ont également exigé qu'elle maintienne les réformes économiques en cours ou qu'elle s'immisce dans les affaires militaires. L'accord devrait rester secret. Fatima Jinnah doit décider quoi faire."
 PAK_1965_Election.9.d:0 "Les médias d'État ont confirmé que Fatima Jinnah avait remporté les élections présidentielles pakistanaises de 1965. Elle a remporté la majorité du vote populaire, mais plus important encore, elle a remporté une faible majorité parmi les 80 000 démocrates de base qui élisent le président. De nombreux analystes estiment que malgré la popularité de Jinnah, elle ne parviendrait pas à obtenir le collège électoral composé principalement de représentants ruraux ayant des liens étroits avec le président sortant, Ayub Khan. Miss Jinnah a publié une déclaration remerciant les démocrates de base d'avoir soutenu les souhaits du peuple. Des millions de personnes font la fête dans les villes du Pakistan, avec la plus grande foule à Dacca. Fatima Jinnah, la soeur populaire du fondateur pakistanais Mohammad Ali Jinnah, est largement respectée. Le président Ayub Khan, qui a perdu le pouvoir à la suite d'un coup d'État, n'a publié aucune déclaration sur les résultats."
 PAK_1965_Election.10.d:0 "Le président Ayub Khan a annoncé qu'il acceptait le résultat des élections et qu'il se retirerait de la vie publique une fois que le nouveau gouvernement prendrait le pouvoir. Il a promis sa loyauté envers la nation et a affirmé espérer que le peuple reconnaîtrait son dévouement à son égard. Fatima Jinnah, la présidente élue, a félicité Ayub Khan pour avoir accepté les résultats. Lorsqu'on lui a demandé si Ayub Khan et ses alliés politiques seraient inculpés ou feraient l'objet d'une enquête pour corruption, elle a rejeté cette idée. Ses commentaires conciliants constituaient un recul majeur par rapport à certaines de ses critiques sévères antérieures à l'égard d'Ayub Khan. Malgré son visage courageux, des sources affirment qu'Ayub Khan est stupéfait par les résultats des élections. Les hauts responsables militaires ont informé leur ancien chef qu'ils soutiendraient le nouveau gouvernement, ne lui laissant d'autre choix que de prendre sa retraite."
 PAK_1965_Election.11.d:0 "Les élections présidentielles de 1965 ont eu lieu. Le peuple pakistanais doit élire 80 000 démocrates de base qui ont ensuite voté pour le président. Lorsque le décompte final a été publié, le président Ayub Khan a été déclaré vainqueur, avec plus de soixante pour cent des voix. Sa victoire était considérée comme une fatalité puisque la plupart des démocrates de base étaient ses nommés. Cependant, les analystes étaient encore surpris du nombre de voix que Fatima Jinnah a finalement obtenues. La réaction de nombreux Pakistanais a été décevante, car beaucoup pensaient qu'elle bénéficiait du soutien du peuple. De nombreuses personnes dans le pays considèrent désormais la constitution mise en place par Ayub Khan comme truquée pour le maintenir au pouvoir et des appels se font désormais entendre en faveur de réformes plus démocratiques, notamment au Pakistan oriental, où Fatima Jinnah était particulièrement populaire."
 
 Jinnah_President.1.d:0 "Le gouvernement pakistanais a publié une déclaration encourageant les provinces à sélectionner des vacances culturelles pertinentes pour les communautés locales. Il s'agit d'un pas en arrière par rapport au passé où le gouvernement fédéral cherchait à imposer une identité nationale plus unifiée aux dépens des traditions ethniques ou des personnages historiques. Le gouvernement du Pakistan oriental a accueilli favorablement la nouvelle, promettant d'organiser des vacances pour les grands héros littéraires bengalis. Le NWFP a publié sa propre déclaration, appelant à une semaine de la langue pachtoune pour défendre les grands poètes de la frontière. Cette décision s'inscrit dans un effort visant à trouver un équilibre entre le gouvernement fédéral et les provinces."
 Jinnah_President.2.d:0 "La présidente Fatima Jinnah a convoqué une session extraordinaire de l'Assemblée nationale. Dans son discours, elle a appelé ses membres à travailler avec diligence pour réformer la constitution. Elle a appelé à une démocratie équilibrée qui assure la stabilité et donne le pouvoir au peuple. Jinnah dirige une coalition de différents partis. Malgré leurs idéologies différentes, la coalition est unie dans sa vision de détruire la démocratie d'Ayub Khan. Jinnah a habilement maintenu ces partis unis grâce à ses capacités et à son statut de soeur du défunt fondateur pakistanais Mohammad Ali Jinnah."
 Jinnah_President.3.d:0 "Lors de la dernière séance de la session extraordinaire de l'Assemblée nationale, une série d'amendements ont été adoptés réduisant les pouvoirs présidentiels. Sous le président Ayub Khan, il avait donné au président des pouvoirs étendus. La présidente Fatima Jinnah réclamait depuis longtemps des réformes. Elle pensait que le Pakistan était depuis longtemps en proie à un pouvoir exécutif trop puissant. Dans le cadre des réformes, le Président conserve ses pouvoirs, mais ne peut plus agir en toute impunité. La décision est saluée dans tous les cercles politiques. Pour la première fois, il semble que le Pakistan ait équilibré ses institutions politiques."
 Jinnah_President.4.d:0 "Après une longue réunion du cabinet, la présidente Fatima Jinnah a annoncé le boycott des produits indiens. Elle a déclaré que la décision reflétait les sentiments de la population. Si le gouvernement indien maintient son hostilité envers le Pakistan, il n'y a aucune raison de s'engager dans des échanges commerciaux. Le président a fait campagne en faveur du maintien d'une ligne dure à l'égard du gouvernement indien. L'armée pakistanaise serait ravie de cette décision. L'embargo est largement soutenu par la plupart des milieux du pays. Cependant, certains critiques soulignent que cette décision ne fait que nuire à l'économie. À l'échelle internationale, de nombreux États ont exprimé leur inquiétude face à l'escalade des tensions."
 Jinnah_President.5.d:0 "La présidente Fatima Jinnah a terminé une récente session de l'Assemblée nationale. Depuis qu'elle a pris la présidence, elle a renversé le pouvoir présidentiel et rétabli un système de gouvernement parlementaire. Tirant les leçons de ses erreurs passées, elle a cherché à réduire les pouvoirs présidentiels pour créer un pouvoir exécutif équilibré. Malgré ses réformes et ses amendements à la constitution, sa coalition semble de plus en plus divisée. De nombreux experts politiques estiment que seuls sa personnalité et son prestige maintiennent le gouvernement actuel au pouvoir. Quoi qu'il en soit, elle a réalisé sa vision et tous les Pakistanais peuvent désormais bénéficier de tous les privilèges de vote pour les prochaines élections."
 Jinnah_President.6.d:0 "La nation a été stupéfaite d'apprendre que la présidente Fatima Jinnah est décédée du jour au lendemain d'une insuffisance cardiaque. Bien qu'elle ait été transportée d'urgence à l'hôpital, elle a été déclarée morte à son arrivée. Au cours de son bref mandat, elle a transformé le Pakistan en modifiant la constitution pour garantir le suffrage universel et une démocratie parlementaire plus équilibrée. De nouvelles élections devraient être annoncées prochainement. La coalition au pouvoir rassemblait une myriade de partis aux idéologies très différentes, la réputation de Jinnah et sa mission visant à destituer Ayub Khan l'ont gardée intacte. On se souviendra également d'elle comme de la première femme à diriger un État à majorité musulmane. Des funérailles nationales massives sont prévues à Karachi. Elle devrait être enterrée à côté de son frère au Mazar-e-Quaid."

 PAK_MAAG.1.d:0 "Avec l'achèvement de la première phase du MAAG, nombreux sont les militaires qui souhaitent se rapprocher des Américains pour entamer immédiatement la phase suivante avec de nouvelles armes afin de moderniser l'armée. L'armée souhaite développer ses forces blindées tandis que l'armée de l'air a exprimé son intérêt pour l'acquisition de chasseurs plus avancés en provenance des États-Unis. La Marine souhaite garantir à sa flotte un nouveau sous-marin plus moderne. Toutefois, pour approcher les Américains, il faudra peut-être que nous soyons plus étroitement liés à leurs intérêts. Il serait peut-être préférable de moderniser nos forces par nos propres efforts pour conserver notre indépendance."
 PAK_MAAG.2.d:0 "Les Pakistanais ont demandé davantage d'aide militaire pour moderniser leurs forces à travers une nouvelle phase du MAAG. La première phase a été un succès et nos officiers sur le terrain ont envoyé des rapports élogieux concernant l'armée pakistanaise. Cependant, des doutes existaient et demeurent quant à la capacité économique du Pakistan à maintenir une armée importante. En outre, nombreux sont ceux qui soupçonnent que ces équipements militaires ne visent pas avant tout à dissuader le communisme, mais à affronter leur rivale, l'Inde. L'Inde est également très sensible à nos relations militaires avec le Pakistan et un nouvel effort visant à fournir des armes ne sera pas bien accueilli. Si nous décidons de fournir l'équipement qu'ils désirent, nous devons exiger du Pakistan qu'il dénonce l'Union soviétique et la Chine communiste et qu'il nous fournisse des bases militaires pour démontrer sa sincérité. Ou nous pouvons préserver nos liens avec l'Inde et décliner poliment leur demande."
 PAK_MAAG.3.d:0 "Les Américains ont accepté d'étendre le soutien du MAAG à une division d'infanterie, une division blindée et une brigade mécanisée supplémentaires, ainsi qu'à l'artillerie. Pour l'Armée de l'Air, ils fourniront des chasseurs plus avancés et élargiront nos bombardiers. La marine recevrait également un nouveau sous-marin. En échange, ils nous ont demandé de réduire considérablement nos liens avec la Chine et l'Union soviétique. Ils cherchent également à avoir des bases dans notre pays. Un tel accord nous fournira beaucoup d'équipements mais affectera gravement notre politique étrangère et entraînera probablement des troubles intérieurs à propos de l'accord. Certains ministres nous exhortent à rejeter poliment cette offre et à poursuivre un programme de défense et de politique étrangère plus indépendant."
 PAK_MAAG.4.d:0 "La nouvelle de notre récent accord avec les États-Unis a suscité de vives réactions négatives dans tout le pays. Les groupes de gauche, anticoloniaux et religieux ont rassemblé leurs partisans pour protester dans toutes les grandes villes. Le gouvernement est condamné pour avoir vendu le pays. L'Inde a largement dénoncé l'accord, accusant l'Amérique d'alimenter la course aux armements en Asie du Sud. Malgré les vives protestations, les États-Unis et le gouvernement pakistanais ont salué l'accord comme étant vital pour préserver le Pakistan et mettre fin au communisme dans la région."
 PAK_MAAG.5.d:0 "Le gouvernement a été informé que les militaires avaient pris possession de toutes les armes et systèmes promis par les Américains. L'armée a également déclaré qu'elle ne prévoyait pas de problèmes majeurs concernant l'utilisation des systèmes d'armes par ses forces, car les entraîneurs américains lui avaient apporté une aide considérable à cet égard. Le gouvernement a exprimé sa satisfaction à l'égard du rapport et a félicité l'armée pour ses efforts visant à garantir que la nation maintienne une nation forte et robuste, capable de contrecarrer tout plan ou aventure hostile."
 Ayub.1.d:0 "Le directeur de l'ISI, la première agence de renseignement du pays, a rencontré le président Ayub Khan. Le président Ayub Khan se réunissait pour discuter de la possibilité de mobiliser des services de renseignement pour surveiller la politique intérieure et les menaces potentielles contre son régime. Le gouvernement actuel est essentiel pour sauver le Pakistan de l'agression étrangère et de la corruption qui a sévi dans les premières années du pays. Le directeur a déclaré que l'agence pourrait certainement aider le gouvernement, mais que cela compromettrait sa capacité à surveiller les menaces étrangères. Il faut décider si l'ISI doit sacrifier ses capacités de renseignement étranger et travailler à renforcer le régime ou rester en dehors de la politique."
 Ayub.2.d:0 "Peu de temps après son arrivée au pouvoir, le président Ayub Khan a nommé l'ancien juge en chef Shahabuddin pour présider une commission chargée de proposer un cadre constitutionnel qui éviterait l'instabilité politique et la corruption de l'ancien régime. Le rapport a été publié et proposait un système de gouvernement présidentiel plutôt que parlementaire. Le nouveau système serait bicaméral avec une chambre haute censée contrôler la chambre basse. Le président jouirait de puissants pouvoirs exécutifs, notamment en matière de nomination des gouverneurs. La commission a recommandé le retour des partis politiques et tous les élus doivent satisfaire aux exigences en matière d'éducation. Les élections seraient basées sur le suffrage universel. Le président Ayub pourrait accepter le rapport tel quel afin d'élaborer une constitution démocratique, mais ses conseillers lui suggèrent de proposer des révisions qui renforceraient les pouvoirs présidentiels, préserveraient son système électoral des démocrates de base et maintiendraient l'interdiction des partis politiques. Ayub est enclin à proposer des révisions et à établir une constitution plus présidentielle."
 Pak_Econ60s.1.d:0 "Alors que nous parcourons l'ambitieux plan quinquennal, la question de l'obtention de financements s'est posée. Nous maximiserons certainement les possibilités de lever des fonds au niveau national, mais nous sommes une nation jeune et pauvre et pour la transformer, nous avons besoin d'accéder à des financements plus élevés. Les États-Unis ont exprimé leur volonté d'offrir une aide financière et de faciliter l'accès à l'aide internationale de leurs alliés. Le gouvernement est enclin à maximiser cette aide financière pour véritablement transformer la nation en cette période critique. Cependant, plusieurs ministres ont exprimé leur inquiétude quant au fait que le recours à de tels fonds pourrait rendre le Pakistan financièrement vulnérable et, même si cela pourrait ralentir la croissance potentielle, le recours à une aide modérée pourrait être la décision la plus prudente à prendre. Nous devons décider s'il faut maximiser l'aide américaine ou demander une aide modérée pour combler certaines lacunes dans nos efforts de financement."
 Pak_Econ60s.2.d:0 "Le plan quinquennal a connu un énorme succès, en grande partie grâce à notre capacité à mobiliser une aide financière et des prêts amicaux. Toutefois, ces paiements ont atteint un niveau critique. Le gouvernement doit désormais consacrer une part substantielle du budget pour faire face à ces obligations. Les développements économiques stimulés par ces fonds n'ont pas encore atteint un niveau permettant de faciliter la croissance continue du pays et ses engagements de paiement. En conséquence, les objectifs économiques pour les années à venir doivent être réajustés à cette situation financière difficile."
 Pak_Econ60s.3.d:0 "Le plan quinquennal a connu un énorme succès, en grande partie grâce à notre capacité à mobiliser une aide financière et des prêts amicaux. Toutefois, ces paiements ont atteint un niveau critique. Le gouvernement doit désormais consacrer une part substantielle du budget pour faire face à ces obligations. Les développements économiques stimulés par ces fonds n'ont pas encore atteint un niveau permettant de faciliter la croissance continue du pays et ses engagements de paiement. Heureusement, les engagements ne sont pas massifs et le ministre des Finances insiste sur le fait que le pays résoudra bientôt la crise et reviendra à ses objectifs économiques. En conséquence, les objectifs économiques pour les années à venir doivent être réajustés à cette situation financière difficile."
 PAK_Land_Reform.1.d:0 "L'une des premières actions du gouvernement d'Ayub Khan a été de s'attaquer au système féodal qui a longtemps dominé le secteur agricole et causé des difficultés extrêmes aux paysans travaillant la terre. Des réformes ont été apportées pour limiter la superficie maximale de terres possédées par un individu et garantir certains droits fondamentaux aux paysans. Bien que beaucoup pensent que ces réformes comportent trop de failles pour être transformatrices, les nouvelles exigences en matière de propriété foncière ont vu le gouvernement saisir des millions d'acres de terres improductives. Ces terres peuvent être utilisées pour renforcer la production agricole et l'économie. Un conseiller principal a noté que même si les terres pouvaient être distribuées aux paysans productifs, ces terres pourraient également être données sous forme de subventions de retraite pour les officiers subalternes de l'armée. Cela récompenserait leurs services rendus à l'État et renforcerait leur loyauté envers Ayub Khan. Le gouvernement doit décider si les terres doivent revenir aux paysans ou aux officiers."
 PAK_Land_Reform.2.d:0 "Le gouvernement a annoncé qu'il distribuait actuellement des parcelles de terres improductives sous sa direction aux paysans du Pakistan. Le gouvernement a souligné que le système d'agriculture féodale pesait depuis longtemps sur la productivité agricole au Pakistan, mais que cela était en train d'être corrigé. Le gouvernement a exprimé son choc face à la quantité de terres viables inutilisées dans le pays. La presse et le public ont largement accueilli favorablement les nouvelles du gouvernement. Cette mesure populaire aidera Ayub Khan à se faire aimer de la population, mais l'élite rurale traditionnelle serait en ébullition face à ces mesures, qu'elle considère comme une humiliation à son encontre."
 PAK_Land_Reform.3.d:0 "Le gouvernement a annoncé qu'il morcellerait les terres improductives sous sa direction en guise de récompenses de retraite pour les officiers de l'armée, de l'air et de la marine pakistanaises. Le gouvernement a noté qu'en tant que nation pauvre, les officiers pakistanais sacrifiaient leurs opportunités financières et matérielles au service de la nation. Cette terre constituerait une récompense modeste mais juste pour leur service, car les militaires possédaient la discipline et le patriotisme nécessaires pour garantir que ces terres ne seraient pas gaspillées comme auparavant. Cette action est bien accueillie par la presse contrôlée par le gouvernement et par le corps des officiers. Ayub Khan peut certainement compter sur ses officiers dans un avenir prévisible."
 PAK_Financial.1.d:0 "Le comité de planification du plan quinquennal et le ministre des Finances ont contacté le président Ayub Khan pour discuter des options visant à accroître les flux de liquidités et de capitaux privés. Il existe une proposition de nouvelle législation sur l'industrie qui supprimerait en grande partie les réglementations et pratiques financières afin d'encourager l'expansion de l'industrie et de favoriser une croissance maximale. Certains membres du Comité mettent cependant en garde contre cette déréglementation, avertissant qu'elle pourrait entraîner davantage de problèmes budgétaires à long terme. Au lieu de cela, ils croient que certains éléments dépassés et économiquement conservateurs peuvent être réformés ou supprimés pour encourager une croissance modeste."
 PAK_Financial.2.d:0 "Le gouvernement a annoncé un assouplissement sans précédent des réglementations, notamment celles liées à l'industrie. Cette nouvelle politique vise à contribuer à alimenter une croissance économique rapide pour le Pakistan et sa base industrielle. Parallèlement à cette réforme, le gouvernement a annoncé son intention d'adopter une série de lois axées sur le renforcement et la rationalisation du financement des projets industriels. Le ministre des Finances a appelé les investisseurs internationaux et les entreprises locales à profiter de l'atmosphère d'affaires conviviale qui règne au Pakistan. Il a insisté sur le fait que les inquiétudes concernant les droits des travailleurs ou les effets à long terme de ces actions sont grandement exagérées et que ces politiques sont désormais essentielles à la prospérité du Pakistan."
 PAK_Financial.3.d:0 "Le ministère des Finances a publié une déclaration décrivant une série de réformes destinées à réduire les réglementations et les obstacles à la croissance dans le secteur industriel de l'économie. Le communiqué souligne que cela ne sera pas gratuit pour tous et que des efforts ont été déployés pour préserver certaines protections contre les dépenses excessives ou contre les engagements excessifs des organisations. Le gouvernement a ensuite publié ses propres commentaires et appelé toutes les parties intéressées à profiter de l'atmosphère d'affaires amicale et du grand potentiel du Pakistan et de sa population."
 PAK_Financial.4.d:0 "Les politiques de déréglementation destinées à stimuler l'expansion industrielle et la croissance économique ont conduit les entreprises à s'endetter lourdement, ce qui a considérablement entravé la croissance économique. La réduction des protections, en particulier pour les travailleurs, a également entraîné un déclin économique au sein de ces populations, ralentissant encore davantage l'économie et nuisant à l'efficacité. La diminution des coffres de l'État signifie que leur capacité à stimuler la croissance et à maintenir les flux de trésorerie s'est considérablement réduite. Le ministre des Finances a annoncé des chiffres révisés pour la croissance industrielle et a rétabli certaines réglementations afin de freiner le ralentissement économique."
 PAK_Financial.5.d:0 "Les politiques de déréglementation destinées à stimuler l'expansion industrielle et la croissance économique ont conduit les entreprises à s'endetter lourdement, entravant ainsi la croissance économique. La réduction des protections, en particulier pour les travailleurs, a réduit leurs revenus salariaux et a alimenté les performances médiocres des industries et des entreprises locales. La diminution des coffres de l'État signifie que leur capacité à stimuler la croissance et à maintenir les flux de trésorerie s'est considérablement réduite. Le ministre des Finances a annoncé des chiffres révisés pour la croissance industrielle et a rétabli certaines réglementations afin de freiner le ralentissement économique. Cependant, le ministère a indiqué qu'il pensait que ce ralentissement serait temporaire et qu'il espérait que l'économie se redresserait bientôt."

 Bengal_Issue_Ayub.1.d:0 "Les Bengalis du Pakistan oriental ont longtemps été soupçonnés d'être des citoyens de seconde zone ou d'être négligés par le gouvernement fédéral. Ceci malgré leur grande population, leur rôle économique énorme et leur dévouement historique au Mouvement pakistanais. Lorsque la guerre a éclaté au Cachemire, des rumeurs se sont répandues selon lesquelles le Pakistan occidental avait abandonné le Pakistan oriental. Malheureusement, le conflit qui en a résulté a semblé confirmer ces soupçons. L'absence de formations militaires majeures dans la province et la réaction apparemment terne des autorités en matière d'installation d'abris anti-aériens ou de systèmes d'alerte ont alimenté un sentiment d'abandon. Nos forces et nos responsables ont agi aussi efficacement qu'ils le pouvaient, mais malheureusement la population du Pakistan oriental n'a pas apprécié cela."
 Bengal_Issue_Ayub.2.d:0 "Les Bengalis du Pakistan oriental ont longtemps été soupçonnés d'être des citoyens de seconde zone ou d'être négligés par le gouvernement fédéral. Ceci malgré leur grande population, leur rôle économique énorme et leur dévouement historique au Mouvement pakistanais. Beaucoup se sont opposés à la prise de pouvoir militaire par Ayub Khan et cette opposition s'est intensifiée lorsqu'il a dévoilé son système démocrate de base. Pour de nombreux Pakistanais de l'Est, Ayub Khan a mis en place un système destiné à refuser aux Pakistanais de l'Est la représentation proportionnelle et à limiter leurs aspirations politiques. Des foules de Bengalis, notamment des étudiants, manifestent régulièrement pour une gouvernance démocratique."
 Agartala_Conspiracy.1.d:0 "Depuis que Cheikh Mujibur Rahman a publié ses dangereux Six Points, il a provoqué des troubles massifs parmi les Bengalis à travers le Pakistan oriental. Les Bengalis sont de plus en plus attirés par une voie anti-étatique et le statu quo ne semble pas être une solution pour le moment. La question est de savoir comment aborder ce problème difficile sans causer davantage de problèmes ni alimenter les tendances séparatistes parmi les Bengalis. Une approche consiste à discréditer Rahman et sa Ligue Awami. Nos agences de renseignement ont découvert un complot impliquant des séparatistes et le gouvernement indien. Poursuivre publiquement cette affaire exposerait la Ligue Awami comme les traîtres que nous connaissons. De nombreux conseillers soutiennent cette approche. L'autre option consiste à réduire les restrictions sur les manifestations publiques. Ce serait une concession qui nous permettrait d'inviter la Ligue Awami à des discussions de haut niveau sur l'avenir du Pakistan oriental. Nous devrons probablement faire des compromis, mais avancer rapidement dans cette direction pourrait réduire la possibilité d'une résistance armée."
 Agartala_Conspiracy.2.d:0 "Après une enquête approfondie, l'ISI a informé le gouvernement d'un vaste complot découvert au Pakistan oriental. Selon leurs agents, des membres dirigeants de la Ligue Awami, ainsi que des officiers militaires et des fonctionnaires bengalis, ont conspiré pour organiser un soulèvement armé en faveur d'un État séparé. De nombreux conspirateurs clés, y compris les principaux collaborateurs du Cheikh Mujibur Rahman, tenaient ces pourparlers dans la ville indienne d'Agartala, souvent avec des responsables des services de renseignement et de l'armée indiens, afin d'obtenir leur soutien au soulèvement. Notre agent de renseignement a, à un moment donné, essuyé des tirs de certains conspirateurs, mais il a quand même réussi à apporter l'information. Le gouvernement émettra bientôt des mandats d'arrêt et annoncera les charges retenues contre les accusés."
 Agartala_Conspiracy.3.d:0 "La nation pakistanaise a été stupéfaite ce matin par les informations selon lesquelles des officiers militaires, des fonctionnaires et des membres de la Ligue Awami, dont le chef du parti, Cheikh Mujibur Rahman, auraient été arrêtés. Ils sont accusés par le gouvernement d'avoir conspiré avec l'Inde en vue de lancer une insurrection contre l'État du Pakistan. La déclaration du gouvernement suggère que les efforts récents de la Ligue Awami pour exiger plus d'autonomie n'étaient qu'un stratagème mis en place sous la direction indienne pour affaiblir le Pakistan. Le président Ayub Khan, dans sa propre déclaration, a appelé à un procès rapide pour révéler la vérité sur cette conspiration maléfique. Cheikh Mujibur Rahman a nié dans sa déclaration ces accusations, les qualifiant de fabriquées et de tentative désespérée de faire taire la voix de la majorité bengali."
 Agartala_Conspiracy.4.d:0 "Le procès tant attendu de Cheikh Mujibur Rahman et de ses conspirateurs présumés a débuté aujourd'hui. Le tribunal est un tribunal dirigé par trois juges, l'un non bengali et les deux autres bengalis. Ils doivent entendre des preuves selon lesquelles les accusés ont fomenté un soulèvement armé contre le Pakistan avec l'aide d'une puissance étrangère, l'Inde. L'affaire verra plus de 200 témoins ainsi que des preuves à l'appui d'une longue liste d'accusations. Cependant, cette affaire suscite une colère généralisée au Pakistan oriental. Beaucoup accusent le gouvernement d'avoir fabriqué de toutes pièces ces accusations dans le cadre d'un complot contre l'autonomie du Pakistan oriental. Ces affirmations ont été alimentées par les révélations d'un avocat britannique aidant l'accusé selon lesquelles certains des témoins ont admis avoir été contraints de témoigner. De grandes manifestations ont lieu quotidiennement, appelant au classement sans suite de cette affaire."
 Agartala_Conspiracy.5.d:0 "Le procès du complot d'Agartala continue d'aliéner et de susciter des protestations parmi les Bengalis du Pakistan oriental. Alors que le procès se poursuit, de plus en plus de Bengalis considèrent les accusations comme farfelues et comme un complot destiné à faire taire le populaire Cheikh Mujubur Rahman. Récemment, des étudiants, notamment de l'université de Dacca, ont commencé à se joindre aux manifestations. Cette agitation continue d'avoir un impact négatif sur l'économie et le fonctionnement de l'État. Le gouvernement reste toutefois provocateur et affirme qu'il ne cessera pas sa quête de justice. Cependant, il continue de faire face à des accusations selon lesquelles des témoins ont été contraints et des documents ont été falsifiés."
 Agartala_Conspiracy.6.d:0 "Les manifestants bengalis qui militent pour l'abandon des accusations portées contre les personnes accusées dans le procès du complot d'Agartala ont formé un comité d'action. Le Comité d'action, dirigé par des militants de la Ligue Awami, prévoit d'organiser des manifestations, des grèves et des agitations afin de maximiser l'impact contre le gouvernement. Le président Ayub Khan avait espéré que cette affaire montrerait à la population du Pakistan oriental le danger que représente Cheikh Mujibur Rahman et le dénoncerait comme séparatiste. Cependant, il semble que cet effort se soit retourné contre lui. Même les militants pro-démocratie du Pakistan occidental commencent à exprimer leur soutien à Sheikh Mujibur Rahman alors que l'affaire se transforme en une cause anti-Ayub."
 Agartala_Conspiracy.7.d:0 "Dacca a été plongée dans la violence suite à l'annonce selon laquelle le sergent Zahurul Haq, l'un des accusés dans l'affaire du complot d'Agartala, avait été abattu par un garde. Bien qu'il ait été transporté d'urgence à l'hôpital militaire local, Haq a succombé à ses blessures. On ne sait pas exactement ce qui a conduit à la fusillade, mais la nouvelle de cette fusillade a poussé des foules massives à déclencher des incendies dans les bâtiments gouvernementaux et à la State House où l'affaire est entendue. Les trois juges du tribunal ont réussi à s'échapper, mais les attaques qui ont suivi ont donné lieu à des incendies généralisés qui ont brûlé les preuves et les documents liés à l'affaire. Le lendemain matin, des foules massives sont retournées à Dacca pour condamner le meurtre et accuser le gouvernement d'avoir tenté d'assassiner les accusés alors que le procès était au point mort."
 Agartala_Conspiracy.8.d:0 "Le président Ayub Khan a ordonné au gouvernement de retirer l'affaire du complot d'Agartala et de rejeter les accusations portées contre les accusés. Dans un communiqué, le gouvernement a insisté sur le fait qu'il disposait des preuves nécessaires pour condamner l'accusé, mais les circonstances sur le terrain et l'instabilité ont rendu le procès intenable. Après sa sortie de prison, Cheikh Mujibur Rahman et les autres accusés se sont rendus à une réception publique massive dans un hippodrome de Dacca. Il a été accueilli par des foules en liesse qui ont scandé son nouveau titre parmi le peuple, l'Ami du Bengale. Dans ses commentaires, Rahman a insisté sur le fait que les Six Points n'étaient ni séparatistes ni anti-Pakistan et a exprimé son appréciation pour le peuple qui a empêché un dictateur d'effacer l'opposition et la voix du peuple. De nombreux Bengalis considèrent cet épisode comme une grande victoire, et beaucoup au Pakistan oriental soutiennent désormais fermement la Ligue Awami, faisant de ce procès une erreur majeure de la part d'Ayub Khan."
 Awami_League_Round_Table.1.d:0 "Suite à la décision du gouvernement de lever les restrictions sur les manifestations, la Ligue Awami et son chef Cheikh Mujibur Rahman ont accepté de s'entretenir avec le président Ayub Khan sur les Six Points. Mujibur Raham a publié plus tôt les Six Points comme base des relations entre le Pakistan oriental et le Pakistan occidental. Les critiques notent que les Six Points séparent presque toutes les institutions du pays et laisseraient le Pakistan oriental pratiquement indépendant. Cependant, les partisans des Six Points affirment que leur mise en oeuvre mettrait un terme aux tensions entre les deux ailes et permettrait aux deux de grandir ensemble plutôt qu'aux dépens l'une de l'autre. Les négociations s'annoncent longues et difficiles, mais de nombreuses personnes à travers le pays considéreraient cette récente initiative gouvernementale comme une étape positive."
 Awami_League_Round_Table.2.d:0 "Au cours de la phase initiale des discussions, le gouvernement et la Ligue Awami ont exposé leurs positions de négociation. Cependant, il est devenu clair que Cheikh Mujibur Rahman ne semble pas disposé à faire de compromis sur ses très populaires Six Points et a appelé le gouvernement à les adopter pour le Pakistan oriental. Il a déclaré que c'était la seule voie permettant d'assurer la paix et l'unité pour l'ensemble du Pakistan. Le côté gouvernemental serait agacé par cette posture. Cependant, certains des conseillers d'Ayub Khan suggèrent qu'il peut offrir une plus grande autonomie au Pakistan oriental, en adoptant essentiellement plusieurs des six points, mais en ne cédant pas sur l'octroi au Pakistan oriental d'une économie indépendante ou d'une force de défense complètement indépendante. L'autre option serait de se retirer des pourparlers, ce qui serait perçu comme populaire par les Pakistanais occidentaux mais ne parviendrait pas à résoudre les tensions au Pakistan oriental."
 Awami_League_Round_Table.3.d:0 "Le président Ayub Khan a soigneusement présenté une proposition à Cheikh Mujibur Rahman sur le statut futur du Pakistan oriental. Il s'est dit reconnaissant du fait que de nombreux habitants de la province souhaitent un changement majeur dans les relations entre les deux ailes. Cependant, a-t-il déclaré, les Six Points ne constituent pas une solution réalisable. Au lieu de cela, il a proposé d'accorder au Pakistan oriental une large autonomie, lui donnant le contrôle de ses fonds de développement, de sa fiscalité et de sa politique intérieure. Cependant, il ne pouvait garantir une économie totalement indépendante ni une force de défense indépendante. Bien qu'il ait offert des concessions sur les deux, notamment en donnant le contrôle des East Pakistan Rifles à la législature du Pakistan oriental. Pour Cheikh Mujibur Rahman, cela lui accorderait bon nombre des six points et atteindrait son objectif d'autonomie. Lui et ses principaux partisans sont enclins à accepter le compromis. Cependant, certains partisans de la ligne dure du parti insistent sur leur attachement aux Six Points et rejettent la proposition."
 Awami_League_Round_Table.4.d:0 "Le président Ayub Khan a brusquement mis fin aux négociations de la table ronde et est retourné au Pakistan occidental. Il a déclaré que son gouvernement cherchait à discuter sérieusement des questions en suspens avec la Ligue Awami, mais que le groupe s'était montré peu disposé à négocier pour le bien-être du peuple pakistanais. De nombreux éditoriaux au Pakistan occidental se sont prononcés en faveur du président, affirmant qu'il avait pris la bonne décision et dénonçait Cheikh Mujibur Rahman comme un homme politique malhonnête qui nourrissait des desseins dangereux pour l'avenir du Pakistan. Au Pakistan oriental, la Ligue Awami a reproché au gouvernement d'agir de manière imprudente et d'utiliser les négociations comme un moyen de marquer des points politiques auprès de sa base. Bien qu'ils aient reçu le soutien des journaux pro-démocratie, ils ont également été critiqués, notamment de la part des autres grands partis du Pakistan oriental qui ont accusé la Ligue Awami de promouvoir un programme radical contre la volonté de nombreux Bengalis et Biharis vivant au Pakistan oriental."
 Awami_League_Round_Table.5.d:0 "Cheikh Mujibur Rahman, chef de la Ligue Awami, a déclaré au gouvernement qu'il acceptait leur compromis. Il a personnellement déclaré au président Ayub Khan que le peuple bengali n'oublierait pas sa décision d'écouter ses désirs. Le président a rendu la pareille à ces paroles aimables et a exprimé son espoir que le nouvel accord annoncerait une nouvelle ère pour le Pakistan. Il a été décidé qu'aucun accord formel ne serait signé et, une fois que le Président en aurait informé les hauts responsables du gouvernement, un accord final pourrait être conclu. D'ici là, les deux parties ont convenu de ne pas révéler les détails ou l'accord préliminaire conclu, car ceux-ci pourraient être modifiés. À la fin des pourparlers, les deux parties ont publié une déclaration soulignant que de grands progrès avaient été réalisés et que de futurs pourparlers étaient probables. Les analystes ont noté que ni les publications pro-gouvernementales ni celles pro-Awami League ne cherchaient à critiquer l'autre camp et que, alors que le président Ayub Khan retournait au Pakistan, un sentiment d'optimisme prévalait."
 Awami_League_Round_Table.6.d:0 "Cheikh Mujibur Rahman, le leader de la Ligue Awami, a rejeté la proposition du gouvernement d'offrir une plus grande autonomie au Pakistan oriental. Le président Ayub Khan a estimé que l'offre était juste car elle répondait à la plupart des six points, mais la Ligue Awami a toujours refusé. Les pourparlers se sont rapidement terminés par la suite et les deux parties ont publié des déclarations laconiques. Le gouvernement a accusé la Ligue Awami de négocier de manière malhonnête et de rejeter des offres raisonnables. La Ligue Awami a déclaré qu'elle ne ferait aucun compromis sur la dignité du peuple du Pakistan oriental. À l'échelle nationale, les partisans du gouvernement étaient satisfaits de ses actions. Même si les partisans de la Ligue Awami sont satisfaits, leur ligne dure a aliéné ceux qui étaient sur la barrière."
 Awami_League_Round_Table.7.d:0 "Chose étonnante, l'accord attendu entre le gouvernement et la Ligue Awami n'a pas abouti. La Ligue Awami affirme que le gouvernement a cherché à modifier les conditions convenues et qu'il n'a pas pu les accepter. À l'échelle nationale, l'échec du gouvernement à conclure un accord suscite une grande déception. Le président Ayub Khan reste silencieux face à cet échec, mais les analystes soupçonnent que l'armée pakistanaise s'est probablement prononcée contre l'accord proposé. Sans le soutien de l'armée, le gouvernement n'avait d'autre choix que de laisser l'accord échouer. Les deux camps étant restés sur leurs positions, il y a peu d'espoir pour l'avenir."
 PAK_1965_Economy.1.d:0 "En réponse à une série d'informations médiatiques sur la corruption dans le pays, notamment des accusations contre des membres de la famille du président Ayub, le gouvernement a publié ses propres rapports sur la corruption. Le gouvernement a identifié les principaux dirigeants de la formation au marché noir et les familles possédant des richesses et des terres excessives. Le gouvernement a promis de sévir contre ces problèmes afin de faire baisser les prix des biens et de forcer ces familles à payer leur part d'impôts à l'État. De nombreux citoyens ont salué cette nouvelle initiative."
 PAK_1965_Economy.3.d:0 "L'économie souffre actuellement d'un ralentissement, principalement dû à l'endettement croissant du gouvernement et aux dépenses excessives des banques. Le ministre des Finances s'inquiète du fait que le taux d'intérêt actuel soit trop bas et que nous devrions l'augmenter afin de contrôler le potentiel d'une crise des paiements. Certains conseillers craignent que l'augmentation des taux d'intérêt n'aliène les intérêts des entreprises et nuise à la croissance, mais le gouvernement doit parfois prendre des décisions difficiles. Le choix de la manière d'agir appartient au Président."
 PAK_1965_Economy.4.d:0 "De nombreuses banques à travers le Pakistan signalent qu'elles manquent dangereusement de fonds et ont du mal à récupérer le crédit qu'elles ont accordé. Cela est dû en grande partie aux encouragements du gouvernement en matière de financement et aux taux d'intérêt actuels. Les banques seront beaucoup plus réticentes à accorder des financements et auront besoin de temps pour reconstituer leurs actifs. C'est un coup dur pour la santé économique du pays, mais nous persévérerons et prospérerons."
 PAK_1965_Economy.5.d:0 "Le gouvernement pakistanais a récemment envoyé une délégation de hauts responsables économiques pour discuter de la poursuite du financement de ses programmes économiques. Les Pakistanais ont noté que l'aide américaine pour obtenir des financements étrangers avait grandement aidé le gouvernement dans son dernier plan économique. Ils ont noté que pour que le Pakistan puisse enfin franchir le cap économique, il a besoin de davantage de soutien. Nous devons décider si nous voulons continuer à soutenir l'économie pakistanaise. Cela améliorerait les relations et nous donnerait plus de poids auprès d'eux. Cependant, d'autres estiment que trop de financement rendra le Pakistan dépendant d'un tel soutien et nuira à son économie à long terme. Nous devons décider quoi faire."
 PAK_1965_Economy.6.d:0 "Nous avons reçu d'excellentes nouvelles de Washington. Les États-Unis ont accepté de continuer à soutenir notre économie par le biais d'une aide économique et de prêts. Ils nous aideront également à obtenir des financements auprès d'autres États amis pour maintenir l'économie en plein essor. Même si certains conseillers craignent que notre dépendance à l'égard d'un tel financement n'entraîne des problèmes à long terme, les bénéfices actuels peuvent véritablement transformer notre pays en une économie moderne. Le ministre des Finances élabore déjà des plans pour utiliser les fonds pour de grands projets de développement. Idéalement, avec ce soutien, la nation tout entière récoltera bientôt les fruits d'une économie en plein essor."

 SINO_PAK.1.d:0 "Les relations initiales avec la Chine et le Pakistan ont été entravées par des alignements géopolitiques et des différends frontaliers. Cependant, une récente initiative du Pakistan visant à mener des négociations sur la frontière contestée a été acceptée par les Chinois. Après des semaines de négociations fructueuses, les deux parties sont parvenues à un accord. L'accord a vu les deux nations s'engager à délimiter leur frontière. Le Pakistan a également accepté de céder le territoire du Karakoram à la Chine. Les gouvernements chinois et pakistanais considèrent cet accord comme le début d'une véritable amitié. Même si la réaction de la population a été largement positive, le gouvernement indien la critique vivement. De nombreux journaux indiens affirment que le Pakistan n'a même pas le droit de céder les terres qu'il a cédées. Quoi qu'il en soit, il semble que le Pakistan et la Chine aient franchi un cap dans leurs relations."
 SINO_PAK.2.d:0 "Les gouvernements pakistanais et chinois ont annoncé que les deux parties avaient commencé à construire une route terrestre qui relierait les deux pays. L'itinéraire proposé reliera la NWFP et le Pendjab au Xinjiang via le Gilgit-Baltistan. Les deux parties ont convenu que l'autoroute passerait par le col de Khunjerab. La construction pakistanaise sera réalisée par la Frontier Works Organization, qui prévoit de faire appel au Corps des ingénieurs de l'armée pakistanaise pour le projet. Le projet proposé sera l'une des autoroutes praticables tous temps les plus longues et les plus hautes de la planète. Le gouvernement pakistanais note que le projet restaurera les anciennes liaisons de la Route de la Soie et rétablira le contact historique entre les peuples du Pakistan et de la Chine."
 SINO_PAK.3.d:0 "La construction de l'autoroute du Karakoram se poursuit tant au Pakistan qu'en Chine. Jusqu'à présent, il y a eu des dizaines de morts à cause des avalanches et des conditions extrêmes. Un cimetière chinois a été créé à Gilgit. Cependant, malgré les difficultés, le projet se poursuit et les ingénieurs pakistanais tirent de précieuses leçons en matière de construction et de planification routière. Les experts indiens ont exprimé leur inquiétude quant au fait que l'itinéraire proposé, une fois achevé, permettrait à la Chine d'envoyer des fournitures, voire des troupes, à tout moment de l'année, quelles que soient les conditions météorologiques. Actuellement, de nombreux chemins et routes de l'Himalaya sont inaccessibles aux mouvements militaires à grande échelle de janvier à avril."
 SINO_PAK.4.d:0 "Les ministères des Affaires étrangères pakistanais et chinois ont publié un communiqué annonçant que l'autoroute du Karakoram entrait dans sa phase finale de construction. Il a noté qu'en dépit des dangers extrêmes, les travailleurs pakistanais et chinois continuent de travailler avec diligence et enthousiasme pour le bien-être de leur peuple. Des correspondants étrangers ont été conduits sur des tronçons achevés de l'autoroute et leurs rapports décrivent une chaussée très résistante. Les deux gouvernements continuent de saluer et de faire connaître les prouesses techniques accomplies et la coopération entre les deux pays. La Frontier Works Organization a utilisé les expériences acquises dans le cadre du projet pour étendre considérablement ses capacités d'ingénierie."
 SINO_PAK.5.d:0 "Lors d'une splendide cérémonie, le premier camion chargé de marchandises est parti de Kashgar en Chine. Il a été accueilli par une foule enthousiaste à son arrivée à Abbottabad au Pakistan, marquant l'ouverture officielle de l'autoroute du Karakoram. Plus tard, le gouvernement pakistanais a organisé un banquet de célébration avec ses homologues et diplomates chinois. Les médias chinois ont salué l'ouverture de ce qu'ils appellent l'autoroute de l'amitié. Au Pakistan, les principaux journaux ont décrit la route comme la huitième merveille du monde. La nouvelle autoroute garantit que les liaisons terrestres entre le Pakistan et la Chine seront assurées toute l'année, facilitant ainsi le commerce et les contacts. Stratégiquement, et ce qui préoccupe l'Inde, la route garantit que la Chine pourrait soutenir militairement ou matériellement le Pakistan même pendant la saison hivernale hostile. La Frontier Works Organization est désormais la première organisation de génie militaire au Pakistan."

 PRC_PACT.1.d:0 "Seule l'Inde connaît personnellement la menace que représente la Chine. Même si nous avons des différends avec l'Inde, il pourrait s'avérer nécessaire de suspendre nos hostilités mutuelles dans un avenir proche. Les rapports sur les frontières chinoises continuent de sonner l'alarme au sein du gouvernement. Bien entendu, de nombreuses questions restent en suspens avec l'Inde et une tentative de normalisation rapide des relations pourrait potentiellement déclencher des troubles. Cependant, plusieurs hauts responsables suggèrent que nous puissions proposer à l'Inde un pacte de non-agression de trois ou cinq ans. Cela donnerait aux deux pays la possibilité de travailler à consolider leurs faiblesses à l'égard de la Chine. Certains chefs militaires suggèrent que toute cette initiative est insensée et que le Pakistan doit traiter seul avec la Chine. Le cabinet doit maintenant décider de proposer l'une des options de non-agression, sinon il pourrait décider de simplement abandonner l'initiative proposée."
 PRC_PACT.2.d:0 "Le ministre des Affaires étrangères a reçu son homologue pakistanais qui lui a présenté une proposition sans précédent. Il a proposé de signer un pacte de non-agression de trois ans avec notre gouvernement qui garantirait qu'il n'y ait aucune possibilité de conflit pendant la durée de l'accord. Les Pakistanais sont actuellement préoccupés par leur frontière avec la Chine. Ils craignent le projet chinois de s'emparer des terres qu'ils occupent de la même manière qu'ils l'ont fait récemment pour les nôtres. La période de trois ans permettrait à leur gouvernement et au nôtre de mieux préparer nos territoires à une future agression chinoise et pourrait constituer les premiers pas vers une paix plus large. Cependant, certains chefs militaires ont exprimé leurs inquiétudes quant au fait que cette proposition constitue un stratagème visant à faciliter une future offensive pakistanaise au moment qui leur conviendrait. Le Cabinet doit décider comment réagir."
 PRC_PACT.3.d:0 "Le ministre des Affaires étrangères a reçu son homologue pakistanais qui lui a présenté une proposition sans précédent. Il a proposé de signer un pacte de non-agression de cinq ans avec notre gouvernement qui garantirait qu'il n'y ait aucune possibilité de conflit pendant la durée de l'accord. Les Pakistanais sont actuellement préoccupés par leur frontière avec la Chine. Ils craignent le projet chinois de s'emparer des terres qu'ils occupent de la même manière qu'ils l'ont fait récemment pour les nôtres. La période de cinq ans permettrait à leur gouvernement et au nôtre de mieux préparer nos territoires à une future agression chinoise et pourrait constituer les premiers pas vers une paix plus large. Cependant, certains chefs militaires ont exprimé leurs inquiétudes quant au fait que cette proposition constitue un stratagème visant à faciliter une future offensive pakistanaise au moment qui leur conviendrait. Le Cabinet doit décider comment réagir."
 PRC_PACT.4.d:0 "Fait surprenant, les gouvernements pakistanais et indien ont annoncé un nouvel accord de non-agression mutuelle sur trois ans, appelé Pacte de non-agression indo-pakistanais. Les deux rivaux traditionnels d'Asie du Sud ont été motivés par cet accord par crainte d'une politique étrangère chinoise de plus en plus affirmée. Les analystes estiment que l'accord permettra aux deux États de se concentrer davantage sur une meilleure préparation de leur position le long de la frontière chinoise et de consolider leur base intérieure sans la menace d'une guerre plus large en Asie du Sud. Les Chinois ont condamné l'accord, le qualifiant de complot, tandis que les États occidentaux ont salué cette décision. Au niveau national, la réaction a été modérée, même si au Pakistan, il y a eu quelques protestations contre la coopération du gouvernement avec l'Inde."
 PRC_PACT.5.d:0 "Fait surprenant, les gouvernements pakistanais et indien ont annoncé un nouvel accord de non-agression mutuelle sur cinq ans, appelé Pacte de non-agression indo-pakistanais. Les deux rivaux traditionnels d'Asie du Sud ont été motivés par cet accord par crainte d'une politique étrangère chinoise de plus en plus affirmée. Les analystes estiment que l'accord permettra aux deux États de se concentrer davantage sur une meilleure préparation de leur position le long de la frontière chinoise et de consolider leur base intérieure sans la menace d'une guerre plus large en Asie du Sud. Les Chinois ont condamné l'accord, le qualifiant de complot, tandis que les États occidentaux ont salué cette décision. Au niveau national, la réaction a été modérée, même si au Pakistan, il y a eu quelques protestations contre la coopération du gouvernement avec l'Inde."
 PRC_PACT.6.d:0 "Le Pacte de non-agression indo-pakistanais sans précédent a officiellement expiré. Le Pakistan a proposé l'accord par souci pour la Chine. L'Inde, qui a également des problèmes frontaliers en suspens avec la Chine, a salué l'accord comme une opportunité de renforcer ses propres capacités pour faire face à la menace chinoise. L'accord a vu un petit épanouissement des liens et des échanges culturels entre l'Inde et le Pakistan. Cependant, l'accord étant désormais expiré, on craint qu'une nouvelle course aux armements entre l'Inde et le Pakistan ne s'intensifie. Malgré le succès de l'accord, des progrès sur d'autres questions seraient nécessaires pour voir le Pakistan et l'Inde transformer leurs liens de rivalité en amitié."
 PRC_PACT.7.d:0 "Le ministre des Affaires étrangères est revenu d'Inde avec des nouvelles décevantes. Le gouvernement indien a refusé de signer notre proposition de pacte de non-agression. Ils ont évoqué des problèmes de sécurité et ont souligné qu'ils étaient une nation épris de paix et peu intéressée par le bellicisme. Il est toutefois clair que l'Inde reste une menace majeure pour notre sécurité nationale. Alors que la situation avec la Chine continue d'évoluer, nos forces et nos services de renseignement doivent rester vigilants face aux plans néfastes de l'ennemi. Ajoutant l'insulte à l'injure, le gouvernement indien a divulgué la proposition d'une manière qui a fait paraître notre gouvernement faible. Les Chinois seraient mécontents de ce qu'ils appellent un projet d'alliance anti-chinoise."
 
 PAK_SEC.1.d:0 "Les États-Unis ont suivi de près nos luttes avec la Chine et leurs responsables sur le terrain ont exprimé leur sympathie à l'égard de la menace communiste au nord de nous. Nous pouvons envoyer une mission diplomatique de grande envergure aux États-Unis pour demander un soutien en matière de sécurité. L'Amérique peut constituer un puissant rempart contre l'agression communiste. Cependant, certains membres du cabinet s'inquiètent de notre dépendance accrue à l'égard de l'Amérique et craignent qu'une telle mission ne soit considérée comme un signe de faiblesse par une population intrinsèquement hostile aux puissances impériales perçues."
 PAK_SEC.2.d:0 "Une mission militaire et diplomatique pakistanaise de haut niveau a passé ces derniers jours à visiter le Pentagone, le Congrès et la Maison Blanche dans le but de renforcer le soutien à leur nation. Les Pakistanais craignent une agression communiste chinoise à leurs frontières et demandent de l'aide pour collecter du matériel pour trois nouvelles divisions de montagne. Le Département d'État et le Pentagone ont proposé trois options quant à la manière dont nous pouvons répondre aux Pakistanais. L'une consiste à fournir du matériel pour la levée de trois divisions de montagne, ce qui rendra l'Inde furieuse. La deuxième est de fournir une aide non létale et un soutien à la formation à la guerre en montagne, ce qui réduirait la colère indienne et n'humilierait pas les Pakistanais. Enfin, nous pouvons simplement refuser de fournir toute aide, ce qui nuirait probablement aux relations avec le Pakistan, mais ce pays étant très dépendant de notre soutien, un tel revers diplomatique serait temporaire."
 PAK_SEC.3.d:0 "En réponse à notre demande d'aide pour faire face à la menace chinoise, les États-Unis ont accepté de nous fournir du matériel pour pouvoir lever à terme trois divisions de montagne. Comme nous l'avons dit aux États-Unis depuis que nous avons accédé à l'indépendance, tant qu'ils fournissent les outils, nous pouvons mieux former, équiper et déployer nos hommes. Les gouvernements chinois et indien ont tous deux sévèrement critiqué la décision américaine, mais cela n'a rien d'inquiétant puisque la sécurité du Pakistan est une préoccupation bien plus vitale. Les éditoriaux à travers le pays présentent l'aide militaire comme le résultat d'une politique gouvernementale pragmatique visant à rassembler ses amis."
 PAK_SEC.4.d:0 "En réponse à notre demande d'aide pour faire face à la menace chinoise, les États-Unis ont annoncé qu'ils nous fourniraient une aide non létale et une formation avancée à la guerre en montagne. Bien qu'il s'agisse d'un résultat décevant, car de nombreux membres de l'armée espéraient que les équipements américains pourraient l'aider à lever de nouvelles formations, ils apporteront néanmoins un soutien précieux au Pakistan. Le gouvernement a salué la décision américaine mais a été déçu en privé. Certains éditoriaux ont souligné que l'aide était bien inférieure à celle demandée et suggèrent que les États-Unis ont limité leur aide pour réduire l'anxiété indienne à ce sujet. Le gouvernement chinois a exprimé son inquiétude face à la présence croissante des États-Unis dans la région. Des experts militaires américains devraient bientôt arriver et moderniser les installations d'entraînement à la guerre en montagne au Pakistan."
 
 PAK_Kashmir_Unrest.1.d:0 "Une relique sacrée a été volée au célèbre sanctuaire Hazratbal à Srinagar. Les habitants pensent que la relique est une mèche de cheveux du Prophète, initialement saisie au XVIIe siècle par l'empereur moghol Aurangzeb. Lorsque la nouvelle du vol s'est répandue, des dizaines de milliers de personnes sont descendues dans la rue pour protester au Cachemire. Les autorités indiennes et locales enquêtent sur la question, mais les protestations se font remarquer par leur ampleur et de nombreux observateurs voient dans cette agitation spontanée le signe d'une agitation politique cachemirienne sur leur statut international. Le gouvernement pakistanais a une obligation morale envers le peuple du Cachemire et une décision doit être prise. Le Pakistan devrait-il poursuivre une option militaire pour libérer le Cachemire de manière décisive ou devrait-il plutôt se concentrer sur les efforts diplomatiques et de renseignement pour forcer l'Inde à accepter les résolutions de l'ONU sur la question ?"
 PAK_Kashmir_Unrest.2.d:0 "Le gouvernement pakistanais donne la parole aux mécréants et aux agitateurs dans son Cachemire occupé. Ils ont amélioré le flux de transmission de leur soi-disant Radio Free Kashmir. Leurs émissions encouragent le communautarisme, diffusent une fausse propagande et incitent aux manifestations. Nous avons déjà protesté auprès de la mission diplomatique pakistanaise, qui prétend que le réseau radio est le produit d'activistes cachemiriens indépendants. Il s'agit clairement d'un effort du gouvernement pakistanais visant à semer l'agitation parmi la population du Cachemire."
 PAK_Kashmir_Unrest.3.d:0 "La soi-disant Radio Free Kashmir a récemment étendu sa transmission et sa puissance de diffusion pour atteindre davantage de régions du Cachemire. Leurs émissions diffusent depuis longtemps de la propagande pakistanaise et de fausses informations, mais depuis peu, elles encouragent désormais la résistance armée. Les Cachemiriens sont appelés à riposter contre notre gouvernement par tous les moyens nécessaires et également à saboter les projets gouvernementaux dans la région. Une fois de plus, nos appels au gouvernement pakistanais pour qu'il mette fin à de tels discours sont ignorés, mais les commandants militaires sur le terrain sont convaincus de pouvoir contrôler les troubles au Cachemire. Nos responsables et agents sur le terrain traqueront tous les habitants impliqués dans la diffusion de la propagande pakistanaise. Les émissions sont alimentées par des rumeurs de changements politiques au Cachemire au sein de la constitution."
 PAK_Kashmir_Unrest.4.d:0 "Nous avons réussi à identifier un certain nombre de Cachemiriens agissant comme agents de l'État pakistanais. Nous savons qu'ils fournissent des informations, souvent fausses, à diffuser à la soi-disant Radio Free Kashmir. Ces émissions creusent un fossé dans nos relations avec le Cachemire et les efforts visant à réduire ces émissions n'ont pas fonctionné. Certains hauts responsables policiers et militaires nous conseillent d'arrêter rapidement ces agents et de les juger en vertu des lois sur la sédition. En faire un exemple montrera à notre gouvernement qu'il est fort et qu'il enverra un message. D'autres membres du cabinet suggèrent plutôt que nous surveillions simplement ces individus, que nous les contactions en privé et que nous utilisions des méthodes conciliantes ou coercitives pour les convaincre de mettre un terme à leurs activités. Nous devons décider comment gérer cette situation."
 PAK_Kashmir_Unrest.5.d:0 "Partout au Pakistan, des dizaines de milliers de personnes sont descendues dans la rue pour condamner l'occupation indienne du Cachemire. Les drapeaux de l'Azad Cachemire flottaient aux côtés des drapeaux pakistanais tandis que les orateurs passaient la journée à condamner les atrocités et l'oppression au Cachemire indien occupé. Des responsables gouvernementaux et des ministres se sont joints à nombre de ces manifestations, promettant le dévouement continu du Pakistan à la libération du Cachemire et de son peuple. Le ministère des Affaires étrangères a publié des déclarations au sein de sa mission diplomatique soulignant la violence et les troubles au Cachemire occupé. Cette manifestation publique massive vise à renforcer le soutien du gouvernement sur la question et à sensibiliser la communauté internationale sur ce territoire contesté."
 PAK_Kashmir_Unrest.6.d:0 "Alors que l'opinion publique nous soutient et que la population du Cachemire indien occupé réclame une résolution, le moment est venu de s'adresser aux Nations Unies pour demander à l'Inde de mettre en oeuvre les résolutions de l'ONU relatives au Cachemire. L'Inde est bien sûr une grande nation et semble engagée dans son occupation. Cependant, nous avons rédigé une résolution exigeant que l'Inde se conforme à la résolution sous peine de sanctions économiques. Les récents troubles au Cachemire et nos efforts publics ont sensibilisé la communauté internationale. Si les États-Unis et l'Union soviétique n'opposent pas leur veto à la résolution, nous pouvons exercer une immense pression économique sur l'Inde jusqu'à ce qu'ils s'y conforment. Cependant, le ministre des Affaires étrangères suggère qu'avant de s'adresser aux Nations Unies, nous devrions d'abord demander à l'Inde si elle souhaite mener des négociations globales. Si cet effort échoue, nous pourrions alors nous adresser à l'ONU."

 CML_Bhutto.1.d:0 "Compte tenu de la situation dans laquelle se trouve le Pakistan, l'armée a estimé qu'elle n'avait d'autre choix que de céder le pouvoir à Zulfikar Ali Bhutto. Bhutto contrôle le plus grand parti politique du Pakistan et a remporté des succès électoraux qui lui confèrent une légitimité qu'aucun chef militaire ne possède. Bhutto, dans son discours d'ouverture, a promis de reconstruire le Pakistan à la fois physiquement et en tant que peuple. Il a promis d'écouter toutes les voix dans le pays et d'entamer le processus de transition du pays vers une constitution que tous les Pakistanais pourraient approuver. Il a ajouté que ses titres actuels d'administrateur en chef de la loi martiale et de président n'étaient que temporaires et étaient destinés à aider à la reconstruction initiale du pays. Son discours a été bien accueilli et beaucoup y voient un bon signe pour l'avenir du Pakistan."

 DemRahman65.1.d:0 "Le gouvernement a adopté une loi nationalisant l'industrie sidérurgique. Il s'agit des dernières mesures prises par Cheikh Mujibur Rahman pour pousser la nation vers une économie socialiste. La nationalisation vise à accroître la productivité, à réduire la corruption et à mettre fin à toute exploitation des travailleurs. Rahman a déclaré aux journalistes après le vote que l'ère du capitalisme de copinage au Pakistan était révolue. Il a en outre déclaré que les orientations et le financement du gouvernement augmenteraient la productivité et conduiraient à une industrie plus efficace. Les critiques soulignent que le gouvernement n'a peut-être pas la capacité ou l'expérience nécessaire pour gérer une telle industrie et que la corruption pourrait nuire au processus. Quoi qu'il en soit, l'annonce devrait être populaire parmi de nombreuses personnes dans le pays."
 DemRahman65.2.d:0 "Lors d'un récent débat à l'Assemblée nationale, des membres du gouvernement ont posé des questions au ministre des Affaires étrangères concernant les liens avec les États-Unis. Ces parlementaires se demandent comment le Pakistan pourrait entretenir des liens amicaux avec une nation ouvertement engagée avec les puissances coloniales et qui perpétue parfois un régime colonial à travers le monde. Le ministre des Affaires étrangères a souscrit à ces déclarations et a insisté sur le fait que le gouvernement réévaluerait les liens entre le Pakistan et les États-Unis. De nombreux observateurs ont noté que cette démonstration au Parlement était probablement organisée par le gouvernement pour montrer pourquoi le Pakistan souhaitait s'éloigner des États-Unis et établir des liens plus étroits avec les États socialistes. L'ambassadeur américain a exprimé sa déception face aux propos tenus à l'Assemblée nationale alors que le Département d'État à Washington a brusquement annulé une visite prévue de hauts responsables économiques au Pakistan. Le Pakistan a également annulé son projet d'accueillir une mission militaire américaine dans le pays. Les gouvernements chinois et soviétique seraient satisfaits de ces récents événements."

 Dem_Ayub.1.d:0 "Le président doit bientôt se rendre à Dahka et des tensions subsistent concernant la controverse persistante autour du fait que le bengali est une langue nationale. Pour la population du Pakistan oriental, même si l'Assemblée nationale a élevé le ton, l'amertume persiste face à l'ampleur de la résistance de la part du gouvernement et des Pakistanais de l'aile occidentale. Pour de nombreux dirigeants du Pakistan occidental, il existe des arguments selon lesquels l'ourdou devrait être la seule langue nationale car c'est la langue de l'Islam en Asie du Sud. Une autre faction estime que si le bengali peut être élevé, alors toutes les principales langues régionales, comme le pendjabi, le sindhi, le pastho et le balochi, devraient l'être aussi. Le président prononcera un discours à l'Assemblée législative provinciale et devra exprimer son opinion sur le débat ou ignorer la question."
 Dem_Ayub.2.d:0 "Des représentants du Pakistan oriental et des partisans de certains groupes ethniques plus petits ont proposé la création de quotas fédéraux. Les partisans du projet de loi notent que les Bengalis, bien qu'ils constituent la plus grande proportion de la population pakistanaise, sont actuellement sous-représentés dans la fonction publique et dans pratiquement toutes les agences fédérales. De plus, la représentation bengali dans l'armée est très faible. La nouvelle loi obligera les agences fédérales et l'armée à garantir que chaque groupe ethnique majeur soit représenté proportionnellement dans leurs organisations, selon les dernières données du recensement. Les institutions de l'État et les partisans du président Ayub Khan ont exprimé leur opposition à la loi, affirmant que ces institutions sont déjà en train de rectifier la situation, mais qu'une transition trop rapide pourrait entraîner des inefficacités. Les opposants soulignent que plus d'une décennie s'est écoulée depuis l'indépendance et qu'aucun changement significatif n'a encore eu lieu. Le vote commença bientôt."
 Dem_Ayub.3.d:0 "Sous le bref régime d'Ayub Khan, la fonction publique a été mobilisée pour soutenir le régime et beaucoup ont souligné la forte alliance militaire-fonction publique qui s'était formée contre l'ancien ordre politique. Avec une nouvelle constitution et une constitution démocratique en place, l'Assemblée nationale doit décider quoi faire du rôle élargi de la bureaucratie. Certains soutiennent que le législateur devrait légaliser les pouvoirs et influences supplémentaires accordés à la fonction publique pendant la période initiale de la loi martiale. Ils notent l'augmentation de l'efficacité et de la mise en oeuvre de la politique gouvernementale. Cependant, d'autres craignent que la légitimation de ces pouvoirs ne remette en question les autorités locales et ne crée lentement une situation dans laquelle l'Assemblée nationale verra ses pouvoirs et sa capacité à apporter des changements érodés."
 Ayub_East_Pakistan.1.d:0 "L'un des problèmes urgents auxquels le Pakistan est confronté depuis son indépendance est la lutte continue entre les ailes orientale et occidentale. Le Pakistan oriental a la plus grande population, le groupe ethnique le plus homogène et le moins représenté dans la fonction militaire et civile de tous les groupes pakistanais. Les dirigeants du Pakistan oriental ont prôné le provincialisme et accusé le gouvernement de discrimination et de pratiques d'exploitation. Avec un gouvernement ferme désormais aux commandes, nous devons décider s'il faut affirmer fermement le pouvoir du centre et cibler les dissidents parce qu'ils sont anti-pakistanais. Ou s'il serait peut-être préférable de construire une identité nationale en prenant en compte et en répondant à certaines des préoccupations légitimes des Bengalis, telles que la représentation militaire et le respect de l'héritage bengali."
 One_Unit_60s.1.d:0 "Le gouvernement pakistanais a fusionné toutes les provinces de l'aile ouest en une seule province appelée Pakistan occidental dans le cadre de la politique One Unit. Cela visait à promouvoir l'unité nationale, à accroître l'efficacité et à contribuer à compenser l'homogénéité ethnique et la population plus nombreuse du Pakistan oriental. Cependant, depuis la création de One Unit, de nombreuses critiques ont été émises, notamment de la part des dirigeants des anciennes provinces de la NWFP et du Sind. Ils soutiennent que One Unit encourage la domination punjabi et fait taire leurs voix, ainsi que celles des Baloutches du Baloutchistan. Une unité a l'avantage d'égaliser les deux ailes du pays, de renforcer le gouvernement fédéral et d'encourager l'intégration des peuples à travers le Pakistan occidental, mais l'agitation croissante des opposants indique qu'elle reste impopulaire auprès de la population. Le gouvernement doit décider de démanteler One Unit ou de la maintenir."
 PAK_Frontier.1.d:0 "Même avant l'indépendance, les dirigeants nationalistes pathans, dirigés par le charismatique Abdul Ghaffar Khan, réclamaient l'indépendance ou une autonomie suffisante pour devenir fondamentalement indépendants. Ces militants de gauche, désormais en grande partie membres du Parti national Awami (NAP), récemment interdit, poursuivent leurs agitations et seraient, selon les rumeurs, de mèche avec des agents du gouvernement afghan. Récemment, ils se sont plaints durement du gouvernement et du rôle de l'armée. Le gouvernement a reçu deux propositions. La première consiste à poursuivre les arrestations et les détentions de hauts dirigeants du NAP, même si cela tend à inquiéter les travailleurs urbains de Peshawar. L'autre approche consiste plutôt à libérer les dirigeants du NAP et à ne pas les laisser devenir des martyrs politiques pour leurs partisans. Nous pouvons plutôt nous concentrer sur la mobilisation de la majorité rurale pour qu'elle soutienne le gouvernement."
 PAK_Restore_Provinces.1.d:0 "Avec la restauration des provinces, de nouvelles élections provinciales ont eu lieu. Les membres des partis politiques régionaux, dont de nombreux défenseurs de l'autonomie provinciale, ont remporté des sièges dans toutes les provinces, provoquant ainsi une confrontation avec le centre et les provinces. Le gouvernement aura beaucoup plus de mal à gouverner efficacement ou à utiliser la fonction publique pour superviser les changements dans les provinces. Une proposition du cabinet est d'augmenter les fonds de développement destinés aux gouvernements provinciaux afin de les convaincre d'être plus coopératifs. Cependant, d'autres membres du cabinet craignent qu'un tel effort ne soit qu'une perte de temps et qu'il ne faudra qu'un peu de temps pour normaliser les échanges avec les provinces."

 Rahman_Victorious.1.d:0 "Les Pakistanais de plusieurs cantonnements du Pakistan occidental et oriental se sont réveillés en voyant des véhicules militaires et des troupes lourdement armées patrouillant dans les rues. Les troupes armées ont également occupé des bâtiments gouvernementaux clés à Islamabad et à Dacca. Cependant, ce coup d'État apparent s'est rapidement déroulé. Dans l'après-midi, une importante colonne de troupes pakistanaises de Rawalpindi est entrée dans la capitale et, après une brève impasse, a expulsé les soldats rebelles des bâtiments gouvernementaux. Au même moment, les troupes occupant les cantonnements avaient regagné leurs casernes. Dans la soirée, le président Mujibur Rahman s'est adressé à la nation et a révélé qu'un complot mené par certains officiers réactionnaires avait été déjoué par des officiers supérieurs et des soldats patriotes qui refusaient de trahir la constitution. Il a annoncé un couvre-feu temporaire, appelant au calme alors que les personnes impliquées dans le complot sont placées en garde à vue."
 Rahman_Victorious.2.d:0 "Des foules massives de Pakistanais sont descendues dans les rues de Dacca, Islamabad, Lahore et Karachi. Ils se mobilisent pour soutenir le gouvernement et la démocratie. Les manifestants expriment leur soutien à l'État suite à la récente tentative de coup d'État manquée. Au cours des rassemblements, des dirigeants politiques de la coalition au pouvoir se sont adressés à la foule, saluant la réponse de Cheikh Mujibur Rahman. Certains intervenants ont cependant fait des commentaires incendiaires, condamnant des éléments de l'armée pour leur opposition à la démocratie. Le personnel paramilitaire et militaire ne s'est pas déployé pour aider les autorités locales à contrôler les foules, restant discrets."
 Rahman_Victorious.3.d:0 "Le président Cheikh Mujibur Rahman a annoncé la nomination d'un tribunal militaire pour enquêter sur la récente tentative de coup d'État. Dans son discours, il a salué le patriotisme et le professionnalisme des forces qui ont agi pour la défense de l'État. Il a appelé les médias à mettre un terme à leurs spéculations sur l'incident et a condamné les récents éditoriaux suggérant un problème de bonapartisme au sein de l'armée. Le général Tikka Khan présidera le tribunal, le général de division Zia ul-Haq étant accusé d'être le meneur de la tentative de coup d'État manquée. Les Pakistanais attendaient nerveusement davantage d'informations sur le prétendu complot. Des dizaines d'officiers sont en détention et les militaires sont visiblement absents des rues pour éviter d'enflammer la population. Les analystes estiment que le président a décidé de permettre à l'armée de statuer sur cette affaire après avoir fait face à d'immenses pressions de la part d'officiers supérieurs de l'armée ces derniers jours."
 Rahman_Victorious.4.d:0 "Le général Tikka Khan est prêt à rendre une décision sur le procès des officiers pakistanais impliqués dans le complot manqué du coup d'État. Le procès et l'enquête ont révélé que, même si le complot a échoué, de nombreux officiers pakistanais considèrent le socialisme avec suspicion. De nombreux citoyens souhaiteraient le renvoi sommaire de tous les agents soupçonnés d'être impliqués dans le complot, ainsi que de longues peines de prison pour ceux qui l'ont exécuté. Cependant, au sein de l'armée, on a le sentiment qu'une répression à grande échelle constituerait une insulte à l'institution et servirait les intérêts des éléments anti-militaires. Ils préféreraient que les principaux conspirateurs soient démis de leurs fonctions, tandis que tous les autres conspirateurs présumés reprennent leurs fonctions. Le général Tikka Khan doit peser l'impact sur la nation par rapport à l'impact sur l'armée."
 Rahman_Victorious.5.d:0 "Le verdict rendu par le tribunal militaire dirigé par le général Tikka Khan a été récemment rendu public. Le général Zia ul-Haq, ainsi que plusieurs autres officiers supérieurs, seront condamnés à dix ans de prison militaire et démis de leurs fonctions. Ils sont reconnus coupables de tentative de coup d'État visant à renverser le gouvernement. Le tribunal a noté que la violence armée n'avait pas été utilisée par les conspirateurs pour justifier la peine de prison. Des dizaines d'autres officiers reconnus coupables d'être au courant du complot doivent être immédiatement démis de leurs fonctions. Le tribunal a noté que même si ces officiers n'avaient pas participé à la tentative, leur incapacité à signaler le complot les rendait inaptes à l'armée. Le Président a remercié le tribunal d'avoir accompli son devoir."
 Rahman_Victorious.6.d:0 "Les médias et le public ont réagi favorablement à la récente décision du Tribunal militaire. Les éditoriaux félicitent le général Tikka Khan pour avoir pris à partie les putschistes, affirmant que cette décision montre une nouvelle maturité de la part de l'armée. Le président s'est également prononcé en faveur du verdict, félicitant l'armée pour son dévouement à la constitution. Cependant, au sein de l'armée, il y aurait un certain mécontentement. Certains estiment que les peines de prison sont trop lourdes et ternissent la réputation du corps des officiers. La plupart sont irrités par le retrait de tant d'officiers prometteurs. Ces hommes ont été expulsés sur la base de preuves matérielles fragiles ou pour avoir obéi à leurs supérieurs. Quoi qu'il en soit, le Pakistan cherchera à sortir de cette affaire."
 Rahman_Victorious.7.d:0 "Le verdict rendu par le tribunal militaire dirigé par le général Tikka Khan a été récemment rendu public. Le général Zia ul-Haq, ainsi que plusieurs autres officiers supérieurs, doivent être démis de leurs fonctions et assignés à résidence dans un avenir prévisible. Ils sont reconnus coupables de tentative de coup d'État visant à renverser le gouvernement. Des dizaines d'autres officiers, accusés de connaître les détails du complot mais de ne pas en avoir informé le gouvernement, ne seront pas punis. Le tribunal a noté que la tentative de coup d'État n'avait pas entraîné de violence ni de morts, mais que ceux qui y avaient participé devaient être mis hors service. Concernant les complices accusés, le tribunal a évoqué un manque de preuves au-delà des témoignages."
 Rahman_Victorious.8.d:0 "Les médias et le public ont réagi négativement à la récente décision du Tribunal militaire. Les éditoriaux accusent l'armée de protéger ses propres intérêts plutôt que les besoins et les souhaits de la nation. Des brochures anti-militaires clandestines circulent, appelant la population à se préparer à défendre le gouvernement contre de futurs projets militaires. Au sein de l'armée, le verdict est considéré comme une réponse juste et impartiale. Les militaires retournent désormais dans la rue en uniforme et la tête haute. Le président Mujibur Rahman n'a notamment pas publié de déclaration ni pris la parole devant la nation après le verdict. Beaucoup pensent que le président et les hauts dirigeants politiques sont furieux du verdict, le considérant comme un défi direct à l'autorité civile."

 Pakistan_Alt_1973_Coup.1.d:0 "Les Pakistanais se sont réveillés à la vue de troupes et de chars dans les villes du Pakistan occidental et dans certaines zones de cantonnement du Pakistan oriental. Les bâtiments gouvernementaux ont été occupés tandis que les rapports indiquent que les maisons de dirigeants politiques sont actuellement encerclées par les troupes. D'autres hommes politiques seraient assignés à résidence. Peu de temps après, l'armée a annoncé qu'elle avait pris le contrôle du pays aux mains du président Mujibur Rahman. Le chef de ce coup d'État est un jeune général de division nommé Zia ul-Haq. Il semble que le coup d'État ait été planifié en dessous des échelons supérieurs et la rumeur dit que ces officiers supérieurs seraient également en détention. Dans sa déclaration, le président Zia a déclaré que la nation s'orientait vers l'athéisme et une politique provinciale qui conduiraient à la destruction de la nation. Le général Zia a promis que de nouvelles élections auraient lieu prochainement. Cependant, on ne sait pas dans quelle mesure l'armée exerce un contrôle au Pakistan oriental, où la plupart des forces sont bengalis."
 Pakistan_Alt_1973_Coup.2.d:0 "Au lendemain du coup d'État militaire, la situation au Pakistan se trouve dans une impasse tendue. Le Pakistan occidental est en grande partie sous le contrôle de l'armée, qui bénéficie du soutien des segments conservateurs et religieux qui se sont longtemps opposés à l'évolution vers le socialisme dans le pays. Au sein de l'armée, Zia a recueilli le soutien d'une grande partie du corps des officiers qui s'opposent à la montée de forces militaires alternatives. Cependant, la Ligue Awami a réussi à conserver le contrôle du Pakistan oriental alors que les forces bengali au sein de l'armée ont refusé de rejoindre le général Zia. La situation étant dans l'impasse, le général Zia a envoyé un groupe d'officiers et d'alliés politiques à Dacca pour des entretiens avec la Ligue Awami et Cheikh Mujibur Rahman."
 Pakistan_Alt_1973_Coup.3.d:0 "Après d'intenses négociations, la Ligue Awami et le gouvernement militaire ont annoncé qu'un accord avait été conclu. Par respect pour les sentiments des Pakistanais occidentaux et orientaux, il a été convenu que Cheikh Mujibur Rahman et la Ligue Awami garderaient le contrôle du Pakistan oriental et que l'armée ne tenterait pas de prendre le contrôle de l'aile orientale. La Ligue Awami a accepté de permettre au régime militaire de gouverner le Pakistan occidental jusqu'à ce qu'un accord final puisse être conclu. Pour l'essentiel, les deux parties ont convenu de maintenir le statu quo. La plupart des Pakistanais semblent avoir accepté la situation, espérant que la guerre civile puisse être évitée."
 Pakistan_Alt_1973_Coup.4.d:0 "Suite à l'accord avec la Ligue Awami et à son retrait indispensable du Pakistan occidental, Zulfikar Bhutto est de loin l'homme politique le plus populaire du pays. Le général Zia a récemment envoyé des représentants à Bhutto pour lui demander ses intentions. Bhutto, un rebelle, a exprimé sa désapprobation du coup d'État et a appelé au rétablissement de la démocratie. Le général Zia et ses principaux généraux doivent décider s'ils doivent autoriser Bhutto à quitter son assignation à résidence actuelle et à créer une assemblée constitutionnelle pour le pays. Il créerait une nouvelle constitution qui préserve les principes islamiques du pays et mettrait fin aux conflits provinciaux. Bhutto pourrait être convaincu de garder Zia comme chef de l'armée et de ne pas cibler les putschistes s'il était investi du pouvoir. L'autre option serait de maintenir Bhutto en détention et d'enquêter sur lui pour des accusations de corruption présumée alors que le gouvernement militaire continue de gouverner."
 Pakistan_Alt_1973_Coup.5.d:0 "Après avoir été libéré de son assignation à résidence, Zulfikar Bhutto a appelé tous les partis politiques à se réunir pour une assemblée constitutionnelle. L'armée pakistanaise est actuellement en train de se retirer, de lever la loi martiale et de rendre le contrôle aux autorités civiles locales. Bhutto appelle à une nouvelle constitution qui résoudra les questions en suspens et empêchera la désunion qui prévaut à travers le pays. Pour établir un Pakistan uni, Bhutto a invité la Ligue Awami à participer et à réunir politiquement les deux ailes du pays."
 Pakistan_Alt_1973_Coup.6.d:0 "La Ligue Awami a choqué la nation en refusant d'assister à l'Assemblée constitutionnelle convoquée par Zulfikar Bhutto. Ils notent que Bhutto semble être une marionnette militaire et expliquent qu'un chef d'un parti minoritaire pourrait être chargé de la réunion constitutionnelle. Cette annonce a mis à mal les projets d'unification du Pakistan. Les efforts de négociation de Bhutto ont échoué et Cheikh Mujibur Rahman a annoncé qu'il n'accepterait plus l'oppression continue des Bengalis. Il semble que la Ligue Awami soit désormais déterminée à parvenir à l'autonomie gouvernementale du Pakistan oriental. Des manifestations ont éclaté dans tout le Pakistan oriental, la population exigeant l'indépendance et le retrait de l'armée pakistanaise. Les forces pakistanaises au Pakistan oriental resteraient dans leurs casernes et minimiseraient les contacts avec le grand public."
 Pakistan_Alt_1973_Coup.7.d:0 "Le refus de la Ligue Awami d'assister à l'assemblée constitutionnelle a provoqué une impasse avec Zulfikar Bhutto aux commandes du Pakistan occidental et Mujibur Rahman en charge du Pakistan oriental. Pour sortir de cette impasse et mettre fin au sentiment croissant de désespoir parmi les Pakistanais, l'armée pakistanaise a annoncé son intention de retirer ses forces du Pakistan oriental. Cela ouvre la voie à une séparation complète. Les militaires qui souhaitent rester au Pakistan oriental seront autorisés à y rester. Cependant, l'armée a annoncé qu'elle retirerait du Pakistan oriental tout le matériel non immobilisé et qu'elle ferait appel à des réserves pour remplacer les officiers et les troupes restés sur place. Au fil des années, un certain nombre de Bengalis ont rejoint l'armée et beaucoup sont déjà stationnés au Pakistan oriental ; ils y resteront probablement. Les experts estiment qu'une fois que l'armée aura terminé l'évacuation, la séparation suivra."
 Pakistan_Alt_1973_Coup.8.d:0 "S'adressant à un stade bondé, Cheikh Mujibur Rahman a proclamé l'indépendance du Bangladesh. À Dacca et dans ce qui est aujourd'hui l'ancien territoire du Pakistan oriental, des millions de personnes seraient descendues dans la rue, et presque toutes les maisons arboraient des drapeaux bangladais faits maison. Plus tard, Rahman a rencontré de hauts responsables gouvernementaux et militaires du Pakistan qui ont officiellement félicité le peuple bangladais et promis une nouvelle ère de liens fraternels. Malgré cette démonstration publique d'acceptation, les Bangladais et les Pakistanais sont amers face à cette séparation, beaucoup reprochant à l'autre partie de ne pas avoir réussi à faire de compromis ou à prendre les décisions nécessaires pour préserver le Pakistan."
 Pakistan_Alt_1973_Coup.9.d:0 "Alors que Zulfikar Bhutto était en état d'arrestation et que Cheikh Mujibur Rahman contrôlait toujours le Pakistan oriental, le général Zia ul-Haq a convoqué une réunion des commandants de corps pour discuter de la situation. Au cours des discussions de haut niveau, Zia s'est vu présenter deux options sur la manière de gérer les troubles croissants, en particulier parmi les gauchistes urbains et les sympathisants de Bhutto. Une fois ces groupes traités, le gouvernement pourra alors s'occuper de Mujibur Rahman et du Pakistan oriental. Une option envisage une répression militaire agressive. Les généraux la surnomment l'approche au bâton. L'autre option consiste à proposer des concessions et des compromis avec les principales formations politiques du pays afin de gouverner en coopération."
 Pakistan_Alt_1973_Coup.10.d:0 "Le gouvernement militaire a annoncé qu'il porterait bientôt des accusations liées à la corruption et au meurtre contre Zulfikar Ali Bhutto. Cette nouvelle étonnante survient quelques mois après que le principal dirigeant politique ait été assigné à résidence à la suite d'un coup d'État militaire perpétré par l'armée pakistanaise. Bhutto a réussi à publier une déclaration écrite condamnant les accusations comme étant forgées de toutes pièces et sans fondement. Il a appelé le peuple pakistanais à continuer de résister aux forces antidémocratiques et à sauver le pays. Interrogé sur les accusations par les médias internationaux, le général Zia a déclaré qu'il n'avait aucun commentaire à faire car le système judiciaire n'est pas sous son influence. Il a déclaré que les tribunaux pakistanais et l'État de droit détermineront le sort de Bhutto. Des informations font état d'attaques avec délit de fuite contre des patrouilles militaires à Karachi, déclenchant des rumeurs de résistance armée..."
 Pakistan_Alt_1973_Coup.11.d:0 "Le gouvernement pakistanais du général Zia a annoncé avoir conclu un accord avec la Ligue Awami dirigée par Cheikh Mujibur Rahman. Zia a récemment tenté de renverser Rahman lors d'un coup d'État militaire, mais le dirigeant bengali a réussi à s'enfuir à Dacca et à prendre le contrôle du Pakistan oriental. Les deux parties ont convenu d'échanger du personnel gouvernemental et militaire, ce qui permettra aux résidents du Pakistan oriental vivant au Pakistan occidental de rentrer chez eux, et vice versa. Il appelle également au retrait complet du matériel militaire pakistanais du pays, le général Zia insistant sur le fait que celui-ci appartient au Pakistan. Une fois l'équipement et le personnel échangés, le Pakistan acceptera l'indépendance du Bangladesh. De nombreuses personnes au Pakistan occidental et oriental accueillent favorablement cette nouvelle, car elles en ont assez des conflits et du désordre politiques constants."
 Pakistan_Alt_1973_Coup.12.d:0 "Le Pakistan a confirmé son engagement envers son récent accord avec le Bangladesh en publiant son plan d'évacuation. Le personnel militaire et les responsables gouvernementaux souhaitant être rapatriés au Pakistan doivent le faire dès que possible. Le gouvernement envoie et embauche également des services de transport pour assurer le retrait rapide des équipements militaires et publics achetés pour l'État du Pakistan. Le gouvernement affirme qu'il terminera l'évacuation dans environ trois mois. Le gouvernement pakistanais, répondant aux critiques selon lesquelles il ne laisserait rien au Bangladesh, a indiqué qu'il embaucherait et organiserait l'évacuation des Pakistanais de l'Est souhaitant quitter le Pakistan occidental au cours de cette même période. Le général Zia a exprimé son désir de nouer de futurs liens fraternels."
 Pakistan_Alt_1973_Coup.13.d:0 "Le général Zia a signé un document avec Cheikh Mujibur Rahman à Dacca confirmant l'indépendance du Bangladesh. Les deux hommes, anciens rivaux engagés dans une impasse politique depuis des mois, se sont chaleureusement embrassés après la signature. Cheikh Mujibur Rahman a exprimé sa joie pour le peuple du Bangladesh, tout en soulignant qu'il a fallu beaucoup de difficultés pour que cela se produise. Le général Zia a simplement exprimé son désir que les deux nations continuent sur la voie de l'Islam et de la vision de Mohammad Ali Jinnah. Le lendemain, les deux hommes devaient se rencontrer pour discuter et le général Zia doit décider s'il en profitera pour proposer une alliance au Bangladesh, ou s'il laisse la situation telle quelle."
 Pakistan_Alt_1973_Coup.14.d:0 "Lors d'entretiens privés entre Cheikh Mujibur Rahman et le dirigeant pakistanais, le général Zia ul-Haq, l'homme fort pakistanais a appelé les deux parties à signer une alliance. Zia a noté que le Pakistan et le Bangladesh sont tous deux des descendants du mouvement pakistanais et que leurs peuples devraient entretenir des liens étroits. Même si un État unifié n'est pas possible, une nouvelle amitié basée sur le respect mutuel et le développement indépendant pourrait faire des deux États l'alliance la plus puissante de la région. Rahman a remercié le général Zia mais a déclaré qu'il devait discuter de la question avec le cabinet. La réponse du cabinet semble pencher vers le rejet de l'offre. Ils notent que le général Zia est celui qui a cherché à renverser la Ligue Awami, ce qui a conduit aux circonstances actuelles, et craignent que la population ne se sente trahie. D'autres cependant, notamment ceux liés aux partis religieux, notent qu'une telle alliance pourrait confirmer que le Bangladesh occupe une place majeure tant au niveau régional qu'international. Mujibur Rahman doit décider comment réagir..."


 Yahya_Khan.1.d:0 "Le président Ayub Khan a annoncé qu'il ne pouvait plus présider une nation en pleine tourmente. Il a déclaré que son objectif avait toujours été le progrès et l'avancement du peuple pakistanais, mais que cela n'était plus possible. Au lieu de cela, il a cédé le pouvoir au général Yahya Khan, son protégé. Khan a rapidement proclamé la loi martiale et s'est nommé administrateur en chef de la loi martiale (CMLA). Il a annoncé le déploiement de troupes à travers le pays pour rétablir l'ordre public. Une fois cet objectif atteint, de nouvelles élections démocratiques seront facilitées. La réaction générale a été un optimisme prudent. De nombreuses personnes dans le pays souhaitent voir le rétablissement de la démocratie, mais se lassent de la hausse croissante de la criminalité."
 Yahya_Khan.2.d:0 "Pour mieux coordonner la situation sécuritaire au Pakistan et préparer les élections, le CMLA Yahya Khan a convoqué un Conseil national de sécurité (NSC), destiné à réunir les plus hauts responsables de la sécurité civile et militaire. Cette décision est saluée par les observateurs qui y voient une tentative du gouvernement militaire de gouverner avec les civils, leur donnant ainsi une perspective plus large sur la situation à laquelle le pays est confronté. Au cours de la première réunion, le NSC a salué le rétablissement réussi de l'ordre public à travers le Pakistan et a déclaré son soutien aux projets visant à organiser de nouvelles élections dans le pays dès que possible."
 Yahya_Khan.3.d:0 "Le général Yahya Khan de la CMLA a annoncé la promulgation de l'ordonnance-cadre juridique no. 1970. Cet ordre établit le cadre des élections à venir et annule officiellement le programme One Unit, rétablissant les quatre provinces d'origine de ce qui était le Pakistan occidental. Cette décision est saluée par beaucoup de ceux qui considèrent le projet One Unit comme un biais en faveur du développement de la majorité pendjabi du Pakistan occidental et laissant derrière eux les autres régions et groupes ethniques. En termes d'élections, l'ordre promet le suffrage universel, la représentation proportionnelle, donnant à l'aile orientale une majorité de sièges, et seulement une majorité simple requise pour amender la constitution. Il stipulait que l'Assemblée nationale élue disposerait de quatre mois pour finaliser une nouvelle constitution pour le Pakistan. "

 Tashkent_Bhutto.1.d:0 "Zulfiqar Bhutto avait servi plusieurs années dans le cabinet d'Ayub Khan. Se présentant comme un fidèle loyaliste du général et un patriote, il est rapidement devenu un confident de confiance. Ce diplômé d'Oxford très instruit est rapidement devenu ministre des Affaires étrangères, apportant son charisme et ses discours éloquents devant les instances internationales. Au sein du gouvernement, Bhutto a dirigé les faucons au Cachemire et a poussé à lancer des opérations au Cachemire. La guerre qui en a résulté s'est terminée dans une impasse et lors des pourparlers de paix à Tachkent, Bhutto a publiquement dénoncé le traité. À son retour au Pakistan, ses relations avec le gouvernement étaient irréparables et il a présenté sa démission. Au cours des mois suivants, Bhutto s'est adressé à de grandes foules, exposant ses projets pour un nouveau parti qui embrasserait un Pakistan d'Islam, de Démocratie et de Socialisme. Il a récemment annoncé la création de ce parti, appelé Parti du peuple pakistanais ou PPP, dont il est le président. Il rassemble les principaux dirigeants socialistes et communistes du Pakistan."
 Delhi_Unrest.1.d:0 "Les hauts dirigeants de l'armée pakistanaise ont été stupéfaits suite à un récent discours prononcé par des officiers du Staff College de Quetta. Lorsque le directeur des opérations militaires s'est adressé aux officiers rassemblés, pour la plupart des majors, il a été confronté à des quolibets et à des accès de colère. Des types similaires d'explosions ont été signalés dans différents cantonnements, mais pas à l'échelle observée à Quetta. Les officiers inférieurs estiment que les officiers supérieurs ont été largement incompétents pendant la guerre et exigent des réformes ainsi que des démissions. Il faudra du temps pour rétablir la discipline et restaurer la confiance dans notre institution. Le renseignement militaire sera chargé de surveiller la situation et d'intervenir si de jeunes officiers commencent à planifier une action plus ouverte contre l'institution ou l'État."
 PAK_Social_Democratic_PPP:0 "PPP"
 PAK_Social_Democratic_PPP_long:0 "Parti du peuple pakistanais"

 DemRahman1970.0.d:0 "Une fois de plus, des millions de Pakistanais se sont rendus aux urnes pour déterminer quel parti dirigerait le Pakistan et qui serait président. Ancien président et père de la constitution actuelle, Ayub Khan a annoncé sa retraite de la politique et n'y participera pas. Cependant, le jeune Zulfikar Ali Bhutto semble diriger son propre parti, le Parti du peuple pakistanais et une coalition centriste contre Cheikh Mujibur Rahman et sa coalition de gauche de partis socialistes. Bien que Bhutto et Rahman prônent tous deux le socialisme, Bhutto prône un socialisme islamique que les partisans de Rahman considèrent comme trop édulcoré. Pour les partis de centre et de droite, Bhutto apparaît comme le moindre des deux maux, d'autant plus qu'il soutient un centre fort. Cependant, il existe également une vague de soutien non seulement en faveur du socialisme de Rahman, mais aussi en faveur de son plaidoyer en faveur d'un centre presque inexistant et d'une plus grande autonomie provinciale, en particulier pour le Pakistan oriental."
 DemRahman1970.1.d:0 "Au cours d'une session tendue de l'Assemblée nationale, le président Cheikh Mujibur Rahman s'est prononcé en faveur d'un projet de loi récemment présenté appelant à la mise en oeuvre des Six Points pour le Pakistan oriental. Cheikh Mujibur Rahman a dévoilé les Six Points plusieurs années plus tôt, une série de politiques destinées à garantir les droits et la dignité du Pakistan oriental. À l'époque, les Pakistanais occidentaux et les fédéralistes avaient condamné les propositions visant essentiellement à accorder l'indépendance du Pakistan oriental. Après son discours, un débat enflammé a eu lieu au cours duquel de nombreux membres de l'opposition, en particulier des représentants du Pakistan occidental, ont condamné le nouveau projet de loi, le qualifiant d'arrêt de mort pour un Pakistan uni. De nombreux représentants du gouvernement et membres bengalis se sont prononcés en faveur du projet de loi, le qualifiant de restauration de l'honneur bengali."
 DemRahman1970.2.d:0 "L'annonce du projet de loi Six Points à l'Assemblée nationale a plongé le Pakistan dans des troubles. Dans tout le Pakistan occidental, nombreux sont ceux qui sont descendus dans la rue pour condamner Cheikh Mujibur Rahman, considéré comme un agent bengali travaillant à la destruction de la nation. Zulfikar Ali Bhutto, le chef de l'opposition, s'est exprimé lors de certains rassemblements à Karachi, déclarant qu'il comprenait le sentiment d'angoisse qui régnait parmi la population. À Dacca, les Bengalis sont venus en foule pour célébrer le projet de loi. Beaucoup estiment que le Pakistan les a traités comme des citoyens de seconde zone et que le nouveau projet de loi remédierait au problème."
 DemRahman1970.3.d:0 "Les retombées politiques du projet de loi Six Points ont atteint un point critique lorsque tous les représentants du Pakistan occidental ont quitté l'Assemblée nationale et quitté Dacca. Ils étaient dirigés par le chef de l'opposition Zulfikar Ali Bhutto. À son arrivée à Karachi, Bhutto a déclaré qu'il ne reviendrait pas au Parlement à moins que le gouvernement ne retire le projet de loi Six Points. Cheikh Mujibur Rahman s'est montré provocateur, déclarant qu'il ne se laisserait pas intimider s'il exécutait la volonté du peuple. Il a noté que les membres restants de l'Assemblée peuvent finir d'adopter le projet de loi sans l'opposition. Les analystes notent que sans le boycott des parlementaires, le pays apparaît clairement divisé."
 DemRahman1970.4.d:0 "Depuis l'entrée en vigueur de la nouvelle constitution, l'armée a accéléré ses efforts pour recruter de manière plus proportionnelle à la composition ethnique du pays. En conséquence, il y a beaucoup plus de Bengalis dans les forces armées qu'auparavant. Cela a rendu le climat politique actuel plus difficile. Des discussions ont eu lieu au sein de l'armée pour éventuellement intervenir et prendre le contrôle de la situation. Cependant, il est devenu clair qu'un tel acte pourrait déclencher une mutinerie majeure ou une insurrection des forces bengali. Étant donné qu'un grand nombre de ces soldats et officiers sont basés au Pakistan oriental, tout ordre visant à s'emparer de l'Assemblée nationale pourrait aboutir à un désastre. Le GHQ a informé les dirigeants de l'opposition que l'armée ne peut pas agir positivement compte tenu des circonstances."
 DemRahman1970.5.d:0 "Zulfikar Ali Bhutto et une délégation de parlementaires, de chefs militaires et de fonctionnaires du Pakistan occidental ont rencontré leur Cheikh Mujibur Rahman et sa propre délégation. Après une série de discussions, les deux parties se sont mises d'accord sur un partage des actifs et sur le rapatriement du personnel pakistanais occidental du Pakistan oriental. Il est clair que Rahman ne fera aucun compromis sur ses Six Points et qu'un tel passage serait intolérable pour le peuple du Pakistan occidental. Cet accord privé ouvre la voie à Rahman pour déclarer l'indépendance du Bengale et mettre fin à l'expérience du Pakistan unifié. Le rapatriement se déroule déjà discrètement pour rendre la transition aussi fluide que possible."
 DemRahman1970.6.d:0 "Dans une déclaration étonnante, Cheikh Mujibur Rahman a proclamé l'indépendance du Pakistan oriental sous le nom de Bangladesh. Il en a fait l'annonce devant une foule enthousiaste. Les Bengalis de tout le nouveau pays ont commencé à arborer des drapeaux faits maison. Au Pakistan occidental, devenu aujourd'hui simplement le Pakistan, l'ambiance est déprimée mais discrète. Beaucoup attendaient cette annonce depuis des semaines et, à ce stade, nombreux sont ceux qui estiment que c'est un bon débarras. Il ne reste plus beaucoup de Pakistanais dans l'ancien Pakistan oriental et ils devraient bientôt rentrer chez eux. L'armée pakistanaise a institué la loi martiale et remis le pouvoir à Zulfikar Ali Bhutto, chef du plus grand parti politique du pays. Il a promis de rétablir l'ordre et d'établir une nouvelle constitution pour le Pakistan."
 DemRahman1970.7.d:0 "La perte du Bangladesh constitue un coup dur pour l'armée pakistanaise. Près d'un tiers de son personnel était bengali et la grande majorité a rejoint le nouvel État. L'armée devra reconstituer ses rangs, mais heureusement, il existe non seulement d'importantes réserves, mais aussi une forte tradition de service militaire au sein de nombreuses communautés du Pakistan. Quoi qu'il en soit, il faudra du temps pour restaurer nos capacités et rétablir certaines installations. Le nouvel administrateur en chef de la loi martiale, Zulifkar Ali Bhutto, a promis son plein soutien aux efforts visant à redonner à l'armée pakistanaise son ancienne gloire."
 DemRahman1970.8.d:0 "Lorsque le président Cheikh Mujibur Rahman a soutenu un projet de loi visant à adopter les six points pour le Pakistan oriental, cela a suscité de vives critiques de la part des Pakistanais occidentaux. Cependant, après les tensions initiales, les deux parties ont convenu d'amender le projet de loi proposé d'une manière qui leur semble bénéfique. Finalement, ces discussions ont porté leurs fruits et le gouvernement présentera bientôt une version amendée du projet de loi qui sera adoptée. Aucune des deux parties ne semble entièrement satisfaite de l'accord, mais compte tenu des circonstances, il est préférable à l'alternative."
 DemRahman1970.9.d:0 "Le projet de loi nouvellement amendé sur les Six Points a été adopté par l'Assemblée nationale avec peu de débat. Le projet de loi réorganise la structure politique du Pakistan. Le Pakistan occidental deviendra le Pakistan et aura un parlement fédéral distinct de celui prévu pour la création d'un Pakistan oriental autonome. Le Pakistan oriental bénéficiera de son propre parlement, de sa propre force de défense et de sa propre politique de développement. Les deux ailes seront désormais reliées par une politique étrangère et des liens économiques communs. Les deux ailes auront leurs propres dirigeants, les différends étant résolus par le dialogue. La première réaction des gens des deux côtés est la déception, mais l'acceptation du fait que cette solution était nécessaire pour mettre fin aux décennies de problèmes politiques qui ont tourmenté le pays depuis l'indépendance."
 DemRahman1970.10.d:0 "Depuis l'annonce de la création du Pakistan oriental, les employés fédéraux et le personnel militaire ont été invités à choisir le système fédéral auquel ils souhaitaient adhérer. Soit le Pakistan, soit le Pakistan oriental. Depuis lors, des efforts considérables ont été déployés pour déplacer les Pakistanais du Pakistan oriental avant la création du Pakistan oriental. Dans le même temps, les Pakistanais de l'Est sont également renvoyés chez eux. Un journal a rapporté qu'un vol d'officiers militaires du Pakistan oriental avait quitté un avion à Dacca, pour ensuite voir des officiers pakistanais monter immédiatement à bord du même avion pour retourner au Pakistan. Malheureusement, le rapatriement pose certains problèmes, notamment pour les familles dont l'un des conjoints est originaire du Pakistan et l'autre du Pakistan oriental."
 DemRahman1970.11.d:0 "Zulfikar Ali Bhutto, qui prendra le contrôle du Pakistan une fois le Pakistan oriental établi, a conclu des pourparlers avec Cheikh Mujibur Rahman, qui dirigera le Pakistan oriental. Les deux hommes se sont mis d'accord sur un partage des biens nationaux entre les deux parties. Cela inclut la répartition des réserves de trésorerie, des ressources et de l'armée. Les deux hommes se sont montrés positifs à l'issue des entretiens et ont exprimé leur satisfaction face au nouveau Pakistan sur le point de se former. L'accord était financièrement généreux envers le Pakistan oriental et beaucoup l'interprètent comme un geste de la part du Pakistan selon lequel, malgré le changement de statut, ils considèrent toujours le Pakistan oriental comme une partie du Pakistan uni."
 DemRahman1970.12.d:0 "Après des mois de négociations et de préparatifs, le Pakistan oriental a finalement commencé à fonctionner comme une province autonome du Pakistan. Cheikh Mujibur Rahman s'est adressé au peuple du Pakistan oriental, déclarant que sa promesse de restauration de la dignité et de l'honneur bengali était complète. Il a déclaré que le Pakistan est devenu plus fort et plus uni grâce à cette décision et que les deux ailes prospéreront désormais ensemble et non aux dépens l'une de l'autre. De grandes foules se sont rassemblées pour assister à un défilé comprenant des chars culturels et un défilé militaire de soldats de la nouvelle armée du Pakistan oriental. Au Pakistan, la réaction a été plus muette. Le nouveau dirigeant du Pakistan, Zulfikar Ali Bhutto, a déclaré qu'il maintiendrait l'État tel quel jusqu'aux prochaines élections. À ce stade, nombreux sont ceux qui, au Pakistan, ont reconnu que ce résultat était inévitable. Il y a donc eu une acceptation discrète."
 DemRahman1970.13.d:0 "Depuis l'entrée en vigueur de la dernière constitution, des efforts beaucoup plus importants ont été déployés pour mieux recruter des groupes ethniques proportionnels à leur représentation au Pakistan. Même si de nombreux officiers supérieurs étaient pakistanais, il y avait un grand nombre de jeunes officiers et soldats bengalis. La grande majorité d'entre eux se sont inscrits dans l'armée du Pakistan oriental. Nous sommes également déterminés à remettre à l'armée du Pakistan oriental sa part de notre équipement. Cela laisse un gros casse-tête au GHQ qui se retrouve soudain confronté à un manque de main-d'oeuvre et d'actifs sur lesquels faire appel. Cependant, les provinces du Pakistan ont toujours été une source majeure de main-d'oeuvre militaire à travers le sous-continent et de nombreux volontaires peuvent être trouvés avec impatience. Plus important encore, le Pakistan dispose également de réserves suffisantes. Le Pakistan s'en sortira bien, mais il faudra du temps et des efforts pour restructurer l'armée afin d'exploiter ces sources."
 DemRahman1970.14.d:0 "Dans le cadre de l'initiative du président Cheikh Mujibur Rahman visant à transformer le Pakistan en une économie socialiste, l'Assemblée nationale a adopté la loi sur la nationalisation des industries essentielles. Ce projet de loi appelle à la nationalisation des industries pétrolière et électrique. Le gouvernement a fait valoir qu'il s'agissait d'industries vitales qui ne devraient pas placer les citoyens à la merci des prix capitalistes ou sous le contrôle d'entreprises privées. Une fois le projet de loi adopté, le président a ordonné aux ressources fédérales d'entamer le processus visant à placer ces entreprises sous la supervision du gouvernement."

 Dem_Ayub65.1.d:0 "Le peuple pakistanais s'est rendu aux urnes pour élire une nouvelle Assemblée nationale et un nouveau président pour le Pakistan. Il s'agit de la première élection sous la nouvelle constitution. Le peuple pakistanais a deux choix. Ils peuvent soit suivre le président Ayub Khan, qui a établi la nouvelle constitution et guidé la nation vers ces élections. Il contrôle actuellement une alliance de partis centristes et de droite. Ou bien ils peuvent opter pour le fougueux homme politique bengali, Sheikh Mujibur Rahman, qui dirige une coalition de gauche. Ayub Khan adhère à un plan de développement capitaliste et à un gouvernement central fort. Mujibur Rahman souhaite réduire l'exploitation des travailleurs, instaurer le socialisme et étendre l'autonomie provinciale."
 Dem_Ayub65.2.d:0 "La télévision pakistanaise (PTV) a lancé sa première émission hier soir. La nouvelle télévision d'État prévoit de diffuser des reportages, des programmes culturels et des divertissements pour tous les citoyens. Le président Ayub Khan a déclaré dans un communiqué de presse qu'il espérait que les nouveaux médias contribueraient à unir le peuple pakistanais et montreraient au monde toute la beauté qui réside dans la nation. Même si le nombre de téléviseurs dans le pays est faible, les experts estiment que ce nouveau média va bientôt se généraliser."
 Dem_Ayub65.3.d:0 "Un haut membre du cabinet américain a rencontré le président Ayub Khan. Il a déclaré que les États-Unis apprécieraient de l'aide dans le conflit en cours au Vietnam. Il a déclaré que les États-Unis recherchaient l'engagement d'au moins une division d'infanterie. En échange, les États-Unis peuvent fournir un soutien économique, des équipements pour deux divisions d'infanterie et une demi-division blindée. Le peuple pakistanais est généralement favorable à la lutte anticoloniale des Vietnamiens et ne verrait pas notre engagement de manière positive. Cependant, les militaires apprécieraient sans aucun doute beaucoup d'équipement supplémentaire. Cependant, le déploiement à l'étranger susciterait probablement un mécontentement parmi les officiers subalternes et les soldats."
 Dem_Ayub65.4.d:0 "Le président pakistanais Ayub Khan nous a informé qu'il ne pouvait pas fournir de division d'infanterie pour combattre au Vietnam. Au lieu de cela, il a proposé d'envoyer une unité médicale. Cependant, comme nous n'avons pas besoin de tels services, nous avons décliné la demande. C'est un revers pour nos efforts visant à internationaliser le Vietnam en tant que conflit mondial contre le communisme. Certains de nos alliés au Congrès ne manqueront pas de souligner que malgré notre historique d'aide au Pakistan, ils semblent réticents à nous rendre la pareille et à nous aider. Les Pakistanais sont surtout préoccupés par leurs propres conflits dans la région et par le risque de réactions négatives au niveau national s'ils envoient des troupes."
 Dem_Ayub65.5.d:0 "Le président Ayub Khan nous a informé qu'il enverrait une division d'infanterie au Vietnam. Il a déclaré que ses hauts officiers militaires réfléchissaient déjà à l'unité à envoyer et que le Pakistan était fier de perpétuer l'héritage historique des déploiements militaires sud-asiatiques à l'étranger pour assurer la sécurité mondiale. Son gouvernement publiera bientôt une déclaration publique expliquant que la décision était basée sur les liens existants avec les États-Unis et sur le désir d'aider le peuple vietnamien contre les maux du communisme de style soviétique. Nous donnerons bientôt l'ordre d'envoyer les armes et l'argent promis au gouvernement pakistanais."
 Dem_Ayub65.6.d:0 "Malgré quelques grandes manifestations d'étudiants universitaires, le gouvernement du Pakistan a confirmé qu'une division d'infanterie s'embarquait pour se déployer au Vietnam. Cette force est censée contribuer à la sécurité de l'Asie contre une idéologie communiste européenne violente. Les Pakistanais évitent soigneusement toute critique du communisme pour éviter de contrarier la Chine. Depuis que le gouvernement a annoncé ses intentions, des protestations ont eu lieu de la part de militants de gauche et de militants religieux. Tous deux accusent le gouvernement de soutenir l'impérialisme occidental et de vendre la vie des Pakistanais contre de l'argent. L'armée pakistanaise semble favorable à cette initiative, mais en privé, il semble que de nombreux officiers et soldats aient travaillé dur pour éviter d'être déployés à l'étranger. Quoi qu'il en soit, le gouvernement pakistanais reste engagé et a refusé de préciser ce que le gouvernement américain fournit au Pakistan en échange de son aide."

 KASHMIR_60s.1.d:0 "Le gouvernement pakistanais nous a demandé de mener des négociations sur la crise du Cachemire. Il est probable qu'ils chercheront à mettre en oeuvre les résolutions de l'ONU. Cependant, nous pouvons certainement voir s'ils souhaitent peut-être parvenir à un compromis. Certains hauts responsables estiment que la situation actuelle au Cachemire n'est pas tolérable en tant que solution à long terme et que ce qui se passe dans cet État pourrait avoir un impact négatif sur l'ensemble de l'Union indienne. Ils craignent également que les tensions persistantes n'entravent l'économie et la réputation internationale de l'Inde. Ils pensent que nous devrions tenir les négociations. D'autres membres du cabinet affirment que le Cachemire fait partie intégrante de l'Inde et que ce n'est pas du tout une question du Pakistan ou de la communauté internationale. En effet, le Pakistan lui-même est l'occupant et il n'agit ainsi que pour empêcher sa défaite inévitable. Nous devons décider de tenir ou non des négociations."
 KASHMIR_60s.3.d:0 "Nous menons des discussions approfondies avec les dirigeants indiens. Après de nombreuses disputes et discussions, ils nous ont donné une position sur le Cachemire. Ils suggèrent de faire de la ligne de cessez-le-feu actuelle au Cachemire la frontière permanente. Le Pakistan et l'Inde renonceraient alors à toute revendication sur l'ensemble du Cachemire. La normalisation de la frontière serait alors la base d'une relation renouvelée entre l'Inde et le Pakistan. Après la présentation indienne, les dirigeants pakistanais se sont réunis en privé pour discuter d'une réponse. Deux perspectives ont émergé au cours de ce débat enflammé. Un groupe considérait la proposition comme une fin raisonnable au différend et un moyen de normaliser les relations indo-pakistanaises. Un autre groupe y a vu une trahison humiliante envers les peuples du Cachemire et du Pakistan. Ils soutiennent qu'il faut mettre un terme aux négociations et amener l'Inde aux Nations Unies."
 KASHMIR_60s.4.d:0 "Le gouvernement pakistanais a annoncé la fin du conflit du Cachemire à la suite des pourparlers de haut niveau de Murree. Le Pakistan et l'Inde ont convenu de faire de la ligne de cessez-le-feu au Cachemire la frontière permanente. Le gouvernement a déclaré que la normalisation de la frontière mènerait à la paix, à la prospérité et à la réunion du peuple cachemirien à long terme à travers une frontière pacifique. Cependant, cette déclaration optimiste a suscité de vives critiques de la part des journaux ourdous et une réponse tiède de la part des journaux anglais. De nombreux articles ont critiqué le gouvernement pour avoir trahi le Cachemire au profit de l'Inde et abandonné la vision du Pakistan. Dans tout le pays, des milliers de personnes sont descendues dans la rue pour protester contre la décision du gouvernement. Certains chefs religieux ont été arrêtés par la police locale pour avoir appelé à la révolution. Des rumeurs font état de troubles parmi les officiers militaires qui estiment que le gouvernement cède aux demandes indiennes."
 KASHMIR_60s.5.d:0 "Le gouvernement indien a annoncé la fin du conflit du Cachemire à la suite des pourparlers de haut niveau de Murree. L'Inde et le Pakistan ont convenu de faire de la ligne de cessez-le-feu au Cachemire la frontière permanente. Dans sa déclaration, le gouvernement a noté que l'animosité et la menace de violence armée se dissiperaient bientôt et que le peuple indien pouvait espérer plus de paix et de prospérité. Le statut actuel du Cachemire au sein de la constitution indienne sera bientôt ajusté pour introduire le Cachemire comme un État à part entière au sein de l'Union indienne. Bien que la presse ait largement soutenu le gouvernement, considérant l'accord comme une victoire pour lui, certaines publications plus radicales soutiennent que l'ensemble du Cachemire devrait faire partie de l'Inde et que le gouvernement a restitué les terres volées par le Pakistan en 1949 avec l'accord de cessez-le-feu initial. Indépendamment de ces critiques, l'accord reste largement populaire au niveau national et à l'échelle internationale, l'Inde est considérée comme la gagnante."
 KASHMIR_60s.6.d:0 "Nous menons des discussions approfondies avec les dirigeants indiens. Après de nombreuses disputes et discussions, ils nous ont donné une position sur le Cachemire. Ils ont suggéré de diviser le Cachemire selon des lignes communautaires et stratégiques. Dans cette proposition, les deux parties renonceraient à leurs revendications mutuelles au Cachemire, le Pakistan recevrait la vallée du Cachemire, y compris Srinagar. En échange, l'Inde conserverait le contrôle de Jammu et insistait pour des raisons stratégiques sur le fait qu'elle devait également contrôler le Ladakh. Les dirigeants pakistanais se sont ensuite réunis en privé pour discuter de la proposition, ce qui a donné lieu à deux réponses potentielles. Un groupe considère la proposition comme très avantageuse : le Pakistan atteindrait son objectif de libération de la vallée du Cachemire. Jammu avait une majorité hindoue et le Ladakh était un prix acceptable. L'autre groupe a cependant fait valoir que l'offre montrait que l'Inde craignait que l'ONU ne soit impliquée pour forcer un plébiscite et que le Pakistan devrait mettre fin aux pourparlers et tenter sa chance à l'ONU pour l'ensemble du Cachemire."
 KASHMIR_60s.7.d:0 "Un bataillon d'infanterie de l'Azad Cachemire du Pakistan est entré à Srinagar pour prendre le contrôle de la ville au nom du gouvernement indien pour le Pakistan. Lors d'une cérémonie élégante, les deux parties ont organisé une cérémonie conjointe de descente et de lever du drapeau. Les dernières troupes et responsables indiens sont partis avec tous les honneurs, conformément au plan de partition indo-pakistanais récemment signé lors de la conférence de Murree sur le Cachemire. Alors que les troupes et les responsables pakistanais s'installaient dans la vallée du Cachemire, de nombreux Cachemiriens les suivirent de près, dans l'espoir de renouer avec leurs familles séparées lors de la première guerre du Cachemire. Bien que certains chefs religieux et nationalistes aient condamné l'accord au motif qu'il ne garantissait pas la totalité du Cachemire, de nombreux Pakistanais ont salué cette décision et y voient un compromis favorable qui concrétise la promesse faite par le Pakistan aux musulmans de la vallée du Cachemire. Les informations faisant état de panique et d'affrontements communautaires le long de la nouvelle frontière avec Jammu n'ont pas gâché les nouvelles pour les Pakistanais."
 KASHMIR_60s.8.d:0 "À la suite de la conférence de Murree sur le Cachemire, de nombreux Indiens, notamment d'extrême droite et d'extrême gauche, ont été mécontents du plan de partition indo-pakistanais. Ceux de droite s'y sont opposés en considérant qu'il s'agissait d'une cession au Pakistan de terres indiennes souveraines. Pour la gauche, l'accord de partition selon des lignes largement communautaires a été condamné comme contraire à l'esprit de la laïcité indienne. Quoi qu'il en soit, le gouvernement et l'armée indiens ont largement réussi à céder la vallée du Cachemire avec honneur. Les incidents de violence communautaire le long de la nouvelle frontière de Jammu ont été minimisés grâce à l'action des forces indiennes dans la région. De nombreux réfugiés hindous cachemiris de la première guerre du Cachemire ont lancé des manifestations et qualifié l'accord de trahison et de légitimation de la violence pakistanaise. Quoi qu'il en soit, beaucoup espèrent désormais que le Pakistan et l'Inde pourront transformer leur relation d'animosité en relation d'amitié."
 KASHMIR_60s.9.d:0 "Nous menons des discussions approfondies avec les dirigeants indiens. Après de nombreuses disputes et discussions, ils nous ont donné une position sur le Cachemire. Au grand choc des dirigeants pakistanais, le gouvernement indien a proposé de mettre en oeuvre les résolutions de l'ONU et d'autoriser l'organisation à organiser un plébiscite sur le statut final du Cachemire. Les dirigeants pakistanais se sont réunis pour discuter de la tournure incroyable des événements. Comme les Indiens offraient ce que le Pakistan exigeait depuis le début, il n'y avait pas grand-chose à discuter. Les Pakistanais sont revenus et ont accepté l'offre indienne. Les deux pays ont envoyé leurs plus hauts diplomates aux Nations Unies afin de préparer le terrain pour la mise en oeuvre des résolutions."
 KASHMIR_60s.10.d:0 "Le Pakistan a accueilli l'Inde pour des pourparlers de haut niveau à la station de Murree pour la Conférence de Murree sur le Cachemire. Les négociations se sont malheureusement soldées par un échec. Aucune des deux parties ne semblait disposée ou prête à faire des compromis sur sa position. Lorsque la délégation indienne est rentrée chez elle, ses membres auraient déclaré que le Pakistan nourrissait des attentes irréalistes et manifestait un désir évident de territoire indien. Le gouvernement pakistanais a publié une déclaration accusant l'Inde de son manque de flexibilité et de sa volonté de perpétuer une occupation illégale. Le ministère pakistanais des Affaires étrangères a annoncé son intention de présenter une résolution aux Nations Unies appelant à des sanctions jusqu'à ce que l'Inde accepte de mettre en oeuvre les résolutions de l'ONU sur le Cachemire."

 UN_KASHMIR.1.d:0 "Le gouvernement pakistanais a envoyé ses plus hauts diplomates aux Nations Unies afin de présenter une résolution exigeant que l'Inde mette en oeuvre la résolution 47 de l'ONU sous peine de sanctions économiques de la part de la communauté internationale. La délégation pakistanaise a noté que l'Inde avait largement refusé de discuter du Cachemire ou de proposer une quelconque voie réaliste vers une résolution juste. Pour cette raison, le Pakistan se tourne désormais vers les Nations Unies pour obtenir justice et trouver une solution. La résolution devrait parvenir au Conseil de sécurité et le Pakistan espère que les États-Unis et l'Union soviétique choisiront de ne pas y opposer leur veto. Les diplomates indiens discutent déjà avec les deux pays, soulignant leur position et leur opposition à ce qu'ils appellent le chantage international."
 UN_KASHMIR.2.d:0 "Une récente résolution pakistanaise appelant l'Inde à mettre en oeuvre la résolution 47 de l'ONU, qui appelle à un plébiscite au Cachemire, sous peine de sanctions, est actuellement examinée par les diplomates du Conseil de sécurité. Le gouvernement indien a déjà exprimé son souhait que nous opposions notre veto à la résolution, affirmant que si elles étaient adoptées, les sanctions économiques nuiraient principalement aux partenaires commerciaux indiens. Certains diplomates sont d'accord et affirment qu'en dépit de notre amitié avec le Pakistan, sacrifier les opportunités en Inde serait insensé. D'autres conseillers soulignent la neutralité indienne et les rumeurs de flirt avec l'Union soviétique. Ils estiment que nous ne devrions pas utiliser le veto, préserver nos liens avec le Pakistan et démontrer notre engagement envers le système des Nations Unies que nous avons consacré tant de temps et d'énergie à établir."
 UN_KASHMIR.3.d:0 "Une récente résolution pakistanaise appelant l'Inde à mettre en oeuvre la résolution 47 de l'ONU, qui appelle à un plébiscite au Cachemire, sous peine de sanctions, est actuellement examinée par les diplomates du Conseil de sécurité. Le gouvernement indien a déjà exprimé son souhait que nous opposions notre veto à la résolution, affirmant que si elles étaient adoptées, les sanctions économiques nuiraient principalement aux partenaires commerciaux indiens. Contrairement au Pakistan, l'Inde s'est parfois montrée ouverte à notre État et à notre idéologie. Le veto pourrait améliorer les relations et contribuer à rapprocher l'Inde de notre orbite. D'autres conseillers soulignent cependant que le maintien de la résolution pourrait renforcer nos liens avec le Pakistan et nous donner plus de poids diplomatique avec l'Inde. En n'opposant pas de veto, nous ferons pression sur l'Inde pour qu'elle soutienne plus fermement l'Union soviétique et évite la neutralité ou une orientation pro-occidentale."
 UN_KASHMIR.4.d:0 "La délégation américaine au Conseil de sécurité a annoncé que les États-Unis opposeraient leur veto à la résolution pakistanaise sur le Cachemire. Par la suite, les diplomates américains n'ont pas tardé à dire à quel point ils sympathisaient avec le peuple du Cachemire et comprenaient la frustration du Pakistan. Cependant, ils ont déclaré que l'ONU était un lieu de paix internationale et que, par principe, l'Amérique ne pouvait pas soutenir une telle résolution qui menaçait un État membre de sanctions s'il ne s'y conformait pas. La délégation pakistanaise a semblé ouvertement abattue et la nouvelle a déjà suscité des éditoriaux et des protestations anti-américaines."
 UN_KASHMIR.5.d:0 "Lors d'une récente réunion du Conseil de sécurité, la délégation soviétique a indiqué qu'elle opposerait son veto à la récente résolution du Pakistan sur le Cachemire. Cela constitue un coup dur porté aux récents efforts diplomatiques du Pakistan visant à parvenir à une résolution du différend au Cachemire. Après la réunion, les diplomates soviétiques ont déclaré qu'ils estimaient que la résolution paraissait unilatérale. Au Pakistan, le gouvernement serait furieux de ce revers, les politiciens de l'opposition accusant le gouvernement d'être responsable de l'échec de sa tentative. Des manifestations antisoviétiques ont éclaté dans les grandes villes. Le gouvernement indien a exprimé sa gratitude et ses remerciements aux Soviétiques pour avoir mis fin à ce qu'ils considéraient comme une résolution biaisée."
 UN_KASHMIR.6.d:0 "Après quelques ajustements dans la formulation, la résolution appelant à la mise en oeuvre de la résolution 47 par l'Inde a été adoptée. Cette nouvelle résolution, défendue par le Pakistan et ses partisans, nous appelle à mettre en oeuvre les trois étapes décrites dans la résolution 47 pour mener à bien un plébiscite dans l'ancien État princier de Jammu-et-Cachemire. Si nous ne nous conformons pas et n'acceptons pas d'organiser le plébiscite, les Nations Unies imposeront des sanctions économiques à notre nation. Cependant, la nouvelle formulation rend vague l'étendue des sanctions. Le cabinet est divisé, certains préconisent la mise en oeuvre de la résolution 47 et espèrent que le Cachemire fera le bon choix. D'autres soutiennent que la résolution constitue une atteinte flagrante à notre souveraineté et à la volonté du peuple cachemirien. Ils disent que nous devrions refuser et prendre les sanctions. L'économie indienne est bien trop grande pour être sanctionnée pendant une longue période."
 UN_KASHMIR.7.d:0 "New Delhi, [?global.date.GetDateStringNoHourLong] - Le gouvernement indien a rejeté la nouvelle résolution du Conseil de sécurité sur le Cachemire, refusant d'accepter sa demande d'un plébiscite sous la menace de sanctions économiques. Un communiqué officiel a décrit cette mesure comme une atteinte à la souveraineté indienne et a comparé la pression extérieure à la coercition à laquelle l'Inde avait résisté sous le régime colonial.\n\nLe Pakistan a condamné ce refus et a demandé que les dispositions relatives aux sanctions soient appliquées. Sa délégation a fait valoir qu'un autre rejet entraînerait le report indéfiniment du vote promis, tandis que l'Inde a soutenu que le Conseil tentait de dicter un règlement à des conditions controversées.\n\nWashington et Moscou ont exprimé leur inquiétude sans annoncer les mesures qu'ils entendent prendre. La résolution laisse imprécise l'étendue des sanctions, donnant aux gouvernements une latitude considérable en matière de restrictions commerciales. Les responsables indiens doivent désormais compter avec des sanctions économiques dont la gravité dépendra des décisions des capitales étrangères."
 UN_KASHMIR.8.d:0 "Notre décision de rejeter la récente résolution de l'ONU a incité de nombreux pays à mettre en oeuvre certaines formes de sanctions économiques contre notre pays. Cependant, la résolution n'a été adoptée qu'après que la formulation sur l'étendue des sanctions soit devenue vague. Cela signifie que même si notre économie sera gravement touchée, les sanctions ne devraient pas être aussi paralysantes que l'espéraient les Pakistanais. Les Nations Unies ont également déclaré que les sanctions seraient immédiatement levées si nous acceptions d'organiser un plébiscite comme le prévoit la résolution 47 de l'ONU. De nombreux conseillers étrangers et économiques prédisent que ces sanctions ne seront probablement pas permanentes et qu'avec de la patience, nous pourrions même les voir complètement levées."
 UN_KASHMIR.9.d:0 "Comme l'avaient prédit nombre de nos experts, les sanctions imposées par les Nations Unies sont en train d'être assouplies par de nombreux pays. Il semble que de nombreux pays craignent de perdre des opportunités d'accéder à nos marchés ou d'obtenir de précieux contrats de notre gouvernement. Il y a encore des sanctions et elles ont un impact, mais on en tire des leçons. Les experts prédisent désormais qu'à long terme, on peut s'attendre à une fin complète des sanctions. La possibilité d'organiser un plébiscite au Cachemire est toujours disponible et si elle était mise en oeuvre, cela mettrait fin à toutes les sanctions."
 UN_KASHMIR.10.d:0 "New Delhi, [?global.date.GetDateStringNoHourLong] - L'Inde a accepté de coopérer avec le Pakistan et les Nations Unies pour préparer un plébiscite au Cachemire. Le gouvernement a déclaré que sa décision faisait suite à un examen des conditions du vote, rejetant les suggestions selon lesquelles il aurait cédé à des pressions extérieures.\n\nL'accord prévoit des retraits sous contrôle de l'ONU avant que les habitants de l'ancien Etat princier ne choisissent entre l'Inde et le Pakistan. New Delhi a conditionné la poursuite de sa coopération au respect des accords par le Pakistan. Une force de l'ONU est en cours de constitution pour assister les observateurs déjà stationnés le long de la ligne de cessez-le-feu.\n\nLe Secrétaire général a salué cette annonce mais a averti que les mouvements militaires et les préparatifs électoraux nécessiteraient un accord durable entre les deux gouvernements. L'acceptation met également fin aux sanctions imposées suite au refus indien, partout où ces restrictions restent en vigueur. Aucune date de scrutin n'a encore été annoncée."
 UN_KASHMIR.11.d:0 "Srinagar, [?global.date.GetDateStringNoHourLong] - Les troupes des Nations Unies sont arrivées le long de la ligne de cessez-le-feu au Cachemire pour superviser les dispositions militaires précédant un plébiscite. Ils rejoignent les observateurs de l'ONU dont les patrouilles et les rapports suivent la division de l'ancien Etat princier depuis le cessez-le-feu.\n\nLe nouveau commandement organise des conférences séparées avec des officiers indiens et pakistanais sur les itinéraires de retrait et l'évacuation des positions militaires. Les forces pakistanaises doivent partir les premières. Le retrait indien suivra une fois que les officiers de l'ONU pourront établir que la phase initiale est en cours.\n\nLa sécurité locale et l'accès à travers le territoire divisé restent des questions qui nécessitent un accord détaillé. Le départ d'aucune des deux armées n'ouvrira à lui seul les élections : une administration électorale doit encore organiser le vote et les conditions de campagne. Pour le moment, la tâche immédiate du commandement de l'ONU est d'empêcher qu'un poste vacant ne devienne une invitation à l'autre armée."
 UN_KASHMIR.12.d:0 "Muzaffarabad, [?global.date.GetDateStringNoHourLong] - Les forces pakistanaises ont commencé à se retirer au-delà des frontières de l'ancien État princier du Jammu-et-Cachemire. Des officiers de l'ONU supervisent l'évacuation des positions alors que la première étape militaire de l'accord du plébiscite entre en vigueur.\n\nLe retrait a mis au grand jour un différend sur le maintien de l'ordre. L'Inde a proposé d'envoyer sa propre police dans les zones évacuées, mais le commandement de l'ONU a accepté la police locale existante, formée par le Pakistan, comme étant capable de maintenir l'ordre. Les troupes régulières pakistanaises doivent partir sans une avancée indienne dans le terrain qu'elles quittent.\n\nLes officiers pakistanais restent préoccupés par le fait que leur retrait pourrait exposer le territoire si l'Inde ne respecte pas son engagement. Les troupes de l'ONU sont stationnées entre les deux camps pendant que des observateurs vérifient le respect des dispositions. La confirmation du retrait pakistanais doit permettre aux forces indiennes de quitter leurs propres positions selon la séquence convenue."
 UN_KASHMIR.13.d:0 "Alors que nos forces commencent leur retrait ordonné du Cachemire, conformément aux directives de l'ONU sur la mise en oeuvre du plébiscite, certains commandants expriment leur inquiétude face aux pièges indiens potentiels. La résolution de l'ONU a déclaré que les forces militaires du Pakistan et de l'Inde devaient se retirer, mais nous disposons de forces paramilitaires locales qui ne font pas partie des forces régulières de l'armée pakistanaise. En particulier, les Gilgit Scouts étaient une milice recrutée parmi les habitants. Nous pouvons facilement insister pour que ces forces restent au Cachemire en tant qu'unité de maintien de l'ordre. Le commandant de l'ONU peut facilement être convaincu. Nous laisserons derrière nous plusieurs de nos officiers et soldats supérieurs avec les Gilgit Scouts, ainsi que du matériel supplémentaire, au cas où il y aurait des problèmes avec le vote."
 UN_KASHMIR.14.d:0 "Srinagar, [?global.date.GetDateStringNoHourLong] - Les unités de l'armée et de l'air indiennes ont commencé à se retirer du Cachemire sous la supervision de l'ONU. Ce mouvement fait suite à la confirmation que les forces pakistanaises procèdent à leur départ, satisfaisant ainsi la condition posée par l'Inde pour la prochaine étape de l'accord.\n\nLes équipements et le personnel militaires sont retirés des postes occupés depuis les combats qui ont divisé l'ancien État princier. La police locale poursuivra ses tâches ordinaires de sécurité tandis que la force de l'ONU supervisera la séparation des armées. Les officiers indiens se sont dits convaincus qu'un vote justifierait les revendications de leur pays, même si aucun résultat ne peut encore être attendu.\n\nL'achèvement du retrait permettra à l'administration du plébiscite de reprendre son travail. Les arrangements doivent permettre une campagne politique des deux côtés de la ligne de cessez-le-feu sans que les armées régulières ne retournent à leurs anciens postes. La prochaine annonce devrait concerner l'arrivée de l'administrateur désigné de l'ONU."
 UN_KASHMIR.15.d:0 "La résolution de l'ONU est claire : nous devons retirer nos forces militaires régulières, mais nous devons laisser la police locale assurer l'ordre public. Les Jammu and Kashmir Rifles faisaient partie des forces de l'État princier du Cachemire et nous pouvons facilement convaincre le commandement de l'ONU de nous autoriser à laisser plusieurs bataillons derrière nous pour des raisons de sécurité. Avec ces troupes, nous pouvons laisser du matériel supplémentaire et certains de nos officiers et troupes supérieurs. Cette force serait une éventualité pour empêcher les chicanes pakistanaises ou tout problème qui pourrait surgir après le plébiscite."
 UN_KASHMIR.16.d:0 "Srinagar, [?global.date.GetDateStringNoHourLong] - Le maréchal Slim est arrivé à Srinagar en tant qu'administrateur du plébiscite des Nations Unies pour le Cachemire. Son arrivée ouvre la phase électorale du règlement suite au retrait supervisé des forces régulières indiennes et pakistanaises.\n\nLe service de Slim dans l'armée indienne britannique a fait de lui une figure familière des officiers supérieurs des deux camps. Il reprend la mission initialement confiée à l'amiral Chester Nimitz. Dans sa première déclaration, le nouvel administrateur a appelé à coopérer pour organiser un vote libre et à éviter toute interférence avec ceux qui se préparent à voter.\n\nL'Inde et le Pakistan peuvent désormais faire campagne pour leur adhésion pendant que l'administration des Nations Unies prépare le scrutin. Les électeurs choisiront entre les deux pays ; les arrangements ne prévoient aucune option distincte d'indépendance. Les plaintes concernant l'intimidation et la conduite de la campagne soumettront à un examen attentif les assurances de l'administrateur concernant une supervision impartiale."
 UN_KASHMIR.17.d:0 "Srinagar, [?global.date.GetDateStringNoHourLong] - Les Cachemiriens se sont rendus aux urnes lors du plébiscite des Nations Unies sur l'adhésion à l'Inde ou au Pakistan. De nombreux électeurs se sont rendus sur ce territoire divisé, et l'attention se porte désormais sur le décompte et l'annonce de l'administrateur.\n\nLes militants en faveur du Pakistan ont présenté l'adhésion comme l'accomplissement du droit de l'État à majorité musulmane de déterminer son allégeance. Les partisans de l'Inde ont exhorté les électeurs à rester au sein d'une union laïque, un argument particulièrement fort parmi de nombreux hindous et sikhs. Ceux qui souhaitaient un Cachemire indépendant n'ont pas eu ce choix lors du scrutin.\n\nLes journaux et les stations de radio des deux pays attendent le résultat. Le décompte déterminera quel gouvernement recevra le territoire administré par l'autre, mais les promesses faites pendant la campagne vont au-delà du transfert lui-même. Quel que soit le résultat, les nouvelles autorités seront confrontées à des demandes de protection de la part des habitants qui ont voté contre elles."
 UN_KASHMIR.18.d:0 "Srinagar, [?global.date.GetDateStringNoHourLong] - L'administrateur du plébiscite des Nations Unies a annoncé que le Cachemire avait voté pour l'adhésion au Pakistan. Le résultat appelle au transfert du territoire administré par l'Inde dans le cadre du règlement convenu avant le scrutin.\n\nLes bureaux de journaux du Pakistan ont publié des éditions spéciales et les foules se sont rassemblées pour célébrer. Le gouvernement a salué le résultat comme la réalisation du droit des Cachemiriens à l'autodétermination. Sa déclaration promettait également une protection aux habitants hindous et sikhs préoccupés par leur position sous la domination pakistanaise.\n\nL'Inde n'a pas encore publié de réponse officielle. Le résultat laisse au gouvernement pakistanais le soin d'organiser la rétrocession des territoires qu'il revendique depuis longtemps, tandis que les responsables pakistanais doivent se préparer à administrer les communautés divisées sur l'adhésion. Pour les ménages minoritaires, les assurances du Pakistan concernent des questions immédiates de sécurité personnelle et de propriété lors du passage de l'autorité entre les deux pays."
 UN_KASHMIR.19.d:0 "Les Nations Unies ont annoncé les résultats du vote. Il s'agit d'un résultat choquant et nos responsables craignent que le Pakistan n'ait manipulé les résultats en leur faveur. Plus préoccupantes sont les informations selon lesquelles des minorités du Cachemire fuient ou se préparent à partir avant l'arrivée des Pakistanais. Il est clair qu'on ne peut pas faire confiance aux Pakistanais pour protéger ces personnes de la violence communautaire et, en effet, certains rapports font état de Cachemiriens musulmans ciblant leurs voisins non musulmans. Heureusement, l'armée indienne nous a informés que les Jammu and Kashmir Rifles, toujours au Cachemire, peuvent rapidement sécuriser Jammu et protéger les minorités de nouvelles violences. Un tel acte provoquerait sans aucun doute la colère du Pakistan."
 UN_KASHMIR.20.d:0 "Srinagar, [?global.date.GetDateStringNoHourLong] - Le Cachemire a voté pour l'adhésion à l'Inde, a annoncé l'administrateur du plébiscite des Nations Unies. Aux termes du règlement convenu, le Pakistan doit renoncer au territoire qu'il administre au sein de l'ancien État princier.\n\nLes stations de radio indiennes ont interrompu leurs programmes avec les informations, tandis que les foules se rassemblaient dans les villes pour célébrer. Le gouvernement a décrit le vote comme une justification de la démocratie et de la laïcité indiennes et s'est engagé à traiter l'égalité de traitement pour les habitants du Cachemire. Ses partisans ont salué le résultat obtenu grâce au scrutin après des années de confrontation militaire.\n\nLe Pakistan n'a pas encore fait de déclaration officielle. Des rapports émanant de villes pakistanaises font état de manifestations de colère et des allégations d'irrégularités circulent dans les zones où le vote était sous l'administration pakistanaise. Ces allégations n'ont pas été établies. La question immédiate est de savoir si les responsables locaux et les formations armées accepteront le résultat annoncé et permettront le transfert."
 UN_KASHMIR.21.d:0 "D'après les résultats annoncés par les Nations Unies, il est clair que l'Inde s'est livrée à une manipulation massive pour obtenir le résultat souhaité. Nos frères cachemiris tentent déjà désespérément de fuir vers le territoire pakistanais dans l'espoir d'éviter une nouvelle oppression anti-musulmane indienne. Heureusement, l'armée pakistanaise a laissé derrière elle les Gilgit Scouts pour parer à une telle éventualité. Si nous donnons l'ordre, nos troupes devraient être en mesure de sécuriser le Gilgit-Baltistan, protégeant la frontière pakistanaise et offrant un refuge aux réfugiés en quête de liberté. Le peuple pakistanais souffre des résultats et exige des mesures."

 PAK_Afghan_War.1.d:0 "L'Union soviétique est récemment intervenue en Afghanistan pour soutenir son allié communiste. Ils utilisent la force armée pour contraindre brutalement les Afghans à adopter une idéologie étrangère et l'athéisme. Cependant, l'Afghanistan est depuis longtemps un bastion de l'Islam et une nation fière. Beaucoup de ses habitants fuient désormais vers le Pakistan et nous avons l'obligation morale, en tant que musulmans, de les laisser passer. Cependant, cet afflux de réfugiés entraînera une ponction de nos ressources, mais nous devrons résister à la tempête."
 PAK_Afghan_War.2.d:0 "Le gouvernement pakistanais demande une aide économique et militaire face à une menace soviétique directe. Du jour au lendemain, les Pakistanais sont devenus un État de première ligne contre les Soviétiques. Un échec à soutenir les Pakistanais pourrait ouvrir la porte à une plus grande implication chinoise ou, pire encore, à une expansion soviétique. L'armée pakistanaise a désespérément besoin de nouvelles armes, notamment d'artillerie et d'avions de combat. Le gouvernement est davantage intéressé par une aide économique susceptible de contribuer à faire face à la crise massive des réfugiés afghans et à stimuler un boom économique pour le pays. Les Pakistanais estiment qu'une crise militaire ou économique à ce stade pourrait être préjudiciable à l'ensemble de la région."
 PAK_Afghan_War.3.d:0 "Notre ami frère le Pakistan nous a demandé une aide économique et militaire importante. Plus précisément, ils demandent si nous pourrions contribuer avec nos propres ressources et celles des autres États arabes pour les soutenir face aux troupes soviétiques à leur frontière. Le Pakistan insiste sur le fait qu'il est le premier bastion de la défense de l'Islam sur son flanc oriental et que tous les musulmans devraient se sentir fiers de les aider dans leur noble lutte. Nous pouvons leur offrir des subventions économiques pour stimuler leur économie et réduire l'impact économique des réfugiés afghans qui inondent le pays. En outre, nous pouvons fournir des subventions militaires pour permettre au Pakistan d'acheter davantage d'armes pour les moudjahidines."
 PAK_Afghan_War.4.d:0 "Les dirigeants des services de renseignement pakistanais nous ont demandé d'étendre l'opération Cyclone, notre programme clandestin d'achat et de transport d'armes pour les combattants moudjahidines au Pakistan. Actuellement, nous achetons des armes et les envoyons aux agents des renseignements pakistanais qui les distribuent aux différentes bandes moudjahidines. Nous entretenons de solides relations de travail et sommes satisfaits des rapports d'opérations sur le terrain. Les Pakistanais prétendent disposer d'une infrastructure solide pour la distribution d'armes et sont capables de transporter encore plus d'armes et d'étendre leurs missions de formation pour permettre aux forces moudjahidines de mener des opérations plus avancées. L'extension de l'opération affaiblira l'armée soviétique, mais elle entraînera davantage de possibilités de corruption parmi les officiers de renseignement de bas niveau au Pakistan, mais cela ne suffira pas à entraver l'opération."

 Zia_Era.1.d:0 "Karachi fait face à d'intenses protestations étudiantes. Les étudiants universitaires de toute la ville protestent continuellement contre les restrictions imposées par la loi martiale et appellent au rétablissement de la démocratie. Les étudiants qui prétendent que Zulfikar Bhutto était un martyr et que les personnes impliquées dans sa mort devraient être arrêtés sont plus dangereux. Les Rangers locaux et la police ont présenté des listes de leaders étudiants éminents de la ville. Ils souhaiteraient l'approbation du gouvernement de la loi martiale et des troupes locales pour arrêter ces dirigeants et, espérons-le, perturber les manifestations. Cependant, une telle action pourrait finir par aggraver les troubles. Certains conseillers politiques affirment que les risques potentiels sont trop élevés et que nous devrions simplement tolérer ces manifestations jusqu'à ce qu'elles s'éteignent naturellement."
 Zia_Era.2.d:0 "Les opérations combinées des Rangers et de la police pour arrêter les dirigeants des manifestations étudiantes n'ont pas réussi à réprimer les soulèvements étudiants. Au lieu de cela, encore plus d'étudiants sont descendus dans la rue, beaucoup indignés par la vue des troupes armées prenant d'assaut les bâtiments du campus. Les administrateurs de l'université constatent qu'ils sont incapables de contrôler les manifestants car ces étudiants n'ont plus de direction établie. L'espoir que ces arrestations mettraient un terme aux troubles qui ravagent la province a clairement échoué. Les étudiants en détention sentent leur avantage et refusent de coopérer aux efforts visant à désamorcer la situation. Nous devrons attendre."
 Zia_Era.3.d:0 "Les opérations combinées des Rangers et de la police pour arrêter les dirigeants étudiants des manifestations ont largement réussi à réduire les protestations. Il semble que de nombreux étudiants aient été effrayés par ces arrestations soudaines et soient plus disposés à se concentrer sur leurs études plutôt que de participer à des manifestations. Après interrogatoires, certains dirigeants étudiants ont été libérés, avec la promesse qu'ils s'abstiendraient non seulement d'organiser des troubles, mais qu'ils aideraient activement l'administration universitaire à freiner certains des groupes étudiants les plus tenaces. Le quartier général de la loi martiale, Karachi, a fait l'éloge des officiers, des soldats et des policiers impliqués dans ces opérations."
 Zia_Era.4.d:0 "La puissance militaire pakistanaise dans le Sind est contrôlée par le V Corps, basé à Karachi. Le général Zia ul-Haq a placé le lieutenant-général S.M. Abbasi aux commandes du V Corps et gouverneur militaire du Sind. Cet officier d'artillerie hautement décoré devrait éviter de jouer les favoris politiques et de prévenir la corruption dans la capitale économique du pays. Maintenir l'ordre sera une tâche difficile car Karachi est un bastion du PPP et Zulfikar Bhutto est un fils natif du Sind. Faire face aux troubles urbains liés au régime militaire, aux irréductibles du PPP et aux nationalistes sindhi ne sont que quelques-uns des défis auxquels est confronté le général Abbasi."
 Zia_Era.5.d:0 "L'administration de la loi martiale du Sindh continue de faire face à une résistance considérable de la part des bastions du PPP situés dans tout le Sindh, mais particulièrement à Karachi et Larkana. Depuis ces endroits, le PPP organise des manifestations, des grèves et des attaques contre des symboles ou des entreprises pro-gouvernementales. Certains officiers supérieurs ont élaboré un plan pour lancer une vaste campagne de répression visant à démanteler définitivement ces bastions du PPP. Ce serait quelques mois compliqués, mais cela pourrait peut-être mettre fin à ce problème ennuyeux. Certains conseillers civils notent cependant qu'ils ont des contacts au sein du PPP et qu'ils seraient prêts à négocier un cessez-le-feu avec le PPP. Si nous acceptons de ne pas lancer d'opérations ou de provocations, ils accepteront probablement de mettre un terme à leurs opérations perturbatrices et de se concentrer plutôt sur leur action politique."
 Zia_Era.6.d:0 "Nos efforts pour réprimer les bastions du PPP ont largement échoué. De nombreux dirigeants du PPP restent en liberté car les tentatives pour les appréhender échouent souvent. Les habitants font généralement part des mouvements policiers ou militaires, ce qui leur laisse suffisamment de temps pour fuir ou entrer dans la clandestinité. Non seulement ces opérations ont été inefficaces, mais de nombreux militants du PPP sont devenus militants et ont prêté allégeance à l'organisation terroriste Al Zulfikar dirigée par les fils de Zulfikar Bhutto. Ils mènent déjà des attaques par délit de fuite à Karachi et le groupe devrait causer davantage de problèmes dans tout le Sind. Même si le groupe ne devrait pas renverser le régime, ses actions entraveront le développement économique du Sind."
 Zia_Era.7.d:0 "Le général Zia ul-Haq a nommé le lieutenant-général Ghulam Jilani Khan au poste de gouverneur du Pendjab et d'administrateur de la loi martiale de la province. Le Pendjab, la plus grande province du Pakistan et la base de son recrutement militaire et de ses infrastructures, doit être fermement sous le contrôle du régime. Le général Jilani est un officier d'infanterie qui a servi pendant la Seconde Guerre mondiale avant de rejoindre l'armée pakistanaise après l'indépendance. Il a également été chef du renseignement pendant une grande partie des années 70, ce qui en fait un adepte de la politique locale et de l'établissement d'alliances. Le général Zia s'attend à ce que son nouveau gouverneur non seulement maintienne la paix, mais aide Zia à établir des relations avec les intérêts pendjabis qui peuvent élargir sa base de soutien."
 Zia_Era.8.d:0 "L'officier charismatique de cavalerie, le lieutenant-général Fazle Haq, a accepté la nomination au poste de gouverneur et administrateur de la loi martiale de la province de la frontière du Nord-Ouest. Le général Zia fait implicitement confiance au général Fazle, car les deux hommes sont des officiers blindés et Zia pense qu'avoir un fils autochtone à la tête de la NWFP contribuera grandement à réduire les tensions. Le NWFP présente un intérêt vital pour le Pakistan, l'Afghanistan tente souvent d'attiser les troubles tribaux et les nationalistes pathans de la province prônent depuis longtemps soit l'indépendance, soit une plus grande autonomie, soit l'unification avec l'Afghanistan. Le général Fazle devrait relever ces défis externes et internes tout en renforçant les citoyens patriotes de la province. Le général devrait prendre sa retraite de l'armée pour consacrer ses efforts à l'administration de la province et ne pas être considéré comme un homme fort militaire."
 Zia_Era.9.d:0 "Le nombre croissant de réfugiés afghans exerce d'immenses pressions sur les ressources locales et accroît les tensions. Jusqu'à présent, de nombreux réfugiés peuvent rester avec leur famille de notre côté de la frontière, mais nous estimons que la population réfugiée continuera de croître. De nombreux hauts dirigeants militaires et civils estiment que le Pakistan a la responsabilité morale d'aider les musulmans en difficulté et estiment que nous devons immédiatement déployer des efforts pour fournir des fonds, des fournitures et des terrains aux camps de réfugiés. D'autres conseillers estiment que les coûts sont trop élevés et estiment que nous devrions laisser la situation perdurer car il semble que la population locale ait jusqu'à présent réussi à accueillir les Afghans."
 Zia_Era.10.d:0 "Les Nations Unies, avec le soutien des États occidentaux et de nos amis de la région, ont accepté de créer une agence pour les réfugiés chargée de s'occuper des réfugiés afghans. L'ONU commencera bientôt à canaliser des fonds et des fournitures pour les réfugiés, réduisant ainsi considérablement le fardeau qui pèse sur nous. Les rapports de l'ONU ont souligné les efforts considérables que nous avons déployés jusqu'à présent, et notre image internationale est à un niveau sans précédent. Les réfugiés afghans expriment également leur gratitude aux responsables de l'ONU et aux médias étrangers qui couvrent l'affaire. C'est un soulagement majeur pour notre gouvernement."
 Zia_Era.11.d:0 "Des camps de réfugiés de fortune ont été créés car le nombre de réfugiés affluant dans la NWFP est bien supérieur à ce que la population locale peut supporter. Dans certaines de nos régions, les réfugiés afghans construisent des maisons de fortune et abattent tous les arbres locaux pour obtenir du bois de chauffage. Les coûts écologiques et économiques pour les communautés locales s'alourdissent. Craignant que des réfugiés désespérés ne se tournent vers la violence ou que notre propre peuple ne se retourne contre les réfugiés, le gouvernement fédéral a décidé d'intervenir. Il nous ordonne de fournir des ressources considérables et d'héberger les réfugiés, quel qu'en soit le prix. Il semble que nos efforts initiaux visant à laisser la crise des réfugiés se résoudre d'elle-même ont échoué."
 Zia_Era.12.d:0 "Le général Zia ul-Haq a nommé son plus proche allié dans l'armée, le lieutenant-général Rahimuddin Khan, pour prendre la relève en tant que gouverneur et administrateur de la loi martiale du Baloutchistan. Administrateur compétent, le général Rahimuddin devrait jouer un rôle concret dans la gestion des dissidences internes et dans la direction du développement dans cette province historiquement agitée. Alors que ses prédécesseurs étaient largement engagés dans des opérations militaires contre les séparatistes baloutches, le nouveau gouverneur devrait tenter de mettre fin pacifiquement aux opérations et de proposer un nouveau programme de développement pour la population du Baloutchistan."
 Zia_Era.13.d:0 "L'administration de la loi martiale du Baloutchistan a annoncé son intention d'offrir une amnistie générale à tous les combattants séparatistes baloutches restants. En outre, les militaires pakistanais doivent immédiatement retourner dans leurs garnisons du temps de paix et le nombre de soldats présents dans la province sera réduit. Ces efforts portent déjà leurs fruits puisque de nombreux rebelles baloutches ont déjà accepté l'amnistie. Avec le départ des troupes, les anciens des tribus rebelles ont du mal à expliquer pourquoi les combats doivent continuer. Surtout après que le gouvernement a annoncé des plans pour de nouveaux projets de développement destinés à élever la population de la province. Il semble que le nouveau gouvernement militaire ait tiré les leçons sanglantes des années 1970."

 Delhi_Ageement.1.d:0 "À la suite de l'accord de Simla, les ministres des Affaires étrangères du Pakistan, de l'Inde et du Bangladesh se sont réunis à New Delhi. Les trois parties ont signé un accord appelé Accord de Delhi. Cet accord, les Nations Unies superviseront le rapatriement de milliers de militaires bengalis, de responsables gouvernementaux et de leurs familles actuellement internés au Pakistan. Les milliers de prisonniers de guerre pakistanais, de responsables gouvernementaux et de leurs familles détenus en Inde et au Bangladesh seront également échangés. Les Bangladais étaient réticents à l'accord car il incluait près de deux cents officiers pakistanais accusés de crimes de guerre. Cependant, le gouvernement indien a insisté pour qu'ils se conforment. Le peuple pakistanais attend avec impatience le retour de ses soldats."

 PAK_Kashmir_70s.1.d:0 "Les officiers supérieurs du GHQ se demandent si nous devrions ou non commencer à appeler des réserves en prévision d'une escalade de la situation au Cachemire. Cela nous donnerait une plus grande flexibilité tactique et permettrait à nos opportunités de première ligne d'accéder immédiatement à des renforts. Cependant, une telle démarche, même si elle est cachée sous forme d'exercices de routine, sera probablement remarquée par les Indiens, et ils pourraient décider de faire appel à leurs propres réserves. Si les Indiens ne s'en aperçoivent pas, l'élément de surprise sera entièrement sous notre contrôle. Les commandants de corps devront trouver une solution à ce sujet."
 PAK_Kashmir_70s.2.d:0 "Les rapports des services de renseignement indiquent que les Pakistanais font appel à un certain nombre de réservistes. Ce n'est pas sans précédent, cela fait suite à des tendances antérieures où nous avions observé des ordres de mobilisation similaires avant des exercices militaires à grande échelle. De nombreux hauts responsables de la défense estiment que nos forces peuvent surveiller avec vigilance les mouvements pakistanais et que faire appel à nos propres réserves est inutile et constitue un fardeau pour l'économie. Les commandants de l'armée reconnaissent qu'ils sont prêts, mais estiment qu'une mobilisation offrirait une plus grande flexibilité tactique. Le premier ministre doit prendre la décision finale."
 PAK_Kashmir_70s.3.d:0 "Les hauts dirigeants du gouvernement et de l'armée pakistanais se sont réunis pour des entretiens secrets au quartier général de l'armée à Rawalpindi. Le commandant du corps au Cachemire a déclaré que l'armée était préparée, motivée et désireuse de mener une campagne limitée contre les forces indiennes. Une frappe rapide et réussie pourrait déloger la puissance occupante indienne, après quoi nous appellerons à la mise en oeuvre des résolutions de l'ONU. Le simple fait de s'emparer du territoire ou de le revendiquer ne ferait que provoquer une attaque indienne généralisée. Certains dirigeants du gouvernement et un commandant de l'armée de l'air se sont demandé si les objectifs pourraient être atteints aussi rapidement et s'il était réaliste de s'attendre à ce que l'Inde n'aggrave pas le conflit. Les deux parties ont commencé à débattre sur ce qu'il fallait faire jusqu'à ce qu'une décision soit prise..."
 PAK_Kashmir_70s.4.d:0 "Le gouvernement indien et les observateurs de l'ONU rapportent que les forces pakistanaises ont traversé la frontière du Cachemire et avancent vers les positions indiennes. Le gouvernement pakistanais a affirmé que son action était une réponse à une violation majeure du cessez-le-feu par l'Inde. Le Pakistan insiste sur le fait que cette série de combats ne prendra fin que lorsque l'Inde acceptera de mettre en oeuvre les résolutions de l'ONU sur le Cachemire et que le Pakistan ne faisait que donner une réponse digne à l'agression indienne. Le Premier ministre indien préside une réunion avec de hauts responsables militaires et de la défense. Les États-Unis et l'Union soviétique ont publié des déclarations appelant à la fin immédiate des hostilités."
 PAK_Kashmir_70s.5.d:0 "Le Premier ministre préside une réunion avec de hauts responsables militaires et de la défense au ministère de la Défense. Il a reçu les premiers rapports sur les attaques pakistanaises au Cachemire. Les dirigeants de l'armée estiment que les opérations pakistanaises sont localisées et espèrent limiter les combats au Cachemire. Le ministre de la Défense a posé des questions sur la possibilité d'étendre le conflit à une guerre générale. Les dirigeants militaires indiens ont déclaré qu'une guerre générale entraînerait probablement une réaction internationale rapide et un retour aux frontières d'avant-guerre, à moins qu'une percée rapide ne soit réalisée. Ils ont conclu que si le Premier ministre estime que l'armée est capable de défendre le Cachemire, une escalade n'est pas nécessaire et que davantage de territoire peut être conquis lors de la contre-attaque du Cachemire. Mais si les Pakistanais semblent avoir le dessus, l'extension du conflit mettra à rude épreuve leurs forces et affaiblira leurs capacités offensives."
 PAK_Kashmir_70s.6.d:0 "Le secrétaire général des Nations Unies a annoncé qu'un cessez-le-feu entrerait en vigueur entre l'Inde et le Pakistan. Les deux parties devraient rester dans leurs positions actuelles jusqu'à ce que la situation finale soit évaluée. Le conflit a commencé après que le Pakistan a lancé une attaque à travers la frontière contestée du Cachemire. Le gouvernement indien a réagi en intensifiant le conflit en frappant au-delà de la frontière internationale. Les Indiens et les Pakistanais seront tous deux heureux de voir la fin du conflit."
 PAK_Kashmir_70s.7.d:0 "Après le cessez-le-feu de l'ONU, il est clair que nos forces ont réussi à s'emparer de territoires clés du Cachemire et à conserver le contrôle de nos principales villes. L'armée indienne a totalement échoué dans sa tentative d'intensifier le conflit pour soulager la pression au Cachemire ou s'emparer de territoires clés pour s'emparer de terres ou négocier un retour aux frontières d'avant-guerre. Nous sommes maintenant confrontés à une décision. Nous pouvons désormais faire pression pour la mise en oeuvre des résolutions de l'ONU sur le Cachemire, en laissant le choix au peuple du Cachemire, ou bien conserver nos acquis territoriaux au Cachemire. La première option soumet le conflit du Cachemire à un vote, sur lequel nous ne maîtrisons pas, mais le maintien des territoires pourrait conduire à un futur conflit avec l'Inde."
 PAK_Kashmir_70s.8.d:0 "La population pakistanaise est d'humeur euphorique suite à l'annonce selon laquelle le Pakistan conserve ses acquis majeurs au Cachemire. Des foules de gens sont descendues dans les rues de Karachi et de Lahore pour célébrer, créant ainsi une atmosphère festive. Les réfugiés cachemiriens de Rawalpindi se sont tenus devant le GHQ pour remercier l'armée pour ses sacrifices et ses services dans la libération du peuple cachemirien. Le gouvernement se réjouira de sa victoire et des informations font déjà état de responsables de l'Azad Cachemire s'installant sur le nouveau territoire."
 PAK_Kashmir_70s.9.d:0 "La situation en Inde est sombre mais tendue. De nombreux Indiens sont choqués par les revers militaires subis par leurs forces et par le retrait des terres clés du Cachemire. Des manifestations sporadiques de colère ont été signalées appelant au limogeage des généraux et des ministres ou à un procès pour leurs échecs. Le gouvernement indien s'est engagé à prendre en charge les réfugiés et les responsables cachemiris déplacés par l'armée pakistanaise. L'armée indienne devrait se soumettre à une longue introspection afin de comprendre ce qui n'a pas fonctionné dans ses plans de bataille."
 PAK_Kashmir_70s.10.d:0 "L'invasion pakistanaise n'a pas seulement été repoussée, mais nos forces armées ont infligé une défaite cuisante à leurs forces armées. Les troupes indiennes contrôlent désormais des zones clés du Cachemire occupé par le Pakistan et du Pakistan lui-même. Le public indien serait en liesse, avec des informations selon lesquelles des soldats indiens à travers le pays auraient reçu des bonbons et des fleurs du grand public. La défaite pakistanaise les fera réfléchir à deux fois avant de futures mésaventures. Le Premier ministre a également reçu un message du Parlement félicitant le gouvernement et l'armée pour leur action rapide pour défendre la république."
 PAK_Kashmir_70s.11.d:0 "Le récent conflit indo-pakistanais s'est terminé de manière peu concluante. À la fin des combats, aucun des deux camps n'avait un avantage décisif sur l'autre. Les deux camps possèdent suffisamment de territoire pour négocier un retour aux frontières d'avant-guerre. Même si le gouvernement indien espérait apporter une réponse punitive, il sera satisfait que le statu quo demeure. Pour le Pakistan, bien qu'il ait évité une défaite militaire, il n'a pas remporté de victoire et devra faire face aux conséquences de l'échec de son aventure au Cachemire."
 PAK_Kashmir_70s.12.d:0 "L'opération visant à dégeler le Cachemire et à imposer la mise en oeuvre des résolutions de l'ONU s'est soldée par un échec. L'armée pakistanaise a combattu courageusement, contre des obstacles écrasants, mais n'a pas pu atteindre ses objectifs. Le peuple pakistanais est découragé par le résultat et nombreux sont ceux qui se demandent pourquoi une telle opération a été lancée si la victoire n'a pas pu être remportée. L'armée et le gouvernement pakistanais auront de nombreuses questions à répondre, malgré leurs efforts pour présenter le résultat comme une défense réussie contre une invasion indienne."
 PAK_Kashmir_70s.13.d:0 "La perfide attaque pakistanaise au Cachemire n'a pas réussi à susciter un soulèvement ni à vaincre nos forces. L'armée indienne conserve le contrôle de son territoire. Le gouvernement indien a publié une déclaration félicitant son armée pour sa défense inébranlable du Cachemire et de son peuple. L'ambassadeur indien auprès des Nations Unies a déclaré que les Pakistanais avaient subi un tel revers qu'ils y réfléchiraient à deux fois avant d'envisager à nouveau une telle mésaventure. Le temps nous dira si cela sera vrai."
 PAK_Kashmir_70s.14.d:0 "Le quartier général du Pakistan à Rawalpindi était en effervescence suite aux informations selon lesquelles son offensive au Cachemire avait réussi à déloger les forces indiennes et à gagner de nouveaux territoires pour le Pakistan. Grâce à notre démonstration de force militaire dans la région, nous pouvons désormais nous rapprocher des Indiens pour enfin mettre en oeuvre les résolutions de l'ONU sur le Cachemire. Cependant, plusieurs commandants de corps estiment que la meilleure approche consiste à conserver nos acquis en vue d'une future opération visant à libérer tout le Cachemire. Ils affirment qu'introduire l'ONU maintenant reviendrait à abandonner l'avantage militaire et que nous devrions établir une nouvelle ligne de contrôle."
 PAK_Kashmir_70s.15.d:0 "Il est indéniable que les forces indiennes ont été repoussées dans des zones clés le long de la frontière du Cachemire. Ce revers militaire constitue un embarras majeur pour le gouvernement indien et place ses forces au Cachemire dans une position stratégique désavantageuse. Le Parlement critique le gouvernement pour son échec pendant le conflit et demande des explications aux militaires. L'armée indienne a déjà ouvert une enquête pour déterminer ce qui n'a pas fonctionné lors des récents combats."
 PAK_Kashmir_70s.16.d:0 "Le gouvernement pakistanais nous a demandé d'entamer le processus de mise en oeuvre des résolutions de l'ONU sur le Cachemire. Ils insistent sur le fait que la situation au Cachemire doit être décidée par son peuple et non par le biais d'un conflit armé. Il s'agit d'une position hypocrite, mais leurs récents gains territoriaux donnent à leurs forces une meilleure position sur le territoire contesté. Certains hauts responsables estiment que cela pourrait valoir la peine, car cela mettrait fin au conflit et ne laisserait pas nos forces vulnérables aux opérations futures. D'autres responsables et hauts responsables militaires s'opposent à la proposition, affirmant que l'Inde ne peut pas céder aux demandes car il s'agit clairement d'un chantage. Ils affirment qu'avec le temps, l'Inde sera en mesure de reprendre le territoire perdu."
 PAK_Kashmir_70s.17.d:0 "La folle aventure pakistanaise visant à s'emparer du Cachemire a été contrecarrée. Au cours des combats, les forces pakistanaises ont non seulement été stoppées, mais également repoussées dans des zones clés. Nos troupes bénéficient désormais d'un avantage stratégique au Cachemire. Nous avons désormais deux choix : restaurer les frontières d'avant-guerre et déclarer la victoire. Cela serait bien accueilli au niveau international et montrerait que nous ne sommes pas une puissance déterminée à utiliser la force armée pour conquérir les terres de nos voisins. Ou nous pouvons conserver notre nouveau territoire en guise de punition pour l'action pakistanaise. Conserver le territoire augmenterait le risque d'un futur conflit, car les Pakistanais seraient furieux et encore plus désespérés avec le temps."
 PAK_Kashmir_70s.18.d:0 "La perfide attaque pakistanaise au Cachemire n'a pas réussi à susciter un soulèvement ni à vaincre nos forces. L'armée indienne conserve le contrôle de son territoire. Le gouvernement indien a publié une déclaration félicitant son armée pour sa défense inébranlable du Cachemire et de son peuple. L'ambassadeur indien auprès des Nations Unies a déclaré que les Pakistanais avaient subi un tel revers qu'ils y réfléchiraient à deux fois avant d'envisager à nouveau une telle mésaventure. Le temps nous dira si cela sera vrai."
 PAK_Kashmir_70s.19.d:0 "La perfide attaque pakistanaise au Cachemire n'a pas réussi à susciter un soulèvement ni à vaincre nos forces. L'armée indienne conserve le contrôle de son territoire et s'empare d'une partie du territoire pakistanais lors de la contre-attaque. Le gouvernement indien a publié une déclaration félicitant son armée pour sa défense inébranlable du Cachemire et de son peuple. L'ambassadeur indien auprès des Nations Unies a déclaré que les Pakistanais avaient subi un tel revers qu'ils y réfléchiraient à deux fois avant d'envisager à nouveau une telle mésaventure. Le temps nous dira si cela sera vrai."
 PAK_Kashmir_70s.20.d:0 "Malgré une planification minutieuse et une attaque agressive, notre opération visant à dégeler le Cachemire et à forcer l'Inde à accepter un cessez-le-feu a échoué. Les Indiens contrôlent toujours leurs positions et nos forces ont été repoussées. Ce n'était pas la faute du soldat pakistanais qui avait accompli son devoir avec élan et discipline, mais le résultat du manque de leadership et d'imagination des commandants. On s'attend à ce que le peuple pakistanais réagisse avec colère face à ce revers et pour les millions de Cachemiriens déplacés par la violence indienne, il restera grandement déçu."
 PAK_Kashmir_70s.21.d:0 "Notre ambassade à Londres a signalé la création d'un nouveau parti nationaliste du Cachemire par des étudiants cachemiriens étudiant à l'étranger. L'organisation est composée de Cachemiriens indiens et de Cachemiriens pakistanais. Le nouveau groupe prévoit d'organiser des manifestations et de faire connaître le conflit au Cachemire afin de sensibiliser la communauté internationale à la situation. Ses membres font pression soit pour l'indépendance, soit pour la mise en oeuvre des résolutions de l'ONU sur le territoire. Nous pensons que le gouvernement pakistanais joue un rôle majeur en soutenant l'organisation afin de nous déborder sur la scène internationale."
 PAK_Kashmir_70s.22.d:0 "La délégation pakistanaise aux Nations Unies a lancé un appel passionné à la mise en oeuvre des résolutions de l'ONU sur le Cachemire. Ils ont noté que des centaines de Cachemiriens à l'étranger se sont approchés de leurs missions pour implorer une résolution et la réunion de leurs familles séparées par un conflit qui dure depuis des décennies. C'est la conclusion d'une offensive diplomatique pakistanaise plus large visant à sensibiliser l'opinion publique au Cachemire et à exercer une pression internationale sur nous pour qu'ils acceptent. Certains membres du gouvernement estiment qu'il est peut-être temps d'accepter et de mettre en oeuvre la résolution. Cela mettrait fin au conflit et nous permettrait de nous concentrer davantage sur notre économie et de démontrer au peuple cachemiri notre engagement à son égard. Cependant, la majeure partie du cabinet estime que la bonne volonté diplomatique que nous perdons en refusant ne correspond pas au sacrifice de notre position au Cachemire et de notre avantage stratégique sur le Pakistan."
 PAK_Kashmir_70s.23.d:0 "Nos efforts pour exercer une pression diplomatique sur l'Inde aux Nations Unies ont échoué. Les Indiens restent fermes dans leur occupation du Cachemire, malgré les coûts diplomatiques. Il s'agit d'un revers majeur pour le gouvernement pakistanais qui misait largement sur une approche diplomatique pour résoudre le conflit. L'armée pakistanaise verra cette évolution d'un très mauvais oeil. La crainte au sein du ministère des Affaires étrangères est que la future résolution du Cachemire soit désormais déterminée sur le champ de bataille plutôt que sur la table diplomatique."

 Elahi.1.d:0 "L'ambassadeur du Pakistan a délivré un message du président Elahi. Il demande au Royaume de le rencontrer ainsi que ses hauts officiers de la défense pour discuter de la consolidation d'une relation stratégique entre nos nations. Le président pakistanais a souligné le lien historique qui nous unit et le dévouement que nos peuples ressentent les uns envers les autres. Dans le passé, les Pakistanais nous ont fourni des experts et une formation militaire. De nombreux membres de notre gouvernement sont disposés à rencontrer cette délégation de haut niveau pour déterminer quel type d'accord pourrait être conclu. Quelques responsables suggèrent cependant que nous rejetions la demande et que nous ne nous mêlions à aucun État, quelle que soit la relation."
 Elahi.2.d:0 "Le président pakistanais et ses principaux conseillers militaires et économiques se sont entretenus avec le roi saoudien et ses principaux ministres. Au cours des négociations, les Pakistanais ont proposé un accord global. En échange d'experts militaires et d'une présence militaire permanente pour protéger le Royaume, nous offririons au Pakistan des subventions économiques. Il s'agit d'un accord majeur, estiment nos conseillers. Si nous ne sommes pas à l'aise avec cet accord, nous pourrions poliment appeler à de nouvelles consultations et conclure la réunion sur un réchauffement des liens entre nos nations."
 Elahi.3.d:0 "Le gouvernement saoudien a accepté notre proposition et nous avons signé l'accord stratégique à Riyad. La nouvelle est très bien accueillie par la population pakistanaise. Les partis religieux de notre coalition sont particulièrement ravis de cet accord. L'armée pakistanaise envoie déjà des conseillers et élabore des plans avec ses homologues saoudiens sur d'éventuels déploiements de troupes si nécessaire. Les Saoudiens ont exprimé leur immense satisfaction quant à l'accord et à l'approfondissement continu de nos relations. Une nouvelle ère a commencé pour les relations pakistano-saoudiennes."
 Elahi.4.d:0 "Le gouvernement pakistanais est très enthousiasmé par le récent accord. Notre propre armée est enthousiasmée par la perspective de voir arriver du personnel militaire pakistanais expérimenté pour améliorer les capacités de défense de nos forces. Le ministère de l'Information fera bientôt connaître cet accord aux médias locaux et à la presse internationale. Nous attendons une réponse positive. L'accord pakistanais visant à défendre le Royaume contre les agressions étrangères est également une bonne nouvelle et donnera à nos dirigeants une plus grande marge de manoeuvre sur le plan intérieur. Cet accord marque une nouvelle ère dans les relations saoudo-pakistanaises."
 Elahi.5.d:0 "Le récent changement vers une identité plus islamique, afin de mieux pousser notre nation vers l'idéologie nationale telle que définie par nos fondateurs, a entraîné une réaction violente de la part des Bengalis au Pakistan oriental. Leur assemblée provinciale, dominée par des gauchistes, a ouvertement condamné les récentes politiques et appelé à l'indépendance du Bengale. Le Président se rend à Dacca pour apaiser les tensions. Les Bengalis constituent une population beaucoup plus diversifiée sur le plan religieux et suivent l'idéologie dangereuse et laïque de la Ligue Awami depuis des décennies. Nous devrons nous demander si une séparation mutuelle serait la meilleure solution. Toutefois, un Pakistan uni reste un Pakistan fort."
 
 PAK_AL75.1.d:0 "Le président pakistanais Mujibur Rahman a récemment envoyé un message appelant à des pourparlers au niveau des ministres des Affaires étrangères à Karachi. Les Pakistanais souhaitent établir un climat de confiance avec nous et intensifier leurs relations commerciales. Nos conseillers principaux ne croient pas que les Pakistanais souhaitent un engagement total avec nous. Toutefois, même une amélioration progressive des relations pourrait conduire à une éventuelle normalisation. Certains responsables estiment que nous devrions rejeter cette initiative et qu'une ligne dure devrait être maintenue jusqu'à ce que le Pakistan s'engage pleinement à établir des relations de bon voisinage. Une décision doit être prise."
 PAK_AL75.2.d:0 "Les ministres des Affaires étrangères du Pakistan et de l'Inde se sont rencontrés à Karachi pour des entretiens. La réunion a eu lieu suite à une invitation pakistanaise en Inde. Les deux parties ont signé un accord favorisant le commerce et augmentant le nombre de diplomates dans les deux États. Les deux gouvernements ont publié des déclarations saluant l'accord comme un pas positif dans la bonne direction. Malgré l'accord, les deux parties ont reconnu qu'il restait de nombreuses questions en suspens qui devront être résolues à l'avenir. Au niveau international, les pourparlers sont salués. En arrivant au bâtiment de l'Assemblée provinciale, le président s'est adressé aux médias. Il a déclaré comprendre que certains Pakistanais de l'Est se sentent déçus par le système électoral actuel et il attend avec impatience les prochaines négociations."
 
 PAK_1975_Election.1.d:0 "Zulfikar Ali Bhutto a annoncé que le Parti du peuple pakistanais avait quitté sa coalition avec la Ligue Awami. Il a évoqué une divergence croissante dans les objectifs idéologiques et des inquiétudes quant à la domination bengali sur la coalition. Bhutto a déclaré que le PPP prévoyait de diriger une coalition de partis de gauche et de centre-gauche pour offrir aux Pakistanais un véritable socialisme islamique. Un porte-parole de la Ligue Awami a confirmé la scission, accusant Bhutto d'avoir des exigences déraisonnables envers la coalition. Le chef de la Ligue Awami, Cheikh Mujibur Rahman, n'a pas fait de commentaire, mais la rumeur dit qu'il serait de plus en plus ennuyé par l'ambitieux leader du PPP."
 PAK_1975_Election.2.d:0 "Après une campagne électorale particulièrement âpre, les électeurs pakistanais se rendent aux urnes. Les trois choix sont des coalitions dirigées par Mujibur Rahman, Zulfikar Ali Bhutto et Chaudhry Zahoor Elahi. Le jeune et charismatique Bhutto dirige une puissante coalition de centre-gauche. Prendre certains des éléments les plus modérés de la gauche du fidèle politique Cheikh Mujibur Rahman. Enfin, Chaudhry Zahoor Elahi, un industriel respecté, dirige une coalition de partis conservateurs axés sur la réduction du socialisme dans le pays et défendant les principes islamiques sur lesquels le Pakistan a été fondé. Le peuple doit maintenant décider."
 
 Awami_League_Unrest.1.d:0 "La Ligue Awami, qui domine l'Assemblée provinciale du Pakistan oriental, a récemment adopté une résolution appelant à la création d'une nation du Bengale. Cette résolution radicale a provoqué un tollé au Pakistan occidental et à l'Assemblée nationale. Le président a également réagi vivement et s'est rendu à Dacca pour des entretiens avec la Ligue Awami. Au début des pourparlers, l'accueil qu'il a reçu de la part du peuple et de la Ligue Awami est devenu clair pour le président qu'il y avait peu de confiance dans l'unité du Pakistan. Beaucoup dans la province ont le sentiment que le pays s'éloigne d'eux et que les dernières élections ont montré un biais croissant qui empêche la croissance des dirigeants nationaux bengalis. Le président doit décider s'il recherchera un compromis sur l'indépendance du Pakistan oriental ou s'il adoptera une ligne dure et insistera sur un Pakistan uni. Compte tenu de l'étroite intégration militaire des deux ailes, il semble peu probable que la situation dégénère en conflit armé, car cela serait catastrophique pour les deux parties."
 Awami_League_Unrest.2.d:0 "La nouvelle du refus du Pakistan de faire des compromis a déclenché des émeutes massives dans les zones fédérales de Dacca. Les bâtiments gouvernementaux et les tribunaux ont été incendiés par des manifestants en colère ; dans de nombreux cas, la police est simplement restée les bras croisés et n'est pas intervenue pour mettre un terme aux violences. Cette manifestation d'indignation populaire a amené de nombreux conseillers à suggérer au président de changer de cap et d'accepter le Bangladesh. Cependant, certains continuent de l'exhorter à poursuivre un Pakistan uni. La situation est très tendue."
 Awami_League_Unrest.3.d:0 "Alors que les pourparlers sont au point mort et que les tensions montent au Pakistan occidental et oriental, la Ligue Awami a appelé à la Journée du Bangladesh dans toute la province. Dans les maisons du Pakistan oriental, les Bengalis ont placé des drapeaux faits maison pour le Bangladesh pour indiquer leur soutien aux efforts de la Ligue Awami. Cette action a ébranlé même les Pakistanais occidentaux. Beaucoup pensent désormais que si les Bengalis souhaitent si ardemment partir, le gouvernement devrait simplement les laisser partir. Le président a accepté et informera les représentants de la Ligue Awami lors de leur prochaine réunion."
 Awami_League_Unrest.4.d:0 "Le président du Pakistan et les dirigeants de la Ligue Awami ont signé un document public appelant à l'indépendance du Bangladesh. Les habitants de Dacca sont entrés en pleine célébration après la signature avec de la musique et des célébrations tout au long de la nuit. Au cours des trois prochains mois, les Pakistanais occidentaux seront rapatriés au Pakistan à mesure que le pouvoir sera transféré. Dans le cadre de l'accord, le Pakistan ne sera pas obligé de « rembourser » au Bangladesh les fonds de développement utilisés sur ses revenus depuis l'indépendance. Les habitants du Pakistan occidental acceptent la nouvelle avec enthousiasme, beaucoup espérant que cela mettra enfin fin aux tensions incessantes entre les deux ailes du pays."
 Awami_League_Unrest.5.d:0 "Le Bangladesh a officiellement rejoint la communauté des nations lorsque le gouvernement pakistanais a officiellement accordé la souveraineté à l'Assemblée provinciale du Pakistan oriental. Bien que le gouvernement pakistanais se soit déclaré satisfait de ce changement, de nombreux Bangladais ont souligné la hâte avec laquelle ils ont évacué leur personnel et leurs fournitures de la province. Plus important encore, l'État pakistanais n'a envoyé que son ministre des Affaires étrangères pour la cérémonie de lever du drapeau. Quoi qu'il en soit, la Ligue Awami a salué la transition pacifique et espère que les bonnes relations continueront entre les deux nations frères."
 Awami_League_Unrest.6.d:0 "La Ligue Awami, qui contrôle l'Assemblée provinciale du Pakistan oriental, a récemment adopté une résolution appelant à la création d'une nation du Bengale. Cette résolution radicale a provoqué un tollé au Pakistan occidental et à l'Assemblée nationale. Le président a également réagi vivement et s'est rendu à Dacca pour des entretiens avec la Ligue Awami. À son arrivée, de nombreux habitants ont envahi les rues, acclamant le cortège présidentiel. Le récent succès électoral du président au Pakistan oriental et le soutien du public montrent que de nombreuses personnes au Pakistan oriental restent fermement attachées à l'État."
 Awami_League_Unrest.7.d:0 "Après plusieurs jours de négociations, la Ligue Awami a accepté de retirer sa résolution appelant à une nation bengali. La Ligue Awami a rapidement vu sa position de force s'éroder alors que les partisans du gouvernement ont rapidement dominé les rues de Dacca, se ralliant au président. Pour sauver la face, le gouvernement pakistanais a promis de soutenir davantage d'initiatives culturelles locales et d'envisager de réformer le nombre de sièges auxquels le Pakistan oriental a droit à l'Assemblée nationale. Cependant, de nombreux analystes estiment que ce dernier point n'entraînera aucun changement. Dans tout le Pakistan, le président bénéficie d'un large soutien, car les éditoriaux des journaux affirment que les événements récents prouvent que la Constitution est désormais la loi suprême pour tous les Pakistanais. La Ligue Awami a publié sa propre déclaration, affirmant qu'elle avait obtenu d'excellents résultats dans la garantie des droits des Pakistanais de l'Est. Le provincialisme semble être sur la voie d'un déclin constant."
 
 PAK_Econ70s.1.d:0 "Le Royaume connaît une croissance rapide et possède une richesse incroyable. Cependant, nous manquons d'une importante population ouvrière ou d'un système universitaire capable de répondre aux demandes de travail, d'éducation, de médecine ou d'ingénierie nécessaires pour croître avec notre richesse. Ces derniers mois, nous avons proposé des visas de travailleur invité à des milliers de Pakistanais pour venir travailler dans le pays. L'écrasante majorité de ces travailleurs sont des hommes, et une grande partie d'entre eux occuperont des postes dans le secteur de la construction ou des services. Cependant, nous faisons également appel à des médecins, des ingénieurs et d'autres professionnels pour aider à gérer de nouveaux hôpitaux et superviser de nouveaux projets de développement."
 PAK_Econ70s.2.d:0 "Les Émirats se développent rapidement et possèdent une richesse incroyable. Cependant, nous manquons d'une importante population ouvrière ou d'un système universitaire capable de répondre aux demandes en matière de travail, d'éducation, de médecine ou d'ingénierie nécessaires pour faire croître nos villes avec notre richesse. Ces derniers mois, nous avons proposé des visas de travailleur invité à des milliers de Pakistanais pour venir travailler dans le pays. L'écrasante majorité de ces travailleurs sont des hommes, et une grande partie d'entre eux occuperont des postes dans le secteur de la construction ou des services. Cependant, nous faisons également appel à des médecins, des ingénieurs et d'autres professionnels pour aider à gérer de nouveaux hôpitaux et superviser de nouveaux projets de développement."

 PAK_Afghan_War.10.d:0 "La présence sans précédent de réfugiés afghans submerge les autorités locales et provoque des conflits dans nos villes frontalières. Le GHQ a chargé le commandant du corps local de prendre le contrôle de la situation. Les ingénieurs militaires prévoient d'établir des camps de réfugiés à l'extérieur de Peshawar et d'autres villes. L'armée travaillera en étroite collaboration avec les fonctionnaires pour établir une communication efficace entre les réfugiés et notre gouvernement. Les réfugiés sont dirigés par leurs anciens tribaux traditionnels, c'est pourquoi nous prévoyons de distribuer de l'aide directement à ces anciens et de les laisser la distribuer aux familles. Le Corps médical de l'armée, en collaboration avec des organisations humanitaires étrangères, prévoit également de créer des hôpitaux de campagne. Cela contribuera à atténuer les tensions sociales provoquées par les réfugiés et montrera notre engagement fraternel à aider le peuple afghan."
 PAK_Afghan_War.11.d:0 "Après une analyse approfondie, l'ISI a identifié les principaux groupes rebelles disposés et capables de lancer des opérations contre le régime fantoche soutenu par les Soviétiques. L'aide militaire aux rebelles provenant de sources extérieures sera strictement contrôlée par l'ISI, qui distribuera les armes aux groupes les plus efficaces. Les groupes qui n'ont pas la volonté de s'engager dans la lutte armée ne recevront ni armes ni argent. Le général de brigade Mohamad Yousaf, récemment nommé chef du Bureau afghan, est l'homme de référence de ce pipeline d'armes. Les armes importées à Karachi doivent être transportées avec des véhicules civils vers les camps de moudjahidines en cours d'établissement près de la frontière."

 Bhutto_70s.1.d:0 "L'Organisation des pays islamiques a choisi le Pakistan pour tenir son prochain sommet islamique à Lahore. La réunion verra les chefs d'État des nations musulmanes du monde entier se réunir pendant trois jours. L'OCI a noté que le Pakistan est un membre exceptionnel de l'organisation et mérite ce privilège. Le gouvernement pakistanais a publié sa propre déclaration exprimant le profond honneur qu'il ressent pour cet honneur. Il souligne que Lahore est depuis longtemps un centre de l'islam en Asie du Sud. Les journaux de tout le Pakistan ont publié des articles faisant état de la fierté que ressent le peuple pakistanais et de son enthousiasme à l'idée d'accueillir ses frères islamiques."
 Bhutto_70s.2.d:0 "Zulfikar Bhutto a passé ces dernières semaines à parcourir le monde musulman pour remettre des invitations personnelles aux chefs d'État. Ces informations sont suivies de près par la presse locale et de nombreux Pakistanais sont de plus en plus enthousiasmés par le prochain sommet. De nombreux pays ont déjà promis d'y assister et plusieurs dirigeants ont envoyé des messages personnels au peuple pakistanais exprimant l'honneur qu'il ressentait d'être personnellement invité. Zulfikar Ali Bhutto supervise également personnellement les préparatifs à Lahore. De nombreuses entreprises et organisations locales ont déjà promis d'offrir des services et des spectacles pour la conférence."
 Bhutto_70s.3.d:0 "Zulfikar Ali Bhutto a ouvert le deuxième sommet islamique de l'Organisation des pays islamiques. Plus de quarante chefs d'État musulmans sont présents, ainsi que de hauts responsables de plusieurs autres États. Le dirigeant pakistanais a souligné la nécessité de l'unité islamique en ces temps difficiles et a invité tous les participants à explorer Lahore. Dans son discours, Bhutto a promis le soutien continu du monde islamique au peuple palestinien et aux États arabes. Sous un tonnerre d'applaudissements, Bhutto a dévoilé le Fonds de solidarité islamique qui renforcera la culture, l'unité et l'éducation islamiques. Les médias pakistanais et la presse musulmane dans son ensemble ont publié des critiques élogieuses sur l'ouverture de la conférence. Lors du premier dîner d'État, Bhutto a été invité à s'asseoir avec le roi d'Arabie saoudite."
 Bhutto_70s.4.d:0 "Le leader charismatique libyen Mouammar Kadhafi s'est adressé à un stade rempli de Pakistanais au stade de Lahore. Dans son discours tonitruant, Kadhafi a remercié les habitants de Lahore et a proclamé la fraternité éternelle entre le Pakistan et la Libye. La foule a particulièrement applaudi lorsque Kadhafi a proclamé que ce qui appartenait au peuple libyen appartenait également au peuple pakistanais. Il a reçu les acclamations les plus vives lorsqu'il a parlé du potentiel illimité du Pakistan. Le discours a été largement rapporté dans tout le Pakistan et nombreux sont ceux qui demandent au Pakistan Cricket Board de changer le nom du stade en Kadhafi Stadium, ce qui semble probable. Suite à son discours, Kadhafi a rencontré Zulfikar Bhutto et les deux dirigeants ont signé des accords garantissant l'arrivée de travailleurs invités pakistanais et de conseillers militaires ainsi que des subventions pétrolières libyennes."
 Bhutto_70s.5.d:0 "Lors de l'un des principaux discours prononcés à l'OCI, le ministre pakistanais des Affaires étrangères a prononcé un discours puissant condamnant l'occupation continue des terres musulmanes par Israël et l'Inde. Le discours a été bien accueilli par les dirigeants musulmans présents. La presse indienne serait furieuse. Bien que membre observateur de l'OCI, l'Inde a refusé d'envoyer un représentant et le gouvernement indien est désormais accusé de ne pas être là pour s'opposer au programme anti-indien. Zulfikar Bhutto est félicité au Pakistan pour avoir démontré avec succès le soutien international à la cause pakistanaise."
 Bhutto_70s.6.d:0 "En remerciement de tout ce que le Pakistan a fourni et fait pendant la conférence de l'OCI, les États du Golfe se sont engagés à fournir un soutien financier au gouvernement pakistanais. Zulfikar Bhutto a signé la série d'accords et a exprimé l'espoir que le Pakistan et les États du Golfe forgeront des liens durables entre eux. Ces accords sont largement salués comme fournissant au Pakistan un élan économique majeur dans un environnement économique difficile. Le Pakistan a également signé des accords engageant l'armée à fournir des missions de formation aux principaux pays du Golfe afin d'améliorer leurs capacités de défense. Le roi d'Arabie saoudite a publié sa propre déclaration exprimant sa profonde admiration envers le peuple pakistanais et la gentillesse qu'il a reçue à Lahore."
 Bhutto_70s.7.d:0 "La deuxième Conférence islamique de l'Organisation des pays islamiques s'est officiellement terminée. Le dirigeant pakistanais Zulfikar Bhutto a personnellement accompagné de nombreux participants à l'aéroport Allama Iqbal. La conférence a été un énorme succès pour le Pakistan en démontrant sa position dans le monde islamique. Plus important encore, la conférence a produit de nombreux résultats positifs pour le Pakistan. Bhutto a grandement légitimé son statut parmi le peuple pakistanais et en tant que leader international. Les habitants de Lahore n'oublieront pas de sitôt les souvenirs de la conférence."
 Bhutto_70s.8.d:0 "Le Pakistan a envoyé une délégation de haut niveau pour visiter Kaboul. Ils nous offrent l'opportunité de normaliser les relations et de mettre fin aux récentes tensions entre nos États. La normalisation des liens peut nous protéger si la situation dégénère à l'avenir. Cependant, cela risquerait de s'aliéner notre population nationale. De nombreuses personnes dans le pays ont de la famille de l'autre côté de la frontière et croient passionnément que le Pakistan continue d'occuper le sol afghan sacré. Nous devons décider comment gérer la délégation. Nous pouvons les engager ou les repousser en envoyant des fonctionnaires de bas niveau discuter avec eux."
 Bhutto_70s.9.d:0 "Il y a plus de dix ans, l'Afghanistan cherchait activement à susciter des troubles et à provoquer une rébellion armée au Pakistan. Naturellement, ces efforts n'ont pas réussi à remettre en cause la souveraineté et l'unité nationale du peuple pakistanais. Cependant, l'Afghanistan n'a pas oublié et pourrait réessayer à l'avenir. Zulfikar Bhutto a récemment reçu une proposition visant à tendre la main aux Tadjiks et aux islamistes en Afghanistan. Ces deux groupes sont opposés à un conflit avec notre État et souhaitent renforcer leur position en Afghanistan. Si nous leur tendons la main et établissons des contacts, ceux-ci peuvent être très efficaces à l'avenir et démontrer à l'Afghanistan que nous pouvons leur faire tout aussi mal. Cependant, il y en a d'autres dans l'establishment de la défense qui croient que nous devrions laisser les choses en place et ne pas nous impliquer en Afghanistan."
 Bhutto_70s.10.d:0 "Le général Naseerullah Babar, directeur général du renseignement militaire, a informé le dirigeant pakistanais Zulfikar Bhutto d'un plan proposé visant à extrader vers le Pakistan les principaux dirigeants religieux et tadjiks anti-Kaboul. Ces hommes suivraient une formation, établiraient des liens avec le Pakistan et fourniraient des informations sur ce qui se passe en Afghanistan. Le risque d'être découvert par l'Afghanistan est minime et s'ils le font, ils ne s'exprimeront probablement pas. Compte tenu du nombre de nos dissidents qu'ils arrosent publiquement à Kaboul. Parmi les personnes qui seront extradées figurent Ahmad Shah Masood, Burhanuddin Rabbani et Gulbadin Hekmatyr. Les militants tadjiks représentent une communauté qui est mécontente du programme du Pachtounistan et de son impact sur la société et l'économie afghanes. Les chefs religieux sont pour la plupart des Pachtoons qui s'opposent également au gouvernement afghan pour sa politique perçue comme anti-islamique. Ils souhaitent également des relations chaleureuses avec le Pakistan, qu'ils considèrent comme un État islamique frère."
 Bhutto_70s.11.d:0 "Après plusieurs mois de discussions et de formations, nos services de renseignement ont réussi à renvoyer les chefs religieux et tadjiks en Afghanistan. Nous avons désormais une idée beaucoup plus claire de l'Afghanistan, de sa politique fragile et de la lutte de l'État pour étendre son influence au-delà des centres urbains. Le général Naseerullah Babar a récemment présenté un exposé préconisant l'établissement de routes clandestines à travers la frontière pour fournir des armes à ces factions rebelles. Il a souligné que le gouvernement afghan cible activement ces groupes et améliore quotidiennement ses méthodes de répression. Babur a recommandé que nous approuvions le transfert d'armes pour préserver ces groupes d'opposition et consolider nos liens avec eux. Certains conseillers estiment que les rebelles afghans se contenteraient d'utiliser ces armes pour des opérations et que le Pakistan ne devrait pas risquer un nouveau conflit avec l'Afghanistan."
 Bhutto_70s.12.d:0 "Nos contacts dans l'opposition en Afghanistan rapportent que le gouvernement afghan poursuit une politique visant à saper l'islam dans le pays et à éliminer les Tadjiks en tant que force politique dans le pays. Ils nous demandent maintenant la permission d'utiliser les armes que nous avons déjà fournies pour des attaques armées contre le gouvernement afghan. Ils ont également demandé des armes supplémentaires pour soutenir leur offensive. Nos responsables du renseignement nous informent que même si nous leur refusons l'autorisation, l'opposition afghane se sent menacée et agira malgré tout. Nos conseillers militaires préconisent que nous accordions l'autorisation et expédiions davantage d'armes et de fournitures à travers la frontière pour mener à bien notre mission de punir le gouvernement afghan. D'autres conseillers craignent que de telles attaques ne nous embarrassent si les rebelles divulguent des informations sur notre implication."
 Bhutto_70s.13.d:0 "Les médias font largement état d'attaques majeures visant des représentants du gouvernement et des forces de sécurité dans de petites villes et villages, principalement dans les régions tadjikes du pays. Les opérations de délit de fuite montrent une certaine sophistication et les premiers rapports indiquent que ces attaques sont lancées par des Tadjiks en colère et des combattants mécontents d'inspiration religieuse Pushtoon. Dans certains cas, nos troupes auraient fui contre des forces qu'elles étaient largement supérieures en nombre. Nos commandants indiquent qu'il s'agit d'incidents isolés impliquant des conscrits mal dirigés. Les rebelles sont trop peu nombreux pour s'emparer de territoires, mais la confiance de la population est ébranlée et nos militaires se sentent humiliés. Beaucoup à Kaboul soupçonnent le Pakistan d'être impliqué dans la formation et l'armement de ces groupes."
 Bhutto_70s.14.d:0 "Notre gouvernement et notre armée ont récemment conclu une conférence de presse au cours de laquelle nous avons déclaré notre victoire sur une récente tentative de combattants rebelles soutenus par l'étranger de s'emparer du pays. Même si les premières attaques semblaient fortes, les rebelles ont rapidement perdu de leur vigueur et nous avons pu déplacer nos meilleures troupes vers les bonnes zones pour atténuer de nouvelles attaques. Les médias et la population de Kaboul ne tarissent pas d'éloges sur la puissance gouvernementale et militaire de l'Afghanistan. Nous informons déjà les médias du monde entier et présentons les témoignages des rebelles capturés selon lesquels ils étaient armés et dirigés par le Pakistan. L'Afghanistan triomphera et le complot infâme de notre voisin aura été étouffé."
 Bhutto_70s.15.d:0 "Le chef de l'armée pakistanaise a récemment reçu un document spécial sur la défense de Zulfikar Bhutto lui-même. Le rapport, rédigé en consultation avec ses conseillers en matière de sécurité, dont certains officiers impliqués dans la tristement célèbre conspiration de Rawalpindi, appelle à des changements radicaux au sein de l'armée pakistanaise. Dans le document, Bhutto plaide pour que l'armée se transforme en une armée populaire capable de mieux mobiliser la classe ouvrière et les paysans afin de contrer l'avantage démographique de l'Inde. À première vue, la plupart des officiers supérieurs estiment que le document est ridicule et qu'il menace non seulement l'intégrité institutionnelle mais aussi la stabilité du Pakistan. Personne ne veut armer les paysans. Cependant, les officiers pro-Bhutto le soutiennent et font pression sur le chef de l'armée pour qu'il l'adopte. C'est en fin de compte au chef de l'armée de décider."
 Bhutto_70s.16.d:0 "Le dirigeant pakistanais Zulfikar Ali Bhutto plaide depuis longtemps pour une coopération civilo-militaire plus étroite et a récemment commencé à siéger aux comités de promotion pour observer et apporter sa contribution. Il s'agit d'une transformation majeure pour l'armée pakistanaise, qui a maintenu pendant des années une séparation stricte entre ses pratiques institutionnelles et sa participation civile. De nombreux officiers supérieurs pakistanais observent l'évolution de la situation avec une appréhension nerveuse, car il semble que l'armée va promouvoir les officiers non seulement en fonction de leurs capacités en tant qu'officiers, mais également en fonction de leur loyauté perçue envers le PPP et Bhutto lui-même. Un groupe de généraux à la retraite a publié une lettre ouverte condamnant la politisation de l'armée. Toutefois, l'armée reste déterminée à mettre en oeuvre les réformes proposées par Bhutto il y a des mois."
 Bhutto_70s.17.d:0 "L'armée pakistanaise a informé Zulfikar Bhutto, stupéfait, qu'elle avait découvert un complot ourdi par de jeunes officiers de l'armée et de l'armée de l'air visant à renverser le gouvernement. Les services de renseignement pakistanais ont été informés du complot après que l'un des conspirateurs se soit confié à son officier supérieur. Il semble qu'un certain nombre d'officiers de l'armée considèrent Bhutto avec appréhension et crainte pour l'avenir non seulement de l'armée mais aussi du Pakistan lui-même. Bhutto s'est rapidement adressé à la nation, condamnant le bonapartisme et s'engageant à déraciner de haut en bas les conspirateurs anti-étatiques. L'armée pakistanaise a informé Bhutto qu'elle mettait en place un tribunal militaire pour expulser les autres conspirateurs. Le chef de l'armée a en tête un officier pour diriger le tribunal, mais certains proches conseillers de Bhutto lui suggèrent d'insister pour que le général de brigade Zia ul-Haq, un officier prometteur, apolitique mais zélé, dirige le tribunal."
 Bhutto_70s.18.d:0 "La nomination du général de brigade Zia ul-Haq à la tête du tribunal militaire chargé d'enquêter sur un complot anti-coup d'État contre Bhutto a permis de découvrir plusieurs cellules de conspirateurs dans des cantonnements à travers le Pakistan. Même ceux qui sont soupçonnés d'être impliqués dans cette affaire sont impitoyablement interrogés par le tribunal et presque tous démissionnent de l'armée ou, si des preuves sont découvertes, sont condamnés à de lourdes peines de prison. Zulfikar Bhutto serait très satisfait du tribunal et aurait exprimé au chef de l'armée son désir que Zia avance plus loin dans sa carrière. Certains officiers à la retraite conseillant Bhutto l'ont cependant exhorté à la prudence, car ils notent que Zia n'est pas motivé uniquement par le désir de protéger le gouvernement, mais également de restaurer la chaîne de commandement au sein de l'armée."
 Bhutto_70s.19.d:0 "Le tribunal militaire chargé d'enquêter sur le prétendu complot anti-coup d'État de Bhutto a réussi à identifier des cellules opérant principalement à Lahore, Karachi et Rawalpindi. Le Tribunal a noté que bon nombre des conspirateurs présumés n'avaient même pas comploté au-delà d'un accord selon lequel Bhutto était mauvais pour le pays et l'armée. En conséquence, de nombreux accusés ont reçu des réprimandes officielles et des notes négatives dans leurs dossiers, mais ont été autorisés à rester dans l'armée. Ceux qui sont plus profondément impliqués, en particulier les officiers de l'armée de l'air et de l'armée à Karachi, sont démis de leurs fonctions et les dirigeants sont condamnés à des peines de prison. Le tribunal a noté l'importance de restaurer la chaîne de commandement dans toutes les unités et a condamné les complots comme portant atteinte à l'institution. Zulfikar Bhutto suit de près le tribunal et est satisfait de ses actions, même s'il se sent personnellement agacé par l'accent mis sur la chaîne de commandement plutôt que le crime de trahison dans le complot visant à renverser son gouvernement."
 Bhutto_70s.20.d:0 "La question de savoir quoi faire à propos de la secte Ahmadiyya au Pakistan continue de tourmenter le gouvernement. La secte, dont les adeptes sont appelés Ahmadis, est principalement basée à Lahore où ils jouent un rôle de premier plan dans le monde des affaires et de l'industrie. Ils s'identifient comme musulmans, mais de nombreuses autres sectes musulmanes au Pakistan, y compris les principales organisations politiques religieuses, condamnent le groupe pour avoir nié que le prophète Mahomet était le dernier prophète et pour avoir déifié son fondateur, Mirza Ghulam Ahmad. Ces tensions ont abouti aux violentes émeutes de Lahore en 1953, au cours desquelles l'armée s'est déployée pour mettre fin à la violence et protéger les Ahmadis. À l'époque, le gouvernement avait refusé d'accepter les demandes des émeutiers selon lesquelles les Ahmadis seraient considérés comme non musulmans. Cependant, les tensions montent à nouveau, de nombreux Pakistanais condamnant les Ahmadis pour avoir prétendument utilisé leurs richesses pour convertir les villageois pauvres des villages autour de Lahore. Zulfikar Bhutto présentera bientôt un amendement à l'Assemblée nationale visant à déclarer les Ahmadis non musulmans afin d'obtenir le soutien de son parti et de mettre fin aux critiques des groupes religieux selon lesquelles il est impliqué dans des politiques anti-islamiques."

 PAK_Religous_Upheaval.1.d:0 "Les dirigeants des partis religieux se sont organisés avec d'éminents chefs spirituels pour lancer une série de manifestations majeures dans les villes du Pakistan. Ils bloquent les routes principales et condamnent ce qu'ils considèrent comme une dégradation morale continue de la nation. Il semble que le récent échec électoral des partis religieux ait fait craindre au sein de nombreuses communautés musulmanes que le pays s'éloigne de ses racines islamiques. Les manifestants veulent que le gouvernement garantisse par voie législative le caractère islamique de la nation. De nombreux propriétaires d'entreprises pakistanaises ont annoncé qu'ils fermeraient périodiquement leurs magasins pour soutenir les manifestations. Un communiqué publié par les principaux dirigeants de la communauté islamique du pays annonce que des manifestations et des boycotts économiques auront lieu régulièrement dans tout le pays jusqu'à ce que leurs préoccupations soient prises en compte."
 PAK_Religous_Upheaval.2.d:0 "Les protestations et les boycotts actuels deviennent insupportables pour le gouvernement. Une réunion de haut niveau a lieu avec les chefs de sécurité et les membres du cabinet concernés. Certains veulent déployer la police et d'autres agences de sécurité pour réprimer les manifestations. Ils ne seront peut-être pas en mesure de mettre fin aux troubles, mais ils peuvent certainement en atténuer l'impact. Une telle action comporte des risques car elle pourrait simplement enhardir les manifestants. L'autre option est d'ouvrir des discussions avec les comités religieux. Nous pouvons probablement faire suffisamment de promesses en matière de changements locaux, mais encore une fois, les négociations comportent également des risques, car ces groupes pourraient se sentir encouragés à étendre leurs revendications."
 PAK_Religous_Upheaval.3.d:0 "La récente répression policière des manifestations religieuses à grande échelle organisées par les partis politiques islamiques a entraîné une réduction notable du désordre. La décision de ne pas arrêter les chefs religieux mais de cibler leurs principaux partisans s'est avérée judicieuse. Tandis que les chefs de prière continuent de prononcer des discours, le manque de meneurs sur le terrain pour diriger les troubles a considérablement affaibli l'impact des manifestations. En outre, les poursuites judiciaires couronnées de succès ont eu un effet dissuasif efficace pour empêcher l'émergence de nouveaux dirigeants. Le gouvernement sera satisfait de son succès."
 PAK_Religous_Upheaval.4.d:0 "La récente répression policière des manifestations religieuses à grande échelle menées par les partis politiques islamiques n'a pas réussi à affaiblir les troubles. Bien que le gouvernement se soit concentré sur l'arrestation de facilitateurs plutôt que de chefs religieux pour éviter d'enflammer les manifestants, les accusations ne sont pas retenues devant les tribunaux. Plus important encore, certains de ces organisateurs locaux gagnent en importance à mesure qu'ils propagent leur programme lors des audiences des tribunaux et auprès des médias. Les manifestants redoublent d'efforts et incitent davantage de personnes à se joindre à la campagne pour que l'Assemblée nationale légifère sur une identité islamique pour le pays."
 PAK_Religous_Upheaval.5.d:0 "Après d'intenses négociations, le gouvernement et les dirigeants religieux de la contestation se sont mis d'accord sur une série de compromis. Le gouvernement a promis de s'abstenir de poursuivre les manifestants accusés de troubles à l'ordre public, tandis que les manifestants réduiraient les protestations économiques. Les deux parties ont déclaré aux médias que l'accord apaiserait les tensions et permettrait un environnement plus positif pendant que l'Assemblée nationale examinerait la question."
 PAK_Religous_Upheaval.6.d:0 "Le gouvernement a confirmé que les efforts de négociation avec les dirigeants religieux de la protestation se sont soldés par un échec. Il semble que les dirigeants de la contestation aient perçu les négociations comme un signe de faiblesse et aient seulement élargi leurs revendications pour inclure la fermeture des marchés vendredi jusqu'à l'après-midi. L'impact économique d'une telle situation serait dramatique, rendant les négociations impossibles. Les médias ont éviscéré le gouvernement, lui reprochant son manque de stratégie face aux protestations croissantes."
 PAK_Religous_Upheaval.7.d:0 "L'opposition a présenté les revendications des partis islamiques et des dirigeants de la protestation religieuse, appelant à ce que la constitution reflète plus complètement le caractère islamique du Pakistan. Les protestations à l'échelle nationale ne s'atténueront pas tant que ces revendications ne seront pas explorées. Le gouvernement peut adopter deux approches : la première consiste à s'opposer prudemment à ces propositions. Ils peuvent le faire en arguant que la nation jouit déjà d'une identité islamique. Nous pouvons oeuvrer pour convaincre l'opposition de se joindre au gouvernement pour s'opposer aux revendications les plus radicales et rétablir l'ordre. L'autre approche consiste à adopter les propositions et à travailler avec l'opposition pour répondre à leurs demandes d'une manière qui ne compromette pas la constitution."
 PAK_Religous_Upheaval.8.d:0 "Dans un discours tonitruant, le Premier ministre a condamné l'opposition pour avoir utilisé l'inquiétude du peuple à l'égard de l'Islam comme outil politique pour cibler les principales institutions du pays. Il a expliqué ce que les manifestations montrent exactement et pourquoi l'Islam ne devrait pas être brouillé par les affaires de l'État."
 PAK_Religous_Upheaval.9.d:0 "Lors d'un débat extraordinaire à l'Assemblée nationale, les parlementaires du gouvernement ont interrogé les dirigeants de l'opposition et des partis islamiques sur ce qu'est un musulman. Les réponses variaient un peu, en fonction de l'origine et de la secte pratiquée par l'individu répondant. Après la discussion, le Premier ministre a souligné que l'islam était présent de manière diversifiée à travers le Pakistan et que, par conséquent, tout effort visant à légiférer sur cette identité était voué à l'échec. Il a demandé à l'Assemblée que s'il ne pouvait y avoir d'accord sur qui est un musulman, comment l'Assemblée nationale pourrait-elle même envisager la question de l'adoption d'une législation relative à l'Islam."
 PAK_Religous_Upheaval.10.d:0 "L'opposition semble divisée suite au dernier débat avec le gouvernement à l'Assemblée nationale. Plusieurs députés ont décidé de reporter leur soutien sur le gouvernement. Quelques chefs religieux ont également appelé leurs partisans à ne plus participer aux manifestations."
 PAK_Religous_Upheaval.11.d:0 "L'opposition n'a pas été impressionnée par le récent débat avec le gouvernement à l'Assemblée nationale. Beaucoup accusent le gouvernement de revenir sur son devoir de défendre l'Islam. En effet, certains parlementaires de la coalition au pouvoir soutiennent désormais les revendications des manifestants."
 PAK_Religous_Upheaval.12.d:0 "Lors d'un récent débat à l'Assemblée nationale sur la résolution des protestations actuelles des partis religieux, le gouvernement a appelé tous les membres à examiner l'héritage de Quadi Azam. Les partisans du gouvernement ont souligné que Mohammad Ali Jinnah avait déployé de gros efforts pour garantir la protection des minorités et assurer l'unité de toutes les communautés musulmanes. Ils ont également souligné tous les éléments de la constitution qui confirment les souhaits écrits du défunt fondateur. C'était une présentation puissante et émouvante, même si l'opposition a tenté de répliquer en affirmant que le gouvernement ne rendait pas compte pleinement des souhaits du bien-aimé Quadi Azam."
 PAK_Religous_Upheaval.13.d:0 "Après de longs débats, le gouvernement a proposé une nouvelle loi sur la protection des pratiques minoritaires pour garantir les droits des citoyens non musulmans dans le pays. Plus important encore, la loi ajoute des sanctions beaucoup plus sévères pour ceux qui sont reconnus coupables de conversion forcée de non-musulmans. La proposition semble être adoptée facilement et constituerait un coup dur pour les protestations religieuses. En privé, l'opposition s'est adressée au gouvernement et souhaite que le projet de loi soit retiré en échange de la fin des manifestations. Ce serait une victoire majeure, mais certains conseillers demandent instamment que le projet de loi soit adopté. Ils notent que l'offre révèle une faiblesse parmi les manifestants et que le gouvernement devrait en profiter maintenant."
 PAK_Religous_Upheaval.14.d:0 "Une commission composée de membres du gouvernement et de l'opposition a soumis un rapport visant à modifier le libellé de certains éléments de la constitution. Ces changements visent à souligner l'importance de l'islam pour le peuple pakistanais. Plus important encore, la constitution commencera désormais par des invocations islamiques. Les laïcs s'opposent à ces propositions, mais ils constituent une nette minorité. Même les membres favorables aux idéaux laïcs soutiennent les mesures car elles ne modifient pas fondamentalement le contenu ni n'ajoutent de nouveaux amendements."
 PAK_Religous_Upheaval.15.d:0 "Il semble que les efforts visant à accommoder l'opposition et les manifestants des partis religieux portent leurs fruits. La décision récente du Parlement d'initier certains changements pour rapprocher le gouvernement d'un caractère islamique est saluée. Il y a maintenant des députés de l'opposition qui soutiennent l'initiative du gouvernement sur ce sujet. Plus important encore, certains des chefs religieux les plus populaires appellent leurs partisans à mettre un terme à la campagne de protestation alors que des changements se produisent."
 PAK_Religous_Upheaval.16.d:0 "Nos efforts pour répondre aux demandes des manifestants religieux et de l'opposition ne produisent pas l'effet escompté. Nos efforts récents sont considérés comme superficiels. Les leaders de la contestation affirment que le gouvernement induit le public en erreur et ne va pas assez loin dans ses propositions. Le discours est de plus en plus répandu selon lequel le gouvernement souhaite tromper le grand public en prétendant se soucier du lancement de véritables réformes islamiques."
 PAK_Religous_Upheaval.17.d:0 "Les tentatives précédentes visant à faire adopter des lois anti-alcool ou anti-jeu ont souvent échoué à obtenir un vote. De nombreux membres de l'Assemblée nationale considéraient la question de la consommation d'alcool comme une affaire privée entre individus qui ne nécessitait pas de législation. La résistance à l'expansion des lois anti-jeu de l'ère coloniale était motivée par des considérations économiques. Il existe des casinos et des projets de construction de nouveaux casinos destinés aux touristes étrangers. L'adoption de lois strictes sur les jeux de hasard nuirait à cet effort. Cependant, les récentes protestations nationales des chefs religieux islamiques ont persuadé le gouvernement que ces questions intéressent la population. Une proposition a été présentée pour adopter une interdiction complète de la consommation et de la vente d'alcool à la communauté musulmane du Pakistan. En outre, il existe un projet de loi visant à étendre les lois anti-jeu de l'époque coloniale, avec toutefois des exceptions pour les étrangers."
 PAK_Religous_Upheaval.18.d:0 "Un comité conjoint de l'opposition et du gouvernement a récemment étudié une proposition de nouveau projet de loi appelé Shariat Court Act. Cela satisferait les demandes des chefs religieux musulmans de tout le pays. Le projet de loi appelle à la création d'une nouvelle Cour fédérale de la charia, avec les principaux oulémas faisant office de juges. Ce tribunal examinerait toutes les lois proposées et déclarerait si elles sont conformes ou non aux principes islamiques. Dans le cas contraire, le projet de loi devra être retiré. Le gouvernement a contré la proposition en suggérant que la Cour fédérale de la charia ne devrait pas être en mesure de bloquer aucun projet de loi, mais plutôt de donner un avis sur la législation proposée. Le premier ministre doit choisir quel projet de loi appuyer."

 PAK_1977_Elections.1.d:0 "Les élections générales de 1977 marquent la première élection menée sous la nouvelle constitution. Le taux de participation électorale devrait être élevé, le PPP ayant lancé une campagne agressive pour sécuriser les électeurs. Les partis d'opposition se sont unis pour former l'Alliance nationale du Pakistan sous la direction du célèbre homme politique de l'opposition et militant anticolonial Khan Abdul Wali Khan. Avant le vote, le leader du PPP, Zulfikar Bhutto, a organisé des rassemblements publics dans tout le pays pour élargir la base de soutien au PPP. L'ANP a utilisé son alliance de partis régionaux et religieux pour lancer une campagne populaire condamnant le PPP pour sa corruption et sa politique économique désastreuse. La campagne a été âpre, les deux camps échangeant de dures accusations contre l'autre."
 PAK_1977_Elections.2.d:0 "Il est clair que le PPP remportera la majorité des sièges aux élections, garantissant ainsi un nouveau mandat à Zulfikar Bhutto en tant que Premier ministre. Avec le recul, il est en fait très clair que le PPP était susceptible de gagner l'ANP, qui n'a pas réussi à proposer un plan concret pour gouverner le Pakistan. La cellule électorale du PPP a reçu des appels téléphoniques de certains cadres du parti qui constatent qu'il y a quelques sièges avec des courses serrées. Ils demandent l'autorisation de garantir que les candidats du PPP remportent ces sièges, ce qui nous permettra d'entrer au Parlement avec une majorité qualifiée et d'éviter les tactiques dilatoires de l'opposition. Cela accélérerait considérablement la plateforme PPP et la transformation du Pakistan en l'État socialiste islamique qu'il a toujours été censé être."
 PAK_1977_Elections.3.d:0 "Câble diplomatique de l'ambassadeur américain au Pakistan : « J'ai été invité à regarder les résultats des élections avec le Premier ministre Zulfikar Bhutto à sa résidence. Une fois que les émissions télévisées ont confirmé que le PPP remporterait la majorité, la salle est devenue en liesse et des boissons ont été distribuées à tous les participants. Son bureau où on l'a entendu maudire les dirigeants de sa cellule électorale pour avoir été trop zélés pour assurer la majorité qualifiée. Il est revenu au parti mais a bu tranquillement et avait l'air embarrassé car les résultats indiquent clairement que des falsifications ont eu lieu pendant l'élection...\""

 PAK_Contested_Elections.1.d:0 "Les élections générales de 1977 ont été entachées de controverses. Les résultats des élections, avec des marges de victoire suspectes et le gain de nombreux sièges au PPP, ont galvanisé l'opposition et l'ANP. De nombreux observateurs pensent que le PPP a effectivement remporté la majorité, mais ses efforts pour obtenir une victoire complète se sont retournés contre lui et ont plongé l'ensemble des élections dans le chaos. L'ANP mène des manifestations, des grèves et des troubles massifs pour exiger la démission du gouvernement et la tenue de nouvelles élections. Le Premier ministre Bhutto reproche à l'ANP d'être gêné par ses mauvaises performances et le condamne pour avoir sapé la nation dans le seul but de gagner des points politiques. L'ANP affirme qu'elle maintiendra le boycott de l'Assemblée nationale et des assemblées provinciales jusqu'à ce que le gouvernement démissionne et que de nouvelles élections soient organisées sous la supervision de la Cour suprême."
 PAK_Contested_Elections.2.d:0 "Nous avons créé la Force fédérale de sécurité pour disposer d'une force paramilitaire fidèle au Premier ministre et responsable de ses ordres. Depuis sa création, nous avons veillé à ce que la FSF reçoive toutes les armes qu'elle demande et offre à son personnel de meilleurs avantages que même l'armée. Nous avons doté leurs officiers de loyalistes et d'officiers de l'armée retraités parce qu'ils ne correspondaient pas à l'institution. Face à la montée des troubles suite aux résultats des élections, le conseiller à la sécurité nationale suggère de déployer la FSF dans les grandes villes pour réduire les manifestations de rue constantes. Certains conseillers craignent que le déploiement de la FSF ne finisse par enflammer les manifestants et se retourne contre eux."
 PAK_Contested_Elections.3.d:0 "Les bataillons des Forces fédérales de sécurité déployés dans les grandes villes ont réussi à réduire les manifestations de rue organisées par l'opposition. Même si la presse internationale et les médias proches de l'opposition critiquent la dureté de la répression, celle-ci est un succès. Les troupes de la FSF et leurs officiers exercent leurs fonctions avec zèle et dévouement. La seule préoccupation que nous avons entendue est que les unités de la police militaire présentes dans les environs ont refusé d'offrir un quelconque soutien aux FSF malgré les ordres d'aider au rétablissement de l'ordre public."
 PAK_Contested_Elections.4.d:0 "Les bataillons des Forces fédérales de sécurité déployés dans les grandes villes ont été pour la plupart chassés et contraints de regagner leurs casernes. Dans de nombreux cas, lorsque les troupes de la FSF ont tenté de disperser les manifestants, un plus grand nombre sont descendus dans la rue et ont submergé nos troupes. Il semble que nos forces de la FSF étaient mal préparées au contrôle des rues et que leurs officiers étaient souvent paniqués. Ce qui est plus préoccupant, ce sont les rumeurs selon lesquelles la FSF aurait demandé du soutien à la police locale, mais celle-ci ne se serait pas concrétisée. Lorsque nos responsables ont contacté la police locale pour obtenir une explication, celle-ci est restée vague et nous soupçonnons que les commandants militaires locaux ont menacé la police de ne pas intervenir."
 PAK_Contested_Elections.5.d:0 "Les Pakistan Rangers constituent la plus grande force paramilitaire au Pendjab et au Sind. Ils sont bien entraînés, équipés et dirigés par des officiers de l'armée pakistanaise. Nos principaux conseillers en sécurité estiment qu'on ne peut pas demander aux Rangers de réprimer les manifestants de l'opposition. Cependant, les troubles publics ont provoqué une augmentation des cambriolages, des vols et d'autres crimes. Les groupes criminels profitent de l'occasion pour se déchaîner. Le Premier ministre peut demander au ministre de l'Intérieur d'ordonner le déploiement des Rangers. Certains conseillers en sécurité nous exhortent à ne pas faire appel aux Rangers, car nous ne pouvons pas être sûrs que leurs officiers exécuteront les ordres avec diligence."
 PAK_Contested_Elections.6.d:0 "Le ministre de l'Intérieur a ordonné aux Pakistan Rangers de se déployer et d'aider les forces de l'ordre à réprimer la recrudescence des crimes. Bien que les Rangers aient obéi à l'ordre et établi des barrages routiers, il semble qu'ils n'aient pas fait de différence significative. La criminalité continue de se déchaîner et nous entendons maintenant des plaintes selon lesquelles le gouvernement est totalement inefficace pour mettre fin à cette nouvelle vague de criminalité. Il semble que les officiers de l'armée qui commandent les unités des Rangers ne déploient que très peu d'efforts pour exécuter leurs ordres. Ils donnent l'impression d'obéir aux directives mais ne font rien."
 PAK_Contested_Elections.7.d:0 "Le ministre de l'Intérieur a ordonné aux Pakistan Rangers de se déployer et d'aider les forces de l'ordre à réprimer la recrudescence des crimes. Les Rangers ont exécuté leurs ordres avec diligence. Les troupes de Rangers ont pris d'assaut des cachettes présumées criminelles et installé des points de contrôle stratégiques. Cela a donné lieu à un grand nombre d'arrestations et de confiscations d'armes et de drogues illégales. Près d'une douzaine de casinos illégaux ont également été détruits. Les médias rendent compte de ces actions de manière positive et la vague de criminalité s'atténue lentement. Cependant, les journaux d'opposition accordent du crédit à l'armée et non au gouvernement. Quoi qu'il en soit, accroître la sécurité des citoyens nous aidera dans nos efforts pour rétablir l'ordre."
 PAK_Contested_Elections.8.d:0 "Les manifestations de l'ANP et les troubles qui en ont résulté ont causé d'immenses difficultés au gouvernement. La situation de l'ordre public dans le pays continue de se détériorer et l'on craint au niveau international que le Pakistan ne soit confronté à un risque de guerre civile. Nos palpations indiquent que l'ANP est ouverte à la tenue de pourparlers. Même s'ils ont maintenu la pression sur le gouvernement, leur coalition a toujours été précaire, avec de nombreux partis différents essayant de travailler ensemble. Leurs dirigeants estiment qu'une solution est nécessaire bientôt. Le cabinet suggère au Premier ministre de tenir des pourparlers, mais d'autres conseillers estiment que le gouvernement devrait simplement tenir le coup et attendre que les efforts de l'ANP perdent enfin de leur élan."
 PAK_Contested_Elections.9.d:0 "Zulfikar Bhutto a dépêché ses proches conseillers pour s'entretenir avec la direction de l'ANP afin de trouver une solution aux troubles. L'ANP est indignée par les récentes élections, affirmant qu'elles ont été massivement truquées en faveur du PPP. Cependant, en privé, l'ANP comprend que le PPP reste un parti populaire doté de cadres puissants dans tout le pays. Ils sont prêts à accepter une proposition visant à organiser de nouvelles élections sous un gouvernement provisoire de technocrates. La seule question est de savoir dans combien de temps les élections auront lieu. Bien qu'aucune résolution finale n'ait été trouvée, il semble que les pourparlers soient sur la bonne voie et que certains discours des dirigeants de l'ANP se soient atténués lors de leurs rassemblements."
 PAK_Contested_Elections.10.d:0 "Zulfikar Bhutto a dépêché ses proches conseillers pour s'entretenir avec la direction de l'ANP afin de trouver une solution aux troubles. L'ANP est indignée par les récentes élections, affirmant qu'elles ont été massivement truquées en faveur du PPP. Les pourparlers sont cependant largement au point mort pour plusieurs raisons. Les représentants de l'ANP ont du mal à présenter une position unifiée car elle est composée de multiples partis et intérêts. Les négociateurs du PPP ne veulent pas admettre que leur parti n'aurait pas obtenu la majorité sans majorité. Les parties étant incapables de se mettre d'accord sur une base de référence, les pourparlers n'aboutissent en grande partie à rien. Cela n'a fait qu'agiter les dirigeants de l'ANP qui ont réagi en intensifiant leur rhétorique, en particulier envers les grévistes."
 PAK_Contested_Elections.11.d:0 "Le ministre de l'Information a déclaré au Premier ministre Bhutto que ses entretiens avec les représentants des principaux journaux n'étaient pas encourageants. Il a souligné aux journaux qu'ils avaient un rôle à jouer en aidant le gouvernement à mettre fin aux troubles. Cependant, la plupart des publications insistent sur le fait qu'elles ne couvriront que l'actualité et ne sont pas tenues de publier des articles favorables au gouvernement. La seule bonne nouvelle est que les dirigeants des médias ont également ajouté qu'ils n'aimaient pas particulièrement certains éléments de l'ANP et que s'il y avait des signes de changements positifs, ils en rendraient compte en détail, comme s'ils ne suivaient pas les diktats du gouvernement, ils étaient conscients de la situation désastreuse à laquelle le pays est confronté."
 PAK_Contested_Elections.12.d:0 "Les reportages des médias ces derniers jours ont été largement positifs. Des sources internes de l'ANP et du PPP divulguent toutes deux des informations selon lesquelles les récentes négociations se sont révélées positives et qu'un consensus se profile à l'horizon. Avec cette nouvelle, les journaux condamnent également l'anarchie et surtout les discours controversés de certains des dirigeants les plus marginaux de l'ANP. Cela a un effet apaisant sur la population et il y a un nouveau sentiment d'optimisme dans l'air, ce qui est rafraîchissant. Le Premier ministre Bhutto a réuni ses conseillers et insiste sur le fait qu'ils continuent de pousser le pays vers la réconciliation et la stabilité."
 PAK_Contested_Elections.13.d:0 "Les reportages des médias ces derniers jours ont été largement négatifs. Des sources internes, notamment au sein de l'ANP, ont divulgué des informations selon lesquelles les négociations avec le PPP n'aboutiraient à rien. Cette nouvelle n'a fait qu'accroître les tensions dans le pays et a incité les ennemis du gouvernement à critiquer le PPP pour chercher à transformer le Pakistan en une dictature à parti unique. Le ministre de l'Intérieur a ordonné aux autorités locales de confisquer et de fermer les journaux considérés comme incitant aux émeutes, mais cette mesure n'est pas pleinement appliquée. En outre, cela a déclenché de nouvelles protestations de la part de ceux qui prétendent que le gouvernement applique désormais la censure."
 PAK_Contested_Elections.14.d:0 "Le Premier ministre Zulfikar Bhutto a annoncé qu'après négociations, le PPP et l'ANP se sont mis d'accord sur une solution aux élections contestées. Bhutto a souligné que lui et les hauts dirigeants de son parti n'étaient au courant d'aucune irrégularité lors des dernières élections, mais ont noté que des problèmes pourraient avoir été causés lors des élections par des militants trop zélés. Il a insisté sur le fait que le PPP n'avait rien à perdre car il était la voix du peuple et il attendait avec impatience de nouvelles élections. La direction de l'ANP a tenu sa propre conférence de presse et a annoncé que de nouvelles élections auraient lieu dans trois mois et a félicité le peuple pakistanais pour sa lutte pour restaurer la démocratie dans la nation. Le Premier ministre Bhutto a démissionné peu de temps après et a confié le pouvoir à un gouvernement intérimaire composé de technocrates neutres qui gouverneront jusqu'à la tenue des élections. De nombreuses personnes dans le pays se félicitent d'un retour à la normale."
 PAK_Contested_Elections.15.d:0 "Après trois mois de campagne vigoureuse, le peuple pakistanais vote à nouveau. Le taux de participation devrait être élevé car le Pakistan doit choisir entre le PPP et le PNA. Le PPP a été accusé d'avoir truqué les dernières élections. Cependant, ses dirigeants ont insisté sur le fait que ces affirmations étaient surfaites et, pour le bien de la nation, ils ont accepté de nouvelles élections. Le leader du PPP, Zulfikar Bhutto, a déclaré avec confiance aux journalistes qu'il n'avait aucune hésitation à organiser de nouvelles élections, car le PPP est la voix du peuple. Les dirigeants de l'opposition de l'ANP ont également exprimé leur optimisme, affirmant que c'était eux et le peuple qui avaient forcé le PPP à restaurer la démocratie dans le pays. Ils ont fait campagne en promettant un État plus islamique qui reflète mieux les désirs de tous les Pakistanais, et pas seulement ceux des villes. Les critiques craignent que la coalition de l'ANP soit trop lourde à gouverner, mais elle a bel et bien mené les manifestations nationales contre les résultats des dernières élections et bénéficie de la faveur de nombreux observateurs."
 PAK_Contested_Elections.16.d:0 "Le général Zia ul-Haq et ses principaux généraux ont lancé une opération visant à destituer du pouvoir le Premier ministre Zulfikar Bhutto et à instaurer la loi martiale dans tout le Pakistan. Les Pakistanais de la capitale et des grandes villes se sont réveillés et ont découvert des troupes armées occupant des bâtiments gouvernementaux clés et encerclant les maisons de hauts responsables gouvernementaux. Le général Zia lui-même a rencontré Zulfikar Bhutto et a insisté sur le fait que les mesures étaient temporaires et ne dureraient que jusqu'à ce que l'ordre puisse être rétabli. L'actuel ancien Premier ministre est pour le moment emmené dans une villa située dans une station de montagne populaire. Dans un discours à la nation, le général Zia a insisté sur le fait que l'armée n'agissait que pour préserver l'intégrité et l'unité du Pakistan."
 PAK_Contested_Elections.17.d:0 "En promettant de nouvelles élections, le gouvernement militaire a libéré l'ancien Premier ministre Bhutto, seulement après que celui-ci ait promis de ne pas affaiblir le régime et reconnu qu'il comprenait que le coup d'État était nécessaire. Cependant, depuis sa libération, Bhutto a parcouru le pays en train, s'adressant à des foules massives. Dans ses discours, il condamne le coup d'État militaire et exige la tenue d'élections le plus tôt possible. Il a également promis que lors de son retour au pouvoir, ceux qui ont violé la constitution en soutenant le coup d'État seront punis. Ces discours agitent les masses et sapent le général Zia alors qu'il tente d'unifier le pays."
 PAK_Contested_Elections.18.d:0 "Dans un arrêt historique, la Cour suprême a accepté l'argument selon lequel le général Zia ul-Haq avait dû lancer son coup d'État en raison de la doctrine de la nécessité. Cette décision légitime la prise de pouvoir par l'armée et mettra fin aux appels visant à ce que les officiers militaires soient poursuivis pour violation de la constitution qui interdit spécifiquement le renversement de tout gouvernement élu. Les critiques du régime militaire, en particulier les dirigeants du PPP, condamnent cette décision, affirmant que les juges sont indûment influencés par l'armée pour trancher en sa faveur. Le général Zia, dans sa propre déclaration, a salué la décision du tribunal comme une preuve de la légitimité de ses actions."
 PAK_Contested_Elections.19.d:0 "Le régime de la loi martiale a officiellement porté plainte contre l'ancien Premier ministre Zulfikar Bhutto et l'a arrêté. Ahmed Raza Kasuri accuse Bhutto d'avoir tué son père, décédé lors d'une tentative d'assassinat bâclée que Bhutto aurait orchestrée. Bhutto nie les accusations comme étant politiquement motivées. Le procès devrait commencer dans un mois à la Haute Cour de Lahore. Les avocats représentant Bhutto ont noté qu'il n'y avait aucune preuve au-delà des témoignages qui sont pour le moins discutables. Le gouvernement a répondu en affirmant que l'accusation disposait d'arguments solides et que personne n'était au-dessus des lois au Pakistan."
 PAK_Contested_Elections.20.d:0 "Le procès de Zulfikar Bhutto a commencé. L'ancien Premier ministre est accusé d'avoir orchestré une tentative d'assassinat contre la famille Kasuri. On dit que Bhutto est confiant car il a préparé un thé légal de premier ordre. Cependant, il apparaît rapidement que les juges semblent partiaux à l'égard de Bhutto, car ils empêchent continuellement les objections de la défense et autorisent le témoignage de témoins qui se sont rétractés après avoir été détenus par les autorités militaires. Bhutto dit à qui veut l'entendre qu'une fois sorti de prison, il punira les personnes impliquées dans ces affaires judiciaires ainsi que le général Zia. De son côté, le général Zia insiste pour ne faire aucune déclaration et s'en remettre à la justice."
 PAK_Contested_Elections.21.d:0 "La Haute Cour de Lahore a rendu un verdict dans le cas de Zulfikar Bhutto. Bhutto a été déclaré non coupable d'avoir directement commis l'attaque contre la famille Kasuri, mais en raison de son association au complot, le tribunal l'a condamné à mort. Presque immédiatement, les avocats de la défense de Bhutto ont condamné la décision et ont demandé à la Cour suprême du Pakistan d'annuler la condamnation à mort. Les avocats de la défense et les observateurs internationaux ont noté que le procès semblait largement irrégulier et partial contre Bhutto. Les juges ont rejeté les preuves présentées par la défense et ont vidé la salle d'audience lorsque Bhutto a demandé à parler. De nombreux Pakistanais pensent que le général Zia ul-Haq et son régime militaire influencent le procès en coulisses. Des foules en colère de partisans du PPP sont descendues dans la rue en réponse. Le général Zia a annoncé qu'il devra reporter les élections prévues jusqu'à ce que l'ordre public puisse être assuré."
 PAK_Contested_Elections.22.d:0 "Après neuf mois, la Cour suprême du Pakistan a confirmé la condamnation à mort prononcée contre Zulfikar Bhutto. Le vote a été adopté par 4 voix contre 3, sur fond d'accusations selon lesquelles les juges étaient contrôlés par le régime militaire du général Zia ul-Haq. Les avocats de Bhutto notent que de nombreux juges sont directement liés à Zia. Ils ont également affirmé que la durée d'une audience d'appel était également le reflet de l'ingérence du gouvernement. Le régime militaire a également imposé un silence sur la réplique rédigée par Bhutto contre ses accusations. Finalement, la Cour suprême a mis des mois à se saisir de l'affaire, de nombreux Pakistanais estimant que ce retard était dû au fait que la plupart des juges étaient favorables à l'acquittement. Ce n'est qu'après que Zia s'est assuré qu'un nombre suffisant de juges confirmeraient la condamnation qu'il a autorisé la poursuite du procès. Malgré la condamnation à mort, les avocats ont déposé de nouveaux recours et appellent les amis de Bhutto à exiger que la peine soit au minimum remplacée par une peine de prison à vie."
 PAK_Contested_Elections.23.d:0 "Le général Zia ul-Haq a annoncé qu'il était au service des tribunaux et que son gouvernement rendait justice, suite à l'annonce de l'exécution de Zulfikar Bhutto à Rawalpindi tôt le matin. L'exécution a eu lieu malgré les appels de nombreux dirigeants internationaux et d'éminents dirigeants pakistanais. Des pays comme l'Arabie saoudite et la Jordanie ont promis d'accueillir Bhutto en exil. Cependant, le général Zia est resté imperturbable et une fois les appels terminés, l'exécution a eu lieu. Le Pakistan serait au point mort, la plupart des citoyens étant stupéfaits d'apprendre que le leader charismatique du parti populaire PPP n'est plus. De nombreux dirigeants du PPP ont juré de se venger et plusieurs organisations de premier plan ont condamné cette action. Cependant, les analystes notent que le général Zia avait depuis longtemps conclu que s'il laissait Bhutto vivre, il risquait sa propre vie, car Bhutto avait promis depuis longtemps de punir les généraux qui avaient lancé le coup d'État et restait un leader national populaire. L'opposition aux prochaines élections est également faible."
 PAK_Contested_Elections.24.d:0 "La décision de l'armée de porter plainte contre Zulfikar Bhutto a incité de jeunes gauchistes, notamment des étudiants universitaires, à commencer à s'organiser en cellules de résistance. Beaucoup de ces jeunes fuient les villes pour se réfugier dans les collines du Baloutchistan, pour se cacher parmi les peuples tribaux historiquement indépendants. Bien que la résistance n'ait pas formellement établi de structure de direction, ses partisans se présentent comme des combattants d'Al-Zulfikar. Ils exigent le rétablissement de la démocratie et la punition de ceux qui la pervertissent."
 PAK_Contested_Elections.25.d:0 "Les partisans du mouvement Al-Zulfikar ont confirmé que l'organisation avait pour l'essentiel cessé de fonctionner. Il semble qu'il y ait eu une violente lutte de pouvoir entre les hauts dirigeants à l'étranger. De nombreux membres, craignant des représailles, ont choisi de rentrer chez eux. Le mouvement Al-Zulfikar n'a pas réussi à développer un message cohérent ni à étendre sa base au-delà des étudiants universitaires de gauche. L'organisation a lancé plusieurs attaques, mais n'a pas réussi à véritablement défier l'armée pakistanaise. Plusieurs tentatives visant à lancer de vastes attaques contre des postes militaires pakistanais ont entraîné de lourdes pertes pour les rebelles. Les membres de retour accusent les agences de renseignement pakistanaises d'être à l'origine des récentes tensions au sein des dirigeants en semant de fausses rumeurs."
 
