 Project_706.1.d:0 "Le récent essai nucléaire indien transforme complètement l'équilibre des pouvoirs régional. L'Inde a amené la menace de l'anéantissement atomique à nos portes. Lors d'une réunion secrète des plus hauts responsables militaires, civils et du renseignement, la décision a été prise d'activer le projet 706. L'objectif du projet 706 est d'atteindre la capacité d'armes nucléaires. Le gouvernement a promis de répondre à toutes les exigences financières tandis que l'armée superviserait les installations et la sécurité. Notre première agence de renseignement parcourra le monde pour trouver des scientifiques pakistanais qui pourraient être utiles au programme. Ils feront appel au patriotisme des officiers et organiseront leur retour chez eux."
 Project_706.2.d:0 "Le physicien nucléaire Abdus Salam est le premier expert atomique du pays. Il est actuellement à l'Université Quaid-e-Azam, où il dirige une équipe de physiciens pakistanais pour résoudre des problèmes dans ce domaine. Pakistanais patriote et spécialiste du renseignement, il est le choix naturel pour jouer un rôle de premier plan dans le projet 707. Certains officiers supérieurs de l'armée et du renseignement traînent les pieds. Ils sont naturellement réticents à donner de l'autorité à un scientifique civil, mais plus important encore, Abdus Salam est membre de la controversée communauté Ahmadi. De nombreux Pakistanais considèrent les Ahmadis comme des apostats et pas vraiment musulmans. Cependant, le Premier ministre Zulfiqar Bhutto a rejeté toutes les inquiétudes, insistant sur le fait que le programme est primordial pour la survie de la nation et que tous les Pakistanais capables d'aider au projet doivent être utilisés."
 Project_706.3.d:0 "Le gouvernement a approuvé la création d'un comité sur les armes nucléaires. Ce groupe secret réunira et coordonnera les différents départements impliqués dans la recherche sur les armes nucléaires. Ses membres comprennent des officiers militaires, des responsables du renseignement, des fonctionnaires et des scientifiques. Bien que certains des plus éminents scientifiques aient exprimé leurs inquiétudes quant au fait que le comité puisse en fait entraver la recherche en raison des agendas contradictoires de ses membres, le gouvernement estime que c'est la meilleure voie à suivre. L'appareil de sécurité a clairement fait savoir qu'il souhaitait une surveillance totale, même au détriment du progrès scientifique. Les membres du comité sont soigneusement examinés pour garantir qu'ils sont non seulement loyaux mais obéissants à la chaîne de commandement."
 Project_706.4.d:0 "Dans le cadre d'une opération de renseignement audacieuse, nos agents et notre service extérieur ont réussi à extraire le Dr Abdul Qadeer Khan des Pays-Bas. Dr A.Q. Khan, un ingénieur nucléaire, travaillait pour une centrale nucléaire, fournissant secrètement au Projet 706 des informations sur les centrifugeuses. Il avait également pressé le gouvernement d'envisager d'utiliser de l'uranium au lieu du plutonium. Il s'est montré très convaincant et, maintenant qu'il est de retour chez lui, il jouera un rôle majeur dans le projet 706. Des plans sont déjà en cours pour lui fournir un laboratoire et une équipe afin qu'il puisse poursuivre sa proposition sur l'uranium. Dr A.Q. Khan n'avait pas été identifié auparavant par le projet, mais il a contacté notre ambassadeur aux Pays-Bas pour lui offrir ses services par devoir patriotique."
 Project_706.5.d:0 "Le Dr Munir Ahmad Khan, organisateur et scientifique chevronné, a assumé la responsabilité de superviser le projet 706. Il est actuellement à la tête de la Commission de l'énergie atomique du Pakistan. Il assure la coordination avec toutes les équipes scientifiques travaillant sur le projet. Ces derniers mois, il a commencé à coordonner directement l'acquisition d'instruments, d'éléments et d'autres matériaux essentiels nécessaires à l'avancement du programme. Il est particulièrement doué pour ce travail. De plus, il travaille bien avec les militaires, expliquant les progrès réalisés et pourquoi certains matériaux doivent être requis."
