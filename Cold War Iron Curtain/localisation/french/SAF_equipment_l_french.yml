 SAF_jet_multirole_equipment_2:0 "Canadair CL-13 Sabre Mark 4"
 SAF_jet_multirole_equipment_2_short:0 "Sabre Mk.4"
 SAF_jet_multirole_equipment_2_desc:0 "Le Canadair Sabre est un avion de combat à réaction construit par Canadair sous licence de North American Aviation. Une variante du F-86 Sabre nord-américain."
 SAF_jet_multirole_equipment_3:0 "Canadair CL-13 Sabre Mark 5"
 SAF_jet_multirole_equipment_3_short:0 "Sabre Mk.5"
 SAF_jet_multirole_equipment_3_desc:0 "le premier Sabre Mk.5 a volé avec le moteur Orenda 10, ce qui lui a donné un net avantage en termes de taux de montée et de plafond par rapport aux variantes précédentes. D'autres améliorations du Mk 5 comprenaient un nouveau système d'oxygène et une maniabilité améliorée et des caractéristiques à basse vitesse obtenues en augmentant la corde de l'aile de six pouces (15,2 cm) à l'emplanture et de trois pouces (7,2 cm) au bout de l'aile ainsi qu'en installant une petite clôture d'aile verticale."
 SAF_jet_multirole_equipment_4:0 "Canadair CL-13 Sabre Mark 6"
 SAF_jet_multirole_equipment_4_short:0 "Sabre Mk.6"
 SAF_jet_multirole_equipment_4_desc:0 "Le Canadair Sabre Mk.6 était la variante finale et était considéré comme le « meilleur » Sabre de production jamais construit. Il était équipé d'un moteur Orenda à deux étages développant 7 275 lb (3 302 kg) de poussée statique. Ses performances en altitude et son taux de montée ont été améliorés par rapport au Mk 5 et le rétablissement des lamelles du bord d'attaque de l'aile lui a conféré d'excellentes caractéristiques à basse vitesse"
 #SAF_jet_multirole_equipment_5:0 ""
 #SAF_jet_multirole_equipment_5_short:0 ""
 #SAF_jet_multirole_equipment_5_desc:0 ""
 SAF_jet_multirole_equipment_6:0 "Dassault Mirage IIICZ"
 SAF_jet_multirole_equipment_6_short:0 "Mirage IIICZ"
 SAF_jet_multirole_equipment_7:0 "Dassault Mirage F1CZ"
 SAF_jet_multirole_equipment_7_short:0 "Mirage F1CZ"
 SAF_jet_multirole_equipment_8:0 "Atlas Guépard C"
 SAF_jet_multirole_equipment_8_short:0 "Guépard C"
 SAF_jet_multirole_equipment_8_desc:0 "L'Atlas Cheetah est un avion de combat sud-africain conçu et produit par la compagnie aéronautique Atlas Aircraft Corporation (plus tard Denel Aeronautics). Il a été développé à la demande et principalement exploité par l'armée de l'air sud-africaine (SAAF)."
 SAF_jet_multirole_equipment_9:0 "Atlas Guépard E"
 SAF_jet_multirole_equipment_9_short:0 "Guépard E"
 SAF_jet_multirole_equipment_9_desc:0 "Le monoplace Cheetah E a été développé comme chasseur provisoire destiné à être utilisé avant que le Cheetah C ne devienne opérationnel. Il était équipé d'une suite avionique et d'un radar relativement simples et conservait le moteur Atar 9C-3. Sa mission typique était celle d'un intercepteur de secours, où au moins deux avions armés de deux missiles V3B (plus tard V3C) seraient en état d'alerte permanent en cas d'attaque venant du nord."
 SAF_jet_multirole_equipment_10:0 "Atlas sculpteur A"
 SAF_jet_multirole_equipment_10_short:0 "Sculpteur A"
 SAF_jet_multirole_equipment_10_desc:0 "L'Atlas Carver était un projet d'avion de combat bimoteur sud-africain à aile delta de quatrième génération. En développement dans les années 1980 et au début des années 1990, le Carver a finalement été annulé en 1991."

 SAF_mr_stealth_fighter_equipment_1:0 "SAAB JAS 39C Gripen C"
 SAF_mr_stealth_fighter_equipment_1_short:0 "JAS 39C Gripen"
 SAF_mr_stealth_fighter_equipment_1_desc:0 "Le Saab JAS 39 Gripen est un avion de combat multirôle léger monomoteur fabriqué par la société suédoise d'aérospatiale et de défense Saab AB. Le Gripen a une configuration d'aile delta et de canard avec une conception de stabilité détendue et des commandes de vol électriques. Les avions ultérieurs sont entièrement interopérables avec l'OTAN. En 2020, plus de 271 Gripen de tous modèles, A à F, ont été construits."
 
 SAF_recon_equipment_0:0 "de Haviland Mosquito PR Mk.IXe"
 SAF_recon_equipment_0_short:0 "Moustique PR Mk.IXe"
 SAF_recon_equipment_0_desc:0 "Le Spitfire est devenu le premier avion de reconnaissance photographique à grande vitesse exploité par la RAF. Parfois non armés, ils volaient à haute, moyenne et basse altitude, s'étendant souvent loin en territoire ennemi pour observer de près les puissances de l'Axe et fournir un flux presque continu d'informations précieuses tout au long de la guerre."
 SAF_jet_recon_equipment_0:0 "Météore Gloster PR.1"
 SAF_jet_recon_equipment_0_short:0 "Météore PR.1"
 SAF_jet_recon_equipment_0_desc:0 "Variante de reconnaissance monoplace du Gloster Meteor F.1."
 SAF_jet_recon_equipment_1:0 "Dassault Mirage IIIAZ(R)"
 SAF_jet_recon_equipment_1_short:0 "Mirage IIIAZ(MD)"
 SAF_jet_recon_equipment_1_desc:0 "Variante de reconnaissance du Dassault Mirage IIIO australien, armé de caméras plutôt que de canons et de missiles. Je prends des photos, mon pote."
 SAF_jet_recon_equipment_2:0 "Atlas Guépard R"
 SAF_jet_recon_equipment_2_short:0 "Guépard R"
 SAF_jet_recon_equipment_2_desc:0 "Le Cheetah R était une étude de faisabilité sur une extension du programme de mise à niveau du Cheetah pour inclure un modèle de reconnaissance spécialisé. Un Mirage IIIR2Z (855) à moteur Atar 9K50 a été choisi comme cellule pour la mise à niveau. En plus de la rénovation de la cellule, le 855 a reçu un nouveau design de nez et le même radar que celui utilisé dans le Cheetah E, les deux canons DEFA de 30 mm ont été retirés et c'était le seul type de Cheetah à ne pas recevoir de sonde de ravitaillement en vol."

