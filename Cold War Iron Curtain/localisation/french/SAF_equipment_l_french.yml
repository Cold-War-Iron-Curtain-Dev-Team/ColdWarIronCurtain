 SAF_atgm_equipment_0:0 "DTAT ENgin Téléguidé Anti-Char ENTAC"
 SAF_atgm_equipment_0_short:0 "ENTAC"
 SAF_atgm_equipment_0_desc:0 "Le missile a été développé par la DTAT (Direction Technique des Armements Terrestres) en même temps que l'industrie privée SS.10"
 SAF_atgm_equipment_1:0 "Nord SS.11"
 SAF_atgm_equipment_1_short:0 "SS.11"
 SAF_atgm_equipment_1_desc:0 "Le développement d'une version améliorée du SS.10 (Nord-5203) a commencé en 1953 sous le nom de Nord-5210. Le missile était conçu comme une version lourde du SS.10 portable destiné à être utilisé à partir de véhicules, de navires et d'hélicoptères. Le missile est entré en service dans l'armée française sous la désignation SS.11. Il a été utilisé comme premier missile antichar héliporté au monde (sur les Alouette II)."
 SAF_atgm_equipment_2:0 "MBDA Missile d'infanterie légère antichar 'MILAN' F1"
 SAF_atgm_equipment_2_short:0 "MILAN F1"
 SAF_atgm_equipment_2_desc:0 "MILAN est un produit d'Euromissile, un programme franco-ouest-allemand de développement de missiles datant des années 1960. Composé de deux composants principaux, le lanceur et le missile, le système MILAN utilise un système de guidage de commande semi-automatique de commande en ligne de visée (SACLOS)."
 SAF_atgm_equipment_3:0 "MBDA Missile d'infanterie légère antichar 'MILAN' F2"
 SAF_atgm_equipment_3_short:0 "MILAN F2"
 SAF_atgm_equipment_3_desc:0 "MILAN est un produit d'Euromissile. La variante F2 comprend une seule ogive principale à charge creuse avec une sonde à distance pour augmenter la pénétration. Un programme franco-ouest-allemand de développement de missiles remontant aux années 1960. Composé de deux composants principaux, le lanceur et le missile, le système MILAN utilise un système de guidage de commande semi-automatique de commande en ligne de visée (SACLOS)."
 SAF_atgm_equipment_4:0 "MBDA Missile d'infanterie légère antichar 'MILAN' F3"
 SAF_atgm_equipment_4_short:0 "MILAN F3"
 SAF_atgm_equipment_4_desc:0 "MILAN est un produit d'Euromissile. Le F3 est équipé d'une ogive à charge creuse Tandem et d'une balise électronique. Un programme franco-ouest-allemand de développement de missiles remontant aux années 1960. Composé de deux composants principaux, le lanceur et le missile, le système MILAN utilise un système de guidage de commande semi-automatique de commande en ligne de visée (SACLOS)."

 SAF_atgm_carrier_equipment_3:0 "Ratel ZT3"
 SAF_atgm_carrier_equipment_3_short:0 "Ratel ZT3"
 SAF_atgm_carrier_equipment_3_desc:0 "Le ZT3 Ingwe (Leopard) est un missile guidé antichar (ATGM) multi-rôle sud-africain moderne fabriqué par Denel Dynamics (anciennement Kentron). Monté sur un Ratel IFV de l'armée sud-africaine."
 SAF_atgm_carrier_equipment_4:0 "Antichar Denel Rooikat"
 SAF_atgm_carrier_equipment_4_short:0 "Rootkat AT"
 SAF_atgm_carrier_equipment_4_desc:0 "Tourelle avec plateforme de missile antichar équipée de missiles ZT3 Ingwe"

