 SAF_CAS_equipment_1_short:0 "Bataille de Fairey"
 SAF_CAS_equipment_2:0 "Curtiss P-40F Kittyhawk Mk II"
 SAF_CAS_equipment_2_short:0 "P-40F Kittyhawk Mk II"
 SAF_CAS_equipment_3:0 "Curtiss P-40N Kittyhawk Mk VI"
 SAF_CAS_equipment_3_short:0 "P-40N Kittyhawk Mk VI"
 SAF_CAS_equipment_3_desc:0 "Le P-40 était un avion de combat monomoteur entièrement métallique développé en 1938 et était une version modifiée du P-36 Hawk. Ce type serait utilisé par un nombre important de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il soit inférieur aux derniers P-47 et P-51, il servirait en première ligne jusqu'à la fin de la guerre. 200 pilotes alliés de 7 pays différents, des États-Unis aux pays du Commonwealth britannique en passant par l'Union soviétique, sont devenus des as du P-40. Malgré les désignations différentes pour le service du Commonwealth et le service soviétique, le surnom officiel du service américain est « Warhawk »."
