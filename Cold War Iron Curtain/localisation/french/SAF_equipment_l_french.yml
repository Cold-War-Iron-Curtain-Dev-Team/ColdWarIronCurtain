 ## Infantry Equipment
 SAF_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 SAF_infantry_equipment_0_short:0 "SMLE n°4"
 SAF_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 SAF_infantry_equipment_1:0 "Travaux d'ingénierie de Lyttleton R1"
 SAF_infantry_equipment_1_short:0 "R1"
 SAF_infantry_equipment_1_desc:0 "le FAL a été produit sous licence en Afrique du Sud par Lyttleton Engineering Works, où il est connu sous le nom de R1. Après une compétition entre le fusil allemand G3, l'Armalite AR-10, et le FN FAL, les forces de défense sud-africaines ont adopté trois variantes principales du FAL dont l'une, considérée comme la principale arme de service, était un fusil portant la désignation R1"

 SAF_infantry_equipment_2:0 "Travaux d'ingénierie de Lyttleton R2"
 SAF_infantry_equipment_2_short:0 "R2"
 SAF_infantry_equipment_2_desc:0 "Une variante \"légère\" du FN FAL 50.64 à crosse repliable, fabriquée localement sous la désignation R2."

 SAF_infantry_equipment_3:0 "Vecteur R4"
 SAF_infantry_equipment_3_short:0 "R4"
 SAF_infantry_equipment_3_desc:0 "Le Vektor R4 est un fusil d'assaut sud-africain de 5,56 × 45 mm. Il est entré en service comme fusil de service standard des forces de défense sud-africaines en 1980. Le R4 a remplacé le R1, une variante du 7,62 × 51 mm FN FAL. Il a été produit par Lyttelton Engineering Works (LIW, \"Lyttelton Ingenieurswerke\"), aujourd'hui Denel Land Systems."

 SAF_infantry_equipment_4:0 "Vecteur R5"
 SAF_infantry_equipment_4_short:0 "R5"
 SAF_infantry_equipment_4_desc:0 "La marine sud-africaine, l'armée de l'air sud-africaine, le service de santé militaire sud-africain et le service de police sud-africain ont adopté une version à carabine courte du Galil SAR de 5,56 mm, fabriquée sous licence sous le nom de R5. Le R5, comparé au plus grand R4, a un canon plus court de 130 millimètres (5,1 pouces), ainsi qu'un système de gaz et un protège-main plus courts. Il lui manque également un bipied et le cache-flash ne prend pas en charge les grenades à fusil."

