 SAF_nav_bomber_equipment_5:0 "Avro Shackleton MR Mk.3"
 SAF_nav_bomber_equipment_5_short:0 "Shackleton MR Mk.3"
 SAF_nav_bomber_equipment_5_desc:0 "Avions de reconnaissance maritime et anti-navigation. La configuration de la roue arrière a été remplacée par un train d'atterrissage tricycle, l'ajout d'une trappe d'entrée avant et des réservoirs en bout d'aile pour augmenter la capacité de carburant. Pour augmenter le confort de l'équipage, l'intérieur a été insonorisé, de meilleurs sièges pour l'équipage et les positions des équipes tactiques ont été réorganisées."
 SAF_nav_bomber_equipment_6:0 "Avro Shackleton MR Mk.3 Phase 1"
 SAF_nav_bomber_equipment_6_short:0 "Shackleton MR Mk.3P1"
 SAF_nav_bomber_equipment_6_desc:0 "La mise à jour de la phase 1 a introduit des modifications principalement au niveau de l'équipement interne."
 SAF_nav_bomber_equipment_7:0 "Avro Shackleton MR Mk.3 Phase 3"
 SAF_nav_bomber_equipment_7_short:0 "Shackleton MR Mk.3P3"
 SAF_nav_bomber_equipment_7_desc:0 "La troisième des trois phases de modification du MR 3 comprenant l'ajout de deux turboréacteurs Armstrong Siddeley Viper à l'arrière des nacelles des moteurs hors-bord pour être utilisés pour le décollage assisté. Les longerons principaux de l'aile ont dû être renforcés en raison des moteurs supplémentaires. Un nouveau système de navigation a également été installé et quelques modifications ont été apportées à l'aménagement interne, notamment une aire de repos de l'équipage plus courte pour donner plus d'espace aux positions tactiques."
 SAF_nav_bomber_equipment_8:0 "Douglas C-47TP Turbo Dakota"
 SAF_nav_bomber_equipment_8_short:0 "C-47TP Turbo Dakota"
 SAF_nav_bomber_equipment_8_desc:0 "Cellule reconstruite avec un réaménagement ajoutant un équipement de capteurs moderne. Équipé de deux nouveaux moteurs Pratt & Whitney Canada PT6A-67F et d'un fuselage allongé pour l'armée de l'air sud-africaine."
 
 #SAAF Helicopter force

 SAF_naval_helicopter_equipment_1:0 "Sikorsky H-5"
 SAF_naval_helicopter_equipment_1_short:0 "H-5"
 SAF_naval_helicopter_equipment_2:0 "Aérospatiale SA316 Alouette III ASW"
 SAF_naval_helicopter_equipment_2_short:0 "SA316 Alouette III ASW"
 SAF_naval_helicopter_equipment_3:0 "Guêpe du Westland HAS.1"
 SAF_naval_helicopter_equipment_3_short:0 "Guêpe HAS.1"
 SAF_naval_helicopter_equipment_3_desc:0 "Le Westland Wasp est un petit hélicoptère anti-sous-marin britannique propulsé par turbine des années 1960. Produit par Westland Helicopters, il est issu du même programme P.531 que le Westland Scout de l'armée britannique et est basé sur le Saunders-Roe Skeeter à moteur à pistons antérieur. Il répondait aux besoins de la Royal Navy en matière d'hélicoptère suffisamment petit pour atterrir sur le pont d'une frégate et transporter une charge utile de deux torpilles à tête chercheuse. "
 SAF_naval_helicopter_equipment_5:0 "Westland Mk.96 Lynx"
 SAF_naval_helicopter_equipment_5_short:0 "Mk.96 Lynx"
 SAF_naval_helicopter_equipment_6:0 "AgustaWestland Mk.300 Super Lynx"
 SAF_naval_helicopter_equipment_6_short:0 "Mk.300 Super Lynx"
 SAF_naval_helicopter_equipment_6_desc:0 "Super Lynx avancé avec moteurs CTS-800-4N utilisé par l'armée de l'air sud-africaine."

 #SAF_attack_helicopter_equipment_1:0 "Bell UH-1B Huey Gunship"
 #SAF_attack_helicopter_equipment_1_short:0 "UH-1B Gunship"
 #SAF_attack_helicopter_equipment_1_desc:0 "Gunship variant of the Bell UH-1B armed with FFAR rocket pods."
 #SAF_attack_helicopter_equipment_2:0 "Bell AH-1S Cobra"
 #SAF_attack_helicopter_equipment_2_short:0 "AH-1S Cobra"
 #SAF_attack_helicopter_equipment_2_desc:0 "The baseline AH-1S is an AH-1Q upgraded with a 1,800 shp (1,300 kW) T53-L-703 turboshaft engine. The AH-1S is equipped with the M65 TOW/Cobra missile subsystem, M65 Telescopic Sight Unit (TSU), and M73 Reflex sight. Japan manufactured 89 AH-1S Cobras under license by Fuji Heavy Industries from 1984 to 2000. The type is used by the Japan Ground Self-Defense Force, and are Step 3 models, which are roughly the equivalent to the U.S. Army's AH-1Fs."
 SAF_attack_helicopter_equipment_3:0 "Atlas XTP-1 bêta"
 SAF_attack_helicopter_equipment_3_short:0 "XTP-1 bêta"
 SAF_attack_helicopter_equipment_3_desc:0 "L'Atlas XTP-1 Beta était un Aerospatiale SA.330 Puma converti par Atlas Aircraft Corporation comme banc d'essai pour les tests et l'évaluation des systèmes dynamiques du Rooivalk. Deux de ces modifications Puma ont été construites, toutes deux ayant des ailes tronquées qui portaient deux pylônes sous les ailes et un magasin au bout de l'aile. Un XTP-1 Beta a été exposé avec deux nacelles de fusée/canon sur les pylônes de chaque aile, une tourelle GA-1 de 20 mm sous le ventre et une sonde de données sur le nez, du côté tribord. "
 SAF_attack_helicopter_equipment_4:0 "Denel AH-2 Rooivalk"
 SAF_attack_helicopter_equipment_4_short:0 "Rooivalk"
 SAF_attack_helicopter_equipment_4_desc:0 "Le Denel Rooivalk (anciennement désigné AH-2 et CSH-2) est un hélicoptère d'attaque fabriqué par Denel Aviation d'Afrique du Sud. Rooivalk signifie en afrikaans \"Red Falcon\". Le développement du type a débuté en 1984 par Atlas Aircraft Corporation, son développement est étroitement lié à l'hélicoptère de transport Atlas Oryx, les deux avions étant basés sur l'Aérospatiale SA 330 Puma et ayant commencé leur développement en même temps."
 SAF_attack_helicopter_equipment_5:0 "Denel AH-2 Rooivalk Mk.1"
 SAF_attack_helicopter_equipment_5_short:0 "Rooivalk Mk.1"
 SAF_attack_helicopter_equipment_5_desc:0 "Le développement du Rooivalk a été prolongé en raison de l'impact des budgets limités des années 1990 et de la volonté de produire un hélicoptère d'attaque très avancé. L'armée de l'air sud-africaine (SAAF) a commandé 12 Rooivalk, désignés Rooivalk Mk 1 en service SAAF, le premier d'entre eux a été officiellement remis en avril 2011."

 SAF_scout_helicopter_equipment_1:0 "Aérospatiale SA 313B Alouette II"
 SAF_scout_helicopter_equipment_1_short:0 "Alouette II"
 SAF_scout_helicopter_equipment_2:0 "Aérospatiale SA 319B Alouette III"
 SAF_scout_helicopter_equipment_2_short:0 "Alouette III B"
 SAF_scout_helicopter_equipment_3:0 "Agusta A109 LUH"
 SAF_scout_helicopter_equipment_3_short:0 "A109 EUH"
 SAF_scout_helicopter_equipment_3_desc:0 "Variante de l'Agusta A109 italien équipé en hélicoptère de combat léger."
 SAF_scout_helicopter_equipment_4:0 "MBB/Kawasaki BK117"
 SAF_scout_helicopter_equipment_4_short:0 "BK117"
 SAF_scout_helicopter_equipment_4_desc:0 "Le MBB/Kawasaki BK 117 est un hélicoptère utilitaire-de transport moyen bimoteur. Il a été développé et fabriqué conjointement par Messerschmitt-Bölkow-Blohm (MBB) d'Allemagne et Kawasaki du Japon. MBB a ensuite été racheté par Daimler-Benz et est finalement devenu une partie d'Eurocopter, qui a ensuite été rebaptisé Airbus Helicopters."
 #SAF_scout_helicopter_equipment_4:0 "Atlas XH-1 Alpha"
 #SAF_scout_helicopter_equipment_4_short:0 "XH-1 Alpha"
 #SAF_scout_helicopter_equipment_4_desc:0 "The Atlas XH-1 Alpha is a prototype attack helicopter built by Atlas Aviation (now Denel) of South Africa, which used it as a concept demonstrator for the then-planned Rooivalk project."

 SAF_utility_helicopter_equipment_1:0 "Mésange Sikorsky H-19"
 SAF_utility_helicopter_equipment_1_short:0 "Mésange H-19"
 SAF_utility_helicopter_equipment_1_desc:0 "Le Sikorsky H-19 Chickasaw (numéro de modèle S-55) était un hélicoptère polyvalent utilisé par l'armée américaine et l'armée de l'air américaine. Il a également été construit sous licence par Westland Aircraft sous le nom de Westland Whirlwind au Royaume-Uni."
