#1960s
 nga60.1.d:0 "Tollé à l'Assemblée alors que le chef yoruba du Groupe d'action, Obafemi Awolowo, a été accusé d'avoir tenté de renverser le gouvernement. Malgré des preuves solides, les habitants du Nord estiment que le Premier ministre Abubakar Tafawa Balewa devrait plutôt nommer Samuel Akintola, allié d'Ahmed Bello, gouverneur de la région occidentale. La question est d'une importance immédiate pour le Nigeria à l'heure actuelle, car des émeutes, du banditisme et tous les actes de violence auront lieu dans l'ouest aussi longtemps qu'Obafemi Awolowo refusera de coopérer avec le gouvernement central."
 nga60.4.d:0 "36 Pays africains boycottent la Coupe du Monde de la FIFA 1966 alors que la FIFA insiste sur l'inclusion de l'Afrique du Sud, pays en proie à l'apartheid. Auparavant, l'Afrique du Sud avait été retirée de la Confédération africaine de football et, en réponse, la FIFA inflige continuellement des amendes à la CAF de plusieurs milliers de francs suisses par an. En réponse, le président de la Confédération africaine de football, Yidnekatchew Tessema, a déclaré : \"La FIFA a adopté une attitude implacable à l'égard des associations africaines et ses décisions ressemblent à des méthodes d'intimidation et de répression destinées à décourager toute nouvelle impulsion de même nature. À notre avis, les associations nationales africaines... Méritaient vraiment un geste de respect plutôt qu'une amende.\""
 nga60.5.d:0 "Le leader de l'ANC, Nelson Mandela, a été jugé aujourd'hui avec ses camarades pour sa défense contre la peine de mort. L'accusation affirme que Nelson Mandela et l'ANC ont tenté de renverser le gouvernement, tout en admettant des actes de sabotage, ce que la défense nie. Dans un discours héroïque et émouvant de trois heures, Nelson Mandela affirme : « Je suis prêt à mourir » alors qu'il porte la cause de son parti sur le devant de la scène médiatique du monde entier. L'indignation internationale se propage à travers le monde alors que des groupes d'étudiants à Londres et le Comité des droits de l'homme des Nations Unies appellent à la libération de Nelson Mandela. En fin de compte, le juge De Wet a déclaré Nelson Mandela et ses compagnons accusés coupables des quatre chefs d'accusation, mais a refusé la peine de mort et a plutôt prononcé une peine de prison à vie."
 nga60.8.d:0 "Dans une tentative d'apaiser les troubles dans le Nord et les théories du complot selon lesquelles le coup d'État des Cinq Majeurs était un complot interne de l'establishment militaire Igbo, Johnson Aguiyi-Ironsi a décidé de libérer les prisonniers militaires du Nord qui avaient été arrêtés lors du précédent coup d'État. Cependant, de nombreux conseillers du général lui disent que cela leur permettrait sûrement de mener un contre-coup d'État. La question reste à trancher..."
 nga60.11.d:0 "L'indépendance du Nigéria depuis seulement cinq ans met aujourd'hui fin à la jeune république du Nigeria. Depuis ses premières élections générales en 1961, le groupe ethnique Igbo du sud a estimé que le gouvernement de sa nation était trop dirigé par le Nord et en réponse, un groupe de majors et d'officiers subalternes d'origine igbo ont commis un violent coup d'État qui a entraîné la mort des dirigeants de la république ouest-africaine. Alors que le monde attend toujours des nouvelles de ces usurpateurs, les gens du monde entier ne peuvent que s'asseoir et se demander ce qui va arriver à l'une des plus jeunes nations du monde..."
 nga60.12.d:0 "Même si le premier coup d'État des cinq grandes puissances au Nigeria a été réprimé par le général respecté Johnson Aguiyi-Ironsi, il est intéressant de noter qu'il était également d'origine igbo. Les théories du complot se sont rapidement répandues, affirmant que ce complot initial était un faux drapeau visant à justifier une prise de pouvoir légitime des Igbos au sein du gouvernement. Les habitants du Nord se sont rapidement accrochés à cette idée comme s'il s'agissait d'une vérité d'évangile jusqu'à ce qu'un nouveau groupe d'officiers plus qualifiés des provinces du nord commette un contre-coup d'État réussi contre Johnson Aguiyi-Ironsi et ses camarades. Dans les contrecoups de cette crise, des pogroms généralisés contre les Igbos éclatent dans toute la partie nord du pays, entraînant une fuite massive de réfugiés retournant vers leur région natale du sud-est."
 nga60.15.d:0 "En gardant à l'esprit les droits pétroliers du Biafra, la France envisage de nous apporter un soutien militaire indispensable dans notre guerre contre le Nord. Malgré de nombreuses critiques selon lesquelles cela nous ferait perdre l'accès aux nôtres, d'autres affirment que cet accord est simplement symbolique et ne nécessitera pas beaucoup de suivi de notre part."
 nga60.16.d:0 "Le dieu Babalú-Aye ou Obaluaye est la divinité yoruba de la variole et de la guérison des maladies. Parmi ceux qui le vénèrent, il y a en général un mépris, voire une opposition, à l'égard des médicaments occidentaux qui nuisent à la santé des habitants des communautés rurales. Certains praticiens ont même empêché les programmes locaux de vaccination contre la variole, croyant que cela provoquerait la colère de leur dieu. En réponse, l'administration du NCNC tente d'amener des enseignants et des missionnaires protestants dans la région pour diminuer ce culte."
 nga60.17.d:0 "Notre sage président, le Dr Nnamdi Azikiwe, a rassemblé les divers groupes ethniques du Nigeria pour une cause commune, effaçant les divisions entre les trois principaux peuples du pays. Parlant couramment le yoruba, l'igbo et le haoussa, le leader multiculturel articulé a été capable de répondre aux griefs de chaque groupe qui ont été expliqués comme provenant de décennies d'exploitation coloniale. Le projet britannique diviser pour régner avait grandement marqué l'ancienne colonie alors qu'ils tentaient d'utiliser le nord féodal autoritaire pour imposer la domination sur le sud non hiérarchique. Cependant, ces dernières années, les Yoruba, les Haoussa et les Igbos commencent à ne plus s'identifier comme leur terme ethnique mais plutôt simplement comme un Nigérian. Peut-être que le panafricanisme a réellement été réalisé..."
 nga60.19.d:0 "Avec la création officielle de la Fédération ouest-africaine, il est maintenant temps de décider quelle devrait être la capitale de la nouvelle nation, car beaucoup trouvent Lagos trop centrée sur le Nigeria"
 nga60.20.d:0 "La victoire du panafricanisme apparaît juste devant le monde alors que les négociations politiques prolongées du kémaliste africain nigérian Chike Obi avec Kwame Nkrumah et d'autres ont finalement abouti à l'intégration de plusieurs États d'Afrique de l'Ouest dans la nouvelle fédération lâche. Le plan proposé pour la première fois dans le manifeste politique d'Obi de son Parti Dynamique a eu un long chemin pour arriver à ce point, comme en témoignent les nombreux compromis qu'il a dû faire dans la gouvernance et l'autonomie du nouveau pays. Les critiques et les sceptiques en dehors de l'Afrique ne demandent cependant que deux choses : est-il durable et ce modèle s'étendra-t-il à d'autres pays ?"
 nga60.21.d:0 "En tant qu'un des éléments essentiels du manifeste du parti de Chike Obi, notre nation a établi diplomatiquement ce qu'il appelle une « Doctrine Monroe ouest-africaine », qui est une affirmation internationale selon laquelle une attaque contre tout État africain indépendant est une attaque contre la Fédération ouest-africaine."
 nga60.22.d:0 "Inspirée par la doctrine américaine Monroe, la Fédération ouest-africaine a annoncé que toute nouvelle tentative de colonialisme ou de violation de la souveraineté africaine serait considérée comme un acte de guerre contre la Fédération. Compte tenu des tensions avec l'Afrique du Sud et le Portugal, les exportations géopolitiques surveillent nerveusement où la puissance africaine montante affirmera son influence."
 nga60.23.d:0 "Dans le cadre d'un coup d'État soutenu par Moscou, le Parti socialiste des travailleurs et des agriculteurs du Nigeria de Tunji Otegbeye est arrivé au pouvoir au Nigeria. Reconnu comme faisant partie de la Vieille Gauche traditionnelle, Otegbeye s'était établi bien avant la création de son parti en étant un organisateur syndical et étudiant très prospère et se retrouve maintenant à prendre la direction d'un gouvernement de transition. Au cours des prochaines années, la nation sera soumise à la loi martiale de la part de l'Armée de libération nigériane (milices de style garde rouge nouvellement formées) alors que l'autorité s'affirme dans tout le pays. Une fois la sécurité nationale assurée, Otegbeye a un plan en plusieurs points dans lequel il affirme, à travers une compréhension dialectique du monde, que les Nigérians ne connaîtront plus les problèmes de luttes ethniques internes qui ont tourmenté la nation depuis les débuts de la colonisation."
 nga60.24.d:0 "Aujourd'hui, Johnson Aguiyi-Ironsi a annoncé le début d'une libération justifiée de l'Ambazonie. La frontière entre le Nigeria et le Cameroun faisait à l'origine partie du mandat unique britannique sur le Cameroun datant de la fin de la Première Guerre mondiale, le nord allant au Nigeria et le sud au Cameroun. Au cours des plans d'indépendance, la région anglophone a tenté de rejoindre le Nigeria ou éventuellement de devenir indépendante sous la République d'Ambazonie, mais à la suite d'un plébiscite en 1961, cet objectif a disparu avec la création par l'ONU d'un État autonome au sein du Cameroun français."
 nga60.25.d:0 "Après une campagne réussie contre le Mali, nous avons pu réaffirmer le contrôle de la nation sous Modibo Keïta. Avec le nouvel alignement sous notre contrôle, il appartiendra désormais à nos diplomates de négocier leur entrée dans la Fédération ouest-africaine."
 nga60.26.d:0 "Depuis le coup d'État de 1968 contre le panafricaniste Modibo Keïta, notre politique étrangère à l'égard du Mali est hostile. Cependant, grâce aux accords conclus avec le précédent dirigeant pour restaurer son régime, la Fédération ouest-africaine est prête à mener une guerre conventionnelle contre le Mali pour tenter de rapprocher la nation de notre objectif panafricaniste. Officiellement aujourd'hui, Chike Obi a annoncé une déclaration de guerre officielle qui a suscité des réactions mitigées dans le monde entier, la France affirmant qu'elle soutiendrait le régime malien actuel."
 nga60.28.d:0 "En réponse aux tensions croissantes entre C. Odumegwu Ojukwu et [NGA.GetLeader], [GHA.GetLeader] organise une assemblée observée au niveau international pour parvenir à un accord sur les tensions dans la région du sud-est. Voulant éviter une crise liée à la succession de la région pétrolière du Biafra, [NGA.GetLeader] écoute toutes les demandes de C. Odumegwu Ojukwu qui a répondu ouvertement et positivement aux entretiens menés dans un cadre amical et professionnel. C. Odumegwu Ojukwu souhaite la transition du Nigeria vers une confédération lâche dotée d'une grande autonomie régionale, tandis que [NGA.GetLeader] souhaite simplement que le chef de l'État soit simultanément le chef des forces armées, comme fin de l'accord. Mais au final, il semble que toutes les propositions faites par Ojukwu seront adoptées à l'unanimité et que la force militaire ne sera en aucun cas utilisée au Nigeria."
 nga60.30.d:0 "Malgré une tentative de négociation à Aburi Ghana entre le gouverneur régional du Biafra, C. Odumegwu Ojukwu, et [NGA.GetLeader], tous les accords ont été reniés, laissant Ojukwu mécontent n'ayant d'autre choix que la succession. Depuis le coup d'État des Cinq Majeurs au Nigeria, des pogroms ont eu lieu dans le nord du pays contre l'ethnie Igbo originaire de la région du sud-est. Le Biafra, étant une région du Nigeria riche en pétrole et à forte densité de population, estime que sa population ne tire aucun avantage de faire partie du gouvernement national nigérian et maintenant le président C. Odumegwu Ojukwu estime que la nation peut se maintenir de manière indépendante. Interrogé sur la crainte d'une tentative des forces armées nigérianes de réaffirmer leur contrôle sur la région, Ojukwu a assuré que le manque de structure de commandement organisée et d'expérience de combat de la jeune armée du pays serait la mort de celle-ci."
 nga60.31.d:0 "Compte tenu de la situation, [NGA.GetLeader] a clairement pris toutes les mesures politiquement possibles pour donner suite aux accords d'Aburi, mais en fin de compte, la nature déraisonnable de C. Odumegwu Ojukwu a abouti à une horrible crise. Cependant, à notre avantage, le manque d'équipement et de fonds de l'État sécessionniste du Biafra, beaucoup de nos militaires pensent que la guerre sera terminée dans quelques semaines. Quoi qu'il en soit, nous devons rester prudents malgré la faiblesse de notre ennemi, car nous ne possédons toujours pas une armée bien organisée et il nous faudra un certain temps pour élaborer un plan militaire solide. Il est temps de projeter la sécurité intérieure et de reprendre le contrôle du sud-est de notre pays !"
 nga60.32.d:0 "L'Armée des Volontaires du Delta vient de déclarer une République indépendante du Delta du Niger sous la direction du jeune major de l'armée, officier de police, enseignant, étudiant universitaire et activiste politique Isaac Adaka Boro. Les Boro, issus du groupe ethnique Ijaw, estiment que l'État du Delta, l'une des principales sources de pétrole du Nigeria, ne profite qu'aux Igbos, aux Hausas et aux Yorubans. En annonçant la révolution, il a déclaré : « Aujourd'hui est un grand jour, non seulement dans votre vie, mais aussi dans l'histoire du delta du Niger. Ce sera peut-être le plus grand jour pendant très longtemps. Sortez quotidiennement de vos veines ; puis combattez pour votre liberté. »"
 nga60.33.d:0 "Depuis que Johnson Aguiyi-Ironsi a réprimé le coup d'État des cinq majors, la croyance commune parmi les habitants du Nord était que les récents événements du Nigeria ont été pris sous le contrôle d'une conspiration d'Igbos souhaitant monopoliser le pouvoir dans le pays. Même avant l'échec du contre-coup d'État du Nord, il y avait des plans pour que le Nord réussisse. C'est dans cet esprit que de nombreux membres de l'état-major à dominante nord ont été entendus mentionner les avantages d'un pays hausaland indépendant à dominante musulmane, dans lequel les Igbos ne interféreraient plus. Même si cela conduirait probablement à une guerre civile totale, nous ne pouvons pas croire que ces personnalités militaires n'envisageraient pas d'aller aussi loin dans un contexte de tensions aussi élevées."
 nga60.34.d:0 "Comme certains l'ont vu venir, une grande partie de l'état-major nigérian est retournée dans son pays du nord où elle a organisé une insurrection militaire dirigée par le général Murtala Mohammed. Cependant, de nombreux habitants du Nord ont choisi de rester dans notre pays, que ce soit pour des raisons religieuses ou politiques, et nous pouvons nous attendre à tenir bon grâce à l'effectif militaire important que nous avons maintenu. Ce qu'il adviendra probablement de l'armée haoussa, c'est qu'elle jouera un rôle défensif en tentant d'exploiter nos ressources dans les déserts et les montagnes de cette région du pays. Cependant, si nous parvenons à nous concentrer sur des embargos à long terme, des bombardements et des frappes d'artillerie, nous parviendrons sûrement à soumettre les traîtres."
 nga60.35.d:0 "Le conflit ethnique au Nigeria a dégénéré en une crise tragique. Hailé Sélassié, dans sa quête continue de participer activement à une politique étrangère africaine positive, estime qu'il peut négocier une fin à cette crise en trouvant un accord mutuellement bénéfique entre les sécessionnistes du Biafra et le gouvernement nordiste nigérian."
 nga60.36.d:0 "La gravité de notre situation concernant la succession du Biafra n'est évidemment pas passée inaperçue auprès des dirigeants du monde. L'empereur éthiopien Hailé Sélassié tente d'organiser des négociations de paix dans sa nation neutre entre C. Odumegwu Ojukwu et [NGA.GetLeader], fidèle à sa réputation d'organisateur interafricain pour la justice et la diplomatie cordiale. Cependant, il est clair que les pourparlers n'aboutiront à rien car il semble qu'Ojukwu ne se contentera de rien de moins que la pleine autonomie et l'indépendance du Biafra vis-à-vis du Nigeria. Avec les semaines qui passent et la guerre qui coûte cher, nous devons déclencher notre option nucléaire : le blocus complet. Il est certain que les Biafrais ne mourront pas de faim lorsque la soumission sera possible."
 nga60.37.d:0 "Bien que nous ayons essayé de faire la paix avec le Nigeria lors des récentes réunions en Éthiopie, ils ont décidé de tout mettre en oeuvre avec leurs options cruelles car ils ne peuvent pas nous vaincre militairement. En bloquant nos ports et en empêchant l'importation d'armes, de provisions ou de nourriture, ils croient pouvoir mettre fin à notre courageuse république. Si nous n'inversons pas rapidement le cours de la guerre ou si la communauté internationale n'intervient pas, nous risquons d'assister à des souffrances inimaginables."
 nga60.38.d:0 "Incapable de connaître de nouveaux succès majeurs au combat, l'armée fédérale nigériane a décidé de lancer un blocus complet de la République sécessionniste du Biafra. Partout dans le monde, des millions de téléspectateurs voient des photographies et des films tragiques, horribles et traumatisants montrant des milliers d'enfants et de nourrissons mourant de faim dans la région du sud-est du Nigeria. Cet événement a donné naissance à des dizaines de nouvelles ONG à travers le monde, organisées autour de la prévention de la famine, l'un des premiers actes de ces groupes ayant été la tentative du plus grand pont aérien du monde, qui se veut plus étendu et à plus grande échelle que le précédent pont aérien de Berlin. Malgré l'indignation internationale, les Nations Unies et les principaux pays du monde ont refusé d'intervenir diplomatiquement dans le conflit et les dirigeants de l'armée fédérale du Nigeria ont déclaré : « La famine est une arme de guerre légitime et nous avons bien l'intention de l'utiliser. »"
 nga60.39.d:0 "Depuis le début de la guerre, l'armée fédérale nigériane a supposé qu'Enugu, la capitale du Biafra, étant le coeur du sentiment sécessionniste, provoquerait la fin de la guerre une fois prise. Cependant, cette idée préconçue a peut-être été naïve car après la prise de la ville, la résistance s'est poursuivie à l'intérieur et autour des lignes de front avec le Biafra. Dans un moment de frustration face à l'arrêt des progrès de la guerre dans la ville, le général Murtala Mohammed a mené ses hommes dans un massacre organisé et systématique de plus de 700 civils dans le but de diminuer le moral de l'ennemi. Peu de tentatives ont été faites pour cacher cela, car le général espère que la nouvelle de cet événement répandra la peur dans tout le pays, mais d'autres membres de notre gouvernement pensent que cela pourrait nuire à notre image internationale."
 nga60.41.d:0 "Yakubu Gowon s'est rendu compte que dans la situation dans laquelle nous nous trouvons, où le Nigeria doit être un État fédéral unique, il sera toujours nécessaire de contrôler l'influence des gouverneurs occidentaux et orientaux. Pour éviter qu'une situation telle que la crise occidentale ou la guerre au Biafra ne se reproduise, nous diviserons les régions du sud et de l'ouest en subdivisions qui laisseront les ressources et les centres de population dans des divisions qui ne sont pas majoritairement Igbo ou Yoruba, car les ethnies minoritaires sont beaucoup plus coopératives et soutiennent le gouvernement fédéral."
 nga60.42.d:0 "La reddition de la République du Biafra ayant été acceptée, Yakubu Gowon a décidé de prononcer un discours sur la principale radio rebelle de la république, Radio Biafra. Sur le réseau, il a prononcé un discours caractérisé par la déclaration répétitive \"Pas de vainqueur, pas de vaincu\" dans laquelle il a promis une politique de \"Réconciliation, Reconstruction et Réhabilitation\" dans laquelle il accorderait l'amnistie à presque tous ceux qui ont combattu pendant la guerre, donnerait 20 dollars à chaque citoyen du Biafra qui avait un compte bancaire nigérian et commencerait un programme de réparation et de développement dans la région. Malgré ces promesses, le citoyen moyen du Sud-Est ne pourrait être moins enthousiaste ou optimiste, car ces affirmations semblent fantaisistes pour la victime normale de la guerre."
 nga60.43.d:0 "Avec la perte des deux principales villes de la République du Biafra, le président C. Odumegwu Ojukwu s'est enfui en avion vers la Côte d'Ivoire tandis que Philip Effiong devait ramasser les morceaux. Dans les heures suivantes, Effiong a accepté de donner la reddition formelle de la République du Biafra à Yakubu Gowon et d'accepter l'annexion complète du Biafra. En remettant la lettre au général Olusegun Obasanjo sur la ligne de front, les combats prendraient encore plusieurs jours pour se terminer, car les nouvelles ne parvenaient pas encore aux milices combattant à l'intérieur du pays."
 nga60.44.d:0 "Après la prise des principaux centres de population du pays haoussa, les combats semblaient de plus en plus futiles pour les habitants de la région. Plus tôt cette semaine, Murtala Mohammed a fui la frontière vers la région ethnique haoussa du Niger où il a tenté d'y rallier une base, en vain. La gravité de cette situation a conduit à une tentative de coup d'État de Hassan Katsina puis à l'effondrement éventuel d'un gouvernement organisé. [NGA.GetLeader] a attendu l'arrivée d'un accord de paix de Hassan Katsina, acceptant une annexion totale et une renonciation à la succession, ce qui a été facilement accepté, même si les combats se poursuivraient dans les régions rurales pendant plusieurs jours."
 nga60.45.d:0 "Lors d'une contre-attaque menée par des commandos du Biafra plus tôt, un complexe pétrolier italien avait été pris le contrôle, de nombreux travailleurs de bas niveau ayant été tués et un groupe de travailleurs expatriés européens pris en otage. Les personnes en captivité, parmi lesquelles 14 Italiens, 3 Allemands de l'Ouest et un Libanais, ont été initialement condamnées à mort pour avoir aidé l'État ennemi nigérian à travers la construction d'infrastructures. Cependant, il y a eu un tollé massif avec les pays occidentaux qui étaient déjà très hostiles au Biafra, maintenant les États-Unis et le Royaume-Uni choisissent une approche encore plus agressive envers le Baifra suite à cet événement. Même le pape Paul VI envoyait du courrier direct à Ojukwu, ce qui a finalement convaincu le dirigeant de gracier les prisonniers."
 nga60.46.d:0 "Après la perte de la capitale du Biafra, Enugu, le chef de la rébellion C. Odumegwu Ojukwu a échappé à la capture et a rejoint la nation amie de la Côte d'Ivoire. Avec un accord de paix parvenu du commandant en second, Phillip Effiong a ainsi mis fin au conflit le plus sanglant de l'histoire de l'Afrique. Avec l'infrastructure de la région entièrement détruite et des famines massives qui perdurent, il sera difficile de susciter un véritable sentiment de réconciliation parmi les victimes de cette guerre. Les discussions sur la grâce de la majorité de ceux du Biafra qui ont combattu pendant la guerre se répandent comme une propagande en faveur de la clémence du gouvernement, alors que les dizaines de criminels de guerre responsables du blocus qui a tué plus de huit mille personnes par jour ne subiront même pas de procès non plus..."
 nga60.47.d:0 "Avec l'écrasement complet de la « République du Delta du Niger », le petit groupe de chefs rebelles dirigé par Isaac Adaka Boro qui composait l'Armée des Volontaires du Delta a été arrêté et emprisonné pour sédition. Cependant, Yakubu Gowon, désireux d'apaiser les tensions ethniques dans le pays, a décidé de gracier Boro, à la suite de quoi il a immédiatement rejoint le commandement de l'armée fédérale nigériane. Alors que la nation est au bord de la guerre civile, peut-être pourra-t-il nous aider sur la ligne de front en recrutant des volontaires de l'État du Delta et en gardant leur moral élevé. " 
 nga60.48.d:0 "La division de commando marin d'élite d'Isaac Adaka Boro, les « Sea School Boys », ont joué un rôle déterminant dans la guerre civile nigériane car leur connaissance des systèmes fluviaux, leur compréhension des différentes langues locales et leurs compétences de survie expertes leur permettant de vivre de la terre ont toutes fait leur succès incroyable. Cependant, de manière inattendue, leur chef Boro a été tué, laissant la division dans un état incontrôlable, errant dans le chaos et devant être dissoute. Il existe deux récits de ce qui s'est passé. L'histoire officielle est que, alors qu'il sécurisait un bastion du Biafra, un rebelle en liberté lui a tiré dessus et l'a tué avec sa division, déclenchant alors une violence aléatoire. Cependant, un deuxième récit a été entendu par un soldat jurant sur les dieux Ijaw que Boro n'avait pas été tué par un rebelle. Il affirme que le secteur était déjà stable et sécurisé et que, à un moment inattendu, alors que les hommes se reposaient, les forces spéciales de Benjamin « Black Scorpion » Adekunle ont tendu une embuscade aux soldats et ont tué Boro sur-le-champ."
 nga60.49.d:0 "Cette semaine, lors d'une agréable cérémonie, Christopher Welby-Everard a transféré la direction des forces armées nigérianes à l'actuel major général Johnson Aguiyi-Ironsi. Tout au long de l'histoire de la colonie et du protectorat du Nigéria, il y a eu un problème majeur de commandement militaire trop britannique, ce qui a conduit à la promotion de nombreux officiers de niveau inférieur à l'indépendance. Pour cette raison, de nombreux membres du personnel britannique ont été laissés à des postes militaires pendant des mois après l'indépendance, car il a fallu du temps pour les remplacer de manière appropriée, Christopher Welby-Everard restant le dernier commandant britannique au Nigeria jusqu'à cette année, laissant une armée désormais entièrement africanisée. "
 nga60.50.d:0 "Un groupe étudiant dirigé par le socialiste Tunji Otegbeye a pris d'assaut la Chambre des représentants pour protester contre le Pacte de défense anglo-nigérian. Otegbeye et les étudiants estiment que le pacte de défense est une continuation du colonialisme britannique et viole la souveraineté du Nigeria en impliquant une nation neutre dans la lutte de pouvoir de la guerre froide entre l'OTAN et le Pacte de Varsovie. Tunji Otegbeye, en tant que marxiste-léniniste, va encore plus loin, estimant qu'en aidant le Royaume-Uni contre l'URSS, il aide et encourage l'oppression des travailleurs au niveau international. En réponse, Tunji Otegbeye, en tant qu'organisateur en chef, a été arrêté et emprisonné avec plusieurs autres camarades, mais ils ont été relâchés le lendemain."
 nga60.51.d:0 "Depuis qu'il est commandant, Johnson Aguiyi-Ironsi se caractérise par son bâton fanfaron avec une mascotte de crocodile en peluche qu'il surnomme affectueusement \"Charlie\". Les légendes de ses soldats entourent la mascotte, de nombreux croyants dans les religions populaires traditionnelles la voient comme un fétiche ou un objet doté de pouvoirs mystiques et spirituels. Les légendes racontent que Johnson Aguiyi Ironsi avait utilisé le bâton pour bloquer les balles au Congo à plusieurs reprises, que le récupérer dans sa voiture lors d'une opération dans la guerre du pays haoussa lui avait permis d'éviter une frappe d'artillerie et, surtout, qu'il était avec lui lors de la tentative de contre-coup d'État dans le nord. Malgré ces affirmations, Johnson Aguiyi Ironsi n'est pas un fétichiste mais un fervent catholique et assure à ses hommes que le bâton fanfaron n'est qu'un bâton et rien de plus."
 nga60.52.d:0 "C'est grâce à notre excellente planification que lorsque nous avons exécuté notre contre-coup d'État dans le Nord, Johnson Aguiyi-Ironsi était déjà entre les mains de Theophilus Danjuma avant qu'il ne se rende compte de ce qui se passait. Après son arrestation, les choses ont commencé à dégénérer lorsqu'il a été ligoté. Interrogé alors que son allié Adekunle Fajuyi et son ADC Andrew Nwankwo étaient retenus en otage près de lui, il a été interrogé à plusieurs reprises sur son implication dans le coup d'État des cinq majors. Alors qu'Aguiyi-Ironsi insistait sur le fait qu'il ne savait rien de la planification du soulèvement et qu'il n'était intervenu que pour ramener la stabilité, ses ravisseurs sont devenus impatients, ce qui a amené les hommes de Danjuma à le battre jusqu'à ce qu'il perde connaissance. Finalement, avec peu d'intérêt pour un procès ou une condamnation, Danjuma a formé un peloton d'exécution qui a tué Aguiyi-Ironsi et Fajuyi tandis qu'Andrew Nwankwo s'est enfui dans la brousse."
 nga60.53.d:0 "Aujourd'hui, Tunji Otegbeye annonce officiellement l'abolition des tribunaux de la charia, la non-reconnaissance du Qadi comme autorité légale et le début d'une campagne de propagande visant à dissuader toutes les formes de loi islamique. Bien que le Nigeria soit une nation diversifiée sur le plan religieux, avec des sunnites, des catholiques, des protestants et des dizaines de croyances traditionnelles, Tunji estime que se concentrer sur la réduction de l'influence de l'islam devrait être la priorité, car il constitue l'épine dorsale du pouvoir de la noblesse féodale du nord. Cette initiative n'a cependant pas été acceptée sans opposition, c'est pourquoi les soldats de l'Armée de libération nigériane sont présents dans l'abolition forcée des tribunaux de la charia et superviseront les pratiques juridiques dans toutes les régions du nord."
 nga60.54.d:0 "La féodalité existe depuis près d'un millénaire au Nigeria et son emprise sur la paysannerie hongroise et illettrée du pays est indéniable. Exécutés comme une action militaire précise, les soldats de l'Armée de libération nigériane accompagnés de caravanes d'élèves-enseignants suivent de longues routes le long de la campagne rurale du nord du Nigeria, affrontant un domaine après l'autre où les paysans se voient redistribuer les biens de leurs nobles et sont éduqués sur la manière dont ils doivent travailler à la révolution et ne reconnaître aucune autorité à leurs anciens propriétaires. Dans certaines circonstances cependant, la noblesse a convaincu ses paysans illettrés que l'Armée de libération nigériane les tuerait et détruirait leurs villages, ce qui entraînerait de petites levées de combat lors de courtes escarmouches. Cependant, dans chaque cas, le moral des serfs est très bas et dès le début, l'ALN est capable de négocier la fin de la situation avec très peu de morts."
 nga60.55.d:0 "Johnson Aguiyi-Ironsi prévoit la construction d'un nouveau parlement et d'un nouveau palais présidentiel (dont il n'est techniquement ni Premier ministre ni président) à Port Harcourt. Aguiyi-Ironsi estime que Lagos, en tant que capitale, est trop représentative de l'héritage colonial du Nigeria, car la ville au nom portugais a toujours été le centre de la domination coloniale britannique dans la région. En établissant une capitale dans un nouveau centre-ville en construction au coeur des Igbo de Port Harcourt, Aguiyi-Ironsi tente de définir la vision d'une nouvelle ère pour un Nigeria indépendant."
 nga60.56.d:0 "Lors d'une cérémonie inspirée par la déclaration de la République populaire par Mao, Tunji Otegbeye s'est manifesté sur la place principale de Lagos sur un stand entouré de gardes armés devant une foule qui remplissait les rues sur des centaines de mètres. Beaucoup de gens ont applaudi, d'autres sont restés silencieux, certains montrant des expressions de pure joie tandis que d'autres ont regardé leur chef d'un air renfrogné. Dans son discours, Tunji a commencé par dénoncer les propriétaires terriens, les réactionnaires et autres ennemis de l'État, après quoi il a annoncé le début d'une nouvelle ère non seulement pour le Nigeria mais pour toute l'Afrique, alors que la révolution mondiale sera un jour réalisée grâce à l'effort combiné des travailleurs et des agriculteurs de la nation vers une cause unique. Mais ce sera radical, insiste-t-il, et il faudra recréer pleinement l'identité entière de la nation... "
 nga60.57.d:0 "De nombreuses villes du Nigéria portent les noms coloniaux des colonisateurs britanniques et européens. Lagos, par exemple, est le mot portugais pour lacs, tandis que Port Harcourt parle de lui-même. La question qui se pose lorsqu'il s'agit de renommer les villes du Nigeria est de savoir si nous devrions les changer en noms autochtones ou les renommer d'après des personnalités socialistes et panafricanistes ?"
 nga60.58.d:0 "Dans la première étape de la révolution du pays, le projet de changement de capitale est d'abord remis en question. Lagos étant le centre colonial de l'ancienne colonie et protectorat du Nigeria, cela lui donne une connotation négative en tant que capitale et son emplacement est très peu pratique pour la gouvernance. Le choix d'une nouvelle capitale devrait se faire dans un emplacement central et non dans un endroit où une ethnie majeure exerce une domination disproportionnée."
 nga60.59.d:0 "Bien qu'il y ait eu d'intenses protestations partout dans le monde suite au meurtre de Patrice Lamumba, les choses sont devenues particulièrement intenses ici au Nigeria. Une grande partie du quartier financier de Lagos a été incendiée lors d'une émeute à grande échelle impliquant des milliers d'étudiants de tout le pays, tous dirigés par nul autre que le docteur marxiste Tunji Otegbeye. Bien qu'Otegbeye ait continuellement semé le trouble dans le pays, sa place importante signifie que le chaos pourrait s'ensuivre si des mesures trop strictes étaient prises à son encontre. En réponse, la police fédérale a décidé de l'arrêter et de le détenir, ainsi que ses collègues, pour quelques mois seulement."
 nga60.61.d:0 "Après le vaste congrès ouest-africain, notre gouvernement est parvenu à un accord avec les autres nations de l'assemblée. Il est temps de commencer l'intégration."
 nga60.62.d:0 "La première question qui sera posée au congrès est de savoir comment notre nouveau gouvernement devrait être structuré et comment devrait-il fonctionner. Les nations impliquées en Afrique de l'Ouest proviennent de différents empires coloniaux et, en tant que telles, ont toutes eu des méthodes différentes pour parvenir à la décolonisation. Les divergences idéologiques entre Nkrumah et Obi n'ont pas encore été discutées, car cela enliserait probablement l'ensemble du congrès. Au lieu de cela, l'accent est aujourd'hui mis uniquement sur de simples décisions structurelles du pouvoir législatif du gouvernement. Comment sera-t-il structuré ?"
 nga60.63.d:0 "Le congrès d'aujourd'hui a donné lieu à une bagarre entre Kwame Nkrumah et son allié Ahmed Sékou Touré contre Chike Obi. Alors que la plupart des questions politiques ont été balayées entre eux et simplement laissées de côté, la seule position fortement contestée entre les deux est celle de l'allocation budgétaire de la nation. Avec les vastes ressources et la population de la nouvelle nation, Kwame Nkrumah et Ahmed Sékou Touré veulent concentrer l'économie du pays sur les infrastructures publiques, le développement social et l'éducation. Chike Obi y croit, il veut concentrer une grande partie du budget sur le renforcement militaire afin de disposer d'une armée formidable capable de défendre toute l'Afrique de l'impérialisme. Faisant valoir que le nouveau pays sera en mesure de disposer d'une technologie militaire locale comparable à celle des pays européens, il estime que cela nécessitera un nombre massif d'étudiants ingénieurs et de scientifiques mandatés par l'État pour effectuer des recherches militaires. Aucun des deux ne semble bouger sur la question. Que devrions-nous faire ?"
 nga60.64.d:0 "Même depuis l'époque antérieure à Marcus Garvey, les Africains ont vu leur lutte commune contre l'oppression de l'impérialisme étranger et souhaitaient une unité et une force grâce à la grande ingéniosité et au courage du peuple africain. Avec l'échec de l'Union des États africains de Nkrumah et Touré en 1963, il semblait que l'idée d'une fédération africaine unifiée en Afrique de l'Ouest n'avait jamais vu le jour. Cela a changé avec l'arrivée au pouvoir d'un parti dynamique au Nigeria, Chike Obi étant prêt à établir une fédération avec des dirigeants partageant les mêmes idées dans la région, comme objectif principal de son administration. Au cours des prochains jours, un congrès réunira divers représentants des pays d'Afrique de l'Ouest réunis pour une même cause."
 nga60.65.d:0 "Inspiré par la même décision prise par Kemal Atatürk, Chike Obi a formellement interdit tout port public du hijab ou d'autres couvre-chefs islamiques. Faisant le lien entre la domination de l'élite féodale islamique au Nigeria et les fondamentalistes de l'ancien EmpireOttoman, Chike Obi a prononcé un discours télévisé devant la nation dans lequel il a clairement indiqué que de telles coutumes sont des reliques désuètes du passé dont toute nation en voie de modernisation devrait se débarrasser. Même si cela sera difficile à appliquer et que l'influence encore existante de la culture islamique au Nigeria créera des réactions négatives à cette décision, Obi n'accepte aucune critique concernant cette décision."
 nga60.66.d:0 "Les marques tribales yoruba remontent à au moins des milliers d'années et ont toujours été un facteur majeur dans la hiérarchie des sociétés yoruba car elles signifient l'affiliation à un clan et ceux qui n'en ont pas dans leur société sont entièrement ostracisés et incapables d'avoir une interaction significative avec les autres. Réalisées à un jeune âge avec des instruments tranchants et brûlants, les cicatrices se présentent normalement sous la forme d'une série de 4 à 15 marques sur le visage pour les hommes et de plusieurs dizaines sur les seins ou les fesses pour les femmes. Souvent, cette pratique peut entraîner une infection ou, dans certaines circonstances, des déformations involontaires. Dans le plan de modernisation et d'occidentalisation complète du pays de Chike Obi, il souhaite non seulement abolir complètement cette pratique, mais aussi les anciennes constructions sociétales qui rendent cette pratique nécessaire."
 nga60.67.d:0 "Les mutilations génitales féminines sont une pratique vieille de plusieurs milliers d'années qui transcende la religion et l'origine ethnique dans toute l'Afrique de l'Ouest. Au Nigeria, à la surprise de certains, la plus grande propension à cette pratique se situe dans les croyances chrétiennes et traditionnelles du sud. Là-bas, près de la moitié des filles et des femmes subissent l'excision, une pratique qui vise à retirer les lèvres des femmes dès leur plus jeune âge afin d'empêcher tout plaisir sexuel pour des raisons spirituelles. Cette pratique peut entraîner de nombreux problèmes de santé et même plus tard dans la vie, elle peut entraîner des problèmes mortels lors de l'accouchement. Chike Obi s'est prononcé à plusieurs reprises contre cette pratique et lancera une campagne d'information à l'échelle nationale pour réduire cette pratique et imposera des sanctions légales allant jusqu'à cinq ans de prison pour ceux qui pratiquent cet acte."
 nga60.68.d:0 "Dans un nouveau projet de loi présenté au Parlement par Nnamdi Azikiwe et qui renforcera et protégera les droits des travailleurs à s'organiser, le principal organisateur syndical, Tunji Otegbeye, attire beaucoup d'attention. Otegbeye réclame des ajouts supplémentaires au projet de loi qui empêcheront de briser les grèves et de licencier les travailleurs en grève. Cette étape supplémentaire pourrait rendre le projet de loi trop controversé et ne pas pouvoir être adopté. Que devons-nous faire ?"
 nga60.69.d:0 "Partout dans les usines textiles de Lagos, des grèves à grande échelle ont été organisées par Tunji Otegbeye. L'ampleur et l'intensité ont empêché toute intervention des autorités et, même si nous ne modifierons pas le projet de loi, nous devrons faire des promesses vides de sens et attendre que cela se termine."
 nga60.70.d:0 "Lorsque le militarisme est introduit en politique, il est toujours presque impossible de l'éliminer. L'histoire de tant de premières démocraties nationales se termine ainsi par un seul coup d'État ou coup de poing. À la suite d'un tel événement, l'armée aura toujours le sentiment qu'elle a la capacité de prendre le contrôle du gouvernement si elle estime que cela n'est pas dans son intérêt. C'est une tradition qui ne peut être défait. C'est du moins la norme et ce que nous devons croire, mais peut-être que Zik et le NCNC peuvent nous créer un avenir différent de celui-là. Avec la stabilité du pays grâce aux réformes de Zik, nous pouvons atteindre un niveau où un événement tel qu'un coup d'État ultérieur serait considéré comme une impossibilité morale et sociétale. Nous aurons une démocratie stable, permanente et durable et rien ne nous arrêtera !"
 nga60.71.d:0 "L'une des convictions fondamentales de Nnamdi Azikiwe en tant que panafricaniste est sa forte volonté d'abolir le favoritisme ethnique, le favoritisme religieux et les structures tribales et féodales traditionnelles qui perpétuent ces pratiques. Grâce à l'exercice d'un système de fonction publique et d'une bureaucratie impitoyablement réglementés, avec des sanctions extrêmes pour le népotisme, la corruption et, par-dessus tout, la discrimination ethnique ou religieuse, on a le sentiment d'une véritable ascension au-delà de la politique tribale qui a gouverné le Nigeria depuis la création de la colonie et la domination du Nord créée par les Britanniques. Avec le nationalisme nigérian de Zik prenant véritablement forme, nous verrons un pays de Nigérians, et non de Hausans, de Yorubas ou d'Igbos."
 nga60.72.d:0 "Grâce à un effort massif de dizaines de milliers d'étudiants, des campagnes d'alphabétisation à grande échelle ont commencé à avoir lieu avec des groupes organisés assignés à des districts spécifiques, puis à s'étendre aux villages et villes ruraux périphériques. Ce programme, inspiré d'une initiative similaire entreprise par Cuba il y a quelques années, devrait réduire l'analphabétisme de moins de 10 pour cent au cours des cinq prochaines années. Le secrétaire Tunji Odegbeye a également clairement indiqué que le programme enseignerait également aux habitants des campagnes comment ils doivent contribuer au progrès de la révolution et apprendre à ignorer leurs vieilles superstitions et croyances hiérarchiques."
 nga60.73.d:0 "Compte tenu du coup d'État soutenu par la CIA qui a renversé Nkrumah, nous serions incapables d'accueillir le Congrès de l'Afrique de l'Ouest sans lui. Cette horrible injustice peut être réparée, Nkrumah est bien vivant en Guinée et occupe actuellement le poste de coprésident. Nous pouvons montrer à l'Occident que si les nations du tiers monde travaillent ensemble, nous ne pouvons pas être bousculés et intimidés pour nous soumettre, il est temps de remettre le père du panafricanisme à la place qui lui revient !"
 nga60.75.d:0 "La semaine dernière, le dramaturge et auteur novice Wole Soyinka a présenté à un large public urbain sa nouvelle pièce « Une danse des forêts ». La pièce se concentre sur les erreurs des États précoloniaux du Nigeria et prédit un Nigeria postcolonial qui fonctionnera de manière corrompue et sans but. Bien que la pièce soit essentiellement destinée à mettre en garde contre les fautes du passé et à ne pas les répéter, parmi la classe supérieure et l'establishment politique, la pièce est vivement critiquée, tandis que chez d'autres, elle est rapidement devenue influente. Avec la carrière de Wole Soyinka en plein essor, il espère encourager un nouveau Nigéria unique dont la culture puisse transcender l'impérialisme européen."
 nga60.76.d:0 "Hier, alors que l'avion de ligne nigérian 825 effectuait un survol de Kano à Lagos pour un vol en provenance de Londres, une catastrophe s'est produite lorsque l'avion s'est écrasé dans l'épaisse forêt entourant l'aéroport international de Lagos. Manquant à peine de dégagement, le train d'atterrissage de l'avion a été accroché par la canopée des arbres tropicaux voisins, ce qui lui a fait perdre le contrôle et exploser dans une énorme boule de feu, tuant les 76 passagers et 11 membres d'équipage. Bien qu'une enquête sur la manière dont cette erreur ait pu être commise soit toujours en cours, des spéculations circulent sur un acte criminel puisque plusieurs armes à feu ont été trouvées dans l'épave. Cependant, les autorités locales ont demandé au public de ne pas tirer de conclusions hâtives, car avec les preuves actuelles, nous ignorons tout simplement ce qui s'est passé dans ces derniers instants du vol 825."
 #1970s
 nga70.1.d:0 "Yakubu Gowon n'a jamais été le leader incontesté du Nigeria, ceux qui occupent des postes élevés savent toujours qu'il était à la merci des conspirateurs de la junte initiale. Il n'a donc pas été surprenant que l'un des principaux cerveaux du contre-coup d'État du Nord, Murtala Muhammad, ait commis un putsch sans effusion de sang contre Gowon alors qu'il était en visite pour représenter le Nigeria au sommet de l'Organisation de l'unité africaine à Kampala. Officiellement, la cause du coup d'État était le résultat du peu de progrès de Gowon vers une transition vers un gouvernement civil, bien que beaucoup pensent que Yakubu Gowon n'a été choisi comme chef de l'État que parce qu'il était un candidat non haoussa et non musulman à une époque de tensions ethniques. La guerre civile étant terminée et le Nigeria sécurisé, un musulman du Nord peut désormais prendre les commandes."
 nga70.2.d:0 "Une tragédie s'est produite aujourd'hui lorsque la voiture de Murtala Muhammad, alors qu'il se rendait à son bureau, a été touchée par une série de balles qui l'ont tué sur le coup. Un contre-coup d'État avorté visant à réintégrer Yakubu Gowon, dirigé par le lieutenant-colonel Buka Suka Dimka, a eu lieu. Alors que Dimka et ses co-conspirateurs ont été rapidement retrouvés et exécutés par un peloton d'exécution, le gouvernement britannique a refusé d'extrader Gowon. Alors que la nation pleure Murtala Muhammad, son numéro deux, Olusegun Obasanjo lui succédera désormais à la tête de l'État."
 