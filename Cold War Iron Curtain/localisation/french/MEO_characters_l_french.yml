 POLITICS_VUONG_CHI_SINH_DESC:0 "§YLe légendaire roi Meo de Hà Giang§L.\nVương Chí Sình fut une figure singulière de l'histoire de l'Indochine française, régnant sur les hauts plateaux Hmong comme une nation de facto indépendante. Né Vàng Seo Lử en 1886, il hérita du pouvoir de son père et lutta pour protéger son peuple de la domination étrangère. Contrairement aux autres souverains vietnamiens, son royaume des Meo ne fut jamais pleinement soumis à la domination coloniale française, conservant son autonomie grâce à une diplomatie stratégique et une résistance farouche.\nDurant la Seconde Guerre mondiale, Vương Chí Sình rallia les Hmong contre les incursions japonaises et françaises, consolidant ainsi son statut de protecteur des hauts plateaux du nord. Après la Révolution d'août, il prêta allégeance à Hô Chi Minh, qui l'adopta comme frère juré et lui donna le nom de Vương Chí Thành. Il devint par la suite membre de l'Assemblée nationale de la République démocratique du Vietnam, où il défendit la représentation des Hmong au sein du nouvel ordre socialiste. Bien que son royaume ait disparu de l'histoire, son héritage de dirigeant ayant su naviguer dans les complexités de la guerre, du colonialisme et de la révolution demeure un chapitre déterminant de la lutte du Vietnam pour son indépendance."
 POLITICS_DUONG_TRUNG_NHAN_DESC:0 "§YLe Tusi de Mèo Vạc§L.\nDương Trung Nhân était le rival farouche de la dynastie Vương. Né en 1912, fils de Dương Tự Nghĩa, il hérita du ressentiment familial envers les Vương, dont le pouvoir les avait dominés pendant des générations. Contrairement à Vương Chí Sình, qui avait pris parti pour le Viet Minh, Dương Trung Nhân s'allia à la République de Chine, adoptant le tridémisme et jurant de libérer les Hmong du joug des Vương et de l'influence communiste. Farouche anticommuniste, il chercha à établir un État libre Hmong indépendant sous sa propre direction, se positionnant comme le dernier espoir d'un avenir non communiste dans les hauts plateaux. Sa lutte contre la dynastie Vương et le Viet Minh a fait de lui un acteur clé de la politique fragmentée des régions frontalières du nord."