 HUM_Building_up_a_Tourism_Industry:0 "Construire une industrie touristique"
 HUM_Building_up_a_Tourism_Industry_desc:0 "Nous sommes sévèrement limités par l'espace régional pour les méthodes économiques traditionnelles. Les plages luxuriantes et les océans magnifiques constitueront donc un facteur clé de notre future stratégie économique. Le tourisme est une poule aux oeufs d'or que nous pouvons exploiter, et qui peut commencer par l'expansion fondamentale des industries touristiques locales."
 HUM_Rebuild_the_Royal_Hotel:0 "Reconstruire l'Hôtel Royal"
 HUM_Rebuild_the_Royal_Hotel_desc:0 "L'hôtel Royal est l'une des institutions clés qui nous rapportent des revenus. L'argent de l'hôtel est vital pour nos sources de revenus et constitue une excellente base à partir de laquelle les riches et les puissants peuvent explorer l'archipel de leur propre gré, avec un luxe incroyable et des prix encore plus incroyables."
 HUM_Widen_the_Southwark_Port:0 "Élargir le port de Southwark"
 HUM_Widen_the_Southwark_Port_desc:0 "À l'heure actuelle, l'arrivée des navires de croisière constitue une étape essentielle dans nos objectifs en matière d'industrie touristique. Le port est actuellement insuffisant pour répondre à nos besoins, tant nationaux qu'internationaux, et nous devrons donc financer l'élargissement des quais clés et la construction de nouvelles infrastructures d'embarquement."
 HUM_Modernizing_Southwark:0 "Moderniser Southwark"
 HUM_Modernizing_Southwark_desc:0 "Le joyau de nos territoires est Southwark, et Southwark est un gâchis d'infrastructures obsolètes, de logements médiocres et d'une économie entièrement composée de pêcheurs et d'expéditeurs. Un financement pour une infrastructure routière appropriée, une structure de gouvernance adaptée à une nation indépendante et des espaces de bureaux louables commenceront à transformer Southwark en une véritable capitale"
 HUM_Finding_an_Oil_Drilling_Partner:0 "Trouver un partenaire de forage pétrolier"
 HUM_Finding_an_Oil_Drilling_Partner_desc:0 "Les opérations de forage pétrolier sont un défi, surtout lorsque très peu de pays nous prennent au sérieux. Nous aurons besoin d'un partenaire pour nous aider à réunir les capitaux nécessaires à la construction de plates-formes de forage pétrolier. Nos ambassadeurs sont prêts à commencer à discuter de concessions, mais nous avons besoin de la confirmation de l'État avec qui conclure un accord."
 HUM_Electrification_of_Southwark:0 "Électrification de Southwark"
 HUM_Electrification_of_Southwark_desc:0 "Un État moderne a besoin d'infrastructures modernes, et ces infrastructures comprennent l'éclairage, le chauffage et les biens de consommation les plus récents et les plus performants. Cela nécessitera une expansion de la capacité de transport d'électricité et de transformation, ainsi que l'acquisition de nouveaux générateurs."
 HUM_Import_De-salination_Treatment_Machines:0 "Importer des machines de dessalement"
 HUM_Import_De-salination_Treatment_Machines_desc:0 "L'eau est un besoin fondamental pour tout État, et nous ne disposons pas exactement de puits souterrains, de lacs et de rivières d'eau douce. Cela ne nous laisse qu'une seule option, certes coûteuse, qui consiste à installer une usine de dessalement pour convertir l'eau salée en eau douce. Heureusement, cela signifie que la majeure partie de la population aura accès à de l'eau potable, ce dont la plupart des États ne peuvent que rêver"
 HUM_Invest_in_Salt-tolerant_Crops:0 "Investissez dans des cultures tolérantes au sel"
 HUM_Invest_in_Salt-tolerant_Crops_desc:0 "Il n'y a pas beaucoup de fermes dans notre État, évidemment parce que la plupart des sols ne sont pas arables et ne disposent pas de suffisamment d'eau douce pour soutenir des cultures comme le coton. Nous pouvons investir dans des cultures tolérantes au sel comme l'orge et dans des plantations de cultures commerciales comme la noix de coco."
 HUM_Rebuild_the_IJA_Shinnan-Shoto_Base:0 "Reconstruire la base navale de Shinnan-Shoto"
 HUM_Rebuild_the_IJA_Shinnan-Shoto_Base_desc:0 "Durant la Seconde Guerre mondiale, les Japonais occupèrent ces îles et l'armée impériale japonaise y installa plusieurs bases militaires. Le plus grand, aujourd'hui en ruine, n'est qu'à quelques investissements mineurs avant d'être réactivé en tant que quartier général d'une force de défense appropriée pour dissuader l'agression."
 HUM_Smuggling_Pirate_Weapons:0 "Contrebande d'armes de pirates"
 HUM_Smuggling_Pirate_Weapons_desc:0 "La piraterie est une source majeure d'armes volées ou acquises dans le monde. Orient et Occident, moderne et ancien. Nous ne pouvons pas obtenir d'armes par la fabrication et les acheter auprès des grandes nations coûte cher, ce qui nous laisse la seule option : acquérir des armes sur le marché noir. Ce sera également discret par rapport aux licences traditionnelles."
 HUM_Resettle_the_Nagashima_Submarine_Base:0 "Réinstaller la base sous-marine de Nagashima"
 HUM_Resettle_the_Nagashima_Submarine_Base_desc:0 "La base sous-marine de Nagashima servira de quartier général idéal pour notre nouvelle marine, et ses cales de halage pourront être utilisées pour la modernisation planifiée de petits bateaux de patrouille côtière. Utiliser des sous-marins appropriés est hors de portée pour l'instant, mais certains cutters et patrouilleurs nous fourniront instantanément les moyens de ralentir au moins les envahisseurs potentiels et d'empêcher les raids des pirates"
 HUM_Repair_Leftover_IJA_Patrol_Craft:0 "Réparer les restes du vaisseau de patrouille IJA"
 HUM_Repair_Leftover_IJA_Patrol_Craft_desc:0 "L'IJA a utilisé un certain nombre de petites canonnières de patrouille pour des actions anti-raids et comme forme de reconnaissance côtière, dont certaines sont toujours là, même si elles ont certes connu des jours meilleurs. Nos options sont cependant limitées, donc les réparer sera notre moyen de sécuriser nos eaux côtières. Malheureusement, il ne reste plus aucun des sous-marins miniatures de l'IJA pour les compléter."
