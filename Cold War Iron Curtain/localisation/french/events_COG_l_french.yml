l_french:
 congo_mutiny.1.d:0 "Bien que le Congo ait officiellement déclaré son indépendance de la Belgique le 30 juin 1960, le quotidien de l'ex-colonie est resté essentiellement le même, bon nombre de ses institutions coloniales étant toujours en activité. L'une d'entre elles, la Force Publique, a fait l'objet d'importantes réactions négatives au Congo. Bien que la Belgique se soit officiellement retirée de la colonie, de nombreux hauts fonctionnaires de la Force publique sont restés belges, au grand dam des membres noirs de la force. Ces tensions ont atteint leur paroxysme aujourd'hui, lorsque plusieurs unités entièrement noires se sont mutinées contre leurs officiers belges en réponse à la déclaration du commandant en chef Emile Janssen selon laquelle la situation après l'indépendance ne changerait pas par rapport à avant. Ces unités ont parcouru plusieurs kilomètres à travers la campagne congolaise, prenant de nombreux Belges en otages et recrutant davantage de soldats. Bien que Janssen ait tenté d'organiser des troupes pour écraser les mutins, le nouveau gouvernement a favorisé les négociations qui ont abouti à la réforme de la Force Publique en Armée Nationale Congolaise, ainsi qu'à l'expulsion des officiers belges."    
 mobutu_cos.1.d:0 "\n\nMobutu, l'officier de la garnison congolaise, est nommé aujourd'hui chef d'état-major de la garnison coloniale congolaise. Dans une tentative d'africaniser la direction de la garnison afin d'apaiser les tensions avec les soldats, le colonel Mobutu a été nommé chef d'état-major. Sa nomination a été largement acceptée par les ministres en charge de la nomination, car l'autre candidat Maurice Mpolo n'a pas confiance. Craignant que Maurice puisse commettre un coup d'État parce qu'il avait de l'influence sur les soldats mutinés, Mobutu s'est vu confier ce poste."     
 lumumba_deposed.1.d:0 "Lumumba, premier Premier ministre du Congo, a été destitué après quelques mois au pouvoir. La dissidence et le mécontentement se propagent au Congo depuis un certain temps déjà et les mutineries ne font que s'aggraver.\nMobutu Sese Seko, le chef d'état-major des forces armées congolaises, avec le soutien des États-Unis et de la Belgique, vient d'arrêter le premier Premier ministre. Lumumba est actuellement transféré à Port Francqui, dans le sud du Congo."   
 un_congo.1.d:0 "Quelques jours après la mutinerie congolaise, les troupes belges envahissent le Congo pour tenter de rétablir l'ordre car les forces sécessionnistes de Tshombe se renforcent. Cela a conduit le premier Premier ministre Lumumba à appeler à une intervention de l'ONU pour résoudre la situation. Lumumba déclare que l'invasion du Congo par les forces belges est un acte d'agression injustifiée et une tentative de rétablir le contrôle colonial de la Belgique sur le Congo. De plus, Lumumba a demandé à plusieurs reprises aux forces de l'ONU de soumettre le gouvernement rebelle dirigé par Tshombe.\nL'ONU devrait réagir d'ici quelques jours."       
 un_congo.2.d:0 "Le gouvernement congolais, lors d'une réunion de sécurité avec d'autres membres du Conseil sur la situation postcoloniale au Congo, déclare que l'ONU est incompétente. Bouleversé par l'incapacité des forces de sécurité de l'ONU à assurer l'ordre ou à expulser les forces belges de la zone, Lumumba a protesté en affirmant que l'ONU était incapable de résoudre la situation. L'ONU a déclaré en réponse qu'elle exhorterait les Belges à retirer rapidement leurs troupes du Congo."       
 congo_un.20.d:0 "Alors que les mois passent sans qu'une solution claire soit trouvée, le gouvernement congolais accuse l'ONU de se ranger du côté de Tshombe et des sociétés minières étrangères. Le gouvernement congolais exige aujourd'hui que les forces de l'ONU se retirent du pays et cessent d'interférer dans le pays.\nCes demandes découlent de mois de désaccords entre le gouvernement congolais et les Nations Unies sur le mandat de maintien de la paix ; spécifiquement sur la question du Katanga. L'ONU a catégoriquement refusé de reprendre le Katanga, affirmant qu'il s'agit d'une question interne et qu'il lui est interdit d'intervenir en raison de l'article 2 de la Charte des Nations Unies.\nLe Congo demande actuellement à l'Union soviétique une aide immédiate en matière de sécurité pour faire face à la situation."       
 un_congo.3.d:0 "Le gouvernement congolais a lancé un ultimatum à l'ONU pour qu'elle retire immédiatement ses forces. Exaspéré par l'augmentation des forces de l'ONU au Congo et le refus des troupes de l'ONU de réprimer le mouvement sécessionniste katangais, le Congo a lancé un dernier ultimatum à l'ONU pour qu'elle se retire immédiatement. Si cette demande n'est pas satisfaite, le Congo recevra l'aide soviétique et lancera une attaque contre la province sécessionniste du Katanga."      
 belgium_congo.1.d:0 "Exaspéré par l'incursion belge au Congo et insatisfait de l'excuse de leur présence pour protéger les ressortissants belges, le gouvernement congolais exige que la Belgique retire immédiatement ses troupes du Congo.\nLes tensions ont continué de monter à mesure que la Belgique a augmenté la taille de ses garnisons locales dans la région. Le gouvernement congolais craint de pouvoir rétablir le régime colonial ou de contraindre le gouvernement congolais.\nLe gouvernement belge a répondu en réaffirmant son objectif et a déclaré qu'il se retirerait dès qu'il pourra assurer la sécurité ou qu'il sera remplacé par une garnison de l'ONU capable de faire de même."    
 lumumba_death.1.d:0 "Même si l'exécution semble être un mot clair, la mort de l'ancien Premier ministre congolais Patrice Lumumba l'est tout sauf. Au cours des mois de décembre 1960 et janvier 1961, Lumumba traverse un enfer, sous-alimenté et « vivant dans des conditions absolument impossibles » à Camp Hardy, jusqu'à ce que les soldats refusent même de travailler. Il fut finalement retenu et transporté par avion à Elisabethville où il fut battu et torturé par des officiers katangais et belges, jusqu'à ce que lui et deux autres soient exécutés par un peloton d'exécution le 17 janvier 1961 en présence d'officiers belges. Afin de se débarrasser des corps, les bourreaux démembraient et faisaient bouillir les corps dans de l'acide sulfurique, puis broyaient et dispersaient les os. Bien que le gouvernement katangais maintienne officiellement son rapport tardif de trois semaines selon lequel il a été tué par des villageois en colère, les gens de Belgrade à New York sont en armes contre cette démonstration tragique et tyrannique."    
 mobutu.2.d:0 "La Garde Souveraine de Lumumba a empêché un coup d'État et tué Mobutu. Craignant une tentative de coup d'État, Lumumba a secrètement rassemblé une unité des forces spéciales des services secrets connue sous le nom de Garde souveraine du Congo. Le SGC compte des membres triés sur le volet parmi les meilleurs des forces armées congolaises et entraînés par l'Union soviétique. Lumumba a chargé le garde de le défendre et d'être prêt à frapper Mobutu si nécessaire.\nLe jour où Mobutu a lancé son coup d'État, le SGC a récupéré une note confidentielle de l'attaque et a monté une embuscade. En route, les forces de Mobutu furent prises en embuscade et envahies par les forces du SGC armées de lance-flammes soviétiques modifiés. Le SGC, sous couvert de fumée, a réussi à éteindre le feu des forces de Mobutu. Aucun membre du SGC n'a été tué et Mobutu a péri dans les flammes avec ses proches loyalistes.\nLumumba a déclaré l'état d'urgence et organise une force pour chasser les sociétés étrangères illégales et les ennemis du Congo. La contre-attaque a apporté des gains politiques massifs et a attiré des recrues patriotes et des mercenaires régionaux, trop effrayés pour travailler pour les ennemis de Lumumba."       
 mobutu.3.d:0 "L'ONUC sévit actuellement contre toutes les unités mercenaires au Congo. L'ONU a publié une résolution appelant au retrait total de toutes les unités mercenaires belges et katagnardes au Congo. L'ONUC a reçu pour mandat d'arrêter les mercenaires étrangers partout où ils les rencontrent.\nL'ONU a publié une déclaration à ce sujet affirmant que les unités de mercenaires constituent une menace pour la stabilité et la paix du Congo. Cela en a surpris beaucoup car le mandat initial de l'ONUC les empêchait de prendre parti et cette action est directement en conflit avec ce mandat. Il est peu probable qu'une telle action ne rencontre pas de résistance et risque de donner lieu à un conflit dans un avenir proche."       
 zaire.1.d:0 "Pendant la crise du Congo de 1960 à 1965, la République du Congo nouvellement formée était engagée dans des conflits locaux continus avec des mouvements séparatistes soutenus par la Belgique et des gouvernements rivaux. Après les élections de 1965, le colonel Mobutu lança un coup d'État sans effusion de sang et prit le contrôle du pays. Bien qu'il ait promis de rétablir la démocratie, il a dissous le Parlement et aboli le poste de Premier ministre. En 1967, il a fondé le MPR, le seul parti légal du pays. S'engageant dans une campagne d'authenticité, Mobutu a renommé de nombreuses villes congolaises pour éradiquer leur héritage colonial et a promu une attitude culturelle pro-africaine. Les actifs étrangers ont également été nationalisés et Mobutu a consolidé son pouvoir en formant un gouvernement hautement centralisé et étroitement réglementé, avec lui comme dictateur incontesté. Ses efforts ont abouti puisqu'il a officiellement rebaptisé la République du Congo en République du Zaïre. Bien qu'il s'agisse en grande partie d'une décision symbolique, elle représente le contrôle total de Mobutu sur le Congo et son mépris pour son héritage colonial, ainsi que l'échec d'une autre démocratie africaine."         
 tshombe.1.d:0 "Le leadership de Tshombe en est maintenant à sa septième année et suscite de nombreuses célébrations dans les rues. Le Congo a déjà connu un afflux massif d'investisseurs étrangers et le Bureau gouvernemental du travail assure à tous que les conditions de travail sont les meilleures au monde. Tshombe est également fier d'annoncer que des centres de réhabilitation sont opérationnels à travers le pays et se consacrent à la réforme des individus qui s'opposent à l'État du Congo. Comme le montrent ces images très photogéniques, la population de l'État du Congo est très heureuse d'être sous le règne bienveillant de Tshombe.\nCependant, tout le monde n'est pas satisfait du règne de notre glorieux leader et de nombreux journalistes indépendants ont faussement dénoncé des « violations des droits de l'homme » et une « oppression ». Le Réseau de Radiodiffusion de l'État du Congo a réfuté ces affirmations en prouvant que tout va bien et est heureux ici au Congo. Malheureusement, beaucoup de ces journalistes ont commis des suicides très élaborés très rapidement après que leurs affirmations absurdes aient été réfutées."       
 mobutu_execution.1.d:0 "Mobutu, qui a été capturé par les forces de Tshombe, a été condamné à mort à l'issue d'un procès expéditif. Mobutu a été reconnu coupable de conspiration contre le peuple congolais, de désir du chaos et du pouvoir plutôt que de l'ordre et de l'harmonie et d'être complètement incompétent. Tshombe a présenté de nombreux éléments de preuve importants tels que les échecs de Mobutu en tant que chef d'état-major et la tentative de Mobutu de tuer le gouvernement congolais sans aucun plan pour le remplacer. De plus, Tshombe a présenté des preuves qui ne seront pas publiques en raison de leur nature graphique. De telles preuves ont révélé l'amour de Mobutu pour frapper les enfants, puis pour vendre de la drogue à ces mêmes enfants pour soulager la douleur qu'il ressent lorsqu'il les frappe puis les frappe à nouveau. Un comportement aussi choquant et cruel ne convient qu'aux pires punitions. Cependant, dans un accès de miséricorde, Tshombe a condamné Mobutu à une mort miséricordieuse aux mains d'un alligator."
 mobutu.10.d:0 "Avec le rétablissement du contrôle du pays, la crise du Congo semblait terminée. Depuis son premier coup d'État en 1960, le colonel Mobutu Sese Seko consolidait son pouvoir, assurant la loyauté des divisions locales et envoyant celles dont la loyauté était douteuse dans des garnisons isolées. À la suite de l'opération Dragon Rogue, le Premier ministre Moïse Tshombe a perdu les faveurs du président Kasa-Vubu et de Mobutu, provoquant une crise politique lors des prochaines élections de 1965. Alors que Tshombe obtenait la majorité, Kasa-Vubu a exploité la défection d'une grande partie de son parti pour nommer Evariste Kimba au poste de Premier ministre. Le Parlement a rejeté la décision du président, ce qui a provoqué une impasse politique paralysant le gouvernement congolais. Le 25 novembre, Mobutu sort de l'impasse en prenant le pouvoir par un coup d'État sans effusion de sang. Mobutu a déclaré l'état d'urgence, lui donnant un pouvoir illimité pendant 5 ans. Il a promis de restaurer la démocratie après cette période, mais avec un soutien interne et étranger considérable et une autorité dictatoriale, il reste incertain s'il sera prêt à abandonner son pouvoir."
