 ####Team Weapons
 
 team_weapons_1:0 "Armes d'équipe I"
 team_weapons_1_short:0 "Armes d'équipe I"
 team_weapons_1_desc:0 "Armes de soutien de base de la Seconde Guerre mondiale."
 team_weapons_2:0"Armes d'équipe II"
 team_weapons_2_short:0 "Armes d'équipe II"
 team_weapons_2_desc:0 "Armes de soutien améliorées du début de la guerre froide."
 team_weapons_3:0 "Armes d'équipe III"
 team_weapons_3_short:0 "Armes d'équipe III"
 team_weapons_3_desc:0 "Armes de soutien encore améliorées du début au milieu de la guerre froide."
 team_weapons_4:0 "Armes d'équipe IV"
 team_weapons_4_short:0 "Armes d'équipe IV"
 team_weapons_4_desc:0 "D'autres armes de soutien avancées du milieu à la fin de la guerre froide."
 team_weapons_5:0 "Armes d'équipe V"
 team_weapons_5_short:0 "Armes d'équipe V"
 team_weapons_5_desc:0 "Armes de soutien modernes utilisant les leçons historiques apprises en matière de poids et de puissance de feu."
 
 ####Squad Weapons
 
 squad_weapons_1:0 "Armes d'escouade I"
 squad_weapons_1_short:0 "Armes d'escouade I"
 squad_weapons_1_desc:0 "Armes d'escouade de base de la Seconde Guerre mondiale."
 squad_weapons_2:0 "Armes d'escouade II"
 squad_weapons_2_short:0 "Armes d'escouade II"
 squad_weapons_2_desc:0 "Armes d'escouade améliorées tenant compte des leçons apprises après la Seconde Guerre mondiale"
 squad_weapons_3:0 "Armes d'escouade III"
 squad_weapons_3_short:0 "Armes d'escouade III"
 squad_weapons_3_desc:0 "Armes d'escouade de l'époque de la guerre froide pour garantir la puissance de feu du créateur d'une escouade ou d'une section d'infanterie sur le terrain."
 squad_weapons_4:0 "Armes d'escouade IV"
 squad_weapons_4_short:0 "Armes d'escouade IV"
 squad_weapons_4_desc:0 "Une puissance de feu supplémentaire sous la forme d'armes d'escouade rendant l'infanterie individuelle encore plus meurtrière."
 squad_weapons_5:0 "Armes d'escouade V"
 squad_weapons_5_short:0 "Armes d'escouade V"
 squad_weapons_5_desc:0 "Armes de soutien d'escouade modernes utilisant les leçons historiques apprises en matière de poids et de puissance de feu."
 
 #### Specialist Weapons
 
 specialist_1:0 "Armes spécialisées I"
 specialist_1_short:0 "Armes spécialisées I"
 specialist_1_desc:0 "Armes spécialisées de base de la Seconde Guerre mondiale."
 specialist_2:0 "Armes spécialisées II"
 specialist_2_short:0 "Armes spécialisées II"
 specialist_2_desc:0 "Armement spécialisé amélioré tenant compte des leçons apprises après la Seconde Guerre mondiale."
 specialist_3:0 "Armes spécialisées III"
 specialist_3_short:0 "Armes spécialisées III"
 specialist_3_desc:0 "Équipement spécialisé mis à jour ajoutant une létalité, une exactitude et une précision supplémentaires sur le terrain."
 specialist_4:0 "Armes spécialisées IV"
 specialist_4_short:0 "Armes spécialisées IV"
 specialist_4_desc:0 "Un équipement spécialisé plus avancé de l'époque de la Guerre froide, rendant les troupes spécialisées plus précises et plus meurtrières."
 specialist_5:0 "Armes spécialisées V"
 specialist_5_short:0 "Armes spécialisées V"
 specialist_5_desc:0 "Armes spécialisées modernes de haute puissance avec une exactitude et une précision améliorées."

 ####Ammunition and explosives
 
 ammo_explosives_1:0 "Explosifs et munitions I"
 ammo_explosives_1_short:0 "Explosifs et munitions I"
 ammo_explosives_1_desc:0 "Types d'explosifs et de munitions de l'époque de la Seconde Guerre mondiale."
 ammo_explosives_2:0 "Explosifs et munitions II"
 ammo_explosives_2_short:0 "Explosifs et munitions II"
 ammo_explosives_2_desc:0 "Types d'explosifs et de munitions améliorés du début de la guerre froide."
 ammo_explosives_3:0 "Explosifs et munitions III"
 ammo_explosives_3_short:0 "Explosifs et munitions III"
 ammo_explosives_3_desc:0 "Types d'explosifs et de munitions mis à jour du début au milieu de la guerre froide."
 ammo_explosives_4:0 "Explosifs et munitions IV"
 ammo_explosives_4_short:0 "Explosifs et munitions IV"
 ammo_explosives_4_desc:0 "Autres types d'explosifs et de munitions avancés du milieu à la fin de la guerre froide."
 ammo_explosives_5:0 "Explosifs et munitions V"
 ammo_explosives_5_short:0 "Explosifs et munitions V"
 ammo_explosives_5_desc:0 "Des explosifs et des munitions modernes avec des amorces améliorées, un pouvoir d'arrêt, un potentiel de dégâts et des mesures de sécurité."
 
 ####Man Portal Anti Tank Systems
 
 manpats_1:0 "Systèmes antichar portables I"
 manpats_1_short:0 "MANPATS JE"
 manpats_1_desc:0 "Une arme antichar portable de base destinée à être utilisée par les unités d'infanterie. Dans le service occidental, on l'appelle souvent bazooka."
 manpats_2:0 "Systèmes antichar portables II"
 manpats_2_short:0 "MANPATS II"
 manpats_2_desc:0 "Avec l'amélioration de l'épaisseur du blindage, les systèmes antichar portables à tir d'épaule nécessitent des ogives améliorées pour être efficaces."
 manpats_3:0 "Systèmes antichar portables III"
 manpats_3_short:0 "MANPATS III"
 manpats_3_desc:0 "Des mises à jour supplémentaires de la technologie de pénétration du blindage et un poids réduit permettent aux systèmes antichar portables de cette génération d'être encore plus efficaces."
 manpats_4:0 "Systèmes antichar portables IV"
 manpats_4_short:0 "MANPATS IV"
 manpats_4_desc:0 "Une génération améliorée d'armes antichar légères permet à une unité d'infanterie de devenir un ennemi puissant pour tout blindé adverse."
 manpats_5:0 "Systèmes antichar portatifs V"
 manpats_5_short:0 "MANPATS V"
 manpats_5_desc:0 "Les lanceurs antichar légers modernes dotés d'un pouvoir de pénétration performant peuvent s'avérer extrêmement mortels sur un champ de bataille."

 infantry_manpats_tt:0 "§CDébloque la décision de déployer des MANPATS pour augmenter les capacités antichar de l'infanterie et des véhicules d'infanterie.§!"
 
 ####Man Portable Anti Aircraft Systems
 
 hmg_1:0 "Mitrailleuse lourde AA"
 hmg_1_short:0 "MG lourde AA"
 hmg_1_desc:0 "Les mitrailleuses lourdes peuvent aider une unité d'infanterie à se défendre contre une attaque aérienne sans avoir besoin de faire appel à des unités anti-aériennes spécialisées distinctes."
 manpads_1:0 "Systèmes portatifs de défense aérienne I"
 manpads_1_short:0 "MANPADS JE"
 manpads_1_desc:0 "La première génération de manpads portables. Ils manquent de précision sur le terrain mais lorsqu'ils parviennent à se connecter avec un avion ennemi, les résultats peuvent être spectaculaires."
 manpads_2:0 "Systèmes de défense aérienne portables II"
 manpads_2_short:0 "MANPADS II"
 manpads_2_desc:0 "Systèmes anti-aériens portables de deuxième génération conçus pour utiliser l'infrarouge pour atteindre une cible. Attention aux hélicoptères et aux avions volant à basse altitude."
 manpads_3:0" Systèmes portatifs de défense aérienne III"
 manpads_3_short:0 "MANPADS III"
 manpads_3_desc:0 "Systèmes anti-aériens portables avancés avec une grande certitude d'atteindre une cible."
 manpads_4:0 "Systèmes portatifs de défense aérienne IV"
 manpads_4_short:0 "MANPADS IV"
 manpads_4_desc:0 "Systèmes de défense aérienne portables modernes avec suivi infrarouge performant et missiles avancés."

 infantry_manpads_tt:0 "§CDébloque la décision de déployer des MANPADS pour augmenter les capacités anti-aériennes de l'infanterie.§!"

 ####Personal Protection Gear 
 
 protection_equip_1:0 "Équipements de Protection Individuelle I"
 protection_equip_1_short:0 "Protection I"
 protection_equip_1_desc:0 "Casques de première génération pour se défendre contre les blessures causées par les éclats d'obus."
 protection_equip_2:0 "Équipement de Protection Individuelle II"
 protection_equip_2_short:0 "Protection II"
 protection_equip_2_desc:0 "Protection de deuxième génération avec une plus grande résistance pour protéger également contre les tirs d'armes légères."
 protection_equip_3:0 "Équipement de Protection Individuelle III"
 protection_equip_3_short:0 "Protection III"
 protection_equip_3_desc:0 "Casque de protection de troisième génération et gilets pare-balles pour se protéger contre les impacts d'armes légères ou d'explosifs."
 protection_equip_4:0 "Équipement de Protection Individuelle IV"
 protection_equip_4_short:0 "Protection IV"
 protection_equip_4_desc:0 "Casque de protection de quatrième génération et gilets pare-balles pour se protéger contre les éclats d'obus et l'énergie de souffle."
 protection_equip_5:0 "Équipement de Protection Individuelle V"
 protection_equip_5_short:0 "Protection V"
 protection_equip_5_desc:0 "Les équipements de protection modernes destinés à protéger les soldats contre les explosions, les éclats d'obus et les armes légères augmentent la capacité de survie de l'individu."

 infantry_protection_tt:0 "§CDébloque la décision de déployer des équipements, des armures et des uniformes d'infanterie pour augmenter la capacité de survie de l'infanterie.§!"