 Malaysia.0.a:0 "À notre nouvelle nation !"
 Malaysia.0.b:0 "Intéressant."
 Malaysia.0.t:0 "[GetNewspaperHeader]La formation de la Malaisie"
 Malaysia.0.d:0 "Kuala Lumpur, [?global.date.GetDateStringNoHourLong] - La Fédération de Malaisie a vu le jour, unissant les États de la péninsule aux territoires de Bornéo sous un même drapeau et un seul parlement. Les foules ont rempli le padang pour la proclamation et l'Union Jack est descendue pour la dernière fois sur les territoires gouvernés par le ministère des Colonies depuis un siècle.\n\nLa nouvelle fédération est une construction ambitieuse. Il rejoint des sultanats malais, une ville commerciale chinoise et deux États de Bornéo qui n'ont pas grand-chose en commun au-delà du fait de l'administration britannique, et ce, alors qu'une insurrection couve encore dans la jungle du nord. Ses architectes affirment que seule une fédération de cette taille peut protéger la région contre le communisme ; ses détracteurs répondent qu'un État assemblé aussi rapidement mettra une décennie à découvrir ce qu'il est réellement.\n\nLa reconnaissance a été rapide à Londres et à Washington et manifestement absente ailleurs. La Malaisie commence sa vie avec une constitution, une armée et des voisins qui n'ont pas encore décidé quoi en faire."
