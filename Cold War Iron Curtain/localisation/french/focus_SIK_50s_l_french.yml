#Country Events 
 ETR.100.d:0 "Nous avons envoyé un message confidentiel de l'Union Soviétique au gouverneur du Sinkiang. Il dit au gouverneur que s'il accepte de former une coalition avec notre État et de proclamer ensuite l'indépendance, les Soviétiques promettront notre protection. L'offre soviétique, si elle était acceptée, libérerait probablement notre peuple du joug chinois. Cependant, les opposants à cette offre soulignent qu'elle pourrait simplement remplacer la domination chinoise par la Russie. Plus important encore, il semble que les Soviétiques tenteraient d'acquérir des droits sur nos riches ressources naturelles. Mais en même temps, c'est peut-être le prix à payer pour la liberté."
 ETR.105.d:0 "L'Union soviétique a parfois été l'amie de la République du Turkestan oriental, mais ses intérêts changent à certains moments. Depuis 1945, ils ont assigné à résidence notre ancien président Elihan Tore. Les Soviétiques pensaient qu'il était trop indépendant et militant à l'époque où ils poursuivaient leurs efforts de paix dans la région. Pour solidifier notre État et démontrer que nous pouvons parler avec les Soviétiques sur un pied d'égalité, nous avons demandé à l'Union soviétique de libérer Elihan Tore."
 ETR.106.d:0 "Pour le plus grand plaisir de la République du Turkestan oriental et de son peuple, l'Union soviétique a annoncé qu'elle libérerait notre ancien président Elihan Tore de son assignation à résidence. La nouvelle de son retour ravira sans aucun doute la population et rehaussera l'image de notre gouvernement. Cependant, les Chinois et leurs alliés dans la région seraient plutôt mécontents de l'action soviétique car ils pensaient qu'Elihan Tore allait devenir une voix du séparatisme et de la violence dans la région."
 ETR.107.d:0 "Notre gouvernement a récemment demandé à l'Union soviétique de libérer de l'assignation à résidence le premier président du Turkestan oriental, Elihan Tore. On a estimé que sa détention et sa séparation d'avec son peuple avaient amené le peuple à avoir une vision négative de l'Union soviétique. Cependant, il semble que le gouvernement soviétique n'ait pas tenu compte de nos inquiétudes en déclarant qu'il ne libérerait pas Elihan Tore. L'échec de notre gouvernement à ramener l'ancien président au pouvoir nuira aux relations avec les Soviétiques et à notre réputation auprès du peuple."
 ETR.20.d:0 "Le gouvernement chinois continue de faire pression sur notre pays, tant sur le plan politique qu'à la frontière, avec ses troupes. Pour que notre régime survive et que les rêves de notre peuple se réalisent, nous devons demander une intervention de l'Union soviétique. Le soutien soviétique nous permettra de vaincre toutes les machinations complotées par les Chinois et leurs sympathisants locaux dans la région. Si l'Union soviétique accepte notre demande et intervient, elle bénéficiera de l'amour de notre peuple et nous serons sans aucun doute réceptifs aux besoins soviétiques en termes de ressources naturelles."
 ETR.21.d:0 "Nous avons reçu des nouvelles accablantes aujourd'hui. L'Union soviétique a répondu à notre demande d'intervention en déclarant qu'elle n'interviendrait pas en notre faveur. Nous pensons que les Soviétiques ne sont tout simplement pas disposés à s'aliéner les Chinois alors qu'ils cherchent à resserrer leurs relations. La population de la République du Turkestan oriental ne mérite apparemment pas l'aide soviétique. Ce rejet confirme que l'Union Soviétique ne s'est jamais souciée de notre cause et ne nous a utilisés que pour ses intérêts."

