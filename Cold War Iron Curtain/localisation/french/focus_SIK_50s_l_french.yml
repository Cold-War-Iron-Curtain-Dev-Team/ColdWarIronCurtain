#News Events
 ETR.1001.d:0 "La République du Turkestan oriental a déclaré aujourd'hui son indépendance. Il déclarait que des siècles d'occupation étrangère, notamment chinoise, avaient pris fin. Il a déclaré que ce serait une patrie pour les peuples des steppes de toute la région. Il a noté que l'arrangement récent d'un gouvernement de coalition avec l'État chinois n'avait pas réussi à aider la population du Sinkiang. Le gouvernement chinois a réagi à cette annonce en affirmant qu'elle provenait d'un régime voyou de mécréants nés à l'étranger. Il s'agit très probablement de la formation soviétique de nombreux dirigeants de la République du Turkestan oriental. Beaucoup attendent la réaction soviétique à cette annonce, car leur soutien à l'indépendance de la République du Turkestan oriental porterait un coup dur aux efforts chinois de pacification de la région."
 ETR.22.d:0 "L'Union soviétique a annoncé qu'elle interviendrait en faveur de la République du Turkestan oriental (ETR). Le gouvernement soviétique a souligné que les Chinois avaient laissé tomber les populations de la région et que la seule voie à suivre serait que les populations de l'ETR suivent leur propre voie. Le soutien soviétique renforce grandement la légitimité de l'ETR et ses dirigeants n'ont pas tardé à féliciter les Soviétiques pour leur position. Les forces soviétiques à la frontière se mobiliseraient, selon des rumeurs selon lesquelles certaines unités auraient déjà traversé la frontière vers l'ETR. Les Soviétiques ont prévenu que toute action militaire des Chinois contre l'ETR serait sévèrement réprimée. Le gouvernement chinois n'a pas encore publié de déclaration suite à cette annonce dramatique soviétique."

