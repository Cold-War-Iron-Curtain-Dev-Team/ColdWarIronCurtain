l_french:
 IC_Chanson.1.t:0 "Le général Chanson est mort"
 IC_Chanson.1.d:0 "Le kamikaze de Sa Dec a atteint la voiture du général. Charles Chanson, commandant du corps expéditionnaire du sud, est mort, et avec lui le gouverneur de Saigon-Cholon. Le delta du Mékong est abasourdi. A Paris, les députés se demandent pourquoi le Sud a été laissé aux mains de quelques officiers, et les cadres du Viet Minh du Sud, qui revendiquent le coup comme le leur, comptent leurs rangs et les trouvent gonflés de recrues."
 IC_Chanson.1.a:0 "Une perte douloureuse"
 IC_Chanson.2.t:0 "Le général Chanson survit à Sa Dec"
 IC_Chanson.2.d:0 "L'attentat contre Sa Dec était un battement de coeur trop tôt. Charles Chanson s'en sort avec quelques coupures et des bourdonnements d'oreilles, et le gouverneur de Saigon-Cholon habite avec lui. Saigon considère cette fuite comme un signe que le delta peut encore être géré avec les connaissances locales, et Chanson, qui connaît chaque canal et chaque chef de village, demande désormais de mener une véritable pacification du sud."
 IC_Chanson.2.a:0 "Le delta est toujours à nous"
 IC_Chanson_Killed_tt:0 "§RLa Métropole perd patience :§! §R-3 Patience§!. Le Viet Minh du sud gagne en confiance, et sa prochaine offensive dans les hauts plateaux sera mieux approvisionnée. Le Viet Minh prend un petit avantage dans la lutte. Le général Chanson ne sera pas disponible pour l'État du Vietnam."
 IC_Chanson_Survived_tt:0 "§GLe général Chanson vit.§! Un programme de pacification du sud est désormais ouvert au CEFEO, l'opération Camargue coûte moins de crédits de guerre et nécessite un jour de tenue en moins, et la cause française gagne un petit avantage dans la lutte."
 FRE_Chanson_Pacification:0 "Pacification du Sud"
 FRE_Chanson_Pacification_desc:0 "Le général Chanson a vécu et il connaît le delta. Donnez-lui les garnisons, les milices et les patrouilles fluviales pour bien pacifier le sud."
 FRE_Chanson_Pacification_tt:0 "Le CEFEO gagne §GLe Programme de Pacification de Chanson§!. L'État du Vietnam gagne §G+3%§! de stabilité, et le Sud Viet Minh subit un malus durable en matière d'organisation et de renforcement. §GPro-France +10§! dans la lutte."
 NLF_Chanson_Pacification_Pressure:0 "Delta sous pacification"
 NLF_Chanson_Pacification_Pressure_desc:0 "Des garnisons françaises et vietnamiennes siègent désormais dans les villages du delta. Recruter, cacher et déplacer des hommes est devenu plus difficile pour les cadres du Sud."
 FRE_Chanson_Pacification_Program:0 "Programme de pacification de Chanson"
 FRE_Chanson_Pacification_Program_desc:0 "La connaissance du delta de Charles Chanson guide un programme patient de garnisons villageoises, de milices locales et de patrouilles fluviales. Les renforts arrivent plus vite et les colonnes consomment moins."
 FRE_Chanson_Killed:0 "§RLe général Chanson a été tué à Sa Dec§!"
 FRE_Chanson_Survived:0 "§GLe général Chanson a survécu à l'attaque de Sa Dec§!"
 FRE_Chanson_Pacification_Done:0 "§GLe programme de pacification de Chanson est en cours§!"
 NLF_Chanson_Ascendancy:0 "§RLe Viet Minh du Sud enhardi par la mort de Chanson§!"
