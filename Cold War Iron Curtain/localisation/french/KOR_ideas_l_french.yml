 KOR_electronics_drive_desc:0 "Les entreprises coréennes s'étendent de l'assemblage de radios à une gamme plus large de produits électriques. Le soutien du gouvernement les aide à obtenir des composants importés et à améliorer les méthodes de fabrication, les contrats à l'étranger établissant des normes de qualité exigeantes."
