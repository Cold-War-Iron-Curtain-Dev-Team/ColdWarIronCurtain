 #Ideas
 KOR_government_corruption:0 "Corruption du gouvernement"
 KOR_government_corruption_desc:0 "Il n'y a pas grand-chose à dire sur la corruption de notre gouvernement. Nous pouvons simplement dire « c'est déjà assez grave »."
 KOR_legacy_of_the_occupation:0 "L'héritage de l'occupation"
 KOR_legacy_of_the_occupation_desc:0 "Notre patrie est notre héritage. Et l'occupation japonaise n'a pas été l'héritage que nous souhaitions. Il n'y a que nous pour faire disparaître ça."
 KOR_us_restrictions_on_republic_of_koreas_armed_forces:0 "Restrictions américaines sur les forces armées de la République de Corée"
 KOR_us_restrictions_on_republic_of_koreas_armed_forces_desc:0 "§RImpossible de former ou de dissoudre des unités, ni de modifier les modèles d'unités.§!\n\nLes États-Unis restreignent actuellement considérablement nos forces armées en termes d'ampleur et de qualité. Il semble qu'ils négligent le fait que la menace rouge est juste devant nous. Ne serait-ce pas différent s'ils nous avaient accordé la moitié de l'attention qu'ils accordent au Japon ?"
 KOR_national_security_act:0 "Loi sur la sécurité nationale"
 KOR_national_security_act_desc:0 "La loi sur la sécurité nationale est la première étape pour stabiliser notre pays. Nous devons défendre notre patrie. Et la loi sur la sécurité nationale est notre meilleure. Du moins pour l'instant."
