l_french:
 GRE_war_devastation_harsh: "Dévastation de la guerre"
 GRE_war_devastation_harsh_desc: "La Seconde Guerre mondiale et notre guerre civile ont complètement ravagé notre pays et s'en remettre demandera un travail acharné, une aide extérieure et du temps."
 GRE_war_devastation_medium: "Dévastation de guerre moyenne"
 GRE_war_devastation_medium_desc: "Le processus de renaissance et de reconstruction de notre nation se déroule sans heurts, mais il reste encore beaucoup à faire."
 GRE_war_devastation_small: "Dévastation de guerre faible"
 GRE_war_devastation_small_desc: "Nous avons pratiquement reconstruit la plupart des infrastructures en ruine de notre pays, mais il ne suffit pas de se remettre des guerres, nous devons commencer à prospérer."
 GRE_hyperinflation: "Hyperinflation"
 GRE_hyperinflation_desc: ""
 GRE_Crusade_Against_Communism: "Croisade contre le communisme"
 GRE_TEA: "Tágmata Ethnofulakís Aminas"
 GRE_TEA_desc: "Les « bataillons de défense de la Garde nationale », un paramilitaire créé en 1948 sous l'égide du ministère de la Défense, contribuent actuellement au maintien de l'ordre dans toute la Grèce ; composé de nationalistes, d'anciens collaborateurs des nazis, d'anticommunistes et d'autres éléments d'extrême droite."
 GRE_TEA_2: "Tágmata Ethnofulakís Aminas"
 GRE_TEA_2_desc: "Les « bataillons de défense de la Garde nationale », un paramilitaire créé en 1948 sous l'égide du ministère de la Défense, contribuent actuellement au maintien de l'ordre dans toute la Grèce ; composé de nationalistes, d'anciens collaborateurs des nazis, d'anticommunistes et d'autres éléments d'extrême droite."
 GRE_automobile_industry: "Industrie automobile"
 GRE_automobile_industry_desc: ""
 GRE_repression_harsh: "3ème résolution"
 GRE_repression_harsh_desc: "3ème Résolution \"sur les mesures extraordinaires contre ceux qui troublent l'ordre public et l'intégrité du pays\""
 GRE_repression: "3ème résolution"
 GRE_repression_desc: "3ème Résolution \"sur les mesures extraordinaires contre ceux qui troublent l'ordre public et l'intégrité du pays\""
 GRE_law_511_harsh: "Nomos 511"
 GRE_law_511_harsh_desc: "Avec la loi 511, l'État grec a créé des camps de concentration dans des îles comme Makronisos, Giaros, Ai Stratis où les soldats d'orientation de gauche et communistes se rendaient pour accomplir leur « service militaire »."
 GRE_law_511: "Nomos 511"
 GRE_law_511_desc: "Avec la loi 511, l'État grec a créé des camps de concentration dans des îles comme Makronisos, Giaros, Ai Stratis où les soldats d'orientation de gauche et communistes se rendaient pour accomplir leur « service militaire »."
 GRE_law_509: "Anagkastikos Nomos 509/1947"
 GRE_law_509_desc: "La loi d'urgence 509 « sur les mesures pour la sécurité de l'État, du régime et du système social, et pour la protection des libertés individuelles », entrée en vigueur en décembre 1947, a interdit le Parti communiste grec (KKE), le Front de libération nationale (EAM) et la Solidarité nationale, y compris leurs publications, comme Rizospastis, Eleftheri Ellada et d'autres."
 GRE_parakratos: "L'État invisible"
 GRE_parakratos_desc: "L'armée a réussi à exercer une influence sur les affaires de l'État grec, guidant le pays au gré des caprices des généraux et des officiers en coulisses."
