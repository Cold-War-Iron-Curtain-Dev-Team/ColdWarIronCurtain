 GRE_disorganized_health:0 "Système de santé désorganisé"
 GRE_disorganized_health_desc:0 "Le système de santé grec souffre d'un sévère manque d'argent, moins de 2 % du budget gouvernemental y étant dédié. Ainsi, la qualité des traitements que nos citoyens peuvent obtenir est catastrophique, et se détériorie chaque jour."
 centralise_banks:0 "Fusionner les banques"
 GRE_aid_the_people:0 "Aider le peuple"
 anti_intellectualism:0 "Anti-intellectualisme"
 GRE_aid_the_worker:0 "Aider les travailleurs"
 GRE_Diaspora:0 "Diaspora grecque"
 GRE_Diaspora_desc:0 "Suite aux destructions apportées par la Seconde Guerre mondiale et la guerre civile, de nombreux Grecs ont quitté le pays pour chercher une vie meilleure. Cela a caussé une immense fuite des cerveaux et la perte de main d'œuvre vitale. Si nous parvenions à stabiliser et à notre pays, peut-être, reviendront ils un jour."
