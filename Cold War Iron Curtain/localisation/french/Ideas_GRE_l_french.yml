 GRE_repression_harsh:0 "3ème résolution"
 GRE_repression_harsh_desc:0 "3ème Résolution \"sur les mesures extraordinaires à l'encontre de ceux qui troublent l'ordre public et l'intégrité du pays\""
 GRE_repression:0 "3ème résolution"
 GRE_repression_desc:0 "3ème Résolution \"sur les mesures extraordinaires à l'encontre de ceux qui troublent l'ordre public et l'intégrité du pays\""
 GRE_law_511_harsh:0 "Nomos 511"
 GRE_law_511_harsh_desc:0 "Avec la loi 511, l'Etat grec a créé des camps de concentration dans des îles comme Makronisos, Giaros, Ai Stratis où des soldats  de gauche et communistes se rendaient pour accomplir leur \"service militaire\""
 GRE_law_511:0 "Nomos 511"
 GRE_law_511_desc:0 "Avec la loi 511, l'Etat grec a créé des camps de concentration dans des îles comme Makronisos, Giaros, Ai Stratis où des soldats  de gauche et communistes se rendaient pour accomplir leur \"service militaire\""
 GRE_law_509:0 "Anagkastikos Nomos 509/1947"
 GRE_law_509_desc:0 "La loi d'urgence 509 “sur les mesures pour la sécurité de l'Etat, du régime et du système social, et pour la protection des libertés de l'individu”, qui est entrée en vigueur en décembre 1947, interdisait le Parti communiste grec (KKE), le Front de Libération Nationale (EAM) et la Solidarité Nationale, ainsi que leurs journaux, comme Rizospastis, Eleftheri Ellada et d'autres."
 GRE_parakratos:0 "L'Etat invisible"
 GRE_parakratos_desc:0 "L'armée a réussi à exercer une influence sur les affaires de l'Etat grec, guidant en coulisses le pays selon les désirs des généraux et des officiers."
