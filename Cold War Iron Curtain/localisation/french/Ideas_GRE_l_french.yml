 GRE_disorganized_health: "Système de santé désorganisé"
 GRE_disorganized_health_desc: "Le système de santé grec souffre d'un grave sous-financement, avec à peine 2 % du budget gouvernemental qui lui est consacré. En tant que telle, la qualité des soins dont nos citoyens peuvent bénéficier est épouvantable, et les conditions se détériorent de jour en jour."
 centralise_banks: "Fusionner les banques"
 GRE_aid_the_people: "Aidez le peuple"
 anti_intellectualism: "Anti-intellectualisme"
 GRE_aid_the_worker: "Aider le travailleur"
 GRE_Diaspora: "Diaspora grecque"
 GRE_Diaspora_desc: "Suite aux destructions massives causées à notre nation par la Seconde Guerre mondiale et la guerre civile, de nombreux Grecs ont quitté leur pays pour trouver une vie meilleure ailleurs. Cela provoque une immense fuite des cerveaux et la perte de la main-d'oeuvre nécessaire. Si nous devions stabiliser et améliorer massivement notre pays, peut-être qu'ils reviendront un jour."
