l_french:
 GRE_war_devastation_harsh:0 "Dévastation de guerre"
 GRE_war_devastation_harsh_desc:0 "La Seconde Guerre mondiale et notre guerre civile ont complètement ravagé notre pays et nous en remettre demandera un dur travail, de l'aide externe et du temps."
 GRE_war_devastation_medium:0 "Dévastation de guerre intermédiaire"
 GRE_war_devastation_medium_desc:0 "Le processus de reconstruction et de revitalisation de notre nation est cours, mais il y a toujours beaucoup de travail à réaliser."
 GRE_war_devastation_small:0 "Dévastation de guerre faible"
 GRE_war_devastation_small_desc:0 "Nous avons pratiquement reconstruit l'ensemble des infrastructures détruites de notre pays, mais il ne suffit pas de récupérer des guerres, il nous faut prospérer."
 GRE_hyperinflation:0 "Hyperinflation"
 GRE_hyperinflation_desc:0 ""
 GRE_TEA:0 "Tágmata Ethnofulakís Aminas"
 GRE_TEA_desc:0 "Les \"Bataillons de Défense de la Garde Nationale\", un paramilitaire créé en 1948 sous l'égide du ministère de la Défense, aident actuellement à maintenir l'ordre dans toute la Grèce. Ils sont composés de nationalistes, d'anciens collaborateurs nazis, d'anticommunistes et d'autres éléments d'extrême droite."
 GRE_TEA_2:0 "Tágmata Ethnofulakís Aminas"
 GRE_TEA_2_desc:0 "Les \"Bataillons de Défense de la Garde Nationale\", un paramilitaire créé en 1948 sous l'égide du ministère de la Défense, aident actuellement à maintenir l'ordre dans toute la Grèce. Ils sont composés de nationalistes, d'anciens collaborateurs nazis, d'anticommunistes et d'autres éléments d'extrême droite."
