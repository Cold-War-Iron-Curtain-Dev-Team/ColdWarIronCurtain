 SWI_mechanized_equipment_7:0 "Schützenpanzer 63/73"
 SWI_mechanized_equipment_7_short:0 "Schützenpanzer 63/73"
 SWI_mechanized_equipment_7_desc:0 "Le M113A2 est une variante améliorée du M113 fabriquée par Food Machinery Corporation à la fin des années 70. Il a vu des combats partout où le M113 est présent. Dans l'A1, le moteur a été remplacé par le 6V-53. Dans l'A2, le refroidissement du moteur a été amélioré, des barres de torsion plus résistantes ont été introduites pour augmenter la garde au sol, des amortisseurs ont été ajoutés à la suspension, les réservoirs de carburant ont été blindés et des lance-fumées ont été ajoutés."
 SWI_mechanized_equipment_8:0 "MOWAG Piranha II"
 SWI_mechanized_equipment_8_short:0 "Piranha Ier"
 SWI_mechanized_equipment_8_desc:0 "Le MOWAG Piranha est une famille de véhicules blindés de combat conçus par la société suisse MOWAG. Cinq générations de véhicules ont été produites, fabriquées par Mowag ou sous licence par d'autres sociétés, et des variantes sont en service dans les forces militaires du monde entier."
 SWI_mechanized_equipment_9:0 "MOWAG Piranha IIC"
 SWI_mechanized_equipment_9_short:0 "Piranha IIC"
 SWI_mechanized_equipment_9_desc:0 "Le MOWAG Piranha est une famille de véhicules blindés de combat conçus par la société suisse MOWAG. Cinq générations de véhicules ont été produites, fabriquées par Mowag ou sous licence par d'autres sociétés, et des variantes sont en service dans les forces militaires du monde entier."
 SWI_mechanized_equipment_10:0 "MOWAG Piranha IIIC"
 SWI_mechanized_equipment_10_short:0 "Piranha IIIC"
 SWI_mechanized_equipment_10_desc:0 "Le MOWAG Piranha est une famille de véhicules blindés de combat conçus par la société suisse MOWAG. Cinq générations de véhicules ont été produites, fabriquées par Mowag ou sous licence par d'autres sociétés, et des variantes sont en service dans les forces militaires du monde entier."

 SWI_mechanized_heavy_equipment_3:0 "Tartaruga Saurer"
 SWI_mechanized_heavy_equipment_3_short:0 "Tartaruga"
 SWI_mechanized_heavy_equipment_3_desc:0 "Le Saurer Tartaruga (Tortue) était un prototype de véhicule blindé de transport de troupes d'Adolph Saurer AG. Le Saurer Tartaruga a été construit en 1959. Avec le Mowag Pirat, il a été testé par l'armée suisse. Mais de manière inattendue, l'armée suisse a décidé d'acheter le M113 américain"
 SWI_mechanized_heavy_equipment_7:0 "Schützenpanzer 63/89"
 SWI_mechanized_heavy_equipment_7_short:0 "Schützenpanzer 63/89"
 SWI_mechanized_heavy_equipment_7_desc:0 "Mise à niveau du SPz 63/73 avec un blindage passif supplémentaire, des lance-grenades fumigènes de 76 mm et un bloc d'alimentation RISE."
 SWI_mechanized_heavy_equipment_8:0 "Hägglunds CV9030CH"
 SWI_mechanized_heavy_equipment_8_short:0 "CV9030CH"
 SWI_mechanized_heavy_equipment_8_desc:0 "La variante suisse est 100 mm plus haute sur la partie avant de la coque et 70 mm supplémentaires sur le compartiment de combat à l'arrière. La principale différence entre le Mk I et le Mk II est que le Mk II a été partiellement numérisé et doté d'un système de surveillance de la santé et des unités (HUMS) intégré ainsi que de manuels et d'instructions interactifs. L'armement standard du CV90 Mk II est le canon automatique Mk44 Bushmaster II."

