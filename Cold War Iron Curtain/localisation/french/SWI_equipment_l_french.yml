 SWI_infantry_equipment_4_desc:0 "Le SG 550 est un fusil d'assaut fabriqué par Swiss Arms AG (anciennement une division de Schweizerische Industrie Gesellschaft, maintenant connue sous le nom de SIG Holding AG) en Suisse. \"SG\" est l'abréviation de Sturmgewehr (fusil d'assaut). Le fusil est basé sur le précédent 5,56 × 45 mm NATO SIG SG 540. "
 
