 SWI_jet_multirole_equipment_8:0 "Northrop F-5E Tigre II"
 SWI_jet_multirole_equipment_8_short:0 "F-5E Tigre II"
 SWI_jet_multirole_equipment_8_desc:0 "Les Forces aériennes suisses exploitent au total 22 F-5E et quatre F-5F, contre un pic de 98 et 12 en 1981. Ils ont été choisis principalement en raison de leurs excellentes performances, de leur adéquation à la mission unique des Forces aériennes suisses et de leur coût de maintenance par heure de vol relativement faible."
 SWI_jet_multirole_equipment_9:0 "McDonnell Douglas F/A-18C Hornet"
 SWI_jet_multirole_equipment_9_short:0 "F/A-18C Hornet"
 SWI_jet_multirole_equipment_9_desc:0 "Le McDonnell Douglas F/A-18C Hornet est un avion de combat bimoteur, supersonique, tous temps, capable de porter un porte-avions et multirôle, conçu à la fois comme avion de combat et d'attaque (d'où la désignation F/A). Conçu par McDonnell Douglas (qui fait maintenant partie de Boeing) et Northrop (qui fait maintenant partie de Northrop Grumman), le F/A-18 est dérivé du YF-17 de ce dernier dans les années 1970 pour être utilisé par la Marine et le Corps des Marines des États-Unis. Le Hornet est également utilisé par les forces aériennes de plusieurs autres pays, et autrefois par l'escadron de démonstration en vol de la marine américaine, les Blue Angels. "
 SWI_jet_multirole_equipment_10:0 "Programme de mise à niveau 25 du F/A-18C Hornet de McDonnell Douglas"
 SWI_jet_multirole_equipment_10_short:0 "F/A-18C U25P Hornet"
 SWI_jet_multirole_equipment_10_desc:0 "La Suisse a demandé à être incluse dans le programme F/A-18C/D Upgrade 25, afin de prolonger la durée de vie utile de ses F/A-18C/D. Le programme comprend des mises à niveau significatives de l'avionique et de l'ordinateur de mission, 12 pods de surveillance et de ciblage ATFLIR et 44 ensembles d'équipements ECM AN/ALR-67v3. En octobre 2008, la flotte Swiss Hornet a atteint le cap des 50 000 heures de vol."

