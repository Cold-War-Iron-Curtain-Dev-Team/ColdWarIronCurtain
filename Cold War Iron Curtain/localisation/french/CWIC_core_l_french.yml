 cwic_mnc_invite_accept_tt:0 "L'entreprise engage du capital ce mois-ci. S'il peut se permettre l'investissement, sa présence §Y§! dans ce secteur augmente d'un niveau et l'invitation est remplie. Si ce n'est pas le cas, l'invitation reste ouverte pour une autre tentative."
