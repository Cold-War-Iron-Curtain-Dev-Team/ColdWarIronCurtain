 CWIC_enable_money_printing_tt:0 "Financez les dépenses du gouvernement en créant de l'argent chaque mois.\n\n§YCoût :§! 15 Pouvoir politique\n§YChaque mois pendant que vous êtes actif :§!\n- Inflation mensuelle §R+0,1 pts§!\n- Pression du marché noir §R+1 pt§!\n§YNécessite :§!\n- Financement monétaire pas encore actif"
 CWIC_disable_money_printing_tt:0 "Arrêtez de créer de l'argent pour financer les dépenses publiques.\n\n§YCoût :§! 15 Pouvoir politique\n§GGains :§!\n- Mettre fin à l'inflation mensuelle du financement monétaire et à l'augmentation de la pression du marché noir\n§RInconvénients :§!\n- N'annule pas les augmentations antérieures\n§YNécessite :§!\n- Financement monétaire actif"
 CWIC_print_money_small_tt:0 "Imprimez de l'argent pour une petite injection d'argent immédiate.\n\n§YCoût :§! 20 Pouvoir politique\n§GGains :§!\n- Trésorerie §G+2B§!\n§RInconvénients :§!\n- Inflation mensuelle §R+0,1 pts§! (§R+0,07 pts§! pour les monnaies de réserve)\n- Pression du Marché Noir §R+3 pts§! (§R+2,1 pts§! pour les monnaies de réserve)\n- Impossible d'imprimer plus d'argent pendant §R2 mois§!\n§YNécessite :§!\n- Aucun temps de recharge d'impression restant"
 CWIC_print_money_medium_tt:0 "Imprimez de l'argent pour une injection de liquidités immédiate et plus importante.\n\n§YCoût :§! 40 Pouvoir Politique\n§GGains :§!\n- Trésorerie §G+6B§!\n§RInconvénients :§!\n- Inflation mensuelle §R+0,25 pts§! (§R+0,175 pts§! pour les monnaies de réserve)\n- Pression du Marché Noir §R+6 pts§! (§R+4,2 pts§! pour les monnaies de réserve)\n- Impossible d'imprimer plus d'argent pendant §R3 mois§!\n§YNécessite :§!\n- Aucun temps de recharge d'impression restant\n- Inflation mensuelle inférieure à §Y2%§!"
 CWIC_print_money_large_tt:0 "Imprimez des fonds d'urgence pour un trésor presque vide.\n\n§YCoût :§! 90 Pouvoir politique\n§GGains :§!\n- Trésorerie §G+15B§!\n§RInconvénients :§!\n- Inflation mensuelle §R+0,5 pts§! (§R+0,35 pts§! pour les monnaies de réserve)\n- Pression du Marché Noir §R+10 pts§! (§R+7 pts§! pour les monnaies de réserve)\n- Impossible d'imprimer plus d'argent pendant §R4 mois§!\n§YNécessite :§!\n- Aucun temps de recharge d'impression restant\n- Trésorerie inférieure à §Y1B§!"
 CWIC_enable_monetary_tightening_tt:0 "Freiner l'inflation en limitant l'offre de monnaie.\n\n§YCoût :§! 50 Pouvoir politique\n§GGains :§!\n- Inflation mensuelle §G-0,3 pts§!\n§RInconvénients :§!\n- Productivité §R-1%§!\n- Pression du marché noir §R+2 pts§!\n§YChaque mois pendant que vous êtes actif :§!\n- Inflation mensuelle §G-0,1 pts§!\n- Productivité §R-0,2%§!\n§YNécessite :§!\n- Inflation mensuelle supérieure à §Y0,6%§!\n- Le resserrement monétaire n'est pas encore actif"
 CWIC_disable_monetary_tightening_tt:0 "Mettre fin au resserrement monétaire une fois que l'inflation aura diminué.\n\n§YCoût :§! 15 Pouvoir politique\n§GGains :§!\n- Met fin à la perte de productivité mensuelle due au resserrement\n§RInconvénients :§!\n- Met fin à la réduction mensuelle de l'inflation due au resserrement\n- N'annule pas les modifications antérieures\n§YNécessite :§!\n- Resserrement monétaire actif\n- Inflation mensuelle inférieure à §Y0,8%§!"
 CWIC_currency_reform_tt:0 "Remplacez la monnaie pour réduire les prix et freiner l'inflation.\n\n§YCoût :§! 120 Pouvoir politique\n§GGains :§!\n- Indice des prix à la consommation réduit de moitié\n- Inflation mensuelle §G-1 pt§!\n- Inflation mensuelle : pression baissière durable de §G0,1 pts§!\n- Pression du marché noir §G-20 pts§!\n§RInconvénients :§!\n- Productivité §R-2%§!\n- Impossible de répéter la réforme monétaire pendant §R24 mois§!\n§YChaque mois pendant que vous êtes actif :§!\n- Inflation mensuelle §R+0,05 pts§! pour §R7§! mises à jour mensuelles\n§YNécessite :§!\n- Il ne reste plus de temps de recharge pour la réforme monétaire\n- Inflation mensuelle inférieure à §Y6%§!\n- Pression du marché noir inférieure à §Y80 %§!"
 CWIC_internationalize_currency_tt:0 "Faire de la monnaie une monnaie de réserve internationale.\n\n§YCoût :§! 120 Pouvoir politique\n§GGains :§!\n- Statut de monnaie de réserve\n- Confiance de réserve fixée à §G50 %§!\n- L'impression de monnaie entraîne §G30%§! de moins d'inflation et de pression du marché noir\n§YNécessite :§!\n- Devise éligible au statut de réserve\n- Pas encore une monnaie de réserve"
 CWIC_capital_controls_light_tt:0 "Restreindre les mouvements de capitaux pour atténuer l'inflation.\n\n§YCoût :§! 40 Pouvoir Politique\n§GGains :§!\n- Inflation mensuelle §G-0,2 pts§!\n- Inflation mensuelle : pression baissière durable de §G0,05 pts§!\n§RInconvénients :§!\n- Pression du marché noir §R+5 pts§!\n§YChaque mois pendant que vous êtes actif :§!\n- Inflation mensuelle §G-0,05 pts§!\n- Pression du marché noir §R+2 pts§! avant les autres pressions du marché\n- Productivité §R-0,2%§!\n§YNécessite :§!\n- Inflation mensuelle supérieure à §Y0,6%§!\n- Contrôles légers des capitaux, pas encore actifs"
 CWIC_capital_controls_heavy_tt:0 "Resserrer les restrictions en matière de capitaux pour réduire davantage l'inflation.\n\n§YCoût :§! 90 Pouvoir politique\n§GGains :§!\n- Inflation mensuelle §G-0,6 pts§!\n- Inflation mensuelle : pression baissière durable de §G0,1 pts§!\n§RInconvénients :§!\n- Pression du marché noir §R+15 pts§!\n§YChaque mois pendant que vous êtes actif :§!\n- Inflation mensuelle §G-0,15 pts§!\n- Pression du marché noir §R+6 pts§! avant les autres pressions du marché\n- Productivité §R-0,6%§!\n- Les effets mensuels du léger contrôle des capitaux se poursuivent également\n§YNécessite :§!\n- Contrôles de capitaux légers actifs\n- Inflation mensuelle supérieure à §Y1%§!\n- Des contrôles de capitaux lourds ne sont pas encore actifs"
 CWIC_price_controls_basic_tt:0 "Maintenir les prix des produits essentiels à un niveau bas grâce aux contrôles gouvernementaux.\n\n§YCoût :§! 40 Pouvoir Politique\n§GGains :§!\n- Inflation mensuelle §G-0,15 pts§!\n§RInconvénients :§!\n- Pression du marché noir §R+8 pts§!\n§YChaque mois pendant que vous êtes actif :§!\n- Inflation mensuelle §G-0,07 pts§!\n- Pression du marché noir §R+4 pts§! avant les autres pressions du marché\n- Productivité §R-0,3%§!\n§YNécessite :§!\n- Inflation mensuelle supérieure à §Y0,4%§!\n- Les contrôles de prix ne sont pas déjà actifs"
 CWIC_fx_controls_dual_tt:0 "Utiliser des taux de change distincts pour limiter les prix intérieurs.\n\n§YCoût :§! 75 Pouvoir politique\n§GGains :§!\n- Inflation mensuelle §G-0,3 pts§!\n§RInconvénients :§!\n- Pression du marché noir §R+12 pts§!\n- Productivité §R-3%§!\n§YChaque mois pendant que vous êtes actif :§!\n- Inflation mensuelle §G-0,1 pts§!\n- Pression du marché noir §R+6 pts§! avant les autres pressions du marché\n- Productivité §R-0,8%§!\n§YNécessite :§!\n- Inflation mensuelle supérieure à §Y0,8%§!\n- Les taux de change doubles ne sont pas déjà actifs"
 CWIC_capital_controls_lift_tt:0 "Lever les contrôles sur les capitaux, les prix et les changes.\n\n§YCoût :§! 50 Pouvoir politique\n§GGains :§!\n- Supprime les contrôles de capitaux légers et lourds\n- Supprime les contrôles de prix et les doubles taux de change\n- Met fin aux effets mensuels de ces contrôles sur l'inflation, le marché noir et la productivité\n§RInconvénients :§!\n- Inflation mensuelle §R+0,15 pts§!\n- Inflation mensuelle §R+0,25 pts§! si contrôles lourds des capitaux actifs\n- Inflation mensuelle §R+0,1 pts§! si pression du marché noir supérieure à §R40%§!\n- Inflation mensuelle §R+0,15 pts§! si pression du marché noir supérieure à §R70%§!\n- Toutes les augmentations immédiates de l'inflation s'additionnent\n- Inflation mensuelle : pression haussière durable de §R0,05 pts§!\n§YNécessite :§!\n- Au moins un contrôle des capitaux, des prix ou des changes actif"
 CWIC_black_market_raids_tt:0 "Perturbez le commerce sur le marché noir avec des descentes de police ciblées.\n\n§YCoût :§! 20 Pouvoir politique\n§GGains :§!\n- Pression du marché noir §G-10 pts§!\n§RInconvénients :§!\n- Productivité §R-0,2%§!\n- Pas d'autres raids ou campagnes de répression pendant §R30 jours§!\n§YNécessite :§!\n- Pression du marché noir supérieure à §Y20 %§!\n- Aucun raid ou campagne d'application active"
 CWIC_black_market_enforcement_campaign_tt:0 "Lancer une vaste campagne de répression contre le commerce sur le marché noir.\n\n§YCoût :§! 60 Pouvoir Politique\n§GGains :§!\n- Pression du marché noir §G-25 pts§!\n§RInconvénients :§!\n- Productivité §R-0,8%§!\n- Pas d'autres raids ou campagnes de répression pendant §R30 jours§!\n§YNécessite :§!\n- Pression du marché noir supérieure à §Y45 %§!\n- Aucun raid ou campagne d'application active"
 CWIC_black_market_amnesty_tt:0 "Proposer aux commerçants informels un retour sur les marchés légaux.\n\n§YCoût :§! 50 Pouvoir politique\n§GGains :§!\n- Pression du marché noir §G-20 pts§!\n§RInconvénients :§!\n- Inflation mensuelle §R+0,1 pts§!\n- Impossible de répéter l'amnistie pendant §R365 jours§!\n§YNécessite :§!\n- Pression du marché noir supérieure à §Y30 %§!\n- Aucun contrôle de prix actif\n- Aucune amnistie active"
 CWIC_adopt_currency_peg_tt:0 "Défendre un taux de change fixe pour contenir l'inflation.\n\n§YCoût :§! 60 Pouvoir Politique\n§RInconvénients :§!\n- Réserves de change §R-2B§! (ne peut pas descendre en dessous de zéro)\n§YChaque mois pendant que vous êtes actif :§!\n- Inflation mensuelle §G-0,1 pts§!\n- Réserves de change §G-0,4B§! par point d'inflation mensuel positif\n- Réserves de change §G-0,08B§! par point de pression du marché noir\n- Les coûts de réserve utilisent l'inflation mensuelle après la réduction du rattachement\n§RSi la cheville casse :§!\n- Inflation mensuelle §R+1 pt§!\n- Pression du marché noir §R+10 pts§!\n- Inflation mensuelle : pression haussière durable de §Y0,1 pts§!\n- Rupture si les réserves de change sont inférieures à §Y1B§! et que l'inflation mensuelle est supérieure à §Y0,8%§!\n§YNécessite :§!\n- Aucune ancrage de devise actif\n- Réserves de change supérieures à §Y5B§!"
 CWIC_float_currency_tt:0 "Laissons le taux de change évoluer sans défendre un ancrage.\n\n§YCoût :§! 25 Pouvoir Politique\n§GGains :§!\n- Met fin à la fuite mensuelle des réserves de change de l'ancrage de la devise\n§RInconvénients :§!\n- Met fin à la réduction mensuelle de l'inflation du rattachement\n§YNécessite :§!\n- Ancrage des devises actif"
 ECONOMY_TAB_TT:0 "Examinez l'état de l'économie et agissez en un seul endroit.\n\n§YSpectacles :§!\n- Productivité et détails économiques\n- Crises actives et potentielles\n§YActions disponibles :§!\n- Financement monétaire, resserrement et réforme monétaire\n- Contrôles des capitaux et des prix, double taux de change\n- Raids sur le marché noir, répression et amnistie\n- Conversions du système économique\n- Parcourir et autoriser les capitaux étrangers par secteur\n§YNécessite :§!\n- Pas une économie insurrectionnelle active"
 CWIC_convert_to_rentier:0 "Devenez une économie rentière"
 CWIC_convert_to_rentier_tt:0 "Construire une économie rentière autour de l'extraction et des exportations agricoles.\n\n§YCoût :§! 50 Pouvoir politique\n§YNouveau système économique :§!\n- Remplace les bonus et pénalités du système économique actuel\n§GGains :§!\n- Vitesse de construction du complexe agro-industriel §G+15%§!\n- Vitesse de construction des infrastructures et des chemins de fer §G+15%§!\n- Vitesse de construction des infrastructures hydrauliques §G+10%§!\n- Production agricole §G+10%§!\n- Taux d'exportation de ressources et de biens de consommation §G+25%§!\n§RInconvénients :§!\n- Vitesse de construction d'usines civiles et de parcs de bureaux §R-50%§!\n- Vitesse de construction des infrastructures de l'État §R-10%§!\n- Revenus du parc de bureaux §R-10%§!\n- Vitesse de recherche et gain d'efficacité de l'usine §R-2,5%§!\n§YNécessite :§!\n- Développement moyen d'au moins §Y1§!\n- Secteur des industries extractives au moins §Y70%§!\n- Pas déjà une économie de palais, féodale, rentière, pétroétatique, coloniale, de cartel de la drogue ou de guerre"
 CWIC_convert_to_normal_economic_axis_system:0 "Moderniser l'économie"
 CWIC_convert_to_normal_economic_axis_system_tt:0 "Adopter une économie keynésienne avec une propriété mixte et une coordination du marché.\n\n§YCoût :§! 50 Pouvoir politique\n§YNouveau système économique :§!\n- Remplace les bonus et pénalités du système économique actuel\n§GGains :§!\n- Usines de biens de consommation §G-3 pts§!\n- Revenus du parc de bureaux §G+12%§!\n- Vitesse de construction du parc de bureaux §G+6%§!\n- Production agricole et revenus des usines d'armement §G+6%§!\n- Vitesse de construction des infrastructures d'eau et d'État §G+6%§!\n- Vitesse de recherche et gain d'efficacité de l'usine §G+3%§!\n- Taux d'exportation de ressources et de biens de consommation §G+3%§!\n- Consommation d'électricité §G-3%§!\n§RInconvénients :§!\n- Vitesse de construction des usines civiles, des infrastructures et des chemins de fer §R-6%§!\n- Efficacité de la collecte des impôts §R-6%§!\n- Élasticité fiscale §R+6%§!\n- Dépenses sociales et éducatives §R+6%§!\n- Consommation alimentaire §R+3%§!\n§YNécessite :§!\n- Développement moyen d'au moins §Y1§!\n- Secteur des industries extractives en dessous de §Y60%§!\n- Une économie spéciale ou une économie entièrement privatisée"
 CWIC_convert_to_petrostate:0 "Créer un Petrostate"
 CWIC_convert_to_petrostate_tt:0 "Utiliser les exportations de pétrole pour soutenir les infrastructures et les dépenses publiques.\n\n§YCoût :§! 60 Pouvoir Politique\n§YNouveau système économique :§!\n- Devient un Petrostate\n- Remplace les bonus et pénalités du système économique actuel\n§GGains :§!\n- Vitesse des infrastructures, des infrastructures d'État et de la construction ferroviaire §G+25%§!\n- Vitesse de construction du parc de bureaux §G+10%§!\n- Revenus du parc de bureaux §G+15%§!\n- Taux d'exportation de ressources et de biens de consommation §G+40%§!\n- Stabilité §G+15%§!\n§RInconvénients :§!\n- Vitesse de construction d'usine civile §R-50%§!\n- Consommation alimentaire §R+10%§!\n- Dépenses sociales §R+10%§!\n§YNécessite :§!\n- Economie rentière\n- Développement moyen d'au moins §Y3§!\n- Exportations de pétrole supérieures à §Y75§!"
