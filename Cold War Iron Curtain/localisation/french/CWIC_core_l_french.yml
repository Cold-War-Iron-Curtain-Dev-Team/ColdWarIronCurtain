 cwic_cg_basic_level_0_title:0 "Biens de consommation de base (norme d'avant-guerre)"
 cwic_cg_basic_level_0_desc:0 "Biens de consommation de base produits selon les méthodes industrielles d'avant la Seconde Guerre mondiale. La production est limitée en variété, en qualité et en échelle, et dépend fortement du travail manuel et des chaînes d'approvisionnement localisées. Adapté aux besoins de subsistance mais inadapté aux sociétés urbaines modernes.\n\n§YLes exemples incluent :§!\n- Vêtements et textiles simples\n- Ustensiles ménagers de base\n- Du savon et des produits sanitaires\n- Meubles produits localement\n- Outils manuels et conteneurs"
 cwic_cg_basic_level_1_title:0 "Biens de consommation de base (norme des années 1950)"
 cwic_cg_basic_level_1_desc:0 "Produits de base d'après-guerre fabriqués à l'aide des premières techniques de production de masse. La disponibilité et la cohérence s'améliorent considérablement, favorisant l'urbanisation précoce et la participation au marché du travail.\n\n§YLes exemples incluent :§!\n- Vêtements produits en série\n- Articles ménagers standardisés\n- Produits d'assainissement et d'hygiène améliorés\n- Contenants alimentaires emballés\n- Mobilier abordable"
 cwic_cg_basic_level_2_title:0 "Biens de consommation de base (norme des années 1960)"
 cwic_cg_basic_level_2_desc:0 "Variété élargie et réseaux de distribution améliorés. Les biens de base deviennent largement accessibles, abordables et standardisés, reflétant la montée des sociétés de consommation de masse.\n\n§YLes exemples incluent :§!\n- Produits de consommation courante de marque\n- Textiles et tissus améliorés\n- Des produits ménagers plus sûrs\n- Articles ménagers en plastique\n- Distribution nationale au détail"
 cwic_cg_basic_level_3_title:0 "Biens de consommation de base (norme des années 1970)"
 cwic_cg_basic_level_3_desc:0 "Des attentes de qualité plus élevées pour les biens du quotidien. La production met l'accent sur la durabilité, la sécurité et l'emballage, soutenues par une meilleure gestion et des intrants de précision.\n\n§YLes exemples incluent :§!\n- Biens de consommation réglementés\n- Amélioration de l'emballage et de l'étiquetage\n- Articles ménagers plus durables\n- Produits sanitaires modernes"
 cwic_cg_basic_level_4_title:0 "Biens de consommation de base (norme des années 1980)"
 cwic_cg_basic_level_4_desc:0 "Production hautement standardisée et efficace avec un contrôle qualité et une intégration logistique stricts. Une fiabilité et une disponibilité constante sont attendues.\n\n§YLes exemples incluent :§!\n- Produits d'hygiène de haute qualité\n- Consommables ménagers fiables\n- Produits de marques nationales et internationales\n- Approvisionnement au détail juste à temps"
 cwic_cg_basic_level_5_title:0 "Biens de consommation de base (norme des années 1990)"
 cwic_cg_basic_level_5_desc:0 "Production et distribution mondialisées de biens de consommation de base. Les attentes en matière de qualité sont élevées et les pénuries se traduisent rapidement en conséquences économiques et politiques.\n\n§YLes exemples incluent :§!\n- Marques grand public mondiales\n- Produits emballés de haute qualité\n- Chaînes d'approvisionnement optimisées\n- Large choix et disponibilité pour les consommateurs"
 
 cwic_cg_durable_level_0_title:0 "Biens durables (norme d'avant-guerre)"
 cwic_cg_durable_level_0_desc:0 "Biens durables produits en petites quantités avec une standardisation limitée. Les appareils et les machines sont chers, peu fiables et inaccessibles à une grande partie de la population.\n\n§YLes exemples incluent :§!\n- Appareils électroménagers assemblés à la main\n- Outils mécaniques\n- Machines ménagères limitées\n- Équipements nécessitant beaucoup de réparations"
 cwic_cg_durable_level_1_title:0 "Biens durables (norme des années 1950)"
 cwic_cg_durable_level_1_desc:0 "Les premiers appareils et machines domestiques produits en série deviennent disponibles, même si la fiabilité et l'efficacité restent inégales.\n\n§YLes exemples incluent :§!\n- Réfrigérateurs et machines à laver\n- Appareils électroménagers de base\n- Machines de consommation précoce\n- Appareils domestiques électrifiés"
 cwic_cg_durable_level_2_title:0 "Biens durables (norme des années 1960)"
 cwic_cg_durable_level_2_desc:0 "La production de biens durables connaît une croissance rapide. Les appareils électroménagers deviennent des articles ménagers courants, réduisant le travail domestique et améliorant la qualité de vie.\n\n§YLes exemples incluent :§!\n- Appareils électroménagers largement disponibles\n- Appareils de chauffage et de refroidissement améliorés\n- Outils électriques grand public"
 cwic_cg_durable_level_3_title:0 "Biens durables (norme des années 1970)"
 cwic_cg_durable_level_3_desc:0 "Amélioration des normes de durabilité, d'efficacité et de sécurité. Les biens durables sont essentiels à la productivité et à la modernisation des ménages.\n\n§YLes exemples incluent :§!\n- Appareils économes en énergie\n- Appareils électriques plus sûrs\n- Pièces de rechange standardisées"
 cwic_cg_durable_level_4_title:0 "Biens durables (norme des années 1980)"
 cwic_cg_durable_level_4_desc:0 "Biens durables hautement fiables et standardisés avec une longue durée de vie. La fabrication met l'accent sur l'efficacité et le contrôle de la qualité.\n\n§YLes exemples incluent :§!\n- Appareils de haute fiabilité\n- Équipement ménager modulable\n- Machines grand public à cycle de vie longue"
 cwic_cg_durable_level_5_title:0 "Biens durables (norme des années 1990)"
 cwic_cg_durable_level_5_desc:0 "Production de biens durables entièrement modernisée avec une fabrication avancée et des chaînes d'approvisionnement mondiales.\n\n§YLes exemples incluent :§!\n- Appareils à commande numérique\n- Matériel modulaire et réparable\n- Composants d'origine mondiale\n- Les attentes en matière de service après-vente"
 
 cwic_cg_vehicles_level_0_title:0 "Véhicules (norme d'avant-guerre)"
 cwic_cg_vehicles_level_0_desc:0 "La production de véhicules est limitée, coûteuse et technologiquement dépassée. Les transports civils dépendent largement des infrastructures publiques et des options non motorisées.\n\n§YLes exemples incluent :§!\n- Automobiles à faible volume\n- Camions et bus d'avant-guerre\n- Possession limitée de véhicules privés"
 cwic_cg_vehicles_level_1_title:0 "Véhicules (norme des années 1950)"
 cwic_cg_vehicles_level_1_desc:0 "La production de véhicules d'après-guerre se développe rapidement, augmentant ainsi la disponibilité des automobiles et des camions civils.\n\n§YLes exemples incluent :§!\n- Automobiles produites en série\n- Camions légers et autobus\n- Les premiers véhicules compatibles avec l'autoroute"
 cwic_cg_vehicles_level_2_title:0 "Véhicules (norme des années 1960)"
 cwic_cg_vehicles_level_2_desc:0 "La motorisation accélère. Les véhicules deviennent essentiels à la logistique, aux déplacements domicile-travail et à l'intégration économique.\n\n§YLes exemples incluent :§!\n- Proportion généralisée de voitures particulières\n- Véhicules de livraison commerciaux\n- Extension des réseaux routiers"
 cwic_cg_vehicles_level_3_title:0 "Véhicules (norme des années 1970)"
 cwic_cg_vehicles_level_3_desc:0 "Les véhicules sont répandus et de plus en plus fiables. La sécurité et l'efficacité énergétique deviennent des considérations importantes.\n\n§YLes exemples incluent :§!\n- Amélioration des normes de sécurité\n- Des moteurs plus efficaces\n- Véhicules utilitaires spécialisés"
 cwic_cg_vehicles_level_4_title:0 "Véhicules (norme des années 1980)"
 cwic_cg_vehicles_level_4_desc:0 "Production de véhicules hautement standardisée avec des techniques de fabrication avancées.\n\n§YLes exemples incluent :§!\n- Véhicules grand public de haute qualité\n- Flottes logistiques intégrées\n- Véhicules de transport en commun fiables"
 cwic_cg_vehicles_level_5_title:0 "Véhicules (norme des années 1990)"
 cwic_cg_vehicles_level_5_desc:0 "Production de véhicules modernes caractérisée par des chaînes d'approvisionnement mondiales et une propriété de masse.\n\n§YLes exemples incluent :§!\n- Automobiles produites dans le monde entier\n- Flottes logistiques avancées\n- Des attentes élevées en matière d'accès aux véhicules"
 
 cwic_cg_consumer_electronics_level_1_title:0 "Electronique grand public (norme des années 1950)"
 cwic_cg_consumer_electronics_level_1_desc:0 "Les premiers appareils électroniques grand public deviennent commercialement viables, concentrés dans les ménages urbains et de la classe moyenne.\n\n§YLes exemples incluent :§!\n- Radios\n- Les premiers téléviseurs\n- Appareils électroménagers de base\n- Équipement audio simple"
 cwic_cg_consumer_electronics_level_2_title:0 "Electronique grand public (norme des années 1960)"
 cwic_cg_consumer_electronics_level_2_desc:0 "L'électronique grand public se diffuse rapidement dans la société, devenant des articles ménagers courants.\n\n§YLes exemples incluent :§!\n- Propriété généralisée de la télévision\n- Radios et systèmes audio améliorés\n- Appareils de communication domestiques"
 cwic_cg_consumer_electronics_level_3_title:0 "Electronique grand public (norme des années 1970)"
 cwic_cg_consumer_electronics_level_3_desc:0 "L'électronique joue un rôle croissant dans la vie quotidienne, la culture et la productivité.\n\n§YLes exemples incluent :§!\n- Téléviseurs couleur\n- Systèmes audio grand public\n- Les premières calculatrices électroniques\n- Appareils de divertissement à domicile\n- Les premiers systèmes de jeux vidéo"
 cwic_cg_consumer_electronics_level_4_title:0 "Electronique grand public (norme des années 1980)"
 cwic_cg_consumer_electronics_level_4_desc:0 "Propriété généralisée de l'électronique grand public avancée. L'électronique fait partie intégrante du niveau de vie moderne.\n\n§YLes exemples incluent :§!\n- Ordinateurs personnels\n- Lecteurs vidéo\n- Consoles de jeux vidéo pour la maison\n- Électronique domestique avancée\n- Appareils numériques grand public"
 cwic_cg_consumer_electronics_level_5_title:0 "Electronique grand public (norme des années 1990)"
 cwic_cg_consumer_electronics_level_5_desc:0 "Écosystème d'électronique grand public très avancé centré sur la technologie numérique et la connectivité.\n\n§YLes exemples incluent :§!\n- Informatique personnelle et périphériques\n- Appareils multimédias numériques\n- Systèmes de jeux vidéo pour la maison\n- Équipement de réseau grand public\n- L'électronique comme article ménager de base"

 cwic_crisis_consumer_goods:0 "Pénurie de biens de consommation"
 CWIC_POTENTIAL_CRISIS_CONSUMER_GOODS_DESC:0 "Les ménages ne peuvent pas obtenir les biens qu'ils attendent, en quantité ou en qualité. Les pénuries de biens de base, de biens durables, de véhicules civils ou d'électronique grand public érodent la stabilité, la productivité et la confiance dans l'État."
 CWIC_ACTIVE_CRISIS_consumer_goods_DESC:0 "L'offre de biens de consommation est en deçà des attentes de la population.\n\nNiveau de pénurie par bien (0 à 5) :\nBiens de base : [?cg_basic_shortage_level|R0]\nBiens durables : [?cg_durable_shortage_level|R0]\nVéhicules civils : [?cg_vehicles_shortage_level|R0]\nElectronique grand public : [?cg_consumer_electronics_shortage_level|R0]"
