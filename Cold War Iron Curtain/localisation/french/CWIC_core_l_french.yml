 CWIC_ACTIVE_CRISIS_fiscal_LOW_DESC:0 "§YFaible gravité§!\nLes finances publiques sont de plus en plus mises à rude épreuve. L'augmentation des obligations et l'affaiblissement de la flexibilité budgétaire commencent à limiter les investissements et la planification à long terme."
 CWIC_ACTIVE_CRISIS_fiscal_MEDIUM_DESC:0 "§YGravité moyenne§!\nLes pressions budgétaires limitent de plus en plus la capacité de l'État. Les choix en matière de dépenses publiques deviennent plus difficiles à mesure que le fardeau de la dette et les obligations financières augmentent."
 CWIC_ACTIVE_CRISIS_fiscal_HIGH_DESC:0 "§OHaute gravité§!\nLa situation budgétaire du gouvernement est devenue une menace majeure pour la stabilité économique. Des investissements essentiels sont retardés car le service de la dette consomme les ressources disponibles."
 CWIC_ACTIVE_CRISIS_fiscal_EXTREME_DESC:0 "§RGravité extrême§!\nL'État est confronté à une grave crise budgétaire. Les obligations financières ont submergé les finances publiques, menaçant la stabilité économique et politique."

 CWIC_ACTIVE_CRISIS_economic_contraction_LOW_DESC:0 "§YFaible gravité§!\nLa croissance économique a ralenti et la confiance des investisseurs s'affaiblit. Les entreprises et les consommateurs deviennent de plus en plus prudents."
 CWIC_ACTIVE_CRISIS_economic_contraction_MEDIUM_DESC:0 "§YGravité moyenne§!\nL'économie se contracte à mesure que la production, l'emploi et les investissements diminuent. La dynamique économique est devenue négative dans plusieurs secteurs."
 CWIC_ACTIVE_CRISIS_economic_contraction_HIGH_DESC:0 "§OHaute gravité§!\nUne grave récession est en cours. La baisse de la production et l'affaiblissement du taux d'activité créent des difficultés économiques généralisées."
 CWIC_ACTIVE_CRISIS_economic_contraction_EXTREME_DESC:0 "§RGravité extrême§!\nL'économie est en effondrement. L'activité productive se contracte rapidement et la reprise nécessitera une intervention structurelle majeure."

 CWIC_ACTIVE_CRISIS_inflation_LOW_DESC:0 "§YFaible gravité§!\nLes prix augmentent plus rapidement que la normale, réduisant le pouvoir d'achat et augmentant les coûts dans l'ensemble de l'économie."
 CWIC_ACTIVE_CRISIS_inflation_MEDIUM_DESC:0 "§YGravité moyenne§!\nL'inflation devient une préoccupation économique majeure. Les ménages et les entreprises ont du mal à s'adapter à la hausse rapide des prix."
 CWIC_ACTIVE_CRISIS_inflation_HIGH_DESC:0 "§OHaute gravité§!\nL'inflation persistante fausse les décisions d'investissement et sape la confiance dans la monnaie. La planification économique devient de plus en plus difficile."
 CWIC_ACTIVE_CRISIS_inflation_EXTREME_DESC:0 "§RGravité extrême§!\nL'inflation galopante déstabilise l'économie. La valeur de la monnaie s'érode rapidement et l'activité normale du marché s'effondre."

 CWIC_ACTIVE_CRISIS_deflation_LOW_DESC:0 "§YFaible gravité§!\nLa baisse des prix encourage les consommateurs et les entreprises à retarder leurs dépenses. L'activité économique commence à ralentir."
 CWIC_ACTIVE_CRISIS_deflation_MEDIUM_DESC:0 "§YGravité moyenne§!\nLes pressions déflationnistes réduisent les investissements et freinent la croissance économique. Les entreprises sont de plus en plus réticentes à se développer."
 CWIC_ACTIVE_CRISIS_deflation_HIGH_DESC:0 "§OHaute gravité§!\nUn cycle déflationniste sévère s'installe. La baisse des prix, la faiblesse de la demande et la baisse des investissements se renforcent mutuellement."
 CWIC_ACTIVE_CRISIS_deflation_EXTREME_DESC:0 "§RGravité extrême§!\nL'économie est piégée dans une spirale déflationniste destructrice. La production, l'investissement et la confiance des consommateurs s'effondrent simultanément."

 CWIC_ACTIVE_CRISIS_energy_LOW_DESC:0 "§YFaible gravité§!\nLes approvisionnements énergétiques deviennent tendus, ce qui augmente les coûts et réduit l'efficacité dans l'ensemble de l'économie."
 CWIC_ACTIVE_CRISIS_energy_MEDIUM_DESC:0 "§YGravité moyenne§!\nLes pénuries énergétiques persistantes perturbent la production industrielle et limitent la croissance économique."
 CWIC_ACTIVE_CRISIS_energy_HIGH_DESC:0 "§OHaute gravité§!\nDes déficits énergétiques majeurs pèsent à la fois sur l'industrie et les infrastructures. L'activité économique est de plus en plus conditionnée par la disponibilité énergétique."
 CWIC_ACTIVE_CRISIS_energy_EXTREME_DESC:0 "§RGravité extrême§!\nLe système énergétique national est en crise. Les pénuries généralisées nuisent gravement à la production, aux transports et à la stabilité économique."

 CWIC_ACTIVE_CRISIS_trade_external_shock_LOW_DESC:0 "§YFaible gravité§!\nLes perturbations des flux commerciaux commencent à affecter les marchés intérieurs. Les importations et les exportations deviennent de moins en moins fiables."
 CWIC_ACTIVE_CRISIS_trade_external_shock_MEDIUM_DESC:0 "§YGravité moyenne§!\nLes perturbations commerciales limitent l'accès aux biens et aux marchés clés. La performance économique est de plus en plus limitée par les conditions extérieures."
 CWIC_ACTIVE_CRISIS_trade_external_shock_HIGH_DESC:0 "§OHaute gravité§!\nLes chocs commerciaux majeurs nuisent à la production et aux investissements nationaux. Les chaînes d'approvisionnement deviennent de plus en plus instables."
 CWIC_ACTIVE_CRISIS_trade_external_shock_EXTREME_DESC:0 "§RGravité extrême§!\nLes relations économiques extérieures du pays sont rompues. La perturbation des échanges commerciaux constitue désormais une menace majeure pour la stabilité nationale."

 CWIC_ACTIVE_CRISIS_financial_credit_LOW_DESC:0 "§YFaible gravité§!\nL'accès au financement se resserre. L'activité d'investissement et de prêt commence à ralentir."
 CWIC_ACTIVE_CRISIS_financial_credit_MEDIUM_DESC:0 "§YGravité moyenne§!\nLes marchés du crédit sont de plus en plus tendus. Les entreprises et les consommateurs ont plus de mal à obtenir du financement."
 CWIC_ACTIVE_CRISIS_financial_credit_HIGH_DESC:0 "§OHaute gravité§!\nLe système financier est soumis à de fortes pressions. L'activité de prêt s'est fortement contractée et l'investissement se détériore."
 CWIC_ACTIVE_CRISIS_financial_credit_EXTREME_DESC:0 "§RGravité extrême§!\nLe système financier est en crise. Les flux de crédit se sont largement effondrés, menaçant l'économie dans son ensemble."

 CWIC_ACTIVE_CRISIS_governance_institutional_LOW_DESC:0 "§YFaible gravité§!\nL'efficacité institutionnelle est en déclin. Les faiblesses politiques et administratives deviennent de plus en plus visibles."
 CWIC_ACTIVE_CRISIS_governance_institutional_MEDIUM_DESC:0 "§YGravité moyenne§!\nLes problèmes de gouvernance nuisent à la capacité de l'État à gérer les défis économiques et sociaux."
 CWIC_ACTIVE_CRISIS_governance_institutional_HIGH_DESC:0 "§OHaute gravité§!\nLe dysfonctionnement institutionnel réduit considérablement la capacité de l'État. La confiance du public dans le gouvernement se détériore."
 CWIC_ACTIVE_CRISIS_governance_institutional_EXTREME_DESC:0 "§RGravité extrême§!\nL'État est confronté à une profonde crise de gouvernance. Les institutions ont du mal à maintenir leur autorité et leurs fonctions administratives de base."

 CWIC_ACTIVE_CRISIS_crop_failure_LOW_DESC:0 "§YFaible gravité§!\nLa production agricole est tombée en dessous des niveaux attendus. Les marchés alimentaires commencent à subir des pressions."
 CWIC_ACTIVE_CRISIS_crop_failure_MEDIUM_DESC:0 "§YGravité moyenne§!\nDes pertes de récoltes importantes réduisent la disponibilité alimentaire et aggravent le stress économique dans les régions rurales."
 CWIC_ACTIVE_CRISIS_crop_failure_HIGH_DESC:0 "§OHaute gravité§!\nLa production agricole a été gravement perturbée. Les approvisionnements alimentaires et les moyens de subsistance ruraux sont soumis à des pressions considérables."
 CWIC_ACTIVE_CRISIS_crop_failure_EXTREME_DESC:0 "§RGravité extrême§!\nUn effondrement agricole catastrophique est en cours. La production alimentaire est tombée à des niveaux dangereusement bas."

 CWIC_ACTIVE_CRISIS_food_security_famine_LOW_DESC:0 "§YFaible gravité§!\nLa disponibilité alimentaire devient de moins en moins sûre. La hausse des prix et les pressions sur l'offre affectent les consommateurs."
 CWIC_ACTIVE_CRISIS_food_security_famine_MEDIUM_DESC:0 "§YGravité moyenne§!\nLes pénuries alimentaires commencent à avoir un impact sur la productivité économique et la stabilité sociale."
 CWIC_ACTIVE_CRISIS_food_security_famine_HIGH_DESC:0 "§OHaute gravité§!\nDe larges segments de la population ont du mal à accéder à des approvisionnements alimentaires adéquats. Les conditions économiques et sociales se détériorent rapidement."
 CWIC_ACTIVE_CRISIS_food_security_famine_EXTREME_DESC:0 "§RGravité extrême§!\nLe pays connaît une grave crise de famine. La pénurie alimentaire devient une menace majeure pour la survie nationale."

 CWIC_ACTIVE_CRISIS_stagflation_LOW_DESC:0 "§YFaible gravité§!\nLa croissance économique s'est affaiblie tandis que l'inflation reste élevée. Les décideurs politiques ont de plus en plus de mal à concilier stabilité et croissance."
 CWIC_ACTIVE_CRISIS_stagflation_MEDIUM_DESC:0 "§YGravité moyenne§!\nL'inflation et la stagnation se renforcent mutuellement. Les consommateurs et les entreprises sont confrontés à une détérioration des conditions économiques."
 CWIC_ACTIVE_CRISIS_stagflation_HIGH_DESC:0 "§OHaute gravité§!\nL'inflation persistante combinée à la faiblesse économique freine gravement la reprise. Les outils politiques traditionnels deviennent moins efficaces."
 CWIC_ACTIVE_CRISIS_stagflation_EXTREME_DESC:0 "§RGravité extrême§!\nL'économie est piégée dans une stagflation profondément enracinée. La croissance est au point mort tandis que l'inflation continue de miner la stabilité."

 CWIC_ACTIVE_CRISIS_debt_trap_LOW_DESC:0 "§YFaible gravité§!\nLe fardeau de la dette commence à limiter la flexibilité économique. Davantage de ressources sont consacrées au respect des obligations existantes."
 CWIC_ACTIVE_CRISIS_debt_trap_MEDIUM_DESC:0 "§YGravité moyenne§!\nLa hausse du coût de la dette restreint l'investissement et réduit le potentiel de croissance à long terme."
 CWIC_ACTIVE_CRISIS_debt_trap_HIGH_DESC:0 "§OHaute gravité§!\nLes exigences en matière de service de la dette évincent les dépenses productives. La reprise économique devient de plus en plus difficile."
 CWIC_ACTIVE_CRISIS_debt_trap_EXTREME_DESC:0 "§RGravité extrême§!\nL'économie est piégée par des dettes insoutenables. La stabilité financière et le développement sont tous deux gravement menacés."

 CWIC_ACTIVE_CRISIS_collapse_spiral_LOW_DESC:0 "§YFaible gravité§!\nDe multiples crises commencent à se renforcer mutuellement. La résilience économique et institutionnelle s'affaiblit."
 CWIC_ACTIVE_CRISIS_collapse_spiral_MEDIUM_DESC:0 "§YGravité moyenne§!\nDes crises interconnectées accélèrent le déclin national. La reprise devient de plus en plus difficile sans intervention majeure."
 CWIC_ACTIVE_CRISIS_collapse_spiral_HIGH_DESC:0 "§OHaute gravité§!\nLes échecs économiques, politiques et sociaux s'aggravent. L'État perd sa capacité à stabiliser la situation."
 CWIC_ACTIVE_CRISIS_collapse_spiral_EXTREME_DESC:0 "§RGravité extrême§!\nLa nation connaît un effondrement systémique. Plusieurs systèmes critiques tombent en panne simultanément."

 CWIC_ACTIVE_CRISIS_energy_industrial_shock_LOW_DESC:0 "§YFaible gravité§!\nLes pénuries d'énergie commencent à perturber les usines, les transports et la planification industrielle. La production fonctionne toujours, mais les pertes d'efficacité se multiplient."
 CWIC_ACTIVE_CRISIS_energy_industrial_shock_MEDIUM_DESC:0 "§YGravité moyenne§!\nL'activité industrielle est limitée par un approvisionnement énergétique peu fiable. La construction, l'industrie manufacturière et la logistique sont de plus en plus vulnérables aux perturbations."
 CWIC_ACTIVE_CRISIS_energy_industrial_shock_HIGH_DESC:0 "§OHaute gravité§!\nLes pénuries d'énergie provoquent un choc industriel majeur. La production, l'investissement et la coordination économique se détériorent en raison de contraintes persistantes en matière d'offre."
 CWIC_ACTIVE_CRISIS_energy_industrial_shock_EXTREME_DESC:0 "§RGravité extrême§!\nL'économie industrielle est paralysée par la panne énergétique. Les chaînes de production s'effondrent et la reprise nécessitera une stabilisation majeure du système énergétique."

 CWIC_ACTIVE_CRISIS_famine_spiral_LOW_DESC:0 "§YFaible gravité§!\nLes pénuries alimentaires commencent à interagir avec une faiblesse économique plus large. La productivité et la stabilité commencent toutes deux à en souffrir."
 CWIC_ACTIVE_CRISIS_famine_spiral_MEDIUM_DESC:0 "§YGravité moyenne§!\nLa pénurie alimentaire renforce le déclin économique. Les pénuries nuisent à la productivité du travail et accroissent la pression sur l'ordre public."
 CWIC_ACTIVE_CRISIS_famine_spiral_HIGH_DESC:0 "§OHaute gravité§!\nLa crise alimentaire s'auto-alimente. La faim, l'instabilité et la crise économique s'aggravent mutuellement."
 CWIC_ACTIVE_CRISIS_famine_spiral_EXTREME_DESC:0 "§RGravité extrême§!\nUne spirale de famine catastrophique est en cours. La pénurie alimentaire entraîne des pertes de main-d'oeuvre, un effondrement social et un grave effondrement économique."

 CWIC_ACTIVE_CRISIS_capital_flight_LOW_DESC:0 "§YFaible gravité§!\nLes investisseurs commencent à déplacer leurs capitaux hors du pays. L'investissement intérieur s'affaiblit à mesure que la confiance s'érode."
 CWIC_ACTIVE_CRISIS_capital_flight_MEDIUM_DESC:0 "§YGravité moyenne§!\nLes sorties de capitaux s'accélèrent. Les entreprises et les institutions financières sont de moins en moins disposées à conserver des fonds dans l'économie nationale."
 CWIC_ACTIVE_CRISIS_capital_flight_HIGH_DESC:0 "§OHaute gravité§!\nLa fuite des capitaux à grande échelle draine les investissements et compromet la stabilité financière. La reprise devient de plus en plus difficile à mesure que la confiance s'effondre."
 CWIC_ACTIVE_CRISIS_capital_flight_EXTREME_DESC:0 "§RGravité extrême§!\nLes capitaux fuient à un rythme dévastateur. L'économie manque d'investissements et le contrôle financier se détériore rapidement."

 CWIC_ACTIVE_CRISIS_austerity_trap_LOW_DESC:0 "§YFaible gravité§!\nLa rigueur budgétaire commence à freiner la croissance. Les efforts visant à stabiliser le budget ralentissent l'investissement et la demande."
 CWIC_ACTIVE_CRISIS_austerity_trap_MEDIUM_DESC:0 "§YGravité moyenne§!\nL'austérité pèse lourdement sur la reprise. Les coupes budgétaires destinées à restaurer la stabilité affaiblissent également la productivité et la dynamique économique."
 CWIC_ACTIVE_CRISIS_austerity_trap_HIGH_DESC:0 "§OHaute gravité§!\nL'économie est coincée entre la pression budgétaire et la contraction. L'austérité aggrave la récession sans parvenir à restaurer la confiance."
 CWIC_ACTIVE_CRISIS_austerity_trap_EXTREME_DESC:0 "§RGravité extrême§!\nUne austérité sévère est devenue contre-productive. Les compressions budgétaires font s'effondrer la croissance, affaiblissent la stabilité et empêchent une reprise significative."

 CWIC_ACTIVE_CRISIS_resource_curse_LOW_DESC:0 "§YFaible gravité§!\nLa dépendance extractive commence à fausser l'économie dans son ensemble. Les revenus tirés des ressources découragent la diversification et renforcent les comportements de recherche de rente."
 CWIC_ACTIVE_CRISIS_resource_curse_MEDIUM_DESC:0 "§YGravité moyenne§!\nL'économie est de plus en plus façonnée par les rentes liées aux ressources. Le développement productif, la recherche et la qualité institutionnelle sont compromis."
 CWIC_ACTIVE_CRISIS_resource_curse_HIGH_DESC:0 "§OHaute gravité§!\nLa dépendance aux ressources est devenue une faiblesse structurelle. Les richesses extractives renforcent la corruption, la volatilité et la faible diversification."
 CWIC_ACTIVE_CRISIS_resource_curse_EXTREME_DESC:0 "§RGravité extrême§!\nLe pays est profondément prisonnier d'une dépendance extractive. Les institutions, l'innovation et le développement équilibré sont sacrifiés au profit des rentes liées aux ressources."

 CWIC_ACTIVE_CRISIS_militarized_economy_lock_in_LOW_DESC:0 "§YFaible gravité§!\nLes priorités militaires commencent à évincer les activités civiles. La production d'armes est renforcée, mais l'efficacité civile s'affaiblit."
 CWIC_ACTIVE_CRISIS_militarized_economy_lock_in_MEDIUM_DESC:0 "§YGravité moyenne§!\nL'économie est de plus en plus organisée autour des besoins militaires. Les investissements civils, la recherche et la productivité sont supprimés."
 CWIC_ACTIVE_CRISIS_militarized_economy_lock_in_HIGH_DESC:0 "§OHaute gravité§!\nLa militarisation est devenue profondément ancrée dans l'économie. La production militaire augmente tandis que le développement civil et la résilience à long terme diminuent."
 CWIC_ACTIVE_CRISIS_militarized_economy_lock_in_EXTREME_DESC:0 "§RGravité extrême§!\nL'économie est enfermée dans une militarisation permanente. La croissance civile, l'innovation et le niveau de vie sont sacrifiés pour maintenir la capacité militaire."

 CWIC_ACTIVE_CRISIS_NO_DESCRIPTION:0 "§RAucune description disponible.§!"


 CWIC_POTENTIAL_CRISIS_FISCAL_DESC:0 "Une crise budgétaire survient lorsque les finances publiques deviennent insoutenables. Des déficits excessifs, le fardeau de la dette ou les coûts du service de la dette réduisent la capacité de l'État à financer le développement et à répondre aux défis."

 CWIC_POTENTIAL_CRISIS_ECONOMIC_CONTRACTION_DESC:0 "La contraction économique représente un déclin de l'activité économique. La baisse de la production, des investissements et de l'emploi peut réduire la croissance et affaiblir la prospérité nationale."

 CWIC_POTENTIAL_CRISIS_INFLATION_DESC:0 "L'inflation se produit lorsque les prix augmentent de manière persistante dans l'ensemble de l'économie. Même si une inflation modérée peut accompagner la croissance, une inflation excessive mine le pouvoir d'achat et la stabilité économique."

 CWIC_POTENTIAL_CRISIS_DEFLATION_DESC:0 "La déflation se produit lorsque les prix chutent dans l'ensemble de l'économie. Une déflation persistante décourage l'investissement et la consommation, aggravant souvent le ralentissement économique."

 CWIC_POTENTIAL_CRISIS_ENERGY_DESC:0 "Les crises énergétiques surviennent lorsque la demande d'énergie dépasse l'offre disponible. La production industrielle, les transports et la croissance économique dépendent tous fortement d'un accès fiable à l'énergie."

 CWIC_POTENTIAL_CRISIS_TRADE_EXTERNAL_SHOCK_DESC:0 "Les chocs du commerce extérieur se produisent lorsque les marchés internationaux, les importations, les exportations ou les systèmes de change sont perturbés. Les économies dépendantes du commerce sont particulièrement vulnérables."

 CWIC_POTENTIAL_CRISIS_FINANCIAL_CREDIT_DESC:0 "Les crises du crédit surviennent lorsque l'accès au financement devient restreint. La faiblesse des systèmes bancaires, les défauts de paiement et l'instabilité financière peuvent réduire considérablement les investissements et la croissance économique."

 CWIC_POTENTIAL_CRISIS_GOVERNANCE_INSTITUTIONAL_DESC:0 "Les crises de gouvernance surviennent lorsque les institutions perdent leur efficacité ou leur légitimité. La corruption, le séparatisme, l'insurrection et l'instabilité peuvent miner la capacité de l'État."

 CWIC_POTENTIAL_CRISIS_CROP_FAILURE_DESC:0 "Les mauvaises récoltes représentent des perturbations majeures dans la production agricole. La sécheresse, les conflits, les dommages environnementaux ou les mauvaises récoltes peuvent réduire la production alimentaire et les revenus ruraux."

 CWIC_POTENTIAL_CRISIS_FOOD_SECURITY_FAMINE_DESC:0 "Les crises de sécurité alimentaire surviennent lorsque les populations ont du mal à obtenir des approvisionnements alimentaires adéquats. Des pénuries persistantes peuvent réduire la productivité, accroître l'instabilité et déclencher la famine."

 CWIC_POTENTIAL_CRISIS_STAGFLATION_DESC:0 "La stagflation combine une faible croissance économique et une inflation persistante. Il est particulièrement difficile à résoudre car les politiques qui s'attaquent à un problème aggravent souvent l'autre."

 CWIC_POTENTIAL_CRISIS_DEBT_TRAP_DESC:0 "Les pièges de la dette apparaissent lorsque le fardeau de la dette devient si lourd qu'il restreint l'investissement, la croissance et la flexibilité économique. Les ressources sont de plus en plus affectées au service de la dette plutôt qu'au développement."

 CWIC_POTENTIAL_CRISIS_COLLAPSE_SPIRAL_DESC:0 "Une spirale d'effondrement se produit lorsque plusieurs crises se renforcent mutuellement. Les problèmes économiques, politiques et sociaux s'aggravent, rendant la reprise progressivement plus difficile."

 CWIC_POTENTIAL_CRISIS_ENERGY_INDUSTRIAL_SHOCK_DESC:0 "Les chocs énergétiques-industriels se produisent lorsque des pénuries d'énergie perturbent considérablement la production industrielle. L'industrie manufacturière, les infrastructures et les investissements sont de plus en plus contraints."

 CWIC_POTENTIAL_CRISIS_FAMINE_SPIRAL_DESC:0 "Une spirale de famine se développe lorsque les pénuries alimentaires commencent à renforcer un déclin économique plus large. La baisse de productivité et l'aggravation de l'instabilité peuvent aggraver encore la crise alimentaire."

 CWIC_POTENTIAL_CRISIS_CAPITAL_FLIGHT_DESC:0 "La fuite des capitaux se produit lorsque les investisseurs déplacent de l'argent et des actifs à l'étranger. La réduction des investissements affaiblit la croissance économique et peut déstabiliser les systèmes financiers."

 CWIC_POTENTIAL_CRISIS_AUSTERITY_TRAP_DESC:0 "Un piège de l'austérité se produit lorsque les efforts visant à restaurer la stabilité budgétaire par des réductions de dépenses suppriment la croissance et aggravent les conditions économiques."

 CWIC_POTENTIAL_CRISIS_RESOURCE_CURSE_DESC:0 "La malédiction des ressources décrit la distorsion économique causée par une dépendance excessive à l'égard des industries extractives. La richesse en ressources naturelles peut décourager la diversification et affaiblir les institutions."

 CWIC_POTENTIAL_CRISIS_MILITARIZED_ECONOMY_LOCK_IN_DESC:0 "Une économie militarisée devient fortement dépendante de la production et des dépenses militaires. Tandis que la production de défense augmente, le développement civil et la résilience économique à long terme en pâtissent souvent."

 CWIC_POTENTIAL_CRISIS_UNKNOWN_DESC:0 "Aucune information n'est disponible pour ce type de crise."

 CWIC_ACTIVE_CRISIS_TOOLTIP:0 "§Y[CWIC_ACTIVE_CRISIS_TITLE]§!\n§gGravité :§! [CWIC_ACTIVE_CRISIS_SEVERITY]\n\n§YConditions préalables pour la prochaine gravité :§!\n[CWIC_ACTIVE_CRISIS_NEXT_SEVERITY_TRIGGERS]\n\n§YEffets actuels :§!\n[CWIC_ACTIVE_CRISIS_CURRENT_EFFECTS]\n\n§YSituation actuelle :§!\n[CWIC_ACTIVE_CRISIS_DESCRIPTION]\n\n§YLeviers recommandés :§!\n[CWIC_ACTIVE_CRISIS_LEVERS]"
 CWIC_ACTIVE_CRISIS_NO_LEVER_DATA:0 "§gAucune recommandation disponible.§!"
 CWIC_ACTIVE_CRISIS_fiscal_LEVERS:0 "- Commence lorsque le déficit budgétaire dépasse §Y4%§! du PIB ou que les paiements d'intérêts dépassent §Y5%§! du PIB.\n- Réduire le déficit : augmenter les impôts ou réduire les dépenses en matière de politique budgétaire §Y§!. Évitez les nouveaux prêts et laissez les anciens s'écouler.\n- Cette crise s'atténue lentement : un niveau de gravité tous les §Y3§! mois une fois repassé sous le seuil."
 CWIC_ACTIVE_CRISIS_economic_contraction_LEVERS:0 "- Commence lorsque le PIB diminue de plus de §Y1%§! par an.\n- Réduire les impôts ou augmenter les dépenses civiles sur §YPolitique budgétaire§! pour soutenir la demande.\n- Baissez les drains de productivité dont vous n'avez plus besoin : §YResserrement monétaire§!, contrôles du capital, des prix et du double taux, tous coûtent de la productivité chaque mois.\n- Cette crise s'atténue lentement : un niveau de gravité tous les §Y3§! mois une fois la croissance rétablie."
 CWIC_ACTIVE_CRISIS_inflation_LEVERS:0 "- Commence lorsque l'inflation mensuelle dépasse §Y0,75%§! ou que la pression du marché noir dépasse §Y25%§!. Les conditions préalables ci-dessus montrent ce qui aggrave la situation.\n- Arrêtez d'imprimer de l'argent. Utilisez §YResserrement monétaire§! ou §YContrôle des capitaux§! pour réduire l'inflation, ou §YRéforme monétaire§! en cas d'urgence.\n- Si la pression du marché noir en est la cause, utilisez §YRaids§!, une §YCampagne d'application§! ou une §YAmnesty§! sur la politique économique."
 CWIC_ACTIVE_CRISIS_deflation_LEVERS:0 "- Les prix baissent alors que l'économie se contracte ou que les taux d'intérêt sont élevés.\n- Mettre fin au resserrement monétaire §Y§! et lever les contrôles sur la politique économique. Imprimer de la monnaie ajoute de l'inflation et peut relancer la croissance des prix.\n- Soutenir la croissance à travers §YPolitique budgétaire§!."
 CWIC_ACTIVE_CRISIS_energy_LEVERS:0 "- Des stocks de pétrole inférieurs à zéro, un déficit d'électricité ou une demande d'électricité élevée avec moins de §Y2§! de centrales à combustibles fossiles et aucune centrale nucléaire.\n- Construisez des centrales électriques et importez du pétrole via l'écran commercial."
 CWIC_ACTIVE_CRISIS_trade_external_shock_LEVERS:0 "- Réserves de change inférieures à §Y3B§!, ancrage d'une devise brisée, lock-out du marché ou importation de plus de nourriture que vous n'en produisez.\n- Reconstituer les réserves grâce aux exportations. §YFloat§! la devise si un ancrage échoue.\n- Cultivez plus de nourriture chez vous pour réduire les importations."
 CWIC_ACTIVE_CRISIS_financial_credit_LEVERS:0 "- Notation de crédit de §YB§! ou pire, défaut, lock-out du marché ou trésorerie inférieure aux remboursements de la dette de ce mois-ci.\n- Gardez les liquidités au-dessus du remboursement de vos dettes et arrêtez de nouveaux emprunts jusqu'à ce que la notation se rétablisse."
 CWIC_ACTIVE_CRISIS_governance_institutional_LEVERS:0 "- Un séparatisme moyen supérieur à §Y15§!, une corruption supérieure à §Y40%§!, ou une insurrection active.\n- Le séparatisme diminue à mesure que les États se développent et que la résistance est réprimée. Les États pauvres et occupés en sont le principal moteur.\n- La corruption aggrave le séparatisme, donc le réduire est doublement utile."
 CWIC_ACTIVE_CRISIS_crop_failure_LEVERS:0 "- Production agricole inférieure à §Y85%§! de la normale, ou les prix des denrées alimentaires sont élevés.\n- Importez de la nourriture sur l'écran commercial et augmentez la production agricole jusqu'à ce que la récolte reprenne."
 CWIC_ACTIVE_CRISIS_food_security_famine_LEVERS:0 "- Les prix des denrées alimentaires sont élevés ou le pays manque de nourriture.\n- Importez d'abord de la nourriture sur l'écran de commerce, puis développez l'agriculture."
 CWIC_ACTIVE_CRISIS_stagflation_LEVERS:0 "- Inflation et contraction en même temps. Cassez l'une ou l'autre moitié pour y mettre fin.\n- Combattre l'inflation avec des mesures peu coûteuses. Productivité : arrêt de l'imprimerie, §Yresserrement monétaire§!, application du marché noir. Évitez les doubles taux et les contrôles lourds, qui aggravent la contraction."
 CWIC_ACTIVE_CRISIS_debt_trap_LEVERS:0 "- Une crise budgétaire, une crise du crédit et un déficit supérieur à §Y25%§! du PIB à la fois.\n- Réduire le déficit en premier sur §YPolitique budgétaire§!. Arrêtez d'emprunter pour couvrir cela ; de nouveaux prêts alimentent le piège."
 CWIC_ACTIVE_CRISIS_collapse_spiral_LEVERS:0 "- Crises moyennes de gouvernance et de contraction, plus au moins trois crises moyennes au total.\n- Ramenez l'un d'entre eux en dessous de la moyenne pour arrêter la spirale. Vérifiez les leviers de chaque crise."
 CWIC_ACTIVE_CRISIS_energy_industrial_shock_LEVERS:0 "- Une crise énergétique alors que l'économie se contracte.\n- Réparer l'énergie d'abord : centrales électriques et importations de pétrole. La croissance revient à mesure que l'industrie retrouve son pouvoir."
 CWIC_ACTIVE_CRISIS_famine_spiral_LEVERS:0 "- Les mauvaises récoltes et la pénurie alimentaire s'alimentent mutuellement.\n- Importez de la nourriture immédiatement sur l'écran commercial, puis reconstruisez la production agricole."
 CWIC_ACTIVE_CRISIS_capital_flight_LEVERS:0 "- Une crise du crédit accompagnée d'inflation, de problèmes de gouvernance ou d'un choc commercial.\n- Régler la crise du crédit pour y mettre fin. §YLight Capital Controls§! ralentissez l'inflation pendant que vous le faites."
 CWIC_ACTIVE_CRISIS_austerity_trap_LEVERS:0 "- Une crise budgétaire et une contraction sous un régime d'austérité ou un programme du FMI.\n- Réduire le déficit par des impôts plutôt que par de fortes réductions des dépenses, ce qui aggraverait la contraction."
 CWIC_ACTIVE_CRISIS_resource_curse_LEVERS:0 "- Dépendance pétrolière ou minière, problèmes de gouvernance et crise énergétique ou commerciale.\n- Réparer la gouvernance ou le côté énergétique et commercial pour y mettre fin. Construire une industrie civile et manufacturière afin que le pétrole et les mines pèsent moins sur l'économie."
 CWIC_ACTIVE_CRISIS_militarized_economy_lock_in_LEVERS:0 "- Des problèmes de gouvernance, une crise énergétique ou commerciale et des dépenses militaires supérieures à §Y4%§! du PIB ou une loi sur l'économie de guerre.\n- Réduire les dépenses militaires sur §YPolitique budgétaire§! ou abandonner la loi sur l'économie de guerre une fois que la guerre le permettra."
 CWIC_ACTIVE_CRISIS_NO_HIGHER_SEVERITY:0 "§RCette crise a déjà atteint sa gravité maximale.§!"
 CWIC_ACTIVE_CRISIS_NO_NEXT_TRIGGER_DATA:0 "§RAucune donnée de déclenchement de la prochaine gravité disponible.§!"
 CWIC_ACTIVE_CRISIS_NO_EFFECT_DATA:0 "§RAucune donnée sur les effets disponible.§!"
 CWIC_crisis_alert_tt:0 "§RCrise économique§!\nCrises actives :\n[CWIC_crisis_alert_list]\n§GCliquez sur§! pour ouvrir la vue de crise §Y§! de la fenêtre Finance internationale.\n§GFaites un clic droit sur§! pour ignorer jusqu'à ce qu'une nouvelle crise commence ou qu'elle s'aggrave."
 CWIC_crisis_alert_line:0 " - §Y[CWIC_ACTIVE_CRISIS_TITLE]§! ([CWIC_ACTIVE_CRISIS_SEVERITY])\n[CWIC_crisis_alert_list_inner]"

 CWIC_POTENTIAL_CRISIS_TOOLTIP:0 "§Y[CWIC_POTENTIAL_CRISIS_TITLE]§!\n\n§YAperçu :§!\n[CWIC_POTENTIAL_CRISIS_DESCRIPTION]\n\n§YExigences de faible gravité :§!\n[CWIC_POTENTIAL_CRISIS_LOW_TRIGGERS]\n\n§YEffets de faible gravité :§!\n[CWIC_POTENTIAL_CRISIS_LOW_EFFECTS]"
 CWIC_POTENTIAL_CRISIS_NO_EFFECT_DATA:0 "§RAucune donnée sur les effets disponible.§!"

 cwic_crisis_fiscal_low_effects_tt:0 "  §W-§! Gain de pouvoir politique : §R-0,03§!\n  §W-§! Stabilité : §R-2 %§!\n  §W-§! Facteur d'usine de biens de consommation : §R+1 %§!"
 cwic_crisis_fiscal_medium_effects_tt:0 "  §W-§! Gain de pouvoir politique : §R-0,06§!\n  §W-§! Stabilité : §R-4 %§!\n  §W-§! Facteur d'usine de biens de consommation : §R+3 %§!"
