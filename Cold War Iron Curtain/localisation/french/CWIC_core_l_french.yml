 CWIC_MNC.1100.t:0 "[CWIC_mnc_last_corp_name] Ouvre les opérations"
 CWIC_MNC.1100.d:0 "[CWIC_mnc_last_corp_name] a finalisé son entrée dans notre secteur [CWIC_mnc_last_sector_name]. Les bureaux sont ouverts, le personnel local est embauché et les premiers contrats ont été signés.\n\nPrésence de l'entreprise : §Y[?cwic_mnc_last_presence|0]§!/5\n[CWIC_mnc_last_sector_name] niveau de présence étrangère : §Y[?cwic_mnc_last_tier|0]§!/5\n\nLa prime de signature de l'entreprise et le niveau sectoriel sont désormais actifs. Les deux sont affichés sous §YCapital étranger§! sur la page Politique économique."
 CWIC_MNC.1100.a:0 "Bienvenue à bord."
 CWIC_MNC.1101.t:0 "[CWIC_mnc_last_corp_name] Retarde son investissement"
 CWIC_MNC.1101.d_open:0 "[CWIC_mnc_last_corp_name] a accepté nos conditions mais n'a pas le capital libre pour entrer dans notre secteur [CWIC_mnc_last_sector_name] ce mois-ci. Aucune présence n'a encore été établie.\n\nL'invitation reste ouverte et l'entreprise fera une nouvelle tentative le mois prochain."
 CWIC_MNC.1101.d_lapsed:0 "[CWIC_mnc_last_corp_name] n'a encore une fois pas réussi à lever les capitaux nécessaires pour entrer dans notre secteur [CWIC_mnc_last_sector_name]. L'invitation est devenue caduque sans aucun investissement.\n\nNous pouvons inviter à nouveau l'entreprise à partir de la page §YForeign Capital§! une fois son temps de recharge terminé."
 CWIC_MNC.1101.a:0 "Compris."
