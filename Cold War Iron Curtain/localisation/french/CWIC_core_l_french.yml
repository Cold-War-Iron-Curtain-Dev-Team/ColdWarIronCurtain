 cwic_pol_monetary_status_tt:0 "§YImpression :§! si le gouvernement crée de l'argent frais pour couvrir les dépenses. Ajoute l'inflation et la pression du marché noir chaque mois.\n§YResserrement :§! si la banque centrale retire de l'argent de l'économie pour faire baisser l'inflation.\n§YInflation :§! à quelle vitesse les prix augmentent chaque mois. Le resserrement devient disponible au-dessus de 0,6% par mois."
 cwic_pol_markets_status_tt:0 "§YContrôles :§! limites de transfert d'argent hors du pays. Des contrôles légers ou lourds protègent les réserves mais poussent le commerce vers la clandestinité.\n§YFX :§! votre régime de change. Le flottement permet au marché de fixer la valeur ; Pegged détient un taux fixe utilisant les réserves de change ; une monnaie de réserve est détenue par d'autres pays.\n§YMarché noir :§! la part du commerce échappant à l'État. Au-dessus de 25 %, cela commence à augmenter l'inflation et à réduire la productivité."
 cwic_pol_system_status_tt:0 "§YSystème actuel :§! le modèle économique sur lequel votre pays fonctionne actuellement. Voir l'en-tête Aperçu financier pour sa description complète."
 cwic_pol_foreign_status_tt:0 "§YConcessions :§! si les entreprises étrangères peuvent négocier ici des droits d'exploitation spéciaux. Les économies planifiées en ont besoin avant qu'une entreprise puisse y prétendre.\n§YNationalisation :§! pression publique et politique pour saisir les avoirs étrangers, sur une échelle de 0 à 5. Au-dessus de 4,5, aucune entreprise n'acceptera de nouvelles invitations.\n--------------\n§YBonus d'entreprise combinés§!\nStabilité : [?cwic_sig_sum_stability_factor|%+1]\nVitesse de recherche : [?cwic_sig_sum_research_speed_factor|%+1]\nCroissance de la production industrielle : [?cwic_sig_sum_production_factory_efficiency_gain_factor|%+1]\nConstruction d'usines civiles : [?cwic_sig_sum_production_speed_industrial_complex_factor|%+1]\nConstruction de bâtiments : [?cwic_sig_sum_production_speed_buildings_factor|%+1]\nProduction de pétrole : [?cwic_sig_sum_production_oil_factor|%+1]\nGain de carburant : [?cwic_sig_sum_fuel_gain_factor|%+1]\nGain réseau Intel : [?cwic_sig_sum_intel_network_gain_factor|%+1]\nBiens de consommation : [?cwic_sig_sum_consumer_goods_factor|%+1]\nAcier : [?cwic_sig_sum_country_resource_steel|+0]\nTerres rares : [?cwic_sig_sum_country_resource_tungsten|+0]\nMatières nucléaires : [?cwic_sig_sum_country_resource_chromium|+0]\nProduction de biens de base : [?cwic_sig_sum_cg_basic_output|%+1]\nProduction de biens durables : [?cwic_sig_sum_cg_durable_output|%+1]\nProduction de véhicules grand public : [?cwic_sig_sum_cg_vehicles_output|%+1]\nProduction d'électronique grand public : [?cwic_sig_sum_cg_electronics_output|%+1]\nRelief des terres rares : [?cwic_sig_sum_cg_rare_earth_relief|+2]"
 cwic_pol_fc_presence_tt:0 "§YNiveau de présence§!\nLe degré d'implantation des entreprises étrangères dans ce secteur, de 0 (aucune) à 5 (dominante). Chaque niveau renforce le bonus sectoriel et les entreprises ajoutent leur propre bonus à mesure que leur présence augmente."
 cwic_pol_fc_investment_tt:0 "§YParcourir§!\nOuvrez la liste des entreprises qui pourraient investir dans ce secteur, avec leurs coûts et bonus."
 cwic_pol_key_expand_tt:0 "§YDévelopper§!\nAssouplit l'économie : plus d'argent, plus de liberté, un soulagement rapide. Augmente généralement l'inflation plus tard."
 cwic_pol_key_restrict_tt:0 "§YRestreindre§!\nRéprime la monnaie, les prix ou le commerce pour stabiliser les choses. Ralentit généralement la croissance ou alimente le marché noir."
 cwic_pol_key_structural_tt:0 "§YStructurel§!\nChange la façon dont l'économie est organisée. Les effets durent longtemps."
 cwic_pol_key_drastic_tt:0 "§YDrastique§!\nDes mesures d'urgence aux effets importants et aux coûts élevés. Utiliser en cas de crise."
 cwic_pol_key_revert_tt:0 "§YRevenir§!\nMet fin à une mesure antérieure et revient à la normale."
 cwic_pol_key_tt:0 "§YClé de politique§!\nLe voyant de chaque bouton indique son type d'action.\n\n§CDévelopper§!: relâche l'économie pour un soulagement rapide. Augmente généralement l'inflation plus tard.\n§ORestreindre§!: réprime l'argent, les prix ou le commerce. Ralentit généralement la croissance ou alimente le marché noir.\n§YStructurel§!: change la façon dont l'économie est organisée. Les effets durent longtemps.\n§RDrastique§!: mesures d'urgence avec de gros effets et de gros coûts.\n§gRevert§!: termine une mesure précédente et revient à la normale."
