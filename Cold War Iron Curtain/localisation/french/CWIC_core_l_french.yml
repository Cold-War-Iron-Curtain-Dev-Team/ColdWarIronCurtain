 Econ_Details_1_TT:0 "§YInflation mensuelle§!\nÀ quelle vitesse les prix augmentent chaque mois. §g1 % par mois équivaut à environ 12 % par an.§!\n--------------\n§YCrise inflationniste§! au-dessus de §Y0,75%§!, pire à §O1%§!, §R2%§! et §R3,5%§!."

 Econ_Details_2_TT:0 "§YPression du marché noir§!\nPart de l'économie négociée en dehors des circuits officiels. Les contrôles des prix, des capitaux et des devises ainsi que l'impression monétaire le font monter.\n--------------\n§YCrise inflationniste§! au-dessus de §Y25%§!, pire à §O50%§!, §R75%§! et §R85%§!.\nAu-dessus de §R60%§!, cela alimente également une crise financière de §Y§!."

 Econ_Details_3_TT:0 "§YRéserves de change§!\nDes devises étrangères à portée de main pour payer les importations et défendre votre monnaie.\n--------------\n§YCrise de choc commercial§! en dessous de §Y3B§!, pire en dessous de §O2B§!, §R1B§! et §R0,5B§!.\nL'ancrage de votre devise a besoin de plus de §G5B§!."

 Econ_Details_4_TT:0 "§YRatio intérêts/PIB§!\nIntérêts annuels sur la dette publique en proportion du PIB. Les remboursements de capital ne sont pas pris en compte.\n--------------\n§YCrise budgétaire§! au-dessus de §Y5%§!, pire à §O10%§!, §R15%§! et §R20%§!."

 Econ_Details_5_TT:0 "§YRatio déficit/PIB§!\nDéficit budgétaire annuel en proportion du PIB.\n--------------\n§YCrise budgétaire§! au-dessus de §Y4%§!, pire à §O8%§!, §R15%§! et §R18%§!."

 Econ_Details_6_TT:0 "§YSecteur des industries extractives§!\nPart du PIB provenant du pétrole, du gaz, du charbon et des mines.\n--------------\nAu-dessus de §Y45%§!, une mauvaise gouvernance peut déclencher la malédiction des ressources §Y§!. Cela empire à §O55%§!, §R60%§! et §R75%§!.\nAu-dessus de §Y70%§! vous pouvez passer à une économie §YRentier§! ; en dessous de §Y60 %§!, vous pouvez revenir en arrière."
 
