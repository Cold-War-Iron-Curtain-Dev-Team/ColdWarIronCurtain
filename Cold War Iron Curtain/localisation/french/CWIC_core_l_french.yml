 cwic_heavy_industry_first:0 "Priorité à l'industrie lourde"
 cwic_heavy_industry_first_desc:0 "Le plan donne la priorité aux investissements aux aciéries, aux constructeurs de machines et aux usines d'armement. Les complexes industriels se développent plus rapidement, tandis que la production de produits de première nécessité, de biens durables et de véhicules civils prend du retard. Les stratégies de l'industrie des biens durables et de la consommation axée sur l'exportation ne sont pas disponibles."
 cwic_heavy_industry_first_reformed:0 "Planification industrielle rééquilibrée"
 cwic_heavy_industry_first_reformed_desc:0 "Les réformes de planification donnent plus de poids à la demande des ménages dans les objectifs des usines et les décisions d'investissement. La production de consommation est confrontée à des réductions moindres et l'avantage réduit dans le secteur de la construction continue de favoriser l'industrie lourde ; une stratégie Durables est désormais autorisée. La stratégie de l'industrie de consommation axée sur l'exportation reste indisponible."
