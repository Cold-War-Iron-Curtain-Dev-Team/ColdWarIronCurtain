CWIC_fx_policy:0 "Politique de taux de change"
CWIC_fx_policy_desc:0 "Définir le régime de change et gérer les réserves. Les ancrages peuvent ancrer les attentes, mais défendre un ancrage draine les réserves et peut s'effondrer sous une pression soutenue."

CWIC_currency_policy:0 "Monnaie et politique monétaire"
CWIC_currency_policy_desc:0 "Utilisez des outils monétaires pour stabiliser l'inflation, financer les opérations gouvernementales par le biais du seigneuriage et mettre en oeuvre des réformes monétaires. Chaque option échange un soulagement à court terme contre une crédibilité à long terme."

CWIC_IMF_Credit_Programs:0 "Programmes de crédit du FMI"
CWIC_IMF_Credit_Programs_desc:0 "Accédez aux programmes de stabilisation du FMI lorsque les emprunts sur le marché deviennent difficiles. Le soutien du FMI peut restaurer la crédibilité et fournir des liquidités, mais il est assorti de conditionnalités et de limites à la flexibilité politique."

CWIC_black_market:0 "Application du marché noir"
CWIC_black_market_desc:0 "Les contrôles et les pénuries peuvent pousser le commerce vers des circuits informels. L'application, la légalisation et les raids ciblés peuvent réduire la pression du marché noir, mais peuvent imposer des perturbations à court terme."

CWIC_capital_controls:0 "Contrôles des capitaux et des prix"
CWIC_capital_controls_desc:0 "Imposer ou assouplir les contrôles pour gérer l'inflation et la fuite des capitaux. Les contrôles peuvent faire baisser les prix et stabiliser les marchés à court terme, mais ils créent des distorsions qui augmentent la pression du marché noir au fil du temps."

CWIC_adopt_currency_peg:0 "Adoptez un ancrage monétaire"
CWIC_adopt_currency_peg_desc:0 "Ancrez la monnaie à une référence stable et engagez des réserves pour défendre l'ancrage. Un arrimage peut réduire la dynamique de l'inflation, mais peut s'effondrer si les réserves sont épuisées sous une pression soutenue."

CWIC_float_currency:0 "Faire flotter la monnaie"
CWIC_float_currency_desc:0 "Permettez à la monnaie de s'adapter aux conditions du marché. Le flottement réduit la fuite des réserves et aide à absorber les chocs, mais peut accroître l'inflation si la crédibilité est faible."

CWIC_enable_money_printing:0 "Autoriser le financement monétaire"
CWIC_enable_money_printing_desc:0 "Permettre un financement monétaire continu des obligations gouvernementales. Cela peut réduire la pression immédiate sur le financement, mais augmente les risques d'inflation et encourage l'informalisation."

CWIC_disable_money_printing:0 "Mettre fin au financement monétaire"
CWIC_disable_money_printing_desc:0 "S'engager à mettre fin au financement monétaire et à restaurer la crédibilité politique. Cela réduit la pression inflationniste au fil du temps, mais peut nécessiter un financement alternatif ou une restriction des dépenses."

CWIC_print_money_small:0 "Émettre un seigneuriage limité"
CWIC_print_money_small_desc:0 "Créez une petite somme d'argent frais pour couvrir les obligations à court terme. Il s'agit d'une mesure d'allègement temporaire assortie de risques d'inflation et de marché noir gérables."

CWIC_print_money_medium:0 "Émettre un seigneuriage modéré"
CWIC_print_money_medium_desc:0 "Créer un montant modéré d'argent frais pour combler un déficit budgétaire. Utile en cas d'urgence, mais cela augmente la dynamique de l'inflation et peut développer l'économie informelle."

CWIC_print_money_large:0 "Émettre un seigneuriage d'urgence"
CWIC_print_money_large_desc:0 "Créez une grande quantité d'argent frais pour éviter un effondrement immédiat. Il s'agit d'un dernier recours qui augmentera considérablement les risques d'inflation et la pression du marché noir."

CWIC_enable_monetary_tightening:0 "Mettre en oeuvre un resserrement monétaire"
CWIC_enable_monetary_tightening_desc:0 "Augmenter la rigueur politique et accepter les difficultés économiques à court terme pour réduire l'inflation. Le resserrement réduit la dynamique de l'inflation mais peut déprimer la productivité et mettre à rude épreuve la stabilité sociale."

CWIC_disable_monetary_tightening:0 "Mettre fin au resserrement monétaire"
CWIC_disable_monetary_tightening_desc:0 "Réduire la rigueur des politiques et soutenir la reprise une fois l'inflation stabilisée. Mettre fin au resserrement trop tôt peut relancer l'inflation et affaiblir la crédibilité."

CWIC_currency_reform:0 "Exécuter la réforme monétaire"
CWIC_currency_reform_desc:0 "Rebaser la monnaie et réinitialiser les attentes grâce à un vaste programme de réformes. La réforme monétaire peut réduire considérablement les biais inflationnistes chroniques et améliorer la crédibilité, mais elle perturbe les contrats et impose des coûts économiques à court terme."

CWIC_request_imf_sba:0 "Demander un accord de confirmation au FMI"
CWIC_request_imf_sba_desc:0 "Rechercher le soutien du FMI en matière de stabilisation pour restaurer la crédibilité et éviter un effondrement du financement. L'aide du FMI fournit des fonds et un soutien politique, mais impose des conditionnalités et restreint le financement monétaire."

CWIC_black_market_raids:0 "Raids anti-contrebande ciblés"
CWIC_black_market_raids_desc:0 "Mener des opérations de répression ciblées contre les principaux réseaux de contrebande. Les raids peuvent réduire la pression du marché noir, même s'ils peuvent perturber temporairement la production et la logistique."

CWIC_black_market_enforcement_campaign:0 "Campagne de contrôle des devises"
CWIC_black_market_enforcement_campaign_desc:0 "Lancer un vaste effort d'application pour rétablir l'ordre monétaire et supprimer les marchés informels. Cela peut réduire considérablement la pression du marché noir au prix de perturbations à court terme."

CWIC_black_market_amnesty:0 "Campagne d'amnistie et de légalisation"
CWIC_black_market_amnesty_desc:0 "Proposer une amnistie limitée et réorienter les activités informelles vers l'économie légale. Cela réduit la pression du marché noir, mais la normalisation des prix pourrait temporairement accroître l'inflation."

CWIC_capital_controls_light:0 "Imposer des contrôles légers des capitaux"
CWIC_capital_controls_light_desc:0 "Introduire des contrôles limités sur les flux de capitaux pour réduire la volatilité et prévenir les sorties soudaines. Ces contrôles peuvent supprimer les pressions inflationnistes, mais augmenteront les distorsions au fil du temps."

CWIC_capital_controls_heavy:0 "Imposer de lourds contrôles des capitaux"
CWIC_capital_controls_heavy_desc:0 "Mettre en oeuvre des contrôles stricts sur les mouvements de capitaux et les transactions financières. Des contrôles stricts peuvent stabiliser une crise, mais ils accroissent fortement les distorsions et la pression du marché noir."

CWIC_fx_controls_dual:0 "Adopter un système de double taux de change"
CWIC_fx_controls_dual_desc:0 "Établir des taux de change officiels et de marché distincts pour donner la priorité aux importations essentielles et stabiliser les secteurs clés. Le double FX peut réduire la pression immédiate, mais développe souvent le commerce informel et l'arbitrage."

CWIC_price_controls_basic:0 "Mettre en oeuvre des contrôles de prix de base"
CWIC_price_controls_basic_desc:0 "Fixez des limites de prix de base sur les produits clés pour stabiliser le coût de la vie et éviter les prix de panique. Le contrôle des prix peut supprimer l'inflation à court terme mais accroît généralement les pénuries et les marchés informels."

CWIC_capital_controls_lift:0 "Commandes d'ascenseur"
CWIC_capital_controls_lift_desc:0 "Supprimez les contrôles d'urgence et laissez les marchés se normaliser. La levée des contrôles peut améliorer l'efficacité à long terme, mais peut déclencher un rebond de l'inflation à court terme si les distorsions et les marchés noirs sont élevés."

CWIC_internationalize_currency:0 "Internationaliser la monnaie"
CWIC_internationalize_currency_desc:0 "Promouvoir la monnaie comme instrument majeur de règlement et de réserve. L'obtention du statut de réserve nécessite une grande échelle économique, une faible inflation et une forte crédibilité du crédit. Le succès confère des avantages structurels en matière de financement, mais une mauvaise gestion peut éroder la confiance et supprimer ce privilège."

CWIC_global_monetary_order:0 "Ordre monétaire mondial"
CWIC_global_monetary_order_desc:0 "Le contrôle de la monnaie utilisée pour fixer le prix du commerce mondial du pétrole confère des avantages financiers structurels. L'émetteur de la monnaie qui fixe le prix du pétrole bénéficie d'une demande extérieure soutenue, de coûts d'emprunt plus faibles et d'une plus grande résilience macroéconomique. Remettre en question la monnaie pétrolière dominante risque d'entraîner une instabilité mondiale mais pourrait remodeler l'ordre financier international."

CWIC_challenge_petrodollar:0 "Défier le prix du pétrole en dollars"
CWIC_challenge_petrodollar_desc:0 "Promouvoir notre monnaie comme norme de tarification pour le commerce mondial du pétrole. En cas de succès, ce changement augmentera la demande structurelle pour notre monnaie et affaiblira la domination financière de l'émetteur actuel. Cependant, une telle décision risque de provoquer une volatilité des marchés mondiaux et une instabilité à court terme."

