 cwic_crisis_consumer_goods_potential_effects_tt:0 "  §W-§! Stabilité : §R-2 %§!\n  §W-§! Gain de pouvoir politique : §R-0,03§!\n  §W-§! Productivité : §R-2 %§!\n  §W-§! Ratio d'effectif : §R-2 %§!\n  §W-§! Dépenses sociales : §R+3 %§!"
 cwic_crisis_consumer_goods_effects_tt:0 "  §W-§! Stabilité : §R[?CWIC_DM_CG_STABILITY_FACTOR|%1]§!\n  §W-§! Gain de pouvoir politique : §R[?CWIC_DM_CG_POLITICAL_POWER_GAIN|2]§!\n  §W-§! Productivité : §R[?CWIC_DM_CG_PRODUCTIVITY_FACTOR|%1]§!\n  §W-§! Effectif : §R[?CWIC_DM_CG_WORKFORCE_RATIO|%1]§!\n  §W-§! Vitesse de construction : §R[?CWIC_DM_CG_CONSTRUCTION_SPEED_FACTOR|%1]§!\n  §W-§! Dépenses sociales : §R+[?CWIC_DM_CG_WELFARE_SPENDING_MOD|%1]§!\n  §W-§! Dépenses policières : §R+[?CWIC_DM_CG_POLICING_SPENDING_MOD|%1]§!\n  §W-§! Dépenses de services publics : §R+[?CWIC_DM_CG_PUBLIC_SERVICES_SPENDING_MOD|%1]§!\n  §W-§! Revenu du parc industriel : §R[?CWIC_DM_CG_INDUSTRIAL_PARK_INCOME_BONUS|%1]§!\n  §W-§! Revenus du parc de bureaux : §R[?CWIC_DM_CG_OFFICE_PARK_INCOME_BONUS|%1]§!"
 CWIC_ACTIVE_CRISIS_consumer_goods_LEVERS:0 "Produisez ou importez davantage de biens courts (écran commercial, vue consommateur), construisez des parcs de bureaux pour débloquer des véhicules et des appareils électroniques, et augmentez la capacité industrielle pour produire de nouveaux niveaux."
 cap_automotive_desc:0 "Représente la capacité industrielle dédiée à la production de véhicules civils et militaires, notamment des automobiles, des camions et des plates-formes blindées. Une capacité automobile plus élevée améliore la capacité d'un pays à développer la fabrication de véhicules, à soutenir des forces mécanisées et à soutenir des économies fortement axées sur les transports."
 cap_electronics_desc:0 "Représente la capacité industrielle et technique de concevoir et de fabriquer des composants électroniques, des systèmes de contrôle et du matériel informatique. La capacité électronique affecte les chaînes de production avancées, les systèmes d'armes modernes, les infrastructures de communication et la modernisation technologique."
 cap_light_industry_desc:0 "Représente la capacité des secteurs manufacturiers de faible intensité axés sur le consommateur, notamment les textiles, les articles ménagers, les outils de base et les produits industriels à petite échelle. La capacité de l'industrie légère soutient la consommation civile, les marchés intérieurs et la stabilité économique."
 cap_management_desc:0 "Représente la capacité administrative, organisationnelle et logistique d'un État à coordonner des systèmes industriels complexes. La capacité de gestion influence l'efficacité avec laquelle les ressources, la main-d'oeuvre et les réseaux de production sont dirigés et soutenus dans l'ensemble de l'économie."
 cap_precision_manufacturing_desc:0 "Représente la capacité de production industrielle de haute précision et de haute qualité, y compris des machines-outils, des composants avancés et des processus de fabrication spécialisés. La capacité de fabrication de précision est essentielle pour l'aérospatiale, l'électronique, l'armement avancé et les chaînes d'approvisionnement industrielles modernes."
 
