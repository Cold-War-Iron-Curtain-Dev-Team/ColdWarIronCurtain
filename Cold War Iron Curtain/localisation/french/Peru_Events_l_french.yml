 peru.1.d:0 "Nous devons choisir qui sera le Président de la République, d'un côté nous avons la Junta Militar de Gobierno... et bien personne d'autre"
 peru.2.d:0 "C'est le moment de choisir qui sera le Président de la République, d'un côté nous avons le Movimiento Democratico Peruano dirigé par Manuel Prado Ugarteche, et de l'autre nous avons Fernando Belaunde Terry à la tête du Frente nacional de Juventudes Democraticos."
