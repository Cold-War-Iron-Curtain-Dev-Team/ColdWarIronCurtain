l_french:
 peru.1.d:0 "Nous devons choisir qui sera le président de la République ; d'un côté, nous avons la Junta Militar de Gobierno… et de l'autre, personne d'autre."
 peru.2.d:0 "Le moment est venu de choisir qui sera le président de la République. D'un côté, nous avons le Mouvement démocratique péruvien dirigé par Manuel Prado Ugarteche, et de l'autre, Fernando Belaunde Terry à la tête du Front national de la jeunesse démocratique."