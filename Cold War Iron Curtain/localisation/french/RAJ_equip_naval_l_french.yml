 # Submarine Hulls #

 RAJ_sub_hull_small_single_2:0 "Classe Sindhugosh"
 RAJ_sub_hull_small_single_2_short:0 "Classe Sindhugosh"
 RAJ_sub_hull_small_single_2_desc:0 "Le projet 877 Paltus est une classe de sous-marins d'attaque diesel-électriques."
 
 RAJ_sub_hull_small_single_3:0 "Classe Shishumar"
 RAJ_sub_hull_small_single_3_short:0 "Classe Shishumar"
 RAJ_sub_hull_small_single_3_desc:0 "Les navires de classe Shishumar sont des sous-marins d'attaque diesel-électriques, actuellement en service actif dans la marine indienne. Ces sous-marins sont une variante indienne des sous-marins Type 209 développés par le chantier allemand Howaldtswerke-Deutsche Werft (HDW) sous la désignation interne Type 1500. Les deux premiers navires ont été construits par HDW à Kiel, tandis que les autres ont été construits à Mazagon Dock Limited (MDL), Mumbai dans le cadre d'un accord de transfert de technologie. Les sous-marins ont été mis en service entre 1986 et 1994. Ces sous-marins ont un déplacement de 1 660 tonnes en surface, une vitesse de 22 noeuds (41 km/h) et un effectif de 40 personnes dont huit officiers."
 
 RAJ_sub_hull_small_single_4:0 "Classe Scorpène"
 RAJ_sub_hull_small_single_4_short: "Classe Scorpène"
 RAJ_sub_hull_small_single_4_desc:0 ""


 
 RAJ_sub_hull_large_single_1:0 "Classe Kalvari"
 RAJ_sub_hull_large_single_1_short:0 "Classe Kalvari"
 RAJ_sub_hull_large_single_1_desc:0 "Les sous-marins de la classe Kalvari ont été les premiers sous-marins intégrés à la marine indienne. Il s'agissait de variantes des premiers sous-marins soviétiques de la classe Foxtrot. Quatre membres de la classe ont servi dans la marine indienne. Quatre variantes supplémentaires de la dernière classe Foxtrot ont été introduites sous le nom de classe Vela. L'INS Kursura a été conservé en tant que musée sur la plage de Ramakrishna Mission à Visakhapatnam. La voile du navire de tête, INS Kalvari, est également exposée au musée de la ville de Visakhapatnam."
 
 RAJ_sub_hull_large_single_2:0 "Classe Vela"
 RAJ_sub_hull_large_single_2_short:0 "Classe Vela"
 RAJ_sub_hull_large_single_2_desc:0 "Les sous-marins de classe Vela de la marine indienne étaient des variantes des derniers sous-marins soviétiques de classe Foxtrot. Le dernier de la classe a été mis hors service de la marine indienne en décembre 2010. L'INS Vagli devrait être conservé en tant que musée au Tamil Nadu, bien que le processus ait été en proie à des problèmes et soit actuellement en suspens."
 
 RAJ_sub_hull_large_single_3:0 "Classe Charlie"
 RAJ_sub_hull_large_single_3_short:0 "Classe Charlie"
 RAJ_sub_hull_large_single_3_desc:0 ""
 
 RAJ_sub_hull_large_single_4:0 "Classe Akula"
 RAJ_sub_hull_large_single_4_short:0 "Classe Akula"
 RAJ_sub_hull_large_single_4_desc:0 ""

 
 RAJ_sub_hull_large_double_3:0 "Classe Arihant"
 RAJ_sub_hull_large_double_3_short:0 "Classe Arihant"
 RAJ_sub_hull_large_double_3_desc:0 "La classe Arihant (sanskrit, pour Slayer of Enemies) est une classe de sous-marins nucléaires lance-missiles en cours de construction pour la marine indienne. Ils ont été développés dans le cadre du projet ATV (Advanced Technology Vessel) de 90 000 crores (13 milliards de dollars) pour concevoir et construire des sous-marins à propulsion nucléaire. Les navires sont classés comme sous-marins nucléaires de frappe stratégique par l'Inde. Le principal navire de la classe, l'INS Arihant, a été lancé en 2009 et, après de nombreux essais en mer, sa mise en service a été confirmée en août 2016. L'Arihant est le premier sous-marin lance-missiles balistique à avoir été construit par un pays autre que l'un des cinq membres permanents du Conseil de sécurité des Nations Unies."
 
 # Авианосцы #
 
 RAJ_carrier_hull_1:0 "Classe Majestic"
 RAJ_carrier_hull_1_short:0 "Classe Majestic"
 RAJ_carrier_hull_1_desc:0 "L'INS Vikrant était un porte-avions de classe Majestic de la marine indienne. Le navire a été construit sous le nom de HMS Hercules pour la Royal Navy britannique pendant la Seconde Guerre mondiale, mais la construction a été suspendue à la fin de la guerre. L'Inde a acheté le porte-avions incomplet en 1957 et la construction a été achevée en 1961. Vikrant a été mis en service comme premier porte-avions de la marine indienne et a joué un rôle clé dans le renforcement du blocus naval du Pakistan oriental pendant la guerre indo-pakistanaise de 1971."
 
 RAJ_carrier_hull_2:0 "Classe Centaure"
 RAJ_carrier_hull_2_short:0 "Classe Centaure"
 RAJ_carrier_hull_2_desc:0 "L'INS Viraat était un porte-avions de classe Centaure de la marine indienne. L'INS Viraat était le vaisseau amiral de la marine indienne avant la mise en service de l'INS Vikramaditya en 2013. Le navire a été achevé et mis en service en 1959 sous le nom de HMS Hermes de la Royal Navy, et mis hors service en 1984. Il a été vendu à l'Inde en 1987. L'INS Viraat a été mis en service dans la marine indienne le 12 mai 1987 et a servi pendant près de 30 ans."
 
 RAJ_carrier_hull_3:0 "Classe Kiev"
 RAJ_carrier_hull_3_short:0 "Classe Kiev"
 RAJ_carrier_hull_3_desc:0 "L'INS Vikramaditya est un porte-avions modifié de classe Kiev et le fleuron de la marine indienne, entré en service en 2013. Construit à l'origine sous le nom de Bakou et mis en service en 1987, le porte-avions a servi dans la marine soviétique, puis dans la marine russe (sous le nom d'amiral Gorshkov) avant d'être mis hors service en 1996. Le porte-avions a été acheté par l'Inde le 20 janvier 2004 après des années de négociations pour un prix final de 2,35 milliards de dollars. Le navire a terminé avec succès ses essais en mer en juillet 2013[23] et ses essais en aviation en septembre 2013. Il a été mis en service le 16 novembre 2013 lors d'une cérémonie tenue à Severodvinsk, en Russie. Le 14 juin 2014, le Premier ministre indien a officiellement intronisé l'INS Vikramaditya dans la marine indienne et l'a dédiée à la nation."
 
 RAJ_carrier_hull_4:0 "Projet 71"
 RAJ_carrier_hull_4_short:0 "Projet 71"
 RAJ_carrier_hull_4_desc:0 "INS Vikrant, également connu sous le nom de Porte-avions indigène 1 (IAC-1), est un porte-avions construit par le chantier naval Cochin à Kochi, Kerala pour la marine indienne. Il s'agit du premier porte-avions construit en Inde. Le nom Vikrant (sanskrit vikranta, littéralement « aller au-delà ») signifie « courageux ».[13] La devise du navire est Jayema Sam Yudhi Sprdhah, qui est tirée du Rigveda 1.8.3 et peut être traduite par « Je bats ceux qui se battent contre moi."
 
 
 RAJ_carrier_hull_super_4:0 "Classe Vishal"
 RAJ_carrier_hull_super_4_short:0 "Classe Vishal"
 RAJ_carrier_hull_super_4_desc:0 "INS Vishal, également connu sous le nom de Porte-avions autochtone 2 (IAC-2), est un porte-avions prévu qui sera construit par Cochin Shipyard Limited pour la marine indienne. Il devrait être le deuxième porte-avions construit en Inde après l'INS Vikrant (IAC-1). La conception proposée pour la deuxième classe de transporteurs sera une nouvelle conception, comportant des changements importants par rapport au Vikrant, notamment une augmentation du déplacement. Un système CATOBAR de système de lancement électromagnétique d'avion (EMALS) est également à l'étude. Son nom Vishal signifie « géant » en sanskrit."
 
 # Боевые корабли #
 
 RAJ_battle_hull_light_0:0 "Classe Léandre"
 RAJ_battle_hull_light_0_short:0 "Classe Léandre"
 RAJ_battle_hull_light_0_desc:0 "Elle a été vendue à la marine indienne en 1948 et remise en service sous le nom d'INS Delhi. Elle a été démolie en 1978."
 
 RAJ_battle_hull_light_1:0 "Classe Fidji"
 RAJ_battle_hull_light_1_short:0 "Classe Fidji"
 RAJ_battle_hull_light_1_desc:0 "L'INS Mysore est un croiseur léger de construction britannique (classe Fidji). Il a été transféré de la marine britannique en 1957. Après avoir servi 28 ans, le croiseur a été mis hors service en 1985."
 
 RAJ_battle_hull_light_2:0 "Classe Rajput"
 RAJ_battle_hull_light_2_short:0 "Classe Rajput"
 RAJ_battle_hull_light_2_desc:0 "Les destroyers lance-missiles de classe Rajput construits pour la marine indienne sont des versions modifiées des destroyers soviétiques de classe Kashin. Ils sont également connus sous le nom de classe Kashin-II. Les navires ont été construits dans l'ex-Union soviétique après des modifications considérables de la conception indienne du modèle Kashin. Celles-ci comprenaient le remplacement de la plate-forme d'hélicoptère dans la conception originale par un élévateur de vol, ainsi que des modifications majeures apportées à l'électronique et aux systèmes de combat. Cinq unités ont été construites pour être exportées vers l'Inde dans les années 1980. Toutes les unités sont actuellement rattachées au Commandement naval de l'Est."
 
 RAJ_battle_hull_light_3:0 "Classe Delhi"
 RAJ_battle_hull_light_3_short:0 "Classe Delhi"
 RAJ_battle_hull_light_3_desc:0 "La classe Delhi a été décrite comme une classe Rajput étendue avec certains éléments incorporés aux frégates de classe Godavari et aux destroyers de classe Sovremennyy. L'entonnoir avant est placé à bâbord, tandis que l'entonnoir arrière est placé à tribord. Le système de propulsion se compose de deux turbines à gaz Zorya-Mashproekt M36E entraînant deux hélices à pas variable. Chaque centrale à turbine à gaz comprend deux turbines à gaz réversibles DT-59 reliées à une boîte de vitesses RG-54 dans un système combiné gaz-gaz et est placée dans une salle des machines séparée. Les navires sont équipés pour fonctionner dans un environnement de guerre nucléaire, biologique et chimique. Les navires de la classe Delhi sont équipés d'installations de pavillon, leur permettant d'agir en tant qu'unité de commandement dans des groupes opérationnels. INS Mysore dispose de meilleures installations de climatisation pour corriger les problèmes de dissipation thermique rencontrés lors de la mise en service de INS Delhi."
 
 RAJ_battle_hull_light_4:0 "Classe Calcutta"
 RAJ_battle_hull_light_4_short:0 "Classe Calcutta"
 RAJ_battle_hull_light_4_desc:0 "La « classe Kolkata » (Projet 15A) est une classe de missiles guidés furtifs construits pour la marine indienne. La classe comprend trois navires - Kolkata, Kochi et Chennai, tous construits par Mazagon Dock Limited (MDL) en Inde, et sont les plus grands destroyers exploités par la marine indienne. En raison de retards dans la construction et les essais en mer, la date de mise en service initiale du premier navire de cette classe a été repoussée de 2010 à 2014."
 
 
 
 RAJ_screen_hull_medium_0:0 "Classe Bathurst"
 RAJ_screen_hull_medium_0_short:0 "Classe Bathurst"
 RAJ_screen_hull_medium_0_desc:0 ""
 
 RAJ_screen_hull_medium_1:0 "Classe de fleurs"
 RAJ_screen_hull_medium_1_short:0 "Classe de fleurs"
 RAJ_screen_hull_medium_1_desc:0 ""
 
 RAJ_screen_hull_medium_2:0 "Classe Khukri"
 RAJ_screen_hull_medium_2_short:0 "Classe Khukri"
 RAJ_screen_hull_medium_2_desc:0 "La corvette de classe Khukri est une classe de corvettes destinée à remplacer les corvettes vieillissantes de classe Petya II de la marine indienne. Les deux premiers ont été commandés en décembre 1983 et les autres en 1985. Environ 65 % du navire contient du contenu indigène. Les moteurs diesel ont été assemblés en Inde, sous licence du groupe Kirloskar."
 
 RAJ_screen_hull_medium_3:0 "Classe Kora"
 RAJ_screen_hull_medium_3_short:0 "Classe Kora"
 RAJ_screen_hull_medium_3_desc:0 "Les corvettes de classe Kora sont des corvettes lance-missiles de 1 350 tonnes, en service actif dans la marine indienne. Quatre navires ont été construits chez Garden Reach Shipbuilders and Engineers (GRSE) et équipés chez Mazagon Dock Limited (MDL)."
 
 RAJ_screen_hull_medium_4:0 "Classe Kamorta"
 RAJ_screen_hull_medium_4_short:0 "Classe Kamorta"
 RAJ_screen_hull_medium_4_desc:0 "Les corvettes de classe Kamorta ou Projet 28 sont une classe de corvettes furtives de guerre anti-sous-marine actuellement en service dans la marine indienne. Construites chez Garden Reach Shipbuilders & Engineers (GRSE), Calcutta, ce sont les premières corvettes furtives de guerre anti-sous-marine à être construites en Inde."
 
 
 
 RAJ_screen_hull_heavy_0:0 "Classe rivière"
 RAJ_screen_hull_heavy_0_short:0 "Classe rivière"
 RAJ_screen_hull_heavy_0_desc:0 ""
 
 RAJ_screen_hull_heavy_1:0 "Classe Nilgiri"
 RAJ_screen_hull_heavy_1_short:0 "Classe Nilgiri"
 RAJ_screen_hull_heavy_1_desc:0 ""
 
 RAJ_screen_hull_heavy_2:0 "Classe Brahmapoutre"
 RAJ_screen_hull_heavy_2_short:0 "Classe Brahmapoutre"
 RAJ_screen_hull_heavy_2_desc:0 "Les frégates de classe Brahmapoutre (Type 16A ou Projet 16A) sont des frégates lance-missiles de la marine indienne, conçues et construites en Inde. Il s'agit d'une amélioration de la classe Godavari, avec un déplacement de 3 850 tonnes et une longueur de 126 mètres (413 pieds). Bien que de coque et de dimension similaires, à l'intérieur, les classes Brahmapoutre et Godavari ont des configurations, des armements et des capacités différentes. 3 navires de cette classe servent dans la marine indienne."
 
 RAJ_screen_hull_heavy_3:0 "Classe Talwar"
 RAJ_screen_hull_heavy_3_short:0 "Classe Talwar"
 RAJ_screen_hull_heavy_3_desc:0 "Les frégates de classe Talwar ou Projet 11356 sont une classe de frégates furtives à missiles guidés conçues et construites par la Russie pour la marine indienne. Les frégates lance-missiles de classe Talwar sont des versions améliorées des frégates de classe Krivak III (projet 1135) utilisées par les garde-côtes russes. La conception a été développée plus avant en tant que frégate de classe Amiral Grigorovich pour la marine russe. Six navires ont été construits en deux lots entre 1999 et 2013. Conçus par Severnoye Design Bureau, le premier lot de navires a été construit par Baltic Shipyard et le deuxième lot par Yantar Shipyard. Précédées par les frégates de la classe Brahmapoutre, les frégates de la classe Talwar seraient dotées de caractéristiques semi-furtives et d'un meilleur armement. La marine indienne possède actuellement six de ces navires et 4 autres sont en construction dont 2 dans un chantier indien, pour lequel le chantier naval de Goa a été retenu."
 
 RAJ_screen_hull_heavy_4:0 "Classe Shivalik"
 RAJ_screen_hull_heavy_4_short:0 "Classe Shivalik"
 RAJ_screen_hull_heavy_4_desc:0 "La classe Shivalik ou classe Projet 17 est une classe de frégates furtives polyvalentes en service dans la marine indienne. Ce sont les premiers navires de guerre furtifs construits en Inde. Elles ont été conçues pour avoir de meilleures caractéristiques furtives et de meilleures capacités d'attaque terrestre que les frégates précédentes de classe Talwar. Au total, trois navires ont été construits entre 2000 et 2010, et tous trois étaient en service en 2012. La classe Shivalik, ainsi que les sept frégates du projet 17A en cours de développement, devraient devenir les principales frégates de la marine indienne dans la première moitié du 21e siècle. Tous les navires de cette classe ont été construits par Mazagon Dock Limited. La classe et le navire de tête portent le nom des collines de Shivalik. Les navires suivants de la classe portent également le nom des chaînes de collines de l'Inde."
 