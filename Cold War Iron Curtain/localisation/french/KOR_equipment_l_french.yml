 KOR_infantry_equipment_0:0 "Fusil américain, calibre.30, M1"
 KOR_infantry_equipment_0_short:0 "M1 Garand"
 KOR_infantry_equipment_0_desc:0 "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 KOR_infantry_equipment_1:0 "Carabine américaine, calibre.30, M2"
 KOR_infantry_equipment_1_short:0 "Carabine M2"
 KOR_infantry_equipment_1_desc:0 "La carabine M2 est une variante améliorée à tir sélectif de la carabine M1, chambrée pour la cartouche.30 Carbine. Introduit pendant la Seconde Guerre mondiale, il propose des modes de tir semi-automatiques et entièrement automatiques, ce qui le rend plus polyvalent dans les situations de combat. Les forces armées de la République de Corée ont largement adopté la carabine M2 pour ses soldats pendant la guerre de Corée, où sa conception légère et ses capacités entièrement automatiques se sont révélées efficaces pour les combats rapprochés en terrain accidenté. Il est resté en service après la guerre, aidant les troupes de la République de Corée dans les opérations de patrouille et de contre-insurrection."

 KOR_infantry_equipment_2:0 "Fusil, calibre 5,56 mm, KM16A1"
 KOR_infantry_equipment_2_short:0 "KM16A1"
 KOR_infantry_equipment_2_desc:0 "Les responsables militaires américains ont noté que la carabine M2 était largement surclassée par l'AK47 et le StG44 allemand et, en 1956, le développement du M16 a commencé. En 1959, l'arme fut achevée par Eugene Stoner et James Sullivan. Il affichait des capacités exceptionnelles et surclassait l'AK47 et l'AKM. Plus particulièrement, l'arme a beaucoup plus de puissance de feu que la carabine M2 et était plus précise que l'AK47 et transportait des munitions plus légères avec une perte de compétence minimale. Cependant, bien qu'il ait surclassé l'AK47 dans les tests généraux, il présentait une faible fiabilité qui pouvait l'empêcher d'être considéré comme son égal. Surtout au Vietnam, où les échecs étaient très fréquents. Le KM16A1 est la version sous licence en Corée."

 KOR_infantry_equipment_3:0 "Fusil, calibre 5,56 mm, crosse pliable, K-2"
 KOR_infantry_equipment_3_short:0 "K-2"
 KOR_infantry_equipment_3_desc:0 "Le fusil d'assaut de la série Daewoo K2 est le fusil d'assaut standard de l'armée sud-coréenne. L'arme partage certaines similitudes extérieures et intérieures avec le M16 américain et inclut également les fonctions de la Kalachnikov soviétique AK-47.\nLe K2 arbore des lignes épurées typiques des produits Daewoo et ressemble aux fusils automatiques américains AR-18/Colt M16. Essentiellement, le K2 est de nature M16 mais avec le système de gaz éprouvé du fusil d'assaut Kalachnikov AK-47. En tant que telle, la conception coréenne supprime le système d'impact direct et l'encrassement gazeux inhérents à la gamme M16 basée sur Stoner. Le K2 utilise des chargeurs incurvés M16 STANAG standard et tire la cartouche OTAN de 5,56 x 45 mm à partir d'un chargeur de 20 ou 30 cartouches."

 KOR_infantry_equipment_4:0 "Fusil, calibre 5,56 mm, crosse réglable, K-2A1"
 KOR_infantry_equipment_4_short:0 "K-2A1"
 KOR_infantry_equipment_4_desc:0 "En 1996, considérant que la taille et le poids moyens des jeunes qui ont atteint l'âge de la conscription ont considérablement changé par rapport à il y a 12 ans, lorsqu'ils ont adopté les fusils, le ministère de la Défense nationale améliorera le confort des soldats dans diverses conditions physiques en ajoutant une fonction permettant d'ajuster la longueur en cinq étapes en plus de la tête de lit pliable pour faciliter le déplacement et le rangement. De plus, la méthode de fixation du support de l'équipement optique avec deux vis sur le corps supérieur du pistolet a été améliorée pour appliquer un rail Pikatini de 20 millimètres afin d'obtenir un fonctionnement plus stable de l'équipement optique. Le K2A1 doit son nom à l'amélioration du K2A."
 
 KOR_iw_armored_vehicles:0 "Armée de la République de Corée"
 KOR_iw_armored_vehicles_short:0 "ROKA"
 KOR_iw_armored_vehicles_desc:0 "Loi sur l'organisation des forces armées\nArticle 2 (Organisation des forces armées)\n1. Les forces armées seront organisées en armée, marine et force aérienne (ci-après dénommées « chaque armée ») et disposeront d'un corps de marine au sein de la marine.\nArticle 3 (Fonctions du chef de chaque comté, etc.)\n2. La mission principale de l'armée est celle des opérations terrestres. Elle est organisée, équipée et dispense l'éducation et la formation nécessaires."
 
