 KOR_mechanized_equipment_9_short:0 "K-200A1"
 KOR_mechanized_equipment_10:0 "Transporteur, personnel, usage amphibie, à roues, 6X6, blindé, K-808"
 KOR_mechanized_equipment_10_short:0 "K-808"

 KOR_mechanized_heavy_equipment_1:0 "Transporteur, personnel, à roues, 6X6, blindé, M8"
 KOR_mechanized_heavy_equipment_1_short:0 "Lévrier M8"
 KOR_mechanized_heavy_equipment_2:0 "Transporteur, personnel, entièrement chenillé, blindé, M75"
 KOR_mechanized_heavy_equipment_2_short:0 "Transport de troupes blindé M75"
 KOR_mechanized_heavy_equipment_2_desc:0 "Le M75 est un APC lourd développé par l'International Harvester Corporation au début des années 1950. Le M75 a été largement utilisé pendant la guerre de Corée, mais a ensuite été abandonné très rapidement. Le M75 est équipé d'un moteur à essence 6 cylindres AO-895-4 et d'une suspension à barre de torsion. Il peut se déplacer à 43 mph avec une autonomie de 115 miles. Après que le projet M44 ait été annulé en raison de sa taille excessive, le développement d'un autre PC lourd entièrement fermé a commencé. Le projet M75 a abouti à un châssis beaucoup plus petit, bien plus rapide que le M44. Cependant, il était toujours considéré comme trop important et le projet M95 a continué à bénéficier de financements"
 KOR_mechanized_heavy_equipment_3:0 "Transporteur, personnel, entièrement chenillé, blindé, KM113 ACAV"
 KOR_mechanized_heavy_equipment_3_short:0 "KM113 ACAV"
 KOR_mechanized_heavy_equipment_3_desc:0 "Le KM113 ACAV, également connu sous le nom de M150, est un véhicule blindé d'assaut de cavalerie, qui est une des premières formes de l'IFV. Le KM113 ACAV a été développé dans les années 60 par la Food Machinery Corporation. Le KM113 ACAV est similaire au KM113 dans la plupart des aspects. La variante ACAV du KM113 embarque un lanceur TOW et peut potentiellement être équipée d'une tourelle armée d'un lance-flammes comme on le voit au Vietnam. Le KM113 ACAV a été utilisé partout où le KM113 était utilisé."
 KOR_mechanized_heavy_equipment_4:0 "Transporteur, personnel, entièrement chenillé, blindé, KM113A1 ACAV"
