 KOR_lt_equipment_1:0 "Char léger, entièrement chenillé, canon de 37 mm M5"
 KOR_lt_equipment_1_short:0 "M5 Stuart"
 KOR_lt_equipment_1_desc:0 "Le M5 Stuart est un petit char développé par le Département des munitions de l'armée américaine en 1941 pour servir de char léger. Il est doté d'un blindage fin de 63,5 mm et d'un canon principal de 37 mm avec 3 armements secondaires Browning de 7,62 mm. Il utilise un double moteur Cadillac V8 qui peut atteindre des vitesses allant jusqu'à 36 mph en tout-terrain et a une autonomie opérationnelle de 100 miles. Il a été largement prêté et loué tout au long de la Seconde Guerre mondiale, même lorsque les États-Unis sont entrés en guerre. "
 KOR_lt_equipment_2:0 "Char léger, entièrement chenillé, canon de 75 mm M24"
 KOR_lt_equipment_2_short:0 "M24 Chaffee"
 KOR_lt_equipment_2_desc:0 "Le M24 Chaffee est un char léger développé par le Département des munitions de l'armée américaine en 1944, vers la fin de la Seconde Guerre mondiale, le Boogaloo électrique. Le M24 possède un blindage de 38 mm et un canon principal de 75 mm. Le moteur est un V8 Twin Cadillac avec une transmission Hydramatic qui peut se déplacer à peu près de la même manière que le M5 Stuart. Au combat, le petit canon du M5 Stuart s'est avéré être une lacune importante, notamment lors de la campagne d'Afrique du Nord. C'est peu de temps après que le M24 Chaffee fut développé dans le but de lui donner plus de puissance de feu pour mieux remplir son rôle."
 KOR_lt_equipment_3:0 "Char de combat, entièrement chenillé, canon de 76 mm, M41"
 KOR_lt_equipment_3_short:0 "M41 Walker Bouledogue"
 KOR_lt_equipment_3_desc:0 "Le M41 est un char de reconnaissance léger développé par Cadillac en 1949. Il a combattu au Vietnam, dans la Baie des Cochons, au Liban et en Somalie. Son blindage varie de 19 mm à 31,7 mm. Il est armé d'un canon principal de 76 mm, d'une mitrailleuse coaxiale de calibre.30 et d'un canon de toit de calibre.50. Il utilise un moteur essence Continental 6 cylindres et fonctionne jusqu'à 45 mph avec une autonomie opérationnelle de 100 miles. Le développement du M41 progressait lentement avec peu de financement, mais lorsque la guerre de Corée a éclaté, l'armée américaine a commencé à précipiter le programme. La précipitation a causé un grand nombre de problèmes dans le programme et des problèmes de taille excessive. Le M41, en raison de graves problèmes liés à la précipitation du programme, a été produit pendant très peu de temps et n'a pas été utilisé pendant la guerre de Corée. En fait, la production n'a démarré qu'en 1951 et n'a duré que 3 ans."
