l_french:
 USA_HIST90.1.t:0 "La loi sur les Américains handicapés de 1990"
 USA_HIST90.1.d:0 "Dans le cadre d'une réalisation bipartite historique pour les droits civiques, le Congrès a adopté l'Americans with Disabilities Act. Inspirée de la loi sur les droits civils de 1964 et de l'article 504 de la loi sur la réadaptation, la législation interdit la discrimination à l'égard des personnes handicapées dans les domaines de l'emploi, des lieux publics, des transports et des télécommunications. Les partisans saluent cette mesure comme une étape morale profonde qui ouvre la société américaine à des millions de citoyens, tandis que les sceptiques commerciaux mettent en garde contre les coûts des adaptations structurelles obligatoires."
 USA_HIST90.1.a:0 "Signez la loi historique sur les droits civiques."
 USA_HIST90.1.b:0 "Exigez un allègement réglementaire pour les petites entreprises."

 USA_HIST90.2.t:0 "Les audiences de confirmation de Clarence Thomas"
 USA_HIST90.2.d:0 "La nomination du juge d'appel fédéral Clarence Thomas pour succéder à Thurgood Marshall à la Cour suprême a déclenché une controverse nationale sans précédent. Les audiences télévisées du Comité judiciaire du Sénat ont été captivées par le témoignage d'Anita Hill, professeur de droit à l'Université d'Oklahoma, qui a allégué un grave harcèlement sexuel sur le lieu de travail pendant son séjour à l'EEOC. Les procédures ont déclenché des débats enflammés à l'échelle nationale sur le harcèlement au travail, les qualifications judiciaires, le sexe et le pouvoir institutionnel."
 USA_HIST90.2.a:0 "Tenez-vous fermement derrière le candidat."
 USA_HIST90.2.b:0 "Retirez la candidature pour éviter une polarisation plus profonde."

 USA_HIST90.3.t:0 "Les émeutes de Los Angeles"
 USA_HIST90.3.d:0 "Suite à l'acquittement de quatre agents de la police de Los Angeles suite au passage à tabac enregistré sur Rodney King, des troubles civils généralisés ont éclaté dans le centre-sud de Los Angeles. En six jours de pillages, d'incendies criminels et de violences, des dizaines de personnes ont perdu la vie et des milliers d'entreprises ont incendié. Le gouverneur de Californie, Pete Wilson, a demandé une intervention fédérale, provoquant le déploiement de la Garde nationale de Californie, du personnel militaire fédéralisé et des équipes tactiques fédérales pour rétablir l'ordre."
 USA_HIST90.3.a:0 "Déployez les forces fédérales et faites respecter le couvre-feu."
 USA_HIST90.3.b:0 "Concentrez-vous sur la réconciliation communautaire et les secours d'urgence."

 USA_HIST90.4.t:0 "Ratification du 27e amendement"
 USA_HIST90.4.d:0 "Dans un triomphe extraordinaire de la persévérance constitutionnelle, le 27e amendement à la Constitution des États-Unis a été officiellement ratifié par les trois quarts requis des États, 202 ans après avoir été soumis pour la première fois aux États par James Madison en 1789. L'amendement stipule qu'aucune loi modifiant la rémunération des sénateurs et des représentants ne peut entrer en vigueur avant qu'une élection des représentants ne soit intervenue."
 USA_HIST90.4.a:0 "Une victoire longtemps retardée pour la responsabilité constitutionnelle."

 USA_HIST90.5.t:0 "Le compromis « ne demandez pas, ne dites rien »"
 USA_HIST90.5.d:0 "L'engagement du gouvernement de lever l'interdiction du service militaire pour les gays et les lesbiennes s'est heurté à une résistance farouche de la part des chefs d'état-major interarmées, des comités de défense du Congrès et des groupes sociaux-conservateurs. En réponse, le secrétaire à la Défense Les Aspin a formulé la directive 1304.26 du ministère de la Défense, familièrement intitulée « Ne demandez pas, ne dites pas ». En vertu de ce compromis, les militaires ne seront pas interrogés sur leur orientation sexuelle, mais la conduite homosexuelle reste un motif de licenciement."
 USA_HIST90.5.a:0 "Acceptez le compromis « Ne demandez pas, ne dites rien »."
 USA_HIST90.5.b:0 "Favoriser une intégration inconditionnelle et immédiate."
 USA_HIST90.5.c:0 "Maintenir l'interdiction traditionnelle et pure et simple."

 USA_HIST90.6.t:0 "Le siège de Waco"
 USA_HIST90.6.d:0 "Une confrontation de 51 jours entre les forces de l'ordre fédérales et la secte religieuse Branch Davidian dans l'enceinte du Mont Carmel près de Waco, au Texas, s'est terminée par une tragédie. Initié après un raid meurtrier de l'ATF pour exécuter des mandats d'armement, le siège s'est terminé lorsque les équipes tactiques du FBI ont introduit des gaz lacrymogènes CS dans l'enceinte, suivi peu après par un incendie catastrophique qui a consumé les bâtiments en bois. Soixante-seize membres de la secte, dont le chef David Koresh, ont péri dans l'incendie, alimentant une violente colère antigouvernementale à travers le pays."
 USA_HIST90.6.a:0 "Défendre la conduite légale des forces de l'ordre fédérales."
 USA_HIST90.6.b:0 "Convoquer une commission d'enquête indépendante du Congrès."

 USA_HIST90.7.t:0 "La bataille de Mogadiscio"
 USA_HIST90.7.d:0 "L'opération Gothic Serpent, une mission d'élite de la Task Force Ranger visant à capturer les lieutenants du chef de guerre somalien Mohamed Farrah Aidid à Mogadiscio, est devenue l'engagement de combat rapproché le plus meurtrier pour les forces américaines depuis le Vietnam. Après que deux hélicoptères MH-60 Black Hawk aient été abattus par des tirs de RPG, les rangers américains et les opérateurs du delta se sont battus toute la nuit, entourés de milliers de miliciens. Dix-huit soldats américains sont morts et des dizaines ont été blessés, déclenchant des appels au retrait immédiat d'Afrique de l'Est."
 USA_HIST90.7.a:0 "Annoncer un retrait progressif des troupes terrestres américaines."
 USA_HIST90.7.b:0 "Renforcez la Task Force et écrasez la milice d'Aidid."

 USA_HIST90.8.t:0 "La révolution républicaine de 1994"
 USA_HIST90.8.d:0 "Surfant sur une vague de mécontentement des électeurs à l'égard du premier programme démocrate et faisant campagne sur le « Contrat avec l'Amérique » en dix points discipliné de Newt Gingrich, le Parti républicain a remporté un triomphe écrasant à mi-mandat de 1994. Les républicains ont remporté 54 sièges à la Chambre et 8 sièges au Sénat, prenant ainsi le contrôle de la Chambre des représentants pour la première fois en quarante ans. Le paysage politique à Washington a été bouleversé, annonçant une ère de gouvernement combatif et divisé."
 USA_HIST90.8.a:0 "Un gouvernement divisé entre dans une nouvelle ère combative."

 USA_HIST90.9.t:0 "La loi sur le contrôle des crimes violents et l'application de la loi"
 USA_HIST90.9.d:0 "Dans un contexte d'inquiétude accrue du public face à la criminalité urbaine violente, le gouvernement fédéral a promulgué la loi de 1994 sur le contrôle des crimes violents et l'application de la loi. Le projet de loi omnibus autorise des milliards de dollars de financement fédéral pour 100 000 nouveaux agents de police de proximité, étend les peines de mort fédérales, institue des règles de détermination de peine obligatoires de type « trois fautes » et promulgue une interdiction fédérale de 10 ans sur la fabrication et la possession civile d'armes d'assaut semi-automatiques."
 USA_HIST90.9.a:0 "Signez le projet de loi global sur la criminalité et les armes d'assaut."
 USA_HIST90.9.b:0 "Abandonner l'interdiction des armes d'assaut pour forger un consensus plus large."

 USA_HIST90.10.t:0 "L'attentat à la bombe d'Oklahoma City"
 USA_HIST90.10.d:0 "À 9 h 02, un camion piégé au nitrate d'ammonium a explosé devant le bâtiment fédéral Alfred P. Murrah, au centre-ville d'Oklahoma City, détruisant plus d'un tiers du complexe de neuf étages. L'explosion a coûté la vie à 168 personnes, dont 19 jeunes enfants dans une garderie sur place, et a blessé plus de 680 autres. Les enquêteurs fédéraux ont rapidement arrêté l'extrémiste antigouvernemental Timothy McVeigh, liant l'attaque à l'idéologie des milices nationales et à la vengeance du siège de Waco."
 USA_HIST90.10.a:0 "Voeu de justice contre l'extrémisme national."
 USA_HIST90.10.b:0 "Unissez la nation et étendez les pouvoirs antiterroristes fédéraux."

 USA_HIST90.11.t:0 "Les accords de paix de Dayton"
 USA_HIST90.11.d:0 "Après des semaines de négociations éprouvantes sous la médiation du diplomate américain Richard Holbrooke à la base aérienne Wright-Patterson dans l'Ohio, les dirigeants de la Bosnie, de la Croatie et de la Serbie ont paraphé l'accord de paix de Dayton. Le traité met fin à plus de trois années d'horribles effusions de sang, de nettoyage ethnique et de guerre de siège en Bosnie-Herzégovine. Les États-Unis ont promis d'envoyer environ 20 000 soldats à la Force de mise en oeuvre de l'OTAN (IFOR) pour superviser la séparation des belligérants."
 USA_HIST90.11.a:0 "Déployez des troupes américaines pour faire respecter les accords de Dayton."
 USA_HIST90.11.b:0 "Soutenez les alliés européens sans déployer de forces terrestres."

 USA_HIST90.12.t:0 "La loi sur les télécommunications de 1996"
 USA_HIST90.12.d:0 "Dans le cadre de la première refonte radicale de la loi américaine sur les communications depuis 1934, le Congrès a approuvé la loi sur les télécommunications de 1996. La loi déréglemente les marchés des télécommunications, permettant aux câblodistributeurs, aux opérateurs longue distance et aux monopoles téléphoniques locaux de se concurrencer mutuellement. Il établit également l'article 230 pour protéger les plates-formes Internet en pleine croissance de toute responsabilité en cas de discours de tiers, jetant ainsi les bases réglementaires de la croissance explosive du World Wide Web."
 USA_HIST90.12.a:0 "Déréglementer les télécommunications et les autoroutes numériques."

 USA_HIST90.13.t:0 "Réforme de la protection sociale : PRWORA"
 USA_HIST90.13.d:0 "Conformément à son engagement de « mettre fin à l'aide sociale telle que nous la connaissons », le gouvernement fédéral a promulgué la loi de 1996 sur la réconciliation des responsabilités personnelles et des opportunités de travail. La législation démantèle l'aide aux familles avec enfants à charge (AFDC), la remplaçant par des subventions globales d'assistance temporaire aux familles nécessiteuses (TANF) aux États. La loi introduit des exigences strictes en matière de travail et un plafond d'assistance à vie de cinq ans, suscitant un débat acharné sur les filets de sécurité sociale."
 USA_HIST90.13.a:0 "Signez le projet de loi bipartite sur la réforme de la protection sociale."
 USA_HIST90.13.b:0 "Mettez votre veto au projet de loi visant à défendre le filet de sécurité fédéral."

 USA_HIST90.14.t:0 "La loi sur la défense du mariage"
 USA_HIST90.14.d:0 "Poussé par des poursuites judiciaires à Hawaï qui pourraient aboutir à la reconnaissance par l'État des unions homosexuelles, le Congrès a adopté la loi sur la défense du mariage (DOMA) à la majorité bipartite sans droit de veto. Le projet de loi définit le mariage aux fins fédérales comme exclusivement entre un homme et une femme et prévoit qu'aucun État n'est obligé de reconnaître une relation entre personnes du même sexe qui est traitée comme un mariage dans un autre État."
 USA_HIST90.14.a:0 "Signez la loi pour éviter une confrontation constitutionnelle."
 USA_HIST90.14.b:0 "Veto sur la mesure pour des raisons d'égalité des droits."

 USA_HIST90.15.t:0 "L'accord du Vendredi Saint"
 USA_HIST90.15.d:0 "Dans le cadre d'une avancée capitale à Belfast, les dirigeants politiques britanniques et irlandais ont signé l'Accord du Vendredi Saint, mettant fin à trois décennies de violence sectaire connue sous le nom de « Troubles ». Présidé par l'ancien sénateur américain George Mitchell et soutenu par une diplomatie intense de la Maison Blanche, l'accord établit des institutions de partage du pouvoir en Irlande du Nord et une coopération transfrontalière, annonçant une ère de paix."
 USA_HIST90.15.a:0 "Un triomphe historique pour la diplomatie transatlantique."

 USA_HIST90.16.t:0 "Opération Renard du Désert"
 USA_HIST90.16.d:0 "En réponse au refus persistant de l'Irak de coopérer avec les inspecteurs en désarmement de la Commission spéciale des Nations Unies (UNSCOM) et au blocage de sites suspectés de produits chimiques et biologiques, les forces aériennes et navales américaines et britanniques ont exécuté l'opération Desert Fox. Pendant quatre jours, des avions alliés et des missiles de croisière Tomahawk ont frappé plus de 100 cibles militaires et de sécurité à travers l'Irak, dégradant gravement les structures de commandement et les réseaux de défense aérienne de Saddam Hussein."
 USA_HIST90.16.a:0 "Exécutez des frappes de précision contre les installations de Saddam."
 USA_HIST90.16.b:0 "Comptez uniquement sur la pression diplomatique multilatérale."

 USA_HIST90.17.t:0 "Opération Allied Force : la campagne du Kosovo"
 USA_HIST90.17.d:0 "Face à l'escalade des atrocités et au nettoyage ethnique commis contre les Albanais du Kosovo par les forces militaires et paramilitaires yougoslaves, l'OTAN a lancé l'opération Allied Force, une vaste campagne de bombardements aériens contre la République fédérale de Yougoslavie. Commencée sans autorisation explicite du Conseil de sécurité de l'ONU en raison de l'opposition russe, l'intervention marque une évolution historique dans la doctrine de l'OTAN, affirmant l'application de l'action humanitaire au-delà des frontières de l'alliance."
 USA_HIST90.17.a:0 "Engager la puissance aérienne américaine dans l'intervention de l'OTAN."
 USA_HIST90.17.b:0 "Restreindre la participation américaine aux rôles logistiques et humanitaires."

 USA_HIST90.18.t:0 "La tragédie du lycée Columbine"
 USA_HIST90.18.d:0 "La nation a été profondément secouée par le massacre du lycée Columbine à Littleton, dans le Colorado. Deux étudiants lourdement armés ont assassiné douze camarades de classe et un enseignant, en blessant plus de vingt autres, avant de se suicider. Cette horrible tragédie a déclenché une prise de conscience nationale concernant la sécurité scolaire, l'intimidation, les sous-cultures des adolescents, la santé mentale et l'accès aux armes à feu."
 USA_HIST90.18.a:0 "Menez un deuil national et faites pression pour une sécurité plus stricte des armes à feu."
 USA_HIST90.18.b:0 "Fournir des subventions fédérales pour la sécurité physique des écoles."

 USA_HIST90.19.t:0 "La « bataille de Seattle » : protestations contre l'OMC"
 USA_HIST90.19.d:0 "Plus de 40 000 manifestants représentant des syndicats, des organisations environnementales, des groupes d'étudiants et des militants anti-entreprises ont convergé vers Seattle pour protester contre la conférence ministérielle de l'Organisation mondiale du commerce. Les blocages d'action directe ont forcé l'annulation des cérémonies d'ouverture, suivis de violents affrontements avec la police, de l'utilisation de gaz lacrymogènes, du pillage des vitrines d'entreprises et de la déclaration d'un état d'urgence civile par le maire."
 USA_HIST90.19.a:0 "Déclarez une urgence et dégagez le centre-ville."
 USA_HIST90.19.b:0 "Engager les dirigeants de la société civile à répondre aux griefs économiques."

 USA_HIST90.20.t:0 "La transition du millénaire vers l'an 2000"
 USA_HIST90.20.d:0 "Alors que les horloges sonnaient minuit partout dans le monde, l'effondrement catastrophique des ordinateurs, connu sous le nom de problème de l'an 2000, ne s'est pas concrétisé. Des années de remédiation logicielle intensive, de mises à niveau matérielles et des centaines de milliards de dollars d'investissements publics et privés mondiaux ont permis de garantir que les infrastructures critiques, les réseaux électriques, les systèmes financiers et le contrôle du trafic aérien entrent dans le nouveau siècle sans interruption majeure."
 USA_HIST90.20.a:0 "Accueillez le 21ème siècle en toute confiance !"
