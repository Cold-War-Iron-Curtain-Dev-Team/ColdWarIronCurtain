 #Flag event
 KPA_flag.1.d: "L'opinion actuelle selon laquelle le drapeau national de la Corée n'a aucune légitimité et est d'un niveau qui commémore la dictature de Kim Il Sung, disparue. Nous avons donc décidé de changer le drapeau national. Bientôt, les propositions de divers drapeaux, dirigées par de nombreux Taegeukgi, affluèrent, et il était temps de prendre une décision."
 KPA_flag.2.d: ""
 KPA_flag.3.d: "Ce drapeau est le drapeau national coréen officiellement produit et inclus par le ministère de l'Intérieur, des Communications et du Commerce en 1884. Il date de l'époque de l'Empire coréen et constitue l'une des variantes les plus anciennes du Taegeukgi."
 KPA_flag.4.d: "Ce drapeau a été suggéré en 1888, il a la couleur bleue la plus claire. Ce drapeau est toujours ce qu'il était avant qu'un accord détaillé ne soit trouvé dans les secteurs public et privé, tout le monde."
 KPA_flag.5.d: "Ce drapeau est suggéré en 1893, il a un aspect moderne et la couleur revient au bleu foncé de 1884."
 KPA_flag.6.d: "Ce drapeau est suggéré en 1899, ce drapeau a un aspect plus carré et son motif Taegeuk est à l'envers."
 KPA_flag.7.d: "Ce drapeau est le drapeau le plus ancien. Il vient du Grand Royaume de Joseon, son origine est le drapeau de la dynastie Joseon. L'adoption du drapeau a été controversée même au sein de la conférence. Mais il a été adopté dans la mesure où il doit être le plus ancien, avoir une légitimité historique et surtout être celui qui ressemble le moins au drapeau sud-coréen."
 KPA_flag.8.d: "Ce drapeau provient du gouvernement provisoire coréen. Ce drapeau était controversé car il était reconnu par le gouvernement provisoire de la République de Corée et la généalogie avec le gouvernement coréen a dû être redéfinie. Cependant, la légitimité auprès du gouvernement provisoire coréen a finalement été affinée et adoptée."
 KPA_flag.9.d: "Le drapeau a été suggéré par Lee Eung-jun. Il a ensuite été utilisé ici et là, puis finalement adopté en reconnaissance de sa légitimité."
 KPA_flag.10.d: "Ce drapeau a été utilisé en République populaire de Corée, qui s'est réunie avec Lyuh Woon-hyung au premier plan. En fait, ce drapeau était le motif du Parti des travailleurs nord-coréens, et il a été adopté pour réduire la similitude avec le drapeau sud-coréen en même temps que le maintien du Dr Lyuh Woon-hyung, rejeter l'ancien système et représenter le socialisme."
 KPA_flag.11.d: "Ce drapeau est le drapeau du Comité populaire de Corée du Nord. À l'origine, c'était le drapeau national de la Corée avant son changement par Kim Il Sung en 1948, et il représente une véritable légitimité après la création de notre nation. Il y a eu une controverse sur sa similitude avec le drapeau sud-coréen parmi les candidats, mais la controverse s'est rapidement estompée car il a finalement été utilisé pour la période la plus proche."
 
 KPA_cho_mansik.1: "Kim Sam-ryong et Lee Joo-ha ont été capturés. Comme c'était inattendu, nous avons dû faire quelque chose face à cette situation."
 KPA_cho_mansik.2: "Ils nous proposent le Cho Man-sik, le nationaliste populaire et homme politique de droite, en termes de retour de Kim Sam-ryong et de Lee Joo-ha."
 KPA_cho_mansik.yes: "Cela nous sera bénéfique lorsque nous dirigerons la région du Nord à l'avenir !"

 ##KPA SOV###
 KPA_SOV.1.t: "Approbation de l'Union soviétique"
 KPA_SOV.1.d: "Lors d'un rare petit-déjeuner diplomatique au coeur de la capitale enneigée de l'Agartha, Yakub et le roi de l'Agartha se sont rencontrés pour aborder ce que les habitants appellent le « problème des ovnis du matin ».\n\nSelon des initiés du palais, les pilotes d'OVNIS ont effectué des survols à basse altitude juste pendant la période des céréales, provoquant le tremblement des fenêtres, la panique des mammouths et le renversement des soldats agarthiens de leur café aux cristaux fumant.\n\nYakub aurait ouvert la réunion en montrant la fenêtre et en disant :\n\n\"Frère, c'est le troisième survol cette semaine. Je ne peux pas méditer comme ça.\"\n\nLe roi de l'Agarthan était d'accord, expliquant que les pilotes d'OVNI « dérivent pour le plaisir » depuis qu'ils ont découvert l'effet d'écho des pyramides de cristal.\n\nPour apaiser la tension, les deux dirigeants ont ouvert un monstre blanc commun, qu'ils ont décrit comme un « élixir sacré du monde de la surface ». Des témoins disent qu'ils ont bu des gorgées alternées tout en planifiant de nouvelles règles de l'espace aérien interdisant les acrobaties d'OVNIS avant 10 heures du matin.\n\nLa réunion s'est terminée avec succès, Yakub annonçant :\n\n\"La paix est assurée. Les mammouths n'auront plus peur au petit-déjeuner.\""
 KPA_SOV.1.a: "La révolution sera totale !"