l_french:
 cubamc.1.d:0 "La Maison Blanche a ordonné au Pentagone de commencer à déployer des escadrons de missiles nucléaires Jupiter en Italie et en Turquie. Le déploiement en Italie protégera contre l'agression communiste du bloc soviétique. Les missiles déployés en Turquie défendront le flanc sud de l'OTAN contre une agression soviétique écrasante. Les gouvernements italiens et turcs ont accepté le déploiement à la suite de réunions individuelles avec des responsables américains. Les missiles Jupiter sont des missiles balistiques à moyenne portée et leur déploiement suscite une grande inquiétude de la part de l'Union soviétique. Moscou estime que ces missiles constituent une arme de première frappe et sont positionnés très près du territoire soviétique afin de réduire leur temps de réponse potentiel en cas de guerre. Pour le gouvernement américain, ce déploiement vise à soutenir ses alliés de l'OTAN qui vivent dans la peur constante d'une potentielle agression soviétique."
 cubamc.2.d:0 "Le déploiement de missiles nucléaires américains Jupiter en Turquie et en Italie constitue une menace directe pour la stabilité et la défense du peuple soviétique. De hauts responsables militaires et le Premier ministre Nikita Khrouchtchev ont élaboré les grandes lignes d'un plan visant à déployer secrètement des missiles soviétiques à Cuba, appelé Opération Anadyr. Cela rétablirait l'équilibre stratégique et inciterait les Américains à réfléchir à deux fois avant d'entourer notre pays de telles armes à l'avenir. Pour préparer le terrain, nous devons obtenir la coopération de Cuba et de son dirigeant, le président Fidel Castro. Le chef de notre Force de missiles stratégiques, le maréchal Sergueï Biryuzov, est envoyé à La Havane pour demander le soutien de Cuba."
 cubamc.3.d:0 "Le maréchal Sergueï Biryuzov a eu un premier entretien avec le président cubain Fidel Castro. Il a décrit le déploiement secret prévu de nos forces sur l'île et a exhorté sa coopération. Castro s'est parfois montré enthousiaste face à cette proposition, affirmant qu'elle punirait les Américains pour leur agression envers le peuple cubain. Cependant, il a exprimé sa crainte qu'accepter le déploiement de telles armes ne le fasse passer pour un client soviétique et ne nuise à la cause de la révolution dans les Amériques. Au lieu d'un déploiement de missiles, Castro a proposé une contre-offre selon laquelle les Soviétiques signent une alliance de défense avec Cuba. Cela garantirait l'indépendance de Cuba contre toute nouvelle agression américaine et les humilierait pour leur échec à réprimer la Révolution cubaine. Nous devons ordonner à Biryuzov d'insister sur le déploiement d'un missile, sinon nous pouvons accepter la contre-offre."
 cubamc.4.d:0 "Nos représentants ont poliment décliné la contre-offre cubaine et nous avons expliqué que les États-Unis étaient déjà conscients des relations étroites entre nos nations. Nous avons ensuite réitéré notre volonté de déployer des missiles stratégiques à Cuba. Un tel résultat non seulement humilierait les Américains, mais les placerait également fermement dans la position dans laquelle ils ont placé le peuple cubain avec ses menaces constantes d'invasion. Après mûre réflexion, nous sommes heureux d'annoncer que le président Fidel Castro a accepté et annoncé que Cuba accueillerait chaleureusement le déploiement soviétique. Une fois l'approbation obtenue, des plans sont déjà en cours pour charger des cargos avec du matériel de construction, des armes et du personnel afin que nous puissions rapidement mettre les missiles en service. Notre premier déploiement prendra probablement un mois."
 cubamc.5.d:0 "Nos représentants ont poliment décliné la contre-offre cubaine et nous avons expliqué que les États-Unis étaient déjà conscients des relations étroites entre nos nations. Nous avons ensuite réitéré notre volonté de déployer des missiles stratégiques à Cuba. Un tel résultat non seulement humilierait les Américains, mais les placerait également fermement dans la position dans laquelle ils ont placé le peuple cubain avec ses menaces constantes d'invasion. Malheureusement, le président Fidel Castro a de nouveau refusé. Il a insisté sur le fait que la meilleure voie à suivre serait la signature d'une alliance défensive. Il a exprimé sa crainte que si le déploiement secret d'armes soviétiques sophistiquées était découvert, les Américains le présenteraient comme un client soviétique. Cela serait catastrophique pour la cause de la révolution dans les Amériques. Il est clair que les Cubains ne nous aideront pas dans l'opération Anadyr. Nous devons décider si nous signons cette alliance, ce qui nuirait à la position des États-Unis dans la région, ou si nous disons simplement aux Cubains que nous y réfléchirons et mettrons fin aux négociations."
 cubamc.6.d:0 "Aujourd'hui à La Havane, de hauts représentants de l'Union soviétique ont signé une alliance défensive avec le gouvernement cubain dirigé par le président Fidel Castro. Le traité garantit que les deux nations se porteront mutuellement à la défense en cas d'agression. L'accord est présenté et considéré comme une réponse directe aux États-Unis. Le président Castro a noté dans son discours que le traité montre à quel point le peuple soviétique se soucie profondément des peuples opprimés du monde, car il a accepté en pleine connaissance des intentions hostiles des Américains. Le gouvernement soviétique a publié sa propre déclaration affirmant qu'il n'abandonnerait jamais le peuple cubain et qu'il continuerait à l'aider sur son chemin révolutionnaire. Aux États-Unis, les journaux ont critiqué la Maison Blanche pour avoir perdu Cuba au profit du bloc communiste et ont fait craindre que les Cubains puissent étendre leurs efforts de déstabilisation à travers la région. Les analystes affirment également que le traité remet directement en cause la chère doctrine Monroe, qui déclare l'hémisphère occidental comme faisant partie de la sphère d'influence américaine."
 cubamc.7.d:0 "Des cargos en provenance de l'Union soviétique transportant des troupes, des ingénieurs, des dirigeants et du matériel de transport lourd ont récemment débarqué à Cuba. En secret, ils ont déjà commencé à moderniser les aérodromes cubains et à préparer les sites de lancement sur lesquels les missiles nucléaires seront chargés. Le personnel choisi pour cette mission compte parmi les meilleurs et les plus fidèles de toute l'Union soviétique. Nous ne nous attendons pas à ce que les Américains découvrent nos activités grâce à des sources de renseignement sur l'île. La base et les équipages de missiles sont gardés par une importante force soviétique et l'armée de l'air déploiera également des avions de combat pour renforcer la défense aérienne des sites."
 cubamc.8.d:0 "La CIA effectuait régulièrement des vols de reconnaissance aérienne au-dessus de Cuba pour déterminer leurs intentions et trouver des preuves de déploiements soviétiques. Cependant, ces vols ont récemment été interrompus en raison du risque d'incidents internationaux et de l'arrivée d'armes anti-aériennes soviétiques sophistiquées pour l'armée cubaine. Un vol de reconnaissance de la Marine a récemment repéré un cargo soviétique qui semblait transporter des caisses de pièces d'avions soviétiques vers Cuba. En outre, les rapports des services de renseignement ont indiqué le déploiement de sites SAM à Cuba sur le modèle de ceux installés pour défendre les sites de missiles nucléaires soviétiques. Forts de ces informations, les vols des avions espions ont repris, sous le contrôle de l'Armée de l'Air. Les photographies ultérieures ont été analysées et les sites de lancement de missiles nucléaires soviétiques ont été identifiés. Le Président a été rapidement informé et il a immédiatement convoqué une réunion du Comité exécutif du Conseil national de sécurité pour formuler une réponse. Pour de nombreux membres du gouvernement, les déploiements nucléaires soviétiques à Cuba équivalaient à placer des armes nucléaires sur le sol américain."
 cubamc.9.d:0 "Le président Kennedy a convoqué le Comité exécutif du Conseil national de sécurité (EXCOM) pour examiner les photographies des armes nucléaires soviétiques à Cuba et décider d'une réponse. Tous les membres ont convenu qu'une décision doit être prise le plus tôt possible. En fin de compte, le président Kennedy avait trois options. Son premier, présenté par les chefs d'état-major interarmées, appelait à ce que des centaines de cibles soient immédiatement touchées par des frappes aériennes, suivies d'une invasion de Cuba. Le président a noté qu'une telle option entraînerait probablement la chute de Berlin aux mains des Soviétiques et affaiblirait l'OTAN. La deuxième option, soutenue par la plupart des membres, serait d'établir un blocus pour empêcher l'arrivée d'armes plus offensives sur l'île. Finalement, il y avait la possibilité de ne pas répondre. Certains membres du comité pensaient que le déploiement soviétique était trop petit pour bouleverser l'équilibre des pouvoirs et qu'en faire un problème pourrait provoquer une panique inutile et enhardir les Soviétiques."

 cubamc.11.d:0 "Les forces des États-Unis et de leurs alliés à Berlin-Ouest se sont rendues à l'armée soviétique. Le commandant américain a pris cette décision afin d'éviter la perte de vies civiles et en reconnaissant que toute résistance armée conduirait à l'anéantissement de ses propres forces sans aucun gain. La prise de Berlin par les Soviétiques est une représaille à l'invasion américaine de Cuba. Les Soviétiques prétendaient que leurs actions étaient justifiées dans la mesure où ils garantissaient leur propre sphère d'influence, comme l'Amérique prétendait le faire à Cuba. Les alliés américains en Europe seraient furieux de cette nouvelle, nombre d'entre eux accusant les actions imprudentes des États-Unis à l'égard de Cuba d'avoir provoqué cette dernière action soviétique. On ne sait pas comment les États-Unis réagiront ni quand ou si les Soviétiques envisagent de restituer les forces qui se sont rendues. Beaucoup en Europe craignent que la situation ne dégénère en une nouvelle guerre mondiale."
 cubamc.12.d:0 "La Marine a informé la Maison Blanche que son blocus était actif. Pour réduire une escalade de la violence ou fournir un prétexte aux Soviétiques pour l'escalade, le Département d'État a réussi à faire approuver le blocus non pas comme un acte de guerre mais comme une mesure de défense visant à protéger l'hémisphère occidental. Cela a été fait en obtenant l'approbation de l'Organisation des États américains et en s'engageant que le blocus vise uniquement à empêcher l'arrivée d'armes offensives sur l'île, conformément aux termes du Traité de Rio de 1947. De plus, nous avons lancé un ultimatum au gouvernement soviétique selon lequel nos actions ne cesseraient pas tant que tous les missiles offensifs soviétiques n'auraient pas été retirés de l'île."
 
 cubamc.13.d:0 "\nLe peuple américain a été stupéfait ce soir lorsque le président [USA.GetLeader] a informé la nation de la découverte de missiles nucléaires soviétiques sur l'île de Cuba. Dans son discours [USA.GetLeader], il a souligné que tout missile nucléaire lancé depuis Cuba contre n'importe quel État de l'hémisphère occidental serait considéré comme une attaque directe de l'Union soviétique contre les États-Unis. Le Président a également fait part de son projet d'établir ce qu'il a décrit comme une quarantaine à Cuba. Il a déclaré que tous les navires qui transportaient des armes offensives seraient refoulés, mais que ceux qui n'en portaient pas seraient autorisés à entrer. Il a ajouté que la marine américaine mettrait en oeuvre cette quarantaine depuis les eaux internationales. Il a souligné que la quarantaine n'arrêterait pas l'importation de produits de première nécessité ou de biens non militaires. Les forces américaines du monde entier sont également mobilisées."
 cubamc.14.d:0 "Les Américains ont découvert les détails de l'opération Anadyr et savent que nous avons l'intention de déployer des missiles nucléaires à Cuba. Leur récente déclaration de blocus et d'ultimatum à notre gouvernement pour retirer les missiles montre que l'opération n'est plus un secret. Nous avons déjà des cargos à destination de Cuba transportant des armes et le blocus américain peut facilement être la première étape d'une escalade majeure du conflit. Les dirigeants ont décidé de donner l'ordre à nos forces à Cuba de se préparer à une invasion et notre ambassadeur informera le président Castro que les Américains savent que nous avons déjà des missiles sur l'île et qu'il doit préparer ses propres forces."
 cubamc.15.d:0 "Il est clair que la marine américaine a l'intention d'arraisonner et d'inspecter tous nos navires, comme elle a déjà arraisonné et inspecté un navire en provenance du Liban. La marine américaine déplace déjà ses navires sur la trajectoire de nos cargos qui approchent. Les capitaines de nos navires ont désespérément besoin d'ordres. Nous devons décider si nous voulons que les navires maintiennent leur position et tenter de négocier un accord avec les Américains ou si nous devons aller de l'avant et contester le blocus. Si nous optons pour la deuxième option, les cargos seront suivis de près par nos sous-marins dans la zone. La tension continue de monter alors que les forces soviétiques du monde entier sont en état d'alerte."
 cubamc.16.d:0 "Après des messages tendus entre Moscou et Washington, la Maison Blanche a reçu une offre ferme du Premier ministre [SOV.GetLeader]. Le dirigeant soviétique a promis de retirer toutes les armes nucléaires de Cuba à condition que nous retirions nos missiles nucléaires de Turquie et que nous promettions de ne pas envahir Cuba. En entendant cette offre, de nombreux membres de l'administration ont immédiatement insisté pour que nous rejetions la proposition et exigeions un retrait inconditionnel des Soviétiques. Pour eux, l'offre soviétique montre une faiblesse. Cependant, le président et ses proches conseillers semblent enclins à accepter l'accord, une guerre à Cuba coûterait cher et les missiles en Turquie étaient largement obsolètes. Essentiellement, les États-Unis ne perdraient rien et atteindraient leurs objectifs tandis que les Soviétiques pourraient sauver la face au niveau international. Cependant, ce n'est pas au président de décider quelle position il adoptera, car la vie de millions de personnes est en jeu."
 cubamc.17.d:0 "La nouvelle est parvenue au premier ministre Nikita Khrouchtchev et à ses hauts fonctionnaires que le gouvernement américain avait accepté sa proposition de résoudre la crise à Cuba. Peu de personnes dans la salle pouvaient cacher leur joie et leur soulagement qu'une solution ait été trouvée. L'armée soviétique a déjà reçu l'ordre de retirer ses forces de Cuba et de rappeler les cargos se dirigeant vers l'île. L'accord des Américains sur le retrait de leurs missiles de Turquie est salué comme une victoire stratégique. Plus important encore, en obtenant de la part des Américains la garantie de ne pas envahir Cuba, nous avons assuré la révolution cubaine. Le président Fidel Castro a certes exprimé une certaine déception face au résultat, mais il se rendra vite compte que c'était le meilleur résultat."
 cubamc.18.d:0 "Après deux semaines tendues au cours desquelles le monde a retenu son souffle, la crise des missiles de Cuba a pris fin. Les États-Unis et l'Union soviétique ont réussi à conclure un accord qui verra l'Union soviétique démanteler et retirer ses forces nucléaires de Cuba. En échange, les États-Unis se sont engagés à respecter la souveraineté et les droits de Cuba. Beaucoup considèrent cet accord comme une victoire pour les États-Unis, même si des rumeurs courent selon lesquelles le gouvernement américain aurait fait d'autres concessions concernant le déploiement de ses forces nucléaires. Quoi qu'il en soit, le peuple américain félicite le président pour son leadership ferme pendant la crise. En Union soviétique, il semble y avoir des tensions au sein du Politburo, car de nombreux membres estimaient que la crise n'aurait pas dû atteindre le stade de la corde raide."
 cubamc.19.d:0 "Nous avons appris que le gouvernement américain a rejeté nos propositions sensées et exige le retrait inconditionnel de nos armes nucléaires de Cuba. Les hauts responsables militaires affirment que nous n'avons désormais que deux choix. La première consiste à admettre que le projet Cuba a échoué et à entamer le processus de retrait de nos forces. Heureusement, ce ne serait pas un processus difficile. Cependant, cela constituerait un revers diplomatique dévastateur pour l'État. L'autre option consiste à ordonner à nos cargos d'avancer et d'essayer de contourner le blocus. Cela pourrait remettre la pression sur les Américains et ils décideront s'ils veulent ou non la guerre. La décision nous appartient, l'avenir de la révolution mondiale est en jeu."
 cubamc.20.d:0 "Le monde respire beaucoup plus facilement maintenant que l'on apprend que l'Union Soviétique va commencer à démanteler et à retirer toutes ses forces nucléaires de Cuba. Les États-Unis insistent sur le fait qu'aucun accord n'a été conclu et que les Soviétiques ont décidé de prendre la bonne décision. La nouvelle du retrait soviétique de Cuba suscite les éloges des alliés américains, tandis que les États socialistes seraient très en colère contre l'apparente capitulation soviétique face aux exigences américaines. Le gouvernement cubain serait découragé par le retrait soviétique et Fidel Castro est furieux que les Soviétiques aient apparemment abandonné la nation cubaine. Des foules se sont rassemblées dans les villes américaines pour célébrer le leadership fort du président tout au long de la crise."
 cubamc.21.d:0 "Le Pentagone a informé la Maison Blanche que des cargos soviétiques, transportant probablement des armes offensives, tentaient de franchir le blocus. Nos navires de guerre ont émis de sévères avertissements, mais ils les ignorent. Nous devons prendre une décision cruciale : ordonner à nos navires d'ouvrir le feu et de neutraliser les navires soviétiques ou de reculer et de les laisser passer. Certains responsables du cabinet soulignent que la présence soviétique et les armes nucléaires n'auront guère d'impact sur l'équilibre stratégique, et que nous devrions nous retirer plutôt que de risquer un échange cataclysmique. D'autres, notamment les chefs militaires, appellent nos forces à mettre en oeuvre le blocus et à démontrer le sérieux de notre position en tirant sur les navires qui désobéissent. Une décision monumentale doit être prise."
 cubamc.22.d:0 "Lorsque les navires soviétiques ont traversé la quarantaine navale des États-Unis et sont arrivés à Cuba en grande pompe, il est rapidement devenu évident que la politique américaine avait échoué. Les États-Unis avaient précédemment averti que tout navire violant leur quarantaine risquait d'être saisi ou incendié, mais cela ne s'est pas produit. Déjà, les forces navales chargées d'appliquer la quarantaine regagnent leurs bases. Dans un discours prononcé à l'échelle nationale, le président américain a déclaré qu'il avait ordonné aux navires de se retirer pour préserver la paix internationale et éviter la mort d'innombrables innocents. Il accuse les Soviétiques de jouer avec le sort du monde. Les Soviétiques, en revanche, ont déclaré que les États-Unis avaient mis fin à leur piraterie illégale et que la présence soviétique à Cuba visait à défendre la petite nation insulaire qui avait déjà fait face à l'agression américaine. Sur le plan international, les Soviétiques sont considérés comme les vainqueurs de la crise des missiles de Cuba et devraient étendre leur présence dans la région, à mesure que le monde sort du gouffre."
 cubamc.23.d:0 "Les rapports de nos cargos avançant vers Cuba indiquent que des navires de guerre américains tirent sur les navires. Les navires ne sont pratiquement pas armés et les Américains semblent tirer pour arrêter les navires et non pour les détruire afin d'inspecter leur cargaison. Cependant, nos sous-marins qui escortent les navires se dirigent vers les navires de guerre américains. Les Américains n'ont aucun respect pour la sécurité du monde ou de nos hommes ; et nous avons donné l'ordre aux sous-marins de défendre les cargos à tout prix. Espérons qu'avec l'élément de surprise, nos navires l'emporteront."
 cubamc.24.d:0 "Des rapports en provenance de La Havane indiquent que des détonations nucléaires ont eu lieu au large des côtes cubaines. Ces événements font suite à l'annonce selon laquelle des navires de guerre de la marine américaine étaient engagés dans des combats actifs contre des navires de la marine soviétique, y compris des sous-marins. Un représentant du Pentagone a répondu aux informations en déclarant que des sous-marins soviétiques armés de torpilles nucléaires les avaient lancés imprudemment sur des navires américains appliquant la quarantaine approuvée par l'Organisation des États américains. Il ne disposait d'aucune information sur les victimes ou les pertes des deux côtés. À Moscou, les Soviétiques ont affirmé que des navires de guerre américains avaient lancé une attaque non provoquée contre des cargos non armés, forçant les sous-marins soviétiques à répondre en force. Le chaos de masse s'abat sur les villes du monde entier alors que les craintes d'un échange nucléaire à grande échelle augmentent."
 cubamc.25.d:0 "Lors d'une réunion avec les chefs d'état-major interarmées, les hauts membres du cabinet et les principaux conseillers, le président des États-Unis se retrouve dans une situation qu'il souhaitait désespérément éviter. L'utilisation d'armes nucléaires par la marine soviétique contre les navires américains ne peut rester sans réponse. Certains appellent à une frappe nucléaire équivalente sur une cible navale soviétique, mais les hauts responsables militaires insistent sur le fait qu'une telle approche ne ferait que donner aux Soviétiques plus de temps et d'opportunités pour frapper des cibles américaines. Le président est d'accord et a donné l'ordre aux États-Unis de déclencher une riposte nucléaire totale pour garantir que l'Union soviétique ne puisse plus menacer le monde. Il a également ordonné au pays de mettre en oeuvre des protocoles de défense nucléaire et de se préparer à des pertes de vies humaines dévastatrices. L'ambiance était sombre, mais toutes les personnes présentes savaient qu'il n'y avait plus d'alternative."
 
 cubamc.26.d:0 "De hauts commandants militaires ont informé le Politburo que les Américains ripostaient par une attaque nucléaire à grande échelle. Le temps de la politique politique ou des réponses mesurées est révolu. Les commandants militaires ont noté que malgré la destruction imminente de vastes étendues du pays, nous possédons toujours les moyens de punir leur agression. Le Premier ministre soviétique a ensuite ordonné aux forces de missiles stratégiques de préparer et de lancer leur propre attaque à grande échelle. Si les Américains choisissaient de détruire la nation soviétique, ils connaîtraient une ruine similaire. Il n'y eut ni joie ni discussion lorsque l'ordre fut donné, juste la sombre prise de conscience que chacun avait fait son devoir, et que c'était le seul résultat."
 cubamc.27.d:0 "La délégation soviétique en visite a insisté pour que nous acceptions leurs projets de déploiement de missiles stratégiques sur notre île. Ils veulent le faire en secret et prétendent que ce serait une action plus significative qu'un traité public de défense, comme nous l'avons suggéré. Si nous acceptons la demande soviétique, cela renforcera nos liens et démontrera la sincérité de notre peuple. En outre, le déploiement de tels systèmes d'armes, même secrètement, nous donnerait probablement les avantages d'un traité de défense, mais éviterait l'examen minutieux et l'ingérence américaine qui suivraient sûrement si un traité formel était signé. Cependant, si les Américains découvraient ces armes secrètement déployées, ils nous présenteraient comme une marionnette soviétique, ce qui porterait atteinte à notre crédibilité révolutionnaire. Nous devons décider soit d'accepter le déploiement secret de missiles stratégiques, soit d'informer la délégation que nous souhaitons un traité de défense mutuelle."
 cubamc.28.d:0 "Après une intense et vaste campagne de bombardements aériens visant à neutraliser les sites de missiles soviétiques et les défenses cubaines, les États-Unis ont annoncé que leurs forces débarquaient désormais à Cuba. Les États-Unis cherchent à neutraliser le gouvernement cubain et à garantir que son peuple et ses terres ne soient pas utilisés comme rampe de lancement pour infliger des destructions indicibles au peuple américain. Le gouvernement soviétique serait en train de formuler une réponse alors que l'on ne sait toujours pas combien de victimes, lui ou les Cubains, ont subi lors des premiers bombardements. Le dirigeant cubain Fidel Castro a annoncé avec défi que ses forces résisteraient et a appelé tous les Cubains à se joindre à la défense de l'île contre l'agression impérialiste. Les États-Unis estiment qu'ils devaient agir suite à la découverte de sites secrets de missiles nucléaires soviétiques en cours de construction à Cuba, située à moins de cent milles du sol américain."
 cubamc.29.d:0 "Alors que l'immaturité américaine dressait sa vilaine tête face à la situation à Cuba et qu'ils prétendaient que nous interférions dans leur sphère d'influence, nous avons décidé de leur rendre la pareille. Berlin occupé par les Alliés se trouve au coeur du monde socialiste et s'immisce ainsi dans notre sphère d'influence. Nous avons récemment ordonné aux commandants locaux d'occuper et d'expulser les forces d'occupation de leur quartier de Berlin. Heureusement, les commandants ennemis ont pris conscience de leur situation et se sont retirés sans violence. Nous les rapatrierons sur le territoire de l'OTAN. La prise de Berlin est bien accueillie par la population et les alliés des États-Unis au sein de l'OTAN seraient furieux que l'aventurisme américain ait conduit à la chute de Berlin occupé par les Alliés."
 
