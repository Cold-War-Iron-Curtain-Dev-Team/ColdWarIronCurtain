l_french: 
 GDR_Convene_the_Third_German_Peoples_Congress:0 "Convoquer le troisième Congrès populaire allemand"
 GDR_Convene_the_Third_German_Peoples_Congress_desc:0 "Il est temps de convoquer le Troisième Congrès du peuple allemand et de déterminer l'avenir du nouvel État allemand démocratique."
 GDR_Interpreting_Stalins_Advice:0 "Interpréter les conseils de Staline"
 GDR_Interpreting_Stalins_Advice_desc:0 "La zone d'occupation soviétique évolue rapidement vers son propre État, ce qui entraîne des problèmes de politique étrangère et intérieure. Nous avons reçu de nombreux conseils de l'URSS sur la manière de procéder, même si la plupart d'entre eux sont contradictoires et incohérents. Nous devons décider quelle voie prendre."
 GDR_Deny_Similarities_to_Peoples_Democracies:0 "Nier les similitudes avec les démocraties populaires"
 GDR_Deny_Similarities_to_Peoples_Democracies_desc:0 "Nous n'avons pas besoin de suivre la même ligne stalinienne que nos camarades d'Europe de l'Est. Ulbricht ne sera pas content, mais nous servons le peuple, pas l'homme."
 GDR_Continue_Tupolevs_Line:0 "Continuer la ligne de Tupolev"
 GDR_Continue_Tupolevs_Line_desc:0 "Tous ces discours sur la réforme sont dangereux. Le modèle stalinien a fait des merveilles en URSS et dans le reste de l'Europe de l'Est ; nous serions insensés d'essayer de tracer notre propre voie."
 GDR_Make_Further_Concessions_in_Constitution_Proposal:0 "Autres concessions dans la Constitution"
 GDR_Make_Further_Concessions_in_Constitution_Proposal_desc:0 "Si nous souhaitons coopérer avec les autres partis de la coalition gouvernementale, nous devons être prêts à concéder certains points et privilèges afin de maintenir la confiance et la stabilité."
 GDR_Propose_Recociliation_Meetings_with_Western_Officials:0 "Proposer des réunions de réconciliation avec des responsables occidentaux"
 GDR_Propose_Recociliation_Meetings_with_Western_Officials_desc:0 "Nous devons explorer toutes les voies en faveur de la paix et de la diplomatie, même avec nos adversaires idéologiques. Proposer des réunions de réconciliation peut réduire les tensions et nous donner l'avantage dans le contrôle du discours."
 GDR_Invest_in_the_National_Front_Initiative:0 "Investissez dans l'Initiative du Front National"
 GDR_Invest_in_the_National_Front_Initiative_desc:0 "En renforçant les organisations de masse sous l'égide du Front national, nous pouvons étendre l'influence du Parti sous couvert d'unité démocratique."
 GDR_Focus_on_Affirming_Party_Power:0 "Affirmer le pouvoir du parti"
 GDR_Focus_on_Affirming_Party_Power_desc:0 "Nous réaffirmerons la position du SED comme avant-garde de la classe ouvrière et éliminerons toute ambiguïté dans la relation de pouvoir entre le Parti et l'État."
 GDR_The_Question_of_Party_and_State:0 "La question du parti et de l'État"
 GDR_The_Question_of_Party_and_State_desc:0 "En théorie, l'État représente le peuple. En pratique, il doit refléter la direction du Parti. Nous trancherons ce débat en formalisant la suprématie du SED en matière de gouvernance."
 GDR_Resume_Publication_of_Voelkischer_Beobachter:0 "Reprendre la publication du Völkischer Beobachter"
 GDR_Resume_Publication_of_Voelkischer_Beobachter_desc:0 "Reprendre cette publication sous la stricte surveillance du Parti nous permettra de remodeler son héritage en un récit antifasciste et socialiste, en récupérant sa plateforme pour le peuple."
 GDR_Direct_NDPD_to_Start_New_Publication:0 "Une nouvelle publication pour le NDPD"
 GDR_Direct_NDPD_to_Start_New_Publication_desc:0 "Le Parti national-démocrate a besoin d'une voix nouvelle. Une nouvelle publication lui permettra d'agir comme un outil de sensibilisation efficace, notamment auprès des anciens éléments nationalistes."
 GDR_Re_Evaluating_the_Two_Year_Plan:0 "Réévaluation du plan biennal"
 GDR_Re_Evaluating_the_Two_Year_Plan_desc:0 "Le plan biennal ne se déroule pas bien. Si nous n'agissons pas maintenant, nous risquons son échec, ou pire, une récession économique."
 GDR_Halt_Collectivization_Efforts:0 "Arrêter les efforts de collectivisation"
 GDR_Halt_Collectivization_Efforts_desc:0 "La collectivisation a généré plus de résistances que de résultats. Nous allons suspendre ces efforts et réévaluer nos politiques agricoles."
 GDR_Ignore_Soviet_Concerns:0 "Ignorer les préoccupations soviétiques"
 GDR_Ignore_Soviet_Concerns_desc:0 "Les conseils de Moscou ne sont pas sacro-saints. Dans un souci de stabilité et de réussite, nous ignorerons discrètement leurs objections et suivrons notre propre voie."
 GDR_A_Review_of_Bodenreform:0 "Une revue de la Bodenreform"
 GDR_A_Review_of_Bodenreform_desc:0 "La réforme agraire était essentielle pour démanteler le modèle économique d'exploitation, mais sa mise en oeuvre a suscité des inquiétudes. Un examen approfondi garantira qu'il s'aligne sur les objectifs socialistes tout en tenant compte des réalités pratiques."
 GDR_Propagandize_Successful_Progress:0 "Propager les progrès réussis"
 GDR_Propagandize_Successful_Progress_desc:0 "Même les gains modestes doivent être considérés comme des victoires monumentales. Célébrer ces succès renforcera la foi dans le socialisme et étouffera tout récit d'échec ou de stagnation."
 GDR_Seek_Re_Evaluation_of_Reperations:0 "Demander une réévaluation des réparations"
 GDR_Seek_Re_Evaluation_of_Reperations_desc:0 "Le fardeau des réparations imposées après la guerre continue de mettre à rude épreuve notre économie. Nous demanderons une réévaluation à Moscou, en faisant valoir qu'une RDA plus forte est dans l'intérêt de tous."
 GDR_Investigate_the_Potential_of_Future_Industrial_Nationalizations:0 "Enquêter sur les futures nationalisations industrielles"
 GDR_Investigate_the_Potential_of_Future_Industrial_Nationalizations_desc:0 "Le contrôle des moyens de production doit être total. Une commission examinera quelles industries privées restantes pourraient passer sous la propriété de l'État sans perturbation économique."
 GDR_A_Trip_to_Moscow:0 "Un voyage à Moscou"
 GDR_A_Trip_to_Moscow_desc:0 "Les pourparlers de haut niveau à Moscou offrent l'occasion de consolider notre alignement avec l'Union soviétique."
 GDR_The_Establishment_of_the_German_Democratic_Republic:0 "Établir la République démocratique allemande"
 GDR_The_Establishment_of_the_German_Democratic_Republic_desc:0 "Avec l'effondrement du régime fasciste et la rééducation de l'Allemagne, un nouvel État socialiste renaît de ses cendres. La RDA doit servir de modèle pour une future unification sous domination prolétarienne."
 GDR_Ulbricht_Consolidates_Power:0 "Ulbricht consolide son pouvoir"
 GDR_Ulbricht_Consolidates_Power_desc:0 "Walter Ulbricht apparaît comme le leader incontesté du Parti. En écartant les rivaux potentiels et en obtenant le soutien de Moscou, nous pouvons jeter les bases d'une gouvernance centralisée et disciplinée."
 GDR_Grotewohl_Victorious:0 "Grotewohl Victorieux"
 GDR_Grotewohl_Victorious_desc:0 "Le sens politique et l'attrait public d'Otto Grotewohl ont triomphé. Sa direction donne au SED une personnalité modérée mais loyale pour combler le fossé entre l'orthodoxie du Parti et la légitimité populaire."
 GDR_The_Second_Party_Conference_a:0 "La deuxième conférence du parti"
 GDR_The_Second_Party_Conference_a_desc:0 "La deuxième Conférence du Parti servira de moment de renouveau et de centralisation idéologique. Avec le soutien de Moscou, nous déclarerons notre voie à suivre et éliminerons les déviations persistantes."
 GDR_The_Problem_of_the_Church:0 "Le problème de l'Église"
 GDR_The_Problem_of_the_Church_desc:0 "La religion reste une force profondément ancrée dans la vie allemande. Il faut y remédier."
 GDR_Meet_with_EKD_and_German_Catholic_Leadership:0 "Rencontre avec EKD et les dirigeants catholiques"
 GDR_Meet_with_EKD_and_German_Catholic_Leadership_desc:0 "Plutôt que de forcer un affrontement, nous ouvrirons des discussions avec les dirigeants protestants et catholiques. Cette approche peut désamorcer les tensions et offrir des opportunités d'influencer la vie religieuse de l'intérieur."
 GDR_Avoid_Antagonizing_the_Church:0 "Évitez de contrarier l'Église"
 GDR_Avoid_Antagonizing_the_Church_desc:0 "Même si l'Église constitue une menace latente, une persécution ouverte aliénerait les croyants et susciterait les critiques occidentales. Pour l'instant, nous maintiendrons une posture d'engagement et de surveillance prudente."
 GDR_Lionize_the_Spartacist_Uprising:0 "Lionisez le soulèvement spartakiste"
 GDR_Lionize_the_Spartacist_Uprising_desc:0 "Le soulèvement spartakiste de 1919 fut un moment crucial dans la lutte prolétarienne allemande. Nous élèverons ses martyrs et rappellerons au peuple que notre État accomplit sa révolution inachevée."
 GDR_Promote_Socialist_Heroes:0 "Promouvoir les héros socialistes"
 GDR_Promote_Socialist_Heroes_desc:0 "Grâce aux monuments, aux programmes scolaires et aux médias d'État, nous élèverons les personnalités approuvées par le Parti comme modèles pour la nouvelle génération."
 GDR_The_Election_Problem_a:0 "Le problème des élections"
 GDR_The_Election_Problem_a_desc:0 "Les observateurs occidentaux suivent de près. Même si le Parti ne peut pas se permettre un véritable pluralisme, nous devons concevoir un processus électoral qui projette la légitimité et l'unité vers le monde extérieur."
 GDR_The_Election_Problem:0 "Le problème des élections"
 GDR_The_Election_Problem_desc:0 "Les observateurs occidentaux suivent de près. Même si le Parti ne peut pas se permettre un véritable pluralisme, nous devons concevoir un processus électoral qui projette la légitimité et l'unité vers le monde extérieur."
 GDR_Promote_the_Young_Pioneers:0 "Promouvoir les jeunes pionniers"
 GDR_Promote_the_Young_Pioneers_desc:0 "L'avenir appartient à ceux qui le façonnent. Les Jeunes Pionniers seront élargis, inculquant les valeurs socialistes aux enfants et les préparant à devenir l'avant-garde de demain."
 GDR_Escalate_Class_Conflict:0 "Escalader le conflit de classe"
 GDR_Escalate_Class_Conflict_desc:0 "La lutte des classes ne s'arrête pas avec la révolution, elle s'intensifie. Nous sensibiliserons davantage au sabotage bourgeois et mobiliserons la classe ouvrière contre les ennemis résiduels du socialisme."
 GDR_Demolish_the_Berlin_Palace:0 "Démolir le palais de Berlin"
 GDR_Demolish_the_Berlin_Palace_desc:0 "L'ancien palais royal prussien est un vestige de la féodalité. Sa destruction symbolisera notre rupture avec le passé et ouvrira la voie à des monuments dédiés au socialisme."
 GDR_Increase_Income_and_Artisan_Taxes:0 "Augmenter les impôts sur le revenu et les artisans"
 GDR_Increase_Income_and_Artisan_Taxes_desc:0 "Pour financer notre plan quinquennal, nous devons exiger des cotisations plus élevées de la part des travailleurs indépendants et des classes aisées. Le fardeau tombera là où il le devrait ; sur ceux qui sont les moins alignés sur le socialisme."
 GDR_Aktion_Rose:0 "Action Rose"
 GDR_Aktion_Rose_desc:0 "L'Opération Rose ciblera les propriétaires d'hôtels et de pensions privés le long de la côte baltique, en expropriant leurs propriétés au nom de l'État."
 GDR_The_Second_Party_Conference:0 "La deuxième conférence du parti"
 GDR_The_Second_Party_Conference_desc:0 "À mesure que le Parti mûrit, nous devons nous préparer à une conférence décisive qui donnera le ton idéologique pour les années à venir."
 GDR_Declare_War_on_the_Church:0 "Déclarez la guerre à l'Église"
 GDR_Declare_War_on_the_Church_desc:0 "L'influence de l'Église doit être brisée. Nous affronterons directement ses institutions, en utilisant tous les outils à notre disposition pour rompre ses liens avec la vie publique."
 GDR_Ban_Religous_Education:0 "Interdire l'éducation religieuse"
 GDR_Ban_Religous_Education_desc:0 "La religion n'a aucune place dans la formation des jeunes esprits. Toute instruction religieuse sera supprimée des écoles, remplacée par l'éthique socialiste et le rationalisme scientifique."
 GDR_For_the_Construction_of_Socialism:0 "Pour la construction du socialisme"
 GDR_For_the_Construction_of_Socialism_desc:0 "Nous allons désormais au-delà de la reprise et nous dirigeons vers la construction. L'industrie, l'agriculture, l'éducation et l'idéologie seront remodelées pour créer une société digne du nom de socialiste."
 GDR_Slash_Social_Service_Spending:0 "Réduire les dépenses des services sociaux"
 GDR_Slash_Social_Service_Spending_desc:0 "Les ressources sont limitées et la révolution exige des sacrifices. Le financement des programmes sociaux sera réorienté vers l'expansion industrielle et la sécurité intérieure."
 GDR_Strip_Self_Employed_Workers_of_Benefits:0 "Priver les travailleurs indépendants de leurs avantages sociaux"
 GDR_Strip_Self_Employed_Workers_of_Benefits_desc:0 "Les éléments indépendants bénéficient de l'État tout en résistant à la collectivisation. Cette contradiction prend fin maintenant. Leur accès aux prestations de l'État sera supprimé."
 GDR_Begin_Mass_Surveilance_on_CDU_Members_and_Clergy:0 "Surveillance de masse sur la CDU et le clergé"
 GDR_Begin_Mass_Surveilance_on_CDU_Members_and_Clergy_desc:0 "Le clergé et les chrétiens-démocrates restent des foyers de sentiments contre-révolutionnaires. Nous lancerons de vastes opérations de surveillance pour dénoncer la subversion et préparer les actions futures"
 GDR_Emulate_Stalins_Personality_Cult:0 "Imitez le culte de la personnalité de Staline"
 GDR_Emulate_Stalins_Personality_Cult_desc:0 "Le culte de la personnalité de Staline assurait l'unité et l'obéissance en URSS. Nous adopterons des méthodes similaires, glorifiant notre leadership pour imposer la loyauté et supprimer le doute."
 GDR_Force_Agricultural_Collectivization:0 "Forcer la collectivisation agricole"
 GDR_Force_Agricultural_Collectivization_desc:0 "§RQu'est-ce qui pourrait mal se passer ?§"
 GDR_Hike_Working_Hours:0 "Augmenter les heures de travail"
 GDR_Hike_Working_Hours_desc:0 "La productivité doit augmenter pour respecter le plan quinquennal. Nous prolongerons la journée de travail tout en mettant l'accent sur le devoir moral du travail envers l'État."
 GDR_Silence_Coalition_Member_Voices:0 "Voix des membres de la Coalition Silence"
 GDR_Silence_Coalition_Member_Voices_desc:0 "Le Front National n'a une coalition que le nom. Nous ferons taire les voix indépendantes en son sein, en veillant à ce que tous les partis participants servent d'extensions du SED."
 GDR_Investigate_the_State_of_the_Berlin_Palace:0 "Enquêter sur l'état du château de Berlin"
 GDR_Investigate_the_State_of_the_Berlin_Palace_desc:0 "Le palais de Berlin pourrait encore être utile. Nous étudierons l'ampleur des dégâts et verrons si quelque chose ne peut pas être récupéré."
 GDR_The_Foundations_of_State:0 "Les fondements de l'État"
 GDR_The_Foundations_of_State_desc:0 "Un État, c'est bien plus que des frontières et des politiques : c'est une mémoire, un rituel et un mythe. Nous poserons les bases culturelles et idéologiques nécessaires à la pérennité de la RDA."
 GDR_Establish_the_Stasi:0 "Établir la Stasi"
 GDR_Establish_the_Stasi_desc:0 "Le ministère de la Sécurité de l'État sera créé pour surveiller, protéger et faire respecter la conformité idéologique au sein de la République."
 GDR_Establish_the_National_Front_Coalition:0 "Créer la Coalition du Front National"
 GDR_Establish_the_National_Front_Coalition_desc:0 "Pour maintenir une façade de pluralisme, nous formaliserons le Front National. Tous les partis membres seront soumis à la discipline du Parti, projetant l'unité sans abandonner le contrôle."
 GDR_The_Waldheimer_Prozesse:0 "Le procès Waldheimer"
 GDR_The_Waldheimer_Prozesse_desc:0 "Les procès Waldheim élimineront les anciens fascistes et ennemis de classe. La justice sera rapide, symbolique et publique, rappelant toutes les conséquences de la déloyauté."
 GDR_Ratify_the_Treaty_of_Zgorzelec:0 "Ratifier le Traité de Zgorzelec"
 GDR_Ratify_the_Treaty_of_Zgorzelec_desc:0 "Le traité de Zgorzelec avec la Pologne solidifie nos frontières et affirme la solidarité socialiste."
 GDR_Seek_Concessions:0 "Rechercher des concessions"
 GDR_Seek_Concessions_desc:0 "Nous pensons que le traité proposé de Zgorzelec est trop déséquilibré en faveur de la Pologne. C'est pourquoi nous chercherons le soutien soviétique dans l'espoir de reconquérir certains de nos territoires de l'Est."
 GDR_Join_COMECON:0 "Rejoignez le COMÉCON"
 GDR_Join_COMECON_desc:0 "L'intégration au Conseil d'assistance économique mutuelle intégrera notre économie au sein du bloc socialiste. Nous bénéficierons du commerce mutuel, d'une planification partagée et du leadership soviétique."
 COMECON_MEMBERSHIP:0 "Membre du COMÉCON"
 COMECON_MEMBERSHIP_desc:0 "Nous sommes membre du Conseil d'assistance économique mutuelle."
 GDR_Close_the_Speziallager_Camp:0 "Fermer le camp Speziallager"
 GDR_Close_the_Speziallager_Camp_desc:0 "Les camps de Speziallager sont de plus en plus critiqués pour leurs conditions inhumaines. Les fermer calmera la population et démontrera notre engagement en faveur d'un État socialiste plus juste."
 GDR_The_Issue_of_Unrest:0 "La question des troubles"
 GDR_The_Issue_of_Unrest_desc:0 "Le mécontentement couve sous la surface de la République. Qu'il s'agisse du rationnement, de la pénurie de logements ou de l'aliénation politique, nous devons reconnaître l'agitation croissante avant qu'elle ne dégénère en quelque chose de plus dangereux."
 GDR_The_Carrot_and_Stick:0 "La carotte et le bâton"
 GDR_The_Carrot_and_Stick_desc:0 "Face à la dissidence interne, nous devons recourir à la fois à la réforme et à la répression. Offrir de petites concessions tout en resserrant notre emprise contribuera à réduire la dissidence que nous connaissons actuellement."
 GDR_Delegate_the_Penal_Code_to_Max_Fechner:0 "Déléguer le Code pénal à Max Fechner"
 GDR_Delegate_the_Penal_Code_to_Max_Fechner_desc:0 "Max Fechner, juriste respecté et ancien membre du SPD, a une réputation d'équité et d'intégrité juridique. Lui confier le projet de code pénal apportera une légitimité à nos réformes judiciaires."
 GDR_Enshrine_an_Independent_Judiciary:0 "Garantir un pouvoir judiciaire indépendant"
 GDR_Enshrine_an_Independent_Judiciary_desc:0 "Un système judiciaire véritablement indépendant constituera la pierre angulaire de la légalité socialiste, démontrant à la fois à la population et au monde que la justice en RDA n'est pas dictée par un caprice politique."
 GDR_Offer_Concessions_to_Bourgeois_Parties:0 "Offrir des concessions aux partis bourgeois"
 GDR_Offer_Concessions_to_Bourgeois_Parties_desc:0 "En proposant des offres modestes à nos partenaires de la coalition, nous pouvons favoriser l'illusion du pluralisme et de la stabilité."
 GDR_Sideline_Suspect_Coalition_Members:0 "Membres de la coalition des suspects en marge"
 GDR_Sideline_Suspect_Coalition_Members_desc:0 "Certains membres de la coalition ne sont pas seulement peu fiables, ils sont aussi des traîtres potentiels à la cause socialiste. Les mettre discrètement à l'écart maintenant évitera des problèmes plus tard."
 GDR_Ensure_Right_to_Government_Criticism:0 "Garantir le droit à la critique du gouvernement"
 GDR_Ensure_Right_to_Government_Criticism_desc:0 "Permettre une critique contrôlée peut paradoxalement renforcer l'État. Nous pouvons permettre une dissidence soigneusement modérée comme une soupape de pression, tout en nous protégeant contre toute menace réelle."
 GDR_The_Dream_of_a_United_Germany:0 "Le rêve d'une Allemagne unie"
 GDR_The_Dream_of_a_United_Germany_desc:0 "La notion de réunification allemande reste puissante. En affirmant publiquement notre engagement en faveur d'une unification pacifique, nous pouvons gagner les coeurs et les esprits, notamment en Occident."
 GDR_Purge_Hilde_Benjamin:0 "Purger Hilde Benjamin"
 GDR_Purge_Hilde_Benjamin_desc:0 "Hilde Benjamin est hors de contrôle et hors de contrôle. Nous n'avons d'autre choix que de la purger du Parti."
 GDR_Zig_Zagging_to_Socialism:0 "Zigzag vers le socialisme"
 GDR_Zig_Zagging_to_Socialism_desc:0 "La route vers le socialisme n'est ni droite ni simple. À chaque changement de politique, nous nous adaptons aux circonstances changeantes tout en gardant notre objectif ultime en vue."
 GDR_Begin_Preperations_for_Comrade_Ulbrichts_Birthday:0 "Préparez-vous pour l'anniversaire du camarade Ulbricht"
 GDR_Begin_Preperations_for_Comrade_Ulbrichts_Birthday_desc:0 "Alors que le leader de notre république approche d'une nouvelle année, il est tout à fait approprié que nous célébrions sa vision et son leadership avec un apparat révolutionnaire approprié."
 GDR_The_German_Workers_Son:0 "Le fils du travailleur allemand"
 GDR_The_German_Workers_Son_desc:0 "L'histoire d'Ulbricht, composée d'origines modestes, de conscience de classe et de dévouement inébranlable, incarne le leader socialiste idéal. C'est une histoire qui mérite d'être racontée avec l'aval de l'État."
 GDR_The_War_on_Schumacherites:0 "La guerre contre les Schumachériens"
 GDR_The_War_on_Schumacherites_desc:0 "Le SPD, sous la direction de Kurt Schumacher, continue d'empoisonner la politique ouest-allemande avec une rhétorique réactionnaire. Nous devons contrer cette influence et discréditer son héritage à l'Est."
 GDR_Delegate_Penal_Code_Drafting_to_Hilde_Benjamin:0 "Déléguer la rédaction du Code pénal à Hilde Benjamin"
 GDR_Delegate_Penal_Code_Drafting_to_Hilde_Benjamin_desc:0 "Connue pour sa fiabilité idéologique et son efficacité impitoyable, Hilde Benjamin veillera à ce que le code pénal reflète le caractère inflexible de notre État socialiste."
 GDR_Aktion_Vermin:0 "Action Vermine"
 GDR_Aktion_Vermin_desc:0 "Pour construire le socialisme, l'État doit rester vigilant contre la décomposition interne. L'Opération Vermin identifiera et neutralisera les ennemis de classe cachés dans le tissu social."
 GDR_Intensify_Cleansing_of_the_Bourgeois_Parties:0 "Intensifier le nettoyage des partis bourgeois"
 GDR_Intensify_Cleansing_of_the_Bourgeois_Parties_desc:0 "Nos partenaires de coalition ne peuvent pas être autorisés à fonctionner comme des bastions réactionnaires. Nous les purgerons de tout élément hostile au socialisme."
 GDR_Firmly_Enshrine_a_Partisan_Judiciary:0 "Consacrer fermement un système judiciaire partisan"
 GDR_Firmly_Enshrine_a_Partisan_Judiciary_desc:0 "Les tribunaux doivent servir la révolution, et non les notions abstraites de « neutralité ». Nous ferons du système judiciaire un outil fiable du Parti."
 GDR_The_National_Front_of_Democratic_Germany_Program:0 "Le programme du Front national pour l'Allemagne démocratique"
 GDR_The_National_Front_of_Democratic_Germany_Program_desc:0 "Ce programme décrit notre vision d'une Allemagne socialiste et unifiée et affirme les principes de gouvernance collective interpartis sous la direction du SED."
 GDR_Reconstruct_the_Potsdamer_Stadtschloss:0 "Reconstruire le château municipal de Potsdam"
 GDR_Reconstruct_the_Potsdamer_Stadtschloss_desc:0 "Reconstruire le Stadtschloss impérial peut sembler contre-intuitif, mais le réaffecter à des fonctions socialistes peut symboliser le triomphe du nouveau sur l'ancien."
 GDR_Emphasize_Reconstruction_and_Housing:0 "Mettre l'accent sur la reconstruction et le logement"
 GDR_Emphasize_Reconstruction_and_Housing_desc:0 "On ne peut pas demander à notre peuple de construire le socialisme tout en vivant dans les ruines. Une attention renouvelée accordée au logement et aux infrastructures renforcera à la fois le moral et la loyauté."
 GDR_Investigate_the_Internal_Zionist_Conspiracy:0 "Enquêter sur la conspiration sioniste interne"
 GDR_Investigate_the_Internal_Zionist_Conspiracy_desc:0 "Certains parlent d'influence étrangère et de sabotage. Qu'elle soit réelle ou fabriquée, la menace de subversion sioniste peut servir des objectifs politiques."
 GDR_Establish_Refugee_Resettlement_Commission:0 "Créer une commission de réinstallation des réfugiés"
 GDR_Establish_Refugee_Resettlement_Commission_desc:0 "Avec des millions de personnes déplacées, nous devons gérer efficacement les flux de population. Une commission formelle de réinstallation nous permettra de contrôler la démographie de la République."
 GDR_Deemphasize_Class_Struggle:0 "Désaccentuer la lutte des classes"
 GDR_Deemphasize_Class_Struggle_desc:0 "Dans cette phase de transition, les appels constants au conflit de classes peuvent faire plus de mal que de bien. La stabilité exige un ton plus conciliant, ne serait-ce que temporairement."
 GDR_Tolerate_Small_and_Medium_Level_Businesses:0 "Tolérer les petites et moyennes entreprises"
 GDR_Tolerate_Small_and_Medium_Level_Businesses_desc:0 "Plutôt que d'imposer une collectivisation prématurée, nous tolérerons certaines entreprises privées... tant qu'elles resteront politiquement obéissantes et économiquement utiles."
 GDR_The_Problem_of_Social_Spending:0 "Le problème des dépenses sociales"
 GDR_The_Problem_of_Social_Spending_desc:0 "Les ressources sont limitées et la générosité coûte cher. Nous devons entamer des conversations difficiles sur la durabilité de nos programmes sociaux dans les conditions actuelles."
 GDR_Provide_Incentives_for_Voluntary_Agricultural_Collectivization:0 "Fournir des incitations à la collectivisation agricole"
 GDR_Provide_Incentives_for_Voluntary_Agricultural_Collectivization_desc:0 "Plutôt que d'imposer le respect des règles, nous encouragerons la collectivisation par le biais d'incitations dans l'espoir de conquérir les campagnes par la persuasion plutôt que par la force."
 GDR_Delay_Militarization_Efforts:0 "Retarder les efforts de militarisation"
 GDR_Delay_Militarization_Efforts_desc:0 "Même si la défense reste importante, une militarisation hâtive pourrait épuiser les ressources et provoquer une agression occidentale. Pour l'instant, nous nous concentrons ailleurs."
 GDR_Stabilizing_the_Republic:0 "Stabiliser la République"
 GDR_Stabilizing_the_Republic_desc:0 "Avec la mise en place de nouvelles institutions et le déclin de la résistance, le moment est venu de stabiliser et de consolider notre État socialiste."
 GDR_Enshrine_the_Cult_of_the_Spanish_Civil_War:0 "Consacrer le culte de la guerre civile espagnole"
 GDR_Enshrine_the_Cult_of_the_Spanish_Civil_War_desc:0 "La lutte espagnole reste un phare mythique pour les gauchistes du monde entier. Nous consacrerons son héritage en tant que point de ralliement moral pour les socialistes du monde entier."
 GDR_A_Deal_with_the_Church:0 "Un accord avec l'Église"
 GDR_A_Deal_with_the_Church_desc:0 "Une guerre ouverte avec l'Église pourrait s'avérer imprudente. Un arrangement discret, reconnaissant leur rôle limité tout en garantissant notre domination, est une alternative pragmatique."
 GDR_Consider_Increasing_Church_Taxes:0 "Envisagez d'augmenter les impôts de l'Église"
 GDR_Consider_Increasing_Church_Taxes_desc:0 "L'Église jouit depuis longtemps de privilèges financiers. Augmenter leurs impôts pourrait affaiblir leur influence et financer des projets plus pratiques."
 GDR_Eliminate_Regional_Government:0 "Éliminer le gouvernement régional"
 GDR_Eliminate_Regional_Government_desc:0 "Le fédéralisme est une relique de la décentralisation bourgeoise. Nous devons centraliser entièrement le pouvoir à Berlin pour garantir l'unité et l'efficacité."
 GDR_The_Law_on_Maternal_and_Child_Protection_and_Womens_Rights:0 "Adopter une législation sur les droits des femmes"
 GDR_The_Law_on_Maternal_and_Child_Protection_and_Womens_Rights_desc:0 "Le véritable socialisme doit inclure l'égalité des sexes. Cette loi garantira la protection des femmes et des enfants, réaffirmant l'engagement de notre État en faveur d'une politique sociale progressiste."
