 PRC_SOV_The_Chinese_Thaw_desc:0 "Nous avons remporté la victoire sur les oppresseurs, nous devons maintenant prouver que nous ne suivrons pas leurs traces. Il est temps pour nous de nous lancer dans une campagne de réforme et de libéralisation."
 PRC_SOV_Drastically_Reduce_State_Repression_desc:0 "Les gens s'irritent sous une surveillance excessive, il est temps d'adopter une approche plus détendue de la gouvernance."
 PRC_SOV_Demilitarize_the_Federal_Police_desc:0 "La police civile n'a pas besoin d'armes ou de véhicules militaires."
 PRC_SOV_Expand_Peoples_Daily_desc:0 "Un public informé est un public productif. Le Quotidien du Peuple doit être élargi pour couvrir toute l'actualité en Chine."
 PRC_SOV_Abolish_Summary_Executions_desc:0 "Exécuter nos prisonniers sur la base de preuves circonstancielles ou de simples témoignages est de la folie. Tous les accusés méritent un procès digne de ce nom."
 PRC_SOV_Allow_Controlled_Criticism_of_the_CPC_desc:0 "On peut apprendre beaucoup des critiques constructives ; ouvrons des canaux où les gens peuvent exprimer correctement leurs préoccupations."
 PRC_SOV_Clear_Out_the_Laogai_System_desc:0 "Comme les goulags soviétiques, les laogai se sont révélés plus nuisibles que bénéfiques à la population. Il est temps de les éliminer."
 PRC_SOV_Address_the_Growing_Social_Justace_Movement_desc:0 "Une société socialiste ne fait aucune discrimination fondée sur la race ou le sexe. Dans un pays comme la Chine qui a une culture patriarcale de longue date, cette dernière provoquera des conflits."
 PRC_SOV_Begin_the_Cultural_Liberation_Movement_desc:0 "Cependant, les anciennes traditions ont été la cause de nombreux maux dans le passé de la Chine. Il est temps de défaire ces notions dépassées !"
 PRC_SOV_Stigmatize_Feminist_Activism_desc:0 "Toutefois, reconnaître les principales différences entre les hommes et les femmes ne constitue pas une discrimination. La biologie dépasse l'idéologie."
 PRC_SOV_Decriminalize_Male_Homosexuality_desc:0 "Quel mal deux citoyens homosexuels pourraient-ils faire à un pays aussi puissant que le nôtre ?"
 PRC_SOV_Promote_a_Conservative_Chinese_Way_of_Life_desc:0 "Deux faces identiques ne font pas une seule pièce."
 PRC_SOV_Promote_Gender_Coexistence_in_the_PLA_desc:0 "Toute femme désireuse et capable de se battre pour la libération ouvrière mérite sa place au sein de l'APL !"
 PRC_SOV_Implement_Further_Dengist_Economic_Reforms_desc:0 "Les réformes de Deng se sont révélées fructueuses, mais il estime que davantage de prospérité l'attend. Mettons en oeuvre ses idées encore plus loin !"
 PRC_SOV_Rehabilitate_KMT_Economic_Specialists_desc:0 "Au sein du KMT, il y avait de brillants économistes. Peut-être pourrions-nous intégrer ceux qui ont des idées similaires aux nôtres dans l'appareil d'État ?"
 PRC_SOV_Expand_Agricultural_Privatization_desc:0 "Une petite privatisation de l'agriculture s'est avérée bénéfique. Tant qu'elle pourra rester sous contrôle et non corrompue, nous continuerons à l'autoriser."
 PRC_SOV_Close_Unprofitable_State_Corporations_desc:0 "Les entreprises qui survivent uniquement grâce aux subventions de l'État constituent un fardeau improductif pour notre économie. Débarrassez-vous-en !"
 PRC_SOV_Increase_Eastern_Bloc_Trade_desc:0 "Tout comme dans les temps anciens, le commerce doit circuler entre l'Est et l'Ouest !"
 PRC_SOV_Implement_Bottom_Up_Planning_desc:0 "Certains en Occident pensent que plus les membres les plus riches de la société sont riches, plus les classes inférieures deviennent prospères. Nous savons que c'est du pur fantasme."
 PRC_SOV_Declare_a_New_Age_of_Chinese_Cultural_Freedom_desc:0 "Jamais auparavant dans l'histoire chinoise le peuple n'a été aussi libre qu'aujourd'hui, tout cela grâce à la révolution prolétarienne !"
 PRC_SOV_Begin_Large-Scale_Recovery_Programs_desc:0 "Deux guerres civiles ont mis à mal notre capacité industrielle. Une fois reconstruite, la Chine sera l'atelier du monde !"
 PRC_SOV_Attempt_to_Industrialize_Eastern_China_desc:0 "Le relief montagneux du centre de la Chine en fait un endroit difficile à industrialiser, mais ce n'est pas une excuse ! La Chine toute entière sera moderne et productive !"
 PRC_SOV_Deport_Workers_to_Golmud_desc:0 "Certaines de nos provinces sont aux prises avec une surpopulation. Pour résoudre ce problème, nous déplacerons de larges pans de la population vers des zones où il y a de la place pour la croissance et le développement."
 PRC_SOV_Found_the_Yumen_Textile_Plant_desc:0 "Les textiles chinois font l'envie du monde entier depuis des siècles, nous devrions en augmenter notre production !"
 PRC_SOV_Modernize_the_Chinese_Power_Grid_desc:0 "À mesure que notre industrie se développe, nos besoins en énergie brute augmentent également. Il est temps d'étendre et de moderniser notre réseau."
 PRC_SOV_Update_the_Nanjing_Electrical_Network_desc:0 "Nanjing est une ville immense avec de nombreux besoins, le principal d'entre eux étant actuellement davantage d'électricité."
 PRC_SOV_Construct_the_Xi'ning_National_Power_Plant_desc:0 "Un réseau centralisé est ce dont nous avons besoin pour alimenter toute la Chine en électricité."
 PRC_SOV_Begin_Researching_Nuclear_Power_desc:0 "L'atome est capable d'une destruction infinie, mais il détient aussi le secret d'une puissance infinie. Nous devons découvrir ce secret."
 PRC_SOV_Attempt_to_Stem_Chronic_Illiteracy_desc:0 "À mesure que notre population augmente, notre pénurie d'enseignants qualifiés augmente également. Il s'agit d'un problème récurrent qui nécessite une solution permanente."
 PRC_SOV_Rapidly_Increase_the_Education_Budget_desc:0 "Les écoles doivent être correctement financées afin de fournir une bonne éducation !"
 PRC_SOV_Implement_Basic_Math_Programs_desc:0 "Les mathématiques sont la porte d'entrée vers de nombreuses carrières, ainsi que vers une gestion financière responsable. Tous les étudiants doivent le maîtriser !"
 PRC_SOV_Introduce_Marxist_Literature_in_School_desc:0 "Dès notre plus jeune âge, on nous enseigne les qualités du socialisme et le bien qu'il apporte à tous !"
 PRC_SOV_Found_the_Peking_Institute_of_Engineering_desc:0 "Pour que la Chine puisse atteindre son plein potentiel en tant que puissance industrielle, elle a besoin d'ingénieurs qualifiés. Une institution dédiée à l'étude et au développement de machines avancées nous fournira lesdits ingénieurs."
 PRC_SOV_Greatly_Expand_Simplified_Chinese_desc:0 "Le chinois simplifié a été introduit pour accroître l'alphabétisation. Même s'il a connu un grand succès, de nombreux mots et personnages peuvent encore y être ajoutés."
 PRC_SOV_Continue_Agrarian_Reform_desc:0 "Une fois l'ensemble de la Chine libéré, il est temps d'introduire la réforme agricole dans le reste du pays."
 PRC_SOV_Decentralize_Agricultural_Quota_Management_desc:0 "Notre pays est devenu si grand qu'il n'est plus possible de créer un bureau central unique pour gérer l'ensemble du secteur agricole. Les bureaux locaux fixeront désormais les quotas appropriés."
 PRC_SOV_Collectivize_Western_Economic_Assets_desc:0 "Tous les avoirs étrangers placés en Chine sous le règne du KMT seront nationalisés et mis au service du peuple chinois."
 PRC_SOV_Purchase_Tractors_From_the_Eastern_Bloc_desc:0 "Les tracteurs sont trompeurs ; ces machines d'apparence simple ont transformé l'agriculture dans le monde entier. Nous en avons besoin ici aussi."
 PRC_SOV_Increase_Pesticide_Manufacturing_desc:0 "Là où il y a des fermes, il y aura toujours des parasites. Notre défense contre cela consiste à développer des pesticides puissants qui les tueront sans empoisonner notre alimentation."
 PRC_SOV_Found_the_Nanjing_Cooperative_desc:0 "L'ancienne capitale du sud abritera une commune dédiée à la production alimentaire de notre pays."
 PRC_SOV_Launch_the_Second_5_Year_Plan_desc:0 "Le moment est venu d'élaborer un autre plan quinquennal. Une fois terminé, les prouesses industrielles de la Chine seront inégalées !"
 PRC_SOV_Implement_Consumer_Socialism_desc:0 "Nous devrions nous concentrer sur la production de biens destinés au marché civil."
 PRC_SOV_Subsidize_Automobile_Manufacturing_desc:0 "À mesure que les chemins de terre et les chemins pavés de la Chine deviennent des routes asphaltées, nous aurons besoin de véhicules modernes pour les emprunter."
 PRC_SOV_Subsidize_the_Chinese_Arms_Industry_desc:0 "Nous devrions nous concentrer sur la production de matériel militaire."
 PRC_SOV_Construct_the_Shanghai_Tank_Manufacturing_Plant_desc:0 "Aucune armée moderne n'est complète sans un char puissant !"
 PRC_SOV_Reinvigorate_the_Central_Chinese_Economy_desc:0 "Notre pays est fort et uni, mais notre économie est à la traîne. Nous devons résoudre ce problème immédiatement !"
 PRC_SOV_Launch_the_South_Chinese_Industrialization_Program_desc:0 "Il est temps que le sud de la Chine atteigne son plein potentiel industriel !"
 PRC_SOV_Adopt_the_Virgin_Lands_Campaign_desc:0 "Le nord-ouest de la Chine est un désert aride, mais avec les dernières avancées en matière d'agriculture et d'irrigation, nous pouvons en faire un paradis agricole !"
 PRC_SOV_Modernize_Irrigation_Around_the_Yellow_River_desc:0 "Le peuple chinois a appris à maîtriser le fleuve Jaune il y a d'innombrables générations, mais des améliorations peuvent être apportées grâce à notre connaissance accrue des systèmes d'irrigation."
 PRC_SOV_Introduce_Maize_Production_in_Yunnan_desc:0 "Le sol du Yunnan est privilégié pour la production de maïs !"
 PRC_SOV_Attempt_Full_Agricultural_Sustainability_in_Qinghai_desc:0 "Si nous parvenons à mettre en place un système agricole autonome au Qinghai, il n'y a aucune partie de la Chine que nous ne puissions transformer !"
 PRC_SOV_Relocate_Farms_to_Central_China_desc:0 "Nous allons déplacer une partie de notre industrie agricole vers le centre de la Chine afin d'augmenter la capacité de production alimentaire de la région."
 PRC_SOV_Expand_Fertilizer_Production_desc:0 "Aucune ferme moderne n'est complète sans engrais. Nous en aurons besoin en grande quantité pour cette campagne !"
 PRC_SOV_Modernize_the_Rural_Chinese_Infrastructure_desc:0 "Même le village le plus reculé doit disposer d'infrastructures modernes ! Nous ne tolérerons pas les demi-mesures."
 PRC_SOV_Pave_Coastal_Road_Systems_desc:0 "Nous ouvrirons de nouvelles routes pour relier toutes nos villes côtières entre elles !"
 PRC_SOV_Expand_Rail_Lines_Across_the_Gobi_Desert_desc:0 "Afin de transporter rapidement et efficacement les marchandises vers le centre de la Chine, nos chemins de fer doivent être étendus et modernisés."
 PRC_SOV_Construct_the_Nanjing_Metro_System_desc:0 "De nombreux pays construisent de vastes systèmes ferroviaires souterrains qui remplissent un double objectif : le transport rapide des personnes dans les villes et la protection en cas de guerre nucléaire. Nous en construirons un pour nous-mêmes."
 PRC_SOV_Explore_Weathering_Techniques_in_Manchuria_desc:0 "Compte tenu du climat de la région, il serait judicieux d'altérer ou d'hiverner nos infrastructures en Mandchourie."
 PRC_SOV_Create_the_Peking-Irkutsk_Railroad_desc:0 "Un chemin de fer reliant Pékin à Irkoutsk via la Mongolie stimulera le commerce entre les trois nations !"
 PRC_SOV_Begin_Domestic_Tooling_Research_desc:0 "Le moment est à nouveau venu d'échanger nos anciens outils contre de nouveaux."
 PRC_SOV_Research_Efficient_Farming_Techniques_desc:0 "Il y a encore de nouvelles techniques à découvrir concernant l'agriculture, voyons ce que nous pouvons apprendre !"
 PRC_SOV_Construct_the_Yangtze_Hydroelectric_Dam_desc:0 "Sun Yat-sen avait une vision grandiose : un barrage enjambant le Yangtsé. Grâce à notre connaissance des techniques de construction avancées et de l'énergie hydroélectrique, cette vision peut devenir réalité !"
 PRC_SOV_Victory_in_the_Second_Chinese_Civil_War_desc:0 "Nous avons été poussés au bord de l'oubli mais sommes revenus en libérateurs victorieux ! Maintenant que la guerre est enfin terminée, nous pouvons commencer à intégrer les provinces et mettre fin à la loi martiale."
 PRC_SOV_Begin_Mopping_Up_KMT_Strongholds_desc:0 "Il reste quelques résistants nationalistes, mais ils constituent une menace infime. Y mettre fin sera facile."
 PRC_SOV_Establish_the_Wuhan_Soviet_desc:0 "Les provinces du Yunnan et du Sichuan sont prêtes à être intégrées."
 PRC_SOV_Nationalize_Remaining_Heavy_Industry_desc:0 "Il existe quelques actifs et industries qui n'ont pas été pleinement intégrés dans le nouveau système socialiste."
 PRC_SOV_Announce_Stability_Across_the_Mainland_desc:0 "Tous les districts militaires ont été intégrés à la République populaire. Désormais, toute la Chine peut avancer ensemble !"
 PRC_SOV_Leave_the_Warsaw_Pact_desc:0 "Il devient très difficile pour l'URSS de maintenir correctement l'ordre sur deux continents. Pour atténuer ce problème, nous proposons que la Chine s'occupe de l'Asie tandis que l'Union soviétique se concentre sur l'Europe."
 PRC_SOV_Maintain_Positive_Relations_with_the_Eastern_Bloc_desc:0 "Beaucoup s'empresseront de qualifier notre sortie du Pacte de Varsovie de divorce amer, mais c'est loin d'être la réalité. La Chine et ses camarades européens entretiendront toujours des relations solides."
 PRC_SOV_Increase_Eastern_Bloc_Economic_Integration_desc:0 "Le commerce doit circuler de Berlin jusqu'à Pékin ! La prospérité appartient à nous tous !"
 PRC_SOV_Found_the_Sino-DDR_Automobile_Program_desc:0 "Les voitures allemandes sont des merveilles mécaniques, nos gens adoreraient les conduire !"
 PRC_SOV_Create_the_Sino-Polish_Tank_Commission_desc:0 "La Pologne développe des chars très impressionnants. Il serait sage d'échanger des idées et des conceptions."
 PRC_SOV_Increase_Computer_Technology_Sharing_desc:0 "Les ordinateurs deviennent rapidement un élément essentiel de notre infrastructure militaire et civile. Partageons avec nos camarades ce que nous avons appris !"
 PRC_SOV_Expand_Soviet_Trade_Agreements_desc:0 "L'Union soviétique reste notre principal partenaire commercial. Voyons quelles nouvelles offres nous pouvons conclure !"
 PRC_SOV_Propose_the_Man_for_Machine_Deal_desc:0 "L'Union soviétique a cruellement besoin d'hommes que nous pouvons lui fournir. En attendant, nous avons besoin de plus d'industries, ce qu'elles peuvent nous fournir. La solution est évidente."
 
 PRC_SOV_Maintain_Resource-Based_Agreements_desc:0 "Nos collaborateurs ne sont pas des outils échangeables contre du profit."
 PRC_SOV_Construct_the_Pekin-Irkutsk_Oil_Pipeline_desc:0 "Une fois ce pipeline terminé, nos industries disposeront de tout le pétrole dont elles ont besoin !"
 PRC_SOV_Allow_Soviet_Military_Shipments_Through_China_desc:0 "Il y a des camarades dans notre sud qui luttent courageusement contre l'impérialisme. Autoriser les expéditions soviétiques à travers notre territoire serait une aubaine considérable pour leur cause."
 PRC_SOV_Coordinate_Grand_Military_Strategy_with_the_Soviet_Union_desc:0 "Nous sommes certains que les Soviétiques ont un plan pour propager la révolution. Si nous nous coordonnons, nous serons imparables."
 PRC_SOV_Pursue_Further_Comecon_Integration_desc:0 "Une coopération plus poussée entre les membres du Comecon doit être poursuivie."
 PRC_SOV_Begin_Vostok-62_desc:0 "Vostok-62 est le nom de code d'un exercice militaire coordonné entre plusieurs États communistes. Dans cet exercice, nous verrons dans quelle mesure une coalition socialiste internationale se comporterait sur le champ de bataille."
 PRC_SOV_Attempt_to_Salvage_the_Great_Asian_Revolution_desc:0 "De nombreux mouvements socialistes en Asie ont perdu espoir lorsque les nationalistes ont failli nous détruire. Nous devons raviver le feu de la révolution à travers le continent !"
 PRC_SOV_Reinforce_CCP_Influence_in_the_East_desc:0 "Le Parti communiste a conduit la Chine vers la grandeur, il peut faire de même pour d'autres nations d'Asie !"
 PRC_SOV_Contact_Afghan_Communists_desc:0 "L'Afghanistan est frontalier des deux principales puissances socialistes du monde. L'avoir comme allié fera grandement avancer notre cause."
 PRC_SOV_Support_Pakistani_Leftist_Parties_desc:0 "Le Pakistan est une jeune nation née des cendres de l'impérialisme. Ils sont les principaux candidats à la révolution socialiste."
 PRC_SOV_Aid_Moderates_in_the_White_Flag_Faction_desc:0 "La faction du drapeau blanc du Parti communiste de Birmanie est la plus proche de nos objectifs et de nos idées ; nous les aiderons à apporter la révolution dans leur pays !"
 PRC_SOV_Support_Communism_in_Southeast_Asia_desc:0 "L'Asie du Sud-Est abrite de nombreux mouvements socialistes et révolutions réussies. Ce sont nos camarades et nous devons leur apporter notre soutien !"
 PRC_SOV_Heavily_Support_North_Vietnam_desc:0 "L'Indonésie continue de lutter contre les puissances impérialistes ; ils ont besoin de notre aide !"
 PRC_SOV_Outreach_to_the_Pathet_Lao_desc:0 "Le Hukbalahap était à l'origine une force combattante anti-japonaise, mais s'est transformé en un mouvement de guérilla marxiste-léniniste. Avec notre aide, ils peuvent étendre leurs opérations !"
 PRC_SOV_Promote_Orthodox_Leninism_in_the_Khmer_Rouge_desc:0 "Les Khmers rouges suivent leur propre type de socialisme. Peut-être pouvons-nous les pousser vers une vision plus orthodoxe."
 PRC_SOV_An_Ultimatum_to_Tibet_desc:0 "Le Tibet est un État illégitime occupant le territoire chinois ! Nous leur offrirons une chance de se soumettre pacifiquement ou d'être intégrés par la force."
 PRC_SOV_Allow_the_Dalai_Lama_to_Remain_in_Tibet_desc:0 "Tant que Gyatso reste concentré sur les questions spirituelles et s'abstient de toute critique inutile de notre politique, il peut rester à Xizang."
 PRC_SOV_Exile_the_Buddhist_Leadership_desc:0 "Aucun Dali Lama n'acceptera jamais notre domination sur le Tibet ni ne s'abstiendra de faire de la politique. Débarrassez-vous de lui et de ses semblables gênants."
 PRC_SOV_Press_Indian_Territorial_Claims_desc:0 "L'impérialisme colonial a dépouillé la Chine de ses territoires légitimes dans l'Himalaya ! Il faut les rendre immédiatement !"
 PRC_SOV_Outreach_to_the_DPRK_desc:0 "La Chine et la Corée ont toujours entretenu des relations étroites. Voyons si Kim Il-sung souhaite maintenir cette tradition."
 PRC_SOV_Support_the_Kim_Regime_desc:0 "Des décennies d'impérialisme ont causé de grandes difficultés en Corée. Nous aiderons nos camarades à reconstruire !"
 PRC_SOV_Launch_the_January_Coup_desc:0 "Kim est un dangereux mégalomane qui profite constamment de notre générosité. Pour le bien du peuple coréen, il doit être éliminé."
 PRC_SOV_Found_the_Bejing_Pact_desc:0 "En tant qu'équivalent oriental du Pacte de Varsovie, le Pacte de Pékin promet un soutien mutuel et une défense à tous les États membres contre l'agression impérialiste."
 PRC_SOV_Pressure_Member_States_to_Join_Comecon_desc:0 "Le Comecon a contribué à reconstruire l'Europe sur les cendres du bellicisme fasciste, il contribuera également à reconstruire l'Asie !"
 PRC_SOV_Model_Military_Command_After_the_Warsaw_Pact_desc:0 "Notre structure militaire doit être identique à celle de nos partenaires européens et soviétiques."
 PRC_SOV_Khrushchev's_Fall_From_Power_desc:0 "La vague de réformes libérales de l'Union soviétique a connu une fin brutale. Devrions-nous emboîter le pas ou tracer notre propre voie ?"
 PRC_SOV_Appoint_Chen_Yi_Commander_of_Central_Asian_Operations_desc:0 "Le maréchal Chen Yi s'est montré très compétent. Il est le meilleur candidat pour diriger nos opérations militaires en Asie centrale."
 PRC_SOV_Abandon_Eastern_Ambitions_desc:0 "Une guerre avec l'Inde serait une affaire longue et coûteuse, mais elle n'en vaut tout simplement pas la peine. Au lieu de cela, nous tenterons de coexister pacifiquement avec eux et d'accroître notre influence au sein de leur gouvernement."
 PRC_SOV_Escalate_Tensions_With_India_desc:0 "Certaines des terres que l'Inde revendique comme siennes ont été volées aux provinces chinoises à une époque de grande faiblesse ! Il faut se battre pour les récupérer !"
 PRC_SOV_Support_Indian_Socialism_desc:0 "Il existe de nombreux mouvements socialistes en Inde, nous devrions trouver ceux qui sont favorables à notre politique et les soutenir !"
 PRC_SOV_Demand_Arunachal_Pradesh_desc:0 "Zangnan fait légitimement partie du Tibet, qui fait légitimement partie de la Chine ! L'Inde doit restituer cette terre immédiatement !"
 PRC_SOV_Conduct_Military_Drills_in_Tibet_desc:0 "Si jamais une intervention s'avérait nécessaire en Inde, le terrain tibétain constituerait le terrain d'entraînement idéal pour les conditions auxquelles nos troupes seraient confrontées."
 PRC_SOV_Abandon_the_Chinese_Liberalization_Effort_desc:0 "La libéralisation du communisme s'est avérée plus néfaste que bénéfique, il est temps de revenir à nos racines marxistes-léninistes."
 PRC_SOV_Purge_Deng_Xiaoping_desc:0 "Les réformes économiques de Deng ne sont qu'un capitalisme de gauche, nous n'avons plus besoin de lui ni de ses idées insensées."
 PRC_SOV_Ramp_Up_Religious_Persecution_desc:0 "La religion n'a pas sa place dans un véritable État communiste. Ceux qui s'accrochent encore à des superstitions dépassées doivent être amenés à voir la vraie vérité."
 PRC_SOV_Maintain_Party_Stability_desc:0 "La stabilité du Parti est la stabilité de l'État."
 PRC_SOV_Increase_Police_Presence_in_Daily_Life_desc:0 "Afin de maintenir l'ordre et de garantir la décence publique, la police civile sera considérablement renforcée."
 PRC_SOV_Promote_Han_Nationalism_desc:0 "La Chine a toujours prospéré sous la direction de son plus grand groupe ethnique. Pour accroître l'unité, les coutumes et traditions Han seront favorisées par rapport à toutes les autres."
 PRC_SOV_Crack_Down_on_Student_Activism_desc:0 "La rébellion fait naturellement partie du processus de maturité, mais il y a des moments où les enfants outrepassent. Un bon parent disciplinera son enfant et le mettra sur la bonne voie."
 PRC_SOV_Strengthen_the_Party_Apparatus_desc:0 "Le Parti doit être présent dans tous les aspects de la société chinoise moderne. C'est ce qui nous mène à la grandeur !"
 PRC_SOV_Endorse_the_Invasion_of_Czechoslovakia_desc:0 "Nous avons été témoins des dangers du révisionnisme. La Tchécoslovaquie doit être réintégrée dans le giron par tous les moyens nécessaires."
 PRC_SOV_Launch_the_Chinese_Spring_desc:0 "La campagne de libéralisation a été un grand succès, mais ce n'était que le début !"
 PRC_SOV_Establish_a_10-Year_Term_Limit_desc:0 "L'établissement d'une limite de mandats garantira le transfert constant du pouvoir et nous protégera contre le despotisme."
 PRC_SOV_Strengthen_the_National_Peoples_Congress_desc:0 "Le transfert d'une partie du pouvoir du président à l'Assemblée populaire nationale démocratisera le système et encouragera la coopération intergouvernementale."
 PRC_SOV_Chairman_Kai_Feng_desc:0 "Alors que Wang Ming approche de la fin de son mandat, le Congrès a élu Kai Feng comme prochain président."
 PRC_SOV_Expand_the_Central_Party_School_desc:0 "L'École centrale du Parti est l'endroit où nos futurs membres du parti apprennent à servir le peuple. Plus il est important, plus il profite à la Chine."
 PRC_SOV_Appoint_Zang_Qinqui_Minister_of_Central_Planning_desc:0 "Zang Qinqui était membre des 28 bolcheviks et un commandant militaire accompli. Elle sera une excellente ministre de la Planification centrale."
 PRC_SOV_Break_up_Peoples_Daily_desc:0 "Le Quotidien du Peuple est devenu un véritable gâchis. Il est nécessaire d'avoir plusieurs organes d'information plus petits."
 PRC_SOV_Accept_Further_Economic_Liberalization_desc:0 "Les résultats de la libéralisation économique ont été extrêmement positifs. Deng Xiaoping est un génie !"
 PRC_SOV_Reintroduce_Mass_Line_Politic_desc:0 "Nous ne pouvons nier que la politique de Mao consistant à recueillir les idées directement auprès du peuple et à les transformer en politique était bonne. Nous devrions le réintroduire."
 PRC_SOV_60s_Peoples_Liberation_Army_desc:0 "Alors qu'une nouvelle décennie se profile, l'APL doit rester bien équipée et forte !"
 PRC_SOV_60s_PLA_Air_Force_desc:0 "Nous ne pouvons pas négliger le ciel ; nous avons besoin d'une force aérienne forte !"
 PRC_SOV_60s_Invest_in_Missle_Technology_desc:0 "Il est clair que les missiles constituent le meilleur moyen de transporter des charges nucléaires en cas de guerre. Nous devons maîtriser ces nouvelles armes puissantes !"
 
 PRC_SOV_60s_Produce_the_Chengdu_J_7_desc:0 "Basé sur le MiG-21, le Chengdu J-7 sera une merveille d'ingénierie aéronautique !"
 PRC_SOV_60s_Begin_Developing_our_First_Domestic_Jet_Fighter_desc:0 "La technologie des avions à réaction a progressé rapidement au cours des dix dernières années, voyons comment nous pouvons l'intégrer dans nos chasseurs !"
 PRC_SOV_60s_Establish_the_Peoples_Liberation_Army_Rocket_Force_desc:0 "Une branche militaire dédiée à la gestion de nos capacités de missiles et de nos systèmes de défense est essentielle face à l'évolution de la guerre."
 PRC_SOV_60s_PLA_Ground_Forces_desc:0 "Probablement la branche la plus remarquable de l'APL, la Force terrestre a traversé de nombreuses épreuves au cours des dix dernières années."
 PRC_SOV_60s_Learn_from_the_PLA_Campaign_desc:0 "Il y a beaucoup de choses que nous pouvons apprendre des succès et des échecs des deux guerres civiles chinoises."
 PRC_SOV_60s_Continue_Soviet_Weapon_Imports_desc:0 "Jusqu'à ce que notre capacité militaro-industrielle rattrape celle de l'Union soviétique, nous devrons compter sur les importations d'armes."
 PRC_SOV_60s_The_Type_63_Tank_desc:0 "Le prototype du char amphibie Type 63 montre un grand potentiel, passons en production !"
 PRC_SOV_60s_Develop_the_Type_63_Assault_Rifle_desc:0 "Il est temps de développer notre propre fusil d'assaut !"
 PRC_SOV_60s_PLA_Navy_desc:0 "Autrefois, la grande marine chinoise aurait pu nous protéger de toute menace, mais l'arrogance et la myopie des empereurs despotiques nous ont laissés sans défense ! Cela ne pourra plus jamais se reproduire !"
 PRC_SOV_60s_Naval_Buildup_desc:0 "Tout autour de nous, les puissances navales ennemies rassemblent leurs forces. Nous ne pouvons pas rester dans la poussière !"
 PRC_SOV_60s_Invest_in_Naval_Aviation_desc:0 "Les porte-avions suppriment le besoin de pistes d'atterrissage terrestres. Dans un océan aussi vaste que le Pacifique, il s'agit d'un avantage crucial."
 PRC_SOV_60s_Political_Commissars_desc:0 "L'éducation politique de nos soldats est tout aussi importante que leur éducation militaire !"
 PRC_SOV_60s_Expand_Coastal_Fortifications_desc:0 "Plus jamais la Chine ne perdra ses villes ou ses ports côtiers au profit de puissances impérialistes agressives !"