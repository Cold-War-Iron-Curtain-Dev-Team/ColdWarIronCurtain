l_french:
 PRC_TIBETAN.1.a:0 "Vive la libération pacifique du Tibet"
 PRC_50s_Rework_event.1.t:0 "Cheng Qian a fait défection"
 PRC_50s_Rework_event.1.d:0 "Après la campagne de traversée du fleuve Yangtze, l'armée du Kuomintang s'est retirée dans le Hunan, perturbant la paix et la stabilité de la province et opprimant la population du Hunan. Avec l'avancée victorieuse de l'Armée populaire de libération dans le Hunan et sous l'impulsion d'individus progressistes, le général patriote local Cheng Qian et Chen Mingren ont quitté la ville pour négocier avec l'APL et ont accepté un accord de paix. Ils ont répondu au soulèvement, conduisant à la libération pacifique de la province du Hunan."
 PRC_50s_Rework_event.1.a:0 "Hourra!"
 PRC_50s_Rework_event.2.t:0 "Long Yun a fait défection"
 PRC_50s_Rework_event.2.d:0 "Après la victoire de la guerre anti-japonaise, le leader réactionnaire Chiang Kai-shek a pris le contrôle du Yunnan, autrefois connu pour sa liberté et son ouverture. Il a déployé les troupes du Yunnan sur le champ de bataille du nord-est, soumettant la population du Yunnan à l'oppression. Aujourd'hui, alors que l'Armée populaire de libération avance victorieusement vers le Grand Sud-Ouest, l'échec des réactionnaires du Kuomintang est devenu inévitable. Les généraux patriotiques du Yunnan, Long Yun et Lu Han, ont écrasé le projet de Chiang Kai-shek d'établir une base anticommuniste au Yunnan. Ils ont déclaré leur allégeance au gouvernement populaire, conduisant à la libération pacifique du Yunnan."
 PRC_50s_Rework_event.2.a:0 "La tendance historique est imparable."
 PRC_50s_Rework_event.3.t:0 "Demande d'assistance navale soviétique"
 PRC_50s_Rework_event.3.d:0 "Ces derniers mois, les forces du Parti communiste chinois ont vaincu les réactionnaires du Kuomintang comme par une tempête. Mais les communistes, sans expérience des opérations de débarquement, étaient impuissants face à la forteresse taïwanaise que Chiang Kai-shek exploitait depuis si longtemps. En conséquence, les communistes chinois nous ont transmis une lettre de demande d'aide, dans laquelle ils espéraient que la flotte du Pacifique de la Marine rouge fournirait du matériel de débarquement et un soutien en armes pour aider à la libération de Taiwan et de ses îles voisines."
 PRC_50s_Rework_event.3.a:0 "Refusé, on ne peut pas risquer la faible flotte du Pacifique pour soutenir les communistes chinois."
 PRC_50s_Rework_event.4.t:0 "Soutien au Parti communiste de Taiwan"
 PRC_50s_Rework_event.4.d:0 "Il y a quelques années, les organisations de base du Parti communiste taïwanais ont été presque anéanties par le régime réactionnaire de Chiang Kai-shek en raison de la défection de l'officier des renseignements de notre Parti, Tsai Hsiao-Chien. Maintenant que nous pouvons enfin nous libérer pour régler cette question, le Parti et l'État enrôleront des volontaires parmi tous les niveaux de membres et de cadres du Parti au Fujian et des combattants fujianais de l'Armée populaire de libération, armés d'armes, d'équipements et de radios, pour les faire passer clandestinement à travers le détroit de Taiwan avec l'aide d'officiers des renseignements qui se rendent à Taiwan pour soutenir le Parti communiste taïwanais déjà très faible."
 PRC_50s_Rework_event.4.a:0 "Nous devons libérer Taiwan"
 PRC_50s_Rework_event.5.t:0 "Bataille de Kinmen"
 PRC_50s_Rework_event.5.d:0 "Vers 00h30 le 25 octobre 1949, nos forces de débarquement furent découvertes et contre-attaquées par les forces blindées nationales alors qu'elles tentaient de percer la ligne défensive. A 1h30 du matin, trois régiments de l'APL sont montés à bord de bateaux en bois et ont débarqué avec succès sur la plage.\nCependant, après le débarquement, les différentes unités furent désorganisées et ne reçurent pas de commandement unifié. Lorsque les troupes débarquant sur l'île ont perdu leur commandement unifié et n'ont pas consolidé leurs positions de tête de pont, elles ont néanmoins mené des opérations conformément à la direction opérationnelle établie et ont pénétré profondément dans l'ennemi. Le 25 octobre à 16h30, le Kuomintang lance une contre-attaque avec l'aide de renforts et de chars. Dans l'après-midi, notre armée subit de lourdes pertes et seules les troupes restantes se rejoignirent à Guning tou et repoussèrent plusieurs contre-attaques de l'armée du Kuomintang.\nEn raison des intempéries et des tirs de l'armée de l'air du Kuomintang, tous nos navires de débarquement ont été détruits. Dans l'après-midi du 27 octobre, nos troupes ont été retrouvées et encerclées par le Kuomintang près du mont ShuangRushan, et nos troupes ont mené des batailles sanglantes jusqu'à l'après-midi du 28 octobre, jusqu'à ce que le chef du 246e régiment, Sun Yuxiu, soit blessé et se suicide, et que les autres soient capturés."
 PRC_50s_Rework_event.5.a:0 "Une minute de silence pour eux"
 PRC_50s_Rework_event.6.t:0 "Campagne pour éliminer les contre-révolutionnaires"
 PRC_50s_Rework_event.6.d:0 "Malgré la victoire de la révolution, les éléments contre-révolutionnaires tapis dans les grandes villes n'ont jamais cessé leurs tentatives illusoires pour renverser le pouvoir populaire. Le plan quinquennal et la victoire de la guerre de Corée nous ont donné confiance dans la cause du développement du pouvoir populaire, mais la survenance successive d'une série d'incidents désagréables nous a refroidis. Dans de nombreux départements et lieux, un grand nombre d'éléments contre-révolutionnaires cachés n'ont pas encore été révélés et purgés, et à mesure que la construction de la nouvelle Chine continue de se développer, ces éléments contre-révolutionnaires cachés dans nos départements importants continueront à empoisonner la nouvelle Chine comme une gangrène sur les os. Une purge est imminente."
 PRC_50s_Rework_event.6.a:0 "Nous devrions nettoyer ce pays."
 PRC_50s_Rework_event.7.t:0 "La clique contre-révolutionnaire de Hu Feng"
 PRC_50s_Rework_event.7.d:0 "Le célèbre écrivain Hu Feng, devenu célèbre à l'époque de la République de Chine, et les membres de son groupe contre-révolutionnaire ont été récemment emprisonnés. On rapporte que les théories littéraires de Hu Feng sont en contradiction avec l'idéologie littéraire rouge nationale actuelle. Bien que Hu Feng soit depuis longtemps une figure marquante de la théorie littéraire de gauche, ses idées ont été critiquées à plusieurs reprises par le camarade Mao Zedong. La raison fondamentale est que Hu Feng s'est opposé au concept « de l'art au service de la politique », proposé par Mao Zedong au Forum de Yan'an sur la littérature et l'art. Malgré de nombreuses critiques, Hu Feng a persisté à s'écarter de la ligne littéraire nationale, adhérant à sa théorie unilatérale et abstraite de l'esprit combatif subjectif, soutenue par un petit groupe de près d'une centaine de personnes qui maintenaient une création littéraire anti-marxiste.\n\nLa théorie de Hu Feng sur l'esprit combatif subjectif, bien que fortement axée sur la subjectivité et l'art authentique, s'est éloignée de l'idéologie littéraire unique de notre pays. Il représente une littérature bourgeoise occidentale typique, négligeant l'héritage littéraire national de la Chine et constitue une théorie artistique anti-Parti et anti-peuple."
 PRC_50s_Rework_event.7.a:0 "Super!"
 PRC_50s_Rework_event.8.t:0 "La clique contre-révolutionnaire Pan Yang"
 PRC_50s_Rework_event.8.d:0 "En février 1954, après que la quatrième session plénière du septième Comité central du Parti communiste chinois eut découvert les activités de conspiration de Gao Gang et Rao Sushi, alors qu'il examinait plus en détail la question de Rao Sushi, on pensait que Rao Sushi, pendant sa présidence du Bureau de la Chine orientale du Parti communiste chinois, ne s'était pas appuyé sur et n'avait pas mobilisé les masses sur la question de la répression des activités contre-révolutionnaires, mais s'était appuyé unilatéralement sur la sécurité publique. pour traiter l'affaire en « utilisant des agents spéciaux pour contrôler les agents spéciaux », ce qui était une erreur de droite et impliquait Yang Fan, alors directeur du Bureau de la sécurité publique de Shanghai. Rao Sushi, pendant sa présidence du Bureau de la Chine orientale du PCC, ne s'est pas appuyé sur et n'a pas mobilisé les masses pour réprimer la contre-révolution, et s'est appuyé unilatéralement sur les organes de sécurité publique pour traiter les cas « au moyen d'agents secrets », commettant ainsi une erreur de droite."
 PRC_50s_Rework_event.8.a:0 "C'est parfaitement logique."
 PRC_50s_Rework_event.10.t:0 "Le premier recensement chinois"
 PRC_50s_Rework_event.10.d:0 "Depuis la guerre de libération, la Chine n'a pas encore procédé à un examen universel de l'ensemble de la population pour confirmer la taille spécifique de la population de notre pays. Le premier recensement national a ainsi été mis sur la table.\nLe Bureau National des Statistiques est responsable de ce recensement. Bien que certains endroits (comme la province de Taiwan et le Tibet) ne se prêtent pas au dépistage direct des populations de guerre, notre tout-puissant Bureau national des statistiques a finalement obtenu des données sur la population locale par certains moyens.\nFinalement, ce recensement a été réalisé avec succès. Le résultat est :"
 PRC_50s_Rework_event.10.a:0 "La population totale du pays est de 610 193 835 habitants"
 PRC_50s_Rework_event.11.t:0 "La nouvelle conférence consultative politique"
 PRC_50s_Rework_event.11.d:0 "Après la victoire de la guerre anti-japonaise, le Parti communiste chinois et le Kuomintang sont parvenus à un accord pour former un gouvernement de coalition et convoquer une conférence consultative politique. Malheureusement, les autorités réactionnaires du Kuomintang ont rompu l'accord et déclenché une guerre civile. Le consensus atteint lors de la conférence consultative politique s'est transformé en simple illusion et la Chine est tombée une fois de plus sous l'ombre de la dictature et de la guerre. Aujourd'hui, alors que la guerre de libération s'approche d'une victoire globale, la tâche d'établir un gouvernement populaire central démocratique a été officiellement inscrite à l'ordre du jour. Divers partis démocratiques, organisations populaires, élites sociales indépendantes et Chinois d'outre-mer ont répondu activement et participé à la nouvelle conférence consultative politique. La conférence discutera de la structure organisationnelle du gouvernement populaire central, adoptera une constitution provisoire et, plus important encore, déclarera la création de la nouvelle Chine."
 PRC_50s_Rework_event.11.a:0 "Vive la nouvelle Chine démocratique !"
 PRC_50s_Rework_event.12.t:0 "La fondation de la nouvelle Chine"
 PRC_50s_Rework_event.12.d:0 "Après mai 1949, l'Armée populaire de libération a parcouru le pays et libéré Nanjing et Shanghai. Le gouvernement nationaliste de Nanjing, qui dirigeait la Chine depuis 23 ans, avait en réalité perdu sa légitimité. Les dirigeants du PCC se sont préparés à établir un nouveau pouvoir politique et ont tenu une réunion de la CCPPC en septembre pour adopter le programme commun, prendre de nombreuses résolutions sur le système étatique de la République populaire de Chine et élire le Comité national de la Conférence consultative politique du peuple chinois et le Comité central du gouvernement populaire. Le gouvernement populaire est sur le point de naître.\nDans l'après-midi du 1er octobre 1949, la République populaire de Chine a tenu sa cérémonie de fondation. Mao Zedong a annoncé la création de la République populaire de Chine et du gouvernement populaire central sur la tour de la porte Tiananmen à Pékin. Au son de l'hymne national « Marche des Volontaires », Mao Zedong a annoncé : « Chers compatriotes, le gouvernement populaire central de la République populaire de Chine a été établi aujourd'hui ! Immédiatement après, un défilé militaire à grande échelle et un défilé de masse ont eu lieu. La célébration s'est terminée vers 21 heures ce jour-là.\nDepuis lors, le peuple chinois s'est levé et s'est débarrassé des trois montagnes ; Après 27 ans de développement, le PCC a finalement établi le pouvoir politique à l'échelle nationale, ce qui est devenu la plus grande victoire du mouvement socialiste depuis la Révolution d'Octobre."
 PRC_50s_Rework_event.12.a:0 "Le temps a commencé."
 PRC_50s_Rework_event.13.t:0 "Insuffisance de nourriture circulant sur le marché"
 PRC_50s_Rework_event.13.d:0 "Depuis le lancement du premier plan quinquennal, nous avons déplacé le centre de notre construction vers l'industrie lourde, laissant pour ainsi dire l'agriculture de côté.\nCela a posé des problèmes : nous n'avons pas de politique visant à promouvoir la vente de produits alimentaires par les agriculteurs, ce qui a entraîné une pénurie de produits alimentaires sur le marché.\nQuoi qu'il en soit, nous devons maintenant adopter certaines méthodes : qu'il s'agisse d'introduire des politiques visant à promouvoir l'enthousiasme des agriculteurs, ou de nationaliser la terre et d'organiser les agriculteurs pour produire et vendre de manière unifiée, nous devons trouver une méthode exécutoire pour augmenter la quantité de nourriture circulant sur le marché, sinon nos travailleurs mourront de faim."
 PRC_50s_Rework_event.13.a:0 "Il doit y avoir un moyen."
 PRC_50s_Rework_event.15.t:0 "La ligne générale pendant la période de transition a été introduite"
 PRC_50s_Rework_event.15.d:0 "azaz"
 PRC_50s_Rework_event.15.a:0 "在v这些是个复读生"
 PRC_50s_Rework_event.16.t:0 "Critiquer l'opportunisme de droite de Deng Zihui"
 PRC_50s_Rework_event.16.d:0 "Récemment, lors d'une réunion du Conseil d'État sur la question de l'agriculture, Deng Zichu, vice-Premier ministre du Conseil d'Etat, a critiqué la politique de coopération agricole du camarade Mao Tsé-toung, au cours de laquelle il a avancé que \"le rythme de développement de la coopération agricole ne devrait pas être trop rapide et les exigences ne devraient pas être trop hâtives\". Lors de la réunion, il a déclaré que \"le rythme du développement des coopératives agricoles ne devrait pas être trop rapide et la revendication ne devrait pas être trop précipitée\", ce qui, aux yeux des autres camarades du Comité central, était clairement une erreur opportuniste de droite et un oubli des principes du Parti en tant que communiste. Par la suite, le camarade Mao Zedong et d'autres patriarches du PCC ont critiqué les opinions erronées et l'opportunisme de droite de Deng Zichu. \nLe camarade Mao Zedong a rencontré Deng Zichu pour discuter du nombre de coopératives de coopération agricole. Mao Zedong a proposé de « doubler » le nombre de coopératives, mais Deng Zichu a toujours insisté sur le plan initial consistant à « réduire de moitié » le nombre de coopératives. Après cette discussion infructueuse, Mao Zedong a souligné dans son rapport sur le problème de la coopérativisation agricole que Deng Zichu « marchait comme une femme aux petits pieds, commettant l'erreur de droite de solidification de l'esprit »."
 PRC_50s_Rework_event.16.a:0 "La coopération agricole concerne tous les agriculteurs chinois."
 PRC_50s_Rework_event.17.t:0 "Coopération agricole achevée"
 PRC_50s_Rework_event.17.d:0 "« Les coopératives de production agricole, en termes de production, doivent augmenter les rendements des cultures par rapport aux ménages individuels et aux groupes d'entraide. Ils ne doivent pas toujours égaler les rendements des ménages unifamiliaux ou des groupes d'entraide ; si c'est un échec, pourquoi avoir des coopératives ? Il faut encore moins réduire les rendements. Plus de 80 pour cent des 650 000 coopératives de production agricole créées ont augmenté les rendements des cultures, ce qui est une excellente situation et prouve que les membres des coopératives de production agricole sont très motivés et que les coopératives sont meilleures que les groupes d'entraide, et même meilleures que les ménages à exploitant unique.\"\n-Mao Zedong"
 PRC_50s_Rework_event.17.a:0 "Bien joué!"
 PRC_50s_Rework_event.19.t:0 "Matériaux détériorés transportés vers la RPDC"
 PRC_50s_Rework_event.19.d:0 "L'Armée populaire coréenne, une armée fraternelle qui a marché main dans la main avec nous dans la cause de la libération du peuple et du communisme, a expédié un flux constant de cartons de ravitaillement au front coréen afin de garantir les opérations de l'APC et des volontaires soutenant la RPDC. Cependant, il est ennuyeux que la qualité de ces fournitures varie et que parmi elles, les produits contrefaits et de mauvaise qualité ne manquent pas. Afin de réaliser des profits élevés, les commerçants sans scrupules chargés de l'approvisionnement du front sont allés jusqu'à falsifier des boîtes de conserve pour compléter l'alimentation des soldats, et à économiser sur les médicaments et les bandages pour soigner les blessures et les maladies ainsi que sur les vêtements chauds, ce qui a entraîné la mort prématurée de nombreux soldats volontaires en raison de la malnutrition ou de maladies infectées. Dans le même temps, le pays a commencé à organiser les Trois Campagnes anti-corruption, qui ont révélé un grand nombre de bureaucrates corrompus de connivence avec les capitalistes, et peut-être devons-nous procéder à des ajustements opportuns en termes de solidarité avec la bourgeoisie nationale."
 PRC_50s_Rework_event.19.a:0 "Ces capitalistes doivent être martelés."
 PRC_50s_Rework_event.20.t:0 "Le mouvement contre les cinq maux a commencé"
 PRC_50s_Rework_event.20.d:0 "En janvier 1952, alors que la campagne des « Trois anti-corruption » s'intensifiait, il fut révélé que la plupart des actes illégaux des éléments corrompus au sein du Parti, du gouvernement, de l'armée et des organisations populaires étaient accomplis en collusion avec les éléments bourgeois de la société. Afin de repousser les attaques effrénées de la bourgeoisie, Mao Zedong a rédigé pour le Comité central du Parti communiste chinois « l'Instruction sur le lancement d'une « Cinq luttes anti-bourgeoises » à grande échelle, résolue et approfondie dans les villes dans un laps de temps limité », qui exigeait qu'une « Cinq luttes anti-bourgeoises » à grande échelle soit menée dans toutes les villes du pays, en premier lieu dans les grandes et moyennes villes. En s'appuyant sur la classe ouvrière, en unissant la bourgeoisie respectueuse des lois et les autres citoyens et en ciblant les illégaux, il a appelé à une lutte à grande échelle des « cinq anti » contre la bourgeoisie qui enfreint la loi dans toutes les villes du pays, d'abord dans les grandes et moyennes villes, en s'appuyant sur la classe ouvrière, en unissant la bourgeoisie respectueuse des lois et les autres citoyens, et en ciblant la bourgeoisie illégale."
 PRC_50s_Rework_event.20.a:0 "Tuez tous les parasites et soyez invincible."
 PRC_50s_Rework_event.21.t:0 "Le mouvement contre les trois maux a commencé"
 PRC_50s_Rework_event.21.d:0 "À la fin de 1951, le PCC a lancé une série de campagnes contre les organes et institutions de l'État à tous les niveaux sous les noms d'« anti-gaspillage » et « anti-corruption » afin d'éliminer le culte de l'argent et les abus de pouvoir parmi les cadres après l'établissement du nouveau régime, et d'éviter de répéter les erreurs des générations précédentes d'insurgés qui s'étaient désintégrées et avaient échoué rapidement après leur entrée dans les villes."
 PRC_50s_Rework_event.21.a:0 "Wan Sui !"
 PRC_50s_Rework_event.23.t:0 "Le capitaliste plaide pour un partenariat public-privé"
 PRC_50s_Rework_event.23.d:0 "Parmi les « trois grandes réformes », le problème le plus difficile pour nous est celui de la bourgeoisie nationale. Bien qu'ils soient bourgeois, ils nous ont généreusement aidés pendant la guerre civile et ont soutenu la formation de notre nouveau gouvernement./nMais la question se pose : si nous voulons passer d'une nouvelle société démocratique à une société socialiste, nous devons les « vaincre ». Comment devrions-nous choisir ? Ce fut un choix difficile pour une grande partie du Comité central du Parti./nHeureusement, les capitalistes avaient déjà avancé une proposition : adopter le partenariat public-privé comme mode de fonctionnement temporaire pour le moment, comme moyen de transition vers le socialisme dans notre pays./nCette initiative a immédiatement suscité de larges discussions parmi les membres du parti. Certains ont dit qu'il s'agissait d'un blasphème impitoyable contre le socialisme, mais d'autres ont dit qu'il s'agissait d'un choix pragmatique, créant un raccourci vers la construction socialiste."
 PRC_50s_Rework_event.23.a:0 "D'accord avec l'idée capitaliste."
 PRC_50s_Rework_event.25.t:0 "Le huitième congrès national du PCC"
 PRC_50s_Rework_event.25.d:0 "Sept ans après la victoire de la révolution, le VIIIe Congrès national du PCC s'est tenu à l'Auditorium de la CCPPC à Pékin. 1 026 représentants officiels et 107 représentants suppléants ont participé à la conférence, représentant 10,73 millions de membres du parti dans tout le pays. Des représentants du Parti communiste, du Parti des travailleurs, du Parti travailliste et du Parti révolutionnaire du peuple de 59 pays, ainsi que des représentants de divers partis démocratiques et démocrates indépendants de Chine, ont été invités à assister à la conférence.\nMao Zedong a prononcé le discours d'ouverture, Liu Shaoqi a rédigé le rapport politique du Comité central du PCC au huitième Congrès national, Deng Xiaoping a rédigé le rapport sur l'amendement de la Constitution du Parti et Zhou Enlai a rédigé le rapport sur les suggestions pour l'élaboration du deuxième plan quinquennal de l'économie nationale. La conférence a proposé qu'après l'achèvement fondamental de la transformation socialiste de la propriété privée des moyens de production, la contradiction principale dans le pays n'est plus la contradiction entre la classe ouvrière et la bourgeoisie, mais la contradiction entre la demande du peuple de créer un pays industriel avancé et la réalité d'un pays agricole arriéré, et la contradiction entre le besoin du peuple d'un développement économique et culturel rapide et la situation actuelle où l'économie et la culture ne peuvent pas répondre aux besoins du peuple.\nCette conférence s'est tenue à l'ombre de l'effondrement du groupe Gao Gang. La structure de décentralisation depuis la victoire de la révolution est devenue obsolète. Le Parti communiste chinois a réorganisé le Politburo pour redistribuer le pouvoir et a également créé le poste de secrétaire général, renforçant ainsi l'autorité du Secrétariat central. Dans le même temps, l'intervention du Parti communiste chinois en Europe de l'Est a également reçu les éloges des partis communistes du monde entier et a renforcé la conviction d'une participation active au mouvement socialiste mondial, ce qui pourrait entrer en conflit avec la politique étrangère de l'Union soviétique."
 PRC_50s_Rework_event.25.a:0 "Attendons et voyons."
 PRC_50s_Rework_event.26.t:0 "\"Le jeune nouveau venu dans le département d'organisation\" Publié"
 PRC_50s_Rework_event.26.d:0 " Un jeune homme arrive au département de l'organisation \" est une nouvelle écrite par l'écrivain chinois contemporain Wang Meng. Elle a été publiée dans la littérature populaire en 1956 et est racontée du point de vue de Lin Zhen, un nouveau jeune homme arrivé au département de l'organisation. L'histoire tourne autour des problèmes de la branche du parti dans l'usine de toile de jute. Les écrits de Wang Meng ont deux objectifs : premièrement, écrire sur plusieurs personnages imparfaits et exposer certains phénomènes négatifs dans le travail et la vie ; l'un est de soulever la question : où les jeunes peuvent-ils des gens comme Lin Zhen, qui s'opposent activement à la bureaucratie mais ont souvent du mal à y faire face, partent.\nCependant, lors du séminaire de l'Association des écrivains chinois, Guo Xiaochuan, Lin Mohan et d'autres ont estimé que les romans étaient toxiques. Certaines personnes le comparent à « Wild Lily ». Le 9 février, Li Xifan a émis un déni fondamental, accusant la description de la bureaucratie dans le roman de déformer la réalité parce que Pékin n'a pas de bureaucratie du tout.\nComme décrit dans l'article sur le vieux bureaucrate Liu Shiwu, les membres de l'association aiment également critiquer l'article avec ces concepts théoriques apparemment plausibles. \"Les lacunes sont les lacunes de notre progrès, et notre grande cause est accomplie par ces organisations et ces membres de partis imparfaits.\" La bureaucratie est donc une bureaucratie en évolution, n'est-ce pas ?"
 PRC_50s_Rework_event.26.a:0 "C'est l'affaire."
 PRC_50s_Rework_event.27.t:0 "Sur la gestion correcte des contradictions au sein du peuple"
 PRC_50s_Rework_event.27.d:0 "Au cours des sept années de construction, la situation tant nationale qu'internationale a démontré que même après l'établissement du système socialiste de base et sous le règne du Parti communiste, diverses contradictions subsistent au sein de la société socialiste. Comment comprendre et résoudre correctement les contradictions internes de plus en plus importantes au sein du peuple est devenu une question majeure à laquelle sont confrontés le Parti et le gouvernement.\n\nAprès une longue période de réflexion et de discussions approfondies avec des gens à l'intérieur et à l'extérieur du Parti, Mao Zedong a mis au premier plan la question de la gestion correcte des contradictions internes au sein du peuple comme un problème politique théorique et pratique important pour l'ensemble du Parti. Dans son discours, il a exposé la théorie de la gestion correcte des contradictions internes au sein du peuple, soulignant que cela devrait être le thème central de la vie politique du pays. Après avoir sollicité les avis de diverses sources et apporté des révisions et des suppléments, son discours a été publié dans son intégralité sous le titre « Sur le traitement correct des contradictions au sein du peuple » dans le Quotidien du Peuple."
 PRC_50s_Rework_event.27.a:0 "Enrichissement et développement importants de la théorie marxiste du socialisme scientifique"
 PRC_50s_Rework_event.28.t:0 "Pourquoi une rectification ?"
 PRC_50s_Rework_event.28.d:0 "En octobre 1956, après les événements d'octobre en Hongrie, le PCC s'inquiétait de l'instabilité du régime. Lors de la deuxième session plénière du huitième Comité central du PCC en novembre, il fut décidé, sur proposition de Mao Zedong, de lancer une campagne de rectification à l'échelle du parti en 1957 pour rectifier « le subjectivisme, le sectarisme et la bureaucratie ». \" Les critiques étaient bien plus graves que ce que le PCC avait prévu. Mao a dénoncé les \" intellectuels bourgeois \", affirmant que même si les capitalistes avaient été anéantis, ils ne pouvaient toujours pas se débarrasser de leur nature de classe."
 PRC_50s_Rework_event.28.a:0 "Cela a du sens."
 PRC_50s_Rework_event.29.t:0 "Réprimer les contre-révolutionnaires"
 PRC_50s_Rework_event.29.d:0 "Le Parti communiste chinois a adopté le 10 octobre 1950 l'Instruction sur la répression des activités contre-révolutionnaires, qui a lancé une campagne nationale à grande échelle pour supprimer les restes des forces réactionnaires. Grâce aux efforts des services de sécurité publique dans toutes les régions du pays, les forces restantes du Kuomintang, les agents secrets et les forces armées locales telles que les bandits ont été presque anéantis, jetant ainsi les bases de la mise en oeuvre du premier plan quinquennal."
 PRC_50s_Rework_event.29.a:0 "Patrie propre."
 PRC_50s_Rework_event.30.t:0 "Les choses commencent à changer"
 PRC_50s_Rework_event.30.d:0 " Mao Zedong espérait que les intellectuels l'aideraient dans le mouvement de rectification, mais le résultat du mouvement de rectification fut que les intellectuels voulaient faire tomber le parti. Pour Mao Zedong, faire tomber le parti signifiait renverser à nouveau les ouvriers et les paysans, ce qu'il ne pouvait tolérer. Sa confiance dans les intellectuels a été échangée contre la trahison des soi-disant intellectuels de haut rang, ce qui l'a fait réfléchir.\nMao Zedong a commencé à concevoir un article intitulé « Les choses changent ». Dans l'article, Mao Zedong estime que certains droitiers ont profité de l'ouverture de la porte à la rectification par le Parti communiste et ont lancé une attaque massive contre le Parti communiste. Et pour la première fois, il a soulevé la question de l'attaque effrénée des droitiers, dans le but de préparer idéologiquement le parti à la contre-attaque contre l'attaque de droite. Mao Zedong a rapidement rédigé les « Instructions pour intensifier le mouvement de rectification », soulignant qu'il est nécessaire de gagner le milieu, d'unir la gauche, de saisir l'opportunité de mobiliser les masses pour lutter contre les droitiers et de remporter une victoire à grande échelle dans les domaines idéologique et politique."
 PRC_50s_Rework_event.30.a:0 "Ce mouvement a commencé à se transformer en un mouvement anti-droitier."
 PRC_50s_Rework_event.31.t:0 "Faire tomber l'Alliance Zhang-Lo"
 PRC_50s_Rework_event.31.d:0 "Le 1er juillet 1957, Mao Zedong publia un éditorial dans le Quotidien du Peuple, « La direction bourgeoise de Wen Wei Po devrait être critiquée », déclarant que les cadres de droite dirigés par les alliés de Zhang et Luo, bien que peu nombreux, avaient joué un rôle particulièrement flagrant dans le processus de controverse des Cent écoles de pensée et dans la rectification des vents. Les déclarations erronées de Zhang et Luo doivent être critiquées et corrigées, et cela ne doit pas être laissé au hasard, mais ils doivent être autorisés à conserver leurs propres opinions."
 PRC_50s_Rework_event.31.a:0 "Bon travail."
 PRC_50s_Rework_event.35.t:0 "Commencer la lutte anti-droite"
 PRC_50s_Rework_event.35.d:0 " Mao Zedong espérait que les intellectuels l'aideraient dans le mouvement de rectification, mais le résultat du mouvement de rectification fut que les intellectuels voulaient faire tomber le parti. Pour Mao Zedong, faire tomber le parti signifiait renverser à nouveau les ouvriers et les paysans, ce qu'il ne pouvait tolérer. Sa confiance dans les intellectuels a été échangée contre la trahison des soi-disant intellectuels de haut rang, ce qui l'a fait réfléchir.\nMao Zedong a commencé à concevoir un article intitulé « Les choses changent ». Dans l'article, Mao Zedong estime que certains droitiers ont profité de l'ouverture de la porte à la rectification par le Parti communiste et ont lancé une attaque massive contre le Parti communiste. Et pour la première fois, il a soulevé la question de l'attaque effrénée des droitiers, dans le but de préparer idéologiquement le parti à la contre-attaque contre l'attaque de droite. Mao Zedong a rapidement rédigé les « Instructions pour intensifier le mouvement de rectification », soulignant qu'il est nécessaire de gagner le milieu, d'unir la gauche, de saisir l'opportunité de mobiliser les masses pour lutter contre les droitiers et de remporter une victoire à grande échelle dans les domaines idéologique et politique."
 PRC_50s_Rework_event.35.a:0 "Tirez le « serpent » hors du trou et attrapez-le tout."
 PRC_50s_Rework_event.36.t:0 "Chen Qitong s'oppose à la libéralisation"
 PRC_50s_Rework_event.36.d:0 "Avec la mise en oeuvre de la « politique du double cent » (la politique consistant à « laisser fleurir cent fleurs et cent écoles de pensée s'affronter »), les défis et les difficultés provoqués par le mouvement ont progressivement conduit à des malentendus parmi de nombreux cadres du Parti. De plus, la levée des interdictions sur certaines pièces de théâtre, l'essor de la création romanesque et poétique et l'émergence d'oeuvres controversées, telles que les pièces de théâtre fantômes, ont commencé à attirer l'attention et l'inquiétude de certains membres du Parti. Ils pensaient qu'il y avait certaines erreurs de droite au sein du mouvement des Double-Cents et qu'il y avait un risque que ces erreurs se transforment en une tendance plus grave. Chen Qitong était l'un de ces membres du Parti qui partageait ce point de vue. Par conséquent, Chen Qitong, avec d'autres qui partageaient ses préoccupations, a écrit « Nos opinions sur l'oeuvre littéraire et artistique actuelle », qui a été publié dans le Quotidien du Peuple en janvier 1957, avec l'intention de mettre un terme à la politique « laisser fleurir cent fleurs, cent écoles de pensée s'affronter ».\n\nCependant, l'opposition de Chen Qitong à la politique du double-cent en raison de certaines des difficultés qu'elle présentait n'a pas été approuvée par Mao Zedong et a été critiquée dans un éditorial du Quotidien du Peuple du 14 avril. Les articles de Chen Qitong et d'autres ont été considérés comme reflétant un point de vue dogmatique « de gauche »."
 PRC_50s_Rework_event.36.a:0 "唉"
 PRC_50s_Rework_event.37.t:0 "Mouvement double cent"
 PRC_50s_Rework_event.37.d:0 "Mao Zedong a déclaré lors de la réunion élargie du Bureau politique du Comité central du PCC que « laisser fleurir cent fleurs » sur les questions artistiques et « laisser une centaine d'écoles de pensée s'affronter » sur les questions académiques devraient devenir la politique de mon pays pour développer la science et faire prospérer la littérature et l'art. Cette politique a été proposée par Mao Zedong et définie par le Comité central du PCC comme une politique importante en matière de travail scientifique et culturel. \nLa politique du « Double Cent » n'est en aucun cas temporaire ou superflue. Il s'agit d'une politique importante à laquelle il faut adhérer pendant longtemps et qui constitue le seul moyen de comprendre la vérité et de développer et faire prospérer la science et la culture. Sa création jouera un rôle important dans le développement et la prospérité des entreprises scientifiques et culturelles de la Chine nouvelle."
 PRC_50s_Rework_event.37.a:0 "Que cent fleurs s'épanouissent et que cent écoles de pensée s'affrontent !"
 PRC_50s_Rework_event.38.t:0 "Les États-Unis ont gelé nos avoirs"
 PRC_50s_Rework_event.38.d:0 "Le désir des impérialistes de nous détruire demeure intact. Le gouvernement américain a, sans aucune justification, annoncé le contrôle de nos propriétés publiques et privées relevant de sa juridiction et a interdit à tous les navires immatriculés aux États-Unis de se rendre dans nos ports. Le gouvernement américain a commis de nombreux actes immoraux et pille désormais ouvertement les biens du peuple chinois, suscitant les protestations du peuple chinois et la condamnation du monde entier. Elle avance progressivement sur la voie de l'autodestruction et, à la fin, il s'agira sans doute de soulever une pierre pour la laisser tomber sur ses propres pieds ! En réponse, le Conseil d'État a émis une ordonnance visant à contrôler les biens américains en Chine et à geler les dépôts américains en Chine."
 PRC_50s_Rework_event.38.a:0 "Si les sanctions ne nous parviennent pas, nous nous adresserons au panel des sanctions."
 PRC_50s_Rework_event.39.t:0 "Reprise de la propriété de la caserne de Pékin"
 PRC_50s_Rework_event.39.d:0 "La toute nouvelle République populaire a été établie et, naturellement, elle ne supporte pas l'héritage de l'ancienne époque. Notre Commission de contrôle militaire de Pékin a ordonné aux États-Unis, à la France et aux Pays-Bas de remettre leurs casernes et leurs bâtiments dans les délais. Cependant, ils étaient paniqués, citant les Écritures et feuilletant la « Bible » de la dynastie précédente. Le secrétaire d'État américain Edward Whitehead a également crié quelque chose comme \"violation des droits de longue date accordés aux États-Unis en 1901...\" Et \"adresse du bureau du consulat\". Malheureusement, ils se sont trompés de gouvernement. Nous ne sommes ni Chiang Kai-shek ni le gouvernement Qing. Nous ne tomberons pas dans le piège des impérialistes. Ils occupent illégalement le territoire chinois, et non seulement le peuple chinois ne le permettra pas, mais les peuples du monde les rejetteront également. Peu importe leurs protestations, ils devront finalement restituer au gouvernement chinois les biens qui appartenaient à l'origine au peuple chinois."
 PRC_50s_Rework_event.39.a:0 "Tigre de papier"
 PRC_50s_Rework_event.41.t:0 "Bataille de Chamdo"
 PRC_50s_Rework_event.41.d:0 "Le Tibet fait partie indivisible du territoire chinois. Le pouvoir du Kuomintang réactionnaire a été largement éradiqué sur le continent, et seul le Tibet, le « Toit du monde », reste à libérer. Profitant du chaos de la guerre, le Tibet s'est entendu avec les gouvernements britannique et indien, expulsant les représentants du gouvernement du Kuomintang et tentant de rechercher l'indépendance. L'Armée populaire de libération a mobilisé ses forces, traversé les montagnes et lancé une attaque en tenaille sur Changdu. La force principale de l'armée tibétaine a été complètement anéantie et la porte du Tibet a été ouverte. La conspiration des forces réactionnaires nationales et étrangères cherchant l'indépendance du Tibet a été complètement contrecarrée."
 PRC_50s_Rework_event.41.a:0 "Avec puissance et énergie, nous devons poursuivre l'ennemi chancelant."
 PRC_50s_Rework_event.42.t:0 "Création de la PLAAF chinoise"
 PRC_50s_Rework_event.42.d:0 "Dans la guerre moderne, il ne s'agit pas uniquement de forces terrestres ; gagner la supériorité aérienne est extrêmement important. Il est donc nécessaire de créer une force armée aéroportée. Nous avons construit l'armée de l'air de l'Armée populaire de libération de Chine - l'armée de l'air de l'Armée populaire de libération chinoise, sur la base des avions capturés par le Japon et le Kuomintang et avec le soutien de l'Union soviétique. L'armée de l'air de l'Armée populaire de libération de la Chine deviendra une force cruciale pour la sauvegarde de l'espace aérien et de la sécurité nationale de la Chine. Nous pensons que dans un avenir pas si lointain, nous disposerons également d'une force interarmées modernisée, capable de mener des opérations sur terre, sur mer et dans les airs."
 PRC_50s_Rework_event.42.a:0 "Envolez-vous dans les vastes cieux !"
 PRC_50s_Rework_event.43.t:0 "Mise en place du PLAN chinois"
 PRC_50s_Rework_event.43.d:0 "De la guerre anti-japonaise à la guerre de libération, de nombreux navires ont fait défection au profit de l'Armée populaire de libération, mais nous avons peu de connaissances sur les questions navales. Cependant, nous disposons désormais d'un atout important sous la forme du croiseur Chongqing. Avec le succès de la campagne de traversée du fleuve Yangtsé, la 2e flotte de la marine du Kuomintang a déclaré sa défection, et la création d'une marine est désormais urgente. Nous utiliserons les navires et le personnel de l'ancienne marine du Kuomintang comme base et tirerons les leçons des expériences navales de l'Union soviétique pour créer une nouvelle marine capable de défendre nos frontières maritimes et de résister à l'agression impérialiste. Nous ne devons pas permettre aux cuirassés de l'impérialisme de remettre le pied sur le sol chinois."
 PRC_50s_Rework_event.43.a:0 "En protégeant nos mers et nos rivages, nous resterons forts !"
 PRC_50s_Rework_event.44.t:0 "Création de l'Académie militaire de l'Armée populaire de libération chinoise"
 PRC_50s_Rework_event.44.d:0 "Après la fondation de la République populaire de Chine, afin de renforcer la construction régulière et moderne de l'Armée populaire de libération et de former des commandants répondant aux exigences de la guerre moderne, l'Académie militaire de l'Armée populaire de libération de Chine a été officiellement créée avec l'approbation de la Commission militaire centrale. Il a été construit sur les fondations de l'ancienne université militaro-politique de la Chine du Nord et de l'Est de la Chine. Le général Liu Bocheng a été à la fois président et commissaire politique de l'académie. L'Académie militaire vise à former le personnel militaire à tous les niveaux à la théorie militaire marxiste et à la pensée militaire de Mao Zedong. Il cherche également à résumer l'expérience de combat de l'Armée populaire de libération et à tirer les leçons des expériences des forces armées d'autres pays. La création de l'Académie militaire marque le début d'une nouvelle étape dans notre construction militaire."
 PRC_50s_Rework_event.44.a:0 "Nous devons cultiver davantage de talents militaires capables de gagner des batailles pour défendre la Chine nouvelle."
 PRC_50s_Rework_event.45.t:0 "Succès du DF-101"
 PRC_50s_Rework_event.45.d:0 "L'usine publique de fabrication d'avions n° 112 de Shenyang a réalisé une percée significative. Grâce au démontage, à la recherche et à la production d'essais du chasseur à réaction MiG-17 de fabrication soviétique, et avec l'aide des données fournies par l'Union soviétique, le premier avion à réaction produit dans le pays, nommé Dongfeng 101, a été assemblé et a passé avec succès divers tests. Après examen, il répond pleinement aux exigences techniques et a effectué avec succès son vol inaugural. Cette étape importante marque que la Chine nouvelle a la capacité de fabriquer des chasseurs à réaction, ce qui propulsera notre développement industriel à un nouveau niveau et signifiera une nouvelle percée dans la défense nationale. Le Dongfeng 101 est un chasseur à réaction monoplace, monomoteur et hautement subsonique. Il sera officiellement baptisé Type 56 Fighter."
 PRC_50s_Rework_event.45.a:0 "Avec des ailes de fer et des flèches divines, forgeant une grande Muraille au ciel bleu !"
 PRC_50s_Rework_event.46.t:0 "Rééducation des officiers du Kuomintang"
 PRC_50s_Rework_event.46.d:0 "À mesure que la victoire de la guerre de libération progresse, l'armée du Kuomintang s'effondre et les officiers à différents niveaux sont capturés, se rendent ou organisent des soulèvements systématiques. Ils sont désormais entre nos mains. Bien que beaucoup d'entre eux possèdent des talents militaires, nous ne pouvons malheureusement pas les employer immédiatement car beaucoup refusent toujours d'accepter leur défaite et continuent de prêter allégeance aux forces réactionnaires, s'accrochant à des idéologies anti-populaires. Nous les organiserons dans des centres de gestion des criminels de guerre, où ils subiront une rééducation par le gouvernement populaire, leur permettant de réintégrer la cause du service du peuple."
 PRC_50s_Rework_event.46.a:0 "Transformez-vous pour le mieux et recommencez."
 PRC_50s_Rework_event.47.t:0 "Créer la Force de défense aérienne et la Force de sécurité publique"
 PRC_50s_Rework_event.47.d:0 "Même si nous avons remporté la victoire dans la guerre, cela ne signifie pas pour autant qu'une paix complète a été instaurée. Divers restes des forces ennemies, des bandits et des espions restent actifs dans l'ombre. De plus, des avions extérieurs impérialistes et réactionnaires harcèlent fréquemment notre espace aérien. Nous ne pouvons pas nous permettre de baisser la garde. Pour garantir la sécurité de notre nation et de notre peuple, des forces spécialisées de défense aérienne et de sécurité publique seront créées. Ils se concentreront sur la protection des installations critiques, la prévention des frappes aériennes et la défense du gouvernement populaire nouvellement établi."
 PRC_50s_Rework_event.47.a:0 "Nous ne pouvons pas permettre aux forces réactionnaires de réussir dans leurs conspirations."
 PRC_50s_Rework_event.48.t:0 "Expérience de l'ancienne école d'aviation du nord-est de la Chine"
 PRC_50s_Rework_event.48.d:0 "Au début de la création de l'armée de l'air de la République populaire de Chine, un problème difficile s'est posé : nous avons rapidement réalisé que nous n'avions absolument aucune expérience dans le fonctionnement d'une force aérienne. Même le précédent régime du Kuomintang ne disposait plus que de quelques avions. Heureusement, les Forces alliées démocratiques du Nord-Est avaient créé l'École d'aviation du Nord-Est en utilisant le matériel aéronautique laissé par les Japonais. Avec le matériel et le personnel limités laissés par les Japonais, ils ont eu du mal à construire une unité aéronautique. Au fur et à mesure que la guerre de libération progressait, la taille de leur force aérienne s'est progressivement élargie et ils sont devenus l'une des rares forces aériennes de la nouvelle Chine. Leur expérience nous a été inestimable et cruciale pour construire une force de défense aérienne moderne."
 PRC_50s_Rework_event.48.a:0 "À l'époque, nous avions réussi à reconstituer un avion utilisable en utilisant des pièces provenant de plus d'une douzaine d'avions d'entraînement japonais."
 PRC_50s_Rework_event.49.t:0 "Le contact futile de Leighton Stuart"
 PRC_50s_Rework_event.49.d:0 "Notre Armée populaire de libération a vaillamment avancé et a libéré avec succès le bastion réactionnaire de Nanjing, provoquant la panique et la fuite des forces réactionnaires vers Guangzhou, emmenant avec elles toutes les ambassades étrangères. Cependant, il est choquant que Leighton Stuart, l'ambassadeur américain et principal partisan du réactionnaire Kuomintang, n'ait pas évacué mais soit resté à Nanjing. Il a eu de multiples réunions avec le Comité central de notre parti, dans l'espoir de maintenir le contact avec la nouvelle Chine. Cependant, il portait avec lui l'arrogance des Américains et ne pouvait accepter les conditions fixées par notre gouvernement populaire. Il est devenu évident qu'il n'était qu'un simple spéculateur couvrant ses paris des deux côtés, et qu'il n'était pas nécessaire de poursuivre des contacts inutiles avec lui."
 PRC_50s_Rework_event.49.a:0 "Adieu, Leighton Stuart !"
 PRC_50s_Rework_event.50.t:0 "Création du ministère des Affaires étrangères"
 PRC_50s_Rework_event.50.d:0 "Parallèlement à la création de la nouvelle Chine, nous avons également créé notre département des affaires étrangères, le ministère des Affaires étrangères, basé sur la Commission centrale des affaires étrangères du Parti communiste chinois. Le ministre des Affaires étrangères Zhou Enlai a rapidement signé le premier document diplomatique de la nouvelle Chine, annonçant notre volonté d'établir des relations diplomatiques avec tout gouvernement étranger adhérant aux principes d'égalité, de bénéfice mutuel et de respect de la souveraineté territoriale. Cela signifie l'établissement officiel de liens entre le régime populaire et le monde extérieur. Nous avons rapidement reçu des messages de félicitations de la part de nations qui chérissent la paix et la démocratie. La Chine se présentera au monde avec une image rajeunie."
 PRC_50s_Rework_event.50.a:0 "Égalité et bénéfice mutuel, coexistence pacifique !"
 PRC_50s_Rework_event.51.t:0 "Zhang Zhizhong a écrit une lettre demandant à la Chine de rester neutre"
 PRC_50s_Rework_event.51.d:0 "Lors de l'influente Conférence de Yalta, qui a eu un profond impact sur le paysage international, les États-Unis et l'Union soviétique ont divisé le monde en sphères d'influence. Le régime du Kuomintang était placé dans la sphère d'influence américaine. Aujourd'hui, avec les victoires continues de la guerre de libération, la nouvelle Chine est destinée à établir de bonnes relations avec l'Union soviétique, qui fait également partie du camp démocratique populaire. Elle sera inévitablement profondément impliquée dans la dynamique de la guerre froide et s'engagera dans une compétition entre les États-Unis et l'Union soviétique. En réponse à cela, des personnalités démocrates modérées, représentées par le général Zhang Zhizhong, ont conseillé au gouvernement central que la nouvelle Chine devrait adopter une « troisième voie » en maintenant une position neutre entre les États-Unis et l'Union soviétique pour éviter d'être entraînée dans la guerre froide. Cependant, pour la nouvelle Chine, cela signifie qu'elle ne recevra le soutien d'aucune des deux superpuissances. La Chine est encore économiquement faible et n'a pas les moyens de négocier à l'échelle internationale. Ils ont désespérément besoin de l'aide des grandes puissances, mais les États-Unis ont déjà fermé leurs portes diplomatiques. Il semble que nous ne puissions nous tourner que vers le soutien de l'Union soviétique."
 PRC_50s_Rework_event.51.a:0 "Il est impossible d'être autosuffisant."
 PRC_50s_Rework_event.52.t:0 "Les États-Unis ont refusé de nous reconnaître"
 PRC_50s_Rework_event.52.d:0 "Alors que le peuple chinois remporte des victoires continues et que les forces réactionnaires font face à des défaites successives, les puissances réactionnaires, en particulier les États-Unis impérialistes, persistent dans leur soutien aux forces réactionnaires et se livrent à des activités anti-populaires. Non seulement ils se rangent ouvertement du côté des réactionnaires du Kuomintang, mais ils refusent également de reconnaître le statut légitime de la nouvelle Chine. En outre, ils continuent d'exploiter les stations de radio au service des réactionnaires et de se livrer à des activités d'espionnage. Ils refusent de se conformer aux ordres du gouvernement populaire et refusent de diffuser les stations de radio cryptées. En outre, le consul général à Shenyang a non seulement retenu les salaires, mais a également maltraité et agressé physiquement les travailleurs chinois. Cela a suscité une indignation unanime au sein du peuple chinois et il est nécessaire de prendre des mesures fermes pour lui faire savoir que la Chine nouvelle n'est plus l'ancienne Chine manipulable à volonté !"
 PRC_50s_Rework_event.52.a:0 "Expulsez leurs consuls en guise de réponse."
 PRC_50s_Rework_event.53.t:0 "Expulsion du consul américain à Shenyang"
 PRC_50s_Rework_event.53.d:0 "Depuis la libération du nord-est de la Chine, le consulat général des États-Unis à Shenyang s'est heurté à plusieurs reprises au gouvernement populaire. Bien que nous ayons autorisé les consulats étrangers à rester à Shenyang, nombre d'entre eux exploitaient des stations de radio et les utilisaient pour maintenir le contact avec les forces réactionnaires des États-Unis et du régime de Chiang, se livrant à des activités secrètes d'espionnage. Ils ont résisté lors de la confiscation de leurs stations de radio et ont même dirigé leur colère contre les travailleurs chinois, recourant à la violence physique et aux mauvais traitements. Après un procès public du consul général à Shenyang, nous avons décidé de l'expulser du pays. L'époque de l'impérialisme qui pesait sur la tête du peuple chinois ne reviendra jamais !"
 PRC_50s_Rework_event.53.a:0 "A bas l'impérialisme !"
 PRC_50s_Rework_event.54.t:0 "Approvisionnement alimentaire en Inde"
 PRC_50s_Rework_event.54.d:0 "Après la création de la République populaire de Chine, le premier pays non socialiste à nous reconnaître fut l'Inde, qui avait également souffert de l'oppression coloniale dans les temps modernes. L'Inde et la Chine sont toutes deux des civilisations anciennes avec une histoire de résistance à la domination coloniale. Peu après son indépendance, l'Inde a établi de bonnes relations avec la Chine. L'Inde est également un pays agricole peuplé. Malheureusement, les fortes pluies continues ont conduit à un échec complet des principales régions productrices de céréales, entraînant une grave famine. La nation tout entière est dans un état de misère et la population est confrontée à une crise extrême. Bien que notre propre économie soit encore en phase de reprise, nous avons décidé de fournir des secours alimentaires à notre partenaire du tiers monde, l'Inde, pour des raisons humanitaires, afin de l'aider à surmonter cette situation difficile."
 PRC_50s_Rework_event.54.a:0 "Vive l'amitié entre la Chine et l'Inde !"
 PRC_50s_Rework_event.55.t:0 "Échanges économiques et commerciaux civils avec le Japon"
 PRC_50s_Rework_event.55.d:0 "Le Japon entretient toujours des relations diplomatiques officielles avec le gouvernement nationaliste en retraite à Taiwan, ce qui entrave le progrès de nos relations officielles avec le Japon. En conséquence, le commerce entre les peuples est devenu une fenêtre pour le développement des relations sino-japonaises. Malgré l'obstruction des États-Unis, les échanges entre la Chine et le Japon n'ont pas été rompus. Avec le ferme soutien du Comité chinois de promotion du commerce international, les deux parties ont signé « l'Accord commercial civil Chine-Japon ». Cet accord remet directement en question la politique de « blocus et d'embargo » imposée par les États-Unis et ouvre une petite porte contre le blocus imposé à la Chine. Les deux pays prévoient également d'organiser des expositions commerciales pour promouvoir le développement des relations bilatérales."
 PRC_50s_Rework_event.55.a:0 "La Chine et le Japon sont des pays voisins séparés par une bande d'eau"
 PRC_50s_Rework_event.57.t:0 "Incident de drapeau rouge"
 PRC_50s_Rework_event.57.d:0 "Selon l'accord commercial bilatéral entre la Chine et le Japon, les deux pays ont convenu d'organiser des expositions de produits. L'exposition de produits chinois, organisée par l'Association d'amitié Japon-Chine, a ouvert ses portes à Nagasaki. L'exposition simultanée des drapeaux nationaux de la Chine et du Japon sur le site a irrité les forces réactionnaires. Les diplomates des autorités du Kuomintang ont protesté auprès du gouvernement de Nagasaki, exigeant le retrait du drapeau national chinois. Au même moment, plusieurs extrémistes de droite ont fait irruption dans le lieu de l'exposition et ont démoli le drapeau chinois. Ils ont été rapidement interpellés par la police. Cependant, le gouvernement japonais, sous prétexte de ne pas reconnaître la République populaire de Chine, a refusé de reconnaître la légitimité de notre drapeau national et a rapidement relâché les extrémistes sans inculpation. Cela a provoqué une grande colère parmi le peuple chinois et a conduit à l'interruption des relations amicales en développement dans le commerce civil."
 PRC_50s_Rework_event.57.a:0 "Maudits Japonais"
 PRC_50s_Rework_event.58.t:0 "Émeute tibétaine de 1952"
 PRC_50s_Rework_event.58.d:0 "Au milieu de cette situation chaotique, les responsables du gouvernement local tibétain, connu sous le nom de Kashag, ont organisé une « Conférence populaire » pour maintenir l'ordre. Malgré la libération pacifique du Tibet par le PCC, certains aristocrates au sein de la Conférence populaire sont restés opposés au PCC et ont continué à comploter pour l'indépendance du Tibet. Ils ont ouvertement adressé une pétition au Kashag et au gouvernement populaire central pour qu'ils expulsent l'APL. Ces responsables ont déjà envoyé des troupes tibétaines pour encercler diverses institutions centrales de Lhassa, tout en rassemblant des moines et des masses pour attaquer les départements gouvernementaux. Des troubles d'une ampleur considérable semblent inévitables."
 PRC_50s_Rework_event.58.a:0 "Exigence pour l'abolition de la \"Conférence populaire\""
 PRC_50s_Rework_event.59.t:0 "L'Inde a invité le Dalaï Lama à lui rendre visite"
 PRC_50s_Rework_event.59.d:0 "À l'approche du 2 500e anniversaire du Nirvana de Gautama Bouddha, l'Inde se prépare à accueillir un grand événement commémoratif. En tant que personnalités importantes du bouddhisme, le Dalaï Lama, le Panchen Lama et d'autres chefs spirituels tibétains ont été invités à y assister. Cela aurait dû être une évolution positive. Cependant, le Tibet est actuellement plongé dans des troubles et des conflits. Nos efforts de réforme dans la région se heurtent à une forte résistance et les appels à l'autonomie du Tibet se font de plus en plus nombreux. De nombreuses pétitions sont déposées par des aristocrates et des moines. La visite du Dalaï Lama en Inde pourrait favoriser les échanges culturels, religieux et économiques entre les deux pays. Cependant, certaines personnes craignent que le fait d'autoriser le Dalaï Lama à voyager puisse conduire à sa défection et à sa recherche de refuge à l'étranger."
 PRC_50s_Rework_event.59.a:0 "Acceptez leur demande."
 PRC_50s_Rework_event.59.b:0 "Rejetez leur demande."
 PRC_50s_Rework_event.60.t:0 "Le Dalaï Lama est de retour au Tibet"
 PRC_50s_Rework_event.60.d:0 "Après avoir assisté avec succès à l'événement commémoratif en Inde et rencontré des personnalités telles que Nehru, le Dalaï Lama, invoquant les allégations de persécution religieuse de la part du PCC, a demandé l'asile politique en Inde. Le Premier ministre Zhou Enlai du Conseil des Affaires d'État s'est rendu d'urgence en Inde et a eu plusieurs réunions avec le Dalaï Lama et son entourage. Après avoir reçu l'assurance de Zhou Enlai et de Nehru qu'il n'y aurait pas de réforme du système tibétain, le Dalaï Lama retourna au Tibet."
 PRC_50s_Rework_event.60.a:0 "Bienvenue à la maison !"
 PRC_50s_Rework_event.61.t:0 "Le Dalaï Lama séjourne en Inde"
 PRC_50s_Rework_event.61.d:0 "Le Dalaï Lama, qui assistait à l'événement en Inde, a finalement décidé de rester en Inde sous prétexte d'asile politique. Malgré les efforts déployés par le Premier ministre Zhou Enlai et les responsables tibétains pour le persuader de retourner au Tibet, le Dalaï Lama et sa délégation ont refusé de rentrer et ont plutôt choisi de s'enraciner en Inde. Ils ont également critiqué notre politique au Tibet en prenant cette décision."
 PRC_50s_Rework_event.61.a:0 "Nous verrons ce qui se passe !"
 PRC_50s_Rework_event.62.t:0 "Zhang Zishan et Liu Qingshan ont été abattus"
 PRC_50s_Rework_event.62.d:0 "Le 14 décembre 1951, le Comité provincial du Parti du Hebei, sur la base des résultats de l'enquête et de l'interrogatoire, a soumis au Bureau de la Chine du Nord le traitement réservé à Liu Qingshan et Zhang Zishan. Ils ont volé les biens du pays, détourné et enrichi une énorme somme d'argent, ce qui n'est pas autorisé par la loi de l'État et la discipline du parti, avec des cadres de si haut niveau qui savent violer la loi et tromper le parti, exploitant le sang et la sueur du peuple. Ouvriers, détournant l'argent de la nourriture des victimes des inondations, de connivence avec les commerçants et réalisant des profits illégaux, et corrompus et corrompus à l'extrême.La corruption et la dégradation d'un cadre aussi haut placé ont atteint un point extrême. S'ils ne sont pas sévèrement punis, le Parti n'aura pas de mots à dire au peuple, la loi du pays ne pourra pas enchaîner les autres et les dommages causés au Parti seront exceptionnellement graves. Nous sommes donc unanimes à penser que la peine de mort devrait être imposée."
 PRC_50s_Rework_event.62.a:0 "D'ACCORD."
 PRC_50s_Rework_event.64.t:0 "Visite secrète de Liu Shaoqi à Moscou"
 PRC_50s_Rework_event.64.d:0 "Fin juin 1949, Liu Shaoqi conduisit une délégation du Comité central du Parti communiste chinois (PCC) en visite secrète à Moscou et, le 4 juillet, Liu Shaoqi présenta systématiquement la situation de la révolution chinoise et la préparation de la nouvelle Chine dans son rapport au Comité central du Parti communiste de l'Union soviétique (PCUS), qui fut bien compris et reconnu par Staline. Dans le même temps, Staline a décidé d'aider la Chine sur les plans économique, culturel et militaire, notamment en lui accordant un prêt de 300 millions de dollars, en aidant à construire sa propre flotte, en envoyant des experts soviétiques, etc. Dans le même temps, Staline promettait que l'Union soviétique reconnaîtrait le gouvernement chinois dès sa création."
 PRC_50s_Rework_event.64.a:0 "Nous avions la garantie de l'Union Soviétique"
 PRC_50s_Rework_event.65.t:0 "Sur la dictature démocratique populaire"
 PRC_50s_Rework_event.65.d:0 "Le 30 juin 1949, Mao Zedong a publié « Sur la dictature démocratique populaire », qui résumait l'expérience des 28 années de révolution démocratique sous la direction du Parti communiste chinois et expliquait la nature de la République populaire de Chine qui allait bientôt être établie, la position de chaque classe dans le pouvoir d'État et les politiques fondamentales de la nouvelle Chine dans les affaires intérieures et étrangères. Il soulignait que la dictature démocratique populaire de Chine était un régime dirigé par la classe ouvrière, basé sur l'alliance des ouvriers et des paysans, et incluant la petite bourgeoisie urbaine et la bourgeoisie nationale. Dans le même temps, Mao Zedong définissait la politique diplomatique consistant à « se ranger du côté » de l'Union soviétique et du camp socialiste."
 PRC_50s_Rework_event.65.a:0 "Bien"
 PRC_50s_Rework_event.66.t:0 "Le Parti communiste chinois prend le contrôle du Tibet"
 PRC_50s_Rework_event.66.d:0 "Alors que l'Armée populaire de libération pénétrait au Tibet, le Parti communiste chinois entra également dans la région. Le Comité central du Parti a officiellement annoncé la création du Comité de travail du PCC au Tibet comme son organisation dépêchée au Tibet. Cela marque le contrôle réussi du Tibet par le Parti communiste chinois. Le Comité de travail du PCC sur le Tibet créera progressivement, sur la base des conditions historiques et des circonstances spécifiques du Tibet, les conditions nécessaires aux réformes démocratiques et sociales, conduisant le Tibet vers une transition progressive vers une société socialiste."
 PRC_50s_Rework_event.66.a:0 "Grande victoire !"
 PRC_50s_Rework_event.67.t:0 "Ouverture de la première session de l'Assemblée populaire nationale"
 PRC_50s_Rework_event.67.d:0 "Après des années de préparation, la première session de l'Assemblée populaire nationale (APN) de la République populaire de Chine s'est tenue. Les membres de cette session ont été élus selon un processus complexe et à plusieurs niveaux, avec une large participation des masses. Les délégués de l'APN sont composés d'élites de divers secteurs de la société, de représentants des partis démocratiques, de représentants des cadres, ainsi que d'ouvriers et d'agriculteurs de la base. Cela marque la création officielle de l'organe suprême du pouvoir d'État et du corps législatif de la République populaire de Chine et représente un grand développement dans la démocratie socialiste. Au cours de cette session, nous adopterons la constitution formelle de la nouvelle Chine et élirons ensuite les dirigeants nationaux."
 PRC_50s_Rework_event.67.a:0 "Vive la République populaire de Chine !"
 PRC_50s_Rework_event.68.t:0 "Octroi de grades militaires "
 PRC_50s_Rework_event.68.d:0 "Afin de se différencier des anciennes armées du Kuomintang réactionnaire, l'APL n'avait pas de grades dans le passé. Des commandants aux soldats, tout le monde était considéré comme égal et les dirigeants devaient montrer l'exemple et endurer des épreuves. Cependant, à mesure que la modernisation et la régularisation de l'APL progressaient après la création de la République populaire de Chine, il devint nécessaire d'introduire un système de classement. Après un examen attentif et en s'inspirant du système soviétique, l'APL a officiellement mis en oeuvre un système de classement.\nIl était temps de reconnaître et de récompenser les camarades vétérans qui avaient suivi la révolution à travers de nombreuses épreuves. Sur la base de leurs positions et de leurs contributions, un total de 10 maréchaux, 10 généraux, 55 généraux supérieurs, 175 généraux de division et 798 généraux de brigade ont été nommés. A l'origine, il était prévu de conférer le titre de Grand Maréchal, à l'instar de Staline, à Mao Zedong, qui avait dirigé le Parti et le peuple tout au long de la révolution. Cependant, Mao Zedong a décliné ce rang le plus élevé, et celui-ci est donc resté vacant."
 PRC_50s_Rework_event.68.a:0 "S'il vous plaît, donnez l'ordre, Général !"
 PRC_50s_Rework_event.69.t:0 "Création de la Ligue de la jeunesse communiste chinoise"
 PRC_50s_Rework_event.69.d:0 "Pendant la période révolutionnaire, le Parti communiste chinois a créé la « Ligue de la jeunesse néo-démocrate chinoise » pour unir la jeunesse progressiste. Aujourd'hui, avec la victoire de la Nouvelle Révolution Démocratique, le développement de l'implication des jeunes talents dans la construction sociale ne doit pas cesser. Afin d'encourager davantage de jeunes à s'engager dans la grande cause communiste, la Nouvelle Ligue de la jeunesse démocratique prendra le modèle du Komsomol soviétique et se rebaptisera « Ligue de la jeunesse communiste de Chine ». Elle continuera d'exister en tant qu'organisation de jeunesse avancée sous la direction du PCC, servant d'école où la jeunesse chinoise apprend le marxisme-léninisme-maoïsme par la pratique. C'est l'assistant et la force de réserve du parti."
 PRC_50s_Rework_event.69.a:0 "Glorieux! Ligue de la jeunesse communiste de Chine !"
 PRC_50s_Rework_event.70.t:0 "Le débat sur le système des comités des partis scolaires"
 PRC_50s_Rework_event.70.d:0 "Alors que la Campagne des Cent Fleurs se poursuivait, les intellectuels des partis démocrates ont exprimé avec enthousiasme leurs propres opinions. De nombreux intellectuels ont commencé à débattre de la position de leader du Parti communiste dans le monde universitaire. Certains chercheurs pensaient que le Parti communiste était un outil de lutte des classes et que, depuis que la Chine était entrée dans la phase socialiste et avait achevé la lutte des classes, le monde universitaire était également entré dans le domaine socialiste. Par conséquent, ils ont soutenu que le Parti communiste, en tant qu'outil, devrait se retirer de l'enseignement dans les écoles. Ces universitaires pensaient que la direction du Parti communiste dans le monde universitaire se résumait à des amateurs guidant des professionnels et que l'administration scolaire devait être dirigée par des professeurs qui comprenaient vraiment les questions académiques. Cependant, de nombreux universitaires et responsables avaient des opinions opposées, affirmant que le Parti communiste était l'avant-garde du prolétariat et qu'il était nécessaire de veiller à ce que l'orientation pédagogique des écoles reste sur la bonne voie, s'opposant ainsi à son retrait des écoles."
 PRC_50s_Rework_event.70.a:0 "Laissons les érudits continuer à gouverner les écoles"
 PRC_50s_Rework_event.70.b:0 "La direction du parti est d'une importance capitale."
 PRC_50s_Rework_event.71.t:0 "Émeutes de masses locales"
 PRC_50s_Rework_event.71.d:0 "Notre campagne de rectification et de lutte contre la corruption a dénoncé certains intellectuels et étudiants, ce qui a provoqué un grand mécontentement parmi les étudiants locaux. Parallèlement à la baisse du taux de scolarisation cette année, les émotions des étudiants ont été enflammées, conduisant à des protestations et à des pétitions en divers endroits. Bien que certains incidents aient impliqué des attaques contre des bureaux du Parti et du gouvernement, l'ampleur de ces troubles a heureusement été relativement faible. Grâce à diverses mesures de persuasion et de coercition, les émotions des étudiants sont restées relativement sous contrôle. Cependant, ils ont obtenu un certain niveau de soutien de la part des citoyens et des masses, ce qui présente un risque important d'escalade."
 PRC_50s_Rework_event.71.a:0 "Bon sang, arrête vite !"
 PRC_50s_Rework_event.72.t:0 "Rhétorique anti-parti des étudiants"
 PRC_50s_Rework_event.72.d:0 "La situation s'est aggravée lorsque le long discours de Liu Shaoqi concernant les étudiants en échec a été publié dans le Quotidien du Peuple. Étonnamment, la solution proposée par Liu était d'aller à la campagne et de s'engager dans le travail, devenant ainsi des paysans instruits. Cela a suscité le mécontentement parmi les élèves du collège de Hanyang, conduisant à une grève et à des manifestations étudiantes. Avec le soutien de certains professeurs, les étudiants sont devenus encore plus fervents, écrivant même des slogans comme « Bienvenue au retour du Kuomintang » qui étaient contre le Parti. Ils ont commencé à cibler le parti et les institutions gouvernementales, provoquant des affrontements avec les autorités gouvernementales. Les étudiants ont vandalisé le bureau du comité du comté et ont même enfoncé la porte du bureau du gouverneur du comté. Heureusement, le directeur est intervenu à temps et a réussi à arrêter les élèves, évitant ainsi que la situation ne dégénère davantage."
 PRC_50s_Rework_event.72.a:0 "Envie de rébellion ?"
 PRC_50s_Rework_event.73.t:0 "Changer le système électoral"
 PRC_50s_Rework_event.73.d:0 "Les membres des partis démocrates multiplient les propositions et se radicalisent. Récemment, des membres des partis démocratiques ont publié des articles exprimant leur désir de réformer le système électoral de l'Assemblée populaire nationale et d'établir une véritable démocratie socialiste. Ils critiquent d'abord notre système actuel comme une fausse démocratie socialiste, avec un parti monopolisant l'Assemblée populaire nationale, ressemblant à une version de dictature à parti unique, qui ne reflète pas le principe selon lequel le peuple est le maître du pays. Ils proposent de mettre en place des élections directes et universelles à l'échelle nationale pour l'Assemblée populaire nationale, permettant au peuple d'organiser librement de nouveaux partis politiques et de publier des journaux. Certains vont même jusqu'à suggérer que différents partis démocratiques qui s'identifient au socialisme se relaient dans la gouvernance, choisis librement par les masses."
 PRC_50s_Rework_event.73.a:0 "Contes puants, amusement de propos stupides"
 PRC_50s_Rework_event.73.b:0 "Il y a peut-être un peu de vérité......"
 PRC_50s_Rework_event.74.t:0 "Deux avions insurgés sont retournés sur le continent"
 PRC_50s_Rework_event.74.d:0 "Le Kuomintang réactionnaire possédait deux compagnies aériennes importantes : China Airlines et Central Airlines. Ils ont apporté une contribution significative au plus fort de la guerre anti-japonaise avec les opérations de « transport aérien à bosse de chameau » et dans le « transport de démobilisation » d'après-guerre. Alors que le gouvernement du Kuomintang continuait de se retirer, les deux compagnies aériennes se retirèrent également. Cependant, inspiré par l'appel du gouvernement populaire, le personnel resté sur le continent s'est rendu à Hong Kong et a déclenché un soulèvement, rassemblant les travailleurs mécontents du camp réactionnaire du Kuomintang pour qu'ils retournent sur le continent. Leur mouvement patriotique apportera une technologie aéronautique précieuse à la nouvelle Chine et deviendra l'épine dorsale de l'industrie de l'aviation civile."
 PRC_50s_Rework_event.74.a:0 "Accueillir!"
 PRC_50s_Rework_event.75.t:0 "La France nous a tendu la main"
 PRC_50s_Rework_event.75.d:0 "Avec le développement constant de nos affaires étrangères, la nouvelle Chine a gagné la reconnaissance et le soutien de nombreux pays du tiers monde en Asie, en Afrique et en Amérique latine. Dans cette situation, les pays occidentaux ne pouvaient pas rester les bras croisés. La France, pays important du camp occidental, a également proposé la normalisation des relations avec la Chine. Comme la Chine, la France a une histoire glorieuse, notamment dans le contexte révolutionnaire. La faction pragmatique au sein du gouvernement français souhaitait également ardemment établir des relations diplomatiques avec la Chine. Cependant, la France reste un pays impérialiste influencé par l'idéologie colonialiste et, en tant que membre de l'OTAN, elle a réprimé les mouvements nationalistes locaux au Vietnam et en Afrique. En tant que membre du Camp Démocratique du Peuple, des délibérations plus approfondies sont nécessaires pour engager des activités diplomatiques avec la France."
 PRC_50s_Rework_event.75.a:0 "A bas le colonialisme !"
 PRC_50s_Rework_event.76.t:0 "La nouvelle Chine a été reconnue par le Royaume-Uni"
 PRC_50s_Rework_event.76.d:0 "Le régime réactionnaire du Kuomintang, soutenu par l'impérialisme occidental, luttait pour sa survie, tandis que la nouvelle République populaire de Chine n'était reconnue que par quelques pays démocratiques. Nous n'étions pas pressés d'établir des relations avec les puissances impérialistes occidentales, mais l'ancien empire sur lequel le soleil ne se couche jamais, le Royaume-Uni, a pris l'initiative et a tendu un rameau d'olivier. Ils ont fourni une « reconnaissance juridique » à la nouvelle Chine, faisant du Royaume-Uni le premier pays occidental à reconnaître la République populaire de Chine et à exprimer son désir d'établir des relations diplomatiques. Le Royaume-Uni, qui fut l'un des premiers pays à ouvrir les portes de la Chine, est aujourd'hui devenu le premier pays impérialiste à reconnaître la nouvelle Chine. Il s'agit d'une victoire diplomatique extraordinaire."
 PRC_50s_Rework_event.76.a:0 "Amitié pour toujours."
 PRC_50s_Rework_event.77.t:0 "Les négociations pour établir des relations diplomatiques entre la RPC et le Royaume-Uni ont échoué"
 PRC_50s_Rework_event.77.d:0 "La politique étrangère de la nouvelle Chine a adopté une stratégie de « penchant d'un côté » à l'égard de l'Union soviétique et a suivi une procédure de négociation avant d'établir des relations diplomatiques avec les pays occidentaux. L'autre partie a dû reconnaître explicitement la République populaire de Chine comme seul gouvernement légitime et rompre ses relations avec le régime du Kuomintang avant de s'engager dans de véritables négociations diplomatiques. Même si le Royaume-Uni reconnaissait la nouvelle Chine, son attitude sur cette question était ambiguë. Le Royaume-Uni a continué de reconnaître les représentants du Kuomintang aux Nations Unies et a maintenu des représentants du Kuomintang à Hong Kong. Comme les Britanniques n'ont pas accepté les conditions de la Chine et ont continué à entretenir des liens avec le Kuomintang, les négociations pour l'établissement de relations diplomatiques ont dû être abandonnées."
 PRC_50s_Rework_event.77.a:0 "La diplomatie doit être indépendante et autonome."
 PRC_50s_Rework_event.78.t:0 "S'opposer au traité de San Francisco"
 PRC_50s_Rework_event.78.d:0 "Plus de quarante nations victorieuses de la Seconde Guerre mondiale se sont rassemblées à San Francisco, aux États-Unis, et ont signé le « Traité de paix de San Francisco » avec le Japon, qui définissait le statut international du Japon. Cependant, en tant que principale force de résistance au fascisme japonais, la Chine n'était pas présente à la conférence en raison de problèmes de représentation, et le bloc soviétique a été exclu de la réunion. Ce soi-disant « traité » n'était qu'un traité unilatéral orchestré par les États-Unis et signé par un groupe partiel de pays occidentaux. Le contenu du traité concernant Taiwan et les îles Diaoyu était intentionnellement ambigu. Après plus de dix ans de résistance contre l'agression japonaise, le peuple chinois s'est finalement vu refuser la possibilité de participer à la rédaction et à la signature du traité de paix avec le Japon. Le gouvernement chinois refuse catégoriquement de reconnaître un traité aussi illégal et invalide."
 PRC_50s_Rework_event.78.a:0 "Un morceau de papier brouillon invalide."
 PRC_50s_Rework_event.79.t:0 "Incidents anti-chinois en Indonésie"
 PRC_50s_Rework_event.79.d:0 "L'Indonésie, comme d'autres pays colonisés d'Asie et d'Afrique, n'a pas achevé ses tâches anti-impérialistes et anti-féodales après l'indépendance, et le niveau de vie de la population ne s'est pas amélioré. Pour apaiser les tensions internes, les autorités indonésiennes ont fait de la communauté chinoise indonésienne un bouc émissaire. Le groupe dirigeant indonésien prévoyait depuis longtemps des mesures anti-chinoises, telles que la fermeture des écoles chinoises, la marginalisation des entreprises chinoises et l'interdiction des publications chinoises. Profitant de la rébellion tibétaine, le groupe dirigeant indonésien a lancé une campagne anti-chinoise à grande échelle, entraînant de graves pertes pour la communauté chinoise indonésienne locale. Le gouvernement chinois a exhorté à plusieurs reprises l'Indonésie à mettre fin à ses activités anti-chinoises, et les deux pays ont signé un communiqué commun. Cependant, les éléments de droite en Indonésie n'ont pas cessé leurs actions et ont plutôt accusé la Chine d'interférer dans les affaires intérieures de l'Indonésie, continuant d'inciter aux activités anti-chinoises."
 PRC_50s_Rework_event.79.a:0 "Condamnation diplomatique"
 PRC_50s_Rework_event.79.b:0 "Arrêtez le commerce avec eux."
 PRC_50s_Rework_event.80.t:0 "Le voyage de Mao Zedong à Moscou"
 PRC_50s_Rework_event.80.d:0 "Le 16 décembre 1949, le président Mao se rendit à Moscou à l'occasion de l'anniversaire du camarade Staline, première visite d'un nouveau dirigeant chinois. Un train spécial a voyagé de Pékin à Moscou pendant dix jours, comprenant un wagon plein de satsuma du Jiangxi et un wagon plein d'oignons verts du Shandong et d'autres spécialités, comme cadeau pour le 70e anniversaire de Staline."
 PRC_50s_Rework_event.80.a:0 "Vive l'amitié sino-soviétique !"
 PRC_50s_Rework_event.81.t:0 "Le voyage de Mao Zedong à Moscou I"
 PRC_50s_Rework_event.81.d:0 "L'ancien gouvernement nationaliste chinois avait signé en août 1945 le Traité d'amitié et d'alliance entre la Chine et l'Union soviétique. Ce traité et les accords connexes étaient le produit de l'accord de Yalta conclu entre l'Union soviétique, les États-Unis d'Amérique et le Royaume-Uni dans le dos de la Chine à la fin de la Seconde Guerre mondiale, qui a fondamentalement restauré les prérogatives des Russes tsaristes dans le nord-est de la Chine et a gravement porté atteinte à la souveraineté et aux intérêts de la Chine. Conformément à la politique de la Chine nouvelle consistant à « installer une nouvelle cuisinière » et à « nettoyer la maison avant d'inviter des invités », l'ancien accord sino-soviétique devrait également être aboli et un nouveau conclu. À son arrivée à Moscou, il s'est entretenu ce soir-là avec Staline pour discuter de la question. La partie chinoise a exprimé l'espoir que le résultat de la visite aboutisse à la conclusion d'un nouveau traité sino-soviétique."
 PRC_50s_Rework_event.81.a:0 "D'accord Conclusion d'un nouveau traité"
 PRC_50s_Rework_event.81.b:0 "Refuser la conclusion d'un nouveau traité"
 PRC_50s_Rework_event.82.t:0 "Les Soviétiques n'ont pas accepté de conclure un nouveau traité"
 PRC_50s_Rework_event.82.d:0 "Malgré nos discussions répétées avec l'Union soviétique sur l'abrogation du Traité d'amitié et d'alliance sino-soviétique, les Soviétiques étaient réticents à conclure un nouveau traité avec nous, et Staline a évoqué la possibilité de conserver formellement le traité existant tout en le modifiant dans la pratique. Nous devons faire savoir aux Soviétiques que depuis la défaite du Kuomintang, le Traité d'amitié et d'alliance sino-soviétique existant a perdu son but et sa signification."
 PRC_50s_Rework_event.82.a:0 "Continuez à négocier, ils doivent être compromis"
 PRC_50s_Rework_event.83.t:0 "Les Soviétiques acceptent de conclure un nouveau traité"
 PRC_50s_Rework_event.83.d:0 "Après nos efforts persistants, l'Union soviétique a accepté d'abroger le Traité d'amitié et d'alliance entre la Chine et l'Union soviétique, un traité inégal signé par la République de Chine et l'Union soviétique à l'occasion de la capitulation du Japon le 15 août 1945. Elle signera également une série de nouveaux traités diplomatiques avec nous pour améliorer les relations sino-soviétiques et nous fournir une assistance militaire et économique."
 PRC_50s_Rework_event.83.a:0 "Bravo à notre amitié"
 PRC_50s_Rework_event.84.t:0 "Demandez à l'Union soviétique de faire des compromis"
 PRC_50s_Rework_event.84.d:0 "Après de nombreuses discussions houleuses avec les Soviétiques, Staline, de son côté, affirma que le traité existant serait éventuellement modifié. Nous devons maintenant ajouter un nouvel effort pour parvenir à un compromis soviétique final. Si nous parvenons à signer un nouveau traité, la Chine et l'Union soviétique connaîtront une période de prospérité prévisible et prolongée, et la Chine sera bientôt en mesure de revenir à son niveau d'avant-guerre et de stabiliser le pays, ce qui ne nous fera aucun mal à tous les deux."
 PRC_50s_Rework_event.84.a:0 "Continue"
 PRC_50s_Rework_event.85.t:0 "L'URSS a accepté de retirer sa division de Lushun-Dalian"
 PRC_50s_Rework_event.85.d:0 "Nous avons fait des progrès appréciables dans nos négociations avec l'Union soviétique, qui a convenu que les troupes soviétiques seraient retirées de la base navale du port de Lushun après la conclusion d'un traité de paix avec le Japon, que nous établirions une période de transition de trois ans pour le retrait, que les troupes soviétiques seraient retirées de Lushun au plus tard à la fin de 1952 et qu'une commission mixte serait créée pour gérer le transfert de souveraineté avant le retrait. À ce stade, la région de Lushun, séparée de la mère patrie depuis près de 50 ans, a été officiellement restituée."
 PRC_50s_Rework_event.85.a:0 "Excellent"
 PRC_50s_Rework_event.86.t:0 "L'URSS n'a pas accepté de retirer sa division de Lushun-Dalian"
 PRC_50s_Rework_event.86.d:0 "Malgré nos efforts de négociation avec la partie soviétique, celle-ci est restée silencieuse sur le retrait des troupes, ce qui est très frustrant pour nous. Le peuple chinois a vécu une histoire coloniale qui dure depuis un siècle, et nous ne pouvons plus tolérer la question de la souveraineté sur la région de Lushun, et nous continuerons à négocier avec la partie soviétique jusqu'à ce qu'elle fasse un compromis."
 PRC_50s_Rework_event.86.a:0 "Poursuivre les négociations"
 PRC_50s_Rework_event.87.t:0 "L'Union Soviétique promet un compromis"
 PRC_50s_Rework_event.87.d:0 "Après plusieurs jours d'efforts, les Soviétiques ont finalement cédé et ont promis que le retrait des troupes dans la région de Lushun se ferait progressivement. Il s'agit d'une victoire diplomatique pour la Chine et d'un grand pas en avant dans l'amitié sino-soviétique. Entre-temps, le gouvernement chinois serait responsable des coûts de construction et d'installation soviétiques depuis 1945. Un mécanisme de post-rotation sera établi par la Commission militaire mixte sino-soviétique pour superviser les affaires militaires jusqu'au transfert de propriété."
 PRC_50s_Rework_event.87.a:0 "Enfin"
 PRC_50s_Rework_event.88.t:0 "Le problème d'Acheson"
 PRC_50s_Rework_event.88.d:0 "Traître !"
 PRC_50s_Rework_event.88.a:0 "Communiquer avec l'Union soviétique sur le problème Acheson"
 PRC_50s_Rework_event.88.b:0 "Critiquer Acheson sans autorisation"
 PRC_50s_Rework_event.89.t:0 "Le voyage de Mao Zedong à Moscou II"
 PRC_50s_Rework_event.89.d:0 "Récemment, le secrétaire d'État américain Acheson a fait une déclaration au National Press Club des États-Unis dans laquelle il a répandu une rumeur selon laquelle \"l'Union soviétique est sur le point de procéder à une fusion dans le nord-est de la Chine\". En réponse, le président Mao Zedong, au nom de Hu Qiaomu, directeur de l'Administration générale de l'information du gouvernement populaire central de Chine, a publié une déclaration intitulée « Réfuter la rumeur éhontée d'Acheson », qui a été diffusée par l'agence de presse Xinhua et mise en évidence dans son intégralité sur la première page du Quotidien du Peuple."
 PRC_50s_Rework_event.89.a:0 "L'amitié sino-soviétique ne peut être provoquée."
 PRC_50s_Rework_event.90.t:0 "Le voyage de Mao Zedong à Moscou III"
 PRC_50s_Rework_event.90.d:0 "Après que Staline eut accepté de signer le Nouveau Pacte et d'abroger l'Ancien Pacte, Mao Zedong commença un autre programme de visites en URSS, notamment pour visiter diverses régions du pays. Mao a d'abord visité la tombe de Lénine sur la Place Rouge de Moscou et a déposé une couronne de fleurs ; le lendemain, Mao visita le métro de Moscou, un arsenal à la périphérie de la ville et une ferme collective ; après deux jours supplémentaires, Mao arriva à Leningrad, où il visita les galeries d'art de la ville, les fortifications de l'époque de la guerre patriotique, l'usine de machines Kirov et le croiseur « Avror ». Il a également vu le ballet \"Bayadeltka\" et s'est rendu en voiture jusqu'à la mer Baltique pour visiter la forteresse de Kronstadt, l'un des lieux de naissance de la Révolution d'Octobre."
 PRC_50s_Rework_event.90.a:0 "Faire de notre mieux."
 PRC_50s_Rework_event.91.t:0 "Signature du Traité d'assistance mutuelle et d'amitié entre la Chine et l'URSS"
 PRC_50s_Rework_event.91.d:0 "Après trois mois de négociations, le Traité d'amitié et d'assistance mutuelle entre la Chine et l'Union soviétique a été officiellement signé avec les dispositions suivantes :\n(1) Un engagement de sécurité collectif à traiter les attaques d'un côté comme des attaques des deux côtés afin d'empêcher la renaissance de l'impérialisme japonais. Face à l'agression et à la guerre, les deux parties sont obligées de fournir une assistance militaire et autre. Les parties s'engagent à respecter le principe de coopération dans l'intérêt de la paix et de la sécurité internationales.\n(2) Les signataires concluront des traités de paix avec le Japon et d'autres pays alliés pendant la Seconde Guerre mondiale.\n(3) Les signataires ne s'engagent pas dans des alliances ou des coalitions les uns contre les autres.\n(4) Les signataires se consultent sur les questions majeures présentant un intérêt fondamental pour les signataires.\n(5) Les parties conviennent de respecter les principes « d'égalité des droits, d'intérêts mutuels, de respect de la souveraineté et de l'intégrité territoriale, de non-ingérence », de promotion d'une coopération étroite et de fourniture d'une assistance économique et industrielle, et s'efforceront de renforcer l'amitié sino-soviétique.\n(6) Le Traité sera valable pendant trente ans et sera automatiquement prorogé pour cinq ans supplémentaires si aucune Partie ne s'y oppose un an avant son expiration.\nAprès la signature du traité, l'Union soviétique aidera la Chine dans tous les aspects de son système économique, ce qui accélérera l'industrialisation et la modernisation de la Chine."
 PRC_50s_Rework_event.91.a:0 "Très bien"
 PRC_50s_Rework_event.92.t:0 "Une semaine de déception"
 PRC_50s_Rework_event.92.d:0 "Au lieu d'être approuvée par les Soviétiques, notre critique d'Acheson a été critiquée en face par Staline et Molotov, ce qui est surprenant car Mao n'avait pas publié l'article du ministère des Affaires étrangères mais avait utilisé une agence de presse, contre leur avis, et les Soviétiques estimaient que Mao était trop autonome, ce que Mao prenait à coeur et se sentait très humilié. Mao n'a pas dit un mot pendant que Staline rentrait à sa résidence accompagné de sa voiture et refusait d'inviter Staline dans ses quartiers en tant qu'invité."
 PRC_50s_Rework_event.92.a:0 "Scandaleux"
 PRC_50s_Rework_event.94.t:0 "Statut du navire Chongqing"
 PRC_50s_Rework_event.94.d:0 "En octobre 1951, le Comité central du Parti décida de discuter de l'avenir du navire Chongqing nouvellement récupéré, un croiseur léger offert au gouvernement nationaliste par la marine britannique après la Seconde Guerre mondiale. À la fin de la guerre civile, le navire Chongqing a été bombardé par des avions de combat du KMT alors qu'il marchait vers le nord pour rejoindre la marine de l'Armée populaire de libération, causant de graves dommages à la poupe du navire, et a coulé tout seul dans le port.\nDeux ans après le naufrage, le navire Chongqing a été sauvé, les canons principaux et secondaires ont été endommagés, l'équipement électrique, tous les instruments, les équipements optiques et les équipements de communication n'étaient plus adaptés, restaurer l'efficacité au combat du navire Chongqing et le moderniser est un projet de système difficile et vaste, les travaux de réparation prendront environ 3 à 5 ans et le coût est énorme, ce qui n'est pas un petit défi pour nous. Notre économie naissante sera soumise à d'énormes pressions."
 PRC_50s_Rework_event.94.a:0 "Envoyez le navire en Union soviétique pour le remodeler !"
 PRC_50s_Rework_event.94.b:0 "Nous sommes un peu à court d'argent"
 PRC_50s_Rework_event.95.t:0 "La renaissance du navire Chongqing"
 PRC_50s_Rework_event.95.d:0 "Après trois ans de réparations, le navire Chongqing a été modernisé et renaît, et devrait bientôt revenir en Chine depuis l'Union soviétique pour être livré à la marine de l'Armée populaire de libération. Une fois que nous aurons suffisamment de destroyers et de forces aériennes, le navire Chongqing jouera un rôle énorme dans la future guerre atomique de la Chine, et l'achèvement de la modernisation navale de la Chine et la libération de Taiwan seront très proches."
 PRC_50s_Rework_event.95.a:0 "Excellent"
 PRC_50s_Rework_event.96.t:0 "Le nouveau programme de transformation en URSS"
 PRC_50s_Rework_event.96.d:0 "Après avoir temporairement mis le navire Chongqing en veilleuse, le bureau de conception soviétique de Leningrad a proposé un nouveau plan qui nous donnerait un croiseur léger moderne et un énorme avantage lors de la campagne ultérieure à Taiwan, dont on s'attendait à ce qu'elle coûte environ 200 millions de roubles et prenne jusqu'à quatre ou cinq ans pour sa reconstruction."
 PRC_50s_Rework_event.96.a:0 "Le moment est venu, le moment est venu."
 PRC_50s_Rework_event.96.b:0 "Nous n'avons pas à gaspiller autant d'argent"
 PRC_50s_Rework_event.97.t:0 "Adaptation à l'ère des missiles"
 PRC_50s_Rework_event.97.d:0 "Après l'achèvement de la modernisation du navire Chongqing, nous continuerons d'approfondir la modernisation de la Marine pour faire face à l'arrivée de l'ère des missiles. À cet égard, la Chine a signé « l'Accord du 4 février » avec l'Union soviétique, et nous commencerons à introduire des missiles antinavires de fabrication soviétique tels que le SS-N-2 Styx, et commencerons progressivement à les copier. On pense que dans un avenir proche, notre armée sera capable de s'adapter à l'arrivée de l'ère des missiles, de renforcer ses capacités de prévention des incendies côtiers et de porter un coup frontal à l'ennemi."
 PRC_50s_Rework_event.97.a:0 "Un coup de poing pour éviter cent coups"
 PRC_50s_Rework_event.98.t:0 "Renaissance du navire Chongqing"
 PRC_50s_Rework_event.98.d:0 "Après trois ans de travaux de restauration, le navire Chongqing a été modernisé et équipé de nouvelles armes de fabrication soviétique. Il reviendra bientôt de l'Union soviétique en Chine, où il jouera à l'avenir un rôle clé dans la défense des frontières maritimes de la Chine. Le peuple chinois ne sera plus jamais victime d'intimidation en mer et notre cause de modernisation navale a fait un grand pas en avant."
 PRC_50s_Rework_event.98.a:0 "Excellent"
 PRC_50s_Rework_event.99.t:0 "Avertissement à la RPDC"
 PRC_50s_Rework_event.99.d:0 "L'ambassadeur soviétique en Chine, Roshchin, rapporta à Staline que le dirigeant chinois, Mao Zedong, avait déterminé qu'il était essentiel de renforcer la défense de la région de Séoul en établissant une position fortifiée à Inchon. Cela était dû à la possibilité que les forces américaines y débarquent. Par la suite, les Chinois ont également rappelé à plusieurs reprises à la partie coréenne de prêter attention au danger que les forces américaines avancent de la mer vers Inchon et Séoul pour couper la route arrière de l'Armée populaire coréenne, et que l'Armée populaire coréenne devrait faire les préparatifs adéquats pour se retirer en temps opportun vers le nord, sauver ses forces majeures et lutter pour la victoire dans une guerre prolongée. Après avoir reçu de nombreux avertissements des parties chinoise et soviétique, l'Armée populaire coréenne a effectué des déploiements défensifs dans les régions d'Inchon et de Séoul, mais la plupart des unités dans la région étaient nouvellement formées et avaient une faible puissance de combat, ce qui rendait difficile une défense efficace contre les opérations de débarquement à grand volume des forces américaines."
 PRC_50s_Rework_event.99.a:0 "La prévention est une bonne option"
 PRC_50s_Rework_event.100.t:0 "Pessimisme au sein de la direction"
 PRC_50s_Rework_event.100.d:0 "Il y a quelques semaines, sous le commandement du général MacArthur, les « forces de l'ONU » ont dirigé le 10e corps américain dans l'opération de débarquement d'Incheon, appuyé par les forces navales et aériennes. L'Armée populaire coréenne a été prise dans une attaque en tenaille du nord et du sud, subissant de lourdes pertes, et la situation en Corée s'est rapidement détériorée. Les flammes de la guerre se sont rapidement propagées vers le nord, atteignant la frontière sino-coréenne, plongeant les dirigeants de la République dans une situation difficile exigeant des décisions urgentes. La nouvelle Chine venait de célébrer son premier anniversaire et le pays était appauvri par manque de ressources. L'ordre politique, économique et social n'était pas encore pleinement établi. L'envoi de troupes d'un pays agricole sous-développé pour lutter contre l'armée américaine la plus modernisée a laissé peu de confiance aux dirigeants du Parti communiste chinois. Il semblait que l'exil du gouvernement nord-coréen et l'échec de la révolution coréenne étaient inévitables."
 PRC_50s_Rework_event.100.a:0 "Convaincre ces camarades"
 PRC_50s_Rework_event.105.t:0 "Les États-Unis ont franchi le 38e parallèle"
 PRC_50s_Rework_event.105.d:0 "Au milieu du rugissement des tirs d'artillerie et des chars, les troupes américaines et sud-coréennes franchirent le 38e parallèle et pénétrèrent sur le territoire de la Corée du Nord. Ces mesures constituent une violation totale du droit international et constituent un acte d'agression contre la Corée du Nord. Le président Kim Li-sung nous a déjà demandé de l'aide. Il espère que la Chine enverra une armée en Corée du Nord pour se joindre à la guerre et l'aider à repousser les agresseurs impérialistes américains. Il a affirmé qu'une fois la Corée occupée par les États-Unis, la Chine serait la prochaine cible des « forces des Nations Unies »."
 PRC_50s_Rework_event.105.a:0 "Cela renforce notre confiance"
 PRC_50s_Rework_event.105.b:0 "Il faut le faire !"
 PRC_50s_Rework_event.106.t:0 "Décision d'entrer dans la guerre de Corée"
 PRC_50s_Rework_event.106.d:0 "Nous avons décidé d'envoyer nos troupes de l'autre côté du fleuve Yalu pour défendre notre pays frère socialiste, la Corée. Acceptez la mort, impérialistes américains, notre poigne de fer socialiste vous chassera de la péninsule coréenne."
 PRC_50s_Rework_event.106.a:0 "Si vous frappez un coup de poing pour l'ouvrir, ne laissez pas cent coups arriver."
 PRC_50s_Rework_event.112.t:0 "Accord d'armistice sur la péninsule coréenne"
 PRC_50s_Rework_event.112.d:0 "Enfin, les impérialistes américains ont décidé de se rendre à nous, et les troupes américaines se retireront du territoire du peuple coréen, du fleuve à la mer, la Corée socialiste sera enfin libérée. Nous rencontrerons les hauts gradés militaires américains et négocierons un accord final de cessez-le-feu."
 PRC_50s_Rework_event.112.a:0 "Vive les peuples chinois et coréen !"
 PRC_50s_Rework_event.116.t:0 "Fin de la guerre de Corée"
 PRC_50s_Rework_event.116.d:0 "Après de violents combats, la guerre de Corée est terminée. Nous avons pu retirer nos troupes pour les réorganiser et la paix est finalement revenue dans la péninsule coréenne."
 PRC_50s_Rework_event.116.a:0 "Paix dans notre génération."
 PRC_50s_Rework_event.127.t:0 "Rapport de Mao Zedong à la deuxième séance plénière du huitième Comité central"
 PRC_50s_Rework_event.127.d:0 "Aujourd'hui, la deuxième session plénière du huitième Comité central du Parti communiste chinois s'est officiellement ouverte à Pékin. Au cours de la session, Mao Zedong a prononcé un discours de clôture, approuvant les différentes politiques et mesures adoptées par la réunion plénière. Il s'est concentré sur les questions liées à l'économie, à la situation internationale, aux relations sino-soviétiques et à la question de « la grande et la petite démocratie ». Mao a appelé tout le personnel à combattre les tendances au subjectivisme, au sectarisme et au bureaucratisme. À la suggestion de Mao, la séance plénière décida de lancer une campagne de rectification au sein du Parti à partir de la seconde moitié de 1957, ciblant trois questions : le subjectivisme, le sectarisme et le bureaucratisme. Guidée par le principe du maintien de l'équilibre global, la séance plénière a également apporté les ajustements appropriés au plan économique national pour 1957."
 PRC_50s_Rework_event.127.a:0 "Pour assurer la bonne réalisation du premier plan quinquennal !"
 PRC_50s_Rework_event.130.t:0 "Le rapport secret de Gao Gang à Mao Zedong"
 PRC_50s_Rework_event.130.d:0 "Concernant la question de Liu Shaoqi, Gao Gang a écrit à Mao Zedong en mentionnant que Liu, lors de réunions de travail passées, avait encore délibérément mal interprété la politique du PCC envers la bourgeoisie nationale en s'unissant aux exploiteurs afin que la bourgeoisie ne se rebelle pas contre le socialisme et serve le socialisme. Mais en réalité, cela revient à prôner la fusion du prolétariat et de la bourgeoisie et à qualifier cette méthode de méthode de transition pacifique. Gao voulait que le président souligne que cette grave erreur opportuniste de droite de Liu n'était pas accidentelle mais avait des racines historiques, et qu'une erreur comme la sienne dans une position de direction aussi élevée causerait de grands dommages à notre cause socialiste, même si le président avait déjà critiqué l'erreur de Liu.\nMais Mao n'a pas tenu compte de la révélation de Gao. À cette époque, l'évaluation de Liu par Mao était qu'il avait une pensée un peu à droite, mais qu'il obéissait à la discipline et fondamentalement à ce qu'on lui disait, et qu'il était créatif dans son travail, ce qui était exactement le genre de camarade dirigeant dont nous avions besoin."
 PRC_50s_Rework_event.130.a:0 "Il a continué à tolérer Liu Shaoqi et il croyait que Liu changerait."
 PRC_50s_Rework_event.131.t:0 "Contre-attaque du syndicalisme de droite"
 PRC_50s_Rework_event.131.d:0 "Lors de la récente réunion élargie du Groupe du Parti de la Fédération panchinoise, Li Fuchun, au nom du Conseil des dirigeants du Parti de la Fédération panchinoise, a souligné que Li Lizan avait commis de graves erreurs de syndicalisme sur la question des relations entre les syndicats et le Parti, ainsi que des erreurs de subjectivisme, de formalisme, de transactionnalisme et même de patriarcat dans ses méthodes de travail. Il a également souligné que ces erreurs, \"graves erreurs de principe\", \"montrent des tendances social-démocrates\", \"sont totalement anti-marxistes-léninistes et sont extrêmement préjudiciables au mouvement ouvrier et à la cause de notre Parti\"."
 PRC_50s_Rework_event.131.a:0 "A bas Li Lisan !"
 PRC_50s_Rework_event.132.t:0 "Appui à l'assistance mutuelle en matière agricole"
 PRC_50s_Rework_event.132.d:0 "Afin de créer les conditions de l'industrialisation et d'accélérer l'édification socialiste, et puisque l'augmentation de la production des paysans individuels est limitée, il est nécessaire de développer l'entraide et la coopération et de transformer l'économie agricole individuelle, basée sur la propriété privée des moyens de production, en une économie agricole coopérative basée sur la propriété publique des moyens de production, afin que le socialisme puisse prendre en charge le secteur agricole, augmenter la productivité et accélérer l'industrialisation du pays. La règle générale est de passer des groupes d'entraide aux coopératives, mais dans le processus d'entraide et de coopération, il est important d'adhérer au principe du volontariat et du bénéfice mutuel, de ne pas être prescriptif ou timide et d'être réaliste dans son travail."
 PRC_50s_Rework_event.132.a:0 "Pour réaliser la transformation socialiste, une coopération agricole mutuelle est indispensable."
 PRC_50s_Rework_event.134.t:0 "Transférer les dirigeants de la grande zone administrative à Pékin"
 PRC_50s_Rework_event.134.d:0 "En septembre 1952, alors que la guerre contre les États-Unis et pour la Corée du Nord entrait dans la phase de négociation, le Comité central du Parti communiste chinois, sur les conseils de Mao Zedong, décida de transférer les secrétaires des bureaux centraux et un groupe de cadres pour travailler au Comité central, afin de renforcer la direction du Comité central du Parti et du gouvernement central, et de préparer une réduction de la structure et des pouvoirs des bureaux centraux et des principaux gouvernements régionaux."
 PRC_50s_Rework_event.134.a:0 "Cela pourrait développer notre travail."
 PRC_50s_Rework_event.135.t:0 "Critique du nouveau système fiscal de Bo Yibo"
 PRC_50s_Rework_event.135.d:0 "Peu de temps après la mise en oeuvre du nouveau système fiscal, les dirigeants et les comités des finances des provinces et des villes des différentes régions ont écrit des lettres et des télégrammes au Comité central des finances et au Comité central du PCC pour exprimer leurs points de vue sur la fluctuation des prix, la confusion des idées et les difficultés et problèmes rencontrés au cours de la mise en oeuvre du nouveau système fiscal. Mao Zedong a également souligné que le nouveau système fiscal avait été discuté par la Commission centrale de contrôle de la discipline et qu'aucune circulaire n'avait été envoyée aux bureaux centraux, aux succursales, aux provinces et aux comités municipaux pour sa mise en oeuvre.\nLors de la réunion de rapport au Bureau politique du Comité central sur la révision du système fiscal, Mao a vivement critiqué le fait que l'erreur de Bo Yibo était le reflet de l'idéologie bourgeoise selon laquelle les slogans de la fiscalité, du système fiscal, du système fiscal et du système fiscal en général, et du système fiscal en particulier, n'étaient pas conformes aux principes du Comité central. Que les slogans fiscaux, tels que \"public et privé également\", étaient contraires à la résolution de la deuxième séance plénière du septième Comité central plénier, et que la révision du système fiscal, qui n'avait pas été signalée au préalable au Comité central, était une erreur opportuniste de droite ; et que le Conseil d'État était également coupable de l'erreur de décentralisation. Il a également souligné la nécessité de s'opposer aux idées bourgeoises au sein du PCC, de renforcer la direction du Comité central du PCC sur les organes gouvernementaux et de promouvoir l'esprit d'humble instruction et de courage."
 PRC_50s_Rework_event.135.a:0 "Adhérez au système de direction collective et achevez la transformation du socialisme afin d'atteindre la victoire du socialisme."
 PRC_50s_Rework_event.137.t:0 "Critiquer les membres seniors pour avoir porté atteinte à la discipline"
 PRC_50s_Rework_event.137.d:0 "\"Tout le monde devrait être comme une famille, comme des frères, et quiconque a des défauts ou des erreurs, tant que ce n'est pas une question de principe et ne nuit pas à l'organisation du Parti, n'est généralement pas pris au sérieux.\""
 PRC_50s_Rework_event.137.a:0 "essuyer"
 PRC_50s_Rework_event.138.t:0 "Gao Gang a décidé de profiter de la victoire pour poursuivre"
 PRC_50s_Rework_event.138.d:0 "En ce moment, Gao Gang est sur le point de connaître un changement majeur de leadership. Son influence croissante avait renforcé sa confiance. Beaucoup, à l'intérieur et à l'extérieur du Parti, s'attendent à ce qu'il se présente aux postes les plus élevés.\nGao Gang va remodeler la structure du pouvoir au sein du PCC. À ce moment critique, Gao Gang n'envisage pas simplement un changement de direction, mais est également prêt à redéfinir l'orientation du Parti et du pays. Ses ambitions feront de ces événements un chapitre important de l'histoire du PCC."
 PRC_50s_Rework_event.138.a:0 "Lien vers la clique opposée à la zone blanche"
 PRC_50s_Rework_event.138.b:0 "Attendez les instructions de Mao Zedong"
 PRC_50s_Rework_event.139.t:0 "Rao Shushi a critiqué An Ziwen pour son travail organisationnel défavorable"
 PRC_50s_Rework_event.139.d:0 "Rao Shushi, l'ancien premier secrétaire du Bureau de la Chine orientale transféré au Comité central et aujourd'hui ministre du Département de l'Organisation centrale, a vivement critiqué l'organisation du vice-ministre exécutif An Ziwen lors de la réunion. En théorie, les deux principaux dirigeants du Département d'organisation du Comité central devraient être unis, mais le numéro un et le numéro deux ont commencé à se désunir, et cette désunion devrait être stoppée.Cependant, compte tenu du factionnalisme bien connu, les critiques de Rao Shushi sont susceptibles d'être indirectement dirigées contre Liu Shaoqi, une tendance au sectarisme qu'il faudrait bien évaluer."
 PRC_50s_Rework_event.139.a:0 "Vous ne pouvez pas rester ensemble ?"
 PRC_50s_Rework_event.140.t:0 "Peng Dehuai veut confier le travail de la Commission militaire centrale à Gao Gang"
 PRC_50s_Rework_event.140.d:0 "Peng Dehuai était très heureux d'assister à la nouvelle ambiance en Chine, mais il se considérait comme peu instruit et en mauvaise condition physique. Il considérait Gao Gang comme physiquement robuste, talentueux et capable d'accomplir une tâche aussi exigeante que le travail de la Commission militaire, et l'idée de quitter l'armée resurgit dans son esprit. Il a proposé cette idée à Mao Zedong et a fortement recommandé à Gao de siéger à la Commission militaire, mais toutes ces idées ont été rejetées par Mao. La nouvelle Chine venait juste d'être établie, et c'était une époque où la main-d'oeuvre manquait, et Gao avait sa part de choses à servir, donc Mao dut décliner les conseils de Peng."
 PRC_50s_Rework_event.140.a:0 "Voyant cela, Peng Dehuai n'a rien dit et n'a pu que servir."
 PRC_50s_Rework_event.141.t:0 "La clique de la zone soviétique se méfie de la prise de pouvoir de la clique de la zone blanche"
 PRC_50s_Rework_event.141.d:0 "Après avoir critiqué le nouveau système fiscal de Bo Yibo, Gao Gang a demandé à Tao Zhu et à d'autres cadres de s'opposer davantage au « cercle » de Bo Yibo. Liu Shaoqi n'avait travaillé que dans les zones blanches et n'avait aucune expérience dans la construction de zones blanches telles que d'autres zones de base, etc. (Par conséquent, Gao Gang a appelé Liu Shaoqi et d'autres la faction de la zone blanche, et il était naturellement la faction de la zone soviétique). De plus, Gao Gang pensait avoir été transféré hors du Nord-Est parce que la faction du District Blanc de Liu Shaoqi « avait transféré le tigre loin de la montagne » afin de laisser la faction du District Blanc prendre en charge le travail du Nord-Est et consolider son pouvoir. Lors de la réunion financière et économique qui a suivi, la faction soviétique dirigée par Gao Gang a critiqué les erreurs de Bo Yibo et les a étendues à Liu Shaoqi, jusqu'à ce que Bo Yibo soit démis de ses fonctions de ministre des Finances."
 PRC_50s_Rework_event.141.a:0 "La lutte pour le pouvoir s'intensifie"
 PRC_50s_Rework_event.142.t:0 "Gao Gang a obtenu le feu vert de Mao Zedong"
 PRC_50s_Rework_event.142.d:0 "Peu de temps après la fondation de la République populaire de Chine, la coopération d'entraide entre le Comité provincial coopératif du Shanxi et les anciennes régions a montré des signes de désintégration. Par conséquent, le Comité provincial a proposé au gouvernement central de transformer le groupe d'entraide en coopérative de production agricole, mais cette proposition a été rejetée par Liu Shaoqi et considérée comme un socialisme agricole utopique.\n\nEn réponse, Gao Gang a rédigé un rapport sur le mouvement de coopération en matière de production et d'assistance mutuelle dans les zones rurales du nord-est de la Chine, et a souligné que la tendance actuelle devrait s'opposer aux tendances spontanées des agriculteurs et que les coopératives devraient se développer de bas en haut. Après avoir lu ceci, Mao Zedong a hautement félicité et a demandé à Yang Shangkun d'imprimer cet article dans un livret et de le distribuer aux comités du parti dans divers districts du pays. Le même jour, Mao Zedong a également rédigé un commentaire sur ce rapport et a hautement apprécié le rapport de Gao Gang."
 PRC_50s_Rework_event.142.a:0 "Une différence d'opinion et un désaccord fonctionnels"
 PRC_50s_Rework_event.143.t:0 "Gao Gang a obtenu la liste du Politburo"
 PRC_50s_Rework_event.143.d:0 "An Ziwen, chef adjoint du Département de l'organisation centrale, a rédigé une liste des membres du Politburo pour le 8e Congrès national du PCC à la demande du Comité central et l'a rapportée à Mao Zedong, qui l'a montré peu après en privé à Gao Gang. \nLa liste comprenait Bo Yibo, qui venait d'être critiqué, mais pas Lin Biao, le porte-drapeau de la Quatrième Armée de campagne, qui avait réalisé de grands succès pendant la guerre. La liste ne tenait clairement pas compte de l'équilibre entre les chiffres importants......\nPeut-être que l'étendre ferait tomber la faction du Secteur Blanc plus rapidement ? \nMieux vaut être prudent ?"
 PRC_50s_Rework_event.143.a:0 "Gao Gang a diffusé la liste du Politburo"
 PRC_50s_Rework_event.143.b:0 "Gao Gang a gardé la bouche fermée"
 PRC_50s_Rework_event.144.t:0 "Mao Zedong a interrogé le gang Gao"
 PRC_50s_Rework_event.144.d:0 ""
 PRC_50s_Rework_event.144.a:0 "Gao Gang persécute encore davantage l'unité du parti"
 PRC_50s_Rework_event.145.t:0 "Gao Gang trace une ligne dans le sable avec Rao Shushi"
 PRC_50s_Rework_event.145.d:0 "Sous les instructions du président Mao, bien que Gao Gang et Rao Shushi aient commis l'erreur de saper l'unité du parti, ils ont quand même dû respecter le principe de « punir le premier et punir le second, soigner les malades et sauver les gens » lors de la réunion, et n'ont pas critiqué les gens autant que possible, afin de donner la priorité à l'aide à l'éducation et de laisser Gao Gang et Rao Shushi se réveiller. Zhou Enlai, Liu Shaoqi et Deng Xiaoping ont parlé successivement à Gao Gang et Rao Shushi, mais Liu Shaoqi, Zhou Enlai et Deng Xiaoping ont fait pression sur Gao Gang non seulement pour qu'il se critique lui-même, mais aussi pour qu'il accepte les critiques des autres. En parlant à Rao Shushi, Rao Shushi a nié qu'il était de connivence avec Gao Gang et a tracé une ligne avec Gao Gang (en fait, Gao Gang et Rao Shushi étaient un allié), mais Liu Shaoqi a également déterré la saleté de Rao Shushi...\n\nLors de la quatrième session plénière du septième Comité central du Parti communiste chinois, Mao Zedong n'a pas assisté à la rédaction de la constitution, et la situation est devenue incontrôlable..."
 PRC_50s_Rework_event.145.a:0 ""
 PRC_50s_Rework_event.146.t:0 "L'Assemblée populaire nationale a décidé de créer un Conseil des ministres"
 PRC_50s_Rework_event.146.d:0 "La décision du Comité central du Parti de créer le Conseil des ministres par l'intermédiaire de l'Assemblée populaire nationale reflète les leçons que la Chine a tirées du modèle soviétique. Le Conseil des ministres de l'URSS était l'organe administratif le plus élevé, centralisant le pouvoir et rationalisant la gestion. En adoptant une structure similaire, il démontrait le désir de la Chine d'explorer le socialisme. L'objectif ultime était de mieux gérer un État socialiste en évolution, mettant ainsi en oeuvre les politiques plus efficacement et coordonnant le travail de toutes les branches du gouvernement."
 PRC_50s_Rework_event.146.a:0 "Notre nouveau chef!"
 PRC_50s_Rework_event.147.t:0 "Gao Gang a été nommé président du Conseil des ministres."
 PRC_50s_Rework_event.147.d:0 "Suite à la décision du Comité central du Parti de créer le Conseil des ministres, Gao Gang a été élu premier président du Conseil des ministres. En assumant ce poste, Gao cherchait à imiter le modèle soviétique de centralisation et à se positionner comme une figure de proue de la nouvelle structure administrative. Cependant, sa nomination a également alimenté le feu des luttes factionnelles qui s'intensifiaient, de sorte que l'ambition de Gao de consolider le pouvoir devait se heurter plus tard à la résistance et même aux intrigues au sein du Parti."
 PRC_50s_Rework_event.147.a:0 "D'accord."
 PRC_50s_Rework_event.148.t:0 "Rapport sur la vie corrompue de Gao Gang"
 PRC_50s_Rework_event.148.d:0 "1. Pendant son mandat dans le nord-est de la Chine, Gao Gang a gaspillé les ressources nationales en construisant un terrain de basket extérieur éclairé dans sa résidence officielle.\n\n2. Avoir des relations inappropriées avec plusieurs femmes, y compris des guerrières, et avoir une vie privée chaotique.\n\n3.Gao Gang s'est comporté de manière grossière à plusieurs reprises dans des occasions comme des danses, et le camarade Zhou Enlai le lui a conseillé à plusieurs reprises, mais il ne s'est toujours pas corrigé.\n\nLa pensée individualiste et les désirs corrompus de Gao Gang dans sa vie privée n'ont pas été corrigés ou stoppés depuis longtemps, et se sont encore développés après la victoire nationale. C'est son côté obscur. Le développement du côté obscur de Gao Gang a progressivement fait de lui le véritable agent de la bourgeoisie au sein de notre parti."
 PRC_50s_Rework_event.148.a:0 "Je ne peux pas tolérer !"
 PRC_50s_Rework_event.150.t:0 "Mao Zedong a décidé d'envoyer un signal d'alarme au gang Gao"
 PRC_50s_Rework_event.150.d:0 "Lié à la fuite de la liste du Politburo et au rapport de Chen Yun et Deng Xiaoping sur Gao Gang les encourageant à travailler ensemble pour faire tomber Liu Shaoqi, qui se livre manifestement à des activités sectaires, a éveillé la vigilance de Mao Zedong, il y a réfléchi : Chen Yun a de bonnes relations avec Gao Gang, et Deng Xiaoping n'a pas travaillé avec Gao Gang, et leurs déclarations doivent être objectives et justes. Nous sommes maintenant au début de la construction socialiste, notre parti doit être unanime et uni, non pas à cause de quelques petits conflits qui affectent l'unité du parti, Liu Shaoqi est certainement un peu de droite, mais il obéit à la discipline...... \n\nComment traiter le problème du Gao Gang ?"
 PRC_50s_Rework_event.150.a:0 "Laissez Gao Gang se retirer du Comité central"
 PRC_50s_Rework_event.150.b:0 "Autoriser la critique de Gao Gang"
 PRC_50s_Rework_event.151.t:0 "Abolir le système de la grande zone administrative"
 PRC_50s_Rework_event.151.d:0 "Afin de répondre aux besoins de la nouvelle construction économique de la Chine, et également d'arrêter la répétition de l'incident de Gao Yao, le gouvernement populaire central abolirait successivement les organes administratifs des grandes régions administratives, le gouvernement central administrerait directement les provinces, les bureaux centraux du PCC et les comités militaires et politiques concernés des six grandes régions administratives seraient abolis, et les six grandes régions militaires seraient divisées en onze grandes régions militaires, pour mettre en oeuvre le système de centralisation démocratique, et le gouvernement central centraliserait la direction."
 PRC_50s_Rework_event.151.a:0 "Suivant."
 PRC_50s_Rework_event.152.t:0 "Critique féroce de Gao Gang"
 PRC_50s_Rework_event.152.d:0 "Comme prévu, la quatrième séance plénière présidée par Liu Shaoqi est passée d'une réunion visant à « punir les premiers et à punir les seconds, à soigner les malades et à sauver les gens » que Mao Zedong espérait en une réunion de Gao Rao pour critiquer et combattre. Lors de la réunion, Liu Shaoqi a qualifié Gao Gang de porte-parole des impérialistes et des contre-révolutionnaires pour diviser le parti. Zhou Enlai a déclaré que Gao Gang avait fait la sourde oreille aux paroles du président Mao et s'était engagé dans un royaume indépendant, et était un carriériste personnel bourgeois... Presque tous ces discours ont violé les exigences de Mao pour la réunion, et Gao et Rao ont été publiquement expulsés pour forcer Mao Zedong à faire un choix. Bientôt, Liu Shaoqi et Zhou Enlai ont organisé de nombreux colloques sur la question de Gao et Rao......"
 PRC_50s_Rework_event.152.a:0 "Ce qui est fait ne peut être défait"
 PRC_50s_Rework_event.153.t:0 "Le cas de Gao Gang et Rao Shushi"
 PRC_50s_Rework_event.153.d:0 "Gao Gang et Rao Shushi ont été expulsés en public lors de la quatrième session plénière du Comité central, et leurs diverses activités sectaires ont finalement été jugées par Liu Shaoqi comme des activités séparatistes anti-parti, conspirant pour diviser le parti et usurper le pouvoir suprême du parti et de l'État, et leur nature n'était rien de moins que l'incident de Zhang Guotao de cette année-là. Dans de nombreux forums, bien que Gao Gang Rao Shushi se soit défendu : le sectarisme et le libéralisme sont pas intentionnellement subjectivement, et objectivement, cela peut conduire à une scission au sein du parti. Cependant, ils étaient extrêmement isolés lors de la réunion."
 PRC_50s_Rework_event.153.a:0 "Ne sachant pas que de nouvelles forces sont déjà solidement établies"
 PRC_50s_Rework_event.156.t:0 "Tentative de suicide du gang Gao"
 PRC_50s_Rework_event.156.d:0 "Gao Gang se suicide parce qu'il a peur de commettre un crime, mais son suicide échoue parce qu'il est trop faible."
 PRC_50s_Rework_event.156.a:0 "lâche."
 PRC_50s_Rework_event.157.t:0 "Gao Gang s'est suicidé"
 PRC_50s_Rework_event.157.d:0 "Le gros connard, Gao Gang, a choisi de se suicider immédiatement après avoir appris sa possible arrestation imminente et a réussi à le faire."
 PRC_50s_Rework_event.157.a:0 "Bon sang, que devrions-nous faire ?"
 PRC_50s_Rework_event.158.t:0 "Rébellion tibétaine"
 PRC_50s_Rework_event.158.d:0 "Le mouvement de réforme agraire progresse vigoureusement, mais il se heurte à des résistances lorsqu'il est mis en oeuvre dans les zones ethniques minoritaires. Ces politiques entrent en conflit avec les valeurs enracinées dans le bouddhisme tibétain, qui constitue le fondement de la société tibétaine. Les réformes mises en oeuvre dans les régions tibétaines ne relevant pas de la juridiction du Kashag, comme le Sichuan et le Qinghai, ont suscité le mécontentement des minorités ethniques. Par la suite, des conflits armés ont éclaté entre les groupes ethniques tibétains et Yi, ces forces armées ethniques s'engageant dans d'intenses combats avec l'Armée populaire de libération. Les éléments rebelles ont reçu le soutien du Kashag et l'ampleur des troubles s'est progressivement étendue. Nous nous sommes engagés à rechercher une solution pacifique sans aggraver la situation, mais plus nous concédons, plus les éléments rebelles deviennent effrontés."
 PRC_50s_Rework_event.158.a:0 "Vous n'avez pas peur du PLA ? Nous devons réussir la quête !"
 PRC_50s_Rework_event.159.t:0 "Émeute tibétaine de 1959 "
 PRC_50s_Rework_event.159.d:0 "À mesure que l'ampleur de la rébellion dans les régions tibétaines s'est accrue, les troubles se sont étendus à Lhassa. En raison de problèmes de sécurité, lors d'une représentation en présence du Dalaï Lama, un malentendu et un échange de tirs ont eu lieu entre l'armée tibétaine et l'APL. Par la suite, le peuple tibétain s'est soulevé et a pris le contrôle de Lhassa. Avec l'autorisation du gouvernement central, l'APL a lancé la bataille de Lhassa, bombardant plusieurs positions militaires tibétaines avant de capturer Lhassa. Le Kashag a déchiré l'accord de paix précédent et a conduit les lamas et les responsables de haut rang à se retirer de Lhassa, établissant un gouvernement temporaire dans le sud pour poursuivre leur résistance contre l'Armée de libération. Après avoir proclamé l'indépendance du Tibet, l'APL a lancé une attaque courageuse, éliminant l'armée tibétaine et d'autres forces insurgées, dont le Chushi Gangdruk. Le Kashag fut dissous et un plan de réforme démocratique pour le Tibet fut annoncé. Bien que de petits groupes de guérilla erraient encore dans les régions montagneuses, le complot des éléments réactionnaires des échelons supérieurs du Tibet visant à diviser la Chine avait pour l'essentiel échoué."
 PRC_50s_Rework_event.159.a:0 "Envoyez les réactionnaires internes et externes à Dieu !"
 PRC_50s_Rework_event.160.t:0 "Bataille de l'île de Yijangshan"
 PRC_50s_Rework_event.160.d:0 "  À 7 heures le 18 janvier 1951, la 20e Division de l'armée de l'air a mené un assaut aérien sur la zone centrale de l'île de Yijiangshan dans le but de détruire les principales fortifications et positions d'artillerie, les communications et les systèmes de commandement de l'île, et a en même temps supprimé les canons anti-aériens et les positions d'obusiers sur l'île de Dachen. À midi, l'opération conjointe de l'armée, de la mer et de l'air de l'APL a détruit d'un seul coup la plupart des points de tir de l'armée nationale sur l'île de Yijiangshan, créant ainsi des conditions favorables pour les opérations de débarquement ultérieures de l'APL.\n  A 14h20, l'APL a lancé une opération d'atterrissage à trois. À 14h30, l'Armée populaire de libération a débarqué avec succès sur l'île de la montagne Yijiang, a percé les tranchées de l'armée nationale et a tenu bon. Les deux autres troupes sont également arrivées sur le site d'atterrissage prévu et, à 14 h 37, elles ont lancé une attaque générale, annihilant l'armée nationale dans le cratère. À 15 h 02, elles ont capturé le quartier général de l'armée insulaire de Yi Jiangshan. Le commandant de l'armée nationale Wang Shengming a été tué et le commandant adjoint Wang Fubi a été capturé, et notre armée a remporté une victoire d'étape.\n  Le 19 janvier, notre armée avait pris le contrôle total de l'île d'Ikiangsan. Nous avons envoyé trois escadrons de bombardiers pour bombarder l'île en même temps, et le 7 février, les autorités du Kuomintang ont annoncé qu'elles se retireraient de l'île avec l'aide de la septième flotte de la marine américaine. Jusqu'à présent, le gouvernement taïwanais n'a pas réussi à défendre l'île. Le 13 février, l'Armée populaire de libération a pris le contrôle de l'ensemble des îles Dachen et a remporté la bataille."
 PRC_50s_Rework_event.160.a:0 "Tous les réactionnaires sont des tigres de papier."
 PRC_50s_Rework_event.161.t:0 "Transition vers une économie planifiée"
 PRC_50s_Rework_event.161.d:0 "Notre situation économique désastreuse s'est maintenant provisoirement améliorée et nous pouvons préparer la transition vers une économie planifiée sur le modèle socialiste. Certains diront peut-être que notre économie actuelle est si arriérée qu'elle ne dispose pas d'une économie industrielle socialiste et ne peut pas être construite comme une économie planifiée. À cet égard, nous pensons qu'il y a plus de 20 ans, l'Union soviétique, également arriérée, n'a-t-elle pas construit une économie planifiée socialiste ?"
 PRC_50s_Rework_event.161.a:0 "Courir vers le communisme !"
 PRC_50s_Rework_event.162.t:0 "Création de la Commission nationale de planification"
 PRC_50s_Rework_event.162.d:0 "Lors de la 19e réunion du Comité du gouvernement populaire central, une résolution a été adoptée pour créer le Comité de planification d'État du gouvernement populaire central, qui était indépendant du Conseil d'État du gouvernement populaire central et était appelé Comité de planification d'État. Gao Gang, vice-président du gouvernement populaire central, était simultanément président de la Commission nationale de planification, avec Deng Zichu comme vice-président et Chen Yun, Peng Dehuai, Lin Biao, Deng Xiaoping, Rao Shushi, Bo Yibo, Peng Zhen, Li Fuchun, Xi Zhongxun, Huang Kecheng, Liu Lantao, Zhang Xi, An Ziwen, Ma Hong et Xue Mukiao comme membres. Ma Hong était également secrétaire général de la Commission nationale de planification et Wang Guangwei, ancien secrétaire général du gouvernement populaire du Nord-Est, était secrétaire général adjoint. Ceux qui présidaient au travail quotidien étaient Zhang Xi, An Ziwen, Mahong et Wang Guangwei. La Commission de planification comptait 17 bureaux : le Bureau général, le Bureau général de planification, le Bureau de planification de l'industrie lourde, le Bureau de planification de l'industrie des carburants, le Premier Bureau de planification des machines, le Deuxième Bureau de planification des machines, le Bureau de planification du travail et des salaires, le Bureau de planification de la construction urbaine, le Bureau de planification des coûts et des prix, le Bureau de planification des finances et de l'économie, le Bureau de planification du commerce et de la coopération, le Bureau de planification littéraire, éducative et sanitaire et la Division des entreprises privées. Les cadres provenaient de la Commission financière et économique du Conseil d'État du gouvernement populaire central récemment supprimée et des départements concernés des six régions, tels que la Commission de planification du Nord-Est, le ministère de l'Industrie du Nord-Est et le ministère des Finances du Nord-Est. La Commission nationale de planification comptait 1 225 personnes et un effectif total de 1 538 personnes. Après la création de la Commission nationale de planification, 13 ministères, dont le Ministère de l'industrie lourde du Gouvernement populaire central et le Ministère de la première industrie mécanique du Gouvernement populaire central, qui étaient sous la direction de la Commission financière et économique du Conseil des Affaires d'État, ont été transférés sous sa direction."
 PRC_50s_Rework_event.162.a:0 "Courir vers le communisme !"
 PRC_50s_Rework_event.163.t:0 "Le problème de l'analphabétisme"
 PRC_50s_Rework_event.163.d:0 "En 1949, le taux d'analphabétisme dans le pays dépassait les 80 pour cent et, dans les zones rurales, il dépassait les 95 pour cent, l'un des plus élevés au monde. Et les habitants d'un pays socialiste sont censés être alphabétisés. La pratique de l'éducation universelle de notre ancien régime en Chine a été un échec ; la République de Chine n'a pas réussi à éradiquer l'analphabétisme et la République populaire doit accomplir cette tâche historique."
 PRC_50s_Rework_event.163.a:0 "Nous allons bientôt éradiquer l'analphabétisme."
 PRC_50s_Rework_event.163.b:0 "Il faudra au moins quelques décennies pour éradiquer l'analphabétisme."
 PRC_50s_Rework_event.164.t:0 "扫盲计划"
 PRC_50s_Rework_event.164.d:0 "À la suite de l'expérience de l'Union soviétique, nous devrions mobiliser les masses de soldats, de cadres, de paysans et d'ouvriers pour qu'elles s'alphabètent activement ; nous avons une forte capacité de mobilisation et nous obtiendrons le même succès que la Russie soviétique. Nous avons déjà commencé à travailler à l'introduction de l'alphabétisation dans tout le pays et nous sommes convaincus que nous pourrons bientôt réussir."
 PRC_50s_Rework_event.164.a:0 "Nous allons bientôt éradiquer l'analphabétisme."
 PRC_50s_Rework_event.165.t:0 "Premiers signes de réussite"
 PRC_50s_Rework_event.165.d:0 "Notre taux d'analphabétisme est effectivement réduit grâce aux efforts de divers secteurs du Parti et du gouvernement. Grâce au déploiement de cadres et d'intellectuels dans les campagnes, de nombreux paysans analphabètes ont pu lire des milliers de mots, et les classes d'alphabétisation que nous avons créées dans différents districts ont joué un rôle majeur. Les personnes analphabètes apprennent de plus en plus les caractères chinois et nous pourrons bientôt éradiquer l'analphabétisme."
 PRC_50s_Rework_event.165.a:0 "Vraiment? Je veux que des personnes qui reconnaissent activement les mots se rencontrent."
 PRC_50s_Rework_event.166.t:0 "Campagnes d'alphabétisation"
 PRC_50s_Rework_event.166.d:0 "Récemment, les dirigeants de la Chine communiste ont rencontré un certain nombre d'ouvriers, de paysans et de cadres, représentants de ceux qui ont été activement alphabétisés dans le cadre de la campagne d'alphabétisation organisée par le Parti communiste chinois pendant un certain temps. Historiquement, la Chine a connu un taux d'analphabétisme élevé, ce qui a grandement troublé le PCC dans ses efforts pour mettre en oeuvre une agriculture coopérative et une industrialisation socialiste, mais le PCC essaie de trouver des moyens de diffuser l'alphabétisation et l'éducation en Chine. Il s'agit d'une tâche extrêmement difficile, car la République de Chine n'a pas réussi à réduire de manière significative le taux d'analphabétisme depuis plus de 30 ans, et avec plus de 400 millions de personnes analphabètes, il reste à voir si le PCC, qui vient tout juste de devenir le seul dirigeant du continent, sera capable d'atteindre son objectif d'éradication de l'analphabétisme."
 PRC_50s_Rework_event.166.a:0 "premier pas vers la modernisation."
 PRC_50s_Rework_event.167.t:0 "Nouveaux dilemmes"
 PRC_50s_Rework_event.167.d:0 "Nous avons un sérieux problème avec notre taux d'alphabétisation, car de nombreux agriculteurs deviennent alphabétisés puis oublient rapidement la plupart des mots qu'ils ont appris, revenant à l'analphabétisme, et nous devons faire face à ce nouveau problème grave."
 PRC_50s_Rework_event.167.a:0 "Peut-être devrions-nous ralentir un peu."
 PRC_50s_Rework_event.167.b:0 "Ignorons cela."
 PRC_GLF_event.1.t:0 "Objectifs de planification excessivement élevés"
 PRC_GLF_event.1.d:0 "Liu Shaoqi, s'adressant aux travailleurs de certaines zones de la centrale électrique, a déclaré : « Maintenant, rattraper le Royaume-Uni n'est pas plus de dix ans, deux ou trois ans. L'année prochaine et l'année suivante, dépasser le Royaume-Uni, ce n'est pas faux. Le compte, il y a tellement d'énergie, je pense que sept, huit ans suffiront. » L'objectif fixé par Liu Shaoqi est évidemment un peu élevé, et il y a un grand écart avec l'objectif du président Mao de « dépasser le Royaume-Uni et rattraper les États-Unis ». Nous nous efforçons donc de rattraper ou de dépasser le Royaume-Uni dans le domaine de l'acier et d'autres produits industriels lourds dans 15 ans ou un peu plus, et de rattraper ou dépasser les États-Unis dans 50 ans. En tant que leader de première ligne, Liu a avancé imprudemment des objectifs excessifs et des slogans radicaux, ce qui apporterait probablement des problèmes inattendus au Mouvement du Grand Bond en Avant......."
 PRC_GLF_event.1.a:0 "Mieux vaut être réaliste."
 PRC_GLF_event.2.t:0 "S'opposer à l'avance téméraire"
 PRC_GLF_event.2.d:0 "Mao Zedong a avancé le slogan du « Grand Bond en avant » et a exigé qu'il s'efforce de rattraper et de dépasser le Royaume-Uni d'ici 15 ans et de construire un pays socialiste fort. Afin d'atteindre cet objectif, il a lancé un mouvement de masse à l'échelle nationale pour encourager toutes les localités à travailler dur et rapidement et à s'engager vigoureusement dans la production et la construction de fer et d'acier, la conservation de l'eau, l'agriculture, etc. Cependant, certains dirigeants de partis s'y sont opposés. Ils pensent que cela entraînerait des difficultés économiques, entraînant des problèmes tels que des pénuries de matériaux, une détérioration de la qualité et une augmentation des déchets. Zhou Enlai a également souligné à plusieurs reprises lors de la réunion que la construction devait être réalisée de manière constante et régulière, en recherchant la vérité à partir des faits. La proposition de Mao concernant des investissements supplémentaires en capital s'est également heurtée à l'opposition de la majorité du Politburo, ce qui a permis à l'opposition de poursuivre sa progression téméraire."
 PRC_GLF_event.2.a:0 "L'ambiance Oppose Rash Advance se répand dans le Parti"
 PRC_GLF_event.3.t:0 "La critique de l'opposition à Rash Advance"
 PRC_GLF_event.3.d:0 "Mao Zedong ne se souciait pas de l'avancée téméraire de l'opposition, qu'il considérait comme un point de vue de droite et conservateur qui ne répondait pas aux exigences de la construction socialiste. Afin de lutter davantage contre l'idéologie de droite au sein du parti et de poursuivre sans heurts le Grand Bond en avant, il a présidé de nombreuses réunions sur le thème de la critique de l'avancée téméraire de l'opposition. Lors de la Conférence de Nanning, il a sévèrement critiqué l'avancée téméraire de l'opposition depuis 1956, estimant que la construction socialiste ne devait pas se faire lentement, mais qu'elle devait être progressive. Cette réunion a unifié la pensée au sein du parti et a créé les conditions pour le développement global du mouvement du Grand Bond en avant."
 PRC_GLF_event.3.a:0 "Allez-y à fond et visez haut !"
 PRC_GLF_event.4.t:0 "Aperçu du développement agricole sur douze ans"
 PRC_GLF_event.4.d:0 "S'appuyant sur la consolidation de la collectivisation rurale, le plan de développement a formulé des indicateurs cibles pour augmenter la production céréalière en fonction des différentes conditions naturelles et situations économiques dans diverses régions. Il a également confié des tâches complémentaires telles que le boisement, la lutte antiparasitaire, la promotion de la planification familiale et le renforcement des efforts éducatifs. Concernant l'amélioration de la production céréalière, un plan global de diverses mesures de développement agricole a été systématiquement élaboré. Cela comprend la promotion de semences de haute qualité, l'expansion des superficies ensemencées, l'amélioration des outils agricoles et le renforcement des installations de conservation de l'eau. Simultanément, l'accent a été mis sur la nécessité de contrer les sentiments conservateurs et de renforcer l'attitude proactive des agriculteurs. Le schéma de développement met l'accent sur la nécessité d'exploiter le potentiel de production des zones rurales pour atteindre les objectifs fixés."
 PRC_GLF_event.4.a:0 "L'objectif est de doubler la production agricole d'ici douze ans !"
 PRC_GLF_event.5.t:0 "Enquête à la Conférence de Beidaihe"
 PRC_GLF_event.5.d:0 "Le Bureau politique central du PCC a tenu une réunion élargie à Beidaihe, où les principaux sujets de discussion comprenaient, entre autres, la création de communes populaires rurales, les réformes éducatives et la mise en oeuvre de l'objectif de production d'acier fixé en juin. L'objectif de production d'acier a été fixé à 10,7 millions de tonnes, soit le double de la production de l'année précédente. Face aux soupçons de [SOV.GetLeader] et d'autres hauts dirigeants soviétiques, Mao Zedong a demandé aux différents ministères et dirigeants d'entreprises l'assurance que l'objectif de 10,7 millions de tonnes serait atteint cette année. Après les assurances des secrétaires du parti et des dirigeants industriels, le Quotidien du Peuple a publié un communiqué de conférence à l'échelle nationale, appelant l'ensemble de la population à lutter pour atteindre l'objectif de production de 10,7 millions de tonnes d'acier."
 PRC_GLF_event.5.a:0 "\"Camarade Président, doubler la production n'est pas un problème.\""
 PRC_GLF_event.6.t:0 "En avant avec le vent d'est écrasant"
 PRC_GLF_event.6.d:0 "Le jour du Nouvel An 1958, le Quotidien du Peuple a publié un éditorial résumant les réalisations du mouvement socialiste en 1957 et des mouvements démocratiques nationaux mondiaux. Il a également souligné la nécessité de poursuivre le mouvement de rectification et de construction socialiste pour atteindre les objectifs du plan de développement rural sur douze ans. L'éditorial déclarait : « Avec l'achèvement réussi du premier plan quinquennal et le soutien d'autres conditions favorables, nous devons être pleins d'enthousiasme, nous efforcer d'aller de l'avant, de libérer l'enthousiasme et l'optimisme révolutionnaires, et de lutter pour un grand bond en avant et une récolte abondante dans la production agricole en 1958, dans le but d'atteindre le magnifique objectif de construire le socialisme et le communisme, de construire une industrie moderne puissante, une agriculture moderne et une science et une culture avancées ! Avancer avec l'esprit communiste pour submerger les droitiers, la bureaucratie et la pensée conservatrice. »"
 PRC_GLF_event.6.a:0 "Un jour comme vingt ans !"
 PRC_GLF_event.7.t:0 "Éliminez les quatre parasites"
 PRC_GLF_event.7.d:0 "Éradiquer les quatre parasites est une campagne lancée par le grand leader Mao, qui appelait à l'éradication fondamentale des rats, des moineaux, des mouches et des moustiques en cinq, sept ou douze ans, à partir de 1956. Il s'agissait de créer une Chine hygiénique et d'éliminer toutes les maladies infectieuses possibles."
 PRC_GLF_event.7.a:0 "Continuez."
 PRC_GLF_event.8.t:0 "Justification pour le moineau"
 PRC_GLF_event.8.d:0 "Récemment, M. Zhang Jinfu de l'Académie chinoise des sciences, après avoir synthétisé les points de vue de la communauté biologique, a écrit un « Rapport au Président sur le problème des moineaux ». Le rapport souligne que les moineaux ne sont pas une espèce nuisible aux cultures ; au contraire, ils protègent les terres agricoles. Nous soumettrons ce rapport au plus haut niveau de leadership pour étude."
 PRC_GLF_event.8.a:0 "Peut-être devrions-nous changer notre politique."
 PRC_GLF_event.9.t:0 "Économiser les fonds nationaux"
 PRC_GLF_event.9.d:0 "Étant donné que le pays connaît récemment une grande pénurie de fonds, nous avons décidé de retirer une partie des fonds des envois de fonds à l'étranger pour reconstituer le Trésor national, ce qui est un choix que nous devons faire en ces temps difficiles"
 PRC_GLF_event.9.a:0 "Merde !"
 PRC_GLF_event.10.t:0 "Grève de sécheresse et d'inondations"
 PRC_GLF_event.10.d:0 "Notre pays a été confronté ces derniers temps à d'énormes catastrophes naturelles.\nDans le nord-est, la sécheresse réduit les rendements des premières récoltes et affecte les récoltes tardives. Et dans le sud, notamment dans le Guangdong, les inondations les plus puissantes depuis un siècle déferlent sur la province, et notre récolte de céréales cette année pourrait être très mauvaise, voire catastrophique."
 PRC_GLF_event.10.a:0 "Bon sang !"
 PRC_GLF_event.11.t:0 "Réunion de Chengdu"
 PRC_GLF_event.11.d:0 "Les dirigeants du Parti et de l'État ont récemment tenu une réunion à Chengdu, au cours de laquelle ils ont présenté « l'Instruction pour le lancement de la campagne anti-gaspillage et anti-conservatrice », qui appelle les comités du Parti à tous les niveaux à mener la campagne « anti-droite », et estime que si cette campagne réussit, alors nous gagnerons avec la moitié de l'effort et avec la moitié de l'effort."
 PRC_GLF_event.11.a:0 "Super."
 PRC_GLF_event.12.t:0 "Le problème de la production marchande socialiste"
 PRC_GLF_event.12.d:0 "Beaucoup de gens évitent de parler de matières premières et de commerce, comme si ce n'était pas du communisme. Les communes populaires doivent produire des marchandises socialistes susceptibles d'être échangées afin d'élever progressivement les salaires de chacun. En ce qui concerne les moyens de subsistance, il faut développer le commerce socialiste ; Et utiliser la forme de la loi de la valeur comme instrument de comptabilité économique pendant la période de transition pour faciliter la transition progressive vers le communisme. Aujourd'hui, nos économistes n'aiment pas l'économie, tout comme l'Union soviétique, qui considère que quiconque parle de la loi de la valeur est discrédité, comme le reflète une lettre écrite par Yaroshenko. Ces gens n'approuvent pas la production marchande et pensent que l'Union soviétique est déjà communiste, mais c'est loin d'être le cas. Nous construisons le socialisme depuis seulement quelques années, mais nous en sommes loin. (Mao, 9 novembre 1958)"
 PRC_GLF_event.12.a:0 "Suivez le grand leader!"
 PRC_GLF_event.13.t:0 "Réunion de Wuchang"
 PRC_GLF_event.13.d:0 "Du 21 au 27 novembre 1958, le Comité central du Parti a tenu une réunion élargie du Politburo à Wuchang, et dans son discours du premier jour, Mao Zedong a abordé huit questions :\n (1) la transition vers le communisme ;\n (2) le plan quinquennal ; \n(3) les tâches de cette réunion; \n(4) le problème de tracer la ligne ; \n(5) l'élimination des classes; \n(6) l'économie marchande ; \n(7) la réduction des tâches; et \n(8) l'ajustement de la commune populaire.\nEn plus de cela, Mao a mené une réflexion sur l'idée d'une transition accélérée vers le communisme, que de nombreux camarades avaient eue, et a proposé une réduction de la production pour le Grand Bond en avant."
 PRC_GLF_event.13.a:0 "Je vois."
 PRC_GLF_event.14.t:0 "Échec de la diffusion des vues"
 PRC_GLF_event.14.d:0 "\"Pour ouvrir la discussion, l'orateur n'est pas coupable, klaxonne grandement, et dispose de quelques jours pour unir les esprits. Faire se rencontrer trois opposés lors de la réunion...\"\n\"... Production occupée pendant un mois, organisez de petites réunions pour résoudre des problèmes spécifiques, demandez à chaque équipe de production de tenir une réunion du parti pendant son temps libre pour le travail, puis organisez une réunion de masse pour former une discussion nationale.\""
 PRC_GLF_event.14.a:0 "Le parti ouvre la voie."
 PRC_GLF_event.15.t:0 "Objectifs excessifs du programme"
 PRC_GLF_event.15.d:0 "\"En septembre 1958, Liu Shaoqi a inspecté le Jiangsu. Dans la commune populaire de Heping du comté de Changshu, le camarade Shaoqi a visité les quatre acres de champs expérimentaux à Fengyuanxu, il s'est personnellement penché pour compter les riziers et a demandé au secrétaire du parti du canton : « Combien peut-on jouer ? » La réponse : « peut atteindre 10 000 livres.\nLe camarade Shaoqi a souri et a dit : « Combien peuvent représenter 10 000 chats de plus ? Vous avez de bonnes conditions ici, donc si vous faites des virages profonds, vous en aurez plus.\"\n-Quotidien du Peuple, 30 septembre 1958"
 PRC_GLF_event.15.a:0 "C'est ridicule."
 PRC_GLF_event.16.t:0 "Avancez sous la bannière de la Commune populaire"
 PRC_GLF_event.16.d:0 "Depuis la deuxième session du huitième Congrès national du Parti communiste chinois, nous avons établi la prochaine direction de développement : organiser le « Grand Bond en avant » dans la production et adopter l'approche des « communes populaires » dans l'organisation.\nNous transformerons la coopérative originale en un nouveau type de « Commune populaire ». Dans la « Commune populaire », tous sont égaux. Il n'y aura pas d'inégalité du type « faire plus, obtenir plus ». Les gens unifient la production, l'organisation et la gestion"
 PRC_GLF_event.16.a:0 "Que se passe-t-il ici ?"
 PRC_GLF_event.17.t:0 "Les journalistes doivent garder la tête froide"
 PRC_GLF_event.17.d:0 "\"Les journalistes doivent avoir la tête froide et penser de manière indépendante, pas comme les gens. Cette méthode de pensée doit être accessible avant tout aux journalistes de l'agence de presse Xinhua et du Quotidien du Peuple, ainsi qu'au comité de rédaction de Pékin. Ne publiez pas ce que disent les gens, mais réfléchissez-y.\nLes journalistes, en particulier les reporters en chef, doivent être lucides et calmes. \""
 PRC_GLF_event.17.a:0 "C'est parfaitement logique."
 PRC_GLF_event.18.t:0 "La première réunion de Zhengzhou "
 PRC_GLF_event.18.d:0 "Du 2 au 10 novembre 1958, le camarade Mao Zedong a convoqué la Conférence centrale de travail à Zhengzhou, écoutant les rapports, Mao Zedong a estimé que certaines questions liées à la compréhension du socialisme et du communisme, la relation est très importante, de sorte que la portée de la réunion a été élargie trois fois. Mao Zedong était profondément préoccupé par les problèmes qui surgissaient au sein du mouvement populaire de communautarisation et il a eu de nombreux entretiens avec les cadres dirigeants au niveau provincial qui ont participé aux réunions et ont écouté attentivement leurs rapports."
 PRC_GLF_event.18.a:0 "Continue."
 PRC_GLF_event.19.t:0 "Politique « à l'échelle nationale »"
 PRC_GLF_event.19.d:0 "Maintenant que le Grand Bond en avant de 1959 a progressivement commencé, la tâche du Parti tout entier et de la nation tout entière est la suivante : continuer à rassembler les énergies et lutter vers l'excellence, continuer à s'opposer au conservatisme et à briser les superstitions, redoubler d'efforts pour mettre en oeuvre la ligne générale de construction socialiste du Parti et l'ensemble des approches à deux volets qui y sont associées, adhérer à la politique de « l'ensemble du pays », combiner pleinement la direction centralisée avec la gestion hiérarchique, combiner pleinement la force du gouvernement central avec celle des localités, et le pouvoir de l'État avec celui des masses, et à déployer des efforts concertés de la part de l'ensemble du Parti et de la nation tout entière pour garantir que le plan de Bond en avant plus grand, meilleur et plus global de cette année soit réalisé en triomphe et s'efforce d'être dépassé."
 PRC_GLF_event.19.a:0 "Vers une nouvelle victoire."
 PRC_GLF_event.20.t:0 "S'opposer à l'individualisme"
 PRC_GLF_event.20.d:0 "L'individualisme est une manière de penser uniquement à soi et non aux autres. Parfois, cela renvoie aussi à une sorte de cliquisme élargi. Le grand leader, le président Mao, disait de l'individualisme que tout était destiné uniquement à la Quatrième Armée, sans se rendre compte que l'armement des masses locales était l'une des tâches importantes de l'Armée rouge. C'est une sorte de cliché amplifié."
 PRC_GLF_event.20.a:0 "Nous devons lutter contre l'individualisme."
 PRC_GLF_event.21.t:0 "Soutenir l'individualisme"
 PRC_GLF_event.21.d:0 "L'individualisme est une manière de penser uniquement à soi et non aux autres. Parfois, cela fait également référence à une forme amplifiée de clichés. Mais les choses ont changé et nous avons désormais besoin d'un certain soutien pour ces ismes afin de protéger la liberté individuelle."
 PRC_GLF_event.21.a:0 "c'est ça."
 PRC_GLF_event.22.t:0 "La deuxième réunion de Zhengzhou"
 PRC_GLF_event.22.d:0 "En réponse aux problèmes du système des communes populaires, Mao Zedong a proposé lors de la deuxième conférence de Zhengzhou de corriger d'abord les deux tendances à l'égalitarisme et à la centralisation excessive. Il a souligné que la tendance à l'égalitarisme niait l'existence de différences dans les revenus des équipes de production et des individus, c'est-à-dire qu'elle niait le principe socialiste de répartition selon le travail et de salaire plus élevé pour plus de travail ; et la tendance à une centralisation excessive a nié le système de propriété des équipes de production, nié les droits qui leur sont dus et a arbitrairement ajusté à la hausse la propriété des équipes de production au profit de la commune. Les deux tendances incluent le déni de la loi de la valeur et l'idée d'un échange égal, ce qui est évidemment erroné."
 PRC_GLF_event.22.a:0 "Super"
 PRC_GLF_event.23.t:0 "Opposons-nous au vent communiste"
 PRC_GLF_event.23.d:0 "\"Premièrement, le \"vent communiste\" doit être combattu, il ne faut pas piller les paysans, ce que le marxisme-léninisme ne permet pas. Deuxièmement, quelques grands bureaux et le \"vent communiste\", disent que le vieux vent représente plus, dit que le nouveau vent représente plus, peu importe lequel est le plus, de toute façon, c'est une grosse égratignure, il semble que cela ne peut être que dans le bureau du bureau du bureau du bureau des petits. Troisièmement, un grand nombre de main-d'oeuvre, le comté au-dessus du transfert industriel de dizaines de millions de personnes. Ces trois leçons sont les principales. Il est nécessaire de reconnaître ces leçons, sinon elles ne peuvent pas être modifiées. Si les 26 millions de personnes nouvellement ajoutées ne reviennent pas, comment peut-on le faire ?"
 PRC_GLF_event.23.a:0 "Vive le leader."
 PRC_GLF_event.24.t:0 "Numéro « Communications internes au parti »"
 PRC_GLF_event.24.d:0 ""
 PRC_GLF_event.24.a:0 ""
 PRC_GLF_event.25.t:0 "Réunion de Lushan"
 PRC_GLF_event.25.d:0 "Le 2 juillet 1959, le Bureau politique du Comité central du Parti communiste chinois a tenu une réunion à Lushan, province du Jiangxi, qui a exploré des questions telles que la situation, les tâches, les institutions, la propagande, l'équilibre global, la ligne de masse, la relation entre les zones de collaboration, les cantines publiques, le marché primaire à la campagne, le bit et d'autres questions, et pour résumer l'expérience et rectifier les erreurs du sujet principal, lors de cette réunion, Mao Zedong a également demandé à l'ensemble du parti d'achever le Grand Avancez les tâches de production dès que possible."
 PRC_GLF_event.25.a:0 "Intéressant"
 PRC_GLF_event.26.t:0 "Soumission de Peng Dehuai"
 PRC_GLF_event.26.d:0 "\"La contradiction majeure à laquelle nous sommes confrontés actuellement dans notre travail de construction est la tension dans divers domaines provoquée par la disproportion. De par sa nature même, l'évolution de cette situation a affecté les relations entre ouvriers et paysans, entre les différentes classes dans les villes et entre les différentes classes de paysans, et est donc aussi de nature politique. ...... Corriger ces phénomènes de « gauche » est généralement plus difficile que de contrecarrer la pensée conservatrice de droite, comme l'a prouvé l'expérience historique de notre Parti."
 PRC_GLF_event.26.a:0 "Faites votre rapport à Mao."
 PRC_GLF_event.27.t:0 "L'autocritique de Mao Zedong"
 PRC_GLF_event.27.d:0 "Lors de la réunion de Lushan, Mao Zedong a décidé de faire son autocritique et a reconnu qu'il avait commis certaines erreurs lors du Grand Bond en avant. Il a parlé de l'unité du parti et de la situation internationale et nationale actuelle sur la voie de la critique et a souligné que la ligne du parti était fondamentalement correcte, mais que les gens avaient commis des erreurs."
 PRC_GLF_event.27.a:0 "Bien."
 PRC_GLF_event.28.t:0 "Lettre de Li Rui au président Mao"
 PRC_GLF_event.28.d:0 "Après que la proposition de Peng Dehuai ait été rendue publique, l'atmosphère lors de la réunion de Lushan est devenue de plus en plus tendue. Alors que les nouvelles de sécheresses et d'inondations arrivaient fréquemment, même le président Mao a fait des autocritiques lors de la réunion, mais cela n'a toujours pas pu compenser le mécontentement de certaines personnes. À ce moment critique, Li Rui, le rapporteur de la réunion, a envoyé une lettre à Mao, dans laquelle il a rendu compte des griefs privés et du mécontentement de Peng Dehuai et de ses partisans au cours des derniers jours. À un moment aussi critique, cette lettre a joué un rôle crucial et pourrait nous guider dans l'ordre du jour de la réunion qui a suivi."
 PRC_GLF_event.28.a:0 "C'est reparti..."
 PRC_GLF_event.29.t:0 "Le siège de la huitième session plénière du huitième Comité central"
 PRC_GLF_event.29.d:0 "Avec la convocation officielle de la huitième session plénière du huitième Comité central au mont Lushan, dans la province du Jiangxi, le moment de l'épreuve de force était arrivé. Mao Zedong a pris la parole le premier pour donner le ton de la réunion, changeant la ligne anti-gauchiste du passé et qualifiant le ton de la réunion d'anti-droite. Puis, sous la présidence de Liu Shaoqi, Lin Biao et d'autres membres du Comité permanent du Politburo se sont succédé, accusant Peng de s'opposer à Mao Zedong et affirmant que Peng avait usurpé l'idéologie du Parti. Sous la direction du Comité permanent, de nombreux membres du Comité central et membres suppléants du Comité central se sont également manifestés pour critiquer Peng Dehuai, l'accusant ainsi que ses partisans d'être des « opportunistes » et de « collaborer avec des étrangers » et de « forcer le président Mao à démissionner ». Le président Mao s'est ensuite exprimé en séance plénière, accusant Peng d'« idéologie bourgeoise », portant ainsi la « critique de Peng » à son paroxysme. La huitième session plénière du huitième Comité central est désormais devenue une assemblée pour critiquer Peng Dehuai et ses partisans."
 PRC_GLF_event.29.a:0 "A bas « l'élément bourgeois » Peng Dehuai !"
 PRC_GLF_event.30.t:0 "Li Rui a fait un reportage sur le club militaire"
 PRC_GLF_event.30.d:0 "À ce moment critique, l'enregistreur Li Rui a une fois de plus montré son pouvoir miraculeux. Li Rui a enregistré les remarques qu'il a entendues lorsqu'il était avec Peng Dehuai et d'autres pendant son séjour à Lushan, ainsi qu'avec Huang Kecheng, Zhou Xiaozhou, Zhou Hui et Zhang Wentian qui ont toujours soutenu Peng Dehuai. Les paroles et les actes spécifiques des autres ont été annoncés un par un, et ils ont publiquement accusé ces personnes de « comploter pour usurper le parti » et de « comploter pour renverser le président Mao ». En particulier, ils ont comparé le chef d'état-major Huang Kecheng et Peng Dehuai à un « club militaire » et plusieurs autres en tant que membres du « club militaire », ont une fois de plus suscité la colère lors de la réunion. Les membres présents à la réunion ont accusé le Club militaire de Peng Dehuai d'être un « groupe anti-parti »."
 PRC_GLF_event.30.a:0 "L'armée prépare-t-elle un coup d'État ?"
 PRC_GLF_event.31.t:0 "La clique anti-parti de Peng, Huang, Zhang, Zhou"
 PRC_GLF_event.31.d:0 "La huitième session plénière du huitième Comité central s'est officiellement conclue et, à la fin de celle-ci, la réunion a nommé et critiqué la clique de droite anti-Parti dirigée par Peng Dehuai, Huang Kecheng, Zhang Wentian et Zhou Xiaozhou, et a décidé de transférer quelques-uns d'entre eux à des postes de première ligne, de révoquer leurs postes de direction et de conserver simplement le poste de membre pour la postérité. Après la séance plénière, la Commission militaire centrale et le ministère des Affaires étrangères ont tenu des réunions pour critiquer la clique anti-Parti et ses acolytes et pour clarifier la ligne contre la droite. Dans ses discours ultérieurs, Mao a élevé la lutte contre la « clique anti-Parti » au rang d'affrontement entre le prolétariat et la bourgeoisie."
 PRC_GLF_event.31.a:0 "Je suis Mao Zedong, pas Staline l'Ancien !"
 PRC_GLF_event.32.t:0 "Lancez la lutte contre la déviation à droite"
 PRC_GLF_event.32.d:0 "Après la victoire de la huitième session plénière du huitième Comité central du huitième Comité central, la ligne de l'opportunisme anti-droite a été formellement établie et la lutte contre l'opportunisme de droite s'est déroulée dans tout le pays. Même Peng Dehuai, le ministre de la Défense nationale, s'est opposé au Parti, et il semble que l'opposition aux trois signaux d'alarme soit encore répétée, et qu'un opportunisme de droite flotte dans l'air au sein du Parti. Nous devons freiner cette tendance néfaste, et il est nécessaire de mener immédiatement la lutte « anti-droite », de détecter les droitiers dans tout le pays et de leur faire comprendre que le Grand Bond en avant et la ligne générale de construction socialiste sont corrects et indiscutables."
 PRC_GLF_event.32.a:0 "Une nouvelle lutte commence."
 PRC_GLF_event.33.t:0 "Laissons Peng préserver sa dignité"
 PRC_GLF_event.33.d:0 "Ce que Peng Dehuai a dit était tout simplement choquant. Non seulement il n'était pas satisfait de la ligne générale de construction socialiste, mais il accusait également en privé le président Mao d'être un « vieux Stalinien », ce qui suffisait à l'exclure du Parti. Mais d'un autre côté, il a également mis le doigt sur nos problèmes actuels, ce qui reste encore une grande valeur de référence. Il ne faut pas pousser cette question à l'extrême, car nous sommes actuellement en conflit interne avec Peng Dehuai, il n'y a pas de conflit d'intérêt fondamental, alors peut-être devrions-nous lui donner un coup de pouce."
 PRC_GLF_event.33.a:0 "L'harmonie d'abord."
 PRC_GLF_event.34.t:0 "Réconcilier les conflits entre factions"
 PRC_GLF_event.34.d:0 "La huitième session plénière du huitième Comité central a été officiellement convoquée. Notre politique passée du Grand Bond en avant avait suscité de vives divergences d'opinions au sein du Parti, et ceux qui s'opposaient à la tendance à gauche, menés par Peng Dehuai, avaient même commencé à nous attaquer, de sorte que si cela continuait, il existait un risque de division de notre Parti. La tâche principale consiste désormais à réconcilier les contradictions entre les différentes factions du Parti, afin que nous puissions tous nous unir et travailler ensemble pour la construction du pays, et en même temps, nous devons écouter pleinement les points de vue de toutes les parties présentes à la conférence et apporter des améliorations à notre politique."
 PRC_GLF_event.34.a:0 "Vive l'unité !"
 PRC_GLF_event.35.t:0 "S'opposer à l'avancée gauchiste"
 PRC_GLF_event.35.d:0 "La huitième session plénière du huitième Comité central du Parti communiste chinois (PCC) a pris fin, et nous avons clarifié davantage notre politique d'opposition à « l'aventurisme de gauche » et avons commencé à rectifier notre politique passée ; le vent de gauche au cours du Grand Bond en avant doit être freiné, et la « tendance de gauche » qui s'est révélée erronée ne nous apportera pas la victoire, mais nous apportera le désastre. Il a été prouvé par la pratique qu'une mauvaise « tendance de gauche » ne nous apporte pas la victoire, mais au contraire nous apporte le désastre. Une lutte à l'échelle nationale doit être menée contre « l'aventurisme de gauche » pour stopper immédiatement la tendance de gauche partout et pour refroidir le Grand Bond en avant."
 PRC_GLF_event.35.a:0 "A construire sur le terrain."
