 SIA_infantry_equipment_0:0 "Fusil Koishikawa Arsenal Siamois Type 66"
 SIA_infantry_equipment_0_short:0 "Fusil Type 66"
 SIA_infantry_equipment_0_desc:0 "Le fusil siamois Type 66 est un fusil basé sur une version experte du fusil japonais Type 38 et du fusil Mauser Gewehr 98, commandé par la Thaïlande en 1923 et fabriqué par l'arsenal de Koishikawa au Japon. L'assemblage fut retardé jusqu'en 1928-1929 en raison des ravages causés par le grand tremblement de terre de Kanto en 1923. Comme il est basé sur la conception du Type 38 Arisaka, la plupart des pièces du Type 66 sont interchangeables avec le fusil japonais, car ses composants ont été fabriqués au Japon puis expédiés à Bangkok pour être assemblés avec une assistance technique locale.\n\nChambré pour la cartouche siamoise 8 × 52 mmR, le Type 66 utilise un récepteur Arisaka modifié, influencé par l'action Mauser Gewehr 98. Le fusil a été largement utilisé au combat pendant la Seconde Guerre mondiale, où il s'est avéré être une arme fiable et durable entre les mains des soldats thaïlandais. À la fin des années 1950, certains fusils de type 66 ont été raccourcis et rechambrés pour la cartouche Springfield.30-06, bien que cette modification ait entraîné un recul excessif. Malgré ces défis, le Type 66 est resté une arme à feu fiable et un symbole des efforts de la Thaïlande pour moderniser ses forces armées au cours d'une période critique de son histoire."
 
 SIA_infantry_equipment_1:0 "Carabine siamoise de type 91"
 SIA_infantry_equipment_1_short:0 "Carabine Type 91"
 SIA_infantry_equipment_1_desc:0 "Le Thai Type 91 est une version modifiée du fusil japonais Type 38 Arisaka, retravaillé par la Thaïlande pour être utilisé par les forces militaires ou policières. Chambré en 6,5 × 50 mmSR Arisaka, il comporte un canon raccourci, une hausse tangente d'origine de type 38 et un boulon droit. La crosse a été reconfigurée pour ressembler à la carabine américaine M1, avec un avant arrondi distinctif. Le fusil conserve son cache-poussière et se distingue par sa taille compacte et son mélange unique d'éléments de conception japonais et occidentaux."

 SIA_infantry_equipment_2:0 "Fusil américain, calibre 5,56 mm, M16"
 SIA_infantry_equipment_2_short:0 "M16"
 SIA_infantry_equipment_2_desc:0 "Les responsables militaires américains ont noté que la carabine M2 était largement surclassée par l'AK47 et le StG44 allemand et, en 1956, le développement du M16 a commencé. En 1959, l'arme fut achevée par Eugene Stoner et James Sullivan. Il affichait des capacités exceptionnelles et surclassait l'AK47 et l'AKM. Plus particulièrement, l'arme a beaucoup plus de puissance de feu que la carabine M2 et était plus précise que l'AK47 et transportait des munitions plus légères avec une perte de compétence minimale. Cependant, bien qu'il ait surclassé l'AK47 dans les tests généraux, il présentait une faible fiabilité qui pouvait l'empêcher d'être considéré comme son égal. Surtout au Vietnam, où les échecs étaient très fréquents."

 SIA_infantry_equipment_3:0 "Fusil américain, 5,56 mm, M16A1"
 SIA_infantry_equipment_3_short:0 "M16A1"
 SIA_infantry_equipment_3_desc:0 "Après le manque de fiabilité fréquent de l'arme dans les jungles du Vietnam, le corps des marines américains a demandé une refonte de l'arme. En 1982, la refonte et les améliorations ont été apportées. L'arme comportait un récepteur renforcé, de nouvelles rayures, un boîtier renforcé, un meilleur refroidissement grâce à différents matériaux, un support amélioré pour les éléments attachables et un mécanisme interne repensé qui lui conférait un haut niveau de fiabilité. Il a été témoin de combats au Liban, en Libye, en Égypte et dans tous les autres conflits dans lesquels les États-Unis ont participé depuis leur création."

 SIA_infantry_equipment_4:0 "Carabine, calibre 5,56 mm, M4"
 SIA_infantry_equipment_4_short:0 "Carabine M4"
 SIA_infantry_equipment_4_desc:0 "La carabine M4 est une nouvelle amélioration par rapport au M16A2. Il a été initialement commandé pour être conçu par une grande équipe ad hoc de concepteurs en 1984 et le développement s'est terminé en 1993. Après 9 ans de développement, j'espère que cela aurait valu la peine d'attendre. Il présente un plus grand niveau de fiabilité et est beaucoup plus léger et plus court. Principalement grâce à des matériaux améliorés, il est plus précis que le M16A2. Sa taille compacte le rend plus polyvalent et plus facile à utiliser que le M16A2. La carabine M4 a été utilisée lors de la guerre américaine en Afghanistan, de la guerre en Irak et de la guerre contre l'Etat islamique."

 SIA_manpats_1:0 "Bazooka de 3,5 pouces"
 SIA_manpats_1_short:0 "Bazooka de 3,5 pouces"
 SIA_manpats_1_desc:0 "Le Bazooka thaïlandais de 3,5 pouces était la désignation locale du M20 Super Bazooka américain, un lance-roquettes antichar portable, tiré à l'épaule, chambré en calibre 89 mm (3,5 pouces). Il est entré en service dans l'armée royale thaïlandaise au début des années 1950, fourni par les programmes d'assistance militaire des États-Unis alors que la Thaïlande s'alignait plus étroitement sur Washington au début de la guerre froide et des conflits d'Indochine"
 
 SIA_ammo_explosives_1:0 "La grenade à main de type 97"
 SIA_ammo_explosives_1_short:0 "Grenade de type 97"
 SIA_ammo_explosives_1_desc:0 "La grenade à main de type 97 était une grenade à fragmentation japonaise introduite en 1937 et largement utilisée par l'armée impériale japonaise pendant la Seconde Guerre mondiale. En Thaïlande, il est entré en service après 1940, lorsque l'armée royale thaïlandaise a reçu des armes japonaises dans le cadre des accords d'assistance militaire de la guerre franco-thaïlandaise et de l'alliance ultérieure avec le Japon pendant la Seconde Guerre mondiale.\n\nLe Type 97 était une version simplifiée de la précédente grenade Type 91, conçue principalement pour être lancée à la main."
 
 SIA_specialist_1:0 "Fusil de précision Arisaka Type 99"
 SIA_specialist_1_short:0 "Tapez 99"
 SIA_specialist_1_desc:0 "Le fusil de précision Type 99 était une arme de précision japonaise à verrou basée sur le fusil Arisaka Type 99, chambré en Arisaka 7,7 × 58 mm. Initialement adopté par l'armée impériale japonaise en 1939 en remplacement du fusil de précision Type 97 (6,5 mm), en Thaïlande, le fusil est entré en service au début des années 1940 dans le cadre des accords de coopération militaire entre Bangkok et Tokyo."
 
 SIA_protection_equip_1:0 "Casque M1"
 SIA_protection_equip_1_short:0 "Casque M1"
 SIA_protection_equip_1_desc:0 "Le casque M1 était un casque de combat américain introduit en 1941 et fourni aux forces armées royales thaïlandaises dans le cadre des programmes d'assistance militaire américains (MAP) commençant au début des années 1950. Il a remplacé un mélange de casques de style Adrian et de casques IJA adaptés localement, utilisés depuis la Seconde Guerre mondiale."
 
 SIA_hmg_1:0 "Mitrailleuse anti-aérienne de type 80"
 SIA_hmg_1_short:0 "Type 80 HMG"
 SIA_hmg_1_desc:0 "La mitrailleuse antiaérienne de type 80 était la désignation de l'armée thaïlandaise pour la mitrailleuse lourde Vickers de 0,5 pouce de classe D refroidie à l'eau, de fabrication britannique, mise en service en 1937. La Thaïlande a importé un premier lot de 24 armes d'Angleterre pour moderniser ses forces de défense aérienne, marquant un abandon des anciens systèmes de la Première Guerre mondiale.\n\nLe Type 80 était destiné à remplacer la mitrailleuse lourde Type 77 (désignée localement Vickers.303 HMG) dans le rôle anti-aérien."
 
 SIA_team_weapons_1:0 "8 mm modèle 1947 Madsen LMG"
 SIA_team_weapons_1_short:0 "Modèle 1947 Madsen LMG"
 SIA_team_weapons_1_desc:0 "la mitrailleuse légère Madsen modèle 1947 était une arme de conception danoise adoptée par l'armée royale thaïlandaise immédiatement après la Seconde Guerre mondiale. Basé sur le système éprouvé Madsen LMG, introduit pour la première fois en 1902 et reconnu comme la première véritable mitrailleuse légère au monde, le modèle thaïlandais 1947 était chambré pour la cartouche indigène 8 × 52 mmR, la cartouche standard des fusils thaïlandais Mauser siamois de type 66."
