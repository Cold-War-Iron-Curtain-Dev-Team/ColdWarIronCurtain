 SIA_naval_helicopter_equipment_6:0 "Westland Super Super Lynx Mk.110"
 SIA_naval_helicopter_equipment_6_short:0 "Super Lynx Mk.110"
 SIA_naval_helicopter_equipment_7:0 "Sikorsky MH-60S Seahawk"
 SIA_naval_helicopter_equipment_7_short:0 "MH-60S Seahawk"
 SIA_naval_helicopter_equipment_7_desc:0 "Le MH-60S Seahawk est une version améliorée du SH-60 Seahawk. Développé en 1993, le MH-60R a été conçu pour combiner les fonctionnalités des précédents SH-60B et SH-60F. Ses capteurs comprennent le package ASE, MTS-FLIR, l'interrogateur radar/IFF multimode AN/APS-147, une liaison de données de flotte aéroportée avancée et un sonar actif aéroporté plus avancé. Ceci, associé à un système d'armes amélioré (lui permettant de transporter la torpille avancée Mk 54 et les missiles AGM-114 Hellfire), confère au « Seahawk » une plus grande flexibilité dans les opérations d'assaut anti-navire et amphibie."
