 SIA_naval_helicopter_equipment_3:0 "Kaman HH-43 Huskie"
 SIA_naval_helicopter_equipment_3_short:0 "HH-43 Husky"
 SIA_naval_helicopter_equipment_3_desc:0 "Le Kaman HH-43 Huskie était un hélicoptère à rotors engrenés utilisé par l'armée de l'air américaine, la marine américaine et le corps des Marines des États-Unis des années 1950 aux années 1970."
