 SIA_jet_CAS_equipment_1:0 "République F-84E Thunderjet"
 SIA_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 SIA_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 SIA_jet_CAS_equipment_2:0 "République F-84G Thunderjet"
 SIA_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 SIA_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 
 SIA_recon_equipment_0:0 "Stinson L-5 Sentinelle"
 SIA_recon_equipment_0_short:0 "Sentinelle L-5"
 SIA_recon_equipment_0_desc:0 "Le Stinson L-5 Sentinel était un avion de liaison de la Seconde Guerre mondiale utilisé par toutes les branches de l'armée américaine et par la Royal Air Force britannique. Il a été produit par la Stinson Aircraft Company."
 SIA_jet_recon_equipment_0:0 "Étoile filante Lockheed RT-33A"
 SIA_jet_recon_equipment_0_short:0 "Étoile filante RT-33A"
 SIA_jet_recon_equipment_0_desc:0 "RT-33A modifié avant la livraison en tant que variante de reconnaissance monoplace ; 85 construits, principalement pour l'exportation dans le cadre du programme d'assistance militaire."
 SIA_jet_recon_equipment_1:0 "Chasseur de la liberté Northrop RF-5A"
