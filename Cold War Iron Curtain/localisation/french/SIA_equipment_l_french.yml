 SIA_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 SIA_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 SIA_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 SIA_jet_multirole_equipment_4:0 "Sabre nord-américain F-86L"
 SIA_jet_multirole_equipment_4_short:0 "Sabre F-86L"
 SIA_jet_multirole_equipment_4_desc:0 "D'autres améliorations du sabre F-86F pour le rendre plus efficace au combat contre les nouveaux avions équipés de postcombustion en les armant de points d'emport et de rails pour lancer des missiles AIM-9B Sidewinders."
