 SIA_jet_multirole_equipment_8:0 "Northrop F-5E Tigre II"
 SIA_jet_multirole_equipment_8_short:0 "F-5E Tigre II"
 SIA_jet_multirole_equipment_9:0 "General Dynamics F-16A Block 15 ADF (améliorations des capacités opérationnelles) Fighting Falcon"
 SIA_jet_multirole_equipment_9_short:0 "F-16A Bloc 15 OCU"
 SIA_jet_multirole_equipment_9_desc:0 "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 SIA_jet_multirole_equipment_10:0 "General Dynamics F-16A Block 15 OCU (Air Defence Fighter) Fighting Falcon"
 SIA_jet_multirole_equipment_10_short:0 "F-16ADF Bloc 15"
 SIA_jet_multirole_equipment_10_desc:0 "Le F-16 Air Defence Fighter (ADF) était une variante spéciale du Block 15 optimisée pour la mission d'interception des chasseurs de la Garde nationale aérienne des États-Unis. Commencé en 1989, 270 cellules ont été modifiées. L'avionique a été améliorée (y compris l'ajout d'un interrogateur d'identification ami ou ennemi (IFF) avec des antennes IFF « tranchant les oiseaux ») et un projecteur installé à l'avant et au-dessous du cockpit, pour l'identification nocturne. C'était la seule version américaine équipée du missile air-air AIM-7 Sparrow. À partir de 1994, ces avions ont commencé à être remplacés par des variantes plus récentes du F-16C. En 2005, seul l'ANG du Dakota du Nord pilotait cette variante, ces derniers exemplaires ayant été retirés du service américain en 2007."

 SIA_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 SIA_jet_light_equipment_1_short:0 "Étoile filante T-33"
 SIA_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 SIA_jet_light_equipment_2:0 "Cessna T-37A"
 SIA_jet_light_equipment_2_short:0 "T-37A"
 SIA_jet_light_equipment_3:0 "Cessna A-37B Libellule"
 SIA_jet_light_equipment_3_short:0 "A-37B Libellule"
 SIA_jet_light_equipment_4:0 "Chasseur de la liberté Northrop F-5B"
 SIA_jet_light_equipment_4_short:0 "Chasseur de la liberté F-5B"
 SIA_jet_light_equipment_4_desc:0 "L'avion américain Northrop F-5B Freedom Fighter utilisé par la Royal Norwegian Airforco. Principalement utilisé comme entraîneur d'introduction pour d'autres avions à réaction multirôles, il disposait de points d'attache pour les ordonnances."
 SIA_jet_light_equipment_5:0 "Dassault/Dornier Alpha Jet A1"
 SIA_jet_light_equipment_5_short:0 "Alpha-Jet A1"

