 SIA_cv_fighter_equipment_3:0 "Grumman F8F Bearcat"
 SIA_cv_fighter_equipment_3_short:0 "F8F Ourscat"
 SIA_cv_fighter_equipment_3_desc:0 "Le Grumman F8F Bearcat est un avion de combat monomoteur américain embarqué à la fin de la Seconde Guerre mondiale. Il a servi au milieu du XXe siècle dans la marine américaine, le corps des Marines des États-Unis et les forces aériennes d'autres pays. C'était le dernier avion de combat à moteur à pistons de Grumman Aircraft."
 
