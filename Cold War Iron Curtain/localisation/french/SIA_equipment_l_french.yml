 SIA_mbt_equipment_4:0 "Char de combat à chenilles complète : canon de 90 mm, M48A5"
 SIA_mbt_equipment_4_short:0 "M48A5 Patton"
 SIA_mbt_equipment_4_desc:0 "Le M48 Patton est un CCP conçu par le Département des munitions de l'armée américaine en 1953. Le M48 est doté d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Le moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents avec un système d'injection de carburant léger et est suralimenté. Il a une autonomie de fonctionnement hors route de 160 milles et de 300 milles sur route. Il peut rouler sur route à 30 mph, mais atteint 20 mph hors route grâce au moteur, à la transmission et aux chenilles améliorés. Il a servi de char principal pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton mais il s'agit d'un tout nouveau design avec de nouveaux mécanismes internes. Il est utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la Garde nationale exploitaient et entretenaient encore des M48 jusqu'à la fin des années 80."
 SIA_mbt_equipment_5:0 "Char de combat à chenilles complète : canon de 105 mm, M60"
 SIA_mbt_equipment_5_short:0 "M60 Patton"
 SIA_mbt_equipment_5_desc:0 "Le M60 Patton est un CCP conçu par le département des munitions de l'armée américaine en 1960. Il a été utilisé lors de la guerre du Yom Kippour, de l'invasion de la Grenade, du Yémen et du Liban. Il possède un blindage d'environ 220 mm et porte un canon principal de 105 mm. Il utilisait généralement la mitrailleuse M73 de 7,62 x 51 mm comme armement secondaire. Le moteur est un moteur V12 biturbo amélioré qui peut se déplacer à peu près à la même vitesse que le M48. Cependant, malgré un poids légèrement supérieur à celui du M48, le M60 peut se déplacer à peu près à la même vitesse et sur la même différence. Le M60 a subi de nombreuses modifications mineures tout au long de sa vie et compte ainsi environ 4 variantes. Cela signifiait une augmentation du blindage, du poids et une amélioration de la fiabilité."
 SIA_mbt_equipment_6:0 "Char de combat, entièrement chenillé : canon de 90 mm, M48A5PI"
 SIA_mbt_equipment_6_short:0 "Patton M48A5PI"
 SIA_mbt_equipment_6_desc:0 "Le M48 Patton est un CCP conçu par le Département des munitions de l'armée américaine en 1953. Le M48 est doté d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Le moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents avec un système d'injection de carburant léger et est suralimenté. Il a une autonomie de fonctionnement hors route de 160 milles et de 300 milles sur route. Il peut rouler sur route à 30 mph, mais atteint 20 mph hors route grâce au moteur, à la transmission et aux chenilles améliorés. Il a servi de char principal pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton mais il s'agit d'un tout nouveau design avec de nouveaux mécanismes internes. Il est utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la Garde nationale exploitaient et entretenaient encore des M48 jusqu'à la fin des années 80."

 SIA_mechanized_equipment_1:0 "Demi-piste M2"
 SIA_mechanized_equipment_1_short:0 "Demi-piste M2"
 SIA_mechanized_equipment_1_desc:0 "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 SIA_mechanized_equipment_2:0 "Demi-piste M3"
 SIA_mechanized_equipment_2_short:0 "Demi-piste M3"
 SIA_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 SIA_mechanized_equipment_3:0 "Demi-piste M3A1"
 SIA_mechanized_equipment_3_short:0 "Demi-piste M3A1"
 SIA_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
 #SIA_mechanized_equipment_4_short:0 ""
 #SIA_mechanized_equipment_4_desc:0 ""
 SIA_mechanized_equipment_5:0 "M113" 
 SIA_mechanized_equipment_5_short:0 "M113"
 SIA_mechanized_equipment_5_desc:0 "Les APC américains les plus reconnaissables depuis les années 60. Il est largement utilisé et, grâce à des années de recherche, il en a fait un véritable véhicule blindé de transport de troupes, en utilisant sa hauteur, son angle de blindage et son épaisseur. Et plus tard, introduisant de plus en plus de variantes, s'armant d'un M2 Browning.50 Cal avec quelques milliers de tours de liberté. Se vante vraiment d'être un bon APC. Des dizaines de variantes provenaient de la gamme du M113, toujours utilisée par l'armée américaine à ce jour."
 SIA_mechanized_equipment_6:0 "Transporteur, personnel, entièrement chenillé, blindé, M113A1"
 SIA_mechanized_equipment_6_short:0 "M113A1"
 SIA_mechanized_equipment_6_desc:0 "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), pour profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
 SIA_mechanized_equipment_7:0 "Tapez 85"
 SIA_mechanized_equipment_7_short:0 "Tapez 85"
 #SIA_mechanized_equipment_7_desc:0 "" 
 SIA_mechanized_equipment_8:0 "Transporteur, personnel, entièrement chenillé, blindé, M113A3"
 SIA_mechanized_equipment_8_short:0 "M113A3"
 SIA_mechanized_equipment_8_desc:0 "En 1987, d'autres améliorations pour une « survie améliorée (sur le champ de bataille) » ont été introduites. Cela comprenait un joug pour la direction au lieu des latéraux, un moteur plus puissant (le Detroit Diesel turbocompressé 6V-53T), des réservoirs de carburant externes et des revêtements internes anti-éclats pour une protection améliorée. Le suffixe A3 est utilisé sur toutes les variantes pour indiquer la mise à niveau vers la norme A3."

 SIA_motorized_equipment_1:0 "GMC CCKW 6x6"
 SIA_motorized_equipment_1_short:0 "GMC CCKW 6x6"
 SIA_motorized_equipment_1_desc:0 "Le GMC CCKW est un camion 6x6 de 2,5 tonnes conçu par General Motors en 1941. Il a été largement utilisé pendant la Seconde Guerre mondiale et la guerre de Corée. Le CCKW utilise un moteur GMC270, une transmission à 5 vitesses/2 gammes et un essieu à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer jusqu'à 45 mph sur 300 miles et atteint 7,5 mi/gal. Le CCKW a été développé pour l'armée américaine en tant que camion de transport et de ravitaillement de troupes. Le camion, en plus d'être utilisé pour le ravitaillement et le transport, pourrait également monter une carrosserie de fourgon pour servir de véhicule de confort/soutien sur le terrain et peut également monter des armes remorquées sur son plateau pour créer des armes SP bon marché."
 SIA_motorized_equipment_2:0 "RÉO M35 6x6"
 SIA_motorized_equipment_2_short:0 "M35 6x6"
 SIA_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 SIA_motorized_equipment_3:0 "AM Général M809 6x6"
 SIA_motorized_equipment_3_short:0 "M809 6x6"
 SIA_motorized_equipment_3_desc:0 "Le M809 est un camion 6x6 de 5 tonnes conçu par AM General en 1970. Il a été utilisé dans tous les conflits américains de 1970 à 1982. Le M809 utilise un moteur NH250, une transmission à 5 vitesses/2 gammes et des essieux à poutre dynamique sur ressorts à lames. Il peut transporter une charge de 5 000 lb. Il a une vitesse de 52 mph sur 350 miles et obtient 10 mi/gal. En plus d'être utilisé pour le transport et le fret, le véhicule est très solide et peut supporter des composants utilitaires sur son plateau. Ceux-ci incluent la possibilité de monter des kits de dépanneuse, des bennes, des remorques, de grandes fourgonnettes pour le soutien/confort, des équipements de pontage et quelques autres. Le M809 peut également traverser des rivières peu profondes grâce à sa garde au sol élevée et est très efficace sur route ou hors route grâce à sa suspension. "
 SIA_motorized_equipment_4:0 "AM Général M939 6x6"
 SIA_motorized_equipment_4_short:0 "M939 6x6"
 SIA_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 utilise un moteur 6CTA8.3, une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Le véhicule est capable de transporter une charge de 10 000 lb. Il peut se déplacer à 6,3 mph sur 350 miles et obtient 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et convient bien aux intempéries. Le M939 a permis une nouvelle génération de camions, de moteurs principaux et de véhicules de dépannage et a fait l'objet d'une fabrication intensive. Il est plus fiable et plus résistant que les véhicules précédents et a complètement supplanté les contrats de production antérieurs. "
 SIA_motorized_equipment_5:0 "Famille Oshkosh de véhicules tactiques moyens 6x6"
 SIA_motorized_equipment_5_short:0 "FMTV 6x6"
 SIA_motorized_equipment_5_desc:0 "La famille de véhicules tactiques moyens (FMTV) est une série de véhicules, basés sur un châssis commun, qui varient en fonction de la charge utile et des exigences de la mission. Le FMTV est dérivé du camion autrichien Steyr 12 M 18, mais considérablement modifié pour répondre aux exigences de l'armée américaine, celles-ci comprenant un minimum de 50 pour cent de contenu américain."

 SIA_mechanized_marine_equipment_1:0 "Buffle d'eau LVT-4"
 SIA_mechanized_marine_equipment_1_short:0 "LVT-4"
 SIA_mechanized_marine_equipment_1_desc:0 "Le LVTP-4 est un véhicule d'atterrissage amphibie conçu par Ford Machinery Corporation au début des années 40. Le LVTP-4 a été utilisé pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Il utilise un moteur radial à 7 cylindres W-670-9A et peut parcourir jusqu'à 75 miles dans l'eau à 7 mph. Evolution du LVTP-1, le LVTP-4 est capable de parcourir des distances incroyables, bien qu'à des vitesses lentes. Si vous devez traverser 70 milles d'eau et disposer d'environ 10 heures pour le faire, le LVTP-4 est votre véhicule de choix. Il est capable de transporter des troupes ou des véhicules. "
 SIA_mechanized_marine_equipment_2:0 "LVT(A)-5"
 SIA_mechanized_marine_equipment_2_short:0 "LVT(A)-5"
 SIA_mechanized_marine_equipment_2_desc:0 "LVT(A)-4 avec une tourelle motorisée et un gyrostabilisateur pour l'obusier. Certains ont été améliorés à la fin des années 1940 en modifiant la configuration du blindage."
 SIA_mechanized_marine_equipment_3:0 "AAVP-7"
 SIA_mechanized_marine_equipment_3_short:0 "AAVP-7"
 SIA_mechanized_marine_equipment_3_desc:0 "Le LVTP-7 ou AAVP-7 est un APC amphibie conçu en 1972 par la Food Machinery Corporation. Des conflits ont eu lieu aux Malouines, à la Grenade, dans le Golfe, en Syrie et en Irak. Le LVTP-7 utilise un moteur 8V-53T et peut parcourir 23 miles à 8,2 mph dans l'eau. Plus particulièrement, le LVTP-7 est capable de voyager dans un état de mer 5, qui est classé comme « agité » avec un gonflement de mer moyen à élevé, ce qui le rend excellent pour faire face à des conditions météorologiques difficiles que le LVTP-5. De plus, il est bien plus blindé que le LVTP-5. Parce qu'il peut voyager de manière impressionnante dans un état de mer 5 et qu'il est mieux protégé, il a remplacé le LVTP-5. Il comporte également des disperseurs de fumée."
 SIA_mechanized_marine_equipment_4:0 "AAVP-7A1"
 SIA_mechanized_marine_equipment_4_short:0 "AAVP-7A1"
 SIA_mechanized_marine_equipment_4_desc:0 "Le LVTP-7 ou AAVP-7 est un APC amphibie conçu en 1972 par la Food Machinery Corporation. Des conflits ont eu lieu aux Malouines, à la Grenade, dans le Golfe, en Syrie et en Irak. Le LVTP-7 utilise un moteur 8V-53T et peut parcourir 23 miles à 8,2 mph dans l'eau. Plus particulièrement, le LVTP-7 est capable de voyager dans un état de mer 5, qui est classé comme « agité » avec un gonflement de mer moyen à élevé, ce qui le rend excellent pour faire face à des conditions météorologiques difficiles que le LVTP-5. De plus, il est bien plus blindé que le LVTP-5. Parce qu'il peut voyager de manière impressionnante dans un état de mer 5 et qu'il est mieux protégé, il a remplacé le LVTP-5. Il comporte également des disperseurs de fumée."
 #SIA_mechanized_marine_equipment_5:0 ""
