 SIA_attack_helicopter_equipment_3:0 "Bell AH-1F Cobra"
 SIA_attack_helicopter_equipment_3_short:0 "AH-1F Cobra"
 SIA_attack_helicopter_equipment_3_desc:0 "L'AH-1F intègre toutes les mises à niveau des étapes 1 et 2 de l'AH-1S. Il comportait également des mises à niveau de l'étape 3 ; un affichage tête haute, un télémètre laser, un brouilleur infrarouge monté au-dessus de l'échappement du moteur, un système d'échappement du moteur à suppression infrarouge et le sous-système de données aériennes M143 (ADS). L'AH-1F est également appelé « AH-1S modernisé », « AH-1S Modernized Cobra » ou « AH-1S(MC) » avant 1988."

 SIA_utility_helicopter_equipment_2:0 "Bell UH-1A Iroquois"
 SIA_utility_helicopter_equipment_2_short:0 "UH-1A Iroquois"
 SIA_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."
 SIA_utility_helicopter_equipment_3:0 "Bell UH-1D Iroquois"
 SIA_utility_helicopter_equipment_3_short:0 "UH-1D Iroquois"
 SIA_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 SIA_utility_helicopter_equipment_4:0 "Bell UH-1N Twin Huey"
 SIA_utility_helicopter_equipment_4_short:0 "UH-1N Twin Huey"
 SIA_utility_helicopter_equipment_4_desc:0 "Introduit pour la première fois en 1970, l'UH-1N était un autre membre de la famille élargie « Huey », cette fois développé à partir de l'UH-1H, bien que contrairement à l'UH-1A et à l'UH-1D, la variante « N » serait celle qui donnerait naissance à sa version civile, le Bell 212. Le rotor principal est propulsé par deux turbomoteurs qui entraînent un seul arbre de sortie. En cas de panne d'un moteur, le moteur restant peut fournir 671 kW (900 shp) pendant 30 minutes ou 571 kW (765 shp), permettant à l'UH-1N de maintenir ses performances de croisière au poids maximum. C'était également l'une des rares variantes « iroquoises » à ne pas être utilisée par l'armée américaine, étant plutôt le porte-drapeau des Marines. Sa configuration bimoteur lui a valu le surnom informel de « Twin Huey »."
 SIA_utility_helicopter_equipment_5:0 "Sikorsky UH-60A Faucon Noir"
 SIA_utility_helicopter_equipment_5_short:0 "UH-60A Faucon Noir"
 SIA_utility_helicopter_equipment_5_desc:0 "Entré en service en 1979, l'UH-60A a succédé à l'UH-1 en tant que plate-forme d'hélicoptère utilitaire de l'armée américaine. Développé à partir du S-70 civil, l'UH-60A pouvait transporter jusqu'à 15 personnes (4 membres d'équipage et jusqu'à 11 soldats équipés). Nommé d'après un chef de tribu amérindienne Sauk, le « Blackhawk » a servi au combat lors de conflits à la Grenade, au Panama, en Irak, en Somalie, dans les Balkans, en Afghanistan et dans d'autres régions du Moyen-Orient."
 SIA_utility_helicopter_equipment_6:0 "Sikorsky UH-60L Faucon Noir"
 SIA_utility_helicopter_equipment_6_short:0 "UH-60L Faucon Noir"
 SIA_utility_helicopter_equipment_6_desc:0 "Une mise à niveau de l'UH-60A, la variante « L » du « Blackhawk » comprend des moteurs améliorés, une boîte de vitesses à durabilité améliorée et un système de commandes de vol mis à jour. Introduit en 1990, l'UH-60L est la principale variante de la variante utilitaire du H-60 actuellement en service dans l'armée américaine, avec des considérations sur le type utilisé pour remplacer l'UH-1N dans l'US Air Force."
 SIA_utility_helicopter_equipment_7:0 "Sikorsky UH-60M Faucon Noir"
 SIA_utility_helicopter_equipment_7_short:0 "UH-60M Faucon Noir"
 SIA_utility_helicopter_equipment_7_desc:0 "Pales de rotor à large corde de conception améliorée, moteurs T700-GE-701D (max 2 000 shp ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur du système de gestion intégré de la santé du véhicule (IVHMS) et nouveau cockpit en verre."

