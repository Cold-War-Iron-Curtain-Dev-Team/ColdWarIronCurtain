 wif.1.d: "La Fédération des Antilles a vu le jour aujourd'hui à la suite de l'adoption de la British Caribbean Federation Act. La nouvelle union politique unit plus de vingt îles principales et près de deux cent cinquante îles plus petites en dix provinces dotées d'un centre fédéral. Les Britanniques espèrent que la Fédération sera en mesure de transformer ses anciennes îles coloniales en un État totalement indépendant. Londres considère la Fédération comme un moyen de répondre à la pression croissante des sujets des îles en faveur de l'indépendance, tout en garantissant que l'indépendance se traduira par un État viable et non dépendant de Londres. Certains habitants, notamment ceux des grandes îles, accueillent avec prudence ce nouvel État, mais expriment leur inquiétude quant au degré de centralisation de la Fédération. Un militant anticolonial interrogé a déclaré que la Fédération poursuivait simplement l'exploitation britannique et que seule une indépendance immédiate mettrait fin à des siècles d'oppression coloniale envers les habitants des îles. Cependant, il semble que la majorité des gens accueillent favorablement cette nouvelle et espèrent qu'elle marquera une nouvelle période d'indépendance et de développement pour le peuple."
