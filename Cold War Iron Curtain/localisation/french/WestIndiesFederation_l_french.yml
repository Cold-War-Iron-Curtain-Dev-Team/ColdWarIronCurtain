 wif.1.d:0 "La Fédération des Antilles a vu le jour aujourd'hui suite à l'adoption de la loi sur la Fédération des Caraïbes britanniques. Cette nouvelle union politique regroupe plus de vingt îles principales et près de deux cent cinquante îles plus petites au sein de dix provinces dotées d'un centre fédéral. Les Britanniques espèrent que la Fédération permettra la transition de leurs anciennes colonies vers un État pleinement indépendant. Londres perçoit la Fédération comme un moyen de répondre à la pression croissante des populations insulaires en faveur de l'indépendance, tout en garantissant que cette indépendance se traduira par un État viable et non dépendant de Londres. Certains habitants, notamment ceux des îles les plus grandes, accueillent avec prudence ce nouvel État, mais s'inquiètent du degré de centralisation de la Fédération. Un militant anticolonialiste interrogé a déclaré que la Fédération ne faisait que perpétuer l'exploitation britannique et que seule une indépendance immédiate mettrait fin à des siècles d'oppression coloniale pour les populations des îles. Cependant, il semble que la majorité de la population se réjouisse de cette nouvelle et espère qu'elle marquera le début d'une ère d'indépendance et de développement."