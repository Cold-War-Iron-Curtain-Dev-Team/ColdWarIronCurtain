  #OLD
  GFX_SPEVNT_Nixon_Elected_TEXT: "Le rêve américain ne vient pas à ceux qui s'endorment."
  GFX_SPEVNT_JFK_Elected_TEXT: "Le changement est la loi de la vie. Et ceux qui regardent uniquement vers le passé ou le présent manqueront certainement l'avenir."
  GFX_SPEVNT_Humphrey_Elected_TEXT: "C'est donc le test que nous devons nous fixer ; ne pas marcher seul mais marcher de telle manière que d'autres voudront nous rejoindre."
  GFX_SPEVNT_Wallace_Elected_TEXT: "Après mûre réflexion et prière, je sens que je dois dire que j'ai gravi ma dernière montagne politique."
  GFX_SPEVNT_Lyndon_Elected_TEXT: "Nous sommes une nation et un peuple. Notre destin en tant que nation et notre avenir en tant que peuple ne reposent pas sur un seul citoyen, mais sur tous les citoyens."
  GFX_SPEVNT_Korean_war_TEXT: "Nous venons de vivre une guerre mondiale..."
  GFX_SPEVNT_Korean_war_USA_TEXT: "La Corée est un petit pays situé à des milliers de kilomètres, mais ce qui s'y passe est important pour tous les Américains."
  GFX_SPEVNT_premier_khrushchev_TEXT: "Que cela vous plaise ou non, l'histoire est de notre côté. Nous allons vous enterrer !"
  GFX_EU_FUNDED_TEXT: "Il n'y aura pas de paix en Europe si les États se reconstruisent sur la base de la souveraineté nationale, avec ses implications de politique de prestige et de protection économique.... Les pays européens ne sont pas suffisamment forts individuellement pour pouvoir garantir la prospérité et le développement social de leurs peuples. Les États d'Europe doivent donc former une fédération ou une entité européenne qui en ferait une unité économique commune."
  

