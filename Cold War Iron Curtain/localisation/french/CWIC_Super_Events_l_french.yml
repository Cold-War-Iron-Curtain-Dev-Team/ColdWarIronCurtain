l_french:
  get_super_event_title: "-"

  Super_Event_JAP_Economic_Dominance_DESC: "J'ai rêvé de succès mondain une fois.\n-Miyamoto Musashi"
  Super_Event_SUEZ_ENG_Victory_DESC: "Je suis toujours impénitent à propos de Suez. Les gens ne regardent jamais ce qui serait arrivé si nous n'avions rien fait. Il y a un parallèle avec les années 30. Si l'on permet aux gens de rompre des accords en toute impunité, l'appétit pour se nourrir de telles choses grandit.\n-Anthony Eden"
  Super_Event_Korean_War_KOR_Victory_DESC: "Parmi les nations du monde, la Corée est jusqu'à présent la seule à avoir tout risqué contre le communisme. La magnificence du courage et du courage du peuple coréen défie toute description.\n-Douglas MacArthur"
  Super_Event_gkchp_DESC: "Les gars, on n'est plus dans ce schéma ! Et alors, on monte tous dans le bus et on part ? Le choix est simple : soit nous sommes tous des traîtres à la grande Union soviétique, soit nous devons faire quelque chose !\n\n-Vladimir Kriouchkov"
  Super_Event_Image_LastWar_DESC: "La haine de l'ennemi envahisseur est un sentiment des plus humains. Mais il naît avec une telle douleur au coeur et un tel tourment de l'âme que Dieu interdit à quiconque d'en faire l'expérience une seconde fois.\n\n-Pavel Batov"
  Super_Event_April_Revolution_DESC: "Cette lutte doit être menée sans se laisser intimider par l'oppression des baïonnettes, et vise à maintenir la désintoxication drastique de l'injustice et de la corruption apportée par un long règne maniaque, essayant d'anéantir la démocratie pour nos descendants.\n-Étudiants de l'Université Chung-Ang"
  Super_Event_May_16th_Military_Coup_DESC: "Si nous avons l'obligation de défendre la liberté, ne devrions-nous pas également avoir l'obligation de réglementer la liberté qui viole la liberté d'autrui ou la liberté d'autres institutions ?\n-Parc Chung-hee"
  Super_Event_May_16th_Military_Revolution_DESC: "Je crois que tout donner pour le seul et unique peuple et pour la nation qui doit exister pour toujours est le moyen de compenser le sang noble versé par les jeunes étudiants.\n-Yun Po-soleil"
  Super_Event_Park_Assasination_DESC: "Je peux dire clairement ici que dans la quatrième épreuve, le jugement du ciel, j'ai déjà gagné.\n-Kim Jae-gyu"
  Super_Event_Pablo_Elect_DESC: "Je préfère être dans une tombe en Colombie plutôt que dans une cellule de prison aux États-Unis.\n-Pablo Emilio Escobar Gaviria"  
  Super_Event_Pablo_Wins_DrugWar_DESC: "Parfois, je me sens comme Dieu... quand j'ordonne de tuer quelqu'un, il meurt le même jour.\n-Pablo Emilio Escobar Gaviria"  
  SUPER_EVENT_GRACHEV: "Gagnez avec vos capacités, pas avec vos chiffres.\n-Alexandre Souvorov"
  SUPER_EVENT_SOUTH_VIETNAM_INDOCHINA_WAR_VICTORY: "En cette heure décisive de notre histoire nationale, l'union signifie la vie et la division signifie la mort.\n-Bao-Dai"
  SUPER_EVENT_NORTH_VIETNAM_INDOCHINA_WAR_VICTORY: "Notre histoire nous enseigne cette leçon : lorsque notre peuple s'unira, notre pays sera indépendant et libre. Au contraire, lorsque les gens ne s'unissent pas, ils seront envahis par des pays étrangers\n-Hô Chi Minh"
  SUPER_EVENT_ZHRINOVSKY: "La véritable raison de l'attaque de Mme Rice contre la Russie est très simple. Condoleezza Rice est une femme très cruelle et offensée qui manque d'attention des hommes.\n-Vladimir Jirinovski"
  SUPER_EVENT_FALL_OF_SOVIET_UNION: "Le mur de Berlin n'est pas le seul obstacle à tomber après l'effondrement de l'Union soviétique et la fin de la guerre froide. Les barrières traditionnelles à la circulation de l'argent, du commerce, des personnes et des idées sont également tombées.\n-Farid Zakaria"
  SUPER_EVENT_CASTRO_DEATH_DESC: "Condamnez-moi. Cela compte. L'histoire m'abominera.\n-Fidel Castro"
  SUPER_EVENT_CUBAN_REVOLUTION_ALT_A_DESC: "Pour nous, il n'y a pas de définition valable du socialisme autre que l'abolition de l'exploitation d'un être humain par un autre\n-Che Guevara"
  SUPER_EVENT_CUBAN_REVOLUTION_ALT_B_DESC: "Tu as réalisé ta vie, tes rêves, tu es mort en combattant et de plein fouet... Combien je souffre de ne pas avoir été celui qui est tombé à tes côtés, frère ! Mon frère! Que tu ne me quittes que, ruminant mes sourds chagrins, pleurant ton éternelle absence...\n-Frank Pais" 
  SUPER_EVENT_CUBAN_REVOLUTION_ALT_C_DESC: "Si nous tombons, que notre sang nous montre le chemin vers la liberté. Car, que notre action obtienne ou non le succès que nous espérons, le tumulte qu'elle provoquera nous fera avancer sur le chemin du triomphe.\"\n-José Antonio Echeverria"
  SUPER_EVENT_HAVANA_SPRING_DESC: "Le fait est que lorsque les hommes portent les mêmes idéaux dans leur coeur, rien ne peut les isoler - ni les murs des prisons, ni le gazon des cimetières. Car une seule mémoire, un seul esprit, une seule idée, une seule conscience, une seule dignité les soutiendront tous.\n-Fidel Castro" 
  SUPER_EVENT_RUSSIAN_SFSR_DESC: "Les oligarques qui ont ruiné le peuple savent mieux que d'autres qu'un nouvel effondrement économique approche à grands pas. Afin de rester au pouvoir, ils ont décidé de vous tromper une fois de plus en choisissant des élections anticipées avant que la vérité n'éclate.\n-Gennady Ziouganov"
  SUPER_EVENT_BARKHASOV_NAZI_RUSSIA_DESC: "Quand nous aurons gagné la guerre, qui remettra en question nos méthodes ?\n-Adolf Hitler"
  SUPER_EVENT_HOLY_RUSSIAN_EMPIRE_DESC: "Le système tsariste n'était pas condamné en 1914.\n-Tsar Nicolas II"
  SUPER_EVENT_ANPIlOV_USSR_DESC: "Ce ne sont pas les héros qui font l'histoire, mais l'histoire qui fait les héros.\n-Josph Staline"
  SUPER_EVENT_LIBERATE_TAIWAN_DESC: "L'unité construite par la lutte peut survivre, mais l'unité qui résulte de la capitulation disparaîtra.\n-Mao Zedong"
  SUPER_EVENT_RUSSIAN_SOVIET_ISLAMIC_FEDERATIVE_REPUBLIC_DESC: "Nous sommes convaincus que le soleil du socialisme se lèvera à nouveau sur la Russie et sur le monde entier. Les travailleurs triompheront.\n-Gennady Ziouganov"
  SUPER_EVENT_RUSSIAN_FEDERATION_DESC: "Tout le monde ne cesse de répéter : réforme, réforme. Le T-72 a fait ses preuves à merveille dans Battlefield. Nous allons donc procéder à une réforme sur la base du T-72.\n-Pavel Grachev" 
  SUPER_EVENT_ANTI_IMPERIALIST_BLOC_DESC: "La chose la plus importante dans nos préparatifs de guerre est d'apprendre à tout notre peuple à haïr l'impérialisme américain. Autrement, nous ne pourrons pas vaincre les impérialistes américains qui se vantent de leur supériorité technologique.\n-Kim Il-sung"
  SUPER_EVENT_WACO_DESC: "Si la Bible est vraie, alors je suis le Christ.\n-David Koresh"
  SUPER_EVENT_EARLY_PUTIN_PRESIDENCY_DESC: "Personne ni rien n'arrêtera la Russie sur la voie du renforcement de la démocratie et du respect des droits de l'homme et des libertés.\n-Vladimir Poutine"
  SUPER_EVENT_RUTSKOY_PRESIDENCY_DESC: "Un homme doit vivre comme une grande flamme brillante et brûler aussi intensément que possible. À la fin, il s'épuise. Mais c'est bien mieux qu'une méchante petite flamme.\n-Boris Eltsine"
  SUPER_EVENT_ZYUGANOV_1996_DESC: "Notre principale tâche commune est d'élargir la résistance à l'offensive agressive du capitalisme. Former un front uni pour soutenir les pays qui subissent la pression impérialiste.\n-Gennady Ziouganov"
  SUPER_EVENT_RUSSIAN_SMO_UKRAINE_DESC: "Personne ni rien n'arrêtera la Russie sur la voie du renforcement de la démocratie et du respect des droits de l'homme et des libertés.\n-Vladimir Poutine"
  SUPER_EVENT_RUSSIAN_SMO_KAZAKHISTAN_DESC: "Je veux dire, en général, le danger vient des religions orientales et de l'Islam.\n-Vladimir Jirinovski"
  SUPER_EVENT_GORBACHEV_1996_DESC: "À l'époque, j'avais quelques problèmes financiers avec ma fondation, j'ai donc fait une publicité pour Pizza Hut.\n-Mikhaïl Gorbatchev"
  SUPER_EVENT_OPERATION_FULL_STOP_DESC: "J'ai noté une particularité inébranlable chez les Russes : il fallait toujours aller vers eux ; jamais ils ne viendraient nous rendre visite ni même nous rencontrer à mi-chemin.\n-William Westmoreland"
  SUPER_EVENT_AMERICAN_SOVIET_VICTORY_DESC: "La paix la plus élevée est la paix entre les contraires.\n-Léonid Brejnev"
  SUPER_EVENT_AMERICAN_SOVIET_VICTORY_DESC_A: "Nous ne pouvons pas apprendre les uns des autres tant que nous n'arrêtons pas de nous crier dessus - tant que nous ne parlons pas suffisamment doucement pour que nos paroles puissent être entendues ainsi que nos voix.\n-Richard Nixon"
  SUPER_EVENT_CMC_WW3_SOV_DESC: "Il y a des décennies où rien ne se passe ; et il y a des semaines où des décennies se produisent.\n-Vladimir Lénine"
  SUPER_EVENT_SDI_DESC: "La politique de défense des États-Unis repose sur un principe simple : les États-Unis ne déclenchent pas de combats. Nous ne serons jamais un agresseur. Nous maintenons notre force afin de dissuader et de nous défendre contre l'agression - pour préserver la liberté et la paix.\n-Ronald Reagan"
  SUPER_EVENT_CUBAN_CIVIL_WAR_DESC: "Dans chaque société, il y a des hommes aux instincts bas. Les sadiques, les brutes, les porteurs de tous les atavismes ancestraux se présentent sous l'apparence d'êtres humains, mais ce sont des monstres, seulement plus ou moins retenus par la discipline et les habitudes sociales. Si on leur offre à boire dans une rivière de sang, ils ne seront satisfaits que lorsqu'ils auront bu la rivière à sec.\n-Fidel Castro"
  SUPER_EVENT_BATISTA_TRIUMPHANT_DESC: "Un gouvernement a besoin de 100 soldats pour chaque guérilla à laquelle il fait face.\n-Fulgencio Batista"
  SUPER_EVENT_BATISTA_STEPS_DOWN_DESC: "Le vrai révolutionnaire est guidé par un grand sentiment d'amour. Il est impossible d'imaginer un véritable révolutionnaire dépourvu de cette qualité.\n-Che Guevara" 
  SUPER_EVENT_BAY_OF_PIGS_VICTORY_DESC: "Le changement est la loi de la vie. Et ceux qui regardent uniquement vers le passé ou le présent manqueront certainement l'avenir.\n-John F. Kennedy"
  SUPER_EVENT_OPERATION_JUVENTUD_DESC: "La guerre atomique est inévitable. Cela détruira la moitié de l'humanité : cela détruira d'immenses richesses humaines. C'est très possible. La guerre atomique va provoquer un véritable enfer sur Terre. Mais cela n'empêchera pas le communisme.\n-J. Posadas"
  SUPER_EVENT_BOLIVIAN_REVOLUTION_DESC: "Il est important de souligner que la guérilla est une guerre des masses, une guerre du peuple. La guérilla est un noyau armé, l'avant-garde combattante du peuple. Elle tire sa grande force de la masse du peuple lui-même.\n-Che Guevara"
  SUPER_EVENT_BURMA_LIBERATION_WAR: "La confiance se gagne par de nombreux actes et se perd par un seul.\n-Sun Yat-sen"
  SUPER_EVENT_KHASBULATOV_PRESIDENCY_DESC: "Nous devons prendre le Kremlin.\n-Ruslan Khasbulatov"
  SUPER_EVENT_SECOND_RUSSIAN_CIVIL_WAR_DESC: "Une heure décisive est arrivée pour la lutte pour la patrie.\n-Alexandre Rutskoi" 
  SUPER_EVENT_BLACK_OCTOBER_DESC: "Le sort de la Russie, le sort de nos enfants se décident aujourd'hui. Je crois en notre bon sens, je crois en notre force.\n-Boris Eltsine"
  SUPER_EVENT_FORD_ASSASINATION_DESC: "Ces enfants qui vous attaquent avec des couteaux, ce sont vos enfants. Vous leur avez appris. Je ne leur ai pas enseigné. J'ai juste essayé de les aider à se lever.\n-Charles Manson"
  SUPER_EVENT_PRESIDENT_LANDGREBE_DESC: "Ne me confondez pas avec les faits. J'ai l'esprit fermé. Je ne voterai pas pour la destitution. Je vais rester aux côtés de mon président même si lui et moi devons être emmenés hors de ce bâtiment et fusillés.\n-Comte Landgrebe"
  SUPER_EVENT_PRESIDENT_MCDONALD_DESC: "La volonté des Rockefeller et de leurs alliés est de créer un gouvernement mondial unique combinant le supercapitalisme et le communisme sous la même tente, le tout sous leur contrôle.... Est-ce que je parle de conspiration ? Oui je le fais. Je suis convaincu qu'il existe un tel complot, de portée internationale, vieux de plusieurs générations dans sa planification et incroyablement maléfique dans ses intentions.\n-Larry McDonald"
  SUPER_EVENT_FIRST_MAFIA_WAR_DESC: "Notre vie est une vie merveilleuse. Si vous pouvez traverser la vie comme ça et vous en sortir, hé, c'est génial. Mais c'est très, très imprévisible. Il y a tellement de façons de tout gâcher.\n-Paul Castellano"
  SUPER_EVENT_PRESIDENT_ROBERTSON_DESC: "Le programme féministe ne porte pas sur l'égalité des droits pour les femmes. Il s'agit d'un mouvement politique socialiste anti-famille qui encourage les femmes à quitter leur mari, à tuer leurs enfants, à pratiquer la sorcellerie, à détruire le capitalisme et à devenir lesbiennes.\n-Pat Robertson"
  SUPER_EVENT_PRESIDENT_MCGOVERN_1984_DESC: "Le patriotisme le plus élevé n'est pas une acceptation aveugle de la politique officielle, mais un amour de son pays suffisamment profond pour l'appeler à des normes plus élevées.\n-George McGovern"
  SUPER_EVENT_PRESIDENT_TED_KENNEDY_DESC: "Pour tous ceux dont les soucis ont été notre préoccupation, le travail continue, la cause perdure, l'espoir vit toujours et le rêve ne mourra jamais.\n-Ted Kennedy"
  SUPER_EVENT_PRESIDENT_JESSE_JACKSON_DESC: "Notre heure est venue. La souffrance engendre le caractère. Le caractère engendre la foi. En fin de compte, la foi ne décevra pas.\n-Jesse Jackson"
  SUPER_EVENT_PRESIDENT_TRUMP_88_DESC: "J'ai pris des décisions difficiles, toujours en gardant à l'esprit le résultat net. Il est peut-être temps que l'Amérique soit gérée comme une entreprise.\n-Donald J. Trump"
  SUPER_EVENT_PRESIDENT_CLINTON_84_DESC: "Il n'y a rien de mal en Amérique qui ne puisse être guéri par ce qui est bien en Amérique.\n-Bill Clinton"
  SUPER_EVENT_PRESIDENT_RUMSFELD_DESC: "Il y a des connus connus. Ce sont des choses que nous savons et que nous savons. Il existe des inconnues connues. C'est-à-dire qu'il y a des choses que nous savons que nous ne savons pas. Mais il y a aussi des inconnues inconnues. Il y a des choses que nous ne savons pas, nous ne savons pas.\n-Donald Rumsfeld"
  SUPER_EVENT_PRESIDENT_BROOKE_DESC: "J'ai toujours cru qu'il y aurait un président afro-américain. C'était quelque chose dont j'avais rêvé, auquel j'avais pensé, mais je ne pensais certainement pas qu'il se produirait de mon vivant.\n-Edward Brooke"
  SUPER_EVENT_PRESIDENT_INOYUE_DESC: "Une grande nation a trahi les principes qui ont fait sa grandeur et est ainsi devenue l'otage des preneurs d'otages\n-Daniel Inouye"
  SUPER_EVENT_PRESIDENT_GLENN_DESC: "S'il y a une chose que j'ai apprise au cours de mes années sur cette planète, c'est que les personnes les plus heureuses et les plus épanouies que j'ai connues sont celles qui se consacrent à quelque chose de plus grand et de plus profond que leur simple intérêt personnel.\n-John Glenn"
  SUPER_EVENT_PRESIDENT_HART_DESC: "Suivez-moi partout. Je m'en fiche. Si quelqu'un veut me suivre, qu'il le fasse. Ils s'ennuieraient beaucoup.\n-Gary Hart"
  SUPER_EVENT_PRESIDENT_DUKAKIS_DESC: "Notre plus grande force ne vient pas de ce que nous possédons, mais de ce en quoi nous croyons ; non pas de ce que nous avons, mais de qui nous sommes.\n-Michael Dukakis"
  SUPER_EVENT_PRESIDENT_BRADLEY_DESC: "La seule chose qui vous empêche de réaliser vos rêves, c'est vous.\n-Tom Bradley"
  SUPER_EVENT_PRESIDENT_BUSH_SR_DESC: "Aucun problème créé par l'homme n'est trop important pour être surmonté par l'ingéniosité humaine, l'énergie humaine et l'espoir infatigable de l'esprit humain.\n-George H.W. Buisson"
  SUPER_EVENT_PRESIDENT_MONDALE_DESC: "Nous croyons en un avenir solide, juste, empreint de compassion et plein d'espoir. C'est pourquoi je suis en politique. C'est pourquoi je me présente à la présidence.\n-Walter Mondale"
  SUPER_EVENT_PRESIDENT_ANDERSON_INDEPENDENT_DESC: "Le moment est venu d'arrêter de dire au peuple américain uniquement ce qu'il veut qu'il entende et de commencer à parler franchement des sacrifices que nous devons tous consentir.\n-John B.Anderson"   #Independent
  SUPER_EVENT_PRESIDENT_ANDERSON_GOP_DESC: "La seule façon d'y parvenir, de réduire les impôts, d'équilibrer le budget et d'augmenter les dépenses militaires, c'est d'utiliser des miroirs, et c'est ce qu'il faudrait.\n-John B.Anderson"  #Republican
  SUPER_EVENT_PRESIDENT_GINGRICH_DESC: "Mon style, c'est de rester offensif : prendre des risques, récupérer très vite quand on fait une erreur, mais continuer d'avancer.\n-Newt Gingrich"
  SUPER_EVENT_CULTURAL_REVOLUTION_DESC: "Il ne peut y avoir de coexistence pacifique dans le domaine idéologique. La coexistence pacifique corrompt.\n-Jiang Qing"
  SUPER_EVENT_BANGLADESH_LIBERATION_DESC: "Je vous ai donné l'indépendance, maintenant allez la préserver.\n-Cheikh Mujibur Rahman"
  SUPER_EVENT_PAKISTAN_1971_VICTORY_DESC: "Oui, il existe des circonstances dans lesquelles une répression sanglante est justifiable et justifiée.\n-Zulfikar Ali Bhutto"
  SUPER_EVENT_ASIAN_LIBERATION_WAR_DESC: "Les bons combattants d'autrefois se mettaient d'abord hors de toute possibilité de défaite, puis attendaient l'occasion de vaincre l'ennemi.\n-Sun Tzu"
  SUPER_EVENT_SMILING_BUDDHA_DESC: "Maintenant, je suis devenu la mort, la destructrice des mondes.\n-La Bhagavad Gita"
  SUPER_EVENT_INDIA_62_VICTORY_DESC: "Ceux qui sont prêts à mourir pour n'importe quelle cause sont rarement vaincus.\n-Jawaharlal Nehru"
  SUPER_EVENT_PRC_62_VICTORY_DESC: "La guerre ne peut être abolie que par la guerre, et pour se débarrasser des armes, il faut reprendre les armes.\n-Mao Zedong"
 SUPER_EVENT_PAKISTAN_65_VICTORY_DESC: "Allah a donné à l'armée pakistanaise l'occasion de montrer ses talents et ses compétences.\n-Ayoub Khan"
 SUPER_EVENT_INDIA_65_VICTORY_DESC: "Nous devons lutter pour la paix avec courage, comme nous avons combattu pendant la guerre.\n-Lal Bahadur Shastri"
 SUPER_EVENT_CHINESE_ANARCHY_DESC: "Tout sous le ciel est dans un chaos total ; la situation est excellente.\n-Mao Zedong"
 SUPER_EVENT_PROJECT_NATIONAL_GLORY_DESC: "Nous vivons dans le présent, nous rêvons du futur et nous apprenons des vérités éternelles du passé.\n-Chiang Kaï-chek"
 SUPER_EVENT_CMC_WW3_DESC: "Le troisième ange sonna de la trompette, et une grande étoile, flamboyante comme une torche, tomba du ciel sur un tiers des rivières et sur les sources d'eau, le nom de l'étoile est Absinthe.\n-Apocalypse 8 : 10-11"
 SUPER_EVENT_FORD_PRESIDENCY_DESC: "Un gouvernement assez grand pour vous donner tout ce que vous voulez est un gouvernement assez grand pour vous prendre tout ce que vous avez.\n-Gérald Ford"
 SUPER_EVENT_PRESIDENT_EARLY_REAGAN_DESC: "Toi et moi avons rendez-vous avec le destin. Nous préserverons pour nos enfants ce dernier espoir de l'homme sur terre, ou nous les condamnerons à faire le premier pas vers mille ans de ténèbres.\n-Ronald Reagan"
 SUPER_EVENT_PRESIDENT_EARLY_NIXON_DESC: "La défaite ne met pas fin à un homme, mais l'abandon le fait. Un homme n'est pas fini lorsqu'il est vaincu. Il a fini quand il s'arrête.\n-Richard Nixon"
 SUPER_EVENT_PRESIDENT_ROCKEFELLER_DESC: "Partout où nous regardons sur cette terre, les opportunités prennent forme dans les problèmes.\n-Nelson Rockefeller"
 SUPER_EVENT_PRESIDENT_AGNEW_DESC: "La liberté d'expression ne sert à rien sans la liberté de pensée.\n-Spiro Agnew"
 SUPER_EVENT_PRESIDENT_HALLECK_DESC: "Les Américains devraient vivre à nouveau comme Dieu a voulu que nous vivions et non comme un bureaucrate de Washington... voudrait que nous vivions.\n-Charles Halleck"
 SUPER_EVENT_PRESIDENT_MUSKIE_DESC: "Vous avez le droit que Dieu vous donne de bousculer le gouvernement, n'hésitez pas à le faire.\n-Edmond Muskie"
 SUPER_EVENT_BERLIN_WALL_DESC: "Berlin est le testicule de l'Occident. Quand je veux que l'Occident crie, je presse Berlin.\n-Nikita Khrouchtchev"
 SUPER_EVENT_MAO_DEATH_DESC: "Si Mao était mort en 1956, ses réalisations auraient été immortelles. S'il était mort en 1966, il aurait toujours été un grand homme, mais avec des défauts. Mais il est mort en 1976. Hélas, que dire ?\n-Chen Yun"
 SUPER_EVENT_PRESIDENT_WARREN_DESC: "Si c'est une erreur de la tête et non du coeur, ne vous inquiétez pas, c'est comme ça qu'on apprend.\n-Comte Warren"     
 SUPER_EVENT_PRESIDENT_STASSEN_DESC: "Celui qui allume les flammes de l'intolérance en Amérique allume un feu sous sa propre maison.\n-Harold Stassen"
 SUPER_EVENT_PRESIDENT_DEWEY_DESC: "Nous ne devons pas avoir peur de l'avenir, car l'avenir sera entre nos mains.\n-Thomas Dewey"
 SUPER_EVENT_PRESIDENT_HARRIMAN_DESC: "Aucune politique étrangère ne tiendra si le peuple américain ne la soutient pas. Et à moins que le Congrès ne le comprenne. Et si le Congrès ne le comprend pas, le peuple américain ne le comprendra pas.\n-Averell Harriman"
 SUPER_EVENT_PRESIDENT_MARTIN_DESC: "Après des années à vivre avec les réalités les plus froides, je crois toujours qu'on récolte ce qu'on sème et que semer la gentillesse est le meilleur de tous les investissements.\n-Joseph Martin"
 SUPER_EVENT_IRAQI_REVOLUTION_DESC: "Peuple, je suis le fils du peuple. Je m'engage devant Dieu à me sacrifier pour vous. J'offrirai ma vie pour défendre le peuple irakien.\n-Abd al-Karim Qasim"
 SUPER_EVENT_TURKISH_INVASION_DESC: "Chacun impose son système dans la mesure où son armée peut atteindre\n-Joseph Staline"
 SUPER_EVENT_SOVIET_MOON_LANDING_DESC: "Le premier satellite artificiel en orbite autour de la Terre s'appelait Spoutnik. La première créature vivante dans l'espace fut Laïka. La première fusée vers la Lune portait un drapeau rouge. La première photographie de la face cachée de la Lune a été réalisée avec un appareil photo soviétique. Si un homme tourne autour de la Terre cette année, son nom sera Ivan.\n-John F. Kennedy"
 SUPER_EVENT_SPUTNIK_DESC: "Le lancement des deux premiers Spoutniks soviétiques a déjà jeté un pont solide entre la terre et l'espace, et la voie vers les étoiles est ouverte.\n-Sergueï Korolev"
 SUPER_EVENT_NIXON_RESIGNATION_DESC: "Vous n'avez plus Nixon à votre disposition, car, messieurs, c'est ma dernière conférence de presse.\n-Richard Nixon"
 SUPER_EVENT_RFK_PRESIDENCY_DESC: "Chaque fois qu'un homme défend un idéal, ou agit pour améliorer le sort des autres, ou s'attaque à l'injustice, il envoie une petite ondulation d'espoir, et se croisant à partir d'un million de centres d'énergie différents et osant ces ondulations créent un courant qui peut balayer les plus puissants murs d'oppression et de résistance.\n-Robert F. Kennedy"
 SUPER_EVENT_HUNGARIAN_REV_CRUSHED_DESC: "La vie n'est qu'un suicide long et amer, et la foi seule peut transformer ce suicide en sacrifice.\n-Franz Liszt"
 SUPER_EVENT_HUNGARIAN_REV_SUCCESS_DESC: "On m'a appris que le chemin du progrès n'était ni rapide ni facile.\n-Marie Curie"
 SUPER_EVENT_PRESIDENT_JFK_DESC: "Ainsi, mes compatriotes américains ne vous demandent pas ce que votre pays peut faire pour vous, mais plutôt ce que vous pouvez faire pour votre pays. Mes concitoyens du monde ne demandent pas ce que l'Amérique fera pour vous, mais ce que nous pouvons faire ensemble pour la liberté de l'homme.\n-John F. Kennedy"
 SUPER_EVENT_EGYPTIAN_REVOLUTION_DESC: "Il n'y a plus d'issue à notre situation actuelle qu'en traçant un chemin vers notre objectif, par la violence et la force, au-dessus d'une mer de sang et sous un horizon flamboyant de feu.\n-Gamel Abdel Nasser"
 SUPER_EVENT_FAROUK_TRIUMPHANT_DESC: "Le monde entier est en révolte. Bientôt, il ne restera plus que cinq rois : le roi d'Angleterre, le roi de pique, le roi de trèfle, le roi de coeur et le roi de carreau.\n-Roi Farouk Ier"
 SUPER_EVENT_WOODSTOCK_DESC: "Au fil des années, Woodstock a été glorifié et romancé et est devenu l'événement symbolisant l'utopie. C'est la dernière page de notre mémoire collective de l'âge de l'innocence. Puis les choses ont mal tourné et ne seront plus jamais les mêmes.\n-Ang Lee"
 SUPER_EVENT_STALIN_DEATH_DESC: "Je sais qu'après ma mort, un tas d'ordures s'accumulera sur ma tombe, mais le vent de l'Histoire l'emportera tôt ou tard sans pitié.\n-Joseph Staline"
 SUPER_EVENT_GENSEC_KHRUSHEV_DESC: "Les politiques sont les mêmes partout : ils promettent de construire un pont là où il n'y a pas de rivière.\n-Nikita Khrouchtchev"
 SUPER_EVENT_GENSEC_BREZHNEV_DESC: "Pas question, quelles réformes ! J'ai même peur d'éternuer bruyamment. À Dieu ne plaise, un caillou roule, suivi d'une avalanche. Notre peuple ne sait pas... Ce que sont les relations capitalistes. La liberté économique apportera le chaos. « Ça va commencer. Massacrez-vous les uns les autres.\n-Léonid Brejnev"
 SUPER_EVENT_ZHUKOV_COUP_DESC: "Les jours de mes plus grandes joies coïncidaient avec les joies de la Patrie. L'inquiétude de la Patrie, ses pertes et ses chagrins m'ont toujours plus préoccupé que les miens personnels.\n-Gueorgui Joukov"
 SUPER_EVENT_APG_COUP_DESC: "Khrouchtchev s'est opposé à la politique stalinienne et léniniste. Il souhaitait des changements dans la politique léniniste menée par Staline et, en fin de compte, par tous ceux d'entre nous qui soutenaient Staline. Étant un homme de droite, Khrouchtchev était pourri de part en part.\n- Viatcheslav Molotov"
 SUPER_EVENT_GENSEC_KAGANOVICH_DESC: "Lorsque les gens ne savent pas comment passer de l'offense personnelle à l'entente nationale et entre tous les partis, cela mènera à l'enfer on ne sait où\n-Lazar Kaganovitch."
 SUPER_EVENT_MOON_LANDING_DESC: "Nous choisissons d'aller sur la Lune au cours de cette décennie et de faire d'autres choses, non pas parce qu'elles sont faciles, mais parce qu'elles sont difficiles, parce que cet objectif servira à organiser et à mesurer le meilleur de nos énergies et de nos compétences, parce que ce défi est un défi que nous sommes prêts à relever, un défi que nous ne voulons pas retarder et que nous avons l'intention de gagner, ainsi que les autres.\n-John F. Kennedy"
 SUPER_EVENT_PRESIDENT_WALLACE_DESC: "Au nom du plus grand peuple qui ait jamais foulé cette terre, je trace la ligne dans la poussière et je jette le gant aux pieds de la tyrannie, et je dis la ségrégation maintenant, la ségrégation demain et la ségrégation pour toujours.\n-George Wallace"
 SUPER_EVENT_PRESIDENT_RUSSELL_DESC: "Si nous devons recommencer avec un autre Adam et Ève, je veux qu'ils soient Américains, pas Russes.\n-Richard Russell Jr.."
 SUPER_EVENT_PRESIDENT_MACARTHUR_DESC: "Je suis préoccupé par la sécurité de notre grande nation ; non pas tant à cause d'une menace extérieure qu'à cause des forces insidieuses agissant de l'intérieur.\n-Douglas MacArthur"
 SUPER_EVENT_GERMAN_REUNIFICATION_DDR_DESC: "La victoire des travailleurs sur les exploiteurs et les esclavagistes est en même temps la lutte victorieuse du peuple allemand pour sa libération.\n-Walter Ulbricht"
 SUPER_EVENT_KOREAN_WAR_KPA_VICTORY_DESC: "Mon Dieu n'est autre que le peuple. Seules les masses populaires sont omniscientes, omnipotentes et toutes-puissantes sur terre. C'est pourquoi la devise de ma vie est : « Le peuple est mon Dieu ».\n-Kim Il-sung"
 SUPER_EVENT_KOREAN_WAR_DESC: "Nous sommes opposés à la ligne de compromis avec l'impérialisme. En même temps, nous ne pouvons pas tolérer que l'on se contente de crier contre l'impérialisme, mais qu'en réalité, on ait peur de le combattre.\n-Kim Il-sung"
 SUPER_EVENT_KOREAN_WAR_NUCLEAR_DESC: "La guerre est cruauté. Il ne sert à rien d'essayer de le réformer. Plus c'est cruel, plus vite ce sera fini.\n-William Tecumseh Sherman"
 SUPER_EVENT_CASTLE_BRAVO_DESC: "Je pense que le message le plus important que nous pourrions retenir de la photo de Castle Bravo est la quantité d'orgueil qu'elle représente\n-Alex Wellerstein."
 SUPER_EVENT_TSAR_BOMBA_DESC: "Qu'il y ait plus de maïs et plus de viande et qu'il n'y ait plus de bombes à hydrogène du tout.\n-Nikita Khrouchtchev"
 SUPER_EVENT_JFK_ASSASINATION_DESC: "Je dis qu'un meurtre est abstrait. Vous appuyez sur la gâchette et après vous ne comprenez plus rien de ce qui se passe.\n-Jean-Paul Sartre"
 SUPER_EVENT_SINO_SOVIET_WAR_DESC: "Qui sont nos ennemis et qui sont nos amis ? C'est la question primordiale d'une révolution et c'est aussi la question primordiale de la grande Révolution culturelle.\n-Mao Zedong"
 SUPER_EVENT_VIETNAM_WAR_DESC: "Si l'âme américaine est totalement empoisonnée, une partie de l'autopsie devra porter sur le Vietnam. Elle ne pourra jamais être sauvée tant qu'elle détruit les espoirs des hommes du monde entier.\n-Martin Luther King, Jr.." 
 SUPER_EVENT_PCF_FRANCE_DESC: "Sans la République, le socialisme est impuissant ; sans le socialisme, la République est vide.\n-Jean Jaurès, Parti Socialiste, Fondateur de la S.F.I.O et du Journal \"L'Humanité\"."
 SUPER_EVENT_MAOIST_FRANCE_DESC: "La pensée de Mao Tsé-toung marque une étape complètement nouvelle dans le développement du marxisme-léninisme. C'est le marxisme-léninisme de l'époque actuelle pour remodeler l'âme du peuple. C'est l'arme idéologique la plus puissante du prolétariat.\n-Lin Biao, ministre de la Défense de la RPC et vice-président du PCC" 
 SUPER_EVENT_SAMSON_OPTION_DESC: "Samson dit : « Laissez-moi mourir avec les Philistins ! » Puis il poussa de toutes ses forces, et le temple s'écroula sur les chefs et sur tout le peuple qui s'y trouvait. Ainsi, il en tua beaucoup plus en mourant que de son vivant.\nJuges 16:30"
 SUPER_EVENT_ANGOLAN_CIVIL_WAR_DESC: "L'histoire est parfaitement connue : depuis de nombreuses années, les impérialistes, lorsqu'ils ont compris qu'un jour cette colonie pourrait être libérée, ont commencé à organiser leurs mouvements. La province de Cabinda est riche en pétrole. C'est l'une des raisons pour lesquelles les impérialistes veulent avoir le pouvoir sur l'Angola. Ils ont organisé le FNLA en utilisant des gens de la CIA.\n-Fidel Castro"
 SUPER_EVENT_CUBAN_REVOLUTION_DESC: "Le premier devoir des révolutionnaires est de dire la vérité. Tromper les gens, promouvoir des illusions, entraîne toujours les pires conséquences, et je crois que les gens doivent être mis en garde contre un optimisme excessif. Comment l'Armée rouge a-t-elle gagné la guerre ? En disant la vérité. Comment la dictature a-t-elle perdu la guerre ? En trompant les soldats.\n-Fidel Castro"
 SUPER_EVENT_Portuguese_COLONIAL_WAR_DESC: "Les Nations Unies sont inutiles... Et aussi nuisibles. C'est une terre qui fleurit la démagogie avec un tas de pays nouveau-nés, dépourvus de toute tradition.\n-Antonio de Oliveira Salazar"
 SUPER_EVENT_RHODESIAN_UDI_DESC: "Je dirais que le colonialisme est une chose merveilleuse. Il a propagé la civilisation en Afrique. Avant cela, ils n'avaient pas de langue écrite, pas de roue telle que nous la connaissons, pas d'écoles, pas d'hôpitaux, pas même de vêtements normaux.\n-Ian Smith"
 SUPER_EVENT_VIETNAM_WITHDRAWL_DESC: "Car il semble aujourd'hui plus certain que jamais que l'expérience sanglante du Vietnam va se terminer par une impasse. Dire que nous sommes plus proches de la victoire aujourd'hui, c'est croire, face à l'évidence, les optimistes qui se sont trompés dans le passé.\n-Walter Cronkite"
 SUPER_EVENT_YEAR_ZERO_DESC: "Je n'ai pas rejoint le mouvement de résistance pour tuer des gens, pour tuer la nation. Regardez-moi maintenant. Suis-je une personne sauvage ? Ma conscience est tranquille.\n-Pot Pot"
 SUPER_EVENT_SIMBA_REBELLION_DESC: "Il y a un vieux dicton congolais selon lequel si l'on surveille le fleuve Congo assez longtemps, les corps de ses ennemis finiront par flotter. Kasavubu avait observé le fleuve Congo en tant que président au cours des cinq dernières années, au cours desquelles quatre premiers ministres étaient passés par là.\n-\"Le fou Mike\" Hoare"
 SUPER_EVENT_SOVIET_AFGHAN_WAR_DESC: "Nous n'avons pas poussé les Russes à intervenir, mais nous avons sciemment augmenté la probabilité qu'ils le fassent... Cette opération secrète était une excellente idée. Cela a eu pour effet d'entraîner les Soviétiques dans le piège afghan... Le jour où les Soviétiques ont officiellement franchi la frontière, j'ai écrit au président Carter : « Nous avons maintenant l'opportunité de confier à l'Union soviétique sa guerre du Vietnam.\n-Zbigniew Brzezinski"
 SUPER_EVENT_CONGO_CRISIS_DESC: "Sans dignité il n'y a pas de liberté, sans justice il n'y a pas de dignité et sans indépendance il n'y a pas d'hommes libres.\n-Patrice Lumumba"
 SUPER_EVENT_STEVENSON_52_DESC: "La tragédie de notre époque est le climat de peur dans lequel nous vivons, et la peur engendre la répression. Trop souvent, de sinistres menaces à la déclaration des droits et à la liberté d'esprit se cachent sous le couvert patriotique de l'anticommunisme.\n-Adlaï Stevenson II"
 Super_Event_Eisenhower_Presidency_desc: "Chaque arme fabriquée, chaque navire de guerre lancé, chaque roquette tirée signifie, en fin de compte, un vol sur ceux qui ont faim et ne sont pas nourris, sur ceux qui ont froid et ne sont pas habillés. Ce monde en armes ne dépense pas seulement de l'argent... Ce n'est pas du tout un mode de vie au sens propre du terme. Sous les nuages de la guerre, c'est l'humanité accrochée à une croix de fer.\n-Dwight D. Eisenhower"
 SUPER_EVENT_KEFVAUER_52_DESC: "Le libéralisme signifie un effort intelligent pour maintenir le développement politique et économique de notre nation à la hauteur des responsabilités qui découlent de l'ère atomique. Cela signifie une extension de l'utilisation de nos ressources pour le bien commun, la résolution du problème du maintien des principes démocratiques et de la libre entreprise compétitive à l'heure des grandes entreprises, des grands syndicats et des grands gouvernements.\n-Estès Kefauver"
 SUPER_EVENT_HASHEMITE_TWILIGHT_DESC: "Celui qui pense arrêter le soulèvement avant qu'il n'atteigne ses objectifs, je lui donnerai dix balles dans la poitrine.\n-Yasser Arafat"
 SUPER_EVENT_ARABIAN_REVOLUTION_DESC: "Une des plus fortes preuves naturelles de la folie du droit héréditaire chez les rois, c'est que la nature le désapprouve, autrement elle ne le tournerait pas si souvent en ridicule en donnant aux hommes un âne pour un lion.\n-Thomas Paine"
 SUPER_EVENT_BIDEN_VICTORY_DESC: "Aucun changement social fondamental ne se produit simplement parce que le gouvernement agit. C'est parce que la société civile, la conscience d'un pays, commence à se lever et à exiger - exiger - exiger un changement.\n-Joe Biden"
 SUPER_EVENT_NIXON_VICTORY_DESC: "La guerre froide n'est pas en train de dégeler ; il brûle d'une chaleur mortelle. Le communisme ne dort pas ; c'est, comme toujours, un complot, une intrigue, un travail, un combat.\n-Richard Nixon"
 SUPER_EVENT_MCGOVERN_DESC: "J'en ai marre des vieillards qui imaginent des guerres dans lesquelles les jeunes hommes risquent de mourir.\n-George McGovern"
 Super_Event_LBJ_Presidency_desc: "Le défi du prochain demi-siècle est de savoir si nous aurons la sagesse d'utiliser cette richesse pour enrichir et élever notre vie nationale et pour faire progresser la qualité de notre civilisation américaine...\n-Lyndon B. Johnson"
 Super_Event_President_Jerry_Brown_desc: "Mes principes sont simples. Protégez la Terre. Servir le peuple et explorer l'univers\n-Jerry Brun"
  Super_Event_Carter_Presidency_desc: "J'ai une vie et une chance de la faire valoir pour quelque chose... Ma foi exige que je fasse tout ce que je peux, où que je sois, quand je le peux, aussi longtemps que je le peux, avec tout ce que j'ai, pour essayer de faire une différence.\n-Jimmy Carter"
  Super_Event_Reagan_Presidency_desc: "La liberté n'est jamais à plus d'une génération de l'extinction. Nous ne l'avons pas transmis à nos enfants par voie sanguine. Il faut se battre pour cela, le protéger et le transmettre pour qu'ils fassent de même.\n-Ronald Reagan"
  Super_Event_Goldwater_Presidency_desc: "L'extrémisme dans la défense de la liberté n'est pas un vice. Et la modération dans la poursuite de la justice n'est pas une vertu.\n-Barry Goldwater"
  Super_Event_Humphrey_Presidency_desc: "On a dit un jour que le test moral du gouvernement était la manière dont il traitait ceux qui sont à l'aube de la vie, les enfants ; ceux qui sont au crépuscule de la vie, les personnes âgées ; et ceux qui sont dans l'ombre de la vie, les malades, les nécessiteux et les handicapés.\n-Hubert Humphrey"
  Super_Event_chernobyl_desc: "Il y a eu un accident à la centrale nucléaire de Tchernobyl. L'un des réacteurs nucléaires a été endommagé. Les conséquences de l'accident sont en train d'être réparées. Une assistance a été fournie à toutes les personnes touchées. Une commission d'enquête a été mise en place."
  Super_Event_Shanghai_Defence_desc: "La montée ou la chute de Shanghai signifie la naissance ou la mort de la nation entière.\n-Chiang Kaï-chek"
  SUPER_EVENT_PEACEFUL_REUNIFICAITON_DESC: "Paix, lutte, sauvez la Chine.\n-Dr. Sun Yat Sen"
  Super_Event_Red_Finland_desc: "Le communisme n'est pas quelque chose dont il faut se vanter. Seuls le travail et l'action montrent à quoi nous ressemblons. Être communiste en actes et pas seulement en paroles n'a pas été facile dans ce pays et ne le sera pas à l'avenir.\n-Ville Pessi, ancien secrétaire général du SKP"
  Super_Event_President_Omar_Dhani_desc: "Il n'y a pas d'amis ou d'ennemis permanents, seulement des intérêts, pas en politique !\n-Omar Dhani"
  SUPER_EVENT_NAZI_WGR_DESC: "Ce pour quoi nous devons lutter... c'est la liberté et l'indépendance de la patrie, afin que notre peuple puisse remplir la mission qui lui a été assignée par le Créateur.\n-Adolf Hitler"
  Super_Event_Liberian_Civil_War_desc: "Il existe ici un sentiment généralisé de perte, sinon toujours de Dieu, du moins du sens.\n-CharlesTaylor"
  SUPER_EVENT_CMC_WW3_FRA_DESC: "Soyons fermes, purs et fidèles ; au bout de notre douleur, il y a la plus grande gloire du monde, celle des hommes qui n'ont pas cédé.\n-Charles De Gaulle"
 Super_Event_SOV_Victory_Partial_DESC: "Lorsqu'il s'agit de guerre, tout doit être subordonné aux intérêts de la guerre, toute la vie intérieure du pays doit être subordonnée à la guerre, et la moindre hésitation n'est pas permise à ce sujet.\n-Vladimir Lénine" 
  Super_Event_Japans_Independence_quotes: "Même si nous avons été vaincus pendant la guerre, nous ne sommes pas devenus esclaves.\n-Jiro Shirasu"

