#2021 Stalin Notes Rework
StalinNotes.1.d:0 "Le Premier ministre soviétique Joseph Staline a révélé un plan pour une solution à la question allemande. La division continue de l'Allemagne et l'occupation alliée risquent de transformer l'Allemagne de l'Ouest en une puissance militaire majeure pour l'Occident. L'Allemagne de l'Est n'a pas actuellement la main-d'oeuvre et le développement industriel de l'Allemagne de l'Ouest. Le dirigeant soviétique a déclaré son intention de remettre une note diplomatique aux puissances occidentales proposant une conférence de paix pour déterminer l'unification d'une Allemagne démocratique, à condition qu'elle reste complètement neutre et avec un minimum de défense. Ceci avec d'autres conditions comme la frontière de Potsdam. Une Allemagne neutre pourrait devenir un État tampon clé et priver l'Occident d'un allié potentiel. Cependant, avant d'envoyer la note, les Soviétiques doivent décider s'ils peuvent faire confiance à l'Occident ou à l'Allemagne pour respecter les termes du traité."
StalinNotes.2.d:0 "L'Union soviétique a récemment envoyé une note appelant à une conférence de paix entre les puissances occupantes en Allemagne pour régler les détails d'un État allemand unifié. Les Soviétiques insistent sur le fait qu'une Allemagne unifiée doit être neutre et avoir des frontières à Potsdam, entre autres conditions. Les conditions semblent généreuses et une Allemagne neutre pourrait constituer un tampon utile. Cependant, les promesses démocratiques n'incluent pas de garantie d'élections libres et nos alliés estiment également que l'Allemagne doit participer après des élections nationales libres. Nous devrions peut-être envoyer une réponse détaillant nos points de vue et appeler à de nouvelles discussions avec les Soviétiques sur la question, en particulier sur ce que signifie même une stricte neutralité. L'offre soviétique pourrait aussi n'être qu'un stratagème communiste, auquel cas elle devrait être catégoriquement rejetée."
StalinNotes.3.d:0 "Les puissances occidentales, comme on pouvait s'y attendre, en ajoutant leurs propres termes et conditions, veulent en particulier un vote supervisé par l'ONU avant la conférence de paix afin que l'Allemagne puisse y participer. Ils ont également exprimé des réserves quant à la neutralité allemande, arguant qu'elle viole la souveraineté allemande et s'opposent à la frontière de Potsdam comme étant absolue. Nous devons répondre à cette note et définir notre approche pour dialoguer avec l'Occident dans les communications ultérieures. Une approche pourrait consister à céder aux conditions occidentales, sauf sur la neutralité. L'autre approche consiste à tenter de parvenir à un compromis avec l'Occident sur cette question. Enfin, la résistance occidentale indique qu'elle tentera probablement de manipuler le résultat et que nous devrions simplement laisser mourir cet effort."
StalinNotes.4.d:0 "Nous avons échangé de nouvelles notes avec l'Union soviétique sur la question de l'unification allemande. Il semble que les Soviétiques soient prêts à faire des compromis et à parvenir à un véritable accord. Cependant, il est clair qu'ils se battront durement pour défendre leurs intérêts si nous choisissons cette voie. L'autre approche consiste à reconnaître le plan soviétique comme un stratagème visant à affaiblir la défense de l'Europe occidentale et, s'ils sont sérieux, ils doivent accepter entièrement nos conditions préalables aux négociations. Enfin, si tout cet exercice apparaît comme un stratagème de propagande, nous pouvons mettre un terme aux discussions."
StalinNotes.5.d:0 "Les puissances occidentales continuent de s'opposer à nos conditions légitimes pour un État allemand unifié et acceptable. Il est clair que leur résistance à un État démocratique et neutre reflète leur sombre ambition de transformer l'Allemagne en une machine de guerre capitaliste. Cependant, si nous sommes convaincus que la gauche peut triompher lors d'élections nationales avant la conférence, même si les conditions préalables sont remplies, l'État allemand travaillera avec nous et nous pourrons retourner la conférence contre lui. Si les risques sont trop élevés que les élections se déroulent à droite, nous risquons de perdre toute l'Allemagne au profit de l'Occident."
StalinNotes.6.d:0 "Des représentants de l'Union soviétique, des États-Unis, de la France et de la Grande-Bretagne se réunissent lors d'une conférence à Dresde pour discuter de l'unification allemande. La conférence a eu lieu après que l'Union soviétique a proposé de tenir une conférence de paix finale pour déterminer une solution au problème de l'Allemagne. Beaucoup en Occident sont prudemment optimistes quant aux négociations potentielles, car les Soviétiques ont promis de respecter les pratiques démocratiques, y compris la multiplicité des partis politiques et les droits individuels. Cependant, certains craignent que les Soviétiques cherchent à établir un État tampon allemand faible pour protéger ses frontières et affaiblir les efforts visant à former une défense robuste en Europe occidentale."
StalinNotes.7.d:0 "Les puissances alliées et l'Union soviétique ont convenu de former un gouvernement d'unification. Le cabinet sera divisé entre des politiciens conservateurs et de gauche pour le partage du pouvoir. Une disposition similaire sera prise pour le parlement allemand. Une division politique égale garantit qu'un consensus est nécessaire pour adopter une législation et maintiendra les extrêmes politiques à distance. Des grognements se font entendre en Allemagne de l'Ouest selon lesquels les Alliés sacrifient les principes démocratiques et donnent du pouvoir aux communistes qui ne jouissent pas d'une grande popularité dans toute l'Allemagne."
StalinNotes.8.d:0 "Lors d'une des discussions les plus controversées, les quatre puissances ont annoncé que le nouvel État allemand unifié se conformerait géographiquement aux dispositions de la Conférence de Potsdam. L'accord déplace effectivement la frontière orientale vers la ligne Oder-Niesse, abandonnant ainsi une grande partie de la frontière allemande de 1937. L'Allemagne de l'Ouest s'est longtemps opposée à cette disposition, mais les puissances occupantes l'ont acceptée. Un diplomate américain a déclaré en privé aux journalistes que la frontière était effectivement déjà une réalité et que l'inverser entraînerait trop de désordre."
StalinNotes.9.d:0 "Dans le cadre d'une avancée majeure, les quatre puissances occupantes ont convenu qu'une Allemagne unifiée serait strictement neutre sur le plan international et aurait un caractère démocratique. L'Allemagne ne peut rejoindre ni les alliances militaires occidentales ni celles de l'Est et est libre de participer à n'importe quel marché commercial. Dans le cadre d'un compromis avec les Américains, la nouvelle Allemagne est autorisée à rejoindre les Nations Unies et à y participer, mais ne sera pas autorisée à déployer une force militaire ni à mener des actions contre l'une des puissances occupantes. La nouvelle Allemagne peut également maintenir une armée, mais seulement une force nécessaire à une défense raisonnable et à une sécurité intérieure. L'Union soviétique a insisté sur le fait qu'aucune élection ne devrait avoir lieu pour maintenir l'équilibre des pouvoirs. Cependant, les États-Unis affirment qu'une société démocratique nécessite des élections. Il a été convenu que le gouvernement d'unification déterminerait si les élections seraient autorisées."
StalinNotes.10.d:0 "Dans un accord historique, les États-Unis, la France, la Grande-Bretagne et l'Union soviétique ont convenu du règlement final sur l'unification allemande. Conformément à l'accord, l'Allemagne de l'Ouest et l'Allemagne de l'Est doivent organiser un nouveau gouvernement d'unification pour diriger une Allemagne unie. L'Allemagne devrait rester strictement neutre, se conformer aux frontières de Potsdam et garantir les droits démocratiques. Même si de nombreux Allemands accueillent favorablement cette nouvelle, certains s'inquiètent des frontières et du pouvoir du parti communiste dans l'accord de partage du pouvoir."
StalinNotes.11.d:0 "Les États-Unis, la Grande-Bretagne et la France insistent pour que nous formions un gouvernement d'unité, comme le prévoit leur accord avec l'Union soviétique. Beaucoup dans le pays sont en colère contre le fait que les Allemands ne soient pas représentés aux négociations. En outre, l'État proposé aura les frontières controversées de Potsdam et nous obligera à travailler avec le régime communiste d'Allemagne de l'Est, qui ne le reconnaît pas comme légitime. Nos sympathisants aux États-Unis nous ont discrètement informés que si nous refusions de créer le gouvernement d'unification, ils soutiendraient l'annulation du traité. Cependant, de nombreux Allemands soutiennent également l'accord, estimant que ses avantages l'emportent sur les préoccupations concernant les frontières et le partage du pouvoir."
StalinNotes.12.d:0 "Le gouvernement ouest-allemand a exprimé son opposition au récent accord des puissances occupantes sur l'unification de l'Allemagne. Ils citent comme principale préoccupation l'absence de toute participation d'un représentant élu du peuple allemand. En outre, les conditions d'un État neutre mettent en danger la sécurité et l'avenir économique de l'Allemagne. Plus important encore, le gouvernement d'unification et l'absence de garantie d'élections libres, même avec une garantie des droits démocratiques, sont désagréables pour le peuple démocratique d'Allemagne. Le gouvernement a ajouté qu'il ne reconnaissait pas le régime illégal en Allemagne de l'Est et qu'il n'ouvrirait aucune discussion avec lui. Les États-Unis n'ont d'autre choix que de retirer leur soutien au traité et de soutenir l'Allemagne de l'Ouest."
StalinNotes.13.d:0 "Le récent accord concernant l'unification avec l'Allemagne semble avoir échoué. Le gouvernement de l'Allemagne de l'Ouest a refusé d'accepter les termes du traité et ne rencontrera pas les responsables est-allemands, qu'il ne reconnaît pas. Suite à cette annonce, les États-Unis, ainsi que la Grande-Bretagne et la France, ont annoncé qu'ils n'obligeraient pas l'Allemagne de l'Ouest à se conformer aux termes de l'accord. Cela signifie en réalité que tous les efforts soviétiques pour résoudre la question de l'unification allemande ont échoué. Les Soviétiques expriment leur indignation et accusent l'Occident de militariser l'Europe. Les Soviétiques sont largement félicités pour avoir pris position sur la question, tandis que les États-Unis sont critiqués pour avoir négocié un accord, avant de faire marche arrière."
StalinNotes.14.d:0 "Après des discussions tendues, les responsables de l'Allemagne de l'Ouest et de l'Est se sont mis d'accord sur la formation d'un gouvernement d'unification. Les postes clés du cabinet seront partagés et les sièges du Parlement seront répartis entre les partis. Un équilibre cinquante-cinquante entre partis de droite et de gauche sera établi. Cela devrait garantir la neutralité allemande et la menace d'une prise du pouvoir par un homme fort. L'État allemand neutre a reçu des informations selon lesquelles les troupes d'occupation commençaient à se retirer du pays. Le premier débat législatif porte sur la question de savoir si l'Allemagne doit organiser des élections libres à l'avenir. Une future constitution déterminera la composition future ou les politiques électorales du domaine."
StalinNotes.15.d:0 "L'accord entre les puissances occupantes stipulait que l'Allemagne adopterait les valeurs démocratiques, mais la décision d'élections libres était laissée au gouvernement allemand. Les Soviétiques se sont opposés aux élections libres, préférant plutôt un système dans lequel plusieurs partis obtenaient des sièges et pouvaient y placer les membres de leur choix. L'équilibre entre les partis et l'idéologie préserverait la neutralité et des élections libres pourraient détruire cet équilibre. Les puissances occidentales estiment que les droits démocratiques ne sont efficaces que si les citoyens ont le droit de voter. Le vote permet au peuple de choisir ses représentants et de punir les dirigeants qui échouent. Le Parlement et le cabinet doivent décider s'ils acceptent de futures élections générales ou maintiennent le gouvernement actuel jusqu'à ce qu'une solution puisse être trouvée ultérieurement."
StalinNotes.16.d:0 "Il y a un sentiment d'immense enthousiasme alors que les observateurs de l'ONU commencent à s'installer dans les villes d'Allemagne de l'Ouest et d'Allemagne de l'Est. Les deux États organiseront des élections nationales pour établir un gouvernement d'unité avant de tenir des pourparlers de paix avec les puissances occupantes pour décider de l'unification définitive de l'Allemagne. Les forces militaires soviétiques et occidentales présentes dans le pays devraient rester dans leurs casernes jusqu'à la tenue des élections. Cela s'inscrit dans la continuité d'un processus de paix initié par l'Union soviétique pour résoudre la question allemande."
StalinNotes.17.d:0 "Pour la première fois depuis des années, le peuple allemand se rendra aux urnes lors d'élections libres. Tous les grands partis politiques ont été autorisés à faire campagne en Allemagne de l'Ouest et de l'Est. Les scrutins seront supervisés par les membres des Nations Unies de nombreux pays. Les forces militaires soviétiques, américaines, françaises et britanniques sont toutes dans leurs casernes et les véhicules militaires sont interdits de circulation le jour des élections. Des journalistes du monde entier sont venus assister à ces élections historiques. L'Europe entière semble retenir collectivement son souffle en attendant les résultats."
StalinNotes.18.d:0 "Les élections organisées par les Nations Unies en Allemagne de l'Ouest et de l'Est se sont déroulées dans le calme. Des millions d'Allemands se sont rendus aux urnes pour déterminer l'avenir de leur nation. Les élections attirent une intense attention internationale. Pour les Européens, le succès de ces élections et le nouveau gouvernement d'union mèneront l'Allemagne dans des négociations de paix avec les puissances occupantes. L'ONU prévoit de publier les résultats une fois que tous les votes auront été calculés. L'Union soviétique et les États-Unis sont félicités pour leur initiative et leur respect des élections."
StalinNotes.19.d:0 "Les Nations Unies ont récemment déclaré que la coalition de gauche, dirigée par le Parti socialiste unifié d'Allemagne, avait remporté les élections. Il dirigera la délégation allemande pour les pourparlers de paix. Les résultats ont surpris les États-Unis et leurs alliés européens, qui pensaient que le parti ne serait pas en mesure de rivaliser efficacement dans toute l'Allemagne. L'Union soviétique salue ce résultat comme une indication du désir allemand de paix par le socialisme. De nombreux analystes estiment que cela fera pencher la balance en faveur des positions soviétiques lors de la Conférence de paix pour l'unification allemande."
StalinNotes.21.d:0 "L'actuelle Conférence de paix sur l'unification de l'Allemagne a abouti à un accord sur les frontières de l'Allemagne. Les gouvernements soviétique et allemand se sont tous deux mis d'accord sur le respect des frontières établies par la Déclaration de Potsdam. Bien que de nombreux Allemands s'opposent à la frontière, il a été reconnu que les zones frontalières ont déjà changé et que l'inverser maintenant pourrait provoquer des troubles. Les autres participants ont finalement été convaincus sur la question."
StalinNotes.22.d:0 "Le monde a accueilli favorablement la nouvelle de la signature d'un traité de paix final sur l'unification de l'Allemagne. Les puissances occidentales sont satisfaites de la garantie des droits démocratiques pour les nouveaux Etats allemands. Les Soviétiques considèrent la neutralité exigée de l'Allemagne comme un succès majeur. Une Allemagne neutre offre un État tampon entre les deux alliances. Les Allemands seraient enthousiasmés par l'accord, même s'il existe une certaine controverse concernant les frontières définitives établies par l'accord."
StalinNotes.23.d:0 "La coalition des partis conservateurs nouvellement élue participe à la Conférence de paix sur l'unification de l'Allemagne qui se tient avec les puissances occupantes actuelles. Le Parti chrétien-démocrate est le plus important de la coalition et devrait poursuivre la restauration de la frontière de 1937 et garantir les droits démocratiques. L'Union soviétique voudra minimiser l'armée allemande et sa neutralité sur les questions européennes et mondiales."
StalinNotes.24.d:0 "La conférence de paix en cours sur l'unification allemande a convenu de la politique étrangère et militaire d'une Allemagne unie. Même si les Soviétiques voulaient que l'Allemagne reste neutre en permanence et qu'il n'y ait pas d'élections pour garantir un gouvernement équilibré, ils ont été persuadés de faire des compromis. L'Allemagne restera soumise à des restrictions militaires et de neutralité pendant quinze ans. Même après la levée des restrictions, l'Allemagne doit accepter d'être prudente en matière de politique étrangère. Le flou du langage est considéré comme un avantage pour l'Allemagne une fois les restrictions levées."
StalinNotes.25.d:0 "Constituant une avancée majeure, les participants à la Conférence de paix sur l'unification de l'Allemagne ont accepté un accord sur les frontières allemandes. L'Union soviétique cherchait à maintenir la division territoriale convenue à Potsdam, mais ne parvenait pas à vaincre la pression des Alliés et de l'Allemagne sur cette question. Les Soviétiques ont accepté de restituer Kalingrad et ses environs à l'Allemagne. Il s'agit d'une victoire majeure pour le gouvernement allemand et elle sera accueillie favorablement par le peuple allemand. La Pologne et l'Union soviétique ne seront pas satisfaites de ce résultat, même si les Soviétiques ont promis de remettre l'administration du territoire restitué aux Allemands. Les États-Unis ont soutenu cet effort visant à pousser le tampon neutre dans davantage d'espace soviétique."
StalinNotes.26.d:0 "Le monde a accueilli avec satisfaction la nouvelle selon laquelle les puissances occupantes et l'Allemagne avaient signé un accord final sur l'unification de l'Allemagne. L'accord prévoit une période de neutralité et de démilitarisation ainsi que des droits démocratiques garantis pour tous les citoyens allemands. Les puissances occidentales sont très satisfaites des résultats et de nombreux Européens considèrent que cet accord réduit les tensions à travers le continent. Les Soviétiques seront satisfaits de la neutralité et de l'établissement de l'Allemagne comme État tampon, mais son statut temporaire pourrait poser des problèmes une fois ceux-ci levés."
StalinNotes.27.d:0 "Les forces d'occupation soviétiques, américaines, britanniques et françaises supervisent actuellement la préparation des élections nationales en Allemagne de l'Ouest et de l'Est. Le gouvernement qui en résultera représentera l'Allemagne à la prochaine Conférence de paix sur l'unification de l'Allemagne. Les Soviétiques avaient initialement cherché à tenir la conférence sans la participation allemande, mais ont conclu un compromis avec l'Occident à condition que les élections soient organisées par les puissances occupantes. Les puissances occidentales ont demandé aux Nations Unies de superviser les élections mais ont accepté la demande soviétique. On dit que les Allemands sont très enthousiastes à l'idée de ces élections."
StalinNotes.28.d:0 "L'Union soviétique supervisera les élections dans sa zone d'occupation allemande afin de déterminer quel gouvernement représentera l'Allemagne à la Conférence de paix prévue sur l'unification allemande. Les élections sont dans des mois et déjà les partis politiques font campagne. Il n'y a aucun moyen de prédire le résultat. Nous pourrions laisser le peuple allemand décider lors d'élections, mais une proposition a été soumise pour garantir le succès du Parti de l'Union socialiste. Les services de renseignement locaux et les forces militaires peuvent garantir le succès électoral, mais l'Allemagne de l'Ouest compte encore une population plus importante. Pour contrer cela, nous pouvons transférer plus d'un million d'Allemands de souche vivant en RSS du Kazakhstan. Ils pourraient potentiellement s'installer près de Kaliningrad."
StalinNotes.29.d:0 "Il existe des rapports et des rumeurs faisant état d'une activité ferroviaire accrue en Allemagne de l'Est. Plus précisément, il semble que des milliers de nouveaux Allemands arrivent dans le pays. Les autorités soviétiques placent ces personnes dans des camps temporaires, des rumeurs courent qu'elles pourraient éventuellement être installées dans les environs et à Kaliningrad. D'après les rapports des services de renseignement, l'origine de ces Allemands semble être la RSS kazakhe. Les Soviétiques transfèrent l'importante population ethnique allemande vers l'Allemagne, sans doute pour ajouter des milliers de voix aux prochaines élections en faveur de leurs clients communistes. Le secret soviétique et le refus de commenter cette population indiquent un schéma plus large de manipulation électorale potentielle.\n Les élections doivent être surveillées de près."
StalinNotes.30.d:0 "Les élections pour désigner un gouvernement national qui représentera l'Allemagne à la prochaine conférence de paix sur l'unification allemande auront lieu dans les semaines à venir. Les journalistes d'Allemagne de l'Est remarquent qu'au milieu de la campagne politique, un grand nombre d'Allemands arrivent d'Union soviétique. Il semble que les autorités soviétiques transfèrent vers le pays les Allemands de souche déportés pendant la guerre afin de participer aux élections. Les autorités soviétiques ont refusé de commenter la question et les observateurs occidentaux expriment leur inquiétude sur le fait qu'il s'agit d'un complot soviétique visant à manipuler les résultats en faveur du Parti socialiste unifié."
StalinNotes.31.d:0 "Les résultats des récentes élections nationales en Allemagne de l'Ouest et de l'Est montrent une augmentation remarquable du soutien au Parti communiste de l'Union socialiste. Les détails arrivent encore, mais il semble que les communistes aient été interrogés exceptionnellement en Allemagne de l'Est. Les gains des gauchistes en Allemagne de l'Ouest indiquent que le gouvernement final sera probablement une coalition de partis de gauche dirigée par le parti communiste. Les puissances occidentales et le gouvernement ouest-allemand s'interrogent sur les résultats et des réunions d'urgence ont lieu dans ces capitales. L'Union soviétique a salué les résultats et a appelé tous les partis à respecter les résultats électoraux. La décision soviétique de renvoyer les Allemands de souche déportés et de céder certains territoires à l'Allemagne de l'Est aurait joué un rôle crucial dans les résultats."
StalinNotes.32.d:0 "Nos rapports de renseignement sur le terrain, les rapports des médias et les données électorales indiquent qu'il y a probablement eu une fraude électorale généralisée dans la zone d'occupation soviétique. Ces résultats garantissent qu'un gouvernement allemand de gauche représenterait l'Allemagne à la future conférence. Cela donnera aux Soviétiques une position de force pour les négociations. Nous pouvons retirer notre soutien à la conférence et aux élections, mettant ainsi fin aux récents efforts de paix. Même si les Soviétiques s'en plaindront, cela sera probablement bien accueilli par nos alliés et par de nombreux Allemands. Cependant, il est peut-être dans notre intérêt de laisser la conférence de paix se poursuivre, même si les représentants allemands sont pro-soviétiques, ils auront toujours leurs propres intérêts nationaux sur certaines questions. La décision des Soviétiques de renvoyer les déportés allemands et de céder des terres à l'Allemagne de l'Est a renforcé le soutien aux socialistes en Allemagne de l'Ouest."
StalinNotes.33.d:0 "Les résultats des élections montrent une victoire de la gauche dans les sondages nationaux. Le Parti communiste en particulier s'est très bien comporté. Des rapports, y compris ceux des médias, indiquent que les forces d'occupation soviétiques, supervisant les élections en Allemagne de l'Est, se sont engagées à manipuler les bulletins de vote pour assurer une victoire communiste. Les communistes devraient gouverner avec d'autres partis de gauche et diriger l'Allemagne à la conférence de paix. Cela atténuerait leur caractère pro-soviétique. Cependant, il est clair que les élections ne sont pas authentiques et nous pouvons facilement refuser de poursuivre le processus. Les Américains, les Français et les Britanniques ont tous exprimé leur soutien si nous choisissons de mettre fin au processus. La décision des Soviétiques de renvoyer les déportés allemands et de céder des terres à l'Allemagne de l'Est a renforcé le soutien aux socialistes en Allemagne de l'Ouest."
StalinNotes.34.d:0 "Les puissances occidentales et l'Allemagne de l'Ouest ont refusé de poursuivre les négociations de paix à la suite des récentes élections. L'Union soviétique est accusée d'avoir truqué les élections en Allemagne de l'Est pour garantir une poussée communiste. Sans résultat légitime, le peuple allemand ne peut être correctement représenté. L'Union soviétique critique vivement l'Occident pour avoir saboté l'effort de paix parce que les élections ne se sont pas déroulées en sa faveur. L'Allemagne de l'Ouest affirme que les élections prouvent l'illégitimité du régime est-allemand."
StalinNotes.35.d:0 "Les médias du monde entier ont rendu compte avec enthousiasme des récentes élections qui se sont déroulées en Allemagne de l'Ouest et de l'Est. Malgré les appréhensions suscitées par le vote en Allemagne de l'Est, tout indique que les Allemands ont pu voter librement. Les principaux partis politiques d'Allemagne de l'Ouest et de l'Est ont été autorisés à faire campagne librement. Toutes les puissances occupantes, Allemands et Européens, suivront attentivement les résultats. La coalition gagnante dirigera la délégation allemande lors de la prochaine conférence de paix visant à finaliser l'unification de l'Allemagne. Le Parti chrétien-démocrate et le Parti de l'Union socialiste devraient être les deux grands vainqueurs de l'élection."
StalinNotes.36.d:0 "Une coalition de partis conservateurs a remporté les récentes élections organisées en Allemagne de l'Ouest et de l'Est. Le nouveau gouvernement dirigera l'Allemagne à la conférence de paix. Les Soviétiques ne seront pas satisfaits des résultats, mais devraient pousser à un compromis en sa faveur. Les puissances alliées espèrent qu'un gouvernement allemand amical pourra les aider à faire avancer leurs objectifs dans le cadre des discussions. Les Allemands suivront avec attention les progrès des négociations et espèrent une Allemagne unie et pacifique."
StalinNotes.37.d:0 "La Conférence de paix sur l'unification allemande a convenu de restaurer une partie de la frontière orientale de l'Allemagne en échange d'une politique étrangère stricte. Il n'y aura aucune restriction sur l'armée allemande, mais on s'attend à ce que l'Allemagne maintienne une armée pour sécuriser ses frontières et préserver la paix intérieure. L'Union soviétique a cherché à maintenir les frontières établies par les accords de Potsdam, mais a été contrainte de faire des compromis afin de préserver la neutralité allemande permanente. La Pologne sera probablement mécontente de cet arrangement, mais les Soviétiques ont promis de rendre l'administration des territoires au gouvernement allemand. Le gouvernement allemand n'a pas obtenu toutes ses revendications territoriales, mais a réussi à obtenir Kalingrad et ses environs."
StalinNotes.38.d:0 "La conférence de paix en cours sur l'unification allemande a convenu de préserver les droits démocratiques et individuels de tous les Allemands. La question des élections libres doit être votée par le peuple allemand après la conférence. Les puissances occidentales voulaient des élections libres garanties, mais les Soviétiques voulaient un gouvernement permanent partageant le pouvoir pour maintenir l'équilibre politique dans le pays. Le référendum laissera le peuple allemand décider de la question."
StalinNotes.39.d:0 "Le gouvernement conservateur allemand et les puissances occupantes ont signé un accord final sur l'unification de l'Allemagne. Le traité exige une stricte neutralité pour l'Allemagne et une garantie des droits démocratiques. La question des élections libres sera résolue par un référendum national. Plus important encore, les signataires ont convenu de restaurer certaines des frontières allemandes d'avant la Seconde Guerre mondiale. L'accord n'est entièrement satisfaisant pour aucune des parties, mais les puissances alliées ont réussi à garantir une Allemagne démocratique. L'Union soviétique a réussi à garantir la neutralité du nouvel État allemand, en lui fournissant une zone tampon et en refusant aux États-Unis l'accès à la puissance industrielle ou militaire potentielle de l'Allemagne."
StalinNotes.40.d:0 "Les Allemands de tout le pays se sont rendus aux urnes pour décider si le pays organiserait des élections libres. Le traité récemment conclu garantit les droits démocratiques et individuels. Cependant, la question des élections libres n'a pas été résolue. Les partisans soutiennent que les élections libres constituent un élément important de toute démocratie. Cependant, les opposants soutiennent qu'une future constitution devrait garantir une répartition équilibrée des sièges pour toutes les idéologies politiques. Cela empêcherait une idéologie de dominer et contribuerait à maintenir la neutralité. Les experts en la matière affirment qu'il n'existe aucune indication claire du côté qui gagnera."
StalinNotes.41.d:0 "Les récentes élections nationales ont abouti à la victoire d'une coalition de partis de gauche. Le Parti de l'Union Socialiste est le plus grand parti de la coalition. Le résultat est salué par l'Union soviétique et ses experts estiment que cela l'aidera dans les prochaines négociations de paix sur l'unification de l'Allemagne avec les puissances occupantes. Même si les puissances occidentales seront déçues, il est entendu que la coalition sera soucieuse des intérêts nationaux d'un État allemand indépendant et uni."
StalinNotes.42.d:0 "La Conférence de paix pour l'unification allemande est parvenue à un compromis sur les frontières de l'Allemagne. En échange d'une acceptation des frontières de l'accord de Potsdam en échange d'une neutralité temporaire. L'accord frontalier satisfait l'Union soviétique et la Pologne. Pour l'Occident, l'accord de neutralité temporaire ouvre la possibilité d'un État allemand pro-occidental dans le futur. L'Allemagne doit rester strictement neutre pendant quinze ans avant que les restrictions ne soient levées."
StalinNotes.44.d:0 "Les puissances occupantes et l'Allemagne ont signé un accord final sur la question de l'unification allemande. Le traité résout un certain nombre de questions concernant la frontière définitive, les droits démocratiques et la neutralité de l'État allemand. Ni les occupants alliés ni l'Union soviétique ne sont entièrement satisfaits des résultats. Toutefois, les compromis obtenus devraient préserver la paix non seulement en Allemagne mais aussi en Europe. La communauté internationale salue largement les résultats et félicite les États participants pour leur capacité à parvenir à un accord."
StalinNotes.45.d:0 "Le Parlement allemand discute actuellement de la question de savoir si des élections libres devraient faire partie d'une future constitution allemande. Les partisans des élections soutiennent que les droits démocratiques garantis par le récent traité ne peuvent être légitimés que par la tenue d'élections. Les opposants estiment que l'Allemagne doit établir un équilibre des pouvoirs politiques pour préserver la neutralité et garantir qu'aucun homme fort ou parti radical n'acquière jamais le pouvoir. Les débats s'annoncent animés et intenses."
StalinNotes.46.d:0 "L'Occident, en particulier les États-Unis, a réagi à nos véritables efforts de paix par des machinations et des contre-offres impossibles. Ils ont révélé leurs objectifs bellicistes. L'Occident souhaite réarmer l'Allemagne en tant que puissance militaire pour l'aider dans son ambition de renverser les régimes socialistes d'Europe de l'Est. Des éléments de la presse allemande font état de nos conditions généreuses et de l'implication américaine dans son échec. Le gouvernement est-allemand a exprimé sa satisfaction quant à nos efforts pour parvenir à une paix durable."
StalinNotes.47.d:0 "L'échange de notes entre l'Union soviétique et les puissances occupantes allemandes a échoué. Les Américains affirment que les Soviétiques n'ont jamais été authentiques et n'ont fait que donner l'impression qu'ils étaient intéressés par une paix juste pour l'Allemagne. Bien que de nombreux membres de notre gouvernement soient d'accord avec cette évaluation, un nombre croissant de responsables et de médias suggèrent que l'échec des négociations pourrait être une opportunité perdue. Cela a suscité un certain mécontentement parmi les Allemands, mais dans l'ensemble, nous ne nous attendons pas à ce que cela se traduise par des protestations publiques ou des expressions de colère."
StalinNotes.48.d:0 "Les notes échangées entre l'Union soviétique et nos alliés se sont soldées par un échec. Les Soviétiques semblaient proposer des conditions généreuses pour une Allemagne unifiée, mais nos efforts pour négocier et pousser les discussions plus loin ont été repoussés. Il est clair que les Soviétiques utilisaient simplement ces discussions comme outil de propagande et comme moyen de légitimer leur régime illégal en Allemagne de l'Est. Même si nos alliés et notre peuple acceptent ces faits, de nombreux Allemands pensent que c'est de notre faute si les négociations ont échoué. Il faudra un certain temps pour reconstruire les relations, mais ils finiront par reconnaître la duplicité communiste telle qu'elle était."
StalinNotes.49.d:0 "Les efforts énergiques déployés par l'Union soviétique pour parvenir à une solution juste à la question de l'unification allemande et de la paix n'ont pas abouti. L'Occident a réagi négativement et a activement veillé à l'échec de cet effort. Ils l'ont fait en formulant des exigences scandaleuses et en répandant des rumeurs qui sapaient la sincérité des Soviétiques. L'Allemagne de l'Ouest a montré son vrai visage en tant que marionnette américaine en suivant sa propagande. En fin de compte, tous les Allemands ont compris qu'un camp recherchait la paix tandis que l'autre choisissait de poursuivre l'escalade des tensions."
StalinNotes.57.d:0 "Nos récents efforts pour rechercher une paix définitive sur l'Allemagne ont pris fin lorsque l'Occident a abandonné ses efforts alors qu'il semblait qu'ils n'obtiendraient pas une victoire totale dans les négociations de paix. Dans notre quête de la paix, nous avons renvoyé un million de déportés allemands de la RSS kazakhe. Ces rapatriés ont été envoyés à Kaliningrad et dans les régions de Silésie auparavant administrées par la Pologne. Les terres sont administrées conjointement entre nous et les Allemands. Cependant, depuis la fin des pourparlers de paix, les rapports font état de plus en plus d'affrontements ethniques entre Allemands et Polonais en Silésie. Le gouvernement polonais a fait part de ses inquiétudes et appelle à la restitution du territoire. Nous devons décider soit de garder le territoire aux Allemands, soit de restituer les administrateurs polonais."
StalinNotes.59.d:0 "L'Union soviétique a annoncé qu'elle supprimait les administrateurs est-allemands en Silésie et les remplaçait par des fonctionnaires polonais pour administrer conjointement le territoire. Auparavant, les Soviétiques avaient poussé la Pologne à céder ces terres à l'Allemagne de l'Est avant les élections visant à déterminer le futur gouvernement d'un État allemand unifié. De nombreux Allemands reconnaissent désormais que les Soviétiques faisaient simplement de la politique et prétendaient seulement se soucier des droits et des revendications allemandes. Notre gouvernement condamnera le nettoyage ethnique continu des Allemands par l'Union soviétique et ses marionnettes."
StalinNotes.58.d:0 "Les Soviétiques ont catégoriquement déclaré que les terres de Silésie qu'ils nous ont forcés à céder à l'Allemagne de l'Est resteraient sous contrôle allemand. Ils notent que l'afflux de rapatriés allemands a transformé la démographie locale et que le retour de la domination polonaise pourrait potentiellement provoquer une crise majeure des réfugiés et des luttes intestines entre frères socialistes. C'est une décision décevante et nous l'avons exprimé. Cependant, les Soviétiques ont insisté sur le fait qu'il n'y avait aucun projet ni aucune considération pour la cession de terres aux Allemands. Nous avons clairement indiqué que si un tel scénario devait se produire, notre gouvernement ne pourrait pas garantir que le peuple polonais ne réagirait pas de manière dramatique. Nous ne pouvons qu'espérer que les Soviétiques n'offriront plus de surprises."
StalinNotes.43.d:0 "La Conférence de paix pour l'unification allemande est parvenue à un compromis sur les frontières de l'Allemagne. En échange de l'acceptation par l'Allemagne d'abandonner ses revendications sur l'ensemble de la frontière de 1937, l'Allemagne acceptera une période de neutralité temporaire. L'accord frontalier satisfait l'Union soviétique et la Pologne, qui craignaient que les Soviétiques ou qu'un nouveau gouvernement allemand unifié ne fasse pression pour obtenir plus de territoire. Pour l'Occident, l'accord de neutralité temporaire ouvre la possibilité d'un État allemand pro-occidental dans le futur. L'Allemagne doit rester strictement neutre pendant quinze ans avant que les restrictions ne soient levées. Avant la conférence, l'Union soviétique avait cédé certaines terres autour de Kaliningrad à l'Allemagne de l'Est."
StalinNotes.51.d:0 "Une récente initiative de l'Union soviétique visant à parvenir à une paix définitive avec l'Allemagne a échoué. Cela a atténué l'espoir, dans toute l'Europe, d'une résolution susceptible d'apaiser les tensions entre l'Est et l'Ouest. Le dirigeant soviétique Joseph Staline a commencé cet effort en échangeant des notes, avec ce que beaucoup ont perçu comme des concessions généreuses sur les questions liées à un gouvernement démocratique et aux libertés économiques au sein d'un État allemand neutre. On ne sait pas exactement ce qui a causé l'échec de cet effort ; les Soviétiques accusent l'Occident de saboter l'effort avec des exigences déraisonnables. Les États-Unis ont affirmé que l'offre soviétique était purement destinée à la propagande et à saper à la fois les États alliés et l'Allemagne de l'Ouest. Quoi qu'il en soit, de nombreux Allemands se demandent si une opportunité en or pour l'unification n'est pas passée à côté."
StalinNotes.50.d:0 "Le récent accord concernant l'unification avec l'Allemagne semble avoir échoué. Le gouvernement de l'Allemagne de l'Ouest a refusé d'accepter les termes du traité et ne rencontrera pas les responsables est-allemands, qu'il ne reconnaît pas. Suite à cette annonce, les États-Unis, ainsi que la Grande-Bretagne et la France, ont annoncé qu'ils n'obligeraient pas l'Allemagne de l'Ouest à se conformer aux termes de l'accord. Cela met effectivement fin à l'effort de paix soviétique. Les Soviétiques expriment leur indignation et accusent l'Occident de militariser l'Europe. Sur le plan international, les Soviétiques sont largement félicités pour avoir pris position sur la question, tandis que les États-Unis sont critiqués pour avoir négocié un accord, avant de faire marche arrière."
StalinNotes.54.d:0 "Le grand nombre d'immigrants allemands amenés en Allemagne de l'Est étaient installés autour de Kalingrad. Cependant, les rapatriés d'Allemagne de l'Est se dirigent vers des régions de Silésie, sous domination polonaise. Les autorités polonaises ont fait part de leurs inquiétudes. Nos propres responsables craignent que ces immigrants allemands ne puissent pas voter s'ils continuent à se propager dans la région. Pour garantir que ces votes comptent et pour saper la propagande occidentale selon laquelle nous cherchons à punir l'Allemagne, nous céderons Kalingrad et pousserons la Pologne à céder ces régions de Silésie à l'Allemagne de l'Est. Les responsables et autorités polonaises de la région seront remplacés par des Allemands de l'Est. Même si le gouvernement polonais ne sera pas satisfait de notre action, nous sommes convaincus qu'il ne fera pas de bruit tant qu'aucun territoire ne sera restitué à l'Allemagne. Cela donnera un grand coup de pouce à nos partisans en Allemagne avant le vote."
StalinNotes.52.d:0 "L'Union soviétique a confirmé les informations faisant état d'un afflux massif d'Allemands de souche renvoyés en Allemagne de l'Est. Les Soviétiques ont ajouté qu'ils cédaient Kaliningrad et que la Pologne céderait des parties de la Silésie à l'Allemagne de l'Est pour accueillir les rapatriés. Cela marque un changement majeur par rapport aux Soviétiques qui exigeaient depuis longtemps que les frontières de l'Accord de Potsdam soient mises en oeuvre dans leur intégralité. Même si les États-Unis condamnent cette action, la qualifiant de théâtre politique destiné à manipuler les élections, de nombreux Allemands se réjouissent de la nouvelle. Notre propre gouvernement ne peut que souligner que toutes nos revendications territoriales n'ont pas été satisfaites, mais même cette concession est largement saluée. De nombreux analystes estiment désormais que les sondages penchent en faveur des partis socialistes."
