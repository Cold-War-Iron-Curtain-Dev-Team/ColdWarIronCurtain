 #Events
 twrta.1001.t:0 "[FROM.GetName] demande notre soutien au Conseil de l'Atlantique Nord"
 twrta.1001.d:0 "Les diplomates de [FROM.GetNameDef] ont demandé que nous modifiions notre vote à §Gen faveur de§! la proposition actuelle au Conseil de l'Atlantique Nord. Même si nous avons déjà voté, ils avancent des arguments convaincants."
 twrta.1001.a:0 "Changeons notre position."
 twrta.1001.b:0 "Nous avons déjà clairement exprimé notre position."

 twrta.1002.t:0 "[FROM.GetName] change de position"
 twrta.1002.d:0 "[FROM.GetNameDef], après une intense persuasion de la part de nos diplomates dans leur capitale, a modifié son vote au Conseil de l'Atlantique Nord. Ils sont désormais alignés avec nous [NAT.GetCurrentNATOIssue]!"
 twrta.1002.a:0 "Excellent!"

 twrta.1003.t:0 "[FROM.GetName] refuse de changer de position"
 twrta.1003.d:0 "Malgré tous les efforts de notre corps diplomatique, [FROM.GetNameDef] est resté ferme sur sa position et ne changera pas ses intentions lors du prochain vote du Conseil de l'Atlantique Nord."
 twrta.1003.a:0 "Explosion!"

 twrta.1004.t:0 "[FROM.GetName] demande notre soutien au Conseil de l'Atlantique Nord"
 twrta.1004.d:0 "Les diplomates de [FROM.GetNameDef] ont demandé que nous modifiions notre vote pour §Rnous opposer à§! la proposition actuelle au Conseil de l'Atlantique Nord. Même si nous avons déjà voté, ils avancent des arguments convaincants."
 twrta.1004.a:0 "Changeons notre position."
 twrta.1004.b:0 "Nous avons déjà clairement exprimé notre position."

 NATO_accept_whipping:0 "Nous modifierons notre vote en §Gen faveur de§! [NAT.GetCurrentNATOIssue]."
 NATO_reject_whipping:0 "Nous changerons notre vote en §Rcontre§! [NAT.GetCurrentNATOIssue]."

 twrta.1006.t:0 "Exercices militaires semestriels de l'OTAN"
 twrta.1006.d:0 "En tant que leader de l'OTAN, nous avons la possibilité de planifier le prochain exercice majeur de l'OTAN, auquel tous les membres de l'OTAN auront la possibilité de participer."
 twrta.1006.a:0 "Programmer des exercices de l'armée"
 twrta.1006.b:0 "Programmer des exercices navals"
 twrta.1006.c:0 "Programmer des exercices de la Force aérienne"
 twrta.1006.e:0 "Programmer des exercices interarmes"

 twrta.1007.t:0 "Exercices militaires proposés !"
 twrta.1007.d:0 "Le [NAT.GetName], en tant que leader de l'OTAN, a proposé un exercice militaire majeur axé principalement sur les forces terrestres, et nous a demandé d'envoyer un contingent pour y participer !"
 twrta.1007.a:0 "Envoyer des officiers pour aider à la liaison"
 twrta.1007.b:0 "Envoyez un petit détachement d'infanterie"
 twrta.1007.c:0 "Envoyez un groupement tactique"
 NATO_army_exercise_bonus:0 "Exercice militaire de l'OTAN "

 twrta.1008.t:0 "Exercices navals proposés !"
 twrta.1008.d:0 "Le [NAT.GetName], en tant que leader de l'OTAN, a proposé un exercice militaire majeur axé principalement sur les forces navales, y compris les forces sous-marines et de surface, et nous a demandé d'envoyer des navires pour y participer !"
 twrta.1008.a:0 "Envoyer un vaisseau symbolique"
 twrta.1008.b:0 "Envoyer une force mineure"
 twrta.1008.c:0 "Envoyez un groupe de travail complet"
 NATO_navy_exercise_bonus:0 "Exercice naval de l'OTAN"

 twrta.1009.t:0 "Exercices de l'armée de l'air proposés !"
 twrta.1009.d:0 "Le [NAT.GetName], en tant que leader de l'OTAN, a proposé un exercice militaire majeur axé principalement sur l'aviation et la défense aérienne, et nous a demandé d'envoyer un contingent pour y participer !"
 twrta.1009.a:0 "Envoyez des transports et des officiers"
 twrta.1009.b:0 "Envoyez quelques escadrons"
 twrta.1009.c:0 "Envoyez nos derniers avions et notre équipage le mieux formé"
 NATO_airforce_exercise_bonus:0 "Exercice de l'armée de l'air de l'OTAN"

 twrta.1010.t:0 "Exercices interarmes proposés !"
 twrta.1010.d:0 "Le [NAT.GetName], en tant que leader de l'OTAN, a proposé un exercice militaire majeur qui intégrerait les trois grandes branches, et nous a demandé d'envoyer un contingent pour y participer !"
 twrta.1010.a:0 "Envoyer une force symbolique"
 twrta.1010.b:0 "Envoyer un petit détachement"
 twrta.1010.c:0 "Prendre un engagement majeur"
 NATO_combinedarms_exercise_bonus:0 "Exercice interarmes de l'OTAN"

 twrta.1012.t:0 "Exercice de l'OTAN réussi !"
 twrta.1012.d:0 "Avec l'aide de nos alliés de l'OTAN, l'exercice que nous avions prévu a été un succès majeur !"
 twrta.1012.a:0 "Bien joué!"

 twrta.1013.t:0 "L'exercice de l'OTAN est un échec"
 twrta.1013.d:0 "En raison des engagements limités de nos alliés au sein de l'OTAN, les efforts visant à organiser un exercice majeur visant à améliorer les capacités de combat de l'OTAN ont donné peu de résultats."
 twrta.1013.a:0 "Eux aussi doivent apporter leur juste part !"

 NATO_military_exercise_tt:0 "Les membres de l'OTAN auront la chance de participer à notre exercice militaire !"

 NATO_token_force_tt:0 "Une force §Ysymbolique§! de [THIS.GetNameDef] participera à l'exercice militaire de l'OTAN. \n\n§5Notre engagement conditionne le succès global de l'exercice.§!"
 NATO_minor_force_tt:0 "Une force mineure §Y§! de [THIS.GetNameDef] participera à l'exercice militaire de l'OTAN. \n\n§5Notre engagement conditionne le succès global de l'exercice.§!"
 NATO_major_force_tt:0 "Une force majeure §Y§! de [THIS.GetNameDef] participera à l'exercice militaire de l'OTAN. \n\n§5Notre engagement conditionne le succès global de l'exercice.§!"

 twrta.1014.t:0 "Motion proposée au Conseil de l'Atlantique Nord"
 twrta.1014.d:0 "Un câble de [NAT.GetNameDef] est arrivé, nous informant que [NAT.GetCurrentNATOIssue] a été proposé au Conseil de l'Atlantique Nord.\n\nNous avons trente jours pour faire pression sur les autres nations et voter avant l'expiration de la session."
 twrta.1014.a:0 "Nous devons examiner attentivement nos options."

 NATO_voting_open:0 "§YLe vote de l'OTAN est visible dans l'onglet décision.§!"

 NATO_exercise_complete_tt:0 "§GLe prochain exercice aura lieu dans environ six mois.§!"
 NATO_military_cooperation_change_tt:0 "§YCoopération militaire de l'OTAN :§! $RIGHT|1=+$"
 NATO_civil_integration_change_tt:0 "§YIntégration politique de l'OTAN :§! $RIGHT|1=+$"


 NATO_Greek_Civil_War_Intervention:0 "Proposer une intervention dans la guerre civile grecque"
 NATO_Greek_Civil_War_Intervention_desc:0 "Des rapports en provenance de Grèce indiquent que l'Armée démocratique est sur le point de remporter la victoire dans la guerre civile. La chute du gouvernement royal amènerait l'influence soviétique dans la mer Égée et menacerait la position de l'OTAN en Méditerranée orientale. Les commandants de l'OTAN ont proposé l'opération Bouclier Égéen : une intervention militaire décisive pour stopper l'avancée communiste et aider l'armée grecque à vaincre l'insurrection. Le Conseil doit autoriser l'opération avant qu'une offre puisse être soumise au gouvernement grec."

 NATO_Albanian_Civil_War_Intervention:0 "Proposer une intervention dans la guerre civile albanaise"
 NATO_Albanian_Civil_War_Intervention_desc:0 "Des rapports en provenance d'Albanie indiquent que le Comité national d'Albanie libre a lancé une révolte dans le nord du pays contre le régime de Hoxha. Une répression communiste soumettrait le peuple albanais à une oppression encore plus grande sous la dictature alignée sur les Soviétiques. Stratégiquement, la chute du nord de l'Albanie renforcerait le contrôle communiste dans les Balkans. Les commandants de l'OTAN ont proposé une opération baptisée Balkan Shield, qui verrait les forces de l'OTAN soutenir l'évacuation des forces anticommunistes et le gouvernement albanais en exil pour sécuriser des emplacements clés."


 NATO_GREECE_MOTION_START:0 "§GRéunion d'urgence du Conseil de l'OTAN sur une motion d'intervention en Grèce§!"
 NATO_GREECE_MOTION_UNDER_FIRE:0 "§RL'Union soviétique est en guerre contre la Grèce.§! Les députés craignent un affrontement avec l'Armée rouge et seront §Rmoins disposés§! à soutenir la motion."
 NATO_ALBANIA_MOTION_START:0 "§GRéunion d'urgence du Conseil de l'OTAN sur la motion d'intervention en Albanie§!"

 #NATO Issues
 NATO_issue_0:0 "Aucun problème"
 NATO_issue_0_desc:0 "Le Conseil de l'Atlantique Nord ne vote actuellement sur aucune question."


 NATO_issue_10:0 "Intervention dans la guerre civile grecque"
 NATO_issue_10_desc:0 "L'Armée Démocratique menace de vaincre le gouvernement grec. Les commandants de l'OTAN ont soumis au Conseil l'opération Bouclier Égéen : une intervention militaire visant à inverser l'avancée communiste et à assurer une victoire gouvernementale dans toute la Grèce. L'approbation autoriserait une offre d'assistance directe à Athènes. L'opération pourrait empêcher Moscou de prendre pied sur la mer Égée, mais l'ingérence soviétique pourrait transformer la campagne en une défaite coûteuse pour l'alliance."

 NATO_issue_11:0 "Intervention dans la guerre civile albanaise"
 NATO_issue_11_desc:0 "Des rapports en provenance d'Albanie indiquent que le Comité national d'Albanie libre a lancé une révolte dans le nord du pays contre le régime de Hoxha. Une répression communiste soumettrait le peuple albanais à une oppression encore plus grande sous la dictature alignée sur les Soviétiques. Stratégiquement, la chute du nord de l'Albanie renforcerait le contrôle communiste dans les Balkans. Les commandants de l'OTAN ont proposé une opération baptisée Balkan Shield, qui verrait les forces de l'OTAN soutenir l'évacuation des forces anticommunistes et le gouvernement albanais en exil pour sécuriser des emplacements clés."

 NATO_issue_4:0 "La contribution à la guerre de Corée"
 NATO_issue_4_desc:0 "Les contingents alliés servant sous le Commandement des Nations Unies ont porté devant le Conseil des problèmes communs en matière d'approvisionnement et de personnel. Les membres doivent décider quel soutien ils coordonneront, sans transformer l'opération coréenne en une obligation du Traité atlantique."
 NATO_issue_5:0 "Adhésion de l'Allemagne de l'Ouest"
 NATO_issue_5_desc:0 "Le Conseil de l'Atlantique Nord débat de l'opportunité d'admettre la République fédérale d'Allemagne dans l'alliance."
 NATO_issue_5_retry_desc:0 "À la suite des accords de Londres et de Paris, le Conseil de l'Atlantique Nord reconsidère l'adhésion de l'Allemagne de l'Ouest, avec l'Union de l'Europe occidentale comme cadre du réarmement."
 NATO_issue_5_retried:0 "OTAN Numéro 5 Réessayé"
 NATO_issue_6:0 "Réduire l'intégration politique"
 NATO_issue_6_desc:0 "Le Conseil de l'Atlantique Nord débat d'une proposition visant à assouplir les arrangements de coordination politique entre les membres."
 NATO_issue_7:0 "Normalisation des forces interarmées"
 NATO_issue_7_desc:0 "Le Conseil de l'Atlantique Nord débat d'un programme standard d'équipement et de doctrine pour les forces alliées."
 NATO_issue_9:0 "Le rapport Harmel"
 NATO_issue_9_desc:0 "Le Conseil de l'Atlantique Nord débat d'un rapport sur les tâches futures de l'alliance, combinant défense et dialogue avec l'Union soviétique."
 NATO_issue_12:0 "Dispositions des forces grecques et turques"
 NATO_issue_12_desc:0 "Le Conseil de l'Atlantique Nord débat de la manière dont les forces grecques et turques seront réparties au sein du commandement de l'alliance, une question sur laquelle les deux membres sont en désaccord."
 NATO_issue_13:0 "Déploiement de missiles à double voie"
 NATO_issue_13_desc:0 "Le Conseil de l'Atlantique Nord débat du déploiement de nouveaux missiles à portée intermédiaire en Europe occidentale, parallèlement à des négociations sur le contrôle des armements."
 NATO_issue_14:0 "Adhésion de l'Espagne"
 NATO_issue_14_desc:0 "Le Conseil de l'Atlantique Nord débat de l'admission de l'Espagne dans l'alliance."

 NATO_issue_4_resolved:0 "Problème 4 de l'OTAN résolu"
 NATO_issue_5_resolved:0 "Problème 5 de l'OTAN résolu"
 NATO_issue_5_failed:0 "Le numéro 5 de l'OTAN a échoué"
 NATO_issue_6_resolved:0 "Problème 6 de l'OTAN résolu"
 NATO_issue_7_resolved:0 "Problème 7 de l'OTAN résolu"
 NATO_issue_8_resolved:0 "Problème 8 de l'OTAN résolu"
 NATO_issue_9_resolved:0 "Problème 9 de l'OTAN résolu"
 NATO_issue_12_resolved:0 "Problème OTAN 12 résolu"
 NATO_issue_13_resolved:0 "Problème OTAN 13 résolu"
 NATO_issue_14_resolved:0 "Problème OTAN 14 résolu"
 NATO_issue_cooldown:0 "Temps de recharge pour les problèmes de l'OTAN"
 NATO_outside_integrated_command:0 "En dehors du Commandement intégré de l'OTAN"

 NATO_raise_at_council:0 "Soulever un problème au Conseil de l'Atlantique Nord"
 NATO_raise_at_council_desc:0 "Déposer une question dans laquelle notre gouvernement a un intérêt devant le Conseil de l'Atlantique Nord. Soulever une question coûte du pouvoir politique et nous donne une voix de premier plan dans son vote."
 NATO_issue_proposer_flag:0 "Proposition de la question actuelle de l'OTAN"
 twrta.6001.t:0 "L'OTAN soutient l'action anglo-française à Suez"
 twrta.6001.d:0 "Le Conseil de l'Atlantique Nord a approuvé les actions de la Grande-Bretagne et de la France dans la zone du canal de Suez. Washington a accepté le verdict avec réticence, avertissant que l'alliance porte désormais un fardeau plus lourd au Moyen-Orient.\n\nCette approbation renforce la position de Londres et de Paris au sein de l'alliance, tandis que les responsables américains s'inquiètent discrètement des dommages causés aux relations avec l'Égypte et le monde arabe dans son ensemble."
 twrta.6001.a:0 "L'alliance est solidaire."
 twrta.6002.t:0 "L'OTAN condamne l'intervention de Suez"
 twrta.6002.d:0 "Le Conseil de l'Atlantique Nord a refusé d'approuver l'intervention anglo-française en Égypte. La scission laisse la Grande-Bretagne et la France isolées au sein de l'alliance, et leurs gouvernements font face à de vives critiques dans leur pays pour cette humiliation.\n\nDans le même temps, la fracture a donné à Moscou une occasion d'affirmer que les puissances occidentales ne peuvent pas s'entendre entre elles."
 twrta.6002.a:0 "Une amère leçon."
 NATO_pledge_forces:0 "Engagement des forces auprès de l'OTAN"
 NATO_pledge_forces_desc:0 "Engagez des troupes et des effectifs dans l'alliance. Augmente nos effectifs et la coopération militaire de l'OTAN."
 NATO_refuse_burden_sharing:0 "Refuser le partage du fardeau"
 NATO_refuse_burden_sharing_desc:0 "Gardez notre budget pour nous. Acquiert le pouvoir politique, mais Washington lui en voudra pendant six mois et la coopération militaire de l'OTAN s'effondre."
 NATO_demand_consultation:0 "Exiger une consultation avec Washington"
 NATO_demand_consultation_desc:0 "Demandez aux États-Unis de nous consulter avant les décisions majeures de l'alliance. Washington doit répondre."
 NATO_burden_grievance:0 "Grief de partage du fardeau"
 NATO_consultation_demanded:0 "Consultation exigée de l'OTAN"
 twrta.15001.t:0 "Un allié exige une consultation"
 twrta.15001.d:0 "L'un de nos partenaires de l'OTAN a formellement demandé à être consulté avant que l'alliance ne prenne des décisions majeures. Accepter rassurera nos alliés, tandis que refuser alimentera le ressentiment au sein de l'alliance."
 twrta.15001.a:0 "Acceptez de les consulter."
 twrta.15001.b:0 "Refuser pour l'instant."
 NATO_marshall_aid:0 "Aide de style Marshall aux alliés"
 NATO_marshall_aid_desc:0 "Étendre l'aide économique américaine à l'alliance. Augmente la bonne volonté de l'OTAN en matière d'aide, ce qui rend les membres plus enclins à soutenir les propositions américaines et stabilise leurs économies. La bonne volonté diminue chaque mois. Disponible une fois par an."
 NATO_aid_goodwill:0 "Bonne volonté de l'OTAN en matière d'aide"
 NATO_marshall_aid_cooldown:0 "Temps de recharge de l'aide Marshall"

 twrta.5001.t:0 "[GetNewspaperHeader]L'Allemagne de l'Ouest rejoint l'OTAN"
 twrta.5001.d:0 "Bonn, [?global.date.GetDateStringNoHourLong] - La République fédérale d'Allemagne a été admise au sein de l'Organisation du Traité de l'Atlantique Nord, intégrant ainsi l'Allemagne de l'Ouest à l'alliance de défense occidentale. Le gouvernement de Bonn s'est assuré la place qu'il recherchait parmi les puissances occidentales grâce aux négociations sur le réarmement allemand.\n\nLes planificateurs militaires alliés s'attendent à une contribution ouest-allemande pour renforcer leurs forces en Europe centrale. La création de nouvelles formations et leur placement sous commandement intégré prendront du temps. L'admission fait suite à de longues discussions en France et ailleurs sur les garanties devant accompagner la création de nouvelles forces armées allemandes.\n\nMoscou a condamné cette décision, avertissant que le réarmement allemand menace la sécurité européenne. Les gouvernements occidentaux soutiennent que les arrangements collectifs de l'alliance empêcheront une politique militaire allemande indépendante. Dans ce pays divisé, l'adhésion a exacerbé le débat sur la question de savoir si des liens plus étroits avec l'Occident laissent entrevoir une perspective d'accord sur la réunification."
 twrta.5001.a:0 "Un nouveau rempart en Europe."

 twrta.8001.t:0 "La France reconsidère le commandement intégré"
 twrta.8001.d:0 "Paris a rouvert la question du rôle français dans la structure militaire intégrée de l'OTAN. Certains ministres estiment que les officiers étrangers commandant les troupes françaises portent atteinte à la souveraineté nationale.\n\nLe gouvernement pourrait retirer les forces françaises du commandement intégré, rester dans l'alliance tout en reprenant le contrôle total de son armée.\n\nLes alliés de Washington et de Londres ont averti qu'une telle décision affaiblirait la planification de défense de l'alliance."
 twrta.8001.a:0 "Retirez-vous de la commande intégrée."
 twrta.8001.b:0 "Restez dans la commande intégrée."

 twrta.8002.t:0 "La France quitte le commandement intégré"
 twrta.8002.d:0 "Le gouvernement français a annoncé le retrait de ses forces du commandement militaire intégré de l'OTAN. La France reste membre de l'Alliance atlantique et continuera à participer aux consultations politiques.\n\nLes quartiers généraux alliés doivent désormais réorganiser leurs plans de défense de l'Europe centrale sans divisions françaises sous leur commandement direct."
 twrta.8002.a:0 "L'alliance doit s'adapter."

 twrta.9001.t:0 "Le rapport Harmel"
 twrta.9001.d:0 "Les ministres des Affaires étrangères de l'alliance ont adopté un rapport sur les tâches futures de l'OTAN. Il appelle l'alliance à poursuivre la détente avec l'Union soviétique parallèlement à sa défense, une politique qui repose sur la force militaire et le dialogue politique.\n\nLes États membres conserveront leurs forces de défense tout en ouvrant des négociations sur le contrôle des armements et la coopération."
 twrta.9001.a:0 "Une nouvelle direction."

 twrta.13001.t:0 "Décision à double voie sur les forces nucléaires de théâtre"
 twrta.13001.d:0 "L'alliance a accepté de déployer de nouveaux missiles à portée intermédiaire en Europe occidentale tout en poursuivant les négociations avec Moscou sur la limitation de ces armes.\n\nLes pays hôtes, les Pays-Bas, l'Allemagne de l'Ouest, l'Italie et la Belgique, doivent désormais préparer leurs bases pour les nouveaux systèmes, et le coût politique du déploiement devrait être considérable."
 twrta.13001.a:0 "L'alliance tient bon."

 twrta.14001.t:0 "L'Espagne rejoint l'OTAN"
 twrta.14001.d:0 "Madrid a été admise au sein de l'Organisation du Traité de l'Atlantique Nord après des années d'efforts diplomatiques. La position de l'Espagne à l'entrée de la Méditerranée fait du pays un partenaire précieux pour la défense de l'alliance.\n\nLes commandants alliés s'attendent à ce que les bases et les ports espagnols soutiennent les opérations navales et aériennes en Méditerranée occidentale."
 twrta.14001.a:0 "L'Espagne prend sa place à l'Ouest."
 

 TA_NORWAY_MOTION_START:0 "§GRéunion d'urgence du Conseil de l'OTAN sur une motion d'intervention en Norvège§!"

 TA_FORMAL_JOIN_MOTION_START:0 "§GSoumettre notre candidature officielle pour convoquer une réunion du Conseil de l'OTAN afin d'évaluer notre demande d'adhésion§!"

 NO_ONGOING_TA_MOTION:0 "§YAucune motion en cours au Conseil de l'Atlantique Nord§!"

 
 NATO_APPLICATION_BILL:0 "[event_target:NATO_toronto_accord_applicant.GetAdjective] Demande d'adhésion à l'OTAN"

 NATO_issue_3:0 "[event_target:NATO_toronto_accord_applicant.GetAdjective] Demande"

 twrta.3001.t:0 "Adhésion officielle à l'OTAN"
 twrta.3001.d:0 "Après une période de délibération, les membres de l'OTAN sont parvenus à un accord majoritaire et ont approuvé notre candidature, nous accordant ainsi l'adhésion à l'OTAN."
 twrta.3001.a:0 "Enfin!"
 twrta.3002.t:0 "[ROOT.GetAdjective] Adhésion à l'OTAN"
 twrta.3002.d:0 "Il n'y a pas si longtemps, des responsables de [ROOT.GetAdjective] ont exprimé leur profond intérêt pour une adhésion à l'alliance militaire de l'OTAN. Il a été confirmé par la suite que [ROOT.GetNameDef] avait déposé une demande d'adhésion à l'OTAN, qui a ensuite été approuvée par la majorité des membres de l'OTAN.\n\nLe porte-parole de l'OTAN a fait une déclaration publique concernant l'entrée des [ROOT.GetAdjective], souhaitant la plus chaleureuse bienvenue de l'OTAN à leur dernier État membre."
 twrta.3002.a:0 "L'OTAN s'agrandit."
 twrta.3003.t:0 "Demande d'adhésion à l'OTAN rejetée"
 twrta.3003.d:0 "Malgré nos intentions de rejoindre l'OTAN, les membres de l'OTAN ont voté pour refuser notre adhésion à l'OTAN, invoquant des excuses génériques pour se couvrir."
 twrta.3003.a:0 "Honte."


 #Stuff
 NATO_INTERVENTION.10.d:0 "Le Conseil de l'Atlantique Nord a approuvé l'opération Bouclier Égéen et a proposé une assistance militaire directe au gouvernement grec. Alors que l'Armée démocratique menace de gagner la guerre civile, l'opération vise à inverser l'avancée communiste et à restaurer l'autorité d'Athènes dans toute la Grèce. Il faut le consentement du gouvernement avant de pouvoir procéder.\n\nPour l'armée grecque, l'intervention alliée offre la perspective de vaincre des forces qu'elle n'a pas pu vaincre jusqu'à présent. L'accepter obligerait le gouvernement à poursuivre la guerre avec un soutien étranger, plutôt que de chercher un compromis avec le Parti communiste grec, le KKE. Cela donnerait également à l'Union soviétique une raison d'augmenter son aide aux insurgés ou de contester directement l'opération.\n\nLe gouvernement doit peser le danger immédiat d'une défaite militaire et les risques d'une confrontation plus large. L'offre de l'OTAN fournit un moyen de poursuivre la lutte, mais Athènes ne peut pas déterminer comment Moscou réagira."
 NATO_INTERVENTION.11.d:0 "Les responsables de l'OTAN ont été stupéfaits d'apprendre que le gouvernement grec n'offrirait pas son soutien ou son soutien à l'opération Bouclier Égéen. Apparemment, de nombreux membres du gouvernement et de l'armée grecque estiment que l'établissement d'un gouvernement sur les îles grecques ne ferait que prolonger inutilement le conflit et compromettre la souveraineté grecque. On a également le sentiment qu'un mouvement de résistance ou un effort de compromis avec les communistes ne peut réussir que si les dirigeants grecs restent en Grèce continentale. Sans le soutien du gouvernement grec, l'opération Bouclier Égéen ne pourra pas être activée."
 NATO_INTERVENTION.12.d:0 "De hauts responsables de l'OTAN ont annoncé le lancement de l'opération Bouclier Égéen suite à l'acceptation par le gouvernement grec de l'assistance militaire alliée. L'intervention vise à stopper l'avancée de l'Armée démocratique et à assurer la victoire du gouvernement d'Athènes.\n\nLes forces alliées se mettent en position pour soutenir l'armée grecque. Les porte-parole de l'OTAN ont déclaré que l'opération se poursuivrait jusqu'à ce que les forces communistes soient vaincues et que l'autorité gouvernementale soit rétablie dans toute la Grèce.\n\nLe KKE a dénoncé cette intervention comme une tentative d'imposer le gouvernement royal par des armes étrangères. Moscou a condamné l'action de l'OTAN, mais n'a pas encore annoncé quelle sera sa réponse."
 NATO_INTERVENTION.13.d:0 "Le gouvernement grec a accepté l'opération Bouclier Égéen, entraînant l'OTAN dans la guerre civile aux côtés de la monarchie. Le Parti communiste grec, le KKE, a fait appel à Moscou pour obtenir des conseils. Son armée démocratique risque de perdre une victoire qui semblait à sa portée avant que les puissances occidentales ne s'engagent à sauver Athènes.\n\nLa retenue soviétique éviterait une confrontation avec l'OTAN, mais exposerait les communistes grecs à une intervention destinée à détruire leur armée et leur gouvernement provisoire. Encourager une offensive immédiate offre une autre solution : l'Armée démocratique pourrait encore capturer Athènes avant que le soutien allié ne garantisse la position du gouvernement royal. Un échec laisserait le KKE sans réponse efficace à l'intervention occidentale.\n\nUn défi naval engagerait plus directement les forces soviétiques. Un déploiement suffisamment important de la flotte de la mer Noire en Méditerranée orientale pourrait contraindre l'OTAN à abandonner l'opération, au risque d'un affrontement avec les navires de guerre américains. Moscou doit déterminer jusqu'où elle s'engagera à empêcher la défaite des communistes grecs."
 NATO_INTERVENTION.14.d:0 "L'OTAN a déclaré que l'opération Bouclier Égéen était un succès après la défaite de l'Armée démocratique. Le soutien militaire allié a inversé l'avancée communiste et permis au gouvernement grec de remporter la victoire dans la guerre civile.\n\nLe gouvernement démocratique provisoire a cessé d'exister et le gouvernement d'Athènes a repris son autorité sur l'ensemble du pays. Les unités de l'armée grecque prennent le contrôle des derniers bastions communistes alors que la résistance organisée s'effondre.\n\nLes pays du bloc soviétique impliqués dans les combats ont mis fin aux hostilités avec la Grèce sans concession territoriale et ont convenu d'une trêve de cinq ans. Les responsables de l'OTAN ont salué le résultat comme une justification de l'intervention alliée, tandis que Moscou a condamné la destruction du mouvement communiste grec."
 NATO_INTERVENTION.15.d:0 "Les commandants de l'OTAN ont reconnu l'échec de l'opération Bouclier Égéen. L'intervention n'a pas pu empêcher l'effondrement de l'armée gouvernementale grecque et l'Armée démocratique a remporté la victoire dans la guerre civile.\n\nLe gouvernement démocratique provisoire dirige désormais l'ensemble de la Grèce. Le gouvernement royal est tombé et les responsables communistes reprennent ses ministères et ses installations militaires. La tentative de l'OTAN d'inverser l'avancée communiste s'est soldée par une défaite décisive.\n\nLes nouvelles autorités grecques se sont alignées sur Moscou, faisant entrer le pays dans le bloc de l'Est en tant que satellite soviétique. Les gouvernements alliés sont confrontés à des demandes d'enquête sur l'échec de l'opération et à des discussions urgentes sur la perte de la Grèce au profit de la sphère soviétique."
 NATO_INTERVENTION.16.d:0 "L'opération Bouclier Égéen dirigée par l'OTAN a largement réussi à établir un gouvernement grec libre sur les îles grecques. Cependant, on craint que les communistes grecs cherchent à reprendre ces îles, que ce soit ouvertement, clandestinement ou par la propagande. Un haut responsable grec et certains ambassadeurs de l'OTAN ont lancé l'idée que nous abandonnions l'administration de Chypre au gouvernement grec libre. Cela pourrait leur donner une légitimité bien plus grande, un accès à une population plus importante et une base sûre à partir de laquelle planifier la libération de la Grèce. Nos propres responsables ne sont pas aussi convaincus que beaucoup estiment que la domination britannique à Chypre est une force de stabilité pour la région et stratégiquement vitale pour le Royaume-Uni. Les Turcs chypriotes s'y opposeraient et tout transfert de pouvoir doit s'accompagner d'une garantie de leurs droits. Le Premier ministre et le cabinet doivent décider s'ils doivent céder Chypre ou conserver l'île."
 NATO_INTERVENTION.17.d:0 "Notre ministre des Affaires étrangères confirme les informations selon lesquelles les Britanniques envisagent sérieusement de remettre Chypre au gouvernement grec libre établi par l'OTAN sur les îles grecques. Cela constitue une préoccupation majeure, car notre peuple reste, à juste titre, préoccupé par le sort du peuple chypriote turc. Les dirigeants chypriotes turcs ont également exprimé leur crainte d'une éventuelle prise de pouvoir par la Grèce. Nous devrions sérieusement envisager d'envoyer une équipe de haut niveau à Londres pour présenter nos profondes préoccupations concernant ce projet. Cela semble être la meilleure décision à prendre, mais certains estiment que nous ne devrions pas nous impliquer et espèrent que le Royaume-Uni gérera la situation avec tact."
 NATO_INTERVENTION.18.d:0 "Une délégation turque de haut niveau est arrivée récemment pour des entretiens. Le seul sujet de préoccupation est la situation à Chypre. Les Turcs sont fermement opposés à nos discussions visant à céder l'île au gouvernement grec libre. Ils estiment que les Turcs chypriotes seraient marginalisés et que les réactions négatives qui en résulteraient parmi les Turcs pourraient nuire considérablement au soutien turc à l'OTAN. Une situation potentiellement acceptable pour la Turquie pourrait être si nous cédions seulement la moitié ouest de l'île tout en maintenant une présence à l'est. Ils ont également « proposé » de reprendre l'administration de la moitié orientale si nécessaire. Nous pouvons soit répondre aux préoccupations turques et céder seulement certaines parties de l'île, soit nous en tenir à notre décision initiale et céder l'île entière. Certains membres du ministère des Affaires étrangères estiment que le gouvernement turc exagère les conséquences de la cession de la totalité de Chypre."
 NATO_INTERVENTION.19.d:0 "Le gouvernement britannique a annoncé que certaines zones de Chypre à majorité grecque seraient remises au gouvernement grec libre basé dans les îles de la mer Égée. Le respect des souhaits des Grecs chypriotes a été cité comme la principale motivation de cette décision. Cependant, le gouvernement a noté qu'il était toujours obligé envers la population turque chypriote et qu'en tant que tel, la Grande-Bretagne conserverait le contrôle de la partie orientale de l'île et de cette communauté. Cette nouvelle donnera un élan majeur au gouvernement grec récemment défait. Les autorités communistes grecques ont condamné cette annonce comme étant un marchandage impérial."
 NATO_INTERVENTION.20.d:0 "Lors d'une cérémonie conjointe, les responsables britanniques à Chypre ont officiellement remis l'autorité au gouvernement grec libre. L'île revient à la domination grecque après des siècles de domination Ottoman et britannique. Des Grecs chypriotes notables étaient présents et les journalistes sur le terrain indiquent qu'il existe un sentiment général d'enthousiasme parmi les Grecs chypriotes. Cependant, l'ambiance au sein de l'importante minorité turque chypriote est particulièrement maussade. Beaucoup de leurs dirigeants ont choisi de ne pas assister à la cérémonie et des manifestations anti-britanniques ont actuellement lieu en Turquie. Ceci malgré le fait que le gouvernement grec ait accepté les conditions britanniques protégeant les droits et le statut des Turcs chypriotes. Même si le gouvernement grec bénéficiera d'un grand élan en termes de position stratégique et de légitimité politique, il devra éventuellement résoudre les problèmes de l'île avant de pouvoir envisager des plans pour traiter avec le régime communiste grec continental."
 NATO_INTERVENTION.22.d:0 "Chypre a été remise au peuple grec, après des siècles d'occupation étrangère. Les Britanniques nous ont donné l'île à condition que nous garantissions les droits des Turcs chypriotes. Il y a déjà des rapports en provenance de Chypre selon lesquels notre peuple brandit des drapeaux et célèbre la nouvelle. Nous devons immédiatement envoyer des responsables gouvernementaux et militaires pour superviser le transfert d'autorité. Il est vital que nous ne causions aucun problème sur l'île et que nous agissions rapidement pour en faire une pierre angulaire majeure de la libération de la Grèce continentale. Nos ennemis condamnent haut et fort cette nouvelle et la répriment sans aucun doute, alors que nous nous établissons rapidement et unifions tous les peuples grecs."
 NATO_INTERVENTION.23.d:0 "Le gouvernement britannique, dans un message soigneusement formulé, a déclaré qu'il ne céderait pas Chypre au gouvernement démocratique grec. Les Britanniques ont fait valoir que l'environnement de sécurité précaire sur l'île et la nécessité d'assurer une forte présence en Méditerranée orientale étaient d'une importance capitale et ne pouvaient être compromis. Malgré ces nouvelles décevantes, les Britanniques ont également déclaré qu'ils continueraient à soutenir notre lutte et qu'ils attendaient avec impatience d'approfondir leurs relations et d'élargir les domaines de coopération. Cela constitue un coup dur, car Chypre nous aurait donné une plus grande légitimité et une base solide à partir de laquelle planifier notre éventuelle libération de la Grèce continentale des communistes. Nous ne pouvons qu'espérer qu'avec le temps, les Grecs chypriotes finiront par se rallier à notre cause et que les Britanniques pourront reconsidérer leur décision."
 
 NATO_INTERVENTION.25.t:0 "Bouclier égéen en cours"
 NATO_INTERVENTION.25.d:0 "Athènes a accepté l'opération Bouclier Égéen, autorisant l'intervention alliée dans la guerre civile grecque. Les préparatifs peuvent désormais se poursuivre avec l'accord du gouvernement royal. L'objectif immédiat est d'arrêter l'avancée de l'Armée Démocratique avant que l'armée grecque ne perde ses dernières positions.\n\nWashington attend toujours une réponse soviétique. Moscou pourrait laisser le KKE faire face seul à l'intervention, encourager une offensive contre Athènes ou défier les forces alliées en mer. La planification américaine doit tenir compte de la possibilité qu'une opération destinée à vaincre l'insurrection grecque se heurte à une interférence directe soviétique."
 NATO_INTERVENTION.25.a:0 "Surveillez la réponse soviétique."

 NATO_INTERVENTION.26.t:0 "Forces étrangères pour le roi"
 NATO_INTERVENTION.26.d:0 "Le gouvernement royal a accepté l'opération Bouclier Égéen. L'OTAN a l'intention d'intervenir contre l'Armée démocratique et de restaurer l'autorité gouvernementale dans toute la Grèce, menaçant d'inverser l'avancée communiste avant qu'elle ne fasse tomber la monarchie.\n\nLe KKE dénonce cette opération comme un soutien militaire étranger à un gouvernement proche de la défaite. Ses dirigeants ont fait appel à Moscou pour obtenir des conseils sur la manière de résister à l'intervention et sur l'aide que l'Union soviétique est prête à fournir. En attendant cette réponse, l'Armée démocratique ne peut pas compter sur les forces soviétiques pour empêcher le soutien allié d'atteindre ses adversaires."
 NATO_INTERVENTION.26.a:0 "Envoyez l'appel à Moscou."

 NATO_INTERVENTION.27.t:0 "Moscou restera à l'écart"
 NATO_INTERVENTION.27.d:0 "Moscou a décidé de ne pas contester l'opération Bouclier Égéen. L'opposition soviétique à l'intervention reste un sujet de protestation diplomatique ; les dirigeants soviétiques n'encourageront pas une nouvelle offensive contre Athènes ni n'enverront la flotte de la mer Noire pour faire obstacle à l'opération.\n\nPour Washington, cette décision élimine la perspective immédiate d'une confrontation avec les forces soviétiques à propos de la Grèce. Les commandants alliés s'attendent à ce qu'un soutien à l'armée grecque permette de conclure rapidement la campagne. Le KKE doit maintenant faire face à une intervention destinée à vaincre son armée sans le défi soviétique sur lequel ses dirigeants espéraient s'appuyer."
 NATO_INTERVENTION.27.a:0 "Dites aux commandants de continuer."

 NATO_INTERVENTION.28.t:0 "Aucune aide de Moscou"
 NATO_INTERVENTION.28.d:0 "Moscou a informé le KKE qu'il ne contesterait pas l'intervention de l'OTAN en Grèce. Les dirigeants soviétiques ont refusé d'encourager une offensive immédiate contre Athènes ou d'engager la flotte de la mer Noire à faire obstacle à l'opération Bouclier Égéen.\n\nCette décision laisse l'Armée démocratique confrontée à une intervention étrangère sans le soutien soviétique recherché par ses dirigeants. Le gouvernement royal, récemment menacé de défaite, peut désormais compter sur l'aide des alliés sans contestation directe de Moscou. La confiance dans une victoire communiste s'affaiblit à mesure que le KKE est confronté à la perspective de perdre l'avantage militaire qu'il avait acquis."
 NATO_INTERVENTION.28.a:0 "Dites aux unités qu'il n'y aura pas d'aide soviétique."

 NATO_INTERVENTION.29.t:0 "La course pour Athènes"
 NATO_INTERVENTION.29.d:0 "Moscou encourage le KKE à lancer une offensive totale contre Athènes avant que l'opération Bouclier Égéen ne garantisse la position du gouvernement royal. Les planificateurs américains prévoient soixante jours pour que le concours soit décidé. Si la capitale tombe pendant cette période, l'intervention échouera et les communistes grecs gagneront la guerre civile.\n\nUne livraison d'urgence d'armes d'infanterie et d'équipements de soutien pourrait aider l'armée grecque à maintenir ses positions pendant que l'aide alliée fait effet. Washington devrait autoriser le transfert des stocks américains et accepter le coût politique d'un engagement supplémentaire dans la campagne. L'alternative est de s'appuyer sur l'aide déjà approuvée dans le cadre d'Aegean Shield.\n\nLa question immédiate est de savoir si l'armée grecque peut défendre Athènes avec ses ressources actuelles, ou si elle a besoin d'une nouvelle allocation d'armes américaines pour survivre à l'offensive."
 NATO_INTERVENTION.29.a:0 "Transportez les armes à Athènes."
 NATO_INTERVENTION.29.b:0 "Les Grecs peuvent tenir avec ce qu'ils ont."

 NATO_INTERVENTION.30.t:0 "Tenir Athènes"
 NATO_INTERVENTION.30.d:0 "L'Armée Démocratique prépare une offensive concentrée contre Athènes avec les encouragements de Moscou. Le KKE a l'intention de vaincre le gouvernement royal avant que l'opération Bouclier Égéen puisse consolider sa position. La capitale est désormais l'objectif immédiat de la campagne communiste.\n\nL'armée grecque doit tenir pendant les soixante prochains jours le temps que le soutien allié fasse effet. Perdre Athènes dans ce délai mettrait en échec l'intervention et laisserait les communistes victorieux. Le gouvernement appelle ses forces à maintenir la défense de la capitale, précisant que l'engagement de l'OTAN ne peut sauver une armée qui perd ses positions avant que l'assistance ne devienne décisive."
 NATO_INTERVENTION.30.a:0 "Athènes doit tenir jusqu'à l'arrivée des secours."

 NATO_INTERVENTION.31.t:0 "Moscou appelle à l'offensive"
 NATO_INTERVENTION.31.d:0 "Moscou a exhorté le KKE à lancer une offensive immédiate contre Athènes. L'engagement de l'OTAN dans l'opération Bouclier Égéen menace d'anéantir les acquis de l'Armée démocratique, mais le gouvernement royal reste vulnérable avant que l'aide alliée ne garantisse sa position.\n\nLes dirigeants soviétiques soutiennent une tentative de règlement de la guerre dans un délai de soixante jours. Prendre Athènes pendant cette période mettrait en échec l'intervention occidentale et permettrait au gouvernement démocratique provisoire d'établir son autorité dans toute la Grèce. Le KKE s'engage en faveur d'une victoire militaire rapide ; si la capitale tient, le soutien allié donnera l'avantage à l'armée gouvernementale."
 NATO_INTERVENTION.31.a:0 "Prenez Athènes avant que l'OTAN ne puisse sauver la monarchie."

 NATO_INTERVENTION.32.t:0 "La flotte de la mer Noire navigue"
 NATO_INTERVENTION.32.d:0 "Moscou a choisi de défier l'opération Bouclier Égéen en déployant la flotte de la mer Noire vers la Méditerranée orientale. Une force soviétique suffisamment forte dans la région pourrait rendre l'intervention intenable et exposer le gouvernement grec à la défaite. Les soixante prochains jours détermineront si Moscou pourra rassembler une telle force avant que le soutien allié ne décide de la campagne à terre.\n\nLes États-Unis peuvent ordonner à leurs forces navales méditerranéennes d'observer le déploiement soviétique. Une observation étroite rendrait le défi plus difficile, obligeant Moscou à engager une force plus importante pour vaincre la présence américaine. Cela augmenterait également les tensions entre les navires de guerre opérant dans les mêmes eaux.\n\nGarder les navires américains à l'écart réduirait le risque immédiat d'un incident, mais permettrait aux Soviétiques de défier Aegean Shield avec un escadron plus petit. Washington doit décider si l'opération justifie une confrontation navale plus rapprochée."
 NATO_INTERVENTION.32.a:0 "Observez la flotte soviétique."
 NATO_INTERVENTION.32.b:0 "Gardez nos navires à l'écart. Ne les provoquez pas."

 NATO_INTERVENTION.33.t:0 "Navires de guerre soviétiques dans le détroit"
 NATO_INTERVENTION.33.d:0 "L'Union soviétique cherche à faire passer par le détroit de Turquie les navires de guerre à destination de la mer Égée. Leur déploiement est destiné à défier l'opération Bouclier Égéen et pourrait empêcher les puissances occidentales d'assurer une victoire au gouvernement grec.\n\nAnkara doit gérer le transit en vertu de la Convention de Montreux, qui réglemente le passage des navires de guerre à travers le détroit. Autoriser le passage ne nécessite pas l'approbation turque de l'opération soviétique. Le gouvernement peut gérer le transit sans contestation publique ou émettre une protestation contre la tentative de Moscou d'influencer la guerre en Grèce.\n\nLa pression soviétique sur les détroits a rendu le déploiement particulièrement sensible en Turquie. Une protestation publique démontrerait une opposition à Moscou, mais nécessiterait une confrontation politique que le respect discret de la Convention éviterait. La question dont le gouvernement est saisi concerne sa réponse diplomatique, plutôt que sa tentative d'interdire les navires."
 NATO_INTERVENTION.33.a:0 "Autoriser le passage en vertu de la Convention."
 NATO_INTERVENTION.33.b:0 "Laissez-les passer, mais publiez notre protestation."

 NATO_INTERVENTION.34.t:0 "Navires soviétiques à destination de la mer Égée"
 NATO_INTERVENTION.34.d:0 "Des navires de guerre soviétiques sont envoyés de la mer Noire vers la mer Égée pour défier l'opération Bouclier Égéen. Moscou tente d'empêcher l'intervention alliée d'assurer la victoire du gouvernement royal, en exerçant une pression navale pour soutenir son soutien aux communistes grecs.\n\nAthènes a accepté l'aide de l'OTAN pour inverser l'avancée de l'Armée démocratique. Cette aide se heurte désormais au défi soviétique en mer ainsi qu'à la résistance communiste à terre. Le gouvernement doit poursuivre la guerre pendant que les commandants alliés déterminent s'ils peuvent maintenir l'opération face au déploiement soviétique."
 NATO_INTERVENTION.34.a:0 "Surveillez l'escadre soviétique."

 NATO_INTERVENTION.36.t:0 "Les communistes grecs vaincus"
 NATO_INTERVENTION.36.d:0 "L'opération Bouclier Égéen s'est soldée par une victoire du gouvernement grec. L'aide alliée a stoppé l'avancée de l'Armée démocratique et le gouvernement démocratique provisoire a cessé d'exister. Athènes exerce désormais son autorité sur toute la Grèce.\n\nPour Moscou, la défaite élimine la perspective d'un gouvernement communiste sur la mer Égée et renforce l'affirmation de l'OTAN selon laquelle une intervention peut contenir la propagation de l'influence soviétique. Les appels du KKE n'ont pas réussi à obtenir le soutien nécessaire pour empêcher sa défaite militaire. Alors que les dirigeants soviétiques se sont engagés à contester l'opération, l'échec soulève également des questions sur leur gestion de la crise."
 NATO_INTERVENTION.36.a:0 "Une grave défaite pour les camarades grecs."

 NATO_INTERVENTION.37.t:0 "La République à proclamer"
 NATO_INTERVENTION.37.d:0 "L'Armée Démocratique a gagné la guerre civile, battant le gouvernement royal malgré l'intervention de l'OTAN. Le gouvernement démocratique provisoire contrôle désormais la Grèce et le KKE se prépare à proclamer la République démocratique. L'opération Bouclier Égéen n'a pas réussi à préserver la monarchie.\n\nLes autorités communistes reprennent les ministères et les installations militaires de l'ancien gouvernement. La victoire donne au KKE les moyens d'établir son pouvoir au-delà de ses bastions de guerre, tandis que l'alignement sur Moscou place le nouvel État au sein du bloc de l'Est. La proclamation marque la transition d'un gouvernement provisoire luttant pour le pouvoir à un gouvernement communiste exerçant son autorité sur l'ensemble du pays."
 NATO_INTERVENTION.37.a:0 "Diffusez la proclamation de la République."

 NATO_INTERVENTION.38.t:0 "Qui a perdu la Grèce ?"
 NATO_INTERVENTION.38.d:0 "L'opération Bouclier Égéen a échoué. Le gouvernement royal grec est tombé et les autorités communistes contrôlent désormais le pays avec le soutien de Moscou. L'intervention alliée n'a pas empêché la victoire de l'Armée démocratique, laissant la Grèce dans la sphère soviétique.\n\nLa défaite a suscité des demandes d'explications sur les objectifs et le déroulement de l'opération. Les porte-parole de l'opposition remettent en question les assurances données lors de l'approbation de l'intervention, tandis que les partisans du gouvernement veulent savoir pourquoi l'engagement n'a pas réussi à sauver Athènes. Les ministres doivent désormais rendre compte de la campagne et de son coût pour la position alliée en Méditerranée orientale."
 NATO_INTERVENTION.38.a:0 "Nous devons répondre de cette défaite."

 NATO_INTERVENTION.39.t:0 "Victoire en mer Égée"
 NATO_INTERVENTION.39.d:0 "Les communistes grecs ont vaincu le gouvernement royal malgré l'opération Bouclier Égéen. Le KKE se prépare à proclamer une république et les nouvelles autorités entrent dans le bloc de l'Est sous influence soviétique. L'intervention de l'OTAN n'a pas réussi à empêcher la perte de la Grèce.\n\nMoscou félicite les dirigeants grecs et présente le résultat comme une défaite face à l'ingérence occidentale. Pour la diplomatie soviétique, le résultat amène un gouvernement allié en mer Égée et affaiblit la confiance dans la capacité des puissances atlantiques à protéger leurs partenaires. La victoire de l'Armée démocratique a donné à l'Union soviétique une position plus forte en Méditerranée orientale."
 NATO_INTERVENTION.39.a:0 "Envoyez nos félicitations aux camarades grecs."

 SOV_Aegean_KKE_Offensive:0 "L'offensive sur Athènes"
 SOV_Aegean_KKE_Offensive_desc:0 "L'Armée Démocratique doit vaincre le gouvernement royal avant que l'OTAN puisse s'en emparer. Si l'Armée Démocratique ou ses alliés prennent Athènes avant l'expiration de cette mission de 60 jours, l'Opération Bouclier Égéen échouera et les communistes grecs gagneront la guerre civile. S'ils ne le font pas, le gouvernement grec gagne."
 SOV_Aegean_Black_Sea_Fleet:0 "Défiez le Bouclier Égéen"
 SOV_Aegean_Black_Sea_Fleet_desc:0 "Envoyez la flotte soviétique en Méditerranée orientale avant l'expiration de cette mission de 60 jours. Au moins 3 vaisseaux capitaux soviétiques et 4 écrans soviétiques doivent y être présents en même temps. Si les États-Unis suivent notre flotte, les besoins s'élèvent à 5 navires capitaux et 6 écrans. Satisfaire à cette exigence met fin à l'opération Bouclier Égéen et donne aux communistes grecs la victoire dans la guerre civile. Si la mission expire sans succès, le gouvernement grec gagne."
 NATO_Aegean_Shield_Watch:0 "Bouclier égéen : surveillez les interférences soviétiques"
 NATO_Aegean_Shield_Watch_desc:0 "Moscou a contesté l'opération Bouclier Égéen. Surveillez l'ingérence soviétique pendant cette fenêtre de 60 jours. Une capture d'Athènes par les communistes ou les alliés pendant l'offensive, ou l'arrivée de la flotte soviétique requise en Méditerranée orientale pendant le défi naval, fait échouer l'opération et donne la victoire aux communistes grecs. Les besoins navals sont de 3 vaisseaux capitaux et 4 écrans, passant à 5 et 6 si nous suivons la flotte. Si la mission soviétique expire sans succès, le gouvernement grec gagne. Cette mission est un chronomètre informatif uniquement."
