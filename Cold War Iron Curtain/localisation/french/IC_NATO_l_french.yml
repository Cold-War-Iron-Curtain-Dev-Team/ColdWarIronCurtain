 # Decisions

 NATO_decisions_category:0 "Organisation du Traité de l'Atlantique Nord"
 NATO_decisions_category_desc:0 "L'Organisation du Traité de l'Atlantique Nord a été créée après la fin de la Seconde Guerre mondiale et les ravages qu'elle a provoqués en Europe. L'organisation met en oeuvre le Traité de l'Atlantique Nord qui a été signé par les États-Unis et leurs partenaires européens pour établir un système de défense collective visant à garantir la paix et la stabilité futures en Europe. L'alliance est largement considérée comme une réponse aux préoccupations occidentales concernant l'expansionnisme soviétique d'après-guerre. Alors que l'OTAN prétend être de nature défensive, l'Union soviétique considère l'organisation comme une menace directe pour son indépendance.\n\n"

 NATO_vote_mission:0 "Voter sur §Y[NAT.GetCurrentNATOIssue]§!"
 NATO_vote_mission_desc:0 "Le Conseil de l'Atlantique Nord procède actuellement à un vote sur le §Y[NAT.GetCurrentNATOIssue]§!.\n\nLe vote se termine dans [?days_mission_timeout@NATO_vote_mission] jours."
