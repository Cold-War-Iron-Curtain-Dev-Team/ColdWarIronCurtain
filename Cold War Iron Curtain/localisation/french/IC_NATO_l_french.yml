 NATO_vote_no:0 "Votez §RContre§! §Y[NAT.GetCurrentNATOIssue]§!"
 NATO_vote_no_desc:0 "Voter contre fonctionne comme un §Rveto§!."
 NATO_vote_yes:0 "Votez §Gen faveur§! de §Y[NAT.GetCurrentNATOIssue]§!"

 NATO_vote_failure_tt:0 "Si le vote §Réchoue§!, l'OTAN §YIntégration politique§! sera diminuée de [?-5|+=0]."
