l_french:
 Political_Consequences_TT:0 "Cela entraînera à l'avenir §Ydes conséquences politiques§! lors des prochaines élections.\n\nProcédez avec précaution"

 NATO_ARTICLE_5_NO_TT:0 "§RN'est-il pas§! membre de §YOTAN§!"
 NATO_ARTICLE_5_TT:0 "Membre de §COTAN§! et soit §Y[ROOT.GetName]§! est un sujet de §Y[FROM.GetName]§!, §Y[FROM.GetName]§! est un sujet de §Y[ROOT.GetName]§! ou §RL'article 5§! a été invoqué."

 NATO_unity_title_label:0 "Conseil de l'Atlantique Nord"
 NATO_council_title_label:0 "Conseil de l'Atlantique Nord"

 NATO_military_title:0 "Coopération militaire"
 NATO_political_title:0 "Intégration politique"

 NATO_military_operability_bar_tt:0 "OTAN §YCoopération militaire§! est actuellement §Y[?NAT.NATO_military_cooperation]§!/100."
 NATO_military_operability_bar_tt_long:0 "L'OTAN rassemble une variété d'armées nationales fières, historiques et célèbres. Beaucoup de ces forces ont leurs propres points de vue et pratiques opérationnelles. Toutefois, pour que l'OTAN soit véritablement efficace, ses membres doivent travailler ensemble et intégrer leurs forces militaires pour faire face efficacement à toute menace pesant sur l'alliance.\n\nLe niveau de coopération militaire §Yde l'OTAN§! mesure le niveau d'organisation et d'habitude des forces militaires de l'OTAN à travailler ensemble. L'augmentation de §Yde coopération militaire§! débloque progressivement des bonus de plus en plus puissants."

 NATO_military_1_idea: "Niveau 1 - Quartier général suprême des puissances alliées en Europe"
 NATO_military_1_tt:0 "[GetNATOMilitary1Status][!NATO_military_1_click]"
 NATO_military_1_unlocked:0 "Nous §Gavons§! au moins 20 §YCoopération militaire§!, déverrouillage "
 NATO_military_1_locked:0 "Nous §Rdevons avoir§! au moins 20 §YCoopération militaire§! pour débloquer "
 NATO_military_1_tt_long:0 "Après des mois de planification, le Grand Quartier général des puissances alliées en Europe ou SHAPE a été activé. Le commandant suprême allié en Europe contribuera à superviser l'organisation et la structure des commandements de l'OTAN dans toute l'Europe, avec l'aide d'un commandant adjoint de l'air, d'un adjoint de la marine et d'un adjoint du commandant suprême allié. Sur le plan tactique, les différentes forces de l'OTAN restent divisées, mais le SHAPE contribuera à intégrer la planification stratégique de l'organisation."

 NATO_military_2_idea: "Niveau 2 - Accord sur le statut des forces"
 NATO_military_2_tt:0 "[GetNATOMilitary2Status][!NATO_military_2_click]"
 NATO_military_2_unlocked:0 "Nous §Gavons§! au moins 40 §YCoopération militaire§!, déverrouillage "
 NATO_military_2_locked:0 "Nous §Rdevons avoir§! au moins 40 §YCoopération militaire§! pour débloquer "
 NATO_military_2_tt_long:0 "Les États-Unis et leurs alliés de l'OTAN ont récemment signé une série d'accords sur le statut des forces définissant les droits et privilèges du personnel militaire de l'OTAN servant hors de leur pays sur le territoire allié. Ces politiques claires contribueront grandement à encourager la coopération militaire et à apaiser les populations locales face à la présence de personnel militaire étranger.\n\n§YL'OTAN deviendra une faction.§!"

 NATO_military_3_idea: "Niveau 3 - Poste de secrétaire général établi"
 NATO_military_3_idea_modifier_tooltip:0 "§GDes exercices majeurs de l'OTAN seront organisés régulièrement§!"
 NATO_military_3_tt:0 "[GetNATOMilitary3Status][!NATO_military_3_click]"
 NATO_military_3_unlocked:0 "Nous §Gavons§! au moins 50 §YCoopération militaire§!, déverrouillage "
 NATO_military_3_locked:0 "Nous §Rdevons avoir§! au moins 50 §YCoopération militaire§! pour débloquer "
 NATO_military_3_tt_long:0 "Dès le début, il a été reconnu que s'appuyer uniquement sur des contacts militaires entre les membres de l'OTAN pourrait donner lieu à des controverses politiques ou diplomatiques involontaires. À ce titre, l'OTAN devait créer un poste de secrétaire général et nommer un haut fonctionnaire pour contribuer à renforcer les contacts diplomatiques et politiques entre les membres de l'OTAN et à résoudre les tensions qui pourraient surgir entre les États membres. La cohésion diplomatique et politique est un élément essentiel pour renforcer l'intégration militaire de l'alliance."

 NATO_military_4_idea: "Niveau 4 - Exercices réguliers"
 NATO_military_4_tt:0 "[GetNATOMilitary4Status][!NATO_military_4_click]"
 NATO_military_4_unlocked:0 "Nous §Gavons§! au moins 75 §YCoopération militaire§!, déverrouillage "
 NATO_military_4_locked:0 "Nous §Rdevons avoir§! au moins 75 §YCoopération militaire§! pour débloquer "
 NATO_military_4_tt_long:0 "Les exercices militaires permettent aux commandants de tester l'état de préparation au combat, les nouvelles technologies, les stratégies, l'intégration des unités et la cohésion. Sous la direction du SHAPE, l'OTAN a décidé de mettre en oeuvre des exercices militaires réguliers de ses commandements terrestres, aériens et maritimes. Là où auparavant les exercices militaires étaient sous le contrôle et la direction d'un État-nation, ces nouveaux exercices seront dirigés par l'OTAN elle-même, permettant ainsi au personnel de plusieurs États alliés de mener les exercices ensemble comme un seul.\n\nDes exercices militaires annuels auront lieu.§!"

 NATO_military_5_idea: "Niveau 5 - Force de réponse rapide"
 NATO_military_5_tt:0 "[GetNATOMilitary5Status][!NATO_military_5_click]"
 NATO_military_5_unlocked:0 "Nous §Gavons§! au moins 90 §YCoopération militaire§!, déverrouillage "
 NATO_military_5_locked:0 "Nous §Rdevons avoir§! au moins 90 §YCoopération militaire§! pour débloquer "
 NATO_military_5_tt_long:0 "La défense collective est le fondement de l'OTAN. Une force de réponse rapide peut permettre à l'alliance de fournir immédiatement un soutien au titre de l'article V à un État membre attaqué. Cela confère à l'alliance de la crédibilité et un effet dissuasif sur les puissances hostiles. Cependant, une telle force nécessite des contributions de tous les États membres, des mois de formation intégrée et des exercices réguliers pour garantir que toutes les forces militaires qui contribuent à la force sont opérationnellement sur la même longueur d'onde.\n\nDébloque §YForce de réponse rapide§! Décisions§!"

 NATO_political_integration_bar_tt:0 "OTAN §YIntégration politique§! est actuellement §Y[?NAT.NATO_political_integration]§!/100."
 NATO_political_integration_bar_tt_long:0 "L'OTAN §YL'intégration politique§! est une mesure du degré d'unité des membres de l'OTAN sur la scène internationale. L'augmentation de §YIntégration politique§! débloque progressivement des bonus plus puissants."

 NATO_political_1_idea: "Niveau 1 - Programme scientifique"
 NATO_political_1_tt:0 "[GetNATOPolitical1Status][!NATO_political_1_click]"
 NATO_political_1_unlocked:0 "Nous §Gavons§! au moins 15 §YIntégration politique§!, déverrouillant "
 NATO_political_1_locked:0 "Nous §Rdevons avoir§! au moins 15 §YIntégration politique§! pour débloquer "
 NATO_political_1_tt_long:0 "L'OTAN doit voir au-delà de la simple coopération militaire. Encourager la collaboration entre les États membres, en particulier dans d'autres domaines, renforcera la cohésion au sein de l'alliance et contrecarrera la propagande hostile. La coopération peut également contribuer à garantir que l'OTAN reste technologiquement et économiquement dominante face à ses adversaires. L'établissement d'un programme scientifique soutiendrait de tels efforts. Ce groupe encouragera et accordera des subventions pour soutenir la coopération des scientifiques des États de l'OTAN pour mener des projets qui soutiennent la vision stratégique de l'alliance."

 NATO_political_2_idea: "Niveau 2 - Communauté de développement atomique de l'Atlantique Nord"
 NATO_political_2_tt:0 "[GetNATOPolitical2Status][!NATO_political_2_click]"
 NATO_political_2_unlocked:0 "Nous §Gavons§! au moins 35 §YIntégration politique§!, déverrouillant "
 NATO_political_2_locked:0 "Nous §Rdevons avoir§! au moins 35 §YIntégration politique§! pour débloquer "
 NATO_political_2_tt_long:0 "La recherche atomique offre une énergie potentiellement illimitée et d'autres avantages à ceux qui peuvent utiliser efficacement son potentiel. La Communauté de développement atomique de l'Atlantique Nord proposée rassemblera les meilleurs experts et scientifiques en matière atomique de toute l'OTAN pour garantir qu'aucun membre de l'alliance ne soit à la traîne dans la recherche atomique et que les membres de l'OTAN puissent maximiser les avantages de cette recherche."

 NATO_political_3_idea: "Niveau 3 - Banque de l'Atlantique Nord"
 NATO_political_3_tt:0 "[GetNATOPolitical3Status][!NATO_political_3_click]"
 NATO_political_3_unlocked:0 "Nous §Gavons§! au moins 50 §YIntégration politique§!, déverrouillant "
 NATO_political_3_locked:0 "Nous §Rdevons avoir§! au moins 50 §YIntégration politique§! pour débloquer "
 NATO_political_3_tt_long:0 "Il existe un grand intérêt au sein de l'OTAN pour la création d'une institution financière pour l'alliance, appelée Banque de l'Atlantique Nord. Cette institution financière fonctionnerait dans tous les États de l'OTAN. Tous les États membres fourniraient l'investissement initial de la nouvelle banque, qui se concentrerait sur l'octroi de prêts financiers à faible taux d'intérêt aux États membres cherchant à moderniser leurs capacités de défense ou à mettre en place une infrastructure de défense conforme aux normes de l'OTAN."

 NATO_political_4_idea: "Niveau 4 - Zone de libre-échange atlantique"
 NATO_political_4_tt:0 "[GetNATOPolitical4Status][!NATO_political_4_click]"
 NATO_political_4_unlocked:0 "Nous §Gavons§! au moins 75 §YIntégration politique§!, déverrouillant "
 NATO_political_4_locked:0 "Nous §Rdevons avoir§! au moins 75 §YIntégration politique§! pour débloquer "
 NATO_political_4_tt_long:0 "De hauts responsables de l'OTAN estiment que la prochaine évolution de l'OTAN, qui ne sera plus seulement une alliance défensive, passe par la création d'une zone de libre-échange atlantique. Cette zone de libre-échange proposée rassemblerait tous les membres de l'OTAN en Amérique du Nord et en Europe dans un bloc de libre-échange unifié, sans aucun doute le plus riche au monde. Les avantages économiques et l'intégration unifieraient les États membres et contribueraient à garantir que les membres de l'alliance ne deviennent pas dépendants de partenaires non-OTAN potentiellement hostiles ou peu fiables."

 NATO_political_5_idea: "Niveau 5 - Monnaie commune de l'Atlantique Nord"
 NATO_political_5_tt:0 "[GetNATOPolitical5Status][!NATO_political_5_click]"
 NATO_political_5_unlocked:0 "Nous §Gavons§! au moins 90 §YIntégration politique§!, déverrouillant "
 NATO_political_5_locked:0 "Nous §Rdevons avoir§! au moins 90 §YIntégration politique§! pour débloquer "
 NATO_political_5_tt_long:0 "Les citoyens des États membres de l'OTAN bénéficient de déplacements faciles, ainsi que de liens commerciaux, culturels et bien sûr militaires solides. Afin de consolider davantage l'alliance et les liens profonds entre ses peuples, des propositions sont désormais proposées visant à établir une nouvelle monnaie commune de l'Atlantique Nord. Les avantages pour le commerce et les transactions commerciales au sein de l'alliance seraient immédiats. La concurrence économique, des coûts réduits et un niveau de vie plus élevé seraient accessibles à tous les citoyens de l'OTAN."

 NATO_espionage_integration_bar_tt:0 "OTAN §YCollaboration en matière d'espionnage§! est actuellement §Y[?NAT.NATO_espionage_integration]§!/100."
 NATO_espionage_integration_bar_tt_long:0 "Le renseignement est mené par tous les États, souvent clandestinement. Les nations gardent souvent jalousement leurs capacités de renseignement. L'OTAN reconnaît toutefois que l'intégration des agences de renseignement de ses alliés peut présenter des avantages majeurs pour l'alliance. Plus important encore, cela peut permettre à l'organisation de garantir que les renseignements peuvent être coordonnés efficacement afin de maximiser les bénéfices pour l'alliance et ses membres.\n\nLa collaboration OTAN §Yen matière d'espionnage§! est une mesure du degré de coordination des membres de l'OTAN dans le partage de renseignements et les opérations secrètes. L'augmentation de §YCollaboration d'espionnage§! débloque progressivement des bonus plus puissants."
 
 NATO_espionage_1_idea: "Niveau 1 - Restez derrière les réseaux"
 NATO_espionage_1_tt:0 "[GetNATOEspionage1Status][!NATO_espionage_1_click]"
 NATO_espionage_1_unlocked:0 "Nous §Gavons§! au moins 15 §YEspionnage Collaboration§!, déverrouillage "
 NATO_espionage_1_locked:0 "Nous §Rdevons avoir§! au moins 15 §YEspionage Collaboration§! pour débloquer "
 NATO_espionage_1_tt_long:0 "Les responsables du renseignement et de l'armée, notamment du Royaume-Uni, reconnaissent l'efficacité des organisations partisanes et de résistance dans la lutte contre l'Axe. Si les Soviétiques finissaient par lancer leur propre invasion massive du territoire de l'OTAN, de tels réseaux pourraient s'avérer essentiels pour immobiliser et retarder les forces soviétiques. Gagner un temps critique pour une contre-attaque. Pour préparer de tels efforts, les agences de renseignement de l'OTAN peuvent coopérer pour établir des caches d'armes et préparer clandestinement des réseaux de forces paramilitaires qui peuvent être activées en tant que mouvement de résistance en cas d'occupation soviétique.\n\nActivez les opérations Stay-Behind §Y(Opération Gladio).§!"

 NATO_espionage_2_idea: "Niveau 2 - Comité clandestin allié"
 NATO_espionage_2_tt:0 "[GetNATOEspionage2Status][!NATO_espionage_2_click]"
 NATO_espionage_2_unlocked:0 "Nous §Gavons§! au moins 35 §YEspionnage Collaboration§!, déverrouillage "
 NATO_espionage_2_locked:0 "Nous §Rdevons avoir§! au moins 35 §YEspionnage Collaboration§! pour débloquer "
 NATO_espionage_2_tt_long:0 "Les réseaux restants doivent être supervisés et dirigés par l'OTAN, c'est pourquoi la création du Comité clandestin allié a été proposée. Le comité superviserait, coordonnerait et fournirait directement une orientation à tous les réseaux stay Behind établis par l'OTAN. Cela garantira que les réseaux ne soient pas activés prématurément, laissés au dépourvu ou sans financement, ou que les zones vulnérables ne soient pas laissées sans actifs appropriés."

 NATO_espionage_3_idea: "Niveau 3 - Coopération informelle à l'étranger"
 NATO_espionage_3_tt:0 "[GetNATOEspionage3Status][!NATO_espionage_3_click]"
 NATO_espionage_3_unlocked:0 "Nous §Gavons§! au moins 50 §YEspionnage Collaboration§!, déverrouillage "
 NATO_espionage_3_locked:0 "Nous §Rdevons avoir§! au moins 50 §YEspionnage Collaboration§! pour débloquer "
 NATO_espionage_3_tt_long:0 "Alors que les agences de renseignement des membres de l'OTAN continuent de coopérer et de coordonner leurs efforts, il devient de plus en plus utile pour l'OTAN d'encourager ses membres à coopérer de manière informelle sur des territoires extérieurs à l'OTAN. Le fait que des responsables du renseignement à l'étranger engagent, coopèrent et partagent des renseignements, en dehors des normes institutionnelles, renforcera les efforts clandestins de collecte de renseignements et de conduite d'opérations secrètes."

 NATO_espionage_4_idea: "Niveau 4 - École internationale de patrouille de reconnaissance à longue portée"
 NATO_espionage_4_tt:0 "[GetNATOEspionage4Status][!NATO_espionage_4_click]"
 NATO_espionage_4_unlocked:0 "Nous §Gavons§! au moins 75 §YCollaboration d'espionnage§!, déverrouillage "
 NATO_espionage_4_locked:0 "Nous §Rdevons avoir§! au moins 75 §YEspionage Collaboration§! pour débloquer "
 NATO_espionage_4_tt_long:0 "La création d'une École internationale de patrouille de reconnaissance à longue portée permettra aux membres de l'OTAN de partager leurs expériences et de dispenser une formation uniforme sur les opérations de reconnaissance à longue portée. De nombreux États membres manquent d'expérience dans une capacité de renseignement militaire aussi cruciale ; une telle école renforcerait les efforts de l'OTAN pour identifier les intentions soviétiques hostiles."

 NATO_espionage_5_idea: "Niveau 5 - Centre de fusion du renseignement"
 NATO_espionage_5_tt:0 "[GetNATOEspionage5Status][!NATO_espionage_5_click]"
 NATO_espionage_5_unlocked:0 "Nous §Gavons§! au moins 90 §YCollaboration d'espionnage§!, déverrouillage "
 NATO_espionage_5_locked:0 "Nous §Rdevons avoir§! au moins 90 §YEspionage Collaboration§! pour débloquer "
 NATO_espionage_5_tt_long:0 "Le Centre de fusion du renseignement sera l'exemple même du partage de renseignements au sein de l'OTAN. Il rassemblera sous un même toit toutes les principales agences de renseignement de l'OTAN. Les informations peuvent être échangées en temps réel, les ressources maximisées et les données provenant de sources multiples peuvent être fusionnées pour garantir que l'OTAN reste informée de tous les renseignements dont elle a besoin pour mener à bien sa mission."


