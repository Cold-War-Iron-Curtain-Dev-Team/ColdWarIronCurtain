l_french:
 flavorsov.1.t:0 "[GetNewspaperHeader]Spoutnik"
 flavorsov.1.d:0 "L'Union soviétique a mis Spoutnik en orbite. Le signal radio du satellite peut être capté depuis le sol."
 flavorsov.1.a:0 "Le satellite est en place."
 flavorsov.1.b:0 "Moscou a un satellite."
 flavorsov.2.t:0 "[GetNewspaperHeader]Gagarine tourne autour de la Terre"
 flavorsov.2.d:0 "Youri Gagarine a fait le tour de la Terre et en est revenu. Personne ne l'a fait auparavant."
 flavorsov.2.a:0 "Un homme a orbité."
 flavorsov.2.b:0 "Gagarine est de retour."
 flavorsov.3.t:0 "[GetNewspaperHeader]Tchernobyl"
 flavorsov.3.d:0 "Un réacteur de Tchernobyl a explosé. Un nuage radioactif quitte la centrale et Moscou n'a pas encore précisé l'ampleur des dégâts."
 flavorsov.3.a:0 "Le réacteur est ouvert."
 flavorsov.3.b:0 "Un réacteur a explosé."
 flavorsov.4.t:0 "[GetNewspaperHeader]Le retrait afghan"
 flavorsov.4.d:0 "Les dernières troupes soviétiques quittent l'Afghanistan. La guerre de Moscou, commencée en 1979, est terminée. Le gouvernement de Kaboul demeure."
 flavorsov.4.a:0 "L'armée rentre à la maison."
 flavorsov.4.b:0 "Les Soviétiques s'en vont."
