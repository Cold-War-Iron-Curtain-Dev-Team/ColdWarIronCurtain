 #Country
 DOM_MIL.1.d:0 "La République dominicaine a demandé l'autorisation d'acheter de nouveaux avions pour développer sa force aérienne, face aux défis régionaux croissants. Le gouvernement a comme liste de souhaits des chasseurs et des bombardiers. Bien que les Dominicains insistent sur le fait que leur programme est destiné à leur propre défense, les discours et la position du gouvernement actuel indiquent qu'il recherche de telles armes pour potentiellement étendre son influence dans la région. En, nos services de renseignements estiment que le gouvernement dominicain n'hésitera peut-être pas à recourir à la force militaire pour résoudre les différends régionaux ou nationaux. En conséquence, certains conseillent de nous opposer à toute tentative dominicaine d'étendre sa puissance aérienne, que ce soit par notre intermédiaire ou par nos alliés. Accepter la demande dominicaine renforcerait leur détermination anticommuniste et améliorerait les liens. Cependant, cela pourrait s'aliéner d'autres puissances caribéennes et conduire à des conflits régionaux, susceptibles de renforcer les communistes dans la région."
 DOM_MIL.2.d:0 "Les États-Unis ont accédé à notre demande d'étendre l'armée de l'air en acquérant de nouveaux avions. Les Caraïbes sont confrontées à des menaces croissantes de la part des communistes, des rebelles et des régimes agressifs. Avec une force aérienne en expansion, nous serons en mesure de relever ces défis, de préserver l'ordre et de protéger notre frontière. L'Armée de l'Air finalise actuellement sa liste de besoins en avions avec les États-Unis alors que nous insistons sur un transfert rapide des moyens. Le gouvernement américain considère clairement la République dominicaine comme une avant-garde de la région."
 DOM_MIL.3.d:0 "Les États-Unis ont rejeté notre demande d'étendre l'armée de l'air en acquérant de nouveaux avions. Nous pensons que les ennemis et les opposants de la nation dominicaine sont responsables du sabotage de cet effort. Un plan de secours visant à approcher ensuite le Canada pour obtenir des avions a également été rejeté, nos anciens occupants les obligeant à mettre fin à ces pourparlers. La République dominicaine se trouve à un moment critique, confrontée à des menaces de toutes parts, et nous devons être l'avant-garde des Caraïbes. Malgré ce revers, des agents et des diplomates seront dépêchés pour trouver des sources alternatives."
 DOM_Nationalism.1.d:0 "Le président Raphael Trujillo prône depuis longtemps une frontière forte, en expulsant dans un premier temps les Haïtiens et en favorisant un sentiment de patriotisme parmi ceux qui vivent dans les provinces frontalières. Cela a été fait à travers des politiques militaires, économiques, religieuses et éducatives. Dans le cadre de ce programme continu, le gouvernement a annoncé une série de nouvelles incitations, appelant les Dominicains à se déplacer et à régler la frontière avec Haïti. Depuis les années 1930, de nouvelles écoles, hôpitaux, routes, logements et bâtiments ont transformé la frontière en vitrine de la culture dominicaine. Les enseignants, les professionnels et les ouvriers se voient offrir des incitations pour renforcer les efforts visant à assurer la création d'une nation dominicaine unie."
 Antihatianismo_DOM.1.d:0 "Les tensions avec Haïti existent depuis des décennies, mais le président Raphael Trujillo a transformé le sentiment antihatianisme commun au sein de la population en politique d'État. Après avoir pris le pouvoir dans les années 1930, le président Trujillo a supervisé l'expulsion forcée de milliers d'« Haïtiens » de la frontière, y compris des populations noires hispanophones qui vivaient dans ces communautés depuis des générations. Il y a également eu des violences généralisées, notamment des massacres commis par des soldats dominicains. Trujillo a également lancé une grande campagne culturelle, avec le soutien d'intellectuels dominicains, pour contester la culture vaudou avec le catholicisme. Ces actions ont largement légitimé la violence anti-haïtienne et ont placé la population haïtiano-dominicaine dans une position de grande peur et d'insécurité."
 DOM_Political.1.d:0 "Le président a ordonné au ministère des Affaires étrangères et aux services de renseignement d'envoyer des ressources et des agents pour améliorer le soutien à la République dominicaine aux États-Unis. Nos ennemis ont longtemps propagé un discours hostile à l'égard de notre nation, et il faut lutter contre cela par tous les moyens. Notre gouvernement bénéficie de contacts étroits à Miami, notamment avec des hommes d'affaires américains étroitement liés aux casinos caribéens. Ces hommes ont des associés à travers les États-Unis qui peuvent faciliter des réunions secrètes avec d'importants dirigeants du Congrès pour proposer des dons. En outre, ces contacts peuvent aider à mettre en place des opérations visant à attirer les fonctionnaires dans des circonstances compromettantes, notamment avec les femmes. Ces informations peuvent également être essentielles pour faire entendre notre point de vue à Washington."
 DOM_Political.2.d:0 "Le Vatican et la République Dominicaine ont officiellement signé un Concordant. Cela formalise et définit la relation entre l'Église catholique et le gouvernement. L'accord voit le catholicisme élevé au rang de religion d'État officielle du pays, même si la liberté de religion reste garantie. L'Église recevra de faibles charges et aura accès aux fonds publics. Les seules cérémonies religieuses reconnues par le gouvernement seront celles célébrées par l'Église. Le catholicisme étant profondément ancré dans la vie de la plupart des Dominicains, l'accord est largement salué par la population. Le président Raphael Trujillo espère que cet accord renforcera sa popularité et garantira que le Vatican conserve une influence limitée dans les affaires politiques de l'État."
 DOM_Cuba.0.d:0 "Dans une démonstration de violence époustouflante et effrontée, la Légion mercenaire des Caraïbes a tenté de lancer une invasion de notre nation depuis Cuba. Le gouvernement cubain a ouvertement soutenu cet effort, en fournissant du matériel, des armes et du leadership aux voyous armés qui cherchaient à renverser impitoyablement notre gouvernement démocratique. Le complot n'a pris fin qu'après que nos efforts diplomatiques ont convaincu les États-Unis d'intervenir et de forcer le gouvernement cubain à agir contre les envahisseurs. Quelques jours plus tard, les Cubains ont relâché les mercenaires. Nous croyons fermement au non-interventionnisme, mais la Légion des Caraïbes et ses membres ambitieux, menés par Cuba, sont résolument déterminés à poursuivre leur politique actuelle de violence. La République dominicaine doit se préparer à de futures tentatives d'intervention étrangère."
 DOM_Cuba.4.d:0 "La République dominicaine a demandé une aide immédiate car elle fait face à une hostilité accrue de la part de Cuba. Le président dominicain a souligné que le gouvernement cubain avait déjà soutenu un complot communiste manqué visant à envahir son pays et qu'il cherchait sans aucun doute d'autres voies d'agression. Il souhaite un soutien immédiat pour renforcer son gouvernement et démontrer face aux menaces étrangères que les États-Unis restent engagés. Nos analystes estiment que le gouvernement dominicain actuel est fermement anticommuniste et qu'accepter sa demande renforcera son régime contre les menaces communistes potentielles, car il y avait d'éminents communistes parmi le complot de la Ligue des Caraïbes. Il convient toutefois de noter que fournir une telle aide pourrait aliéner d'autres puissances régionales, y compris Cuba, et encourager la République dominicaine à envisager sa propre campagne d'aventurisme militaire, ce qui pourrait conduire à une instabilité plus large."
 DOM_Cuba.5.d:0 "Les États-Unis ont accepté de nous fournir une aide immédiate alors que nous sommes confrontés à la menace de Cuba et des voyous communistes. Nos renseignements sur les communistes impliqués dans le récent complot ont aidé les États-Unis à prendre la bonne décision. Une fois de plus, un complot visant à briser notre nation a non seulement été déjoué, mais nous en sommes ressortis plus forts qu'avant."
 DOM_Cuba.6.d:0 "Les États-Unis, malgré les preuves évidentes que notre sécurité nationale est en danger, ont refusé notre demande d'aide immédiate. Le gouvernement américain a affirmé qu'il ne considérait pas notre situation comme nécessitant un afflux d'aide, soulignant que le récent incident impliquant la Légion des Caraïbes avait été réglé avant qu'un conflit armé n'éclate. Ils ont également écarté nos inquiétudes quant au rôle des communistes dans le complot. Les États-Unis punissent clairement notre politique étrangère indépendante et sont sans aucun doute impliqués dans des complots contre notre peuple. Malgré ce revers, nous resterons déterminés à garantir la paix et la prospérité."
 DOM_Cuba.8.d:0 "Le président Trujillo de la République dominicaine a offert un soutien financier pour nous aider dans la lutte contre les bandits communistes. Ils prétendent reconnaître la menace existentielle que cette idéologie fait peser sur les Amériques et veulent nous aider dans cette lutte. Ce soutien montre que nous ne sommes pas seuls au monde et qu'au moins la République dominicaine se soucie des intérêts de la nation cubaine. Malgré cette excellente nouvelle, certains se méfient des intentions de Trujillo et se demandent s'il est sage d'accepter quoi que ce soit de son régime."
 DOM_Cuba.20.d:0 "Les révolutionnaires cubains ne cachent pas leur mépris envers la République dominicaine. Fidel Castro continue de menacer notre régime et leur récente tentative de déclencher une rébellion indique qu'ils n'hésiteront pas à exporter leur révolution. Le président Trujillo, dans sa vigilance pour défendre sa nation, a appelé les forces armées de la République dominicaine à commencer les préparatifs pour libérer Cuba et venger leur récente agression. Les forces armées courageuses doivent accroître leur état de préparation à mesure que des plans sont élaborés. La question de savoir si le plan sera une action directe ou une opération secrète sera décidée dans les semaines à venir."
 DOM_Cuba.22.d:0 "L'homme fort de la République dominicaine, le président Trujillo, a demandé notre aide dans son projet de libération de Cuba de Fidel Castro. Trujillo est furieux de la récente incursion cubaine sur son territoire et des déclarations de La Havane appelant les Dominicains à se soulever. La République dominicaine a renforcé ces dernières années ses capacités militaires, mais elle a désespérément besoin d'un afflux d'aide militaire et de conseillers pour franchir la prochaine étape dans un éventuel effort de libération de Cuba. Nos analystes pensent que Trujillo cherche désespérément à renforcer sa propre position, mais il est déterminé à s'opposer à Cuba. Cependant, il reste sceptique quant à l'impact majeur de l'aide et pourrait simplement encourager les révolutionnaires à étendre leurs opérations dans la région."
 DOM_Cuba.23.d:0 "Les États-Unis ont accepté de fournir une aide militaire et des conseillers pour soutenir notre projet de libération de Cuba de la cabale communiste dirigée par Fidel Castro. Cette aide renforcera grandement nos capacités et donnera un élan majeur au projet. Plus important encore, ce soutien permet à nos courageux soldats de résister fermement à toute machination. Plus important encore, cet élargissement des liens nous donne accès aux moyens de renseignement américains qui joueront un rôle clé dans la poursuite de nos préparatifs. Castrol regrettera le jour où il a décidé de défier la République Dominicaine."
 DOM_Cuba.24.d:0 "Les États-Unis ont refusé de fournir une aide militaire et des conseillers pour soutenir notre projet de libération de Cuba de la cabale communiste dirigée par Fidel Castro. Ils estiment que la situation n'est pas adaptée à une telle opération, mais que cela pourrait changer à l'avenir. C'est un coup dur pour notre planification et nos capacités. Les Américains ne sont pas disposés à reconnaître la menace que représente Cuba, qui envisage sans aucun doute d'exporter sa révolution. Malgré ce revers, nous resterons vigilants et engagés en faveur de la cause visant à protéger la République dominicaine de la menace existentielle posée par Cuba."
 DOM_Cuba.25.d:0 "Après d'intenses discussions et planifications, nous avons décidé que la meilleure voie vers la libération de Cuba était d'utiliser des mercenaires. Ces soldats sous contrat ont les capacités nécessaires pour atteindre nos objectifs et ne pas permettre à la dictature cubaine de rallier la population contre une invasion étrangère. Les mercenaires formeront le noyau d'une nouvelle Légion caribéenne. Une fois que nous aurons choisi qui recruter, ils pourront être secrètement amenés en République Dominicaine et suivre la formation nécessaire à la mission. Les mercenaires, une fois établis, doivent s'associer aux combattants cubains anticastristes. Une fois la tête de pont établie, nos forces pourront alors rejoindre le combat. Parmi les principaux candidats figurent Osvaldo Ramírez, de plus en plus déçu par le régime, et William Morgan, un Américain qui a rejoint les révolutionnaires."
 DOM_Cuba.26.d:0 "Osvaldo Ramírez, qui a combattu aux côtés de Castro et de ses sbires, s'est brouillé avec le régime. Il est déçu par leur virage vers le marxisme et reconnaît leur politique comme étant préjudiciable au peuple cubain. Sa vaste expérience et son poste de commandant supérieur font de lui un choix idéal pour rallier une forte force d'opposition afin de rejoindre nos mercenaires une fois qu'ils seront établis sur l'île. Les contacts des services de renseignement sur l'île, facilités par la CIA, affirment que Ramirez peut être facilement persuadé, surtout si on lui offre de l'argent pour organiser les forces d'opposition."
 DOM_Cuba.27.d:0 "Le commandant William Morgan est un atout intrigant déjà établi à Cuba pour aider à organiser les forces d'opposition afin de nous aider à libérer l'île de Castro et de sa cabale. Un rapport des services de renseignement indique que Morgan soutiendrait nos efforts en échange d'une grosse somme d'argent. Une fois la moitié de l'argent déposée, Morgan garantira que ceux au sein du gouvernement cubain qui s'opposent à Castro seront prêts à rejoindre nos forces mercenaires. Avec un contact déjà en place, nous pouvons commencer les phases finales des préparatifs pour la libération de Cuba."
 DOM_Cuba.28.d:0 "Nos mercenaires poursuivent leurs préparatifs pour la libération de Cuba. Le plan appelle les Cubains anti-révolutionnaires à lancer un soulèvement contre Castro, une fois qu'il aura commencé, les mercenaires pourront ensuite être transportés par avion vers Cuba. Une fois que ces forces auront établi une tête de pont, les forces dominicaines pourront alors intervenir directement pour aider à mener la libération de Cuba. On dit que le président Trujillo est fou d'enthousiasme, surtout à l'annonce de la contrebande d'armes destinées aux forces anticastristes depuis Miami. La présence de mercenaires et leur formation restent un secret pour le reste du monde."
 DOM_Cuba.29.d:0 "Notre opération de libération de Cuba a été annulée. Le commandant Morgan, qui était notre interlocuteur clé dans l'organisation d'un soulèvement anticastriste, nous a complètement trahis. Le révolutionnaire américain a donné dès le début les détails du plan à Castro, trahissant le complot et aidant Castro à liquider ses opposants dans le pays. Les Cubains ont tenté de tendre un piège à la Légion caribéenne, mais nous avons reconnu leurs machinations et annulé l'invasion avant qu'elle ne conduise à un plus grand désastre. C'est une déception majeure."
 DOM_Cuba.32.d:0 "Nos mercenaires ont été insérés avec succès à Cuba pour rejoindre les combattants cubains anticastristes. Ces forces ont établi une tête de pont sur l'île. Nous pouvons désormais déclarer notre rôle et rejoindre le combat. Des ordres sont donnés pour le déploiement rapide de soldats pour aider à achever la libération de l'île des révolutionnaires cubains. Le président Trujillo envisage de s'adresser à la nation et aux forces armées. Il est temps que la République dominicaine prenne sa place et sauve la région d'un régime hostile."
 DOM_ELECTS.1.d:0 "La République dominicaine a annoncé qu'elle organiserait bientôt des élections générales et présidentielles dans le pays. Bien que le gouvernement qualifie les élections de démocratiques, il est entendu que le généralissime dominicain et président actuel, Rafael Trujillo, a le contrôle total car il a largement détruit toute opposition viable au fil des ans. Le président démissionnera, mais conservera son contrôle sur l'armée et le parti dominicain au pouvoir. Le président Trujillo préférerait que son frère, le général Hector Trujillo, soit élu et gouverne à travers lui. Cependant, certains conseillers lui suggèrent de s'orienter plutôt vers Joaquín Balaguer, un allié politique profondément fidèle. La sélection flagrante de son frère pourrait susciter des critiques internationales et on peut compter sur Balaguer. Alors que le président Trujillo réfléchit à qui choisir comme président, il doit soit y aller avec sa famille, soit faire confiance à un allié."
 #Global News
 DOM_Political.0.d:0 "À la suite d'élections controversées, Hector Trujillo a été élu « président de la République dominicaine ». Il était le seul candidat en lice après que son frère et ancien président Rafael Trujillo l'ait choisi comme son successeur. Rafael Trujillo a dirigé son pays d'une main de fer, écrasant toute opposition et consolidant son contrôle sur le parti dominicain et l'armée au pouvoir. Les résultats sont largement critiqués dans le monde de l'Amérique latine, beaucoup accusant Trujillo de diriger la République dominicaine comme un dictateur complet."
 Antihatianismo_DOM.2.d:0 "L'homme fort de la République dominicaine, Rafael Trujillo, est en visite à Port-au-Prince, la capitale haïtienne, symbolisant une transformation complète des relations entre les deux nations. Trujillo, qui a réprimé les Haïtiens et leur culture pendant des décennies, a récemment complètement changé de politique. La République dominicaine a levé son interdiction stricte de la langue et des traditions culturelles haïtiennes. Les frontières ont également été assouplies, avec de nouveaux programmes destinés à faciliter la circulation des travailleurs. Alors que beaucoup en Haïti continuent de tenir Trujillo pour responsable des massacres anti-haïtiens des années 1930, l'accueil chaleureux qu'il a reçu indique que sa nouvelle politique lui vaut un nouveau soutien. Le gouvernement haïtien a noté que cette visite cimente le renforcement des liens entre les peuples haïtien et dominicain."
 Trujillo_Foreign_Assasinations.1.d:0 "Le professeur de droit Jesus Galindez aurait disparu après être entré dans une station de métro de New York tard dans la nuit. Sa disparition est survenue après que le professeur ait exprimé ses craintes que le régime de Rafael Trujillo en République dominicaine n'envoie des agents pour l'expulser. Bien qu'aucun corps n'ait été retrouvé, les enquêteurs pensent qu'il est probablement déjà mort. Les partisans de la victime, les dirigeants politiques et les membres du Congrès rejettent tous la faute sur le gouvernement de la République dominicaine, qui a nié toute implication. Galindez était un critique majeur de la famille Trujillo et était sur le point de terminer un nouveau livre exposant leur corruption. Une source du FBI a souligné qu'un navire dominicain avait accosté et quitté New York en quelques heures, au moment où l'enlèvement présumé avait eu lieu. Le gouvernement des États-Unis a rappelé certains de ses diplomates et annulé des réunions avec des responsables dominicains, exprimant sa colère face à l'incident."
 DOM_OAS.2.d:0 "Après l'élection de Joaquín Balaguer à la présidence de la République dominicaine, le nouveau dirigeant a vigoureusement cherché à redorer l'image de sa nation sur la scène internationale. De nombreux membres de l'Organisation des États américains accusent la République dominicaine d'être une dictature répressive dirigée par Rafael Trujillo et aux ambitions régionales plus larges. Il y a également eu un certain nombre de manifestations de la part de groupes d'étudiants dans toute l'Amérique latine contre la répression politique dans le pays. Le président Balaguer promet du changement, soulignant ses efforts pour introduire lentement des réformes démocratiques et il a indiqué son désir de s'engager avec d'autres nations par la coopération et non par l'agression. Même s'il n'est pas clair comment l'OEA réagira à ces ouvertures, nombreux sont ceux de la République dominicaine qui accueilleraient favorablement une ouverture des liens avec le monde latino-américain."
 DOM_Cuba.1.d:0 "Ces dernières semaines, des rapports en provenance de Cuba indiquent que plus d'un millier de révolutionnaires cubains et dominicains suivaient des exercices d'entraînement en vue d'envahir la République dominicaine. Cette force, qui fait partie de la Légion des Caraïbes, serait intéressée à mettre fin au règne de Rafael Trujillo et à restaurer la démocratie en République dominicaine. Les autorités cubaines n'ont rien fait pour arrêter les préparatifs, ce qui a suscité des critiques de la part du gouvernement dominicain. Après que les États-Unis eurent fait pression, le gouvernement cubain arrêta les combattants de la Ligue des Caraïbes, mettant ainsi fin au complot. Mais en quelques jours, pratiquement tous les combattants furent libérés de prison. Le manque d'effort initial et la libération rapide des prisonniers auraient rendu Rafael Trujillo furieux."
 DOM_Cuba.3.d:0 "La République dominicaine a lancé une offensive diplomatique majeure contre le gouvernement cubain. Dans des déclarations cinglantes, ses responsables accusent les responsables cubains de s'ingérer de manière flagrante dans les affaires intérieures de la République dominicaine et de soutenir une agression armée contre le peuple dominicain. Cela survient quelques semaines après que les États-Unis ont fait pression sur Cuba pour qu'il empêche la Légion caribéenne de mener à bien son projet de débarquement de plus d'un millier de volontaires dominicains et cubains pour renverser le régime de Rafael Trujillo. La Légion des Caraïbes utilisait Cuba comme base d'opérations et ne faisait aucun effort pour cacher ses efforts. Un responsable du gouvernement cubain a souligné qu'il n'était pas de sa responsabilité de surveiller ou de contrôler les passions des ressortissants étrangers et que c'était peut-être le gouvernement dominicain qui devrait ajuster sa propre politique."
 DOM_Cuba.15.d:0 "Après plus d'une semaine de combats, l'armée dominicaine a annoncé avoir vaincu une invasion de l'île soutenue par Cuba. Les combats ont commencé lorsqu'un avion transportant soixante révolutionnaires dominicains et cubains a atterri en République dominicaine. Une semaine plus tard, d'autres combattants sont arrivés par yacht, cherchant à déclencher un soulèvement général contre le gouvernement dominicain. Ces forces ont été rapidement combattues par les forces dominicaines. Le gouvernement dominicain a rapidement condamné Cuba et, avec le soutien américain, il appellera à une réunion d'urgence de l'Organisation des États américains. Les dirigeants dominicains insistent sur le fait que Cuba sera tenu responsable et ils sont convaincus que l'OEA soutiendra leurs efforts visant à condamner Cuba pour avoir tenté d'exporter violemment sa révolution."
 DOM_Batista.1.d:0 "L'ancien président cubain Fulgencio Batista a fui avec sa famille et ses alliés vers la République dominicaine alors que son régime tombait aux mains de Fidel Castro et de ses révolutionnaires. L'arrivée de Batista, accompagné de sa suite et d'énormes sommes d'argent, a irrité l'homme fort dominicain Rafael Trujillo. Alors que Batista s'efforce d'obtenir un visa, il est détenu dans un hôtel de luxe, sous la surveillance attentive des forces dominicaines. Trujillo a clairement indiqué que si Batista souhaite quitter l'hôtel où qu'il obtienne son visa, il devra verser un paiement à la République dominicaine pour récupérer ses pertes. Un refus de paiement entraînerait des conséquences désastreuses, même si Batista et ses alliés ne savent pas exactement ce que cela entraînerait."
 DOM_Batista.2.d:0 "L'ancien président cubain en exil Fulgencio Batista a quitté la République dominicaine pour l'Espagne où lui et sa famille ont reçu des visas. Les rapports indiquent que Batista a dû laisser des millions de dollars à Rafael Trujillo afin de quitter la République dominicaine. L'homme fort dominicain a apparemment ressenti le besoin d'exiger une rançon après avoir découvert l'énorme somme d'argent emportée par la famille Batista alors qu'elle fuyait Cuba. Les observateurs notent que Batista et sa clique étaient détenus dans un hôtel de luxe mais avec de strictes restrictions sur leurs déplacements."
 DOM_Batista.3.d:0 "Les autorités de la République dominicaine ont annoncé que l'ancien président cubain Fulgencio Batista est décédé du jour au lendemain de causes naturelles. Batista a récemment fui vers la République dominicaine après avoir été évincé du pouvoir par les révolutionnaires. Ceux qui ont fui avec Batista, y compris ses proches alliés et sa famille, auraient déjà quitté le pays pour l'Espagne, sans le corps. Des rapports suggèrent que les autorités dominicaines ont saisi l'argent des exilés cubains avant de les autoriser à partir. Plus menaçant, des rumeurs suggèrent que la mort de Batista n'était peut-être pas naturelle. Sa famille n'a pas été autorisée à voir ni à prendre possession du corps. Un collaborateur de Batista a déclaré aux journalistes que l'ancien président avait été arrêté la nuit de sa mort. En outre, le dirigeant dominicain Rafael Trujillo aurait demandé une rançon à Batista. Peut-être que Batista a refusé, ce qui a entraîné son exécution par le gouvernement dominicain."
 DOM_OAS.1.d:0 "Les relations entre l'Organisation des États américains et la République dominicaine ont atteint un nouveau plus bas. De nombreux membres de l'OEA restent critiques à l'égard du président Hector Trujillo, notant que son élection et ses politiques suggèrent que son frère et ancien président, Rafael Trujillo, reste fermement à la tête du gouvernement dans les coulisses. En particulier, les membres de l'OEA ont exprimé leurs inquiétudes quant à la consolidation continue du pouvoir de la famille Trujillo et à son implication dans des activités suspectes. Le gouvernement dominicain a rejeté ces préoccupations, accusant l'OEA de partialité et d'ingérence active dans les affaires intérieures du peuple dominicain."
 DOM_Cuba.21.d:0 "Le dirigeant de la République Dominicaine, Rafael Trujillo, a fièrement annoncé la création d'une nouvelle Légion des Caraïbes. Il a qualifié la force multinationale d'essentielle pour garantir les intérêts de tous les peuples épris de démocratie et a noté que le groupe rassemble des peuples de toute la région. Il a souligné que la force était prête à défendre non seulement la République dominicaine mais aussi Haïti contre toute tentative du régime radical cubain d'exporter sa révolution. La Légion des Caraïbes sera également prête à aider le peuple cubain lorsqu'il reconnaîtra la corruption de Castro et de sa cabale. La Ligue des Caraïbes ne fait pas partie du gouvernement dominicain et est une organisation indépendante. Les analystes suggèrent que le gouvernement dominicain cherche à créer un déni plausible, car le groupe est probablement sous le contrôle total des autorités dominicaines."
 DOM_Cuba.30.d:0 "Le gouvernement cubain a annoncé qu'il avait contrecarré une tentative d'invasion de Cuba par la République dominicaine. Selon certaines informations, les autorités cubaines ont découvert un complot des autorités dominicaines visant à provoquer un soulèvement, à envoyer des mercenaires, puis à déployer leurs propres forces une fois qu'une tête de pont aurait été établie pour renverser le gouvernement. Cependant, l'homme engagé pour organiser le soulèvement cubain, le commandant William Morgan, a fini par trahir les Dominicains et a divulgué toutes les informations aux plus hauts responsables cubains. Après que les forces de sécurité cubaines eurent identifié ceux qui envisageaient de se joindre au soulèvement prévu, des centaines de personnes furent arrêtées, purgeant ainsi le gouvernement de nombreux éléments anticastristes. Les autorités cubaines ont également présenté des armes et de l'argent qui auraient été envoyés par des agents dominicains pour confirmer leurs affirmations. Le gouvernement dominicain a refusé de commenter, même si des informations indiquent que ses dirigeants sont furieux de cet échec massif."
 DOM_Cuba.31.d:0 "Des rapports en provenance de Cuba indiquent qu'une bataille armée a éclaté entre l'armée cubaine et une force rebelle. Les rebelles seraient des combattants cubains mécontents qui s'opposent au changement rapide vers le marxisme qui se produit sous Fidel Castro. Les autorités cubaines affirment que les rebelles sont soutenus par l'arrivée de mercenaires venus du sud. Ils pensent que le soulèvement et les mercenaires indiquent un complot étranger, probablement originaire de la République dominicaine. Les autorités dominicaines nient ces accusations, affirmant que le gouvernement cubain blâmera tout le monde, sauf lui-même, pour avoir poussé la population à l'action."
 DOM_Cuba.33.d:0 "Le dirigeant dominicain Rafael Trujillo s'est adressé à la nation, déclarant que les forces armées dominicaines se joindraient bientôt à la lutte pour libérer Cuba de Fidel Castro, déclarant la guerre à Cuba. Dans son discours, Trujillo a souligné que la République dominicaine était elle-même une victime de Castro qui avait tenté de déclencher un soulèvement il y a seulement quelques mois. Si le peuple dominicain n'agissait pas maintenant, la prochaine tentative pourrait voir une invasion cubaine massive soit de la République dominicaine, soit d'Haïti. Il a félicité les combattants de l'opposition cubaine pour leur courage et a déclaré qu'il n'abandonnerait pas leur courageuse lutte. Le gouvernement cubain a publié une déclaration cinglante contre Trujillo, affirmant qu'il est désormais clair que l'ensemble du soulèvement était un complot étranger orchestré. Tous les Cubains sont invités à se lever et à combattre toute force d'invasion."
 DOM_Cuba.34.d:0 "La République dominicaine a confirmé qu'elle n'avait plus de forces actives à Cuba et que les hostilités avaient cessé. Les responsables dominicains ont refusé de commenter davantage. Le gouvernement cubain serait d'humeur bruyante, avec des prisonniers capturés, du matériel et des armes défilés autour de La Havane. Fidel Castro a remercié les courageux soldats et le peuple cubains de s'être unis pour arrêter une invasion orchestrée par la dictature dominicaine. Les autorités cubaines ont également déclaré qu'elles pouvaient confirmer l'implication dominicaine dès le début, affirmant qu'elles détenaient des prisonniers pouvant confirmer qu'ils étaient des mercenaires payés et insérés par les autorités dominicaines une fois le soulèvement initial survenu. Les dirigeants d'autres pays critiquent la République dominicaine, un diplomate qualifiant l'ensemble du complot d'écervelé « et sans fondement ». Le sort des personnes capturées reste incertain."
 DOM_Cuba.35.d:0 "Les rebelles cubains, soutenus par la République dominicaine, ont réussi à prendre le pouvoir du régime révolutionnaire de Fidel Castro. Le combattant cubain Osvaldo Ramirez Garcia est le nouveau président de Cuba. Il a promis de rétablir rapidement la paix dans le pays, de la rendre à la communauté internationale et de renverser les politiques extrêmes du régime précédent. La République dominicaine s'est félicitée de cette nouvelle et a félicité le peuple cubain pour sa liberté. Les combats ont commencé après l'intervention des forces dominicaines pour soutenir un soulèvement anticastriste à Cuba. À ce stade, il est largement reconnu que l'ensemble du plan a probablement été dirigé et mis en oeuvre par le dirigeant dominicain Rafael Trujillo, qui voulait se venger d'une tentative du régime castriste d'infiltrer les révolutionnaires en République dominicaine. Pour Trujillo, la victoire à Cuba consolide son statut d'acteur majeur de la politique internationale caribéenne."

