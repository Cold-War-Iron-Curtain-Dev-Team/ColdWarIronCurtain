l_french:
 HUNGARIAN_REV.1.d:0 "Laszlo Rajk a récemment été réinterné avec deux autres victimes des purges d'après-Seconde Guerre mondiale initiées par le dirigeant hongrois Matyas Rakosi. Une foule de près de cent mille personnes a assisté à l'événement. Cela marque le point culminant d'une des nombreuses manifestations exigeant que Rakosi réhabilite Laszlo Rajk. Rajk était un dirigeant communiste populaire et fondateur de l'agence de sécurité AVH. Rakosi a récemment admis qu'il avait injustement fait juger et exécuter Rajk pour être titiste, sous la pression de Moscou. Bien que les aveux réels de Rakosi n'aient pas été publiés, nombreux sont ceux en Hongrie et au sein du parti qui remettent désormais en question la capacité du gouvernement actuel, composé de dirigeants sélectionnés par Rakosi. Cela renforce l'opposition contre Rakosi. Les communistes de la vieille garde sont mécontents de ces développements et accusent le Premier ministre soviétique [SOV.GetLeader] d'être à l'origine de cette nouvelle ouverture qui a permis aux gens de cibler de manière si flagrante la direction du parti."
 HUNGARIAN_REV.2.d:0 "À la suite de l'émoi suscité par le réinternement de Laszlo Rajk, les étudiants de Szeged ont pris leur propre position contre le régime communiste au pouvoir. Les étudiants ont réformé l'Union des étudiants hongrois des universités et des académies (MEFESZ). Cette organisation étudiante démocratique était interdite depuis longtemps sous le règne de Matyas Rakosi. Au lieu de cela, le seul syndicat étudiant autorisé était le communiste DISZ. En quelques jours, les étudiants ont créé le MEFESZ dans plusieurs autres villes. Cette dernière provocation indique que le peuple hongrois commence à perdre confiance dans le gouvernement communiste sous le contrôle des dirigeants choisis par Rakosi. Il semble que la question des syndicats étudiants soit une question mineure, mais de nombreux membres du Parti communiste hongrois craignent que cela ne fasse que créer une dynamique contre le parti et l'héritage de Rakosi qu'il cherche à maintenir."
 HUNGARIAN_REV.3.d:0 "Alors que les étudiants de toute la Hongrie expriment rapidement leurs opinions et aspirations politiques pour la première fois depuis des décennies, les étudiants de l'Institut technique de Budapest l'ont désormais rejoint. Ils ont produit une liste de seize revendications de politique nationale qui incluent, entre autres, des enquêtes sur le régime de Matyas Rakosi, des élections libres et la suppression de l'influence soviétique du pays. Les étudiants de Budapest ont également annoncé leur intention de rejoindre et de soutenir l'Union des écrivains alors qu'ils prévoient de déposer demain une couronne de fleurs devant la statue du célèbre héros de la révolution hongroise de 1848, le général polonais Jozef Bem. Cela doit être fait en solidarité avec les militants polonais qui luttent actuellement pour des réformes dans le pays. Cet événement risque désormais d'attirer des foules plus nombreuses que prévu. Face à ces événements qui se déroulent rapidement et à ces foules passionnées, il est très difficile pour le gouvernement de réagir."
 HUNGARIAN_REV.4.d:0 "Une foule massive de plusieurs dizaines de milliers de personnes s'est rassemblée devant la statue du célèbre général Jozef Bem pour déposer une couronne et offrir son soutien aux militants polonais qui luttent pour le changement. Peter Veres s'est adressé à la foule, appelant à l'indépendance de la Hongrie et à la libéralisation du système socialiste. La foule a chanté des chants patriotiques interdits et beaucoup ont commencé à découper les armoiries communistes sur le drapeau hongrois. La foule énergique s'est ensuite rendue au Parlement pour rejoindre les manifestants, portant le nombre de manifestations à plus de deux cent mille. Même si les manifestations n'ont pas tourné à la violence, elles sont énergiques et passionnées. De nombreux responsables du gouvernement communiste craignent désormais que la situation ne dégénère rapidement en anarchie."
 HUNGARIAN_REV.5.d:0 "À la lumière des récentes manifestations qui ont secoué Budapest, le premier secrétaire du Parti communiste hongrois, Erno Gero, s'est adressé au pays. Il a condamné les manifestants qui, plus tôt dans la journée, avaient formulé des revendications contre-révolutionnaires et incendiaires depuis la statue de Jozef Bem, puis organisé des violences dangereuses devant le Parlement. Il a déclaré que les manifestants n'avaient aucun droit et a rejeté toutes leurs revendications. Même si les partisans de la ligne dure du Parti seront satisfaits de ce discours, la première réaction des manifestants a été un mécontentement extrême. Ils ont le sentiment que le gouvernement ignore le peuple et ne lui accorde aucun respect, malgré son engagement en faveur de la non-violence et des manifestations pacifiques. Beaucoup sont désormais ouvertement devenus révolutionnaires."
 HUNGARIAN_REV.6.d:0 "En entendant l'émission d'Erno Gero, les manifestants agités ont décidé de mettre en oeuvre l'une de leurs revendications. Ils atteignirent le monument de Staline et démolirent la statue de Staline. La statue était un cadeau de l'Union soviétique en 1951 et était considérée comme un symbole de l'occupation étrangère de la Hongrie. Les manifestants ont attaqué la tête de la statue pour exprimer leur colère. À la fin, il ne restait que les pieds de la statue et un drapeau hongrois était placé dessus. À peu près au même moment, devant la station de radio, des manifestants et des membres de l'AVH ont commencé à s'affronter. Dans le chaos, l'AVH a ouvert le feu. Un jeune étudiant, Janos Vizi, a été tué sur le coup. Les manifestants ont enveloppé son corps dans un drapeau hongrois et l'ont emporté avec eux, attisant les passions des autres manifestants. Les troubles se sont encore intensifiés à Budapest et les manifestants ont désormais recours à la violence."
 HUNGARIAN_REV.7.d:0 "Depuis qu'Erno Gero s'est adressé à la nation, les manifestants se sont rassemblés devant la principale station de radio et ont envoyé une délégation pour rediffuser leurs revendications dans le pays. Cependant, l'agence de sécurité hongroise AVH a arrêté la délégation et a refusé ses demandes. Les rumeurs parmi les manifestants sur l'exécution de délégués ont poussé certains à tenter de prendre d'assaut le bâtiment. L'AVH a ouvert le feu, tuant les manifestants et lançant des gaz lacrymogènes sur la foule. Une tentative ratée d'apporter davantage d'armes avec une ambulance a encore aggravé la tension. Lorsque les troupes militaires sont arrivées pour relever l'AVH, les manifestants les ont acclamés alors que les soldats avaient retiré l'étoile rouge de leur chapeau. Lors des fusillades de l'AVH, les manifestants ont incendié des voitures de police et, plus important encore, des dépôts d'armes à Budapest ont été perquisitionnés. Les armes sont rapidement distribuées pour assurer la protection contre de nouvelles attaques gouvernementales."
 HUNGARIAN_REV.8.d:0 "Alors que la situation à Budapest devenait rapidement incontrôlable, le premier secrétaire du Parti communiste hongrois, Erno Gero, a appelé les forces soviétiques présentes dans le pays à intervenir. Gero a informé les Soviétiques que la situation avait dégénéré au-delà des capacités du gouvernement. Les forces soviétiques présentes dans le pays ont prévu cela et après plusieurs heures, le ministre soviétique de la Défense a autorisé le déploiement de chars à Budapest. Les forces soviétiques se sont déplacées tôt le matin et devraient prendre position au Parlement et aux carrefours clés en début d'après-midi."
 HUNGARIAN_REV.9.d:0 "Alors que les manifestants ciblent désormais la police, les bâtiments gouvernementaux et les symboles du régime communiste, l'agence de sécurité AVH a tenté d'intervenir. Sur les sites gouvernementaux assiégés, son personnel a ouvert le feu sur la foule, mais ces actions n'ont fait qu'exaspérer les manifestants, sans les disperser. L'ampleur et la propagation des manifestations ont réduit les déploiements de l'AVH et, les manifestants étant armés depuis des dépôts d'armes capturés, ils n'ont plus l'avantage de la puissance de feu. Les tentatives de déploiement de troupes hongroises pour soutenir l'AVH ont été rapidement abandonnées car les premiers déploiements ont vu les troupes rejoindre les manifestants. Les affrontements se sont poursuivis toute la nuit et tôt le matin. Là où les manifestants prennent le dessus, ils s'en prennent ouvertement aux membres de l'AVH."
 HUNGARIAN_REV.10.d:0 "Dans une tournure étonnante des événements, le Premier ministre hongrois a remis le pouvoir à Imre Nagy. Le leader communiste populaire a récemment été démis de ses fonctions de président du Conseil des ministres en raison de son appel aux réformes et de son opposition à l'ingérence soviétique. Dans son discours au pays, il a appelé au calme et a promis qu'il lancerait les réformes politiques nécessaires au pays. Cette annonce a légèrement apaisé les tensions, mais des affrontements sporadiques se poursuivent et des informations indiquent que les manifestants continuent de s'armer. Bien que Nagy jouisse de la confiance du public, l'arrivée des forces soviétiques à Budapest et les affrontements continus avec l'AVH font craindre à beaucoup de gens que le nouveau Premier ministre ne dispose pas des moyens nécessaires pour contrôler la situation."
 HUNGARIAN_REV.11.d:0 "L'intervention soviétique a été chaotique, les chars étant piégés par les barricades érigées par les manifestants. La situation de l'AVH a continué à se détériorer, ses forces étant chassées de la station de radio et de plus en plus sous-équipées en armes. Les troupes soviétiques rassemblées devant le Parlement se sont heurtées à des foules massives. Les membres de l'AVH ont tiré sur les manifestants depuis les bâtiments voisins, ce qui a amené les Soviétiques à cibler l'AVH, croyant que c'était eux qui étaient attaqués. Au milieu de la confusion, des manifestants armés ont pris pour cible les deux camps, exaspérant encore davantage la tension et le chaos. Au cours des jours suivants, des conseils révolutionnaires se sont formés pour coordonner la résistance armée, ce qui a entraîné de lourdes pertes pour les Soviétiques et l'AVH. Le Parti communiste hongrois a également dû faire face à de violentes représailles de la part de ces révolutionnaires. L'armée hongroise étant peu disposée à intervenir, un cessez-le-feu fut finalement conclu par le Premier ministre Irme Nagy et les Soviétiques acceptèrent de se retirer de Budapest dans leurs garnisons."
 HUNGARIAN_REV.12.d:0 "Le président Mao a écrit une lettre exhortant le dirigeant soviétique [SOV.GetLeader] à faire preuve de patience et à ne pas intervenir dans la crise hongroise actuelle. Auparavant, le gouvernement avait exprimé son soutien à une intervention et les Soviétiques appréciaient notre point de vue sur la question. Cependant, cette lettre changerait notre position et pourrait influencer [SOV.GetLeader] qui s'inquiète de la façon dont le monde communiste au sens large percevrait une deuxième intervention. Nous devons décider si nous devons faire en sorte que la lettre atteigne immédiatement [SOV.GetLeader] pour tenter d'empêcher une intervention. Cependant, certains suggèrent qu'il serait peut-être préférable de laisser la question en suspens puisque nous avons déjà consulté les Soviétiques, et plusieurs d'entre eux ne font que compliquer la situation et nos relations."
 HUNGARIAN_REV.13.d:0 "Le gouvernement chinois a fourni une lettre au Premier ministre soviétique [SOV.GetLeader] du président Mao Zedong. Le dirigeant chinois y exhorte à ne pas intervenir. Il met en garde contre les conséquences d'une telle action et appelle à la retenue. Il a proposé les services de la Chine pour l'aider à faciliter une résolution pacifique de la crise. Nous avons été en contact constant avec les Chinois sur cette question et leur opinion peut nous donner une idée de la façon dont le monde communiste au sens large pourrait réagir à une intervention. Si l'on en croit Mao, une intervention pourrait conduire à de nouveaux schismes et mettre en péril l'unité du mouvement socialiste mondial. Nous devons soigneusement peser ces conseils et décider si nous devons suivre ses conseils et désamorcer la situation ou poursuivre nos préparatifs."
 HUNGARIAN_REV.14.d:0 "La situation en Hongrie continue de se détériorer. Des sources du renseignement et des militaires assimilent la situation à une anarchie. Le gouvernement d'Irme Nagy affirme avoir apaisé la situation et rétabli l'ordre. Cependant, nos alliés communistes en Hongrie nous ont dit que Nagy était faible et à la merci des forces contre-révolutionnaires. Cependant, nous disposons de rapports indiquant qu'une telle intervention militaire pourrait provoquer des protestations non seulement en Occident mais aussi parmi les autres États socialistes. En outre, nous disposons d'autres rapports indiquant que, depuis la nomination de Nagy, il a réduit la violence et qu'il pourrait constituer la force stabilisatrice nécessaire. Beaucoup préconisent que nous continuions à surveiller la situation. Nous pouvons certainement réévaluer et intervenir plus tard si nécessaire, cette option nous offre de la flexibilité. Nous pouvons intervenir maintenant et empêcher cette anarchie de perturber définitivement les liens du peuple hongrois avec le socialisme."
 HUNGARIAN_REV.15.d:0 "Le gouvernement chinois a proposé de servir de médiateur dans les négociations entre nous et l'Union soviétique. Le Premier ministre soviétique [SOV.GetLeader] a apparemment accepté l'offre et cherche à résoudre ce problème de manière pacifique. Les Chinois ont ajouté que les différends entre gouvernements révolutionnaires ne doivent pas conduire à la violence, car cela ne ferait qu'affaiblir l'unité et ne donnerait pas une bonne image. Il a également été laissé entendre qu'un refus de participer à de tels pourparlers pourrait entraîner une intervention militaire soviétique massive. Accepter de participer aux négociations pourrait nous permettre de préserver certains des changements spectaculaires que nous avons obtenus et contribuer à garantir notre indépendance face à l'ingérence étrangère. Cependant, d'autres membres du gouvernement s'opposent à la participation aux négociations, affirmant qu'il est préférable de courir le risque d'une invasion soviétique plutôt que de faire des compromis sur les exigences du peuple."
 HUNGARIAN_REV.16.d:0 "\nAprès d'intenses négociations tenues dans le sud de la Pologne, les représentants de la Hongrie et de l'Union soviétique sont parvenus à un compromis. Il y a peu de temps encore, il est apparu que la situation entre les deux nations conduisait à un conflit armé autour de la révolution hongroise. Cependant, le gouvernement chinois a réussi à persuader l'Union soviétique de laisser la Chine faciliter les pourparlers entre les deux parties et parvenir à une solution juste. Les détails de l'accord final seront bientôt publiés, mais les rapports préliminaires suggèrent que l'accord préserve un certain nombre de réformes intérieures hongroises. En échange, les Hongrois doivent garantir leur engagement envers le Pacte de Varsovie et le socialisme. Les diplomates chinois ont supervisé les négociations et ont contribué à faciliter leur conclusion. Dans une déclaration officielle du gouvernement chinois, le nouvel accord montre comment les États socialistes résolvent leurs différends par la paix et non par la guerre, contrairement à ce qui se passe en Occident."
 HUNGARIAN_REV.17.d:0 "Le Premier ministre Irme Nagy, fidèle à son engagement en faveur de réformes politiques, a nommé plusieurs ministres non communistes. Cette décision sans précédent vise à calmer les révolutionnaires à Budapest et à restaurer la confiance du peuple dans le gouvernement socialiste. Il s'agit d'une rupture radicale avec les régimes précédents qui imposaient strictement un système de parti unique dans tout le pays. Irme Nagy plaide depuis longtemps en faveur de réformes et d'une ouverture du système communiste actuel pour répondre aux aspirations politiques hongroises. Cette décision éloigne déjà les communistes extrémistes du pays, qui craignent que Nagy ne capitule devant les révolutionnaires qu'ils considèrent comme des contre-révolutionnaires et des agents de l'Occident."
 HUNGARIAN_REV.18.d:0 "Depuis le début de la révolution hongroise, la principale force d'opposition a été l'agence de sécurité AVH. Leurs membres gardaient les sites gouvernementaux et ont eu de violents affrontements avec les manifestants. Beaucoup de leurs membres sont accusés d'avoir ouvert le feu sur des manifestants non armés. Irme Nagy a récemment aidé à négocier un cessez-le-feu avec les forces pro-régime et révolutionnaires. Il a déclaré qu'en dissolvant l'AVH, il mettrait fin à une source de conflit et de division. A la place de l'AVH, le Premier ministre a présenté un projet de formation d'une Garde nationale chargée de maintenir l'ordre public. Cette nouvelle force sera composée de révolutionnaires armés et de soldats gouvernementaux qui travailleront ensemble pour rétablir la paix."
 HUNGARIAN_REV.19.d:0 "Au plus fort des tensions et de la violence, les travailleurs hongrois avaient abandonné le gouvernement pour former des conseils ouvriers locaux afin de contrôler les questions municipales et de lancer des grèves dans tout le pays. Réalisant que ces conseils de travailleurs gagnent en popularité, le Premier ministre Nagy a autorisé la création de conseils de travailleurs locaux agréés pour s'occuper de la gouvernance municipale et des conditions des travailleurs. Les conseils ont réagi positivement à cette annonce et la grève nationale a été levée. Par ailleurs, une délégation de représentants de ces conseils arrivera prochainement pour rendre visite au Premier ministre et offrir son soutien à son gouvernement."
 HUNGARIAN_REV.20.d:0 "Dans la continuité de la politique de réconciliation récemment lancée par le Premier ministre Imre Nagy, le gouvernement a annoncé la formation d'un gouvernement d'unité nationale qui sera composé de plusieurs partis politiques auparavant interdits. Il a déclaré que ces partis, en collaboration avec le sien, garantiraient non seulement l'ordre, mais contribueraient également à déterminer le développement futur de la nation hongroise. Cela suggère que la Hongrie se dirige vers un État démocratique multipartite. Cette annonce annonce effectivement la fin du système de parti unique en Hongrie, une revendication clé des révolutionnaires. Les Soviétiques et les communistes radicaux ne verront pas ces évolutions de manière positive car, sur le plan idéologique, le système de parti unique est considéré comme une composante essentielle d'un État socialiste en développement. Alors que le premier ministre se fait des amis au sein de l'opposition, son propre parti semble s'effondrer au milieu de ces changements dramatiques."
 HUNGARIAN_REV.21.d:0 "\nDans un discours radiophonique adressé au pays, le Premier ministre Imre Nagy a annoncé son intention de se retirer du Pacte de Varsovie et de s'engager dans une politique étrangère de neutralité. Pour de nombreux Hongrois, l'adhésion au Pacte de Varsovie symbolisait le contrôle continu des Soviétiques sur leur pays. En se retirant, Nagy cherche à restaurer une politique étrangère indépendante pour la Hongrie. Cette annonce constitue également une menace directe pour l'Union soviétique et son ordre d'après-Seconde Guerre mondiale en Europe de l'Est. Le Premier ministre Nagy espère que les Soviétiques respecteront la volonté du peuple hongrois et ne risqueront pas de s'aliéner ses autres alliés en adoptant une position dure à l'égard du pays. Reste à savoir si Nagy a raison dans ses calculs sur les intentions soviétiques."
 HUNGARIAN_REV.22.d:0 "La dernière annonce du Premier ministre Imre Nagy a profondément ébranlé les communistes hongrois. Beaucoup pensent désormais que Nagy a non seulement capitulé face à l'opposition, mais qu'il a ouvertement supervisé l'effondrement de l'ordre socialiste en Hongrie. Janos Kader, haut dirigeant du parti communiste et ministre, a rencontré les dirigeants soviétiques à Moscou. Il les informa que la Hongrie ne subissait pas un ajustement socialiste mais tombait aux mains des forces contre-révolutionnaires. La campagne de libéralisation de Nagy est allée bien au-delà de ce que n'importe quelle autre société socialiste permettrait et les communistes hongrois ont désespérément besoin de la protection de l'Union soviétique. Il a également cité les exécutions extrajudiciaires de membres communistes au début des récents troubles comme exemple de ce qui se passerait si Nagy n'était pas arrêté maintenant. Face à cette demande des communistes hongrois, les Soviétiques doivent décider s'ils doivent intervenir ou tenter de le faire fonctionner avec le gouvernement Nagy."
 HUNGARIAN_REV.23.d:0 "L'Union soviétique a suivi de près la situation en Hongrie. Les forces soviétiques stationnées dans le pays ont tenté d'apporter leur aide dès le début, mais ont dû se retirer. Le programme de libéralisation ultérieur annoncé par la Première ministre Irme Nagy a semblé apaiser les tensions, même si des plaintes ont été émises parmi les communistes hongrois. Cependant, l'annonce récente du retrait de la Hongrie du Pacte de Varsovie et de sa neutralité était une provocation envers l'Union soviétique. Partout dans le monde, les gens attendaient la réaction soviétique qui s'est manifestée dans un communiqué publié depuis Moscou. Dans ce document, les Soviétiques s'engagent à établir de nouvelles relations avec la Hongrie, fondées sur le respect mutuel et l'égalité. Il semble que les craintes d'une intervention militaire soviétique soient infondées et les Soviétiques espèrent engager un dialogue diplomatique avec le régime. Il reste à voir ce que cela signifie pour les autres membres du Pacte de Varsovie et pour la position soviétique en Europe de l'Est."
 HUNGARIAN_REV.24.d:0 "La révolution hongroise, brève mais turbulente, s'est effondrée dans le sang alors que les forces soviétiques ont balayé la Hongrie ces derniers jours. La décision du Premier ministre Imre Nagy de déclarer la Hongrie neutre et de se retirer du Pacte de Varsovie s'est retournée contre elle lorsque les Soviétiques ont réagi par une intervention militaire. Les forces soviétiques ont d'abord désarmé les unités militaires hongroises et encerclé Budapest. Ils ont ensuite attaqué les forces révolutionnaires résistantes et après de violents combats urbains, les forces soviétiques ont pris le dessus, laissant la ville gravement endommagée. Le Premier ministre Nagy et d'autres révolutionnaires de premier plan ont fui vers l'ambassade de Yougoslavie à Budapest. L'Union soviétique affirme avoir agi après que les communistes hongrois ont demandé une intervention pour mettre fin à la contre-révolution et protéger les communistes de nouvelles violences, car nombre d'entre eux ont été exécutés par les révolutionnaires au début du soulèvement. La résistance des Hongrois et le refus de leurs militaires de rejoindre les Soviétiques indiquent que tous les Hongrois n'ont pas accueilli favorablement cette action. Un nouveau gouvernement dirigé par Janos Kadar prendra la relève pour restaurer le socialisme dans le pays."
 Golden_Team.1.d:0 "L'équipe nationale hongroise de football est devenue l'équipe la plus dominante ces derniers temps, appelée Golden Team. L'équipe est dirigée par le directeur Gusztav Sebes, un ancien organisateur syndical. Les principaux acteurs sont Ferenc Puskas, Sandor Kocsis, Nandor Hidegkuti, Zoltan Czibor, Jozsef Bozsik et Gyula Grosics. Sebes a mis en place un programme de conditionnement physique scientifique, une flexibilité tactique et une exigence de polyvalence de la part de tous ses joueurs. Cela permet à l'équipe de jouer un jeu beaucoup plus dynamique qui excite les foules et remporte les matchs. L'équipe a dominé certaines des puissances traditionnelles du football, notamment une victoire éclatante contre l'Angleterre à domicile. Leurs victoires sont saluées par le gouvernement comme un exemple de la supériorité de l'homme socialiste. Chez les Hongrois, ces victoires encouragent la fierté nationale, ce qui inquiète légèrement certains communistes radicaux."
