  ###OTHERS###
  BECOME_SPY_MASTER_BUTTON: "Devenez un maître espion"
  BECOME_SPY_MASTER_ALREADY_MASTER: "§RVous êtes déjà $HEADOF$.§!"
  BECOME_SPY_MASTER_FACTION_NEEDED: "§RVous devez faire partie d'une faction pour devenir $HEADOF$.§!"
  BECOME_SPY_MASTER_UPGRADES_NEEDED:1 "§RVous devez avoir une agence avec $NUMBER$ surclassements de succursales différents pour devenir $HEADOF$.§!"
  BECOME_SPY_MASTER_NO_SUBJECT: "§RLes sujets ne peuvent pas devenir Spy Master.§!"
  BECOME_SPY_MASTER_COOLDOWN: "§RUn autre pays s'est approprié cette position au sein de notre faction moins de $COOLDOWN|H$ il y a quelques jours. Il faut attendre le $DATE|H$ avant de pouvoir prendre le relais du $HEADOF$.§!"
  BECOME_SPY_MASTER_COST:1 "Il en coûtera £pol_power $VALUE$ pour devenir $HEADOF|H$."
  BECOME_SPY_MASTER_COST_FI: "Il en coûtera £faction_initiative_texticon£ $VALUE$ pour devenir $HEADOF|H$."
  BECOME_SPY_MASTER_DESC: "En tant que §HSpy Master§!, vous pouvez contrôler plus d'agents dont le montant dépend de la taille de votre faction.\nIl ne peut y avoir qu'un seul §HSpy Master§! par faction et si votre faction possède déjà un §HSpy Master§!, elle doit accepter que vous preniez le relais."
  AGENCY_BRANCHES: "Succursales de l'agence"
  DIPLOMACY_ASSUME_FACTION_LEADERSHIP_POLITICAL_POWER_COST_DESC: "Il en coûtera £pol_power $COST|Y$ pour prendre le relais"
  DIPLOMACY_ASSUME_FACTION_LEADERSHIP_COOLDOWN_DESC: "Les autres membres de la faction ne pourront pas assumer la direction pendant les $COOLDOWN|Y$ prochains jours."
  DIPLOMACY_ASSUME_FACTION_LEADERSHIP_NOT_ENOUGH_INFLUENCE: "Pour dépasser suffisamment l'Influence du leader actuel, nous avons besoin de $NEEDED|%Y$ Influence, mais nous n'avons que $CURRENT|%Y$."
  DIPLOMACY_ASSUME_FACTION_LEADERSHIP_NOT_HIGHEST_INFLUENCE: "Nous devons avoir le rang d'Influence le plus élevé de la faction, qui est actuellement de $CURRENT|Y$."
  DIPLOMACY_ASSUME_FACTION_LEADERSHIP_INFLUENCE_PROGRESS: "   $CURRENT|R1%$ influence sur $NEEDED|Y1%$ nécessaire."
  MODIFIER_GUARANTEE_OTHER_IDEOLOGIES: "Peut garantir d'autres idéologies"
  communism_drift_from_guarantees: "Croissance du communisme étranger grâce aux garanties"
 
  ##Template
  FactionStatus_tooltip: "§L[This.GetFactionStatus_desc]§!"
 
  ##Generic
  Generic_Faction: "Membre du [This.GetFactionName]"
  Generic_Faction_desc: "[This.GetNameDefCap] est membre du [This.GetFactionName]. Ils font partie d'une faction, ce qui signifie que si l'un de ses membres devait être attaqué ou entrer en guerre, les membres de l'alliance se joindraient à leur guerre pour aider leur camarade. Ils peuvent agir à l'unisson sur la scène mondiale et projeter leur influence grâce à leur pouvoir collectif. Il ne se limite peut-être pas non plus à un pacte militaire, mais il peut s'étendre sur de nombreux fronts, tels que la coopération économique et d'autres formes de collaboration qui profitent mutuellement à ses membres."
 
  ##NATO
  Leader_of_the_Free_World: "Leader du monde libre"
  Leader_of_the_Free_World_desc: "£Faction_Leader_of_the_Free_World_pic\n\n\n\n\n\n\n\n\nEn tant que pilier fondateur et membre le plus puissant de l'Organisation du Traité de l'Atlantique Nord, les États-Unis d'Amérique constituent l'épine dorsale de l'OTAN, déterminant son orientation, ses capacités et sa posture stratégique depuis sa création jusqu'à aujourd'hui. La volonté politique, la puissance militaire et les ressources économiques de Washington ne font pas seulement partie intégrante : elles sont indispensables. Sans l'engagement américain, l'OTAN ne serait qu'une coquille de sa forme actuelle ; ce sont les États-Unis qui ont rallié les nations occidentales fatiguées de la guerre dans un pacte de défense collective à l'aube de la guerre froide, et ce sont les États-Unis qui continuent aujourd'hui à garantir leur dissuasion.\n\nAu-delà de leur simple adhésion, les États-Unis jouent un rôle de leadership central : ils fournissent la majorité des capacités militaires de l'OTAN, hébergent des structures de commandement clés et dirigent leurs priorités opérationnelles. Du parapluie nucléaire qui dissuade les menaces existentielles à la logistique militaire haut de gamme, en passant par la surveillance, le renseignement et la capacité de déploiement rapide, les contributions américaines éclipsent celles de tout autre allié."
  nato_member_faction: "États membres de l'OTAN"
  nato_member_faction_desc: "£Faction_NATO_Member_States_pic\n\n\n\n\n\n\n\n\nAncrée dans la Charte de l'Atlantique entre les États-Unis et le Royaume-Uni, l'Organisation du Traité de l'Atlantique Nord est une organisation de défense collective créée pour contrer le bloc de l'Est dirigé par les Soviétiques. Créée initialement en réponse à la possibilité d'une troisième agression allemande dans le cadre de l'Union occidentale, l'OTAN est officiellement entrée en vigueur après la signature du Traité de l'Atlantique Nord le 4 avril 1949.\n\n§CAnimus en consulendo liber.§!"
  Close_NATO_Ally: "Allié majeur non-OTAN"
  Close_NATO_Ally_desc: "L'OTAN, de par sa conception, se concentre principalement sur la défense de la région de l'Atlantique Nord, comme son nom l'indique. Cependant, l'alliance a étendu ses liens au monde entier, en fournissant assistance et soutien à diverses nations. Les pays clés qui sont des alliés influents dans la lutte contre le communisme ont reçu le soutien de l'OTAN, ce qui souligne l'engagement de l'organisation à préserver la sécurité et la souveraineté."
  US_Ally_Korea: "Partenaire des États-Unis en Asie : §C[KOR.GetNameWithFlag]§!"
  US_Ally_Korea_desc: "Personne n'a jamais imaginé que la Corée serait divisée, certainement pas les Coréens eux-mêmes, mais les Américains ? Oh, ils le font.\n\nLa Corée du Sud, officiellement la République de Corée, est née après la libération de la péninsule coréenne par les forces soviétiques et américaines en 1945. La plupart des responsables coréens sont membres du gouvernement provisoire de la République de Corée, ce qui les rend légitimes aux yeux du Nord soutenu par les Soviétiques.\n\nAvec le Japon, la République de Corée peut être décrite comme un allié et partenaire majeur des États-Unis dans la guerre froide."
  US_Ally_Japan: "Partenaire des États-Unis en Asie : §C[JAP.GetNameWithFlag]§!"
  US_Ally_Japan_desc: "£Faction_US_Ally_Japan_Pic\n\n\n\n\n\n\n\n\nAussi ironique que cela puisse paraître il y a quelques années, le Japon, qui était alors considéré comme un ennemi de l'Occident, est désormais considéré comme l'un des principaux alliés du nouveau front émergent de la guerre froide.\n\nLe Japon est désormais sous l'oeil vigilant des États-Unis. Les États-Unis ont sauvé le Japon de la division ; Si l'invasion avait eu lieu, le Japon aurait été divisé comme l'Allemagne, mais ce n'est pas le cas.\n\nPour cette seule raison, le Japon est considéré comme une grande influence en Asie, en particulier pour détester l'Extrême-Orient soviétique et les autres dictatures communistes d'Asie de l'Est."
  NATO_Partnership_for_Peace: "Alliés proches des États-Unis"
  NATO_Partnership_for_Peace_desc: ""

  ##Warsaw Pact
  Leader_of_the_Socialist_Nations: "Maison de la Révolution"
  Leader_of_the_Socialist_Nations_desc: "£Faction_Home_of_the_Revolution_pic\n\n\n\n\n\n\n\n\nC'est sur ce sol que le monde a assisté à la naissance de la première révolution socialiste - un moment qui a brisé le vieil ordre impérial et donné naissance à un État ouvrier sans précédent. L'Union soviétique est apparue non seulement comme une nouvelle nation, mais aussi comme un symbole de défi révolutionnaire, ayant abandonné des siècles de régime tsariste au profit d'un système qui promettait le pouvoir au prolétariat. Lorsque le monde a été confronté au fléau du fascisme, c'est l'Armée rouge qui a porté le plus lourd fardeau, brisant la machine de guerre nazie et marchant triomphalement sur Berlin. Cette victoire n'était pas seulement militaire, elle était idéologique.\n\nDans les années qui ont suivi, des millions de personnes à travers le monde ont considéré l'Union soviétique comme l'avant-garde de la cause socialiste internationale. Des usines européennes aux colonies aspirant à l'indépendance, l'URSS est considérée comme un phare de l'anti-impérialisme et de la transformation sociale. Il portait le flambeau de Marx et de Lénine, et beaucoup pensaient qu'il conduirait un jour l'humanité dans une nouvelle ère, où le capital ne règnerait plus et où les travailleurs du monde seraient unis sous la bannière rouge du communisme."
  Warsaw_Treaty_Organization_member: "États socialistes du bloc de l'Est"
  Warsaw_Treaty_Organization_member_desc: "£Faction_Warsaw_Treaty_Organization_Member_pic\n\n\n\n\n\n\n\n\nLes États membres des [SOV.GetFactionName] sont souvent considérés comme des nations qui, sur le papier, revendiquent leur indépendance. Cependant, en réalité, ils sont politiquement et économiquement sous le contrôle important de l'Union soviétique. Cette situation est apparue au lendemain de la Seconde Guerre mondiale, lorsque l'Union soviétique a créé ces États pour créer une zone tampon contre d'éventuelles invasions étrangères.\n\nLa plupart de ces États ne disposent pas d'un véritable cadre politique indépendant et fonctionnent avec une autonomie limitée. Leurs gouvernements sont fortement influencés ou directement supervisés par les dirigeants soviétiques, ce qui se traduit par des politiques et des décisions étroitement alignées sur les intérêts soviétiques. Sur le plan économique, ces nations dépendent presque entièrement de l'Union soviétique pour leurs ressources, leur soutien financier et leurs relations commerciales, ce qui renforce leur statut d'États fantoches.\n\nCet arrangement conduit à un manque général de souveraineté, dans la mesure où les affaires intérieures de ces pays sont largement dictées par les priorités de l'État soviétique. Par conséquent, les habitants de ces régions se retrouvent souvent sans voix dans leur gouvernance, car l'appareil politique est structuré pour soutenir l'influence soviétique plutôt que de refléter la volonté de la population locale."
  Socialist_oriented_countries: "États d'orientation socialiste"
  Socialist_oriented_countries_desc: "£Faction_Socialist_oriented_countries_pic\n\n\n\n\n\n\n\n\nCes nations sont alignées sur les principes socialistes et collaborent souvent avec l'Union soviétique pour promouvoir les idéologies communistes et résister à l'influence occidentale. Ils ne sont peut-être pas membres officiels de l'Organisation du Traité de Varsovie, mais ils partagent un fondement idéologique commun et reçoivent souvent un soutien de l'URSS sous diverses formes, notamment une aide économique, une assistance militaire et un soutien politique sur la scène internationale."
  Close_non_WTO_ally: "États démocratiques populaires"
  Close_non_WTO_ally_desc: "£Faction_Close_non_WTO_ally_pic\n\n\n\n\n\n\n\n\nBien qu'elles ne soient pas membres officiels de l'Organisation du Traité de Varsovie, ces nations sont étroitement alignées sur l'Union soviétique et partagent sa position idéologique. Ils reçoivent souvent un soutien important de l'URSS et jouent un rôle crucial dans la guerre froide."
  ##Iran
  Axis_of_Resistance: "Axe de la Résistance"
  Axis_of_Resistance_desc: ""
  ##SEA
  State_of_East_Indonesia: "État d'Indonésie orientale"
  State_of_East_Indonesia_desc: "£Faction_State_of_East_Indonesia_pic\n\n\n\n\n\n\n\n\nL'État d'Indonésie orientale a été créé en 1946, marquant un moment important dans l'histoire postcoloniale du pays. Initialement, la région était temporairement appelée l'État du Grand Est pour une brève période de seulement 3 jours.\n\nIl est intéressant de noter que les habitants ont adopté une référence ironique à l'État d'Indonésie orientale, en le surnommant avec humour « Negara Ikoet Toean ». Malgré ces origines, la République d'Indonésie a reconnu l'Indonésie orientale comme l'un des États constitutifs du cadre plus large des États-Unis d'Indonésie."
  Central_Government_of_the_Republic_of_Indonesia: "Gouvernement central du [INO.GetName]"
  Central_Government_of_the_Republic_of_Indonesia_desc: ""
  
  french_indochina_faction: "Indochine française"
  French_Indochina_Faction: "Commandement français de l'Indochine"
  French_Indochina_Faction_desc: "£Faction_State_of_Vietnam_pic\n\n\n\n\n\n\n\n\n§YL'Indochine française§! est une structure de coordination de théâtre dirigée par le corps expéditionnaire français §C§!. Le commandement expéditionnaire contrôle directement les domaines de la couronne du nord de Tai, Nung, Muong et Tho, tandis que l'État du Vietnam §Y§! dirige le commandement du sud et ses propres territoires associés.\n\nLes deux commandements partagent un alignement stratégique, un accès et un objectif anti-Viet Minh commun, mais ils ne forment pas une seule guerre. Les campagnes du domaine de la couronne du Nord ne peuvent pas rassembler Saigon contre Hanoï, et la guerre du Sud ne peut pas entraîner le commandement du Nord dans les combats par un appel de faction ordinaire. Paris conserve une influence politique et approvisionne le corps, mais reste en dehors de cette chaîne de commandement."
  Viet_Minh_Faction: "Viet Minh"
  Viet_Minh_Faction_desc: "£Faction_Viet_Minh_pic\n\n\n\n\n\n\n\n\nLa faction §YViet Minh§! unit le gouvernement de Hanoï avec la §Rrésistance du Sud Viet Minh§! sous la direction politique de Ho Chi Minh et du Parti des travailleurs du Vietnam. La distance et le champ de bataille divisé laissent le commandement du sud distinct sur le plan opérationnel, mais il reçoit toujours des directives, des fournitures et des cadres du nord.\n\nCe front commun ne transforme pas chaque opération locale en une guerre générale. La campagne de Saigon contre la résistance du sud reste distincte des campagnes du nord de Hanoï et de l'offensive du Pathet Lao ; Les appels de faction ordinaires sont supprimés afin que seuls les belligérants nommés par chaque opération y entrent."
  Pathet_Lao_Faction: "Pathet Lao"
  Pathet_Lao_Faction_desc: "£Faction_Viet_Minh_pic\n\n\n\n\n\n\n\n\nLe §YPathet Lao§! est un mouvement fraternel du §RViet Minh§! plutôt qu'un membre de sa faction. Formé à partir de la résistance Lao Issara et dirigé par Souphanouvong et Kaysone Phomvihane, ils partagent le programme révolutionnaire de Hanoï et son inimitié envers le §CCorps expéditionnaire français§!, et ils dépendent du nord pour les cadres, les armes, la formation et le sanctuaire le long de la frontière montagneuse.\n\nCette dépendance fait du mouvement un partenaire junior §Ren pratique§!, mais pas une province de Hanoï. Sa guerre est une guerre laotienne, menée contre le gouvernement royal de Vientiane et ses soutiens français, avec ses propres bases à Sam Neua et Phongsaly et sa propre prétention de parler au nom du Laos."

  State_of_Vietnam_Faction: "État du Vietnam"
  State_of_Vietnam_Faction_desc: "£Faction_State_of_Vietnam_pic\n\n\n\n\n\n\n\n\nLe commandement sud §YQuoc-Gia§! est une coalition large et fragmentée alignée avec l'État §Ydu Vietnam§!, comprenant la Cochinchine, le domaine de la couronne montagnarde, les armées sectaires et d'autres forces coopérant contre le §RViet Minh§!. Il fait partie du commandement plus large §CIndochine française§! mais reste politiquement et opérationnellement distinct des domaines de la couronne nord du CEFEO.\n\nAu coeur du pays se trouve le gouvernement de §CBao Dai§!, défié par les mouvements dirigés par §GNgo Dinh Diem§! et §GNgo Dinh Nhu§! qui rejettent à la fois la domination française et le communisme. Les puissants Hoa Hao, Cao Dai et les organisations militaires locales divisent davantage l'autorité. Le commandement sud mène donc sa propre guerre contre la résistance sudiste ; il ne s'engage pas automatiquement dans la guerre du nord du CEFEO contre Hanoï."
  
  Karen_National_Union_Faction: "Union nationale karen"
  Karen_National_Union_Faction_desc: "£Faction_Karen_National_Union_pic\n\n\n\n\n\n\n\n\nL'Union nationale Karen (KNU) est une organisation politique alliée à une branche armée, l'Organisation de défense nationale Karen / Armée de libération nationale Karen (KNDO/KNLA), représentant le peuple Karen du Myanmar.\n\nAu moment de l'indépendance de la Birmanie vis-à-vis de la Grande-Bretagne en 1948, les relations entre la communauté Karen et le gouvernement central dominé par les Bamar étaient déjà très tendues. Au sein de la population karen, les avis étaient partagés : certains dirigeants recherchaient initialement la coexistence et l'autonomie au sein d'une Birmanie fédérale, tandis que d'autres poussaient à une indépendance totale. De nombreux soldats karens avaient déjà servi dans les forces britanniques birmanes pendant la période coloniale et, suite à la montée des tensions ethniques et à l'exclusion politique, ont fait défection en masse vers le KNDO en 1949.\n\nLa situation s'est aggravée au début de 1949 lorsque le gouvernement birman a arrêté le général Smith Dun, commandant en chef des forces armées birmanes d'origine ethnique Karen, et l'a remplacé par le nationaliste Bamar Ne Win. Cette décision a été largement perçue par les Karens comme un signal clair de birmanisation de l'État et de marginalisation des minorités ethniques, accélérant le glissement vers un conflit ouvert.\n\nMalgré les contre-offensives birmanes, la KNU a conservé le contrôle de vastes zones rurales et a poursuivi la lutte armée au travers d'offensives soutenues contre les forces gouvernementales. Les principaux objectifs de l'Union nationale Karen comprennent l'autodétermination, la libération de la domination de l'État birman dirigé par les Bamar et la reconnaissance internationale d'un État Karen autonome ou indépendant."
  Arakan_State_Alliance_Faction: "Alliance de l'État d'Arakan"
  Arakan_State_Alliance_Faction_desc: "£Faction_Arakan_State_Alliance_pic\n\n\n\n\n\n\n\n\nL'Alliance de l'État d'Arakan est née d'un partenariat tactique et idéologique entre le Parti communiste birman du drapeau rouge de Thakin Soe et les rebelles séparatistes de Rakhine dirigés par le moine nationaliste U Seinda.\n\nLe Parti communiste du drapeau rouge - qui se distingue du Parti communiste traditionnel du « drapeau blanc » par les brassards rouges portés par ses cadres - a rejeté la stratégie du front populaire poursuivie par la Ligue antifasciste pour la liberté du peuple. Au lieu de coopérer avec des forces nationalistes non communistes, la faction de Thakin Soe a préconisé une lutte armée immédiate et sans compromis, d'abord contre la domination coloniale britannique, puis contre le gouvernement central d'U Nu, dominé par la Birmanie, qu'elle a dénoncé comme bourgeois et contre-révolutionnaire.\n\nDans l'État d'Arakan, cette ligne révolutionnaire a convergé avec le nationalisme rakhine. U Seinda, un éminent moine et leader séparatiste, cherchait à la sécession complète de l'Arakan de la Birmanie et à l'établissement d'une république indépendante de Rakhine. Sa vision combinait l'autorité morale bouddhiste avec les principes révolutionnaires marxistes, décrivant la lutte à la fois comme une guerre de classes et un mouvement de libération nationale contre ce qu'il considérait comme la domination politique, culturelle et économique des Bamar.\n\nIl s'agissait donc d'une alliance de commodité plutôt que d'unité idéologique totale."
  coordinate_party_press: "Coordonner la presse du parti"
  coordinate_party_press_desc: "Le Kominform n'a ni armée ni trésor, seulement les journaux de ses partis membres. Moscou imposera une ligne commune dans la presse de tous les partis membres, afin que les mêmes condamnations de Tito, les mêmes éloges pour les plans quinquennaux et les mêmes ennemis apparaissent le même jour dans chaque capitale."
  reconstruction_agreements_to_work: "Mettre les accords de reconstruction au travail"
  reconstruction_agreements_to_work_desc: "Les accords de reconstruction ne signifient rien tant que les usines ne seront pas construites. Les membres doivent maintenir le soutien à la construction du Conseil d'assistance économique mutuelle et intégrer les projets convenus dans leurs plans, afin que les économies du bloc se développent ensemble."
  establish_unified_command: "Établir le commandement unifié"
  establish_unified_command_desc: "Le Pacte de Varsovie doit reposer sur un commandement unique pour être plus qu'une signature. Le maréchal soviétique et un état-major conjoint coordonneront les forces de chaque État membre en temps de paix et en temps de guerre."
  secure_berlin_frontier: "Sécuriser la frontière berlinoise"
  secure_berlin_frontier_desc: "La frontière entre la zone soviétique et les secteurs ouest de Berlin est la ligne la plus dangereuse d'Europe. Moscou fermera et gardera la frontière de la République démocratique allemande, et le bloc soutiendra cette décision."
  sustain_forward_groups: "Soutenir les groupes de forces avancés"
  sustain_forward_groups_desc: "Les forces soviétiques stationnées sur le territoire des États alliés doivent être maintenues en place, approvisionnées et alternées. Les groupes avancés sont soutenus pendant six mois, après quoi leur statut est réexaminé."
  renew_warsaw_treaty: "Renouveler le Traité de Varsovie"
  renew_warsaw_treaty_desc: "Le Traité de Varsovie a été signé pour vingt ans. Chaque membre doit réaffirmer son engagement et le traité doit être renouvelé pour un nouveau mandat, avec chaque gouvernement membre du bloc communiste."
  equip_the_main_force: "Équiper la force principale"
  equip_the_main_force_desc: "Les unités régulières de la force principale doivent recevoir leurs armes des programmes d'armement nationaux plutôt que des stocks dispersés capturés. Le Viet Minh n'engagera ses meilleurs régiments que lorsqu'ils seront correctement équipés."
  open_chinese_supply_route: "Ouvrir la route d'approvisionnement chinoise"
  open_chinese_supply_route_desc: "Les armes et les médicaments en provenance de Chine doivent parvenir au Viet Minh par le couloir frontalier. La campagne de Cao Bang dégagera la route et celle-ci restera ouverte pour le reste de la guerre."
  coordinate_resistance_fronts: "Coordonner les fronts de résistance"
  coordinate_resistance_fronts_desc: "Le Viet Minh ne peut pas combattre seul. Les fronts de résistance lao et khmer doivent être coordonnés avec le commandement vietnamien, partageant le ravitaillement et un plan commun contre les Français et leurs clients."
  secure_independent_state_of_vietnam: "Garantir un État indépendant du Vietnam"
  secure_independent_state_of_vietnam_desc: "L'État du Vietnam doit être reconnu comme indépendant de fait aussi bien que de nom. Les accords de Matignon doivent être signés pour que le mandat français prenne fin dans la loi et que le gouvernement vietnamien puisse agir seul."
  bring_the_expedition_home: "Ramenez l'expédition à la maison"
  bring_the_expedition_home_desc: "L'implantation de Genève met fin à la guerre d'Indochine et le corps expéditionnaire français doit quitter la péninsule. Paris doit rapatrier ses forces et l'État du Vietnam doit survivre au règlement en tant qu'État."
  Cominform_Press_Discipline: "Discipline de presse Cominform"
  Cominform_Reconstruction_Works: "Travaux de reconstruction"
  SOV_Information_Bureau_Press_Campaign: "Coordonner la presse du parti"
  SOV_Information_Bureau_Press_Campaign_desc: "Envoyez la ligne de presse commune à tous les partis membres du Kominform."
  SOV_Establish_Unified_Command: "Établir le commandement unifié"
  SOV_Establish_Unified_Command_desc: "Créer un état-major interarmées pour les forces du Pacte de Varsovie."
  SOV_Secure_the_Berlin_Frontier: "Sécuriser la frontière berlinoise"
  SOV_Secure_the_Berlin_Frontier_desc: "Fermez et gardez la frontière de la République démocratique allemande à Berlin."
  SOV_Authorize_Forward_Groups: "Autoriser les groupes de transfert"
  SOV_Authorize_Forward_Groups_desc: "Maintenir les groupes avancés soviétiques stationnés sur le territoire allié pendant six mois."
  SOV_Sustain_Forward_Groups: "Soutenir les groupes avancés"
  SOV_Sustain_Forward_Groups_desc: "Les groupes avancés restent en place et approvisionnés pendant six mois."
  SOV_Renew_the_Warsaw_Treaty: "Renouveler le Traité de Varsovie"
  SOV_Renew_the_Warsaw_Treaty_desc: "Réaffirmer le Traité de Varsovie pour un nouveau mandat."
