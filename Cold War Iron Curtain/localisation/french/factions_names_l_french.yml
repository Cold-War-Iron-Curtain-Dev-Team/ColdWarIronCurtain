 l_french:
  ###NEW DLC FACTION STUFF###
  Warsaw_Treaty_Organization_name: "Organisation du Traité de Varsovie"
  nato_faction: "Organisation du Traité de l'Atlantique Nord"
  state_of_vietnam_faction: "État du Vietnam"
  viet_minh_faction: "Viet Minh"
  karen_national_union_faction: "Union nationale karen"
  arakan_state_alliance_faction: "Alliance de l'État d'Arakan"
  TIAR_name: "Traité interaméricain d'assistance réciproque"
  peoples_liberation_front_faction: "Front populaire de libération"
  ###GOALS###
  destroy_kingdom_of_greece: "Soutenez secrètement le partisan grec"
  destroy_communist_greece: "Soutenez le Royaume de Grèce"
  secure_our_flanks: "Sécuriser les flancs de la patrie"
  prepping_north_korea: "Préparer la Corée du Nord"
  win_the_cold_war_1950s: "La guerre froide"
  ###MANIFEST###
  workers_of_the_world_goal_name: "Pour une paix durable, pour une démocratie populaire !"
  animus_in_consulendo_liber_goal_name: "Animus dans Consulendo Liber"
  KAY_give_me_liberty_or_give_me_death_goal_name: "Donnez-moi la liberté ou donnez-moi la mort"
  ARA_liberty_equality_fraternity_goal_name: "Liberté, Égalité, Fraternité"
  VIE_Dan_viqui_goal_name: "Nos collaborateurs sont les plus précieux"
  VIN_Nothing_is_more_precious_than_independence_and_freedom_goal_name: "Rien n'est plus important que l'indépendance et la liberté"
  ###DESC###
  workers_of_the_world_goal_desc: "Les démocraties populaires ne peuvent pas rester en sécurité pendant que des gouvernements hostiles dominent la majeure partie du monde. Amener au moins les trois quarts des États du monde sous contrôle communiste pour renforcer notre front commun."
  animus_in_consulendo_liber_goal_desc: "Les puissances atlantiques doivent défendre leurs membres contre la pression soviétique et empêcher une nouvelle expansion communiste. Maintenir au moins les trois quarts des États du monde hors du contrôle communiste."
  VIN_Nothing_is_more_precious_than_independence_and_freedom_desc: "L'indépendance doit être soutenue dans les villages et défendue sur le champ de bataille. Mobilisez la main d'oeuvre locale pour construire les routes et les ateliers qui permettront d'approvisionner la résistance."
  VIE_Dan_viqui_goal_desc: "L'État vietnamien doit prouver qu'il peut protéger les personnes dont il revendique l'allégeance. Mettre ses ateliers en production régulière et déplacer ses forces assez rapidement pour disputer les campagnes avec le Viet Minh."
  KAY_give_me_liberty_or_give_me_death_goal_desc: "Les villages Karen ne peuvent pas compter sur les promesses de Rangoon pour leur sécurité. Organisez la défense de notre patrie et maintenez nos forces approvisionnées grâce à une lutte prolongée pour l'autonomie gouvernementale."
  ARA_liberty_equality_fraternity_goal_desc: "Les rebelles d'Arakan et les communistes du Drapeau rouge partagent un ennemi à Rangoon, même s'ils diffèrent sur le pays qu'ils entendent construire. Mettre en commun leurs ressources pour établir les routes et les ateliers nécessaires au maintien de la rébellion."
  prepping_north_korea_desc: "Avant que les combats ne commencent sur la péninsule, l'Armée populaire coréenne doit disposer des armes et des moyens de transport nécessaires pour mener une offensive soutenue. Constituez ses stocks d'armes d'infanterie, de camions et de chars, ou achevez le programme soviétique d'armement de la KPA."
  secure_our_flanks_desc: "Une guerre générale a ouvert des fronts depuis l'Allemagne jusqu'à la frontière turque. L'Allemagne de l'Ouest, le Danemark, la Finlande et la Turquie doivent capituler tandis que l'Allemagne de l'Est reste dans le combat."
  win_the_cold_war_1950s_desc: "Briser l'emprise de la superpuissance rivale sur les affaires mondiales avant 1960. La victoire est assurée si elle cesse d'exister, capitule ou ne dirige plus une alliance."
  destroy_kingdom_of_greece_desc: "Apporter un soutien discret au gouvernement démocratique provisoire sans répudier ouvertement l'accord de guerre sur la Grèce. Ses partisans doivent forcer le gouvernement royal à capituler avant que leur propre résistance ne soit brisée."
  destroy_communist_greece_desc: "L'aide américaine doit permettre au gouvernement royal d'Athènes de résister à l'insurrection communiste. Aidez l'armée grecque à récupérer la Macédoine occidentale et à restaurer la souveraineté du royaume sur le bastion partisan."
  aid_greek_democratic_army: "Aidez l'Armée Démocratique de Grèce"
  aid_greek_democratic_army_desc: "Livrez des armes aux partisans du gouvernement démocratique provisoire avant que l'armée royale ne les brise. La Grèce est le premier test de la détermination des démocraties populaires."
  arm_korean_army: "Armer l'Armée populaire coréenne"
  arm_korean_army_desc: "Achever le programme soviétique visant à équiper l'Armée populaire coréenne d'armes d'infanterie, de camions et de chars avant le début des combats sur la péninsule."
  consolidate_gdr: "Consolider la RDA"
  consolidate_gdr_desc: "Considérez Berlin-Est et la zone soviétique comme le noyau de l'État socialiste allemand, avec la frontière berlinoise sécurisée pour la démocratie populaire."
  conclude_warsaw_treaty: "Conclure le Traité de Varsovie"
  conclude_warsaw_treaty_desc: "Répondez au réarmement de l'Allemagne de l'Ouest et à l'OTAN par un traité de défense formel. Convertir le Kominform en Organisation du Traité de Varsovie et placer ses membres sous un commandement militaire commun."
  reopen_northwest_corridor: "Rouvrir le corridor nord-ouest"
  reopen_northwest_corridor_desc: "Tenez le corridor nord-ouest des garnisons françaises et laotiennes, rouvrant ainsi la route entre le Tonkin et les hauts plateaux thaïlandais."
  equip_vietnamese_national_army: "Equiper l'Armée nationale vietnamienne"
  equip_vietnamese_national_army_desc: "Armer l'Armée nationale vietnamienne des équipements que le Corps expéditionnaire français lui a promis."
  raise_associated_armies: "Lever les armées des États associés"
  raise_associated_armies_desc: "Engager les armées du Laos et du Cambodge à la cause française dans le cadre de l'accord d'État associé."
  take_dien_bien_phu: "Prendre Dien Bien Phu"
  take_dien_bien_phu_desc: "Capturez la forteresse de Dien Bien Phu et brisez la position française au nord-ouest."
  hold_na_san: "Tenez Na San"
  hold_na_san_desc: "Tenez la tête aérienne de Na San contre le Viet Minh et maintenez le nord-ouest approvisionné par les airs."
  keep_the_delta_supplied: "Gardez le Delta fourni"
  keep_the_delta_supplied_desc: "Gardez Hanoï et le delta du fleuve Rouge sous contrôle français et approvisionnés pendant six mois."
  end_french_expedition: "Mettre fin à l'expédition française"
  end_french_expedition_desc: "Dissoudre le corps expéditionnaire français et mettre un terme à la guerre d'Indochine."
  keep_hungary_in_pact: "Maintenir la Hongrie dans le Pacte"
  keep_hungary_in_pact_desc: "Empêcher Budapest de quitter le Traité de Varsovie après le soulèvement de 1956 en gardant le gouvernement hongrois au sein de l'alliance."
  secure_polands_commitments: "Garantir les engagements de la Pologne dans le cadre des traités"
  secure_polands_commitments_desc: "Écraser le mouvement Solidarité et maintenir la Pologne liée à ses obligations au titre du Traité de Varsovie."
  preserve_alliance_in_prague: "Préserver l'Alliance à Prague"
  preserve_alliance_in_prague_desc: "Maintenir la Tchécoslovaquie dans le cadre du Traité de Varsovie après les réformes du Printemps de Prague, en mettant fin au mouvement de réforme si nécessaire."
  support_government_in_kabul: "Soutenez le gouvernement de Kaboul"
  support_government_in_kabul_desc: "Soutenez le gouvernement afghan contre les moudjahidines pendant une année complète grâce au soutien soviétique."
  maintain_strategic_deterrence: "Maintenir la dissuasion stratégique"
  maintain_strategic_deterrence_desc: "Conserver un stock d'armes nucléaires suffisamment important pour dissuader les puissances occidentales d'attaquer les États du Traité de Varsovie."
