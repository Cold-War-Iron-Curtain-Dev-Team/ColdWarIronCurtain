 INDO_LEDGER_CLEAN: "§Gfranc succès§!"
 INDO_LEDGER_COSTLY: "§Ysuccès coûteux§!"
 INDO_LEDGER_FAILURE: "§Réchoué/avorté§!"
 INDO_LEDGER_SUPERSEDED: "§Lremplacé§!"
 INDO_LEDGER_PENDING: "§Len attente§!"
 INDO_LEDGER_WITHHELD: "§Yréserve retenue§!"
 INDO_LEDGER_PRESERVED: "§Gforce préservée§!"
 INDO_LEDGER_COLUMN_LOST: "§Rcolonne perdue§!"
 INDO_LEDGER_FOOTHOLD: "§Yimplantation limitée§!"
 INDO_LEDGER_NORTH_PRIORITY: "§Ypriorité du nord§!"
 INDO_LEDGER_WITHDRAWAL: "§Yretrait ordonné§!"
 INDO_LEDGER_HELD: "§Gposte occupé§!"
 INDO_LEDGER_OVERRUN: "§Rdépassement de position§!"
 INDO_LEDGER_REINFORCED: "§Yrenforcé§!"
 INDO_LEDGER_VULTURE: "§Yintervention aérienne§!"
 INDO_LEDGER_EVACUATED: "§Yévacué§!"
 INDO_LEDGER_RELIEF_SUCCESS: "§Gle soulagement a réussi§!"
 INDO_LEDGER_RELIEF_MAULED: "§Rforce de secours mutilée§!"
 INDO_LEDGER_INCONCLUSIVE: "§Lindécis§!"
 INDO_OUTCOME_NLF_TITLE: "Le sort du Viet Minh du Sud"
 INDO_OUTCOME_NLF_LINE: "[GetIndoOutcomeNLF]"
 INDO_OUTCOME_NLF_T1: "§GL'insurrection du Sud a été détruite avant 1952.§!\n§Y+100 Levier pro-indépendance§!"
 INDO_OUTCOME_NLF_T2: "§GL'insurrection du Sud a été détruite en 1952.§!\n§Y+75 Levier pro-indépendance§!"
 INDO_OUTCOME_NLF_T3: "§GL'insurrection du Sud a été détruite, mais seulement après des années de combats.§!\n§Y+50 Levier pro-indépendance§!"
 INDO_OUTCOME_NLF_NEVER: "§RLe Viet Minh du sud a survécu jusqu'à la tenue de la conférence.§!\n§Y+75 Levier communiste§!"
 INDO_OUTCOME_NLF_PENDING: "L'insurrection dans le Sud brûle toujours. Plus tôt on le brise, plus la chaise de Saigon est solide.\n§YVIE : +100/+75/+50 par année cassée ; VIN : +75 si jamais§!"
 INDO_OUTCOME_PATHET_TITLE: "Le destin du Pathet Lao"
 INDO_OUTCOME_PATHET_LINE: "[GetIndoOutcomePathetLao]"
 INDO_OUTCOME_PATHET_VICTORY: "§RLe Pathet Lao envahit le royaume du Laos.§!\n§Y+125 Levier communiste§!"
 INDO_OUTCOME_PATHET_CRUSHED: "§GLe Royaume a repoussé le Pathet Lao.§!\n§Y+125 De levier Pro-France§!"
 INDO_OUTCOME_PATHET_GARRISON: "§YLe Pathet Lao maintient ses deux provinces de regroupement sous cessez-le-feu.§!\nInstallé par le raid de 1953 - voir ci-dessous."
 INDO_OUTCOME_PATHET_UNRESOLVED: "§RAucun règlement n'a été trouvé au Laos avant la conférence.§!\nAucun effet de levier accordé."
 INDO_OUTCOME_PATHET_CONSOLIDATED: "§YHanoï n'a jamais franchi la frontière. Le Pathet Lao s'est plutôt retranché à l'intérieur du Royaume.§!\n§Y+50 Levier communiste§!"
 INDO_OUTCOME_PATHET_PENDING: "La question laotienne est ouverte. Un résultat décisif fait basculer §Y125§! dans le camp du vainqueur."
 INDO_OUTCOME_DBP_TITLE: "Bataille de Dien Bien Phu"
 INDO_OUTCOME_DBP_LINE: "[GetIndoOutcomeDBP]"
 INDO_OUTCOME_DBP_VICTORY: "§GLe camp fortifié retient et saigne à blanc les assiégeants.§!\n§Y+75 Levier Pro-France§!"
 INDO_OUTCOME_DBP_FALL: "§RLe camp est tombé. La garnison est entrée en captivité.§!\n§Y+100 Levier communiste§!"
 INDO_OUTCOME_DBP_BREAKOUT: "§YLa garnison s'est frayée un chemin - une défaite habillée en délivrance.§!\n§Y+25 De levier Pro-France§!"
 INDO_OUTCOME_DBP_PENDING: "Aucune bataille décisive n'a été décidée.\n§YVictoire FRE : +75 Pro-France ; automne : +100 communiste ; évasion : +25 Pro-France§!"
 INDO_OUTCOME_SECTS_TITLE: "Destin des sectes religieuses"
 INDO_OUTCOME_SECTS_LINE: "[GetIndoOutcomeSects]"
 INDO_OUTCOME_SECTS_RESOLVED: "§GChaque secte a été intégrée à l'État ou démantelée. Le Sud parle d'une seule voix.§!\n§Y+75 Levier pro-indépendance§!"
 INDO_OUTCOME_SECTS_FAILED: "§RLes sectes dirigent toujours leurs fiefs alors que les délégations prennent place.§!\n§Y+50 Levier communiste§!"
 INDO_OUTCOME_SECTS_PENDING: "Les Binh Xuyen, Cao Dai, Hoa Hao et leurs proches ne répondent toujours à personne.\n§YVIE : +75 si tout est résolu avant la conférence ; VIN : +50 sinon§!"
 INDO_OUTCOME_HIGHLAND_TITLE: "Le sort des États des Highlands"
 INDO_OUTCOME_HIGHLAND_LINE: "[GetIndoOutcomeHighlands]"
 INDO_OUTCOME_HIGHLAND_ALL: "§RTai, Meo et Nung ont tous été placés dans l'orbite de Hanoï.§!\n§Y+75 Levier communiste au total§!"
 INDO_OUTCOME_HIGHLAND_SEALED: "§YLa conférence s'est réunie avec [?global.geneva_outcome_highland] régime(s) des hauts plateaux absorbé(s) par Hanoï ; les survivants gardent leur propre voix.§!\n§Y+25 Effet de levier ethnique par survivant§!"
 INDO_OUTCOME_HIGHLAND_PARTIAL: "§Y[?global.geneva_outcome_highland] des 3 régimes politiques des hauts plateaux absorbés par Hanoi jusqu'à présent.§!\n§Y+25 De levier communiste chacun ; les survivants gagnent un levier ethnique lors de la conférence§!"
 INDO_OUTCOME_HIGHLAND_PENDING: "Les patries Tai, Meo et Nung se distinguent de Hanoi.\n§YVIN : +25 par régime politique absorbé ; +25 Effet de levier ethnique par survivant à la conférence§!"
 INDO_OUTCOME_LAOSRAID_TITLE: "L'invasion du Laos en 1953"
 INDO_OUTCOME_LAOSRAID_LINE: "[GetIndoOutcomeLaosRaid]"
 INDO_OUTCOME_LAOSRAID_VICTORY: "§RLes colonnes de Hanoï s'emparent d'une capitale laotienne avant que la mousson ne ferme les routes.§!\n§Y+100 Levier communiste§!"
 INDO_OUTCOME_LAOSRAID_STALEMATE: "§YLe raid s'est gelé et s'est retrouvé dans une impasse : deux provinces en garnison sous le cessez-le-feu.§!\n§Y+50 Levier communiste§!"
 INDO_OUTCOME_LAOSRAID_FAILURE: "§GLe raid s'effondra et le Royaume chassa le Pathet Lao de son sol.§!\n§Y+75 Levier Pro-France§!"
 INDO_OUTCOME_LAOSRAID_TOTALWAR: "§RVientiane refuse la paix : le raid est devenu une guerre générale pour le Laos.§!\nL'effet de levier repose sur l'issue de la guerre au sens large."
 INDO_OUTCOME_LAOSRAID_PENDING: "Le Viet Minh n'a pas encore lancé les dés sur le Laos.\n§YCapital VIN saisi : +100 ; impasse : +50 ; effondrement : +75 Pro-France§!"
 geneva_outcome_award_vie_weight_TT: "§GLa délégation de l'État du Vietnam gagne du poids lors de la conférence§!"
 geneva_outcome_award_vin_weight_TT: "§GLa délégation DRV gagne du poids lors de la conférence§!"
 geneva_outcome_award_fra_weight_TT: "§GLa délégation française gagne du poids à la conférence§!"
 VIN_Reopen_the_Northwest_Corridor:0 "Rouvrir le corridor nord-ouest"
 VIN_Reopen_the_Northwest_Corridor_desc:0 "La première route vers les hauts plateaux de Tai a échoué. Un dernier effort coûteux pourrait rouvrir le couloir des cinq provinces avant la fermeture du théâtre, mais Hanoï n'autorisera pas une autre tentative de restauration."
 VIN_Camp_War_Northwest_Recovery_tt:0 "Dépensez §Y75 de ravitaillement de campagne§! et §Y50 de puissance politique§! pour rouvrir le couloir nord-ouest. Maintenez les cinq objectifs du corridor pendant §Y5 jours consécutifs§! dans les §Y120 jours§!. Tout succès coûte §Ycoûteux§! et transfère Hoang Lien Son à Hanoi."
 VIN_Northwest_Recovery_Objective:0 "Rouvrir le corridor nord-ouest"
 VIN_Northwest_Recovery_Objective_desc:0 "Prenez et maintenez les §Ycinq provinces du corridor mises en évidence§! dans §YHoang Lien Son§! simultanément pendant §Y5 jours consécutifs§!. En perdre un réinitialise la prise. Complétez-le dans les §Y120 jours§!; tout succès coûte cher et attribue Hoang Lien Son au Viet Minh. C'est la seule tentative de redressement de Hanoï."
 VIN_Northwest_Recovery_Clock_tt:0 "§Y[?VIN_camp_objective_hold_days|0]/5§! jours objectifs consécutifs ; §Y[?VIN_camp_days_elapsed|0]/120§! jours de campagne."
 VIN_Dak_Doa_Offensive:0 "L'offensive Dak Doa"
 VIN_Dak_Doa_Offensive_desc:0 "Le commandement sud peut transformer son approche des hautes terres en un assaut contenu contre le poste isolé de Dak Doa. La campagne appartient à la résistance du Sud et ne doit pas perturber sa guerre plus large contre Saigon et la France."
 VIN_Dak_Doa_Offensive_tt:0 "Les §YViet Minh du sud§! attaquent le poste isolé de §YDak Doa§! sans en changer de propriétaire. Tenez Dak Doa pendant §Y7 jours consécutifs§!: propre jusqu'au jour 21, coûteux jusqu'au jour 45."
 VIN_Dak_Doa_Objective:0 "Le poste isolé de Dak Doa"
 VIN_Dak_Doa_Objective_desc:0 "Prenez et maintenez le poste en surbrillance §YDak Doa§! dans §YHaut Plateau de Trung Phan§! avec les forces du sud du Viet Minh pendant §Y7 jours consécutifs§!. L'approche mise en évidence et les routes vers Pleiku et Kon Tum ne sont pas des objectifs supplémentaires. La perte de Dak Doa réinitialise la prise.\nSuccès net jusqu'à §Yjour 21§!; le succès ultérieur coûte cher. Délai final : §Yjour 45§!. La campagne ne change pas la propriété de la publication."
 VIN_Dak_Doa_Clock_tt:0 "§Y[?NLF_Dak_Doa_Hold_Days|0]/7§! jours consécutifs à Dak Doa ; §Y[?NLF_Dak_Doa_Days_Elapsed|0]/45§! jours de campagne."
 FRE_Dak_Doa.1.t:0 "Le poste isolé de Dak Doa"
 FRE_Dak_Doa.1.d:0 "Les forces du Sud Viet Minh se sont rapprochées de Dak Doa depuis leur approche des hautes terres. Le CEFEO doit décider si la garnison isolée reste seule, reçoit un engagement de groupe mobile ou se retire en bon ordre."
 FRE_Dak_Doa.1.a:0 "Tenir le poste isolé"
 FRE_Dak_Doa.1.b:0 "Groupement de répartition Mobile 100"
 FRE_Dak_Doa.1.c:0 "Évacuer le poste"
 FRE_Dak_Doa_Hold_tt:0 "Dépensez §Y20 crédits de guerre§!, §Y750 points d'effectif§!et §Y2 Patience Métropole§!. Le poste reçoit un package défensif limité."
 FRE_Dak_Doa_GM100_tt:0 "Dépensez §Y70 crédits de guerre§!, §Y2 500 points d'effectif§!et §Y5 Patience Métropole§!. Le GM 100 renforce Pleiku-Dak Doa, mais ses pertes seront sévères si le poste tombe."
 FRE_Dak_Doa_Evacuate_tt:0 "Dépensez §Y15 crédits de guerre§!, §Y500 points d'effectif§!et §Y1 Patience Métropole§!. Après sept jours, le Sud Viet Minh enregistre un succès ordonné et la formation est préservée pour des opérations ultérieures sur les hautes terres."
 FRE_Dak_Doa.2.t:0 "La réponse de Dak Doa se termine"
 FRE_Dak_Doa.2.d_held:0 "Le poste isolé tient et l'offensive sud se déroule contre le périmètre."
 FRE_Dak_Doa.2.d_relief:0 "Le GM 100 a relevé le poste et a conservé une réserve mobile efficace."
 FRE_Dak_Doa.2.d_overrun:0 "Dak Doa fut envahi et la garnison isolée fut perdue."
 FRE_Dak_Doa.2.d_mauled:0 "Dak Doa est tombé et le GM 100 a beaucoup souffert de l'échec des efforts de secours."
 FRE_Dak_Doa.2.d_evacuated:0 "Le poste a été évacué en bon ordre ; la formation mobile survit pour les opérations ultérieures dans les hautes terres."
 FRE_Dak_Doa.2.d_superseded:0 "Le théâtre a fermé ses portes avant que la réponse du poste isolé puisse produire un résultat militaire."
 FRE_Dak_Doa.2.a:0 "Enregistrez le résultat des Highlands"
 VIN_Dak_Doa.1.t:0 "Dak Doa a décidé"
 VIN_Dak_Doa.1.d_clean:0 "La résistance du sud a pris Dak Doa dans les délais prévus sans se retrouver piégée dans une bataille plus large sur les hautes terres."
 VIN_Dak_Doa.1.d_costly:0 "Dak Doa est tombé, mais seulement après que l'offensive ait consommé plus de temps et d'énergie que prévu."
 VIN_Dak_Doa.1.d_aborted:0 "La campagne isolée a perdu sa guerre séparée avant qu'un résultat puisse être obtenu."
 VIN_Dak_Doa.1.d_failure:0 "Poste occupé au-delà de la fenêtre opérationnelle finale."
 VIN_Dak_Doa.1.d_superseded:0 "L'implantation du théâtre a dépassé l'opération de Dak Doa ; aucune récompense sur le champ de bataille n'est enregistrée."
 VIN_Dak_Doa.1.a:0 "Retour à la guerre du sud"
 FRE_Dak_Doa_Isolated_Post:0 "Défense à poste isolé de Dak Doa"
 FRE_Dak_Doa_Isolated_Post_desc:0 "Une petite garnison soutenue par le CEFEO tient un périmètre délimité autour de Dak Doa."
 FRE_Dak_Doa_GM100_Defense:0 "GM 100 à Pleiku-Dak Doa"
 FRE_Dak_Doa_GM100_Defense_desc:0 "Un groupe mobile approvisionne et renforce le poste isolé des hautes terres."
 FRA_Accepted_Ceasefire:0 "La France a accepté le cessez-le-feu"
 FRA_Accepted_Reunification:0 "La France a accepté la réunification"
 FRA_Rejected_Ceasefire:0 "La France a rejeté le cessez-le-feu"
 FRA_Rejected_Reunification:0 "La France a rejeté la réunification"
 Geneva_Conference_Negotiations_Complete:0 "Les négociations §Yde Genève§! sont terminées"
 Indochina_Ending_Failed_State:0 "L'Indochine s'est effondrée dans un État défaillant §R§!"
 USA_Tampered_With_VIE:0 "Les États-Unis sont intervenus à Saigon"
 VIE_Accepted_Ceasefire:0 "L'État du Vietnam a accepté le cessez-le-feu"
 VIE_Accepted_Reunification:0 "L'État du Vietnam a accepté la réunification"
 VIE_Rejected_Ceasefire:0 "L'État du Vietnam a rejeté le cessez-le-feu"
 VIE_Rejected_Reunification:0 "L'État du Vietnam a rejeté la réunification"
 VIE_Rejected_Reunification_USA_Intervention:0 "L'État du Vietnam a rejeté la réunification sous la pression américaine"
 geneva_conf_attendance_autogranted:0 "La présence à Genève était accordée automatiquement"
 geneva_core_delegation:0 "Une délégation genevoise de base"
 geneva_interim_government_period:0 "La période §Ydu gouvernement intérimaire§! est en cours"
 geneva_unified_settlement:0 "Genève a produit un règlement unifié §Y§!"
 indochina_diplomacy_lock_communist:0 "La diplomatie indochine cantonnée au camp communiste"
 indochina_diplomacy_lock_profrance:0 "La diplomatie indochine verrouillée sur la France"
 indochina_diplomacy_lock_proindependence:0 "La diplomatie indochine est verrouillée sur l'indépendance"
 indochina_french_held_state_trigger_TT:0 "La région est détenue par le CEFEO, la France, l'État du Vietnam ou une minorité d'alignement français"
 indochina_french_held_state_trigger_TT_NOT:0 "La région n'est pas détenue par le CEFEO, la France, l'État du Vietnam ou une minorité alignée sur la France"
 IC_Aid.1.t:0 "Conseillers du Viet Minh"
 IC_Aid.1.d:0 "Les dirigeants du Viet Minh ont accepté le patronage permanent de la Chine. Un groupe consultatif militaire franchit la frontière avec les premiers envois de fusils et de matériel de signalisation, et Pékin est désormais lié au sort de la guerre du Nord.\n\nL'Armée populaire de libération peut présenter la mission comme une aide fraternelle à une révolution voisine, ou la garder comme une affaire discrète gérée par les commandements des frontières."
 IC_Aid.1.a:0 "Présentez-le comme une solidarité socialiste"
 IC_Aid.1.b:0 "Gardez la mission silencieuse"
 IC_Aid.2.t:0 "Une mission soviétique pour le Viet Minh"
 IC_Aid.2.d:0 "Moscou a accepté une mission militaire pour le Viet Minh. L'artillerie et les canons anti-aériens doivent parcourir la longue route à travers la Chine, accompagnés d'une poignée d'instructeurs pour les équipages d'armes lourdes.\n\nLe Kremlin doit décider si le soutien soviétique à une guerre coloniale en Indochine doit être annoncé ou s'il doit traverser Pékin sans que le nom soviétique y figure."
 IC_Aid.2.a:0 "Annoncer le soutien soviétique à la presse mondiale"
 IC_Aid.2.b:0 "Acheminer l'aide tranquillement à travers Pékin"
 IC_Aid.3.t:0 "Convois sur la route frontalière"
 IC_Aid.3.d:0 "Les fusils et les véhicules motorisés se déplacent en nombre croissant vers le sud, à travers la frontière sino-vietnamienne. Les dépôts frontaliers gèrent le trafic sans cérémonie, et personne à Pékin n'a mis cet arrangement sur papier.\n\nLes commandants locaux se demandent s'il faut contrôler plus étroitement les convois ou les laisser passer et juger des résultats à l'aune de ce qui se fait entendre du front."
 IC_Aid.3.a:0 "Renforcer le contrôle des dépôts frontaliers"
 IC_Aid.3.b:0 "Laissez passer les convois"
 IC_Aid.4.t:0 "Les armes françaises entre les mains du Viet Minh"
 IC_Aid.4.d:0 "Des officiers du renseignement rapportent que des fusils français, capturés lors des combats ou achetés par des intermédiaires, sont étudiés et copiés dans les ateliers du Viet Minh. Ces armes sont familières à tout soldat français ayant monté la garde.\n\nLe ministère peut ordonner une enquête sur les comptes d'armes des dépôts coloniaux, ou considérer les pertes comme le prix ordinaire d'une longue campagne."
 IC_Aid.4.a:0 "Ordonner une enquête sur les pertes d'armes"
 IC_Aid.4.b:0 "Traitez-le comme une usure du champ de bataille"
 IC_Aid.5.t:0 "Des fusils américains aux mains du Viet Minh"
 IC_Aid.5.d:0 "Les armes légères de fabrication américaine fournies pour l'effort français se retrouvent entre les mains du Viet Minh, certaines prises au combat et d'autres revendues sur le marché noir. Les observateurs de Washington s'inquiètent de la destination des armes.\n\nLe gouvernement peut faire pression sur Paris pour des contrôles plus stricts de l'utilisation finale, ou accepter la fuite comme le coût de l'armement d'un allié dans une guerre lointaine."
 IC_Aid.5.a:0 "Demandez à Paris des contrôles plus stricts de l'utilisation finale"
 IC_Aid.5.b:0 "Acceptez-le comme le coût de l'aide à la France"
 IC_Aid.6.t:0 "Des camions soviétiques pour le Viet Minh"
 IC_Aid.6.d:0 "Un lot de camions et de moteurs de construction soviétique est en route vers le Viet Minh, transportant par chemin de fer et par route à travers la Chine. Leur arrivée atténue un problème de transport qui a longtemps limité les campagnes vers le nord.\n\nLes planificateurs soviétiques peuvent revendiquer cette expédition comme preuve de coopération socialiste, ou la classer comme une exportation industrielle de routine qui ne nécessite aucun commentaire."
 IC_Aid.6.a:0 "Réclamez-le comme une coopération socialiste"
 IC_Aid.6.b:0 "Enregistrez-le comme exportation de routine"
 IC_Aid.7.t:0 "Des camions chinois pour le Viet Minh"
 IC_Aid.7.d:0 "Des camions de fabrication chinoise traversent la frontière pour rejoindre les colonnes de ravitaillement du Viet Minh. Il s'agit d'un mélange de machines capturées, remises à neuf et nouvellement assemblées, et elles sont destinées à déplacer des coquillages et du riz sur les pistes de montagne.\n\nPékin peut attirer l'attention sur la cargaison comme une marque de son nouveau statut, ou conserver les détails dans les commandements de la région militaire."
 IC_Aid.7.a:0 "Attirer l'attention sur l'envoi"
 IC_Aid.7.b:0 "Gardez-le à l'intérieur des commandements militaires"
 IC_Aid.8.t:0 "Véhicules américains vendus au Viet Minh"
 IC_Aid.8.d:0 "Parmi les parcs automobiles du Viet Minh, on trouve des camions et des moteurs de fabrication américaine, achetés par l'intermédiaire de tiers et de courtiers dans la région. Comment ils sont arrivés là-bas est une question qui embarrasse plusieurs bureaux.\n\nLe gouvernement peut ordonner une enquête officielle sur ce commerce ou accepter que les véhicules excédentaires trouvent acheteur partout où il y a une guerre."
 IC_Aid.8.a:0 "Commander une enquête sur le commerce"
 IC_Aid.8.b:0 "Accepter que le surplus trouve ses acheteurs"
 IC_Aid.9.t:0 "Les designs américains étudiés au Vietnam"
 IC_Aid.9.d:0 "Les ingénieurs travaillant pour le Viet Minh étudient les véhicules de fabrication américaine et les dessins obtenus à l'étranger. Quelques exemples ont atteint leurs ateliers et les dessins sont en cours de mesure et d'esquisse pour des copies locales.\n\nLes autorités américaines peuvent renforcer les contrôles à l'exportation des véhicules et des pièces détachées, ou les considérer comme une curiosité inoffensive venant d'une école d'ingénieurs pauvre et isolée."
 IC_Aid.9.a:0 "Renforcer les contrôles à l'exportation"
 IC_Aid.9.b:0 "Rejetez-le comme une curiosité inoffensive"
 IC_Aid.10.t:0 "Véhicules yougoslaves pour le Vietnam"
 IC_Aid.10.d:0 "Un petit nombre de véhicules de construction yougoslave ont été vendus au Viet Minh, accompagnés de dessins techniques. Belgrade a peu de liens avec l'Indochine, mais la vente lui rapporte des devises et fait fonctionner ses usines.\n\nLe gouvernement peut considérer la vente comme une modeste affaire commerciale, ou en parler ouvertement comme une preuve que les pays socialistes n'ont pas besoin de suivre un seul capital."
 IC_Aid.10.a:0 "Gardez-le comme une modeste affaire commerciale"
 IC_Aid.10.b:0 "Parlons de coopération socialiste indépendante"
 IC_Aid.11.t:0 "Des fusils pour les sectes du Sud"
 IC_Aid.11.d:0 "Des fusils tirés des stocks de l'État du Vietnam ont atteint Binh Xuyen et d'autres forces sectaires du sud, certains par arrangement et d'autres par le biais de fuites habituelles. Les sectes disposent désormais de bien plus d'hommes armés que la capitale ne le souhaiterait.\n\nSaigon peut exiger que les sectes soient désarmées ou intégrées, ou accepter une coexistence difficile avec des alliés armés qu'elle ne peut pas facilement contrôler."
 IC_Aid.11.a:0 "Exigez le désarmement des sectes"
 IC_Aid.11.b:0 "Accepter une coexistence difficile"
 IC_Aid.12.t:0 "Réforme de l'approvisionnement colonial"
 IC_Aid.12.d:0 "Le système d'approvisionnement du corps expéditionnaire a été réorganisé et une importante cargaison de fusils issus des stocks métropolitains se dirige vers l'Indochine. Les responsables du ministère le décrivent comme une étape vers une logistique coloniale plus simple et mieux administrée.\n\nLes ministres peuvent présenter la réforme à l'Assemblée comme une mesure prudente, ou bien s'en remettre aux départements militaires et éviter un débat sur le coût de la guerre."
 IC_Aid.12.a:0 "Présenter la réforme à l'Assemblée"
 IC_Aid.12.b:0 "Laissez-le aux départements militaires"
 IC_Aid.13.t:0 "Fusils pour l'Armée Nationale"
 IC_Aid.13.d:0 "Le Corps expéditionnaire a remis des fusils de ses propres stocks pour armer l'Armée nationale de l'État du Vietnam. Paris considère ce transfert comme une mesure de vietnamisation et les premières unités qui les recevront sont en cours d'assemblage.\n\nLe ministère peut célébrer ce transfert comme une preuve de l'indépendance croissante de l'État associé, ou le considérer comme une question purement militaire."
 IC_Aid.13.a:0 "Célébrez le transfert sous le nom de vietnamisation"
 IC_Aid.13.b:0 "Traitez-le comme une question purement militaire"
 IC_Aid.14.t:0 "Fusils pour l'Armée Nationale"
 IC_Aid.14.d:0 "Des caisses de fusils libérées par le Corps Expéditionnaire arrivent dans les dépôts de l'Armée Nationale. Il s'agit d'une vieille souche française, mais pour de nombreuses jeunes recrues, ils constitueront leur première arme, quelle qu'elle soit.\n\nLes dirigeants de l'État du Vietnam peuvent organiser une cérémonie publique pour montrer que l'armée leur appartient, ou distribuer discrètement les armes aux unités de garnison et commencer immédiatement leur entraînement."
 IC_Aid.14.a:0 "Organiser une cérémonie publique de passation des pouvoirs"
 IC_Aid.14.b:0 "Sortez les fusils tranquillement et commencez l'entraînement"
 IC_Aid.15.t:0 "Armes pour l'armée royale du Laos"
 IC_Aid.15.d:0 "Les fusils, l'artillerie et l'équipement français arrivent dans les dépôts du Royal Lao, et deux nouvelles divisions sont levées dans les provinces peu peuplées du royaume. Le corps expéditionnaire fournira les armes, les instructeurs et une grande partie de la paperasse.\n\nLe gouvernement royal du Laos peut annoncer la création de l'armée comme un signe de souveraineté nationale, ou accepter la nouvelle force en silence pendant que la mission française fait l'essentiel du travail."
 IC_Aid.15.a:0 "Annoncer l'armée nationale comme signe de souveraineté"
 IC_Aid.15.b:0 "Laissez la mission française s'occuper de la formation"
 IC_Aid.16.t:0 "Armes pour l'armée nationale khmère"
 IC_Aid.16.d:0 "Les fusils, l'artillerie et le ravitaillement français arrivent dans les dépôts cambodgiens et deux divisions d'une nouvelle armée nationale sont en train d'être formées. Les armes proviennent des stocks français et les instructeurs du Corps expéditionnaire sont déjà à l'oeuvre dans les camps d'entraînement.\n\nLe gouvernement cambodgien peut présenter l'armée comme la preuve que le royaume se défend, ou accepter la nouvelle force sans cérémonie."
 IC_Aid.16.a:0 "Présentez-le comme la preuve que le Cambodge se défend"
 IC_Aid.16.b:0 "Acceptez tranquillement la nouvelle force"
 IC_Aid.17.t:0 "Armées d'État associées"
 IC_Aid.17.d:0 "La France a engagé des armes et des fonds pour les armées nationales au Laos et au Cambodge. La décision ne libère aucune des garnisons du corps expéditionnaire, mais elle donne à Paris l'occasion de dire que les États associés assument leur propre défense.\n\nLe gouvernement peut souligner la générosité et la souveraineté de l'accord, ou rester attentif aux exigences persistantes de la guerre."
 IC_Aid.17.a:0 "Insistez sur la générosité de l'arrangement"
 IC_Aid.17.b:0 "Gardez l'attention sur les exigences de la guerre"
 IC_Aid.18.t:0 "Financement américain de la guerre française"
 IC_Aid.18.d:0 "Washington a accepté de prendre en charge une part croissante du coût de la campagne française en Indochine. Les responsables décrivent cet argent comme une contribution à la défense du monde libre, tandis que les critiques au Congrès se demandent où cela finira.\n\nL'administration peut rendre publique cette aide dans le cadre d'une position plus large contre le communisme, ou la garder discrète pour éviter une querelle publique sur la question coloniale."
 IC_Aid.18.a:0 "Faites-le connaître comme une position contre le communisme"
 IC_Aid.18.b:0 "Restez discret"
 IC_Notice_VIN.1.t:0 "L'agitation des Border Hills"
 IC_Notice_VIN.1.d:0 "Les chefs de village signalent que des colonnes du Viet Minh traversent les collines frontalières de Cao Bang et Lang Son. Les marchés ferment tôt et les patrouilles françaises sont rares le long de la route.\n\nLes Tho doivent décider comment protéger leurs villages pendant que les armées passent."
 IC_Notice_VIN.1.a:0 "Gardez les milices du village chez vous et surveillez les sentiers."
 IC_Notice_VIN.1.b:0 "Envoyez un mot aux officiers français pour leur demander protection."
 IC_Notice_VIN.2.t:0 "Les combats frontaliers atteignent le pays Nung"
 IC_Notice_VIN.2.d_win:0 "Les Viet Minh ont emprunté la route frontalière et le pays Nung qui l'entoure leur est ouvert. Les dirigeants nonung s'inquiètent des représailles et de l'avenir de leur service en France.\n\nDe nombreuses familles surveillent les routes à la recherche de réfugiés."
 IC_Notice_VIN.2.d_fail:0 "L'attaque du Viet Minh sur la route frontalière a été retenue ou repoussée. Les milices Nung et les postes français gardent les routes, mais les collines restent agitées.\n\nLes aînés appellent à la prudence et à la vigilance."
 IC_Notice_VIN.2.a:0 "Resserrez les rangs et gardez les milices du clan prêtes."
 IC_Notice_VIN.2.b:0 "Cherchez des accords avec celui qui tient la route."
 IC_Notice_VIN.3.t:0 "Nouvelles de la route frontière"
 IC_Notice_VIN.3.d_win:0 "Des dépêches parviennent à Paris selon lesquelles le Viet Minh a dépassé les postes frontières de la Route Coloniale 4. Les journaux parlent d'un désastre colonial et les députés demandent à savoir comment la frontière a été perdue.\n\nLe gouvernement doit répondre aux questions sur la direction de la guerre."
 IC_Notice_VIN.3.d_fail:0 "Des dépêches parviennent à Paris annonçant l'échec de l'attaque du Viet Minh sur la route frontière. Les journaux font l'éloge des garnisons et le gouvernement trouve un moment de soulagement.\n\nPourtant, les questions sur le coût de la guerre demeurent."
 IC_Notice_VIN.3.a:0 "Défendre la conduite de l'armée devant l'Assemblée."
 IC_Notice_VIN.3.b:0 "Admettez les difficultés et demandez un examen."
 IC_Notice_VIN.4.t:0 "Succès à la frontière vietnamienne"
 IC_Notice_VIN.4.d_win:0 "Le Viet Minh a dégagé la route frontalière et sécurisé la frontière avec la Chine. Les conseillers chinois rapportent que les approvisionnements peuvent désormais circuler plus librement à travers les montagnes.\n\nPékin considère ce résultat comme un signe que le Viet Minh peut utiliser l'aide qui lui est accordée."
 IC_Notice_VIN.4.d_fail:0 "L'opération frontalière du Viet Minh n'a produit aucune percée, même si les routes d'approvisionnement vers la Chine restent ouvertes.\n\nPékin note le résultat sans commentaire."
 IC_Notice_VIN.4.a:0 "Célébrez le succès de la frontière et envoyez vos félicitations."
 IC_Notice_VIN.4.b:0 "Envoyez discrètement plus de conseillers et de cadres."
 IC_Notice_VIN.5.t:0 "Recul à la frontière indochinoise"
 IC_Notice_VIN.5.d_win:0 "Le Département d'État rapporte que les postes français à la frontière chinoise sont tombés aux mains du Viet Minh. Les responsables craignent que Pékin ait désormais un voisin amical à sa frontière sud.\n\nLes critiques du Congrès se demandent si la guerre française est gagnable."
 IC_Notice_VIN.5.d_fail:0 "Le Département d'État rapporte que les postes français à la frontière chinoise ont tenu. Les autorités voient peu de raisons de se réjouir mais sont soulagées que la frontière n'ait pas été perdue.\n\nLes questions sur l'effort français continuent."
 IC_Notice_VIN.5.a:0 "Exhortez le Congrès à soutenir l'effort français."
 IC_Notice_VIN.5.b:0 "Faites tranquillement pression sur Paris pour une stratégie plus claire."
 IC_Notice_VIN.6.t:0 "Les combats à Vinh Yen"
 IC_Notice_VIN.6.d_win:0 "Les forces du Viet Minh ont percé à Vinh Yen, à proximité des villages du delta sous administration de l'État du Vietnam. Les autorités s'inquiètent de la panique dans les campagnes et de la loyauté des officiers locaux.\n\nLe gouvernement doit rassurer la population."
 IC_Notice_VIN.6.d_fail:0 "L'assaut du Viet Minh à Vinh Yen a été repoussé. Les responsables de l'État du Vietnam considèrent ce résultat comme une preuve que leur cause n'est pas perdue.\n\nLes villages du delta respirent un peu plus facilement."
 IC_Notice_VIN.6.a:0 "Appel au calme et démonstration du drapeau dans le delta."
 IC_Notice_VIN.6.b:0 "Faites pression sur le commandement français pour obtenir plus d'armes pour l'armée nationale."
 IC_Notice_VIN.7.t:0 "Les combats à Mao Khe"
 IC_Notice_VIN.7.d_win:0 "Les forces du Viet Minh se sont enfoncées profondément dans le pays charbonnier de Mao Khe. L'État vietnamien craint pour son emprise sur le delta et les responsables se demandent ce que fera ensuite la France.\n\nLes bureaux de Hanoï se préparent à quelques semaines difficiles."
 IC_Notice_VIN.7.d_fail:0 "L'attaque du Viet Minh à Mao Khe a été repoussée. L'État du Vietnam accueille favorablement cette nouvelle, même si de nombreux responsables s'inquiètent d'une prochaine attaque.\n\nL'armée nationale revendique une part du crédit."
 IC_Notice_VIN.7.a:0 "Renforcer l'administration locale dans le delta."
 IC_Notice_VIN.7.b:0 "Demandez davantage de formation pour les unités de l'armée nationale."
 IC_Notice_VIN.8.t:0 "Les combats sur la rivière Day"
 IC_Notice_VIN.8.d_win:0 "Les Viet Minh ont traversé la rivière Day et le delta sud est exposé. L'État vietnamien craint que davantage de villages ne tombent sous le contrôle du Viet Minh.\n\nLes responsables demandent si la France peut les protéger."
 IC_Notice_VIN.8.d_fail:0 "La traversée du fleuve Day par le Viet Minh a échoué. L'État du Vietnam considère cette nouvelle comme le signe de la croissance de son armée.\n\nLes responsables appellent à la fermeté dans le delta."
 IC_Notice_VIN.8.a:0 "Rassemblez les villages du delta avec un appel public."
 IC_Notice_VIN.8.b:0 "Envoyez tranquillement des officiers au front pour acquérir de l'expérience."
 IC_Notice_VIN.9.t:0 "Nouvelles de la rivière Day"
 IC_Notice_VIN.9.d_win:0 "Le Viet Minh a forcé la frontière du fleuve Day et les commentateurs français se demandent combien de temps le delta pourra être tenu. Paris demande au haut commandement un rapport complet.\n\nLe soutien à la guerre vacille."
 IC_Notice_VIN.9.d_fail:0 "L'attaque du Viet Minh sur la ligne de la rivière Day a échoué. Les journaux français présentent ce résultat comme une victoire de l'armée et de ses commandants.\n\nLe gouvernement espère une ambiance plus stable."
 IC_Notice_VIN.9.a:0 "Louez l'armée et rallier l'opinion publique."
 IC_Notice_VIN.9.b:0 "Commandez un examen complet des défenses delta."
 IC_Notice_VIN.10.t:0 "Mot de Na San"
 IC_Notice_VIN.10.d_win:0 "Le Viet Minh a dépassé les défenses de Na San et les hauts plateaux de Tai sont exposés. Les dirigeants Tai s'inquiètent de l'avenir de la fédération et de la promesse française de protection.\n\nLes gens se demandent si les garnisons vont rester."
 IC_Notice_VIN.10.d_fail:0 "L'assaut du Viet Minh sur Na San a échoué et les hauts plateaux de Tai restent sous protection française. Les dirigeants Tai voient dans ce résultat le signe que la fédération peut survivre.\n\nLes vieilles rivalités sont pour l'instant apaisées."
 IC_Notice_VIN.10.a:0 "Rassemblez les milices Tai vers les postes des hautes terres."
 IC_Notice_VIN.10.b:0 "Appel à la France pour des garanties fermes."
 IC_Notice_VIN.11.t:0 "Viet Minh Stir dans le Nord-Ouest"
 IC_Notice_VIN.11.d:0 "Les villageois Tai rapportent que des éclaireurs et des porteurs du Viet Minh se déplacent à travers les sentiers forestiers du nord-ouest. Les chefs des vallées de la Rivière Noire craignent que les hauts plateaux ne soient entraînés dans une nouvelle série de combats.\n\nLa fédération doit décider comment protéger sa patrie."
 IC_Notice_VIN.11.a:0 "Appelez les milices Tai et surveillez les vallées."
 IC_Notice_VIN.11.b:0 "Demandez aux officiers français des fournitures et des assurances."
 IC_Notice_VIN.12.t:0 "Le corridor nord-ouest rouvre"
 IC_Notice_VIN.12.d_win:0 "Le Viet Minh a rouvert le couloir passant par le nord-ouest à grands frais. Les villages Tai le long de la route signalent des réquisitions et des réfugiés, et la fédération craint le pire.\n\nLes dirigeants pèsent leurs options."
 IC_Notice_VIN.12.d_fail:0 "La tentative du Viet Minh de rouvrir le couloir nord-ouest a échoué ou a été annulée. Les villages Tai respirent plus facilement, même si la menace n'a pas disparu.\n\nLes dirigeants appellent à la vigilance."
 IC_Notice_VIN.12.a:0 "Renforcez les défenses de la vallée et surveillez les routes."
 IC_Notice_VIN.12.b:0 "Faites pression pour obtenir la protection de la France."
 IC_Notice_VIN.13.t:0 "Mot de Nghia Lo"
 IC_Notice_VIN.13.d_win:0 "Les forces du Viet Minh ont pris Nghia Lo et les vallées Tai au-delà leur sont ouvertes. Les dirigeants Tai craignent pour leur patrie et pour les promesses françaises qui l'ont protégée.\n\nCertains se demandent s'il faut continuer à se battre."
 IC_Notice_VIN.13.d_fail:0 "L'attaque du Viet Minh contre Nghia Lo a échoué ou a été annulée. Les vallées de Tai restent sous le contrôle de la fédération, même si la frontière reste tendue.\n\nLes dirigeants appellent à la vigilance."
 IC_Notice_VIN.13.a:0 "Rassemblez les milices Tai le long des routes de la vallée."
 IC_Notice_VIN.13.b:0 "Envoyez des émissaires pour demander davantage d'aide française."
 IC_Notice_VIN.14.t:0 "Mot de Lai Chau"
 IC_Notice_VIN.14.d_win:0 "Le Viet Minh a atteint Lai Chau et le coeur des hauts plateaux de Tai est sous pression. La capitale fédérale fait face à un avenir incertain et ses dirigeants se demandent ce que feront les Français.\n\nLes gens se rassemblent sur le marché avec des visages inquiets."
 IC_Notice_VIN.14.d_fail:0 "La poussée du Viet Minh vers Lai Chau a échoué ou a été annulée. La capitale de la fédération reste pour le moment aux mains des Tai.\n\nLes dirigeants remercient la garnison et appellent à la stabilité."
 IC_Notice_VIN.14.a:0 "Rassemblez les milices dans la capitale."
 IC_Notice_VIN.14.b:0 "Appel aux renforts français dans les hauts plateaux."
 IC_Notice_VIN.15.t:0 "Nouvelles de Lai Chau"
 IC_Notice_VIN.15.d_win:0 "Le Viet Minh a pris Lai Chau, capitale de la Fédération Tai, et Paris fait face à une nouvelle mauvaise nouvelle en provenance du nord-ouest. Les commentateurs doutent que les Highlands puissent être tenus.\n\nLe cabinet entend des critiques sur la guerre."
 IC_Notice_VIN.15.d_fail:0 "L'attaque du Viet Minh sur Lai Chau a échoué. Les journaux français traitent la nouvelle comme un modeste soulagement, et le cabinet note une pause dans les critiques.\n\nReste la question du Nord-Ouest."
 IC_Notice_VIN.15.a:0 "Défendez la stratégie de l'armée dans le nord-ouest."
 IC_Notice_VIN.15.b:0 "Admettez les difficultés et demandez un réexamen."
 IC_Notice_VIN.16.t:0 "Succès dans le Nord-Ouest"
 IC_Notice_VIN.16.d_win:0 "Le Viet Minh a pris Lai Chau et dégagé une grande partie des hauts plateaux de Tai. Les conseillers chinois font état du succès et notent que les armes en provenance de Chine ont contribué à la campagne.\n\nPékin réfléchit à la manière de réagir à cette nouvelle."
 IC_Notice_VIN.16.d_fail:0 "La poussée du Viet Minh dans le nord-ouest s'est heurtée à une résistance mais la région reste contestée. Les conseillers chinois rapportent le résultat avec un langage mesuré.\n\nPékin ne voit aucune raison de changer de cap."
 IC_Notice_VIN.16.a:0 "Envoyez des félicitations formelles au Viet Minh."
 IC_Notice_VIN.16.b:0 "Envoyez davantage de conseillers pour vous aider dans la phase suivante."
 IC_Notice_VIN.17.t:0 "Revers dans les hautes terres de Tai"
 IC_Notice_VIN.17.d_win:0 "Le Département d'État rapporte que les positions françaises et taï à Lai Chau sont tombées aux mains du Viet Minh. Les responsables notent que le nord-ouest est désormais largement hors de portée française.\n\nLes critiques du Congrès remettent en question la valeur de l'aide à la France."
 IC_Notice_VIN.17.d_fail:0 "Le Département d'État rapporte que les forces françaises et Tai ont retenu Lai Chau contre une poussée du Viet Minh. Les responsables considèrent le résultat comme un succès limité.\n\nLa question de l'aide future reste ouverte."
 IC_Notice_VIN.17.a:0 "Soutenir l'effort français dans les hauts plateaux."
 IC_Notice_VIN.17.b:0 "Demandez tranquillement à Paris un plan plus clair."
 IC_Notice_VIN.18.t:0 "Combats sur le plateau des Bolovens"
 IC_Notice_VIN.18.d_win:0 "Les colonnes du Viet Minh et du Pathet Lao ont pénétré sur le plateau sud du Laos, et le gouvernement royal lao craint pour les provinces du sud. Les officiers signalent une pression sur les routes et un manque de réserves.\n\nLe tribunal demande ce que fera la France."
 IC_Notice_VIN.18.d_fail:0 "La poussée du Viet Minh et du Pathet Lao dans le sud du Laos a été contenue. Les forces royales laotiennes et françaises tenaient les routes principales et les provinces du sud sont pour l'instant calmes.\n\nLa cour remercie ses militaires."
 IC_Notice_VIN.18.a:0 "Appelez les levées locales et renforcez le sud."
 IC_Notice_VIN.18.b:0 "Appel à la France pour plus d'aide."
 IC_Notice_VIN.19.t:0 "Colonnes du Viet Minh au Sud"
 IC_Notice_VIN.19.d:0 "Des rapports parviennent à Vientiane et Luang Prabang faisant état de colonnes du Viet Minh et du Pathet Lao se déplaçant vers le plateau sud. Les officiers provinciaux demandent des renforts et des conseils royaux.\n\nLe gouvernement doit décider comment défendre le sud."
 IC_Notice_VIN.19.a:0 "Renforcez le sud et mettez les garnisons en alerte."
 IC_Notice_VIN.19.b:0 "Rassurez le public sur le fait que le royaume est en sécurité."
 IC_Notice_VIN.20.t:0 "La capitale royale menacée"
 IC_Notice_VIN.20.d:0 "Les forces du Viet Minh et du Pathet Lao ont percé sur la route de Luang Prabang. La capitale royale est directement menacée et les autorités s'empressent de protéger le palais et les sites sacrés.\n\nLe royaume doit maintenant décider comment répondre à la crise."
 IC_Notice_VIN.20.a:0 "Rassemblez l'armée autour de la capitale royale."
 IC_Notice_VIN.20.b:0 "Appel à l'aide de la France et des États-Unis."
 IC_Notice_VIN.21.t:0 "Les forces du Sud se dirigent vers Dak Doa"
 IC_Notice_VIN.21.d:0 "Les éclaireurs du mouvement des Highlands rapportent que les forces du Sud Viet Minh se rassemblent autour de Dak Doa. Les villages le long des routes parlent de porteurs, de tambours et d'une tension croissante.\n\nLes dirigeants doivent décider comment défendre les postes des hautes terres et quoi dire aux villageois."
 IC_Notice_VIN.21.a:0 "Mettez les postes des hautes terres en alerte et entraînez les milices."
 IC_Notice_VIN.21.b:0 "Tenez conseil avec les chefs du village pour maintenir l'ordre."
 IC_Notice_VIN.22.t:0 "Les combats de Dak Doa se terminent"
 IC_Notice_VIN.22.d_win:0 "Les forces du Sud Viet Minh ont pris la position de Dak Doa. Le mouvement des Highlands a perdu du terrain et les dirigeants s'inquiètent pour leurs villageois et leurs alliés.\n\nLes conseils se réunissent pour décider de la suite."
 IC_Notice_VIN.22.d_fail:0 "La poussée sud du Viet Minh vers Dak Doa a échoué ou a été annulée. Le mouvement montagnard tient bon et ses villages restent sous sa protection.\n\nLes dirigeants appellent à la vigilance."
 IC_Notice_VIN.22.a:0 "Rassemblez les milices et évaluez les pertes."
 IC_Notice_VIN.22.b:0 "Convoquez un conseil pour rétablir la confiance."
 IC_Notice_FRE.1.t:0 "Atlante ouvre ses portes au centre du Vietnam"
 IC_Notice_FRE.1.d_vn:0 "Le CEFEO a accepté que l'Armée nationale vietnamienne mènera l'opération Atlante dans le centre du Vietnam. Des fusils français et des armes de soutien ont été remis à nos divisions, et des conseillers du CEFEO suivront derrière nos colonnes.\n\nL'opération mettra à l'épreuve l'armée et le gouvernement qui la soutient. Nos commandants doivent décider de la force avec laquelle ils vont pousser."
 IC_Notice_FRE.1.d_full:0 "Le CEFEO a ouvert l'opération Atlante au centre du Vietnam avec un engagement total de ses propres bataillons. Nos divisions ont reçu des fusils français et des armes d'appui et doivent participer sur les flancs.\n\nL'opération décidera si la côte peut être tenue, et le comportement de l'armée sera constaté à Paris comme à Saigon."
 IC_Notice_FRE.1.a:0 "Engagez nos divisions à l'offensive."
 IC_Notice_FRE.1.b:0 "Gardez nos divisions dans des rôles de soutien."
 IC_Notice_FRE.2.t:0 "Fin de l'Atlante"
 IC_Notice_FRE.2.d_success:0 "L'opération Atlante a atteint ses objectifs. Les villes de la côte centrale sont tenues par le CEFEO et nos divisions, et les routes intérieures sont ouvertes.\n\nL'armée a montré qu'elle pouvait combattre aux côtés des Français et le gouvernement espère que la côte sera désormais plus calme."
 IC_Notice_FRE.2.d_stalled:0 "L'opération Atlante est au point mort devant ses objectifs. Les colonnes se sont repliées, nos divisions ont subi des pertes et la côte n'est pas plus sûre qu'avant.\n\nL'armée aura besoin de repos et de nouveaux équipements avant de reprendre le terrain."
 IC_Notice_FRE.2.a:0 "Louez les soldats qui ont combattu."
 IC_Notice_FRE.2.b:0 "Tirez les leçons pour l'armée."
 IC_Notice_FRE.3.t:0 "Un programme de pacification pour le delta du Mékong"
 IC_Notice_FRE.3.d:0 "Le commandement français du sud a lancé un programme de pacification dans le delta du Mékong, avec des postes autour de Sa Dec et le long des canaux. Nos agents sont sollicités pour accompagner les patrouilles du CEFEO dans les villages.\n\nLe programme offre au gouvernement une chance de reconquérir les campagnes, mais seulement si nos administrateurs sont perçus comme plus que de simples escortes."
 IC_Notice_FRE.3.a:0 "Soutenez le programme auprès des autorités locales."
 IC_Notice_FRE.3.b:0 "Insistez sur le sens vietnamien dans les villages."
 IC_Notice_FRE.4.t:0 "Nouvelles de Sa Dec"
 IC_Notice_FRE.4.d_killed:0 "Un kamikaze a tué le général Chanson et le gouverneur de Saigon-Cholon à Sa Dec. Le delta du Mékong est sous le choc et le gouvernement doit décider comment répondre à la perte d'un allié et d'un fonctionnaire.\n\nLe programme de pacification se poursuivra sans son architecte."
 IC_Notice_FRE.4.d_survived:0 "Le général Chanson et le gouverneur de Saigon-Cholon ont survécu à une tentative d'assassinat à Sa Dec. Le bombardier est arrivé un battement de coeur trop tôt, et le delta attend de voir ce que cette évasion signifiera pour le programme de pacification.\n\nLe gouvernement a la possibilité de montrer que le Sud peut être géré."
 IC_Notice_FRE.4.a:0 "Honorez les morts et tenez le delta."
 IC_Notice_FRE.4.b:0 "Continuez avec une réponse vietnamienne."
 IC_Notice_FRE.5.t:0 "Dien Bien Phu : La tête aérienne"
 IC_Notice_FRE.5.d_success:0 "La tête aérienne de Dien Bien Phu est tenue et le commandement français déclare le camp établi. Les avions de transport continuent d'acheminer des provisions et Paris apprend que la garnison est en place.\n\nLes députés sont partagés entre la fierté des parachutistes et l'inquiétude quant au coût du camp."
 IC_Notice_FRE.5.d_failure:0 "La tête aérienne de Dien Bien Phu n'a pas pu être tenue. Les parachutistes qui sont descendus dans la vallée ont été débordés ou se sont retirés, et le camp prévu par le plan n'existe pas.\n\nLes députés veulent savoir qui a approuvé l'opération et combien elle a coûté."
 IC_Notice_FRE.5.a:0 "Soutenez le commandement expéditionnaire."
 IC_Notice_FRE.5.b:0 "Appelez pour une révision du coût."
 IC_Notice_FRE.6.t:0 "Lai Chau : l'évacuation se termine"
 IC_Notice_FRE.6.d_preserved:0 "L'évacuation de Lai Chau est terminée et la garnison et ses partisans ont été sauvés. Les colonnes arrivent à destination sous couverture aérienne et les survivants sont en cours de réorganisation.\n\nA Paris, la conduite prudente du retrait par l'armée est saluée."
 IC_Notice_FRE.6.d_loss:0 "L'évacuation de Lai Chau s'est soldée par un désastre pour la colonne exposée. Les partisans qui ont défilé se sont perdus en chemin, et seuls les détachements réguliers partis plus tôt sont en sécurité.\n\nA Paris, les députés demandent pourquoi on a laissé la colonne marcher."
 IC_Notice_FRE.6.a:0 "Soutenez le commandement expéditionnaire."
 IC_Notice_FRE.6.b:0 "Appelez pour une révision de l'opération."
 IC_Notice_FRE.7.t:0 "Atlante : l'offensive se termine"
 IC_Notice_FRE.7.d_success:0 "L'opération Atlante a atteint ses objectifs au centre du Vietnam. La côte est détenue par le CEFEO et l'armée de l'État vietnamien, et les routes intérieures sont ouvertes.\n\nParis accueille favorablement la nouvelle, même si les députés en constatent le coût."
 IC_Notice_FRE.7.d_stalled:0 "L'opération Atlante n'a pas atteint ses objectifs. Les colonnes se sont repliées et la côte n'est pas plus sûre qu'avant.\n\nLes députés demandent si les crédits de guerre dépensés ont été bien utilisés."
 IC_Notice_FRE.7.a:0 "Soutenez le commandement expéditionnaire."
 IC_Notice_FRE.7.b:0 "Appelez pour une révision du coût."
 IC_Notice_FRE.8.t:0 "L'évacuation de Lai Chau commence"
 IC_Notice_FRE.8.d:0 "Le CEFEO a commencé à évacuer la garnison de Lai Chau et les partisans qui l'accompagnaient. Des colonnes se forment sur la route vers le sud et des avions de transport travaillent sur la piste d'atterrissage.\n\nLes familles de la fédération vivent à côté de la garnison depuis des années et nombre d'entre elles doivent décider si elles souhaitent partir avec elle."
 IC_Notice_FRE.8.a:0 "Offrir aux familles de la garnison un refuge au sein de la fédération."
 IC_Notice_FRE.8.b:0 "Laissons les partisans de la fédération couvrir le retrait."
 IC_Notice_FRE.9.t:0 "Lai Chau : l'évacuation se termine"
 IC_Notice_FRE.9.d_preserved:0 "L'évacuation de Lai Chau est terminée et la garnison et ses partisans ont été sauvés. Les colonnes sont en sécurité et les survivants sont hébergés.\n\nLa fédération a une dette envers le commandement français et les familles qui l'ont soutenu."
 IC_Notice_FRE.9.d_loss:0 "L'évacuation de Lai Chau s'est soldée par un désastre pour la colonne exposée. Les partisans qui ont défilé se sont perdus sur la route et seuls les détachements envoyés plus tôt sont en sécurité.\n\nLa fédération pleure ses morts et demande qui doit répondre de cette perte."
 IC_Notice_FRE.9.a:0 "Honorez les morts et abritez les survivants."
 IC_Notice_FRE.9.b:0 "Appuyez sur la commande française pour obtenir des assurances."
 IC_Notice_FRE.10.t:0 "Une tête aérienne du CEFEO dans notre vallée"
 IC_Notice_FRE.10.d:0 "Les parachutistes du CEFEO débarquent dans la vallée de Dien Bien Phu et les avions de transport apportent des provisions. Le camp qu'ils construisent se trouve au coeur de notre pays, parmi les villages Tai qui vivent dans la vallée depuis des générations.\n\nLes chefs de la fédération doivent décider à quel point ils doivent se tenir près des Français et quoi dire aux villages."
 IC_Notice_FRE.10.a:0 "Donnez toute l'aide aux parachutistes."
 IC_Notice_FRE.10.b:0 "Gardez les villages Tai hors des combats."
 IC_Notice_FRE.11.t:0 "L'Airhead à Dien Bien Phu"
 IC_Notice_FRE.11.d_success:0 "La tête aérienne de Dien Bien Phu est tenue et le commandement français déclare le camp établi. Les magasins continuent d'arriver par voie aérienne et les villages Tai de la vallée sont informés que la garnison reste.\n\nLes chefs de la fédération sont à la fois fiers et effrayés."
 IC_Notice_FRE.11.d_failure:0 "La tête aérienne de Dien Bien Phu n'a pas pu être tenue. Les parachutistes qui sont descendus dans la vallée ont été débordés ou se sont retirés, et le camp prévu par le plan n'existe pas.\n\nLes dirigeants de la fédération doivent décider sur qui ils peuvent encore compter."
 IC_Notice_FRE.11.a:0 "Honorez le Tai qui se tenait aux côtés des parachutistes."
 IC_Notice_FRE.11.b:0 "Demandez au commandement français de nouvelles assurances."
 IC_Notice_FRE.12.t:0 "Parachutistes français sur les Bolovens"
 IC_Notice_FRE.12.d:0 "Un groupe aéroporté CEFEO a atterri sur le plateau des Bolovens et a été placé sous les couleurs du Royal Lao. Il a été transporté par avion après que le gouvernement royal du Laos ait demandé de l'aide contre les colonnes du Viet Minh à Attapeu.\n\nLes troupes sont peu nombreuses, mais elles tiennent les routes du plateau et donnent à l'armée royale lao le temps de constituer ses propres bataillons."
 IC_Notice_FRE.12.a:0 "Accueillez le groupement sous les couleurs de Royal Lao."
 IC_Notice_FRE.12.b:0 "Insistez pour qu'il reste sous commandement laotien."
 IC_Notice_FRE.13.t:0 "Dien Bien Phu : une tête de pont en Indochine"
 IC_Notice_FRE.13.d:0 "Washington apprend que l'opération aéroportée française à Dien Bien Phu a commencé. Des financements américains ont permis de financer les avions de transport et les provisions, et l'ambassade rapporte que les parachutistes sont dans la vallée.\n\nLe Département d'État doit décider dans quelle mesure il surveillera de près une opération qu'il contribue à financer."
 IC_Notice_FRE.13.a:0 "Saluons l'effort français."
 IC_Notice_FRE.13.b:0 "Gardez l'aide sous surveillance étroite."
 IC_Notice_FRE.14.t:0 "Atlante : l'offensive au centre du Vietnam"
 IC_Notice_FRE.14.d:0 "Washington apprend que les forces françaises et vietnamiennes ont lancé l'opération Atlante dans le centre du Vietnam. Le financement américain a contribué à financer les magasins et les moyens de transport derrière l'offensive.\n\nLe Département d'État doit décider dans quelle mesure il surveillera de près une opération qu'il contribue à financer."
 IC_Notice_FRE.14.a:0 "Saluons l'effort français."
 IC_Notice_FRE.14.b:0 "Gardez l'aide sous surveillance étroite."
 LOS_Bolovens_Template_Loaded:0 "L'Armée royale laotienne peut déployer le groupe aéroporté Bolovens"
 SOV_Aid_Danh:0 "L'Union Soviétique a envoyé de l'aide à Tran Ngoc Danh"
 SOV_Permit_Danh_Coup:0 "L'Union soviétique a approuvé le coup d'État de Tran Ngoc Danh"
 SOV_Refuse_Aid_Danh:0 "L'Union Soviétique a refusé l'aide à Tran Ngoc Danh"
 SOV_Refuse_Danh_Coup:0 "L'Union soviétique a refusé d'approuver le coup d'État de Tran Ngoc Danh"
 VIE_generic_faction_created:0 "L'État du Vietnam a formé une alliance distincte"
 FRE_Cao_Bac.1.t:0 "Le front Cao Bang"
 FRE_Cao_Bac.1.d:0 "Les divisions Viet Minh ont ouvert l'offensive Cao-Bac contre les garnisons Tho de Cao Bang et Lang Son. Le CEFEO doit décider si la frontière de Tho tient avec ses propres bataillons, reçoit un engagement renforcé ou retire les garnisons en bon ordre."
 FRE_Cao_Bac.1.a:0 "Tenez la frontière avec les bataillons Tho"
 FRE_Cao_Bac.1.b:0 "Renforcez Cao Bang et Lang Son"
 FRE_Cao_Bac.1.c:0 "Retirer les garnisons frontalières"
 FRE_Cao_Bac_Hold_tt:0 "Dépensez §Y15 crédits de guerre§!, §Y600 points d'effectif§!et §Y1 Patience Métropole§!. Cao Bang et Lang Son reçoivent un package défensif limité."
 FRE_Cao_Bac_Reinforce_tt:0 "Dépensez §Y60 crédits de guerre§!, §Y2 000 points d'effectif§!et §Y4 Patience Métropole§!. Les garnisons renforcées tiennent la frontière plus longtemps mais ne peuvent empêcher une percée du Viet Minh."
 FRE_Cao_Bac_Withdraw_tt:0 "Dépensez §Y10 crédits de guerre§!, §Y400 points d'effectif§!et §Y1 Patience Métropole§!. Les garnisons frontalières se retirent en bon ordre et le Viet Minh enregistre une avance sans opposition."
 FRE_Cao_Bac.2.t:0 "Le Front Cao Bang se termine"
 FRE_Cao_Bac.2.d_held:0 "La frontière de Tho a tenu et l'offensive de Cao-Bac n'a pas réussi à prendre les deux États."
 FRE_Cao_Bac.2.d_overrun:0 "Cao Bang et Lang Son ont été dépassés malgré l'engagement défensif."
 FRE_Cao_Bac.2.d_evacuated:0 "Les garnisons frontalières se retirèrent en bon ordre et l'offensive de Cao-Bac avança sans opposition."
 FRE_Cao_Bac.2.d_superseded:0 "Le théâtre a fermé ses portes avant que la réponse à la frontière puisse produire un résultat militaire."
 FRE_Cao_Bac.2.a:0 "Enregistrez le résultat de la frontière"
