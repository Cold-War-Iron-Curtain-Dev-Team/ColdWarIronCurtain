l_french:
 INDO_OUTCOME_OPEN_BUTTON_TT: "Passez en revue les luttes déterminantes de la guerre et la position que chaque camp a gagnée à la table de Genève."
 INDO_OUTCOME_SCORE_TITLE: "Debout à table"
 INDO_OUTCOME_SCORE_LINE: "Communiste : §R[?FRA.StruggleInvolvedNationsIndochinaCommunistScore|0]§! Pro-France : §G[?FRA.StruggleInvolvedNationsIndochinaProFranceScore|0]§! Pro-Indépendance : §Y[?FRA.StruggleInvolvedNationsIndochinaProIndependenceScore|0]§!\nLevier de Genève - Communiste : §R[?global.geneva_lev_communist|0]§! France : §G[?global.geneva_lev_profrance|0]§! Indépendance : §Y[?global.geneva_lev_proindependence|0]§!"
 INDO_OUTCOME_CAMPAIGN_TITLE: "Journal de campagne du Viet Minh"
 INDO_OUTCOME_CAMPAIGN_LINE: "Cao-Bac : [GetIndoCaoBacResult] Vinh Yen : [GetIndoVinhYenResult]\nMao Khe : [GetIndoMaoKheResult] Jour Rivière : [GetIndoDayRiverResult]\nNghia Lo : [GetIndoNghiaLoResult] Hoa Binh : [GetIndoHoaBinhResult]\nNord-Ouest : [GetIndoNorthwestResult] Na San : [GetIndoNaSanResult]\nLai Chau : [GetIndoLaiChauResult] Dien Bien Phu : [GetIndoDienBienCampaignResult]\nDak Doa : [GetIndoDakDoaResult] Récupération du Nord-Ouest : [GetIndoNorthwestRecoveryResult]"
 INDO_OUTCOME_OPERATION_TITLE: "Journal opérationnel du CEFEO"
 INDO_OUTCOME_OPERATION_LINE: "Lorraine : [GetIndoLorraineResult]\nHirondelle : [GetIndoHirondelleResult] Brochet : [GetIndoBrochetResult]\nMouette : [GetIndoMouetteResult] Roulette : [GetIndoCastorResult]\nPollux : [GetIndoPolluxResult] Atlante : [GetIndoAtlanteResult]\nBretagne : [GetIndoBretagneResult] Adolphe : [GetIndoAdolpheResult]\nCamargue : [GetIndoCamargueResult]"
