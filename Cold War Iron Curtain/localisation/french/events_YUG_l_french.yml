l_french: 
 yug.1.t:0 "L'unification de Trieste"
 yug.1.d:0 "Le moment est venu pour la ville de Trieste, actuellement contrôlée par le Conseil de sécurité de l'ONU, de revenir à ses dirigeants respectifs. Il est prévu de diviser Trieste en zone A, la ville principale, et en zone B, la campagne à l'extérieur de Trieste. Nous aurions la campagne et l'Italie la ville. Devons-nous permettre cette scission ou voulons-nous les deux parties ?"
 yug.1.a:0 "Nous autorisons la scission."
 yug.1.b:0 "Nous voulons les deux parties !"
 yug.2.t:0 "Menace d'Italie"
 yug.2.d:0 "L'Italie, aux côtés du Royaume-Uni et des États-Unis, nous menace de diviser la ville et de ne pas la refuser. Si nous ne reculons pas, nous envahirons Trieste, mais cela pourrait conduire à une guerre entre nous et l'Italie. Si nous reculons, nous obtenons notre part et tout reste paisible."
 yug.2.a:0 "On envahit ! Maintenant!"
 yug.2.b:0 "Nous restons paisiblement."
 yug.4.t:0 "Présidence collective"
 yug.4.d:0 "Il a été décidé par les dirigeants des 6 républiques qu'un représentant de chaque république constituerait un conseil spécial pour diriger la nation, nous espérons seulement que ces hommes pourront maintenir la cohésion du tissu de notre nation."
 yug.4.a:0 "Ceux à qui on peut faire confiance"
 yug.4.b:0 "Choisissez les membres à la main."
 yug.4.c:0 "Laissons les Républiques choisir."
 yug.5.t:0 "Scandales de corruption"
 yug.5.d:0 "Nous avons des raisons de soupçonner que les membres du Conseil volent nos coffres, nous devons y mettre un terme."
 yug.5.a:0 "Enquêter davantage sur les questions"
 yug.5.b:0 "Nous ne pouvons pas prendre le risque que cela soit rendu public."
 yug.7.t:0 "Le successeur de Tito"
 yug.7.d:0 "Les ministres et les conseillers sont arrivés à la conclusion que nous devons nommer un nouveau président pour diriger la nation."
 yug.7.a:0 "Nommer le vice-président"
 yug.7.b:0 "Nommer le chef de la SR Croatie."
 yug.7.c:0 "Nommer le chef de la SR Serbie."
 yug.8.t:0 "Purger le gouvernement"
 yug.8.d:0 "Une purge est en cours en SR de Serbie et en SR de Croatie pour limoger tous les ministres qui ne sont pas d'accord avec notre nouvel agenda."
 yug.8.a:0 "Tout ce qui est nécessaire"
 yug.9.t:0 "La crise de Suez"
 yug.9.d:0 "Une crise diplomatique éclate entre le Royaume-Uni et l'Égypte. Nous sommes enclins à soutenir l'Égypte, mais ce n'est peut-être pas la meilleure solution."
 yug.9.a:0 "Soutenez l'Égypte dans sa crise."
 yug.9.b:0 "Restez en dehors de ça."
 yug.10.t:0 "La question afghane"
 yug.10.d:0 "Le dirigeant afghan demande à rejoindre le mouvement des non-alignés, mais nous avons des raisons de croire que les Soviétiques s'intéressent à cette région. Devons-nous lui permettre de rejoindre ou refuser sa demande."
 yug.10.a:0 "Permettez-lui de nous rejoindre."
 yug.10.b:0 "Nous ne pouvons pas prendre de risques."
 yug.11.t:0 "Coup d'État des radicaux serbes contre Tito !"
 yug.11.d:0 "Le groupe armé qui a pris d'assaut la capitale plus tôt a désormais dévoilé son identité et ses objectifs. Ils se présentent comme des nationalistes serbes qui ont décidé de proclamer la Yougoslavie comme une grande Serbie. L'ancien dirigeant Tito aurait quitté le pays et dirige désormais le gouvernement yougoslave en exil à Trieste. Au milieu du chaos, la Croatie et la Bosnie ont déclaré leur indépendance de ce nouvel État."
 yug.11.a:0 "Notre rêve est enfin vrai"
 yug.12.t:0 "Les nationalistes croates exécutent Tito !"
 yug.12.d:0 "Plus tôt dans la journée, une émission publique a eu lieu dans le bâtiment de l'Assemblée fédérale à Belgrade. Là-bas, plusieurs membres de haut rang du Parti communiste, dont Tito lui-même, ont été tenus sous la menace d'armes par plusieurs nationalistes croates : « La Croatie est restée trop longtemps dans l'ombre. Mais à partir d'aujourd'hui, ce n'est plus le cas ! Aujourd'hui, mes amis, va commencer pour nous une nouvelle décennie, car nous deviendrons la Grande Croatie !, a déclaré la figure dirigeante du groupe dans un discours. Quelques instants plus tard, lui et les autres membres exécutèrent Tito et les autres hommes politiques. Les nations du monde entier sont choquées par cette situation et de nombreux habitants de l'ex-Yougoslavie ont peur de ce que cela signifie pour eux. C'est pour cette raison que de nombreux pays de l'ex-Yougoslavie ont déclaré leur indépendance pour se distancier des violents Croates."
 yug.12.a:0 "Une victoire pour la patrie"
 yug.13.t:0 "Coup d'État radical"
 yug.13.d:0 "Des rapports arrivent de la capitale selon lesquels un groupe armé a pris d'assaut les bâtiments gouvernementaux et pris le contrôle du gouvernement. Même si l'identité de ces personnes n'a pas été identifiée, ils ont déclaré que Tito resterait à la tête du pays pour le moment."
 yug.13.a:0 "Des temps sombres nous attendent."
 yug.14.t:0 "L'accord de Bled"
 yug.14.d:0 "Maintenant que nous nous sommes réconciliés avec les Soviétiques, nous pouvons poursuivre les accords de Bled et faire un pas de plus vers une fédération des Balkans."
 yug.14.a:0 "Excellent!"
 yug.15.t:0 "Pression sur la Bulgarie"
 yug.15.d:0 "Faire pression sur la Bulgarie pour qu'elle mette en oeuvre l'accord."
 yug.15.a:0 "Appuyez sur le problème."
 yug.16.t:0 "La Yougoslavie veut s'unir"
 yug.16.d:0 "La Yougoslavie demande que nous les rejoignions conformément à l'accord de Bled."
 yug.16.a:0 "Rejoignez-les"
 yug.16.b:0 "Refuser"
 yug.17.t:0 "Diplomates en Albanie"
 yug.17.d:0 "Envoyez nos diplomates en Albanie pour proposer l'union."
 yug.17.a:0 "Appuyez sur le problème."
 yug.18.t:0 "Faire pression sur la Roumanie"
 yug.18.d:0 "Faire pression sur la Roumanie pour qu'elle adhère à l'union avec les Slaves du Sud"
 yug.18.a:0 "Appuyez sur le problème."
 yug.19.t:0 "La Yougoslavie veut s'unir"
 yug.19.d:0 "La Fédération des Balkans nous demande de les rejoindre."
 yug.19.a:0 "Rejoignez-les"
 yug.19.b:0 "Refuser"
 yug.20.t:0 "[GetNewspaperHeader]La proclamation de la Fédération balkanique"
 yug.20.d:0 "[YUG.GetLeader] a regardé aujourd'hui une foule excitée et d'un patriotisme sans précédent alors qu'elle proclamait la création d'une fédération balkanique composée de la Yougoslavie et des États nouvellement occupés d'Albanie et de Bulgarie. Bien que le conflit nécessaire pour contrôler les deux autres États ait été brutal et parfois sanglant, la région retient désormais son souffle alors qu'une nouvelle ère commence sans que l'étau toujours plus serré de la tyrannie soviétique ne s'attarde. Rêve longtemps réprimé par les caprices des nations impérialistes disséminées à travers l'Europe, la Fédération balkanique va désormais donner crédit au rêve de Tito d'un État fort, internationaliste, socialiste mais indépendant qui propulsera les Balkans vers l'avenir et sauvegardera leur droit à décider de leur propre sort."
 yug.20.a:0 "Que cela dure mille ans !"
 yug.20.b:0 "Ces imbéciles insolents !"
 yug.20.c:0 "Intéressant"
 yug.21.t:0 "Une marionnette roumaine"
 yug.21.d:0 "La Roumanie ne se pliera pas à notre volonté, nous devons remplacer son gouvernement."
 yug.21.a:0 "Cela doit être fait."
 yug.22.t:0 "Inviter la Grèce"
 yug.22.d:0 "Invitez nos vieux amis grecs à se joindre à nous et à partager notre prospérité."
 yug.22.a:0 "Envoyez la demande."
 yug.23.t:0 "Détruisez la rébellion"
 yug.23.d:0 "Les groupes d'opposition ont attisé les feux de la guerre civile en s'opposant à la prise de pouvoir radicale. Il est temps de mettre fin à ce petit jeu."
 yug.23.a:0 "Écrasez-les !"
 yug.24.t:0 "Conférence de Bandoung"
 yug.24.d:0 "Des représentants de 29 pays « non alignés » d'Afrique, d'Asie et du Moyen-Orient se sont réunis pour condamner le colonialisme, dénoncer le racisme et exprimer leurs réserves face à la guerre froide croissante entre les États-Unis et l'Union soviétique."
 yug.24.a:0 "Quelle conférence productive."
 yug.25.t:0 "Rejoignez le mouvement des non-alignés"
 yug.25.d:0 "La Yougoslavie a créé un mouvement des non-alignés et nous demande de rejoindre ce mouvement ? Devons-nous nous joindre ?"
 yug.25.a:0 "Oui, nous nous joignons."
 yug.25.b:0 "Non, nous restons en dehors de cela."
 yug.26.t:0 "Expansion en Afrique du Nord"
 yug.26.d:0 "Étendre le mouvement des non-alignés à l'Afrique du Nord."
 yug.26.a:0 "Merveilleux!"
 yug.27.t:0 "Expansion au Moyen-Orient"
 yug.27.d:0 "Étendre le mouvement des non-alignés au Moyen-Orient."
 yug.27.a:0 "Merveilleux!"
 yug.28.t:0 "Expansion asiatique"
 yug.28.d:0 "Étendre le mouvement des non-alignés à l'Asie."
 yug.28.a:0 "Merveilleux!"
 yug.30.d:0 "Le grand maréchal Tito a prononcé aujourd'hui un discours surprenant. Dans son discours, il a proclamé que la Yougoslavie se tournait vers le communisme et s'éloignait du titisme. Même si beaucoup soutiennent cette décision, certains craignent que cela ne conduise à une dictature semblable à celle des soviets."
 yug.31.d:0 "Après de longues délégations avec les diplomates, ils ont décidé de dire non à nos projets. Alors que nos diplomates rentrent chez eux déçus, il semble qu'ils soutiendraient une invasion militaire."
 yug.33.d:0 "Environ 720 paysans bosniaques, majoritairement d'origine ethnique bosniaque, ont organisé des émeutes antigouvernementales dans les villes de Cazin et Velika Kladusa, dans la région de Bosanska Krajina. Les rebelles ont tenté de s'emparer de la ville de Cazin et marchent également vers Bihac et Velika Kladusa. Ils ont incendié les archives des autorités locales, pillé les dépôts alimentaires et coupé les fils téléphoniques. Nous devons agir maintenant, sinon la situation va empirer."
 yug.34.d:0 "Le rapport sur les conséquences de la rébellion de Cazin est ici. Nous avons rapidement maîtrisé la rébellion et huit participants ont été tués lors de l'opération de nettoyage. Les autorités ont arrêté 714 personnes ; 288 d'entre eux ont été jugés par un tribunal militaire qui a infligé de lourdes peines, dont 17 condamnations à mort. Les 426 autres participants ont été sanctionnés administrativement. Environ 777 membres de 115 familles ont été condamnés à une peine collective d'expulsion et transférés dans la ville de Srbac, dans le nord de la Bosnie. Au total, 25 personnes ont été tuées à la suite de la réaction violente du gouvernement au soulèvement. Au moins douze rebelles ont été tués dans une escarmouche avec la JNA et la police locale.\nLes huit victimes suivantes ont été identifiées : Agan Beganovic, Arif Durmic, Hasan Cavic, Mahmut Beganovic, Mehmed Mehuljic, Muso Kovacevic, Sahin Seferagic, Selim Saric. Nous avons également prononcé 17 condamnations à mort par peloton d'exécution qui doivent être exécutées en novembre: Agan Coralic, Ale Covic, Dedo Covic, Dulaga Sumar, Hasan Kekic, Hasib Beganovic, Husein Zekanovic, Husejn Kapic, Mehmed Tabakovic, Milan Bozic, Mile Miljkovic, Muharem Dervisevic, Nezir Bajraktarevic, Nikola Bozic, Ramo Karajic, Smail Ajkic, Stojan Starcevic."
 yug.35.d:0 "Le 6e Congrès du Parti communiste de Yougoslavie s'est tenu à Zagreb. Le congrès a réuni 2 022 délégués représentant 779 382 membres du Parti communiste de Yougoslavie. Outre les délégués élus, le Congrès a réuni environ 400 invités - des travailleurs politiques, sociaux et publics de toute la République populaire fédérative de Yougoslavie, ainsi qu'une délégation de partis communistes et socialistes étrangers.\nLors de ce congrès, des changements réformistes ont eu lieu au sein du parti. Un nouveau statut a été adopté, par lequel le nom du parti a été changé en Ligue des communistes de Yougoslavie. L'indépendance des organisations de base et des échelons inférieurs du Parti a été renforcée et la période de candidature pour l'admission au Parti a été abolie, ainsi que la période de candidature pour les membres du Comité central. Le Congrès a également décidé que le Front populaire de Yougoslavie serait transformé en une organisation politique de masse et rebaptisé Alliance socialiste des travailleurs de Yougoslavie.\nA l'issue du Congrès, un nouveau Comité central composé de 109 membres et une nouvelle Commission centrale de révision composée de 23 membres ont été élus. Lors de la première session du Comité central après le Congrès, Josip Broz Tito a été élu secrétaire général de la Ligue des communistes de Yougoslavie. Lors de la même session, les membres du Comité exécutif et le Secrétariat du Comité exécutif ont été élus."
 
 Yugoslavia_influence_decisions:0 "Le projet de fédération balkanique"
 Yugoslavia_influence_decisions_desc:0 "Grâce à nos succès lors de la dernière guerre et à la force de notre parti, nous sommes à l'avant-garde de la révolution dans les Balkans. Les autres partis de la région comptent sur nous pour faire preuve de leadership et nous devons les guider. À terme, nous unirons les Balkans avec notre vision et mettrons fin à toutes les divisions. Les années que nous avons passées à bâtir notre parti et à établir des liens avec nos voisins nous offrent une excellente occasion de devenir une influence régionale."
 Spread_Titoist_Propaganda_ALB:0 "Répandre la propagande titiste en Albanie"
 Spread_Titoist_Propaganda_BUL:0 "Répandre la propagande titiste en Bulgarie"
 Spread_Titoist_Propaganda_PDG:0 "Répandre la propagande titiste en Grèce"
 Integrate_BUL:0 "Intégrer la Bulgarie"
 Integrate_PDG:0 "Intégrer la Grèce"
 Integrate_ALB:0 "Intégrer l'Albanie"
 Intervene_in_the_Greek_Civil_War:0 "Intervenir dans la guerre civile grecque"
 Integration_YUG:0 "Doit avoir plus de 75 % d'influence"
 YUG_proclaim_balkan_federation:0 "Proclamer la Fédération Balkanique"
 YUG_proclaim_balkan_federation_desc:0 "L'unification des Balkans n'est plus un simple rêve. Une fois l'Albanie et la Bulgarie intégrées, nous pouvons proclamer la Fédération balkanique. Proleteri svih zemalja, ujedinite se!"
 
 YUG_INTEGRATION.2.d:0 "Le parti communiste yougoslave a joué un rôle majeur pendant la Seconde Guerre mondiale en soutenant les communistes albanais et la libération de l'Albanie de l'Axe. Lorsque les communistes albanais ont pris le pouvoir après la guerre, ils étaient toujours redevables à la Yougoslavie en raison des liens de guerre et de la présence de soldats yougoslaves dans le pays. Récemment, la Yougoslavie a utilisé son influence pour pousser à une purge des dirigeants communistes albanais anti-yougoslaves. Ces opposants à l'influence yougoslave étant en prison ou chassés du pouvoir, le gouvernement albanais s'est montré tout à fait disposé à accepter une proposition de Belgrade d'intégration de l'Albanie à la Yougoslavie. L'intégration profitera aux gens et rendra muettes toutes les questions liées aux frontières et aux ethnies. L'intégration marque la marche continue de la révolution à travers des Balkans unifiés."
 YUG_INTEGRATION.3.d:0 "Les partis communistes de Yougoslavie et de Bulgarie coopèrent et se soutiennent depuis longtemps. Les deux partis ont toujours été de fervents partisans de l'unification des États des Balkans sous un régime communiste afin de mieux diffuser le marxisme auprès du peuple. Depuis la fin de la Seconde Guerre mondiale, les deux nations ont résolu la question de la Macédoine et mené des discussions approfondies sur l'unification. Ces discussions et négociations ont porté leurs fruits suite à la récente décision du parti communiste bulgare d'accepter l'invitation de la Yougoslavie et d'y intégrer la Bulgarie. Le gouvernement yougoslave a noté que cette décision avait renforcé le peuple et les communistes des deux pays et mis fin à tout conflit frontalier ou ethnique. La Yougoslavie est en train de devenir la patrie de tous les peuples des Balkans et sous le communisme, tous seront égaux et grandiront ensemble. Pour les communistes bulgares, cette décision reflète leur croyance de longue date en l'unification des régimes communistes à travers les Balkans."
 YUG_INTEGRATION.1.d:0 "Les peuples de Grèce et de Yougoslavie ont tous deux horriblement souffert pendant la Seconde Guerre mondiale et nombre d'entre eux se sont sentis abandonnés par leurs dirigeants d'avant-guerre. Ce sont les partis communistes des deux pays qui ont été le fer de lance de la résistance et de la libération éventuelle. Cependant, là où le parti communiste yougoslave a réussi à consolider son contrôle, en Grèce, les communistes ont dû lutter contre les forces réactionnaires et les ingérences étrangères avant de triompher. La Yougoslavie a récemment demandé au gouvernement grec de s'intégrer et d'assurer fermement sa victoire révolutionnaire. Après de nombreuses discussions internes, le gouvernement grec a accepté. Ils croient que seul, le pays risque un soulèvement contre-révolutionnaire ou une ingérence dans leurs affaires, mais unifié avec la Yougoslavie, l'État sera trop puissant pour être contesté. La Yougoslavie affirme qu'en unifiant tous les peuples des Balkans, elle mettra fin à tout conflit frontalier ou ethnique et mettra en oeuvre plus efficacement le communisme pour le peuple."
 YUG_GREEK_CIVIL_WAR.1.d:0 "Les peuples grec et yougoslave ont tous deux été les premières victimes de l'agression de l'Axe et ont été abandonnés par leurs dirigeants et alliés. Grâce à d'immenses sacrifices, ce sont les gens restés sur place qui se sont libérés et uniquement sous la direction de leurs partis communistes. En Yougoslavie, les communistes ont assuré leur position après la guerre, mais en Grèce, le parti communiste se retrouve aux prises avec des Grecs réactionnaires. Ces ennemis du peuple grec n'existent que parce qu'ils sont ouvertement soutenus par les puissances impérialistes et qu'ils utilisent les services des collaborateurs grecs des nazis. Le Comité central de Belgrade reconnaît cette situation et a annoncé qu'il enverrait des hommes, des armes et un soutien yougoslaves aux communistes grecs pour les aider dans leur lutte. Leur victoire finale sera une victoire non seulement pour le peuple grec mais pour tous les peuples des Balkans qui luttent pour la révolution."
 influence_gain_100:0 "Gagnez 100 points d'influence"

 #Country Events
 Informbiro.1.d:0 "La période Informbiro couvre la scission Tito-Staline qui a commencé en 1948. La Yougoslavie n'a jamais été dépendante du soutien soviétique pendant la Seconde Guerre mondiale, se libérant en grande partie. Elle s'est également affirmée après la guerre comme un allié et non comme un satellite comme le souhaitaient les Soviétiques. Les Soviétiques trouvaient également la politique étrangère yougoslave trop indépendante et sapait l'équilibre délicat qu'ils avaient établi avec l'Occident. La scission s'est produite lors d'une réunion du Cominform (Informbiro en yougoslave) en 1948 au cours de laquelle le parti communiste yougoslave a été expulsé par l'Union soviétique et ses alliés. Depuis l'adoption de cette résolution, les relations entre Belgrade et Moscou se sont encore détériorées, les Soviétiques ordonnant à tous les partis communistes de rompre les liens et la Yougoslavie étant confrontée à un renforcement militaire à sa frontière. Cependant, cette situation permet à la Yougoslavie de poursuivre une politique totalement indépendante et cette scission pourrait lui offrir des voies uniques pour rassembler du soutien et étendre son influence."
 Yug_1950s.1.d:0 "La Radio-Télévision yougoslave a commencé à émettre aujourd'hui. Il s'agit du premier système de radiodiffusion publique en Yougoslavie. Huit sièges de radio et de télévision ont été créés, un pour chaque république constituante et région autonome qui compose la Yougoslavie. Les stations diffuseront pour un public local mais mettront l'accent sur l'importance de l'unité et de la coopération nationales. Les événements importants du Parti seront couverts et des annonces concernant les activités régionales et nationales du Parti seront annoncées. Le gouvernement espère que la Radio-Télévision yougoslave constituera un moyen puissant d'unifier la nation et d'encourager la compréhension entre tous les peuples du pays."
 AntiSovYug.1.d:0 "Le gouvernement yougoslave a confirmé que l'éminent dirigeant communiste croate Andrija Hebrang était récemment décédé en prison. L'ancien chef du Parti communiste croate a été récemment arrêté, déchu de tous les honneurs du parti et reconnu coupable de collaboration avec les nazis et leur État fantoche croate pendant la guerre. Étant donné qu'Hebrang a été arrêté par les Allemands et a survécu à un camp de concentration, beaucoup considèrent que les accusations sont fabriquées de toutes pièces par les services de renseignement yougoslaves. La raison probable est que les dirigeants centraux croient que les Soviétiques envisagent de remplacer leur chef, Josip Tito, par Hebrang. La récente scission entre les deux États communistes a suscité des tensions et de l'anxiété en Yougoslavie, beaucoup craignant une infiltration pro-soviétique du parti. Les circonstances de sa mort sont suspectes dans la mesure où aucune cause n'a été donnée et le corps n'a pas été rendu public. La mort d'Hebrang élimine commodément une menace pour le régime de Tito."
 Diljas.1.d:0 "Milovan Djilas, membre de longue date et éminent de la Ligue des communistes de Yougoslavie, a récemment été nommé président du pays. Il est largement considéré comme le successeur du leader actuel Josip Tito. Théoricien communiste, Djilas est devenu un critique majeur de l'Union soviétique et a joué un rôle extrêmement important dans l'articulation de la perspective yougoslave lors de la récente scission avec Moscou. Djilas a notamment critiqué le système bureaucratique soviétique massif et les problèmes liés au fait que le centre dirige toute l'activité économique. En effet, dans le passé, les Soviétiques ont ouvertement appelé à la purge de Djilas. Cependant, le nouveau président bénéficie du soutien de Tito et des hauts dirigeants qui lui ont demandé de continuer à écrire des articles pour le journal officiel communiste concernant les critiques du système et des réformes soviétiques."
 Diljas.2.d:0 "Au cours des derniers mois, le président Milovan Djilas a publié près de vingt articles dans le journal officiel communiste yougoslave critiquant le modèle soviétique. Il a commencé à écrire ces articles sous les encouragements du dirigeant yougoslave Josip Tito. Cependant, ces critiques, bien qu'antisoviétiques, plaident en faveur d'un système de gouvernement de parti alternatif et plus démocratique. Djilas est allé jusqu'à suggérer que l'État à parti unique était peut-être une erreur, suggérant que les dirigeants soient mis à la retraite pour prévenir la corruption et ouvrir la voie à d'autres. Cette partie de sa critique a conduit à une réunion du Comité central au cours de laquelle plusieurs membres ont plaidé pour la purge de Djilas. Après consultations, Josip Tito et ses alliés ont décidé que les critiques contre Djilas étaient fondées et que le parti devait les accepter. Cette décision maintient Djilas au pouvoir et laisse penser que de nouvelles réformes sont en cours."
 Diljas.3.d:0 "Au cours des derniers mois, le président Milovan Djilas a publié près de vingt articles dans le journal officiel communiste yougoslave critiquant le modèle soviétique. Il a commencé à écrire ces articles sous les encouragements du dirigeant yougoslave Josip Tito. Cependant, ces critiques, bien qu'antisoviétiques, plaident en faveur d'un système de gouvernement de parti alternatif et plus démocratique. Djilas est allé jusqu'à suggérer que l'État à parti unique était peut-être une erreur, suggérant que les dirigeants soient mis à la retraite pour prévenir la corruption et ouvrir la voie à d'autres. Cette partie de sa critique a conduit à une réunion du Comité central au cours de laquelle plusieurs membres ont plaidé pour la purge de Djilas. Après consultations, Josip Tito et ses alliés ont convenu que Djilas était allé trop loin et qu'il devait être purgé. Djilas a été démis de toutes ses fonctions politiques et il devrait bientôt démissionner du parti. L'État de Tito croit toujours fermement en un parti puissant avec un leader ferme pour gouverner la Yougoslavie."
 YUG_1950s.2.d:0 "Une réforme importante de la constitution yougoslave a été approuvée récemment. Les réformes visent à faire évoluer le pays vers l'autoproduction, l'autogestion et l'auto-travail pour couvrir la gestion de l'économie, l'éducation et la gouvernance locale. Cela reflète le rejet par la Yougoslavie du modèle soviétique qu'elle accuse d'être trop bureaucratique, centralisé et inefficace. L'autogestion réduira le contrôle de l'État sur ces institutions et obligera les dirigeants et les administrateurs à rendre des comptes aux conseils ouvriers. Ces réformes renforcent l'importance de l'autogestion dans le développement de la Yougoslavie. Les réformes mettent également l'accent sur le pouvoir suprême du parti, rejetant le centralisme démocratique tout en accordant davantage d'autonomie aux républiques et aux régions autonomes qui composent la Yougoslavie."
 Diljas.4.d:0 "Le président Milovan Djilas a récemment publié une série d'articles critiquant le modèle soviétique et suggérant une réforme démocratique du système actuel de parti unique. Cette dernière critique a conduit à une réunion du comité central pour discuter de la question de savoir si Djilas et ses idées devaient être adoptés ou s'il devait être purgé pour ses opinions dangereuses. Finalement, le parti a adopté Djilas et celui-ci a récemment annoncé une série de réformes pour le parti de la Ligue des communistes de Yougoslavie (SKJ). Les nouvelles réformes assoupliront les règles strictes de discipline de parti, ouvrant la voie à un débat plus ouvert au sein du parti. Il appelle également à ce que les fonctionnaires soient remplacés à des postes élevés et qu'ils soient mis à la retraite au fil du temps afin d'éradiquer la corruption et d'empêcher la monopolisation du pouvoir. Il semble que la haute direction, dirigée par Josip Tito, ait accepté son propre déclin comme le prix à payer pour réformer le parti."
 YUG_NATO.1.d:0 "Les États-Unis et les quartiers généraux de l'OTAN ont récemment reçu une offre de la Yougoslavie. Le gouvernement yougoslave a proposé de postuler et de rejoindre l'OTAN en échange de la cession de Trieste au pays. La Yougoslavie affirme que Trieste était un territoire occupé que les forces yougoslaves ont libéré pendant la guerre. L'accord d'après-guerre visant à en faire une Ville libre n'a été conclu que par respect pour les Alliés. La Yougoslavie a ajouté que donner Trieste montrerait au peuple yougoslave la sincérité de l'OTAN. Plusieurs membres de l'OTAN, en particulier l'Italie, ont exprimé leurs réserves sur la proposition yougoslave, soulignant qu'un tel accord enlèverait l'opinion de la population de Trieste et irait à l'encontre du droit à l'autodétermination, laissant l'OTAN vulnérable aux critiques communistes. D'autres se demandent si la Yougoslavie peut offrir beaucoup à l'alliance, car elle pourrait devenir un cheval de Troie pour le communisme."
 YUG_NATO.3.d:0 "Après mûre réflexion, le gouvernement américain a informé le gouvernement yougoslave qu'il ne pouvait accepter la rétrocession de Trieste ou l'adhésion de la Yougoslavie à l'OTAN. Les Américains ont insisté sur le fait qu'ils avaient une grande admiration pour la Yougoslavie, en particulier pour ses succès de guerre et sa résistance à l'hégémonie soviétique. Cependant, les habitants de Trieste ont le droit de disposer d'eux-mêmes et de choisir leur avenir. Ce n'est pas le lieu pour les États-Unis d'interférer dans cela. En privé, au sein des membres de l'OTAN, on craignait que l'acceptation de l'accord n'entraîne des tensions entre les membres. En outre, l'ajout de la Yougoslavie porterait atteinte à l'identité anticommuniste de l'organisation et intégrer son armée aux normes de l'OTAN serait une tâche ardue dans laquelle peu de membres souhaitaient s'engager. Bien que la Yougoslavie ait exprimé sa déception face à la réponse et réitéré ses revendications sur Trieste, elle a promis de continuer à s'engager positivement avec les États-Unis et tous les États de l'OTAN."
 YUG_1950s.3.d:0 "D'horribles nouvelles nous sont parvenues.\nLa récente vague de chaleur et le manque de précipitations substantielles ont conduit une grande partie de la campagne bosniaque à être frappée par une forte sécheresse. Non seulement cela causera de la misère aux populations locales, mais avec le récent embargo imposé par le bloc de Staline, il est maintenant plus important que jamais de lutter pour une production alimentaire nationale. Seul le temps nous dira si notre nation sera capable de persister dans cette sécheresse, surtout si elle s'aggrave."
 YUG_1950s.4.d:0 "C'est devenu pire.\nLa tendance géologique de l'année dernière s'est non seulement poursuivie, mais s'est en fait considérablement aggravée. Une grande partie de la Yougoslavie est aujourd'hui frappée par une grave sécheresse qui a déjà commencé à détruire les récoltes de nos agriculteurs. Il est évident que si nous ne parvenons pas à reconstituer nos approvisionnements alimentaires par quelque moyen que ce soit, beaucoup souffriront non seulement d'une grave malnutrition, mais courront également le risque de mourir de faim. Une telle famine serait dévastatrice pour la sécurité de notre nation, et la force de notre gouvernement actuel ne resterait plus certaine."
 YUG_1950s.5.d:0 "Par une tournure cynique des événements, les récoltes de notre pays, qui se sont taries ces derniers mois et sont par conséquent devenues sans valeur, sont maintenant noyées par de fortes pluies. Non seulement cela a un impact sur la croissance de nos cultures d'hiver vitales, mais cela endommage également les sols pour les temps à venir. Quoi qu'il en soit, cela pourrait être le signe que l'année prochaine, peut-être, ramènera la météo à la normale." 
 YUG_1950s.6.d:0 "Après des années pendant lesquelles l'existence de notre pays a été menacée par Staline et ses acolytes, il est raisonnable de supposer qu'avec la gestion réussie de la crise de sécheresse au début des années 50 et avec l'UDB bien mieux préparée contre tout complot communiste, bon nombre des mesures que nous avons prises pour assurer notre survie peuvent être lentement rejetées et que la normalisation avec le bloc de l'Est pourrait à nouveau être une possibilité.\nNotre nation peut vivre en paix."
 YUG_1950s.7.d:0 "Le Pacte balkanique, officiellement intitulé Accord d'amitié et de coopération, est une initiative diplomatique à signer. Dans le contexte de la guerre froide, ce traité vise à renforcer la collaboration et le soutien mutuel entre les nations signataires de la région des Balkans contre une éventuelle invasion soviétique.\nLe pacte est né d'une reconnaissance commune de l'importance de la stabilité régionale et de la nécessité de coopérer pour relever les défis communs.\nLes principales caractéristiques du Pacte balkanique comprennent des dispositions relatives à la défense et à l'assistance mutuelles en cas d'agression extérieure, ainsi qu'un engagement à résoudre les différends par des moyens pacifiques, bien que cette disposition du Traité d'Ankara ne vise que ces dernières. Les pays signataires entendent favoriser les relations amicales, promouvoir la coopération économique et renforcer les liens culturels. En concluant cet accord, nous visons à créer un front uni qui pourrait contribuer à la paix et à la sécurité régionales"
 YUG_1950s.8.d:0 "L'Accord d'amitié et de coopération ayant été signé en 1953, il est désormais temps d'élargir cette alliance pour y inclure également un accord de sécurité mutuelle entre les signataires, la Grèce, la Turquie et la Yougoslavie. En signant cette expansion, nous promettons notre soutien militaire à la nation yougoslave en cas d'invasion, les intégrant ainsi dans la ceinture de défense de l'Atlantique Nord."
 YUG_1950s.9.d:0 "Comme prévu dès le jour où nous avons envoyé nos invitations, elles ont été chaleureusement acceptées. La Yougoslavie se renforce, non pas seule, mais grâce à ses alliés."
 YUG.51.d:0 "Dans une vague de troubles, la région du Kosovo en Yougoslavie est devenue un foyer de protestations et de manifestations, reflétant les griefs profondément enracinés au sein de la population locale. La région à majorité albanaise a été témoin d'une escalade des tensions, alimentées par les disparités économiques, la marginalisation politique et les griefs culturels. Ce qui a commencé comme des appels pacifiques à l'autonomie et à une représentation égale a pris une tournure violente ces derniers jours, avec des affrontements entre manifestants et autorités. Le dirigeant yougoslave, le maréchal Josip Broz Tito, a déclaré l'état d'urgence pour rétablir l'ordre, déployant des forces de sécurité et imposant des couvre-feux.\n\nLa communauté internationale suit de près la situation et exprime son inquiétude quant au risque de nouvelles violences. Les pays voisins et les puissances mondiales appellent à une résolution pacifique et au dialogue pour résoudre les problèmes sous-jacents qui alimentent les troubles.\n\nLes émeutes au Kosovo soulignent les défis auxquels est confrontée la Yougoslavie de l'après-Seconde Guerre mondiale dans la gestion de son paysage ethnique diversifié. Alors que le monde retient son souffle, l'espoir d'une résolution pacifique et de l'établissement d'une stabilité durable dans la région persiste."
 YUG.52.d:0 "La République socialiste de Serbie est aux prises avec des troubles politiques alors que des informations font état de pogroms contre les voix dissidentes. Apparemment visés par des attaques organisées, les individus associés aux partis d'opposition sont persécutés, arrêtés et déplacés de force.\n\nLe gouvernement dirigé par le SKJ nie toute implication, mais les observateurs internationaux réclament une enquête impartiale. Les récits de témoins oculaires révèlent un effort coordonné visant à réprimer l'opposition politique, suscitant des inquiétudes parmi les États socialistes voisins et les alliés internationaux.\n\nLes médias contrôlés par l'État minimisent la gravité de la situation, décrivant les troubles comme des incidents isolés. Les critiques soutiennent que cette approche suscite la peur et fait obstacle au développement d'une société démocratique. À mesure que les tensions s'intensifient, l'intervention diplomatique et la pression internationale sur la Serbie pour qu'elle respecte les droits de l'homme prennent de l'ampleur. Les événements en cours soulignent l'équilibre délicat entre la consolidation idéologique et l'impératif d'ouverture politique au sein des États socialistes."
 YUG.53.d:0 ""
 YUG.54.d:0 "Skopje est en crise après un puissant tremblement de terre d'une magnitude de 6,1, survenu le 26 juillet 1963. Le séisme a causé d'importants dégâts aux bâtiments et aux infrastructures, en particulier dans le centre-ville. Le bilan des victimes est toujours en cours et les services d'urgence s'efforcent de secourir les survivants.\n\nL'aide internationale, y compris le soutien des pays voisins et des organisations humanitaires, se mobilise pour apporter son aide au lendemain. La République populaire de Macédoine déclare l'état d'urgence alors que les efforts se concentrent sur la sécurité des résidents, la fourniture de soins médicaux et la réponse aux besoins immédiats en matière d'hébergement.\nSkopje, connue pour sa riche histoire, est désormais confrontée à la tâche monumentale de reconstruire des monuments emblématiques et de soutenir les familles déplacées. La catastrophe souligne la nature imprévisible des tremblements de terre et la résilience nécessaire pour reconstruire les communautés."
 YUG.55.d:0 ""
 YUG.56.d:0 "Dans les années 1960, la Yougoslavie, dirigée par Tito, défend l'indépendance diplomatique en participant activement au Mouvement des non-alignés (NAM). Le MNA, né en 1955, vise à créer un bloc de nations indépendant des grandes puissances de la guerre froide. La Yougoslavie apparaît comme un leader naturel, promouvant les principes de non-alignement.\n\nLors de la Conférence de Belgrade de 1961, les dirigeants ont mis l'accent sur l'égalité souveraine et la coexistence pacifique. L'engagement de la Yougoslavie résonne, faisant d'elle un modèle pour les nations cherchant une voie alternative. Tout au long des années 1960, la Yougoslavie a toujours plaidé en faveur d'une résolution pacifique des conflits, du désarmement et de la coopération économique.\n\nFace aux pressions de la Guerre froide, l'engagement de la Yougoslavie en faveur du non-alignement démontre que les nations peuvent suivre une voie indépendante, contribuant ainsi à la stabilité mondiale. Le monde regarde le leadership de la Yougoslavie au sein du Mouvement des non-alignés façonner les relations internationales."
 YUG.57.d:0 ""
 YUG.58.d:0 ""
 YUG.59.d:0 ""
 YUG.60.d:0 "À : Maréchal Tito\n\nJ'apprécie cette opportunité de faire le point en personne sur la question urgente du rôle d'Aleksandar Rankovic, en particulier au sein de l'UDB. Les développements récents ont suscité de sérieuses inquiétudes quant à l'influence de Rankovic, en particulier son potentiel affaiblissement du KOS.\n\nSon rôle historiquement important est éclipsé par des révélations profondément troublantes : Rankovic, dans le passé, vous a espionné personnellement, trahissant la confiance essentielle à notre sécurité collective.\n\nAu sein du parti, les discussions s'intensifient. Si certains reconnaissent ses contributions historiques, nombreux sont ceux qui plaident en faveur d'une réévaluation immédiate, compte tenu des dommages potentiels à la dynamique interne et à la sécurité nationale.\n\nÀ l'extérieur, la controverse constitue un risque grave pour notre image publique et la stabilité nationale. Cela exige une action rapide et décisive.\n\nCompte tenu de l'influence de Rankovic, je recommande fortement un repositionnement stratégique ou, si cela est jugé nécessaire, un changement significatif dans les rôles de leadership. Nous ne pouvons pas nous permettre de sous-estimer la menace potentielle que ses actions font peser sur l'unité de la Ligue des communistes de Yougoslavie.\n\nJe suis prêt à répondre à toutes vos questions ou à d'autres discussions que vous souhaiteriez avoir sur cette question cruciale.\n\nMeilleur,\n###### #######"
 YUG.61.d:0 ""
 YUG.62.d:0 "Rade Bulat, dirigeante de l'organisation culturelle serbe Prosvjeta, fait un pas en avant audacieux en présentant des revendications qui pourraient remodeler le paysage culturel de la région. Bulat, réputé pour son engagement en faveur de la préservation du patrimoine culturel, plaide pour un financement accru et un processus décisionnel plus inclusif au sein de Prosvjeta. Alignées sur l'esprit plus large du MASPOK, ces revendications ont le potentiel de transformer la Prosvjeta en une institution plus dynamique et représentative et de renforcer considérablement les droits culturels des Serbes de Croatie. Ce qu'il demande, c'est la création de deux nouvelles républiques autonomes au sein de la République socialiste de Croatie, à savoir la Dalmatie et la Kninska Krajina. Bien entendu, une telle décision provoquerait certainement l'indignation en Croatie et pourrait inutilement intensifier les protestations. La communauté culturelle regarde avec impatience le déroulement de ces événements historiques, reconnaissant l'importance des efforts de Bulat au cours de cette période de transformation."
 YUG.63.d:0 "Au milieu du mouvement MASPOK, la Croatie connaît actuellement une recrudescence de projets indépendants défendus par la Ligue des communistes de Croatie (SKH). Ces initiatives, qui mettent en valeur la créativité locale et l'esprit communautaire, captent l'attention du public et soulèvent des questions pertinentes sur leurs implications.\n\nLa volonté du SKH de créer des espaces artistiques alternatifs, repoussant les limites de l'expression créative, suscite des discussions sur d'éventuelles connotations nationalistes et leur impact sur l'unité de la Yougoslavie. Simultanément, les efforts de développement communautaire, conçus comme favorisant la solidarité locale, sont sous surveillance en raison de leur éventuelle influence sur la dynamique du pouvoir régional et de leurs relations avec l'identité yougoslave plus large.\n\nAlors que ces initiatives dirigées par SKH se déroulent en temps réel dans le contexte du mouvement MASPOK en cours, elles offrent un aperçu de la dynamique complexe qui façonne la Croatie de 1971. Tout en répondant aux préoccupations locales immédiates, l'équilibre délicat entre l'autonomie régionale et la cohésion nationale reste un point central de discussion, ajoutant une couche d'incertitude pour l'avenir de la Yougoslavie."
 YUG.64.d:0 ""
 YUG.65.d:0 "En réponse au MASPOK, le président Tito a condamné les perturbations tout en reconnaissant et en traitant les griefs. Tito a dévoilé une série de mesures lors d'une conférence de presse à Belgrade, mettant l'accent sur la décentralisation par le biais de réformes politiques visant à accorder plus d'autonomie aux républiques individuelles, dont la Croatie. Il a également reconnu les exigences culturelles en promouvant les langues et expressions régionales.\n\nLes disparités économiques ont été combattues grâce à un engagement en faveur d'une répartition équitable des ressources entre les régions yougoslaves. En outre, Tito a appelé à un dialogue national pour favoriser la compréhension entre les divers groupes ethniques, soulignant son engagement en faveur de l'unité au milieu de la diversité. La réponse multiforme de Tito reflète un équilibre délicat entre la préservation de l'unité nationale et la satisfaction des aspirations à une plus grande autonomie lors du printemps croate."
 YUG.66.d:0 "Dans un développement significatif au cours des récentes périodes de turbulences du MASPOK, Matica Hrvatska s'est retirée de l'accord de Novi Sad de 1954. Annoncée lors d'une conférence de presse à Zagreb, la décision souligne le mécontentement face à l'incapacité de l'accord à répondre à l'évolution du paysage culturel et politique en Yougoslavie.\n\nLe retrait de Matica Hrvatska symbolise un désir plus large d'autodétermination et de protection de l'identité culturelle croate dans le cadre du MASPOK en cours. Cette décision a suscité des débats en Croatie et au-delà, les partisans louant la position audacieuse de Matica Hrvatska, tandis que les critiques expriment leurs inquiétudes quant à son impact sur le délicat équilibre des pouvoirs au sein de la fédération yougoslave.\n\nNous n'avons pas encore répondu officiellement, ce qui ajoute aux tensions entre nous et les nationalistes croates. Alors que le MASPOK se déroule, le retrait de Matica Hrvatska apparaît comme un moment charnière, remodelant la dynamique de la politique et des relations culturelles yougoslaves et attirant l'attention à la fois nationale et internationale."
 YUG.67.d:0 "Dans le sillage du MASPOK, la Yougoslavie est confrontée à un double défi : les revendications croates d'autonomie et une résurgence du nationalisme serbe. La conséquence du MASPOK, les appels à l'autonomie, notamment en Croatie, ont accru les inquiétudes de certains Serbes qui perçoivent ce mouvement comme une menace pour l'unité historique de la Yougoslavie.\n\nLa résurgence du nationalisme serbe trouve son origine dans la crainte que le MASPOK ne sape l'équilibre délicat qui maintient la stabilité en Yougoslavie. Les sentiments nationalistes parmi les Serbes soulignent la nécessité de protéger les intérêts serbes et de préserver l'unité sous un gouvernement fédéral fort.\n\nLe président Josip Broz Tito, déjà reconnu pour sa gestion de la diversité ethnique en Yougoslavie, doit désormais répondre aux aspirations croates tout en apaisant les inquiétudes serbes. Alors que le MASPOK se déroule, l'équilibre délicat entre autonomie et unité est en jeu, mettant à l'épreuve le leadership de Tito et la capacité de la Yougoslavie à gérer les tensions nationalistes."
 YUG.68.d:0 "Alors que j'étais assis à mon bureau sur les îles Brijuni pendant les jours tumultueux du printemps croate, la sonnerie soudaine du téléphone m'a surpris. Une fois que je l'ai récupéré, j'ai découvert qu'il s'agissait d'un appel du Premier ministre soviétique Léonid Brejnev. Un moment de réflexion s'est ensuivi après avoir réalisé qu'il m'offrait en fait un coup de main au cas où le MASPOK s'aggraverait davantage.\n\nLe MASPOK avait suscité des revendications d'autonomie et les échos des sentiments nationalistes étaient forts. La question de savoir s'il fallait ou non accepter l'offre de Brejnev me pesait lourdement. Quelles étaient ses intentions ? S'agirait-il d'une opportunité d'échanges diplomatiques ou d'une tentative d'exploiter les troubles à l'avantage soviétique ?\n\nJe ne pouvais pas échapper à la conscience de la dynamique plus large de la Guerre froide, de la danse complexe entre les superpuissances. Alors que je réfléchissais pour savoir si je devais répondre, les aspirations nationalistes et la fragilité de l'équilibre yougoslave occupaient une place importante dans mes pensées.\n\nEn fin de compte, ma décision de naviguer sur cet échiquier qu'était la diplomatie de la guerre froide a été la suivante..."

 #News Events
 YUG_NATO.2.d:0 "L'OTAN a officiellement accepté la Yougoslavie comme son plus récent État membre. Cela intervient très peu de temps après le récent accord de l'Italie d'accepter la souveraineté yougoslave sur Trieste. L'adhésion de la Yougoslavie à l'OTAN donne à l'alliance une position de premier plan dans les Balkans, un responsable affirmant que l'OTAN pourrait désormais frapper les entrailles du système européen soviétique. De nombreux dirigeants militaires de l'OTAN attendent avec impatience la perspective de moderniser puis de déployer de puissantes forces militaires yougoslaves pour protéger l'alliance de l'agression soviétique. L'Union soviétique a condamné cette décision, la qualifiant d'escalade qui conduirait à une militarisation des Balkans sans précédent depuis les guerres balkaniques. Il y a même des critiques au sein de certains États membres de l'OTAN qui voient la décision de céder Trieste comme une transaction visant à acheter l'adhésion de la Yougoslavie, soulignant que s'ils pouvaient être achetés si facilement, ce qui les empêcherait d'accepter un pot-de-vin soviétique à l'avenir."
 YUG_50s.1.d:0 "La récente crise en Hongrie a vu la Yougoslavie dialoguer avec les deux parties afin de faciliter un résultat positif pour toutes les parties. Bien que certains en Occident et dans le bloc soviétique considèrent les actions yougoslaves comme néfastes, d'autres ont salué ce qui est de plus en plus reconnu comme une neutralité positive. Pendant la crise hongroise, la Yougoslavie a eu des entretiens avec de hauts dirigeants soviétiques et leur a proposé des conseils sur la gestion de la dissidence en Hongrie. Pendant les combats, l'ambassade de Yougoslavie a protégé la famille et les hauts responsables du gouvernement hongrois ciblés par les forces soviétiques. Bien que leurs politiques semblent contradictoires, les Yougoslaves affirment qu'ils ont contribué à atténuer la violence et les tensions en adoptant une position visant à promouvoir une résolution rapide et pacifique tout en restant neutres. Certains pays de la communauté mondiale étudient l'approche yougoslave comme guide sur la façon dont ils peuvent préserver leurs objectifs nationaux sans provoquer de réaction de la part des grandes puissances."
 HungarianRevYug.1.d:0 "Le gouvernement yougoslave a annoncé son soutien sans réserve à la récente intervention soviétique en Hongrie. Le gouvernement a souligné que les communistes hongrois n'avaient pas réussi à contrôler les éléments réactionnaires au sein de la société hongroise. Ils ont permis à ces forces de corrompre la population qui a mené le soulèvement. La seule façon de redonner le pouvoir au peuple hongrois était l'action de l'Union soviétique. Le gouvernement yougoslave a également annoncé qu'il déployait des forces à sa frontière avec la Hongrie afin d'empêcher les forces anti-révolutionnaires de tenter de s'échapper. Il a exhorté les Hongrois à accueillir leurs libérateurs communistes et à se retourner contre les forces anti-révolutionnaires qui tiennent la capitale en otage."
 HungarianRevYug.2.d:0 "Le gouvernement yougoslave continue de soutenir ouvertement la révolution hongroise et condamne l'agression soviétique. De nombreux dissidents hongrois sont actuellement sous la protection de l'ambassade de Yougoslavie, au grand dam des responsables et des chefs militaires soviétiques. En outre, la Yougoslavie continue de soutenir que l'action soviétique était une répression contre les révolutionnaires hongrois qui voulaient simplement créer un État révolutionnaire reflétant les valeurs de son peuple. Ils ne voulaient pas que le modèle soviétique et ses faiblesses sapent leur révolution. Les Soviétiques ont déjà condamné la Yougoslavie pour sa position, et il semble que tout espoir de réconciliation entre les deux principaux États communistes d'Europe semble peu probable."

 #Trieste Events
 tri.3.tension:0 "Pas d'unification de Trieste"
 tri.5.tension:0 "La Yougoslavie envahit Trieste"

#YUG Balkan annexation events
yug_annex.1.d:0 "Depuis quelques mois, la Yougoslavie accroît progressivement son influence sur la Bulgarie. Aujourd'hui, avec des éléments titistes révisionnistes répandus dans tout le pays, ils exigent leur annexion complète à la RPFY. Comment répondre à cette demande ?"
yug_annex.10.d:0 "Il y a quelques jours, la Yougoslavie a demandé l'autorisation soviétique d'annexer notre pays. À notre grande surprise, Moscou a accepté cette demande scandaleuse. Aujourd'hui, Belgrade nous a envoyé une « offre » de rejoindre son pays en tant que « République socialiste de Bulgarie ». Même si nous pourrions bien sûr refuser leurs demandes, le fait que les Soviétiques nous ont effectivement abandonnés, ainsi que la forte influence titiste dans le pays, incitent certains membres du gouvernement à sérieusement envisager d'accepter."
yug_annex.11.d:0 "De manière quelque peu surprenante, Moscou a accepté notre demande d'intégration de la Bulgarie. Sachant que les Soviétiques les avaient abandonnés, les Bulgares ont choisi de faire preuve de bon sens et ont accepté notre offre de faire partie de notre grand pays."
yug_annex.12.d:0 "Si Moscou a accepté nos demandes, on ne peut pas en dire autant des Bulgares eux-mêmes. Bien qu'ils aient été effectivement abandonnés par leur suzerain de facto, ils ont quand même refusé notre offre de nous rejoindre. Comment procédons-nous ?"
yug_annex.13.d:0 "Moscou a refusé nos demandes d'intégration de la Bulgarie. De plus, ils nous ont prévenus qu'ils « réagiraient à toute violation de l'intégrité territoriale bulgare ». Peut-être devrions-nous simplement oublier toute cette affaire..."
yug_annex.14.d:0 "L'URSS nous a informés de la demande yougoslave de notre annexion, qu'elle avait reçue quelques jours plus tôt. Ils ont naturellement refusé et nous ont assuré qu'ils nous protégeraient contre tout acte d'agression étrangère. Il reste à voir comment Belgrade réagira, mais ils reculeront très probablement, car ils savent qu'ils ne peuvent pas affronter l'armée soviétique."
yug_annex.2.d:0 "Depuis quelques mois, la Yougoslavie accroît progressivement son influence sur l'Albanie. Aujourd'hui, avec des éléments titistes révisionnistes répandus dans tout le pays, ils exigent leur annexion complète à la RPFY. Comment répondre à cette demande ?"
yug_annex.20.d:0 "Il y a quelques jours, la Yougoslavie a demandé l'autorisation soviétique d'annexer notre pays. Il est choquant de constater que Moscou a accepté cette demande scandaleuse. Aujourd'hui, Belgrade nous a envoyé une « offre » de rejoindre son pays en tant que « République socialiste d'Albanie ». Même si nous pourrions bien sûr refuser leurs demandes, le fait que les Soviétiques nous ont effectivement abandonnés, ainsi que la forte influence titiste dans le pays, incitent certains membres du gouvernement à sérieusement envisager d'accepter."
yug_annex.21.d:0 "Assez étonnamment, Tirana a cédé à notre bluff et a fait notre travail à notre place ! Le monde est meilleur sans Enver."
yug_annex.22.d:0 "Si Moscou a accepté nos demandes, on ne peut pas en dire autant des Albanais eux-mêmes. Bien qu'ils aient été effectivement abandonnés par leur suzerain de facto, ils ont quand même refusé notre offre de nous rejoindre. Comment procédons-nous ?"
yug_annex.23.d:0 "Moscou a refusé nos demandes d'intégration de l'Albanie. De plus, ils nous ont prévenus qu'ils « réagiraient à toute violation de l'intégrité territoriale albanaise ». Peut-être devrions-nous simplement oublier toute cette affaire..."
yug_annex.24.d:0 "L'URSS nous a informés de la tentative de coup d'État yougoslave, dont elle avait eu connaissance quelques jours plus tôt. Ils l'ont naturellement empêché et nous ont assuré qu'ils nous protégeraient contre tout acte d'agression étrangère. Il reste à voir comment Belgrade réagira, mais ils reculeront très probablement, car ils savent qu'ils ne peuvent pas affronter l'armée soviétique."
yug_annex.25.d:0 "Les révisionnistes de Yougoslavie ont contacté les services de renseignement de notre pays et ont commis l'impensable ! Ils envisagent de renverser le dirigeant légitime de ce pays, Enver Hoxha, tout cela au nom de ce qu'ils appellent « un rêve balkanique ». Peut-on vraiment les croire ?"
