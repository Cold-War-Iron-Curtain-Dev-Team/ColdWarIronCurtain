 fra.7.d:0 "Aujourd'hui, [From.GetNameDef] a créé la Communauté européenne du charbon et de l'acier. Ces pays européens travailleront ensemble pour développer leur industrie et partageront les matériaux nécessaires à la reconstruction après la Seconde Guerre mondiale."
 fra.12.t:0 "[From.GetName] Crée le plan Pleven"
 fra.12.d:0 "[From.GetNameDef] nous invite à rejoindre le Plan Pleven. C'est une coopération militaire entre nous, pays européens."
 fra.13.t:0 "[From.GetName] signé le plan Pleven"
 fra.13.d:0 "[From.GetNameDef] signé le Plan Pleven et rejoint la Coopération Militaire"
 fra.14.t:0 "[GetNewspaperHeader] Mise en place du Plan Pleven"
 fra.14.d:0 "Aujourd'hui, [From.GetNameDef] a établi le Plan Pleven, une coopération militaire entre pays européens pour partager connaissances et expériences."
 wgr.6.t:0 "[From.GetName] Crée l'EDC"
 wgr.6.d:0 "[From.GetNameDef] nous invite à rejoindre la Communauté européenne de défense. Il s'agit d'une coopération militaire entre nous, pays européens, plus forte que le plan Pleven. Son objectif est de contrôler le réarmement ouest-allemand."
 wgr.7.t:0 "[From.GetName] rejoint EDC"
 wgr.7.d:0 "[From.GetNameDef] rejoint la Communauté européenne de défense et la coopération militaire"
 wgr.8.t:0 "[GetNewspaperHeader][From.GetName] a créé l'EDC"
 wgr.8.d:0 "\nAujourd'hui, [From.GetNameDef] a créé la Communauté européenne de défense, une coopération militaire entre pays européens visant à partager des connaissances, des expériences et des équipements. Il s'agit d'une alliance plus forte que le Plan Pleven dont l'objectif est de contrôler le réarmement ouest-allemand."

 news.1032.d:0 "Comme promis, cet événement startup a été créé pour remercier nos mécènes qui nous soutiennent avec leurs dons. Vous serez toujours dans notre foyer :D\n\nUn grand merci jusqu'à présent à : Joe Keshy et MyNameJeff2005"

 excellent:0 "Parfait."
 unfortunate:0 "Malheureux."
 stability.21.t:0 "Esquive des courants d'air"
 stability.21.desc.a:0 "Un nouveau rapport du War Office montre une réduction marquée de la main-d'oeuvre disponible. Il semble que le dernier lot de recrues soit beaucoup plus petit que prévu initialement. Cette divergence fait actuellement l'objet d'une enquête, mais les premières indications indiquent qu'un grand nombre de personnes techniquement aptes au service parviennent à éviter la conscription par divers moyens. Des étudiants de 18 ans deviennent soudainement des ouvriers qualifiés employés dans une industrie de guerre cruciale, d'anciens athlètes échouent à leurs tests de condition physique et, dans certains cas, des recrues ont tout simplement disparu sans laisser de trace.\n\nLorsque les gens sont arrêtés et interrogés, ils soulignent les mauvaises conditions de vie dans l'armée, les officiers indifférents et le fait qu'ils ne veulent pas mourir pour une cause perdue. Les chefs militaires exigent une répression sévère contre les personnes qui évitent de s'enrôler, mais de nombreux membres du gouvernement estiment qu'améliorer les conditions de vie des soldats enrôlés pourrait être la meilleure approche."
 stability.21.desc.b:0 "La réponse officielle inefficace face au rejet généralisé du projet n'a fait qu'aggraver le problème. De plus en plus de recrues ne se présentent jamais après avoir reçu leur lettre de rédaction. Le contre-espionnage a intercepté une brochure rédigée par des professionnels conseillant aux gens comment éviter la conscription, suggérant par exemple de soudoyer des médecins pour certifier que la recrue est médicalement inapte. Les exceptions en faveur des pères de famille ont conduit les veuves de guerre avec enfants à se retrouver confrontées à des demandes en mariage, tandis que le nombre de personnes demandant des exceptions pour des raisons éthiques a atteint un nombre record.\n\nLes chefs militaires ont suggéré d'éliminer les dernières exceptions et de prendre pour exemple quelques esquives qui ont été arrêtées. D'autres membres du gouvernement ont suggéré que nous devrions faire appel au sens du devoir civique de nos citoyens et souligner les conséquences d'une défaite dans cette guerre."
 stability.21.desc.c:0 "Alors que les réponses du gouvernement à l'esquive n'ont eu aucun effet positif, de plus en plus de gens ont commencé à se demander pourquoi ils devraient se mettre en danger tandis que d'autres restent en sécurité. Les recrues qui se présentent déclarent souvent avoir été harcelées ou ridiculisées dans les rues, les traitant d'imbéciles luttant pour une cause vouée à l'échec. Les rapports de mères interdisant à leurs enfants de répondre à l'ordre de conscription sont omniprésents, et le War Office a soumis un rapport affirmant qu'ils ne sont plus sûrs du nombre de personnes qu'ils sont censés recruter, car leur bureaucratie a commencé à s'effondrer sous la pression du traitement de tous ces soldats disparus."
 stability.21.a:0 "On ne peut rien y faire."
 stability.21.d:0 "Nous devrions arrêter toute personne trouvée en train d'échapper à la conscription !"
 stability.21.e:0 "Une augmentation de salaire pour les soldats enrôlés serait peut-être de mise."
 stability.21.f:0 "Il est temps d'adopter des mesures plus sévères."
 stability.21.g:0 "Faire appel au sens civique du peuple."
 stability.21.h:0 "Il faut faire un exemple."
 stability.21.i:0 "Nous devons donner aux gens une raison de se battre."
 stability.22.t:0 "Des grèves !"
 stability.22.desc.a:0 "La production dans plusieurs usines a considérablement ralenti ces derniers jours, les travailleurs ayant déclaré une grève contre toute production de guerre. Exigeant « Paix et du pain ! », ils ont jusqu'à présent refusé toute tentative de négociation d'un règlement. Certains membres du gouvernement ont préconisé une réponse militaire énergique, suivie d'une exécution rapide des meneurs, considérés comme des agents ennemis et des traîtres. Cependant, d'autres membres de la fonction publique ont recommandé une approche plus mesurée, soulignant qu'une réponse brutale pourrait bien se retourner contre eux si les soldats impliqués ne sont pas aussi loyaux que nous le pensions."
 stability.22.desc.b:0 "Les efforts du gouvernement pour convaincre les grévistes de retourner au travail semblent n'avoir eu aucun effet. Au contraire, des grèves ont été signalées dans d'autres usines et les derniers résistants sur les chantiers initialement concernés ont également déposé leurs outils après avoir affronté la colère de leurs collègues. Même si les stocks ont jusqu'à présent réussi à amortir quelque peu le coup porté aux approvisionnements de première ligne, ce n'est qu'une question de temps avant que les arrêts de production commencent à affecter notre capacité à poursuivre la guerre.\n\nLe War Office a de nouveau exhorté le gouvernement à adopter une ligne inflexible envers les grévistes, mais d'autres factions au sein de l'administration ont suggéré que proposer de rencontrer les travailleurs à mi-chemin pourrait suffire à les convaincre de retourner au travail."
 stability.22.desc.c:0 "Ce qui a commencé comme une action revendicative dans quelques endroits isolés s'est maintenant étendu à l'ensemble du pays, affectant même les industries qui ne sont liées à l'effort de guerre que de manière tertiaire. Même le fonctionnement du gouvernement lui-même a été affecté, car de nombreux employés, messagers et chauffeurs de bas niveau ont refusé de se présenter au travail en nombre croissant. \n\nDans de nombreux endroits, les conseils ouvriers ont investi les bâtiments des usines. Les rapports de la police secrète indiquent que certains endroits semblent avoir repris la production d'armes - pour un soulèvement majeur contre ce qu'on appelle « le régime de guerre ».\n\nLe haut commandement militaire estime qu'une action décisive des troupes loyales pourrait encore l'emporter, tandis que la partie civile du gouvernement affirme que cela risque de provoquer une guerre civile et une défaite certaine."
 stability.22.a:0 "Cela va exploser."
 stability.22.b:0 "Faites une démonstration de force militaire dans les villes."
 stability.22.c:0 "Faire des héros de la propagande ceux qui sont encore prêts à travailler."
 stability.22.d:0 "Enrôlez les ouvriers dans le service militaire et placez les usines sous contrôle militaire."
 stability.22.e:0 "Proposer d'augmenter les rations alimentaires des travailleurs."
 stability.22.f:0 "Envoyez les troupes, arrêtez les grévistes, exécutez les meneurs."
 stability.22.g:0 "Proposer une nouvelle législation sociale."
 stability.23.t:0 "Mutineries dans l'armée"
 stability.23.desc.a:0 "Des nouvelles alarmantes sont parvenues au haut commandement militaire concernant un certain nombre d'unités de notre armée refusant les ordres d'officiers supérieurs. Même si aucune des unités n'a quitté sa position dans la ligne, les représentants des soldats ont clairement indiqué qu'ils n'obéiraient à aucun ordre d'attaquer l'ennemi.\n\nLa rébellion a jusqu'à présent été circonscrite à un petit nombre de bataillons et à une poignée d'unités d'entraînement et de soutien, mais de nombreux membres du War Office craignent que ce soulèvement ne s'étende bientôt à d'autres unités et puisse éventuellement nous rendre incapables de poursuivre la guerre. Une action décisive est nécessaire."
 stability.23.desc.b:0 "Les efforts visant à faire face aux mutineries au sein de l'armée n'ont montré aucun effet. Enhardis par l'absence de réponse efficace du gouvernement, les mutins ont élargi leur liste de revendications pour inclure un cessez-le-feu immédiat suivi d'un traité de paix global et d'une démobilisation.\n\nLe War Office recommande fortement que nous envoyions un signal fort aux mutins pour les dissuader de toute nouvelle action de leur part."
 stability.23.desc.c:0 "Le gouvernement ne voulant ou ne pouvant visiblement pas résoudre leurs problèmes, les mutins ont décidé de prendre des mesures entre leurs propres mains. Des élections pour les « Conseils d'ouvriers et de soldats » ont été annoncées, dans le but exprès de prendre le contrôle du pays et de faire la paix avec l'ennemi.\n\nSi des mesures ne sont pas prises rapidement, ces conseils pourraient très bien finir par remplacer notre gouvernement dans certaines régions du pays et nous rendre incapables de poursuivre la guerre."
 stability.23.a:0 "Nous ne pouvons rien y faire maintenant."
 stability.23.b:0 "Entourez les unités mutines de loyalistes et ordonnez-leur de se retirer."
 stability.23.c:0 "Tenez un discours patriotique devant les mutins."
 stability.23.d:0 "Annoncez publiquement que quiconque soutient les mutins sera accusé de trahison."
 stability.23.e:0 "Annoncer une initiative de paix. Assurez-vous que cela est inacceptable pour l'ennemi."
 stability.23.f:0 "Mobilisez les milices loyalistes et arrêtez tous les soldats qui ne sont pas sur leur lieu d'affectation."
 stability.23.g:0 "Proposez aux soldats de leur permettre d'élire leurs propres officiers."
 15_days_tt:0 "La mise en oeuvre prendra environ §Y15 jours§!.\n"
 30_days_tt:0 "La mise en oeuvre prendra environ §Y30 jours§!.\n"
 45_days_tt:0 "La mise en oeuvre prendra environ §Y45 jours§!.\n"
 stability.31.t:0 "La répression militaire réussit"
 stability.31.desc:0 "Notre réponse rapide s'est avérée très efficace. Des unités de la police militaire, appuyées par les forces de l'ordre locales et des volontaires patriotes, ont afflué dans le cadre d'une opération bien coordonnée pour rendre visite à chaque recrue disparue. La plupart étaient prêts à répondre à l'appel lorsqu'ils étaient informés des conséquences s'ils ne se présentaient pas au travail. Le haut commandement militaire a déclaré publiquement que toute personne se présentant à son lieu d'affectation ne sera accusée d'aucun crime ni punie pour ne pas l'avoir fait dans le passé. Pourtant, un certain nombre de personnes ont catégoriquement refusé de prendre les armes pour leur pays et ont été arrêtées."
 stability.31.a:0 "Une action décisive a permis d'éviter le pire."
 stability.32.t:0 "Projet d'émeutes"
 stability.32.desc:0 "Nos tentatives pour résoudre la situation par la force militaire n'ont pas été couronnées de succès. Il semble que quelqu'un au sein de notre administration ait divulgué notre projet d'opération au public, qui a réagi rapidement. Lorsque la police militaire et d'autres forces de l'ordre ont tenté d'appréhender des réfractaires connus, elles ont été bloquées par des foules en colère, exigeant la fin de la guerre et la conscription forcée. Dans plusieurs cas, des combats de rue ont éclaté entre la police et les manifestants, faisant de nombreux morts lorsque les soldats ont été contraints d'utiliser leurs armes pour se défendre. Il a fallu plusieurs heures avant que la police prenne totalement le contrôle de la situation.\n\nUne mauvaise humeur s'est installée dans la capitale alors que les barricades sont enlevées et que les morts sont enterrés. Les rapports du War Office ne montrent aucun changement dans le nombre de recrues se présentant au travail. Beaucoup au sein du gouvernement se demandent combien de temps encore nous pourrons continuer à nous battre dans ces circonstances."
 stability.32.a:0 "La situation n'a pas nécessairement évolué à notre avantage."
 stability.33.t:0 "La rébellion de la conscription"
 stability.33.desc:0 "Nos tentatives pour résoudre la situation par la force militaire n'ont pas été couronnées de succès. Il semble que quelqu'un au sein de notre administration ait divulgué notre projet d'opération au public, qui a réagi rapidement. Lorsque la police militaire et d'autres forces de l'ordre ont tenté d'appréhender des réfractaires connus, elles ont été bloquées par des foules en colère, exigeant la fin de la guerre et la conscription forcée. Dans plusieurs cas, des combats de rue ont éclaté entre la police et les manifestants, faisant de nombreux morts lorsque les soldats ont été contraints d'utiliser leurs armes pour se défendre. \n\nLa situation est rapidement devenue incontrôlable par la suite, alors que les citoyens se sont précipités sur les soldats et ont pris d'assaut les commissariats de police pour s'armer. Plusieurs villes du pays sont désormais en état d'insurrection armée contre le gouvernement. Ironiquement, les rebelles ne semblent avoir aucune difficulté à trouver des soldats prêts à prendre les armes."
 stability.33.a:0 "Oh, alors MAINTENANT, ils veulent se battre !?"
 stability.34.t:0 "Le projet de réforme s'avère efficace"
 stability.34.desc:0 "Les mesures sociales adoptées par le gouvernement dans le cadre d'un processus plus large de réforme de la politique de recrutement militaire se sont révélées étonnamment populaires. Des salaires plus élevés et des congés plus fréquents sont souvent cités comme les nouveaux avantages les plus importants, mais beaucoup soulignent également les nouveaux programmes gouvernementaux destinés à soutenir les veuves et les orphelins de guerre. De moins en moins d'hommes peuvent justifier de refuser l'appel aux couleurs de leur pays, et le soutien du public aux réfractaires a pratiquement disparu.\n\nEn effet, le soutien du public au gouvernement a récemment augmenté, alors que de plus en plus de gens se rendent compte que le mode de vie [ROOT.GetAdjective] est attaqué."
 stability.34.a:0 "Une sage décision."
 stability.35.t:0 "Le 591. Bataillon pénal"
 stability.35.desc:0 "Face à la gravité de la situation, le haut commandement militaire a décidé que des mesures plus drastiques s'imposaient pour montrer que le fait de se soustraire à son devoir civique de défendre son pays ne serait pas toléré. À l'aube, la police militaire a perquisitionné les domiciles d'un certain nombre de personnes soigneusement sélectionnées, bien connues et connectées, qui ont usé de leur influence pour permettre à d'autres d'éviter la conscription. Toujours en chemise de nuit, ils se sont retrouvés enrôlés dans l'armée et escortés jusqu'à la caserne sous garde armée, où ils seront regroupés en une unité distincte, pour éviter que leur influence subversive ne s'étende à d'autres unités. \n\nLa nouvelle s'est répandue rapidement et il semble que la plupart des gens qui pensaient jusqu'à présent pouvoir s'en sortir en ignorant leur projet d'avis ont changé d'avis. Les centres de recrutement à travers le pays rapportent qu'un nombre croissant de personnes sont venues demander quelles seraient exactement les conséquences si un de leurs « amis » qui avait tenté d'éviter la conscription se rendait."
 stability.35.a:0 "Ils peuvent encore se racheter."
 stability.36.t:0 "Les élites locales expriment leur protestation"
 stability.36.desc:0 "Face à la gravité de la situation, le haut commandement militaire a décidé que des mesures plus drastiques s'imposaient pour montrer que le fait de se soustraire à son devoir civique de défendre son pays ne serait pas toléré. À l'aube, la police militaire a perquisitionné les domiciles d'un certain nombre de personnes soigneusement sélectionnées, bien connues et connectées, qui ont usé de leur influence pour permettre à d'autres d'éviter la conscription. Toujours en chemise de nuit, ils se sont retrouvés enrôlés dans l'armée. Leurs familles ont mobilisé leurs vastes réseaux de soutien pour protester contre cette décision. Le War Office a été inondé d'appels et de lettres de simples travailleurs qui souhaitent que leur directeur d'usine revienne aux sous-secrétaires de divers autres ministères, exigeant de savoir pourquoi les personnes travaillant dans des domaines essentiels à l'effort de guerre ont été démis de leurs fonctions. Il semble que même certains membres du cabinet aient des doutes sur la guerre - craignant peut-être pour la sécurité de leurs propres fils."
 stability.36.a:0 "N'ont-ils aucun sens du devoir ?"
 stability.37.t:0 "\"Un devoir sombre et sacré\""
 stability.37.desc:0 "\"Bien sûr, je veux vivre. Je veux terminer mes études, je veux rencontrer des filles, je veux fonder une famille - mais si nous perdons cette guerre, je ne pourrai pas non plus faire ces choses. Alors je me bats.\"\n\nLa lettre, envoyée anonymement à tous les grands journaux du pays, a fait énormément de bruit. Affirmant appartenir à un soldat qui a d'abord tenté d'éviter la conscription, mais a ensuite réalisé qu'il devait se battre pour sauver son pays, cela a apparemment touché une corde sensible chez beaucoup d'autres qui ressentaient la même chose. Les comités de sélection de tout le pays rapportent que le nombre de personnes qui refusent toujours de répondre à leur convocation a été plus que compensé par de nouveaux volontaires qui n'attendront plus qu'on les appelle, tandis que d'autres partent se battre pour sauver leur pays et leur mode de vie."
 stability.37.a:0 "Nous ne laisserons pas leur vie être gaspillée en vain."
 stability.38.t:0 "La fin d'un lâche"
 stability.38.desc:0 "\"Ils l'ont conduit au mur à l'aube. Il a refusé une dernière cigarette, mais a accepté le bandeau sur les yeux. Ses derniers mots ont été des excuses à sa mère pour lui avoir causé tant de douleur. Le peloton d'exécution a bien visé. Quelques minutes plus tard, le médecin présent l'a déclaré mort.\"\n\nMême si elles n'ont pas réussi à arrêter toutes les personnes qui ont échappé à la conscription, les autorités ont pu procéder à un certain nombre d'arrestations. Compte tenu de la grave situation dans laquelle nous nous trouvons, le War Office a décidé que ces hommes seraient jugés selon le droit militaire pour ne pas s'être présentés au travail. La première série de condamnations à mort a été prononcée et les condamnés ont été exécutés par un peloton d'exécution. Ces mesures ont évidemment eu l'effet escompté. Il semble que la plupart des gens ont décidé de choisir la possibilité de mourir sur le champ de bataille plutôt que la certitude d'une mort déshonorante en tant que lâche."
 stability.38.a:0 "C'est dommage qu'il ait fallu en arriver là."
 stability.39.t:0 "Un martyr pour la paix"
 stability.39.desc:0 "\"Ils l'ont conduit au mur à l'aube. Il a refusé une dernière cigarette, mais a accepté le bandeau sur les yeux. Ses derniers mots ont été des excuses à sa mère pour lui avoir causé tant de douleur. Le peloton d'exécution a bien visé. Quelques minutes plus tard, le médecin présent l'a déclaré mort.\"\n\nLe rapport publié sur l'exécution d'un homme condamné à mort pour non-présentation au travail semble avoir eu l'effet inverse. Plutôt que de ramener les gens sous les couleurs par peur des conséquences, cela a fait des personnes exécutées des martyrs instantanés du mouvement pacifiste. Leurs noms et histoires de vie ont été publiés et très clairement édités pour les faire apparaître sous le meilleur jour possible. Des manifestations massives pour la paix ont commencé dans plusieurs grandes villes, exigeant la fin de la guerre. Le War Office rapporte qu'il a reçu un certain nombre de lettres de conscrits déclarant ouvertement qu'ils ne se présenteraient pas au travail - disant qu'ils ne participeraient en aucun cas à une autre exécution, sauf en tant que personne à exécuter."
 stability.39.a:0 "Les choses ne se sont pas nécessairement améliorées."
 stability.40.t:0 "Une nouvelle donne pour [Root.GetNameDef]"
 stability.40.desc:0 "Dans un discours diffusé aujourd'hui à la radio, [Root.GetLeader] a annoncé ce qu'il a appelé une « Révolution sociale ». Au cours de l'heure suivante, il a présenté un système de réformes qui touchent tous les aspects de la vie sociale, promettant à chaque soldat revenant au pays une éducation, un emploi bien rémunéré et une pension généreuse. Il a également annoncé un important programme de construction de logements abordables pour les jeunes familles, qui débutera le jour de la signature de l'armistice. Cela semble avoir eu un effet significatif sur le moral général. Les bureaux de recrutement à travers le pays signalent que des conscrits se présentent et demandent quelles sont les options permettant d'étendre leur service au-delà du conflit actuel, tandis que d'autres exigent pratiquement une affectation dans des unités de première ligne pour garantir des avantages supplémentaires."
 stability.40.a:0 "Et on paie tout ça, comment... ?"
 strikes_event.1.t:0 "Commande rétablie"
 strikes_event.1.desc:0 "Rapidement, le haut commandement militaire a mobilisé un certain nombre d'unités de formation pour le service et a formé des groupes ad hoc de soldats en congé. Faire défiler ces formations devant les portes des usines a eu l'effet escompté, car la plupart des grévistes ne voulaient pas forcer une confrontation aux conséquences potentiellement mortelles. Les rares qui ont essayé de persuader les soldats de faire cause commune ont trouvé que leurs paroles n'avaient que peu d'effet car les soldats ont demandé pourquoi les travailleurs de l'arrière confortable devraient être autorisés à laisser tomber les combattants du front."
 strikes_event.1.a:0 "Pourquoi en effet."
 strikes_event.2.t:0 "Lundi sanglant"
 strikes_event.2.desc:0 "Rapidement, le haut commandement militaire a mobilisé un certain nombre d'unités de formation pour le service et a formé des groupes ad hoc de soldats en congé. Le déplacement de ces formations vers les villes touchées s'est toutefois avéré beaucoup plus difficile que prévu, car les grévistes ont bloqué les voies ferrées et forcé les troupes à entrer à pied, leur laissant suffisamment de temps pour se préparer. Lorsque nos troupes atteignirent les usines barricadées, elles trouvèrent les grévistes prêts à les affronter. Les tentatives de dégager les routes se sont heurtées à des attaques furieuses de la part des ouvriers jetant des pierres et des bouteilles sur les soldats. \n\nÀ plusieurs reprises, les troupes ont ouvert le feu pour se défendre, tuant un certain nombre de grévistes et en blessant des dizaines d'autres. Cela n'a fait qu'exaspérer encore plus la foule, avec des cris de « Meurtriers ! Remplissant l'air des passants. L'ambiance dans la capitale a radicalement tourné en faveur des grévistes. A la tombée de la nuit, les soldats se retirèrent, laissant les barricades intactes.\n\nIl n'y a eu aucune autre tentative pour forcer la situation. Les grévistes gardent le contrôle des usines et aucun travail n'est effectué."
 strikes_event.2.a:0 "Pas comme prévu."
 strikes_event.3.t:0 "Héros sur le front de la production"
 strikes_event.3.desc:0 "\"La guerre industrielle est bien plus que de simples divisions en marche et des bombardements d'avions. C'est plus que le simple devoir d'un soldat de se battre et de mourir pour son pays. Une guerre industrielle se gagne avant tout dans les usines et les fonderies. Abandonner la bataille sur la chaîne de montage n'est pas mieux que de l'abandonner sur la ligne de front. Et les victoires de la chaîne de montage doivent être célébrées tout autant que celles remportées par la ligne de front.\"\n\nToutes les ressources de propagande disponibles ont été réorientées pour montrer le travail des travailleurs de l'armement sous le meilleur jour possible. [Root.GetLeader] a personnellement approuvé une nouvelle récompense qui sera décernée aux travailleurs qui ont dépassé leur quota de plus de 100 %, et les premiers lauréats ont été envoyés en tournée à travers le pays pour enseigner leurs méthodes à d'autres travailleurs.\n\nIl semble que cela ait amené de nombreux grévistes à reconsidérer leur position. Le travail a repris dans toutes les usines précédemment touchées."
 strikes_event.3.a:0 "Des héros, tous et toutes."
 strikes_event.4.t:0 "Le Département de Production de Guerre"
 strikes_event.4.desc:0 "[Root.GetLeader] a annoncé aujourd'hui quelques petits changements au projet. Alors que les travailleurs qualifiés étaient auparavant exemptés de la conscription militaire, cette exception a désormais été supprimée et tous les hommes exemptés ont été immédiatement enrôlés. Dans le même temps, le War Office a été autorisé à prendre le contrôle direct de toute usine produisant des biens utiles à l'effort de guerre si la direction de ces usines faisait preuve d'un manque de compétence.\n\nCette annonce a suscité une résignation silencieuse dans les villes concernées, en particulier lorsqu'il a été annoncé que toute personne résistant serait traitée de la même manière qu'un soldat refusant d'obéir aux ordres. Alors que le moral des ouvriers des usines est au plus bas, la production a repris."
 strikes_event.4.a:0 "J'aurais dû le faire dès le début."
 strikes_event.5.t:0 "Un pays en défi"
 strikes_event.5.desc:0 "[Root.GetLeader] a annoncé aujourd'hui quelques petits changements au projet. Alors que les travailleurs qualifiés étaient auparavant exemptés de la conscription militaire, cette exception a désormais été supprimée et tous les hommes exemptés ont été immédiatement enrôlés. Dans le même temps, le War Office a été autorisé à prendre le contrôle direct de toute usine produisant des biens utiles à l'effort de guerre si la direction de ces usines faisait preuve d'un manque de compétence.\n\nCette annonce a suscité de grands rires dans les villes concernées, surtout lorsqu'il a été annoncé que toute personne résistant serait traitée de la même manière qu'un soldat refusant d'obéir aux ordres. Les policiers envoyés pour remettre les convocations aux travailleurs ont été priés de revenir avec plus que de l'encre sur du papier."
 strikes_event.5.a:0 "Peut-être devrions-nous le faire."
 strikes_event.6.t:0 "Mangeurs utiles"
 strikes_event.6.desc:0 "Sans mentionner les grèves en cours, [Root.GetLeader] a annoncé aujourd'hui que les travailleurs des industries liées à la guerre recevront des rations supplémentaires de sucre, de café et de viande pour maintenir leurs forces. Malheureusement, les rumeurs selon lesquelles le gouvernement serait disposé à distribuer davantage de chocolat se sont révélées fausses.\n\nAlors que les meneurs de la grève tentent d'empêcher les travailleurs de retourner au travail, la plupart semblent avoir accepté que « la paix et le pain » n'arriveront jamais et se contentent du pain."
 strikes_event.6.a:0 "Ils feraient mieux de gagner leur vie."
 strikes_event.7.t:0 "Opération Chêne Noir"
 strikes_event.7.desc:0 "Les troupes se sont rassemblées à l'extérieur des villes pendant la nuit, maintenant du bruit et une légère discipline pour conserver l'élément de surprise. Alors que le soleil se levait à l'horizon et que les ouvriers qui tenaient les barricades des usines attendaient avec impatience d'être soulagés par l'équipe de jour, les colonnes d'assaut sont intervenues. Les ouvriers fatigués ont mis du temps à organiser la résistance et l'ont rapidement vaincue. Laissant un petit détachement pour garder les prisonniers, les troupes ont balayé la ville, arrêtant tous ceux figurant sur la liste des ouvriers d'usine connus. À midi, l'armée avait pris le contrôle total des villes et instauré un couvre-feu. Aucune autre résistance n'est attendue. La majorité des travailleurs seront bientôt libérés à condition qu'ils reprennent le travail, les dirigeants du groupe seront détenus et jugés. Des condamnations à mort devraient être prononcées."
 strikes_event.7.a:0 "L'ordre a été rétabli."
 strikes_event.8.t:0 "La bataille d'Oak Street"
 strikes_event.8.desc:0 "Les troupes se sont rassemblées à l'extérieur des villes pendant la nuit, mais la mauvaise discipline en matière de lumière et de bruit a trahi la surprise. Alors que les troupes avançaient, elles trouvèrent les ouvriers alertes et prêts à les affronter. Le premier assaut s'effondre sous des grêles de pierres lancées. Un deuxième assaut à la baïonnette au canon a été repoussé au cours de violents combats au corps à corps, faisant des dizaines de morts et de mourants dans les rues.\n\nLes officiers en charge se sont retirés pour consolider leurs forces, tandis que les ouvriers étendent leurs fortifications et s'arment avec les armes laissées sur place lors de la retraite. Une deuxième journée de combats est attendue demain, mais le haut commandement militaire ne croit plus à la probabilité d'une victoire."
 strikes_event.8.a:0 "Nous manquons rapidement d'options."
 strikes_event.9.t:0 "La loi sur la protection des droits des travailleurs"
 strikes_event.9.desc:0 "Alors que les tensions sont vives dans la capitale, [Root.GetLeader] a annoncé une nouvelle loi pour protéger les droits des travailleurs même en temps de guerre. Cette législation radicale impose des congés de maladie payés sans limites, une assurance accident obligatoire pour chaque travailleur, le droit d'adhérer à n'importe quel syndicat ainsi que, pour la première fois, le droit pour toute femme employée d'avoir un congé de maternité après la naissance d'un enfant.\n\nAlors que beaucoup au sein du gouvernement considèrent cela comme une simple capitulation face aux grévistes, les résultats sont concluants : le travail a repris dans toutes les usines."
 strikes_event.9.a:0 "Espérons que cela suffira."
 mutiny_event.1.t:0 "Mutinerie écrasée"
 mutiny_event.1.desc:0 "Après quelques heures de négociations tendues aux portes des casernes et dans les abris de première ligne, la mutinerie de notre armée est terminée. Face à la perspective d'un combat qu'ils ne pourraient gagner, les mutins décidèrent rapidement de se retirer. \n\nLa question principale était alors le sort de ceux qui avaient refusé les ordres. Le haut commandement militaire a opté pour la clémence et a assuré aux mutins qu'ils ne seraient pas sévèrement punis. Quelques exemples ont été donnés dans lesquels certains soldats ont été rétrogradés à un grade inférieur et transférés dans une autre unité."
 mutiny_event.1.a:0 "Espérons que ce soit la fin."
 mutiny_event.2.t:0 "Une menace vide de sens"
 mutiny_event.2.desc:0 "Les tentatives visant à effrayer les mutins et les amener à se soumettre se sont retournées contre eux de façon spectaculaire, car les troupes ont montré peu de crainte à l'égard des unités envoyées pour les réprimer. Grâce à leurs compétences acquises sur le front, ils organisèrent rapidement une défense de leurs positions qui rendrait très coûteuse toute tentative de les vaincre. \n\nLes officiers en charge des unités loyalistes se sont retirés et attendent de nouveaux ordres, mais ce petit succès a sans doute renforcé la détermination des mutins."
 mutiny_event.2.a:0 "Personne n'aurait pu prédire cela."
 mutiny_event.3.t:0 "\"Pourquoi nous battons-nous ?\""
 mutiny_event.3.desc:0 "Il n'est pas rare qu'un soldat doute que ce qu'il fait en vaut vraiment la peine. Y a-t-il quelque chose qui puisse justifier les sacrifices que nous vous demandons ? Pouvons-nous vraiment exiger que vous mourriez potentiellement en poursuivant un objectif que vous ne verriez jamais ?\n\nC'est un fait malheureux que nous devons vivre à l'époque dans laquelle nous sommes nés. Le destin a décidé que nous devons être en guerre, pour protéger notre liberté, nos maisons, notre [Root.GetAdjective] mode de vie ! Nous n'avons pas choisi cette guerre, elle nous a été imposée ! Vous savez que je ne vous demanderai rien que je ne serais pas disposé à faire moi-même, et je sais que vous ferez tout ce qui est nécessaire pour assurer la victoire. »\n\n[Root.GetLeader]le discours de devant les troupes semble avoir eu l'effet escompté, puisque les soldats ont éclaté de joies spontanées et sont retournés à leurs fonctions sans plus de plaintes que d'habitude."
 mutiny_event.3.a:0 "Bon discours."
 mutiny_event.4.t:0 "La loi sur la trahison en temps de guerre"
 mutiny_event.4.desc:0 "Alors que le War Office fait de son mieux pour empêcher que la mutinerie actuelle au sein de l'armée ne soit largement connue, la censure des lettres ne peut aller jusqu'à présent. Les soldats en permission ont rapidement fait savoir que l'armée n'était plus disposée à saigner inutilement dans cette guerre.\n\nSans mentionner spécifiquement la mutinerie, [Root.GetLeader] a annoncé aujourd'hui que le gouvernement considérerait désormais comme une trahison tout acte reflétant un manque d'engagement dans la guerre.\n\nLes sanctions en cas de trahison sont bien connues et le soutien du public aux mutins s'est pratiquement évaporé. Bien entendu, la nouvelle s'est largement répandue. Constatant peu de soutien de la part de la population, les soldats ont tranquillement repris leurs fonctions."
 mutiny_event.4.a:0 "Nous ne devrions pas avoir à préciser cela."
 mutiny_event.5.t:0 "La tentative de répression échoue"
 mutiny_event.5.desc:0 "Alors que le War Office fait de son mieux pour empêcher que la mutinerie actuelle au sein de l'armée ne soit largement connue, la censure des lettres ne peut aller jusqu'à présent. Les soldats en permission ont rapidement fait savoir que l'armée n'était plus disposée à saigner inutilement dans cette guerre.\n\nLes tentatives du gouvernement pour endiguer la marée ont complètement échoué. Les rapports de la police secrète indiquent que les mutins bénéficient d'un fort soutien dans le grand public, ce qui rend peu probable que nous puissions les isoler et les réprimer."
 mutiny_event.5.a:0 "Ce manque de respect des lois est profondément inquiétant."
 mutiny_event.6.t:0 "L'offre de paix [Root.GetAdjective]"
 mutiny_event.6.desc:0 "[Root.GetLeader] a annoncé aujourd'hui à la presse que sa dernière offre de paix avait échoué. Même si les causes de cette malheureuse tournure des événements sont très complexes, l'exigence du [Root.GetAdjective] que l'autre partie paie pour tous les dommages causés, désarme complètement et reconnaisse publiquement qu'elle a déclenché la guerre a peut-être été la goutte d'eau qui a fait déborder le vase.\n\nNos ennemis ont répondu de la même manière, qualifiant nos demandes raisonnables d'exigence de reddition inconditionnelle. Ils ont promis qu'ils poursuivraient cette guerre jusqu'au bout. \n\nAlors que nos ennemis ne veulent manifestement pas entendre raison et promettent de continuer à se battre, les tentatives des mutins pour imposer un accord de paix ont échoué."
 mutiny_event.6.a:0 "Terrible honte."
 mutiny_event.7.t:0 "La répression militaire réussit."
 mutiny_event.7.desc:0 "Malgré quelques cas où de petits groupes de mutins ont décidé de se battre, notre opération visant à écraser la rébellion a été un succès éclatant. S'appuyant sur le nombre plutôt que sur leurs compétences, les milices loyalistes ont encerclé les bastions des mutins et ont exigé leur reddition. La plupart des soldats ont décidé de ne pas prendre les armes contre leurs propres compatriotes et se sont rendus pacifiquement. \n\nLes meneurs seront jugés devant des cours martiales secrètes, mais le soldat moyen sera renvoyé au front, bien que dans une unité différente, pour empêcher les mutins de former de nouvelles cellules."
 mutiny_event.7.a:0 "Bravo."
 mutiny_event.8.t:0 "Frère contre frère"
 mutiny_event.8.desc:0 "Nos tentatives pour empêcher les élections des conseils d'ouvriers et de soldats ont aggravé la situation au-delà même des estimations les plus pessimistes. Plutôt que de se rendre, les mutins ont formé des conseils provisoires, élu des commandants sur le terrain et installé des défenses dans les rues. Il est clair qu'ils veulent en faire un combat.\n\nLes divisions au sein de l'armée traversent désormais toutes les unités et souvent même entre les membres d'une même famille. [Root.GetNameDefCap] se trouve au bord d'une guerre civile."
 mutiny_event.8.a:0 "Cela ne cesse de s'aggraver."
 mutiny_event.9.t:0 "Une nouvelle génération d'officiers"
 mutiny_event.9.desc:0 "Malgré les fortes objections de l'armée, chaque unité de l'armée [Root.GetAdjective] a procédé à des élections pour élire son commandant. Les résultats ont été très surprenants, car la plupart des élus sont des militaires accomplis possédant une grande expérience sur le terrain. Même si de nombreux officiers professionnels considèrent encore cela comme une insulte personnelle, il ne fait aucun doute que la plupart des soldats préfèrent considérablement cette situation."
 mutiny_event.9.a:0 "Cela ne devrait pas fonctionner, n'est-ce pas ?"
 if_they_accept:0 "S'ils acceptent :\n"
 generic.12.t:0 "[From.GetAdjective] Tentatives de sabotage de Suez"
 generic.12.d:0 "Les renseignements militaires indiquent que les [From.GetAdjective] ont l'intention de recourir à des démolitions et à des blocages à grande échelle pour saboter le canal de Suez. Si nous voulons les arrêter, nous n'avons pas beaucoup de temps."
 generic.12.a:0 "Nous ne pouvons pas permettre cela !"
 generic.13.t:0 "[From.GetAdjective] Tentatives de sabotage du Panama"
 generic.13.d:0 "Les renseignements militaires indiquent que les [From.GetAdjective] ont l'intention de recourir à des démolitions et à des blocages à grande échelle pour saboter le canal de Panama. Si nous voulons les arrêter, nous n'avons pas beaucoup de temps."
 generic.14.t:0 "[From.GetName] Problèmes de protestation diplomatique"
 generic.14.d:0 "[From.GetAdjective] les envoyés ont déposé une vive protestation diplomatique auprès de notre gouvernement concernant la présence de nos attachés dans les pays avec lesquels ils sont actuellement en conflit militaire. Ils exigent le rappel immédiat de notre mission militaire."
 generic.14.a:0 "C'est une demande raisonnable."
 generic.14.b:0 "Nos attachés seront envoyés où bon nous semble."
 generic.15.t:0 "[From.GetName] Attaché de rappel"
 generic.15.d:0 "En réponse à nos demandes, [From.GetNameDef] a retiré sa mission militaire auprès de nos ennemis."
 generic.16.t:0 "[From.GetName] Maintient Attaché"
 generic.16.d:0 "Malgré nos demandes, [From.GetNameDef] a refusé de retirer sa mission militaire auprès de nos ennemis, déclarant que « nous n'avons pas à nous mêler des affaires intérieures [From.GetAdjective] »."
 generic.16.a:0 "Nous verrons à ce sujet."
 generic.17.t:0 "[From.GetName] Tombe malade"
 generic.17.d:0 "Dans le service [From.GetHerHis] vers [From.From.GetNameDef], il semble que [From.GetRank] [From.GetName] ait poussé [From.GetHerselfHimself] trop loin. En raison du mauvais climat dans leur zone d'opération, le [From.GetRank] est désormais tombé malade et aura probablement besoin d'un certain temps pour se rétablir. Jusqu'à ce que [From.GetSheHe] se rétablisse, [From.GetSheHe] ne fonctionnera pas au niveau habituel de [From.GetHerHis]."
 generic.18.t:0 "[From.GetName] Blessé"
 generic.18.d:0 "En menant la bataille à bonne fin, il semble que [From.GetRank] [From.GetName] ait mis [From.GetHerselfHimself] un peu trop de risques tout en dirigeant [From.GetHerHis] hommes. [From.GetSheHeCap] a été blessé, et il faudra probablement un certain temps pour que les blessures guérissent complètement, jusqu'à ce moment-là, le [From.GetRank] ne fonctionnera pas au niveau habituel de [From.GetHerHis]."
 
 spr.1.d:0 "Avec la signature du Pacte de Madrid, l'État espagnol a mis fin à sa période d'isolement. Dans un traité signé par l'Espagne et les États-Unis, les États-Unis donneront à l'Espagne de l'argent pour l'aider à améliorer son armée et son économie. En échange de l'aide américaine à l'Espagne, l'Espagne a accepté de permettre aux États-Unis d'utiliser des terrains pour des bases aériennes et navales sur le territoire espagnol. Ce nouveau traité met fin à une période de l'histoire de l'Espagne depuis la fin de la Seconde Guerre mondiale, marquée par l'isolationnisme espagnol et détestée par la plupart des pays parce qu'ils étaient fascistes et pro-nazis et comme puissances pro-Axe. Le Pacte est considéré comme un nouveau départ pour l'Espagne et comme le signe que le monde commence à considérer l'Espagne sous un jour plus positif."
 spr.2.d:0 "Dans un discours prononcé par [SPR.GetLeader], il a été annoncé que l'Espagne expatrierait les anciens nazis en fuite en Espagne."
 spr.3.d:0 "Comme prévu, la plupart des anciens chemises ont désormais été retirées de leurs fonctions et remplacées par de nouveaux membres apportant leur plein soutien à notre régime."
 spr.4.d:0 "Les Nations Unies ont gagné un autre État membre. Comme l'a annoncé Dag Hammarskjöld, l'Espagne a été acceptée comme membre de l'ONU."
 spr.8.d:0 "L'Espagne, qui a récemment vu son dictateur fasciste Francisco Franco renversé par les communistes, nous demande désormais de les protéger. En échange, nous gagnerions un nouvel allié en Ibérie et un contrôle énorme sur leur pays."
 
 pru.3.d:0 "Suite au coup d'État qui a laissé Manuel A. Odría au poste de dictateur militaire du Pérou, l'Alliance révolutionnaire populaire américaine a été rapidement interdite pour écraser l'opposition. Son chef, Víctor Raúl Haya de la Torre, est rapidement devenu une cible lorsque la police fait irruption dans son bureau et le trouve complètement abandonné. Une enquête rapide a révélé que De La Torre a réussi à s'enfuir vers l'ambassade équatorienne juste à temps avec la plupart de ses affaires importantes."
 
 cominplot.1.d:0 "En 1948, la Yougoslavie fut expulsée du Kominform en invoquant des « éléments nationalistes » qui avaient « réussi au cours des cinq ou six derniers mois à atteindre une position dominante dans la direction » du KPS. L'expulsion a effectivement banni la Yougoslavie de l'association internationale des États socialistes. Après l'expulsion, Tito a supprimé ceux qui soutenaient la résolution, les qualifiant de « communistes ». Aujourd'hui, ces communistes ont commencé à mieux s'organiser et à formuler un plan pour se débarrasser de Tito et remettre la Yougoslavie sur la bonne voie."
 cominplot.2.d:0 "Après des semaines de préparation, les cominformistes ont réussi à tuer Tito. Alors qu'il se promenait sur la place Nikola Pasic, un homme s'est approché de Tito et a tiré deux coups de feu dans sa direction avec un pistolet TT-33, une balle touchant son cou et une autre son poumon gauche. Tito a été transporté d'urgence à l'hôpital Vojnomedicinska akademija de Banjica, où son décès a été constaté 20 minutes plus tard. L'agresseur, Veselko Sedlacek, 24 ans, a été abattu et est décédé sur place."
 cominplot.3.d:0 "Josip Broz Tito, leader de la Yougoslavie, a été assassiné hier à Belgrade. Lors d'une promenade sur la place Nikola Pasic à Belgrade, Veselko Sedlacek, 24 ans, a tiré sur Tito à deux reprises, le touchant au cou et au poumon gauche. Tito a été immédiatement transporté d'urgence à l'hôpital de l'Académie de médecine militaire du quartier de Banjica à Belgrade, où son décès a été constaté 20 minutes plus tard. L'agresseur a été abattu sur place. Les services de sécurité enquêtent désormais sur le mobile de ce meurtre. Les rumeurs disent que l'assassinat aurait été organisé par un groupe pro-soviétique connu sous le nom de Cominformistes."
 cominplot.4.d:0 "Le redouté leader de l'UDBA, Aleksandar Rankovic vient d'être assassiné. Alors qu'il se trouvait devant le siège de l'UDBA, un tireur isolé a réussi à lui frapper la tête, le tuant sur le coup. L'agresseur a réussi à s'enfuir, mais a laissé une note indiquant son mobile."
 cominplot.5.d:0 "Notre gouvernement a été attaqué ! Plus tôt dans la journée, des insurgés communistes mécontents ont frappé fort et rapidement le bâtiment du Capitole à [YUG.Capital.GetName]. Lors d'une frappe précise, les groupes rebelles ont percé un équipage réduit de gardes militaires, prenant d'assaut le bâtiment et tuant [YUG.GetLeader] dans une véritable blitzkrieg. Aujourd'hui, les communistes ont pris le pouvoir et ont déclaré un nouveau gouvernement aligné sur le Kominform et le [SOV.GetNameDef]."
 cominplot.6.d:0 "Des poches d'insurgés alignés sur le Kominform ont pris d'assaut le bâtiment du Capitole yougoslave à [YUG.Capital.GetName] tôt ce matin. Depuis le schisme entre les [SOV.GetNameDef] et les [YUG.GetNameDef] dans les premières années de la guerre froide, les deux nations communistes ont été particulièrement aigres. Maintenant que le gouvernement précédent a été renversé lors d'une frappe de précision contre la capitale yougoslave, les [YUG.GetRulingParty] ont commencé à ouvrir davantage leurs relations avec le Kominform et la Russie des [SOV.GetLeader]."
 
 cultural_events.5.d:0 "Aujourd'hui, le 11 septembre 1977, nous voyons la technologie orner les maisons de certains avec l'Atari 2600, une console de salon lancée à 199 $ US sur le marché nord-américain avec deux joysticks et une copie du jeu vidéo \"Combat\" avec huit autres jeux disponibles à l'achat dès maintenant." 
 cultural_events.6.d:0 "Dans Technology News, aujourd'hui 15 juillet 1983, nous assistons à la sortie du Famicom (Family Computer) de la célèbre société Nintendo, le cerveau derrière Donkey Kong, qui se vend régulièrement sur le marché domestique. La Famicom est livrée avec trois jeux Donkey Kong, Donkey Kong Jr. Et Popeye. Des rapports ont fait état de crashs d'unités précoces en raison d'un problème de chipset, cela reste à résoudre."
 cultural_events.7.d:0 "\nLes files d'attente sont longues et les espoirs sont grands puisqu'aujourd'hui, le 18 octobre 1985, Nintendo sort enfin sa Nintendo Entertainment System avec un boîtier repensé par rapport à son frère de sang japonais, la Famicom, sorti 2 ans plus tôt. Révélée au Consumer Electronics Show, cette conception à force d'insertion nulle apporte une conception à chargement frontal au lieu d'un chargement par le haut. Ce nouveau système propose 17 jeux, 10-Yard Fight, Baseball, Clu Clu Land, Duck Hunt, Excitebike, Golf, Gyromite, Hogan's Alley, Ice Climber, Kung Fu, Pinball, Soccer, Stack-Up, Tennis, Wild Gunman, Wrecking Crew et Super Mario Bros qui s'est révélé dans les 24 heures suivant sa sortie comme étant le plus populaire du groupe."
 cultural_events.8.d:0 "Le soldat perdu dans le temps s'est rendu après que le local Norio Suzuki l'ait convaincu de quitter son poste après avoir pris contact avec son ancien supérieur, le major Yoshimi Taniguchi. Le major Taniguchi est retourné avec Suzuki à Lubang pour demander à Hiroo Onoda de se rendre officiellement au palais de Malacañang. Il s'est rendu avec son épée, son fusil Arisaka Type 99 en état de marche, 500 cartouches et plusieurs grenades à main, ainsi que le poignard que sa mère lui avait donné. Après avoir tué au moins 30 personnes, il a obtenu une grâce du président Ferdinand Marcos."
 KOR_RAID.3.d:0 "Le conflit dans la péninsule coréenne a atteint les plus hauts échelons du gouvernement sud-coréen, la Corée du Nord ayant tenté en vain d'assassiner le président Park Chung Hee dans sa résidence personnelle, la Maison Bleue. L'unité 124, le commando le plus prestigieux de Corée du Nord, a été choisie par Kim Il-sung lui-même pour assassiner Park afin que la Corée du Sud, en proie à une crise de leadership, ne soit pas en mesure de répondre correctement à une invasion de la Corée du Nord. Le raid a toutefois échoué, car leur plan a été lancé prématurément en raison d'une rencontre malheureuse avec la police locale, suivie par la réponse rapide de l'armée de la République de Corée. Ce raid est une représentation des efforts déployés par le régime nord-coréen pour atteindre ses objectifs, et les observateurs s'attendent à des représailles de même nature de la part du gouvernement sud-coréen."
 
 nic.2.d:0 "Au Nicaragua, l'opposition démocratique a lancé une révolution contre le régime corrompu d'Anastasio Somoza García. Dans un discours radiophonique prononcé par le leader de la révolution, Emiliano Chamorro Benard, il a encouragé tout le monde à prendre les armes et à reconquérir le pays du dictateur corrompu et à revenir à la démocratie."
 
 BUL.100.d:0 "Nous venons de recevoir de tristes nouvelles de Moscou. Notre chef, Georgi Dimitrov, vient de décéder au sanatorium de Barvikha, près de Moscou. Selon Moscou, il s'était plaint de nausées quelques heures auparavant et s'était reposé. Lorsque les médecins sont allés le vérifier, ils ont découvert qu'il était décédé d'une crise cardiaque apparente il y a environ 30 minutes.\n\nCertains pensent cependant qu'il a en fait été empoisonné sur ordre de Staline en raison de sa proximité avec Tito et de son idée de « Fédération balkanique ». Un État composé de la Yougoslavie et de la Bulgarie serait trop grand et trop indépendant pour être contrôlé par Moscou.\n\nBien entendu, ce ne sont que des rumeurs et nous ne pouvons rien prouver. Mais il nous faut maintenant désigner son successeur. Notre meilleur candidat est Valko Chervenkov, un fervent partisan de Staline et de sa politique."

 Thai_Focus_6_desc:0 "La 7e élection générale vient de se terminer. Il s'agissait d'une élection supplémentaire des membres de la Chambre des représentants basée sur le nombre de citoyens dans le cadre des dispositions transitoires du Royaume. Le nombre de représentants dans chaque province est calculé en tenant compte de 150 000 personnes pour 1 représentant, car cette élection concerne des membres supplémentaires à la Chambre des représentants. Par conséquent, des élections n'ont eu lieu que dans 19 provinces, ce qui a donné lieu à 21 membres supplémentaires à la Chambre des représentants sur les 99 personnes existantes. Sur un total de 3 518 276 électeurs éligibles, il y avait 870 208 électeurs, soit 24,27 %. La province avec la plus grande activité électorale était Sakon Nakonn, avec 45,12 %, Udon Thani ayant le moins de votants, 12,02 %. Cette élection est aussi quelque peu historique pour nous, puisque pour la première fois une femme, Orapin Chaiyakan, a été élue à la Chambre des représentants de Thaïlande."

 KPA_Coup.1.d:0 "Nous avons reçu des nouvelles urgentes. Des personnalités nord-coréennes de premier plan de la faction soviéto-coréenne et de la faction Yan'an, avec le soutien de l'Union soviétique et de la Chine, tentent de renverser Kim-Il Sung. Kim Il-sung a pris connaissance du plan à son retour de Moscou et a réagi en retardant le plénum de près d'un mois et en utilisant le temps supplémentaire pour se préparer en soudoyant et en coercint les membres du Comité central et en planifiant une réponse échelonnée. Lorsque le plénum s'est finalement ouvert, Choe Chang-ik a prononcé un discours attaquant Kim Il-sung pour avoir concentré le pouvoir du parti et de l'État entre ses propres mains et critiquant la ligne du parti sur l'industrialisation qui ignorait la famine généralisée parmi le peuple nord-coréen. Yun Kong-hum a attaqué Kim Il-sung pour avoir créé un « régime policier ». Les partisans de Kim Il-sung ont chahuté et réprimandé les orateurs, les rendant presque inaudibles et détruisant leur capacité à convaincre les membres. Les partisans de Kim Il-sung ont accusé l'opposition d'être « anti-Parti » et ont décidé d'expulser Yun du parti. Kim Il-sung, en réponse, a neutralisé l'attaque contre lui en promettant d'initier des changements et de modérer le régime. Mais est-ce suffisant pour la plupart ? Ou Kim-Il sera-t-il renversé de toute façon ?"
 
 #####ENG - GREAT BRITAIN#####
 ###1950s###
 ENG_event.1.t:0 "Reconstruction anglaise terminée !"
 ENG_event.1.d:0 "Après des années de labeur et de travail, nous avons terminé nos efforts de construction après la Seconde Guerre mondiale. Nos efforts ont porté leurs fruits et notre économie est désormais en train de connaître une nouvelle croissance après la guerre."
 ENG_event.1.a:0 "Merveilleuse nouvelle !"
 ENG_event.2.t:0 "Dissolution du programme d'arachide du Tanganyika"
 ENG_event.2.d:0 "Le programme Tanganyika sur l'arachide a été dissous après son échec. Le TGS a été fondé après la Seconde Guerre mondiale pour tenter de réduire les pénuries d'huile de cuisson en Grande-Bretagne et de créer des emplois en Afrique de l'Est en cultivant de vastes étendues de terre pour la culture de l'arachide. Après des coûts immenses et de nombreux échecs, le projet fut finalement abandonné. Une grande majorité des futurs travailleurs d'Afrique de l'Est ne pourront plus éviter de sombrer dans la pauvreté et s'installer dans les bidonvilles de Dar es Salaam."
 ENG_event.2.a:0 "Une perte horrible"
 ENG_event.3.t:0 "Guerre du Djebel Akhdar"
 ENG_event.3.d:0 "Notre nation a pris l'initiative de frapper l'imamat d'Oman. Nous luttons pour soutenir l'occupation du sultan Saïd ben Taimur et contrôler l'intérieur d'Oman."
 ENG_event.3.a:0 "À la guerre !"
 ENG_event.4.t:0 "Discours sur le vent du changement"
 ENG_event.4.d:0 "Le Premier ministre britannique [ROOT.GetLeader] s'est adressé au Parlement sud-africain avec un discours historique, signalant que la Grande-Bretagne n'a pas l'intention d'empêcher l'indépendance de ses colonies du sud. Le discours a été très bien accueilli par les dirigeants des colonies du Sud et par les partisans de la décolonisation du monde entier. \n\nDans son discours, [ROOT.GetLeader] a déclaré : « Le vent du changement souffle sur ce continent. Que cela nous plaise ou non, cette croissance de la conscience nationale est un fait politique. » De plus, [Root.GetLeader] a exprimé un grand désir d'aider et d'encourager l'indépendance de ces colonies et cherche à trouver un terrain d'entente. Mais en plus de cela, le [Root.GetLeader] a exprimé le désir de trouver un terrain d'entente et souhaite que les colonies protègent les « destinées politiques d'hommes libres auxquelles nous essayons de donner effet sur nos propres territoires » en référence aux ressortissants britanniques."
 ENG_event.4.a:0 "Inspirant"
 ENG_event.5.t:0 "Répression contre Aden"
 ENG_event.5.d:0 "Nous avons pris la décision de réprimer le soulèvement de Radfan et adopté une approche agressive pour résoudre l'urgence d'Aden. Il est conseillé de prendre des mesures pour réprimer le soulèvement dans le pays et constituer une force d'occupation."
 ENG_event.5.a:0 "Une mesure nécessaire"
 ENG_event.6.t:0 "Se retirer d'Aden"
 ENG_event.6.d:0 "Nous avons pris la décision de nous retirer complètement d'Aden et de capituler la région face au soulèvement de Radfan. Nous avons des affaires plus importantes à régler ailleurs."
 ENG_event.6.a:0 "Une mesure nécessaire"
 ENG_event.7.t:0 "Tenir dans le Golfe Persique"
 ENG_event.7.d:0 "Nous avons pris la décision de réprimer les soulèvements du Golfe Arabique et adopté une approche agressive pour résoudre l'urgence d'Aden. Il est conseillé de prendre des mesures pour réprimer le soulèvement dans le pays et constituer une force d'occupation."
 ENG_event.7.a:0 "Nous ne leur céderons pas un pouce !"
 ENG_event.8.t:0 "Retrait du golfe Persique"
 ENG_event.8.d:0 "Nous avons pris la décision de nous retirer complètement du golfe Persique et de capituler la région face aux puissances locales. Nous avons des affaires plus importantes à régler ailleurs."
 ENG_event.8.a:0 "Un combat inutile"
 ENG_event.9.t:0 "Crise de la balance des paiements"
 ENG_event.9.d:0 "La situation de notre balance des paiements s'est transformée en une véritable crise qui menace de miner la zone sterling. À mesure que la situation s'aggrave, nos réserves du Trésor seront épuisées, les taux d'intérêt empireront, notre monnaie faiblira et nous aurons du mal à nous permettre d'importer."
 ENG_event.9.a:0 "Une situation épouvantable"
 ENG_event.10.t:0 "Abolition de la peine de mort"
 ENG_event.10.d:0 "Dans une décision législative historique, le Parlement britannique a décidé d'adopter le Murder Act de [GetYear] pour interdire la peine de mort pour meurtre et la remplacer par une peine obligatoire à perpétuité. Avec effet immédiat, toutes les condamnations à mort ont été commuées en peines à perpétuité. Cependant, la haute trahison, la piraterie violente, les incendies criminels dans les chantiers navals royaux, les délits militaires et l'espionnage restent des délits capitaux et entraîneront l'exécution."
 ENG_event.10.a:0 "Progrès"
 ENG_event.11.t:0 "Enquête sur la réforme ferroviaire"
 ENG_event.11.d:0 "Afin de réduire les dépenses, nous menons un audit massif de la réforme ferroviaire afin d'identifier les dépenses inutiles ou les domaines potentiels de réduction, d'améliorer l'efficacité globale du projet d'expansion et d'éviter les dépassements de dépenses."
 ENG_event.11.a:0 "Intéressant"
 ENG_event.12.t:0 "La hache en hêtre"
 ENG_event.12.d:0 "Compte tenu des circonstances, il est clair que l'expansion du réseau routier et la restructuration des chemins de fer de notre pays sont trop importantes. Nous ne pouvons pas nous permettre de continuer sur cette voie et nous devrons réduire massivement nos dépenses. Déjà 55 % des gares et 30 % des kilomètres de parcours prévus seront coupés pour réduire la portée du projet."
 ENG_event.12.a:0 "Une réduction nécessaire"
 ENG_event.13.t:0 "Nuit des longs couteaux"
 ENG_event.13.d:0 "Le Premier ministre [Root.GetName] a procédé à un important remaniement ministériel en limogeant de nombreux membres de son cabinet. L'ampleur de ce remaniement est immense et aura de profonds impacts sur la politique britannique."
 ENG_event.13.a:0 "Au revoir"
 ENG_event.14.t:0 "Tribunal Vassall"
 ENG_event.14.d:0 "John Vassall s'est révélé être un espion soviétique alors qu'il travaillait à l'Amirauté. Des réformes massives en matière de sécurité et d'audit sont déjà entreprises dans les agences britanniques et John Vassall devrait être jugé pour espionnage, risquant potentiellement la mort."
 ENG_event.14.a:0 "Il y aura justice !"
 ENG_event.15.t:0 "Affaire Profumo"
 ENG_event.15.d:0 "Il a été découvert que John Profumo et le mannequin Christine Keeler entretenaient une liaison l'un avec l'autre. À la suite de cet incident, John Profumo a mis fin à sa carrière politique et sera remplacé. Il ne pourra probablement pas revenir en politique de sitôt en raison du scandale."
 ENG_event.15.a:0 "Scandaleux!"
 ENG_event.16.t:0 "Bannière d'opération"
 ENG_event.16.d:0 "Les conflits ethno-nationalistes ont éclaté en Irlande du Nord alors que les combats entre les forces armées britanniques, les républicains irlandais et les loyalistes d'Ulster sont devenus intenables. Nous devons prendre des mesures immédiates pour rétablir la conformité £compliance§Y§!!"
 ENG_event.16.a:0 "Une situation désastreuse"
 ENG_event.17.t:0 "Commencer les négociations avec la CEE"
 ENG_event.17.d:0 "Le gouvernement britannique a entamé des négociations avec la Communauté économique européenne pour oeuvrer à l'intégration économique régionale et à la coopération entre les nations européennes."
 ENG_event.17.a:0 "Un pas en avant pour l'Europe !"
 ENG_event.18.t:0 "Campagne contre l'euroscepticisme"
 ENG_event.18.d:0 "Malgré la volonté de l'État de coopérer avec la communauté européenne pour favoriser l'unité, de nombreuses personnes s'opposent à l'intégration économique européenne pour une multitude de raisons complexes. Notre gouvernement a pris des mesures pour défier les critiques et faire campagne contre l'euroscepticisme dans l'intérêt de la stabilité économique britannique et de la coopération européenne."
 ENG_event.18.a:0 "Le Royaume-Uni restera pour toujours avec l'Europe !"
 
 WhitehallFederation.1.t:0 "La Fédération d'Afrique de l'Est"
 WhitehallFederation.1.d:0 "De nombreux pays d'Afrique de l'Est ont commencé à obtenir leur indépendance du Royaume-Uni. Plusieurs chefs d'État de ces pays ont exprimé leur intérêt pour la formation d'une fédération unique et unitaire, le dirigeant du Tanganyika proposant même de retarder l'indépendance pour faciliter ce projet.\n\nLes membres proposés, le Kenya, le Tanganyika, l'Ouganda, Zanzibar, le Burundi, le Rwanda et le Soudan du Sud, évaluent actuellement leurs options et pourraient commencer à rédiger une constitution régionale et à lancer des mouvements de fédération."
 WhitehallFederation.1.a:0 "Un peuple, un destin"
 WhitehallFederation.2.t:0 "La Fédération Centrafricaine"
 WhitehallFederation.2.d:0 "Les dirigeants de la Rhodésie et du Nyassaland ont exprimé leur intérêt pour la formation d'une fédération autonome en Afrique du Sud. Les colonies ont demandé au Royaume-Uni d'envisager de soutenir la fédération des colonies et de rédiger une constitution pour protéger les droits des colons et des autochtones africains de la région."
 WhitehallFederation.2.a:0 "Atteignons la grandeur"
 
 
 ENG_nuclear.1.t:0 "Opération Ouragan"
 ENG_nuclear.1.d:0 "Notre premier essai nucléaire est un énorme succès !\nNotre première arme atomique a explosé avec succès dans les îles Monte Bello, près de l'Australie occidentale.\nNous sommes désormais la troisième puissance nucléaire du monde."
 ENG_nuclear.1.a:0 "Un grand succès !"
 ENG_nuclear.2.t:0 "Accord de défense mutuelle au Royaume-Uni"
 ENG_nuclear.2.d:0 "Aujourd'hui, le Royaume-Uni a signé avec nous un accord de défense mutuelle et a accepté une coopération en matière d'armes nucléaires. Dans le cadre de cet accord, nous échangerons des matières nucléaires, des technologies et des informations.\nAvec cet accord, nous aurons sûrement un avantage sur l'Union Soviétique !"
 ENG_nuclear.2.a:0 "Rien ne peut nous arrêter maintenant !"
 ENG_nuclear.3.t:0 "Programme nucléaire du Commonwealth"
 ENG_nuclear.3.d:0 "Dans le cadre d'un effort de grande envergure, un accord de coopération nucléaire du Commonwealth a été signé. Tous les pays du Commonwealth s'entraideront dans la recherche nucléaire et partageront la technologie et l'information pour mieux renforcer notre position dans le monde en tant que puissance nucléaire."
 ENG_nuclear.3.a:0 "Connaissance partagée Pouvoir partagé"
 ENG_nuclear.4.t:0 "Opération Grappin"
 ENG_nuclear.4.d:0 "L'Opération Grapple s'est avérée être un succès retentissant ! Grâce à la détermination, à l'innovation et à la persévérance, notre nation a désormais rejoint l'élite des puissances thermonucléaires. Nous avons développé et testé avec succès une bombe à hydrogène d'une puissance estimée à 3 mégatonnes de TNT, une réussite qui consolide fermement la position du Royaume-Uni en tant que grande puissance mondiale.\n\nMême si les premières étapes du programme ont été entachées de revers et d'incertitudes, nos scientifiques et ingénieurs ont refusé de se laisser décourager. Leurs efforts inlassables ont abouti à la création de l'une des armes les plus puissantes jamais créées, marquant un tournant à la fois dans notre stratégie de défense nationale et dans notre réputation internationale. La Grande-Bretagne se présente désormais comme une véritable force nucléaire, capable de projeter une immense puissance et d'influencer le cours des affaires mondiales."
 ENG_nuclear.4.a:0 "Nous sommes les puissants !"
 ENG_nuclear.5.t:0 "La Grande-Bretagne achève l'opération Graple"
 ENG_nuclear.5.d:0 "La Grande-Bretagne a mené avec succès un essai d'armes thermonucléaires, marquant officiellement son entrée dans le groupe exclusif des nations possédant des capacités nucléaires avancées. Cette étape représente une avancée significative dans la puissance militaire stratégique du pays, démontrant sa capacité à développer et à déployer des armes nucléaires à haut rendement basées sur la fusion.\n\nGrâce à ce test réussi, le Royaume-Uni s'est solidement établi sur la scène mondiale en tant que puissance nucléaire. Les experts prévoient que le pays accélérera le développement et le déploiement d'un arsenal complet d'armes nucléaires de haut niveau dans les mois à venir. Si les projections actuelles se confirment, la Grande-Bretagne devrait atteindre sa pleine capacité opérationnelle d'ici un an, renforçant ainsi son rôle dans la dynamique mondiale de dissuasion et de sécurité internationale."
 ENG_nuclear.5.a:0 "Historique."
 
 ENG_RHO.1.t:0 "Le Royaume-Uni condamne l'UDI rhodésienne"
 ENG_RHO.1.d:0 "Le Royaume-Uni a condamné l'UDI rhodésienne, la qualifiant de scandaleuse et née uniquement d'un conflit ethnique. La Déclaration unilatérale d'indépendance de la Rhodésie déclare que la Rhodésie est désormais un État souverain indépendant et s'oppose aux visions britanniques de son avenir."
 ENG_RHO.1.a:0 "Barbares"
 ENG_RHO.2.t:0 "Échec des négociations rhodésiennes"
 ENG_RHO.2.d:0 "Les négociations entre la Rhodésie et le Royaume-Uni ont complètement échoué. Le gouvernement britannique ne reconnaîtra ni ne soutiendra l'État rhodésien et l'État rhodésien n'acceptera pas les conditions de reconnaissance définies par le gouvernement britannique."
 ENG_RHO.2.a:0 "Un résultat prévisible"
 ENG_RHO.3.t:0 "Reconnaître la Rhodésie"
 ENG_RHO.3.d:0 "    Le gouvernement britannique a officiellement reconnu la Rhodésie comme État souverain. Après des mois de débats internes et de négociations avec le parlement rhodésien, le parlement britannique a officiellement pris la décision historique de reconnaître la Rhodésie comme État légitime.\n    Il y a déjà une large réaction internationale de la part des pays ayant des intérêts régionaux, de nombreux pays reconnaissant la Rhodésie ou le Zimbabwe comme un État légitime. Le gouvernement rhodésien et ses partisans ont félicité et remercié la Grande-Bretagne pour son soutien politique tandis que les opposants à l'État rhodésien ont condamné l'action en citant des griefs à l'égard des politiques et des actions du gouvernement rhodésien.\n    Quelle que soit la décision britannique, les conflits de leadership dans la région continueront et l'avenir de la Rhodésie dépend des habitants du centre-sud de l'Afrique."
 ENG_RHO.3.a:0 "Levez-vous, ô voix de la Rhodésie !"
 
 EFTA.1.t:0 "Invitation à l'AELE"
 EFTA.1.d:0 "Nous avons reçu une invitation à l'Association européenne de libre-échange, §Ysouhaitez-vous accepter ?§!\nL'AELE augmentera les ressources exportées de 5 %, augmentera les revenus commerciaux de 25 %, augmentera la vitesse de construction (en particulier pour les chantiers navals et les infrastructures d'État), réduira la vitesse globale de recherche de 3 % tout en l'augmentant de 15 % pour la logistique et les infrastructures, et accordera 20 % de renseignements civils et navals supplémentaires à toutes les nations étrangères."
 EFTA.1.a:0 "Non"
 EFTA.1.b:0 "Oui"
 EFTA.2.t:0 "Création de l'AELE"
 EFTA.2.d:0 "Nous avons créé l'Association européenne de libre-échange pour renforcer le commerce !"
 EFTA.2.a:0 "Un grand pas en avant"
 
 ##### FRA FRANCE #####
 #1970#
 FRA_event.1.t:0 "La fin des Trentes Glorieuses"
 FRA_event.1.d:0 "En 1944, Charles de Gaulle met en place une politique économique connue sous le nom de Dirigiste. Le Dirigiste était en fait la direction étatique d'une économie capitaliste et a abouti à une vaste période de croissance économique rapide et à la prospérité du pays. Après 30 ans, la période touche à sa fin et la croissance économique française s'est nominalisée."
 FRA_event.1.a:0 "Quels magnifiques 30 ans"
 FRA_event.2.t:0 "Des maoïstes français arrêtés"
 FRA_event.2.d:0 "Sous l'ordre du [ROOT.GetLeader], des dirigeants maoïstes ont été arrêtés et des groupes maoïstes en France sont démantelés. En ce moment, la police et l'armée françaises parcourent le pays pour traquer les maoïstes fugitifs et réprimer leurs organisations."
 FRA_event.2.a:0 "En prison !"
 FRA_event.3.t:0 "Camp du Larzac agrandi"
 FRA_event.3.d:0 "L'extension du camp militaire du Larzac est désormais en cours mais se heurte à une vive résistance locale. Les habitants sont farouchement opposés à l'extension du camp et ont commencé à occuper les terrains achetés par l'armée pour cette extension."
 FRA_event.3.a:0 "Ce comportement est inacceptable"
 FRA_event.4.t:0 "La France quitte l'OTAN !"
 FRA_event.4.d:0 "La France s'est officiellement retirée de l'OTAN. [ROOT.GetLeader] a officiellement annoncé aujourd'hui le retrait de la France de l'OTAN, citant de nombreux griefs contre l'organisation et ses pratiques. Le retrait est effectif immédiatement et la France a abrogé tous les traités liés à l'OTAN avec son pays.\nDe nombreux dirigeants du monde entier sont stupéfaits par cette évolution et cette action a déclenché des réactions mitigées dans différents pays. Malgré cela, de nombreux pays ont choisi de ne pas faire de déclarations officielles pour le moment.\nLa perte de la France en tant qu'allié de l'OTAN signifie que l'OTAN sera considérablement plus faible dans la région et dans le monde dans son ensemble, car la marine et la puissance nucléaire françaises constituaient un élément essentiel de la force stratégique de l'organisation."
 FRA_event.4.a:0 "Pas de commentaire"
 FRA_event.4.b:0 "Ils ont notre soutien"
 FRA_event.4.c:0 "Il s'agit d'une action condamnable"
 FRA_event.5.t:0 "La France se dénucléarise"
 FRA_event.5.d:0 "Notre nation est désormais en train de se dénucléariser. Nous fermons les centrales nucléaires et annulons tous les projets nucléaires non énergétiques et scientifiques dans le pays."
 FRA_event.5.a:0 "Enfin"
 FRA_event.6.t:0 "La fin des essais nucléaires atmosphériques"
 FRA_event.6.d:0 "Sous la direction du [ROOT.GetLeader], nous avons désormais arrêté tous les essais nucléaires atmosphériques dans le pays pour une multitude de raisons. Après plus d'une décennie de tests et de dégâts, il est enfin temps pour la France de prendre position et de s'arrêter."
 FRA_event.6.a:0 "Bon débarras!"
 FRA_event.7.t:0 "Soutenir l'OLP"
 FRA_event.7.d:0 "Nous avons commencé à soutenir l'Organisation de libération de la Palestine et ses luttes. Nous leur envoyons une aide monétaire et matérielle dans l'espoir de soutenir leur cause."
 FRA_event.7.a:0 "Faites-en bon usage"
 FRA_event.8.t:0 "Création de l'UDF"
 FRA_event.8.d:0 "Le Front démocratique uni a été fondé en France. Le groupe s'oppose à l'apartheid, au racisme institutionnel et systémique et soutient les réformes démocratiques en Afrique."
 FRA_event.8.a:0 "Un développement époustouflant"
 
 EEC.event.1.t:0 "Fondation de l'euro"
 EEC.event.1.d:0 "La Communauté économique européenne a jusqu'à présent constitué un marché commun extrêmement prospère en Europe et a favorisé des niveaux stupéfiants de croissance économique et d'unité internationale au sein de la communauté européenne. Le moment est venu de créer une monnaie commune à la CEE qui s'appellera désormais l'euro."
 EEC.event.1.a:0 "Une belle réussite"
 EEC.event.2.t:0 "Nous avons adopté l'euro"
 EEC.event.2.d:0 "Notre nation, faisant partie de la CEE, a choisi d'adopter l'euro."
 EEC.event.2.a:0 "Un merveilleux développement!"
 EEC.event.3.t:0 "Laissez Snake dans le tunnel"
 EEC.event.3.d:0 "Après d'interminables débats et des analyses approfondies, nous avons choisi de nous opposer à la création d'une monnaie européenne commune et nous nous retirerons de Snake in the Tunnel."
 EEC.event.3.a:0 "C'était une mauvaise idée, de toute façon"
 EEC.event.4.t:0 "Invitation à la CEE"
 EEC.event.4.d:0 "Notre nation a été invitée au marché commun de la Communauté économique européenne.\n§YSouhaitez-vous accepter ?§!"
 EEC.event.4.a:0 "Oui"
 EEC.event.4.b:0 "Non"
 
 EUROPE_space.1.t:0 "[GetNewspaperHeader]Création de l'Agence spatiale européenne"
 EUROPE_space.1.d:0 "L'Agence spatiale européenne a été officiellement créée dans le but d'unir de nombreuses nations européennes différentes pour créer une agence spatiale internationale et promouvoir l'innovation liée à l'espace. L'agence cherche également à promouvoir la coopération et le partage des connaissances scientifiques entre les membres de l'agence.\nSelon leurs propres termes, \"l'objectif de l'ESA est de prévoir et de promouvoir, à des fins exclusivement pacifiques, la coopération entre les États européens dans le domaine de la recherche et de la technologie spatiales et de leurs applications spatiales, en vue de leur utilisation à des fins scientifiques et pour des systèmes opérationnels d'applications spatiales\"."
 EUROPE_space.1.a:0 "Une nouvelle aube pour l'humanité !"
 EUROPE_space.1.b:0 "Une perte de temps !"
 EUROPE_space.1.c:0 "Ils bénéficieront de notre soutien direct !"
 
 #####CZECH EVENTS#####
 prague_spring.1.t:0 "Des écrivains disciplinés"
 prague_spring.1.d:0 "Au cours de l'été, l'Union des écrivains tchécoslovaques a commencé à publier des articles proposant des critiques mineures à l'égard du Parti et une lente réhabilitation des personnalités culturelles tchécoslovaques. Ces critiques ont atteint un point tel que le journal le plus pro-communiste, Literani Noviny, a commencé à préconiser que la littérature ne devrait plus avoir à confirmer la doctrine du parti. Cependant, cette période d'expression prudente en faveur de la réforme a été écourtée à la suite d'une récente réunion du Parti communiste de Tchécoslovaquie au cours de laquelle de hauts dirigeants ont décidé de sanctionner administrativement certains écrivains prônant la réforme. Le Parti a également placé plusieurs revues sous la supervision du ministère de la Culture. Bien que le Parti ait agi, de nombreuses personnes dans le pays, notamment parmi la classe intellectuelle, seraient de plus en plus mécontentes du Parti et de son approche de la société."
 
 prague_spring.2.t:0 "Brejnev participe à la réunion de Prague"
 prague_spring.2.d:0 "Le président Antonin Novotny dirige la Tchécoslovaquie avec une tendance autoritaire depuis qu'il est devenu premier secrétaire du Parti communiste tchécoslovaque (KSC). Cependant, ces dernières années, le président Novotny a fait face à des critiques croissantes au sein du parti et parmi la population pour ses pratiques. Pour consolider son soutien, le président Novotny a demandé à Leonid Brejnev d'assister à la dernière réunion du Comité central à Prague. Cependant, lors de cette réunion, Alexander Dubcek, premier secrétaire du Parti communiste slovaque, a pris la tête des efforts visant à assumer le poste de premier secrétaire du KSC. Brejnev a été surpris du nombre de membres du KSC qui se sont retournés contre le président Novotny et maintenant, le président en difficulté a demandé son avis sur la question. Le camarade Brejnev doit décider soit de soutenir le président Novotny, impopulaire et faible, soit d'approuver la nomination de Dubcek au poste de premier secrétaire, ce qui pourrait réunifier le KSC et réduire les troubles publics."
 
 prague_spring.3.t:0 "[GetNewspaperHeader]Brejnev soutient Novotny"
 prague_spring.3.d:0 "Lors de la récente réunion du Comité central, le président Antonin Novotny a été confronté à de vives critiques et à une perte de soutien de la part de nombreux hauts dirigeants du Parti. Ces critiques ont ensuite tenté de le destituer de son poste de premier secrétaire du Parti communiste de Tchécoslovaquie (KSC). Cependant, pour contrer un tel scénario, le président Novotny avait auparavant invité le secrétaire général soviétique, Léonid Brejnev, à assister à la réunion pour se protéger d'un tel effort, et cette tactique s'est avérée efficace. Malgré les efforts considérables déployés pour le destituer, Brejnev a décidé de soutenir le président Novotny et a mis fin à cette tentative. Le président Novotny reste premier secrétaire du KSC et la Tchécoslovaquie reste sous son contrôle. Cependant, de nombreux membres du KSC et de tout le pays seraient mécontents de cette ingérence de Moscou et, même si Novotny a survécu au défi, il devra faire face au mécontentement de la population et de son parti."
 
 prague_spring.4.t:0 "[GetNewspaperHeader]Brejnev soutient Dubcek"
 prague_spring.4.d:0 "Lors de la récente réunion du Comité central, le président Antonin Novotny a été confronté à de vives critiques et à une perte de soutien de la part de nombreux hauts dirigeants du Parti. Ces critiques ont ensuite tenté de le destituer de son poste de premier secrétaire du Parti communiste de Tchécoslovaquie (KSC). Cependant, pour contrer un tel scénario, le président Novotny avait auparavant invité le secrétaire général soviétique, Leonid Brejnev, à assister à la réunion pour se protéger d'un tel effort, mais cette tactique s'est avérée être une erreur. Le camarade Brejnev a été stupéfait par le niveau de mécontentement et a décidé d'approuver la nomination d'Alexandre Dubcek comme nouveau premier secrétaire. Même si Dubcek contrôle désormais le KSC, Novotny restera président. Dubcek devrait lentement prendre le contrôle de l'appareil du parti et amener ses partisans à des postes clés."
 
 prague_spring.5.t:0 "Réponse aux critiques des médias à l'égard du président Novotny"
 prague_spring.5.d:0 "La nomination d'Alexandre Dubcek au poste de premier secrétaire du Parti communiste de Tchécoslovaquie (KSC) a fait perdre une grande partie de son pouvoir politique au président Antonin Novotny dans le pays. Peu de temps après la nomination de Dubcek, Eduard Goldstucker est devenu président de l'Union des écrivains tchécoslovaques et rédacteur en chef de la principale revue Literani Noviny. Goldstucker a récemment contesté la politique de censure de l'État en critiquant ouvertement la politique du président Novotny dans une interview télévisée à l'échelle nationale. Le président Novotny et ses partisans ont appelé Dubcek à appliquer les lois sur la censure et à punir Goldstucker. Cependant, d'autres membres du parti ont exhorté Dubcek à autoriser ces critiques et à soutenir une atmosphère d'ouverture envers le peuple. Ils croient qu'appliquer durement les lois de censure ne fera qu'aliéner la population."
 
 prague_spring.6.t:0 "Mettre fin aux lois sur la censure"
 prague_spring.6.d:0 "La réponse à la décision de ne pas réprimer les critiques publiques à l'égard du président Antonin Novotny a conduit à des discussions plus larges sur la réforme politique et l'ouverture. En effet, le soutien à la réforme et à l'ouverture a donné lieu à des rassemblements publics dans tout le pays en faveur du Premier secrétaire Alexander Dubcek. Dubcek doit maintenant décider s'il va entamer le processus visant à abolir les lois strictes de censure ou à faire reculer l'humeur du public en réprimant ces rassemblements et publications publics. L'annonce de son intention de mettre fin aux lois sur la censure permettra à Dubcek d'obtenir un plus grand soutien du public, lui permettra de proposer davantage de politiques de réforme au peuple et de renforcer ses partisans au sein du parti. Cependant, réprimer cette nouvelle ouverture éloignerait la population et les partisans de son propre parti, mais cela apaiserait probablement les inquiétudes de Moscou et des partisans de la ligne dure."
 
 prague_spring.7.t:0 "Le président Novotny démissionne"
 prague_spring.7.d:0 "La décision récente d'Alexandre Dubcek, premier secrétaire du Parti communiste de Tchécoslovaquie (KSC), de commencer à mettre fin aux lois sur la censure, a grandement suscité la colère des membres les plus radicaux du parti, notamment du président Antonin Novotny, qui a annoncé sa démission. Pour Novotny et d'autres partisans de la ligne dure au sein du KSC, l'ouverture de l'espace politique et des médias ainsi que d'autres réformes menacent de détruire l'unité du Parti et l'ordre communiste en Tchécoslovaquie. Dubcek a ensuite proposé la présidence au général Ludvik Svoboda et il a accepté. Le président Svoboda a annoncé qu'il soutiendrait les efforts de réforme et sa nomination est saluée dans tout le pays en raison de sa carrière militaire hautement décorée. Politiquement, le président Svoboda a survécu aux purges d'après-guerre et est considéré comme un héros national par les Tchèques et les Slovaques."
 
 prague_spring.8.t:0 "[GetNewspaperHeader]Dubcek dévoile son programme d'action"
 prague_spring.8.d:0 "Dans une avancée historique en matière de politiques de réforme, le premier secrétaire Alexander Dubcek a annoncé le début de ce qu'il appelle le programme d'action. Le programme envisage une libéralisation progressive de la Tchécoslovaquie en augmentant la liberté de presse, d'expression et de mouvement. La réforme économique est également discutée, tout comme l'acceptation du fait que le multipartisme pourrait éventuellement revenir dans le pays. Dubcek a noté que les politiques communistes précédentes n'étaient pas erronées car elles étaient nécessaires pour mettre fin à l'influence bourgeoise et à l'instabilité d'après-guerre. Aujourd'hui, Dubcek et les réformateurs croient qu'une société socialiste ayant une relation positive avec l'État est l'objectif principal du programme d'action. Bien que Dubcek n'ait pas critiqué le communisme et ait déclaré qu'il travaillerait avec ses camarades partis communistes, Moscou considérerait ces développements avec beaucoup de méfiance. Ils sont particulièrement préoccupés par le fait que Dubcek affirme que le programme d'action permettra de mieux adapter le communisme à la société tchécoslovaque et d'offrir un socialisme à visage humain."
 
 prague_spring.9.t:0 "[GetNewspaperHeader]Célébration enthousiaste du 1er mai"
 prague_spring.9.d:0 "L'enthousiasme du public et le soutien au gouvernement réformateur en Tchécoslovaquie ont vu des foules record se rassembler dans tout le pays pour la célébration annuelle du 1er mai. Le Parti communiste de Tchécoslovaquie (KSC), dirigé par le premier secrétaire Alexander Dubcek, bénéficie actuellement d'un soutien public massif suite au lancement de son programme d'action. Beaucoup en Tchécoslovaquie soutiennent la nouvelle ouverture du discours public et la poursuite des réformes politiques. La réduction des lois sur la censure et l'ouverture de l'espace politique ont donné lieu à une participation politique sans précédent. Bien que le parti reste au pouvoir et incroyablement populaire, les opposants à la réforme et à d'autres États communistes craignent qu'à terme, ces réformes conduisent à la réémergence de partis non communistes en Tchécoslovaquie. Quoi qu'il en soit, le Printemps de Prague bat son plein et les gens en profitent."
 
 prague_spring.10.t:0 "[GetNewspaperHeader]Dubcek en visite à Moscou"
 prague_spring.10.d:0 "Le premier secrétaire d'État Alexander Dubcek a récemment terminé sa visite officielle à Moscou. Dubcek a pris le contrôle effectif de la Tchécoslovaquie et du Parti communiste tchécoslovaque (KSC). Sous sa direction, il a supervisé la libéralisation de la société tchécoslovaque à travers son programme d'action réformiste. Même s'il s'est efforcé de présenter cette politique comme une continuation naturelle de l'idéologie communiste, beaucoup à Moscou et dans le monde communiste considèrent l'ouverture de la société comme une menace majeure. Ils sont particulièrement préoccupés par le fait que Dubcek tolère les débats sur le rétablissement des partis non communistes dans le pays. Les dirigeants soviétiques ont fait part de ces préoccupations à Dubcek et après une série de réunions tendues, Dubcek est retourné à Prague. Bien que Dubcek ait qualifié cette visite d'échange d'idées, il est clair que les liens entre la Tchécoslovaquie et l'Union soviétique sont tendus et que les Soviétiques suivront les événements de près."
 
 prague_spring.11.t:0 "[GetNewspaperHeader]La censure officiellement abolie"
 prague_spring.11.d:0 "Le premier secrétaire Alexander Dubcek, dès son entrée en fonction, a entamé le processus d'assouplissement des lois sur la censure. Ces efforts ont été salués dans toute la Tchécoslovaquie et ses cercles intellectuels traditionnellement dynamiques ont été rajeunis par la récente ouverture de l'espace politique. Aujourd'hui, le processus d'abolition des lois sur la censure est officiellement achevé et le gouvernement a annoncé la fin de la censure en Tchécoslovaquie. Le gouvernement n'a pas tardé à constater que l'abolition de la censure ne signifiait pas l'anarchie, mais une confirmation du développement communiste de la société. Le gouvernement ne s'attend pas à ce que les gens discutent d'idées perturbatrices ou remettent en question le développement continu de l'État par le parti. Des ambassadeurs d'autres Etats communistes auraient exprimé leurs réserves face à ce dernier développement auprès du président tchécoslovaque."
 
 prague_spring.12.t:0 "[GetNewspaperHeader]Publication du Manifeste Vaculik"
 prague_spring.12.d:0 "Le célèbre journaliste Ludvik Vaculik a récemment publié un manifeste intitulé Les Deux Mille Mots, signé par d'éminents artistes et intellectuels. Le manifeste affirmait que le Parti communiste de Tchécoslovaquie (KSC) avait conduit au déclin du pays et que la politique d'ouverture devait se poursuivre. Il n'appelait pas à une révolution mais à davantage de démocratisation de la société sous le KSC. De manière controversée, il préconisait également une accélération de la libéralisation et le rétablissement des partis socialistes d'avant la révolution. Le manifeste a suscité la colère de la base conservatrice du KSC, qui prétend que le document est une conséquence du programme d'action du premier secrétaire Alexander Dubcek. Sous l'immense pression des conservateurs, Dubcek et les principaux membres du KSC ont rapidement dénoncé le document, mais son impact aurait suscité l'inquiétude dans le monde communiste européen."
 
 prague_spring.13.t:0 "Exercices militaires soviétiques près de la frontière"
 prague_spring.13.d:0 "Dans le sud de l'Allemagne, près de la frontière tchécoslovaque, les forces du Pacte de Varsovie dirigées par les Soviétiques mènent de vastes exercices militaires. Les journaux de Prague ont noté que le déploiement militaire ne comportait aucune participation des forces tchécoslovaques et avait lieu avant les négociations prévues entre les gouvernements tchécoslovaque et soviétique sur les récentes réformes libérales. De nombreux citoyens craignent que ces exercices ne soient une répétition générale d'une intervention soviétique et affirment que le gouvernement devrait se préparer à résister. Cependant, le gouvernement tchécoslovaque n'a donné aucune indication quant à son intention de lancer une réponse militaire et, dans un communiqué, a réitéré ses liens avec l'Union soviétique et ses alliés. En outre, des officiers militaires soviétiques sont également venus en plus grand nombre. Les visites militaires soviétiques sont également considérées comme un effort de la part des Soviétiques pour se préparer et repérer en cas d'intervention."
 
 prague_spring.14.t:0 "Rencontre avec les dirigeants tchécoslovaques"
 prague_spring.14.d:0 "De hauts dirigeants soviétiques, dont le secrétaire général soviétique, ont rencontré le premier secrétaire Dubcek et le président Svoboda de Tchécoslovaquie. Les dirigeants soviétiques ont exhorté la Tchécoslovaquie à mettre fin à son programme de libéralisation et à confirmer la ligne communiste de Moscou. Ils ont noté que la libéralisation a conduit à un mouvement croissant exigeant des élections multipartites et l'anarchie. Ils suggèrent que si l'ordre n'est pas rétabli, le communisme lui-même pourrait s'effondrer dans les rues de Prague. Cependant, les dirigeants tchécoslovaques ont noté la popularité de leurs programmes et le renforcement de la popularité de leur parti parmi la population. Au lieu de capituler devant les exigences soviétiques, ils ont plutôt suggéré que les Soviétiques les traitent comme un modèle pour réformer le parti et rajeunir le soutien au communisme. Le secrétaire général soviétique doit décider de réagir soit en condamnant le modèle tchécoslovaque, soit en le présentant à Moscou et en lançant un petit programme de réformes libérales pour tester sa validité."
 
 prague_spring.15.t:0 "Résultats de la réunion soviétique"
 prague_spring.15.d:0 "De hauts dirigeants soviétiques ont rencontré des hauts responsables de notre gouvernement en Slovaquie pendant deux jours. Les dirigeants soviétiques ont été très catégoriques dans leurs critiques à l'égard de notre programme d'action et ont exigé que nous renoncions à la libéralisation. Ils ont affirmé que le pays était en proie à l'anarchie et que notre parti ne pouvait pas contrôler la propagation d'idées dangereuses. Nos dirigeants ont défendu sa politique et ont insisté sur le fait que notre libéralisation était la meilleure approche pour la Tchécoslovaquie. En fin de compte, aucun résultat n'a pu être obtenu, mais il est clair que les Soviétiques exigeaient que nous mettions fin à nos réformes. Le premier secrétaire Alexander Dubcek doit maintenant décider de mettre fin au programme d'action et de démissionner ou de poursuivre le processus et de refuser les demandes soviétiques. L'ambassadeur soviétique attend notre réponse définitive aux demandes soviétiques."
 
 prague_spring.16.t:0 "Doctrine Brejnev et approbation de l'invasion"
 prague_spring.16.d:0 "Le secrétaire général Léonid Brejnev a dévoilé sa nouvelle doctrine aux dirigeants soviétiques. Les détails devraient être publiés le mois prochain dans la Pravda. L'Union Soviétique a décidé que toute menace contre le régime socialiste dans n'importe quel État communiste dans son orbite en Europe serait une menace contre tout le monde qui devait être résolue par tous les moyens nécessaires. Les réformes dangereuses en Tchécoslovaquie atteignent des niveaux anarchiques et le parti communiste y est sur le point de perdre le contrôle. Brejnev a reçu une lettre de communistes conservateurs de Tchécoslovaquie implorant l'aide soviétique. Après avoir consulté les dirigeants bulgares, polonais et hongrois, Brejnev a approuvé l'invasion militaire de la Tchécoslovaquie pour rétablir l'ordre. L'invasion sera la première mise en oeuvre de la doctrine Brejnev."
 
 prague_spring.17.t:0 "[GetNewspaperHeader]Invasion de la Tchécoslovaquie"
 prague_spring.17.d:0 "Pendant la nuit, des forces militaires écrasantes de quatre pays du Pacte de Varsovie, de l'Union soviétique, de la Bulgarie, de la Pologne et de la Hongrie, ont traversé la frontière avec la Tchécoslovaquie. Le gouvernement tchécoslovaque a ordonné aux militaires et à la population de ne pas résister et les forces militaires sont restées dans leurs casernes. Le gouvernement soviétique a annoncé qu'il était contraint d'agir après avoir reçu des demandes de communistes tchécoslovaques qui craignaient que le gouvernement ne conduise le pays au désastre. Les citoyens de Prague sont sortis pour protester contre les envahisseurs, mais en un jour, le pays était sécurisé par le Pacte de Varsovie. Cependant, la population s'est engagée dans des manifestations non violentes à grande échelle contre les troupes d'occupation. On s'attend à ce que les réformes initiées par le gouvernement soient annulées et que les communistes conservateurs soient rétablis aux postes de pouvoir. Au niveau international, l'invasion soviétique a suscité de nombreuses réactions négatives, même parmi certains États communistes qui considèrent cet acte comme une violation de leur souveraineté"
 
 prague_spring.18.t:0 "Invasion de la Tchécoslovaquie "
 prague_spring.18.d:0 "Pendant la nuit, des forces militaires écrasantes de quatre pays du Pacte de Varsovie, de l'Union soviétique, de la Bulgarie, de la Pologne et de la Hongrie, ont traversé la frontière avec la Tchécoslovaquie. Le gouvernement tchécoslovaque a ordonné aux militaires et à la population de ne pas résister et les forces militaires sont restées dans leurs casernes. Le gouvernement soviétique a annoncé qu'il était contraint d'agir après avoir reçu des demandes de communistes tchécoslovaques qui craignaient que le gouvernement ne conduise le pays au désastre. Les citoyens de Prague sont sortis pour protester contre les envahisseurs, mais en un jour, le pays était sécurisé par le Pacte de Varsovie. On s'attend à ce que les réformes initiées par le gouvernement soient annulées et que les communistes conservateurs soient rétablis aux postes de pouvoir. Cependant, la population s'est engagée dans des manifestations non violentes à grande échelle contre les troupes d'occupation. Les réformateurs dirigés par le premier secrétaire d'État Alexander Dubcek seraient en pourparlers avec les forces soviétiques et coopéreraient. Il semble que l'expérience libérale tchécoslovaque ait pris fin."
 
 prague_spring.19.t:0 "La censure réintroduite"
 prague_spring.19.d:0 "Au lendemain de l'invasion, le premier secrétaire Alexander Dubcek, qui avait supervisé la libéralisation du régime communiste, est resté au pouvoir car les Soviétiques ne souhaitaient pas transformer les manifestations non violentes en insurrection ouverte. En effet, les Soviétiques ont accepté un ensemble modéré de réformes limitées appelées Protocoles de Moscou. Cependant, Dubcek a été contraint de réintroduire la censure en Tchécoslovaquie. Cette décision met désormais fin à la libéralisation des médias et des réunions publiques qui avait galvanisé les habitants de Prague au cours des derniers mois. Les principaux journalistes, écrivains et intellectuels doivent désormais revenir à la ligne gouvernementale sous peine d'être réduits au silence, licenciés ou arrêtés par le gouvernement. Les communistes conservateurs sont désormais fermement au pouvoir. La loi confirme le Protocole de Moscou selon lequel le socialisme doit être restauré dans sa forme originale dans le pays."
 
 prague_spring.20.t:0 "La Tchécoslovaquie devient République fédérale"
 prague_spring.20.d:0 "Bien que le Printemps de Prague ait pris fin brutalement après l'invasion soviétique, l'un des objectifs des réformateurs a été aujourd'hui atteint. La Tchécoslovaquie est officiellement devenue une République fédérale, rétablissant ce que beaucoup en Tchécoslovaquie considèrent comme son héritage démocratique. La censure demeure, tout comme le recul de nombreux aspects les plus libéraux du Printemps de Prague, mais l'Union soviétique l'a concédé aux réformateurs. L'Union soviétique a été largement surprise par la résistance non-violente à laquelle elle a été confrontée après l'invasion et, bien que la restauration du socialisme soit un objectif principal, elle a accepté d'accorder cette concession limitée au peuple tchécoslovaque."
 
 prague_spring.21.t:0 "Dubcek remplacé au poste de premier secrétaire"
 prague_spring.21.d:0 "Le premier secrétaire d'État Alexander Dubcek, l'architecte du libéralisme et du Printemps de Prague, a été démis de ses fonctions aujourd'hui. Bien que les Soviétiques aient cherché à mettre fin à son règne après l'invasion, le nombre de protestations non violentes et le véritable soutien à ses réformes les ont poussés à maintenir Dubcek au pouvoir, bien que sous étroite surveillance. Il a supervisé le rétablissement des lois sur la censure et l'annulation de son programme d'action, mais les Soviétiques sont désormais convaincus qu'ils peuvent le destituer du pouvoir. Il sera remplacé par le communiste pur et dur Gustav Husak, qui bénéficie de la bénédiction de Moscou. Husak devrait inaugurer une ligne plus autocratique et garantir que les forces d'ouverture et de libéralisation libérées par les réformes de Dubcek ne constituent pas une menace supplémentaire pour le régime communiste dans le pays. De nombreuses personnes en Tchécoslovaquie seraient attristées par la destitution de Dubcek."
 
 ### SAF ###
 
 SAF_event.1.t:0 "Accord de Simonstown"
 SAF_event.1.d:0 "La colonie sud-africaine a officiellement signé un accord de coopération navale avec la Grande-Bretagne, connu sous le nom d'Accord de Simonstown. La Royal Navy a cédé son port naval de Simon's Town à la marine sud-africaine à condition qu'il continue à desservir les flottes de la Royal Navy. En outre, l'accord a également accordé à l'Afrique du Sud 6 frégates anti-sous-marines, 10 dragueurs de mines côtiers et 4 bateaux de défense côtière.\nL'accord de Simonstown a été fondé sur le principe de la protection des routes maritimes entre le Royaume-Uni et le Moyen-Orient et de l'amélioration de la capacité navale autonome de l'Afrique du Sud."
 
 SAF_event.2.t:0 "La République d'Afrique du Sud"
 SAF_event.2.d:0 "Notre pays est désormais en route vers une république. Nos efforts incessants pour nous établir comme une république pleinement fonctionnelle pour représenter la volonté du peuple sont en cours !"
 
 Namibia.1.t:0 "La question namibienne"
 Namibia.1.d:0 "Pendant la Première Guerre mondiale, les troupes sud-africaines ont déposé l'administration coloniale allemande de la Namibie. Après la fin de la guerre, un mandat fut établi. Récemment, la pression en faveur d'une décolonisation mondiale et de l'autodétermination nationale nous a obligés à répondre à la question namibienne. Nos décisions vont maintenant influencer considérablement la vie de tous les Namibiens."
 
 Namibia.2.t:0 "Annexion de la Namibie"
 Namibia.2.d:0 "L'Afrique du Sud a décidé d'annexer totalement la Namibie. Pressé de prendre une décision sur la question namibienne, le gouvernement sud-africain a décidé de prolonger son mandat indéfiniment et de faire pression en faveur d'une intégration complète de la Namibie. Si cette action est considérée comme injuste par certains, d'autres estiment qu'il s'agit là du résultat naturel du mandat. Quoi qu'il en soit, l'opposition à cette action ne restera probablement pas silencieuse longtemps."
 
 Namibia.10.t:0 "Le problème namibien porté devant l'ONU"
 Namibia.10.d:0 "Nous avons porté la question namibienne devant l'ONU pour l'aider à prendre une décision. L'ONU nous a conseillé d'accorder l'indépendance à la Namibie, affirmant qu'elle a droit à l'autonomie gouvernementale."
 
 Namibia.11.t:0 "L'Afrique du Sud établit une tutelle de 10 ans"
 Namibia.11.d:0 "Après un débat avec l'ONU, le gouvernement sud-africain et les Nations Unies ont convenu que la Namibie devrait être libre et indépendante après 10 ans de tutelle. Durant ces 10 années, l'Afrique du Sud conservera son mandat sur la Namibie avant que la décolonisation n'ait lieu.\nL'Afrique du Sud a fait valoir que la Namibie devrait prendre le temps de préparer son nouveau gouvernement, notamment en établissant son propre système parlementaire et en rédigeant la constitution, plutôt que de devenir indépendante trop rapidement avant d'être prête. Les représentants des Nations Unies ont convenu que c'était la meilleure option et la tutelle a été établie.\n§YDe nombreux Namibiens pensent que le gouvernement sud-africain devrait aider au développement du pays avec l'argent de ses impôts et de ses contributions, bien que cela ne soit pas obligatoire selon l'accord de l'ONU.§!"
 
 Namibia.12.t:0 "Namibie indépendante"
 Namibia.12.d:0 "Après un débat avec l'ONU, le gouvernement sud-africain et les Nations Unies ont convenu que la Namibie devrait devenir indépendante immédiatement. Avec effet immédiat, tous les actifs administratifs sont transférés de la Namibie vers l'Afrique du Sud et l'ONU aide la Namibie à établir un gouvernement de transition jusqu'à ce qu'elle puisse établir un parlement, établir des circonscriptions électorales et rédiger une constitution."
 
 Namibia.13.t:0 "La Namibie est libre"
 Namibia.13.d:0 "La tutelle de 10 ans a pris fin et la Namibie est officiellement un État libre, indépendant et autonome."
 
#  swe.5.d:0 "Folkhemmet is a political concept that describes the Swedish welfare state, usually viewed as midway between capitalism and socialism. The Social Democratic leaders Ernst Wigforss, Gustav Möller and Per Albin Hansson are considered the main architects of folkhemmet, with inspiration from the conservative Kjellén and the Danish Social Democrats C.V. Bramsnæs and Karl Kristian Steincke.\nPer Albin Hansson introduced the concept in 1928 saying that Sweden should become more like a \"good home\", this being marked by equality and mutual understanding. Hansson advocated that the traditional class society should then be replaced by folkhemmet. This concept came to include free and high quality education at all levels, free universal healthcare and many other social benefits."

#Burkina Faso/Upper Volta
brk.1.d:0 "Jean-Baptiste Ouédraogo dirige la Haute-Volta depuis 1982, date à laquelle il a accédé à la présidence après le coup d'État de 1982. Plus modéré idéologiquement que la plupart de ses camarades, Ouédraogo ne bénéficiait pas d'un grand soutien populaire et gouvernait le pays dans un climat politique instable. Après une dispute prolongée avec le Premier ministre Thomas Sankara qui a abouti à l'épuration de plusieurs radicaux, Ouédraogo a été destitué lors d'un coup d'État dirigé par le capitaine Blaise Compaoré, qui a fait de son ami proche Sankara président. Sankara a promis d'entamer une période de transformation sociétale de l'État."
brk.2.d:0 "Un capitaine parachutiste pro-libyen qui a été démis de ses fonctions de Premier ministre de Haute-Volta en mai a pris aujourd'hui le pouvoir dans ce pays d'Afrique de l'Ouest lors d'un coup d'État qui aurait fait 13 morts et 15 blessés. Des diplomates en Haute-Volta ont indiqué que 6 des blessés étaient des ressortissants français.\nLe capitaine, Thomas Sankara, 35 ans, s'est rendu à la radio nationale pour annoncer le renversement du gouvernement du président Jean-Baptiste Ouedraogo. Il s'agissait du troisième coup d'État en Haute-Volta en trois ans et il a eu lieu un an avant le retour promis à un régime civil.\nLe capitaine Sankara a été décrit comme « un marxiste-léniniste engagé » et serait particulièrement populaire parmi les jeunes Haut-Voltanais. Il est devenu un héros national en 1974 en menant un raid au Mali lors d'une brève guerre frontalière cette année-là."
brk.3.d:0 "Après avoir renversé Lamizana en 1980, le colonel Saye Zerbo a rétabli le régime militaire total mis fin par Lamizana avec les élections présidentielles et parlementaires de 1978. D'abord favorisé par les syndicats et une grande partie de l'opposition politique, il en fait bientôt ses ennemis. Créant une junte composée de nombreux membres radicaux, le leadership de Zerbo devint de plus en plus dictatorial. Il a de nouveau interdit tous les partis politiques et a une fois de plus rendu les grèves illégales.\nLes manifestations anti-Zerbo sont devenues de plus en plus fréquentes, avec des grèves antigouvernementales en avril, des syndicats exigeant le retour à un gouvernement constitutionnel en mai et l'arrestation de plusieurs dirigeants syndicaux et de l'opposition de premier plan en septembre.\nAujourd'hui, les factions progressistes et radicales du régime militaire en ont assez de Zerbo. Dans la capitale, le chef d'état-major de l'armée, le colonel Gabriel Yoryan Somé, et d'autres officiers se faisant appeler Conseil de salut populaire ont décidé de déposer et d'arrêter Zerbo. Zerbo a été déclaré démagogue menteur qui avait trahi la confiance de son peuple.\nDeux jours après le coup d'État, le médecin militaire peu connu, le major Jean-Baptiste Ouédraogo, a été nommé chef de l'État par la nouvelle junte."
brk.4.d:0 "Sangoulé Lamizana dirige la Haute-Volta depuis son coup d'État contre Maurice Yaméogo en 1966. Lamizana dirigera le pays en dictateur militaire jusqu'à l'élection présidentielle de Haute-Voltan en 1978, lorsqu'il est élu chef d'un régime civil. Au cours des années 1970, le gouvernement Lamizana a été confronté à de nombreux problèmes, parmi lesquels l'opposition persistante des syndicats, la montée de nouveaux groupes d'opposition politique, une grave sécheresse au Sahel, une désertification croissante, etc. Les besoins en aide étrangère ont atteint des niveaux records, représentant en 1979 70 % du budget gouvernemental.\nEn février 1979, les principaux syndicats lancèrent une nouvelle campagne anti-Lamizana. En mai, deux dirigeants syndicaux de premier plan ont été arrêtés pour incitation à la révolte. Deux mois plus tard, Lamizana dénonce les revendications unionistes, appelant à l'unité nationale. En décembre, le président reconnaît enfin la dépendance du pays à l'égard de l'aide occidentale pour sa survie.\nPeu de temps après, le colonel Saye Zerbo a mené un coup d'État militaire, renversant le président Lamizana. Le coup d'État s'est avéré à la fois sans effusion de sang et réussi. La police anti-émeute, déployée contre les grévistes, a tenté un contre-coup d'État en soutien à Lamizana, mais n'a pas réussi à le réintégrer. Zerbo - un vétéran militaire, ancien ministre des Affaires étrangères de 1974 à 1976, commandant du régiment de l'armée dans la capitale Ouagadougou et chef des renseignements militaires - a suspendu la constitution et créé le Comité militaire de redressement pour le progrès national, une junte de 31 membres. Plusieurs membres de la junte étaient jeunes et radicaux, parmi lesquels les futurs présidents Thomas Sankara et Blaise Compaoré. Parmi les couches de la société qui ont soutenu le coup d'État figuraient le peuple Mossi et les catholiques de Haute-Voltane, deux groupes marginalisés par Lamizana, bien que Zerbo, comme son prédécesseur, était un musulman Bissa."
brk.5.d:0 "Nous avons obtenu notre indépendance en 1960. Maurice Yaméogo a créé une dictature à parti unique, faisant de son Union Démocratique Voltaïque le seul parti politique légal du pays. Les partis d'opposition, comme le Parti du regroupement africain, ont été soit fusionnés avec lui, soit dissous.\nLe gouvernement de Yaméogo serait accusé de néocolonialisme, car il s'alignait étroitement sur le gouvernement français. Les politiques dures du président et l'état profondément corrompu de son administration l'ont rendu extrêmement impopulaire. En 1964, le gouvernement a fortement restreint le droit des travailleurs à s'organiser et a interdit les grèves, faisant des syndicats puissants ses ennemis. Lors de l'élection présidentielle de l'année suivante, Yaméogo a été réélu, avec un soutien supposé de 100 % et un taux de participation de 98,4 %. Les élections parlementaires du lendemain ont officiellement enregistré un soutien de 100% et une participation de 97,4% en faveur de l'Union Démocratique Voltaïque, mais en réalité une abstention massive en signe de protestation contre le Président et son parti a eu lieu.\n\nLe 30 décembre, suite à l'aggravation des difficultés économiques, le gouvernement a annoncé un nouveau budget d'austérité, réduisant massivement les salaires des employés du secteur public et augmentant les impôts. Le lendemain, Denis Yaméogo - ministre de l'Intérieur et de la Sécurité et demi-frère du président - a utilisé la force pour disperser une réunion de la direction syndicale nationale. En conséquence, une grève générale a été déclenchée. Le 1er janvier 1966, le président Yaméogo déclare l'état d'urgence dans le pays. Le 2 janvier, il a déployé des troupes dans tous les bâtiments publics et a mis en garde les fonctionnaires contre toute participation à la grève générale. Finalement, le 3 janvier, la grève générale a commencé. De grands groupes de travailleurs protestataires ont pris d'assaut le siège du parti au pouvoir et l'Assemblée nationale. L'état d'urgence et le déploiement de troupes se sont retournés contre le gouvernement : les soldats de base ont refusé de tirer sur les manifestants. En peu de temps, les dirigeants militaires interviennent. Le lieutenant-colonel Sangoulé Lamizana, chef d'état-major, prend le pouvoir. Le président Maurice Yaméogo a été contraint de démissionner, puis emprisonné. Le lendemain, un nouveau gouvernement militaire est organisé, qui reçoit le soutien des syndicats qui mettent fin à la grève générale. La constitution a été suspendue et l'Assemblée nationale dissoute. Un nouveau cabinet a été formé avec sept militaires et quatre civils, le Conseil supérieur des forces armées, avec Lamizana à sa tête. Un comité consultatif a également été formé, composé de 46 membres représentant les militaires, les partis politiques, les syndicats, les chefs religieux et les autorités traditionnelles."
brk.6.d:0 "Aujourd'hui, Thomas Sankara a annoncé le changement de nom du pays. Dans un discours qu'il a prononcé, il a déclaré que \"La Haute-Volta était un nom colonial non pas de nous mais du gouvernement français, et parce que nous sommes plus qu'un simple endroit sur le fleuve Volta\". Le nouveau nom choisi est « Burkina Faso », signifiant terre des honnêtes gens."
MLA.0.d:0 "L'héroïque Armée de libération de la Malaisie, sous la direction indomptable du camarade Chin Peng, a lancé une campagne triomphale pour libérer Singapour, portant un coup décisif aux forces impérialistes du colonialisme britannique. Dans un assaut magistral et unifié, nos vaillants soldats ont brisé les derniers vestiges du régime colonial, balayant les défenses faibles et croulantes des oppresseurs. Le lâche maréchal Temple et son haut commandement, confrontés à la vague inarrêtable de la révolution, ont fui en disgrâce au Sarawak, abandonnant leur vaine tentative de soumettre notre peuple.\n\nLa libération de Singapour constitue une glorieuse victoire pour l'Armée de libération de la Malaisie et le Parti communiste malais, marquant l'aube d'une nouvelle ère de liberté et de justice pour les masses laborieuses d'Asie du Sud-Est. La chute de ce bastion colonial est une affirmation éclatante du pouvoir du peuple, renforçant notre contrôle sur la région et signalant le déclin irréversible de l'impérialisme. Cette réalisation historique n'est qu'un pas en avant dans notre marche imparable vers l'émancipation complète des opprimés, annonçant le triomphe inévitable du socialisme dans l'ensemble du paysage de l'Asie du Sud-Est."
MLA.1.d:0 "Des nouvelles choquantes sont arrivées hier d'Asie du Sud-Est. Pour la deuxième fois en dix ans, Singapour se rend aux forces ennemies. Mais cette fois, au lieu du soleil levant, c'est le drapeau cramoisi des travailleurs malaisiens qui flotte sur la colonie de la couronne. La colonie tomba aux mains des rebelles malaisiens grâce à un assaut massif à travers le détroit de Johor soutenu par un barrage d'artillerie précis qui annihila les défenses statiques coloniales. Tout en menant un combat courageux, la garnison britannique locale n'a pas pu arrêter la marée rouge qui déferlait dans les rues. Chin Peng, le chef de l'insurrection a déclaré que cette nouvelle ville « serait la capitale de notre peuple courageux et travailleur ». Même si les combats sporadiques se poursuivent, il est probable que Singapour ne verra plus jamais une autre domination anglo-saxonne."
MLA.2.d:0 "Aujourd'hui, le dernier chapitre de l'urgence malaise se termine alors que le soleil brille sur un nouvel état rouge. Au cours d'une brillante campagne de guérilla orchestrée par l'Armée nationale de libération du peuple malais, un mélange de troupes rhodésiennes, sud-africaines et britanniques fut à plusieurs reprises débordé et poussé dans la jungle par les communistes. Le gouvernement colonial étant désormais en fuite, la République démocratique populaire de Malaisie a été déclarée dans la nouvelle capitale, Xinjipo City. Même si l'on ignore quel rôle le nouvel État jouera dans la région, nombreux sont ceux qui s'inquiètent du fait que le socialisme se déchaîne désormais dans toute l'Asie du Sud-Est."
MLA.3.d:0 "Aujourd'hui, la République démocratique populaire de Malaisie a publiquement exécuté Sir Gerald Templer par un peloton d'exécution. Officier et vétéran des deux guerres mondiales, il a été l'un des principaux dirigeants du régime colonial et a été accusé par les tribunaux malaisiens de crimes contre l'humanité pour son utilisation d'armes chimiques, de camps de concentration (appelés nouveaux villages par la presse britannique) et d'une famine provoquée par l'homme qui a dévasté la campagne malaisienne. Templer a été capturé par les forces rebelles malaisiennes lors de la bataille de Singapour alors qu'il tentait de s'échapper. Au niveau international, le Royaume-Uni a publié une déclaration exigeant des sanctions de l'ONU, mais il est peu probable qu'aucune mesure soit prise."
MLA.9.d:0 "Dans une déclaration historique et inattendue, le camarade Chin Peng, président du Parti communiste de Nanyang, a officiellement proclamé le bouddhisme comme religion d'État de l'Union démocratique populaire de Nanyang (PDUN). L'annonce a eu lieu lors du Congrès de rajeunissement moral national, où le parti a présenté une synthèse idéologique renouvelée pour ancrer spirituellement la révolution.\nDebout devant une immense banderole indiquant « Le Dharma est la révolution, la révolution est le Dharma », Chin Peng s'est adressé à la nation et au monde :\n\n\"Gautama Bouddha s'est éloigné des palais d'or et a rejeté l'illusion de la richesse matérielle, tout comme le travailleur doit rejeter l'avidité capitaliste. Il a enseigné l'Octuple Sentier, comme nous enseignons le chemin dialectique vers la libération. Il était la conscience de classe originelle. Nous n'abandonnons pas Marx. Nous réalisons Marx, à travers l'esprit du Bouddha.\""
MLA.11.d:0 "Camarades, après notre courageuse résistance contre le fascisme japonais, nos seigneurs coloniaux sont revenus sur cette terre. Au moment où nous parlons, les chiens anglais pillent nos campagnes, affament notre peuple et exploitent notre nation. Chaque jour qui passe, les fruits de notre travail sont volés et utilisés pour consolider le régime colonial. C'est notre dernière chance de jeter les Britanniques à la mer. Si nous échouons, notre fier peuple restera enchaîné, mais si nous réussissons, toute la Malaisie sera libérée de la famine, de la peur et de la tyrannie."
MLA.12.d:0 "Aujourd'hui est un jour de fierté pour les travailleurs de Malaisie. Nous avons expulsé les Britanniques de Malaisie ! Cependant, nos dirigeants coloniaux ont encore un dernier combat à mener. Intel suggère que la colonie de la couronne de Singapour a récemment connu un afflux de troupes ennemies. Si nous permettons à cette petite île de recevoir davantage de renforts, les forces britanniques et américaines pourront lancer de vastes offensives sur notre pays. Pour cette raison, le président Peng a ordonné la prise de l'île et le lever du drapeau rouge sur la ville dès que possible."
MLA.15.d:0 "La direction du Parti communiste malais en [ROOT.Capital.GetName] est divisée sur l'alignement extérieur de la nouvelle république. La victoire sur la domination britannique a contraint le gouvernement à avoir besoin d'aide pour la reconstruction, tandis que la coalition de guerre n'a pas encore convenu de l'orientation politique de l'État.\n\nLes partisans de Chin Peng se tournent vers la Chine. Les relations chinoises du parti apportent un soutien considérable à cette position, mais cachent un différend entre ceux qui soutiennent le programme révolutionnaire de Mao et ceux qui restent attachés aux Trois principes du peuple de Sun Yat-sen. Une orientation chinoise exigerait que le Comité central résolve ce désaccord.\n\nShamsiah Fakeh prône le soutien soviétique et un gouvernement capable de représenter les travailleurs au-delà de la base chinoise du parti. Ses partisans réclament également une plus grande part d'autorité au sein de la direction. Se tourner vers Moscou placerait donc Chin Peng face à une lutte pour savoir s'il devait conserver le fauteuil ou le céder à Fakeh.\n\nLe Comité central doit choisir les relations extérieures autour desquelles il organisera le gouvernement."
MLA.16.d:0 "La guerre anti-britannique a presque brisé la paysannerie rurale. La déportation coloniale et les campagnes de bombardements chimiques ont détruit la capacité de la Malaisie à nourrir son prolétariat affamé. Nous devons agir vite pour décontaminer les fermes et rapatrier les agriculteurs qualifiés."
MLA.24.d:0 "Une fois notre pouvoir assuré, il est désormais temps de reconstruire notre grande nation à partir de zéro. Au cours de cette lâche retraite, les troupes britanniques et coloniales ont détruit tous les atouts économiques qu'elles pouvaient toucher dans le but de saboter notre reconstruction. C'est pour cette raison que nous devons reconstruire la Malaisie à partir de zéro. Les fermes doivent être décontaminées, les usines doivent être restaurées et la population doit être éduquée. Nous avons beaucoup de travail devant nous, camarades, mais avec la foi dans le président Peng, tout est possible !"
MLA.25.d:0 "Les données d'un récent recensement ont montré que le niveau d'éducation en Malaisie est bien pire que ce que nous aurions pu imaginer. Même si nous ne disposons pas de données concrètes, il est probable que le taux d'alphabétisation dans notre nouvelle nation soit inférieur à 30 %. Si nous voulons reconstruire et moderniser, les paysans doivent être éduqués."
MLA.26.d:0 "Après avoir trié les décombres de notre nation nouvellement libérée, nous avons découvert que la majeure partie de notre industrie a été perdue. Il est de notre devoir de récupérer tout équipement, schéma et expertise technique possibles laissés pour, espérons-le, reconstituer une forme de base industrielle."
MLA.27.d:0 "Les villes et villages individuels ont publié leurs taux de mortalité depuis que nous sommes arrivés au pouvoir et les chiffres sont horribles. Nous pouvons affirmer avec une certitude absolue qu'environ un million et demi de personnes (sur une population d'environ 7,5 millions d'habitants) ont péri à cause d'accidents du travail, de famine, de maladie et de négligence. Le président Peng, qui dispensait auparavant des enseignements bouddhistes malgré des avertissements, a été hospitalisé à Pékin après une tentative de suicide. Son état exact est inconnu, mais il est probable qu'il se rétablira complètement."
MLA.19.d:0 "Aujourd'hui, le Comité central de l'Union démocratique populaire de Nanyang, sous la direction immortelle du camarade Chin Peng, a publié une résolution idéologique radicale : la dénonciation formelle de l'Islam en tant que force réactionnaire et contre-révolutionnaire incompatible avec la libération des masses.\n\nDans un discours enflammé diffusé dans les zones libérées de Nanyang, le camarade Chin Peng a déclaré :\n\"Nous ne tolérerons plus les chaînes de la superstition féodale et de l'esclavage patriarcal. L'Islam, comme tous les opiacés théistes, a été utilisé comme arme par les propriétaires terriens, les monarques et les impérialistes étrangers pour soumettre les masses laborieuses, en particulier nos soeurs opprimées. Il doit être jeté dans les poubelles de l'histoire.\"\n\nAvec effet immédiat, les mosquées doivent être fermées ou reconverties, les écoles religieuses dissoutes et l'influence religieuse abolie de la vie publique. À leur place, la culture révolutionnaire du peuple s'élèvera : celle de la science, du bouddhisme, de la libération féministe et de l'éducation marxiste-léniniste."
MLA.4.d:0 "Aujourd'hui, le Dalaï Lama a quitté son domicile au Tibet pour visiter le nouvel État communiste de Malaisie. Le leader du monde bouddhiste a été accueilli par un grand défilé dans la capitale nationale mettant en vedette des images bouddhistes et la force militaire. Dans une interview, le Dalaï Lama a félicité le nouvel État et son chef bouddhiste Chin Peng pour avoir apporté la paix et la prospérité à tous les habitants de la Malaisie. Bien qu'invité à rester définitivement en Malaisie, le Dalaï Lama a déclaré que même si le nouvel État malaisien occuperait à jamais une place dans son coeur, sa véritable patrie était le Tibet."
MLA.14.d:0 "Au cours de la retraite chaotique de nos terres, de nombreux pilotes de bombardiers britanniques ont été capturés. Ces pilotes de bombardiers ont été reconnus coupables de crimes contre l'humanité par la Cour nationale malaisienne. Tout ce qui attend, c'est une phrase. Beaucoup pensent que la seule action juste est la mort par peloton d'exécution. Ces pilotes sont responsables de la mort de centaines de milliers de civils et la mort pourrait être le seul juste châtiment. D'autres, en revanche, estiment que la meilleure punition est d'envoyer les pilotes vers les victimes des bombardements britanniques et de les forcer à réparer les dégâts qu'ils ont causés. Cela pourrait éventuellement leur donner une leçon et, espérons-le, en faire des membres fidèles du parti. Enfin, un nombre croissant de citoyens estiment que notre pays a connu suffisamment de morts. Tuer ces garçons ne ramènera personne et la meilleure solution est de panser les blessures de la guerre. Que faut-il faire ?"
MLA.13.d:0 "Tunku Abdul Rahman, collaborateur du gouvernement colonial britannique et de l'Empire du Japon, a été capturé. Le serpent a été jugé par la Cour nationale malaisienne et a été reconnu coupable de trahison. Maintenant, nous devons le condamner. Beaucoup soutiennent que la peine de mort est nécessaire, certains pensent que les travaux forcés sont une option, et quelques-uns pensent que les poursuites judiciaires sont une perte de temps et ne feront que polariser davantage la nation. Que faut-il faire ?"
MLA.20.d:0 "Dans un discours retentissant devant l'Assemblée populaire centrale, le camarade Chin Peng a dévoilé une nouvelle campagne de grande envergure : la sinisation de l'Union démocratique populaire de Nanyang, un effort révolutionnaire visant à forger l'unité, la discipline et la pureté idéologique à travers l'unification de la langue, de la culture et de l'identité dans le cadre socialiste des Han.\n\nLe camarade Chin Peng a proclamé :\n\n« Le petit tribalisme, les dialectes féodaux et les hybridismes coloniaux doivent être éradiqués de l'esprit du citoyen révolutionnaire. Nous ne devons plus être des Malais, des Indiens, des Dayaks ou autres - nous devons devenir un : le peuple de Nanyang, lié par la langue de la révolution, la culture de la lutte et la discipline de notre héritage révolutionnaire Han. L'avenir parle mandarin, marche dans des bottes marxistes et salue le drapeau de l'unité et du socialisme !\n\nDans le cadre de cette politique, les changements suivants seront mis en oeuvre dans toutes les zones révolutionnaires :\n- Le chinois mandarin deviendra la seule langue officielle de l'administration, de l'éducation et de la propagande.\n- Toutes les écoles, temples, institutions culturelles et panneaux non-Han seront restructurés ou remplacés par des centres culturels socialistes promouvant les valeurs Han et l'histoire révolutionnaire.\n- Les fêtes et les héros révolutionnaires Han seront enseignés et commémorés dans toutes les provinces, remplaçant ainsi les traditions locales.\n- Un Bureau de réforme de la langue populaire sera créé pour superviser la normalisation linguistique et l'élimination des « dialectes contre-révolutionnaires » de l'usage public."
MLA.5.d:0 "Des nouvelles inquiétantes sont arrivées aujourd'hui de Malaisie. Des rapports ont été vérifiés selon lesquels les propriétaires coloniaux laissés sur place par les forces britanniques en retraite sont en train d'être liquidés. Bien que le nombre exact soit inconnu, on estime que plus de 150 à 200 propriétaires ont été exécutés par l'État selon des méthodes allant de la pendaison aux pelotons d'exécution, voire à la lapidation publique. Le gouvernement malaisien a déclaré que « même si les exécutions ne nous apportent aucune joie, nous ne pouvons pas permettre que les crimes contre le peuple malaisien restent impunis ». Il semble déjà que les exécutions touchent à leur fin, mais cela restera probablement un point noir en République démocratique populaire de Malaisie."
MLA.28.d:0 "Aujourd'hui, l'ancien héros de la guerre anti-britannique en Malaisie, Shamsiah Fakeh, a été publiquement exécuté pour trahison. Depuis la création de l'État communiste, Fakeh a demandé avec acharnement de maintenir de bonnes relations avec les Soviétiques et les Chinois rouges en organisant un gouvernement socialiste pluraliste. Cependant, à mesure que les relations se détérioraient entre les nations, le sentiment utopique d'unité et de compromis de Fakeh devint un handicap pour un parti de plus en plus maoïste. Tard hier soir, un tribunal fantoche a été organisé et lors d'un événement télévisé rare, Shamsiah Fakeh a été condamné à mort par un peloton d'exécution. L'exécution a été suivie par le président Chin Peng déclarant qu'à compter d'aujourd'hui, le MCP (Parti communiste malaisien) ne tolérerait plus « la déviation réactionnaire dans la révolution prolétarienne » dans ses rangs."
MLA.29.d:0 "La semaine dernière, des citoyens thaïlandais confus se sont réveillés pour découvrir des milliards de billets de banque couvrant le pays. Bien qu'initialement considérée comme une bénédiction par le peuple thaïlandais appauvri, l'augmentation drastique de la monnaie a presque du jour au lendemain fait chuter la valeur du baht thaïlandais à des niveaux historiquement bas. Même si les dégâts à long terme sont inconnus, les magasins à travers le pays sont vides, la plupart des travailleurs ont abandonné leur poste en raison de la stagnation des salaires et les dissidents du Pathet Lao ont éclaté dans tout le pays. Dans un communiqué officiel, le gouvernement thaïlandais a accusé la République démocratique populaire de Malaisie de saboter son économie et a appelé à des sanctions strictes de l'ONU."
MLA.30.d:0 "Aujourd'hui marque une nouvelle ère pour le peuple malaisien alors que le président Peng a annoncé l'achèvement du réseau ferroviaire S.A. Ganapathy. Traversant les jungles, les montagnes et les rivières, le réseau ferroviaire de 5 000 milles relie toutes les grandes villes, ports, mines et zones forestières à la ville de Xinjipo. En plus d'un nouvel accès à des ressources rares, l'infrastructure permet à l'aide et aux fournitures indispensables d'atteindre les villages reculés. Pour la première fois, les Malaisiens peuvent se rendre au travail comme les Occidentaux, alors que l'État communiste continue de se moderniser."
MLA.31.d:0 "Un nouveau mouvement est né des jungles du sud de la Thaïlande. Aujourd'hui, des membres du CPT (Parti communiste thaïlandais) dirigés par le lieutenant-colonel Phayom Chulanont, ainsi que des dissidents du Pathet Lao et des nationalistes chinois, ont effectué une longue marche à travers le pays et ont déclaré une région indépendante autour de la petite ville de Hat Yai, à la frontière malaisienne. Le groupe, se désignant sous le nom de Tàiguó mínzú (Nation thaïlandaise), est un groupe insurrectionnel maoïste dédié à la libération de tout le peuple thaïlandais. Alors que les forces armées royales thaïlandaises ont été mobilisées, les attaques contre les guérilleros soutenus par la Malaisie se sont soldées par un désastre, ce qui a amené beaucoup à croire que ce nouveau mini-État est là pour rester."
MLA.32.d:0 "Face aux tensions sino-soviétiques croissantes, le président Mao nous a exhorté à dissoudre notre système de double direction, à exécuter Shamsiah Fakeh et à nous joindre officiellement à la lutte contre l'impérialisme culturel soviétique. Alors que Chin Peng est devenu hostile aux interventions de Khrouchtchev en Europe de l'Est, la politique de neutralité socialiste de Fakeh a amené les richesses de la Chine et de l'Union soviétique dans les ports malais. Les conseillers nous ont également informés que la neutralité socialiste peut toujours être maintenue, à condition de faire preuve d'une attention particulière dans les futures relations internationales."
MLA.33.d:0 "Le président Peng nous a fait part de ses intentions de moderniser la Malaisie. Bien que beaucoup souhaitent accomplir cette tâche seuls, rares sont ceux qui peuvent nier la nécessité d'un financement extérieur. Heureusement, deux plans nous ont été présentés. Le premier vient d'URSS. Le gouvernement soviétique nous a promis un accès total aux secrets industriels ainsi que des accords commerciaux extrêmement généreux sur les ressources soviétiques. Tout ce qu'ils souhaitent en échange, c'est un bail de 50 ans sur le port de Malacca pour simplifier les échanges commerciaux dans la région. Le deuxième vient de la RPC. Le camarade Mao a offert les meilleurs conseillers industriels, ainsi qu'un demi-million des meilleurs travailleurs chinois pour nous aider à nous moderniser. Tout ce qu'ils demandent en retour, c'est notre plein soutien dans les affaires diplomatiques. Même si les deux sont tentantes, nous ne pouvons choisir qu'une seule offre."
MLA.34.d:0 "Le moment est venu. Les plans pour chaque aspect de la campagne de modernisation sont terminés, des millions de nos travailleurs sont mobilisés et les approvisionnements de nos alliés affluent via nos ports. Il ne reste plus qu'à donner le feu vert."
MLA.35.d:0 "Alors que l'initiative d'alphabétisation de masse a apporté la lecture et la sagesse à notre nation, il est devenu nécessaire d'élargir davantage les connaissances du peuple malais. Le président Peng a demandé que d'ici 1975, tous les Malaisiens aient un diplôme universitaire. Pour répondre à cette demande, il faut fonder des universités couvrant des sujets allant des mathématiques à l'ingénierie appliquée, cultiver un nouvel enthousiasme pour l'apprentissage et accroître notre compréhension de la langue."
MLA.38.d:0 "Malgré l'impérialisme britannique, l'occupation japonaise et la famine, notre peuple a persévéré. Il est temps que le Parti communiste les récompense. Chaque citoyen de notre pays a accès à de l'eau potable, à un lit sec et à la protection contre la violence, mais il a besoin de plus. Les magasins de consommation sont souvent vides, les files d'attente pour recevoir une aide médicale s'étendent souvent sur des pâtés de maisons entiers et nos travailleurs manquent de biens pour dépenser leurs salaires en hausse. Ces problèmes doivent être résolus si nous voulons être considérés comme une nation moderne."
MLA.36.d:0 "Actuellement, le citoyen malaisien moyen ne consomme que 1 250 calories par jour. Bien que techniquement « sûre », toute baisse de productivité plongerait la Malaisie dans une nouvelle famine. Si nous voulons soutenir notre base industrielle croissante, tous les goulets d'étranglement agricoles doivent être éliminés, la mécanisation doit être réalisée et une augmentation de la production d'engrais doit avoir lieu."
MLA.39.d:0 "Une fois notre pays stabilisé, nous pouvons maintenant commencer à exploiter les riches ressources de notre pays. Les mines de la domination coloniale britannique peuvent désormais être rouvertes et les mineurs peuvent retourner au travail. Les prospecteurs revenant de Perak et Terengganu ont découvert d'importants gisements de fer, de cuivre et de bauxite. Nous devons exploiter ces richesses pour le bénéfice et le progrès de tous les Malaisiens."
MLA.40.d:0 "Avec la modernisation de notre grande nation, nous pouvons commencer à déployer des efforts pour libérer toute l'Asie du Sud-Est. Pour nous aider dans notre lutte, la Maláixiyà Qíngbào Jú (Agence de renseignement malaisienne) a été fondée pour recueillir des informations, contribuer à l'activité révolutionnaire et, si nécessaire, se joindre au combat direct avec les forces réactionnaires à travers la région."
MLA.41.d:0 "Depuis près de vingt ans, la guerre civile birmane stagne. La faction du drapeau blanc dirigée par le camarade Thakin Than Tun est dans un état de crise constant, mais le gouvernement birman est incapable de porter un coup critique. Il est dans l'intérêt stratégique des Chinois et de nos propres intérêts de voir ces révolutionnaires réussir et établir un État allié. La victoire signifiera l'encerclement total de la Thaïlande ainsi qu'une porte d'entrée vers le Bangladesh et l'Inde."
MLA.42.d:0 "Depuis le début des années 50, le Pathet Lao est en conflit avec les Français, les Américains et le royaume du Laos. Il est dans l'intérêt du prolétariat laotien et de notre grande nation de voir un gouvernement socialiste au Laos. C'est pourquoi nous devons commencer à envoyer des armes et du matériel pour augmenter leurs chances de victoire."
MLA.43.d:0 "Des agents de notre Thaïlande ont signalé une situation propice à la révolution. Bien qu'il ne s'agisse actuellement que d'une petite force, le CPT (Parti communiste thaïlandais) a accès et a des relations avec de nombreux groupes de guérilla de gauche et nationalistes dans la région. En outre, il existe des preuves suggérant que les Forces armées royales thaïlandaises ont des sympathies maoïstes. S'ils reçoivent une direction ferme, ces groupes peuvent se coordonner en un seul poing capable de briser la monarchie réactionnaire. Si l'on y accorde suffisamment d'attention, de financement et de fournitures, nous pensons que d'ici 1980, un État socialiste allié pourra être établi en Thaïlande."
MLA.44.d:0 "La situation au Cambodge est... Intéressante. Les Khmers rouges maoïstes de Pol Pot mènent actuellement une guérilla sanglante contre la monarchie cambodgienne. Alors que sur le papier, nous soutenons la lutte de Pol Pot contre la répression cambodgienne, les agents et spécialistes du MQJ remettent sérieusement en question la capacité et l'intelligence de Pol Pot à diriger sa nation en temps de paix. Nous pensons cependant qu'étant donné notre intelligence et notre situation précaire, Pol Pot pourrait s'avérer être une marionnette précieuse pour nous."
MLA.45.d:0 "Intel suggère que la situation au Sud-Vietnam est trompeuse. Les troupes américaines affluent vers le régime réactionnaire de Diem, mais il est clair que la volonté de leurs deux peuples est en train de se briser. La propagande, les répressions et la conscription forcée n'ont fait qu'encourager le prolétariat sud-vietnamien à prendre les armes contre l'impérialisme. Cependant, il est insensé de penser que la victoire est assurée au Vietnam. Les lignes de bataille changent chaque jour et une seule offensive peut détruire tout progrès dans la région. C'est pour cette raison que nous pensons qu'il est de notre devoir de nous impliquer dans le conflit."
MLA.46.d:0 "Même si les premiers programmes de secours ont été couronnés de succès, notre base industrielle et notre main d'oeuvre ne pourront à elles seules faire pencher la balance de la guerre civile birmane. C'est pour cette raison que nous devons demander une participation chinoise supplémentaire."
MLA.47.d:0 "Le camarade Peng nous a présenté une proposition alléchante. Depuis plusieurs mois, nos camarades malaisiens s'investissent de plus en plus dans le conflit en Birmanie. Même si nos camarades du Sud ont beaucoup de chance, ils ont besoin de plus de matériel et d'engagement de la part de notre grande nation. Alors que beaucoup craignent de s'enliser en Birmanie, Peng a exprimé l'importance stratégique d'un État allié dans la région. Que devons-nous faire ?"
MLA.48.d:0 "Excellentes nouvelles de la République populaire de Chine. Au moment où nous parlons, l'économie chinoise se prépare à une implication prolongée dans la guerre civile birmane. Ils ont exposé leur objectif d'envoyer chaque jour cinquante avions de transport transportant des armes, des conseillers et des ouvriers pendant les dix prochains mois. Cette aide chinoise accrue garantira presque certainement la victoire dans la guerre civile."
MLA.49.d:0 "Nouvelles décevantes en provenance de la République populaire de Chine. Même si le camarade Mao et le PCC sympathisent avec la lutte birmane, ils ont refusé toute implication dans un avenir proche, sous prétexte de vouloir éviter un scénario vietnamien. Bien que cette nouvelle constitue un revers dans le progrès de la guerre civile, nos camarades en Birmanie ont encore l'espoir de remporter la victoire."
MLA.10.d:0 "Le programme de reconstruction et de modernisation de la Malaisie a transformé l'ancienne économie coloniale. Les nouvelles industries, les transports, les écoles et les services publics sont présentés comme la preuve que le gouvernement révolutionnaire peut assurer un développement durable."
MLA.21.d:0 "La campagne de modernisation a dépassé ses objectifs. La production malaisienne se compare désormais avantageusement à celle de ses voisins, renforçant la légitimité du gouvernement et l'attrait de son modèle économique."
MLA.23.d:0 "La campagne de modernisation a épuisé l'État sans produire une économie durable. Les chaînes d'approvisionnement brisées, les mauvaises constructions et les perturbations agricoles menacent désormais l'ensemble du programme du gouvernement."
MLA.50.t2:0 "Expansion des renseignements malaisiens"
MLA.50.d:0 "Les engagements régionaux croissants de la Malaisie nécessitent un service de renseignement professionnel. Le recrutement, la formation en langues étrangères et les réseaux clandestins seront développés sous une direction centralisée."
MLA.55.d:0 "Nos forces ont prévalu dans les combats frontaliers. La victoire a ouvert la voie à une administration révolutionnaire amicale et a assuré un nouveau point d'appui contre le gouvernement thaïlandais."
MLA.56.d:0 "L'opération a réussi et de précieuses armes et équipements de soutien birmans sont tombés entre nos mains. Ces fournitures peuvent immédiatement renforcer nos forces."
MLA.51.d:0 ""
MLA.52.d:0 ""
MLA.22.d:0 "Des nouvelles tragiques nous parviennent de la République démocratique populaire de Malaisie. Alors que les regards étrangers ont été bannis du pays, les transfuges parlent d'usines inachevées en ruine, de lignes ferroviaires détruites, de famine et de répression sans précédent depuis l'époque de l'occupation japonaise. On ne sait pas grand-chose de cette petite nation communiste, mais nombreux sont ceux qui pensent que l'ambitieuse campagne de modernisation du président Peng a échoué. De nombreuses raisons peuvent expliquer un effondrement économique complet, mais la plus importante semble être une base industrielle précipitée et une fabrication d'acier médiocre, conduisant à un effondrement de l'infrastructure agricole du pays. De nombreux pays membres de l'ONU ont proposé des expéditions de céréales, mais aucune réponse n'est venue de la Malaisie."
MLA.58.d:0 "Aujourd'hui, les communistes ont remporté une victoire majeure en Asie. L'allié de longue date de l'ouest de la Thaïlande est officiellement tombé aux mains de la guérilla communiste. Dans les jours qui ont suivi la défaite royaliste, la République démocratique populaire de Thaïlande a été fondée sous un régime maoïste strict à parti unique. Cette évolution a été un choc des deux côtés du rideau de fer et nombreux sont ceux qui ont déjà souligné l'échec de l'endiguement américain alors que le communisme déferle sur l'Asie. Dans une rare interview avec le président Chulanon, le révolutionnaire déclare qu'il espère « prouver que la théorie des dominos est correcte » alors que l'Armée populaire de libération thaïlandaise commence à se mobiliser aux frontières réactionnaires."
MLA.59.d:0 "Une nouvelle choquante enveloppe aujourd'hui la Malaisie rouge alors que le leader de longue date Chin Peng a été destitué. Bien que l'on ignore où se trouve directement Peng, la plupart des analystes pensent que le nouveau groupe aux commandes, appelé faction réformiste, est là pour rester. La nouvelle administration a déjà déclaré son intention de libéraliser l'État communiste et d'améliorer les relations avec l'Occident. Pour l'instant, l'avenir de la Malaisie est inconnu alors que le pays entre dans une nouvelle décennie."
MLA.61.d:0 "Aujourd'hui, les dirigeants du Royaume-Uni et de la République populaire démocratique de Malaisie se sont rencontrés à Johannesburg, en Afrique du Sud. Alors que les deux nations ont eu des relations glaciales dans le passé, les dirigeants des deux nations estiment qu'il est temps de mettre fin aux hostilités et de commencer à semer les graines de la paix. Les résultats de ce sommet incluent la fin des sanctions sévères, le retour des prisonniers de guerre et une garantie de non-agression de la part des deux parties. Même si la réaction de la communauté internationale a été plutôt positive, l'Albanie, la RPDC et plus particulièrement la RPC ont sévèrement critiqué le sommet et tout ce qu'il représente. Malgré ces condamnations, nombreux sont ceux qui s'accordent à dire qu'il s'agit là d'une avancée majeure dans la lutte pour la paix mondiale."
MLA.62.d:0 "Les forces révolutionnaires se sont levées dans toute la Malaisie orientale, s'emparant de positions stratégiques et défiant les dernières administrations soutenues par le colonialisme. La lutte pour la réunification nationale est entrée dans une phase décisive."
MLA.63.d:0 "Pol Pot a été tué lors d'une opération secrète. La direction révolutionnaire du Cambodge est en train d'être réorganisée alors que des factions rivales se précipitent pour contrôler le mouvement."
MLA.64.d:0 ""
MLA.65.d:0 "La Thaïlande a accepté la demande d'intervention de la Malaisie au Cambodge. Les forces thaïlandaises entrent dans le conflit en soutien à la coalition révolutionnaire."
MLA.66.t2:0 "[GetNewspaperHeader]La Malaisie et la Thaïlande entrent dans la guerre civile au Cambodge"
MLA.66.d:0 "La Malaisie et la Thaïlande révolutionnaire ont engagé leurs forces dans le conflit cambodgien, élargissant considérablement la guerre régionale."
MLA.67.d:0 "La campagne de modernisation de Chin Peng a échoué. Des matériaux de construction de mauvaise qualité ont vidé notre nation autrefois riche de sa prospérité. Maintenant, nous ne pouvons que récupérer les paix. L'ordre doit être rétabli, les fermes doivent être reconstruites et l'industrie doit être abandonnée si notre grande nation socialiste veut survivre. Tout n'est pas perdu et notre nation s'en remettra."
MLA.68.d:0 "Un toast au prolétariat malaisien. Avec la modernisation de notre nation, notre peuple bénéficie d'un luxe jamais imaginé auparavant. Des installations sanitaires intérieures, un accès constant à l'eau potable et à l'électricité, des routes entièrement pavées et des soins médicaux accessibles ne sont que quelques-uns des nombreux cadeaux que le CPM a décernés à notre fidèle classe ouvrière. Pourtant, un problème demeure. Notre croissance impressionnante a fait chuter les prix de pratiquement tous les produits. Même si cela peut sembler être une victoire majeure pour notre grande nation, nous n'avons pas réussi à ajuster la masse monétaire en fonction de ces nouveaux changements de prix. En raison de cet échec, des pénuries massives s'emparent du pays. Il faut vite corriger cette erreur avant de risquer de tout perdre."
MLA.69.d:0 "Le ministère de la Sécurité intérieure nous a annoncé des nouvelles troublantes. Au cours des six derniers mois, des rumeurs se sont répandues selon lesquelles des modérés au sein du CPM complotaient pour renverser le président Peng. Selon eux, Chin Peng s'est révélé être un leader inefficace qui doit être démis de ses fonctions pour maintenir vivant l'esprit de la Malaisie. Que faut-il faire ?"
MLA.70.d:0 "Une fois notre économie stabilisée, nous pouvons désormais commencer la libération de la Malaisie orientale. Alors que le haut commandement des Forces armées de libération nationale nous a déconseillé toute action directe, le MQJ nous a informés que les conditions matérielles dans nos territoires occupés sont mûres pour une révolution. Les Malaisiens de la mer de Chine méridionale deviennent jaloux de notre prospérité, qui, associée à des minorités ethniques déjà rebelles, pourrait déclencher la révolution en Malaisie orientale. Le MQJ a encouragé l'utilisation de tactiques terroristes contre les occupants réactionnaires tout en armant les groupes antigouvernementaux en prévision de toute action entreprise. Avec un bon leadership, de la patience et de la chance, nous pourrons enfin libérer pleinement notre nation dans son ensemble."
MLA.71.d:0 "Gloire éternelle aux rebelles de la Malaisie orientale. D'un seul coup, les occupants impérialistes qui se sont débarrassés du prolétariat malaisien ont été emportés à la mer. L'unification de notre nation nous permettra d'étendre notre influence dans le Pacifique Sud et d'assurer la paix et la liberté à notre peuple. Au moment où nous parlons, des équipes de construction, des conseillers militaires et des éducateurs traversent la mer de Chine méridionale pour moderniser les campagnes et développer l'esprit socialiste de nos terres orientales."
MLA.72.d:0 ""
MLA.77.d:0 "Des conseillers au Cambodge nous ont informés que les Khmers rouges ont cruellement besoin d'aide. Bien que les Laotiens soutiennent la lutte internationale, la présence américaine et sud-vietnamienne met la révolution en péril. C'est pour cette raison que nous avons demandé l'intervention complète de la République populaire thaïlandaise nouvellement créée."
MLA.78.d:0 "Malheureusement, la Thaïlande a refusé notre demande d'intervention dans la guerre civile cambodgienne. Bien qu'ils sympathisent avec la lutte khmère, l'instabilité politique a laissé la jeune nation dans un état vulnérable. Toute implication militaire drastique risquerait de briser le gouvernement central déjà faible."
MLA.79.d:0 "La Thaïlande a refusé notre demande d'intervention. Son gouvernement sympathise avec la révolution cambodgienne mais considère l'action militaire directe trop dangereuse pour le jeune régime."
PRC_RAJ.55:0 "Les forces communistes ont prévalu le long de la frontière himalayenne. La victoire a redessiné le contrôle local et a permis à une nouvelle administration alignée de consolider le territoire contesté."
MLA.80.d:0 "Le ministère de la Sécurité intérieure nous a annoncé des nouvelles troublantes. Au cours des six derniers mois, des rumeurs se sont répandues selon lesquelles des modérés au sein du CPM complotaient pour renverser le président Peng. Selon eux, Chin Peng s'est révélé être un leader inefficace qui doit être démis de ses fonctions pour maintenir vivant l'esprit de la Malaisie. Que faut-il faire ?"
PRC_SOV.10.d:0 "Aujourd'hui, les steppes d'Asie centrale sont le théâtre de l'exercice militaire le plus vaste et le plus complexe jamais réalisé. Nom de code Vostok-62, l'exercice a réuni l'Allemagne de l'Est, la Pologne, la Roumanie, la Tchécoslovaquie, la Bulgarie, l'Union soviétique, la Mongolie, la RPDC, la Chine rouge, le Vietnam, le Laos et la Hongrie. Bien que les véritables intentions du Vostok-62 soient inconnues, il est largement admis que son objectif était de simuler une attaque multinationale à travers un territoire mal approvisionné. Bien qu'au départ confrontés à des problèmes d'organisation systémiques et à de nombreux cas de problèmes de communication, les commandants sur le terrain n'ont pas tardé à rétablir l'ordre et à avancer. Les moments marquants de l'exercice comprenaient l'échec d'un largage conjoint soviéto-coréen au-dessus de Yili qui a fait environ 22 victimes et l'efficacité surprenante d'un assaut conjoint est-allemand-chinois à travers le lac Zaysan."
PRC_SOV.11.d:0 "Le président Wang Ming a annoncé aujourd'hui que la République populaire de Chine se lancerait dans une série de réformes libérales visant à améliorer l'économie du pays et le bien-être des travailleurs chinois. Les politiques notables comprennent l'amnistie pour de nombreux prisonniers politiques, des réformes du marché et une plus grande liberté d'expression. On ne sait pas jusqu'où iront ces réformes, mais il est clair que la Chine entre dans une nouvelle ère."
PRC_SOV.12.d:0 "Depuis la fondation de la Chine rouge, l'URSS est devenue débordée et désorganisée alors qu'elle tente de maintenir son contrôle sur l'ensemble de l'Eurasie. Pour tenter d'apaiser les tensions, la RPC a annoncé son retrait du Pacte de Varsovie. Le puissant partenaire soviétique a proposé de remplir les garnisons soviétiques à travers l'Asie et de leur permettre de se concentrer sur l'Europe. Même si certains pensent qu'il s'agit d'un signe de division socialiste, Wang Ming et Khrouchtchev ont assuré au monde que l'alliance sino-soviétique reste plus forte que jamais."
PRC_SOV.13.d:0 "L'Armée populaire de libération (APL) a récemment lancé une invasion à grande échelle du Tibet. Le PCC prétend qu'il s'agit de restaurer la souveraineté chinoise sur le pays. Cet acte d'agression a été largement condamné, mais aucune nation n'a pris d'action. À mesure que les troupes chinoises entreront dans la capitale tibétaine, il est probable que le Tibet soit entièrement absorbé par la RPC."
PRC_SOV.14.d:0 "Depuis la fondation de la Chine rouge, l'URSS est devenue débordée et désorganisée alors qu'elle tente de maintenir son contrôle sur l'ensemble de l'Eurasie. Pour tenter d'apaiser les tensions, la RPC a annoncé son retrait du Pacte de Varsovie. Le puissant partenaire soviétique a proposé de remplir les garnisons soviétiques à travers l'Asie et de leur permettre de se concentrer sur l'Europe. Même si certains pensent qu'il s'agit d'un signe de division socialiste, Wang Ming et Khrouchtchev ont assuré au monde que l'alliance sino-soviétique reste plus forte que jamais."
PRC_SOV.15.d:0 "Avec le succès de l'expérience de libéralisation chinoise, le PCC a annoncé le début de nouvelles réformes massives visant à apporter plus de prospérité économique et de liberté aux travailleurs chinois. Cette nouvelle vague de réformes comprend l'établissement d'une limite de 10 ans pour le mandat de la présidence, une plus grande libéralisation économique et une politique de détente avec l'OTASE et le monde occidental. Ces réformes devraient avoir des répercussions sur le Pacte de Pékin à mesure que l'Asie commence à s'ouvrir."
PRC_SOV.16.d:0 "Aujourd'hui, Kai Feng a été nommé président du Parti communiste chinois. Inspiré par les réformes culturelles et économiques de Wang Ming, Feng a des projets audacieux tels que la refonte du système éducatif, une plus grande ouverture du marché et une plus grande participation des travailleurs au gouvernement. Beaucoup espèrent une nouvelle ère de liberté pour la Chine, mais d'autres craignent que ces réformes ne soient allées trop loin."
PRC_SOV.17.d:0 "Pour la deuxième fois en une décennie, les forces chinoises traversent le Yalu pour entrer en RPDC. Mais cette fois, il s'agit de mettre fin au régime de Kim. Selon le PCC, Kim Il Sung est devenu un despote voyou. Un grand nombre de soldats coréens ont déjà abandonné leurs postes et se sont joints à l'invasion alors que les chars chinois entrent sans opposition dans Pyongyang. Bien que l'on ignore où se trouve exactement la famille Kim, une administration pro-chinoise a déjà été mise en place. Il est probable que d'ici quelques jours, l'ordre sera rétabli dans la péninsule coréenne."
PRC_SOV.18.d:0 "Aujourd'hui, les membres du Parti communiste chinois ont annoncé la création du gouvernement populaire du nord de la Chine. Après une défaite écrasante à la bataille de Shanghai, les communistes furent repoussés en Mandchourie, où seule une intervention soviétique de dernière minute les sauva de la destruction totale. Le gouvernement populaire du nord de la Chine a déclaré sa ferme allégeance à l'orthodoxie marxiste-léniniste et constitue un bouclier pour le ventre vulnérable de l'Extrême-Orient. Tout comme l'Allemagne, la Corée et le Vietnam, il semble que la Chine sera divisée selon des lignes idéologiques."
PRC_SOV.20.d:0 "Par une tournure des événements, le révolutionnaire en disgrâce Mao Zedong est revenu au pouvoir au sein du gouvernement populaire du nord de la Chine. Autrefois adoré du peuple chinois, Mao est tombé en disgrâce pour son échec à sécuriser la Chine. Après sa retraite en Mandchourie, Mao fut déposé et remplacé par une marionnette soviétique. Cependant, alors que l'administration soviétique visitait une aciérie sur la rivière Yalu, des éléments maoïstes de l'APL ont verrouillé Pékin et réinstallé Mao à la présidence. Des rapports ont confirmé que le dirigeant déchu Wang Ming a été détenu et attend son procès pour crimes contre le peuple chinois. Les Soviétiques ont refusé de faire une déclaration, même si la rumeur veut que les chars se rassemblent le long du fleuve Amour."
PRC_SOV.22.d:0 "Camarades, notre nation a été libérée sous le drapeau rouge du socialisme. Pourtant, notre travail ne fait que commencer. Au moment où nous parlons, les usines abandonnées par les cochons capitalistes sont en idole et une famine s'empare des campagnes. Nous devons reconstruire la nation brique par brique jusqu'à ce que notre classe ouvrière ne craigne plus la famine et l'aliénation du travail."
PRC_SOV.23:0 "Tout comme l'Union soviétique, une grande partie de la Chine reste épargnée par l'homme. Nos terres occidentales étaient stériles et désertes. Cependant, le camarade Khrouchtchev nous a inspiré à faire de notre pays une puissance agricole luxuriante comparable aux steppes d'Ukraine et aux grandes plaines d'Amérique du Nord."
PRC_SOV.24:0 "Avec la signature du Pacte de Pékin, nous sommes devenus plus forts que l'acier. L'OTASE craindra la puissance combinée de la Chine et de ses alliés alors que nous balayons l'Asie. Tandis que nos camarades européens mettent fin au capitalisme sur leur continent, nous mettrons également fin au capitalisme en Asie."
PRC_SOV.25:0 "Les récentes réformes libérales en Chine ont abouti à un échec total. Notre classe ouvrière autrefois forte devient désormais grosse et docile. Nous devons les remettre en forme et revenir à nos racines marxistes-léninistes."
PRC_SOV.26:0 "Les récentes réformes libérales ont abouti à un succès total. Notre nation, autrefois malade de l'Asie, se présente comme la superpuissance continentale. Nous sommes égaux à l'Union soviétique en termes de PIB et de productivité. Cependant, ce n'est pas le moment de s'arrêter. Nous devons nous ouvrir encore davantage et permettre à la richesse de la Chine de croître davantage."
