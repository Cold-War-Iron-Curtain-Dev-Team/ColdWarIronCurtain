 notecrisis.1.t:0 "Les élections finlandaises tournent mal"
 notecrisis.1.d:0 "Les élections finlandaises approchent bientôt et il semble que notre allié soviétique Urho Kekkonen soit en train de perdre les élections face à Olavi Honka. Olvai Honka est tout à fait favorable aux liens avec l'Occident et n'est pas aussi centré sur nous et sur le Pacte de Varsovie. Cela peut nous faire vraiment du mal, et la Finlande pourrait éventuellement être entraînée dans l'OTAN. Devons-nous faire quelque chose à propos des élections, essayer autre chose, ou simplement laisser tout cela de côté et espérer qu'il gagne ?"
 notecrisis.1.a:0 "Faites pencher l'élection en faveur de Kekkonen."
 notecrisis.1.b:0 "Laissez les élections tranquilles. Ce qui arrive arrive."
 notecrisis.1.c:0 "Les Soviétiques doivent s'impliquer maintenant. Envoyez la note finlandaise."

 notecrisis.2.t:0 "Finlande Remarque"
 notecrisis.2.d:0 "Les Soviétiques nous ont envoyé un nouveau traité. Ils souhaitent assurer la défense des deux pays. Ce qu'ils entendent par là, c'est rouvrir la base navale soviétique de Porrka à côté d'Helsinki, déployer des armes et des troupes soviétiques en Finlande et garantir que la Finlande reste centrée sur l'URSS et le Pacte de Varsovie. Certains de nos conseillers affirment que cela pourrait nous aider à devenir de meilleurs alliés avec l'Est, mais d'autres estiment que cela pourrait nuire aux relations avec l'Ouest. Que faisons-nous à propos de la note ?"
 notecrisis.2.a:0 "Acceptez la remarque. Les Soviétiques sont plus proches de nous."
 notecrisis.2.b:0 "Refuser la note. Nous serons neutres et pas seulement un allié soviétique."
 
 notecrisis.3.t:0 "La Finlande dit non à Note"
 notecrisis.3.d:0 "Le gouvernement finlandais a démenti la note finlandaise, affirmant qu'il souhaitait rester neutre. Cela pourrait les amener à se tourner vers l'Occident. La Finlande est un pays important qui doit être notre allié. Que devrions-nous faire face à cette crise des notes ?"
 notecrisis.3.a:0 "Le gouvernement finlandais souhaitera être neutre."
 notecrisis.3.b:0 "Nous avons essayé une option diplomatique. Nous devons maintenant opter pour une option militaire."
 notecrisis.3.c:0 "Nous négocierons avec eux."
 
 notecrisis.4.t:0 "Les troupes soviétiques entrent en Finlande"
 notecrisis.4.d:0 "Les Soviétiques ont envoyé des troupes dans notre pays sans notre permission. Ils occupent les villes proches de la frontière soviétique et progressent de plus en plus. Les Soviétiques ont déclaré que c'était pour nous protéger des menaces occidentales. Devons-nous leur faire confiance, ou est-ce que cela met en péril notre indépendance en tant que nation ?"
 notecrisis.4.a:0 "Laissez l'Union Soviétique nous occuper. Nous laisserons entrer notre allié."
 notecrisis.4.b:0 "C'est une violation de notre indépendance et un acte de guerre. Alertez les militaires pour qu'ils ouvrent le feu sur les Soviétiques."
 
 notecrisis.5.t:0 "Pourparlers d'Helsinki"
 notecrisis.5.d:0 "Les Soviétiques ont envoyé un diplomate à Helsinki pour négocier la note finlandaise. Les Soviétiques ont déclaré que si nous les rejoignions, nous obtiendrons des terres perdues de notre passé. L'Occident nous a dit de ne pas nous incliner devant l'ours russe et de rester un État indépendant. L'Est a dit que nous devrions les rejoindre et être un ami éternel. Notre peuple a déclaré qu'il voulait être un État neutre et indépendant. Le monde nous regarde aujourd'hui, alors que déciderons-nous ?"
 notecrisis.5.a:0 "Nous deviendrons un allié de l'URSS."
 notecrisis.5.b:0 "Nous deviendrons une RSS pour l'URSS."
 notecrisis.5.c:0 "Nous ferons partie de l'URSS."
 notecrisis.5.e:0 "Nous serons toujours un État indépendant."

 notecrisis.6.t:0 "Les pourparlers d'Helsinki échouent"
 notecrisis.6.d:0 "Les Finlandais ont déclaré qu'ils ne s'inclineraient pas devant « l'ours russe » et qu'ils voulaient devenir un État neutre et indépendant. Cela ne correspond pas à nos projets et la solution diplomatique semble avoir échoué. Tout ce que nous pouvons faire, c'est une option militaire ou simplement laisser tranquille toute la crise des notes."
 notecrisis.6.a:0 "Laissez la crise des notes tranquille."
 notecrisis.6.b:0 "Une option militaire doit avoir lieu. Préparez les troupes."
 
 notecrisis.7.t:0 "Réformes soviéto-finlandaises"
 notecrisis.7.d:0 "Le gouvernement finlandais nous a accordé un accès militaire en Finlande. Ils ne semblent pas vouloir perdre une autre Seconde Guerre d'Hiver. Ils ont pris la bonne décision et il est maintenant temps de passer à l'étape suivante. Devrions-nous installer un État fantoche soviétique en Finlande, transformer la Finlande en RSS, les annexer complètement à l'URSS, ou simplement les laisser vivre et avoir notre accès militaire ?"
 notecrisis.7.a:0 "Envoyez un message à la Finlande à propos de la nouvelle République démocratique finlandaise."
 notecrisis.7.b:0 "Il est temps pour la Finlande de rejoindre les RSS. Envoyez-leur un message à ce sujet."
 notecrisis.7.c:0 "Annexer la Finlande à l'URSS."
 notecrisis.7.e:0 "Laissez-les tranquilles. L'accès militaire nous suffira."

 notecrisis.8.t:0 "L'Union Soviétique souhaite une Finlande communiste"
 notecrisis.8.d:0 "L'Union Soviétique a envoyé une nouvelle note nous demandant de former un nouveau gouvernement communiste. Nous serons la République démocratique finlandaise. Il y a un avantage à cela puisque nous serons alliés à l'URSS et que les Soviétiques nous ont même offert des terres qui nous ont été confisquées pendant la 1ère guerre d'hiver. Même si nous avons toujours été un pays neutre. Que ferons-nous ?"
 notecrisis.8.a:0 "Vive la République démocratique finlandaise !"
 notecrisis.8.b:0 "Nous sommes toujours un État neutre. Nous ne changerons pas."
 
 notecrisis.9.t:0 "La République démocratique finlandaise est formée !"
 notecrisis.9.d:0 "La Finlande a décidé de suivre un gouvernement communiste et a formé la République démocratique finlandaise. Nous avons déclaré qu'en tant que nation communiste, nous leur accorderions une partie des terres qu'ils avaient perdues auparavant. Nous avons 3 choix sur la façon de procéder. La Finlande pourrait récupérer ses terres de la guerre d'hiver en guise de compensation pour la formation d'un gouvernement communiste. Nous pourrions également leur donner leurs terres de l'époque où ils faisaient partie de l'Empire russe, ce qui ne leur donnerait pas autant de terres mais les rendrait quand même heureux. Nous ne pouvions pas non plus donner aucune de leurs terres à la Finlande et empêcher quiconque de les accepter."
 notecrisis.9.a:0 "Accordez-leur les terres qu'ils ont perdues pendant la guerre d'Hiver, que nous leur donnerions alors."
 notecrisis.9.b:0 "Accordez-leur les terres qu'ils possédaient dans le cadre de l'Empire russe."
 notecrisis.9.c:0 "Quelle terre a été promise ? Je pense que nous avons perdu le traité, eh bien."
 
 notecrisis.10.t:0 "La Finlande nie le gouvernement soviétique"
 notecrisis.10.d:0 "La République finlandaise a déclaré qu'elle souhaitait être un État neutre et indépendant. Cela va à l'encontre de nos plans avec la Note. Quelle devrait être notre prochaine démarche ?"
 notecrisis.10.a:0 "Nous devrons le faire par la force."
 notecrisis.10.b:0 "Formez un coup d'État."
 notecrisis.10.c:0 "Laissez-les tranquilles alors. Nous devons conserver l'accès militaire."
 
 notecrisis.11.t:0 "L'Union Soviétique souhaite que nous soyons une RSS"
 notecrisis.11.d:0 "L'URSS a demandé à les rejoindre en tant que RSS et soyons encore plus proches de l'URSS. Nous ferons partie de l'URSS et jouirons toujours d'une certaine autonomie. Les Soviétiques ont déclaré que la RSS serait plus grande que notre frontière actuelle. Nous serons cependant sous contrôle soviétique et certains conseillers craignent que toute culture finlandaise ne soit anéantie. Que faisons-nous ?"
 notecrisis.11.a:0 "Nous serons un RSS reconnaissant."
 notecrisis.11.b:0 "Nous sommes inquiets pour notre culture. La Finlande sera toujours finlandaise."
 
 notecrisis.12.t:0 "La Finlande refuse la RSS"
 notecrisis.12.d:0 "La République finlandaise a déclaré qu'elle souhaitait être un État neutre et indépendant. Cela va à l'encontre de nos plans avec la Note. Nous avons quelques options sur ce qu'il faut faire ensuite. Nous pourrions les satisfaire et permettre l'existence d'un État neutre et indépendant, ou nous pourrions essayer de le leur imposer. Quelle devrait être notre prochaine démarche ?"
 notecrisis.12.a:0 "Nous permettrons leur Etat indépendant."
 notecrisis.12.b:0 "Nous aurons alors une option militaire."
 notecrisis.12.c:0 "Formez un coup d'État contre les Finlandais."
 
 notecrisis.13.t:0 "La Finlande sera annexée"
 notecrisis.13.d:0 "Les Soviétiques espèrent nous annexer sous leur régime, comme nous l'étions sous l'Empire russe. Les Soviétiques y voient une opportunité de gagner davantage de terres et une zone stratégique sur l'Europe du Nord. Certains conseillers se demandent cependant si nous serons persécutés à cause de notre culture et si nous sommes toujours des parias de l'Est. Certains conseillers estiment que c'est un excellent moyen d'entretenir une amitié éternelle avec l'URSS. Que devons-nous faire à propos de cette note ?"
 notecrisis.13.a:0 "Nous serons heureux de nous joindre sous la bannière des travailleurs et des peuples soviétiques."
 notecrisis.13.b:0 "Nous n'effacerons pas notre pays. Nous choisirons la bonne décision."
 
 notecrisis.14.t:0 "La Finlande nie l'annexion"
 notecrisis.14.d:0 "Les Finlandais ont déclaré qu'ils ne verraient pas leur culture et leur mode de vie disparaître. Ils ont déclaré qu'il y aurait toujours un État indépendant pour le peuple finlandais. Ce n'est pas bien et va à l'encontre de nos plans. Le sentiment antisoviétique augmente chaque jour en Finlande. Que devons-nous faire ?"
 notecrisis.14.a:0 "Laissons la Finlande tranquille."
 notecrisis.14.b:0 "Nous devons protéger notre peuple soviétique en Finlande. Lancer une attaque."
 notecrisis.14.c:0 "Il est temps pour une révolution communiste."


 #####################'

 brazil.1.d: "La seconde moitié de la décennie a été frustrante pour le Brésil. Après avoir contribué à l'effort de guerre des Alliés, l'élite politique a le sentiment général que le géant sud-américain a été oublié par ses alliés du Nord. Tandis que les États-Unis injectaient de l'argent dans les économies des puissances perdantes, le Brésil ne parvenait pas à obtenir l'approbation de prêts qui ne correspondaient pas aux coûts de l'effort de guerre et, pire encore, son rival stratégique régional, l'Argentine, était de retour à Washington bien qu'il ait collaboré avec le régime nazi et hébergé des criminels de guerre qui s'étaient enfuis d'Allemagne. Ceci, combiné à une administration terne du général Eurico Gaspar Dutra, avec des exemples de simple mauvaise planification et gestion, la voie était ouverte pour le retour de l'ancien dictateur et « président de guerre » Getúlio Vargas, toujours populaire."

brazil.2.d: "Lacerda, l'un des principaux leaders de l'opposition sous l'administration Vargas, a lancé sa campagne pour la Chambre des députés. Comme il avait déjà été menacé, un groupe de partisans, des officiers de l'armée de l'air, ont assuré sa sécurité personnelle lors de ses rassemblements. Après un rassemblement organisé dans la nuit du 4 août 1954 dans la cour du Collège São José, le journaliste rentra chez lui avec son fils Sérgio, âgé de 15 ans, dans la voiture du major Rubens Florentino Vaz. Après être arrivés dans la rue Tonelero, une fois qu'ils sont tous sortis de la voiture pour faire leurs adieux, un homme armé est sorti de l'obscurité et a tiré sur le groupe à plusieurs reprises. Le major de l'armée de l'air Vaz a tenté de se défendre mais a reçu une balle dans la poitrine. Pendant ce temps, Lacerda s'est mis à l'abri avec son fils dans un garage adjacent et a riposté sur l'agresseur, qui s'est enfui dans un taxi. Sálvio Romeiro, un garde local qui a entendu les coups de feu, est venu enquêter mais a également été abattu ; il a cependant pu noter la plaque d'immatriculation du véhicule de secours.\n\n Lacerda s'en est sorti avec des blessures minimes, mais le major Vaz n'a pas eu autant de chance et est décédé le lendemain. L'enquête menée par la police a désigné le chef de la sécurité personnelle de Vargas, Gregório Fortunato, surnommé « L'Ange Noir », comme le cerveau de l'assassinat, et quelques jours plus tard, les autres suspects du meurtre ont été capturés, révélant que Benjamin, le frère de Vargas, était celui qui avait ordonné la tentative. L'événement a provoqué un choc et une indignation dans le pays, entraînant une augmentation massive de la force de l'opposition et une pression de l'armée pour la démission de Vargas. Le 22 août, 19 généraux signent un manifeste réclamant sa démission."
brazil.2.a: "Cela ne peut pas être bon..."

brazil.3.d: "Une fois de plus, les forces et les intérêts contre le peuple se sont coordonnés et se déchaînent à nouveau contre moi. Ils ne m'accusent pas, ils m'insultent ; ils ne me combattent pas, ils me calomnient et ils ne me donnent pas le droit de me défendre.\n\n Ils doivent étouffer ma voix et empêcher mon action, pour que je ne continue pas à défendre, comme je l'ai toujours défendu, le peuple et surtout les humbles.\n\n Je me suis battu mois après mois, jour après jour, heure après heure, résistant à une pression constante et incessante, endurant tout en silence, oubliant tout, renonçant à moi-même, pour défendre le peuple qui se retrouve désormais impuissant. Je ne peux rien te donner de plus que mon sang. Si les oiseaux de proie veulent le sang de quelqu'un, s'ils veulent continuer à sucer le sang du peuple brésilien, j'offre ma vie comme un holocauste.\n\n Je choisis cette façon d'être toujours avec toi. Lorsque tu seras humilié, tu sentiras mon âme souffrir à tes côtés. Lorsque la faim frappera à votre porte, vous ressentirez dans votre poitrine l'énergie nécessaire pour lutter pour vous et vos enfants. Lorsque vous serez vilipendé, vous ressentirez dans vos pensées la force de réagir. Mon sacrifice vous maintiendra unis et mon nom sera votre bannière de lutte. Chaque goutte de mon sang sera une flamme immortelle dans votre conscience et entretiendra la vibration sacrée de résistance. À la haine, je réponds par le pardon.\n\n Je me suis battu à coeur ouvert. La haine, l'infamie et la calomnie n'ont pas diminué mon moral. Je t'ai donné ma vie. Maintenant, je t'offre ma mort.\n\n Je n'ai peur de rien. Sereinement, je fais le premier pas sur le chemin de l'éternité..."
brazil.3.a:"...et je quitte la vie pour entrer dans l'Histoire."

brazil.5.d: "Lors d'une visite d'État en Italie, le président Machado se rendait au Saint-Siège au Vatican, lorsqu'une maladie soudaine l'a envahi. Il a été transporté d'urgence à l'hôpital, mais est décédé, identifié comme une crise cardiaque, à 21 h 43 le 26 décembre 1953. À sa place, le vice-président Altino Arantes assume la présidence jusqu'aux prochaines élections."
brazil.5.a: "Repose en paix, Président Machado."

brazil.6.d: "Le 6 avril 1950, un grave accident de train aux proportions considérables se produit. Plus d'une centaine de morts. La cause évoquée pour cet événement était que les eaux du fleuve avaient été détournées de leur lit naturel, se retrouvant très près de la tête de pont, provoquant ainsi une érosion. Le train connu sous le nom de « camping-car de nuit », composé de cinq wagons et d'une locomotive, est tombé dans la rivière Tanguá après l'effondrement du talus à la tête du pont ferroviaire en raison du fort courant de la rivière suite à de fortes pluies."

brazil.7.d: "La première chaîne de télévision d'Amérique latine a été inaugurée le 18 septembre 1950. PRF-3 alias TV Tupi, fondée par le journaliste et homme d'affaires Assis Chateaubriand, a commencé ses émissions à São Paulo, où la jeune actrice Sonia Dorce a ouvert la transmission avec la citation : « Bonsoir, la télévision brésilienne est à l'antenne », habillée en tupi-guarani, le logo et la marque de la chaîne, venant d'un long souhait de Chateaubriand d'utiliser les noms de la population indigène du Brésil. Dans ses oeuvres pour représenter les racines de la culture brésilienne. Proposant des dessins animés et des films étrangers ainsi que des documentaires éducatifs, la première chaîne d'information, Imagens do Dia, est arrivée dix jours plus tard, le 28 septembre, proposant de courts reportages enregistrés, avec une attention particulière sur les prochaines élections et la campagne de Getúlio Vargas."

brazil.8.d: "Le 6 avril 1952, une voiture Citröen noire a été retrouvée abandonnée sur la colline de Sacopã à Rio de Janeiro. À l'intérieur a été retrouvé le cadavre du banquier Afrânio Arsênio de Lemos, âgé de 31 ans, assassiné par trois coups d'arme de calibre.32. Aux côtés des affaires de la victime, du rouge à lèvres, des boucles d'oreilles et une photographie de Marina Andrade Costa, 18 ans. Parallèlement, des empreintes digitales ont été trouvées sur les lieux, mais celles-ci n'ont pu être attribuées à quelqu'un. Sans piste, le principal suspect s'est avéré être le lieutenant de l'armée Alberto Jorge Franco Bandeira, âgé de 23 ans, qui était le petit ami, Marina révélant avoir rompu avec Lemos peu de temps avant le crime, laissant croire à beaucoup que Bandeira l'avait assassiné pour un triangle amoureux. Même sans preuve personnelle, Bandeira a été condamné à 15 ans de prison, dont il n'a purgé que la moitié, pour ensuite être gracié et participer lui-même à un film sur l'affaire, en 1963."

brazil.9.d: "Le 4 mars à 8h40, un train de voyageurs bondé traversait lentement un pont sur la rivière Pavuna, près de la gare d'Anchieta, lorsqu'il a déraillé, projetant deux wagons en bois sur le côté sur la ligne adjacente. Presque immédiatement, un train de marchandises moderne à grande vitesse venant de la direction opposée est entré en collision avec les wagons en bois, passant sous la structure et poussant les wagons vers le haut. L'accident a été aggravé principalement par la surpopulation du train, fréquente dans les zones suburbaines, avec des passagers accrochés aux côtés, sous et entre les wagons. Un témoin affirme avoir vu « des passagers voler dans toutes les directions au moment de la collision ». Au total, 119 personnes ont été tuées et jusqu'à 250 ont été blessées. \n\n Le conducteur du train à vapeur a fui les lieux avec sa locomotive, qui a ensuite été retrouvée abandonnée quelques heures plus tard ; l'homme a été déclaré fugitif et n'a jamais été revu. La raison de sa disparition était une loi spécifique stipulant qu'un conducteur de train surpris sur les lieux d'un accident pouvait être détenu indéfiniment et sans caution."

brazil.10.d: "Le 23 mars 1953, le constructeur automobile allemand Volkswagen a ouvert sa première unité à São Paulo, après une campagne d'investissement du gouvernement dans l'industrie automobile au cours des dernières années. La marque a attiré l'attention de la population, avec ses prix abordables et ses designs charmants, notamment pour la Typ 1 « Beetle », surnommée affectueusement la Fusca au Brésil, qui vend déjà plusieurs unités."

brazil.11.d: "Il semble que la mort de Vargas n'ait pas encore fini de faire des vagues, même après un an. Peu après l'élection serrée de Juscelino Kubitschek, le mois de novembre a vu la nation au bord du chaos. Le colonel Jurandir Mamede a lancé un discours enflammé, déclarant que l'armée devrait empêcher les élus d'assumer, et a qualifié la démocratie de « farce ». Henrique Teixeira Lott, ministre de la Guerre, demanderait au président Carlos Luz, qui a assumé après que Café Filho ait subi une crise cardiaque et a été hospitalisé, d'arrêter Mamede, mais cela a été refusé, ce qui a éveillé les soupçons de Lott. Peu de temps après, il a démissionné de son poste et, sachant qu'un coup d'État se préparait, il s'est associé aux généraux Odílio Denys et Olympio Falconière pour organiser un contre-coup d'État. Le 11 novembre 1955, ils ordonnèrent à l'armée d'occuper la ville de Rio de Janeiro. En entendant cela, Carlos Luz, Carlos Lacerda et le colonel Mamede s'enfuient à bord d'un cuirassé pour tenter de déclencher le coup d'État. Après avoir été bombardé pendant deux jours et sans pouvoir rassembler de soutien, il se rendit rapidement. Alors que Luz a démissionné au terme du mandat le plus court de l'histoire du Brésil (3 jours) et que Lacerda a fui vers Cuba, Café Filho a repris ses fonctions de président par intérim le 21 après avoir quitté l'hôpital. Cependant, Lott était toujours méfiant et a convaincu le Congrès de le destituer, Nereu Ramos assumant la présidence par intérim et déclarant l'état d'urgence jusqu'au véritable transfert du pouvoir." 

brazil.12.d: "Le 10 février 1956, les officiers de l'armée de l'air Haroldo Veloso et José Chaves Lameirão volent un chasseur AT-11 et, rassemblant d'autres soldats de l'armée de l'air, déclenchent une révolte contre le président élu Kubitschek. Affirmant que JK reviendrait à la dictature de l'ère Vargas, ils se sont envolés pour Santarém, Pará, où les rebelles ont pris la ville et d'autres petites localités autour d'elle. La réponse du gouvernement étant confrontée à des difficultés pour faire face à la révolte, principalement à cause du refus de l'armée de l'air d'aider, la rébellion ne prendra fin qu'après 19 jours, avec la capture d'Haroldo Veloso le 29."

brazil.13.d: "Le 25 janvier 1958, le président déclare ouvertes les installations du réacteur AIE-R1, le premier réacteur nucléaire jamais construit au Brésil et en Amérique latine, construit en partenariat avec le gouvernement américain dans le cadre du programme Atoms for Peace, projeté et construit par Babcock and Wilcox Inc et construit au Brésil. Les principales applications du réacteur IEA-R1 sont la production de radio-isotopes à usage médical et la recherche fondamentale en physique nucléaire, en chimie nucléaire et en physique du solide, en mettant l'accent sur les techniques d'analyse par activation neutronique (NAA) ; une analyse solide grâce à l'étude des interactions hyperfines, à la neutronographie ou à la diffraction des neutrons ; ainsi que des études de base en physique nucléaire et des données nucléaires."

brazil.14.d: "Le matin du 2 décembre 1959, des soldats dirigés par Haroldo Veloso et João Paulo Burnier ont volé trois avions de transport C-47 remplis d'armes et d'explosifs à la base aérienne de Galeão, à Rio de Janeiro. Quelques heures plus tard, au-dessus de Bahia, un avion Constellation a été détourné par un officier, ce qui constitue le premier détournement d'avion dans l'histoire du Brésil. Ensuite, un groupe d'hommes a volé un Beechcraft D-18 à Belo Horizonte. La révolte appelée Aragarças avait commencé. Dirigés par des officiers mécontents de l'armée et de l'air, même dirigés par Veloso, qui avait participé à la précédente révolte de Jacareacanga en 1956, ils ont qualifié le gouvernement de faible et coopté par les communistes, affirmant que le président Kubitschek permettrait qu'une révolte communiste prenne le contrôle du pays, et ont appelé à l'établissement d'une dictature militaire dans le pays. Leur plan était de prendre le contrôle de plusieurs bases aériennes au-dessus du pays et de bombarder plusieurs bâtiments gouvernementaux, et que les militaires alignés sur l'UDN se joindraient à eux dans le coup d'État. Cependant, la grande majorité les a dénoncés, tant du côté pro que du côté anti-gouvernemental, et à peine 30 soldats ont rejoint la révolte. Le 4, le maréchal Lott a conduit une escouade de parachutistes à l'aéroport repris à Aragarças, Goiás, qui ont tiré sur la queue du C-47 et les bidons de carburant de la piste ont été incendiés. Les rebelles ont pris le reste des avions et ont fui vers l'Argentine, le Paraguay et la Bolivie, et les otages ont été libérés à Buenos Aires. La révolution ratée a été étouffée en seulement 36 heures sans faire une seule victime."

brazil.15.d: "Le 14 juin 1960, à 8 h 30, un train transportant la précieuse masse salariale des cheminots a été cambriolé à Japeri, Rio de Janeiro. Un groupe de criminels a volé le train appartenant au Réseau Ferroviaire Fédéral, volant une somme importante totalisant 27,598 millions de cruzeiros. Le vol a été largement remarqué par les médias et est rapidement devenu l'inspiration du film Assalto ao Trem Pagador, en 1962, considéré comme l'un des plus grands films de l'histoire du cinéma brésilien."
