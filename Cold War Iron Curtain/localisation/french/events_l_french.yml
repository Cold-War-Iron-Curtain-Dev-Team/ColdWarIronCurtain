 #election.1.t:0 "Election"
 #election.1.d:0 "Public #elections are being held, and the votes will soon be counted. All major parties are looking at one another to form up or antagonize in government. Who could possibly win?\n\n(Developer's note: The ruling party can defend its title if it has 20% popular support; another party can take over if they have 30% or more popular support. Should all parties have below 20%, the Ruling Party will also win.)"
 #election.1.o1:0 "The Communists won."
 #election.1.o2:0 "The Socialists won."
 #election.1.o3:0 "The Democrats won."
 #election.1.o4:0 "The Centrists won."
 #election.1.o5:0 "The Liberals won."
 #election.1.o6:0 "The Trotskyists won."
 #election.1.o7:0 "The Conservatives won."
 #election.1.o8:0 "The Neutrals won."
 #election.1.o9:0 "The Nationalists won."
 #election.1.o10:0 "The Fascists won."
 #election.1.o11:0 "The Islamists won."
 #election.1.o12:0 "The Ruling Party has won."
 #election.1.o13:0 "The Absolute Monarchists won."
 #election.1.o14:0 "The Maoists won."
 #election.1.o15:0 "The Radical Shiaists won."
 #election.1.o16:0 "The Liberal Conservatives won."
 #election.1.o17:0 "The Judaists won."
 #election.1.o18:0 "The Republicans won."
 #election.1.o19:0 "The Christian Democrats won."
 #election.1.o20:0 "The Democrats won."
 #election.1.o21:0 "The National Socialists won."
 #election.1.o22:0 "The Social Democrats won."
 #election.1.o23:0 "The Social Liberals won."
 #election.1.o24:0 "The Libertarians won."
 #election.1.o25:0 "The Salafists won."
 #election.1.o26:0 "The Christians won."
 #election.2.t:0 "Election: Public Opposes Rearmament"
 #election.2.d:0 "In the upcoming #election, support for [Root.GetRulingParty] is still high, the people having confidence in [Root.GetLeader]'s leadership. However, the party's pursuit of increasing [Root.GetName]'s focus on military matters has not been entirely popular with the public, with a significant segment of the citizens considering this ill-advised jingoism. War is yet to reach our border and few would like to see [Root.GetName] take aggressive action. Cooperating with other major parties who share our concerns for the safety of the nation, we will still be able to rule after the #election, albeit with diminished support."
 #election.2.a:0 "The people must be heard."
 #election.2.b:0 "Protecting our sovereignty comes first."
 #election.3.t:0 "Election: Public Demands Rearmament"
 #election.3.d:0 "The ongoing war approaching our borders has loomed over the upcoming #election, with many voters being concerned that [Root.GetName] is not prepared for being thrown into this conflict or whatever may arise from it. They demand we increase our precautions and ensure that our nation is ready for war. While the majority still support [Root.GetRulingParty], we may lose them to more radical elements if we don't alleviate their apprehensions."
 #election.3.a:0 "The people have the right to feel safe."
 #election.3.b:0 "Many are still in favor of diplomatic solutions."
 #election.4.t:0 "Election: Fascists in Government?"
 #election.4.d:1 "An aggressively nationalist sentiment has grown in [Root.GetName], giving rise to several parties promoting fascist ideals: a state enforcing its power through force. One of these in particular has won favor in the current #election, leading to discussions within the [Root.GetRulingParty] party about whether or not we should try to cooperate with them in forming our government. While they openly reject the democratic ideals that are the foundation of our state, the fact that they choose to participate in the #election itself lends some credibility to our views and acknowledging their public support may keep them away from taking violent action."
 #election.4.a:0 "Rather them than the communists!"
 #election.4.b:0 "A broad coalition of democratic parties is preferable."
 #election.5.t:0 "Election: Communists in Government?"
 #election.5.d:0 "The communist movement in [Root.GetName], fueled by broad dissatisfaction among the working class and radical trends among academics, has grown large enough to lead to the formation of several parties. After one of these has gained considerable support in the current #election, politicians in [Root.GetRulingParty] have started debating whether or not to seek their support in forming a government. Although they consider our democratic institutions to be little more than bourgeois tyranny, they seem eager to make the changes they want to see through cooperating with the government rather than overthrowing it."
 #election.5.a:0 "Rather reform than revolution!"
 #election.5.b:0 "A broad coalition of democratic parties is preferable."
 #election.6.t:0 "Election: Democratic Parties in Minority"
 #election.6.d:0 "Politics in [Root.GetName] have grown increasingly radicalized. Where there was once broad support for the parties which supported democratic ideals and [Root.GetName]'s representative institutions, more voters have turned to the political extremes in this #election. The parties in the political middle, even if they choose to set aside their differences, no longer form a majority. To avoid a weak minority government, we have no choice but to cooperate with either fascists or communists."
 #election.6.a:0 "We will work with the fascists to strengthen [Root.GetName]."
 #election.6.b:0 "Joining with the communists, we can facilitate social change."
 #election.6.c:0 "A minority government, although weak, is preferable."
 #election.7.t:0 "Fascists Influence Foreign Policy"
 #election.7.d:1 "Accepting the fascists into our political coalition has had an impact on our foreign policy. Despite their vehement nationalism, they have sympathizers abroad who approve of the influence they've been given in [Root.GetName]. Totalitarian governments of similar ideological leanings see us as potential allies. Maintaining ties to these nations, no matter the distaste [Root.GetRulingParty] may have for their ideals, may be necessary to retain the support of the fascists backing our government."
 #election.7.a:0 "We can use some allies against greater threats."
 #election.7.b:0 "With friends like that, we'd need no enemies."
 #election.8.t:0 "Communists Influence Foreign Policy"
 #election.8.d:0 "Communists often consider themselves to be part of an international revolution, and our choice to accept them as partners in our government has drawn the attention of many of their international allies. Representatives of communist parties maintain close ties to nations which have abandoned our form of government in favor of a dictatorship of the proletariat, ties which we may need to acknowledge in [Root.GetAdjective] foreign policy if we wish to retain their support."
 #election.8.a:0 "We should embrace our common causes."
 #election.8.b:0 "Down that path lies the dissolution of [Root.GetName] itself."
 #election.11.t:0 "Election: Fascist Majority"
 #election.11.d:0 "This #election has been devastating for the very institution it represents. The majority of the [Root.GetAdjective] population have cast their vote in favor of a fascist party that seeks to abolish #elections and install an autocratic ruler. While many consider taking up arms against this violation of the democratic ideals that allowed them this mandate to begin with, others consider the use of violence to only confirm their ideals further."
 #election.11.a:0 "It is a black day for [Root.GetName], but the people have spoken."
 #election.11.b:0 "We will not give up our liberty without a fight!"
 #election.12.t:0 "Election: Communist Majority"
 #election.12.d:0 "The current #election has resulted in victory for the communist parties, with mixed reactions from the former administration. While the new rulers claim to represent the people as a whole, they view many of the democratic institutions we cherish as attempts to manipulate and oppress the working class, leading to discussion about what truly constitutes a 'rule of the people'. In some nations, the revolution began in rivers of blood. In [Root.GetName] it didn't, but it may yet end in them."
 #election.12.a:0 "This is troubling, but they truly do represent the majority."
 #election.12.b:0 "We must stop them before they abolish every sign of dissenting thought!"
 #election.13.t:0 "Election: Magnate Favors Fascism"
 #election.13.d:0 "An influential industrialist behind one of the companies we have chosen to work with for our industrial production has recently made a number of statements on politics that members of the administration found troubling. He has openly advocated an authoritarian government and praised foreign administrations that identify as fascist, implicitly suggesting that [Root.GetName] would benefit from such rulership. Denouncing the magnate and his ideals might sour our relationship with the company, but leaving them unchecked would give him a platform for spreading propaganda that erodes all that [Root.GetRulingParty] stands for."
 #election.13.a:0 "He can say what he pleases, we need not endorse it."
 #election.13.b:0 "We cannot rely on fascists to develop and protect [Root.GetName]."
 #election.14.t:0 "Election: Wartime Exception"
 #election.14.d:0 "[Root.GetName] is in a state of war. Normally, an #election would be held at this time, but being in the midst of an important conflict many argue that cannot afford to spend time on political campaigning, or a change of leadership if that should come about. Meanwhile, others claim that declaring the ongoing war a valid reason for skipping #elections is the first step towards eroding [Root.GetAdjective] democracy. After all, letting military matters take precedence over the people's influence could be a slippery slope."
 #election.14.a:0 "Elections will be held as usual."
 #election.14.b:0 "We can take care of such matters when this war is through."
 #election.15.t:0 "Election: Government Contested"
 #election.15.d:0 "With an upcoming #election, people are beginning to question the capability of the current administration to pursue the ongoing war. [Root.GetName] has suffered greatly and popular opinion has turned against those who seem to be leading our nation to defeat. While our people are determined to see the war to the end, they would rather see another government ending it."
 #election.15.a:0 "This crisis of trust is highly unfortunate."
 #election.15.b:0 "Let the political landscape shift to keep the people united."
 #election.16.t:0 "[Root.GetLeader] Enjoys Public Support"
 #election.16.d:0 "With the present #election, the opposition, insofar as it exists, has criticized the increasingly authoritarian reign of [Root.GetRulingParty]. They question whether the electorate has any power at all, or if it's all just for show.\n\nHowever, the support for [Root.GetLeader] appears to remain high, and although the circumstances of the #election are questioned by international community, it has not been contested domestically. It appears that even if [Root.GetName] is no longer ruled by the people, the people support their ruler... at least the ones who made it to the ballots."
 #election.16.a:0 "One people, one leader."
 #election.17.t:0 "Election Results Questioned"
 #election.17.d:1 "Although the [Root.GetLeader] regime has strong-armed most of its opponents into silence, some have still spoken out about the recent #election, accusing the [Root.GetRulingParty] of rigging the results and ignoring the clear efforts to elect a parliament opposed to their policies.\n\nThe government brushes these objections aside as an effort to divide the people against itself. However, the fact remains that the majority of the people seem to have reservations about their rule, and the opposition, although silenced for now, has made its point."
 #election.17.a:0 "Splitters!"
 political.1.t:0 "Le communisme en hausse"
 political.1.d:0 "« Tandis que les travailleurs se soulèvent contre leurs oppresseurs partout dans le monde, ceux qui prétendent avoir acquis une conscience de classe en [Root.GetName] restent les bras croisés et attendent que le changement vienne d'un système politique si profondément corrompu que seule la révolution pourrait nous en sauver !\n\nAlors parlent de nouvelles voix dans le mouvement communiste [Root.GetAdjective]. Qualifiant le régime [Root.GetRulingParty] de dictature de la bourgeoisie, ils ont commencé à appeler à son retrait du pouvoir par tous les moyens nécessaires. Reste à savoir si ces moyens viendront de l'intérieur ou de l'extérieur."
 political.1.a:0 "Il se peut que certains membres du gouvernement lui-même soutiennent de telles idées."
 political.1.a.tt:0 "Augmente les chances de soutien interne à un coup d'État communiste."
 political.1.b:0 "Un mouvement pour le peuple doit rechercher le soutien du peuple."
 political.1.b.tt:0 "Augmente les chances de soutien populaire à un soulèvement communiste."
 political.2.t:0 "Sympathies marxistes au sein du gouvernement"
 political.2.d:0 "Bien que la ligne du parti [Root.GetRulingParty] soit de s'opposer fermement au socialisme révolutionnaire, en gardant un oeil vigilant sur les éléments radicaux de gauche du pays, certains membres du gouvernement sont plus ouverts à cette possibilité. Au moins, ils voient la possibilité de répondre aux préoccupations des gens qui se tournent vers les communistes pour trouver des solutions sans risquer une guerre civile à grande échelle.\n\nMême si elles peuvent être considérées comme des traîtres par ceux qui restent fidèles au [Root.GetLeader], ces voix dissidentes pourraient être celles qui assureront une transition relativement sans effusion de sang en cas de révolution."
 political.2.a:0 "Nous les surveillerons également de près, pour de nombreuses raisons."
 political.2.a.tt:0 "Si le soutien du public est suffisant, un coup d'État peut être exécuté."
 political.3.t:0 "Les communistes exécutent un coup d'État"
 political.3.d:0 "Alors que le mouvement populaire en faveur de la révolution communiste a été bruyant et terrifiant, une certaine partie du mouvement politique est restée largement silencieuse et en attente. L'attente est désormais terminée. Aujourd'hui, alors que la direction du [Root.GetRulingParty] et l'armée se préparaient à une révolte à l'échelle nationale, un certain nombre de responsables du gouvernement [Root.GetAdjective] ont rapidement placé [Root.GetLeader] en résidence surveillée et ont entamé des négociations avec les rebelles.\n\nTout en conservant un semblant de sauvegarde de l'ordre, les négociations ont en réalité consisté à garantir des positions au sein du nouvel État socialiste à ceux qui choisissaient de coopérer. Le coup d'État a été achevé avant que quiconque ait pu agir pour l'arrêter, et ceux qui l'auraient fait sont désormais emprisonnés, exilés ou exécutés par le nouveau régime."
 political.3.a:0 "Les marées de l'histoire balayeront le passé."
 political.4.t:0 "Les conflits de classes divisent [Root.GetName]"
 political.4.d:0 "Le mouvement révolutionnaire communiste, autrefois une frange populaire parmi les universitaires radicaux en théorie et les fauteurs de troubles dans la pratique, a bénéficié d'un soutien croissant au sein de la classe ouvrière [Root.GetAdjective]. Le fait qu'encore plus de gens choisissent de s'identifier à une « classe » implique que les idées marxistes se propagent au-delà de ceux qui cherchent activement à renverser le gouvernement.\n\n[Root.GetRulingParty] les membres déplorent cette évolution, aspirant à une époque où «[Root.GetAdjective]» serait ce que les gens identifiaient avant tout. Leurs inquiétudes ne sont pas sans fondement. On pourrait affirmer qu'une révolution est déjà en cours, à plusieurs niveaux de la société, et qu'il est peut-être trop tard pour l'arrêter."
 political.4.a:0 "Les gens peuvent s'appeler comme ils veulent."
 political.5.t:0 "Les soldats désertent face aux partisans communistes"
 political.5.d:0 "« Les capitalistes et les nationalistes voudraient que vous versiez votre sang pour eux sur la ligne de front, en montant frère contre frère dans des conflits qui ne concernent pas les travailleurs ! Au lieu de prendre les armes contre les travailleurs qui luttent à l'étranger, levez-les contre les oppresseurs et renversez les tyrans !\n\nL'armée, habituellement un bastion de patriotisme et de loyauté, n'est pas à l'abri de la propagande communiste qui se propage rapidement en [Root.GetName]. Les soldats désertent, refusant de se battre pour leur pays, allant parfois jusqu'à rejoindre des mouvements partisans qui prétendent préparer la révolution."
 political.5.a:0 "Peut-être se battent-ils simplement pour un [Root.GetName]différent."
 political.6.t:0 "La révolution [GetMonth]"
 political.6.d:0 "L'idée selon laquelle le mouvement communiste représente le peuple a certainement pris le vent en poupe en [Root.GetName], où le soutien du public au parti communiste a augmenté rapidement au cours des derniers mois. Mais ceux qui appellent à la révolution ne sont plus un groupe disparate de guérilleros et de syndicats mécontents. Le groupe à l'origine de l'appel à la révolte est suffisamment organisé pour former un gouvernement s'il réussit.\n\nNéanmoins, si la révolution commençait maintenant, elle pourrait difficilement être exécutée sans lancer [Root.GetName] dans la guerre civile. Les révolutionnaires devraient-ils risquer de déchirer la nation en deux pour satisfaire leur impatience, ou attendre une meilleure opportunité dans le futur ?"
 political.6.a:0 "Ceux qui souhaitent écrire l'histoire doivent agir aujourd'hui !"
 political.6.b:0 "La révolution est inévitable. L'inévitable peut attendre."
 political.7.t:0 "Le fascisme en hausse"
 political.7.d:1 "« Les [Root.GetAdjective] personnes ont été soumises trop longtemps à la règle incompétente du [Root.GetRulingParty]! Ils prétendent représenter le peuple, mais ne parviennent même pas à maintenir l'ordre dans nos rues ! Ce n'est qu'en les retirant du pouvoir que nous pourrons faire grandir cette nation !'\n\nLes orateurs fascistes du [Root.GetName] n'ont pas caché ce qu'ils pensent de notre gouvernement et de notre système politique actuels. Des discours comme ceux-ci ont exploité une dissidence publique particulièrement prononcée dans les sections les plus conservatrices de l'armée."
 political.7.a:0 "Les supérieurs peuvent entretenir des sympathies tacites."
 political.7.a.tt:0 "Augmente les chances de soutien interne à un coup d'État fasciste."
 political.7.b:0 "La jeune génération reprendra le flambeau."
 political.7.b.tt:0 "Augmente les chances de soutien populaire à un coup d'État fasciste."
 political.8.t:0 "Sympathies fascistes dans l'armée"
 political.8.d:1 "Plusieurs membres de haut rang de l'armée [Root.GetAdjective] ont exprimé leur soutien, certains en privé et d'autres ouvertement, au mouvement fasciste en [Root.GetName]. Ils estiment que les [Root.GetRulingParty] ont oublié l'importance de la force armée pour maintenir l'unité du pays et sont de plus en plus agacés par le fait que l'armée soit traitée par le gouvernement davantage comme un outil que comme l'une des institutions les plus importantes du pays. Certains d'entre eux vont jusqu'à suggérer qu'un nouveau gouvernement est nécessaire, un gouvernement qui sache comment mener [Root.GetName] la prochaine moitié du siècle.\n\nCette faction n'est peut-être pas majoritairement composée de politiciens, mais certains d'entre eux ont obtenu des postes au sein du ministère de la Défense. Si ces développements se poursuivent, ils pourraient bénéficier d'un soutien politique suffisant pour exécuter un coup d'État."
 political.8.a:0 "L'esprit national l'emporte sur le gouvernement."
 political.9.t:0 "Coup d'État fasciste"
 political.9.d:0 "Certains diront qu'ils l'ont vu venir. Tant ceux qui ont mis en garde contre les dangers du fascisme que ceux qui l'ont vanté comme le sauveur de [Root.GetName] ont vu leurs prophéties se réaliser aujourd'hui, alors que les militaires de [Root.Capital.GetName] ont renversé le gouvernement dirigé par [Root.GetRulingParty]et ont pris le pouvoir. [Root.GetLeader] sont portés disparus, la rumeur dit qu'ils seraient partis en exil, et le coup d'État a rencontré peu de résistance initiale.\n\nLa nouvelle direction des [Root.GetAdjective] n'a pas non plus l'intention de permettre à la résistance de se développer. La loi martiale a été déclarée et, compte tenu des changements en cours, il est peu probable que ce qui suivra soit très différent."
 political.9.a:0 "Il faut un État fort pour protéger les gens d'eux-mêmes."
 political.10.t:0 "Guerre civile pour le fascisme"
 political.10.d:1 "Même si les tentatives du mouvement fasciste visant à raviver le sentiment nationaliste ont connu un certain succès, la résistance contre ces idées reste élevée. Les généraux qui complotent pour renverser l'administration actuelle sont déçus du manque de confiance que la population [Root.GetAdjective] elle-même semble avoir dans [Root.GetFascistParty].\n\nIls restent convaincus que le peuple finira par se lasser du [Root.GetLeader], mais sont divisés sur la marche à suivre. Certains appellent à ce qu'un coup d'État soit exécuté maintenant, avant que les ennemis de [Root.GetName]n'agissent. Cependant, le faire alors que le soutien public est limité plongerait le pays dans la guerre civile."
 political.10.a:0 "La volonté de puissance n'a aucun sens si l'on hésite à s'en emparer."
 political.10.b:0 "Ils doivent d'abord unir le peuple, puis le gouverner."
 political.11.t:0 "Formulaire des divisions d'assaut fascistes"
 political.11.d:0 "Le politique et le martial ont toujours été étroitement liés dans le fascisme. Parallèlement à leur mouvement politique croissant, les partis fascistes ont commencé à former des organisations paramilitaires pour se protéger contre les menaces internes et externes, les menaces internes étant leurs opposants politiques. Même si de nombreuses personnes trouvent cette évolution inquiétante, la vague de fureur militariste a conduit à un nombre croissant de volontaires rejoignant nos forces armées.\n\nLes dirigeants politiques du mouvement ont souligné que leurs opposants avaient des raisons d'avoir peur. L'armée étant imprégnée à plusieurs niveaux d'éléments si explicitement politiques, les ennemis du [Root.GetName] et les ennemis du fascisme commencent à se ressembler beaucoup."
 political.11.a:0 "Seuls les traîtres à la patrie ont quelque chose à craindre."
 political.12.t:0 "La menace du communisme"
 political.12.d:0 "'[Root.GetLeader] voudrait vous faire croire que [Root.GetName] est en sécurité et uni. Il n'est pas surprenant que de tels mensonges aient empoisonné l'esprit de notre peuple, alors qu'un serpent s'enroule à côté ! Il suffit de regarder de l'autre côté de notre frontière pour voir des compatriotes se retourner les uns contre les autres au nom du communisme, déclarant la fin des nations. Combien de temps faudra-t-il avant qu'ils déclarent également notre nation morte ? Le [Root.GetRulingParty] nous protégera-t-il de cette menace ?\n\nLa croissance du mouvement fasciste en [Root.GetName] a été renforcée par la proximité de la révolution communiste. De nombreux modérés, qui pourraient normalement considérer le fascisme comme une autre expérience idéologique malavisée, trouvent que cela constitue également une préoccupation très réelle pour eux. S'ils avaient le choix entre le communisme de nos voisins et un régime fasciste, ils préféreraient certes ce dernier. Ils pourraient même être disposés à le soutenir activement."
 political.12.a:0 "Nous serons l'avant-garde contre la menace rouge !"
 political.13.t:0 "Vers la démocratie"
 political.13.d:0 "« Si nous faisons taire la voix du peuple, comment chacun d'entre nous peut-il prétendre être la voix de [Root.GetName] nous-mêmes ? Si nous craignons la dissidence, si nous craignons d'être publiquement dénoncés ou évincés par un vote public, ce que nous craignons réellement, c'est d'être haïs et injuriés par nos propres citoyens. Le [Root.GetRulingParty] a-t-il vraiment si peu confiance en ses principes ?\n\nUne faction prudente et peu organisée, mais passionnée, au sein du gouvernement, a commencé à faire pression en faveur de politiques moins répressives contre les ennemis de l'État. Ils veulent que le public soit impliqué dans la prise de décision par le biais de référendums et de réunions locales des partis, même si cela signifie risquer l'avenir de l'agenda actuel."
 political.13.a:0 "Nous pouvons en discuter en interne pour commencer."
 political.13.a.tt:0 "Augmente les chances d'obtenir un soutien interne pour l'organisation des élections."
 political.13.b:0 "Sachant que nous avons raison, nous pouvons nous permettre de permettre à nos ennemis de parler plus ouvertement."
 political.13.b.tt:0 "Augmente les chances que les gens expriment leur soutien à la démocratie et forment une opposition."
 political.14.t:0 "[Root.GetRulingParty] Débats Démocratie"
 political.14.d:0 "Étonnamment, l'appel à davantage de référendums et à des mesures moins répressives contre les opposants au régime a reçu un certain soutien dans les discussions internes au parti. Même si la direction du [Root.GetRulingParty] reste sceptique, plusieurs membres influents ont soutenu un changement.\n\nPeut-être sont-ils convaincus que peu de choses changeront dans la pratique, ou peut-être sont-ils secrètement des traîtres à la cause du parti, comme le prétendent nombre de leurs opposants. Quoi qu'il en soit, si l'opinion publique réclamait de tels changements, certains dirigeants des [Root.GetName] seraient prêts à faire des compromis."
 political.14.a:0 "Le choix n'est pas toujours entre la liberté et la mort."
 political.14.a.tt:0 "Le gouvernement peut organiser des élections lorsque la politique bénéficie du soutien de la majorité."
 political.15.t:0 "Formation de l'opposition démocratique"
 political.15.d:0 "L'assouplissement des restrictions sur le type de propagande anti-[Root.GetRulingParty] pouvant être diffusée publiquement a, comme on pouvait s'y attendre, conduit à une augmentation des expressions publiques de dissidence. Les manifestations organisées et les brochures se trouvent jusqu'à présent principalement dans les établissements universitaires et dans certaines des régions les plus malheureuses de [Root.GetName], mais il ne fait guère de doute que le mouvement s'étend.\n\nLes dirigeants du pays sont déchirés sur cette question. [Root.GetLeader], qui maintient une emprise de fer sur la direction du parti, n'a guère envie de diversifier le débat public. Toutefois, les premiers pas ont déjà été franchis et il n'y aura peut-être pas de retour en arrière."
 political.15.a:0 "Le mouvement semble se développer naturellement en l'absence de répression."
 political.16.t:0 "Appel public aux élections"
 political.16.d:0 "Les manifestations de dissidence publique, autrefois confinées à des zones limitées, sont désormais généralisées. Alors que les gens se rassemblent dans les rues, le [Root.GetRulingParty] se retrouve à la croisée des chemins. Si nous continuons à laisser cette propagande se propager, les référendums proposés tant au sein du parti lui-même que de l'opposition pourraient montrer que nous n'avons pas le soutien du public. L'unité à laquelle nous aspirons cède la place à une pluralité d'opinions, unies contre nous."
 political.16.a:0 "Même si des réformes sont en cours, nous devons montrer notre force en réprimant ce défi."
 political.16.b:0 "Que les gens soient entendus."
 political.17.t:0 "Élection publique en [Root.GetName]"
 political.17.d:0 "Alors que la liberté d'expression et de réunion est devenue de plus en plus acceptée en [Root.GetName], la faction au sein du [Root.GetRulingParty] appelant à la tenue d'élections est passée du statut de conspirateurs secrets à celui de réformateurs soutenus publiquement. Malgré les protestations des [Root.GetLeader], le pays a progressé lentement mais régulièrement vers la démocratie au cours des derniers mois et des élections semblent désormais être la prochaine étape naturelle.\n\nCependant, tous les citoyens des [Root.GetAdjective] ne sont pas favorables aux réformes démocratiques. Il y a encore un débat au sein du parti sur l'opportunité d'attendre la tenue des élections jusqu'à ce que nous puissions garantir un développement stable."
 political.17.a:0 "Les fidèles du [Root.GetRulingParty] soutiendront désormais la décision."
 political.17.b:0 "Les réformes ont besoin d'un soutien plus large avant la tenue d'élections."
 political.18.t:0 "Les fascistes réclament un référendum"
 political.18.d:1 "Le mouvement fasciste [Root.GetAdjective] en croissance rapide n'a jamais prétendu avoir besoin du soutien de la majorité avant de prendre le pouvoir, comptant sur l'unité de la nation sous sa direction une fois son pouvoir établi. Cependant, il semble que leur soutien public ait augmenté rapidement. De nombreux fascistes traitent désormais [Root.GetLeader] d'hypocrite, prétendant représenter les souhaits du peuple tout en faisant en réalité la sourde oreille aux masses.\n\nL'appel à un référendum a été rejeté jusqu'à présent comme une tentative typique de perturber le système par [Root.GetRulingParty] membres, mais au moins il s'agit d'une mesure politique. Si nous n'agissons pas maintenant, les fascistes pourraient choisir la lutte violente comme meilleure voie vers le pouvoir."
 political.18.a:0 "Supprimez ce mouvement haineux !"
 political.18.b:0 "Ne leur prêtez aucune attention."
 political.18.c:0 "Si le peuple le veut, nous organiserons le référendum."
 political.19.t:0 "Les communistes réclament un référendum"
 political.19.d:0 "Les idées marxistes ont pris racine il y a longtemps dans [Root.GetName], mais ont récemment gagné un soutien beaucoup plus large. Le mouvement s'est étendu au-delà de la théorie politique et s'est répandu dans la pratique politique, avec des travailleurs mécontents et même certaines célébrités de haut niveau exprimant leur soutien. Les communistes appellent cela la conscience de classe. Les [Root.GetRulingParty] appellent cela une voie rapide vers les émeutes et la trahison.\n\nMontrant peu de confiance dans la volonté des [Root.GetLeader] de mettre en oeuvre les réformes qu'ils exigent, les communistes les plus virulents ont appelé à un référendum immédiat pour destituer le gouvernement actuel. Même si nous parvenons peut-être à inverser l'élan de ce mouvement de masse, notre échec entraînera sans aucun doute la méthode communiste la plus populaire d'élimination : la révolution."
 political.19.a:0 "Les activités non[Root.GetAdjective] doivent être arrêtées !"
 political.19.b:0 "Ignorez-les, ils ne font que causer des ennuis."
 political.19.c:0 "Le référendum est préférable à une révolte sanglante."
 political.20.t:0 "Les démocrates réclament un référendum"
 political.20.d:0 "Il n'est pas surprenant que l'idée selon laquelle le peuple dirige la nation dans laquelle il habite puisse facilement devenir très populaire parmi la population. Le [Root.GetRulingParty], bien sûr, considère l'idée de démocratie telle que représentée par ces mouvements - liberté d'expression, élections publiques, presse libre - simplement une rhétorique populiste destinée à affaiblir le gouvernement du [Root.GetLeader].\n\nCependant, il est indéniable que ces idées se sont implantées parmi la population [Root.GetAdjective]. De manière véritablement démocratique, ils appellent à un référendum public sur le remplacement du régime actuel. Bien qu'actuellement faciles à ignorer, ces idées ont tendance à devenir très persistantes. Que nous arrivera-t-il si nous rendons impossible une révolution pacifique ?"
 political.20.a:0 "Rassemblez-les."
 political.20.b:0 "Procédez simplement comme d'habitude."
 political.20.c:0 "Si nous acceptons le référendum, nous pourrons peut-être préserver notre héritage."
 political.21.t:0 "Les fascistes marchent [Root.Capital.GetName]"
 political.21.d:0 "S'étant vu refuser leur référendum, qui était presque une tentative symbolique de s'emparer du pouvoir légalement, les fascistes ont utilisé leur important soutien public et leurs relations au sein de l'armée [Root.GetAdjective] pour tenter un coup d'État. Le gouvernement [Root.GetRulingParty] a refusé leurs conditions et affirme qu'il va se battre jusqu'au bout pour préserver le [Root.GetName] tel que nous le connaissons."
 political.21.a:0 "Nous les arrêterons à tout prix !"
 political.21.b:0 "Les fascistes portent le véritable esprit du [Root.GetName]!"
 political.22.t:0 "Les communistes se soulèvent"
 political.22.d:0 "Après que leur demande de référendum ait été rejetée, les quelques réformateurs du mouvement communiste en [Root.GetName] ont rapidement perdu leur influence au profit des éléments les plus radicaux. Avec le refus du [Root.GetRulingParty]de reconnaître le soutien de l'opinion publique aux réformes proposées, la vision romantique de la révolution s'est progressivement répandue et les dirigeants du mouvement sont devenus ceux qui pouvaient le plus facilement déclencher une émeute. Ces émeutes se sont transformées en une guerre civile à grande échelle, mettant en jeu l'avenir de la nation."
 political.22.a:0 "Nous ne leur permettrons pas de ruiner notre pays !"
 political.22.b:0 "Le feu de la révolution doit être éteint avec le sang des oppresseurs !"
 political.23.t:0 "Le printemps [Root.GetAdjective]"
 political.23.d:0 "Après le refus de leur tentative de référendum public pour instaurer la démocratie, les partisans de cette suggestion ont rejeté le régime [Root.GetLeader] comme étant incorrigible. Une large coalition de groupes rebelles, unis par leur objectif commun d'instaurer des systèmes politiques plus représentatifs au sein du [Root.GetName], ont pris les armes et ont annoncé qu'ils ne se reposeraient pas tant que le [Root.GetRulingParty] ne serait pas renversé."
 political.23.a:0 "Épargnez-nous de cette règle de la foule !"
 political.23.b:0 "Enfin, [Root.GetName] est gratuit !"
 political.24.t:0 "Les fascistes ridiculisés"
 political.24.d:0 "L'engouement du peuple [Root.GetAdjective] pour la fierté nationaliste et les tentatives de raviver les gloires du passé semble être révolu. Un réveil brutal pour ses ardents partisans, dont les uniformes, les postures militaristes et les discours excessifs font désormais plus souvent l'objet de moqueries que de sympathies.\n\nAutrefois considéré comme une menace pour la base du pouvoir [Root.GetRulingParty], le fascisme [Root.GetAdjective] est désormais de plus en plus considéré comme une position absurde et extrémiste et une attaque contre les valeurs les plus fondamentales de notre nation, la nation même qu'ils prétendent tenir en si haute estime. Le mot semble plus approprié comme insulte que comme désignation politique."
 political.24.a:0 "Quelle bande de clowns."
 political.25.t:0 "La mode communiste explose"
 political.25.d:0 "De nombreux communistes avaient prédit que [Root.GetName] serait la prochaine nation à succomber à la soi-disant révolution internationale, mais après quelques mois de grèves et de drapeaux rouges dans les rues, le mouvement semble s'être éteint. La classe ouvrière, la force motrice supposée de la révolution, a des préoccupations plus urgentes que le renversement du [Root.GetLeader] et ne semble décidément pas impressionnée par la façon dont ces révolutions se sont déroulées ailleurs. Pendant ce temps, les intellectuels qui ont écrit des appels passionnés à égorger les oppresseurs se sont révélés étonnamment réticents à susciter quoi que ce soit qui pourrait réellement perturber leur style de vie confortable.\n\nLes discussions sur la révolution continueront probablement, que ce soit à propos de bières bon marché ou de vins chers, mais ce ne seront probablement que des paroles et rien de plus."
 political.25.a:0 "Quelle bande d'hypocrites."
 political.26.t:0 "Le mouvement démocratique se tait"
 political.26.d:0 "Après quelques mois de vive opposition contre le régime des [Root.GetLeader], appelant à des élections publiques et à des lois plus libérales sur la liberté de réunion et d'expression, le mouvement semble s'être effondré. Les gens expriment désormais davantage d'inquiétude quant à la stabilité du [Root.GetName] si de telles réformes devaient avoir lieu, ceux qui réclament la démocratie étant davantage perçus comme des fauteurs de troubles que toute autre chose.\n\nPlus mystérieusement, de nombreuses figures de proue du mouvement semblent avoir disparu ou avoir soudainement arrêté leur travail. Peut-être que certains d'entre eux ont choisi de s'exiler lorsqu'ils ont constaté l'échec de leurs efforts. Quoi qu'il en soit, le gouvernement [Root.GetRulingParty] nie toute connaissance et toute implication."
 political.26.a:0 "Quelle bande de lâcheurs."
 political.27.t:0 "[Root.GetLeader] Abandonne la politique étrangère neutre"
 political.27.d_fascism:1 "Après la récente arrivée au pouvoir de [Root.GetRulingParty], [Root.GetLeader] a annoncé que [Root.GetName] ne maintiendrait plus sa politique étrangère neutre.\n« Le monde est devenu enchevêtré et complexe. Nous ne sommes plus en sécurité seuls. Nous devons nous tenir aux côtés de nos partenaires fascistes contre nos ennemis. Si nous ne choisissons pas un camp, nous périrons seuls."
 political.27.d_communism:0 "Après la récente arrivée au pouvoir de [Root.GetRulingParty], [Root.GetLeader] a annoncé que [Root.GetName] ne maintiendrait plus sa politique étrangère neutre.\n« Le monde est devenu enchevêtré et complexe. Ce pays a toujours défendu ses principes et s'est montré prêt à les défendre. Nous ne sommes plus en sécurité seuls. La neutralité n'est plus le refuge qu'elle était et ceux qui recherchent le pouvoir dans ce monde ne la respectent plus. Nous devons nous tenir aux côtés de nos frères communistes contre les puissances qui cherchent à nous opprimer. Contre la majorité bourgeoise qui ne veut rien d'autre que nous rabaisser. Si nous ne prenons pas position, nous périrons seuls."
 political.27.a:0 "Pour l'avenir de [Root.GetName]"
 political.28.t:0 "[Root.GetNameDef] Réunis"
 political.28.d:0 "La fin de la terrible guerre civile qui a dévasté notre pays touche à sa fin et nous sommes enfin parvenus à un accord politique. Nous sommes désormais d'accord avec nos concitoyens [Root.GetAdjective]et ensemble, nous reconstruirons notre grande nation. Les ennemis qui ont cherché à capitaliser sur nos luttes intestines doivent désormais faire face à un État uni [Root.GetAdjective].\n\nLe nouveau [Root.GetRulingIdeology] [Root.GetName] ne sera plus jamais divisé !"
 political.28.a:0 "Enfin unis !"
 political.29.t:0 "[Root.GetAdjective] Le monarchisme en hausse"
 political.29.d:0 "Les citoyens de [Root.GetName] sont de plus en plus fatigués des licenciements constants provoqués par les systèmes actuels et aspirent au changement. Pour cela, beaucoup se tournent vers le passé et vers la gloire que les monarchies apportaient autrefois aux nations. Alors que les citoyens ordinaires de la nation découvrent le soutien toujours croissant apporté à un monarque, beaucoup d'autres se tourneront également vers les notes de bas de page de l'histoire pour trouver des réponses à nos problèmes."
 political.29.a:0 "Peut-être que les hommes politiques se battront pour la monarchie."
 political.29.a.tt:0 "Augmente les chances de soutien interne pour une restauration de la monarchie."
 political.29.b:0 "Les citoyens de la nation restaureront probablement la couronne."
 political.29.b.tt:0 "Augmente les chances de soutien populaire à la restauration de la monarchie."
 political.30.t:0 "La marche [GetMonth] des monarchistes [Root.GetAdjective]"
 political.30.d:0 "Le prétendant au trône de [Root.GetAdjective] a rassemblé une armée de quelques milliers d'hommes et a pris d'assaut la capitale de [Root.GetName] plus tôt ce matin, exigeant qu'un référendum ait lieu pour décider de l'instauration ou non de la monarchie. Avec le soutien actuel à la monarchie proposée, il est peu probable que la population en général réagisse pacifiquement au rejet de cette exigence, et il est encore moins probable qu'elle soit prête à attendre."
 political.30.a:0 "Un référendum aura lieu."
 political.30.b:0 "Aucun monarque n'appartient à [Root.GetName]!"
 political.31.t:0 "Rencontre avec [Root.GetLeader]"
 political.31.d:0 "Le prétendant au trône [Root.GetAdjective] a rencontré [Root.GetLeader] et plusieurs hauts fonctionnaires du gouvernement pour discuter de l'avenir de la nation. Même si [Root.GetLeader] hésite à abandonner le pouvoir, ce n'est un secret pour personne que la population se lasse du système actuel. Le monarque [Root.GetAdjective] affirme que la volonté du peuple doit être réalisée pour la stabilité globale de la nation et que comme de nombreuses nations souhaitent nous voir s'effondrer, nous devons avoir un leader fort qui nous maintiendra unis et en sécurité."
 political.31.a:0 "Peut-être a-t-il raison."
 political.31.b:0 "Quelle bêtise ! Exilez-le immédiatement."
 political.32.t:0 "Monarque en quête"
 political.32.d:0 "Les intentions du prétendant au trône [Root.GetAdjective] ne pourraient être plus claires. Les discours et les rassemblements constants contre le statu quo gagnent du terrain plus rapidement que les politiciens ne peuvent résoudre les problèmes qui irritent la population. Si l'on veut que les systèmes actuels restent en place, beaucoup de choses doivent être résolues pour apaiser les tensions toujours croissantes dans le pays."
 political.32.a:0 "Seul un monarque peut véritablement unir une nation."
 political.33.t:0 "Augmenter le soutien au monarchisme"
 political.33.d:0 "Des rassemblements, des discours et des manifestations constants inondent les rues et remplissent les ondes, diffusant le message de ce que beaucoup espèrent être un avenir très proche. Le peuple ne peut pas exprimer plus clairement ses désirs : il veut une monarchie et est prêt à se battre pour elle. Ils attendent désormais la réponse du gouvernement [Root.GetAdjective]."
 political.33.a:0 "Il est indéniable que le changement est imminent."
 political.34.t:0 "L'autoritarisme dans [Root.GetName]"
 political.34.d:0 "Outre le monarchisme, d'autres idéologies de droite, telles que le nationalisme et le fascisme, ont gagné en popularité dans notre pays, quoique dans une bien moindre mesure que le monarchisme. Compte tenu de l'orientation qu'ont prise et continuent de prendre les idéologies de la population, nous devrions nous attendre à ce que cette tendance se poursuive."
 political.34.a:0 "Ces doctrines deviennent courantes."
 political.35.t:0 "La monarchie et l'establishment"
 political.35.d:0 "Bien que le soutien des citoyens au concept nouvellement fondé d'un monarque [Root.GetAdjective] ne soit plus surprenant, les politiciens soutenant ouvertement le mouvement le sont. Au fil des mois, de plus en plus de politiciens ont ouvertement exprimé leur désir d'avoir un monarque. Avec le soutien des hommes politiques du pays, les monarchistes [Root.GetAdjective] obtiennent désormais un soutien bien plus important pour leur cause."
 political.35.a:0 "La monarchie bénéficie désormais du soutien de l'establishment."
 THREAT_FROM_EFFECT:0 "Menace d'actions"
 war_justification.1.t:0 "[Root.GetLeader] Parle contre [From.GetName]"
 war_justification.1.d:1 "'Est-ce que [From.GetName] appartient au [From.GetAdjective]? Posons-nous une meilleure question : le futur appartient-il au [From.GetAdjective] ou appartient-il au [Root.GetNameDef]?'\n\n[Root.GetLeader]le discours d'aujourd'hui suggère que [Root.GetName] est sur la voie de la guerre. Les tensions politiques se sont accrues au cours du mois dernier et il semble que les [Root.GetAdjective] commencent à accepter que la guerre est inévitable."
 war_justification.1.a:0 "L'avenir appartient à [Root.GetName]!"
 war_justification.2.t:0 "[Root.GetLeader] Dénonce les idéaux [From.GetAdjective]"
 war_justification.2.d:1 "« Les [From.GetAdjective] prétendent avoir la liberté et la démocratie, prétendent vouloir la paix, mais toutes ces choses dont ils se targuent sont creuses. Leur démocratie divise le peuple là où il devrait être uni et leur liberté ne fait que trahir un manque de discipline. Nous, les [Root.GetAdjective], voyons clair dans ces mensonges... Et nous pouvons voir que cette paix, la paix selon leurs conditions, est également un mensonge.\n\n[Root.GetRulingParty] a longtemps ridiculisé la faiblesse de la nation [From.GetAdjective], mais dernièrement, la rhétorique est devenue plus agressive. Le jour du conflit armé se rapproche."
 war_justification.2.a:0 "[Root.GetName] est uni sous [Root.GetLeader]."
 war_justification.3.t:0 "[Root.GetLeader] Met en garde contre le communisme [From.GetAdjective]"
 war_justification.3.d:1 "« Existe-t-il une plus grande menace pour notre mode de vie, ou même pour le mode de vie lui-même, que le communisme ? Ce fléau qui menace de forcer les esclaves, et non les maîtres, à gouverner chaque nation, d'abolir la nation elle-même, d'abolir les peuples et leur histoire. Nous prendrons [From.GetName] et abolirons la peste communiste.\n\n[Root.GetLeader]la haine des communistes était bien connue avant l'arrivée au pouvoir des [Root.GetRulingParty], mais elle semble s'être intensifiée récemment dans le cas spécifique du gouvernement [From.GetAdjective]. Notre quête pour purger le marxisme de la surface de la Terre pourrait bien commencer là."
 war_justification.3.a:0 "Ceux qui rejettent les nations verront les leurs périr."
 war_justification.4.t:0 "[Root.GetName] Se prépare à la grande lutte"
 war_justification.4.d:1 "« Les [From.GetAdjective] sont un peuple qui ne se séparera pas facilement du pouvoir. Mais ils doivent aussi comprendre que la trajectoire de nos deux nations ne peut se terminer que par un affrontement. Nous devons nous armer pour la lutte à venir. Car [From.GetName] ne sera pas pris sans combat.\n\nLa possibilité d'un accord entre les gouvernements des pays [From.GetName] et [Root.GetName] partageant les mêmes idées a cédé la place à une campagne visant à prendre leur territoire par la force."
 war_justification.4.a:0 "L'histoire s'écrira à travers notre victoire."
 war_justification.5.t:0 "[Root.GetLeader] Apporte la révolution à [From.GetName]"
 war_justification.5.d:0 "« Même si nous avons consolidé la société socialiste en [Root.GetName], de nombreuses nations souffrent encore sous les despotes d'autrefois. Les travailleurs du [From.GetName] n'ont aucune voix, aucun moyen de s'organiser, et toute tentative d'instaurer le socialisme sera sauvagement écrasée par le régime du [From.GetLeader]. Nous ne pouvons pas attendre que les rouages de la révolution internationale tournent pour le peuple des [From.GetAdjective]. Avec la révolution, nous avons prouvé que nous pouvions écraser les oppresseurs capitalistes ici, et nous écraserons les oppresseurs également en [From.Capital.GetName] !'\n\n[Root.GetLeader] a abandonné toute tentative de rhétorique diplomatique envers le [From.GetRulingParty]contrôlé par le [From.GetName]. La quête visant à éradiquer toutes les frontières se concentre désormais strictement sur l'éradication de leurs frontières."
 war_justification.5.a:0 "[From.GetAdjective] travailleurs, votre libération est proche !"
 war_justification.6.t:0 "[Root.GetLeader] Appels à l'aide aux travailleurs [From.GetAdjective]"
 war_justification.6.d:0 "« Existe-t-il un plus grand mensonge que la prétendue liberté du peuple [From.GetAdjective] ? Là où ils travaillaient autrefois sous les princes et ducs qui revendiquaient la propriété du sol, ils sont désormais contraints de vendre leur travail à ceux qui revendiquent la propriété des usines. Leur liberté de choisir un maître plutôt qu'un autre peut difficilement être qualifiée de liberté. De même, leur liberté d'élire leurs dirigeants est un faux choix, car la propagande ne permettrait jamais aux vrais socialistes de prendre le pouvoir. Un peuple si profondément endoctriné ne peut être sauvé que par une intervention [Root.GetAdjective].\n\n[Root.GetLeader] a longtemps polémique contre le gouvernement en [From.GetName] lors des réunions du parti, mais cette rhétorique est désormais utilisée plus fréquemment en public. Il y a peu de raisons de croire que ce conflit puisse être résolu pacifiquement."
 war_justification.6.a:0 "Nous écraserons leur dictature bourgeoise !"
 war_justification.7.t:0 "[From.GetAdjective] L'échec du communisme"
 war_justification.7.d:0 "« Camarades, bien que les plus grands révolutionnaires aient été autrefois qualifiés de traîtres, il est devenu évident que la révolution elle-même a été trahie. Sinon, comment expliqueriez-vous le règne des [From.GetRulingParty] de [From.GetName], qui ont mis de côté toute trace d'idées marxistes pour construire un État ouvrier dégénéré où ils peuvent régner sur de fausses prémisses ? En renforçant leur propre pouvoir au prix de la révolution internationale, ils ont montré qu'ils se soucient peu des idéaux qu'ils prétendent défendre. Nous devons leur apporter la vraie révolution.\n\nBien qu'initialement favorable à la révolution [From.GetAdjective], [Root.GetLeader] a exprimé une déception croissante quant à la façon dont elle s'est développée. Les [Root.GetRulingParty] devront peut-être intervenir avant qu'il ne soit trop tard."
 war_justification.7.a:0 "Il est encore temps de sauver leur tentative de socialisme."
 war_justification.8.t:0 "[Root.GetLeader] Appels à écraser le nationalisme [From.GetAdjective]"
 war_justification.8.d:0 "« Existe-t-il une société plus répugnante à l'avenir de la révolution, plus étrangère au sort des travailleurs que le régime fasciste de [From.GetName]? Appelant le peuple à se consacrer fanatiquement à l'institution décrépite de l'État-nation, ils ont revêtu des méthodes de sauvagerie séculaires d'un costume moderne, essayant de se présenter comme un avenir alternatif à l'inévitable victoire internationale de la classe ouvrière. Ce n'est qu'une question de temps avant qu'ils ne frappent contre nous ou nos alliés. Frappons les premiers.\n\nPersonne n'attendait moins qu'un mépris mutuel entre nous et les [From.GetAdjective], mais l'animosité s'est intensifiée ces derniers temps. Il semble désormais que le conflit éclatera tôt ou tard."
 war_justification.8.a:0 "Mort aux fascistes !"
 war_justification.9.t:0 "La diplomatie avec [From.GetName] échoue"
 war_justification.9.d:0 "« Malgré nos tentatives pour trouver une solution diplomatique à notre conflit avec [From.GetName], les négociations ont une fois de plus échoué, nous laissant avec des options limitées. Le régime autoritaire [From.GetLeader] a fait preuve d'une approche déraisonnable sur cette question, typique des dirigeants qui ne rendent pas de comptes à leur peuple. À moins d'un revirement complet dans la politique des dirigeants des [From.GetAdjective], nous n'aurons d'autre recours que de nous battre.\n\n[Root.GetAdjective] l'intervention dans le [From.GetName] a été un sujet brûlant, certains politiciens de l'opposition affirmant que le [Root.GetRulingParty] a mené une politique belliciste depuis le début. Quelle que soit leur intention initiale, une guerre future semble soudain bien réelle et inévitable."
 war_justification.9.a:0 "Parfois, il faut gravir la montagne du conflit."
 war_justification.10.t:0 "[Root.GetLeader] Appels à intervention dans [From.GetName]"
 war_justification.10.d:0 "« C'est le coeur lourd que nous devons affronter la réalité de notre situation : une invasion de [From.GetName] pourrait être notre seul recours. Il existe un trop grand avantage stratégique pour tenter une autre solution dans la situation actuelle. Bien que nous soyons convaincus que ni les peuples [Root.GetAdjective] ni les peuples [From.GetAdjective] ne veulent la guerre, l'histoire nous a conduits à ce point et nos options sont limitées. Nous ne pouvons qu'espérer que grâce à cette affirmation de notre puissance militaire, nous pourrons éviter de nouvelles effusions de sang à l'avenir.\n\nBien qu'il s'agisse d'une théorie populaire selon laquelle les démocraties n'entrent pas en guerre contre d'autres démocraties, les développements récents suggèrent une invasion de [Root.GetAdjective] de [From.GetName] dans le futur. L'histoire pourrait encore nous surprendre."
 war_justification.10.a:0 "[From.GetName] est une démocratie douteuse de toute façon."
 war_justification.11.t:0 "[Root.GetLeader] Parle contre la menace rouge"
 war_justification.11.d:0 "« Sans aucun doute, le communisme [From.GetName] est l'une des plus grandes menaces à la liberté et à l'ordre de cette époque. Implacable et impitoyable, il menace de dévorer non seulement l'espoir du peuple [From.GetAdjective] d'une société prospère et démocratique, mais également celui de ses voisins. Si nous n'agissons pas maintenant, nous pourrions bien voir ce premier domino tomber trop tard, laissant derrière lui d'autres expériences sociales ratées. Combien d'autres doivent mourir avant que nous intervenions ?\n\nLa menace d'activités subversives portant atteinte à notre démocratie, alimentée par les ambitions [From.GetAdjective], est devenue récemment un sujet très débattu. Alors que les représentants de l'opposition ont qualifié cela de peur rouge visant à poursuivre la guerre avec le [From.GetName], la rhétorique du [Root.GetRulingParty] a jusqu'à présent connu un grand succès."
 war_justification.11.a:0 "Ils suivent une idéologie violente, à quelle réaction peuvent-ils s'attendre sinon de la violence ?"
 war_justification.12.t:0 "[Root.GetLeader] Affronte [From.GetAdjective] le fascisme"
 war_justification.12.d:0 "« Dans l'histoire moderne, peut-être même dans l'histoire dans son ensemble, il n'y a pas eu de pire tyrannie que la poigne de fer dans laquelle [From.GetRulingParty] tient désormais [From.GetName]. Les gens peuvent prétendre que nous ne devrions pas provoquer de conflits, que nous devrions faire confiance au [From.GetLeader] pour honorer les traités et les promesses à l'avenir, mais ces gens ne voient pas que les traités conclus sous le règne du fascisme sont inutiles. Pour ces menteurs déshonorants, la force donne raison, et le papier sur lequel un accord est écrit brûle aussi facilement que les livres de leurs détracteurs.\n\nCeux qui ont longtemps espéré éviter une confrontation directe avec le [From.GetName] se heurtent désormais à la forte opposition du [Root.GetLeader], qui soutient que nous, en termes machiavéliques, ne faisons que reporter la guerre au profit de l'ennemi. À ce rythme-là, nous pourrions finalement porter le premier coup."
 war_justification.12.a:0 "Il ne peut y avoir de paix à notre époque tant qu'ils ne disparaissent pas."
 war_justification.13.t:0 "[Root.GetLeader] Appels à la guerre contre [From.GetName]"
 war_justification.13.d:0 "« Même si nous sommes un peuple pacifique, notre nature ne détermine pas à elle seule le cours que nous devons suivre dans l'histoire. C'est une période de guerre. Depuis trop longtemps, les [From.GetAdjective] possèdent les moyens dont nous avons besoin pour traverser les épreuves auxquelles nous pouvons être confrontés, et il est évident qu'ils ne s'en sépareront pas pacifiquement. Malgré tous nos efforts pour construire un État moderne, certaines questions ne peuvent être réglées que par le biais d'anciennes épreuves de bataille.\n\n[Root.GetLeader]la rhétorique hostile de [From.GetName] s'est donné beaucoup de mal pour justifier une invasion. Une partie de la population soutient cette démarche, mais la décision appartient au pays de notre leader."
 war_justification.13.a:0 "C'est peut-être une décision difficile, mais nous devons la soutenir."
 war_justification.14.t:0 "[Root.GetLeader] Défis [From.GetAdjective] Prétentions"
 war_justification.14.d:0 "«[From.GetName] se pense peut-être plus moderne et avancé que nous, mais la vérité est que leur nation n'a pas été mise à l'épreuve comme la nôtre et qu'ils ne sont pas non plus préparés aux menaces qui se profilent désormais à l'horizon. Par leur mépris envers nous et en nous empêchant de nous emparer de ce qui nous revient de droit, ils ont fait de nous une de ces menaces contre eux-mêmes. Leur nation faible et divisée résistera difficilement à nos revendications.\n\nL'opinion moqueuse du [From.GetName] longtemps défendue par le [Root.GetRulingParty] est passée de la critique à l'hostilité. Même si l'opinion populaire est que le peuple [From.GetAdjective] veut éviter la guerre, le [Root.GetLeader] affirme que ses dirigeants élus l'ont provoquée par leur arrogance."
 war_justification.14.a:0 "Ils ne savent pas à quel point nos difficultés nous ont rendus forts."
 war_justification.15.t:0 "[Root.GetLeader] Veut rétablir l'ordre dans [From.GetName]"
 war_justification.15.d:0 "« L'esprit national [Root.GetAdjective] est fort, mais toutes les nations n'ont pas cette chance. [From.GetName] a vu ses traditions détruites et ses dirigeants légitimes assassinés et enterrés depuis longtemps, tout cela au nom de l'idée de la grande révolution marxiste. Il est de notre devoir de rétablir l'ordre dans ce monde égaré par des usurpateurs assoiffés de sang et d'affirmer la force du [Root.GetName] contre cette menace.\n\nAlors que le [Root.GetRulingParty] s'est toujours opposé au communisme, le [From.GetName] a été la cible d'attaques particulières dans les discours récents. Que l'attaque contre la nation [Root.GetAdjective] par les communistes soit ou non une menace réelle, l'attaque préventive contre le communisme [From.GetAdjective] est déjà en préparation."
 war_justification.15.a:0 "Ceux qui ont été assassinés pendant la révolution seront vengés !"
 war_justification.16.t:0 "[Root.GetLeader] Appele [From.GetAdjective] oppresseurs"
 war_justification.16.d:0 "« Mes adversaires voudraient vous faire croire que ma règle est comme celle du [From.GetRulingParty] dans [From.GetName]. Ils ne pourraient pas avoir plus tort. Alors que les succès des [From.GetLeader]sont le résultat d'une mode récente, d'un mouvement de masse destructeur déterminé à intimider les autres nations pour les amener à se soumettre, les [Root.GetRulingParty] s'opposent à ce mouvement en tant que ceux qui ne se soumettront pas. Je suis prêt à faire tout ce qui est nécessaire pour éliminer cette menace, même si cela signifie la guerre.\n\nLe régime [Root.GetLeader] a adopté une politique hostile envers la nation [From.GetAdjective]. Quel que soit le nom de nos dirigeants, fascistes est un mot réservé à nos ennemis."
 war_justification.16.a:0 "La tradition et le pragmatisme triompheront toujours du fanatisme et de la terreur."
 war_justification.17.t:0 "[Root.GetLeader] Questions [From.GetAdjective] Souveraineté"
 war_justification.17.d:0 "« Qui détermine les frontières d'une nation et comment sont-elles déterminées ? Quelle que soit la manière dont les gens ont pu trouver dans le passé pour justifier où se termine [Root.GetName] et où commence [From.GetName], nous vivons dans une nouvelle ère. L'importance stratégique de cette frontière ne peut être surestimée, et nous avons tout à fait le droit de la déplacer pour garantir la sécurité continue de notre population.\n\nÀ l'écoute des récents discours de [Root.GetLeader], une invasion de [From.GetName] semble imminente. Des voix dissidentes se sont opposées, mais le soutien du public à la guerre est en hausse."
 war_justification.17.a:0 "Nous devons nous rallier à cette cause !"
 war_justification.18.t:0 "[Root.GetLeader] Remet en question les motivations de [From.GetName]"
 war_justification.18.d:0 "« Il ne fait aucun doute que [From.GetName] se prépare à la guerre. Les changements de politique économique montrent clairement que les [From.GetAdjective] ne sont pas un peuple de paix, mais qu'ils attendent plutôt la bonne occasion pour nous attaquer. Allons-nous rester les bras croisés et les regarder s'armer pendant que [Root.GetName] n'est pas défendu ? Ou allons-nous désarmer cette menace avant qu'elle ne dépasse notre pouvoir ?\n\nLes faucons du [Root.GetRulingParty] ont tourné leurs yeux vers le [From.GetName], arguant que l'attaque est la meilleure défense. Leur point de vue gagne du terrain et le [Root.GetName] se prépare à la guerre."
 war_justification.18.a:0 "Au moins par la guerre, ce conflit mettra fin à ce conflit."
 war_justification.19.t:0 "[Root.GetLeader] Irrité par la posture [From.GetAdjective]"
 war_justification.19.d:0 "« Ces citoyens naïfs du [Root.GetName] qui imaginent le [From.GetAdjective] comme un peuple de paix sont totalement déconnectés de la réalité. Ceux qui vivent à notre frontière n'ont pas le luxe de se faire de telles illusions, voyant leurs troupes se rapprocher de nous juste de l'autre côté. C'est une menace que nous ne pouvons pas laisser sans réponse. Chaque jour qui passe, [From.GetName] se prépare à la guerre. Ce serait une folie de notre part de ne pas faire de même.\n\nLa présence militaire du [From.GetAdjective] à proximité de notre territoire suscite une inquiétude croissante, car cette nation apparaît de plus en plus comme l'ennemi du [Root.GetRulingParty]. Que ce soit la cause ou l'effet de leur polémique est un sujet de controverse."
 war_justification.19.a:0 "Quoi qu'il en soit, nous devons préparer le peuple à la guerre."
 war_justification.20.t:0 "[Root.GetLeader] Préconise l'invasion de [From.GetName]"
 war_justification.20.d:0 "« Si nous voulons avoir un avantage stratégique dans une guerre prévisible, pour ne pas dire inévitable, avec [From.GetName], il n'y a pas de place pour hésiter. Il s'agit de préserver l'avenir de nos enfants et de garantir que [Root.GetName] ait sa place dans le monde de demain. C'est une question de dévouement à notre cause et aux idéaux que nous tenons pour acquis. Il est temps d'agir.\n\nUne série de discours enthousiasmants des dirigeants des [Root.GetRulingParty], en particulier des [Root.GetLeader], ont appelé le public à soutenir une invasion des [From.GetName]. Les motivations géopolitiques derrière l'invasion sont moins présentes dans le discours sur les sentiments patriotiques, mais cette campagne semble très efficace pour convaincre le public de sa nécessité."
 war_justification.20.a:0 "La nation soutient cette décision importante."
 war_justification.201.t:0 "[From.GetLeader] Parle contre [Root.GetName]"
 war_justification.201.d:1 "'Est-ce que [Root.GetName] appartient au [Root.GetAdjective]? Posons-nous une meilleure question : le futur appartient-il au [Root.GetAdjective] ou appartient-il au [From.GetName]?'\n\n[From.GetLeader]le discours d'aujourd'hui suggère que [From.GetName] est sur la voie de la guerre. Les tensions politiques se sont accrues au cours du mois dernier et il semble que les [From.GetAdjective] aient accepté que la guerre soit inévitable. [Root.GetName] doit également se préparer."
 war_justification.201.a:0 "Pourquoi ne pouvons-nous pas vivre en paix ?"
 war_justification.202.t:0 "[From.GetLeader] Dénonce les idéaux [Root.GetAdjective]"
 war_justification.202.d:1 "« Les [Root.GetAdjective] prétendent avoir la liberté et la démocratie, prétendent vouloir la paix, mais toutes ces choses dont ils se targuent sont creuses. Leur démocratie divise le peuple là où il devrait être uni et leur liberté ne fait que trahir un manque de discipline. Nous, les [From.GetAdjective], voyons clair dans ces mensonges... Et nous pouvons voir que cette paix, la paix selon leurs conditions, est également un mensonge.\n\n[From.GetRulingParty] a longtemps ridiculisé la faiblesse de la nation [Root.GetAdjective], mais dernièrement, la rhétorique est devenue plus agressive. Le jour du conflit armé se rapproche."
 war_justification.202.a:0 "Comme prévu de la part d'une racaille fasciste comme [From.GetLeader]."
 war_justification.203.t:0 "[From.GetLeader] Met en garde contre le communisme [Root.GetAdjective]"
 war_justification.203.d:1 "« Existe-t-il une plus grande menace pour notre mode de vie, ou même pour le mode de vie lui-même, que le communisme ? Ce fléau qui menace de forcer les esclaves, et non les maîtres, à gouverner chaque nation, d'abolir la nation elle-même, d'abolir les peuples et leur histoire. Nous prendrons [From.GetName] et abolirons la peste communiste.\n\n[From.GetLeader]la haine des communistes était bien connue avant l'arrivée au pouvoir des [From.GetRulingParty], mais elle semble s'être intensifiée récemment dans le cas spécifique du gouvernement [Root.GetAdjective]. Notre quête pour purger le marxisme de la surface de la Terre pourrait bien commencer là."
 war_justification.203.a:0 "S'ils craignent notre cause, ils craignent leur propre peuple."
 war_justification.204.t:0 "[From.GetName] Se prépare à la grande lutte"
 war_justification.204.d:1 "« Les [Root.GetAdjective] sont un peuple qui ne se séparera pas facilement du pouvoir. Mais ils doivent aussi comprendre que la trajectoire de nos deux nations ne peut se terminer que par un affrontement. Nous devons nous armer pour la lutte à venir. Car [Root.GetName] ne sera pas pris sans combat.\n\nLa possibilité d'un accord entre les gouvernements des pays [Root.GetName] et [From.GetName] partageant les mêmes idées a cédé la place à une campagne visant à prendre leur territoire par la force."
 war_justification.204.a:0 "Qu'ils viennent !"
 war_justification.205.t:0 "[From.GetLeader] Apportez la révolution à [Root.GetName]"
 war_justification.205.d:0 "« Même si nous avons consolidé la société socialiste en [From.GetName], de nombreuses nations souffrent encore sous les despotes d'autrefois. Les travailleurs du [Root.GetName] n'ont aucune voix, aucun moyen de s'organiser, et toute tentative d'instaurer le socialisme sera sauvagement écrasée par le régime du [Root.GetLeader]. Nous ne pouvons pas attendre que les rouages de la révolution internationale tournent pour le peuple des [Root.GetAdjective]. Nous avons prouvé que nous pouvions écraser les oppresseurs capitalistes ici, et nous écraserons également les oppresseurs en [Root.Capital.GetName] !'\n\n[From.GetLeader] a abandonné toute tentative diplomatique avec notre gouvernement. La tâche communiste d'éradication de toutes les frontières se concentre désormais strictement sur l'éradication de nos frontières."
 war_justification.205.a:0 "[Root.GetLeader] est un meilleur dirigeant que n'importe quel opportuniste révolutionnaire !"
 war_justification.206.t:0 "[From.GetLeader] Appels à l'aide aux travailleurs [Root.GetAdjective]"
 war_justification.206.d:0 "« Existe-t-il un plus grand mensonge que la prétendue liberté du peuple [Root.GetAdjective] ? Là où ils travaillaient autrefois sous les princes et ducs qui revendiquaient la propriété du sol, ils sont désormais contraints de vendre leur travail à ceux qui revendiquent la propriété des usines. Leur liberté de choisir un maître plutôt qu'un autre peut difficilement être qualifiée de liberté. De même, leur liberté d'élire leurs dirigeants est un faux choix, car la propagande ne permettrait jamais aux vrais socialistes de prendre le pouvoir. Un peuple si profondément endoctriné ne peut être sauvé que par une intervention [From.GetAdjective].\n\nRefusant d'accepter que notre peuple puisse être satisfait sans ses expériences sociales, le régime communiste en [From.GetName] a ouvertement menacé d'attaquer notre nation. Il y a peu de raisons de croire que ce conflit puisse être résolu pacifiquement."
 war_justification.206.a:0 "Quel mérite leurs convictions peuvent-elles avoir s'ils doivent nous les imposer ?"
 war_justification.207.t:0 "[Root.GetAdjective] L'échec du communisme"
 war_justification.207.d:0 "« Camarades, bien que les plus grands révolutionnaires aient été autrefois qualifiés de traîtres, il est devenu évident que la révolution elle-même a été trahie. Sinon, comment expliqueriez-vous le règne des [Root.GetRulingParty] de [Root.GetName], qui ont mis de côté toute trace d'idées marxistes pour construire un État ouvrier dégénéré où ils peuvent régner sur de fausses prémisses ? En renforçant leur propre pouvoir au prix de la révolution internationale, ils ont montré qu'ils se soucient peu des idéaux qu'ils prétendent défendre. Nous devons leur apporter la vraie révolution.\n\nBien qu'initialement favorable à la victoire de [Root.GetRulingParty]en [Root.Capital.GetName], [From.GetLeader] s'est éloigné de la philosophie de [Root.GetLeader]. Le conflit s'est intensifié au point où ils se préparent à envahir pour nous imposer leur marque de socialisme."
 war_justification.207.a:0 "Ils ne comprennent pas ce que la révolution signifie pour le peuple [Root.GetAdjective]."
 war_justification.208.t:0 "[From.GetLeader] Appels à écraser le nationalisme [Root.GetAdjective]"
 war_justification.208.d:0 "« Existe-t-il une société plus répugnante à l'avenir de la révolution, plus étrangère au sort des travailleurs que le régime fasciste de [Root.GetName]? Appelant le peuple à se consacrer fanatiquement à l'institution décrépite de l'État-nation, ils ont revêtu des méthodes de sauvagerie séculaires d'un costume moderne, essayant de se présenter comme un avenir alternatif à l'inévitable victoire internationale de la classe ouvrière. Ce n'est qu'une question de temps avant qu'ils ne frappent contre nous ou nos alliés. Frappons les premiers.\n\nPersonne n'attendait moins qu'un mépris mutuel entre nous et les [Root.GetAdjective], mais l'animosité s'est intensifiée ces derniers temps. En entendant [From.GetLeader] parler, il semble que le conflit surviendra le plus tôt possible."
 war_justification.208.a:0 "Mort aux communistes !"
 war_justification.209.t:0 "La diplomatie avec [Root.GetName] échoue"
 war_justification.209.d:0 "« Malgré nos tentatives pour trouver une solution diplomatique à notre conflit avec [Root.GetName], les négociations ont une fois de plus échoué, nous laissant avec des options limitées. Le régime autoritaire [Root.GetLeader] a fait preuve d'une approche déraisonnable sur cette question, typique des dirigeants qui ne rendent pas de comptes à leur peuple. À moins d'un revirement complet dans la politique des dirigeants des [Root.GetAdjective], nous n'aurons d'autre recours que de nous battre.\n\n[From.GetAdjective] l'intervention dans nos affaires intérieures est un sujet brûlant, certains hommes politiques de l'opposition affirmant que le [From.GetRulingParty] a mené dès le départ une politique belliciste. Quelle que soit leur intention initiale, une guerre future semble soudain bien réelle et inévitable."
 war_justification.209.a:0 "Leur rhétorique condescendante ne nous intimidera pas."
 war_justification.210.t:0 "[From.GetLeader] Appels à intervention dans [Root.GetName]"
 war_justification.210.d:0 "« C'est le coeur lourd que nous devons affronter la réalité de notre situation : une invasion de [Root.GetName] pourrait être notre seul recours. Il existe un trop grand avantage stratégique pour tenter une autre solution dans la situation actuelle. Bien que nous soyons convaincus que ni les peuples [From.GetAdjective] ni les peuples [Root.GetAdjective] ne veulent la guerre, l'histoire nous a conduits à ce point et nos options sont limitées. Nous ne pouvons qu'espérer que grâce à cette affirmation de notre puissance militaire, nous pourrons éviter de nouvelles effusions de sang à l'avenir.\n\nBien qu'il s'agisse d'une théorie populaire selon laquelle les démocraties n'entrent pas en guerre contre d'autres démocraties, les développements récents suggèrent une invasion de [From.GetAdjective] de [Root.GetName] dans le futur. L'histoire pourrait encore nous surprendre."
 war_justification.210.a:0 "[From.GetName] est de toute façon une démocratie douteuse, qui mène des actions aussi agressives."
 war_justification.211.t:0 "[From.GetLeader] Parle contre la menace rouge"
 war_justification.211.d:0 "« Sans aucun doute, le communisme [Root.GetName] est l'une des plus grandes menaces à la liberté et à l'ordre de cette époque. Implacable et impitoyable, il menace de dévorer non seulement l'espoir du peuple [Root.GetAdjective] d'une société prospère et démocratique, mais également celui de ses voisins. Si nous n'agissons pas maintenant, nous pourrions bien voir ce premier domino tomber trop tard, laissant derrière lui d'autres expériences sociales ratées. Combien d'autres doivent mourir avant que nous intervenions ?\n\nLe mouvement ouvrier naissant a intimidé les dirigeants des [From.GetAdjective]. Alors que les représentants de leur opposition ont qualifié cela de peur rouge visant à poursuivre la guerre contre nous, la rhétorique des [From.GetRulingParty] a jusqu'à présent connu un grand succès."
 war_justification.211.a:0 "Tant qu'il y aura des profits à réaliser, les capitalistes fabriqueront une guerre."
 war_justification.212.t:0 "[From.GetLeader] Affronte [Root.GetAdjective] le fascisme"
 war_justification.212.d:0 "« Dans l'histoire moderne, peut-être même dans l'histoire dans son ensemble, il n'y a pas eu de pire tyrannie que la poigne de fer dans laquelle [Root.GetRulingParty] tient désormais [Root.GetName]. Les gens peuvent prétendre que nous ne devrions pas provoquer de conflits, que nous devrions faire confiance au [Root.GetLeader] pour honorer les traités et les promesses à l'avenir, mais ces gens ne voient pas que les traités conclus sous le règne du fascisme sont inutiles. Pour ces menteurs déshonorants, la force donne raison, et le papier sur lequel un accord est écrit brûle aussi facilement que les livres de leurs détracteurs.\n\nJaloux de la glorieuse société que nous construisons et de l'héritage sur lequel elle est fondée, les [From.GetAdjective] semblent prêts à déclencher une guerre pour la détruire. Voilà pour leurs prétentions à la paix."
 war_justification.212.a:0 "Inévitable. Mieux vaut en finir avec ça."
 war_justification.213.t:0 "[From.GetLeader] Appels à la guerre contre [Root.GetName]"
 war_justification.213.d:0 "« Même si nous sommes un peuple pacifique, notre nature ne détermine pas à elle seule le cours que nous devons suivre dans l'histoire. C'est une période de guerre. Depuis trop longtemps, les [Root.GetAdjective] possèdent les moyens dont nous avons besoin pour traverser les épreuves auxquelles nous pouvons être confrontés, et il est évident qu'ils ne s'en sépareront pas pacifiquement. Malgré tous nos efforts pour construire un État moderne, certaines questions ne peuvent être réglées que par le biais d'anciennes épreuves de bataille.\n\nDans un récent discours prononcé devant le peuple [From.GetAdjective], la rhétorique hostile à l'égard du [Root.GetName] s'est intensifiée et le [From.GetLeader] s'est donné beaucoup de mal pour justifier une invasion. Une partie de la population soutient cette démarche, mais la décision appartient au pays de son chef."
 war_justification.213.a:0 "Ils regretteront d'avoir fait de nous leur ennemi."
 war_justification.214.t:0 "[From.GetLeader] Défis [Root.GetAdjective] Prétentions"
 war_justification.214.d:0 "«[Root.GetName] se pense peut-être plus moderne et avancé que nous, mais la vérité est que leur nation n'a pas été mise à l'épreuve comme la nôtre et qu'ils ne sont pas non plus préparés aux menaces qui se profilent désormais à l'horizon. Par leur mépris envers nous et en nous empêchant de nous emparer de ce qui nous revient de droit, ils ont fait de nous une de ces menaces contre eux-mêmes. Leur nation faible et divisée résistera difficilement à nos revendications.\n\nL'opinion moqueuse du [Root.GetName] longtemps défendue par le [From.GetRulingParty] est passée de la critique à l'hostilité. Bien que l'opinion populaire soit que le peuple [Root.GetAdjective] veut éviter la guerre, le [From.GetLeader] prétend que nos dirigeants élus l'ont provoquée par leur arrogance."
 war_justification.214.a:0 "Les voix en faveur de la paix parmi le peuple [From.GetAdjective] sont bien entendu réduites au silence."
 war_justification.215.t:0 "[From.GetLeader] Veut rétablir l'ordre dans [Root.GetName]"
 war_justification.215.d:0 "« L'esprit national [From.GetAdjective] est fort, mais toutes les nations n'ont pas cette chance. [Root.GetName] a vu ses traditions détruites et ses dirigeants légitimes assassinés et enterrés depuis longtemps, tout cela au nom de l'idée de la grande révolution marxiste. Il est de notre devoir de rétablir l'ordre dans ce monde égaré par des usurpateurs assoiffés de sang et d'affirmer la force du [From.GetName] contre cette menace.\n\nAlors que le [From.GetRulingParty] s'est toujours opposé au communisme, le [Root.GetName] a été la cible d'attaques particulières dans les discours récents. Craignant la progression inévitable de leur nation vers la prochaine étape de l'histoire, une attaque préventive contre le communisme [Root.GetAdjective] est déjà en préparation."
 war_justification.215.a:0 "Il est trop tard pour inverser les progrès que nous avons réalisés."
 war_justification.216.t:0 "[From.GetLeader] Appele [Root.GetAdjective] oppresseurs"
 war_justification.216.d:0 "« Mes adversaires voudraient vous faire croire que ma règle est comme celle du [Root.GetRulingParty] dans [Root.GetName]. Ils ne pourraient pas avoir plus tort. Alors que les succès des [Root.GetLeader]sont le résultat d'une mode récente, d'un mouvement de masse destructeur déterminé à intimider les autres nations pour les amener à se soumettre, les [From.GetRulingParty] s'opposent à ce mouvement en tant que ceux qui ne se soumettront pas. Je suis prêt à faire tout ce qui est nécessaire pour éliminer cette menace, même si cela signifie la guerre.\n\nLe régime [From.GetLeader] a adopté une politique hostile envers la nation [Root.GetAdjective]. Nos projets visionnaires pour la grandeur future ont fait honte à leur nation et, sans surprise, ils se sentent menacés."
 war_justification.216.a:0 "S'ils veulent tester notre puissance, ils le regretteront."
 war_justification.217.t:0 "[From.GetLeader] Questions [Root.GetAdjective] Souveraineté"
 war_justification.217.d:0 "« Qui détermine les frontières d'une nation et comment sont-elles déterminées ? Quelle que soit la manière dont les gens ont pu trouver dans le passé pour justifier où se termine [From.GetName] et où commence [Root.GetName], nous vivons dans une nouvelle ère. L'importance stratégique de cette frontière ne peut être surestimée, et nous avons tout à fait le droit de la déplacer pour garantir la sécurité continue de notre population.\n\nÀ l'écoute des récents discours de [From.GetLeader], une invasion de [Root.GetName] semble imminente. Des voix dissidentes se sont opposées, mais le soutien du public à la guerre est en hausse."
 war_justification.217.a:0 "Le monde n'a-t-il rien appris de la Grande Guerre ?"
 war_justification.218.t:0 "[From.GetLeader] Remet en question les motivations de [Root.GetName]"
 war_justification.218.d:0 "« Il ne fait aucun doute que [Root.GetName] se prépare à la guerre. Les changements de politique économique montrent clairement que les [Root.GetAdjective] ne sont pas un peuple de paix, mais qu'ils attendent plutôt la bonne occasion pour nous attaquer. Allons-nous rester les bras croisés et les regarder s'armer pendant que [From.GetName] n'est pas défendu ? Ou allons-nous désarmer cette menace avant qu'elle ne dépasse notre pouvoir ?\n\nLes faucons du [From.GetRulingParty] ont tourné leurs yeux vers le [Root.GetName], arguant que l'attaque est la meilleure défense. Leur point de vue gagne du terrain et le [From.GetName] se prépare à la guerre."
 war_justification.218.a:0 "C'est exactement pourquoi nous devons être prêts."
 war_justification.219.t:0 "[From.GetLeader] Irrité par la posture [Root.GetAdjective]"
 war_justification.219.d:0 "« Ces citoyens naïfs du [From.GetName] qui imaginent le [Root.GetAdjective] comme un peuple de paix sont totalement déconnectés de la réalité. Ceux qui vivent à notre frontière n'ont pas le luxe de se faire de telles illusions, voyant leurs troupes se rapprocher de nous juste de l'autre côté. C'est une menace que nous ne pouvons pas laisser sans réponse. Chaque jour qui passe, [Root.GetName] se prépare à la guerre. Ce serait une folie de notre part de ne pas faire de même.\n\nNotre présence militaire à proximité du territoire [From.GetAdjective] suscite une inquiétude accrue, car ils interprètent nos mouvements de troupes comme une preuve d'intention hostile. Ils ne semblent guère avoir considéré que leur rhétorique agressive était la raison de nos mesures défensives."
 war_justification.219.a:0 "On peut difficilement désarmer après ces menaces."
 war_justification.220.t:0 "[From.GetLeader] Préconise l'invasion de [Root.GetName]"
 war_justification.220.d:0 "« Si nous voulons avoir un avantage stratégique dans une guerre prévisible, pour ne pas dire inévitable, avec [Root.GetName], il n'y a pas de place pour hésiter. Il s'agit de préserver l'avenir de nos enfants et de garantir que [From.GetName] ait sa place dans le monde de demain. C'est une question de dévouement à notre cause et aux idéaux que nous tenons pour acquis. Il est temps d'agir.\n\nUne série de discours enthousiasmants des dirigeants des [From.GetRulingParty], en particulier des [From.GetLeader], ont appelé le public à soutenir une invasion des [Root.GetName]. Les motivations géopolitiques derrière l'invasion sont moins présentes dans le discours sur les sentiments patriotiques, mais cette campagne semble très efficace pour convaincre le public de sa nécessité."
 war_justification.220.a:0 "Nous ferions mieux de nous préparer. La guerre viendra."
 war_justification.301.t:0 "[Root.GetLeader] Critiqué pour sa politique étrangère faible"
 war_justification.301.d:0 "« Nous avions l'occasion de frapper nos ennemis, mais les [Root.GetRulingParty] l'ont laissée passer. Non seulement il s'agit d'un autre cas accablant dans une série d'occasions manquées de renforcer la position des [Root.GetName]sur la scène internationale, mais c'est un signe que leur prétention d'agir dans l'intérêt du peuple [Root.GetAdjective] n'est pour l'essentiel qu'une rhétorique vide de sens. Il est temps de changer de politique.\n\nNotre échec à poursuivre la guerre que beaucoup attendaient a été la cible de critiques cinglantes de la part de nos opposants politiques. Si nous ne mettons pas à exécution nos plans militaires, il nous sera plus difficile de convaincre la population dans quelle direction nous nous dirigeons [Root.GetName]."
 war_justification.301.a:0 "Ne veulent-ils pas éviter la guerre ?"
 war_justification.301.b:0 "Il n'y a pas de place pour un désaccord public en dehors des réunions du parti."
 war_justification.301.c:0 "Nous ne pouvons pas permettre que les gens accusent [Root.GetLeader] de lâcheté !"
 cwu.311.d:0 "\nAlors que les espoirs de démocratie et de droits de l'homme en Hongrie s'éloignent, les États-Unis ont lancé un ultimatum à l'Union soviétique, appelant au retrait des troupes soviétiques de Hongrie, à la fin de leur occupation de la région et à la reconnaissance de la souveraineté de la Troisième République de Hongrie. Un tel ultimatum était inattendu, puisque les observateurs s'attendaient à ce que l'Amérique intervienne à titre de soutien, et non directement. Les Soviétiques n'ont pas encore réagi, mais les deux camps ont déjà commencé à évacuer leurs responsables et à déployer des troupes dans les régions frontalières du rideau de fer."
 cwu.312.d:0 "\nL'indépendance et la souveraineté de la nation hongroise ont été à nouveau restaurées. Le Kremlin a publié un communiqué selon lequel il a « retiré sans condition » ses troupes de Hongrie, mettant ainsi fin à leur occupation. Cela représente une victoire diplomatique majeure pour l'Amérique, non seulement ils ont fait de la Hongrie un nouvel allié, mais ils ont réussi à faire pression sur l'Union soviétique pour qu'elle se soumette. Pendant que Washington fait la fête, le Politburo prévoit une purge de son personnel diplomatique pour ses échecs. Les observateurs ont déclaré que cet événement est un signal d'alarme pour les autres nations sous influence soviétique, et ils prédisent la chute de l'URSS plus tôt que prévu si les Soviétiques ne parvenaient pas à assurer leur contrôle sur leurs dominions."
 cwu.313.d:0 "\nCraignant qu'un conflit militaire à grande échelle n'engloutisse à nouveau le monde, les États-Unis d'Amérique ont retiré leur ultimatum, affirmant que les révolutionnaires hongrois ne se consacrent à la démocratie que par commodité et qu'ils ont l'intention d'établir un régime dictatorial intrinsèquement antidémocratique. En réalité, l'Amérique craint une nouvelle guerre mondiale, puisque les Soviétiques développent rapidement leur arsenal nucléaire, et que s'ils l'utilisent, toute l'humanité sera perdue. Il s'agit d'une victoire diplomatique majeure pour les Soviétiques, car ils ont non seulement assuré leur sphère d'influence sur la Hongrie, mais ont involontairement permis à l'Amérique d'accepter leurs objectifs. Les observateurs estiment que l'Amérique a besoin d'une action décisive maintenant, sinon le communisme engloutira le monde, car la sécurité sous l'égide américaine est menacée." 
 cwu.314.d:0 "\nConstatant l'absurdité totale d'un tel ultimatum, l'Union soviétique a rejeté unilatéralement l'ultimatum, le qualifiant de simple bluff de la part des Américains et s'attendant à ce qu'ils ne répondent pas, car la petite Hongrie est considérée comme \"une perte acceptable\". Cependant, le destin a semblé tourner pour le pire, car les États-Unis ont pris leur ultimatum au sérieux et ont envoyé à leur Congrès la « Loi sur l'autorisation d'une action militaire contre l'Union soviétique ». La loi appelle à une action militaire directe et immédiate des États-Unis contre l'Union soviétique pour ses actes horribles en Hongrie, une loi qui a été adoptée et promulguée quelques heures seulement après avoir été soumise au Congrès. Les effets d'un tel acte ont déjà commencé à se manifester, Berlin étant assiégée par les deux forces et les divisions américaines affluant vers Berlin pour assurer le ravitaillement de sa garnison. À l'heure actuelle, il est clair que nous sommes dans une troisième guerre mondiale, avec une humanité au bord de l'effondrement."
 country_capitulated.0.t:0 "[GetNewspaperHeader][Root.GetName] a capitulé"
 country_capitulated.0.d_positive_both_no_faction:0 "\n[From.From.GetLeader] a annoncé que la nation lâche [Root.GetAdjective] ne pouvait plus résister à la pression de la présence écrasante des forces [From.From.GetAdjective] dans tout le pays. Le gouvernement [Root.GetAdjective] a choisi de fuir le pays et s'est exilé. Leurs forces principales ont capitulé et [From.From.GetName] contrôle désormais leur région d'origine.\nMême si la guerre continue ailleurs, c'est une grande victoire pour [From.From.GetName]."
 country_capitulated.0.d_positive_prev_no_faction:0 "\n[From.From.GetLeader] a annoncé que la nation lâche [Root.GetAdjective] ne pouvait plus résister à la pression de la présence écrasante des forces [From.From.GetAdjective] dans tout le pays. Le gouvernement [Root.GetAdjective] a choisi de fuir le pays et s'est exilé. Leurs forces principales ont capitulé et [From.From.GetName] contrôle désormais leur région d'origine.\nBien que la guerre contre ce qui reste du [Root.GetFactionName] se poursuive ailleurs, c'est une grande victoire pour le [From.From.GetName]."
 country_capitulated.0.d_positive_prev_faction:0 "\n[From.From.GetLeader] a annoncé que la nation lâche [Root.GetAdjective] ne pouvait plus résister à la pression de la présence écrasante des forces [From.From.GetAdjective] dans tout le pays. Le gouvernement [Root.GetAdjective] a choisi de fuir le pays et s'est exilé. Leurs forces principales ont capitulé et [From.From.GetName] contrôle désormais leur région d'origine.\nBien que la guerre contre ce qui reste des [Root.GetFactionName] se poursuive ailleurs, c'est une grande victoire pour l'ensemble des [From.From.GetFactionName]."
 country_capitulated.0.d_negative_both_no_faction:0 "\n[Root.GetLeader] a annoncé que la nation [Root.GetAdjective] ne pouvait plus résister à la pression des forces d'occupation [From.From.GetAdjective], commettant des parodies dans tout le pays. Le gouvernement [Root.GetAdjective] est parti en exil. Leurs forces principales ont capitulé et [From.From.GetName] contrôle désormais leur région d'origine.\nMalgré cette perte dévastatrice, la guerre contre le [From.From.GetName] est loin d'être terminée."
 country_capitulated.0.d_negative_prev_no_faction:0 "\n[Root.GetLeader] a annoncé que la nation [Root.GetAdjective] ne pouvait plus résister à la pression des forces d'occupation [From.From.GetAdjective], commettant des parodies dans tout le pays. Le gouvernement [Root.GetAdjective] est parti en exil. Leurs forces principales ont capitulé et [From.From.GetName] contrôle désormais leur région d'origine.\nBien que la guerre contre les [From.From.GetName] se poursuive, il s'agit d'un malheureux revers pour l'ensemble des [Root.GetFactionName]."
 country_capitulated.0.d_negative_prev_faction:0 "\n[Root.GetLeader] a annoncé que la nation [Root.GetAdjective] ne pouvait plus résister à la pression des forces d'occupation [From.From.GetAdjective], commettant des parodies dans tout le pays. Le gouvernement [Root.GetAdjective] est parti en exil. Leurs forces principales ont capitulé et [From.From.GetName] contrôle désormais leur région d'origine.\nBien que la guerre contre les [From.From.GetName] et le reste des [From.From.GetFactionName] se poursuive, il s'agit d'un malheureux revers pour l'ensemble des [Root.GetFactionName]."
 country_capitulated.0.d_neutral_both_no_faction:0 "\nLe gouvernement [Root.GetAdjective] est parti en exil et ses principales forces ont capitulé face au [From.From.GetName], qui contrôle désormais sa région d'origine.\n\nBien que les luttes entre [From.From.GetName] et [Root.GetName] soient terminées, [From.From.GetName] est toujours une guerre totale et les combats se poursuivent ailleurs."
 country_capitulated.0.d_neutral_prev_no_faction:0 "\nLe gouvernement [Root.GetAdjective] est parti en exil et ses principales forces ont capitulé face au [From.From.GetName], qui contrôle désormais sa région d'origine.\n\nLes luttes en [Root.GetName] ne représentaient qu'une petite partie du conflit. La guerre entre [From.From.GetName] et ce qui reste de [Root.GetFactionName] se poursuit ailleurs."
 country_capitulated.0.d_neutral_prev_faction:0 "\nLe gouvernement [Root.GetAdjective] est parti en exil et ses principales forces ont capitulé face au [From.From.GetName], qui contrôle désormais sa région d'origine.\n\nLes luttes entre [From.From.GetName] et [Root.GetName] ne représentaient qu'une petite partie du conflit. La guerre entre [From.From.GetFactionName] et ce qui reste de [Root.GetFactionName] se poursuit ailleurs."
 country_capitulated.0.a:0 "Excellente nouvelle !"
 country_capitulated.0.b:0 "Ce sont des temps sombres"
 country_capitulated.0.c:0 "Des temps incertains"
 islamist.29.t:0 "[Root.GetAdjective] L'islamisme en hausse"
 islamist.29.d:0 "Les citoyens de [Root.GetName] sont de plus en plus fatigués des licenciements constants provoqués par les systèmes actuels et aspirent au changement. Pour cela, beaucoup se tournent vers le passé et vers les gloires que l'Islam apportait autrefois aux nations. Alors que les citoyens ordinaires de la nation découvrent le soutien toujours croissant à la charia, beaucoup d'autres se tourneront également vers les notes de bas de page de l'histoire pour trouver des réponses à nos problèmes."
 islamist.29.a:0 "Peut-être que les politiciens se battront pour la foi."
 islamist.29.a.tt:0 "Augmente les chances de soutien interne au régime islamiste."
 islamist.29.b:0 "Les citoyens de la nation restaureront probablement la couronne."
 islamist.29.b.tt:0 "Augmente les chances de soutien populaire au régime islamiste."
 islamist.30.t:0 "La [GetMonth] marche des [Root.GetAdjective] islamistes"
 islamist.30.d:0 "Le principal religieux de [Root.GetName] a rassemblé une armée de quelques milliers d'hommes et a pris d'assaut la capitale de [Root.GetName] plus tôt ce matin, exigeant qu'un référendum ait lieu pour décider d'instaurer ou non la charia. Avec le soutien actuel au projet d'État proposé, il est peu probable que la population en général réagisse pacifiquement au rejet de cette demande, et il est encore moins probable qu'elle soit prête à attendre."
 islamist.30.a:0 "Un référendum aura lieu."
 islamist.30.b:0 "Aucune religion d'État n'a sa place en [Root.GetName]!"
 islamist.31.t:0 "Rencontre avec [Root.GetLeader]"
 islamist.31.d:0 "Le principal religieux de [Root.GetName] a rencontré [Root.GetLeader] et plusieurs hauts responsables gouvernementaux pour discuter de l'avenir de la nation. Même si [Root.GetLeader] hésite à abandonner le pouvoir, ce n'est un secret pour personne que la population se lasse du système actuel. Le religieux [Root.GetAdjective] affirme que la volonté du peuple doit être réalisée pour la stabilité globale de la nation et que comme de nombreuses nations souhaitent nous voir s'effondrer, nous devons avoir un leader fort qui nous maintiendra unis et en sécurité."
 islamist.31.a:0 "Peut-être a-t-il raison."
 islamist.31.b:0 "Quelle bêtise ! Exilez-le immédiatement."
 islamist.32.t:0 "Clerc en quête"
 islamist.32.d:0 "Le principal religieux de [Root.GetName] ne pourrait pas être plus clair. Les discours et les rassemblements constants contre le statu quo gagnent du terrain plus rapidement que les politiciens ne peuvent résoudre les problèmes qui irritent la population. Si l'on veut que les systèmes actuels restent en place, beaucoup de choses doivent être résolues pour apaiser les tensions toujours croissantes dans le pays."
 islamist.32.a:0 "Seul un religieux peut véritablement unir une nation."
 islamist.33.t:0 "Accroître le soutien à l'islamisme"
 islamist.33.d:0 "Des rassemblements, des discours et des manifestations constants inondent les rues et remplissent les ondes, diffusant le message de ce que beaucoup espèrent être un avenir très proche. Le peuple ne peut pas exprimer plus clairement ses désirs : il veut un État islamique et est prêt à se battre pour cela. Ils attendent désormais la réponse du gouvernement [Root.GetAdjective]."
 islamist.33.a:0 "Il est indéniable que le changement est imminent."
 islamist.34.t:0 "L'autoritarisme dans [Root.GetName]"
 islamist.34.d:0 "Outre l'islamisme, d'autres idéologies de droite, telles que le nationalisme et le fascisme, gagnent en popularité dans notre pays, quoique dans une bien moindre mesure que l'islamisme. Compte tenu de l'orientation qu'ont prise et continuent de prendre les idéologies de la population, nous devrions nous attendre à ce que cette tendance se poursuive."
 islamist.34.a:0 "Ces doctrines deviennent courantes."
 islamist.35.t:0 "L'islamisme et l'establishment"
 islamist.35.d:0 "Bien que le soutien des citoyens au concept nouvellement fondé d'un État islamique [Root.GetAdjective] ne soit plus surprenant, les politiciens soutenant ouvertement le mouvement le sont. Au fil des mois, de plus en plus de politiciens ont ouvertement exprimé leur désir d'un État islamique. Avec le soutien des hommes politiques du pays, les islamistes [Root.GetAdjective] obtiennent désormais un soutien bien plus important pour leur cause."
 islamist.35.a:0 "L'islamisme bénéficie désormais du soutien de l'establishment."
