 RAC_POL.2.t:0 "[GetNewspaperHeader]Guerre raciale"
 RAC_POL.2.da:0 "GAGNEZ LA GUERRE DES RACES ! ENVOIE L'ARMÉE ! (650 PAGES)"
 
 WOM_POL.2.t:0 "[GetNewspaperHeader]Manifestations pour les droits des femmes"
 WOM_POL.2.d:0 "La capitale a été paralysée aujourd'hui alors que des milliers de personnes sont descendues dans la rue pour protester en faveur de davantage de droits pour les femmes. Les manifestants affirment que le gouvernement a longtemps négligé le rôle que jouent les femmes dans la société et que l'absence de réformes finit par affaiblir la nation et laisse les femmes vulnérables. Le succès de la manifestation a également inspiré des événements similaires dans d'autres villes. Les manifestants ont également menacé d'élargir leurs actions pour inclure des actions plus directes afin de faire pression sur le gouvernement pour qu'il prenne leurs revendications au sérieux.\n\nLa seule manière d'arrêter les manifestations est de revenir sur la récente législation ou d'attendre que les manifestations soient réprimées."
 
 SAGA_POL.2.t:0 "[GetNewspaperHeader]Marches pour les droits de la SAGA"
 SAGA_POL.2.d:0 "Dans un développement révolutionnaire, les citoyens se sont rassemblés pour marcher pour la reconnaissance des droits de la SAGA. Les membres de cette communauté souvent négligée et opprimée se sont réunis avec leurs alliés pour faire pression sur le gouvernement afin qu'il agisse et modernise les lois sur cette question. La marche a eu lieu dans la capitale. Elle est saluée comme un succès et s'est déroulée dans une large mesure dans le calme. Cependant, une contre-marche organisée à proximité par des opposants estimant que l'État ne devrait pas faire de compromis sur la moralité ou les sentiments de la majorité. Ces contre-manifestations étaient plus petites que la marche principale. Dans d'autres grandes villes et villages, il est prévu d'organiser d'autres marches afin de montrer combien de personnes seraient affectées par les changements législatifs ou politiques sur cette question.\n\nLa seule manière d'arrêter les manifestations est de revenir sur la récente législation ou d'attendre que les manifestations soient réprimées."
 
 UNION_POL.1.t:0 "[GetNewspaperHeader]Grève générale nationale"
 UNION_POL.1.d:0 "Une grève générale est observée dans tout le pays par les travailleurs furieux de la nouvelle politique gouvernementale qui réduit les droits des travailleurs. Les opposants accusent le gouvernement d'être racheté par les employeurs et les propriétaires qui cherchent à exploiter les travailleurs pour obtenir de nouveaux profits. Outre les travailleurs de l'industrie et des services, de nombreux magasins des principaux marchés ont également fermé leurs portes par solidarité. Un porte-parole du gouvernement a qualifié la grève de geste faible et a insisté sur le fait que les actions du gouvernement conduiraient à une croissance économique accrue et bénéficieraient en fin de compte aux travailleurs. Malgré son visage courageux, le gouvernement est certainement ébranlé par la réaction agressive des travailleurs à la nouvelle politique.\n\nLa seule façon d'arrêter les protestations est de revenir sur la récente législation ou d'attendre que les grévistes soient brisés."
 
 REL_POL.1.t:0 "[GetNewspaperHeader]Répression religieuse massive"
 REL_POL.1.d:0 "Les responsables religieux travaillant avec les forces de sécurité veillent au respect des préceptes religieux imposés par le gouvernement. Le gouvernement prétend que la force de la nation réside dans la conformité des citoyens aux véritables pratiques de la foi. Ces efforts ont vu certaines communautés faire face à un examen minutieux pour leur manque de conformité. Les religions minoritaires sont confrontées à des restrictions sur la façon dont elles se présentent publiquement, les forces de sécurité retirant de force les pancartes ou publicités jugées incompatibles avec la politique actuelle. Certaines communautés ripostent, avec des rapports faisant état d'affrontements majeurs, car on craint que les actions du gouvernement ne visent à détruire les identités régionales et des siècles de pratiques religieuses. Dans d'autres régions, des foules de partisans enthousiastes du gouvernement forcent violemment l'obéissance de leurs voisins, conduisant à des scènes de pillages et d'intenses violences.\n\nLa seule façon de mettre fin à la violence est d'accepter un cessez-le-feu ou d'attendre que les païens soient envoyés en enfer."
 REL_POL.1.c:0 "Refuser les demandes"
 REL_POL.4.t:0 "[GetNewspaperHeader]Répression religieuse massive"
 REL_POL.4.d:0 "Les forces de sécurité à travers le pays ont déplacé et saisi des lieux de culte et des biens appartenant à des groupes religieux à travers le pays. Ils veillent à ce que les nouvelles politiques gouvernementales soient mises en oeuvre avec une interférence minimale de la part de ce qu'ils appellent des fanatiques religieux. De nombreux chefs religieux sont également détenus pour mieux faire évoluer la population vers une compréhension plus pragmatique et matérielle du monde. Cependant, cette répression musclée n'a pas abouti, car de nombreux citoyens religieux se sont affrontés aux forces de sécurité, exigeant qu'elles évacuent les propriétés saisies et qu'elles libèrent leurs dirigeants. Dans plusieurs cas, les affrontements ont amené la police à tirer sur la foule pour la disperser. Dans d'autres régions du pays, des bâtiments et des véhicules gouvernementaux sont pillés ou incendiés par ceux qui sont offensés par la nouvelle politique. Beaucoup voient la nouvelle politique comme une menace pour l'identité du peuple et son patrimoine. Le gouvernement déploie déjà davantage de forces alors que des rumeurs courent selon lesquelles l'armée pourrait éventuellement devoir rétablir l'ordre.\n\nLa seule façon de mettre un terme à la violence est d'accepter un cessez-le-feu ou d'attendre que les fanatiques soient tués."
 REL_POL.4.c:0 "Refuser les demandes"
 REL_POL.2.t:0 "[GetNewspaperHeader]Émeutes religieuses massives"
 REL_POL.2.d:0 "La nouvelle initiative gouvernementale restreignant les privilèges et le statut des religions minoritaires a enflammé les membres de ces confessions et leurs partisans à travers le pays. Des foules de manifestants ont été confrontées à des partisans de l'initiative gouvernementale, ce qui a donné lieu à de violents affrontements de rue et à des émeutes ouvertes dans les grandes villes du pays. Les opposants à cette politique accusent le gouvernement de se livrer au sectarisme et à la persécution. Les partisans du gouvernement affirment que la nouvelle politique reflète les sentiments du grand public et que la majorité ne peut pas être dictée. Un porte-parole du gouvernement a appelé au calme des deux côtés, mais a déclaré que le gouvernement restait attaché à sa nouvelle politique. Jusqu'à présent, plusieurs quartiers importants ont été gravement endommagés par les violences et les émeutes.\n\nLa seule façon d'arrêter les émeutes est d'accepter de revenir sur notre législation ou d'attendre que les hérétiques se rendent compte de leurs erreurs."
 REL_POL.2.c:0 "Refuser les demandes"
 REL_POL.3.t:0 "[GetNewspaperHeader]Manifestations pour les droits religieux"
 REL_POL.3.d:0 "Beaucoup ont participé aux manifestations organisées à travers le pays pour réclamer une plus grande tolérance religieuse et plus de laïcité dans l'État. Les manifestants venaient de divers groupes et communautés. Une plus grande tolérance élargirait la participation des minorités religieuses dans le pays, favorisant ainsi le développement économique, social et politique de l'État. De nombreux manifestants ont même soutenu que la laïcité préserverait le respect et le prestige de la foi. L'inclure dans le gouvernement risque de le tacher des péchés et des erreurs de l'homme.\n\nLa seule façon d'arrêter les émeutes est d'accepter de revenir sur notre législation ou d'attendre que les manifestants abandonnent."
 REL_POL.3.c:0 "Refuser les demandes"
 #"
 
 generic.31.t:0 "Des problèmes liés à la race surgissent"
 generic.31.d:0 "Plusieurs grandes villes et villages sont secoués par des incidents de violence et d'affrontement racistes. Un récent incident impliquant un membre d'une communauté minoritaire raciale ayant été maltraité a déclenché des tensions latentes depuis longtemps et des protestations ont émergé en réponse. Les représentants de la communauté minoritaire notent que les troubles reflètent un sentiment universel de désespoir et de colère face à la situation actuelle d'oppression, de racisme et de discrimination flagrante de la part de la société. Les partisans de l'ordre social actuel forment des groupes d'autodéfense et, selon certaines rumeurs, cela n'a fait qu'engendrer davantage de violence. Face à l'escalade de la situation, le gouvernement a annoncé qu'il déploierait des forces de police et de sécurité pour rétablir l'ordre. Les principaux journaux sont divisés, certains appelant le gouvernement à restaurer durement l'autorité et à maintenir les normes sociétales, tandis que d'autres appellent à davantage de dialogue et d'engagement avec les groupes qui se sentent étrangers à l'État ou à la société."
 generic.31.a:0 "D'accord"
 generic.32.t:0 "Les problèmes liés à la race se dissipent"
 generic.32.d:0 "Un calme étrange est revenu dans la nation alors que la récente période de violences et de tensions raciales semble enfin avoir pris fin. Le gouvernement a signalé du jour au lendemain qu'aucun incident d'attaque à caractère raciste n'avait eu lieu. Plus important encore, de nombreux groupes d'autodéfense formés pendant les troubles auraient été dissous. Certains félicitent le gouvernement pour ses actions pendant la crise, mais certains critiques soutiennent que la violence n'a pris fin qu'une fois qu'elle s'est éteinte. Quoi qu'il en soit, les marchés fonctionnent à nouveau et de nombreux citoyens sont soulagés de pouvoir enfin quitter leur domicile. Les autorités locales supervisent déjà les efforts de nettoyage dans les zones particulièrement endommagées lors des récentes violences."
 generic.32.a:0 "Powah !"
 
 election.2.t:0 "Élections nationales"
 election.2.d:0 "Des élections publiques ont lieu et les votes seront bientôt comptés. Tous les grands partis se regardent les uns les autres pour former un gouvernement ou s'y opposer. Qui pourrait bien gagner ?\n\n(Note du développeur : le parti au pouvoir peut défendre son titre s'il bénéficie d'un soutien populaire de 25 % ; un autre parti peut prendre le relais s'il dispose d'un soutien populaire de 25 % ou plus. Si un groupe d'idéologies similaires totalise 25 % mais qu'aucun d'entre eux ne possède individuellement 25 %, alors ils formeront une coalition et se présenteront ensemble.)\n§YParti au pouvoir actuel§! - [This.GetRulingParty] ([This.GetRulingIdeology])\n§YPopularité du parti au pouvoir§! - [This.GetPartySupport]%"
 
