 usa.1000.t:0 "Élection de 1952 : nomination démocrate"
 usa.1000.d:0 "Élection de 1952 : L'investiture démocrate a lieu aujourd'hui tandis que le favori est le gouverneur de l'Illinois Adlai Stevenson II, Estes Kefauver, sénateur américain célèbre pour s'en être pris à la mafia lors de ses témoignages au Sénat. Il y a aussi des rumeurs selon lesquelles le président Truman pourrait se présenter à la réélection à la dernière minute et s'emparer de l'investiture..."
 usa.1001.t:0 "Élection de 1952 : nomination républicaine"

