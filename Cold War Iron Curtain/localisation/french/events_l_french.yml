BUL.15.d:0 "Il existe une déconnexion croissante entre le BCP et la jeunesse. Nous devons trouver un moyen d'inspirer davantage de participation politique pour la survie du parti et de la classe ouvrière bulgare. De nombreux réformistes parmi les septembreistes estiment qu'il faut développer les activités de loisirs chez les Pionniers. Des suggestions telles que l'importation massive de « Kinderpanzers » est-allemands, des voyages de camping annuels en Sibérie et des camps d'été ont toutes été adoptées par la faction réformiste des septembreistes. À l'opposé, les partisans de la ligne dure de Tchervnenkov ont appelé à une intervention plus ferme. Ils croient que pour maintenir la participation des jeunes au BCP, il faut supprimer les cloches et les sifflets décadents inutiles et introduire une conscription mineure. Ce plan, s'il est mis en oeuvre correctement, élargira considérablement le PCA et garantira la discipline des jeunes pour l'avenir. Les deux options ont des forces et des faiblesses, et nous devons en choisir une avant que les jeunes ne soient définitivement aliénés."
BUL.16.d:0 "Aujourd'hui, le Premier ministre bulgare, Todor Jivkov, a annoncé le début d'un ensemble radical de plans économiques baptisés les thèses Jivkov. Inspirées par Nikita Khrouchtchev, les thèses Zivkov promettent de moderniser tous les aspects de l'économie bulgare, en mettant fortement l'accent sur l'armement et l'exploitation minière. Beaucoup s'inquiètent des objectifs les plus irréalistes de certains de ces plans et du fait qu'ils négligent le développement agricole. Pourtant, le gouvernement bulgare a assuré que chaque plan avait été méticuleusement réfléchi."
BUL.17.d:0 ""
BUL.18.d:0 "Avec la conclusion de nos efforts de modernisation, un fossé est apparu entre les planificateurs. Certains pensent que nous devons poursuivre la politique économique tchervnenkovienne, tandis que d'autres estiment qu'une libéralisation est nécessaire pour suivre le rythme du reste de l'Europe. Les Tchervnenkovistes ont soutenu que le relâchement immédiat de l'industrie lourde favoriserait la complaisance des masses prolétariennes de Bulgarie. À leurs yeux, l'abstinence d'un consumérisme décadent créera les conditions du communisme. En face d'eux se trouvent des planificateurs socialistes réformistes qui croient que sans la technologie et le confort d'une nation moderne, les travailleurs bulgares se lasseront du projet communiste et l'abandonneront complètement. Il n'existe pas de réponse claire à cette division dans nos rangs et toute réponse pourrait aboutir à un échec ou à un succès absolu."
BUL.19.d:0 "Aujourd'hui, les planificateurs ont présenté une nouvelle politique économique audacieuse pour la Bulgarie. Ils proposent à chaque planificateur et aux politiciens de passer un mois à travailler avec les travailleurs qu'ils dirigent. Ils croient que ce plan reconnectera le BCP à la classe ouvrière bulgare et éliminera la déconnexion croissante soulignée par les thèses Zhivkov."
BUL.20.d:0 "Au cours de la dernière décennie, l'économie bulgare a accumulé des dettes considérables. S'ils ne sont pas remboursés avant la fin de l'année fiscale, les prêteurs cesseront de financer nos projets et nous serons incapables de continuer en tant que nation socialiste. Une réforme budgétaire stricte est nécessaire pour résoudre cette crise."
BUL.21.d:0 ""
BUL.22.d:0 "La Sécurité intérieure nous a informés que de nombreux militaires et intellectuels sont fatigués de nos politiques libérales et souhaitent revenir au marxisme pur et dur de Tchervnenkov. En raison de la nature de la menace, nous devons faire attention à l'endroit où placer les agents pour éviter les soupçons. De nombreux acteurs de la sécurité intérieure pensent que la menace réside dans les idéologues et les dirigeants urbains instruits. Selon eux, la liquidation de cette classe intellectuelle croissante empêchera la propagation d'idées néfastes à notre classe ouvrière. Cependant, tout récemment, un nombre croissant d'agents ont découvert des preuves de déloyauté au sein de la garnison militaire de Sofia. Les preuves suggérant une trahison au sein de l'Armée populaire bulgare se multiplient. Ils préviennent que sans purge militaire, la Bulgarie pourrait risquer de devenir une junte rouge fanatique."
BUL.23.d:0 ""
BUL.24.d:0 "Maintenant que notre révolution est assurée à l'intérieur, nous devons protéger l'État bulgare des intrus capitalistes. Nos camarades d'Albanie ont travaillé dur pour construire des fortifications, et nos frères de Chine se rassemblent le long du fleuve Amour. Pourtant, pour sécuriser la Bulgarie, nous devons nous tourner vers la puissance de l'atome. Avec une faible population et une frontière avec une marionnette soviétique, notre seul espoir de survie est la construction d'un dispositif nucléaire. Jusqu'à son achèvement, toute nouvelle concernant un tel dispositif doit rester un secret bien gardé."
BUL.26.d:0 "Inspiré par le camarade Khrouchtchev, le Premier ministre Jivkov a élaboré un plan visant à industrialiser rapidement la Bulgarie. Le plan appelle à une réduction du développement agricole en faveur de l'industrie lourde dans les secteurs de l'armement et de l'exploitation minière. Grâce à son travail acharné, Zhivkov nous a assuré que la Bulgarie deviendrait une puissance industrielle dans les Balkans. Une petite minorité de planificateurs estime toutefois que nos projets sont beaucoup trop ambitieux. Selon le ministère de l'Agriculture, la Bulgarie ne peut pas se permettre de négliger son agriculture pendant une période prolongée. Malgré de légères objections, les thèses Jivkov devraient être un succès complet."
BUL.27.d:0 "La Bulgarie a annoncé aujourd'hui qu'elle allait faire un grand pas en avant. Cette annonce fait suite à des rumeurs largement répandues sur l'échec initial des thèses Jivkov. Il semble que le PCA ait redoublé d'efforts pour une industrialisation rapide et promet désormais que l'économie bulgare deviendra la plus grande économie des Balkans. Cette annonce a suscité la condamnation de nombreux pays qui s'inquiètent d'un effondrement total de l'agriculture. Malgré les inquiétudes, l'ensemble de la population bulgare a déjà été mobilisée et déployée dans les campagnes pour accélérer rapidement l'industrialisation."
BUL.28.d:0 "Aujourd'hui, Todor Zhivkov a annoncé une décision controversée visant à commencer à démanteler de nombreuses lois nationales contre l'homosexualité. Cette décision intervient après l'arrestation de 26 hommes pour « comportement déviant ». Cependant, les tribunaux ont été influencés par leur histoire et, dans un développement choquant, les ont déclarés innocents. Peu de temps après, l'homosexualité a été décriminalisée et les unions civiles sont désormais reconnues par la loi bulgare. Beaucoup ont critiqué cette évolution, le groupe le plus virulent étant l'Église orthodoxe qui, dans de rares cas, s'est opposée à la ligne du parti. Malgré les réticences, nombreux sont ceux qui se réjouissent de cette évolution positive de la culture bulgare."
BUL.29.d:0 "Hier soir, des officiers bulgares commandés par Ivan Gorunya ont organisé un coup d'État et renversé le Premier ministre Jivkov. Gorunya a annoncé la fin du régime Jivkov et le début d'une nouvelle ère de ligne dure pour la Bulgarie. Les Soviétiques n'ont pas tardé à condamner le coup d'État et ont demandé au nouveau gouvernement de démissionner et de libérer Jivkov et sa famille sains et saufs. Il est peu probable que ces demandes soient satisfaites puisque les troupes bulgares chassent les garnisons soviétiques à travers le pays. Déjà, le Pacte de Varsovie a été mis en état d'alerte et des rumeurs circulent sur une éventuelle intervention. Le nouveau gouvernement bulgare a prévenu que toute incursion sur son sol entraînerait une guerre populaire totale."
BUL.30.d:0 "Hier soir, des officiers traîtres de la garnison de Sofia ont tenté de manière opportuniste de prendre le pouvoir au gouvernement de notre peuple. Cependant, le coup d'État était connu de la sécurité intérieure depuis des mois et tous les officiers ont été arrêtés avant que des dégâts puissent être causés. Ivan Gorunya, le leader du coup d'État, a été arrêté et est actuellement interrogé. Ce coup d'État a échoué de façon spectaculaire, mais un autre pourrait bientôt arriver. C'est pourquoi nous devons sévir durement contre l'armée pour garantir la sécurité de la démocratie de nos peuples."
BUL.31.d:0 "Au cours du mois dernier, les agents du KGB stationnés en Bulgarie ont constaté une augmentation de l'extraction d'uranium. S'il est possible que cet État voyou construise des centrales électriques, nous pensons qu'il est plus probable que la République populaire de Bulgarie tente de créer un dispositif nucléaire. De nombreux membres de l'Armée rouge nous ont exhortés à intervenir avant que la Bulgarie ne se dote de l'arme nucléaire. Le KGB a toutefois averti qu'il était possible que la Bulgarie possède déjà un dispositif nucléaire et puisse l'utiliser pour faire avancer les troupes du Pacte de Varsovie. Nous devons décider d'une réponse rapidement avant qu'il ne soit trop tard"

### Geneva Conference Events ###

# Geneva Conference Outcome Events
Geneva_Conference_Outcome.1.t: "[GetNewspaperHeader]Succès total à Genève"
Geneva_Conference_Outcome.1.d: "Genève, [?global.date.GetDateStringNoHourLong] - Dans un triomphe diplomatique sans précédent, la Conférence de Genève a conclu un accord global, mettant fin à près d'une décennie de guerre brutale en Indochine. Après des semaines d'intenses négociations, les représentants de la France, de la République démocratique du Vietnam, de l'État du Vietnam et des États-Unis ont conclu un accord historique qui façonne à la fois l'avenir immédiat et à long terme de la région.\n\nToutes les parties ont convenu d'un cessez-le-feu immédiat, mettant ainsi fin à l'effusion de sang au Vietnam, au Laos et au Cambodge. Plus important encore, chaque délégation a accepté le cadre de la réunification du Vietnam à travers des élections nationales prévues pour 1956, s'engageant ainsi en faveur d'une résolution pacifique du conflit.\n\nPeu d'observateurs croyaient qu'une telle issue était possible. Les accords marquent une nette victoire diplomatique et signalent une nouvelle ère de coopération et de réconciliation en Indochine, offrant au peuple vietnamien la voie pour déterminer son propre avenir par les urnes.\n"
Geneva_Conference_Outcome.1.a: "Un nouveau chapitre pour l'Indochine commence."

Geneva_Conference_Invitation.5.t: "Une proposition pour la paix en Indochine"
Geneva_Conference_Invitation.5.d: "Le gouvernement de Saigon a formellement proposé la convocation d'une conférence internationale pour régler la question indochinoise. Alors que les combats sont au plus bas depuis des années, la proposition a trouvé un public réceptif dans la presse internationale. Paris doit maintenant décider s'il doit accepter l'offre et négocier la fin de la guerre, ou s'il la rejette et porte le fardeau du conflit."
Geneva_Conference_Invitation.5.a: "Le moment est venu de parler."
Geneva_Conference_Invitation.5.b: "La France ne négocie pas sous pression."
