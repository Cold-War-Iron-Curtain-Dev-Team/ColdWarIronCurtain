 USA_INDO_4_b_disown_tt:0 "Washington §Rdésavoue§! le règlement : son opinion sur Saigon tombe, et Saigon peut refuser le scrutin."
 Currency.1.d:0 "Un message officiel transmis par le Royaume hachémite de Jordanie aux côtés d'anciens membres du caucus transjordanien a annoncé la création de la monnaie nationale officielle du royaume. Le dinar jordanien devrait remplacer l'ancienne livre palestinienne, une monnaie relique de l'ancienne administration palestinienne britannique de la région. Depuis l'indépendance de la Jordanie en 1946, les idées de mise en oeuvre et de création d'une monnaie nationale étaient populaires parmi tous les bords politiques. Actuellement, en 1949, la loi provisoire35, responsable d'une telle création monétaire, a été adoptée à l'unanimité en Jordanie. Les attentes du Conseil monétaire jordanien récemment créé suggèrent que le dinar sera officiellement mis en oeuvre d'ici le 1er juillet 1950, cessant officiellement d'accepter la monnaie britannique palestinienne obsolète. Les spécifications de la monnaie, conformément au Conseil monétaire jordanien, suggèrent : Des coupures de pièces de 1, 5, 10, 20, 50 et 100. Quant aux billets de banque, les coupures comprendront 0,5, 1, 5, 10, 20 et 50 dinars. Une fois de plus, le monde peut assister à la naissance d'une nouvelle monnaie."
 alaskawaii.1.t: "[GetNewspaperHeader] L'Alaska et Hawaï obtiennent le statut d'État"
 alaskawaii.1.d: "Après un long processus d'admission, les États-Unis ont annoncé que leurs territoires de longue date, l'Alaska et Hawaï, obtiendraient le statut d'État d'ici la fin de l'année. Les territoires d'outre-mer sont sous le contrôle des États-Unis depuis respectivement 1867 et 1898 et se sont révélés être des atouts stratégiques et économiques vitaux pour le pays. \n\nCe changement signifie que l'Alaska et Hawaï auront le pouvoir d'élire des représentants au Congrès américain et se verront attribuer des voix électorales pour les élections présidentielles. Avec cette nouvelle, certains spéculent que Porto Rico, Guam ou peut-être même le District de Columbia obtiendront également le statut d'État dans les années à venir. Ni la Maison Blanche ni le Congrès n'ont fait de commentaires sur ces rumeurs. \n\nQuoi qu'il en soit, l'Union sera bientôt composée de 50 États et les Américains du monde entier se préparent à troquer leurs drapeaux à 48 étoiles contre la nouvelle variante. C'est une bonne journée pour les fabricants de drapeaux."
 alaskawaii.1.a: "Des étoiles et des rayures pour toujours !"
 alaskawaii.1.b: "Vendre l'Alaska était une erreur..."
 alaskawaii.1.c: "Il était temps."
 ace_promoted.1.t:0 "Ace Pilot promu"
 ace_promoted.2.t:0 "Un as sauvage apparaît"
 ace_promoted.1.d:0 "Rares sont ceux qui prennent autant de risques que les courageux pilotes de l'armée de l'air [Root.GetAdjective]. [From.GetName] [From.GetSurname], un pilote expérimenté connu sous l'indicatif d'appel [From.GetCallsign], s'est distingué [From.GetHerselfHimself] non seulement en revenant vivant de la récente mission du [From.GetMissionRegion], mais en vivant des victoires significatives dans de nombreuses rencontres critiques.\n\nConsidérée comme un brillant exemple de courage [Root.GetAdjective], la récente promotion de [From.GetName]a été très médiatisée. Même si les gens considèrent la guerre comme un enfer plutôt que comme une gloire, nombreux sont ceux qui sont heureux de constater qu'il existe encore des héros derrière lesquels se rallier."
 ace_promoted.1.d_major:0 "Rares sont ceux qui prennent autant de risques que les courageux pilotes de l'armée de l'air [Root.GetAdjective]. [From.GetName] [From.GetSurname], un pilote expérimenté connu sous l'indicatif d'appel [From.GetCallsign], s'est distingué par [From.GetHerselfHimself] non seulement en revenant vivant, mais en pilotant [From.GetHerHis] [From.GetWing] avec une immense habileté. Récemment, [From.GetName] était en mission au-dessus de [From.GetMissionRegion] et a joué un rôle déterminant dans le succès de cette rencontre critique.\n\nConsidérée comme un brillant exemple de courage [Root.GetAdjective], la récente promotion de [From.GetName]a été très médiatisée. Même si les gens considèrent la guerre comme un enfer plutôt que comme une gloire, nombreux sont ceux qui sont heureux de constater qu'il existe encore des héros derrière lesquels se rallier."
 ace_promoted.1.a:0 "Qui ose, gagne."
 ace_died.1.t:0 "[From.GetCallsign] Tué [From.GetMissionRegion]"
 ace_died.1.d:0 "L'un des as [From.GetAceType] les plus célèbres de [From.owner.GetName], [From.GetFullName], a pris feu dans l'exercice de ses fonctions, au cours d'une mission de plus de [From.GetMissionRegion]. Malheureusement, puisque [From.GetSheHe] est depuis longtemps une personnalité publique, la disparition de [From.GetCallsign] est gravement démoralisante pour les nombreuses personnes qui admiraient [From.GetHerHim].\n\nMême si nous souhaitons qu'il y ait un moyen de cacher cet événement au peuple, le manque d'apparitions publiques du [From.GetName] éveillerait bientôt les soupçons. En fin de compte, [From.GetHerHis] la mort est une autre partie d'une légende qui, espérons-le, perdurera bien au-delà de nos problèmes actuels."
 ace_died.1.d_major:0 "L'un des as [From.GetAceType] les plus célèbres de [From.owner.GetName], [From.GetFullName], est tombé dans l'exercice de ses fonctions. Les pilotes revenant de la mission rapportent avoir repéré [From.GetHerHis] [From.GetWingShort] en train de s'enflammer au-dessus de [From.GetMissionRegion] après avoir essuyé des tirs nourris de l'ennemi. Malheureusement, puisque [From.GetSheHe] est depuis longtemps une personnalité publique, la disparition de [From.GetCallsign] est gravement démoralisante pour les nombreuses personnes qui admiraient [From.GetHerHim].\n\nMême si nous souhaitons qu'il y ait un moyen de cacher cet événement au peuple, le manque d'apparitions publiques du [From.GetName] éveillerait bientôt les soupçons. En fin de compte, la mort de [From.GetHerHis] est une autre partie d'une légende qui, espérons-le, perdurera bien au-delà de nos problèmes actuels."
 ace_died.1.a:0 "Une légende vivante, c'est encore mieux."
 ace_killed_by_ace.1.t:0 "[From.GetFullName] Abattu par [Prev.GetCallsign]"
 ace_killed_by_ace.1.d:0 "Les pilotes revenant de [From.GetMissionRegion] rapportent qu'un escadron d'avions [Prev.owner.GetAdjective], dirigé par le tristement célèbre [Prev.GetCallsign], s'est concentré sur la poursuite de [From.GetCallsign]. Après avoir esquivé plusieurs rafales des [Prev.owner.GetAdjective]et abattu un certain nombre d'avions ennemis, le [From.GetCallsign] a été submergé par le [Prev.GetCallsign], qui aurait déjoué les manoeuvres du [From.GetHerHim] et a déchiré les réservoirs de carburant d'un coup net. L'avion de [From.GetName] [From.GetSurname]a pris feu et s'est effondré au-dessus de [From.GetMissionRegion] dans un violent enfer.\n\n[From.GetFullName] a fait preuve d'un grand courage tout au long de son service [From.GetHerHis] et a été admiré par beaucoup. La perte de ce héros national est un coup dur pour l'armée de l'air [From.owner.GetAdjective] et constitue un coup dévastateur pour la nation dans son ensemble. Savoir que pendant que nous pleurons, [Prev.owner.GetName] célèbre [Prev.GetFullName] en héros, rend la tragédie encore plus grande."
 ace_killed_by_ace.1.d_major:0 "Les pilotes revenant de [From.GetMissionRegion] rapportent qu'un escadron d'avions [Prev.owner.GetAdjective] dirigé par le tristement célèbre [Prev.GetCallsign] s'est concentré sur la poursuite de [From.GetCallsign]. Après avoir abattu un certain nombre d'avions ennemis et évité plusieurs rafales des [Prev.owner.GetAdjective], [From.GetCallsign] a été submergé par [Prev.GetCallsign] dans son [Prev.GetWingShort], qui aurait déjoué les manoeuvres du [From.GetHerHim] et a déchiré les réservoirs de carburant d'un coup net. Les [From.GetWingShort] de [From.GetName] [From.GetSurname]ont pris feu et sont partis en spirale au-dessus de [From.GetMissionRegion] dans un violent enfer.\n\n[From.GetFullName] a fait preuve d'un grand courage tout au long de son service [From.GetHerHis] et a été admiré par beaucoup. La perte de ce héros national est un coup dur pour l'armée de l'air [From.owner.GetAdjective] et constitue un coup dévastateur pour la nation dans son ensemble. Savoir que pendant que nous pleurons, [Prev.owner.GetName] célèbre le [Prev.GetFullName] en héros, rend la tragédie encore plus grande."
 ace_killed_by_ace.1.a:0 "Une perte dévastatrice pour nous tous"
 ace_killed_other_ace.1.t:0 "[From.GetFullName] Abattu [Prev.GetCallsign]"
 ace_killed_other_ace.1.d:0 "Notre dernière mission au-dessus de [From.GetMissionRegion] a été un grand succès pour l'armée de l'air [From.owner.GetAdjective] à plus d'un titre. Des rapports ont mis en lumière l'acte héroïque de [From.GetFullName], réussissant à déjouer le pilote [Prev.owner.GetAdjective], [Prev.GetName] [Prev.GetSurname], connu sous le nom de [Prev.GetCallsign]. [From.GetCallsign] a utilisé [From.GetHerselfHimself] comme appât et a attiré [Prev.GetCallsign] dans un piège où les pilotes de [From.owner.GetAdjective] ont pu plonger sur l'escadron de [Prev.GetCallsign]. [From.GetCallsign] a déjoué les avions [Prev.owner.GetAdjective] et, avec une seule rafale, a envoyé [Prev.GetCallsign] en spirale depuis le ciel de [From.GetMissionRegion].\n\n[Prev.GetFullName] était un pilote redouté avec de nombreuses [From.owner.GetAdjective] vies sur [Prev.GetHerHis] conscience. Il s'agit d'une grande victoire qui montre que lorsque nous nous rallions aux grands héros, ils accomplissent de grandes actions."
 ace_killed_other_ace.1.d_major:0 "Notre dernière mission au-dessus de [From.GetMissionRegion] a été un grand succès pour l'armée de l'air [From.owner.GetAdjective] à plus d'un titre. Des rapports ont mis en lumière l'acte héroïque de [From.GetFullName], réussissant à déjouer le pilote [Prev.owner.GetAdjective], [Prev.GetName] [Prev.GetSurname], connu sous le nom de [Prev.GetCallsign]. [From.GetCallsign] a utilisé [From.GetHerselfHimself] comme appât et a attiré [Prev.GetCallsign] dans un piège où les pilotes de [From.owner.GetAdjective] ont pu plonger sur l'escadron de [Prev.GetCallsign]. [From.GetCallsign] a déjoué les avions [Prev.owner.GetAdjective] et, avec une seule rafale, a envoyé [Prev.GetCallsign] en spirale depuis le ciel de [From.GetMissionRegion].\n\n[Prev.GetFullName] était un pilote redouté avec de nombreuses [From.owner.GetAdjective] vies sur [Prev.GetHerHis] conscience. Il s'agit d'une grande victoire qui montre que lorsque nous nous rallions aux grands héros, ils accomplissent de grandes actions."
 ace_killed_other_ace.1.a:0 "Une victoire de [From.owner.GetName] dont tous se souviendront !"
 aces_killed_each_other.1.t:0 "[From.GetFullName] est descendu"
 aces_killed_each_other.1.d:0 "Au cours de la dernière mission, notre célèbre as [From.GetAceType] [From.GetFullName] s'est retrouvé dans un combat prolongé avec le redouté as pilote, [Prev.GetFullName]. Étant à court de munitions et sans possibilité de s'échapper, [From.GetCallsign] a manoeuvré à travers le feu des avions [Prev.owner.GetAdjective] et a procédé à l'éperonnage de [Prev.GetCallsign].\nLes avions [From.GetCallsign]et [Prev.GetCallsign]ont été repérés en train de s'écraser en morceaux au-dessus de [From.GetMissionRegion].\n\nBien que ce soit une maigre consolation que la menace [Prev.owner.GetAdjective], [Prev.GetCallsign], ne soit plus une nuisance pour nous, nous avons perdu une personnalité publique appréciée et une source d'inspiration pour tous [From.owner.GetAdjective]."
 aces_killed_each_other.1.d_major:0 "Au cours de la dernière mission, notre célèbre as [From.GetAceType] [From.GetFullName] s'est retrouvé dans un combat prolongé avec le redouté as pilote, [Prev.GetFullName]. Étant à court de munitions et sans possibilité de s'échapper, [From.GetCallsign] a manoeuvré [From.GetHerHis] [From.GetWingShort] à travers le feu des avions [Prev.owner.GetAdjective] et a percuté [Prev.GetCallsign].\nLes [From.GetWingShort] de [From.GetCallsign]et les [Prev.GetWingShort] de [Prev.GetCallsign]ont été repérés en train de tomber en morceaux au-dessus de [From.GetMissionRegion].\n\nBien que ce soit une maigre consolation que la menace [Prev.owner.GetAdjective], [Prev.GetCallsign], ne soit plus une nuisance pour nous, nous avons perdu une personnalité publique appréciée et une source d'inspiration pour tous [From.owner.GetAdjective]."
 aces_killed_each_other.1.a:0 "Une grande perte pour nous néanmoins"



