 FIN_Nationalize_the_Steel_Industry:0 "Nationaliser l'industrie sidérurgique"
 FIN_Recognize_The_Federal_Republic_of_Germany:0 "Reconnaître la République fédérale d'Allemagne"
 FIN_Prepare_for_the_Helsinki_Olympics:0 "Préparez-vous pour les Jeux olympiques d'Helsinki"
 FIN_Prepare_for_the_Helsinki_Olympics_desc:0 "Les Jeux olympiques d'été de 1952 (finlandais : Kesäolympialaiset 1952), officiellement connus sous le nom de Jeux de la XVe Olympiade (finlandais : XV olympiadin kisat) et communément appelés Helsinki 1952, sont les prochains Jeux olympiques. Après que le Japon eut déclaré en 1938 qu'il ne serait pas en mesure d'accueillir les Jeux olympiques de 1940 à Tokyo en raison de la Seconde Guerre sino-japonaise, Helsinki fut choisie pour accueillir les Jeux olympiques d'été de 1940, qui furent ensuite annulés en raison de la Seconde Guerre mondiale. Maintenant que la guerre est derrière nous, nous pouvons enfin accueillir les jeux."
