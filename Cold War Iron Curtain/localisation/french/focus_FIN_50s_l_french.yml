 FIN_Apply_to_Join_NATO:0 "Postuler pour rejoindre l'OTAN"
 FIN_Rescind_the_YYA:0 "Annuler le YYA"
 FIN_Fagerholm_Victory:0 "Fagerholm, Fagerholm, Fagerholm...."
 FIN_Fagerholm_Victory_desc:0 "Le vice-président Väinö Leskinen lit à haute voix les bulletins de vote : le nom de Kekkonen est entendu 149 fois, celui de Fagerholm 151 fois. Après le compte à rebours, Fagerholm lui-même déclare qu'il a été élu président pour un mandat de six ans de 1956 à 1962. Les applaudissements retentissent dans la salle, mais ils se terminent lorsque le Premier ministre les regarde."
