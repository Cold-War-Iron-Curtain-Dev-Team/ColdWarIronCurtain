 fin_sov_aid_tt:0 "§YNous demanderons aux Soviétiques une certaine aide économique ainsi qu'une certaine aide industrielle."
 FIN_Kickstart_Reconstruction:0 "Lancez la reconstruction"
 FIN_Kickstart_Reconstruction_desc:0 "Pour améliorer notre économie et payer nos réparations de guerre, nous devons développer notre industrie."
 FIN_Accomadate_the_Population_Boom:0 "Faire face au boom démographique"
 FIN_Accomadate_the_Population_Boom_desc:0 "Notre taux de natalité a beaucoup augmenté. Aujourd'hui, nous devons construire des logements pour garantir que chacun ait un endroit où vivre."
 FIN_The_Finnish_Defense_Forces:0 "Puolustusvoimat"
 FIN_The_Finnish_Defense_Forces_desc:0 "Nous devons examiner notre armée et l'améliorer pour suivre le rythme de nos ennemis."
 FIN_Elections_of_1956:0 "Élections présidentielles de 1956"
 FIN_Elections_of_1956_desc:0 ""
 FIN_The_Paasikivi_Kekkonen_Doctrine:0 "Paasikivi-Kekkosen Linja"
 FIN_The_Paasikivi_Kekkonen_Doctrine_desc:0 "La Doctorine Paasikivi-Kekkonen désigne la ligne de neutralité de la politique étrangère de la Finlande après la Seconde Guerre mondiale. L'événement débloqué par le focus l'expliquera plus en détail."
 FIN_Bolster_Domestic_Industry:0 "Renforcer l'industrie nationale"
 FIN_Bolster_Domestic_Industry_desc:0 "Pour aider notre économie, nous devrions financer certaines industries pour nous assurer qu'elles puissent se moderniser."
 FIN_Crush_the_Kemi_Strike:0 "Écrasez la frappe de Kemi"
 FIN_Crush_the_Kemi_Strike_desc:0 "Après notre annonce de réduction de 30 % des salaires des travailleurs du bois de Kemi Oy, ils ont lancé une grève, à laquelle de plus en plus de travailleurs se joignent chaque jour. Nous devons écraser ces grèves le plus rapidement possible."
 FIN_Sideline_the_Communists:0 "Mettre les communistes sur la touche"
 FIN_Sideline_the_Communists_desc:0 "Il faut empêcher les communistes d'acquérir trop de pouvoir au sein du gouvernement."
 FIN_Elections_of_1950:0 "Élections présidentielles de 1950"
 FIN_Pekkala_Victory:0 "Victoire de Mauno Pekkala"
 FIN_Pekkala_Victory_desc:0 "Mauno Pekkala a remporté les élections présidentielles de 1950."
 FIN_explore_automated_computing:0 "Explorez l'informatique automatisée"
 FIN_explore_automated_computing_desc:0 "Partout dans le monde, les pays développent rapidement des moyens de créer des machines capables de calculer et de faire des choses beaucoup plus rapidement que les humains. Nous devons donner des fonds à l'Université de technologie d'Helsinki pour qu'elle étudie cette technologie."
 FIN_Vaccine_Mandates:0 "Vaccinations obligatoires"
 FIN_Vaccine_Mandates_desc:0 "Grâce aux vaccins, nous pouvons éradiquer de nombreuses maladies."
 FIN_Reconstruction_in_Lappland:0 "Reconstruire la Laponie"
 FIN_Reconstruction_in_Lappland_desc:0 "Même si la Laponie a beaucoup souffert pendant la guerre de Laponie, nous n'avons pas encore pu nous engager pleinement dans sa reconstruction. Il est temps de changer cela et d'investir dans la région."
 FIN_End_Wage_Controls:0 "Mettre fin au contrôle des salaires"
 FIN_End_Wage_Controls_desc:0 "Maintenant que la crise économique d'après-guerre s'est atténuée, nous pouvons enfin mettre fin au contrôle des salaires."
 FIN_Preserve_Friendly_Relations_with_Stalin:0 "Préserver les relations amicales avec Staline"
 FIN_Preserve_Friendly_Relations_with_Stalin_desc:0 "Être amical avec l'homme d'acier est bénéfique pour nous."
 FIN_Lobby_for_The_Return_of_Pokkala:0 "La situation de Porkkala"
 FIN_Lobby_for_The_Return_of_Pokkala_desc:0 "Jusqu'à la fin des années 1990, nous avons loué une petite base navale à côté d'Helsinki pour l'Union soviétique. Nous devrions essayer de le récupérer plus tôt."
 FIN_The_FInnish_Air_Force:0 "Ilmavoimat"
 FIN_The_FInnish_Air_Force_desc:0 "Notre force aérienne n'est pas dans la meilleure forme. C'est petit et utilise des avions obsolètes. Nous devons le moderniser."
 FIN_Purchase_British_Vampires:0 "Achetez des vampires britanniques"
 FIN_Purchase_British_Vampires_desc:0 "Il ne fait aucun doute que notre force aérienne est dépassée. A l'ère des avions à réaction, un avion à hélice n'a aucune chance face à un chasseur à réaction. C'est pour cette raison que le gouvernement a accordé des subventions à l'armée de l'air pour entrer dans l'ère des avions à réaction."
 FIN_Import_the_Folland_Gnat:0 "Importer des moucherons Folland"
 FIN_Acquire_French_CM170_Magisters:0 "Acquérir des Magisters CM170 français"
 FIN_close_kansainhuoltominist:0 "Fermer Kansanhuoltoministeriö"
 FIN_close_kansainhuoltominist_desc:0 "Nous avons commencé à rationner en 1939 à cause de la guerre d'Hiver. Et cela continue encore aujourd'hui, même si les temps de guerre sont derrière nous depuis longtemps. Chaque jour, les gens se plaignent de ne pas boire assez de café. Bien entendu, nous avons progressivement réduit le rationnement. Pour y parvenir, nous mettrons fin au rationnement de certains produits et fermerons le ministère chargé du rationnement, transférant ainsi ses fonctions ailleurs."
 FIN_Complete_Soviet_Reperations:0 "Réparations soviétiques complètes"
 FIN_Complete_Soviet_Reperations_desc:0 "Finalement, après de nombreuses années, nous avons enfin remboursé notre dette de guerre envers l'Union soviétique."
 FIN_crackdown_on_heroin_epidemic:0 "Limiter la consommation d'héroïne"
 FIN_crackdown_on_heroin_epidemic_desc:0 "La consommation d'héroïne est devenue une épidémie majeure. Nous devons limiter sa disponibilité pour lutter contre les effets négatifs qu'elle a sur notre population."
 FIN_President_Kuusinen:0 "Kuusinen prend le relais"
 FIN_President_Kuusinen_desc:0 "Vous ne trouverez jamais une ruche plus misérable de racaille et de méchanceté"
 FIN_Join_COMECON:0 "Rejoignez le COMÉCON"
 FIN_Request_Soviet_Advisors:0 "Demander des conseillers militaires soviétiques"
 FIN_Request_Soviet_Advisors_desc:0 "Grâce à nos relations étroites avec l'Union soviétique, notre armée pourrait négocier pour avoir des conseillers soviétiques pour l'aider dans ses activités militaires."
 FIN_Seize_Control_of_the_Labor_Unions:0 "Prendre le contrôle des syndicats"
 FIN_Seize_Control_of_the_Labor_Unions_desc:0 "Les syndicats devraient être entièrement contrôlés par les travailleurs."
 FIN_Abolish_the_Constitution:0 "Abolir la Constitution"
 FIN_Abolish_the_Constitution_desc:0 "\"Est-ce légal ?\" \"Je vais le rendre légal.\""
 FIN_Request_Karelia:0 "Négocier à propos de la Carélie"
 FIN_Request_Karelia_desc:0 "Tout le monde sait que Karelia est finlandaise. Nous devons au moins essayer de le contrôler."
 FIN_Establish_The_Finnish_Peoples_Republic:0 "Établir la République démocratique finlandaise"
 FIN_Establish_The_Finnish_Peoples_Republic_desc:0 "Je suis le Sénat !"
 FIN_Allow_Soviet_Basing:0 "Autoriser les bases soviétiques"
 FIN_Allow_Soviet_Basing_desc:0 "Les Soviétiques ont proposé qu'en échange d'une certaine somme d'argent, ils seraient autorisés à utiliser nos ports pour leurs navires."
 FIN_Increase_Soviet_Ties:0 "Augmenter les liens avec les Soviétiques"
 FIN_Tax_Cuts:0 "Réductions d'impôts"
 FIN_Increase_Pensions:0 "Augmenter les retraites"
 FIN_Increase_Steel_Production:0 "Améliorer la production d'acier"
 FIN_Renegotiate_Soviet_Reperations:0 "Renégocier les réparations soviétiques"
 FIN_Renegotiate_Soviet_Reperations_desc:0 "Grâce à nos paiements ponctuels, nous sommes en mesure de négocier les réparations à la baisse d'un certain montant. Cela signifie que nous devrions en finir avec eux dans quelques années au maximum."
