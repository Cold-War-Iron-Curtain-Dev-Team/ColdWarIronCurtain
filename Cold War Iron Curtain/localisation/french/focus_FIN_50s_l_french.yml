 FIN_Outlaw_Right_Wing_Parties:0 "Partis de droite interdits"
 FIN_Renegotiate_the_YYA:0 "Un nouveau YYA"
 FIN_Seek_American_Credit:0 "Rechercher du crédit américain"
 FIN_End_Rationing:0 "Mettre fin au rationnement"
 FIN_End_Rationing_desc:0 "0 \"Bien que la guerre soit terminée depuis des années maintenant, nous avons encore rationné certains produits, comme le café et le sucre. Avec la croissance de notre économie et l'idée de pénurie loin derrière nous, nous pouvons enfin mettre fin à ce programme de rationnement impopulaire."
 FIN_Reformation_of_the_Red_Guard:0 "La nouvelle garde rouge"
 FIN_Encourage_Social_Stability:0 "Encourager la stabilité sociale"
 FIN_Strengthen_the_Banking_Sector:0 "Renforcer le secteur bancaire"
 FIN_censor_anti_soviet_media:0 "Censure les médias antisoviétiques"
 FIN_peace_forever:0 "Plaider pour la paix mondiale"
 FIN_peace_forever_desc:0 "En ces temps tendus, nous devons plaider en faveur de la paix dans le monde."
 FIN_Oust_Communists_From_Government_Positions:0 "Financement de la recherche industrielle"
 FIN_Oust_Communists_From_Government_Positions_desc:0 "La technologie avance le plus vite, nous devons veiller à ne pas prendre de retard."
 FIN_SDP_Domination_of_SAK:0 "La domination du SDP sur le SAK"
 FIN_SDP_Domination_of_SAK_desc:0 "Le parti social-démocrate exerce une grande influence sur la Fédération finlandaise des syndicats."
 FIN_Outmaneavor_the_Communists:0 "Déjouer les manoeuvres des communistes"
 FIN_Preserve_Finnish_Sovereignty:0 "Préserver la souveraineté finlandaise"
 FIN_improve_welfare:0 "Améliorer le bien-être"
 FIN_rural_development:0 "Développement rural"
 FIN_Advocate_for_Finnish_Sovereiegnty:0 "Plaider pour la souveraineté finlandaise"
 FIN_Advocate_for_Finnish_Sovereiegnty_desc:0 "Nous devons conserver notre place de nation souveraine."
 FIN_Encourage_Athelticism:0 "Encourager l'athlétisme"
 FIN_Encourage_Athelticism_desc:0 "Nous devons encourager les gens à faire de l'exercice pour rester en bonne santé."
 FIN_Seek_Soviet_Credit:0 "Rechercher du crédit soviétique"
 FIN_Seek_Soviet_Credit_desc:0 "Notre fusil de combat standard sera la copie FN FAL RK-53."
 FIN_Suspend_Rationing:0 "Suspendre le rationnement"
 FIN_A_Civic_Peace:0 "Une paix civique"
 FIN_american_imports_desc:0 ""
 FIN_Active_Neutrality:0 "Neutralité Active"
 FIN_Active_Neutrality_desc:0 "Au lieu de choisir entre l'Est et l'Ouest, soyons neutres."
 FIN_Apply_to_Join_the_UN2:0 "Postuler pour rejoindre l'ONU"
 FIN_Apply_to_Join_the_UN2_desc:0 "En-cours"
 FIN_Currency_Reforms:0 "Réformer la Markka"
 FIN_Currency_Reforms_desc:0 "La Markka a besoin d'une réforme adaptée aux temps modernes."
 FIN_Priortize_Industrial_Development:0 "Prioriser le développement industriel"
 FIN_Join_The_Nordic_Union2:0 "Rejoignez le Conseil nordique"
 FIN_Join_The_Nordic_Union2_desc:0 "Avec le départ de Staline, nous sommes plus libres de contrôler notre propre politique étrangère. C'est pourquoi nous devrions rejoindre le Conseil nordique pour accroître la coopération nordique."
 FIN_join_nordic_council:0 "Rejoignez le Conseil nordique"
 FIN_join_nordic_council_desc:0 "Avec le départ de Staline, nous sommes plus libres de contrôler notre propre politique étrangère. C'est pourquoi nous devrions rejoindre le Conseil nordique pour accroître la coopération nordique."
 FIN_Delay_Wage_and_Price_Adjustments:0 "Retarder les ajustements des salaires et des prix"
 FIN_Censor_Anti_Communist_Propaganda:0 "Relations ouvertes avec la RPC"
 FIN_Censor_Anti_Communist_Propaganda_desc:0 "Il semble probable que la RPC va gagner la guerre civile. Nous devrions le reconnaître et établir un certain type de relations avec eux."
 FIN_Begin_Further_Economic_Negotiations:0 "Solidifier l'autonomie d'Åland"
 FIN_Begin_Further_Economic_Negotiations_desc:0 "Le statut autonome d'Åland a été confirmé par une décision prise par la Société des Nations en 1921 à la suite du conflit des îles Åland. Selon la loi, Åland est politiquement neutre et entièrement démilitarisée, et ses résidents sont exemptés de la conscription dans les forces de défense finlandaises. Åland s'est vu accorder une large autonomie par le Parlement finlandais dans la loi sur l'autonomie d'Åland de 1920. Aujourd'hui, le parlement a rédigé une nouvelle législation pour remplacer celle de 1920 par une loi plus moderne."
