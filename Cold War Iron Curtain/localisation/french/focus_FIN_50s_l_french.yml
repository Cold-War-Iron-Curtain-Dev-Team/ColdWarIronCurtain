 FIN_invest_in_medical_field:0 "Accorder des prêts aux entreprises médicales"
 FIN_invest_in_medical_field_desc:0 "Nous accorderons à diverses sociétés de recherche médicale des prêts importants avec un long délai de remboursement. Parallèlement, nous accordons des fonds supplémentaires aux hôpitaux et aux cliniques."
 FIN_criticize_right_parties:0 "Critiquer les partis de droite"
 FIN_invest_in_lapland:0 "Investissements en Laponie"
 FIN_President_Kilpi:0 "Président Kilpi"
 FIN_audit_the_police:0 "Auditer la police"
 FIN_audit_the_police_desc:0 "Nous devons veiller à ce que notre police n'adopte pas de positions extrêmes, qu'elles soient de gauche ou de droite."
 FIN_Declare_A_One_Party_State:0 "Déclarer un État à parti unique"
 FIN_Declare_A_One_Party_State_desc:0 "Une nation, un parti, un leader."
 FIN_Nationalize_the_Financial_Industry:0 "Nationaliser le secteur financier"
 FIN_Nationalize_the_Financial_Industry_desc:0 "La racine de tous les maux réside dans le secteur financier. Nous devons les saisir pour le peuple."
