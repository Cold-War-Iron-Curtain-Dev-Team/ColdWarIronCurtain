 FIN_soviet_boost_to_un_desc:0 "Si nous parvenons à convaincre les Soviétiques de soutenir notre adhésion, nous devrions facilement y adhérer."
 FIN_support_stalinism:0 "Agrandir la zone de stockage de pétrole de Tupavuori"
 FIN_support_stalinism_desc:0 "Avec la demande croissante de pétrole, nous avons besoin d'un endroit pour le stocker. A ce titre, le Parlement a décidé d'accorder des fonds pour agrandir la zone de Tupavuori à Naantali."
 FIN_end_rationing_klp:0 "Mettre fin à tout rationnement"
 FIN_end_rationing_klp_desc:0 "Même si la guerre est terminée depuis des années, nous continuons à rationner certains produits, comme le café et le sucre. Avec la croissance de notre économie et l'idée d'une pénurie loin derrière nous, nous pouvons enfin mettre fin au programme de rationnement impopulaire."
 FIN_state_owned_unions:0 "Augmenter les pouvoirs des syndicats"
 FIN_state_owned_unions_desc:0 "Grâce aux syndicats, nos travailleurs ont acquis des droits indispensables. Mais le travail n'est pas encore terminé et nous devons donc accorder davantage de pouvoirs aux syndicats pour obtenir des droits encore meilleurs pour les travailleurs."
 FIN_test_five_year_plan:0 "Pohjoismainen Viisivuotissuunnitelma"
 FIN_test_five_year_plan_desc:0 "Le parlement a proposé un nouveau plan économique, baptisé \"Pohjoismainen Viisivuotissuunnitelma\" (plan quinquennal nordique). Il s'agit d'un mélange unique de planification économique du bloc de l'Est et des pays nordiques."
 FIN_modernize_train_traffic:0 "Visite d'État au bloc de l'Est"
 FIN_modernize_train_traffic_desc:0 "Pour montrer notre soutien au socialisme, Kuusinen a décidé d'effectuer une tournée dans le bloc de l'Est."
 FIN_soviets_object_to_government:0 "Les Soviétiques s'opposent au Cabinet"
 FIN_soviets_object_to_government_desc:0 ""
 FIN_crisis_averted:0 "Crise évitée"
 FIN_crisis_averted_desc:0 ""
 FIN_strengthen_SAK:0 "Renforcer les syndicats"
 FIN_strengthen_SAK_desc:0 ""
 FIN_ARAVA_loans:0 "Prêts Arava"
 FIN_ARAVA_loans_desc:0 "Asuntorakennustuotannon valtuuskunta, ou Arava, est un système qui accorde des prêts à faible taux d'intérêt pour la production de logements avec des prêts bon marché subventionnés par l'État. L'objectif du système est de produire des logements abordables répondant à certains critères de qualité. Le financement d'Arava a été utilisé pour construire des logements locatifs, des maisons individuelles, des logements avec droit d'occupation et des logements étudiants. Les conditions de financement comportent un élément social, c'est pourquoi l'utilisation et le transfert de logements sont limités de diverses manières.\n\nLes prêts Arava sont également à l'origine de l'effondrement du cabinet Kekkonen IV. Alors que le cabinet souhaitait que les prêts s'élèvent à 5 milliards, le Parlement a finalement voté pour 7,5 milliards. Le lendemain, le cabinet démissionne."
 FIN_fate_of_k_program:0 "Programme Destin de K"
 FIN_fate_of_k_program_desc:0 "Le programme K est une politique proposée visant à résoudre les problèmes de compétitivité de l'industrie finlandaise. Alors que le cabinet Kekkonen IV semblait abandonner complètement le programme, il relève maintenant la tête une dernière fois, comme alternative au nouveau programme S proposé."
 FIN_paasikivi_56:0 "Victoire du Cheval Noir"
 FIN_paasikivi_56_desc:0 ""
 FIN_move_againts_communist_takeover:0 "Agissez contre la prise de pouvoir par les communistes"
 FIN_move_againts_communist_takeover_desc:0 "Les communistes tentent de s'emparer des syndicats, de la police et de tout ce qu'ils peuvent. Nous devons mettre un terme à cela."
 FIN_promote_finnish_unity:0 "Promouvoir l'unité finlandaise"
 FIN_promote_finnish_unity_desc:0 "La stabilité est plus importante qu'une croisade contre les communistes."
 FIN_kekkonen_voted:0 "Kekkonen a remplacé Paasikivi"
 FIN_kekkonen_voted_desc:0 "Kekkonen a remplacé Paasikivi à la présidence, décision parlementaire"
 FIN_kuusinen_voted:0 "Kuusinen a remplacé Paasikivi"
 FIN_kuusinen_voted_desc:0 "Kuusinen a remplacé Paasikivi à la présidence, décision parlementaire"
 FIN_support_kekkonen:0 "Soutenez Kekkonen en tant que successeur"
 FIN_support_kekkonen_desc:0 "Élu à l'âge de 85 ans, ce n'est un secret pour personne que Paasikivi pourrait mourir d'un jour à l'autre. Même si nous espérons que cela interviendra après son mandat présidentiel, rien n'est jamais sûr. En tant que tel, Paasikivi a décidé d'exprimer son soutien à Kekkonen pour devenir son successeur au cas où Paasikivi décèderait au pouvoir."
 FIN_criticize_polarization:0 "Promouvoir les droits suédois"
 FIN_criticize_polarization_desc:0 "\"Assurez-vous que suffisamment de suédois soit enseigné dans les écoles de langue finnoise ! Si vous arrêtez d'enseigner le suédois, il pourrait être remplacé par une autre langue étrangère - et je peux vous assurer que ce n'est pas l'espagnol !\"\n-J. K. Paasikivi a parlé à Johannes Virolainen des projets de la Ligue agraire visant à réduire l'éducation suédoise."
 FIN_finno_soviet_student_program:0 "Programme étudiant finno-soviétique"
 FIN_finno_soviet_student_program_desc:0 "Nous bénéficierions tous les deux d'un programme d'échange d'étudiants plus vaste."
 FIN_foster_left_unity:0 "Promouvoir l'unité de gauche"
 FIN_foster_left_unity_desc:0 "Séparés, nous sommes faibles. Ensemble, nous sommes forts. Nous devons chercher à unifier nos pays de gauche sous une seule bannière. Kaikkien jeune prolétaire, liittykää yhteen !"
 FIN_ties_with_neutrals:0 "Rencontre avec des pays neutres"
 FIN_ties_with_neutrals_desc:0 "Nous devrions organiser des réunions avec les dirigeants des pays les plus neutres."
 FIN_tactically_maneuver_politics:0 "État-major de la police avec les communistes"
 FIN_tactically_maneuver_politics_desc:0 "La police actuelle est trop à droite. Pour équilibrer le tout, nous devons remplacer certains membres par des communistes."
 FIN_free_sciences:0 "Programme de développement rural"
 FIN_free_sciences_desc:0 "Les agriculteurs et autres travailleurs ruraux constituent l'épine dorsale de notre société. A ce titre, il a été décidé de lancer le « Maaseudun ja pienkylien parannusohjelma » (Programme d'amélioration des campagnes et des petits villages). Dans ce programme, les fonds seront détournés des zones urbaines vers les campagnes et les petits villages. Cela comprend des éléments tels que l'amélioration des routes, de la plomberie et de l'électricité améliorées et l'amélioration des services d'urgence dans ces zones."
 FIN_tone_down_marxist_agenda:0 "Atténuer le programme marxiste"
 FIN_tone_down_marxist_agenda_desc:0 "Même si notre chemin vers le socialisme a été entamé avec succès, il semble désormais que nous devons le modérer. Selon la police de sécurité, des éléments de plus en plus à droite commencent à s'unir et peut-être même à déclencher des violences contre nous. Lors de la réunion du gouvernement, il a été décidé de réduire les politiques communistes et marxistes de notre gouvernement. Espérons que cela empêchera la violence et la montée de la droite radicale."
 FIN_advocate_for_peaceful_socialism:0 "Augmenter la surveillance de la droite"
 FIN_advocate_for_peaceful_socialism_desc:0 "Nous devons veiller à ce que la droite ne devienne pas forte ou radicale."
 FIN_finnocommunism:0 "Bien-être amélioré"
 FIN_finnocommunism_desc:0 "Améliorer le bien-être."
 FIN_freeslot:0 "Sécularisation de la société"
 FIN_freeslot_desc:0 "La religion s'en va"
 FIN_Imitate_Swedish_welfare:0 "Imitez le système de protection sociale suédois"
 FIN_Imitate_Swedish_welfare_desc:0 "Notre voisin de l'Ouest a de bonnes idées en matière d'aide sociale. Nous devrions essayer d'en imiter quelques-uns ici."
 FIN_advocate_for_church_gov_seperation:0 "Commencer la séparation de l'Église et de l'État"
 FIN_advocate_for_church_gov_seperation_desc:0 "\"La religion doit être déclarée privée. L'Église doit être séparée de l'État, et les communautés ecclésiastiques et religieuses doivent être considérées comme des associations privées qui organisent leurs propres affaires intérieures. L'éducation religieuse doit être éliminée des écoles.\"\n-Du programme Forssa du Parti social-démocrate de Finlande"
 FIN_two_german_policy:0 "La politique des deux Allemagnes"
 FIN_two_german_policy_desc:0 "Kahden Saksan politiikka (Politique des deux Allemagnes) fait référence à la politique visant à équilibrer nos relations avec les deux Allemagnes. Il est cependant hors de question pour l'instant de reconnaître l'un ou l'autre."
 FIN_scandinavian_exhange_program:0 "Programme d'échange d'étudiants nordiques"
 FIN_scandinavian_exhange_program_desc:0 "Nous devrions suggérer un programme d'échange d'étudiants nordiques."
 FIN_relax_censorship_laws:0 "Assouplir les lois sur la censure"
 FIN_relax_censorship_laws_desc:0 "Une grande partie de nos lois de censure sont en place soit pour apaiser les Soviétiques, soit pour « protéger le public contre les oeuvres moralement répréhensibles, obscènes, violentes ou mentalement nuisibles qui pourraient mettre en danger l'ordre et la sécurité publics, la défense nationale ou nuire aux relations du pays avec les puissances étrangères. » Nous devons maintenant assouplir ces lois pour permettre une plus grande liberté de la presse et des médias. Une certaine censure sera toutefois maintenue."
 FIN_accept_cia_funding:0 "Acceptez le financement secret de la CIA"
 FIN_accept_cia_funding_desc:0 "§RHUIPPUSALAINEN/TOP SECRET§!\n\nNotre parti, les sociaux-démocrates, reçoit des fonds de la CIA depuis 1949. Mais maintenant, ils nous ont proposé un nouvel accord. En échange de l'autorisation des agents de la CIA à entrer dans le pays, ils seraient prêts à « nous remplir les poches » avec des fonds supplémentaires et des renseignements militaires."
 FIN_tyollisyystyot:0 "Työllistymisohjelma"
 FIN_tyollisyystyot_desc:0 "Työllistymisohjelma (Programme d'emploi) est une idée proposée dans laquelle le gouvernement propose des emplois simples pour réduire le chômage.\nCela prendra 1 milliard de votre budget."
 FIN_strengthen_the_party:0 "Renforcer le parti"
 FIN_strengthen_the_party_desc:0 "Nous devons veiller à ce que notre parti reste pertinent dans la politique finlandaise."
 FIN_nordic_democracy:0 "Vapaa, Vankka, Vakaa"
 FIN_nordic_democracy_desc:0 "Libre, fort, stable"
 FIN_foster_soviet_relations:0 "Critiquer légèrement l'Union soviétique"
 FIN_foster_soviet_relations_desc:0 "Nous ne pouvons pas nous laisser intimider par qui que ce soit, s'il est plus fort que nous."
 FIN_Block_Communist_influences:0 "Bloquer les influences communistes"
 FIN_Block_Communist_influences_desc:0 "Nous devons veiller à ce que les communistes n'acquièrent pas trop de pouvoir."
 FIN_improve_farms:0 "Améliorer les fermes"
 FIN_Increase_Soviet_Ties_desc:0 "Nous devons nous assurer que les Soviétiques sont amicaux à notre égard."
 
 #tooltip
 fin_karelia:0 "Bien que cela soit peu probable, nous avons rédigé une proposition aux Soviétiques pour le retour de la Carélie."
 fin_critique_right_tt:0 "Nous ne savons pas dans quelle mesure le discours aura un effet, voire pas du tout."
 kuusinen1:0 "Hertta Kuusinen succède à Mauno Pekkala"
 korean_inflation:0 "Nous avons une crise d'inflation"
 FIN_Increase_Banking_Regulations_desc:0 "L'inflation d'après-guerre, les prêts à la reconstruction et la volatilité des prix des matières premières nécessitent une surveillance plus stricte des ratios de crédit commercial et de réserves. En renforçant le mandat réglementaire de la Banque de Finlande, nous stabilisons la monnaie, protégeons l'épargne des déposants et freinons les excès spéculatifs."
