conquest.1.t:0 "[GetNewspaperHeader]La chute d'Helsinki"
 conquest.1.d:0 "Après d'intenses combats, la capitale de la Finlande est tombée aux mains des Soviétiques. Même si des coups de feu peuvent encore être entendus, les Soviétiques défilent dans Mannerheimintie sous les yeux choqués et incrédules des citoyens.\n\nTous les drapeaux finlandais ont été remplacés par des drapeaux soviétiques et un gouvernement d'occupation a été installé au Parlement."
 conquest.1.a:0 "Sisu ne les a pas aidés cette fois"
 conquest.1.b:0 "Encore une victoire pour la patrie."
 conquest.1.c:0 "Perkele!"
 
