 FOCUS_LIBERATE_HAINAN_TOOLTIP:0 "Vite commandant ! Nous devons libérer Hainan ! Accédez à vos décisions IMMÉDIATEMENT après cela !"
 PRC_Victory:0 "Le Parti communiste chinois a gagné la guerre civile chinoise."
 PRC_Liberating_Hainan:0 "L'Armée populaire de libération lance une attaque contre Hainan."
