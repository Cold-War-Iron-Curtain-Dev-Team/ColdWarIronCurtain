 ##Focuses
 PRC_50s_Launch_The_Crossing_Yangtze_River_Campaign_Interim:0 "La campagne de traversée du fleuve Yangtze"
 PRC_50s_Launch_The_Crossing_Yangtze_River_Campaign_Interim_desc:0 "Notre appel final a commencé. Nous avons anéanti l'ennemi lors de la campagne de Huaihai, détruit ses forces autour de Jinzhou lors de la campagne de Liaoshen et unifié la plupart de nos forces dans le nord-est. Il est maintenant temps pour nous de reprendre notre patrie et de libérer les ouvriers, les paysans et le prolétariat ! En avant frères !"
 PRC_50s_Accept_Governance_Across_The_Yangtze_River:0 "Accepter la gouvernance du Guomindang"
 PRC_50s_Accept_Governance_Across_The_Yangtze_River_desc:0 "Afin d'avoir une trêve avec nous, Li Zongren, président par intérim du gouvernement du Kuomintang, a avancé l'idée d'une trêve de « division de la gouvernance à travers le fleuve Yangtze », c'est-à-dire que le gouvernement communiste chinois et le gouvernement nationaliste cesseraient la guerre sur place avec le fleuve Yangtze comme frontière. Afin de permettre au peuple et au pays de se rétablir et d'éliminer d'un seul coup les réactionnaires du Kuomintang à l'avenir, nous ne pouvons qu'accepter cette condition. "
 PRC_50s_The_Final_Push:0 "Notre ultime effort vers la libération"
 PRC_50s_The_Final_Push_desc:0 "Nous balayerons les restes de traîtres et réunifierons notre grande patrie sous une seule bannière. La lutte a été longue, mais la victoire finale est à notre portée. La Chine se relèvera, unie et incassable."
 PRC_50s_March_To_The_Southwest:0 "Marche vers le sud-ouest"
 PRC_50s_March_To_The_Southwest_desc:0 "Fortes de l'élan de notre côté, les forces de libération jettent désormais leur dévolu sur le Sud-Ouest accidenté et divisé. Ces territoires, toujours détenus par des restes réactionnaires, restent un obstacle à la pleine unification de la nation. Le terrain est accidenté, la logistique difficile et les poches de résistance persistent, mais la valeur stratégique de la région ne peut être surestimée.\n\nNos commandants se préparent à une avance coordonnée à travers les montagnes, les vallées fluviales et les villes contestées. Chaque mesure prise permettra de sécuriser les routes d'approvisionnement vitales, de rallier les partisans locaux et de renforcer notre emprise sur le front sud de la campagne. La marche sera difficile, mais essentielle pour mener à bien la cause révolutionnaire."
 PRC_50s_Liberate_Kunming:0 "Libérer Kunming"
 PRC_50s_Liberate_Guangxi:0 "Libérer le Guangxi"
 PRC_50s_Reach_South_China_Sea:0 "Pour atteindre la mer de Chine méridionale"
 PRC_50s_The_Three_District_Revolution:0 "La révolution des trois districts"
 PRC_50s_Peacefully_Liberate_Urumqi_Campaign:0 "Libérer pacifiquement Urumqi"
 PRC_50s_Begin_Establishment_of_PCCX:0 "Créer le Corps de production et de construction du Xinjiang"
 PRC_50s_Integrate_the_three_districts_government:0 "Intégrer le gouvernement des trois districts"
 PRC_50s_Unite_The_National_Bourgeoisie_Interim:0 "Unir la bourgeoisie nationale"
 PRC_50s_Prepare_for_the_First_CPPCC_Interim:0 "Préparatifs de la première Conférence consultative politique du peuple chinois"
 PRC_50s_Production_Assurance_of_Newly_Receiving_Enterprises_Interim:0 "Assurer la production des entreprises nouvellement accueillies"
 PRC_50s_Foundation_of_the_Peoples_Republic_of_China:0 "la Fondation de la République populaire de Chine"
 PRC_50s_Liberate_Kunming_desc:0 "La libération de Kunming est une étape cruciale pour briser la résistance restante dans le sud-ouest. En progressant dans le Yunnan, nous sécurisons les routes d'approvisionnement vitales, éliminons l'influence des seigneurs de guerre et apportons la stabilité tant attendue à la région. Le succès ici renforcera considérablement notre position dans la lutte nationale."
 PRC_50s_Liberate_Guangxi_desc:0 "Le Guangxi reste l'un des derniers bastions d'une opposition retranchée. En libérant la région, nous sécurisons des ressources agricoles et industrielles clés tout en démantelant l'influence des factions rivales. Cette campagne rapprochera encore davantage l'unité."
 PRC_50s_Reach_South_China_Sea_desc:0 "Atteindre la mer de Chine méridionale marque le point culminant de nos efforts de libération du Sud. En sécurisant le littoral, nous garantissons un accès maritime stratégique, renforçons les réseaux logistiques et empêchons les forces ennemies restantes de rechercher un soutien étranger."
 PRC_50s_The_Three_Districts_Revolution_desc:0 "Les trois districts d'Ili, Tacheng et Altay recèlent un grand potentiel révolutionnaire. En soutenant et en guidant les mouvements dans ces régions, nous approfondirons notre influence dans le nord-ouest et poserons les bases d'une future intégration dans la nouvelle Chine."
 PRC_50s_Peacefully_Liberate_Urumqi_Campaign_desc:0 "Une libération pacifique d'Urumqi est possible grâce à la négociation, à la diplomatie et à une pression politique prudente. En cas de succès, cela épargnera à la région de nouvelles souffrances et démontrera notre engagement en faveur de l'unité sans effusion de sang inutile."
 PRC_50s_Begin_Establishment_of_PCCX_desc:0 "Pour garantir la stabilité à long terme au Xinjiang, nous devons créer le Corps de production et de construction du Xinjiang. Cette organisation combinera discipline militaire et développement agricole et industriel, renforçant la sécurité des frontières tout en favorisant la croissance économique."
 PRC_50s_Integrate_the_three_districts_government_desc:0 "Le contrôle du Xinjiang étant assuré, nous devons désormais intégrer le gouvernement des Trois Districts dans la structure nationale. Un système administratif unifié éliminera la fragmentation et alignera la région sur les politiques de la nouvelle Chine."
 PRC_50s_Unite_The_National_Bourgeoisie_Interim_desc:0 "La bourgeoisie nationale exerce toujours une influence économique importante. En choisissant la coopération plutôt que la confrontation pendant cette période de transition, nous maintenons la stabilité industrielle et veillons à ce que toutes les forces productives contribuent à la reconstruction nationale."
 PRC_50s_Prepare_for_the_First_CPPCC_Interim_desc:0 "La première Conférence consultative politique du peuple chinois définira le cadre du nouvel État. Des préparatifs doivent être faits pour rassembler des représentants de tous les partis démocratiques, des organisations de masse et des classes sociales afin d'établir un large front d'unité nationale."
 PRC_50s_Production_Assurance_of_Newly_Receiving_Enterprises_Interim_desc:0 "Les entreprises passant sous le contrôle de l'État, leur production doit rester ininterrompue. Grâce aux conseils, à la supervision et au soutien des travailleurs, nous veillons à ce que les usines continuent de fonctionner efficacement tout au long de la transition."
 PRC_50s_Foundation_of_the_Peoples_Republic_of_China_desc:0 "La longue lutte révolutionnaire touche à sa conclusion triomphale. Une fois la victoire assurée et la gouvernance consolidée, le moment est venu de déclarer la fondation de la République populaire de Chine. Une nouvelle ère s'ouvre pour le peuple chinois."

 ##Ideas
 PRC_50s_Southwest_Offensive_Spirit:0 "Esprit offensif du sud-ouest"
 PRC_PRC_PLA_Ground_Force:0 "L'Armée populaire de libération"
 
