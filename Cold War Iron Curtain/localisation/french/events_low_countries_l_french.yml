l_french:
 northseaflood.1.d:0 "Une tempête majeure frappa les îles britanniques et les Pays-Bas le 31 janvier 1953, provoquant une inondation et de graves dégâts. Faisant 2 551 morts, principalement aux Pays-Bas et en Belgique, la tempête a provoqué des inondations atteignant 18,4 pieds au-dessus du niveau de la mer, plongeant 527 milles carrés de terres agricoles néerlandaises sous l'eau. De nombreuses digues ou digues ont été brisées, provoquant l'évacuation de 70 000 personnes. L'armée américaine a envoyé des hélicoptères pour aider aux secours et la Croix-Rouge a été submergée de dons. On a également parlé d'un projet connu sous le nom de Delta Works, visant à protéger les principaux estuaires des rivières et à empêcher qu'une tragédie de cette ampleur ne se reproduise."
 northseaflood.2.d:0 "Une onde de tempête a provoqué la plus grande inondation de notre vie, car nos principales défenses maritimes se sont toutes brisées, provoquant des inondations massives en Zélande et en Hollande méridionale. Malgré les avertissements des autorités locales du Rijkswaterstaat, les rapports n'ont donné aucune alerte aux résidences du pays, ce qui a entraîné une vague d'inondations inattendue qui a tué 1 836 personnes et laissé des dizaines de milliers de personnes déplacées et sans abri. Avec 9 % des terres agricoles de notre pays inondées, des dizaines de milliers de têtes de bétail tuées et des dizaines de milliers de bâtiments détruits, cela sera un coup de pied dans les dents lors de notre reconstruction après la Seconde Guerre mondiale."
 northseaflood.3.d:0 "Des inondations massives ont eu lieu sur notre côte est, alors que des vagues allant du Kent à l'est de l'Écosse ont tué des centaines de personnes. Même s'ils ne sont pas aussi touchés que notre voisin d'outre-Manche, les dégâts ne peuvent être sous-estimés. Il s'agit de la pire inondation de ce chapitre de l'histoire avec des dizaines de milliers de personnes déplacées ; nous aurons besoin d'un effort concerté pour réparer les dégâts. Des discussions sont déjà en cours au Parlement pour éviter à nouveau une telle catastrophe."
 northseaflood.4.d:0 "Les Flamands ne font que réagir au choc immédiat de cette catastrophe naturelle inattendue. Nos digues près d'Anvers ont été entièrement percées et détruites, causant des dégâts sur toute la côte nord-est de la Flandre. Cependant, heureusement, très peu de personnes sont mortes dans notre pays par rapport aux Pays-Bas et au Royaume-Uni et nos dégâts sont également difficilement comparables, notre rétablissement sera donc loin d'être aussi difficile."