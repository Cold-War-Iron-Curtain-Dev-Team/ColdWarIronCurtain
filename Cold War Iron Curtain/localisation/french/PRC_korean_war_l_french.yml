 korean_war_devastation:0 "Dévastation de la guerre de Corée"
 korean_war_devastation_tt:0 "La péninsule coréenne subira une dévastation physique extrême avec cette décision et, dans quelques mois, la région pourrait ne plus disposer des infrastructures appropriées pour réaliser des progrès continus."
 Korean_War_Devastation_2_TT:0 "\nEn raison de la vaste campagne de bombardements menée par les Américains, la grande majorité des bâtiments industriels, des infrastructures et des bâtiments agricoles ont été endommagés de manière irréparable. De plus, en raison du bombardement des barrages, la famine est désormais imminente en raison des inondations massives des terres agricoles et des mauvaises récoltes qui en résultent..."
 Firebombing_Devastation:0 "Dévastation des bombes incendiaires"
 korean_war_devastation.1.d:0 "Les espoirs des Nord-Coréens qu'une intervention chinoise conduise à l'unification de la Corée semblent anéantis alors que les forces de l'ONU ont stoppé leur avancée. Malheureusement pour l'ONU, elle est confrontée à un problème similaire alors que les efforts de contre-attaque continuent de stagner alors que le front semble de plus en plus statique. Jusqu'à présent, l'introduction de nouvelles forces dans la guerre de Corée n'a pas réussi à inverser la tendance, qu'il s'agisse de l'intervention initiale de l'ONU ou de la Chine. Les dirigeants des deux camps continuent de promettre une avancée décisive, mais à mesure que le front se solidifie, le résultat net semble être davantage de violence et de dévastation sur la population coréenne et ses villes."
 kwp_party_strength:0 "Force du Parti des travailleurs de Corée"
 korean_war_devastation.2.d:0 "Les États-Unis ont lancé une campagne de bombardements massifs contre la Corée du Nord. Le commandement des Nations Unies a déclaré que les bombardiers visaient les lignes d'approvisionnement et les centres industriels nord-coréens. Ils n'ont pas tardé à souligner que les bombardements visaient à mettre un terme à l'agression pure et simple de la Corée du Nord et à l'empêcher de poursuivre ses opérations offensives. Le gouvernement nord-coréen a condamné dans sa propre déclaration ces bombardements intenses, affirmant qu'ils étaient aveugles et causaient d'énormes pertes civiles. Le communiqué ajoute que les bombardements sont un signe du désespoir occidental et que le peuple nord-coréen poursuivra sa mission sacrée. La campagne massive de bombardements aériens marque une nouvelle escalade du conflit en Asie de l'Est."
 korean_war_devastation.3.d:0 "Les lâches chiens impérialistes ont commencé à bombarder aveuglement nos villes et nos routes. Cela vise sans aucun doute à ébranler la volonté de notre peuple et à maximiser l'effusion du sang innocent. Cependant, ils sous-estiment notre détermination et, au lieu d'affaiblir le peuple, cela ne fera que renforcer sa détermination à accomplir la mission. Nos chefs militaires préviennent que les bombardements auront un impact sur l'approvisionnement en troupes et la production d'armes, mais promettent que l'armée du peuple continuera à persévérer. Nos conseillers en affaires étrangères notent que les bombardements indiquent le désespoir de l'ennemi et que nous devons faire connaître le massacre flagrant de notre peuple pour affaiblir sa détermination."

