l_french:
 VIN_All_In_Luang_Prabang:0 "Tout pour Luang Prabang"
 VIN_All_In_Luang_Prabang_desc:0 "Hanoï peut envoyer le Pathet Lao dans le Royaume avec une colonne modeste et une visée limitée, ou bien il peut miser toute la saison sur la capitale royale. C'est le choix le plus lourd : Luang Prabang d'abord, la route de Vientiane ensuite, et tous les porteurs du Viet Bac s'étalent le long d'un couloir qu'aucun plan logistique ne peut vraiment tenir.\n\nCela remplace l'offensive ordinaire du Laos ; les deux ne peuvent pas être pris tous les deux."
VIN_All_In_Luang_Prabang_tt:0 "Le Viet Minh envoie immédiatement le Pathet Lao avec §Y3 divisions supplémentaires§!, un §Ydélai de 30 jours plus long§! et Luang Prabang en premier. L'offensive ordinaire du Laos n'est pas proposée. Cela coûte §R40 ravitaillement de campagne§!.\nVientiane et Luang Prabang doivent être prises. Les troupes du Viet Minh au-delà de Luang Prabang subissent une surextension du couloir profond de §R§!.\nSi le Royaume tombe : §G+40 Lutte communiste§! et §G+10 Ravitaillement de campagne§! pour Lai Chau et Dien Bien Phu. Sinon : §R-50 Campagne Supply§! et le CEFEO paie §G15 Crédits de Guerre en moins§! pour Castor."
 VIN_Campaign_Overextension_Severe:0 "Surextension du couloir profond"
 VIN_Campaign_Overextension_Severe_desc:0 "Les colonnes tiennent le terrain bien au-delà de toute route qu'elles peuvent emprunter. Les convois disparaissent dans les collines, les unités arrivent en morceaux et chaque nouvelle vallée conquise coûte plus cher que la précédente.\n\nRetirez-vous des profondeurs ou mettez fin à l'offensive du couloir pour supprimer cette pénalité. Il remplace la surextension ordinaire tant que cela dure."
 Laos_All_In_Luang_Prabang_Chosen:0 "Le Viet Minh a tout misé sur §YLuang Prabang§!"
 Laos_All_In_Luang_Prabang_Active:0 "L'offensive §YLuang Prabang§! est en cours"
 Laos_All_In_Luang_Prabang_Resolved:0 "L'offensive §YLuang Prabang§! est terminée"
 VIN_All_In_Luang_Prabang_Corridor:0 "Le corridor §YLuang Prabang§! est étiré"
 VIN_All_In_Luang_Prabang_Result_Success:0 "Le Viet Minh prend le royaume du Laos"
 VIN_All_In_Luang_Prabang_Result_Failure:0 "Le Viet Minh n'a pas réussi à prendre le royaume du Laos"
 VIN_All_In_Luang_Prabang_Result_Superseded:0 "L'offensive de Luang Prabang est dépassée à la fin de la guerre"
 VIN_All_In_Luang_Prabang_Corridor_Credited_Lai_Chau:0 "Le corridor du Laos a déjà facilité le déplacement sur Lai Chau"
 VIN_All_In_Luang_Prabang_Corridor_Credited_Dien_Bien:0 "Le corridor du Laos a déjà facilité la campagne de Dien Bien Phu"
 FRE_Luang_Prabang_Callback:0 "L'échec de l'attaque du Viet Minh à Luang Prabang réduit l'opération Castor"
