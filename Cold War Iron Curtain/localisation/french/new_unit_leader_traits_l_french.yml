 ##########ADMIRAL360 added this traits##########
 #KOR#
 incompetent_officer:0 "Officier incompétent"
 incompetent_officer_desc:0 "§LCet officier n'est pas doué pour commander quoi que ce soit. S'il atteint le niveau 6, ce trait sera supprimé.§!"
 young_officer:0 "Jeune Officier"
 young_officer_desc:0 "§LCet officier est récemment promu et apprendra plus vite que les autres. S'il atteint le niveau 6, ce trait sera supprimé.§!"
 honorary_position:0 "Poste honorifique"
 honorary_position_desc:0 "§LCet officier ne sert pas officiellement le pays. Ou bien, il est simplement occupé avec d'autres choses. Quoi qu'il en soit, il n'est pas qualifié pour ce rang. S'il atteint le niveau 6, ce trait sera supprimé.§!"
 japan_army:0 "Armée japonaise"
 japan_army_desc:0 "Cet officier est servi dans l'armée japonaise."
 japan_officer:0 "Officier du Japon"
 japan_officer_desc:0 "Cet officier est servi au Japon en tant qu'officier."
 japan_officer_turned:0 "Devenu officier du Japon"
 japan_officer_turned_desc:0 "Cet officier a servi au Japon en tant qu'officier, mais a changé d'avis."
 japan_personnel:0 "Personnel japonais"
 japan_personnel_desc:0 "Cet officier est servi au Japon en tant que personnel."
 manchukuo_army:0 "Armée du Mandchoukouo"
 manchukuo_army_desc:0 "Cet officier est servi dans l'armée du Mandchoukouo. L'officier entretient généralement de mauvaises relations avec d'anciens combattants indépendantistes, car il a servi dans le groupe de travail Kando et a battu des combattants indépendantistes. Ils sont également impliqués dans de nombreuses controverses."
 manchukuo_army_military_academy:0 "Formé à l'Académie militaire de l'armée du Mandchoukouo"
 manchukuo_army_military_academy_desc:0 "Cet officier a été formé à l'Académie militaire du Mandchoukouo. Il est optimisé pour tabasser les militants indépendantistes."
 junggun_faction:0 "Faction Junggun"
 junggun_faction_desc:0 "Cet officier fait partie de la faction junggun. Les principaux personnages incluent Song Yo-chan, Park Chung-hee et Won Yong-deok, et comme ils sont des factions de l'ancienne armée du Mandchoukouo, ils sont les principaux personnages de l'ancienne armée du Mandchoukouo."
 hamgyeongdo_faction:0 "Faction Hamgyeong-do"
 hamgyeongdo_faction_desc:0 "Cet officier fait partie de la faction hamgyeong-do. Les principaux personnages incluent Chung Il-kwon, et comme ils appartiennent à des factions de l'ancienne armée du Mandchoukouo, ils sont les principaux personnages de l'ancienne armée du Mandchoukouo."
 seobuk_faction:0 "Faction Seobuk"
 seobuk_faction_desc:0 "Cet officier fait partie de la faction Seobuk. Les principaux personnages incluent Paik Sun-yup, son frère Paik In-yup et Chang Do-yong, et comme ils appartiennent à des factions de l'ancienne armée du Mandchoukouo, ils sont les principaux personnages de l'ancienne armée du Mandchoukouo."
 jungnambu_faction:0 "Faction Jungnambu"
 jungnambu_faction_desc:0 "Cet officier fait partie de la faction jungnambu. Les principaux personnages incluent Lee Hyung-geun, Park Byung-kwon et Kim Jong-oh, et même s'ils appartiennent à des factions de l'ancienne armée du Mandchoukouo, cette faction ne comprend pas autant d'anciens officiers de l'armée du Mandchoukouo."
 kpg:0 "Gouvernement provisoire de la République de Corée (KPG)"
 kpg_desc:0 "Cet officier faisait partie du gouvernement provisoire de la République de Corée."
 korean_revolutionary_army:0 "Armée révolutionnaire coréenne"
 korean_revolutionary_army_desc:0 "Cet officier faisait partie de l'Armée révolutionnaire coréenne."
 korean_independence_army:0 "Armée indépendantiste coréenne"
 korean_independence_army_desc:0 "Cet officier faisait partie de l'Armée indépendantiste coréenne."
 korean_liberation_army:0 "Armée de libération coréenne"
 korean_liberation_army_desc:0 "Cet officier faisait partie de l'Armée de libération coréenne."
 korean_constabulary:0 "Police coréenne"
 korean_constabulary_desc:0 "Cet officier faisait partie de la police coréenne. La police coréenne est devenue la base de la création des forces armées coréennes, et cet officier en faisait partie."
 national_revolutionary_army:0 "Armée Nationale Révolutionnaire"
 national_revolutionary_army_desc:0 "Cet officier faisait partie de l'Armée Nationale Révolutionnaire. L'officier a également de fortes chances d'avoir des liens avec le Kuomintang chinois."
 nra_military_academy:0 "Formé à l'Académie Nationale de l'Armée Révolutionnaire"
 nra_military_academy_desc:0 "Cet officier a été formé à l'Académie nationale de l'Armée révolutionnaire."
 korean_national_youth_corps:0 "Corps national coréen de la jeunesse"
 korean_national_youth_corps_desc:0 "Cet officier fait partie du Corps national coréen de la jeunesse. L'organisation a été créée par Lee Beom-seok autour de la zone de la 2e Armée de libération et, selon la volonté du chef Lee Beom-seok, il n'y a eu aucune activité terroriste et il n'y a eu aucun conflit avec d'autres organisations."
 syngman_rhee_loyalist:0 "Syngman Rhee loyaliste"
 syngman_rhee_loyalist_desc:0 "Les loyalistes de Syngman Rhee sont ceux qui sont fidèles à Syngman Rhee. Leurs origines sont des forces indépendantes, chinoises, japonaises et mandchoues, et ils sont fidèles à Syngman Rhee plutôt qu'à leurs forces d'arrière-plan d'origine et forment des factions distinctes. La plupart d'entre eux occupent des postes importants dans l'armée, et ils sont rapidement promus car ils ont les faveurs de Rhee Syngman. En outre, ils contrôlent les agences d'enquête et de contre-espionnage de l'armée, telles que le KACIC (Korea Army Intelligence Agency Special Task Force) et la police militaire de l'armée, de sorte que de nombreux militaires les détestent et sont déterminés à les punir ou à les éliminer sans que personne ne le sache. Si Syngman Rhee tombe, leur situation sera assez §Rdifficile.§!"
 military_language_school:0 "École de langues militaire"
 military_language_school_desc:0 "Cet officier a fréquenté l'école de langue militaire."
 korea_military_academy:0 "Académie militaire coréenne"
 korea_military_academy_desc:0 "Cet officier faisait partie de l'Académie militaire coréenne ou y était formé."
 mp:0 "Police militaire"
 mp_desc:0 "Cet officier a été formé pour devenir policier militaire."
 republic_of_korea_naval_academy:0 "Académie navale de la République de Corée"
 republic_of_korea_naval_academy_desc:0 "Cet officier était formé à l'Académie navale de la République de Corée."
 #KPA#
 communist_party_of_korea:0 "Parti communiste de Corée"
 communist_party_of_korea_desc:0 "Cet officier faisait partie du Parti communiste de Corée."
 workers_party_of_south_korea:0 "Parti des travailleurs de Corée du Sud."
 workers_party_of_south_korea_desc:0 "Cet officier faisait partie du Parti des travailleurs de Corée du Sud."
 korean_peoples_guerrilla:0 "Guérilla populaire coréenne"
 korean_peoples_guerrilla_desc:0 "Cet officier faisait partie de la guérilla populaire coréenne."
 korean_volunteer:0 "Volontaire coréen"
 korean_volunteer_desc:0 "Cet officier faisait partie des Volontaires Coréens."
 northeast_anti_japanese_army:0 "Armée anti-japonaise du Nord-Est"
 northeast_anti_japanese_army_desc:0 "Cet officier faisait partie de l'Armée anti-japonaise du Nord-Est."
 soviet_army:0 "Armée soviétique"
 soviet_army_desc:0 "Cet officier faisait partie de l'armée soviétique."
 soviet_navy:0 "Marine soviétique"
 soviet_navy_desc:0 "Cet officier faisait partie de la marine soviétique."
 peoples_liberation_army:0 "Armée populaire de libération"
 peoples_liberation_army_desc:0 "Cet officier faisait partie de l'Armée populaire de libération."
 communist_party_of_china:0 "Parti communiste chinois"
 communist_party_of_china_desc:0 "Cet officier faisait partie du Parti communiste chinois."
 guknae_faction:0 "Faction Guknae"
 guknae_faction_desc:0 "Cet officier fait partie de la faction guknae. Un groupe qui s'est engagé dans des mouvements anti-japonais et des activités communistes en Corée pendant l'ère coloniale japonaise, comprenant Kim Sam-ryong, Lee Ju-ha, Lee Kang-guk, Lee Seung-yeop, Heo Heon et Lee Hyun-sang, centré sur Park Heon-young. Immédiatement après la défaite de la domination coloniale japonaise, ils ont reconstruit le Parti communiste de Corée et ont dirigé la déclaration de création de la République populaire de Corée en septembre 1945, se vantant d'un pouvoir si énorme qu'ils se considéraient comme 100 000 membres d'élite et 1 million d'organisations frontalières. Le groupe, dirigé par Park Heon-young, a initialement maintenu sa coopération avec la droite et le gouvernement militaire américain, mais après la réunion de la troisième phase à Moscou, sa position publique s'est rétrécie et le gouvernement militaire américain a commencé à réprimer la gauche. Finalement, lorsque le Parti communiste coréen a été interdit, des milliers de dirigeants et de membres d'élite du parti, dont Park Hen-yong et Ri Sung-Yop, ont fait défection en Corée du Nord."
 kapsan_faction:0 "Faction Kapsan"
 kapsan_faction_desc:0 "Cet officier fait partie de la faction Kapsan. Il s'agit d'un groupe actif dans la partie nord de la péninsule coréenne dans les années 1930 et 1940, comprenant Park Geum-cheol, Ri Hyo-soon, Ri Song-un et Kim Wal-ryong. Beaucoup d'entre eux viennent de Kapsan-gun, Hamgyeongnam-do, c'est pourquoi ils sont appelés « Kapsanpa ». Ils ont été actifs en relation avec la faction mandchoue tout au long de l'ère coloniale japonaise et étaient avec la faction mandchoue même après la libération, ils sont donc largement considérés comme faisant partie de la faction mandchoue. Si le partisan est une ligne directe de la faction mandchoue, cela peut être compris comme une frontière."
 manju_faction:0 "Faction Manju"
 manju_faction_desc:0 "Cet officier fait partie de la faction manju. Il s'agit d'un groupe qui a mené des mouvements anti-indépendantistes japonais et des activités partisanes armées en Mandchourie dans les années 1930, notamment Kim Il-sung, Kim Chaek, Kim Kwang-hyeop, Choi Yong-gun et Kang Kon. Après avoir rejoint le Parti communiste chinois conformément au principe d'un pays et d'un parti du Komintern, ils ont travaillé en tant que membres de la Coalition anti-japonaise du Nord-Est, une unité armée anti-japonaise composée de Chinois et de Coréens. On dit qu'ils ont créé un organisme de propagande unifié appelé Association de libération Cho Kuk en Corée, mais sa crédibilité et sa taille sont largement remises en question. Ils ont mené la bataille de Bocheonbo et de Gansambong pendant la lutte armée anti-japonaise en Mandchourie, et ont progressivement fui vers la province maritime soviétique en 1940 alors que l'assujettissement des partisans japonais s'intensifiait à la fin des années 1930. Après avoir reçu le grade d'officier soviétique, il a été incorporé dans la 88e brigade de tir de l'armée d'Extrême-Orient pour y suivre une formation militaire, mais lorsque les Japonais ont été vaincus et que l'armée soviétique a occupé la partie nord de la péninsule coréenne, il est entré en Corée du Nord en tant qu'officier soviétique en octobre 1945. Depuis lors, avec le soutien du petit gouvernement militaire, il a pris le noyau du parti Joseon Rodong et de l'armée populaire coréenne, et Kim Il-sung a pris le pouvoir réel en tant que Premier ministre du Cabinet. Ils suivirent les troupes soviétiques en Corée du Nord. L'alliance militaire sino-coréenne qui s'est poursuivie jusqu'à présent est une alliance de sang qui a cette racine historique."
 soryeon_faction:0 "Faction Soryeon"
 soryeon_faction_desc:0 "Cet officier fait partie de la faction soryeon. Des groupes de l'Union soviétique tels que Park Chang-ok, Heo Yong-yi, Nam Il, Bang Hak-se et Jung Sang-jin. Il s'agit principalement de deuxième et troisième générations de Goryeo vivant en Asie centrale et dans les États de Primorsky. Lorsque les troupes soviétiques sont entrées en Corée du Nord, elles sont entrées en Corée du Nord à la recherche de membres du Parti communiste soviétique capables de communiquer avec la population locale."
 yeonan_faction:0 "Faction Yeon'an"
 yeonan_faction_desc:0 "Cet officier fait partie d'une faction. Comme Kim Tu-bong, Kim Moo-jung, Heo Jung-sook, Choi Chang-ik, Yoon Gong-heum, Park Il-woo, Seo Hwi et Pang Ho-san, le groupe a participé à la guerre anti-japonaise et à la guerre civile aérienne nationale en Chine continentale. Depuis la fin des années 1930, nombre d'entre eux ont été directement ou indirectement liés au Parti communiste chinois, ou ont été actifs en tant que responsables du Parti communiste chinois, comme Kim Moo-jung. Pour cette raison, elle est appelée Yeonanpa en hommage à Yeonan, la capitale du Parti communiste chinois pendant la guerre civile nationale."
 #CHI#
 CHI_communist_sympathies:0 "Sympathies communistes"
 CHI_communist_sympathies_desc:0 "L'officier envisage de changer de camp. L'officier ne peut pas être communiste ni même être en désaccord avec les idées communistes ou socialistes. Cependant, si l'on considère son mécontentement à l'égard du Parti nationaliste, sa survie lorsqu'il perd une guerre civile et sa richesse dans la vie, cet officier pourrait nous trahir et rejoindre les Rouges pendant la guerre. Peut-être pouvons-nous empêcher sa trahison en défendant le territoire de son seigneur de guerre ou sa ville natale. En tout cas, sa loyauté à notre égard ne semble pas grande. §RNous. Doit. Être. Vigilant. Contre. Lui.§L"
