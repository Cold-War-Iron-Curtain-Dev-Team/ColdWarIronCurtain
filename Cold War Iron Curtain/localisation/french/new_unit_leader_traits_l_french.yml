 panthai_ultranationalist:0 "Ultranationaliste panthaïlandais"
 panthai_ultranationalist_desc:0 "son officier fait partie de la faction de Plaek Phibunsongkhram et souscrit à son idée ultranationaliste pan-thaïenne."
 monarchy_of_thailand_royalist:0 "Royalistes thaïlandais"
 monarchy_of_thailand_royalist_desc:0 "Cet officier est fidèle à la monarchie thaïlandaise et supprimera toute activité anti-mornachy"
 khana_ratsadon:0 "Khana Ratsadon"
 khana_ratsadon_desc:0 "Cet officier fait partie de la faction Khana Ratsadon et souhaite former une République thaïlandaise."
 CAM_Royalist:0 "Pro-Sihanouk"
 CAM_Royalist_desc:0 "Fidèle à la vision de neutralité et d'unité cambodgienne du prince Norodom Sihanouk. Il considère Sihanouk comme un symbole d'identité nationale et de résistance à la domination étrangère."
 CAM_Republican:0 "Républicain"
 CAM_Republican_desc:0 "Croit en une démocratie parlementaire dirigée par des civils, libre de toute monarchie ou régime autoritaire. Plaide pour la gouvernance républicaine comme voie vers la stabilité nationale et l'autodétermination."
 CAM_Republican_navy:0 "Républicain"
 CAM_Republican_navy_desc:0 "Croit en une démocratie parlementaire dirigée par des civils, libre de toute monarchie ou régime autoritaire. Plaide pour la gouvernance républicaine comme voie vers la stabilité nationale et l'autodétermination."
 SEA_Pro_America:0 "Pro-américain"
 SEA_Pro_America_desc:0 "Soutient des liens solides avec les États-Unis, valorisant l'aide militaire américaine, la position anticommuniste et l'assistance économique comme étant cruciales pour garantir la souveraineté et la modernisation de leur pays."
