l_french:

 VIN_Toan_Quoc_Khang_Chien:0 "Résistance nationale"
 VIN_Toan_Quoc_Khang_Chien_desc:0 "La nation tout entière doit s'organiser pour résister. Des montagnes du Viet Bac aux villages du delta, chaque citoyen a un rôle à jouer dans la défense de l'indépendance vietnamienne."

 VIN_1950_Trip_Beijing_Moscow:0 "Le voyage Pékin-Moscou"
 VIN_1950_Trip_Beijing_Moscow_desc:0 "Une victoire révolutionnaire en Chine ouvre la voie à Pékin et à Moscou. La délégation d'Hô Chi Minh cherchera à obtenir de la reconnaissance, des armes, une formation et une place dans le camp socialiste."

 VIN_1950_Trip_Nanking_Moscow:0 "Le voyage Nankin-Moscou"
 VIN_1950_Trip_Nanking_Moscow_desc:0 "Une victoire nationaliste en Chine exige une stratégie diplomatique plus prudente. En engageant Nankin et Moscou, nous pouvons préserver la marge de manoeuvre de la révolution."

 VIN_Found_Tong_Cuc_Chinh_Tri:0 "Fondé le Département Politique Générale"
 VIN_Found_Tong_Cuc_Chinh_Tri_desc:0 "Une armée populaire moderne a autant besoin de cohésion politique que de fusils et de munitions. Le Département politique général portera la direction du Parti dans chaque unité."

 VIN_Learning_Hundred_Flowers_Campaign:0 "Étudiez la campagne des Cent Fleurs"
 VIN_Learning_Hundred_Flowers_Campaign_desc:0 "Le débat chinois sur la critique et la créativité offre à la fois une opportunité et un avertissement. Nous devons décider quelles leçons peuvent être adaptées aux conditions vietnamiennes."

 VIN_Closer_Ties_Chua_Meo:0 "Des liens plus étroits avec le Vua Meo"
 VIN_Closer_Ties_Chua_Meo_desc:0 "Les Vua Meo occupent un territoire vital dans les hautes terres du nord. Une coopération plus étroite renforcera la résistance locale et sécurisera la frontière montagneuse de la révolution."

 VIN_Contact_Vong_A_Sang:0 "Contacter Vong A Sang"
 VIN_Contact_Vong_A_Sang_desc:0 "Les contacts entre les peuples des hautes terres du nord peuvent élargir la coalition anticoloniale. Leurs connaissances locales et leur esprit combatif seront essentiels dans les zones frontalières difficiles."

 VIN_Dai_Hoi_II:0 "Le deuxième congrès du Parti"
 VIN_Dai_Hoi_II_desc:0 "Le Parti doit se rassembler pour définir son programme, renouveler sa direction et transformer une guerre de résistance en une révolution nationale durable."
 VIN_STL_Prepare_Coup:0 "Préparez le coup d'État"
 VIN_STL_Prepare_Coup_desc:0 "Les lettres ne changeront pas la ligne du Parti. Les partisans de Tran Ngoc Danh au Viet Bac doivent cesser de se disputer avec la direction et commencer à se préparer à la remplacer."
 VIN_STL_Contact_Moscow_Cell:0 "Contacter la cellule de Moscou"
 VIN_STL_Contact_Moscow_Cell_desc:0 "Les étudiants et cadres vietnamiens à Moscou ont entendu les accusations de Danh et certains d'entre eux les partagent. Grâce à eux, notre dossier peut atteindre les bureaux soviétiques où les envoyés de Ho Chi Minh ne se rendent jamais."
 VIN_STL_Transport_Soviet_Aid:0 "Aide soviétique aux transports"
 VIN_STL_Transport_Soviet_Aid_desc:0 "Si Moscou nous fait suffisamment confiance, les fusils et l'argent pourraient parvenir directement aux cadres orthodoxes, par des canaux que le Comité central ne contrôle pas."
 VIN_STL_Recruit_Giang_Liem_Army_Group:0 "Recruter le groupe d'armées Giang-Liem"
 VIN_STL_Recruit_Giang_Liem_Army_Group_desc:0 "Dang Kim Giang, Nguyen Van Vinh et Le Trong Nghia commandent des hommes qui ont étudié les manuels soviétiques et qui sont mécontents des compromis du président. Avec eux derrière nous, l'armée ne défendra pas Ho."
 VIN_STL_Call_Stalin:0 "Appeler Staline"
 VIN_STL_Call_Stalin_desc:0 "Rien ne se passe dans le camp socialiste sans le consentement du Kremlin. Danh demandera lui-même au camarade Staline si l'Union soviétique soutiendra une nouvelle direction à Hanoï."
 VIN_STL_Isolate_Thermidorians:0 "Isoler les thermidoriens"
 VIN_STL_Isolate_Thermidorians_desc:0 "Les alliés les plus proches de Ho au Comité central doivent être coupés de leurs bureaux, de leurs courriers et de leurs unités avant que l'heure ne soit venue. La querelle ne peut plus être cachée."
 VIN_STL_Pull_The_Trigger:0 "Tirez sur la gâchette"
 VIN_STL_Pull_The_Trigger_desc:0 "Tout est prêt. Plutôt que d'attendre le jour fixé, les hommes de Danh s'attaquent dès maintenant au président et au Comité central."
 VIN_STL_Unlock_Duan_Tho_tt:0 "Débloque la décision §YBring In Le Duan et Le Duc Tho§!."
 VIN_STL_Pull_The_Trigger_tt:0 "Lance le coup d'État d'un coup au lieu d'attendre le compte à rebours. Une fois les conditions remplies, il §Gréussit§!."
 VIN_Danh_Struggle_Open_tt:0 "La lutte entre §YHo Chi Minh§! et §YTran Ngoc Danh§! est encore indécise"
 VIN_Danh_Struggle_Open_tt_NOT:0 "La lutte entre §YHo Chi Minh§! et §YTran Ngoc Danh§! a été décidée"
 VIN_Danh_SOV_Favor_50_tt:0 "§YLa faveur soviétique§! pour les staliniens est d'au moins §Y50§! (maintenant [?VIN.VIN_SOV_Favor|0])"
 VIN_Danh_SOV_Favor_85_tt:0 "§YLa faveur soviétique§! pour les staliniens est d'au moins §Y85§! (maintenant [?VIN.VIN_SOV_Favor|0])"
 VIN_Danh_Gate_Permit_tt:0 "§YJoseph Staline§! a approuvé le coup d'État"
 VIN_Danh_Gate_Support_tt:0 "§YTran Ngoc Danh§! a plus de soutien au Parti que §YHo Chi Minh§! (maintenant [?VIN.VIN_Stalinist_Support|0] contre [?VIN.VIN_Ho_Support|0])"
 VIN_Danh_Gate_Backing_tt:0 "L' §YUnion Soviétique§! a envoyé de l'aide, OU Moscou a différé sa reconnaissance du gouvernement §YHo Chi Minh§!, OU §YHo Chi Minh§! a purgé la gauche du VNQDD"
 VIN_STL_General_Secretary_Danh:0 "Secrétaire général Tran Ngoc Danh"
 VIN_STL_General_Secretary_Danh_desc:0 "Le Parti a un nouveau chef et une nouvelle ligne. Tran Ngoc Danh doit montrer aux cadres, à l'armée et aux camarades soviétiques que le changement au sein du Viet Bac est permanent."
 VIN_STL_Uncle_Danh_Youth:0 "La jeunesse communiste de l'oncle Danh"
 VIN_STL_Uncle_Danh_Youth_desc:0 "Les enfants et adolescents des zones libérées seront organisés en une ligue de jeunesse communiste du nom du secrétaire général, élevée dans les classiques du marxisme-léninisme et prête à servir le front."
 VIN_STL_Danh_Cult_of_Personality:0 "Cultivez le culte de l'oncle Danh"
 VIN_STL_Danh_Cult_of_Personality_desc:0 "Des portraits de Staline et de Tran Ngoc Danh seront accrochés côte à côte dans chaque bureau du village. La presse parlera d'une seule voix, et cette voix sera celle du Parti."
 VIN_STL_Uncover_Ho_Mistakes:0 "Découvrez les erreurs de Ho"
 VIN_STL_Uncover_Ho_Mistakes_desc:0 "Plateforme de 1941, dissolution du Parti communiste indochinois, discours sur un Vietnam neutre : les erreurs thermidoriennes de l'ancien président seront exposées aux cadres et Hô Chi Minh quittera définitivement la vie publique."
 VIN_STL_Found_Soviet_Republic:0 "Fondation de la République soviétique du Vietnam"
 VIN_STL_Found_Soviet_Republic_desc:0 "La République démocratique était un compromis avec la bourgeoisie nationale. L'État que nous construisons aujourd'hui prendra son nom et son modèle de l'Union soviétique."
 VIN_STL_Hosting_Emergency_Congress:0 "Organisez un congrès du parti d'urgence"
 VIN_STL_Hosting_Emergency_Congress_desc:0 "Un congrès d'urgence confirmera la nouvelle direction et la nouvelle ligne. Le Liem, un vétéran de la faction orthodoxe, prendra en charge le travail politique du Parti."
 VIN_STL_Recruit_Kieu_Cong_Cung:0 "Recrutez Kieu Cong Cung et d'autres alliés"
 VIN_STL_Recruit_Kieu_Cong_Cung_desc:0 "Kieu Cong Cung et les cadres de Nam Bo ont leurs propres querelles avec l'ancienne direction. Les intégrer dans la nouvelle ligne liera la lutte du Sud à Hanoï."
 VIN_STL_Intensify_Class_Struggle:0 "Intensifier la lutte des classes"
 VIN_STL_Intensify_Class_Struggle_desc:0 "Le front national a protégé les propriétaires terriens et les riches paysans au nom de l'unité. Cette époque est révolue. Les syndicats répondront au Parti et l'ennemi de classe sera désigné."
 VIN_STL_Integrate_Eastern_Bloc:0 "Intégrer le bloc de l'Est"
 VIN_STL_Integrate_Eastern_Bloc_desc:0 "Le Vietnam prendra sa place parmi les démocraties populaires, avec des conseillers soviétiques dans nos ministères et notre diplomatie alignés sur Moscou. Pékin ne sera pas content."
 VIN_STL_Collectivize_Liberated_Zones:0 "Collectiviser les zones libérées"
 VIN_STL_Collectivize_Liberated_Zones_desc:0 "Les terrains, ateliers et magasins des zones libérées seront mis en commun sous la gestion du Parti. Les paysans en seront mécontents, mais le front et les usines seront nourris."
 VIN_STL_Enforce_Orthodoxy:0 "Appliquer l'orthodoxie marxiste-léniniste-stalinienne"
 VIN_STL_Enforce_Orthodoxy_desc:0 "La guerre contre la France étant terminée, le Parti peut enfin être débarrassé des nationalistes et des opportunistes qui ont suivi Ho. Seule la ligne orthodoxe sera tolérée."
 VIN_STL_Reestablish_VCP:0 "Rétablir le Parti communiste vietnamien"
 VIN_STL_Reestablish_VCP_desc:0 "Le Parti que Ho a dissous en 1945 reviendra sous son vrai nom. Il n'y aura plus de cachette derrière les fronts et les partis travaillistes."
 VIN_STL_Victory_of_Socialism:0 "Vi Thang Loi Cua Chu Nghia Xa Hoi !"
 VIN_STL_Victory_of_Socialism_desc:0 "Pour la victoire du socialisme ! La République soviétique du Vietnam se présente comme un membre fidèle du camp socialiste, son Parti orthodoxe et son peuple mobilisé."
 VIN_STL_Join_COMECON:0 "Rejoignez le COMECON et la faction soviétique"
 VIN_STL_Join_COMECON_desc:0 "L'adhésion à part entière au Conseil d'assistance économique mutuelle et une alliance ouverte avec Moscou apporteront au Vietnam des machines, des crédits et une protection soviétiques."
 VIN_STL_SOV_Influence_tt:0 "§YL'Union soviétique§! gagne §G10%§! d'influence dans notre pays."
 VIN_STL_Sino_Soviet_Rift_tt:0 "À partir de §Y1960§!, les relations avec la §YRépublique populaire de Chine§! et la §YRépublique de Chine§! vont encore se détériorer."
 VIN_STL_Radio_Shock_Tactics:0 "Utiliser des tactiques de choc radio et légères"
 VIN_STL_Radio_Shock_Tactics_desc:0 "L'Armée rouge coordonnait ses fronts par radio et brisait les lignes ennemies grâce à des groupes de choc rapides. Nos régiments comptent toujours sur des coureurs et des clairons. Cela doit changer."
 VIN_STL_Enforce_Professionalization:0 "Faire respecter la professionnalisation des forces armées"
 VIN_STL_Enforce_Professionalization_desc:0 "Les habitudes de guérilla ont servi la résistance, mais une armée socialiste a besoin de grades, de statuts et d'état-major sur le modèle soviétique."
 VIN_STL_Mass_Recruiting:0 "Recruter en masse les gens"
 VIN_STL_Mass_Recruiting_desc:0 "Chaque village des zones libérées enverra ses jeunes à l'armée. Les campagnes ressentiront les pertes, mais le front a maintenant besoin de soldats."
 VIN_STL_Form_Hong_Ve_Guards:0 "Formez les gardes de Hong Ve"
 VIN_STL_Form_Hong_Ve_Guards_desc:0 "Les milices d'autodéfense dispersées seront dissoutes et leurs meilleurs hommes rassemblés dans le Su doan Hong Ve, une division de la Garde rouge composée de troupes motorisées, d'artillerie, de reconnaissance et de compagnies de radio."
 VIN_STL_Securing_AK47:0 "Sécurisez l'AK-47"
 VIN_STL_Securing_AK47_desc:0 "Les camarades soviétiques disposent d'un nouveau fusil automatique, simple et fiable. Avec l'aide de Moscou, notre infanterie disposera des mêmes armes que l'Armée rouge."
 VIN_STL_Establish_Quan_Y_Vien:0 "Établir le Quan Y Vien"
 VIN_STL_Establish_Quan_Y_Vien_desc:0 "Une académie de médecine militaire, organisée avec des médecins soviétiques et des manuels soviétiques, ramènera les soldats blessés au front."
 VIN_STL_Study_Great_Patriotic_War:0 "Étudier la Grande Guerre patriotique soviétique"
 VIN_STL_Study_Great_Patriotic_War_desc:0 "De Moscou à Berlin, l'Armée rouge a vaincu l'armée la plus puissante d'Europe. Nos officiers étudieront ses campagnes et en tireront les leçons pour la guerre contre la France."
 VIN_STL_General_Loi_Suggestions:0 "Mettre en oeuvre les suggestions du général Loi"
 VIN_STL_General_Loi_Suggestions_desc:0 "Le général La Vinh Loi affirme que le haut commandement est toujours rempli d'hommes d'Hô Chi Minh. La guerre terminée, sa liste de noms ne peut plus être ignorée."
 VIN_STL_Request_USSR_Volunteers:0 "Demander des volontaires de l'URSS"
 VIN_STL_Request_USSR_Volunteers_desc:0 "Le secrétaire général demandera directement à Moscou des conseillers, des instructeurs et du matériel pour mettre sur pied la nouvelle armée."
 VIN_STL_Deport_IJA_French_Defectors:0 "Déporter l'IJA et les transfuges français"
 VIN_STL_Deport_IJA_French_Defectors_desc:0 "Les déserteurs japonais et européens qui ont combattu dans les unités Chien Si Viet Nam Moi n'ont pas leur place dans une armée prolétarienne. Ils seront désarmés et renvoyés chez eux."
 VIN_STL_Accept_Eastern_Bloc_Aid:0 "Acceptez l'aide du bloc de l'Est"
 VIN_STL_Accept_Eastern_Bloc_Aid_desc:0 "Les chars et les fusils des dépôts soviétiques, la même aide que Moscou a apportée aux camarades coréens, atteindront le Vietnam par la frontière nord."
 VIN_STL_Invite_Soviet_Companies:0 "Inviter des sociétés d'armement soviétiques"
 VIN_STL_Invite_Soviet_Companies_desc:0 "Les bureaux d'études et les usines d'armement soviétiques nous aideront à construire et à entretenir nos propres armes, des fusils aux avions."
 VIN_STL_Soviet_MIOs_tt:0 "Débloque les organisations militaro-industrielles §YGAZ§! et §YSukhoi§! et la compagnie d'armes d'infanterie §YTOV§!."

 VIN_Rally_The_Gio_Tri_Thuc:0 "Rassemblez l'Intelligentsia"
 VIN_Rally_The_Gio_Tri_Thuc_desc:0 "Les enseignants, les écrivains, les médecins et les techniciens sont indispensables au Vietnam moderne. La révolution doit donner à l'intelligentsia une place significative dans la reconstruction nationale."

 VIN_Lay_Dan_Lam_Goc:0 "Prendre les gens comme notre fondement"
 VIN_Lay_Dan_Lam_Goc_desc:0 "Le Parti doit tirer sa légitimité du peuple plutôt que des seuls décrets. La participation de masse et la responsabilité locale renforceront la révolution par le bas."

 VIN_The_National_Solidarity_Bloc:0 "Le Bloc de Solidarité Nationale"
 VIN_The_National_Solidarity_Bloc_desc:0 "La libération du Vietnam exige une coalition plus large que n'importe quel parti ou classe. Un front national durable peut unir des patriotes qui sont en désaccord sur bien d'autres points."

 VIN_Ngo_Dinh_Diem_Manifesto:0 "Le Manifeste d'ONG Dinh Diem"
 VIN_Ngo_Dinh_Diem_Manifesto_desc:0 "L'appel de Ngo Dinh Diem au nationalisme et à la religion ne peut être ignoré. Nous devons y répondre avec une vision plus claire de l'indépendance, de la justice et de l'unité nationale."

 VIN_Integrate_Patriotic_Religious_Organizations:0 "Intégrer les organisations religieuses patriotiques"
 VIN_Integrate_Patriotic_Religious_Organizations_desc:0 "Les croyants religieux n'ont pas besoin de rester en dehors de la révolution. En travaillant avec des organisations patriotiques, nous pouvons refuser aux réactionnaires le monopole de la foi et de la communauté."

 VIN_Merge_Viet_Minh_Lien_Viet:0 "Fusionner le Viet Minh et le Lien Viet"
 VIN_Merge_Viet_Minh_Lien_Viet_desc:0 "Le mouvement anticolonial doit être consolidé en un seul véhicule politique. La fusion du Viet Minh et du Lien Viet renforcera le front national et clarifiera sa finalité."

 VIN_Reign_of_Stalin:0 "Règne de Staline"
 VIN_Reign_of_Stalin_desc:0 "Si l'autorité de Staline perdure, le Vietnam doit faire preuve de discipline et de fiabilité au sein du camp socialiste tout en s'appuyant sur son soutien matériel et politique."

 VIN_Under_Political_Discipline:0 "Sous la discipline politique"
 VIN_Under_Political_Discipline_desc:0 "Le Parti placera l'unité idéologique, la discipline militaire et la solidarité internationale au-dessus de l'expérimentation factionnelle. La révolution doit être endurcie pour la lutte à venir."

 VIN_The_Strength_in_Our_Heart:0 "La force dans notre coeur"
 VIN_The_Strength_in_Our_Heart_desc:0 "La résilience d'un peuple armé est une ressource stratégique. L'engagement politique, la défense locale et la confiance dans la victoire peuvent contrebalancer la supériorité matérielle d'un ennemi."

 VIN_The_Revolutionary_Struggle:0 "La lutte révolutionnaire"
 VIN_The_Revolutionary_Struggle_desc:0 "La lutte du Vietnam s'inscrit dans une lutte plus large contre le colonialisme et le capitalisme. Nous approfondirons les liens avec les gouvernements et les mouvements qui partagent cet objectif."

 VIN_The_Death_of_Stalin:0 "La mort de Staline"
 VIN_The_Death_of_Stalin_desc:0 "La mort de Staline ouvre une période d'incertitude dans le monde socialiste. Le Vietnam doit réagir sans abandonner son indépendance ni ses engagements révolutionnaires."

 VIN_Unity_for_Independence:0 "L'unité pour l'indépendance"
 VIN_Unity_for_Independence_desc:0 "Nos relations extérieures doivent d'abord servir la libération nationale. Un nouvel alignement indochinois peut préserver la solidarité révolutionnaire sans renoncer à l'initiative vietnamienne."

 VIN_The_Virtue_of_Mind:0 "La vertu de la connaissance"
 VIN_The_Virtue_of_Mind_desc:0 "L'école, l'alphabétisation et la formation technique sont des instruments du pouvoir national. Un peuple libre et instruit sera mieux préparé à défendre et à reconstruire le pays."

 VIN_The_National_Struggle:0 "La lutte nationale"
 VIN_The_National_Struggle_desc:0 "La révolution doit s'adresser à toutes les communautés vietnamiennes, y compris aux peuples des montagnes dont le soutien est vital pour une république unie et défendable."

 VIN_Bamboo_Diplomacy:0 "Diplomatie du bambou"
 VIN_Bamboo_Diplomacy_desc:0 "Comme le bambou, la diplomatie vietnamienne doit être enracinée dans ses principes tout en restant flexible face au vent. Nous chercherons une marge de manoeuvre entre les grandes puissances sans perdre nos objectifs fondamentaux."

 VIN_Establish_International_Ties:0 "Établir des liens internationaux"
 VIN_Establish_International_Ties_desc:0 "La reconnaissance et la représentation ne sont pas de simples formalités. Ce sont des garanties contre l'isolement et un moyen de garantir l'aide, le commerce et la légitimité diplomatique."

 VIN_Support_Lao_Issara_Khmer_Issarak:0 "Soutenez les Lao Issara et les Khmers Issarak"
 VIN_Support_Lao_Issara_Khmer_Issarak_desc:0 "La libération de l'Indochine ne peut être séparée par des frontières coloniales. Le soutien aux forces révolutionnaires laotiennes et khmères renforcera l'ensemble de la lutte régionale."

 VIN_Nam_Bo_Khang_Chien:0 "La Résistance du Sud"
 VIN_Nam_Bo_Khang_Chien_desc:0 "La résistance du Sud a besoin de ses propres réseaux, commandants et routes d'approvisionnement. Nous devons maintenir la lutte hors de portée des zones de base du nord."

 VIN_Raise_the_Smuggling_Fleet:0 "Augmenter la flotte de contrebande"
 VIN_Raise_the_Smuggling_Fleet_desc:0 "Les petits navires et les équipages clandestins peuvent déplacer des hommes et du matériel là où les forces conventionnelles ne le peuvent pas. Une bouée de sauvetage maritime soutiendra l'insurrection du Sud."

 VIN_Empower_the_Democratic_Front:0 "Donner du pouvoir au Front démocratique"
 VIN_Empower_the_Democratic_Front_desc:0 "Un front démocratique plus large peut attirer des patriotes urbains, des groupes sectaires et des hommes de pouvoir locaux qui ne rejoindront pas un mouvement étroitement communiste."

 VIN_Mass_Recruitments_Binh_Xuyen_and_Sectarians:0 "Recrutez les Binh Xuyen et les sectaires"
 VIN_Mass_Recruitments_Binh_Xuyen_and_Sectarians_desc:0 "Les fractures politiques du Sud offrent une opportunité. En recrutant les Binh Xuyen et les sectaires religieux, nous pouvons retourner le pouvoir armé local contre l'ordre colonial."

 VIN_Summon_Nguyen_Binh_North:0 "Invoquer Nguyen Binh Nord"
 VIN_Summon_Nguyen_Binh_North_desc:0 "Le Parti veut que son commandant sudiste soit au Viet Bac pour des entraînements et des consultations sur la piste qui doit un jour relier les deux moitiés du pays. L'amener vers le nord signifie le mettre sur une route, et chaque route sortant de Nam Bo est surveillée."

 VIN_Keep_Binh_in_Nam_Bo:0 "Gardez Binh à Nam Bo"
 VIN_Keep_Binh_in_Nam_Bo_desc:0 "La convocation peut être retirée. Nam Bo a un commandant capable de rassembler à la fois les guérilleros, les comités urbains et les contacts sectaires, et le Nord n'a personne à envoyer à sa place. Hanoï paiera la décision avec autorité plutôt que par le sang."

 VIN_Nguyen_Binh_Ambush:0 "L'embuscade de Nguyen Binh"
 VIN_Nguyen_Binh_Ambush_desc:0 "Le sort de Nguyen Binh façonnera la lutte du Sud. Une seule embuscade peut décider si la résistance reste unifiée ou si elle se divise en courants rivaux."

 VIN_Death_of_Nguyen_Binh:0 "La mort de Nguyen Binh"
 VIN_Death_of_Nguyen_Binh_desc:0 "La perte de Nguyen Binh laisserait le mouvement sudiste sans son commandant le plus reconnu. Nous devons choisir un successeur avant que l'incertitude ne s'effondre."

 VIN_Nguyen_Binh_Survives:0 "Nguyen Binh survit"
 VIN_Nguyen_Binh_Survives_desc:0 "La survie de Nguyen Binh préserve un lien crucial entre les dirigeants du Nord et les diverses forces du Sud. Son autorité peut maintenir intact le front unique."

 VIN_Fate_of_Kieu_Cong_Cung_Revisionists:0 "Le sort des révisionnistes de Kieu Cong Cung"
 VIN_Fate_of_Kieu_Cong_Cung_Revisionists_desc:0 "Les courants rivaux au sein du mouvement sudiste ne peuvent être ignorés. Nous devons régler la question du révisionnisme, du syndicalisme et de l'autorité du centre révolutionnaire."

 VIN_Promote_Le_Duc_Tho_Orthodoxy:0 "Promouvoir l'orthodoxie de Le Duan"
 VIN_Promote_Le_Duc_Tho_Orthodoxy_desc:0 "Le mouvement sudiste doit être intégré dans une ligne marxiste-léniniste disciplinée. Le bureau sud du Parti sous Le Duan, et son adjoint Le Duc Tho après lui, offrent une voie vers la consolidation idéologique."

 VIN_Bac_Tien:0 "Avancement vers le nord"
 VIN_Bac_Tien_desc:0 "Une avancée vers le nord peut réunir la lutte armée sous un seul commandement et empêcher le sud de devenir un projet politique distinct."

 VIN_Retain_Nguyen_Binh_United_Front:0 "Conserver le Front uni de Nguyen Binh"
 VIN_Retain_Nguyen_Binh_United_Front_desc:0 "L'insurrection du Sud tire sa force de sa diversité. Le maintien de la large coalition de Nguyen Binh est peut-être moins judicieux, mais il est mieux adapté aux réalités du sud."

 VIN_Victory_in_the_South:0 "Victoire au Sud"
 VIN_Victory_in_the_South_desc:0 "Une victoire militaire dans le sud transformerait l'équilibre des pouvoirs dans l'ensemble du Vietnam. La révolution doit être prête à convertir les succès sur le champ de bataille en réunification nationale."

 VIN_Nhan_Van_Giai_Pham_Affair:0 "L'affaire Nhan Van-Giai Pham"
 VIN_Nhan_Van_Giai_Pham_Affair_desc:0 "Le débat autour de Nhan Van-Giai Pham soulève une question fondamentale : la révolution tolérera-t-elle les critiques des écrivains et des intellectuels, ou les traitera-t-elle comme une menace politique ?"

 VIN_Destroy_Reactionary_Thoughts:0 "Détruire les pensées réactionnaires"
 VIN_Destroy_Reactionary_Thoughts_desc:0 "Le Parti affrontera les idées qu'il considère comme hostiles à la construction socialiste. Le travail culturel doit servir la révolution plutôt que de la miner."

 VIN_Nghi_Quyet_So_30_Van_Nghe:0 "Résolution n° 30 sur la culture et les arts"
 VIN_Nghi_Quyet_So_30_Van_Nghe_desc:0 "Une résolution formelle placera les écrivains, les artistes et les éditeurs sous une direction politique plus claire. La production culturelle doit être organisée comme une responsabilité nationale."

 VIN_A_United_Front:0 "Un front uni"
 VIN_A_United_Front_desc:0 "Un front culturel discipliné peut lier les intellectuels au projet révolutionnaire plus large. Le Parti recherchera l'unité avant que la dissidence ne se transforme en opposition."

 VIN_Of_Our_Pen_and_Bayonet:0 "De la plume et de la baïonnette"
 VIN_Of_Our_Pen_and_Bayonet_desc:0 "L'écriture et le combat sont deux armes dans une guerre populaire. L'art, le journalisme et l'éducation doivent renforcer le moral et révéler la faiblesse politique de l'ennemi."

 VIN_Do_Not_Be_Deceived:0 "Ne vous laissez pas tromper"
 VIN_Do_Not_Be_Deceived_desc:0 "Le Parti prévient qu'un langage attrayant peut dissimuler des intentions réactionnaires. La vigilance culturelle est présentée comme nécessaire pour défendre les acquis de la révolution."

 VIN_Enforce_Ideological_Unity:0 "Renforcer l'unité idéologique"
 VIN_Enforce_Ideological_Unity_desc:0 "L'État exigera une ligne idéologique claire de la part de ses institutions culturelles. L'ambiguïté et le factionnalisme ne peuvent pas affaiblir la mobilisation nationale."

 VIN_The_Enemies_in_Our_Mind:0 "Les ennemis dans notre esprit"
 VIN_The_Enemies_in_Our_Mind_desc:0 "La révolution est confrontée à des dangers non seulement sur le champ de bataille, mais aussi dans les habitudes héritées, les préjugés de classe et l'influence culturelle étrangère. L'éducation politique doit atteindre la vie quotidienne."

 VIN_The_Counterrevolutionary_Betrayal:0 "La trahison contre-révolutionnaire"
 VIN_The_Counterrevolutionary_Betrayal_desc:0 "La résistance ouverte à la ligne du Parti sera considérée comme plus qu'un simple désaccord. L'État considérera cela comme une trahison du peuple et de la lutte nationale."

 VIN_Nothing_But_Punishment:0 "Rien que la punition"
 VIN_Nothing_But_Punishment_desc:0 "La voie la plus dure considère l'opposition culturelle comme un crime à éliminer, quel que soit le coût social. La peur peut engendrer l'obéissance, mais elle laissera de profondes cicatrices."

 VIN_Enforce_Purges_Against_Revisionist_Arts:0 "Imposer des purges contre les arts révisionnistes"
 VIN_Enforce_Purges_Against_Revisionist_Arts_desc:0 "Les institutions, revues et artistes accusés de révisionnisme seront purgés. La culture socialiste sera refaite autour de la fiabilité idéologique."

 VIN_Stand_Together_In_Orthodoxy:0 "Soyez unis dans l'Orthodoxie"
 VIN_Stand_Together_In_Orthodoxy_desc:0 "Le Parti cherche à resserrer les rangs après la lutte culturelle. L'orthodoxie sera présentée comme le seul fondement sûr de l'unité nationale."

 VIN_Every_Writer_is_a_Soldier:0 "Chaque écrivain est un soldat"
 VIN_Every_Writer_is_a_Soldier_desc:0 "Les auteurs, les enseignants et les artistes seront enrôlés dans la lutte politique. Leur travail doit renforcer le moral, éduquer le public et défendre la révolution."

 VIN_Let_Hundred_Flowers_Bloom:0 "Laissez fleurir cent fleurs"
 VIN_Let_Hundred_Flowers_Bloom_desc:0 "Une critique constructive peut révéler la faiblesse de la bureaucratie et relancer la révolution. Nous autoriserons le débat en étant convaincus que le socialisme n'a rien à craindre des voix honnêtes."

 VIN_Accept_Democratization_and_Individualization:0 "Accepter la démocratisation et l'individualisation"
 VIN_Accept_Democratization_and_Individualization_desc:0 "Le Vietnam ne peut pas se moderniser en supprimant toute initiative indépendante. Les réformes politiques et l'expression individuelle peuvent renforcer la nation plutôt que l'affaiblir."

 VIN_The_Right_Path_to_Democratization:0 "La bonne voie vers la démocratisation"
 VIN_The_Right_Path_to_Democratization_desc:0 "La réforme doit être guidée avec soin afin qu'elle approfondisse la participation populaire sans permettre le retour des privilèges coloniaux ou de la domination de classe."

 VIN_The_Budapest_Model:0 "Le modèle de Budapest"
 VIN_The_Budapest_Model_desc:0 "Les événements de Budapest démontrent à la fois l'attrait et le danger des réformes. Le Vietnam doit en tirer des leçons sans permettre aux puissances étrangères de dicter son avenir."

 VIN_Ho_Chi_Minh_Promises:0 "Les promesses d'Hô Chi Minh"
 VIN_Ho_Chi_Minh_Promises_desc:0 "L'autorité morale d'Hô Chi Minh peut rassurer une population effrayée. Les promesses de retenue, de légalité et de consultation doivent être rendues crédibles par l'action."

 VIN_Double_Down_on_De_Stalinzation:0 "Approfondir la déstalinisation"
 VIN_Double_Down_on_De_Stalinzation_desc:0 "Une rupture partielle avec les anciennes méthodes ne suffira pas. Le Parti poursuivra un renouvellement plus profond des institutions, de la direction et de la pratique politique."

 VIN_Agreement_for_Democracy:0 "Accord pour la démocratie"
 VIN_Agreement_for_Democracy_desc:0 "Un règlement démocratique négocié peut préserver la révolution tout en élargissant sa base sociale. L'objectif est une réforme sans fragmentation nationale."

 VIN_Cultural_Liberalization:0 "Libéralisation culturelle"
 VIN_Cultural_Liberalization_desc:0 "Les écrivains, les universitaires et les artistes bénéficieront d'un espace plus large pour expérimenter et critiquer. La confiance culturelle est le signe d'un État sûr plutôt que faible."

 VIN_People_Speak_We_Listen:0 "Les gens parlent, nous écoutons"
 VIN_People_Speak_We_Listen_desc:0 "Le Parti créera des canaux pour les griefs et les critiques. Un gouvernement qui écoute peut corriger ses échecs avant qu'ils ne se transforment en crise."

 VIN_The_New_Poetry_Movement:0 "Le nouveau mouvement poétique"
 VIN_The_New_Poetry_Movement_desc:0 "De nouvelles voix littéraires peuvent exprimer les espoirs et les tensions d'une société en évolution. Plutôt que de les supprimer, la révolution les invitera dans la vie publique."

 VIN_Two_Thousand_Years_of_History:0 "Deux mille ans d'histoire"
 VIN_Two_Thousand_Years_of_History_desc:0 "Le socialisme vietnamien doit être enraciné dans bien plus que une doctrine importée. Notre longue histoire de résistance et de politique donne à la révolution un fondement clairement national."

 VIN_Across_the_Spectrum:0 "À travers le spectre"
 VIN_Across_the_Spectrum_desc:0 "La communauté nationale comprend de nombreuses traditions politiques. Une culture publique plus large peut aider à les réconcilier dans le cadre de l'objectif commun de l'indépendance vietnamienne."

 VIN_Let_Hundred_Thoughts_Contend:0 "Laissez cent pensées s'affronter"
 VIN_Let_Hundred_Thoughts_Contend_desc:0 "Les débats entre de nombreuses écoles de pensée peuvent affiner les politiques et éviter la stagnation intellectuelle. L'État encouragera les conflits dans les limites de l'indépendance nationale."

 VIN_Land_Reform_Du_Luat_197_HL:0 "Décret de réforme agraire n° 197-HL"
 VIN_Land_Reform_Du_Luat_197_HL_desc:0 "La réforme agraire brisera les fondements sociaux du régime colonial et du pouvoir des propriétaires fonciers. Son succès dépend d'une répartition équitable des terres sans détruire les villages qu'elle est censée libérer."

 VIN_Follow_Maos_Advice:0 "Suivez les conseils de Mao"
 VIN_Follow_Maos_Advice_desc:0 "L'expérience révolutionnaire de la Chine offre un modèle puissant de lutte des classes et de transformation rurale. Nous adopterons ses leçons avec la conviction que la rapidité et la détermination sont essentielles."

 VIN_Nghi_Quyet_So_09_NQ_TW:0 "Résolution n° 09-NQ/TW"
 VIN_Nghi_Quyet_So_09_NQ_TW_desc:0 "Le Parti codifiera un programme plus radical pour transformer les campagnes. Les cadres doivent porter la révolution dans chaque village et chaque foyer."

 VIN_Speed_Up_Communization_Reform:0 "Accélérer la transformation socialiste"
 VIN_Speed_Up_Communization_Reform_desc:0 "La transition vers le socialisme sera accélérée grâce à une organisation collective et à un contrôle plus strict de la production rurale. Les risques sont élevés, mais tout retard pourrait renforcer d'anciens intérêts."

 VIN_The_Next_Step_of_Revolution:0 "La prochaine étape de la révolution"
 VIN_The_Next_Step_of_Revolution_desc:0 "Après avoir redistribué les terres, le Parti doit décider dans quelle mesure il souhaite remodeler la vie sociale et économique. La prochaine phase déterminera le caractère du socialisme vietnamien."

 VIN_Follow_a_Flexible_Path:0 "Suivez un chemin flexible"
 VIN_Follow_a_Flexible_Path_desc:0 "Les conditions vietnamiennes diffèrent de celles des grands États socialistes. Une approche plus progressive et pragmatique pourrait préserver la stabilité rurale tout en faisant progresser la justice sociale."

 VIN_Permit_Class_Collaborations:0 "Autoriser les collaborations de classes"
 VIN_Permit_Class_Collaborations_desc:0 "Tous les intérêts non prolétariens ne doivent pas être traités comme des ennemis. Une coopération limitée avec les petits exploitants et les intérêts commerciaux patriotiques pourrait faciliter la transition."

 VIN_Decrease_Collectivization_Process:0 "Ralentir la campagne de collectivisation"
 VIN_Decrease_Collectivization_Process_desc:0 "La collectivisation coercitive peut aliéner les personnes qu'elle prétend servir. Ralentir le rythme permettra aux institutions de mûrir et à la confiance rurale de se rétablir."

 VIN_A_Bountiful_Harvest:0 "Une récolte abondante"
 VIN_A_Bountiful_Harvest_desc:0 "La politique agricole doit en fin de compte nourrir la population et soutenir la révolution. De meilleures incitations et un soutien pratique peuvent transformer la réforme en une prospérité visible."

 VIN_The_Successor_Question:0 "La question du successeur"
 VIN_The_Successor_Question_desc:0 "Oncle Ho ne dirigera pas le Parti pour toujours. Avant le prochain congrès du Parti, le Comité central doit décider qui fera avancer la révolution une fois qu'il se retirera."

 VIN_The_Commissar:0 "Le commissaire"
 VIN_The_Commissar_desc:0 "Le leadership politique au sein des forces armées doit être porté par des cadres de confiance. Le commissaire représente la volonté du Parti au point de commandement."

 VIN_Our_Southern_Comrade:0 "Notre camarade du Sud"
 VIN_Our_Southern_Comrade_desc:0 "Le mouvement sudiste reste un élément central de la révolution nationale. Ses représentants doivent avoir leur mot à dire sur la stratégie, l'organisation et l'avenir de la réunification."

 VIN_The_Peoples_General:0 "Le général du peuple"
 VIN_The_Peoples_General_desc:0 "L'autorité militaire doit rester indissociable de la légitimité populaire. Un commandant qui incarne la lutte du peuple peut unir l'armée et la nation."

 VIN_The_Face_of_the_Party:0 "Le visage du parti"
 VIN_The_Face_of_the_Party_desc:0 "Le Parti a besoin d'une personnalité publique capable de communiquer son objectif au-delà des réunions à huis clos et des directives internes. Le leadership doit être visible et efficace."

 VIN_A_Radical_Choice:0 "Un choix radical"
 VIN_A_Radical_Choice_desc:0 "La décision à venir déterminera si la révolution vietnamienne met l'accent sur une transformation rapide, une large unité nationale ou un équilibre entre les deux."

 VIN_Preparation_for_Industrialization:0 "Préparation à l'industrialisation"
 VIN_Preparation_for_Industrialization_desc:0 "L'indépendance nationale restera fragile sans base industrielle. L'État doit préparer les institutions, les travailleurs et les ressources nécessaires à un long effort de développement."

 VIN_The_Geneva_Peace_Conference:0 "La Conférence de paix de Genève"
 VIN_The_Geneva_Peace_Conference_desc:0 "Le conflit a atteint un carrefour diplomatique. À Genève, le Vietnam doit peser les gains territoriaux, la reconnaissance internationale et les risques d'une guerre inachevée."

 VIN_A_Failed_State:0 "Un État défaillant"
 VIN_A_Failed_State_desc:0 "Le règlement a laissé la République démocratique sans gouvernement opérationnel : des administrations rivales et des mouvements armés contestent son autorité et le désordre se propage à travers l'État. Le Vietnam doit encore empêcher que ce désordre ne se transforme en intervention étrangère ou en un contrôle colonial renouvelé."

 VIN_Accept_French_Three_Vietnam_Federal_Scheme:0 "Accepter le schéma fédéral français-vietnamien"
 VIN_Accept_French_Three_Vietnam_Federal_Scheme_desc:0 "Un compromis fédéral pourrait mettre fin à une effusion de sang immédiate, mais il risquerait d'institutionnaliser la division du Vietnam. Nous devons décider si une paix temporaire justifie ce prix."

 VIN_Accept_Temporary_Partitions:0 "Accepter les partitions temporaires"
 VIN_Accept_Temporary_Partitions_desc:0 "Une partition temporaire pourrait faire gagner du temps à la reconstruction et à la consolidation politique. Pourtant, toute frontière provisoire risque de devenir permanente."
 VIN_Accept_Unified_Interim_Settlement:0 "Accepter le règlement provisoire unifié"
 VIN_Accept_Unified_Interim_Settlement_desc:0 "Les accords de Genève laissent le Vietnam sous une administration intérimaire unique, avec un vote national pour décider de son gouvernement permanent dans un délai de deux ans. Hanoï doit mener le règlement à bien au travers des élections qu'il a acceptées, et le vote décidera qui dirigera l'ensemble du pays."
 VIN_Accept_Three_States_Settlement:0 "Acceptez le règlement à trois États"
 VIN_Accept_Three_States_Settlement_desc:0 "Les accords de Genève divisent le Vietnam en trois États distincts, la zone nord étant détenue par le Kuomintang et l'administration du Parti confinée à son propre territoire. Hanoï doit reconnaître cet arrangement et se retirer des zones qu'elle ne peut pas détenir."
 VIN_The_Conference_Collapses:0 "La conférence s'effondre"
 VIN_The_Conference_Collapses_desc:0 "Les négociations de Genève ont été interrompues sans accord. Aucun règlement ne lie les parties et la lutte pour le Vietnam revient sur le champ de bataille."
 VIN_American_Brokered_Reunification:0 "Réunification négociée par les Américains"
 VIN_American_Brokered_Reunification_desc:0 "Avec le soutien de Washington, le Nord a été contraint à une réunification à des conditions qu'il n'avait pas écrites. La guerre est terminée, mais les conditions sont fragiles et les Américains restent étroitement impliqués dans le sort du Nord."
 VIN_The_Nation_Votes_for_Hanoi:0 "La nation vote pour Hanoï"
 VIN_The_Nation_Votes_for_Hanoi_desc:0 "Le vote national a donné un résultat clair pour le Nord. Le gouvernement du Parti à Hanoï dirigera désormais un Vietnam unifié, et le résultat du scrutin règle la question de savoir qui gouvernera le pays."

 VIN_Preparation_for_Reunification_Election:0 "Préparation aux élections de réunification"
 VIN_Preparation_for_Reunification_Election_desc:0 "Un vote national pourrait régler la question de la légitimité sans nouvelle guerre. L'organisation, la propagande et les garanties internationales seront essentielles."

 VIN_The_Election_is_Cancelled:0 "L'élection est annulée"
 VIN_The_Election_is_Cancelled_desc:0 "Lorsque la réunification par scrutin est bloquée, la lutte politique entre dans une phase plus dangereuse. Le Parti doit décider comment répondre à une promesse non tenue."

 VIN_Begin_the_Charles_de_Gaulle_Talks:0 "Commencer les pourparlers sur Charles de Gaulle"
 VIN_Begin_the_Charles_de_Gaulle_Talks_desc:0 "Le changement politique français pourrait créer une ouverture étroite pour un règlement négocié. Un contact direct avec de Gaulle pourrait modifier l'avenir du Vietnam."

 VIN_Preparation_for_the_Liberation_of_the_South:0 "Préparation à la libération du Sud"
 VIN_Preparation_for_the_Liberation_of_the_South_desc:0 "Si la réunification pacifique est refusée, le sud doit se préparer à une nouvelle lutte de libération nationale. L'organisation politique sera aussi importante que la force armée."

 VIN_Reunification_of_Vietnams:0 "La réunification du Vietnam"
 VIN_Reunification_of_Vietnams_desc:0 "La division du pays est terminée. La tâche consiste désormais à unir les institutions, les économies et les communautés après des années de guerre et de séparation."

 VIN_Total_Victory:0 "Victoire totale"
 VIN_Total_Victory_desc:0 "La victoire militaire garantit la révolution, mais elle crée aussi d'immenses obligations. Nous devons gouverner le pays tout entier, réconcilier son peuple et transformer la libération en une paix durable."

 VIN_Proclaim_the_Indochinese_Federation:0 "Proclamer la Fédération Indochinoise"
 VIN_Proclaim_the_Indochinese_Federation_desc:0 "La lutte révolutionnaire a dépassé les frontières imposées par le colonialisme. Une Indochine fédérée coordonnerait la défense, le développement et la solidarité politique dans toute la région."

 VIN_Dai_Hoi_III:0 "Le Congrès du Troisième Parti"
 VIN_Dai_Hoi_III_desc:0 "Le Troisième Congrès du Parti ouvrira la voie à un Vietnam réunifié et en reconstruction. Elle doit trouver un équilibre entre la transformation socialiste et les besoins d'une société épuisée par la guerre."

 VIN_Promote_Tu_Cung_Tu_Cap:0 "Promouvoir l'autosuffisance"
 VIN_Promote_Tu_Cung_Tu_Cap_desc:0 "L'autosuffisance réduira la dépendance à l'égard des fragiles lignes d'approvisionnement étrangères. La production locale et l'utilisation disciplinée des ressources peuvent soutenir la reconstruction du pays."

 VIN_Repairing_Key_Infrastructures:0 "Réparer les infrastructures clés"
 VIN_Repairing_Key_Infrastructures_desc:0 "Les routes, les ponts, les ports et les communications constituent le squelette du redressement national. Les réparer en premier permettra à chaque programme de développement ultérieur de fonctionner."

 VIN_Expand_Hop_tac_xa_Thuy_Tinh-Dan_Chu:0 "Élargir les modèles coopératifs démocratiques"
 VIN_Expand_Hop_tac_xa_Thuy_Tinh-Dan_Chu_desc:0 "Les coopératives peuvent mettre en commun la main d'oeuvre, les outils et l'irrigation tout en préservant un rôle significatif pour la participation locale. Nous les développerons soigneusement en tant que modèle de développement rural socialiste."

 VIN_Incorporate_the_Tong_Lien_Doan_Lao_Dong:0 "Incorporer la Confédération générale du travail"
 VIN_Incorporate_the_Tong_Lien_Doan_Lao_Dong_desc:0 "Les travailleurs organisés doivent être associés à l'effort de reconstruction. La Confédération générale du travail peut coordonner les travailleurs, défendre les normes et mobiliser la production."

 VIN_Begin_Domestic_Arms_Productions:0 "Commencer la production nationale d'armes"
 VIN_Begin_Domestic_Arms_Productions_desc:0 "Une révolution entièrement dépendante des fusils étrangers reste vulnérable. Les ateliers et les arsenaux doivent commencer à produire les armes et équipements de base de la défense nationale."

 VIN_Promote_Thi_dua_San_Xuat:0 "Promouvoir l'émulation de la production"
 VIN_Promote_Thi_dua_San_Xuat_desc:0 "Les campagnes de production peuvent transformer la reconstruction en un mouvement de masse. Les travailleurs et les paysans seront encouragés à dépasser les objectifs grâce à un effort collectif et à une compétition patriotique."

 VIN_Mobilizing_the_Youth:0 "Mobiliser la jeunesse"
 VIN_Mobilizing_the_Youth_desc:0 "Les jeunes constituent la plus grande réserve d'énergie et de talents du pays. Les organisations de jeunesse seront mobilisées pour l'éducation, la construction et le service national."

 VIN_Repair_Colonial_Workshops:0 "Réparer les ateliers coloniaux"
 VIN_Repair_Colonial_Workshops_desc:0 "Les ateliers coloniaux peuvent être réutilisés pour le développement vietnamien. Leurs machines et leur main-d'oeuvre qualifiée doivent être sauvées de la décadence et placées sous la direction nationale."

 VIN_Utilizing_Patriotic_Donations:0 "Mobiliser les dons patriotiques"
 VIN_Utilizing_Patriotic_Donations_desc:0 "La nation peut financer la reprise grâce à des sacrifices partagés. Les contributions volontaires démontreront que la reconstruction est une cause populaire et non une simple décision du gouvernement."

 VIN_Collectivize_Viet_Gian_Properties:0 "Collectiviser la propriété des collaborateurs"
 VIN_Collectivize_Viet_Gian_Properties_desc:0 "Les biens détenus par les collaborateurs et les profiteurs de guerre devraient servir le peuple plutôt que l'enrichissement privé. Son transfert fournira des ressources pour la reconstruction et les programmes sociaux."

 VIN_Issue_Sac_Lenh_giam-to:0 "Publier le décret de réduction d'impôt"
 VIN_Issue_Sac_Lenh_giam-to_desc:0 "Les allègements fiscaux peuvent gagner la confiance du public et alléger le fardeau de la reprise. L'État démontrera que la politique sociale est un élément essentiel de la reconstruction nationale."

 VIN_Relocate_Assets_to_Hanoi:0 "Délocaliser les actifs à Hanoï"
 VIN_Relocate_Assets_to_Hanoi_desc:0 "La capitale doit redevenir un centre administratif et industriel. Les actifs récupérables seront concentrés là où ils peuvent soutenir la planification nationale."

 VIN_Request_Economic_Aid_From_Socialist_Countries:0 "Demander une aide économique aux pays socialistes"
 VIN_Request_Economic_Aid_From_Socialist_Countries_desc:0 "Le monde socialiste peut fournir des machines, du crédit, des spécialistes et des marchés. Nous chercherons une aide qui renforce l'indépendance du Vietnam plutôt que de remplacer une dépendance par une autre."

 VIN_Request_Economic_Aid_From_America:0 "Demander une aide économique à l'Amérique"
 VIN_Request_Economic_Aid_From_America_desc:0 "Des contacts économiques pragmatiques avec l'Amérique pourraient fournir des capitaux et des technologies que le Vietnam ne peut pas encore produire. Une telle assistance ne doit jamais compromettre la souveraineté nationale."

 VIN_Implement_Financial_Reforms:0 "Mettre en oeuvre des réformes financières"
 VIN_Implement_Financial_Reforms_desc:0 "Une monnaie stable et des finances publiques cohérentes sont des conditions préalables à la reconstruction. L'État doit regrouper la fiscalité, le crédit et les dépenses dans un seul plan national."

 VIN_Establish_the_National_Bank:0 "Créer la Banque Nationale"
 VIN_Establish_the_National_Bank_desc:0 "Une banque nationale donnera au gouvernement les outils nécessaires pour gérer le crédit, les devises et les investissements. La souveraineté économique commence par le contrôle de la finance."

 VIN_Begin_Post_War_Reconstruction:0 "Commencer la reconstruction d'après-guerre"
 VIN_Begin_Post_War_Reconstruction_desc:0 "La guerre a laissé un pays endommagé mais libéré. La reconstruction doit désormais devenir la tâche centrale de l'État, du Parti et du peuple."

 VIN_Rebuild_River_Levees_System:0 "Reconstruire le système rivière-digue"
 VIN_Rebuild_River_Levees_System_desc:0 "La lutte contre les inondations est une question de survie nationale dans le delta. La reconstruction des digues protégera les fermes, les villes et les réserves alimentaires de la prochaine catastrophe."

 VIN_First_Phase_Towards_Socialism:0 "Première phase vers le socialisme"
 VIN_First_Phase_Towards_Socialism_desc:0 "La première phase de la construction socialiste jettera les bases d'une économie planifiée tout en préservant suffisamment de flexibilité pour restaurer la vie quotidienne après la guerre."

 VIN_Rebuild_Hai_Phong_Shipyard:0 "Reconstruire le chantier naval de Hai Phong"
 VIN_Rebuild_Hai_Phong_Shipyard_desc:0 "Les chantiers navals de Hai Phong sont essentiels au commerce, à la défense côtière et à la croissance industrielle. Leur renaissance reconnectera le Vietnam à la mer."

 VIN_Expand_Bo_Ho_Electricity_Plant:0 "Agrandir la centrale électrique de Bo Ho"
 VIN_Expand_Bo_Ho_Electricity_Plant_desc:0 "L'électricité est la force qui transforme les ateliers en industrie et les villes en centres de vie modernes. L'expansion de la capacité de production alimentera la prochaine étape de la reprise."
 VIN_Build_Power_Plant:0 "Construire une centrale électrique à combustible fossile"
 VIN_Build_Power_Plant_desc:0 "La production d'électricité au charbon dans nos principaux États permettra l'électrification au-delà du delta du fleuve Rouge et alimentera les usines du nouvel ordre."

 VIN_Electrify_Hong_River_Delta:0 "Électrifier le delta du fleuve Rouge"
 VIN_Electrify_Hong_River_Delta_desc:0 "Le delta du fleuve Rouge constitue le coeur démographique et agricole du Vietnam. L'électrification augmentera la productivité et démontrera la valeur pratique de la reconstruction."

 VIN_Electrify_Viet_Bac_and_Tay_Bac:0 "Électrifier le Viet Bac et le Tay Bac"
 VIN_Electrify_Viet_Bac_and_Tay_Bac_desc:0 "Les hauts plateaux révolutionnaires ne doivent pas être laissés pour compte dans le développement. Les infrastructures électriques lieront plus étroitement les régions éloignées à l'économie nationale."

 VIN_Form_Viet_Nam_Rail:0 "Former les chemins de fer vietnamiens"
 VIN_Form_Viet_Nam_Rail_desc:0 "Une administration ferroviaire unifiée peut coordonner le matériel roulant, réparer les lignes et relier les régions du pays. Le rail deviendra l'épine dorsale de la planification nationale."

 VIN_Rebuild_Quoc_Lo:0 "Reconstruire les routes nationales"
 VIN_Rebuild_Quoc_Lo_desc:0 "Les routes nationales doivent être restaurées pour permettre le déplacement de la nourriture, des troupes, des machines et des personnes. Des routes fiables sont indispensables à la fois à la défense et au développement."

 VIN_Rebuild_Ha_Noi-Lao_Cai_Rail_line:0 "Reconstruire le chemin de fer Ha Noi-Lao Cai"
 VIN_Rebuild_Ha_Noi-Lao_Cai_Rail_line_desc:0 "La ligne Ha Noi-Lao Cai relie la capitale à la frontière nord et à ses ressources. Sa reconstruction renforcera le commerce et la mobilité stratégique."

 VIN_Rebuild_Ha_Noi-Dong_Dang_Rail_line:0 "Reconstruire le chemin de fer Ha Noi-Dong Dang"
 VIN_Rebuild_Ha_Noi-Dong_Dang_Rail_line_desc:0 "La route vers Dong Dang est la principale liaison ferroviaire du Vietnam vers la Chine. Sa restauration ouvrira un canal vital pour le commerce, l'aide et la diplomatie."

 VIN_Modernize_Autonomous_Zones:0 "Moderniser les zones autonomes"
 VIN_Modernize_Autonomous_Zones_desc:0 "Les zones autonomes méritent des investissements plutôt que d'être négligées. L'industrie, les infrastructures et les services publics peuvent rendre l'unité nationale tangible dans les hauts plateaux."

 VIN_Expand_Food_Production:0 "Développer la production alimentaire"
 VIN_Expand_Food_Production_desc:0 "Aucune stratégie de développement ne peut réussir tant que l'insécurité alimentaire demeure. L'État développera la culture, le stockage et le soutien rural pour nourrir une population croissante."

 VIN_Promote_Khai_Hoang:0 "Promouvoir la remise en état des terres"
 VIN_Promote_Khai_Hoang_desc:0 "Les terres incultes peuvent devenir productives grâce à l'irrigation, à la colonisation et au travail collectif. La remise en état des terres élargira la base agricole du pays."

 VIN_Open_Lao-Cai_Apatite_Mine:0 "Ouvrir la mine d'apatite de Lao Cai"
 VIN_Open_Lao-Cai_Apatite_Mine_desc:0 "Les gisements d'apatite de Lao Cai peuvent fournir les engrais nécessaires à la modernisation de l'agriculture. L'ouverture de la mine reliera la richesse minérale à la prospérité rurale."

 VIN_Emphasize_on_Agricultural_and_Light_Industries:0 "Donner la priorité à l'agriculture et à l'industrie légère"
 VIN_Emphasize_on_Agricultural_and_Light_Industries_desc:0 "Le développement initial du Vietnam doit s'appuyer sur ses véritables atouts. L'agriculture et l'industrie légère peuvent fournir de la nourriture, des emplois, des exportations et des capitaux pour l'industrie lourde ultérieure."

 VIN_Standardize_Irrigation_Systems:0 "Standardiser les systèmes d'irrigation"
 VIN_Standardize_Irrigation_Systems_desc:0 "La gestion de l'eau doit être planifiée plutôt que laissée au hasard local. L'irrigation standardisée réduira les risques pour les cultures et améliorera les rendements dans l'ensemble des campagnes."

 VIN_Promote_Tang_Gia_San_Xuat:0 "Promouvoir les augmentations de production"
 VIN_Promote_Tang_Gia_San_Xuat_desc:0 "L'augmentation de la production doit devenir une habitude nationale. Chaque atelier, coopérative et foyer sera encouragé à contribuer davantage au redressement commun."

 VIN_Reopen_Thai_Nguyen_Tea_Plantation:0 "Rouvrir les plantations de thé Thai Nguyen"
 VIN_Reopen_Thai_Nguyen_Tea_Plantation_desc:0 "Le thé Thai Nguyen est à la fois un atout agricole et une opportunité d'exportation. La restauration des plantations apportera du travail et des revenus à la région."

 VIN_Import_Soviet_Machineries:0 "Importer des machines soviétiques"
 VIN_Import_Soviet_Machineries_desc:0 "Les machines soviétiques peuvent accélérer un processus de développement qui autrement prendrait des décennies. L'assistance technique doit être soigneusement adaptée aux conditions du Vietnam."

 VIN_Push_on_Nong_nghiep_Co_gioi:0 "Pousser la mécanisation agricole"
 VIN_Push_on_Nong_nghiep_Co_gioi_desc:0 "La mécanisation peut réduire la pénibilité et élargir la superficie que les agriculteurs peuvent cultiver. Les tracteurs, les pompes et les outils doivent être placés là où ils produiront le plus grand bénéfice."

 VIN_Popularize_Modern_Agricultural_Methods:0 "Vulgariser les méthodes agricoles modernes"
 VIN_Popularize_Modern_Agricultural_Methods_desc:0 "Les méthodes modernes de semences, d'engrais, de lutte antiparasitaire et de culture peuvent augmenter les rendements sans attendre une industrialisation complète. Le savoir agricole doit atteindre chaque village."

 VIN_Study_Soviet_And_American_Agricultural_Methods:0 "Étudier les méthodes agricoles soviétiques et américaines"
 VIN_Study_Soviet_And_American_Agricultural_Methods_desc:0 "Le Vietnam devrait tirer des leçons de toutes les sources utiles. Comparer la planification soviétique aux techniques américaines peut aider à élaborer une approche adaptée au sol, au climat et à la main-d'oeuvre locale."

 VIN_Expand_Hop_tac_Xa_models:0 "Développer les modèles coopératifs"
 VIN_Expand_Hop_tac_Xa_models_desc:0 "Les coopératives qui réussissent devraient être reproduites dans tout le pays. L'expansion doit être suffisamment organisée pour accroître la productivité, mais suffisamment flexible pour conserver la confiance locale."

 VIN_Enforce_Doi_Song_Moi:0 "Appliquer le nouveau mode de vie"
 VIN_Enforce_Doi_Song_Moi_desc:0 "Le nouveau mode de vie relie la reconstruction économique à la transformation sociale. La propreté, l'alphabétisation, la discipline et le service public doivent devenir des habitudes civiques quotidiennes."

 VIN_Reorganize_Colonial_Farmlands:0 "Réorganiser les domaines coloniaux"
 VIN_Reorganize_Colonial_Farmlands_desc:0 "Les domaines coloniaux ont été conçus pour l'extraction plutôt que pour le bien-être vietnamien. Leur réorganisation placera la terre, la main-d'oeuvre et la production parmi les priorités nationales."

 VIN_Rushing_Cong_Nghiepization_and_Hien_Dainization:0 "Accélérer l'industrialisation et la modernisation"
 VIN_Rushing_Cong_Nghiepization_and_Hien_Dainization_desc:0 "L'industrialisation et la modernisation seront poursuivies de toute urgence. L'État concentrera les investissements dans les secteurs nécessaires pour transformer le Vietnam d'une économie agraire ravagée par la guerre."

 VIN_Learn_From_Cholima_Movement:0 "Apprendre du mouvement Chollima"
 VIN_Learn_From_Cholima_Movement_desc:0 "Le mouvement Chollima offre un modèle de mobilisation rapide et d'enthousiasme industriel. Le Vietnam adaptera ses leçons pour surmonter la pénurie grâce à un effort collectif."

 VIN_Rebuild_Hai_Phong_Cement_Factory:0 "Reconstruire la cimenterie de Hai Phong"
 VIN_Rebuild_Hai_Phong_Cement_Factory_desc:0 "Le ciment est la base matérielle de la reconstruction. La relance des travaux de Hai Phong permettra de fournir des routes, des logements, des barrages et des usines dans tout le pays."

 VIN_Build_Hung_Yen_and_Bac_Ninh_Electronic_Assemblies:0 "Construire les usines électroniques de Hung Yen et Bac Ninh"
 VIN_Build_Hung_Yen_and_Bac_Ninh_Electronic_Assemblies_desc:0 "L'assemblage électronique introduira de nouvelles compétences techniques et diversifiera la base industrielle du Vietnam. Ces usines peuvent devenir le noyau d'une économie plus avancée."

 VIN_Build_Tai_Nguyen_Steel_and_Iron_Works:0 "Construire l'usine sidérurgique et sidérurgique de Thai Nguyen"
 VIN_Build_Tai_Nguyen_Steel_and_Iron_Works_desc:0 "La production d'acier est essentielle à une économie industrielle souveraine. Les usines de Thai Nguyen fourniront le métal nécessaire aux machines, à la construction et à la défense."

 VIN_Establish_Cong_Nghiep_Zones:0 "Établir des zones industrielles"
 VIN_Establish_Cong_Nghiep_Zones_desc:0 "Les zones industrielles concentrées peuvent coordonner l'énergie, les transports, la main-d'oeuvre et les investissements. Ils donneront à la planification nationale une base géographique claire."

 VIN_Rebuild_Nam_Dinh_Textile_Factory:0 "Reconstruire l'usine textile de Nam Dinh"
 VIN_Rebuild_Nam_Dinh_Textile_Factory_desc:0 "Les usines textiles de Nam Dinh peuvent fournir des emplois et des biens de consommation tout en restaurant un centre industriel historique. L'industrie légère soutiendra à la fois le niveau de vie et les exportations."

 VIN_Rebuild_Bach_mai-Phu_Bai_Airports:0 "Reconstruire les aérodromes de Bach Mai et Phu Bai"
 VIN_Rebuild_Bach_mai-Phu_Bai_Airports_desc:0 "Les aérodromes de Bach Mai et de Phu Bai renforceront les communications nationales, les interventions d'urgence et les futures capacités de défense aérienne."

 VIN_COMECON_Integration:0 "Intégrer avec COMECON"
 VIN_COMECON_Integration_desc:0 "Une intégration plus approfondie avec COMECON peut sécuriser les marchés, les machines et les partenaires de planification à long terme. Le Vietnam doit utiliser cette relation pour renforcer ses capacités plutôt que sa dépendance."

 VIN_Invite_Western_Companies:0 "Inviter des entreprises occidentales"
 VIN_Invite_Western_Companies_desc:0 "Les entreprises étrangères peuvent fournir du capital, de la technologie et une expérience en matière de gestion. Leur présence doit être réglementée pour garantir que le développement serve le Vietnam plutôt que des intérêts extérieurs."

 VIN_Import_Foreign_Vehicles:0 "Importer des véhicules étrangers"
 VIN_Import_Foreign_Vehicles_desc:0 "Les véhicules importés peuvent accélérer la logistique, la construction et la mobilité militaire tandis que l'industrie nationale rattrape les besoins nationaux."

 VIN_Modernize_Gia_Lam_Train_Company:0 "Moderniser les travaux ferroviaires de Gia Lam"
 VIN_Modernize_Gia_Lam_Train_Company_desc:0 "Les ateliers ferroviaires de Gia Lam peuvent devenir un centre de réparation et de modernisation des transports. Un meilleur matériel roulant soutiendra le commerce, les déplacements et la planification industrielle."

 VIN_Chien_Thang_Automobile:0 "L'automobile Chien Thang"
 VIN_Chien_Thang_Automobile_desc:0 "Un programme automobile vietnamien symbolisera la transition de la dépendance à la capacité industrielle nationale. Le projet Chien Thang marquera le début de ce voyage."

 VIN_Invite_Zastava_Specialist:0 "Inviter des spécialistes Zastava"
 VIN_Invite_Zastava_Specialist_desc:0 "Les spécialistes yougoslaves peuvent partager leurs expériences pratiques en matière de production automobile et d'organisation industrielle. Leurs connaissances aideront le Vietnam à éviter des erreurs précoces coûteuses."

 VIN_Research_Foreign_Designs:0 "Rechercher des modèles étrangers"
 VIN_Research_Foreign_Designs_desc:0 "Les véhicules et équipements ferroviaires étrangers fournissent de précieux enseignements techniques. En les étudiant de près, les ingénieurs vietnamiens peuvent adapter des conceptions éprouvées aux besoins locaux."

 VIN_First_Domestic_Car_Brand:0 "Première marque automobile nationale"
 VIN_First_Domestic_Car_Brand_desc:0 "Une voiture produite localement est plus qu'un bien de consommation : c'est la preuve que le Vietnam peut maîtriser une fabrication complexe et construire une identité industrielle moderne."

 VIN_Issue_Ao:0 "Émettre un équipement de protection"
 VIN_Issue_Ao_desc:0 "L'armée a besoin d'équipements de protection de base avant de pouvoir mener des opérations modernes. Des vêtements et un équipement de terrain standardisés amélioreront la survie, le moral et la discipline."

 VIN_Chin_Tranh:0 "La doctrine de la guerre populaire"
 VIN_Chin_Tranh_desc:0 "La Guerre Populaire transforme la nation tout entière en un champ de résistance. Les luttes militaires, politiques, économiques et culturelles doivent se conjuguer contre un ennemi plus fort."

 VIN_Mass_Defectors:0 "Bienvenue aux transfuges en masse"
 VIN_Mass_Defectors_desc:0 "Les soldats et les spécialistes quittant le camp ennemi peuvent apporter expérience, équipement et renseignements précieux. La révolution doit leur donner la possibilité de réintégrer la nation."

 VIN_Equip_Cong_Binh:0 "Équiper les ingénieurs de combat"
 VIN_Equip_Cong_Binh_desc:0 "Les ingénieurs de combat franchiront les rivières, élimineront les obstacles, construiront des défenses et maintiendront l'armée en mouvement. Leur équipement est un investissement à la fois en mobilité et en survie."

 VIN_Establish_Quan:0 "Établir le Quan Y Vien"
 VIN_Establish_Quan_desc:0 "Une académie médicale militaire professionnelle formera des médecins, des chirurgiens, des pharmaciens et des cadres médicaux pour l'Armée populaire. Sauver les soldats blessés fait partie du soutien à l'effort de guerre."

 VIN_Formalize_Tieu:0 "Officialiser les divisions régulières"
 VIN_Formalize_Tieu_desc:0 "Les formations de guérilla doivent être réorganisées en unités régulières capables de mener des opérations combinées. Une meilleure structure, logistique et communications transformeront l'expérience en puissance militaire durable."

 VIN_Sign_Sac_17:0 "Signer le décret n° 17/SL"
 VIN_Sign_Sac_17_desc:0 "Le décret n° 17/SL définira les régions militaires et clarifiera leurs responsabilités. Une guerre dispersée nécessite un système de commandement territorial cohérent."

 VIN_Expand_Viet_Bac_Guerilla_Networks:0 "Développez les réseaux de guérilla du Viet Bac"
 VIN_Expand_Viet_Bac_Guerilla_Networks_desc:0 "La base du Viet Bac doit rester un réseau vivant de résistance locale. Les cadres villageois, les éclaireurs et les milices rendront l'occupation coûteuse pour tout ennemi."
 VIN_Guerilla_Networks_tt:0 "Chaque §Ynoyau vietnamien détenu par l'ennemi§! gagne §YRéseaux de guérilla§!:\n§R+15%§! d'attrition, §R-20%§! d'approvisionnement local, §R-15%§! de récupération d'organisation et §Raucun redéploiement stratégique§!.\nLes réseaux s'arment partout où le front se dirige contre nous et se taisent dès que l'État est libéré §You que son peuple vient à nous§!."
 dbp_camp_under_siege:0 "La vallée assiégée"
 dbp_camp_under_siege_desc:0 "Le camp est approvisionné par voie aérienne et rien d'autre. Celui qui est creusé dans la vallée paie - et cesse de payer le jour où la vallée change de mains."
 VIN_Campaign_Mobilization:0 "Mobilisation de campagne"
 VIN_Campaign_Mobilization_desc:0 "Des mois de stockage dépensés en une seule fois. Les colonnes de porteurs devancent les divisions et le riz avance, ce qui allège, mais n'efface pas, le coût logistique d'une offensive sur les hautes terres.\n\nCela n'est valable que lorsqu'une campagne est sur le terrain."
 VIN_Campaign_Overextension:0 "Surextension opérationnelle grave"
 VIN_Campaign_Overextension_desc:0 "Les colonnes sont allées au-delà de l'opération qui leur était assignée. Les routes d'approvisionnement traversent désormais les mauvaises vallées, les réserves sont dispersées sur des fronts sans rapport et les victoires locales consomment des forces sans rapprocher l'objectif de la campagne.\n\nRetirez-vous des terrains étrangers hors théâtre pour supprimer cette pénalité sévère."
 VIN_Resistance_War_Economy:0 "Économie de guerre de la Résistance"
 VIN_Resistance_War_Economy_desc:0 "Il n'existe ni trésor ni industrie digne de ce nom. Ce qu'il y a en revanche, c'est une économie de guerre improvisée à partir du Viet Bac : des ateliers creusés à flanc de colline, du riz prélevé par le village, des porteurs là où il n'y a pas de routes, et tout ce qui passe la frontière en provenance du Kwangsi.\n\nCela ne rend pas la République démocratique solvable. Cela le rend capable de déployer une armée alors qu'il est insolvable et de perdre une capitale provinciale sans perdre la guerre - et cela ne dure que le temps que dure la guerre avec le corps d'armée."
 VIN_guerilla_network:0 "Réseaux de guérilla"
 VIN_guerilla_network_desc:0 "Les cadres villageois, les scouts et les miliciens font de l'occupation de cet État une dépense quotidienne."

 VIN_Establish_Tong:0 "Rétablir le Tong Quan Uy"
 VIN_Establish_Tong_desc:0 "Le Tong Quan Uy rétablira l'organe suprême de direction militaire du Parti. La stratégie, le développement des forces et le contrôle politique doivent être coordonnés au niveau national."

 VIN_Found_the_Cuc_Quan_Bao_Intelligence_Branch:0 "J'ai trouvé la branche de renseignement de Cuc Quan Bao"
 VIN_Found_the_Cuc_Quan_Bao_Intelligence_Branch_desc:0 "Des informations précises peuvent compenser le manque d'hommes et de matériel. Une branche centralisée du renseignement militaire suivra les mouvements de l'ennemi et protégera l'armée des infiltrations."

 VIN_Sign_Sac_50:0 "Signer le décret n° 50/SL"
 VIN_Sign_Sac_50_desc:0 "Le décret n° 50/SL formalisera le ministère de la Défense nationale et les agences de soutien au commandant en chef. La lutte armée a besoin d'une structure étatique à la hauteur de ses ambitions."

 VIN_Utilizing_Chien:0 "Utiliser le Chien Si Viet Nam Moi"
 VIN_Utilizing_Chien_desc:0 "Les Chien Si Viet Nam Moi offrent des effectifs et une expérience en dehors de la structure militaire conventionnelle. Leur service peut étendre la portée opérationnelle de la révolution."

 VIN_Raiding_CEFEO_Arsenals:0 "Raid sur les Arsenaux du CEFEO"
 VIN_Raiding_CEFEO_Arsenals_desc:0 "Les arsenaux ennemis contiennent des armes que le Vietnam ne peut pas encore fabriquer en quantité suffisante. Des raids soigneusement planifiés peuvent transformer les stocks d'occupation en force révolutionnaire."

 VIN_Smuggling_Weapons:0 "Contrebande d'armes"
 VIN_Smuggling_Weapons_desc:0 "Les routes frontalières et les réseaux clandestins peuvent amener des fusils, des véhicules et des munitions. Chaque expédition réussie rend la résistance plus difficile à isoler."

 VIN_Expand_Binh_Cong_xuong:0 "Agrandissez le Binh Cong Xuong"
 VIN_Expand_Binh_Cong_xuong_desc:0 "Des ateliers de campagne et des armureries dispersées répareront les armes, produiront du matériel simple et assureront l'approvisionnement de l'armée même sous pression."

 VIN_Sign_Sac_121:0 "Signer le décret n° 121/SL"
 VIN_Sign_Sac_121_desc:0 "Le décret n° 121/SL clarifiera les relations entre l'état-major, les organes politiques, les services d'approvisionnement et les inspections. Une armée en pleine croissance nécessite un système de commandement moderne."

 VIN_Employ_Tran:0 "Employer Tran Dai Nghia"
 VIN_Employ_Tran_desc:0 "Les scientifiques et ingénieurs vietnamiens doivent être mis au service de la défense nationale. L'expertise de Tran Dai Nghia peut relier la nécessité du temps de guerre à l'innovation autochtone."

 VIN_Mimic_French:0 "Étudier la conception des armes françaises"
 VIN_Mimic_French_desc:0 "Les équipements français offrent un modèle pratique pour une standardisation immédiate. L'étudier et le reproduire peuvent améliorer la compatibilité de l'approvisionnement à mesure que l'industrie de l'armement nationale mûrit."

 VIN_Maintain_Domestic_Weapon_Programs:0 "Maintenir les programmes d'armes nationaux"
 VIN_Maintain_Domestic_Weapon_Programs_desc:0 "Les modèles étrangers sont utiles, mais la dépendance est dangereuse. Le Vietnam doit préserver sa capacité à concevoir et fabriquer des armes en fonction de ses propres besoins."

 VIN_Plan_Large:0 "Planifiez des campagnes à grande échelle"
 VIN_Plan_Large_desc:0 "L'état-major peut désormais planifier quelque chose de plus grand que des embuscades. Concentrer des régiments pour une campagne planifiée signifie engager simultanément le ravitaillement, l'artillerie et la réputation - mais une guerre de raids dispersés ne chassera jamais le corps expéditionnaire du nord.\n\nChaque campagne qui suit s'ouvre dans sa propre saison, et les divisions ont besoin de temps pour se reconstituer entre elles."

 VIN_Thap_Van_Dai:0 "La campagne Thap Van Dai Son"
 VIN_Thap_Van_Dai_desc:0 "Au cours de l'été 1949, nos régiments sont entrés dans le Guangxi pour combattre aux côtés de l'Armée populaire de libération dans les montagnes de Thap Van Dai Son. La campagne nous coûte des hommes dans une bataille qui n'est pas la nôtre - mais elle achète l'amitié de la force qui est sur le point d'hériter de la Chine, et avec elle une frontière par laquelle nous pouvons approvisionner.\n\nNos commandants apprendront également, aux frais des Chinois, comment se déroule réellement une offensive régulière."

 VIN_Operation_Cao-Bac:0 "La campagne Cao-Bac-Lang"
 VIN_Operation_Cao-Bac_desc:0 "La campagne frontalière est la charnière de la guerre. Si les postes français le long de la route coloniale 4 - Dong Khe, That Khe, Cao Bang - peuvent être pris les uns après les autres, la frontière avec la Chine s'ouvre et le Viet Bac cesse d'être une redoute assiégée.\n\nLes Français devront voler dans ce qu'ils ne peuvent plus conduire, ce qui est précisément la guerre que nous voulons qu'ils mènent."

 VIN_Northwest:0 "La campagne du Nord-Ouest"
 VIN_Northwest_desc:0 "La Fédération Tai détenait les hauts plateaux du nord-ouest sous protection française avant le début de la guerre. Chien dich Tay Bac poussera nos divisions à travers les vallées vers la Rivière Noire, brisera les milices de la fédération et mettra tout le nord-ouest à notre disposition.\n\nParis devra choisir entre couper la fédération et défendre un pays que son armée ne peut atteindre."

 VIN_Liberate_Duyen:0 "La campagne Hoa Binh"
 VIN_Liberate_Duyen_desc:0 "De Lattre a poussé un saillant jusqu'à Hoa Binh pour couper le couloir reliant le Viet Bac aux provinces au sud du Delta. La prise des hauts plateaux de Muong ferme à nouveau ce couloir et laisse les Français tenir une route qu'ils ne peuvent approvisionner que sous le feu.\n\nC'est la première fois que nos régiments livreront une bataille de position contre un général venu en Indochine dans l'espoir d'en remporter une."

 VIN_Prepare_Dien:0 "Préparez-vous pour Dien Bien Phu"
 VIN_Prepare_Dien_desc:0 "Les Français ont largué six bataillons dans une vallée à l'extrême nord-ouest et nous ont invités à les attaquer là-bas. Nous accepterons - mais à nos conditions, et seulement une fois que l'artillerie sera dans les collines au-dessus d'eux.\n\nChaque arme doit être traînée à la main à travers les montagnes, chaque obus transporté sur une bicyclette, chaque route coupée à travers la jungle avant le premier coup de feu. Ce qui se décidera dans cette vallée sera signé à Genève."
VIN_Prepare_Dien_tt:0 "§YLancer la campagne de Dien Bien Phu contre le CEFEO§!\nAccorde §Y365 jours§! d'esprit offensif du Sud-Ouest et §G+25 levier de Genève§! pour les communistes, et ajoute à l'escalade de la guerre.\nSi aucune autre campagne n'est en cours, l'offensive de Dien Bien Phu commence aussitôt et la guerre avec la France est déclarée. Dans le cas contraire, l'offensive est reportée."

 VIN_Implement_Vo:0 "Mettre en oeuvre les réformes du général Giap"
 VIN_Implement_Vo_desc:0 "Les réformes du général Giap allieront flexibilité de guérilla et opérations régulières concentrées. L'éducation politique, la logistique et la discipline de commandement doivent progresser ensemble."

 VIN_Establish_Ban_Khong:0 "Créer le Bureau de recherche de l'Armée de l'Air"
 VIN_Establish_Ban_Khong_desc:0 "Le Vietnam ne dispose pas encore de force aérienne opérationnelle, mais il doit commencer à apprendre à défendre son ciel. Le bureau de recherche préservera les connaissances, formera des spécialistes et planifiera l'avenir."

 VIN_Establish_Ban_Thuy:0 "Créer le comité de recherche navale"
 VIN_Establish_Ban_Thuy_desc:0 "Les rivières, les côtes et les îles constituent des frontières stratégiques. Le comité de recherche navale reconstruira les bases techniques et organisationnelles d'une future marine révolutionnaire."

 VIN_Promote_Revolutionary_Patriotism:0 "Promouvoir le patriotisme révolutionnaire"
 VIN_Promote_Revolutionary_Patriotism_desc:0 "Le patriotisme donne au peuple une raison d'endurer des sacrifices. Le travail politique reliera la défense locale et les difficultés personnelles à la cause plus large de la libération nationale."

 VIN_Expand_the_300th_Dac_Cong_Command_Unit:0 "Agrandissez la 300e unité Dac Cong"
 VIN_Expand_the_300th_Dac_Cong_Command_Unit_desc:0 "Les unités d'opérations spéciales peuvent frapper là où les formations conventionnelles ne le peuvent pas. L'expansion de la 300e unité Dac Cong renforcera la capacité d'infiltration et de sabotage du Vietnam."

 VIN_Other_Arms:0 "Les autres armes de la révolution"
 VIN_Other_Arms_desc:0 "La révolution ne repose pas uniquement sur l'armée régulière. Les services aériens, navals, de sécurité, d'ingénierie et de milice doivent tous être développés dans le cadre d'un système de défense unique."

 VIN_Equip_Nha_Cong:0 "Equiper la Sécurité Publique du Peuple"
 VIN_Equip_Nha_Cong_desc:0 "La Sécurité publique populaire défendra la révolution contre l'espionnage, le sabotage et la subversion organisée. Le travail de sécurité doit être intégré à la légitimité populaire."

 VIN_Mass_Expansion:0 "Développer la milice populaire"
 VIN_Mass_Expansion_desc:0 "Un système de milices plus large peut mettre en place une défense locale dans chaque village et lieu de travail. Le peuple lui-même deviendra la première ligne de la sécurité nationale."

 VIN_Our_Position_in_the_New_Order:0 "Notre position dans le nouvel ordre"
 VIN_Our_Position_in_the_New_Order_desc:0 "L'ordre d'après-guerre est décidé par des puissances bien plus grandes que le Vietnam. Nous devons définir une position diplomatique qui protège notre indépendance tout en gagnant les partenaires dont nous avons besoin."

 VIN_The_Quest_for_UN_Recognition:0 "La quête de la reconnaissance de l'ONU"
 VIN_The_Quest_for_UN_Recognition_desc:0 "Une reconnaissance internationale renforcerait la revendication légale de souveraineté du Vietnam et rendrait plus difficile pour les puissances étrangères de traiter la république comme une insurrection temporaire."

 VIN_Eyes_Upon_the_World:0 "Les yeux sur le monde"
 VIN_Eyes_Upon_the_World_desc:0 "L'avenir du Vietnam sera façonné par des événements bien au-delà de l'Indochine. Un service diplomatique plus compétent doit surveiller le monde et identifier les opportunités avant qu'elles ne passent."

 VIN_Revisit_Sainteny_Line:0 "Revisitez la Ligne Sainteny"
 VIN_Revisit_Sainteny_Line_desc:0 "Les accords de Sainteny restent une référence pour toute discussion avec la France. Les revisiter peut révéler si une relation négociée est encore possible."

 VIN_Our_Socialist_Brothers:0 "Nos frères socialistes"
 VIN_Our_Socialist_Brothers_desc:0 "Les États socialistes partagent l'opposition du Vietnam au colonialisme, même si leurs intérêts ne sont pas identiques aux nôtres. Nous rechercherons la solidarité sans devenir un simple client."

 VIN_Meeting_with_Tito:0 "Rencontre avec Tito"
 VIN_Meeting_with_Tito_desc:0 "La Yougoslavie offre un exemple d'indépendance socialiste en dehors de la discipline rigide des blocs. Une rencontre avec Tito peut élargir les options diplomatiques du Vietnam."

 VIN_Non_Alignment_Commitment:0 "Un engagement en faveur du non-alignement"
 VIN_Non_Alignment_Commitment_desc:0 "Le Vietnam cultivera ses relations avec le monde émergent des non-alignés. L'indépendance vis-à-vis du contrôle des grandes puissances peut devenir une source de force plutôt que d'isolement."

 VIN_Licenses_from_Zavasta:0 "Licences de Zastava"
 VIN_Licenses_from_Zavasta_desc:0 "La coopération industrielle avec Zastava peut fournir au Vietnam des techniques de fabrication utiles tout en renforçant les liens avec la Yougoslavie."

 VIN_Eastern_Bloc_Embasses_in_Hanoi:0 "Ambassades du Bloc de l'Est à Hanoï"
 VIN_Eastern_Bloc_Embasses_in_Hanoi_desc:0 "Les ambassades concrétisent la solidarité. Une plus grande présence du bloc de l'Est à Hanoï améliorera la communication, le commerce, les échanges techniques et le soutien politique."

 VIN_Uncle_Hos_Eastern_Bloc_Tour:0 "Tournée du bloc de l'Est d'Oncle Ho"
 VIN_Uncle_Hos_Eastern_Bloc_Tour_desc:0 "La visite d'Hô Chi Minh présentera la lutte du Vietnam directement aux gouvernements et aux peuples d'Europe de l'Est. La diplomatie personnelle peut garantir des engagements que les documents seuls ne peuvent pas garantir."

 VIN_Cooperate_with_COMECON:0 "Coopérer avec le COMECON"
 VIN_Cooperate_with_COMECON_desc:0 "L'adhésion au COMECON relierait le Vietnam à un système plus large de commerce, de planification et d'aide technique socialiste. Elle offre des ressources pour le développement mais aussi des obligations plus profondes."

 VIN_New_Order_in_Indochina:0 "Un nouvel ordre en Indochine"
 VIN_New_Order_in_Indochina_desc:0 "La fin du régime colonial a laissé l'Indochine politiquement instable. Le Vietnam doit choisir entre poursuivre la coopération, l'influence ou la transformation révolutionnaire dans la région."

 VIN_Land_of_a_Million_Elephants:0 "Le pays du million d'éléphants"
 VIN_Land_of_a_Million_Elephants_desc:0 "Le Laos est au coeur de la géographie stratégique de l'Indochine. Ses montagnes, ses vallées fluviales et ses divisions politiques façonneront la sécurité du Vietnam pendant des décennies."

 VIN_Promote_Laotian_Peaceful_Coalition:0 "Promouvoir une coalition laotienne pacifique"
 VIN_Promote_Laotian_Peaceful_Coalition_desc:0 "Une large coalition au Laos pourrait réduire le conflit tout en ouvrant la voie aux forces progressistes pour accéder au gouvernement. Une influence pacifique peut aboutir à bien plus qu'une confrontation immédiate."

 VIN_Infilitrate_Laos_Parliament:0 "Infiltrer le Parlement laotien"
 VIN_Infilitrate_Laos_Parliament_desc:0 "La politique juridique peut être utilisée pour construire une base révolutionnaire. Les cadres et sympathisants travailleront au sein des institutions laotiennes pour étendre l'influence de la gauche."

 VIN_Rearm_the_Pathet_Lao:0 "Réarmer le Pathet Lao"
 VIN_Rearm_the_Pathet_Lao_desc:0 "L'influence politique sans protection armée est fragile. Le Pathet Lao a besoin d'armes, d'entraînement et de soutien logistique pour survivre à un équilibre régional hostile."

 VIN_Start_the_Ho_Chi_Minh_Trail_Project:0 "Commencer le projet Ho Chi Minh Trail"
 VIN_Start_the_Ho_Chi_Minh_Trail_Project_desc:0 "Une route sécurisée à travers le Laos pourrait relier les zones de base du nord aux forces alliées et aux futures opérations dans le sud. Il faut le construire avant que la guerre ne le rende indispensable."

 VIN_Assasinate_Royalists:0 "Assassiner les dirigeants royalistes"
 VIN_Assasinate_Royalists_desc:0 "L'élimination de personnalités royalistes clés affaiblirait le camp adverse, mais cela approfondirait également le conflit et rendrait la réconciliation beaucoup plus difficile."

 VIN_Ignite_the_Civil_War:0 "Déclenchez la guerre civile"
 VIN_Ignite_the_Civil_War_desc:0 "La lutte politique laotienne a atteint un point de rupture. La confrontation armée peut assurer une victoire révolutionnaire, mais elle engagera le Vietnam dans une guerre longue et dangereuse."

 VIN_Land_of_Angkor:0 "Le pays d'Angkor"
 VIN_Land_of_Angkor_desc:0 "L'histoire, la monarchie et la politique nationaliste du Cambodge exigent une approche distincte. Le Vietnam doit décider s'il doit travailler via Phnom Penh ou cultiver une alternative révolutionnaire."

 VIN_Contact_Khmer_Leftists_in_Parliament:0 "Contacter les gauchistes khmers au Parlement"
 VIN_Contact_Khmer_Leftists_in_Parliament_desc:0 "Les gauchistes khmers au sein du système politique peuvent servir de pont vers des réseaux révolutionnaires plus larges. Leur influence doit se développer tranquillement et patiemment."

 VIN_Send_Back_Viet_Minh_Trained_Khmer_Communists:0 "Retour des communistes khmers formés au Viet Minh"
 VIN_Send_Back_Viet_Minh_Trained_Khmer_Communists_desc:0 "Les cadres khmers formés par le Viet Minh peuvent transformer un mouvement clandestin en force organisée. Leur retour sera porteur à la fois d'expérience militaire et d'attentes politiques."

 VIN_Oranizing_quan_khu_in_Cambodia:0 "Organiser Quan Khu au Cambodge"
 VIN_Oranizing_quan_khu_in_Cambodia_desc:0 "Les zones révolutionnaires régionales donneront aux forces khmères la structure nécessaire pour coordonner le recrutement, la formation et l'administration locale."

 VIN_Take_Down_The_Royalists_and_Reactionaries:0 "Éliminez les royalistes et les réactionnaires"
 VIN_Take_Down_The_Royalists_and_Reactionaries_desc:0 "La clandestinité révolutionnaire tournera son attention vers les piliers de l'ordre royaliste. L'escalade peut affaiblir le régime, mais elle risque également d'entraîner un conflit ouvert."

 VIN_Decleration_of_Khmer_Krahom:0 "La déclaration des Khmers Krahom"
 VIN_Decleration_of_Khmer_Krahom_desc:0 "Un gouvernement révolutionnaire cambodgien sera proclamé au mépris de l'ordre ancien. Sa survie dépendra d'une organisation rapide, d'une défense armée et du soutien vietnamien."

 VIN_Prepare_for_Thailands_Ambition:0 "Préparez-vous aux ambitions de la Thaïlande"
 VIN_Prepare_for_Thailands_Ambition_desc:0 "La Thaïlande ne restera pas indifférente aux victoires révolutionnaires au Laos et au Cambodge. Nous devons nous préparer à la pression aux frontières, à la guerre par procuration et à l'endiguement diplomatique."

 VIN_Reapproach_Sihanouk:0 "Réapprocher Sihanouk"
 VIN_Reapproach_Sihanouk_desc:0 "Le Cambodge de Sihanouk pourrait être un meilleur partenaire qu'un champ de bataille. Un contact renouvelé peut réduire les soupçons et préserver la possibilité d'une influence pacifique."

 VIN_Assure_Sihanouk_on_Abolishing_the_Indochina_Project:0 "Assurez Sihanouk que nous mettrons fin au projet indochinois"
 VIN_Assure_Sihanouk_on_Abolishing_the_Indochina_Project_desc:0 "Le Cambodge craint que la solidarité vietnamienne cache la domination vietnamienne. Une assurance publique peut atténuer ces craintes et créer une base pour une coopération pratique."

 VIN_Son_Ngoc_Minh_Sihanouk_Secret_Meeting:0 "La réunion secrète Son Ngoc Minh-Sihanouk"
 VIN_Son_Ngoc_Minh_Sihanouk_Secret_Meeting_desc:0 "Une réunion privée peut relier les dirigeants nationalistes du Cambodge à sa gauche révolutionnaire. Un compromis discret peut réussir là où les déclarations publiques ne le peuvent pas."

 VIN_Sangkum:0 "Soutenez le Sangkum"
 VIN_Sangkum_desc:0 "Le Sangkum peut être utilisé comme un vaste cadre politique pour la stabilité du Cambodge et des réformes progressives. Le Vietnam soutiendra une voie qui évite à la fois la réaction et l'effondrement."

 VIN_Extend_HCM_Trail_in_Eastern_Cambodia:0 "Prolongez la piste Ho Chi Minh jusqu'à l'est du Cambodge"
 VIN_Extend_HCM_Trail_in_Eastern_Cambodia_desc:0 "L'Est du Cambodge offre de nouvelles routes à la logistique et aux forces alliées. L'élargissement du sentier améliorera la mobilité régionale tout en renforçant le rôle du Vietnam dans les affaires cambodgiennes."

 VIN_The_Giant_in_the_North:0 "Le géant du Nord"
 VIN_The_Giant_in_the_North_desc:0 "La guerre civile en Chine déterminera l'équilibre des pouvoirs à la frontière nord du Vietnam. Nous devons être prêts soit à un allié révolutionnaire, soit à un État nationaliste hostile."

 VIN_Red_Sun_Over_China:0 "Un soleil rouge sur la Chine"
 VIN_Red_Sun_Over_China_desc:0 "Une victoire communiste en Chine transforme la situation stratégique. Le Vietnam a désormais un puissant voisin révolutionnaire, mais l'amitié suscitera des attentes ainsi que du soutien."

 VIN_Official_Visit_to_Beijing:0 "Visite officielle à Pékin"
 VIN_Official_Visit_to_Beijing_desc:0 "Une visite officielle à Pékin établira des liens politiques et militaires directs avec les nouveaux dirigeants chinois. La relation doit être construite sur la solidarité et le respect mutuel."

 VIN_Ask_CCP_to_Follow_1895_Gerald_Convention:0 "Demandez au PCC d'honorer la Convention Gérard de 1895"
 VIN_Ask_CCP_to_Follow_1895_Gerald_Convention_desc:0 "Les arrangements frontaliers historiques restent sensibles, même entre alliés. Le Vietnam demandera à Pékin d'affirmer une base juridique claire pour des relations frontalières pacifiques."

 VIN_Recognize_PRC_Territorial_Integrity:0 "Reconnaître l'intégrité territoriale de la RPC"
 VIN_Recognize_PRC_Territorial_Integrity_desc:0 "Reconnaître l'intégrité territoriale de la Chine montrera que le Vietnam recherche un partenariat stable plutôt qu'un opportunisme le long de la frontière commune."

 VIN_Commitment_to_Asian_Revolution:0 "Engagement envers la révolution asiatique"
 VIN_Commitment_to_Asian_Revolution_desc:0 "La révolution vietnamienne peut soutenir les luttes anticoloniales à travers l'Asie grâce aux volontaires, à la formation, à l'aide matérielle et à la coordination politique."

 VIN_Invite_JCP_to_Visit_Hanoi:0 "Inviter le PCJ à Hanoï"
 VIN_Invite_JCP_to_Visit_Hanoi_desc:0 "Accueillir le Parti communiste japonais renforcera les liens avec l'un des mouvements clandestins les plus importants d'Asie et marquera le rôle révolutionnaire plus large du Vietnam."

 VIN_Support_DPRK_Legitimacy:0 "Soutenir la légitimité de la RPDC"
 VIN_Support_DPRK_Legitimacy_desc:0 "La Corée constitue un front crucial dans la lutte pour l'avenir de l'Asie. Soutenir la RPDC renforcera la solidarité avec un autre État socialiste sous pression."

 VIN_Logisitical_Support_to_Malay_Communists:0 "Soutien logistique aux communistes malais"
 VIN_Logisitical_Support_to_Malay_Communists_desc:0 "L'insurrection malaise a davantage besoin d'un soutien matériel que de rhétorique. Des expéditions discrètes peuvent approvisionner ses cadres sans surexposer le Vietnam."

 VIN_White_Sun_Over_China:0 "Un soleil blanc sur la Chine"
 VIN_White_Sun_Over_China_desc:0 "Une victoire nationaliste en Chine place le Vietnam face à un voisin du nord puissant et méfiant. La survie dépendra de la diplomatie, de la retenue et de la flexibilité interne."

 VIN_Survival_Through_Diplomacy:0 "Survie grâce à la diplomatie"
 VIN_Survival_Through_Diplomacy_desc:0 "Le Vietnam doit éviter de donner au gouvernement nationaliste un prétexte pour intervenir. Une diplomatie prudente peut préserver la révolution même dans un contexte régional défavorable."

 VIN_Contact_Lu_Hen:0 "Contacter Lu Han"
 VIN_Contact_Lu_Hen_desc:0 "Lu Han et son réseau pourraient fournir un canal vers la Chine nationaliste qui contournerait les éléments les plus hostiles de Nankin."

 VIN_Backdoor_Talks_with_Li_Zongren:0 "Discussions en coulisses avec Li Zongren"
 VIN_Backdoor_Talks_with_Li_Zongren_desc:0 "Des pourparlers non officiels peuvent tester si la coexistence est possible avant que l'un ou l'autre des gouvernements ne s'engage publiquement. La discrétion est le prix de l'expérimentation diplomatique."

 VIN_Establish_Chiang_Ho_Telegraph_Line:0 "Établir la ligne télégraphique Chiang-Ho"
 VIN_Establish_Chiang_Ho_Telegraph_Line_desc:0 "Une ligne de communication directe peut empêcher les malentendus de se transformer en crises. Cela donnera également aux deux gouvernements un moyen de gérer la frontière en toute tranquillité."

 VIN_Extradite_Radical_CCP_Members_to_China:0 "Extrader les membres radicaux du PCC vers la Chine"
 VIN_Extradite_Radical_CCP_Members_to_China_desc:0 "La remise des communistes chinois radicaux pourrait gagner la confiance des nationalistes, mais cela aliénerait une partie de la base révolutionnaire du Vietnam. Le choix est entre la survie et la solidarité."

 VIN_Negotiate_with_other_Nationalist_Parties:0 "Négocier avec d'autres partis nationalistes"
 VIN_Negotiate_with_other_Nationalist_Parties_desc:0 "Le système politique vietnamien devra peut-être s'adapter aux courants nationalistes non communistes. Une participation plus large peut renforcer la légitimité au détriment de la certitude idéologique."

 VIN_A_Reformed_Nationalist_Front:0 "Un Front nationaliste réformé ?"
 VIN_A_Reformed_Nationalist_Front_desc:0 "Une nouvelle coalition pourrait réconcilier nationalistes et communistes sous un gouvernement commun réformé. Son succès dépendra de la capacité des deux parties à accepter un compromis."

 VIN_Kunming_Conference:0 "Conférence de Kunming"
 VIN_Kunming_Conference_desc:0 "Une réunion de haut niveau à Kunming offre l'occasion de régler les conditions de coexistence avec la Chine nationaliste. Cela peut créer un règlement durable - ou révéler des objectifs irréconciliables."

 VIN_A_Failed_Conference:0 "Une conférence ratée"
 VIN_A_Failed_Conference_desc:0 "La diplomatie n'a pas réussi à résoudre les conflits fondamentaux entre Hanoï et Nankin. Le Vietnam doit maintenant se préparer à la pression, à l'isolement et à une éventuelle confrontation."

 VIN_Stand_with_Asian_Socialist_Revolution:0 "Soutenez la révolution socialiste asiatique"
 VIN_Stand_with_Asian_Socialist_Revolution_desc:0 "Une Chine nationaliste n'efface pas la révolution chinoise ; cela le pousse sous terre. Le Vietnam deviendra un sanctuaire et un partenaire pour ceux qui poursuivent la lutte."

 VIN_Contact_Wang_Ming:0 "Contacter Wang Ming"
 VIN_Contact_Wang_Ming_desc:0 "Le réseau de Wang Ming relie les révolutionnaires vietnamiens aux vétérans communistes chinois et aux structures souterraines survivantes. Leur expérience peut renforcer une résistance commune."

 VIN_Welcome_PLA_and_CCP_Members_to_Vietnam:0 "Bienvenue aux membres de l'APL et du PCC au Vietnam"
 VIN_Welcome_PLA_and_CCP_Members_to_Vietnam_desc:0 "Les membres exilés de l'APL et du PCC peuvent apporter leurs compétences militaires, leur expérience politique et leurs liens avec la clandestinité chinoise. Le Vietnam leur offrira un refuge et un rôle dans la lutte plus large."

 VIN_Mass_Anti_KMT_Propaganda:0 "Propagande de masse anti-KMT"
 VIN_Mass_Anti_KMT_Propaganda_desc:0 "Le Kuomintang doit être défié politiquement et militairement contenu. Une campagne de propagande soutenue peut affaiblir sa légitimité auprès du public chinois et asiatique."

 VIN_Yunnan_Leaflet_Campaign:0 "La campagne de brochures du Yunnan"
 VIN_Yunnan_Leaflet_Campaign_desc:0 "Les zones frontalières du Yunnan sont vulnérables à l'agitation politique. Les tracts et les réseaux clandestins peuvent véhiculer des messages anti-KMT à travers une frontière qui ne peut pas être complètement fermée."

 VIN_Fortify_the_Sino_Viet_Border:0 "Fortifier la frontière sino-vietnamienne"
 VIN_Fortify_the_Sino_Viet_Border_desc:0 "Une Chine hostile a besoin de défenses préparées au nord. Les fortifications empêcheront un envahisseur d'accéder facilement au bassin de la rivière Rouge."

 VIN_Expand_Coastal_Fortifications:0 "Agrandir les fortifications côtières"
 VIN_Expand_Coastal_Fortifications_desc:0 "Le littoral vietnamien reste exposé aux opérations de blocus et de débarquement. Les défenses côtières contribueront à protéger les ports, les centres de population et les infrastructures stratégiques."

 VIN_PLA_PAVN_Military_Exchange:0 "Échange militaire PLA-PAVN"
 VIN_PLA_PAVN_Military_Exchange_desc:0 "Une formation conjointe permettra aux révolutionnaires vietnamiens et chinois de partager leur doctrine, leur expérience du champ de bataille et leurs compétences techniques malgré la perte d'une base continentale."

 VIN_Fund_PLA_Sabotage_and_Skirmishes:0 "Financer le sabotage et les escarmouches de l'APL"
 VIN_Fund_PLA_Sabotage_and_Skirmishes_desc:0 "Des opérations à petite échelle peuvent maintenir le mouvement révolutionnaire chinois actif et forcer les nationalistes à consacrer des ressources à une frontière peu sûre."

 VIN_Join_the_Asian_Liberation_Front:0 "Rejoignez le Front de libération asiatique"
 VIN_Join_the_Asian_Liberation_Front_desc:0 "Le Vietnam alignera formellement son avenir militaire et politique sur une coalition révolutionnaire asiatique plus large. Il s'agit d'un engagement en faveur d'une lutte régionale, et non d'une simple alliance bilatérale."

 VIN_Discuss_French_intentions:0 "Discutez des intentions françaises"
 VIN_Discuss_French_intentions_desc:0 "La politique française à l'égard du Vietnam évolue, mais ses objectifs ultimes restent incertains. Nous devons déterminer si Paris recherche la paix, l'influence ou une nouvelle forme de contrôle."

 VIN_Contact_Aurbrac_for_Information:0 "Contactez l'Aubrac pour plus d'informations"
 VIN_Contact_Aurbrac_for_Information_desc:0 "Les intermédiaires français peuvent donner un aperçu de la politique parisienne et des intentions de De Gaulle. Les canaux personnels peuvent révéler ce que cachent les déclarations officielles."

 VIN_Nguyen_Duy_Trinhs_Investigation:0 "L'enquête de Nguyen Duy Trinh"
 VIN_Nguyen_Duy_Trinhs_Investigation_desc:0 "Une enquête minutieuse évaluera les risques et les opportunités d'un contact renouvelé avec la France. Le Vietnam doit négocier sur la base de la connaissance plutôt que de l'espoir."

 VIN_Initial_Neutral_Response:0 "Une première réponse neutre"
 VIN_Initial_Neutral_Response_desc:0 "Une réponse mesurée maintiendra les options diplomatiques ouvertes tout en évitant des concessions prématurées. Le Vietnam doit faire preuve de confiance sans provoquer d'hostilité inutile."

 VIN_De_Gaulle_Ho_Chi_Minh_Telegraphs:0 "Les Télégrammes de Gaulle-Ho Chi Minh"
 VIN_De_Gaulle_Ho_Chi_Minh_Telegraphs_desc:0 "Des messages directs entre de Gaulle et Hô Chi Minh pourraient ouvrir une voie inattendue. Leur ton déterminera si de nouvelles discussions sont possibles."

 VIN_Cautious_with_De_Gaulle:0 "Restez prudent avec de Gaulle"
 VIN_Cautious_with_De_Gaulle_desc:0 "La bonne volonté française peut être temporaire ou tactique. Nous éviterons les engagements contraignants jusqu'à ce que Paris démontre qu'il respecte la souveraineté vietnamienne."

 VIN_Recognize_De_Gaulles_Goodwill:0 "Reconnaître la bonne volonté de De Gaulle"
 VIN_Recognize_De_Gaulles_Goodwill_desc:0 "Les ouvertures de De Gaulle pourraient ouvrir la voie à une politique française plus indépendante. Répondre positivement pourrait réduire le risque d'une nouvelle confrontation."

 VIN_Unofficial_Meeting_in_Lysee:0 "Une réunion officieuse à l'Elysée"
 VIN_Unofficial_Meeting_in_Lysee_desc:0 "Une conversation non officielle à l'Elysée peut explorer des possibilités que la diplomatie formelle ne peut pas encore reconnaître. Les deux parties testeront les limites du compromis."

 VIN_Manac_As_Vietnam_Unification_Mediator:0 "Mannac, médiateur de l'unification vietnamienne"
 VIN_Manac_As_Vietnam_Unification_Mediator_desc:0 "Un intermédiaire respecté peut transformer une vague bonne volonté en un processus concret de réunification vietnamienne. La médiation peut offrir une voie pour sortir d'une diplomatie de grande puissance dans l'impasse."

 VIN_Take_Advantage_of_the_French_American_Rivalry:0 "Exploiter la rivalité franco-américaine"
 VIN_Take_Advantage_of_the_French_American_Rivalry_desc:0 "Les divergences entre Paris et Washington peuvent donner un levier au Vietnam. Nous demanderons des concessions à la France sans devenir un pion dans un conflit occidental."

 VIN_Assist_De_Gaulle_Gaining_SFIO_Trust:0 "Aidez de Gaulle à gagner la confiance de la SFIO"
 VIN_Assist_De_Gaulle_Gaining_SFIO_Trust_desc:0 "Aider de Gaulle à gagner le soutien des socialistes français pourrait rendre un règlement avec le Vietnam politiquement durable en France."

 VIN_A_Missed_Opportunity:0 "Une opportunité manquée"
 VIN_A_Missed_Opportunity_desc:0 "La prudence a préservé notre liberté d'action, mais elle a peut-être aussi fermé une rare ouverture diplomatique. Le Vietnam doit désormais compter sur ses propres forces."

 VIN_Affirm_Long_Term_Soviet_Support:0 "Affirmer le soutien soviétique à long terme"
 VIN_Affirm_Long_Term_Soviet_Support_desc:0 "Un partenariat durable avec Moscou peut fournir les capitaux, les mécanismes et la protection politique nécessaires au développement socialiste à long terme."

 VIN_Bandung_Conference:0 "La Conférence de Bandoung"
 VIN_Bandung_Conference_desc:0 "Bandung offre au Vietnam une plateforme parmi les États nouvellement indépendants. Nous présenterons notre lutte dans le cadre d'un mouvement plus large pour la souveraineté anticoloniale."

 VIN_Mediate_Laotian_Royalist_Communist_Conflict:0 "Assurer la médiation dans le conflit royaliste-communiste laotien"
 VIN_Mediate_Laotian_Royalist_Communist_Conflict_desc:0 "Le Vietnam tentera d'empêcher le Laos de devenir un autre champ de bataille de compétition entre grandes puissances. Un règlement pourrait sécuriser la frontière plus efficacement qu'une conquête."

 VIN_PAVN_ANL_Joint_Patrol:0 "Patrouilles conjointes PAVN-ANL"
 VIN_PAVN_ANL_Joint_Patrol_desc:0 "Les patrouilles conjointes peuvent renforcer la confiance entre les forces vietnamiennes et laotiennes tout en démontrant que la coopération, et non la domination, est la base de nos relations."

 VIN_Dong_Phouma_Communique:0 "Le communiqué Dong-Phouma"
 VIN_Dong_Phouma_Communique_desc:0 "Un communiqué public peut transformer des discussions privées en un cadre de coexistence. Son langage doit rassurer à la fois les circonscriptions royalistes et révolutionnaires."

 VIN_Hope_for_Peace:0 "Espoir de paix"
 VIN_Hope_for_Peace_desc:0 "Si le règlement laotien tient, l'Indochine pourrait enfin échapper au cycle d'escalade. Le Vietnam investira dans la paix tout en se préparant à son effondrement."

 VIN_Mediate_Sino_Soviet_Conflict:0 "Servir de médiateur dans le conflit sino-soviétique"
 VIN_Mediate_Sino_Soviet_Conflict_desc:0 "Le conflit croissant entre Pékin et Moscou menace tous les mouvements socialistes. Le Vietnam tentera de préserver l'unité et d'empêcher le conflit de diviser l'Asie."

 VIN_A_Concerning_Future_for_Global_Revolution:0 "Un avenir inquiétant pour la révolution mondiale"
 VIN_A_Concerning_Future_for_Global_Revolution_desc:0 "La fracture du camp socialiste ne peut être ignorée. Le Vietnam doit décider s'il doit s'orienter vers un centre unique, rester un médiateur ou défendre une ligne indépendante."

 VIN_Prepare_for_the_Worst:0 "Préparez-vous au pire"
 VIN_Prepare_for_the_Worst_desc:0 "Une rupture de la coexistence avec la Chine exige une préparation pratique. Le pays doit être prêt à affronter l'isolement diplomatique, la pression aux frontières et le danger militaire."

 VIN_Final_Steps_to_Mutual_Coexistence:0 "Dernières étapes vers une coexistence mutuelle"
 VIN_Final_Steps_to_Mutual_Coexistence_desc:0 "Un règlement réussi doit être rendu durable grâce à des accords pratiques. La paix nécessitera des engagements sur les frontières, le commerce et la retenue politique."

 VIN_Settle_Border_Issues:0 "Régler les problèmes frontaliers"
 VIN_Settle_Border_Issues_desc:0 "Les frontières non résolues sont une invitation à de futurs conflits. Les concessions peuvent être douloureuses, mais une frontière claire peut garantir les conditions d'un développement pacifique."

 VIN_Hanoi_Nanjing_Trade_Agreement:0 "L'accord commercial Hanoï-Nanjing"
 VIN_Hanoi_Nanjing_Trade_Agreement_desc:0 "Le commerce peut transformer la coexistence politique en un intérêt partagé. Un accord Hanoï-Nanjing reliera la stabilité aux marchés, aux transports et aux avantages économiques mutuels."

 VIN_A_Coming_Storm_for_China:0 "Une tempête à venir pour la Chine"
 VIN_A_Coming_Storm_for_China_desc:0 "Le Front asiatique de libération se prépare à une confrontation plus large avec le régime nationaliste. Le Vietnam doit décider jusqu'où il est prêt à aller dans la lutte à venir."

