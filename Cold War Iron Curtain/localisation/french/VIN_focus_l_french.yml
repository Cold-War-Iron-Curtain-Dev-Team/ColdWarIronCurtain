 VIN_Dai_Hoi_III_Thanh_TT:0 "Le Congrès approuve la ligne des commissaires : les responsables politiques durcissent l'armée, au détriment de la stabilité civile."
 VIN_Dai_Hoi_III_Duan_TT:0 "Le Congrès approuve la Ligne Sud : le Parti s'engage dans la lutte sudiste et renforce le Front de libération nationale."
 VIN_Dai_Hoi_III_Giap_TT:0 "Le Congrès approuve la Ligne générale du peuple : une stratégie professionnelle et une armée plus forte."
 VIN_Dai_Hoi_III_Chinh_TT:0 "Le Congrès approuve la ligne du parti : discipline orthodoxe et autorité politique."
 VIN_Dai_Hoi_III_Tho_TT:0 "Le Congrès endosse la Ligne d'Organisation : l'appareil du Parti resserre son emprise et renforce le Front de Libération Nationale."

 VIN_Chinese_Patronage:0 "Groupe consultatif militaire chinois"
 VIN_Chinese_Patronage_desc:0 "Pékin propose des conseillers sous Wei Guoqing et Chen Geng, des fusils et une route d'approvisionnement ouverte. Le Viet Minh reçoit un flux d'aide plus important et plus régulier, et la délégation chinoise fera pression pour un règlement à Genève. Le patronage soviétique ne peut plus être choisi une fois l'aide chinoise acceptée."
 VIN_Chinese_Patronage_tt:0 "Chaque campagne commence avec §G+15§! Campaign Supply.\nDes fusils et du matériel de soutien arrivent de Chine chaque mois.\nPetite pression chinoise à Genève : §G+25§! levier communiste.\n§RExclut le patronage soviétique§!"
 VIN_Soviet_Patronage:0 "Mission militaire soviétique"
 VIN_Soviet_Patronage_desc:0 "Moscou envoie des spécialistes de l'artillerie et de la défense antiaérienne à la place des conseillers chinois. Le flux d'approvisionnement est moindre, mais les armes sont meilleures et le coprésident soviétique donne du poids au Viet Minh à Genève. Le patronage chinois ne peut plus être choisi une fois la mission soviétique acceptée."
 VIN_Soviet_Patronage_tt:0 "Chaque campagne commence avec §G+5§! Campaign Supply.\nL'artillerie et les canons anti-aériens arrivent chaque mois d'Union soviétique, de meilleure qualité.\n§G+100§! de puissance politique, un bonus de recherche de doctrine et un bonus de recherche d'artillerie.\nPoids soviétique à Genève : §G+40§! effet de levier communiste.\n§RExclut le patronage chinois§!"
 VIN_Prepare_Dien_Northwest_Recovered_tt:0 "La campagne rouverte dans le Nord-Ouest s'est soldée par un succès coûteux, gardant le couloir vers Hanoï."
