VIN_Strike_Vinh_Yen:0 "Frappez Vinh Yen"
VIN_Strike_Vinh_Yen_desc:0 "Les Français ont concentré leur réserve mobile au nord-ouest de Hanoï. Une offensive limitée à Vinh Yen testera si le nouveau commandement de de Lattre peut résister à nos divisions régulières en bataille ouverte."
VIN_Attack_Mao_Khe:0 "Attaquez Mao Khe"
VIN_Attack_Mao_Khe_desc:0 "Les approches orientales et la zone charbonnière de Mao Khe forment une extension vulnérable de la ligne du delta. Nous frapperons les avant-postes avant que les Français puissent les renforcer pleinement par voie fluviale."
VIN_The_Battle_of_the_Day_River:0 "La bataille de la rivière Day"
VIN_The_Battle_of_the_Day_River_desc:0 "Une vaste offensive à travers la ligne de Day River peut éloigner les districts catholiques de la position française et étendre leurs groupes mobiles sur plusieurs objectifs."
VIN_Strike_Nghia_Lo:0 "Grève à Nghia Lo"
VIN_Strike_Nghia_Lo_desc:0 "Le pays Tai, entre les fleuves Rouge et Noir, est tenu par une fine ligne de postes. Un coup porté à Nghia Lo montrera si les Français peuvent encore atteindre les hauts plateaux, et ce qu'il leur reste pour les atteindre."
VIN_Nghia_Lo_Northwest_Bonus_tt:0 "Parce que Nghia Lo a été prise, la campagne du Nord-Ouest commence avec §G+25 ravitaillement de campagne§!."
VIN_Assault_Na_San:0 "Assautez le hérisson Na San"
VIN_Assault_Na_San_desc:0 "Les forces de l'Union française en retraite se sont rassemblées autour d'un camp de ravitaillement aérien à Na San. Son anneau de points forts doit être testé avant que le corps expéditionnaire ne fasse du hérisson un modèle pour les batailles futures."
