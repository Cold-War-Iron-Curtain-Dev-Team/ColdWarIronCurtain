 #Desc
 SPHERE_NONE_DESC: "Cette nation n'est affiliée à aucune sphère."
 SPHERE_HOL_DESC: "\n\n£Sphere_Netherlands_pic\n\n\n\n\n\n\n\n\nL'histoire de l'Empire colonial néerlandais commence par une expédition remarquable visant à exploiter l'abondant commerce des épices de l'Asie du Sud-Est. À la fin du XVIe siècle, Cornelis de Houtman, un audacieux navigateur hollandais, mena une expédition au sultanat de Banten. Le voyage de l'ambitieux De Houtman a marqué le début d'une présence néerlandaise significative dans la région et a ouvert la voie aux ambitions coloniales européennes."
 SPHERE_INO_HOL_UNION_DESC: "\n\n£Sphere_Dutch_Indonesian_Union_pic\n\n\n\n\n\n\n\n\nCréée lors de la table ronde historique, l'Union néerlando-indonésienne représente un partenariat important entre l'Indonésie et le Royaume des Pays-Bas. Cette union a été formée dans le contexte de la lutte pour l'indépendance de l'Indonésie et vise à favoriser les relations de coopération, les liens économiques et la compréhension mutuelle entre les deux nations."
 SPHERE_SOV_FIN_DESC: "\n\n£Sphere_Soviet_Finland_pic\n\n\n\n\n\n\n\n\nAprès la Seconde Guerre mondiale, la Finlande se retrouve dans une situation précaire, partageant une longue frontière avec l'Union soviétique. Pour maintenir son indépendance et éviter les conflits, la Finlande a adopté une politique de neutralité et de coopération avec l'Union soviétique, tout en préservant ses institutions démocratiques et son économie de marché. Cela a permis à la Finlande de naviguer tout en préservant sa souveraineté."
 SPHERE_SOV_DESC: "\n\n£Sphere_Soviet_Union_pic\n\n\n\n\n\n\n\n\nL'Union soviétique §Y§! a émergé des cendres de l'Empire russe à la suite des événements tumultueux de la Révolution d'Octobre en 1917. Sous la direction du Parti bolchevique, dirigé par des personnalités telles que Vladimir Lénine et plus tard Joseph Staline, l'Union soviétique a cherché à établir un nouveau monde, fondé sur les principes du marxisme-léninisme. La nation s'est rapidement transformée en un État autocratique centralisé, caractérisé par une économie planifiée, une collectivisation de l'agriculture et une concentration sur l'industrie lourde.\n\nTout au long de son existence, l'Union soviétique a joué un rôle central dans les affaires mondiales, en particulier pendant la Seconde Guerre mondiale et la guerre froide qui a suivi. Il faisait contrepoids aux puissances capitalistes occidentales"
 SPHERE_USA_DESC: "\n\n£Sphere_United_States_pic\n\n\n\n\n\n\n\n\n\"§YAlors nous devons vaincre lorsque notre cause est juste, et telle est notre devise :§! '§CEn Dieu est notre confiance.§!'\"\n\nLes §YÉtats-Unis d'Amérique§! sont sortis de la Seconde Guerre mondiale comme une nation d'idéaux. Avec la doctrine Truman prenant le pas sur la doctrine Monroe, l'Amérique est entrée dans une nouvelle ère où l'ancien Empire s'estompait. Et le début d'une rivalité avec l'Union soviétique communiste."
 SPHERE_RAJ_DESC: ""
 SPHERE_CHI_DESC: "\n\n£Sphere_China_ROC_pic\n\n\n\n\n\n\n\n\nPendant près d'un siècle, le pays du dragon a subi abus, colonisation et souffrance. Cela a commencé à changer lorsque le Kuomintang a uni la nation sous une cause commune pour résister à l'Empire du Japon pendant la Seconde Guerre sino-japonaise.\n\nLe « siècle de l'humiliation » semblait sur le point de toucher à sa fin, car le triomphe du Kuomintang sur le Japon allait conduire à une résurgence de la puissance chinoise. Avec la menace du communisme qui se profilait, on espérait que la Chine pourrait à nouveau reconquérir sa position de puissance mondiale."
 SPHERE_ENG_DESC: "\n\n£Sphere_United_Kingdom_pic\n\n\n\n\n\n\n\n\nL'Empire britannique, à son apogée, était le plus grand empire de l'histoire et, pendant plus d'un siècle, la première puissance mondiale. L'expression « le soleil ne se couche jamais sur l'Empire britannique » décrit avec justesse sa vaste étendue à travers le monde. L'influence de l'empire s'étendait sur plusieurs continents, englobant diverses cultures et régions, et a joué un rôle central dans l'élaboration de l'histoire du monde à travers la colonisation, le commerce et les échanges culturels."
 SPHERE_SOV_Satellite_DESC: "\n\n£Sphere_Soviet_Satellite_pic\n\n\n\n\n\n\n\n\nAprès la fin de la Seconde Guerre mondiale, l'Union soviétique a créé de nombreux États pro-soviétiques en Europe de l'Est. Ces nations ont été reconnues comme souveraines et indépendantes par les Nations Unies, leur accordant un statut formel de pays distincts au sein de la communauté internationale.\n\nMais dans la pratique, il est fortement dépendant et s'appuie sur l'aide soviétique. Leurs systèmes politiques, leur développement économique et leurs structures de sécurité étaient étroitement liés à l'Union soviétique, ce qui les rendait dépendants du soutien soviétique dans de nombreux aspects de la gouvernance et du développement national."
 SPHERE_PER_DESC: "\n\n£Sphere_None_pic\n\n\n\n\n\n\n\n\nL'histoire de l'Iran, anciennement connue sous le nom de Perse, est une tapisserie tissée d'un riche patrimoine culturel, de civilisations anciennes et d'événements historiques importants. Depuis l'essor de l'empire achéménide sous Cyrus le Grand jusqu'à la conquête islamique et la dynastie safavide qui a suivi, l'Iran a été un carrefour de cultures et d'empires. Le XXe siècle a vu l'Iran subir des changements politiques importants, notamment la Révolution constitutionnelle, les efforts de modernisation de la dynastie Pahlavi et la Révolution islamique de 1979, qui a établi la République islamique. Aujourd'hui, l'Iran continue de jouer un rôle crucial dans les affaires régionales et mondiales."
 SPHERE_INO_DESC: "\n\n£Sphere_Indonesia_pic\n\n\n\n\n\n\n\n\nLa République d'Indonésie, un vaste archipel de plus de 17 000 îles, a une histoire riche et complexe qui a façonné son identité en tant que nation. Depuis les anciens royaumes de Srivijaya et de Majapahit jusqu'à l'époque de la domination coloniale néerlandaise, le passé de l'Indonésie est marqué par une tapisserie de cultures, de religions et d'influences. La lutte pour l'indépendance au milieu du XXe siècle, menée par des personnalités comme Sukarno et Hatta, a culminé avec la proclamation de l'indépendance en 1945. Depuis lors, l'Indonésie a parcouru la voie de l'édification de la nation, du développement économique et de la diversité culturelle, émergeant comme un pays dynamique et influent en Asie du Sud-Est."
