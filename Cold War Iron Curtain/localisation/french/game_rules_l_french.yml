 RULE_OPTION_YES: "Oui"
 RULE_OPTION_NO: "Non"
 RULE_GROUP_COUNTRY_SPECIFIC: "Règles de jeu spécifiques au pays"
 RULE_GROUP_GENERAL_FOREIGN_POLICY: "Politique étrangère"
 RULE_ALLOW_WARGOALS: "Objectifs de guerre"
 RULE_OPTION_ALWAYS_FREE: "Toujours gratuit"
 RULE_ALLOW_WARGOALS_ALWAYS_FREE_DESC: "Sans restriction pour toute idéologie, quelle que soit la tension mondiale."
 RULE_OPTION_LIMITED: "Limité"
 RULE_ALLOW_WARGOALS_LIMITED_DESC: "Wargoal Generation est limité par les idéologies et les limites de la tension mondiale."
 RULE_OPTION_FREE_25: "Gratuit à 25 % de tension mondiale"
 RULE_OPTION_FREE_50: "Gratuit à 50 % de tension mondiale"
 RULE_OPTION_FREE_75: "Gratuit à 75 % de tension mondiale"
 RULE_OPTION_FREE_100: "Gratuit à 100% Tension Mondiale"
 RULE_ALLOW_WARGOALS_FREE_25_DESC:1 "La génération de Wargoal est désactivée en dessous de 25 % de tension mondiale, mais disponible pour toutes les nations par la suite. Cela annule toutes les restrictions idéologiques, mais permet toujours d'atteindre des objectifs de guerre grâce aux focus."
 RULE_ALLOW_WARGOALS_FREE_50_DESC:1 "La génération de Wargoal est désactivée en dessous de 50 % de tension mondiale, mais disponible pour toutes les nations par la suite. Cela annule toutes les restrictions idéologiques, mais permet toujours d'atteindre des objectifs de guerre grâce aux focus."
 RULE_ALLOW_WARGOALS_FREE_75_DESC:1 "La génération de Wargoal est désactivée en dessous de 75 % de tension mondiale, mais disponible pour toutes les nations par la suite. Cela annule toutes les restrictions idéologiques, mais permet toujours d'atteindre des objectifs de guerre grâce aux focus."
 RULE_ALLOW_WARGOALS_FREE_100_DESC:1 "La génération de Wargoal est désactivée en dessous de 100 % de tension mondiale, mais disponible pour toutes les nations par la suite. Cela annule toutes les restrictions idéologiques, mais permet toujours d'atteindre des objectifs de guerre grâce aux focus."
 RULE_OPTION_FOCUSES_ONLY: "Se concentre uniquement"
 RULE_ALLOW_WARGOALS_FOCUSES_ONLY_DESC: "Les objectifs de guerre ne peuvent être obtenus qu'à partir d'objectifs, d'événements et de décisions nationaux."
 RULE_ALLOW_MILITARY_ACCESS: "Droits d'accès et d'amarrage militaires"
 RULE_OPTION_FREE: "Gratuit"
 RULE_OPTION_SAME_IDEOLOGY: "Même idéologie seulement"
 RULE_OPTION_SAME_FACTION: "Même faction uniquement"
 RULE_OPTION_BLOCKED: "Bloqué"
 RULE_OPTION_ALLOWED: "Autorisé"
 RULE_OPTION_AI_ONLY: "Contre l'IA uniquement"
 RULE_OPTION_PLAYER_ONLY: "Contre joueur uniquement"
 RULE_OPTION_NORMAL: "Normale"
 RULE_OPTION_NONE: "Aucun"
 RULE_ALLOW_ACCESS_FREE_DESC: "Les pays peuvent obtenir un accès militaire et des droits d'amarrage depuis n'importe quel autre pays."
 RULE_ALLOW_ACCESS_SAME_IDEOLOGY_DESC: "Les pays peuvent obtenir un accès militaire et des droits d'amarrage auprès de pays partageant la même idéologie dirigeante."
 RULE_ALLOW_ACCESS_BLOCKED_DESC: "Les pays ne peuvent jamais obtenir un accès militaire ni des droits d'amarrage auprès d'un autre pays en dehors d'une faction."
 RULE_ALLOW_RELEASE_NATIONS: "Nations de libération"
 RULE_ALLOW_RELEASE_NATIONS_FREE_DESC: "Les pays peuvent toujours libérer les nations à moins d'être spécifiquement empêchés."
 RULE_OPTION_PEACE_ONLY: "Seulement en paix"
 RULE_ALLOW_RELEASE_NATIONS_PEACE_ONLY_DESC: "Les pays ne peuvent libérer les nations qu'en paix."
 RULE_ALLOW_RELEASE_NATIONS_BLOCKED_DESC: "Les pays ne pourront jamais libérer les nations."
 RULE_ALLOW_RELEASE_NATIONS_NOT_BRITAIN_TOOLTIP: "§Y[ENG.GetName]§! ne peut libérer ce pays que via la branche §YDécolonisation§! de l'arbre de focus §Y§!."
 RULE_ALLOW_RELEASE_NATIONS_NOT_YUGOSLAVIA_TOOLTIP: "§Y[YUG.GetName]§! ne peut libérer ce pays que via la branche §YAutonomie gouvernementale§! dans l'arbre de concentration §Y§!."
 RULE_ALLOW_RELEASE_NATIONS_NOT_TRANSYLVANIA_TOOLTIP: "§Y[ROOT.GetNameDefCap]§! ne peut pas libérer ce pays."
 RULE_ALLOW_RELEASE_NATIONS_SPAIN_TOOLTIP: "§Y[ROOT.GetName]§! ne pourra libérer ce pays qu'après la fin de la guerre civile espagnole."
 RULE_ALLOW_RELEASE_NATIONS_ANARCHIST_SPAIN_TOOLTIP: "§Y[ROOT.GetName]§! §Rest une commune anarchiste et ne peut pas libérer ou fantocher les nations.§!"
 RULE_ALLOW_RELEASE_NATIONS_PEACE_ONLY_TOOLTIP: "Règle du jeu : §RLes pays ne peuvent libérer les nations qu'en paix.§!"
 RULE_ALLOW_RELEASE_NATIONS_BLOCKED_TOOLTIP: "Règle du jeu : §RLes pays ne peuvent jamais libérer les nations.§!"
 RULE_ALLOW_LICENSING: "Licences de production"
 RULE_ALLOW_LICENSING_FREE_DESC: "Les pays peuvent acquérir des licences de production auprès de n'importe quel pays."
 RULE_ALLOW_LICENSING_SAME_IDEOLOGY_DESC: "Les pays ne peuvent acquérir des licences de production qu'auprès de pays partageant la même idéologie dominante."
 RULE_ALLOW_LICENSING_SAME_FACTION_DESC: "Les pays ne peuvent acquérir des licences de production qu'auprès de pays appartenant à la même faction."
 RULE_ALLOW_LICENSING_BLOCKED_DESC: "Les pays ne peuvent jamais acquérir de licences de production en dehors de décisions et d'événements spéciaux."
 RULE_ALLOW_LEND_LEASE: "Prêter Bail"
 RULE_ALLOW_LEND_LEASE_FREE_DESC: "Les pays peuvent prêter ou louer du matériel à n'importe qui, quel que soit le niveau de tension mondiale."
 RULE_ALLOW_LEND_LEASE_LIMITED_DESC: "Le prêt-bail est limité par la tension mondiale et les règles idéologiques."
 RULE_ALLOW_LEND_LEASE_SAME_IDEOLOGY_DESC: "Les pays ne peuvent prêter ou louer du matériel qu'à des pays partageant la même idéologie dirigeante."
 RULE_ALLOW_LEND_LEASE_SAME_FACTION_DESC: "Les pays ne peuvent prêter ou louer du matériel qu'aux pays de la même faction."
 RULE_ALLOW_LEND_LEASE_BLOCKED_DESC: "Les pays ne peuvent jamais prêter ou louer du matériel à un autre pays."
 RULE_ALLOW_VOLUNTEERS: "Bénévoles"
 RULE_ALLOW_VOLUNTEERS_FREE_DESC: "Les pays peuvent envoyer des volontaires dans n'importe quel pays, quelle que soit la tension mondiale."
 RULE_ALLOW_VOLUNTEERS_LIMITED_DESC: "L'envoi de volontaires est limité par la tension mondiale et les règles idéologiques."
 RULE_ALLOW_VOLUNTEERS_SAME_IDEOLOGY_DESC: "Les pays ne peuvent envoyer des volontaires que dans des pays partageant la même idéologie dirigeante."
 RULE_ALLOW_VOLUNTEERS_BLOCKED_DESC: "Les pays ne peuvent jamais envoyer de volontaires dans aucun pays."
 RULE_ALLOW_GUARANTEES: "Garantir l'indépendance"
 RULE_ALLOW_GUARANTEES_FREE_DESC: "L'indépendance de n'importe quel pays peut être garantie à tout moment, quelle que soit la tension mondiale."
 RULE_ALLOW_GUARANTEES_LIMITED_DESC: "L'émission d'une garantie d'indépendance est limitée par la tension mondiale et l'idéologie."
 RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_DESC: "Les pays ne peuvent garantir que les pays qui partagent leur idéologie dominante."
 RULE_ALLOW_GUARANTEES_BLOCKED_DESC: "Les pays ne peuvent jamais garantir les autres pays. Cela n'affecte pas les garanties qui existent au début du jeu ou qui sont émises via des focus nationaux."
 RULE_ALLOW_REVOKE_GUARANTEES: "Révoquer les garanties"
 RULE_ALLOW_REVOKE_GUARANTEES_ALLOWED_DESC: "Les garanties d'indépendance peuvent être révoquées."
 RULE_ALLOW_REVOKE_GUARANTEES_BLOCKED_DESC: "Les garanties d'indépendance ne peuvent jamais être révoquées en dehors des préoccupations nationales."
 RULE_ALLOW_REVOKE_GUARANTEES_BLOCKED_TOOLTIP: "Règle du jeu : §RLes garanties d'indépendance ne peuvent jamais être révoquées en dehors des objectifs nationaux.§!"
 RULE_ALLOW_LEAVE_FACTION: "Quitter la faction"
 RULE_ALLOW_LEAVE_FACTION_ALLOWED_DESC: "Les pays pleinement souverains peuvent quitter une faction alors qu'ils sont en paix."
 RULE_ALLOW_LEAVE_FACTION_BLOCKED_DESC: "Les pays ne peuvent pas quitter une faction, sauf à travers des focus et des événements nationaux."
 RULE_ALLOW_KICK_FACTION: "Coup de pied de faction"
 RULE_ALLOW_KICK_FACTION_ALLOWED_DESC: "Le chef d'une faction peut expulser n'importe quel pays de la faction."
 RULE_ALLOW_KICK_FACTION_BLOCKED_DESC: "Le chef d'une faction ne peut expulser aucun membre de la faction."
 RULE_ALLOW_TAKE_OVER_FACTION: "Prendre le contrôle de la faction"
 RULE_ALLOW_TAKE_OVER_FACTION_ALLOWED_DESC: "Les pays peuvent prendre la direction d'une faction s'ils remplissent les critères."
 RULE_ALLOW_TAKE_OVER_FACTION_BLOCKED_DESC: "Les pays ne peuvent pas prendre la direction des factions."
 RULE_GROUP_DIVISION_TEMPLATES: "Modèles de divisions"
 RULE_ALLOW_PARATROOPERS: "Paradrops"
 RULE_ALLOW_PARATROOPERS_ALLOWED_DESC: "Les pays peuvent exécuter librement des parachutages."
 RULE_ALLOW_PARATROOPERS_BLOCKED_DESC: "Les pays ne peuvent en aucun cas exécuter des parachutages. Les divisions parachutistes pourront toujours être recrutées, mais ne pourront pas exécuter d'attaques aéroportées."
 RULE_ALLOW_PARATROOPERS_BLOCKED_TOOLTIP: "Règle du jeu : §RLes pays ne peuvent en aucun cas exécuter des parachutages.§!"
 RULE_GROUP_COVERT_ACTIONS: "Actions secrètes"
 RULE_ALLOW_COUPS: "Coups d'État"
 RULE_ALLOW_COUPS_FREE_DESC: "Les pays peuvent préparer et exécuter des coups d'État librement."
 RULE_ALLOW_COUPS_AI_ONLY_DESC: "Les pays ne peuvent préparer et exécuter des coups d'État que contre des nations non jouées par un humain."
 RULE_ALLOW_COUPS_BLOCKED_DESC:1 "Les pays ne peuvent pas préparer ou exécuter des coups d'État dans quelque nation que ce soit."
 RULE_ALLOW_PARTY_BOOSTING: "Stimuler la popularité du parti"
 RULE_ALLOW_PARTY_BOOSTING_FREE_DESC: "Les pays peuvent accroître la popularité des partis dans n'importe quel autre pays."
 RULE_ALLOW_PARTY_BOOSTING_AI_ONLY_DESC: "Les pays ne peuvent augmenter la popularité des partis que dans des pays non joués par un humain."
 RULE_ALLOW_PARTY_BOOSTING_PLAYER_ONLY_DESC: "Les pays ne peuvent accroître la popularité des partis que dans les pays comptant un joueur humain."
 RULE_ALLOW_PARTY_BOOSTING_BLOCKED_DESC: "Les pays ne peuvent accroître la popularité d'un parti dans aucun pays."
 RULE_ALLOW_DEPENDENT_STATE: "État dépendant"
 RULE_ALLOW_DEPENDENT_STATE_FREE_DESC: "Les pays peuvent user de leur influence pour manipuler d'autres nations."
 RULE_ALLOW_DEPENDENT_STATE_BLOCKED_DESC: "Les pays ne peuvent pas user de leur influence pour manipuler les autres nations"
 RULE_GROUP_CONSTRUCTION: "Construction"
 RULE_GROUP_GAMEPLAY: "Règles de jeu"
 RULE_MAXIMUM_FORT_LEVEL: "Niveau maximum du fort"
 RULE_MAXIMUM_FORT_LEVEL_NORMAL_DESC: "Les pays peuvent construire des forts terrestres et côtiers selon les restrictions normales."
 RULE_MAXIMUM_FORT_LEVEL_DESC: "Les pays ne peuvent construire des forts terrestres et côtiers qu'au niveau sélectionné. Les fortifications présentes au début du jeu ne sont pas concernées par cela. Les bâtiments accordés dans le cadre d'objectifs, de décisions et d'événements nationaux peuvent dépasser le niveau sélectionné."
 RULE_GROUP_RESEARCH: "Recherche"
 RULE_RESEARCH_AOT: "Rechercher à l'avance"
 RULE_RESEARCH_AOT_FREE_DESC: "Les pays peuvent rechercher des technologies à l'avance sans aucune restriction."
 RULE_RESEARCH_AOT_THREE_YEARS_DESC: "Les pays ne peuvent rechercher des technologies que trois ans à l'avance."
 RULE_RESEARCH_AOT_TWO_YEARS_DESC: "Les pays ne peuvent rechercher des technologies que deux ans à l'avance."
 RULE_RESEARCH_AOT_ONE_YEARS_DESC: "Les pays ne peuvent rechercher des technologies qu'un an à l'avance."
 RULE_RESEARCH_AOT_BLOCKED_DESC: "Les pays ne peuvent pas rechercher de technologies à l'avance."
