 #PAK game rules
 PAK_RAWALPINDI_CONSPIRACY_AI: "@PAK [1950s] Conspiration de Rawalpindi"
 RULE_OPTION_PAK_RAWALPINDI_THWARTED: "Un complot déjoué"
 RULE_OPTION_PAK_RAWALPINDI_THWARTED_DESC: "La conspiration de Rawalpindi sera déjouée et ses conspirateurs arrêtés. Le gouvernement civil actuel survivra pour le moment. \n§YC'est la voie historique.§!"
 RULE_OPTION_PAK_RAWALPINDI_SUCCESS: "Révolution de Rawalpindi"
 RULE_OPTION_PAK_RAWALPINDI_SUCCESS_DESC: "La conspiration de Rawalpindi sera ignorée, ce qui conduira à un coup d'État de gauche et à l'installation d'un gouvernement §Rmarxiste-léniniste§!."
 PAK_1955_ELECTIONS: "@PAK Élections de 1955"
 PAK_1955_ELECTIONS_DESC: "§YNécessite :§! §CLa conspiration de Rawalpindi a échoué§!\nAvec la récente conspiration de Rawalpindi ; une nouvelle constitution est nécessaire pour le Pakistan ; et les élections détermineront à la fois la nouvelle constitution et le gouvernement."
 PAK_TRIPLE_ALLIANCE: "Victoire de la Triple Alliance"
 PAK_TRIPLE_ALLIANCE_DESC: "La Triple Alliance remportera les élections."
 PAK_UNITED_FRONT: "Victoire du Front Uni"
 PAK_UNITED_FRONT_DESC: "Le Front Uni remportera les élections."
 PAK_JAMAAT_ISLAMI: "Victoire du Jamaat-i Islami"
 PAK_JAMAAT_ISLAMI_DESC: "Jamaat-i Islami remportera les élections."
 PAK_SHAHABUDDIN_COMMISSION_AI: "@PAK [1960s] Rapport de la Commission Shahabuddin"
 RULE_OPTION_PAK_SHAHABUDDIN_REVISED: "Rapport révisé accepté"
 RULE_OPTION_PAK_SHAHABUDDIN_REVISED_DESC: "Le rapport de la Commission Shahabuddin sera révisé pour renforcer le président et maintenir l'interdiction des partis politiques.\n\n§CAyub Khan a dû prendre le contrôle du gouvernement !§!"
 RULE_OPTION_PAK_SHAHABUDDIN_ACCEPTED: "Rapport entièrement accepté"
 RULE_OPTION_PAK_SHAHABUDDIN_ACCEPTED_DESC: "Le rapport de la Commission Shahabuddin sera accepté sans révision. Cela accélérera le retour à la démocratie et renforcera les institutions démocratiques.\n\n§CAyub Khan a dû prendre le contrôle du gouvernement !§!"
 PAK_RAJ_KASHMIR_UNREST_AI: "@PAK @KAS @RAJ Troubles au Cachemire de 1965"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_WAR: "@PAK @RAJ Deuxième guerre du Cachemire"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_WAR_DESC: "Les troubles au Cachemire, à commencer par le vol d'une relique religieuse, sont utilisés comme une opportunité pour l'Inde et le Pakistan d'affirmer leur position dans la région. Finalement, des escarmouches mineures se transforment en une guerre à grande échelle dans le sous-continent."
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_REFERENDUM: "@PAK @UNS @RAJ Plébiscite supervisé par l'ONU"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_REFERENDUM_DESC: "Les troubles au Cachemire, commençant par le vol d'une relique religieuse, incitent l'Inde et le Pakistan à s'adresser aux Nations Unies pour demander un plébiscite au Cachemire afin de trancher enfin la question."
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_COMMUNAL_PARTITION: "@PAK @RAJ Partition communautaire du Cachemire"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_COMMUNAL_PARTITION_DESC: "Les troubles au Cachemire, commençant par le vol d'une relique religieuse, incitent l'Inde et le Pakistan à diviser le Cachemire pour des raisons religieuses, Srinagar étant cédée au Pakistan."
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_FORMALISE_STATUS_QUO: "@PAK @RAJ Le statu quo rendu permanent"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_FORMALISE_STATUS_QUO_DESC: "Les troubles au Cachemire, commençant par le vol d'une relique religieuse, poussent l'Inde et le Pakistan à officialiser enfin la division de facto du Cachemire et à transformer la ligne de cessez-le-feu en frontière permanente."
 PAK_HISTORICAL_1965_ELECTION_AI: "@PAK Élections de 1965 (historiques)"
 PAK_HISTORICAL_1965_ELECTION_AI_DESC: "§YNécessite :§! §CLa Commission Shahabuddin est acceptée avec des révisions§!\n"
 RULE_OPTION_PAK_HISTORICAL_1965_AYUB_KHAN: "Ayub Khan"
 RULE_OPTION_PAK_HISTORICAL_1965_AYUB_KHAN_DESC: "Avec la révision du rapport de la Commission Shahabuddin, §LAyub Khan§! parvient à remporter une victoire facile lors des élections truquées de 1965."
 RULE_OPTION_PAK_HISTORICAL_1965_FATIMA_JINNAH: "Fatima Jinnah"
 RULE_OPTION_PAK_HISTORICAL_1965_FATIMA_JINNAH_DESC: "Malgré les révisions du rapport de la Commission Shahabuddin, §CFatima Jinnah et l'opposition combinée§! parviennent à remporter la victoire aux élections de 1965 et cherchent à renforcer la démocratie au Pakistan."
 PAK_DEMOCRATIC_1965_ELECTION_AI: "@PAK Élections de 1965 (démocratiques)"
 PAK_DEMOCRATIC_1965_ELECTION_AI_DESC: "§YRequiert :§! §CLa Commission Shahabuddin est entièrement acceptée§! OU §CFatima Jinnah est élue aux élections de 1965§!\n"
 RULE_OPTION_PAK_DEMOCRATIC_1965_AYUB_KHAN: "Ayub Khan"
 RULE_OPTION_PAK_DEMOCRATIC_1965_AYUB_KHAN_DESC: "Après que le rapport de la Commission Shahabuddin ait été pleinement accepté, §LAyub Khan et la coalition centriste§! parviennent à remporter la victoire aux élections de 1965."
 RULE_OPTION_PAK_DEMOCRATIC_1965_SHEIKH_MUJIB: "Cheikh Mujibur Rahman"
 RULE_OPTION_PAK_DEMOCRATIC_1965_SHEIKH_MUJIB_DESC: "Après que le rapport de la Commission Shahabuddin ait été pleinement accepté, §RCheikh Mujibur Rahman et les gauchistes§! parviennent à remporter la victoire aux élections de 1965."
 PAK_1970_ELECTION_AI: "@PAK Élections démocratiques de 1970"
 RULE_OPTION_PAK_1970_BHUTTO: "Zulfikar Ali Bhutto"
 RULE_OPTION_PAK_1970_BHUTTO_DESC: "Avec le départ d'Ayub Khan de la politique, le §OZulfikar Ali Bhutto et le centre-gauche§! reprennent son flambeau et parviennent à remporter la victoire aux élections de 1970.\n\n§CIl faut que le rapport de la Commission Shahabuddin soit pleinement accepté ou que Fatima Jinnah remporte les élections historiques de 1965 !§!"
 RULE_OPTION_PAK_1970_SHEIKH_MUJIB: "Cheikh Mujibur Rahman"
 RULE_OPTION_PAK_1970_SHEIKH_MUJIB_DESC: "La démocratie étant apparemment une question réglée, §RCheikh Mujibur Rahman et les gauchistes§! parviennent à remporter la victoire aux élections de 1970. Néanmoins, §LMuhammad Zia-ul-Haq§! tente de lancer un coup d'État mais les soldats loyalistes et la popularité nationale de Rahman l'en empêchent.\n\n§CIl faut que le rapport de la Commission Shahabuddin soit pleinement accepté ou que Fatima Jinnah remporte les élections historiques de 1965 !§!"
 RULE_OPTION_PAK_1970_ZIA_COUP: "Le coup d'État de Muhammad Zia-ul-Haq"
 RULE_OPTION_PAK_1970_ZIA_COUP_DESC: "Après la victoire §RCheikh Mujibur Rahman§! aux élections de 1970, §LMuhammad Zia-ul-Haq§! lance un coup d'État où la popularité uniquement pakistanaise orientale de Rahman permet à l'armée de se déplacer librement à l'Ouest et de renverser avec succès le gouvernement.\n\n§CIl faut que le rapport de la Commission Shahabuddin soit pleinement accepté ou que Fatima Jinnah remporte les élections historiques de 1965 !§!"
 PAK_1975_ELECTION_AI: "@PAK Élections démocratiques de 1975"
 RULE_OPTION_PAK_1975_BHUTTO: "Zulfikar Ali Bhutto"
 RULE_OPTION_PAK_1975_BHUTTO_DESC: "Après une décennie entière de démocratie, le §OZulfikar Ali Bhutto et le centre-gauche§! parviennent à remporter la victoire aux élections de 1975.\n\n§CIl faut un Pakistan uni et sa démocratie pour survivre aux conséquences des élections démocratiques de 1970 !§!"
 RULE_OPTION_PAK_1975_SHEIKH_MUJIB: "Cheikh Mujibur Rahman"
 RULE_OPTION_PAK_1975_SHEIKH_MUJIB_DESC: "Après une décennie complète de démocratie, §RCheikh Mujibur Rahman et les gauchistes§! parviennent à remporter la victoire aux élections de 1975.\n\n§CIl faut un Pakistan uni et sa démocratie pour survivre aux conséquences des élections démocratiques de 1970 !§!"
 RULE_OPTION_PAK_1975_ELAHI: "Chaudhry Zahoor Elahi"
 RULE_OPTION_PAK_1975_ELAHI_DESC: "Après une décennie complète de démocratie, §GChaudhry Zahoor Elahi et la droite religieuse§! parviennent à remporter la victoire aux élections de 1975.\n\n§CIl faut un Pakistan uni et sa démocratie pour survivre aux conséquences des élections démocratiques de 1970 !§!"
 
 #FRA game rules
 FRA_50S_ELECTIONS: "@FRA Élections de 1951"
 RULE_OPTION_FRA_50S_HISTORICAL: "@FRA Victoire de la Troisième Force"
 RULE_OPTION_FRA_50S_ELECTIONS_HISTORICAL_DESC: "La Troisième Force remportera les élections de 1951 et poursuivra le mandat socialiste démocratique.\n§YC'est la voie historique.§!"
 RULE_OPTION_FRA_COMMUNIST_PEACE: "£GFX_game_rule_flags_FRA_communism Victoire du PCF"
 RULE_OPTION_FRA_COMMUNIST_PEACE_DESC: "Le Parti communiste remportera les élections de 1951, formera la Ve République et alignera la France sur le bloc de l'Est."
 RULE_OPTION_FRA_COMMUNIST_WAR: "@FRA @ALE Victoire du PCF (intervention de l'OTAN)"
 RULE_OPTION_FRA_COMMUNIST_WAR_DESC: "Le Parti communiste remportera les élections de 1951. Ne voulant pas qu'un allié clé change de camp et franchisse le rideau de fer, les États-Unis mobiliseront l'OTAN et déclareront la guerre à la France."
 FRA_1953_ELECTIONS: "@FRA Élections de 1953"
 RULE_OPTION_FRA_SFIO_1953: "Victoire SFIO"
 RULE_OPTION_FRA_SFIO_1953_DESC: "La SFIO remportera les élections de 1953. Ils adopteront une position pro-syndicale. \nCela enverra Jacques Soustelle en Algérie."
 RULE_OPTION_FRA_RADICALS_1953: "Victoire des radicaux"
 RULE_OPTION_FRA_RADICALS_1953_DESC: "Les radicaux remporteront les élections de 1953. Ils adopteront une position de compromis entre syndicats et employeurs. \nCela permettra un cessez-le-feu en Algérie."
 RULE_OPTION_FRA_CNIP_1953: "Victoire du CNIP"
 RULE_OPTION_FRA_CNIP_1953_DESC: "Le CNIP remportera les élections. Ils adopteront une position pro-employeur. \nCela enverra Robert Lacoste en Algérie.\n§YC'est la voie historique.§!"
 FRA_1958_CRISIS: "@FRA Crise de 1958"
 RULE_OPTION_FRA_GAULLE_RETURNS: "Le retour de De Gaulle"
 RULE_OPTION_FRA_GAULLE_RETURNS_DESC: "Charles de Gaulle interviendra dans la crise actuelle ; lui permettant de prendre le pouvoir et d'établir la Cinquième République française.\n§YC'est la voie historique.§!"
 RULE_OPTION_FRA_ALGERIAN_COMPROMISE: "Le compromis algérien"
 RULE_OPTION_FRA_ALGERIAN_COMPROMISE_DESC: "Charles de Gaulle ne prendra pas la tête du gouvernement. Cela obligera la France à rechercher un compromis avec l'Algérie, pour finalement en sortir."
 
 #KRD game rules
 KRD_DROUGHT_OUTCOME: "£GFX_game_rule_flags_KRD  [1950s] La grande sécheresse"
 KRD_DROUGHT_OUTCOME_DESC: "§YNécessite :§! §CL'Union soviétique a mené une politique étrangère agressive dans les années 1950.§!"
 RULE_OPTION_KRD_JOIN_TURKEY: "£GFX_game_rule_flags_SRT Intégration turque"
 RULE_OPTION_KRD_JOIN_TURKEY_DESC: "Après avoir reçu les conseils de Sefik Hüsnü, le gouvernement kurde décidera de rejoindre la Turquie en tant qu'État autonome afin de recevoir toute l'aide turque et de sauver le peuple kurde."
 RULE_OPTION_KRD_JOIN_SOVIET: "@SOV Ascension soviétique"
 RULE_OPTION_KRD_JOIN_SOVIET_DESC: "Après avoir reçu les conseils de Sefik Hüsnü, le gouvernement kurde décidera de devenir une RSS à part entière et de rejoindre l'Union soviétique pour lutter contre la sécheresse avec l'aide des autres républiques soviétiques."
 RULE_OPTION_KRD_INDEPENDENT_RURAL: "@KUR Retour aux sources"
 RULE_OPTION_KRD_INDEPENDENT_RURAL_DESC: "Le gouvernement kurde ignorera les conseils de Hüsnü et s'accrochera au rêve national. Par la suite, ils abandonneront le modèle d'industrialisation soviétique et retourneront à une économie féodale agraire tout en restant fidèles à Moscou."
 RULE_OPTION_KRD_INDEPENDENT_INDUSTRIAL: "£GFX_game_rule_flags_KRD Doubler la mise"
 RULE_OPTION_KRD_INDEPENDENT_INDUSTRIAL_DESC: "Le gouvernement kurde ignorera les conseils de Hüsnü et s'accrochera au rêve national. Par la suite, ils poursuivront leur industrialisation rapide et seront confrontés à une seconde sécheresse, et trouver une solution deviendra une question de survie."
 
 #TRS game rules
 TRS_UNIFICATION: "@TRS [1954] Unification de Trieste"
 RULE_OPTION_TRS_HISTORICAL: "@TRS Mémorandum de Londres"
 RULE_OPTION_TRS_HISTORICAL_DESC: "L'Italie et la Yougoslavie parviendront à un accord concernant Trieste et partageront le territoire, la zone A revenant à l'Italie et la zone B à la Yougoslavie.\n§YC'est la voie historique.§!"
 RULE_OPTION_TRS_ITALY: "@ITA Trieste italienne"
 RULE_OPTION_TRS_ITALY_DESC: "Non contente de sa moitié, l'Italie fera pression pour l'annexion totale du territoire. Craignant une intervention italienne du Royaume-Uni et des États-Unis, la Yougoslavie reculera."
 RULE_OPTION_TRS_YUGO: "@YUG Trieste yougoslave"
 RULE_OPTION_TRS_YUGO_DESC: "La Yougoslavie obligera l'Italie à abandonner le contrôle total de Trieste. Pour protéger la paix dans l'Adriatique, l'Italie cédera et Trieste tombera entre les mains de la Yougoslavie."
 RULE_OPTION_TRS_WAR: "@ITA @YUG Guerre pour Trieste"
 RULE_OPTION_TRS_WAR_DESC: "Les pourparlers d'unification échoueront et l'Europe sera témoin d'une nouvelle guerre dans l'Adriatique."
 
 #ITA game rules
 ITA_53_ELECTIONS: "@ITA Élections générales italiennes de 1953"
 RULE_OPTION_ITA_53_ELECTIONS_HISTORICAL: "@ITA Victoire de la Coalition du Centre - Pella démissionne"
 RULE_OPTION_ITA_53_ELECTIONS_HISTORICAL_DESC: "Une large coalition de démocrates-chrétiens et de libéraux dirigée par Giuseppe Pella revendiquera la victoire aux élections de 1953 et renforcera progressivement la droite italienne. Après résolution de l'Affaire de Trieste, Pella démissionnera et sera remplacé par Mario Scelba. \n§YC'est la voie historique.§!"
 RULE_OPTION_ITA_53_CENTER_RIGHT: "@ITA Victoire de la Coalition du Centre - Coalition de Centre-Droit"
 RULE_OPTION_ITA_53_CENTER_RIGHT_DESC: "Une large coalition de démocrates-chrétiens et de libéraux dirigée par Giuseppe Pella revendiquera la victoire aux élections de 1953 et renforcera progressivement la droite italienne. Après la résolution de l'affaire de Trieste, Pella restera en fonction et adoptera une position plus à droite."
 RULE_OPTION_ITA_53_POPULAR_FRONT: "£GFX_game_rule_flags_ITA_communism Victoire démocratique populaire"
 RULE_OPTION_ITA_53_POPULAR_FRONT_DESC: "Le Front Démocratique Populaire, la coalition communiste-socialiste, remportera les élections de 1953. Après avoir perdu de peu les élections précédentes en raison de l'influence de la CIA, le nouveau gouvernement de gauche sortira le pays de l'OTAN et maintiendra une politique équilibrée entre l'Est et l'Ouest."
 ITA_58_ELECTIONS: "@ITA Élections générales italiennes de 1958"
 RULE_OPTION_ITA_58_ELECTIONS_SOCIALIST: "Victoire socialiste"
 RULE_OPTION_ITA_58_ELECTIONS_SOCIALIST_DESC: "Le PSI socialiste remportera les élections de 1958. Durant ce mandat, ils suivront une voie diplomatique plus orientale, avec une position plus neutre."
 RULE_OPTION_ITA_58_ELECTIONS_FANFANI: "Fanfani devient Premier ministre"
 RULE_OPTION_ITA_58_ELECTIONS_FANFANI_DESC: "DC gagnera les élections. Durant ce mandat, ils suivront une voie plus centriste, équilibrant les intérêts de la droite et de la gauche.\n§YC'est la voie historique.§!"
 RULE_OPTION_ITA_58_ELECTION_RIGHT_WING: "Victoire de la droite"
 RULE_OPTION_ITA_58_ELECTION_RIGHT_WING_DESC: "Le MSI remportera les élections. Durant ce mandat, ils suivront une voie anti-gauchiste avec euroscepticisme, tout en gardant un alignement pro-occidental."
 
 #EGY game rules
 EGY_EGYPTIAN_REVOLUTION: "@EGY £GFX_game_rule_flags_EGY_freeofficers   [1950s] Révolution égyptienne"
 EGY_EGYPTIAN_REVOLUTION_DESC: ""
 RULE_OPTION_EGY_MONARCHY_OVERTHROWN: "£GFX_game_rule_flags_EGY_freeofficers Monarchie renversée"
 RULE_OPTION_EGY_MONARCHY_OVERTHROWN_DESC: "Les officiers libres organiseront avec succès un coup d'État et prendront le contrôle du pays. La monarchie égyptienne sera abolie.\n§YC'est la voie historique.§!"
 RULE_OPTION_EGY_REVOLUTION_CRASHED: "@EGY Révolution écrasée"
 RULE_OPTION_EGY_REVOLUTION_CRASHED_DESC: "La monarchie tiendra bon et les officiers libres seront arrêtés. La monarchie perdurera sous l'absolutisme."
 EGY_FUTURE_OF_MONARCHY: "@EGY [1950s] L'avenir de la monarchie"
 EGY_FUTURE_OF_MONARCHY_DESC: "§YNécessite :§! §CLe coup d'État des officiers libres a échoué.§!"
 RULE_OPTION_EGY_MODERN_PHARAOH: "Pharaon moderne"
 RULE_OPTION_EGY_MODERN_PHARAOH_DESC: "Le roi Farouk consolidera son régime absolutiste, avec seulement des réformes mineures."
 RULE_OPTION_EGY_KING_REPLACED: "Farouk déposé"
 RULE_OPTION_EGY_KING_REPLACED_DESC: "Le roi Farouk sera destitué au profit d'un nouveau monarque. L'absolutisme sera renversé à mesure que les institutions démocratiques seront restaurées."
 EGY_REVOLUTION_AFTERMATH: "£GFX_game_rule_flags_EGY_freeofficers  [1950s] Conflit au sein du RCC"
 EGY_REVOLUTION_AFTERMATH_DESC: "§YNécessite :§! §CLa monarchie égyptienne est renversée.§!"
 RULE_OPTION_EGY_NASSER: "£GFX_game_rule_flags_UAR Une révolution nationaliste"
 RULE_OPTION_EGY_NASSER_DESC: "Gamal Abdel Nasser évincera Naguib et deviendra président. Il oeuvrera à la formation de la République arabe unie nationaliste.\n§YC'est la voie historique.§!"
 RULE_OPTION_EGY_NAGUIB: "£GFX_game_rule_flags_EGY_democracy Une révolution démocratique"
 RULE_OPTION_EGY_NAGUIB_DESC: "Mohammed Naguib s'efforcera de reprendre le contrôle à Nasser, de lever l'interdiction des partis politiques et d'organiser des élections libres."
 RULE_OPTION_EGY_MOHIEDDIN: "£GFX_game_rule_flags_EGY_communism Une révolution communiste"
 RULE_OPTION_EGY_MOHIEDDIN_DESC: "Au milieu de la lutte pour le pouvoir de Nasser et Naguib, Kahlid Mohieddin et un groupe d'officiers de gauche vont renverser le gouvernement et établir une dictature marxiste."
 EGY_REPUBLIC_ELECTION: "£GFX_game_rule_flags_EGY_democracy  [1950s] Premières élections de la République"
 EGY_REPUBLIC_ELECTION_DESC: "§YNécessite :§! §CMohamed Naguib au pouvoir consolidé.§!"
 RULE_OPTION_EGY_NATIONALIST: "Victoire de Naguib"
 RULE_OPTION_EGY_NATIONALIST_DESC: "Mohamed Naguib remportera les élections et réformera lentement l'Égypte pour en faire une démocratie multipartite de style occidental tout en rétablissant ses relations avec d'autres démocraties."
 RULE_OPTION_EGY_DEMOCRATIC: "Victoire du Nouveau Wafd"
 RULE_OPTION_EGY_DEMOCRATIC_DESC: "Le parti réformé Wafd remportera les élections. Pour se débarrasser de leur ancienne réputation, ils adopteront une position anti-britannique et apporteront le libéralisme classique en Égypte."
 RULE_OPTION_EGY_ISLAMIC: "Victoire modérée d'Ikhwan"
 RULE_OPTION_EGY_ISLAMIC_DESC: "Hassan Al Hudaybi et la faction modérée d'Ikhwan remporteront les élections. Au lieu de purger radicalement l'Égypte de ses éléments irréligieux, le gouvernement adoptera des politiques combinant le régime islamique et les principes démocratiques."
 RULE_OPTION_EGY_SALAFIST: "Victoire radicale d'Ikhwan"
 RULE_OPTION_EGY_SALAFIST_DESC: "La faction radicale d'Ikhwan dirigée par Sayyid Qutb remportera les élections. Le nouvel État persécutera durement les minorités religieuses et se concentrera sur la destruction de la nation juive."
 EGY_FATE_OF_SUDAN: "@EGY @ENG [1950s] Le sort du Soudan"
 EGY_FATE_OF_SUDAN_DESC: "Alors que l'avenir de l'Égypte se sépare de plus en plus des Britanniques, l'avenir du Soudan anglo-égyptien est remis en question."
 RULE_OPTION_EGY_EGYPTIAN_SUDAN: "@EGY Soudan égyptien"
 RULE_OPTION_EGY_EGYPTIAN_SUDAN_DESC: "§YNécessite :§! §CLe roi Farouk est le pharaon moderne§!\nLe Soudan sera complètement annexé par l'Égypte."
 RULE_OPTION_EGY_DIVIDED_SUDAN: "@EGY @SSU Le Soudan divisé"
 RULE_OPTION_EGY_DIVIDED_SUDAN_DESC: "L'Égypte annexera la moitié nord du Soudan ; tandis que le sud obtiendra son indépendance."
 RULE_OPTION_EGY_INDEPENDENT_SUDAN: "£GFX_game_rule_flags_SUD_independence Indépendance soudanaise"
 RULE_OPTION_EGY_INDEPENDENT_SUDAN_DESC: "L'Egypte et la Grande-Bretagne s'accorderont sur l'indépendance du Soudan"
 
 #GRE game rules
 GRE_CIVIL_WAR: "@GRE @PDG [1950s] Guerre civile grecque"
 GRE_CIVIL_WAR_DESC: "Avec l'unité de la Résistance grecque, la guerre civile se poursuit. L'alignement politique de la Grèce est remis en question."
 RULE_OPTION_GRE_DEMOCRACY: "@GRE Victoire du gouvernement"
 RULE_OPTION_GRE_DEMOCRACY_DESC: "L'insurrection communiste sera écrasée ; et la monarchie constitutionnelle actuelle demeurera.\n§YC'est la voie historique.§!"
 RULE_OPTION_GRE_COMMUNISM: "@PDG Victoire communiste"
 RULE_OPTION_GRE_COMMUNISM_DESC: "L'ELAS prendra Athènes et établira un gouvernement communiste, s'alignant sur le bloc de l'Est."
 GRE_1950_ELECTIONS: "@GRE Élections de 1950"
 GRE_1950_ELECTIONS_DESC: "§YNécessite :§! §CLe gouvernement a gagné la guerre civile grecque§!"
 RULE_OPTION_GRE_VENIZELOS: "Sofiane Venizélos"
 RULE_OPTION_GRE_VENIZELOS_DESC: "Sofoklis Venizelos remportera les élections ; qui sera plus tard remplacé par Nikolaos Plastiras. Durant ce mandat, il tentera de maintenir intact le groupe vénizéliste."
 RULE_OPTION_GRE_TSALDARIS: "Konstantinos Tsaldaris"
 RULE_OPTION_GRE_TSALDARIS_DESC: "Konstantinos Tsaldaris remportera les élections. Durant ce mandat, il suivra une trajectoire conservatrice avec le soutien de la monarchie."
 GRE_1951_ELECTIONS: "@GRE Élections de 1951"
 RULE_OPTION_GRE_PLASTIRAS_1951: "Nikolaos Plastiras"
 RULE_OPTION_GRE_PLASTIRAS_1951_DESC: "Nikolaos Plastiras remportera les élections. Durant ce mandat, il tentera de se réconcilier avec les gauchistes."
 RULE_OPTION_GRE_PAPAGOS_1951: "Alexandre Papagos"
 RULE_OPTION_GRE_PAPAGOS_1951_DESC: "Alexandros Papagos remportera les élections. Durant ce mandat, il modifiera le système électoral contre les gauchistes."
 GRE_1952_ELECTIONS: "@GRE Élections de 1952"
 RULE_OPTION_GRE_PLASTIRAS_1952: "Nikolaos Plastiras"
 RULE_OPTION_GRE_PLASTIRAS_1952_DESC: "Nikolaos Plastiras remportera les élections. Durant ce mandat, il rétablira la loi 509, poursuivant les purges contre les communistes. Après sa mort, Sofoklis Venizelos lui succédera."
 RULE_OPTION_GRE_PAPAGOS_1952: "Alexandre Papagos"
 RULE_OPTION_GRE_PAPAGOS_1952_DESC: "Alexandros Papagos remportera les élections. Durant ce mandat, il abrogera la loi 509, permettant aux communistes de revenir sur la scène politique. Après sa mort, Konstantinos Karamanlis lui succédera."
 GRE_1956_ELECTIONS: "@GRE Élections de 1956"
 RULE_OPTION_GRE_KARAMANLIS_1956: "Konstantinos Karamanlis"
 RULE_OPTION_GRE_KARAMANLIS_1956_DESC: "Konstantinos Karamanlis remportera les élections. Durant ce mandat, il se concentrera sur l'obtention d'investissements étrangers."
 RULE_OPTION_GRE_PAPANDREOU_1956: "Georgeos Papandréou"
 RULE_OPTION_GRE_PAPANDREOU_1956_DESC: "Georgeos Papandreou remportera les élections. Durant ce mandat il abrogera la loi 511 ; mettre fin à l'exil interne des communistes."
 GRE_1958_ELECTIONS: "@GRE Élections de 1958"
 RULE_OPTION_GRE_KARAMANLIS_1958: "Konstantinos Karamanlis"
 RULE_OPTION_GRE_KARAMANLIS_1958_DESC: "Konstantinos Karamanlis remportera les élections. Durant ce mandat, il prendra des mesures contre les gauchistes tout en industrialisant la Grèce."
 RULE_OPTION_GRE_PAPANDREOU_1958: "Georgeos Papandréou"
 RULE_OPTION_GRE_PAPANDREOU_1958_DESC: "Georgeos Papandreou remportera les élections. Durant ce mandat, il promulguera son « Plan économique national »."
 GRE_JOIN_NATO_AI: "@GRE £GFX_game_rule_flags_NATO Adhésion de la Grèce à l'OTAN"
 RULE_OPTION_GRE_JOIN_NATO_SUCCESS: "La Grèce devient membre de l'OTAN"
 RULE_OPTION_GRE_JOIN_NATO_SUCCESS_DESC: "Lorsqu'elle y sera invitée, la Grèce rejoindra l'Organisation du Traité de l'Atlantique Nord en tant que membre."
 RULE_OPTION_GRE_JOIN_NATO_FAILURE: "La Grèce reste en dehors de l'OTAN"
 RULE_OPTION_GRE_JOIN_NATO_FAILURE_DESC: "Lorsqu'elle sera invitée à l'Organisation du Traité de l'Atlantique Nord, la Grèce déclinera et restera en dehors de l'organisation, même si elle pourrait rester alignée sur l'Occident."
 
 #PDG game rules
 PDG_GREEK_CIVIL_WAR: "@PDG [1950s] Organisation de l'ELAS"
 PDG_GREEK_CIVIL_WAR_DESC: "Le Front de libération nationale a refusé de s'incliner devant un gouvernement réactionnaire ; et mener une guerre ouverte contre le gouvernement. La question actuelle est : comment l'ELAS devrait-elle s'organiser?"
 RULE_OPTION_HISTORICAL_PDG_AI: "Guerre conventionnelle"
 RULE_OPTION_HISTORICAL_PDG_AI_DESC: "L'Armée Démocratique Grecque poursuivra la guerre conventionnelle. \n§YC'est la voie historique.§!"
 RULE_OPTION_GUERILLA_PDG_AI: "Guérilla"
 RULE_OPTION_GUERILLA_PDG_AI_DESC: "L'Armée démocratique grecque s'inspirera des guerres de libération et mènera une guérilla."
 PDG_POST_STALIN_COURSE: "@PDG Le communisme post-stalinien en Grèce"
 PDG_POST_STALIN_COURSE_DESC: "Avec Staline est décédé ; le cours du leadership à un tournant."
 RULE_OPTION_PDG_ZACHARIDIS_STAYS: "Séjours à Zacharidis"
 RULE_OPTION_PDG_ZACHARIDIS_STAYS_DESC: "Nikos Zacharidis gardera le contrôle. Il s'opposera au révisionnisme tout en s'alignant sur le cap maoïste."
 RULE_OPTION_PDG_KOLIGIANNIS_TAKES_OVER: "Koligiannis prend le relais"
 RULE_OPTION_PDG_KOLIGIANNIS_TAKES_OVER_DESC: "Kostas Koligiannis prendra le contrôle de la Grèce. Il suivra la ligne révisionniste et maintiendra l'alignement soviétique."
 RULE_OPTION_PDG_VAFEIADIS_TAKES_OVER: "Vafeiadis prend le relais"
 RULE_OPTION_PDG_VAFEIADIS_TAKES_OVER_DESC: "Markos Vafeiadis assumera la Premiership grecque. Tout en maintenant l'alignement soviétique sur la Grèce, il suivra une voie plus libertaire."
 
 #BCP game rules
 BCP_FOREIGN_AI_BEHAVIOR: "@BCP [1950s] Alignement communiste birman"
 RULE_OPTION_CHINESE_ALIGNMENT_BCP_AI: "Alignement chinois"
 RULE_OPTION_CHINESE_ALIGNMENT_BCP_AI_DESC: "Les communistes birmans s'aligneront sur la Chine et le maoïsme. \n§YC'est la voie historique.§!"
 RULE_OPTION_SOVIET_ALIGNMENT_BCP_AI: "Alignement soviétique"
 RULE_OPTION_SOVIET_ALIGNMENT_BCP_AI_DESC: "Les communistes birmans s'aligneront sur l'Union soviétique."
 BCP_INTERNAL_AI_BEHAVIOR: "@BCP [1950s] Affaires intérieures de l'APL birmane"
 RULE_OPTION_POLITICAL_FORCE: "Coopérer avec le NUF"
 RULE_OPTION_POLITICAL_FORCE_DESC: "Le Parti communiste birman se concentrera désormais sur les élections législatives, en s'éloignant de l'insurrection."
 RULE_OPTION_LIBERATION_WAR_BCP_AI: "Guerre de libération"
 RULE_OPTION_LIBERATION_WAR_BCP_AI_DESC: "Le Parti communiste birman donnera la priorité à son insurrection et l'intensifiera. \n§YC'est la voie historique.§!"
 
 #PER game rules
 PER_ELECTIONS_52: "@PER Élections iraniennes de 1952"
 RULE_OPTION_HISTORICAL_MOSADDEGH_52: "Victoire du Front National"
 RULE_OPTION_HISTORICAL_MOSADDEGH_52_DESC: "Mohammad Mosaddegh protégera sa position et poursuivra sa politique nationaliste et d'indépendance nationale. \n§YC'est la voie historique.§!"
 RULE_OPTION_PER_ROYALIST_52: "Victoire royaliste"
 RULE_OPTION_HISTORICAL_PER_ROYALIST_52_DESC: "Le religieux royaliste Hassan Emami remportera les élections. En tant qu'anglophile reconnu, il s'efforcera d'améliorer les relations avec l'Occident tout en essayant de réduire l'agitation générale."
 PER_AJAX: "@PER Opération AJAX"
 PER_AJAX_DESC: "§YNécessite :§! §CFront national remporté aux élections de 1952§!\nAvec Mosaddegh nationalisant les compagnies pétrolières ; les puissances occidentales ont trouvé cela hostile ; et ont ainsi demandé au Shah de renverser son propre Premier ministre."
 RULE_OPTION_HISTORICAL_PER_AJAX: "Le Shah est d'accord"
 RULE_OPTION_HISTORICAL_PER_AJAX_DESC: "Le Shah acceptera de soutenir le coup d'État anglo-américain contre Mosaddegh. \n§YC'est la voie historique.§!"
 RULE_OPTION_SHAH_REFUSE: "Le Shah refuse"
 RULE_OPTION_HISTORICAL_SHAH_REFUSE_DESC: "Le Shah se rangera du côté de Mosaddegh et refusera de soutenir le coup d'État. Dans les semaines à venir, des milliers de religieux et d'extrémistes chiites se soulèveront contre le gouvernement laïc, renverseront la dynastie Pahlavi et rétabliront le régime Qadjari en tant que monarchie islamiste."
 PER_RIOTS: "@PER Émeutes à Téhéran"
 PER_RIOTS_AI_DESC: "§YNécessite :§! §CL'opération Ajax a commencé.§!"
 RULE_OPTION_HISTORICAL_PER_RIOTS: "La monarchie tient"
 RULE_OPTION_HISTORICAL_PER_RIOTS_DESC: "Avec le succès du coup d'État, le régime monarchique sera renforcé et le Shah reviendra au pouvoir.\n§YC'est la voie historique.§!"
 RULE_OPTION_RIOTS_REPUBLIC: "Le coup d'État et les émeutes écrasés"
 RULE_OPTION_RIOTS_REPUBLIC_DESC: "Trahi par la monarchie, Mosaddegh refusera de céder et fera échouer le coup d'État par tous les moyens. Plus tard, il transformera l'Iran en république et purgera les éléments extrémistes de la société."
 RULE_OPTION_RIOTS_TUDEH: "Prise de contrôle de Tudeh"
 RULE_OPTION_RIOTS_TUDEH_DESC: "Alors que les émeutes commencent à s'intensifier, le parti Toudeh, avec le soutien des Soviétiques et des minorités, abolira la monarchie et créera un État communiste à parti unique."
 PER_COMMUNISM_SPLIT: "£GFX_game_rule_flags_PER_communism L'avenir de la révolution iranienne"
 PER_COMMUNISM_SPLIT_DESC: "§YNécessite :§! §CPrise de contrôle de Tudeh lors des émeutes de Téhéran§!\n"
 RULE_OPTION_PER_SOVIET: "@SOV Alignement soviétique"
 RULE_OPTION_PER_SOVIET_DESC: "Le nouveau gouvernement iranien se rangera du côté de l'Union soviétique et du bloc de l'Est, en échangeant leurs territoires du nord contre une aide accrue du COMECON."
 RULE_OPTION_PER_YUGOSLAVIA: "@YUG Mouvement des non-alignés"
 RULE_OPTION_PER_YUGOSLAVIA_DESC: "Se méfiant des politiques expansionnistes de l'Union soviétique à l'égard de l'Azerbaïdjan, l'Iran décidera plutôt de rejoindre le Mouvement des non-alignés et de rechercher la neutralité armée."
 PER_GHARANI_COUP: "@PER [1950s] Coup d'État de Gharani"
 PER_GHARANI_COUP_DESC: "§YNécessite :§! §CLa monarchie a tenu bon lors des émeutes de Téhéran§!.\n"
 RULE_OPTION_PER_GHARANI_COUP_FAIL: "Le coup d'État a échoué"
 RULE_OPTION_PER_GHARANI_COUP_FAIL_DESC: "Gharani échouera dans sa tentative et sera emprisonné. Mossadegh sera exécuté dans la foulée. \n§YC'est la voie historique.§!"
 RULE_OPTION_PER_GHARANI_COUP_SUCCEED: "Coup d'État réussi"
 RULE_OPTION_PER_GHARANI_COUP_SUCCEED_DESC: "Gharani réussira à renverser le gouvernement. Tandis que la monarchie est préservée ; Mosaddegh sera libéré et des élections auront lieu."
 PER_GHARANI_COUP_AFTERMATH: "@PER [1950s] Le pari soviétique"
 PER_GHARANI_COUP_AFTERMATH_DESC: "§YRequiert :§! §CLe coup d'État de Gharani a échoué§!.\nShah envisage de signer un pacte de non-agression avec l'Union soviétique ; à laquelle les États-Unis s'opposent."
 RULE_OPTION_PER_ALIGN_AMERICA: "@PER @USA Aligner l'Amérique"
 RULE_OPTION_PER_ALIGN_AMERICA_DESC: "Shah subira des pressions pour rejoindre la sphère américaine et reconnaîtra par la suite Israël. \n§YC'est la voie historique.§!"
 RULE_OPTION_PER_IRANIAN_CIVIL_WAR: "@PER £GFX_game_rule_flags_PER_communism   £GFX_game_rule_flags_KRD Guerre civile iranienne"
 RULE_OPTION_PER_IRANIAN_CIVIL_WAR_DESC: "Shah Reza Pahlavi sera assassiné. Malgré le couronnement d'un nouveau Shah, Gholamreza Pahlavi ; Les Kurdes et les communistes déclencheront une guerre civile."
 RULE_OPTION_PER_TUDEH_RETURNS: "£GFX_game_rule_flags_PER_communism Tudeh revient"
 RULE_OPTION_PER_TUDEH_RETURNS_DESC: "Shah Reza Pahlavi sera assassiné. Le chaos sera exploité par les communistes, qui s'empareront rapidement du gouvernement."
 PER_1954_ELECTIONS: "@PER Élections de 1954"
 PER_1954_ELECTIONS_DESC: "§YNécessite :§! §CMosaddegh a déclaré la république.§!\n"
 RULE_OPTION_PER_MOSADDEGH_1954: "Victoire du Front National"
 RULE_OPTION_PER_MOSADDEGH_1954_DESC: "Le Front National remportera les élections. Durant ce mandat, ils aligneront l'Iran sur l'Amérique."
 RULE_OPTION_PER_TOILERS_PARTY_1954: "Victoire du Parti des Travailleurs"
 RULE_OPTION_PER_TOILERS_PARTY_1954_DESC: "Le Parti des Travailleurs remportera les élections. Durant ce mandat, ils s'aligneront sur la Yougoslavie."
 RULE_OPTION_PER_MOJAHEDS_1954: "Victoire des Moudjahiddines"
 RULE_OPTION_PER_MOJAHEDS_1954_DESC: "La Société des Moudjahidines musulmans remportera les élections. Durant ce mandat, ils appliqueront la charia."
 PER_1958_ELECTIONS: "@PER Élections de 1958"
 PER_1958_ELECTIONS_DESC: "§YNécessite :§! §CMosaddegh a déclaré la république§! OU §CLe coup d'État de Gharani a réussi§!.\n"
 RULE_OPTION_PER_MOSADDEGH_1958: "Victoire du Front National"
 RULE_OPTION_PER_MOSADDEGH_1958_DESC: "Le Front National remportera les élections."
 RULE_OPTION_PER_TOILERS_PARTY_1958: "Victoire du Parti des Travailleurs"
 RULE_OPTION_PER_TOILERS_PARTY_1958_DESC: "Le Parti des Travailleurs remportera les élections."
 RULE_OPTION_PER_MOJAHEDS_1958: "Victoire des Moudjahiddines"
 RULE_OPTION_PER_MOJAHEDS_1958_DESC: "La Société des Moudjahidines musulmans remportera les élections. Durant ce mandat, ils aboliront la monarchie au profit de la République islamique."
 
 #YAN game rules
 YAN_FAILURE_OUTCOME: "@YAN [1950s] Catastrophe au Yunnan"
 YAN_FAILURE_OUTCOME_DESC: "§YNécessite :§! §C§RLes communistes§! ont gagné la guerre civile chinoise§! ET §CL'assaut sur le Yunnan a échoué§!\n"
 RULE_OPTION_HISTORICAL_YAN_FAILURE: "@YAN Gardez le cap"
 RULE_OPTION_HISTORICAL_YAN_FAILURE_DESC: "Après avoir échoué à percer le Yunnan, Liu Yuanlin prendra le commandement de l'armée. Le rêve de libérer la Chine est vivant !\n§YC'est la voie historique.§!"
 RULE_OPTION_YAN_SHAN_STATE: "£GFX_game_rule_flags_YAN_Shan L'État Shan"
 RULE_OPTION_YAN_SHAN_STATE_DESC: "Après avoir échoué à percer le Yunnan, le général Li Mi quittera Taiwan et se concentrera sur l'établissement d'un État Shan-chinois sous la direction du Kuomintang."
 
 #TUR game rules
 TUR_KURDISH_QUESTION: "@TUR £GFX_game_rule_flags_KRD   [1950s] Question kurde en Turquie"
 RULE_OPTION_MOUNTAIN_TURKS: "Turcs des montagnes"
 RULE_OPTION_MOUNTAIN_TURKS_DESC: "Le gouvernement turc ne tolérera pas une identité kurde distincte et la supprimera.\n§YC'est la voie historique.§!"
 RULE_OPTION_KURDISH_TOLERATION: "Tolérance kurde"
 RULE_OPTION_KURDISH_TOLERATION_DESC: "Le gouvernement turc tendra la main aux dirigeants locaux et tolérera l'identité kurde."
 TUR_1950_ELECTIONS: "@TUR Élections générales de 1950"
 RULE_OPTION_CHP_1950: "Victoire du PCC"
 RULE_OPTION_CHP_1950_DESC: "Ismet Inönü et son CHP conserveront la direction. Durant ce mandat, ils affirmeront le kémalisme et se concentreront sur le développement industriel."
 RULE_OPTION_DP_1950: "Victoire DP"
 RULE_OPTION_DP_1950_DESC: "Adnan Menderes et son DP seront élus. Au cours de ce mandat, ils commenceront à revenir sur les anciennes politiques de cogénération et à se concentrer sur le développement rural. \n§YC'est la voie historique.§!"
 TUR_1954_ELECTIONS: "@TUR Élections générales de 1954"
 RULE_OPTION_CHP_1954: "Victoire du PCC"
 RULE_OPTION_CHP_1954_DESC: "Ismet Inönü et son CHP seront élus. Durant ce mandat, ils travailleront sur le développement industriel."
 RULE_OPTION_DP_1954: "Victoire DP"
 RULE_OPTION_DP_1954_DESC: "Adnan Menderes et son DP seront élus. Durant ce mandat, ils se plongeront dans l'autocratie. \n§YC'est la voie historique.§!"
 TUR_1957_ELECTIONS: "@TUR Élections générales de 1957"
 RULE_OPTION_CHP_1957: "Victoire du PCC"
 RULE_OPTION_CHP_1957_DESC: "Ismet Inönü et son CHP seront élus. Durant ce mandat, ils se concentreront sur les questions sociales et économiques."
 RULE_OPTION_DP_1957: "Victoire DP"
 RULE_OPTION_DP_1957_DESC: "Adnan Menderes et son DP seront élus. Durant ce mandat, ils se plongeront dans l'autocratie. \n§YC'est la voie historique.§!"
 TUR_ISRAELI_RELATIONS: "@TUR @ISR [1950s] Relations avec Israël"
 TUR_ISRAELI_RELATIONS_DESC: "La Turquie est le premier pays à majorité musulmane à reconnaître Israël. Toutefois, les relations avec Israël seront un problème pour les autres pays arabes, tout comme l'inverse."
 RULE_OPTION_ESTABLISH_LEGATION: "Établir une légation"
 RULE_OPTION_ESTABLISH_LEGATION_DESC: "La Turquie maintiendra et développera ses relations avec Israël, tout en maintenant des liens cordiaux avec les pays arabes.\n§YC'est la voie historique.§!"
 RULE_OPTION_RESCIND_RECOGNITION: "Annuler la reconnaissance"
 RULE_OPTION_RESCIND_RECOGNITION_DESC: "La Turquie coupera brutalement ses liens avec Israël ; se retourner contre Israël tout en renforçant les relations avec les pays arabes."
 TUR_UAR_RELATIONS: "@TUR £GFX_game_rule_flags_UAR   [1950s] Réaction turque à la RAU"
 TUR_UAR_RELATIONS_DESC: "§YNécessite :§! §CLa République Arabe Unie est formée.§!"
 RULE_OPTION_RECOGNIZE_UAR: "Reconnaître l'UAR"
 RULE_OPTION_RECOGNIZE_UAR_DESC: "La Turquie reconnaîtra la RAU, désamorçant ainsi toute éventuelle tension"
 RULE_OPTION_CLASH_UAR: "Appliquer le changement de régime"
 RULE_OPTION_CLASH_UAR_DESC: "La Turquie fera pression pour un changement de régime en Syrie."
 RULE_OPTION_ANNEX_NORTH_SYRIA: "Annexe Nord Syrie"
 RULE_OPTION_ANNEX_NORTH_SYRIA_DESC: "La Turquie envahira et annexera unilatéralement les parties nord de la Syrie."
 TUR_JOIN_NATO_AI: "@TUR £GFX_game_rule_flags_NATO Adhésion de la Turquie à l'OTAN"
 RULE_OPTION_TUR_JOIN_NATO_SUCCESS: "La Turquie devient membre de l'OTAN"
 RULE_OPTION_TUR_JOIN_NATO_SUCCESS_DESC: "Lorsqu'elle y sera invitée, la Turquie rejoindra l'Organisation du Traité de l'Atlantique Nord en tant que membre."
 RULE_OPTION_TUR_JOIN_NATO_FAILURE: "La Turquie reste en dehors de l'OTAN"
 RULE_OPTION_TUR_JOIN_NATO_FAILURE_DESC: "Lorsqu'elle sera invitée à l'Organisation du Traité de l'Atlantique Nord, la Turquie déclinera et restera en dehors de l'organisation, même si elle pourrait rester alignée sur l'Occident."
 
 #SPR game rules
 SPR_POLITICAL_REFORMS: "@SPR [1950s] Direction politique"
 RULE_OPTION_SPR_POLITICS_LIBERAL: "Réformes libérales"
 RULE_OPTION_SPR_POLITICS_LIBERAL_DESC: "L'Espagne abandonnera progressivement ses politiques phalangistes et continuera à raviver ses liens avec les démocraties occidentales, en sollicitant leur coopération. \n§YC'est la voie historique.§!"
 RULE_OPTION_SPR_POLITICS_FALANGE: "Retour à la tradition"
 RULE_OPTION_SPR_POLITICS_FALANGE_DESC: "Les principes traditionalistes et phalangistes originaux du mouvement franquiste seront maintenus à l'ère moderne."
 SPR_RETURN_OF_MOROCCO: "@SPR @MOR [1950s] Retour du Maroc espagnol"
 RULE_OPTION_RETURN_RIF: "Rif est retourné"
 RULE_OPTION_RETURN_RIF_DESC: "L'Espagne acceptera de restituer le Rif, mais refusera de revenir ailleurs."
 RULE_OPTION_RETURN_IFNI: "Ifni et Rif sont de retour"
 RULE_OPTION_RETURN_IFNI_DESC: "L'Espagne acceptera de restituer Rif et Ifni ; mais refusera de retourner ailleurs."
 RULE_OPTION_RETURN_TARFAYA: "Le Rif et Tarfaya sont de retour"
 RULE_OPTION_RETURN_TARFAYA_DESC: "L'Espagne acceptera de restituer Rif et Tarfaya ; mais refusera de retourner ailleurs."
 RULE_OPTION_RETURN_BOTH: "Tous les biens sont restitués"
 RULE_OPTION_RETURN_BOTH_DESC: "L'Espagne acceptera de restituer tous ses biens au Maroc ; mettre fin à la domination espagnole.\n§YC'est la voie historique.§!"
 
 #CHI game rules
 CHI_CHINESE_CIVIL_WAR: "@CHI @PRC [1950s] Guerre civile chinoise"
 CHI_CHINESE_CIVIL_WAR_DESC: "Depuis la défaite de l'Empire japonais ; le conflit entre le gouvernement central dirigé par le Kuomintang et l'Armée populaire de libération des communistes a repris et se poursuit toujours. Le vainqueur de cette guerre définira l'avenir de l'Asie entière et du monde."
 RULE_OPTION_CCW_KMT_VICTORY: "@CHI Victoire du Kuomintang"
 RULE_OPTION_CCW_KMT_VICTORY_DESC: "Le gouvernement central dirigé par le Kuomintang inversera la tendance et vaincra les communistes. L'Union soviétique interviendra pour sauver les communistes et empêcher leur annihilation totale, créant ainsi une paix difficile s'étendant du Qinghai à Pékin."
 RULE_OPTION_CCW_CCP_VICTORY: "@PRC Victoire du Parti communiste"
 RULE_OPTION_CCW_CCP_VICTORY_DESC: "L'Armée populaire de libération va vaincre le gouvernement central et la République populaire de Chine sera déclarée. Les restes du Kuomintang se retireront à Taiwan et en Birmanie.\n§YC'est la voie historique.§!"
 #(defeated)
 CHI_DEFEAT_AFTERMATH: "@CHI [1950s] Conséquences de la défaite"
 CHI_DEFEAT_AFTERMATH_DESC: "§YNécessite :§! §C§RLes communistes§! ont gagné la guerre civile chinoise§!\nLe continent est tombé aux mains des communistes. L'urgence de la situation nécessite une attention immédiate."
 RULE_OPTION_CHI_TEMPORARY_PROVISIONS: "@CHI Dispositions temporaires"
 RULE_OPTION_CHI_TEMPORARY_PROVISIONS_DESC: "Après la perte du continent ; le gouvernement prolongera la loi martiale, installant ainsi une dictature à Taiwan. \n§YC'est la voie historique.§!"
 RULE_OPTION_CHI_ABANDON_HOPE: "£GFX_game_rule_flags_ROC_formosa Abandonner l'espoir"
 RULE_OPTION_CHI_ABANDON_HOPE_DESC: "Avec la perte du continent ; Le peuple taïwanais se révoltera et renversera le régime du Kuomintang ; déclarant effectivement l'indépendance de la Chine."
 CHI_BATTLE_OF_HAINAN: "@CHI @PRC [1950s] Bataille de Hainan"
 CHI_BATTLE_OF_HAINAN_DESC: "§YNécessite :§! §C§RLes communistes§! ont gagné la guerre civile chinoise§!\nAvec le Kuomintang, il perdit le continent ; L'APL lance une opération amphibie sur Hainan."
 RULE_OPTION_CHI_KMT_HAINAN: "@CHI Le Kuomintang détient Hainan"
 RULE_OPTION_CHI_KMT_HAINAN_DESC: "Malgré la suprématie communiste ; Les forces du Kuomintang tiendront Hainan, stoppant ainsi l'avancée de l'APL. Hainan sera une frontière difficile pour le Kuomintang."
 RULE_OPTION_CHI_CCP_HAINAN: "@PRC L'APL prend Hainan"
 RULE_OPTION_CHI_CCP_HAINAN_DESC: "L'Armée populaire de libération occupera avec succès Hainan et repoussera le Kuomintang vers la mer. Taiwan est le dernier réfugié du Kuomintang. \n§YC'est la voie historique.§!"
 CHI_SUN_LIREN_COUP: "@CHI [1950s] Coup d'État de Sun Li-jen"
 CHI_SUN_LIREN_COUP_DESC: "§YNécessite :§! §CDictature du Kuomintang à Taiwan§!\nChiang Kai-shek est devenu paranoïaque ; et il y a une conspiration concernant un coup d'État militaire."
 RULE_OPTION_CHI_COUP_FAILS: "Le coup d'État échoue"
 RULE_OPTION_CHI_COUP_FAILS_DESC: "La tentative de Sun Liren de renverser Chiang a échoué et la dictature de Chiang continuera. \n§YC'est la voie historique.§!"
 RULE_OPTION_CHI_COUP_SUCCEEDS: "Le coup d'État réussit"
 RULE_OPTION_CHI_COUP_SUCCEEDS_DESC: "Sun Liren réussira à évincer Chiang et entamera une démocratisation progressive avec le soutien américain."
 CHI_TAIWAN_ELECTIONS_1954: "£GFX_game_rule_flags_ROC_formosa Élections générales taïwanaises de 1954"
 CHI_TAIWAN_ELECTIONS_1954_DESC: "§YNécessite :§! §CTaiwan est indépendant§!\n"
 RULE_OPTION_CHI_DPP_1954: "Victoire démocratique progressiste"
 RULE_OPTION_CHI_DPP_1954_DESC: "Les progressistes démocrates remporteront les élections. Durant ce mandat, ils mettront en oeuvre un programme libéral."
 RULE_OPTION_CHI_TCP_1954: "Victoire du Parti communiste taïwanais"
 RULE_OPTION_CHI_TCP_1954_DESC: "Les communistes taïwanais remporteront les élections. Durant ce mandat, ils établiront des liens avec des communistes asiatiques, distincts de Mao."
 RULE_OPTION_CHI_DEMSOC_1954: "Victoire socialiste démocratique"
 RULE_OPTION_CHI_DEMSOC_1954_DESC: "Les progressistes démocrates remporteront les élections. Durant ce mandat, ils mettront en oeuvre des politiques sociales-démocrates."
 CHI_TAIWAN_ELECTIONS_1958: "£GFX_game_rule_flags_ROC_formosa Élections générales taïwanaises de 1958"
 CHI_TAIWAN_ELECTIONS_1958_DESC: "§YNécessite :§! §CTaiwan est indépendant§!\n"
 RULE_OPTION_CHI_DPP_1958: "Victoire démocratique progressiste"
 RULE_OPTION_CHI_DPP_1958_DESC: "Les progressistes démocrates remporteront les élections. Durant ce mandat, ils prendront contact avec d'autres puissances régionales."
 RULE_OPTION_CHI_TCP_1958: "Victoire du Parti communiste taïwanais"
 RULE_OPTION_CHI_TCP_1958_DESC: "Les communistes taïwanais remporteront les élections. Durant ce mandat, ils rejoindront le COMECON, à distance de Mao."
 RULE_OPTION_CHI_DEMSOC_1958: "Victoire socialiste démocratique"
 RULE_OPTION_CHI_DEMSOC_1958_DESC: "Les progressistes démocrates remporteront les élections. Durant ce mandat, ils mettront en oeuvre des politiques sociales-démocrates."
 #(victor)
 CHI_KUOMINTANG_REFORM: "@CHI [1950s] Réforme du Kuomintang"
 CHI_KUOMINTANG_REFORM_DESC: "§YNécessite :§! §C§BLe Kuomintang§! a gagné la guerre civile chinoise§!\nLe Kuomintang a chassé les communistes ; mais le cours politique ne fait que commencer maintenant. Plus important encore, l'orientation du parti nécessite une révision."
 RULE_OPTION_CHI_KMT_REFORM: "Commencer les réformes"
 RULE_OPTION_CHI_KMT_REFORM_DESC: "Les dirigeants du Kuomintang procéderont à de vastes réformes politiques et sociales."
 RULE_OPTION_CHI_KMT_STATUS_QUO: "Le statu quo prévaut"
 RULE_OPTION_CHI_KMT_STATUS_QUO_DESC: "La direction du Kuomintang maintiendra intacts les principes actuels."
 CHI_NEW_PRESIDENT: "@CHI [1950s] Nouveau président de la Chine"
 CHI_NEW_PRESIDENT_DESC: "§YNécessite :§! §C§BLe Kuomintang§! a gagné la guerre civile chinoise§!\nAvec des réformes en cours ; le Comité central de réforme sera créé ; qui nommera le prochain président."
 RULE_OPTION_CHI_KMT_LI_ZONGREN: "Li Zongren"
 RULE_OPTION_CHI_KMT_LI_ZONGREN_DESC: "Li Zongren consolidera son leadership et sera nommé président. Il entamera une démocratisation progressive en Chine."
 RULE_OPTION_CHI_KMT_JIANG_JIESHI: "Tchang Kaï-chek"
 RULE_OPTION_CHI_KMT_JIANG_JIESHI_DESC: "Chiang Kai-shek reviendra au pouvoir car il sera (re)nommé président, poursuivant ainsi son régime autoritaire de longue date"
 RULE_OPTION_CHI_KMT_SUN_LIREN: "Soleil Liren"
 RULE_OPTION_CHI_KMT_SUN_LIREN_DESC: "Sun Liren sera nommé président et coopérera plus étroitement avec les Américains."
 CHI_RETURN_TO_TIBET: "@CHI @TIB [1950s] La question du Tibet"
 CHI_RETURN_TO_TIBET_DESC: "§YNécessite :§! §C§BLe Kuomintang§! a gagné la guerre civile chinoise§!\nUne fois la situation en Chine stabilisée ; la seule question inévitable est de savoir ce qui se passera avec le Tibet."
 RULE_OPTION_CHI_STAGE_COUP: "@CHI @TIB Coup d'État au Tibet"
 RULE_OPTION_CHI_STAGE_COUP_DESC: "Un coup d'État sera fomenté par la Chine pour installer le Panchen Lama comme dirigeant tibétain, transformant ainsi le Tibet en une région autonome ; en cas de succès."
 RULE_OPTION_CHI_LEAVE_TIBET: "@TIB Quitter le Tibet"
 RULE_OPTION_CHI_LEAVE_TIBET_DESC: "La Chine reconnaîtra l'indépendance du Tibet, mettant ainsi fin au débat sur la souveraineté tibétaine. Cela permettra des relations plus cordiales avec l'Inde."
 RULE_OPTION_CHI_INVADE_TIBET: "@CHI Envahir le Tibet"
 RULE_OPTION_CHI_INVADE_TIBET_DESC: "La Chine envahira le Tibet pour restaurer le contrôle chinois ; purger ensuite la noblesse traditionnelle."
 CHI_STANCE_ON_VIETNAM: "@CHI @VIE [1950s] Position chinoise sur le Vietnam"
 CHI_STANCE_ON_VIETNAM_DESC: "§YNécessite :§! §C§BLe Kuomintang§! a gagné la guerre civile chinoise§!\nAvec le Kuomintang chinois, les communistes ont été vaincus ; Le gouvernement chinois prendra position contre le communisme à l'étranger ; auquel le Vietnam ne fait pas exception."
 RULE_OPTION_CHI_SUPPORT_FRENCH: "Soutenir le français"
 RULE_OPTION_CHI_SUPPORT_FRENCH_DESC: "Le gouvernement chinois soutiendra directement les Français contre le Viet Minh ; adopter une approche plus décisive."
 RULE_OPTION_CHI_SUPPORT_VNQDD: "Prise en charge de VNQDD"
 RULE_OPTION_CHI_SUPPORT_VNQDD_DESC: "Le gouvernement chinois soutiendra le Kuomintang vietnamien au nord et au sud ; tout en gardant une faible implication."
 
 #PRC game rules (victor)
 PRC_HUNDRED_FLOWERS_CAMPAIGN: "@PRC [1950s] Fin de la campagne des Cent Fleurs"
 PRC_HUNDRED_FLOWERS_CAMPAIGN_DESC: "§YNécessite :§! §C§RLes communistes§! ont gagné la guerre civile chinoise§!\nLe projet mis en oeuvre par Mao Zedong pour écouter les critiques est devenu incontrôlable. Avec une opposition en hausse ; le Parti est tenu d'agir."
 RULE_OPTION_PRC_RECTIFICATION: "Échec - Rectification"
 RULE_OPTION_PRC_RECTIFICATION_DESC: "La Chine rétablira l'ordre en lançant une campagne anti-droite, revenant au statu quo. \n§YC'est la voie historique.§!"
 RULE_OPTION_PRC_DEMOCRATIZATION: "Succès - Poursuite de la réforme"
 RULE_OPTION_PRC_DEMOCRATIZATION_DESC: "L'opposition parviendra à renverser Mao et commencera à accorder davantage de libertés. \nCela pourrait permettre une unification avec le régime de Taiwan."
 PRC_TIBETAN_UPRISING: "@PRC @TIB [1950s] Soulèvement tibétain"
 PRC_TIBETAN_UPRISING_DESC: "§YNécessite :§! §C§RLes communistes§! ont gagné la guerre civile chinoise§!\nBien que libéré avec le reste de la Chine ; un soulèvement a lieu contre le régime communiste."
 RULE_OPTION_PRC_SUPPRESS_UPRISING: "@PRC Réprimer le soulèvement"
 RULE_OPTION_PRC_SUPPRESS_UPRISING_DESC: "La Chine écrasera le soulèvement, exilant ainsi le Dalaï Lama.\n§YC'est la voie historique.§!"
 RULE_OPTION_PRC_LEAVE_TIBET: "@TIB Quitter le Tibet"
 RULE_OPTION_PRC_LEAVE_TIBET_DESC: "La Chine cédera au soulèvement et restaurera l'indépendance du Tibet."
 PRC_MAO_AND_LIU: "@PRC [1960s] Mao et Liu"
 PRC_MAO_AND_LIU_DESC: "Avec l'échec du Grand Bond en avant ; Mao est contraint de démissionner pour un poste secondaire, et Liu Shaoqi est désormais aux commandes. Mais Mao envisage de revenir, et la question est de savoir s'il réussira dans sa démarche."
 RULE_OPTION_PRC_MAO_RETURNS: "Mao déjoue Liu"
 RULE_OPTION_PRC_MAO_RETURNS_DESC: "Mao Zedong reviendra à un poste de décision politique. Cela permettra à Mao de lancer la Révolution culturelle ; purgeant ensuite toute son opposition. \n§YC'est la voie historique.§!"
 RULE_OPTION_PRC_MAO_RETIRES: "Liu déjoue Mao"
 RULE_OPTION_PRC_MAO_RETIRES_DESC: "Liu Shaoqi forcera Mao à prendre sa retraite, mettant ainsi fin à son implication dans le Parti. Le président Liu lancera plus tard le Printemps de Pékin ; libéraliser progressivement l'environnement."
 PRC_SINO_INDIAN_CONFLICT: "@PRC @RAJ [1960s] Conflit sino-indien"
 PRC_SINO_INDIAN_CONFLICT_DESC: "Alors que les relations se détériorent entre la Chine et l'Inde, un conflit se profile à l'horizon ; mais est-ce inévitable ?"
 RULE_OPTION_PRC_INVADE_AKSAI_CHIN: "Envahir Aksai Chin"
 RULE_OPTION_PRC_INVADE_AKSAI_CHIN_DESC: "Une série de guerres frontalières vont avoir lieu entre la Chine et l'Inde. Cette guerre se terminera par l'occupation chinoise et l'annexion de l'Aksai Chin. \n§YC'est la voie historique.§!"
 RULE_OPTION_PRC_STRIKE_A_THAW: "Faire un dégel"
 RULE_OPTION_PRC_STRIKE_A_THAW_DESC: "Le conflit frontalier ne s'intensifiera pas et il sera résolu par des traités."
 PRC_SINO_SOVIET_CONFLICT: "@PRC @SOV [1960s] Conflit sino-soviétique"
 PRC_SINO_SOVIET_CONFLICT_DESC: "Une petite île, appelée Damansky en russe et Zhenbao en chinois ; est une source de conflit entre la Chine et la Russie soviétique. Les relations sont tendues à cause de la scission sino-soviétique ; l'avenir de l'île est incertain."
 RULE_OPTION_PRC_SETTLE_A_DEAL: "Régler un accord"
 RULE_OPTION_PRC_SETTLE_A_DEAL_DESC: "Le conflit sera résolu sans effusion de sang."
 RULE_OPTION_PRC_CEASEFIRE: "Conflit gelé"
 RULE_OPTION_PRC_CEASEFIRE_DESC: "Le conflit ne durera pas longtemps ; mais il n'y aura pas non plus de solution solide. \n§YC'est la voie historique.§!"
 
 #PRC game rules (defeated)
 PRC_MANCHURIA_POST_STALIN: "£GFX_game_rule_flags_PRC_SOV_communism   [1950s] Direction post-Staline"
 PRC_MANCHURIA_POST_STALIN_DESC: "§YNécessite :§! §C§BLe Kuomintang§! a gagné la guerre civile chinoise§!\nAvec les communistes chinois sous la direction de Staline ; Mao a été contraint de démissionner en faveur de Wang Ming. Mais avec Staline, c'est fini ; L'évolution du leadership chinois est aussi incertaine que celle des autres pays du bloc de l'Est alignés sur l'Union soviétique."
 RULE_OPTION_PRC_WANG_MING_STAYS: "Wang Ming reste"
 RULE_OPTION_PRC_WANG_MING_STAYS_DESC: "Le Parti communiste chinois suivra le révisionnisme et maintiendra ses liens avec l'Union soviétique, purgeant ainsi Mao et ses partisans."
 RULE_OPTION_PRC_MAO_RETURNS_MANCHU: "Le retour de Mao Zedong"
 RULE_OPTION_PRC_MAO_RETURNS_MANCHU_DESC: "Le Parti communiste chinois refusera de suivre le révisionnisme, permettant à Mao Zedong d'écarter Wang Ming pour la deuxième fois."
 PRC_MANCHURIA_POST_KHRUSHCHEV: "£GFX_game_rule_flags_PRC_SOV_communism   [1960s] La direction post-Khrouchtchev"
 PRC_MANCHURIA_POST_KHRUSHCHEV_DESC: "Le gouvernement populaire tient ; mais alors que la direction soviétique change encore une fois ; Le Parti communiste chinois doit à nouveau ajuster son cap."
 RULE_OPTION_PRC_LIBERAL_COMMUNISM: "Printemps chinois"
 RULE_OPTION_PRC_LIBERAL_COMMUNISM_DESC: "Le gouvernement populaire suivra une voie libertaire, dirigée par Kai Feng. Les communistes chinois continueront à maintenir la ligne soviétique."
 RULE_OPTION_PRC_ROLL_BACK_STATUS_QUO: "Faire reculer la libéralisation"
 RULE_OPTION_PRC_ROLL_BACK_STATUS_QUO_DESC: "Les efforts chinois pour libéraliser le pays seront abandonnés et les chiffres à l'appui seront purgés."
 
