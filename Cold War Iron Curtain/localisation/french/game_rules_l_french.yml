 RULE_OPTION_USA_HUMPHREY_1968: "Hubert Humphrey (D)"
 RULE_OPTION_USA_HUMPHREY_1968_DESC: "Humphrey surmonte le chaos de 1968 et gagne."
 RULE_OPTION_USA_RFK_1968: "Robert F.Kennedy (Démocrate)"
 RULE_OPTION_USA_RFK_1968_DESC: "§YNécessite :§! §CRFK vivant§!\nBobby survit à la Californie et restaure Camelot."
 RULE_OPTION_USA_REAGAN_1968: "Ronald Reagan (à droite)"
