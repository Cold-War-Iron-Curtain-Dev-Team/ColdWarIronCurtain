 RULE_OPTION_CAM_REPUBLIC_1950: "République établie"
 RULE_OPTION_CAM_REPUBLIC_1950_DESC: "§YNécessite :§! §RPAS§! §CSangkum a remporté les élections de 1955.§! \nAvec le soutien américain ; les conspirateurs républicains organiseront un coup d'État et renverseront la monarchie, établissant ainsi une république."
 
