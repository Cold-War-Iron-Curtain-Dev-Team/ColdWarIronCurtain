 #USA game rules
 USA_STANCE_ON_VIETNAM: "@USA @VIE @VIN [1950s] Position américaine sur le Vietnam"
 USA_STANCE_ON_VIETNAM_DESC: "Les Accords de Genève exigent qu'un référendum d'unification ait lieu au Nord et au Sud-Vietnam. Cependant, tout le monde n'est pas favorable au référendum."
 RULE_OPTION_USA_ALLOW_FREE_ELECTIONS: "@USA @VIE @VIN Autoriser des élections libres"
 RULE_OPTION_USA_ALLOW_FREE_ELECTIONS_DESC: "§YNécessite :§! §RPAS§! §CRéférendum avec veto au Sud-Vietnam§!\nL'Amérique fera pression sur le gouvernement sud-vietnamien pour qu'il organise le référendum ; qui réussira et permettra l'Unification vietnamienne §Y§!."
 RULE_OPTION_USA_ALLOW_RIGGED_ELECTIONS: "@USA @VIE Autoriser les élections truquées"
 RULE_OPTION_USA_ALLOW_RIGGED_ELECTIONS_DESC: "§YNécessite :§! §RPAS§! §CRéférendum avec veto au Sud-Vietnam§!\nL'Amérique fera pression sur le gouvernement sud-vietnamien pour qu'il organise le référendum ; qui échouera à cause du trucage électoral."
 RULE_OPTION_USA_BLOCK_ELECTIONS: "@USA @VIE Bloquer les élections"
 RULE_OPTION_USA_BLOCK_ELECTIONS_DESC: "L'Amérique soutiendra le refus des Sud-Vietnamiens d'organiser un référendum ; et lancera l'opération Passage to Freedom. \n§YC'est la voie historique.§!"
 NATO_GREEK_INTERVENTION_RULE: "@USA @GRE [1949] Opération Bouclier Égéen"
 RULE_OPTION_NATO_GRE_ALWAYS: "Proposer un bouclier égéen"
 RULE_OPTION_NATO_GRE_ALWAYS_DESC: "§YNécessite :§! §CLe gouvernement grec a capitulé à plus de 60 %§!\nLes membres de l'OTAN proposeront toujours d'intervenir en Grèce une fois que le gouvernement grec aura perdu la guerre civile."
 RULE_OPTION_NATO_GRE_NEVER: "Restez en dehors de la Grèce"
 RULE_OPTION_NATO_GRE_NEVER_DESC: "Les membres de l'OTAN ne proposeront jamais l'opération Bouclier Égéen. La guerre civile grecque touche à sa fin."

 #USA presidential elections
 USA_1952_ELECTIONS_RULE: "@USA [1952] Élection présidentielle"
 RULE_OPTION_USA_EISENHOWER_1952: "Dwight D. Eisenhower (à droite)"
 RULE_OPTION_USA_EISENHOWER_1952_DESC: "J'aime Ike. Les Républicains reviennent à la Maison Blanche après vingt ans.\n§YC'est la voie historique.§!"
 RULE_OPTION_USA_STEVENSON_1952: "Adlai Stevenson II (D)"
 RULE_OPTION_USA_STEVENSON_1952_DESC: "Le gouverneur de l'Illinois bat Eisenhower et poursuit la coalition du New Deal."
 RULE_OPTION_USA_KEFAUVER_1952: "Estès Kefauver (D)"
 RULE_OPTION_USA_KEFAUVER_1952_DESC: "Le sénateur du Tennessee, anti-criminalité, remporte la nomination et la Maison Blanche."
 RULE_OPTION_USA_HARRIMAN_1952: "Averell Harriman (D)"
 RULE_OPTION_USA_HARRIMAN_1952_DESC: "Le diplomate et homme d'affaires remporte l'investiture démocrate et la présidence."
 RULE_OPTION_USA_RUSSELL_1952: "Richard Russell (Démocrate)"
 RULE_OPTION_USA_RUSSELL_1952_DESC: "Le sénateur géorgien remporte l'investiture démocrate et la présidence."
 RULE_OPTION_USA_MACARTHUR_1952: "Douglas MacArthur (à droite)"
 RULE_OPTION_USA_MACARTHUR_1952_DESC: "§YNécessite :§! §CMacArthur renvoyé à cause de la Corée§!\nLe César américain refuse de s'effacer et revendique la Maison Blanche."

 USA_1956_ELECTIONS_RULE: "@USA [1956] Élection présidentielle"
 RULE_OPTION_USA_EISENHOWER_1956: "Dwight D. Eisenhower (à droite)"
 RULE_OPTION_USA_EISENHOWER_1956_DESC: "§YNécessite :§! §CEisenhower a gagné en 1952§!\nIke remporte un deuxième mandat.\n§YC'est la voie historique.§!"
 RULE_OPTION_USA_STEVENSON_1956: "Adlai Stevenson II (D)"
 RULE_OPTION_USA_STEVENSON_1956_DESC: "Stevenson remporte le match revanche."
 RULE_OPTION_USA_KEFAUVER_1956: "Estès Kefauver (D)"
