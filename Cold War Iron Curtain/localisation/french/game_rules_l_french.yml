 RULE_OPTION_USA_HUMPHREY_1964: "Hubert Humphrey (D)"
 RULE_OPTION_USA_HUMPHREY_1964_DESC: "§YNécessite :§! §RPAS§! §CJohnson a succédé à Kennedy§!\nHumphrey porte la bannière démocrate."
 RULE_OPTION_USA_GOLDWATER_1964: "Barry Goldwater (à droite)"
 RULE_OPTION_USA_GOLDWATER_1964_DESC: "L'extrémisme dans la défense de la liberté n'est pas un vice. Goldwater gagne."
 RULE_OPTION_USA_ROCKEFELLER_1964: "Nelson Rockefeller (à droite)"
 RULE_OPTION_USA_ROCKEFELLER_1964_DESC: "Le républicain libéral de New York prend la Maison Blanche."
 RULE_OPTION_USA_NIXON_1964: "Richard Nixon (à droite)"
 RULE_OPTION_USA_NIXON_1964_DESC: "§YNécessite :§! §CNixon nominé en 1960§!\nNixon revient quatre ans plus tôt."

 USA_1968_ELECTIONS_RULE: "@USA [1968] Élection présidentielle"
