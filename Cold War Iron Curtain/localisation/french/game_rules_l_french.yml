 RULE_OPTION_USA_WALLACE_1968: "George Wallace (I)"
 RULE_OPTION_USA_WALLACE_1968_DESC: "Le Parti indépendant américain porte bien plus que le Sud profond."
 RULE_OPTION_USA_ROCKEFELLER_1968: "Nelson Rockefeller (à droite)"
 RULE_OPTION_USA_ROCKEFELLER_1968_DESC: "Rockefeller prend enfin la Maison Blanche."

 #SOV game rules
 SOV_GREEK_CIVIL_WAR_RULE: "@SOV @GRE [1949] La guerre civile grecque"
 RULE_OPTION_SOV_GRE_PERCENTAGE: "Honorer l'accord de pourcentage"
 RULE_OPTION_SOV_GRE_PERCENTAGE_DESC: "La Grèce fut concédée à la sphère britannique. Moscou abandonne les communistes grecs à leur sort.\n§YC'est la voie historique.§!"
 RULE_OPTION_SOV_GRE_INTERVENTION: "Intervenir pour le KKE"
 RULE_OPTION_SOV_GRE_INTERVENTION_DESC: "§YNécessite :§! §CLe gouvernement grec démocratique est toujours en place§!\nL'Armée rouge marche pour sauver les communistes grecs. Une guerre avec l'Occident devient très probable."
 SOV_1949_GERMAN_ELECTION_RULE: "@SOV @WGR [1949] Les élections ouest-allemandes"
 RULE_OPTION_SOV_GER49_HANDS_OFF: "Focus sur l'Est"
 RULE_OPTION_SOV_GER49_HANDS_OFF_DESC: "Moscou se concentre sur la consolidation du socialisme dans sa propre zone.\n§YC'est la voie historique.§!"
 RULE_OPTION_SOV_GER49_INTERFERE: "Interférer dans les élections"
 RULE_OPTION_SOV_GER49_INTERFERE_DESC: "Des agents soviétiques se mêlent des premières élections fédérales ouest-allemandes et infiltrent le KPD."
 SOV_AUSTRIA_QUESTION_RULE: "@SOV [1955] La question autrichienne"
 RULE_OPTION_SOV_AUT_NEUTRAL: "Une Autriche neutre"
 RULE_OPTION_SOV_AUT_NEUTRAL_DESC: "L'occupation prend fin avec le traité d'État : l'Autriche est indépendante et durablement neutre.\n§YC'est la voie historique.§!"
 RULE_OPTION_SOV_AUT_SOCIALIST: "Une Autriche socialiste"
 RULE_OPTION_SOV_AUT_SOCIALIST_DESC: "L'indépendance autrichienne est retardée indéfiniment tandis que la zone soviétique est préparée au socialisme."
 SOV_FRENCH_COMMUNISTS_RULE: "@SOV @FRA [1950] Les communistes français"
 RULE_OPTION_SOV_FRA_DOCKERS: "Parrainez les grèves des dockers"
 RULE_OPTION_SOV_FRA_DOCKERS_DESC: "Le PCF et la CGT paralysent les ports français en signe de protestation contre la guerre d'Indochine et le plan Marshall.\n§YC'est la voie historique.§!"
 RULE_OPTION_SOV_FRA_LOW_PROFILE: "Commandez un profil bas"
 RULE_OPTION_SOV_FRA_LOW_PROFILE_DESC: "Il est demandé au parti français de se taire et de renforcer le système."
 SOV_YUGOSLAVIA_QUESTION_RULE: "@SOV @YUG Yougoslavie"
 RULE_OPTION_SOV_YUG_RECONCILIATION: "Lever le blocus"
 RULE_OPTION_SOV_YUG_RECONCILIATION_DESC: "Le blocus économique de la Yougoslavie est levé et les relations se normalisent.\n§YC'est la voie historique (après Staline).§!"
 RULE_OPTION_SOV_YUG_OBEDIENCE: "Exigez l'obéissance de Tito"
 RULE_OPTION_SOV_YUG_OBEDIENCE_DESC: "Moscou lance un ultimatum à Belgrade. Tito ne pliera pas - attendez-vous à une confrontation."
 SOV_TURKEY_QUESTION_RULE: "@SOV @TUR [1952] La Turquie et l'OTAN"
 RULE_OPTION_SOV_TUR_RELENT: "Accepter l'adhésion de la Turquie"
 RULE_OPTION_SOV_TUR_RELENT_DESC: "Moscou grogne mais accepte l'adhésion de la Turquie à l'OTAN, puis renonce à ses revendications territoriales.\n§YC'est la voie historique.§!"
 RULE_OPTION_SOV_TUR_ULTIMATUM: "Forcer la dinde à sortir"
 RULE_OPTION_SOV_TUR_ULTIMATUM_DESC: "L'Union soviétique insiste sur ses revendications sur les détroits et exige le retrait de la Turquie de l'OTAN. Si Ankara résiste, la subordination sera exigée - une voie vers la guerre."
 SOV_INTERNAL_AI_BEHAVIOR: "@SOV [1950s] Lutte de pouvoir"
 RULE_OPTION_INTERNAL_HISTORICAL_SOV_AI: "Nikita Khrouchtchev"
 RULE_OPTION_INTERNAL_HISTORICAL_SOV_AI_DESC: "Nikita Khrouchtchev déjouera Beria et remportera la lutte pour le pouvoir.\n§YC'est la voie historique.§!"
 RULE_OPTION_INTERNAL_BERIA_SOV_AI: "Beria succède à Staline"
 RULE_OPTION_INTERNAL_BERIA_SOV_AI_DESC: "Lavrenti Beria prendra le pouvoir, avec Georgy Malenkov comme figure de proue."
 RULE_OPTION_INTERNAL_STALIN_SOV_AI: "Staline vit"
 RULE_OPTION_INTERNAL_STALIN_SOV_AI_DESC: "devenir réel"
 SOV_1964_PRESIDIUM_RULE: "@SOV [1964] Plénum d'octobre"
 RULE_OPTION_SOV_BREZHNEV_1964: "Léonid Brejnev"
 RULE_OPTION_SOV_BREZHNEV_1964_DESC: "§YNécessite :§! §CKhrouchtchev au pouvoir§!\nLe Présidium destitue Khrouchtchev en octobre 1964 et élit Brejnev.\n§YC'est la voie historique.§!"
 RULE_OPTION_SOV_KHRUSHCHEV_1964: "Séjours à Khrouchtchev"
 RULE_OPTION_SOV_KHRUSHCHEV_1964_DESC: "§YNécessite :§! §CKhrouchtchev au pouvoir§! et §Cle plan septennal a réussi§!\nKhrouchtchev survit au complot contre lui et reste Premier secrétaire."
 SOV_GERMAN_QUESTION_RULE: "@SOV @DDR @WGR [1952] La question allemande"
 RULE_OPTION_SOV_GQ_DIVISION: "Gérer la division"
 RULE_OPTION_SOV_GQ_DIVISION_DESC: "L'Union soviétique s'installe dans la gestion d'une Allemagne divisée : le Nouveau Cours, l'écrasement du soulèvement de juin, Adenauer à Moscou et le Traité sur les relations avec la RDA.\n§YC'est la voie historique.§!"
 RULE_OPTION_SOV_GQ_NOTE_REJECTED: "La note est rejetée"
 RULE_OPTION_SOV_GQ_NOTE_REJECTED_DESC: "Staline poursuit sérieusement sa Note sur la réunification, mais les puissances occidentales la rejettent comme un stratagème communiste. L'Allemagne reste divisée et Moscou s'efforce de fortifier sa moitié."
 RULE_OPTION_SOV_GQ_UNIFIED: "Une Allemagne neutre et unifiée"
 RULE_OPTION_SOV_GQ_UNIFIED_DESC: "La Note Staline mène à de véritables négociations : les deux parties font un compromis et l'Allemagne est réunifiée en tant qu'État neutre et démocratique."
 SOV_1957_ANTI_PARTY_GROUP_RULE: "@SOV [1957] Le groupe anti-parti"
 RULE_OPTION_SOV_APG_KHRUSHCHEV: "Khrouchtchev l'emporte"
 RULE_OPTION_SOV_APG_KHRUSHCHEV_DESC: "§YNécessite :§! §CKhrouchtchev au pouvoir§!\nLe plénum du Comité central condamne Molotov, Malenkov et Kaganovitch. Khrouchtchev consolide sa position.\n§YC'est la voie historique.§!"
 RULE_OPTION_SOV_APG_OLD_GUARD: "La vieille garde gagne"
 RULE_OPTION_SOV_APG_OLD_GUARD_DESC: "§YNécessite :§! §CKhrouchtchev au pouvoir§!\nLa majorité du Présidium évince Khrouchtchev. Nikolaï Boulganine dirige le gouvernement de la vieille garde."
 SOV_RETURNED_EXILES_RULE: "@SOV [1957] Les exilés de retour"
 RULE_OPTION_SOV_EXILES_CAUCASUS: "Retour au Caucase"
 RULE_OPTION_SOV_EXILES_CAUCASUS_DESC: "§YNécessite :§! §CKhrouchtchev au pouvoir§!\nLes peuples déportés retournent dans leurs patries et leurs républiques sont restaurées.\n§YC'est la voie historique.§!"
 RULE_OPTION_SOV_EXILES_KAZAKHSTAN: "S'installer au Kazakhstan"
 RULE_OPTION_SOV_EXILES_KAZAKHSTAN_DESC: "§YNécessite :§! §CKhrouchtchev au pouvoir§!\nLes exilés sont installés définitivement au Kazakhstan et une nouvelle ASSR est créée pour eux."
 SOV_CUBAN_MISSILE_CRISIS_RULE: "@SOV @USA [1962] La crise des missiles de Cuba"
 RULE_OPTION_SOV_CMC_HISTORICAL: "Treize jours"
 RULE_OPTION_SOV_CMC_HISTORICAL_DESC: "Les missiles sont déployés, Kennedy bloque l'île et l'offre de Khrouchtchev est acceptée : les missiles rentrent chez eux en échange de concessions.\n§YC'est la voie historique.§!"
 RULE_OPTION_SOV_CMC_NO_MISSILES: "Un traité de défense à la place"
 RULE_OPTION_SOV_CMC_NO_MISSILES_DESC: "Moscou accepte la contre-offre de Castro concernant un traité de défense et n'expédie jamais de missiles. La crise telle que nous la connaissons n'existe pas."
 RULE_OPTION_SOV_CMC_ESCALATION: "La corde raide"
 RULE_OPTION_SOV_CMC_ESCALATION_DESC: "§RVoici des dragons.§! Les deux superpuissances refusent de cligner des yeux : une invasion, un blocus et des troupes soviétiques engageant les Américains sur le sol cubain deviennent probables. Peut se terminer par une guerre nucléaire."
 SOV_KAGANOVICH_SUCCESSION_RULE: "@SOV La succession de Kaganovitch"
 RULE_OPTION_SOV_KAG_USTINOV: "Dmitri Oustinov"
 RULE_OPTION_SOV_KAG_USTINOV_DESC: "§YNécessite :§! §CLe chemin Kaganovitch (Staline Lives)§!\nLe technocrate de l'industrie de défense hérite de l'Union."
 RULE_OPTION_SOV_KAG_SHELEPIN: "Alexandre Chélépin"
 RULE_OPTION_SOV_KAG_SHELEPIN_DESC: "§YNécessite :§! §CLe chemin Kaganovitch (Staline Lives)§!\n« Iron Shurik » et sa faction du Komsomol prennent les rênes."

 #ALB game rules
 ALB_ALBANIAN_SUBVERSION_AI: "@ALB @USA [1950s] La subversion albanaise"
 RULE_OPTION_ALB_PIXIES_CRUSHED: "L'Albanie inébranlable"
 RULE_OPTION_ALB_PIXIES_CRUSHED_DESC: "Malgré l'ingérence des puissances étrangères, le gouvernement albanais reste indemne et continue sur sa lancée."
 RULE_OPTION_ALB_ALBANIA_SUBVERTED: "Contre-révolution albanaise"
 RULE_OPTION_ALB_ALBANIA_SUBVERTED_DESC: "Avec l'aide américaine et britannique, les infiltrés réactionnaires parviendront à organiser un soulèvement, déclenchant une guerre civile."

 #JOR game rules
 JOR_KING_TALAL_QUESTION: "@JOR [1950s] Question du roi Talal"
 JOR_KING_TALAL_QUESTION_DESC: ""
 RULE_OPTION_JOR_TALAL_ABDICATES: "Talal abdique"
 RULE_OPTION_JOR_TALAL_ABDICATES_DESC: "Le roi Talal est contraint d'abdiquer et Hussein reprendra le royaume. \n§YC'est la voie historique.§!"
 RULE_OPTION_JOR_TALAL_STAYS: "Séjours Talal"
 RULE_OPTION_JOR_TALAL_STAYS_DESC: "Le roi Talal continuera à exercer la royauté, niant sa maladie. Il suivra un cursus libéral. Pour la Jordanie."
 JOR_FREE_OFFICERS_COUP_AI: "@JOR [1950s] Coup d'État des officiers libres jordaniens"
 JOR_FREE_OFFICERS_COUP_AI_DESC: "§YNécessite :§! §CLe roi Talal a abdiqué§!\n"
 RULE_OPTION_JOR_FREE_OFFICERS_THWARTED: "La tentative de coup d'État échoue"
 RULE_OPTION_JOR_FREE_OFFICERS_THWARTED_DESC: "Avant même que le coup d'État puisse réellement commencer, ses dirigeants sont contraints de démissionner et le roi Hussein consolide son règne sur le pays. \n§YC'est la voie historique.§!"
 RULE_OPTION_JOR_FREE_OFFICERS_SUCCESS: "Révolution jordanienne"
 RULE_OPTION_JOR_FREE_OFFICERS_SUCCESS_DESC: "Le roi Hussein ignore les signes d'un coup d'État imminent, permettant ainsi aux officiers libres de renverser avec succès la monarchie jordanienne et d'établir une république."
 
