 RULE_OPTION_USA_HARRIMAN_1956: "Averell Harriman (D)"
 RULE_OPTION_USA_HARRIMAN_1956_DESC: "Harriman remporte l'investiture démocrate et la Maison Blanche."

 USA_1960_ELECTIONS_RULE: "@USA [1960] Élection présidentielle"
 RULE_OPTION_USA_KENNEDY_1960: "John F. Kennedy (D)"
 RULE_OPTION_USA_KENNEDY_1960_DESC: "Ne demandez pas ce que votre pays peut faire pour vous.\n§YC'est la voie historique.§!"
 RULE_OPTION_USA_NIXON_1960: "Richard Nixon (à droite)"
 RULE_OPTION_USA_NIXON_1960_DESC: "Nixon remporte l'élection la plus serrée de l'histoire américaine avec huit ans d'avance."
 RULE_OPTION_USA_HUMPHREY_1960: "Hubert Humphrey (D)"
 RULE_OPTION_USA_HUMPHREY_1960_DESC: "Le Happy Warrior du Minnesota bat Kennedy à la nomination et gagne."

