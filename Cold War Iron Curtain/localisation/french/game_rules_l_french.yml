 #CUB game rules
 CUB_1958_ELECTIONS_RULE: "@CUB Élections présidentielles de 1958"
 RULE_OPTION_CUB_AGUERO_1958: "Agüero gagne"
 RULE_OPTION_CUB_AGUERO_1958_DESC: "Andres Agüero sera élu président. Il établira des contre-paramilitaires et recherchera le soutien américain pour vaincre le Mouvement du 26 juillet."
 RULE_OPTION_CUB_STERLING_1958: "Sterling gagne"
 RULE_OPTION_CUB_STERLING_1958_DESC: "Carlos Sterling sera élu président. Il restaurera les libertés politiques et recherchera le soutien américain pour faire la paix avec le Mouvement du 26 juillet."
 RULE_OPTION_CUB_REVOLUTION: "La révolution cubaine"
 RULE_OPTION_CUB_REVOLUTION_DESC: "Fidel Castro et le Mouvement du 26 juillet renverseront le régime de Batista.\n§YC'est la voie historique.§!"
 
 #DOM game rules
 DOM_1957_ELECTIONS_RULE: "@DOM Élections présidentielles de 1957"
 RULE_OPTION_DOM_TRUJILLO_1957: "Hector Trujillo gagne"
 RULE_OPTION_DOM_TRUJILLO_1957_DESC: "Hector Trujillo, frère de Rafael Trujillo, sera élu président. La famille Trujillo continuera de contrôler la République Dominicaine.\n§YC'est la voie historique.§!"
 RULE_OPTION_DOM_BALAGUER_1957: "Joaquín Balaguer gagne"
 RULE_OPTION_DOM_BALAGUER_1957_DESC: "Joaquín Balaguer sera élu président. Tandis que la famille Trujillo sera éloignée du pouvoir ; un régime de parti unique sera installé à la place."
 DOM_ANTIHAITIANISMO_RULE: "@DOM [1950s] Antihaïtianisme"
 RULE_OPTION_DOM_CONTINUE_ANTIHAITIANISMO: "Gardez le cap"
 RULE_OPTION_DOM_CONTINUE_ANTIHAITIANISMO_DESC: "L'antihaïtianisme continue ; ainsi que la répression culturelle des Haïtiens et les tensions diplomatiques avec Haïti."
 RULE_OPTION_DOM_SLOW_DOWN_ANTIHAITIANISMO: "Ralentir"
 RULE_OPTION_DOM_SLOW_DOWN_ANTIHAITIANISMO_DESC: "L'antihaïtianisme sera ralenti ; instaurer des protections culturelles aux Haïtiens avec une visite d'État en Haïti."
 
 #ENG game rules
 ENG_1950_ELECTIONS: "@ENG Élections de 1950"
 RULE_OPTION_ENG_ATLEE_1950: "Clément Atlee gagne"
 RULE_OPTION_ENG_ATLEE_1950_DESC: "Clément Atlee remportera les élections. Durant ce mandat, il se concentrera sur le développement de l'industrie militaire.\n§YC'est la voie historique.§!"
 RULE_OPTION_ENG_BEVAN_1950: "Aneurin Bevan gagne"
 RULE_OPTION_ENG_BEVAN_1950_DESC: "Aneurin Bevan remportera les élections. Au cours de ce mandat, il mènera d'importantes réformes de gauche, qui aboutiront éventuellement à des élections anticipées."
 ENG_1959_ELECTIONS: "@ENG Élections de 1959"
 ENG_1959_ELECTIONS_DESC: ""
 RULE_OPTION_ENG_MACMILLAN_1959: "Harold Macmillan gagne"
 RULE_OPTION_ENG_MACMILLAN_1959_DESC: "Harold Macmillan et le Parti conservateur remporteront les élections.\n§YC'est la voie historique.§!"
 RULE_OPTION_ENG_GRIMOND_1959: "Jo Grimond gagne"
 RULE_OPTION_ENG_GRIMOND_1959_DESC: "Jo Grimond et le Parti libéral remporteront les élections."
 RULE_OPTION_ENG_GAITSKELL_1959: "Hugh Gaitskell gagne"
 RULE_OPTION_ENG_GAITSKELL_1959_DESC: "Hugh Gaitskell et le Parti travailliste remporteront les élections."
 
 #BEL game rules
 BEL_1949_ELECTIONS_RULE: "@BEL Élections de 1949"
 RULE_OPTION_BEL_CSP_1949: "Victoire du CSP"
 RULE_OPTION_BEL_CSP_1949_DESC: "Le CSP remportera les élections. Durant ce mandat, ils se concentreront sur la suppression des vestiges nazis en Belgique."
 RULE_OPTION_BEL_BSP_1949: "Victoire du BSP"
 RULE_OPTION_BEL_BSP_1949_DESC: "Le BSP remportera les élections. Durant ce mandat, ils se concentreront sur les politiques sociales et les mouvements ouvriers."
 BEL_FATE_OF_MONARCHY_RULE: "@BEL [1950s] Le sort de la monarchie"
 RULE_OPTION_BEL_REFERENDUM_SUCCESS: "Référendum - Succès"
 RULE_OPTION_BEL_REFERENDUM_SUCCESS_DESC: "Le gouvernement soumettra la question de la monarchie au référendum, qui réussira avec l'aide des monarchistes flamands."
 RULE_OPTION_BEL_REFERENDUM_FAILURE: "Référendum - Le roi est bloqué"
 RULE_OPTION_BEL_REFERENDUM_FAILURE_DESC: "Le gouvernement soumettra la question de la monarchie au référendum. Même si le référendum sera réussi ; L'opposition des Waloons empêchera le Roi d'assumer ses fonctions."
 RULE_OPTION_BEL_RETURN_IGNORE: "King Returns - Les frappes sont ignorées"
 RULE_OPTION_BEL_RETURN_IGNORE_DESC: "King rentrera en Belgique sans attendre. Les grèves générales contre le roi seront ignorées."
 RULE_OPTION_BEL_RETURN_NEGOTIATE: "King Returns - Les grévistes sont négociés"
 RULE_OPTION_BEL_RETURN_NEGOTIATE_DESC: "King rentrera en Belgique sans attendre. Les grèves générales contre le roi seront négociées."
 BEL_1950_ELECTIONS_RULE: "@BEL Élections de 1950"
 RULE_OPTION_BEL_CSP_1950: "Victoire du CSP"
 RULE_OPTION_BEL_CSP_1950_DESC: "Le CSP remportera les élections. Pendant ce mandat, ils permettront au roi de reprendre ses fonctions ; et ils auront trois Premiers ministres distincts au cours de ce mandat."
 RULE_OPTION_BEL_BSP_1950: "Victoire du BSP"
 RULE_OPTION_BEL_BSP_1950_DESC: "Le BSP remportera les élections. Durant ce mandat, ils poursuivront leur politique anti-royaliste et mettront en oeuvre des politiques socialistes."
 #general strike rule
 BEL_1954_ELECTIONS_RULE: "@BEL Élections de 1954"
 RULE_OPTION_BEL_CSP_1954: "Victoire du CSP"
 RULE_OPTION_BEL_CSP_1954_DESC: "Le CSP remportera les élections. Durant ce mandat, ils feront face à la récession économique et se concentreront sur les liens avec l'Occident."
 RULE_OPTION_BEL_BSP_1954: "Victoire du BSP"
 RULE_OPTION_BEL_BSP_1954_DESC: "Le BSP remportera les élections. Durant ce mandat, ils appliqueront la politique sociale-démocrate."
 #school debate rule
 BEL_1958_ELECTIONS_RULE: "@BEL Élections de 1958"
 RULE_OPTION_BEL_CSP_1958: "Victoire du CSP"
 RULE_OPTION_BEL_CSP_1958_DESC: "Le CSP remportera les élections. Durant ce mandat, ils formeront une coalition avec le BSP, résolvant les problèmes sociaux."
 RULE_OPTION_BEL_BSP_1958: "Victoire du BSP"
 RULE_OPTION_BEL_BSP_1958_DESC: "Le BSP remportera les élections. Durant ce mandat, ils se concentreront davantage sur la situation au Congo."
 
 #WGR game rules
 WGR_1949_ELECTIONS: "@WGR Élections de 1949"
 WGR_1949_ELECTIONS_DESC: "Avec l'indépendance allemande restaurée ; les premières élections libres suscitent beaucoup d'attention tant au niveau national qu'international."
 RULE_OPTION_WGR_ADENEUER_1949_HISTORICAL: "Adeneuer élu - Tout va bien"
 RULE_OPTION_WGR_ADENEUER_1949_HISTORICAL_DESC: "Konrad Adeneuer sera élu. Il risque d'être victime d'un assassinat qui entraînera l'interdiction du Parti socialiste du Reich. \n§YC'est la voie historique.§!"
 RULE_OPTION_WGR_ADENEUER_1949_ASSASSINATED: "Adeneuer élu - assassiné"
 RULE_OPTION_WGR_ADENEUER_1949_ASSASSINATED_DESC: "Konrad Adeneuer sera élu. Plus tard, il sera assassiné, ce qui permettra une montée en puissance du parti socialiste du Reich."
 RULE_OPTION_WGR_SCHUMACHER_1949_RESIGNS: "Schumacher élu - Démission"
 RULE_OPTION_WGR_SCHUMACHER_1949_RESIGNS_DESC: "Kurt Schumacher sera élu. Il refusera de coopérer avec le KPD et démissionnera finalement en faveur d'Ollenhauer."
 RULE_OPTION_WGR_SCHUMACHER_1949_SOCIALIST_UNITY: "Schumacher élu - SED"
 RULE_OPTION_WGR_SCHUMACHER_1949_SOCIALIST_UNITY_DESC: "Kurt Schumacher sera élu. Il formera le SED ouest-allemand ; ce qui permettra §YUnification allemande§! sous un régime §Rsocialiste§!."
 WGR_1953_ELECTIONS: "@WGR Élections de 1953"
 WGR_1953_ELECTIONS_DESC: "§YRequiert :§! §RPAS§! Western SED \nLes deuxièmes élections générales auront lieu ; avec davantage d'accent sur la diplomatie. "
 RULE_OPTION_WGR_ADENEUER_1953: "Adeneuer élu"
 RULE_OPTION_WGR_ADENEUER_1953_DESC: "§YNécessite :§! Adeneuer vit \nKonrad Adeneuer sera élu. Durant ce mandat, il appliquera les théories du marché social.\n§YC'est la voie historique.§!"
 RULE_OPTION_WGR_OLLENHAUER_1953: "Ollenhauer élu"
 RULE_OPTION_WGR_OLLENHAUER_1953_DESC: "Erich Ollenhauer sera élu. Durant ce mandat, il nouera des liens avec les pays du bloc de l'Est."
 RULE_OPTION_WGR_REMER_1953: "Remer élu"
 RULE_OPTION_WGR_REMER_1953_DESC: "§YNécessite :§! Adeneuer est assassiné \nOtto Ernst Remer sera élu."
 WGR_1957_ELECTIONS: "@WGR Élections de 1957"
 RULE_OPTION_WGR_ADENEUER_1957_DROP_CLAIMS: "Adeneuer élu - Réclamations abandonnées"
 RULE_OPTION_WGR_ADENEUER_1957_DROP_CLAIMS_DESC: "§YNécessite :§! Adeneuer vit \nKonrad Adeneuer sera élu. Durant ce mandat, il reconnaîtra la perte des territoires de l'Est, rétablissant ainsi les liens avec la Pologne."
 RULE_OPTION_WGR_ADENEUER_1957_KEEP_CLAIMS: "Adeneuer élu - Réclamations maintenues"
 RULE_OPTION_WGR_ADENEUER_1957_KEEP_CLAIMS_DESC: "§YNécessite :§! Adeneuer vit \nKonrad Adeneuer sera élu. Durant ce mandat, il maintiendra les revendications dans les territoires de l'Est, créant des tensions."
 RULE_OPTION_WGR_OLLENHAUER_1957: "Ollenhauer élu"
 RULE_OPTION_WGR_OLLENHAUER_1957_DESC: "Erich Ollenhauer sera élu. Durant ce mandat, il proposera §YUnification allemande§! sous un régime §gneutre§!."
 WGR_NAVAL_REESTABLISHMENT: "@WGR [1950s] Rétablissement naval"
 RULE_OPTION_WGR_DEFENSIVE_NAVY: "Marine défensive"
 RULE_OPTION_WGR_DEFENSIVE_NAVY_DESC: "La Bundesmarine sera rétablie avec des doctrines défensives, utilisant des sous-marins et des destroyers."
 RULE_OPTION_WGR_NAVAL_SUPREMACY: "Marine de domination"
 RULE_OPTION_WGR_NAVAL_SUPREMACY_DESC: "La Bundesmarine sera rétablie avec des doctrines de haute mer, en se concentrant sur les navires capitaux."
 WGR_JOIN_NATO_AI: "@WGR £GFX_game_rule_flags_NATO Adhésion de l'Allemagne de l'Ouest à l'OTAN"
 RULE_OPTION_WGR_JOIN_NATO_SUCCESS: "L'Allemagne de l'Ouest devient membre de l'OTAN"
 RULE_OPTION_WGR_JOIN_NATO_SUCCESS_DESC: "Lorsqu'elle y sera invitée, l'Allemagne de l'Ouest rejoindra l'Organisation du Traité de l'Atlantique Nord en tant que membre."
 RULE_OPTION_WGR_JOIN_NATO_FAILURE: "L'Allemagne de l'Ouest reste en dehors de l'OTAN"
 RULE_OPTION_WGR_JOIN_NATO_FAILURE_DESC: "Lorsqu'elle sera invitée à l'Organisation du Traité de l'Atlantique Nord, l'Allemagne de l'Ouest déclinera et restera en dehors de l'organisation, même si elle peut rester alignée sur l'Occident."
 
 #DDR game rules
 DDR_EASTERN_CLAIMS: "£GFX_game_rule_flags_DDR   [1950s] Revendications orientales"
 RULE_OPTION_DDR_RENOUNCE_CLAIMS: "Renoncer aux réclamations"
 RULE_OPTION_DDR_RENOUNCE_CLAIMS_DESC: "Le gouvernement est-allemand reconnaîtra la perte des territoires de l'Est sous la Pologne et l'URSS ; mettre fin au débat.\n§YC'est la voie historique.§!"
 RULE_OPTION_DDR_DEMAND_CLAIMS: "Faire valoir des réclamations"
 RULE_OPTION_DDR_DEMAND_CLAIMS_DESC: "Le gouvernement est-allemand demandera aux Soviétiques la restitution des territoires allemands perdus sous la Pologne."
 DDR_POST_STALIN_ROUTE: "£GFX_game_rule_flags_DDR   [1950s] Suite du soulèvement de Berlin"
 RULE_OPTION_DDR_SECRETARY_RAU: "Secrétaire Rau"
 RULE_OPTION_DDR_SECRETARY_RAU_DESC: "Le secrétaire sortant Walter Ulbricht sera purgé et remplacé par Heinrich Rau. L'Allemagne de l'Est suivra désormais une politique révisionniste."
 RULE_OPTION_DDR_SECRETARY_ZAISSER: "Secrétaire Zaisser"
 RULE_OPTION_DDR_SECRETARY_ZAISSER_DESC: "Le secrétaire sortant Walter Ulbricht sera purgé et remplacé par Wilhelm Zaisser. L'Allemagne de l'Est suivra désormais une politique révisionniste."
 RULE_OPTION_DDR_SECRETARY_ULBRICHT: "Secrétaire Ulbricht"
 RULE_OPTION_DDR_SECRETARY_ULBRICHT_DESC: "Walter Ulbricht conservera son contrôle ; commettre une déstalinisation limitée tout en purgeant l'opposition proéminente au sein du parti. \n§YC'est la voie historique.§!"
 RULE_OPTION_DDR_SECRETARY_HARICH: "Secrétaire Harich"
 RULE_OPTION_DDR_SECRETARY_HARICH_DESC: "Wolfgang Harich et son « Groupe Harich » reprendront SED. Ils libéraliseront largement l'Allemagne de l'Est, créant ainsi une chance pour une unification allemande §Y§! sous un régime §Clibéral§!."
 
 #YUG game rules
 YUG_DJILAS_PRESIDENCY: "@YUG [1950s] Présidence Djilas"
 RULE_OPTION_YUG_DJILAS_CRITIQUE_ACCEPTED: "Tito accepte les critiques de Djilas"
 RULE_OPTION_YUG_DJILAS_CRITIQUE_ACCEPTED_DESC: "Tito sera aux côtés de Djilas. Les réformes suivantes libéraliseront la Yougoslavie avec une approche plus occidentale."
 RULE_OPTION_YUG_DJILAS_PURGED: "Tito purge les critiques de Djilas"
 RULE_OPTION_YUG_DJILAS_PURGED_DESC: "Tito rejettera la critique de Djias. Il purgera le président Djilas et maintiendra la neutralité pro-orientale actuelle.\n§YC'est la voie historique.§!"
 
 #ALB game rules
 ALB_POST_STALIN_COURSE: "@ALB [1950s] Troisième congrès du Parti du Travail"
 RULE_OPTION_ALB_HOXHA_STAYS: "Séjours Hoxha"
 RULE_OPTION_ALB_HOXHA_STAYS_DESC: "Les partisans d'Enver Hoxha occupant davantage de postes au sein du parti, Hoxha conservera son emprise ; et purgera toute trace de révisionnisme. L'Albanie se dirigera vers le maoïsme. \n§YC'est la voie historique.§!"
 RULE_OPTION_ALB_HOXHA_PURGED: "Xoce réhabilité"
 RULE_OPTION_ALB_HOXHA_PURGED_DESC: "Koci Xoce sera réhabilité à titre posthume. S'en suivra la purge d'Enver Hoxha et la nomination de Liri Belishova au poste de secrétaire générale. L'Albanie restera dans la sphère soviétique."
 
 #BUL game rules
 BUL_POST_STALINIST_COURSE: "@BUL [1950s] Cours post-Staline"
 RULE_OPTION_BUL_CHERVENKOV: "Anti-révisionnisme"
 RULE_OPTION_BUL_CHERVENKOV_DESC: "Valko Chervenkov assumera la direction du pays après la purge de Yougov et Zhivkov. Il suivra l'anti-révisionnisme, élargissant ses liens avec Hoxha et Mao."
 RULE_OPTION_BUL_YUGOV: "Ligne soviétique"
 RULE_OPTION_BUL_YUGOV_DESC: "Anton Yugov assumera la direction du pays avec le soutien soviétique. Il approfondira les liens avec l'Union soviétique. \n§YC'est la voie historique.§!"
 
 #ROM game rules
 ROM_POLITICAL_INFIGHTING: "@ROM [1950s] Luttes politiques internes"
 RULE_OPTION_ROM_PURGE_MUSCOVITES: "Purger les Moscovites"
 RULE_OPTION_ROM_PURGE_MUSCOVITES_DESC: "Gheorghe Gheorghiu-Dej mettra sur la touche et purgera la faction moscovite ; maintenir l'oppression de l'État. \n§YC'est la voie historique.§!"
 RULE_OPTION_ROM_PURGE_SECRETARY: "Purger Gheorghiu-Dej"
 RULE_OPTION_ROM_PURGE_SECRETARY_DESC: "La faction moscovite renversera Gheorghe Gheorghiu-Dej. Ana Pauker assumera la direction ; adopter une approche plus libertaire et pluraliste."
 ROM_POST_STALINIST_COURSE: "@ROM [1950s] Cours post-Staline"
 RULE_OPTION_ROM_DESOVIETIZATION: "Le leadership tient"
 RULE_OPTION_ROM_DESOVIETIZATION_DESC: "Les dirigeants actuels conserveront leur leadership. Ils adopteront une approche plus indépendante des Soviétiques. \n§YC'est la voie historique.§!"
 RULE_OPTION_ROM_DESTALINIZATION: "Déstalinisation roumaine"
 RULE_OPTION_ROM_DESTALINIZATION_DESC: "Miron Constantinescu assumera la direction. Il adoptera une position révisionniste et approfondira les liens avec l'Union soviétique."
 
 #HUN game rules
 HUN_HUNGARIAN_REVOLUTION: "@HUN [1950s] Révolution hongroise"
 HUN_HUNGARIAN_REVOLUTION_DESC: "À l'instar du libertarisme polonais et de la neutralité autrichienne, la Hongrie tentera de s'éloigner du communisme."
 RULE_OPTION_HUN_REVOLUTION_SUCCESSFUL: "@HUN Révolution réussie"
 RULE_OPTION_HUN_REVOLUTION_SUCCESSFUL_DESC: "La Hongrie se séparera du bloc de l'Est et déclarera sa neutralité. Ils établiront une démocratie titiste."
 RULE_OPTION_HUN_REVOLUTION_CRUSHED: "@SOV Révolution écrasée"
 RULE_OPTION_HUN_REVOLUTION_CRUSHED_DESC: "L'Union soviétique rétablira l'ordre ; permettant le retour de Janos Kadar. La Hongrie suivra une ligne dure. \n§YC'est la voie historique.§!"
 
 #CZE game rules
 CZE_PRESIDIUM_ESTABLISHMENT: "@CZE [1950s] Création du Présidium"
 RULE_OPTION_CZE_GOTTWALD_PURGED: "Gottwald est purgé"
 RULE_OPTION_CZE_GOTTWALD_PURGED_DESC: "Klement Gottwald sera purgé. Rudolf Slansky assumera la direction de la Tchécoslovaquie et ouvrira l'économie."
 RULE_OPTION_CZE_SLANSKY_TRIALS: "Essais Slansky"
 RULE_OPTION_CZE_SLANSKY_TRIALS_DESC: "Rudolf Slansky sera jugé et purgé. Le statu quo perdurera. \n§YC'est la voie historique.§!"
 CZE_POST_STALIN_COURSE: "@CZE [1950s] Cours post-Staline"
 RULE_OPTION_CZE_SECRETARY_HUSAK: "Secrétaire général Husak"
 RULE_OPTION_CZE_SECRETARY_HUSAK_DESC: "Gustav Husak sera nommé secrétaire général. Il mettra en place une libéralisation modérée, tout en restant dans la sphère soviétique. \nSi Gottwald était purgé ; La Tchécoslovaquie adoptera la déstalinisation."
 RULE_OPTION_CZE_SECRETARY_NOVOTNY: "Secrétaire général Novotny"
 RULE_OPTION_CZE_SECRETARY_NOVOTNY_DESC: "Antonin Novotny sera nommé secrétaire général. Il poursuivra la politique stalinienne ; chemin continu de Gottwald. \nSi Gottwald était purgé ; La Tchécoslovaquie adoptera la déstalinisation. \n§YC'est la voie historique.§!"
 
 #POL game rules
 POL_POLISH_OCTOBER: "@POL [1950s] Octobre polonais"
 RULE_OPTION_POL_APPOINT_GOMULKA: "Secrétaire Gomulka"
 RULE_OPTION_POL_APPOINT_GOMULKA_DESC: "Wladislaw Gomulka en assumera la direction. Il instaurera une liberté politique limitée ; et faciliter les liens avec le bloc occidental tout en préservant les relations soviétiques intactes. \n§YC'est la voie historique.§!"
 RULE_OPTION_POL_APPOINT_ZAWADZKI: "Secrétaire Zawadzki"
 RULE_OPTION_POL_APPOINT_ZAWADZKI_DESC: "Aleksander Zawadzki en assumera la direction. Il écrasera l'opposition, arrêtera Gomulka une seconde fois et ramènera la politique stalinienne."
 
 #SWE game rules
 SWE_1952_ELECTIONS: "@SWE Élections de 1952"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1952: "Victoire SAP"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1952_DESC: "Les sociaux-démocrates remporteront les élections. Durant ce mandat, ils mettront en oeuvre des politiques sociales. \n§YC'est la voie historique.§!"
 RULE_OPTION_SWE_COALITION_VICTORY_1952: "Victoire de la Coalition"
 RULE_OPTION_SWE_COALITION_VICTORY_1952_DESC: "La coalition Borgerliga Partierna remportera les élections. Durant ce mandat, ils mettront en oeuvre des politiques libérales."
 SWE_1956_ELECTIONS: "@SWE Élections de 1956"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1956: "Victoire SAP"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1956_DESC: "Les sociaux-démocrates remporteront les élections. \n§YC'est la voie historique.§!"
 RULE_OPTION_SWE_COALITION_VICTORY_1956: "Victoire de la Coalition"
 RULE_OPTION_SWE_COALITION_VICTORY_1956_DESC: "La coalition Borgerliga Partierna remportera les élections."
 SWE_1958_ELECTIONS: "@SWE Élections de 1958"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1958: "Victoire SAP"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1958_DESC: "Les sociaux-démocrates remporteront les élections. \n§YC'est la voie historique.§!"
 RULE_OPTION_SWE_COALITION_VICTORY_1958: "Victoire de la Coalition"
 RULE_OPTION_SWE_COALITION_VICTORY_1958_DESC: "La coalition Borgerliga Partierna remportera les élections."
 SWE_NUCLEAR_QUESTION_50: "@SWE [1950s] Question nucléaire"
 RULE_OPTION_SWE_SWEDISH_NUKES: "Armes nucléaires suédoises"
 RULE_OPTION_SWE_SWEDISH_NUKES_DESC: "Le programme nucléaire suédois se poursuivra. \n§YC'est la voie historique.§!"
 RULE_OPTION_SWE_AMERICAN_NUKES: "Armes nucléaires américaines"
 RULE_OPTION_SWE_AMERICAN_NUKES_DESC: "Le programme nucléaire suédois bénéficiera du soutien et de l'alignement des États-Unis."
 RULE_OPTION_SWE_TERMINATE_NUCLEAR_PROGRAM: "Fin du programme nucléaire"
 RULE_OPTION_SWE_TERMINATE_NUCLEAR_PROGRAM_DESC: "Le programme nucléaire suédois prendra fin. Ils suggéreront la non-prolifération."
 
 #FIN game rules
 FIN_1950_ELECTIONS: "@FIN Élections de 1950"
 RULE_OPTION_FIN_PAASIKIVI_1950: "Paasikivi élu"
 RULE_OPTION_FIN_PAASIKIVI_1950_DESC: "Juho Kusti Paasikivi remportera les élections. \n§YC'est la voie historique.§!"
 RULE_OPTION_FIN_PEKKALA_KUUSINEN: "Pekkala élu - Succession de Kuusinen"
 RULE_OPTION_FIN_PEKKALA_KUUSINEN_DESC: "Mauno Pekkala remportera les élections. Kuusinen lui succédera après sa mort ; qui travaillera avec les Soviétiques."
 RULE_OPTION_FIN_PEKKALA_KILPI: "Pekkala élu - Succession de Kilpi"
 RULE_OPTION_FIN_PEKKALA_KILPI_DESC: "Mauna Pekkala remportera les élections. Kilpi lui succédera après sa mort."
 FIN_1956_ELECTIONS: "@FIN Élections de 1956"
 RULE_OPTION_FIN_KEKKONEN_1956: "Kekkonen élu"
 RULE_OPTION_FIN_KEKKONEN_1956_DESC: "Urho Kekkonen remportera les élections. Durant ce mandat, il se concentrera sur le développement économique. \n§YC'est la voie historique.§!"
 RULE_OPTION_FIN_FAGERHOLM_1956: "Fagerholm élu"
 RULE_OPTION_FIN_FAGERHOLM_1956_DESC: "Karl-August Fagerholm remportera les élections. Durant ce mandat, il se concentrera sur l'ambiance politique ; majoritairement pro-occidentaux."
 RULE_OPTION_FIN_PAASIKIVI_KUUSINEN: "Paasikivi élu - Succession de Kuusinen"
 RULE_OPTION_FIN_PAASIKIVI_KUUSINEN_DESC: "§YNécessite :§! Kuusinen a réussi Pekkala\nJuho Kusti Paasikivi remportera les élections. Kuusinen lui succédera après sa mort ; qui suivra un cours de gauche."
 RULE_OPTION_FIN_PAASIKIVI_KEKKONEN: "Paasikivi élu - Succession de Kekkonen"
 RULE_OPTION_FIN_PAASIKIVI_KEKKONEN_DESC: "Juho Kusti Paasikivi remportera les élections. Après sa mort, Kekkonen lui succédera et se concentrera sur le développement économique."
 FIN_RETURN_OF_PORKKALA: "@FIN @SOV [1950s] Retour de la base de Porkkala"
 RULE_OPTION_FIN_PORKKALA_RETURNED: "@FIN Porkkala est revenu"
 RULE_OPTION_FIN_PORKKALA_RETURNED_DESC: "L'Union soviétique laissera la base de Porkkala à la Finlande. \n§YC'est la voie historique.§!"
 RULE_OPTION_FIN_PORKKALA_KEPT: "@SOV Porkkala gardé"
 RULE_OPTION_FIN_PORKKALA_KEPT_DESC: "L'Union soviétique conservera la base de Porkkala."
 
 #ETR game rules
 ETR_GOVERNANCE: "@SIK [1950s] Le cours du Turkestan oriental"
 ETR_GOVERNANCE_DESC: "La Deuxième République du Turkestan oriental existe depuis la reprise de la guerre civile chinoise ; mais à mesure que les parties décident de leur sort, le sort du Turkestan oriental est également décidé."
 RULE_OPTION_ETR_JOIN_PRC: "@PRC Rejoindre la République populaire de Chine"
 RULE_OPTION_ETR_JOIN_PRC_DESC: "Alors que les communistes avancent sur la Chine ; le gouvernement ouïghour rejoindra la République populaire. \n§YC'est la voie historique.§!"
 RULE_OPTION_ETR_COMMUNIST_INDEPENDENCE: "@SIK Communisme indépendant"
 RULE_OPTION_ETR_COMMUNIST_INDEPENDENCE_DESC: "Ehmetjan Qasim gardera le contrôle et maintiendra l'indépendance du Turkestan oriental."
 RULE_OPTION_ETR_KMT_YULBARS: "@CHI Yulbars Khan prend le contrôle"
 RULE_OPTION_ETR_KMT_YULBARS_DESC: "Yulbars Khan prendra le contrôle du pays. Avec les communistes prenant le contrôle de la Chine ; Yulbars transformera le Xinjiang en un gouvernorat républicain."
 RULE_OPTION_ETR_KMT_REVCOM: "@CHI Leadership du comité révolutionnaire"
 RULE_OPTION_ETR_KMT_REVCOM_DESC: "Le Comité révolutionnaire du Kuomintang chinois prendra le relais. En tant qu'aile gauche du Kuomintang ; ils affirmeront leur indépendance contre le Parti communiste ; mais ils n'aiment pas non plus le courant dominant du Kuomintang."
 RULE_OPTION_ETR_ISLAMIST: "@SAU Prise de contrôle islamiste"
 RULE_OPTION_ETR_ISLAMIST_DESC: "Elihan Tore assumera la direction. Il mettra en oeuvre des politiques islamistes avec la charia au Turkestan oriental."
 
 #MON game rules
 MON_SINO_MONGOLIAN_NEGOTIATIONS: "@MON @PRC [1950s] Négociations sino-mongoles"
 MON_SINO_MONGOLIAN_NEGOTIATIONS_DESC: "Avec deux nations sous le communisme ; une négociation importante pourrait avoir lieu."
 RULE_OPTION_MON_JOIN_PRC: "@PRC Rejoindre la République populaire de Chine"
 RULE_OPTION_MON_JOIN_PRC_DESC: "Parce que la demande mongole d'adhésion à l'URSS est rejetée ; une même offre sera faite à PRC ; qui sera accepté."
 RULE_OPTION_MON_INNER_MONGOLIA: "@MEN Contre-offre de la Mongolie intérieure"
 RULE_OPTION_MON_INNER_MONGOLIA_DESC: "Au lieu que la Mongolie rejoigne la Chine ; La Chine transférera la Mongolie intérieure à la République mongole."
 RULE_OPTION_MON_NEGOTIATIONS_FAIL: "@MON Les négociations échouent"
 RULE_OPTION_MON_NEGOTIATIONS_FAIL_DESC: "Les négociations ne donneront aucun résultat. Cela conduira la politique mongole à se défendre contre la Chine."
 MON_DESTALINIZATION_IN_MONGOLIA: "@MON [1950s] Déstalinisation en Mongolie"
 MON_DESTALINIZATION_IN_MONGOLIA_DESC: "La mort de Staline a également eu des conséquences en Mongolie. Malgré le décès de Choibalsan ; L'influence de Staline est encore profonde en Mongolie, ce qui fait l'objet d'un débat politique."
 RULE_OPTION_MON_DAMBA_PURGED: "Damba purgé"
 RULE_OPTION_MON_DAMBA_PURGED_DESC: "Yumjaagiin Tsedenbal purgera Dashiin Damba. Tsedenbal préservera le statu quo, avec un alignement pro-soviétique.\n§YC'est la voie historique.§!"
 RULE_OPTION_MON_TSEDENBAL_PURGED: "Tsedenbal purgé"
 RULE_OPTION_MON_TSEDENBAL_PURGED_DESC: "Dashiin Damba déposera Yumjaagiin Tsedenbal. Damba fera progresser la déstalinisation et favorisera l'indépendance géopolitique entre les Soviétiques et la Chine."
 
 #KOR/KPA game rules
 KOR_KOREAN_WAR: "@KOR @KPA Guerre de Corée"
 KOR_KOREAN_WAR_DESC: "Avec l'approbation de Moscou et de Pékin ; La Corée du Nord a lancé une invasion surprise vers le Sud. Cette guerre fera pencher la balance en Asie et sera donc aussi importante que la guerre civile chinoise et la guerre d'Indochine."
 RULE_OPTION_KOR_TOTAL_NORTH_VICTORY: "@KPA Victoire totale du Nord"
 RULE_OPTION_KOR_TOTAL_NORTH_VICTORY_DESC: "La Corée du Nord va submerger les forces du Sud ; et écrasera le Sud ; unifiant la péninsule. \nCe résultat permettra à un PCC §Rvaincu§! de lancer une invasion §Y§! sur le KMT §Bvictorieux§!."
 RULE_OPTION_KOR_CEASEFIRE: "@KOR @KPA Cessez-le-feu"
 RULE_OPTION_KOR_CEASEFIRE_DESC: "En raison de l'incapacité des participants à établir la suprématie ; La guerre de Corée se terminera par un cessez-le-feu ; avec seulement de légers changements de bordure.\n§YC'est la voie historique.§!"
 RULE_OPTION_KOR_TOTAL_SOUTH_VICTORY: "@KOR Victoire totale du Sud"
 RULE_OPTION_KOR_TOTAL_SOUTH_VICTORY_DESC: "La Corée du Nord échouera complètement à avancer ; et leur échec permettra aux forces du Sud de se déplacer sans opposition ; unifiant la péninsule."
 KPA_AUGUST_FACTION_INCIDENT: "@KPA [1950s] Incident de faction en août"
 KPA_AUGUST_FACTION_INCIDENT_DESC: "Avec Kim Il-sung persistant dans sa voie du Juche et du stalinisme ; un petit groupe de conspirateurs complote pour renverser Kim."
 RULE_OPTION_KPA_ARDUOUS_MARCH: "La deuxième marche ardue"
 RULE_OPTION_KPA_ARDUOUS_MARCH_DESC: "Les conspirateurs échoueront. Kim consolidera son emprise sur le parti et sur l'État ; tout en purgeant les influences et les alignements soviétiques et chinois.\n§YC'est la voie historique.§!"
 RULE_OPTION_KPA_KIM_PURGED: "Kim déposée"
 RULE_OPTION_KPA_KIM_PURGED_DESC: "Kim Il-sung sera destitué. Choe Chang-ik assumera la direction de la RPDC ; purger le Juche et ses partisans tout en suivant la déstalinisation."
 KOR_1952_ELECTIONS: "@KOR Élections de 1952"
 KOR_1952_ELECTIONS_DESC: "Avec des souvenirs frais de la guerre; les élections de 1952 seront certainement importantes pour la Corée, tout comme la guerre les a rendues très importantes pour l'avenir de la Corée."
 RULE_OPTION_KOR_RHEE_1952: "Syngman Rhee"
 RULE_OPTION_KOR_RHEE_1952_DESC: "Syngman Rhee sera réélu. Durant ce mandat, il poursuivra sa dictature pro-américaine, suivant l'ilminisme et supprimant le gauchisme.\n§YC'est la voie historique.§!"
 RULE_OPTION_KOR_CHONG_1952: "Chong Bong-am"
 RULE_OPTION_KOR_CHONG_1952_DESC: "Chong Bong-am sera élu. Au cours de ce mandat, il mettra en place des politiques plus démocratiques et mettra fin à la répression contre les gauchistes."
 RULE_OPTION_KOR_YI_1952: "Yi Si Yeong"
 RULE_OPTION_KOR_YI_1952_DESC: "Yi Si Yeong sera élu. Durant ce mandat, il suivra un cursus plus traditionaliste ; restaurer la monarchie coréenne."
 KOR_1956_ELECTIONS: "@KOR Élections de 1956"
 RULE_OPTION_KOR_RHEE_1956: "Syngman Rhee"
 RULE_OPTION_KOR_RHEE_1956_DESC: "Syngman Rhee sera élu. Durant ce mandat, il utilisera des méthodes autoritaires qui terniront la démocratie.\n§YC'est la voie historique.§!"
 RULE_OPTION_KOR_CHONG_1956: "Chong Bong-am"
 RULE_OPTION_KOR_CHONG_1956_DESC: "Chong Bong-am sera élu. Au cours de ce mandat, il mettra en place des programmes sociaux et tentera de négocier pour §Yl'unification coréenne§!."
 RULE_OPTION_KOR_CHANG_1956: "Chang Myon"
 RULE_OPTION_KOR_CHANG_1956_DESC: "Chang Myon sera élu. Durant ce mandat, il suivra une orientation modérée et centriste, s'éloignant de l'héritage de Rhee."
 
 #JAP game rules
 JAP_REESTABLISHMENT: "@JAP [1950s] Rétablissement japonais"
 JAP_REESTABLISHMENT_DESC: "L'occupation américaine est terminée ; mais c'est le mode d'établissement qui compte pour le Japon"
 RULE_OPTION_JAP_SAN_FRANCISCO: "£GFX_game_rule_flags_JAP Traité de San Francisco"
 RULE_OPTION_JAP_SAN_FRANCISCO_DESC: "L'occupation américaine prendra fin avec la signature par la délégation japonaise du Traité de San Francisco ; restaurer l'indépendance japonaise mais avec le désarmement.\n§YC'est la voie historique.§!"
 RULE_OPTION_JAP_EMPIRE: "£GFX_game_rule_flags_JAP_fascism Le retour de l'Empire"
 RULE_OPTION_JAP_EMPIRE_DESC: "Un complot nationaliste mènera à un coup d'État. L'ancien régime reviendra avec la plupart de ses politiques ; cependant, le résultat final sera la démocratie."
 JAP_1952_ELECTIONS: "£GFX_game_rule_flags_JAP Élections de 1952"
 JAP_1952_ELECTIONS_DESC: "Les premières élections libres depuis l'ancien régime auront lieu alors que l'indépendance japonaise sera rétablie."
 RULE_OPTION_JAP_COMMUNIST_1952: "Victoire du PCJ"
 RULE_OPTION_JAP_COMMUNIST_1952_DESC: "Le Parti communiste japonais remportera les élections. Durant ce mandat, ils forceront l'empereur Hirohito à se retirer en faveur d'Akihito ; tout en gardant intacte la monarchie constitutionnelle."
 RULE_OPTION_JAP_SOCIALIST_LEFT_1952: "Victoire socialiste de la gauche"
 RULE_OPTION_JAP_SOCIALIST_LEFT_1952_DESC: "Le Parti Socialiste de Gauche remportera les élections. Durant ce mandat, ils établiront des liens avec les Soviétiques."
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1952: "Victoire socialiste de droite"
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1952_DESC: "Le Parti socialiste de droite remportera les élections. Durant ce mandat, ils approfondiront leurs liens avec les Américains."
 RULE_OPTION_JAP_LIBERAL_1952: "Victoire libérale"
 RULE_OPTION_JAP_LIBERAL_1952_DESC: "Le Parti libéral remportera les élections. Durant ce mandat ils mettront en oeuvre les principes de son leader ; Shigeru Yoshida.\n§YC'est la voie historique.§!"
 RULE_OPTION_JAP_KASHINTO_1952: "Victoire Kashintô"
 RULE_OPTION_JAP_KASHINTO_1952_DESC: "Kashinto remportera les élections. Durant cette période, ils commenceront à se réarmer."
 JAP_1953_ELECTIONS: "£GFX_game_rule_flags_JAP Élections de 1953"
 RULE_OPTION_JAP_COMMUNIST_1953: "Victoire du PCJ"
 RULE_OPTION_JAP_COMMUNIST_1953_DESC: "Le Parti communiste japonais remportera les élections. Durant ce mandat, ils forceront l'empereur Hirohito à se retirer en faveur d'Akihito ; tout en gardant intacte la monarchie constitutionnelle."
 RULE_OPTION_JAP_SOCIALIST_LEFT_1953: "Victoire socialiste de la gauche"
 RULE_OPTION_JAP_SOCIALIST_LEFT_1953_DESC: "Le Parti Socialiste de Gauche remportera les élections. Durant ce mandat, ils établiront des liens avec les Soviétiques."
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1953: "Victoire socialiste de droite"
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1953_DESC: "Le Parti socialiste de droite remportera les élections. Durant ce mandat, ils approfondiront leurs liens avec les Américains."
 RULE_OPTION_JAP_LIBERAL_1953: "Victoire libérale"
 RULE_OPTION_JAP_LIBERAL_1953_DESC: "Le Parti libéral remportera les élections. Durant ce mandat ils mettront en oeuvre les principes de son leader ; Shigeru Yoshida.\n§YC'est la voie historique.§!"
 RULE_OPTION_JAP_KASHINTO_1953: "Victoire Kashintô"
 RULE_OPTION_JAP_KASHINTO_1953_DESC: "Kashinto remportera les élections. Durant cette période, ils commenceront à se réarmer."
 JAP_1955_ELECTIONS: "£GFX_game_rule_flags_JAP Élections de 1955"
 RULE_OPTION_JAP_COMMUNIST_1955: "Victoire du PCJ"
 RULE_OPTION_JAP_COMMUNIST_1955_DESC: "Le Parti communiste japonais remportera les élections."
 RULE_OPTION_JAP_SOCIALIST_1955: "Victoire socialiste"
 RULE_OPTION_JAP_SOCIALIST_1955_DESC: "Le Parti Socialiste remportera les élections."
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_1955: "Victoire des libéraux-démocrates"
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_1955_DESC: "Le Parti libéral-démocrate remportera les élections."
 JAP_1958_ELECTIONS: "£GFX_game_rule_flags_JAP Élections de 1958"
 RULE_OPTION_JAP_COMMUNIST_1958: "Victoire du PCJ"
 RULE_OPTION_JAP_COMMUNIST_1958_DESC: "Le Parti communiste japonais remportera les élections."
 RULE_OPTION_JAP_SOCIALIST_1958: "Victoire socialiste"
 RULE_OPTION_JAP_SOCIALIST_1958_DESC: "Le Parti Socialiste remportera les élections."
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_ISHIBASHI_1958: "Victoire du LDP - Ishibashi reste"
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_ISHIBASHI_1958_DESC: "Le Parti libéral-démocrate remportera les élections. Le Premier ministre Ishibashi conservera son poste."
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_KISHI_1958: "Victoire du LDP - Kishi assume le poste de Premier ministre"
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_KISHI_1958_DESC: "Le Parti libéral-démocrate remportera les élections. Plus tard, Kishi Nobusuke deviendra Premier ministre. \n§YC'est la voie historique.§!"
 
 #VIN game rules:
 VIN_STALINIST_COUP: "@VIN [1950s] Coup d'État stalinien"
 VIN_STALINIST_COUP_DESC: "Contrôle quel camp un Nord-Vietnam contrôlé par §YAI§! prend dans la lutte entre Ho Chi Minh et §Yla faction stalinienne§! de Tran Ngoc Danh. Un joueur humain §Y§! n'est jamais restreint. Ce paramètre s'applique que les focus historiques soient activés ou désactivés.\n\nUne Union soviétique IA répond toujours à Danh par des chiffres : elle envoie de l'aide à §Y50§! Faveur soviétique et approuve le coup d'État à §Y85§!."
 RULE_OPTION_VIN_AI_STALINIST_COUP_NEVER: "Jamais"
 RULE_OPTION_VIN_AI_STALINIST_COUP_NEVER_DESC: "Une IA Nord-Vietnam §Rne§! se range jamais du côté de Danh, et sa propre tentative contre une IA Ho échoue toujours."
 RULE_OPTION_VIN_AI_STALINIST_COUP_MAY: "Peut arriver"
 RULE_OPTION_VIN_AI_STALINIST_COUP_MAY_DESC: "Une IA du Nord-Vietnam pourrait se ranger du côté de Danh. Quoi qu'il en soit, le résultat dépend du soutien du Parti et de la faveur soviétique à la fin du compte à rebours."
 RULE_OPTION_VIN_AI_STALINIST_COUP_GUARANTEED: "Garanti"
 RULE_OPTION_VIN_AI_STALINIST_COUP_GUARANTEED_DESC: "Une IA Nord-Vietnam §Rtoujours§! se range du côté de Danh, et son coup d'État réussit toujours."
 
 #VIE game rules:
 VIE_FRENCH_COUP: "@VIE [1950s] Coup d'État français"
 VIE_FRENCH_COUP_DESC: "Contrôle la façon dont le §YCoup d'État français§! affecte un Sud-Vietnam §Ycontrôlé par l'IA§!. Un joueur humain §Y§! fait toujours face au coup normalement, quel que soit ce paramètre.\n\nPar défaut, l'IA conserve une influence pro-française naturelle et fluctuante, mais reste à l'écart du seuil du coup d'État, de sorte qu'elle ne se perdra pas à plusieurs reprises dans le coup d'État."
 RULE_OPTION_VIE_AI_COUP_PROTECTED: "Par défaut"
 RULE_OPTION_VIE_AI_COUP_PROTECTED_DESC: "L'IA conserve une influence pro-française naturelle et fluctuante de §Y§!, mais un plancher souple maintient §Gd'influence française§! en toute sécurité au-dessus du seuil du coup d'État. Le coup d'État §Yn'aura pas lieu§!."
 RULE_OPTION_VIE_AI_COUP_EXEMPT: "Jamais"
 RULE_OPTION_VIE_AI_COUP_EXEMPT_DESC: "L'IA est §Ytotalement exemptée§! du coup d'État français. Son influence reste intacte et le coup d'État ne pourra §Rjamais§! éclater."
 RULE_OPTION_VIE_AI_COUP_MAY: "Peut arriver"
 RULE_OPTION_VIE_AI_COUP_MAY_DESC: "L'IA est laissée à elle-même. Si §GInfluence française§! tombe trop bas, le coup §Ypeut déclencher§!."
 RULE_OPTION_VIE_AI_COUP_GUARANTEED: "Garanti"
 RULE_OPTION_VIE_AI_COUP_GUARANTEED_DESC: "§GL'influence française§! diminue au fil du temps, donc le coup d'État français est §Rforcé§! sur l'IA. §YRemarque :§! nécessite toujours qu'un putschiste (Leroy ou Hinh) soit présent et que le traité de Matignon n'ait pas été signé."

 VIE_AI_PM_SELECTION: "@VIE [1950s] Sélection du Premier ministre"
 VIE_AI_PM_SELECTION_DESC: "Contrôles §Yque§! Premier ministre et §YSud-Vietnam contrôlé par l'IA§! nomme à partir de l'arbre Bao-Dai - la §Yligne historique§! (§CLong -> Huu -> Tam -> Loc§!) ou les §Ycandidats alternatifs§! (§CVinh -> Toan -> Quang§!)."
 RULE_OPTION_VIE_AI_PMSEL_DEFAULT: "Par défaut"
 RULE_OPTION_VIE_AI_PMSEL_DEFAULT_DESC: "L'IA suit le paramètre §Yde mise au point historique§!. Avec §Gles focus historiques sur§! il nomme la ligne historique §Y§! (Long, Huu, Tam, Loc). Une fois l'accent historique mis de côté, il peut se diriger vers les §Ycandidats alternatifs§!."
 RULE_OPTION_VIE_AI_PMSEL_HISTORICAL: "Ligne historique"
 RULE_OPTION_VIE_AI_PMSEL_HISTORICAL_DESC: "L'IA nomme toujours les §Yhistoriques§! Premiers ministres (§CLong -> Huu -> Tam -> Loc§!), quel que soit le paramètre d'orientation historique."
 RULE_OPTION_VIE_AI_PMSEL_ALTERNATE: "Candidats suppléants"
 RULE_OPTION_VIE_AI_PMSEL_ALTERNATE_DESC: "L'IA se branche toujours vers les §Ysuppléants§! Premiers ministres (§CVinh -> Toan -> Quang§!), quel que soit le paramètre d'orientation historique."

 VIE_AI_PM_OUTCOME: "@VIE [1950s] Lutte du Premier ministre"
 VIE_AI_PM_OUTCOME_DESC: "Décide §Yquel Premier ministre du Sud-Vietnam contrôlé par l'IA conservera finalement§! le long de la ligne historique."
 RULE_OPTION_VIE_AI_PM_DEFAULT: "Par défaut"
 RULE_OPTION_VIE_AI_PM_DEFAULT_DESC: "Aucun PM n'est enraciné. Chaque PM §Yse retire à son tour§!, donc la succession tourne à travers la ligne historique §Y§!."
 RULE_OPTION_VIE_AI_PM_LONG: "Retranchement long"
 RULE_OPTION_VIE_AI_PM_LONG_DESC: "L'IA conserve §CNguyen-Phan-Long§! comme Premier ministre. Il §Ygagne les Français et reste§! donc la succession s'arrête avec lui et §CHuu, Tam et Loc ne sont jamais nommés§!."
 RULE_OPTION_VIE_AI_PM_HUU: "Retrancher Huu"
 RULE_OPTION_VIE_AI_PM_HUU_DESC: "L'IA retire §CLong§! comme prévu, puis conserve §CTran-Van-Huu§!. Il §Yl'emporte sur les Français et reste§! donc la succession s'arrête avec lui et §CTam et Loc ne sont jamais nommés§!."

 VIE_AI_CUONG_DE_TAKEOVER: "@VIE [1950s] Prise de contrôle de Cuong-De"
 VIE_AI_CUONG_DE_TAKEOVER_DESC: "Contrôle la lutte d'ouverture §Y§! entre §CBao-Dai§! et le prétendant de retour §CPrince Cuong-De§! pour un §YSud-Vietnam contrôlé par l'IA§!. "
 RULE_OPTION_VIE_AI_CD_DEFAULT: "Par défaut"
 RULE_OPTION_VIE_AI_CD_DEFAULT_DESC: "L'IA suit le paramètre §Yde mise au point historique§!. Avec §Gl'historique se concentre sur§!, il soutient §CBao-Dai§! et la faction §CCuong-De perd§!. Une fois l'accent historique mis de côté, il se peut que §Yse range du côté de Cuong-De§! et le pousse vers une prise de contrôle."
 RULE_OPTION_VIE_AI_CD_HISTORICAL: "Forcer Bao-Dai"
 RULE_OPTION_VIE_AI_CD_HISTORICAL_DESC: "L'IA est toujours §Ydu côté de Bao-Dai§! lors de l'événement d'ouverture et mène la lutte afin que la faction §CCuong-De perde§!, quel que soit le contexte historique."
 RULE_OPTION_VIE_AI_CD_CHALLENGER: "Force Cuong-De"
 RULE_OPTION_VIE_AI_CD_CHALLENGER_DESC: "L'IA §Yse range toujours du côté de Cuong-De§! lors de l'événement d'ouverture et mène la lutte vers une victoire de §CCuong-De§!."

 VIE_AI_CUONG_DE_SUCCESSOR: "@VIE [1950s] Succession Cuong-De"
 VIE_AI_CUONG_DE_SUCCESSOR_DESC: "Une fois que le §CPrince Cuong-De§! a pris le trône et meurt plus tard, un Sud-Vietnam §Ycontrôlé par l'IA§! doit choisir son §Ysuccesseur§!."
 RULE_OPTION_VIE_AI_CDS_DEFAULT: "Par défaut"
 RULE_OPTION_VIE_AI_CDS_DEFAULT_DESC: "L'IA doit §Ychoisir librement§! parmi les quatre successeurs."
 RULE_OPTION_VIE_AI_CDS_NHIEP: "Nguyen-Rinh-Nhiep"
 RULE_OPTION_VIE_AI_CDS_NHIEP_DESC: "L'IA installe §CNguyen-Rinh-Nhiep§!, poursuivant le modèle dynastique §YDan-Vuong§!."
 RULE_OPTION_VIE_AI_CDS_DIEM: "Ngo-Dinh-Diem"
 RULE_OPTION_VIE_AI_CDS_DIEM_DESC: "L'IA installe §CNgo-Dinh-Diem§! à la tête d'une coalition §YCong-Nong-Dang / Phu-Quoc-Hoi§!."
 RULE_OPTION_VIE_AI_CDS_HUNG: "Hoang-Nam-Hung"
 RULE_OPTION_VIE_AI_CDS_HUNG_DESC: "L'IA installe §CHoang-Nam-Hung§! à la tête du §Ynationaliste§! front anticommuniste."
 RULE_OPTION_VIE_AI_CDS_VINH: "Tran-Quang-Vinh"
 RULE_OPTION_VIE_AI_CDS_VINH_DESC: "L'IA installe §CTran-Quang-Vinh§! à la tête d'une coalition §YPhu-Quoc Hoi / Cao-Dai§!."
 
 GENEVA_AI_WALKOUT: "@VIE @FRA @VIN [1954] Débrayages à la Conférence de Genève"
 GENEVA_AI_WALKOUT_DESC: "Décide §Ylorsque la délégation quittera en trombe la Conférence de Genève§!. Deux débrayages parmi les principaux belligérants - §CFrance§!, §CSaigon§! et §CHanoï§! - font échouer les négociations et mettent fin à la guerre sans aucun accord."
 RULE_OPTION_GENEVA_AI_WALKOUT_DEFAULT: "Par défaut"
 RULE_OPTION_GENEVA_AI_WALKOUT_DEFAULT_DESC: "La délégation §Yne sort jamais des défaites ordinaires à la table§!, même si les clauses vont à son encontre. Il ne sort que lorsque §Ra activement provoqué§!; tour à tour armé après tour, appuyé secrètement ou obligé d'avaler une ligne de séparation extrême §R§! séance après séance."
 RULE_OPTION_GENEVA_AI_WALKOUT_NEVER: "Jamais"
 RULE_OPTION_GENEVA_AI_WALKOUT_NEVER_DESC: "Aucune délégation ne quitte jamais la table. La conférence §Ydéroule toujours ses dix tours complets§! et signe tout ce sur quoi elle a réussi à se mettre d'accord. §YLes délégations de joueurs peuvent toujours sortir.§!"
 RULE_OPTION_GENEVA_AI_WALKOUT_HISTORICAL: "Volatil"
 RULE_OPTION_GENEVA_AI_WALKOUT_HISTORICAL_DESC: "Les délégations §Rsortent dès que leur patience s'épuise§!, provoquées ou non. Genève peut s'effondrer à cause de son seul entêtement."

