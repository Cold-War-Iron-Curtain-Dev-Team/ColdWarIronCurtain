 RULE_OPTION_LEB_SSNP_TAKEOVER: "@SYR Prise de contrôle du SSNP"
 RULE_OPTION_LEB_SSNP_TAKEOVER_DESC: "Le PSNS réussira à prendre le contrôle du gouvernement libanais et poursuivra l'idéal de la Grande Syrie."
