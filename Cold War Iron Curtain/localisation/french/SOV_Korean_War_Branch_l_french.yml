 # ============================================================================
 #  THE KOREAN QUESTION - Korean War side branch (SOV / Stalin tree)
 #  Revealed by sov_jvs.4 on day 21.
 # ============================================================================

 # ---- Events ----
 sov_korea_branch.1.t:0 "Allée MiG"
 sov_korea_branch.1.d:0 "Le long du Yalu, dans un couloir du ciel que les pilotes américains ont commencé à appeler MiG Alley, des aviateurs soviétiques aux marquages chinois pilotent des avions soviétiques contre l'armée de l'air américaine.\n\nToutes les personnes impliquées comprennent l'arrangement. Il est interdit aux pilotes de parler russe à la radio, de survoler la mer, de franchir la ligne de front où ils pourraient être capturés. Washington sait parfaitement qui se trouve dans les cockpits et a décidé, pour des raisons qui lui sont propres, de ne pas le dire à haute voix.\n\nDeux puissances nucléaires se tirent dessus quotidiennement et les deux gouvernements ont convenu de prétendre le contraire."
 sov_korea_branch.1.a:0 "Une guerre qu'aucune des parties ne peut admettre."

 sov_korea_branch.2.t:0 "Armistice à Panmunjom"
 sov_korea_branch.2.d:0 "Après deux ans de pourparlers menés sous une tente alors que les bombardements se poursuivaient à l'extérieur, les armes ont cessé en Corée.\n\nLa ligne est presque exactement là où elle était en juin 1950. Trois ans et la frontière s'est déplacée de quelques dizaines de kilomètres. Ce qui a changé, c'est tout autour : les Américains sont désormais présents en permanence en Corée et au Japon, les budgets de défense de l'alliance atlantique ont triplé et les Chinois ont découvert qu'ils pouvaient combattre les États-Unis jusqu'à l'impasse.\n\nMoscou a dépensé très peu de sang dans cette guerre et en a tiré beaucoup. Que ce soit le plan ou simplement le résultat n'est pas une question que quiconque au Présidium a l'intention d'écrire."
 sov_korea_branch.2.a:0 "Une guerre gelée reste utile."

 # ---- Focuses ----
 SOV_kw_the_korean_question:0 "La question coréenne"
 SOV_kw_the_korean_question_desc:0 "Kim Il-sung demande, avec une insistance croissante, l'autorisation de réunifier la Corée par la force. Il croit que le Sud se soulèvera dès que ses divisions franchiront le parallèle. Il pense que les Américains, après avoir exclu la Corée de leur périmètre de défense, n'y reviendront pas.\n\nLe camarade Staline n'en est pas si sûr. Mais l'Armée populaire coréenne est une création soviétique, armée d'armes soviétiques et entraînée par des officiers soviétiques, et quoi que Pyongyang décide de faire, elle le fera avec ce que Moscou lui a donné.\n\nLa question n'est pas vraiment de savoir s'il y aura une guerre. Il s'agit de savoir à quel point notre équipe sera bien préparée le moment venu."
 SOV_kw_the_korean_question_tt:0 "Débloque la branche §YQuestion coréenne§!."

 SOV_kw_rearm_the_korean_peoples_army:0 "Réarmer l'Armée populaire coréenne"
 SOV_kw_rearm_the_korean_peoples_army_desc:0 "La KPA est une force d'infanterie légère dotée d'une poignée de véhicules obsolètes. Contre la gendarmerie, Syngman Rhee appelle une armée qui pourrait suffire. Ce n'est pas le cas de tout ce que les Américains pourraient débarquer.\n\nLes surplus de la Grande Guerre Patriotique seront expédiés via Vladivostok et la Mandchourie : fusils, artillerie et T-34 qui ont brisé la Wehrmacht. Pyongyang obtiendra également des usines pour les faire fonctionner."
 SOV_kw_rearm_the_korean_peoples_army_tt:0 "La KPA reçoit une importante livraison de §Yd'équipement d'infanterie et d'armures§!, de financements et de deux §Yusines d'armes§!.\nLa projection de la puissance étrangère soviétique diminue tandis que les expéditions se poursuivent."

 SOV_kw_advisors_in_pyongyang:0 "Conseillers à Pyongyang"
 SOV_kw_advisors_in_pyongyang_desc:0 "L'équipement n'est pas une armée. Le corps des officiers du KPA est composé de partisans mandchous et de Coréens soviétiques qui n'ont jamais commandé quelque chose de plus grand qu'un bataillon.\n\nUn groupe consultatif militaire dirigé par le général Shtykov prendra en charge la planification opérationnelle, la formation du personnel et la logistique. Officiellement, ce sont des consultants techniques. En pratique, le plan d'invasion, une fois rédigé, sera rédigé en russe et traduit."
 SOV_kw_advisors_in_pyongyang_tt:0 "Le KPA gagne §Yd'expérience militaire§! et §Yde soutien de guerre§!et nous accorde un accès militaire.\nLes relations avec la KPA s'améliorent considérablement."

 SOV_kw_the_sino_soviet_understanding:0 "L'entente sino-soviétique"
 SOV_kw_the_sino_soviet_understanding_desc:0 "Quoi qu'il arrive en Corée, cela se produira à la frontière chinoise, et Mao vient de gagner une guerre civile avec une armée qui n'a nulle part où aller.\n\nSi les Américains viennent vers le nord, ce ne seront pas les divisions soviétiques qui les rencontreront à Yalu - c'est une guerre que Moscou ne peut se permettre et ne mènera pas. Ce seront des chinois. Cet arrangement doit être compris à Pékin bien avant que quiconque en ait besoin, et il doit être payé."
 SOV_kw_the_sino_soviet_understanding_tt:0 "La RPC reçoit §Yd'équipement d'infanterie et d'armure§!.\nLes relations avec la RPC s'améliorent et la projection de la puissance étrangère soviétique augmente."

 SOV_kw_the_64th_fighter_aviation_corps:0 "Le 64e Corps d'aviation de chasse"
 SOV_kw_the_64th_fighter_aviation_corps_desc:0 "Les Américains ont la supériorité aérienne sur la péninsule et l'utilisent pour détruire tous les ponts, voies ferrées et colonnes que possède la KPA.\n\nLe 64th Fighter Aviation Corps se déploiera sur les aérodromes de Mandchourie avec le MiG-15. Les avions porteront des marquages chinois et les pilotes porteront des papiers chinois, et la fiction sera maintenue aussi transparente qu'elle devienne."
 SOV_kw_the_64th_fighter_aviation_corps_tt:0 "Obtenez l'esprit §YThe 64th Fighter Aviation Corps§! pendant 900 jours.\nUne base aérienne de niveau 4 §Y§! est construite en Corée et l'allocation des volontaires à la KPA augmente."

 SOV_kw_mig_alley:0 "Allée MiG"
 SOV_kw_mig_alley_desc:0 "Le couloir le long du Yalu est devenu la plus grande bataille aérienne entre avions à réaction de l'histoire, et elle est menée par des hommes qui ne sont officiellement pas là.\n\nPour l'Armée de l'Air, cela vaut plus que le territoire. Chaque sortie contre les B-29 et les Sabres est une donnée que nous ne pouvons obtenir autrement - sur nos avions, sur les leurs, et sur la façon dont se déroulerait réellement une guerre aérienne moderne entre les blocs."
 SOV_kw_mig_alley_tt:0 "Gain important en expérience aérienne §Y§! et en projection de puissance étrangère."

 SOV_kw_deniable_volunteers:0 "Des bénévoles refusés"
 SOV_kw_deniable_volunteers_desc:0 "La formule qui limite cette guerre est le déni. Aucune unité soviétique n'est en Corée ; il n'y a que des volontaires, des conseillers et du personnel technique, et les Américains ont leurs propres raisons d'accepter cela.\n\nDans cette fiction, beaucoup de choses peuvent être déplacées. Les équipages d'artillerie, le génie, les troupes de transmissions et les batteries anti-aériennes peuvent tous être décrits comme autre chose, à condition que personne ne soit capturé avec le mauvais uniforme."
 SOV_kw_deniable_volunteers_tt:0 "Le KPA reçoit §Ydu matériel d'infanterie§! et §Ydes effectifs§!.\nL'indemnité de volontariat versée à la KPA augmente encore. La tension mondiale retombe."

 SOV_kw_the_armistice_at_panmunjom:0 "L'Armistice de Panmunjom"
 SOV_kw_the_armistice_at_panmunjom_desc:0 "La guerre est décidée militairement depuis deux ans ; seule la question des prisonniers fait avancer les négociations. Ni Washington ni Pékin ne peuvent se permettre de donner l'impression de céder, et ni l'un ni l'autre ne peuvent se permettre de continuer.\n\nMoscou peut y mettre fin. Un mot adressé à Pyongyang et à Pékin indiquant que l'Union soviétique considère que la question est réglée mettra fin aux négociations d'ici quelques semaines. Ce que nous obtenons en échange, c'est un engagement américain permanent en Asie, une Chine qui a saigné pour le camp socialiste et qui nous doit des armes, et une frontière que nous n'avons pas eu à défendre nous-mêmes."
 SOV_kw_the_armistice_at_panmunjom_tt:0 "Gain important en §Ypouvoir politique§!, §Ystabilité§! et projection de puissance étrangère.\nLe KPA reçoit un financement et se stabilise. La tension mondiale chute fortement."

 SOV_kw_deniable_volunteers_threat:0 "Volontaires en Corée"
 SOV_kw_panmunjom_threat:0 "L'armistice coréen"
