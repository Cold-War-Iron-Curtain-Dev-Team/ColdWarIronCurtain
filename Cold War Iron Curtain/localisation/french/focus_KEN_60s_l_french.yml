l_french:

 KEN_60s_Patrick_Muir_Renisen_govornership:0 "Patrick Muir Renisen Gouverneur"
 KEN_60s_Patrick_Muir_Renisen_govornership_desc:0 "Après le mandat d'Evelyn Baring en tant que gouverneur pendant la rébellion Mau Mau, tout ce qui ne serait pas une reconstruction tranquille et la stabilité contribuerait grandement à la mémoire de Sir Renisen en tant que gouverneur."
 KEN_60s_post_mau_mau_reconstruction:0 "Reconstruction post-Mau-Mau"
 KEN_60s_post_mau_mau_reconstruction_desc:0 "À la suite du soulèvement des Mau Mau, il y a énormément de travail à accomplir. L'économie elle-même est lourdement ébranlée par la pression des perturbations et doit donc être corrigée le plus rapidement possible."
 KEN_60s_revoke_martial_law:0 "Abroger la loi martiale"
 KEN_60s_revoke_martial_law_desc:0 "En signe de bonne foi de notre part envers la population, il a été décidé de restaurer les libertés civiles et les libertés de la population. Une telle motion devrait contribuer grandement à la guérison du protectorat."
 KEN_60s_rift_valley_reconstruction:0 "Reconstruction de la vallée du Rift"
 KEN_60s_rift_valley_reconstruction_desc:0 "La belle région de notre pays qu'est la Vallée du Rift a subi sa part de ravages à la suite du soulèvement. En outre, en tant que point vital entre les White Highlands et la capitale, la reconstruction doit commencer immédiatement."
 KEN_60s_highland_reconstruction:0 "Reconstruction des Hautes Terres"
 KEN_60s_highland_reconstruction_desc:0 "L'essentiel de l'insurrection ayant eu lieu dans les zones les plus rurales du pays, cela signifie que les zones normalement tranquilles des Highlands n'ont pas été épargnées par les destructions qui leur ont été infligées. Cela mérite notre attention immédiate pour le bien de notre population blanche qui y réside."
 KEN_60s_end_reconstruction:0 "Mettre fin à la reconstruction"
 KEN_60s_end_reconstruction_desc:0 "Grâce à notre travail acharné, il est temps d'annoncer que la reconstruction peut prendre fin et que la normalité peut revenir dans le protectorat. Commençons à prospérer à nouveau."
 KEN_60s_continue_indian_immigration:0 "Continuer l'immigration indienne"
 KEN_60s_continue_indian_immigration_desc:0 "Même avant la Seconde Guerre mondiale, l'afflux d'Indiens avait rempli une partie notable de la population. Et maintenant, la population indienne a depuis été intégrée dans la société, de sorte qu'on peut la trouver dans des professions au sein de celle-ci ; la police, la bureaucratie et la main-d'oeuvre qualifiée. Cela signifie qu'ils font partie intégrante de l'économie et que l'immigration doit donc être encouragée."
 KEN_60s_ethnic_reconcilliation:0 "Réconciliation ethnique"
 KEN_60s_ethnic_reconcilliation_desc:0 "Les cicatrices du soulèvement Mau Mau restent encore sensibles. En conséquence, notre première tâche doit être de nous réconcilier avec les personnes impliquées et de montrer que nous sommes capables de pardonner certaines offenses."
 KEN_60s_return_of_british_business:0 "Retour des affaires britanniques"
 KEN_60s_return_of_british_business_desc:0 "Les hostilités étant désormais terminées, le feu vert peut être donné aux entreprises britanniques : le Kenya est à nouveau ouvert aux affaires."
 KEN_60s_the_direction_of_the_protectorate:0 "La direction du protectorat"
 KEN_60s_the_direction_of_the_protectorate_desc:0 "Le protectorat étant désormais en voie de guérison, le moment est venu de choisir la voie finale. Allons-nous rester fidèles à la voie coloniale, ou devons-nous ouvrir la voie à un gouvernement majoritaire ?"
 KEN_60s_malcolm_mcdonald_as_governor:0 "Malcolm MacDonald comme gouverneur"
 KEN_60s_malcolm_mcdonald_as_governor_desc:0 "Après mûre réflexion, il a été décidé que l'approche libérale de Malcolm MacDonald bénéficierait le plus au Kenya."
 KEN_60s_eric_griffith_jones_keeps_power:0 "Eric Griffith Jones conserve le pouvoir"
 KEN_60s_eric_griffith_jones_keeps_power_desc:0 "Eric Griffith Jones, bien que destiné à être un gouverneur de transition, a réussi à conserver le pouvoir. Avec cet acte de détermination, il semble que les éléments les plus conservateurs aient tenu le coup."
 KEN_60s_push_for_dominion_status:0 "Faire pression pour le statut de Dominion"
 KEN_60s_push_for_dominion_status_desc:0 "Le Kenya a parcouru un long chemin depuis qu'il se cache dans l'ombre de la Grande-Bretagne et nous devons donc pousser la Grande-Bretagne à obtenir une plus grande autonomie, comme celles du Canada et de l'Afrique du Sud."
 KEN_60s_rise_of_the_kenyan_middle_class:0 "Montée de la classe moyenne kenyane"
 KEN_60s_rise_of_the_kenyan_middle_class_desc:0 "Avec une population aussi diversifiée, il n'est pas surprenant que le Kenya ait réussi à développer sa propre classe moyenne."
 KEN_60s_kenyan_modernization:0 "Modernisation kenyane"
 KEN_60s_kenyan_modernization_desc:0 "Grâce au boom économique résultant de nos efforts, nous pouvons enfin dire que le Kenya est suffisamment confiant pour annoncer son entrée sur la scène mondiale en tant que pays véritablement moderne."
 KEN_60s_kenyan_industrialization:0 "Industrialisation kenyane"
 KEN_60s_kenyan_industrialization_desc:0 "Il est presque difficile de croire tout le chemin parcouru par le Kenya au cours de la dernière décennie. D'une nation reculée de l'Empire à une puissance économique régionale."
 KEN_60s_kenyan_resource_extraction:0 "Extraction des ressources au Kenya"
 KEN_60s_kenyan_resource_extraction_desc:0 "Le moment est venu que les fruits de notre travail profitent aux Kenyans plutôt qu'aux Britanniques qui exploitent la sueur de nos sourcils."
 KEN_60s_kenyan_consumerism:0 "Le consumérisme kenyan"
 KEN_60s_kenyan_consumerism_desc:0 "Avec l'essor de la classe moyenne, tout le monde a de l'argent à consacrer à plus que ses besoins vitaux. Que les Kenyans commencent enfin à voir la vie comme une joie plutôt que comme un combat."
 KEN_60s_carbacide_investments:0 "Investissements dans les carbacides"
 KEN_60s_carbacide_investments_desc:0 "Des sociétés spécifiques ont investi dans le carbacide."
 KEN_60s_workers_pensions:0 "Pensions des travailleurs"
 KEN_60s_workers_pensions_desc:0 "Le trésor ayant enfin un peu d'argent de côté, nous pouvons commencer à montrer une certaine gratitude à ceux qui ont travaillé pour nous amener à ce point. Introduisons des régimes de retraite pour préserver l'avenir de ceux qui ont fait des sacrifices."
 KEN_60s_found_cooperative_bank_of_kenya:0 "Création de la Banque coopérative du Kenya"
 KEN_60s_found_cooperative_bank_of_kenya_desc:0 "Cette banque répond aux besoins bancaires des particuliers, des petites entreprises et des grandes entreprises, en se concentrant sur les besoins des sociétés coopératives au Kenya."
 KEN_60s_expand_mining_in_lake_magadi:0 "Développer l'exploitation minière dans le lac Magadi"
 KEN_60s_expand_mining_in_lake_magadi_desc:0 "Il est intéressant de noter que l'investissement réalisé dans Magadi Soda Company semble avoir ouvert la voie à une croissance ultérieure. Il faut s'y attaquer immédiatement, de peur que nous ne perdions l'élan acquis jusqu'à présent."
 KEN_60s_expand_coffee_exports:0 "Développer les exportations de café"
 KEN_60s_expand_coffee_exports_desc:0 "Comme le thé, le café joue un rôle important dans les exportations du Kenya. Une telle opportunité d'élargissement ne peut être laissée passer."
 KEN_60s_scott_theological_college:0 "Collège théologique Scott"
 KEN_60s_scott_theological_college_desc:0 "Nommé en l'honneur du fondateur de l'AIM (Africa Inland Mission), l'objectif du Scott Theological College sera de fournir une éducation et une formation de haute qualité à ceux qui sont au service de Dieu. Bien sûr, elle peut fonctionner comme une autre université."
 KEN_60s_tea_packaging_plant_in_mombasa:0 "Usine de conditionnement de thé à Mombasa"
 KEN_60s_tea_packaging_plant_in_mombasa_desc:0 "Du thé ! Même si ce n'est peut-être pas une boisson très populaire au Kenya, il existe une forte demande à l'étranger. Plus d'usines de conditionnement signifient plus de revenus provenant des exportations. Rendez ces usines opérationnelles !"
 KEN_60s_tea_packaging_in_nairobi:0 "Usine de conditionnement de thé à Nairobi"
 KEN_60s_tea_packaging_in_nairobi_desc:0 "Peu importe qu'il se trouve à 10 ou 100 milles de la côte, le thé trouvera d'une manière ou d'une autre son chemin hors du pays et dans les théières des clients du monde entier."
 KEN_60s_merge_KPLC_with_KPC:0 "Fusionner le KPLC avec le KPC"
 KEN_60s_merge_KPLC_with_KPC_desc:0 "Cela fait longtemps que la Kenyan Power Company a été créée et, après réflexion, la meilleure façon de garantir son succès est de la fusionner avec la Kenyan Power and Lighting Company."
 KEN_60s_a_new_plant_in_kisumu:0 "Une nouvelle usine à Kisumu"
 KEN_60s_a_new_plant_in_kisumu_desc:0 "Avec le succès de la fusion, le moment est venu de s'étendre plus loin pour garantir que la demande d'électricité soit satisfaite."
 KEN_60s_a_new_plant_in_nakuru:0 "Une nouvelle usine à Nakuru"
 KEN_60s_a_new_plant_in_nakuru_desc:0 "Avec le succès de la fusion, le moment est venu de s'étendre plus loin pour garantir que la demande d'électricité soit satisfaite."
 KEN_60s_rift_valley_gold_deposits:0 "Gisements aurifères de la vallée du Rift"
 KEN_60s_rift_valley_gold_deposits_desc:0 "Les diverses richesses de la célèbre vallée du Rift sont connues depuis un certain temps, mais cette fois, nous avons trouvé de l'or. Non littéralement."
 KEN_60s_mombasa_crude_oil:0 "Pétrole brut de Mombasa"
 KEN_60s_mombasa_crude_oil_desc:0 "La présence de gisements de pétrole sous des formes mineures est connue depuis un certain temps, mais il semble que nous soyons enfin en mesure d'exploiter correctement cette découverte passionnante."
 KEN_60s_limestone_mining_in_the_highlands:0 "Extraction de calcaire dans les Highlands"
 KEN_60s_limestone_mining_in_the_highlands_desc:0 "Des méthodes de prospection plus avancées ont généré des rendements plus importants et plus dynamiques de notre riche région des Highlands."
 KEN_60s_aluminum_in_the_northern_frontier:0 "L'aluminium à la frontière du Nord"
 KEN_60s_aluminum_in_the_northern_frontier_desc:0 "De récents rapports de prospecteurs nous ont fait prendre conscience de la présence de métaux légers dans le district frontalier nord. La récupération de ces matériaux est une priorité immédiate. Accrochez-vous !"
 KEN_60s_offshore_oil_deposits:0 "Gisements pétroliers offshore"
 KEN_60s_offshore_oil_deposits_desc:0 "Le succès de nos premières exploitations pétrolières a suscité une soif d'en savoir plus. Et le seul véritable endroit où l'on peut le trouver se trouve juste au large de la côte est-africaine."
 KEN_60s_automobile_production:0 "Production automobile"
 KEN_60s_automobile_production_desc:0 "Grâce à Cooper Motors Limited, le Kenya dispose d'un système de fabrication automobile indigène florissant"
 KEN_60s_east_african_hegemony:0 "Hégémonie est-africaine"
 KEN_60s_east_african_hegemony_desc:0 "L'économie du Kenya a une longueur d'avance sur celle de ses voisins. Aujourd'hui, nous pouvons clairement déclarer que nous avons l'hégémonie économique sur l'Afrique de l'Est"
 KEN_60s_free_jomo_kenyatta:0 "Jomo Kenyatta gratuit"
 KEN_60s_free_jomo_kenyatta_desc:0 "Il faut mettre un terme aux outrages emprisonnements de Jomo Kenyatta"
 KEN_60s_unban_the_kenyan_african_national_union:0 "Annuler l'interdiction de l'Union nationale africaine kenyane"
 KEN_60s_unban_the_kenyan_african_national_union_desc:0 "Nous devons lever l'interdiction de l'Union nationale africaine du Kenya"
 KEN_60s_prepare_transitional_government:0 "Préparer un gouvernement de transition"
 KEN_60s_prepare_transitional_government_desc:0 "Jomo Kenyatta organise un gouvernement de transition"
 KEN_60s_1963_general_election:0 "Élections générales de 1963"
 KEN_60s_1963_general_election_desc:0 "Les élections générales de 1963"
 KEN_60s_Tom_Mboya:0 "Tom Mboya"
 KEN_60s_Tom_Mboya_desc:0 "Nous choisirons Tom Mboya comme premier président"
 KEN_60s_Jomo_kenyatta:0 "Jomo Kenyatta"
 KEN_60s_Jomo_kenyatta_desc:0 "Nous choisirons Jomo Kenyatta comme premier président"
 KEN_60s_empower_municipal_legislatures:0 "Autonomiser les législatures municipales"
 KEN_60s_empower_municipal_legislatures_desc:0 "Nous devons responsabiliser le pouvoir législatif municipal aux dépens du gouvernement central"
 KEN_60s_indeginous_entrepeneur_initiative:0 "Initiative des entrepreneurs autochtones"
 KEN_60s_indeginous_entrepeneur_initiative_desc:0 "Tom Mboya est un ardent défenseur de l'entrepreneuriat autochtone"
 KEN_60s_strengthen_ties_with_nigeria:0 "Renforcer les liens avec le Nigéria"
 KEN_60s_strengthen_ties_with_nigeria_desc:0 "Tom Mboya veut renforcer ses liens avec un autre pays africain anglophone"
 KEN_60s_embrace_trade_unions:0 "Adoptez les syndicats"
 KEN_60s_embrace_trade_unions_desc:0 "Tom Mboya est favorable aux syndicats"
 KEN_60s_expand_the_air_lifts:0 "Développez les ponts aériens"
 KEN_60s_expand_the_air_lifts_desc:0 "Tom Mboya est un organisateur de \"transport aérien\" d'étudiants les emmenant faire leurs études à l'étranger"
 KEN_60s_white_highland_buy_back_program:0 "Programme de rachat de White Highland"
 KEN_60s_white_highland_buy_back_program_desc:0 "Le plan de redistribution des terres de Tom Mboya est un programme de rachat facultatif pour les propriétaires fonciers blancs des hauts plateaux blancs"
 KEN_60s_meet_with_MLK:0 "Rencontre avec MLK"
 KEN_60s_meet_with_MLK_desc:0 "Tom Mboya, défenseur du mouvement américain des droits civiques, a noué des relations solides avec le Dr Martin Luther King"
 KEN_60s_government_harambees:0 "Harambees du gouvernement"
 KEN_60s_government_harambees_desc:0 "Harambee est une tradition kenyane d'événements d'entraide communautaire, par ex. Activités de collecte de fonds ou de développement. Harambee signifie littéralement « tous rassemblés » en swahili"
 KEN_60s_found_ministry_of_constitutional_affairs:0 "Fondé Ministère des Affaires Constitutionnelles"
 KEN_60s_found_ministry_of_constitutional_affairs_desc:0 "Tom Mboya est un constitutionnaliste strict"
 KEN_60s_lua_toleration:0 "Tolérance Lua"
 KEN_60s_lua_toleration_desc:0 "Tom Mboya n'appartient pas au groupe ethnique Kikuyu et présente donc moins de préjugés ethniques à l'égard de son gouvernement"
 KEN_60s_forgive_and_forget:0 "Pardonner et oublier"
 KEN_60s_forgive_and_forget_desc:0 "Un aspect important du gouvernement de Kenyatta est de pardonner les griefs coloniaux du passé"
 KEN_60s_centralization_efforts:0 "Efforts de centralisation"
 KEN_60s_centralization_efforts_desc:0 "L'une des principales préoccupations politiques de Jomo Kenyatta réside dans la centralisation du Kenya"
 KEN_60s_propogate_a_mixed_economy:0 "Propager une économie mixte"
 KEN_60s_propogate_a_mixed_economy_desc:0 "Jomo Kenyatta est un ardent défenseur d'une économie mixte"
 KEN_60s_increase_government_employee_pay:0 "Augmenter les salaires des employés du gouvernement"
 KEN_60s_increase_government_employee_pay_desc:0 "En réponse aux mutineries, Kenyatta a décidé d'augmenter les salaires des fonctionnaires."
 KEN_60s_white_cohexistance:0 "Coexistence blanche"
 KEN_60s_white_cohexistance_desc:0 "Jomo Kenyatta estime que les Européens restés au Kenya ont leur place dans notre nouvelle société"
 KEN_60s_preserve_legal_code:0 "Préserver le code juridique"
 KEN_60s_preserve_legal_code_desc:0 "Pour l'essentiel, Jomo Kenyatta a décidé de préserver l'ancien code juridique colonial"
 KEN_60s_transfer_of_functions_act:0 "Loi sur le transfert de fonctions"
 KEN_60s_transfer_of_functions_act_desc:0 "Jomo Kenyatta va adopter la loi sur le transfert des fonctions, qui met fin aux subventions aux autorités locales et transfère les principaux services du contrôle provincial au contrôle central"
 KEN_60s_encourage_foreign_investment:0 "Encourager les investissements étrangers"
 KEN_60s_encourage_foreign_investment_desc:0 "Jomo Kenyatta travaille dur pour attirer les investissements étrangers au Kenya"
 KEN_60s_expand_healthcare:0 "Développer les soins de santé"
 KEN_60s_expand_healthcare_desc:0 "Jomo Kenyatta milite pour l'élargissement de l'accès aux soins de santé"
 KEN_60s_greater_kanu_domination:0 "Une plus grande domination du KANU"
 KEN_60s_greater_kanu_domination_desc:0 "Nous rapprocherons le Kenya d'un État à parti unique"
 KEN_60s_address_the_northern_frontier_crisis:0 "Résoudre la crise de la frontière nord"
 KEN_60s_address_the_northern_frontier_crisis_desc:0 "La crise de la frontière nord est une série de mutineries qui se déroulent à la frontière nord, ethniquement somalienne"
 KEN_60s_merge_the_KADU_and_the_KANU:0 "Fusionner le KADU et le KANU"
 KEN_60s_merge_the_KADU_and_the_KANU_desc:0 "Nous devons fusionner l'Union démocratique africaine kenyane avec l'Union nationale africaine kenyane"
 KEN_60s_end_the_mutinies:0 "Mettre fin aux mutineries"
 KEN_60s_end_the_mutinies_desc:0 "Nous devons mettre fin à ces mutineries de minorités ethniques"
 KEN_60s_the_east_african_conference:0 "La Conférence de l'Afrique de l'Est"
 KEN_60s_the_east_african_conference_desc:0 "Les dirigeants indépendantistes de l'Afrique de l'Est doivent se réunir pour une réunion sur l'unité"
 KEN_60s_diplomatic_union:0 "Union diplomatique"
 KEN_60s_diplomatic_union_desc:0 "Nous choisirons une union diplomatique"
 KEN_60s_one_people_one_destiny:0 "Un peuple, un destin"
 KEN_60s_one_people_one_destiny_desc:0 "Nous tracerons un chemin pour un peuple, un destin"
 KEN_60s_operation_bunyoro:0 "Opération Bunyoro"
 KEN_60s_operation_bunyoro_desc:0 "Nous devons mettre fin au régime Idi Amin"
 KEN_60s_declaration_of_the_east_african_federation:0 "Déclaration de la Fédération de l'Afrique de l'Est"
 KEN_60s_declaration_of_the_east_african_federation_desc:0 "Nous déclarerons la Fédération de l'Afrique de l'Est"
 KEN_60s_denounce_white_minority_rule:0 "Dénoncer les gouvernements minoritaires blancs"
 KEN_60s_denounce_white_minority_rule_desc:0 "Nous devons mettre fin à ces régimes"
 KEN_60s_annexation_of_the_seychelles:0 "Annexion des Seychelles"
 KEN_60s_annexation_of_the_seychelles_desc:0 "Les Seychelles doivent être libérées"
 KEN_60s_border_war_with_portugal:0 "Guerre frontalière avec le Portugal"
 KEN_60s_border_war_with_portugal_desc:0 "Nous pousserons les Portugais vers le sud"
 KEN_60s_the_uhuru_war:0 "La guerre d'Uhuru"
 KEN_60s_the_uhuru_war_desc:0 "Notre guerre de libération commence"
 KEN_60s_pan_africanist_international:0 "L'Internationale panafricaniste"
 KEN_60s_pan_africanist_international_desc:0 "Nous fonderons une internationale de nos intérêts"
 KEN_60s_alienate_ethiopia:0 "Aliéner l'Éthiopie"
 KEN_60s_alienate_ethiopia_desc:0 "nous allons nous aliéner ce régime archaïque"
 KEN_60s_ties_with_ethiopia:0 "Liens avec l'Éthiopie"
 KEN_60s_ties_with_ethiopia_desc:0 "Nous nouerons des liens avec l'Éthiopie"
 KEN_60s_treaty_of_the_third_world:0 "Traité du tiers monde"
 KEN_60s_treaty_of_the_third_world_desc:0 "Nous formerons un pacte défensif avec nos alliés du tiers monde"
 KEN_60s_denounce_african_right_wingers:0 "Dénoncer la droite africaine"
 KEN_60s_denounce_african_right_wingers_desc:0 "Nous devons débarrasser le monde de ces traîtres"
 KEN_60s_general_election_of_1966:0 "Élection générale de 1966"
 KEN_60s_general_election_of_1966_desc:0 "C'est l'élection générale de 1966"
 KEN_60s_KANU_victory:0 "Victoire du KANU"
 KEN_60s_KANU_victory_desc:0 "L'Union nationale africaine kenyane est victorieuse"
 KEN_60s_align_with_the_US:0 "Alignez-vous sur les États-Unis."
 KEN_60s_align_with_the_US_desc:0 "Nous nous alignerons sur les États-Unis"
 KEN_60s_one_party_state:0 "État à parti unique"
 KEN_60s_one_party_state_desc:0 "Nous formerons un État à parti unique"
 KEN_60s_strengthen_the_executive_branch:0 "Renforcer le pouvoir exécutif"
 KEN_60s_strengthen_the_executive_branch_desc:0 "Nous renforcerons le pouvoir exécutif"
 KEN_60s_extra_judicial_sentancing:0 "Peines extrajudiciaires"
 KEN_60s_extra_judicial_sentancing_desc:0 "Jomo Kenyatta entame une peine extrajudiciaire"
 KEN_60s_KPU_victory:0 "Victoire du KPU"
 KEN_60s_KPU_victory_desc:0 "le KPU est victorieux"
 KEN_60s_open_relationship_with_the_soviet_union:0 "Relation ouverte avec l'URSS"
 KEN_60s_open_relationship_with_the_soviet_union_desc:0 "Nous ouvrirons des relations avec l'URSS"
 KEN_60s_align_with_china:0 "S'aligner sur la RPC"
 KEN_60s_align_with_china_desc:0 "Nous nous alignerons sur la RPC"
 KEN_60s_lua_representation:0 "Représentation Lua"
 KEN_60s_lua_representation_desc:0 "Nous parviendrons à la représentation du peuple Lua"
 KEN_60s_not_yet_uhuru:0 "Pas encore Uhuru"
 KEN_60s_not_yet_uhuru_desc:0 "Nous n'avons pas encore atteint la liberté, nous devons rester vigilants"
 KEN_60s_female_voting_rights:0 "Droit de vote des femmes"
 KEN_60s_female_voting_rights_desc:0 "nous accorderons le droit de vote aux femmes"
 KEN_60s_greater_religious_autonomy:0 "Une plus grande autonomie religieuse"
 KEN_60s_greater_religious_autonomy_desc:0 "Nous devons accorder une plus grande autonomie aux minorités religieuses"
 KEN_60s_kisumu_riots:0 "Les émeutes de Kisumu"
 KEN_60s_kisumu_riots_desc:0 "Une confrontation entre Jomo Kenyatta et Jaramogi Oginga Odinga a conduit à de vastes émeutes ethniques Lua"
 KEN_60s_the_assassination_of_tom_mboya:0 "L'assassinat de Tom Mboya"
 KEN_60s_the_assassination_of_tom_mboya_desc:0 "Tom Mboya a été assassiné !"
 KEN_60s_dr_barack_hussein_obama:0 "Dr Barack Hussein Obama"
 KEN_60s_dr_barack_hussein_obama_desc:0 "Nous choisirons le Dr Barack Hussein Obama"
 KEN_60s_daniel_arap_moi:0 "Daniel Arap Moi"
 KEN_60s_daniel_arap_moi_desc:0 "Nous choisirons Daniel Arap Moi"
 KEN_60s_the_kenyan_armed_forces:0 "Les forces armées kenyanes"
 KEN_60s_the_kenyan_armed_forces_desc:0 "Nous fonderons les forces armées kenyanes"
