l_french:
 congo_zairianisation:0 "Zaïranisation"
 change_name_to_zaire:0 "Fondation du Zaïre"
 change_name_to_zaire_desc:0 "Nous devons purger le Congo de l'influence coloniale ! Une bonne façon d'y parvenir serait de changer notre nom en République du Zaïre."
 kinshasa:0 "Léopoldville à Kinshasa"
 kinshasa_desc:0 "La capitale de notre nation porte toujours le sale nom belge de Léopoldville. Renomme-le Kinshasa, du nom d'un village voisin."
 congo.1.t:0 "Mutinerie dans la Force Publique"
 congo.1.d:0 "Malgré notre indépendance nouvellement acquise vis-à-vis de la Belgique, la Force Publique est toujours gérée par les bureaux européens blancs. Un grand nombre de soldats noirs se mutinent actuellement contre l'armée, dans l'espoir de se débarrasser des officiers blancs. Le commandant de la Force Publique, Emile Janssens, a appelé à la répression immédiate de la mutinerie."
 congo.1.a:0 "Feu Janssens"
 congo.1.b:0 "Remplacer Kasa-Vubu par un régime militaire"
 congo.2.t:0 "Armée Nationale Congolaise" 
 congo.2.d:0 "Le président Kasa-Vubu a renvoyé Emile Janssens de son poste de commandant et l'a remplacé par Victor Lundula. Immédiatement après le changement de direction, la Force Publique a changé son nom pour devenir Armée Nationale Congolaise."
 congo.2.a:0 "Le Congo pour les Congolais !"
 congo.3.t:0 "Sécession du Katanga" 
 congo.3.d:0 "Profitant du chaos politique actuel, le nationaliste katangais Moise Tshombe a déclaré la province du Katanga indépendante sous le nom d'État du Katanga. Le Katanga détient une grande partie de nos réserves minérales et les laisser partir serait une grande perte pour notre économie."
 congo.3.a:0 "Le Katanga est congolais !"
 congo.3.b:0 "Si c'est ce qu'ils souhaitent.."
 congo.4.t:0 "Question katangaise" 
 congo.4.d:0 "Presque immédiatement après l'indépendance, notre ancienne colonie du Congo a explosé dans une crise énorme, avec la déclaration d'indépendance de l'État du Katanga. Le Katanga détient une grande partie des réserves minérales du Congo et les soutenir dans le conflit pourrait nous permettre de conclure de meilleurs accords commerciaux, tout en nous vengeant du gouvernement du Congo."
 congo.4.a:0 "Aide Katanga"
 congo.4.b:0 "Je pensais qu'on avait quitté le Congo ?"
 congo.5.t:0 "Sécession du Kasaï du Sud" 
 congo.5.d:0 "Suivant les traces du Katanga, la petite mais riche région minière du Sud Kasaï a désormais elle aussi déclaré son indépendance. Interrogé, leur chef Albert Kalonji a déclaré que la sécession était une réponse à la récente oppression du peuple Baluba au Congo."
 congo.5.a:0 "Le Kasaï du Sud est congolais !"
 congo.5.b:0 "Si c'est ce qu'ils souhaitent.."
 congo.6.t:0 "République libre du Congo" 
 congo.6.d:0 "Eminent partisan de Patrice Lumumba, Antoine Gizenga a déclaré un nouveau gouvernement à Stanleyville, appelé République libre du Congo. De nombreuses troupes se mobilisent à ses côtés. Cela rendra plus difficiles les efforts visant à vaincre le Katanga et le Kasaï du Sud."
 congo.6.a:0 "Gizenga est un imbécile !"
 congo.6.b:0 "Gizenga a raison..."
 congo.7.t:0 "Rébellion Simba" 
 congo.7.d:0 "Après Gizenga, les sécessionnistes du Katanga et du Sud Kasaï, une nouvelle menace se profile. Les partisans du Premier ministre déchu Patrice Lumumba se sont rebellés dans le nord-est du pays et reçoivent le soutien de Cuba, du Tanganyika, de la Chine et de l'Union soviétique."
 congo.7.a:0 "Congo! Congo! Congo!"
 congo.7.b:0 "Ils ont raison, ce gouvernement a tort."
 congo.8.t:0 "Fin de la crise au Congo" 
 congo.8.d:0 "Le véritable gouvernement a prévalu. Tous les groupes séparatistes, rebelles communistes et fauteurs de troubles ont été combattus et la crise du Congo a été gagnée par le gouvernement. C'est un grand jour pour le Congo !"
 congo.8.a:0 "Je savais que nous pouvions le faire !"
 congo.9.t:0 "Coup d'État militaire" 
 congo.9.d:0 "Après que le gouvernement se soit retrouvé dans une impasse sur le choix du nouveau Premier ministre, le général Mobutu a maintenant pris le pouvoir par un coup d'État ! L'opposition et la résistance sont en train d'être purgées au moment où nous parlons, et le Congo tombe dans la dictature. La seule façon de préserver le gouvernement serait de déclencher une guerre civile que nous ne pouvons espérer gagner."
 congo.9.a:0 "Le coup d'État est sans effusion de sang"
 congo.9.b:0 "Le coup d'État déclenche une guerre civile"
 congoflavor.1.d:0 ""
 congo.10.d:0 "Le responsable colonial belge Eugène Jungers a annoncé sa retraite de son poste de gouverneur général du Congo. Il était gouverneur général depuis 1946. Peu de temps après avoir obtenu son doctorat en droit, Jungers rejoint le service colonial belge en tant que magistrat. Au fur et à mesure de son avancement, il est finalement devenu vice-gouverneur général du Ruanda-Urundi, le mandat de la Société des Nations administré par la Belgique. Après avoir pris son dernier poste au Congo, Jungers a contribué à superviser une administration coloniale plus active qui s'est davantage impliquée dans le progrès économique et social du Congo. Malgré son passé de colonialiste de carrière, Jungers a mené les réformes conformément aux directives de Bruxelles. Jungers devrait occuper un poste de direction au sein du conseil d'administration d'une grande société opérant au Congo."
 mobutu_cos_con:0 "Joseph-Désiré Mobutu nommé chef de cabinet"
 congo_mob:0 "Maurice Mpolo nommé directeur de cabinet"
 congo.tt.3:0 "§YJoseph-Désiré Mobutu sera rebaptisé §GMobutu Sese Seko Kuku Ngbendu Wa Za Banga§! et l'ensemble de la population de notre pays aura pour mandat d'adopter des noms africanisés, y compris nos §Gmilitaires et gouvernementaux§!."
 congo.tt.4:0 "Vous passerez au FROTC et vos priorités changeront"
 idea_force_publique:0 "Force Publique"
 idea_horrors_of_the_congo_wars:0 "Horreurs des guerres du Congo"

 
