 JAP_spaag_equipment_4: "Mitsubishi Type 87 Shiki-Jiso-Kosha-Kikanho 'Guntank'"
 JAP_spaag_equipment_4_short: "Type 87 « Guntank »"
 JAP_spaag_equipment_4_desc: "Le canon antiaérien automoteur de type 87 (87-shiki jiso kosha kikanho) est une arme de défense aérienne japonaise construite autour du système de canon double Oerlikon de 35 mm utilisé sur le canon antiaérien automoteur Gepard. Le système utilise un châssis de char de type 74 modifié. Il est également surnommé par les agents de terrain « Guntank » en référence au mecha d'apparence similaire de la série Mobile Suit Gundam."
