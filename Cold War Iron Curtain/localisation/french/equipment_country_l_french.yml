 JAP_atgm_equipment_0:0 "Kawasaki Type 64 MAT"
 JAP_atgm_equipment_0_short:0 "Type 64 MAT"
 JAP_atgm_equipment_0_desc:0 "Le Type 64 MAT (64-shiki tai-sensha yūdō-dan) est un missile antichar japonais guidé par fil développé à la fin des années 1950. Ce missile est globalement similaire au Cobra suisse/allemand et au 9M14 Malyutka. Au sein de la JGSDF, il est également connu sous les noms de 64MAT et KAM-3."
 JAP_atgm_equipment_1:0 "Kawasaki Type 79 Jyu-MAT"
 JAP_atgm_equipment_1_short:0 "Type 79 Jyu-MAT"
 JAP_atgm_equipment_1_desc:0 "Le Type 79 Jyu-MAT (79-shiki tai-shūtei tai-sensha yūdō-dan) est un missile antichar japonais à guidage SACLOS qui est entré en service dans la JGSDF en 1984. Il a d'abord été fourni aux unités de défense côtière dans le but de détruire les navires de débarquement de troupes et de véhicules à l'approche du littoral. Il est également connu sous le nom de KAM-9."
 JAP_atgm_equipment_2:0 "Kawasaki'Type 79 Kai Jyu-MAT"
 JAP_atgm_equipment_2_short:0 "Type 79 Kai Jyu-MAT"
 JAP_atgm_equipment_2_desc:0 "Le Type 79 Kai Jyu-MAT (79-shiki tai-shūtei tai-sensha yūdō-dan) est un missile antichar japonais à guidage SACLOS qui est entré en service dans la JGSDF en 1984. Il a d'abord été fourni aux unités de défense côtière dans le but de détruire les navires de débarquement de troupes et de véhicules à l'approche du littoral. Il est également connu sous le nom de KAM-9."
 JAP_atgm_equipment_3:0 "Kawasaki Type 87 Chu-MAT"
 JAP_atgm_equipment_3_short:0 "Type 87 Chu-MAT"
 JAP_atgm_equipment_3_desc:0 "Le Type 87 Chū-MAT (87-shiki tai-sensha yūdō-dan) Chū-MAT est un missile antichar japonais à guidage laser utilisé par les Forces terrestres d'autodéfense japonaises. Il a été créé pour remplacer le Type 64 MAT en première ligne, mis en service avec le Type 79 Jyu-MAT."
 JAP_atgm_equipment_4:0 "Kawasaki Type 87 Kai Chu-MAT"
 JAP_atgm_equipment_4_short:0 "Type 87 Kai Chu-MAT"
 JAP_atgm_equipment_4_desc:0 "Le Type 87 Chū-MAT (87-shiki tai-sensha yūdō-dan) Chū-MAT est un missile antichar japonais à guidage laser utilisé par les Forces terrestres d'autodéfense japonaises. Il a été créé pour remplacer le Type 64 MAT en première ligne, mis en service avec le Type 79 Jyu-MAT."
 JAP_atgm_equipment_5:0 "Kawasaki Type 01 LMAT"
 JAP_atgm_equipment_5_short:0 "Type 01 LMAT"
 JAP_atgm_equipment_5_desc:0 "Le Type 01 LMAT (01-shiki kei-tai-sensha yūdō-dan) est un missile antichar japonais portable de type « tire et oublie ». Son développement a débuté en 1993 chez Kawasaki Heavy Industries et il a été mis en service en 2001. Pendant son développement, le missile a été désigné sous le nom de code XATM-5. Il a ensuite été brièvement connu sous le nom d'ATM-5."
 JAP_atgm_carrier_equipment_0:0 "Mitsubishi Type 73 w/ MAT"
 JAP_atgm_carrier_equipment_0_short:0 "Type 73 MAT"
 JAP_atgm_carrier_equipment_0_desc:0 "Mitsubishi Type 73 équipé d'un système de missile antichar guidé Type 64 MAT monté sur les panneaux latéraux arrière."
 JAP_atgm_carrier_equipment_1:0 "Komatsu Type 60 w/ MAT"
 JAP_atgm_carrier_equipment_1_short:0 "Type 60 MAT"
 JAP_atgm_carrier_equipment_1_desc:0 "Véhicule blindé de transport de troupes Komatsu Type 60 équipé d'un système de missile antichar guidé Type 64 MAT monté sur les panneaux latéraux arrière."
 JAP_atgm_carrier_equipment_2:0 "Mitsubishi Type 73 w/ Jyu-MAT"
 JAP_atgm_carrier_equipment_2_short:0 "Type 73 Jyu-MAT"
 JAP_atgm_carrier_equipment_2_desc:0 "Mitsubishi Type 73 équipé d'un système de missile guidé antichar Type 79 Jyu-MAT monté sur le pont arrière."
 JAP_atgm_carrier_equipment_3:0 "Toyota Mega Cruiser équipé d'un système de missiles polyvalents de type 96"
 JAP_atgm_carrier_equipment_3_short:0 "Type 96 MPMS"
 JAP_atgm_carrier_equipment_3_desc:0 "Le système de missile polyvalent Type 96 est un missile antichar/anti-péniche utilisé par la JGSDF. Il s'agit du premier système de missile japonais à utiliser une interface entièrement contrôlée numériquement."
 JAP_atgm_carrier_equipment_4:0 "Toyota Mega Cruiser équipé d'un missile polyvalent à moyenne portée"
 JAP_atgm_carrier_equipment_4_short:0 "MMPM"
 JAP_atgm_carrier_equipment_4_desc:0 "Le missile polyvalent à moyenne portée ou Chū-MPM est un missile antichar/de débarquement utilisé par l'armée japonaise sous le nom de JGSDF."
 JAP_sam_carrier_equipment_4:0 "Système de missile sol-air Toshiba Type 81"
 JAP_sam_carrier_equipment_4_short:0 "Type 81 Tan-SAM"
 JAP_sam_carrier_equipment_4_desc:0 "Le missile sol-air de type 81 ou Tan-SAM (短SAM) est un missile sol-air développé au Japon et actuellement en service dans les Forces terrestres d'autodéfense japonaises."
 JAP_sam_carrier_equipment_5:0 "Missile sol-air à courte portée Toshiba Type 93 « Closed Arrow »"
 JAP_sam_carrier_equipment_5_short:0 "Type 93 Kon-SAM"
 JAP_sam_carrier_equipment_5_desc:0 "Le missile sol-air de type 93 (93 shiki-kinkyori-titaikū-yuūdōdan) ou Kon-SAM est un missile sol-air utilisé par la Force terrestre d'autodéfense japonaise. Il s'agit de la version embarquée du missile de type 91."
 JAP_sam_carrier_equipment_6:0 "Système de missile sol-air Toshiba Type 11"
 JAP_sam_carrier_equipment_6_short:0 "Type 11 Tan-SAM Kai II"
 JAP_sam_carrier_equipment_6_desc:0 "Le missile sol-air de type 11 ou Tan-SAM Kai II est un missile sol-air développé au Japon et actuellement en service dans les Forces d'autodéfense japonaises."
