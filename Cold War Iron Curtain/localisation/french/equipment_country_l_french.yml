 ##South Vietnam VIE

 VIE_lt_equipment_1: "Chien-xa Ke-go Kieu 1933 "
 VIE_lt_equipment_1_short: "Ke-go Kieu 1933"
 VIE_lt_equipment_1_desc: "Le Type 95 Ha-Go était un char léger japonais développé au milieu des années 1930, largement utilisé tout au long de la guerre du Pacifique. Il comportait un canon de char de 37 mm de type 94 et une paire de mitrailleuses de 7,7 mm, montés dans une coque rivetée avec un blindage mince allant de 6 à 12 mm. Bien que vulnérable aux armes lourdes, le Ha-Go excellait en termes de mobilité et de facilité de déploiement, notamment dans la jungle et sur les terrains accidentés. Après la défaite du Japon lors de la Seconde Guerre mondiale, plusieurs chars Type 95 Ha-Go furent abandonnés en Indochine française. L'armée française en a récupéré un certain nombre, les a réparés et remis en service pour des opérations coloniales. Au début des années 1950, ces chars furent remis en nombre limité à l'Armée Nationale Vietnamienne (ANV), l'armée de l'État du Vietnam dirigée par le chef de l'État Bao-dai. Au milieu des années 1950, la plupart des chars Ké-Go avaient été retirés du service de première ligne, soit en raison de l'usure mécanique, soit de leur remplacement par des véhicules blindés plus performants fournis par les Français et les États-Unis, tels que le M24 Chaffee."
 VIE_lt_equipment_2: "Char léger, M24"
 VIE_lt_equipment_2_short: "M24"
 VIE_lt_equipment_2_desc: "Le M24 Chaffee est un char léger développé par le Département des munitions de l'armée américaine en 1944, vers la fin de la Seconde Guerre mondiale, le Boogaloo électrique. Le M24 possède un blindage de 38 mm et un canon principal de 75 mm. Le moteur est un V8 Twin Cadillac avec une transmission Hydramatic qui peut se déplacer à peu près de la même manière que le M5 Stuart. Au combat, le petit canon du M5 Stuart s'est avéré être une lacune importante, notamment lors de la campagne d'Afrique du Nord. C'est peu de temps après que le M24 Chaffee fut développé dans le but de lui donner plus de puissance de feu pour mieux remplir son rôle."
 VIE_lt_equipment_3: "Char de combat à chenilles complètes : canon de 76 mm, M41"
 VIE_lt_equipment_3_short: "M41 Walker Bulldog"
 VIE_lt_equipment_3_desc: "Le M41 est un char de reconnaissance léger développé par Cadillac en 1949. Il a combattu au Vietnam, dans la Baie des Cochons, au Liban et en Somalie. Son blindage varie de 19 mm à 31,7 mm. Il est armé d'un canon principal de 76 mm, d'une mitrailleuse coaxiale de calibre.30 et d'un canon de toit de calibre.50. Il utilise un moteur essence Continental 6 cylindres et fonctionne jusqu'à 45 mph avec une autonomie opérationnelle de 100 miles. Le développement du M41 progressait lentement avec peu de financement, mais lorsque la guerre de Corée a éclaté, l'armée américaine a commencé à précipiter le programme. La précipitation a causé un grand nombre de problèmes dans le programme et des problèmes de taille excessive. Le M41, en raison de graves problèmes liés à la précipitation du programme, a été produit pendant très peu de temps et n'a pas été utilisé pendant la guerre de Corée. En fait, la production n'a démarré qu'en 1951 et n'a duré que 3 ans."
 VIE_lt_equipment_4: "Char de combat à chenilles complètes : canon de 76 mm, M41A1"
 VIE_lt_equipment_4_short: "M41A1 Walker Bouledogue"
 VIE_lt_equipment_4_desc: "Le M551 Sheridan est un char de reconnaissance aéroporté amphibie conçu par Cadillac en 1966. Il a été utilisé au Vietnam, dans l'Opération Just Cause juste parce que et dans Desert Storm. Le M551 Sheridan possède un canon principal de 152 mm et 2 canons secondaires. Le réservoir est équipé d'un moteur diesel turbocompressé à 6 cylindres 6V53T et d'une vitesse allant jusqu'à 43 mph et d'une vitesse de nage de 3,6 mph. Le blindage est une coque en aluminium avec une tourelle en acier. Il fut immédiatement mis en service au Vietnam en raison de sa mobilité et de sa polyvalence, où il joua un rôle exceptionnel. Le canon principal de 152 mm peut respectivement lancer un ATGM ou des munitions conventionnelles. Le M551 a été critiqué par nombre de ses opérateurs en raison de la difficulté d'utilisation en combat direct, mais il a quand même rempli efficacement son rôle malgré sa mauvaise réputation."
 VIE_lt_equipment_5: "Char de combat à chenilles complète : canon de 76 mm, M41A3"
 VIE_lt_equipment_5_short: "Bouledogue marcheur M41A3"
 VIE_lt_equipment_5_desc: "Le M3 Bradley CFV est très similaire au M2 Bradley IFV (Infantry Fighting Vehicle) et est équipé de la même tourelle Bushmaster Cannon pour deux hommes de 25 mm avec une mitrailleuse coaxiale M240C de 7,62 mm. Il ne diffère du M2 que de quelques manières subtiles et selon les rôles. Le M3 est classé comme véhicule blindé de reconnaissance et de reconnaissance et supprime les ports de tir de la série M2. Le M3 transporte également plus de missiles TOW ainsi que plus de munitions pour ses canons de 25 mm et 7,62 mm."
 VIE_lt_equipment_6: "M3A2 Bradley ODS"
 VIE_lt_equipment_6_short: "M3A2 Bradley ODS"
 VIE_lt_equipment_6_desc: "Le M3A2 incorporait des améliorations de blindage améliorées, telles que la possibilité de monter un blindage réactif explosif, du M2A2 Bradley. Après les essais de tir réel, la disposition des sièges et du rangement des munitions a également été modifiée, les observateurs étant déplacés vers un banc sur le côté gauche du véhicule et le rangement du missile réorganisé pour améliorer la sécurité."

 VIE_ht_equipment_1: "M4A3E2 Sherman Jumbo"
 VIE_ht_equipment_1_short: "M4A3E2 géant"
 VIE_ht_equipment_1_desc: "Blindage supplémentaire (dont 1 pouce à l'avant), tourelle à côtés verticaux, mais environ 3-4 mph plus lente. Construit avec un canon de 75 mm mais fréquemment réarmé par les unités utilisant des canons de 76 mm. Connecteurs d'extrémité allongés (CEE) de style « bec de canard » installés sur le bord extérieur des voies."
 VIE_ht_equipment_2: "T26E4 Super Pershing"
 VIE_ht_equipment_2_short: "T26E4 Super Pershing"
 VIE_ht_equipment_2_desc: "Le Super Pershing était une variante plus lourde du M26 de base. Un blindage plus lourd était attaché au char et le canon T15E1 plus long remplaçait le canon M3 dans le but d'égaler la puissance de feu du King Tiger."
 VIE_ht_equipment_3: "T32"
 VIE_ht_equipment_3_short: "T32"
 VIE_ht_equipment_3_desc: "Les travaux commencèrent au début de 1945 pour développer une variante nettement plus lourde du M26 Pershing. En utilisant les données collectées dans le cadre du projet T29 Heavy Tank et en incorporant un canon principal expérimental de 90 mm tirant des munitions rigides composites perforantes ainsi qu'une transmission plus avancée, le premier char T32 a été produit. Le canon T15E2 monté sur ce char était beaucoup plus puissant que celui monté sur le Pershing, et comme le T26E4 Super Pershing qui utilisait un canon expérimental similaire de 90 mm, le contrepoids à l'arrière de la tourelle a été considérablement agrandi pour compenser le poids du canon d'épaule."
 VIE_ht_equipment_4: "char de combat M103 de 120 mm"
 VIE_ht_equipment_4_short: "M103"
 VIE_ht_equipment_4_desc: "Le M103 était un char lourd créé en 1957 par Chrysler. 100 unités ont été construites et déployées mais n'ont pas réellement participé au combat. Il comportait un blindage de 127 à 254 mm et un canon principal de 120 mm avec 3 MG secondaires. Il avait une vitesse maximale de 21 mph et une autonomie opérationnelle de 80 utilisant 280 gallons pendant cette période. Le moteur était un moteur à essence AV1790 12 cylindres. Le char lui-même a servi dans le corps des marines, mais n'a pas participé au combat, car les unités dans lesquelles il a été déployé n'ont jamais pu l'utiliser."
 VIE_ht_equipment_5: "char de combat avec canon de 120 mm M103A2"
 VIE_ht_equipment_5_short: "M103A2"
 VIE_ht_equipment_5_desc: "Le M103A2 est une amélioration du M103 fabriqué dans les années 60 par Chrysler. 200 unités ont été créées mais elles n'ont pas vu le combat. Il a remplacé le moteur du M103 par un moteur AVDS1790-2 V12 biturbo, lui conférant des avantages significatifs par rapport au M103. Le moteur amélioré pouvait parcourir 295 miles à 23 mph et avait une mobilité significative en utilisant le même carburant que le M103. D'autres améliorations mineures ont également été apportées aux pièces du M103, comme un modèle de transmission légèrement différent, mais qui était finalement le même. Le M103A2 fut le dernier char lourd créé par les États-Unis, car les chars de combat principaux supplantaient le besoin de chars lourds et pouvaient transporter plus de puissance de feu avec moins de poids et plus de mobilité."

 #VIE_sht_equipment_1_: "T95 GMC"
 #VIE_sht_equipment_1_short: "T95 Gun Motor Carriage"
 #VIE_sht_equipment_1_desc: "The T95 Gun Motor Carriage is a super heavy bunker destroyer developed in 1945 by the Pacific Car and Foundry. It never saw combat and only 2 prototypes were created. It weighs 95 tons and is 36x14x9 ft large needing a crew of 4 individuals. The armor is 1ft thick in every part and used a GAF V-8 engine. The tank uses 2 tracks and a horizontal volute spring suspension. The T95 is equipped with a 105mm main gun and has a M2 Browning secondary armament. It was initially designed to break through German defenses and was later considered for the invasion of the Japanese mainland. Production was already planned but the dropping of the 2 atomic bombs ended the war and the project was cancelled before a unit could be manufactured."
 #VIE_sht_equipment_2_short: "Chrysler K"
 #VIE_sht_equipment_2_desc: "The Chrysler K is a super heavy tank designed by Chrysler in 1946 by Chrysler. Only 2 prototypes were created. The tank's weight, engine, and exact dimensions are unknown. The Chrysler K featured a 105mm main gun with 2 secondary MGs. Unlike the T95, the Chrysler K only had 1 set of ultrawide tracks. The Chrysler K was eventually cancelled as the project went over-budget."
 #VIE_sht_equipment_3_short: "R-32"
 #VIE_sht_equipment_3_desc: "The R32 is an experimental nuclear superheavy tank designed by Chrysler in the 50s. The R32 never reached prototype phase but some parts were manufactured. The R32 was designed to carry a nuclear powered electric engine and a 120mm main gun with 3 secondary MGs. The nuclear engine was estimated to give it a speed of 40 mph and an almost limitless travelling range as a result of nuclear power being its source of fuel. The armor was designed to be 127-254mm thick. The project was cancelled quickly after its inception due to a large number of hangups in the lack of technology needed to create the design and skepticism on behalf of the US General Staff in charge of funding the project."

 VIE_mbt_equipment_0: "M4 Sherman"
 VIE_mbt_equipment_0_short: "M4 Sherman"
 VIE_mbt_equipment_0_desc: "Le M4 Sherman est un char moyen conçu par l'US Army Ordnance Department en 1940 pour la Seconde Guerre mondiale. Il a été prêté et loué à de nombreux pays à partir de 1940. Le Sherman peut manier un canon principal de 75 mm, 76 mm ou 105 mm et disposait généralement d'un canon secondaire Browning. Il est propulsé par un moteur à essence radial C4 9 cylindres capable de transporter le véhicule à une vitesse de 22 à 30 mph sur 100 à 150 miles avant de devoir faire le plein. C'était fiable, peu coûteux à produire et un rêve humide pour tout logicien. Il était très compact et facile à transporter en grand nombre, ce qui rendait l'expédition du véhicule à travers l'Atlantique extrêmement facile. Le M4 était également très polyvalent et capable de fonctionner dans une grande variété de conditions."
 VIE_mbt_equipment_1: "M26"
 VIE_mbt_equipment_1_short: "M26 Pershing"
 VIE_mbt_equipment_1_desc: "Le M26 Pershing est un char moyen conçu par le Département des munitions de l'armée américaine en 1944. Il a combattu pendant la Seconde Guerre mondiale et la guerre de Corée. Le M26 Pershing est particulièrement lourd pour un char moyen avec une vitesse tout-terrain exceptionnellement faible. Son moteur Ford GAF 8 cylindres pourrait le transporter jusqu'à 100 miles à 30 mph sur route, mais en tout-terrain, il atteint 5,25 mph. Son canon principal est un canon de 90 mm et peut utiliser un browning M2. Cependant, pendant la guerre de Corée, le M2 browning de calibre.50 a été remplacé par 2 canons M1919.30-06 en raison de la grande quantité de cibles souples sur le terrain et de la nécessité de transporter 9 fois plus de munitions plutôt que plus de puissance de feu. Le M26 était peut-être un char moyen, mais il est extrêmement lourd et peut être considéré comme un char hybride moyen/lourd."
 VIE_mbt_equipment_2: "M46 Patton"
 VIE_mbt_equipment_2_short: "M46 Patton"
 VIE_mbt_equipment_2_desc: "Le M46 Patton est un char moyen conçu par le Département des munitions de l'armée américaine en 1949. Il a combattu pendant la guerre de Corée et a été conçu pour remplacer le M26 Pershing en raison de son poids excessif. Il dispose d'un canon principal de 90 mm et d'un blindage de 102 mm. Il peut être équipé d'un seul Browning M2 ou de deux Browning M1919. Le M46 Patton utilise un moteur V12 biturbo qui atteint une vitesse de 15 à 30 mph et a une autonomie opérationnelle de 30 à 80 miles. Il a été produit en grande série dans le but de remplacer les anciens modèles. Il était à la pointe des conceptions et des armes modernes et ne souffrait pas d'un poids élevé."
 VIE_mbt_equipment_3: "Char de combat à chenilles complète : canon de 90 mm, M47"
 VIE_mbt_equipment_3_short: "M47 Patton"
 VIE_mbt_equipment_3_desc: "Le M47 Patton est l'un des premiers chars de combat principaux et a été conçu par le département des munitions de l'armée américaine en 1951. Il est très similaire au M46 Patton mais avec une tourelle de canon mise à jour avec un mécanisme interne amélioré et une transmission améliorée. Il a connu des combats lors de la crise de Suez, de la guerre des 6 jours et des guerres yougoslaves."
 VIE_mbt_equipment_4: "Char de combat à chenilles complète : canon de 90 mm, M48"
 VIE_mbt_equipment_4_short: "M48 Patton"
 VIE_mbt_equipment_4_desc: "Le M48 Patton est un CCP conçu par le Département des munitions de l'armée américaine en 1953. Le M48 est doté d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Le moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents avec un système d'injection de carburant léger et est suralimenté. Il a une autonomie de fonctionnement hors route de 160 milles et de 300 milles sur route. Il peut rouler sur route à 30 mph, mais atteint 20 mph hors route grâce au moteur, à la transmission et aux chenilles améliorés. Il a servi de char principal pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton mais il s'agit d'un tout nouveau design avec de nouveaux mécanismes internes. Il est utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la Garde nationale exploitaient et entretenaient encore des M48 jusqu'à la fin des années 80."
 VIE_mbt_equipment_5: "Char de combat à chenilles complète : canon de 90 mm, M48A3"
 VIE_mbt_equipment_5_short: "M48A3 Patton"
 #VIE_mbt_equipment_5_desc: ""
 VIE_mbt_equipment_6: "Char de combat à chenilles complète : canon de 105 mm, M48A5"
 VIE_mbt_equipment_6_short: "M48A5 Patton"
 #VIE_mbt_equipment_6_desc: ""
 VIE_mbt_equipment_7: "Char de combat à chenilles complète : canon de 120 mm, M1A1"
 VIE_mbt_equipment_7_short: "M1A1 Abrams"
 VIE_mbt_equipment_7_desc: "Le char de combat principal M1A1 Abrams a été développé par General Dynamics. Il s'agit d'un développement ultérieur du M1 Abrams. Le M1A1 a été dévoilé en 1985 et la production a débuté la même année. Le M1A1 dispose d'une protection de blindage de tourelle améliorée par rapport à son prédécesseur. L'une des améliorations les plus importantes par rapport au M1 est le canon à âme lisse M256 de 120 mm, initialement développé par Rheinmetall et produit sous licence aux États-Unis."
 VIE_mbt_equipment_8: "Char de combat à chenilles complètes : canon de 120 mm, M1A2"
 VIE_mbt_equipment_8_short: "M1A2 Abrams"
 VIE_mbt_equipment_8_desc: "Le M1A2 Abrams est une amélioration apportée au M1 par GDLS au début des années 80. Le char utilise un blindage composite renforcé de mailles d'uranium appauvri mesurant environ 600 mm. Les chars sont également livrés avec des ajouts optionnels tels qu'un blindage réactif, un kit de survie urbaine et un système d'armes télécommandé. Il dispose d'un canon principal à âme lisse de 120 mm et surpasse la plupart des autres chars. Il dispose également d'une électronique améliorée, de contre-mesures ATGM et d'un système de lutte contre les incendies. Cependant, aucune amélioration n'a été apportée à la transmission, à la suspension ou au moteur et, en tant que tel, il est plus près du sol et pèse beaucoup plus. Il peut se déplacer sur route à 42 mph ou hors route à 25 mph avec une portée opérationnelle plus courte. Il a été utilisé en Afghanistan, dans le Golfe et en Irak, où il a démontré une capacité de survie inégalée contre la plupart des armes antichar utilisées par ses adversaires."
 VIE_mbt_equipment_9: "Char de combat à chenilles complète : canon de 120 mm, M1A2 (SEP)"
 VIE_mbt_equipment_9_short: "M1A2 Abrams SEP"
 VIE_mbt_equipment_9_desc: "Le M1A2 System Enhancement Package (SEP) est le successeur du M1A2. Il s'agit également d'un package de mise à niveau pour les anciens chars Abrams. Il présente une protection blindée améliorée, des composants système améliorés, des composants informatiques améliorés et quelques autres améliorations. Le premier char amélioré a été livré en 1999."

 VIE_mechanized_equipment_1: "Demi-piste M2"
 VIE_mechanized_equipment_1_short: "Demi-piste M2"
 VIE_mechanized_equipment_1_desc: "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 VIE_mechanized_equipment_2: "Demi-piste M3"
 VIE_mechanized_equipment_2_short: "Demi-piste M3"
 VIE_mechanized_equipment_2_desc: "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 VIE_mechanized_equipment_3: "Demi-piste M3A1"
 VIE_mechanized_equipment_3_short: "Demi-piste M3A1"
 VIE_mechanized_equipment_3_desc: "Le M3A1 est un semi-chenillé M3 doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
 VIE_mechanized_equipment_4: "Camion canon REO M35A1"
 VIE_mechanized_equipment_4_short: "Camion canon M35A1"
 VIE_mechanized_equipment_4_desc: "Les premières conversions plus sophistiquées du modèle ont été réalisées par l'armée américaine au Vietnam. Les bataillons d'artillerie de l'armée américaine (armes automatiques, automotrices) se voyaient souvent attribuer des batteries d'artillerie (calibre.50), des unités équipées de camions M35 et de systèmes M55 Quadmount équipés de quatre mitrailleuses M2 Browning."
 VIE_mechanized_equipment_5: "Transporteur, personnel, entièrement chenillé, blindé, M113"
 VIE_mechanized_equipment_5_short: "M113"
 VIE_mechanized_equipment_5_desc: "Les APC américains les plus reconnaissables depuis les années 60. Il est largement utilisé et, grâce à des années de recherche, il en a fait un véritable véhicule blindé de transport de troupes, en utilisant sa hauteur, son angle de blindage et son épaisseur. Et plus tard, introduisant de plus en plus de variantes, s'armant d'un M2 Browning.50 Cal avec quelques milliers de tours de liberté. Se vante vraiment d'être un bon APC. Des dizaines de variantes provenaient de la gamme du M113, toujours utilisée par l'armée américaine à ce jour."
 VIE_mechanized_equipment_6: "Transporteur, personnel, entièrement chenillé, blindé, M113A1"
 VIE_mechanized_equipment_6_short: "M113A1"
 VIE_mechanized_equipment_6_desc: "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), pour profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
 VIE_mechanized_equipment_7: "Transporteur, personnel, entièrement chenillé, blindé, M113A2"
 VIE_mechanized_equipment_7_short: "M113A2"
 VIE_mechanized_equipment_7_desc: "Le M113A2 est une variante améliorée du M113 fabriquée par Food Machinery Corporation à la fin des années 70. Il a vu des combats partout où le M113 est présent. Dans l'A1, le moteur a été remplacé par le 6V-53. Dans l'A2, le refroidissement du moteur a été amélioré, des barres de torsion plus résistantes ont été introduites pour augmenter la garde au sol, des amortisseurs ont été ajoutés à la suspension, les réservoirs de carburant ont été blindés et des lance-fumées ont été ajoutés."
 VIE_mechanized_equipment_8: "Transporteur, personnel, entièrement chenillé, blindé, M113A3"
 VIE_mechanized_equipment_8_short: "M113A3"
 VIE_mechanized_equipment_8_desc: "En 1987, d'autres améliorations pour une « survie améliorée (sur le champ de bataille) » ont été introduites. Cela comprenait un joug pour la direction au lieu des latéraux, un moteur plus puissant (le Detroit Diesel turbocompressé 6V-53T), des réservoirs de carburant externes et des revêtements internes anti-éclats pour une protection améliorée. Le suffixe A3 est utilisé sur toutes les variantes pour indiquer la mise à niveau vers la norme A3."
 VIE_mechanized_equipment_9: "Véhicule de combat d'infanterie M1126 Stryker"
 VIE_mechanized_equipment_9_short: "M1126 Stryker ICV"
 VIE_mechanized_equipment_9_desc: "Le STRYKER est un APC développé par General Dynamics en 1999. Il a été utilisé pendant la guerre en Afghanistan. Le Stryker utilise un moteur C7 Caterpillar avec une suspension 8x8. Il peut se déplacer jusqu'à 60 mph sur 310 miles. Avec près d'un an et demi de retard, l'équipe General Motors-General Dynamics a remporté le contrat de 8 milliards de dollars en novembre 2000 pour produire 2 131 véhicules d'une variante du LAV III canadien destiné à équiper six équipes de combat de brigade à déploiement rapide d'ici 2008."
 VIE_mechanized_equipment_10: "M1296 Dragon"
 VIE_mechanized_equipment_10_short: "M1296 Dragon"
 VIE_mechanized_equipment_10_desc: "L'armée américaine cherchait à améliorer la puissance de feu du véhicule de transport d'infanterie de base M1126 Stryker. Sa mitrailleuse lourde de 12,7 mm n'était pas particulièrement efficace contre les véhicules blindés modernes. À ce titre, l'armée américaine a approuvé une amélioration de la létalité en équipant un total de 81 Strykers de tourelles légères sans pilote de 30 mm. Cela a considérablement augmenté la puissance de feu du Stryker tout en préservant la mobilité du véhicule."

 VIE_mechanized_heavy_equipment_1: "M44"
 VIE_mechanized_heavy_equipment_1_short: "M44"
 VIE_mechanized_heavy_equipment_1_desc: "Le M44 est un APC super-lourd développé par le département des munitions de l'armée américaine en 1951. Le M44 est équipé d'un moteur AOS-895-3 et d'une suspension à barre de torsion. Il peut se déplacer à 15 mph hors route avec une portée opérationnelle de 60 miles. Le projet M44 a été annulé et seuls 6 prototypes ont été créés. Malgré cela, certains prototypes ont été testés sur le terrain et combattus pendant la guerre de Corée. Même s'il était extrêmement blindé et pouvait transporter 24 passagers, il était très lent et constituait une cible de grande taille."
 VIE_mechanized_heavy_equipment_2: "Transporteur, personnel, entièrement chenillé, blindé, M75"
 VIE_mechanized_heavy_equipment_2_short: "M75"
 VIE_mechanized_heavy_equipment_2_desc: "Le M75 est un APC lourd développé par l'International Harvester Corporation au début des années 1950. Le M75 a été largement utilisé pendant la guerre de Corée, mais a ensuite été abandonné très rapidement. Le M75 est équipé d'un moteur à essence 6 cylindres AO-895-4 et d'une suspension à barre de torsion. Il peut se déplacer à 43 mph avec une autonomie de 115 miles. Après que le projet M44 ait été annulé en raison de sa taille excessive, le développement d'un autre PC lourd entièrement fermé a commencé. Le projet M75 a abouti à un châssis beaucoup plus petit, bien plus rapide que le M44. Cependant, il était toujours considéré comme trop important et le projet M95 a continué à bénéficier de financements"
 VIE_mechanized_heavy_equipment_3: "Transporteur, personnel, entièrement chenillé, blindé, M113 ACAV"
 VIE_mechanized_heavy_equipment_3_short: "M113 ACAV"
 VIE_mechanized_heavy_equipment_3_desc: "Le M113 ACAV, également connu sous le nom de M150, est un véhicule blindé d'assaut de cavalerie, qui est une des premières formes de l'IFV. Le M113 ACAV a été développé dans les années 60 par la Food Machinery Corporation. Le M113 ACAV est similaire au M113 dans la plupart des aspects. La variante ACAV du M113 embarque un lanceur TOW et peut potentiellement être équipée d'une tourelle armée d'un lance-flammes comme on le voit au Vietnam. Le M113 ACAV a été utilisé partout où le M113 était utilisé."
 VIE_mechanized_heavy_equipment_4: "Transporteur, personnel, entièrement chenillé, blindé, M113A1 ACAV"
 VIE_mechanized_heavy_equipment_4_short: "M113A1 ACAV"
 VIE_mechanized_heavy_equipment_4_desc: "Version M113A1 ACAV avec des armes supplémentaires telles qu'un fusil sans recul."
 VIE_mechanized_heavy_equipment_5: "M2 Bradley"
 VIE_mechanized_heavy_equipment_5_short: "M2 Bradley"
 VIE_mechanized_heavy_equipment_5_desc: "Le M2 Bradley est un IFV amphibie développé par BAE Systems Land & Armaments en 1981. Le M2 Bradley a participé à tous les conflits américains depuis sa création, y compris Desert Storm. Le projet M2 Bradley visait à créer une nouvelle génération de PC pour l'ère moderne, dotés d'une protection NBC. Le projet a débuté à la fin des années 60 et a connu de nombreux prototypes pour arriver là où il est aujourd'hui. Le Bradley utilise un moteur 8 cylindres VTA-903T et est doté d'une suspension à barre de torsion. Le Bradley est armé d'un canon automatique de 25 mm et d'un accessoire TOW antichar. BAE a été chargé de créer un transport d'infanterie qui était bae. S'inspirant des prototypes du projet MICV, le Bradley est capable de reconnaissance et de soutien à l'infanterie qu'il transporte. Bien qu'il soit doté d'un blindage en aluminium, sa puissance de feu et sa mobilité sont utilisées pour se protéger sur le terrain."
 VIE_mechanized_heavy_equipment_6: "M2A2 Bradley"
 VIE_mechanized_heavy_equipment_6_short: "M2A2 Bradley"
 VIE_mechanized_heavy_equipment_6_desc: "Introduit en 1988, l'A2 a reçu un moteur amélioré de 600 chevaux (447 kW) avec une transmission hydromécanique HMPT-500-3 et un blindage amélioré (à la fois passif et capable de monter un blindage réactif explosif). Le nouveau blindage protège le Bradley contre les obus APDS de 30 mm et les RPG (ou armes anti-blindage similaires). Le nouveau blindage éliminait également la girouette qui rendait le Bradley amphibie et recouvrait les ports de tir latéraux."
 VIE_mechanized_heavy_equipment_7: "M2A2 Bradley ODS"
 VIE_mechanized_heavy_equipment_7_short: "M2A2 Bradley ODS"
 VIE_mechanized_heavy_equipment_7_desc: "Le M2 ODS Bradley est une variante améliorée du Bradley développé par BAE Systems en 1991. L'ODS présentait un intérieur optimisé, un blindage réactif explosif et une transmission hydromécanique. Bien que l'armure réactive ait eu un coût et a empêché le Bradley de nager. L'ODS a également ajouté un meilleur télémètre, un système de navigation, une contre-mesure de missile et un système d'imagerie thermique. De plus, un très petit chauffe-aliments et une station de confort ont été ajoutés, ce qui est considéré par certains comme la meilleure innovation."
 VIE_mechanized_heavy_equipment_8: "M2A3 Bradley"
 VIE_mechanized_heavy_equipment_8_short: "M2A3 Bradley"
 VIE_mechanized_heavy_equipment_8_desc: "Le M2A3 Bradley est une nouvelle amélioration du Bradley développé par BAE Systems en 2000. L'A3 a rendu le Bradley entièrement numérique et a rendu tout ce qui se trouvait dans le véhicule contrôlable à distance. De nombreuses améliorations du blindage ont également été ajoutées pour rendre le véhicule plus résistant. De plus, la boîte à outils NBC du Bradley, qui comprend une radioprotection supplémentaire, des filtres à air et une résistance chimique, a été ajoutée. "

 VIE_mechanized_marine_equipment_1: "Buffle d'eau LVT-4"
 VIE_mechanized_marine_equipment_1_short: "LVT-4"
 VIE_mechanized_marine_equipment_1_desc: "Le LVTP-4 est un véhicule d'atterrissage amphibie conçu par Ford Machinery Corporation au début des années 40. Le LVTP-4 a été utilisé pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Il utilise un moteur radial à 7 cylindres W-670-9A et peut parcourir jusqu'à 75 miles dans l'eau à 7 mph. Evolution du LVTP-1, le LVTP-4 est capable de parcourir des distances incroyables, bien qu'à des vitesses lentes. Si vous devez traverser 70 milles d'eau et disposer d'environ 10 heures pour le faire, le LVTP-4 est votre véhicule de choix. Il est capable de transporter des troupes ou des véhicules. "
 VIE_mechanized_marine_equipment_2: "LVTP-5"
 VIE_mechanized_marine_equipment_2_short: "LVTP-5"
 VIE_mechanized_marine_equipment_2_desc: "Le LVTP-5 est un APC amphibie conçu par la Food Machinery Corporation en 1956. Il a combattu au Vietnam. Le LVTP-5 utilise un moteur V12 LV-1790-1 et peut parcourir jusqu'à 57 miles dans l'eau à 7 mph. Il s'agit d'une évolution du LVTP-4 et est beaucoup plus résistant et fiable que son prédécesseur. De plus, des variantes ont été créées pour permettre à son châssis d'être utilisé dans des véhicules d'appui-feu tels qu'un obusier de 105 mm. Une variante AA a été prototype mais n'est jamais entrée en fabrication."
 VIE_mechanized_marine_equipment_3: "LVTP-7"
 VIE_mechanized_marine_equipment_3_short: "LVTP-7"
 VIE_mechanized_marine_equipment_3_desc: "Le LVTP-7 est un APC amphibie conçu en 1972 par la Food Machinery Corporation. Des conflits ont eu lieu aux Malouines, à la Grenade, dans le Golfe, en Syrie et en Irak. Le LVTP-7 utilise un moteur 8V-53T et peut parcourir 23 miles à 8,2 mph dans l'eau. Plus particulièrement, le LVTP-7 est capable de voyager dans un état de mer 5, qui est classé comme « agité » avec un gonflement de mer moyen à élevé, ce qui le rend excellent pour faire face à des conditions météorologiques difficiles que le LVTP-5. De plus, il est bien plus blindé que le LVTP-5. Parce qu'il peut voyager de manière impressionnante dans un état de mer 5 et qu'il est mieux protégé, il a remplacé le LVTP-5. Il comporte également des disperseurs de fumée."
 VIE_mechanized_marine_equipment_4: "LVTP-7A1"
 VIE_mechanized_marine_equipment_4_short: "LVTP-7A1"
 VIE_mechanized_marine_equipment_4_desc: "Le LVTP-7A1 est un APC amphibie conçu en 1984 par la Food Machinery Corporation. Elle a connu des combats dans le Golfe, en Syrie et en Irak. Le LVTP-7A1 utilise un moteur VTAC RAM-RS de 525 ch et peut voyager à peu près de la même manière que le LVTP-7. Il dispose d'un moteur, d'une transmission et d'un système d'armes améliorés et est plus facile à entretenir que le LVTP-7. Il comporte également un certain nombre d'améliorations en matière de sécurité pour réduire les effets des coups. "
 VIE_mechanized_marine_equipment_5: "Véhicule d'assaut amphibie avancé EFVP-1"
 VIE_mechanized_marine_equipment_5_short: "EFVP-1 AAAV"
 VIE_mechanized_marine_equipment_5_desc: "L'EFVP-1 AAAV est un projet IFV amphibie conçu par General Dynamics qui a été annulé. L'EFVP-1 utilisait un moteur MT 883 ka, même s'il était probable qu'il utiliserait un moteur différent au fur et à mesure de la production. Il est capable de parcourir 75 miles dans l'eau à une vitesse de nage impressionnante de 28,6 mph. Le véhicule aurait également comporté une tourelle de style IFV pour un appui-feu supplémentaire. Les armements exacts sont inconnus, mais il pourrait potentiellement contenir n'importe quoi, des canons automatiques aux ATGM. Le projet a coûté 3 milliards de dollars à développer, mais a finalement été annulé car il a été estimé qu'il en coûterait 12 milliards supplémentaires pour créer le reste de ce que le véhicule souhaitait faire. Il a assisté à un combat dans la piscine du terrain d'essai lorsqu'un morceau s'est détaché pendant les tests et l'un des concepteurs, en colère qu'il ait recommencé, lui a donné un coup de pied assez fort pour se casser le pied. "

 VIE_motorized_equipment_1: "Citroën U23"
 VIE_motorized_equipment_1_short: "U23"
 VIE_motorized_equipment_1_desc: ""
 VIE_motorized_equipment_2_short: "Modèle DW 15L 2,5t 6x6"
 #VIE_motorized_equipment_2_desc: ""
 VIE_motorized_equipment_3: "RÉO M35A2"
 VIE_motorized_equipment_3_short: "M35A2"
 VIE_motorized_equipment_3_desc: "Le M35A2 est généralement propulsé par un moteur LDT 465, fabriqué par Continental Motors Company, Hercules ou White Motor Company. Il s'agit d'un moteur multicarburant turbocompressé à six cylindres en ligne de 478 pouces cubes (7,8 L) développant 134 ch (100 kW) et 330 livres-pieds (447 Nm) de couple. Ceci est couplé à une transmission manuelle à 5 vitesses et à une boîte de transfert divorcée à 2 vitesses (soit une boîte de transfert à cames Rockwell 136-21, soit une boîte de transfert pneumatique sélectionnable Rockwell 136-27)."
 VIE_motorized_equipment_4: "M939"
 VIE_motorized_equipment_4_short: "M939"
 VIE_motorized_equipment_4_desc: "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 utilise un moteur 6CTA8.3, une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Le véhicule est capable de transporter une charge de 10 000 lb. Il peut se déplacer à 6,3 mph sur 350 miles et obtient 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et convient bien aux intempéries. Le M939 a permis une nouvelle génération de camions, de moteurs principaux et de véhicules de dépannage et a fait l'objet d'une fabrication intensive. Il est plus fiable et plus résistant que les véhicules précédents et a complètement supplanté les contrats de production antérieurs. "
 VIE_motorized_equipment_5: "Famille Oshkosh de véhicules tactiques moyens 6x6"
 VIE_motorized_equipment_5_short: "FMTV 6x6"
 VIE_motorized_equipment_5_desc: "La famille de véhicules tactiques moyens (FMTV) est une série de véhicules, basés sur un châssis commun, qui varient en fonction de la charge utile et des exigences de la mission. Le FMTV est dérivé du camion autrichien Steyr 12 M 18, mais considérablement modifié pour répondre aux exigences de l'armée américaine, celles-ci comprenant un minimum de 50 pour cent de contenu américain."

