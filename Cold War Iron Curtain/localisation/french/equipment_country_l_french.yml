 DEN_atgm_carrier_equipment_4_short:0 "M113G3DK ETS"
 DEN_atgm_carrier_equipment_4_desc:0 "Le système TOW surélevé (ETS) est un système d'arme TOW, équipé d'un lanceur à 2 ou 4 tubes et d'un mât surélevé pouvant atteindre 6,5 mètres au-dessus du sol. Les missiles TOW peuvent être lancés depuis n'importe quelle position. Cela permet au système, une fois déployé, d'exploiter au maximum le terrain et les autres structures. L'ETS permet d'utiliser toute la gamme des missiles TOW (y compris les TOW-2A et TOW-2B)."
