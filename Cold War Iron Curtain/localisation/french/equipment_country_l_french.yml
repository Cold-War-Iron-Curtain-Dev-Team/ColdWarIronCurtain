 JAP_sht_equipment_1: "O-je"
 JAP_sht_equipment_1_short: "O-je"
 JAP_sht_equipment_1_desc: "Une piste de char issue du projet est exposée à l'école JGSDF Fuji au Japon. En fin de compte, l'histoire complète du prototype O-I est inconnue en raison de la nature obscure du projet et de la documentation limitée ayant survécu après la guerre."

 JAP_mechanized_equipment_1: "Ho-Ki de type 1"
 JAP_mechanized_equipment_1_short: "Ho-Ki de type 1"
 JAP_mechanized_equipment_1_desc: "Le transport de troupes blindé de type 1 Ho-Ki était un transport de troupes blindé à chenilles (APC) développé par l'armée impériale japonaise pendant la Seconde Guerre mondiale."
 JAP_mechanized_equipment_2: "Demi-piste M3"
 JAP_mechanized_equipment_2_short: "Demi-piste M3"
 JAP_mechanized_equipment_2_desc: "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 JAP_mechanized_equipment_3: "Demi-chenille M5"
 JAP_mechanized_equipment_3_short: "Demi-chenille M5"
 JAP_mechanized_equipment_3_desc: "Le M5 est un M3 Half-track doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit et est une version simplifiée du M3A1. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
 JAP_mechanized_equipment_4: "Transporteur, personnel, entièrement chenillé, blindé, M59"
 JAP_mechanized_equipment_4_short: "M59"
 JAP_mechanized_equipment_4_desc: "Les travaux ont commencé en 1956 sur le développement d'un véhicule blindé de transport de troupes (APC) entièrement chenillé pour équiper la Force terrestre d'autodéfense japonaise, avec deux prototypes achevés par Komatsu (le SU-I) et par Mitsubishi (le SU-II) en 1957. Ces deux prototypes ont été évalués par rapport au M59 américain. Ils furent suivis par une deuxième série de 11 prototypes, comprenant à la fois des APC et des porteurs de mortiers de 81 mm et 107 mm, et une troisième série de quatre prototypes fut achevée et testée en 1959."
 JAP_mechanized_equipment_5: "Komatsu Type 60 Roku-Maru-Shiki"
 JAP_mechanized_equipment_5_short: "Tapez 60"
 JAP_mechanized_equipment_5_desc: "Le véhicule blindé de transport de troupes de type 60 (60, roku-maru-shiki-soukou-sha) est un véhicule blindé de transport de troupes entré en service dans la Force terrestre d'autodéfense japonaise en 1960."
 JAP_mechanized_equipment_6: "Komatsu Type 60 Kai Roku-Maru-Shiki"
 JAP_mechanized_equipment_6_short: "Type 60 Kai"
 JAP_mechanized_equipment_6_desc: "Le véhicule blindé de transport de troupes Type 60 Kai (Kaizen ou amélioré) (60, roku-maru-shiki-soukou-sha) est un véhicule blindé de transport de troupes entré en service dans la Force terrestre d'autodéfense japonaise après 1960."
 JAP_mechanized_equipment_7: "Mitsubishi Type 73 Nana-San-Shiki"
 JAP_mechanized_equipment_7_short: "Tapez 73"
 JAP_mechanized_equipment_7_desc: "Le véhicule blindé de transport de troupes de type 73 (73, nana-san-shiki-soukou-sya) est un véhicule blindé de transport de troupes entré en service dans la Force terrestre d'autodéfense japonaise en 1973."
 JAP_mechanized_equipment_8: "Mitsubishi Type 73 Kai Nana-San-Shiki"
 JAP_mechanized_equipment_8_short: "Type 73 Kai"
 JAP_mechanized_equipment_8_desc: "Le véhicule blindé de transport de troupes Type 73 Kai (Kaizen ou amélioré) (73, nana-san-shiki-soukou-sya) est un véhicule blindé de transport de troupes entré en service dans la Force terrestre d'autodéfense japonaise après 1973."
 JAP_mechanized_equipment_9: "Komatsu Type 96 Kyuu-Roku-Shiki"
 JAP_mechanized_equipment_9_short: "Tapez 96"
 JAP_mechanized_equipment_9_desc: "Le transport de troupes blindé à roues de type 96 (96, kyuu-roku-shiki-sourin-soukou-sya) est un véhicule blindé entré en service au Japon en 1996. "
 JAP_mechanized_equipment_10: "Komatsu Type 96B Kai Kyuu-Roku-Shiki"
 JAP_mechanized_equipment_10_short: "Tapez 96B"
 JAP_mechanized_equipment_10_desc: "Un nouveau prototype 8×8 APC appelé Véhicule blindé à roues (amélioré ou Kaizen) a été remis aux forces armées japonaises pour remplacer les 365 véhicules Type 96 en service. Développé par le ministère japonais de la Défense en collaboration avec Komatsu Limited, ce véhicule à roues de nouvelle génération a été conçu pour offrir une meilleure protection contre les engins explosifs improvisés (IED) avec une disposition similaire à celle du Patria AMV et du Stryker, fournissant à l'armée japonaise une famille de véhicules différents sur un châssis commun. Le nouveau véhicule proposé est plus long, plus haut et plus lourd que le Type 96."

 JAP_mechanized_heavy_equipment_6: "Tapez 89 Hachi-Kyu"
 JAP_mechanized_heavy_equipment_6_short: "Tapez 89"
 JAP_mechanized_heavy_equipment_7: "Tapez 89 Hachi-Kyu Kai"
 JAP_mechanized_heavy_equipment_7_short: "Type 89 Kai"
 JAP_mechanized_heavy_equipment_8: "Tapez 89 Hachi-Kyu SLEP"
 JAP_mechanized_heavy_equipment_8_short: "Type 89 SOMMEIL"
 JAP_mechanized_heavy_equipment_8_desc: "Le Mitsubishi Type 89 IFV (89, Mitsubishi 89-shiki soko-sento-sha) (89 FV) est un véhicule de combat d'infanterie japonais entré en service dans la Force terrestre d'autodéfense japonaise en 1989. Il y avait 58 véhicules en service en 1999 et un total de 120 produits en 2014, dont 300 prévus. L'armement principal du véhicule est un canon KDE Oerlikon Contraves de 35 millimètres. "

