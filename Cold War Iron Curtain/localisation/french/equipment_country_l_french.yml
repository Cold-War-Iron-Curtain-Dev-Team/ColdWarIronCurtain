 BEL_atgm_equipment_0:0 "DTAT ENgin Téléguidé Anti-Char ENTAC"
 BEL_atgm_equipment_0_short:0 "ENTAC"
 BEL_atgm_equipment_0_desc:0 "Le missile a été développé par l'agence gouvernementale française DTAT (Direction Technique des Armements Terrestres) en même temps que le SS.10, développé par le secteur privé."
 BEL_atgm_equipment_1:0 "Nord SS.11"
 BEL_atgm_equipment_1_short:0 "SS.11"
 BEL_atgm_equipment_1_desc:0 "Le développement d'une version améliorée du SS.10 (Nord-5203) a commencé en 1953 sous le nom de Nord-5210. Ce missile était conçu comme une version lourde du SS.10 portable, destiné à être utilisé à partir de véhicules, de navires et d'hélicoptères. Il a été mis en service dans l'armée française sous la désignation SS.11. Il a été le premier missile antichar au monde à être monté sur un hélicoptère (sur des Alouette II)."
 BEL_atgm_equipment_2:0 "MBDA Missile d'infanterie léger antichar 'MILAN' F1"
 BEL_atgm_equipment_2_short:0 "MILAN F1"
 BEL_atgm_equipment_2_desc:0 "MILAN est un produit d'Euromissile, un programme franco-allemand de développement de missiles datant des années 1960. Composé de deux éléments principaux, le lanceur et le missile, le système MILAN utilise un système de guidage semi-automatique à ligne de visée directe (SACLOS)."
 BEL_atgm_equipment_3:0 "MBDA Missile d'infanterie léger antichar 'MILAN' F2"
 BEL_atgm_equipment_3_short:0 "MILAN F2"
 BEL_atgm_equipment_3_desc:0 "MILAN est un produit d'Euromissile. La variante F2 est équipée d'une seule ogive à charge creuse principale avec sonde à distance pour augmenter la pénétration. Il s'agit d'un programme franco-allemand de développement de missiles qui remonte aux années 1960. Composé de deux éléments principaux, le lanceur et le missile, le système MILAN utilise un système de guidage semi-automatique à ligne de visée directe (SACLOS)."
 BEL_atgm_equipment_4:0 "MBDA Missile d'infanterie léger antichar 'MILAN' F3"
 BEL_atgm_equipment_4_short:0 "MILAN F3"
 BEL_atgm_equipment_4_desc:0 "MILAN est un produit d'Euromissile. Le F3 est équipé d'une ogive à charge creuse tandem et d'une balise électronique. Il s'agit d'un programme franco-allemand de développement de missiles qui remonte aux années 1960. Composé de deux éléments principaux, le lanceur et le missile, le système MILAN utilise un système de guidage semi-automatique à ligne de visée directe (SACLOS)."
 BEL_atgm_carrier_equipment_0:0 "Willys MB w/ ENTAC"
 BEL_atgm_carrier_equipment_0_short:0 "Willys MB w/ ENTAC"
 BEL_atgm_carrier_equipment_0_desc:0 "Une jeep Willys MB belge équipée de lance-missiles ENTAC montés à l'arrière."
 BEL_atgm_carrier_equipment_1:0 "Minerva T.T w/ SS.11"
 BEL_atgm_carrier_equipment_1_short:0 "Minerva T.T w/ SS.11"
 BEL_atgm_carrier_equipment_1_desc:0 "Version du Landrover produite sous licence en Belgique, le Minterva T.T pouvait transporter des missiles SS.11 soit montés à l'arrière, soit transportés dans une remorque."
 BEL_atgm_carrier_equipment_2:0 "Bombardier Iltis W/ MILAN"
 BEL_atgm_carrier_equipment_2_short:0 "Bombardier Iltis W/ MILAN"
 BEL_atgm_carrier_equipment_2_desc:0 "Un Bombardier Iltis de fabrication belge équipé d'un lance-missiles MILAN F1 monté sur son toit en position de tir."
 BEL_atgm_carrier_equipment_3:0 "AIFV-B-MILAN"
