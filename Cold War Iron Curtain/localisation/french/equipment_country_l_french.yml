 FRA_lt_equipment_1:0 "M5 Stuart"
 FRA_lt_equipment_1_short:0 "M5 Stuart"
 FRA_lt_equipment_1_desc:0 "Le M5 Stuart était une version plus récente du char léger M3 Stuart, produit en raison de la demande en moteurs d'avion radiaux pendant la Seconde Guerre mondiale. Il dispose d'une coque redessinée avec un pont arrière surélevé, une plaque de glacis inclinée et une trappe pour le conducteur déplacée vers le haut. Il était équipé d'un canon de 37 mm, d'un équipage de quatre personnes, de trois mitrailleuses M1919 et pesait environ 15 tonnes. Il a été utilisé par les États-Unis et d'autres forces alliées tout au long de la Seconde Guerre mondiale, puis dans de nombreux conflits après la guerre."
 FRA_lt_equipment_2:0 "M24"
 FRA_lt_equipment_2_short:0 "M24"
 FRA_lt_equipment_2_desc:0 "Le M24 est un char léger américain qui a été fabriqué par les sociétés Cadillac et Massey-Harris. Il a été utilisé pendant la fin de la Seconde Guerre mondiale et dans certains conflits après la guerre. Il était équipé d'un canon M6 de 75 mm et a été largement utilisé pendant la guerre d'Algérie et la première guerre d'Indochine."
