 JAP_medium_tank_destroyer_equipment_3_desc: "La première production du Type 73, connue sous le nom de camion léger Mitsubishi Type 73 (Kyu) (73-shiki kogata torakku (kyu)) était basée sur les Jeep CJ-3B que Mitsubishi Motors produisait sous licence de Willys."
