 HOL_atgm_carrier_equipment_3:0 "FMC YPR-765 PRAT"
 HOL_atgm_carrier_equipment_3_short:0 "YPR-765 PRAT"
 HOL_atgm_carrier_equipment_3_desc:0 "Une variante de l'AIFV créée pour l'armée royale néerlandaise, équipée d'un lanceur TOW amélioré, appelé lanceur M220 TOW, monté sur le pont arrière. Ce support était repliable, ce qui permettait de tirer à couvert."
 HOL_atgm_carrier_equipment_4:0 "FMC YPR-765A1 PRAT"
 HOL_atgm_carrier_equipment_4_short:0 "YPR-765A1 PRAT"
 HOL_atgm_carrier_equipment_4_desc:0 "Une variante améliorée de l'AIFV avec une protection NBC supplémentaire et une capacité de combat nocturne. Créé pour l'armée royale néerlandaise avec un support de lanceur TOW amélioré, appelé lanceur M220 TOW, monté sur le pont arrière. Ce support était pliable, ce qui permettait de tirer à couvert."
