 YUG_lt_equipment_1: "T-60"
 YUG_lt_equipment_1_short: "T-60"
 YUG_lt_equipment_1_desc: "Le T60 était un char léger fabriqué pour remplacer le T-38 dans son rôle de reconnaissance. Il a été conçu en 1941 par Nicholas Astrov et 6 300 exemplaires ont été produits au cours des 2 années de production. Le véhicule était un char à 2 équipages avec un moteur 6 cylindres et atteint jusqu'à 44 km/h avec un canon principal de 20 mm. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 YUG_lt_equipment_2: "T-70"
 YUG_lt_equipment_2_short: "T-70"
 YUG_lt_equipment_2_desc: "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et l'a terminé en 1942. Au cours des deux années de fabrication, 8 300 exemplaires ont été produits. Le char avait un canon beaucoup plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 YUG_lt_equipment_3: "PT-76"
 YUG_lt_equipment_3_short: "PT-76"
 YUG_lt_equipment_3_desc: "Le PT76 est un char léger amphibie soviétique et a été largement exporté dans le monde entier. Il a été conçu par N Shashmyrin et Zh Kotin en 1951 et environ 12 000 unités ont été fabriquées. Il nécessite un équipage de 3 hommes et un moteur V6 six cylindres en ligne avec une vitesse de 44 km/h et peut nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique et à tendance soviétique et, en tant que tel, a joué un rôle de reconnaissance dans pratiquement tous les conflits des nations de la sphère soviétique. Cependant, il est encore utilisé aujourd'hui dans de nombreux pays en raison de sa célèbre fiabilité et de sa facilité d'entretien."
 YUG_lt_equipment_4: "PT-76B modèle 4"
 YUG_lt_equipment_4_short: "PT-76B"
 YUG_lt_equipment_4_desc: "PT-76 armé du canon de char rayé D-56TS de 76,2 mm (frein de bouche à double chicane, éjecteur de cartouche, extracteur de fumée et système de stabilisation à 2 axes STP-2P 'Zarya'), du système de protection NBC PAZ (protivo-atomnaya zashchita), d'un système d'extinction automatique d'incendie, d'un viseur TShK-2-66 amélioré, d'un système de filtration-ventilation, de dispositifs d'observation améliorés, d'un système électrique amélioré. équipement, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1 800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."
 YUG_lt_equipment_5: "BRM-1K"
 YUG_lt_equipment_5_short: "BRM-1K"
 YUG_lt_equipment_5_desc: "Le BRM-1K est un véhicule de reconnaissance d'origine soviétique de la fin de la Guerre froide. Il a été développé pour soutenir les formations blindées et mécanisées employées par les forces soviétiques. Le BRM-1K devait repérer les itinéraires et détecter les formations ennemies."
 YUG_lt_equipment_6: "M-80A KC"
 YUG_lt_equipment_6_short: "M-80A KC"
 #YUG_lt_equipment_6_desc: ""

