 CHI_mechanized_equipment_1: "Transporteur, Personnel, Half-track, M2"
 CHI_mechanized_equipment_1_short: "Demi-piste M2"
 CHI_mechanized_equipment_1_desc: "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 CHI_mechanized_equipment_2: "Transporteur, Personnel, Half-track, M3"
 CHI_mechanized_equipment_2_short: "Demi-piste M3"
 CHI_mechanized_equipment_2_desc: "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 CHI_mechanized_equipment_3: "Transporteur, Personnel, Half-track, M5"
 CHI_mechanized_equipment_3_short: "Demi-chenille M5"
 #CHI_mechanized_equipment_4: "M8 Light Armored Car"
 #CHI_mechanized_equipment_4_short: "M8 Greyhound"
 CHI_mechanized_equipment_5: "Transporteur, personnel, entièrement chenillé, blindé, M113"
 CHI_mechanized_equipment_5_short: "M113"
 CHI_mechanized_equipment_6: "Transporteur, personnel, entièrement chenillé, blindé, M113A1"
 CHI_mechanized_equipment_6_short: "M113A1"
 CHI_mechanized_equipment_6_desc: "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), pour profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
 CHI_mechanized_equipment_7: "Transporteur, personnel, entièrement chenillé, blindé, M113A2"
 CHI_mechanized_equipment_7_short: "M113A2"
 CHI_mechanized_equipment_7_desc: "Le M113A2 est une variante améliorée du M113 fabriquée par Food Machinery Corporation à la fin des années 70. Il a vu des combats partout où le M113 est présent. Dans l'A1, le moteur a été remplacé par le 6V-53. Dans l'A2, le refroidissement du moteur a été amélioré, des barres de torsion plus résistantes ont été introduites pour augmenter la garde au sol, des amortisseurs ont été ajoutés à la suspension, les réservoirs de carburant ont été blindés et des lance-fumées ont été ajoutés."
 CHI_mechanized_equipment_8: "CM-21A1"
 CHI_mechanized_equipment_8_short: "CM-21A1"
 CHI_mechanized_equipment_9: "CM-31"
 CHI_mechanized_equipment_9_short: "CM-31"
 CHI_mechanized_equipment_10: "CM-33"
 CHI_mechanized_equipment_10_short: "CM-33"

 CHI_mechanized_marine_equipment_1: "Véhicule d'atterrissage, chenillé, Mark 3C"
 CHI_mechanized_marine_equipment_1_short: "LVT-3C"
 CHI_mechanized_marine_equipment_2: "Véhicule d'atterrissage, chenillé (blindé), Mark 4"
 CHI_mechanized_marine_equipment_2_short: "LVT(A)-4"
 CHI_mechanized_marine_equipment_3: "Véhicule d'atterrissage, chenillé, personnel, Mark 5A1"
 CHI_mechanized_marine_equipment_3_short: "LVTP-5A1"
 CHI_mechanized_marine_equipment_4: "Véhicule amphibie d'assaut, personnel, marque 7A1"
 CHI_mechanized_marine_equipment_4_short: "AAVP-7A1"
 CHI_mechanized_marine_equipment_4_desc: "L'AAVP-7A1 est un APC amphibie conçu en 1984 par la Food Machinery Corporation. Elle a connu des combats dans le Golfe, en Syrie et en Irak. L'AAVP-7A1 utilise un moteur VTAC RAM-RS de 525 ch et peut voyager à peu près de la même manière que le LVTP-7. Il dispose d'un moteur, d'une transmission et d'un système d'armes améliorés et est plus facile à entretenir que le LVTP-7. Il comporte également un certain nombre d'améliorations en matière de sécurité pour réduire les effets des coups. "

 CHI_motorized_equipment_1: "GMC CCKW"
 CHI_motorized_equipment_1_short: "GMC CCKW"
 CHI_motorized_equipment_1_desc: "Le GMC CCKW est un camion 6x6 de 2,5 tonnes conçu par General Motors en 1941. Il a été largement utilisé pendant la Seconde Guerre mondiale et la guerre de Corée. Le CCKW utilise un moteur GMC270, une transmission à 5 vitesses/2 gammes et un essieu à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer jusqu'à 45 mph sur 300 miles et atteint 7,5 mi/gal. Le CCKW a été développé pour l'armée américaine en tant que camion de transport et de ravitaillement de troupes. Le camion, en plus d'être utilisé pour le ravitaillement et le transport, pourrait également monter une carrosserie de fourgon pour servir de véhicule de confort/soutien sur le terrain et peut également monter des armes remorquées sur son plateau pour créer des armes SP bon marché."
 CHI_motorized_equipment_2: "M35A1"
 CHI_motorized_equipment_2_short: "M35A1"
 CHI_motorized_equipment_2_desc: "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 CHI_motorized_equipment_3: "M35A2"
 CHI_motorized_equipment_3_short: "M35A2"
 CHI_motorized_equipment_3_desc: "Le M35A2 est généralement propulsé par un moteur LDT 465, fabriqué par Continental Motors Company, Hercules ou White Motor Company. Il s'agit d'un moteur multicarburant turbocompressé à six cylindres en ligne de 478 pouces cubes (7,8 L) développant 134 ch (100 kW) et 330 livres-pieds (447 N⋅m) de couple. Ceci est couplé à une transmission manuelle à 5 vitesses et à une boîte de transfert divorcée à 2 vitesses (soit une boîte de transfert à cames Rockwell 136-21, soit une boîte de transfert pneumatique sélectionnable Rockwell 136-27)."
 CHI_motorized_equipment_4: "M939"
 CHI_motorized_equipment_4_short: "M939"
 CHI_motorized_equipment_4_desc: "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 utilise un moteur 6CTA8.3, une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Le véhicule est capable de transporter une charge de 10 000 lb. Il peut se déplacer à 6,3 mph sur 350 miles et obtient 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et convient bien aux intempéries. Le M939 a permis une nouvelle génération de camions, de moteurs principaux et de véhicules de dépannage et a fait l'objet d'une fabrication intensive. Il est plus fiable et plus résistant que les véhicules précédents et a complètement supplanté les contrats de production antérieurs. "
 CHI_motorized_equipment_5: "Famille Oshkosh de véhicules tactiques moyens 6x6"
 CHI_motorized_equipment_5_short: "FMTV 6x6"
 CHI_motorized_equipment_5_desc: "La famille de véhicules tactiques moyens (FMTV) est une série de véhicules, basés sur un châssis commun, qui varient en fonction de la charge utile et des exigences de la mission. Le FMTV est dérivé du camion autrichien Steyr 12 M 18, mais considérablement modifié pour répondre aux exigences de l'armée américaine, celles-ci comprenant un minimum de 50 pour cent de contenu américain."

 ########## END OF NEW CHI ARMOR
