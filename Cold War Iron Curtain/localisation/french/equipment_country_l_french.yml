 SPR_mbt_equipment_0:0 "Verjeda 1"
 SPR_mbt_equipment_0_short:0 "Verjeda 1"
 SPR_mbt_equipment_0_desc:0 "L'apparence du prototype Verdeja 1 obtenu était proche de celle initialement envisagée dans les premières conceptions du capitaine Verdeja. La coque du véhicule était allongée et la plaque arrière inclinée, tandis que la capacité en carburant, et donc l'autonomie de combat, avait été augmentée, tout comme la capacité en munitions et l'épaisseur du blindage."
 SPR_mbt_equipment_1:0 "Panzerkampfwagen IV Ausf.H"
 SPR_mbt_equipment_1_short:0 "Panzer IV Ausf.H"
 SPR_mbt_equipment_1_desc:0 "Dès janvier 1944, l'Espagne entama à nouveau des négociations avec l'Allemagne pour obtenir davantage d'équipements. Le nouveau programme portait sur la vente de 33 Panzer IV, dont trois seraient des modèles de commandement. Une autre offre fut faite pour 67 Panzer IV supplémentaires à une date ultérieure ; au final, les deux programmes représentaient un achat potentiel de 100 Panzer IV."
 SPR_mbt_equipment_3:0 "M47E Patton"
 SPR_mbt_equipment_3_short:0 "M47E Patton"
 SPR_mbt_equipment_3_desc:0 "Le M47 Patton est l'un des premiers chars de combat principaux. Il a été conçu par le département de l'artillerie de l'armée américaine en 1951. Il est très similaire au M46 Patton, mais dispose d'une tourelle modernisée avec un mécanisme interne amélioré et une transmission optimisée. Il a été utilisé lors de la crise de Suez, de la guerre des Six Jours et des guerres de Yougoslavie."
 SPR_mbt_equipment_4:0 "M48 Patton"
 SPR_mbt_equipment_4_short:0 "M48 Patton"
 SPR_mbt_equipment_4_desc:0 "Le M48 Patton est un char de combat principal conçu par le département de l'artillerie de l'armée américaine en 1953. Le M48 dispose d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Son moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents, avec un système d'injection de carburant léger et un compresseur. Il a une autonomie de 160 miles hors route et de 300 miles sur route. Il peut rouler à 30 mph sur route, mais atteint 20 mph hors route grâce à son moteur, sa transmission et ses chenilles améliorés. Il a été le char principal utilisé pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton, mais il s'agit d'un modèle entièrement nouveau doté de nouveaux mécanismes internes. Il a été utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la garde nationale aient continué à utiliser et à entretenir des M48 jusqu'à la fin des années 80."
 SPR_mbt_equipment_5:0 "M48A2 Patton"
 SPR_mbt_equipment_5_short:0 "M48A2 Patton"
 SPR_mbt_equipment_6:0 "AMX-30E"
 SPR_mbt_equipment_6_short:0 "AMX-30E"
 SPR_mbt_equipment_7:0 "AMX-30EM2"
 SPR_mbt_equipment_7_short:0 "AMX-30EM2"
 SPR_mbt_equipment_7_desc:0 "Le ministère espagnol de la Défense a accepté de moderniser les AMX-30E de l'armée en 1987 et a alloué 16 milliards de pesetas (155 millions de dollars) à ce programme. À partir de juillet 1987, l'armée a mis à niveau l'ensemble de sa flotte d'AMX-30E aux normes EM1 et EM2."
 SPR_mbt_equipment_8:0 "KMW Leopard 2A4S"
 SPR_mbt_equipment_8_short:0 "Leopard 2A4S"
 SPR_mbt_equipment_9:0 "KMW Leopard 2E"
 SPR_mbt_equipment_9_short:0 "Leopard 2E"
 SPR_mechanized_equipment_5:0 "FMW M113"
 SPR_mechanized_equipment_5_short:0 "M113"
 SPR_mechanized_equipment_5_desc:0 "Les véhicules blindés de transport de troupes américains les plus reconnaissables depuis les années 60. Son utilisation intensive et des années de recherche ont permis d'en faire un véritable véhicule blindé de transport de troupes, tirant parti de sa hauteur, de l'angle de son blindage et de son épaisseur. Plus tard, de plus en plus de variantes ont été introduites, l'armant d'un M2 Browning .50 Cal avec quelques milliers de cartouches de liberté. Il s'agit véritablement d'un excellent véhicule blindé de transport de troupes. Des dizaines de variantes ont été dérivées du M113, qui est toujours utilisé par l'armée américaine à ce jour."
 SPR_mechanized_equipment_6:0 "FMW M113A2"
 SPR_mechanized_equipment_6_short:0 "M113A2"
 SPR_mechanized_equipment_6_desc:0 "Les véhicules blindés de transport de troupes américains les plus reconnaissables depuis les années 60. Son utilisation intensive et des années de recherche ont permis d'en faire un véritable véhicule blindé de transport de troupes, tirant parti de sa hauteur, de l'angle de son blindage et de son épaisseur. Plus tard, de plus en plus de variantes ont été introduites, l'armant d'un M2 Browning .50 Cal avec quelques milliers de cartouches de liberté. Il s'agit véritablement d'un excellent véhicule blindé de transport de troupes. Des dizaines de variantes ont été dérivées du M113, qui est toujours utilisé par l'armée américaine à ce jour."
 SPR_mechanized_equipment_7:0 "Pegaso 3560 BMR"
 SPR_mechanized_equipment_7_short:0 "BMR"
 SPR_mechanized_equipment_8:0 "Pegaso 3560 BMR-M1"
 SPR_mechanized_equipment_8_short:0 "BMR-M1"
 SPR_mechanized_equipment_9:0 "Pegaso 3560 BMR-M2"
 SPR_mechanized_equipment_9_short:0 "BMR-M2"
 SPR_mechanized_equipment_10:0 "Mowag Piranha IIIC Fusileros"
 SPR_mechanized_equipment_10_short:0 "Piranha IIIC Fusileros"
 SPR_mechanized_heavy_equipment_4:0 "M113 ACAV"
 SPR_mechanized_heavy_equipment_4_short:0 "M113 ACAV"
 SPR_mechanized_heavy_equipment_4_desc:0 "Le M113 ACAV, également connu sous le nom de M150, est un véhicule blindé d'assaut de cavalerie, qui est une forme primitive du IFV. Le M113 ACAV a été développé dans les années 60 par la Food Machinery Corporation. Le M113 ACAV est similaire au M113 dans la plupart des aspects. La variante ACAV du M113 est équipée d'un lanceur TOW et peut potentiellement être équipée d'une tourelle armée d'un lance-flammes, comme on l'a vu au Vietnam. Le M113 ACAV a été utilisé partout où le M113 a été utilisé."
 SPR_mechanized_heavy_equipment_6:0 "Pegaso VEC-M1"
 SPR_mechanized_heavy_equipment_6_short:0 "VEC-M1"
 SPR_mechanized_heavy_equipment_7:0 "Pegaso VEC-M2"
 SPR_mechanized_heavy_equipment_7_short:0 "VEC-M2"
 SPR_mechanized_heavy_equipment_8:0 "ASCOD Ulan-Pizzaro"
 SPR_mechanized_heavy_equipment_8_short:0 "ASCOD"
 SPR_mechanized_marine_equipment_1:0 "LVT-4 Water Buffalo"
 SPR_mechanized_marine_equipment_1_short:0 "LVT-4"
 SPR_mechanized_marine_equipment_1_desc:0 "Le LVTP-4 est un véhicule de débarquement amphibie conçu par Ford Machinery Corporation au début des années 1940. Utilisé pendant la Seconde Guerre mondiale, la guerre de Corée et la guerre du Vietnam, il est équipé d'un moteur radial W-670-9A à 7 cylindres et peut parcourir jusqu'à 120 km dans l'eau à une vitesse de 11 km/h. Évolution du LVTP-1, le LVTP-4 est capable de parcourir des distances impressionnantes à la nage, bien qu'à faible vitesse. Si vous devez traverser 110 km d'eau en une dizaine d'heures, le LVTP-4 est le véhicule idéal. Il peut transporter des troupes ou des véhicules."
 SPR_mechanized_marine_equipment_2:0 "LVT(A)-5"
 SPR_mechanized_marine_equipment_2_short:0 "LVT(A)-5"
 SPR_mechanized_marine_equipment_2_desc:0 "Le LVT(A)-4 était équipé d'une tourelle motorisée et d'un gyrostabilisateur pour l'obusier. Certains exemplaires ont été modernisés à la fin des années 1940 par une modification de la configuration du blindage."
