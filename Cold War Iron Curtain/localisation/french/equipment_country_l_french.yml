 BEL_atgm_equipment_0: "DTAT ENgin Téléguidé Anti-Char ENTAC"
 BEL_atgm_equipment_0_short: "ENTAC"
 BEL_atgm_equipment_0_desc: "Le missile a été développé par la DTAT (Direction Technique des Armements Terrestres) en même temps que l'industrie privée SS.10"
 BEL_atgm_equipment_1: "Nord SS.11"
 BEL_atgm_equipment_1_short: "SS.11"
 BEL_atgm_equipment_1_desc: "Le développement d'une version améliorée du SS.10 (Nord-5203) a commencé en 1953 sous le nom de Nord-5210. Le missile était conçu comme une version lourde du SS.10 portable destiné à être utilisé à partir de véhicules, de navires et d'hélicoptères. Le missile est entré en service dans l'armée française sous la désignation SS.11. Il a été utilisé comme premier missile antichar héliporté au monde (sur les Alouette II)."
 BEL_atgm_equipment_2: "MBDA Missile d'infanterie légère antichar 'MILAN' F1"
 BEL_atgm_equipment_2_short: "MILAN F1"
 BEL_atgm_equipment_2_desc: "MILAN est un produit d'Euromissile, un programme franco-ouest-allemand de développement de missiles datant des années 1960. Composé de deux composants principaux, le lanceur et le missile, le système MILAN utilise un système de guidage de commande semi-automatique de commande en ligne de visée (SACLOS)."
 BEL_atgm_equipment_3: "MBDA Missile d'infanterie légère antichar 'MILAN' F2"
 BEL_atgm_equipment_3_short: "MILAN F2"
 BEL_atgm_equipment_3_desc: "MILAN est un produit d'Euromissile. La variante F2 comprend une seule ogive principale à charge creuse avec une sonde à distance pour augmenter la pénétration. Un programme franco-ouest-allemand de développement de missiles remontant aux années 1960. Composé de deux composants principaux, le lanceur et le missile, le système MILAN utilise un système de guidage de commande semi-automatique de commande en ligne de visée (SACLOS)."
 BEL_atgm_equipment_4: "MBDA Missile d'infanterie légère antichar 'MILAN' F3"
 BEL_atgm_equipment_4_short: "MILAN F3"
 BEL_atgm_equipment_4_desc: "MILAN est un produit d'Euromissile. Le F3 est équipé d'une ogive à charge creuse Tandem et d'une balise électronique. Un programme franco-ouest-allemand de développement de missiles remontant aux années 1960. Composé de deux composants principaux, le lanceur et le missile, le système MILAN utilise un système de guidage de commande semi-automatique de commande en ligne de visée (SACLOS)."

 BEL_atgm_carrier_equipment_0: "Willys MB avec ENTAC"
 BEL_atgm_carrier_equipment_0_short: "Willys MB avec ENTAC"
 BEL_atgm_carrier_equipment_0_desc: "Une jeep belge Willys MB avec des nacelles de missiles ENTAC montées à l'arrière"
 BEL_atgm_carrier_equipment_1: "Minerva T.T avec SS.11"
 BEL_atgm_carrier_equipment_1_short: "Minerva T.T avec SS.11"
 BEL_atgm_carrier_equipment_1_desc: "Version produite sous licence belge du Landrover, le Minterva T.T pouvait transporter des missiles SS.11 soit montés à l'arrière, soit transportés derrière dans un chariot."
