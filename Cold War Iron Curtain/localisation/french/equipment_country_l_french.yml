 JAP_atgm_equipment_0: "Tapis Kawasaki Type 64"
 JAP_atgm_equipment_0_short: "Type 64 TAPIS"
 JAP_atgm_equipment_0_desc: "Le Type 64 MAT (64-shiki tai-sensha yudo-dan) est un missile antichar japonais filoguidé développé à la fin des années 1950. Le missile est globalement similaire au Cobra suisse/allemand et au 9M14 Malyutka. Au sein du JGSDF, il est également connu sous les noms de 64MAT et KAM-3."
 JAP_atgm_equipment_1: "Kawasaki Type 79 Jyu-MAT"
 JAP_atgm_equipment_1_short: "Tapez 79 Jyu-MAT"
 JAP_atgm_equipment_1_desc: "Le Type 79 Jyu-MAT (79-shiki tai-shutei tai-sensha yudo-dan) est un missile antichar guidé japonais SACLOS entré en service dans la JGSDF en 1984. Il a été initialement délivré aux unités de défense côtière, destinées à détruire les navires de débarquement de troupes et de véhicules à l'approche du rivage. Il est également connu sous le nom de KAM-9."
 JAP_atgm_equipment_2: "Kawasaki'Type 79 Kai Jyu-MAT"
 JAP_atgm_equipment_2_short: "Tapez 79 Kai Jyu-MAT"
 JAP_atgm_equipment_2_desc: "Le Type 79 Kai Jyu-MAT (79-shiki tai-shutei tai-sensha yudo-dan) est un missile antichar guidé japonais SACLOS entré en service dans la JGSDF en 1984. Il a été initialement délivré aux unités de défense côtière, destinées à détruire les navires de débarquement de troupes et de véhicules à l'approche du rivage. Il est également connu sous le nom de KAM-9."
 JAP_atgm_equipment_3: "Kawasaki Type 87 Chu-MAT"
 JAP_atgm_equipment_3_short: "Type 87 Chu-MAT"
 JAP_atgm_equipment_3_desc: "Le Type 87 Chu-MAT (87-shiki tai-sensha yudo-dan) Chu-MAT est un missile antichar japonais à guidage laser en service dans les forces terrestres d'autodéfense japonaises. Il avait été créé pour remplacer en première ligne le Type 64 MAT, mis en service avec le Type 79 Jyu-MAT. "
 JAP_atgm_equipment_4: "Kawasaki Type 87 Kai Chu-MAT"
 JAP_atgm_equipment_4_short: "Type 87 Kai Chu-MAT"
 JAP_atgm_equipment_4_desc: "Le Type 87 Chu-MAT (87-shiki tai-sensha yudo-dan) Chu-MAT est un missile antichar japonais à guidage laser en service dans les forces terrestres d'autodéfense japonaises. Il avait été créé pour remplacer en première ligne le Type 64 MAT, mis en service avec le Type 79 Jyu-MAT. "
 JAP_atgm_equipment_5: "Kawasaki Type 01 LMAT"
 JAP_atgm_equipment_5_short: "Type 01 LMAT"
 JAP_atgm_equipment_5_desc: "Le Type 01 LMAT (01-shiki kei-tai-sensha yudo-dan) est un missile antichar portable japonais à tir et oubli. Le développement a commencé en 1993 chez Kawasaki Heavy Industries et a été mis en service en 2001. Au cours du développement, le missile a été désigné sous le nom de code XATM-5. Il fut plus tard connu sous le nom d'ATM-5."

 JAP_atgm_carrier_equipment_0: "Mitsubishi Type 73 avec MAT"
 JAP_atgm_carrier_equipment_0_short: "Type 73 TAPIS"
 JAP_atgm_carrier_equipment_0_desc: "Mitsubishi Type 73 avec un système de missile guidé antichar Type 64 MAT monté sur les panneaux latéraux arrière."
 JAP_atgm_carrier_equipment_1: "Komatsu Type 60 avec MAT"
 JAP_atgm_carrier_equipment_1_short: "Type 60 TAPIS"
 JAP_atgm_carrier_equipment_1_desc: "Komatsu Type 60 APC avec un système de missile guidé antichar Type 64 MAT monté sur les panneaux latéraux arrière."
 JAP_atgm_carrier_equipment_2: "Mitsubishi Type 73 avec Jyu-MAT"
 JAP_atgm_carrier_equipment_2_short: "Tapez 73 Jyu-MAT"
 JAP_atgm_carrier_equipment_2_desc: "Mitsubishi Type 73 avec un système de missile guidé antichar Type 79 Jyu-MAT monté sur le pont arrière."
 JAP_atgm_carrier_equipment_3: "Toyota Mega Cruiser avec système de missiles polyvalents de type 96"
 JAP_atgm_carrier_equipment_3_short: "Tapez 96 MPMS"
 JAP_atgm_carrier_equipment_3_desc: "Le système de missile polyvalent de type 96 est un missile antichar/péniche de débarquement utilisé par la JGSDF. Il s'agit du premier système de missile japonais utilisant une interface complète à commande numérique. "
 JAP_atgm_carrier_equipment_4: "Toyota Mega Cruiser avec missile polyvalent de moyenne portée"
 JAP_atgm_carrier_equipment_4_short: "MMPM"
 JAP_atgm_carrier_equipment_4_desc: "Le missile polyvalent à moyenne portée ou Chu-MPM est un missile antichar/péniche de débarquement utilisé par l'armée japonaise sous le nom de JGSDF."

 JAP_sam_carrier_equipment_4: "Système de missile sol-air Toshiba Type 81"
 JAP_sam_carrier_equipment_4_short: "Type 81 Tan-SAM"
 JAP_sam_carrier_equipment_4_desc: "Le missile sol-air de type 81 ou Tan-SAM (短SAM) est un missile sol-air développé au Japon actuellement en service dans la Force d'autodéfense terrestre japonaise. "
 JAP_sam_carrier_equipment_5: "Toshiba Type 93 SAM à courte portée « Flèche fermée »"
 JAP_sam_carrier_equipment_5_short: "Tapez 93 Kon-SAM"
 JAP_sam_carrier_equipment_5_desc: "Le missile sol-air de type 93 (93 shiki-kinkyori-titaiku-yuudodan) ou Kon-SAM est un missile sol-air utilisé par la Force terrestre d'autodéfense japonaise. Il s'agit de la version embarquée du missile Type 91."
 JAP_sam_carrier_equipment_6: "Système de missile sol-air Toshiba Type 11"
 JAP_sam_carrier_equipment_6_short: "Type 11 Tan-SAM Kai II"
 JAP_sam_carrier_equipment_6_desc: "Le missile sol-air de type 11 ou Tan-SAM Kai II est un missile sol-air développé au Japon actuellement en service dans les forces d'autodéfense japonaises."

