 JAP_mechanized_marine_equipment_1: "Buffle d'eau LVT-4"
 JAP_mechanized_marine_equipment_1_short: "LVT-4"
 JAP_mechanized_marine_equipment_1_desc: "Le LVTP-4 est un véhicule d'atterrissage amphibie conçu par Ford Machinery Corporation au début des années 40. Le LVTP-4 a été utilisé pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Il utilise un moteur radial à 7 cylindres W-670-9A et peut parcourir jusqu'à 75 miles dans l'eau à 7 mph. Evolution du LVTP-1, le LVTP-4 est capable de parcourir des distances incroyables, bien qu'à des vitesses lentes. Si vous devez traverser 70 milles d'eau et disposer d'environ 10 heures pour le faire, le LVTP-4 est votre véhicule de choix. Il est capable de transporter des troupes ou des véhicules. "
 JAP_mechanized_marine_equipment_2: "LVT(A)-5"
 JAP_mechanized_marine_equipment_2_short: "LVT(A)-5"
 JAP_mechanized_marine_equipment_2_desc: "LVT(A)-4 avec une tourelle motorisée et un gyrostabilisateur pour l'obusier. Certains ont été améliorés à la fin des années 1940 en modifiant la configuration du blindage."
 JAP_mechanized_marine_equipment_3: "Véhicule de neige Ohara Type 78"
 JAP_mechanized_marine_equipment_3_short: "Type 78 SV"
 JAP_mechanized_marine_equipment_3_desc: "Le Type 78 est un transporteur à chenilles plutôt inhabituel. Son rôle principal est d'opérer sur la neige et de transporter des passagers, des skieurs, des marchandises légères et divers équipements. Il a été produit par Ohara Iron Works. Ce véhicule de neige utilisait des composants automobiles du camion Type 73. Il a été adopté en 1978, d'où sa désignation. Il a remplacé en service les précédents véhicules de neige Type 60 et Type 61."
 JAP_mechanized_marine_equipment_4: "AAVP-7A1"
 JAP_mechanized_marine_equipment_4_short: "AAVP-7A1"
 JAP_mechanized_marine_equipment_4_desc: "Le LVTP-7A1 est un APC amphibie conçu en 1984 par la Food Machinery Corporation. Elle a connu des combats dans le Golfe, en Syrie et en Irak. Le LVTP-7A1 utilise un moteur VTAC RAM-RS de 525 ch et peut voyager à peu près de la même manière que le LVTP-7. Il dispose d'un moteur, d'une transmission et d'un système d'armes améliorés et est plus facile à entretenir que le LVTP-7. Il comporte également un certain nombre d'améliorations en matière de sécurité pour réduire les effets des coups. "
 JAP_mechanized_marine_equipment_5: "Véhicule de neige Ohara Type 10"
 JAP_mechanized_marine_equipment_5_short: "Type 10 SV"
 JAP_mechanized_marine_equipment_5_desc: "Le ministère japonais de la Défense recherchait un nouveau transporteur à chenilles pour remplacer son véhicule de neige vieillissant de type 78. Il utilisait de nombreux composants automobiles du camion militaire Type 73, produit en grande quantité pour l'armée japonaise. Le nouveau transporteur à chenilles est produit par Ohara Corporation."

