 CHI_mechanized_equipment_1:0 "Transporteur, Personnel, Half-track, M2"
 CHI_mechanized_equipment_1_short:0 "M2 Half-Track"
 CHI_mechanized_equipment_1_desc:0 "Le véhicule semi-chenillé M2 est un véhicule blindé semi-chenillé produit par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspire des véhicules semi-chenillés importés de France dans les années 1930, utilisant des composants standard fournis par les constructeurs de camions américains afin d'accélérer la production et de réduire les coûts. Le concept a été conçu et les modèles pilotes ont été fabriqués par la Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement baptisé M2). La production par la White Motor Company a commencé en 1940 et a été étendue à Autocar."
 CHI_mechanized_equipment_2:0 "Transporteur, Personnel, Half-track, M3"
 CHI_mechanized_equipment_2_short:0 "M3 Half-Track"
 CHI_mechanized_equipment_2_desc:0 "Le semi-chenillé M3 était un véhicule blindé américain de transport de troupes largement utilisé par les Alliés pendant la Seconde Guerre mondiale et la guerre froide. Dérivé du semi-chenillé M2, le M3 a été produit en grande quantité, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. Pendant la guerre froide, ce véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, et est resté en service jusqu'au milieu des années 1990. Au Mexique, il est toujours utilisé en 2019."
 CHI_mechanized_equipment_3:0 "Transporteur, Personnel, Half-track, M5"
 CHI_mechanized_equipment_3_short:0 "M5 Half-Track"
 CHI_mechanized_equipment_5:0 "Transporteur, Personnel, À chenilles, Blindé, M113"
 CHI_mechanized_equipment_5_short:0 "M113"
 CHI_mechanized_equipment_6:0 "Transporteur, Personnel, À chenilles, Blindé, M113A1"
 CHI_mechanized_equipment_6_short:0 "M113A1"
 CHI_mechanized_equipment_6_desc:0 "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), afin de profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
 CHI_mechanized_equipment_7:0 "Transporteur, Personnel, À chenilles, Blindé, M113A2"
 CHI_mechanized_equipment_7_short:0 "M113A2"
 CHI_mechanized_equipment_7_desc:0 "Le M113A2 est une version améliorée du M113 fabriquée par la Food Machinery Corporation à la fin des années 70. Il a été utilisé au combat partout où le M113 a été utilisé. Dans le modèle A1, le moteur a été remplacé par le 6V-53. Dans la version A2, le refroidissement du moteur a été amélioré, des barres de torsion plus résistantes ont été introduites pour augmenter la garde au sol, des amortisseurs ont été ajoutés à la suspension, les réservoirs de carburant ont été blindés et des lance-fumigènes ont été ajoutés."
 CHI_mechanized_equipment_8:0 "CM-21A1"
 CHI_mechanized_equipment_8_short:0 "CM-21A1"
 CHI_mechanized_equipment_9:0 "CM-31"
 CHI_mechanized_equipment_9_short:0 "CM-31"
 CHI_mechanized_equipment_10:0 "CM-33"
 CHI_mechanized_equipment_10_short:0 "CM-33"
 CHI_mechanized_marine_equipment_1:0 "Véhicule de débarquement à chenilles, Mark 3C"
 CHI_mechanized_marine_equipment_1_short:0 "LVT-3C"
 CHI_mechanized_marine_equipment_2:0 "Véhicule de débarquement à chenilles (blindé), Mark 4"
 CHI_mechanized_marine_equipment_2_short:0 "LVT(A)-4"
 CHI_mechanized_marine_equipment_3:0 "Véhicule de débarquement à chenilles pour le transport de troupes, Mark 5A1"
 CHI_mechanized_marine_equipment_3_short:0 "LVTP-5A1"
 CHI_mechanized_marine_equipment_4:0 "Véhicule amphibie d'assaut, personnel, Mark 7A1"
 CHI_mechanized_marine_equipment_4_short:0 "AAVP-7A1"
 CHI_mechanized_marine_equipment_4_desc:0 "L'AAVP-7A1 est un véhicule blindé amphibie conçu en 1984 par la Food Machinery Corporation. Il a été utilisé au combat dans le Golfe, en Syrie et en Irak. L'AAVP-7A1 est équipé d'un moteur VTAC RAM-RS de 525 ch et peut rouler à peu près à la même vitesse que le LVTP-7. Son moteur, sa transmission et son système d'armement ont été améliorés, et il est plus facile à entretenir que le LVTP-7. Il bénéficie également d'un certain nombre d'améliorations en matière de sécurité afin de réduire les effets des impacts."
 CHI_motorized_equipment_1:0 "GMC CCKW"
 CHI_motorized_equipment_1_short:0 "GMC CCKW"
 CHI_motorized_equipment_1_desc:0 "Le GMC CCKW est un camion 6x6 de 2,5 tonnes conçu par General Motors en 1941. Il a été largement utilisé pendant la Seconde Guerre mondiale et la guerre de Corée. Le CCKW est équipé d'un moteur GMC270, d'une transmission à 5 vitesses/2 gammes et d'un essieu rigide sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 livres. Il peut rouler jusqu'à 45 mph sur plus de 300 miles et consomme 7,5 mi/gal. Le CCKW a été développé pour l'armée américaine comme camion de transport de troupes et de ravitaillement. Outre son utilisation pour le ravitaillement et le transport, ce camion pouvait également être équipé d'une carrosserie de fourgon pour servir de véhicule de confort/soutien sur le terrain et pouvait également être équipé d'armes remorquées sur sa plate-forme afin de créer des armes SP bon marché."
 CHI_motorized_equipment_2:0 "M35A1"
 CHI_motorized_equipment_2_short:0 "M35A1"
 CHI_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé dans tous les conflits américains de 1950 à 1988. Le M35 est équipé d'un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et d'essieux rigides sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 livres. Il peut rouler à 58 mph pendant 300 miles et consomme 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés à travers le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et offrir un véhicule plus robuste et plus rapide."
 CHI_motorized_equipment_3:0 "M35A2"
 CHI_motorized_equipment_3_short:0 "M35A2"
 CHI_motorized_equipment_3_desc:0 "Le M35A2 est généralement équipé d'un moteur LDT 465, fabriqué soit par Continental Motors Company, Hercules ou White Motor Company. Il s'agit d'un moteur multicombustible turbocompressé à six cylindres en ligne de 7,8 litres (478 pouces cubes) développant une puissance de 134 ch (100 kW) et un couple de 447 N⋅m (330 lb-pi). Il est couplé à une transmission manuelle à 5 vitesses et à une boîte de transfert à 2 vitesses indépendante (soit une boîte de transfert à roue libre Rockwell 136-21, soit une boîte de transfert à commande pneumatique Rockwell 136-27)."
 CHI_motorized_equipment_4:0 "M939"
 CHI_motorized_equipment_4_short:0 "M939"
 CHI_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 est équipé d'un moteur 6CTA8.3, d'une transmission à 5 vitesses/2 gammes et d'essieux rigides sur suspension à ressorts à lames. Le véhicule peut transporter une charge de 10 000 livres. Il peut rouler à 6,3 mph pendant 350 miles et consomme 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et est bien adapté aux conditions météorologiques difficiles. Le M939 a donné naissance à une nouvelle génération de camions, de tracteurs et de véhicules de dépannage et a été produit en grande quantité. Il est plus fiable et plus robuste que les véhicules précédents et a complètement supplanté les contrats de production antérieurs."
 CHI_motorized_equipment_5:0 "Gamme Oshkosh de véhicules tactiques moyens 6x6"
 CHI_motorized_equipment_5_short:0 "FMTV 6x6"
 CHI_motorized_equipment_5_desc:0 "La famille des véhicules tactiques moyens (FMTV) est une série de véhicules, basés sur un châssis commun, qui varient en fonction de la charge utile et des exigences de la mission. Le FMTV est dérivé du camion autrichien Steyr 12 M 18, mais il a été considérablement modifié pour répondre aux exigences de l'armée américaine, notamment celle d'un contenu américain minimum de 50 %."
