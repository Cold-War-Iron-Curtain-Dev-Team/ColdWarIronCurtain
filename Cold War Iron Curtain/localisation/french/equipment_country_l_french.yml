 YUG_lt_equipment_1:0 "T-60"
 YUG_lt_equipment_1_short:0 "T-60"
 YUG_lt_equipment_1_desc:0 "Le T60 était un char léger fabriqué pour remplacer le T-38 dans son rôle de reconnaissance. Il a été conçu en 1941 par Nicholas Astrov et 6 300 exemplaires ont été produits au cours des deux années de sa fabrication. Ce véhicule était un char à deux membres d'équipage équipé d'un moteur 6 cylindres et pouvant atteindre une vitesse de 44 km/h, avec un canon principal de 20 mm. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 YUG_lt_equipment_2:0 "T-70"
 YUG_lt_equipment_2_short:0 "T-70"
 YUG_lt_equipment_2_desc:0 "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et aterminé en 1942. Au cours des 2 années de fabrication, 8 300 ont été produits. Le char avait un canon bien plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée, Il a été largement utilisé pendant la Seconde Guerre mondiale. "
 YUG_lt_equipment_3:0 "PT-76"
 YUG_lt_equipment_3_short:0 "PT-76"
 YUG_lt_equipment_3_desc:0 "Le PT-76 est un char léger amphibie soviétique qui a été largement exporté à travers le monde. Il a été conçu par Nikolai Shashmyrin et Zh. Kotin en 1951, et environ 12 000 exemplaires ont été produits. Il nécessite un équipage de trois hommes et est équipé d’un moteur V6 six cylindres en ligne, lui permettant d’atteindre une vitesse de 44 km/h sur terre et de nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique ou proches de l’Union soviétique et a ainsi rempli un rôle de reconnaissance dans pratiquement tous les conflits impliquant des nations de cette sphère. Toutefois, il est encore utilisé aujourd’hui par de nombreux pays en raison de sa fiabilité réputée et de sa facilité d’entretien."
 YUG_lt_equipment_4:0 "PT-76B Model 4"
 YUG_lt_equipment_4_short:0 "PT-76B"
 YUG_lt_equipment_4_desc:0 "Le PT-76 est équipé d'un canon rayé D-56TS de 76,2 mm (frein de bouche à double déflecteur, éjecteur de douilles, extracteur de fumée et système de stabilisation à deux axes STP-2P « Zarya »), du système de protection PAZ (protivo-atomnaya zashchita) , un système d'extinction automatique d'incendie, un viseur TShK-2-66 amélioré, un système de filtration-ventilation, des dispositifs d'observation améliorés, un équipement électrique amélioré, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."
 YUG_lt_equipment_5:0 "BRM-1K"
 YUG_lt_equipment_5_short:0 "BRM-1K"
 YUG_lt_equipment_5_desc:0 "Le BRM-1K est un véhicule de reconnaissance d'origine soviétique datant de la fin de la guerre froide. Il a été développé pour soutenir les formations blindées et mécanisées employées par les forces soviétiques. Le BRM-1K était destiné à reconnaître les itinéraires et à détecter les formations ennemies."
 YUG_lt_equipment_6:0 "M-80A KC"
 YUG_lt_equipment_6_short:0 "M-80A KC"
 YUG_ht_equipment_1:0 "IS-2"
 YUG_ht_equipment_1_short:0 "IS-2"
 YUG_mbt_equipment_0:0 "T-34-85"
 YUG_mbt_equipment_0_short:0 "T-34-85"
 YUG_mbt_equipment_0_desc:0 "Le T-34 est un char moyen soviétique qui a révolutionné le domaine de la conception des chars et qui est réputé pour sa fiabilité. Le T-34 a été conçu en 1940 par KMBD en Union soviétique. Afin de réduire les coûts, un blindage incliné a été intégré à la conception du char. Cependant, cela a également permis d'améliorer considérablement la protection du char et de réduire son coût grâce à une surface plus petite. L'arme elle-même est un canon de 76,2 mm et avait une capacité nominale de transport de munitions. Cependant, les viseurs et les dispositifs de vision étaient particulièrement médiocres, ce qui rendait leur utilisation difficile pour les commandants de chars, et leur faible capacité de coordination réduisait considérablement les avantages offerts par le char lui-même. Le T-34 est devenu le deuxième char le plus produit au monde, mais l'un des plus importants de la Seconde Guerre mondiale. Les T-34 sont encore utilisés aujourd'hui par les insurgés et les pays pauvres."
 YUG_mbt_equipment_1:0 "M4A3E4"
 YUG_mbt_equipment_1_short:0 "M4A3E4"
 YUG_mbt_equipment_1_desc:0 "Sherman amélioré avec suspension HVSS, chenilles Wetrac et canon de 76 mm."
 YUG_mbt_equipment_2:0 "M47 Patton"
 YUG_mbt_equipment_2_short:0 "M47 Patton"
 YUG_mbt_equipment_3:0 "T-54"
 YUG_mbt_equipment_3_short:0 "T-54"
 YUG_mbt_equipment_3_desc:0 "Le char T-54 est le char le plus produit de l'histoire. Il a été conçu en 1946 par KMBD. Il est équipé d'un canon rayé de 100 mm et dispose d'un blindage dont l'épaisseur varie entre 205 mm et 60 mm. Il est équipé d'un moteur diesel V-12 de 38,88 litres et d'une suspension à barres de torsion, et peut atteindre une vitesse maximale de 48 km/h. Ce char a été utilisé par plus de 50 armées à travers le monde et a été produit dans toute la sphère d'influence soviétique, où il a participé à tous les conflits."
 YUG_mbt_equipment_4:0 "T-55"
 YUG_mbt_equipment_4_short:0 "T-55"
 YUG_mbt_equipment_5:0 "T-55A"
 YUG_mbt_equipment_5_short:0 "T-55A"
 YUG_mbt_equipment_6:0 "T-72"
 YUG_mbt_equipment_6_short:0 "T-72"
 YUG_mbt_equipment_6_desc:0 "Le T-72 est un char de combat principal soviétique créé comme une nouvelle génération de chars, principalement pour remplacer le T-62 et son homologue coûteux, le T-64. Il coûtait près de moitié moins cher que le T-64 et présentait de nombreuses améliorations. Sa conception a été achevée en 1973 par Leonid Venediktov et démontrait des capacités incroyables. Le canon et le blindage étaient toujours respectivement de 125 mm et composites, mais avec une conception beaucoup plus économique et plus facile à produire. Le moteur est un V-12 de 780 ch qui a pu être ultérieurement remplacé par un modèle de 1130 ch. Le char pouvait atteindre une mobilité incroyable avec une vitesse de 80 km/h et s'adaptait mieux aux terrains difficiles que le T-64. Contrairement au T-64, il a été utilisé dans tous les conflits de la sphère soviétique, où il a également démontré des capacités incroyables. Le char a également été largement utilisé dans des conflits hors de la sphère soviétique, en Afrique, au Moyen-Orient et en Indochine."
