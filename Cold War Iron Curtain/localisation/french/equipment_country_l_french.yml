 JAP_spaag_equipment_3:0 "Mitsubishi Type 60 AWX"
 JAP_spaag_equipment_3_short:0 "Type 60 AWX"
 JAP_spaag_equipment_4:0 "Mitsubishi Type 87 Shiki-Jisō-Kōsha-Kikanhō 'Guntank'"
 JAP_spaag_equipment_4_short:0 "Type 87 'Guntank'"
 JAP_spaag_equipment_4_desc:0 "Le canon antiaérien automoteur de type 87 (87-shiki jisō kōsha kikanhō) est une arme de défense aérienne japonaise construite autour du système de canons jumelés Oerlikon 35 mm utilisé sur le canon antiaérien automoteur Gepard. Le système utilise un châssis de char Type 74 modifié. Il est également surnommé « Guntank » par les officiers de terrain, d'après le mécha d'apparence similaire de la série Mobile Suit Gundam."
 JAP_spaag_equipment_5:0 "Mitsubishi Type 87 Kai Shiki-Jisō-Kōsha-Kikanhō 'Guntank'"
 JAP_spaag_equipment_5_short:0 "Type 87 Kai 'Guntank'"
 JAP_spaag_equipment_5_desc:0 "Le canon antiaérien automoteur Type 87 Kai (87-shiki jisō kōsha kikanhō) est une arme de défense aérienne japonaise construite autour du système de canons jumelés Oerlikon 35 mm utilisé sur le canon antiaérien automoteur Gepard. Le système utilise un châssis de char Type 74 modifié. Il est également surnommé « Guntank » par les officiers de terrain, d'après le mécha d'apparence similaire de la série Mobile Suit Gundam."
