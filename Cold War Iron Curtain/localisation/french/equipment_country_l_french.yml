 FRA_lt_equipment_3_desc:0 "Le Panhard EBR (Panhard Engin Blindé de Reconnaissance) est un véhicule blindé conçu par Panhard pour l'armée française, puis utilisé à travers le monde, notamment par l'armée française pendant la guerre d'Algérie et par l'armée portugaise pendant la guerre coloniale portugaise en Angola, au Mozambique et en Guinée-Bissau."
