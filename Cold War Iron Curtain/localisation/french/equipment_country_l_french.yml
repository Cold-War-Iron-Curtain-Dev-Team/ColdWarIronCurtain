 CAN_mechanized_equipment_6_short:0 "M113A1"
 CAN_mechanized_equipment_6_desc:0 "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), afin de profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
