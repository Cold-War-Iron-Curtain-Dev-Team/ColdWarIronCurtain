 JAP_direct_fire_gun_equipment_3:0 "Fusil sans recul M40"
 JAP_direct_fire_gun_equipment_3_short:0 "Fusil sans recul M40"
 JAP_medium_tank_destroyer_equipment_1:0 "M36 Jackson"
 JAP_medium_tank_destroyer_equipment_1_short:0 "M36 Jackson"
 JAP_medium_tank_destroyer_equipment_2_desc:0 "Le canon automoteur sans recul de 106 mm de type 60 (60, roku-maru-shiki-jisou-muhandou-hou) est un véhicule antichar léger développé par le Japon à la fin des années 1950. Il est équipé de deux canons sans recul M40 de 106 mm comme armement principal."
 JAP_medium_tank_destroyer_equipment_3:0 "Mitsubishi Type 73 106mm RR"
 JAP_medium_tank_destroyer_equipment_3_short:0 "Type 73 106mm RR"
 JAP_medium_tank_destroyer_equipment_3_desc:0 "La première production du Type 73, connu sous le nom de Mitsubishi Type 73 Light Truck (Kyū) (73-shiki kogata torakku (kyū)), était basée sur les Jeep CJ-3B que Mitsubishi Motors produisait sous licence de Willys."
