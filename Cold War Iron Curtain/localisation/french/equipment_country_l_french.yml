 FRA_lt_equipment_1: "M5 Stuart"
 FRA_lt_equipment_1_short: "M5 Stuart"
 FRA_lt_equipment_1_desc: "Le M5 Stuart était une version plus récente du char léger M3 Stuart produit en raison de la demande de moteurs d'avion radiaux pendant la Seconde Guerre mondiale. Il a une coque redessinée avec un pont arrière surélevé, une plaque de glacis inclinée et une trappe de conduite déplacée vers le haut. Il comprend un canon de 37 mm, un équipage de quatre personnes, trois mitrailleuses M1919 et pèse environ 15 tonnes. Il a été utilisé par les États-Unis et d'autres forces alliées tout au long de la Seconde Guerre mondiale et a été utilisé dans de nombreux conflits après la guerre."
 FRA_lt_equipment_2: "M24"
 FRA_lt_equipment_2_short: "M24"
 FRA_lt_equipment_2_desc: "Le M24 est un char léger américain fabriqué par les sociétés Cadillac et Massey-Harris. Il a été utilisé dans les dernières parties de la Seconde Guerre mondiale et dans certains conflits d'après-Seconde Guerre mondiale. Il était équipé d'un canon M6 de 75 mm et a été largement utilisé pendant la guerre d'Algérie et la première guerre d'Indochine."
 FRA_lt_equipment_3: "Panhard E.B.R. 75 mm SA49"
 FRA_lt_equipment_3_short: "E.B.R. Mle 51"
 FRA_lt_equipment_3_desc: "Le Panhard EBR (Panhard Engin Blindé de Reconnaissance, français : Véhicule blindé de reconnaissance) est une voiture blindée conçue par Panhard pour l'armée française et utilisée plus tard dans le monde entier, notamment par l'armée française pendant la guerre d'Algérie et l'armée portugaise pendant la guerre coloniale portugaise en Angola, au Mozambique et en Guinée-Bissau."
 FRA_lt_equipment_4: "Panhard E.B.R. 90 mm F1"
 FRA_lt_equipment_4_short: "E.B.R. Mle 63"
 #FRA_lt_equipment_4_desc: ""
 FRA_lt_equipment_5: "AMX-10RC"
 FRA_lt_equipment_5_short: "AMX-10RC"
 FRA_lt_equipment_5_desc: "L'AMX 10RC est un véhicule de reconnaissance à roues de poids moyen armé d'un canon de 105 mm. Le véhicule, fourni par Nexter Systems, est en service dans l'armée française depuis 1980. Il nécessite un équipage de 4 personnes pour piloter le véhicule et pèse environ 15 tonnes."
 FRA_lt_equipment_6: "AMX-10 RC Surblinde"
 FRA_lt_equipment_6_short: "AMX-10 Surblindé"
 FRA_lt_equipment_6_desc: "AMX-10 équipé d'un blindage supplémentaire et sans capacité amphibie."

