 CAN_mechanized_equipment_5:0 "M113"
 CAN_mechanized_equipment_5_short:0 "M113"
 CAN_mechanized_equipment_5_desc:0 "Les véhicules blindés de transport de troupes américains les plus reconnaissables depuis les années 60. Son utilisation intensive et des années de recherche ont permis d'en faire un véritable véhicule blindé de transport de troupes, tirant parti de sa hauteur, de l'angle de son blindage et de son épaisseur. Plus tard, de plus en plus de variantes ont été introduites, l'armant d'un M2 Browning .50 Cal avec quelques milliers de cartouches de liberté. Il s'agit véritablement d'un excellent véhicule blindé de transport de troupes. Des dizaines de variantes ont été dérivées du M113, qui est toujours utilisé par l'armée américaine à ce jour."
