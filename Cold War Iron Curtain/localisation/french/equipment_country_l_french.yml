 BEL_lt_equipment_1: "M5 Stuart"
 BEL_lt_equipment_1_short: "M5 Stuart"
 BEL_lt_equipment_2: "Char léger, M24 Chaffee"
 BEL_lt_equipment_2_short: "M24 Chaffee"
 BEL_lt_equipment_3: "Char de combat à chenilles complètes : canon de 76 mm, M41"
 BEL_lt_equipment_3_short: "M41 Walker Bulldog"
 BEL_lt_equipment_3_desc: "Le M41 est un char de reconnaissance léger développé par Cadillac en 1949. Il a combattu au Vietnam, dans la Baie des Cochons, au Liban et en Somalie. Son blindage varie de 19 mm à 31,7 mm. Il est armé d'un canon principal de 76 mm, d'une mitrailleuse coaxiale de calibre.30 et d'un canon de toit de calibre.50. Il utilise un moteur essence Continental 6 cylindres et fonctionne jusqu'à 45 mph avec une autonomie opérationnelle de 100 miles. Le développement du M41 progressait lentement avec peu de financement, mais lorsque la guerre de Corée a éclaté, l'armée américaine a commencé à précipiter le programme. La précipitation a causé un grand nombre de problèmes dans le programme et des problèmes de taille excessive. Le M41, en raison de graves problèmes liés à la précipitation du programme, a été produit pendant très peu de temps et n'a pas été utilisé pendant la guerre de Corée. En fait, la production n'a démarré qu'en 1951 et n'a duré que 3 ans."
 BEL_lt_equipment_4: "Fabrique Nationale FN 4RM 62F"
 BEL_lt_equipment_4_short: "FN4RM 62F"
 BEL_lt_equipment_4_desc: "FN Herstal a conçu le 4RM 62F, sans aucune expérience préalable en matière de véhicules blindés. Basant leur conception sur le camion FN 4RM/62 Ardennes (4 × 4) de 1500 kg et s'inspirant d'autres conceptions, comme le français Panhard AML. Le véhicule blindé a été initialement conçu pour la gendarmerie belge."
 BEL_lt_equipment_5: "Alvis FV101 Scorpion"
 BEL_lt_equipment_5_short: "FV101 Scorpion"
 BEL_lt_equipment_6: "Ateliers de Constructions Electriques de Charleroi Cobra avec Cockerill 90mm"
 BEL_lt_equipment_6_short: "ACEC Cobra 90"
 BEL_lt_equipment_6_desc: "Avec un équipage de trois personnes et équipé d'une tourelle pour canons jusqu'à 90 mm. Un prototype était équipé d'une tourelle électrique biplace AK 90 E, armée du canon KEnerga 90/46 de Cockerill et équipée du système de conduite de tir OIP LRS-5 avec ordinateur balistique, viseur jour/nuit et télémètre laser. Une autre version avait la tourelle pour deux hommes Cockerill C-25 avec un canon Oerlikon KBB de 25 mm et une mitrailleuse coaxiale de 7,62 mm."

 BEL_mechanized_equipment_1: "Demi-chenille M3"
 BEL_mechanized_equipment_1_short: "Demi-chenille M3"
 BEL_mechanized_equipment_2: "Bren Transporteur LP2"
 BEL_mechanized_equipment_2_short: "Bren Transporteur LP2"
 BEL_mechanized_equipment_3: "Louis Carrier"
 BEL_mechanized_equipment_3_short: "Louis Carrier"
 BEL_mechanized_equipment_4: "M59"
 BEL_mechanized_equipment_4_short: "M59"
 BEL_mechanized_equipment_4_desc: "Le M59 est un APC développé par la société FMC en 1951. Il a été utilisé au Vietnam et au Liban. Le M75 était équipé de 2 moteurs essence 6 cylindres en ligne, d'une transmission Hydramatic 301MG et d'une suspension à barre de torsion. Il peut se déplacer jusqu'à 32 mph sur 120 miles. Le M59 a rapidement remplacé le M75 car il était amphibie, plus petit et beaucoup moins cher à produire. Le M59 était également utilisé comme porteur de mortier et comme véhicule de soutien."
 BEL_mechanized_equipment_5: "AMX-VTP"
 BEL_mechanized_equipment_5_short: "AMX-VTP"
 BEL_mechanized_equipment_6: "M113-B"
 BEL_mechanized_equipment_6_short: "M113-B"
 BEL_mechanized_equipment_7: "AIFV-B-.50"
 BEL_mechanized_equipment_7_short: "AIFV-B-.50"
 BEL_mechanized_equipment_7_desc: "Variante de l'armée belge du vénérable AIFV avec une coupole CWS de 12,7 mm, deux mortiers Lyran de 71 mm et un support d'attelage pour un lanceur de missiles MILAN."
 BEL_mechanized_equipment_8: "AIFV-A1-B-.50"
 BEL_mechanized_equipment_8_short: "AIFV-A1-B-.50"
 BEL_mechanized_equipment_8_desc: "Mise à niveau de mi-vie vers la variante de l'armée belge du vénérable AIFV avec une coupole CWS de 12,7 mm, deux mortiers Lyran de 71 mm et un support d'attelage pour un lanceur de missiles MILAN."
 BEL_mechanized_equipment_9: "Steyr-Daimler-Puch Spezialfahrzeuge Pandur I"
 BEL_mechanized_equipment_9_short: "Pandur Ier"
 BEL_mechanized_equipment_9_desc: "Le Pandur est un APC développé et produit par la société autrichienne Steyr-Daimler-Puch Spezialfahrzeuge (SSF). Elle a été développée dans les années 1980 en tant qu'entreprise privée."
 BEL_mechanized_equipment_10: "Mowag Piranha IIIC FUS"
 BEL_mechanized_equipment_10_short: "Piranha IIIC FUS"
 BEL_mechanized_equipment_10_desc: "Variante de l'armée belge du Mowag Piranha 8x8 pour remplacer les anciens AIFV et M113 à chenilles en service belge après la fin de la guerre froide. Nommé Fusilier pour indiquer son rôle de transport de troupes pour l'infanterie belge."

 BEL_mechanized_heavy_equipment_2: "M75"
 BEL_mechanized_heavy_equipment_2_short: "M75"
 BEL_mechanized_heavy_equipment_2_desc: "Le M75 est un APC lourd développé par l'International Harvester Corporation au début des années 1950. Le M75 a été largement utilisé pendant la guerre de Corée, mais a ensuite été abandonné très rapidement. Le M75 est équipé d'un moteur à essence 6 cylindres AO-895-4 et d'une suspension à barre de torsion. Il peut se déplacer à 43 mph avec une autonomie de 115 miles. Après que le projet M44 ait été annulé en raison de sa taille excessive, le développement d'un autre PC lourd entièrement fermé a commencé. Le projet M75 a abouti à un châssis beaucoup plus petit, bien plus rapide que le M44. Cependant, il était toujours considéré comme trop important et le projet M95 a continué à bénéficier de financements"
 BEL_mechanized_heavy_equipment_5: "FMC AIFV-B-C25"
 BEL_mechanized_heavy_equipment_5_short: "AIFV-B-C25"
 BEL_mechanized_heavy_equipment_5_desc: " Une variante néerlandaise révisée équipée de la même suspension que le M113A1-B (similaire au M113A2), d'un système NBC et d'un système d'extinction d'incendie au halon."
 BEL_mechanized_heavy_equipment_6: "FMC AIFV-A1-B-C25"
 BEL_mechanized_heavy_equipment_6_short: "AIFV-A1-B-C25"
 BEL_mechanized_heavy_equipment_6_desc: " Variante mise à jour de l'AIFV d'origine en suspension de service dans l'armée belge similaire au M113A1-B (similaire au M113A2), un système NBC et un système d'extinction d'incendie au halon."
 BEL_mechanized_heavy_equipment_7: "FMC AIFV-A2-B-C25"
 BEL_mechanized_heavy_equipment_7_short: "AIFV-A2-B-C25"
 BEL_mechanized_heavy_equipment_7_desc: "Version mise à jour du vénérable AIFV au service de l'armée belge avec un meilleur équipement de vision nocturne et une protection NBC améliorée."
 BEL_mechanized_heavy_equipment_8: "Ateliers de Constructions Electriques de Charleroi Cobra GAD-AOA"
 BEL_mechanized_heavy_equipment_8_short: "ACEC Cobra GAD-AOA"
 BEL_mechanized_heavy_equipment_8_desc: "Prototype d'un nouveau IFV de l'armée belge qui a été annulé en raison de la fin de la guerre froide. Armé d'une tourelle Oerlikon-Contraves GAD-AOA de 25 mm avec canon modèle 204GK de 20 mm, ainsi que de l'option pour la tourelle compacte Euromissile MILAN."

