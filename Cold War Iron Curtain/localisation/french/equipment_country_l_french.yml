 POR_lt_equipment_3:0 "Panhard EBR"
 POR_lt_equipment_3_short:0 "Panhard EBR"
 POR_lt_equipment_3_desc:0 "Le Panhard EBR (Panhard Engin Blindé de Reconnaissance) est un véhicule blindé conçu par Panhard pour l'armée française, puis utilisé à travers le monde, notamment par l'armée française pendant la guerre d'Algérie et par l'armée portugaise pendant la guerre coloniale portugaise en Angola, au Mozambique et en Guinée-Bissau."
 POR_lt_equipment_4:0 "Panhard AML-60"
 POR_lt_equipment_4_short:0 "AML-60"
 POR_lt_equipment_4_desc:0 "Plus officiellement connu sous le nom d'AML HE 60-7, ou sous le code de son fabricant AML-245B, l'AML-60 était le premier modèle de série de Panhard. Il était équipé d'une tourelle arrondie avec deux mitrailleuses de 7,62 mm à gauche et un mortier de 60 mm (2,36 pouces) à chargement par la culasse à droite, avec respectivement 3 800 cartouches de 7,62 mm et 43 à 53 projectiles de mortier."
 POR_lt_equipment_5:0 "Bravia Chaimite V-400"
 POR_lt_equipment_5_short:0 "V-400"
 POR_lt_equipment_5_desc:0 "Le Bravia Chaimite est un véhicule blindé à traction intégrale construit par la société portugaise Bravia. Cette variante est un véhicule d'appui-feu lourd équipé d'un canon à basse pression de 90 mm ou 75 mm."
