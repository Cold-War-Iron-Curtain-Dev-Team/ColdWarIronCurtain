 AST_lt_equipment_3:0 "Char de combat à chenilles, canon de 76 mm, M41"
 AST_lt_equipment_3_short:0 "M41 Walker Bulldog"
 AST_lt_equipment_3_desc:0 "Le M41 est un char de reconnaissance léger développé par Cadillac en 1949. Il a été utilisé au combat au Vietnam, dans la baie des Cochons, au Liban et en Somalie. Son blindage varie entre 19 mm et 31,7 mm. Il est équipé d'un canon principal de 76 mm, d'une mitrailleuse coaxiale de calibre .30 et d'une mitrailleuse de calibre .50 sur le toit. Il utilise un moteur à essence Continental 6 cylindres et peut atteindre une vitesse de 72 km/h avec une autonomie de 160 km. Le développement du M41 progressait lentement en raison d'un financement insuffisant, mais lorsque la guerre de Corée a éclaté, l'armée américaine a commencé à accélérer le programme. Cette précipitation a entraîné un grand nombre de problèmes dans le programme et des problèmes de surdimensionnement. En raison des graves problèmes liés à la précipitation du programme, le M41 a été produit pendant très peu de temps et n'a pas été utilisé pendant la guerre de Corée. En fait, sa production n'a commencé qu'en 1951 et n'a duré que trois ans."
 AST_lt_equipment_4:0 "Transporteur, appui-feu, chenillé M113A1 (FS) Saladin Turret"
 AST_lt_equipment_4_short:0 "M113A1 FSV"
 AST_lt_equipment_4_desc:0 "Une variante du M113 équipée de la tourelle du véhicule blindé Alvis Saladin. Le FSV a été introduit dans les unités de l'armée australienne au milieu des années 1960, après le retrait des Saladin. Il était armé d'un canon de 76 mm, d'une mitrailleuse coaxiale de calibre .30 et d'une mitrailleuse de calibre .30 montée sur le toit de la tourelle du véhicule."
 AST_lt_equipment_5:0 "Transporteur, appui-feu, chenillé M113A1 (FS) Scorpion Turret"
 AST_lt_equipment_5_short:0 "M113A1 MRV"
 AST_lt_equipment_5_desc:0 "Variante australienne similaire au M113 FSV, mais utilisant la tourelle du char léger FV101 Scorpion, au lieu de l'ancienne tourelle du véhicule blindé Saladin, que le FSV utilisait auparavant. Cette tourelle était équipée d'un viseur à intensificateur d'image pour l'armement principal. Ce viseur II était le premier viseur nocturne passif efficace monté sur un véhicule blindé australien, donnant aux MRV une capacité de combat nocturne supérieure à celle du Leopard AS1 et de tous les autres véhicules blindés australiens de l'époque."
 AST_lt_equipment_6:0 "Véhicule de transport, appui-feu, chenillé M113A2+ (FS) Scorpion Turret"
 AST_lt_equipment_6_short:0 "M113A2+ MRV"
 AST_lt_equipment_6_desc:0 "Variante australienne similaire au M113 FSV, mais utilisant la tourelle du char léger FV101 Scorpion, au lieu de l'ancienne tourelle du véhicule blindé Saladin, que le FSV utilisait auparavant. Cette tourelle était équipée d'un viseur à intensificateur d'image pour l'armement principal. Ce viseur II était le premier viseur nocturne passif efficace monté sur un véhicule blindé australien, donnant aux MRV une capacité de combat nocturne supérieure à celle du Leopard AS1 et de tous les autres véhicules blindés australiens de l'époque."
