 SOV_lt_equipment_1:0 "T-60"
 SOV_lt_equipment_1_short:0 "T-60"
 SOV_lt_equipment_1_desc:0 "Le T60 était un char léger fabriqué pour remplacer le T-38 dans son rôle de reconnaissance. Il a été conçu en 1941 par Nicholas Astrov et 6 300 exemplaires ont été produits au cours des deux années de sa fabrication. Ce véhicule était un char à deux membres d'équipage équipé d'un moteur 6 cylindres et pouvant atteindre une vitesse de 44 km/h, avec un canon principal de 20 mm. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 SOV_lt_equipment_2:0 "T-70"
 SOV_lt_equipment_2_short:0 "T-70"
 SOV_lt_equipment_2_desc:0 "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et aterminé en 1942. Au cours des 2 années de fabrication, 8 300 ont été produits. Le char avait un canon bien plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée, Il a été largement utilisé pendant la Seconde Guerre mondiale. "
 SOV_lt_equipment_3:0 "PT-76"
 SOV_lt_equipment_3_short:0 "PT-76"
 SOV_lt_equipment_3_desc:0 "Le PT-76 est un char léger amphibie soviétique qui a été largement exporté à travers le monde. Il a été conçu par Nikolai Shashmyrin et Zh. Kotin en 1951, et environ 12 000 exemplaires ont été produits. Il nécessite un équipage de trois hommes et est équipé d’un moteur V6 six cylindres en ligne, lui permettant d’atteindre une vitesse de 44 km/h sur terre et de nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique ou proches de l’Union soviétique et a ainsi rempli un rôle de reconnaissance dans pratiquement tous les conflits impliquant des nations de cette sphère. Toutefois, il est encore utilisé aujourd’hui par de nombreux pays en raison de sa fiabilité réputée et de sa facilité d’entretien."
 SOV_lt_equipment_4:0 "PT-76B Model 4"
 SOV_lt_equipment_4_short:0 "PT-76B"
 SOV_lt_equipment_4_desc:0 "Le PT-76 est équipé d'un canon rayé D-56TS de 76,2 mm (frein de bouche à double déflecteur, éjecteur de douilles, extracteur de fumée et système de stabilisation à deux axes STP-2P « Zarya »), du système de protection PAZ (protivo-atomnaya zashchita) , un système d'extinction automatique d'incendie, un viseur TShK-2-66 amélioré, un système de filtration-ventilation, des dispositifs d'observation améliorés, un équipement électrique amélioré, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."
 SOV_lt_equipment_5:0 "BRM-1K"
 SOV_lt_equipment_5_short:0 "BRM-1K"
 SOV_lt_equipment_5_desc:0 "Le BRM-1K est un véhicule de reconnaissance d'origine soviétique datant de la fin de la guerre froide. Il a été développé pour soutenir les formations blindées et mécanisées employées par les forces soviétiques. Le BRM-1K était destiné à reconnaître les itinéraires et à détecter les formations ennemies."
 SOV_lt_equipment_6:0 "BRM-3K"
 SOV_lt_equipment_6_short:0 "BRM-3K"
 SOV_lt_equipment_6_desc:0 "Le BRM-3K Rys a été développé au début des années 1990. Il était destiné à compléter et à remplacer le véhicule de reconnaissance BRM-1K. Il est basé sur le châssis du véhicule de combat d'infanterie BMP-3. Bien que le BRM-3K ait été officiellement accepté au service de l'armée russe en 1995, il est toujours produit en petite série."
