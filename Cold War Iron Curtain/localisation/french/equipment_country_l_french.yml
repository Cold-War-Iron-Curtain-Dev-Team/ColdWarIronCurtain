 JAP_spaag_equipment_5_desc: "Le canon antiaérien automoteur Type 87 Kai (87-shiki jiso kosha kikanho) est une arme de défense aérienne japonaise construite autour du système de canon double Oerlikon de 35 mm utilisé sur le canon antiaérien automoteur Gepard. Le système utilise un châssis de char de type 74 modifié. Il est également surnommé par les agents de terrain « Guntank » en référence au mecha d'apparence similaire de la série Mobile Suit Gundam."

