 YUG_mbt_equipment_0: "T-34-85"
 YUG_mbt_equipment_0_short: "T-34-85"
 YUG_mbt_equipment_0_desc: "Le T-34 est un char moyen soviétique qui a révolutionné le domaine de la conception des chars et est bien connu pour sa fiabilité. Le T-34 a été conçu en 1940 par le KMBD en Union soviétique. Dans le but de réduire les coûts, le blindage incliné a été introduit dans la conception du char. Cependant, cela a également permis au réservoir lui-même de devenir bien mieux protégé et moins coûteux avec une surface plus petite. L'arme elle-même est un canon de 76,2 mm et avait une capacité de transport de munitions nominale. Cependant, les viseurs et les dispositifs de vision étaient particulièrement médiocres, ce qui rendait difficile le fonctionnement des commandants de char et leur faible capacité de coordination réduisait de nombreux avantages offerts par le char lui-même. Le T-34 est devenu le deuxième char le plus produit au monde mais l'un des plus importants de la Seconde Guerre mondiale. Les T-34 sont encore utilisés aujourd'hui par les insurgés et les pays les plus pauvres."
 YUG_mbt_equipment_1: "M4A3E4"
 YUG_mbt_equipment_1_short: "M4A3E4"
 YUG_mbt_equipment_1_desc: "Sherman amélioré avec suspension HVSS, wetrack et 76 mm."
 YUG_mbt_equipment_2: "M47 Patton"
 YUG_mbt_equipment_2_short: "M47 Patton"
 #YUG_mbt_equipment_2_desc: ""
 YUG_mbt_equipment_3: "T-54"
 YUG_mbt_equipment_3_short: "T-54"
 YUG_mbt_equipment_3_desc: "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
 YUG_mbt_equipment_4: "T-55"
 YUG_mbt_equipment_4_short: "T-55"
 #YUG_mbt_equipment_4_desc: ""
 YUG_mbt_equipment_5: "T-55A"
 YUG_mbt_equipment_5_short: "T-55A"
 #YUG_mbt_equipment_5_desc: ""
 YUG_mbt_equipment_6: "T-72"
 YUG_mbt_equipment_6_short: "T-72"
 YUG_mbt_equipment_6_desc: "Le T-72 est un CCP soviétique créé comme une nouvelle génération de chars, principalement pour remplacer le T-62 et son homologue coûteux, le T-64. Il coûtait presque la moitié du prix du T-64 et comportait de vastes améliorations. Sa conception a été achevée en 1973 par Leonid Venediktov et a montré des capacités incroyables. Le canon et le blindage étaient toujours respectivement de 125 mm et composites, mais avec une conception beaucoup plus économique et plus facile à produire. Le moteur est un V-12 de 780 ch qui pourrait être ultérieurement réaménagé avec une conception de 1 130 ch. Le char pouvait atteindre une mobilité incroyable, atteignant des vitesses de 80 km/h et pouvait mieux s'adapter aux terrains plus difficiles que le T-64. Il a été utilisé dans tous les conflits de la sphère soviétique, contrairement au T-64, et y a également fait preuve d'incroyables capacités. Le char a également été largement utilisé dans des conflits hors de la sphère africaine, au Moyen-Orient et en Indochine."
