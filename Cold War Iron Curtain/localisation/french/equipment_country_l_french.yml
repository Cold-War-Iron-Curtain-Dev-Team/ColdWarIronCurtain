 SPR_mbt_equipment_0: "Verjeda 1"
 SPR_mbt_equipment_0_short: "Verjeda 1"
 SPR_mbt_equipment_0_desc: "L'apparence du prototype Verdeja 1 résultant était proche de celle initialement envisagée dans les premières conceptions du capitaine Verdeja. La coque du véhicule était allongée et la plaque arrière inclinée, tandis que la capacité de carburant - et donc la portée de combat - était augmentée, tout comme la capacité de munitions et l'épaisseur du blindage"
 SPR_mbt_equipment_1: "Panzerkampfwagen IV Ausf.H"
 SPR_mbt_equipment_1_short: "Panzer IV Ausf.H"
 SPR_mbt_equipment_1_desc: "Dès janvier 1944, l'Espagne recommença à négocier avec l'Allemagne pour obtenir davantage d'équipements. Le nouveau programme tournait autour de la vente de 33 Panzer IV, dont trois seraient de la variante commandement. Une autre offre a été faite pour 67 Panzer IV supplémentaires à une date ultérieure ; En conséquence, les deux programmes réunis résumaient un achat potentiel de 100 Panzer IV."
 #SPR_mbt_equipment_2: "M47 Patton"
 #SPR_mbt_equipment_2_short: "M47 Patton"
 SPR_mbt_equipment_3: "M47E Patton"
 SPR_mbt_equipment_3_short: "M47E Patton"
 SPR_mbt_equipment_3_desc: "Le M47 Patton est l'un des premiers chars de combat principaux et a été conçu par le département des munitions de l'armée américaine en 1951. Il est très similaire au M46 Patton mais avec une tourelle de canon mise à jour avec un mécanisme interne amélioré et une transmission améliorée. Il a connu des combats lors de la crise de Suez, de la guerre des 6 jours et des guerres yougoslaves."
 SPR_mbt_equipment_4: "M48 Patton"
 SPR_mbt_equipment_4_short: "M48 Patton"
 SPR_mbt_equipment_4_desc: "Le M48 Patton est un CCP conçu par le Département des munitions de l'armée américaine en 1953. Le M48 est doté d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Le moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents avec un système d'injection de carburant léger et est suralimenté. Il a une autonomie de fonctionnement hors route de 160 milles et de 300 milles sur route. Il peut rouler sur route à 30 mph, mais atteint 20 mph hors route grâce au moteur, à la transmission et aux chenilles améliorés. Il a servi de char principal pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton mais il s'agit d'un tout nouveau design avec de nouveaux mécanismes internes. Il est utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la Garde nationale exploitaient et entretenaient encore des M48 jusqu'à la fin des années 80."
 SPR_mbt_equipment_5: "M48A2 Patton"
 SPR_mbt_equipment_5_short: "M48A2 Patton"
 SPR_mbt_equipment_6: "AMX-30E"
 SPR_mbt_equipment_6_short: "AMX-30E"
 #SPR_mbt_equipment_6_desc: ""
 SPR_mbt_equipment_7: "AMX-30EM2"
 SPR_mbt_equipment_7_short: "AMX-30EM2"
 SPR_mbt_equipment_7_desc: "Le ministère espagnol de la Défense a accepté de moderniser les AMX-30E de l'armée en 1987 et a alloué 16 milliards de pesetas (155 millions de dollars) au programme. À partir de juillet 1987, l'armée a mis à niveau l'ensemble de sa flotte d'AMX-30E aux normes EM1 et EM2."
 SPR_mbt_equipment_8: "KMW Léopard 2A4S"
 SPR_mbt_equipment_8_short: "Léopard 2A4S"
 SPR_mbt_equipment_9: "KMW Léopard 2E"
 SPR_mbt_equipment_9_short: "Léopard 2E"

 SPR_mechanized_equipment_5: "FMW M113"
 SPR_mechanized_equipment_5_short: "M113"
 SPR_mechanized_equipment_5_desc: "Les APC américains les plus reconnaissables depuis les années 60. Il est largement utilisé et, grâce à des années de recherche, il en a fait un véritable véhicule blindé de transport de troupes, en utilisant sa hauteur, son angle de blindage et son épaisseur. Et plus tard, introduisant de plus en plus de variantes, s'armant d'un M2 Browning.50 Cal avec quelques milliers de tours de liberté. Se vante vraiment d'être un bon APC. Des dizaines de variantes provenaient de la gamme du M113, toujours utilisée par l'armée américaine à ce jour."
 SPR_mechanized_equipment_6: "FMW M113A2"
 SPR_mechanized_equipment_6_short: "M113A2"
 SPR_mechanized_equipment_6_desc: "Les APC américains les plus reconnaissables depuis les années 60. Il est largement utilisé et, grâce à des années de recherche, il en a fait un véritable véhicule blindé de transport de troupes, en utilisant sa hauteur, son angle de blindage et son épaisseur. Et plus tard, introduisant de plus en plus de variantes, s'armant d'un M2 Browning.50 Cal avec quelques milliers de tours de liberté. Se vante vraiment d'être un bon APC. Des dizaines de variantes provenaient de la gamme du M113, toujours utilisée par l'armée américaine à ce jour."

 SPR_mechanized_equipment_7: "Pegaso 3560 BMR"
 SPR_mechanized_equipment_7_short: "BMR"
 SPR_mechanized_equipment_8: "Pegaso 3560 BMR-M1"
 SPR_mechanized_equipment_8_short: "BMR-M1"
 SPR_mechanized_equipment_9: "Pegaso 3560 BMR-M2"
