 JAP_sht_equipment_1:0 "O-I"
 JAP_sht_equipment_1_short:0 "O-I"
 JAP_sht_equipment_1_desc:0 "Une chenille de char issue du projet est exposée à l'école JGSDF Fuji au Japon. Au final, l'histoire complète du prototype O-I reste inconnue en raison de la nature obscure du projet et du peu de documents connus pour avoir survécu à la guerre."
 JAP_mechanized_equipment_1:0 "Type 1 Ho-Ki"
 JAP_mechanized_equipment_1_short:0 "Type 1 Ho-Ki"
 JAP_mechanized_equipment_1_desc:0 "Le transport de troupes blindé de type 1 Ho-Ki était un transport de troupes blindé à chenilles (APC) développé par l'armée impériale japonaise pendant la Seconde Guerre mondiale."
 JAP_mechanized_equipment_2:0 "M3 Half-Track"
 JAP_mechanized_equipment_2_short:0 "M3 Half-Track"
 JAP_mechanized_equipment_2_desc:0 "Le semi-chenillé M3 était un véhicule blindé américain de transport de troupes largement utilisé par les Alliés pendant la Seconde Guerre mondiale et la guerre froide. Dérivé du semi-chenillé M2, le M3 a été produit en grande quantité, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. Pendant la guerre froide, ce véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, et est resté en service jusqu'au milieu des années 1990. Au Mexique, il est toujours utilisé en 2019."
 JAP_mechanized_equipment_3:0 "M5 Half-Track"
 JAP_mechanized_equipment_3_short:0 "M5 Half-Track"
 JAP_mechanized_equipment_3_desc:0 "Le M5 est un semi-chenillé M3 équipé d'un support de mitrailleuse M49 amélioré au-dessus du siège avant droit. Il s'agit d'une version simplifiée du M3A1. Entre 1942 et 1943, tous les semi-chenillés M3 (standard et A1) ont fait l'objet d'améliorations continues. Ces améliorations concernaient notamment la transmission, le moteur et le rangement."
 JAP_mechanized_equipment_4:0 "Transporteur, Personnel, À chenilles, Blindé, M59"
 JAP_mechanized_equipment_4_short:0 "M59"
 JAP_mechanized_equipment_5:0 "Komatsu Type 60 Roku-Maru-Shiki"
 JAP_mechanized_equipment_5_short:0 "Type 60"
 JAP_mechanized_equipment_5_desc:0 "Le véhicule blindé de transport de troupes Type 60 (60, roku-maru-shiki-soukou-sha) est un véhicule blindé de transport de troupes qui est entré en service dans l'Armée terrestre d'autodéfense du Japon en 1960."
 JAP_mechanized_equipment_6:0 "Komatsu Type 60 Kai Roku-Maru-Shiki"
 JAP_mechanized_equipment_6_short:0 "Type 60 Kai"
 JAP_mechanized_equipment_6_desc:0 "Le transport de troupes blindé Type 60 Kai (Kaizen ou amélioré) (60, roku-maru-shiki-soukou-sha) est un transport de troupes blindé qui est entré en service dans l'armée terrestre d'autodéfense japonaise après 1960."
 JAP_mechanized_equipment_7:0 "Mitsubishi Type 73 Nana-San-Shiki"
 JAP_mechanized_equipment_7_short:0 "Type 73"
 JAP_mechanized_equipment_7_desc:0 "Le véhicule blindé de transport de troupes Type 73 (73, nana-san-shiki-soukou-sya) est un véhicule blindé de transport de troupes qui est entré en service dans l'Armée terrestre d'autodéfense du Japon en 1973."
 JAP_mechanized_equipment_8:0 "Mitsubishi Type 73 Kai Nana-San-Shiki"
 JAP_mechanized_equipment_8_short:0 "Type 73 Kai"
 JAP_mechanized_equipment_8_desc:0 "Le transport de troupes blindé Type 73 Kai (Kaizen ou amélioré) (73, nana-san-shiki-soukou-sya) est un transport de troupes blindé qui est entré en service dans l'Armée terrestre d'autodéfense du Japon après 1973."
 JAP_mechanized_equipment_9:0 "Komatsu Type 96 Kyuu-Roku-Shiki"
 JAP_mechanized_equipment_9_short:0 "Type 96"
 JAP_mechanized_equipment_9_desc:0 "Le véhicule blindé à roues de type 96 (96, kyuu-roku-shiki-sourin-soukou-sya) est un véhicule blindé qui est entré en service au Japon en 1996."
 JAP_mechanized_equipment_10:0 "Komatsu Type 96B Kai Kyuu-Roku-Shiki"
 JAP_mechanized_equipment_10_short:0 "Type 96B"
 JAP_mechanized_equipment_10_desc:0 "Un nouveau prototype de véhicule blindé de transport de troupes 8×8 appelé « Wheeled Armoured Vehicle (Improved ou Kaizen) » a été remis aux forces armées japonaises afin de remplacer les 365 véhicules de type 96 actuellement en service. Développé par le ministère japonais de la Défense en collaboration avec Komatsu Limited, ce véhicule à roues de nouvelle génération a été conçu pour offrir une meilleure protection contre les engins explosifs improvisés (EEI). Sa configuration est similaire à celle du Patria AMV et du Stryker, offrant ainsi à l'armée japonaise une gamme de véhicules différents sur un châssis commun. Le nouveau véhicule proposé est plus long, plus haut et plus lourd que le Type 96."
 JAP_mechanized_heavy_equipment_6:0 "Type 89 Hachi-Kyu"
 JAP_mechanized_heavy_equipment_6_short:0 "Type 89"
 JAP_mechanized_heavy_equipment_7:0 "Type 89 Hachi-Kyu Kai"
 JAP_mechanized_heavy_equipment_7_short:0 "Type 89 Kai"
 JAP_mechanized_heavy_equipment_8:0 "Type 89 Hachi-Kyu SLEP"
 JAP_mechanized_heavy_equipment_8_short:0 "Type 89 SLEP"
 JAP_mechanized_heavy_equipment_8_desc:0 "Le Mitsubishi Type 89 IFV (89, Mitsubishi 89-shiki sōkō-sentō-sha) (89 FV) est un véhicule de combat d'infanterie japonais qui est entré en service dans l'Armée terrestre d'autodéfense du Japon en 1989. En 1999, 58 véhicules étaient en service et 120 avaient été produits au total en 2014, sur les 300 prévus. L'armement principal du véhicule est un canon Oerlikon Contraves KDE de 35 millimètres."
 JAP_motorized_equipment_1:0 "Toyota Model BQ 3.4-ton 4x4"
 JAP_motorized_equipment_1_short:0 "Model BQ 3.4t 4x4"
 JAP_motorized_equipment_2:0 "Toyota Model FSQ 2.5-ton 6x6"
 JAP_motorized_equipment_2_short:0 "Model FSQ 2.5t 6x6"
 JAP_motorized_equipment_3:0 "Isuzu TSD 2.5-ton 6x6"
 JAP_motorized_equipment_3_short:0 "TSD 2.5t 6x6"
 JAP_motorized_equipment_4:0 "Toyota Type 73 1.2-ton Generation 1 4x4"
 JAP_motorized_equipment_4_short:0 "Type 73 1.2t Gen1 4x4"
 JAP_motorized_equipment_5:0 "Isuzu Type 73 2.5-ton Generation 3 6x6"
 JAP_motorized_equipment_5_short:0 "Type 73 2.5t Gen3 6x6"
 JAP_mechanized_marine_equipment_1:0 "LVT-4 Water Buffalo"
 JAP_mechanized_marine_equipment_1_short:0 "LVT-4"
 JAP_mechanized_marine_equipment_1_desc:0 "Le LVTP-4 est un véhicule amphibie de débarquement conçu par la Ford Machinery Corporation au début des années 40. Le LVTP-4 a été utilisé pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Il est équipé d'un moteur radial W-670-9A à 7 cylindres et peut parcourir jusqu'à 75 miles dans l'eau à une vitesse de 7 mph. Évolution du LVTP-1, le LVTP-4 est capable de parcourir des distances incroyables, mais à une vitesse réduite. Si vous devez parcourir 70 miles en eau et que vous disposez d'environ 10 heures pour le faire, le LVTP-4 est le véhicule qu'il vous faut. Il est capable de transporter des troupes ou des véhicules."
 JAP_mechanized_marine_equipment_2:0 "LVT(A)-5"
 JAP_mechanized_marine_equipment_2_short:0 "LVT(A)-5"
 JAP_mechanized_marine_equipment_2_desc:0 "Le LVT(A)-4 était équipé d'une tourelle motorisée et d'un gyrostabilisateur pour l'obusier. Certains exemplaires ont été modernisés à la fin des années 1940 par une modification de la configuration du blindage."
 JAP_mechanized_marine_equipment_3:0 "Véhicule des neiges Ohara Type 78"
 JAP_mechanized_marine_equipment_3_short:0 "Type 78 SV"
 JAP_mechanized_marine_equipment_3_desc:0 "Le Type 78 est un véhicule à chenilles plutôt inhabituel. Son rôle principal est de circuler sur la neige et de transporter des passagers, des skieurs, des charges légères et divers équipements. Il a été produit par Ohara Iron Works. Ce véhicule des neiges utilisait des composants automobiles provenant du camion Type 73. Il a été adopté en 1978, d'où sa désignation. Il a remplacé les anciens véhicules des neiges Type 60 et Type 61."
 JAP_mechanized_marine_equipment_4:0 "AAVP-7A1"
 JAP_mechanized_marine_equipment_4_short:0 "AAVP-7A1"
 JAP_mechanized_marine_equipment_4_desc:0 "Le LVTP-7A1 est un véhicule blindé de transport de troupes amphibie conçu en 1984 par la Food Machinery Corporation. Il a été utilisé au combat dans le Golfe, en Syrie et en Irak. Le LVTP-7A1 est équipé d'un moteur VTAC RAM-RS de 525 ch et peut rouler à peu près à la même vitesse que le LVTP-7. Son moteur, sa transmission et son système d'armement ont été améliorés, et il est plus facile à entretenir que le LVTP-7. Il bénéficie également d'un certain nombre d'améliorations en matière de sécurité afin de réduire les effets des impacts."
 JAP_mechanized_marine_equipment_5:0 "Véhicule des neiges Ohara Type 10"
 JAP_mechanized_marine_equipment_5_short:0 "Type 10 SV"
 JAP_mechanized_marine_equipment_5_desc:0 "Le ministère japonais de la Défense recherchait un nouveau véhicule à chenilles pour remplacer son ancien véhicule à neige de type 78. Il utilisait de nombreux composants automobiles du camion militaire de type 73, qui avait été produit en grande quantité pour l'armée japonaise. Le nouveau véhicule à chenilles est produit par Ohara Corporation."
