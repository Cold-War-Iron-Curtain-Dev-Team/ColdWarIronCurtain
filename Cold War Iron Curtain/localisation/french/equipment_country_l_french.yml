 #Firearms and Infantry weapons

##Neutrals

 #####Nicaragua
 NIC_infantry_equipment_0: "Fusil américain, calibre.30-06, modèle 1903"
 NIC_infantry_equipment_0_short: "M1903 Springfield"
 NIC_infantry_equipment_0_desc: "Le M1903 Springfield, officiellement le fusil des États-Unis, calibre.30-06, modèle 1903, est un fusil à répétition de service américain à cinq cartouches, alimenté par un chargeur et à verrou. Il s'agit d'une action à boulon tournant de style Mauser avec un canon de 24\", un chargeur à colonne décalée de 5 cartouches contenu dans la crosse et une crosse monobloc à poignée droite. Il tire la cartouche de calibre.30-'06 à haute vitesse."

 NIC_infantry_equipment_1: "Fusil américain, calibre.30, M1"
 NIC_infantry_equipment_1_short: "M1 Garand"
 NIC_infantry_equipment_1_desc: "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 NIC_infantry_equipment_2: "Fusil Automatique Ligero"
 NIC_infantry_equipment_2_short: "FN FAL"
 NIC_infantry_equipment_2_desc: "Le FAL (Fusil Automático Ligero, Light Automatic Rifle), est un fusil de combat conçu en Belgique par Dieudonné Saive et fabriqué par FN Herstal. L'armée nicaraguayenne possédait à la fois le FN FAL belge et sa version israélienne, le ROMAT allégé."

 NIC_infantry_equipment_3: "IMI Galil SAR/ARM"
 NIC_infantry_equipment_3_short: "Galille"
 NIC_infantry_equipment_3_desc: "Au milieu des années 70, le Nicaragua a reçu les variantes IMI Galil SAR et ARM en 5,56 × 45 mm et 7,62 × 51 mm."

 NIC_infantry_equipment_4: "Fusil américain, 5,56 mm, M16A2"
 NIC_infantry_equipment_4_short: "M16A2"
 NIC_infantry_equipment_4_desc: "Après le manque de fiabilité fréquent de l'arme dans les jungles du Vietnam, le corps des marines américains a demandé une refonte de l'arme. En 1982, la refonte et les améliorations ont été apportées. L'arme comportait un récepteur renforcé, de nouvelles rayures, un boîtier renforcé, un meilleur refroidissement grâce à différents matériaux, un support amélioré pour les éléments attachables et un mécanisme interne repensé qui lui conférait un haut niveau de fiabilité. Il a été témoin de combats au Liban, en Libye, en Égypte et dans tous les autres conflits dans lesquels les États-Unis ont participé depuis leur création."
 #####Finland
 FIN_infantry_equipment_0: "SAKO Sotilaskivääri m/39"
 FIN_infantry_equipment_0_short: "M/39"
 FIN_infantry_equipment_0_desc: "Fusil militaire M/39, surnommé « Ukko-Pekka » en hommage à l'ancien président Pehr Evind Svinhufvud, le fusil a été conçu comme un compromis entre l'armée et la Garde blanche, adopté afin de standardiser la production finlandaise de Mosin-Nagant. Le M/39 était en grande partie dérivé du M28-30, mais comprenait quelques modifications proposées par l'armée. Le M/39 incorporait également une poignée semi-pistolet dans la crosse, bien que certains premiers exemples utilisaient des crosses droites typiques de Mosin-Nagant. Seuls 10 fusils furent achevés à la fin de la guerre d'Hiver, mais 96 800 furent produits après la guerre d'Hiver et utilisés dans la guerre de Continuation. Un petit nombre a également été assemblé à partir de pièces restantes entre la fin des années 1960 et les années 1970."

 FIN_infantry_equipment_1: "Suomi KP/-31"
 FIN_infantry_equipment_1_short: "KP/-31"
 FIN_infantry_equipment_1_desc: "Le Suomi KP/-31 est une mitraillette (SMG) de conception finlandaise qui fut principalement utilisée pendant la Seconde Guerre mondiale. Il s'agit d'un descendant du prototype M-22 et du modèle de production KP/-26, révélé au public en 1925. Il est entré en service en Finlande en 1931 et est resté utilisé jusque dans les années 1980."

 FIN_infantry_equipment_2: "Valmet Rynnäkkökivääri 62"
 FIN_infantry_equipment_2_short: "RK 62"
 FIN_infantry_equipment_2_desc: "Le RK 62 (du finnois rynnäkkökivääri 62 signifiant fusil d'assaut 62), est un fusil d'assaut fabriqué par Valmet et Sako. Le développement d'un fusil d'assaut finlandais a commencé dans les années 1950. Différents modèles étrangers ont été examinés, le plus important étant l'AK-47 soviétique. Les premiers prototypes construits étaient calqués sur les AK polonais et comportaient des crosses en bois de bouleau teinté. Après avoir testé le canon, les FDF ont décidé de l'adopter avec quelques modifications sous le nom de RK 62."

 FIN_infantry_equipment_3: "Valmet Rynnäkkökivääri 62 76"
 FIN_infantry_equipment_3_short: "RK 62 76"
 FIN_infantry_equipment_3_desc: "version du récepteur en acier estampé, qui ressemble au RK 62 avec des meubles en plastique de style plus récent, mais comporte un récepteur plus léger. Le poids total du RK 62 76 est de 3,27 kg. Contrairement à l'AK-47 et à l'AKM, les pièces internes sont entièrement interchangeables entre le RK 62 et le RK 62 76, la seule différence étant le récepteur."

 FIN_infantry_equipment_4: "SAKO Rynnäkkökivääri 95 taittoperä"
 FIN_infantry_equipment_4_short: "RK-95 TP"
 FIN_infantry_equipment_4_desc: "Le RK 95 a été adopté en nombre relativement restreint par les forces de défense finlandaises dans les années 1990. Le RK 95 TP présentait à l'origine de nombreuses améliorations, notamment un sélecteur de commande de tir et un dispositif de bouche permettant le tir de grenades à fusil, la fixation d'un silencieux ou d'une baïonnette"

 #Sweden
 SWE_infantry_equipment_0: "HVA Gevär m/96"
 SWE_infantry_equipment_0_short: "Gévar m/96"
 SWE_infantry_equipment_0_desc: "Les \"Mausers suédois\" sont une famille de fusils à verrou basés sur une variante améliorée du modèle 1893 antérieur de Mauser, mais utilisant la cartouche de 6,5 × 55 mm et incorporant des éléments de conception uniques à la demande de la Suède."

 SWE_infantry_equipment_1: "Pistolet Carl Gustafs SG Kulsprute m/45 B"
 SWE_infantry_equipment_1_short: "Kpist m/45B"
 SWE_infantry_equipment_1_desc: "Le modèle de mitraillette 45, également connu sous le nom de Carl Gustav M/45 et de suédois K SMG, est une mitraillette suédoise de 9 × 19 mm conçue par Gunnar Johnsson."

 SWE_infantry_equipment_2: "HVA Automatkarbin 4"
 SWE_infantry_equipment_2_short: "Ak 4"
 SWE_infantry_equipment_2_desc: "L'Automatkarbin 4, ou Automatic Carabine 4, est une copie suédoise du fusil ouest-allemand G3."

 SWE_infantry_equipment_3: "Carl Gustavs SG Automatkarbin 5"
 SWE_infantry_equipment_3_short: "Ak 5"
 SWE_infantry_equipment_3_desc: "L'Ak 5 ou Automatkarbin 5 (« carabine automatique 5 », « carabine automatique » étant le terme suédois pour fusil d'assaut) est la version suédoise du fusil d'assaut FN FNC avec certaines modifications, principalement pour adapter l'arme au climat suédois partiellement subarctique. L'Ak 5 est le fusil de service des forces armées suédoises. L'Ak 5 a remplacé l'Ak 4 (une version sous licence du Heckler & Koch G3) en service suédois."

 SWE_infantry_equipment_4: "Bofors Automatkarbin 5C"
 SWE_infantry_equipment_4_short: "Ak 5C"
 SWE_infantry_equipment_4_desc: "Au début du 21e siècle, l'armée suédoise souhaitait un fusil d'assaut plus moderne à intégrer dans un futur programme militaire suédois. Le fusil devait être doté d'un système d'intégration de rails, d'une meilleure ergonomie et d'une fiabilité améliorée. Au lieu d'acheter un nouveau fusil d'assaut, la Suède a choisi de modifier la famille de fusils Ak 5(B) existante déjà utilisée, réduisant ainsi les risques et les coûts du programme."

##### MIDDLE EAST

### Israel

 ISR_infantry_equipment_0: "Sten Mark V"
 ISR_infantry_equipment_0_short: "Sten"
 ISR_infantry_equipment_0_desc: "Introduit en 1944, le Sten Mark V est essentiellement une version de meilleure qualité et plus élaborée du Mk 2. Les changements comprenaient une poignée pistolet en bois, une poignée avant verticale en bois, une crosse en bois et une monture à baïonnette."

 #ISR_infantry_equipment_0: "Short Magazine Lee-Enfield Rifle, No. 4 Mk I"
 #ISR_infantry_equipment_0_short: "SMLE No. 4"
 #ISR_infantry_equipment_0_desc: "The Lee-Enfield is a bolt-action, magazine-fed, repeating rifle that served as the main firearm used by the British Empire and Commonwealth during the first half of the 20th century. It was the British Army's standard rifle from 1895 to 1957. The rifle saw extensive service throughout the Second World War, especially in the North African, Italian, Pacific and Burmese theatres in the hands of British and Commonwealth forces. Australia and India retained and manufactured the SMLE Mk III* as their standard rifle during the conflict and the rifle remained in Australian military service through the Korean War, until it was replaced by the L1A1 SLR in the late 1950s."

 ISR_infantry_equipment_1: "Rov've Mitta'enn"
 ISR_infantry_equipment_1_short: "Rome"
 ISR_infantry_equipment_1_desc: "Confrontée à des défis logistiques liés à la présence d'une grande variété d'armes à feu anciennes en service, Tsahal a décidé de remplacer les vieux fusils à verrou allemands et britanniques par un nouveau fusil à chargement automatique. Tsahal a décidé en 1955 d'adopter le FN FAL comme fusil d'infanterie standard, sous le nom de Rov've Mitta'enn ou Romat, abréviation de « Self-Loading Rifle ». La version FAL commandée par Tsahal se déclinait en deux variantes de base, à la fois semi-automatique standard et automatique à canon lourd, et était chambrée pour des munitions OTAN de 7,62 mm."

 ISR_infantry_equipment_2: "Fusil automatique IMI Galil"
 ISR_infantry_equipment_2_short: "Galil AR"
 ISR_infantry_equipment_2_desc: "À la fin des années 60 et au début des années 70, le principal fusil de combat de Tsahal, le Romat, a commencé à montrer ses faiblesses."

 ISR_infantry_equipment_3: "Mitrailleuse à fusil automatique IMI Galil"
 ISR_infantry_equipment_3_short: "Galil ARM"
 ISR_infantry_equipment_3_desc: "À la fin des années 60 et au début des années 70, le principal fusil de combat de Tsahal, le Romat, a commencé à montrer ses faiblesses."

 ISR_infantry_equipment_4: "JE M4"
 ISR_infantry_equipment_4_short: "M4"
 ISR_infantry_equipment_4_desc: "Variante produite par Israël de la carabine M4. Numéro standard dans les Forces de défense israéliennes, mais il a été progressivement remplacé par l'IWI Tavor depuis 2001."


##### NATO

### Netherlands
 HOL_infantry_equipment_0: "Fusil américain, calibre.30, M1"
 HOL_infantry_equipment_0_short: "M1 Garand"
 HOL_infantry_equipment_0_desc: "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 HOL_infantry_equipment_1: "Fusil Automatique Léger"
 HOL_infantry_equipment_1_short: "FN FAL"
 HOL_infantry_equipment_1_desc: "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 HOL_infantry_equipment_2: "Fusil Automatique Léger Polymère"
 HOL_infantry_equipment_2_short: "FN Fal(p)"

 HOL_infantry_equipment_3: "Fusil Diemaco 5,56 mm C7"
 HOL_infantry_equipment_3_short: "C7"
 HOL_infantry_equipment_3_desc: "Le Colt Canada C7 est une famille canadienne de fusils militaires, fabriqués par Colt Canada (anciennement Diemaco avant 2005), ayant une conception et une fonction similaires à celles du Colt M16A3."

 HOL_infantry_equipment_4: "Fusil Diemaco 5,56 mm C7A1"
 HOL_infantry_equipment_4_short: "C7A1"
 HOL_infantry_equipment_4_desc: "Le C7A1 (Diemaco C7FT) remplace l'ensemble viseur en fer/poignée de transport utilisé sur le C7 par un rail Weaver modifié pour le montage de l'optique. Le développement canadien des rails a précédé la normalisation américaine du « rail Picatinny » MIL-STD-1913, de sorte que le « Canadian Rail » ou « Diemaco Rail » diffère légèrement. Il y a 14 emplacements au lieu de 13, et chaque emplacement est plus étroit. La hauteur du rail est également plus élevée, permettant l'utilisation d'un guidon de hauteur normale."

 ### Denmark
 DEN_infantry_equipment_0: "Fusil américain, calibre.30, M1"
 DEN_infantry_equipment_0_short: "M1 Garand"
 DEN_infantry_equipment_0_desc: "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 DEN_infantry_equipment_1: "Gevaer M/50"
 DEN_infantry_equipment_1_short: "M/50"

 DEN_infantry_equipment_2: "Gevaer M/66"
 DEN_infantry_equipment_2_short: "M/66"

 DEN_infantry_equipment_3: "Gevaer M/75"
 DEN_infantry_equipment_3_short: "M/75"

 DEN_infantry_equipment_4: "Gevaer M/95"
 DEN_infantry_equipment_4_short: "M/95"

 #Portugal
 POR_infantry_equipment_0: "Mousqueton 98k Espingarda 8 mm Mauser m/938"
 POR_infantry_equipment_0_short: "Mauser m/938"
 POR_infantry_equipment_0_desc: "Le Mauser-Vergueiro était un fusil à verrou, conçu en 1904 par José Alberto Vergueiro, un officier d'infanterie de l'armée portugaise, et fabriqué par Deutsche Waffen und Munitionsfabriken (DWM). Il a été développé à partir du fusil Mauser 98 avec l'introduction d'un nouveau système de verrou dérivé du Gewehr 1888 et du Mannlicher - Schönauer. En dehors du Portugal, l'arme était également connue sous le nom de Mauser portugais."

 POR_infantry_equipment_1: "Artillerie Inrichtingen ArmaLite AR-10"
 POR_infantry_equipment_1_short: "ArmaLite AR-10"
 POR_infantry_equipment_1_desc: "La conception finale de l'Artillerie Inrichtingen est connue sous le nom de modèle portugais AR-10. Cette version finale incorporait tout ce qui avait été appris jusqu'à présent sur l'AR-10, y compris les rapports d'essais sur le terrain et les fusils de service d'infanterie. En plus d'un canon plus lourd avec une chambre chromée, d'un bipied en option et des protège-mains amovibles en plastique/métal du modèle Transitional, la variante portugaise avait des pattes de boulon plus larges, un extracteur plus solide, un nouveau régulateur de gaz simplifié à trois positions et une poignée d'armement dotée d'une assistance au boulon avant."

 POR_infantry_equipment_2: "Heckler & Koch G3"
 POR_infantry_equipment_2_short: "G3"
 POR_infantry_equipment_2_desc: "Modèle original basé sur le CETME Model 58 introduit en 1959 et approuvé en 1960. Il avait une crosse et un garde-main en bois."

 POR_infantry_equipment_3: "Heckler & Koch G3A3"
 POR_infantry_equipment_3_short: "G3A3"
 POR_infantry_equipment_3_desc: "La version de 1963 la plus connue. Des viseurs à tambour avec un guidon amélioré, un suppresseur de flash/frein de bouche capable de tirer des grenades aux normes OTAN, une crosse fixe en plastique solide et un protège-main en plastique qui n'entre pas en contact avec le canon flottant. Le protège-main était disponible en version fine et ventilée et en version large. Ce dernier permet la fixation d'un bipied."

 POR_infantry_equipment_4: "Heckler & Koch HK33E"
 POR_infantry_equipment_4_short: "HK33E"
 POR_infantry_equipment_4_desc: "Le HK33 est un fusil d'assaut de 5,56 mm développé dans les années 1960 par le fabricant d'armement ouest-allemand Heckler & Koch GmbH (H&K), principalement pour l'exportation."

 ### Norway
 NOR_infantry_equipment_0: "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 NOR_infantry_equipment_0_short: "SMLE n°4"
 NOR_infantry_equipment_0_desc: "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."


 NOR_infantry_equipment_2: "Heckler & Koch G3"
 NOR_infantry_equipment_2_short: "G3"
 NOR_infantry_equipment_2_desc: "Modèle original basé sur le CETME Model 58 introduit en 1959 et approuvé en 1960. Il avait une crosse et un garde-main en bois."

 NOR_infantry_equipment_3: "Kongsberg Våpenfabrikk AG-3"
 NOR_infantry_equipment_3_short: "AG-3"

 NOR_infantry_equipment_4: "Kongsberg Våpenfabrikk AG-3F1"
 NOR_infantry_equipment_4_short: "AG-3F1"

 ### Belgium
 BEL_infantry_equipment_0: "Fabrique Nationale Modèle 1949"
 BEL_infantry_equipment_0_short: "FN-49"
 BEL_infantry_equipment_0_desc: "Avec une conception remontant au début des années 1930, le FN-49 est disponible à la fois comme fusil semi-automatique et comme fusil automatique à tir sélectif avec chargeurs de 10 cartouches.\nBien que bien considéré pour sa haute qualité de fabrication et sa fiabilité par rapport aux fusils de l'époque, sa valeur marchande était limitée, car il n'a pas été développé à temps pour être utilisé pendant la Seconde Guerre mondiale, mais plus tard, car de nombreuses armées avaient déjà commencé à passer aux fusils de combat à tir sélectif. Un nombre inconnu de FN-49 ont été produits comme fusils automatiques à tir sélectif, mais le petit chargeur de 10 cartouches limitait l'utilité de la fonction entièrement automatique."

 BEL_infantry_equipment_1: "Fabrique Nationale Fusil Automatique Léger"
 BEL_infantry_equipment_1_short: "FN FAL"
 BEL_infantry_equipment_1_desc: "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 BEL_infantry_equipment_2: "Fabrique Nationale Carabine Automatique Légère"
 BEL_infantry_equipment_2_short: "CAL FN"
 BEL_infantry_equipment_2_desc: "La CAL (Carabine Automatique Légère) était une arme belge fabriquée par la Fabrique Nationale. C'était le premier fusil de 5,56 mm produit par la Fabrique Nationale. Il ressemblait au FN FAL, très réussi de la société, mais il s'agissait d'une conception originale. Contrairement au FAL, il s'agit d'un échec du marché, même si son développement a conduit au succès raisonnable du FN FNC."

 BEL_infantry_equipment_3: "Carabine M2 de la Fabrique Nationale"
 BEL_infantry_equipment_3_short: "FNC M2"
 BEL_infantry_equipment_3_desc: "Le FNC a été développé entre 1975 et 1977 pour les essais de normalisation de l'OTAN, comme alternative moins coûteuse au fusil M16 chambré en 5,56 x 45 mm OTAN. La conception du fusil est basée sur le prototype FNC 76, lui-même issu du fusil FN CAL, qui a connu un échec commercial."

 BEL_infantry_equipment_4: "Carabine Fabrique Nationale M3"
 BEL_infantry_equipment_4_short: "FNC M3"
 BEL_infantry_equipment_4_desc: "Version carabine de la Fabrique Nationale Carabine M2 créée en grande partie pour les besoins des unités Para-Commando belges. Il comporte un canon plus court et est également chambré en 5,56x45 mm OTAN."

 #SPAIN
 SPR_infantry_equipment_0: "Mauser M43 espagnol"
 SPR_infantry_equipment_0_short: "M43 espagnol"
 SPR_infantry_equipment_0_desc: "Les Espagnols ont créé le M43 espagnol, produit à La Corogne de 1944 à 1958, était une variante du Karabiner 98k avec une poignée à boulon droit, un protège-guidon et une rainure de poignée dans la crosse avant, un peu comme l'ancien Reichspostgewehr."

 SPR_infantry_equipment_1: "CETME Modèle 58A"
 SPR_infantry_equipment_1_short: "CETME Modèle 58A"
 SPR_infantry_equipment_1_desc: "Le CETME modèle 58 est un fusil de combat à tir sélectif en acier embouti produit par le fabricant d'armement espagnol Centro de Estudios Técnicos de Materiales Especiales (CETME). Le modèle 58 utilisait un chargeur de 20 cartouches et était chambré pour la cartouche OTAN de 7,62 × 51 mm (bien qu'à l'origine conçu pour la cartouche CETME de 7,92 x 51 mm et plus tard pour la cartouche espagnole de 7,62 × 51 mm à puissance réduite). Le CETME 58 deviendrait la base du fusil de combat allemand Heckler & Koch G3, largement déployé. Des variantes semi-automatiques ont également été produites pour le marché civil."

 SPR_infantry_equipment_2: "CETME Modèle 58B"
 SPR_infantry_equipment_2_short: "CETME Modèle 58B"
 SPR_infantry_equipment_2_desc: "Le modèle B fut le premier modèle de production. Il avait un garde-main en acier perforé et chambré pour la cartouche CETME de 7,62 × 51 mm. Le CETME de 7,62 mm différait de l'obus standard de l'OTAN de 7,62 mm en ayant une balle plus légère et une charge propulsive plus petite."

 SPR_infantry_equipment_3: "CETME Modèle L"
 SPR_infantry_equipment_3_short: "CETME Modèle L"
 SPR_infantry_equipment_3_desc: "Le modèle L est un fusil d'assaut espagnol OTAN de 5,56 × 45 mm développé à la fin des années 1970 dans l'établissement public de recherche et développement sur les armes légères CETME (Centro de Estudios Técnicos de Materiales Especiales) situé à Madrid. Le fusil conserve de nombreux éléments de conception éprouvés que l'institut avait utilisés précédemment dans ses fusils de combat CETME modèle 58."

 SPR_infantry_equipment_4: "Heckler & Koch G36E"
 SPR_infantry_equipment_4_short: "G36E"
 SPR_infantry_equipment_4_desc: "Le G36E est un fusil d'assaut de 5,56 mm et est la version d'exportation du G36 standard créé par le fabricant d'armement ouest-allemand Heckler & Koch GmbH (H&K)."

### United Kingdom
 ENG_infantry_equipment_0: "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 ENG_infantry_equipment_0_short: "SMLE n°4"
 ENG_infantry_equipment_0_desc: "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 ENG_infantry_equipment_1: "Fusil à chargement automatique L1A1"
 ENG_infantry_equipment_1_short: "L1A1 REFLEX"
 ENG_infantry_equipment_1_desc: "Le L1A1 SLR est une version britannique du fusil de combat belge FN FAL. Il a été produit sous licence et a été utilisé dans de nombreux pays du Commonwealth. Le Royaume-Uni a produit sa propre variante du FN FAL intégrant les modifications développées par l'Allied Rifle Committee, le désignant le L1A1 Self Loading Rifle (SLR). Les armes ont été fabriquées par la Royal Small Arms Factory Enfield, Birmingham Small Arms, la Royal Ordnance Factory et le ROF Fazakerley. Après l'arrêt de la production, des composants de remplacement ont été fabriqués par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à 1994 environ, remplacé par le L85A1 à partir de 1985."

 ENG_infantry_equipment_2: "Polymère de fusil à chargement automatique L1A1"
 ENG_infantry_equipment_2_short: "L1A1 SLR(p)"
 ENG_infantry_equipment_2_desc: "Version polymère plus légère du L1A1 SLR."

 ENG_infantry_equipment_3: "L85A1"
 ENG_infantry_equipment_3_short: "L85A1"
 ENG_infantry_equipment_3_desc: "Le L85A1 est un fusil à tir sélectif à gaz avec disposition bullpup. Le principal avantage de la disposition bullpup est la compacité globale de l'arme. Ce fusil d'assaut est chambré pour la cartouche standard OTAN de 5,56 x 45 mm. Il convient de mentionner que le fusil d'assaut L85A1 souffrait de nombreux problèmes. En général, il était assez peu fiable et difficile à entretenir. La fiabilité de cette arme n'était pas un gros problème, du moins pour le gouvernement britannique, jusqu'à ce que le L85A1 participe à un combat réel et se comporte très mal. Ce n'est qu'en 1997 que Heckler & Koch a été embauché pour résoudre les problèmes des fusils L85A1."

 ENG_infantry_equipment_4: "L85A2"
 ENG_infantry_equipment_4_short: "L85A2"
 ENG_infantry_equipment_4_desc: "Le L85A2 est une variante améliorée du fusil d'assaut original L85A1, adopté par l'armée britannique en 1984 comme arme d'infanterie standard. Le fusil d'assaut L85A1 d'origine présentait des problèmes de fiabilité et de performances. Cette variante a donc été introduite pour résoudre ces problèmes. Actuellement, le L85A2 est le fusil de service standard des forces britanniques. Le L85A2 est alimenté par 30 chargeurs ronds en forme de boîte. Il s'agit des chargeurs STANAG standards de l'OTAN. Les chargeurs originaux du L85A1 n'étaient pas très robustes et causaient de nombreux problèmes. Les chargeurs et le puits de chargeur ont été améliorés sur le L85A2 pour éviter les problèmes d'alimentation."

 ### Canada
 CAN_infantry_equipment_0: "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 CAN_infantry_equipment_0_short: "SMLE n°4"
 CAN_infantry_equipment_0_desc: "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 CAN_infantry_equipment_1: "Fusil 7,62 mm FN C1"
 CAN_infantry_equipment_1_short: "C1"
 CAN_infantry_equipment_1_desc: "Le C1 est une version canadienne du fusil de combat belge FN FAL. Il a été produit sous licence et a été utilisé dans de nombreux pays du Commonwealth. Le Royaume-Uni a produit sa propre variante du FN FAL intégrant les modifications développées par l'Allied Rifle Committee, le désignant le L1A1 Self Loading Rifle (SLR). Les armes ont été fabriquées par la Royal Small Arms Factory Enfield, Birmingham Small Arms, la Royal Ordnance Factory et le ROF Fazakerley. Après l'arrêt de la production, des composants de remplacement ont été fabriqués par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à 1994 environ, remplacé par le L85A1 à partir de 1985."

 CAN_infantry_equipment_2: "Fusil 7,62 mm FN C1A1"
 CAN_infantry_equipment_2_short: "C1A1"
 CAN_infantry_equipment_2_desc: "Version améliorée du C1."

 CAN_infantry_equipment_3: "Fusil Diemaco 5,56 mm C7"
 CAN_infantry_equipment_3_short: "C7"
 CAN_infantry_equipment_3_desc: "Le Colt Canada C7 est une famille canadienne de fusils militaires, fabriqués par Colt Canada (anciennement Diemaco avant 2005), ayant une conception et une fonction similaires à celles du Colt M16A3."

 CAN_infantry_equipment_4: "Fusil Diemaco 5,56 mm C7A1"
 CAN_infantry_equipment_4_short: "C7A1"
 CAN_infantry_equipment_4_desc: "Le C7A1 (Diemaco C7FT) remplace l'ensemble viseur en fer/poignée de transport utilisé sur le C7 par un rail Weaver modifié pour le montage de l'optique. Le développement canadien des rails a précédé la normalisation américaine du « rail Picatinny » MIL-STD-1913, de sorte que le « Canadian Rail » ou « Diemaco Rail » diffère légèrement. Il y a 14 emplacements au lieu de 13, et chaque emplacement est plus étroit. La hauteur du rail est également plus élevée, permettant l'utilisation d'un guidon de hauteur normale."

#West Germany

 WGR_infantry_equipment_0: "Mousqueton 98 kurz"
 WGR_infantry_equipment_0_short: "Mousqueton 98k"
 WGR_infantry_equipment_0_desc: "Un fusil à verrou emblématique adopté par la Wehrmacht en 1935 comme fusil de service standard. C'était l'un des derniers développements de la longue lignée de fusils militaires Mauser. Bien que complété par des fusils semi-automatiques et entièrement automatiques pendant la Seconde Guerre mondiale, il est resté le principal fusil de service allemand jusqu'à la fin de la guerre en 1945. Malgré le nombre croissant de fusils semi-automatiques et entièrement automatiques, le Kar98k continue d'être utilisé des deux côtés du rideau de fer."

 WGR_infantry_equipment_1: "Heckler & Koch G1"
 WGR_infantry_equipment_1_short: "G1"
 WGR_infantry_equipment_1_desc: "Le G1 ou Gewehr 1 est une variante du FN FAL. Il comportait un garde-main en métal embouti identique à ceux utilisés sur le Stg autrichien. 58, ainsi que les FAL néerlandais et grecs, légèrement plus minces que les protège-mains standard en bois ou en plastique, et comportant des lignes horizontales sur presque toute leur longueur. Les G1 étaient également équipés d'un cache-flash amovible unique, ajoutant une autre distinction externe."

 WGR_infantry_equipment_2: "Heckler & Koch G3"
 WGR_infantry_equipment_2_short: "G3"
 WGR_infantry_equipment_2_desc: "Le G3 ou Gewehr 3 est un fusil de combat OTAN à tir sélectif de 7,62 × 51 mm développé dans les années 1950 par le fabricant d'armement allemand Heckler & Koch en collaboration avec l'agence publique espagnole de conception et de développement CETME."

 WGR_infantry_equipment_3: "Heckler & Koch G3A3"
 WGR_infantry_equipment_3_short: "G3A3"
 WGR_infantry_equipment_3_desc: "La version 1963 la plus connue du G3. Des viseurs à tambour avec un guidon amélioré, un suppresseur de flash/frein de bouche capable de tirer des grenades aux normes OTAN, une crosse fixe en plastique solide et un protège-main en plastique qui n'entre pas en contact avec le canon flottant. Le protège-main était disponible en version fine et ventilée et en version large. Ce dernier permet la fixation d'un bipied."

 WGR_infantry_equipment_4: "Heckler & Koch G36"
 WGR_infantry_equipment_4_short: "G36"
 WGR_infantry_equipment_4_desc: "Le Heckler & Koch G36 (Gewehr 36) est un fusil d'assaut de 5,56 × 45 mm conçu au début des années 1990 par le fabricant d'armes allemand Heckler & Koch en remplacement du fusil de combat G3 plus lourd de 7,62 × 51 mm. Il a été mis en service par la Bundeswehr en 1997, en remplacement du G3."

### France

 FRA_infantry_equipment_0: "MAS-36"
 FRA_infantry_equipment_0_short: "MAS-36"
 FRA_infantry_equipment_0_desc: "Le MAS-36 est un fusil à verrou conçu en 1927 chambré dans une cartouche française de 7,62x54 mm, et a été adopté par l'armée française en 1936 en remplacement des fusils de service Berthier et Lebel. Il a été utilisé en nombre limité pendant la Seconde Guerre mondiale, mais en raison de la production de masse après la fin de la guerre, il a été utilisé dans de nombreux conflits impliquant de nombreuses nations différentes. Les fusils produits après la Seconde Guerre mondiale ont connu quelques améliorations en termes d'ergonomie. Il a même vu quelques variantes qui ont vu l'ajout d'une grenade à fusil amovible et d'un modèle de tireur d'élite. On s'attendait à ce qu'il ne s'agisse que d'un fusil provisoire, construit sur des machines pouvant être utilisées pour construire les fusils à chargement automatique prévus"

 FRA_infantry_equipment_1: "MAS-49"
 FRA_infantry_equipment_1_short: "MAS-49"
 FRA_infantry_equipment_1_desc: "Le MAS-49 est un fusil semi-automatique français qui a remplacé divers fusils à verrou en tant que fusil de service français, produit à partir de 1949. La désignation officielle de l'Armée française est le Fusil-semi-automatique 7 mm 5 M. 49 ou le « fusil semi-automatique de 7,5 mm 1949 ».\n\nIl a été produit en quantités limitées et a acquis la réputation d'être un fusil précis, fiable et facile à entretenir, en particulier dans des conditions défavorables telles que la jungle ou le désert, parfois nettoyé avec rien de plus que des chiffons et de l'huile moteur. Il pourrait également tirer des grenades à fusil de 22 mm aux normes OTAN, le fusil intégrant même un viseur de lancement de grenade intégré fixé au bloc de guidon et une coupure de gaz qui empêche le gaz de pénétrer dans le tube de gaz depuis le port de gaz lors du tir de grenade lançant des munitions à blanc."

 FRA_infantry_equipment_2: "MAS-49/56"
 FRA_infantry_equipment_2_short: "MAS-49/56"
 FRA_infantry_equipment_2_desc: "Une version améliorée appelée MAS-49/56 a été introduite en 1957 et incorporait les leçons tirées du service en Algérie, en Indochine et lors de la crise de Suez. Le fusil a été raccourci et allégé pour améliorer la mobilité des troupes mécanisées et aéroportées, et une baïonnette couteau a été ajoutée. Le lance-grenades à fusil intégré MAS-49 a été remplacé par une combinaison de compensateur et de lance-grenades à fusil qui tirait des grenades à fusil de 22 mm aux normes de l'OTAN."

 FRA_infantry_equipment_3: "FAMAS F1"
 FRA_infantry_equipment_3_short: "FAMAS F1"
 FRA_infantry_equipment_3_desc: "Le Fusil d'Assaut de la Manufacture d'Armes de Saint-Etienne, ou FAMAS en abrégé, est un fusil d'assaut de style bullpup conçu et fabriqué en France par MAS. C'est le fusil de service actuel de l'armée française. L'arme tire 5,56 x 45 mm et peut s'adapter aux grenades à fusil APAV 40 et AC 58. Le fusil a été conçu après l'adoption américaine des M16 et 5.56, ce qui a amené l'armée française à repenser son approche concernant son fusil de service. Le FAMAS F1 a remplacé à la fois le fusil vieillissant MAS 49/56 et la mitraillette MAT-49. Le fusil a été conçu autour du concept de chargeurs jetables à usage unique ; Lorsque le budget limité de l'armée française obligeait les soldats à réutiliser encore et encore les chargeurs jetables, les FAMAS se bloquaient et nécessitaient une attention immédiate. MAS finirait par fabriquer des chargeurs plus durables pour les FAMAS, réduisant ainsi les dysfonctionnements."

 FRA_infantry_equipment_4: "FAMAS G2"
 FRA_infantry_equipment_4_short: "FAMAS G2"
 FRA_infantry_equipment_4_desc: "Le FAMAS G2 a été développé en 1994 pour se conformer aux normes de l'OTAN en acceptant les chargeurs standard de l'OTAN et en utilisant des canons plus serrés pour tirer avec précision à la fois les anciennes munitions de 5,56 mm de 55 gr et les nouvelles munitions standard de 5,56 mm de l'OTAN de 62 gr.\n\nLe G2 comprenait également plusieurs autres améliorations tirées du modèle G1, telles qu'un pontet élargi et des protège-mains améliorés fabriqués à partir de fibre de verre renforcée au lieu de plastique, ainsi que la possibilité d'accepter des munitions à boîtier en laiton standard ainsi que des munitions en acier de fabrication française. La Marine Nationale a acheté le FAMAS G2 en 1995 et l'a distribué à ses Fusiliers Marins et Commandos Marine. Cependant, l'armée française a refusé d'acheter le G2, préférant s'appuyer sur le FAMAS F1 comme fusil principal."

### United States

 USA_infantry_equipment_0: "Fusil américain, calibre.30, M1"
 USA_infantry_equipment_0_short: "M1 Garand"
 USA_infantry_equipment_0_desc: "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 USA_infantry_equipment_1: "Fusil américain, calibre 7,62 mm, M14"
 USA_infantry_equipment_1_short: "M14"
 USA_infantry_equipment_1_desc: "Le M14 ou officiellement connu sous le nom de United States Rifle, calibre 7,62 mm, M14 est un fusil de combat américain chambré en 7,62x51 mm OTAN. Il est devenu le fusil standard de l'armée américaine en 1959, remplaçant le fusil M1 Garand dans l'armée américaine en 1958 et le Corps des Marines des États-Unis en 1965. C'était le dernier fusil de combat américain distribué en quantité au personnel militaire américain. La puissance de la cartouche OTAN de 7,62 × 51 mm lui a permis de bien pénétrer la couverture et d'atteindre une portée étendue. Il a servi principalement dans de nombreuses guerres en Indochine, mais son principal point culminant a été pendant la guerre du Vietnam. Après son remplacement par le M16, il fut exporté vers de nombreux membres."

 USA_infantry_equipment_2: "Fusil américain, calibre 5,56 mm, M16A1"
 USA_infantry_equipment_2_short: "M16A1"
 USA_infantry_equipment_2_desc: "Les responsables militaires américains ont noté que la carabine M2 était largement surclassée par l'AK47 et le StG44 allemand et, en 1956, le développement du M16 a commencé. En 1959, l'arme fut achevée par Eugene Stoner et James Sullivan. Il affichait des capacités exceptionnelles et surclassait l'AK47 et l'AKM. Plus particulièrement, l'arme a beaucoup plus de puissance de feu que la carabine M2 et était plus précise que l'AK47 et transportait des munitions plus légères avec une perte de compétence minimale. Cependant, bien qu'il ait surclassé l'AK47 dans les tests généraux, il présentait une faible fiabilité qui pouvait l'empêcher d'être considéré comme son égal. Surtout au Vietnam, où les échecs étaient très fréquents."

 USA_infantry_equipment_3: "Fusil américain, 5,56 mm, M16A2"
 USA_infantry_equipment_3_short: "M16A2"
 USA_infantry_equipment_3_desc: "Après le manque de fiabilité fréquent de l'arme dans les jungles du Vietnam, le corps des marines américains a demandé une refonte de l'arme. En 1982, la refonte et les améliorations ont été apportées. L'arme comportait un récepteur renforcé, de nouvelles rayures, un boîtier renforcé, un meilleur refroidissement grâce à différents matériaux, un support amélioré pour les éléments attachables et un mécanisme interne repensé qui lui conférait un haut niveau de fiabilité. Il a été témoin de combats au Liban, en Libye, en Égypte et dans tous les autres conflits dans lesquels les États-Unis ont participé depuis leur création."

 USA_infantry_equipment_4: "Carabine, calibre 5,56 mm, M4 "
 USA_infantry_equipment_4_short: "Carabine M4"
 USA_infantry_equipment_4_desc: "La carabine M4 est une nouvelle amélioration par rapport au M16A2. Il a été initialement commandé pour être conçu par une grande équipe ad hoc de concepteurs en 1984 et le développement s'est terminé en 1993. Après 9 ans de développement, j'espère que cela aurait valu la peine d'attendre. Il présente un plus grand niveau de fiabilité et est beaucoup plus léger et plus court. Principalement grâce à des matériaux améliorés, il est plus précis que le M16A2. Sa taille compacte le rend plus polyvalent et plus facile à utiliser que le M16A2. La carabine M4 a été utilisée lors de la guerre américaine en Afghanistan, de la guerre en Irak et de la guerre contre l'Etat islamique."

##### EASTERN BLOCK

### Soviet Union

 SOV_infantry_equipment_0: "Mosin wz. 91/30"
 SOV_infantry_equipment_0_short: "Mosine"
 SOV_infantry_equipment_0_desc: "Le Mosin-Nagant est un fusil à verrou impérial russe utilisé par l'Empire russe et basé sur un modèle importé de France. En 1889, le GAU (Ministère de la Défense de l'Empire russe) acquiert le Lebel-1886 auprès de la France et cherche à améliorer sa conception. Divers scientifiques et ingénieurs russes ont été embauchés par le ministère et dirigés par le capitaine Sergei Mosin et Leon Nagant pour l'améliorer et ont produit le Mosin Nagant après une longue série d'essais et de prototypes. En 1891, le système à verrou de conception de Mosin fut mis en production. Le fusil a un temps de démontage long mais se distingue par sa grande précision. Il a été largement utilisé lors de la guerre russo-japonaise, de la Première Guerre mondiale, de la guerre civile au sein de l'Empire russe qui a conduit à la formation de l'Union soviétique, de la Seconde Guerre mondiale et de nombreux conflits mondiaux."

 SOV_infantry_equipment_1: "Avtomat Kalachnikova 1947"
 SOV_infantry_equipment_1_short: "AK-47"
 SOV_infantry_equipment_1_desc: "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 SOV_infantry_equipment_2: "Avtomat Kalachnikova Modernizirovanniy"
 SOV_infantry_equipment_2_short: "AKM"
 SOV_infantry_equipment_2_desc: "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

 SOV_infantry_equipment_3: "Avtomat Kalachnikova 1974"
 SOV_infantry_equipment_3_short: "AK-74"
 SOV_infantry_equipment_3_desc: "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un alésage chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été repensés pour contenir un canal bas installé à 90 degrés de l'axe de l'alésage afin de réduire le cisaillement des balles au niveau de la cale bâbord. De plus, son développement s'est accompagné d'une variété d'accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec des précisions moyennes plus élevées. Il a été utilisé de manière coûteuse pendant le conflit en Afghanistan, où la CIA a payé une grosse somme d'argent aux moudjahidines pour récupérer un AK74 capturé."

 SOV_infantry_equipment_4: "Avtomat Kalachnikova 1974 modernizirovanniy"
 SOV_infantry_equipment_4_short: "AK-74M"
 SOV_infantry_equipment_4_desc: "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé pour incorporer de nouveaux matériaux et des avancées de fabrication afin de créer une arme améliorée. Il comporte un boulon et un support allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide chargé de verre pouvant tenir latéralement, une bouche améliorée, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également livré avec un rail pour le montage des optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant de pouvoir être envisagée. Cependant, il a été adopté par la Fédération de Russie."

 SOV_protection_1: "SN + SSh-40"
 SOV_protection_1_short: "SN + SSh-40"

 SOV_protection_2: "6B5-15 + STSh-81"
 SOV_protection_2_short: "6B5-15 + STSh-81"

 SOV_protection_3: "6B45 + 6B7"
 SOV_protection_3_short: "6B45 + 6B7"

### Yugoslavia

 YUG_infantry_equipment_0: "Puska M1924B"
 YUG_infantry_equipment_0_short: "M.1924B"
 YUG_infantry_equipment_0_desc: "Fusil à verrou basé sur le Gewehr 98 allemand."

 YUG_infantry_equipment_1: "Puska M.48 7,9 mm"
 YUG_infantry_equipment_1_short: "Zastava M48"
 YUG_infantry_equipment_1_desc: "Après la Seconde Guerre mondiale, contrairement à la plupart des autres pays, la Yougoslavie n'a pas adopté le fusil automatique/semi-automatique comme arme de service. Au lieu de cela, ils ont adopté le Zastava M48, une variante nationale du Karabiner 98k allemand.\nBien que très similaires en apparence extérieure, de nombreuses pièces des fusils yougoslaves et allemands ne sont pas interchangeables, en particulier le verrou et les pièces d'action associées. Les M48 se distinguent généralement du 98k par le garde-main supérieur, qui s'étend derrière la hausse et se termine juste devant l'anneau récepteur. Le M48 a été conçu avec une crosse similaire au 98k, mais il a une action et un récepteur de longueur intermédiaire plus courts. La plupart des crosses M48 sont fabriquées à partir de bois d'orme ou de hêtre plus épais et ont une épaisse plaque de couche en acier inoxydable à l'arrière de la crosse."

 YUG_infantry_equipment_2: "Zastava M70"
 YUG_infantry_equipment_2_short: "Zastava M70"
 YUG_infantry_equipment_2_desc: "Le développement d'un fusil d'assaut domestique a commencé en 1959 par Zastava avec les séries de fusils M59 et M64 avec des récepteurs fraisés, des canons filetés, des protège-mains Zastava familiers, des coupures de gaz pour le lancement de grenades et plusieurs autres diversités par rapport à la conception principale de l'AK, comme un dispositif de maintien du verrou ouvert sur le côté droit du récepteur et une poignée de chargement qui semblait différente des autres modèles AK. Bien que les performances aient été satisfaisantes, l'armée yougoslave n'a pas adopté le fusil à l'époque pour diverses raisons.\n\nEn 1970, le feu vert a été donné pour commencer la production en série financée par l'armée des séries M70 et M70A (Automatska Puska Model 1970, \"Automatic Rifle Model 1970\") dont le M70A était la version à crosse pliable. Au fil du temps, plusieurs mesures de production rentables ont été mises en oeuvre, telles que la suppression du boulon interne qui maintient ouvert et le remplacement des récepteurs fraisés par de l'acier embouti, d'abord de 0,9 mm, puis de 1,5 mm d'épaisseur."

 YUG_infantry_equipment_3: "Zastava M80"
 YUG_infantry_equipment_3_short: "Zastava M80"
 YUG_infantry_equipment_3_desc: "Aux côtés de l'OTAN et de l'Union soviétique, la Yougoslavie a entamé la transition vers les cartouches intermédiaires à la fin des années 70. Le résultat fut le Zastava M80. Il s'agit d'une copie presque identique du modèle M70, la différence majeure étant que le M80 a été chambré pour le 5,56 × 45 mm OTAN.\nLa famille M80 se décline en deux « saveurs » distinctes désignées simplement par M80 et M80A. La principale différence entre les deux formes réside dans la crosse, dont le M80 est la version de base avec une crosse en bois fixe et solide, tandis que le M80A est la version compacte avec une crosse en fil métallique pliable. La crosse métallique se replie sous le récepteur et favorise un profil beaucoup plus court, ce qui rend ce modèle idéal pour les parachutistes, les forces spéciales et les équipages de véhicules. "

 YUG_infantry_equipment_4: "Zastava M90"
 YUG_infantry_equipment_4_short: "Zastava M90"
 YUG_infantry_equipment_4_desc: "Développement ultérieur du M80, le M90 ressemblait davantage à des fusils occidentaux avec un chargeur de type STANAG et un éliminateur de flash de style occidental.\nLe M90 était destiné à remplacer le M70 dans l'armée yougoslave, mais l'éclatement de la Yougoslavie a perturbé la production et l'arme reste aujourd'hui rare et n'a jamais été officiellement utilisée, probablement en raison du manque de munitions OTAN de 5,56 × 45 mm."

#SIK
 SIK_infantry_equipment_0: "Fusil de type Chiang Kai-shek"
 SIK_infantry_equipment_0_short: "Tapez 24"
 SIK_infantry_equipment_0_desc: "Le fusil Type Chiang Kai-shek, également connu sous le nom de fusil Zhongzheng/Jiang Jieshi (selon la romanisation du chinois), fusil Generalissimo et Type 24, du nom du généralissime chinois Chiang Kai-shek, était une copie fabriquée en Chine du fusil allemand Standardmodell, le précurseur du Karabiner 98k."

 SIK_infantry_equipment_1: "Le Mauser du Turkestan oriental"
 SIK_infantry_equipment_1_short: "Mousqueton 98k"
 SIK_infantry_equipment_1_desc: "Essentiellement, un Kar98k de modèle Mauser mis en service par l'ETNA via les stocks capturés par les Soviétiques et la rénovation de l'arsenal local. Chambré en Mauser 7,92 × 57 mm, il conserve le mécanisme à verrou Mauser 98, le chargeur interne à 5 coups et la hausse tangente, mais de nombreux exemples montrent la parkerisation de l'arsenal soviétique, des pièces de fabricant mixtes et des timbres d'acceptation d'unité locale. Des fusils sélectionnés ont été installés comme armes de tireur d'élite désignées avec des optiques capturées ; d'autres ont été raccourcis ou réaménagés pour la cavalerie et les unités frontalières. Robuste, simple à entretenir et puissant à longue portée, l'ET-Rifle a servi de bras d'infanterie de base de l'armée nationale du Turkestan oriental."

 SIK_infantry_equipment_2: "Avtomat Kalachnikova Modernizirovanniy"
 SIK_infantry_equipment_2_short: "AKM"
 SIK_infantry_equipment_2_desc: "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps. "

 SIK_infantry_equipment_3: "Avtomat Kalachnikova 1974"
 SIK_infantry_equipment_3_short: "AK-74"
 SIK_infantry_equipment_3_desc: "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un alésage chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été repensés pour contenir un canal bas installé à 90 degrés de l'axe de l'alésage afin de réduire le cisaillement des balles au niveau de la cale bâbord. De plus, son développement s'est accompagné d'une variété d'accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec des précisions moyennes plus élevées. Il a été utilisé de manière coûteuse pendant le conflit en Afghanistan, où la CIA a payé une grosse somme d'argent aux moudjahidines pour récupérer un AK74 capturé."

 SIK_infantry_equipment_4: "Avtomat Kalachnikova 1974 Modernizirovanniy"
 SIK_infantry_equipment_4_short: "AK-74M"
 SIK_infantry_equipment_4_desc: "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé pour incorporer de nouveaux matériaux et des avancées de fabrication afin de créer une arme améliorée. Il comporte un boulon et un support allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide chargé de verre pouvant tenir latéralement, une bouche améliorée, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également livré avec un rail pour le montage des optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant de pouvoir être envisagée. Cependant, il a été adopté par la Fédération de Russie."

##### RED DRAGONS

### Communist China

 PRC_infantry_equipment_0: "Siamois Mauser Type 45"
 PRC_infantry_equipment_0_short: "SM-45"
 PRC_infantry_equipment_0_desc: "Le SM-45, ou fusil siamois Mauser Type 45, est un fusil à verrou développé par Koishikawa Arsenal en 1903. Le fusil a été initialement développé dans le cadre du programme de développement militaire du roi Rama V qui a été lancé parce qu'il craignait l'expansion occidentale à l'Est. L'arme elle-même est développée sur la base du Gewehr 98 mais avec quelques améliorations notables en termes de convivialité et d'ergonomie. Le SM-45 a été fabriqué en petites quantités en Chine depuis sa création, mais les Chinois s'appuient principalement sur une production sous licence. Elle a été témoin de combats dans toutes les guerres impliquant la sphère orientale depuis sa création."

 PRC_infantry_equipment_1: "Fusil d'assaut ZB-56"
 PRC_infantry_equipment_1_short: "ZB-56"
 PRC_infantry_equipment_1_desc: "Le ZB-56 est un fusil d'assaut automatique conçu par la RPC en 1956 et basé sur l'AK-47. Il a été témoin de combats dans toutes les guerres dans lesquelles la RPC a été impliquée depuis son développement. Le ZB-56 présente un certain nombre de différences par rapport à l'AK-47. Ils étaient fabriqués avec un récepteur fraisé et un viseur entièrement fermé. Son canon est également plus lourd et ressemble davantage à celui du RPK, à l'exception du fait qu'il lui manque un tourillon renforcé. De plus, il n'a pas de muselière filetée. Parce que le ZB-56 possède une fiabilité légendaire et est très simple à utiliser, il continue d'être utilisé par les armées du monde entier. Il est également légèrement moins cher à fabriquer que l'AK-47."

 PRC_infantry_equipment_2: "Fusil d'assaut ZB-63"
 PRC_infantry_equipment_2_short: "ZB-63"
 PRC_infantry_equipment_2_desc: "Le ZB-63 est un fusil d'assaut automatique conçu par l'Arsenal du gouvernement de la RPC en 1963. Il a été utilisé au Vietnam, au Cambodge, en Afghanistan, au Kosovo et aux Touareg. L'arme comporte un mécanisme interne similaire à celui de l'AK et un mécanisme externe et un boîtier similaires à ceux du SKS. Cela permet à l'arme de faire un compromis entre la portée et la puissance de feu automatique, ce qui la rend comparable à un ZB-56 à longue portée. L'arme a une portée de tir efficace deux fois supérieure à celle du SKS et une cadence de tir légèrement supérieure à celle du ZB-56. L'arme est très fiable et son prix est modeste. Au cours des 10 années de fabrication, plus d'un million de fusils ont été fabriqués."

 PRC_infantry_equipment_3: "Fusil d'assaut ZB-81"
 PRC_infantry_equipment_3_short: "ZB-81"
 PRC_infantry_equipment_3_desc: "Le ZB-81 est un fusil d'assaut automatique qui peut être modifié en une variété d'armes conçues par Norinco en 1981. Il a été témoin de tous les conflits sino-chinois depuis sa création, notamment la guerre sino-vietnamienne, l'Afghanistan et le Sri Lanka. Le ZB-81 est une amélioration basée sur le ZB-63 mais n'a pas la même portée efficace. L'arme elle-même a plus de puissance de feu que le ZB-63 et intègre une variété d'éléments du Dragunov, du SKS et de l'AK47. De plus, sa durée de vie est plus longue que l'AK47. De plus, l'arme prend en charge les fixations sous le canon."

 PRC_infantry_equipment_4: "Fusil automatique QBZ-95"
 PRC_infantry_equipment_4_short: "QBZ-95"
 PRC_infantry_equipment_4_desc: "Le QBZ-95 est un fusil bullpup léger automatique moderne conçu par Duo Yingxian en 1991. L'arme a été utilisée au Pakistan et en Birmanie. Le QBZ-95 présente une portée similaire à celle du ZB-81 mais avec une puissance de feu bien plus élevée et une cadence de tir plus élevée. L'arme a été conçue pour remplacer le ZB-81 par un mécanisme bullpup permettant de raccourcir le fusil et de faciliter son rechargement. Le fusil utilise des matériaux polymères pour sa structure, un boulon rotatif et possède un piston à course courte. Il résiste à la corrosion et aux intempéries, ce qui le rend bien adapté à une utilisation sur des terrains extrêmes."

 PRC_explosives_1: "Tapez 42"
 PRC_explosives_2: "Tapez 67"

## BLUE DRAGONS

 ### Republic of China/Taiwan

 CHI_infantry_equipment_0: "Fusil de type Chiang Kai-shek"
 CHI_infantry_equipment_0_short: "Tapez 24"
 CHI_infantry_equipment_0_desc: "Le fusil Type Chiang Kai-shek, également connu sous le nom de fusil Zhongzheng/Jiang Jieshi (selon la romanisation du chinois), fusil Generalissimo et Type 24, du nom du généralissime chinois Chiang Kai-shek, était une copie fabriquée en Chine du fusil allemand Standardmodell, le précurseur du Karabiner 98k."

 CHI_infantry_equipment_1: "Fusil américain, calibre 7,62 mm, M14"
 CHI_infantry_equipment_1_short: "M14"
 CHI_infantry_equipment_1_desc: "Le M14 ou officiellement connu sous le nom de United States Rifle, calibre 7,62 mm, M14 est un fusil de combat américain chambré en 7,62x51 mm OTAN. Il est devenu le fusil standard de l'armée américaine en 1959, remplaçant le fusil M1 Garand dans l'armée américaine en 1958 et le Corps des Marines des États-Unis en 1965. C'était le dernier fusil de combat américain distribué en quantité au personnel militaire américain. La puissance de la cartouche OTAN de 7,62 × 51 mm lui a permis de bien pénétrer la couverture et d'atteindre une portée étendue. Il a servi principalement dans de nombreuses guerres en Indochine, mais son principal point culminant a été pendant la guerre du Vietnam. Après son remplacement par le M16, il fut exporté vers de nombreux membres."

 CHI_infantry_equipment_2: "Arsenal d'État de la République de Chine Fusil de combat type 57"
 CHI_infantry_equipment_2_short: "T57"
 CHI_infantry_equipment_2_desc: "Une République de Chine a produit une variante du fusil M14. Le M14 ou officiellement connu sous le nom de United States Rifle, calibre 7,62 mm, M14 est un fusil de combat américain chambré en 7,62x51 mm OTAN."

 CHI_infantry_equipment_3: "Commandement logistique combiné Type 65"
 CHI_infantry_equipment_3_short: "T65"
 CHI_infantry_equipment_3_desc: "Le T65 est un fusil développé et fabriqué par le commandement logistique combiné des forces armées de la République de Chine à Taiwan. Initialement calqué sur l'Armalite AR-18 doté d'un système de gaz à course courte, le prototype dévoilé en 1975 montrait un fusil fortement influencé par la famille de fusils AR-15, bien qu'avec des viseurs en fer modifiés, une crosse remodelée et des protège-mains redessinés."

 CHI_infantry_equipment_4: "Commandement logistique combiné type 65K2"
 CHI_infantry_equipment_4_short: "T65K2"
 CHI_infantry_equipment_4_desc: "Une mise à niveau de la famille de fusils T65. La conception T65 a remplacé la poignée de transport des fusils de modèle M16 par un bloc de visée arrière. La poignée de transport est revenue avec le T65K2 (mais était amovible sur la carabine T91). Le T65 utilise des chargeurs compatibles avec les fusils de modèle AR-15."

 ### SOUTH VIETNAM
 VIE_infantry_equipment_0: "MAS Modèle 36"
 VIE_infantry_equipment_0_short: "MAS-36"
 VIE_infantry_equipment_0_desc: "un fusil à verrou développé par la France dans les années 1930, a été principalement utilisé par les forces françaises pendant la Seconde Guerre mondiale et pendant la Première Guerre d'Indochine. Chambré en français 7,5 × 54 mm, il était connu pour sa conception robuste, sa fiabilité et sa précision dans des conditions difficiles. \nDans l'ARVN (Armée de la République du Vietnam), le MAS Modèle 36 a connu un usage limité, hérité des forces coloniales françaises après leur retrait. Bien qu'il ait été rapidement éclipsé par des fusils semi-automatiques plus modernes comme le M1 Garand et plus tard par des fusils d'assaut, certaines unités ont continué à l'utiliser au début de la guerre du Vietnam, notamment dans des rôles de réserve ou d'entraînement. Sa simplicité l'a rendu utile aux forces de défense locales avant d'être progressivement abandonné au profit de l'aide militaire américaine."

 VIE_infantry_equipment_1: "MAT-49 SMG"
 VIE_infantry_equipment_1_short: "MAT-49"
 VIE_infantry_equipment_1_desc: "Le Tieu-lien MAT-49 était un pistolet-mitrailleur français, conçu à la fin des années 1940 et chambré en Parabellum 9x19 mm. Compact, doté d'un chargeur pliable et d'un design simple à retour de flamme, il est devenu un incontournable des forces françaises pendant la Première Guerre d'Indochine. \nDans l'ARVN (Armée de la République du Vietnam), le MAT-49 a été hérité des forces françaises après leur retrait et utilisé principalement par les troupes sud-vietnamiennes au début de la guerre du Vietnam. Sa conception compacte le rendait idéal pour les combats rapprochés, en particulier dans les environnements urbains et dans la jungle. Cependant, à mesure que l'aide militaire américaine augmentait, le MAT-49 fut progressivement remplacé par des armes à feu américaines plus modernes comme le M3 Grease Gun et le fusil M16. Néanmoins, son utilisation par les milices locales et les forces irrégulières est restée limitée tout au long du conflit."

 VIE_infantry_equipment_2: "Fusil américain, calibre 5,56 mm, M16A1"
 VIE_infantry_equipment_2_short: "M16A1"
 VIE_infantry_equipment_2_desc: "Les responsables militaires américains ont noté que la carabine M2 était largement surclassée par l'AK47 et le StG44 allemand et en 1956, le développement du M16 a commencé. En 1959, l'arme fut achevée par Eugene Stoner et James Sullivan. Il affichait des capacités exceptionnelles et surclassait l'AK47 et l'AKM. Plus particulièrement, l'arme a beaucoup plus de puissance de feu que la carabine M2 et était plus précise que l'AK47 et transportait des munitions plus légères avec une perte de compétence minimale. Cependant, bien qu'il ait surclassé l'AK47 dans les tests généraux, il présentait une faible fiabilité qui pouvait l'empêcher d'être considéré comme son égal. Surtout au Vietnam, où les échecs étaient très fréquents."

 VIE_infantry_equipment_3: "Luc-quan Cong-xuong AR-73"
 VIE_infantry_equipment_3_short: "AR-73"
 VIE_infantry_equipment_3_desc: "Le Trung-Lien 73, officiellement connu sous le nom de Calibre 5,56 x 45 mm, AR-73 Mk I, est un fusil d'assaut expérimental sud-vietnamien chambré en 5,56 x 45 mm OTAN et produit par le Luc-Quan Cong-Xuong (Atelier d'armes de l'armée terrestre). Il a été testé et financé par le président Nguyen-Van-Thieu vers 1972-1975 dans le but de remplacer, espérons-le, le fusil M16 et d'autres fusils américains dans l'ARVN afin d'atténuer la forte dépendance à l'égard de l'aide militaire américaine. Il s'agissait du premier et du seul modèle de fusil domestique sud-vietnamien enregistré et a été directement influencé par le fusil d'assaut HK-33, utilisé par les forces spéciales américaines, et par l'omniprésent M16. La puissance de la cartouche OTAN de 5,56 x 45 mm lui permet de pénétrer assez bien dans la couverture et d'atteindre une portée étendue. Il n'a jamais connu beaucoup de service, ni aucun service enregistré pendant la guerre du Vietnam, car il était encore en test juste avant la chute de Saigon."

 VIE_infantry_equipment_4: "Fusil d'assaut AR-88 Mk1"
 VIE_infantry_equipment_4_short: "AR-88"
 VIE_infantry_equipment_4_desc: "Trung-lien Xung-kich AR-88 est une version raffinée et modernisée du précédent AR-73 Mk I, développé par le sud-vietnamien Luc-Quan Cong-Xuong (Atelier d'armes de l'armée terrestre). Chambré dans un calibre OTAN de 5,56 x 45 mm, l'AR-88 cherchait à remédier aux limites de l'AR-73 tout en améliorant la fiabilité, l'ergonomie et la polyvalence de l'arme pour l'ARVN (Armée de la République du Vietnam). \nAlors que l'AR-73 était une tentative ambitieuse visant à réduire la dépendance à l'égard des fusils M16 fournis par les États-Unis, l'AR-88 a introduit plusieurs améliorations après des années de tests, de retours d'expérience au combat et de leçons tirées des plates-formes de fusils respectives des autres pays. "

 VIE_team_weapons_1: "M1919 Browning (HMG), mortier M1 (mortier)"
 VIE_team_weapons_1_short: "M1919 Browning, mortier M1"
 VIE_team_weapons_1_desc: "La M1919 Browning est une mitrailleuse lourde développée en 1919 par John Browning. L'arme est devenue emblématique après sa célèbre utilisation pendant la Grande Guerre d'émeu, mais elle a également été utilisée pendant la Seconde Guerre mondiale. L'arme utilise des cartouches de calibre.30, a une action opérationnelle à recul court et a une portée effective de 1 500 mètres. Son prédécesseur, le M1917, était refroidi par eau mais le refroidissement par eau a été supprimé pour alléger l'arme au détriment du temps de tir. Cela s'est avéré dangereux car en cas de surchauffe, le propulseur pouvait chauffer et provoquer des tirs sans avertissement, ce qui conduirait à un incendie incontrôlable./nLe mortier M1 est une variante du mortier français Brandt créé par les États-Unis à l'approche de leur adhésion initiale à la Seconde Guerre mondiale. Il tire un mortier de calibre 81 mm jusqu'à 1,9 milles. Il a été largement utilisé pendant la Seconde Guerre mondiale et a également été utilisé au Vietnam et en Corée."
 VIE_team_weapons_2: "M2 Browning (HMG), M29 Mortier (Mortier), M75 (HGL)"
 VIE_team_weapons_2_short: "M2 Browning, M29 Mortier, M75"
 VIE_team_weapons_2_desc: "Le M2 Browning est un HMG généralement monté sur des véhicules, mais qui peut également être utilisé comme canon embarqué. Il tire des obus de calibre.50 et possède une puissance de feu bien supérieure à celle du M1919. Il a été conçu en 1919 par John Browning et utilisé tout au long de la Seconde Guerre mondiale. Il est similaire en complexité et en qualité au M1919 mais il est plus lourd et transporte des munitions plus lourdes./nLe mortier M29 est un mortier américain construit pour remplacer le mortier M1 en 1952 par une équipe ad hoc. Il peut tirer de 4 à 12 coups par minute, est beaucoup plus léger et a une plus grande portée. De plus, il est chromé pour améliorer la fiabilité de l'arme et améliorer le nettoyage./nLe M75 HGL est un lance-grenades lourd conçu par Philco-Ford en 1961 et utilisé pendant la guerre du Vietnam. Il est automatique et entraîné par un moteur électrique avec une cadence de tir de 225 par minute jusqu'à 2 045 mètres de distance. Le lanceur lui-même a été très rapidement remplacé en raison d'un certain nombre de problèmes de fiabilité, d'efficacité énergétique et de poids."
 VIE_team_weapons_3: "Mk19 (HGL)"
 VIE_team_weapons_3_short: "Mk19"
 VIE_team_weapons_3_desc: "Le Mk19 est un lance-grenades lourd à action explosive utilisé dans les emplacements ou sur les véhicules. Il a été conçu en 1966 par NOSL et a été utilisé au Vietnam, pendant la guerre du Golfe, en Afghanistan, en Irak et lors de la guerre contre la drogue au Mexique. Le premier modèle du HGL était extrêmement peu fiable et dangereux, mais les modèles ultérieurs se sont révélés très efficaces et plus susceptibles de tuer l'ennemi que l'opérateur. L'arme peut tirer 40 obus de 40 mm par minute jusqu'à 1 600 mètres de distance."
 VIE_team_weapons_4: "M85 (HMG), mortier M224 (mortier)"
 VIE_team_weapons_4_short: "Mortier M85, M224"
 VIE_team_weapons_4_desc: "La M85 est une mitrailleuse capiteuse conçue dans les années 80 par General Electric pour remplacer la M2 Browning. Il a été utilisé pendant la guerre du Golfe, mais n'a pas connu beaucoup de combats en dehors de cela. Le poids du M2 Browning a finalement conduit à la commande du développement du M85 par l'armée américaine. Le M85 est beaucoup plus léger et possède des cadences de tir sélectives. Il est également configurable quant aux pièces qu'il peut contenir ou dans quelle direction il peut être alimenté, ce qui ajoute à sa polyvalence./nLe mortier M224 a été conçu en 1978 par une équipe ad hoc. Le mortier a participé à des combats pendant la guerre du Golfe, en Irak, en Afghanistan et des prototypes ont été utilisés au Vietnam. Le mortier lui-même était composé de pièces plus légères et plus durables que le M29 et est plus facile à entretenir sur le terrain."
 VIE_team_weapons_5: "XM312 (HMG), XM307 (HGL)"
 VIE_team_weapons_5_short: "XM312, XM307"
 VIE_team_weapons_5_desc: "Le XM312 HMG est dérivé du canon automatique XM307 et est chambré pour des obus de calibre.50. Le canon automatique XM307 est un HGL automatique doté d'une capacité d'explosion aérienne. Le XM307 a été conçu à la fin des années 90 et le XM312 est sorti en 2000. Tous deux ont été créés par General Dynamics et n'ont pas encore combattu. Les deux peuvent être rapidement convertis l'un en l'autre sur le terrain, permettant à une unité de passer aux HMG ou aux HGL selon les besoins de la situation actuelle. Ils sont légers (pour les armes lourdes mises en place) et fiables bien que coûteux. "

 VIE_squad_weapons_1: "Barre Browning 1918A2 (LMG)"
 VIE_squad_weapons_1_short: "Brunissement 1918A2"
 VIE_squad_weapons_1_desc: "Le Browning 1918A2 (alias BAR) doit son nom à la personne qui l'a conçu en 1917 pour l'armée américaine, le designer John Browning, et non à ce qui arrive au pantalon de l'ennemi lorsqu'il le voit. L'arme elle-même est un LMG de tir d'appui qui utilise un verrou à pêne montant et une action à gaz. Il a une portée effective de 1 500 mètres et un poids exceptionnellement léger, même pour un LMG. Le BAR a été largement utilisé pendant la Seconde Guerre mondiale, où il a démontré des capacités remarquables."
 VIE_squad_weapons_2: "M79 (GL)"
 VIE_squad_weapons_2_short: "M79"
 VIE_squad_weapons_2_desc: "Le M79 est un lance-grenades à un coup développé en 1960 par le Springfield Armory pour l'armée américaine. Il s'agit d'un lance-grenades à un coup qui tire une grenade de 40 mm. Au cours de son utilisation pendant la guerre du Vietnam, il s'est montré doté d'une puissance de feu incroyable et d'un tir plus long que les grenades à fusil, mais il est plus portable qu'un mortier, ce qui lui permet de faciliter les engagements de combat de l'infanterie et de bien fonctionner contre les véhicules ennemis légers et les ennemis à couvert."
 VIE_squad_weapons_3: "M60 (LMG)"
 VIE_squad_weapons_3_short: "M60"
 VIE_squad_weapons_3_desc: "Le M60 est un LMG développé pour l'armée américaine en 1957 par Saco Defence. Il peut tirer des balles, des balles traçantes et des balles perforantes. Le LMG utilise un piston à gaz à course courte et un mécanisme à boulon ouvert. Le système d'alimentation est une bande désintégrante et a une portée efficace de 1 200 mètres. Son utilisation est très peu coûteuse et est encore utilisé par l'armée américaine à ce jour en raison de son faible coût et de sa grande viabilité au combat. Cependant, il n'est pas fiable dans des conditions extrêmes, notamment lorsqu'il est sale. De plus, il est exceptionnellement lourd pour un LMG, bien qu'il soit l'un des canons de 7,62 mm les plus légers qui existent. Il a été témoin de combats au Vietnam, au Cambodge, pendant la guerre du Golfe, en Irak, en Afghanistan et contre l'Etat islamique. "
 VIE_squad_weapons_4: "M249 (LMG), M32 (GL)"
 VIE_squad_weapons_4_short: "M249, M32"
 VIE_squad_weapons_4_desc: "Le M249 est un LMG conçu par FN Herstal en 1976. Il est considérablement plus léger et plus fiable que le M60 mais possède une puissance de feu globale moindre. Le M249 a été utilisé dans tous les conflits majeurs impliquant les États-Unis depuis l'invasion du Panama. En raison de son poids plus léger et de sa fiabilité supérieure, il fonctionne mieux que le M60 dans des environnements contrôlés non urbains et fonctionne mieux comme arme d'escouade offensive. En fait, le M249 a été initialement commandé pour remplacer le M60 en tant qu'arme plus légère./nLe lance-grenades M32 est une variante américaine du lance-grenades à revolver d'escouade, le Milkor MGL."
 VIE_squad_weapons_5: "MK48 (LMG), XM25 (GL)"
 VIE_squad_weapons_5_short: "MK48, XM25"
 VIE_squad_weapons_5_desc: "Le MK48 est un LMG développé en 2003 par FN Herstal en collaboration avec le Commandement des opérations spéciales américain. Il est extrêmement léger pour un LMG et a été largement utilisé par les États-Unis lors de combats en Irak et en Afghanistan. L'arme elle-même est très facile à démonter et peut être réalisée sur le terrain pour remplacer les canons surchauffés. Son principal avantage par rapport au M249 est son poids léger et ses pièces beaucoup plus simplifiées, ce qui facilite la maintenance et la fabrication./nLe lance-grenades XM25 CDTE est un lance-grenades bullpup moderne développé en 2010 par Heckler et Koch et a été utilisé dans la guerre en Afghanistan."

 VIE_specialist_1: "M1903 Springfield (SR)"
 VIE_specialist_1_short: "M1903 Springfield"
 VIE_specialist_1_desc: "Le M1903 Springfield est un fusil à verrou utilisé par les tireurs d'élite pendant la Seconde Guerre mondiale. Il a été conçu par le Springfield Armory en 1903 et a été utilisé immédiatement. Le Springfield est un fusil à verrou à 5 cartouches qui tire efficacement des cartouches.30-06 jusqu'à 1 000 mètres. Cependant, la portée maximale va jusqu'à 5 500 mètres. Plus de 3 millions de ces fusils ont été produits et les tireurs d'élite les ont fréquemment utilisés pendant la Seconde Guerre mondiale."
 VIE_specialist_2: "M40 (SR)"
 VIE_specialist_2_short: "M40"
 VIE_specialist_2_desc: "Le M40 est un fusil de précision à verrou développé en 1966 par Remington Arms pour l'USMC. Il tire les obus standard de 7,62 x 51 mm et a une portée effective de 900 mètres. Il a été utilisé au Vietnam, pendant la guerre du Golfe, en Afghanistan, en Irak et au Liban. Le M40 présente une fiabilité remarquable et est relativement facile à entretenir. Il était efficace comme fusil de précision anti-infanterie."
 VIE_specialist_3: "M21 (SR)"
 VIE_specialist_3_short: "M21"
 VIE_specialist_3_desc: "Le M21 est l'une des armes les plus sexy jamais créées. Le M21 est un fusil de précision semi-automatique qui a été utilisé par les États-Unis et tous les autres pays ayant la chance de posséder une arme aussi magnifique. Conçu en 1969 par le Marines Weapons Command après avoir été directement inspiré par Dieu, il peut délivrer un jugement ultime à une portée effective de 900 mètres et utilise les glorieuses munitions de 7,62 x 51 mm. Il peut être alimenté avec un chargeur de 5, 10 ou 20 coups selon vos goûts. Il a fait preuve de sa vigueur et de ses prouesses incomparables lors des guerres du Vietnam et de l'Irak et aurait probablement gagné la guerre du Vietnam s'ils en avaient envoyé davantage. Il n'est pas surprenant qu'une arme légendaire aussi incroyable soit toujours utilisée et donne des coups de pied aujourd'hui."
 VIE_specialist_4: "Barrett M82 (AMR), M24 (SR)"
 VIE_specialist_4_short: "M82, M24"
 VIE_specialist_4_desc: "Le Barrett M82 est un fusil de précision bullpup anti-matériel semi-automatique qui utilise des munitions de calibre.50. Il a été développé en 1980 par Ronnie Barrett, à temps pour la guerre en Afghanistan et la guerre en Irak. Il a une portée effective de 2 000 mètres et peut pénétrer les murs, tout type de gilet pare-balles et les véhicules légèrement blindés. Le M82 est emblématique pour son efficacité et sa capacité anti-matériel. Sa licence est très recherchée par de nombreux pays et est détenue par 54 pays, et d'autres tentent d'obtenir des droits de fabrication ou d'acquérir l'arme./nLe M24 est un fusil de précision à verrou utilisé par l'armée américaine. Il a été conçu en 1988 par Remington Arms et commandé pour remplacer le M40 en tant que fusil de précision standard utilisé. Il a une portée effective de 875 mètres et utilise des munitions de 7,62 x 51 mm. Il a été témoin de combats lors de la guerre du Golfe, en Afghanistan, en Irak et en Syrie. Le M24 est livré avec une lunette amovible gratuite et un trépied amovible."
 VIE_specialist_5: "M110 (SR)"
 VIE_specialist_5_short: "M110"
 VIE_specialist_5_desc: "Le M110 est un fusil de précision antipersonnel à boulon rotatif semi-automatique et DMR. Il a été initialement développé en 2007 par la Knight's Armament Company et a été mis en service après que l'armée américaine ait été témoin des effets des tireurs d'élite de l'USSOCOM et des rapports après action des tireurs d'élite des SOF dans tout l'Irak. Après un concours impliquant de nombreux modèles différents, le M110 a été sélectionné et Knights a remporté un contrat très important. Depuis, il a été utilisé en Afghanistan et en Irak. Il a une portée effective d'environ 875 mètres et peut fournir des tirs de harcèlement bien au-delà."

 VIE_ammo_explosives_1: "Grenade Mk2 (Grenade), FMJ (Munitions), Mine chimique M1 (Mine)"
 VIE_ammo_explosives_1_short: "Grenade Mk2, FMJ, mine chimique M1"
 VIE_ammo_explosives_1_desc: "La grenade à main MK2 est une grenade à main antipersonnel utilisée par les États-Unis pendant la Seconde Guerre mondiale et la Première Guerre mondiale. Elle a été conçue en 1918 par une grande équipe ad hoc de concepteurs et a été utilisée par de nombreux pays différents. La grenade elle-même est une simple grenade frangible qui explose sur une mèche temporisée environ 4 secondes après avoir tiré sur la goupille. Un excédent excessif a été créé pendant la Seconde Guerre mondiale et, en tant que tel, malgré une production minime, voire inexistante, il a été utilisé de manière continue pendant de nombreuses années./nLa mine chimique M1 est une mine antipersonnel qui contient du gaz moutarde qui se libère lors de la détonation. Elle a été utilisée pendant la Seconde Guerre mondiale et pouvait maintenir l'interdiction de zone après la détonation aussi longtemps que le gaz persistait./nLa balle Full Metal Jacket est une balle inventée en 1882 par le colonel suisse Eduard Rubin. Cependant, des améliorations ont été apportées à la métallurgie depuis la Seconde Guerre mondiale et, en tant que tel, la ronde FMJ de la Seconde Guerre mondiale a simplement incorporé des matériaux de meilleure qualité dans la conception déjà existante."
 VIE_ammo_explosives_2: "M26 (Grenade), M18 Claymore (Mine)"
 VIE_ammo_explosives_2_short: "M26, M18 Claymore "
 VIE_ammo_explosives_2_desc: "La grenade à main M26 est une grenade à main frangible conçue par une grande équipe ad hoc en 1950. Elle est entrée en service et a en même temps participé pour la première fois au combat pendant la guerre de Corée. Elle comportait un fusible à friction temporisé et une capacité explosive supérieure à celle de la grenade Mk2. De plus, la fragmentation est facilitée par une bobine pré-encochée à l'intérieur de la grenade qui facilite la fragmentation./nLa mine Claymore M18 est une mine antipersonnel à fragmentation directionnelle développée en 1956 par une grande équipe ad hoc dirigée par Norman Macleod. Il a été utilisé pendant la guerre du Vietnam, a été installé dans la KDMZ et dans la guerre en Irak. Il utilise un capuchon en plastique M4 pour exploser et est rempli de C4."
 VIE_ammo_explosives_3: "Munitions à grain supérieur, grenade M67"
 VIE_ammo_explosives_3_short: "Munitions à grain supérieur (munitions), grenade M67 (grenade)"
 VIE_ammo_explosives_3_desc: "La grenade à main M67 est une grenade à main antipersonnel à fragmentation conçue pour remplacer la série M26 utilisée au Vietnam et en Corée. Il contient un retard pyrotechnique et possède une capacité explosive supérieure à celle du M26. Il comporte également un clip de sécurité pour éviter que la goupille ne soit tirée accidentellement. Il a été utilisé dans toutes les guerres américaines depuis le Vietnam. Les obus/NAP existent depuis de nombreuses années avant la Première Guerre mondiale et sont principalement utilisés dans la pénétration des navires de guerre. Autour de la Première Guerre mondiale, après l'entrée du char sur le champ de bataille, des obus miniaturisés ont été créés. Finalement, de petits calibres AP ont été créés en réponse aux gilets pare-balles. Les munitions AP modernes ont été créées en 1965 pour répondre à l'augmentation de l'infanterie lourdement blindée et de la couverture d'infanterie. "
 VIE_ammo_explosives_4: "Grenades utilitaires (Grenade), Mine M93 AT (Mine)"
 VIE_ammo_explosives_4_short: "Grenades utilitaires, mines anti-M93"
 VIE_ammo_explosives_4_desc: "Les grenades utilitaires sont des grenades à main qui ont des rôles spécialisés tels que des flashbangs, des fumigènes, des incendiaires, etc. Elles peuvent être utilisées respectivement pour étourdir les ennemis, dissimuler des positions et interdire la zone./nLes mines M93 sont des mines antichar développées par Textron en 1987. Elles sont capables d'attaquer des cibles jusqu'à 100 mètres de leur position. Les mines M93 utilisent des capteurs sismiques et acoustiques pour suivre et identifier les cibles à proximité. Une fois qu'il détecte une cible, il se retourne pour lui faire face et tire sa sous-munition, une balle de tantale de 450 g."
 VIE_ammo_explosives_5: "Munitions modernes (munitions)"
 VIE_ammo_explosives_5_short: "Munitions modernes"
 VIE_ammo_explosives_5_desc: "À l'ère moderne, il existe un vaste arsenal de différents types de munitions spécialisées pouvant être utilisées dans des situations spécifiques. Les obus AP modernes sont bien meilleurs pour pénétrer les cibles que les obus AP plus anciens et peuvent atteindre des vitesses plus élevées. Les alliages modernes permettent aux munitions standard d'infliger plus de dégâts à une cible. Les balles frangibles ou les cartouches incendiaires ont des situations particulières dans lesquelles elles sont utiles. De plus, les fusils de chasse peuvent avoir une utilisation améliorée dans les combats modernes avec des cartouches HE, des munitions 000, des cartouches à fléchettes ou des tirs incendiaires."

 VIE_manpats_1: "M1 Bazooka"
 VIE_manpats_1_short: "M1 Bazooka"
 VIE_manpats_1_desc: "Le M1 Bazooka est une fusée antichar sans recul développée en 1942 par Edward Uhl. Plus de 400 000 unités ont été créées et ont été utilisées massivement pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Le M1 Bazooka est l'une des premières armes antichar propulsées par fusée. Il pourrait être utilisé contre des bunkers, des véhicules blindés, des nids de mitrailleuses ou des chars. Certaines copies du M1 ont été capturées par les forces allemandes rapidement après avoir été déployées et ont fait l'objet d'une ingénierie inverse pour créer le Panzerschreck. Le M1 coûte très peu et d'énormes quantités de munitions excédentaires ont été créées. Il a donc été utilisé dans les guerres futures et est encore utilisé aujourd'hui par les armées à petit budget. Au rythme actuel d'utilisation, l'arme continuera probablement à être combattue par des armées à petit budget. Cependant, avec le développement mondial entraînant une augmentation du nombre de PRI dédiés et les conflits actuels qui les épuisent, il est peu probable que cela se produise avant très longtemps."
 VIE_manpats_2: "M20A1 SuperBazooka"
 VIE_manpats_2_short: "M20A1 SuperBazooka"
 VIE_manpats_2_desc: "Le superbazooka M20A1 est la synthèse d'un grand nombre d'améliorations apportées au Bazooka par Edward Uhl tout au long de la guerre jusqu'au milieu des années 50. Il comportait des moulages légers, un support d'emplacement auxiliaire, un viseur optique, une portée étendue grâce à une munition améliorée, un mécanisme de couplage amélioré, une gâchette magnétique remplaçant l'allumage de la batterie, des meubles en métal et peut être démonté pour faciliter la mobilité et l'entretien. Les améliorations en ont fait une arme beaucoup plus performante que le M1, qui pourrait être utilisée contre des cibles plus puissantes. Il a été utilisé pendant la guerre de Corée et dans de nombreux autres conflits par d'autres pays."
 VIE_manpats_3: "LOI M72"
 VIE_manpats_3_short: "LOI M72"
 VIE_manpats_3_desc: "Le M72 LAW est un lance-roquettes antichar non guidé léger à un coup développé par FA Spinale, CB Weeks et PV Choate en 1963. Il a été introduit immédiatement pour remplacer le bazooka en production et a été combattu dans tous les conflits américains depuis sa création. L'arme elle-même est très légère et permet à l'infanterie régulière de la transporter et de l'utiliser partout où elle est nécessaire. Il n'est pas rechargeable mais ne pèse que 5,5 livres, donc même votre grand-mère pourrait l'utiliser. Sa portée effective est de 660 pieds. L'arme a été utilisée dans la guerre en Afghanistan, en Irak, en Somalie, dans la guerre du Golfe et au Vietnam."
 VIE_manpats_4: "ÉCLAIR M202"
 VIE_manpats_4_short: "ÉCLAIR M202"
 VIE_manpats_4_desc: "Le M202 FLASH est un lance-roquettes incendiaire multi-coups conçu en 1978 par une grande équipe ad hoc et utilisé dans la guerre du Vietnam. Il peut être chargé de roquettes incendiaires de 66 mm utilisant le TPA pour enflammer une zone après une explosion. Il peut brûler beaucoup plus chaud que le napalm et crée suffisamment de chaleur et de fumée pour forcer les hélicoptères volant à basse altitude à éviter une zone. Il peut être utilisé comme arme antichar en raison de l'énorme chaleur qu'il crée sur une vaste zone, rôtissant efficacement l'équipage d'un véhicule. Alternativement, le M202 peut utiliser les roquettes de 66 mm du LAW si l'opérateur en a besoin pour utiliser des roquettes directes plutôt que de couvrir une zone de feu. Il n'a pas été officiellement produit à grande échelle, bien que plusieurs centaines de prototypes aient été fabriqués et utilisés au Vietnam. "
 VIE_manpats_5: "M141/153 PETIT"
 VIE_manpats_5_short: "M141/153 PETIT"
 VIE_manpats_5_desc: "Le M153 SMAW est un lance-roquettes antichar et anti-fortification développé en 1984 par McDonnell Douglas. Cette arme a été utilisée lors de la guerre du Golfe, en Afghanistan, en Irak et au Yémen. Le M141 est une arme anti-fortification jetable à un coup dédiée à la destruction des bunkers. Elle a une portée effective de 1 200 mètres mais peut être utilisée pour atteindre de grandes cibles plus loin. Le M153 est une arme réutilisable qui tire des cartouches HEAA ou thermobariques. Le SMAW peut effondrer des bâtiments et possède un très grand rayon d'explosion. Cependant, il dégage une grande quantité de fumée semi-toxique, ce qui rend son tir à partir d'un espace clos dangereux sans protection contre les gaz. Ce problème ne sera pas résolu tant que le SMAW II ne sera pas développé. Il a été témoin de combats lors de la guerre du Golfe, en Afghanistan et en Irak."

 VIE_hmg_1: "M45 Quadmount"
 VIE_hmg_1_short: "M45 Quadmount"
 VIE_hmg_1_desc: "Le M45 Quadmount est une arme anti-aérienne remorquée dotée d'une cadence de tir exceptionnelle grâce à ses 4 mitrailleuses browning M2. Il est alimenté électriquement et a une portée maximale de 1,6 miles. Il a été développé par la WL Maxson Corporation en 1943 et a été utilisé pendant la Seconde Guerre mondiale, la guerre de Corée et comme emplacement pendant la guerre du Vietnam. Surnommé le « hachoir à viande », il pouvait être utilisé horizontalement pour éliminer de manière interchangeable des cibles souples et des avions. Le M45 était également monté sur des remorques ou des half-tracks pour être utilisé comme canon SP AA bon marché. "
 VIE_manpads_1: "Yeux rouges I"
 VIE_manpads_1_short: "Yeux rouges I"
 VIE_manpads_1_desc: "Le Redeye est un MANPADS anti-aérien créé en 1959 par Convair pour s'adapter aux combats modernes où les avions à réaction pouvaient distancer ou surpasser les canons anti-aériens. Il utilise l'infrarouge pour atteindre sa cible. En 1948, l'armée américaine commença à chercher de nouvelles armes de défense aérienne pour remplacer les canons inefficaces. De nombreux concepts différents de fusées rapides ont été étudiés, mais aucun n'était finalement précis. Au milieu des années 1950, Convair a commencé à étudier l'utilisation du guidage infrarouge pour créer un système de missile sol-air portable. Convair a commencé à étudier les premiers missiles air-air pour créer son arme et a réussi à la réduire à un niveau plus petit. Le Redeye a été utilisé au Vietnam, au Nicaragua et en Afghanistan."
 VIE_manpads_2: "Yeux rouges II"
 VIE_manpads_2_short: "Yeux rouges II"
 VIE_manpads_2_desc: "Le Redeye II est un MANPADS anti-aérien développé par General Dynamics en 1967. Il utilise un missile surface-air infrarouge pour se diriger vers sa cible. Il comportait un ordinateur haut de gamme et des améliorations générales des pièces et de la conception globale pour le rendre plus fiable. Bien que le Redeye II soit une amélioration par rapport au Redeye I, il n'a pas été largement fabriqué et est resté un prototype car la plupart de ses améliorations pouvaient simplement être ajoutées au Redeye I. On peut considérer que développer le Redeye II dans ce contexte améliore l'ordinateur du Redeye I et fabrique le meilleur équipement."
 VIE_manpads_3: "Stinger A"
 VIE_manpads_3_short: "Stinger A"
 VIE_manpads_3_desc: "Le Stinger A est le résultat final du projet Redeye II achevé en 1980 par General Dynamics. Le Stinger A présente une refonte complète de l'ensemble du système Redeye et est livré avec un double chercheur infrarouge et UV pour mieux déterminer ce qu'est une contre-mesure et quelle est la cible réelle. Les munitions du Stinger A contiennent un mélange plus puissant qui lui confère plus de puissance que son prédécesseur et peut atteindre une plus grande portée. Elle a démontré une puissance considérable dans la guerre des Malouines, en Afghanistan, dans la guerre irano-irakienne et dans de nombreux autres conflits du Moyen-Orient."
 VIE_manpads_4: "Stinger C"
 VIE_manpads_4_short: "Stinger C"
 VIE_manpads_4_desc: "Le Stinger C est une amélioration apportée au Stinger B terminé vers 1990 par General Dynamics. Le Stinger B était doté d'un autodirecteur amélioré doté d'un balayage en rosette. Cependant, la Stinger B n'a été produite qu'à peine à 600 exemplaires. Le Stinger C a ajouté davantage de composants informatiques, de meilleurs logiciels et un système adaptatif capable de tenter de surmonter les interférences en ajustant ses modules pour tenter de trouver le visuel le plus clair. Plus de 20 000 unités ont été créées et ont combattu en Afghanistan et en Irak. Le projet Stinger continue de se développer avec de nouveaux ajouts mineurs et de nouvelles variantes désignées comme améliorations mineures."

 VIE_protection_equip_1: "M12 + M1"
 VIE_protection_equip_1_short: "M12 + M1"
 VIE_protection_equip_1_desc: "Pendant la Seconde Guerre mondiale, le gilet pare-balles M12 était utilisé par les États-Unis comme pièce d'armure protectrice capable d'absorber les obus anti-aériens et de petit calibre. Cependant, c'était très encombrant et la plupart du temps, le seul uniforme d'un soldat était l'uniforme en fibre de coton Olive Drab. Malgré cela, le M12 a bien fonctionné pour protéger les soldats contre les éclats d'obus, à condition que les éclats d'obus n'atteignent pas le vaste espace que le gilet n'occupait pas./nLe casque M1 a été conçu en 1941 par le major Sydenham de l'armée américaine. Il était très efficace pour dévier les tirs vectoriels mais pas frontaux. Il a été largement utilisé pendant la Seconde Guerre mondiale et est devenu emblématique."
 VIE_protection_equip_2: "M1952A + M1A"
 VIE_protection_equip_2_short: "M1952A + M1A"
 VIE_protection_equip_2_desc: "Le M1952A est un gilet anti-aérien utilisé par les États-Unis pendant la guerre du Vietnam et développé en 1952. Il offrait une protection nominale contre les armes de faible calibre et la DCA. Le gilet est nominalement léger et comporte des poches intégrées pour transporter des munitions. Il a également été conçu, avec un succès limité, pour isoler de la chaleur. Le M1952A sera remplacé par le M1965A lorsque le kevlar sera inventé presque immédiatement. Le M1A est une amélioration par rapport au casque M1 avec des modifications mineures à l'intérieur du casque afin qu'il repose plus facilement sur la tête."
 VIE_protection_equip_3: "PASSÉ"
 VIE_protection_equip_3_short: "PASSÉ"
 VIE_protection_equip_3_desc: "PASGT est la désignation d'un ensemble de blindages développé pour l'infanterie américaine en 1975 par le US Army Soldier Systems Center. Il protège bien mieux l'infanterie que le M1965A, qu'il a remplacé. Incorporant plusieurs couches de nylon, le casque et le gilet PASGAT seraient complètement déployés d'ici 1983. Cependant, bien qu'il offre une meilleure protection, le PASGAT était extrêmement lourd, encombrant et très inconfortable à des températures extrêmes."
 VIE_protection_equip_4: "Intercepteur"
 VIE_protection_equip_4_short: "Intercepteur"
 VIE_protection_equip_4_desc: "Interceptor est la désignation de l'équipement de protection moderne utilisé par l'armée américaine. Il a été conçu par la DARPA en 1998 et cherchait à fournir une protection qui n'a pas été accordée à l'infanterie depuis que le blindage est devenu obsolète. Bien qu'elle ne soit pas aussi efficace contre les tirs d'armes à feu que l'armure de plaques l'était contre les épées. Le gilet pare-balles Interceptor se compose de l'OTV, du DAPS et du MICH. L'OTV est le gilet qui protège le cou, la gorge, les biceps et l'aine. Les auxiliaires peuvent être retirés de la protection du torse. L'OTV contient des plaques balistiques et des composés de nylon modernes qui peuvent protéger les soldats mieux que n'importe quelle armure antérieure. Le système est également doté de la capacité de protéger le soldat avec un mince gilet Flattening Load Carrier pour faciliter le transport de l'équipement. Les DAPS sont des manchons de protection auxiliaires destinés à protéger les jambes et les bras. Le MICH est un casque léger en kevlar doté de ports auxiliaires pour contenir différentes pièces d'équipement telles que des jumelles. "
 VIE_protection_equip_5: "ICTV + FICTION"
 VIE_protection_equip_5_short: "ICTV + FICTION"
 VIE_protection_equip_5_desc: "Le Gilet Tactique Combiné Amélioré et sa variante Forces Spéciales sont des ensembles théoriques d'équipements de protection individuelle destinés à remplacer l'Interceptor. Actuellement, la plupart des pièces sont en développement ou en phase conceptuelle. L'ICTV et le SFICTV ont commencé leur développement au début des années 2000 par divers fabricants, seul l'IOTV étant développé en 2007 et la série de casques actuellement en développement ou conceptuelle. L'ICTV devrait inclure un ensemble complet de gilets pare-balles protégeant la quasi-totalité du corps avec des espaces protégés par des couches de fibres imbriquées et des plaques métalliques légères. Le casque est livré avec une protection auditive et oculaire avec un support auxiliaire pour un masque à gaz d'assaut pare-balles et un support pour des jumelles. La variante SF est beaucoup plus légère avec une grande partie du placage réduit ou segmenté pour faciliter le mouvement. Une fois développé, il offrira une protection complète."

 ##GLORIOUS NIPPON STEEL FOLDED OVER 1000 TIMES
 JAP_infantry_equipment_0: "Howa Patern, fusil américain, calibre.30, M1"
 JAP_infantry_equipment_0_short: "M1 Garand (H)"
 JAP_infantry_equipment_0_desc: "Howa a fabriqué une copie du M1 Garand américain pour les forces d'autodéfense japonaises au début de la guerre froide, initialement pour fournir des armes à feu à la réserve de la police nationale nouvellement créée ou Keisatsu Yobita. En octobre 1952, elle fut élargie à 110 000 hommes et rebaptisée Force de sécurité nationale pour laquelle Howa, après la fin des programmes d'assistance militaire américains pour créer l'organisation initiale, serait responsable de l'entretien et de la production."

 JAP_infantry_equipment_1: "Modèle Howa, carabine américaine, calibre.30, U3 M1"
 JAP_infantry_equipment_1_short: "Carabine U3 M1 (H)"
 JAP_infantry_equipment_1_desc: "Howa a fabriqué une copie de la carabine U3 M1 pour les forces d'autodéfense japonaises au début de la guerre froide, initialement pour fournir des armes à feu à la réserve de la police nationale nouvellement créée ou Keisatsu Yobita. En octobre 1952, elle fut élargie à 110 000 hommes et rebaptisée Force de sécurité nationale pour laquelle Howa, après la fin des programmes d'assistance militaire américains pour créer l'organisation initiale, serait responsable de l'entretien et de la production."

 JAP_infantry_equipment_2: "Fusil de combat Howa Type 64"
 JAP_infantry_equipment_2_short: "Tapez 64"
 JAP_infantry_equipment_2_desc: "Le fusil de combat Howa Type 64 (Roku-yon-shiki-jidou-shoujuu) est un fusil de combat japonais utilisé exclusivement par les forces d'autodéfense japonaises et les garde-côtes japonais. Il s'agit d'une arme à feu sélective à gaz qui est chambrée pour la cartouche OTAN de 7,62 × 51 mm et utilise un chargeur amovible de 20 cartouches. Le Type 64 n'a jamais été exporté en raison des lois strictes du Japon sur l'exportation de matériel informatique."

 JAP_infantry_equipment_3: "Howa Type 80"
 JAP_infantry_equipment_3_short: "Tapez 80"
 JAP_infantry_equipment_3_desc: "Prototype expérimental de l'Armalite AR-18, le Type 80 n'a jamais été publié en dehors d'une utilisation de test limitée."

 JAP_infantry_equipment_4: "Howa Type 89"
 JAP_infantry_equipment_4_short: "Howa Type 89 "
 JAP_infantry_equipment_4_desc: "Le fusil d'assaut Howa Type 89 (89式小銃, hachi-kyu-shiki-shoju), appelé fusil d'assaut Type 89 de 5,56 mm (89式5,56 mm小銃, hachi-kyu-shiki-go-ten-go-roku-miri-shoju), est un fusil d'assaut japonais utilisé par les forces d'autodéfense japonaises, sur la côte japonaise. Les unités de l'équipe spéciale de sécurité de la garde et l'équipe spéciale d'assaut. Il n'a jamais été exporté hors du Japon en raison de sa politique stricte d'exportation de matériel informatique. Il est connu dans le service JGSDF sous le nom de Buddy."

 JAP_specialist_1: "Fusil de précision type 99"
 JAP_specialist_1_short: "Fusil de précision type 99"
 JAP_specialist_1_desc: "Le fusil de précision Type 99 (Kyukyu-shiki sogeki-ju) était un fusil de précision japonais utilisé pendant la Seconde Guerre mondiale. Il s'agissait d'une version tireur d'élite du fusil Type 99, chambré dans une cartouche de 7,7 × 58 mm. Il y avait quelques variantes du fusil de précision Type 99, certaines avec le verrou droit et la lunette montée sur le côté gauche du récepteur, ce qui permettait l'utilisation de pinces à dénuder. Une autre variante était celle avec un boulon plié et une lunette au-dessus du récepteur, ce qui obligeait le tireur d'élite à charger les cartouches une à la fois. Le canon plus court, combiné à la cartouche de plus gros calibre, rendait la dissimulation plus difficile que le fusil Type 97 qui le précédait, compte tenu du souffle de bouche et de l'éclair plus forts provoqués par la capacité accrue de poudre." # Kyūkyū-shiki sogeki-jū
 JAP_specialist_2: "M1D"
 JAP_specialist_2_short: "M1D"
 JAP_specialist_2_desc: "Le M1D est une variante sniper du M1 Garand. Dérivée du M1C plus complexe, la variante D utilisée utilisait un support Springfield Armory plus simple, à un seul anneau, fixé au canon plutôt qu'au récepteur."
 JAP_specialist_3: "Tireur d'élite désigné Howa Type 64"
 JAP_specialist_3_short: "Howa Type 64"
 JAP_specialist_3_desc: "Des optiques à longue portée (lunettes) peuvent être installées sur le fusil Type 64 afin qu'il puisse être déployé comme fusil de précision. La délivrance d'un fusil de précision de type 64 est généralement accordée à la personne possédant la compétence de tir la plus précise dans chaque division (un tireur d'élite désigné). Cependant, dans de nombreux cas, l'individu peut simplement recevoir une lunette pour l'utiliser uniquement lors d'exercices d'entraînement et de compétitions de tir, alors qu'aucun fusil spécifique n'est attribué à l'individu lui-même.\nLes optiques émises sont généralement réglées à un grossissement de 2,2 × et peuvent être soit une lunette de visée M84 de fusil de sniper M1C/D excédentaire utilisée par l'armée américaine pendant la Seconde Guerre mondiale, soit un modèle similaire produit par Nikon qui reproduit les niveaux de grossissement du M84. Les performances sont similaires à celles du fusil de précision M1C/D, mais il n'est possible de régler la lunette que pour visualiser des cibles à 500 mètres, bien que le bouton d'élévation soit étiqueté jusqu'à 800 mètres. De plus, le réticule de visée standard est un simple « T » noir, ce qui le rend extrêmement difficile à utiliser au crépuscule ou sur une cible noire.\nCertaines plaintes sérieuses concernant la précision de la version sniper sont liées au système de fixation de la lunette mal conçu. La lunette se met facilement de travers car elle n'est fixée qu'avec une seule vis. Une fois la lunette montée et la carabine mise à zéro, il est impératif de la manipuler avec précaution car elle est facilement bousculée. De plus, étant donné que la lunette n'est généralement pas attribuée à un fusil particulier, il est souvent difficile de la maintenir statique sur le récepteur d'un fusil particulier. Ceci est généralement corrigé en installant un morceau de tissu entre le récepteur et le support de lunette, mais les viseurs en fer du fusil sont alors obscurcis. Dans de tels cas, il est nécessaire d'installer un coussinet de joue pour aligner correctement l'oeil de l'utilisateur avec la lunette."
 JAP_specialist_5_short: "M24"
 #JAP_specialist_5_desc: ""

 #Australia
 AST_infantry_equipment_0: "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 AST_infantry_equipment_0_short: "SMLE n°4"
 AST_infantry_equipment_0_desc: "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 AST_infantry_equipment_1: "Fusil à chargement automatique L1A1"
 AST_infantry_equipment_1_short: "L1A1"
 AST_infantry_equipment_1_desc: "Le L1A1 est une version britannique du fusil de combat belge FN FAL. Il a été produit sous licence et a été utilisé dans de nombreux pays du Commonwealth. Le Royaume-Uni a produit sa propre variante du FN FAL intégrant les modifications développées par l'Allied Rifle Committee, le désignant le L1A1 Self Loading Rifle (SLR). Les armes ont été fabriquées par la Royal Small Arms Factory Enfield, Birmingham Small Arms, la Royal Ordnance Factory et le ROF Fazakerley. Après l'arrêt de la production, des composants de remplacement ont été fabriqués par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à 1994 environ, remplacé par le L85A1 à partir de 1985."

 AST_infantry_equipment_2: "Polymère de fusil à chargement automatique L1A1"
 AST_infantry_equipment_2_short: "L1A1(p)"
 AST_infantry_equipment_2_desc: "Version améliorée du C1."

 AST_infantry_equipment_3: "Steyr Août F88 Austeyr"
 AST_infantry_equipment_3_short: "F88 Austeyr"
 AST_infantry_equipment_3_desc: "Le fusil d'assaut F88 Austeyr est l'arme individuelle standard de l'ADF. Il est fabriqué sous licence de Steyr Mannlicher AG par Thales Australia et fourni aux forces armées australiennes et néo-zélandaises."

 AST_infantry_equipment_4: "Steyr Août F88SA1 Austeyr"
 AST_infantry_equipment_4_short: "F88SA1 Austeyr"
 AST_infantry_equipment_4_desc: "Le F88SA1 Austeyr est une variante du F88 Austeyr avec un rail Picatinny intégré à la place du viseur optique standard qui permet la fixation de divers autres dispositifs de visée (lunettes de vision nocturne, optiques grossies et non grossies comme l'ELCAN C79, le Trijicon ACOG ou l'Aimpoint)."

## Africa

 #DOC
 DOC_infantry_equipment_0: "Fabrique Nationale Modèle 1949"
 DOC_infantry_equipment_0_short: "FN-49"
 DOC_infantry_equipment_0_desc: "Avec une conception remontant au début des années 1930, le FN-49 est disponible à la fois comme fusil semi-automatique et comme fusil automatique à tir sélectif avec chargeurs de 10 cartouches.\nBien que bien considéré pour sa haute qualité de fabrication et sa fiabilité par rapport aux fusils de l'époque, sa valeur marchande était limitée, car il n'a pas été développé à temps pour être utilisé pendant la Seconde Guerre mondiale, mais plus tard, car de nombreuses armées avaient déjà commencé à passer aux fusils de combat à tir sélectif. Un nombre inconnu de FN-49 ont été produits comme fusils automatiques à tir sélectif, mais le petit chargeur de 10 cartouches limitait l'utilité de la fonction entièrement automatique."

 DOC_infantry_equipment_1: "Fabrique Nationale Fusil Automatique Léger"
 DOC_infantry_equipment_1_short: "FN FAL"
 DOC_infantry_equipment_1_desc: "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 DOC_infantry_equipment_2: "Avtomat Kalachnikova Modernizirovanniy"
 DOC_infantry_equipment_2_short: "AKM"
 DOC_infantry_equipment_2_desc: "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

 #Kenya
 KEN_infantry_equipment_0: "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 KEN_infantry_equipment_0_short: "SMLE n°4"
 KEN_infantry_equipment_0_desc: "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 KEN_infantry_equipment_1: "Fusil à chargement automatique L1A1"
 KEN_infantry_equipment_1_short: "L1A1"
 KEN_infantry_equipment_1_desc: "Le L1A1 est une version britannique du fusil de combat belge FN FAL. Il a été produit sous licence et a été utilisé dans de nombreux pays du Commonwealth. Le Royaume-Uni a produit sa propre variante du FN FAL intégrant les modifications développées par l'Allied Rifle Committee, le désignant le L1A1 Self Loading Rifle (SLR). Les armes ont été fabriquées par la Royal Small Arms Factory Enfield, Birmingham Small Arms, la Royal Ordnance Factory et le ROF Fazakerley. Après l'arrêt de la production, des composants de remplacement ont été fabriqués par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à 1994 environ, remplacé par le L85A1 à partir de 1985."

 KEN_infantry_equipment_2: "Heckler & Koch G3"
 KEN_infantry_equipment_2_short: "G3"
 KEN_infantry_equipment_2_desc: "Le G3 ou Gewehr 3 est un fusil de combat OTAN à tir sélectif de 7,62 × 51 mm développé dans les années 1950 par le fabricant d'armement allemand Heckler & Koch en collaboration avec l'agence publique espagnole de conception et de développement CETME."

 KEN_infantry_equipment_3: "Mitrailleuse à fusil automatique IMI Galil"
 KEN_infantry_equipment_3_short: "Galil ARM"
 KEN_infantry_equipment_3_desc: "À la fin des années 60 et au début des années 70, le principal fusil de combat de Tsahal, le Romat, a commencé à montrer ses faiblesses."

 KEN_infantry_equipment_4: "Carabine, calibre 5,56 mm, M4 "
 KEN_infantry_equipment_4_short: "Carabine M4"
 KEN_infantry_equipment_4_desc: "La carabine M4 est une nouvelle amélioration par rapport au M16A2. Il a été initialement commandé pour être conçu par une grande équipe ad hoc de concepteurs en 1984 et le développement s'est terminé en 1993. Après 9 ans de développement, j'espère que cela aurait valu la peine d'attendre. Il présente un plus grand niveau de fiabilité et est beaucoup plus léger et plus court. Principalement grâce à des matériaux améliorés, il est plus précis que le M16A2. Sa taille compacte le rend plus polyvalent et plus facile à utiliser que le M16A2. La carabine M4 a été utilisée lors de la guerre américaine en Afghanistan, de la guerre en Irak et de la guerre contre l'Etat islamique."

 INO_mbt_1: "M4A3 (75)W"
 INO_mbt_1_short: "M4 Sherman"
 INO_mbt_1_desc: "Le M4A3(75)W Sherman est un développement du M4 Sherman utilisé pendant la Seconde Guerre mondiale ainsi que lors des engagements d'après-guerre. Les M4A3(75)W Sherman en Indonésie étaient à l'origine utilisés par les Britanniques avant d'être remis aux Néerlandais. Après que l'Indonésie ait déclaré son indépendance le 17 août 1945, les Néerlandais les ont utilisés contre les forces indépendantistes indonésiennes jusqu'à ce que les Pays-Bas reconnaissent l'indépendance de l'Indonésie en 1949 après 4 ans de guerre intense. À la suite de négociations, les Pays-Bas ont fait don des M4A3(75)W à la nouvelle armée indonésienne. Les M4A3(75)W Sherman ont été utilisés jusqu'au début des années 1960 avec l'inauguration du bataillon de chars KKO du Corps des Marines indonésien, à l'époque le Korps Komando (KKO)."

 #Nepal
 NEP_infantry_equipment_0: "Fusil Gahendra"
 NEP_infantry_equipment_0_short: "Fusil Gahendra"
 NEP_infantry_equipment_0_desc: "Le fusil Gahendra est un fusil militaire à chargement par la culasse.577/450 Martini-Henry fabriqué par des armuriers de l'armée népalaise sous la direction du général Gehendra Shamsher JBR au début des années 1880.\nLa conception provient de versions modifiées de la conception brevetée de Westley Richards de 1869 et elle était connue comme le premier fusil domestique moderne du Népal."
 NEP_infantry_equipment_1: "Fusil Lee-Enfield"
 NEP_infantry_equipment_1_short: "Lee Enfield"
 NEP_infantry_equipment_1_desc: "Le Lee-Enfield est un fusil à répétition à verrou alimenté par chargeur qui a servi d'arme à feu principale des forces militaires de l'Empire britannique et du Commonwealth au cours de la première moitié du XXe siècle, et était le fusil de service standard de l'armée royale népalaise.\nLa conception comportait un chargeur de dix cartouches chargé manuellement avec la cartouche britannique.303 par le haut."
 NEP_infantry_equipment_2: "FN FAL"
 NEP_infantry_equipment_2_short: "FN FAL"
 NEP_infantry_equipment_2_desc: "Le FAL est un fusil de combat chambré en 7,62 × 51 mm OTAN conçu à l'origine en Belgique par Dieudonné Saive et fabriqué par FN Herstal et autres depuis 1953. \n\nLe premier fusil d'assaut de l'armée royale népalaise fut le FN FAL belge, qu'elle adopta en 1960 pour remplacer le vénérable Lee-Enfield."
 NEP_infantry_equipment_3: "Fusil Ishapore"
 NEP_infantry_equipment_3_short: "Ishapore 1A1"
 NEP_infantry_equipment_3_desc: "Le fusil 7,62 mm 1A1, ou Ishapore 1A1, est une copie du fusil à chargement automatique L1A1 et est produit à l'Ordnance Factory Tiruchirappalli de l'Ordnance Factories Board. Il diffère du SLR britannique en ce que la crosse en bois utilise la plaque de couche du Lee-Enfield avec un piège pour la bouteille d'huile et un passage de nettoyage, tout en copiant certains éléments des FAL métriques tels que le déverrouillage du boulon. \nLe fusil FN FAL a été remplacé en service dans l'armée royale népalaise par cette conception vers la fin des années 60."
 NEP_infantry_equipment_4: "Fusil INSAS"
 NEP_infantry_equipment_4_short: "INSASS"
 NEP_infantry_equipment_4_desc: "L'INSAS (Indian Small Arms System) est un modèle de fusil d'assaut indien national influencé par les succès de la famille des fusils AK. Ces armes ont été développées en Inde par l'établissement de recherche et de développement de l'armement et fabriquées par l'Ordnance Factories Board dans ses différentes usines.\n\nL'armée royale népalaise a commencé à recevoir ces fusils dans les années 80 en raison des liens étroits entre les deux armées."
 
 TIB_infantry_equipment_0: "Fusil Lee-Enfield"
 TIB_infantry_equipment_0_short: "Lee Enfield"
 TIB_infantry_equipment_0_desc: "Le Lee-Enfield est un fusil à répétition à verrou alimenté par chargeur qui a servi de principale arme à feu des forces militaires de l'armée tibétaine pendant la première moitié du XXe siècle après leur déclaration d'indépendance et une coopération plus étroite avec l'Empire britannique suite à la Convention de Simla.\nLa conception comportait un chargeur de dix cartouches chargé manuellement avec la cartouche britannique.303 par le haut."
 TIB_infantry_equipment_1: "Pistolet Sten"
 TIB_infantry_equipment_1_short: "STÈNE"
 TIB_infantry_equipment_1_desc: "Le STEN (ou pistolet Sten) est une mitraillette britannique chambrée en 9 × 19 mm qui a été largement utilisée par l'armée tibétaine après la Seconde Guerre mondiale après qu'un grand nombre d'entre elles aient été importées au Tibet en 1950. \nLe Sten associait une conception simple à un faible coût de production, facilitant la production de masse pour répondre à la demande de mitraillettes."
 TIB_infantry_equipment_2: "FN FAL"
 TIB_infantry_equipment_2_short: "FN FAL"
 TIB_infantry_equipment_2_desc: "Le FAL est un fusil de combat chambré en 7,62 × 51 mm OTAN conçu à l'origine en Belgique par Dieudonné Saive et fabriqué par FN Herstal et autres depuis 1953. \n\nLe premier fusil d'assaut de l'armée tibétaine fut le FN FAL belge, qu'elle adopta en 1960 pour remplacer les canons Sten et Lee-Enfield vieillissants."  
 TIB_infantry_equipment_3: "Armalite Ar-10"
 TIB_infantry_equipment_3_short: "AR-10"
 TIB_infantry_equipment_3_desc: "L'ArmaLite AR-10 est un fusil de combat OTAN de 7,62 × 51 mm conçu par Eugene Stoner à la fin des années 1950 et fabriqué par ArmaLite (alors une division de Fairchild Aircraft Corporation). \n\nL'AR-10 est un modèle de fusil d'assaut innovant introduit en 1956 et adopté par l'armée tibétaine dans les années 1960 après le début de relations diplomatiques plus étroites avec les États-Unis en réponse aux conflits du communisme et de la guerre froide."
 TIB_infantry_equipment_4: "RMM-90"
 TIB_infantry_equipment_4_short: "RMM-90"
 TIB_infantry_equipment_4_desc: "Le RRMM-90 est un fusil d'assaut tibétain basé sur l'ArmaLite AR-18 produit par l'arsenal de Lhassa depuis les années 1980 pour l'armée tibétaine. \n\nIl s'agit d'un fusil d'assaut à gaz chambré pour des munitions OTAN de 5,56 × 45 mm et a été modifié pour pouvoir fonctionner dans des environnements montagneux à haute altitude et influencé par des conceptions britanniques telles que le SA80."

 #PHU DAI
 PQC_infantry_equipment_0: "Fusil de type Chiang Kai-shek"
 PQC_infantry_equipment_0_short: "Tapez 24"
 PQC_infantry_equipment_0_desc: "Le fusil Type Chiang Kai-shek, également connu sous le nom de fusil Zhongzheng/Jiang Jieshi (selon la romanisation du chinois), fusil Generalissimo et Type 24, du nom du généralissime chinois Chiang Kai-shek, était une copie fabriquée en Chine du fusil allemand Standardmodell, le précurseur du Karabiner 98k."

 PQC_infantry_equipment_1: "Fusil américain, calibre 7,62 mm, M14"
 PQC_infantry_equipment_1_short: "M14"
 PQC_infantry_equipment_1_desc: "Le M14 ou officiellement connu sous le nom de United States Rifle, calibre 7,62 mm, M14 est un fusil de combat américain chambré en 7,62x51 mm OTAN. Il est devenu le fusil standard de l'armée américaine en 1959, remplaçant le fusil M1 Garand dans l'armée américaine en 1958 et le Corps des Marines des États-Unis en 1965. C'était le dernier fusil de combat américain distribué en quantité au personnel militaire américain. La puissance de la cartouche OTAN de 7,62 × 51 mm lui a permis de bien pénétrer la couverture et d'atteindre une portée étendue. Il a servi principalement dans de nombreuses guerres en Indochine, mais son principal point culminant a été pendant la guerre du Vietnam. Après son remplacement par le M16, il fut exporté vers de nombreux membres."

 PQC_infantry_equipment_2: "Arsenal d'État de la République de Chine Fusil de combat type 57"
 PQC_infantry_equipment_2_short: "T57"
 PQC_infantry_equipment_2_desc: "Une République de Chine a produit une variante du fusil M14. Le M14 ou officiellement connu sous le nom de United States Rifle, calibre 7,62 mm, M14 est un fusil de combat américain chambré en 7,62x51 mm OTAN."

 PQC_infantry_equipment_3: "Commandement logistique combiné Type 65"
 PQC_infantry_equipment_3_short: "T65"
 PQC_infantry_equipment_3_desc: "Le T65 est un fusil développé et fabriqué par le commandement logistique combiné des forces armées de la République de Chine à Taiwan. Initialement calqué sur l'Armalite AR-18 doté d'un système de gaz à course courte, le prototype dévoilé en 1975 montrait un fusil fortement influencé par la famille de fusils AR-15, bien qu'avec des viseurs en fer modifiés, une crosse remodelée et des protège-mains redessinés."

 PQC_infantry_equipment_4: "Commandement logistique combiné type 65K2"
 PQC_infantry_equipment_4_short: "T65K2"
 PQC_infantry_equipment_4_desc: "Une mise à niveau de la famille de fusils T65. La conception T65 a remplacé la poignée de transport des fusils de modèle M16 par un bloc de visée arrière. La poignée de transport est revenue avec le T65K2 (mais était amovible sur la carabine T91). Le T65 utilise des chargeurs compatibles avec les fusils de modèle AR-15."
 
 #Commie Burma
 BCP_infantry_equipment_0: "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 BCP_infantry_equipment_0_short: "SMLE n°4"
 BCP_infantry_equipment_0_desc: "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 BCP_infantry_equipment_1: "Avtomat Kalachnikova 1947"
 BCP_infantry_equipment_1_short: "AK-47"
 BCP_infantry_equipment_1_desc: "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 BCP_infantry_equipment_2: "Fusil d'assaut ZB-63"
 BCP_infantry_equipment_2_short: "ZB-63"
 BCP_infantry_equipment_2_desc: "Le ZB-63 est un fusil d'assaut automatique conçu par l'Arsenal du gouvernement de la RPC en 1963. Il a été utilisé au Vietnam, au Cambodge, en Afghanistan, au Kosovo et aux Touareg. L'arme comporte un mécanisme interne similaire à celui de l'AK et un mécanisme externe et un boîtier similaires à ceux du SKS. Cela permet à l'arme de faire un compromis entre la portée et la puissance de feu automatique, ce qui la rend comparable à un ZB-56 à longue portée. L'arme a une portée de tir efficace deux fois supérieure à celle du SKS et une cadence de tir légèrement supérieure à celle du ZB-56. L'arme est très fiable et son prix est modeste. Au cours des 10 années de fabrication, plus d'un million de fusils ont été fabriqués."

 BCP_infantry_equipment_3: "Fusil d'assaut ZB-81"
 BCP_infantry_equipment_3_short: "ZB-81"
 BCP_infantry_equipment_3_desc: "Le ZB-81 est un fusil d'assaut automatique qui peut être modifié en une variété d'armes conçues par Norinco en 1981. Il a été témoin de tous les conflits sino-chinois depuis sa création, notamment la guerre sino-vietnamienne, l'Afghanistan et le Sri Lanka. Le ZB-81 est une amélioration basée sur le ZB-63 mais n'a pas la même portée efficace. L'arme elle-même a plus de puissance de feu que le ZB-63 et intègre une variété d'éléments du Dragunov, du SKS et de l'AK47. De plus, sa durée de vie est plus longue que l'AK47. De plus, l'arme prend en charge les fixations sous le canon."

 BCP_infantry_equipment_4: "Fusil automatique QBZ-95"
 BCP_infantry_equipment_4_short: "QBZ-95"
 BCP_infantry_equipment_4_desc: "Le QBZ-95 est un fusil bullpup léger automatique moderne conçu par Duo Yingxian en 1991. L'arme a été utilisée au Pakistan et en Birmanie. Le QBZ-95 présente une portée similaire à celle du ZB-81 mais avec une puissance de feu bien plus élevée et une cadence de tir plus élevée. L'arme a été conçue pour remplacer le ZB-81 par un mécanisme bullpup permettant de raccourcir le fusil et de faciliter son rechargement. Le fusil utilise des matériaux polymères pour sa structure, un boulon rotatif et possède un piston à course courte. Il résiste à la corrosion et aux intempéries, ce qui le rend bien adapté à une utilisation sur des terrains extrêmes."
