 CAN_iw_armored_vehicles_desc:0 "Les Forces armées canadiennes (FAC) sont l'armée unifiée du Canada, comprenant des éléments maritimes, terrestres et aériens appelés la Marine royale canadienne, l'Armée canadienne et l'Aviation royale canadienne."
