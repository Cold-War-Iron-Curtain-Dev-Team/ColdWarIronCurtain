 POR_lt_equipment_3: "Panhard EBR"
 POR_lt_equipment_3_short: "Panhard EBR"
 POR_lt_equipment_3_desc: "Le Panhard EBR (Panhard Engin Blindé de Reconnaissance, français; Véhicule blindé de reconnaissance) est une voiture blindée conçue par Panhard pour l'armée française et utilisée plus tard dans le monde entier, notamment par l'armée française pendant la guerre d'Algérie et l'armée portugaise pendant la guerre coloniale portugaise en Angola, au Mozambique et en Guinée-Bissau."
 POR_lt_equipment_4: "Panhard AML-60"
 POR_lt_equipment_4_short: "AML-60"
 POR_lt_equipment_4_desc: "Connu plus formellement sous le nom d'AML HE 60-7, ou sous le code de son fabricant AML-245B, l'AML-60 était le modèle de production initial de Panhard et comprenait une tourelle arrondie avec des mitrailleuses jumelées de 7,62 mm à gauche et un mortier de 60 mm chargé par la culasse à droite, avec 3 800 cartouches stockées de munitions de 7,62 mm et 43 à 53 projectiles de mortier, respectivement."
 POR_lt_equipment_5: "Bravia Chaimité V-400"
 POR_lt_equipment_5_short: "V-400"
