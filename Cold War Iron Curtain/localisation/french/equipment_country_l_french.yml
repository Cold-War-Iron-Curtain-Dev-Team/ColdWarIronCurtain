 SPR_mechanized_marine_equipment_1: "Buffle d'eau LVT-4"
 SPR_mechanized_marine_equipment_1_short: "LVT-4"
 SPR_mechanized_marine_equipment_1_desc: "Le LVTP-4 est un véhicule d'atterrissage amphibie conçu par Ford Machinery Corporation au début des années 40. Le LVTP-4 a été utilisé pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Il utilise un moteur radial à 7 cylindres W-670-9A et peut parcourir jusqu'à 75 miles dans l'eau à 7 mph. Evolution du LVTP-1, le LVTP-4 est capable de parcourir des distances incroyables, bien qu'à des vitesses lentes. Si vous devez traverser 70 milles d'eau et disposer d'environ 10 heures pour le faire, le LVTP-4 est votre véhicule de choix. Il est capable de transporter des troupes ou des véhicules. "
 SPR_mechanized_marine_equipment_2: "LVT(A)-5"
 SPR_mechanized_marine_equipment_2_short: "LVT(A)-5"
 SPR_mechanized_marine_equipment_2_desc: "LVT(A)-4 avec une tourelle motorisée et un gyrostabilisateur pour l'obusier. Certains ont été améliorés à la fin des années 1940 en modifiant la configuration du blindage."
