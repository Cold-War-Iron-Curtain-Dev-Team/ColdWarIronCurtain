 JAP_medium_tank_destroyer_equipment_5_desc:0 "Le véhicule de combat manœuvrable de type 16 (16, Hitoroku shiki kidō sentōsha) est un véhicule blindé à roues de la Force terrestre d'autodéfense japonaise."
