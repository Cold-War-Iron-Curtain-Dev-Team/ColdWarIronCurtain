 AST_lt_equipment_2_short: "M24 Chaffee"
 AST_lt_equipment_3: "Char de combat, entièrement chenillé, canon de 76 mm, M41"
 AST_lt_equipment_3_short: "M41 Walker Bulldog"
 AST_lt_equipment_3_desc: "Le M41 est un char de reconnaissance léger développé par Cadillac en 1949. Il a combattu au Vietnam, dans la Baie des Cochons, au Liban et en Somalie. Son blindage varie de 19 mm à 31,7 mm. Il est armé d'un canon principal de 76 mm, d'une mitrailleuse coaxiale de calibre.30 et d'un canon de toit de calibre.50. Il utilise un moteur essence Continental 6 cylindres et fonctionne jusqu'à 45 mph avec une autonomie opérationnelle de 100 miles. Le développement du M41 progressait lentement avec peu de financement, mais lorsque la guerre de Corée a éclaté, l'armée américaine a commencé à précipiter le programme. La précipitation a causé un grand nombre de problèmes dans le programme et des problèmes de taille excessive. Le M41, en raison de graves problèmes liés à la précipitation du programme, a été produit pendant très peu de temps et n'a pas été utilisé pendant la guerre de Corée. En fait, la production n'a démarré qu'en 1951 et n'a duré que 3 ans."
 AST_lt_equipment_4: "Porte-avions, appui-feu, tourelle Saladin M113A1 (FS) à chenilles complètes"
 AST_lt_equipment_4_short: "M113A1 FSV"
 AST_lt_equipment_4_desc: "Une variante M113 équipée de la tourelle du véhicule blindé Alvis Saladin. Le FSV a été introduit dans les unités de l'armée australienne au milieu des années 1960 suite au retrait des Saladins et était armé d'un canon de 76 mm, d'une mitrailleuse coaxiale de calibre.30 et d'une mitrailleuse de calibre.30 montées sur le toit de la tourelle du véhicule."
 AST_lt_equipment_5: "Porte-avions, appui-feu, tourelle Scorpion Full Track M113A1 (FS)"
 AST_lt_equipment_5_short: "M113A1 MRV"
 AST_lt_equipment_5_desc: "Variante australienne similaire au M113 FSV, mais utilisant la tourelle du char léger FV101 Scorpion, au lieu de l'ancienne tourelle du véhicule blindé Saladin, que le FSV utilisait auparavant. Cette tourelle était équipée d'un viseur intensificateur d'image pour l'armement principal. Ce viseur II était le premier viseur nocturne passif efficace installé sur un AFV australien, donnant aux MRV une capacité de combat de nuit dépassant le Leopard AS1 et tous les autres AFV australiens de l'époque."
 AST_lt_equipment_6: "Porte-avions, appui-feu, tourelle Scorpion Full Track M113A2+ (FS)"
 AST_lt_equipment_6_short: "M113A2+ MRV"
 AST_lt_equipment_6_desc: "Variante australienne similaire au M113 FSV, mais utilisant la tourelle du char léger FV101 Scorpion, au lieu de l'ancienne tourelle du véhicule blindé Saladin, que le FSV utilisait auparavant. Cette tourelle était équipée d'un viseur intensificateur d'image pour l'armement principal. Ce viseur II était le premier viseur nocturne passif efficace installé sur un AFV australien, donnant aux MRV une capacité de combat de nuit dépassant le Leopard AS1 et tous les autres AFV australiens de l'époque."


