 SOV_mbt_equipment_0:0 "T-34-85"
 SOV_mbt_equipment_0_short:0 "T-34-85"
 SOV_mbt_equipment_0_desc:0 "Le T-34 est un char moyen soviétique qui a révolutionné le domaine de la conception des chars et qui est réputé pour sa fiabilité. Le T-34 a été conçu en 1940 par KMBD en Union soviétique. Afin de réduire les coûts, un blindage incliné a été intégré à la conception du char. Cependant, cela a également permis d'améliorer considérablement la protection du char et de réduire son coût grâce à une surface plus petite. L'arme elle-même est un canon de 76,2 mm et avait une capacité nominale de transport de munitions. Cependant, les viseurs et les dispositifs de vision étaient particulièrement médiocres, ce qui rendait leur utilisation difficile pour les commandants de chars, et leur faible capacité de coordination réduisait considérablement les avantages offerts par le char lui-même. Le T-34 est devenu le deuxième char le plus produit au monde, mais l'un des plus importants de la Seconde Guerre mondiale. Les T-34 sont encore utilisés aujourd'hui par les insurgés et les pays pauvres."
 SOV_mbt_equipment_1:0 "T-44"
 SOV_mbt_equipment_1_short:0 "T-44"
 SOV_mbt_equipment_1_desc:0 "Le T-44 est un char soviétique moyen fabriqué vers la fin de la Seconde Guerre mondiale. Il offrait une meilleure mobilité et un blindage plus résistant, ainsi qu'un canon principal plus lourd de 85 mm. Il a été conçu par AA Morozov en 1944, mais peu d'exemplaires ont été construits, car ce char était considéré comme trop coûteux par rapport aux avantages qu'il offrait. Seuls 2 000 exemplaires ont été construits avant que la production ne revienne au T-34."
 SOV_mbt_equipment_2:0 "T-54"
 SOV_mbt_equipment_2_short:0 "T-54"
 SOV_mbt_equipment_2_desc:0 "Le char T-54 est le char le plus produit de l'histoire. Il a été conçu en 1946 par KMBD. Il est équipé d'un canon rayé de 100 mm et dispose d'un blindage dont l'épaisseur varie entre 205 mm et 60 mm. Il est équipé d'un moteur diesel V-12 de 38,88 litres et d'une suspension à barres de torsion, et peut atteindre une vitesse maximale de 48 km/h. Ce char a été utilisé par plus de 50 armées à travers le monde et a été produit dans toute la sphère d'influence soviétique, où il a participé à tous les conflits."
 SOV_mbt_equipment_3:0 "T-55"
 SOV_mbt_equipment_3_short:0 "T-55"
 SOV_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui dotant d'un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même des équipements auxiliaires supplémentaires, tels qu'un système de contrôle de tir et des optiques améliorés. De plus, le T-55 utilisait plus souvent le canon lourd DShK 12,7, tandis que le T-54 utilisait le canon SGMT 7,62, ce qui lui conférait une plus grande puissance de feu, mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement participé à tous les conflits auxquels le T-54 a pris part."
 SOV_mbt_equipment_4:0 "T-62"
 SOV_mbt_equipment_4_short:0 "T-62"
 SOV_mbt_equipment_4_desc:0 "Le T-62 est une version améliorée du char T-55. Le T-62 est équipé d'un canon à âme lisse et d'un blindage légèrement plus épais. Le calibre du canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a achevé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, sa production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et il a été largement utilisé au combat dans toute la sphère soviétique, mais il a surtout été utilisé dans des conflits au Moyen-Orient. Ses améliorations ont démontré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique."
 SOV_mbt_equipment_5:0 "T-64A"
 SOV_mbt_equipment_5_short:0 "T-64A"
 SOV_mbt_equipment_5_desc:0 "Le T-64 est un char de combat principal soviétique qui a bénéficié de nombreuses modernisations par rapport au T-62 et qui peut être considéré comme la continuation des améliorations apportées entre le T-55 et le T-62. Il est équipé d'un moteur plus compact, d'un blindage composite, d'auxiliaires moteur améliorés et d'un canon principal de 125 mm avec chargeur automatique. Conçu en 1962 par KMBD, ce char présentait de nombreuses améliorations par rapport à son prédécesseur, mais à un coût nettement plus élevé. Le moteur était un moteur diesel 5 cylindres 5TDF qui offrait une plus grande autonomie et des vitesses plus élevées. Il était destiné à être mis au rebut, mais a été maintenu en production grâce à l'influence politique de son concepteur en chef. Alexander Morozov, le concepteur en chef, a fait valoir que malgré son coût, il s'agissait d'une conception nettement supérieure qui en valait la peine. Cela ne s'est pas avéré être le cas lors de la guerre dans le Donbass et de la guerre en Transnistrie. Il a été remplacé par le T-72, beaucoup plus rentable."
 SOV_mbt_equipment_6:0 "T-72"
 SOV_mbt_equipment_6_short:0 "T-72"
 SOV_mbt_equipment_6_desc:0 "Le T-72 est un char de combat principal soviétique créé comme une nouvelle génération de chars, principalement pour remplacer le T-62 et son homologue coûteux, le T-64. Il coûtait près de moitié moins cher que le T-64 et présentait de nombreuses améliorations. Sa conception a été achevée en 1973 par Leonid Venediktov et démontrait des capacités incroyables. Le canon et le blindage étaient toujours respectivement de 125 mm et composites, mais avec une conception beaucoup plus économique et plus facile à produire. Le moteur est un V-12 de 780 ch qui a pu être ultérieurement remplacé par un modèle de 1130 ch. Le char pouvait atteindre une mobilité incroyable avec une vitesse de 80 km/h et s'adaptait mieux aux terrains difficiles que le T-64. Contrairement au T-64, il a été utilisé dans tous les conflits de la sphère soviétique, où il a également démontré des capacités incroyables. Le char a également été largement utilisé dans des conflits hors de la sphère soviétique, en Afrique, au Moyen-Orient et en Indochine."
 SOV_mbt_equipment_7:0 "T-80U"
 SOV_mbt_equipment_7_short:0 "T-80U"
 SOV_mbt_equipment_7_desc:0 "Le T-80 est un char de combat principal soviétique conçu selon la doctrine de haute mobilité établie par le T-72. Le KMBD a commencé à le concevoir en 1964 et l'a achevé en 1975 après 11 ans de travail. La coque elle-même est constituée d'un blindage composite amélioré et épaissi et est équipée d'un canon à âme lisse amélioré. Il peut également être équipé d'un armement à roquettes pour une puissance de feu accrue. Il a une portée plus courte que le T-72 et une vitesse légèrement inférieure, malgré une transmission et un moteur à turbine à gaz plus avancés. Il a été utilisé lors des guerres de Tchétchénie et de la guerre du Donbass, mais n'a pas été aussi largement utilisé que le T-72."
 SOV_mbt_equipment_8:0 "T-90"
 SOV_mbt_equipment_8_short:0 "T-90"
 SOV_mbt_equipment_8_desc:0 "Après l'échec du T-80 à remplacer le T-72 ou à démontrer des capacités nettement supérieures, Kartsev-Venediktov a cherché à améliorer encore le char et à lui conférer des capacités supérieures à celles du T-80. La conception a été achevée vers 1990. Le moteur a été remplacé par un moteur diesel 12 cylindres, plus lent que celui du T-80, mais doté d'une puissance de feu beaucoup plus élevée. Le canon a été modernisé, le système de contrôle de tir amélioré, le blindage considérablement renforcé et de nombreux équipements auxiliaires ont été ajoutés, notamment un brouilleur ATGM et des lance-fumigènes. Il a été utilisé au combat au Daghestan et dans le Donbass."
 SOV_mbt_equipment_9:0 "T-84N"
 SOV_mbt_equipment_9_short:0 "T-84N"
 SOV_mbt_equipment_9_desc:0 "Les travaux de modernisation du char T-80UD ont débuté en 1992. Le T-84N est équipé d'une nouvelle jupe latérale blindée, d'une nouvelle tourelle soudée avec un chargeur automatique dans la niche arrière, d'un nouveau blindage réactif, d'un groupe auxiliaire de puissance (APU), d'un viseur thermique, d'un système de navigation par satellite, d'un télémètre laser pour le commandant et d'autres améliorations."
