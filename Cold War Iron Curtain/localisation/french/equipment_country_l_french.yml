 JAP_medium_tank_destroyer_equipment_2_desc: "Le canon sans recul automoteur de 106 mm de type 60 (60, roku-maru-shiki-jisou-muhandou-hou) est un véhicule antichar léger développé par le Japon à la fin des années 1950. Il est équipé de deux fusils sans recul M40 de 106 mm comme armement principal."
 JAP_medium_tank_destroyer_equipment_3: "Mitsubishi Type 73 106mm AR"
