 FRA_lt_equipment_4_short:0 "E.B.R. Mle 63"
 FRA_lt_equipment_5:0 "AMX-10RC"
 FRA_lt_equipment_5_short:0 "AMX-10RC"
 FRA_lt_equipment_5_desc:0 "L'AMX 10RC est un véhicule de reconnaissance à roues de poids moyen équipé d'un canon de 105 mm. Fourni par Nexter Systems, ce véhicule est en service dans l'armée française depuis 1980. Il nécessite un équipage de 4 personnes et pèse environ 15 tonnes."
