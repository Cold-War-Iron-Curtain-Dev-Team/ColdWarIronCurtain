 VIE_artillery_equipment_1: "Luu-phao 105 ans Mau 1935"
 VIE_artillery_equipment_1_short: "Luu-phao 105"
 VIE_artillery_equipment_1_desc: "Le Canon de 105 mm court modèle 1935 Bourges était un obusier à champ court de conception française développé entre les deux guerres mondiales par l'Arsenal de Bourges. Compact et très mobile, il était destiné au soutien de l'artillerie divisionnaire, offrant un équilibre entre puissance de feu, facilité de déploiement et transportabilité. Il tirait des obus explosifs de 105 mm et avait une portée maximale d'environ 10 700 mètres. Le canon était utilisé par un équipage de sept personnes et était apprécié pour sa simplicité, sa durabilité et sa rapidité d'installation sur le terrain. Suite à sa constitution progressive sous les auspices de l'Union française lors de la première guerre d'Indochine, l'Armée Nationale Vietnamienne (ANV), fidèle au chef de l'État Bao-dai, intègre le Canon de 105 mm court modèle 1935 dans ses régiments d'artillerie. Ces armes ont été transférées des dépôts coloniaux français aux unités vietnamiennes dans le cadre des efforts de la France visant à « vietnamienner » le conflit et à construire une armée indigène crédible, capable de contrer le Viet-minh."
